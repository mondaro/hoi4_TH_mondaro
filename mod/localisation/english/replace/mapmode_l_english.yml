 MAPMODE_DIPLOMACY_NAME: "การทูต"
 MAPMODE_DIPLOMACY: "โหมดแผนที่ §Hการทูต§!"
 MAPMODE_DIPLOMACY_DESCRIPTION: "แสดงความสัมพันธทางการทูตและทาทีตอประเทศที่เลือกอยูในปจจุบัน"
 MAPMODE_SUPPLY_AREAS_NAME: "พื้นที่เสบียง"
 MAPMODE_SUPPLY_AREAS: "โหมดแผนที่ §Hพื้นที่เสบียง§!"
 MAPMODE_SUPPLY_AREAS_DESCRIPTION: "แสดงพื้นที่เสบียงและขอมูลการไหลเวียนของเสบียง ชวยใหคุณระบุพื้นที่ที่มีปญหาและจุดคอขวดได"
 MAPMODE_SUPPLY_MAP_MODE_NAME: "เสบียง"
 MAPMODE_SUPPLY_MAP_MODE: "โหมดแผนที่ §Hเสบียง§!"
 MAPMODE_SUPPLY_MAP_MODE_DESCRIPTION: "แสดงสถานการณเสบียงในปจจุบัน พื้นที่สีเขียวสวางเขาถึงเสบียงไดมากกวา สวนสีมวงเขาถึงไดนอยที่สุด พื้นที่ที่หนวยกําลังขาดเสบียงจะแสดงสีตั้งแต §Yเหลือง§! ไปจนถึง §Rแดง§!"
 MAPMODE_STRATEGIC_NAVY_NAME: "กองทัพเรือเชิงยุทธศาสตร"
 MAPMODE_STRATEGIC_NAVY: "โหมดแผนที่ §Hกองทัพเรือเชิงยุทธศาสตร§!"
 MAPMODE_STRATEGIC_NAVY_DESCRIPTION: "แสดงพื้นที่ยุทธศาสตรและใหคุณเห็นวากองเรือของคุณกําลังดําเนินปฏิบัติการทางเรือใดอยู \nภูมิภาคที่คุณมีความเหนือกวาทางทะเลจะแสดงดวยเสนขอบ §Gสีเขียว§! \nพื้นที่ลายทาง §Rสีแดง§! อยูนอกระยะปฏิบัติการของกองเรือที่เลือกอยู"
 MAPMODE_STRATEGIC_AIR_NAME: "กองทัพอากาศเชิงยุทธศาสตร"
 MAPMODE_STRATEGIC_AIR: "โหมดแผนที่ §Hกองทัพอากาศเชิงยุทธศาสตร§!"
 MAPMODE_STRATEGIC_AIR_DESCRIPTION: "แสดงพื้นที่ยุทธศาสตรและใหคุณเห็นวาเครื่องบินของคุณกําลังดําเนินปฏิบัติการทางอากาศใดอยู \n§Gภูมิภาคสีเขียว§! คือฝายเรามีความเหนือกวาทางอากาศ §Rภูมิภาคสีแดง§! คือขาศึกมีความเหนือกวาทางอากาศ \nสนามบินที่มีเครื่องบินของคุณประจําอยูจะถูกเนนไว"
