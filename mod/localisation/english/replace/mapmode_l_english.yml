 MAPMODE_DEFAULT_DESCRIPTION: "มุมมองประเทศและการรบภาคพื้นดิน\nจังหวัดจะมีสีตามผูที่ควบคุมอยูในปจจุบัน\nมีประโยชนสําหรับติดตามความคืบหนาของสงคราม รวมถึงการสรางและดําเนินแผนการรบ"
