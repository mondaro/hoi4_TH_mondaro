 category_self_propelled_anti_air_regimental_support: "ปนตอสูอากาศยานอัตตาจรสนับสนุนระดับกรม"
 category_regimental_support_artillery: "ปนใหญทหารราบและหนวยปนใหญจรวด"
 jungle_pioneers_support: "กองรอยทหารชางบุกเบิกปา"

 sturmtruppe_battalion: "กองพันสโตสทรุพเพิน"
 sturmtruppe_battalion_desc: "หนวยทหารราบชั้นยอดที่ไดรับการฝกและติดอาวุธใหปฏิบัติการเปนกองพันจูโจมขึ้นสมทบกับกองพลทั่วไป"
 

 assault_engineer: "กองรอยทหารชางจูโจม"
 assault_engineer_desc: "ทหารชางจูโจมเชี่ยวชาญการเจาะทะลวงที่มั่นซึ่งมีปอมปราการ โดยผสานความชํานาญดานวัตถุระเบิดเขากับการปองกันดวยยานเกราะ ทําใหคงความคลองตัวและสรางปอมปราการไดแมในสภาพแวดลอมที่เปนปฏิปกษที่สุด"
 armored_engineer: "กองรอยทหารชางยานเกราะ"
 armored_engineer_desc: "ยานพาหนะอเนกประสงคที่ติดตั้งอุปกรณสําหรับสรางปอมปราการ เคลียรสิ่งกีดขวาง และเพิ่มความคลองตัวในสนามรบภายใตสภาวะการรบ"
 armored_maintenance: "กองรอยซอมบํารุงยานเกราะ"
 armored_maintenance_desc: "ยานพาหนะเฉพาะทางที่ออกแบบมาเพื่อกูและซอมรถถังและยานเกราะอื่น ๆ ที่เสียหายไดโดยตรงในสนามรบ"
 armored_signal: "กองรอยสื่อสารยานเกราะ"
 armored_signal_desc: "ยานพาหนะเฉพาะทางที่ชวยการบังคับบัญชาและการประสานงานในสนามรบ ติดตั้งระบบสื่อสารขั้นสูงเพื่อสั่งการปฏิบัติการจากแนวหนา"
 motorized_military_police: "สารวัตรทหารยานยนต"
 motorized_military_police_desc: "รักษาความสงบเรียบรอยและปราบปรามการตอตานในดินแดนที่ยึดครอง และสามารถลาดตระเวนในเขตสูรบได"
 helicopter_recon: "ลาดตระเวนเฮลิคอปเตอร"
 helicopter_recon_desc: "ผูสังเกตการณที่ไดรับการฝกเปนพิเศษบนเฮลิคอปเตอร สามารถสอดแนมพื้นที่ไดอยางรวดเร็วโดยไมขึ้นกับภูมิประเทศ และเรียกการโจมตีแมนยําในจุดที่ตองการ"
 helicopter_transport: "เฮลิคอปเตอรลําเลียง"
 helicopter_transport_desc: "เฮลิคอปเตอรที่ดัดแปลงเพิ่มความจุสินคาหรือยกเสบียงดวยสลิงใตลํา นํายุทโธปกรณไปยังจุดที่ตองการไดอยางรวดเร็วโดยไมตองคํานึงถึงภูมิประเทศ"
 helicopter_field_hospital: "เฮลิคอปเตอรอพยพผูบาดเจ็บ"
 helicopter_field_hospital_desc: "กําลังพลทุกนายโปรดทราบ! เฮลิคอปเตอรพรอมผูบาดเจ็บกําลังเขามา! เฮลิคอปเตอรอพยพผูบาดเจ็บสามารถนําผูบาดเจ็บออกจากสนามรบไดรวดเร็วกวารถพยาบาลทั่วไปมาก"
 helicopter_brigade: "กองพลนอยเฮลิคอปเตอร"
 helicopter_brigade_desc: "กองพลนอยเฮลิคอปเตอรสนับสนุนอเนกประสงค สามารถใหความชวยเหลือเคลื่อนที่ไดอยางยืดหยุนในหลากหลายดาน"


 super_heavy_artillery: "ปนใหญหนักพิเศษ"
 super_heavy_artillery_desc: "หนวยเฉพาะทางที่ติดตั้งปนใหญฮาวอิตเซอรลํากลองใหญ ออกแบบมาเพื่อทําลายลางปอมปราการและที่มั่นที่ขุดสนามเพลาะของขาศึก"
 self_propelled_super_heavy_artillery: "ปนใหญอัตตาจรหนักพิเศษ"
 self_propelled_super_heavy_artillery_desc: "ปนใหญฮาวอิตเซอรลํากลองมหึมาที่ติดตั้งบนแชสซีเคลื่อนที่ ผสานอํานาจการยิงอันรุนแรงเขากับความคลองตัวที่ดีขึ้นเพื่อบดขยี้แนวปองกันของขาศึก"
 super_heavy_railway_gun: "$super_heavy_railway_gun_equipment$"
 super_heavy_railway_gun_desc: "$super_heavy_railway_gun_equipment_desc$"
 land_cruiser: "เรือลาดตระเวนบก"
 land_cruiser_desc: "เครื่องจักรสงครามขนาดมหึมาที่ติดอาวุธระดับเรือประจัญบานและเกราะที่หนาที่สุด แตเชื่องชาอยางยิ่งและใชทรัพยากรมหาศาล"
 
