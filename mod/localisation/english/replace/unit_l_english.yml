 pioneer_support_desc: "ทหารชางบุกเบิกเปนวิศวกรที่มีความสามารถ ชํานาญในการเสริมความมั่นคงใหหัวหาด งานวิศวกรรมทั่วไป และการรักษาพื้นที่ที่ยึดได"
 marines_shore_parties: "หนวยปฏิบัติการชายฝง"
 marines_shore_parties_desc: "หนวยปฏิบัติการชายฝงมักเปนหนวยแรกที่บุกเขาไปในการยกพลขึ้นบก เปนกลุมทหารชางสนามเฉพาะทางที่เชี่ยวชาญการสรางที่มั่นทามกลางหากระสุน"
 marines_jungle_troops: "ผูเชี่ยวชาญการรบในปา"
 marines_jungle_troops_desc: "นาวิกโยธินเหลานี้ชํานาญการบุกเบิกภูมิประเทศรกทึบ และโดดเดนในปฏิบัติการรุกขนาดใหญและงานวิศวกรรมในภูมิประเทศทุรกันดาร"
 marines_recon: "หลักสูตรการฝกอันทรหด"
 marines_recon_desc: "ไมมีสิ่งใดเตรียมคนใหพรอมสําหรับสงครามได แตครูฝกการรบของเรายืนยันวาพวกเขาทําไดใกลเคียงพอ จนมีเพียงทหารใหมที่แกรงที่สุดเทานั้นที่จะผานไปถึงจุดที่สําคัญ"
 marines_commandoes: "หนวยคอมมานโดนาวิกโยธิน"
 marines_commandoes_desc: "นาวิกโยธินของเราไดพิสูจนคุณคาของตนในปฏิบัติการระยะยาวหลังแนวขาศึกแลว ถึงเวลาที่เราจะบรรจุแนวปฏิบัตินี้ไวในหลักนิยมอยางมั่นคง และจัดกําลังทหารโดยยึดหลักการตีแลวถอยอยางมีประสิทธิภาพ"
 marines_expeditionary: "หนวยรบนอกประเทศ"
 marines_expeditionary_desc: "การโจมตีที่ประสานกันจะไดประโยชนจากการวางแผนและการสงกําลังบํารุงขามสาขาที่ดีขึ้น เมื่อแนวคิดทางหลักนิยมของเรากาวหนาขึ้น การใหการสนับสนุนหมูเรือเฉพาะกิจเหลานี้มากขึ้นยอมเปนประโยชนตอเราอยางแนนอน"
 marines_expeditionary_blowtorch: "พนไฟและสวานเจาะ"
 marines_expeditionary_blowtorch_desc: "การผสมผสานที่สมบูรณแบบระหวางกําลังทางเรือ ทางอากาศ และกําลังภาคพื้นดินเฉพาะทาง สามารถยึดเปาหมายใดก็ได แนวทางการรบรวมเหลาทัพในสงครามเชิงรุกนี้จะเปนเครื่องแสดงถึงความเกงกาจดานการสงกําลังบํารุงของเรา"
 marines_expeditionary_support: "หมูเรือเฉพาะกิจรบนอกประเทศ"
 marines_expeditionary_support_desc: "มาถึงตอนนี้ ความสําคัญของความรวมมือระหวางเหลาทัพนั้นชัดเจนจนไมอาจกลาวเกินจริงได การทุมเทการสงกําลังบํารุงของหมูเรือเฉพาะกิจใหกับปฏิบัติการของเราทําใหเรากลายเปนกองกําลังที่ไมมีใครกลาประมาท"
 marines_commandos_demolition: "ผูเชี่ยวชาญการทําลาย"
 marines_commandos_demolition_desc: "การทําลายเปนศิลปะที่เราสามารถนํามาใชประโยชนได การกอวินาศกรรมอาจเปนยุทธวิธีที่สกปรก แตไมอาจปฏิเสธประสิทธิผลของมันได"
 marines_commandoes_mechanised: "กองนาวิกโยธินยานเกราะลําเลียงพล"
 marines_commandoes_mechanised_desc: "ความสามารถในการรักษาพื้นที่หลังการยกพลขึ้นบกสําเร็จจะเพิ่มขึ้นไดก็ดวยการติดอาวุธใหกองหนาของเราอยางเหมาะสมเทานั้น ซึ่งตองอาศัยการเปลี่ยนแปลงทั้งยุทธศาสตรการผลิตและหลักนิยม"
 category_amphibious_tanks: "ยานเกราะสะเทินนํ้าสะเทินบก"
 SF_MARINES_exfiltration_effect_tt: "หนวยคอมมานโดนาวิกโยธินสามารถถอนตัวออกจากจังหวัดชายฝงใดก็ได"
 SF_marine_demoliton_effect_TT: "กองพลคอมมานโดนาวิกโยธินจะสรางความเสียหาย §H1§! ระดับใหกับอาคารยุทธศาสตรทั้งหมดในรัฐหลังการยกพลขึ้นบกที่สําเร็จทุกครั้ง"
 marines_commandoes_mechanised_non_mtg: "การฝกเฉพาะทาง"
 marines_commandoes_mechanised_non_mtg_desc: "มาเสริมสรางแกนนําชั้นยอดของกองกําลังพิเศษของเรากันเถอะ แมวาจะตองแลกกับการนําไปใชในวงกวางก็ตาม"
 northern_territory_recon_support: "หนวยลาดตระเวนนอรเทิรนเทรริทอรี"
 northern_territory_recon_support_desc: "ดวยความรูทองถิ่นและทักษะการใชชีวิตในปา หนวยลาดตระเวนนอรเทิรนเทรริทอรีสามารถสอดแนมไดแมในดินแดนที่หางไกลและทุรกันดารที่สุด"
 winter_logistics_support: "กองรอยสงกําลังบํารุงฤดูหนาว"
 winter_logistics_support_desc: "จัดหาอุปกรณที่เหมาะสมใหทหารราบเดินเทาเพื่อสูรบในสภาพอากาศฤดูหนาว"
 long_range_patrol_support: "กองรอยลาดตระเวนระยะไกล"
 long_range_patrol_support_desc: "ทหารราบชั้นยอดที่ชํานาญภารกิจลาดตระเวนและทําลาย"
 category_cavalry: "ทหารราบขี่สัตว"
 category_vehicle_infantry: "ทหารราบยานยนตและยานเกราะลําเลียงพล"
 category_special_forces_leg_infantry: "ทหารราบเดินเทากองกําลังพิเศษ"
