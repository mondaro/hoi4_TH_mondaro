 landmark_nanjing_presidential_palace_gen_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_gen_plural: "$landmark_nanjing_presidential_palace_plural$"
 landmark_forbidden_city: "พระราชวังตองหาม"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "ในฐานะศูนยกลางอํานาจโบราณของราชวงศหมิง พระราชวังตองหามเปนสัญลักษณแหงประวัติศาสตรอันยาวนานของความสงบสุขและความรุงเรืองของจีน ปจจุบัน สมบัติและโบราณวัตถุภายในถูกนําไปซอนไว เพราะเกรงวาญี่ปุนจะรุกรานอีกครั้ง..."
 landmark_prague_castle: "ปราสาทปราก"
 landmark_prague_castle_desc: "ปราสาทปรากอันเกาแกซึ่งใหญที่สุดในโลก ทําหนาที่เปนที่ประทับของกษัตริย จักรพรรดิ และในที่สุดก็คือประธานาธิบดีของเชโกสโลวาเกียมานานหลายศตวรรษ รูปลักษณภายนอกแสดงใหเห็นชัดวาไมใชสิ่งกอสรางเพื่อการปองกัน แตเปนสัญลักษณแหงอํานาจที่ชวนใหนึกถึงพระราชวังอันยิ่งใหญ ขณะที่หลังกําแพงชั้นนอกมีโบสถที่ใหญที่สุดของเชโกสโลวาเกีย ซึ่งสรางเสร็จในป 1926"
 landmark_bojnice_castle: "ปราสาทบอยนิตเซ"
 landmark_bojnice_castle_desc: "ปราสาทบอยนิตเซเคยตอนรับกษัตริยฮังการีและขุนนางชั้นสูงคนอื่น ๆ แตนับตั้งแตแยกตัวจากฮังการีในป 1920 ก็กลายเปนหนึ่งในสิ่งกอสรางที่งดงามที่สุดในสโลวาเกีย"

