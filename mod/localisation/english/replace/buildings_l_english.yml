l_english:
 infrastructure: "โครงสรางพื้นฐาน"
 infrastructure_plural: "โครงสรางพื้นฐาน"
 infrastructure_desc: "อาคารนี้ชวยปรับปรุงโครงสรางพื้นฐานของรัฐ เพิ่มกําลังสงเสบียงในภูมิภาคยุทธศาสตร และเพิ่มความเร็วของกองพล รวมถึงเพิ่มการสกัดทรัพยากรดิบดวย"
 arms_factory: "โรงงานทหาร"
 arms_factory_plural: "โรงงานทหาร"
 arms_factory_desc: "อาคารนี้มอบอุตสาหกรรมสําหรับผลิตยุทโธปกรณทางทหารใหมใหแกรัฐ สามารถเปลี่ยนเปนอุตสาหกรรมพลเรือนไดหากจําเปน"
 dockyard: "อูตอเรือ"
 dockyard_plural: "อูตอเรือ"
 dockyard_desc: "อาคารนี้มอบอุตสาหกรรมสําหรับตอเรือใหมใหแกรัฐ"
 dam: "เขื่อน"
 dam_plural: "เขื่อน"
 dam_desc: "เขื่อนใหพลังงานเพิ่มเติมแกรัฐ ชวยเพิ่มผลผลิตทางอุตสาหกรรมและทรัพยากร"
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 cataract_dam_mountain: "เขื่อนแคตาแรกต"
 cataract_dam_mountain_plural: "เขื่อนแคตาแรกต"
 cataract_dam_mountain_desc: "เขื่อนแคตาแรกตสรางเสร็จในป 1907 เปนหนึ่งในผลงานวิศวกรรมยุคแรกอันยิ่งใหญของออสเตรเลียสมัยอาณานิคม สรางขึ้นบนแมนํ้าแคตาแรกตในเขตที่ราบสูงตอนใตของรัฐนิวเซาทเวลส และยังคงเปนหนึ่งในอางเก็บนํ้าหลักสี่แหงที่จายนํ้าจืดใหแกนครซิดนีย"
 canal_kiel: "ประตูนํ้าคลองคีล"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "ประตูนํ้าคลองคีลจําเปนตองอยูในสภาพพรอมใชงานเพื่อใหคลองทํางานไดเต็มประสิทธิภาพ และการทําลายประตูนํ้าจะขัดขวางการเดินเรือและการเคลื่อนที่ไปอีกนาน"
 canal_panama: "ประตูนํ้าคลองปานามา"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "ประตูนํ้าคลองปานามาจําเปนตองอยูในสภาพพรอมใชงานเพื่อใหคลองทํางานไดเต็มประสิทธิภาพ และการทําลายประตูนํ้าจะขัดขวางการเดินเรือและการเคลื่อนที่ไปอีกนาน"
 industrial_complex: "โรงงานพลเรือน"
 industrial_complex_plural: "โรงงานพลเรือน"
 industrial_complex_desc: "อาคารนี้มอบอุตสาหกรรมสําหรับผลิตสินคาพลเรือนหรือกอสรางอาคารใหมใหแกรัฐ สามารถเปลี่ยนเปนอุตสาหกรรมทางทหารไดหากจําเปน"
 air_base: "ฐานทัพอากาศ"
 air_base_plural: "ฐานทัพอากาศ"
 air_base_desc: "อาคารนี้ใหรัฐมีที่ประจําการสําหรับกองทัพอากาศของคุณ"
 naval_base: "ฐานทัพเรือ"
 naval_base_plural: "ฐานทัพเรือ"
 naval_base_desc: "ขยายระยะปฏิบัติการของกองเรือและใหบริการซอมบํารุง ชวยใหสงเสบียงไปยังโพนทะเลและสงออกทรัพยากรได ระดับที่สูงขึ้นจะเพิ่มปริมาณการสงเสบียง"
 bunker: "ปอมปราการทางบก"
 bunker_plural: "ปอมปราการทางบก"
 bunker_desc: "อาคารนี้ทําใหฝายโจมตีไดรับโทษการโจมตี $VALUE|+%0$ ตอปอมปราการแตละระดับในการรบ การโจมตีจากหลายทิศทางจะลดผลของปอมปราการ"
 coastal_bunker: "ปอมปราการชายฝง"
 coastal_bunker_plural: "ปอมปราการชายฝง"
 coastal_bunker_desc: "อาคารนี้ทําใหฝายโจมตีไดรับโทษการโจมตี $VALUE|+%0$ ตอปอมปราการแตละระดับในการรบยกพลขึ้นบก"
 anti_air_building: "ตอตานอากาศยาน"
 anti_air_building_plural: "ตอตานอากาศยาน"
 anti_air_building_desc: "อาคารนี้ชวยปกปองรัฐจากเครื่องบินทิ้งระเบิดของศัตรู และสามารถยิงอากาศยานที่เขาโจมตีได"
 synthetic_refinery: "โรงกลั่นนํ้ามันสังเคราะห"
 synthetic_refinery_plural: "โรงกลั่นนํ้ามันสังเคราะห"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "อาคารนี้มอบสิ่งตอไปนี้ใหแกรัฐ"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "สถานีเรดาร"
 radar_station_plural: "สถานีเรดาร"
 radar_station_desc: "เรดารชวยใหคุณไดขาวกรองเกี่ยวกับกองทหารของศัตรูในรัฐใกลเคียง\nระดับเรดารที่สูงขึ้นในรัฐจะเพิ่มระยะครอบคลุมของเรดาร\nเรดารยังชวยใหรัฐตรวจจับกองทัพอากาศของศัตรูไดดีขึ้น ทําใหเครื่องบินของคุณมีโอกาสเขาปะทะมากขึ้น\nนอกจากนี้ เรดารยังเพิ่มการตรวจจับกองเรือของศัตรูในทะเลดวย"
 rocket_site: "ฐานยิงจรวด"
 rocket_site_plural: "ฐานยิงจรวด"
 rocket_site_desc: "อาคารนี้ใหรัฐมีที่ประจําการสําหรับจรวดที่ผลิตขึ้น"
 nuclear_reactor_heavy_water: "เครื่องปฏิกรณนิวเคลียรแบบนํ้ามวลหนัก"
 nuclear_reactor_heavy_water_plural: "เครื่องปฏิกรณนิวเคลียรแบบนํ้ามวลหนัก"
 nuclear_reactor_heavy_water_desc: "อาคารนี้ชวยใหรัฐผลิตยูเรเนียมเสริมสมรรถนะเพื่อใชในอาวุธนิวเคลียร\nเครื่องปฏิกรณนิวเคลียรที่ใชนํ้ามวลหนักสรางไดถูกกวาเครื่องปฏิกรณแบบแกรไฟตอยูบาง แตผลิตวัสดุสําหรับสรางอาวุธนิวเคลียรไดนอยกวา"
 nuclear_reactor: "เครื่องปฏิกรณนิวเคลียร"
 nuclear_reactor_plural: "เครื่องปฏิกรณนิวเคลียร"
 nuclear_reactor_desc: "อาคารนี้ชวยใหรัฐผลิตยูเรเนียมเสริมสมรรถนะเพื่อใชในอาวุธนิวเคลียร"
 commercial_nuclear_reactor: "เครื่องปฏิกรณนิวเคลียรพลเรือน"
 commercial_nuclear_reactor_plural: "เครื่องปฏิกรณนิวเคลียรพลเรือน"
 commercial_nuclear_reactor_desc: "อาคารนี้ชวยใหรัฐไดยูเรเนียมเสริมสมรรถนะสําหรับอาวุธนิวเคลียร และผลิตไฟฟาใหแกเศรษฐกิจภาคพลเรือน"
 nuclear_facility: "ศูนยวิจัยนิวเคลียร"
 nuclear_facility_plural: "ศูนยวิจัยนิวเคลียร"
 nuclear_facility_desc: "ศูนยทดลองเพื่อการวิจัยนิวเคลียรชวยใหคุณเริ่มโครงการวิจัยที่เกี่ยวของกับการใชพลังงานนิวเคลียรได"
 air_facility: "ศูนยอากาศพลศาสตรและอากาศยานอิเล็กทรอนิกส"
 air_facility_plural: "ศูนยอากาศพลศาสตรและอากาศยานอิเล็กทรอนิกส"
 air_facility_desc: "ศูนยทดลองดานอากาศพลศาสตรและอากาศยานอิเล็กทรอนิกสชวยใหคุณเริ่มโครงการวิจัยสําหรับอากาศยาน จรวด และอุปกรณอิเล็กทรอนิกสที่เกี่ยวของได"
 naval_facility: "ศูนยวิศวกรรมนาวี"
 naval_facility_plural: "ศูนยวิศวกรรมนาวี"
 naval_facility_desc: "ศูนยทดลองดานวิศวกรรมนาวีชวยใหคุณเริ่มโครงการวิจัยที่เกี่ยวของกับเรือผิวนํ้าและเรือดํานํ้าได\nศูนยวิศวกรรมนาวีสรางไดเฉพาะในจังหวัดที่ติดชายฝงเทานั้น"
 mega_gun_emplacement: "ปนใหญลํากลองใหญแบบหลายดินสง"
 mega_gun_emplacement_plural: "ปนใหญลํากลองใหญแบบหลายดินสง"
 mega_gun_emplacement_desc: "ปนใหญลํากลองใหญนี้ทํางานบนหลักการขับเคลื่อนดวยดินสงหลายจุด ออกแบบมาเพื่อใหไดระยะยิงระดมที่ไมมีใครเทียบได โดยใชอุโมงคใตดินหลายชวงเรงกระสุนใหมีความเร็วเหนือเสียงกอนยิงออกไปยังเปาหมายที่อยูหางไกล"
 stronghold_network: "เครือขายที่มั่น"
 stronghold_network_plural: "เครือขายที่มั่น"
 stronghold_network_desc: "ระบบปองกันขนาดใหญที่ประกอบดวยบังเกอรมหึมาและที่มั่นซึ่งเสริมความแข็งแกรงอยางหนาแนน ออกแบบมาเพื่อสกัดการรุกของศัตรูและรักษาพื้นที่ยุทธศาสตรสําคัญ"
 land_facility: "ศูนยการสงครามภาคพื้นดิน"
 land_facility_plural: "ศูนยการสงครามภาคพื้นดิน"
 land_facility_desc: "ศูนยทดลองดานการสงครามภาคพื้นดินชวยใหคุณเริ่มโครงการวิจัยที่เกี่ยวของกับการสงครามภาคพื้นดินในแงมุมตาง ๆ เชน รถถังพิเศษ หรือปนใหญได"
 landmark_statue_of_liberty: "เทพีเสรีภาพ"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "เทพีเสรีภาพอันมหึมาตั้งตระหงานอยางภาคภูมิในอาวนิวยอรก จุดเขาเมืองหลักของสหรัฐอเมริกาสําหรับผูอพยพที่มุงหวังจะเริ่มตนชีวิตใหม ดวยเหตุนี้ จึงกลายเปนสัญลักษณของอุดมคติอเมริกันวาดวยชีวิต เสรีภาพ และการแสวงหาความสุข"
 landmark_big_ben: "บิ๊กเบน"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "หอนาฬกาเวสตมินสเตอร หรือที่รูจักกันทั่วไปในชื่อบิ๊กเบน เปนสัญลักษณทางวัฒนธรรมของอังกฤษ และเปนหนึ่งในสัญลักษณที่โดดเดนที่สุดของสหราชอาณาจักรและระบอบประชาธิปไตยแบบรัฐสภา สรางเสร็จครั้งแรกในป 1859 ดวยสถาปตยกรรมแบบฟนฟูกอทิก และเปนหอคอยที่สูงเปนอันดับสามในบริเตนใหญ"
 landmark_colosseum: "โคลอสเซียม"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "โคลอสเซียมตั้งอยูใจกลางกรุงโรม เปนอัฒจันทรโบราณที่ใหญที่สุดเทาที่เคยสรางมา ถูกใชเปนสถานที่บันเทิงโดยชาวโรมันและชาวเมืองหลังการลมสลายของโรมัน นับตั้งแตจักรพรรดิไททัสสรางเสร็จ"
 landmark_cristo_redentor: "คริสตผูไถ"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "รูปปนพระคริสตผูไถตั้งตระหงานเหนือนครรีโอเดจาเนโร สรางเสร็จในป 1931 เปนสัญลักษณประจําชาติของบราซิล และมีความสําคัญอยางยิ่งตอชาวคาทอลิกในภูมิภาค"
 landmark_eiffel_tower: "หอไอเฟล"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "หอไอเฟลไดชื่อตามผูสราง กุสตาฟ แอฟแฟล และสรางเสร็จในป 1889 ตั้งอยูบนช็องเดอมารสในกรุงปารีส สุภาพสตรีเหล็กแหงนี้ไดกลายเปนสัญลักษณทางวัฒนธรรมระดับโลกของฝรั่งเศส และเปนสัญลักษณแหงความภาคภูมิใจของชาติ"
 landmark_kremlin: "เครมลิน"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "เครมลินมอสโกเปนกลุมอาคารที่มีปอมปราการลอมรอบ ภายในมีพระราชวังเครมลินใหญ ซึ่งเคยเปนที่ประทับของจักรพรรดิรัสเซีย เครมลินมองเห็นแมนํ้ามอสโกทางทิศใต มหาวิหารเซนตบาซิลและจัตุรัสแดงทางทิศตะวันออก และสวนอะเล็กซานเดอรทางทิศตะวันตก ปจจุบันกลายเปนสัญลักษณแหงอํานาจรัฐและการควบคุมประชาชน"
 landmark_berlin_reichstag: "ไรชสทาค"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "อาคารรัฐสภาไรชสทาค หรือที่รูจักกันในชื่อไรชสทาค เปนอาคารนิติบัญญัติทางประวัติศาสตร ตั้งอยูบนจัตุรัสพลัทซแดรเรปูบลีคในกรุงเบอรลิน เคยถูกใชโดยสภาสหพันธของเยอรมนีจนกระทั่งเกิดเหตุไฟไหมไรชสทาคในป 1933 แตถึงกระนั้นก็ยังเปนอาคารเชิงสัญลักษณที่มีความสําคัญยิ่งในหัวใจและความคิดของประชาชน"
 landmark_tokyo_imperial_palace: "พระราชวังหลวง"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "พระราชวังหลวงโตเกียวเปนที่ประทับหลักของสมเด็จพระจักรพรรดิมาตั้งแตการปฏิรูปเมจิและการขับไลรัฐบาลโชกุนชุดสุดทาย เปนสัญลักษณแหงความภาคภูมิใจและความเคารพบูชาของชาวญี่ปุน และเปนแรงบันดาลใจใหพวกเขาทํางานหนัก"
 landmark_national_diet: "อาคารรัฐสภาแหงชาติ"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "คกไก-กิจิโดเปนอาคารที่ทั้งสองสภาของรัฐสภาแหงชาติญี่ปุนใชประชุม สรางเสร็จในตนป 1936 โดยใชวัสดุของญี่ปุนเกือบทั้งหมด มีขอยกเวนเพียงไมกี่อยาง อาคารหลังกอนถูกทําลายในป 1925 เมื่อไฟไหมอีกครั้งลุกลามไปทั่วบริเวณ แมอาคารรัฐสภาจะพังทลายมาหลายครั้ง แตครั้งนี้มันจะตั้งตระหงานไปอีกหลายศตวรรษอยางแนนอน!"
 landmark_hakko_ichiu: "อนุสาวรียฮักโก อิจิอุ"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "หอคอยฮักโก อิจิอุ สรางขึ้นเพื่อรําลึกถึงวาระครบรอบ 2,600 ปแหงการสถาปนาญี่ปุน และเปนอนุสาวรียที่สื่อถึงชะตากรรมของญี่ปุนในการรวมแปดทิศของโลกไวใตหลังคาเดียว"
 landmark_hofburg_palace: "พระราชวังฮอฟบวรก"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "ฮอฟบวรกเคยเปนพระราชวังหลวงหลักของราชวงศฮาพสบวรค หันหนาไปทางจัตุรัสเฮลเดินพลัทซ บางทีวันหนึ่ง พระราชวังแหงนี้อาจถูกใชโดยผูปกครองออสเตรียอีกครั้ง ไมวาจะเปนประธานาธิบดีหรือกษัตริย"
 landmark_berlin_volkshalle: "ฟอลคสฮัลเลอ"
 landmark_berlin_volkshalle_plural: "$landmark_berlin_volkshalle$"
 landmark_berlin_volkshalle_desc: "ฟอลคสฮัลเลอตั้งตระหงานเปนประจักษพยานถึงจิตวิญญาณอันไมยอทอของประชาชนของเรา และเจตจํานงอันทะนงตนที่จะครอบครองโลก มันจะแสดงใหโลกเห็นวา ดวยพลังแหงการพิชิต ทุกสิ่งเปนไปได และปตุภูมิสามารถทําใหแมแตภารกิจที่เปนไปไมไดที่สุดกลายเปนจริงได"
 landmark_sadabad_complex: "กลุมพระราชวังซาดาบาด"
 landmark_sadabad_complex_desc: "กลุมพระราชวังซาดาบาดทางตอนเหนือของกรุงเตหะรานสรางโดยราชวงศกอญารและขยายโดยราชวงศปาหลาวี ทําหนาที่เปนที่ประทับของราชวงศและศูนยกลางแหงอํานาจ พระราชวังและสวนของที่นี่สะทอนภูมิทัศนทางการเมืองที่เปลี่ยนแปลงไปของอิหราน จากอนุรักษนิยมสูสมัยใหมนิยม"
 landmark_taj_mahal: "ทัชมาฮาล"
 landmark_taj_mahal_desc: "ทัชมาฮาลเปนผลงานชิ้นเอกของสถาปตยกรรมโมกุล โดมหินออนสีขาวอันยิ่งใหญและสวนอันประณีตทําใหเปนหนึ่งในสัญลักษณที่โดดเดนที่สุดของอินเดีย เปนประจักษพยานถึงทั้งอํานาจแหงจักรวรรดิและมรดกอันยั่งยืน"
 landmark_hagia_sophia: "ฮาเกียโซเฟย"
 landmark_hagia_sophia_desc: "ฮาเกียโซเฟยตั้งอยู ณ ทางแยกแหงจักรวรรดิทั้งหลาย เคยเปนทั้งมหาวิหารไบแซนไทน มัสยิดออตโตมัน และสัญลักษณของผูปกครองอิสตันบูลที่เปลี่ยนแปลงไปไมหยุดหยอน โดมมหึมาและโถงอันโออาสะทอนทั้งความสําคัญทางจิตวิญญาณและความทะเยอทะยานของผูที่อางสิทธิ์ครอบครองนครแหงนี้"
 naval_supply_hub: "ศูนยสงกําลังบํารุงทางเรือ"
 naval_supply_hub_desc: "อาคารนี้ชวยใหกองเรือของคุณเติมเสบียงและเชื้อเพลิงที่ฐานนี้ได นอกเหนือจากฐานประจําการ ซึ่งอาจชวยขยายระยะปฏิบัติการของ§Yหมูเรือเฉพาะกิจ§!\nศูนยสงกําลังบํารุงทางเรือสรางไดเฉพาะในจังหวัดชายฝงที่มีฐานทัพเรือระดับ 8 ขึ้นไปเทานั้น"
 naval_headquarters: "กองบัญชาการทางเรือ"
 naval_headquarters_desc: "อาคารนี้ชวยใหคุณแตงตั้งพลเรือเอกเพื่อเพิ่มประสิทธิภาพของ§Yหมูเรือเฉพาะกิจ§!ที่ปฏิบัติการภายในระยะของกองบัญชาการทางเรือ\n\nกองบัญชาการสามารถมีพลเรือเอกประจําไดพรอมกันสูงสุด $MAXNUM|H$ แหง\n   แตงตั้งแลวในขณะนี้: $CURRNUM|H$\n\nกองบัญชาการทางเรือสรางไดเฉพาะในจังหวัดชายฝงที่มีฐานทัพเรือระดับ 8 ขึ้นไปเทานั้น"
 landmark_great_wall_section: "กําแพงเมืองจีน"
 landmark_great_wall_section_desc: "กําแพงเมืองจีนซึ่งสรางขึ้นตลอดหลายรอยปและผานการปกครองหลายสิบยุค เปนผลงานชิ้นเอกดานการสงกําลังบํารุง ในปจจุบันอาจกลาวไดวาเปนตัวแทนของความกลาหาญอันยิ่งใหญและการไมยอมจํานนของชาวจีนเมื่อเผชิญกับความยากลําบาก"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_nanjing_presidential_palace: "ทําเนียบประธานาธิบดีหนานจิง"
 landmark_nanjing_presidential_palace_desc: "ทําเนียบประธานาธิบดีที่หนานจิงเปนกลุมอาคารโบราณอันทรงเกียรติ ซึ่งภายหลังการลมสลายของราชวงศชิง ดร.ซุน ยัตเซ็น ผูยิ่งใหญไดเขารับตําแหนง ณ ที่แหงนี้"
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_prc_plural: "$landmark_nanjing_presidential_palace_plural$"
