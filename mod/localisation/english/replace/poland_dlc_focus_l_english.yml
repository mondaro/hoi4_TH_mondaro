 POL_april_constitution_dem: "รัฐธรรมนูญเดือนเมษายนฉบับแกไข"
 POL_april_constitution_dem_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญไดรับการแกไขใหมีสิทธิและเอกสิทธิ์อันละเมิดมิไดหลายประการแกทองถิ่นแตละแหงของโปแลนด มอบอํานาจปกครองตนเองระดับทองถิ่นและสิทธิประชาธิปไตย แมประธานาธิบดียังคงมีอํานาจเด็ดขาดเหนือรัฐในระดับชาติ"
