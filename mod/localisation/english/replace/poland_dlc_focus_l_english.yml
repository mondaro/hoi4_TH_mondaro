l_english:
 POL_central_region_strategy: "ยุทธศาสตรภาคกลาง"
 POL_central_region_strategy_desc: "การรวมโรงงานไวที่ใจกลางประเทศหางจากชายแดน จะชวยเพิ่มการผลิตและปกปองโรงงานจากผูที่คิดจะพิชิตเรา"
 POL_expansion_of_new_towns: "อุตสาหกรรมโปแลนดยุคใหม"
 POL_expansion_of_new_towns_desc: "เมื่อยึดภาคตะวันตกคืนจากเยอรมันไดแลว เราตองพัฒนาอุตสาหกรรมที่กําลังเติบโตในเมืองอยางกดือเนีย ซึ่งกําลังจะรุงเรืองทัดเทียมวอรซออยางรวดเร็ว"
 POL_fill_the_railways_gaps: "เติมชองวางทางรถไฟ"
 POL_fill_the_railways_gaps_desc: "ครั้งหนึ่งโปแลนดเคยถูกแบงระหวางสามมหาอํานาจ เครือขายรถไฟของเราจึงหางไกลและไมเชื่อมตอกัน เราตองรวมเสนทางรถไฟสามสายที่แยกจากกันนี้ใหเปนหนึ่ง หากจะทําใหโปแลนดเปนศูนยรวมอุตสาหกรรมตามที่ตองการ!"
 POL_start_central_industrial_region: "ขยายอุตสาหกรรมกรากุฟ"
 POL_start_central_industrial_region_desc: "กรากุฟ อดีตเมืองหลวงของโปแลนด หลุดพนจากเงื้อมมือของจักรวรรดิออสเตรียแลว แตเมืองนี้ยังถูกพันธนาการดวยอดีต ขาดอุตสาหกรรมสมัยใหมที่จําเปนตอการแขงขันกับฝงตะวันตก ดวยการลงทุน เราจะปลุกกรากุฟใหฟนคืนชีพ"
 POL_expand_central_industrial_region: "ปรับปรุงอุตสาหกรรมกาลิเซียใหทันสมัย"
 POL_expand_central_industrial_region_desc: "กาลิเซียเชนเดียวกับกรากุฟ เคยถูกชาวออสเตรียครอบครองและละเลย แตบัดนี้เมื่อกลับมาอยูในมือโปแลนดอีกครั้ง เราจะลงทุนปรับปรุงใหทันสมัยตามที่ดินแดนนี้ตองการอยางยิ่ง"
 POL_the_four_year_plan: "แผนสี่ป"
 POL_the_four_year_plan_desc: "เราตองวางแผนขยายโครงสรางพื้นฐานใหรองรับไมเพียงอุตสาหกรรมในปจจุบัน แตรวมถึงอนาคตดวย"
 POL_national_defence_fund: "กองทุนปองกันประเทศ"
 POL_national_defence_fund_desc: "ทั้งพลเมืองและรัฐตองรวมกันสนับสนุนเงินทุนแกอุตสาหกรรมที่กําลังเติบโต เพื่อเตรียมรับภยันตรายในปตอ ๆ ไป"
 POL_warsaw_main_railway_station: "สถานีรถไฟกลางวอรซอ"
 POL_warsaw_main_railway_station_desc: "วอรซอเปนศูนยกลางการขนสงและสินคา เพื่อหลีกเลี่ยงคอขวด ตองทุมเทเปนพิเศษในการบริหารจัดการระบบรถไฟของเมือง"
 POL_invest_in_the_old_polish_region: "ลงทุนในภูมิภาคโปแลนดเกา"
 POL_invest_in_the_old_polish_region_desc: "ปรับปรุงโรงงานเกาในเคียลตเซ สการชึสโก ราดอม สตาราโฮวิตเซ และออสตรอเวียตสใหทันสมัย พรอมสรางโรงงานใหมเพื่อเสริมความแข็งแกรงใหอุตสาหกรรมของเรา"
 POL_develop_upper_silesia: "พัฒนาไซลีเซียตอนบน"
 POL_develop_upper_silesia_desc: "เราควบคุมไซลีเซียเพียงสวนเล็ก ๆ แตสวนที่เรามีนั้นสําคัญยิ่งทางอุตสาหกรรม ไซลีเซียเปนหนึ่งในภูมิภาคที่มีอุตสาหกรรมหนาแนนที่สุดของประเทศ และดวยการลงทุนเพียงเล็กนอย ก็จะชวยหนุนการสรางอุตสาหกรรมของทั้งประเทศตอไปได"
 POL_additional_research_slot1: "สํานักคณิตศาสตรโปแลนด"
 POL_additional_research_slot1_desc: "คณิตศาสตรเปนหัวใจของแทบทุกสิ่งในภาคเทคโนโลยี ทั่วทั้งโปแลนด ตั้งแตลวุฟถึงวอรซอ สํานักคณิตศาสตรกําลังเฟองฟู เราตองใชประโยชนจากยุคทองของนักคิดชาวโปแลนดนี้ และมอบทุกสิ่งที่พวกเขาตองการเพื่อทําใหโปแลนดเปนมหาอํานาจทางเทคโนโลยีอยางที่ควรเปน!"
 POL_the_bombe: "บอมบ"
 POL_the_bombe_desc: ""บอมบถอดรหัส" พัฒนาตอยอดจากไซโคลมิเตอร ชวยใหเราถอดรหัสอีนิกมาของเยอรมันรุนที่กาวหนาขึ้นเรื่อย ๆ ได"
 POL_the_cyclometer: "ไซโคลมิเตอร"
 POL_the_cyclometer_desc: "ดวยสิ่งประดิษฐนี้ รหัสลับของเยอรมันจะอานออกงายเหมือนขอความธรรมดา ไมมีความลับใดปดบังเราได"
 POL_atomic_physics_institute: "สถาบันฟสิกสนิวเคลียร"
 POL_atomic_physics_institute_desc: "เราตองไมพลาดโอกาสที่จะเปนชาติแรกที่คนพบวิธีควบคุมไฟดึกดําบรรพแหงปฏิกิริยาฟชชัน"
 POL_additional_research_slot2: "ขยายมหาวิทยาลัยวอรซอ"
 POL_additional_research_slot2_desc: "มหาวิทยาลัยวอรซอเปนที่ที่ยอดคนสวนใหญของโปแลนดมาสอน เรียนรู และขยายขีดความสามารถทางเทคโนโลยีของโปแลนด ดวยการลงทุนขยายมหาวิทยาลัย เราจะมีที่นั่งรองรับนักคิดเพิ่มขึ้นอีกเพื่อเสริมความแข็งแกรงใหรัฐโปแลนด!"
 POL_prepare_for_the_next_war: "เตรียมพรอมสําหรับสงครามครั้งหนา"
 POL_prepare_for_the_next_war_desc: "มหาสงครามอาจเปนเพียงครั้งแรกของสงครามแบบนี้ เราตองเตรียมพรอมสําหรับสนามรบที่จะเปลี่ยนแปลงอยูเสมออยางแนนอน"
 POL_the_defence_of_poland: "การปองกันโปแลนด"
 POL_the_defence_of_poland_desc: "ตองคิดคนกลยุทธที่กลาหาญยิ่งขึ้น หากการปองกันมาตุภูมิจะประสบความสําเร็จ"
 POL_romanian_bridgehead_strategy: "ยุทธศาสตรหัวสะพานโรมาเนีย"
 POL_romanian_bridgehead_strategy_desc: "หากการรบพลิกผันเปนผลรายตอเรา เราตองมีแผนสําหรับรวมกําลังใหมและตอบโตอยางมีประสิทธิภาพรวมกับมิตรและพันธมิตร"
 POL_silesia_fortified_area: "พื้นที่ปอมปราการไซลีเซีย"
 POL_silesia_fortified_area_desc: "การสรางปอมเพิ่มทางใตจะเสริมการปองกันใหมั่นคงยิ่งขึ้น"
 POL_hel_fortified_area: "พื้นที่ปอมปราการเฮล"
 POL_hel_fortified_area_desc: "การสรางปอมปราการในพื้นที่สําคัญจะทําใหเราเปราะบางนอยลง หากสงครามมาถึงชายฝงและชายแดนของเราอีกครั้ง"
 POL_standardisation_of_equipment: "การกําหนดมาตรฐานยุทโธปกรณ"
 POL_standardisation_of_equipment_desc: "การกําหนดมาตรฐานยุทโธปกรณของทหารจะวางรากฐานใหระบบสงกําลังบํารุงสมัยใหม"
 POL_modernising_the_cavalry: "ปรับปรุงทหารมาใหทันสมัย"
 POL_modernising_the_cavalry_desc: "แมทหารมาจะยังมีบทบาทอยู แตเราตองการพาหนะเหล็กแบบใหมเพื่อใหแขงขันไดในสนามรบสมัยใหม"
 POL_study_foreign_tanks: "ศึกษารถถังตางชาติ"
 POL_study_foreign_tanks_desc: ""รถถัง" เหลานี้จะเปนสวนสําคัญของการสูรบในปจจุบัน และเราตองตามเพื่อนบานใหทันไมวาจะดวยวิธีใดก็ตาม"
 POL_cruiser_tank_experiments: "การทดลองรถถังครุยเซอร"
 POL_cruiser_tank_experiments_desc: "เมื่อมีพื้นฐานการออกแบบรถถังแลว เราพรอมที่จะบุกเบิกเสนทางของตนเองในสาขาการออกแบบยานเกราะอันซับซอน"
 POL_artillery_modernisation: "ปรับปรุงปนใหญใหทันสมัย"
 POL_artillery_modernisation_desc: "เราตองไมละเลยการพัฒนาและปรับปรุงหนวยสนับสนุนที่ทหารของเราตองการเพื่อการวางกําลังอยางมีประสิทธิภาพ"
 POL_anti_tank_guns: "ปนตอสูรถถัง"
 POL_anti_tank_guns_desc: "ขาศึกใดก็ตามตองสงรถถังมาโจมตีเราแนนอน เราตองพรอมตอนรับพวกมันอยางอบอุน"
 POL_army_modernisation: "ปรับปรุงกองทัพใหทันสมัย"
 POL_army_modernisation_desc: "อาวุธทันสมัยสําหรับทหารยุคใหม!"
 POL_air_base_expansion: "ขยายฐานทัพอากาศ"
 POL_air_base_expansion_desc: "ฐานทัพอากาศจําเปนตอการสนับสนุนทางอากาศ เชนเดียวกับที่การสนับสนุนทางอากาศจําเปนตอสงครามสมัยใหม"
 POL_fighter_modernisation: "ปรับปรุงเครื่องบินขับไลใหทันสมัย"
 POL_fighter_modernisation_desc: "เครื่องบินขับไลคือกําลังหลักของกองทัพอากาศใด ๆ และตองไมลาสมัย เมื่อกองทัพอากาศสวนอื่นพัฒนาขึ้น เครื่องบินขับไลก็ตองพัฒนาตามดวย"
 POL_air_innovations: "นวัตกรรมทางอากาศ"
 POL_air_innovations_desc: "ยังมีอีกมากที่ตองทําในดานยุทธศาสตรและยุทธวิธีทางอากาศ"
 POL_heavy_fighter_concept: "แนวคิดเครื่องบินขับไลหนัก"
 POL_heavy_fighter_concept_desc: "หากเราถูกบีบใหตองเปนฝายรุก เราตองการเครื่องบินขับไลแบบใหมที่ปฏิบัติการในดินแดนขาศึกไดเปนเวลานาน"
 POL_naval_bomber_experiments: "การทดลองเครื่องบินทิ้งระเบิดทางทะเล"
 POL_naval_bomber_experiments_desc: "ความเหนือกวาทางอากาศสําคัญในทะเลไมแพบนบก อากาศยานเฉพาะทางที่พัฒนาขึ้นเพื่อการรบทางทะเลคือหนทางสูเปาหมายนั้น"
 POL_medium_bomber_focus: "เนนเครื่องบินทิ้งระเบิดขนาดกลาง"
 POL_medium_bomber_focus_desc: "การตอยอดแนวคิดการทิ้งระเบิดแมนยํา ปรับใหมีพิสัยไกลขึ้นเพื่อใชในบทบาทสนับสนุน"
 POL_light_bomber_focus: "เนนเครื่องบินทิ้งระเบิดขนาดเบา"
 POL_light_bomber_focus_desc: "ไมควรประเมินคุณคาของการใชเครื่องบินดําทิ้งระเบิดเพื่อสนับสนุนทางอากาศโดยใกลชิดตํ่าเกินไป"
 POL_air_modernisations_programme: "โครงการปรับปรุงกองทัพอากาศใหทันสมัย"
 POL_air_modernisations_programme_desc: "ทฤษฎีการบินสําคัญไมแพเทคโนโลยี ยังมีกลยุทธใหม ๆ สําหรับนักบินของเรารอการคนพบอยู"
 POL_rocket_development: "การพัฒนาจรวด"
 POL_rocket_development_desc: "ความเร็วคือคุณสมบัติที่คุณสมบัติทางอากาศอื่นทั้งหมดตองพึ่งพา ในทางทฤษฎี เครื่องยนตจรวดและไอพนจะทําใหเรากาวขามขีดจํากัดเดิมทั้งหมดได"
 POL_develop_polish_ship_building: "พัฒนาการตอเรือของโปแลนด"
 POL_develop_polish_ship_building_desc: "ดานซิกตกอยูใตระบอบชั่วรายของพรรคนาซีอยางสิ้นหวังแลว และการคาของโปแลนดตองหาทางเลี่ยงการปดลอมทางเศรษฐกิจที่พวกนาซีกดทับเราไว เราอาจไมมีวันไดกดัญสกคืน แตบางทีเราอาจเปลี่ยนกดือเนียใหเปนเมืองทายิ่งใหญที่ทัดเทียมกดัญสกได"
 POL_study_foreign_built_ships: "ศึกษาแบบเรือของอังกฤษ"
 POL_study_foreign_built_ships_desc: "กองทัพเรืออังกฤษเปนพันธมิตรของโปแลนดมาหลายทศวรรษ แตระยะหลังนโยบายผอนปรนของอังกฤษทําใหโปแลนดตกอยูในสถานะลอแหลมโดยไมมีมิตรใหพึ่งพา บางทีการศึกษาแบบเรือของอังกฤษอาจทําใหเราเริ่มผลิตเรือที่มีประสิทธิภาพและความยิ่งใหญทัดเทียมกันได"
 POL_a_cruiser_navy: "กองทัพเรือลาดตระเวน"
 POL_a_cruiser_navy_desc: "เราตองการเรือที่ใหญขึ้นเรื่อย ๆ เพื่อทําใหแผนการแสดงแสนยานุภาพทางทะเลเปนจริง"
 POL_import_submarine_technology: "ORP Orzeł"
 POL_import_submarine_technology_desc: "สงครามทางเรือสมัยใหมตัดสินกันทั้งเหนือและใตคลื่น หากตองการแขงกับเรืออูของเยอรมนี เราตองออกแบบและผลิตเรือดํานํ้าแบบโปแลนดของเราเอง"
 POL_commerce_attack: "ยุทธวิธีโจมตีเรือพาณิชย"
 POL_commerce_attack_desc: "กองทัพเรือใดจะสมบูรณไมไดหากไมมีเรือดํานํ้า เรือดํานํ้าของเราตองจัดระเบียบเพื่อใหมีอานุภาพทําลายสูงสุด เชนเดียวกับกองเรือสวนอื่น"
 POL_the_twin_threats: "เริ่มปรับปรุงกองทัพเรือใหทันสมัยอีกครั้ง"
 POL_the_twin_threats_desc: "เมื่อเราไดชายฝงกลับคืนมาแลว เราจะเริ่มปรับปรุงกองทัพเรือใหทันสมัยไดอีกครั้ง ชัยชนะจะมาจากการศึกษาวิธีการรบทางเรือกอนที่จะทุมอุตสาหกรรมไปกับสิ่งใด"
 POL_coastal_defense: "การปรับปรุงอยางพอประมาณ"
 POL_coastal_defense_desc: "เราเปนเศรษฐกิจขนาดเล็กที่มีชายฝงสั้น การปรับปรุงกองทัพเรือจึงตองพอประมาณ เรือพิฆาตเปนวิธีปองกันชายฝงที่ถูกและมีประสิทธิภาพ และเราตองทุมเทใหกับมัน"
 POL_strike_force: "ความทะเยอทะยานของมังกร"
 POL_strike_force_desc: "ที่ผานมากองทัพเรือโปแลนดปรับปรุงตัวอยางพอประมาณและเจียมตัว แตจะไมเปนเชนนั้นอีกตอไป มังกรโปแลนดผูยิ่งใหญจะทะยานเหนือคลื่น และทั้งเยอรมันและรัสเซียจะสั่นสะทานตอเสียงคํารามของนาง ขณะที่นางผงาดขึ้นดั่งอสูรกายที่ขอบฟา!"
 POL_baltic_navy: "ผูพิทักษทะเลบอลติก"
 POL_baltic_navy_desc: "ไมมีผูใดผานการปดลอมของเราได ไมมีผูใดขึ้นบกบนชายฝงของโปแลนดหรือพันธมิตรได ทะเลบอลติกเปนของโปแลนด และไมใชของผูอื่น"
 POL_strengthen_the_polish_state: "เสริมความแข็งแกรงใหรัฐโปแลนด"
 POL_strengthen_the_polish_state_desc: "เราไมอาจปลอยใหตนเองแตกแยก พลังในการผลักดันการเปลี่ยนแปลงของเราขึ้นอยูกับเอกภาพทั้งในวุฒิสภาและเซยม"
 POL_defensive_focus: "เนนการปองกัน"
 POL_defensive_focus_desc: "เราจะไมเปนผูเริ่มสงครามครั้งหนา แตเราจะเปนผูยุติมันอยางแนนอน"
 POL_polish_militarism: "ลัทธิทหารโปแลนด"
 POL_polish_militarism_desc: "สงครามที่ผานมาอาจทําใหเราตองกมหัว แตเรายังไมพายแพ เราจะผงาดขึ้นอีกครั้งดวยความกลาหาญของทหารและความเฉลียวฉลาดของนายทหาร"
 POL_polish_revanchism: "ลัทธิทวงคืนดินแดนโปแลนด"
 POL_polish_revanchism_desc: "มีไมกี่ชาติที่สูญเสียมากมายในเวลาอันสั้นเชนนี้ หากยังมีความยุติธรรมอยู เราจะทวงทุกอยางคืนมาไมทางใดก็ทางหนึ่ง"
 POL_poland_first: "โปแลนดตองมากอน"
 POL_poland_first_desc: "ประโยชนของชาติตองมากอนสิ่งที่เรียกวา "ความจริง" เชนเดียวกับที่เราสรางชะตากรรมของตนเอง เราก็ตองสรางขอเท็จจริงของตนเองดวย"
 POL_ideological_fanaticism: "การศึกษาแบบชาตินิยม"
 POL_ideological_fanaticism_desc: "คนหนุมสาวนับไมถวนเขาเรียนในมหาวิทยาลัยทั่วประเทศ และเรากําลังพลาดโอกาสทองที่จะปลูกฝงอุดมคติของโปแลนดที่เรากําลังสรางลงในจิตใจพวกเขา คนหนุมสาวควรไดรับการสงเสริมใหเปนผูรักชาติ นักสู และปราการแหงอุดมคติโปแลนด!"
 POL_the_between_the_seas_concept: "แนวคิดดินแดนระหวางทะเล"
 POL_the_between_the_seas_concept_desc: "ยูเซฟ ปวซุดสกี มีความทะเยอทะยานที่จะสรางพันธมิตรของชาติตาง ๆ ที่ทอดยาวระหวางทะเล ทั้งชาวโปล ชาวโรมาเนีย อดีตสมาชิกเครือจักรภพ และแมแตชาวอิตาลี รวมมือกันเพื่อความอยูรอดของกันและกันโดยไมยอมเสียอธิปไตยแมแตนอย บัดนี้เราอยูในฐานะที่จะทําใหวิสัยทัศนอันกลาหาญของปวซุดสกีเปนจริง การยื่นมือไปยังโรมาเนียจะเปนกาวแรกในการทําใหอินเตอรมาเรียมเปนจริง!"
 POL_treaty_with_lithuania: "สนธิสัญญากับลิทัวเนีย"
 POL_treaty_with_lithuania_desc: "ความบาดหมางเกาตองอยูในอดีต ทุกมิตรลวนจําเปนในยามมืดมนที่รออยูขางหนา"
 POL_the_baltic_alliance: "พันธมิตรกับรัฐบอลติก"
 POL_the_baltic_alliance_desc: "มิตรไมมีวันมีมากเกินไป"
 POL_internationalism: "สากลนิยม"
 POL_internationalism_desc: "ศัตรูของศัตรูอาจเปนมิตรของเราได"
 POL_authoritarianism: "อํานาจนิยม"
 POL_authoritarianism_desc: "ประชาธิปไตยเปนทางออกที่ออนแอสําหรับปญหาที่หนักหนา หากจะใชอํานาจอยางเด็ดขาด อํานาจนั้นตองหลุดพนจากพันธนาการของฉันทามติ"
 POL_paramilitarism: "ลัทธิกึ่งทหาร"
 POL_paramilitarism_desc: "หลักการทางทหารนําไปใชนอกสนามรบได เมื่อทุกภาคสวนของสังคมไดรับการฝกวินัยเหลานี้ พลเมืองทุกคนจะพรอมจับอาวุธไดทันทีที่ไดรับคําสั่ง"
 POL_go_right: "หันขวา"
 POL_go_right_desc: "ความแข็งแกรงคือคุณสมบัติเดียวที่ควรไขวควา เพื่อนบานของเรายอมรับความจริงนี้แลว และเราก็ตองทําเชนกัน"
 POL_military_youth: "เยาวชนทหาร"
 POL_military_youth_desc: "การใหเยาวชนเขารวมองคกรที่สงเสริมวินัยและอุดมการณชาติ จะบมเพาะคนรุนใหมที่จงรักภักดีเพื่อเปนทหารเกณฑในอนาคต"
 POL_seek_accommodation_with_germany: "แสวงหาการประนีประนอมกับเยอรมนี"
 POL_seek_accommodation_with_germany_desc: "ทําไมเราตองสูกัน ในเมื่อเรามีความเหมือนมากกวาความตาง?"
 POL_go_left: "หันซาย"
 POL_go_left_desc: "เราจะเอาชนะศัตรูที่จองจะกลืนกินเราไดก็ดวยการรวมประชาชนเปนหนึ่งเทานั้น"
 POL_political_commissars: "ผูแทนการเมืองประจํากองทัพ"
 POL_political_commissars_desc: "เพื่อรักษาการควบคุมกองทัพ จะมีการแตงตั้งนายทหารการเมืองเพื่อใหแนใจวากองทัพปฏิบัติตามนโยบายของพรรค"
 POL_seek_accommodation_with_USSR: "แสวงหาการประนีประนอมกับสหภาพโซเวียต"
 POL_seek_accommodation_with_USSR_desc: "สหภาพโซเวียตไมตองการสงครามเชนเดียวกับเรา บางทีอาจมีหนทางสะสางประวัติศาสตรระหวางกันโดยไมตองนองเลือด"
 POL_liberalism_focus: "เสรีนิยม"
 POL_liberalism_focus_desc: "เราจะไมลดตัวลงไปเทาพวกทรราชและเผด็จการ อยาลืมวารัฐมีไวรับใชประชาชน ไมใชในทางกลับกัน"
 POL_intervention_focus: "เนนการแทรกแซง"
 POL_intervention_focus_desc: "หากเราเห็นคุณคาของเสรีภาพ เราตองปกปองมันไมเพียงเพื่อตัวเราเอง แตเพื่อชาติทั้งหลายทุกแหงหน หากนั่นหมายถึงสงคราม ก็ใหเปนไป!"
 POL_draw_closer_to_britain: "ใกลชิดกับอังกฤษมากขึ้น"
 POL_draw_closer_to_britain_desc: "อังกฤษใหคํามั่นวาจะปกปองเอกราชของเราจากผูรุกราน เราตองแสดงความซาบซึ้งตามสมควร"
 POL_volunteer_corps: "กองอาสาสมัคร"
 POL_volunteer_corps_desc: "เสรีภาพไมอาจบังคับใชโดยผูที่ไมเต็มใจ มิฉะนั้นจะกลายเปนเรื่องตลกราย อยางไรก็ตาม ผูที่เลือกจับอาวุธเพื่อเสรีภาพตองไดรับปจจัยที่จะทําเชนนั้น"
 POL_militarism_focus: "ลัทธิทหารโปแลนด"
 POL_authoritarianism_focus: "อํานาจนิยม"
 POL_polish_revanchism_focus: "ลัทธิทวงคืนดินแดนโปแลนด"
 POL_slavic_revanchism: "ลัทธิทวงคืนดินแดนโปแลนด"
 POL_internationalism_focus: "สากลนิยม"
 POL_invite_to_faction_tooltip: "ไดรับเชิญเขารวมฝายของ [Root.GetFlag]§Y[Root.GetName]§!\n"
 POL_central_defence_of_poland: "ศูนยกลางการปองกันโปแลนด"
 POL_central_defence_of_poland_desc: "โปแลนดขาดยุทโธปกรณที่จําเปนตอการปองกันภัยคุกคามนับไมถวนที่ชายแดน การขยายกระทรวงกลาโหมจะทําใหเรามีความพรอมยิ่งขึ้นในการสูกับกองทัพใดก็ตามที่ตองการยํ่ายีโปแลนดภายใตการยึดครอง"
 POL_modernize_congressional_factories: "ปรับปรุงโรงงานในโปแลนดคองเกรสใหทันสมัย"
 POL_modernize_congressional_factories_desc: "โปแลนดคองเกรสเปนภูมิภาคที่ใหญที่สุดและเปนเอกภาพที่สุดของประเทศ และมีศักยภาพในการเติบโตสูงสุดในโปแลนดทั้งหมด การปรับปรุงเมืองใหญอยางวอรซอใหทันสมัยจะเปลี่ยนโปแลนดคองเกรสใหเปนหัวใจทางอุตสาหกรรมของชาติ"
 POL_expand_katowice_mines: "ขยายทรัพยากรคาโตวิตเซ"
 POL_expand_katowice_mines_desc: "แมจะมีขนาดคอนขางเล็ก แตไซลีเซียตอนบนก็เปนขุมทรัพยของเหล็กกลาและอะลูมิเนียม แมการควบคุมไซลีเซียทั้งหมดจะเปนสิ่งที่ดีที่สุด แตตอนนี้เราตองใชประโยชนจากอุตสาหกรรมไซลีเซียตอนบนใหเต็มที่"
 POL_abolish_segregated_seating: "ยกเลิกการแบงที่นั่ง"
 POL_abolish_segregated_seating_desc: "โปแลนดเปนดินแดนของผูคนตางเชื้อชาติ วัฒนธรรม และศาสนา แตในระบบการศึกษาเรากลับแยกพวกเขาออกจากกัน หากทุกคนเปนชาวโปลอยางแทจริง พวกเขาก็ควรอยูรวมกันและแลกเปลี่ยนความคิดไดอยางเสรี การแบงที่นั่งไมใชอะไรนอกจากขอจํากัดตอการศึกษาของเรา และตองถูกยกเลิก"
 POL_agrarian_reform: "การปฏิรูปเกษตรกรรม"
 POL_agrarian_reform_desc: "การนัดหยุดงานของชาวนากําลังจะเกิดขึ้น ราคาอาหารทั่วประเทศพุงสูงลิ่ว และทั้งอุตสาหกรรมที่ไมเชื่อมโยงกันกับการที่รัฐบาลไมชวยเหลือคนยากจนที่สุดของโปแลนด ลวนสรางความไมสงบอยางมากในหมูชาวนา อยางไรก็ตาม ดวยการลงทุนและการปฏิรูปที่เพียงพอ เรานาจะตอบสนองขอเรียกรองของชาวนาไดอยางเหลือเฟอ"
 POL_invest_in_eastern_poland: "ลงทุนในโปแลนดตะวันออก"
 POL_invest_in_eastern_poland_desc: "ภาคตะวันออกแหงแลงและรกราง ถูกทั้งรัสเซียและรัฐโปแลนดละเลยโดยสิ้นเชิง ที่นั่นมีทําเลเหมาะสําหรับโรงงานมากมาย และมีแรงงานอีกมากพอ หากเราเลือกที่จะลงทุนในสิ่งเหลานี้"
 POL_complete_the_plan: "ทําแผนใหสําเร็จ"
 POL_complete_the_plan_desc: "ถึงเวลาทบทวนแผนสี่ปและเตรียมแผนสําหรับการสรางอุตสาหกรรมโปแลนดในสี่ปถัดไป! ยิ่งเราลงทุนในโปแลนดและอุตสาหกรรมของประเทศมากเทาไร เราก็จะยิ่งพรอมรับสิ่งที่ซอนอยูในอนาคตทางอุตสาหกรรมของโปแลนดมากเทานั้น"
 POL_woo_the_sanation_generals: "เอาใจนายพลซานัตซยา"
 POL_woo_the_sanation_generals_desc: "คณะเสนาธิการทหารฝายซานัตซยาไมพอใจและไมจงรักภักดีตอระบอบ บางคนอาจบอกวาความโอหังของซานัตซยาเองทําใหจําเปนตองกวาดลางเสนาธิการทหาร แตเรารูดีวาคนเหลานี้มีคาเกินกวาจะหาใครมาแทนได"
 POL_sanationist_army: "กองทัพซานัตซยา"
 POL_sanationist_army_desc: "เมื่อกองบัญชาการระดับสูงฝายซานัตซยาที่จงรักภักดีอยูใตการควบคุมของเราแลว ถึงเวลาใชประสบการณของคนรุนเกาในหมูทหาร"
 POL_purge_the_sanation: "กวาดลางซานัตซยา"
 POL_purge_the_sanation_desc: "นายพลซานัตซยาเปลี่ยนใจงายและไมจงรักภักดี และพิสูจนแลววาภักดีตอตนเองมากกวาตอโปแลนด! เราตองกวาดลางนายพลทุกคนที่เกี่ยวของกับรัฐประหารของซานัตซยาออกจากกองบัญชาการสูงสุด!"
 POL_appoint_new_officers: "แตงตั้งนายทหารใหม"
 POL_appoint_new_officers_desc: "เมื่อกวาดลางนายพลที่ไมจงรักภักดีออกจากคณะเสนาธิการแลว เรามีโอกาสมอบอํานาจใหผูที่ใสใจอธิปไตยของโปแลนดอยางลึกซึ้ง และไมภักดีตอกลุมปราสาท ฝายซาย หรือฝายขวา"
 POL_new_military_academy: "โรงเรียนนายรอยแหงใหม"
 POL_new_military_academy_desc: "กองบัญชาการสูงสุดของเราวางเปลา แตนี่คือโอกาสทองที่จะหวานเมล็ดพันธุเพื่ออนาคต ใหแนใจวานายพลในอนาคตจะจงรักภักดีตอชาติและไดรับการศึกษาศิลปะการสงครามอยางดีเยี่ยม การใหทุนแกโรงเรียนทหารทั่วประเทศจะทําใหนายทหารโปแลนดรุนใหมมีคุณภาพสูงกวารุนกอน ๆ ทั้งหมด"
 POL_attract_foreign_motors: "ดึงดูดบริษัทยานยนตตางชาติ"
 POL_attract_foreign_motors_desc: "แมบางคนจะยืนกรานวาแบบดั้งเดิมของ LRL ของโปแลนดคืออนาคตของยุทโธปกรณยานยนตโปแลนด แตคําถามยังคงอยูวาทําไมเราตองคิดคนลอขึ้นใหม ในเมื่อเพียงแคตั้งศูนยลอก็พอ? บริษัทยานยนตตางชาติเชี่ยวชาญศิลปะการผลิตที่ถูกกวา เร็วกวา และแข็งแกรงกวา จึงดูสมเหตุสมผลที่จะเชิญพวกเขามาออกแบบยุทโธปกรณใหเรา!"
 POL_adaptive_designs: "การออกแบบเชิงปรับใช"
 POL_adaptive_designs_desc: "การรักษาใบอนุญาตของผูออกแบบตางชาติเริ่มเปนภาระคาใชจายมหาศาลของรัฐ แตบางทีอาจมีวิธีดัดแปลงแบบทางทหารใหใชประโยชนในภาคเอกชนได การกระจายวัสดุสวนหนึ่งใหคนมั่งมีอาจชวยบรรเทาคาใชจายในการจางบริษัทออกแบบตางชาติเหลานี้"
 POL_complete_april_constitution: "ทํารัฐธรรมนูญเดือนเมษายนใหสมบูรณ"
 POL_complete_april_constitution_desc: "รัฐธรรมนูญเดือนเมษายนคือชุดการปฏิรูปที่ออกแบบมาเพื่อรวมศูนยโปแลนดใหเปนระบอบอํานาจนิยมภายใตประธานาธิบดี รัฐบาลซานัตซยาไดรับความชอบธรรมจากกฎหมายนี้ แตก็ยังมีผูโหยหาระบบเกาอยู รัฐธรรมนูญเดือนเมษายนตองสมบูรณและแกไขเพื่อขยายอํานาจของ [GetAppropriateLeaderNameInBookmark] และรวมศูนยรัฐโปแลนด!"
 POL_consolidate_sanation_government: "รวมพลังรัฐบาลซานัตซยา"
 POL_consolidate_sanation_government_desc: "นับแตยูเซฟ ปวซุดสกี ถึงแกอสัญกรรม รัฐบาลซานัตซยาก็แตกเปนเสี่ยงและไรระเบียบ รัฐบาลแยกออกเปนสามสาย ไดแก กลุมปราสาท ซานัตซยาฝายซาย และซานัตซยาฝายขวา ยังไมแนชัดวากลุมปราสาทจะรักษาการควบคุมระบอบเผด็จการไวไดหรือไม แตรัฐบาลตองหลุดพนจากภาวะลังเลนี้โดยเร็ว หากยังหวังจะตานทานพายุสงครามที่กําลังมาเยือน"
 POL_the_castle: "กลุมปราสาท"
 POL_the_castle_desc: "กลุมปราสาทคือเหลาผูปกครองจากปราสาทวอรซอภายใตการนําของอิกนาตซือ มอชชิตสกี ผูสนับสนุนสถานะเดิมอยางเหนียวแนน การสนับสนุนรัฐบาลในปราสาทจะรักษาเสถียรภาพของชาติ และปองกันไมใหซานัตซยาฝายซายและขวามีฐานพอจะกอรัฐประหาร"
 POL_eliminate_socialist_parties: "กําจัดพรรคสังคมนิยม"
 POL_eliminate_socialist_parties_desc: "สังคมนิยมเปนอุดมการณที่กําลังแพรหลายไปทั่วโลกอยางรวดเร็ว แตโดยพื้นฐานแลวเขากันไมไดกับอุดมคติของรัฐบาลกลุมปราสาท ฝายซายตอตานเราทั้งในรูปของพรรคเกษตรกรรมและพรรคสังคมประชาธิปไตย และในรูปของพรรคคอมมิวนิสตผูทรยศ สังคมนิยมทุกรูปแบบตองไมเปนที่ยอมรับ และพรรคสังคมนิยมทั้งหมดตองถูกสั่งหาม เพื่อเสถียรภาพและความมั่นคงของรัฐโปแลนด"
 POL_dissolve_the_sejm: "ยุบสภาเซยม"
 POL_dissolve_the_sejm_desc: "เซยมยังคงอยูภายใตรัฐบาลซานัตซยาเปนเพียงสัญลักษณของประชาธิปไตยที่โปแลนดเคยยึดถือ แตถึงเวลาแลวที่จะริบอํานาจทั้งหมดของเซยม และมอบอํานาจทั้งหมดใหวุฒิสภาและวุฒิสมาชิกของกลุมปราสาท"
 POL_promote_chemical_industry: "สนับสนุนอุตสาหกรรมเคมี"
 POL_promote_chemical_industry_desc: "กอนยุครัฐบาลซานัตซยา อิกนาตซือ มอชชิตสกี เปนปญญาชนและนักเคมี บัดนี้ในฐานะประมุขแหงรัฐโปแลนด มอชชิตสกีอยูในฐานะที่จะสนับสนุนอุตสาหกรรมเคมีและการศึกษาดานนี้ได"
 POL_camp_of_national_unity: "รักษาระบอบเผด็จการ"
 POL_camp_of_national_unity_desc: "ซานัตซยาฝายซายและขวาไมมีอํานาจพอจะเปนภัยคุกคามที่แทจริงตอรัฐบาลอีกตอไป สิ่งที่เหลืออยูคือการยุบกลุมเหลานี้อยางเปนทางการ รักษาการนําของอิกนาตซือ มอชชิตสกี และนําโปแลนดสูอนาคตใหมที่สดใสกวา"
 POL_the_sanation_left: "ซานัตซยาฝายซาย"
 POL_the_sanation_left_desc: "ซานัตซยาฝายซายภักดีตอวาเลรี สวาเวก เปนตัวแทนของผูที่เห็นวาสวาเวกคือผูสืบทอดที่แทจริงของปวซุดสกี และตองการประนีประนอมกับฝายคาน แทนที่จะขับไลออกจากรัฐบาลโดยสิ้นเชิงอยางที่ฝายขวาและกลุมปราสาทตองการ แมการรวมมือกับพวกเขาอาจทําใหซานัตซยาฝายขวาไมพอใจ แตฝายซายกุมอํานาจภายในที่เราจําเปนตองใชสรางคณะรัฐมนตรีที่มีความสามารถ"
 POL_modus_vivendi: "โมดุส วิเวนดี"
 POL_modus_vivendi_desc: "ซานัตซยาฝายซายตองการประนีประนอมกับฝายคานภายในรัฐ โดยมอบตําแหนงอํานาจในรัฐบาลให เมื่อสมาชิกฝายคานไดรับการเปนตัวแทนอยางเหมาะสม พวกเขาก็อาจไมตอตานระบอบเผด็จการอีกตอไป"
 POL_draft_a_new_constitution: "รางรัฐธรรมนูญฉบับใหม"
 POL_draft_a_new_constitution_desc: "สวาเวกมีความทะเยอทะยานมานานที่จะแกไขรัฐธรรมนูญของโปแลนด และหากไดรับสิทธิ์ทําเชนนั้น อาจทําใหเราควบคุมรัฐโปแลนดไดโดยตรงมากขึ้นและพัฒนารัฐธรรมนูญเดือนเมษายนใหดียิ่งขึ้น"
 POL_department_for_home_defence: "กรมปองกันมาตุภูมิ"
 POL_department_for_home_defence_desc: "โปแลนดขาดการปองกันมาตุภูมิที่จําเปนตอการตานศัตรูทั้งสองฟากชายแดนมานาน การจัดตั้งกรมปองกันมาตุภูมิจะทําใหเราเชี่ยวชาญวิธีการสงครามที่จําเปนตอการปกปองรัฐของเรา"
 POL_legion_of_merit: "ลีเจียนแหงคุณความดี"
 POL_legion_of_merit_desc: "ลีเจียนแหงคุณความดีเปนแนวคิดของวาเลรี สวาเวก ซึ่งจะมอบสถานะพิเศษแกพลเมืองของสาธารณรัฐที่พิสูจนแลววาสรางประโยชนอยางโดดเดนตอรัฐ เกียรตินี้จะรับประกันตําแหนงในวุฒิสภาแกผูไดรับ และผูที่ไดรับเชิญเขาลีเจียนยอมแทบไมมีเหตุผลใหไมพอใจระบอบ"
 POL_the_left_chairman: "ประธานฝายซาย"
 POL_the_left_chairman_desc: "ซานัตซยาฝายซายและขวาเขากันไมไดโดยพื้นฐานทางอุดมการณ แมเราอาจไดประโยชนจากการปฏิรูปที่ฝายขวาเสนอ แตฝายซายตางหากที่มีประโยชนของโปแลนดอยูในใจ และบางทีการมอบอํานาจที่มากขึ้นใหพวกเขาอาจทําใหเรากันฝายขวาออกไปไดทั้งหมด…"
 POL_common_organization_of_society: "องคการรวมของสังคม"
 POL_common_organization_of_society_desc: "สวาเวกมีความทะเยอทะยานมานานที่จะแทนที่ BBWR ดวยโครงสรางอํานาจที่เขาเรียกวา “องคการรวมของสังคม” โครงสรางนี้จะมอบอํานาจปกครองตนเองระดับทองถิ่นอยางมากแกรัฐและตําบลตาง ๆ ของโปแลนดอยางที่ไมเคยมีมากอน ขณะเดียวกันก็รวมศูนยรัฐบาลไวในระบอบอํานาจนิยมที่เขมแข็ง พรอมเขาแทรกแซงการปกครองทองถิ่นในยามสงคราม เมื่อฝายซายขึ้นสูอํานาจ ในที่สุดสวาเวกก็อาจทําความทะเยอทะยานนี้ใหสําเร็จ"
 POL_dissolve_the_bbwr: "ราชาองคใหมในปราสาท"
 POL_dissolve_the_bbwr_desc: "ฝายซายมีอิทธิพลและอํานาจในระบอบเผด็จการมากจนตําแหนงประธานาธิบดีของมอชชิตสกีดูเปนเพียงสัญลักษณเทานั้น สิ่งที่เหลืออยูคือทําใหเปนทางการและขจัดรองรอยทั้งหมดของกลุมปราสาทออกจากรัฐบาล นําสวาเวกขึ้นสูจุดสูงสุดแหงอํานาจในรัฐ"
 POL_the_sanation_right: "ซานัตซยาฝายขวา"
 POL_the_sanation_right_desc: "ซานัตซยาฝายขวาคือผูติดตามเอดวารด รึตส-ชมิกวือ ประกอบดวยนายพลและนายทหารระดับสูงเปนหลัก ในฐานะขุมกําลังทางทหารของรัฐบาลซานัตซยา ฝายขวาอยูในตําแหนงที่พรอมจะยึดอํานาจรัฐบาล แตการมอบอํานาจและสัมปทานใหพวกเขาอาจรับประกันความภักดีตอไป และอาจรวมพวกเขาเขากับกลุมปราสาทได"
 POL_support_right_paramilitaries: "สนับสนุนกองกําลังกึ่งทหารฝายขวา"
 POL_support_right_paramilitaries_desc: "พวกฟาลังกิสตในเวทีการเมืองโปแลนดมักถูกบรรยายวาคลั่งลัทธิ เปนฟาสซิสต และเทียบไดกับนาซีดวยซํ้า แตวาทศิลปของพวกเขาดึงดูดผูรักชาติโปแลนด และเยชือ รุตกอฟสกี เสนอใหจัดตั้งกองกําลังกึ่งทหารจากอาสาสมัครหนุมสาวที่พรอมสูและพลีชีพเพื่อเอกราชของโปแลนด"
 POL_codify_national_unity: "บัญญัติคายเอกภาพแหงชาติ"
 POL_codify_national_unity_desc: "คายเอกภาพแหงชาติเปนตัวแทนผลประโยชนรวมของซานัตซยาฝายขวาและกลุมปราสาท ที่ผานมานโยบายและเปาหมายของกลุมยังคลุมเครือ อยางไรก็ตาม เราอาจแกไขรัฐธรรมนูญเดือนเมษายนเพื่อตรึงคุณคาแหงชาตินิยม กฎหมายและความสงบเรียบรอย และการตอตานคอมมิวนิสตไวเปนรากฐานของสาธารณรัฐ"
 POL_second_man_of_the_state: "บุคคลที่สองแหงรัฐ"
 POL_second_man_of_the_state_desc: "ซานัตซยาฝายซายถูกกันออกไปมากพอแลว และบัดนี้ชมิกวือกับมอชชิตสกีสามารถขจัดอิทธิพลทั้งหมดของฝายซายออกจากรัฐบาลได ชมิกวือจะไดรับแตงตั้งเปน “บุคคลที่สอง” ซึ่งหมายความวาในยามสงคราม มอชชิตสกีตองสละตําแหนงประธานาธิบดีใหซานัตซยาฝายขวาและกองทัพ"
 POL_ozon: "ชัยชนะของ OZN"
 POL_ozon_desc: "แมขอตกลงจะระบุวามอชชิตสกีตองสละตําแหนงในยามสงคราม แตก็ชัดเจนวาภัยคุกคามที่ชายแดนเกินกวาที่เราจะตานไหว และสงครามกําลังใกลเขามา เมื่อชมิกวือควบคุมประเทศโดยสมบูรณ รัฐบาลฝายทหารและพลเรือนจะเปนหนึ่งเดียว และเราจะพรอมสูกับผูใดก็ตามที่คุกคามอธิปไตยของโปแลนด"
 baltic_security_opinion: "ปกปองความมั่นคงแหงบอลติก"
 POL_align_with_the_west: "เขาขางตะวันตก"
 POL_align_with_the_west_desc: "อังกฤษ ฝรั่งเศส และมหาอํานาจตะวันตกอื่น ๆ เปนผูปกปองอธิปไตยของโปแลนดอยางแข็งขันมานาน เราจึงควรใหประเทศของเราอยูฝายเดียวกับพวกเขา"
 POL_lithuanian_ultimatum: "คําขาดตอลิทัวเนีย"
 POL_lithuanian_ultimatum_desc: "หลายปมาแลวที่เราอยูในภาวะสงครามกับลิทัวเนียอยางเปนทางการ แมจะไมมีฝายใดเคลื่อนไหวเชิงรุกเลยนับแตการผนวกวิลนีอุส เมื่อเยอรมนีกวาดไปทั่วทวีปและยึดสิ่งที่ตองการดวยเพียงการขูวาจะทําสงคราม บางทีเราก็อาจทําเชนเดียวกันกับลิทัวเนีย เรียกรองใหยุติความเปนปรปกษเพื่อประโยชนของทั้งสองชาติ"
 POL_lithuanian_alliance: "พันธมิตรลิทัวเนีย"
 POL_lithuanian_alliance_desc: "เราไดสงบศึกกับอดีตศัตรูทางเหนือแลว แตบัดนี้เราตองเรียนรูที่จะกาวไปขางหนาดวยกันในฐานะมิตร ศัตรูและพันธมิตรของเราเปนกลุมเดียวกัน จึงเปนเรื่องธรรมดาที่ลิทัวเนียจะเขาขางมหาอํานาจเดียวกับเรา"
 POL_lithuanian_annexation: "เรียกรองใหผนวกลิทัวเนีย"
 POL_lithuanian_annexation_desc: "เมื่อเยอรมนีผนวกออสเตรียในอันชลุสส ก็เห็นไดชัดวาสหภาพเกาฟนคืนไดหากเพียงรองขอดวยทาทีกาวราวสักหนอย บางทีเราอาจชี้ใหลิทัวเนียเห็นวาพวกเขาจะปลอดภัยกวามากหากไดอยูในรัฐที่ใหญและทรงพลังกวา… เชนโปแลนด เปนตน"
 POL_restore_the_sejm: "ฟนฟูสภาเซยม"
 POL_restore_the_sejm_desc: "การใชรัฐธรรมนูญเดือนเมษายนเปนความผิดพลาดที่ตองแกไขโดยดวนอยางชัดเจน อํานาจตองคืนสูเซยม และจากนั้นเราตองกําหนดอนาคตของชาติดวยวิถีประชาธิปไตย"
 POL_plan_west: "แผนตะวันตก"
 POL_plan_west_desc: "ฝายอักษะกําลังหายใจรดตนคอเรา แมบางคนในรัฐบาลจะเชื่อวาความสัมพันธกับ [GER.GetLeader] เปนไปดวยดี แตเรารูวาเยอรมันไวใจไมได และแผนการอยางครอบคลุมทางตะวันตกเปนสิ่งจําเปนตอการรักษาอนาคตของโปแลนด"
 POL_the_prusya_line: "แนวปรัสเซีย"
 POL_the_prusya_line_desc: "ปรัสเซียตะวันออกเปนจุดบุกที่สําคัญของเยอรมัน และเปนชองโหวใหญในแนวปองกันปจจุบันของเรา การขยายแนวปอมตามชายแดนปรัสเซียจะทําใหกองทัพของเราปกปองประเทศจากภัยคุกคามทางเหนือไดดียิ่งขึ้น"
 POL_invest_anti_air: "ลงทุนในการตอสูอากาศยาน"
 POL_invest_anti_air_desc: "เราคงไมสามารถผลิตเครื่องบินไดมากกวาเยอรมัน แตก็ไมจําเปนตองมีมากกวา ในเมื่อเราสามารถทุมลงทุนสรางอาวุธตอสูอากาศยานภาคพื้นดินแทนได เมื่อมีโบฟอรสในทุกรัฐ นักบินเยอรมันจะไปไดไมไกลกอนจะเจอปนของเรา"
 POL_the_prusya_army: "ทหารรักษาการณปรัสเซีย"
 POL_the_prusya_army_desc: "ชายแดนที่ติดกับปรัสเซียแทบไมมีการปองกันเลย การลงทุนในปอมปราการปรัสเซียทั้งหมดจะไรความหมายหากไมมีทหารประจําปอม"
 POL_expand_poznan_forts: "ขยายปอมปราการพอซนาน"
 POL_expand_poznan_forts_desc: "พอซนานมีบังเกอรและสิ่งกอสรางปองกันสําคัญอยูมากมายแลว แตยังพัฒนาไดอีกมาก พอซนานคือแนวปองกันดานแรกตอขาศึกและตองปกปองไวไมวาจะตองแลกดวยอะไร"
 POL_local_western_plans: "แผนเฉพาะพื้นที่ภาคตะวันตก"
 POL_local_western_plans_desc: "ตลอดแนวชายแดนโปแลนด-เยอรมนีมีพื้นที่ยุทธศาสตรสําคัญอยูมากมาย การรางแผนที่ครอบคลุมในระดับทองถิ่นลวน ๆ และดําเนินการในเวลาที่เหมาะสม จําเปนตอการอยูรอดของรัฐโปแลนดไมแพแผนการรบใหญของเรา"
 POL_sudeten_mountaineers: "ทหารภูเขาซูเดเตน"
 POL_sudeten_mountaineers_desc: "ซูเดเตนแลนดเปนชายแดนที่ไมมั่นคง แตก็เปนที่มั่นปองกันที่โดดเดนเชนกัน การฝกทหารที่เชี่ยวชาญการรบบนภูเขาจะทําใหเราเหนือกวาเยอรมันในการดําเนินกลยุทธบนยอดเขาสูงแหงซาออลซีเย!"
 POL_complete_plan_west: "ทําแผนตะวันตกใหสําเร็จ"
 POL_complete_plan_west_desc: "กองบัญชาการทหารสูงสุดของโปแลนดพอใจวาไดวางแผนอยางเพียงพอสําหรับความขัดแยงกับเยอรมันที่หลีกเลี่ยงไมไดแลว และถึงเวลายุติแผนตะวันตก"
 POL_sabotage_polish_industry: "กอวินาศกรรมอุตสาหกรรมโปแลนด"
 POL_sabotage_polish_industry_desc: "ศัตรูของเรามีกองทัพที่แข็งแกรงกวาและมากกวามาก แมจะดีหากเชื่อวาเราจะไมเสียพื้นที่ แตความจริงคือเราคงไมอาจตานไหวตลอดไป อยางไรก็ตาม การติดตั้งวัตถุระเบิดในโรงงานและทางรถไฟอาจทําใหสิ่งเหลานี้ไรประโยชนตอศัตรูหากเราถูกยึดครอง"
 POL_plan_east: "แผนตะวันออก"
 POL_plan_east_desc: "เราขัดแยงทางทหารกับรัสเซียมาเปนระยะหลายศตวรรษ และมั่นใจไดวา [SOV.GetLeader] จะพยายามรุกรานโปแลนดเชนเดียวกับผูนํากอนหนาของ[SOV.GetLeader.GetHerHis] ครั้งนี้พวกเขาตองไมสําเร็จ ตองวางแผนใหโปแลนดไดชัยชนะเด็ดขาดเหนือ [SOV.GetNameDef]!"
 POL_eastern_conscripts: "ทหารเกณฑภาคตะวันออก"
 POL_eastern_conscripts_desc: "ผูคนจํานวนมากในโปแลนดตะวันออกถือวาตนเปนชาวยูเครนหรือเบลารุสมากกวาชาวโปล แตถึงอยางนั้นก็ตองโนมนาวใหพวกเขาสู! แมเราอาจพบเพียงไมกี่คนที่ยอมสูเพื่อโปแลนด แตมีนับไมถวนที่พรอมหยิบปนไรเฟลสูกับชาว[SOV.GetAdjective]อยางกระตือรือรน!"
 POL_belorussian_army: "กองทัพเบลารุส"
 POL_belorussian_army_desc: "ในเบลารุสมีกลุมติดอาวุธอิสระมากมายที่พรอมสูกับ [SOV.GetNameDef] สิ่งที่เราตองทําเพียงรับรองพวกเขาอยางเปนทางการและจัดผูนําทางทหารให"
 POL_ruthenian_army: "กองทัพรูทีเนีย"
 POL_ruthenian_army_desc: "ในหมูชาวโปลและชาวยูเครน กระแสตอตาน[SOV.GetAdjective]ทางตะวันออกนั้นรับรูไดชัดเจน ดวยเงินทุนและผูนําทางทหาร กองกําลังกึ่งทหารเหลานี้จะเปนกําลังเสริมชั้นยอดใหกองทัพของเรา"
 POL_fortification_of_belarus: "การสรางปอมปราการทางเหนือ"
 POL_fortification_of_belarus_desc: "ฝงเหนือของโปแลนดตะวันออกไมมีอะไรนอกจากผืนปาทึบตอเนื่องที่แทบไมมีรองรอยอารยธรรม หากเกิดการรุกรานจะปลอยไวเชนนี้ไมได ปาเหลานี้ตองกลายเปนโลปองกันลัทธิบอลเชวิค!"
 POL_fortification_of_ukraine: "การสรางปอมปราการในยูเครน"
 POL_fortification_of_ukraine_desc: "ภาคตะวันออกดอยพัฒนาและเปนสังคมเกษตรกรรม และยูเครนสวนของโปแลนดยังคงเปนจุดออนทางใตที่พรอมถูกรุกราน ตองสรางปอมปราการพื้นฐานตามแนวชายแดนหากเราจะรักษาประเทศใหปลอดภัย!"
 POL_supply_the_rail_nexus: "สงเสบียงสูชุมทางรถไฟ"
 POL_supply_the_rail_nexus_desc: "ทางรถไฟในโปแลนดตะวันออกอยูในสภาพยํ่าแย เทียบไมไดเลยกับภาคกลางของโปแลนด สงครามกับ [SOV.GetNameDef] จะแพหรือชนะขึ้นอยูกับการควบคุมเสบียง และสายสงกําลังบํารุงที่ดีถึงทหารของเราเองคือจุดเริ่มตนที่ยอดเยี่ยม"
 POL_local_eastern_plans: "แผนเฉพาะพื้นที่ภาคตะวันออก"
 POL_local_eastern_plans_desc: "บอยครั้งเราไวใจใหเสนาธิการทหารวางแผนกันเองได แตในสงครามเชนนี้ จําเปนตองเขาแทรกแซงโดยตรงในระดับเล็ก ทุกตารางนิ้วของผืนดินมีความหมาย และเราตองใชความเชี่ยวชาญกับการปะทะที่เล็กที่สุด หากจะหยุดยั้งจักรวรรดินิยม[SOV.GetAdjective]!"
 POL_complete_plan_east: "ทําแผนตะวันออกใหสําเร็จ"
 POL_complete_plan_east_desc: "กองบัญชาการทหารสูงสุดของโปแลนดพอใจวาไดวางแผนอยางเพียงพอสําหรับความขัดแยงกับ[SOV.GetAdjective]ที่หลีกเลี่ยงไมไดแลว และถึงเวลายุติแผนตะวันออก"
 POL_prepare_for_the_inevitable: "เตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 POL_prepare_for_the_inevitable_desc: "เราตานทานมานานเทาที่ทําไดแลว แตดวยสิ่งที่สูญเสียไป ถึงเวลายอมรับความพายแพ โปแลนดลมสลายแลว แตจิตวิญญาณโปแลนดยังคงอยู และยังคงเฝาจองแมยามลี้ภัย ดวยการสนับสนุนที่เพียงพอจากพันธมิตร เราจะสามารถตั้งกองทัพผูลี้ภัย สนับสนุนสหายที่ยังตอตานการยึดครองอยูในมาตุภูมิ และแทรกผูคนที่ภักดีตอโปแลนดเขาไปในหมูศัตรู"
 POL_foreign_air_support: "การสนับสนุนทางอากาศจากตางชาติ"
 POL_foreign_air_support_desc: "ดวยความชวยเหลือจากพันธมิตร เราอาจยังตั้งกองทัพอากาศโปแลนดที่ทรงพลังได การจัดซื้อโรงงานและยุทโธปกรณเปนเพียงจุดเริ่มตนของกองทัพอากาศโปแลนดพลัดถิ่น!"
 POL_foreign_army_support: "การสนับสนุนทางบกจากตางชาติ"
 POL_foreign_army_support_desc: "ดวยผูลี้ภัยจากโปแลนดที่มาสมัครเปนทหารของเราทุกวัน เราเพียงมอบปนไรเฟลให พวกเขาก็พรอมบุกขึ้นภูเขาลูกใดก็ไดเพื่อคํามั่นแหงการกลับบาน เราเพียงตองขอควบคุมอุตสาหกรรมของพันธมิตรมากขึ้น"
 POL_aces_in_exile: "ยอดนักบินพลัดถิ่น"
 POL_aces_in_exile_desc: "ศัตรูอาจยึดมาตุภูมิของเราไปแลว แตนักบินฝมือดีที่สุดของเรายังคงโลดแลนบนฟา และปลุกใจใหทหารของเรามุงหนากลับบานตอไป!"
 POL_foreign_naval_support: "การสนับสนุนทางเรือจากตางชาติ"
 POL_foreign_naval_support_desc: "กองทัพเรือที่หลงเหลืออยูเพียงนอยนิดอยูในสภาพยํ่าแย แมเราอาจไมมีวันฟนฟูใหกลับสูความรุงโรจนดังเดิมได แตการสนับสนุนจากผูอุปถัมภอาจยังมอบปจจัยใหทหารเรือโปแลนดชวยเหลือมิตรของเราในทะเลได"
 POL_resistance_industries: "อุตสาหกรรมแหงการตอตาน"
 POL_resistance_industries_desc: "แมจะสูญเสียมาตุภูมิไปแลว เรายังตองการฐานอุตสาหกรรมที่แข็งแกรงเพื่อขยายขาวกรองโปแลนดและพัฒนาพื้นที่ใดก็ตามที่เรายึดคืนจากศัตรูได"
 POL_exile_industries: "อุตสาหกรรมพลัดถิ่น"
 POL_exile_industries_desc: "เมื่อบานเกิดกลายเปนความทรงจําอันหางไกล เราตองเตรียมพรอมสําหรับการกลับคืนดวยการพัฒนาฐานการผลิตพลัดถิ่นตอไป"
 POL_expand_polish_intelligence: "ขยายขาวกรองโปแลนด"
 POL_expand_polish_intelligence_desc: "เมื่อกองทัพของเราแตกพายและถูกบีบใหลงใตดิน โปแลนดจําตองสานตอการตอสูจากเงามืด เราตองใหความสําคัญกับการขยายขาวกรองโปแลนดอยางรวดเร็ว หากยังหวังจะไดกลับบานแมเพียงริบหรี่"
 POL_pomscimy_wawer: "Pomścimy Wawer"
 POL_pomscimy_wawer_desc: "มีเสียงกระซิบจากทองถนนวอรซอวาขบวนการตอตานกําลังเตรียมการเคลื่อนไหวอันอาจหาญตอศัตรู ทั่วทั้งเมือง กําแพงเต็มไปดวยถอยคําอันนาสะพรึงที่สัญญากับศัตรูวาเราจะแกแคน มันจะยากลําบาก แตการลุกฮือครั้งนี้อาจเปนแรงผลักที่เราตองการเพื่อกลับบานและตอบโตศัตรูไดในที่สุด ขบวนการตอตานตองการเพียงการจัดระเบียบจากกองบัญชาการสูงสุดโปแลนด และอาจประสบความสําเร็จได…"
 POL_the_long_push_home: "เสนทางยาวไกลสูบาน"
 POL_the_long_push_home_desc: "การลุกฮือประสบความสําเร็จ! ที่เหลืออยูคือตานทานไวนานพอใหความชวยเหลือมาถึง ดวยประชาชนที่ไดเห็นความนาสะพรึงและความโหดรายของการยึดครองของศัตรูมากับตา กองทัพโปแลนดจะสูดวยพลังเสมือนมีกําลังมากกวาสี่สิบเทา! ครั้งนี้ เราจะไมลม!"
 POL_the_north_sea: "ทะเลเหนือ"
 POL_the_north_sea_desc: "กอนที่เราจะเริ่มคิดโนมนาวมหาอํานาจที่เปนกลางทางเหนือใหเขารวมพันธมิตร เราตองวางรากฐานบนเวทีการทูตโลก เราตองทําใหชาติทางเหนือรูถึงความกระตือรือรนที่จะรวมมือของเรา และสงยูเซฟ เบ็ก ผูมีวาทศิลปไปยังประเทศนอรดิกเพื่อโนมนาวถึงประโยชนมากมายของการเขารวมกับมีนดือมอเชอ"
 POL_finno_polish_pact: "สนธิสัญญาฟนแลนด-โปแลนด"
 POL_finno_polish_pact_desc: "ชาวฟนนอยูในสถานะคลายเรา ติดอยูที่ชายแดนกับชาว[SOV.GetAdjective]ที่ตองการเพียงเห็นชาติของพวกเขาตกเปนเมืองขึ้นของจักรวรรดิอีกครั้ง ฟนแลนดจึงเปนตัวเลือกในอุดมคติสําหรับการขยายมีนดือมอเชอครั้งแรกสูประเทศนอรดิก"
 POL_invite_denmark: "เชิญเดนมารก"
 POL_invite_denmark_desc: "แมจะเปนชาติเล็ก แตเดนมารกควบคุมชองแคบเดนมารก ซึ่งเปนพื้นที่ยุทธศาสตรสําคัญในทะเลบอลติก การดึงเดนมารกเขาฝายเราจะรับประกันเสนทางเขาออกทะเลบอลติก เพียงแตตองเชื่อวาเดนมารกจะอยูรอดได"
 POL_invite_sweden: "เชิญสวีเดน"
 POL_invite_sweden_desc: "สวีเดนมีแนวคิดเรื่องความเปนกลางที่นาสนใจในยามที่ความขัดแยงกําลังทวีขึ้น บางทีเราอาจโนมนาวรัฐมนตรีตางประเทศของพวกเขาไดวาอินเตอรมาเรียมเปนพันธมิตรที่เปนกลางที่สุดในโลก และขอเสนอการปองกันรวมกันนี้คือโอกาสดีที่สุดที่จะยับยั้งการแทรกแซงโดยตรงจากมหาอํานาจโลก"
 POL_invite_norway: "เชิญนอรเวย"
 POL_invite_norway_desc: "ไมใชความลับวาเยอรมันมีความทะเยอทะยานและแผนการตอนอรเวย และในประเทศนั้นก็มีผูพรอมรวมมือกับผูรุกรานตางชาติเหลานี้อยูแลว การยื่นคําเชิญเขารวมอินเตอรมาเรียมคือการมอบโอกาสพิเศษแกชาวนอรเวยที่จะตอตานการรุกรานของเยอรมันโดยไมตองกมหัวให"
 POL_the_mediterranean: "เมดิเตอรเรเนียน"
 POL_the_mediterranean_desc: "ระหวางโปแลนดกับเมดิเตอรเรเนียนคือฝูงลูกแกะที่มีหมาปาจออยูดานหลัง ยูโกสลาเวีย ออสเตรีย แมแตกรีซและตุรกี ลวนเปนเหยื่อของมหาอํานาจนักลาทางตะวันตก เราตองทําใหทุกชาติในคาบสมุทรบอลขานและไกลออกไปรับรูถึงความปรารถนาของเราที่จะปกปองอธิปไตยและความปลอดภัยของประชาชนพวกเขา เมื่อนั้นเราจึงจะยื่นขอเสนอคุมครองอยางเปนทางการและขยายอินเตอรมาเรียมได"
 POL_coerce_czechoslovakia: "ปกปองเชโกสโลวาเกีย"
 POL_coerce_czechoslovakia_desc: "ชาวเช็กและชาวสโลวักเปรียบเสมือนพี่นองของโปแลนด การปกปองพวกเขาไมเพียงเปนประโยชนสูงสุดของเรา แตยังเปนหนาที่ทางศีลธรรมดวย"
 POL_austro_hungarian_alliance: "พันธมิตรออสเตรีย-ฮังการี"
 POL_austro_hungarian_alliance_desc: "แมครั้งหนึ่งออสเตรีย-ฮังการีเคยกักขังชาวโปแลนดไวในจักรวรรดิของตน แตบัดนี้พวกเขาตกเปนเปาของเยอรมันเชนเดียวกับเรา การรวมมือกับเยอรมันดูจะหลีกเลี่ยงไมไดสําหรับพวกเขา แตบางทีหากเราเสนอทางเลือกอื่น พวกเขาอาจไมยอมสงมอบกุญแจราชอาณาจักรให [GER.GetLeader]"
 POL_protect_yugoslavia: "คุมครองยูโกสลาเวีย"
 POL_protect_yugoslavia_desc: "ยูโกสลาเวียอยูในสภาพยํ่าแย และเปนเปาหมายการรุกรานชั้นดีของเพื่อนบานแทบทุกชาติ เราตองเชิญพวกเขาเขารวมมีนดือมอเชอเพื่อคุมครองจากภัยคุกคามทั้งภายในและภายนอกพรมแดน"
 POL_invite_greece: "เชิญกรีซ"
 POL_invite_greece_desc: "ความตึงเครียดระหวางกรีซกับตุรกียังคงรุนแรง และดวยการรุกรานของอิตาลีที่อาจเกิดขึ้น ชาวกรีกยอมไดประโยชนจากการคุมครองของเราอยางไมตองสงสัย"
 POL_control_the_bosporus: "ควบคุมชองแคบบอสพอรัส"
 POL_control_the_bosporus_desc: "พันธมิตรกับโรมาเนียจะไรความหมายโดยสิ้นเชิงหากเราไมสามารถเคลื่อนกองทัพบกและกองทัพเรือผานชองแคบบอสพอรัสได ตุรกีมีความสําคัญทางยุทธศาสตรอยางยิ่งตอชาติเรา และตองโนมนาวใหรวมมือ"
 POL_italian_alliance: "พันธมิตรอิตาลี"
 POL_italian_alliance_desc: "รัฐบาลอิตาลีไมเคยปดบังวาเปนศัตรูตออุดมคติแหงการกําหนดชะตากรรมตนเองที่มีนดือมอเชอเปนตัวแทน แตดวยการเปลี่ยนแปลงที่เหมาะสมในรัฐบาลทั้งของโปแลนดและอิตาลี เราอาจดึงพวกเขามารวมวิสัยทัศนของเราตออนาคตของยุโรปได"
 POL_anti_blitz_vehicles: "ยานตอตานบลิตซ"
 POL_anti_blitz_vehicles_desc: "ศัตรูของเราตองการบดขยี้เราดวยคลื่นกองพลยานเกราะมหาศาล เราคงไมอาจมีรถถังทัดเทียมขาศึกได แตเราสามารถลงทุนในอาวุธที่ออกแบบมาเพื่อทําลายยานพาหนะโดยเฉพาะ ใหขาศึกตองสูญเสียอยางหนัก"
 POL_clamp_down_on_danzig: "ปราบปรามดานซิก"
 POL_clamp_down_on_danzig_desc: "อยางเปนทางการ ดานซิกเปนนครเสรีภายใตการคุมครองของโปแลนด แตระยะหลังนครนี้ตกอยูใตการควบคุมของนาซี และเปนหุนเชิดของอดอลฟ ฮิตเลอร ในทุกดานยกเวนชื่อ รอยดางที่ชายแดนทางเหนือนี้ไมใชอะไรนอกจากสิ่งกีดขวางการคาของโปแลนด และเราตองยึดอํานาจควบคุมนครคืน มิฉะนั้นอาจพังทลายตอเยอรมัน"
 POL_attract_poles_to_gdynia: "ดึงดูดชาวโปลสูกดือเนีย"
 POL_attract_poles_to_gdynia_desc: "เมืองทายิ่งใหญตองการคนเกงมาบริหาร และยังมีชาวโปลนับไมถวนที่รอการจางงาน การสงเสริมการยายถิ่นสูกดือเนียจะทําใหเราสานตอโครงการพัฒนาเมืองทาได"
 POL_ban_the_nazi_party: "สั่งหามพรรคนาซี"
 POL_ban_the_nazi_party_desc: "เราไดรับการสนับสนุนจากประชาชนกดัญสกมากพอที่จะกวาดลางนาซีออกจากนครอยางเปนทางการ และทวงนครคืนใหรัฐโปแลนด!"
 POL_develop_gdansk_ship_building: "พัฒนาการตอเรือกดัญสก"
 POL_develop_gdansk_ship_building_desc: "เมื่อกดัญสกกลับมาอยูใตการควบคุมของเราอีกครั้ง เราจะลงทุนดานการเดินเรือที่นครนี้ตองการอยางยิ่ง เพื่อเริ่มสรางกองทัพเรือบอลติกอันยิ่งใหญที่โปแลนดตองการ!"
 POL_expand_gdynia_seaport: "ขยายเมืองทากดือเนีย"
 POL_expand_gdynia_seaport_desc: "เมื่อกดือเนียไดรับการพัฒนาเปนเมืองการคายิ่งใหญทัดเทียมดานซิกแลว ที่เหลือคือเปดเมืองเพื่อการคาอยางเปนทางการ และเศรษฐกิจของเราจะกลับมาอยูในการควบคุมของเราแตเพียงผูเดียวอีกครั้ง!"
 POL_integrate_gdansk_industries: "ผนวกรวมอุตสาหกรรมกดัญสก"
 POL_integrate_gdansk_industries_desc: "หลายทศวรรษที่กดัญสกถูกแยกจากสวนอื่นของประเทศ แตจะไมเปนเชนนั้นอีกตอไป! การผนวกกดัญสกเขาสูการบริหารของเราจะทําใหเราควบคุมการสงออกและนําเขาไดอีกครั้ง!"
 POL_expand_northern_rail: "ขยายทางรถไฟภาคเหนือ"
 POL_expand_northern_rail_desc: "สินคาโปแลนดทั้งหมดตองเขาออกผานภาคเหนือ แตโครงสรางพื้นฐานที่นั่นยังหางไกลจากที่ควรเปน ภาคเหนือตองไดรับโครงสรางพื้นฐานทางรถไฟที่เหมาะสม"
 POL_join_allies: "เขารวมฝายสัมพันธมิตร"
 POL_join_allies_desc: "อนาคตของ [Root.GetNameDef] อยูในมือของพันธมิตรเกาทางตะวันตก แมเราจะใกลชิดกับฝายสัมพันธมิตรอยูแลว แตการเขารวมอยางเปนทางการจะยืนยันความผูกพันของเราตอตะวันตก และหวังวาตะวันตกจะผูกพันตอโปแลนดเชนกัน"
 uncontrolled_exports: "เศรษฐกิจที่ถูกปดลอม"
 uncontrolled_exports_desc: "ชาติตางชาติควบคุมการสงออกและนําเขาของเราเกือบทั้งหมด ทําใหเศรษฐกิจของเราตกอยูในภาวะถูกปดลอมทางการคา ไมสามารถคาขายกับสวนอื่นของโลกไดอยางเสรี"
 POL_anti_german_offensive: "แผนตอตานเยอรมัน"
 POL_anti_german_offensive_desc: "มีการวางแผนเพื่อดักเยอรมันไวในทองถนนของเมืองในรัฐนี้"
 POL_anti_soviet_offensive: "แผนตอตานรัสเซีย"
 POL_anti_soviet_offensive_desc: "กองทัพโปแลนดไดรับแผนเฉพาะทางขั้นสูงเพื่อรับมือการรุกของ[SOV.GetAdjective]ในรัฐนี้"
 POL_new_military_academy_idea: "โรงเรียนนายรอยแหงใหม"
 POL_looming_peasants_strike: "การนัดหยุดงานของชาวนาที่ใกลจะเกิดขึ้น"
 POL_looming_peasants_strike_desc: "ดวยความโกรธแคนที่ไมมีการดําเนินการใด ๆ เลยเพื่อแกไขความยากจนขนแคนในโปแลนดตะวันออก การนัดหยุดงานของชาวนากําลังจะเกิดขึ้นในโปแลนด หากไมแกไขกอนสิ้นป โปแลนดเสี่ยงตอความไมสงบทั่วประเทศในระดับที่คาดไมถึง"
 POL_great_peasants_strike: "การนัดหยุดงานของชาวนา"
 POL_great_peasants_strike_desc: "การที่รัฐบาลไมดําเนินการใด ๆ นําไปสูการประทวงครั้งใหญทั่วชนบท! การใชกําลังตํารวจมีแตจะยั่วยุและผลักไสผูประทวงมากขึ้น และหากไมรีบดําเนินการ การประทวงครั้งใหญนี้อาจลุกลามเปนสงครามกลางเมืองเต็มรูปแบบ"
 POL_four_year_plan_idea: "แผนสี่ป"
 POL_four_year_plan_complete_1: "แผนสี่ป"
 POL_four_year_plan_complete_2: "แผนสี่ป"
 POL_four_year_plan_complete_3: "แผนสี่ป"
 POL_four_year_plan_complete_4: "แผนสี่ป"
 POL_four_year_plan_idea_desc: "ประเทศนี้ไดดําเนินการสรางอุตสาหกรรมขนาดใหญทั่วประเทศ"
 POL_san_left_desc: "ซานัตซยาฝายซายเปนผูสนับสนุนการปฏิรูป เชื่อวาวาเลรี สวาเวก คือผูสืบทอดที่แทจริงของยูเซฟ ปวซุดสกี อดีตผูเผด็จการ"
 POL_sanation_left_opposition_1: "ซานัตซยาฝายซายตอตานในระดับตํ่า"
 POL_sanation_left_opposition_1_desc: "[Root.GetLeftDesc] ขณะนี้ซานัตซยาฝายซายเปนภัยคุกคามเพียงเล็กนอยตอระบอบเผด็จการ และไมอยูในฐานะที่จะคุกคามเสถียรภาพของระบอบได"
 POL_sanation_left_opposition_2: "ซานัตซยาฝายซายตอตานในระดับปานกลาง"
 POL_sanation_left_opposition_2_desc: "[Root.GetLeftDesc] ขณะนี้ซานัตซยาฝายซายกําลังสะสมอํานาจในระบอบเผด็จการ และสามารถกอกวนการดําเนินงานทางการเมืองประจําวันในภาคพลเรือนได"
 POL_sanation_left_opposition_3: "ซานัตซยาฝายซายตอตานในระดับสูง"
 POL_sanation_left_opposition_3_desc: "[Root.GetLeftDesc] ขณะนี้ซานัตซยาฝายซายทรงอํานาจมาก และสามารถทําใหภาคพลเรือนของเราหยุดชะงักไดหากตองการ"
 POL_sanation_left_opposition_4: "ซานัตซยาฝายซายตอตานในระดับสูงมาก"
 POL_sanation_left_opposition_4_desc: "[Root.GetLeftDesc] ขณะนี้ซานัตซยาฝายซายใกลจะพยายามกอรัฐประหารลมรัฐบาล ดวยความเบื่อหนายตอการถูกกีดกันอยางตอเนื่อง ไมมีใครรูวาสวาเวกจะทําอะไร"
 POL_san_right_desc: "ฝายขวาของรัฐบาลประกอบดวยนายทหารระดับสูงผูทรงอํานาจเปนสวนใหญ ซึ่งรวมตัวกันเบื้องหลังเอดวารด รึตส-ชมิกวือ"
 POL_sanation_right_opposition_1: "ซานัตซยาฝายขวาตอตานในระดับตํ่า"
 POL_sanation_right_opposition_1_desc: "[Root.GetRightDesc] ขณะนี้ซานัตซยาฝายขวาพอใจกับรัฐบาล และแทบไมเปนภัยคุกคามตอระบอบ"
 POL_sanation_right_opposition_2: "ซานัตซยาฝายขวาตอตานในระดับปานกลาง"
 POL_sanation_right_opposition_2_desc: "[Root.GetRightDesc] ขณะนี้ซานัตซยาฝายขวาเริ่มกระสับกระสาย และถือคําสั่งของมอชชิตสกีเปนเพียงคําแนะนํามากกวาคําสั่งจริง"
 POL_sanation_right_opposition_3: "ซานัตซยาฝายขวาตอตานในระดับสูง"
 POL_sanation_right_opposition_3_desc: "[Root.GetRightDesc] ขณะนี้ซานัตซยาฝายขวาเชื่อวาระบอบเผด็จการพยายามบอนทําลายอํานาจของกองทัพ และกําลังใชตําแหนงในกองบัญชาการทหารสูงสุดกอกวนกองทัพโปแลนด"
 POL_sanation_right_opposition_4: "ซานัตซยาฝายขวาตอตานในระดับสูงมาก"
 POL_sanation_right_opposition_4_desc: "[Root.GetRightDesc] ขณะนี้ซานัตซยาฝายขวากําลังเตรียมกอรัฐประหารลมรัฐบาลโปแลนด อํานาจเหนือกองทัพทําใหพวกเขาเปนผูกุมอํานาจที่แทจริงในระบอบเผด็จการ และหากไมยอมออนขอใหในเร็ววัน ฝายขวาอาจฉีกโปแลนดเปนเสี่ยง ๆ"
 POL_april_constitution_1: "รัฐธรรมนูญเดือนเมษายน"
 POL_april_constitution_1_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญมอบอํานาจแทบทั้งหมดแกประธานาธิบดี ใหมีอํานาจสูงสุดเหนือเซยมและวุฒิสภา"
 POL_april_constitution_2: "รัฐธรรมนูญเดือนเมษายน"
 POL_april_constitution_2_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญมอบอํานาจแทบทั้งหมดแกประธานาธิบดี ใหมีอํานาจสูงสุดเหนือเซยมและวุฒิสภา"
 POL_april_constitution_3: "รัฐธรรมนูญเดือนเมษายน"
 POL_april_constitution_3_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญมอบอํานาจแทบทั้งหมดแกประธานาธิบดี ใหมีอํานาจสูงสุดเหนือเซยมและวุฒิสภา"
