 POL_april_constitution_fas: "รัฐธรรมนูญเดือนเมษายนฉบับแกไข"
 POL_april_constitution_fas_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญไดรับการแกไขใหกองทัพมีอํานาจสูงสุดเหนือกิจการทั้งภายในและภายนอก นอกจากนี้ นายทหารระดับสูงยังรับเอาหลักการฟาลังกิสตแบบชาตินิยมสุดโตงมาใช ทําใหความแตกตางระหวางกองทัพกับพวกฟาลังกิสตเหลือเพียงเรื่องทางเทคนิค"
 POL_april_constitution_fas_left: "รัฐธรรมนูญเดือนเมษายนฉบับแกไข"
