 POL_april_constitution_fas_right: "รัฐธรรมนูญเดือนเมษายนฉบับแกไข"
 POL_april_constitution_fas_right_desc: "กฎหมายฉบับนี้ผานสภาเซยมในป 1935 เพื่อรับประกันสันติภาพและเสถียรภาพของรัฐโปแลนดอยางตอเนื่อง รัฐธรรมนูญไดรับการแกไขใหกองทัพมีอํานาจสูงสุดเหนือกิจการทั้งภายในและภายนอก นอกจากนี้ นายทหารระดับสูงยังรับเอาหลักการฟาลังกิสตแบบชาตินิยมสุดโตงมาใช ทําใหความแตกตางระหวางกองทัพกับพวกฟาลังกิสตเหลือเพียงเรื่องทางเทคนิค"
 POL_walery_slawek_chairman: "ประธานฝายซาย"
 POL_edward_rydz_smigly_chairman: "ประธานฝายทหาร"
 POL_right_paramilitarism_idea: "Związek Młodej Polski"
 POL_right_paramilitarism_idea_desc: "เยาวชนทหารแหงโปแลนดเปนองคกรที่กอตั้งโดยเอดวารด รึตส-ชมิกวือ และดําเนินการโดยเยชือ รุตกอฟสกี นักฟาลังกิสตผูทรงอิทธิพล แมอยางเปนทางการองคกรนี้มีไวเพื่อสรางเยาวชนทหาร แตโดยพฤตินัยแลวโครงการนี้ปลูกฝงอุดมคติฟาสซิสตลงในจิตใจที่หลอหลอมไดงายของชายหนุม"
 POL_common_organization_of_society_idea: "องคการรวมของสังคม"
 POL_common_organization_of_society_idea_desc: "ตามความทะเยอทะยานอันยาวนานของวาเลรี สวาเวก โปแลนดไดจัดโครงสรางสังคมใหมใหชุมชนทองถิ่นมีอํานาจปกครองตนเองมากขึ้น ขณะที่ประธานาธิบดียังคงควบคุมอยางเด็ดขาดในระดับชาติ"
 POL_eastern_conscription_idea: "การเกณฑทหารภาคตะวันออก"
 POL_eastern_conscription_idea_desc: "ผูคนที่อาศัยในโปแลนดตะวันออกกําลังไดรับการฝกอยางเรงดวนเพื่อสูกับ [SOV.GetNameDef] หากเกิดสงคราม"
 POL_expand_intelligence_idea: "การขยายขาวกรองโปแลนด"
 POL_expand_intelligence_idea_desc: "เมื่อสูญเสียมาตุภูมิไปแลว โปแลนดทําไดเพียงหวังวาจะกอบกูเอกราชคืนมาดวยการสนับสนุนขบวนการตอตาน และแทรกซึมสายลับเขาไปทั่วดินแดนของศัตรู"
 POL_push_home_idea: "เสนทางอันยาวไกลสูบาน"
 POL_push_home_idea_desc: "เราไดเตรียมการแทรกซึมและยึดมาตุภูมิคืนไวพรอมแลว สิ่งที่เหลือคือการรักษาดินแดนใหอยูใตการควบคุมของโปแลนดอยางมั่นคงนานพอใหพันธมิตรของเรามาถึง แลวโปแลนดก็จะกลับมาเปนของเราอยางแนนอน"
 POL_segregated_seating_abolished: "ยกเลิกการแบงที่นั่งตามเชื้อชาติ"
 POL_segregated_seating_abolished_desc: "หลายทศวรรษที่ผานมา ระบบการศึกษาของโปแลนดมีการแบงแยกที่นั่งสําหรับผูที่มีภูมิหลังทางชาติพันธุตางกัน เมื่อแนวปฏิบัตินี้ถูกยกเลิกไปแลว รัฐก็กําลังมุงหนาสูการสรางสังคมพหุวัฒนธรรมที่ทุกคนเทาเทียมกันอยางแทจริง"
 POL_national_defence_fund_idea: "กองทุนปองกันประเทศ"
 POL_national_defence_fund_idea_desc: "โปแลนดไดลงทุนอยางมหาศาลเพื่อการปองกันประเทศ โดยจัดสรรทรัพยสินจากภาคพลเรือนมาใชในการกอสรางสิ่งปลูกสรางที่เปนประโยชนตอกองทัพ"
 POL_central_defence_of_poland_idea: "การปองกันสวนกลางของโปแลนด"
 POL_central_defence_of_poland_idea_desc: "ประเทศนี้กําลังมุงเนนการกอสรางปอมปราการและผลิตยุทโธปกรณทหารราบ เพื่อเรงเสริมกําลังทหารใหแกประเทศอยางรวดเร็ว"
 POL_baltic_security: "ความมั่นคงแหงบอลติก"
 POL_baltic_security_desc: "แมเราจะพึ่งพาการสนับสนุนจากโลกตะวันตกมาโดยตลอด แตการยอมออนขอใหเยอรมันครั้งแลวครั้งเลาทําใหเราสงสัยวาฝายสัมพันธมิตรจะปกปองเราจริงหรือไมหากถูกรุกราน บางทีหากเราปกปองมิตรรวมชะตาในยุโรปตะวันออกดวยตัวเอง เราอาจรักษาสันติภาพไวไดบาง"
 POL_protect_czechozlovakia: "ปกปองเชโกสโลวาเกีย"
 POL_protect_czechozlovakia_desc: "เปนที่ประจักษแลววา [GER.GetLeader] มีแผนการของ[Ger.GetLeader.GetHerHis]เองสําหรับชะตากรรมของเชโกสโลวาเกีย แผนการที่จะทําใหชาวเชโกสโลวักสูญสิ้นเอกราช กระแสจักรวรรดินิยมนี้จะตองถูกหยุดยั้ง"
 POL_baltic_alliance_focus: "พันธมิตรบอลติก"
 POL_baltic_alliance_focus_desc: "ชาวบอลตยอมเปนเหยื่อรายตอไปอยางไมตองสงสัยหากโปแลนดลมสลาย ดังนั้นจึงเปนการสมควรที่ทั้งสามชาติจะวางความรังเกียจที่มีตอรัฐโปแลนดลง และยืนหยัดเคียงขางเราตอสูกับศัตรูรวมกันทั้งสองฟากของพรมแดน"
 POL_romanian_alliance: "พันธมิตรโรมาเนีย"
 POL_romanian_alliance_desc: "เรามีพันธไมตรีอันยาวนานกับชาวโรมาเนีย เปนพันธมิตรระหวางทะเลทั้งสอง และแมในประวัติศาสตรสิ่งนี้จะมีความหมายไมมากนัก แตถึงเวลาแลวที่เราจะยื่นคําเชิญอยางเปนทางการใหชาวโรมาเนียเขารวมฝายของเรา และทําใหความทะเยอทะยานแหงอินเตอรมาริอุมเปนจริง"
 POL_baltic_ultimatums: "ยื่นคําขาดตอรัฐบอลติก"
 POL_baltic_ultimatums_desc: "เมื่อจัดการลิทัวเนียไดแลว สิ่งที่เหลือคือการนําอดีตสมาชิกเครือจักรภพที่อยูเหนือสุดเขามาในจักรวรรดิที่กําลังเติบโตของเรา ดวยประเทศที่เล็กและกองทัพที่ออนแอเชนนี้ เราไมคิดวาชาวบอลตจะสามารถปฏิเสธคําขาดของเราได"
 POL_sea_to_sea: "จากทะเลสูทะเล"
 POL_sea_to_sea_desc: "เครือจักรภพเปนมากกวาเพียงสหภาพระหวางโปแลนดกับลิทัวเนีย มันคือจักรวรรดิอันรุงโรจนที่สองประกายจากทะเลสูทะเล จากโปแลนดถึงไครเมีย"
 POL_pan_slavic_revanchism: "การทวงคืนดินแดนแบบลัทธิรวมชาวสลาฟ"
 POL_pan_slavic_revanchism_desc: "ขบวนการรวมชาวสลาฟที่ผานมาเปนเพียงเครื่องมือที่เปนประโยชนใหรัสเซียอางความเปนเจาเหนือชาวสลาฟทั้งปวง แตมันก็มีประโยชนในการรวมชาวสลาฟที่กระจัดกระจายใหเปนรัฐรวมอยางยูโกสลาเวียและเชโกสโลวาเกียดวย แลวเหตุใดโปแลนดจะตองเปนขอยกเวนเลา? โปแลนดไมควรใชประโยชนจากกระแสลัทธิรวมชาวสลาฟนี้ดวยหรือ?"
 POL_the_old_borders: "พรมแดนเกา"
 POL_the_old_borders_desc: "ในหลายศตวรรษกอน ชาวสลาฟเคยอาศัยอยูในดินแดนที่ปจจุบันถือวาเปนของเยอรมัน ไดแก พอเมอเรเนีย ไซลีเซีย และปรัสเซีย จักรวรรดินิยมเยอรมันเปนมลทินตอรัฐโปแลนดและชาวสลาฟขางเคียงมาหลายศตวรรษ ถึงเวลาแลวที่เราจะแกไขความผิดพลาดของประวัติศาสตรและทวงคืนสิ่งที่เปนของเราโดยชอบธรรม"
 POL_annex_czech: "ผนวกเชโกสโลวาเกีย"
 POL_annex_czech_desc: "รัฐเชโกสโลวาเกียพิสูจนแลววาไมสามารถปกปองตนเองได ไดแตยอมจํานนและหลบซอนอยูใตการคุมครองของชาติตะวันตก ถึงเวลาแลวที่เราจะนําชาวเช็กและสโลวักเขามาอยูใตการคุมครองของกองทัพโปแลนด"
