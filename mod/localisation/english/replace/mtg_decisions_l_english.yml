 foreign_influence: "อิทธิพลตางชาติ"
 foreign_influence_desc: "ประเทศที่อยูภายใตความคุมครองของเราสมควรไดรับการปกครองที่ดีและเปนธรรมที่สุด อิทธิพลที่บอนทําลายเสถียรภาพจากอุดมการณตางดาวตองถูกจํากัด"
 nation_building: "การสรางชาติใน[From.GetNameDef]"
 nation_building_desc: "เราตองฝกฝนผูบริหารรุนใหมเพื่อนําประชาชน[From.GetAdjective]ออกจากระบอบเผด็จการเบ็ดเสร็จ ไปสูประชาธิปไตยและหลักนิติธรรม"
 socialist_education: "การศึกษาสังคมนิยมใน[From.GetNameDef]"
 socialist_education_desc: "ศัตรูของประชาชน[From.GetAdjective]กําลังแทรกซึมเขาสูพันธมิตรฉันพี่นองของเราและหวานความแตกแยกตอตานขบวนการประชาธิปไตยที่เรากําลังบมเพาะ เราตองชวยรัฐบาลอันชอบธรรมในการอบรมประชาชนใหมดวยศาสตรอันเปนอมตะของมารกซและเอ็งเงิลส"
 paramilitary_training: "การฝกกําลังกึ่งทหารใน[From.GetNameDef]"
 paramilitary_training_desc: "พวกปลุกปนฝายซายและพวกทรยศชั่วชาอื่น ๆ กําลังบอนทําลายชาติ[From.GetAdjective] เราจะชวยเหลือกองกําลังฝายมิตรที่เต็มใจรวมมือกับกองทัพของเรา"
 military_parade: "สวนสนามทางทหารใน[From.GetNameDef]"
 military_parade_desc: "พวกประชาธิปไตย พวกสังคมนิยม พวกชาตินิยม และผลผลิตนารังเกียจอื่น ๆ ของยุคเรืองปญญากําลังกอปญหาใหแกรัฐบาล[From.GetAdjective] เราจะเดินสวนสนามกองทัพอันไรพายของเราผานเมืองหลวงของ[From.GetNameDef] และแสดงใหพวกเขาเห็นถึงความยิ่งใหญของแสนยานุภาพทางทหาร[Root.GetAdjective]"
 police_action: "ปฏิบัติการตํารวจใน[From.GetNameDef]"
 police_action_desc: "ประชาชน[From.GetAdjective]พรอมแลวที่จะรับการปกครองตนเองอยางมีความรับผิดชอบจากตํารวจทองถิ่นและกองกําลังกึ่งทหาร"
 fraternal_republic: "สาธารณรัฐฉันพี่นองใน[From.GetNameDef]"
 fraternal_republic_desc: "ประชาชน[From.GetAdjective]เรียกรองใหกองกําลังของเราเขาแทรกแซงเพื่อขับไลพวกเจาที่ดินและนายทุนปรสิตที่ปกครองพวกเขาอยู"
 ultranationalist_coup: "รัฐประหารของฝายชาตินิยมสุดโตงใน[From.GetNameDef]"
 ultranationalist_coup_desc: "รัฐบาล[From.GetAdjective]ที่ออนแอไมสมควรไดรับการสนับสนุนจากเรา เราตองนํายุคใหมมาสูประชาชนของพวกเขา!"
 military_dictatorship: "เผด็จการทหารใน[From.GetNameDef]"
 military_dictatorship_desc: "ในรัฐบาล[From.GetAdjective]มีจุดออนมากมายที่เราตองกําจัด มีรายงานวาพวกไมมีศาสนา นักสหภาพแรงงาน และแมแตพวกเสรีนิยม อยูในคณะรัฐมนตรีของ[From.GetLeader]"
 MTG_naval_treaties: "สนธิสัญญานาวี"
 MTG_naval_treaties_desc: "เพื่อจํากัดคาใชจายและหลีกเลี่ยงการแขงขันสะสมอาวุธทางทะเลที่สรางความพินาศแกทุกฝายอีกครั้ง มหาอํานาจทางทะเลของโลกไดลงนามในสนธิสัญญาหลายฉบับ เพื่อจํากัดขนาดโดยรวมของกองเรือและขนาดของเรือแตละลํา ในฐานะผูลงนาม เราอยูภายใตขอจํากัดบางประการ แตตราบใดที่คูแขงของเราปฏิบัติตามดวย ดุลแหงอํานาจก็นาจะคงอยูได\n\nขณะนี้กําลังเรือหลักของเราอยู[GetStrengthRatioBritain] [GetRelevantNavalTreatyNation]"
