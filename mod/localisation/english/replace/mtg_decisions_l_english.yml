 USA_congress_desc: "แคปตอลฮิลลมีกฎเกณฑและแนวคิดของตนเอง เราตองทํางานรวมกับพวกเขาเพื่อใหสิ่งตาง ๆ สําเร็จ แตก็มีวิธีทําใหเรามีรัฐสภาที่เห็นอกเห็นใจและสนับสนุนเราในการทํางาน"
