 USA_small_lobby_effort: "การล็อบบี้ขนาดเล็ก"
 USA_small_lobby_effort_desc: "การคอยฟงความเคลื่อนไหวในรัฐสภาและทําใหแนใจวาผูมีอิทธิพลบางคนรูวารัฐบาลกําลังวางแผนอะไร เปนสิ่งที่คุมคาเสมอ"
