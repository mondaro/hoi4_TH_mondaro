 ENG_the_mosley_plan_desc: "การปรับโครงสรางเศรษฐกิจอยางกลาหาญ ควบคูกับการโฆษณาชวนเชื่อและการลงทุนภาครัฐอยางเต็มที่ นาจะกระตุนใหประชาชนรวมแรงรวมใจครั้งใหญเพื่อฟนฟูชาติและเริ่มตนการเสริมสรางกําลังอาวุธของเรา"
 ENG_imperial_conference_decision: "การประชุมจักรวรรดิ"
 ENG_imperial_conference_decision_desc: "การประชุมจักรวรรดิไดเริ่มขึ้นแลว และเราอาจผลักดันวาระของเราไดในสองเดือนขางหนา กอนที่ผูแทนจากประเทศในเครือจักรภพจะเดินทางกลับบาน การปรับปรุงความสัมพันธทางการทูตกับประเทศในเครือจักรภพของเรานาจะเพิ่มโอกาสที่พวกเขาจะเห็นดวยกับขอเสนอของเรา"
 ENG_imperial_conference_discussion_in_progress: "การหารือในการประชุมจักรวรรดิกําลังดําเนินอยู\n"
 imperial_conference_ends_tt: "การประชุมจักรวรรดิสิ้นสุดลง\n"
 ENG_discuss_imperial_defense: "หารือเรื่องการปองกันจักรวรรดิ"
 ENG_discuss_imperial_defense_desc: "เราจะเสนอญัตติใหสมาชิกเครือจักรภพทุกประเทศมีสวนรวมอยางสําคัญในการปองกันจักรวรรดิ"
 ENG_discuss_imperial_trade: "หารือเรื่องการคาภายในจักรวรรดิ"
 ENG_discuss_imperial_trade_desc: "เราจะเสนอญัตติใหสมาชิกเครือจักรภพทุกประเทศเพิ่มการคาแบบใหสิทธิพิเศษภายในจักรวรรดิ เพื่อใหเราทั้งหมดเจริญรุงเรืองยิ่งขึ้น"
 ENG_discuss_imperial_economy: "หารือเรื่องเศรษฐกิจของจักรวรรดิ"
 ENG_discuss_imperial_economy_desc: "เราจะเสนอญัตติใหสมาชิกเครือจักรภพทุกประเทศลงทุนอยางมากในเศรษฐกิจภายในประเทศของตน เพื่อลดการพึ่งพาการลงทุนจากเรา และเสริมความแข็งแกรงใหจักรวรรดิโดยรวม"
 ENG_discuss_appeasement: "หารือเรื่องนโยบายเอาใจ"
 ENG_discuss_appeasement_desc: "เราไดรับคําวิจารณมากมายเกี่ยวกับนโยบายเอาใจ ดังนั้นเราจะนํานโยบายนี้เขาสูการหารือของเครือจักรภพ"
 ENG_discuss_imperial_federation: "หารือเรื่องสหพันธรัฐจักรวรรดิ"
 ENG_discuss_imperial_federation_desc: "นับตั้งแตศตวรรษกอน มีเสียงสนับสนุนใหรวมทุกสวนของจักรวรรดิเขาเปนสหพันธรัฐจักรวรรดิหนึ่งเดียว แทนที่จะกาวตอไปสูทางเลือกของ 'การปกครองตนเอง' ซึ่งหมายถึงเอกราชของประเทศในเครือจักรภพทั้งหมด บัดนี้เราจะเสนอญัตติเพื่อหารือเรื่องนี้เปนครั้งสุดทาย"
 won_british_civil_war: "ชนะสงครามกลางเมืองเมื่อไมถึงหนึ่งปที่ผานมา\n"
 ENG_abdication_crisis: "วิกฤตการสละราชสมบัติของพระเจาเอ็ดเวิรดที่ 8"
 ENG_abdication_crisis_changed_mind: "พระเจาเอ็ดเวิรดที่ 8 ไมไดอภิเษกสมรสกับวอลลิส ซิมปสัน"
 ENG_edward_viii_abdicated: "พระเจาเอ็ดเวิรดที่ 8 ทรงสละราชสมบัติ"
 LIT_move_capital_to_vilnius: "ยายเมืองหลวงไปวิลนีอุส"
 governments_in_exile: "รัฐบาลพลัดถิ่น"
 governments_in_exile_desc: "[GetGovernmentInExileCategoryDesc]"
 governments_in_exile_host_desc: "แมมาตุภูมิของพวกเขาจะถูกขาศึกยึดครอง แตทหารและพลเมืองผูกลาหาญบางสวนก็ยังพรอมจะสูตอไป หากเรารับรองรัฐบาลพลัดถิ่นที่เปนมิตร พวกเขาจะสามารถใชทรัพยากรจากผูอยูอาศัยในตางแดน ผูอพยพ และผูลี้ภัย จัดตั้งหนวยใหมที่จะสูรบเคียงขางเรา"
 governments_in_exile_exiled_desc: "แมมาตุภูมิของเราจะถูกขาศึกยึดครอง แตรัฐบาลก็หลบหนีออกมาได เราตองสรางแรงสนับสนุนใหอุดมการณของเรา รวบรวมผูอยูอาศัยในตางแดน ผูอพยพ และผูลี้ภัยทั้งหมดมาที่นี่ และรวมมือกับประเทศเจาบานเพื่อยึดมาตุภูมิคืน"
 governments_in_exile_ETH_desc: "[ROOT.GetLeader] ไดจัดตั้งรัฐบาลพลัดถิ่นขึ้นชั่วคราวจากฐานที่มั่นของ [ROOT.GetLeader.GetHerHis] ใน [?ETH.host_nation.GetNameDef] สถานการณเลวรายยิ่ง แตยังหางไกลจากความสิ้นหวัง นักรบจํานวนหนึ่งหลบหนีออกมาได และหวังวาจะมีผูมาสมทบมากขึ้นเรื่อย ๆ นอกจากนี้ ราชวงศยังอยูในสถานะที่ดี เราจึงนาจะจัดสรรเงินทุนเพื่อเพิ่มโอกาสในการยึด [ETH.GetName] คืนได\n\n   ยอดคงเหลือในทองพระคลังปจจุบัน: §Y[?ETH_treasury]§! £GFX_ETH_imperial_treasury"
 request_reinstatement: "ขอคืนอํานาจจากฝาย[From.GetAdjective]"
 request_reinstatement_desc: "พันธมิตรผูซื่อสัตยของเราไดชวยยึดคืนดินแดนที่ศัตรูรวมของเรายึดครองไว และมาตุภูมิ[Root.GetAdjective]ก็คอนขางปลอดภัยแลว เราควรขออนุญาตจากประเทศเจาบานเพื่อยายรัฐบาลกลับ และจัดตั้งคณะรัฐมนตรี[Root.GetRulingPartyLong] เพื่อเตรียมพรอมสําหรับการสิ้นสุดของสงคราม"
 grant_parliamentary_audience: "สุนทรพจนในรัฐสภาของฝาย[From.GetAdjective]"
 grant_parliamentary_audience_desc: "การกระทําทารุณของกองกําลังยึดครองที่สรางความหวาดกลัวใน [From.GetNameDef] เปนสิ่งที่ไมอาจยอมรับไดโดยสิ้นเชิง ขอใหเรานําตัวแทนของชาติ[From.GetAdjective]มาใหการตอหนาสภานิติบัญญัติของเรา เพื่อยืนยันตอประชาชน[Root.GetAdjective]ถึงความชอบธรรมในการทําสงครามของเรา"
 lobby_for_parliamentary_support: "ล็อบบี้หาการสนับสนุน"
 public_support_for_from: "การรับรองรัฐบาลพลัดถิ่น[From.GetAdjective]ตอสาธารณะ"
 request_faction_member_support_of_from: "ขอการสนับสนุนจากฝายใหแก [From.GetNameDef]"
 exile_recruitment_campaign: "การรณรงครับสมัครผูพลัดถิ่น[Root.GetAdjective]"
 exile_recruitment_campaign_desc: "ดวยความชวยเหลือจากมิตรของเราใน [From.GetNameDef] ทําใหเรามีฐานปฏิบัติการสําหรับเสริมสรางกําลังเพื่อเตรียมการกลับสู [Root.GetNameDef] อยางผูมีชัย เราควรมุงรวบรวมบุคลากรที่เปนประโยชนเพื่อชวยในความพยายามทางสงคราม"
 exile_extraction_campaign: "การรณรงคนําตัวออกจาก[From.GetAdjective]"
 exile_extraction_campaign_desc: "แมหนวยกองทัพประจําการสวนใหญจะถูกจับและกักกันเมื่อรัฐบาล[From.GetAdjective]ยอมจํานน แตยังมีทหารที่ถูกปลดประจําการใน [From.GetNameDef] ที่พรอมจะควาโอกาสออกจากพื้นที่ยึดครองและชวยในความพยายามทางสงครามของเรา เราจะวางแผนชวยนําตัวหนวยที่ติดคางอยูออกมา เพื่อติดอาวุธและฝกใหพวกเขาสูเพื่อมาตุภูมิ"
 expatriate_donations: "เงินบริจาคจากผูอยูอาศัยในตางแดนของ [From.GetNameDef]"
 expatriate_donations_desc: "ประชาชนผูทุกขยากใน [From.GetNameDef] มีญาติและผูลี้ภัยที่อาศัยอยูในตางแดน ดวยการเรียกรองใหชุมชน[From.GetAdjective]เหลานี้เสียสละเปนพิเศษเพื่อปลดปลอยมาตุภูมิใหเร็วขึ้น เราจะรวบรวมทรัพยากรสําหรับความพยายามทางสงครามไดมากขึ้น"
 request_control_of_navy: "ขอควบคุมกองทัพเรือ[From.GetAdjective]"
 request_control_of_navy_desc: "เพื่อประสิทธิภาพ พันธมิตรของเราจะไดประโยชนอยางมากจากการรวมกองทัพเรือ[From.GetAdjective]เขากับกองทัพเรือของเรา"
 category_exile_forces: "กองกําลังพลัดถิ่น"
 category_exile_forces_desc: "แนวรวมอันเปนหนึ่งเดียวของเราจะบดขยี้ศัตรูที่เกลียดชัง! ดวยการผนึกกําลัง เราจะรวมทรัพยากรที่ดีที่สุดของชาติเราเขาดวยกัน และเอาชนะอุปสรรคทุกอยางที่ผูรุกรานจะโยนใสเรา!"
 weapons_for_the_resistance: "อาวุธสําหรับขบวนการตอตาน[From.GetAdjective]"
 weapons_for_the_resistance_desc: "กลุมผูรักชาติ[From.GetAdjective]หลังแนวขาศึกจะสรางความปนปวนใหศัตรูรวมของเรา หากเราสงกระสุนที่ไวใจไดไปใหพวกเขา"
 purge_infiltrators: "กวาดลางผูแทรกซึม[From.GetAdjective]"
 purge_infiltrators_desc: "มิตรของเราในรัฐบาล[From.GetAdjective]ที่ชอบธรรมกังวลตอการสนับสนุนที่เพิ่มขึ้นตอขบวนการบอลเชวิคและชาตินิยมสุดโตงภายในกองกําลังอาสาสมัครที่รับใชเรา เราควรปลดนายทหารที่ไมภักดีและปลดอาวุธหนวยที่กอการกําเริบกอนที่สถานการณจะบานปลาย อิทธิพลที่เราจะไดรับภายในประเทศของพวกเขาจากเรื่องนี้จะมีคามหาศาล โดยเฉพาะหลังสงคราม"
 unity_parade: "ขบวนพาเหรดเอกภาพ[From.GetAdjective]-[Root.GetAdjective]"
 unity_parade_desc: "ทหารผานศึกของกองกําลังอาสาสมัคร[From.GetAdjective]ไดรับชัยชนะมากมายเหนือศัตรูที่เกลียดชัง และการเสียสละรวมกันของเราคือแหลงแหงความภาคภูมิใจ เราจะจัดขบวนพาเหรดทหารไปทั่วแนวหลังภายในประเทศเพื่อแสดงพลังอันไมรูจักเหน็ดเหนื่อยของเรา! ผูวิจารณรัฐบาล[From.GetAdjective]ที่ชอบธรรมอาจคัดคานวาเปนการสิ้นเปลืองทรัพยากร แตความสําเร็จของเราจะทําใหผูคลางแคลงตองเงียบเสียง"
 joint_training_exercise: "การฝกซอมรวม[From.GetAdjective]-[Root.GetAdjective]"
 joint_training_exercise_desc: "ทั้งทางบก ทางทะเล และทางอากาศ กองกําลังผสมของเราจะบดขยี้ผูรุกรานจอมเผด็จการที่ขับไลพันธมิตร[From.GetAdjective]ของเราออกจากบานเกิดและคุกคามอนาคตของอารยธรรมโลก! เราจะจัดการฝกซอมเพื่อเรียนรูวิธีทําสงครามที่ดีกวาเดิมตอศัตรูรวมของเรา"
