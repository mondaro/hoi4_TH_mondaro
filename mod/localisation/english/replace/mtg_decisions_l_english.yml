 HOL_gateway_to_europe_hol_category: "ประตูสูยุโรป"
 HOL_gateway_to_europe_hol_category_desc: "การชักเยอระหวางอังกฤษกับเยอรมันเหนือการคาของเรากําลังทวีความรุนแรงขึ้น เราตองระมัดระวังในการรับมือกับขอเรียกรองของพวกเขา เพราะการยอมตามฝายหนึ่งมีแนวโนมจะนําไปสูความเปนปรปกษกับอีกฝาย..."
 HOL_gateway_to_europe_ger_category: "ประตูสูยุโรป"
 HOL_gateway_to_europe_ger_category_desc: "ชาวดัตชเปรียบเสมือน 'ประตูหลัง' ที่ชวยใหเราเลี่ยงการปดลอมของอังกฤษและรักษาการคาผานทาเรือของประเทศที่เปนกลางได เราตองกดดันชาวดัตชใหเพิ่มปริมาณการคาที่ยอมใหผานพรมแดนของพวกเขามาถึงเรา"
 HOL_gateway_to_europe_eng_category: "ประตูสูยุโรป"
 HOL_gateway_to_europe_eng_category_desc: "ชาวเยอรมันกําลังใชชาวดัตชเปน 'ประตูหลัง' เพื่อเลี่ยงการปดลอมของเรา โดยอาศัยการเดินเรือและทาเรือของเนเธอรแลนดที่เปนกลางในการสงผานสินคา หากเราตองการใหการปดลอมไดผลยิ่งขึ้น เราตองบีบใหชาวดัตชยอมทําตามเจตจํานงของเรา"
 HOL_attract_foreign_investors: "ดึงดูดนักลงทุนตางชาติ"
 HOL_attract_foreign_investors_desc: "การดึงดูดนักลงทุนใหมารวมลงทุนในการพัฒนาอาณานิคมบางสวนจะชวยแบงเบาภาระทางการเงินของเรา และทําใหเราทุมทรัพยากรใหกับภาคพื้นทวีปไดมากขึ้น"
 HOL_attract_foreign_industry: "ดึงดูดอุตสาหกรรมตางชาติ"
 HOL_attract_foreign_industry_desc: "การดึงดูดอุตสาหกรรมตางชาติเขามาในอาณานิคมของเราจะชวยแบงเบาภาระทางการเงิน และทําใหเราทุมทรัพยากรใหกับการพัฒนาอุตสาหกรรมภายในประเทศไดมากขึ้น"
 HOL_attract_west_indies_oil_companies: "ดึงดูดบริษัทนํ้ามันในหมูเกาะเวสตอินดีส"
 HOL_attract_west_indies_oil_companies_desc: "บริษัทนํ้ามันตางชาติจํานวนมากแสดงความสนใจที่จะสรางโรงกลั่นบนเกาะกือราเซาและอารูบา เพื่อรวมแปรรูปนํ้ามันของเวเนซุเอลาและรับสวนแบงจากความมั่งคั่งที่ตามมา"
 HOL_attract_west_indies_oil_companies_tt: "เพิ่ม §G1§! ชองอาคาร และ §Y1 โรงงานพลเรือน§! ใหแก §Yกือราเซา§! หลังจากใชการตัดสินใจนี้ครบ §Y5§! ครั้ง\n"
 HOL_attract_east_indies_oil_companies: "ดึงดูดบริษัทนํ้ามันในหมูเกาะอีสตอินดีส"
 HOL_attract_east_indies_oil_companies_desc: "ดวยความชวยเหลือของบริษัทนํ้ามันตางชาติ โรงกลั่นในหมูเกาะอีสตอินดีสสามารถขยายไดโดยที่เราไมตองเสียคาใชจายมากนัก ทําใหเรารองรับความตองการนํ้ามันที่เพิ่มขึ้นในเอเชียตะวันออกได"
 HOL_attract_east_indies_oil_companies_tt: "เพิ่ม §G1§! ชองอาคาร และ §Y1 โรงงานพลเรือน§! ใหแก §Yชวา§! §Yสุมาตรา§! หรือ §Yกาลีมันตัน§! หลังจากใชการตัดสินใจนี้ครบ §Y3§! §Y6§! และ §Y10§! ครั้ง ตามลําดับ\n"
 HOL_inundate_the_water_lines: "ปลอยนํ้าทวมแนวปองกันนํ้า"
 HOL_inundate_the_water_lines_desc: "แนวปองกันนํ้าของเนเธอรแลนดที่เตรียมไวอยางดีตองถูกปลอยนํ้าทวมในตอนนี้เพื่อสกัดการรุกคืบของขาศึก แมจะสรางความเสียหายใหแกชนบทก็ตาม"
 HOL_drain_the_water_lines: "ระบายนํ้าออกจากแนวปองกันนํ้า"
 HOL_drain_the_water_lines_desc: "อันตรายไดผานพนไปแลว เราจึงสามารถระบายนํ้าออกจากแนวปองกันนํ้าของเนเธอรแลนด และกลับมาใชพื้นที่ชนบทไดอีกครั้ง"
 HOL_crack_down_on_pacifist_movements: "ปราบปรามขบวนการสันตินิยม"
 HOL_crack_down_on_pacifist_movements_desc: "ขบวนการสันตินิยมตาง ๆ ไดขัดขวางการเสริมกําลังทางทหารของเรามามากพอแลว หากไมอาจโนมนาวเสียงของประชาชนได ก็ตองปดปากดวยกําลัง"
 hol_war_on_pacifism_in_progress: "กําลังจัดการกับลัทธิสันตินิยมอยูแลว\n"
 HOL_establish_pro_war_labor_indoctrination: "ปลูกฝงแนวคิดสนับสนุนสงครามแกแรงงาน"
 HOL_establish_pro_war_labor_indoctrination_desc: "ตราบใดที่แรงงานอยูขางเรา คนที่เหลือก็จะคลอยตามในที่สุด ดวยการแลกกับผลิตภาพในที่ทํางานเพียงเล็กนอย เราจะปลูกฝงความรักชาติใหแกประชาชน และทําใหพวกเขาเขาใจถึงความจําเปนของกองทัพที่เขมแข็งเพื่อปกปองคุณคาของเรา"
 HOL_anti_pacifist_propaganda: "โฆษณาชวนเชื่อตอตานสันตินิยม"
 HOL_anti_pacifist_propaganda_desc: "มีเพียงความทุมเทและทรัพยากรที่จัดสรรมาอยางเจาะจงเทานั้นที่จะเปลี่ยนทัศนคติของประชาชนได เราจะเริ่มการรณรงคโฆษณาชวนเชื่อครั้งใหญ ซึ่งแมจะไมถูก แตจะทําใหผูคนเขาใจวาอีกไมนานเราจะไมอาจปลอยตัวไรการปองกันไดโดยไมตองรับผลที่ตามมา"
 HOL_request_equipment: "ขอยุทโธปกรณ"
 HOL_request_equipment_desc: "กองทัพของเราตองการยุทโธปกรณอยางยิ่งเพื่อรองรับการขยายกําลังที่จําเปน บางทีพันธมิตรที่อาจมีในอนาคตอาจชวยเหลือเราได..."
 HOL_request_equipment_tt: "หรือ\n"
 HOL_request_equipment_tt_2: "§R[From.GetNameDefCap]ตองอนุมัติขอตกลงนี้ โบนัสจึงจะมีผล§!\n"
 HOL_draw_up_combined_staff_plan: "จัดทําแผนเสนาธิการรวม"
 HOL_draw_up_combined_staff_plan_desc: "ความอยูรอดของเราขึ้นอยูกับความรวมมืออยางประสานกันระหวางกองทัพของเรากับกองทัพของพันธมิตรที่อาจมีในอนาคต เราอาจสงคณะผูแทนทางทหารไปเพื่อจัดทําแผนเสนาธิการรวม ซึ่งจะชวยใหความรวมมือนั้นเปนไปไดอยางราบรื่นตั้งแตวินาทีแรกที่ถูกมหาอํานาจศัตรูรุกราน"
 HOL_exchange_intelligence_data: "แลกเปลี่ยนขอมูลขาวกรอง"
 HOL_exchange_intelligence_data_desc: "หนวยขาวกรองของเราประสบความสําเร็จมาบางแลว และอาจเสนอแลกเปลี่ยนขอมูลกับพันธมิตรที่อาจมีในอนาคตได ซึ่งจะชวยเพิ่มความพรอมของทั้งสองชาติอยางมากในการรับมือกับการเคลื่อนไหวเปดฉากที่นาจะเกิดขึ้นมากที่สุดในกรณีถูกรุกราน"
 HOL_prepare_evacuation_of_gold_reserves: "เตรียมอพยพทุนสํารองทองคํา"
 HOL_prepare_evacuation_of_gold_reserves_desc: "ทุนสํารองทองคําของชาติ ซึ่งเปนรากฐานของรัฐบาลแหงชาติ ตองถูกอพยพออกไปหากเกิดการรุกราน หากไมทําเชนนั้น รัฐบาลพลัดถิ่นจะไรอํานาจโดยสิ้นเชิง"
 HOL_prepare_evacuation_of_gold_reserves_tt: "สิ่งนี้จะถูกนําออกเมื่อกลายเปน §Yรัฐบาลพลัดถิ่น§!\n"
 HOL_prepare_evacuation_of_gold_reserves_tt_2: "ไดรับ §Yอํานาจทางการเมือง 100§! และ £legitimacy §Yความชอบธรรม§! เพิ่มขึ้นเมื่อกลายเปน §Yรัฐบาลพลัดถิ่น§!\n"
 HOL_share_military_knowledge: "แบงปนความรูทางทหาร"
 HOL_share_military_knowledge_desc: "หลังจากสันติภาพเกือบ 150 ป เพื่อนบานของเรามีความเขาใจในกิจการทหารที่กาวหนากวาเรามาก บางทีพันธมิตรที่อาจมีในอนาคตอาจยินดีแบงปนความรูบางสวน เพื่อชวยปองกันมาตุภูมิของเราในอนาคต"
 HOL_demand_reduced_dutch_trade_with_germany: "เรียกรองใหเนเธอรแลนดลดการคากับเยอรมนี"
 HOL_demand_reduced_dutch_trade_with_germany_desc: "ชาวดัตชตองถูกบีบใหยอมและปฏิบัติตามขอจํากัดทางการคาที่มีตอเยอรมนี พวกเขาคงไมอยากใหเรารวมพวกเขาเขาไปอยูในขอจํากัดเหลานั้นดวยแน..."
 HOL_demand_increased_dutch_trade_with_germany: "เรียกรองใหเนเธอรแลนดเพิ่มการคากับเยอรมนี"
 HOL_demand_increased_dutch_trade_with_germany_desc: "ชาวดัตชตองถูก... เตือนความจํา... ถึงพันธะทางการคาที่มีตอรัฐเยอรมัน รวมถึงความเปราะบางทางทหารในฐานะเพื่อนบานของเรา แนนอนวาตองทําอยางแนบเนียน"
 HOL_gateway_to_europe_decisions_tt: "หาก[HOL.GetNameDef]ยอมตามขอเรียกรองของเรา เราจะไดรับ §Yอํานาจทางการเมือง§! เทากับผลรวมที่ผูเขารวม §Yประตูสูยุโรป§! ทุกรายไดลงทุนไป ซึ่งขณะนี้มีจํานวน:\n"
 HOL_placate_the_british: "เอาใจอังกฤษ"
 HOL_placate_the_british_desc: "เราตองยอมออนขอใหอังกฤษบางในการเจรจาการคาครั้งนี้ หากตองการขจัดภัยคุกคามที่จะถูกรวมเขาไปในมาตรการควํ่าบาตรทางการคาของพวกเขา"
 HOL_placate_the_germans: "เอาใจเยอรมัน"
 HOL_placate_the_germans_desc: "เราตองยอมออนขอใหเยอรมันบางในการเจรจาการคาครั้งนี้ หากตองการขจัดภัยคุกคามจากการรุกรานในกรณีที่พวกเขาไมพอใจ"
 HOL_radio_oranje: "วิทยุออรันเยอ"
 HOL_radio_oranje_desc: "ถึงเวลาออกอากาศรายการ "วิทยุออรันเยอ" ภาษาดัตชทางสถานี BBC อีกครั้ง เพื่อมอบความหวังทั้งแกผูคนในมาตุภูมิที่ถูกยึดครอง และผูที่กําลังตอสูเพื่ออิสรภาพเคียงขางพันธมิตรของเรา"
 HOL_obtain_dockyard_access: "ขอสิทธิ์ใชอูตอเรือ"
 HOL_obtain_dockyard_access_desc: "ขณะที่ถูกรุกราน มีเรือหลายลําที่ยังอยูระหวางการตอ เรากูเรือบางสวนไวไดโดยลากตัวเรือที่ยังสรางไมเสร็จไปยังอังกฤษ แตตอนนี้เราตองการความชวยเหลือจากอังกฤษเพื่อตอเรือเหลานั้นใหเสร็จ"
 HOL_assemble_air_squadron: "จัดตั้งฝูงบิน"
 HOL_assemble_air_squadron_desc: "ทหารใหมของเราจํานวนหนึ่งแสดงความปรารถนาที่จะเรียนขับเครื่องบินเพื่อทําทุกอยางที่ทําไดบนนานฟา เราควรขอเครื่องบินจากพันธมิตรเพื่อใหพวกเขาไดทําเชนนั้น"
 HOL_request_infantry_equipment: "ขอยุทโธปกรณทหารราบ"
 HOL_request_infantry_equipment_desc: "หากเราจะชวยพันธมิตรในการรบ เราตองไดรับยุทโธปกรณที่จําเปนจากพวกเขาเสียกอน"
 HOL_pull_strings_with_british_industrialists: "ใชเสนสายกับนักอุตสาหกรรมอังกฤษ"
 HOL_pull_strings_with_british_industrialists_desc: "ความรวมมือทางอุตสาหกรรมระหวางอังกฤษกับเนเธอรแลนดดําเนินมาหลายป และกอใหเกิดบรรษัทขามชาติมากมาย เชน Philips และ Royal Dutch Shell บัดนี้เราอาจใชสายสัมพันธกับอังกฤษเหลานี้เพื่อจัดหาเสบียงใหแกกองกําลังพลัดถิ่นของเรา"
 HOL_request_aid_for_the_engelandvaarders: "ขอความชวยเหลือใหแกเอ็งเงอลันตฟารเดอรส"
 HOL_request_aid_for_the_engelandvaarders_desc: "ทะเลเหนือกวา 100 ไมลที่กั้นอังกฤษกับเนเธอรแลนดไมอาจหยุดยั้งชาวดัตชที่ตองการหนีการยึดครองและไปรวมรบกับเพื่อนรวมชาติเพื่อปลดปลอยมาตุภูมิได ดวยเรือพายลําเล็กหรือเรือคายักที่โยกเยก "เอ็งเงอลันตฟารเดอรส" หรือ "นักเดินเรือสูอังกฤษ" เหลานี้กลาฝาทะเลเปดในสภาพที่ยากลําบากเสียจนรอดชีวิตไปถึงไดไมถึงหนึ่งในสิบ เพียงแคลงมือพยายามก็ทําใหพวกเขาอยูในกลุมผูกลาที่สุดในบรรดาผูกลาแลว และเปนหนาที่ของเราที่จะขอใหอังกฤษทําทุกวิถีทางเพื่อเพิ่มโอกาสความสําเร็จของพวกเขา"
 VEN_abc_islands: "หมูเกาะ ABC"
 VEN_abc_islands_desc: "หมูเกาะ ABC ตั้งอยูใกลชายฝงของเรา และวากันตามจริงแลวควรเปนของเราโดยชอบธรรม ไมเพียงแตความใกลชิดทางภูมิศาสตรจะทําใหเรื่องนี้เปนไปตามธรรมชาติ แตนํ้ามันเกือบทั้งหมดของเรายังถูกกลั่นบนหมูเกาะเหลานี้ดวย ทําใหหมูเกาะนี้มีความสําคัญอยางยิ่งตอเศรษฐกิจของเรา ดวยความออนแอของรัฐบาลดัตชในขณะนี้ พวกเขาคงไมกลาปฏิเสธขอเสนออันดีของเราที่จะ 'ชวย' ปองกันหมูเกาะเปนแน..."
 HOL_offer_venezuelan_protection: "เสนอความคุมครองจากเวเนซุเอลา"
 HOL_bernhard: "แบรนฮารด"
 HOL_bernhard_desc: "พระชามาดาของสมเด็จพระราชินีและพระสวามีของเจาหญิงยูเลียนา แบรนฮารด ฟาน ลิปเปอ-บีสเตอรเฟลด ทรงแสดงความปรารถนาอยางแรงกลาที่จะสูรบกับขาศึกเพื่อประเทศ แมเดิมจะทรงเปนชาวเยอรมัน แตบัดนี้ทรงรูสึกเปนชาวดัตชโดยสมบูรณและไมปรารถนาสิ่งใดมากไปกวาการปฏิบัติหนาที่อันรักชาติ ทวาดวยพระอุปนิสัยที่รักอิสระและเปนตัวของตัวเอง รวมถึงความปรารถนาที่จะเขาไปเกี่ยวของกับกิจการตาง ๆ ดวยพระองคเอง การมอบตําแหนงที่ทรงตองการอาจนําไปสูผลลัพธที่คาดไมถึงก็เปนได..."
 HOL_give_bernhard_generalship: "มอบตําแหนงนายพลแกแบรนฮารด"
 HOL_give_bernhard_generalship_desc: "เจาชายทรงแสดงพระประสงคที่จะสูรบเพื่อมาตุภูมิใหม และทรงตองการบัญชาการกองกําลังของเรา รวมทุกขรวมยากกับทหาร และนําพวกเขาไปสูชัยชนะ"
 HOL_pursue_diplomatic_grievances: "เดินหนาเรียกรองความเปนธรรมทางการทูต"
 HOL_pursue_diplomatic_grievances_desc: "การดูหมิ่นที่มุงเปาไปยังเจาชายแบรนฮารด และแทจริงแลวตอรัฐบาลของเราทั้งหมด ไดบานปลายกลายเปนขอพิพาททางการทูตเต็มรูปแบบจนถึงขั้นขมขูทางทหาร เราเรียกรองคําขอโทษโดยทันทีและไมมีเงื่อนไข มิฉะนั้นเราอาจจําตองทําตามคําพูดของเรา..."
 HOL_pursue_diplomatic_grievances_tt: "สิ่งนี้อาจสงผลใหไดเปาหมายสงครามตอเปาหมาย\n"
 HOL_relocate_government_to_batavia: "ยายรัฐบาลไปยังบาตาเวีย"
 HOL_relocate_government_to_batavia_desc: "แผนดินใหญของเราถูกยึดครองแลว แตอาณานิคมของเรายังไมถูกแตะตอง แมจะขัดตอพระประสงคของสมเด็จพระราชินี เราสามารถยายรัฐบาลไปยังบาตาเวีย เมืองหลวงของหมูเกาะอีสตอินดีส และทําสงครามตอจากที่นั่นได"
 HOL_propose_benelux_unification: "เสนอการรวมชาติเบเนลักซ"
 HOL_propose_benelux_unification_desc: "วิกฤตการณทั่วโลกมีอยูมากมาย และเราเปนเพียงชาติเล็ก ๆ ทามกลางชาติมหาอํานาจ หากเราจะฝาพายุที่กําลังจะมาถึง เราตองแสวงหาการรวมเปนหนึ่งในทุกระดับของรัฐบาล แมนั่นจะหมายถึงการสละอธิปไตยก็ตาม"
 HOL_propose_benelux_unification_tt: "§R[BEL.GetNameDefCap]และ[LUX.GetNameDefCap]ตองอนุมัติขอตกลงนี้ โบนัสจึงจะมีผล§!\n"
