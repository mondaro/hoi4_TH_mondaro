 MEX_category_hispanic_solidarity: "ความสมานฉันทฮิสแปนิก"
 MEX_category_hispanic_solidarity_desc: "ความพยายามทางการทูตของเราตองมุงไปที่ประเทศละตินอเมริกาอื่น ๆ เราเปนหนึ่งเดียวกันดวย 'อิสปานิดัด' (ความเปนฮิสแปนิก) และเราตองจัดตั้งพันธมิตรที่แทจริงหากตองการตานทานอิทธิพลตางชาติ"
