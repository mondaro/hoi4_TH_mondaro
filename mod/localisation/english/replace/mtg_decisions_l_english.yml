 USA_raise_the_free_corps_desc: "การเตรียมการของเราเสร็จสมบูรณแลว ทหารผานศึกจากมหาสงครามหลายพันคนพรอมจะจัดตั้งหนวยเพื่อสูรบใหเรา"
 USA_war_plans: "แผนสงคราม"
 USA_war_plans_desc: "กระทรวงกลาโหมไดใชเวลาอยางมากในการเตรียมแผนสําหรับทุกสถานการณ แมจะเปนไปไมไดที่จะคาดการณทุกความเปลี่ยนแปลง แตแผนเหลานี้ก็นาจะชวยใหเราผานพนชวงไมกี่เดือนแรกของสงครามไปได"
