 MEX_category_church_power: "อํานาจของศาสนจักร"
 MEX_category_church_power_desc: "§Yศาสนจักร§! ถูกรัฐปฏิวัติกดขี่มาหลายป นโยบายในอนาคตของเราอาจถูกกําหนดดวยอุดมการณหรือดวยการเมืองตามสภาพจริง แตเราตองลงมืออยางเด็ดขาด"
 MEX_decision_transfer_lands_to_church: "โอนที่ดินใหศาสนจักร"
 MEX_decision_transfer_lands_to_church_desc: "ศาสนจักรกอนการปฏิวัติมีขนาดใหญและมั่งคั่ง เหลานายพลและผูวาการผูละโมบไดยึดที่ดินผืนใหญของศาสนจักรไปจากผูดูแลดั้งเดิม แตบัดนี้เราสามารถคืนใหบางสวนได"
 MEX_decision_nationalize_church_lands: "โอนที่ดินศาสนจักรเปนของรัฐ"
 MEX_decision_nationalize_church_lands_desc: "โบสถและสถาบันศาสนศึกษาเปนทรัพยสินของรัฐบาลอยางเปนทางการ และบาทหลวงกับแมชีก็เปนพนักงานของรัฐ คาใชจายเริ่มกลายเปนภาระหนัก บางทีเราอาจลดรายจายเงินเดือนของรัฐบาลไดดวยการรื้อโบสถเพิ่มอีกสักหนอย?"
 MEX_decision_pardon_cristero_fighter: "นิรโทษกรรมนักรบกริสเตโร"
 MEX_decision_pardon_cristero_fighter_desc: "ประธานาธิบดีกาเยสเปนผูที่ตองรับผิดชอบหลักในการยุยงใหเกิดสงครามกริสเตโร บัดนี้เขา 'กาวลงจากตําแหนง' แลว เราจึงดําเนินการตามขั้นตอนเพื่อรับนักรบกริสเตโรที่มีความสามารถและภักดีเขาสูกองทัพของเราได"
 MEX_decision_assassinate_cristero_traitor: "ลอบสังหารคนทรยศกริสเตโร"
 MEX_decision_assassinate_cristero_traitor_desc: "พวกกบฏที่จับอาวุธขึ้นสูกับรัฐไมสมควรไดรับความสงสาร และจะไมไดรับความปรานี แมขอตกลงสันติภาพที่เจรจากับผูนําศาสนจักรจะมีเจตนายุติการสูรบ แตเรารูวาคนทรยศเหลานี้จะจับอาวุธขึ้นอีกครั้งหากมีโอกาส เราควรชิงลงมือกอน"
 MEX_decision_attend_public_mass: "รวมพิธีมิสซาสาธารณะ"
 MEX_decision_attend_public_mass_desc: "ตลอดยี่สิบปที่ผานมา ประธานาธิบดีเม็กซิโกตางแสดงความเปนปรปกษตอศาสนจักรอยางเปดเผยหรือโดยนัย ทาทีงาย ๆ เพียงไมกี่อยางอาจชวยไดมากในการประสานระบบการเมืองและศาสนาของเราเขาหากัน"
 MEX_decision_prosecute_clergyman: "ดําเนินคดีกับนักบวช"
 MEX_decision_prosecute_clergyman_desc: "รัฐธรรมนูญป 1917 หามบาทหลวงมีสวนรวมในระบบการเมืองของเรา ปรับเงินฐานสวมชุดนักบวชในที่สาธารณะ จําคุกฐานแสดงความเห็นทางการเมือง มีวิธีใหเราโจมตีศาสนจักรและแสดงความเหนือกวาของรัฐเม็กซิโกตอพวกงมงายไดเสมอ"
 MEX_decision_reconciliation_committee: "คณะกรรมการสมานฉันท"
 MEX_decision_reconciliation_committee_desc: "อาชญากรรมมากมายที่ทั้งสองฝายกอไวในชวงสงครามกริสเตียดาไดสรางบาดแผลที่ยังไมหายดี การเปดเผยความอยุติธรรมในอดีตที่ผานมาไมนาน อาจชวยปองกันการละเมิดในอนาคตได"
 MEX_decision_incite_tensions: "ปลุกปนความตึงเครียด"
 MEX_decision_incite_tensions_desc: "ศัตรูภายในของเรายังคงรวมตัวกันตอตานเรา เราตองพรอมเผชิญภัยคุกคามทุกรูปแบบ! เราจะรวมพลผูสนับสนุนในการชุมนุมเพื่อแสดงเจตจํานงอันไมอาจพิชิตของเรา!"
 MEX_category_military_issues: "ปญหาทางทหาร"
 MEX_mission_cedillos_rebellion: "กบฏของเหลากาวดิโย"
 MEX_mission_cedillos_rebellion_desc: "นายพลซาตูรนิโน เซดิโย และเหลากาวดิโยที่เขาขางเขาไดทําการอยางอิสระจากรัฐบาลกลางมาหลายป ความพยายามของ [Root.GetLeader] ในการสรางชาติที่เปนเอกภาพเปนภัยตออํานาจของพวกเขา ดังนั้นพวกเขาจึงพยายามทําลายความกาวหนาของเราไมวาจะดวยวิธีที่ชอบธรรมหรือสกปรก"
 MEX_mission_second_cristiada: "สงครามกริสเตโรครั้งที่สอง"
 MEX_mission_second_cristiada_desc: "การโจมตีพวกลัทธิงมงายใน 'ศาสนจักรศักดิ์สิทธิ์' ของเรากําลังสรางความโกรธเคืองใหกลุมฝายขวาในกองทัพ เราควรผอนปรนแนวทางของเรา หรือไมก็เตรียมเอาชนะพวกเขาในสนามรบ"
 MEX_mission_second_cristiada_dummy: "สงครามกริสเตโรครั้งที่สอง"
 MEX_mission_second_cristiada_dummy_desc: "หากรัฐบาลใชไมแข็งกับศาสนจักรมากเกินไป พวกกริสเตโรอาจจับอาวุธขึ้นอีกครั้งเพื่อโคนลมเรา"
 MEX_mission_second_revolution: "การปฏิวัติเม็กซิโกครั้งที่สอง"
 MEX_mission_second_revolution_desc: "การสนับสนุนศาสนจักรศักดิ์สิทธิ์ของเรากําลังสรางความโกรธเคืองใหกลุมฝายซายและกลุมตอตานศาสนจักรในกองทัพ เราควรผอนปรนแนวทางของเรา หรือไมก็เตรียมเอาชนะพวกเขาในสนามรบ"
 MEX_mission_second_revolution_dummy: "การปฏิวัติเม็กซิโกครั้งที่สอง"
 MEX_mission_second_revolution_dummy_desc: "แมกลุมฆราวาสนิยมในรัฐบาลจะยอมรับการผอนปรนในประเด็นศาสนาไดบาง แตความสัมพันธที่ใกลชิดกับศาสนจักรมากเกินไปอาจยุยงใหนายพลฝายซายจัดและนายพลผูไมนับถือศาสนากอกบฏ"
 MEX_decision_support_spanish_loyalists: "สนับสนุนฝายซายสเปน"
 MEX_decision_support_spanish_loyalists_desc: "เราจะสงปนไรเฟลไปใหรัฐบาลสาธารณรัฐเพื่อปกปองประชาธิปไตยจากผูแยงชิงอํานาจโดยมิชอบอยางฟรังโกและสมุนฟาสซิสตของเขา"
 MEX_decision_support_spanish_fascists: "สนับสนุนฝายขวาสเปน"
 MEX_decision_support_spanish_fascists_desc: "เราจะสงปนไรเฟลไปใหผูฟนฟูความสงบเรียบรอยในสเปน เพื่อใหพวกเขากําจัดภัยคอมมิวนิสตกอนที่มันจะแพรกระจาย"
 MEX_decision_operation_just_cause: "ปฏิบัติการจัสตคอส"
 MEX_category_territorial_integration: "การผนวกรวมดินแดน"
 MEX_category_territorial_integration_desc: "การตอสูเชิงปฏิวัติเพื่อโคนลมรัฐบาลฉอฉลไดมอบการควบคุมประเทศทั้งประเทศเปนรางวัลแกเรา ผูอยูอาศัยในภูมิภาคเหลานั้นรูจักแตการกดขี่ และเพื่อใหไดสัมผัสการปลดปลอยที่แทจริง พวกเขาจะตองถูกรวมเขากับ [MEX.GetNameDef]"
