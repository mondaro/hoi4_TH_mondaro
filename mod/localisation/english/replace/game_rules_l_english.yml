 RULE_OPTION_FIN_DEMOCRATIC_PLAN: "ประชาธิปไตย"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC: "พรรคสังคมประชาธิปไตยฟนแลนดจะเรียกรองตอประชาชนชาวฟนแลนดและนําความเปลี่ยนแปลงครั้งใหญแตไรการนองเลือดมาสูการเมืองฟนแลนด จากนั้นฟนแลนดจะพยายามเขารวมกับชาติประชาธิปไตยมหาอํานาจตะวันตกอื่น ๆ เพื่อรักษาอธิปไตยของประเทศและสังคมแบบอนุรักษนิยม-ซายของตน"
