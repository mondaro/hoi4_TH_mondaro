 RULE_OPTION_ANARCHIST_DESC: "คอมมูนอนาธิปไตยในอารากอนและกาตาลุญญาจะรวมตัวกันเพื่อปราบทั้งฝายฟาสซิสตและคอมมิวนิสต และตอตานแนวคิดเรื่องรัฐชาติโดยสิ้นเชิง"
 RULE_OPTION_INDEPENDENT_COMMUNIST: "คอมมิวนิสตอิสระ"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC: "POUM และพันธมิตรฝายอนาธิปไตยจะสลัดแอกของสตาลินทิ้ง และแสวงหาอุดมการณคอมมิวนิสตอิสระของตนเองหลังสงครามกลางเมือง"
 RULE_OPTION_STALINIST: "คอมมิวนิสตสายสตาลิน"
 RULE_OPTION_STALINIST_DESC: "คอมมิวนิสตที่แทจริงซึ่งรับคําสั่งจากมอสโกจะตอตานฝายอนาธิปไตยและฟาสซิสต จํากัดอิทธิพลของคอมมิวนิสตอิสระ และนํายุคใหมมาสูสาธารณรัฐที่สองภายใตการชี้นําของสตาลิน"
 RULE_OPTION_HISTORICAL_POR_AI_DESC: "ภายใตระบอบของซาลาซาร โปรตุเกสจะเสริมความแข็งแกรงใหเอสตาดูโนวู และพยายามวางตัวเปนกลางในชวงสงครามโลก"
 RULE_OPTION_FASCIST_POR_AI_DESC: "ราฟาเอล เปเรยรา จะเขาควบคุมโปรตุเกสในฐานะผูเผด็จการฟาสซิสต สนับสนุนฝายชาตินิยมในสงครามกลางเมืองสเปน และพยายามเขารวมฝายอักษะในเวลาตอมา"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE: "จักรวรรดิที่หา"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC: "รัฐบาลโปรตุเกสจะยอมรับลัทธิฟาสซิสต ตอสูกับฝายสาธารณรัฐในสงครามกลางเมืองสเปน และพยายามกอบกูดินแดนที่สูญเสียไปในแอฟริกา เอเชีย และอเมริกา เพื่อผงาดขึ้นเปนมหาอํานาจอีกครั้ง"
 RULE_OPTION_NEUTRALITY_MONARCHIST: "ราชาธิปไตยนิยม"
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC: "หลังการฟนฟูสถาบันกษัตริยในโปรตุเกส พระเจาดูอารตีจะเรียกรองการสนับสนุนจากฝายนิยมกษัตริยในบราซิล และพยายามฟนฟูจักรวรรดิโปรตุเกสและบราซิล"
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC: "ภายใตอิทธิพลของสหราชอาณาจักร รัฐบาลประชาธิปไตยจะโคนลมระบอบเผด็จการของซาลาซาร และดวยความชวยเหลือจากอังกฤษ จะมุงพัฒนาอุตสาหกรรมของชาติกอนเขารวมฝายสัมพันธมิตร"
 RULE_OPTION_COMMUNIST_COMINTERN: "คอมมิวนิสต"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC: "โปรตุเกสจะเอนเอียงเขาหาสหภาพโซเวียต สนับสนุนสาธารณรัฐสเปน และพยายามเขารวมโคมินเทิรน"
 RULE_OPTION_COMMUNIST_INDEPENDENT: "สหสาธารณรัฐสังคมนิยมยุโรป"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC: "ฝายคอมมิวนิสตจะโคนลมรัฐบาลและตอสูกับฝายชาตินิยมสเปนในสงครามกลางเมืองสเปน รวมคาบสมุทรไอบีเรียเปนหนึ่งเดียวในนามสหสาธารณรัฐสังคมนิยมยุโรป ปอมปราการสุดทายของยุโรปในการตอตานฟาสซิสต"
 RULE_OPTION_MONARCHIST_ORLEANIST: "ราชาธิปไตยนิยม: ราชวงศออรเลอ็อง"
 RULE_OPTION_MONARCHIST_LEGITIMIST: "ราชาธิปไตยนิยม: ราชวงศบูรบง"
 RULE_OPTION_MONARCHIST_BONAPARTIST: "ราชาธิปไตยนิยม: ราชวงศโบนาปารต"
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC: "AI ของฝรั่งเศสจะพยายามฟนฟูสถาบันกษัตริยฝรั่งเศสและสถาปนาผูอางสิทธิ์ฝายออรเลอ็องขึ้นครองราชย โดยดําเนินตามเสนทางที่เกี่ยวของในผังยุทธศาสตร"
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC: "AI ของฝรั่งเศสจะพยายามฟนฟูสถาบันกษัตริยฝรั่งเศสและสถาปนาผูอางสิทธิ์ฝายเลจิทิมิสตขึ้นครองราชย โดยดําเนินตามเสนทางที่เกี่ยวของในผังยุทธศาสตร"
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC: "AI ของฝรั่งเศสจะพยายามฟนฟูสถาบันกษัตริยฝรั่งเศสและสถาปนาผูอางสิทธิ์ฝายโบนาปารตขึ้นครองราชย โดยดําเนินตามเสนทางที่เกี่ยวของในผังยุทธศาสตร"
