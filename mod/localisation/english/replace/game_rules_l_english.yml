 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION: "คอมมิวนิสต - สหพันธบอลขาน"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC: "บัลแกเรียจะพยายามกอตั้งพันธมิตรบอลขาน ชักจูงเพื่อนบานใหยอมรับการปฏิวัติ และทายที่สุดรวมบอลขานเปนหนึ่งเดียว"
 RULE_OPTION_COMMUNIST_BUL_AI_DESC: "บัลแกเรียจะพยายามเขารวมโคมินเทิรน และรวมรบกับสหายโซเวียตเพื่อตอตานฟาสซิสตและทุนนิยมในยุโรป"
 RULE_OPTION_DEMOCRATIC_LIBERAL: "ประชาธิปไตย - เสรีนิยม"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC: "พรรคประชาธิปไตยบัลแกเรียจะพยายามเขารวมฝายสัมพันธมิตร ขณะสมคบคิดตอตานซารบอริสเพื่อถอดพระองคจากอํานาจและจัดตั้งคณะผูสําเร็จราชการที่ฝกใฝฝายสัมพันธมิตร"
 RULE_OPTION_DEMOCRATIC_SOCIALIST: "ประชาธิปไตย - สังคมนิยม"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC: "รัฐบาลภายใตการนําของนีโคลา มูชานอฟจะดําเนินนโยบายสังคมนิยม พยายามปรับปรุงความสัมพันธกับชาติเพื่อนบานเพื่อกอตั้งสมาพันธรัฐบอลขาน และปกปองบอลขานจากผูรุกรานตางชาติ"
 RULE_OPTION_FASCIST_BUL_AI_DESC: "เมื่อลัทธิฟาสซิสตเติบโตขึ้นในประเทศ ฮริสโต ลูคอฟ ผูนําฝายขวาจะพยายามเขารวมฝายอักษะ และในที่สุดจะโคนลมซารและสถาปนาเผด็จการทหาร"
 RULE_OPTION_HISTORICAL_BUL_AI_DESC: "ซารบอริสที่ 3 จะนําประเทศเขาหาฝายอักษะ อาศัยการไกลเกลี่ยของเยอรมนีเพื่อขยายพรมแดนบัลแกเรียอยางสันติ ในที่สุดจะลงนามในกติกาสัญญาไตรภาคี และชะลอการเขารวมสงครามของบัลแกเรีย"
 RULE_OPTION_THE_RETURN_OF_FERDINAND: "การกลับมาของเฟอรดินานดที่ 1"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC: "หลังการสวรรคตของซารบอริสที่ 3 เฟอรดินานดที่ 1 พระราชบิดาของพระองคจะกลับขึ้นครองบัลลังกอีกครั้ง เพื่อแกแคนผูที่เคยทํารายพระองคเมื่อหลายทศวรรษกอน"
