 RULE_OPTION_ITA_DEMOCRATIC_PLAN: "สังคมนิยมอิตาลี"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC: "กลุมตอตานฟาสซิสตชาวอิตาลีจะรวมมือกันโคนลมระบอบฟาสซิสตดวยกําลัง จัดตั้งรัฐบาลสังคมประชาธิปไตย และพยายามกอตั้งสมาพันธรัฐรวมกับอดีตอาณานิคมในแอฟริกา"
 RULE_OPTION_FIN_FASCIST_PLAN: "ฟาสซิสต"
 RULE_OPTION_FIN_FASCIST_PLAN_DESC: "ฝายขวาของฟนแลนด ซึ่งนําโดยขบวนการประชาชนผูรักชาติ จะโคนลมระบอบประชาธิปไตยอนุรักษนิยมเดิม พยายามกระชับความสัมพันธกับเยอรมนี และอาศัยองคกรอยางมุสตาไปดัตและซูโอเยลุสกุนตาเพื่อพัฒนากองทัพที่แข็งแกรงและขยายพรมแดนของประเทศตามแนวคิดฟนแลนดใหญ"
 RULE_OPTION_FIN_COMMUNIST_PLAN: "คอมมิวนิสต"
