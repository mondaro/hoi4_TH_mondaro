 RULE_HISTORICAL_EST_AI_DESC: "AI ของเอสโตเนียจะคงความเปนกลางตลอดชวงสวนใหญของเกม แตจะกลายเปนรัฐหุนเชิดของโซเวียตในชวงทศวรรษ 1940"
