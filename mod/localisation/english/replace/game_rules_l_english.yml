 RULE_OPTION_CHL_OPERATION_BOLIVAR: "รวมมือกับปฏิบัติการโบลิวาร"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC: "AI ของชิลีจะดําเนินตามเสนทางฟาสซิสต เลือกเขาขางไรชเยอรมันหากมีโอกาส ในที่สุดจะเขาสูสงครามและพยายามฟนฟูราชอาณาจักรชิลีในอดีต"

 RULE_OPTION_CHL_PAN_HISPANISM: "ลัทธิแพน-ฮิสแปนิก"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC: "AI ของชิลีจะดําเนินตามเสนทางฟาสซิสต และในที่สุดเลือกไมเขาขางมหาอํานาจโลกใดๆ ตอมาจะพิชิตโลกฮิสแปนิกหรือรวมเปนหนึ่งเดียวดวยการทูต"

 RULE_OPTION_CHL_ANTI_IMPERIALISM: "ตอตานจักรวรรดินิยม"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC: "AI ของชิลีจะเลือกสนับสนุนองคกรตางๆ ของชาวมาปูเช และในที่สุดใหพวกเขาขึ้นควบคุมประเทศ ตอมาจะทําสงครามครูเสดตอตานจักรวรรดินิยม ขับไลรัฐที่ยุโรปควบคุมออกจากอเมริกาใตและอเมริกากลาง"

 RULE_OPTION_CHL_LE_DELUGE: "ราชอาณาจักรอาราอูกาเนียและปาตาโกเนีย"
 RULE_OPTION_CHL_LE_DELUGE_DESC: "AI ของชิลีจะหันไปพึ่งขนบธรรมเนียม จึงขับอาเลสซันดรีออกจากอํานาจและแตงตั้งอิบันเยซแทน จากนั้นจะเกิดสงครามกลางเมือง ซึ่งอองตวนที่ 3 จะฟนฟูราชอาณาจักรอาราอูกาเนียและปาตาโกเนียในอดีต และประกาศตนเปนผูสืบทอดของนโปเลียน"

 BRA_AI_BEHAVIOR: "@BRA บราซิล"
 RULE_HISTORICAL_BRA_AI_DESC: "วารกัสจะพยายามรักษาอํานาจดวยการกําจัดฝายคานทางการเมืองในบราซิลอยางระมัดระวัง กอนจะเขารวมฝายสัมพันธมิตรและรวมมือกับสหรัฐอเมริกาในที่สุด"
 RULE_OPTION_FASCISM: "ลัทธิฟาสซิสต"
 RULE_FASCISM_BRA_AI_DESC: "ขบวนการอินเตกราลิสตจะทรยศวารกัสและตั้งคนของตนขึ้นเปนผูนํา จากนั้นจะพยายามครอบงําอเมริกาใตดวยการทูตและกําลัง"
 RULE_DEMOCRATIC_BRA_AI_DESC: "บราซิลจะพยายามโคนลมวารกัสดวยการยุติภาวะฉุกเฉิน จากนั้นจะพยายามปฏิรูปประเทศ เพิ่มการมีสวนรวมทางประชาธิปไตย กอนจะรวมมือกับสหรัฐอเมริกาตอตานฝายอักษะในที่สุด"
 RULE_OPTION_MONARCHIST_HENRIQUE: "ราชาธิปไตยนิยม - ดง เปดรู เองรีกี"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC: "AI จะพยายามฟนฟูจักรวรรดิบราซิลดวยการสรางแรงสนับสนุนใหเปดรู เองรีกีในฐานะรัชทายาทโดยชอบธรรม จากนั้นจะพยายามพิชิตหรือผนวกรวมเพื่อนบานของบราซิล"
 RULE_OPTION_MONARCHIST_ALCANTARA: "ราชาธิปไตยนิยม - ดง เปดรู ดี อัลกันตารา"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC: "AI จะพยายามฟนฟูจักรวรรดิบราซิลดวยการสรางแรงสนับสนุนใหเปดรู ดี อัลกันตาราในฐานะรัชทายาทโดยชอบธรรม จากนั้นจะพยายามรวมชาติกับโปรตุเกสอีกครั้งดวยการทูตหรือกําลัง"
 RULE_OPTION_BRA_COMMUNIST_STALINISM: "ลัทธิคอมมิวนิสต - ลูอิส การลุส เปรสตีส"
