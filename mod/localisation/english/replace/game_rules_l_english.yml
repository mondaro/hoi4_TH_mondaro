 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC: "AI จะพยายามกอตั้งสภาปองกันนอรดิกเพื่อปกปองกลุมประเทศนอรดิก"

 RULE_OPTION_NOR_STALINIST: "สตาลินนิสต"
 RULE_OPTION_NOR_STALINIST_AI_DESC: " AI จะพยายามเพิ่มความนิยมของลัทธิคอมมิวนิสต ขณะจัดใหนอรเวยอยูขางสหภาพโซเวียตของสตาลิน หรือประเทศคอมมิวนิสตที่ไมใชทรอตสกีนิสตที่ใหญที่สุดหากสตาลินถูกโคนลม"
 RULE_OPTION_NOR_TROSTSKYIST: "ทรอตสกีนิสต"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC: "AI จะพยายามใหเลฟ ทรอตสกีอยูในนอรเวยและยึดถือหลักการคอมมิวนิสตของเขา ตอตานสหภาพโซเวียตหากยังเปนสตาลินนิสต และเปนพันธมิตรกับโซเวียตหากทรอตสกีขึ้นเปนผูนํา"

 RULE_OPTION_NOR_FASCIST: "นัสโยนัล ซัมลิง"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "AI จะปลอยใหอิทธิพลของฟาสซิสตเติบโตขึ้นตามเวลา และในที่สุดจะเขาขางไรชที่สาม หรือเดินหนาตามลําพังหากเยอรมนีไมไดเปนฟาสซิสตอีกตอไป"
 RULE_OPTION_NOR_MONARCHIST: "ราชาธิปไตยนิยม"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC: "AI จะเริ่มกดดันพระเจาฮากุนที่ 7 ใหยุบสภาสตอรติงและเปลี่ยนนอรเวยเปนราชาธิปไตยแบบคณาธิปไตย"

 RULE_HISTORICAL_FIN_AI_DESC: "AI ของฟนแลนดจะพยายามดําเนินตามลําดับเหตุการณทางประวัติศาสตรใหมากที่สุด"
 RULE_HISTORICAL_DEN_AI_DESC: "AI ของเดนมารกจะพยายามหลีกเลี่ยงความขัดแยงทุกรูปแบบและดําเนินตามเหตุการณทางประวัติศาสตรใหมากที่สุด หากกลายเปนรัฐในอารักขา จะพยายามคอยๆ สรางแรงสนับสนุนจากมหาอํานาจตางชาติ เพื่อกลับมาประกาศเอกราชอีกครั้งในที่สุด"
 RULE_OPTION_DEN_REARMAMENT: "การติดอาวุธใหมของเดนมารก"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC: "เดนมารกจะพยายามแสวงหาพันธมิตรกับชาติที่แข็งแกรงกวา และพยายามตานทานความพยายามรุกรานใดๆ"
 RULE_OPTION_DEN_MONARCHIST: "ราชาธิปไตยแบบขยายดินแดน"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC: "พระเจาคริสเตียนที่ 10 จะพยายามครอบครองทรัพยากรธรรมชาติและเสริมขีดความสามารถทางทหารของเดนมารก ดวยการควบคุมกลุมประเทศนอรดิกที่เหลือดวยทุกวิถีทาง"
 RULE_OPTION_DEN_FASCIST: "เดนมารกฟาสซิสต"
 RULE_OPTION_DEN_FASCIST_AI_DESC: "พรรคฟาสซิสตจะพยายามยึดอํานาจในเดนมารกและฟนฟูจักรวรรดิทะเลเหนือในอดีต"
 RULE_HISTORICAL_ICE_AI_DESC: "AI ของไอซแลนดจะพยายามคงความเปนกลาง และจะขอความคุมครองจากสหรัฐอเมริกาเมื่อจําเปน"
 RULE_OPTION_ICE_SUPPORT: "สนับสนุนเดนมารก"
 RULE_OPTION_ICE_SUPPORT_AI_DESC: "AI ของไอซแลนดจะพยายามสนับสนุนการปองกันของเดนมารกจากผูรุกรานทุกราย"
 RULE_OPTION_ICE_FASCIST: "ฟาสซิสต"
 RULE_OPTION_ICE_FASCIST_AI_DESC: "AI ของไอซแลนดจะประณามกษัตริยเดนมารก และพยายามสรางจักรวรรดิฟาสซิสตในทะเลเหนือ"
 RULE_OPTION_ICE_COMMUNIST: "คอมมิวนิสต"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC: "AI ของไอซแลนดจะประณามสถาบันกษัตริย และสถาปนารัฐคอมมิวนิสตในไอซแลนด"
 RULE_HISTORICAL_NOR_AI_DESC: "นอรเวยจะพยายามคงความเปนประชาธิปไตยและตานทานการรุกรานของเยอรมนี กอนจะสูตอในฐานะรัฐบาลพลัดถิ่นเคียงขางฝายสัมพันธมิตร"

 ### SOUTH AMERICA ###

 CHL_AI_BEHAVIOR: "@CHL ชิลี"
