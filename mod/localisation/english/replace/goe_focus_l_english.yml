 PER_democratic_shortcut: "การเมือง:\nแนวรวมแหงชาติ"
 PER_neutral_shortcut: "การเมือง:\nราชวงศปาหลาวี"
 PER_industry_shortcut: "เศรษฐกิจ"
 PER_army_shortcut: "กองทัพบก"
 PER_air_shortcut: "กองทัพอากาศ"
 PER_navy_shortcut: "กองทัพเรือ"
 PER_fight_for_iran_shortcut: "ศึกชิงอิหราน"

 PER_modernizing_iran: "พัฒนา[ROOT.GetNonIdeologyName]ใหทันสมัย"
 PER_modernizing_iran_desc: "[ROOT.GetNonIdeologyName]ถูกฉุดรั้งดวยความไรระเบียบและการทะเลาะเบาะแวงเรื่องหยุมหยิมมานานเกินไป เราตองเรียนรูที่จะพึ่งพาตนเอง หากเราจะสรางชาติที่ยืนหยัดผานกาลเวลาได ขอใหเรารวมกันสรางอนาคตบนพื้นฐานของความเปนเอกภาพและกาวรับยุคสมัยใหม"
 PER_adult_literacy: "รณรงคการรูหนังสือสําหรับผูใหญ"
 PER_adult_literacy_desc: "การไมรูหนังสือเปนปญหาใหญที่รุมเราประชากรของเรา ความสามารถในการอานเขียนภาษาของตนเองจะชวยเสริมพลังและปลดปลอยประชาชนของเรา คณะรัฐมนตรีและกระทรวงศึกษาธิการไดรวมกันจัดพิมพคูมือการศึกษา พรอมใหคํามั่นวาจะจัดตั้งโรงเรียนสําหรับสอนประชากรวัยผูใหญ"
 PER_national_museum: "เปดพิพิธภัณฑแหงชาติ"
 PER_national_museum_desc: "การบันทึกประวัติศาสตรเปนสิ่งสําคัญ โดยเฉพาะเมื่อ[ROOT.GetNonIdeologyName]ไดถักทอเรื่องราวอันหลากหลายมาตลอดหลายศตวรรษ มีแผนจะเปดพิพิธภัณฑในเตหะรานมาหลายปแลว ถึงเวลาที่จะลงมือทําเสียที"
 PER_foreign_schools: "ควบคุมโรงเรียนตางชาติ"
 PER_foreign_schools_desc: "มีโรงเรียนที่ตางชาติเปนเจาของกระจายอยูทั่วดินแดน[PER.GetAdjective]เปนจํานวนมาก สถาบันเหลานี้อาจถูกมองวาเปนตัวอยางที่ผูนําของเรายอมสละอธิปไตยใหมหาอํานาจตางชาติ เราควรยึดและโอนเปนของรัฐเพื่อการพัฒนาประเทศ"
 PER_foreign_schools_bonus: "โอนโรงเรียนตางชาติเปนของรัฐแลว"
 PER_university_of_isfahan: "สนับสนุนงบประมาณมหาวิทยาลัยอิสฟาฮาน"
 PER_university_of_isfahan_desc: "เราตองการสถาบันการศึกษาแหงใหมที่มุงเนนการผลิตบุคลากรทางการแพทยรุนใหมอยางยิ่ง มหาวิทยาลัยอิสฟาฮานพรอมจะเปนโรงเรียนแพทยที่กาวหนาที่สุดใน[ROOT.GetNonIdeologyName]!"
 PER_university_of_isfahan_bonus: "สนับสนุนงบประมาณมหาวิทยาลัยอิสฟาฮานแลว"
 PER_shiraz_university: "สนับสนุนงบประมาณมหาวิทยาลัยชีราซ"
 PER_shiraz_university_desc: "ในการจัดสรรงบประมาณใหมหาวิทยาลัยแหงใหม เราควรมุงเนนการกอตั้งโรงเรียนเทคนิค ดวยความหวังวาผูสําเร็จการศึกษาจะวางรากฐานให[ROOT.GetNonIdeologyName]ยุคใหม!"
 PER_shiraz_university_bonus: "สนับสนุนงบประมาณมหาวิทยาลัยชีราซแลว"
 PER_educational_reforms: "การปฏิรูปการศึกษา"
 PER_educational_reforms_desc: "เราไดเริ่มการรณรงคการรูหนังสือครั้งใหม เราไดสรางมหาวิทยาลัยใหม ในที่สุดก็ถึงเวลาที่เราจะดําเนินการปฏิรูปการศึกษาครั้งใหม ซึ่งจะสงเสริมความกาวหนาทางสังคมและการพัฒนาของพลเมือง และแกไขปญหาความไมเทาเทียมทางโอกาสทางการศึกษาที่มีมากอน"
 PER_trans_iranian_railway: "ทางรถไฟสายทรานสอิหราน"
 PER_trans_iranian_railway_desc: "ในป 1927 เราไดเริ่มสรางทางรถไฟเชื่อมทั่วประเทศที่เรียกวาทางรถไฟสายทรานสอิหราน บัดนี้เมื่อเรากําลังเรงพัฒนา[ROOT.GetNonIdeologyName]ใหทันสมัย จึงจําเปนอยางยิ่งที่เราตองทุมเงินเพื่อใหโครงการอันยิ่งใหญนี้แลวเสร็จ"
 PER_expand_tabriz_masshad: "เสนทางทาบริซ-มัชฮัด"
 PER_expand_tabriz_masshad_desc: "เราตองขยายทางรถไฟสายทรานสอิหรานตอไป ขอใหเรามุงขยายเสนทางรถไฟเชื่อมระหวางเมืองทาบริซและมัชฮัด"
 PER_expand_tehran_emam: "เสนทางเตหะราน-บันดารชาหปูร"
 PER_expand_tehran_emam_desc: "เราตองขยายทางรถไฟสายทรานสอิหรานตอไป ขอใหเรามุงขยายเสนทางรถไฟเชื่อมระหวางเมืองเตหะรานและบันดารชาหปูร"
 PER_expand_tehran_abbas: "เสนทางเตหะราน-บันดารอับบาส"
 PER_expand_tehran_abbas_desc: "เราตองขยายทางรถไฟสายทรานสอิหรานตอไป ขอใหเรามุงขยายเสนทางรถไฟเชื่อมระหวางเมืองเตหะรานและบันดารอับบาส"
 PER_trains_from_germany: "ขอรถไฟจาก[GER.GetNonIdeologyName]"
 PER_trains_from_germany_desc: "ขณะที่เรากําลังจะเปดทางรถไฟสายทรานสอิหราน เราจําเปนตองมีขบวนรถไฟเพื่อใหโครงการเดินหนาไดเร็วที่สุด เรามีมิตรใน[GER.GetNonIdeologyName] หากเราขอ พวกเขาคงยินดีมอบหัวรถจักรไอนํ้าสวนเกินสําหรับพิธีเปดอันยิ่งใหญของเรา"
 PER_trains_from_britain: "ขอรถไฟจาก[ENG.GetNonIdeologyName]"
 PER_trains_from_britain_desc: "ขณะที่เรากําลังจะเปดทางรถไฟสายทรานสอิหราน เราจําเปนตองมีขบวนรถไฟเพื่อใหโครงการเดินหนาไดเร็วที่สุด เนื่องจากชาว[ENG.GetAdjective]ถือครองกิจการและหุนในวัตถุดิบของเรา หากพวกเขามอบหัวรถจักรไอนํ้าเพื่อเปดทางรถไฟสายใหมของเรา ก็จะเปนประโยชนตอทั้งสองชาติ"
 PER_feat_of_engineering: "ความสําเร็จทางวิศวกรรม"
 PER_feat_of_engineering_desc: "การสรางทางรถไฟสายทรานสอิหรานจนสําเร็จถือเปนผลงานพิเศษ ไมใชเพียงเพราะขนาดอันมหึมา แตเพราะปาฏิหาริยทางวิศวกรรมที่จําเปนตอการเอาชนะเสนทางสูงชันและภูมิประเทศแบบภูเขาของ[ROOT.GetNonIdeologyName] เราควรภาคภูมิใจในความสําเร็จทางวิศวกรรมครั้งนี้ที่รัฐบาลและวิศวกรผูรับเหมาของเรารวมกันสรางขึ้น"
 PER_feat_of_engineering_bonus: "สรางทางรถไฟสายทรานสอิหรานสําเร็จแลว"
 PER_white_revolution: "เริ่มตนการปฏิวัติขาว"
 PER_white_revolution_desc: "การพัฒนา[ROOT.GetNonIdeologyName]ใหทันสมัยไมใชเรื่องงาย แตตองอาศัยการปฏิรูปอยางเขมขนจํานวนมากเพื่อใหบรรลุเปาหมายอันยิ่งใหญนี้ เราจะเรียกมันวาการปฏิวัติขาว หรือการปฏิวัติของชาหและประชาชน ซึ่งจะนํา[PER.GetNameDef]ใหทัดเทียมกับชาติมหาอํานาจทางตะวันตก"
 PER_national_bank: "เสริมความแข็งแกรงใหธนาคารแหงชาติ[ROOT.GetNonIdeologyName]"
 PER_national_bank_desc: "ในทางเศรษฐกิจ เรายังไมโดดเดนเมื่อเทียบกับคูแขงชาติตะวันตก นับเปนเรื่องนาเสียดายอยางยิ่ง แตเราเปลี่ยนแปลงสิ่งนี้ได กอนอื่น เราตองเสริมความแข็งแกรงใหธนาคารแหงชาติ[ROOT.GetNonIdeologyName] และทําใหประชากรในชนบทเขาถึงไดงายขึ้นเปนพิเศษ"
 PER_price_stabilization: "รักษาเสถียรภาพราคา"
 PER_price_stabilization_desc: "เมื่อธนาคารแข็งแกรงขึ้นแลว เราตองเริ่มรณรงคตอตานการคากําไรเกินควร เราสามารถปรับเจาของโรงงานและธุรกิจเครือขายขนาดใหญที่ไมปฏิบัติตาม และกําหนดราคาสินคาทั่วทั้ง[ROOT.GetNonIdeologyName]"
 PER_abolish_feudalism: "ยกเลิกระบบศักดินา"
 PER_abolish_feudalism_desc: "เปนเวลาหลายปที่[ROOT.GetNonIdeologyName]ดําเนินไปภายใตระบบศักดินา โดยเจาที่ดินถือครองที่ดินซึ่งชาวนาจํานวนมากในชนบทเปนผูทํากิน นี่เปนระบบที่ลาสมัย และเปนหนาที่ของรัฐบาลที่จะซื้อที่ดินจากเจาของแลวขายคืนใหชาวนาในราคาที่ถูกกวามาก ซึ่งจะนําอิสรภาพมาสูประชากรสวนใหญของเราอยางแทจริง"
 PER_women_vote: "ใหสิทธิเลือกตั้งแกสตรี"
 PER_women_vote_desc: "ในขณะนี้ มีเพียงผูชายเทานั้นที่ออกเสียงในกิจการของรัฐได เมื่อสตรีคิดเปนราวครึ่งหนึ่งของประชากร เราควรทําใหมั่นใจวาเสียงของสตรีในชาติเราจะไดรับการรับฟง อยางไรก็ตาม เราควรดําเนินการอยางระมัดระวัง เพราะอาจทําใหนักบวชเชื่อวาเรากําลังหันหลังใหขนบธรรมเนียม"
 PER_food_for_all: "อาหารสําหรับชาว[PER.GetAdjective]ทุกคน"
 PER_food_for_all_desc: "นาเศราที่เราคุนเคยกับความอดอยากเปนอยางดี ดวยงานที่เราทําเพื่อพัฒนาเศรษฐกิจในความพยายามสรางความทันสมัย เรามีโอกาสปรับปรุงการกระจายอาหาร และทําใหมั่นใจวาชาว[PER.GetAdjective]ทุกคนจะเขาถึงปจจัยพื้นฐานของมนุษยได"
 PER_rapid_industrialization: "การพัฒนาอุตสาหกรรมอยางรวดเร็ว"
 PER_rapid_industrialization_desc: "ความทันสมัยคือการพัฒนาอุตสาหกรรม เราไมอาจหลีกหนีความจริงที่วาเราตองเรงขยายผลผลิตของโรงงาน หากตองการกาวขึ้นไปอยูระดับเดียวกับชาติมหาอํานาจอื่น ๆ ในโลกนี้"
 PER_tehran_power_plant: "เปดโรงไฟฟาในเตหะราน"
 PER_tehran_power_plant_desc: "เมื่อเมืองตาง ๆ ทั่วประเทศเติบโตขึ้น เราตองทําใหมั่นใจวามีไฟฟาเพียงพอ ขอใหเราเปดโรงไฟฟาแหงใหมในเมืองหลวงเตหะราน และทําใหเปนกาวสําคัญถัดไปในการขยายเมืองที่สําคัญที่สุดของเรา"
 PER_tehran_power_grid_bonus: "ขยายโครงขายไฟฟาเตหะรานแลว"
 PER_develop_cities: "พัฒนาเมืองใหญ"
 PER_develop_cities_desc: "ในขณะนี้ เมืองหลวงเตหะรานเปนเมืองที่พัฒนาที่สุดใน[ROOT.GetNonIdeologyName] หากเราตองการโอบรับความทันสมัยในประเทศอยางแทจริง เราตองทุมเทความพยายามในการขยายโครงสรางพื้นฐานของเมืองใหญตาง ๆ"
 PER_metropolitan_iran: "[ROOT.GetNonIdeologyName]แหงมหานคร"
 PER_metropolitan_iran_desc: "ในที่สุด หลังความพยายามพัฒนาครั้งใหญ เราก็มาถึงจุดที่[ROOT.GetNonIdeologyName]ถือไดวาเปนชาติแหงมหานคร เมืองของเราคึกคักไปดวยอุตสาหกรรมและชีวิตชีวา ปูทางสูความสําเร็จในอนาคต"
 PER_develop_oil_fields: "พัฒนาแหลงนํ้ามัน"
 PER_develop_oil_fields_desc: "นอกจากกลุมแหลงขุดเจาะนํ้ามันขนาดใหญที่เรามีอยูแลว เมื่อไมนานมานี้เรายังคนพบแหลงทองคําดําแหงใหมที่พรอมใหขุด รัฐมนตรีฝายอุตสาหกรรมของเราเชื่อวาการตั้งแทนขุดเจาะใหมอาจนําไปสูการผูกขาดทรัพยากรอันลํ้าคาที่สุดนี้"
 PER_form_oil_company: "กอตั้งบริษัทนํ้ามันของเราเอง"
 PER_form_oil_company_desc: "แหลงนํ้ามันของเราถูกขุดและควบคุมโดยมหาอํานาจอาณานิคมภายนอกมานานเกินไปแลว เมื่อเราไดคลังสํารองใหมมาและมีอนาคตที่ปลอดจากอิทธิพลตางชาติ ถึงเวลาแลวที่เราจะกอตั้งบริษัทนํ้ามันแหงชาติ[PER.GetAdjective]"
 PER_establish_opec: "กอตั้งโอเปก"
 PER_establish_opec_desc: "เมื่ออุตสาหกรรมนํ้ามันของเราตั้งมั่นอยางสมบูรณแลว ถึงเวลาที่เราจะมองออกไปยังประเทศอื่นที่อุดมดวยนํ้ามัน เพื่อดูวาเราจะรวมตัวภายใตธงเดียวกันเพื่อผูกขาดทรัพยากรยุทธศาสตรนี้ไดหรือไม หลังจากติดตอ[IRQ.GetNameDef], [SAU.GetNameDef] และ[VEN.GetNameDef] ทุกฝายเห็นพองเปนเอกฉันทใหกอตั้งองคการประเทศผูสงออกนํ้ามัน"
 PER_opec: "โอเปก"
 PER_oil_baron: "ประกาศตนเปนเจาพอนํ้ามัน"
 PER_oil_baron_desc: "แทนที่จะใชนํ้ามันของเราหลอเลี้ยงสงครามที่ชาติอื่นกําลังทํากันทั่วโลก การเก็บไวใชเองยอมดีกวา หากเรากักตุนนํ้ามันไวใน[ROOT.GetNonIdeologyName] เราจะมั่นใจไดวาสามารถขายใหผูที่ตองการในราคาที่สูงลิ่ว"
 PER_profit_from_war: "ทํากําไรจากสงคราม"
 PER_profit_from_war_desc: "สงครามหมายถึงเงิน และมีเงินมหาศาลใหกอบโกยจากความขัดแยงที่กําลังลุกลามไปทั่วโลก เมื่อเทคโนโลยีกาวหนาขึ้น ชาติคูสงครามก็ตองการนํ้ามันมากขึ้นเพื่อปอนจักรกลสงครามของตน นี่คือโอกาสทองของเรา และเราคงโงหากไมควาไว"
 PER_invite_oil_nations: "เชิญชาติผูผลิตนํ้ามัน"
 PER_invite_oil_nations_desc: "จนถึงตอนนี้ โอเปกประสบความสําเร็จในการสรางกําไรใหตลาดนํ้ามันโลก แตองคการของเรายังสามารถเติบโตไดอีก ขอใหเราติดตอชาติผูผลิตนํ้ามันอื่น ๆ ทั่วโลก และเชิญพวกเขามารวมมือกับเราในโอเปก"
 PER_deal_with_eitc: "ทําขอตกลงกับบริษัทอินเดียตะวันออก"
 PER_deal_with_eitc_desc: "ดูเหมือนเพื่อนบานทางตะวันออกของเราจะยุงไมนอย [RAJ.GetNonIdeologyName]ไดฟนฟูบริษัทอินเดียตะวันออกขึ้นมาใหม และกลายเปนบรรษัทยักษใหญระดับประเทศ การดึงพวกเขามาเปนพวกในเรื่องการผูกขาดนํ้ามันของเราจึงเปนเรื่องฉลาด และควรทําขอตกลงกับพวกเขาและสมาชิกโอเปกที่เหลือ" 
 PER_a_modern_iran: "อิหรานยุคใหม"
 PER_a_modern_iran_desc: "หลังความพยายามทั้งหมดในการพัฒนาใหทันสมัย ในที่สุดเราก็กลาวไดวาเรายืนหยัดอยางภาคภูมิและแข็งแกรงทามกลางชาติอื่น ๆ"


 ################
 ##### ARMY #####
 ################

 PER_restructure_army: "ปรับโครงสรางกองทัพบก"
 PER_restructure_army_desc: "กองทัพของเราออนแอลงจากสงครามกับรัสเซียอันไมรูจบภายใตการบัญชาการของราชวงศกาจาร ดวยสภาพของโลกในทุกวันนี้ การฟนฟูกองกําลังทหารของเราใหกลับมารุงเรืองดังเดิมจึงเปนทางเลือกที่ชาญฉลาด"
 PER_expand_imperial_guard: "ขยายราชองครักษ"
 PER_expand_imperial_guard_desc: "ในฐานะราชวงศใหมลาสุดที่ปกครอง[PER.GetNameDef] ราชสกุลแหงชาหตองการเพียงสิ่งที่ดีที่สุดสําหรับราชองครักษ หากไดรับยุทโธปกรณและการฝกอยางเหมาะสม พวกเขาก็อาจเขารวมรบในแนวหนาไดเชนกัน"
 PER_expand_military_facilities: "ขยายสิ่งอํานวยความสะดวกทางทหาร"
 PER_expand_military_facilities_desc: "ในสภาพปจจุบัน ขีดความสามารถในการผลิตอาวุธของเรายังขาดแคลนอยางหนัก เราควรขยายสิ่งอํานวยความสะดวกทางทหารโดยเร็วที่สุด เพื่อใหมั่นใจวากองทัพที่เพิ่งปรับโครงสรางใหมของเรามียุทโธปกรณครบครันและพรอมรบ"
 PER_czech_tanks: "ซื้อสิทธิบัตรรถถังเชโกสโลวาเกีย"
 PER_czech_tanks_desc: "กอนที่เราจะคิดออกแบบและผลิตกองกําลังยานเกราะของเราเอง เราควรมองไปยังชาติที่ขึ้นชื่อดานการผลิตรถถัง ดวยการติดตอ[CZE.GetNameDef] เราจะไดรับสิทธิบัตรผลิตรถถังจากโรงงานสโกดาอันมีชื่อเสียงของพวกเขา"
 PER_german_tanks: "ซื้อสิทธิบัตรรถถังเยอรมัน"
 PER_german_tanks_desc: "กอนที่เราจะคิดออกแบบและผลิตกองกําลังยานเกราะของเราเอง เราควรมองไปยังชาติที่ขึ้นชื่อดานการผลิตรถถัง ดวยการติดตอ[GER.GetNameDef] เราจะสามารถผลิตรถถังทรงพลังที่จะฝาแนวขาศึกไดดั่งมีดรอนตัดเนย"
 PER_reverse_engineer_tanks: "ศึกษายอนกลับรถถังตางชาติ"
 PER_reverse_engineer_tanks_desc: "ดวยการพิจารณารถถังที่เราผลิตตามแบบของมหาอํานาจตางชาติอยางละเอียด เราจะเรียนรูวามันทํางานอยางไร และจะผลิตแบบของเราเองเพื่อใชในอนาคตไดอยางไร นี่คือกาวแรกบนเสนทางสูการที่[PER.GetNonIdeologyName]จะพัฒนาแบบรถถังของตนเอง"
 PER_establish_tehran_armor: "กอตั้งเตหะรานอารเมอร"
 PER_establish_tehran_armor_desc: "ถึงเวลาแลวที่เราจะกอตั้งบริษัทผลิตรถถังของเราเอง หลังตัดสินใจใชชื่อเตหะรานอารเมอร ไดมีการประกาศวารัฐบาลจะใหเงินอุดหนุนบริษัทเพื่อชวยใหตั้งตัวได"
 PER_expand_tehran_armor: "ขยายโรงงานเตหะรานอารเมอร"
 PER_expand_tehran_armor_desc: "ขณะที่เตหะรานอารเมอรทํางานอยางหนักในการผลิตแบบรถถังใหมใหการทําสงครามของเรา การเรงกระบวนการนี้ดวยการขยายโรงงานผลิตอยางรวดเร็วจึงเปนการตัดสินใจที่ชาญฉลาด ยิ่งมีพื้นที่โรงงานสําหรับสรางยุทโธปกรณยานเกราะมากเทาใด เราก็ยิ่งสงรถถังออกสูสนามรบไดเร็วเทานั้น"
 PER_future_of_war: "อนาคตแหงสงคราม"
 PER_future_of_war_desc: "เพียงไมกี่ทศวรรษกอน สงครามยังคงรบกันดวยคนและมา ปนใหญอันนอยนิด และยุทธวิธีแบบโบราณ แตในยุคสมัยใหมนี้ ยุคของรถถังไดมาถึงแลว เราตองกาวใหทันความกาวหนาของเทคโนโลยีทางทหาร หากเราจะยืนหยัดตอกรกับกองกําลังที่คุกคามเรา"
 PER_train_tank_commanders: "ฝกผูบังคับรถถัง"
 PER_train_tank_commanders_desc: "เพื่อใชประโยชนจากกองพลรถถังใหไดมากที่สุด พวกเขาตองไดรับการนําโดยผูบัญชาการที่มีความสามารถ เพื่อการนี้ เราตองเตรียมสงผูนําทางทหารกลับไปฝกอบรม เพื่อเรียนรูวิธีผนวกการรบดวยรถถังเขากับยุทธวิธีอันหลากหลายของพวกเขาอยางมีประสิทธิภาพ"
 PER_military_excellency: "ความเปนเลิศทางทหารของ[PER.GetAdjective]"
 PER_military_excellency_desc: "สําหรับกองทัพที่จะไดชัยชนะ กองกําลังที่ไดรับการฝกดีที่สุดยอมเปนผูชนะ ดวยการศึกษาอันเขมงวด ยุทโธปกรณชั้นเลิศ และยุทธวิธีที่ไมมีใครหยุดยั้งได ขอใหเราพิสูจนตอโลกวากองทัพ[PER.GetAdjective]เปนกองกําลังที่ไมอาจมองขาม"
 PER_foreign_retraining: "โครงการฝกใหมโดยชาวตางชาติ"
 PER_foreign_retraining_desc: "กองทัพในปจจุบันของเราไดรับการฝกมาอยางยํ่าแยและขาดระเบียบ เพื่อยกระดับคุณภาพของกองกําลัง การลงทุนเชิญชาวตางชาติมายัง[PER.GetNonIdeologyName]เพื่อฝกทหารของเราจึงเปนทางเลือกที่ชาญฉลาด ซึ่งจะทําใหพวกเขาพรอมรบไดในเวลาอันสั้น"
 PER_bolster_infantry: "เสริมกําลังทหารราบ"
 PER_bolster_infantry_desc: "พลทหารราบธรรมดาถือเปนหัวใจของทุกกองทัพมาหลายชั่วอายุคน และเปนตําแหนงในกองทัพที่เราไมควรละเลย ขอใหเราเสริมกําลังทหารราบ และทําใหมั่นใจวากองทัพของเราเดินทัพไดอยางดีและดวยความภาคภูมิ"
 PER_swedish_artillery: "ซื้อสิทธิบัตรปนใหญจาก[SWE.GetNameDef]"
 PER_swedish_artillery_desc: "ชาว[SWE.GetAdjective]ไดพัฒนาปนใหญทรงพลังซึ่งจะเปนประโยชนตอกองทัพของเรา เราควรติดตอชาตินอรดิกนี้และพยายามเจรจาขอตกลงสิทธิบัตร เพื่อที่เราจะไดเริ่มผลิตเองได"
 PER_establish_motor_arms: "กอตั้งอุตสาหกรรมยานยนตทางทหาร"
 PER_establish_motor_arms_desc: "เพื่อสนับสนุนทหารราบ เราควรพิจารณาผลิตยานพาหนะหลากหลายประเภท เพื่อใหความสามารถในการเคลื่อนที่ในสนามรบของพวกเขาทันสมัยและคลองตัวที่สุด การกอตั้งอุตสาหกรรมสําหรับยุทโธปกรณประเภทนี้คือการเตรียมพรอมสําหรับการพัฒนากองทัพใหทันสมัยในอนาคต"
 PER_motorize_infantry: "เปลี่ยนทหารราบเปนหนวยยานยนต"
 PER_motorize_infantry_desc: "เราตองกาวนํายุคสมัย และเพื่อการนั้น จําเปนอยางยิ่งที่เราตองเปลี่ยนทหารปกติใหเปนหนวยยานยนต เพื่อใหพวกเขาบุกตะลุยขามสนามรบเคียงขางรถถังของเรา อยางไดรับการปกปองและพรอมสรางความหายนะ"
 PER_increase_heavy_arms: "เพิ่มโรงงานอาวุธหนัก"
 PER_increase_heavy_arms_desc: "เมื่อกองทัพของเราใหญขึ้น ความตองการโรงงานขนาดใหญเพื่อผลิตเครื่องจักรหนักก็เพิ่มขึ้นตามไปดวย สิ่งนี้ยังเปดทางใหเราสรางแบบปนใหญของเราเอง ซึ่งหมายความวาเราจะไมตองพึ่งพามหาอํานาจตางชาติในการสนับสนุนทหารของเราอีกตอไป อีกทั้งยังทําใหเราปรับแผนการรบใหรองรับแนวหนาที่เนนปนใหญได"
 PER_our_own_artillery: "สรางปนใหญของเราเอง"
 PER_our_own_artillery_desc: "บัดนี้เรามีโรงงานที่จําเปนสําหรับการออกแบบและสรางปนใหญสนับสนุนแบบของเราเองอยางมีประสิทธิภาพแลว เราไมตองพึ่งพาการคาเพื่อเสริมกําลังกองทัพอีกตอไป ปนใหญใหมของเราจะระดมยิงใสศัตรูดั่งหาฝน และทําใหมั่นใจวาเราจะรักษาแนวรบไวไดในทุกความขัดแยง"
 PER_develop_qorkhaneh: "พัฒนากอรฆาเนห"
 PER_develop_qorkhaneh_desc: "กอรฆาเนหเปนแหลงผลิตอาวุธและกระสุนหลักของเราในเตหะราน การลงทุนทรัพยากรเพื่อพัฒนาคลังแสงกอรฆาเนหจึงคุมคา เพื่อใหมั่นใจวาการผลิตยุทโธปกรณของเราจะอยูในสภาพดีเยี่ยมสําหรับความขัดแยงใด ๆ ที่อาจเกิดขึ้น"
 PER_desert_training: "การฝกเฉพาะทางในทะเลทราย"
 PER_desert_training_desc: "[PER.GetNonIdeologyName]ประเทศอันงดงามของเรามีระบบนิเวศที่หลากหลาย แตดินแดนสวนใหญของเราเปนที่ราบทะเลทราย ภูมิประเทศอันยากลําบากเชนนี้ทําใหตองคํานึงถึงวิธีปฏิบัติการของกองทัพ เราจึงควรฝกเฉพาะทางดานการเอาชีวิตรอดและการเคลื่อนที่ในภูมิประเทศทะเลทราย"
 PER_every_man_serves: "ชายทุกคนที่รับใชชาติได"
 PER_every_man_serves_desc: "ปริมาณเหนือคุณภาพคืออนาคตของกองทัพเรา เรามีประชากรจํานวนมาก และในยามเชนนี้ ชายทุกคนที่จับอาวุธไดควรทําหนาที่พลเมืองในการปกปอง[PER.GetNameDef]จากผูรุกรานตางชาติ เราจะตองเสียการฝกเฉพาะทางไป แตหวังวาจํานวนของเราจะทวมทนศัตรูได"
 PER_special_units: "ปฏิบัติการพิเศษอิหราน"
 PER_special_units_desc: "เมื่อขีดความสามารถทางทหารของเราเติบโตขึ้น สิ่งสําคัญคือตองพิจารณากองพลเฉพาะทางนอกเหนือจากทหารปกติ ซึ่งจะนํามาซึ่งโอกาสใหม ๆ มากมาย ทั้งปฏิบัติการขาวกรอง หนวยรบพิเศษ และแมแตอาวุธทดลอง"
 PER_form_savak: "กอตั้งซาวัก"
 PER_form_savak_desc: "การจารกรรมกําลังพิสูจนตัววาเปนองคประกอบสําคัญในการทําสงคราม เพื่อใหทันกับความพยายามดานขาวกรองของศัตรู เราควรกอตั้งองคกรของเราเองเพื่อดูแลสายลับและปฏิบัติการจารกรรมทั้งหมด แมแตภายในประเทศ องคกรนี้ก็จะชวยเสริมความแข็งแกรงใหรัฐบาลและจับตาผูที่คิดจะโคนลม"
 PER_transfer_officers_to_intelligence: "โอนยายนายทหารเขาสูงานขาวกรอง"
 PER_transfer_officers_to_intelligence_desc: "เพื่อเสริมปฏิบัติการของหนวยขาวกรอง เราตองโอนยายนายทหารที่มีความเฉลียวฉลาดบางสวนเขาสูฝายขาวกรอง"
 PER_fund_state_intelligence: "สนับสนุนงบประมาณขาวกรองของรัฐ"
 PER_fund_state_intelligence_desc: "ดวยการทุมเงินเพิ่มเติมในโครงการขาวกรองของรัฐ เราจะสามารถจับตาความเปนไปไดของการลุกฮือและการกบฏภายในประเทศไดใกลชิดยิ่งขึ้น ดวยการตัดไฟแตตนลม เราจะรักษาความปลอดภัยและความมั่นคงของชาติไวไดตอไป"
 PER_special_forces_program: "โครงการหนวยรบพิเศษ"
 PER_special_forces_program_desc: "มีบางสถานที่ที่กองกําลังแนวหนาปกติของเราเขาไปไมได เพื่อแกไขปญหานี้ การสรางโครงการหนวยรบพิเศษจึงสําคัญยิ่ง อีกไมนานเราจะมีทหารเฉพาะทางที่รับมือกับภารกิจยากลําบากใด ๆ ที่เรามอบหมายได"
 PER_recruit_bakhtiari: "เกณฑผูเชี่ยวชาญการรบบนภูเขาชาวบัคติยารี"
 PER_recruit_bakhtiari_desc: "ชาวบัคติยารีเปนชนเผาลูรจากทางตะวันออกของ[PER.GetNonIdeologyName] แมผูคนทางตะวันตกของประเทศจํานวนมากจะกังวลเรื่องอิทธิพลของพวกเขา แตวิถีชีวิตเรรอนของพวกเขาก็มีประโยชนตอกองทัพของเรา ดวยการเกณฑสมาชิกจากชนเผาของพวกเขา เราจะทําใหทหารภูเขาของเราไดเปรียบศัตรูอยางมาก"
 PER_expand_unique_unit: "ขยายกองพันอมตะ"
 PER_expand_unique_unit_desc: "หลังจากกอตั้งกองพันอมตะเปนสวนหนึ่งของมรดกแหงจักรวรรดิ บัดนี้เราสามารถทุมทรัพยากรเพื่อขยายกองพันอันทรงเกียรตินี้ ใหชายอีกมากมายไดยืนเคียงบาเคียงไหลแบกรับภาระของจักรวรรดิ[PER.GetAdjective]!"
 PER_import_rocketry: "นําเขาแบบจรวด"
 PER_import_rocketry_desc: "การสงครามพัฒนาไปอยางรวดเร็วยิ่งนัก เมื่อชาติอื่นเริ่มพัฒนาเทคโนโลยีจรวดเพื่อใชในสนามรบ เราควรพยายามกาวใหทันพัฒนาการเหลานี้ดวยการนําเขาแบบที่จําเปนตอการผลิตอาวุธมหัศจรรยของเราเอง"
 PER_cyrus_initiative: "โครงการไซรัส"
 PER_cyrus_initiative_desc: "โครงการไซรัสคือโครงการลับสุดยอดลาสุดของเราในการพัฒนาอาวุธทําลายลางอันนาทึ่ง ที่เราจะใชในสนามรบเพื่อกวาดลางศัตรูใหสิ้นซาก นักวิทยาศาสตรของเราไดรางแบบที่นาสนใจซึ่งดูเหมือนยังไมมีชาติใดคิดถึง หมายความวาเราอยูในตําแหนงที่ดีที่จะสรางความประหลาดใจใหศัตรูในยามสงคราม"
 PER_modern_cataphract: "คาตาแฟรกตยุคใหม"
 PER_modern_cataphract_desc: "คาตาแฟรกตคือทหารมาหนักหุมเกราะที่กําเนิดขึ้นในดินแดนของเราตั้งแตสมัยโบราณ ทั้งจักรวรรดิอะคีเมนิดและจักรวรรดิซาสซานิดตางใชมาศึกทรงพลังเหลานี้ในสนามรบ ดวยแรงบันดาลใจจากพวกมัน เราจะสามารถสรางยานยนตยักษที่เชิดชูประวัติศาสตรการรบดวยทหารมาของเรา"
 PER_war_elephant: "ชางศึก"
 PER_war_elephant_desc: "แมจะไมไดใชอยางแพรหลายในจักรวรรดิเปอรเซียยุคโบราณ แตเราก็มีชื่อเสียงจากการนําชางศึกกลุมเล็ก ๆ ออกรบในการพิชิตดินแดนสมัยกอน นักวิทยาศาสตรของเราไดคิดแบบรถถังหนักมากที่ไดแรงบันดาลใจจากรูปรางของชางอินเดีย ซึ่งยอมสรางความหวาดกลัวใหศัตรูเชนเดียวกับที่ชางศึกเคยทําเมื่อหลายพันปกอน"
 PER_negotiate_with_america: "เจรจากับอเมริกา"
 PER_negotiate_with_america_desc: "[USA.GetNameDefCap]ไดแสดงใหเห็นวาเปนผูนําโลกดานการพัฒนาเทคโนโลยีปรมาณู นวัตกรรมเหลานี้อาจมีความสําคัญยิ่งตอการกาวนําหนาในการตอสูเพื่อรักษาบทบาทบนเวทีโลกของเรา เราควรสงคณะทูตไปขอความชวยเหลือในการพัฒนาโครงการนิวเคลียรของเราเอง"
 PER_establish_nuclear_program: "กอตั้งโครงการนิวเคลียรของ[PER.GetAdjective]"
 PER_establish_nuclear_program_desc: "ความลับของอะตอมถูก[GER.GetNameDef]และ[USA.GetNameDef]ศึกษาคนความาระยะหนึ่งแลว หลังจากไดรับบันทึกและเอกสารการวิจัยจากมิตรชาว[USA.GetAdjective] พวกเขาก็ไดชวยเราจัดตั้งโครงการนิวเคลียรของเราเองอยางเปนทางการ"

 ####################
 ##### AIRFORCE #####
 ####################

 PER_establish_airforce: "กอตั้งกองทัพอากาศ"
 PER_establish_airforce_desc: "กองทัพอากาศจักรวรรดิ[PER.Adjective]กอตั้งขึ้นอยางเปนทางการในป 1920 โดยเรซา ชาห ปาหลาวี อยางไรก็ตาม บัดนี้เมื่อภัยสงครามกําลังปกคลุมโลก เราควรเสริมความสามารถของชาติในการรบบนทองฟาใหมั่นคง อยางนอยก็เพื่อความปลอดภัยของ[PER.GetNameDef]ไปอีกหลายทศวรรษ"
 PER_pilot_training: "โครงการฝกนักบิน"
 PER_pilot_training_desc: "นักบินตองการมากกวาพรสวรรคในการบังคับเครื่องบินรบ โครงการฝกอยางละเอียดสําหรับผูที่พรอมเสี่ยงชีวิตเพื่อ[PER.GetNameDef]จะมีความสําคัญยิ่งตอความปลอดภัยและประสิทธิภาพของพวกเขาบนทองฟา"
 PER_raf_planes: "ซื้อเครื่องบินของ RAF"
 PER_raf_planes_desc: "[ENG.GetNameDefCap]มีกองทัพอากาศหลวง ซึ่งความสามารถและทักษะเปนที่รูจักในชาติสวนใหญ อยางไรก็ตาม ไมใชเพียงทักษะของนักบินเทานั้น แตคุณภาพของเครื่องบินก็ชวยใหพวกเขาชนะการรบดวย ขอใหเราติดตอพวกเขาและสั่งซื้อเครื่องบิน"
 PER_luftwaffe_planes: "ซื้อเครื่องบินของลุฟทวัฟเฟอ"
 PER_luftwaffe_planes_desc: "หากพูดถึงเครื่องบินชั้นยอด ลุฟทวัฟเฟอของ[GER.GetNameDef]ถือเปนหนึ่งในที่สุด เมื่อเรามีความสัมพันธใกลชิดกับ[GET.GetNameDef]อยูแลว การติดตอพวกเขาเพื่อซื้อเครื่องบินสวนเกินที่ไมตองการแลวจึงสมเหตุสมผล"
 PER_own_plane_designs: "พัฒนาแบบของเราเอง"
 PER_own_plane_designs_desc: "หลังจากทุมทรัพยากรไปกับการซื้อเครื่องบินตางชาติ บางทีถึงเวลาที่เราจะมอบหมายใหวิศวกรออกแบบเครื่องบินของเราเองเพื่อใชในกองทัพอากาศ"
 PER_establish_air_academy: "กอตั้งโรงเรียนนายเรืออากาศ"
 PER_establish_air_academy_desc: "เราไดจัดการฝกนักบินขั้นพื้นฐานเปนสวนหนึ่งของกระบวนการเขาเปนสมาชิกกองทัพอากาศแลว แตเราตองมีการศึกษาเฉพาะทางมากขึ้น หากจะครองทองฟาไดอยางแทจริง การจัดตั้งโรงเรียนนายเรืออากาศอยางเปนทางการในเตหะรานจะเรงกระบวนการนี้ และทําใหมั่นใจวานักบินของเราไดรับการฝกอยางดี"
 PER_legacy_of_gilani: "มรดกของออซรา กีลานี"
 PER_legacy_of_gilani_desc: "ออซรา กีลานีเปนสตรีคนแรกที่เขารวมกองทัพอากาศจักรวรรดิ[PER.GetAdjective] และไดวางบรรทัดฐานสําหรับอนาคตที่กองทัพของเราเปดกวางมากขึ้น เราควรกําหนดบทบาทของสตรีในกองทัพ และอนุญาตใหพวกเธอเปนนักบิน พวกเธอก็ควรมีสิทธิ์รับใชประเทศชาติเชนกัน"
 PER_strategic_bombing: "การทิ้งระเบิดทางยุทธศาสตร"
 PER_strategic_bombing_desc: "สงครามไมไดชนะกันแคบนทองฟา แตยังชนะดวยการบดขยี้ขีดความสามารถทางเศรษฐกิจและอุตสาหกรรมของศัตรู ขอใหเรามุงเนนการทิ้งระเบิดทางยุทธศาสตร และทําลายโรงงานของพวกเขากอนที่จะถูกนํามาใชโจมตีเรา"
 PER_battlefield_support: "การสนับสนุนในสนามรบ"
 PER_battlefield_support_desc: "เพื่อความปลอดภัยของทหารขณะเดินทัพสูแนวหนา จําเปนอยางยิ่งที่เราตองใชเครื่องบินสนับสนุนภาคพื้นดินเพื่อปองกันไมใหเครื่องบินขาศึกระดมยิงใสกองทัพของเรา"
 PER_air_superiority: "ความเหนือกวาทางอากาศ"
 PER_air_superiority_desc: "การใชกองทัพอากาศที่สําคัญที่สุดคือการครองทองฟา หากเรามีความเหนือกวาทางอากาศ เราจะสามารถดําเนินปฏิบัติการที่อันตรายยิ่งขึ้นไดโดยไมตองกลัวถูกสกัดกั้น"
 PER_perfect_iranian_airforce: "กองทัพอากาศ[PER.GetAdjective]ที่สมบูรณแบบ"
 PER_perfect_iranian_airforce_desc: "ดวยทรัพยากรและเวลาทั้งหมดที่เราทุมเทใหกับการพัฒนาขีดความสามารถทางอากาศ ถึงเวลาแลวที่เราจะไขวควาจุดสูงสุด และประกาศวาเรามีกองทัพอากาศที่มีประสิทธิภาพที่สุดแหงหนึ่งของโลก ไมมีสิ่งใดเอาชนะทักษะและพรสวรรคของนักบิน หรือความยอดเยี่ยมของเครื่องบินของเราได"
 PER_construct_air_bases: "สรางฐานทัพอากาศ"
 PER_construct_air_bases_desc: "เครื่องบินของเราตองมีที่ตั้งสําหรับวางกําลัง หากจะปฏิบัติภารกิจไดอยางมีประสิทธิภาพ ดังนั้นจึงสําคัญยิ่งที่เราตองพัฒนาฐานทัพอากาศแหงใหมทั่ว[PER.GetNonIdeologyName] และขยายขีดความสามารถของกองทัพอากาศ"
 PER_construct_air_defenses: "จัดตั้งระบบปองกันภัยทางอากาศ"
 PER_construct_air_defenses_desc: "เราจําเปนตองติดตั้งปนตอสูอากาศยานตามแนวชายแดนเพิ่มขึ้น เพื่อปกปองทหารที่กําลังรุกคืบจากเครื่องบินขาศึก"
 PER_anti_air_development: "สนับสนุนการพัฒนาระบบตอตานการโจมตีทางอากาศ"
 PER_anti_air_development_desc: "โรงงานในเมืองของเรากลายเปนเปาหมายของเครื่องบินทิ้งระเบิดขาศึก เพราะพวกเขาตองการขัดขวางความกาวหนาทางเศรษฐกิจและอุตสาหกรรมของเรา เราควรทุมทรัพยากรเพื่อพัฒนามาตรการตอตานการโจมตีทางอากาศ"
 PER_anti_air_research: "โครงการวิจัยตอตานอากาศยาน"
 PER_anti_air_research_desc: "อาวุธตอตานอากาศยานในปจจุบันของเราเริ่มลาสมัย เราควรทุมเทความพยายามมากขึ้นในการวิจัยเทคโนโลยีใหมที่จะชวยปกปองชาติจากภัยบนทองฟา"

 ################
 ##### NAVY #####
 ################

 PER_establish_the_navy: "กอตั้งกองทัพเรือ"
 PER_establish_the_navy_desc: "เชนเดียวกับกองทัพอากาศ กองทัพเรือจักรวรรดิ[PER_GetAdjective]กอตั้งขึ้นโดยเรซา ชาห ปาหลาวี หลังการรัฐประหารโคนราชวงศกาจาร นับแตนั้นเราไดตระหนักถึงความจําเปนที่จะตองเสริมสิ่งที่สรางไวแลว และทําใหมั่นใจวาเราควบคุมทะเลตามชายแดนทางเหนือและใตไดดียิ่งขึ้น"
 PER_officers_to_italy: "สงนายทหารไปฝกที่อิตาลี"
 PER_officers_to_italy_desc: "[ITA.GetNameDefCap]คือแหลงที่เราไดเรือบางลําซึ่งจอดอยูในอูตอเรือของเราในปจจุบัน เราจึงมีความเชื่อมโยงกันในดานการพัฒนากองทัพเรือโดยธรรมชาติ เราควรติดตอรัฐบาล[ITA.GetAdjective]และขอสงนายทหารของเราไปฝกดานการทัพเรือ"
 PER_persian_gulf_fleet: "กองเรืออาวเปอรเซีย"
 PER_persian_gulf_fleet_desc: "อาวเปอรเซียคือทางเดียวของเราที่จะเขาถึงโลกภายนอกทางทะเล จึงควรปกปองไวดวยทุกวิถีทาง หากเรามุงฝกเฉพาะสําหรับปฏิบัติการในอาว เราจะทําใหมั่นใจวาผูรุกรานจากทางใตจะยกพลขึ้นบกไดยากลําบาก"
 PER_construct_naval_bases: "สรางฐานทัพเรือใหม"
 PER_construct_naval_bases_desc: "ขีดความสามารถทางเรือในปจจุบันของเรายังตํ่ากวาที่ตองการ เพื่อเพิ่มขีดความสามารถ เราตองสรางอูตอเรือเพิ่มตามแนวชายฝงทั้งสองที่รองรับการวางกําลังเรือรบได"
 PER_bolster_the_caspian: "เสริมกําลังทะเลแคสเปยน"
 PER_bolster_the_caspian_desc: "ทะเลแคสเปยนอาจเปนเพียงทะเลในแผนดิน แตก็เปนอีกทางหนึ่งที่[SOV.GetNameDef]จะเขาสูดินแดนของเราไดหากเลือกจะบุก บางคนอาจวาการปองกันทะเลนี้ไมมีเหตุผล แตเราไมอาจประมาทเพื่อนบานทางเหนือไดเลย"
 PER_coastal_defense_initiative: "โครงการปองกันชายฝง"
 PER_coastal_defense_initiative_desc: "แมเราจะเขาถึงมหาสมุทรของโลกไดนอย แตการรุกรานทางทะเลก็ยังเปนไปไดจริง เพื่อปกปองแนวชายฝงของ[PER.GetNonIdeologyName] เราตองริเริ่มโครงการพัฒนาแนวปองกันตามชายฝงอาวเปอรเซียและทะเลแคสเปยน"
 PER_purchase_foreign_ships: "ซื้อเรือตางชาติ"
 PER_purchase_foreign_ships_desc: "กองทัพเรือของเรากอตั้งขึ้นจากการซื้อเรือติดอาวุธลําใหมจาก[ITA.GetNameDef]เมื่อไมกี่ปกอน เราสามารถเสริมขีดความสามารถทางเรือไดดวยการติดตอมหาอํานาจตางชาติอื่นและซื้อเพิ่ม ซึ่งยังชวยกระชับความสัมพันธระหวางชาติดวย"
 PER_found_iranian_shipyards: "กอตั้งอูตอเรืออิหราน"
 PER_found_iranian_shipyards_desc: "แมการซื้อเรือจากชาติอื่นจะเพียงพอในตอนนี้ แตหากเราตองการตามใหทันการแขงขันสะสมอาวุธทางทะเลในภูมิภาค เราตองลงทุนสรางกองเรือของเราเอง ซึ่งทําไดดวยการกอตั้งบริษัทที่มุงตอเรือเพื่อการทําสงครามของเราเปนหลัก นั่นคืออูตอเรืออิหราน"
 PER_expand_dockyards: "ขยายอูตอเรือ"
 PER_expand_dockyards_desc: "เมื่อกองทัพเรือของเราเติบโตขึ้น เราจําเปนตองขยายโครงสรางพื้นฐานทางทะเลใหสอดคลองกัน ซึ่งจะทําใหการควบคุมแนวชายฝงยังคงอยูในมือเราอยางมั่นคง"
 PER_merchant_navy: "กองเรือพาณิชย"
 PER_merchant_navy_desc: "การขนสงทรัพยากรทางทะเลมีความสําคัญยิ่งตอความอยูรอดของ[PER.GetNameDef] ดังนั้นจึงสําคัญที่สุดที่เราตองจัดตั้งกองเรือพาณิชยมืออาชีพที่สามารถสนับสนุนกองทัพได"
 PER_expert_raiders: "นักจูโจมผูเชี่ยวชาญ"
 PER_expert_raiders_desc: "แมการปกปองการคาทางทะเลของเราจะสําคัญ แตในยามสงคราม การออกคนหาและตัดเสนทางเสบียงของศัตรูก็สําคัญยิ่งตอการทําลายเศรษฐกิจของพวกเขา เราควรมุงใชกองเรือของเราจูโจมขบวนเรือลําเลียงของศัตรู"

##################
#### IMPERIAL ####
##################

 PER_the_pahlavi_imperium: "จักรวรรดิปาหลาวี"
 PER_the_pahlavi_imperium_desc: "นับตั้งแตโคนลมราชวงศกาจารในป 1925 เรซา ชาห ปาหลาวีก็เปนพลังนําทางของ[PER.GetNameDef] ขณะที่ประเทศของเรายืนอยูบนทางแยกของความขัดแยงครั้งใหญระดับโลกอีกครั้ง องคชาหผูยิ่งใหญตองพรอมรับมือกับทุกพายุที่คุกคามจะกวาดผานดินแดน[PER.GetAdjective]อันรุงโรจนของเรา"
 PER_forced_secularization: "บังคับแยกศาสนาออกจากรัฐ"
 PER_forced_secularization_desc: "นับตั้งแตเรซา ชาห ปาหลาวีขึ้นสูอํานาจ ก็มีการตอตานนักบวชใน[PER.GetNameDef]มาโดยตลอด อิสลามยังคงเปนศาสนาประจําชาติ แตเพื่อพิสูจนตอโลกตะวันตกวาเราสามารถยืนหยัดทัดเทียมพวกเขาได ถึงเวลาแลวที่เราจะแยกศาสนาออกจากรัฐและเดินบนเสนทางแหงความทันสมัย"
 PER_legacy_of_greatness: "มรดกแหงความยิ่งใหญ"
 PER_legacy_of_greatness_desc: "ไมนาแปลกใจสําหรับผูสนับสนุนวาราชวงศปาหลาวีถูกลิขิตใหสืบทอดไปอีกหลายชั่วรุน แมภายหนาจะมีชวงเวลาอันปนปวน แตก็เห็นไดชัดวาองคชาหและพระโอรสกําลังเตรียมนํา[PER.GetNameDef]เขาสูยุคทองแหงความรุงเรือง"
 PER_imperial_funded_universities: "มหาวิทยาลัยในพระราชูปถัมภ"
 PER_imperial_funded_universities_desc: "เพื่อพิสูจนวา[PER.GetNameDef]สามารถยืนหยัดทามกลางยักษใหญของโลกนี้ได องคชาหไดบริจาคเงินจํานวนมากเพื่อสนับสนุนมหาวิทยาลัยตาง ๆ ของประเทศ ดวยของขวัญอันเอื้ออารีนี้ ประชาชนของเราจะเขาถึงการศึกษาระดับสูงที่มีคุณภาพไดมากขึ้น"
 PER_the_unification_initiative: "โครงการรวมชาติ"
 PER_the_unification_initiative_desc: "[PER.GetNameDefCap]ตองดิ้นรนมาหลายปแลว โดยเฉพาะในการรวมประชาชนใหอยูใตธงเดียวกัน ดวยความกระดางกระเดื่องของชาวเคิรดและชาวอาเซอรไบจานที่สรางปญหาทางตะวันตก และนักบวชที่ตอตานการปฏิรูปศาสนา เรามีงานหนักรออยู หากจะรวม[PER.GetNameDef]ใหเปนหนึ่งเดียวอยางถาวร"
 PER_clamp_kurdish_dissidence: "ปราบปรามความกระดางกระเดื่องของชาวเคิรด"
 PER_clamp_kurdish_dissidence_desc: "[PER.GetNameDefCap]ครอบคลุมดินแดนบางสวนที่ครั้งหนึ่งเคยเปนของชาวเคิรด ดังนั้นจึงมีผูคนจํานวนมากที่ไมพอใจการปกครองของเรา ถึงเวลาแลวที่เราจะหยุดยั้งเครือขายกบฏเหลานี้ และทําใหเสถียรภาพและความรุงเรืองกลับคืนสูภูมิภาค"
 PER_clamp_azerbaijani_dissidence: "ปราบปรามความกระดางกระเดื่องของชาวอาเซอรไบจาน"
 PER_clamp_azerbaijani_dissidence_desc: "ทางเหนือของประเทศเรามีชาวอาเซอรไบจานจํานวนมากที่ถือวา[PER.GetNameDef]เปนบาน อยางไรก็ตาม มีผูคนจํานวนไมนอยที่ไมพอใจการปกครองของเรา ถึงเวลาแลวที่เราจะหยุดยั้งเครือขายกบฏเหลานี้ และทําใหเสถียรภาพและความรุงเรืองกลับคืนสูภูมิภาค"
 PER_venerate_islam: "เชิดชูอิสลาม"
 PER_venerate_islam_desc: "อิสลามเปนรากฐานของสังคมเรานับตั้งแตจักรวรรดิเกาลมสลายในการพิชิตเปอรเซียของชาวมุสลิม นับแตนั้น ศาสนาก็มีบทบาทสําคัญในชีวิตประจําวันของพลเมืองสวนใหญ แทนที่จะตอตานนักบวช บางทีถึงเวลาที่เราจะเชิดชูศาสนาของเรา และแสดงใหโลกเห็นวาเราศรัทธาในอิสลามเพียงใด"
 PER_state_atheism: "แยกศาสนาออกจากรัฐโดยสมบูรณ"
 PER_state_atheism_desc: "ใน[PER.GetNameDef]ยุคใหม ศาสนาไมจําเปนตองมีบทบาทมากเหมือนในอดีต แทนที่จะผนวกศาสนาเขากับชีวิตประจําวัน เราควรสงเสริมแนวคิดอเทวนิยมในหมูประชาชน เพื่อใหเรามุงความสนใจไปที่โครงการพัฒนาความทันสมัย อยางไรก็ตาม สิ่งนี้ยอมทําใหนักบวชไมพอใจ"
 PER_revive_old_ways: "ฟนฟูวิถีโบราณ"
 PER_revive_old_ways_desc: "หากเราตองการโดดเดนบนเวทีโลก เราตองยึดถืออุดมคติของจักรวรรดิเปอรเซียในอดีตตอไป ดังนั้นเราควรพยายามนําศาสนาโซโรอัสเตอรกลับมาเปนศาสนาประจําชาติของ[PER.GetNameDef] ชนเผาเล็ก ๆ บางเผาที่เรรอนอยูทางตะวันออกของประเทศยังคงนับถือศาสนานี้ การฟนฟูศาสนาโบราณนี้จึงไมใชเรื่องที่เปนไปไมได"
 PER_imperial_expansionism: "การขยายจักรวรรดิ"
 PER_imperial_expansionism_desc: "ถึงเวลาแลวที่เราจะเริ่มขยายจักรวรรดิใหมของเราออกไปนอกพรมแดนปจจุบัน เราตองเตรียมจักรกลสงคราม เรียกรองใหประชาชนทําหนาที่ของตน และเตรียมแสดงใหโลกเห็นวาจักรวรรดิ[PER.GetAdjective]พรอมทวงคืนสิ่งที่เปนของเราโดยชอบธรรม"
 PER_tehran_moscow_pact: "กติกาสัญญาเตหะราน-มอสโก"
 PER_tehran_moscow_pact_desc: "ไมใชความลับที่[SOV.GetNameDef]ทะมึนอยูเหนือเราดั่งหมียักษทางเหนือ หากเราจะดําเนินอุดมการณขยายดินแดน เราตองจัดการปญหานี้โดยเร็ว เราสามารถสงคณะทูตไปมอสโกโดยเร็วที่สุด ดวยความหวังวาชาว[SOV.GetAdjective]จะยินดีทําสนธิสัญญาไมรุกราน"
 PER_establish_special_unit: "กอตั้งกองพันอมตะ"
 PER_establish_special_unit_desc: "เหลาอมตะคือหนึ่งในกองทหารที่เปนสัญลักษณที่สุดของจักรวรรดิเปอรเซียในอดีต ขณะที่เรานําพายุคใหมแหงความยิ่งใหญของจักรวรรดิ ถึงเวลาแลวที่จะฟนฟูเหลาอมตะขึ้นมาใหมในฐานะกองพันทหารจูโจมชั้นยอด"
 PER_demand_iraqi_territory: "เรียกรองดินแดนอิรัก"
 PER_demand_iraqi_territory_desc: "ดินแดนทางเหนือของ[IRQ.GetNameDef]จะเปนที่มั่นชั้นเยี่ยมในการแสดงใหผูคนในภูมิภาคนี้เห็นวา[PER.GetNameDef]ตั้งใจจะเปนมหาอํานาจเพียงหนึ่งเดียว นี่จะเปนหนึ่งในจุดเริ่มตนของการทัพพิชิตอันยิ่งใหญของเรา"
 PER_demand_afghan_territory: "เรียกรองดินแดนอัฟกานิสถาน"
 PER_demand_afghan_territory_desc: "[AFG.GetNameDefCap]เปนดินแดนแหงภูเขาและแมนํ้าคดเคี้ยว จึงยากตอการพิชิตในอนาคต หากเราสามารถตั้งที่มั่นในประเทศนั้นได ก็จะเปนจุดเตรียมพลชั้นยอดสําหรับรุกคืบไปยังคาบูล"
 PER_currently_doing_war_plan: " กําลังดําเนินการ§Yแผนสงคราม§!"
 PER_war_plan_darius: "แผนสงครามดาริอุส"
 PER_war_plan_darius_desc: "ดาริอุสมหาราชเปนผูปกครองราชวงศอะคีเมนิดที่ครองเปอรเซียในฐานะราชาธิราชในประวัติศาสตรโบราณของเรา พระองคปกครองเปอรเซียในยุคที่มีดินแดนกวางใหญที่สุด ไปจนถึงลุมแมนํ้าสินธุ ดังนั้นพระนามของพระองคจะเปนชื่อแผนการของเราในการรุกเขาสูอนุทวีปอินเดียและขับไลชาว[ENG.GetAdjective]ออกจากดินแดนเหลานี้"
 PER_foothold_in_indus: "ที่มั่นในลุมแมนํ้าสินธุ"
 PER_foothold_in_indus_desc: "[RAJ.GetNameDefCap]คือตัวอยางอันโดดเดนของอํานาจอาณานิคมของ[ENG.GetNameDef] แตชาว[ENG.GetAdjective]ไมไดเปนของที่นี่ และพวกเขาควรเรียนรูวานี่คือสิทธิโดยกําเนิดของ[PER.GetNameDef]ตามพระดํารัสของดาริอุสมหาราช เริ่มการเจรจาและยึดที่มั่นในอินเดียใหได"
 PER_usurp_afghanistan: "ยึดครอง[AFG.GetNameDef]"
 PER_usurp_afghanistan_desc: "ถึงเวลาแลวที่เราจะนําคาบูลมาอยูใตการควบคุมของ[PER.GetAdjective]เสียที สงกองกําลังของเรารุกลึกเขาไปในเทือกเขาของ[AFG.GetNonIdeologyName] และอยากลับมาจนกวาธงของเราจะโบกสะบัดเหนือพระราชวังทัจเบก"
 PER_invasion_of_india: "บุกอนุทวีปอินเดีย"
 PER_invasion_of_india_desc: "แผนบุก[RAJ.GetNameDef]ของเราอาจเปนหนึ่งในเปาหมายที่ยิ่งใหญที่สุด แตทหารของเราไมมีใครสงสัยเลยวานี่จะเปนปฏิบัติการที่อันตราย การคุกคามอินเดียเทากับเชื้อเชิญความพิโรธของชาว[ENG.GetAdjective]มาสูตัวเรา หากไมเปนปญหา ก็ขอใหเราเดินหนาบุกอินเดีย"
 PER_glory_of_cyrus: "เกียรติภูมิแหงไซรัสมหาราช"
 PER_glory_of_cyrus_desc: "เมื่อเปาหมายสงครามของเราบรรลุผลและดินแดนอยูใตอธิปไตยของ[PER.GetAdjective]อยางปลอดภัย เราไดนํายุคใหมแหงความรุงเรืองมาสู[PER.GetNameDef] ดวยความทุมเทและความกลาหาญของกองทัพ ในที่สุด[PER.GetNameDef]ก็กลับมาสมกับเกียรติภูมิของผูกอตั้งอารยธรรมของเรา ไซรัสมหาราช อีกครั้ง เกียรติจงมีแดไซรัส! เกียรติจงมีแดองคชาห!"
 PER_war_plan_xerxes: "แผนสงครามเซอรซีส"
 PER_war_plan_xerxes_desc: "เซอรซีสเปนราชาธิราชพระองคที่สี่แหงจักรวรรดิอะคีเมนิด และมีความเกี่ยวพันกับทั้งดาริอุสและไซรัสมหาราช เนื่องจากเซอรซีสเปนที่รูจักดีที่สุดจากการบุกกรีซเมื่อ 480 ปกอนคริสตกาล เราจึงตัดสินใจตั้งชื่อแผนบุกดินแดนทางตะวันตกของ[PER.GetNameDef]เพื่อเปนเกียรติแดพระองค ในที่สุดเราจะไดลางความพายแพที่เคยไดรับจากชาวเฮลเลนิก"
 PER_reclaim_turkish_peninsula: "ทวงคืนคาบสมุทรตุรกี"
 PER_reclaim_turkish_peninsula_desc: "[TUR.GetNameDefCap]คืออุปสรรคที่ขวางการขยายดินแดนไปทางตะวันตกของเรา อานาโตเลียครั้งหนึ่งเคยเปนดินแดนเปอรเซีย และถึงเวลาแลวที่เราจะทวงคืน เคลื่อนทหารเขาประจําตําแหนงและเตรียมบุก!"
 PER_reintegrate_anatolia: "ผนวกดินแดนอานาโตเลียกลับคืน"
 PER_reintegrate_anatolia_desc: "เมื่อเราไดพิชิตดินแดนภายในพรมแดนเดิมของ[TUR.GetNameDef]แลว บัดนี้เราอยูในตําแหนงที่จะเริ่มผนวกดินแดนนี้เขากับ[PER.GetNameDef]เปนดินแดนอยางเปนทางการโดยชอบดวยกฎหมาย"
 PER_clash_of_titans: "ศึกแหงไททัน"
 PER_clash_of_titans_desc: "ปญหาที่ไมคาดคิดไดปรากฏขึ้นในรูปของการเกิดใหมของ[GRE.GetNameDef] เราไมอาจปลอยใหจักรวรรดิเชนนี้สั่งสมอํานาจอยูที่ชายแดนของเราได เราตองประกาศสงครามทันที และยึดดินแดนนี้เพื่อเกียรติภูมิขององคชาห!"
 PER_absorb_byzantines: "กลืนจักรวรรดิไบแซนไทน"
 PER_absorb_byzantines_desc: "ในที่สุดเราก็ชําระความแคนนับศตวรรษตอชาว[GRE.GetAdjective]ไดดวยการโคน[GRE.GetNameDef] บัดนี้ดินแดนนี้จะถูกรวมเขามาเปนสวนหนึ่งของจักรวรรดิของเราอยางเปนทางการ"
 PER_war_plan_cambyses: "แผนสงครามแคมไบซีส"
 PER_war_plan_cambyses_desc: "ในฐานะผูสืบทอดโดยตรงของไซรัสมหาราช แคมไบซีสที่ 2 เปนราชาธิราชพระองคที่สองแหงจักรวรรดิอะคีเมนิด เนื่องจากรัชสมัยของพระองคโดดเดนดวยการพิชิตแอฟริกาเหนือและอียิปต การทัพของเราในภูมิภาคนี้จึงตั้งชื่อตามพระองคเพื่อเชิดชูเกียรติ"
 PER_path_through_iraq: "เปดทางผานอิรัก"
 PER_path_through_iraq_desc: "[IRQ.GetNameDefCap]คือประตูสูการพิชิตแอฟริกาเหนือของเรา จึงตองเปนรายแรกที่ลมสลาย ดวยแบกแดดที่อยูใกลชายแดนของเราเพียงนี้ เราไมนาจะมีปญหาในการรุกเขาประเทศนั้นและอางสิทธิ์ในดินแดนของพวกเขา"
 PER_demand_west_asia: "ยึดเอเชียตะวันตกของฝรั่งเศส"
 PER_demand_west_asia_desc: "ชาว[FRA.GetAdjective]คือผูรุกรานดินแดนนี้โดยมิชอบ และตองถูกขับไลออกไปหากเราจะบรรลุวาระของจักรวรรดิ ดินแดนของ[SYR.GetNameDef]และ[LEB.GetNameDef]ตองถูกยึด หากเราจะเดินหนาเผชิญหนากับชาว[ENG.GetAdjective]ในแอฟริกาเหนือ..."
 PER_march_to_nile: "การเดินทัพอันยาวไกลสูแมนํ้าไนล"
 PER_march_to_nile_desc: "เพื่อทวงคืนดินแดนเปอรเซียในอดีตในแอฟริกาเหนือ เราตองรุกผานแอฟริกาเหนือของ[ENG.GetAdjective]กอนจะบุกอียิปตในที่สุด สิ่งนี้ยอมนําเราไปสูสงครามกับ[ENG.GetNameDef] แตนั่นคือความเสี่ยงที่เราตองยอมรับ หากตองการสถาปนาตนเปนมหาอํานาจจักรวรรดิที่โดดเดนในภูมิภาค"
 PER_the_memphis_initiative: "โครงการเมมฟส"
 PER_the_memphis_initiative_desc: "การผนวกดินแดนเขากับจักรวรรดิเปนสิ่งสําคัญยิ่ง หากเราจะรักษาการควบคุมดินแดนที่พิชิตมาได โดยเฉพาะอียิปตที่จะควบคุมไดยากหากเราไมระมัดระวัง ดังนั้นเราควรใหความสําคัญเปนพิเศษกับพวกเขา"
 PER_assassinate_reza_shah: "การลอบสังหารเรซา ชาห"
 PER_assassinate_reza_shah_desc: "เรซา ชาห ปาหลาวีอาจสรางความเปลี่ยนแปลงครั้งใหญให[PER.GetNameDef] แตไมใชทุกอยางที่ประชาชนชื่นชอบ มีขาวลือเรื่องแผนลอบสังหารมาหลายป แตไมมีใครกลาลั่นไกจริง ๆ... หรือจะมี?"
 PER_root_out_conspiracies: "ถอนรากถอนโคนแผนสมคบคิด"
 PER_root_out_conspiracies_desc: "ตลอดหลายปที่ผานมา มีขาวลือมากมายเกี่ยวกับแผนลอบสังหารเรซา ชาห ปาหลาวี เราเห็นวาความเสี่ยงนี้สูงเกินไป ดังนั้นจึงสําคัญที่สุดที่เราตองถอนรากถอนโคนแผนสมคบคิดเหลานี้เพื่อความปลอดภัยขององคชาห"
 PER_his_fathers_footsteps: "เดินตามรอยพระบิดา"
 PER_his_fathers_footsteps_desc: "หลังการสิ้นพระชนมอันนาเศราของเรซา ชาห ปาหลาวี พระโอรสของพระองค โมฮัมหมัด เรซา ปาหลาวี ไดรับภาระเปนผูนําของ[PER.GetNameDef] แมจะเปนกษัตริยหนุมที่ไมปรารถนาจะครองราชย แตพระองคตองกาวขึ้นมาเดินตามรอยพระบิดาและนําความรุงโรจนมาสู[PER.GetNameDef]"
 PER_third_persian_empire: "จักรวรรดิเปอรเซียที่สาม"
 PER_third_persian_empire_desc: "เพื่อรักษาอนาคตของประชาชน โมฮัมหมัด เรซา ปาหลาวีไดประกาศสถาปนาจักรวรรดิเปอรเซียที่สาม ซึ่งมุงเจริญรอยตามและเคารพประวัติศาสตรของบรรพชนโบราณของเรา - ราชวงศอะคีเมนิด นี่คือยุคใหมของ[PER.GetNameDef] และเปนยุคที่จะนําเราไปสูความยิ่งใหญ"
 PER_choose_a_shahbanu: "เลือกชาหบานู"
 PER_choose_a_shahbanu_desc: "สายราชสกุลแหงราชวงศปาหลาวีตองสืบทอดตอไป แตดวยพระชนมายุที่ยังนอยของโมฮัมหมัด เรซา ปาหลาวี พระองคจึงยังไมมีโอกาสหาคูครอง ถึงเวลาแลวที่พระองคจะพิจารณาทางเลือก และเลือกสตรีผูจะเปนชาหบานูของประเทศเรา"
 PER_embrace_opulence: "โอบรับวัฒนธรรมแหงความหรูหรา"
 PER_embrace_opulence_desc: "สําหรับบุคคลสําคัญอยางราชาธิราช จําเปนยิ่งที่เราตองแสดงใหโลกเห็นวา[PER.GetAdjective]หรูหราไดเพียงใด ขอใหเราแสดงความโออาตระการตาแกทุกคนที่ปรารถนาจะไดชม"
 PER_emperor_for_people: "จักรพรรดิเพื่อประชาชน"
 PER_emperor_for_people_desc: "โมฮัมหมัด เรซา ชาห ทรงปรารถนาใหรัชสมัยของพระองคเปนหมุดหมายแหงการเชื่อมโยงจักรพรรดิกับประชาชนอีกครั้ง แทนที่จะกักตุนความมั่งคั่งไวใหราชวงศอยางเห็นแกตัว พระองคทรงปรารถนาจะใชมันเพื่อยกระดับชีวิตของพลเมืองสามัญแหง[PER.GetNameDef]"
 PER_fund_imperial_excellency: "สนับสนุนความเปนเลิศของจักรวรรดิ"
 PER_fund_imperial_excellency_desc: "จักรวรรดิไดเดินบนเสนทางแหงการอวดความมั่งคั่งตอเพื่อนบานที่ดอยกวา บัดนี้ถึงเวลาใชจายสวนหนึ่งเพื่อปรับปรุงพระราชวัง การจางทหารรักษาการณเพิ่มดูจะไดผลดีทีเดียว!"
 PER_uphold_civil_rights: "ยึดมั่นในสิทธิพลเมือง"
 PER_uphold_civil_rights_desc: "การเคารพสิทธิพลเมืองของประชาชน[PER.GetNameDef]เปนสวนสําคัญของการปกครองของโมฮัมหมัด เรซา ชาห มาโดยตลอด ดวยการยึดมั่นในหลักการพื้นฐานของสังคมนี้ เราจะสงเสริมใหประชาชนบรรลุสิ่งที่ยิ่งใหญกวาที่เคยเปนมา"
 PER_absolute_monarchy: "สมบูรณาญาสิทธิราชย"
 PER_absolute_monarchy_desc: "หลังการปราบปรามผูตอตานที่พยายามถอนรากการปกครองของพระองค เรซา ชาห ปาหลาวีไดประกาศระบอบสมบูรณาญาสิทธิราชย รวบอํานาจเขาสูราชบัลลังกมากขึ้น และทําใหมั่นใจวาไมมีใครคุกคามสายราชสกุลของพระองคได กระบวนการนี้รวมถึงการใชแนวทางทางทหารมากขึ้นในการตางประเทศ และการขยายกองทัพประจําการของ[PER.GetNameDef]"
 PER_first_iranian_empire: "จักรวรรดิอิหรานที่หนึ่ง"
 PER_first_iranian_empire_desc: "เรซา ชาห ปาหลาวีโปรดใหเรียกชาติของพระองควา[PER.GetNameDef]มาโดยตลอด และเปนผูนําชื่อนี้กลับมาใชเปนชื่อทางการของประเทศในป 1935 ดังนั้นรากฐานของความทะเยอทะยานแหงจักรวรรดิครั้งใหมของพระองคจึงเปนการสรางจักรวรรดิอิหรานขึ้นใหมทั้งหมด แทนที่จะลอกเลียนชาวเปอรเซียกอนหนาโดยตรง"
 PER_take_regional_tour: "เสด็จเยือนภูมิภาค"
 PER_take_regional_tour_desc: "หลังการกอตั้งจักรวรรดิใหม เรซา ชาห ปาหลาวีทรงปรารถนาจะเสด็จเยือนทั่วภูมิภาค ทั้ง[IRQ.GetNameDef]และ[AFG.GetNameDef] เพื่อกระชับความสัมพันธกับผูนําของทั้งสองชาติ"
 PER_limit_foreign_influence: "จํากัดอิทธิพลตางชาติ"
 PER_limit_foreign_influence_desc: "[PER.GetNameDef]ตกอยูใตอําเภอใจของมหาอํานาจตางชาติมานานเกินไปแลว พวกเขาอางสิทธิ์ในทรัพยากรของเราและเรียกรองสวนแบงจากความอุดมสมบูรณทางธรรมชาติของเรา ถึงเวลาแลวที่[PER.GetNameDef]จะยืนหยัดดวยตนเอง และเราควรจํากัดอิทธิพลที่คนนอกเหลานี้มีตอชาติของเรา"
 PER_embrace_industrial_powers: "โอบรับมหาอํานาจอุตสาหกรรม"
 PER_embrace_industrial_powers_desc: "แทนที่จะเก็บตัวและโดดเดี่ยวตนเองจากโลกภายนอก การใชประโยชนจากความสัมพันธกับมหาอํานาจอุตสาหกรรมเพื่อชวยพัฒนาอนาคตของ[PER.GetNameDef]ยอมดีกวามาก"
 PER_subserviant_to_noone: "เราไมเปนขารับใชของผูใด"
 PER_subserviant_to_noone_desc: "แมในอดีตเราอาจเคยมองวาความสัมพันธกับ[ENG.GetNameDef]และบริษัทนํ้ามันแองโกล-อิหรานเปนประโยชน แตเราไมจําเปนตองปลอยใหทรัพยากรของเราถูกมหาอํานาจตางชาติแยงชิงอีกตอไป เราควรยุบบรรษัทนี้ และหันมามุงพัฒนาดวยตัวเราเอง"
 PER_modernize_iran_economy: "พัฒนาเศรษฐกิจของ[PER.GetNameDef]ใหทันสมัย"
 PER_modernize_iran_economy_desc: "ดวยความชวยเหลือจากมิตรที่กาวหนาทางอุตสาหกรรมกวา เราจึงสามารถพัฒนาเศรษฐกิจในปจจุบันใหทันสมัยได ขณะที่โรงงานเดินเครื่องและประชาชนทํางานอยางหนัก อีกไมนานเราจะยืนเคียงขางชาติมหาอํานาจอื่น ๆ ของโลกในฐานะขุมพลังอุตสาหกรรม"
 PER_last_thousand_years: "จักรวรรดิที่จะยืนยงพันป"
 PER_last_thousand_years_desc: "ดวยความทุมเทและการทํางานหนักทั้งหมดเพื่อพัฒนาชาติ ในที่สุดเราก็มาถึงจุดที่[PER.GetNameDef]ถูกลิขิตใหยืนหยัดผานกาลเวลา และยืนบนเวทีโลกในฐานะประเทศที่ทันสมัยและทรงอํานาจ ในที่สุดเราก็กาวขามความรุงเรืองของบรรพชนอะคีเมนิดไดแลว!"
 PER_shahanshah: "ชาฮันชาห"
 PER_shahanshah_desc: "ชาฮันชาห หรือราชาธิราช คือพระอิสริยยศสูงสุดที่ถวายแดพระมหากษัตริยแหง[PER.GetNameDef] เปนพระอิสริยยศที่เหมาะสมยิ่งกับผูปกครองพระองคปจจุบัน และเปนเกียรติที่จะไดนํากลับมาใชอีกครั้ง"
 PER_rally_ancient_history: "รวมใจภายใตประวัติศาสตรโบราณ"
 PER_rally_ancient_history_desc: "ไมใชความลับที่การครองราชยอันยังใหมของราชวงศปาหลาวีทําใหผูคนมากมายใน[PER.GetNameDef]กังวลถึงอนาคต โอกาสที่ดีที่สุดในการเผยแพรความภาคภูมิใจในชาติและความไววางใจในองคชาห คือการเตือนใหประชาชนและชาวโลกระลึกวาประวัติศาสตรของเปอรเซียโบราณนั้นนาทึ่งเพียงใด ถึงเวลาเฉลิมฉลองจักรวรรดิอะคีเมนิดแลว"
 PER_rebuild_persepolis: "บูรณะเพอรเซโปลิส"
 PER_rebuild_persepolis_desc: "เพอรเซโปลิสคือเมืองหลวงทางพิธีการของจักรวรรดิอะคีเมนิด ซึ่งซากปรักหักพังตั้งอยูบนที่ราบมารวดัชต ในฐานะแหลงมรดกทางวัฒนธรรม การทุมทรัพยากรเพื่อบูรณะและฟนฟูนครโบราณแหงนี้จะเปนกาวที่ทรงพลัง และใหมันตั้งตระหงานเปนสัญลักษณแหงจักรวรรดิของเราไปอีกหลายทศวรรษ"
 PER_stand_with_germany: "ยืนเคียงขาง[GER.GetNameDef]"
 PER_stand_with_germany_desc: "หลายปมาแลวที่[GER.GetNameDef]เปนหนึ่งในคูคารายใหญที่สุดของเรา ขณะที่พวกเขาเดินหนาตามเปาหมายการพิชิตของตน การทําขอตกลงและสนธิสัญญาไมรุกรานกับพวกเขาจึงเปนทางเลือกที่ชาญฉลาด เพื่อปกปองผลประโยชนของเราเอง"
 PER_align_with_axis: "นํา[PER.GetNameDef]เขาขางฝายอักษะ"
 PER_align_with_axis_desc: "ขณะที่สงครามลุกลามในยุโรป มิตรชาว[GER.GetAdjective]ของเราตองการพันธมิตรเพื่อชวยในการทําสงคราม ถึงเวลาแลวที่เราจะลงสนามและเขารวมสงครามฝงอักษะ"
 PER_donate_oil_fields: "มอบแหลงนํ้ามันให[GER.GetNameDef]"
 PER_donate_oil_fields_desc: "หลังจากจัดหานํ้ามันใหชาติอยาง[ENG.GetNameDef]มานาน การมอบแหลงขุดเจาะบางสวนให[GER.GetNameDef]เพื่อชวยในการทําสงครามจะเปนประโยชนตอเรามากกวา หวังวาสิ่งนี้จะเปนประโยชนตอทั้งสองฝายในระยะยาว"
 PER_spoils_of_war: "ผลประโยชนจากสงคราม"
 PER_spoils_of_war_desc: "ความพยายามของเราในสงครามครั้งนี้ไมไดถูกมองขามโดยพันธมิตร ซึ่งเปดรับแนวคิดที่[PER.GetNameDef]จะไดครอบครองดินแดนในภูมิภาครอบขางหลังสงครามสิ้นสุด นี่คือโอกาสทองที่จะใชประโยชนจากผลพวงของสงคราม"
 PER_middle_east_protectorate: "สถาปนารัฐในอารักขาเหนือตะวันออกกลาง"
 PER_middle_east_protectorate_desc: "เมื่อสงครามสิ้นสุดลง เราสามารถครอบครองชาติบางสวนในดินแดนรอบ[PER.GetNameDef]ได บัดนี้เปนหนาที่ของเราในฐานะเจาเหนือหัวที่จะปกปองพวกเขาจากมหาอํานาจเดิมที่อาจรุกรานเขามา หากใครคิดจะพยายามแยงดินแดนเหลานี้ไปจากเรา ก็ลองดูสักตั้ง"

##################
### HISTORICAL ###
##################

 PER_stand_with_giants: "ยืนหยัดทามกลางยักษใหญ"
 PER_stand_with_giants_desc: "โลกกําลังทรงตัวอยูบนคมมีด และความขัดแยงกําลังกอตัวขึ้นในยุโรประหวางชาติมหาอํานาจ ขณะที่ชนวนของถังดินปนเริ่มลุกไหมอยางชา ๆ เราตองเตรียมพรอมยกระดับ[PER.GetNameDef]ใหยืนหยัดทามกลางยักษใหญของโลก และยืนยงผานกาลเวลาในฐานะสังคมที่ทันสมัยและกาวหนา"
 PER_saadabad_treaty: "สนธิสัญญาซะอดาบาด"
 PER_saadabad_treaty_desc: "เราไมมีอะไรจะเสียและมีแตจะไดจากการรักษาไมตรีกับเพื่อนบาน แนวคิดเรื่องสนธิสัญญาที่รับรองมิตรภาพอยางเปนทางการถูกหยิบยกขึ้นมาเปนครั้งคราว และถึงเวลาแลวที่เราจะริเริ่มทําใหมิตรภาพนี้ถูกบัญญัติไวในสนธิสัญญา"
 PER_increase_military_funding: "เพิ่มงบประมาณทางทหาร"
 PER_increase_military_funding_desc: "เรซา ชาห ปาหลาวี ผูนําของเรา เปนศิษยเกาของกองทหารคอสแซคเปอรเซียอันทรงเกียรติ จึงไมนาแปลกใจสําหรับคนในรัฐบาลที่พระองคกระตือรือรนจะเพิ่มขีดความสามารถทางทหารของ[PER.GetNameDef] โดยเริ่มจากการสนับสนุนงบประมาณสิ่งที่เรามีอยู เพื่อยกระดับคุณภาพทหารและเพิ่มการผลิตยุทธภัณฑ"
 PER_military_high_schools: "กอตั้งโรงเรียนมัธยมทหาร"
 PER_military_high_schools_desc: "กองทัพประจําการที่ไดรับการฝกอยางดีเริ่มตนจากเยาวชนของเรา ดวยการอบรมเยาวชนใหเปนเลิศทางการทหาร เราจะวางรากฐานสูความสําเร็จในอนาคต อาจตองใชเวลาหลายป แตทายที่สุดเราจะมีกองทัพที่ยิ่งใหญที่สุดในภูมิภาค"
 PER_persian_german_trade: "หอการคาเปอรเซีย-เยอรมัน"
 PER_persian_german_trade_desc: "[GER.GetNameDefCap]สามารถพัฒนาอุตสาหกรรมไดอยางรวดเร็วอีกครั้งหลังพายแพในมหาสงคราม นี่จะเปนแบบอยางชั้นเยี่ยมขณะที่เราผลักดันให[PER.GetNameDef]ทันสมัย ดูเหมือนผูนําคนใหมของพวกเขาก็ใหความเคารพเราดวย ทําใหการสรางความสัมพันธอันดีเปนไปอยางราบรื่น"
 PER_trial_fifty_three: "การพิจารณาคดีหาสิบสามคน"
 PER_trial_fifty_three_desc: "องคกรการเมืองคอมมิวนิสตกําลังสรางปญหาในกระบวนการรักษาการปกครองของราชวงศปาหลาวีใน[PER.GetNameDef] เราไมอาจปลอยใหกระแสตอตานสถาบันกษัตริยนี้กอตัวจนอาจกลายเปนการชุมนุมประทวงครั้งใหญได เราตองนําผูตอตานเหลานี้ขึ้นพิจารณาคดี และใหศาลตัดสินชะตากรรมของพวกเขา"
 PER_increase_education_funding: "เพิ่มงบประมาณการศึกษา"
 PER_increase_education_funding_desc: "ในฐานะสวนหนึ่งของโครงการพัฒนาความทันสมัยของเรซา ชาห มีการเนนยกระดับคุณภาพการศึกษาภายในประเทศ เราตั้งเปาจะจัดการศึกษาภาคบังคับโดยไมเสียคาใชจายทั้งสําหรับชายและหญิง และปดสถาบันการศึกษาศาสนาเอกชน ซึ่งเปนการกาวหางจากอดีตอันเปนจารีตของเรา"
 PER_open_abadan: "เปดโรงเรียนเทคนิคอาบาดาน"
 PER_open_abadan_desc: "การศึกษาดานเทคนิคจะชวยใหเรายืนหยัดทามกลางยักษใหญทางอุตสาหกรรมของโลก และดวยการเปดโรงเรียนเทคนิคแหงใหมนี้ เราจะมอบโอกาสทางการศึกษาแกผูที่ตองการทํางานในสาขาเหลานี้ ซึ่งจะชวยเรงการพัฒนาและกระบวนการสรางความทันสมัยของเรา"
 PER_royal_visit_germany: "เสด็จเยือนเยอรมนี"
 PER_royal_visit_germany_desc: "ตลอดรัชสมัยของเรซา ชาห เราไดรักษาความสัมพันธอันดีกับผูนําของ[GER.GetNameDef] ซึ่งสะทอนผานความปรารถนาของพวกเขาที่จะตอนรับการเสด็จเยือนประเทศของพวกเขา หากเราตอบรับ ความสัมพันธกับ[GER.GetNameDef]ยอมดีขึ้นตอไป แตสิ่งนี้จะเปนผลดีหรือผลเสียนั้นยังตองรอดูกันตอไป!"
 PER_german_non_aggression: "หารือสนธิสัญญาไมรุกรานกับ[GER.GetNonIdeologyName]"
 PER_german_non_aggression_desc: "เมื่อสถานการณในยุโรปเริ่มรอนระอุ เราอาจถูกกดดันใหเลือกขาง อยางไรก็ตาม สิ่งสําคัญคือ[PER.GetNameDef]ตองคงความเปนกลางหากเกิดสงครามขึ้น ดวยการพัฒนาอุตสาหกรรมขนานใหญของพวกเขา เราควรเสนอสนธิสัญญาไมรุกรานแก[GER.GetNameDef]เพื่อความปลอดภัยของเรา"
 PER_wether_the_storm: "ฝาพายุที่กําลังกอตัว"
 PER_wether_the_storm_desc: "ดูเหมือนความพยายามปกปองตนเองทางการทูตของเราจะยอนกลับมาทํารายเรา เมื่ออดีตมิตรหันมาจองมองดินแดนของเรา ดวยหวังจะปองกันไมใหเราหันไปตอตานพวกเขา แมเราจะไมมีเจตนาเชนนั้นเลย แตเราตองเตรียมพรอมรับมือกับทุกสิ่งที่อาจเกิดขึ้น"
 PER_stand_our_ground: "ยืนหยัดไมถอย"
 PER_stand_our_ground_desc: "ความหวาดกลัวและความกังวลแพรสะพัดไปทั่วรัฐบาล ขณะที่ภัยคุกคามจากเพื่อนบานและที่ไกลออกไปยังคงสรางแรงกดดันอยางไมลดละ เราตองยืนหยัดไมถอย ไมวาจะเกิดอะไรขึ้น ถึงเวลาแลวที่จะใชมาตรการเพื่อให[PER.GetNameDef]อยูรอดผานทศวรรษหนาไปได"
 PER_bolster_civilian_industry: "เสริมความแข็งแกรงอุตสาหกรรมพลเรือน"
 PER_bolster_civilian_industry_desc: "หากเราจะรอดพนพายุที่กําลังมา เราตองดูแลเสริมความแข็งแกรงใหอุตสาหกรรมพลเรือน ยิ่งเราทุมทรัพยากรมากเทาใด เศรษฐกิจของเราก็ยิ่งมีโอกาสรอดพนจากสงครามที่จะมาถึงมากเทานั้น"
 PER_upscale_military_production: "ขยายการผลิตทางทหาร"
 PER_upscale_military_production_desc: "หากเราจะยืนหยัดตอตานผูที่คุกคามชาติ เราตองพรอมเพิ่มผลผลิตอุตสาหกรรมทหารเปนสองเทา ดวยการสรางโรงงานใหม เราจะอยูในตําแหนงที่ดีที่สุดที่จะเสริมกําลังกองทัพดวยยุทโธปกรณใหมและทันสมัยตอไป"
 PER_preparatory_mobilization: "การระดมพลเตรียมการ"
 PER_preparatory_mobilization_desc: "การไมเตรียมพรอมก็คือการเตรียมพรอมที่จะลมเหลว ไมใชความลับที่มหาอํานาจตางชาติจองมอง[PER.GetNonIdeologyName]ดวยสายตาละโมบ และหากพวกเขาตองการยึดมันไป เราจะสูจนถึงที่สุด ดวยการเตรียมระดมพลกองทัพ เราจะพรอมรับมือกับทุกสิ่งที่ศัตรูโยนใสเรา"
 PER_we_will_survive: "เราจะอยูรอด"
 PER_we_will_survive_desc: "ในที่สุดสงครามก็มาถึงหนาประตูบานเรา เราจะทําอยางสุดความสามารถเพื่อตอกรกับผูรุกรานเหลานี้ และแสดงใหโลกเห็นวาชาติอันยิ่งใหญอยาง[PER.GetNameDef]จะอยูรอดไดแมในสถานการณที่เลวรายที่สุด เราดํารงอยูมาหลายพันป และจะยังคงอยูตอไปอีกหลายพันป"
 PER_we_survived: "เรารอดมาได"
 PER_we_survived_desc: "เราสามารถอยูรอดมาไดแมทุกอยางจะไมเปนใจ! บัดนี้ถึงเวลาสรางเสถียรภาพใหประชาชนของเรา"
 PER_question_of_resources: "ปญหาเรื่องทรัพยากร"
 PER_question_of_resources_desc: "เราพบวามีความเปนไปไดสูงที่อดีตพันธมิตรของเราอาจบุกเขามา เพราะ[PER.GetNameDef]อุดมไปดวยทรัพยากร แหลงนํ้ามันของเรามีคาอยางประเมินมิได จึงมีโอกาสสูงที่จะมีใครสักคนมาแยงชิง เราไมอาจปลอยใหเปนเชนนั้น ดังนั้นขอใหเราเตรียมการกําจัดภัยคุกคามเหลานี้เสียกอนที่พวกเขาจะโจมตีเรา..."
 PER_plant_resistance_cells: "ฝงเครือขายการตอตาน"
 PER_plant_resistance_cells_desc: "เพื่อเตรียมการโจมตีชิงลงมือกอน เราควรปลุกปนความไมสงบทางการเมืองในภูมิภาคเพื่อนบาน [IRQ.GetNameDef]ดูจะเปนตัวเลือกที่ดีเยี่ยม รวมถึงภูมิภาคที่ถูกยึดครองอยาง[AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef], [TMS.GetNameDef]"
 PER_preemptive_strike: "การโจมตีชิงลงมือกอน"
 PER_preemptive_strike_desc: "ไมมีใครจะมาคุกคามอธิปไตยของเราได เพื่อใหผูที่จองมองเราดวยสายตาละโมบเรียนรูที่จะไมยุงกับเรา เราจะแสดงแสนยานุภาพเต็มรูปแบบของกองทัพ[PER.GetNameDef]ใหพวกเขาเห็น หากเราโจมตีกอน พวกเขาจะไมทันตั้งรับการจูโจมที่รวดเร็วและหนักหนวง"
 PER_establish_northern_buffer_states: "กอตั้งรัฐกันชนทางเหนือ"
 PER_establish_northern_buffer_states_desc: "เพื่อใหมั่นใจวาศัตรูทางเหนือจะไมมีโอกาสบุกตรงเขาสู[PER.GetNameDef]ไดอีก เราตองปลดปลอยชาติที่ถูกยึดครองในดินแดนนี้และคืนอธิปไตยใหพวกเขา หวังวาสิ่งนี้จะปองกันการรุกรานแบบไมทันตั้งตัวในอนาคตได"
 PER_prepare_for_worst: "เตรียมรับสิ่งเลวรายที่สุด"
 PER_prepare_for_worst_desc: "เมื่อเราไดขาววาอาจมีการบุกเขาสู[PER.GetNameDef] จึงเปนการรอบคอบที่จะเริ่มเตรียมการไวหากสิ่งเลวรายที่สุดเกิดขึ้น แมเราจะรูสึกอยูแลววาสิ่งนี้กําลังจะมา แตเราไมอาจยอมนอนหงายเปดทองใหศัตรูได เราตองเสริมกําลังกองทัพเพื่อสนับสนุนความพยายามของเราเมื่อถึงเวลาโจมตีชิงลงมือกอน"
 PER_fight_for_iran: "ศึกเพื่อ[PER.GetNonIdeologyName]"
 PER_fight_for_iran_desc: "ความกลัวที่เลวรายที่สุดของเรากลายเปนจริง เมื่อกองกําลังขาศึกเจาะแนวปองกันของเราและรุกคืบในการบุก[PER.GetNameDef]เต็มรูปแบบ แมชวงเวลานี้จะยากลําบาก แตเราตองรวมพลังประชาชนและเตรียมทหารเพื่อปกปองชาติอันยิ่งใหญจากมหาอํานาจตางชาติใดก็ตามที่คุกคามอธิปไตยของเรา"
 PER_force_them_back: "ผลักดันพวกมันกลับไป"
 PER_force_them_back_desc: "เรารูมาตลอดวาเมื่อสงครามเริ่มขึ้น เราจะตองตั้งรับหรือไมก็ผลักดันศัตรูกลับไป หากเราเลือกเสนทางรุก เราจะอยูในตําแหนงที่ดีที่จะยื่นขอเรียกรองเมื่อความขัดแยงสิ้นสุด อาจมีความเสี่ยง แตกองกําลังของเราพรอมรับมือกับปฏิบัติการเชนนี้แลว"
 PER_push_to_deserts: "การรุกทางเหนือ"
 PER_push_to_deserts_desc: "กองกําลังขาศึกโจมตีเราจากชายแดนทางเหนือของ[PER.GetNameDef]เปนหลัก เราตองรวมกําลังทหารในภูมิภาคเหลานี้และปองกันไมใหผูรุกรานรุกคืบไดอีก จากนั้นเราจะบุกตอบโตและผลักดันพวกมันกลับไปยังชายแดน"
 PER_push_to_mountains: "แนวรบดานใต"
 PER_push_to_mountains_desc: "ดูเหมือนผูรุกรานจะยึดพื้นที่ทางใตของ[PER.GetNonIdeologyName]ไดแลว หากเราตองการขับไล เราตองทุมความพยายามผลักดันศัตรูกลับไปยังอาวเปอรเซีย เวลาเปนสิ่งสําคัญยิ่ง เราไมอาจปลอยใหกองกําลังของพวกมันรุกคืบไดอีก"
 PER_demand_war_reparations: "เรียกรองคาปฏิกรรมสงคราม"
 PER_demand_war_reparations_desc: "แมผูรุกรานจะพยายามอยางเต็มที่ แตพวกเขาก็ไมอาจบรรลุเปาหมาย และกลับเปนเราที่เริ่มชนะสงคราม เราตองยื่นขอเรียกรองตอพวกเขาทันที และทําใหพวกเขาชดใชความเสียหายที่กอไว"
 PER_force_white_peace: "บังคับสันติภาพแบบไมมีเงื่อนไข"
 PER_force_white_peace_desc: "การบุกของศัตรูไมไดเปนไปตามแผนนัก ดวยการตอตานอยางดุเดือดและความมุงมั่นที่จะยืนหยัดของเรา พวกเขาจึงยึดพื้นที่ใน[PER.GetNonIdeologyName]ไดไมมาก เมื่อพวกเขาประสบความยากลําบาก เราจึงอยูในตําแหนงที่ดีที่จะบังคับสันติภาพแบบไมมีเงื่อนไขกับผูรุกรานอันอวดดีเหลานี้"
 PER_dig_and_defend: "ขุดสนามเพลาะและตั้งรับ"
 PER_dig_and_defend_desc: "ขณะที่กองกําลังขาศึกหลั่งไหลเขาสูพรมแดนของชาติอันยิ่งใหญของเราจากทุกทิศทาง เราตองรีบลงมือหากจะกอบกู[PER.GetNameDef] แทนที่จะเปนฝายรุก เราจําเปนตองปกหลักตั้งรับและสรางความยุงยากใหผูรุกราน มิฉะนั้นเราเสี่ยงที่จะสูญเสียอยางมหาศาล"
 PER_capital_protect: "ปกปอง[PER.Capital.GetCapitalVictoryPointName]"
 PER_capital_protect_desc: "ดวยที่ตั้งของ[PER.Capital.GetCapitalVictoryPointName] ที่นี่จึงเปนสถานที่เหมาะสมที่สุดสําหรับการตั้งรับอยางเหนียวแนน ดวยการสรางบังเกอรและที่มั่นที่นี่ เราจะยืนหยัดเปนปราการแหงความหวังสุดทายของ[PER.GetNameDef]"
 PER_secure_coastline: "รักษาแนวชายฝง"
 PER_secure_coastline_desc: "การบุกคาดวาจะมาจากอาวเปอรเซีย ดังนั้นขอใหเราเผชิญหนาพวกเขาโดยตรง และปองกันไมใหขาศึกไดพื้นที่แมแตนอยใน[PER.GetNonIdeologyName] หากเราหยุดพวกเขาไมใหตั้งหัวหาดได เราจะอยูในตําแหนงที่ดีที่จะหยุดยั้งพวกเขาไวไดอยางสิ้นเชิง"
 PER_swear_fealty: "สาบานภักดีตอผูรุกราน"
 PER_swear_fealty_desc: "แมเราจะพยายามอยางดีที่สุดเพื่อปกปอง[PER.GetNameDef] แตเราก็ไมอาจตานทานศัตรูไวได ขณะที่ทหารของพวกเขาประชิดเมืองหลวง การติดตอเพื่อยุติสงครามนี้ทันทีโดยยอมเปนรัฐหุนเชิดจึงเปนทางเลือกที่ชาญฉลาด อยางนอยดวยวิธีนี้ เราจะปองกันความหายนะที่จะเกิดกับประเทศเพิ่มเติมได"
 PER_push_negotiations: "ผลักดันการเจรจา"
 PER_push_negotiations_desc: "ในสถานการณปจจุบัน เราสามารถตานการบุกไวไดนานเทาที่ทําไดแลว อยางไรก็ตาม เราไมอยูในฐานะที่จะผลักดันใหความขัดแยงยุติลงโดยตรง แตเราก็มีอํานาจตอรองในการเสนอทรัพยากรธรรมชาติบางสวนเพื่อรักษาอธิปไตยของเราไว"
 PER_rebuilding_iran: "ฟนฟู[PER.GetNonIdeologyName]"
 PER_rebuilding_iran_desc: "การบุกไดทิ้งใหอุตสาหกรรมและโครงสรางพื้นฐานของเราจํานวนมากพังพินาศ เราควรใชเวลานี้มุงฟนฟูประเทศใหกลับคืนสูความรุงเรืองดังเดิม เก็บกวาดซากปรักหักพังและเยียวยาบาดแผล"
 PER_declare_loyalty_to_britain: "ประกาศความภักดีตอ[ROOT.OVERLORD.GetNameDef]"
 PER_declare_loyalty_to_britain_desc: "ในฐานะรัฐในอารักขาใหมของ[ROOT.OVERLORD.GetNameDef] การดําเนินการอยางระมัดระวังและทําตามความประสงคของเจาเหนือหัวจึงเปนทางเลือกที่ชาญฉลาด บางทีนี่อาจเปนโอกาสที่เราจะไดทําโครงการพัฒนาความทันสมัยใหสําเร็จเสียที เสนทางอาจเปลี่ยนไปอยางสิ้นเชิง แตปลายทางยังคงเหมือนเดิม"
 PER_invite_british_investors: "เชิญนักลงทุนจาก[ROOT.OVERLORD.GetAdjective]"
 PER_invite_british_investors_desc: "เพื่อปรับปรุงเศรษฐกิจและฟนฟูหลังการบุก เราสามารถลองเจรจาให[ROOT.OVERLORD.GetNameDef]สงนักลงทุนมาชวยใหอุตสาหกรรมของเรากลับเขาที่เขาทาง"
 PER_request_british_equipment: "ขอยุทโธปกรณจาก[ROOT.OVERLORD.GetAdjective]"
 PER_request_british_equipment_desc: "กองทัพของเราบอบชํ้าอยางหนักระหวางการบุก เราจึงตองการสงกําลังบํารุงใหทหารอยางเรงดวน ในฐานะรัฐในอารักขาใหมของ[ROOT.OVERLORD.GetNameDef] เราอยูในตําแหนงที่ดีที่จะขอเสบียงและยุทโธปกรณเพื่อฟนฟูทหารใหกลับสูมาตรฐานเดิม"
 PER_our_place_in_empire: "ที่ทางของเรากับ[ROOT.OVERLORD.GetNameDef]"
 PER_our_place_in_empire_desc: "หลังการหารือกับรัฐบาล[ROOT.OVERLORD.GetAdjective] เราไดตัดสินใจวาแนวทางที่ดีที่สุดคือการแตงตั้ง[PER.GetLeader]เปนอุปราชคนใหมแหง[PER.GetNonIdeologyName]ควบคูไปกับตําแหนงปจจุบัน ซึ่งจะทําใหเรามีอิสระมากขึ้นในการปฏิบัติหนาที่ในฐานะสวนหนึ่งของ[ROOT.OVERLORD.GetNameDef]"
 PER_retake_north_iran: "ยึด[PER.GetNonIdeologyName]ตอนเหนือคืน"
 PER_retake_north_iran_desc: "ในชวงที่เรายอมจํานนและขอสงบศึกครั้งแรก เราไมมีทางเลือกนอกจากยกดินแดนทางเหนือให[SOU.GetNameDef] บัดนี้เมื่อเรามีอํานาจมากขึ้นแลว ถึงเวลาที่จะตอบโตผูรุกรานเหลานั้นและยึดคืนสิ่งที่เปนของเราโดยชอบธรรม"
 PER_azadi: "อาซาดี"
 PER_azadi_desc: "อาซาดีเปนคําภาษาเปอรเซียที่แปลวา 'เสรีภาพ' และจะเปนคําขวัญที่เรารวมพลังกันขณะเตรียมลุกขึ้นตอตานผูยึดครอง [ROOT.OVERLORD.GetNameDefCap]คาดหวังใหเราวางาย แตเรามีเจตนาปกปองอธิปไตยของเรามาโดยตลอด เราอาจแพในการรบ แตเรายังคงจะทําสงครามตอไป"
 PER_reinforce_iranian_identity: "ตอกยํ้าอัตลักษณ[PER.GetAdjective]"
 PER_reinforce_iranian_identity_desc: "แมจะตองยอมกมหัวใหศัตรู แตเราทุกคนยังคงเปนชาว[PER.GetAdjective] และไมมีใครพรากสิ่งนั้นไปจากเราได เราตองตอกยํ้าอัตลักษณนี้แกประชาชน และแสดงใหพวกเขาเห็นวาความปรารถนาในเสรีภาพยังคงลุกโชนอยูในใจเรา"
 PER_rally_bakhtiari_and_qashqai: "รวบรวมชาวบัคติยารีและชาวกัชไก"
 PER_rally_bakhtiari_and_qashqai_desc: "ดวยความไมพอใจตอการเปลี่ยนระบอบ ชนเผาบัคติยารีและกัชไกไดเริ่มตอตานกฎหมายของรัฐใหม เราสามารถใชประโยชนจากสิ่งนี้ และหากเรารวบรวมพวกเขามารวมอุดมการณ เราจะมีผูคนเพิ่มขึ้นชวยตอสู หากการเรียกรองเอกราชของเรากลายเปนการนองเลือด"
 PER_iran_for_iranians: "[PER.GetNonIdeologyName]เพื่อชาว[PER.GetAdjective]"
 PER_iran_for_iranians_desc: "ชางนาอับอายอยางแทจริงที่ตองยอมจํานนตอเจาอาณานิคมจักรวรรดินิยม และยกดินแดนใหผูที่ตองการทําลายอธิปไตยของเรา แตหากมีสิ่งหนึ่งที่เปนจริง นั่นคือความปรารถนาในการปกครองตนเองของเราจะไมมีวันดับสูญ ถึงเวลาแลวที่เราจะลุกขึ้นและประกาศเอกราช!"
 PER_consolidate_british_territory: "รวบรวมดินแดน[ENG.GetAdjective]"
 PER_consolidate_british_territory_desc: "[ENG.GetNameDef]มีบทบาทในตะวันออกกลางมานานเกินไปแลว ซึ่งเปนที่ที่พวกเขาไมควรอยูเลย บัดนี้เมื่อเราไดตอสูเพื่อเอกราชแลว ขอใหเราทําเชนเดียวกันเพื่อชาติอื่นในภูมิภาคนี้ และทําใหมั่นใจวาพวกเขาจะไดรับการปกปองจากเรา แทนที่จะถูกปกครองโดย[ENG.GetNameDef]"
 PER_assessing_the_opposition: "ประเมินฝายคาน"
 PER_assessing_the_opposition_desc: "กอนที่เราจะคิดขยายพรมแดนออกไปนอกอิหราน เราตองมองเขามาภายในกอน พรรคฝายคานหลายพรรคดูจะยิ่งไมพอใจรัฐบาลของเรามากขึ้นเรื่อย ๆ หากเราจะรวบรวมการสนับสนุนจากประชาชนเพื่อฟนฟูจักรวรรดิ เราตองทําใหมั่นใจวาไดรับการสนับสนุนเต็มที่ในรัฐบาล ดวยวิธีใดก็ตามที่จําเปน"
 PER_assessing_the_opposition_tt: "ปลดล็อกการตัดสินใจ §Yการปราบปรามของรัฐบาล§! ภายในภารกิจ §Yความไมสงบทางการเมือง§! จาก §Yมรดกแหงความยิ่งใหญ§! ซึ่งจะทําใหเราจัดการภัยคุกคามและปองกันสงครามกลางเมืองได"
 PER_rally_the_reformers: "กอตั้งแนวรวมแหงชาติ"
 PER_rally_the_reformers_desc: "มีกลุมการเมืองมากมายทั่วประเทศที่อยากเห็นองคชาหหรือสถาบันกษัตริยถึงจุดจบอยางกะทันหัน ขณะที่โลกเริ่มไรเสถียรภาพ โอกาสใหม ๆ อาจเปดใหกลุมเหลานี้ไดเคลื่อนไหว"
 PER_lobby_military_dissidents: "เครือขายทหารของพรรคตูเดห"
 PER_lobby_military_dissidents_desc: "พรรคตูเดหมีสมาชิกจํานวนหนึ่งดํารงตําแหนงที่มีอํานาจในกองทัพ บางทีเราอาจโนมนาวพวกเขามารวมอุดมการณ และใชพวกเขาบอนทําลายองคชาหเมื่อถึงเวลาที่เหมาะสม"
 PER_promise_clergy_power: "สัญญาอํานาจแกนักบวช"
 PER_promise_clergy_power_desc: "อิสลามเปนศิลาหลักของสังคมสําหรับประชาชนจํานวนมากของเรา เราจึงไมอาจหวังจะรักษาการสนับสนุนของประชาชนไดหากเริ่มดูหมิ่นผูศรัทธา และตองพยายามมากขึ้นเพื่อโนมนาวพวกเขามารวมอุดมการณของเรา"
 PER_exclude_religion: "กีดกันศาสนา"
 PER_exclude_religion_desc: "อิสลามและศาสนาโดยรวมกลายเปนอุปสรรคตอการพัฒนาชาติใหทันสมัยทั้งทางการเมืองและเศรษฐกิจ เราตองแสดงใหชัดเจนวาอุปสรรคเหลานี้จะถูกกาวขามใน[ROOT.GetNonIdeologyName]ยุคใหม"
 PER_stage_mass_protests: "จัดการประทวง"
 PER_stage_mass_protests_desc: "ประชาชนทนกับขออางขององคชาหและอํานาจที่ฝงรากของชนชั้นนํามามากพอแลว บัดนี้ถึงเวลาที่เราจะออกสูทองถนนและเรียกรองการเปลี่ยนแปลงทันที"
 PER_stage_mass_protests_tt: "ปลดล็อกการตัดสินใจ §Y$PER_mass_protests$§! เพื่อลดการสนับสนุนองคชาห" 
 PER_constitutional_monarchy: "ฟนฟูขอจํากัดทางรัฐธรรมนูญตอองคชาห"
 PER_constitutional_monarchy_desc: "องคชาหครอบงําการเมืองของชาติมานานเกินไปแลว แตการที่พระองคหายไปจะสรางความปนปวนแกผูคนจํานวนมากที่ยังเชื่อในบทบาทอันศักดิ์สิทธิ์ของพระองค ดังนั้นเราจะจํากัดความสามารถขององคชาหในการแทรกแซงกิจการทางการเมือง และลดบทบาทใหเหลือเพียงพิธีการ"
 PER_strengthen_iranian_parliament: "เสริมความแข็งแกรงใหรัฐสภาอิหราน"
 PER_strengthen_iranian_parliament_desc: "เมื่ออํานาจขององคชาหถูกถวงดุลแลว เราสามารถปรับปรุงกระบวนการประชาธิปไตยไดดวยการคืนอํานาจสูสภาที่มาจากการเลือกตั้ง ซึ่งเปนที่ที่อํานาจควรอยู"
 PER_strengthen_iranian_parliament_tt: "\n\n§Rหากพรรคประชาธิปไตยไดรับการสนับสนุนนอยกวา 30% องคชาหจะกอสงครามกลางเมืองตอตานเรา!§! \n\n§Rหากเกิดสงครามกลางเมือง คุณจะไมสามารถดําเนินการปฏิวัติอิสลามไดอยางเต็มที่§!"
 PER_continue_westernization: "สานตอการรับวัฒนธรรมตะวันตก"
 PER_continue_westernization_desc: "การรับวัฒนธรรมตะวันตกเปนเปาหมายที่อยูในใจของผูนําเรามาโดยตลอด หลายคนกระตือรือรนที่จะเดินตามรอยมหาอํานาจตะวันตก รับเอาอุดมการณและแนวปฏิบัติของพวกเขา หากเราตองการเขารวมกับพวกเขาในอนาคต เราตองเตรียมพรอมสําหรับการบูรณาการนั้นตั้งแตตอนนี้"
 PER_royal_college_funding: "กอตั้งมหาวิทยาลัยเตหะราน"
 PER_royal_college_funding_desc: "เปนสิ่งสําคัญยิ่งที่เราตองกาวนําในการพัฒนาทางปญญา ดวยการนําเงินบางสวนที่เราไดมาจากทองพระคลังขององคชาหไปลงในสถาบันการศึกษา เราจะอยูในตําแหนงที่ดีที่จะกาวทันความกาวหนาทางเทคโนโลยีที่เปลี่ยนแปลงอยางรวดเร็ว"
 PER_expand_oil_production: "ขยายการผลิตนํ้ามัน"
 PER_expand_oil_production_desc: "[PER.GetNonIdeologyName]อุดมไปดวยนํ้ามัน และเราคงโงหากไมใชประโยชนจากสิ่งนั้นเพื่อตัวเราเอง ขอใหเราขยายการผลิตนํ้ามัน เพื่อใหอยูในตําแหนงที่ดีในการเจรจากับชาติตะวันตกในภายหลัง"
 PER_increase_oil_sales: "เพิ่มการขายนํ้ามัน"
 PER_increase_oil_sales_desc: "เมื่อเราเปนหุนสวนกับ[ENG.GetNameDef]ในเรื่องนํ้ามันสํารองอยูแลว การใชทรัพยากรที่เพิ่งขุดไดมาเพิ่มปริมาณที่ขายใหพวกเขาจึงสมเหตุสมผล อยางไรเสียนี่ก็เปนขอตกลงที่เปนประโยชนตอทั้งสองฝาย"
 PER_request_membership_allies: "ขอเปนสมาชิกฝายสัมพันธมิตร"
 PER_request_membership_allies_desc: "เมื่อความตึงเครียดทั่วโลกเพิ่มขึ้น ในที่สุดก็ถึงเวลาที่เราตองเลือกขาง เมื่อเราใกลชิดกับมิตรชาติตะวันตกมากขึ้น การเขารวมกับพวกเขาจึงสมเหตุสมผลที่สุด เราจะรวมกันกําจัดภัยคุกคามของลัทธิฟาสซิสตทั่วโลก"
 PER_secure_iraq: "ยึดอิรักใหมั่น"
 PER_secure_iraq_desc: "ในฐานะสวนหนึ่งของหนาที่ตอพันธมิตร เราตองยึด[IRQ.GetNameDef]ใหมั่นดวยทุกวิถีทางที่จําเปน มาตรการเด็ดขาดนี้มีขึ้นเพื่อปกปองชาว[IRQ.GetAdjective]จากภัยคุกคามภายนอก และสงเสริมความเปนเอกภาพในภูมิภาค"
 PER_secure_afghanistan: "ยึดอัฟกานิสถานใหมั่น"
 PER_secure_afghanistan_desc: "[AFG.GetNameDefCap]คือหนึ่งในประตูเปดสูตะวันออกของ[PER.GetNameDef] การยึดระเบียงนี้ไวใหพันธมิตรจึงสําคัญที่สุด อีกทั้งยังทําใหเรามั่นใจไดวา[AFG.GetNameDef]จะไดรับการปกปองภายใตการดูแลของเรา นี่ยอมเปนไปเพื่อประโยชนของชาว[AFG.GetAdjective]อยางแนนอน"
 PER_post_war_spoils: "ผลประโยชนหลังสงคราม"
 PER_post_war_spoils_desc: "เมื่อสงครามสิ้นสุดลง เราตองตัดสินใจวาจะทําอยางไรกับการยึดครองเพื่อคุมครอง[IRQ.GetNonIdeologyName]และ[AFG.GetNonIdeologyName] หลังจากยื่นคํารองตอพันธมิตร เราไดตัดสินใจวาแนวทางที่ดีที่สุดคือการผนวกดินแดนเหลานี้เขาสูการปกครองของ[PER.GetNameDef] ดวยวิธีนี้ เราจะทําใหตะวันออกกลางแข็งแกรงและมีเสถียรภาพมากขึ้น"
 PER_follow_the_tudeh: "รวมพลังเคียงขางพรรคตูเดห"
 PER_follow_the_tudeh_desc: "พรรคตูเดหเปนพรรคเดียวที่สะทอนความปรารถนาของประชาชนตอการเปลี่ยนแปลงอยางถึงราก แทนที่จะเปนเพียงการแตงหนาประชาธิปไตยใหระบอบปจจุบัน ดังนั้นเราตองรวมพลังเคียงขางพวกเขาในฐานะหัวใจของขบวนการปฏิวัติ"
 PER_rally_behind_mosaddegh: "รวมพลังเบื้องหลังโมซัดเดก"
 PER_rally_behind_mosaddegh_desc: "นับตั้งแตระบอบปาหลาวีเริ่มตน โมฮัมหมัด โมซัดเดก เปนที่รูกันวาไมเห็นดวยกับการปกครองขององคชาหในหลายดาน หากเราจะตอตานราชวงศปาหลาวีอยางแทจริงและสราง[PER.GetNonIdeologyName]ใหมที่เปนประชาธิปไตยมากขึ้น บางทีเขาอาจเปนผูที่ขบวนการของเราควรรวมพลังสนับสนุน"
 PER_reach_to_seperatists: "ติดตอกลุมแบงแยกดินแดน"
 PER_reach_to_seperatists_desc: "ชนชั้นแรงงานยังไมตระหนักถึงสภาพทางเศรษฐกิจและสังคมของตนอยางเต็มที่ จึงขาดพลังที่จะเอาชนะอํานาจที่ฝงรากขององคชาห อยางไรก็ตาม มีผูคนมากมายทางเหนือและตะวันออกที่ถูกปลุกเราดวยความรูสึกชาตินิยมอาเซอรไบจานหรือเคิรด ซึ่งอาจโนมนาวมารวมอุดมการณของเราได"
 PER_reach_to_seperatists_tt: "รัฐทั้งหมดที่เราครอบครองซึ่งเปนดินแดนหลักของ §Yเคอรดิสถาน§! หรือ §Yอาเซอรไบจาน§! จะเขารวมกับเราและสงทหารมาชวยในสงครามกลางเมืองที่จะมาถึง \n\n§Rอยางไรก็ตาม พวกเขาจะคาดหวังไดรับเอกราชเปนการตอบแทนภายในสองปหลังจากแผนยุทธศาสตรนี้เสร็จสิ้น!§!"
 PER_embrace_national_front: "มุงสูสาธารณรัฐ"
 PER_embrace_national_front_desc: "อํานาจทางการเมืองและการตัดสินใจไมอาจกระจุกอยูในมือขององคชาหหรือผูสืบทอดที่ไมไดมาจากการเลือกตั้งและไมตองรับผิดชอบตอใครไดอีกตอไป เราตองยกเลิกสถาบันนี้ทั้งหมดและมุงสูการกอตั้งสาธารณรัฐ[ROOT.GetAdjective]"
 PER_force_abdication: "บีบใหสละราชสมบัติ"
 PER_force_abdication_desc: "องคชาหและพรรคพวกกําลังเซจากความไมพอใจครั้งใหญของประชาชน บัดนี้คือชวงเวลาที่จะใชความไดเปรียบบีบใหพระองคสละราชสมบัติ เพื่อที่เราจะไดปดฉากความไรสาระแบบศักดินานี้ใหสิ้นซากเสียที"
 PER_force_abdication_tt: "\n§Rหากพรรคไมฝกใฝฝายใดไดรับการสนับสนุนเกิน 50% องคชาหจะกอสงครามกลางเมืองตอตานเรา!§!"
 PER_nationalize_oil_fields: "โอนแหลงนํ้ามันเปนของรัฐ"
 PER_nationalize_oil_fields_desc: "เราใชเวลาหลายปขายนํ้ามันผานขอตกลงที่ไมเปนธรรมกับชาติที่ละโมบ ถึงเวลาแลวที่[PER.GetNameDef]จะโอนกิจการผลิตนํ้ามันเปนของรัฐ ซึ่งหมายความวาในที่สุดเราจะควบคุมทรัพยากรธรรมชาติของเราเองไดอยางเต็มที่"
 PER_free_elections: "การเลือกตั้งเสรี"
 PER_free_elections_desc: "เมื่อรัฐบาลใหมที่ถูกสรางขึ้นใหมของเรากําลังเปนรูปเปนราง ถึงเวลาแลวที่เราจะตัดสินใจวาใครจะเปนนายกรัฐมนตรีผูนํา[PER.GetNameDef]เขาสูยุคทองแหงประชาธิปไตย!"
 PER_free_elections_tt: "จะใหคุณเลือกวา§Yผูสมัคร§!คนใดเหมาะสมที่สุดที่จะนํา§Y[PER.GetNonIdeologyName]แบบประชาธิปไตย§!"
 PER_united_progressive_parties: "รวมพรรคกาวหนาเปนหนึ่ง"
 PER_united_progressive_parties_desc: "เมื่อองคชาหสละราชสมบัติ เรามีโอกาสสรางอนาคตที่กาวหนายิ่งขึ้นให[ROOT.GetNonIdeologyName] แตเพื่อการนั้น เราตองไดรับการสนับสนุนจากพรรคกาวหนาทั้งหมดในแนวรวมใหญหนึ่งเดียวที่สามารถผลักดันวาระของเราได"
 PER_strengthen_the_tudeh: "เสริมความแข็งแกรงใหพรรคตูเดห"
 PER_strengthen_the_tudeh_desc: "พรรคตูเดหไดกลายเปนกองหนาของชนชั้นแรงงาน[ROOT.GetAdjective] นําพวกเขาสูชัยชนะเหนือองคชาห บัดนี้พรรคตองไดรับอํานาจในการสถาปนาสังคมนิยม และปลดปลอยประชาชนจากพันธนาการของจักรวรรดินิยมและทุนนิยม"
 PER_soviet_alignment: "เขาขางโซเวียต"
 PER_soviet_alignment_desc: "โลกกําลังเปลี่ยนแปลงอยางรวดเร็ว และเราตองการพันธมิตรที่ทรงพลังเพื่อขมขวัญศัตรู พรรคตูเดหเปนพรรคสังคมนิยมพรรคเดียวที่มีความสัมพันธกับ[SOU.GetNameDef] จึงสามารถสรางความสัมพันธอันแนนแฟนกับพวกเขาได"
 PER_soviet_alignment_tt: "หาก §Y[SOV.GetNameWithFlag]§! เปนคอมมิวนิสต พวกเขาจะไดรับเชิญเขารวมฝายของเรา"
 PER_industrial_aid: "ความชวยเหลือดานอุตสาหกรรม"
 PER_industrial_aid_desc: "สหายของเราใน[SOU.GetNameDef]ไดแสดงใหเห็นวาเศรษฐกิจที่พึ่งพาเกษตรกรรมเปนหลักสามารถพัฒนาเปนอุตสาหกรรมไดอยางรวดเร็วดวยการวางแผนอยางรอบคอบ เราควรติดตอพวกเขาและดูวาพวกเขายินดีแบงปนความเชี่ยวชาญในเรื่องนี้หรือไม"
 PER_workers_army: "กองทัพประชาชน"
 PER_workers_army_desc: "กองทัพเต็มไปดวยพวกคลั่งตอตานการปฏิวัติที่รอโอกาสจะฟนฟูทัศนคติอันลาสมัยของตนเหนือชาติ เราตองปฏิรูปกองทัพเพื่อปองกันไมใหเกิดเหตุการณนี้ โดยเริ่มจากการขับไลพวกปฏิกิริยา"
 PER_elevate_the_iran_party: "ยกระดับพรรคอิหราน"
 PER_elevate_the_iran_party_desc: "พรรคตูเดหจะผูกชาติของเราไวกับ[SOU.GetNameDef] และรับคําสั่งจาก[SOU.Capital.GetCapitalVictoryPointName] ดังนั้นฝายกาวหนาทั้งหมดตองยืนเคียงขางพรรคอิหราน หากเราหวังจะสรางหนทางสูสังคมนิยมแบบอิหราน"
 PER_iranian_socialism: "สังคมนิยมอิหราน"
 PER_iranian_socialism_desc: "เพื่อความมั่นคงระยะยาวของรัฐ เราตองสรางพันธมิตรใหมกับรัฐบาลที่มีแนวคิดเดียวกันทั่วภูมิภาค"
 PER_iranian_industrialization: "การพัฒนาอุตสาหกรรม"
 PER_iranian_industrialization_desc: "เราจะไมทําใหตนเองตองพึ่งพามหาอํานาจตางชาติในการพัฒนาเศรษฐกิจใหทันสมัย แตเราจะใชศักยภาพที่ยังไมถูกนํามาใชของประชาชน และคนหาหนทางสูความทันสมัยของเราเอง"
 PER_international_solidarity: "ความสมานฉันทสากล"
 PER_international_solidarity_desc: "แมเราจะสลัดพันธนาการของจักรวรรดินิยมภายในพรมแดนไดแลว แตเราจะยังไมเปนอิสระอยางแทจริงจนกวามหาอํานาจจักรวรรดิจะถูกขับออกจากภูมิภาคของเรา ทวาเรายังไมพรอมสําหรับการเผชิญหนาเต็มรูปแบบ ดังนั้นเราจะเริ่มบอนทําลายดินแดนในครอบครองของพวกเขา"
 PER_appease_the_seperatists: "ปลอบประโลมกลุมแบงแยกดินแดน"
 PER_appease_the_seperatists_desc: "ถึงเวลาแลวที่เราจะทําตามพันธะที่มีตอประชากรชาวอาเซอรไบจานและชาวเคิรด ดวยการใหอํานาจปกครองตนเองในกิจการของพวกเขามากขึ้น อยางไรก็ตาม เราควรพยายามอยางหนักที่จะรักษาพวกเขาไวในเขตอิทธิพลของเรา เพื่อความมั่นคงรวมกัน"
 PER_appease_the_seperatists_tt: "§Gเราจะไมเสี่ยงตอการเกิดสงครามเรียกรองเอกราชตอตานเราอีกตอไป§!"
 PER_communist_industrialization: "คณะกรรมการวางแผนเศรษฐกิจ"
 PER_communist_industrialization_desc: "เราจะจัดตั้งหนวยงานใหมเพื่อกํากับดูแลการขยายและพัฒนาเศรษฐกิจใหทันสมัย โดยปลอดจากอคติและความเฉื่อยชาของหนวยงานเศรษฐกิจชุดกอน"
 PER_communist_education_reform: "ขยายระบบการศึกษา"
 PER_communist_education_reform_desc: "ระบบการศึกษาของเราลาสมัยและไมตอบสนองความตองการของรัฐ เราตองพาเด็ก ๆ เขาหองเรียนใหมากขึ้น และใหพวกเขาจบการศึกษาพรอมทักษะเชิงปฏิบัติที่นําไปใชในการทํางานได"
 
 PER_reject_foreign_dominance: "ปฏิเสธการครอบงําของตางชาติ"
 PER_reject_foreign_dominance_desc: "ทั้ง[SOU.GetNameDefCap]และ[ENG.GetNameDef]ตางยืนอยูหนาประตูบานเรา เห็นไดชัดวาเราอาจลงเอยเปนรัฐในอารักขาหากไมลงมือทันที ถึงเวลาแลวที่เราจะเลิกทําตัวเปนนกกระจอกเทศมุดหัวในทราย และเริ่มตอตานความเคลื่อนไหวของเกมใหญ"
 PER_iranian_revolutionary_vanguard: "กองหนาปฏิวัติอิหราน"
 PER_iranian_revolutionary_vanguard_desc: "เพื่อยืนหยัดตอกรกับมหาอํานาจที่แข็งแกรงกวาเรามาก เราตองเริ่มขยายกองทัพและระดมประชาชน แมจะไมทําใหเราทัดเทียมกับภัยคุกคามเหลานี้ แตก็จะทําใหเราเปนมากกวาแคลูกระนาดบนเสนทางของพวกเขา"
 PER_vanguard_template_tt: "สราง§Yแมแบบกองพลปนใหญ§!"
 PER_one_for_all_all_for_one: "หนึ่งคนเพื่อทุกคน ทุกคนเพื่อหนึ่งคน"
 PER_one_for_all_all_for_one_desc: "ชาว[PER.GetAdjective]ทุกคนตองไดรับการฝกใชปนอยางเต็มที่และพรอมปกปองประชาชนของตนเมื่อถึงเวลา ไมมีใครไดรับการยกเวนจากหนาที่นี้ โอกาสเดียวที่เราจะรอดจากเกมใหญและรักษาอัตลักษณอิหรานไวได คือการเริ่มระดมพลในอัตราที่[ENG.GetNameDefCap]และ[SOU.GetNameDef]ตามไมทัน"
 PER_comintern_research_collaboration: "ความรวมมือดานการวิจัยกับโคมินเทิรน"
 PER_comintern_research_collaboration_desc: "[SOU.GetNameDefCap]เปนหนึ่งในผูนําโลกดานวิทยาศาสตรและการวิจัย เมื่อเปนพันธมิตรกับพวกเขาแลว เราจึงมีโอกาสอันนาสนใจที่จะสงนักวิทยาศาสตรของเราไปเรียนรูจากนักวิทยาศาสตรชั้นนําของ[SOU.GetAdjective] และนําความรู & ทักษะของ[SOU.GetAdjective]กลับมาบานเกิด"
 PER_land_reform: "การปฏิรูปที่ดิน"
 PER_land_reform_desc: "เมื่อการปฏิวัติประสบความสําเร็จ เราจะดําเนินการปฏิรูปที่ดินอยางกวางขวาง เพื่อปลดปลอยเศรษฐกิจจากพันธนาการของระบบศักดินา"
 PER_soviet_iranian_oil_collaboration: "ความรวมมือดานนํ้ามันโซเวียต-อิหราน"
 PER_soviet_iranian_oil_collaboration_desc: "[ROOT.GetNameDefCap]และมิตรขามพรมแดนของเราใน[SOU.GetNameDef]มีนํ้ามันสํารองมหาศาลอยูในมือ ดวยการประสานงานและขยายการผลิตนํ้ามัน เราจะกุมทรัพยากรที่สําคัญที่สุดของโลกไวไดอยางมั่นคง"
 PER_iranian_nuclear_program: "โครงการนิวเคลียรของ[ROOT.GetAdjective]"
 PER_iranian_nuclear_program_desc: "การเริ่มโครงการอาวุธปรมาณูของเราเองเปนกาวสําคัญยิ่งที่จะเปลี่ยนเราจากชาติที่ออนแอและไรความสําคัญ ไปสูมหาอํานาจโลกที่แข็งแกรงดังที่[ROOT.GetNameDef]ถูกลิขิตไว"

 PER_iranian_culture: "รวมพลังกลุมชาตินิยมสุดโตง"
 PER_iranian_culture_desc: "แมนักการเมืองและองคชาหจะพูดจาสวยหรูเพียงใด แตไมมีใครยอมทําสิ่งที่จําเปนเพื่อปกปองมรดกทางวัฒนธรรมและบูรณภาพแหงดินแดนของเรา เราจะรวมนักเขียนและนักชาตินิยมที่กระจัดกระจายเขาเปนขบวนการทางการเมืองใหมที่จะฟนฟูชาติสูความยิ่งใหญ"
 PER_ally_the_bazaari: "โนมนาวชนชั้นนํา"
 PER_ally_the_bazaari_desc: "ชนชั้นนํา[PER.GetAdjective]เริ่มกังวลมากขึ้นเรื่อย ๆ เกี่ยวกับทิศทางของชาติ หลายคนหวาดกลัวตออนาคตของธุรกิจหรือทรัพยสินของตน และอาจยินดีสนับสนุนอุดมการณของเรา เพื่อแลกกับการรับประกันวาจะปกปองพวกเขาจากแรงสั่นสะเทือนทางการเมือง"
 PER_brown_shirts: "การเดินขบวนของหนวยจูโจม"
 PER_brown_shirts_desc: "เมื่อไมนานมานี้ สมาชิกพรรคของเราจํานวนมากหันมาสวมเครื่องแบบเสื้อสีนํ้าตาลแบบขบวนการฟาสซิสตในยุโรป บางทีเราควรนําสมาชิกผูทุมเทเหลานี้มาจัดการเดินขบวนครั้งใหญเพื่อปลุกกระแสสนับสนุนขบวนการ"
 PER_march_on_saadabad: "เดินขบวนสูซะอดาบาด"
 PER_march_on_saadabad_desc: "ระบอบนี้ลมเหลวในการแกไขความคับแคนของเรา ดังนั้นเราจะเดินขบวนสูพระราชวังซะอดาบาดและยื่นคําขาดตอองคชาห จะยอมเปลี่ยนแนวทางและคงเปนพระประมุขตอไป หรือจะเผชิญความพิโรธของขบวนการเรา"
 PER_roll_back_reforms: "ฟนฟูชาติ"
 PER_roll_back_reforms_desc: "แมองคชาหจะพัฒนาชาติใหทันสมัยไดบาง แตการปฏิรูปยังไมไปไกลพอ เราจะดําเนินวาระที่ลึกซึ้งและถึงรากยิ่งกวา ซึ่งจะฟนฟูเราสูความยิ่งใหญ"
 PER_fascist_secularism: "บังคับใชหลักฆราวาสนิยม"
 PER_fascist_secularism_desc: "การบังคับเปลี่ยนจักรวรรดิเปอรเซียใหนับถืออิสลามไดทําลายวัฒนธรรมอันยิ่งใหญของเราในอดีต เราตองกลับคืนสูรากเหงา และขจัดศาสนาตางถิ่นนี้ออกจากทุกดานของชีวิตสาธารณะดวยการบังคับใชหลักฆราวาสนิยมอยางเครงครัด"
 PER_form_savama: "กอตั้งตํารวจลับ"
 PER_form_savama_desc: "เหลาผูทรยศที่ละทิ้งวัฒนธรรมของเราหรือทํางานเปนสายลับใหมหาอํานาจตางชาติตองถูกถอนรากถอนโคนโดยเร็วที่สุด เพื่อการนี้ เราจะจัดตั้งหนวยตํารวจพิเศษใหมขึ้น"
 PER_fascist_reach_out_to_germany: "มองไปทางตะวันตก"
 PER_fascist_reach_out_to_germany_desc: "เมื่อการถูกดึงเขาสูความขัดแยงระดับโลกในรูปแบบใดรูปแบบหนึ่งดูจะมีแนวโนมมากขึ้นเรื่อย ๆ บางทีเราควรเขาขางระบอบที่มีแนวคิดเดียวกันอยาง[GER.GetNameDef]"
 PER_fascist_reach_out_to_japan: "มองไปทางตะวันออก"
 PER_fascist_reach_out_to_japan_desc: "ชาว[JAP.GetAdjective]รูซึ้งถึงความยากลําบากในการพัฒนาชาติใหทันสมัยพรอมกับปกปองวัฒนธรรมจากพลังกัดกรอนของการรับวัฒนธรรมตะวันตก เราควรเขาขางพวกเขาเพื่อทลายการกุมอํานาจโลกของชาติตะวันตก"
 PER_pan_iranianism: "ลัทธิรวมชาติอิหราน"
 PER_pan_iranianism_desc: "ยังมีชุมชนชนชาติอิหรานกระจัดกระจายอยูนอกพรมแดนของเรา ซึ่งเปนสถานการณที่ไมอาจปลอยใหดําเนินตอไปได ถึงเวลาแลวที่จะสงเสริมอัตลักษณมหาอิหราน และเริ่มผลักดันการรวมประชาชนของเราเปนหนึ่งเดียว"
 PER_anti_soviet_resistance_network: "การตอตาน[SOU.GetAdjective]"
 PER_anti_soviet_resistance_network_desc: "พวกเขาจะแตงแตมอยางไรก็ได แตความจริงคือ[SOU.GetNameDef]เปนเพียงจักรวรรดิรัสเซียอีกรูปแบบหนึ่ง และชนชาติอิหรานจํานวนมากยังคงติดอยูใตแอกเผด็จการของพวกเขา เราตองพยายามมากขึ้นในการบอนทําลายอํานาจของพวกเขาและสงเสริมการปลดปลอยประชาชนของเรา"
 PER_intervene_in_central_asia: "ปกปองชาวมหาอิหรานพลัดถิ่น"
 PER_intervene_in_central_asia_desc: "เราไดบั่นทอนการควบคุมเอเชียกลางของ[SOU.GetAdjective]แลว ยิ่งไปกวานั้น พวกเขากําลังวุนอยูกับความขัดแยงทั่วโลก ดังนั้นเราควรใชชวงเวลานี้ขับไลพวกเขาออกจากภูมิภาคใหสิ้นซาก"
 PER_proclaim_greater_iran: "ประกาศมหาอิหราน"
 PER_proclaim_greater_iran_desc: "พรมแดนของเราไดรับการฟนฟูกลับสูตําแหนงอันชอบธรรมในทุกดาน และเราไดปลดปลอยประชาชนจากความกดขี่ของการปกครองตางชาติแลว บัดนี้ในที่สุดเราก็ประกาศการกําเนิดของมหาอิหรานที่จะยืนยงผานกาลเวลาได"
 PER_fascist_attack_turkey: "สกัดภัยคุกคามจาก[TUR.GetAdjective]"
 PER_fascist_attack_turkey_desc: "ชาว[TUR.GetAdjective]และบรรพชนออตโตมันของพวกเขาไดกัดกินพรมแดนและบอนทําลายวัฒนธรรมของเรามาชานาน ขณะเดียวกันก็ยึดครองดินแดนที่เปนของประชาชนเราโดยชอบธรรม เราตองแกไขความอยุติธรรมทางประวัติศาสตรนี้"
 PER_intervention_in_iraq: "แทรกแซงใน[IRQ.GetNonIdeologyName]"
 PER_intervention_in_iraq_desc: "[IRQ.GetNonIdeologyName]เปนเพียงสิ่งประดิษฐของนักจักรวรรดินิยมตะวันตกที่ขีดเสนพรมแดนบนแผนที่ ชาติเชนนี้ไมอาจดํารงอยูได และควรคืนสูเจาของโดยชอบธรรม ซึ่งก็คือเรา"
 PER_crush_saudi_arabia: "การบูรณาการเศรษฐกิจสงคราม"
 PER_crush_saudi_arabia_desc: "การพิชิตเมื่อไมนานมานี้ทําใหเราไดอุปกรณอุตสาหกรรมและบุคลากรจํานวนมากที่สามารถขนสงกลับบานเพื่อใชงานได แมวาจะตองใชรถไฟจํานวนมากในการขนยายก็ตาม"
 PER_fascist_attack_afghanistan: "เผชิญหนาอัฟกานิสถาน"
 PER_fascist_attack_afghanistan_desc: "ชนชาติอิหรานจํานวนมากติดอยูนอกพรมแดนของเรา ภายใตการกดขี่ของชาวปชตุนใน[AFG.Capital.GetCapitalVictoryPointName] การดูหมิ่นบูรณภาพแหงดินแดนของเราเชนนี้จะไมไดรับการอดทนอีกตอไป"
 PER_modify_opposition_tt: "ปรับ §Y$PER_opposition_modifier$§! ดังนี้:"
 PER_communist_afghanistan_intervention: "ปวนเกมใหญ"
 PER_communist_afghanistan_intervention_desc: "ชาว[ENG.GetAdjective]และชาว[SOU.GetAdjective]ทะเลาะกันเรื่องสถานะของ[AFG.GetNonIdeologyName]มาเกือบหนึ่งศตวรรษ เราจะพลิกดุลอํานาจใหเปนประโยชนตอเราดวยการสถาปนาระบอบคอมมิวนิสตขึ้นที่นั่น"
 PER_communist_liberate_pashtuns: "สนับสนุนชาตินิยมปชตุน"
 PER_communist_liberate_pashtuns_desc: "เมื่อ[AFG.GetNonIdeologyName]อยูในเขตอิทธิพลของเราอยางมั่นคง เราสามารถใชมันบอนทําลายเสถียรภาพของเขตชายแดน[ENG.GetAdjective] ดวยการสงเสริมชาตินิยมปชตุนใหแผขยายไปทั่วพื้นที่"
 PER_communist_liberate_pashtuns_tt: "ปลดล็อกการตัดสินใจ §Y$PER_gulf_decisions_cat$§! เพิ่มเติม เพื่อสงเสริมการตอตานมหาอํานาจอาณานิคมตามแนวชายแดนอัฟกานิสถาน-อิหราน"
 PER_communist_destabilize_iraq: "บอนทําลายเสถียรภาพอิรักตอนเหนือ"
 PER_communist_destabilize_iraq_desc: "ชาว[ENG.GetAdjective]พึ่งพานํ้ามันที่ไหลมาจาก[IRQ.GetNonIdeologyName] เราสามารถบอนทําลายการเขาถึงนํ้ามันของพวกเขาไดดวยการสงเสริมการลุกฮือของชาวเคิรดทางเหนือของประเทศและดึงพวกเขามาเปนพวกเรา"
 PER_communist_destabilize_iraq_tt: "ปลดล็อกการตัดสินใจ §Y$PER_gulf_decisions_cat$§! เพื่อสงเสริมการลุกฮือของชาวเคิรด"
 PER_communist_kurdish_uprising: "เตรียมการลุกฮือของชาวเคิรด"
 PER_communist_kurdish_uprising_desc: "TODO"
 PER_revolution_in_the_gulf: "การปฏิวัติในอาว"
 PER_revolution_in_the_gulf_desc: "ดุลอํานาจในภูมิภาคกําลังเปลี่ยนไปในทางที่เปนประโยชนตอเรา เราตองใชความไดเปรียบนี้และเริ่มสงเสริมขบวนการตอตานอาณานิคมใหแผขยายไปทั่วพื้นที่"
 PER_revolution_in_the_gulf_tt: "ปลดล็อกการตัดสินใจ §Y$PER_gulf_decisions_cat$§! เพิ่มเติม เพื่อสงเสริมการตอตานในรัฐอาวเปอรเซียที่ถูกยึดครอง"
 PER_hormuz_crisis: "วิกฤตฮอรมุซ"
 PER_hormuz_crisis_desc: "พวกจักรวรรดินิยมกําลังเสียเปรียบ บัดนี้คือเวลาที่จะบีบใหพวกเขาออกจากภูมิภาคภายใตภัยคุกคามวาจะถูกโจมตีทุกแนวรบ เราจะเริ่มกระบวนการนี้ดวยการปดลอมชองแคบฮอรมุซไมใหเรือของจักรวรรดิผาน"
 PER_hormuz_crisis_tt: "§Yมหาอํานาจอาณานิคมทุกชาติในคาบสมุทรอาหรับหรืออาวเปอรเซียจะไดรับเหตุการณใหถอนตัวจากดินแดนในภูมิภาค หากพวกเขาปฏิเสธ เราจะมีโอกาสประกาศสงครามกับพวกเขา§!"
 PER_communist_gulf_hegemony: "ความเปนเจาแหงอาวเปอรเซีย"
 PER_communist_gulf_hegemony_desc: "เราไดทําสิ่งที่ดูเหมือนเปนไปไมไดสําเร็จ นั่นคือการขับไลมหาอํานาจจักรวรรดิออกจากอาวเปอรเซีย บัดนี้เราคือมหาอํานาจโดยพฤตินัยของภูมิภาค และสามารถเริ่มแผอิทธิพลไดโดยปราศจากการแทรกแซงจากภายนอก"
 PER_communist_propaganda: "วิทยุแหงชาติอิหราน"
 PER_communist_propaganda_desc: "การโอนสถานีวิทยุเปนของรัฐใหรวมเปนผูแพรภาพสาธารณะเพียงรายเดียว จะทําใหเรามีชองทางโนมนาวความคิดเห็นของประชาชนอยางรวดเร็วในเรื่องที่ยังไมสอดคลองกับจุดยืนของรัฐ"
 PER_communist_propaganda_tt: "ปลดล็อกการตัดสินใจ §Y$PER_national_iranian_radio$§! เพื่อเพิ่มเสถียรภาพ การสนับสนุนสงคราม และความนิยมของพรรค"
 PER_the_new_economy: "เศรษฐกิจใหม"
 PER_the_new_economy_desc: "หลังการปฏิรูปของเรา เศรษฐกิจรูปแบบใหมที่ตั้งอยูบนความตองการของประชาชนแทนที่จะเปนอารมณของตลาด เริ่มกอตัวขึ้นในที่สุด แมงานยังไมเสร็จสิ้น แตเราก็กลาวไดวาเรากําลังสรางสังคมนิยมขึ้นใน[ROOT.GetNameDef]"
 PER_oil_and_rubber_industry: "กระจายอุตสาหกรรม"
 PER_oil_and_rubber_industry_desc: "แมประเทศของเราจะมีแหลงนํ้ามันมหาศาลที่ยังไมไดใชประโยชน แตเราไมควรปลอยใหเศรษฐกิจตองพึ่งพาการสงออกนํ้ามันไปตางแดนแตเพียงอยางเดียว ดังนั้นเราตองกระจายอุตสาหกรรมเพื่อผลิตสินคาที่เหมาะกับการบริโภคภายในประเทศ"
 PER_the_peoples_airforce: "กองทัพอากาศปฏิวัติประชาชน"
 PER_the_peoples_airforce_desc: "หากเราจะสถาปนาตนเปนมหาอํานาจระดับภูมิภาค เราตองแสดงอํานาจควบคุมเหนืออาวเปอรเซีย เพื่อการนี้ เราจะเริ่มสรางกองทัพอากาศของประชาชนเพื่อรับมือกับความเปนเจาทางทะเลของมหาอํานาจจักรวรรดินิยม"
 PER_communist_air_defense: "โครงการปองกันภัยทางอากาศ"
 PER_communist_air_defense_desc: "เราจะไมยอมใหทุกสิ่งที่เราสรางมาถูกทําลายจากฟากฟาโดยมหาอํานาจจักรวรรดินิยม ดังนั้นเราจะสรางเครือขายการปองกันภัยทางอากาศทั่วประเทศ"
 PER_communist_basic_plane_design: "ความรวมมือดานกองทัพอากาศ"
 PER_communist_basic_plane_design_desc: "การปฏิรูปกองทัพอากาศของเราเริ่มตนไดดี บัดนี้เราตองมุงพัฒนาเทคโนโลยีและทักษะที่จําเปนสําหรับการรับมือกับเรือรบ บางทีเราอาจเรงกระบวนการนี้ไดดวยความชวยเหลือจากสหายในตางแดน"
 PER_communist_naval_bomber_design: "แบบเครื่องบินทิ้งระเบิด[SOU.GetAdjective]-[ROOT.GetAdjective]"
 PER_communist_naval_bomber_design_desc: "ดวยความชวยเหลือจากมิตร[SOU.GetAdjective]ของเรา เราเกือบพรอมแลวที่จะสงกองเครื่องบินทิ้งระเบิดทางทะเลซึ่งจะทําลายลางกองทัพเรือใดก็ตามที่โงเขลาพอจะแลนเขาอาวเปอรเซียโดยไมไดรับอนุญาตจากเรา"
 PER_challenge_the_royal_navy: "ทาทายกองเรืออังกฤษ"
 PER_challenge_the_royal_navy_desc: "บัดนี้เรามีทั้งเทคโนโลยีและความรูเชิงทฤษฎีที่จะตอกรกับศัตรูตัวฉกาจแลว แตเรายังขาดประสบการณจริงที่จําเปนตอการทําใหสําเร็จ บางทีเราอาจสั่งสมความรูผานการยั่วยุขนาดเล็กในอาวเปอรเซียไดกระมัง"
 PER_the_peoples_navy: "กองทัพเรือปฏิวัติประชาชน"
 PER_the_peoples_navy_desc: "แมเราจะไมอาจหวังทาทายกองเรือผิวนํ้าของมหาอํานาจจักรวรรดินิยมบนผิวนํ้าได แตเราอาจทําไดดวยการพัฒนาเรือดํานํ้าชั้นใหมที่ออกแบบมาเพื่อภารกิจนี้โดยเฉพาะ"
 PER_communist_shore_defense: "โครงการปองกันชายฝง"
 PER_communist_shore_defense_desc: "การรักษาแนวปองกันทางทะเลที่แข็งแกรงตลอดแนวชายฝงจะชวยยับยั้งผูรุกรานที่คิดจะยกพลขึ้นบกบนฝงของเราไดเปนอยางดี"
 PER_communist_naval_designs: "ความรวมมือดานกองทัพเรือ"
 PER_communist_naval_designs_desc: "การปฏิรูปกองทัพเรือของเรามีความคืบหนา แตเราตองทุมเทเปนทวีคูณและเริ่มพัฒนาเทคโนโลยีเรือดํานํ้า บางทีสหายของเราในที่อื่นอาจยินดีชวยเหลือเราในภารกิจนี้"
 PER_communist_submarine_design: "การพัฒนาเรือดํานํ้า[SOU.GetAdjective]-[ROOT.GetAdjective]"
 PER_communist_submarine_design_desc: "เมื่อรวมมือกับสหาย[SOU.GetAdjective]ของเรา เราใกลจะพัฒนาเรือดํานํ้าลํ้าสมัยที่จะชวยใหเราครองอาวเปอรเซียไดแลว"
 PER_eastern_expansion: "ขยายสูตะวันออก"
 PER_eastern_expansion_desc: "โลกเปลี่ยนแปลงไปอยางมากในชวงไมกี่ปที่ผานมา และระบอบการปกครองทางตะวันออกของเรายังคงเปราะบางและพรอมจะลมสลาย เราอาจไมมีโอกาสเชนนี้อีกแลวที่จะผนวกพวกเขาเขามาอยูในเขตอิทธิพลของเรา"
 PER_curtail_pan_arabism: "สกัดลัทธิรวมชาติอาหรับ"
 PER_curtail_pan_arabism_desc: "ชาวอาหรับในตะวันออกกลางและแอฟริกาเหนือมีความรูสึกเปนปกแผนแบบรวมชาติอาหรับมากขึ้นเรื่อย ๆ เราไมอาจปลอยใหพวกเขากลายเปนกําลังที่รวมตัวกันอยูหนาประตูบานเรา จึงตองชิงโจมตีกอนเพื่อปองกันไมใหสิ่งนั้นเกิดขึ้น"
 PER_there_can_be_only_one: "จะมีไดเพียงหนึ่งเดียว"
 PER_there_can_be_only_one_desc: "แมเราอาจมีคุณคาหลายอยางรวมกันกับ[GER.GetNameDef] แตเปนที่ชัดเจนขึ้นเรื่อย ๆ วาพวกเขามองตนเองเหนือกวาทุกชาติในโลก นี่คือการหยามเกียรติประชาชนและมรดกของเรา และเราตองแกไขความเขาใจผิดของพวกเขาดวยกําลัง"
 PER_iran_first: "[ROOT.GetNonIdeologyName]มากอน"
 PER_iran_first_desc: "ไมมีผูใดนอกจากชาวอิหรานเองที่จะปกปองคุณคาและวัฒนธรรมของเราไดอยางเพียงพอ ดังนั้นเราจะมุงไลตามเปาหมายของเราเองและบังคับใหโลกโอนออนตามเจตจํานงของเรา"
 PER_propagate_political_literature: "จัดตั้งกลุมฝายคานทองถิ่น"
 PER_propagate_political_literature_desc: "สถาบันของรัฐจักรวรรดิอาจดูยิ่งใหญเกินกวาที่ปจเจกบุคคลจะเอาชนะได แตความจริงแลวทรัพยากรของมันกระจายบางเบาไปทั่วประเทศ และไมอาจรับมือกับขบวนการตอตานที่กระจายอํานาจได เพื่อสรางความเปลี่ยนแปลง เราจะฉวยประโยชนจากจุดออนนี้"
 PER_propagate_political_literature_tt: "ปลดล็อกการตัดสินใจ §Y$PER_mass_protests$§! เพื่อจัดตั้งกลุมฝายคานในรัฐตาง ๆ เพื่อไมใหรัฐเหลานั้นเขารวมกับพระเจาชาหหากเกิด§Rสงครามกลางเมือง§!"
 PER_brown_shirts_tt: "§Yเราจะไดรับกองพลทหารอาสา [?ROOT.PER_fascist_militia_count] กองพลเมื่อเขาสูสงครามกลางเมืองกับพระเจาชาหหรือเมื่อกลายเปนฟาสซิสต§!"
 PER_rally_the_reformers_tt: "ปลดล็อกการตัดสินใจ §Y$PER_mass_protests$§! เพื่อจัดตั้งฐานปฏิบัติการสําหรับขบวนการฝายคานของเรา"
 PER_fascism_sway_the_rich_idea_tt: "เมื่อสงครามกลางเมืองเริ่มตน หรือขบวนการฟาสซิสตขึ้นครองอํานาจ เราจะไดรับแนวคิดตอไปนี้:"
 PER_finding_a_shah: "เฟนหาพระเจาชาห"
 PER_finding_a_shah_desc: "เมื่อราชวงศปาหลาวีพายแพ เรามีโอกาสที่จะสถาปนาพระเจาชาหที่วางายกวาขึ้นสูบัลลังกสุริยัน ผูซึ่งจะทรงรับฟงคําแนะนําอันชาญฉลาดของที่ปรึกษาที่ไววางใจ"
 PER_finding_a_shah_tt: "เราจะสามารถเลือกไดวาใครจะเปนพระเจาชาหองคใหมแหง[ROOT.GetNameDef]ในเหตุการณถัดไป"
 PER_form_sumka: "กอตั้ง SUMKA"
 PER_form_sumka_desc: "ดาวูด มอนชีซาเดห เพิ่งใชเวลาอยูใน[GER.GetNameDef]และไดคุนเคยกับขบวนการนาซีที่นั่น บัดนี้ดูเหมือนเขาพรอมจะกลับอิหรานเพื่อใชประโยชนจากกระแสชาตินิยมในปจจุบันเพื่อนําพาไปสูระเบียบใหมของอิหราน"
 PER_form_arya_party: "กอตั้งพรรคอารยะ"
 PER_form_arya_party_desc: "ฮาซัน อารฟา เปนนายทหารผูภักดีและผูปกปองพระเจาชาหอยางแข็งขันในฐานะภาพสะทอนของพระผูเปนเจา อยางไรก็ตาม เขาอาจใชประโยชนจากกระแสชาตินิยมที่กําลังเพิ่มขึ้นเพื่อปฏิรูปประเทศอยางถอนรากถอนโคน เกินกวาที่พระเจาชาหจะทรงฝนถึงเสียอีก"
 PER_iranian_socialist_revolution: "การปฏิวัติสังคมนิยมอิหราน"
 PER_iranian_socialist_revolution_desc: "ถึงเวลาแลวที่ชนชั้นแรงงานแหงอิหรานจะลุกขึ้นบดขยี้ระบอบชาหอันออนแอและผูบังคับใชอํานาจชนชั้นกระฎมพีของมัน และแทนที่ดวยรัฐใหมของกรรมกรและชาวนาที่ประชาชนปกครองเอง"
 PER_iranian_socialist_revolution_tt: "\n§Rหากพรรคคอมมิวนิสตมีความนิยมนอยกวา 50% พระเจาชาหจะเปดฉากสงครามกลางเมืองกับเรา!§!"
 PER_islamic_restoration: "ตอตานลัทธิคลั่งตะวันตก"
 PER_islamic_restoration_desc: "กระแสคลั่งการทําตัวใหเปนตะวันตกเมื่อไมนานมานี้กําลังกัดกรอนรากฐานของวัฒนธรรมอิสลามและสังคมอิหรานโดยรวม รัฐบาลจึงตองทํามากขึ้นในการจํากัดการเขาถึงความชั่วรายของตะวันตกและอุดมการณไรศรัทธาของพวกเขา"
 PER_ally_bazaari: "ผูกมิตรกับพอคาบาซาร"
 PER_ally_bazaari_desc: "ตลาดบาซารและพอคาที่ดําเนินกิจการเปนเสาหลักของชุมชนเรามาหลายศตวรรษ บัดนี้พวกเขากําลังเผชิญแรงกดดันที่เพิ่มขึ้นจากบรรษัทขามชาติของมหาอํานาจอุตสาหกรรม หากเราออกนโยบายปกปองพอคา พวกเขาก็นาจะหันมาสนับสนุนแนวทางอนุรักษนิยมของเรา"
 PER_islamic_solidarity: "ภราดรภาพอิสลาม"
 PER_islamic_solidarity_desc: "แมเราอาจไมไดเห็นพองกับนิกายอื่นนอกเหนือจากชีอะหเสมอไป แตเราปฏิเสธไมไดวาเราทุกคนมีศัตรูรวมกัน นั่นคือมหาอํานาจจักรวรรดินิยมแหงยุโรปตะวันตกที่ยังคงแทรกแซงกิจการภายในของเรา หากรวมมือกัน เราจะขับไลพวกเขาออกจากแผนดินของเราไดตลอดกาล"
 PER_promote_resistance_levant: "ขบวนการตอตานจักรวรรดินิยม"
 PER_promote_resistance_levant_desc: "ความพยายามรับมือกับพวกจักรวรรดินิยมของเรามักเจอการตอตานอยางหนักเพราะอํานาจการยิงที่เหนือกวาอยางทวมทนของพวกเขา แตก็ไมขาดแคลนผูคนที่ยินดีจับอาวุธขึ้นสูหลังแนวขาศึก"
 PER_entice_foreign_investment: "ดึงดูดการลงทุนจากตางชาติ"
 PER_entice_foreign_investment_desc: "เศรษฐกิจของเรามีศักยภาพเติบโตมหาศาลดวยทรัพยากรธรรมชาติที่อุดมสมบูรณและประชากรในเมืองที่เพิ่มขึ้นและกําลังหางานทํา แตเราตองการการลงทุนจากตางประเทศมากขึ้นเพื่อจุดชนวนการเติบโตนั้น"
 PER_increase_faculty_staffing_budget: "เพิ่มงบประมาณบุคลากร"
 PER_increase_faculty_staffing_budget_desc: "หากเราจะรักษาความเกงกาจทางเทคโนโลยีไวและไมลาหลัง เราตองดึงดูดผูที่ฉลาดที่สุดในประเทศใหได คาใชจายอาจสูง แตราคาของความชะงักงันทางเทคโนโลยีจะสูงยิ่งกวา"
 PER_increase_faculty_staffing_budget_tt: "ปรับ §Y$PER_technological_modifier$§! ดังนี้:\n"
 PER_invest_in_univerity_facilities: "ลงทุนในสิ่งอํานวยความสะดวกของมหาวิทยาลัย"
 PER_invest_in_univerity_facilities_desc: "หากเราหวังจะแขงขันทางเทคโนโลยี เราตองดูแลสิ่งอํานวยความสะดวกสําหรับนักศึกษา อาจารย และนักวิทยาศาสตร เราไมอาจปลอยใหอัจฉริยะของเราถูกจํากัดดวยอุปสรรคไรสาระอยางการขาดอุปกรณที่เหมาะสม"
 PER_islamic_revolution: "การปฏิวัติอิสลาม"
 PER_islamic_revolution_desc: "วันเวลาของพระเจาชาหใกลหมดลงแลว มัสยิดกองไปดวยเสียงเรียกรองการเปลี่ยนแปลง และทองถนนก็ไมอยูใตการบัญชาของพระองคอีกตอไป ระเบียบเกาจะตองลมสลาย"
 PER_reinstate_qajars: "ฟนฟูราชวงศกาจาร"
 PER_reinstate_qajars_desc: "ราชวงศกาจารเปนราชวงศสุดทายที่ปกครอง[PER.GetNameDef]กอนรัชสมัยของราชวงศปาหลาวี หลังถูกโคนลมในป 1925 โดยเรซา ชาห ปาหลาวีเอง รัชทายาทโดยสันนิษฐานของราชวงศ คือ โมฮัมหมัด ฮัสซัน มีรซา ไดลี้ภัยอยูใน[ENG.GetNameDef] เมื่อราชวงศปาหลาวีไมสามารถรักษาผลประโยชนของ[ENG.GetAdjective]ใน[PER.GetNameDef]ไวได บางทีอาจถึงเวลาฟนฟูราชวงศกาจาร และหวังวาสิ่งนี้จะเปนที่พอใจของเจานายคนใหมของเรา"
 PER_secularize_the_state: "แยกศาสนาออกจากรัฐ"
 PER_secularize_the_state_desc: "นับตั้งแตเราเริ่มผลักดันการทําใหเปนตะวันตก ก็มีการตอตานจากนักบวชใน[PER.GetNameDef]อยูตลอด อิสลามยังคงเปนศาสนาประจําชาติของเรา แตเพื่อพิสูจนตอโลกตะวันตกวาเราสามารถยืนเคียงขางพวกเขาได ถึงเวลาแลวที่เราจะแยกศาสนาออกจากรัฐและเดินบนเสนทางแหงความทันสมัย"

