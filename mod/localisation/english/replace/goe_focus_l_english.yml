 RAJ_his_majestys_loyal_government_break_free_tt: "เพื่อหลุดพนอยางสมบูรณ เราตองทําแผนยุทธศาสตรปลายสายทั้งสามใหสําเร็จ ไดแก §Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! และ §Y$RAJ_holding_the_gates_of_india$§!"
