 RAJ_secular_rule_alt: "มรดกตีมูริด"
 RAJ_secular_rule_alt_desc: "ถึงเวลาแลวที่จะทวงคืนดินแดนหัวใจแหงบรรพชน สรางยุคใหมจากขุนเขาที่ใหกําเนิดราชวงศของเรา ดวยการตั้งรากฐานจักรวรรดิไวในใจกลางอันทุรกันดารของอัฟกานิสถาน เราจะรักษาอํานาจของเราและฟนฟูรากฐานแหงการปกครองของจักรวรรดิ"
 RAJ_theocratic_rule_alt: "มรดกมองโกล"
 RAJ_theocratic_rule_alt_desc: "เราคือทายาทของผูพิชิต ผูสืบทอดจักรวรรดิที่เคยสั่นสะเทือนโลก เพื่อเชิดชูมรดกมองโกล เราตองสรางเอกภาพดวยความแข็งแกรง นําอนุทวีปอินเดียมาอยูใตการปกครองของเราในฐานะประชาชนหนึ่งเดียว ซึ่งผูกพันกันไมใชดวยศรัทธาหรือชาติกําเนิด แตดวยความจงรักภักดีตอราชบัลลังก ตอหนาอานุภาพแหงจักรวรรดิ ทุกผูคนตองคุกเขา"
 RAJ_secret_weapons: "ฟนฟูความเปนเลิศทางวิทยาศาสตร"
 RAJ_secret_weapons_desc: "เราจะสถาปนาตนเปนผูนําโลกดานการพัฒนาจรวดอีกครั้ง และใชมันเพื่อทําลายลางศัตรูของเรา"

 RAJ_his_majestys_loyal_government: "รัฐบาลผูจงรักภักดีตอพระมหากษัตริย"
 RAJ_his_majestys_loyal_government_desc: "แมเสียงเรียกรองเอกราชจะดังขึ้นเรื่อย ๆ บนทองถนน แตกลไกของ[ROOT.GetName]ยังคงมั่นคง ภายใตการปกครองของอุปราชที่พระมหากษัตริยทรงแตงตั้งและคํ้าจุนโดยราชการพลเรือนอินเดีย เราจะสานตอผลประโยชนของราชบัลลังกดวยวินัยและความแนวแน"
 RAJ_the_government_of_india_act: "พระราชบัญญัติรัฐบาลอินเดีย"
 RAJ_the_government_of_india_act_desc: "พระราชบัญญัติรัฐบาลอินเดียไดเปดประตูสูการปกครองตนเองที่มากขึ้นภายในมณฑลของเรา ดวยการมอบอํานาจแกกระทรวงทองถิ่นมากขึ้น เราจะเอาใจเสียงสายกลางและเพิ่มประสิทธิภาพการบริหาร ในขณะที่จักรวรรดิยังคงกุมบังเหียนไวอยางมั่นคง"
 RAJ_work_with_local_leaders: "ทํางานรวมกับผูนําทองถิ่น"
 RAJ_work_with_local_leaders_desc: "ดวยการรวมมือกับบุคคลผูทรงอิทธิพลในมณฑลตาง ๆ เราสามารถขยายอํานาจโดยไมตองใชทรัพยากรเกินกําลัง ผูนําเหลานี้เขาใจความตองการของภูมิภาคตนและสามารถดําเนินการปรับปรุงที่เปนประโยชนทั้งตอประชาชนของพวกเขาและผลประโยชนของราชบัลลังก"
 RAJ_concessions_to_the_industrialists: "สัมปทานแกนักอุตสาหกรรม"
 RAJ_concessions_to_the_industrialists_desc: "เพื่อกระตุนการพัฒนาโดยไมสูบเงินจากทองพระคลังของจักรวรรดิ เราจะเสนอเงื่อนไขที่เอื้อประโยชนแกนักอุตสาหกรรมที่ยินดีลงทุนในการเติบโตของภูมิภาค แลกกับสัมปทานเพียงเล็กนอย ผูนําทองถิ่นจะไดรับความภักดีผานความมั่งคั่ง"
 RAJ_empower_provincial_authorities: "เสริมอํานาจหนวยงานระดับมณฑล"
 RAJ_empower_provincial_authorities_desc: "แทนที่จะเอาใจผลประโยชนของเอกชน เราจะเสริมอํานาจการบริหารของหนวยงานทองถิ่นใหกํากับดูแลการพัฒนาโดยตรง ดวยการมอบการตัดสินใจดานการลงทุนแกการปกครองระดับมณฑล เราจะทําใหความภักดีไดรับการตอบแทนดวยความรับผิดชอบ"
 RAJ_confer_with_the_congress: "ปรึกษาหารือกับพรรคคองเกรส"
 RAJ_confer_with_the_congress_desc: "แมหลายคนในฝายบริหารจะเลือกความเงียบ แตการเพิกเฉยตอขบวนการเรียกรองเอกราชโดยสิ้นเชิงเสี่ยงตอความไมสงบที่รุนแรงขึ้น ดวยการรับพิจารณาขอเรียกรองบางประการ เราอาจคลายความโกรธเคืองและเสริมเสถียรภาพภายในได"
 RAJ_favor_the_muslim_league: "หนุนสันนิบาตมุสลิม"
 RAJ_favor_the_muslim_league_desc: "ดวยการใหการยอมรับและการสนับสนุนทางการเมืองแกสันนิบาตมุสลิมมากขึ้น เราสามารถสรางฝายถวงดุลที่ภักดีตอขบวนการชาตินิยมกระแสหลัก การเสริมอํานาจใหพวกเขาจะสรางความขัดแยงที่เปนประโยชนในหมูผูที่ตองการเปนปากเสียงแทนทั้งอินเดีย ความสามัคคีคือพลัง สวนความแตกแยกคือการเมืองที่ควบคุมได"
 RAJ_the_indian_parliament: "รัฐสภาอินเดีย"
 RAJ_the_indian_parliament_desc: "ดวยขอเรียกรองการปกครองตนเองที่เพิ่มขึ้น เราจะจัดตั้งรัฐสภาอินเดียเพื่อรับอํานาจฝายพลเรือนจากอุปราช การเปลี่ยนผานนี้จะมอบอํานาจปกครองตนเองอยางแทจริงแกผูนําทองถิ่น ภายในกรอบของจักรวรรดิ แนนอน"
 RAJ_court_the_princes: "เอาใจเหลาเจาชาย"
 RAJ_court_the_princes_desc: "รัฐมหาราชาเปนเสาหลักแหงความภักดีและความสงบเรียบรอยในอนุทวีปมาชานาน ดวยการยืนยันสิทธิพิเศษของพวกเขาและใหมีสวนรวมในการปกครองโดยตรงมากขึ้น เราจะเสริมรากฐานของจักรวรรดิใหแข็งแกรงตอการปลุกระดมของกลุมประชานิยมที่กําลังเพิ่มขึ้น"
 RAJ_the_integrity_of_india_act: "พระราชบัญญัติบูรณภาพแหงอินเดีย"
 RAJ_the_integrity_of_india_act_desc: "เพื่อตอตานภัยคุกคามจากการปลุกปนที่เพิ่มขึ้นและรักษาอํานาจของจักรวรรดิ เราจะตราพระราชบัญญัติบูรณภาพแหงอินเดีย กฎหมายนี้ใหอํานาจเราในการคุมขังผูปลุกปน จํากัดการแสดงความเห็นตางทางการเมือง และรับประกันการปกครองที่ภักดีทั่วอนุทวีป ทายที่สุดแลว เอกภาพบางครั้งก็ตองบังคับใช"
 RAJ_princely_state_donations_GOE: "การบริจาคจากรัฐมหาราชา"
 RAJ_princely_state_donations_GOE_desc: "$RAJ_princely_state_donations_desc$"
 RAJ_the_jewel_becomes_the_crown: "อัญมณีกลายเปนมงกุฎ"
 RAJ_the_jewel_becomes_the_crown_desc: "เมื่อมาตุภูมิลมสลาย บัดนี้จึงเปนหนาที่ของเราที่จะแบกรับภาระการนําในครอบครัวแหงจักรวรรดิ ดวยพลังที่ฟนคืน เราจะใชทรัพยากรอันมหาศาลของ[ROOT.GetNameDef]เพื่อปลดปลอยหัวใจของจักรวรรดิและทําลายทุกผูที่กลายํ่ายีผืนแผนดินเขียวขจีอันรื่นรมยของนาง"
 RAJ_the_punjab_accord: "ขอตกลงปญจาบ"
 RAJ_the_punjab_accord_desc: "ดวยการยอมรับสถานะอันเปนเอกลักษณของชุมชนซิกขและมอบอํานาจปกครองตนเองแบบจํากัดในปญจาบ เราจะเสริมสายสัมพันธแหงความภักดีและการรับใชที่สืบทอดมาชานาน ในทางกลับกัน การสนับสนุนอยางตอเนื่องของพวกเขาจะเสริมอํานาจของ[ROOT.GetNameDef]ในภูมิภาคที่มีความสําคัญยิ่ง และทําใหประเพณีกับเสถียรภาพเดินเคียงคูกันไป"
 RAJ_the_dominion_of_india: "ประเทศในเครือจักรภพอินเดีย"
 RAJ_the_dominion_of_india_desc: "เมื่อความสงบเรียบรอยไดรับการฟนฟูอยางมั่นคงในอนุทวีปแลว ถึงเวลาที่เราจะเขารับตําแหนงเคียงขางพี่นองแหงจักรวรรดิในฐานะประเทศในเครือจักรภพที่ภักดีและปกครองตนเองของจักรวรรดิ \nขอพระราชาจงทรงพระเจริญ!"
 RAJ_curtail_the_zamindars: "จํากัดอํานาจซามินดาร"
 RAJ_curtail_the_zamindars_desc: "อิทธิพลที่ฝงรากลึกของเจาที่ดินในชนบทขัดขวางความพยายามที่จะปรับปรุงการปกครองใหทันสมัยและดึงศักยภาพเต็มที่ของ[ROOT.GetNameDef]ออกมาใชมาชานาน ดวยการถายโอนอํานาจการบริหารและทรัพยากรไปยังเจาหนาที่ที่คัดเลือกจากความสามารถและสถาบันที่ตรวจสอบไดมากขึ้น เราจะลดอิทธิพลของพวกเขา พรอมเสริมรากฐานของรัฐที่ตอบสนองตอประชาชนไดดียิ่งขึ้น"
 RAJ_raise_import_duties: "ขึ้นภาษีนําเขา"
 RAJ_raise_import_duties_desc: "เพื่อลดการพึ่งพาทางเศรษฐกิจและสงเสริมการเติบโตภายในประเทศ เราจะเก็บภาษีนําเขาสินคาตางชาติในอัตราที่สูงขึ้น นโยบายนี้จะปกปองอุตสาหกรรมทองถิ่น รักษาเงินทุนไวภายในพรมแดน และทําให[ROOT.GetNameDef]ยืนหยัดไดดวยลําแขงของตนเอง"
 RAJ_imperial_industry_initiative: "โครงการอุตสาหกรรมแหงจักรวรรดิ"
 RAJ_imperial_industry_initiative_desc: "เพื่อรักษาสถานะของ[ROOT.GetNameDef]ในฐานะเสาหลักของจักรวรรดิ เราตองมุงมั่นขยายอุตสาหกรรมในเมืองอยางขนานใหญ โครงการอุตสาหกรรมแหงจักรวรรดิจะทุมทรัพยากรสูการผลิตหนักและแรงงานฝมือ ทําใหเมืองของเรากลายเปนกลไกแหงความทนทานและการฟนฟูในอนุทวีป"
 RAJ_rural_development_plan: "แผนพัฒนาชนบท"
 RAJ_rural_development_plan_desc: "เมื่อการปฏิรูปการเกษตรกําลังดําเนินไป บัดนี้เราตองนําอุตสาหกรรมสูชนบท การใชเครื่องจักรกล โครงการโครงสรางพื้นฐานในชนบท และการผลิตขนาดเล็กจะเปลี่ยนหมูบานใหเปนกลไกการผลิต"
 RAJ_the_great_recovery: "การฟนตัวครั้งใหญ"
 RAJ_the_great_recovery_desc: "บาดแผลจากภาวะเศรษฐกิจตกตํ่าครั้งใหญยังคงหลงเหลืออยูทั่วเศรษฐกิจของเรา ฉุดรั้งความกาวหนาและบั่นทอนความเชื่อมั่น แตบัดนี้ ดวยเสถียรภาพและวิสัยทัศนที่ฟนคืน เราจะสลัดภาระแหงความซบเซาทิ้งไป นี่จะไมใชเพียงการกลับสูภาวะปกติ แตคือจุดเริ่มตนของบทใหมสําหรับ[ROOT.GetNameDef]"
 RAJ_reform_the_agricultural_sector: "ปฏิรูปภาคเกษตรกรรม"
 RAJ_reform_the_agricultural_sector_desc: "การใชที่ดินอยางไรประสิทธิภาพและวิธีการที่ลาสมัยมาหลายทศวรรษทําใหภาคเกษตรกรรมของ[ROOT.GetNameDef]เปราะบางตอความปนปวน ดวยการปฏิรูปที่ตรงจุด การลงทุนในโครงสรางพื้นฐาน และเทคนิคสมัยใหม เราจะเพิ่มผลผลิตและสรางแหลงอาหารที่ทนทานยิ่งขึ้น"
 RAJ_expand_the_zamindari_system: "ขยายระบบซามินดารี"
 RAJ_expand_the_zamindari_system_desc: "ระบบซามินดารีเปนกรอบที่เชื่อถือไดสําหรับการปกครองชนบทและการจัดเก็บรายไดมาชานาน ดวยการขยายขอบเขตและยืนยันสิทธิพิเศษของเจาที่ดินผูภักดี เราจะรักษาความสงบเรียบรอยในทองถิ่นและประสิทธิภาพการบริหารไดโดยไมทําใหรัฐสวนกลางรับภาระเกินกําลัง"
 RAJ_crown_commodities: "สินคาโภคภัณฑแหงราชบัลลังก"
 RAJ_crown_commodities_desc: "ดวยการใหความสําคัญกับการเพาะปลูกพืชเศรษฐกิจเพื่อการสงออก เราจะไดรับรายไดที่มั่นคงและตอกยํ้าความสําคัญทางเศรษฐกิจของเราตอจักรวรรดิ ชา ฝาย ปอกระเจา และสินคาหลักอื่น ๆ ของการคาอาณานิคมจะเปนกระดูกสันหลังแหงความมั่งคั่งในชนบท"
 RAJ_rural_mechanization_program: "โครงการเครื่องจักรกลการเกษตรในชนบท"
 RAJ_rural_mechanization_program_desc: "เพื่อเพิ่มผลผลิตทางการเกษตรและลดการพึ่งพาวิธีใชแรงงานแบบลาสมัย เราจะดําเนินโครงการอยางเปนระบบเพื่อนําการทําฟารมดวยเครื่องจักรกลมาสูชนบท รถแทรกเตอร เครื่องนวดขาว และระบบชลประทานจะเปลี่ยนแปลงผลิตภาพในชนบทและวางรากฐานสําหรับเศรษฐกิจสมัยใหมที่พึ่งพาตนเองได"
 RAJ_the_riches_of_the_raj: "ความมั่งคั่งแหงบริติชราช"
 RAJ_the_riches_of_the_raj_desc: "ใตที่ราบอันกวางใหญและเนินเขาอันทุรกันดารของ[ROOT.GetNameDef]มีทรัพยากรที่จําเปนตอการขับเคลื่อนจักรวรรดิในยามสงคราม เหล็กกลา นํ้ามัน และวัตถุดิบสําคัญอื่น ๆ จะถูกขุดคน กลั่น และนําไปใชในการปกปองอาณาจักร"
 RAJ_strengthen_ties_with_british_investors_GOE: "กระชับความสัมพันธกับนักลงทุนอังกฤษ"
 RAJ_strengthen_ties_with_british_investors_GOE_desc: "$RAJ_strengthen_ties_with_british_investors_desc$"
 RAJ_imperial_rail_renewal_act: "พระราชบัญญัติฟนฟูทางรถไฟแหงจักรวรรดิ"
 RAJ_imperial_rail_renewal_act_desc: "เพื่อใหการเคลื่อนยายสินคา กองทหาร และเสบียงทั่วอนุทวีปเปนไปอยางรวดเร็ว เราจะลงทุนยกเครื่องโครงสรางพื้นฐานทางรถไฟของ[ROOT.GetNameDef]อยางครอบคลุม พระราชบัญญัติฟนฟูทางรถไฟแหงจักรวรรดิจะปรับปรุงเสนทางที่เกาแกใหทันสมัย ขยายขีดความสามารถดานการสงกําลังบํารุง และเชื่อมดินแดนอันกวางใหญของเราเขาดวยกันดวยเหล็กกลาและไอนํ้า"
 RAJ_exploit_the_frontier: "ใชประโยชนจากดินแดนชายขอบ"
 RAJ_exploit_the_frontier_desc: "แหลงทรัพยากรมหาศาลซอนอยูในภูมิภาคหางไกลที่ยังไมถูกใชประโยชนของอนุทวีปและไกลออกไป ดวยการขยายการดําเนินงานและเพิ่มการควบคุมเหนือดินแดนอยาง[BRM.GetNonIdeologyName] เราจะไดวัตถุดิบสําคัญอยางทังสเตนและปอนจักรกลสงครามที่กําลังเติบโตของเรา"
 RAJ_overlords_railway_investment: "การลงทุนทางรถไฟจาก[ROOT.OVERLORD.GetAdjective]"
 RAJ_overlords_railway_investment_desc: "เมื่อวางรากฐานสําหรับระบบรางสมัยใหมแลว เราจะเชิญกลุมทุนอุตสาหกรรมและการเงิน[ROOT.OVERLORD.GetAdjective]มาลงทุนเพื่อขยายและปรับปรุงเครือขายตอไป เงินทุนของพวกเขาผนวกกับโครงสรางพื้นฐานที่กําลังเติบโตของเรา จะสรางระบบรางที่คูควรกับจักรวรรดิ"
 RAJ_territorial_development_scheme: "แผนพัฒนาดินแดน"
 RAJ_territorial_development_scheme_desc: "เพื่อใชศักยภาพทางเศรษฐกิจของ[ROOT.GetNameDef]อยางเต็มที่ เราตองทบทวนการจัดสรรและการใชที่ดินใหม แผนพัฒนาดินแดนจะระบุภูมิภาคที่ดอยพัฒนา ขจัดอุปสรรคตอการเติบโต และเตรียมพื้นที่ใหมสําหรับการขยายอุตสาหกรรม"
 RAJ_the_empires_workshop: "โรงงานของจักรวรรดิ"
 RAJ_the_empires_workshop_desc: "เพื่อรักษาความแข็งแกรงของจักรวรรดิทามกลางความตองการของโลกที่เพิ่มขึ้น เราจะกระชับความสัมพันธทางเศรษฐกิจระหวาง[ROOT.GetNameDef]และ[ROOT.OVERLORD.GetNameDef] การลงทุนและการขยายโรงงานที่ประสานกันในทั้งสองดินแดนจะเปลี่ยนฐานอุตสาหกรรมรวมของเราใหเปนกลไกการผลิตที่เปนหนึ่งเดียว"
 RAJ_institute_of_fundamental_research_GOE: "สถาบันวิจัยพื้นฐาน"
 RAJ_institute_of_fundamental_research_GOE_desc: "ดวยการสนับสนุนจากนักอุตสาหกรรมชั้นนําและนักวิทยาศาสตรผูปราดเปรื่อง เราจะจัดตั้งสถาบันวิจัยพื้นฐานเพื่อดําเนินการศึกษาเชิงทฤษฎีขั้นสูง สถาบันนี้จะเปนศูนยกลางของการทดลองที่ลํ้าสมัย รวมถึงการศึกษาพลังงานปรมาณู"
 RAJ_keep_calm_and_carry_on: "สงบนิ่งและกาวตอไป"
 RAJ_keep_calm_and_carry_on_desc: "ในชั่วโมงแหงความยากลําบากที่สุดนี้ เราจะไมหวั่นไหว [ROOT.GetNameDefCap]จะผงาดขึ้นเปนปอมปราการแหงความแข็งแกรง หลอมเครื่องมือแหงสงครามดวยความมุงมั่นไมรูเหน็ดเหนื่อย ปลอยใหเตาหลอมลุกโชนและโรงตีเหล็กขับขาน เพราะชัยชนะไมไดเกิดจากความสุขสบาย แตเกิดจากความกลาหาญ หยาดเหงื่อ และเหล็กกลา"
 
 RAJ_indian_gentleman_officers: "นายทหารสุภาพบุรุษอินเดีย"
 RAJ_indian_gentleman_officers_desc: "เพื่อรับประกันอนาคตและความปลอดภัยของอัญมณีแหงจักรวรรดิอันยิ่งใหญของเรา จําเปนอยางยิ่งที่เราตองหาบุรุษผูภักดีมานํากองทัพ[RAJ.GetAdjective]ใหมของเรา บุรุษเหลานี้ไดรับใช[RAJ.GetNameDef]อยางดีผานความรวมมืออยางใกลชิดกับทางการจักรวรรดิ จนคูควรจะไดรับการแตงตั้งเปนผูบัญชาการที่ไวใจไดมากที่สุดของเรา"
 RAJ_the_aden_protectorate: "รัฐในอารักขาเอเดน"
 RAJ_the_aden_protectorate_desc: "มณฑลเอเดนบนคาบสมุทรอาระเบียอยูภายใตเขตอํานาจของเรา ดังนั้นจึงสําคัญยิ่งที่เราตองปกปองที่นี่ เพื่อพิสูจนให[ENG.GetNameDef]เห็นวา[RAJ.GetNameDef]สามารถปกปองผลประโยชนของจักรวรรดิ[ENG.GetAdjective]ในนานนํ้าตะวันออกกลางได"
 RAJ_linlithgows_declaration_of_war: "การประกาศสงครามของลินลิทโกว"
 RAJ_linlithgows_declaration_of_war_desc: "ในฐานะสวนหนึ่งของจักรวรรดิ[ENG.GetAdjective] เปนหนาที่ของเราที่จะจับอาวุธและรวมรบในสงครามของพวกเขา ไมมีเวลาใหเสียไปกับการขออนุญาตจากผูนําพรรคคองเกรส ตองจับวัวชนที่เขา รางคําประกาศและเตรียมทําสงครามกับศัตรูของ[ENG.GetNameDef]"
 RAJ_consult_with_congress_leaders: "ปรึกษาผูนําพรรคคองเกรส"
 RAJ_consult_with_congress_leaders_desc: "แทนที่จะบีบบังคับตนเองเขารวมสงครามของ[ENG.GetNameDef] เราตองใชชองทางอยางเปนทางการ ใหเราปรึกษาผูนําพรรคคองเกรสและรองขอตอพวกเขา ดวยความหวังวาพวกเขาจะอนุญาตให[RAJ.GetNameDef]เขาสูสงคราม"
 RAJ_preemptive_invasion_of_iran: "บุกอิหรานกอนเพื่อตัดไฟแตตนลม"
 RAJ_preemptive_invasion_of_iran_desc: "[PER.GetNameDef]มีพรมแดนติดกับเราทางตะวันตก และหากไมจัดการอยางรวดเร็ว พวกเขาอาจเปดทางตรงใหศัตรูของเราเขาสู[RAJ.GetNameDef]ผานระเบียงเปอรเซีย การรุกรานเชนนี้ยอมเรียกความโกรธเคืองจากผูที่มุงรักษาสันติภาพ แตหากเราสําเร็จ แหลงนํ้ามันอันอุดมสมบูรณของ[PER.GetNameDef]ก็จะเปนของเรา"
 RAJ_mobilization_of_the_indian_army: "ระดมพลกองทัพอินเดีย"
 RAJ_mobilization_of_the_indian_army_desc: "เรามีจํานวนมหาศาล และจิตใจของเราฮึกเหิมในการปกปองจักรวรรดิอันรุงโรจน แมอาจตองใชเวลาในการรวบรวมกําลังจากทุกมุมของอนุทวีป แตจําเปนอยางยิ่งที่เราตองเริ่มระดมพลกองทัพ[RAJ.GetAdjective] ถึงเวลาที่จะยืนหยัดและตอสูเพื่อ[RAJ.GetNameDef]และ[ENG.GetNameDef]"
 RAJ_support_naval_invasions: "สนับสนุนการยกพลขึ้นบก"
 RAJ_support_naval_invasions_desc: "สงครามครั้งนี้จะไมไดสูกันเพียงบนบกและในอากาศ แตยังรวมถึงในทะเลดวย เชนเดียวกับที่การระดมกําลังภาคพื้นดินมีความสําคัญ เราตองเตรียมกองทัพเรือใหพรอมสนับสนุนแผนการยกพลขึ้นบกของพันธมิตร"
 RAJ_assume_eastern_naval_responsibilities: "รับผิดชอบภารกิจทางเรือดานตะวันออก"
 RAJ_assume_eastern_naval_responsibilities_desc: "ไมมีใครสงสัยเลยวา[JAP.GetNameDef]กําลังกอปญหาทางตะวันออก เมื่อแผนการของพวกเขาเริ่มปรากฏ จําเปนอยางยิ่งที่เราตองเตรียมกองทัพเรือเพื่อปกปองนานนํ้า[RAJ.GetAdjective] เราตองรองขอตอราชบัลลังกใหสงเรือของกองทัพเรือ[ENG.GetAdjective]มาชวยเหลือเรา"
 RAJ_south_east_asia_command: "กองบัญชาการเอเชียตะวันออกเฉียงใต"
 RAJ_south_east_asia_command_desc: "เมื่อความตึงเครียดเพิ่มขึ้น ความตองการศูนยบัญชาการแบบรวมศูนยสําหรับเอเชียตะวันออกเฉียงใตก็เพิ่มขึ้นตาม เราสามารถเปนผูริเริ่มการเคลื่อนไหวนี้ โดยสรางฐานปฏิบัติการที่ใชวางแผนการรบบนภาคพื้นทวีป"
 RAJ_desert_training: "การฝกรบในทะเลทราย"
 RAJ_desert_training_desc: "เพื่อพัฒนาทักษะและประสิทธิภาพของกองกําลังรบ เราสามารถจัดตั้งระบบการฝกในและรอบทะเลทรายธาร ซึ่งนาจะชวยใหทหารของเราปรับตัวเขากับสภาพแวดลอมแหงแลงได"
 RAJ_fortify_el_alamein: "เสริมปอมเอล-อะลาเมน"
 RAJ_fortify_el_alamein_desc: "เอล-อะลาเมนเปนจุดยุทธศาสตรสําคัญในการยึดครองและรักษาอียิปต ราชบัลลังกจะซาบซึ้งอยางยิ่งตอความพยายามของเราในการชวยเสริมปอมปราการในภูมิภาคนี้และปองกันไมใหศัตรูไดที่มั่นในแอฟริกาเหนือของ[ENG.GetAdjective]"
 RAJ_jungle_training_GOE: "การฝกรบในปา"
 RAJ_jungle_training_GOE_desc: "ในดินแดนที่กวางใหญอยางของเรา เราโชคดีที่มีความหลากหลายของภูมิประเทศที่ใชเปนขอไดเปรียบได [RAJ.GetNonIdeologyName], [BRM.GetNonIdeologyName] และอินโดจีนปกคลุมดวยปา จึงควรมีการฝกพิเศษเพื่อใหทหารของเรามีประสิทธิภาพในภูมิประเทศอันตรายเชนนี้"
 RAJ_defense_of_malaya: "การปองกันมลายา"
 RAJ_defense_of_malaya_desc: "[MAL.GetNameDef]อาจเสี่ยงตอการถูกรุกรานดวยตําแหนงที่ตั้งระหวางมหาสมุทรอินเดียและแปซิฟก ในฐานะอัญมณีแหงราชบัลลังกดวยกัน เราตองทําหนาที่ของเราในการชวยปกปองและเสริมปอมปราการในภูมิภาคนี้ เราตองรักษาการควบคุมเอเชียตะวันออกเฉียงใตไว"
 RAJ_hill_training: "การฝกรบบนเขา"
 RAJ_hill_training_desc: "ในฐานะสวนหนึ่งของการกระจายรูปแบบการฝกใหทหาร เราตองทําใหมั่นใจวาพวกเขาพรอมรบในภูมิประเทศภูเขา เชนเดียวกับในปา ทะเลทราย และเมือง"
 RAJ_defense_of_burma: "การปองกันพมา"
 RAJ_defense_of_burma_desc: "[BRM.GetNonIdeologyName]ตั้งอยูทางตะวันออกของเบงกอลโดยตรง โดยมีปาเปนปราการธรรมชาติดานสุดทายที่ปกปองพรมแดนของ[RAJ.GetNonIdeologyName]จากภัยคุกคามทางตะวันออก จําเปนอยางยิ่งที่เราตองระดมกําลังปองกันในภูมิภาคนี้ เพื่อยืนเคียงบาเคียงไหลกับชาว[BRM.GetAdjective] และรักษาอนุทวีปอินเดียไวในมือของ[ENG.GetAdjective]อยางมั่นคง"
 RAJ_holding_the_gates_of_india: "รักษาประตูสูอินเดีย"
 RAJ_holding_the_gates_of_india_desc: "ไมวาอยางไร เราตองปกปอง[RAJ.GetNonIdeologyName]จากผูรุกรานที่บาคลั่งทางตะวันออก พวกเขาอาจบุกมาดวยความฮึกเหิมและเกรี้ยวกราด แตเราจะหยุดการพิชิตอันไมลดละของพวกเขาไวที่ประตูสู[RAJ.GetNonIdeologyName] พวกมันจะผานไปไมได"
 RAJ_free_abyssinia: "ปลดปลอยอะบิสซิเนีย"
 RAJ_free_abyssinia_desc: "เราปลอยใหภูมิภาคอะบิสซิเนียตกอยูในมือศัตรูมานานเกินไปแลว เราจะแสดงคุณคาของเราตอราชบัลลังกดวยการยกพลขึ้นบกอยางทรงพลังสูจะงอยแอฟริกาผานเอเดน เพื่อปลดปลอยประชาชนที่นั่นจากผูยึดครอง"
 RAJ_urban_training: "การฝกรบในเมือง"
 RAJ_urban_training_desc: "แมเราหวังวาจะไมถึงขั้นนั้น แตมีความเปนไปไดที่เราตองตานศัตรูบนทองถนนของเมืองใหญของเรา เราตองพรอมรับมือสถานการณเชนนั้นดวยการฝกรบในเมืองโดยเฉพาะ"
 RAJ_the_defense_of_hong_kong: "การปองกันฮองกง"
 RAJ_the_defense_of_hong_kong_desc: "เมื่อแรงกดดันใน[CHI.GetNonIdeologyName]เพิ่มขึ้น ราชบัลลังก[ENG.GetAdjective]กังวลถึงชะตากรรมของดินแดนในฮองกง เราอยูในตําแหนงที่ดีเยี่ยมที่จะชวยปกปองเมืองนี้จากการรุกราน และหากเราสําเร็จ ก็จะไดรับความโปรดปรานและการยอมรับจากรัฐบาล[ENG.GetAdjective]"


