 RAJ_the_legacy_of_babur: "มรดกแหงบาบูร"
 RAJ_the_legacy_of_babur_desc: "ครั้งหนึ่งจักรวรรดิโมกุลเคยรวบรวมดินแดนอันกวางใหญของอนุทวีปไวใตธงเดียวกัน บัดนี้มีผูที่ใฝฝนจะฟนฟูความรุงโรจนนั้น โดยใชมรดกของบาบูรเปนแรงบันดาลใจสูยุคใหมแหงการฟนคืนชีพและเอกภาพของจักรวรรดิ"
 RAJ_the_legacy_of_babur_tt: "ทุกรัฐที่ถูกปลุกปนความไมสงบจะไดรับ:"
 RAJ_a_peacock_prince: "เจาชายนกยูง"
 RAJ_a_peacock_prince_desc: "มรดกแหงโมกุลเรียกรองผูนําที่คูควรเพื่อทวงคืนบัลลังก ในบรรดารัฐมหาราชา เจาชายนกยูงจะตองผงาดขึ้น ผูซึ่งมีเชื้อสาย ความทะเยอทะยาน และวิสัยทัศนที่จะฟนฟูความยิ่งใหญของจักรวรรดิและรวมอนุทวีปเปนหนึ่งอีกครั้ง"
 RAJ_halls_of_knowledge: "หอแหงปญญา"
 RAJ_halls_of_knowledge_desc: "ชาติที่เขมแข็งสรางขึ้นบนรากฐานแหงความรู ดวยการลงทุนในการวิจัยและการศึกษา เราจะบมเพาะนวัตกรรม เสริมพลังใหประชาชน และรับประกันสถานะของ[ROOT.GetNameDef]ในฐานะผูนําดานวิทยาศาสตร อุตสาหกรรม และความกาวหนา"
 RAJ_sharpen_the_tulwar: "ลับดาบตุลวาร"
 RAJ_sharpen_the_tulwar_desc: "ดาบตุลวาร สัญลักษณแหงความแข็งแกรงและการตอตาน ตองไดรับการลับใหคมเพื่อการรบที่จะมาถึง ดวยการปรับปรุงกองกําลังใหทันสมัยและขัดเกลายุทธศาสตร เราจะทําใหมั่นใจวา[ROOT.GetNameDef]พรอมโจมตีอยางเด็ดขาดเมื่อถึงเวลา"
 RAJ_timurid_bureaucracy: "ระบบราชการแบบตีมูริด"
 RAJ_timurid_bureaucracy_desc: "ระบบราชการแบบตีมูริดซึ่งหยั่งรากจากมรดกของตีมูร เปนแบบอยางของการปกครองที่มีประสิทธิภาพและการควบคุมแบบรวมศูนย การฟนฟูระบบนี้จะเสริมสรางการบริหารของจักรวรรดิ รับประกันเสถียรภาพและความรุงเรืองทั่วดินแดนอันกวางใหญ"
 RAJ_conquer_afghanistan: "พิชิตอัฟกานิสถาน"
 RAJ_conquer_afghanistan_desc: "อัฟกานิสถาน ดินแดนหัวใจแหงบรรพชนของจักรวรรดิ จะตองถูกทวงคืน ดวยการฟนอํานาจเหนือดินแดนประวัติศาสตรแหงนี้ เราจะเชิดชูมรดกแหงโมกุลและไดมาซึ่งที่มั่นสําคัญยิ่งสําหรับการผงาดขึ้นอีกครั้งของจักรวรรดิ"
 RAJ_across_the_himalayas: "ขามเทือกเขาหิมาลัย"
 RAJ_across_the_himalayas_desc: "ดินแดนเบื้องหลังเทือกเขาหิมาลัยมีทั้งความมั่งคั่งมหาศาลและความสําคัญทางยุทธศาสตร ดวยการแผอิทธิพลของจักรวรรดิโมกุลขามยอดเขาอันนาเกรงขามเหลานี้ เราจะตอกยํ้าความเปนใหญและไดมาซึ่งพรมแดนใหมเพื่อเกียรติภูมิแหงอาณาจักร"
 RAJ_through_the_wakhan_corridor: "ผานระเบียงวาฆาน"
 RAJ_through_the_wakhan_corridor_desc: "$RAJ_skibedi_san_ma_desc$"
 RAJ_skibedi_san_ma: "ทลายขุนศึก"
 RAJ_skibedi_san_ma_desc: "ขุนศึกแหงซีเปยซานหมาเปนอุปสรรคตอความเปนใหญของจักรวรรดิโมกุลในเอเชียกลาง ดวยการเปดฉากการรบอยางเด็ดขาด เราจะทลายอํานาจของพวกเขา ยึดเสนทางการคาทางยุทธศาสตร และขยายอิทธิพลของจักรวรรดิในภูมิภาคนี้"
 RAJ_conquerors_of_persia: "ผูพิชิตเปอรเซีย"
 RAJ_conquerors_of_persia_desc: "[PER.GetNameDef] ดินแดนแหงความมั่งคั่งและประวัติศาสตรอันยิ่งใหญ ครั้งหนึ่งเคยเปนคูแขงของจักรวรรดิ ดวยการนําดินแดนนี้มาอยูใตการปกครองของโมกุล เราจะยืนยันความเปนใหญ ยึดครองดินแดนตะวันตกที่สําคัญยิ่ง และตอกยํ้าสถานะของจักรวรรดิในฐานะผูสืบทอดความยิ่งใหญแหงจักรวรรดิที่แทจริง"
 RAJ_halls_of_knowledge_2: "ราชบัณฑิตยสถาน"
 RAJ_halls_of_knowledge_2_desc: "ความรูคือกุญแจสูอํานาจที่ยั่งยืน ดวยการจัดตั้งราชบัณฑิตยสถานทั่วจักรวรรดิโมกุล เราจะบมเพาะนักปราชญ นักวิทยาศาสตร และนักบริหาร ผูจะขับเคลื่อนนวัตกรรม เสริมความแข็งแกรงแกการปกครอง และสืบสานมรดกแหงปญญาและความกาวหนาของจักรวรรดิ"
 RAJ_halls_of_knowledge_3: "บอแหงความรูนิรันดร"
 RAJ_halls_of_knowledge_3_desc: "ความรูอาจนําไปสูบอลึกแหงความโกลาหลที่มนุษยไมกลายางกราย แตเราก็ตองยางเขาไป"
 RAJ_elephants_for_the_modern_age: "ชางศึกแหงยุคสมัยใหม"
 RAJ_elephants_for_the_modern_age_desc: "ชางศึกอันทรงพลังของจักรวรรดิโมกุลเคยครองสนามรบ บัดนี้เราจะปรับมรดกนั้นสูยุคสมัยใหม ดวยการลงทุนในยานเกราะและกองกําลังยานเกราะลําเลียงพล สรางจักรกลสงครามที่ไมมีสิ่งใดหยุดยั้งได เพื่อนําจักรวรรดิไปสูชัยชนะ"
 RAJ_unite_the_subcontinent: "รวมอนุทวีปเปนหนึ่ง"
 RAJ_unite_the_subcontinent_desc: "รัฐที่แตกแยกของอนุทวีปเปนเพียงเงาของความรุงโรจนในอดีต ดวยการรวมดินแดนเหลานี้ไวใตธงโมกุลอีกครั้ง เราจะฟนฟูความกลมเกลียว ความแข็งแกรง และความยิ่งใหญของจักรวรรดิที่ถูกลิขิตใหปกครองตั้งแตขุนเขาจรดทองทะเล"
 RAJ_the_true_mongols: "มองโกลที่แทจริง"
 RAJ_the_true_mongols_desc: "[Root.GetNameDef]คือผูสืบทอดมรดกมองโกลโดยชอบธรรม ผสานความแข็งแกรงแหงทุงหญาสเตปปเขากับวัฒนธรรมแหงอนุทวีป ดวยการยึดมั่นในรากเหงา เราจะนําจิตวิญญาณของมองโกลที่แทจริงมาใชเพื่อพิชิตและรวมดินแดนดังที่บรรพบุรุษเคยทํา"
 RAJ_halls_of_knowlege_3: "หอสมุดแหงจักรวรรดิ"
 RAJ_halls_of_knowlege_3_desc: "สังคมแหงการเรียนรูคือรากฐานของจักรวรรดิที่รุงเรือง ดวยการสรางหอสมุดอันยิ่งใหญทั่วอาณาจักรโมกุล เราจะรักษาภูมิปญญาโบราณ สงเสริมนวัตกรรม และสรางแรงบันดาลใจแกคนรุนหลังใหนําจักรวรรดิไปสูความยิ่งใหญที่ไมมีใครเทียบได"
 RAJ_thunder_elephants: "ชางอสนีบาต"
 RAJ_thunder_elephants_desc: "ชางอันสงางาม สัญลักษณแหงอํานาจโมกุล หวนคืนสูสนามรบในฐานะตัวแทนแหงความแข็งแกรงและประเพณี พลังอันมหาศาลและการปรากฏตัวของพวกมันจะปลุกใจกองทัพของเราและสรางความหวาดกลัวในใจศัตรู ปูทางสูชัยชนะของจักรวรรดิ"
 RAJ_revolt_of_the_princes: "การกอกบฏของเหลาเจาชาย"
 RAJ_revolt_of_the_princes_desc: "รัฐมหาราชาซึ่งถูกกดขี่ภายใตการปกครองของอังกฤษมาชานาน จะลุกฮือขึ้นกอกบฏเพื่อทวงคืนมรดกของตน"
 RAJ_revolt_of_the_princes_tt: "เมื่อประกาศสงครามกับบริติชราช รัฐมหาราชาตาง ๆ จะลุกฮือขึ้นเขารวมกับเรา และกลายเปนรัฐในอารักขา"
 RAJ_secular_rule: "การบริหารแบบฆราวาส"
 RAJ_secular_rule_desc: "จักรวรรดิโมกุลรุงเรืองไดดวยความหลากหลาย และการบริหารแบบฆราวาสจะรับประกันการปกครองที่เปนธรรมแกราษฎรทุกคนไมวาจะนับถือศาสนาใด ดวยการใหความสําคัญกับความสามารถและความเสมอภาค เราจะเสริมสรางเอกภาพของจักรวรรดิและไดรับความภักดีทั่วอาณาเขตอันกวางใหญและหลากหลาย"
 RAJ_theocratic_rule: "ประมวลกฎหมายซิมมีใหม"
 RAJ_theocratic_rule_desc: "สิทธิของผูที่มิใชมุสลิมถูกกําหนดไวอยางเครงครัดภายใตการบริหารของโมกุล ถึงเวลาแลวที่จะปรับเรื่องเหลานี้ใหเขากับโลกสมัยใหม และพิสูจนใหทั่วทั้งอินเดียเห็นวาเราคืออาณาจักรแหงความรูแจง"
 RAJ_mughal_court: "ราชสํานักโมกุล"
 RAJ_mughal_court_desc: "ราชสํานักโมกุลรวบรวมบุคคลที่ปราดเปรื่องที่สุดและผูนําที่ทรงอิทธิพลที่สุดของอาณาจักรไว ดวยการเพิ่มอํานาจใหที่ปรึกษาเหลานี้ เราจะเสริมความแข็งแกรงใหจักรวรรดิดวยคําชี้แนะของพวกเขา ทําใหทุกการตัดสินใจสะทอนถึงความรุงโรจนและความทะเยอทะยานแหงการปกครองของเรา"
 RAJ_mughal_court_tt: "รัฐมหาราชาทั้งหมดจะไดรับจิตวิญญาณแหงชาติ:"
 RAJ_mughal_court_princely_states_tt: "เจาชายทุกพระองคจะออกจากรัฐมหาราชาของตนและเขารวมจักรวรรดิโมกุลในฐานะที่ปรึกษาหรือนายพลที่พรอมใชงาน"
 RAJ_the_silk_road: "ขยายเสนทางสายไหม"
 RAJ_the_silk_road_desc: "เสนทางสายไหมเคยนําความมั่งคั่งและวัฒนธรรมมาสูจักรวรรดิ ดวยการฟนฟูเครือขายการคาทางประวัติศาสตรนี้ เราจะทวงคืนสถานะศูนยกลางการคาโลก สรางความมั่งคั่งแกจักรวรรดิและความรุงเรืองทั่วอาณาเขตอันกวางใหญ"
 RAJ_restore_the_timurid_empire: "ฟนฟูจักรวรรดิตีมูริด"
 RAJ_restore_the_timurid_empire_desc: "ธงของตีมูรโบกสะบัดอีกครั้ง และจักรวรรดิที่เคยสรางความหวาดกลัวแกเหลาสุลตานและกษัตริยไดผงาดขึ้นจากเถาถานแหงประวัติศาสตร การปกครองของเราแผไปทั่วดินแดนที่ครั้งหนึ่งถูกหลอหลอมโดยการพิชิตของพระองค ผูกตะวันออกและตะวันตกไวภายใตอํานาจเดียว ขอใหโลกจงสดับ—ตีมูริดไดกลับมาแลว และครั้งนี้เราจะไมเลือนหายไปในอดีต"
 RAJ_peacock_throne_for_the_modern_age: "บัลลังกนกยูงแหงยุคสมัยใหม"
 RAJ_peacock_throne_for_the_modern_age_desc: "บัลลังกนกยูงคือสัญลักษณสูงสุดแหงอํานาจและความยิ่งใหญของบรรพชน ดวยการสรางบัลลังกใหม ณ ศูนยกลางอํานาจทางประวัติศาสตรของเรา เราจะประกาศความเปนใหญ ปลุกความภักดี และแสดงวิสัยทัศนที่มีตอดินดอนสามเหลี่ยมอันอุดมสมบูรณแหงอนุทวีปอยางชัดเจน"
 RAJ_the_crown_and_the_world: "มงกุฎและโลก"
 RAJ_the_crown_and_the_world_desc: "ชะตากรรมของจักรวรรดิโมกุลคือการผงาดขึ้นเปนอภิมหาอํานาจโลกที่ไรคูแขง ดวยการขยายอิทธิพล เสริมพลังอํานาจ และประกาศความเปนใหญ เราจะไดครองสถานะผูปกครองสูงสุดแหงโลกสมัยใหม"
 RAJ_conquerors_of_iraq: "เดินทัพสูเมโสโปเตเมีย"
 RAJ_conquerors_of_iraq_desc: "อิรักเคยเปนทางแยกสําคัญแหงการคาและอํานาจในจักรวรรดิของตีมูร และความมั่งคั่งของที่นี่เคยหลอเลี้ยงความรุงโรจนในอดีตของเรา บัดนี้ดินแดนนี้ตกอยูในมือของผูปกครองที่ดอยกวา ไมคูควรกับมรดกของมัน ดวยการนําเมโสโปเตเมียกลับมาอยูใตอํานาจของเรา เราจะไดครองดินแดนหัวใจทางยุทธศาสตร ควบคุมประตูระหวางตะวันออกและตะวันตก และเตือนใหโลกรูวาตีมูริดไมรองขอ—เราลงมือยึด"
 RAJ_conquerors_of_turkey: "ยุทธการอังการาครั้งที่สอง"
 RAJ_conquerors_of_turkey_desc: "อานาโตเลียเคยเปนสมรภูมิของเหลาจักรวรรดิ และประวัติศาสตรยังจดจําชัยชนะของตีมูรเหนือออตโตมัน ทวาผูสืบทอดของรัฐสุลตานที่แตกสลายนั้นยังคงยืนหยัดอยู ยึดติดกับดินแดนที่ควรอยูใตการปกครองของเราโดยชอบธรรม ดวยการเดินทัพไปทางตะวันตกอีกครั้ง เราจะทลายแนวปองกันของพวกเขาและทวงคืนดินแดนที่เราเคยพิชิต"
 RAJ_reviving_the_workshop_of_the_world: "ฟนฟูโรงงานของโลก"
 RAJ_reviving_the_workshop_of_the_world_desc: "กอนการปกครองของอังกฤษ อินเดียเคยเปนศูนยกลางของอุตสาหกรรม สิ่งทอ และการคาของโลก บัดนี้เมื่อจักรวรรดิไดถือกําเนิดใหม ถึงเวลาแลวที่จะทวงคืนมรดกนั้น ดวยการปรับปรุงโรงงานใหทันสมัยและฟนฟูเสนทางการคา เราจะเปลี่ยนเศรษฐกิจของเราใหเปนขุมพลังที่ทัดเทียมชาติมหาอํานาจของโลก"
 RAJ_legacy_of_timur: "มรดกแหงตีมูร"
 RAJ_legacy_of_timur_desc: "จักรวรรดิของตีมูรไมเคยถูกลิขิตใหเลือนหายไปในประวัติศาสตร ดวยการทวงคืนดินแดนบรรพชนและรวมไวภายใตการปกครองเดียว เราจะฟนฟูมรดกแหงตีมูริดและสรางยุคใหมแหงความแข็งแกรงและความทะเยอทะยาน โลกจะสั่นสะทานตอหนาบุตรแหงตีมูรอีกครั้ง"
 RAJ_forging_the_mughal_arsenal: "หลอมคลังแสงโมกุลขึ้นใหม"
 RAJ_forging_the_mughal_arsenal_desc: "สงครามในอดีตเอาชนะไดดวยไมและหิน แตวันเวลาเหลานั้นผานพนไปแลว หากจักรวรรดิของเราจะยืนหยัดตอกรกับมหาอํานาจแหงโลกสมัยใหม เราตองสรางฐานอุตสาหกรรมที่สามารถคํ้าจุนจักรกลสงครามขนาดมหึมา สายการผลิตจะกระหึ่มดวยเสียงแหงอุตสาหกรรม และในไมชากองทัพของเราจะเดินทัพดวยอาวุธที่หลอมขึ้นดวยมือของเราเอง"

 RAJ_rebuilding_the_empires_roads: "สรางถนนของจักรวรรดิขึ้นใหม"
 RAJ_rebuilding_the_empires_roads_desc: "จักรวรรดิไมอาจดําเนินไปไดหากไมมีหนทางเคลื่อนยายกองทัพ สินคา และผูคน ถนนและทางรถไฟที่ทรุดโทรมซึ่งอังกฤษทิ้งไวจะตองไดรับการขยายและปรับปรุงใหทันสมัย"
 if_not_subcontinent_tt: "หากเรายังไมสําเร็จ §Y$RAJ_unite_the_subcontinent$§!:"
 if_not_silk_road_tt: "หากเรายังไมสําเร็จ §Y$RAJ_the_silk_road$§!:"
 also_on_vijay_tt: "ไดรับดินแดนหลักใน§Yอินเดียใต§!และ§Yโคโรมันเดล§!"
 unlock_decisions_silk_road_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหดินแดน§Yเสนทางสายไหม§!เปนดินแดนหลักเพิ่มเติม"
 mughal_west_britain_company_dec: "ผนวกบริษัทบริเตนตะวันตก"
 allows_mughal_west_british_company_tt: "เปดใชงานการตัดสินใจดานการบริหาร"
 create_mwbc_tt: "กอตั้ง §Y$mughal_west_britain_company$§! พรอมดินแดนหลักบนแผนดินใหญอังกฤษและเวลส"
 RAJ_hedgemony_of_the_subcontinent: "อํานาจนําเหนืออนุทวีป"
 RAJ_hedgemony_of_the_subcontinent_desc: "เราไดบรรลุความเปนใหญทางอุตสาหกรรมในอนุทวีป ผลักไสทุกฝายที่อาจอางตําแหนงนี้ออกไป เราไมอาจถูกทาทายไดอีกแลว ทิ้งใหรัฐที่แยกตัวอื่น ๆ ตามหลังอยางไมเห็นฝุน"
 RAJ_hedgemony_of_the_subcontinent_tt: "รัฐเริ่มตนทั้งหมดเปนของ[ROOT.GetName]"
 pak_factories_tt: "[RAJ.GetName]มีโรงงานมากกวา§Y[PAK.GetName]§! §Y150%§!\nโรงงานของเรา: [?var:THIS.num_of_factories]\nตองการ: [?var:pak_factories]"
 pak_tech_tt: "[RAJ.GetName]มีเทคโนโลยีมากกวา§Y[PAK.GetName]§! §Y30%§!\nเทคโนโลยีของเรา: [?var:THIS.num_researched_technologies]\nตองการ: [?var:pak_researched_techs]"
 RAJ_orchestrate_train_robberies_desc: "การกอสรางทางรถไฟชะลอตัวลงภายใตการบริหารโดยแรงงานและการกํากับดูแลที่เขมงวดขึ้น แตทุกเสนทางที่สรางขึ้นจะบูรณาการเขากับเศรษฐกิจแบบวางแผนไดดีกวา ใหผลผลิตและประสิทธิภาพดานการสงกําลังบํารุงที่สูงขึ้น"
 RAJ_revisiting_inquities: "ตาตอตา"
 RAJ_revisiting_inquities_desc: "ความเสื่อมถอยทางประวัติศาสตรของจักรวรรดิเรายิ่งเรงเร็วขึ้นจากการแทรกแซงของบริษัทการคาตางชาติ มีบางคนในหมูพวกเราเชื่อวา ดวยพลังอํานาจที่เพิ่งไดมา เรามีสิทธิ์ที่จะใหศัตรูเกาไดรับความอยุติธรรมแบบเดียวกับที่พวกเขาเคยกระทําตอเรา"
 RAJ_royal_indian_navy_mutiny: "กบฏราชนาวีอินเดีย"
 RAJ_royal_indian_navy_mutiny_desc: "ความไมพอใจกําลังกอตัวในหมูทหารเรืออินเดีย ซึ่งแสดงการสนับสนุนตออุดมการณของเรา เราสามารถใชโอกาสนี้ยึดอํานาจและหยุดยั้งกําลังเสริมของอังกฤษไวไดทันที พวกเขาจะไมมีทางเลือกนอกจากยอมจํานน"
 RAJ_royal_indian_navy_mutiny_tt: "§Rการตัดสินใจแทรกซึมคอมมิวนิสตจะถูกลบออกเมื่อแผนยุทธศาสตรนี้เสร็จสิ้น§!"
 RAJ_royal_indian_navy_mutiny_tt2: "§Rการตัดสินใจแทรกซึมคอมมิวนิสตจะถูกลบออกเมื่อเราปฏิบัติตามพันธะของเราครบถวน§!"
 RAJ_hide_communist_infiltration: "$RAJ_royal_indian_navy_mutiny_tt2$"
 RAJ_accept_russian_muhajir_money_desc: "ทองคําจากตางแดนหลั่งไหลเขาสูมือเรา โหมไฟแหงการปฏิวัติใหลุกโชน"
 RAJ_jugantar_desc: "จิตวิญญาณแหงยุคานตารตื่นขึ้น แผการตอตานไปทั่วแผนดิน เราสามารถใชสิ่งนี้ยึดเบงกอลไดอีกครั้ง"

 RAJ_the_peoples_liberation_army_desc: "กองทัพปลดแอกประชาชน กองกําลังที่มีวินัยและยึดมั่นในอุดมการณ จะนําการบุกเพื่อการปลดปลอยชาติ กองทัพนี้มาจากชนชั้นแรงงานและชาวนา พรอมปกปองการปฏิวัติและสรางระเบียบใหม"
 RAJ_deathblow_to_imperial_remnants_desc: "[PAK.GetName]ทําหนาที่เปนตัวแทนใหอังกฤษ โดยฝายหลังสงทรัพยากรจํานวนมหาศาลใหในความพยายามอันสิ้นหวังที่จะถวงดุลกระแสคอมมิวนิสตที่กําลังเพิ่มขึ้น ในที่สุดเราจะยุติความขัดแยงนี้"
 RAJ_the_revolutionary_army_marches_desc: "กองทัพของเราเดินทัพอยางมีเปาหมาย เพื่อการปฏิวัติ เพื่ออินเดีย และเพื่อสามัญชน"
 
 RAJ_threaten_princes_desc: "เหลาเจาชายจะตองยอมตามขอเรียกรองของเรา มิฉะนั้นจะตองเผชิญผลแหงการขัดขืน"
 
 #EIC feedback stuff
 RAJ_look_to_the_future: "มองไปขางหนา"
 RAJ_look_to_the_future_desc: "เราตองมองไปยังอนาคต ไมใชอดีต เพื่อควบคุมความโกลาหลดานราคานี้ ตองนํามาตรการสรางเสถียรภาพชุดใหญมาใช และตองทําทันที"
 RAJ_lobby_parliment: "ล็อบบี้รัฐสภา"
 RAJ_lobby_parliment_desc: "ดวยการสนับสนุนจากนักลงทุนเอกชน เราจะล็อบบี้รัฐสภาใหเสนอการแปรรูปเปนเครื่องปองกันเพียงทางเดียวที่ไดผลตอการลมสลายทางเศรษฐกิจโลกครั้งใหม การขายสวนตาง ๆ ของบริติชราชไมใชเพียงยุทธศาสตร แตคือเสถียรภาพของจักรวรรดิ"
 RAJ_lobby_parliment_tt: "เราจะเริ่มกอตั้งบริษัทอินเดียตะวันออก"
 #bye
 RAJ_orchestrate_train_robberies: "ทางรถไฟของประชาชน"
 RAJ_orchestrate_train_robberies_tt: "แผนยุทธศาสตรดานทางรถไฟจะปรับจิตวิญญาณ§Yทางรถไฟอินเดีย§!ดังนี้:\nผลผลิตโรงงาน: §G+[?RAJ_railway_default_increase_tt]%§!\nความเร็วการกอสรางทางรถไฟ: §R[?RAJ_railway_default_decrease_tt]%§!\nความเร็วการกอสรางศูนยเสบียง: §R[?RAJ_railway_default_decrease_tt]%§!\nความเร็วการกอสรางโครงสรางพื้นฐาน: §R[?RAJ_railway_default_decrease_tt]%§!\nตอแผนยุทธศาสตรดานทางรถไฟที่สําเร็จแตละรายการ\n\nแผนยุทธศาสตรดานทางรถไฟทุกรายการที่สําเร็จแลวจะถูกปรับใหสอดคลองกับสิ่งนี้โดยอัตโนมัติ"
 RAJ_accept_russian_muhajir_money: "รับเงินจากมุฮาจิรรัสเซีย"
 RAJ_jugantar: "ยุคานตาร"
 RAJ_jugantar_tt: "เมื่อประกาศสงครามกับ[PAK.GetName] เราจะไดรับกองพลรอบบังกลาเทศ"
 RAJ_bhoodan_movement: "ขบวนการภูทาน"
 RAJ_bhoodan_movement_desc: "ดวยการกระจายที่ดินโดยสมัครใจ เราจะเสริมพลังแกผูไรที่ดินและคืนความยุติธรรมสูชนบท ดวยการคืนผืนดินแกผูที่ทํากินบนมัน เราจะไดมาไมเพียงแรงงาน แตยังรวมถึงความภักดีอันยั่งยืนของพวกเขา"
 RAJ_the_peoples_liberation_army: "จัดตั้งกองทัพปลดแอกประชาชน"
 RAJ_deathblow_to_imperial_remnants: "ปดฉากเศษซากจักรวรรดินิยม"
 RAJ_the_revolutionary_army_marches: "กองทัพปฏิวัติเดินทัพ"
 RAJ_nationalize_british_owned_factories: "โอนโรงงานของอังกฤษเปนของรัฐ"
 RAJ_nationalize_british_owned_factories_desc: "โรงงานที่สรางขึ้นบนหยาดเหงื่อแรงงาน[RAJ.GetAdjective]จะไมรับใชผลประโยชนตางชาติอีกตอไป ดวยการโอนอุตสาหกรรมที่[ENG.GetAdjective]เปนเจาของมาเปนของรัฐ เราจะคืนอํานาจควบคุมแกประชาชนและทวงคืนสิ่งที่ถูกยึดไปอยางอยุติธรรม"
 RAJ_threaten_princes: "ขมขูเหลาเจาชาย"
 RAJ_exile_princes: "เนรเทศเหลาเจาชาย"
 RAJ_exile_princes_desc: "ยุคแหงการปกครองของเหลาเจาชายไดสิ้นสุดลงแลว เพื่อสรางเอกภาพแหงชาติที่แทจริง เราจะขจัดเศษซากอํานาจศักดินาเหลานี้ เนรเทศพวกเขาไปใหไกลจากวังและประชาชนที่พวกเขาเคยปกครอง"
 RAJ_integrate_the_princes: "ผนวกรวมรัฐมหาราชา"
 RAJ_integrate_the_princes_desc: "เมื่อเราเนรเทศเหลาเจาชายและคอย ๆ ผนวกรวมพวกเขาเขากับอินเดียแลว ถึงเวลาที่จะผนวกรวมรัฐมหาราชาใหเสร็จสิ้นเสียที"
 RAJ_integrate_the_princes2: "ปราบรัฐมหาราชา"
 RAJ_integrate_the_princes2_desc: "ระบบกึ่งปกครองตนเองของรัฐมหาราชาไมใชสิ่งที่เราสนใจจะรักษาไว รัฐมหาราชาจะถูกรวมเขากับอินเดียอยางสมบูรณตลอดไป"
 RAJ_exiled_princes_flag: "ไดเนรเทศเหลาเจาชายแลว"
 RAJ_join_the_co_prospherity_sphere: "เขารวมวงไพบูลยรวมกัน"
 RAJ_join_the_co_prospherity_sphere_desc: "ญี่ปุนเปนกําลังเดียวในภูมิภาคที่ยินดียืนหยัดตอตานจักรวรรดินิยมตะวันตก เราตองเขารวมกับพวกเขาเพื่อเปาหมายที่ยิ่งใหญกวา"
 RAJ_join_the_co_prospherity_sphere_tt: "(§Y[JAP.GetName]§!) ไดรับเหตุการณ '§Y[RAJ.GetNameDefCap]ขอเขารวมวงไพบูลยรวมกัน§!'"
 RAJ_cruiser_effort_dlc: "$RAJ_cruiser_effort$"
 RAJ_submarine_effort_dlc: "$RAJ_submarine_effort$"
 RAJ_capital_ship_effort_dlc: "$RAJ_capital_ship_effort$"
 RAJ_black_swan_sloops: "เรือสลุปแบล็กสวอน"
 RAJ_black_swan_sloops_desc: "ดวยการจัดหาและปรับปรุงตัวเรือชั้นแบล็กสวอนที่คุมคา เราสามารถขยายกองเรือตรวจการณเบาไดอยางรวดเร็ว ซึ่งเหมาะอยางยิ่งสําหรับการปองกันชายฝงและการคุมกันขบวนเรือลําเลียง"
 RAJ_coastal_protection: "การปองกันชายฝง"
 RAJ_coastal_protection_desc: "แนวชายฝงอันยาวไกลของเราจําเปนตองมีการปองกันบางรูปแบบจากภัยคุกคามตางชาติ"
 RAJ_the_sword_and_the_saffron: "ดาบและสีหญาฝรั่น"
 RAJ_the_sword_and_the_saffron_desc: "ชะตากรรมของเราถูกหลอมขึ้นดวยความแข็งแกรงและศรัทธา ดาบจะปกปองแผนดินของเรา และธงสีหญาฝรั่นจะรวมประชาชนของเราไวภายใตเปาหมายเดียวกัน"
 RAJ_burn_down_the_cellular_jail: "เผาคุกเซลลูลาร"
 RAJ_burn_down_the_cellular_jail_desc: "คุกเซลลูลารเปนสิ่งที่หมิ่นเกียรติทุกคนที่เคยตอสูเพื่อเอกราชของอินเดีย มันจะตองถูกทําลาย"

 RAJ_indian_marine_corps: "นาวิกโยธิน[ROOT.GetAdjective]"
 RAJ_indian_marine_corps_desc: "เราจะจัดตั้งกองนาวิกโยธินโดยเฉพาะ ซึ่งไดรับการฝกในปฏิบัติการสะเทินนํ้าสะเทินบกและการจูโจมเฉพาะทาง"
 RAJ_madras_ship_repair_factories: "โรงงานซอมเรือมัทราส"
 RAJ_madras_ship_repair_factories_desc: "มัทราสจะไดรับการพัฒนาเปนศูนยสนับสนุนทางเรือที่สําคัญ พรอมสิ่งอํานวยความสะดวกดานการซอมบํารุงโดยเฉพาะเพื่อดูแลและปรับปรุงกองเรือที่กําลังขยายตัว ทําใหพรอมปฏิบัติการตลอดชายฝงตะวันออก"
 RAJ_obtain_british_naval_contracts: "รับสัญญาตอเรือจากอังกฤษ"
 RAJ_obtain_british_naval_contracts_desc: "เราจะติดตอ[ENG.GetNameDefCap]เพื่อรับสัญญาการตอเรือ ใชประโยชนจากขีดความสามารถทางอุตสาหกรรมของพวกเขาเพื่อเสริมกองเรือของเรา พรอมกระชับความสัมพันธทางยุทธศาสตร"
 RAJ_purchase_decomissioned_british_ships: "ซื้อเรือที่ปลดประจําการ"
 RAJ_purchase_decomissioned_british_ships_desc: "เราจะติดตอ[ENG.GetNameDefCap]เพื่อจัดหาเรือรบที่ปลดประจําการแลว แมจะลาสมัย แตเรือเหลานี้สามารถปรับปรุงเพื่อขยายกองเรือของเราไดอยางรวดเร็วดวยตนทุนตํ่า"
 RAJ_request_transfer_of_british_commanders: "ขอโอนยายผูบัญชาการชาวอังกฤษ"
 RAJ_request_transfer_of_british_commanders_desc: "เราจะขอให[ENG.GetNameDefCap]โอนยายผูบัญชาการทหารเรือคนหนึ่งมาใหเรา เพื่อชวยฝกนาวิกโยธินใหมของเรา"
 RAJ_obtain_modern_ship_contracts: "รับสัญญาเรือสมัยใหม"
 RAJ_obtain_modern_ship_contracts_desc: "เพื่อเรงความทันสมัยของกองทัพเรือ เราจะเจรจากับ[ENG.GetNameDefCap]เพื่อจัดหาเรือลาดตระเวนที่ลํ้าสมัยที่สุด ทําใหกองเรือของเรายังคงแขงขันไดในภูมิทัศนทางทะเลที่เปลี่ยนแปลงไป"
 RAJ_dominate_the_bay_of_bengal: "ครองอาวเบงกอล"
 RAJ_dominate_the_bay_of_bengal_desc: "การครองความเปนใหญทางทะเลในอาวเบงกอลเปนสิ่งจําเปนตอยุทธศาสตรทางทะเลของเรา ดวยการขยายการปรากฏตัวและแผอํานาจทั่วนานนํ้าเหลานี้ เราจะปกปองเสนทางการคาและประกาศความเปนใหญในภูมิภาค"
 RAJ_indian_cruiser_development: "พัฒนาเรือลาดตระเวน[ROOT.GetAdjective]"
 RAJ_indian_cruiser_development_desc: "ถึงเวลาแลวที่เราจะกําหนดเสนทางทางทะเลของเราเอง ดวยการพัฒนาเรือลาดตระเวนที่ออกแบบภายในประเทศ เราจะประกาศความเปนอิสระทางอุตสาหกรรมและวางรากฐานสําหรับกองเรืออินเดียสมัยใหม"
 RAJ_increase_funding_for_the_GRSE: "เพิ่มงบประมาณแก GRSE"
 RAJ_increase_funding_for_the_GRSE_desc: "เราจะเพิ่มงบประมาณของรัฐแก GRSE เพื่อใหสามารถสรางอูตอเรือแหงใหมได"
 RAJ_womens_royal_indian_naval_service: "หนวยบริการทหารเรือหญิงแหงราชนาวี[ROOT.GetAdjective]"
 RAJ_womens_royal_indian_naval_service_desc: "เราจะจัดตั้งหนวยบริการทหารเรือหญิงแหงราชนาวี[ROOT.GetAdjective] เพื่อใหสตรีมีบทบาทรับใชในกองทัพเรือ"
 RAJ_modernizing_navy_dlc: "ปรับปรุงกองทัพเรือใหทันสมัย"
 RAJ_modernizing_navy_dlc_desc: "เพื่อประกาศตนเปนมหาอํานาจระดับภูมิภาค เราตองปรับปรุงกองทัพเรือใหทันสมัย ดวยการลงทุนในการออกแบบเรือขั้นสูง โครงสรางพื้นฐานที่ดีขึ้น และหลักนิยมทางยุทธศาสตร เพื่อแผอิทธิพลทั่วทองทะเลแหงเอเชีย"

 RAJ_rashtriya_swayamsevak_sangh: "ราษฏรียสวยัมเสวกสังฆ"
 RAJ_rashtriya_swayamsevak_sangh_desc: "เราจะจัดระเบียบเยาวชนใหเปนกองกําลังที่มีวินัย พรอมปกปองชาติและธํารงคุณคาแหงฮินดุตวาไมวาจะตองแลกดวยสิ่งใด"

 RAJ_the_hindu_martial_tradition: "ประเพณีนักรบฮินดู"
 RAJ_the_hindu_martial_tradition_desc: "จากเหลานักรบของศิวาชีถึงผูพิทักษธรรมะ เราจะฟนฟูจิตวิญญาณนักรบโบราณของเราและเตรียมประชาชนใหพรอมสําหรับการรบที่รออยูเบื้องหนา"

 RAJ_cultural_reawekening: "การตื่นรูทางวัฒนธรรม"
 RAJ_cultural_reawekening_desc: "รุงอรุณใหมที่เปยมดวยศิลปะ ภาษา และประเพณีใกลมาถึงแลว เพื่อรวมชาติไวภายใตจิตวิญญาณอันเปนนิรันดรแหงอารยธรรมของเรา"

 RAJ_mass_production: "การผลิตจํานวนมาก"
 RAJ_mass_production_desc: "เราจะจัดหายุทโธปกรณจากวิสาหกิจเอกชนที่เสนอตนทุนตํ่าที่สุด การกดตนทุนยุทโธปกรณใหตํ่าคือกุญแจสูการเติบโต"
 RAJ_deathknell_to_the_raj: "ระฆังมรณะแหงบริติชราช"
 RAJ_deathknell_to_the_raj_desc: "เราไดคอย ๆ กัดกรอนเศษซากของบริติชราชดวยการเขาควบคุมดินแดนของพวกเขามากขึ้นเรื่อย ๆ ถึงเวลาแลวที่จะยุติละครฉากนี้และเรียกรองการควบคุมอนุทวีปทั้งหมด"
 RAJ_deathknell_to_the_raj_trigger: "§Yบริติชราช§!ภายใตการปกครองของ§Yอังกฤษ§!ยังคงอยู"
 RAJ_deathknell_to_the_raj_trigger_tt: "ผนวกเศษซากของบริติชราช"
 RAJ_learn_from_the_crown: "เรียนรูจากราชบัลลังก"
 RAJ_learn_from_the_crown_desc: "เราตองเรียนรูจากประสบการณทางทหารอันกวางขวางของราชบัลลังกอังกฤษ นําหลักนิยมที่พิสูจนแลวของพวกเขามาใชเพื่อเตรียมรับมือกับความทาทายขางหนา"
 RAJ_join_the_shadow_scheme: "เขารวมแผนการเงา"
 RAJ_join_the_shadow_scheme_desc: "ดวยการเขารวมปฏิบัติการลับ เราสามารถขยายขีดความสามารถดานขาวกรองและเสริมสถานะทางยุทธศาสตรของเรา"
 RAJ_colonial_cadet_exchange: "แลกเปลี่ยนนักเรียนนายรอยอาณานิคม"
 RAJ_colonial_cadet_exchange_desc: "เราจะสงนักเรียนนายรอยที่เกงที่สุดไปฝกรวมกับนายทหารอังกฤษ เพื่อใหกองทัพของเรามีเทคนิคที่ลํ้าสมัย"
 RAJ_learn_from_the_secret_intelligence_service: "เรียนรูจากหนวยขาวกรองลับ"
 RAJ_learn_from_the_secret_intelligence_service_desc: "ดวยการทํางานรวมกับหนวยขาวกรองลับของอังกฤษ เราสามารถสรางเครือขายจารกรรมที่นาเกรงขามเพื่อปกปองผลประโยชนของเรา"
 RAJ_purchase_british_supply_equipment: "ซื้อยุทโธปกรณดานเสบียงจากอังกฤษ"
 RAJ_purchase_british_supply_equipment_desc: "เราตองจัดหายุทโธปกรณดานเสบียงขั้นสูงจากอังกฤษเพื่อเสริมกําลังกองทัพและปรับปรุงการสงกําลังบํารุงในสนามรบ"
 RAJ_forming_an_indian_doctrine: "สรางหลักนิยมแบบอินเดีย"
 RAJ_forming_an_indian_doctrine_desc: "ถึงเวลาแลวที่จะสรางหนทางของเราเอง เราจะพัฒนาหลักนิยมแบบอินเดียที่สะทอนจุดแข็งและความมุงหวังอันเปนเอกลักษณของเรา"
 RAJ_model_after_germany: "ยึดแบบอยางเยอรมนี"
 RAJ_model_after_germany_desc: "เราสามารถเลียนแบบหลักนิยมทางทหารที่มีวินัยและมีประสิทธิภาพของเยอรมนี เพื่อเปลี่ยนกองกําลังของเราใหเปนจักรกลสงครามสมัยใหม"
 RAJ_model_after_usa: "ยึดแบบอยางสหรัฐอเมริกา"
 RAJ_model_after_usa_desc: "ดวยการศึกษายุทธศาสตรทางทหารของอเมริกา เราสามารถปรับปรุงกองทัพใหทันสมัยโดยเนนความยืดหยุนและนวัตกรรมทางเทคโนโลยี"
 RAJ_model_after_soviet: "ยึดแบบอยางสหภาพโซเวียต"
 RAJ_model_after_soviet_desc: "การเนนการระดมพลจํานวนมหาศาลและยุทธวิธีแบบปฏิวัติของสหภาพโซเวียต เปนพิมพเขียวสําหรับวิวัฒนาการทางทหารของเราเอง"
 RAJ_automating_the_army: "กองทัพยานยนตอัตโนมัติ"
 RAJ_automating_the_army_desc: "เราจะใหความสําคัญกับการใชเครื่องจักรกลและกองพลยานเกราะขั้นสูง ปูทางสูกองทัพที่ทันสมัยอยางสมบูรณ"
 RAJ_for_the_people_by_the_people: "ของประชาชน โดยประชาชน"
 RAJ_for_the_people_by_the_people_desc: "เราจะมุงเสริมความแข็งแกรงของทหารราบ ปนใหญ และกองพลสนับสนุน เพื่อสรางกองทัพที่หยั่งรากในเจตจํานงของประชาชนอยางแทจริง"

 RAJ_five_year_plan: "แผนหาป"
 RAJ_five_year_plan_desc: "รัฐคอมมิวนิสตทุกรัฐตองมีแผนหาป! เราตองเริ่มพัฒนาแผนของเราเพื่อใหอุตสาหกรรมของ[RAJ.GetNameDefCap]เจริญรุงเรือง!"
 RAJ_five_year_plan_flag: "สําเร็จแผนยุทธศาสตร §Yแผนหาป§! แลว"
 RAJ_five_year_plan_tt: "การสําเร็จ§Yสังคมนิยมเกษตรกรรม§!หรือ§Yอุตสาหกรรมนิยมเมือง§!อยางใดอยางหนึ่งจะเปลี่ยนแปลงแผนหาป"
 RAJ_five_year_plan_when_removed_tt: "จํานวนวันปจจุบัน: [?RAJ_five_year_plan_flag:days|Y0]"
 RAJ_five_year_plan_modify_tt: "ปรับ§Yแผนหาป§!ดังนี้:"
 RAJ_soviet_influence: "อิทธิพลโซเวียต"
 RAJ_soviet_influence_desc: "สหภาพโซเวียตเปนแบบอยางของการเปลี่ยนแปลงแบบปฏิวัติ ดวยการรับแนวทางทางอุดมการณและกรอบสถาบันของพวกเขา เราสามารถวางเสนทางที่คลายกันใหแก[RAJ.GetName]"
 RAJ_indian_socialism: "สังคมนิยมแบบอินเดีย"
 RAJ_indian_socialism_desc: "แทนที่จะแสวงหาแรงบันดาลใจจากมหาอํานาจสังคมนิยม เราจะสรางหลักนิยมสังคมนิยมของเราเองที่เหมาะกับความตองการของ[RAJ.GetNameDefCap]"
 RAJ_soviet_indian_industrial_cooperation: "ความรวมมือทางอุตสาหกรรมโซเวียต-อินเดีย"
 RAJ_soviet_indian_industrial_cooperation_desc: "เพื่อเรงการเปลี่ยนแปลงทางเศรษฐกิจ เราจะสรางหุนสวนทางอุตสาหกรรมกับ[SOU.GetNameDefCap] ความเชี่ยวชาญทางเทคนิคและประสบการณดานการพัฒนาแบบรวมศูนยของพวกเขาจะมีบทบาทสําคัญในการสรางเศรษฐกิจสังคมนิยมที่เหมาะกับความตองการของเรา"
 RAJ_indian_national_highways: "ทางหลวงแผนดินอินเดีย"
 RAJ_indian_national_highways_desc: "เพื่อพัฒนาอุตสาหกรรมของ[RAJ.GetNameDefCap] เราตองเริ่มจากพื้นฐานนั่นคือเสนทางสงเสบียง"
 RAJ_expand_industry_in_hyderabad: "ขยายอุตสาหกรรมในไฮเดอราบาด"
 RAJ_expand_industry_in_hyderabad_desc: "การขยายโรงงานในไฮเดอราบาดจะเพิ่มขีดความสามารถทางอุตสาหกรรมของเราอยางมหาศาลโดยไมตองลงทุนมากนัก"
 RAJ_continue_the_five_year_plan: "ดําเนินแผนหาปตอไป"
 RAJ_continue_the_five_year_plan_desc: "เมื่อปแรกของแผนหาปผานพนไป ถึงเวลาที่จะมองยอนดูวาเรากาวหนาไปมากเพียงใด และนําบทเรียนที่ไดรับไปใชในอีกสี่ปขางหนา"
 RAJ_continue_the_five_year_plan_tt: "จะคูณตัวปรับคาทั้งหมดใน§Yแผนหาป§!ของเราดวย §G+30%§!"
 RAJ_nationalize_tata_group: "โอนกลุมทาทาเปนของรัฐ"
 RAJ_nationalize_tata_group_desc: "เราตองเลิกพึ่งพากลุมทาทาสําหรับเศรษฐกิจของเรา ถึงเวลาที่จะเขายึดและโอนบริษัทเปนของรัฐ"
 RAJ_focus_on_military_industry: "มุงเนนอุตสาหกรรมทหาร"
 RAJ_focus_on_military_industry_desc: "เราตองใหความสําคัญกับความปลอดภัยของประเทศเหนือสิ่งอื่นใด เราตองเรงขยายกองทัพเพื่อรับประกันการอยูรอด"
 RAJ_nationalize_gun_carriage_agency: "โอนหนวยงานฐานปนใหญเปนของรัฐ"
 RAJ_nationalize_gun_carriage_agency_desc: "หนวยงานฐานปนใหญเปนหนึ่งในแหลงอาวุธหลักของเรา อํานาจเชนนี้ไมอาจปลอยไวในมือบริษัทเอกชน จะตองโอนเปนของรัฐ"
 RAJ_eastern_shipyard_construction: "สรางอูตอเรือฝงตะวันออก"
 RAJ_eastern_shipyard_construction_desc: "เพื่อสนับสนุนการเติบโตของกองทัพเรือสมัยใหม เราจะขยายขีดความสามารถในการตอเรือตามชายฝงตะวันออก อูตอเรือแหงใหมเหลานี้จะเปนกระดูกสันหลังของความทะเยอทะยานทางทะเลของเรา"

