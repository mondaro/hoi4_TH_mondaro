l_english:
  ############
  #####RAJ####
  ############
 RAJ_take_over_administrative_rights: "เขารับสิทธิ์การบริหาร"
 RAJ_take_over_administrative_rights_desc: "เพื่อถอนตัวออกจากภูมิภาคอยางสงางาม รัฐบาล[ENG.GetAdjective]จึงเริ่มมอบหมายงานบริหารใหแกเสมียนของบริษัทเรา"
 RAJ_the_return_of_the_east_india_company: "การกลับมาของบริษัทอินเดียตะวันออก"
 RAJ_the_return_of_the_east_india_company_desc: "หลังจากหายไปหลายทศวรรษ บริษัทอินเดียตะวันออกจะไดรับการฟนฟูขึ้นใหม เพื่อแสวงประโยชนจากอนุทวีปอินเดียอยางเต็มที่ดวยประสิทธิภาพอันเหี้ยมเกรียม"
 RAJ_the_return_of_the_east_india_company_tt: "แผนการลงทุนและภาษีอินเดียตะวันออกมีผลบังคับใชแลว\nปลดล็อก§Yการตัดสินใจ§!เพื่อจายเงินปนผลใหแกนักลงทุน"
 RAJ_privatized_tutelage: "การศึกษาแบบเอกชน"
 RAJ_privatized_tutelage_desc: "การศึกษาจะสงวนไวสําหรับผูที่คูควร ดวยการคงระบบโรงเรียนและวิทยาลัยเอกชนอยางเครงครัด ปลอดจากพวกชนชั้นตํ่า"
 RAJ_vertical_integration: "การบูรณาการแนวดิ่ง"
 RAJ_vertical_integration_desc: "แผนการเลี่ยงภาษีเมื่อเร็ว ๆ นี้แทบไมถูกรัฐบาลโพนทะเลสังเกตเห็น บางทีเราอาจใชชองโหวเพิ่มเติมเพื่อลดภาษีลงไปอีก"
 RAJ_acquire_new_resources: "จัดหาทรัพยากรใหม"
 RAJ_acquire_new_resources_desc: "อุตสาหกรรมของเราตองการทรัพยากรเพิ่มขึ้นเรื่อย ๆ เพื่อตอบสนองความตองการสินคา เราจึงจะใหมวลชนผูวางงานทํางานในโรงงานแปรรูปทรัพยากรแหงใหมทั่วดินแดนในครอบครองของเรา"
 RAJ_corporate_expansion: "การขยายกิจการบริษัท"
 RAJ_corporate_expansion_desc: "การเติบโตทางเศรษฐกิจในพอรตหลักของเราทําใหประชากรเพิ่มขึ้นอยางกาวกระโดด เพื่อใหการเติบโตยั่งยืน เราจะขยายโครงสรางพื้นฐานเพื่อรองรับพนักงานในอนาคตของเรา"
 RAJ_trade_federation_of_india: "การสรางแบรนดใหม"
 RAJ_trade_federation_of_india_desc: "เราประสบการเติบโตเปนประวัติการณในชวงไมกี่ปที่ผานมา และมีอํานาจทางการเมืองในระดับที่บริษัทสวนใหญไดแตฝนถึง อยางไรก็ตาม บางรัฐภายใตการควบคุมของเรายังไมลงรอยกับการปกครองของบริษัท บางทีเงินชดเชยกอนมหึมาอาจโนมนาวพวกเขาได?"
 RAJ_trade_federation_of_india_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐที่ครอบครองซึ่งมีการยอมรับปกครองสูงกลายเปนดินแดนหลัก โดยใช§Yปจจัยโรงงานสินคาอุปโภคบริโภค§!และ§Yอํานาจทางการเมือง§!"
 RAJ_the_varuna_class: "เรือชั้นวรุณ"
 RAJ_the_varuna_class_desc: "เรือหลักลําลาสุดของเราเปนผลงานวิศวกรรมอันยิ่งใหญมหึมา ดวยเหตุนี้ ชื่อเดียวที่เหมาะสมกับเรือลํานี้คือนามของเทพเจา"
 RAJ_purchase_destroyers_and_subs: "จัดซื้อเรือพิฆาตและเรือดํานํ้า"
 RAJ_purchase_destroyers_and_subs_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 RAJ_purchase_cruisers_and_dreadnoughts: "จัดซื้อเรือลาดตระเวนและเรือเดรดนอต"
 RAJ_purchase_cruisers_and_dreadnoughts_desc: "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_mineral_exploitation_institute: "สถาบันการใชประโยชนแรธาตุ"
 RAJ_mineral_exploitation_institute_desc: "การพัฒนาเหมืองแรเมื่อเร็ว ๆ นี้ไมไดใหผลผลิตตามที่เราคาดหวัง ดูเหมือนเราจําเปนตองลงทุนในการสํารวจทางธรณีวิทยาที่ดีขึ้น เพื่อประเมินรายไดที่อาจไดจากทรัพยากรธรรมชาติไดแมนยํายิ่งขึ้น"
 RAJ_establish_the_reserve_bank_of_india: "กอตั้งธนาคารกลางอินเดีย"
 RAJ_establish_the_reserve_bank_of_india_desc: "เพื่อปกปองเศรษฐกิจของเราจากแรงกระแทกอยางเพียงพอ เราจะกอตั้งธนาคารกลางที่มีหนาที่ควบคุมสกุลเงินของเรา"
 #RAJ_separate_electorates: "Separate Electorates"
 #RAJ_demand_free_votes: "Demand Free Votes"
 RAJ_all_india_kisan_sabha: "สหพันธชาวนาแหงอินเดีย (ออลอินเดียกิสานสภา)"
 RAJ_all_india_kisan_sabha_desc: "ชาวนาและเกษตรกรในชนบทของอินเดียถูกเอารัดเอาเปรียบมานานพอแลว ถึงเวลาแลวที่พวกเขาจะรวมตัวกันและเปลงเสียงรองทุกขรวมกัน"
 RAJ_haripura_session_of_the_indian_national_congress: "การประชุมหริปุระครั้งที่สอง"
 RAJ_haripura_session_of_the_indian_national_congress_desc: "เมื่อทุนนิยมเปนตัวขับเคลื่อนความตึงเครียดทั่วโลก ถึงเวลาแลวที่ตองปรับโฉมสวราชใหเปนการตอสูเพื่อกรรมกรและชาวนา การประชุมหริปุระครั้งที่สองจะรวมเราเปนหนึ่งภายใตวิสัยทัศนแหงการปฏิวัติ ปฏิเสธพันธมิตรกับจักรวรรดินิยม และนอมรับการตอสูเพื่ออินเดียที่ไรชนชั้นและพึ่งพาตนเองได"
 RAJ_the_second_gorkha_war: "สงครามคุรขาครั้งที่สอง"
 RAJ_the_second_gorkha_war_desc: "เอกราชของเนปาลเปนซากของอดีตที่แบงแยกสิ่งที่ควรเปนอนุทวีปที่เปนหนึ่งเดียว การทัพอันเด็ดขาดจะนําชาวคุรขาเขามาอยูในออมอก และยึดเทือกเขาหิมาลัยไวไดอยางมั่นคง"
 RAJ_guarantee_nepalese_independence: "รับประกันเอกราชของเนปาล"
 RAJ_guarantee_nepalese_independence_desc: "อธิปไตยของเนปาลเปนสัญลักษณแหงความยืนหยัดตอการครอบงําของจักรวรรดิ ดวยการรับประกันเอกราช เราจะปกปองเทือกเขาหิมาลัยและไดพันธมิตรที่แข็งแกรงในการตอสูกับอิทธิพลตางชาติในภูมิภาค"
 RAJ_ignite_the_sino_indian_war: "จุดชนวนสงครามจีน-อินเดีย"
 RAJ_ignite_the_sino_indian_war_desc: "ความตึงเครียดที่คุกรุนกับจีนเรื่องขอพิพาทพรมแดนไมอาจเพิกเฉยไดอีกตอไป ดวยการลงมืออยางเด็ดขาด เราจะประกาศความเปนใหญเหนือเทือกเขาหิมาลัยและยึดดินแดนอันชอบธรรมของเรา การโจมตีอยางอาจหาญในตอนนี้อาจพลิกดุลอํานาจในเอเชียใหเปนคุณแกเรา"
 RAJ_national_planning_committee: "คณะกรรมการวางแผนแหงชาติ"
 RAJ_national_planning_committee_desc: "การพึ่งพาตนเองทางเศรษฐกิจคือรากฐานของเอกราชที่แทจริง ดวยการจัดตั้งคณะกรรมการวางแผนแหงชาติ เราจะวางแนวทางสูการเปนอุตสาหกรรม การพัฒนาชนบท และการเติบโตอยางเปนธรรม แผนที่เปนเอกภาพจะเปลี่ยนอินเดียใหเปนชาติสมัยใหมที่พึ่งพาตนเองได"
 RAJ_promote_violence_against_the_british: "สงเสริมความรุนแรงตออังกฤษ"
 RAJ_promote_violence_against_the_british_desc: "ยุคของการประทวงอยางสันติไดผานพนไปแลว เพื่อทําลายโซตรวนแหงการกดขี่ของจักรวรรดิ เราตองลงมือโดยตรง การตอตานอยางประสานงานจะบั่นทอนการควบคุมของอังกฤษ และปลุกมวลชนใหลุกขึ้นสูกับทรราช"
 RAJ_rally_the_indian_left: "รวมพลังฝายซายอินเดีย"
 RAJ_rally_the_indian_left_desc: "ฝายซายที่แตกกระจายตองรวมตัวกันเพื่อนําการตอสูเพื่อสิทธิของกรรมกรและเอกราชที่แทจริง ดวยการรวมพลังสังคมนิยมและคอมมิวนิสตไวใตธงเดียว เราจะสรางแนวรวมอันทรงพลังเพื่อทาทายทั้งจักรวรรดินิยมและทุนนิยม"
 RAJ_forward_bloc: "กลุมฟอรเวิรดบล็อก"
 RAJ_forward_bloc_desc: "กลุมฟอรเวิรดบล็อกคือวิสัยทัศนอันกลาหาญสําหรับอนาคตของอินเดีย—วิสัยทัศนที่ปฏิเสธการประนีประนอมและนอมรับการปฏิวัติ ดวยการรวมพลังตอตานจักรวรรดินิยมทั้งหมด เราจะเรงการตอสูเพื่อเอกราชอยางสมบูรณ และวางรากฐานสําหรับอินเดียที่แข็งแกรงและกาวหนายิ่งขึ้น"
 RAJ_give_me_blood_and_i_will_grant_you_freedom: "ใหเลือดแกขา แลวขาจะใหอิสรภาพแกเจา"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc: "เสนทางสูเอกราชปูดวยการตอสูและการเสียสละ ดวยการรวมพลผูกลาใหสูเพื่ออุดมการณของเรา เราจะจุดประกายขบวนการที่ทรงพลังพอจะทําลายโซตรวนแหงการปกครองอาณานิคม ชัยชนะจะเปนของผูที่ยอมจายราคา"
 RAJ_rani_of_jhansi_regiment: "กรมทหารรานีแหงฌานสี"
 RAJ_rani_of_jhansi_regiment_desc: "ดวยแรงบันดาลใจจากความกลาหาญของรานีแหงฌานสี เราจะจัดตั้งกรมทหารหญิงลวนเพื่อยืนหยัดตอตานการกดขี่ ดวยการเสริมพลังใหนักสูผูกลาเหลานี้ เราจะโจมตีการปกครองอาณานิคมอยางรุนแรง และนิยามบทบาทของสตรีในการตอสูเพื่อเอกราชขึ้นใหม"
 RAJ_azad_hind_dlc: "อาซาดฮินด"
 RAJ_azad_hind_dlc_desc: "อาซาดฮินดคือจุดสูงสุดของการตอสูเพื่อการปลดปลอยของเรา—รัฐบาลพลัดถิ่นที่อุทิศตนเพื่อยุติการปกครองของอังกฤษ ดวยกองกําลังที่ระดมพรอมและวิสัยทัศนที่ชัดเจน รัฐบาลนี้พรอมนําอินเดียสูอิสรภาพดวยพลังและความมุงมั่น"
 RAJ_azad_hind_dlc_radio: "วิทยุอาซาดฮินด"
 RAJ_azad_hind_dlc_radio_desc: "เพื่อเผยแพรสารแหงการปลดปลอย เราตองกอตั้งวิทยุอาซาดฮินด การกระจายเสียงแหงการปฏิวัตินี้จะสงเสียงเรียกรองอิสรภาพของเราขามพรมแดน รวมผูรักชาติเปนหนึ่งเดียว และจุดไฟการตอสูกับการกดขี่ของอาณานิคม การตอสูตองการเสียง และนี่จะเปนเสียงของเรา"
 RAJ_azad_hind_dlc_bank: "ธนาคารอาซาดฮินด"
 RAJ_azad_hind_dlc_bank_desc: "การปฏิวัติตองอาศัยทรัพยากร ดวยการกอตั้งธนาคารอาซาดฮินด เราจะสรางสถาบันการเงินที่อุทิศเพื่อสนับสนุนการตอสูเพื่อเอกราช ธนาคารนี้จะระดมทุน เสริมพลังผูรักชาติ และวางรากฐานทางเศรษฐกิจสําหรับอินเดียที่เปนอิสระ"
 RAJ_seek_japanese_support: "ขอการสนับสนุนจากญี่ปุน"
 RAJ_seek_japanese_support_desc: "ศัตรูของศัตรูอาจเปนพันธมิตรที่แข็งแกรงที่สุดของเรา ดวยการขอการสนับสนุนจากญี่ปุน เราอาจเขาถึงทรัพยากร การฝก และกําลังพลเพื่อทาทายการปกครองของอังกฤษ แมเสนทางนี้จะเต็มไปดวยความเสี่ยง แตพันธมิตรเชนนี้อาจพลิกสถานการณใหเปนคุณแกเรา"
 RAJ_the_enemy_of_my_enemy: "ศัตรูของศัตรู"
 RAJ_the_enemy_of_my_enemy_desc: "ในการตอสูเพื่อเอกราช พันธมิตรเกิดขึ้นจากความจําเปน ดวยการรวมมือกับผูที่ตอตานอังกฤษ เราจะคลายกํามือที่บีบรัดแผนดินของเรา อิสรภาพอาจตองอาศัยหุนสวนที่ไมนาเปนไปได แตชัยชนะคือสิ่งเดียวที่สําคัญ"
 RAJ_shaheed_and_swaraj: "ชะฮีดและสวราช"
 RAJ_shaheed_and_swaraj_desc: "การเสียสละของเหลาวีรชนเปนแรงบันดาลใจใหมุงสูสวราชอยางไมลดละ เลือดของพวกเขาหลอเลี้ยงการปฏิวัติของเรา เตือนใจเราวาเอกราชไมไดถูกมอบให—แตตองชวงชิงมา ขอใหความทรงจําถึงพวกเขาเสริมความมุงมั่นของเราที่จะสรางอินเดียที่เปนอิสระและมีอธิปไตย"
 RAJ_azad_hind_radio: "วิทยุอาซาดฮินด"
 RAJ_azad_hind_radio_desc: "$RAJ_azad_hind_dlc_radio_desc$"
 RAJ_seek_international_recognition: "แสวงหาการรับรองจากนานาชาติ"
 RAJ_seek_international_recognition_desc: "เพื่อสรางความชอบธรรมใหการตอสูของเรา เราตองไดรับการรับรองจากนานาชาติ ดวยการรวบรวมการสนับสนุนจากทั่วโลก เราจะโดดเดี่ยวฝาย[ENG.GetAdjective]และเสริมความชอบธรรมในอธิปไตยของเราในสายตาชาวโลก"
 RAJ_war_taxes: "ภาษีสงคราม"
 RAJ_war_taxes_desc: "คาใชจายของสงครามตองอาศัยการเสียสละรวมกัน ดวยการเก็บภาษีสงคราม เราจะมีเงินทุนสําหรับการทัพและทรัพยากรที่จําเปนตอชัยชนะ อินเดียที่เปนอิสระคุมคาทุกรูป"
 RAJ_azad_hind_bank: "ธนาคารอาซาดฮินด"
 RAJ_azad_hind_bank_desc: "$RAJ_azad_hind_dlc_bank_desc$"
 RAJ_hindutva: "หินดุตวะ"
 RAJ_hindutva_desc: "แนวคิดหินดุตวะมุงสูอินเดียที่เปนหนึ่งเดียวซึ่งหยั่งรากในมรดกทางวัฒนธรรมและศาสนา ดวยการสงเสริมอุดมการณนี้ เรามุงสรางอัตลักษณแหงชาติที่เสริมสรางเอกภาพ และเตรียมอินเดียใหพรอมแสดงบทบาทบนเวทีโลก"
 RAJ_netaji: "เนตาจี"
 RAJ_netaji_desc: "เนตาจี สุภาษ จันทระ โพส คือตัวแทนแหงจิตวิญญาณการตอตานการปกครองของจักรวรรดิอยางไมลดละ วิสัยทัศนและความเปนผูนําของเขาเปนแรงบันดาลใจใหผูคนนับลานเขารวมการตอสูเพื่ออินเดียที่มีอธิปไตย ภายใตการนําของเขา ความฝนแหงเอกราชก็ใกลความจริงเขาไปทุกที"
 RAJ_hindu_mahasabha: "รัฐฮินดูกาวหนา"
 RAJ_hindu_mahasabha_desc: "สภาฮินดูมหาสภาแหงอินเดียสนับสนุนเอกราชของรัฐมหาราชา โดยยกยองวาเปน 'รากฐานแหงอํานาจฮินดู' ดวยการใหเอกราชแกรัฐเหลานี้ เราจะไดรับเงินทุนจากพวกเขามากขึ้น และรวมสวนที่เหลือของชาติใหมั่นคง"
 RAJ_hindu_mahasabha_tt: "การปลดปลอยรัฐมหาราชาเปนรัฐหุนเชิดจะเพิ่มโบนัสของจิตวิญญาณนี้ §G+4%§! ตราบเทาที่รัฐนั้นยังเปนรัฐหุนเชิดของคุณ สูงสุด §Y32%§!"
 RAJ_sanatani: "สนาตนี"
 RAJ_sanatani_desc: "หลักการแหงสนาตนธรรมเปนรากฐานอันเปนอมตะสําหรับเอกภาพและการฟนคืนของอินเดีย ดวยการยึดถือคุณคาเหลานี้ เราจะสรางแรงบันดาลใจใหเกิดชาติที่กลมเกลียวและยืนหยัด โดยมีขนบธรรมเนียมเปนเครื่องนําทาง"
 RAJ_hindi_as_a_national_language: "ภาษาฮินดีเปนภาษาประจําชาติ"
 RAJ_hindi_as_a_national_language_desc: "การใชภาษาฮินดีเปนภาษาประจําชาติจะรวมอินเดียไวภายใตอัตลักษณทางวัฒนธรรมรวมกัน ดวยการสงเสริมการใชภาษานี้ เราจะเสริมสรางการสื่อสาร ปลูกฝงความภาคภูมิใจในชาติ และวางรากฐานสําหรับรัฐที่เปนเอกภาพและเปนอิสระ"
 RAJ_seven_shackles_desc: "วยวสายพันทีจํากัดไมใหชาวอินเดียเลือกอาชีพไดอยางเสรี และผูกมัดพวกเขาไวกับระบบที่เอารัดเอาเปรียบ ดวยการทลายพันธนาการนี้ เราจะปลดปลอยแรงงานและเสริมพลังใหพวกเขามีสวนรวมในเศรษฐกิจที่เปนอิสระและเปนธรรมอยางแทจริง"
 RAJ_coal_fire_and_steel: "ถานหิน ไฟ และเหล็กกลา"
 RAJ_coal_fire_and_steel_desc: "ถานหินขับเคลื่อนเครื่องจักร ไฟหลอมเจตจํานง และเหล็กกลาสรางอนาคต ดวยการลงทุนในอุตสาหกรรมหนัก เราจะวางรากฐานสําหรับอินเดียที่พึ่งพาตนเองได สามารถปกปองอธิปไตยและขับเคลื่อนความรุงเรืองของตน"
 RAJ_extend_indian_security_zone: "ขยายเขตความมั่นคง[GetRajName]"
 RAJ_extend_indian_security_zone_desc: "การขยายเขตความมั่นคงจะปกปองพรมแดนของอินเดียและแผอํานาจไปทั่วภูมิภาค ดวยการขยายอิทธิพล เราจะสรางเสถียรภาพและการคุมครองที่จําเปนสําหรับชาติที่มั่นคงและมีอธิปไตย"
 RAJ_high_altitude_training: "การฝกในที่สูง"
 RAJ_high_altitude_training_desc: "ยอดเขาอันขรุขระของเทือกเขาหิมาลัยตองการความแข็งแกรงและความอดทน ดวยการจัดตั้งหลักสูตรการฝกในที่สูงเปนพิเศษ เราจะเตรียมกองกําลังใหครองความเหนือกวาในสภาพแวดลอมสุดขั้ว ปกปองพรมแดน และควบคุมพื้นที่ภูเขาทางยุทธศาสตร"
 RAJ_high_altitude_training_tt: "จะไดรับแมแบบกองพลทหารภูเขา"
 RAJ_demand_return_of_imperialist_colonies: "เรียกรองคืนอาณานิคมของจักรวรรดินิยม"
 RAJ_demand_return_of_imperialist_colonies_desc: "ถึงเวลาแลวที่ตองเรียกรองคืนอาณานิคมของจักรวรรดินิยมทั้งหมดในอนุทวีป รวมแผนดินอินเดียทั้งหมดไวใตธงผืนเดียว และยุติยุคแหงการรุกลํ้าของอาณานิคม"
 RAJ_planned_economy: "เศรษฐกิจแบบวางแผน"
 RAJ_planned_economy_desc: "ชาติที่แข็งแกรงตองมีเศรษฐกิจที่แข็งแกรง ซึ่งมีเปาหมายและวิสัยทัศนนําทาง ดวยการใชระบบเศรษฐกิจแบบวางแผน เราจะจัดสรรทรัพยากรไดอยางมีประสิทธิภาพ ใหความสําคัญกับการเติบโตทางอุตสาหกรรม และสรางการพัฒนาที่เปนธรรมแกพลเมืองทุกคน"
 RAJ_two_nation_theory_: "ทฤษฎีสองชาติ"
 RAJ_two_nation_theory__desc: "ทฤษฎีสองชาติยืนยันวาชาวฮินดูและชาวมุสลิมเปนชาติที่แตกตางกัน แตละฝายสมควรมีรัฐของตนเอง ดวยการยึดถืออุดมการณนี้ เรายอมรับความจําเปนของเสนทางที่แยกกันสูการกําหนดชะตากรรมของตนเอง และกําหนดอนาคตของอนุทวีปผานการแบงแยกและการปกครองตนเอง"
 RAJ_red_in_the_shadows: "พวกแดงในเงามืด"
 RAJ_red_in_the_shadows_desc: "ทามกลางความโกลาหลของจักรวรรดิที่เสื่อมถอย กองกําลังปฏิวัติกําลังรวบรวมพลัง ทํางานอยางลับ ๆ เพื่อบอนทําลายระเบียบเกา การผงาดขึ้นของธงแดงเปนสัญญาณของวันแหงการชําระบัญชีที่กําลังมาถึง—ซึ่งอาจพลิกโฉมอนาคตของอินเดียและโลก"
 RAJ_red_in_the_shadows_tt: "ปลดล็อกการตัดสินใจเพื่อแทรกซึมรัฐบาลอังกฤษและชักนําขบวนการเอกราชใหมีจุดยืนสนับสนุนคอมมิวนิสต ลดเงื่อนไขในการทํา §Y$RAJ_royal_indian_navy$§! ใหสําเร็จ"
 has_swayed_bose_to_communism: "ไดโนมนาวโพสใหหันมาเปนคอมมิวนิสตแลว"
 #RAJ_red_in_the_shadows_tt: "We will turn Communist upon gaining independence and avoid Partition. Pakistan will be released, gaining [ENG.GetAdjective] support to counter further communist influence."
 RAJ_seek_domestic_allies: "แสวงหาพันธมิตรในประเทศ"
 RAJ_seek_domestic_allies_desc: "กลุมฟอรเวิรดบล็อกไมอาจบรรลุวิสัยทัศนไดเพียงลําพัง ดวยการแสวงหาพันธมิตรจากทุกขั้วการเมือง เราจะรวมนักคิดหัวปฏิวัติ ระดมการสนับสนุนที่กวางขวางขึ้น และรวบรวมผูนําที่จําเปนในการผลักดันอินเดียสูเอกราชที่แทจริง"
 RAJ_protest_against_the_howell_monument: "ประทวงตอตานอนุสาวรียฮอลเวลล"
 RAJ_protest_against_the_howell_monument_desc: "อนุสาวรียฮอลเวลลเปนสิ่งเชิดชูการครอบงําและความอยุติธรรมของอาณานิคม ดวยการจัดการประทวงตอตานสัญลักษณนี้ เราจะปลุกชาติใหปฏิเสธโฆษณาชวนเชื่อของจักรวรรดิ และเรียกรองใหรื้อถอนสิ่งตกคางที่ดูหมิ่นการตอสูเพื่ออิสรภาพของเรา"
 RAJ_the_indian_national_army: "กองทัพแหงชาติอินเดีย"
 RAJ_the_indian_national_army_desc: "กองทัพแหงชาติอินเดียคือตัวแทนของการตอสูเพื่อเอกราช รวมผูรักชาติไวใตธงเดียวเพื่อจับอาวุธตอตานการปกครองอาณานิคม ดวยความมุงมั่นและการเสียสละ INA พรอมนําอินเดียสูการปลดปลอยและอธิปไตย"
RAJ_appoint_soviet_friendly_government: "แตงตั้งรัฐบาลนิยมโซเวียต"
RAJ_appoint_soviet_friendly_government_desc: "เพื่อใหไดการสนับสนุนที่ยั่งยืนจากมอสโก เราจะจัดตั้งรัฐบาลที่สอดคลองกับอุดมการณโซเวียตอยางเต็มที่ ความภักดีของพวกเขาจะนํามาซึ่งความชวยเหลือทางเศรษฐกิจ ความรวมมือทางทหาร และความสอดคลองทางอุดมการณในรัฐใหมของเรา"
RAJ_appoint_german_friendly_government: "แตงตั้งรัฐบาลนิยมเยอรมัน"
RAJ_appoint_german_friendly_government_desc: "การวางแนวรัฐบาลใหสอดคลองกับ[GER.GetNameDef]จะเสริมความสัมพันธกับมหาอํานาจที่กําลังผงาดขึ้นของยุโรป รัฐบาลชุดนี้จะใหความสําคัญกับการเติบโตทางอุตสาหกรรม การปรับปรุงกองทัพใหทันสมัย และการตอตานลัทธิบอลเชวิคอยางแนวแน"

 #RAJ_post_war_independence: "Post War Independence"
 #RAJ_post_war_independence_desc: ""
 RAJ_ban_untouchability_once_and_for_all: "ยกเลิกระบบจัณฑาลอยางเด็ดขาด"
 RAJ_ban_untouchability_once_and_for_all_desc: "ระบบจัณฑาลเปนมลทินของสังคมเรา แบงแยกเราในยามที่ตองการความเปนหนึ่งเดียวมากที่สุด ดวยการยกเลิกธรรมเนียมนี้ เรายืนยันศักดิ์ศรีของชาวอินเดียทุกคน และกาวไปอยางเด็ดขาดสูการสรางชาติที่เปนธรรมและไมกีดกันผูใด"
 RAJ_a_tiger_unchained: "พยัคฆหลุดพันธนาการ"
 RAJ_a_tiger_unchained_desc: "เราจะสรางหนวยรบชั้นยอดที่เชี่ยวชาญภูมิประเทศภูเขาที่โหดรายที่สุด พยัคฆแหงยอดเขาเหลานี้จะทําใหศัตรูหวาดกลัว และรักษาความเปนใหญของเราบนภูเขา"
 RAJ_to_shake_the_world: "เขยาโลก"
 RAJ_to_shake_the_world_desc: "ศักยภาพทางอุตสาหกรรมของอินเดียนั้นมหาศาล และบัดนี้ถึงเวลาปลดปลอยมันออกมา ดวยการขยายโรงงาน ปรับปรุงโครงสรางพื้นฐานใหทันสมัย และใชประโยชนจากทรัพยากรของเรา เราจะเปลี่ยนอินเดียใหเปนยักษใหญทางอุตสาหกรรมที่สามารถกําหนดชะตากรรมของโลก"
 RAJ_east_india_railways_dlc: "การรถไฟอินเดียตะวันออก"
 RAJ_east_india_railways_dlc_desc: "ดวยการขยายและปรับปรุงการรถไฟอินเดียตะวันออกใหทันสมัย เราจะเสริมสรางการคา ปรับปรุงการเชื่อมตอ และวางรางสูชาติที่รุงเรืองและเปนปกแผนยิ่งขึ้น"
 RAJ_modify_indian_railways_tt: "ปรับ $idea_RAJ_indian_railways$ ดังนี้:"
 RAJ_the_calcutta_line: "แนวกัลกัตตา"
 RAJ_the_calcutta_line_desc: "เมื่อความตึงเครียดในภูมิภาคทวีขึ้น การรักษาพรมแดนดานตะวันออกจึงเปนเรื่องจําเปน การเสริมปอมแนวกัลกัตตาจะสรางปราการปองกัน ปกปองโครงสรางพื้นฐานที่สําคัญ และคุมครองดินแดนใจกลางของเราจากภัยคุกคามภายนอก"
 RAJ_the_calcutta_line_tt: "เพิ่ม §G2§!§Y ปอมบนบก §!ใน§Yทุก§!จังหวัดในรัฐ"
 RAJ_bombay_baroda_and_central_india_railway: "การรถไฟบอมเบย บาโรดา และอินเดียกลาง"
 RAJ_bombay_baroda_and_central_india_railway_desc: "การขยายการรถไฟบอมเบย บาโรดา และอินเดียกลาง จะเชื่อมตอภูมิภาคสําคัญ ขับเคลื่อนการเติบโตทางเศรษฐกิจ และรวมชุมชนเขาดวยกัน เสนทางสําคัญเหลานี้จะเสริมเครือขายการคาและเสริมความแข็งแกรงใหโครงสรางพื้นฐานของอินเดียเพื่อรับมือความทาทายขางหนา"
 RAJ_great_indian_peninsula_railway_dlc: "การรถไฟคาบสมุทรอินเดียใหญ"
 RAJ_great_indian_peninsula_railway_dlc_desc: "การรถไฟคาบสมุทรอินเดียใหญคือกุญแจปลดล็อกศักยภาพทางเศรษฐกิจของอินเดียตอนกลางและตอนใต การขยายเครือขายนี้จะหนุนการคา เสริมพลังอุตสาหกรรม และสรางการเชื่อมตอที่ไรรอยตอทั่วอนุทวีป"
 RAJ_south_indian_railway_company: "บริษัทการรถไฟอินเดียใต"
 RAJ_south_indian_railway_company_desc: "บริษัทการรถไฟอินเดียใตเชื่อมภาคใตอันมีชีวิตชีวาเขากับสวนอื่นของอินเดีย การเสริมความแข็งแกรงและขยายเครือขายนี้จะขับเคลื่อนการเติบโตของภูมิภาค สงเสริมเอกภาพ และตอกยํ้าบทบาทของภาคใตในการกาวสูเอกราชทางเศรษฐกิจของอินเดีย"
 RAJ_supply_center_fortifications: "เสริมปอมศูนยเสบียง"
 RAJ_supply_center_fortifications_desc: "การรักษาศูนยเสบียงเปนสิ่งสําคัญยิ่งตอการดําเนินสงคราม ดวยการเสริมปอมศูนยกลางเหลานี้ เราจะรับประกันการไหลเวียนของทรัพยากรอยางไมขาดสาย และปกปองกระดูกสันหลังของปฏิบัติการทางทหารจากการรุกลํ้าของขาศึก"
 RAJ_supply_center_fortifications_tt: "เพิ่ม §G3§! §Y$bunker$§! ใน§Yศูนยเสบียง§!ทุกแหงในรัฐที่เราครอบครอง"
 RAJ_north_western_state_railway: "การรถไฟรัฐตะวันตกเฉียงเหนือ"
 RAJ_north_western_state_railway_desc: "การรถไฟรัฐตะวันตกเฉียงเหนือมีความสําคัญยิ่งในการเชื่อมดินแดนใจกลางของอินเดียกับพรมแดนทางยุทธศาสตร การขยายและปรับปรุงเครือขายนี้ใหทันสมัยจะเสริมการคาในภูมิภาค เพิ่มความคลองตัว และตอกยํ้าการปรากฏตัวของเราตามแนวพรมแดนที่สําคัญ"
 RAJ_prioritize_army_cargo: "ใหความสําคัญกับการขนสงของกองทัพ"
 RAJ_prioritize_army_cargo_desc: "เครือขายทางรถไฟคือกระดูกสันหลังของการสงกําลังบํารุงทางทหาร ดวยการใหความสําคัญกับการขนสงของกองทัพ เราจะทําใหทหารของเราไดรับอาวุธ ทรัพยากร และกําลังเสริมที่จําเปนตอการควาชัยชนะอยางรวดเร็วและเด็ดขาด"
 RAJ_prioritize_civilian_cargo: "ใหความสําคัญกับการขนสงพลเรือน"
 RAJ_prioritize_civilian_cargo_desc: "แนวหลังที่แข็งแกรงเปนสิ่งจําเปนตอชัยชนะ ดวยการใหความสําคัญกับการขนสงพลเรือน เราจะสงมอบอาหาร สินคา และวัสดุไดทันเวลาเพื่อหลอเลี้ยงประชาชนและอุตสาหกรรม ทําใหชาติยืนหยัดไดในยามวิกฤต"
 RAJ_specialized_dietary_requirement: "ขอกําหนดดานอาหารเฉพาะ"
 RAJ_specialized_dietary_requirement_desc: "เพื่อรักษาขวัญกําลังใจและความสามัคคี เราตองเคารพความตองการดานอาหารที่หลากหลายของทหาร ดวยการจัดอาหารที่สอดคลองกับความเชื่อทางศาสนาและวัฒนธรรม ทหารทุกนายจะรูสึกไดรับความเคารพและพรอมสูรบ"
 RAJ_standardized_rations: "เสบียงอาหารมาตรฐาน"
 RAJ_standardized_rations_desc: "ประสิทธิภาพและความสมํ่าเสมอคือกุญแจสูกองทัพที่แข็งแกรง ดวยการใชเสบียงอาหารมาตรฐาน เราจะทําใหการสงกําลังบํารุงงายขึ้น ลดตนทุน และใหทหารทุกนายไดรับอาหารเหมือนกัน สงเสริมเอกภาพและวินัยทั่วทุกระดับชั้น"
 RAJ_royal_indian_artillery_: "กองปนใหญหลวงอินเดีย"
 RAJ_royal_indian_artillery__desc: "ดวยการเสริมความแข็งแกรงใหกองกําลังอันนาเกรงขามนี้ เราจะมีอํานาจการยิงอันรุนแรง ทําลายแนวขาศึก และควาชัยชนะในสนามรบ"
 RAJ_armoured_corps_center_and_school: "ศูนยเหลายานเกราะ"
 RAJ_armoured_corps_center_and_school_desc: "อนาคตของการสงครามอยูที่พลังของยานยนต การจัดตั้งศูนยเหลายานเกราะจะชวยใหเราฝกทหารในยุทธวิธียานเกราะ เปลี่ยนรถถังใหเปนหัวหอกของยุทธศาสตรทางทหารสมัยใหมของเรา"
 RAJ_indian_army_corps_of_engineers: "เหลาทหารชาง[ROOT.GetAdjective]"
 RAJ_indian_army_corps_of_engineers_desc: "ตั้งแตปอมปราการไปจนถึงสะพาน เหลาทหารชาง[ROOT.GetAdjective]เปนสิ่งจําเปนตอความสําเร็จของปฏิบัติการ ดวยการขยายและเสริมยุทโธปกรณใหเหลาทัพสําคัญนี้ เราจะทําใหกองกําลังของเราฝาฟนทุกอุปสรรค และปูทางสูชัยชนะในทุกแนวรบ"
 RAJ_kingmaker: "ผูสรางกษัตริย"
 RAJ_kingmaker_desc: "ดวยการสงอาสาสมัครไปยังความขัดแยงในตางแดน เราจะขยายอิทธิพลและไดรับประสบการณการรบอันมีคา ความพยายามเหลานี้ไมเพียงสนับสนุนพันธมิตรของเรา แตยังทําใหเราเปนพลังชี้ขาดในการกําหนดผลลัพธของการตอสูทั่วโลก"
 RAJ_relax_agrarian_society_criteria: "ทําใหสังคมเปนอุตสาหกรรม"
 RAJ_relax_agrarian_society_criteria_desc: "เพื่อกาวสูการเปนมหาอํานาจทางอุตสาหกรรมสมัยใหม เราตองเปลี่ยนเศรษฐกิจใหหลุดพนจากเกษตรกรรมแบบดั้งเดิม ดวยการสงเสริมใหประชากรในชนบทเขาสูแรงงานอุตสาหกรรม เราจะวางรากฐานสําหรับการเติบโตอยางยั่งยืนและความกาวหนาทางเทคโนโลยี"
 RAJ_mechanization_of_the_cavalry: "การปรับทหารมาเปนยานยนต"
 RAJ_mechanization_of_the_cavalry_desc: "ยุคแหงการรบบนหลังมาไดสิ้นสุดลงแลว ดวยการปรับทหารมาเปนยานยนต เราจะเปลี่ยนใหเปนกองกําลังยานเกราะสมัยใหม ผสานความเร็วและอํานาจการยิงเพื่อครองสนามรบ และนําอินเดียสูอนาคตแหงการสงคราม"
 RAJ_mountain_tanks: "รถถังภูเขา"
 RAJ_mountain_tanks_desc: "รถถังแบบดั้งเดิมเคลื่อนที่ลําบากในภูมิประเทศขรุขระ แตรถถังภูเขาที่ออกแบบเฉพาะจะทําใหเราไดเปรียบในการรบบนที่สูง เครื่องจักรอันคลองแคลวเหลานี้จะครองที่สูง ยึดฐานที่มั่นทางยุทธศาสตร และเหนือกวาขาศึกในการดําเนินกลยุทธ"
 RAJ_siege_batteries: "กองรอยปนใหญลอมเมือง"
 RAJ_siege_batteries_desc: "เมื่อปอมปราการขวางทางเรา กองรอยปนใหญลอมเมืองจะถลมมันจนราบเปนหนากลอง หนวยปนใหญหนักเหลานี้มีอานุภาพทําลายลางอันหาที่เปรียบมิได ทําใหไมมีปอมหรือฐานที่มั่นใดตานทานการรุกของเราได"
 RAJ_mountain_guns: "ปนใหญภูเขา"
 RAJ_mountain_guns_desc: "การรบบนที่สูงตองอาศัยความยืดหยุน ปนใหญภูเขาที่ออกแบบมาสําหรับภูมิประเทศขรุขระจะใหการยิงสนับสนุนที่สําคัญแกทหารในสภาพแวดลอมที่โหดรายที่สุด ทําใหเราเหนือกวาแมในการรบที่ยากลําบากที่สุด"
 RAJ_regimental_loyalty: "ความภักดีตอกรม"
 RAJ_regimental_loyalty_desc: "สายใยแหงความภักดีตอกรมหลอหลอมเอกภาพและวินัยในหมูทหารของเรา ดวยการปลูกฝงความภาคภูมิใจในธรรมเนียมเหลานี้ เราจะสรางกองกําลังที่ผูกพันดวยเกียรติ ความไววางใจ และความมุงมั่นสูชัยชนะอยางไมยอทอ"
 RAJ_uplifting_the_people_of_india: "ยกระดับชีวิตชาวอินเดีย"
 RAJ_uplifting_the_people_of_india_desc: "ชาวอินเดียตองมีความแนวแนในการกาวสูเอกราช และเพื่อการนั้น ความตองการขั้นพื้นฐานของพวกเขาตองไดรับการตอบสนองกอน เราจึงจะดําเนินนโยบายเพื่อบรรลุเปาหมายนี้"
 RAJ_gurkhas: "ทหารกูรขา"
 RAJ_gurkhas_desc: "ทหารกูรขาขึ้นชื่อดานความกลาหาญและความทรหด เปนกองกําลังชั้นยอดที่หาตัวจับยากในการรบ ดวยการขยายบทบาทและรักษาความทุมเทของพวกเขาตออุดมการณของเรา เราจะไดความไดเปรียบสําคัญในสนามรบ"
 RAJ_lions_of_the_great_war_: "สิงหแหงมหาสงคราม"
 RAJ_lions_of_the_great_war__desc: "การเสียสละของทหารอินเดียในมหาสงครามเปนประจักษพยานถึงความกลาหาญของพวกเขา ดวยการรําลึกถึงมรดกของพวกเขา เราจะเชิดชูความกลาหาญนั้นและสรางแรงบันดาลใจใหคนรุนใหมสืบสานจิตวิญญาณนี้ในการตอสูเพื่อชะตากรรมของอินเดีย"
 RAJ_abolish_agrarian_society_criteria: "เรงการพัฒนาอุตสาหกรรม"
 RAJ_abolish_agrarian_society_criteria_desc: "ในยุคสมัยใหม เปนเรื่องจําเปนยิ่งที่เราตองตามใหทันชาติอื่นในดานการพัฒนาเศรษฐกิจ เราพึ่งพาเกษตรกรรมมานานเกินไปแลว ถึงเวลาเปดทางสูการพัฒนาอุตสาหกรรมอยางรวดเร็ว เพื่อนํา[RAJ.GetNameDef]เขาสูยุคใหมแหงความกาวหนา"
 RAJ_abolish_agrarian_society_criteria_tt: "ลดเวลาที่ใชในการลดผลของ §Y$idea_RAJ_agrarian_society$§! ลง §Y3§! เดือนอยางถาวร"
 RAJ_womens_auxiliary_corps: "หนวยสนับสนุนสตรี"
 RAJ_womens_auxiliary_corps_desc: "ดวยการจัดตั้งหนวยสนับสนุนสตรี เราจะเปดโอกาสใหสตรีรับใชในบทบาทสนับสนุนที่สําคัญ เสริมความแข็งแกรงใหกองทัพ การมีสวนรวมของพวกเธอจะหนุนการสงกําลังบํารุง การสื่อสาร และปฏิบัติการ พิสูจนวาชาวอินเดียทุกคนมีบทบาทในการปกปองอนาคตของเรา"
 RAJ_indian_territorial_force: "กองกําลังรักษาดินแดน[ROOT.GetAdjective]"
 RAJ_indian_territorial_force_desc: "กองกําลังรักษาดินแดน[ROOT.GetAdjective]จะเปนกําลังสํารองสําคัญของพลเมืองที่ผานการฝกและพรอมปกปองมาตุภูมิ"
 RAJ_military_engineer_services: "หนวยบริการวิศวกรรมทหาร"
 RAJ_military_engineer_services_desc: "หนวยบริการวิศวกรรมทหารคือกระดูกสันหลังของโครงสรางพื้นฐานทางทหาร ตั้งแตปอมปราการไปจนถึงเสนทางสงเสบียง การเสริมความแข็งแกรงใหเหลาทัพสําคัญนี้จะทําใหกองกําลังของเรามีถนน ฐานทัพ และแนวปองกันที่จําเปนตอการเอาชนะในทุกความขัดแยง"
 RAJ_the_burma_rifles: "กรมทหารปนเล็กยาวพมา"
 RAJ_the_burma_rifles_desc: "กรมทหารปนเล็กยาวพมาเปนกองกําลังสําคัญในการรักษาความมั่นคงในภูมิประเทศอันยากลําบากของพรมแดนดานตะวันออก ดวยการเสริมความแข็งแกรงและปรับปรุงกรมทหารนี้ใหทันสมัย เราจะรักษาเสถียรภาพ ปกปองภูมิภาคสําคัญ และเตรียมพรอมรับมือความทาทายในอนาคตในพื้นที่ยุทธศาสตรแหงนี้"
 RAJ_help_from_the_nagas: "ความชวยเหลือจากชาวนาคา"
 RAJ_help_from_the_nagas_desc: "ชาวนาคาซึ่งรูจักภูมิประเทศอยางลึกซึ้งและมีทักษะการรบแบบกองโจรที่หาตัวจับยาก เปนพันธมิตรอันลํ้าคา ดวยการไดรับการสนับสนุนจากพวกเขา เราจะเสริมสถานะของเราในภาคตะวันออกเฉียงเหนือ เปลี่ยนเนินเขาขรุขระใหเปนปอมปราการแหงการตอตานและความแข็งแกรง"
 RAJ_campaign_against_agrarian_societys: "แผนการพัฒนาอุตสาหกรรม"
 RAJ_campaign_against_agrarian_societys_desc: "อินเดียจะถูกทิ้งไวในศตวรรษที่แลวไมได เราตองทุมเทความพยายามอยางเต็มที่เพื่อยกระดับชีวิตประชาชนของเรา"
 RAJ_indianize_the_army: "ทําใหกองทัพเปนของชาวอินเดีย"
 RAJ_indianize_the_army_desc: "ถึงเวลาแลวที่ตองแทนที่อิทธิพลอาณานิคมดวยผูนําชาวอินเดียในกองทัพ ดวยการเลื่อนยศนายทหารชาวอินเดียและปรับโครงสรางกองทัพ เราจะสรางกองทัพที่เปนตัวแทนและรับใชชาติอยางแทจริง"
 RAJ_keep_british_generals: "คงนายพลอังกฤษไว"
 RAJ_keep_british_generals_desc: "ในชวงเวลาที่ไมแนนอนเชนนี้ ผูนําที่มีประสบการณเปนสิ่งสําคัญยิ่ง การคงนายพลอังกฤษไวจะทําใหกองทัพไดประโยชนจากความเชี่ยวชาญและวินัยของพวกเขา รักษาเสถียรภาพและประสิทธิผลขณะที่เราเดินบนเสนทางสูเอกราช"
 RAJ_keep_british_generals_tt: "เราจะคงนายพลอังกฤษไวทั้งหมด แมวาเราจะตองทําสงครามกับ[ENG.GetName]ก็ตาม"
 RAJ_chindits_: "ชินดิตส"
 RAJ_chindits__desc: "ชินดิตสคือนักรบชั้นยอดนอกแบบที่ไดรับการฝกสําหรับปฏิบัติการในปาระยะไกล ดวยการขยายกําลังพลและขัดเกลายุทธวิธี เราจะไดกองกําลังที่สามารถเอาชนะขาศึกดวยการดําเนินกลยุทธ และกอกวนปฏิบัติการของพวกเขาลึกเขาไปหลังแนวขาศึก"
 RAJ_viceroys_body_guard: "ทหารรักษาพระองคของอุปราช"
 RAJ_viceroys_body_guard_desc: "ทหารรักษาพระองคของอุปราชเปนตัวแทนของขนบธรรมเนียม วินัย และเกียรติยศ ดวยการรักษาและปรับปรุงหนวยทหารมาอันเลื่องชื่อนี้ใหทันสมัย เราจะรักษาสัญลักษณแหงอํานาจไวและปรับใหรับมือกับความทาทายของยุคที่เปลี่ยนแปลงไป"
 RAJ_engineering_revolution: "การปฏิวัติดานวิศวกรรม"
 RAJ_engineering_revolution_desc: "ความกาวหนาของอินเดียตองอาศัยการปฏิวัติดานวิศวกรรม ดวยการลงทุนในโครงสรางพื้นฐาน การพัฒนาอุตสาหกรรม และเทคโนโลยีลํ้าสมัย เราจะเปลี่ยนชาติใหเปนขุมพลังที่พรอมเปนผูนําทั้งในยามสงบและยามสงคราม"
 RAJ_ordnance_factory_kanpur_uttar_pradesh: "โรงงานสรรพาวุธกานปุระ"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc: "โรงงานสรรพาวุธในกานปุระเปนหลักสําคัญของการผลิตดานกลาโหมของอินเดีย ดวยการขยายกําลังการผลิตและปรับปรุงสิ่งอํานวยความสะดวกใหทันสมัย เราจะมีอาวุธและยุทโธปกรณปอนอยางตอเนื่อง เสริมพลังใหกองกําลังของเราปกปองชาติ"
 RAJ_indian_air_force: "กองทัพอากาศ[ROOT.GetAdjective]"
 RAJ_indian_air_force_desc: "ทองฟาคือพรมแดนใหมของการสงครามสมัยใหม ดวยการสรางกองทัพอากาศอินเดียที่แข็งแกรงและเปนอิสระ เราจะปกปองอธิปไตย ครองนานฟา และเตรียมพรอมรับมือความทาทายของความขัดแยงในอนาคต"
 RAJ_the_burma_road: "ถนนพมา"
 RAJ_the_burma_road_desc: "ถนนพมาเปนเสนทางสงเสบียงสําคัญที่เชื่อมอินเดียกับเอเชียตะวันออกเฉียงใตและไกลออกไป การรักษาและขยายเสนทางนี้จะทําใหทรัพยากรและกําลังเสริมไหลเวียนอยางตอเนื่อง เสริมสถานะของเราในภูมิภาคและสนับสนุนพันธมิตรของเรา"
 RAJ_womens_auxiliary_air_force: "กองทัพอากาศสนับสนุนสตรี"
 RAJ_womens_auxiliary_air_force_desc: "กองทัพอากาศสนับสนุนสตรีเปดโอกาสใหสตรีสนับสนุนปฏิบัติการทางอากาศ ตั้งแตการสงกําลังบํารุงไปจนถึงการสื่อสาร ดวยการผนวกความสามารถของพวกเธอ เราจะเสริมความแข็งแกรงใหกองทัพอากาศ และพิสูจนวาชาวอินเดียทุกคนมีสวนรวมในการปกปองนานฟาของชาติได"
 RAJ_trainer_planes: "เครื่องบินฝก"
 RAJ_trainer_planes_desc: "นักบินที่มีทักษะคือกระดูกสันหลังของกองทัพอากาศที่แข็งแกรง ดวยการลงทุนในเครื่องบินฝก เราจะทําใหนักบินของเราไดรับการเตรียมพรอมที่ดีที่สุด สรางกลุมนักบินชั้นยอดที่พรอมปกปองนานฟาของอินเดีย"
 RAJ_spitfire: "สปตไฟร"
 RAJ_spitfire_desc: "สปตไฟรขึ้นชื่อดานความเร็วและความคลองตัว จะเปนแกนหลักของกองทัพอากาศสมัยใหมของเรา ทําใหเราครองนานฟาและตอบโตภัยคุกคามทางอากาศใด ๆ ไดอยางนาเกรงขาม"
 RAJ_ground_pounder: "นักถลมภาคพื้น"
 RAJ_ground_pounder_desc: "ภูมิประเทศอันขรุขระของอินเดียทําใหรถถังเคลื่อนที่ไดชา การมีเครื่องบินสนับสนุนทางอากาศโดยใกลชิดจึงจําเปนตอการชดเชยการขาดแคลนกําลังสนับสนุนภาคพื้นดินหนัก"
 RAJ_douglas_dakota: "ดักลาส ดาโกตา"
 RAJ_douglas_dakota_desc: "เรามีความจําเปนเรงดวนในการขนสงทหารและสินคาอยางรวดเร็ว ดาโกตาเปนเครื่องบินที่มีขีดความสามารถสูงสําหรับภารกิจนี้โดยเฉพาะ"
 RAJ_vultee_vengeance: "วัลที เวนเจนซ"
 RAJ_vultee_vengeance_desc: "ดวยการจัดหาเครื่องบินวัลที เวนเจนซของอเมริกา เราจะขยายกองทัพอากาศไดอยางมหาศาลดวยตนทุนที่ประหยัดมาก"
 RAJ_ordnance_factory_khamaria_jabalpur: "โรงงานสรรพาวุธคามาเรีย ชบัลปุระ"
 RAJ_ordnance_factory_khamaria_jabalpur_desc: "โรงงานสรรพาวุธคามาเรียซึ่งตั้งอยูในชบัลปุระเปนผูผลิตกระสุนและอาวุธยุทโธปกรณที่สําคัญ การขยายกําลังการผลิตจะเสริมอํานาจการยิงของกองทัพ ทําใหกองกําลังของเรามียุทโธปกรณพรอมสําหรับทุกความทาทายขางหนา"
 RAJ_ordnance_factory_medak: "โรงงานสรรพาวุธเมดัก"
 RAJ_ordnance_factory_medak_desc: "โรงงานสรรพาวุธเมดักซึ่งเชี่ยวชาญการผลิตยานเกราะมีความสําคัญยิ่งตอการปรับปรุงกองทัพใหทันสมัย การขยายการดําเนินงานจะทําใหกองกําลังของเรามีเครื่องจักรลํ้าสมัยที่จําเปนตอการครองสนามรบ"
 RAJ_chariot_of_victory: "รถศึกแหงชัยชนะ"
 RAJ_chariot_of_victory_desc: "สนามรบตองการความเร็วและความแข็งแกรง ดวยการลงทุนในยานเกราะและกองกําลังยานยนต เราจะสรางกองทัพสมัยใหมที่สามารถควาชัยชนะไดอยางรวดเร็วและเด็ดขาด ทําใหอินเดียเหนือกวาในทุกความขัดแยง"
 RAJ_the_ledo_road: "ถนนเลโด"
 RAJ_the_ledo_road_desc: "ถนนเลโดซึ่งตัดผานภูมิประเทศขรุขระเปนเสนทางสงเสบียงสําคัญที่เชื่อมอินเดียกับกองกําลังฝายสัมพันธมิตรในจีน การสรางใหเสร็จและรักษาเสนเลือดใหญนี้ไวจะทําใหทหาร ทรัพยากร และยุทโธปกรณที่จําเปนตอการพลิกสถานการณในเอเชียตะวันออกเฉียงใตไหลเวียนได"
 RAJ_long_range_escorts: "เครื่องบินคุมกันพิสัยไกล"
 RAJ_long_range_escorts_desc: "เพื่อปกปองเสนทางสงเสบียงและภารกิจสําคัญ เราตองมีเครื่องบินที่สามารถคุมกันเครื่องบินทิ้งระเบิดและเครื่องบินลําเลียงในระยะทางไกล การลงทุนในเครื่องบินคุมกันพิสัยไกลจะรับประกันความเหนือกวาทางอากาศและความปลอดภัยของปฏิบัติการที่อยูไกลเกินพรมแดนของเรา"
 RAJ_british_air_experts: "ผูเชี่ยวชาญดานการบินชาวอังกฤษ"
 RAJ_british_air_experts_desc: "การใชความเชี่ยวชาญของนักบินและวิศวกรชาวอังกฤษผูชํ่าชองจะชวยเรงการพัฒนากองทัพอากาศของเรา ประสบการณของพวกเขาในการสงครามทางอากาศสมัยใหมจะใหขอคิดอันลํ้าคาขณะที่เราสรางกําลังทางอากาศที่นาเกรงขาม"
 RAJ_special_operations_executive: "หนวยปฏิบัติการพิเศษ (SOE)"
 RAJ_special_operations_executive_desc: "หนวยปฏิบัติการพิเศษเชี่ยวชาญการสงครามนอกแบบ ตั้งแตการกอวินาศกรรมไปจนถึงการรวบรวมขาวกรอง การขยายบทบาทของหนวยนี้ในอินเดียจะทําใหเรามีเครื่องมือในการขัดขวางแผนการของขาศึก และเปลี่ยนปฏิบัติการลับใหเปนความไดเปรียบทางยุทธศาสตร"
 RAJ_the_ordnance_factories_board: "คณะกรรมการโรงงานสรรพาวุธ"
 RAJ_the_ordnance_factories_board_desc: "การประสานเครือขายโรงงานสรรพาวุธอันกวางขวางของอินเดียภายใตคณะกรรมการเดียวจะทําใหการผลิตคลองตัว เพิ่มประสิทธิภาพ และรับประกันการปอนอาวุธและกระสุนอยางสมํ่าเสมอ รากฐานนี้จะเสริมพลังใหกองทัพและขับเคลื่อนการพึ่งพาตนเองของอินเดียในการผลิตดานกลาโหม"
 RAJ_smiling_buddah: "พระพุทธเจายิ้ม"
 RAJ_smiling_buddah_desc: "โครงการพระพุทธเจายิ้มเปนจุดเริ่มตนที่อินเดียกาวเขาสูการมีขีดความสามารถทางนิวเคลียร ดวยการเชี่ยวชาญเทคโนโลยีนี้ เราจะประกาศความเปนอิสระบนเวทีโลกและมีอํานาจปองปรามอันทรงพลังเพื่อปกปองอธิปไตยของเรา"
 RAJ_royal_indian_air_force_dlc: "กองทัพอากาศหลวง[ROOT.GetAdjective]"
 RAJ_royal_indian_air_force_dlc_desc: "กองทัพอากาศหลวงอินเดียคือจุดสูงสุดของแสนยานุภาพทางอากาศของอินเดีย การขยายขีดความสามารถดวยเครื่องบินและการฝกที่ทันสมัยจะทําใหเราครองนานฟา พรอมปกปองชาติและแผอํานาจไปทั่วภูมิภาค"
 RAJ_infiltrate_aden: "แทรกซึมเอเดน"
 RAJ_infiltrate_aden_desc: "เอเดน ฐานที่มั่นทางยุทธศาสตรของอํานาจอังกฤษ คือกุญแจสําคัญในการทําลายการควบคุมของพวกเขาในภูมิภาค ดวยการแทรกซึมและจัดตั้งขบวนการตอตานในทองถิ่น เราจะจุดชนวนการกบฏที่บั่นทอนอํานาจของอังกฤษ และสรางความโกลาหลในขณะที่การตอสูเพื่อเอกราชของเรากําลังเริ่มตน"
 RAJ_go_into_hiding: "หลบซอนตัว"
 RAJ_go_into_hiding_desc: "สุภาษ จันทระ โพส ตองหลบเลี่ยงการสอดแนมของอังกฤษเพื่อสานตอการตอสูเพื่อเอกราช ดวยการหลบซอนตัว เขาจะรักษาผูนําของขบวนการไวได พรอมโจมตีเมื่อถึงเวลาที่เหมาะสม"
 RAJ_trade_protection: "การคุมครองการคา"
 RAJ_trade_protection_desc: "เพื่อความรุงเรืองของเศรษฐกิจ เราตองปกปองเสนทางการคาและอุตสาหกรรมที่สําคัญจากการแสวงประโยชนของตางชาติ การเสริมการคุมครองการคาจะรักษาทรัพยากรของอินเดีย สงเสริมการเติบโตภายในประเทศ และปกปองตลาดของเราจากภัยคุกคามภายนอก"
 RAJ_seek_japanese_support_tt: "เมื่อสงครามเพื่อเอกราชเริ่มขึ้น [JAP.GetNameDef]จะมอบสิ่งตอไปนี้ใหเรา:\nเครื่องบินทิ้งระเบิดทางทะเล B4Y §Y120§! ลํา\nเครื่องบินขับไลยุคระหวางสงคราม [Jap.GetAdjective]Ki-10 §Y135§! ลํา\nพรอมแบบของเครื่องบินเหลานั้น และ\n"
 RAJ_the_enemy_of_my_enemy_tt: "รัฐบาล§Y[JAP.GetAdjective]§!จะประกาศสงครามกับฝายตรงขามในสงครามกลางเมืองและชวยเหลือเรา"
 RAJ_the_enemy_of_my_enemy_tt_2: "ฝาย§Y[JAP.GetAdjective]§!จะพยายามบุก§Y[733.GetName]§!และมอบใหแกเราดวย"
 RAJ_azad_hind_dlc_tt: "เราจะไดรับ:"
 RAJ_azad_hind_dlc_tt_2: "เมื่อเริ่ม§Rสงครามกลางเมือง§! เปนเวลา §Y120§! วัน"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt: "จะเริ่มสงครามกลางเมืองเพื่อเอกราชระหวางฝายผูสนับสนุนประชาธิปไตยกับเรา\nทุกรัฐที่มีการตอตานสูงกวา §Y65%§! หรือ §Y85% การตอตาน§! จะเขาขางเราในสงครามกลางเมือง และมอบกองพลใหเรา 1 หรือ 2 กองพลตามลําดับ ขึ้นอยูกับระดับการตอตานสูงสุด\nรัฐอื่นทั้งหมดจะเขาขางฝายประชาธิปไตย"

### 
RAJ_infiltrate_aden_tt: "เมื่อสงครามเพื่อเอกราชเริ่มขึ้น จะระดมกองกําลังอาสาใน §Y[659.GetName]§!, §Y[906.GetName]§!, §Y[658.GetName]§!, §Y[765.GetName]§!, §Y[422.GetName]§! และ §Y[656.GetName]§! เพื่อโจมตีดินแดนในครอบครองของ[ENG.GetName]"
 RAJ_go_into_hiding_tt: "โพสจะหลบหนีจากการคุมขังและเริ่มตนการเดินทาง แลวกลับมาเมื่อสงครามกลางเมืองเริ่มขึ้น"
 RAJ_war_taxes_tt: "ปลดล็อกการตัดสินใจเพื่อเก็บภาษีสงครามสําหรับแตละประเทศที่ทําสงครามดวย"
 RAJ_akhand_bharat: "อขัณฑภารต"
 RAJ_akhand_bharat_desc: "อขัณฑภารตตองคงความเปนหนึ่งเดียวและแบงแยกมิได ทุกคนที่มีความภักดีและความจงรักตอชาติอินเดียและรัฐของชาติอยางไมแบงแยก จะไดรับการปฏิบัติอยางเทาเทียมโดยสมบูรณและแบงปนหนาที่รวมกันอยางเทาเทียม โดยไมคํานึงถึงวรรณะ ลัทธิ หรือศาสนา"
 RAJ_akhand_bharat_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐใน[AFG.GetName], [MLD.GetName], [NEP.GetName], [PAK.GetName], [BAN.GetName], [BHU.GetName], [SRL.GetName] เปนดินแดนหลัก และกอตั้งอขัณฑภารต เราเลือกเปาหมายไดทีละประเทศ และตองยึดครองดินแดนหลักที่มีอยูทั้งหมดกอนจึงจะอางสิทธิ์ดินแดนหลักเพิ่มได"
 RAJ_two_nation_theory_dlc: "$RAJ_two_nation_theory$"
 RAJ_two_nation_theory_dlc_desc: "$RAJ_two_nation_theory__desc$"
 RAJ_extended_franchise: "ขยายสิทธิ"
 RAJ_extended_franchise_desc: "การขยายสิทธิของสามัญชน[GetRajAdjective]เปนภารกิจสําคัญในการลดการควบคุมประเทศของ[ENG.GetAdjective]"
 RAJ_hand_over_aden_to_the_crown: "มอบเอเดนคืนแกราชบัลลังก"
 RAJ_hand_over_aden_to_the_crown_desc: "ตามแผนที่วางไว [ROOT.GetNameDef]จะมอบอํานาจเหนือเอเดนคืนแกราชบัลลังกอังกฤษ เพื่อลดภาระดานการบริหาร"
 RAJ_renegotiate_adens_control: "เจรจาการควบคุมเอเดนใหม"
 RAJ_renegotiate_adens_control_desc: "แมแผนเดิมคือการมอบเอเดนใหแก[ENG.GetName] แตการมีทาเรือการคาริมทะเลแดงก็มีประโยชนอยางมาก เราตองเจรจานโยบายนี้ใหมและคงเอเดนไวใตการควบคุมของเรา"
 RAJ_renegotiate_adens_control_tt: "เราจะคงการควบคุม[992.GetName]ไว แทนที่จะมอบใหแก[ENG.GetName]"
 RAJ_cripps_mission_dlc: "$RAJ_cripps_mission$"
 RAJ_cripps_mission_dlc_desc: "$RAJ_cripps_mission_desc$"
 RAJ_trade_port: "ทาเรือการคา"
 RAJ_trade_port_desc: "ขณะนี้เอเดนเปนเพียงทาเรือเล็ก ๆ แตดวยการลงทุน มันอาจกลายเปนทาเรือที่เฟองฟู"
 RAJ_fortify_aden: "เสริมปอมเอเดน"
 RAJ_fortify_aden_desc: "เมื่อเอเดนกลายเปนทาเรือสําคัญแลว จึงตองเสริมกําลังปองกันจากการโจมตีที่อาจเกิดขึ้น"
 RAJ_purna_swaraj: "การปกครองตนเอง - ปูรณสวราช"
 RAJ_purna_swaraj_desc: "รัฐบาล[ENG.GetAdjective]ในอินเดียไมเพียงพรากอิสรภาพของชาว[RAJ.GetAdjective]ไป แตยังตั้งอยูบนการขูดรีดมวลชน และทําใหอินเดียยอยยับทั้งทางเศรษฐกิจ การเมือง วัฒนธรรม และจิตวิญญาณ ดังนั้นอินเดียตองตัดความสัมพันธกับ[ENG.GetAdjective]และบรรลุปูรณสวราช หรือเอกราชโดยสมบูรณ"
 RAJ_the_second_duar_war: "สงครามดูอารครั้งที่สอง"
 RAJ_the_second_duar_war_desc: "ดวยสถานการณโลกในขณะนี้ เราไมอาจปลอยใหชาว[BHU.GetAdjective]เปนรัฐอิสระไดอีกตอไป เราตองผนวกพวกเขาเขาเปนสวนหนึ่งของอินเดีย"
 RAJ_bhutanese_protectorate: "รัฐในอารักขาภูฏาน"
 RAJ_bhutanese_protectorate_desc: "เราตองเคารพการแยกตัวโดดเดี่ยวของชาว[BHU.GetAdjective] แตขณะเดียวกันก็ไมอาจปฏิเสธความจริงที่วาประเทศเล็ก ๆ จะถูกกลืนกินโดยผูมีความทะเยอทะยานแบบจักรวรรดินิยม เราจะเสนอการคุมครองภายใตปกของอินเดียใหแกพวกเขา"
 RAJ_bhutanese_protectorate_tt: "§Y[BHU.GetName]§! จะกลายเปนประเทศในเครือของ§Y[RAJ.GetNameDefCap].§!\n\nพวกเขามีแนวโนมจะยอมรับมากขึ้นหาก\n\t-พวกเขามีความเห็นตอเราในระดับสูง\n\t-เรามีกองทัพที่แข็งแกรงกวาพวกเขาอยางมาก"
 RAJ_give_sikkim_administrative_rights_for_bhutan: "มอบสิทธิ์การบริหารภูฏานใหสิกขิม"
 RAJ_all_india_students_federation: "สหพันธนักศึกษาแหงอินเดีย"
 RAJ_all_india_students_federation_desc: "การระดมนักศึกษาตอตานการเปนเจาอาณานิคมของ[ENG.GetAdjective]จะทําใหคนหนุมสาวหัวกะทิของเราทํางานเพื่อตอตานระเบียบที่มีอยู"
 RAJ_league_against_gandhism: "สันนิบาตตอตานลัทธิคานธี"
 RAJ_league_against_gandhism_desc: "นโยบายอหิงสาของมหาตมะเปนสิ่งที่นายกยอง แตนาเสียดายที่ฝาย[ENG.GetAdjective]ไดพิสูจนครั้งแลวครั้งเลาวาพวกเขาจะตอบโตการประทวงดวยกระสุน ดังนั้นจึงตองมียุทธวิธีใหม ยุทธวิธีที่อาบดวยเลือดหากจําเปน"
 RAJ_league_against_gandhism_tt: "เหตุการณความไมสงบจากการแบงแยกดินแดนจะใหการสนับสนุนสงคราม §G5%§! เมื่อเกิดขึ้น สูงสุด §Y+50%§!"
 RAJ_league_against_gandhism_tt_event: "เพิ่มการสนับสนุนสงครามอีก §G+5%§! จากการเขาขาง§Y$RAJ_league_against_gandhism$§!"
 RAJ_mahatma: "มหาตมะ"
 RAJ_mahatma_desc: "มหาตมะ คานธี คือใบหนาของขบวนการเอกราชอยางไมตองสงสัย เราจะรวมกับทานและชวาหะรลาล เนหรู ทลายแอกที่ผูกมัดเราไวกับอังกฤษ"
 RAJ_swadeshi_movement: "ขบวนการสวเทศี"
 RAJ_swadeshi_movement_desc: "สวเทศี หรือการพึ่งพาตนเองโดยไมตองพึ่ง[ENG.GetAdjective] จะปลุกขบวนการเอกราชใหลุกโชนและรักษาความมั่งคั่งของอินเดียไวในอินเดีย"
 RAJ_form_a_federal_court: "จัดตั้งศาลสหพันธ"
 RAJ_form_a_federal_court_desc: "ประชาธิปไตยทุกรูปแบบตองมีศาลสหพันธเพื่อใหทํางานไดและรักษาหลักนิติธรรม เราตองทําใหแนใจวาเราไดรับการพิจารณาตัดสินโดยคนในชาติเดียวกัน ไมใชโดยเหลาเนติบัณฑิตของ[ENG.GetAdjective]"
 RAJ_defense_of_india_act: "พระราชบัญญัติการปองกันอินเดีย"
 RAJ_defense_of_india_act_desc: "ความมั่นคงของ[GetRajName]ถูกคุกคามจากการรุกรานภายนอก [ROOT.GetLeader]ไดประกาศใชพระราชบัญญัติวาดวยมาตรการพิเศษเพื่อรักษาความปลอดภัยและผลประโยชนสาธารณะ รวมถึงเพื่อการปองกันรัฐ[GetRajAdjective]"
 RAJ_a_congress_resurgent: "สภาคองเกรสผงาดอีกครั้ง"
 RAJ_a_congress_resurgent_desc: "สภาคองเกรสแหงชาติไดรับความนิยมและมีกําลังเพิ่มขึ้นอยางรวดเร็ว บัดนี้กลายเปนพลังทางการเมืองที่ไมอาจปฏิเสธได"
 RAJ_khadi_movement: "ขบวนการผาขาดี"
 RAJ_khadi_movement_desc: "ในฐานะสวนหนึ่งของสวเทศี ผาขาดีไดกลายเปนสัญลักษณแหงเอกราช ผาทอมือนี้เปนทั้งทาทีเชิงสัญลักษณแหงการตอตาน และเสื้อผาที่ทอจากผานี้ยังสรางโอกาสทางเศรษฐกิจมากมายแกผูยากไรและผูถูกกดขี่"
 RAJ_boycott_british_made_goods: "ควํ่าบาตรสินคาที่ผลิตในอังกฤษ"
 RAJ_boycott_british_made_goods_desc: "ฝาย[ENG.GetAdjective]สูบเอาวัตถุดิบจาก[GetRajName]ไปแลวขายวัสดุแปรรูปกลับมาใหเราในราคาแพงลิบมานานเกินไปแลว ชาว[RAJ.GetRajAdjective]ควรผลิตสิ่งของเพื่อชาว[RAJ.GetRajAdjective] ไมใชถูกผูยึดครองของเราเองขายของราคาแพงให"
 RAJ_litteracy_effort: "การรณรงคใหรูหนังสือ"
 RAJ_litteracy_effort_desc: "ประชาชนที่ไมไดรับการศึกษาเปรียบเสมือนจิตใจที่เปดโลง ไรประตูและไรผูเฝา การอานออกเปนทักษะสําคัญที่มนุษยทุกคนตองมี ทายที่สุดแลว ใครเลาจะเสียประโยชนจากฝูงแกะที่รูเทาทัน หากไมใชคนเลี้ยงแกะ?"
 RAJ_debt_relief: "การบรรเทาภาระหนี้"
 RAJ_debt_relief_desc: "เปนเวลานานที่ชาว[ENG.GetAdjective]และชาว[GetRajAdjective]ผูมั่งคั่งลอลวงสามัญชนเขาสูกับดักหนี้ จนถึงขั้นที่กลายเปนปญหาเรื้อรัง เราจะผลักดันรัฐบาลทองถิ่นใหบรรเทาภาระของผูคนเหลานี้ที่ติดอยูในระบบอันไมเปนธรรม"
 RAJ_expand_healthcare_facilities: "ขยายสถานพยาบาล"
 RAJ_expand_healthcare_facilities_desc: "การสาธารณสุขใน[GetRajName]ขาดแคลนอยางนาเวทนา โรคบิด อหิวาตกโรค และมาลาเรียระบาดทั่วชนบท ขัดขวางการเติบโต การขยายสถานพยาบาลในทองถิ่นจะชวยตอตานปญหานี้"
 RAJ_indo_centric_curriculum: "หลักสูตรที่มีอินเดียเปนศูนยกลาง"
 RAJ_indo_centric_curriculum_desc: "การศึกษาใน[GetRajName]ยึดโลกทัศนแบบ[ENG.GetAdjective]เปนศูนยกลาง บั่นทอนอัตลักษณ[GetRajAdjective]และลดทอนประวัติศาสตรของเราใหเหลือเพียงประวัติศาสตรแหงการอยูใตอาณัติ เราตองวางระบบการศึกษาบนพื้นฐานอัตลักษณ[GetRajAdjective]และสอนประวัติศาสตรของเราแกเด็ก ๆ"
 RAJ_enrollment_of_dali_children: "การรับเด็กดาลิตเขาเรียน"
 RAJ_enrollment_of_dali_children_desc: "ชาวดาลิต หรือ \"จัณฑาล\" ชนชั้นตํ่าสุดของระบบวรรณะ ใชชีวิตอยูในความยากจนอยางไมมีวันสิ้นสุด ระบบวรรณะซึ่งเปนมลทินของชาติเราจะเริ่มถูกทลายลงไดก็ดวยการรับลูกหลานของพวกเขาเขาโรงเรียนเทานั้น"
 RAJ_local_resistance_to_land_taxes: "การตอตานภาษีที่ดินในทองถิ่น"
 RAJ_local_resistance_to_land_taxes_desc: "รัฐบาลในเดลีไดรับเงินทุนสวนใหญจากภาษีทองถิ่น หากเราสนับสนุนการตอตานการจายภาษีเหลานี้ ก็จะบีบรัดรัฐบาล และขณะเดียวกันก็ทําใหราษฎรไดสวนแบงความมั่งคั่งมากขึ้น"
 RAJ_tenancy_reforms: "การปฏิรูปการเชา"
 RAJ_tenancy_reforms_desc: "พวกนายทุนหนาเลือดผูมั่งคั่งกําลังผูกขาดตลาดที่อยูอาศัย ดันราคาใหสูงขึ้นและกดมาตรฐานการครองชีพใหตํ่าลง พรอมเอาเปรียบสามัญชน สภาคองเกรสจะผลักดันอยางหนักเพื่อการปฏิรูปการเชา โดยกําหนดเพดานคาเชาที่เจาของที่ดินเรียกเก็บได"
 RAJ_quinine: "ควินิน"
 RAJ_quinine_tt: "ปลดล็อกความสามารถ§Yเสบียงพิเศษ§!รุนปรับปรุง\n\nคาอํานาจบัญชาการ: §Y0.15§! (ตอกองพัน)\nระยะเวลา: §Y10 วัน§!\nคูลดาวน: §Y21 วัน§!\n\n§Yเมื่อเปดใช:§!\nการสูญเสียสะสมของกองพล: §G12.0%§!\nการสูญเสียสะสมจากความรอน: §G35.00%§!\nระยะผอนผันเสบียง: §G+240.0 ชั่วโมง§!\nโอกาสเจ็บปวย: §G-100.00%§!\nสงเสบียงใหกองทัพเพียงพอสําหรับ §Y240§! ชั่วโมง"
 RAJ_quinine_desc: "การจัดหาควินินและยาที่คลายกันใหทหารจะทําใหพวกเขาสูรบในสภาพแวดลอมเขตรอนไดโดยไมตองทนทุกขจากมาลาเรีย"
 RAJ_temple_entry_movements: "ขบวนการเขาวัด"
 RAJ_temple_entry_movements_desc: "ระบบจัณฑาลเปนมลทินของประเทศนี้และมีแตจะแบงแยกเรา เพื่อตอสูกับเรื่องนี้ เราจะอนุญาตใหผูคนทุกวรรณะเขาสูศาสนสถานของตน"
 RAJ_freedom_of_the_press: "เสรีภาพของสื่อ"
 RAJ_freedom_of_the_press_desc: "เสรีภาพของสื่อเปนสิ่งจําเปนสําหรับประชาธิปไตยที่เพิ่งตั้งไข หากปราศจากมัน เผด็จการก็รออยูแคเอื้อม"
 RAJ_provincial_autonomy: "สูเสนทางแหงเอกราช"
 RAJ_provincial_autonomy_occupation_law_tt: "ปลดล็อกกฎหมายการยึดครอง §Y$independent_rule$§! และ §Y$princely_subjugation$§! สําหรับรัฐมหาราชา"
 RAJ_provincial_autonomy_desc: "การไดรับอํานาจปกครองตนเองระดับมณฑลเพิ่มเติมจากอังกฤษจะเปนกาวแรกที่สําคัญยิ่งสูเปาหมายสูงสุด นั่นคือเอกราช"
 RAJ_provincial_autonomy_tt: "\nหากตองการหลุดพนโดยสมบูรณผาน§Yทฤษฎีสองชาติ§! เราตองทํา§Yเบงกอลรวม§! หรือ§Yปากีสถานตะวันออก§!ใหสําเร็จ\n\nหากตองการหลุดพนโดยสมบูรณผาน§Yอินเดียรวม§! เราตองทํา§Yรัฐฆราวาส§!ใหสําเร็จ\n\n§Y§!หากตองการหลุดพนโดยสมบูรณผาน§Yสันนิบาตตอตานลัทธิคานธี§! เราตองทํา§Yพวกแดงในเงามืด§! หรือ§Yใหเลือดแกขา แลวขาจะใหอิสรภาพแกเจา§!ใหสําเร็จ"
 RAJ_princely_states_policy: "นโยบายรัฐมหาราชา"
 RAJ_princely_states_policy_desc: "รัฐมหาราชามีหลากหลายรูปแบบและขนาด ตั้งแตไฮเดอราบาดผูทรงอิทธิพลไปจนถึงราชรัฐเล็ก ๆ ในพรมแดนตอนเหนือ เราตองกําหนดนโยบายในการจัดการกับรัฐเหลานี้"
 RAJ_indian_legion: "กองทหารอินเดีย"
 RAJ_indian_legion_desc: "กองทหารอินเดียซึ่งประกอบดวยผูเห็นตางชาวอินเดียในตางแดนภายใตการควบคุมของ[GER.GetName] ไดรับการฝกการรบในทะเลทรายอยางเขมขน เราสามารถใชความเชี่ยวชาญของพวกเขาพัฒนากองกําลังของเราเอง"
 RAJ_the_pakistan_movement: "ขบวนการปากีสถาน"
 RAJ_the_pakistan_movement_desc: "เสียงเรียกรองมาตุภูมิของชาวมุสลิมอยางปากีสถานดังขึ้นเรื่อย ๆ หากการปะทะระหวางชาวฮินดูและชาวมุสลิมยังดําเนินตอไปเชนนี้ การรักษาอินเดียใหเปนหนึ่งเดียวอาจเปนไปไมได"
 RAJ_the_pakistan_movement_tt_1: "จะเริ่มใหมจนกวา:\n§Y-[PAK.GetName]§! เปนอิสระ\n§Y-[PAK.GetName]§! ยอมจํานนแลว\n-เกิดซํ้าครบ §Y5§! ครั้ง\n\nเมื่อสิ้นสุดวงจรชีวิต §Y90 วัน§! ของจิตวิญญาณนี้ เราจะไดรับ:"
 RAJ_the_pakistan_movement_tt_2: "เปนเวลา §Y90§! วัน"
 RAJ_assam_oil_dlc: "นํ้ามันอัสสัม"
 RAJ_assam_oil_dlc_desc: "เมื่อไมนานมานี้เราไดคนพบแหลงนํ้ามันขนาดใหญในรัฐอัสสัม ดวยการกอตั้งบริษัทนํ้ามันของรัฐและสรางแทนขุดเจาะนํ้ามันในอัสสัม เราจะพัฒนาเศรษฐกิจไดอยางมาก"
 RAJ_tata_steel_dlc: "ทาทาสตีล"
 RAJ_tata_steel_dlc_desc: "$RAJ_tata_steel_desc$"
 RAJ_incorporation_of_the_east_india_company: "การจดทะเบียนจัดตั้งบริษัทอินเดียตะวันออก"
 RAJ_incorporation_of_the_east_india_company_desc: "หลังความตกตะลึงจากภาวะเศรษฐกิจตกตํ่าครั้งใหญและเสียงเรียกรองเอกราชที่ดังขึ้นเรื่อย ๆ ก็ชัดเจนวาราชบัลลังก[ENG.GetAdjective]ไมอาจแบกรับภาระการปกครองอินเดียไดอีกตอไป เรื่องนี้อาจนําไปสูความไมมั่นคงชั่วคราว แตสถานะเดิมไมอาจดํารงอยูได"
 RAJ_incorporation_of_the_east_india_company_tt: "§Yบริติชราช§! จะถูกแบงระหวาง§Yบริษัทอินเดียตะวันออก§!และสวนที่เหลือของ§Yอินเดีย§!"
 RAJ_special_economic_zones: "เขตเศรษฐกิจพิเศษ"
 RAJ_special_economic_zones_desc: "เราจะจัดตั้งเขตเศรษฐกิจพิเศษในประเทศเพื่อใหบริษัทตาง ๆ ลงทุนไดงายขึ้น และเพื่อลดภาระภาษีของบริษัทเหลานั้น"
 RAJ_seek_intial_funding: "แสวงหาเงินทุนเริ่มตน"
 RAJ_seek_intial_funding_desc: "เพื่อวางรากฐานสําหรับความทะเยอทะยานอันยิ่งใหญ เราตองไดทุนจากนักลงทุน[ENG.GetAdjective] เงินทุนเริ่มตนของพวกเขาจะเปนประกายไฟที่จุดเครื่องยนตเศรษฐกิจของเรา"
 RAJ_seek_intial_funding_tt: "เพิ่มชองกอสราง §G3§! ชอง\nเพิ่ม§Yโรงงานพลเรือน§! §G3§! แหงในเมืองหลวงของเราเมื่อทํา §Y$RAJ_incorporation_of_the_east_india_company$§! สําเร็จ"
 RAJ_seek_intial_funding_unlock_tt: "ปลดล็อกแผนยุทธศาสตร §Y$RAJ_seek_intial_funding$§!\n\n"
 has_paid_initial_funding: "ไดจายเงินปนผลใหนักลงทุนแลว"
 RAJ_princely_autonomy: "อํานาจปกครองตนเองของรัฐมหาราชา"
 RAJ_princely_autonomy_tt: "เมื่อปลดปลอยรัฐมหาราชาเปนรัฐหุนเชิด จะเพิ่ม:"
 RAJ_princely_autonomy_desc: "อนุทวีปกําลังสูญเสียเสถียรภาพลงทีละนอย เราจะใชเจาผูครองรัฐทองถิ่นในการสรางการควบคุม พวกเขาจะไดอํานาจทองถิ่นแตเพียงในนาม และเราจะไดเก็บเกี่ยวผลประโยชน ตราบใดที่พวกเขาจายใหเรา"
 RAJ_funnel_british_investments_into_princely_states: "อัดฉีดการลงทุนสูรัฐมหาราชา"
 RAJ_funnel_british_investments_into_princely_states_tt: "รัฐในอารักขาทุกแหงที่อยูในอนุทวีปอินเดียจะไดรับ§Yโรงงานพลเรือน§! §G1§! แหง และชองกอสราง §G3§! ชอง\nรัฐในอารักขาที่ยังไมไดรับการปลดปลอยจะไดรับโบนัสเมื่อไดรับการปลดปลอย"
 RAJ_funnel_british_investments_into_princely_states_desc: "ราชบัลลังกกําหนดใหการลงทุนทุกอยางในบริษัทตองใชจายภายในอินเดีย แตราชบัลลังกไมไดระบุวาตองใชจายภายในบริษัท"
 RAJ_demobilize: "ปลดประจําการ"
 RAJ_demobilize_desc: "หนึ่งในขอกําหนดสําคัญจากรัฐบาลคือเราตองปลดประจําการกองทัพ โดยคงไวเพียงกองกําลังรักษาสันติภาพโครงราง หรือพวกเขากังวลวากองทัพของเราจะเติบโตจนใหญกวากองทัพของพวกเขา?"
 RAJ_form_a_police_force: "จัดตั้งกองกําลังรักษาความปลอดภัย"
 RAJ_form_a_police_force_desc: "แมขอจํากัดจะหามไมใหเรามีกองทัพอยางเปนทางการ แตเราไดรับอนุญาตใหจัดตั้งและเสริมยุทโธปกรณใหกองกําลังรักษาความปลอดภัยภายใตขออางของการรักษาความสงบ นี่เปนกาวสําคัญในการปกปองผลประโยชนของเรา"
 RAJ_a_private_military: "กองทัพเอกชน"
 RAJ_a_private_military_tt_1: "สรางกองพลกองกําลังนอกแบบที่มีกําลังพลและยุทโธปกรณครบถวน\n\nการสงกองพลไปเปนอาสาสมัครจะให§Yโรงงานพลเรือน§!นอกพื้นที่ §G1§! แหง เปนเวลา §Y365§! วัน หากสงไปยังประเทศที่เราไมเคยสงอาสาสมัครไปมากอน\nการสงอาสาสมัครชุดใหมไปยังประเทศเดิมหลังผานไป §Y540§! วัน จะไดรับโรงงานอีกครั้ง\n\nโรงงานเหลานี้ไมนับรวมใน§Yภาษี§!"
 RAJ_a_private_military_desc: "การเปลี่ยนตํารวจทองถิ่นของเราใหเปนกองทัพเอกชนนั้นทําไดงาย ในทางเทคนิคแลวพวกเขาจะไมใชสวนหนึ่งของกองทัพใด แตไดรับคาจางจากบริษัทโดยตรง ซึ่งสอดคลองกับขอกําหนดของรัฐบาล"
 RAJ_headhunt_army_personell: "ซื้อตัวบุคลากรทางทหาร"
 RAJ_headhunt_army_personell_desc: "มีดาวรุงจากกองทัพเดิมจํานวนมากที่ตกงานและกําลังหางานทํา เราสามารถเสนอขอเสนอที่ดีกวาที่รัฐบาลใหได"
 RAJ_lobby_for_increased_policing_responsibilities: "ล็อบบี้เพื่อเพิ่มหนาที่ดานการรักษาความสงบ"
 RAJ_lobby_for_increased_policing_responsibilities_desc: "โลกไมใชที่อันเงียบสงบอยางที่เคยเปนอีกตอไป ความตึงเครียดที่เพิ่มขึ้นทั้งภายในและภายนอกทําใหเรามีอํานาจเพิ่มเติมในการปกปองทรัพยสินของบริษัท เราจะล็อบบี้เพื่อเพิ่มงบประมาณบริษัททหารเอกชน รัฐบาลยอมเห็นดวยกับเหตุผล และหากไมเห็นดวย ทุกคนก็มีราคาของตัวเอง"
 RAJ_circuvment_demobilization_restrictions: "หลบเลี่ยงขอจํากัด"
 RAJ_circuvment_demobilization_restrictions_desc: "รัฐบาลยังคงกําหนดเพดานจํานวนคนที่เราระดมไดอยางเขมงวด ราชบัลลังกคงหวาดกลัวกองทัพที่ไมอยูใตการควบคุมของตนเปนอยางยิ่ง ไมเปนไร ยังมีวิธีหลบเลี่ยงขอจํากัดเหลานี้ ไมวาจะดวยการติดสินบน หรือการไมนับพนักงานกลุมศาสนาบางกลุมเปนสวนหนึ่งของกองกําลังติดอาวุธ"
 RAJ_manipulate_army_statistics: "บิดเบือนสถิติกองทัพ"
 RAJ_manipulate_army_statistics_tt: "สรางกองพลกองกําลังนอกแบบที่มีกําลังพลและยุทโธปกรณครบถวน" 
 RAJ_manipulate_army_statistics_desc: "ราชบัลลังกระแวงวาบริษัททหารเอกชนของเราจะเติบโตใหญและทรงอิทธิพลเกินไป จนอาจทาทายกองทัพประจําการ ก็มีวิธีที่จะทําใหผูตรวจสอบของรัฐบาลจมอยูกับตัวเลขและเบาะแสปลอม"
 RAJ_just_good_business: "ธุรกิจลวน ๆ"
 RAJ_just_good_business_desc: "เราไมไดมีอะไรขัดแยงกับเพื่อนรวมงานทางตะวันออกจริง ๆ หรอก แคพวกเขามีทรัพยากรที่เราตองการ มันก็แคธุรกิจลวน ๆ"
 RAJ_crush_the_anathema: "บดขยี้สิ่งอัปมงคล"
 RAJ_crush_the_anathema_desc: "ลัทธิคอมมิวนิสตคือสิ่งอัปมงคลของธุรกิจที่ดี เงินทําใหโลกหมุน และโลกที่ปกครองโดยคอมมิวนิสตจะนําไปสูความชะงักงัน เราตองเผาความเนาเฟะนี้ทิ้งไป"
 RAJ_nothing_personal: "ไมมีอะไรสวนตัว"
 RAJ_nothing_personal_tt: "สรางเปาหมายสงครามตอ§Y[ENG.GetNameDef]§!และ§Yประเทศในเครือจักรภพ§!"
 RAJ_nothing_personal_desc: "ราชบัลลังกบังคับเจตจํานงเหนือเรามานานพอแลว ขัดขวางการเติบโตของเราดวยมาตรการลาสมัย ไมมีอะไรสวนตัว แตรัฐบาลจะเปนเหตุใหเราเติบโตตํ่ากวามาตรฐานไมได"
 RAJ_bombay_trade_port: "ทาเรือการคาบอมเบย"
 RAJ_bombay_trade_port_desc: "บอมเบยมีศักยภาพที่จะกลายเปนทาเรือการคาระดับโลก รองรับการนําเขาและสงออกสินคาปริมาณมหาศาล สิ่งที่ตองการมีเพียงการลงทุนขยายสิ่งอํานวยความสะดวกของทาเรือ"
 RAJ_take_in_british_naval_experts: "รับผูเชี่ยวชาญดานนาวีชาว[ENG.GetAdjective]"
 RAJ_take_in_british_naval_experts_desc: "เรามีผูเชี่ยวชาญดานนาวีที่ดีที่สุดคนหนึ่งของโลกอยูที่สหราชอาณาจักร การพาบางคนมาที่นี่ยอมทําไดไมยาก"
 RAJ_the_need_for_a_mercantile_navy: "ความจําเปนของกองเรือพาณิชย"
 RAJ_the_need_for_a_mercantile_navy_desc: "การคาทางทะเลคือชองทางการคาที่สําคัญที่สุดทั่วโลก เราตองมีกองทัพเรือที่สามารถขนสงสินคาเหลานี้และปกปองสินคาได"
 RAJ_trade_route_protection: "การคุมครองเสนทางการคา"
 RAJ_trade_route_protection_desc: "ทางตะวันออกและตะวันตก มหาอํานาจที่เปนปฏิปกษกําลังกอตัว เราตองอยูในฐานะที่สามารถปองปรามผูใดก็ตามที่คิดจะยึดสินคาที่สัญจรไปมาในนานนํ้าของเรา"
 RAJ_procure_the_guns: "ปนใหญแหงวรุณ"
 RAJ_procure_the_guns_desc: "เราตองมีอํานาจปองปรามที่ใหญพอจะปกปองเสนทางของเรา และอํานาจปองปรามที่ใหญพอตองใชปนใหญ ปนที่ใหญมาก ๆ"
 RAJ_procure_the_task_force: "หมูเรือเฉพาะกิจแหงวรุณ"
 RAJ_procure_the_task_force_desc: "แมแตเรือที่ใหญที่สุดก็ยังตองมีเรือคุมกันเพื่อกําบังจากเรือขาศึกอยางเพียงพอ ดวยการสรางหมูเรือเฉพาะกิจที่แข็งแกรง เราจะทําใหเรือหลักของเราบรรลุภารกิจหลักได"
 RAJ_procure_the_armor: "เกราะแหงวรุณ"
 RAJ_procure_the_armor_desc: "วรุณตองการเกราะหนา หนามาก ๆ การทดลองสรางตนแบบบนโครงการที่ราคาถูกกวาเพื่อควบคุมตนทุนจึงเปนสิ่งจําเปน"
 RAJ_institutional_money_laundering: "การฟอกเงินเชิงสถาบัน"
 RAJ_institutional_money_laundering_desc: "นักลงทุนไมจําเปนตองรูวาเงินไปอยูที่ไหนจริง ๆ ใชไหม? เปาหมายของเรา ไมสิ หนาที่ของเราคือการทํากําไรสูงสุดไมวาจะตองแลกดวยอะไรไมใชหรือ? แลวถาจะตองฉอโกงสักนิดจะเปนไรไป? พวกเขาไมมีวันรูหรอก"
 RAJ_institutional_money_laundering_tt: ""
 RAJ_appoint_a_c_suite: "แตงตั้งคณะผูบริหารระดับสูง"
 RAJ_appoint_a_c_suite_desc: "ผูนําองคกรที่แข็งแกรงเปนสิ่งจําเปนตอความสําเร็จของเรา ดวยการรวบรวมทีมผูบริหารที่มีความสามารถ เราจะมีการจัดการที่มีประสิทธิภาพ วิสัยทัศนเชิงกลยุทธ และการเติบโตอยางสมํ่าเสมอ"
 RAJ_company_bonuses: "โบนัสของบริษัท"
 RAJ_company_bonuses_desc: "เราจะผูกผลงานเขากับโบนัสที่อาจไดรับเพื่อเพิ่มประสิทธิภาพทั่วทั้งบริษัท"
 RAJ_creative_accounting: "การบัญชีเชิงสรางสรรค"
 RAJ_creative_accounting_desc: "ดวยเทคนิคการบัญชีเชิงสรางสรรคบางอยาง เราสามารถเสกกําไรสวนหนึ่งใหหายวับไปได หรืออยางนอยก็เปนสิ่งที่เจาหนาที่ภาษีจะเชื่อ"
 RAJ_privatized_healthcare: "การสาธารณสุขแบบเอกชน"
 RAJ_privatized_healthcare_desc: "เสียงเรียกรองโครงการสาธารณสุขแบบคอมมิวนิสตตองถูกจํากัดทั่วดินแดนในครอบครองของเรา การรักษาพยาบาลจะมอบใหแกผูที่สมควรไดรับตามกลไกมือที่มองไมเห็นของตลาด"
 RAJ_arrest_congress_leaders: "จับกุมผูนําสภาคองเกรส"
 RAJ_arrest_congress_leaders_desc: "ผูนําสภาคองเกรสไมยอมปรับตัวเขากับความเปนจริงใหมของการปกครองโดยบริษัท พวกเขายังคงตอตานและกอความวุนวายทุกครั้งที่มีโอกาส เราตองกําจัดพวกปลุกระดมกอนที่มันจะลุกลาม"
 RAJ_union_busting: "ทลายสหภาพแรงงาน"
 RAJ_union_busting_desc: "สหภาพแรงงานเปนโรครายตอนวัตกรรมและความกาวหนาตามความสามารถ ไมไดชวยอะไรคนงานเลยและทําใหบริษัทจมอยูกับระเบียบราชการ จงทําลายวาระคอมมิวนิสตนี้กอนที่มันจะลุกลาม"
 RAJ_night_shifts: "กะกลางคืน"
 RAJ_night_shifts_desc: "การเพิ่มกะกลางคืนจะเพิ่มขีดความสามารถในการดําเนินงานและเรงการผลิต ตนทุนที่เพิ่มขึ้นเปนราคาเพียงเล็กนอยที่ตองจายเพื่อประสิทธิภาพตลอด 24 ชั่วโมง"
 RAJ_legalize_the_opium_trade: "ทําใหการคาฝนถูกกฎหมาย"
 RAJ_legalize_the_opium_trade_desc: "แมจะเปนที่ถกเถียง แตการทําใหฝนถูกกฎหมายก็ใหคํามั่นถึงผลประโยชนทางเศรษฐกิจมหาศาล ดวยการควบคุมการคาฝน เราจะเปลี่ยนอบายมุขใหเปนหลักสําคัญที่ทํากําไรงามของยุทธศาสตรทางการเงินของเรา"
 RAJ_force_china_to_accept_opium_trade: "สงครามฝนครั้งที่สาม"
 RAJ_force_china_to_accept_opium_trade_tt: "ตลาดฝนทั่วโลกจะปรากฏขึ้น นายพลบางคนอาจชอบเรื่องนี้มากไปหนอย..."
 RAJ_force_china_to_accept_opium_trade_desc: "[CHI.GetName]พยายามควบคุมการคาฝนของตน ซึ่งขัดแยงโดยตรงกับเปาหมายการเติบโตของเรา เราตองทําใหพวกเขาเห็นความผิดพลาดของตน"
 RAJ_new_economic_policy: "นโยบายเศรษฐกิจใหม"
 RAJ_new_economic_policy_desc: "เราจะยึดแบบจําลองที่สงเสริมการลงทุนและการเติบโตของวิสาหกิจ ดวยภาษีตํ่าและนโยบายที่เอื้อตอธุรกิจ"
 RAJ_phantom_armies: "กองทัพผี"
 RAJ_phantom_armies_desc: "หากเราเพิ่มตัวเลขบุคลากรทางทหารที่จางไวในงบดุลใหสูงเกินจริง เราก็หลอกสํานักงานภาษีได"
 RAJ_corporate_domination: "การครอบงําโดยบริษัท"
 RAJ_corporate_domination_desc: "ขณะที่เรารวบอํานาจควบคุมอนุทวีปไดมั่นคงขึ้น เราก็ครอบงําภาคเอกชนและภาครัฐไดมากขึ้นเรื่อย ๆ ดวยเปาหมายในการควบคุมโดยสมบูรณ ไมวาทางตรงหรือทางออม เราจะเพิ่มผลิตภาพไดในทุกวิสาหกิจ"
 RAJ_restrictive_administration_budget: "งบประมาณบริหารแบบเขมงวด"
 RAJ_restrictive_administration_budget_desc: "เพื่อรักษาวินัยทางการคลัง คาใชจายที่ไมจําเปนทั้งหมดตองถูกตัดทิ้ง ประสิทธิภาพเรียกรองใหเรามุงทรัพยากรไปยังจุดที่ใหผลตอบแทนที่วัดได"
 RAJ_open_up_new_markets: "เปดตลาดใหม"
 RAJ_open_up_new_markets_desc: "เราเสี่ยงที่ตลาดปจจุบันจะอิ่มตัวในอีกไมกี่ปขางหนา เวนแตเราจะใชมาตรการเด็ดขาดในการขยายตลาด ดังนั้นเราจะเขาครอบครองดินแดนเพื่อนบานแบบไมเปนมิตรเสียบาง"
 RAJ_hostile_takeover: "การเขาซื้อกิจการแบบไมเปนมิตร"
 RAJ_hostile_takeover_tt: "ปลดล็อกการตัดสินใจเพื่อซื้อรัฐดวย§Yโรงงานพลเรือน§! รัฐที่เราครอบครองตั้งแตเริ่มตนจะไดรับสวนลดเมื่อซื้อ"
 RAJ_hostile_takeover_desc: "ทุกสิ่งซื้อได ทุกสิ่ง มันเปนแคเรื่องของราคา และวาคนคนหนึ่งยอมตํ่าลงไดแคไหน"
 RAJ_shareholder_democracy: "ประชาธิปไตยของผูถือหุน"
 RAJ_shareholder_democracy_desc: "อํานาจนิติบัญญัติของประเทศอยูที่บริษัท ทวาเพียงในนามเทานั้น ผูพิพากษาและสภานิติบัญญัติลวนอยูในบัญชีเงินเดือนของเรา ทําใหเราผานกฎหมายที่เปนคุณไดอยางงายดายและแตกแยกฝายคาน"
 RAJ_debt_manipulation: "การบิดเบือนหนี้"
 RAJ_debt_manipulation_desc: "เราสามารถใชหนี้ที่มีอยูสรางผลขาดทุนปลอม ซึ่งหมายความวาเราจะเสียภาษีนอยลงและสะสมกําไรสวนเกินได"
 RAJ_productivity_mandate: "คําสั่งดานผลิตภาพ"
 RAJ_productivity_mandate_desc: "ดวยพันธะตอนักลงทุน เราจําตองเพิ่มผลผลิตสูงสุดในทุกภาคสวน ผลิตภาพไมใชแคเปาหมายอีกตอไป แตเปนคําสั่ง และตองบรรลุใหไดไมวาจะตองแลกดวยอะไร"
 RAJ_lowest_bigger_construction: "การกอสรางแบบลดตนทุน"
 RAJ_lowest_bigger_construction_desc: "เราควรเลือกผูเสนอราคาตํ่าสุดเสมอเพื่อควบคุมตนทุนการกอสราง"
 RAJ_water_privatization: "การแปรรูปกิจการนํ้า"
 RAJ_water_privatization_desc: "เราจะรวมเปนหุนสวนรัฐ-เอกชนกับผูจัดหานํ้าในทองถิ่น เพื่อปรับปรุงประสิทธิภาพและคุณภาพการใหบริการ"
 RAJ_expand_tax_loopholes: "ขยายชองโหวทางภาษี"
 RAJ_expand_tax_loopholes_desc: "ดวยการใชชองวางในประมวลรัษฎากร เราสามารถลดภาระของเราอยางถูกกฎหมาย และนําเงินที่ประหยัดไดไปลงทุนขยายกิจการตอ ทายที่สุดแลว ประสิทธิภาพเริ่มตนที่งบดุล"
 RAJ_land_grab: "การจัดหาที่ดิน"
 RAJ_land_grab_desc: "เพื่อตอบสนองความตองการของการพัฒนาอุตสาหกรรมอยางรวดเร็ว เราตองจัดหาและเปลี่ยนการใชประโยชนที่ดินทั่วอนุทวีป การขยายตัวไมเปดชองใหลังเลเมื่อความกาวหนาตองมากอน"
 RAJ_deforestation: "เชื้อไฟ"
 RAJ_deforestation_desc: "ไฟขับเคลื่อนอุตสาหกรรม ไฟตองการไมและถานหิน และเรามีอยูมากมาย แลวทําไมจะไมใชละ?"
 RAJ_agricultural_cooperatives: "สหกรณการเกษตร"
 RAJ_agricultural_cooperatives_tt: "ไดรับ§Yโครงสรางพื้นฐาน§! §G1§! ระดับในทุกรัฐที่ครอบครองซึ่งมี§Yโรงงานพลเรือน§!อยางนอย 4 แหง\nไดรับ§Yโรงงานพลเรือน§! §G1§! แหง ทุก ๆ §Yโครงสรางพื้นฐาน§! 2 ระดับที่ไดรับจากแผนยุทธศาสตรนี้"
 RAJ_agricultural_cooperatives_desc: "สหกรณการเกษตรที่มีเกษตรกรหลายรายเปนเจาของคือกุญแจสูความยั่งยืน การพึ่งพาตนเอง และการเสริมพลัง"
 RAJ_tea_exports: "การสงออกชา"
 RAJ_tea_exports_tt: "§Yขยายไดสูงสุด 5 ครั้ง§!"
 RAJ_tea_exports_tt_2: "\nเมื่อไดรับเอกราช จะลบ §Y$idea_RAJ_tea_exports$§! และ"
 RAJ_tea_exports_desc: "ชาไดกลายเปนสินคาสงออกสําคัญไปทั่วโลก และเปนหลักสําคัญในชีวิตของชาวอินเดียจํานวนมาก"
 RAJ_cottage_industries: "อุตสาหกรรมในครัวเรือน"
 RAJ_cottage_industries_desc: "ธุรกิจและการผลิตที่เกิดขึ้นในบานของผูคนเปนทางเลือกที่ใชไดจริงแทนอุตสาหกรรมหนัก และทําใหผูคนรูสึกถึงความเปนอิสระ"
 RAJ_sikh_religious_guarantees: "การรับประกันทางศาสนาแกชาวซิกข"
 RAJ_sikh_religious_guarantees_desc: "ชาวซิกขเปนชนกลุมนอยทางศาสนาที่สําคัญและเปนนักรบผูดุดัน เราตองเอาใจพวกเขาดวยการรับประกันสิทธิทางศาสนา"
 RAJ_punjab_autonomy: "อํานาจปกครองตนเองของปญจาบ"
 RAJ_punjab_autonomy_desc: "ปญจาบมีความสําคัญอยางลึกซึ้งตอชาวซิกข และดวยการมอบอํานาจปกครองตนเองในทองถิ่น เราจะไดรับความไววางใจจากพวกเขา"
 RAJ_handloom_weaving: "การทอผาดวยกี่มือ"
 RAJ_handloom_weaving_desc: "การทอผาดวยกี่มือไดกลายเปนสัญลักษณของขนบธรรมเนียมและเอกราชในอนุทวีป และยังสรางโอกาสในการทํางานใหแกผูผลิตในทองถิ่น"
 RAJ_lahore_resolution: "มติละฮอร"
 RAJ_lahore_resolution_desc: "ชาวมุสลิมซึ่งเปนชนกลุมนอยในประเทศไดรับรองมติละฮอร เรียกรองมาตุภูมิของตนเอง นั่นคือปากีสถาน"
 RAJ_united_bengal: "เบงกอลรวม"
 RAJ_united_bengal_tt: "§Y[BAN.GetName]§! จะเปนอิสระเมื่อมีการแบงแยก"
 RAJ_united_bengal_desc: "การแยกปากีสถานออกเปนสองประเทศ คือเบงกอลและปากีสถาน เปนเรื่องสมเหตุสมผลเทานั้น รัฐบาลในปากีสถานไมอาจปกครองดินแดนบังกลาเทศที่อยูหางไกลไดอยางเหมาะสม"
 RAJ_eastern_pakistan: "ปากีสถานตะวันออก"
 RAJ_eastern_pakistan_tt: "§Y[BAN.GetName]§! จะเปนของ§Y[PAK.GetName]§!เมื่อมีการแบงแยก"
 RAJ_eastern_pakistan_desc: "บังกลาเทศจะกลายเปนปากีสถานตะวันออก และชาวมุสลิมทั้งหมดจะไดรับการปกครองภายใตธงผืนเดียว"
 RAJ_partition_preparation: "เตรียมการแบงแยก"
 RAJ_partition_preparation_tt: "§Yจะลดผลกระทบของการแบงแยกเมื่อเกิดขึ้น§! หากมีการเตรียมการ เราจะไดรับ: \n"
 RAJ_partition_preparation_tt_2: "และหากไมมี เราจะไดรับ: \n"
 RAJ_partition_preparation_desc: "เราตองเตรียมพรอมสําหรับการแบงแยก มิฉะนั้นเราจะตองเผชิญความโกลาหลที่จะเกิดขึ้นเมื่อผูคนนับลานอพยพ"
 RAJ_indian_independence_act: "พระราชบัญญัติเอกราชอินเดีย"
 RAJ_indian_independence_act_desc: "มีชวงเวลาหนึ่งมาถึง ซึ่งนาน ๆ ครั้งจะมาถึงในประวัติศาสตร เมื่อเรากาวออกจากสิ่งเกาสูสิ่งใหม เมื่อยุคสมัยหนึ่งสิ้นสุดลง และเมื่อจิตวิญญาณของชาติที่ถูกกดขี่มาเนิ่นนานไดเปลงเสียงออกมา"
 RAJ_tryst_with_destiny: "นัดหมายกับโชคชะตา"
 RAJ_tryst_with_destiny_desc: "เมื่อหลายปกอน เราไดนัดหมายกับโชคชะตาไว และบัดนี้ถึงเวลาที่เราจะทําตามคํามั่นนั้น แมไมทั้งหมดหรือครบถวน แตก็เปนสวนใหญ เมื่อนาฬกาตีบอกเวลาเที่ยงคืน ขณะที่โลกหลับใหล อินเดียจะตื่นขึ้นสูชีวิตและอิสรภาพ"
 RAJ_india_united: "อินเดียรวม"
 RAJ_india_united_tt: "§Yอินเดียจะคงความเปนหนึ่งเดียวระหวางการแบงแยกและไมแตกออก§!"
 RAJ_india_united_desc: "เราคือมุสลิม ฮินดู คริสเตียน ยิว เราทุกคนคืออินเดีย"
 RAJ_power_sharing_agreement: "ขอตกลงแบงปนอํานาจ"
 RAJ_power_sharing_agreement_desc: "สันนิบาตมุสลิมมองเราดวยความระแวง หวาดกลัววาจะเกิดอะไรขึ้นกับชาวมุสลิมในอินเดียที่ชาวฮินดูเปนใหญ เราจะทําขอตกลงกับพวกเขาเพื่อแบงปนอํานาจอยางเทาเทียม"
 RAJ_cabinet_mission_plan: "แผนคณะผูแทนคณะรัฐมนตรี"
 RAJ_cabinet_mission_plan_desc: "ดวยแนวรวมของทั้งชาวมุสลิมและชาวฮินดู เราพรอมที่จะเผชิญหนากับคณะผูแทนที่รัฐบาล[ENG.GetAdjective]สงมา"
 RAJ_inclusive_nationalism: "ชาตินิยมที่ไมกีดกัน"
 RAJ_inclusive_nationalism_desc: "ชาตินิยมและความภาคภูมิใจในประเทศของตนไมจําเปนตองเปนสิ่งเลวราย ตราบใดที่เราปลูกฝงใหมันเปดกวางสําหรับทุกคน สายสัมพันธจะไมขาดสะบั้นหากเราทุกคนรักชาติเหมือนกัน"
 RAJ_a_secular_state: "รัฐฆราวาส"
 RAJ_a_secular_state_desc: "อินเดียเปนประเทศแหงศาสนา แตสิ่งสําคัญคือรัฐเองตองเปนฆราวาส เพื่อขจัดขอสงสัยใด ๆ วาอาจมีอคติตอชนกลุมนอย"
 RAJ_a_permanent_muslim_governmental_seat: "ที่นั่งถาวรในรัฐบาลสําหรับชาวมุสลิม"
 RAJ_a_permanent_muslim_governmental_seat_desc: "ชาวมุสลิมเปนชนกลุมนอยขนาดใหญในประเทศของเรา และเพื่อคลายความวิตกที่พวกเขาอาจมีตออินเดียที่เปนหนึ่งเดียว เราจะมอบที่นั่งถาวรในรัฐบาลใหแกพวกเขา"
 RAJ_pledge_for_the_allies: "ปฏิญาณตอฝายสัมพันธมิตร"
 RAJ_pledge_for_the_allies_desc: "ดวยลัทธิฟาสซิสตและคอมมิวนิสตที่กําลังผงาดขึ้นทั่วโลก อินเดียไมอาจยืนหยัดตามลําพัง [ENG.GetName]อาจไมเคยเปนมิตรของอินเดีย แตก็ชัดเจนวาฝายอื่นคือศัตรูของเรา"
 RAJ_indian_prosperity_sphere: "วงไพบูลยอินเดีย"
 RAJ_sideline_the_conflict: "ถอยหางจากความขัดแยง"
 RAJ_sideline_the_conflict_desc: "ไมชัดเจนวาทําไม[ROOT.GetName]จะตองทนทุกขเพราะการตัดสินใจผิดพลาดและการรุกรานดินแดนของผูอื่น เราตองมุงเนนภายใน ไมใชภายนอก"
 RAJ_india_indivisible: "อินเดียที่แบงแยกมิได"
 RAJ_india_indivisible_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐ§Yอินเดีย§! §Yปากีสถาน§! และ§Yบังกลาเทศ§!เปนดินแดนหลัก"
 RAJ_india_indivisible_desc: "ดินแดนของเรายังคงเต็มไปดวยความไมสงบและความขัดแยง เราตองรวมมือกันเพื่อทําให[ROOT.GetName]เปนหนึ่งเดียวอยางสมบูรณ"
 RAJ_preamble_to_the_constitution_of_india: "อารัมภบทแหงรัฐธรรมนูญ[GetRajName]"
 RAJ_preamble_to_the_constitution_of_india_desc: "เรา ประชาชนแหง[GetRajName] ไดตั้งมั่นอยางแนวแนที่จะสถาปนา[GetRajName]ใหเปนสาธารณรัฐประชาธิปไตยสังคมนิยมฆราวาสที่มีอธิปไตย และใหหลักประกันแกพลเมืองทั้งปวงซึ่งความยุติธรรม เสรีภาพ ความเสมอภาค ตลอดจนสงเสริมภราดรภาพในหมูพลเมืองทั้งหลาย ณ สภารางรัฐธรรมนูญของเราในวันนี้"
 RAJ_an_economy_unbound: "เศรษฐกิจไรพันธนาการ"
 RAJ_an_economy_unbound_desc: "เมื่อไมถูกเจาอาณานิคมกดทับอีกตอไป เศรษฐกิจของเราก็สามารถเบงบานไดในที่สุด หลุดพนจากพันธะเดิมที่เคยผูกมัดไว"
 RAJ_annex_goa: "ผนวกกัว"
 RAJ_annex_goa_desc: "กัวเปนของอินเดียซึ่งครั้งหนึ่งเคยสูญเสียใหแกกองกําลังจักรวรรดินิยม และเห็นไดชัดวา[POR.GetName]ไมอยูในฐานะที่จะปกปองมันได เราตองแกไขความอยุติธรรมทางประวัติศาสตรครั้งนี้"
 RAJ_a_tiger_uncained: "พยัคฆหลุดพันธนาการ"
 RAJ_a_tiger_uncained_desc: "เราถูกจักรวรรดิตาง ๆ กดขี่มานานเกินไป ถูกลามไวใตแอกแหงการปกครองของจักรวรรดิ ไมมีอีกแลว ดุจพยัคฆที่ในที่สุดก็หลุดพนจากผูจับกุม มันจะไมยอมถูกกดขี่อีกเปนอันขาด"
 RAJ_suppress_paramilitary_organizations: "ปราบปรามองคกรกึ่งทหาร"
 RAJ_suppress_paramilitary_organizations_desc: "ยังมีกลุมกึ่งทหารกระจัดกระจายอยูใน[GetRajName] เราตองถอนรากถอนโคนพวกมันโดยเร็ว เพราะเมื่อวัชพืชหยั่งรากลึกลงในดินแลว ก็ยากที่จะถอนออก"
 RAJ_defend_burma: "ปกปองพมา"
 RAJ_defend_burma_desc: "[BRM.GetName]ทําหนาที่เปนปราการตานการรุกรานของ[JAP.GetName] การเสริมสถานะของพวกเขายอมเปนประโยชนตอเราเทานั้น"
 RAJ_mixed_economy: "เศรษฐกิจแบบผสม"
 RAJ_mixed_economy_tt: "ไดรับทรัพยากร §G+3§! สําหรับ§Yเทคโนโลยีการขุดคน§!แตละรายการที่วิจัยแลว ในทุกรัฐเริ่มตนที่มีทรัพยากรมากกวา 6 หนวย"
 RAJ_mixed_economy_desc: "เรามีทรัพยากรธรรมชาติมากมาย การกระจายไปสูการทําเหมืองแรจะเสริมสรางการพึ่งพาตนเองของเรา"
 RAJ_land_reforms: "ปฏิรูปที่ดิน"
 RAJ_land_reforms_desc: "การใหประชาชนไดใชประโยชนจากที่ดินที่ตนมีมากขึ้น จะยกพวกเขาใหพนจากความยากไร"
 RAJ_education_efforts: "สงเสริมการศึกษา"
 RAJ_education_efforts_2: "$RAJ_education_efforts$"
 RAJ_education_efforts_desc: "อัตราการรูหนังสือใน[ROOT.GetName]ยังคงตํ่า เราตองเพิ่มงบประมาณดานการศึกษาอยางมหาศาลเพื่อไลตามมหาอํานาจใหทัน"
 RAJ_education_efforts_2_desc: "$RAJ_education_efforts_desc$"
 RAJ_fight_malnutrition: "ตอสูกับภาวะทุพโภชนาการ"
 RAJ_attract_scientists: "ดึงดูดนักวิทยาศาสตร"
 RAJ_attract_scientists_desc: "ดวยความมั่งคั่งมหาศาล บัดนี้เราสามารถดึงดูดนักวิทยาศาสตรชั้นยอดจากทั่วทุกมุมโลกได"
 RAJ_fight_malnutrition_desc: "เราตองดําเนินแผนการอยางกวางขวางเพื่อตอสูกับภาวะทุพโภชนาการในหมูประชาชน"
 RAJ_import_substitution_industrialisation: "อุตสาหกรรมทดแทนการนําเขา"
 RAJ_import_substitution_industrialisation_desc: "เมื่อใดที่ทําได เราควรทดแทนสินคานําเขาดวยสินคาภายในประเทศ โดยชวยแบกรับตนทุนการผลิต"
 RAJ_i_am_death: "ขาคือมรณะ"
 RAJ_i_am_death_desc: "ผูนําของเราซึ่งตกอยูในภวังคลึกหลังรอดพนจากการลอบสังหาร ไดฟนคืนสติแลว ขณะใครครวญถึงความโหดรายที่ตนเผชิญ เขาก็เกิดการตรัสรูวา หากไมอาจปองกันความโหดรายของมนุษยชาติได มนุษยชาติทั้งปวงก็ควรอยูภายใตกํามือประชาธิปไตยอันมั่นคงของเขา"
 RAJ_destroyer_of_worlds: "ผูทําลายลางโลก"
 RAJ_destroyer_of_worlds_desc: "เมื่อเวลาผานไป เราจะเติบโตเปนผูทําลายลางโลกอันทรงพลัง ถือกําเนิดขึ้น ณ ที่นี้เพื่อบดขยี้ศัตรูของเรา"
 RAJ_uranium_tipped_bullets: "กระสุนหัวยูเรเนียม"
 RAJ_uranium_tipped_bullets_desc: "ยูเรเนียมที่เหลือใชทั้งหมดของเรา จะเอาไปทําอะไรไดอีก นอกจากเอามาทําหัวกระสุน?"
 RAJ_uranium_tipped_bullets_tt: "§Y$category_all_infantry$§!:\n    การโจมตีเปาแข็ง: §G+25%§!\n    การเจาะเกราะ: §G+100%§!\n§Y$category_cavalry$§!:\n    การโจมตีเปาแข็ง: §G+10%§!\n    การเจาะเกราะ: §G+40%§!\n§Y$category_artillery$§!:\n    การเจาะเกราะ: §G+100%§!\n§Y$category_tank_destroyers$§!\n    การโจมตีเปาแข็ง: §G+15%§!\n    การเจาะเกราะ: §G+20%§!\n§Y$anti_tank$§!\n    การโจมตีเปาแข็ง: §G+10%§!\n    การเจาะเกราะ: §G+20%§!\n§Y$mot_anti_tank_brigade$§!\n    การโจมตีเปาแข็ง: §G+10%§!\n    การเจาะเกราะ: §G+20%§!\n§Y$anti_air$§!\n    การโจมตีตอตานอากาศยาน: §G+10%§!\n§Y$mot_anti_air_brigade$§!\n    การโจมตีตอตานอากาศยาน: §G+10%§!"
 RAJ_contamination_cleanup_crew: "หนวยทําความสะอาดการปนเปอน"
 RAJ_contamination_cleanup_crew_desc: "ทหารของเราตองพรอมรบภายใตสภาวะที่โหดรายที่สุด แมกระทั่งทามกลางฝุนกัมมันตรังสี"
 RAJ_rolling_nuke_barrages: "ระดมยิงนิวเคลียรแบบเคลื่อนที่"
 RAJ_rolling_nuke_barrages_desc: "การระดมยิงแบบเคลื่อนที่เปนเรื่องปกติในมหาสงคราม เทคโนโลยีใหมทําใหการระดมยิงรายแรงยิ่งขึ้นไปอีก"
 RAJ_bathe_in_hellfire: "อาบไฟนรก"
 RAJ_bathe_in_hellfire_desc: "ศัตรูของเราจะมีทางเลือกเพียงสองทาง: ยอมสยบ หรือเผชิญกองเพลิง"
 RAJ_bathe_in_hellfire_desc_tt: "§Yอาวุธนิวเคลียร§!จะทําลาย§Yโรงงานทหาร§!ของรัฐเปาหมาย §Y50%§! อยางถาวร\n§Yอาวุธเทอรโมนิวเคลียร§!จะทําลาย§Yโรงงานทหาร§!ของรัฐเปาหมาย §Y100%§! อยางถาวร"
 RAJ_jaguar: "จากัวร"
 RAJ_jaguar_desc: "จากัวรคือตัวเลือกชั้นยอดสําหรับการมอบความยุติธรรมแบบประชาธิปไตยจากเบื้องบน"
 RAJ_ammunition_factory_khadki: "โรงงานกระสุนขัดกี"
 RAJ_ammunition_factory_khadki_desc: "เพื่อใหมีขีดความสามารถในการจัดหาอาวุธแกกองกําลังรบสมัยใหม เราตองขยายโรงงานสรรพาวุธของประเทศอยางมหาศาล"
 RAJ_rifle_factory_ishapore_west_bengal: "โรงงานปนเล็กยาวอิชาปูร"
 RAJ_rifle_factory_ishapore_west_bengal_desc: "โรงงานปนเล็กยาวอิชาปูรจะทํางานควบคูกับโรงงานขัดกีเพื่อจัดหาอาวุธเบาใหแกกองทัพ"
 RAJ_gun_and_shell_factory_cossipore: "โรงงานปนและกระสุนปนใหญ"
 RAJ_gun_and_shell_factory_cossipore_desc: "โรงงานคอสซิปอรจะเพิ่มขีดความสามารถของเราดานยุทโธปกรณทหารราบ รวมถึงจัดหากระสุนใหแกกองทหาร"
 RAJ_cordite_factory_aruvankadu_tamil_nadu: "โรงงานคอรไดตอรุวังกาฑุ"
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc: "การมีดินขับที่ดีสําหรับปนใหญจะทําใหปนหนักของเราเหนือกวาศัตรู"
 RAJ_local_recruitment_offices: "สํานักงานรับสมัครทหารทองถิ่น"
 RAJ_local_recruitment_offices_desc: "เรามีประชากรจํานวนมาก หลายคนยินดีอาสาเขากองทัพเพื่อยกระดับฐานะทางเศรษฐกิจของตน แทนที่เราจะตองประกาศเกณฑทหารทั่วไป การตั้งสํานักงานรับสมัครจะทําใหเรามีอาสาสมัครอยางเพียงพอ"
 RAJ_local_recruitment_offices_tt: "ทุก ๆ เดือนที่ [?RAJ_recruitment_offices_timeout_max] จะลดบทลงโทษของ §Y$idea_RAJ_agrarian_society$§! ลง\n\t ตัวคูณประชากรที่เกณฑได: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n ความเร็วการระดมพล: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n ตัวคูณคาใชจายกฎหมายการระดมพล: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_military_pensions: "บํานาญทหาร"
 RAJ_military_pensions_desc: "การจัดใหมีบํานาญทหารเปนสวนหนึ่งของสวัสดิการกองทัพ จะเสริมความแข็งแกรงใหภาคการทหารโดยรวม ดวยการรักษากําลังพลไวไดนานขึ้น"
 RAJ_legacy_of_military_service: "มรดกแหงการรับราชการทหาร"
 RAJ_legacy_of_military_service_desc: "มีหมูบานมากมายทั่ว[GetRajName]ที่บรรดาพอเคยรับราชการทหาร ลูกชายจึงถูกกดดันใหทําเชนเดียวกัน ทายที่สุดแลวนี่คือประเพณี และเราสามารถใชประโยชนจากสิ่งนี้เพื่อรวบรวมทหารใหมไดมากกวาปกติ"
 RAJ_indian_states_force: "กองกําลังรัฐมหาราชา"
 RAJ_indian_states_force_desc: "รัฐมหาราชาตาง ๆ มีกองกําลังของตนเองที่สามารถเรียกระดมมาปกปอง[GetRajName]ได"
 RAJ_frontier_corps: "กองกําลังชายแดน"
 RAJ_frontier_corps_desc: "ประเทศของเราประกอบดวยภูมิประเทศหลากหลาย หนึ่งในนั้นคือภูมิประเทศชายแดนอันทุรกันดารทางตะวันออก การติดตอกับกองกําลังอาสาที่นั่นและนําความเชี่ยวชาญดานการรบในสภาพแวดลอมอันโหดรายของพวกเขามาใช จะเปนประโยชนอยางยิ่งตอเรา"
 RAJ_seven_shackles: "เจ็ดพันธนาการ"
 
 RAJ_seven_shackles_2: "พันธนาการที่สี่ถึงหกจากเจ็ดพันธนาการ"
 RAJ_release_subjects_hint_tt: "§Yรัฐในอารักขาที่เราปลดปลอยจากอนุทวีปจะมีแนวโนมใหความสําคัญกับแผนยุทธศาสตรดานอุตสาหกรรมมากกวาแผนยุทธศาสตรอื่น§!"
 RAJ_famine_impact_reduction: "§Yสิ่งนี้จะลดผลกระทบของทุพภิกขภัยเมื่อเกิดขึ้น§!"
