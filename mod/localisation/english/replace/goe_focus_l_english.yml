 IRQ_invite_oil_mission: "เชิญคณะผูแทนดานนํ้ามัน"
 IRQ_invite_oil_mission_desc: "อํานาจตอรองของเราอยูที่ทองคําดํา และมิตรใหมของเราตองการนํ้ามันมากเทาที่จะหาได การยอมใหสัมปทานเล็กนอยในตอนนี้อาจหมายถึงผลประโยชนที่ยิ่งใหญกวาในอนาคต หากสงครามพัฒนาไปในทางที่เปนประโยชนตอเรา"
 IRQ_invite_oil_mission_ctt: "เราจะเสนอสิทธิ์ใน§Yนํ้ามัน§!ของเราใน §Y[676.GetName]§! ใหแก §Y[GER.GetNameDef]§! เพื่อแลกกับ:"

