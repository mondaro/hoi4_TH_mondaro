 SSB_chromium_2_tt: "นําเขาทรัพยากรจากสมาชิกกติกาสัญญาอื่น โดยเพิ่ม:\n§Y4§! £GFX_resources_strip|1, §Y5§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|5 เขาสู§Yเมืองหลวง§!โดยตรง"
