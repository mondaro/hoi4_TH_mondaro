 ##### IRAQ #####
 ################

 IRQ_decouple_from_the_pound: "เลิกผูกคาเงินกับปอนด"
 IRQ_decouple_from_the_pound_desc: "คาเงินของเรายังคงผูกติดกับปอนดสเตอรลิงของอังกฤษ ซึ่งจํากัดความสามารถในการออกนโยบายเศรษฐกิจที่เหมาะกับความตองการของเรา เราตองตัดความเชื่อมโยงนี้และจัดตั้งคณะกรรมการเงินตราของเราเองเพื่อควบคุมเงินดีนาร"
 IRQ_construct_the_kut_barrage: "สรางเขื่อนคูต"
 IRQ_construct_the_kut_barrage_desc: "อุปสรรคที่เกิดขึ้นเมื่อไมนานมานี้ในการกอสรางเขื่อนคูตตองไดรับการแกไขโดยเร็วที่สุด หากเราจะรักษาปริมาณนํ้าใหเพียงพอสําหรับการชลประทานตลอดลํานํ้าไทกริส"
 IRQ_strengthen_mesopotamian_farming: "เสริมความแข็งแกรงเกษตรกรรมเมโสโปเตเมีย"
 IRQ_strengthen_mesopotamian_farming_desc: "เชนเดียวกับรัฐกอนหนาจํานวนมาก [ROOT.GetNonIdeologyName]มีศูนยกลางอยูที่แมนํ้าสายใหญสองสาย คือไทกริสและยูเฟรทีส ผืนดินระหวางแมนํ้าทั้งสองเหมาะแกการเกษตรอยางยิ่ง แตอาจมีเทคนิคสมัยใหมที่เราใชเพิ่มผลผลิตได"
 IRQ_extensive_irrigation_projects: "โครงการชลประทานขนาดใหญ"
 IRQ_extensive_irrigation_projects_desc: "ดินแดนสวนใหญของเราแหงแลงและไมเหมาะแกการเกษตร แตดวยโครงการชลประทานขนาดมหึมา เราอาจเปลี่ยนพื้นที่เหลานั้นใหกลายเปนไรนาเขียวขจีที่เพาะปลูกได"
 IRQ_extensive_irrigation_projects_680_tt: "หากเราควบคุม §Y[680.GetName]§! เราจะไดรับชองสิ่งกอสรางเพิ่ม §G1§! ชองในรัฐนั้น"
 IRQ_extensive_irrigation_projects_413_tt: "หากเราควบคุม §Y[413.GetName]§! เราจะไดรับชองสิ่งกอสรางเพิ่ม §G2§! ชองในรัฐนั้น"
 IRQ_rural_electrification: "การไฟฟาชนบท"
 IRQ_rural_electrification_desc: "แมการจายไฟฟาในเขตเมืองจะคืบหนาอยางตอเนื่อง แตประชากรในชนบทยังคงถูกตัดขาดจากความกาวหนาเหลานี้ เราจึงควรจัดตั้งการไฟฟาแหงชาติเพื่อขยายโครงสรางพื้นฐานดานไฟฟาใหทั่วถึงทั้งประเทศ"
 IRQ_found_the_iraqi_state_railways: "[IRQ_found_the_iraqi_state_railways_key]"
 IRQ_found_the_iraqi_state_railways_IRQ: "กอตั้งการรถไฟแหงรัฐอิรัก"
 IRQ_found_the_iraqi_state_railways_KUR: "กอตั้งการรถไฟแหงรัฐเคิรด"
 IRQ_found_the_iraqi_state_railways_desc: "ชาว[ENG.GetAdjective]ยังคงควบคุมโครงสรางพื้นฐานทางรถไฟของเราในรูปของบริษัทรถไฟเมโสโปเตเมีย แมเราจะไดรับเอกราชแลวก็ตาม เราควรยื่นขอเสนอขอซื้อกิจการนี้และเปลี่ยนชื่อเปนการรถไฟแหงรัฐอิรัก"
 IRQ_finish_the_berlin_baghdad_railway: "สรางทางรถไฟเบอรลิน–แบกแดดใหเสร็จ"
 IRQ_finish_the_berlin_baghdad_railway_desc: "จักรวรรดิเยอรมันเดิมเคยมีความทะเยอทะยานมานานที่จะสรางทางรถไฟจากเบอรลินถึงแบกแดดเพื่อสนับสนุนการมีกําลังทางเรือในอาวเปอรเซีย 'ทอรัสเอกซเพรส' สายนี้ไมเคยสรางเสร็จสมบูรณ แตเราอาจเก็บเกี่ยวผลประโยชนทางเศรษฐกิจจากเสนทางนี้ไดดวยการสรางใหเสร็จเอง"
 IRQ_purchase_foreign_equipment: "ซื้อเครื่องมือกลจากตางประเทศ"
 IRQ_purchase_foreign_equipment_desc: "แมเราจะมีที่ดินเพาะปลูกไดและมีพื้นที่ชลประทานมากมาย แตเราขาดเครื่องจักรกลของมหาอํานาจอุตสาหกรรม หากเราลงทุนนําเขาเครื่องจักรเหลานี้ เราจะเพิ่มผลผลิตทางการเกษตรและผลผลิตอุตสาหกรรมไดอยางมาก"
 IRQ_found_southern_steel_plants: "กอตั้งโรงงานเหล็กกลาภาคใต"
 IRQ_found_southern_steel_plants_desc: "เหล็กกลามีความสําคัญยิ่งตอการพัฒนาเศรษฐกิจ รวมถึงการผลิตยุทโธปกรณทางทหาร จนถึงตอนนี้ยังมีผูผลิตในประเทศเพียงไมกี่รายที่ตอบสนองความตองการของเราได ทําใหเราตองพึ่งพาการนําเขา สภาพเชนนี้จะดําเนินตอไปไมไดเมื่อโลกเปนปรปกษมากขึ้น"
 IRQ_found_the_state_company_for_iron_and_steel: "บริษัทเหล็กและเหล็กกลาแหงรัฐ"
 IRQ_found_the_state_company_for_iron_and_steel_desc: "การลงทุนในอุตสาหกรรมเหล็กกลาเมื่อไมนานมานี้เปนประโยชนตอเศรษฐกิจและลดการพึ่งพาการนําเขา แตเราสามารถกาวไปไกลกวานั้นไดดวยการจัดตั้งอุตสาหกรรมที่รัฐควบคุมเองเพื่อควบคุมอุปทานของวัตถุดิบสําคัญเหลานี้"
 IRQ_baghdad_colleges_of_engineering_and_education: "ขยายวิทยาลัยแบกแดด"
 IRQ_baghdad_colleges_of_engineering_and_education_desc: "แบกแดดเปนศูนยกลางแหงการเรียนรูมาหลายศตวรรษ แตในชวงหลายทศวรรษหลังถูกละเลยเพราะผูคนนิยมมหาวิทยาลัยตะวันตก ถึงเวลาแลวที่เราจะลงทุนในสถาบันการศึกษาเพื่อฟนฟูนครของเราใหกลับมาเปนหัวใจแหงวงวิชาการ"
 IRQ_strengthen_the_iraqi_dinar: "[IRQ_strengthen_the_iraqi_dinar_key]"
 IRQ_strengthen_the_iraqi_dinar_IRQ: "เสริมคาเงินดีนารอิรัก"
 IRQ_strengthen_the_iraqi_dinar_KUR: "เสริมคาเงินดีนารเคิรด"
 IRQ_strengthen_the_iraqi_dinar_desc: "เมื่อเราชวงชิงการควบคุมคาเงินของเราคืนจากชาว[ENG.GetAdjective]ไดแลว ในที่สุดเราก็สามารถกําหนดนโยบายการเงินของเราเองในแบบที่เปนประโยชนตอเศรษฐกิจภายในประเทศ"
 IRQ_heavy_industry_investments: "การลงทุนอุตสาหกรรมหนัก"
 IRQ_heavy_industry_investments_desc: "เรากําลังกาวหนาในการจัดหาวัตถุดิบใหแกอุตสาหกรรม แตเริ่มเห็นชัดวาหากจะไลตามมหาอํานาจใหทัน เราตองจัดตั้งอุตสาหกรรมหนักที่รัฐดําเนินการเพิ่มขึ้นหรืออุดหนุนอุตสาหกรรมที่มีอยู"
 IRQ_found_company_for_cement: "กอตั้งบริษัททั่วไปเพื่อการผลิตปูนซีเมนต"
 IRQ_found_company_for_cement_desc: "เพื่อยกระดับโครงการกอสรางที่เรากําลังจะเริ่มทั่วประเทศ เราตองกอตั้งรัฐวิสาหกิจเพื่อผลิตและจัดจําหนายปูนซีเมนต ซึ่งมีความสําคัญยิ่งขึ้นเรื่อย ๆ สําหรับสิ่งปลูกสรางสมัยใหม"
 IRQ_expand_the_cotton_industries: "ขยายอุตสาหกรรมฝาย"
 IRQ_expand_the_cotton_industries_desc: "ภาคฝายเปนสวนสําคัญของเศรษฐกิจของเรา เราจึงตองใหความสําคัญกับภาคนี้มากขึ้นเมื่อความตองการของเรายังคงเพิ่มขึ้นอยางตอเนื่อง"
 IRQ_local_arms_industry: "อุตสาหกรรมอาวุธในประเทศ"
 IRQ_local_arms_industry_desc: "หากสงครามปะทุขึ้น เราจะไมสามารถพึ่งพาการขนสงยุทโธปกรณทางทหารจากตางประเทศได ดังนั้นเราตองเรงสรางอุตสาหกรรมอาวุธภายในประเทศของเราเองเพื่อสนับสนุนกองกําลังในยามวิกฤต"
 IRQ_invite_foreign_arms_corporations: "เชิญบรรษัทตางชาติ"
 IRQ_invite_foreign_arms_corporations_desc: "อุตสาหกรรมอาวุธภายในประเทศเปนสิ่งจําเปนยิ่ง แตเราขาดความเชี่ยวชาญในการพัฒนาและผลิตยุทโธปกรณของเราเอง เราจึงควรรวมมือกับบรรษัทตางชาติเพื่อสรางโรงงานที่เปนประโยชนรวมกันทั้งตอเราและพวกเขา"
 IRQ_construct_the_dukan_dam: "สรางเขื่อนดูกัน"
 IRQ_construct_the_dukan_dam_desc: "แมนํ้าสายใหญของประเทศเราควรถูกนํามาใชไมเพียงเพื่อการชลประทาน แตยังเพื่อการผลิตไฟฟาดวย เราจะทําเชนนั้นโดยสรางเขื่อนไฟฟาพลังนํ้าบนแมนํ้าแซบ ซึ่งจะกอใหเกิดทะเลสาบเทียม"
 IRQ_forceful_industrialization: "เรงรัดอุตสาหกรรมอยางเขมงวด"
 IRQ_forceful_industrialization_desc: "การพัฒนาอุตสาหกรรมใน[ROOT.GetNameDef]ชาเกินไปมากหากเราไมตองการถูกศัตรูทิ้งหาง เราตองจัดโครงการพัฒนาอุตสาหกรรมขนาดใหญ แมจะหมายถึงการสรางความไมพอใจใหประชาชนก็ตาม"
 IRQ_nationalize_the_anglo_iraqi_oil_company: "โอนกิจการบริษัทนํ้ามันแองโกล-อิรักเปนของรัฐ"
 IRQ_nationalize_the_anglo_iraqi_oil_company_desc: "บริษัทนํ้ามันแองโกล-อิรักยังคงครอบงํากิจการเศรษฐกิจและการตางประเทศของเรา ดูดความมั่งคั่งของเราไปสรางเรือรบใหกองทัพเรือ[ENG.GetAdjective] ซึ่งทําใหเราไมอาจควบคุมกิจการของตนเองได ถึงเวลาแลวที่เราจะยุติละครฉากนี้และโอนบริษัทเปนของรัฐเพื่อประโยชนของประชาชนเรา"
 IRQ_anglo_iraqi_oil_expansion: "ขยายกิจการนํ้ามันแองโกล-อิรัก"
 IRQ_anglo_iraqi_oil_expansion_desc: "ขอตกลงปจจุบันกับบริษัทนํ้ามันแองโกล-อิรักอาจทําใหประชาชนไมพอใจ แตพวกเขามองการณใกลและไมอาจเขาใจถึงประโยชนที่ขอตกลงนี้มอบใหแกเศรษฐกิจ และการคุมครองที่เราไดรับจากชาว[ENG.GetAdjective]"
 IRQ_form_opec: "กอตั้งโอเปก"
 IRQ_form_opec_desc: "มหาอํานาจตองพึ่งพานํ้ามันที่ไหลเขาสูโรงงานและยานพาหนะของพวกเขาอยางสิ้นเชิง หากชาติผูผลิตนํ้ามันทั่วโลกรวมมือกันในดานการผลิตและความมั่นคงของนํ้ามัน ในที่สุดเราก็จะเรียกรองใหมหาอํานาจรับผิดชอบตอทุกสิ่งที่พวกเขาทํากับเราได"
 IRQ_demand_greater_stake_in_the_company: "เรียกรองสัดสวนในบริษัทที่มากขึ้น"
 IRQ_demand_greater_stake_in_the_company_desc: "เราไดทําหลายสิ่งเพื่อใหการดําเนินงานของสถานที่ผลิตนํ้ามันนาเชื่อถือที่สุดสําหรับชาว[ENG.GetAdjective] ดังนั้นจึงเปนธรรมแลวที่พวกเขาจะแบงปนความมั่งคั่งที่เกิดจากการจัดหานํ้ามันใหเรามากขึ้น"
 IRQ_expand_oil_production: "ขยายการผลิตนํ้ามัน"
 IRQ_expand_oil_production_desc: "นักธรณีวิทยาเชื่อวามีแหลงนํ้ามันที่ยังไมไดขุดเจาะอีกมากมายทั่วประเทศของเรา ทรัพยากรเหลานี้สามารถสรางความมั่งคั่งมหาศาลใหแกประชาชนของเรา และตองนํามาใชประโยชนโดยเร็วที่สุด"
 IRQ_export_infrastructure: "โครงสรางพื้นฐานเพื่อการสงออก"
 IRQ_export_infrastructure_desc: "นํ้ามันมีความสําคัญยิ่งตอเศรษฐกิจโลก การลงทุนในโครงสรางพื้นฐานเพื่อสงออกนํ้ามันจะทําให[ROOT.GetNameDef]เปนที่รูจักของโลก พรอมทั้งไดรับประโยชนทางการเงินดวย"
 IRQ_is_kurdistan: "§Yการเลนเปนเคอรดิสถาน§!"
 IRQ_royal_iraqi_army: "[IRQ_royal_iraqi_army_key]"
 IRQ_royal_iraqi_army_IRQ: "กองทัพบกหลวงอิรัก"
 IRQ_royal_iraqi_army_KUR: "กองทัพเคิรด"
 IRQ_royal_iraqi_army_desc: "ภัยคุกคามจากสงคราม ไมวาจะจากเพื่อนบานหรือจากที่ไกลออกไป มีแนวโนมจะเกิดขึ้นมากขึ้นเรื่อย ๆ ยิ่งไปกวานั้น ยังมีกลุมการเมืองภายในประเทศจํานวนมากที่พรอมจะฉีกชาติของเราออกเปนเสี่ยง สิ่งเดียวที่จะยับยั้งพวกเขาไวไดคือความแข็งแกรงของกองทัพเรา"
 IRQ_approach_tribes_for_support: "ขอการสนับสนุนจากชนเผา"
 IRQ_approach_tribes_for_support_desc: "มีชุมชนชนบทจํานวนมากที่ยึดถือวิถีชีวิตชนเผาดั้งเดิม และนับตั้งแตกอตั้งรัฐของเรา พวกเขาก็เปนปรปกษกับเรามาโดยตลอด บางทีเราอาจยังไมพบสิ่งจูงใจที่เหมาะสมที่จะชนะใจพวกเขา"
 IRQ_establish_iraqi_coastal_defense_force: "[IRQ_establish_iraqi_coastal_defense_force_key]"
 IRQ_establish_iraqi_coastal_defense_force_IRQ: "จัดตั้งกองกําลังปองกันชายฝงอิรัก"
 IRQ_establish_iraqi_coastal_defense_force_KUR: "จัดตั้งกองกําลังปองกันชายฝงเคิรด"
 IRQ_establish_iraqi_coastal_defense_force_desc: "แนวชายฝงของเราอาจสั้น แตตั้งอยูบนเสนทางลําเลียงที่สําคัญที่สุดเสนหนึ่งของโลกสําหรับการสงออกนํ้ามันไปยังตะวันตก เราจึงตองจัดตั้งกองกําลังทางเรือเพื่อปกปองผลประโยชนของเราในพื้นที่นี้"
 IRQ_invite_foreign_advisors: "เชิญที่ปรึกษาตางชาติ"
 IRQ_invite_foreign_advisors_desc: "เราขาดความเชี่ยวชาญที่จะตอกรกับมหาอํานาจทางทะเลใด ๆ ในภูมิภาค แตเราสามารถยกระดับทักษะของกองกําลังไดดวยการนําผูเชี่ยวชาญตางชาติเขามาฝกนายทหารเรือของเรา"
 IRQ_purchase_small_ships: "จัดซื้อเรือขนาดเล็ก"
 IRQ_purchase_small_ships_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 IRQ_create_repair_yards: "กอตั้งทาเรือนํ้าลึกอุมมกัสร"
 IRQ_create_repair_yards_desc: "การพัฒนาทาเรือนํ้าลึกจะชวยเพิ่มขีดความสามารถในการสงออกสินคาไดอยางมาก พรอมทั้งเปนสถานที่ใหเรือรบเขาจอดและเติมเสบียงไดดวย"
 IRQ_navy_research_bonus: "ความกาวหนาทางเทคโนโลยีกองทัพเรือ"
 IRQ_navy_research_bonus_desc: "จนถึงตอนนี้เราตองพึ่งพาเรือมือสองจากตางประเทศที่ลาสมัยไปตั้งแตกอนที่เราจะซื้อมาเสียอีก เพื่อไมใหถูกทิ้งหาง เราตองวิจัยและพัฒนาเทคโนโลยีทางเรือของเราเอง และปรับปรุงหรือสรางกองเรือขึ้นใหม"
 IRQ_infantry_focus: "เสริมกําลังทหารราบ"
 IRQ_infantry_focus_desc: "มหาอํานาจจะเลนกับสัตวประหลาดจักรกลของพวกเขาไปเทาใดก็ได แตความจริงก็คือสงครามใด ๆ ทายที่สุดแลวจะตองตัดสินดวยทหารราบ ดังนั้นกองทัพบกจะไดรับงบประมาณเพิ่มขึ้นอยางมากเพื่อยกระดับการฝก"
 IRQ_scavenging: "ใชยุทธวิธีเก็บกู"
 IRQ_scavenging_desc: "ยุทโธปกรณที่เราผลิตเองไมไดมักจะโผลมาที่นี่ในมือของผูรุกรานตางชาติ เราจึงควรฝกกองกําลังใหรูจักแยกแยะและยึดยุทโธปกรณทางทหารที่มีคาทุกครั้งที่มีโอกาส"
 IRQ_cavalry_integration: "ผนวกรวมทหารมา"
 IRQ_cavalry_integration_desc: "แมการใชยานยนตอาจกลายเปนมาตรฐานในอนาคต แตในตอนนี้กองทัพของเราตองการการสนับสนุนที่เราจัดหาใหไดในรูปของทหารมาเทานั้น"
 IRQ_modernization: "มุงสูความทันสมัย"
 IRQ_modernization_desc: "การเดินสวนสนามไปตามทองถนนดวยยุทโธปกรณโบราณอาจเพียงพอที่จะควบคุมประชาชนของเราเอง แตแทบไมชวยยับยั้งการรุกรานของมหาอํานาจตางชาติ เราตองปรับปรุงยุทโธปกรณใหทันสมัยและทําใหกองทัพของเราเปนกําลังยับยั้งที่นาเกรงขาม"
 IRQ_purchase_mechanized_equipment: "จัดซื้อยุทโธปกรณยานเกราะลําเลียงพล"
 IRQ_purchase_mechanized_equipment_desc: "การเดินทัพอันเชื่องชาของทหารราบกลายเปนจุดออนที่เห็นไดชัดของกองกําลังเรา เมื่อตางประเทศมีทหารราบยานเกราะลําเลียงพลแลว ถึงเวลาที่เราตองลงทุนเปลี่ยนกองกําลังของเราใหเปนยานเกราะกอนจะสายเกินไป"
 IRQ_purchase_armored_equipment: "จัดซื้อยุทโธปกรณยานเกราะ"
 IRQ_purchase_armored_equipment_desc: "กองกําลังของเราขาดพลังโจมตีเมื่อเทียบกับศัตรู เพราะเราพึ่งพาทหารราบแบบดั้งเดิมมากเกินไป รถถังคืออนาคตของสงครามภาคพื้นดินอยางชัดเจน และเราตองหาผูที่ยินดีขายรถถังสวนเกินใหเรา"
 IRQ_training: "โรงเรียนอาวุธเบาอัล-วาช"
 IRQ_training_desc: "การฝกทหารใน[IRQ.GetNonIdeologyName]ลาสมัย และอาจปรับปรุงไดดวยการปฏิรูปตามแบบอยางของชาติอื่น เราจึงควรฝกทหารของเราดานอาวุธเบาและยุทธวิธีทหารราบที่โรงเรียนอาวุธเบาอัล-วาช"
 IRQ_army_research_bonus: "ปรับหลักนิยมทางทหารใหทันสมัย"
 IRQ_army_research_bonus_desc: "นายทหารของเราจํานวนมากเปนอดีตทหารของจักรวรรดิออตโตมันเกา หรือไดรับการฝกขั้นพื้นฐานจากกองกําลัง[ENG.GetAdjective] ไมวากรณีใด ยุทธวิธีของพวกเขาก็เริ่มลาสมัยและตองไดรับการปรับปรุงทันที"
 IRQ_special_projects: "ศูนยวิจัยนิวเคลียรตูไวธา"
 IRQ_special_projects_desc: "ขาวลือเรื่องความลับปรมาณูจากตางประเทศไดเดินทางมาถึงนักวิทยาศาสตรและวิศวกรของเรา ซึ่งกระตือรือรนที่จะแสดงความสามารถ ดวยความเชี่ยวชาญของพวกเขาและเงินทุนที่เพียงพอ เราอาจพัฒนาอาวุธที่มีอานุภาพเกินจินตนาการได"
 IRQ_special_forces: "หนวยรบพิเศษ"
 IRQ_special_forces_desc: "ในบางสถานการณระหวางสงคราม ทหารผูเชี่ยวชาญเพียงหยิบมือที่แทรกซึมเขาไปหลังแนวขาศึกสามารถสรางความเสียหายรายแรงที่ทั้งกองทัพไมอาจทําไดในสนามรบเปด เราจําเปนตองมีกองกําลังเชนนี้เตรียมพรอมไว"
 IRQ_expand_habbaniya_airbase: "ขยายฐานทัพอากาศฮับบานิยา"
 IRQ_expand_habbaniya_airbase_desc: "ฐานทัพอากาศฮับบานิยากลายเปนหัวใจของปฏิบัติการทางอากาศในอิรักนับตั้งแตชาว[ENG.GetAdjective]สรางขึ้น เพื่อรองรับกองทัพอากาศที่กําลังเติบโตของเราไดดียิ่งขึ้น เราควรขยายสิ่งอํานวยความสะดวกที่นั่น"
 IRQ_independent_flight_schools: "โรงเรียนการบินอิสระ"
 IRQ_independent_flight_schools_desc: "นักบินของเราสวนใหญไดรับการฝกในตางประเทศโดยชาว[ENG.GetAdjective] แตบัดนี้เรามีนักบินมากพอที่จะเริ่มฝกนักบินภายในประเทศไดแลว"
 IRQ_purchase_british_aircraft: "จัดซื้อเครื่องบินอังกฤษ"
 IRQ_purchase_british_aircraft_desc: "ดวยความสัมพันธของเรากับกองทัพอากาศหลวง[ENG.GetAdjective] จึงสมเหตุสมผลที่จะจัดหาเครื่องบินจากพวกเขาเพิ่มเติม"
 IRQ_purchase_alternative_aricraft: "จัดซื้อเครื่องบินทางเลือก"
 IRQ_purchase_alternative_aricraft_desc: "เพื่อหลีกเลี่ยงการพึ่งพาผูจัดหารายเดียวมากเกินไป เราควรมองหาแหลงอื่นนอกเหนือจากชาว[ENG.GetAdjective]เพื่อจัดหาเครื่องบินใหกองทัพที่กําลังเติบโตของเรา นายทหารของเราหลายคนสนับสนุนใหทําขอตกลงกับชาว[ITA.GetAdjective]"
 IRQ_bomber_training: "การฝกเครื่องบินทิ้งระเบิด"
 IRQ_bomber_training_desc: "กองทัพอากาศของเราขาดประสบการณกับเครื่องบินขนาดใหญที่ใชในภารกิจทิ้งระเบิด ชองวางดานทักษะนี้ตองไดรับการแกไขโดยเร็วที่สุด"
 IRQ_naval_air_support: "การสนับสนุนทางอากาศแกกองทัพเรือ"
 IRQ_naval_air_support_desc: "การเชื่อวาเราจะพัฒนากองทัพเรือที่ตอกรกับมหาอํานาจไดนั้นเปนเรื่องโงเขลา แตการพัฒนาอากาศยานที่โจมตีเปาหมายทางเรือไดจะชวยลดชองวางไดดวยตนทุนเพียงเศษเสี้ยวของเรือลําเดียว"
 IRQ_fighter_training: "การฝกเครื่องบินขับไล"
 IRQ_fighter_training_desc: "การวางแผนทางทหารและเศรษฐกิจทั้งหมดของเราจะสูญเปลา หากนักบินของเราไมสามารถใชเครื่องบินปกปองนานฟาจากเครื่องบินทิ้งระเบิดของขาศึกไดอยางเพียงพอ"
 IRQ_air_research_bonus: "การวิจัยอากาศพลศาสตรและระบบอิเล็กทรอนิกสการบิน"
 IRQ_air_research_bonus_desc: "ระบบอิเล็กทรอนิกสการบินกําลังกาวหนาอยางรวดเร็วเมื่อความขัดแยงปะทุขึ้นทั่วโลก เราตองมีสถานที่ที่วิศวกรของเราจะพัฒนาเทคโนโลยีลํ้าสมัยใหแกกองทัพอากาศ หากเราหวังจะเปนมหาอํานาจในภูมิภาค"
 IRQ_project_babylon_focus: "โครงการบาบิโลน"
 IRQ_project_babylon_focus_desc: "เพื่อชนะสงครามในอนาคต เราตองจัดหาอาวุธหนักที่จําเปนตอการครอบงําศัตรู ไมวาเราจะมีจํานวนนอยกวาเพียงใด เราจึงควรเปดสถานที่ที่อุทิศใหแกการวิจัยและพัฒนาอาวุธทดลอง"
 IRQ_invest_in_ordnance_mountain_howitzers: "ลงทุนในปนใหญภูเขาออรดแนนซ"
 IRQ_invest_in_ordnance_mountain_howitzers_desc: "ประเทศของเราถูกขนาบดวยเทือกเขาทางเหนือและตะวันออก แตกองทัพของเราขาดอํานาจการยิงที่เพียงพอสําหรับการรบในพื้นที่เชนนั้น บางทีอาจถึงเวลาลงทุนในปนใหญภูเขาเฉพาะทางเพื่อสนับสนุนพวกเขา หากเกิดความขัดแยงกับเพื่อนบานขึ้น"
 IRQ_basra_military_port_focus: "รับมอบทาเรือทหารบัสรา"
 IRQ_basra_military_port_focus_desc: "ดวยความสนใจในทองทะเลและอาวเปอรเซียที่ฟนคืนมา เราควรทําใหแนใจวาทาเรือทหารบัสราจะถูกสงมอบใหอยูใตการบริหารของเรา และไมเปนสวนหนึ่งของกองกําลังจักรวรรดินิยมที่ยึดครองประเทศของเราอีกตอไป"
 IRQ_develop_the_kuwaiti_port: "พัฒนาทาเรือคูเวต"
 IRQ_develop_the_kuwaiti_port_desc: "เมื่อคูเวตอยูภายใตการควบคุมอันชอบธรรมของเรา แนวชายฝงของเราก็เพิ่มขึ้นอยางมาก ทําใหเรามีโอกาสขยายสิ่งอํานวยความสะดวกทางเรือใหมากยิ่งขึ้นเพื่อรองรับการมีกําลังในอาวเปอรเซียที่ยิ่งใหญกวาเดิม"
 IRQ_develop_the_kuwaiti_port_tt: "เพิ่ม§G1§Y ฐานทัพเรือ §!§!ในแตละจังหวัด"
 IRQ_form_the_independent_mechanized_brigade: "จัดตั้งกองพลนอยยานเกราะลําเลียงพลอิสระ"
 IRQ_form_the_independent_mechanized_brigade_desc: "ดวยการจัดซื้อยุทโธปกรณที่เหมาะสมและการฝกอยางหนัก กองทัพของเราเชื่อวาพรอมแลวที่จะวางกําลังและใชหนวยยานเกราะลําเลียงพลหนวยแรก"
 IRQ_form_the_independent_mechanized_brigade_tt: "สรางแมแบบกองพล§Yยานเกราะลําเลียงพล§! อัล-เมคานิกียะห และวางกําลัง §Y1§! หนวย"
 IRQ_expand_camel_corps: "ผนวกรวมตํารวจ[ROOT.GetAdjective]"
 IRQ_expand_camel_corps_desc: "ชาว[ENG.GetAdjective]ไดแสดงใหเห็นถึงความอเนกประสงคของทหารอูฐในมหาสงครามครั้งกอน ดวยการใชกองทหารอูฐทั่วแอฟริกาเหนือและตะวันออก เมื่อตํารวจของเราคุนเคยกับการใชอูฐลาดตระเวนอยูแลว เราจึงสามารถผนวกพวกเขาเขากับกองทัพอยางใกลชิดขึ้นและเรียนรูจากพวกเขาไดมากขึ้น"
 IRQ_purchase_british_aircraft_AAT_tt: "§Yเราจะไดรับเงินอุดหนุนยุทโธปกรณมากขึ้นขณะที่ $IRQ_anglo_iraqi_treaty$ ยังมีผลอยู§!"
 IRQ_purchase_british_aircraft_treaty_tt: "§Yเราจะไดรับยุทโธปกรณมากขึ้นขณะที่ $IRQ_anglo_iraqi_treaty$ ยังมีผลอยู§!"
 IRQ_align_afghanistan_fasc: "เชิญอัฟกานิสถาน"
 IRQ_align_afghanistan_fasc_desc: "[AFG.GetNameDef]ติดอยูระหวางชาว[SOU.GetAdjective]และชาว[ENG.GetAdjective]ในฐานะรัฐกันชนมานาน บางทีหากรวมมือกัน เราอาจยกสถานะของพวกเขาใหเหมาะสมยิ่งขึ้นในภูมิภาคได"
 IRQ_ensure_sunni_dominance: "รักษาความเปนใหญของซุนนี"
 IRQ_ensure_sunni_dominance_desc: "แมจะเปนชนกลุมนอย แตชนชั้นนําซุนนีก็ปกครองประเทศของเรามาชานาน โดยมีราชวงศฮัชไมตและกลุมชาตินิยมอาหรับคอยคํ้าจุน หากเราตองการใหกลุมเหลานี้ครองอํานาจตอไป เราตองทําใหแนใจวาความเปนใหญของซุนนีในการเมืองของเรายังคงดํารงอยู"
 IRQ_rally_behind_the_hashemite_dynasty: "รวมพลังเบื้องหลังราชวงศฮัชไมต"
 IRQ_rally_behind_the_hashemite_dynasty_desc: "ราชวงศฮัชไมตตองเปนศูนยรวมที่เราจะใชสรางสํานึกความเปนชาติอิรักตอไป หลังจากครองอํานาจมาหลายป เราใกลจะกุมอํานาจนั้นไวไดอยางมั่นคงแทจริงแลว"
 IRQ_align_afghanistan_fasc_tt: "§Y[AFG.GetNameWithFlag]§! ไดรับเชิญเขารวมฝายของเรา"
 IRQ_anti_western_alliance_per_tt: "§Y[PER.GetNameWithFlag]§! ไดรับเชิญเขารวมฝายของเรา"
 IRQ_anti_western_alliance_tur_tt: "§Y[TUR.GetNameWithFlag]§! ไดรับเชิญเขารวมฝายของเรา"
 IRQ_refuge_for_the_grand_mufti: "ที่ลี้ภัยของมุฟตีใหญ"
 IRQ_refuge_for_the_grand_mufti_desc: "หลังความวุนวายในปาเลสไตนเมื่อไมนานมานี้ อามิน อัล-ฮุสเซนี มุฟตีใหญแหงเยรูซาเลมผูเปนที่ถกเถียง ถูกอังกฤษเนรเทศ เพื่อบรรเทากระแสตอตานอังกฤษภายในพรมแดนของเรา บางทีเราอาจใหที่ลี้ภัยแกเขาไปพลางกอน"
 IRQ_religious_resistance: "การตอตานทางศาสนา"
 IRQ_religious_resistance_desc: "เมื่อมุฟตีใหญอยูภายใตการคุมครองของเรา เราอาจรวมมือกับเขาปลุกระดมการตอตานทั่วโลกอาหรับตอระบอบตะวันตกผูกดขี่ที่ถูกยัดเยียดใหแกเรา"
 IRQ_protector_of_the_gulf: "ผูพิทักษอาวเปอรเซีย"
 IRQ_protector_of_the_gulf_desc: "เราไดพิสูจนแลววาเปนพันธมิตรที่ไวใจไดของมหาอํานาจตะวันตก บางทีพวกเขาอาจยินดีถอนตัวจากภูมิภาคนี้ แลกกับการที่เราจะรักษาความมั่นคงของอาวเปอรเซียนับจากนี้ไป"
 IRQ_restoration_of_hejaz: "ฟนฟูฮิญาซ"
 IRQ_restoration_of_hejaz_desc: "ชาว[SAU.GetAdjective]บดขยี้ราชอาณาจักรฮิญาซเมื่อไมนานมานี้ และพรอมกันนั้นก็ลดทอนอิทธิพลของราชวงศฮัชไมตลง ถึงเวลาแลวที่เราจะตอบแทนพวกเขาใหสาสม"
 IRQ_reach_out_to_jordan: "ยื่นมือสูจอรแดน"
 IRQ_reach_out_to_jordan_desc: "เครือญาติของเรายังคงปกครองจอรแดนภายใตการคุมครองของชาว[ENG.GetAdjective] แตเราอาจโนมนาวทั้งพวกเขาและชาว[ENG.GetAdjective]ใหยอมใหเราสรางความเปนเอกภาพทางการเมืองและเศรษฐกิจที่มากขึ้น แลกกับการที่เรารับหนาที่ปองกันประเทศแทน"
 IRQ_status_of_lebanon: "สถานะของเลบานอน"
 IRQ_status_of_lebanon_desc: "เมื่อซีเรียอยูภายใตการควบคุมของเราอยางมั่นคงแลว ความสนใจจึงหันไปยังอนาคตของเลบานอน บางทีเราอาจลองเสี่ยงดวงอีกสักครั้งและเรียกรองใหโอนเลบานอนมาอยูใตการควบคุมของเราดวย"
 IRQ_regional_economic_integration: "การบูรณาการเศรษฐกิจระดับภูมิภาค"
 IRQ_regional_economic_integration_desc: "เราตองจัดการลงทุนขนาดมหึมาในโครงสรางพื้นฐานของภูมิภาค เพื่อใหเราทุกคนไดรับประโยชนจากการเติบโตทางเศรษฐกิจในระยะยาว"
 IRQ_regional_military_integration: "การบูรณาการทางทหารระดับภูมิภาค"
 IRQ_regional_military_integration_desc: "เราขาดขีดความสามารถในการผลิตทางทหารเชนมหาอํานาจ แตบางทีดวยการลงทุนระดับภูมิภาค เราอาจเริ่มไลตามทันได"
 IRQ_regional_military_integration_tt: "การทําแผนยุทธศาสตรนี้สําเร็จขณะที่จอรแดนเปนรัฐในอารักขาของเราหรือเราควบคุมจอรแดนอยู จะเพิ่มโรงงานทหารอีกสองแหงในจอรแดน"
 IRQ_demand_palestine: "เรียกรองปาเลสไตน"
 IRQ_demand_palestine_desc: "อังกฤษไดพิสูจนแลววาไมนาไววางใจในการปกปองชาวปาเลสไตนในดินแดนภายใตอาณัติ ขณะที่สายตาของทั้งโลกจับจองพวกเขาอยู เราอาจบีบบังคับพวกเขาไดดวยการเรียกรองใหโอนดินแดนในอาณัติมาอยูใตการควบคุมของเรา"
 IRQ_hashemite_arab_federation: "สหพันธรัฐอาหรับฮัชไมต"
 IRQ_hashemite_arab_federation_desc: "เมื่อสมาชิกราชวงศฮัชไมตของเราตั้งมั่นอยูทั่วภูมิภาค เราจึงมีโอกาสรวมราชอาณาจักรของเราเปนสหพันธรัฐอาหรับฮัชไมตอันยิ่งใหญหนึ่งเดียว"
 IRQ_fligerfuhrer_irak: "Fliegerführer Irak"
 IRQ_fligerfuhrer_irak_desc: "กองทัพของเรายังคงดอยกวาชาว[ENG.GetAdjective]อยางสิ้นหวังในดานกําลังอาวุธ แตเราอาจพลิกดุลอํานาจใหเปนประโยชนตอเราไดดวยเครื่องบินและนักบินจากพันธมิตร"
 IRQ_commander_of_the_faithful: "ผูนําแหงศรัทธาชน"
 IRQ_commander_of_the_faithful_desc: "เมื่อเรารับภารกิจรวมชาวอาหรับใหอยูภายใตการปกครองของเราแลว ก็ควรชักชวนพวกเขาใหมารวมอุดมการณของเราใหไดมากที่สุด อับดุล อิลาห พบวาตนสามารถรับตําแหนงอะมีรุลมุอมินีนได ดังที่ฮุสเซน บิน อาลี อัล-ฮาชิมี เคยดํารงมากอน"
 #IRQ_retire_radical_officers: "Retire Radical Officers"
 #IRQ_retire_radical_officers_desc: "The armed forces are rife with anti-[ENG.GetAdjective] and pan-arab radicals who wish to force a confrontation. We must retire them from their roles before they find an opportunity to undermine our rule."
 IRQ_increase_anglo_iraqi_economic_ties: "กระชับความสัมพันธทางเศรษฐกิจแองโกล-อิรัก"
 IRQ_increase_anglo_iraqi_economic_ties_desc: "คงเปนเรื่องโงเขลาหากเราไมใชประโยชนจากความสัมพันธทางเศรษฐกิจอันใกลชิดที่เราพัฒนาขึ้นกับ[ENG.GetAdjective]"
 IRQ_raf_levies_focus: "ทหารเกณฑกองทัพอากาศหลวง"
 IRQ_raf_levies_focus_desc: "ชาว[ENG.GetAdjective]คงกําลังทหารเกณฑจํานวนหนึ่งไวในดินแดนของเราเพื่อรักษาความปลอดภัยของฐานทัพอากาศ บางทีเราอาจยกระดับขีดความสามารถในการปองกันไดดวยการรวมมือกับกองกําลังเหลานี้ใหดียิ่งขึ้น"
 IRQ_increase_prime_ministers_powers: "เสริมอํานาจนายกรัฐมนตรี"
 IRQ_increase_prime_ministers_powers_desc: "เปนที่พิสูจนแลววาชาวอิรักไมตองการการปกครองแบบเบ็ดเสร็จภายใตราชวงศฮัชไมต บัดนี้จึงเปดโอกาสใหเราวางรากฐานการปกครองแบบรัฐธรรมนูญใหมั่นคงตลอดไป และนําอิรักสูเสนทางแบบตะวันตกมากขึ้น"
 IRQ_party_of_national_brotherhood: "พรรคภราดรภาพแหงชาติ"
 IRQ_party_of_national_brotherhood_desc: "รัฐบาลยอมกมหัวใหความตองการของ[ENG.GetAdjective]มานานเกินไปแลว มีเพียงพรรคภราดรภาพแหงชาติเทานั้นที่มีศักยภาพจะยก[IRQ.GetNonIdeologyName]สูความยิ่งใหญ"
 IRQ_bakr_sidqi_coup: "รัฐประหารของบักร ซิดกี"
 IRQ_bakr_sidqi_coup_desc: "ระบอบปจจุบันออนแอและหลงทาง ภายใตการนําของบักร ซิดกี เราจะโคนลมระบอบนี้และสรางอนาคตที่เปนอิสระใหแกประชาชนแหง[ROOT.GetNonIdeologyName]"
 IRQ_bakr_sidqi_tt: "§Y$IRQ_bakr_sidqi$ ไดรับแตงตั้งเปนที่ปรึกษาที่ไมสามารถปลดออกได§!"
 IRQ_a_new_caliph: "กาหลิบองคใหม"
 IRQ_a_new_caliph_desc: "หลังการตอสูมาหลายป เราไดสถาปนาตนเปนมหาอํานาจอันดับหนึ่งของโลกอิสลาม ดังนั้นถึงเวลาแลวที่เราจะสืบสานมรดกของฮุสเซน บิน อาลี และฟนฟูรัฐคอลีฟะฮภายใตการนําของราชวงศฮัชไมต"
 IRQ_demand_syria_hashemite: "เสนอการรวมชาติซีเรีย"
 IRQ_demand_syria_hashemite_desc: "ซีเรียเคยอยูภายใตการปกครองของพระเจาไฟซอลที่ 1 ในชวงสั้น ๆ ระหวางป 1920 แตถูกพรากไปจากเราดวยการทรยศของฝรั่งเศส บัดนี้เราสามารถเจรจาจากจุดยืนที่เขมแข็งและเรียกรองดินแดนอันชอบธรรมของเราคืนได"
 IRQ_kurdish_outreach: "ผูกมิตรชาวเคิรด"
 IRQ_kurdish_outreach_desc: "ชาวเคิรดทางตอนเหนือของอิรักมีศักยภาพที่จะบอนทําลายอํานาจของเราเหนือภูมิภาคนี้อยางมหาศาลหากพวกเขารวมตัวกันตอตานเรา เราจึงตองพยายามผนวกพวกเขาเขากับชาติอิรักที่กวางขึ้น แมจะหมายถึงการใหอํานาจปกครองตนเองแกพวกเขาบางสวนก็ตาม"
 IRQ_suppress_tribal_revolts: "ปราบปรามการกอกบฏของชนเผา"
 IRQ_suppress_tribal_revolts_desc: "เพื่อสรางเอกภาพใหแกชาติและทําใหแนใจวาเราจะไมแตกแยกจากภายในเมื่อเผชิญหนากับเพื่อนบาน เราตองปราบปรามการกอกบฏของชนเผา และลดความยากจนใหแกผูที่ยินดีใหความรวมมือ เพื่อเยียวยารอยราวในจิตวิญญาณของชาติ"
 IRQ_assasination_of_sidqi: "การลอบสังหารบักร ซิดกี"
 IRQ_assasination_of_sidqi_desc: "[IRQ_assassination_of_sidqi_desc_key]"
 IRQ_assassination_of_sidqi_desc_leader: "บักร ซิดกี ลมเหลวในการรวมชาตินับตั้งแตโคนลมรัฐบาลชุดกอน ความขุนเคืองกําลังคุกรุนไปทั่วชนชั้นนําทางการเมือง และประชาชนอิรักในวงกวางก็ไมไววางใจที่ชาวเคิรดคนหนึ่งมีอิทธิพลเหนือกิจการของชาติมากถึงเพียงนี้ หากมีโอกาส แทบจะหลีกเลี่ยงไมไดที่ใครสักคนจะพยายามปลิดชีพเขา..."
 IRQ_assassination_of_sidqi_desc_not_leader: "บักร ซิดกี กําลังวางแผนรัฐประหารตอรัฐบาลของเราอยางชัดเจน และนายทหารของเราหลายคนรายงานวาเขากําลังเคลื่อนไหวเพื่อซื้อความภักดีของพวกเขาไวในกรณีที่เกิดเหตุการณเชนนั้น เราจะตองกําจัดเขาหากตองการรักษาอํานาจไว"
 IRQ_attempted_assasination_of_sidqi: "ความพยายามลอบสังหารซิดกี"
 IRQ_attempted_assasination_of_sidqi_desc: "แมจะมีความขุนเคืองอยางมหาศาลในหมูประชาชนและชนชั้นนําทางการเมือง แตความพยายามลอบสังหารบักร ซิดกี เมื่อไมนานมานี้ยังไมประสบผลสําเร็จ อยางไรก็ตาม ดูเหมือนเราตองเพิ่มการรักษาความปลอดภัยและขาวกรองเพื่อปกปองระบอบใหมจากผูเห็นตาง"
 IRQ_increase_italian_business_relations: "นําเขาจาก[ITA.GetNonIdeologyName]"
 IRQ_increase_italian_business_relations_desc: "เราไมอาจปลอยใหตนเองตองพึ่งพาชาว[ENG.GetAdjective]อยางสิ้นเชิงในดานความตองการทางเศรษฐกิจ โชคดีที่ชาว[ITA.GetAdjective]ยินดีอยางยิ่งที่จะชวยเหลือเราในเรื่องนี้"
 IRQ_revoke_anglo_iraq_treaty: "ยกเลิกสนธิสัญญาแองโกล-อิรัก"
 IRQ_revoke_anglo_iraq_treaty_desc: "สนธิสัญญาแองโกล-อิรักที่เอาเปรียบฝายเดียวไดบั่นทอนการพัฒนาประเทศของเรามานานพอแลว แตบัดนี้เรามีเจตจํานงที่แข็งแกรงพอจะตอตานชาว[ENG.GetAdjective] และในที่สุดจะยกเลิกสนธิสัญญานี้ ไมวาผลที่ตามมาจะเปนอยางไร"
 IRQ_revoke_anglo_iraq_treaty_tt: "§R[ENG.GetNameDefCap]มีแนวโนมจะประกาศสงครามกับเราเพราะการยกเลิกสนธิสัญญา!§!"
 IRQ_restore_regent: "ฟนฟูผูสําเร็จราชการ"
 IRQ_restore_regent_desc: "การฉวยโอกาสอยางโงเขลาของราชิด อาลี อัล-ไกลานี และกลุมจัตุรัสทองคํา นํามาซึ่งความหายนะแกชาติของเราเทานั้น เราตองขจัดอิทธิพลอันเปนพิษของพวกเขาใหสิ้นซากดวยการกําจัดพวกเขาและฟนฟูรัฐบาลเดิมกลับสูอํานาจ"
 IRQ_support_the_allied_war_effort: "สนับสนุนความพยายามทางสงครามของฝายสัมพันธมิตร"
 IRQ_support_the_allied_war_effort_desc: "ไมวาประชาชนของเราจะยอมรับหรือไม อนาคตของเราอยูกับชาติสัมพันธมิตรของโลก เราตองแสดงความมุงมั่นตออุดมการณของพวกเขาและสรางที่ยืนใหตนเองในระเบียบโลกที่กําลังกอตัวขึ้น"
 IRQ_allied_training: "การฝกจากฝายสัมพันธมิตร"
 IRQ_allied_training_desc: "พันธมิตรของเรายินดีถายทอดความเชี่ยวชาญบางสวนที่ไดรับจากการสูรบกับศัตรูของเราในชวงหลายปที่ผานมา เราจะรับความชวยเหลือนี้เพื่อเตรียมทหารของเราใหพรอมที่สุดสําหรับการปฏิบัติหนาที่ในแนวหนา"
 IRQ_renegotiate_treaty: "เจรจาสนธิสัญญาแองโกล-อิรักใหม"
 IRQ_renegotiate_treaty_desc: "เราไดพิสูจนแลววาเราไมเปนภัยตอผลประโยชนของ[ENG.GetAdjective]ในภูมิภาค และสามารถเปนพันธมิตรของพวกเขาไดหากจําเปน ดังนั้นในที่สุดเราควรเจรจาสนธิสัญญาแองโกล-อิรักใหมบนพื้นฐานที่เทาเทียมกัน"
 IRQ_strengthen_the_golden_square: "เสริมความแข็งแกรงจัตุรัสทองคํา"
 IRQ_strengthen_the_golden_square_desc: "จัตุรัสทองคําซึ่งประกอบดวยนายทหารระดับสูงสี่นาย ไดกลายเปนศูนยรวมของลัทธิรวมชาติอาหรับและกระแสตอตาน[ENG.GetAdjective] บางทีอาจถึงเวลาแลวที่จะนําพวกเขาเขาสูรัฐบาลอยางเต็มตัว และเริ่มการปฏิรูปที่จําเปนเพื่อเสริมความแข็งแกรงใหแกชาติ"
 IRQ_iraqi_al_futuwwa: "กอตั้งอัล-ฟุตุวะหแหงอิรัก"
 IRQ_iraqi_al_futuwwa_desc: "เพื่อใหชาติของเราเติบโตแข็งแกรง เราตองกอตั้งองคกรเยาวชนที่ฝกประชาชนใหตอสูเพื่ออนาคตที่รุงโรจนยิ่งขึ้น!"
 IRQ_seek_axis_investment: "แสวงหาการลงทุนจากฝายอักษะ"
 IRQ_seek_axis_investment_desc: "เศรษฐกิจของเราซบเซาและตองการการกระจายความเสี่ยงหากจะสรางความทนทานตอการรุกรานจากตางชาติ บางทีมิตรของเราในตางแดนอาจยินดีมาลงทุนที่นี่เพื่อกระชับความสัมพันธใหแนนแฟนยิ่งขึ้น"
 IRQ_axis_training: "ภารกิจฝกของหนวยบรันเดินบวรก"
 IRQ_axis_training_desc: "$IRQ_allied_training_desc$"
 IRQ_eliminate_the_golden_square: "กําจัดจัตุรัสทองคํา"
 IRQ_eliminate_the_golden_square_desc: "จัตุรัสทองคําและผูติดตามจะพาเราเสี่ยงตอความขัดแยงในภูมิภาคและความแตกแยกภายใน เพียงเพราะความปรารถนาที่จะรวมโลกอาหรับ พวกเขาตองถูกกําจัดกอนจะทําลายชาติของเรา"
 IRQ_embargo_the_axis_powers: "ควํ่าบาตรฝายอักษะ"
 IRQ_embargo_the_axis_powers_desc: "ฝายอักษะเปนภัยตอสันติภาพโลก และตองถูกตัดขาดจากทรัพยากรทั้งหมดที่จําเปนตอการทําสงคราม"
 IRQ_al_muthanna_club: "สโมสรอัล-มุษันนา"
 IRQ_al_muthanna_club_desc: "มีสโมสรและกลุมตาง ๆ ผุดขึ้นมากมายโดยมีเปาหมายเพื่อสถาปนาระบอบรวมชาติอาหรับทั่วภูมิภาค เราจะจัดหาเงินทุนใหองคกรเหลานี้เพื่อใหเติบโตตอไปและโนมนาวประชาชนไปสูเปาหมายนั้น"
 IRQ_arab_free_legion: "กองทหารอาหรับเสรี"
 IRQ_arab_free_legion_desc: "ชาวอาหรับจากทั่วโลกอาสามาตอสูกับมหาอํานาจเกาที่ฉุดรั้งเรามาหลายทศวรรษ บางทีเราอาจตอยอดจากสิ่งนี้และเกณฑทหารจากนอกพรมแดนมาสูเคียงขางกองทัพของเราตอศัตรูรวมกัน"
 IRQ_arab_free_legion_tt: "ปลดล็อกการตัดสินใจ §Y$IRQ_arab_free_legion_cat$§! เพื่อเกณฑกองพลจากทั่วโลกอาหรับ"
 IRQ_curtail_arabism: "สกัดลัทธิรวมชาติอาหรับ"
 IRQ_curtail_arabism_desc: "ความหมกมุนในลัทธิรวมชาติอาหรับที่เพิ่มขึ้นในหมูประชาชนของเรากําลังผลักไสชุมชนที่ไมใชอาหรับซึ่งเปนสวนหนึ่งของชาติ และกําลังนําเราไปสูการปะทะกับมหาอํานาจ เราตองสกัดอุดมการณนี้กอนที่มันจะทําลายเรา"
 IRQ_strengthen_relations_with_iran: "กระชับความสัมพันธกับอิหราน"
 IRQ_strengthen_relations_with_iran_desc: "แมชาว[IRQ.GetAdjective]และชาว[PER.GetAdjective]จะไมไดเห็นพองกันเสมอไป แตเรามีวาระรวมกันในการพัฒนาชาติใหทันสมัยและตอตานการครอบงําภูมิภาคของตะวันตก ถึงเวลาสรางความสัมพันธเชิงสรางสรรคตอกันเพื่อใหเราบรรลุเปาหมายรวมกันได"
 IRQ_strengthen_relations_with_turkey: "กระชับความสัมพันธกับตุรกี"
 IRQ_strengthen_relations_with_turkey_desc: "ชาว[TUR.GetAdjective]อยูแถวหนาในการยืนหยัดตอตานมหาอํานาจตะวันตก แมทายที่สุดจะตองแลกดวยจักรวรรดิของพวกเขาก็ตาม เราจึงเปนพันธมิตรโดยธรรมชาติ และควรพยายามสรางความสัมพันธที่ดีขึ้นกับพวกเขา"
 IRQ_anti_western_alliance: "พันธมิตรตอตานตะวันตก"
 IRQ_anti_western_alliance_desc: "หากมหาอํานาจหลักของภูมิภาครวมพลังทางทหารเขาดวยกันและใหคํามั่นจะปกปองซึ่งกันและกัน เราก็จะมีโอกาสแทจริงที่จะยืนหยัดตอตานมหาอํานาจตะวันตกที่แทรกแซงกิจการของเราบอยครั้ง"
 IRQ_carve_up_syria: "แบงซีเรีย"
 IRQ_carve_up_syria_desc: "ซีเรียควรเปนสวนหนึ่งของราชอาณาจักรเราโดยชอบธรรม แตถูกฝรั่งเศสชวงชิงไป ยิ่งไปกวานั้น มิตรของเราใน[TUR.GetNonIdeologyName]ก็อางสิทธิ์บางสวนของพื้นที่นี้ดวย บางทีถึงเวลาแลวที่เราจะรวมกันเรียกรองดินแดนนี้ขณะที่โลกกําลังวอกแวก"
 IRQ_encourage_federalism: "สงเสริมระบอบสหพันธรัฐ"
 IRQ_encourage_federalism_desc: "เราควรพยายามใหอํานาจปกครองตนเองในระดับหนึ่งแกชาวเคิรดและชาวอัสซีเรีย และทําใหภาษาและธรรมเนียมทองถิ่นทั่วประเทศถูกกฎหมาย เพื่อรวมพลเมืองอิรักทุกคนไวภายใตธงผืนเดียว"
 IRQ_reapproachment_with_the_tribes: "ปรองดองกับชนเผา"
 IRQ_reapproachment_with_the_tribes_desc: "ยังมีผูนําชนเผาจํานวนมากที่ไมไดไววางใจรัฐบาลของเราอยางเต็มที่ เราควรเอาใจพวกเขาและลงทุนในพื้นที่ทองถิ่นของพวกเขา เพื่อใหแนใจวาความภักดีของพวกเขาอยูกับเราเพียงผูเดียว"
 IRQ_reapproachment_with_the_tribes_tt: "§Yอาหมัด บารซานี§! และ §Yมุสตาฟา บารซานี§! พรอมเปน§Yนายพล§!ระดับ 3"
 IRQ_abd_al_illah_fm_tt: "§Yอับดุล อิลาห§! พรอมเปน§Yจอมพล§!ระดับ 3"
 IRQ_greater_iraq: "มหาอิรัก"
 IRQ_greater_iraq_desc: "เมื่อประชากรอาหรับสัดสวนที่มากขึ้นอยูภายใตการปกครองของเราอยางปลอดภัยแลว ก็สมควรที่เราจะเฉลิมฉลองโอกาสนี้ดวยการประกาศสถาปนา[IRQ.GetNonIdeologyName]ในความหมายที่กวางขึ้น"
 IRQ_greater_iraq_tt: "ปลดล็อกการตัดสินใจ §Y$greater_iraq_decision_cat$§! เพื่อรับดินแดนหลักในรัฐตะวันออกกลางที่เราครอบครอง"
 IRQ_arab_republic_core_tt: "ปลดล็อกการตัดสินใจ §Y$united_arab_republic_cat$§! เพื่อรับดินแดนหลักในรัฐอาหรับที่เราครอบครอง"
 IRQ_take_advantage_of_british_weakness: "ฉวยโอกาสจากสถานการณ"
 IRQ_take_advantage_of_british_weakness_desc: "หากเราตองการขับไลชาว[ENG.GetAdjective]ออกจากภูมิภาค เราอาจไมมีโอกาสดีเทาตอนนี้อีกแลว ขณะที่พวกเขากําลังวุนกับความขัดแยงทั่วโลก จงโจมตีใหพวกเขาไมอาจฟนตัวไดอีก"
 IRQ_arab_dominance: "ความเปนใหญของอาหรับ"
 IRQ_arab_dominance_desc: "[IRQ.GetNonIdeologyName]เปนชาติที่หลากหลาย แตมีเพียงการตอกยํ้าความเปนใหญทางการเมืองของชาวอาหรับซึ่งเปนคนสวนใหญเทานั้น ที่เราจะหวังรักษารัฐบาลใหมีเสถียรภาพได"
 IRQ_rally_the_arab_world: "รวมพลังโลกอาหรับ"
 IRQ_rally_the_arab_world_desc: "โลกอาหรับปรารถนาจะสลัดพันธนาการของมหาอํานาจตะวันตก เราจะรวมกันรวมชาวอาหรับเปนหนึ่งเดียวและสถาปนาตนเปนนายแหงชะตากรรมของตนเองอีกครั้ง"
 IRQ_regime_change_in_arabia: "เปลี่ยนระบอบในอาระเบีย"
 IRQ_regime_change_in_arabia_desc: "ราชวงศซะอูดไมอาจไววางใจใหเปนพันธมิตรตอตานมหาอํานาจได จึงตองถูกกําจัดกอนจะกลายเปนภัยคุกคาม"
 IRQ_iran_ultimatum: "กดดันการอางสิทธิ์เหนืออาระเบียสถาน"
 IRQ_iran_ultimatum_desc: "ชาวอาหรับจํานวนมากอาศัยอยูในภูมิภาคตะวันตกของ[PER.GetName] บางทีอาจถึงเวลาเรียกรองใหพวกเขารวมเขากับชาติของเรา เพื่อปกปองพวกเขาจากการปกครองของ[PER.GetAdjective]"
 IRQ_iran_ultimatum_tt2: ""
 IRQ_iran_ultimatum_tt: "§Yหาก[PER.GetNameDef]ปฏิเสธที่จะยกดินแดน เราจะมีทางเลือกที่จะประกาศสงครามกับพวกเขา§!"
 IRQ_liberate_levant: "ปลดปลอยลิแวนต"
 IRQ_liberate_levant_desc: "ลิแวนตถูกแบงแยกโดยผูชนะในมหาสงคราม ซึ่งนํามาแตการนองเลือดและความทุกขยากแกผูคนในภูมิภาค เราไมอาจนิ่งดูดายขณะที่เครือญาติของเราตองเผชิญชะตากรรมเชนนี้อีกตอไป"
 IRQ_liberate_north_africa: "ปลดปลอยแอฟริกาเหนือ"
 IRQ_liberate_north_africa_desc: "แอฟริกาเหนือถูกบดขยี้ใตรองเทาบูตจักรวรรดินิยมของชาวยุโรปมานานเกินไปแลว ถึงเวลาที่จะปลดปลอยและนําพวกเขากลับคืนสูออมอก"
 IRQ_proclaim_united_arab_republic: "ประกาศสาธารณรัฐอาหรับสหรัฐ"
 IRQ_proclaim_united_arab_republic_desc: "ความฝนถึงชาติอาหรับที่รวมเปนหนึ่งของเรากําลังเริ่มเปนจริง เราตองควาโอกาสนี้ประกาศสถาปนาสาธารณรัฐอาหรับสหรัฐ และปลุกระดมประชาชนใหมารวมอุดมการณของเรา"
 IRQ_request_syria_from_vichy: "ขอซีเรีย"
 IRQ_request_syria_from_vichy_desc: "ฝรั่งเศสไมเคยแตกแยกและออนแอเทานี้มากอน นี่คือโอกาสอันเหมาะเจาะที่จะเรียกรองใหโอนดินแดนซีเรียของพวกเขามาอยูใตการควบคุมของเรา"
 AT_PEACE_WITH_SYRIA_OWNER_TT_NOT: "ไมไดอยูในสงครามกับซีเรีย"
 IRQ_unite_mashriq: "รวมมัชริก"
 IRQ_unite_mashriq_desc: "มัชริกคือหัวใจที่เตนอยูของโลกอิสลาม เราจะไมหยุดพักจนกวาดินแดนทั้งหมดจะอยูใตการควบคุมของกาหลิบ"
 IRQ_discuss_a_new_treaty: "หารือสนธิสัญญาฉบับใหม"
 IRQ_discuss_a_new_treaty_desc: "สนธิสัญญาแองโกล-อิรักถูกเจรจาขึ้นเมื่อเรายังเปนเพียงชาติที่เยาววัยและออนแอ บัดนี้เราเปนมหาอํานาจอันดับหนึ่งของโลกอิสลาม และสนธิสัญญาเชนนั้นคือการหมิ่นเกียรติผูนําของเรา ถึงเวลาแลวที่จะเจรจาสนธิสัญญาฉบับใหมกับชาว[ENG.GetAdjective]"
 IRQ_unite_maghreb: "รวมมัฆริบ"
 IRQ_unite_maghreb_desc: "มัฆริบเปนสวนสําคัญของโลกอิสลามที่ทนทุกขภายใตการปกครองของตะวันตกมานานเกินไป ดวยพลังอํานาจที่เพิ่งไดมา เราจะรวมดินแดนนี้ไวภายใตการปกครองของเราและขับไลพวกจักรวรรดินิยมออกไปใหสิ้น"
 IRQ_unite_maghreb_tt: "ไดรับเปาหมายสงคราม §Yยึดคืนรัฐดินแดนหลัก §!ตอทุกประเทศที่ยึดครองรัฐซึ่งแผนยุทธศาสตรนี้มอบดินแดนหลักให"
 IRQ_arab_league: "กอตั้งสันนิบาตอาหรับ"
 IRQ_arab_league_desc: "เราตองสรางพันธมิตรของชาติอาหรับที่มีแนวคิดเดียวกัน โดยมีเปาหมายเพื่อปกปองผลประโยชนของอาหรับจากการแทรกแซงภายนอก และปลดปลอยผูที่อยูนอกพรมแดนของเราจากการยึดครอง"
 IRQ_arab_league_economic_cooperation: "สภาเศรษฐกิจแหงสันนิบาตอาหรับ"
 IRQ_arab_league_economic_cooperation_desc: "เพื่อกระชับภราดรภาพระหวางชาติอาหรับ เราควรพยายามรวมมือกันอยางใกลชิดยิ่งขึ้นในภาคเศรษฐกิจ"
 IRQ_arab_league_economic_cooperation_tt: "เราจะไดรับ§Yโรงงานพลเรือน§!นอกแผนที่หนึ่งแหงสําหรับ§Yรัฐอาหรับ§!อื่นแตละรัฐที่มี§Yความคิดเห็น§!ตอเราสูงกวา §G85§! ซึ่งรวมถึง §Y[KUW.GetNameWithFlag]§!, §Y[JOR.GetNameWithFlag]§!, §Y[SYR.GetNameWithFlag]§!, §Y[PAL.GetNameWithFlag]§!, §Y[BHR.GetNameWithFlag]§!, §Y[SAU.GetNameWithFlag]§!, §Y[QAT.GetNameWithFlag]§!, §Y[UAE.GetNameWithFlag]§!, §Y[OMA.GetNameWithFlag]§!, §Y[IMO.GetNameWithFlag]§!, §Y[YEM.GetNameWithFlag]§!, §Y[FSA.GetNameWithFlag]§!, §Y[EGY.GetNameWithFlag]§!, §Y[SUD.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§!, §Y[ALG.GetNameWithFlag]§!, §Y[TUN.GetNameWithFlag]§!, §Y[MOR.GetNameWithFlag]§!, §Y[RIF.GetNameWithFlag]§!, §Y[WES.GetNameWithFlag]§!, §Y[MRT.GetNameWithFlag]§! และ §Y[LEB.GetNameWithFlag]§!"
 IRQ_expand_membership: "ขยายสมาชิกภาพสหพันธรัฐ"
 IRQ_expand_membership_desc: "ขณะที่บางคนเยยหยันแนวคิดสหพันธรัฐของเรา คนอื่น ๆ กลับมองความสําเร็จของเราดวยความทึ่ง บางทีอาจถึงเวลาขยายสมาชิกภาพใหแกผูที่ฉลาดพอจะตระหนักวาเราแข็งแกรงกวาเมื่ออยูดวยกัน"
 IRQ_expand_membership_tt: "ปลดล็อกการตัดสินใจ §Y$hashemite_federation_cat$§! เพื่อเชิญสมาชิกมาเปนรัฐหุนเชิดของคุณ"
 IRQ_restore_al_andalus: "ฟนฟูอัล-อันดะลุส"
 IRQ_restore_al_andalus_desc: "ชาวสเปนอาจคิดวาตนเปนเจาแหงคาบสมุทรไอบีเรีย แตนานกอนที่ชาติของพวกเขาจะถือกําเนิด ที่นี่คืออัล-อันดะลุส การนําดินแดนนี้กลับคืนสูโลกอิสลามจะเปนความพายแพที่ชาวยุโรปไมมีวันลืม"
 
 IRQ_promote_kurdish_culture: "สงเสริมอัตลักษณเคิรด"
 IRQ_promote_kurdish_culture_desc: "ชาวเคิรดกระจัดกระจายอยูในหลายประเทศ แตวัฒนธรรมของเราผูกพันเราไวดวยกันไมวาจะอาศัยอยูที่ใด เราตองสงเสริมและปกปองมรดกนั้นกอนที่จะถูกทําลายโดยผูที่ปกครองเรา"
 IRQ_has_become_kurdistan_flag: "กลายเปนเคอรดิสถานแลว"
 IRQ_kurdish_democratic: "พรรคประชาธิปไตยเคอรดิสถาน"
 IRQ_kurdish_democratic_desc: "สิทธิของชาวเคิรดถูกเหยียบยํ่าทุกวันโดยชาวอาหรับซึ่งเปนคนสวนใหญของ[IRQ.GetNameDef] ถึงเวลาแลวที่เราจะกอตั้งขบวนการทางการเมืองของเราเอง โดยมีเปาหมายเพื่อสรางชาติที่เสรีและเปนอิสระใหแกประชาชนของเรา"
 IRQ_kurdish_socialist: "ขอความชวยเหลือจากโซเวียต"
 IRQ_kurdish_socialist_desc: "[SOU.GetNameDefCap]ปรารถนาหาหนทางบอนทําลายการครอบงําตะวันออกกลางของตะวันตก บางทีพวกเขาอาจยินดีชวยเหลือเราในการตอสูกับรัฐบาล[IRQ.GetAdjective] และโดยนัยคือกับชาว[ENG.GetAdjective]"
 IRQ_kurdish_revolt: "เปดฉากการกอกบฏ"
 IRQ_kurdish_revolt_desc: "ถึงเวลาแลวที่จะประกาศเอกราชจาก[IRQ.GetNonIdeologyName] และสรางชาติที่เสรีอยางแทจริงใหแกชาวเคิรด"
 IRQ_kurdish_revolt_tt: "เราจะประกาศเอกราชจาก§Yรัฐอิรัก§! ซึ่งจะนําเราเขาสู§Rสงครามประกาศเอกราช§!กับพวกเขา"
 kurdistan_exists_tt: "เคอรดิสถานมีอยู"
 IRQ_kurdish_language: "โรงเรียนภาษาเคิรด"
 IRQ_kurdish_language_desc: "ดวยเอกราชที่เพิ่งไดมา ในที่สุดเราก็สามารถเริ่มสรางระบบการศึกษาที่มีวัฒนธรรมและภาษาเคิรดเปนศูนยกลาง"
 IRQ_kurdish_industry: "ขยายฐานอุตสาหกรรม"
 IRQ_kurdish_industry_desc: "เพื่อไมใหถูกเพื่อนบานที่แข็งแกรงกวากลืนกิน เราตองพัฒนาฐานอุตสาหกรรมของเราเอง"
 IRQ_kurdish_oil: "นํ้ามันเคิรด"
 IRQ_kurdish_oil_desc: "แหลงนํ้ามันทั่วดินแดนของเราถูกขุดเจาะขึ้นมาในชวงไมกี่ปที่ผานมา แตความมั่งคั่งที่เกิดขึ้นกลับถูกสูบออกไปจากพื้นที่ บัดนี้ในที่สุดเราก็อาจสรางอุตสาหกรรมนํ้ามันของเราเองและใชความมั่งคั่งนั้นเพื่อประชาชนของเรา"
 IRQ_kurdish_form_the_peshmerga: "กอตั้งเพชเมอรกา"
 IRQ_kurdish_form_the_peshmerga_desc: "แมการกอกบฏของเราจะประสบความสําเร็จในการบดขยี้กองทัพอิรัก แตในอนาคตเราอาจไมโชคดีเชนนั้น เราจึงจะจัดตั้งกองทัพแหงชาติที่มีการฝกทางทหารอยางแทจริงและยุทโธปกรณทันสมัย เพื่อยับยั้งไมใหความขัดแยงเกิดขึ้นตั้งแตแรก"
 IRQ_effectivize_the_production_line: "การปรับสายการผลิตใหเหมาะสม"
 IRQ_effectivize_the_production_line_desc: "การพยายามเพียงครั้งเดียวไมเพียงพอที่จะรักษาเอกราชของเราในอนาคต เราจึงตองออกมาตรการเพื่อใหแนใจวาเราจะพัฒนาอยางตอเนื่องเมื่อเวลาผานไป"
 IRQ_kurdish_women_in_military: "สตรีในกองทัพ"
 IRQ_kurdish_women_in_military_desc: "ทัศนคติลาสมัยที่วาสตรีตองอยูหางจากการสูรบตองถูกขจัดไป หากเราจะพัฒนากองทัพที่แข็งแกรงพอจะยืนหยัดตอเพื่อนบานได"
 IRQ_kurdish_support_resistance: "สนับสนุนการตอตานในตางแดน"
 IRQ_kurdish_support_resistance_desc: "ขณะที่ประชาชนภายในพรมแดนของเราไดรับเสรีภาพอยางแทจริง ยังมีพี่นองของเราอีกมากมายที่ติดอยูใตการปกครองของมหาอํานาจตางชาติ เราตองสนับสนุนพวกเขาในความพยายามที่จะปลดแอก"
 IRQ_kurdish_reject_ankara_treaty: "ปฏิเสธสนธิสัญญาอังการา"
 IRQ_kurdish_reject_ankara_treaty_desc: "สนธิสัญญาอังการาทําลายความพยายามกอนหนานี้ในการสรางชาติใหแกชาวเคิรด เราตองแสดงใหโลกเห็นอยางชัดเจนวาเราปฏิเสธพรมแดนที่สนธิสัญญานั้นกําหนดขึ้น และเราจะไมหยุดพักจนกวาชาวเคิรดจะรวมเปนหนึ่งเดียว"
 IRQ_further_ussr_support: "การสนับสนุนเพิ่มเติมจาก[SOV.GetAdjective]"
 IRQ_further_ussr_support_desc: "ในชวงแรกของเสนทางสูเสรีภาพ เราพึ่งพาความชวยเหลือจาก[SOV.GetAdjective]เพื่อใหประสบความสําเร็จ การพึ่งพาผูอื่นไมใชสิ่งที่เราปรารถนาตั้งแตแรก แตหากโนมนาวใหพวกเขามองเราเปนผูเทาเทียมและสหายได ความสัมพันธนี้ก็อาจยังเกิดผลดีได"
 IRQ_support_from_skies_above: "การสนับสนุนจากฟากฟา"
 IRQ_support_from_skies_above_desc: "เมื่อพิจารณาสภาพแวดลอมรอบตัวเรา การพึ่งพาเพียงทหารราบและหนวยภาคพื้นดินคงไมใชทางเลือกที่ฉลาด แมการสรางกองทัพอากาศอาจมีคาใชจายสูง แตก็เปนมาตรการที่เราตองทํา"
 IRQ_support_from_skies_above_tt: "การอยูในฝายเดียวกับ §Y[SOV.GetNameWithFlag]§! และพวกเขามีเครื่องบิน§Yสนับสนุนทางอากาศโดยใกลชิด§! จะมอบเครื่องบิน§Yสนับสนุนทางอากาศโดยใกลชิด 100§! ลําใหแก §Y[ROOT.GetNameWithFlag]§!"
 IRQ_support_from_the_mountains: "ความเชี่ยวชาญการรบบนภูเขา"
 IRQ_support_from_the_mountains_desc: "เมื่อเรามีเทือกเขาสูงชันหลายแนวลอมรอบ การฝกและยุทโธปกรณที่ออกแบบมาเพื่อการรบในพื้นที่เหลานี้จะชวยเราไดอยางมาก คาใชจายเริ่มตนจึงไมควรเปนอุปสรรค"
 IRQ_kurdish_attack_turkey: "ปลดปลอยชาวเคิรดในตุรกี"
 IRQ_kurdish_attack_turkey_desc: "ชาว[TUR.GetAdjective]กดขี่ชาวเคิรดภายในพรมแดนของตนอยางแข็งขัน และพรากมรดกของพวกเขาไป เราไมอาจทนตอสิ่งนี้ไดอีกตอไป แมจะหมายถึงการปลดปลอยประชาชนของเราดวยกําลังก็ตาม"
 IRQ_kurdish_attack_iran: "ปลดปลอยชาวเคิรดในอิหราน"
 IRQ_kurdish_attack_iran_desc: "ระบอบ[PER.GetAdjective]เปนภัยตอประชาชนของเรา มีเพียงการปลดปลอยชาวเคิรดภายในพรมแดนของพวกเขาดวยกําลัง และการเอาชนะกองทัพ[PER.GetAdjective]ดวยมือของเราเทานั้น ที่จะสรางอนาคตใหแกประชาชนของเราได"
 IRQ_kurdish_united: "เคอรดิสถานที่เปนหนึ่งเดียว"
 IRQ_kurdish_united_desc: "ผานความยากลําบากและการตอสูอันใหญหลวง ในที่สุดเราก็รวมชาวเคิรดไวภายใตการปกครองของเราได ไมวาสิ่งใดจะเกิดขึ้นตอจากนี้ เราจะยืนหยัดเปนประชาชนที่เปนหนึ่งเดียว"

