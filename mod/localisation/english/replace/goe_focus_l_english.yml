 RAJ_heavy_industries: "อุตสาหกรรมหนัก"
 RAJ_heavy_industries_desc: "การพัฒนาอุตสาหกรรมอยางรวดเร็วเปนสิ่งจําเปนตอการรักษาอนาคตของ[RAJ.GetName] ดวยการพัฒนาภาคอุตสาหกรรมหนักที่แข็งแกรง เราจะวางรากฐานสําหรับความแข็งแกรงทางทหารและความเปนอิสระทางเศรษฐกิจในโลกยุคใหม"
 
 RAJ_strike_against_china: "โจมตี[CHI.GetName]"
 RAJ_strike_against_china_desc: "หาก[CHI.GetName]กลายเปนมหาอํานาจระดับภูมิภาค พวกเขาจะโจมตีเรา อาจไมใชวันนี้ แตวันพรุงนี้แนนอน เราตองลงมือกอน"

 RAJ_strike_burma: "โจมตี[BRM.GetNameDef]"
 RAJ_strike_burma_desc: "การดํารงอยูตอไปของ[BRM.GetName]เปนภัยคุกคามทางยุทธศาสตรตอชายแดนตะวันออกของเรา การนํามันมาอยูใตการควบคุมจะทําใหเรารักษาชายแดนไวไดและขจัดฐานที่มั่นที่อาจเปนของมหาอํานาจตางชาติ"


