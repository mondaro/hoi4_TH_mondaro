 RAJ_navy_shortcut: "กองทัพเรืออินเดีย"
 RAJ_airforce_shortcut: "กองทัพอากาศอินเดีย"

 RAJ_constitution_for_the_masses: "รัฐธรรมนูญเพื่อมวลชน"
 RAJ_constitution_for_the_masses_desc: "สาธารณรัฐประชาชนไมอาจตั้งอยูบนกฎหมายจักรวรรดิเกาได\nรัฐธรรมนูญฉบับใหมตองสะทอนเจตจํานงของกรรมกร ชาวนา และผูไรที่ดิน มิใชอารมณของกษัตริยหรือขาหลวงอาณานิคม"
 
 RAJ_founding_of_the_peoples_republic: "สถาปนาสาธารณรัฐประชาชน"
 RAJ_founding_of_the_peoples_republic_desc: "เราไดโคนลมระเบียบเกาแลว\nบัดนี้ภารกิจสรางระเบียบใหมไดเริ่มตนขึ้น ระเบียบที่หลอมขึ้นโดยประชาชน เพื่อประชาชน และคํ้าจุนดวยการปฏิวัติ"
 
 RAJ_agrarian_socialism: "สังคมนิยมเกษตรกรรม"
 RAJ_agrarian_socialism_desc: "การปฏิวัติเริ่มตนในทองทุง\nจงคืนผืนดินใหแกผูไถหวาน และใหหมูบานปกครองตนเองในนามของความเสมอภาคและความยุติธรรม"
 
 RAJ_urban_industrialism: "อุตสาหกรรมนิยมในเมือง"
 RAJ_urban_industrialism_desc: "อนาคตไมไดอยูในทุงหญา แตอยูในโรงงาน\nมีเพียงการพัฒนาอุตสาหกรรมอยางรวดเร็วเทานั้นที่จะปกปองการปฏิวัติและเตรียมพรอมสําหรับการตอสูขางหนา"
 RAJ_urban_industrialism_tt: "สิ่งนี้จะปรับแผนหาปใหมุงเนนการขยายอุตสาหกรรมมากขึ้น โดยใหความเร็วการกอสราง §G+10%§!"
 RAJ_urban_industrialism_tt2: "สิ่งนี้จะปรับแผนหาปใหมุงเนนสังคมนิยมเกษตรกรรมมากขึ้น โดยให:"
 
 RAJ_land_of_the_tillers: "ผืนดินของผูไถหวาน"
 RAJ_land_of_the_tillers_desc: "เจาที่ดินหมดไปแลว แตการตอสูยังคงอยู\nเราจะกระจายที่ดินและทําลายโซตรวนสุดทายของระบบศักดินา ทีละแปลง ทีละหมูบาน"
 
 RAJ_focus_on_the_countryside: "มุงเนนชนบท"
 RAJ_focus_on_the_countryside_desc: "พลังของเราอยูที่ผูคนนับลานที่ผูกพันกับผืนดิน\nจงลงทุนในพวกเขา ติดอาวุธใหพวกเขา และจัดตั้งพวกเขา การปฏิวัติเปนของหมูบาน"
 
 RAJ_decentralize_the_party: "กระจายอํานาจพรรค"
 RAJ_decentralize_the_party_desc: "อํานาจไมควรไหลออกมาจากสํานักงานในอินทรปรัสถ\nจงใหประชาชนนําทางการปฏิวัติผานสภาทองถิ่นและโซเวียตชนบท"
 
 RAJ_industrialize_the_ganges: "พัฒนาอุตสาหกรรมลุมนํ้าคงคา"
 RAJ_industrialize_the_ganges_desc: "แมนํ้าคงคาหลอเลี้ยงเรามาหลายศตวรรษ\nบัดนี้จะใหพลังแกเครื่องจักร เปนเชื้อเพลิงแกเตาหลอม และติดอาวุธใหกองทัพของเรา"
 
 RAJ_comrades_of_the_city: "สหายแหงนคร"
 RAJ_comrades_of_the_city_desc: "กรรมกรในเมืองคือกองหนา\nดวยการศึกษา เครื่องมือ และความสามัคคี พวกเขาจะนําสาธารณรัฐสูความทันสมัย"
 
 RAJ_central_comittee_authority: "อํานาจคณะกรรมการกลาง"
 RAJ_central_comittee_authority_desc: "วินัยคือพลัง\nคณะกรรมการกลางจะกํากับดูแลการปกครองทุกดาน เพื่อมิใหการปฏิวัติหลงทางไปสูความโกลาหล"
 
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry: "ปรับทิศทางแผนหาป"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc: "ความเร็วในการพัฒนาอุตสาหกรรมขณะนี้ยังไมเพียงพอ\nเราตองใหความสําคัญกับอุตสาหกรรมหนักและผลผลิตเหล็กกลาเปนอันดับแรก หากจะปกปองการปฏิวัติของเรา"
 
 RAJ_invite_soviet_industrial_experts: "เชิญผูเชี่ยวชาญอุตสาหกรรมโซเวียต"
 RAJ_invite_soviet_industrial_experts_desc: "โซเวียตมีประสบการณในการสรางฐานอุตสาหกรรมจากความวางเปลา\nจงเรียนรูจากแบบอยางของพวกเขาและเรงการเปลี่ยนแปลงของเราเอง"
 
 RAJ_planned_economy2: "ผนึกกําลังเศรษฐกิจแบบวางแผน"
 RAJ_planned_economy2_desc: "ตลาดไมมีที่ยืนในการปฏิวัติ\nทุกทรัพยากร ทุกแรงงาน และทุกโรงงานตองรับใชแผนหาป"
 
 RAJ_the_red_curtain_falls_over_asia: "มานแดงคลุมเอเชีย"
 RAJ_the_red_curtain_falls_over_asia_desc: "เราไดปกปองมาตุภูมิไวแลว\nบัดนี้ถึงเวลานําเปลวไฟแหงการปฏิวัติไปสูเพื่อนบาน ดวยคําพูด ดวยใบปลิว หรือดวยปน"
 RAJ_the_red_curtain_falls_over_asia_desc_tt: "ปลดล็อกการตัดสินใจเพื่อเผยแพรการปฏิวัติคอมมิวนิสตทั่วเอเชีย"
 
 RAJ_red_punjab_operation: "ปฏิบัติการปญจาบแดง"
 RAJ_red_punjab_operation_desc: "เมืองหลวงของเราเสี่ยงตอการรุกรานจากตางชาติ เราตองขยายเขตความมั่นคงรอบเมืองหลวง"
 
 RAJ_secure_rajahsthan: "ยึดราชสถานใหมั่น"
 RAJ_secure_rajahsthan_desc: "ทะเลทรายแหงราชสถานตองไมกลายเปนฐานของการตอตานการปฏิวัติ\nเราจะนํารัฐนี้เขามาอยูในออมอกของเรา"
 
 RAJ_strike_eastern_pakistan: "โจมตีปากีสถานตะวันออก"
 RAJ_strike_eastern_pakistan_desc: "ปกตะวันออกของ[PAK.GetName]โดดเดี่ยวและไรเสถียรภาพ\nบัดนี้คือเวลาที่จะโจมตี กอนที่พวกเขาจะตั้งหลักไดมั่นคง"
 
 RAJ_mass_assault: "การจูโจมดวยคลื่นมนุษย"
 
 RAJ_defenders_of_the_revolution_idea_tt: "เพิ่มเทคโนโลยี: §Yการจูโจมดวยคลื่นมนุษยแหงการปฏิวัติ§!"
 
 revolutionary_mass_assault: "การจูโจมดวยคลื่นมนุษยแหงการปฏิวัติ"
 
 RAJ_arm_the_peasantry: "ติดอาวุธใหชาวนา"
 RAJ_arm_the_peasantry_desc: "การปฏิวัติตองไปถึงทุกทองทุง\nเราจะแจกจายอาวุธใหกองกําลังอาสาชนบทที่ภักดี เพื่อไมใหมีหมูบานใดไรการปองกันตอพวกปฏิกิริยา"
 
 RAJ_every_man_a_gun: "ทุกคนมีปน"
 RAJ_every_man_a_gun_desc: "ในสาธารณรัฐประชาชน พลเมืองทุกคนคือทหาร\nเราจะจัดมาตรฐานการฝกและติดอาวุธใหประชาชนจํานวนมหาศาล เปลี่ยนชาติทั้งชาติใหเปนปอมปราการ"
 
 RAJ_every_man_a_leader: "ทุกคนเปนผูนํา"
 RAJ_every_man_a_leader_desc: "พลังการปฏิวัติที่แทจริงไมไดมาจากคําสั่ง แตมาจากความริเริ่ม\nเราจะฝกผูบังคับบัญชาทองถิ่นและผูนํากองกําลังอาสาใหตัดสินใจอยางเด็ดขาดโดยไมตองรอการอนุญาต"
 
 RAJ_defenders_of_the_revolution: "ผูพิทักษการปฏิวัติ"
 RAJ_defenders_of_the_revolution_desc: "พวกเขาไมใชทหาร พวกเขาคือผูพิทักษอุดมการณ\nเราจะยกระดับนักรบที่มีวินัยและภักดีที่สุดขึ้นเปนกองกําลังชั้นยอด ผูปกปองทั้งผืนดินและอุดมการณ"
 
 RAJ_education_for_the_masses: "การศึกษาเพื่อมวลชน"
 RAJ_education_for_the_masses_desc: "หากปราศจากความรู การปฏิวัติจะเสื่อมลงเปนทรราช\nการรูหนังสือ การศึกษาทางการเมือง และการฝกดานวิทยาศาสตรจะถูกนําไปสูทุกหมูบานและโรงงาน"
 
 RAJ_break_the_zamindars: "ทลายพวกซามินดาร"
 RAJ_break_the_zamindars_desc: "เจาที่ดินคือโครงกระดูกของระบอบเกา\nเราจะรื้อถอนที่ดินของพวกเขา ยึดผืนดิน และกระจายอํานาจของพวกเขาใหปลิวไปตามลม"
 
 RAJ_planned_but_decentralized: "วางแผนแตกระจายอํานาจ"
 RAJ_planned_but_decentralized_desc: "เราจะยังคงวางแผนเศรษฐกิจ แตใหอํานาจปกครองตนเองแกกลุมสหกรณทองถิ่น\nประสิทธิภาพผานอุดมการณ ไมใชระบบราชการ"
 
 RAJ_socialist_self_reliance: "การพึ่งพาตนเองแบบสังคมนิยม"
 RAJ_socialist_self_reliance_desc: "เราจะไมพึ่งพาสินคานําเขาของนายทุนหรือที่ปรึกษาจักรวรรดินิยม\nอินเดียจะเลี้ยงตนเอง ติดอาวุธตนเอง และยืนหยัดเพียงลําพังหากจําเปน"
 
 RAJ_quality_training: "การฝกที่มีคุณภาพ"
 RAJ_quality_training_desc: "ปริมาณเพียงอยางเดียวไมชนะสงคราม\nเราจะจัดมาตรฐานโครงการฝก ปรับปรุงการสอนนายทหาร และยกระดับความเปนมืออาชีพของกองทัพ"
 
 RAJ_iron_will_indoctrination: "การปลูกฝงเจตจํานงเหล็ก"
 RAJ_iron_will_indoctrination_desc: "ความแข็งแกรงไมไดอยูที่รางกายเทานั้น แตอยูที่ความเชื่อ\nเราจะปลูกฝงวินัยอยางเบ็ดเสร็จ ความชัดเจนทางอุดมการณ และเจตจํานงที่จะสูอยางไมมีวันแตกหักใหแกทหารทุกนาย"
 
 RAJ_purge_the_reactionaries: "กวาดลางพวกปฏิกิริยา"
 RAJ_purge_the_reactionaries_desc: "ไมมีการประนีประนอมกับโลกเกา\nศัตรูของการปฏิวัติ ผูกอวินาศกรรม และกลุมตอตานการปฏิวัติจะถูกถอนรากถอนโคน"
 
 RAJ_stopping_the_japanese_threat_into_central_asia: "หยุดภัยคุกคามญี่ปุนในเอเชียกลาง"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc: "ความทะเยอทะยานของญี่ปุนไมไดสิ้นสุดที่พรมแดนจีน บัดนี้พวกเขาหันมามองเอเชียกลาง ซึ่งอาจเปนฐานกระโดดสูการขยายจักรวรรดิตอไป\nเราตองลงมืออยางรวดเร็ว ดวยการเสริมกําลังพรมแดนดานตะวันออก เราจะหยุดกระแสการพิชิตกอนที่จะไปถึงทุงหญาสเตปปและไกลกวานั้น"
