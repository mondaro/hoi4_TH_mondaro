 RAJ_road_to_independence_shortcut: "เสนทางสูเอกราช"
 RAJ_majestys_government_shortcut: "รัฐบาลผูภักดี"
 RAJ_railways_shortcut: "การรถไฟ"
 RAJ_army_shortcut: "นายทหาร"
