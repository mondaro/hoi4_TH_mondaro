 RAJ_GOE_enforced_peace_decision_desc_eng_tt: "หาก[RAJ.GetName]ยืนหยัดไดนานพอ รัฐบาล[UK_INDIA.GetAdjective]จะเสนอการหยุดยิงพรอมการยกดินแดนใหแกพวกเขา"
 RAJ_GOE_enforced_peace_decision_desc_2_tt: "§Yเราจะยังคงควบคุมภูมิภาคใดก็ไดตอไปนี้§!: §Yอินเดียตะวันตก§!, §Yอินเดียใต§!, §Yอินเดียกลาง§!, §Yอินเดียตะวันออก§! และ§Yอินเดียเหนือ§! หากเราควบคุมทุกรัฐในภูมิภาคนั้นไดเมื่อการหยุดยิงมีผล"
 
