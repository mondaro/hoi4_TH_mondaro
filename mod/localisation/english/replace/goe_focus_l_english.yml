 PER_recruit_rebels_tt: "ปลดล็อกแมแบบกองพล §Yกบฏบัคติยารี§! และ §Yกบฏกัชไก§! และเกณฑอยางละ §Yสอง§! หนวยที่ §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_white_peace_tt: "จะสง§Yเหตุการณ§!ไปยังศัตรูของเราเพื่อเรียกรอง§Yสันติภาพแบบไมมีเงื่อนไข§! ซึ่งจะทําใหเรา§Yรักษาดินแดนเดิมของเราไวได§!"
 PER_reparations_tt: "จะสง§Yเหตุการณ§!ไปยังศัตรูของเราเพื่อเรียกรอง§Yสันติภาพ§!และ§Yคาปฏิกรรมสงคราม§!ในรูปของ§Yโรงงาน§! พรอม§Yบทลงโทษ§!ตอผูรุกราน หากประเทศศัตรูเปน§Yเพื่อนบานติดกัน§! พวกเขาจะยกดินแดนชายแดนใหแก§Yเรา§!แทน"
 PER_swear_fealty_tt: "จะสง§Yเหตุการณ§!ไปยังศัตรูของเราเพื่อขอยอมจํานนและเขารวมกับพวกเขาในฐานะ§Yรัฐหุนเชิด§! ซึ่งจะปลดล็อก§Yสายรัฐหุนเชิด§! ใหเราตัดสินใจวาจะดําเนินการตออยางไร"
 PER_push_negotiations_tt: "จะสง§Yเหตุการณ§!ไปยังศัตรูของเราเพื่อเสนอ§Yสิทธิ์ในทรัพยากร§!แกผูกอความขัดแยงครั้งแรก แลกกับ§Yสันติภาพแบบไมมีเงื่อนไข§! หากพวกเขาปฏิเสธ เราจะยังคงอยูในภาวะสงคราม"
 PER_preemptive_invasion_of_iran_tt: "เมื่อ[PER.GetNameDef]ยอมจํานน เราจะทําใหประเทศนั้นเปนรัฐหุนเชิด ผนวกรัฐบางสวนตามแนวชายแดนของเรา และไดรับสิทธิ์ในทรัพยากรในรัฐของ[PER.GetAdjective]ที่อุดมดวยนํ้ามัน เราจะสามารถขอให[SOU.GetAdjective]เขาแทรกแซงเพื่อดําเนินปฏิบัติการรวมกันได"
 PER_territory_demands_tt: "การนี้จะสงขอเรียกรองไปยังประเทศดังกลาว เพื่อขอใหพวกเขา§Yสงมอบ§!ดินแดนชายแดนใหแกเรา พวกเขามีแนวโนมจะยอมมากขึ้นหากกองทัพของเรา§Yทรงพลัง§!กวา"
 PER_reinstate_qajars_tt: "จะเปดใช§Yเหตุการณ§!ตอเนื่องที่ทําใหเราสามารถฟนฟูราชวงศกาจารขึ้นสูบัลลังกของ[PER.GetNameDef]"
 PER_republic_of_mahabad_tt: "จะปลดปลอย[KUR.GetNameDef]เปน §Yสาธารณรัฐมะฮาบาด§!"

