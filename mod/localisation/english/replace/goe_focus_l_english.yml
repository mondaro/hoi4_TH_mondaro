 RAJ_form_ties_with_leftist_parties: "สรางสัมพันธกับพรรคฝายซาย"
 RAJ_form_ties_with_leftist_parties_desc: "เราตองรวบรวมการสนับสนุนจากกลุมสังคมนิยมและคอมมิวนิสตในประเทศ"
