 RAJ_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"

 RAJ_seek_financial_aid_from_the_ussr: "ขอความชวยเหลือทางการเงินจาก[SOU.GetNameDef]"
 RAJ_seek_financial_aid_from_the_ussr_desc: "เพื่อผลักดันเปาหมายแหงการปฏิวัติและเรงการพัฒนาชาติ เราจะหันไปขอความชวยเหลือทางการเงินจาก[SOU.GetNameDefCap] การสนับสนุนของพวกเขาจะชวยใหเราสรางระเบียบใหมที่ตั้งอยูบนความเปนปกแผนและความแข็งแกรง"

 RAJ_guided_democracy: "ประชาธิปไตยแบบชี้นํา"
 RAJ_guided_democracy_desc: "กระบวนการประชาธิปไตยที่บริหารจัดการอยางรอบคอบจะใหภาพลักษณของการมีทางเลือก ขณะที่รับประกันวาผลลัพธยังคงอยูใตการควบคุมของเราอยางมั่นคง เสถียรภาพตองอาศัยการชี้นํา และเราพรอมจะมอบมันให"

 RAJ_authoritarianship: "อํานาจนิยม"

 RAJ_authoritarianship_desc: "อํานาจรวมศูนยที่เขมแข็งจะรับประกันสันติภาพ ความยุติธรรม และเสถียรภาพแกรัฐใหมของเรา"

 RAJ_the_sun_sets: "ตะวันลับฟา"
 RAJ_the_sun_sets_desc: "ยุคแหงจักรวรรดิกําลังสิ้นสุดลง ขณะที่อํานาจของ[ENG.GetAdjective]ออนแอลง เราจะเรงความเสื่อมถอยของพวกเขา ในที่สุดดวงตะวันจะลับฟาเหนือจักรวรรดิของพวกเขา และเราจะผงาดขึ้นจากเงามืดนั้น"

### Mughal Empire ###
 RAJ_great_depression_price_controls: "การควบคุมราคาในยุคเศรษฐกิจตกตํ่าครั้งใหญ"
 RAJ_great_depression_price_controls_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญสงผลกระทบอยางหนักตออนุทวีป ดวยการผูกคาเงินรูปไวกับเงินปอนดสเตอรลิงและใชมาตรการควบคุมราคาตาง ๆ เราหวังวาจะทําใหสถานการณมีเสถียรภาพ"
 RAJ_look_to_the_past: "มองยอนอดีต"
 RAJ_look_to_the_past_desc: "การควบคุมราคาประสบความสําเร็จในการบรรเทาปจจัยหนึ่งของภาวะเศรษฐกิจตกตํ่าครั้งใหญ แตผลที่ตามมาคือมาตรการเหลานี้กําลังสรางความหายนะแกเศรษฐกิจ ดวยเงินเฟอที่พุงสูงจนควบคุมไมได ความสิ้นหวังนําไปสูความไมพอใจ และผูนําทองถิ่นจํานวนมากขึ้นกําลังไดรับพลังทางการเมืองจากการปลุกระดมประชาชนดวยเรื่องเลาถึงความยิ่งใหญในอดีต\nสิ่งที่เคยรุงเรืองจะหวนคืนมาไดหรือไม?"
 RAJ_secure_weapons: "จัดหาอาวุธ"
 RAJ_secure_weapons_desc: "ยุทโธปกรณทางทหารของเราเปนการผสมปนเปของรุนตาง ๆ จากหลายชาติ อยางไรก็ตาม ดวยความชวยเหลือเล็กนอยจากตางประเทศ เราสามารถไดรับยุทโธปกรณเพื่อเตรียมพรอมแยกตัวออก"
 RAJ_secure_weapons_tt: "อาวุธจะถูกเพิ่มเขาคลังเมื่อ§Y$RAJ_the_mughal_uprising$§!เสร็จสิ้น"
 RAJ_stir_unrest_in_the_north: "ปลุกปนความไมสงบในภาคเหนือ"
 RAJ_stir_unrest_in_the_north_desc: "ประชาชนในภาคเหนือของบริติชราชไดรับผลกระทบจากการควบคุมราคาอยางไมเปนธรรม พวกเขาเปรียบเสมือนหญาแหง สิ่งที่เราตองการมีเพียงประกายไฟเพื่อจุดเพลิง"
 RAJ_stir_unrest_in_the_north_focus_tt: "เราจะยังคงควบคุมรัฐตอไปนี้ไวเมื่อเราแยกตัวออก:"
 MUGHAL_divisions_spawned: "กองพลฝายภักดีที่มียุทโธปกรณครบครัน §Y4§! กองพลจะเขารวมกับเราเมื่อเรากอการลุกฮือ"
 RAJ_the_mughal_uprising: "การลุกฮือของโมกุล"
 RAJ_the_mughal_uprising_desc: " ดินแดนหางไกลทางเหนือเปนทําเลทางภูมิศาสตรที่สมบูรณแบบสําหรับการแยกตัวจากอังกฤษ\nผูนําทองถิ่นไดโหมไฟในใจประชาชนดวยเรื่องเลาถึงอดีตอันรุงโรจน ครั้งเมื่อราชวงศโมกุลปกครองดินแดนนี้ เปนอิสระที่จะแสวงหาชะตากรรมของตนเอง\nอินชาอัลลอฮ เราก็จะเปนเชนนั้น"
 RAJ_the_mughal_uprising_tt: "เราจะแยกตัวออกจาก§Yบริติชราช§!และ§Rประกาศสงครามเพื่อเอกราช§!"
 RAJ_the_mughal_uprising_tt2: "เราจะครอบครองทุกรัฐที่เราควบคุมอยูเมื่อสงครามกลางเมืองสิ้นสุดลง" #separate into two if I need to remove it later
 6_month_timer_mughal_tt: "เราจะมีเวลา §Y255§! วันเพื่อเอาชนะสงครามนี้ กอนที่ฝายบริหารที่ไดรับการกระจายอํานาจจะเสนอการหยุดยิง"
 RAJ_reform_the_agricultural_system: "ปฏิรูประบบเกษตรกรรม"
 RAJ_reform_the_agricultural_system_desc: "ระบบอาหารของอินเดียถูกรุมเราดวยการละเลย การบริหารที่ผิดพลาด และการขูดรีดมานานเกินไป เมื่อจักรวรรดิโมกุลไดรับการฟนฟูแลว เราตองทําใหมั่นใจวาจะไมมีราษฎรคนใดตองอดอยากอีก ดวยการลงทุนในระบบชลประทาน ปรับปรุงการเกษตรใหทันสมัย และทลายอิทธิพลของเจาที่ดินผูขูดรีด เราจะเปลี่ยนอินเดียใหเปนดินแดนแหงความอุดมสมบูรณที่ทุพภิกขภัยเปนเพียงอดีต"
