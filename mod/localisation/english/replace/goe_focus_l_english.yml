 AFG_expand_telegraph_network: "ขยายเครือขายโทรเลข"
 AFG_expand_telegraph_network_desc: "[ROOT.GetNonIdeologyName]ตามหลังเพื่อนบานในตัวชี้วัดทางเศรษฐกิจนับไมถวน กาวแรกสูการปรับปรุงเศรษฐกิจใหทันสมัยคือการพัฒนาการสื่อสารระหวางเมืองของเราและเพื่อนบานดวยการขยายเครือขายโทรเลข"
 AFG_increase_agricultural_exports: "เพิ่มการสงออกสินคาเกษตร"
 AFG_increase_agricultural_exports_desc: ""
 AFG_sugar_processing: "โรงงานนํ้าตาลบัฆลาน"
 AFG_sugar_processing_desc: "ความตองการนํ้าตาลในหมูประชาชนเพิ่มขึ้นอยางตอเนื่อง เราควรตอบสนองความตองการนั้นดวยการตั้งโรงงานนํ้าตาลเพื่อแปรรูปผลผลิตการเกษตรเปนสินคาที่มีคานี้ ไมเพียงแตจะตอบสนองความตองการได แตยังสรางการจางงานภาคอุตสาหกรรมเพิ่มขึ้นดวย"
 AFG_fruit_packing: "การแปรรูปผลไม"
 AFG_fruit_packing_desc: "ประชาชนของ[ROOT.GetNonIdeologyName]เปนเกษตรกรที่มีฝมือ เราควรใชประโยชนจากผลผลิตสวนเกินดวยการบรรจุหีบหอเพื่อสงออก โดยตองจัดตั้งโรงงานแปรรูปเพิ่มเติม"
 AFG_clear_malarial_swamps: "กําจัดหนองนํ้าแหลงมาลาเรีย"
 AFG_clear_malarial_swamps_desc: "มาลาเรียยังคงเปนภัยรายในหลายพื้นที่ของประเทศ ดวยการกําจัดแหลงเพาะพันธุของพาหะนําเชื้อมาลาเรีย เราจะปลดเปลื้องประชากรในชนบทจากความทุกขที่มีมาแตอดีต และไดที่ดินใหมสําหรับการพัฒนา"
 AFG_infrastructure_construction: "ลงทุนในโครงสรางพื้นฐาน"
 AFG_infrastructure_construction_desc: "การขาดโครงสรางพื้นฐานทั่วประเทศกําลังฉุดรั้งการพัฒนาเศรษฐกิจ ทําใหประชาชนพอใจที่จะใชชีวิตแบบเดียวกับบรรพบุรุษมาหลายศตวรรษ ทัศนคติเชนนี้ไมเปนผลดีตอชาติในระยะยาวและตองแกไขดวยการลงทุนในโครงการโครงสรางพื้นฐาน"
 AFG_expand_karakul_lambskin_industry: "ขยายอุตสาหกรรมหนังลูกแกะคาราคูล"
 AFG_expand_karakul_lambskin_industry_desc: "ผลิตภัณฑหนังลูกแกะคาราคูลเปนหนึ่งในสินคาไมกี่ชนิดที่สงออกจาก[ROOT.GetNonIdeologyName]ในปริมาณมาก เราสามารถใชโอกาสนี้ขยายฐานอุตสาหกรรมที่เพิ่งเริ่มตนดวยการสรางโรงงานแปรรูปและสงออกผลิตภัณฑเหลานี้"
 AFG_spinzar_cotton_factory: "ลงทุนในโรงงานฝายสปนซาร"
 AFG_spinzar_cotton_factory_desc: "โรงงานฝายสปนซารในคุนดุซเปนหนึ่งในโรงงานที่ทํากําไรสูงสุดของเราในขณะนี้ และเจาของกําลังมองหาทางขยายธุรกิจ แตหากปราศจากการสนับสนุนจากรัฐบาล โรงงานก็จะเติบโตเกินขนาดปจจุบันไดไมมากนัก เราควรพยายามจัดตั้งบริษัทในเครือแหงใหมและลงทุนในอนาคตของอุตสาหกรรมฝาย"
 AFG_forge_a_national_identity: "สรางอัตลักษณแหงชาติ"
 AFG_forge_a_national_identity_desc: "ประชาชนของเราไมไดมองตนเองเปนชาวอัฟกัน แตมองวาเปนสวนหนึ่งของชนเผาและเชื้อชาติของตน เราควรพยายามนําภาษาปาทานและภาษาดารีมาใชเปนภาษาประจําชาติ และสักวันหนึ่งเราอาจรวมประชาชนไวภายใตอัตลักษณแหงชาติอัฟกันที่เปนหนึ่งเดียวได"
 AFG_constructing_a_national_identity_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$AFG_constructing_a_national_identity_idea$§! ถูกลบออก:\n"
 AFG_look_to_other_partners: "มองหาหุนสวนอื่น"
 AFG_look_to_other_partners_desc: "ขอตกลงการคากับสหภาพโซเวียตทําใหเกิดความสงสัยวาพวกเขากําลังแทรกแซงการเมืองภายในและนโยบายตางประเทศของเรา ขอกลาวหาเชนนี้ยอมไมเปนความจริง แตบางทีการมองหาคูคารายอื่นอาจเปนประโยชนตอเรา"
 AFG_look_to_other_partners_tt: "ชาติมหาอํานาจจะมีโอกาสลงทุนใน[ROOT.GetNameDef] ทําใหเราไดรับ§Gโรงงานพลเรือนนอกแผนที่หนึ่งแหงตอแตละประเทศที่ตกลง§! แลกกับการ§Rใหพวกเขามีอิทธิพลตอการเมืองของเราเปนเวลาหนึ่งป§!"
 generic_higher_opinion_tt: "\n§Yความคิดเห็นที่ดีตอ[ROOT.GetNonIdeologyName]จะเพิ่มโอกาสที่ชาติเปาหมายจะยอมรับขอเสนอ§!"
 AFG_renew_soviet_trade_agreement: "ตออายุขอตกลงการคากับโซเวียต"
 AFG_renew_soviet_trade_agreement_desc: "แมอุดมการณของเราจะแตกตางกันตลอดหลายปที่ผานมา แต[SOU.GetName]เปนคูคาทางเศรษฐกิจที่ดีของชาติเรา แมบางคนจะกลัวความเสี่ยงที่[SOU.Adjective]จะเขามามีอิทธิพลตอกิจการภายใน แตเราไมเห็นปญหาในการตออายุขอตกลงการคาระหวางสองชาติ"
 AFG_salang_pass: "อุโมงคชองเขาซาลัง"
 AFG_salang_pass_desc: "ภูมิประเทศที่เปนภูเขาของ[ROOT.GetNonIdeologyName]ทําใหยากตอการพัฒนาเสนทางคมนาคมที่สะดวกทั่วประเทศ อยางไรก็ตาม วิศวกร[SOU.GetAdjective]เชื่อวาพวกเขาสามารถสรางอุโมงคทะลุภูเขาที่ซาลังได รัฐบาลของพวกเขาเสนอที่จะดําเนินการกอสราง โดยแลกกับสัมปทานทางยุทธศาสตรบางประการ"
 AFG_75_year_oil_concessions: "เสนอสัมปทานนํ้ามัน 75 ป"
 AFG_75_year_oil_concessions_desc: "ในชวงไมกี่ปที่ผานมา นักธรณีวิทยาไดคนพบแหลงนํ้ามันสํารองจํานวนมากในดินแดนของเรา แตเราขาดขีดความสามารถทางอุตสาหกรรมที่จะขุดเจาะเอง บางทีหากเราเสนอขอตกลงที่เปนประโยชนรวมกันแกมหาอํานาจรายใดรายหนึ่ง เราอาจรวมกันขุดเจาะนํ้ามันได"
 AFG_75_year_oil_concessions_tt: "§Yปลดล็อกการตัดสินใจเพื่อขุดเจาะทรัพยากรนํ้ามันจากดินแดนของเรารวมกับมหาอํานาจตางชาติ§!"
 AFG_rail_construction: "กอตั้งบริษัทรถไฟอัฟกัน"
 AFG_rail_construction_desc: "สําหรับการขนสงทรัพยากรหรือผูคนจํานวนมหาศาล ไมมีสิ่งใดมีประสิทธิภาพเทาทางรถไฟ ดังนั้นเราตองกอตั้งบริษัทรถไฟเพื่อพัฒนาและดําเนินการเครือขายรางของเราเอง"
 AFG_electrification: "โครงการไฟฟา"
 AFG_electrification_desc: "นวัตกรรมดานอุตสาหกรรม การสื่อสาร และการสงครามพึ่งพาไฟฟามากขึ้นเรื่อย ๆ ดังนั้นเราตองทําใหชาติของเราสามารถใชประโยชนจากความกาวหนาใหม ๆ ไดดวยการขยายระบบไฟฟาทั่ว[ROOT.GetNonIdeologyName]"
 AFG_electrification_tt: "\n§Yระบบไฟฟาจะเริ่มแผขยายออกจากคาบูลเมื่อเวลาผานไป โดยรัฐดินแดนหลักใหมหนึ่งรัฐจะไดรับตัวปรับคาทุก ๆ สองเดือน§!"
 AFG_establish_radio_networks: "ปรับปรุงวิทยุคาบูลใหทันสมัย"
 AFG_establish_radio_networks_desc: "วิทยุคาบูลกอตั้งขึ้นในทศวรรษ 1920 ดวยอุปกรณที่บัดนี้ลาสมัยแลว เราควรลงทุนปรับปรุงอุปกรณกระจายเสียง เพื่อใหรัฐบาลมีชองทางสื่อสารโดยตรงกับประชาชนใหไดมากที่สุด"
 AFG_connect_the_cities: "ถนนวงแหวน[ROOT.GetNonIdeologyName]"
 AFG_connect_the_cities_desc: "แมทางรถไฟจะมีความสําคัญยิ่งตอการพัฒนาในระยะยาว แตประโยชนของระบบทางหลวงสมัยใหมระหวางเมืองใหญก็ไมอาจมองขามได ดวยการสรางถนนวงแหวนเชื่อมเมืองตาง ๆ เราจะกัดกรอนลัทธิภูมิภาคนิยมทางเศรษฐกิจที่บั่นทอนเศรษฐกิจของเรามาชานานไดในที่สุด"
 AFG_expand_kabul_university: "ขยายมหาวิทยาลัยคาบูล"
 AFG_expand_kabul_university_desc: "ความตองการวิศวกร แพทย และครูมืออาชีพไมอาจตอบสนองไดอีกตอไปดวยการสงนักศึกษาไปเรียนเฉพาะทางในตางประเทศ เราตองลงทุนในสถาบันของเราเองและสรางผูเชี่ยวชาญรุนใหมที่เติบโตในประเทศ"
 AFG_expand_kabul_university_tt: "§Rการขยายการศึกษาระดับสูงจะทําใหบัณฑิตหัวรุนแรงขึ้น เวนแตเศรษฐกิจจะเติบโตมากพอที่จะมีงานใหพวกเขา!§!"
 AFG_kajaki_dam: "กอตั้งองคการลุมนํ้าเฮลมันด"
 AFG_kajaki_dam_desc: "เราควรไดแรงบันดาลใจจากองคการลุมนํ้าเทนเนสซีใน[USA.GetNameDef] และจัดตั้งหนวยงานที่คลายกันสําหรับลุมแมนํ้าเฮลมันด องคกรนี้จะรับผิดชอบการพัฒนาเศรษฐกิจของพื้นที่เพื่อประโยชนของเศรษฐกิจชาติ อยางไรก็ตาม เราตองระวังไมใหยั่วยุเพื่อนบานทางตะวันตก หากเราเริ่มเปลี่ยนแปลงการไหลของนํ้าในแมนํ้า"
 AFG_kajaki_dam_tt: "\n§Rความลมเหลวในการเจรจาสนธิสัญญากับ[414.OWNER.GetNameDef]ผานหวงโซเหตุการณที่ตามมาอาจนําไปสูสงคราม!§!"
 AFG_qargha_dam: "สรางเขื่อนการฆา"
 AFG_qargha_dam_desc: "ภูมิภาคที่แหงแลงกวาของประเทศขาดระบบชลประทานที่เพียงพอ ซึ่งทําใหผลผลิตเสี่ยงตอความเสียหายและอาจกอใหเกิดทุพภิกขภัย อยางไรก็ตาม เราสามารถสรางเขื่อนเพื่อเพิ่มนํ้าสําหรับการชลประทาน ซึ่งอาจนําไปสูผลผลิตทางการเกษตรสวนเกินดวยซํ้า"
 AFG_chaki_dam: "เขื่อนชัก"
 AFG_chaki_dam_desc: "เมื่อความตองการไฟฟาเพิ่มขึ้น เราตองทําใหมีการผลิตไฟฟาอยางสมํ่าเสมอ ดวยความชวยเหลือจากผูเชี่ยวชาญตางชาติ เราอาจสรางเขื่อนไฟฟาพลังนํ้าบนแมนํ้าชักได ซึ่งจะจายไฟฟาใหพื้นที่โดยรอบรวมถึงคาบูลไปอีกหลายป"
 AFG_chromite_mines: "เปดเหมืองโครไมต"
 AFG_chromite_mines_desc: "โครเมียมกําลังเปนทรัพยากรที่ตองการมากขึ้นเรื่อย ๆ ในโลกอุตสาหกรรม เราควรเริ่มขุดแรโครไมตของเราเองเพื่อสงออก แลวนําความมั่งคั่งที่ไดมาใชในโครงการพัฒนาอุตสาหกรรมของเราตอไป"
 AFG_iron_mines: "ขยายเหมืองทองแดงและดีบุก"
 AFG_iron_mines_desc: "ดีบุก ทองแดง และเหล็กเปนสิ่งจําเปนสําหรับการผลิตสิ่งของจําเปนสมัยใหมมากมาย หากเราจะพัฒนาเปนชาติอุตสาหกรรม เราตองพัฒนาและรักษาการเขาถึงทรัพยากรเหลานี้ดวยตนเอง โชคดีที่เรามีทรัพยากรที่ยังไมถูกใชมากมายรอการนํามาใชประโยชน"
 AFG_truck_factory: "โรงงานรถบรรทุกจังกาลัก"
 AFG_truck_factory_desc: "ดวยความรวมมือกับผูอุปถัมภ[SOU.GetAdjective] เรามีโอกาสพัฒนาโรงงานผลิตยานพาหนะขนาดใหญแหงแรก รถบรรทุกที่ผลิตขึ้นที่นั่นจะตอบสนองความตองการยานพาหนะภายในประเทศทั้งในภาคอุตสาหกรรมและการทหาร"

 AFG_maintain_quami: "คงระบบเกาวมี"
 AFG_maintain_quami_desc: "ระบบการเกณฑพลแบบเกาวมีเปนศิลาฤกษของการปองกันประเทศมาหลายศตวรรษ เหตุใดเราจึงควรทิ้งระบบที่หยั่งรากในประเพณี เพื่อสิ่งที่จะเปนประโยชนแกชนชั้นนําในเมืองหลวงเทานั้น? การตอตานกระแสการปฏิรูปตามแฟชั่นระลอกลาสุดนี้คือทางเลือกเดียวที่สมเหตุสมผล"
 AFG_maintain_quami_tt: "§Yคงการตัดสินใจ $AFG_quami_category$ และความสามารถในการเกณฑกองพลทหารนอกแบบเพิ่มเติม§!"
 AFG_quami_intro_tt: "ปรับ §Y$AFG_quami_modifier$§! ดังนี้:"
 AFG_nufus_intro_tt: "ปรับ §Y$AFG_nufus_modifier$§! ดังนี้:"
 AFG_asymmetric_warfare: "สงครามอสมมาตร"
 AFG_asymmetric_warfare_desc: "ขณะที่เพื่อนบานของเราพอใจที่จะทิ้งมรดกของตนเพื่อไลตามการพัฒนาอุตสาหกรรมและกองทัพที่ใหญโตขึ้นเรื่อย ๆ เราจะเอาชนะพวกเขาดวยยุทธวิธีนอกแบบและความรูในภูมิประเทศที่เหนือกวา ผนวกกับความมุงมั่นของทหารเรา เราจะขับไลกองกําลังรุกรานใด ๆ ก็ตาม"
 AFG_khyber_pass_riflining: "ปนไรเฟลแหงชองเขาไคเบอร"
 AFG_khyber_pass_riflining_desc: "อุตสาหกรรมในครัวเรือนตามชองเขาไคเบอรผลิตอาวุธเลียนแบบของตางชาติมาหลายทศวรรษ แมอาวุธของพวกเขาจะดอยคุณภาพ แตก็ชดเชยดวยปริมาณ บางทีถึงเวลาแลวที่เราจะลงทุนในภูมิภาคนี้และพัฒนาผูผลิตอาวุธภายในประเทศสําหรับกองทัพของเรา"
 AFG_encourage_jezail_production: "สงเสริมการผลิตปนเจซายลในทองถิ่น"
 AFG_encourage_jezail_production_desc: "ปนเจซายลเปนอาวุธที่ชนเผาปาทานโปรดปรานมาชานานเพราะผลิตไดในราคาถูก และเปนประโยชนอยางยิ่งตอเราในสงครามแองโกล-อัฟกัน เราควรสนับสนุนใหชนเผาตาง ๆ รักษาประเพณีนี้ไว เพื่อใหมีกําลังเกณฑที่ใหญขึ้น"
 AFG_scavenging: "ยุทธวิธีเก็บกวาดยุทโธปกรณ"
 AFG_scavenging_desc: "ยุทโธปกรณที่เราผลิตเองไมไดมักจะโผลมาที่นี่ในมือของผูรุกรานตางชาติ ดังนั้นเราควรฝกกองกําลังใหรูจักแยกแยะและยึดยุทโธปกรณทางทหารที่มีคาเมื่อใดก็ตามที่มีโอกาส"
 AFG_militia_cavalry: "ทหารมากัตกานี"
 AFG_militia_cavalry_desc: "[ROOT.GetNameDefCap]เปนถิ่นกําเนิดของมาหลายสายพันธุที่ผสมพันธุมาเพื่อภูมิประเทศอันทุรกันดารของประเทศโดยเฉพาะ มาเหลานี้สามารถใชในกองพลนอยทหารมาได แทนที่จะตองลงทุนในยุทโธปกรณตางชาติราคาแพงที่มักชํารุดและตองการการสนับสนุนมากมาย"
 AFG_mountain_training: "การฝกรบบนภูเขา"
 AFG_mountain_training_desc: "เทคโนโลยีและยุทธวิธีใหม ๆ มาแลวก็ไปตามกาลเวลา แตขุนเขาและหุบเขายังคงไมเปลี่ยนแปลง แทนที่จะดิ้นรนตามเพื่อนบานใหทันทางเทคโนโลยี เราควรมุงใชประโยชนจากผืนดินรอบตัวเพื่อใหไดเปรียบทางยุทธวิธี"
 AFG_cross_border_ties: "สายสัมพันธขามพรมแดน"
 AFG_cross_border_ties_desc: "ลักษณะทางภูมิศาสตรของเราทําใหพรมแดนเปดโลงอยูเสมอ ครอบครัวตาง ๆ เดินทางขามไปมาและตั้งถิ่นฐานทั้งสองฝง ตลอดหลายชั่วอายุคน สิ่งนี้นําไปสูความสัมพันธสวนบุคคลที่แนนแฟนในประเทศเพื่อนบาน ซึ่งในยามวิกฤตอาจใชใหเปนประโยชนได"
 AFG_cross_border_ties_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_cross_border_ties_category$§! เพื่อผนวกดินแดนที่อางสิทธิ์"
 AFG_approach_foreign_inteligence_services: "ติดตอหนวยขาวกรองตางชาติ"
 AFG_approach_foreign_inteligence_services_desc: "เราตั้งอยู ณ ทางแยกของมหาอํานาจ และตกอยูภายใตความเมตตาของเกมใหญของพวกเขามาชานาน หากเราจัดตั้งหนวยขาวกรองของเราเอง เราจะใชประโยชนจากสถานการณอันเปนเอกลักษณของเราดวยการยุยงเพื่อนบานใหขัดแยงกันเอง"
 AFG_expand_border_guards: "ขยายกองกําลังรักษาชายแดน"
 AFG_expand_border_guards_desc: "เราควรฝกตํารวจชายแดนใหมีทักษะการรบขั้นพื้นฐาน เพื่อใหสามารถเรียกใชรับผิดชอบภารกิจที่มากขึ้นในยามวิกฤตและลดภาระของกองทัพตามแบบ ราชองครักษคือหนวยรบชั้นยอดของกองทัพเรา และมีการฝกและความเชี่ยวชาญที่สมฐานะ อยางไรก็ตาม เริ่มมีความกังวลถึงจํานวนที่จํากัดของพวกเขา ขณะที่เพื่อนบานของเราจมดิ่งสูความขัดแยง"
 AFG_utilize_cameleers: "ใชประโยชนจากคนเลี้ยงอูฐ"
 AFG_utilize_cameleers_desc: "คนเลี้ยงอูฐของเราถูกสงไปทํางานทั่วทุกสารทิศ จักรวรรดิอังกฤษจางพวกเขาไปใชเดินทางและขนสงเสบียงในพื้นที่อันตรายของทะเลทรายเกรตออสเตรเลีย เราควรใชแรงงานผูชํานาญเหลานี้ชวยเหลือกองทหารในดินแดนของเราเอง"
 AFG_establish_camelry_regiments: "จัดตั้งกรมทหารอูฐ"
 AFG_establish_camelry_regiments_desc: "อูฐเปนสัตวที่ทรหด และเพื่อใหกองทัพของเราปฏิบัติการไดแมในทะเลทรายและภูเขา เราตองปรับตัว ดวยความชวยเหลือจากทหารอูฐ เราจะสามารถรบไดไมวาภูมิประเทศใด และในพื้นที่ที่ศัตรูอาจทําไมได"
 AFG_adopt_nufus: "นําระบบนูฟุสมาใช"
 AFG_adopt_nufus_desc: "ระบบการระดมกองกําลังนอกแบบเพื่อปองกันอาณาจักรที่มีมาหลายศตวรรษหมดประโยชนไปนานแลว และไมนาจะตานทานการบุกรุกของกองกําลังขาศึกอาชีพได ดังนั้นเราตองแทนที่ระบบนี้ดวยการเกณฑทหารและการฝกอยางเปนทางการ"
 AFG_adopt_nufus_tt: "§Rจะลบการตัดสินใจ $AFG_quami_category$ และปองกันการเกณฑกองพลทหารนอกแบบ!§!"
 AFG_mohammed_daoud_khan_available_as_general_tt: "§Yโมฮัมเหม็ด ดาวูด ขาน§! พรอมใหแตงตั้งเปนนายพลระดับ §Y2§!"
 AFG_new_army: "กองทัพประจําการ"
 AFG_new_army_desc: "แมยังมีการตอตานการปฏิรูปกองทัพจากประชากรในชนบท แตเราตองเดินหนาและจัดตั้งโครงการฝกขนาดใหญสําหรับทหารเกณฑรุนลาสุด"
 AFG_expand_royal_guard: "ขยายราชองครักษ"
 AFG_expand_royal_guard_desc: "ราชองครักษคือหนวยรบชั้นยอดของกองทัพเรา และมีการฝกและความเชี่ยวชาญที่สมฐานะ อยางไรก็ตาม เริ่มมีความกังวลถึงจํานวนที่จํากัดของพวกเขา ขณะที่เพื่อนบานของเราจมดิ่งสูความขัดแยง"
 AFG_prussians_of_the_orient: "ปรัสเซียแหงบูรพทิศ"
 AFG_prussians_of_the_orient_desc: "ดวยการฝกจากนายทหารตางชาติและยุทโธปกรณสวนเกินจํานวนมากของ[GER.GetAdjective] เจาหนาที่ใน[GER.GetNameDef]เริ่มเรียกเราวาปรัสเซียแหงบูรพทิศ เราควรทําตัวใหสมกับฉายานี้ และยืนหยัดตอทุกผูที่กลาตอตานเรา"
 AFG_establish_naval_bases: "กอตั้งฐานทัพเรือใหม"
 AFG_establish_naval_bases_desc: "ดวยการกอตั้งฐานทัพเรือแหงแรกเพื่อสงเสบียงใหเรือตามชายฝงที่เพิ่งไดรับการปลดปลอย เราสามารถเริ่มภารกิจอันยากลําบากในการพัฒนากองทัพเรือของเราเอง"
 AFG_establish_naval_bases_tt: "เพิ่ม§Yฐานทัพเรือ§! §G1§! แหงในรัฐชายฝงแบบสุม"
 AFG_standardize_equipment: "กําหนดมาตรฐานยุทโธปกรณ"
 AFG_standardize_equipment_desc: ""
 AFG_expand_academy: "ขยายโรงเรียนนายรอย"
 AFG_expand_academy_desc: "เมื่อกองทัพอาชีพขยายตัว ความตองการนายทหารที่ไดรับการฝกมาอยางดีก็เพิ่มขึ้นตาม การพัฒนาโรงเรียนนายรอยแหงชาติเปนมาตรการที่รอบคอบเพื่อใหกองทัพมีผูนําและความเชี่ยวชาญที่จําเปนในการปกปองพรมแดนของเรา"
 AFG_expand_academy_tt: "รับสมัคร§Yนายพล§!แบบสุม§Yสอง§!คน"
 AFG_foreign_military_advisors: "เชิญที่ปรึกษาทางทหารตางชาติ"
 AFG_foreign_military_advisors_desc: "เพื่อฝกกองทัพใหไดมาตรฐานสมัยใหม วิธีที่เร็วที่สุดคือการเชิญที่ปรึกษาจากชาติตะวันตก พวกเขาจะชวยฝกบุรุษ[ROOT.GetAdjective]รุนตอไปใหพรอมรบในสนามรบที่เปลี่ยนแปลงอยูเสมอ"
 AFG_expand_standing_army: "ขยายกองทัพประจําการ"
 AFG_expand_standing_army_desc: "เพื่อเอาชนะศัตรูและรักษาเอกราช กองทัพของเราไมอาจเพียงแคมีประสิทธิภาพ แตตองมีขนาดใหญดวย ดังนั้นเราควรขยายการเกณฑทหารและรับคนเขาประจําการเพิ่มขึ้น"
 AFG_officialize_the_turkish_afghan_defense_treaty: "สนธิสัญญาปองกันรวม[TUR.GetAdjective]-[ROOT.GetAdjective]"
 AFG_officialize_the_turkish_afghan_defense_treaty_desc: "ตั้งแตป 1933 บุคลากรทางทหารของตุรกีไดชวยฝกสอนทหารอัฟกันรุนใหม ถึงเวลาที่จะใชประโยชนจากความสัมพันธนี้ รองขอสนธิสัญญาปองกันรวม ซึ่งทั้งสองฝายจะมีพันธะตองปกปองกันและกันจากการรุกรานของตางชาติ"
 AFG_purchase_tanks: "ซื้อรถถังตางชาติ"
 AFG_purchase_tanks_desc: "กองทัพของเราขาดอํานาจการยิงที่จะเจาะแนวขาศึกอันแข็งแกรง หรือความเร็วในการรุกคืบ เราตองมองไปยังสวนอื่นของโลกและลงทุนในกองกําลังยานเกราะเพื่อแกไขปญหาเหลานี้"
 AFG_purchase_aircraft: "ซื้ออากาศยานตางชาติ"
 AFG_purchase_aircraft_desc: "กองทัพของเราเปราะบางเกินไปตอการโจมตีทางอากาศ เราตองลงทุนในกองทัพอากาศของเราเองเพื่อตอตานอากาศยานขาศึก"
 AFG_expand_equipment_purchases: "ขยายการจัดซื้อยุทโธปกรณ"
 AFG_expand_equipment_purchases_desc: "กองทัพของเราตองพึ่งพายุทโธปกรณที่เกินกวาปนไรเฟลและกระสุนธรรมดามากขึ้นเรื่อย ๆ หากจะยังคงเปนกองกําลังที่นาเชื่อถือ เราตองจัดหายุทโธปกรณสนับสนุนเพิ่มเติมโดยเร็วที่สุด"
 AFG_increase_air_purchases: "เพิ่มการจัดซื้ออากาศยาน"
 AFG_increase_air_purchases_desc: "กองทัพอากาศของเรากําลังพัฒนาขีดความสามารถในการยับยั้งหรือทําลายอากาศยานตางชาติที่รุกลํ้านานฟาอยางรวดเร็ว อยางไรก็ตาม เรายังขาดความสามารถในการโจมตีภาคพื้นดินดวยอากาศยาน ดังนั้นเราควรเริ่มลงทุนในฝูงบินทิ้งระเบิดของเราเอง"
 AFG_naval_academy: "กอตั้งโรงเรียนนายเรือ"
 AFG_naval_academy_desc: "การที่เราไมมีชายฝงมาตลอดประวัติศาสตร ทําใหไมมีนายทหารที่มีความเชี่ยวชาญทางเรือเลย ดังนั้นเราตองกอตั้งโรงเรียนนายเรือและพยายามดึงนายทหารจากตางประเทศมาฝกทหารเรือ[AFG.GetAdjective]รุนแรก"
 AFG_naval_academy_tt: "รับสมัคร§Yพลเรือเอก§!แบบสุม§Yสอง§!คน"
 AFG_shipyards: "กอตั้งกิจการเดินเรือ[ROOT.GetAdjective]"
 AFG_shipyards_desc: "แมเราจะยังไมพรอมพัฒนาเรือที่ออกแบบเอง แตเรือทุกลําในอนาคตจะตองมีสิ่งอํานวยความสะดวกดานการซอมบํารุงและปรับปรุง ดวยการตั้งอูตอเรือตั้งแตตอนนี้ เราจะทําใหเรือในอนาคตของเรามีสิ่งอํานวยความสะดวกที่จําเปนสําหรับการปฏิบัติการไปอีกหลายทศวรรษ"
 AFG_shipyards_tt: "เพิ่มชองสิ่งกอสราง §G1§! ชอง และ§Y อูตอเรือ§! §G1§! แหงในรัฐชายฝง"
 AFG_shipyards_tt_2: "§Yปลดล็อกองคกรอุตสาหกรรมทหาร:§!"
 AFG_research_bonus_1: "พัฒนาอุตสาหกรรมตอเรือภายในประเทศ"
 AFG_research_bonus_1_desc: "มหาอํานาจจะขายใหเราเฉพาะสิ่งที่พวกเขาเห็นวาลาสมัยและไมเปนภัยตอผลประโยชนของพวกเขาในภูมิภาคเทานั้น หากเราจะพัฒนากองทัพเรือสมัยใหมที่สามารถยับยั้งมหาอํานาจเหลานั้นได เราควรลงทุนพัฒนาแบบเรือของเราเอง"
 AFG_purchase_destroyers: "ซื้อเรือพิฆาต"
 AFG_purchase_destroyers_desc: "เราจะตองใชเวลาหลายทศวรรษในการพัฒนาความเชี่ยวชาญและโครงสรางพื้นฐานเพื่อรองรับการออกแบบและสรางเรือรบสมัยใหม แนวทางที่เปนรูปธรรมกวามากคือการจัดหาเรือที่ปลดระวางจากชาติอื่นแลวนํามาปรับปรุงใหเหมาะกับเปาหมายของเรา"
 AFG_research_bonus_2: "ลงทุนในการพัฒนาทางเรือ"
 AFG_research_bonus_2_desc: "ความเชี่ยวชาญในการพัฒนาเรือขนาดเล็กของเราไดผลตอบแทนแลว และบัดนี้วิศวกรของเรากําลังมองหาความทาทายในการพัฒนาแบบเรือที่ใหญกวามากสําหรับกองทัพเรือ"
 AFG_purchase_capital_ships: "ซื้อเรือหลัก"
 AFG_purchase_capital_ships_desc: "กองทัพเรือของเราเริ่มเปนรูปเปนรางจากการจัดหาเรือขนาดเล็กเมื่อไมนานมานี้ อยางไรก็ตาม เรายังขาดอํานาจการยิงทางเรือของเรือขนาดใหญ และควรเริ่มมองหาเรือที่อาจจัดซื้อได"
 AFG_state_industries: "กอตั้งอุตสาหกรรมทหาร"
 AFG_state_industries_desc: "บัณฑิตมหาวิทยาลัยกําลังหัวรุนแรงขึ้นเพราะขาดงานที่ใชทักษะของพวกเขา เพื่อปองกันเรื่องนี้ เราสามารถกอตั้งอุตสาหกรรมของรัฐเพื่อจางงานพวกเขาเพิ่มขึ้น พรอมทั้งติดอาวุธใหกองทัพดวยยุทโธปกรณที่ผลิตในประเทศ"
 AFG_state_industries_tt: "ปลดล็อกการตัดสินใจเพื่อกอตั้ง§Yองคกรอุตสาหกรรมทหาร§! และขยายระยะเวลากอนที่บัณฑิตจะหัวรุนแรง"
 AFG_ideology_on_the_rise_tt: "§R\n\nมหาอํานาจที่ไมมีอุดมการณเดียวกับ[THIS.GetNameDef]อาจตองการรุกราน[ROOT.GetNameDef]หากอิทธิพลของพวกเขาเหนือเราสูงเกินไป! (หาก[THIS.GetIdeologyNameWithCaps]มากกวา 40% มหาอํานาจอื่นอาจโจมตีเรา!)§!" 
 AFG_ideology_on_the_rise_flipped_tt: "§R\n\n[THIS.GetNameDefCap]อาจตองการรุกราน[ROOT.GetNameDef]หากชาติอื่นมีอิทธิพลเหนือเรามากเกินไป! (หากอุดมการณใดนอกเหนือจากความเปนกลางหรือ[THIS.GetIdeologyNameWithCaps]มากกวา 40% [THIS.GetNameDef]อาจโจมตีเรา!)§!" 
 AFG_foreign_influence_tt: "เพิ่ม§Yอิทธิพล[PREV.GetIdeologyNameWithCaps]ที่กําลังเพิ่มขึ้น§! ซึ่งให (การสนับสนุน[PREV.GetIdeologyNameWithCaps]รายวัน: §G+0.02§!) เปนเวลา §Y365§! วัน"
 AFG_against_kabul: "ตอตานคาบูล"
 AFG_against_kabul_desc: "กษัตริยซาฮีรและเหลาพระปตุลาคือผูแยงชิงราชบัลลังก ระบอบอันไมชอบธรรมของพวกเขาตองถูกโคนลมไมวาจะตองแลกดวยสิ่งใด"
 AFG_contact_amanullah_loyalists: "ติดตอผูภักดีตออามานุลลาห"
 AFG_contact_amanullah_loyalists_desc: "อดีตกษัตริย $AFG_amunullah_khan$ ไมเคยสละราชบัลลังกใหผูสืบทอดอยางเปนทางการ เมื่อพระองคถูกฝูงชนโคนลมอยางอยุติธรรม ดังนั้นเราตองรวบรวมผูที่ยังภักดีตอกษัตริยใน[AFG.GetNonIdeologyName] และเตรียมการสําหรับการเสด็จกลับมาที่หลีกเลี่ยงไมไดของพระองค"
 AFG_remember_the_khost_rebellion: "รําลึกถึงกบฏโคสต"
 AFG_remember_the_khost_rebellion_desc: "ในป 1924 ผูทรงธรรมในหมูพวกเราลุกฮือขึ้นตอตานกษัตริยอามานุลลาหและพรรคพวกชาวตะวันตกของพระองค เพื่อดึงประเทศกลับจากปากเหวแหงการสูญเสียอัตลักษณอันนาภาคภูมิ แมการลุกฮือจะพายแพ แตจิตวิญญาณยังคงอยู และบัดนี้เรารูแลววาจะเอาชนะคาบูลไดอยางไร ถึงเวลากลับคืนสูประเพณี!"
 AFG_crown_the_golden_emir: "สถาปนาเอมีรทองคํา"
 AFG_crown_the_golden_emir_desc: "เมื่อดินแดนมั่นคงแลว ผูปกครองคนใหมตองขึ้นมารับตําแหนงเอมีร ดวยการพิสูจนตนในสนามรบมาแลว จึงไมนาแปลกใจที่มีรซาลี ขาน วาซีร จะเปนผูสมัครที่ไดรับความนิยมสูงสุด เขาจะชวยเรารวมปาทานิสถานอีกครั้งและรวมโลกอิสลามเปนหนึ่ง"
 AFG_crown_the_bukharan_emir: "สถาปนาเอมีรแหงบุคอรา"
 AFG_crown_the_bukharan_emir_desc: "เมื่อดินแดนมั่นคงแลว ผูปกครองคนใหมตองขึ้นมารับตําแหนงเอมีร ซัยยิด มีร มุฮัมมัด อาลิม ขาน แหงบุคอรา พํานักอยูในคาบูลมาหลายปแลว และเปนผูสมัครที่สมบูรณแบบหากเราตองการฟนฟูความรุงโรจนของจักรวรรดิดุรรานีอันยิ่งใหญ"
 AFG_invite_the_mughal_prince: "เชิญเจาชายโมกุล"
 AFG_invite_the_mughal_prince_desc: "เมื่อดินแดนมั่นคงแลว ผูปกครองคนใหมตองขึ้นมาสืบทอดอํานาจของตีมูร ไมวาจะดวยสายเลือด ความสามารถ หรือพลังแหงเจตจํานงลวน ๆ ทางเลือกของเราจะกําหนดอนาคตแหงอาณาจักร ดังนั้นเราควรเชิญเจาชายโมกุลที่ประทับอยูในอินเดียขณะนี้มาครองบัลลังกของเรา"
 AFG_unify_the_islamic_world: "รวมโลกอิสลามเปนหนึ่ง"
 AFG_unify_the_islamic_world_desc: "รัฐมุสลิมทะเลาะเบาะแวงกันดวยเรื่องไมเปนสาระมานานเกินไป ละทิ้งหนาที่ในการรวมมือกัน ในที่สุดก็ถึงเวลาที่เราจะสงคําเชิญไปยังรัฐมุสลิมทั่วโลก ใหมารวมกันเปนพันธมิตรอันยิ่งใหญ"
 AFG_unify_the_islamic_world_tt: "ไดรับเหตุการณ §Y[ROOT.GetNameDefCap]เชิญเราเขารวมฝายของพวกเขา§!"
 AFG_united_islamic_world_faction: "อิตติฮาด-เอ อิสลามี"
 AFG_extend_a_hand_to_tokyo: "ยื่นมือสูโตเกียว"
 AFG_extend_a_hand_to_tokyo_desc: "ดวยความชวยเหลือของกองกําลัง[JAP.GetAdjective] เราจึงชนะการตอสูเพื่ออัฟกานิสถานได บัดนี้เมื่อ[JAP.GetNameDef]มุงที่จะรวมและปลดปลอยเอเชีย จึงเปนการรอบคอบที่เราจะเขาหาพวกเขาอีกครั้ง"
 AFG_extend_a_hand_to_tokyo_tt: "เราจะพยายามเขารวมฝายของ§Y[JAP.GetNameDef]§!"
 AFG_expand_the_madrasas: "ขยายโรงเรียนสอนศาสนา"
 AFG_expand_the_madrasas_desc: "เพื่อควบคุมประชาชนไดดีขึ้นและสอนแนวทางที่พวกเขาควรดําเนินชีวิต เราควรเพิ่มงบประมาณแกสถาบันการศึกษาของชาวมุสลิมในประเทศของเรา"
 AFG_promote_muslim_work_ethic: "สงเสริมจริยธรรมการทํางานแบบมุสลิม"
 AFG_promote_muslim_work_ethic_desc: "ชาวตะวันตกโออวด ‘จริยธรรมการทํางานแบบโปรเตสแตนต’ ของพวกเขามาชานาน โดยมองขามความวิริยะของโลกอิสลาม ถึงเวลาแลวที่เราจะเตือนใหพวกเขารูวาเราเทาเทียมกับพวกเขาทุกประการทั้งในความทุมเทและความเชี่ยวชาญ"
 AFG_rehabilitate_the_saqqawists: "ฟนฟูเกียรติกลุมซักกาวี"
 AFG_rehabilitate_the_saqqawists_desc: "กลุมซักกาวีประสบความสําเร็จในการโคนลมการปกครองอันเสื่อมทรามของอามานุลลาห ขาน ในป 1929 แตโชคชะตากลับเลนงานพวกเขา และพวกเขาถูกทําลายเกือบสิ้นซากในไมกี่ปตอมา บางทีถึงเวลาแลวที่จะยกยองวีรบุรุษเหลานี้ผูตอสูอยางกลาหาญเพื่อปกปองคุณคาดั้งเดิมของเรา"
 AFG_ulugh_beg_academy: "สถาบันอูลุฆ เบก"
 AFG_ulugh_beg_academy_desc: "อูลุฆ เบก เคยปกครองจักรวรรดิตีมูริดอันยิ่งใหญในฐานะสุลตาน แตก็ยังมีเวลาขยายองคความรูดานดาราศาสตรและคณิตศาสตรของเรา เราควรยกยองมรดกของเขาดวยการกอตั้งมหาวิทยาลัยแหงใหมในนามของเขา"
 AFG_prepare_the_war_industries: "เตรียมอุตสาหกรรมสงคราม"
 AFG_prepare_the_war_industries_desc: "อุตสาหกรรมปจจุบันของเราขาดขีดความสามารถในการผลิตเพื่อสงคราม เพื่อไมใหถูกประเทศเพื่อนบานบดขยี้ เราตองปรับทิศทางโรงงานใหสนับสนุนกองทัพ แทนที่จะสนองความตองการของชนชั้นปกครอง การเปลี่ยนผานนี้สําคัญยิ่งตอการอยูรอดของเรา"
 AFG_revive_the_workshop_of_the_world: "ฟนฟูโรงงานของโลก"
 AFG_revive_the_workshop_of_the_world_desc: "เราจะเจริญรอยตามบรรพบุรุษดวยการปรับปรุงโรงงานใหทันสมัยและฟนฟูเสนทางการคา การเปลี่ยนแปลงนี้จะทําใหเศรษฐกิจของเราเปนขุมพลังที่แขงขันกับชาติมหาอํานาจของโลกได"
 AFG_reorganize_the_royal_guard: "จัดระเบียบราชองครักษใหม"
 AFG_reorganize_the_royal_guard_desc: "ราชองครักษไมสามารถดํารงเกียรติที่ไดรับมอบหมายไวได เราจะฟนพลังใหพวกเขาดวยการปฏิรูปหลายดานและการขยายกําลังพล พวกเขาตองเปนตัวแทนแหงความแข็งแกรงและความมุงมั่นของ[ROOT.GetNameDef]"
 AFG_reintroduce_heavy_cavalry: "ฟนฟูทหารมาหนัก"
 AFG_reintroduce_heavy_cavalry_desc: "บรรพบุรุษของเราขี่มากวาดลางเขาสูที่ราบของอินเดียและเอเชียกลางครั้งแลวครั้งเลา ยึดดินแดนและทรัพยากรเมื่อผูปกครองที่นั่นออนแอ เมื่อเพื่อนบานของเราติดพันอยูในความขัดแยง บางทีโอกาสเชนนั้นอาจกําลังมาถึงอีกครั้ง"
 AFG_reintroduce_war_elephants: "ฟนฟูชางศึก"
 AFG_reintroduce_war_elephants_desc: "ขณะที่โลกตางดิ้นรนหาทางสรางสัตวประหลาดจักรกลที่ซับซอนยิ่งขึ้นเรื่อย ๆ เราจะใชวิธีที่ผานการพิสูจนแลวในการทําสงครามและสรางความหวาดกลัวแกศัตรู ดวยการฟนการใชชางศึก"
 AFG_timurid_bureaucracy: "ระบบราชการแบบตีมูริด"
 AFG_timurid_bureaucracy_desc: "ระบบราชการแบบตีมูริดซึ่งหยั่งรากจากมรดกของตีมูร เปนแบบอยางของการปกครองที่มีประสิทธิภาพและการควบคุมแบบรวมศูนย การฟนฟูระบบนี้จะเสริมสรางการบริหารของรัฐเอมีร รับประกันเสถียรภาพและความรุงเรืองทั่วดินแดนอันกวางใหญ"
 AFG_hone_the_shamshir: "ลับดาบชัมชีร"
 AFG_hone_the_shamshir_desc: "ดาบชัมชีร สัญลักษณแหงความแข็งแกรงและการตอตาน ตองไดรับการลับใหคมเพื่อการรบที่จะมาถึง ดวยการปรับปรุงกองกําลังใหทันสมัยและขัดเกลายุทธศาสตร เราจะทําใหมั่นใจวา[ROOT.GetNameDef]พรอมโจมตีอยางเด็ดขาดเมื่อถึงเวลา"
 AFG_restore_herat: "ฟนฟูเฮรัต"
 AFG_restore_herat_desc: "เพื่อทาทายศูนยกลางอํานาจเดิมในคาบูล ถึงเวลาแลวที่จะยายเมืองหลวงไปยังที่ประทับหลักของจักรวรรดิดุรรานี นั่นคือเฮรัต การทําเชนนี้จะชวยเสริมการอางสิทธิ์ของเราในฐานะผูสืบทอดจักรวรรดิที่ครั้งหนึ่งเคยยิ่งใหญนี้"
 AFG_enforce_the_pashtunwali: "บังคับใชปาทานวาลี"
 AFG_enforce_the_pashtunwali_desc: "แมบทบัญญัติของปาทานวาลีอาจลาสมัย แตยังจําเปนตองรักษาไวเพื่อรับประกันความเปนใหญของชาวปาทานในการเมืองภายใน สวนที่ลาสมัยที่สุดของกฎอาจไดรับการปรับแก แตจะยังคงใชตอไปอีกหลายชั่วอายุคน"
 AFG_form_the_khuddamul_furqan: "จัดตั้งคุดดามุลฟุรกอน"
 AFG_form_the_khuddamul_furqan_desc: "เพื่อเสริมความชอบธรรมของรัฐบาลใหม เราตองกอตั้งพรรคการเมืองอยางเปนทางการภายใตการนําของเอมีรทองคํา ความภักดีเดียวที่ยอมรับไดคือตอคุดดามุลฟุรกอน และมีเพียงพรรคนี้เทานั้นที่จะนําความรอดพนมาสูประชาชน"
 AFG_instate_a_compulsory_jizya: "บังคับเก็บภาษีญิซยะฮ"
 AFG_instate_a_compulsory_jizya_desc: "สิทธิของผูที่มิใชมุสลิมถูกกําหนดไวอยางเครงครัดภายใตการบริหารแบบเกา ถึงเวลาแลวที่จะปรับเรื่องเหลานี้ใหเขากับโลกสมัยใหม และพิสูจนใหราษฎรทุกคนเห็นวาเราคืออาณาจักรแหงความรูแจง"
 AFG_raise_lashkar_regiments: "ตั้งกรมทหารลัชการ"
 AFG_raise_lashkar_regiments_desc: "เหลานักรบตอตานรวมอุดมการณของฟากีรในพื้นที่ปาทานของบริติชราชเรียกตนเองวาลัชการ บัดนี้เมื่อเขาปกครอง[ROOT.GetNameDef]แลว ก็อาจถึงเวลาที่จะจัดตั้งกรมทหารแบบเดียวกันอยางเปนทางการภายใตการรับราชการของรัฐ"
 AFG_support_nort_west_frontier_rebels: "สนับสนุนกบฏชายแดนตะวันตกเฉียงเหนือ"
 AFG_support_nort_west_frontier_rebels_desc: "กบฏชาวปาทานในชายแดนตะวันตกเฉียงเหนือของ[RAJ.GetAdjective]ยังคงตอสูอยางกลาหาญกับผูกดขี่ แมฟากีรจะยายมายัง[ROOT.GetNameDef]แลวก็ตาม เราควรเขาไปปกปองพวกเขา แมอาจหมายถึงสงครามกับผูที่อางสิทธิ์ในพื้นที่นั้นอยูในขณะนี้"
 AFG_occupy_peshawar_tt: "§Rสิ่งนี้อาจนําไปสูสงครามกับเจาของ [442.GetName]!§!"
 AFG_occupy_waziristan_tt: "§Rสิ่งนี้อาจนําไปสูสงครามกับเจาของ [987.GetName]!§!"
 AFG_appraoch_anti_communist_theologians: "ติดตอนักเทววิทยาตอตานโซเวียต"
 AFG_appraoch_anti_communist_theologians_desc: "มีนักวิชาการและนักเทววิทยามุสลิมจํานวนมากที่เห็นพองวาคอมมิวนิสตเปนภัยรายตอสังคมของเรา นาเศราที่[SOV.GetNameDef]กําลังยัดเยียดอุดมการณอันชั่วรายนี้ใหพี่นองของเราในเอเชียกลาง และเราจะตองทําทุกสิ่งที่ทําไดเพื่อหยุดความโงเขลานี้"
 AFG_unite_pashtunistan: "รวมปาทานิสถาน"
 AFG_unite_pashtunistan_desc: "เปาหมายสูงสุดของการตอสูของฟากีรคือเอกราชของรัฐปาทานในดินแดนของบริติชราชมาโดยตลอด แตบัดนี้เขามีโอกาสกอตั้งรัฐปาทานนอกพรมแดนดังกลาว และพิชิตภูมิภาคที่เหลือ ปาทานิสถานจงเจริญ เอมีรจงเจริญ!"
 AFG_form_the_turkestan_legion: "จัดตั้งกองทหารเติรกสถาน"
 AFG_form_the_turkestan_legion_desc: "มีผูคนมากมายที่ปรารถนาจะตอสูกับคอมมิวนิสตแมในเวทีโลก เราควรจัดตั้งกองกําลังอาสาสมัครชาวเติรกตอตานคอมมิวนิสต ผูจะสูจนถึงที่สุดกับกองกําลังที่ตอตานอิสลาม"
 AFG_form_the_turkestan_legion_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_turkestan_legion_cat$§! เพื่อเกณฑกองพลจากทั่วโลกเติรก"
 AFG_proclaim_a_new_caliphate: "ประกาศรัฐเคาะลีฟะฮใหม"
 AFG_proclaim_a_new_caliphate_desc: "นับตั้งแตการลมสลายของจักรวรรดิออตโตมัน ยังไมมีการประกาศรัฐเคาะลีฟะฮใหม เพื่อนําทางผูหลงทางและถูกชักนําผิด เราตองรับภาระอันใหมนี้ และดํารงตนใหสมกับมรดกของเหลารอชิดูนในอดีต"
 AFG_proclaim_a_new_caliphate_tt: "ไดรับเปาหมายสงคราม§Yยึดรัฐที่อางสิทธิ์§!ตอทุกประเทศที่ยึดครองรัฐซึ่งแผนยุทธศาสตรนี้ใหการอางสิทธิ์แกคุณ"
 AFG_proclaim_a_new_caliphate_2_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวม§!รัฐที่อางสิทธิ์ซึ่งเราควบคุมอยู"
 AFG_integrate_the_basmachi_movement: "ผนวกรวมขบวนการบาสมาจี"
 AFG_integrate_the_basmachi_movement_desc: "จนถึงป 1934 ขบวนการบาสมาจีตอสูกับกองกําลัง[SOV.GetAdjective]เพื่อปลดปลอยเอเชียกลางจากการปกครองแบบทรราช แมขบวนการของพวกเขาจะถูกบดขยี้ไปเกือบหมดแลว แตผูนําบางคนก็หลบหนีไปได เราควรพยายามติดตอนักสูเพื่ออิสรภาพเหลานี้ และเชิญพวกเขามายังราชสํานักของเรา"
 AFG_proclaim_the_second_afghan_empire: "ประกาศจักรวรรดิอัฟกันที่สอง"
 AFG_proclaim_the_second_afghan_empire_desc: "ในป 1747 อะหมัด ชาห ดุรรานี ไดรวมชนเผาอัฟกันและจัดระเบียบเปนจักรวรรดิ ในยุครุงเรืองที่สุด จักรวรรดินี้ปกครองเอเชียกลาง อินเดียตะวันออก และอิหรานเปนสวนใหญ จักรวรรดินี้ยืนเคียงขางจักรวรรดิออตโตมันในฐานะจักรวรรดิอิสลามที่สําคัญที่สุดในครึ่งหลังของศตวรรษที่ 18 และเราตองทวงคืนมรดกนั้น!"
 AFG_can_core_once_controlled_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐที่อางสิทธิ์เปนดินแดนหลักเมื่อยึดไดแลว"
 AFG_return_to_delhi: "หวนคืนเดลี"
 AFG_return_to_delhi_desc: "เดลีเคยเปนที่ประทับของสุลตาน และเปนที่ตั้งของปอมแดงซึ่งเคยเปนที่ตั้งบัลลังกนกยูงอันงดงามของเรา บัดนี้เราจะเดินทัพสูนครแหงนี้ ทวงคืนเมืองหลวงที่สูญเสียไปนาน และดํารงตนใหสมกับจักรพรรดิโมกุลในอดีต"
 AFG_reclaim_moghulistan: "ทวงคืนโมกุลิสถาน"
 AFG_reclaim_moghulistan_desc: "โมกุลิสถาน หนึ่งในขานาเตะชากาไท เปนหนึ่งในผูสืบทอดจักรวรรดิมองโกลอันยิ่งใหญ ในฐานะรัฐใหมที่แสวงหาความรุงโรจนเชนเดียวกับที่พวกเขาเคยมี การยึดดินแดนเหลานี้มาเปนของเราอาจเปนการรอบคอบ"
 AFG_ally_the_sikhs: "เปนพันธมิตรกับชาวซิกข"
 AFG_ally_the_sikhs_desc: "ชาวซิกขเปนชนกลุมนอยทางศาสนาที่สําคัญในอนุทวีปอินเดีย และเปนนักรบที่ดุดัน เราควรใชความชวยเหลือของพวกเขาในการพิชิตภูมิภาคนี้เพื่อตัวเราเอง"
 AFG_ally_the_brahui_khanate: "เปนพันธมิตรกับขานาเตะบราฮุย"
 AFG_ally_the_brahui_khanate_desc: "ขานาเตะกาลัตเปนพันธมิตรสําคัญของเราในชวงปลายของจักรวรรดิดุรรานี และชวยใหเราไดรับชัยชนะเหนือสมาพันธมราฐาอยางมาก เราควรติดตอพวกเขาอีกครั้ง และโคนผูสืบทอดของมราฐาลงเสีย!"
 AFG_the_echoes_of_panipat: "เสียงสะทอนแหงปานิปต"
 AFG_the_echoes_of_panipat_desc: "ยุทธการปานิปตครั้งที่สามยังคงกองอยูในความทรงจําของทุกคนในอนุทวีปอินเดีย ที่นั่น เราทลายกองกําลังมราฐาและสถาปนาความเปนใหญเหนืออินเดียตะวันตกเฉียงเหนือ ถึงเวลาที่เราจะทําเชนนั้นอีกครั้ง และโคนทายาทผูอหังการแหงสมาพันธมราฐาลงเสีย!"
 AFG_the_conquerors_of_persia: "ผูพิชิตเปอรเซีย"
 AFG_the_conquerors_of_persia_desc: "[PER.GetNameDefCap] ดินแดนแหงความมั่งคั่งและประวัติศาสตรอันยิ่งใหญ ครั้งหนึ่งเคยเปนคูแขงของจักรวรรดิ ดวยการนําดินแดนนี้มาอยูใตการปกครองของเรา เราจะยืนยันความเปนใหญ ยึดครองดินแดนตะวันตกที่สําคัญยิ่ง และตอกยํ้าสถานะของจักรวรรดิในฐานะผูสืบทอดความยิ่งใหญแหงจักรวรรดิที่แทจริง"
 AFG_reclaim_transoxiana: "ทวงคืนทรานโซเซียนา"
 AFG_reclaim_transoxiana_desc: "ดินแดนเกาแกแหงทรานโซเซียนาเคยเปนของจักรวรรดิตีมูริด ซึ่งเราคือทายาท เราตองทวงคืนดินแดนเหลานี้ มิฉะนั้นมรดกของเราจะถูกแปดเปอนดวยความออนแอและความลังเล!"
 AFG_rebuild_the_silk_road: "สรางเสนทางสายไหมขึ้นใหม"
 AFG_rebuild_the_silk_road_desc: "เสนทางสายไหมเคยนําความมั่งคั่งและวัฒนธรรมมาสูจักรวรรดิ ดวยการฟนฟูเครือขายการคาทางประวัติศาสตรนี้ เราจะทวงคืนสถานะศูนยกลางการคาโลก สรางความมั่งคั่งแกจักรวรรดิและความรุงเรืองทั่วอาณาเขตอันกวางใหญ"
 AFG_restore_the_timurid_empire: "ฟนฟูจักรวรรดิตีมูริด"
 AFG_restore_the_timurid_empire_desc: "ธงของตีมูรโบกสะบัดอีกครั้ง และจักรวรรดิที่เคยสรางความหวาดกลัวแกเหลาสุลตานและกษัตริยไดผงาดขึ้นจากเถาถานแหงประวัติศาสตร การปกครองของเราแผไปทั่วดินแดนที่ครั้งหนึ่งถูกหลอหลอมโดยการพิชิตของพระองค ผูกตะวันออกและตะวันตกไวภายใตอํานาจเดียว ขอใหโลกจงสดับ—ตีมูริดไดกลับมาแลว และครั้งนี้เราจะไมเลือนหายไปในอดีต"
 AFG_the_crown_and_the_world: "มงกุฎและโลก"
 AFG_the_crown_and_the_world_desc: "ชะตากรรมของจักรวรรดิคือการผงาดขึ้นเปนอภิมหาอํานาจโลกที่ไรคูแขง ดวยการขยายอิทธิพล เสริมพลังอํานาจ และประกาศความเปนใหญ เราจะไดครองสถานะผูปกครองสูงสุดแหงโลกสมัยใหม"
 AFG_the_amu_darya_plan: "แผนการอามูดารยา"
 AFG_the_amu_darya_plan_desc: "จักรพรรดิไดวางแผนและติดตอกับผูคนในบานเกิดเดิมของพระองคที่ปรารถนาจะหลุดพนจากการปกครองของ[SOV.GetAdjective] กอนอื่น การรบเพื่อการปลดปลอยของเราตองไดรับการวางแผนอยางรอบคอบ หลังจากนั้นเราจึงจะโจมตี[SOV.GetNameDef]ได"
 AFG_reclaim_the_emperors_lost_domain: "ทวงคืนดินแดนที่จักรพรรดิสูญเสีย"
 AFG_reclaim_the_emperors_lost_domain_desc: "ในที่สุดเวลานั้นก็มาถึง ดวยสถานการณโลกในปจจุบัน ไมมีเวลาใดดีไปกวานี้ที่จะโจมตี[SOV.GetNameDef] เราจะปลดปลอยเอเชียกลางทั้งหมดใหสิ้นสุดเสียที!"
 AFG_secure_army_support: "หาการสนับสนุนจากกองทัพ"
 AFG_secure_army_support_desc: "ยังมีนายทหารจํานวนหนึ่งในกองทัพที่ไดรับการแตงตั้งโดยหรือเคยรับใชภายใต $AFG_amunullah_khan$ ดวยสิ่งจูงใจที่เหมาะสม พวกเขาอาจถูกโนมนาวใหสนับสนุนการกลับคืนสูราชบัลลังกของพระองค"
 AFG_secure_army_support_tt: "§Yกองพลของกองทัพจะเขารวมฝายเรามากขึ้นในสงครามกลางเมืองที่จะมาถึง§!"
 AFG_modifiy_amanullah_insurrection_modifier_tt: "ปรับ §Y$AFG_amanullah_insurection_modifier$§! ดังนี้:\n"
 AFG_modifiy_look_to_the_past_modifier_tt: "ปรับ §Y$AFG_look_to_the_past_modifier$§! ดังนี้:\n"
 AFG_contact_rural_loyalists: "ติดตอมาลิกในชนบท"
 AFG_contact_rural_loyalists_desc: "ชนชั้นนํา[AFG.GetAdjective]นั้นติดสินบนหรือโนมนาวไดงาย แตชาว[AFG.GetAdjective]ทั่วไปกลับไมคอยสนใจของลอใจทางวัตถุหรือคําสัญญาทางการเมือง อยางไรก็ตาม ดวยการปลุกเราคุณคาดั้งเดิมและความคับแคนใจของพวกเขา เราอาจยังดึงพวกเขามาเขากับอุดมการณของเราได"
 AFG_contact_rural_loyalists_tt: "§Yกองพลทหารอาสาปาทานจะเขารวมฝายเรามากขึ้นในสงครามกลางเมืองที่จะมาถึง§!"
 AFG_request_german_support: "ขอการสนับสนุนจากเยอรมนี"
 AFG_request_german_support_desc: "$AFG_amunullah_khan$ ชื่นชม[GER.GetNonIdeologyName]มาชานาน และไดผูสนับสนุนระดับสูงจํานวนหนึ่งในรัฐบาลของประเทศนั้น บางทีพวกเขาอาจสนับสนุนการกลับมาของกษัตริยเพื่อแลกกับระบอบที่เปนมิตรในภูมิภาค"
 AFG_request_german_support_tt: "หาก§Y[GER.GetNonIdeologyName]§!ยอมรับขอเสนอของเรา พวกเขาจะจัดหาอาวุธและสงอาสาสมัครมาชวยเราเมื่อสงครามกลางเมืองเริ่มขึ้น §Y[GER_oskar_von_nidermayer.GetName]§! จะเขารวมกับเราในฐานะนายพล"
 AFG_request_japanese_support_tt: "หาก§Y[JAP.GetNonIdeologyName]§!ยอมรับขอเสนอของเรา พวกเขาจะจัดหาอาวุธและสงอาสาสมัครมาชวยเราเมื่อสงครามกลางเมืองเริ่มขึ้น"
 AFG_political_events_53_tt: "§Y[GER.GetNonIdeologyName]จะจัดหาอาวุธและสงอาสาสมัครมาชวยเราเมื่อสงครามกลางเมืองเริ่มขึ้น§!"
 AFG_stir_unrest_in_the_east: "ปลุกปนความไมสงบทางตะวันออก"
 AFG_stir_unrest_in_the_east_desc: "วาซิริสถานและเปศวารยังคงเปนแหลงเพาะความเคลื่อนไหวทั้งตอตาน[RAJ.GetAdjective]และ[AFG.GetAdjective] เราควรทําตามแบบอยางของพวกเขา และปลุกปนการกบฏในชองเขาไคเบอรเพื่อตรึงกองกําลังของกษัตริยไวที่อื่น"
 AFG_eastern_state_breakaway_tt: "§Y [1006.GetName] \n [1008.GetName] §!"
 AFG_fascist_cw_is_over: "การกอกบฏของอามานุลลาหสิ้นสุดลงแลว (ฝายฟาสซิสตไดโคนลมรัฐบาลและชนะสงครามกลางเมือง)"
 AFG_request_japanese_support: "ขอการสนับสนุนจากญี่ปุน"
 AFG_request_japanese_support_desc: "ชาว[JAP.GetAdjective]มุงครอบงําทวีปเอเชีย และอาจกําลังมองหาพันธมิตรที่สนับสนุนเปาหมายใหญของพวกเขา การโนมนาวพวกเขาวากษัตริยซาฮีรคูแขงของเราคัดคานแนวคิดนี้ และขอการสนับสนุนสําหรับการกอกบฏที่กําลังจะมาถึงของเรา อาจเปนการรอบคอบ"
 AFG_hold_a_loya_jirga: "จัดประชุมโลยาจีรกา"
 AFG_hold_a_loya_jirga_desc: "เราควรโนมนาวกษัตริยซาฮีรใหจัดการประชุมกับผูนําชนเผาและผูนําศาสนาของชาติ ซึ่งเราจะไดตั้งคําถามถึงความชอบธรรมของพระองคและไดรับความเห็นใจตอการกอกบฏที่กําลังเติบโตของเรามากขึ้น"
 AFG_hold_a_loya_jirga_tt: "เมื่อ§Yสงครามกลางเมือง[ROOT.GetAdjective]§!เริ่มขึ้น ฝายตรงขามจะไดรับสิ่งตอไปนี้เปนเวลา §G180§! วัน:"
 AFG_invite_waziristan_rebels: "เชิญกบฏวาซิริสถาน"
 AFG_invite_waziristan_rebels_desc: "ฟากีรแหงอิปและกองกําลังอาสาลัชการของเขากําลังสูรบอยางดุเดือดกับทางการ[RAJ.GetAdjective]ในมณฑลตะวันตกเฉียงเหนือ เราควรชวยพวกเขาขามพรมแดนของเรา และเริ่มสรางฐานอํานาจใหพวกเขาในภูมิภาคตะวันออกของเรา เพื่อที่สักวันหนึ่งพวกเขาจะกลับไปยังวาซิริสถานดวยกําลังที่แข็งแกรงกวาที่เคย"
 AFG_invite_waziristan_rebels_tt: "เมื่อ§Yสงครามกลางเมือง[ROOT.GetAdjective]§!เริ่มขึ้น เราจะไดรับกําลังพลเพิ่มเติม §G+10000§!"
 AFG_the_faqirs_revolt: "การลุกฮือของฟากีร"
 AFG_the_faqirs_revolt_desc: "ในที่สุดเวลานั้นก็มาถึง กองทหารของฟากีรพรอมลุกฮือขึ้นทางตะวันออกเพื่อตอตานเจาหนาที่ฉอฉลในคาบูล และนําประเพณีอิสลามที่ชาติของเราเคยยึดถือกลับคืนมา อินชาอัลลอฮ เราจะกอบกูอัฟกานิสถาน!"
 AFG_return_of_the_emir: "การกลับมาของกษัตริย"
 AFG_return_of_the_emir_desc: "แผนการถูกวางไวแลว การติดตอไดรับการสรางขึ้น และอาวุธถูกแจกจายเรียบรอย ที่เหลือมีเพียงการกลับคืนสูอัฟกานิสถานของกษัตริย แลวกองกบฏจรจัดของเราจะเริ่มโคนลมระบอบอันไมชอบธรรมของกษัตริยซาฮีร"
 AFG_revive_the_1923_constitution: "ฟนรัฐธรรมนูญป 1923"
 AFG_revive_the_1923_constitution_desc: "กษัตริยทรงเปนผูมีวิสัยทัศน ซึ่งเมื่อป 1923 ทรงเขาใจวาชาติจําเปนตองถูกฉุดเขาสูศตวรรษที่ 20 ทวาการปฏิรูปของพระองคถูกซาฮีร ชาห ฉีกทิ้งเกือบหมด แตเมื่อกษัตริยกลับคืนสูอํานาจ เราสามารถสานตอจากที่พระองคทิ้งไวและฟนรัฐธรรมนูญป 1923 ของพระองค"
 AFG_custail_pashtunwali_primacy: "ลดความเปนใหญของปาทานวาลี"
 AFG_custail_pashtunwali_primacy_desc: "ประมวลจริยธรรมดั้งเดิมของชาวปาทาน หรือปาทานวาลี ไมมีที่ยืนในรัฐใหมของกษัตริย กฎหมายชุดใหมจะถูกตราขึ้นเพื่อตอกยํ้าอํานาจของชาวปาทาน พรอมปรับปรุงประมวลอันลาสมัยนี้ใหทันสมัย"
 AFG_education_for_women_and_girls: "การศึกษาสําหรับสตรีและเด็กหญิง"
 AFG_education_for_women_and_girls_desc: "กษัตริยและพระมเหสีทรงเขาใจถึงความสําคัญของการใหสตรีและเด็กหญิงไดรับการศึกษา แทนที่จะถูกตัดสินใหใชชีวิตเปนทาสในบาน หลังจากพระองคถูกโคนลม การปฏิรูปการศึกษาของกษัตริยก็ถูกยกเลิก บัดนี้เราจะแกไขความอยุติธรรมนั้น"
 AFG_enforce_western_attire: "บังคับใชเครื่องแตงกายแบบตะวันตก"
 AFG_enforce_western_attire_desc: "กษัตริยและคนวงในไมประทับใจเครื่องแตงกายแบบดั้งเดิมที่ประชากรสวนใหญยึดถือ พวกเขามองวาเปนสัญลักษณของสังคมลาหลัง จึงตองการสรางโรงงานสิ่งทอและออกกฎหมายใหมเพื่อบังคับใหสวมเครื่องแตงกายแบบตะวันตก"
 AFG_crackdown_on_nomadic_practices: "ปราบปรามวิถีชีวิตเรรอน"
 AFG_crackdown_on_nomadic_practices_desc: "TODO"
 AFG_repaying_our_friends: "ตอบแทนมิตรของเรา"
 AFG_repaying_our_friends_desc: "TODO"
 AFG_expand_state_run_factories: "ขยายโรงงานของรัฐ"
 AFG_expand_state_run_factories_desc: "หลังจากถูกระบอบกอนละเลยมาหลายป ถึงเวลาที่เราจะเริ่มตนการปรับปรุงเศรษฐกิจของประเทศใหทันสมัย ดวยการกอตั้งโรงงานของรัฐแหงใหมที่ผลิตทั้งสินคาอุปโภคบริโภคและยุทโธปกรณทางทหาร"
 AFG_reinforce_the_royal_guard: "เงาแหงกษัตริย"
 AFG_reinforce_the_royal_guard_desc: "แมจะมีความชอบธรรม แตก็มีหลายคนที่ไมพอใจการกลับมาของกษัตริยและการปฏิรูปแบบถอนรากถอนโคนของพระองค ผูทรยศเหลานี้จะไดรับอนุญาตใหบอนทําลายงานของกษัตริยไมได และตองถูกจัดการโดยหนวยรักษาความมั่นคงใหมที่ปฏิบัติการในเงามืดและบังคับใชพระประสงคของพระองค"
 AFG_reinforce_the_royal_guard_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_shadows_of_the_emir_category$§! เพื่อปราบปรามผูเห็นตางและเพิ่มเสถียรภาพ"
 AFG_increase_land_and_animal_taxes: "ขึ้นภาษีที่ดินและปศุสัตว"
 AFG_increase_land_and_animal_taxes_desc: "ประชากรในชนบทมีสวนชวยตอความมีชีวิตชีวาทางเศรษฐกิจของชาตินอยมาก และการทําเกษตรเพื่อยังชีพทําใหพวกเขาหลีกเลี่ยงภาษีไดเกือบทุกรูปแบบ เพื่อจูงใจใหใชวิธีการเกษตรสมัยใหมมากขึ้น เราจะออกนโยบายภาษีใหมที่บังคับใหพวกเขาตองแสวงหากําไรมากขึ้นหากตองการมีอาหารกิน"
 AFG_expand_state_education: "ขยายการศึกษาของรัฐ"
 AFG_expand_state_education_desc: "TODO"
 AFG_establish_darulaman: "กอตั้งดารุลอามาน"
 AFG_establish_darulaman_desc: "ดารุลอามานถูกวางแผนใหเปนเมืองใหมที่จะมาแทนที่คาบูลในฐานะเมืองหลวงของ[AFG.GetNonIdeologyName] เมื่อกษัตริยถูกโคนลม งานกอสรางเมืองก็ถูกระงับ บัดนี้เราสามารถทําโครงการใหสําเร็จและสถาปนาเมืองนี้เปนประภาคารแหงความทันสมัย"
 AFG_towards_an_amanullah_caliphate: "สูรัฐเคาะลีฟะฮแหงอามานุลลาห"
 AFG_towards_an_amanullah_caliphate_desc: "$AFG_amunullah_khan$ เคยพิจารณาจะรับตําแหนงเคาะลีฟะฮหลังการลมสลายของจักรวรรดิออตโตมัน แตตัดสินใจไมรับ เพื่อมุงสูระบอบที่ทันสมัยกวา ครั้งนี้พระองคตัดสินใจที่จะไมทําผิดซํ้า และจะรักษาสถานะในฐานะผูนําแหงโลกอิสลาม"
 AFG_alternative_partnerships: "แสวงหาหุนสวนทางเลือก"
 AFG_alternative_partnerships_desc: "เรารักษาเอกราชไวไดดวยการยุยงให[ENG.GetAdjective]และ[SOU.GetAdjective]ถวงดุลกันเองอยางระมัดระวังมาหลายทศวรรษ แตบัดนี้ผูเลนรายใหมไดเขารวมเกมใหญ เราจึงตองปรับยุทธศาสตรใหสอดคลอง"
 AFG_officer_training: "การฝกนายทหาร"
 AFG_officer_training_desc: "กองทัพ[GER.GetAdjective]พิสูจนแลววาเหนือกวากองทัพ[ENG.GetAdjective]หรือ[SOU.GetAdjective] เราควรขอการสนับสนุนจากนายทหารของพวกเขาในการฝกทหาร[ROOT.GetAdjective]รุนตอไป"
 AFG_permit_axis_airbases: "อนุญาตใหฝายอักษะตั้งฐานทัพอากาศ"
 AFG_permit_axis_airbases_desc: "มิตรของเราใน[GER.Capital.GetCapitalVictoryPointName]กําลังประสบปญหาในการสงกองทัพอากาศมาปฏิบัติการไกลจากบานเกิด เราสามารถชวยบรรเทาปญหานี้ใหพวกเขา พรอมทั้งไดโครงสรางพื้นฐานและความเชี่ยวชาญที่เปนประโยชนสําหรับตัวเราเอง"
 AFG_join_axis: "เขารวมฝายอักษะ"
 AFG_join_axis_desc: "แมเราจะหลีกเลี่ยงการเขาไปพัวพันกับความขัดแยงใหญมาไดจนถึงตอนนี้ แตก็มีโอกาสมากมายใหใชประโยชนหากเราทุมเทใหกับอุดมการณของฝายอักษะอยางเต็มที่ ดังนั้นเราจะยื่นขอเปนสมาชิกเต็มตัวของพันธมิตร"
 AFG_axis_airforce: "กองทัพอากาศแบบอักษะ"
 AFG_axis_airforce_desc: "หลังจากทํางานใกลชิดกับกองทัพอากาศ[GER.GetAdjective] เราเชื่อวาเราสามารถสรางกองกําลังที่ใชงานไดจริงของเราเองตามแบบของพวกเขา สิ่งที่เราตองการมีเพียงยุทโธปกรณ"
 AFG_axis_equipment: "ยุทโธปกรณฝายอักษะ"
 AFG_axis_equipment_desc: "ยุทโธปกรณทางทหารของเราเปนการผสมปนเปของรุนตาง ๆ จากหลายชาติ อยางไรก็ตาม ดวยความชวยเหลือเล็กนอยจากชาว[GER.GetAdjective] ในที่สุดเราจะสามารถกําหนดมาตรฐานยุทโธปกรณทั้งหมดและปรับปรุงใหทันสมัยไปพรอมกัน"
 AFG_kabul_conference: "การประชุมคาบูล"
 AFG_kabul_conference_desc: "หลังจากตองดิ้นรนติดอยูระหวาง[ENG.GetAdjective]และ[SOU.GetAdjective]มาหลายทศวรรษ บัดนี้เรามีโอกาสยืนเคียงขางผูปกครองแหงระเบียบโลกใหม และทวงสิ่งที่เปนของเราโดยชอบธรรม"
 AFG_kabul_conference_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_kabul_conference_category$§! เพื่อลดตนทุนการเสนอสําหรับรัฐเปาหมายใน§Yอินเดีย เอเชียกลาง อิหราน และตะวันออกกลาง§!ระหวางการประชุมสันติภาพเมื่อฝายของเราไดรับชัยชนะ"
 AFG_support_king_zahir: "สนับสนุนกษัตริยซาฮีร"
 AFG_support_king_zahir_desc: "หลังจากความไมมั่นคงทางการเมืองมาหลายทศวรรษ รัชสมัยของกษัตริยซาฮีร ชาห จะเปนจุดเริ่มตนของยุคแหงสันติภาพและเสถียรภาพทางเศรษฐกิจสําหรับชาติที่บอบชํ้าของเรา"
 AFG_support_king_zahir_tt: "§Yกษัตริยซาฮีร ชาห§! ไดรับ:\n อํานาจทางการเมืองที่ไดรับ §G+5%§! \n การสนับสนุนไมฝกใฝฝายใดรายวัน §G+0.02§!"
 AFG_biding_our_time: "รอคอยจังหวะ"
 AFG_biding_our_time_desc: "ดวยกษัตริยซาฮีร ชาห ทรงเปนประมุขในนามของชาติ รัฐบาลสามารถดําเนินกิจการไดโดยไมตองกลัวการลุกฮือของพวกหัวรุนแรง ตราบใดที่ยังรักษาเสียงขางมากฝายอนุรักษนิยมไวได อยางไรก็ตาม อาจยังมีโอกาสเล็ก ๆ ในการปรับปรุงชาติใหทันสมัยในแนวทางที่ไมลวงลํ้าวิถีดั้งเดิม"
 AFG_expand_the_kings_powerbase: "ขยายฐานอํานาจของกษัตริย"
 AFG_expand_the_kings_powerbase_desc: "กษัตริยซาฮีร ชาห ผูทรงพระเยาวเปนเพียงประมุขในนามสําหรับประชาชน ขณะที่เหลาพระปตุลาของพระองคครองตําแหนงที่ทรงอํานาจที่สุดในรัฐบาล อยางไรก็ตาม กษัตริยทรงขัดเคืองพระทัยมากขึ้นเรื่อย ๆ กับแนวคิดลาสมัยของพวกเขา และปรารถนาจะสรางแรงสนับสนุนใหแกระบอบที่กาวหนากวา"
 AFG_visit_foreign_capitals: "เยือนเมืองหลวงตางประเทศ"
 AFG_visit_foreign_capitals_desc: "ระบอบของเราขาดความสัมพันธที่แนนแฟนกับมหาอํานาจทั่วโลก เมื่อสถานการณภูมิรัฐศาสตรมีเสถียรภาพนอยลง การสรางความสัมพันธที่ดีขึ้นกับมหาอํานาจเหลานั้นอาจเปนประโยชนสูงสุดตอเรา เผื่อมีโอกาสเกิดขึ้น"
 AFG_retire_the_uncles: "ปลดเหลาพระปตุลา"
 AFG_retire_the_uncles_desc: "สถานการณทางการเมืองใน[ROOT.Capital.GetCapitalVictoryPointName]เริ่มเปลี่ยนแปลงไปในทางที่เปนผลเสียตอขุนนางรุนเกา บัดนี้ถึงเวลาที่กษัตริยจะยุบคณะรัฐมนตรีชุดปจจุบันและจัดตั้งชุดใหมที่สอดคลองกับเปาหมายของพระองคมากขึ้น"
 AFG_implement_currency_controls: "ดา อัฟกานิสถาน แบงก"
 AFG_implement_currency_controls_desc: "เศรษฐกิจของเราขาดภาคการเงินที่แข็งแกรงซึ่งจะสนับสนุนการพัฒนาเศรษฐกิจของชาติ ดังนั้นเราควรรวมมือกับภาคเอกชนเพื่อกอตั้งธนาคารที่เปนเจาของรวมกัน ซึ่งจะใหบริการแกอุตสาหกรรมและธุรกิจเกิดใหมของเรา"
 AFG_privatize_factories: "แปรรูปโรงงาน"
 AFG_privatize_factories_desc: "TODO"
 AFG_introduce_national_service: "นําระบบรับราชการแหงชาติมาใช"
 AFG_introduce_national_service_desc: "ชาติรอบตัวเรากําลังดิ่งสูความขัดแยง และไมมีอะไรรับประกันวาเราจะหลีกเลี่ยงการถูกดึงเขาสูวังวนนั้นได เพื่อเตรียมรับมือกับเหตุการณดังกลาว เราจะนําระบบรับราชการแหงชาติรูปแบบหนึ่งมาใชเพื่อเสริมกําลังกองทัพ"
 AFG_placeholder_1: "หาการลงทุนจากเยอรมนี"
 AFG_placeholder_1_desc: "เราไมมีความรักใครตอ[ENG.GetAdjective]หรือ[SOU.GetAdjective] หลังจากความเปนปรปกษและความขัดแยงระหวางกันมาหลายศตวรรษ อยางไรก็ตาม [GER.GetName]ที่กําลังผงาดขึ้นมอบโอกาสใหเราไดหุนสวนระหวางประเทศที่มีแนวคิดใกลเคียงกันมากขึ้น"
 AFG_gain_religious_support_for_reforms: "ผูมอบความไววางใจแดพระเจา"
 AFG_gain_religious_support_for_reforms_desc: "ประชาชนมีความกังวลเพิ่มขึ้นวากษัตริยซาฮีร ชาห ผูทรงพระเยาวจะใชอํานาจที่เพิ่งไดมาดําเนินการปฏิรูปอยางรุนแรงที่จะทําลายวิถีชีวิตของพวกเขา เพื่อคลายความกลัวเหลานี้ เราจะหาการสนับสนุนจากเหลามุลลาหและแสดงใหเห็นถึงความมุงมั่นของกษัตริยตออิสลาม"
 AFG_reform_1: "ปฏิรูปการศึกษา"
 AFG_reform_1_desc: "การเปลี่ยนผานสูประชาธิปไตยแบบรัฐสภาไมไดราบรื่น และเราตองทํามากขึ้นเพื่อปลูกฝงคุณคาประชาธิปไตยใหคนรุนตอไป ดังนั้นเราตองปฏิรูประบบการศึกษาและทําใหเด็กทุกคนทั่วประเทศเขาถึงไดมากขึ้น"
 AFG_concessions_to_pashtuns: "ผอนปรนใหชาวปาทาน"
 AFG_concessions_to_pashtuns_desc: "ชาวปาทานเปนประชากรสวนใหญ และครอบครัวสวนใหญของพวกเขายึดถือประเพณีโบราณแหงปาทานวาลีมาหลายศตวรรษ บัดนี้หลายคนกังวลวาวิถีชีวิตของตนกําลังถูกกัดกรอน ความกังวลนี้นาจะบรรเทาลงหากเรานํานักชาตินิยมปาทานและผูยึดถือปาทานวาลีเขาสูรัฐบาลมากขึ้น"
 AFG_reform_2: "สรางเขื่อนชัก"
 AFG_reform_2_desc: "ดวยความชวยเหลือจากหุนสวนตางชาติ เรามีทั้งเทคโนโลยีและเงินทุนในการสรางเขื่อนไฟฟาพลังนํ้าขนาดมหึมาแหงใหมบนแมนํ้าชัก เพื่อจายไฟฟาใหเมืองหลวงและพื้นที่โดยรอบ แมวาการนี้ยอมทําใหศัตรูของผูอุปถัมภเราไมพอใจ"
 AFG_reform_3: "จํากัดอิทธิพลตอตานประชาธิปไตย"
 AFG_reform_3_desc: "แมเราจะพยายามเชื่อมชองวางระหวางรัฐบาลใหมกับฝายคาน แตหลายคนยังคงมีแนวโนมยึดถือความเชื่อแบบปฏิกิริยาและตอตานประชาธิปไตย และเปนไปไดอยางยิ่งที่พวกเขาอาจลงมือตอตานเราหากมีโอกาส ดังนั้นเราตองทํามากขึ้นเพื่อจํากัดความเคลื่อนไหวเชนนั้น"
 AFG_reform_4: "การปรับปรุงเศรษฐกิจใหทันสมัย"
 AFG_reform_4_desc: "เมื่อเสถียรภาพกลับคืนสู[ROOT.GetNonIdeologyName] การลงทุนและความสนใจทางธุรกิจก็ตามมา เพื่อกระตุนเศรษฐกิจ เราจะลงทุนในการปรับปรุงการเกษตรและอุตสาหกรรมที่มีอยูอยางจํากัดใหทันสมัย"
 AFG_parliamentary_democracy: "ประชาธิปไตยแบบรัฐสภา"
 AFG_parliamentary_democracy_desc: "แนวคิดทางการเมืองของกษัตริยซาฮีร ชาห เริ่มฉายแสงออกมาหลังจากอยูใตเงาของเหลาพระปตุลามาหลายป เห็นไดชัดวากษัตริยจะทรงสนับสนุนการเปลี่ยนผานสูประชาธิปไตยแบบรัฐสภา หากมีแรงสนับสนุนตอการเปลี่ยนแปลงเชนนี้มากพอในหมูประชาชน อยางไรก็ตาม การเปลี่ยนแปลงที่ถอนรากถอนโคนเชนนี้อาจทําใหประเทศดิ่งสูสงครามกลางเมืองกับกลุมคนหัวดั้งเดิมนอกเมืองหลวง"
 AFG_parliamentary_democracy_tt: "§Yหากการสนับสนุนประชาธิปไตยมากกวา 50% เราจะหลีกเลี่ยงการเกิดสงครามกลางเมืองได§!"
 AFG_secure_dynasty: "คํ้าจุนราชวงศ"
 AFG_secure_dynasty_desc: "เมื่อเศรษฐกิจมั่นคงและประชาชนสงบลงแลว เราสามารถคํ้าจุนราชวงศบารักไซไดดวยการกําจัดกลุมที่ภักดีนอยกวาออกจากรัฐบาล และแทนที่ดวยสมาชิกครอบครัวคนอื่นที่ภักดีตอกษัตริย หรือที่สําคัญกวานั้น ภักดีตอเหลาพระปตุลาของพระองค"
 AFG_maintain_neutrality: "รักษาความเปนกลาง"
 AFG_maintain_neutrality_desc: "แมภายในประเทศจะคอนขางมีเสถียรภาพ แตสถานการณโลกกลับอันตรายมากขึ้นเรื่อย ๆ กอนที่เราจะถูกลากเขาสูความขัดแยงใด ๆ โดยไมเต็มใจ เราตองแสดงใหทุกฝายเห็นอยางชัดเจนวาเรายังคงเปนชาติที่เปนกลาง"
 AFG_expel_axis_nationals: "ขับไลพลเมืองฝายอักษะ"
 AFG_expel_axis_nationals_desc: "ฝายสัมพันธมิตรกลาวหาวาเราเอาใจศัตรูของพวกเขา เนื่องจากพลเมืองของชาติคูสงครามจํานวนมากไดรับอนุญาตใหดําเนินกิจกรรมอยางเสรีใน[ROOT.GetNonIdeologyName] แมจะมีหลักฐานนอยนิดวาคนเหลานี้ทําสิ่งใดที่เปนผลเสียตอผลประโยชนของเรา แตเราควรเอาใจฝายสัมพันธมิตรดวยการสั่งใหคนเหลานี้ออกไปตลอดชวงความขัดแยงระดับโลกครั้งนี้"
 AFG_expel_allied_nationals: "ขับไลพลเมืองฝายสัมพันธมิตร"
 AFG_expel_allied_nationals_desc: "ฝายอักษะไดนําเสนอหลักฐานที่นาสงสัยวาระบอบของเราเสี่ยงที่จะถูกฝายสัมพันธมิตรโคนลม พวกเขาอางวาวิธีเดียวที่จะปองกันไดคือการขับไลพลเมืองของชาติฝายสัมพันธมิตรทั้งหมด เพื่อกวาดลางสายลับของพวกเขาในประเทศ"
 AFG_pursue_our_own_agenda: "ดําเนินวาระของเราเอง"
 AFG_pursue_our_own_agenda_desc: "ระเบียบระหวางประเทศกําลังถูกเขียนขึ้นใหมขณะที่มหาอํานาจปะทะกันเอง แทนที่จะผูกตัวเองไวกับกลุมใดกลุมหนึ่ง เราควรฉวยประโยชนจากความโกลาหลและดําเนินเปาหมายนโยบายตางประเทศของเราเอง"
 AFG_align_with_the_allies: "เขาขางฝายสัมพันธมิตร"
 AFG_align_with_the_allies_desc: "แมจะมีความคับแคนใจตออังกฤษมากมาย แตเราตองวางมันไวกอนในตอนนี้และแสวงหาความรวมมือกับฝายสัมพันธมิตรใหมากขึ้น ดังที่ชาวอังกฤษวาไว จัดการกับปศาจที่รูจักยอมดีกวา"
 AFG_demand_pashtunistan_referendum: "เรียกรองประชามติปาทานิสถาน"
 AFG_demand_pashtunistan_referendum_desc: "ชาวปาทานเปนประชากรสวนใหญของชาติเรา แตอีกมากยังอยูนอกพรมแดนในรัฐเพื่อนบาน เราตองผลักดันใหชาวปาทานในรัฐเหลานั้นไดรับเอกราช เพื่อนําพวกเขาเขาสูเขตอิทธิพลของเรา"
 AFG_protector_of_the_tajiks: "ผูปกปองชาวทาจิก"
 AFG_protector_of_the_tajiks_desc: "ความตึงเครียดมักเกิดขึ้นระหวางชาวปาทานซึ่งเปนเสียงขางมากกับชาวทาจิกจํานวนมากทางภาคเหนือ อยางไรก็ตาม เรามีโอกาสชนะใจพวกเขาดวยการปลดปลอยชาวทาจิกนอกพรมแดนของเราที่อยูภายใตการปกครองแบบเผด็จการของ[742.OWNER.GetLeader]"
 AFG_protector_of_the_tajiks_tt: "ปลดล็อกการตัดสินใจเพื่อเสนอสันติภาพกับ[742.OWNER.GetNameDef]เมื่อ[742.GetName]ถูกยึดครองโดย[ROOT.GetName]"
 AFG_anti_soviet_cooperation: "ความรวมมือตอตานโซเวียต"
 AFG_anti_soviet_cooperation_desc: "มีหลายชาติที่ตองการเห็นอิทธิพลของ[SOU.GetAdjective]ถูกจํากัด เราควรใชโอกาสนี้รับความเชี่ยวชาญทางทหารจากชาติเหลานั้น เพื่อใหเราพรอมเต็มที่สําหรับการขยายอํานาจของ[SOU.GetAdjective]ในอนาคต"
 AFG_sinkiang_intervention: "แทรกแซงซินเจียง"
 AFG_sinkiang_intervention_desc: "[SIK.GetNonIdeologyName]เปนสวนหนึ่งของโลกอิสลามมาชานาน อยางไรก็ตาม การผงาดขึ้นของคอมมิวนิสตในอดีตจักรวรรดิรัสเซียและจีนกําลังคุกคามพี่นองมุสลิมของเราขามพรมแดนที่นั่น ถึงเวลาที่เราจะขจัดภัยคุกคามตอพวกเขาใหสิ้นซาก"
 AFG_gant_refuge_to_jadidists: "ใหที่ลี้ภัยแกกลุมญะดีด"
 AFG_gant_refuge_to_jadidists_desc: "นักสมัยใหมนิยมและนักปฏิรูปอิสลามที่เปนสวนหนึ่งของขบวนการญะดีดใน[SOV.GetNameDef]กําลังถูกรัฐบาลปราบปรามอยางหนัก และอดีตสมาชิกกลุมยังบุคอรันและยังคีวานจํานวนมากตกเปนเปาหมายการกวาดลางของ[SOV.GetLeader] การใหที่ลี้ภัยแกพวกเขาในประเทศของเรา พรอมเปดโอกาสใหพวกเขานําอุดมการณประชาธิปไตยบางสวนมาดวย จะเปนการกระทําที่ชาญฉลาด"
 AFG_ally_the_young_afghans: "เปนพันธมิตรกับกลุมยังอัฟกัน"
 AFG_ally_the_young_afghans_desc: "กลุมยังอัฟกันซึ่งนําโดยปญญาชนมะหมูด ตารซี มีอิทธิพลตออดีตกษัตริยอามานุลลาห ขาน และขับเคลื่อนขบวนการปฏิรูปที่สนับสนุนระบอบราชาธิปไตยภายใตรัฐธรรมนูญ เราควรฟนการติดตอกับผูภักดีตออามานุลลาหบางสวนที่มีแนวคิดเอียงไปทางประชาธิปไตย และรับประกันการสนับสนุนของพวกเขาตอรัฐบาลประชาธิปไตยใหมของเรา"
 AFG_propose_confederation_with_pakistan: "เสนอรวมเปนสมาพันธรัฐกับปากีสถาน"
 AFG_propose_confederation_with_pakistan_desc: "ประชาชนของ[PAK.GetNonIdeologyName]ทนทุกขภายใตการปกครองของ[ENG.GetAdjective]มานานเกินไป และไดผลักดันเพื่อเอกราชอยางชอบธรรม อยางไรก็ตาม ประชาชนของเราทั้งสองมีประวัติศาสตรและวัฒนธรรมรวมกันมากมาย จึงสมเหตุสมผลที่สองชาติของเราจะรวมเปนหนึ่งเดียว กอนที่เราจะกลายเปนปฏิปกษตอกัน"
 AFG_afghan_pakistan_cold_War: "สงครามเย็นอัฟกัน-ปากีสถาน"
 AFG_afghan_pakistan_cold_War_desc: "แมจะเจ็บปวดที่ตองขัดแยงกับญาติพี่นองขามพรมแดน แตเราตองยอมรับถึงภัยคุกคามที่พวกเขามีตอเราในตอนนี้ ดังนั้นเราตองเตรียมการเพื่อควบคุมพวกเขาไวดวยวิธีการใดก็ตามที่จําเปน"
 AFG_graveyard_of_empires: "สุสานแหงจักรวรรดิ"
 AFG_graveyard_of_empires_desc: "จักรวรรดิมาแลวก็ไป แตประชาชนของเรายังคงเปนเจาแหงภูมิภาคนี้อยางไมมีขอโตแยง ตราบใดที่ประชาชนของเรายังคงเปนหนึ่งเดียวและผูกพันกับมรดกของตน ผูรุกรานใด ๆ จะพบวา[ROOT.GetNonIdeologyName]คือสุสานของพวกเขาอยางแทจริง"
 AFG_prepare_for_operation_countenance: "เตรียมพรอมสําหรับปฏิบัติการเคานเทแนนซ"
 AFG_prepare_for_operation_countenance_desc: "ฝายสัมพันธมิตรกําลังเตรียมการแทรกแซง[PER.GetName]ซึ่งเปนเพื่อนบานของเรา เพื่อยึดนํ้ามันกอนที่ศัตรูจะชิงไปกอน เราตองเตรียมการดานการสงกําลังบํารุงเพื่อสนับสนุนการแทรกแซงและทําหนาที่ของเราในปฏิบัติการที่กําลังจะมาถึง"
 AFG_invite_foreign_corporations: "เชิญบริษัทตางชาติ"
 AFG_invite_foreign_corporations_desc: "เรายังคงลาหลังดานอุตสาหกรรมเมื่อเทียบกับชาติอื่น ผลกระทบตอเนื่องคือการผลิตอาวุธภายในประเทศมีนอยมาก เพื่อพลิกสถานการณและปรับปรุงอุตสาหกรรมใหทันสมัย เราจะเชิญบริษัทจากทั่วโลกใหมาตั้งกิจการที่นี่"
 AFG_secure_iran: "ยึดครองอิหราน"
 AFG_secure_iran_desc: "ถึงเวลาแลวที่จะยึดแหลงนํ้ามัน[PER.GetAdjective] รวมกับพันธมิตรของเรา เราจะทําสิ่งที่ตองทํา แมวาจะตองเปลี่ยนระบอบการปกครองใน[PER.Capital.GetCapitalVictoryPointName]ก็ตาม"
 AFG_repeal_the_durand_line: "ยกเลิกเสนดูแรนด"
 AFG_repeal_the_durand_line_desc: "เราไดพิสูจนแลววาเปนมิตรที่ไววางใจไดของฝายสัมพันธมิตรในภูมิภาคนี้ บางทีนี่อาจเปนโอกาสอันดีที่จะเจรจาเรื่องเสนดูแรนดใหม เสนแบงที่ถูกบังคับยัดเยียดใหเราอยางโหดรายเมื่อหลายปกอน"
 AFG_future_of_balochistan: "อนาคตของบาโลจิสถาน"
 AFG_future_of_balochistan_desc: "แมในตอนนี้เราจะรวมมือกับฝายสัมพันธมิตร แตเราตองคิดถึงการเมืองระยะยาวของภูมิภาคเราดวย ดังนั้นเราควรผลักดันใหบาโลจิสถานเปนเอกราชภายใตอิทธิพลของเรา กอนที่จะถูกรัฐที่ใหญกวากลืนกินไป"
 AFG_linchpin_of_global_defense: "หมุดหลักแหงการปองกันโลก"
 AFG_linchpin_of_global_defense_desc: "ฝายสัมพันธมิตรยังคงมองวาความภักดีของเราเปนทรัพยสินสําคัญในการวางทาทีทางภูมิรัฐศาสตรตอศัตรูรวมของเรา เราควรใชประโยชนจากจุดนี้ดวยการขอเงินลงทุนในโครงสรางพื้นฐานทางทหารเพิ่มเติม ซึ่งจะเปนประโยชนรวมกันตอทุกฝาย"
 AFG_promote_the_counter_elite: "สงเสริมชนชั้นนําฝายคาน"
 AFG_promote_the_counter_elite_desc: "ในหมูชนชั้นนําทางการเมืองมีหลายคนที่มีแนวคิดหัวรุนแรงในการทําใหชาติทันสมัย แตพวกเขาไมอาจผลักดันแนวคิดเหลานั้นไดเพราะบรรยากาศการเมืองที่อนุรักษนิยม เมื่อรัฐบาลเกาถูกยุบไปแลว บางทีถึงเวลาที่จะสงเสริมนักปฏิรูปหัวรุนแรงเหลานี้เสียที"
 AFG_promote_the_counter_elite_tt: "ที่ปรึกษาตอไปนี้จะพรอมใหแตงตั้ง:"
 AFG_support_warzistan_independence: "สนับสนุนเอกราชวาซิริสถาน"
 AFG_support_warzistan_independence_desc: "พรมแดนของเรากับฝาย[ENG.GetAdjective]ในอินเดียเปนตนเหตุของความตึงเครียดระหวางสองชาติอยูเสมอ แมเราจะไมมีกําลังพอจะขับไลพวกเขาออกจากภูมิภาค แตเราสามารถบอนทําลายการปกครองของพวกเขาไดดวยการสนับสนุนขบวนการเรียกรองเอกราช เชน ขบวนการในวาซิริสถาน"
 AFG_socialist_coup: "รัฐประหารสังคมนิยม"
 AFG_socialist_coup_desc: "เมื่อขอจํากัดแบบอนุรักษนิยมตอความคิดทางการเมืองเสื่อมถอยลง กลองแพนดอราก็ถูกเปดออก และกระแสตอตานสถาบันกษัตริยกําลังโหมกระหนํ่าไปทั่วประเทศ บัดนี้ถึงเวลาแลวที่จะกวาดลางราชอาณาจักรอันลาสมัยนี้และนําพาประเทศสูรัฐสังคมนิยมสมัยใหม"
 AFG_socialist_coup_tt: "§Yหากการสนับสนุนคอมมิวนิสตสูงกวา 60% เราจะหลีกเลี่ยงการเกิดสงครามกลางเมืองได§!"
 AFG_state_atheism: "รัฐอเทวนิยม"
 AFG_state_atheism_desc: "ปชตูนวาลี ศาสนาอิสลาม และยาฝนแบบดั้งเดิมอื่น ๆ ของมวลชนตองถูกทิ้งไป หากเราตองการทําใหเศรษฐกิจและสังคมทันสมัย ดังนั้นเราตองจํากัดธรรมเนียมอันลาสมัยเหลานี้และใหการศึกษาแกประชาชนแบบฆราวาส"
 AFG_soviet_research_cooperation: "ความรวมมือดานการวิจัยกับโซเวียต"
 AFG_soviet_research_cooperation_desc: "อดีตศัตรูของเราใน[SOU.GetNameDef]กลายมาเปนมิตรที่ใกลชิดที่สุดอยางรวดเร็วหลังเราโคนลมระบอบเกา เราจึงมีโอกาสไดรับความรูทางเทคโนโลยีจากพวกเขา ซึ่งจะชวยในการพลิกโฉม[ROOT.GetNonIdeologyName]"
 AFG_soviet_research_technology_exchange_tt: "§Y[SOU.GetNameDefCap]มีแนวโนมจะตอบรับมากขึ้นหากมีความเห็นตอเราในทางที่ดี§! \nหาก[SOU.GetFlag]§Y[SOU.GetNameDef]§!ยอมรับขอเสนอ เราจะเขารวมกลุมแบงปนเทคโนโลยีกับพวกเขา"
 AFG_communist_industrialization: "การพัฒนาอุตสาหกรรมแบบคอมมิวนิสต"
 AFG_communist_industrialization_desc: "เมื่อเราไดรื้อถอนกลไกการปกครองเกาของระบอบจักรวรรดินิยมแลว บัดนี้เราสามารถเริ่มกระบวนการนารวมและการพัฒนาอุตสาหกรรมอยางรวดเร็ว เพื่อนําเศรษฐกิจของเราเขาสูศตวรรษที่ 20"
 AFG_support_soviets_in_asia: "สนับสนุนโซเวียตในเอเชีย"
 AFG_support_soviets_in_asia_desc: "สาธารณรัฐในเอเชียกลางภายใน[SOU.GetNameDef]เปนแหลงเพาะกิจกรรมตอตานการปฏิวัติ เนื่องจากอยูหางไกลจาก[SOU.Capital.GetCaptialVictoryPointName] เพื่อปองกันไมใหพวกปฏิกิริยาลุกลามเขามาในประเทศเรา เราควรสนับสนุนชาว[SOU.GetAdjective]ในการรักษาความสงบเรียบรอยในภูมิภาค"
 AFG_integrate_tajik_and_uzbek_republics: "ผูพิทักษเอเชียกลาง"
 AFG_integrate_tajik_and_uzbek_republics_desc: "เราไดพิสูจนแลววาเปนกําลังสําคัญอันประเมินคามิไดของ[SOU.GetNameDef] ดังนั้นจึงเปนการยุติธรรมที่เราจะขอสัมปทานดินแดนเปนการตอบแทน ซึ่งยังจะชวยปลอบประโลมชนกลุมนอยที่ไมใชชาวปชตูนทางตอนเหนือดวย"
 AFG_ally_basmachi_remnants: "เปนพันธมิตรกับกลุมบัสมาชีที่หลงเหลือ"
 AFG_ally_basmachi_remnants_desc: "จนถึงป 1934 ขบวนการบัสมาชีไดตอสูกับกองกําลัง[SOV.GetAdjective]เพื่อปลดปลอยเอเชียกลางจากการปกครองอันกดขี่ แมขบวนการของพวกเขาจะถูกบดขยี้ไปแลว แตผูนําบางคนก็หลบหนีมาได เราควรพยายามติดตอนักสูเพื่ออิสรภาพเหลานี้และเชิญพวกเขามายังราชสํานักของเรา พวกเขาอาจเคยสนับสนุนฮะบีบุลลอฮ กะละกานีมากอน แตเมื่อการปกครองของเรามั่นคงแลว การโนมนาวพวกเขาก็คงไมยาก"
 AFG_integrate_tajik_and_uzbek_republics_tt: "หาก§Y[SOU.GetName]§!ยอมรับขอเสนอ:"
 AFG_republic_of_afghanistan: "ประกาศเปนสาธารณรัฐ"
 AFG_republic_of_afghanistan_desc: "การรับระบอบประชาธิปไตยในรูปแบบราชาธิปไตยภายใตรัฐธรรมนูญถือเปนกาวสําคัญยิ่ง อยางไรก็ตาม ยังมีความกังวลวาเสรีภาพในระบอบประชาธิปไตยของเราจะไมมีวันมั่นคงอยางสมบูรณ จนกวาเราจะขจัดรองรอยสุดทายของสถาบันกษัตริยดวยการประกาศเปนสาธารณรัฐและเลือกตั้งประมุขแหงรัฐตามระบอบประชาธิปไตย"
 AFG_republic_of_afghanistan_tt: "§Yเราจะสามารถเลือกอัตลักษณใหมใหกับชาติของเรา ซึ่งอาจเปลี่ยนแปลงรัฐที่ถือเปนดินแดนหลักของเรา หรืออาจเพิ่มแนวคิดใหม ๆ§!"
 AFG_hot_war_with_pakistan: "กําจัดปากีสถาน"
 AFG_hot_war_with_pakistan_desc: "พวกโงเขลาใน[PAK.GetNonIdeologyName]ตองการแบงแยกประชาชนของเราและทําใหเราทะเลาะกันเอง ขณะที่ภัยคุกคามที่แทจริงอยาง[SOU.GetNameDef]และ[RAJ.GetNameDef]ยังคงแข็งแกรงขึ้นเรื่อย ๆ เราตองกําจัดระบอบผูทะเยอทะยานนี้กอนที่พวกเขาจะปลอยใหประชาชนทั้งหมดของเราตกอยูใตแอกของมหาอํานาจอื่น"
 AFG_accelerate_integration: "เสริมความแข็งแกรงใหสมาพันธรัฐ"
 AFG_accelerate_integration_desc: "การกอตั้งสมาพันธรัฐระหวาง[ROOT.GetNonIdeologyName]และ[PAK.GetNonIdeologyName]เมื่อไมนานมานี้ประสบความสําเร็จอยางงดงาม อยางไรก็ตาม เราควรเรงกระบวนการบูรณาการใหมากขึ้นอีก เพื่อใหมั่นใจวาเราพรอมรับมือกับทุกสิ่งที่โลกอาจโยนใสเรา"
 AFG_seek_british_investment: "แสวงหาการลงทุนจากอังกฤษ"
 AFG_seek_british_investment_desc: "หลายทศวรรษที่ผานมา เราไดปลุกปนความหวาดกลัวของฝาย[ENG.GetAdjective]วา[SOV.GetNameDef]จะบุกผานประเทศเราและผนวกดินแดนอินเดียอันลํ้าคาของพวกเขา สงผลใหเราไดรับเงินอุดหนุนและการลงทุนเพื่อใหเราอยูขางพวกเขา เมื่อสถานการณโลกยิ่งเปราะบาง การเลนเกมนี้ตอไปอาจยิ่งทํากําไรไดมากขึ้น"
 AFG_central_asian_unification: "การรวมเอเชียกลาง"
 AFG_central_asian_unification_desc: "ดวยการบริหารจัดการอยางรอบคอบของเรา เอเชียกลางไดเปลี่ยนจากดินแดนลาหลังทางเศรษฐกิจกลายเปนศูนยกลางอุตสาหกรรมที่ขยายตัวอยางรวดเร็ว เราจะรวมกันสรางอนาคตสังคมนิยมใหมเพื่อประชาชนทุกคนของเรา"
 AFG_central_asian_unification_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_develop_central_asia_category$§! เพื่อรับดินแดนหลักในรัฐเอเชียกลางที่เคยเปนของ[SOU.GetAdjective]ซึ่งถูกโอนมาใหเรา"
 AFG_sov_iran_war: "โคนชาหแหง[PER.GetNonIdeologyName]"
 AFG_sov_iran_war_desc: "สหายของเราใน[SOU.GetNameDef]ถูกปดลอมทุกดาน ทําใหไมอาจรักษากองเรือในนานนํ้าอุนไวตอกรกับศัตรูได เนื่องจาก[PER.GetName]ใหการสนับสนุนศัตรูของเราโดยนัย การยึดครองดินแดนนั้นจะมอบฐานปฏิบัติการทางเรือแหงใหมใหเรา และกําจัดศัตรูที่อาจเกิดขึ้นไดดวย"
 AFG_development_in_uzb: "พัฒนาอุซเบกิสถาน"
 AFG_development_in_uzb_desc: "อุซเบกิสถานถูกละเลยมานานโดยระบอบตาง ๆ ที่เคยยึดครอง หากเราตองการควบคุมดินแดนนี้อยางมั่นคง เราตองแกไขความอยุติธรรมนี้ ดวยการเรงพัฒนาภูมิภาคพรอมกับผนวกรวมเขากับเศรษฐกิจของเรา"
 AFG_development_in_taj: "พัฒนาทาจิกิสถาน"
 AFG_development_in_taj_desc: "ทาจิกิสถานในตอนนี้เปนเพียงเงาของสิ่งที่มันสามารถเปนได หากผนวกเขากับเศรษฐกิจของเรา ที่นี่อาจกลายเปนแหลงอะลูมิเนียมและทรัพยากรสําคัญอื่น ๆ อันมีคาสําหรับการพัฒนาประเทศใหทันสมัย"
 AFG_development_in_tms: "พัฒนาเติรกเมนิสถาน"
 AFG_development_in_tms_desc: "นํ้ามันกําลังกลายเปนทรัพยากรสําคัญยิ่งสําหรับเศรษฐกิจหรือกองทัพสมัยใหม โชคดีที่นักสํารวจพบวาเติรกเมนิสถานมีของเหลวลํ้าคานี้อยูอยางอุดมสมบูรณ รอเพียงการขุดขึ้นมาใช"
 AFG_modern_economy: "เศรษฐกิจสมัยใหม"
 AFG_modern_economy_desc: "ในที่สุดเราก็สลัดพันธนาการของแนวปฏิบัติทางเศรษฐกิจอันลาสมัยที่ฉุดรั้งประชาชนของเรามานานหลายศตวรรษได บัดนี้เราสามารถยืนหยัดเคียงขางชาติอุตสาหกรรมอื่น ๆ ของโลกไดอยางแทจริง"
 AFG_darulaman: "ดารุลอามาน"
 AFG_darulaman_university: "มหาวิทยาลัยดารุลอามาน"
 AFG_darulaman_university_desc: "เมืองดารุลอามานอันทันสมัยของเรากําลังขยายตัวอยางรวดเร็วหลังการยายหนวยงานรัฐบาลมาที่นี่ อยางไรก็ตาม กษัตริยมีพระประสงคจะสถาปนาดารุลอามานใหเปนนครแหงการเรียนรูอันยิ่งใหญ ดวยการกอตั้งมหาวิทยาลัยแหงใหมที่มีสิ่งอํานวยความสะดวกระดับโลก"
 AFG_modifiy_1923_constitution_modifier_tt: "ปรับ §Y$AFG_1923_constitution_modifier$§! ดังนี้:\n"
 AFG_from_the_ashes: "ฟนจากเถาถาน"
 AFG_from_the_ashes_desc: "นับตั้งแตจักรวรรดิออตโตมันลมสลาย โลกอิสลามก็ตกอยูในสภาพสุญญากาศทางอํานาจ บัดนี้ เมื่อมหาอํานาจทั้งหลายถูกดึงความสนใจไปที่ความขัดแยงระดับโลกอีกครั้ง เรามีโอกาสที่จะสถาปนาตนเปนมหาอํานาจอันดับหนึ่งของโลกอิสลาม"
 AFG_exploit_turko_persian_heritage: "ใชประโยชนจากมรดกเติรก-เปอรเซีย"
 AFG_exploit_turko_persian_heritage_desc: "ตลอดหลายศตวรรษ ชาติของเราไดรับอิทธิพลอยางมากจากวัฒนธรรมทั้ง[PER.GetAdjective]และ[TUR.GetAdjective] เราควรนําสิ่งนี้มาเปนหัวใจของการเมือง และหลอมสรางอัตลักษณเติรก-เปอรเซียใหมที่ใชสรางความรูสึกเปนหนึ่งเดียวกับเพื่อนบานของเราได"
 AFG_exploit_turko_persian_heritage_tt: "ปลดล็อกการตัดสินใจ §Y$AFG_turko_persian_heritage_category$§! เพื่อเชิญชาติตาง ๆ เขารวมฝายของเรา หรือสรางเปาหมายสงครามตอพวกเขา"
 AFG_protector_of_baghdad: "ผูพิทักษแบกแดด"
 AFG_protector_of_baghdad_desc: "TODO"
 AFG_savior_of_the_holy_lands: "ผูกอบกูดินแดนศักดิ์สิทธิ์"
 AFG_savior_of_the_holy_lands_desc: "ถึงเวลาแลวที่เราจะทําหนาที่อันศักดิ์สิทธิ์ ปลดปลอยดินแดนศักดิ์สิทธิ์จากแอกของผูกดขี่ตางชาติ ทหารผูกลาของเราจะเดินทัพดวยพลังของบรรพบุรุษ ดวยแรงบันดาลใจจากภารกิจอันชอบธรรมในการทวงคืนแผนดินกําเนิดแหงศรัทธาของเรา ภารกิจอันศักดิ์สิทธิ์นี้ไมเพียงจะรวมโลกอิสลามใหเปนหนึ่งภายใตการนําของเรา แตยังนําเกียรติยศและความรุงโรจนมาสูชาติอันยิ่งใหญของเราดวย"
 AFG_recruit_experts_and_officers: "ดึงตัวผูเชี่ยวชาญและนายทหาร"
 AFG_recruit_experts_and_officers_desc: "นักวิทยาศาสตร วิศวกร และนายทหารที่เคยรับใชรัฐ[PER.GetAdjective]หรือ[TUR.GetAdjective] เริ่มมองเห็นความเหนือกวาของชาติเราแลว ดังนั้นเราอาจโนมนาวใหพวกเขามารับใชเราได ขณะที่เราพยายามสถาปนาตนเปนมหาอํานาจแหงภูมิภาค"
 AFG_turko_persian_empire: "จักรวรรดิเติรก-เปอรเซีย"
 AFG_turko_persian_empire_desc: "เมื่อดินแดนสวนใหญของ[TUR.GetAdjective]และ[PER.GetAdjective]อยูใตการควบคุมของเราอยางมั่นคงแลว ถึงเวลาที่เราจะจัดระเบียบอาณาจักรของเราใหมเปนจักรวรรดิเติรก-เปอรเซีย เพื่อความปลอดภัยและความมั่นคงของสังคมอันยิ่งใหญของเรา"
 AFG_eyes_on_the_north: "จับตาแดนเหนือ"
 AFG_eyes_on_the_north_desc: "ดินแดนทางเหนือของเราอุดมไปดวยทรัพยากรที่ศัตรูยังไมไดใชประโยชนอยางเต็มที่ เราจําเปนตองเริ่มเตรียมการสําหรับการขยายอํานาจเขาสูพื้นที่เหลานี้ การเสริมกําลังทางทหารและรักษาเสนทางเสบียงใหมั่นคงจะเปนขั้นตอนสําคัญในกระบวนการนี้"
 AFG_alliance_with_turkik_peoples: "พันธมิตรกับชนเผาเติรก"
 AFG_alliance_with_turkik_peoples_desc: "สวนหนึ่งของเปาหมายทางยุทธศาสตรทางเหนือคือการบอนทําลายโครงสรางอํานาจที่มีอยูดวยการปลุกปนความไมสงบในหมูชนเผาเติรกในภูมิภาค ดวยการฉวยประโยชนจากความคับแคนที่มีอยูและสงเสริมการตอตาน เราจะสามารถทําใหรัฐบาลทองถิ่นไรเสถียรภาพ และสรางสภาพแวดลอมที่เอื้อตอการขยายอํานาจของเรา"
 AFG_alliance_with_turkik_peoples_tt: "ปลดล็อกการตัดสินใจ §Y[AFG_get_turkik_people_name_key]§! เพื่อแพรขยายเครือขายการตอตานในรัฐเอเชียกลางของ[SOU.GetAdjective] รัฐที่เราเขาไปแทรกแซงจะเขารวมกับเราเมื่อเกิดสงครามกับ[SOU.GetNameDef]"
 AFG_red_threat: "ภัยแดง"
 AFG_red_threat_desc: "ดวยพันธมิตรลับของเราในเอเชียกลาง เรามีโอกาสพิเศษที่จะบั่นทอนอิทธิพลของ[SOU.GetAdjective]และขยายอิทธิพลของเราเอง เราจะประสานการบุกรวมกับเครือขายการตอตานทั่วภูมิภาค โคนลมศัตรูกอนที่พวกมันจะรูตัวดวยซํ้าวาเกิดอะไรขึ้น"
 AFG_fortify_pakistan: "เสริมปอมปราการชายแดน"
 AFG_fortify_pakistan_desc: "การรักษาพรมแดนที่เพิ่งขยายออกไปใหมั่นคงเปนสิ่งจําเปนยิ่ง การสรางแนวปอมปราการและที่มั่นปองกันจะรับประกันเสถียรภาพและความมั่นคงของดินแดนเรา ยิ่งไปกวานั้น ยังใหที่มั่นอันแข็งแกรงสําหรับแสดงแสนยานุภาพทางทหาร หากเกิดความขัดแยงในพื้นที่"
 AFG_fortify_pakistan_tt: "รัฐตามแนวชายแดนติดกับ[RAJ.GetNameDef]ที่เราไดมาจากแผนยุทธศาสตรกอนหนาจะไดรับ §G2§! §Yปอมปราการภาคพื้นดิน§!"
 AFG_into_the_plains_of_india: "สูที่ราบแหง[RAJ.GetNameDef]"
 AFG_into_the_plains_of_india_desc: "ถึงเวลาแลวที่ประชาชนของเราจะสถาปนาตนเปนเจาแหงอนุทวีปอินเดีย เราจะทําเชนที่บรรพบุรุษเคยทํา คือบุกลงจากภูเขาขณะที่พวกเขาออนแอ แตครั้งนี้เราจะอยูที่นั่นอยางถาวร"
 AFG_pashtun_empire: "ความรุงเรืองแหงปชตูนิสถาน"
 AFG_pashtun_empire_desc: "วันนี้จะเปนวันประวัติศาสตรของชาติเรา ภายใตการนําของ[ROOT.GetLeader] เราจะประกาศอยางภาคภูมิถึงการสถาปนาอํานาจสูงสุดแหงปชตุน และการเริ่มตนยุคใหมของชาวปชตุน ดวยกองทัพที่ทันสมัย พันธมิตรทางยุทธศาสตร และนโยบายอันทะเยอทะยาน เราไดตอกยํ้าสถานะมหาอํานาจที่โดดเดนที่สุดในภูมิภาค"
 AFG_work_with_gestapo: "รวมมือกับหนวยขาวกรอง[GER.GetAdjective]"
 AFG_work_with_gestapo_desc: "ในดินแดนที่เราเพิ่งไดมา ความไมพอใจและความไมสงบยังคงเปนความทาทายสําคัญตออํานาจของเรา เพื่อรับมือกับปญหานี้ เราไดรวมมือกับหนวยขาวกรอง[GER.GetAdjective] ความเชี่ยวชาญของพวกเขาดานการปราบปรามการกอความไมสงบและปฏิบัติการขาวกรองจะมีคายิ่งในการระบุตัวและกําจัดกลุมกบฏ"
 AFG_secure_baghdad: "ยึดแบกแดดใหมั่น"
 AFG_secure_baghdad_desc: "เมื่ออิทธิพลของเราในภูมิภาคขยายตัว เปนที่ชัดเจนวา[IRQ.GetNameDef]อาจบอนทําลายความพยายามของเรา ดังนั้นเราตองเรียกรองใหพวกเขาปรับนโยบายตางประเทศใหสอดคลองกับเรา มิฉะนั้นจะตองเผชิญความพิโรธของกองทัพเรา"
 AFG_agreement_with_germany: "ขอตกลงกับ[GER.GetNameDef]"
 AFG_agreement_with_germany_desc: "ในยามวุนวายเชนนี้ เราตองแสวงหาพันธมิตรที่แข็งแกรงและไวใจไดเพื่อรักษาสถานะมหาอํานาจที่โดดเดนในโลกอิสลาม ดังนั้นเราจะติดตอ[GER.GetNameDef]เพื่อหยั่งทาทีวาสนใจสนธิสัญญาปองกันรวมกันหรือไม"
 AFG_agreement_with_germany_tt: "\n\n§Y[GER.GetNameDefCap]มีแนวโนมจะตอบรับมากขึ้นหากมีความเห็นตอเรามากกวา 50§!"
 AFG_renounce_the_durand_line: "ไมยอมรับเสนดูแรนด"
 AFG_renounce_the_durand_line_desc: "เสนดูแรนดที่ผูกดขี่ตางชาติยัดเยียดใหเรา ไดแบงแยกพี่นองชาวปชตุนของเรามานานเกินไปแลว ไมวาจะดวยชั้นเชิงของนักการทูตหรือพลังของกองทัพ เราจะยุติความอยุติธรรมนี้ใหสิ้นซากเสียที"
 AFG_renounce_the_durand_line_tt: "\n\n§Yเจาของรัฐที่เราอางสิทธิ์จะมีแนวโนมยอมรับขอเสนอของเรามากขึ้น หากพวกเขากําลังอยูในภาวะสงครามหรือออนแอลงจากสงครามกลางเมืองที่ยังดําเนินอยู§!"
 AFG_topple_iran: "โคนลมอิหราน"
 AFG_topple_iran_desc: "ภายใตการนําอันมีวิสัยทัศนของ[ROOT.GetLeader] เราพรอมแลวที่จะนําเสรีภาพและความยุติธรรมมาสูพี่นองชาว[PER.GetAdjective]ที่ทนทุกขมานานภายใตการปกครองแบบเผด็จการของ[PER.GetLeader] เราจะไมเพียงรักษาพรมแดนของเราใหมั่นคง แตยังจะขยายอิทธิพลไปทั่วภูมิภาคดวย"
 AFG_sov_attack_bonus: "ภัยคุกคามสีแดง"
 AFG_raj_attack_bonus: "บุกตะลุยเขาอินเดีย"
 AFG_work_with_ger_intel_bonus: "เทคนิคการปราบปรามกองโจร"
 AFG_rapprochement_with_non_pashtuns: "ปรองดองกับชนที่ไมใชปชตุน"
 AFG_rapprochement_with_non_pashtuns_desc: "ชนที่ไมใชชาวปชตุนในประเทศของเราถูกกันใหอยูชายขอบของการเมืองมานานเกินไปแลว สิ่งนี้ไมเพียงกอใหเกิดความขุนเคืองตอรัฐบาลกลาง แตยังนําไปสูการโคนลมรัฐบาลอยางสิ้นเชิงในป 1929 ดังนั้นเราตองทําใหมั่นใจวาภายใตระบอบประชาธิปไตยใหม ประชาชนทุกคนของเรารูสึกวาไดรับการเปนตัวแทนและมีเสียงที่ถูกรับฟง"
 AFG_khorasan_buffer_state: "กอตั้งรัฐกันชนโฆราซาน"
 AFG_khorasan_buffer_state_desc: "เมื่อภัยคุกคามจาก[PER.GetNonIdeologyName]ตอการทําสงครามของเราแทบหมดสิ้นไปแลว เราตองเริ่มมองไปยังอนาคต เนื่องดวยความตึงเครียดในประวัติศาสตรระหวางสองชาติและการที่เรามีสวนรวมในปฏิบัติการเคานเทแนนซ เราควรดําเนินการสรางรัฐกันชนระหวางเรากับรัฐบาล[PER.GetAdjective]ในอนาคตที่อาจคิดแกแคน"
 AFG_khorasan_buffer_state_tt: "§Yเราจะจัดตั้งรัฐบาลหุนเชิดโฆราซานในรัฐตอไปนี้หากเราควบคุมได: \n [1004.GetName]\n [416.GetName]\n [1003.GetName]§!"
 AFG_emerging_economy: "เศรษฐกิจเกิดใหม"
 AFG_mountain_training_2: "ครองความเปนเจาแหงขุนเขา"
 AFG_mountain_training_2_desc: "หลังความสําเร็จของโครงการฝกรบบนภูเขา เปนที่ชัดเจนวาเราควรสรางหนวยรบเฉพาะทางสําหรับภูมิประเทศเชนนี้ตอไป"
 AFG_expand_quami_template: "ปฏิรูปกองกําลังเกามี"
 AFG_expand_quami_template_desc: "ระบบเกามีรับใชเรามาเปนอยางดีตลอดหลายป แตก็ยังมีจุดที่ปรับปรุงได ดวยการปรับโครงสรางหนวยตั้งแตตอนระดมพล หนวยเหลานี้จะสามารถปกปอง[AFG.GetNonIdeologyName]ไดดียิ่งขึ้น"
 AFG_expand_quami_template_tt: "เพิ่มกองพันทหารกองโจร §Y3§! กองพันในแมแบบ §Yกองกําลังเกณฑปชตุน§!"
 AFG_expand_quami_template_2_tt: "หากเราวิจัย §Y$tech_engineers$ , $tech_military_police$ หรือ $tech_field_hospital$§! แลว หนวยเหลานั้นจะถูกเพิ่มเขาในแมแบบดวย"
