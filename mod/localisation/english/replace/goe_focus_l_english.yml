 RAJ_exploit_the_frontier_decisions_tt: "ซึ่งชวยใหพัฒนาการผลิตทรัพยากรในประเทศของเราและขอสิทธิ์ในทรัพยากรในพมาได"
 RAJ_concessions_to_the_industrialists_chances_tt: "§Y$RAJ_investments_from_local_leaders$§! จะเนนไปที่§Yอุตสาหกรรมพลเรือน§!เปนหลัก และเนน§Yอุตสาหกรรมทหาร§!รองลงมา"
