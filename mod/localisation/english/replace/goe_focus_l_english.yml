  ###########################
 SSB_the_saadabad_pact: "กติกาสัญญาซาดาบาด"
 SSB_the_saadabad_pact_desc: "เราไมมีอะไรจะเสียและมีแตไดจากการรักษาไมตรีกับเพื่อนบาน แนวคิดเรื่องสนธิสัญญาที่ทําใหมิตรภาพของเราเปนทางการถูกหยิบยกขึ้นมาเปนครั้งคราว และถึงเวลาแลวที่เราจะริเริ่มทําใหมิตรภาพนี้ถูกบัญญัติไวในสนธิสัญญา"
 SSB_military_cooperation: "ความรวมมือทางทหาร"
 SSB_military_cooperation_desc: "เมื่อเผชิญกับภัยคุกคามที่เพิ่มขึ้นวาเกมอํานาจครั้งใหญจะจบลงดวยการที่เราถูกมหาอํานาจปราบใหศิโรราบ ความรวมมือทางทหารภายในกติกาสัญญาซาดาบาดจึงสําคัญยิ่งกวาที่เคย หากเราลมเหลวในการรวมแนวปองกัน เราเสี่ยงที่จะถูกบดขยี้ทีละชาติ"
 SSB_economic_cooperation: "ความรวมมือทางเศรษฐกิจ"
 SSB_economic_cooperation_desc: "ดวยภัยคุกคามจากยักษใหญทางทหารที่ปรากฏขึ้นทุกทิศทาง ความจําเปนของความรวมมือทางเศรษฐกิจภายในกติกาสัญญาซาดาบาดยิ่งชัดเจนขึ้นเรื่อย ๆ เราตองเปดตลาดใหแกกันและลดภาษีศุลกากร เพื่อลดการพึ่งพามหาอํานาจโลก"

 SSB_expand_road_and_rail_connections: "ขยายเครือขายถนนและทางรถไฟ"
 SSB_expand_road_and_rail_connections_desc: "เมื่อกติกาสัญญาซาดาบาดแข็งแกรงขึ้นเรื่อย ๆ จึงหลีกเลี่ยงไมไดที่เราจะสรางทางรถไฟจากอิสตันบูลถึงคาบูล เพื่อเชื่อมโครงสรางพื้นฐานของเราเขาดวยกัน"
 SSB_integration_of_our_infrastructure: "การบูรณาการโครงสรางพื้นฐาน"
 SSB_integration_of_our_infrastructure_desc: "เมื่อความตึงเครียดทั่วโลกเพิ่มสูงขึ้น และเราถูกมหาอํานาจลอมรอบทุกทิศทาง กติกาสัญญาทางเศรษฐกิจและการทหารแบบงาย ๆ ไมเพียงพออีกตอไป เราตองบูรณาการโครงสรางพื้นฐานอยางสมบูรณ ยกเลิกภาษีศุลกากรทั้งหมดระหวางชาติของเรา และรวมทรัพยากรเขาดวยกัน"
 SSB_joint_military_exercises: "การซอมรบรวม"
 SSB_joint_military_exercises_desc: "เราจะเริ่มรวมกระบวนการฝกทางทหารเปนหนึ่งเดียว และรวมมือกันลดอุปสรรคระหวางกองทัพของเรา เพื่อสรางกองทัพซาดาบาดที่รวมกันเปนหนึ่งในระดับหนึ่ง"
 SSB_coordinate_military_production: "ขยายอิทธิพลของเรา"
 SSB_coordinate_military_production_desc: "วันอันยิ่งใหญแหงจักรวรรดิและความเปนเจาไดผานพนไปแลว เราออนแอลงเมื่อเทียบกับสวนอื่นของโลก แตเราไมโดดเดี่ยวอีกตอไป บัดนี้เรายืนหยัดรวมกันดวยกติกาสัญญาซาดาบาด เมื่ออยูดวยกัน เราจะผงาดขึ้นอีกครั้งและครองที่ของเราในฐานะผูปกครองภูมิภาคนี้"
 
 SSB_expand_turkeys_military_infrastructure: "กองทหารภูเขา[TUR.GetAdjective]"
 SSB_expand_turkeys_military_infrastructure_desc: "[TUR.GetNameDefCap]เต็มไปดวยภูเขา กองทัพ[TUR.GetAdjective]จึงเชี่ยวชาญการรบแบบทหารภูเขาเปนอยางดี การแบงปนความรูและเทคโนโลยีนี้กับกติกาสัญญาจะเปนประโยชนตอทุกฝาย"
 SSB_expand_afghanistans_military_infrastructure: "การฝกรบในทะเลทรายแบบ[AFG.GetAdjective]"
 SSB_expand_afghanistans_military_infrastructure_desc: "กองทัพ[AFG.GetNonIdeologyName]มีประสบการณมากมายในการรบในทะเลทราย และมีความรูในการรับมือกับภูมิประเทศทุรกันดาร รัฐสมาชิกทั้งหมดจะไดรับประโยชนอยางมากจากความรูนี้"
 SSB_expand_iraqs_military_infrastructure: "การแปรรูปทรัพยากร[IRQ.GetAdjective]"
 SSB_expand_iraqs_military_infrastructure_desc: "เพื่อเลิกพึ่งพาชาติที่แข็งแกรงกวา เราตองขยายการผลิตทรัพยากรของเราเอง เพื่อใหการคาเกิดขึ้นภายในพรมแดนของเราเมื่อเปนไปได และเพิ่มความสามารถในการพึ่งพาตนเอง"
 SSB_expand_irans_military_infrastructure: "ขยายโครงสรางพื้นฐานทางทหาร[PER.GetAdjective]"
 SSB_expand_irans_military_infrastructure_desc: "เราตองขยายขีดความสามารถทางอุตสาหกรรมทหารทั่วทั้งสหภาพ และทุกฝายตองทําหนาที่ของตน โรงงานยุทโธปกรณแหงใหมจะถูกสรางขึ้นในอิหราน"
 
 SSB_expand_turkish_chromium_deposits: "การสงออกโครเมียม[TUR.GetAdjective]"
 SSB_expand_turkish_chromium_deposits_desc: "การพึ่งพามหาอํานาจโลกของเรามากเกินไป และกอใหเกิดความเสี่ยงสูงที่เรารับไมได เราตองขยายแหลงโครเมียมเพื่อใหเราพึ่งพาตนเองไดในดานนี้"
 SSB_expand_iranian_oil_fields: "การสงออกนํ้ามัน[PER.GetAdjective]"
 SSB_expand_iranian_oil_fields_desc: "การพึ่งพามหาอํานาจโลกของเรามากเกินไป และกอใหเกิดความเสี่ยงสูงที่เรารับไมได เราตองขยายโครงสรางพื้นฐานบอนํ้ามันเพื่อใหเราพึ่งพาตนเองไดในดานนี้"
 SSB_form_the_saadabad_alliance: "ขอเสนอพันธมิตรเต็มรูปแบบ"
 SSB_form_the_saadabad_alliance_desc: "กติกาสัญญาซาดาบาดเริ่มตนจากสนธิสัญญาไมรุกรานธรรมดา แตไดเติบโตเปนมากกวานั้น ทั้งการพัฒนาทางทหารและเศรษฐกิจรวมกัน และการรวมทรัพยากรเขาดวยกัน ถึงเวลาแลวที่เราจะกอตั้งพันธมิตรซาดาบาดอยางเปนทางการในที่สุด"
 SSB_combined_arms: "ผสมเหลา"
 SSB_combined_arms_desc: "เมื่อพันธมิตรเปนทางการแลว ถึงเวลากาวสูขั้นสุดทายในการรวมกองทัพของเราและทําใหมั่นใจวาเราจะปกปองกันและกันได"
 SSB_saadabad_research_cooperation: "ความรวมมือดานการวิจัยซาดาบาด"
 SSB_saadabad_research_cooperation_desc: "เมื่อพันธมิตรเปนทางการแลว ขั้นตอไปตามตรรกะคือการรวมขีดความสามารถดานการวิจัยและวิทยาศาสตรของเราเขาดวยกัน และจัดตั้งคณะกรรมการวิทยาศาสตรรวม"

 SSB_is_leader_tt: "เปนผูนํากติกาสัญญาซาดาบาด"
 SSB_basic_available_trigger_tt: "ไมไดอยูในสงครามกับสมาชิกกติกาสัญญาซาดาบาดใด ๆ"

 SSB_spirit_tooltip: "ปรับ §Yกติกาสัญญาซาดาบาด§!:"
 SSB_flags_tt: "[PER.GetFlag][TUR.GetFlag][IRQ.GetFlag][AFG.GetFlag]"
 SSB_resource_tt: "$SSB_flags_tt$$trade_cost_for_target_factor_tt$"

 SSB_is_in_faction_tt: "เปนสมาชิกพันธมิตรซาดาบาด"
 SSB_accept_tt: "เราจะทําสนธิสัญญาไมรุกรานกับทุกชาติที่ยอมรับกติกาสัญญาซาดาบาด เราจะไดเขาถึงผังยุทธศาสตรรวมกับสมาชิกอื่นเพื่อชวยใหบรรลุเปาหมายรวมกัน"

 SSB_savak_protect_us: "SAVAK ปกปองเราทุกคน"
 SSB_savak_protect_us_desc: "SAVAK ทําหนาที่ปกปองชาติอันยิ่งใหญของเราผานการตอตานขาวกรองไดอยางยอดเยี่ยม เรามีโอกาสมอบการคุมครองใหแกสมาชิกกติกาสัญญาที่เหลือดวยการแบงปนความรูดานการตอตานขาวกรอง ซึ่งเปนประโยชนแกพันธมิตรโดยแทบไมมีตนทุนสําหรับเรา"
 SSB_berlin_baghdad_railway_into_iran_afghanistan: "การคารวมผานทางรถไฟเบอรลิน–แบกแดด"
 SSB_berlin_baghdad_railway_into_iran_afghanistan_desc: "ทางรถไฟเบอรลิน-แบกแดดเปนเสาหลักของการคาและเศรษฐกิจ[IRQ.GetAdjective] เรามีโอกาสเชื่อมทางรถไฟสายนี้เขากับทางรถไฟอังการา-คาบูล และเปดใหชาติภาคีอื่น ๆ คาขายผานเสนทางนี้ได" 
 SSB_baghlan_sugar_factory_branches: "สาขาใหมของบริษัทนํ้าตาลบักลาน"
 SSB_baghlan_sugar_factory_branches_desc: "ปจจุบันบริษัทนํ้าตาลบักลานสรางโรงงานเฉพาะใน[AFG.GetNonIdeologyName]เทานั้น เราสามารถอนุญาตใหสรางโรงงานใหมไดทุกที่ภายในประเทศกลุมซาดาบาด แทนที่จะมีเพียงใน[AFG.GetNonIdeologyName] เพื่อการเติบโตทางเศรษฐกิจรวมกัน"

