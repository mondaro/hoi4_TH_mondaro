l_english:
 rhineland: "ทําใหไรนลันทกลับมามีกําลังทหาร"
 rhineland_desc: "ไรนลันทถูกปลอดทหารมาตั้งแตสิ้นสุดสงครามโลกครั้งที่หนึ่ง แตการหยามเกียรติเชนนี้จะไมดํารงอยูอีกตอไป! เยอรมนีเปนชาติที่มีอธิปไตยและมีเสรีภาพที่จะเคลื่อนกําลังทหารไปที่ใดก็ไดภายในพรมแดนของตน!"
 rhineland_short_desc: "§Lเคลื่อนกําลังเยอรมันไปทางตะวันตกของแมนํ้าไรน เพื่อทาทายสนธิสัญญาแวรซาย§!"
 rhineland_1: "ทําใหโมเซลลันทกลับมามีกําลังทหาร"
 rhineland_2: "ทําใหไรนลันทกลับมามีกําลังทหาร"
 anschluss: "ดําเนินการอันชลุสส"
 anschluss_desc: "อันชลุสส หรือการรวมเปนหนึ่งเดียวกับออสเตรีย เปนเปาหมายที่ชาวเยอรมันยึดถือมาเนิ่นนาน แมจะถูกหามโดยสนธิสัญญาแวรซาย แตในที่สุดก็ถึงเวลาที่จะทําใหเปนจริง เราตองเพิ่มการสนับสนุนลัทธิฟาสซิสตในออสเตรียเพื่อวางรากฐานสําหรับการผนวก"
 anschluss_short_desc: "§Lใชวิธีการลับเพื่อเพิ่มการสนับสนุนลัทธิฟาสซิสตในหมูประชาชนออสเตรีย§!"
 anschluss_1: "แทรกแซงการเมือง"
 take_state: "พิชิต"
 take_state_desc: "ยึด $STATE|Y$ จาก $TARGET|Y$"
 take_state_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกรัฐที่กําหนดในการประชุมสันติภาพมีตนทุนถูกลง"
 take_state_focus: "พิชิต (แผนยุทธศาสตร)"
