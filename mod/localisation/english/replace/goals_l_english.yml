 take_state_focus_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกรัฐที่กําหนดในการประชุมสันติภาพมีตนทุนถูกลง"
 liberate_wargoal: "ปลดปลอย"
 liberate_wargoal_short_desc: "ปลดปลอย"
 liberate_wargoal_desc: "เปาหมายสงครามนี้จะทําใหการเลือกปลดปลอยในการประชุมสันติภาพมีตนทุนถูกลง"
 independence_wargoal: "เอกราช"
 independence_wargoal_short_desc: "สงครามประกาศเอกราช"
 independence_wargoal_desc: "สงครามประกาศเอกราช"
 puppet_wargoal_focus: "รัฐหุนเชิด (แผนยุทธศาสตร)"
 puppet_wargoal_focus_desc: "ทําให $TARGET|Y$ เปนรัฐหุนเชิด"
 puppet_wargoal_focus_short_desc: "เปาหมายสงครามนี้จะทําใหการตั้งรัฐหุนเชิดในการประชุมสันติภาพมีตนทุนถูกลง"
 take_claimed_state: "ยึดรัฐที่อางสิทธิ์"
 take_claimed_state_desc: "ยึด $STATE|Y$ จาก $TARGET|Y$"
 take_claimed_state_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกรัฐที่กําหนดในการประชุมสันติภาพมีตนทุนถูกลง"
 take_core_state: "ยึดรัฐที่เปนดินแดนหลักคืน"
 take_core_state_desc: "ยึด $STATE|Y$ คืนจาก $TARGET|Y$"
 take_core_state_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกรัฐที่กําหนดในการประชุมสันติภาพมีตนทุนถูกลง"
 annex_everything: "ผนวก"
 annex_everything_desc: "ผนวกรัฐที่เลือก"
 annex_everything_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกผนวกในการประชุมสันติภาพมีตนทุนถูกลง"
 civil_war: "สงครามกลางเมือง"
 civil_war_desc: "สงครามกลางเมือง! ชาติแตกออกเปนฝายตางๆ ที่ตอสูกันเพื่อแยงชิงการควบคุมรัฐ"
 civil_war_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกผนวกในการประชุมสันติภาพมีตนทุนถูกลง"
 topple_government: "โคนลมรัฐบาล"
 topple_government_desc: "โคนลมรัฐบาลที่ปกครองอยู"
 topple_government_short_desc: "เปาหมายสงครามนี้จะทําใหการเลือกโคนลมรัฐบาลในการประชุมสันติภาพมีตนทุนถูกลง"
 anti_comintern_pact: "กติกาสัญญาตอตานโคมินเทิรน"
 anti_comintern_pact_desc: "ถึงเวลาทํากติกาสัญญา "โดยตระหนักวาเปาหมายขององคการคอมมิวนิสตสากล หรือที่รูจักกันในชื่อโคมินเทิรน คือการทําใหรัฐที่มีอยูแตกสลายและสยบยอมดวยทุกวิถีทางที่มี และเชื่อมั่นวาการปลอยใหองคการคอมมิวนิสตสากลแทรกแซงกิจการภายในของชาติตางๆ ไมเพียงเปนอันตรายตอความสงบภายในและความผาสุกทางสังคมของชาติเหลานั้น แตยังเปนภัยคุกคามตอสันติภาพของโลก จึงปรารถนาจะรวมมือกันปองกันกิจกรรมบอนทําลายของคอมมิวนิสต"\nสิ่งนี้จะชวยปรับปรุงความสัมพันธกับชาติที่เขารวมกติกาสัญญา"
 anti_comintern_pact_short_desc: "§Lสรางแนวรวมตอตานคอมมิวนิสตรวมกับอิตาลีและญี่ปุน§!"
 tripartite_pact: "กติกาสัญญาไตรภาคี"
 tripartite_pact_desc: "เพื่อเสริมความแข็งแกรงใหกติกาสัญญาตอตานโคมินเทิรน ชาติผูลงนามตกลงกันวาตลอดสิบปขางหนา "จุดประสงคหลักของพวกเขาคือการสถาปนาและรักษาระเบียบใหม เพื่อสงเสริมความมั่งคั่งและสวัสดิภาพรวมกันของประชาชนที่เกี่ยวของ""
 tripartite_pact_short_desc: "§Lกระชับความสัมพันธกับอิตาลีและญี่ปุนใหแนนแฟนยิ่งขึ้นดวยการลงนามในสนธิสัญญาฉบับใหม§!"
 demand_sudetenland: "เรียกรองซูเดเทินลันท"
 demand_sudetenland_desc: "ชาวเยอรมันในซูเดเทินลันทถูกเจาปกครองชาวเชโกสโลวาเกียกดขี่อยางโหดราย เปนอาชญากรรมที่ไมอาจปลอยใหดําเนินตอไปไดอีกแลว! ซูเดเทินลันทและประชาชนตองถูกยกใหแกเยอรมนีโดยทันที"
 demand_sudetenland_short_desc: "§Lระดมกําลังตามแนวพรมแดนเชโกสโลวาเกียเพื่อกดดันปราก§!"
 fate_of_czechoslovakia: "ชะตากรรมของเชโกสโลวาเกีย"
 fate_of_czechoslovakia_desc: "เมื่อซูเดเทินลันทอยูในมือเราแลว เชโกสโลวาเกียก็ไรทางปองกันตนเอง ถึงเวลายุติรัฐที่เหลือเพียงซากอันนาเวทนานี้"
 fate_of_czechoslovakia_short_desc: "§Lรวมกําลังในซูเดเทินลันทเพื่อผนวกสวนที่เหลือของรัฐเช็ก§!"
 molotov_ribbentrop_pact: "กติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ"
 molotov_ribbentrop_pact_desc: "ดวยการลงนามในสนธิสัญญามิตรภาพและไมรุกรานกับสหภาพโซเวียต เราสามารถบรรลุขอตกลงวาจะทําอยางไรกับรัฐที่อยูระหวางพรมแดนปจจุบันของเรา รวมถึงทําการคาในปริมาณที่มากขึ้น นอกเหนือจากขอกําหนดเรื่องการไมรุกราน สนธิสัญญานี้ยังมีพิธีสารลับที่แบงดินแดนของโรมาเนีย โปแลนด ลิทัวเนีย ลัตเวีย เอสโตเนีย และฟนแลนดออกเปนเขตอิทธิพลของนาซีและโซเวียต เพื่อรองรับการจัดระเบียบดินแดนและการเมืองของประเทศเหลานี้ที่อาจเกิดขึ้น"
 molotov_ribbentrop_pact_short_desc: "§Lลงนามในสนธิสัญญาไมรุกรานกับสหภาพโซเวียตเพื่อหลีกเลี่ยงการแทรกแซงของโซเวียต§!"
 poland_goal: "ดันซิกหรือสงคราม!"
 poland_goal_desc: "ดันซิกเคยเปนของเยอรมัน ดันซิกยังคงเปนของเยอรมัน และดันซิกจะเปนของเยอรมันนับจากนี้ไป! เราตองเตรียมชาวเยอรมันใหพรอมสําหรับสงครามกับโปแลนดที่หลีกเลี่ยงไมได การรณรงคโฆษณาชวนเชื่อจะหลอหลอมเจตจํานงของพวกเขาสําหรับการสูรบที่กําลังจะมาถึง ขณะที่อาชญากรรมของชาติโปแลนดจะถูกเปดโปงตอชาวโลก ดันซิกและดินแดนโดยรอบจะกลับคืนสูเยอรมนี!"
 poland_goal_short_desc: "§Lเตรียมชาวเยอรมันใหพรอมทําสงครามกับโปแลนด แลวเดินทัพสูวอรซอ!§!"
 poland_goal_1: "เตรียมพรอมทําสงคราม"
 poland_goal_2: "ประกาศสงคราม"
 test_the_chinese_focus: "กรณีพิพาทชายแดนจีน"
 test_the_chinese_focus_desc: "ชาวจีนยังคงปฏิเสธที่จะยอมรับการปลดปลอยแมนจูเรียของเรา และความตึงเครียดตามแนวชายแดนใกลปกกิ่งไดนําไปสูการปะทะหลายครั้ง หากเราสรางสถานการณขึ้น เราจะสามารถยกระดับความขัดแยงใหกลายเปนสงครามเต็มรูปแบบ ซึ่งจะเปนขออางที่เราตองการเพื่อจัดการกับจีนใหสิ้นซาก!"
 test_the_chinese_focus_short_desc: "§Lยั่วยุใหเกิดการเผชิญหนาดวยการระดมกําลังตามแนวชายแดนจีน§!"
 chinese_border_incident_SUCCEEDED: "กรณีสะพานมารโค โปโล"
 chinese_border_incident_SUCCEEDED_DESC: "กําลังสวนหนึ่งของเราถูกดึงเขาสูการปะทะอันรุนแรงกับทหารจีน ขณะพยายามเขาควบคุมสะพานมารโค โปโลอันมีความสําคัญทางยุทธศาสตรทางใตของปกกิ่ง การสูรบจบลงโดยไมมีผลชี้ขาด แตเราไดเรียกรองคําขอโทษและการยกดินแดนเพิ่มเติม"
 south_pacific_mandate: "ดินแดนในอาณัติแปซิฟกใต"
 south_pacific_mandate_desc: "ดินแดนของเราในแปซิฟก ซึ่งสันนิบาตชาติมอบใหหลังสงครามครั้งกอน จะเปนแนวปองกันดานแรกของญี่ปุนในสงครามใดๆ กับอเมริกาในอนาคต เกาะเหลานี้คือเรือบรรทุกเครื่องบินที่ไมมีวันจม และเราควรดําเนินการเสริมปอมปราการใหแกเกาะเหลานี้"
 south_pacific_mandate_short_desc: "§Lสรางปอมชายฝงแหงใหมบนหมูเกาะในแปซิฟกของเรา§!"
 south_pacific_mandate_SUCCEEDED: "ดินแดนในอาณัติแปซิฟกใตไดรับการเสริมปอมปราการแลว"
 south_pacific_mandate_SUCCEEDED_DESC: "วิศวกรของเราไดเสริมปอมปราการใหหมูเกาะในดินแดนในอาณัติแปซิฟกใตแลว ผูรุกรานใดๆ จะพบวากําลังของเรานั้นขับไลไดยาก"
 demand_indochina_focus: "เรียกรองอินโดจีนของฝรั่งเศส"
 demand_indochina_focus_desc: "หลังพายแพในยุโรป การควบคุมอาณานิคมโพนทะเลของฝรั่งเศสก็งอนแงนเต็มที กดดันรัฐบาลฝรั่งเศสชุดใหมใหญี่ปุนเขาใชฐานทัพในอินโดจีนไดอยางเต็มที่ ภูมิภาคนี้จะมีประโยชนในฐานะฐานสงกําลังสําหรับการรณรงคในอนาคต"
 demand_indochina_focus_tt: "ฝรั่งเศสครอบครอง §Yอินโดจีน§!"
 demand_indochina_focus_short_desc: "§Lกดดันรัฐบาลฝรั่งเศสชุดใหมใหยอมสละอินโดจีน§!"
 demand_french_indochina_SUCCEEDED: "ขอเรียกรองถูกสงไปแลว"
 demand_french_indochina_SUCCEEDED_DESC: "กําลังของเราประจําอยูตามแนวพรมแดนอินโดจีนของฝรั่งเศส ทําใหชัดเจนวาจะเกิดผลรายแรงตามมาหากขอเสนอของเราถูกปฏิเสธ"
 test_the_ussr_focus: "เสริมกําลังชายแดนโซเวียต"
 test_the_ussr_focus_desc: "เราตองตอบโตการยั่วยุอยางตอเนื่องของโซเวียตตามแนวชายแดนทางเหนือ การละเมิดพรมแดนแมนจูเรียที่กําหนดไวอยางไมหยุดหยอนของพวกเขาไมอาจยอมรับไดอีกตอไป ระดมกําลังในแมนจูเรียตอนเหนือเพื่อยับยั้งการลวงละเมิดในอนาคต"
 test_the_ussr_focus_short_desc: "§Lระดมกําลังในแมนจูเรียเพื่อยับยั้งการยั่วยุของโซเวียต§!"
 naval_expansion_focus: "เพิ่มการผลิตทางเรือ"
 naval_expansion_focus_desc: "เราไมถูกผูกมัดดวยสนธิสัญญานาวีวอชิงตันอีกตอไป และในฐานะชาติหมูเกาะ กองทัพเรือคือสิ่งสําคัญยิ่งตอการอยูรอดของเรา ขยายสิ่งอํานวยความสะดวกทาเรือเพื่อเพิ่มการผลิตทางเรือ เมื่อนั้นญี่ปุนจึงจะสรางกองเรือที่สมกับเกียรติของตนได"
 naval_expansion_focus_short_desc: "§Lเพิ่มการผลิตทางเรือของญี่ปุนดวยการสรางอูตอเรือเพิ่ม§!"
 increase_naval_production_SUCCEEDED: "เพิ่มการผลิตทางเรือแลว"
 increase_naval_production_SUCCEEDED_DESC: "เราเพิ่มการผลิตทางเรือไดสําเร็จ อีกไมนานองคจักรพรรดิจะทรงบัญชาการกองเรือรบที่ยิ่งใหญที่สุดเทาที่โลกเคยเห็นมา!"
 siamese_puppet_focus: "กดดันสยาม"
 siamese_puppet_focus_desc: "กําลังของเราตองการสิทธิ์ผานสยามเพื่อไปถึงดินแดนของอังกฤษในพมาและมลายา การแสดงแสนยานุภาพอาจโนมนาวใหรัฐบาลสยามลงนามเปนพันธมิตรกับเราในฐานะหุนสวนที่ภักดีในวงไพบูลยรวมแหงมหาเอเชียบูรพา"
 siamese_puppet_focus_short_desc: "§Lโนมนาวใหสยามมาอยูขางเรา§!"
 occupy_philippines: "ยึดครองฟลิปปนส"
 occupy_philippines_desc: "กาวแรกของการรณรงคในแปซิฟกที่ประสบความสําเร็จคือการยึดครองฟลิปปนส ชาวอเมริกันจะไมลังเลที่จะใชหมูเกาะนี้เปนฐานรุกหนาเพื่อโจมตีญี่ปุนโดยตรง แตเราก็สามารถใชมันเพื่อจุดประสงคเดียวกันในปฏิบัติการตอเขตทรัพยากรทางใตในอนาคต"
 occupy_philippines_short_desc: "§Lยกพลขึ้นบกที่ฟลิปปนสเพื่อไมใหศัตรูใชเปนฐานโจมตีเรา§!"
 southern_resource_area: "เขตทรัพยากรทางใต"
 southern_resource_area_desc: "บอรเนียวของอังกฤษและดัตชอีสตอินดีสอันอุดมสมบูรณคือเปาหมายทางยุทธศาสตรที่สําคัญยิ่งซึ่งพรอมใหยึดครอง ญี่ปุนตองเขาถึงบอนํ้ามันและสวนยางใหได มิฉะนั้นอุตสาหกรรมจะขาดแคลนและเครื่องจักรสงครามจะลมสลาย"
 southern_resource_area_short_desc: "§Lยึดครองเขตทรัพยากรทางใตเพื่อใหไดวัตถุดิบสําหรับอุตสาหกรรมสงครามของเรา§!"
 british_far_east: "ตะวันออกไกลของอังกฤษ"
 british_far_east_desc: "อังกฤษตองถูกริบจักรวรรดิอาณานิคมในเอเชีย หากญี่ปุนจะขึ้นสูตําแหนงที่ชอบธรรมในฐานะผูนําระเบียบใหมในมหาเอเชียบูรพา ยึดฮองกง ยึดครองคาบสมุทรมลายู และรุกเขาสูพมา สรางแนวพรมแดนใหมตามแนวชายแดนที่ติดกับอินเดีย"
 british_far_east_short_desc: "§Lพิชิตฮองกง สิงคโปร และพมาใหสําเร็จ§!"
 isolate_australia: "โดดเดี่ยวออสเตรเลีย"
 isolate_australia_desc: "ออสเตรเลียมีความสําคัญยิ่งตอความพยายามทําสงครามของฝายสัมพันธมิตรในแปซิฟก และตองไมปลอยใหเปนฐานที่รวบรวมกําลังเพื่อตอตานญี่ปุนและดินแดนที่ญี่ปุนพิชิตมาโดยชอบธรรม ดวยการยึดเกาะสําคัญในแปซิฟกตะวันตกเฉียงใต เราจะสามารถตัดออสเตรเลียออกจากสหรัฐอเมริกาได"
 isolate_australia_short_desc: "§Lโดดเดี่ยวออสเตรเลียดวยการยึดครองเกาะสําคัญที่อยูรายรอบ§!"
 invade_australia: "รุกรานออสเตรเลีย"
 invade_australia_desc: "ถึงเวลาดําเนินการรุกรานออสเตรเลียเต็มรูปแบบแลว ซึ่งจะกําจัดปอมปราการแหงอํานาจที่ใหญที่สุดของฝายสัมพันธมิตรในแปซิฟกอยางถาวร และรักษาปกดานใตของวงไพบูลยรวมแหงมหาเอเชียบูรพาใหมั่นคง"
 invade_australia_short_desc: "§Lเปดฉากการรุกรานออสเตรเลียเต็มรูปแบบ§!"
 secure_the_pacific: "ยึดครองแปซิฟกใหมั่นคง"
 secure_the_pacific_desc: "ฐานทัพอเมริกันทั่วแปซิฟกตองถูกยึด เพื่อลดขีดความสามารถในการแผกําลังของกองเรือของพวกเขาเขามาในดินแดนของเรา กองเสนาธิการทหารเรือจักรวรรดิไดระบุเกาะหลายแหงที่ตองยึดครอง รวมถึงฐานทัพหลักของกองเรือแปซิฟกสหรัฐฯ ที่ฮาวาย"
 secure_the_pacific_short_desc: "§Lยึดครองเกาะสําคัญของอเมริกาเพื่อควบคุมแปซิฟก§!"
 close_panama_canal: "ปดคลองปานามา"
 close_panama_canal_desc: "ชาวอเมริกันพึ่งพาคลองปานามาในการเคลื่อนยายกําลังทางเรือระหวางชายฝงตะวันตกและตะวันออก และนี่คือจุดออนของพวกเขา! เราตองยึดหมูเกาะกาลาปาโกสเพื่อตั้งฐานรุกหนา จากนั้นยกพลขึ้นบกที่ปานามาเพื่อปดคลอง เพื่อองคจักรพรรดิ!"
 close_panama_canal_short_desc: "§Lยึดครองคลองปานามาเพื่อไมใหชาวอเมริกันใชงานได§!"
 invasion_of_alaska: "การรุกรานอะแลสกา"
 invasion_of_alaska_desc: "เสนทางเขาสูหมูเกาะแมทางเหนือตองไดรับการปกปองดวยการยึดครองหมูเกาะอะลูเชียน การควบคุมหมูเกาะเหลานี้จะทําใหเราตั้งที่มั่นในอเมริกาเหนือไดดวยการรุกรานอะแลสกา ความหางไกลของภูมิภาคนี้นาจะทําใหชาวอเมริกันสงกําลังเสริมมาไดยาก"
 invasion_of_alaska_short_desc: "§Lรุกรานและยึดครองดินแดนอเมริกันในอะแลสกา§!"
 invasion_of_west_coast: "ปฏิบัติการเค็ตสึ-โก"
 invasion_of_west_coast_desc: "กองบัญชาการใหญจักรวรรดิไดตัดสินใจยุติสงครามกับอเมริกาอยางเด็ดขาดดวยการรุกรานชายฝงตะวันตกของพวกเขา เปาหมายของปฏิบัติการนี้ไดแก ลอสแอนเจลิส ซานฟรานซิสโก และซีแอตเทิล จงเตรียมพรอมรับการโจมตีตอบโตตอหัวหาดของเรา"
 invasion_of_west_coast_short_desc: "§Lเริ่มการรุกรานชายฝงตะวันตกของอเมริกา§!"
 invasion_of_india: "การรุกรานอินเดีย"
 invasion_of_india_desc: "ในที่สุด ยุคแหงการปกครองอนุทวีปอินเดียของอังกฤษจะสิ้นสุดลง เราตองรุกตอจากพมาและขับไลอังกฤษออกจากเอเชียโดยสิ้นเชิง นี่จะเปนการโจมตีที่จักรวรรดิของพวกเขาไมมีวันฟนตัวได!"
 invasion_of_india_short_desc: "§Lขับไลอังกฤษออกจากอินเดียดวยการยึดครองอนุทวีปทั้งหมด§!"
 secure_the_indian_ocean: "ยึดครองมหาสมุทรอินเดียใหมั่นคง"
 secure_the_indian_ocean_desc: "เราตองควบคุมมหาสมุทรอินเดียเพื่อปองกันการเคลื่อนกองเรือของฝายสัมพันธมิตรมายังเอเชีย ตองยึดเปาหมายหลายแหง รวมถึงมาดากัสการนอกชายฝงแอฟริกา เกาะนี้สามารถใชเปนฐานสําหรับกอกวนขบวนเรือลําเลียงของอังกฤษที่มุงหนาสูตะวันออกกลาง"
 secure_the_indian_ocean_short_desc: "§Lควบคุมมหาสมุทรอินเดียดวยการยึดเปาหมายสําคัญ§!"
 invasion_of_south_africa: "การรุกรานแอฟริกาใต"
 invasion_of_south_africa_desc: "กองกําลังที่ไมมีใครหยุดยั้งไดของเราอยูในตําแหนงที่จะโจมตีแอฟริกาใตแลว การพิชิตที่นี่จะทําใหหนวยนาวีของฝายสัมพันธมิตรเขาสูมหาสมุทรอินเดียไดยากมากหากไมใชคลองสุเอซ จักรวรรดิอังกฤษอันเสื่อมโทรมกําลังพังทลายตอหนาตอตาเรา"
 invasion_of_south_africa_short_desc: "§Lยกพลขึ้นบกในแอฟริกาใตและทําลายการตอตานทั้งหมด§!"
 extend_maginot_line: "ขยายแนวมาจิโน"
 extend_maginot_line_desc: "พรมแดนที่ติดกับเยอรมนีไดรับการปกปองโดยแนวมาจิโนอันนาเกรงขาม แตการรุกโอบปกของเยอรมันผานเบลเยียมและลักเซมเบิรก เชนเดียวกับเมื่อป 1914 ยังคงเปนไปไดเสมอ เราตองขยายปอมปราการหนักไปจนถึงชองแคบอังกฤษ แมวานั่นจะหมายถึงการปลอยใหเบลเยียมตกอยูในความเมตตาของเยอรมันก็ตาม"
 extend_maginot_line_short_desc: "§Lขยายแนวมาจิโนไปจนถึงชองแคบอังกฤษ§!"
 improve_alpine_line: "ปรับปรุงแนวแอลป"
 improve_alpine_line_desc: "'แนวมาจิโนนอย' ที่ปกปองพรมแดนทางใตซึ่งติดกับอิตาลีมีความสําคัญรองลงมาเสมอในแผนการทางทหารของเรา อยางไรก็ตาม อิตาลีฟาสซิสตกําลังกาวราวมากขึ้นเรื่อยๆ และเรารูวาพวกเขามีความทะเยอทะยานทางดินแดนในฝรั่งเศสตอนใต เราตองยกระดับปอมปราการของแนวแอลปใหไดมาตรฐานเดียวกับแนวมาจิโน"
 improve_alpine_line_short_desc: "§Lปรับปรุงปอมปราการปองกันตามแนวพรมแดนอิตาลี§!"
 expand_french_air_force: "ขยายกองทัพอากาศฝรั่งเศส (Armée de l'Air)"
 expand_french_air_force_desc: "กําลังทางอากาศจะมีความสําคัญยิ่งในสงครามครั้งหนา การสูญเสียนานฟายอมหมายถึงการยอมจํานนของฝรั่งเศสเองอยางหลีกเลี่ยงไมได เราตองขยาย Armée de l'Air ตอไปเพื่อใหฝรั่งเศสมีกองทัพอากาศที่ดีที่สุดแหงหนึ่งของโลก"
 expand_french_air_force_short_desc: "§Lเพิ่มขนาดกองทัพอากาศเพื่อปกปองนานฟาเหนือฝรั่งเศส§!"
 french_arms_industry: "เพิ่มอุตสาหกรรมอาวุธ"
 french_arms_industry_desc: "ณ จุดนี้ สงครามกับเยอรมนีอีกครั้งดูจะมีแนวโนมเกิดขึ้นมากขึ้นเรื่อยๆ เราตองเตรียมพรอมดวยการขยายอุตสาหกรรมอาวุธ กองทัพฝรั่งเศสคือสิ่งเดียวที่ขวางกั้นเยอรมนีจากการครอบงํายุโรปตะวันตก!"
 french_arms_industry_short_desc: "§Lเสริมสรางอุตสาหกรรมอาวุธของฝรั่งเศสเพื่อเตรียมรับสงครามที่กําลังจะมาถึง§!"
 scandinavian_expedition: "การยกพลสูสแกนดิเนเวีย"
 scandinavian_expedition_desc: "เราตองทําทุกวิถีทางเพื่อไมใหสงครามลุกลามเขาสูดินแดนฝรั่งเศส และการสงกองกําลังไปยังนอรเวยและสวีเดนตอนเหนือจะเปดแนวรบใหมใหเยอรมนีตองรับมือ เหล็กกลาสวนใหญของเยอรมนีมาจากภูมิภาคนี้ และการตัดเสนทางลําเลียงอาจทําใหอุตสาหกรรมของพวกเขาเปนอัมพาตได"
 scandinavian_expedition_short_desc: "§Lเปดแนวรบใหมตอเยอรมนีจากสแกนดิเนเวียตอนเหนือ§!"
 grand_offensive: "เปดฉากการรุกใหญ"
 grand_offensive_desc: "ขณะที่แวรมัคทกําลังวุนอยูกับการรับมือกองกําลังโปแลนดผูกลาหาญทางตะวันออก เราตองทําตามพันธกรณีของพันธมิตรและรุกลึกเขาไปในเยอรมนี! ยึดครองศูนยกลางอุตสาหกรรมของพวกเขาในหุบเขาไรน นั่นนาจะดึงความสนใจของ OKW และอาจบีบใหพวกเขาตองละทิ้งการรุกเขาสูโปแลนด"
 grand_offensive_short_desc: "§Lยึดครองอุตสาหกรรมของเยอรมนีในหุบเขาไรน§!"
 seize_berlin_fra: "ยึดเบอรลิน"
 seize_berlin_fra_desc: "เราไมมีทางเลือกอื่นนอกจากเดินทัพสูเบอรลินและปกธงไตรรงคบนยอดอาคารไรชสทาค ใหเรายุติสงครามนี้อยางรวดเร็วกอนที่มันจะเริ่มขึ้นอยางจริงจัง"
 seize_berlin_fra_short_desc: "§Lยึดครองเมืองหลวงของเยอรมนี§!"
 occupy_libya_fra: "ยึดครองลิเบียของอิตาลี"
 occupy_libya_fra_desc: "จักรวรรดิอาณานิคมของอิตาลีตองถูกรื้อถอน เปดการรุกเขาสูลิเบียของอิตาลีจากรัฐในอารักขาตูนิเซียของเรา และยึดครองชายฝงเมดิเตอรเรเนียน เปาหมายสําคัญไดแกเมืองทายุทธศาสตรตริโปลีและเบงกาซี"
 occupy_libya_fra_short_desc: "§Lเปดการรุกเพื่อยึดครองตริโปลีและเบงกาซี§!"
 occupy_north_italy_fra: "ยึดครองอิตาลีตอนเหนือ"
 occupy_north_italy_fra_desc: "ถึงเวลาอีกครั้งที่กองทัพฝรั่งเศสจะเดินทัพเขาสูอิตาลีตอนเหนือ อุตสาหกรรมสงครามของอิตาลีสวนใหญกระจุกตัวอยูที่นั่น และตองตัดโรมจากการใชประโยชน จงเจาะทะลวงวัลโล อัลปโนที่ขึ้นชื่อ และบุกเขาสูหุบเขาโป ฝรั่งเศสจงเจริญ!"
 occupy_north_italy_fra_short_desc: "§Lเจาะทะลวงวัลโล อัลปโนที่ขึ้นชื่อ และบุกเขาสูหุบเขาโป§!"
 occupy_south_italy_fra: "ยึดครองอิตาลีตอนใต"
 occupy_south_italy_fra_desc: "ครึ่งทางใตของคาบสมุทรอิตาลีตองถูกยึดไว พรอมกับซิซิลีและซารดิเนีย ยึดเปาหมายทั้งหมด แตอยาละสายตาจากเปาหมายหลักของเรา: โรม เมื่อยึดครองนครนิรันดรไดแลว ใหรุกตอไปตามชายฝงและกําจัดแหลงตอตานที่ยังหลงเหลืออยู"
 occupy_south_italy_fra_short_desc: "§Lยึดซิซิลีและซารดิเนียพรอมกับเมืองหลวงของอิตาลี§!"
 claim_bessarabia: "อางสิทธิ์เหนือเบสซาราเบีย"
 claim_bessarabia_desc: "ดินแดนเบสซาราเบียถูกโรมาเนียยึดครองอยางผิดกฎหมายในชวงความวุนวายหลังการปฏิวัติรัสเซีย ดินแดนนี้เปนของเราโดยชอบธรรมและตองถูกสงคืน กติกาสัญญาโมโลตอฟ-ริบเบินทร็อพเปดทางใหเราจัดการกับโรมาเนียไดอยางอิสระโดยไมตองกลัวการแทรกแซงของเยอรมนี ดังนั้นถึงเวลาลงมือแลว"
 claim_bessarabia_short_desc: "§Lบีบใหโรมาเนียคืนเบสซาราเบียแกเรา§!"
 claim_baltic_states: "อางสิทธิ์เหนือรัฐบอลติก"
 claim_baltic_states_desc: "รัฐบอลติกคือการทดลองทุนนิยมที่ลมเหลวซึ่งตองยุติลง กติกาสัญญากับเยอรมนีทําใหเราดําเนินการในภูมิภาคนี้ไดโดยไมตองรับผิด และเราไดเตรียมคําขาดถึงเอสโตเนีย ลัตเวีย และลิทัวเนีย ใหยอมใหเราตั้งฐานทัพภายในพรมแดนของพวกเขา หลังจากนั้นการผนวกชาติเหลานี้เปนสมาชิกเต็มตัวของสหภาพสาธารณรัฐสังคมนิยมโซเวียตก็เปนเรื่องงาย"
 claim_baltic_states_short_desc: "§Lผนวกรัฐบอลติกเขากับสหภาพโซเวียต§!"
 claim_karelia: "อางสิทธิ์เหนือคาเรเลีย"
 claim_karelia_desc: "ตามกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ ฟนแลนดอยูในเขตผลประโยชนของเรา และถึงเวลาทบทวนพรมแดนอันเอื้อเฟอของพวกเขาแลว พรมแดนดานตะวันออกเฉียงใตบนคอคอดคาเรเลียอยูใกลเลนินกราดเกินกวาจะยอมรับได ซึ่งบั่นทอนความมั่นคงของชาติเรา เราจะยื่นขอเรียกรองตอเฮลซิงกิใหฟนแลนดยกดินแดน แตเราตองพรอมสูรบหากพวกเขาปฏิเสธ"
 claim_karelia_short_desc: "§Lเรียกรองคาเรเลียจากฟนแลนดเพื่อเพิ่มความมั่นคงของเลนินกราด§!"
 improve_stalin_line: "ปรับปรุงแนวสตาลิน"
 improve_stalin_line_desc: "การสรางแนวสตาลินเริ่มขึ้นในทศวรรษ 1920 ตามแนวชายแดนตะวันตกของเรา เพื่อปองกันชาติกระฎมพีแหงยุโรปตะวันตกที่ไมปรารถนาสิ่งใดมากไปกวาการทําลายลางเรา เราตองปรับปรุงแนวปองกันเหลานี้ตอไป"
 improve_stalin_line_short_desc: "§Lปรับปรุงแนวปองกันตามแนวสตาลินเพื่อตานทานการรุกรานจากตางชาติ§!"
 five_year_plans: "แผนหาป"
 five_year_plans_desc: "แผนหาปเพื่อการพัฒนาเศรษฐกิจของชาติมีความสําคัญอยางยิ่งยวดตออนาคตของสหภาพโซเวียต ความลาหลังทางเศรษฐกิจและอุตสาหกรรมจะนําไปสูการถูกทําลายลางในที่สุดดวยนํ้ามือของมหาอํานาจทุนนิยมและฟาสซิสตตางชาติ เราตองขยายอุตสาหกรรมและผลผลิตตอไป!"
 five_year_plans_short_desc: "§Lขยายผลผลิตทางอุตสาหกรรมพลเรือนของสหภาพโซเวียต§!"
 operation_zet: "ปฏิบัติการเซต"
 operation_zet_desc: "ฟาสซิสตญี่ปุนกําลังทําสงครามเพื่อพิชิตจีนทั้งหมด ไมตองบอกก็รูวาการที่พวกเขาประสบความสําเร็จไมเปนผลดีตอสหภาพโซเวียต เราตองใหการสนับสนุนแกจีนเทาที่ทําได หากโชคดี กองทัพบกจักรวรรดิญี่ปุนจะถูกดึงเขาสูหลมที่บั่นทอนจักรวรรดิของพวกเขาและทําใหพวกเขาติดพันไปอีกนาน"
 operation_zet_short_desc: "§Lใหการสนับสนุนแกจีนในสงครามตอตานญี่ปุน§!"
 annex_tannu_tuva: "ผนวกตันนูตูวา"
 annex_tannu_tuva_desc: "สาธารณรัฐประชาชนตูวาเปนสมาชิกของสหภาพโซเวียตในทุกดานยกเวนเพียงชื่อ ใหเราทําความสัมพันธนี้ใหเปนทางการดวยการผนวกพวกเขาเขากับชาติอันยิ่งใหญของเราอยางเปนทางการ"
 annex_tannu_tuva_short_desc: "§Lผนวกตันนูตูวาเขากับสหภาพโซเวียต§!"
 second_vienna_award: "คําตัดสินเวียนนาครั้งที่สอง"
 second_vienna_award_desc: "สนธิสัญญาทรียานงริบดินแดนกวาสองในสามของฮังการีไปอยางไมเปนธรรม การเสียทรานซิลเวเนียใหโรมาเนียเปนเรื่องที่ยอมรับไดยากเปนพิเศษ อยางไรก็ตาม ระเบียบใหมไดถูกสถาปนาขึ้นในยุโรปแลว และเราตองยื่นคํารองตอมิตรชาวเยอรมันใหคืนดินแดนฮังการีที่ถูกขโมยไป"
 second_vienna_award_short_desc: "§Lยื่นคํารองตอเยอรมนีใหคืนทรานซิลเวเนียแกฮังการี§!"
 claim_memel: "อางสิทธิ์เหนือเมเมิล"
 claim_memel_desc: "เมเมิลเปนอีกหนึ่งความอยุติธรรมที่เกิดจากสนธิสัญญาแวรซายอันนาชิงชัง จังหวัดนี้เปนของปรัสเซียมาหลายรอยป แตฝายไตรภาคีกลับตัดสินใจแยกออกจากเยอรมนีและปลอยใหลิทัวเนียผนวกไปอยางผิดกฎหมาย ถึงเวลาแกไขความผิดนี้แลว"
 claim_memel_short_desc: "§Lเรียกรองใหสงเมเมิลคืนสูมหาไรชเยอรมัน§!"
 treaty_of_craiova: "สนธิสัญญาไกรโอวา"
 treaty_of_craiova_desc: "โดบรูจาตอนใตถูกโรมาเนียยึดไปจากเราหลังสงครามบอลขานครั้งที่สอง อยางไรก็ตาม พรมแดนของยุโรปกําลังถูกขีดเสนใหม และโรมาเนียก็ถูกบีบใหยอมออนขอไปแลว เราตองเรียกรองดินแดนที่สูญเสียไปคืน"
 treaty_of_craiova_short_desc: "§Lเรียกรองใหโรมาเนียคืนโดบรูจาตอนใต§!"
 german_advisors_china: "ที่ปรึกษาเยอรมันในจีน"
 german_advisors_china_desc: "ที่ปรึกษาทางทหารชาวเยอรมันประจําอยูในจีนมาตั้งแตอยางนอยทศวรรษ 1920 ใหการสนับสนุนที่สําคัญยิ่งแกกกมินตั๋ง ในภาวะสงครามขณะนี้ เราไมอาจยอมรับเรื่องนี้ไดอีกตอไป ในฐานะผูลงนามในกติกาสัญญาตอตานโคมินเทิรน เรามีสิทธิ์เรียกรองใหเยอรมนีถอนการสนับสนุนทั้งหมดตอจีนโดยทันที ถึงเวลาที่เยอรมันตองเลือกขางแลว"
 german_advisors_china_short_desc: "§Lเรียกรองใหเรียกตัวที่ปรึกษาชาวเยอรมันที่ชวยเหลือจีนกลับ§!"
 chinese_coastal_regions: "ยึดครองภูมิภาคชายฝงของจีน"
 chinese_coastal_regions_desc: "เราตองใชประโยชนจากความเหนือกวาทางนาวีและโดดเดี่ยวจีนดวยการยึดครองทาเรือสําคัญตามแนวชายฝง กองบัญชาการใหญจักรวรรดิไดกําหนดภูมิภาคหลายแหงที่ตองอยูภายใตการควบคุมของญี่ปุน"
 chinese_coastal_regions_short_desc: "§Lโดดเดี่ยวจีนดวยการยึดครองชายฝง§!"
 chinese_interior: "ยึดครองดินแดนตอนในของจีน"
 chinese_interior_desc: "ใหเรายุติการตอตานของจีนใหสิ้นซากดวยการรุกเขาสูดินแดนตอนใน แสดงใหพวกเขาเห็นวาอํานาจของเราไรขีดจํากัดดวยการบดขยี้การตอตานทั้งหมด สิ่งนี้จะรับประกันความเปนใหญของญี่ปุนในเอเชีย"
 chinese_interior_short_desc: "§Lไลตามจีนไปทางตะวันตกเขาสูดินแดนตอนใน§!"
 russian_far_east: "ตะวันออกไกลของรัสเซีย"
 russian_far_east_desc: "ตองแสดงใหโซเวียตเห็นวาพวกเขาไมเปนที่ตอนรับในเอเชียอีกตอไป ยึดครองตะวันออกไกลของรัสเซีย โดยเริ่มจากฐานทัพกองเรือแปซิฟกของพวกเขาที่วลาดีวอสตอค ซาฮาลินตอนเหนือและคัมชัตคาก็ตองยึดไวเชนกัน"
 russian_far_east_short_desc: "§Lพิชิตตะวันออกไกลของรัสเซียเพื่อญี่ปุน!§!"
 siberia_beckons: "ไซบีเรียกําลังเรียกหา"
 siberia_beckons_desc: "เราตองรุกตอไปเขาสูไซบีเรีย ผลักดันรัสเซียไปทางตะวันตกจนพวกเขาไมอาจคุกคามดินแดนของเราในเอเชียไดอีก ดินแดนรกรางไซบีเรียจะเปนเขตกันชนของจักรวรรดิเรา และทรัพยากรธรรมชาติที่ยังไมถูกแตะตองของภูมิภาคนี้จะเปนประโยชนแกชาวญี่ปุนรุนตอไปอยางแนนอน"
 siberia_beckons_short_desc: "§Lเดินทัพตอไปและยึดไซบีเรียในนามขององคจักรพรรดิ§!"
 conquest_of_abyssinia: "การพิชิตอะบิสซิเนีย"
 conquest_of_abyssinia_desc: "ความทรงจําอันเจ็บปวดจากสงครามอิตาลี-อะบิสซิเนียครั้งที่หนึ่งและความพายแพที่อัดวาไดผานพนไปแลว เรามุงมั่นที่จะพิชิตจักรวรรดิเอธิโอเปยอยางสมบูรณและผนวกรวมเขากับแอฟริกาตะวันออกของอิตาลี รุกไปสูชัยชนะ!"
 conquest_of_abyssinia_short_desc: "§Lดําเนินการรุกรานเอธิโอเปย§!"
 conquest_of_albania: "การพิชิตแอลเบเนีย"
 conquest_of_albania_desc: "กองกําลังอิตาลีถูกบีบใหถอนตัวอยางนาอับอายจากสวนตางๆ ของแอลเบเนียที่ยึดครองไวในป 1920 แตบัดนี้ถึงเวลาที่เราจะกลับไปแลว การผนวกแอลเบเนียจะทําใหเราควบคุมทางเขาทะเลเอเดรียติกไดอยางสมบูรณ และดินแดนนี้ยังใชเปนที่มั่นสําหรับการรณรงคในบอลขานในอนาคตได"
 conquest_of_albania_short_desc: "§Lควบคุมทะเลเอเดรียติกใหมั่นคงดวยการยึดแอลเบเนีย§!"
 strengthen_vallo_alpino: "เสริมความแข็งแกรงวัลโล อัลปโน"
 strengthen_vallo_alpino_desc: "ภัยคุกคามอาจมาจากทุกทิศทางตามแนวพรมแดนทางเหนือของเรา ฝรั่งเศส ออสเตรียและมิตรชาวเยอรมันของพวกเขา หรือแมแตสวิสผูชั่วชาก็อาจโจมตีไดทุกเมื่อ! งานกอสรางแนวปอมปราการไดเริ่มขึ้นแลว แตความคืบหนายังชา สรางกําแพงแอลปใหเสร็จเพื่อใหการรุกรานอิตาลีตอนเหนือในอนาคตตองแลกดวยราคาแพง!"
 strengthen_vallo_alpino_short_desc: "§Lรักษาพรมแดนทางเหนือของอิตาลีใหมั่นคงดวยการปรับปรุงปอมปราการ§!"
 industrialize_southern_italy: "พัฒนาอุตสาหกรรมอิตาลีตอนใต"
 industrialize_southern_italy_desc: "อิตาลีตอนเหนือเปนศูนยกลางอุตสาหกรรมของชาติเรามาโดยตลอด ขณะที่ตอนใตยังคงยากจนและดอยพัฒนาเมื่อเทียบกัน เราตองดําเนินการลดชองวางทางเศรษฐกิจนี้ดวยการสรางอุตสาหกรรมเพิ่มขึ้นในรัฐทางใต"
 industrialize_southern_italy_short_desc: "§Lครึ่งทางใตอันยากจนของประเทศเราตองไดรับการพัฒนาอุตสาหกรรม§!"
 regia_marina: "เรเจีย มารีนา"
 regia_marina_desc: "ชะตากรรมของอิตาลีผูกติดโดยตรงกับเมดิเตอรเรเนียน ซึ่งเปนสิ่งที่ชาวโรมันโบราณเขาใจดี เปนที่ชัดเจนวาเรเจีย มารีนาจะมีบทบาทสําคัญยิ่งในความขัดแยงใดๆ กับอังกฤษหรือฝรั่งเศสในอนาคต เราตองขยายอูตอเรือเพื่อเพิ่มการผลิตเรือ"
 regia_marina_short_desc: "§Lสรางอูตอเรือเพิ่มเพื่อเพิ่มการผลิตทางเรือ§!"
 condemn_japan: "ประณามญี่ปุน"
 condemn_japan_desc: "สงครามรุกรานจีนของญี่ปุนเปนการเหยียบยํ่าอารยธรรมและเสรีภาพ อีกทั้งยังเปนภัยตอชีวิต สิทธิ และผลประโยชนทางเศรษฐกิจของชาวอเมริกันในจีน! ญี่ปุนตองยุติการโจมตี มิฉะนั้นจะตองเผชิญผลที่ตามมา"
 condemn_japan_short_desc: "§Lประณามสงครามรุกรานจีนของญี่ปุน§!"
 embargo_japan: "ควํ่าบาตรญี่ปุน"
 embargo_japan_desc: "ญี่ปุนยังคงโจมตีจีนตอไปแมจะไดรับคําเตือนจากเรา ถึงเวลาควํ่าบาตรการคาทั้งหมดกับญี่ปุนแลว"
 embargo_japan_short_desc: "§Lควํ่าบาตรการคาทั้งหมดกับญี่ปุนเพื่อตอบโตการโจมตีจีน§!"
 threaten_japan: "แสดงธงในแปซิฟก"
 threaten_japan_desc: "เพื่อใหญี่ปุนรูวาเราเอาจริง จําเปนอยางยิ่งที่ตองคงกองเรือที่ทรงอานุภาพไวที่เพิรลฮารเบอร"
 threaten_japan_short_desc: "§Lคงกองเรือที่ทรงอานุภาพไวที่เพิรลฮารเบอร§!"
 build_infrastructure: "สรางโครงสรางพื้นฐาน"
 build_infrastructure_desc: "การสรางโครงสรางพื้นฐานไมเพียงทําใหการเดินทางทั่วประเทศงายขึ้น แตที่สําคัญกวานั้นคือจะสรางงานและชวยใหเราหลุดพนจากภาวะเศรษฐกิจถดถอยในปจจุบัน"
 build_infrastructure_short_desc: "§Lขยายโครงสรางพื้นฐานในประเทศของเรา§!"
 build_factories: "สรางโรงงาน"
 build_factories_desc: "การสรางโรงงานใหมกอใหเกิดการจางงานทั้งระหวางและหลังการกอสราง ซึ่งเปนกาวสําคัญในการปรับปรุงเศรษฐกิจ"
 build_factories_short_desc: "§Lสรางโรงงานพลเรือนใหมเพื่อปรับปรุงเศรษฐกิจ§!"
 anglo_egypt_treaty: "สนธิสัญญาอังกฤษ-อียิปต"
 anglo_egypt_treaty_desc: "แมจะเปนเอกราชในนาม แตอียิปตอยูภายใตการคุมครองของเรามาตั้งแตป 1882 พระเจาฟารูกทรงประสงคจะทําใหความสัมพันธของเราเปนทางการดวยสนธิสัญญา เนื่องจากปฏิบัติการทางทหารของอิตาลีในอะบิสซิเนีย อียิปตจะเขารวมกับเราในฐานะพันธมิตร ขณะที่เรายังคงควบคุมคลองสุเอซและใหคํามั่นวาจะชวยปองกันอียิปตในกรณีเกิดสงคราม"
 anglo_egypt_treaty_short_desc: "§Lรับรองเอกราชของอียิปตอยางเปนทางการ โดยยังคงใหอียิปตเปนพันธมิตร§!"
 shadow_scheme: "โครงการเงา"
 shadow_scheme_desc: "กระทรวงการบินไดจัดทําแผนสราง 'โรงงานเงา' ซึ่งเปนโรงงานพลเรือนที่จะไดรับการเตรียมการและขยาย เพื่อใหเปลี่ยนไปผลิตยุทโธปกรณทางทหารไดงายขึ้นหากเกิดสงคราม"
 shadow_scheme_short_desc: "§Lเตรียมการและขยายโรงงานพลเรือนเพื่อรองรับสงครามที่อาจเกิดขึ้น§!"
 chain_home: "เครือขายเรดารเชนโฮม"
 chain_home_desc: "การมาถึงของสงครามทางอากาศทําใหอังกฤษตกอยูในความเสี่ยง เราไมอาจพึ่งพากองเรืออันยิ่งใหญเพียงอยางเดียวเพื่อความปลอดภัยไดอีกตอไป ไดมีการวางแผนสรางเครือขายสถานีเรดารตามแนวชายฝงภายใตรหัส 'เชนโฮม' การกอสรางนี้จะชวยเราอยางมากในการปองกันนานฟา"
 chain_home_short_desc: "§Lสรางเครือขายสถานีเรดารตามแนวชายฝงอังกฤษ§!"
 gibraltar_east: "ยิบรอลตารแหงตะวันออก"
 gibraltar_east_desc: "งานเปลี่ยนสิงคโปรใหเปนฐานทัพเรือสําคัญดําเนินมาตั้งแตสิ้นสุดมหาสงคราม ทาเรือนี้จะเปนปอมปราการของราชนาวี ทําใหเราแผอิทธิพลไปทั่วเอเชียได จงทํางานที่เริ่มไวใหเสร็จและปรับปรุงแนวปองกันของสิงคโปร"
 gibraltar_east_short_desc: "§Lปรับปรุงแนวปองกันทางทะเลของสิงคโปร§!"
 home_guard: "กองอาสารักษาดินแดน"
 home_guard_desc: "ฝรั่งเศสพายแพแลว และบัดนี้อังกฤษเองก็เผชิญภัยคุกคามจากการรุกราน มีขอเสนอใหจัดตั้งองคกรปองกันใหมที่ประกอบดวยอาสาสมัครในทองถิ่น ทหารผานศึกจํานวนมากจากสงครามครั้งกอนมีอายุมากเกินกวาจะรับราชการทหารปกติ แตดวยวิธีนี้พวกเขายังสามารถมีสวนรวมในการปองกันประเทศได"
 home_guard_short_desc: "§Lจัดตั้งองคกรปองกันของอาสาสมัครทองถิ่น§!"
 operation_laudabiliter: "ปฏิบัติการเลาดาบิลิเทอร"
 operation_laudabiliter_desc: "เอกราชของไอรแลนดเปนมลทินตอเกียรติยศของอังกฤษ เพื่อประโยชนของชาวไอริชเอง พวกเขาตองถูกปกครองดวยมือที่เด็ดขาดจากลอนดอน กําลังมีการวางแผนการรุกรานที่จะนําแกะหลงฝูงเหลานี้กลับเขาคอก"
 operation_laudabiliter_short_desc: "รุกรานไอรแลนดและพิชิตกลับคืนใหอังกฤษ"
 expand_the_luftwaffe: "ขยายลุฟทวัฟเฟอ"
 expand_the_luftwaffe_desc: "สนธิสัญญาแวรซายไมอนุญาตใหเยอรมนีมีกองทัพอากาศ เราจึงตองสรางลุฟทวัฟเฟอขึ้นจากศูนยในเวลาอันสั้นเปนประวัติการณ เรามีความคืบหนาอยางมาก แตยังมีอีกมากที่ตองทํา จงขยายลุฟทวัฟเฟอตอไปและทําใหเปนกองทัพอากาศที่ดีที่สุดในโลก"
 expand_the_luftwaffe_short_desc: "§Lเพิ่มขนาดลุฟทวัฟเฟอเพื่อเตรียมรับสงครามที่กําลังจะมาถึง§!"
 panzerwaffe: "สรางพันเซอรวัฟเฟอ"
 panzerwaffe_desc: "ทฤษฎีใหมวาดวยสงครามเคลื่อนที่ของเราจําเปนตองมีกองกําลังรถถังที่มีพลังโจมตีรุนแรง เราตองเพิ่มขนาดพันเซอรวัฟเฟอใหมากขึ้นอีกเพื่อเตรียมพรอมสําหรับสงครามที่หลีกเลี่ยงไมได"
 panzerwaffe_short_desc: "§Lจัดตั้งกองกําลังยานเกราะดวยการตั้งกองพลพันเซอรใหมใหแกกองทัพบก (Heer)§!"
 reichsautobahn: "สรางไรชสเอาโทบานใหเสร็จ"
 reichsautobahn_desc: "นับตั้งแตเริ่มตนในป 1933 โครงการเอาโทบานประสบความสําเร็จอยางงดงาม งานกอสรางชวยลดการวางงาน และถนนกวางใหญเหลานี้ตั้งตระหงานเปนอนุสรณแหงการฟนตัวทางเศรษฐกิจของเยอรมนี อยางไรก็ตาม ยังมีงานอีกมากที่ตองทํา"
 reichsautobahn_short_desc: "§Lสรางเอาโทบานใหเสร็จดวยการเพิ่มโครงสรางพื้นฐานในรัฐสําคัญ§!"
 fortify_the_westwall: "เสริมปอมปราการเวสตวัล"
 fortify_the_westwall_desc: "เวสตวัลทอดขนานไปกับแนวมาจิโนอันขึ้นชื่อของฝรั่งเศส ครอบคลุมพื้นที่สวนใหญเดียวกับที่แนวซีกฟรีดเคยตั้งอยูในมหาสงครามครั้งกอน การเสริมแนวปองกันจะทําใหเราสามารถยึดพรมแดนไวไดดวยกําลังพลที่นอยลง และปลอยกองพลไปรวมการรณรงคทางตะวันออกที่อาจเกิดขึ้น"
 fortify_the_westwall_short_desc: "§Lเพิ่มแนวปองกันของเวสตวัลดวยการสรางปอมใหม§!"
 operation_weserubung: "ปฏิบัติการเวเซอรอือบุง"
 operation_weserubung_desc: "แรเหล็กจากสแกนดิเนเวียมีความสําคัญยิ่งตออุตสาหกรรมสงครามของเยอรมนี และเสนทางลําเลียงของเราตองไดรับการปกปอง เราจะชิงตัดหนาการยึดครองนอรเวยของฝายสัมพันธมิตรดวยการรุกรานของเราเอง ในฐานะกาวหนึ่งสูเปาหมายนี้ เดนมารกก็ตองถูกยึดครองเชนกัน ซึ่งยังมีประโยชนเพิ่มเติมคือปดทะเลบอลติกจากศัตรูของเรา"
 operation_weserubung_short_desc: "§Lรุกรานเดนมารกและนอรเวยเพื่อรักษาการคาแรเหล็กจากสแกนดิเนเวีย§!"
 operation_tannenbaum: "ปฏิบัติการทันเนนบาวม"
 operation_tannenbaum_desc: "สวิตเซอรแลนดคือสิวบนใบหนาของยุโรป และชาวสวิสเองก็เปนเพียงสาขาที่หลงทางของชนชาติเยอรมัน พวกเขาตองถูกผนวกรวมเขากับมหาเยอรมนีไมวาตองแลกดวยอะไร จงบุกทะลวงที่มั่นบนภูเขาของพวกเขาและยุติชาติจอมปลอมนี้เสีย"
 operation_tannenbaum_short_desc: "§Lรุกรานสวิตเซอรแลนดและผนวกเขากับไรชเยอรมัน§!"
 operation_felix: "ปฏิบัติการเฟลิกซ"
 operation_felix_desc: "ปฏิบัติการของฝายสัมพันธมิตรในเมดิเตอรเรเนียนตองถูกจํากัดดวยการปดชองแคบยิบรอลตาร แตเราไมอาจพึ่งพาสเปนใหสนับสนุนเปาหมายของเราได เราตองบีบบังคับดวยการเปดฉากการรุกรานเต็มรูปแบบขามเทือกเขาพิเรนีส ทั้งสเปนและโปรตุเกสตองถูกยึดครองเพื่อปกปองปกตะวันตกเฉียงใตของเยอรมนี"
 operation_felix_short_desc: "§Lรุกรานคาบสมุทรไอบีเรียและยึดยิบรอลตารใหได§!"
 operation_ikarus: "ปฏิบัติการอิคารุส"
 operation_ikarus_desc: "เพื่อสนับสนุนปฏิบัติการของครีกสมารีเนอในแอตแลนติกเหนือ OKW ไดอนุมัติการรุกรานไอซแลนด การควบคุมเกาะนี้จะขยายระยะปฏิบัติการของเราไปทางตะวันตกไกลขึ้น และนาจะชวยเราอยางมากในการทําใหยุทธการแอตแลนติกจบลงอยางประสบความสําเร็จ"
 operation_ikarus_short_desc: "§Lรุกรานไอซแลนดเปนกาวหนึ่งสูชัยชนะในยุทธการแอตแลนติก§!"
 operation_herkules: "ปฏิบัติการเฮอรคิวลีส"
 operation_herkules_desc: "ฐานทัพอังกฤษบนมอลตาเปนหนามยอกอกเรามานานเกินไปแลว มันยังคงขัดขวางปฏิบัติการในแอฟริกาเหนือ และตราบใดที่เกาะนี้ยังอยูภายใตการควบคุมของฝายสัมพันธมิตร เมดิเตอรเรเนียนตอนกลางก็จะยังคงเปนพื้นที่ชวงชิง เราตองยึดเกาะนี้ใหได"
 operation_herkules_short_desc: "§Lยึดมอลตาเพื่อไมใหอังกฤษใชเปนฐานทัพ§!"
 fall_grun: "แผนเขียว"
 fall_grun_desc: "หลบเลี่ยงแนวปองกันหลักของอังกฤษดวยการตั้งหัวหาดในไอรแลนด เมื่อเกาะนี้อยูภายใตการควบคุมของเรา อังกฤษจะถูกโดดเดี่ยวมากยิ่งขึ้น จากฐานใหมนี้ กองกําลังทางอากาศและทางเรือของเราจะถลมอังกฤษผูดื้อรั้นจนยอมสยบ!"
 fall_grun_short_desc: "§Lดําเนินการรุกรานไอรแลนดเพื่อโดดเดี่ยวอังกฤษและไดฐานทัพเรือใหม§!"
 operation_seelowe: "ปฏิบัติการสิงโตทะเล"
 operation_seelowe_desc: "ชัยชนะของเราทางตะวันตกจะมั่นคงไดก็ดวยการยึดครองบริเตนใหญทั้งหมดเทานั้น เราตองดําเนินปฏิบัติการยกพลขามชองแคบและตั้งหัวหาดบนแผนดินอังกฤษ จากนั้นหัวหอกของเราจะกระจายเขาสูชนบทและรุกตอไปจนกวาจะยึดครองบริเตนไดทั้งหมด จักรวรรดิของพวกเขาก็จะลมสลายเหมือนบานไพ รุกไปขางหนา!"
 operation_seelowe_short_desc: "§Lเปดฉากการยกพลขึ้นบกขนาดใหญในบริเตนและยึดลอนดอน§!"
 operation_barbarossa: "ปฏิบัติการบารบารอสซา"
 operation_barbarossa_desc: "เรากําลังจะเริ่มตนการรณรงคทางทหารที่ยิ่งใหญที่สุดในประวัติศาสตร นั่นคือการรุกรานสหภาพโซเวียต! ที่ใดที่นโปเลียนลมเหลว เราจะประสบความสําเร็จ จงรุกขามพรมแดน โอบลอมและทําลายกําลังทหารโซเวียตที่รวมตัวกัน และรุกตอไปทางตะวันออก ปฏิบัติการจะถือวาสําเร็จหากเรายึดมอสโกไดและสามารถตั้งแนวหนาตามแนวแกนอารฮันเกลสค-อัสตราฮันได มุงสูตะวันออก!"
 operation_barbarossa_short_desc: "§Lรุกรานสหภาพโซเวียตและไปใหถึงแนวอารฮันเกลสค-อัสตราฮัน§!"
 operation_gertrude: "ปฏิบัติการเกอรทรูด"
 operation_gertrude_desc: "การยึดครองตุรกีจะทําใหเราเคลื่อนกําลังจากยุโรปไปยังตะวันออกกลางไดงายขึ้น และจะทําใหเราควบคุมทางเขาเพียงทางเดียวสูทะเลดําไดอยางสมบูรณ ไมวาในกรณีใดก็ตาม ตองไมปลอยใหชาวเติรกเขาขางฝายสัมพันธมิตร!"
 operation_gertrude_short_desc: "§Lรักษาทางเขาสูทะเลดําดวยการรุกรานตุรกี§!"
 operation_mungo: "ปฏิบัติการมุงโก"
 operation_mungo_desc: "กองกําลังของเราไดเดินตามรอยอเล็กซานเดอรมหาราชมาถึงลุมแมนํ้าสินธุแลว บัดนี้เราอยูในตําแหนงที่จะชิงอัญมณีแหงจักรวรรดิไปจากอังกฤษ เริ่มการรุกรานอินเดียเต็มรูปแบบ!"
 operation_mungo_short_desc: "§Lเริ่มการรุกรานบริติชอินเดียและพิชิตเพื่อปตุภูมิ§!"
 operation_knickerbocker: "ปฏิบัติการนิกเกอรบอกเกอร"
 operation_knickerbocker_desc: "เราตองนําสงครามขามมหาสมุทรแอตแลนติก กอนที่จะเปดการรุกรานชายฝงตะวันออกของอเมริกาได เราตองมีฐานทัพสําหรับรวมกําลัง ครีกสมารีเนอไดเตรียมแผนรุกรานทั้งนิวฟนดแลนดและเบอรมิวดา เกาะใดเกาะหนึ่งก็เหมาะกับจุดประสงคของเรา"
 operation_knickerbocker_short_desc: "§Lยึดฐานทัพในแอตแลนติกเพื่อเตรียมรุกรานอเมริกา§!"
 operation_buffel: "ปฏิบัติการบึฟเฟล"
 operation_buffel_desc: "เพื่อรักษาความเปนผูนําของเยอรมนีในระเบียบโลกใหมที่เราสรางขึ้น ตองดําเนินการรุกรานแผนดินใหญของสหรัฐอเมริกาเต็มรูปแบบ เปาหมายสําคัญทางการเมืองและอุตสาหกรรมตามแนวชายฝงตะวันออกเฉียงเหนือของอเมริกาตองถูกยึดครองโดยทันที รวมถึงทําเนียบขาวในวอชิงตัน"
 operation_buffel_short_desc: "§Lรุกรานอเมริกาเหนือและยึดครองเปาหมายสําคัญบนชายฝงตะวันออกของสหรัฐฯ§!"
 deutsches_afrikakorps: "กองพลแอฟริกาเยอรมัน"
 deutsches_afrikakorps_desc: "เราตองชวยเหลืออิตาลีในการตอสูกับอังกฤษในแอฟริกาเหนือ สงกองกําลังสํารวจไปยังลิเบียและสนับสนุนการรุกของอิตาลีสูอียิปต!"
 deutsches_afrikakorps_short_desc: "§Lสนับสนุนปฏิบัติการของอิตาลีในแอฟริกาเหนือดวยการสงกําลังขึ้นบกในลิเบีย§!"
 fall_weiss: "แผนขาว"
 fall_weiss_desc: "การรุกรานโปแลนดตองเริ่มขึ้น เปาหมายทางยุทธศาสตรที่สําคัญไดแก วอรซอ คราคูฟ และลวุฟ เรายังตองเปดฉนวนทางบกเชื่อมกับกองกําลังของเราในปรัสเซียตะวันออกโดยเร็วที่สุด ขณะเดียวกัน พรมแดนที่ติดกับฝรั่งเศสตองไดรับการปองกันไมวาตองแลกดวยอะไร อยาปลอยใหโมเซลลันทหรือเวือรทเทมแบรกตกเปนของฝรั่งเศส!"
 fall_weiss_short_desc: "§Lรุกรานโปแลนดขณะยึดแนวเวสตวัลตานฝรั่งเศสไว§!"
 fall_gelb: "แผนเหลือง"
 fall_gelb_desc: "แนวมาจิโนทําใหการโจมตีฝรั่งเศสโดยตรงขามพรมแดนของเรามีตนทุนสูงมาก OKH จึงเตรียมการรุกรานผานกลุมประเทศตํ่าแทน โดยอาศัยแนวคิดจากแผนชลีฟเฟน หากเปนไปได ใหโดดเดี่ยวและทําลายกองกําลังฝายสัมพันธมิตรที่ขามเขาสูเบลเยียมดวยการตอกลิ่มแยกพวกเขาออกจากสวนที่เหลือของฝรั่งเศส"
 fall_gelb_short_desc: "§Lหลบเลี่ยงแนวมาจิโนดวยการรุกรานและยึดครองกลุมประเทศตํ่า§!"
 fall_rot: "แผนแดง"
 fall_rot_desc: "บัดนี้เราอยูในตําแหนงที่จะเปดการรุกในแนวรบกวางเขาสูฝรั่งเศสแลว รุกลงใต บุกขามแมนํ้ามารน และยึดปารีส ชายฝงชองแคบก็ตองถูกยึดครองเชนกัน และแนวมาจิโนควรถูกโอบลอมและทําลายเมื่อมีโอกาส"
 fall_rot_short_desc: "§Lรุกลงใตเขาสูฝรั่งเศส ครั้งนี้แมนํ้ามารนจะหยุดเราไมได!§!"
 goal_construction1: "พัฒนาอุตสาหกรรมของเรา"
 goal_construction1_desc: "กองทัพสมัยใหมตองอาศัยเศรษฐกิจที่แข็งแกรงเพื่อจัดหาอาวุธ เครื่องบิน เรือ และรถถังที่ครองสมรภูมิในสงครามยุคปจจุบัน"
 goal_construction1_short_desc: "§Lกองทัพที่ทรงพลังตองอาศัยกําลังทางอุตสาหกรรม จงสรางโรงงานเพิ่ม!§!"
 goal_construction2: "พัฒนาอุตสาหกรรมของเรา"
 goal_construction2_desc: "กองทัพสมัยใหมตองอาศัยเศรษฐกิจที่แข็งแกรงเพื่อจัดหาอาวุธ เครื่องบิน เรือ และรถถังที่ครองสมรภูมิในสงครามยุคปจจุบัน"
 goal_construction2_short_desc: "§Lกองทัพที่ทรงพลังตองอาศัยกําลังทางอุตสาหกรรม จงสรางโรงงานเพิ่ม!§!"
 goal_construction3: "พัฒนาอุตสาหกรรมของเรา"
 goal_construction3_desc: "กองทัพสมัยใหมตองอาศัยเศรษฐกิจที่แข็งแกรงเพื่อจัดหาอาวุธ เครื่องบิน เรือ และรถถังที่ครองสมรภูมิในสงครามยุคปจจุบัน"
 goal_construction3_short_desc: "§Lกองทัพที่ทรงพลังตองอาศัยกําลังทางอุตสาหกรรม จงสรางโรงงานเพิ่ม!§!"
 goal_construction4: "พัฒนาอุตสาหกรรมของเรา"
