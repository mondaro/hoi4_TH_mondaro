 JAP_kodoha_insurgency_decisions: "วิถีจักรพรรดิ"
 JAP_kodoha_insurgency_decisions_desc: "กลุมโคโดฮะ ซึ่งเปนกลุมหนึ่งในกองทัพจักรวรรดิของเรา กําลังเคลื่อนไหวตอตานศัตรูของพวกเขา ดังเห็นไดจากการลอบสังหารนายทหารเท็ตสึซัง นางาตะ เมื่อเดือนสิงหาคม 1935 หากพวกเขาตัดสินใจลงมือในวงกวางกวานี้ ก็คงไมเกิดขึ้นจนกวาการพิจารณาคดีของนายทหารไอซาวะจะสิ้นสุดลง อาจเปนการดีที่สุดที่จะเพิ่มการรักษาความปลอดภัยรอบตัวบุคคลบางคนที่พวกเขาอางวาคุกคามโคกุไต จิตวิญญาณแหงชาติของเรา"

 JAP_aizawa_trial_ongoing: "การพิจารณาคดีของซาบูโร ไอซาวะยังดําเนินอยู"
