 UNITS_VIEW_BTN_DELETE_ORDER: "§Hลบคําสั่ง§!\n§Gคลิก§!ปุมนี้ แลวคลิกที่คําสั่งบนแผนที่ที่ตองการลบ\n§Gคลิกขวา§!ที่ปุมนี้เพื่อ§Rลบคําสั่งทั้งหมด§!ของกองทัพที่เลือกอยู"
 UNITS_VIEW_BTN_RESHAPE: "§Hโหมดแกไข§!\nกดปุมนี้เพื่อสลับโหมด หรือกด§GALT§!คางไว\n§Gคลิกขวา§!ที่หมุดปลายแผนการรบเพื่อแกไข\n§Gคลิกปุมเมาสคางไว§!ที่ลูกศรการรุกเพื่อปรับรูปทรงหรือเชื่อมกับคําสั่งอื่น\n§Gคลิกขวาคางไว§!ที่คําสั่งที่กะพริบอยูเพื่อเริ่มวาดลูกศรการรุกใหม"
 UNITS_VIEW_BTN_DRAW_OFFENCE: "§Hแนวรุก§!\n§Gคลิกขวาคางไว§!บนแผนที่เพื่อวาด§Yแนวรุก§!\nวาดแนวไดเฉพาะบนดินแดนที่คุณกําหนด§Hแนวหนา§!หรือ§Hการยกพลขึ้นบก§!ไวแลว\n\nกองพลที่ไดรับมอบหมายในแผนที่มีแนวรุกจะพยายามยึดดินแดนเพื่อเลื่อนแนวหนาไปยังแนวนั้น \n\n§Gกดปุมเมาสคางไว§!แลว§Gปลอย§!บนปุมรูปแบบการดําเนินการเพื่อเปลี่ยนรูปแบบการดําเนินแผน"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§Hแนวหนา§!\n - §Gคลิก§!ที่พรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาตลอดแนวพรมแดน\n - §Gคลิกขวาแลวลากเมาส§!บนพรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาเปนชวงที่สั้นลง\n - §Gคลิกขวาแลวลากเมาส§!ที่ปลายแนวหนาที่มีอยูเพื่อแกไข\n\nแนวหนาเปนจุดเริ่มตนของการโจมตีเขาสูดินแดนขาศึกไปยังแนวรุก และยังชวยใหคุณวางกองพลตามพรมแดนตางชาติไดอยางรวดเร็ว"
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§Hแนวหนา§!\n - §Gคลิก§!ที่พรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาตลอดแนวพรมแดน\n - §GShift + คลิก§!ที่พรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาตลอดแนวพรมแดนโดยไมมีแนวหนาของกองทัพยอย\n - §Gคลิกขวาแลวลากเมาส§!บนพรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาเปนชวงที่สั้นลง\n - §GShift + คลิกขวาแลวลากเมาส§!บนพรมแดนที่ติดกับประเทศอื่นเพื่อกําหนดแนวหนาเปนชวงที่สั้นลงโดยไมมีแนวหนาของกองทัพยอย\n - §Gคลิกขวาแลวลากเมาส§!ที่ปลายแนวหนาที่มีอยูเพื่อแกไข\n\nแนวหนาเปนจุดเริ่มตนของการโจมตีเขาสูดินแดนขาศึกไปยังแนวรุก และยังชวยใหคุณวางกองพลตามพรมแดนตางชาติไดอยางรวดเร็ว"
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§Hแนวถอย§!\n - §Gคลิกขวาแลวลากเมาส§!บนดินแดนฝายเราเพื่อวาดคําสั่งปองกันแบบ§Yใชครั้งเดียว§!\n\nแนวถอยมีประโยชนในการวางกองพลเพื่อตั้งรับ เชน หลังแมนํ้า หรือที่อื่นในดินแดนฝายเรา"
 UNITS_VIEW_BTN_AREA_DEFENSE: "§Hการปองกันพื้นที่§!\n - §Gคลิก§!ที่รัฐเพื่อเพิ่ม/นํารัฐออกจากคําสั่งของกองทัพ\nกองทัพที่มีคําสั่งนี้จะไมสามารถมีคําสั่งประเภทอื่นในเวลาเดียวกันได\n\nกองพลที่ไดรับมอบหมายใหกองทัพที่มีคําสั่งนี้จะกระจายกําลังไปทั่วพื้นที่ที่กําหนด เพื่อรักษาเมืองสําคัญ ทาเรือ หรือเปาหมายอื่น ๆ รวมถึงรับมือกับขาศึกจํานวนเล็กนอย"
 UNITS_VIEW_BTN_DRAW_NAVAL_INV: "§Hคําสั่งยกพลขึ้นบก§!\nขั้นที่ 1) §Gคลิก§!ที่จังหวัดที่ไฮไลตอยูเพื่อกําหนดจุดออกเดินทางของการยกพล\nขั้นที่ 2) §Gคลิกขวา§!ที่จังหวัดชายฝงที่ตองการยกพลขึ้นบก\nเมื่อเปดใชแผนแลว การยกพลขึ้นบกจะเริ่มเตรียมการและสํารองขบวนเรือลําเลียงจากคลังของประเทศคุณ"
 UNITS_VIEW_BTN_DRAW_PARADROP: "§Hคําสั่งสงพลรม§!\nขั้นที่ 1) §Gคลิก§!ที่ฐานทัพอากาศของเราเพื่อกําหนดจุดขึ้นบิน ฐานทัพอากาศตองมีเครื่องบินลําเลียงพรอมใช\nขั้นที่ 2) §Gคลิกขวา§!ที่จังหวัดที่อยูในระยะของเครื่องบินลําเลียงในพื้นที่ เพื่อกําหนดจุดสงลง\n§gโปรดจําไววาจะลําเลียงไดเฉพาะหนวยที่มีความสามารถพลรมเทานั้น§!"
