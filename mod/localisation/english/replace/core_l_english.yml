 NAVY_DOCKYARD_REPAIR_POLICY_INFO: "ฐานทัพเรือที่มีลําดับความสําคัญสูงกวาจะไดใชอูตอเรือเพื่อซอมแซมกอน \n\n§Gคลิก§!เพื่อเปลี่ยนลําดับความสําคัญการซอมแซม §Gคลิกขวา§!เพื่อปดหรือเปดใชอูตอเรือสําหรับการซอมแซม"
 NAVY_ALLY_DOCKYARD_REPAIR_INFO: "ฐานทัพเรือนี้อยูภายใตการควบคุมของพันธมิตร อูตอเรือที่ใชซอมแซมจะจัดหาโดยพวกเขา และมีเพียงพวกเขาเทานั้นที่เปลี่ยนการตั้งคาฐานทัพเรือได\n\n§Gคลิก§!เพื่อปดหรือเปดใชอูตอเรือสําหรับการซอมแซม"
