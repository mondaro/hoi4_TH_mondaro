 NAVY_REPAIR_POLICY_SPLIT_DESC: "ตัวเลือก§Yอนุญาตใหแยกตัว§!ชวยใหเรือที่เสียหายหนักที่สุดแยกตัวออกไปซอมที่ฐานทัพเรือใกลเคียง ขณะที่หมูเรือเฉพาะกิจสวนที่เหลือปฏิบัติภารกิจตอไป\nเรือที่แยกตัวออกมาจะเสี่ยงตอการถูกโจมตีอยางมากระหวางเดินทางกลับ\nหลังซอมแซมเสร็จ เรือจะกลับไปยังหมูเรือเฉพาะกิจที่ไดรับมอบหมาย\n\nจํานวนเรือที่แยกตัวขึ้นอยูกับการตั้งคาลําดับความสําคัญการซอมแซมและความเสียหายของเรือแตละลํา"
