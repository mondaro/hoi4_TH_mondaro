 #Poland paid content
 POL_KPP_focus: "จัดตั้งคณะรัฐมนตรีฝายซาย"
 POL_KPP_focus_desc: "KPP เปนพรรคของนักปฏิวัติที่พรอมใชมาตรการเด็ดขาดที่จําเปนเพื่อนําสังคมนิยมมาสูโปแลนด แมบางคนที่เคยภักดีตอฝายซานาเซียจะเปลี่ยนความภักดีไปแลว แตเราไมอาจไวใจใหพวกเขาเขามาอยูในคณะรัฐมนตรี และตองแทนที่ดวยสหายนักปฏิวัติของเรา"
 POL_LIT_union: "ฟนฟูเครือจักรภพ"
 POL_LIT_union_desc: "เมื่อ[Root.GetLeader]เปนกษัตริยของทั้งโปแลนดและลิทัวเนีย สิ่งที่เหลือคือการรวมเซมัสเขากับเซยมอีกครั้ง แลวเครือจักรภพโปแลนด-ลิทัวเนียจะถือกําเนิดขึ้นใหม"
 POL_a_leftist_sejm: "เซยมฝายซาย"
 POL_a_leftist_sejm_desc: "แมพรรคประชาชนโปแลนดจะดีกวาฝายซานาเซีย แตพวกสังคมประชาธิปไตยขาดความกลาที่จะทําการปฏิรูปอยางถึงรากซึ่งจําเปนตอการปลดปลอยชนชั้นกรรมาชีพแหงโปแลนดอยางแทจริง มีเพียงการนําโดยตรงของพรรคคอมมิวนิสตเทานั้นที่จะทําใหชาวโปแลนดทลายโซตรวนไดตลอดไป"
 POL_anti_imperialism: "ตอตานจักรวรรดินิยม"
 POL_anti_imperialism_desc: "การตอตานสงครามจักรวรรดินิยมเปนหลักการที่นายกยอง แตการเพียงประณามสงครามจักรวรรดินิยมนั้นไมเพียงพอ การปฏิวัติโลกจําเปนตองตอตานจักรวรรดินิยมเองดวย!"
 POL_arm_monarchist_militants: "ติดอาวุธใหกลุมติดอาวุธนิยมกษัตริย"
 POL_arm_monarchist_militants_desc: "เรารูวามีผูคนขามพรมแดนที่ปรารถนาให[Root.GetLeader]นําความสงบเรียบรอยและความรุงเรืองมาสูชาติของพวกเขา ดังที่[Root.GetLeader.GetSheHe]ไดทําใหเรา! เราตองพรอมติดอาวุธใหกลุมนิยมกษัตริยเหลานี้ เพื่อใหพวกเขาสูนํากษัตริยอันชอบธรรมขึ้นสูบัลลังก"
 POL_armia_ludowa: "อารมียา ลูโดวา"
 POL_armia_ludowa_desc: "เราไมอาจมีอาวุธเหนือกวาพวกจักรวรรดินิยมตางชาติ แตเราสามารถจัดตั้งกลุมติดอาวุธฝายซายที่พรอมสละชีพในการตอสูไดไมวาอยางไร การสถาปนาอารมียา ลูโดวาเปนกองกําลังทหารของพรรค จะทําใหเรามีกองทัพที่ภักดีตอความมุงหมายของการปฏิวัติสังคมนิยมของเราเสมอ!"
 POL_assert_eastern_claims_pavel: "ยืนยันการอางสิทธิ์ทางตะวันออก"
 POL_assert_eastern_claims_pavel_desc: "เครือจักรภพครอบคลุมหลายสวนของอดีตจักรวรรดิรัสเซีย และไมตองสงสัยเลยวาปาเวลจะถูกมองวาเปนคนทรยศหากเขาผนวกดินแดนเหลานั้น อยางไรก็ตาม จักรวรรดิรัสเซียไมมีอยูอีกแลว และเปนหนาที่ของปาเวลในฐานะฝายขาวที่จะรักษาดินแดนอดีตรัสเซียไวจากโซเวียต"
 POL_assert_western_claims: "ยืนยันการอางสิทธิ์ทางตะวันตก"
 POL_assert_western_claims_desc: "พรมแดนของโปแลนดดูจะบังเอิญละเวนดินแดนเดิมหลายแหงที่ตอมากลายเปนศูนยกลางอุตสาหกรรมขนาดใหญ จะเปนประโยชนตออุดมการณเบอรมอนตหากดินแดนเหลานั้นถูกยึดคืนมาอยูใตการควบคุมของโปแลนด"
 POL_baltic_socialism: "บังคับใชสังคมนิยมบอลติก"
 POL_baltic_socialism_desc: "เจตจํานงของชาวบอลติกถูกกดทับโดยพวกเผด็จการ นายทุน และฟาสซิสต หากกรรมกรจะปลดปลอยตนเองได ตองอาศัยการแทรกแซงโดยตรงของโปแลนด"
 POL_claim_greater_lithuania: "อางสิทธิ์มหาลิทัวเนีย"
 POL_claim_greater_lithuania_desc: "ลิทัวเนียที่เรารูจักในวันนี้เปนเพียงเงาของราชรัฐใหญลิทัวเนียในอดีต เครือจักรภพไมไดหมายถึงแคการรวมกันของโปแลนดและลิทัวเนีย แตเปนการรวมกันของชาวโปแลนด ชาวลิทัวเนีย ชาวยูเครน และชาวเบลารุส"
 POL_claim_livonia: "อางสิทธิ์ลิโวเนีย"
 POL_claim_livonia_desc: "ในหมูชาติบอลติกมีความเปนพี่นองและมิตรภาพที่ไมอาจแตกหัก และบัดนี้เมื่อเราเปนตัวแทนผลประโยชนของลิทัวเนีย เราก็สามารถอางความเปนพี่นองนั้นเปนของเรา และรวมบอลติกเขาสูจักรวรรดิที่กําลังเติบโตของเรา"
 POL_claim_prussia: "ยึดปรัสเซียตะวันออก"
 POL_claim_prussia_desc: "ปรัสเซียตะวันออกเปนถิ่นฐานของชนกลุมนอยชาวลิทัวเนียและชาวโปแลนดนับไมถวน และถึงเวลาแลวที่คนเหลานี้จะไดรวมกับสหายของพวกเขาในเครือจักรภพ"
 POL_claiming_lithuania: "ผูอางสิทธิ์แหงเครือจักรภพ"
 POL_claiming_lithuania_desc: "มีบุคคลจํานวนหนึ่งที่อางสิทธิ์ทั้งในโปแลนดและลิทัวเนียเทาเทียมกัน และจะเปนประโยชนอยางยิ่งตอความทะเยอทะยานของชาวโปแลนดทุกคนในการฟนฟูเครือจักรภพ หากเราทําเชนนั้นภายใตการปกครองของกษัตริยผูสามารถอางสิทธิ์อันศักดิ์สิทธิ์เหนือทั้งสองดินแดน"
 POL_com_independence: "เอกราช"
 POL_com_independence_desc: "เราถูก[SOV.GetNameDef]เอารัดเอาเปรียบมานานพอแลว! ถึงเวลาที่นักปฏิวัติชาวโปแลนดจะจับอาวุธขึ้นอีกครั้ง และสูเพื่อสิทธิในการปกครองตนเอง!"
 POL_committee_of_national_liberation: "คณะกรรมการปลดปลอยแหงชาติ"
 POL_committee_of_national_liberation_desc: "เราอยูในสถานะลอแหลม ติดอยูระหวางเยอรมนีและรัสเซีย ตกเปนเปาของแผนการจักรวรรดินิยมของพวกเขา การจัดตั้งคณะกรรมการปลดปลอยแหงชาติจะทําใหชาวโปแลนดที่ถูกปดลอมทุกคนมีศูนยกลางอํานาจในการจัดตั้งกิจกรรมตอตาน"
 POL_complete_the_bermontian_mission: "ทําภารกิจเบอรมอนตใหสําเร็จ"
 POL_complete_the_bermontian_mission_desc: "ภารกิจของเราที่จะสูเคียงขางฝายขาวและยึดรัสเซียคืนใหพระเจาซารถูกบดขยี้ดวยการบุกลิทัวเนียที่ลมเหลว แตบัดนี้เรามีเครือจักรภพแหงชาติตาง ๆ อันเกรียงไกรอยูใตบัญชา เราตองขึ้นมาและเผาสหภาพโซเวียตใหเปนเถาถาน!"
 royal_legitimist: "ผูนิยมราชวงศอันชอบธรรม"
 POL_cossack_king: "กษัตริยคอสแซค"
 POL_cossack_king_desc: "ในป 1918 เจาชาย คอสแซค และขุนศึก ปาเวล เบอรมอนด-อาวาลอฟ ไดรับคําสั่งใหสูเพื่อฝายขาวในรัสเซีย แตกลับหันกองทัพเบอรมอนตไปโจมตีลิทัวเนียและลัตเวียแทน แมจะไมเปนที่นิยมและไมใชคาทอลิก แตเบอรมอนดไดรับการสนับสนุนจากชาวเยอรมัน และมีโอกาสที่กองทัพรัสเซียขาวจะหนุนหลังเขา"
 POL_demand_LIT_pavel: "เรียกรองลิทัวเนีย"
 POL_demand_LIT_pavel_desc: "คราวกอน กองทัพเบอรมอนตไมสามารถผนวกลิทัวเนียได แตบัดนี้เมื่อมีกองทัพโปแลนดหนุนหลัง ปาเวลอยูในฐานะที่ทรงอํานาจถึงขนาดอาจขมขูใหชาวลิทัวเนียยอมมอบตัวเองใหบนพานทองได กษัตริยไมคุกเขาวิงวอนขออาณาจักร แตทรงยึดมาตามสิทธิ์ของพระองค"
 POL_demand_slovakia_pavel: "เรียกรองสโลวาเกีย"
 POL_demand_slovakia_pavel_desc: "เชโกสโลวาเกียออนแอ และดินแดนของเธอเปนที่อิจฉาของเพื่อนบาน หากชาวเยอรมันยึดซูเดเทินไดเพียงแคเอยปากขอ เราจะยึดสโลวาเกียแบบเดียวกันไมไดหรือ?"
 POL_demand_slovakia: "เรียกรองสโลวาเกีย"
 POL_demand_slovakia_desc: "เชโกสโลวาเกียออนแอและดินแดนของเธอเปนที่อิจฉาของเพื่อนบาน หากเยอรมนียึดซูเดเทินไดเพียงแคขอ เราจะยึดสโลวาเกียแบบเดียวกันไมไดเชียวหรือ?"
 POL_dismantle_capitalist_empires: "ทลายจักรวรรดินายทุน"
 POL_dismantle_capitalist_empires_desc: "ทุนนิยมคือศัตรูโดยธรรมชาติของสังคมนิยม และบัดนี้เมื่อการปฏิวัติไดรับชัยชนะในโปแลนดแลว เราตองใชสถานะของเราเปนเครื่องมือทลายจักรวรรดินิยมแบบทุนนิยมทั่วโลก เริ่มจากการทลายจักรวรรดิอาณานิคมทั้งหมดใหสิ้นซาก"
 POL_dismantle_fascist_empires: "ทลายจักรวรรดิฟาสซิสต"
 POL_dismantle_fascist_empires_desc: "ลัทธิฟาสซิสตคือโรครายของโลก พวกมันฉวยใชภาษาของการตอสูทางชนชั้นเพื่อยุยงใหชนชั้นกรรมาชีพหันไปตอตานสหายขามพรมแดน พวกมันคือศัตรูคูอาฆาตของ KPP และตองถูกกําจัดโดยเร็ว"
 POL_dismantle_soviet_empire: "ทลายจักรวรรดิ[SOV.GetAdjective]"
 POL_dismantle_soviet_empire_desc: "[GetDismantleSovietEmpireDesc]"
 POL_dismantle_soviet_empire_desc_default: "[SOV.GetNameDefCap]เรียกตนเองวาสหพันธของสาธารณรัฐอิสระ แตแทจริงแลวก็เปนแคจักรวรรดิรัสเซียที่เคลือบสีแดงไว เชนเดียวกับจักรวรรดิทั้งปวง มันคือศัตรูของโปแลนด"
 POL_dismantle_soviet_empire_desc_alt: "สีแดงไดหลุดลอกออกจากสหภาพโซเวียตแลว และบัดนี้เราเห็นธาตุแทของ[SOV.GetNameDef] ความทะเยอทะยานแบบจักรวรรดิของพวกเขาจึงชัดเจนยิ่งกวาที่เคย ในฐานะศัตรูของโปแลนด มันตองถูกจัดการกอนจะสายเกินไป"
 POL_expand_lithuanian_shipyards: "ขยายอูตอเรือลิทัวเนีย"
 POL_expand_lithuanian_shipyards_desc: "เราจะไมถูกจํากัดอยูแคทาเรือกดือเนียและกดัญสกอีกตอไป เมื่อลิทัวเนียอยูใตการควบคุมของเรา เราก็ไดรับโอกาสที่จะขยายขีดความสามารถทางเรืออยางมหาศาล และแขงขันเพื่อครองความเปนใหญในทะเลบอลติก"
 POL_anti_capitalist_revolution: "การปฏิวัติตอตานทุนนิยม"
 POL_anti_capitalist_revolution_desc: "แมจะมีความเยายวนที่จะรักษาความสัมพันธของโปแลนดกับโลกตะวันตกไวเพื่อความสะดวกทางการทูต แตเราไมอาจขายอุดมการณของเราใหนายทุนตางชาติได การปฏิวัติโลกจําเปนตองตอสูกับชนชั้นกระฎมพี และเราตั้งใจจะทําเชนนั้น ไมวาพวกเขาจะเรียกตนเองวา “ฟาสซิสต” หรือ “ประชาธิปไตย” ก็ตาม"
 POL_assemble_the_regency_council: "จัดตั้งคณะผูสําเร็จราชการ"
 POL_assemble_the_regency_council_desc: "พระราชบัญญัติ 5 พฤศจิกายนคือคํามั่นของฝายมหาอํานาจกลางที่จะปลดปลอยราชอาณาจักรโปแลนดที่เสรีและเปนเอกราชขึ้นจากเถาถานของจักรวรรดิรัสเซีย คณะผูสําเร็จราชการที่ตั้งขึ้นหากษัตริยไมไดกอนจะมอบอํานาจทั้งหมดใหปวซุตสกี แตเมื่อฝายซานาตจาไมอาจจัดตั้งรัฐบาลที่มั่นคงได บางทีถึงเวลาแลวที่เราจะฟนฟูคณะผูสําเร็จราชการเพื่อหากษัตริยอันชอบธรรมใหโปแลนด"
 POL_fulfil_fifth_of_november: "ปฏิบัติตามพระราชบัญญัติ 5 พฤศจิกายน"
 POL_fulfil_fifth_of_november_desc: "เมื่อคณะผูสําเร็จราชการกลับมารวมตัวกันแลว ถึงเวลาเปดประตูตอนรับผูสมัครเชื้อพระวงศทุกพระองคที่ประสงคจะอางสิทธิ์ในราชบัลลังกโปแลนด"
 POL_governorate_livonia: "เขตปกครองลิโวเนีย"
 POL_governorate_livonia_desc: "เมื่อพาเวลบุกลิทัวเนียและลัตเวียเมื่อหลายปกอน เขาอยูในฐานะที่จะทวงคืนเขตปกครองลิโวเนียมาเปนศักดินาสวนตัว บัดนี้ลัตเวียออนแอและพลังของโปแลนดก็หนุนหลังพาเวลอยู แทบไมมีอะไรขัดขวางการฟนฟูเขตปกครองลิโวเนียได"
 POL_greater_commonwealth: "มหาเครือจักรภพ"
 POL_greater_commonwealth_desc: "ความทะเยอทะยานของเครือจักรภพไปไกลเกินกวาพรมแดนทางประวัติศาสตรของราชอาณาจักรที่ลมสลายไปนานแลว เครือจักรภพในหัวใจของชาวโปแลนดคือมหาอํานาจจักรวรรดิอันยิ่งใหญ จักรวรรดิพหุวัฒนธรรมที่เจิดจรัสจากทะเลจรดทะเล!"
 POL_greater_polish_SSR: "มหาสาธารณรัฐสังคมนิยมโซเวียตโปแลนด"
 POL_greater_polish_SSR_desc: "ถึงตอนนี้เราไดพิสูจนแลววาเปนประโยชนตอสหภาพโซเวียต และคงเปนการรอบคอบที่จะขอใหคืนการควบคุมโปแลนดตะวันออกแกชาติของเรา พรอมคาตอบแทนบางสวนสําหรับการรับใชอันยิ่งใหญที่เรามอบใหแกการปฏิวัติ"
 POL_hohenzollern: "ราชวงศโฮเอนโซลเลิรน"
 POL_hohenzollern_desc: "เยอรมนีเคยวาดภาพใหราชวงศโฮเอนโซลเลิรนปกครองราชอาณาจักรโปแลนดใหม และความสัมพันธทางการทูตอันใกลชิดของเรากับโรมาเนียก็ทําใหราชวงศโรมาเนียเปนผูสมัครในอุดมคติที่จะเปนกษัตริยของโปแลนด"
 POL_institute_royal_guards: "จัดตั้งราชองครักษ"
 POL_institute_royal_guards_desc: "เมื่อพระมหากษัตริยประทับบนบัลลังกแลว สิ่งสําคัญยิ่งคือเราตองคัดเลือกเฉพาะยอดฝมือในกองทัพโปแลนดมาทําหนาที่ถวายความปลอดภัยแดพระมหากษัตริยอันเปนที่รักของเรา"
 POL_internal_romanian_support: "แสวงหาการสนับสนุนภายในโรมาเนีย"
 POL_internal_romanian_support_desc: "กษัตริยแหงโรมาเนียกําลังนําประเทศไปสูปากเหวแหงความพินาศดวยการใชจายเกินตัวและการทุจริต เปนเรื่องนาเสียดาย แตกษัตริยมีไฮอาจไมมีทางเลือกอื่นนอกจากรวมมือกับฝายที่ตอตานพระบิดา เพื่อใหโรมาเนียอยูรอดตอไป"
 POL_king_michaels_coup: "รัฐประหารของกษัตริยมีไฮ"
 POL_king_michaels_coup_desc: "ถึงเวลาแลวที่กษัตริยมีไฮจะยึดอํานาจจากรัฐบาลโรมาเนียชุดปจจุบัน และขึ้นครองราชยตามสิทธิ์โดยกําเนิด จากที่เคยเปนพันธมิตร โปแลนดและโรมาเนียจะรวมเปนหนึ่งเดียวกันแลว"
 POL_king_of_lithuania: "ราชอาณาจักรลิทัวเนีย"
 POL_king_of_lithuania_desc: "ถึงเวลาเหมาะแลว ประชาชนชาวลิทัวเนียถูกปลุกปนใหตอตาน[LIT.GetLeader] และผูสนับสนุนกษัตริยนิยมก็พรอมยื่นขอเรียกรองตอรัฐบาล ดวยการสนับสนุนของโปแลนด พวกเขาจะมองวา[Root.GetLeader]คือผูปกครองที่พระเจาทรงแตงตั้ง"
 POL_dabrowszczacy: "ดอมบรอฟชัตซี"
 POL_dabrowszczacy_desc: "มีกองพลนอยนานาชาติของอาสาสมัครชาวโปแลนดที่สูเพื่อขบวนการสังคมนิยมและประชาธิปไตยทั่วโลก และเมื่อรัฐบาลสังคมนิยมขึ้นปกครองโปแลนดแลว เราก็สามารถนําการสนับสนุนของรัฐโปแลนดมาหนุนหลังอาสาสมัครผูกลาเหลานี้ได"
 POL_leftist_economics: "สถาปนาเศรษฐกิจสังคมนิยม"
 POL_leftist_economics_desc: "ในเศรษฐกิจทุนนิยม ทุนดํารงอยูเพื่อรับใชชนชั้นนํา เมื่อนักสังคมนิยมขึ้นเปนรัฐบาลแลว เราตองปรับเศรษฐกิจใหรับใชความตองการของชาวนาผูหลั่งเลือดเพื่อการปฏิวัตินี้"
 POL_lithuanian_rail: "ทางรถไฟโปแลนด-ลิทัวเนีย"
 POL_lithuanian_rail_desc: "การเดินทางภายในสหภาพตองเปนเรื่องงายดาย หากโปแลนดและลิทัวเนียจะรวมเปนหนึ่งอยางแทจริง การเชื่อมทางรถไฟของเราจะชวยปรับปรุงหวงโซเสบียงและขีดความสามารถทางอุตสาหกรรมไดอยางมาก"
 POL_lower_class_education: "การศึกษาสําหรับชนชั้นลาง"
 POL_lower_class_education_desc: "การเขาถึงการศึกษาถูกกีดกันดวยความมั่งคั่งและสิทธิพิเศษมานานเกินไป แตภายใตสังคมนิยม ทุนที่บุคคลครอบครองจะไมมีความหมายตอระบบการศึกษาอีกตอไป"
 POL_merge_civilian_industries: "รวมอุตสาหกรรมพลเรือน"
 POL_merge_civilian_industries_desc: "เมื่อชาติของเรารวมเปนหนึ่งแลว ก็ไมสมเหตุสมผลที่ลิทัวเนียจะสรางเพื่อลิทัวเนียเทานั้น และโปแลนดจะสรางเพื่อโปแลนดเทานั้น อุตสาหกรรมของเราตองเปนหนึ่งเดียวเพื่อความเจริญของชาติ"
 POL_merge_internal_governments: "รวมรัฐบาลภายใน"
 POL_merge_internal_governments_desc: "แมโปแลนดและโรมาเนียจะมีพระมหากษัตริยองคเดียวกันเปนประมุขแลว แตทั้งสองยังแยกจากกันดวยรัฐบาลภายใน เราตองมอบที่นั่งผูแทนในเซยมใหชาวโรมาเนียทองถิ่น และรวมหนวยงานบริหารอื่น ๆ ทั้งหมดของโรมาเนียเขากับหนวยงานที่เทียบเทาของโปแลนด"
 POL_merge_the_arms_industries: "รวมอุตสาหกรรมอาวุธ"
 POL_merge_the_arms_industries_desc: "ผูผลิตอาวุธของโปแลนดและลิทัวเนียตางผลิตอาวุธแยกกันมาหลายทศวรรษ แตบัดนี้เมื่อชาติของเราเปนหนึ่งเดียว เราจึงมีโอกาสที่จะทําใหอุตสาหกรรมมีความเชี่ยวชาญเฉพาะดาน และสรางความรวมมือระหวางโรงงานของโปแลนดและลิทัวเนีย"
 POL_non_discriminatory_recruitment: "ยกเลิกการเกณฑทหารแบบเลือกปฏิบัติ"
 POL_non_discriminatory_recruitment_desc: "ชาวคาทอลิกโปแลนดมีสัดสวนในกองทัพมากเกินจริงเนื่องจากนโยบายของซานาตจา นับจากนี้ไป เราจะเปดที่ใหผูรักชาติหรือนักสังคมนิยมทุกคนที่พรอมหันปากกระบอกปนสูกับลัทธิฟาสซิสต"
 POL_organize_the_peasants_strike: "จัดการนัดหยุดงานของชาวนา"
 POL_organize_the_peasants_strike_desc: "โปแลนดถูกแบงแยกดวยเลือดของชาวนา ทั่วชนบทของโปแลนด ชาวนากําลังหัวรุนแรงขึ้นจากการถูกรัฐบาลละเลยอยางมุงราย [POL.GetLeader] ยอมผลักดันการนัดหยุดงานไปสูความรุนแรงอยางหลีกเลี่ยงไมได ดังนั้นเราตองเตรียมชนชั้นกรรมาชีพใหลุกขึ้นตอตานผูกดขี่"
 POL_polish_path_to_socialism: "หนทางสูสังคมนิยมแบบโปแลนด"
 POL_polish_path_to_socialism_desc: "นับตั้งแตกอตั้งในป 1918 พรรคคอมมิวนิสตโปแลนดถูกทําใหเปนแบบบอลเชวิค และถึงตอนนี้สมาชิกจํานวนมากก็เปนเพียงลูกสมุนของสตาลิน อยางไรก็ตาม มาเรีย โคชุตสกา และสมาชิกคนสําคัญอีกหลายคนของ KPP ตองการกําจัดกลุมสตาลินนิสตออกจากพรรคและทําใหโปแลนดหันมาตอตานมอสโก"
 POL_polish_peoples_republic: "สาธารณรัฐสังคมนิยมโซเวียตโปแลนด"
 POL_polish_peoples_republic_desc: "[GetSovietPolishPeoplesRepublicDesc]"
 POL_polish_peoples_republic_desc_default: "โปแลนดเปนหนึ่งในรัฐสมาชิกสหภาพโซเวียตที่มีอุตสาหกรรมกาวหนาและมีกําลังของตนเองมากที่สุด จึงเปนเรื่องธรรมดาที่เราจะไดรับอํานาจปกครองตนเองในระดับที่สูงกวา"
 POL_polish_peoples_republic_desc_alt: "โปแลนดโดดเดนกวาประเทศอื่น ๆ ในเขตอิทธิพลของ[SOV.GetAdjective] ดวยระดับอุตสาหกรรมที่คอนขางกาวหนาและอุดมการณที่แตกตาง จึงเปนเรื่องธรรมดาที่เราจะไดรับอํานาจปกครองตนเองในระดับที่สูงกวา"
 POL_preserve_baltic_independence: "รักษาเอกราชของบอลติก"
 POL_preserve_baltic_independence_desc: "แมรัฐบาลบอลติกสวนใหญจะไมเปนประชาธิปไตยและเปนทุนนิยม แตพวกเขาก็เผชิญภัยคุกคามจากทั้งตะวันออกและตะวันตกเชนเดียวกับเรา และการรักษาเผด็จการกระฎมพีของพวกเขาไวยอมดีกวาปลอยใหตกเปนเหยื่อความทะเยอทะยานแบบจักรวรรดินิยมของเยอรมนีและรัสเซีย"
 POL_preserve_bougoise_democracy: "รักษาประชาธิปไตยแบบกระฎมพี"
 POL_preserve_bougoise_democracy_desc: "แมเปาหมายสูงสุดของ KPP คือการเผยแพรสังคมนิยมไปทั่วโลก แตในยามมืดมนนี้ ลัทธิฟาสซิสตที่ผงาดขึ้นทั่วโลกทําใหเราจําเปนตองสูเคียงขางนายทุนเพื่อรักษาประชาธิปไตยแบบกระฎมพีไว มีเพียงในโลกที่ปลอดจากลัทธิฟาสซิสตเทานั้นที่เงื่อนไขทางวัตถุจะเอื้อตอการปฏิวัติสังคมนิยมโลก"
 POL_press_for_liberia: "กดดันเรื่องไลบีเรีย"
 POL_press_for_liberia_desc: "ในป 1932 รัฐบาลโปแลนดและไลบีเรียตกลงใหไลบีเรียอยูใตการดูแลของโปแลนด ชาวอเมริกันมองการมีอยูของเราในไลบีเรียวาเปนการดูหมิ่น แตชาตินี้เปราะบางและตองการความคุมครองจากโปแลนดอยางยิ่ง"
 POL_pressure_for_the_west: "กดดันเพื่อดินแดนตะวันตก"
 POL_pressure_for_the_west_desc: "พรมแดนที่แนชัดระหวางโปแลนดกับเยอรมนีเปนประเด็นถกเถียงในหลายทศวรรษหลังมหาสงคราม ในการถกเถียงนี้ เยอรมนีรักษาศูนยกลางอุตสาหกรรมสวนใหญไวได ทิ้งใหโปแลนดแทบไมมีอะไรที่เรียกวาอุตสาหกรรมได เมื่อดินแดนตะวันออกถูกยกให[SOV.GetNameDef]แลว ดินแดนเหลานั้นตองถูกชดเชยดวยไซลีเซียและพอเมอเรเนีย"
 POL_pro_allied_government: "แตงตั้งรัฐบาลที่นิยมฝายสัมพันธมิตร"
 POL_pro_allied_government_desc: "สภาทองถิ่นเซยมิกจํานวนมากสนับสนุนใหโปแลนดอยูขางโลกตะวันตกตอไปอยูแลว และการเลื่อนผูแทนเหลานี้ขึ้นสูตําแหนงที่สูงขึ้นในการปกครองจะทําใหเราเปนมิตรตออุดมการณของฝายสัมพันธมิตรอยางเปดเผยยิ่งขึ้น"
 POL_push_for_ruthenia: "รุกผานรูทีเนีย"
 POL_push_for_ruthenia_desc: "เครือขายทางรถไฟของยูเครนและเบลารุสถูกละเลยอยางนาเศรา แตดินแดนเหลานี้ก็เปนสวนหนึ่งของเครือจักรภพไมตางจากดินแดนอื่น เราตองลงทุนในทางรถไฟฝงตะวันออก หากจะรุกฝาโซเวียตไปและทวงคืนสิ่งที่เปนของเรา"
 POL_reopen_the_maritime_and_colonial_league: "ฟนฟูสันนิบาตอาณานิคมโปแลนด"
 POL_reopen_the_maritime_and_colonial_league_desc: "ความทะเยอทะยานที่จะใหโปแลนดมีบทบาทขามทวีปสิ้นสุดลงเมื่อโปแลนดไมสามารถไดปาเลสไตนมา แตดวยความสัมพันธใกลชิดใหมกับโลกตะวันตกและรัฐบาลสังคมนิยม เราจึงอยูในฐานะที่จะใชทุนของเราปลดปลอยคนงานในอาณานิคมจากนักลาอาณานิคมชาวยุโรป ภายใตการบริหารใหมของโปแลนด"
 POL_restoration_of_the_royal_sejm: "ฟนฟูเซยมแหงราชอาณาจักร"
 POL_restoration_of_the_royal_sejm_desc: "ในสมัยราชอาณาจักรโปแลนด เซยมคือผูรับใชที่ภักดีตอประชาชนและราชบัลลังก เมื่อฟนฟูเซยมและทําลายสาธารณรัฐที่สองแลว เราตองทําใหแนใจวาสภาเซยมิกทั้งหมดภักดีตอราชบัลลังก และจะไมพยายามนําโปแลนดกลับสูการปกครองแบบซานาตจา"
 POL_restore_bermontians: "ฟนฟูกองทัพแบรมอนต"
 POL_restore_bermontians_desc: "กองทัพอาสาสมัครรัสเซียตะวันตกเปนกองกําลังที่นําโดยพาเวล แบรมอนต-อาวาลอฟ ผูมุงฟนฟูระบอบกษัตริยและความสงบเรียบรอยในดินแดนฝงตะวันตกของรัสเซีย แมตอนนี้โปแลนดจะเปนความสนใจหลักของพาเวล แตการทําลายคอมมิวนิสตรัสเซียก็ยังคงเปนภารกิจของแบรมอนต และชาวรัสเซียขาวทุกคนควรถือเปนหนาที่ที่จะสูเพื่อกองทัพแบรมอนต!"
 POL_restore_poland_hungary: "ฟนฟูโปแลนด-ฮังการี"
 POL_restore_poland_hungary_desc: "หลายศตวรรษกอน ราชบัลลังกโปแลนดและฮังการีเคยรวมเปนหนึ่ง และชาติก็ไดครองความเปนใหญในยุโรปตะวันออก บัดนี้เมื่อทรานซิลเวเนียและนิตราอยูใตการควบคุมของโปแลนด สิ่งเดียวที่ขัดขวางเราจากการทวงคืนมรดกของโปแลนด-ฮังการีก็คือการที่ฮังการียังคงดํารงอยู"
 POL_royal_dictatorship: "สถาปนาเผด็จการโดยกษัตริย"
 POL_royal_dictatorship_desc: "เซยมมีอํานาจบริหารที่จะยับยั้งการตัดสินใจใด ๆ ของกษัตริย และแมสิ่งนี้จะเปนประโยชนตอเรามาจนถึงตอนนี้ แตโลกกําลังเปลี่ยนไป และเราไมอาจปลอยใหระบบราชการมาขวางสิทธิ์อันศักดิ์สิทธิ์ในการปกครองของกษัตริยได"
 POL_seek_german_alignment: "แสวงหาการเขาขางเยอรมนี"
 POL_seek_german_alignment_desc: "พาเวลผูชื่นชม[GER.GetLeader]และเปนนักชาติสังคมนิยม ไดทําใหตนเปนที่รูจักในฐานะพันธมิตรของมหาอํานาจฟาสซิสตทั่วโลก สิ่งที่เหลืออยูคือการเขาหาพวกฟาสซิสตและดูวาพวกเขาจะยินดีตอนรับโปแลนดภายใตการควบคุมของแบรมอนตเขาสูฝายอักษะหรือไม"
 POL_social_commonwealth: "เครือจักรภพแหงสาธารณรัฐสังคมนิยม"
 POL_social_commonwealth_desc: "แมความทะเยอทะยานใด ๆ ที่จะฟนฟูโปแลนด-ลิทัวเนียจะขัดกับเปาหมายของการปฏิวัติของเรา แตก็ปฏิเสธไมไดวาโปแลนด ลิทัวเนีย และอดีตรัฐสมาชิกเครือจักรภพอีกหลายรัฐมีประวัติศาสตรและศัตรูรวมกัน เมื่อพิจารณาการตอสูรวมกันของเรา เครือจักรภพใหมจึงเปนสิ่งจําเปน เครือจักรภพที่ใหความสําคัญกับความปลอดภัยและการปลดปลอยคนงานภายใตสังคมนิยมเปนอันดับแรก"
 POL_soviet_industry: "[GetSovietIndustrialInvestmentTitle]"
 POL_soviet_industry_default: "การลงทุนทางอุตสาหกรรมของโซเวียต"
 POL_soviet_industry_alt: "การขยายตัวทางอุตสาหกรรม"
 POL_soviet_industry_desc: "[GetSovietIndustrialInvestmentDesc]"
 POL_soviet_industry_desc_default: "ขอดีของการเขารวมสหภาพโซเวียตและการเขาเปนสวนหนึ่งของสหภาพแหงรัฐอันทรงพลัง คือเรามีมหาอํานาจทางอุตสาหกรรมคอยหลอเลี้ยงชาติดวยการลงทุน แมอุตสาหกรรมสวนหนึ่งของเราจะทุมเทเพื่อความเจริญของสหภาพโซเวียต แตการลงทุนทางอุตสาหกรรมที่เราไดรับตอบแทนก็เพิ่มขีดความสามารถในการผลิตของเราอยางมาก"
 POL_soviet_industry_desc_alt: "แมจะตองทนอยูใตการกดขี่ของ[SOV.GetNameDef] แตเราก็ตองพัฒนาอุตสาหกรรมของเราเองตอไป มันอาจเปนประโยชนหากวันหนึ่งเราตัดสินใจทําลายพันธนาการ"
 POL_soviet_military_staff: "คณะเสนาธิการทหารโซเวียต"
 POL_soviet_military_staff_desc: "เมื่อมีการสถาปนาสาธารณรัฐโปแลนดที่สอง นายพลฝายซายชาวโปแลนดจํานวนมากไดหนีไปยังสหภาพโซเวียตเพื่อสูเพื่อการปฏิวัติโลกตอไป บัดนี้เมื่อรัฐบาลที่ฝกใฝโซเวียตขึ้นสูอํานาจ ผูลี้ภัยผูกลาเหลานี้ก็กลับบานไดแลว"
 POL_support_colonial_workers_strikes: "สนับสนุนการนัดหยุดงานของคนงานในอาณานิคม"
 POL_support_colonial_workers_strikes_desc: "คนงานในอาณานิคมของยุโรปตองทนทุกขและดิ้นรน อึดอัดอยูใตนํ้าหนักของเจานายเพื่อคํ้าจุนจักรวรรดิที่ไมมอบสิ่งใดใหพวกเขาเลย คนงานเหลานี้ขาดเงื่อนไขทางวัตถุที่จําเปนในการปลดปลอยตนเอง และหากเราจะนํามาซึ่งการปฏิวัติโลกอยางแทจริง เราตองติดอาวุธใหผูถูกกดขี่ลุกขึ้นตอตานชนชั้นนําอาณานิคม"
 POL_support_monarchism_in_LIT: "สนับสนุนกษัตริยนิยมในลิทัวเนีย"
 POL_support_monarchism_in_LIT_desc: "เชนเดียวกับโปแลนด ลิทัวเนียควรจะไดเลือกกษัตริยองคใหม แตตางจากโปแลนด การเลือกตั้งอันเปนธรรมนั้นถูกเยอรมนีประกาศวาไมชอบธรรม แตเราสามารถมอบผูปกครองที่เขมแข็งตามที่สัญญาไวใหชาวลิทัวเนียได ผูที่จะปกปองลิทัวเนียจากจักรวรรดินิยมเยอรมัน"
 POL_warsaw_to_crimea_railway: "ทางรถไฟวอรซอ-ไครเมีย"
 POL_warsaw_to_crimea_railway_desc: "ในความทะเยอทะยานที่จะปกครองจากทะเลจรดทะเล สิ่งสําคัญยิ่งคือดินแดนทุกแหงที่เรายึดไดตองหลอมรวมเปนสวนหนึ่งของชาติอยางสมบูรณ พรมแดนธรรมชาติของเราทอดยาวจากเหนือจรดใต ตะวันออกจรดตะวันตก และความทะเยอทะยานที่จะเชื่อมไครเมียเขากับทางรถไฟของเราจะทําใหเรายึดกุมภูมิภาคนี้ไดมั่นคง"
 POL_elect_a_PSL_leader: "เลือกผูนําจาก PSL"
 POL_elect_a_PSL_leader_desc: "แมพวกคอมมิวนิสตจะแยงชิงอํานาจในรัฐบาลของเรา แตกองทัพสนับสนุน PSL หากเราทําใหการนําของเรามั่นคงตอนนี้ KPP ก็จะไรอํานาจที่จะยึดกุมรัฐบาล"
 POL_invest_in_the_peasantry: "ลงทุนในชุมชนชาวนา"
 POL_invest_in_the_peasantry_desc: "ชาวนาสูเพื่อเราดวยคํามั่นวาเราจะปรับปรุงชีวิตในชนบท และเราตั้งใจจะทําตามคํามั่นนั้น เครือขายทางรถไฟและโครงสรางพื้นฐานที่เหมาะสมจะทําใหไมมีใครถูกทิ้งไวขางหลัง"
 POL_seek_an_alliance_with_kaiser: "แสวงหาพันธมิตรกับไกเซอร"
 POL_seek_an_alliance_with_kaiser_desc: "ราชอาณาจักรโปแลนดดํารงอยูไดเพราะพระราชบัญญัติ 5 พฤศจิกายน ซึ่งเปนคําประกาศของไกเซอรแหงเยอรมนีที่สัญญาวาจะแยกราชอาณาจักรโปแลนดใหมออกจากคองเกรสโปแลนดที่รัสเซียยึดครอง ยังไมรูวาไกเซอรมีแผนอยางไรตอโปแลนด แตบางทีการเตือนความจําเบา ๆ ถึงคําประกาศของจักรวรรดิเยอรมันอาจหวานเมล็ดพันธุแหงพันธมิตรที่ไมนาเปนไปได"
 POL_surrender_the_east: "ยกดินแดนตะวันออกให"
 POL_surrender_the_east_desc: "สหภาพโซเวียตมองวาโปแลนดตะวันออกเปนสวนอันชอบธรรมของยูเครนและเบลารุส ซึ่งสหภาพโซเวียตอางวาเปนตัวแทน บางทีการยกดินแดนเหลานี้ใหโซเวียตอาจทําใหเราเปนพันธมิตรกันได"
 POL_woo_morges_staff: "เชิญแนวรวมมอรฌ"
 POL_woo_morges_staff_desc: "การกอกบฏของเราจะไปไมถึงไหนหากปราศจากการสนับสนุนจากกองทัพอยางนอยบางสวน แมสวนใหญยังคงภักดีตอหนึ่งในสามปกของซานาตจา แตแนวรวมมอรฌสนใจที่จะฟนฟูประชาธิปไตยในโปแลนด และอาจยินดีรวมมือกับเราเพื่อเปาหมายนี้"
 POL_ease_sanationist_tensions: "ผอนคลายความตึงเครียดกับฝายซานาตจา"
 POL_ease_sanationist_tensions_desc: "สมาชิกแนวรวมมอรฌหลายคนดํารงตําแหนงทางทหารระดับสูงในซานาตจา และบางทีเราอาจโนมนาวใหพวกเขาใชทุนทางการเมืองยับยั้งการปราบปรามการนัดหยุดงานของรัฐบาล เพื่อซื้อเวลาอันมีคาใหขบวนการของเราเติบโตในโปแลนด"
 POL_arm_peasant_militia: "ติดอาวุธใหกองกําลังอาสาชาวนา"
 POL_arm_peasant_militia_desc: "ชาวนาโปแลนดจะปลดปลอยตนเองจากผูกดขี่ไดเพียงทางเดียว นั่นคือการจับอาวุธขึ้นสูกับชนชั้นกระฎมพี การใชทุนทางการเมืองของแนวรวมมอรฌขโมยยุทโธปกรณจากซานาตจา จะทําใหเราเริ่มสงครามดวยกองกําลังชาวนาที่ไดรับการฝกและติดอาวุธอยางเต็มที่"
 POL_state_national_council: "สภาแหงชาติของรัฐ"
 POL_state_national_council_desc: "ฝายซานาตจามีรัฐธรรมนูญเดือนเมษายนไวประมวลความเชื่อของตน และนานเกินไปแลวที่เรายังไมทําเชนเดียวกัน สภาแหงชาติของรัฐจะถูกจัดตั้งขึ้นเพื่อรวบรวมนักการเมืองสังคมนิยมจากทั่วโปแลนดมาแกไขกฎหมายปฏิกิริยาของซานาตจา"
 POL_communal_governance: "การปกครองแบบชุมชน"
 POL_communal_governance_desc: "สงครามชาวนาแมจะจําเปน แตก็สรางความเสียหายและความหายนะแกชนบทของเรา บัดนี้ถึงเวลาฟนฟู และการจัดตั้งรัฐบาลชุมชนทองถิ่นในชุมชนชนบทจะเยียวยาบาดแผลจากสงคราม"
 POL_raise_the_black_madonna: "ชูพระแมดํา"
 POL_raise_the_black_madonna_desc: "พระแมดําเปนภาพศักดิ์สิทธิ์ของพระนางมารียพรหมจารีที่เปนที่นิยมในหมูชนชั้นลางของโปแลนด ในฐานะผูพิทักษโปแลนดและชนชั้นลาง การใชพระแมดําเปนสัญลักษณของขบวนการจะทําใหประชาชนรูวาพระนางมารียพรหมจารีอยูขางเราเมื่อถึงเวลา"
 POL_reassemble_the_sejm: "เรียกประชุมเซยมอีกครั้ง"
 POL_reassemble_the_sejm_desc: "เมื่อวิถีประชาธิปไตยไดรับการฟนฟูในโปแลนดแลว ถึงเวลาที่เราจะเชิญสมาชิกสภาเซยมิกที่ถูกซานาตจาขับไลออกไปกลับเขาสูรัฐบาล"
 POL_empower_the_morges: "เสริมอํานาจแนวรวมมอรฌ"
 POL_empower_the_morges_desc: "แนวรวมมอรฌไดพิสูจนแลววาเปนพันธมิตรของประชาธิปไตย และทุกสิ่งที่เราทําสําเร็จมาจนถึงตอนนี้คงเปนไปไมไดหากปราศจากการสนับสนุนของพวกเขา บางทีนายพลเหลานี้อาจสมควรไดรับสิทธิ์ในการบัญชาเหลาทัพของตนเอง"
 POL_ROM_join_allies: "เขารวมฝายสัมพันธมิตร"
 POL_ROM_join_allies_desc: "เมื่อราชบัลลังกโปแลนดและโรมาเนียรวมเปนหนึ่งแลว เราตองหันความสนใจทางการทูตกลับไปยังพันธมิตรของเราทางตะวันตก"
 POL_anti_blitz_tactics: "ยุทธวิธีตอตานสายฟาแลบ"
 POL_anti_blitz_tactics_desc: "เยอรมนีหมายจะบดขยี้ชาติของเราดวยกําลังที่รวดเร็วและทวมทน แตบางทีเครื่องจักรสงครามนี้อาจเปนแคปนใหญแกวที่แตกงาย มนุษยสามารถถูกบังคับใหเผชิญอันตรายโดยไมถอย และรถถังจะนาเกรงขามก็ตอเมื่อเราไมไดเตรียมรับมือ"
 POL_anti_fascist_military_desc: "แมรัฐบาลสังคมนิยมจะทําใหชาวโปแลนดแตกแยกกันบาง แตการที่เราอยูขางโลกตะวันตกทําใหเรามีเปาหมายรวมกันในทุกขั้วการเมือง นั่นคือการตอตานลัทธิฟาสซิสตและจักรวรรดินิยมเยอรมันอยางแข็งกราว ดวยการสนับสนุนและโฆษณาชวนเชื่อ กองทัพของเราจะแข็งแกรงและเปนหนึ่งเดียวเมื่อเผชิญลัทธิฟาสซิสตที่กําลังผงาดทั่วโลก"
 POL_anti_germans_abroad: "สนับสนุนฝายตอตานเยอรมนีในตางแดน"
 POL_anti_germans_abroad_desc: "รัฐบอลติกคือพี่นองของเราในการตอสูกับลัทธิบอลเชวิคและลัทธินาซี แมพวกเขาจะกระจัดกระจาย นาสงสาร และออนแอ แตดวยรัฐบาลโปแลนดที่เขมแข็งหนุนหลัง เราก็อาจปลุกปนรัฐเหลานี้ใหกลายเปนเครื่องจักรสงครามที่ใชการได"
 POL_assert_eastern_claims: "ยืนยันการอางสิทธิ์ทางตะวันออก"
 POL_assert_eastern_claims_desc: "โปแลนดในสภาพปจจุบันเปนเพียงเงาของจักรวรรดิที่เคยเปน โปแลนดไมไดเปนเพียงที่ที่ชาวโปแลนดบังเอิญอาศัยอยู แตโปแลนดคือมรดกของเครือจักรภพ และเราตองฟนฟูพรมแดนเกาทางตะวันออก"
 POL_assurance_of_loyalty: "กําหนดพรมแดนหลังสงคราม"
 POL_assurance_of_loyalty_desc: "เยอรมนีไดยึดดินแดนสําคัญไปจากเรา และความพยายามของเราในการสนับสนุนสงครามก็เปนที่ประจักษ เรากมหัวมานานพอแลว ถึงเวลาเรียกรองคาชดเชยสําหรับสิ่งที่เรายอมสละไป"
 POL_beck_ribbentrop: "กติกาสัญญาเบ็ค-ริบเบนทรอพ"
 POL_beck_ribbentrop_desc: "ไมใชความลับเลยวาเยอรมนีกระหายจะผนวกกดัญสกและอดีตดินแดนเยอรมันอื่น ๆ แตบางทีสิ่งนี้อาจไมจําเปนตองเกิดขึ้นผานความขัดแยงนองเลือด บางทียูแซฟ เบ็คอาจสรางทางออกทางการทูตใหกับขอพิพาทที่ชายแดนของเราได"
 POL_declare_independence: "ประกาศเอกราช"
 POL_declare_independence_desc: "เยอรมนีเปนเครื่องมือที่มีประโยชนในการยุติภัยคุกคามของ[SOV.GetNameDef] แตบัดนี้ถึงเวลาที่เราจะหันไปเลนงานผูที่หมายจะเห็นโปแลนดถูกลามโซ ถึงเวลาแลวที่จะโจมตีไรช"
 POL_demand_LIT: "เรียกรองลิทัวเนีย"
 POL_demand_LIT_desc: "รัฐบาลลิทัวเนียแตกแยก ออนแอ และมีลักษณะเดนคือการนําดานเศรษฐกิจและการทหารที่ยํ่าแย รัฐโปแลนดไมสมบูรณหากขาดราษฎรของตน และบางทีเพียงแคเรียกรอง ชาวลิทัวเนียก็อาจยอมรวมชาติ"
 POL_demand_pomerania: "เรียกรองพอเมอเรเนีย"
 POL_demand_pomerania_desc: "พอเมอเรเนียเคยเปนสวนหนึ่งของรัฐโปแลนด และบัดนี้ยังคงอยูในมือเยอรมนี แมนอยคนจะเชื่อวาเรามีโอกาส แตเราตองทอยลูกเตาและยึดสิ่งที่เปนของเรา"
 POL_divide_lit: "แบงแยกลิทัวเนีย"
 POL_divide_lit_desc: "เราตองการฟนฟูเครือจักรภพ เยอรมนีตองการเมเมิล บางทีเราอาจบรรลุขอตกลงรวมกันและยื่นคําขาดรวมตอชาวลิทัวเนียได"
 POL_empower_falangist_militants: "เสริมพลังนักรบฟาลังกา"
 POL_empower_falangist_militants_desc: "ในหมูฝายฟาลังกามีองคกรกึ่งทหารจํานวนหนึ่งที่กําลังติดอาวุธเพื่อเตรียมรับศึกที่หลีกเลี่ยงไมไดกับพวกคอมมิวนิสต ดวยการสนับสนุนจากรัฐบาล ผูกระตือรือรนเหลานี้จะเติบโตเปนกองกําลังติดอาวุธที่นาเกรงขามของพรรคฟาลังกา"
 POL_falangist_international: "ฟาลังกาสากล"
 POL_falangist_international_desc: "การยืนหยัดตอตานลัทธินาซีและลัทธิฟาสซิสตอิตาลีทําใหเราอยูในสถานะที่เปราะบาง แตเราตองแสวงหาพันธมิตรในการตอสูกับเยอรมนี บางทีการนําเสนอลัทธิฟาลังกาเปนทางเลือกอาจทําใหเรากอตั้งพันธมิตรของชาติที่มีความคิดเหมือนกันได"
 POL_force_polish_upper_class: "สงเสริมชนชั้นสูงชาวโปแลนด"
 POL_force_polish_upper_class_desc: "ในฐานะชาติอายุนอยที่เพิ่งไดรับอิสรภาพ ชาวโปแลนดจํานวนมากอยูเพียงในชั้นลางทางเศรษฐกิจของสังคม ชาติของเราจะอยูรอดไมไดหากเราไมสรางชนชั้นนําที่ไดรับการฝกฝนแทบตั้งแตเกิดใหบริหารประเทศ"
 POL_german_staff: "ฟอลคสดอยทเชอร เซลบสทชุทซ"
 POL_german_staff_desc: "โปแลนดมีชนกลุมนอยชาวเยอรมันจํานวนมาก และแมเยอรมนีจะหมายใชชายหนุมเหลานี้ตอตานเรา แตความรวมมือกับเยอรมนีในปจจุบันอาจทําใหชุมชนชาวเยอรมันในโปแลนดเปนมิตรตออุดมการณของเรามากขึ้น"
 POL_german_training: "คณะเสนาธิการทหารเยอรมัน"
 POL_german_training_desc: "“หุนสวน” ชาวเยอรมันของเราปดบังความลับทางทหารไวอยางมิดชิด แตบางทีการเชิญใหพวกเขามาดูแลกิจการทหารภายในบางสวนของเรา อาจทําใหพวกเขาไมมีทางเลือกนอกจากตองเผยความลับทางทหารบางอยางใหเรา"
 POL_integrate_greater_kashubia: "ผนวกรวมพอเมอเรเนีย"
 POL_integrate_greater_kashubia_desc: "ชาวคาชูเบียนผูเปนชนชาติสลาฟมองวาพอเมอเรเนียทั้งหมดคือพรมแดนอันชอบธรรมของชาติตน และชาวโปแลนดจํานวนมากก็มองวาเปนดินแดนอันชอบธรรมของโปแลนดเชนกัน เมื่อดินแดนอยูในมือเราแลว เราเพียงแคผนวกรวมเขากับรัฐบาลของเรา แลวเยอรมนีตะวันออกก็จะกลายเปนโปแลนดตะวันตก"
 POL_integrate_the_endecja: "ดึงเอ็นเดตสยาเขารวม"
 POL_integrate_the_endecja_desc: "ขณะที่ปกซีอูเดมกีของพรรคชาติประชาธิปไตยกําลังเจรจาจัดตั้งรัฐบาลผสมกับซานาตจา แตพรรคสวนใหญยังคงคัดคาน การเชิญสมาชิกคนสําคัญของเอ็นเดตสยาเขาสูรัฐบาลอาจทําใหเราจัดตั้งรัฐบาลที่เปนหนึ่งเดียวภายใตชาตินิยมโปแลนดได"
 POL_integrate_the_falanga: "ดึงฟาลังกาเขารวม"
 POL_integrate_the_falanga_desc: "ONR-ฟาลังกาเปนองคกรที่ใชความรุนแรงและสรางความวุนวาย แตลัทธิชาตินิยมที่เพิ่มขึ้นในรัฐบาลอาจดึงดูดใหฝายฟาลังกามารวมกับเราเพื่ออนาคตของโปแลนด"
 POL_invite_the_baltics: "เชิญรัฐบอลติก"
 POL_invite_the_baltics_desc: "ในฐานะชาติที่ประชากรสวนใหญเปนคาทอลิกและเสี่ยงตอการรุกรานของบอลเชวิค รัฐบอลติกจึงเปนพันธมิตรโดยธรรมชาติของอุดมการณฟาลังกาและตองไดรับการปกปอง"
 POL_invite_the_lowlands: "เชิญกลุมประเทศตํ่า"
 POL_invite_the_lowlands_desc: "แมลัทธิฟาลังกาจะอยูชายขอบทางการเมืองในเบเนลักซ แตการลงทุนเวลาและทรัพยากรในระดับปานกลางอาจทําใหมันกลายเปนกระแสหลักมากพอที่จะเปนพันธมิตรกับประเทศเหลานั้นได"
 POL_konfederacja_narodu: "คอนเฟเดรัตสยา นาโรดู"
 POL_konfederacja_narodu_desc: "คอนเฟเดรัตสยา นาโรดูเปนกลุมเล็ก ๆ ของนักชาตินิยมโปแลนดที่ตอตานความพยายามใด ๆ ของเยอรมนีที่จะยึดครองโปแลนด บางทีการประกาศวาเรามีผลประโยชนในการตอตานเยอรมนี อาจทําใหนักรบเหลานี้มารวมอุดมการณกับเรา"
 POL_nationalist_constitution: "รัฐธรรมนูญชาตินิยม"
 POL_nationalist_constitution_desc: "รัฐธรรมนูญเดือนเมษายนยังไมอาจทําใหอัตลักษณโปแลนดมั่นคงได แตสมาชิกบางสวนของพรรคชาติประชาธิปไตยและพรรคฟาลังกาไดเสนอการสนับสนุนในการแกไขรัฐธรรมนูญ เพื่อใหอัตลักษณของชาติอยูเหนือสิ่งอื่นใด"
 POL_polish_shock_battallions: "อูแดเชนีออเว บาตาลีโอนือ คาดรอเว"
 POL_polish_shock_battallions_desc: "อูแดเชนีออเว บาตาลีโอนือ คาดรอเว เปนกองพันจูโจมที่ไดรับการฝกเปนพิเศษ และเปนกองกําลังติดอาวุธของคอนเฟเดรัตสยา นาโรดู ที่พรอมสละชีพเพื่อไมใหวอรซอตกอยูในมือศัตรู"
 POL_underground_conscripts: "ทหารเกณฑใตดิน"
 POL_underground_conscripts_desc: "การเกณฑทหารจากเครือขายของรัฐใตดินโปแลนดจะชวยเพิ่มขีดความสามารถในการรบของกองทหารเราตอผูกดขี่ไดอยางมาก"
 POL_prepare_german_line: "เตรียมแนวปองกันเยอรมนี"
 POL_prepare_german_line_desc: "พรมแดนติดเยอรมนีคือสวนที่เปราะบางที่สุดของชาติเรา หากเราจะรักษาวอรซอไวไมใหตกอยูในมือเยอรมนี เราตองเผชิญหนาพวกเขาโดยตรงที่ชายแดน และหัวเราะเยาะขณะที่พวกเขาพยายามทําลายเจตจํานงของเรา"
 POL_privatize_education: "ยึดกิจการตางชาติ"
 POL_privatize_education_desc: "แมนักลงทุนตางชาติจะเปนประโยชนตอเราอยางมาก แตกิจการที่พวกเขากอตั้งจะเหมาะสมกวามากหากอยูในมือชาวโปแลนด เรื่องนี้จะทําใหเจาของเดิมไมพอใจ แตก็เปนการกระทําเพื่อความรักชาติที่จําเปน"
 POL_radicalize_poles_in_germany: "ปลุกระดมนักรบชาวโปแลนดในเยอรมนี"
 POL_radicalize_poles_in_germany_desc: "มีชนกลุมนอยชาวโปแลนดอยูทั่วเยอรมนีที่พรอมจะถูกปลุกใหหัวรุนแรง บางทีหากเราเปดเผยใหพวกเขารูถึงแผนการที่เยอรมนีมีตอโปแลนด พวกเขาอาจถูกปลุกปนใหลุกขึ้นติดอาวุธและพรอมรวมอุดมการณกับเรา"
 POL_reach_out_to_underground_state: "ยื่นมือหารัฐใตดิน"
 POL_reach_out_to_underground_state_desc: "รัฐใตดินโปแลนดดําเนินการอยางลับ ๆ อยูหลังประตูที่ปดสนิท การติดตอและใหการสนับสนุนพวกเขาอาจทําใหวันหนึ่งเราไดบดขยี้อดีตเจานายของเรา"
 POL_reassert_silesian_claims: "ยืนยันการอางสิทธิ์ไซลีเซียอีกครั้ง"
 POL_reassert_silesian_claims_desc: "ชะตากรรมของไซลีเซียเปนประเด็นพิพาทใหญในชวงตนของสาธารณรัฐโปแลนด และรัฐบาลในเวลานั้นตกลงยอมยกไซลีเซียสวนใหญให และพอใจกับไซลีเซียตอนบนที่คอนขางเล็ก รัฐบาลที่เขมแข็งคงไมยอมออนขอเชนนั้น และการอางสิทธิ์ของเราตองไดรับการยืนยัน"
 POL_reopen_national_elections: "เปดการเลือกตั้งทั่วประเทศอีกครั้ง"
 POL_reopen_national_elections_desc: "เปาหมายของเอ็นเดตสยาคือการฟนฟูประชาธิปไตยในโปแลนด ขณะเดียวกันก็ทําใหแนใจวารัฐบาลรับใชผลประโยชนของชาตินิยมโปแลนด เราตองเปดการเลือกตั้งอีกครั้ง แตในรูปแบบที่พรรคที่ไมรักชาติไมอาจมีชื่ออยูในบัตรลงคะแนน"
 POL_request_autonomous_status: "ขอสถานะปกครองตนเอง"
 POL_request_autonomous_status_desc: "เรากําลังอึดอัดอยูใตนํ้าหนักของอิทธิพลเยอรมนี เราตองขออํานาจปกครองตนเองทางอุตสาหกรรมมากขึ้น หากเราจะมีอนาคตใด ๆ เลย"
 POL_riot_of_37: "จลาจลวอรซอ"
 POL_riot_of_37_desc: "ซานาตจาจะไมมีวันยอมถายโอนอํานาจใหฝายฟาลังกาอยางสันติ แตอิทธิพลของฟาลังกากําลังเติบโตเกินกวาที่ซานาตจาจะควบคุมได การเดินขบวนอยางรุนแรงเพียงครั้งเดียวในวอรซออาจเพียงพอที่จะทําใหฟาลังกาไดควบคุมชาติโดยตรง"
 POL_sideline_the_sanacja: "กันซานาตจาออกไป"
 POL_sideline_the_sanacja_desc: "ฟาลังกาและเอ็นเดตสยามีอิทธิพลในรัฐบาลโปแลนดมากพอที่หากทั้งสองรวมมือกันใกลชิดยิ่งขึ้น ฝายซานาตจาอาจสูญเสียทุนทางการเมืองไปมาก และเปดชองใหถูกรัฐประหารได..."
 POL_siodemki: "หลอมรวมรัฐธรรมนูญ"
 POL_siodemki_desc: "ซานาตจาสนับสนุนรัฐธรรมนูญเดือนเมษายน ขณะที่เอ็นเดตสยาตองการแทนที่ดวยฉบับของตน เมื่อพรรคของเรารวมมือกันแลว เราไมอาจปลอยใหเกิดความสับสนอีกตอไป และตองตกลงหลอมรวมวิสัยทัศนที่แขงขันกันเหลานี้เพื่ออนาคตของสาธารณรัฐโปแลนด"
 POL_state_catholicism: "คาทอลิกประจํารัฐ"
 POL_state_catholicism_desc: "อัตลักษณคาทอลิกเปนแกนแทของอุดมการณฟาลังกา ดวยเหตุนี้ ศาสนจักรและรัฐจึงตองเปนหนึ่งเดียวกัน"
 POL_support_falangists_in_the_americas: "สนับสนุนฟาลังกาในทวีปอเมริกา"
 POL_support_falangists_in_the_americas_desc: "ทวีปอเมริกาเต็มไปดวยขบวนการฟาลังกา สวนใหญอยูในประเทศละตินอเมริกา การขยายพันธมิตรของเราเขาสูทวีปอเมริกาจําเปนไมเพียงเพื่อรักษาผลประโยชนของฟาลังกาทั่วโลก แตยังเพื่อปกปองสหายของเราจากอิทธิพลอเมริกันดวย"
 POL_support_global_falangism: "สนับสนุนลัทธิฟาลังกาทั่วโลก"
 POL_support_global_falangism_desc: "เราไมไดโดดเดี่ยวในการตอสูเพื่อนําลัทธิฟาลังกามาสูชาติของเรา มีอาสาสมัครทั่วโปแลนดที่ตองการสนับสนุนขบวนการฟาลังกาทั่วโลก และรัฐควรสนับสนุนบุคคลเหลานี้"
 POL_the_national_commonwealth: "เครือจักรภพแหงชาติ"
 POL_the_national_commonwealth_desc: "เครือจักรภพเกาคือจักรวรรดิของชาวโปแลนดที่ปกครองดินแดนและผูคนมากมาย เมื่อลิทัวเนียอยูในมือเราแลว จักรวรรดิโปแลนดก็กลับมาเกิดใหมอีกครั้ง!"
 POL_romanov: "ราชวงศโรมานอฟ"
 POL_romanov_desc: "แมจะเปนผูสมัครที่ไมนาเปนไปได แตหญิงสาวที่เรียกตนเองวาอนาสตาเซีย โรมานอฟอางวากษัตริยองคสุดทายของโปแลนดคือซารนิโคลัสที่ 2 ดังนั้นสิทธิ์ในโปแลนดของเธอจึงเปนพระบัญชาของพระเจา"
 POL_invite_exiled_nobility: "เชิญขุนนางพลัดถิ่น"
 POL_invite_exiled_nobility_desc: "แมขุนนางรัสเซียจํานวนมากจะปฏิเสธที่จะยอมรับเชื้อสายอันชอบธรรมของกษัตริยอนาสตาเซียของเรา แตการเชิญพวกเขากลับมาพรอมคํามั่นเรื่องบรรดาศักดิ์อาจจูงใจใหพวกเขาเปลี่ยนจุดยืน และยอมรับพระนางเปนพระธิดาแทเพียงพระองคเดียวที่ยังมีพระชนมชีพของซารนิโคลัสที่ 2"
 POL_pan_slavism: "การทวงคืนแบบแพน-สลาฟ"
 POL_pan_slavism_desc: "จนถึงตอนนี้ ขบวนการแพน-สลาฟเปนเพียงเครื่องมือที่มีประโยชนใหรัสเซียอางความเปนเจาเหนือชาวสลาฟทั้งปวง แตก็มีประโยชนในการรวมชนชาติสลาฟที่กระจัดกระจายเขาเปนรัฐเดียวกัน เชน ยูโกสลาเวียและเชโกสโลวาเกีย แลวทําไมโปแลนดจะตองเปนขอยกเวนเลา? โปแลนดไมควรฉวยประโยชนจากกระแสแพน-สลาฟนี้ดวยหรือ?"
 POL_demand_yugoslav_subjugation: "เรียกรองใหยูโกสลาเวียยอมสยบ"
 POL_demand_yugoslav_subjugation_desc: "หากความปรารถนาที่จะรวมชาวสลาฟทั้งปวงของเราจะเปนจริงได เราตองไมละเลยชาวสลาฟใต แมจะมีพรมแดนประเทศและขุนเขาสูงใหญขวางกั้น แตเราก็เปนชาวสลาฟเหมือนกัน"
 POL_claim_russia: "อางสิทธิ์รัสเซีย"
 POL_claim_russia_desc: "กษัตริยอนาสตาเซีย โรมานอฟเปนทายาทคนสุดทายที่ยังมีชีวิตอยูของซารนิโคลัสที่ 2 ดังนั้นสิทธิ์ในราชบัลลังกรัสเซียของพระนางจึงไมเพียงชอบธรรม แตยังเปนพระประสงคของพระเจา เมื่อขุนนางรัสเซียสนับสนุนการอางสิทธิ์ของพระนาง อนาสตาเซียก็พรอมทวงคืนสิทธิ์โดยกําเนิดในฐานะจักรพรรดินีแหงรัสเซีย"
 POL_proclaim_slavic_unity: "ประกาศเอกภาพแหงชาวสลาฟ"
 POL_proclaim_slavic_unity_desc: "เมื่อดินแดนรัสเซียและโปแลนดทั้งหมดอยูใตการควบคุมของเรา เราก็พรอมจะบรรลุสิ่งที่ไมมีซารองคใดเคยทําไดมากอน ดวยความยินยอมและการรับรองจากทั้งชาวรัสเซียและชาวโปแลนด เราสามารถประกาศการรวมชนชาติสลาฟเปนหนึ่งเดียวได"
 POL_niech_zyje_opor: "ในนามของโปแลนดใตดิน"
 POL_niech_zyje_opor_desc: "ทั่วทั้งโปแลนดมีเสียงกระซิบถึงการกบฏและอิสรภาพ ในโบสถและในขบวนการใตดิน ชาวโปแลนดผูกลาหาญและรักชาติตางแสวงหาการฟนฟูรัฐโปแลนดที่เปนเอกราช และดวยการยั่วยุและยุทโธปกรณที่เหมาะสม เราอาจไดเห็นวอรซอปลดปลอยตนเอง!"
 POL_niech_zyje_opor_no_mtg: "$POL_niech_zyje_opor$"
 POL_niech_zyje_opor_no_mtg_desc: "$POL_niech_zyje_opor_desc$"
 POL_morges_pact: "กติกาสัญญามอรฌ"
 POL_morges_pact_desc: "เมื่อประชาธิปไตยไดรับการฟนฟูในโปแลนดแลว ความทะเยอทะยานของแนวรวมมอรฌก็เกือบสําเร็จ สิ่งที่เหลืออยูคือการกระชับความสัมพันธกับฝรั่งเศสและฟนฟูพันธมิตรฝรั่งเศส-โปแลนด"
 POL_morges_economic_union: "กติกาสัญญาทางเศรษฐกิจฝรั่งเศส-โปแลนด"
 POL_morges_economic_union_desc: "เมื่อความสัมพันธระหวางฝรั่งเศสและโปแลนดแนนแฟนขึ้น เราก็สามารถรับประกันความชวยเหลือทางเศรษฐกิจซึ่งกันและกันในยามสงครามได"
 POL_invite_romania_to_morges: "เชิญโรมาเนียเขารวมกติกาสัญญา"
 POL_invite_romania_to_morges_desc: "พันธมิตรฝรั่งเศส-โปแลนดเพียงลําพังไมพอจะตานทานกําลังเต็มที่ของฝายอักษะได เราตองขยายพันธมิตรระหวางสองทะเล"
 POL_align_with_habsburgs: "พันธมิตรฮาพสบวรค"
 POL_align_with_habsburgs_desc: "ราชวงศฮาพสบวรคครองบัลลังกทั้งโปแลนดและฮังการี บางทีถึงเวลาแลวที่เราจะทําใหสายสัมพันธทางเครือญาติเปนพันธมิตรอยางเปนทางการ"
 POL_habsburg: "ราชวงศฮาพสบวรค"
 POL_habsburg_desc: "คารล อัลเบรชท ฟอน ฮาพสบวรค เปนผูรักชาติชาวโปแลนด และโชคดีที่เปนเชื้อพระวงศดวย บางทีเราควรเชิญเขาขึ้นครองบัลลังกที่เขาไดรับการเตรียมไวตั้งแตกําเนิด"
 POL_habsburg_monarchist_militants: "ติดอาวุธใหนักรบฝายฮาพสบวรค"
 POL_habsburg_monarchist_militants_desc: "มีผูคนในเชโกสโลวาเกียที่โหยหาการกลับมาของการปกครองแบบสืบสันตติวงศอยางเบ็ดเสร็จ เราเพียงแคมอบอาวุธให แลวพวกเขาจะผลักดันอุดมการณของฮาพสบวรคดวยกําลัง!"
 POL_join_CZE_industry: "เชื่อมอุตสาหกรรมเช็ก"
 POL_join_CZE_industry_desc: "อุตสาหกรรมของโบฮีเมียและโปแลนดขาดการเชื่อมโยงและไมเปนเอกภาพ เราตองแกไขเรื่องนี้เพื่อใชประโยชนสูงสุดจากชาติที่รวมเปนหนึ่งแลวของเรา"
 POL_join_CZE_military: "รวมกองทัพเช็ก"
 POL_join_CZE_military_desc: "อุตสาหกรรมทางทหารของเราแยกจากกันและขาดเปาหมายรวม เราตองประเมินและผนวกรวมกลุมอุตสาหกรรมของเช็กเขากับกองทัพโปแลนด"
 POL_join_CZE_rails: "รวมทางรถไฟ"
 POL_join_CZE_rails_desc: "การขนสงเสบียงผานเทือกเขาซูเดเทินเปนเรื่องสิ้นเปลืองและไรประสิทธิภาพ เราตองเชื่อมทางรถไฟในพื้นที่สําคัญ หากจะปกปองชาติใหมของเราทั้งหมด"
 POL_king_of_bohemia: "กษัตริยแหงโบฮีเมีย"
 POL_king_of_bohemia_desc: "กระแสนิยมกษัตริยในเชโกสโลวาเกียสูง เราเพียงแคผลักดันการอางสิทธิ์ในบัลลังกโบฮีเมีย แลวรัฐบาลเช็กก็จะยอมตามขอเรียกรองของเราอยางไมตองสงสัย"
 POL_kings_guard: "ราชองครักษของกษัตริย"
 POL_kings_guard_desc: "กษัตริยทรงมีความทะเยอทะยานที่จะเปนผูนําทางทหาร และจะมีใครเหมาะใหพระองคนําไปกวาราชองครักษสวนพระองคเองเลา?"
 POL_press_the_habsburg_claim: "ผลักดันการอางสิทธิ์ของฮาพสบวรค"
 POL_press_the_habsburg_claim_desc: "ฮังการีไรกษัตริยมานานเกินไป และอารชดยุกออทโท ฟอน ฮาพสบวรค ก็ยังไมมีบัลลังกเปนของตนเอง เราตองผลักดันการอางสิทธิ์ในบัลลังกของพระญาติ และสถาปนาการปกครองของฮาพสบวรคในยุโรป!"
 POL_reclaim_west_slavia: "ทวงคืนสลาเวียตะวันตก"
 POL_reclaim_west_slavia_desc: "ชาวคาชูเบียน ชาวโพลาเบียน และชาวซอรบก็เปนชาวสลาฟตะวันตกเชนกัน แตจํานวนมากยังคงอยูนอกพรมแดนและพนอิทธิพลของเรา หากเราจะเปนผูพิทักษชาวสลาฟตะวันตก เราตองปกปองชาวสลาฟตะวันตกทุกคน"
 POL_restore_the_diet_of_galicia: "ฟนฟูสภากาลิเซีย"
 POL_restore_the_diet_of_galicia_desc: "สภากาลิเซียและโลโดเมเรียเปนตัวแทนการปกครองของฮาพสบวรคเหนือโปแลนด และบัดนี้เมื่อฮาพสบวรคประทับบนบัลลังกของเรา ก็ดูสมควรที่จะฟนฟูสภานี้ขึ้นเปนสภาแหงโปแลนด"
 POL_royal_hussars: "กอตั้งทหารมาฮุสซารหลวง"
 POL_royal_hussars_desc: "ทหารมาฮุสซารติดปกเปนหนึ่งในทหารที่โดงดังที่สุดของโปแลนด และแมยุคแหงการรบแบบฮุสซารจะผานพนไปนานแลว แตการรบดวยทหารมายังคงแข็งแกรงในโปแลนด และตองการเพียงการสนับสนุนเล็กนอยก็จะเปนที่อิจฉาของทั่วโลก"
 POL_royal_officer_corps: "กองนายทหารหลวง"
 POL_royal_officer_corps_desc: "ในฐานะทั้งกษัตริยและนายพล คารล อัลเบรชทเปนแบบอยางอันโดดเดนของสิ่งที่สุภาพบุรุษชาวโปแลนดพึงเปน บางทีนายทหารทุกนายของเราควรไดรับการฝกในศิลปะแหงสงครามเชนเดียวกับกษัตริยของเรา นั่นคือในสนามเพลาะ"
 POL_soldier_king: "กษัตริยนักรบ"
 POL_soldier_king_desc: "กษัตริยของเราทรงปรารถนาจะสูเพื่อประเทศในแนวหนา แตในฐานะผูปกครองของเรา เราไมอาจปลอยใหพระองคตกอยูในอันตรายถึงชีวิตเชนนั้นได บางทีการถวายตําแหนงจอมพลอาจทําใหพระองคเปนสัญลักษณแหงความเปนหนึ่งเดียวของชาติในยามวิกฤต พรอมกับสนองความกระหายในการรบของพระองค"
 POL_support_monarchy_in_CZE: "สนับสนุนกษัตริยนิยมในเชโกสโลวาเกีย"
 POL_support_monarchy_in_CZE_desc: "การปกครองของฮาพสบวรคเหนือเชโกสโลวาเกียกําลังเลือนลางกลายเปนความทรงจําอันหางไกลอยางรวดเร็ว แตบัดนี้เมื่อฮาพสบวรคประทับบนบัลลังกของเราและอัตลักษณโปแลนดยืนหยัดอยางแข็งแกรง เราจึงอยูในฐานะที่จะสงเสริมอัตลักษณสลาฟตะวันตกและผลักดันการอางสิทธิ์ของฮาพสบวรคในโบฮีเมีย"
 POL_trust_in_the_west: "เชื่อมั่นในโลกตะวันตก"
 POL_trust_in_the_west_desc: "แมราชวงศฮาพสบวรคแหงออสเตรียจะเคยสูกับมหาอํานาจตะวันตกในมหาสงคราม แตโปแลนดเปนมิตรของโลกตะวันตก เราตองเชื่อมั่นวาพันธมิตรโพนทะเลจะยังคงชวยเหลือเรา ดังที่เคยทํามาหลายครั้งในอดีต"
