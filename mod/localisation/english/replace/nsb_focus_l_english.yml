 SOV_the_left_opposition: "ฝายคานซาย"
 SOV_the_left_opposition_desc: "เปนที่ชัดเจนวาสหภาพโซเวียตไดเบี่ยงเบนออกจากเสนทางที่ใหสัญญาไว ตอนนี้ถึงกับมีการพูดถึงการสรางสังคมนิยมในประเทศเดียว ทอดทิ้งกรรมกรทั่วโลกใหเผชิญชะตากรรมเอง แทนที่จะยืนหยัดเคียงขางพวกเขา หากสหายสตาลินไมลงมือ คนอื่นก็จะลงมือแนนอน"
 SOV_the_left_opposition_tt: "เริ่มกระบวนการที่นําไปสู§Yสงครามกลางเมือง§!ใน[ROOT.GetNameDef]"
 SOV_the_fourth_international: "สากลที่สี่"
 SOV_the_fourth_international_desc: "หุนเชิดสตาลินนิสตในองคการที่เรียกวาสากลที่สามไดพิสูจนแลววาไรความสามารถโดยสิ้นเชิงในการนําการปฏิวัติไปขางหนา วิสัยทัศนคอมมิวนิสตของพวกเขาแทบไมเกี่ยวของกับทฤษฎีที่มารกซและเลนินเขียนไว แตกลับบิดเบือนความฝนถึงรัฐกรรมกรที่ควบคุมอยางเปนประชาธิปไตยใหกลายเปนฝนรายดิสโทเปย สิ่งที่เราตองการคือสากลใหมที่จะปกปองการปฏิวัติ!"
 SOV_bring_old_trotskyists_back: "นําพวกทรอตสกีสตรุนเกากลับมา"
 SOV_bring_old_trotskyists_back_desc: "ในชวงปแรก ๆ ของการปฏิวัติ มีการถกเถียงอยางดุเดือดหลายครั้งระหวางกลุมตาง ๆ ในพรรค บางคนที่ไมไดอยูในแนวทางของพรรคเสียทีเดียว เชน คารล ราเดค และเยฟเกนี เปรโอบราเชนสกี ถึงกับถูกขับออกเพราะความเห็นตางเพียงเล็กนอย บางทีการแสดงความสํานึกผิดจากสมาชิกพรรคที่รับใชมายาวนานเหลานี้อาจเพียงพอที่จะนําพวกเขากลับเขามาในพรรคได"
 SOV_bring_old_trotskyists_back_trigger_tt: "§Y$SOV_karl_radek$§! และ §Y$SOV_yevgeny_preobrazhensky$§! ถูกสตาลินกวาดลางไปแลว"
 SOV_bring_old_trotskyists_back_effect_tt: "§Y$SOV_karl_radek$§! และ §Y$SOV_yevgeny_preobrazhensky$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_organize_the_wreckers: "จัดตั้งกลุมผูบอนทําลาย"
 SOV_organize_the_wreckers_desc: "หากสตาลินและสมุนตัดสินใจสู แทนที่จะทําสิ่งที่ดีที่สุดเพื่อการปฏิวัติดวยการลาออก เราตองพรอมสู ในสถานการณสิ้นหวังเชนนั้น แมแตการกอวินาศกรรมตอทรัพยสินของประชาชนก็ตองนํามาพิจารณา เราตองทําใหมั่นใจวาจะมุงเปาเฉพาะจุดที่จําเปน และไมทําลายความสําเร็จอันยิ่งใหญของกรรมกรโซเวียต"
 SOV_organize_the_wreckers_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอวินาศกรรมอุตสาหกรรมระหวางสงครามกลางเมือง"
 SOV_integrate_smirnovs_bloc: "ผนวกกลุมของสมีรนอฟ"
 SOV_integrate_smirnovs_bloc_desc: "เรามีพวกทรอตสกีสตรุนเกาจํานวนหนึ่งที่เพิ่งถูกจับกุมและจําคุกเพราะตอตานการกดขี่แบบสตาลินนิสต ดวยคําพูดที่เลือกสรรมาอยางดีไมกี่คําตอคนที่ใช เราอาจทําใหพวกเขาไดรับการปลอยตัวและถูกเนรเทศออกนอกประเทศ ซึ่งพวกเขาจะจัดตั้งองคกรไดโดยปลอดภัยจากความหวาดระแวงทางการเมือง พวกเขาจะไมลืมวาใครชวยใหพวกเขาหนีออกมาได"
 SOV_integrate_smirnovs_bloc_tt: "§Y$SOV_ivan_smirnov$§!, §Y$SOV_ivar_smilga$§! และ §Y$SOV_aleksandr_shlyapnikov$§! จะไดรับการปลอยตัวจากคุกและถูกเนรเทศ (§Gตัวละครที่ถูกเนรเทศไมสามารถถูกกวาดลางได§!) พวกเขาจะพรอมใหแตงตั้งเปนที่ปรึกษาเมื่อสงครามกลางเมืองปะทุขึ้น\nเพิ่มการสนับสนุนฝายคานซายในสองรัฐ"
 SOV_left_eliminate_right: "กําจัดฝายขวา"
 SOV_left_eliminate_right_desc: "ในพรรคมีกลุมตาง ๆ ที่เขากันไมไดเลยโดยสิ้นเชิง หากเราจะยึดรัฐบาลและนําการปฏิวัติกลับสูเสนทาง เราไมอาจปลอยใหการแทรกแซงของพวกเขามาทําใหไขวเขว แตหาก 'สหาย' สตาลินกําลังมองหาศัตรูภายในใหตอสู เราก็อาจโยงบางคนใหเขาเขาไปตรวจสอบได..."
 SOV_left_eliminate_right_tt: "§Y$SOV_nikolay_bukharin$§!, §Y$SOV_aleksey_rykov$§! และ §Y$SOV_mikhail_tomsky$§! กลายเปนเปาหมายที่อาจถูกสตาลินกวาดลาง"
 SOV_eliminate_opposition_factionalism_tt: "ปรับ §Y$SOV_factionalism_modifier$§!:\n อัตราไดรับอํานาจทางการเมือง: §G+5%§!"
 SOV_committee_in_exile: "คณะกรรมการพลัดถิ่น"
 SOV_committee_in_exile_desc: "เราไมมีทางแนใจไดเลยวาสายตาบาคลั่งของสตาลินจะจับจองไปที่ใครตอไป เราตองเตรียมเสนทางลับและบานปลอดภัยไวลักลอบพาผูคนออกนอกประเทศ หากพบวาผูสนับสนุนของเราบางคนตกเปนเปาของการกวาดลางครั้งใหม"
 SOV_committee_in_exile_tt: "ปลดล็อกการตัดสินใจ §Y$SOV_send_supporters_abroad$§! ซึ่งชวยใหเราสงผูเห็นอกเห็นใจไปลี้ภัยตางแดน (§Gตัวละครที่ถูกเนรเทศไมสามารถถูกกวาดลางได§!) ตัวละครที่ลี้ภัยจะพรอมใชงานเมื่อสงครามกลางเมืองปะทุขึ้น"
 SOV_approach_tukhachevsky: "ทาบทามตูฮาเชฟสกี"
 SOV_approach_tukhachevsky_desc: "มิฮาอิล ตูฮาเชฟสกี เปนหนึ่งในนักคิดทางการทหารที่ยิ่งใหญที่สุดของเราอยางไมตองสงสัย แมทฤษฎีของเขาเรื่องหนวยผสมเหลาที่เคลื่อนที่เร็วและโจมตีลึกเขาไปในแนวหลังของศัตรูจะมีผูวิจารณอยูบาง แตเขายังไดรับการสนับสนุนจากนายพลที่มีความสามารถสูงหลายคน หากเราโนมนาวใหเขาสนับสนุนอุดมการณของเราได เขาจะเปนกําลังสําคัญที่ประเมินคามิได"
 SOV_approach_tukhachevsky_tt: "§Y$SOV_mikhail_tukhachevsky$§! จะเขาขางฝายคานซายในสงครามกลางเมือง พรอมนําทหารและนายพลผูภักดีมาดวย"
 SOV_approach_primakov: "ทาบทามปรีมาคอฟ"
 SOV_approach_primakov_tt: "§Y$SOV_vitaly_primakov$§! จะเขาขางฝายคานซายในสงครามกลางเมือง พรอมนําทหารและนายพลผูภักดีมาดวย"
 SOV_approach_primakov_desc: "วิตาลี ปรีมาคอฟ เปนหนึ่งในผูบัญชาการทหารมาชั้นแนวหนาของเรา และการสนับสนุนจากเขาจะมีคามากในการพยายามยึดครองประเทศ"
 SOV_funds_for_the_cause: "ทุนเพื่ออุดมการณ"
 SOV_funds_for_the_cause_desc: "การที่ $SOV_lev_trotsky$ และคนอื่น ๆ อยูตางประเทศยอมเปนประโยชนตอเราอยางแนนอน เราควรจัดงานระดมทุนสังคมนิยมทั่วโลก และพรอมกันนั้นก็พยายามโนมนาวรัฐบาลตาง ๆ อยางลับ ๆ ใหสนับสนุนอาวุธแกเรา"
 SOV_funds_for_the_cause_tt: "เพิ่มแนวคิด §Y$SOV_foreign_funds_idea$§! เปนเวลา 365 วันเมื่อสงครามกลางเมืองเริ่มตนขึ้น"
 SOV_left_opposition_coup: "จุดไฟแหงการปฏิวัติ"
 SOV_left_opposition_coup_desc: "ถึงเวลาแลว จงชูธงขึ้นตอตานทรราช การปฏิวัติจะเริ่มตนขึ้นใหมอีกครั้ง!"
 SOV_left_opposition_coup_tt: "เพิ่มการสนับสนุนฝายคานซายในกองทัพบก กองทัพเรือ และกองทัพอากาศ\nเริ่ม§Yสงครามกลางเมืองโซเวียต§!"
 SOV_exiled_advisors_available_tt: "§Yตัวละครที่ลี้ภัยจะพรอมใชงาน§!"
 SOV_the_vanguard_of_the_true_revolution: "กองหนาแหงการปฏิวัติที่แทจริง"
 SOV_the_vanguard_of_the_true_revolution_desc: "ใหโลกไดยินถึงการปฏิวัติของเรา เราจะเรียกรองใหนักปฏิวัติทั่วโลกมารวมตัวใตธงของเรา รวมกันเราจะเอาชนะสตาลินได รวมกันเราจะนําการปฏิวัติไปสูชัยชนะ"
 SOV_long_live_the_workers_government: "รัฐบาลกรรมกรจงเจริญ"
 SOV_long_live_the_workers_government_desc: "เมื่อเราไดเริ่มเดินบนเสนทางอันยาวไกลสูการปลดปลอยชนชั้นแรงงานอยางแทจริงแลว เราตองไมหลงตกอยูในการลอลวงใหเปลี่ยนรัฐบาลของชนชั้นนํากลุมหนึ่งเปนอีกกลุมหนึ่ง รัฐบาลแหงสหภาพของเราตองเปนรัฐบาลของกรรมกรอยางแทจริงเสมอ โดยกรรมกร และเพื่อกรรมกร"
 FOURTH_INTERNATIONAL_FACTION: "สากลที่ 4"
 SOV_left_purges: "กําจัดพวกตอตานการปฏิวัติ"
 SOV_left_purges_desc: "ยังมีอีกหลายคนที่เคยคับแคนใจตอสตาลิน ขณะที่เรายังคงรวบอํานาจการปกครองอยู เราตองไมปลอยใหคนเหลานี้เริ่มกอตั้งกลุมตอตานการปฏิวัติ มิฉะนั้นเราอาจตองเผชิญสงครามกลางเมืองอีกครั้งในเวลาอันสั้น"
 SOV_left_right_purges_factionalism_tt: "ลบตัวปรับคาอํานาจทางการเมืองออกจาก §Y$SOV_factionalism_modifier$§!"
 SOV_left_purges_tt: "ที่ปรึกษาฝายคานขวาจะถูกปลดออก"
 SOV_the_builder_of_the_red_army: "ผูสรางกองทัพแดง"
 SOV_the_builder_of_the_red_army_desc: "ไมวาระหวางนั้นกองทัพแดงจะกลายเปนอยางไร กองทัพแดงก็ยังคงเปนผลงานความคิดของ $SOV_lev_trotsky$ เสมอ ถึงเวลาแลวที่เขาจะกลับสูตําแหนงเดิม และนํากองทัพแดงที่ฟนคืนพลังขึ้นใหมออกสูสนามรบ"
 SOV_reigniting_the_revolutionary_spirit: "จุดประกายจิตวิญญาณปฏิวัติอีกครั้ง"
 SOV_reigniting_the_revolutionary_spirit_desc: "หลายปภายใตการปกครองแบบสตาลินนิสตทําใหไฟปฏิวัติของประชาชนมอดลง กรรมกรของเราถูกบอกวาการปฏิวัติจะเกิดขึ้น ในสักวันหนึ่ง เรารูดีวาไมใชเชนนั้น ดวยระดับการพัฒนาของโลกในปจจุบัน การปฏิวัติตองถูกจุดขึ้นในประเทศอื่นที่ยังพัฒนาไมถึงระดับนั้น และเราจะเปนผูจุดมันขึ้น"
 SOV_the_permanent_revolution: "การปฏิวัติถาวร"
 SOV_the_permanent_revolution_desc: "ทฤษฎีมารกซิสตสอนวาการปฏิวัติเปนสิ่งที่หลีกเลี่ยงไมไดหากเงื่อนไขเหมาะสม แตเงื่อนไขในตอนนี้ไมเหมาะสมอยางชัดเจน หรือไมไดเหมาะสมในทุกที่ เราตองไมนิ่งนอนใจรอการปฏิวัติโลกที่อาจหางออกไปอีกหลายศตวรรษ กรรมกรและชาวนาทั่วโลกกําลังทนทุกขอยูในขณะนี้ ในวันนี้ และการปลดปลอยพวกเขารอไมได"
 SOV_the_permanent_revolution_decisions_tt: "ปลดล็อกการตัดสินใจ §Yจัดตั้งแนวรวมที่หา§! เพื่อจุดชนวนการลุกฮือปฏิวัติในประเทศเพื่อนบานยุโรปที่เปนศัตรู"
 SOV_the_permanent_revolution_trotsky_trait_tt: "หาก §Y$SOV_lev_trotsky$§! เปนผูนําประเทศ:"
 SOV_depoliticize_the_military: "ปลดการเมืองออกจากกองทัพ"
 SOV_depoliticize_the_military_desc: "หนาที่หลักของกองทัพคือปกปองชนชั้นแรงงาน ทหารของเราสวนใหญเปนสมาชิกของชนชั้นแรงงานอยูแลว จึงไมจําเปนตองมีใครคอยจับตาดู ที่สําคัญยิ่งกวานั้นคือกองทัพแดงตองมุงเนนภารกิจหลัก และไมไดรับอนุญาตใหเลนการเมือง"
 SOV_depoliticize_the_military_ns_tt: "$SOV_modify_the_red_army_ns_intro$ \nตัวคูณการเพิ่มอํานาจบัญชาการสูงสุด: §G+10§! \n\n"
 SOV_system_decentralization: "การกระจายอํานาจของระบบ"
 SOV_system_decentralization_desc: "สตาลินรวมศูนยไมเพียงแคพรรค แตรวมทั้งประเทศไวที่ตัวเขาเอง นี่เปนแนวทางตอตานการปฏิวัติอยางชัดเจน ที่ชวงชิงอํานาจไปจากกรรมกรและมอบไวในมือของชนชั้นนําที่ฉอฉล เราตองกลับทิศทางนี้ และใหกรรมกรไดกําหนดชะตากรรมของตนเองอีกครั้ง"
 SOV_strengthen_heavy_industry: "เสริมความแข็งแกรงอุตสาหกรรมหนัก"
 SOV_strengthen_heavy_industry_desc: "อุตสาหกรรมหนักคือหัวใจของเศรษฐกิจเรา หากเราตองการใหการปฏิวัติไมเพียงอยูรอด แตเจริญรุงเรือง เราตองเสริมความแข็งแกรงใหภาคสวนนี้ยิ่งขึ้น"
 SOV_a_global_class_struggle: "การตอสูทางชนชั้นระดับโลก"
 SOV_a_global_class_struggle_desc: "การตอสูเพื่อปลดปลอยชนชั้นแรงงานตองเปนการตอสูระดับโลกโดยนิยาม ตราบใดที่ยังมีแมแตประเทศเดียวที่สนับสนุนระบบทุนนิยม การปฏิวัติก็ไมปลอดภัย เมื่อกรรมกรทั่วโลกตระหนักวาการปฏิวัติกําลังเดินหนาอีกครั้ง พวกเขาจะมารวมตัวใตธงของเราและสนับสนุนภารกิจของเรา"
 SOV_a_global_class_struggle_decision_tt: "ปลดล็อกการตัดสินใจ §Yปลุกระดมชนชั้นกรรมาชีพ§! เพื่อบอนทําลายเสถียรภาพของประเทศเพื่อนบานในยุโรปและสรางขออางทําสงครามกับพวกเขา"
 SOV_all_power_to_the_soviets: "อํานาจทั้งหมดเปนของโซเวียต"
 SOV_all_power_to_the_soviets_desc: "การปฏิวัติเริ่มตนจากแนวคิดงาย ๆ วาประชาชนควรไดกําหนดชะตากรรมของตนเอง ดวยการตั้งสภาของกรรมกร ทหาร และชาวนา ภายหลังเทานั้นที่ระบบนี้ถูกเปลี่ยนกลับไปเปนระบบที่ขาราชการซึ่งไมไดมาจากการเลือกตั้งตัดสินใจจากที่หางไกล เมื่อการตัดสินใจเหลานั้นลมเหลวอยางหลีกเลี่ยงไมได ผูที่ถูกลงโทษก็มักเปนกรรมกร จะไมมีอีกตอไปแลว!"
 SOV_regional_development: "การพัฒนาภูมิภาค"
 SOV_regional_development_desc: "แทนที่จะมีโรงงานรวมศูนยเพียงไมกี่แหงและปลอยใหสวนที่เหลือของประเทศอดอยาก เราตองทําใหการพัฒนาอุตสาหกรรมกระจายไปทั่วทั้งสหภาพ"
 
 SOV_autonomous_soviet_republics: "สาธารณรัฐโซเวียตปกครองตนเอง"
 SOV_autonomous_soviet_republics_desc: "ในชวงหลายปหลังการปฏิวัติ พวกสตาลินนิสตพยายามอยางหนักที่จะลบลางอัตลักษณทองถิ่นและกดขี่สิทธิการกําหนดใจตนเองของกรรมกรในบางภูมิภาคของสหภาพ ลักษณะตอตานการปฏิวัติของการกระทําเหลานี้ประจักษชัดในตัวเอง หากกรรมกรในสาธารณรัฐโซเวียตบางแหงปรารถนาอํานาจปกครองตนเองมากขึ้น เราก็ควรมอบใหโดยไมลังเล"
 SOV_autonomous_soviet_republics_tt: "เปดใหปลดปลอยประเทศได"
 SOV_international_union_of_soviet_republics: "สหภาพสาธารณรัฐโซเวียตสากล"
 SOV_international_union_of_soviet_republics_desc: "การทรยศตอการปฏิวัติครั้งใหญที่สุดคือแนวคิดที่วาสังคมนิยมสามารถ หรือแมแตควร สรางขึ้นในประเทศเดียว กรรมกรในทุกประเทศจะบรรลุสังคมนิยมไปดวยกัน หรือไมก็ไมมีใครบรรลุเลย แมการปฏิวัติจะอยูในขั้นที่ตางกันในแตละประเทศ เราจะแบงปนทรัพยากรเพื่อใหการปฏิวัติเดินหนาในทุกประเทศพันธมิตรที่กรรมกรควบคุมรัฐบาล"
 SOV_international_union_of_soviet_republics_tt: "ปรับ §Y$SOV_factionalism_modifier$§!:\nคาใชจายการคาของเจาอาณานิคม: §G-10%§!\nตัวปรับคาเสถียรภาพจากความนิยมของพรรค: §G+10%§!\n"
 SOV_international_union_of_soviet_republics_puppet_tt: "เพิ่ม§Yโรงงานพลเรือน 1 แหง§!ในรัฐเมืองหลวง"
 SOV_the_onslaught_on_colonialism: "การโจมตีลัทธิอาณานิคม"
 SOV_the_onslaught_on_colonialism_decision_tt: "ปลดล็อกการตัดสินใจ §Yจัดตั้งแนวรวมที่หา§! และ §Yปลุกระดมชนชั้นกรรมาชีพ§! ในประเทศเพื่อนบานแอฟริกา"
 SOV_the_onslaught_on_colonialism_desc: "จักรวรรดินิยมและการขูดรีดอาณานิคมเปนสวนสําคัญของทุนนิยมระยะปลาย อยางไรก็ตาม การกดขี่ผูคนนับลานไวเปนทาสก็มอบศักยภาพการปฏิวัติมหาศาลที่เราใชประโยชนไดงายดาย มวลชนผูถูกกดขี่ในจักรวรรดิอาณานิคมโหยหาอิสรภาพ และเราจะทําลายโซตรวนของพวกเขา"
 SOV_carry_revolution_east: "นําการปฏิวัติสูตะวันออก"
 SOV_carry_revolution_east_desc: "การขูดรีดอาณานิคมแอฟริกาอยางโหดรายทําใหสังคมเหลานั้นไมอาจพัฒนาถึงระดับที่การปฏิวัติจะสําเร็จไดงาย แตไมใชกับสังคมในเอเชียที่พัฒนามากกวา ซึ่งมีศักยภาพการปฏิวัติมหาศาลรอการปลดปลอยอยู"
 SOV_carry_revolution_east_decision_tt: "ปลดล็อกการตัดสินใจ §Yจัดตั้งแนวรวมที่หา§! และ §Yปลุกระดมชนชั้นกรรมาชีพ§! ในประเทศเพื่อนบานเอเชีย"
 SOV_the_end_of_the_imperialist_era: "จุดจบของยุคจักรวรรดินิยม"
 SOV_the_end_of_the_imperialist_era_desc: "บางทีการแสดงออกของจักรวรรดินิยมที่โจงแจงที่สุดก็คือสิ่งที่เรียกวาลัทธิมอนโร ซึ่งประเทศเดียวประกาศใหสองทวีปทั้งทวีปเปนดินแดนเฉพาะของตน สิ่งนี้จะคงอยูไมได การปฏิวัติจะหาที่มั่นในทวีปอเมริกา และกรรมกรแหงซีกโลกตะวันตกจะไดหายใจอยางเสรีในที่สุด"
 SOV_the_end_of_the_imperialist_era_decision_tt: "ปลดล็อกการตัดสินใจ §Yจัดตั้งแนวรวมที่หา§! และ §Yปลุกระดมชนชั้นกรรมาชีพ§! ในประเทศเพื่อนบานในทวีปอเมริกาและโอเชียเนีย"
 SOV_military_support: "การสนับสนุนจากกองทัพ"
 SOV_military_support_desc: "การไดรับการสนับสนุนจากภายในกองทัพอาจมีคามาก แมจะเสี่ยงใหสายลับของสตาลินระแคะระคายแผนการของเราก็ตาม หวังวาเมื่อถึงตอนนั้นก็คงสายเกินไปสําหรับเขาแลว"
 SOV_military_support_tt: "เพิ่มการสนับสนุนจากกองทัพในกรณีเกิดสงครามกลางเมือง\nปลดล็อกการตัดสินใจเพื่อหาการสนับสนุนเพิ่มเติม"
 SOV_divert_attention_towards_military: "เบี่ยงความสนใจไปที่กองทัพ"
 SOV_divert_attention_towards_military_desc: "หากสตาลินเชื่อวากองทัพไมพอใจเขา เขาจะโจมตีกองทัพแทนที่จะเปนเรา และทายที่สุดแลว กองทัพก็จะไมพอใจเขาจริง ๆ..."
 SOV_divert_purge_attention_tt: "เริ่มการกวาดลางกองทัพแบบสุม \nปลดล็อก§Yการตัดสินใจ§!เพื่อใสรายนายทหาร\nจะขามแผนยุทธศาสตร §Y$SOV_the_zinovyevite_terrorist_center$§! สําหรับฝายกลาง"
 SOV_gain_support_from_party_members: "หาการสนับสนุนจากสมาชิกพรรค"
 SOV_gain_support_from_party_members_desc: "หุนเชิดของสตาลินบางคนเปนเชนนั้นเพียงเพราะความกลัว เราควรโนมนาวพวกเขาวาแผนของเราจะสําเร็จ และพวกเขาสามารถเปนวีรบุรุษไดโดยไมตองออกแรงมากนัก มีหลายวิธีอยู..."
 SOV_gain_support_from_party_members_tt: "§Y$SOV_vsevolod_merkulov$§!, §Y$SOV_mikhail_kalinin$§! และ §Y$SOV_nikita_khrushchyov$§! เขารวมฝายคานเมื่อสงครามกลางเมืองเริ่มตนขึ้น\nเสถียรภาพ §G+10%§! เมื่อสงครามกลางเมืองเริ่มตนขึ้น"
 SOV_sway_the_railway_workers: "โนมนาวคนงานรถไฟ"
 SOV_sway_the_railway_workers_desc: "การปฏิวัติตองการเสบียง เราตองดึงคนงานรถไฟมาเปนฝายเรา ซึ่งจะเปดโอกาสใหเราเตรียมและซอนคลังเสบียงไวรอบฐานปฏิบัติการ"
 SOV_sway_the_railway_workers_tt: "เพิ่ม§Yทางรถไฟ§!และ§Yศูนยเสบียง§!รอบรัฐที่ตั้งกองบัญชาการเมื่อ §Y[GetSovietCivilWarName]§! เริ่มตนขึ้น"
 SOV_infiltrate_the_nkvd: "แทรกซึม NKVD"
 SOV_infiltrate_the_nkvd_desc: "เจาหนาที่ระดับลางของ NKVD คือผูที่ลงมือทํางานสกปรกใหสตาลิน และมักทําตัวเปนขารับใชผูภักดี แตแมแตกําแพงก็ยังมีรอยราว เราควรทําใหคนเหลานั้นหันมาทํางานใหเรามากที่สุดเทาที่จะทําได โดยปอนขอมูลผิด ๆ ใหทรราช"
 SOV_infiltrate_the_nkvd_tt: "จะทําใหกองกําลัง NKVD บางสวนเขารวมฝายคุณใน §Y[GetSovietCivilWarName]§!\n ปลดล็อก§Yการตัดสินใจ§! $SOV_expand_nkvd_opposition$"
 SOV_infiltrate_the_nkvd_coup_tt: "เพิ่มโอกาสที่การลอบสังหารสตาลินจะสําเร็จ"
 SOV_cooperation_against_stalin: "รวมมือกันตอตานสตาลิน"
 SOV_cooperation_against_stalin_desc: "ไมวาเราจะมีความเห็นตางกันอยางไร ในการตอสูขั้นนี้เราตองสามัคคีกันตอตานสตาลิน"
 SOV_cooperation_against_stalin_right_tt: "§Y$SOV_karl_radek$§! และ §Y$SOV_yevgeny_preobrazhensky$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_cooperation_against_stalin_left_tt: "§Y$SOV_nikolay_bukharin$§! และ §Y$SOV_aleksey_rykov$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_cooperation_against_stalin_other_tt: "มีที่ปรึกษาใหมพรอมใหแตงตั้ง"
 SOV_cooperation_against_stalin_factionalism_tt: "ปรับ §Y$SOV_factionalism_modifier$§! ดวยคาใชจายที่ปรึกษาทางการเมือง §G-15%§! ปจจัยเสถียรภาพจากความนิยมของพรรค §R-10%§! และปจจัยอํานาจทางการเมือง §R-5%§!"
 SOV_align_the_zinovyevites: "ดึงพวกซีโนเวียฟมาเปนพวก"
 SOV_align_the_zinovyevites_desc: "$SOV_grigory_zinovyev$ เคยเขาขางสตาลินตอตานทรอตสกี แตทันทีหลังจากนั้น สตาลินก็หักหลังและปลดเขาออกจากทุกตําแหนงที่มีอํานาจ เขาคงไมลืมการดูหมิ่นครั้งนั้น และหากเราใหโอกาส $SOV_grigory_zinovyev$ ไดแกแคน เขาจะความันไวแนนอน"
 SOV_align_the_zinovyevites_tt: "§Y$SOV_grigory_zinovyev$§! และ §Y$SOV_lev_kamenev$§! จะไดรับการปลอยตัวจากคุกและถูกเนรเทศ (§Gตัวละครที่ถูกเนรเทศไมสามารถถูกกวาดลางได§!) พวกเขาจะพรอมใหแตงตั้งเปนที่ปรึกษาเมื่อสงครามกลางเมืองเริ่มตนขึ้น\nปลดล็อก§Yการตัดสินใจ§!เพื่อเพิ่มกองโจรในรัฐสําคัญเมื่อสงครามกลางเมืองปะทุขึ้น\n"
 SOV_align_the_zinovyevites_factionalism_tt: "ปรับ §Y$SOV_factionalism_modifier$§! ดวยปจจัยอํานาจทางการเมือง §R-5%§!"
 SOV_liberate_ryutin: "ปลดปลอยริวติน"
 SOV_liberate_ryutin_desc: "สหายริวตินไมเคยลังเลที่จะชี้ใหเห็นขอบกพรองและความผิดพลาดมากมายของสตาลิน จึงไมนาแปลกใจนักที่สตาลินตัดสินใจลงโทษเขาเปนเยี่ยงอยาง อยางไรก็ตาม ตอนนี้เราควรใชเสนสายสงตัวเขาไปตางประเทศจนกวาสตาลินจะถูกโคน เพื่อใหเขาชวยเราบริหารประเทศหลังสตาลินหมดอํานาจ"
 SOV_liberate_ryutin_tt: "§Y$SOV_martemyan_ryutin$§! จะไดรับการปลอยตัวจากคุกและถูกเนรเทศ (§Gตัวละครที่ถูกเนรเทศไมสามารถถูกกวาดลางได§!) เขาจะพรอมใหแตงตั้งเปนที่ปรึกษาเมื่อสงครามกลางเมืองเริ่มตนขึ้น และผูสนับสนุนของเขาจะเขารวมฝายคาน"
 SOV_return_democracy_to_the_party: "คืนประชาธิปไตยสูพรรค"
 SOV_return_democracy_to_the_party_desc: "ครั้งหนึ่งระหวางการปฏิวัติ เราไมอาจปลอยใหตัวเองจมอยูกับการถกเถียงไมรูจบวาหนทางใดดีที่สุด แตกาลเวลาเปลี่ยนไปแลว และถึงเวลาที่จะทําตามสัญญาเรื่องประชาธิปไตยในทุกดานของชีวิตที่ใหไวกับกรรมกร ซึ่งหมายความวาตอนนี้เราสามารถรับคนที่เคยวิจารณดวยเจตนาดีแตถูกมองวาเปนการบอนทําลายกลับเขาพรรคได"
 SOV_return_democracy_to_the_party_unlock_right_tt: "§Yที่ปรึกษาฝายคานขวา§!พรอมใหแตงตั้ง"
 SOV_return_democracy_to_the_party_unlock_left_tt: "§Yที่ปรึกษาฝายคานซาย§!พรอมใหแตงตั้ง"
 SOV_return_democracy_to_the_party_factionalism_tt: "ปรับ §Y$SOV_factionalism_modifier$§! ดวยปจจัยอํานาจทางการเมือง §R-5%§!"
 SOV_strengthen_the_trade_unions: "เสริมความแข็งแกรงสหภาพแรงงาน"
 SOV_strengthen_the_trade_unions_desc: "ภายใตการนําของสตาลิน สหภาพแรงงานถูกบิดเบือนจากเครื่องมือที่เปนปากเสียงใหกรรมกรตอรองกับฝายบริหาร กลายเปนเครื่องมือของฝายบริหารในการสั่งการกรรมกร แมนี่อาจดูเปนอาชญากรรมเล็ก ๆ ของเขา แตมันกลับพลิกแนวคิดการปกครองตนเองแบบประชาธิปไตยของกรรมกรใหตาลปตร และขัดขวางไมใหกรรมกรไดรับผลประโยชนจากการปฏิวัติอยางไดผล"
 SOV_the_peoples_revolution: "การปฏิวัติของประชาชน"
 SOV_the_peoples_revolution_desc: "หากการปฏิวัติจะคงอยูตอไป ก็ตองแทรกซึมไปทุกดานของสังคม การปฏิวัติจะตานทานภัยคุกคามมากมายที่เผชิญอยูได ก็ตอเมื่อประชาชนทั้งปวงถือวาตนเปนสวนหนึ่งและผูสืบสานการปฏิวัติเทานั้น"
 SOV_the_supreme_soviet: "สภาโซเวียตสูงสุด"
 SOV_the_supreme_soviet_desc: "การใหบุคคลเพียงคนเดียวเปนตัวแทนของทั้งประเทศนั้นไมเปนประชาธิปไตยโดยเนื้อแท จึงเปนการตอตานการปฏิวัติ เราจะยุติพฤติกรรมบูชาตัวบุคคลเชนนี้ และประกาศวาสหภาพของเราจะมีตัวแทนเปนเจตจํานงรวมของประชาชนที่รวมตัวกันในสภาโซเวียตสูงสุดตลอดไป"

 SOV_the_right_opposition: "ฝายคานขวา"
 SOV_the_right_opposition_desc: "การนําที่หวาดระแวงของสตาลินกําลังทําลายประเทศ การหันไปสูการรวมนาเปนนารวมขนานใหญและการเรงอุตสาหกรรมอยางโหดรายยิ่งทําลายหนักขึ้นไปอีก ตองมีการทําอะไรสักอยาง และตองเร็ว ผูที่จะนําประเทศนี้สูความรุงโรจน เยียวยาบาดแผลจากการบริหารผิดพลาด และฟนฟูเศรษฐกิจได ก็คือสมาชิกฝายคานขวาซึ่งนําโดยบูคาริน"
 SOV_the_right_opposition_tt: "เริ่มกระบวนการที่นําไปสู§Yสงครามกลางเมือง§!ใน[ROOT.GetNameDef]ระหวางฝายกลางกับฝายคานขวา"
 SOV_the_need_for_policy_changes: "ความจําเปนในการเปลี่ยนนโยบาย"
 SOV_the_need_for_policy_changes_desc: "เปนที่ชัดเจนอยางยิ่งแลววาประเทศกําลังมุงไปผิดทาง สตาลินและพวกพยายามทํามากเกินไปและเร็วเกินไป เราตองหัดเดินกอนจะวิ่ง เราควรนําสหายโซโคลนิคอฟ ผูสรางผลงานยอดเยี่ยมในชวงปแรก ๆ ของสหภาพโซเวียต กลับมาเพื่อพาเรากลับสูเสนทางที่ถูกตอง"
 SOV_the_need_for_policy_changes_tt: "§Y$SOV_grigory_sokolnikov$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_reverse_the_collectivization_process: "ยกเลิกกระบวนการนารวม"
 SOV_reverse_the_collectivization_process_desc: "การรวมนาเปนนารวมเปนหายนะโดยสมบูรณ กอใหเกิดความยากจนและทุพภิกขภัยในพื้นที่ที่เคยเปนอูขาวอูนํ้าของชาติ ตองยกเลิกโดยดวน"
 SOV_reverse_the_collectivization_process_tt: "เพิ่มการสนับสนุนจากชาวนาเจาของที่ดินระหวางสงครามกลางเมือง\nปรับ §Y$SOV_factionalism_modifier$§!:\nจํานวนโรงงานสูงสุดในรัฐ: §R-10%§!\nปจจัยเสถียรภาพจากความนิยมของพรรค: §G+10%§!\n"
 SOV_organize_uprisings_in_the_country: "จัดตั้งการลุกฮือทั่วประเทศ"
 SOV_organize_uprisings_in_the_country_desc: "เปนที่ชัดเจนวาเราไมอาจโคนสตาลินลงจากอํานาจไดหากปราศจากการตอสูดวยอาวุธในรูปแบบใดรูปแบบหนึ่ง การดึงความสนใจของสตาลินออกไปจากการเตรียมการของเรา จะทําใหการเตรียมการดําเนินไปไดโดยไมถูกขัดขวาง"
 SOV_organize_uprisings_in_the_country_tt: "กอการลุกฮือในหลายพื้นที่ของประเทศ ซึ่งจะนําไปสูการสนับสนุนที่มากขึ้นในสงครามกลางเมืองโซเวียต"
 SOV_dissent_in_the_party: "ความเห็นแยงในพรรค"
 SOV_dissent_in_the_party_desc: "เราตองกดดันสตาลินในหลายแนวรบเพื่อบั่นทอนการควบคุมพรรคของเขา วิธีหนึ่งคือการตีพิมพบทความและเรียงความวิพากษวิจารณจํานวนหนึ่งในหนังสือพิมพของพรรค เรียกรองการปฏิรูปและชี้ใหเห็นขอบกพรองในการตัดสินใจของเขา แมสตาลินจะรูสึกกระวนกระวายอยางยิ่ง แตสิ่งนี้จะชวยยกสถานะของเราในสายตากลุมฝายคานตาง ๆ ดวย"
 SOV_eliminate_the_left: "กําจัดฝายซาย"
 SOV_eliminate_the_left_desc: "แมศัตรูหลักของเราคือสตาลิน แตเราตองยอมรับวาในพรรคมีหลายคนที่เพียงรอจังหวะ และจะบอนทําลายความพยายามยึดอํานาจของเราดวยการโตเถียงไมหยุดหยอน ขณะที่สตาลินหวาดระแวงการกระทําของเรามากขึ้นเรื่อย ๆ โอกาสที่จะยิงปนนัดเดียวไดนกสองตัวก็มาถึงแลว"
 SOV_eliminate_the_left_tt: "§Y$SOV_karl_radek$§!, §Y$SOV_ivar_smilga$§! และ §Y$SOV_yevgeny_preobrazhensky$§! กลายเปนเปาหมายที่อาจถูกสตาลินกวาดลาง"
 SOV_concessions_to_foreign_powers: "ยอมออนขอใหมหาอํานาจตางชาติ"
 SOV_concessions_to_foreign_powers_desc: "เปนเรื่องนาอัปยศอยางยิ่งที่เราตองรองขอความชวยเหลือจากตางชาติในการตอสูเพื่อกอบกูประเทศ แตความกดขี่และความหวาดระแวงของสตาลินบีบใหเราไมมีทางเลือก"
 SOV_concessions_to_foreign_powers_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อขอความชวยเหลือจากมหาอํานาจตางชาติแลกกับการยอมออนขอให"
 SOV_covert_support_for_spanish_poum: "สนับสนุน POUM ของสเปนอยางลับ ๆ"
 SOV_covert_support_for_spanish_poum_desc: "ในสเปน การตอตานการปฏิวัติกําลังดําเนินไปอยางเต็มกําลัง ฟาสซิสตและกองกําลังปฏิกิริยากําลังสนับสนุนฝายชาตินิยมสเปน แมฝายสาธารณรัฐสเปนจะมีความกระตือรือรนมากมาย แตนาเสียดายที่สิ่งนั้นใชแทนปนและกระสุนไมได และใชแทนจิตสํานึกทางการเมืองที่พัฒนาอยางดีก็ไมไดเชนกัน เราสามารถมอบใหไดทั้งสามอยาง"
 SOV_covert_support_for_spanish_poum_tt: "การสนับสนุนอยางลับ ๆ จะทําให POUM กลายเปนกลุมหลักระหวางการลุกฮือของฝายอนาธิปไตยในสงครามกลางเมืองสเปน ทําใหกลายเปนการลุกฮือแบบ §Y$communism$§! แทนการลุกฮือแบบ $neutrality$\n\n"
 SOV_if_poum_wins_tt: "\nหาก §Y$SPC_communism_DEF$ สาย POUM§! ชนะสงครามกลางเมืองสเปน กองพลสเปนจํานวนหนึ่งจะมาชวยเราในสงครามกลางเมืองของเราเอง"
 SOV_undermine_stalins_authority: "บั่นทอนอํานาจของสตาลิน"
 SOV_undermine_stalins_authority_desc: "สิ่งเดียวที่ทําใหสตาลินยังคงอยูในอํานาจคือความกลัวของผูคนตอตัวเขาและสิ่งที่เขาทําได เรายังไมอาจขจัดความกลัวของผูคนไดในตอนนี้ แตเราสามารถลดความสามารถของสตาลินในการทํารายผูอื่นได หากทุกอยางเปนไปดวยดี เราอาจโดดเดี่ยวเขาจนเหลือเพียงชายคนหนึ่งเทานั้นอีกครั้ง"
 SOV_undermine_stalins_authority_paranoia_tt: "£SOV_paranoia_text_icon ความหวาดระแวงเพิ่มขึ้นรายสัปดาห: §R+1§!"
 SOV_clandestine_cells: "หนวยใตดิน"
 SOV_clandestine_cells_desc: "พวกสตาลินนิสตมองเห็นผูบอนทําลาย สายลับ และผูกอวินาศกรรมไปทุกที่ พวกเขาทําเชนนี้มานานจนคนสวนใหญไมเชื่ออีกตอไปเมื่อพวกเขารองหมาปามาแลว เราสามารถใชจุดนี้ตั้งหนวยใตดินในโรงงานอุตสาหกรรมสําคัญ เพื่อกอวินาศกรรมในกรณีที่สตาลินตอตานการยึดอํานาจของเรา"
 SOV_clandestine_cells_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอวินาศกรรมอุตสาหกรรมระหวางสงครามกลางเมือง"
 SOV_the_plan_for_the_coup: "วางแผนรัฐประหาร"
 SOV_the_plan_for_the_coup_desc: "การแยงชิงอํานาจครั้งนี้ไมจําเปนตองปะทุเปนความรุนแรงอยางเปดเผย หากเราเดินหมากถูกตอง และวางคนที่ใชไวในตําแหนงที่ใช เราอาจกันสตาลินออกจากอํานาจแลวโคนเขาลงได"
 SOV_the_plan_for_the_coup_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อดึงหัวหนา NKVD มาเปนฝายคุณ ทําใหสามารถโคนสตาลินดวยรัฐประหารที่ไมนองเลือดได"

 SOV_the_socialist_bulwark: "ปอมปราการสังคมนิยม"
 SOV_the_socialist_bulwark_desc: "เรายืนเคียงขางสหายชาวสเปนของเรา ในแบบอยางของความสมานฉันทสากล การตอสูของพวกเขาคือการตอสูของเรา และการตอสูของเราก็คือของพวกเขา รวมกัน เราจะสรางศูนยกลางการปฏิวัติสังคมนิยมสองแหงที่ปลายสองฟากของยุโรป"
 SOV_the_socialist_bulwark_join_war_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! จะเขารวมกับ §Y[SPC.GetFlag]POUM ของสเปน§! ในสงครามกลางเมืองตอตานกลุมอื่นทั้งหมดของสเปน"
 SOV_poum_exists_tt: "§Y$SPC_communism$§!:\n   มีอยู\n   ทําแผนยุทธศาสตร §Y$SPR_the_anti_fascist_workers_revolution$§! สําเร็จแลว"
 SOV_coup_detat: "รัฐประหาร"
 SOV_coup_detat_desc: "ถึงเวลาแลวที่จะเขาควบคุมประเทศ หากทุกอยางเปนไปดวยดี เราจะลงมืออยางรวดเร็วและกําจัดอุปสรรคใหญที่สุดดวยรัฐประหารที่ไมนองเลือด หากไมเปนไปตามแผน เราจะตองสูเพื่อประเทศของเรา"
 SOV_coup_detat_success_tt: "§Yฝายคานขวา§!เขายึดอํานาจดวยรัฐประหาร §Y$SOV_lavrenty_beriya$§! ถูกปลดออก"
 SOV_coup_detat_civil_war_tt: "เพิ่มการสนับสนุนฝายคานขวาในกองทัพบก กองทัพเรือ และกองทัพอากาศ\nเริ่ม§Yสงครามกลางเมืองโซเวียต§!"
 SOV_right_purges: "ศัตรูของรัฐ"
 SOV_right_purges_desc: "ยังมีสมาชิกพรรคจํานวนหนึ่งที่ยังไมยอมรับการปกครองของเราอยางเต็มที่ เราตองลงโทษพวกเขาเปนเยี่ยงอยางเพื่อใหคนที่เหลืออยูในแถว"
 SOV_right_purges_tt: "ที่ปรึกษาฝายคานซายจะถูกปลดออก"
 SOV_the_power_of_the_peasantry: "พลังของชาวนา"
 SOV_the_power_of_the_peasantry_desc: "แมหลักมารกซิสตดั้งเดิมจะมองวาศักยภาพการปฏิวัติอยูที่กรรมกรอุตสาหกรรม แตในประเทศของเรา เห็นไดชัดวาชาวนาคือกําลังสวนใหญ เราตองใหการศึกษาแกเกษตรกรนับลานและพัฒนาจิตสํานึกทางชนชั้นของพวกเขา เพื่อใหพวกเขากระตือรือรนที่จะปกปองการปฏิวัติเมื่อถูกโจมตี"
 SOV_curtailment_of_the_collective_farms: "ลดทอนนารวม"
 SOV_curtailment_of_the_collective_farms_desc: "นารวมขนาดมหึมาเปนตัวอยางทั่วไปของลัทธิบาความใหญแบบขาราชการสตาลินนิสต มันทําใหชาวนาแปลกแยกจากผลผลิตของงานตน และเปลี่ยนเขาใหกลายเปนกรรมกรอุตสาหกรรมในทุงนา ในขณะเดียวกัน ผลผลิตก็ลดลงอยางมาก และการผลิตอาหารที่หยุดชะงักไดนําไปสูหายนะแลว เราตองแกไขความโงเขลานี้โดยดวน"
 SOV_curtailment_of_the_collective_farms_tt: "ล็อกแผนยุทธศาสตรแผนหาป"
 SOV_administrative_reforms: "การปฏิรูปการบริหาร"
 SOV_administrative_reforms_desc: "สตาลินใหคุณคากับความภักดีเหนือสิ่งอื่นใด ผลก็คือผูคนที่ทํางานในฝายบริหารของเราไมคอยแสดงความริเริ่มหรือความคิดอิสระที่อาจทําใหพวกเขาเดือดรอน เราตองปลูกฝงคุณคาเหลานี้ใหพวกเขา หรือแทนที่ดวยคนที่มีคุณคาเหลานี้"
 SOV_a_new_theory_of_revolution: "ทฤษฎีการปฏิวัติแบบใหม"
 SOV_a_new_theory_of_revolution_desc: "ทฤษฎีการปฏิวัติแบบมารกซิสตนั้นถูกตองในศตวรรษที่ 19 แตความเปนจริงของศตวรรษที่ 20 ตองการการทบทวนทฤษฎีใหม การปฏิวัติไมไดเริ่มตนในประเทศที่พัฒนาที่สุดเสมอไป เราจึงตองปรับแนวทางของเรา"
 SOV_back_to_the_nep: "กลับสู NEP"
 SOV_back_to_the_nep_desc: "กอนที่เราจะสรางสังคมสังคมนิยมได เราตองสรางรากฐานและพัฒนาเศรษฐกิจตอไป ในชวงปแรก ๆ ของการปฏิวัติ เราไดใชนโยบายเศรษฐกิจใหม ซึ่งเปดใหกลไกตลาดเสรีชวยขยายเศรษฐกิจ นโยบายนี้ถูกยกเลิกอยางรวดเร็วกอนจะไดผลิดอกออกผล บัดนี้เมื่อเรากลับมามีอํานาจอีกครั้ง เราสามารถเริ่มกระบวนการที่ถูกยกเลิกกลางคันนี้ใหมเพื่อนําไปสูสังคมที่ดีกวา"
 SOV_back_to_the_nep_new_economy_law: "ปลดล็อกกฎหมายเศรษฐกิจใหม: §Y$new_economic_policy$§!"
 SOV_planned_economy: "เศรษฐกิจแบบวางแผน"
 SOV_planned_economy_desc: "แมจะมีขอบกพรอง แตก็เห็นไดชัดวา NEP ประสบความสําเร็จหลายประการเชนกัน เรายังหางไกลจากการเปลี่ยนไปสูสังคมสังคมนิยมเต็มรูปแบบ แตตอนนี้เราสามารถเดินหนาวางแผนเศรษฐกิจอยางเปนระบบมากขึ้นไดแลว โดยเฉพาะอยางยิ่ง เราควรสรางนโยบายเศรษฐกิจที่คํานึงถึงขีดความสามารถของหุนสวนและพันธมิตร และสรางเศรษฐกิจที่พึ่งพาอาศัยกันมากขึ้น"
 SOV_planned_economy_subjects_tt: "รัฐในอารักขาทุกประเทศ:"
 SOV_planned_economy_dynamic_modifier_tt: "\nเพิ่ม §Y$SOV_planned_economy_dynamic_modifier$§! ซึ่งให (ผลผลิตโรงงาน: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!, บทลงโทษจากการขาดทรัพยากร: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!) \nสําหรับรัฐในอารักขาแตละแหงที่ใช §Y$new_economic_policy$§! จะไดรับเพิ่มเติม: \nผลผลิตโรงงาน: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§! \nบทลงโทษจากการขาดทรัพยากร: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§! \n(โบนัสเพิ่มเติมสูงสุด: ผลผลิตโรงงาน: §Y+10.00%§!, บทลงโทษจากการขาดทรัพยากร: §Y-10.00%§!)\n\n"
 SOV_paced_industrialization: "การพัฒนาอุตสาหกรรมอยางพอเหมาะ"
 SOV_paced_industrialization_desc: "แมการมุงเนนอุตสาหกรรมหนักแตเพียงอยางเดียวของสตาลินจะทําใหหลายภาคสวนดอยพัฒนาอยางมาก แตเราก็ไมอาจละเลยภาคสวนนี้ในการวางแผนของเราได เพื่อใหภาคสวนอื่นไดปรับปรุงใหทันสมัยและใชเครื่องจักร เราตองมีฐานอุตสาหกรรมที่จะรองรับ"
 SOV_the_trade_union_as_labor_organizer: "สหภาพแรงงานในฐานะผูจัดระเบียบแรงงาน"
 SOV_the_trade_union_as_labor_organizer_desc: "ภายใตระบบทุนนิยม สหภาพแรงงานมีไวเพื่อรับรองสิทธิมนุษยชนขั้นพื้นฐานของกรรมกรและตานทานการขูดรีดจากเจาของโรงงาน ซึ่งเห็นไดชัดวาไมจําเปนอีกตอไปในระบบใหม บทบาทของสหภาพแรงงานจึงตองเปลี่ยนไปเปนการจัดระเบียบแรงงานเพื่อเพิ่มประสิทธิภาพการผลิต"
 SOV_incorporate_local_organizations: "ผนวกองคกรทองถิ่น"
 SOV_incorporate_local_organizations_desc: "องคกรทองถิ่นมักเขาใจปญหาที่กรรมกรเผชิญไดดีกวาคนในเมืองหลวง เราควรลดบทบาทของรัฐมนตรีและสมาชิกพรรคระดับสูงคนอื่น ๆ และมอบอํานาจใหคนในทองถิ่นมากขึ้น"
 SOV_for_the_common_good: "เพื่อประโยชนสวนรวม"
 SOV_for_the_common_good_desc: "หลักการชี้นําของการตัดสินใจทุกอยางของพันธมิตรเราตองเปนการสรางประโยชนสูงสุดเทาที่ทําได แมในตอนแรกการเสียสละจะไมไดนํามาซึ่งการปรับปรุงในทันที แตตองทําใหชัดเจนวาในระยะยาวสิ่งนี้ใหประโยชนสูงสุด"
 SOV_victory_over_devastation: "ชัยชนะเหนือความหายนะ"
 SOV_victory_over_devastation_desc: "ความพยายามรวมกันของประชาชนทําใหเรากาวขามความพินาศจากสงครามกลางเมืองมาได ความรวดเร็วในการฟนฟูประเทศจะเปนอนุสรณถึงทักษะและความทุมเทของกรรมกรของเราตลอดไป"
 SOV_victory_over_devastation_tt: "ปรับ §Y$SOV_planned_economy_dynamic_modifier$§! ดังนี้ \nโรงงานสินคาอุปโภคบริโภค: §Y-2.0%§! \nตัวปรับคาเสถียรภาพจากความนิยมของพรรค: §G+15.00%§! \nขีดจํากัดการยอมจํานนขั้นตํ่า: §G+10.00%§! \nความเร็วการซอมแซมโรงงาน: §G+10.00%§! \n\n"
 SOV_victory_over_devastation_industrial_relocation_tt: "ระยะเวลาการตัดสินใจ §Y$SOV_industry_relocation$§!: §G-50%§!"
 SOV_socialist_humanism: "มนุษยนิยมสังคมนิยม"
 SOV_socialist_humanism_desc: "นักทฤษฎีมารกซิสตบางคนเชื่อวามนุษยไมมีความสามารถกําหนดชะตากรรมของตนเอง และชีวิตถูกกําหนดโดยปจจัยทางวัตถุทั้งสิ้น ซึ่งเห็นไดชัดวาผิด และแสดงถึงมุมมองแบบกระฎมพีตอชนชั้นแรงงาน ผูคนเปนมากกวาแคอวัยวะชุดหนึ่ง และเราควรปฏิบัติตอพวกเขาเชนนั้น"
 SOV_international_revolutionary_marxist_centre: "ลัทธิมารกซปฏิวัติสากล"
 SOV_international_revolutionary_marxist_centre_desc: "สากลที่สามตกอยูใตระบอบเผด็จการเบ็ดเสร็จแบบสตาลินนิสต และคงเกินเยียวยาแลว เราตองมอบชองทางใหมใหพรรคคอมมิวนิสตทั่วโลกไดประสานงานและรวมมือกัน"
 SOV_international_revolutionary_marxist_centre_faction_name: "ศูนยลัทธิมารกซปฏิวัติสากล"
 SOV_international_revolutionary_marxist_centre_allies_tt: "\nทุกชาติคอมมิวนิสตที่เปนเอกราช ไมใชสตาลินนิสต และอยูในสันติภาพกับ[ROOT.GetName]:"
 SOV_international_revolutionary_marxist_centre_no_allies_tt: "\nทุกชาติคอมมิวนิสตที่เปนเอกราช ไมใชสตาลินนิสต และอยูในสันติภาพกับ[ROOT.GetName]: \n  ไดรับ §Y$SOV_international_socialist_association$§! (ความสัมพันธตอ §Y[ROOT.GetFlag][ROOT.GetName]§! §G+40§!)\n  ไดรับเหตุการณ '§Y[ROOT.GetNameDefCap]เชิญเราเขารวม[ROOT.GetFactionName]§!'"
 SOV_international_revolutionary_marxist_centre_stalinists_tt: "ทุกชาติสตาลินนิสต:"
 SOV_international_revolutionary_marxist_centre_stalinists_lacking_tt: "ทุกชาติสตาลินนิสต: \n ไดรับ §Y$SOV_international_socialist_association$§! (ความสัมพันธตอ §Y[ROOT.GetFlag][ROOT.GetName]§! §R-40§!)"
 SOV_international_revolutionary_marxist_centre_marxism_tt: "ผูนําประเทศของพวกเขารับเอาอุดมการณยอย $marxism$"
 SOV_a_sustainable_economy: "เศรษฐกิจที่ยั่งยืน"
 SOV_a_sustainable_economy_desc: "การหันไปใชนโยบายเศรษฐกิจใหมมาพรอมกับการหันไปผลิตสินคาอุปโภคบริโภคอยางเห็นไดชัด แลกกับความเร็วในการพัฒนาอุตสาหกรรมโดยรวมที่ชาลง หากเราจะแขงขันไดในระยะยาว เราตองปรับเศรษฐกิจไปสูรูปแบบที่ยั่งยืนกวานี้"
 SOV_the_enemies_of_the_people: "ศัตรูของประชาชน"
 SOV_the_enemies_of_the_people_desc: "กองกําลังปฏิกิริยายังคงอยูขางนอกนั่น วางแผนรอวันที่จะลมลางทุกสิ่งที่เราสรางมา เราและพันธมิตรตองเฝาระวังภัยคุกคามนี้ตลอดไป และเตรียมพรอมสําหรับกรณีที่เราตองสูเพื่อปกปองการปฏิวัติ"
 SOV_proclaim_soviet_hegemony: "ประกาศความเปนเจาโลกของโซเวียต"
 SOV_proclaim_soviet_hegemony_desc: "เปนที่ชัดเจนวาระบบการปกครองแบบโซเวียต เศรษฐกิจโซเวียต และสังคมโซเวียต เหนือกวาระบบกอนหนาอยางมหาศาลในทุกดาน ตราบใดที่ระบบลาสมัยเหลานี้ยังคงอยูในสวนอื่นของโลก ก็จะมีผูคนที่พรอมตอตานมันเสมอ และเราควรใชประโยชนจากพวกเขา"
 SOV_first_moscow_trial_flag: "ทําแผนยุทธศาสตร §Y$SOV_the_zinovyevite_terrorist_center$§! สําเร็จแลว"
 SOV_second_moscow_trial_flag: "ทําแผนยุทธศาสตร §Y$SOV_the_anti_soviet_trotskyist_center$§! สําเร็จแลว"
 SOV_trial_of_the_generals_flag: "ทําแผนยุทธศาสตร §Y$SOV_the_military_conspiracy$§! สําเร็จแลว"
 SOV_third_moscow_trial_flag: "ทําแผนยุทธศาสตร §Y$SOV_the_bloc_of_rights_and_trotskyites$§! สําเร็จแลว"
 SOV_last_purge_focus_days_tt: "จํานวนวันปจจุบัน: [?SOV_first_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_military_tt: "จํานวนวันปจจุบัน: [?SOV_second_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_rights_tt: "จํานวนวันปจจุบัน: [?SOV_trial_of_the_generals_flag:days|Y0]"
 SOV_last_purge_focus_days_cult_tt: "จํานวนวันปจจุบัน: [?SOV_third_moscow_trial_flag:days|Y0]"

 SOV_beaten_but_not_defeated: "พายแพ แตไมสิ้นทา"
 SOV_beaten_but_not_defeated_desc: "เปนที่ชัดเจนวาพวกคอมมิวนิสตไดนําประเทศที่เคยภาคภูมิใจของเราไปสูเสนทางอันตราย ไมชาก็เร็ว ประเทศรอบพรมแดนของเราจะสัมผัสไดถึงความออนแอที่ฝงอยูในระบอบนี้และตะครุบเหยื่อ หากเราจะกอบกูมาตุภูมิอันเปนที่รัก เราตองโคนพวกคอมมิวนิสตลงจากอํานาจ!"
 SOV_beaten_but_not_defeated_tt: "เริ่มกระบวนการที่นําไปสู §Y[GetSovietCivilWarName]§! ใน[ROOT.GetNameDef]ระหวางพวกคอมมิวนิสตกับฝายคานพลัดถิ่น"
 SOV_unification_of_the_exiles: "การรวมพลังของผูลี้ภัย"
 SOV_unification_of_the_exiles_desc: "หลังการปฏิวัติและสงครามกลางเมือง หลายคนเลือกลี้ภัยแทนที่จะรับสิ่งที่เรียกวาความยุติธรรมของระบอบใหม พวกเขายังอยูขางนอกนั่น ฝนถึงวันที่รัสเซียจะเปนอิสระอีกครั้ง สวนระบบการเมืองของรัสเซียนั้นจะเปนแบบใดเปนเรื่องรองสําหรับพวกเขา กอนที่เราจะสรางรัฐบาลที่ประเทศตองการได เราตองยึดอํานาจใหไดเสียกอน และเราจะทําไดดีกวาหากรวมมือกัน"
 SOV_womens_fascist_movement: "ขบวนการสตรีฟาสซิสต"
 SOV_womens_fascist_movement_desc: "แมบทบาทของสตรีโดยธรรมชาติคือการดูแลบานอันอบอุนใหสามีไดพักพิง และครอบครัวใหเขาไดตอสูเพื่อปกปอง แตผูชายหลายคนไดลืมหนาที่ที่ตนมีตอประเทศและประชาชนไปแลว สตรีผูทุมเทเพียงไมกี่คนอาจชวยเตือนสามีของตนวาอะไรกําลังเปนเดิมพัน และกระตุนใหพวกเขาทําสิ่งที่ตองทํา"
 SOV_the_true_tsars: "ซารที่แทจริง"
 SOV_the_true_tsars_desc: "ชาวรัสเซียตองการผูนําที่เขมแข็งเสมอมา มิฉะนั้นพวกเขาจะแตกแยกหางกันออกไปเรื่อย ๆ จนพี่รบกับนอง และลูกรบกับพอ แตบรรดาซารในอดีตไมเหมาะกับบทบาทของตน ทั้งออนแอและโลเล ในอนาคต เราตองการซารที่สามารถแบกรับภาระอันหนักอึ้งที่วางอยูบนบาได"
 SOV_national_unification: "การรวมชาติ"
 SOV_national_unification_desc: "หากเราจะอยูรอดจากสงครามที่กําลังจะมาถึง เราจะปลอยใหตัวเองแตกแยกไมได ไมวาเราจะมีความเห็นทางการเมืองแตกตางกันอยางไร ทายที่สุดแลว เราทุกคนลวนเปนชาวรัสเซีย"
 SOV_national_unification_tt: "เพิ่มสิ่งปลูกสราง §Y$arms_factory$§! สองแหงในเมืองหลวงเมื่อ §Y[GetSovietCivilWarName]§! เริ่มตนขึ้น"
 SOV_covert_operations: "ปฏิบัติการลับ"
 SOV_covert_operations_desc: "พวกคอมมิวนิสตมีแนวโนมจะไมไวใจกันและทะเลาะกันเอง หากเราเลนเกมนี้ถูกตอง เราอาจทําใหพวกมันกัดกินกันเองได"
 SOV_covert_operations_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อใสรายสมาชิกพรรคและบุคลากรทางทหาร"
 SOV_embrace_the_black_hundreds: "โอบรับกลุมรอยดํา"
 SOV_embrace_the_black_hundreds_desc: "ยอนไปในสมัยกอน กอนความโกลาหลของการปฏิวัติ มีกลุมคนที่มีความเชื่อ พวกเขาเชื่อในรัสเซียที่เขมแข็ง รัสเซียที่เปนหนึ่งเดียว รัสเซียที่ไมหวาดกลัวตัวเอง พวกเขาถูกเรียกวากลุมรอยดํา แมสมาชิกที่ยังมีชีวิตอยูจะกระจัดกระจายไปในหลายประเทศ แตพวกเขายังคงเชื่อ และเราสามารถตามหาพวกเขาและพากลับมาได"
 SOV_muster_the_old_guard: "รวบรวมองครักษเกา"
 SOV_muster_the_old_guard_desc: "ยังมีอีกหลายคนที่เคยรบเพื่อซารและประเทศชาติ พวกเขาแกตัวและออนลงแลว แตประสบการณที่สงครามสอนนั้นไมมีสิ่งใดทดแทนได หากเราติดตอพวกเขาได พวกเขาจะเปนแกนกลางที่มีประสบการณของกองทัพใหมเมื่อถึงเวลายึดประเทศคืน"
 SOV_approach_semyonov: "ทาบทามเซมิโอนอฟ"
 SOV_approach_semyonov_desc: "$SOV_grigory_semyonov$ รับตําแหนงที่ปรึกษาอยูใน[MAN.GetName] ขณะที่อุดมการณของเราแข็งแกรงขึ้นทุกชั่วโมง เราควรโนมนาวใหเขากลับมา งานแรกของเขาคือการจัดตั้งกองทัพมาอันยิ่งใหญใหจักรวรรดิรัสเซียใหม"
 SOV_approach_semyonov_tt: "§Y$SOV_grigory_semyonov$§! พรอมใหแตงตั้งเปนที่ปรึกษาและนายพลเมื่อ[GetSovietCivilWarName]เริ่มตนขึ้น\nปลดล็อก§Yการตัดสินใจ§!เพื่อเกณฑกองพลทหารมาเพิ่มเติม"
 SOV_fascist_youth_union: "สหภาพเยาวชนฟาสซิสต"
 SOV_fascist_youth_union_desc: "แทนที่จะมองยอนไปในอดีต เราตองมองไปยังอนาคต ไปยังคนหนุมสาวและเทคโนโลยีสมัยใหม เยาวชนฟาสซิสตลุกโชนดวยความปรารถนาจะเห็นรัสเซียกลับคืนสูความรุงโรจนในอดีต สิ่งที่พวกเขาขาดในดานประสบการณ พวกเขาจะชดเชยไดเกินพอดวยความกระตือรือรนลวน ๆ"
 SOV_fascist_youth_union_tt: "เกณฑหนวยทหารราบยานยนตของสหภาพเยาวชนใหเขารวมฝายคุณเมื่อ §Y[GetSovietCivilWarName]§! เริ่มตนขึ้น"
 
 SOV_tolkachi: "ทอลคาชี"
 SOV_tolkachi_desc: "ในเศรษฐกิจโซเวียตมีคนประเภทหนึ่งซึ่งมีหนาที่ทําใหตัวเลขในแผนการผลิตตรงกับตัวเลขที่อุตสาหกรรมผลิตไดจริง หากเราโนมนาวคนเหลานี้ใหทํางานใหเราได เราก็จะสามารถรายงานตัวเลขหนึ่งใหโซเวียต และอีกตัวเลขหนึ่งใหผูจัดการโรงงาน แลวยายสวนตางของผลผลิตไปเก็บไวในที่ที่เก็บไดจนกวาจะถึงเวลา"
 SOV_tolkachi_tt: "เพิ่ม §Y$infantry_equipment$§!, §Y$support_equipment$§! และ §Y$artillery_equipment$§! เมื่อ §Y[GetSovietCivilWarName]§! เริ่มตนขึ้น"
 SOV_organize_wreckers: "จัดตั้งกลุมผูบอนทําลาย"
 SOV_organize_wreckers_desc: "โซเวียตคาดการณไวอยูแลววาจะมีการกอวินาศกรรมมากมายจากสายลับและศัตรูทางชนชั้น การแสดงละครความมั่นคงแมในโรงถลุงเหล็กที่เล็กที่สุดกลับทําใหกรรมกรจํานวนมากหงุดหงิดอยางนาขัน ดังนั้นเราจึงหาคนที่จะพยายามเอาคืนพวกทรราชตัวเล็ก ๆ ในโรงงานของพวกเขาไดไมยาก หากเรามอบเครื่องมือให"
 SOV_south_manchuria_railway: "ทางรถไฟแมนจูเรียใต"
 SOV_south_manchuria_railway_desc: "บริษัททางรถไฟแมนจูเรียใตของญี่ปุนเปรียบเสมือนรัฐซอนรัฐใน[MAN.GetName] ดวยการสนับสนุนจากพวกเขา เรานาจะเตรียมเครือขายเสบียงที่ตองการสําหรับการตอสูที่กําลังจะมาถึงได"
 SOV_the_eyes_fear: "ตาหวาดหวั่น..."
 SOV_the_eyes_fear_desc: "ภารกิจที่รอเราอยูไมใชเรื่องงาย เราตองตอกรกับรัฐบาลที่มีเวลาหลายทศวรรษในการฝงรากลึก และจะไดรับการสนับสนุนจากประชากรสัดสวนไมนอย แตเรารูวาตองทําอะไร ที่เหลือก็แคลงมือทํา"
 SOV_the_hands_do: "...แตมือลงมือทํา"
 SOV_the_hands_do_desc: "ถึงเวลาแลว เราตองอุทิศตนใหกับภารกิจอันศักดิ์สิทธิ์นี้ นั่นคือการขจัดระบอบการปกครองแบบโซเวียตออกจากมาตุภูมิของเรา เพื่อที่วันหนึ่งลูกหลานของเราจะไดเปนอิสระจากเงาทะมึนของลัทธิคอมมิวนิสต"
 SOV_the_hands_do_tt: "§Y$SOV_metropolitan_meletius$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_call_for_aid: "ขอความชวยเหลือ"
 SOV_call_for_aid_desc: "การตอสูกับลัทธิคอมมิวนิสตในรัสเซียเปนสวนหนึ่งของการตอสูที่ใหญกวากับลัทธิคอมมิวนิสตทุกหนแหง แตชัยชนะเหนือลัทธิคอมมิวนิสตในรัสเซียจะเปนการโจมตีถึงตายตอขบวนการคอมมิวนิสตทั่วโลก จึงมีหลายประเทศที่กระตือรือรนจะชวยเหลือเรา"
 SOV_request_imperial_protection: "ขอความคุมครองจากจักรวรรดิ"
 SOV_request_imperial_protection_desc: "ยามคับขันยอมตองใชมาตรการเด็ดขาด หากหนทางเดียวที่จะเอาชนะลัทธิคอมมิวนิสตคือการกมหัวใหฮิโรฮิโตะ ก็จงเปนเชนนั้น วันหนึ่งรัสเซียจะเปนจักรวรรดิของตนเอง แตสําหรับตอนนี้ เราตองการความชวยเหลือจากจักรวรรดิอื่น"
 SOV_request_imperial_protection_tt: "หากยอมรับ: §Y[JAP.GetNameDef]§! เขารวมสงคราม §Y[ROOT.GetNameDefCap]§! กลายเปนรัฐหุนเชิดของ §Y[JAP.GetNameDef]§!"
 SOV_sabotage_behind_enemy_lines: "กอวินาศกรรมหลังแนวขาศึก"
 SOV_sabotage_behind_enemy_lines_desc: "การบริหารผิดพลาดของคอมมิวนิสตมาหลายทศวรรษทําใหผูคนจํานวนมากโกรธแคนและผิดหวังกับรัฐบาลคอมมิวนิสต ในที่ที่พวกคอมมิวนิสตยังยึดกุมอํานาจอยู เราสามารถใชคนเหลานี้เรงความพายแพของพวกมัน"
 SOV_aristocratic_investments: "การลงทุนของชนชั้นสูง"
 SOV_aristocratic_investments_desc: "ยังมีอดีตขุนนางรัสเซียกระจายอยูทั่วโลก และหลายคนครอบครองทรัพยสมบัติมากมาย ทรัพยสินสวนหนึ่งอาจนํามาใชซื้ออาวุธและยุทโธปกรณใหเราได"
 SOV_consolidate_power: "รวบอํานาจ"
 SOV_consolidate_power_desc: "สงครามที่ฉีกชาติของเราออกเปนเสี่ยง ๆ ไดรับชัยชนะแลว เราตองเสริมสถานะของเราใหมั่นคง และกําจัดผูที่กลาตอตานเราอยางเปนระบบ"
 SOV_consolidate_power_tt: "§Y$SOV_nikolay_ustryalov$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_rebuild_the_nation: "ฟนฟูชาติ"
 SOV_rebuild_the_nation_desc: "ประเทศที่บอบชํ้าจากสงครามตองไดรับการฟนฟู ดวยการรณรงคโฆษณาชวนเชื่อ เราจะทําใหทุกคนทั้งชาย หญิง และเด็กรวมมีสวนในความพยายามฟนฟูครั้งนี้"
 SOV_bringing_breakaways_back_to_the_fold: "นําดินแดนที่แยกตัวกลับคืนสูออมอก"
 SOV_bringing_breakaways_back_to_the_fold_desc: "เมื่อยึดคืนประเทศสวนใหญไดแลว ตอนนี้เราตองจัดการกับประเทศที่แยกตัวออกไป พวกเขาคงไมคิดวาเราจะยอมรับการสูญเสียดินแดนของจักรวรรดิรัสเซียไปตลอดกาลหรอกใชไหม?"
 SOV_offer_autonomy_to_former_soviet_republics: "เสนออํานาจปกครองตนเองแกอดีตสาธารณรัฐโซเวียต"
 SOV_offer_autonomy_to_former_soviet_republics_desc: "เราตองยอมรับการสูญเสียดินแดนของจักรวรรดิไปบางสวนเพื่อบรรลุเปาหมาย แตทุกคนตองตระหนักวาดินแดนเหลานี้เปนสวนหนึ่งของเขตอิทธิพลจักรวรรดิรัสเซียอยางแทจริง อยางไรก็ตาม เนื่องจากพวกเขาชวยเรายึดจักรวรรดิคืนมา เราควรเสนออํานาจปกครองตนเองบางสวนเพื่อแสดงความขอบคุณ"

 SOV_restore_the_glory_of_the_motherland: "ฟนฟูความรุงโรจนแหงมาตุภูมิ"
 SOV_restore_the_glory_of_the_motherland_desc: "ภายใตการนําใหมของเรา เราจะทําใหรัสเซียรุงโรจนยิ่งกวาที่เคยเปนมา! เราจะเริ่มโครงการกอสรางครั้งใหญทุกประเภท และทําใหชาติของเราเปนที่อิจฉาของโลกตะวันตก!"
 SOV_article_124: "มาตรา 124"
 SOV_article_124_desc: "[SOV.GetArticle124Desc]"
 SOV_ARTICLE_124_DESC_COMMUNIST: "เปนไปไดวาในการไลตามอุดมการณมารกซ-เลนิน เราอาจ... เขมงวดเกินไปในการกดขี่ศาสนา บางทีศาสนาอาจยังมีบทบาทในสังคมโซเวียต รัฐธรรมนูญฉบับใหมของเราจะมีมาตราที่รับประกันเสรีภาพในการนับถือศาสนาสําหรับพลเมืองโซเวียตทุกคน"
 SOV_ARTICLE_124_DESC_EXILES: "พวกคอมมิวนิสตอางวาพวกเขาเพียงแยกศาสนจักรออกจากรัฐ แตในความเปนจริง พวกเขามุงกําจัดศาสนจักรออกจากชีวิตของผูคน หลายศตวรรษที่ผานมา ศาสนจักรเปนสวนสําคัญของสังคมรัสเซีย และจะตองกลับมาเปนเชนนั้นอีกครั้ง"
 SOV_reopen_novodevichi: "เปดโนโวเดวิชีอีกครั้ง"
 SOV_reopen_novodevichi_desc: "ศาสนจักรถูกปดกั้นไมใหฝกนักบวชใหมมานาน เพื่อฟนฟูศาสนจักร เราตองสรางสถานที่ที่ศาสนจักรสามารถอบรมนักบวชและนักพรตรุนตอไป อารามเกาโนโวเดวิชีดูจะเปนตัวเลือกที่ชัดเจน"
 SOV_rebuild_the_savior_cathedral: "สรางมหาวิหารพระผูไถขึ้นใหม"
 SOV_rebuild_the_savior_cathedral_desc: "[SOV.GetRebuildtheSaviorCathedralDesc]"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_COMMUNIST: "ในป 1931 มหาวิหารพระคริสตผูไถอันหรูหราฉูดฉาดถูกระเบิดทิ้งเพื่อเปดทางใหกับ "วังแหงโซเวียต" อันยิ่งใหญ ขณะที่เงาแหงสงครามปกคลุมยุโรป เราไมนาจะมีทรัพยากรเพียงพอสรางสิ่งกอสรางมหึมานี้ การบูรณะมหาวิหารเกาจะเปนการยื่นชอมะกอกที่เหมาะสมใหกับประชากรสวนที่นับถือศาสนา"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_EXILES: "ในป 1931 มหาวิหารพระคริสตผูไถอันงดงามถูกระเบิดทิ้งเพื่อเปดทางใหกับ "วังแหงโซเวียต" อันหรูหราฉูดฉาด เหตุใดสังคมที่อางวาสรางขึ้นบนแนวคิดความเทาเทียมจึงตองการวัง ยังคงเปนคําถามที่ไมมีคําตอบ บัดนี้เมื่อเรากลับมามีอํานาจ เราควรแกไขอาชญากรรมอันเลวรายนี้และเริ่มบูรณะมหาวิหารขึ้นใหม"
 SOV_the_synod: "สมัชชาสงฆ"
 SOV_the_synod_desc: "เมื่อเซมินารีในโนโวเดวิชีเปดอีกครั้ง พวกเขาควรไดรับการสนับสนุนใหจัดสมัชชาสงฆ เพื่อหารือเรื่องความเชื่อที่เกิดขึ้นนับตั้งแตครั้งสุดทายที่พวกเขาไดรับอนุญาตใหจัดการประชุมเชนนี้"
 SOV_the_declaration: "คําประกาศ"
 SOV_the_declaration_desc: "[SOV.GetTheDeclarationDesc]"
 SOV_THE_DECLARATION_DESC_COMMUNIST: "ใน 'คําประกาศ' อันโดงดังเมื่อป 1927 อัครบิดรเซอรเกียสไดปฏิญาณความภักดีตอสหภาพโซเวียต แมจะมีความแตกตางทางศาสนาระหวางศาสนจักรกับรัฐ บางทีถึงเวลาแลวที่เราจะเปดใหบรรดามหานครบิชอปที่สนับสนุนคําประกาศนี้มีบทบาทตอสาธารณะมากขึ้น"
 SOV_THE_DECLARATION_DESC_EXILES: "'คําประกาศ' อันอื้อฉาวของอัครบิดรเซอรเกียสเมื่อป 1927 ไดปฏิญาณความภักดีตอสหภาพโซเวียต แมจะมีความแตกตางทางศาสนา แมจะเปนการกระทําที่ขลาดเขลา แตโครงสรางของศาสนจักรออรทอดอกซรัสเซียยังพึ่งพาผูที่สนับสนุนคําประกาศนี้ เราจึงไมมีทางเลือกนอกจากตอนรับพวกเขากลับเขามา"
 SOV_the_declaration_tt: "§Y$SOV_patriarch_sergy$§!, §Y$SOV_metropolitan_nikolay$§! และ §Y$SOV_metropolitan_aleksy$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_return_of_the_rocor: "การกลับมาของ ROCOR"
 SOV_return_of_the_rocor_desc: "ศาสนจักรออรทอดอกซรัสเซียนอกรัสเซียประกอบดวยผูลี้ภัยที่เลือกลี้ภัยหลังสงครามกลางเมืองรัสเซีย แทนที่จะละทิ้งความเชื่อและหลักการของตน บัดนี้เมื่อรัฐบาลคอมมิวนิสตที่บีบใหพวกเขาตองพลัดถิ่นพายแพไปแลว ก็ถึงเวลาที่จะตอนรับพวกเขากลับบานและคืนสถานะให"
 SOV_the_return_of_the_rocor_tt: "§Y$SOV_metropolitan_anastasy$§! พรอมใหแตงตั้งเปนที่ปรึกษา"
 SOV_the_third_rome_tt_2: "§Yมหานครบิชอปเมเลติอุส§! จะไดรับการขนานนามวา §Yอัครบิดรเมเลติอุส§!"
 SOV_reformalize_the_role_of_the_patriarchate: "ฟนฟูบทบาทของสํานักอัครบิดรอยางเปนทางการ"
 SOV_reformalize_the_role_of_the_patriarchate_desc: "[SOV.GetReformalizetheRoleofthePatriarchateDesc]"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_COMMUNIST: "นับตั้งแตกาวแรกดวยมาตรา 124 สถานะของศาสนจักรในสหภาพของเราก็กาวหนาไปมาก เปนที่ชัดเจนวาศาสนจักรไมอาจถูกขจัดออกจากสังคมโซเวียตได บางทีเราควรโอบรับและมอบตําแหนงศูนยกลางในชีวิตของกรรมกรโซเวียตใหศาสนจักรอีกครั้ง"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_EXILES: "สํานักอัครบิดรถูกผลักไสไปอยูในเงามืดของลัทธิคอมมิวนิสตมานานเกินไปแลว ถึงเวลาที่จะกลับมาครองตําแหนงอันชอบธรรมใจกลางสังคมและวัฒนธรรมรัสเซียอยางเปนทางการอีกครั้ง"
 SOV_reconvene_the_zemsky_sobor: "เรียกประชุมเซมสกีโซบอรอีกครั้ง"
 SOV_reconvene_the_zemsky_sobor_desc: "ในอดีตกาล ชาวรัสเซียจะมาชุมนุมกันในรูปแบบของรัฐสภาที่เรียกวาเซมสกีโซบอร เพื่อหารือและตัดสินปญหาตาง ๆ จนกวาเราจะตัดสินใจไดวาจะนําประเทศไปในทิศทางใด เราควรใหประชาชนตัดสินเรื่องที่เกี่ยวของกับพวกเขาทุกคน"
 SOV_recognized_country_tt: "§Y[ROOT.GetNameDefCap]§! ไดรับการรับรองจากประชาคมระหวางประเทศ:"
 SOV_reconvene_the_zemsky_sobor_tt: "§Y$SOV_aleksandr_kazembek$§! และ §Y$SOV_anastasy_vonsyatsky$§! กลับจากการลี้ภัย"
 SOV_dismantle_the_zemsky_sobor: "ยุบเซมสกีโซบอร"
 SOV_dismantle_the_zemsky_sobor_desc: "เซมสกีโซบอรไดทําหนาที่ของตนเสร็จสิ้นแลว ประชาธิปไตยที่มากเกินไปอาจเปนอันตราย ดังที่เห็นในป 1917 เราไมควรทําผิดซํ้ารอยอดีต"
 SOV_religious_primacy: "ความเปนเลิศของศาสนา"
 SOV_religious_primacy_desc: "ความสําคัญของศาสนาในสังคมของเรานั้นไมอาจกลาวเกินจริงได ถึงเวลาที่รัฐจะยอมรับและสนับสนุนความเปนเลิศนี้ และกาวแรกสูการรวมศาสนจักรกับรัฐเขาดวยกัน"
 SOV_romanov_reconstruction: "การฟนฟูราชวงศโรมานอฟ"
 SOV_romanov_reconstruction_desc: "ในที่สุดชาติของเราก็มีซารปกครองอีกครั้ง สองทศวรรษหลังการประหัตประหารผูปกครองอันชอบธรรมพระองคสุดทายของประเทศ บัดนี้ถึงเวลาที่จะโอบรับราชวงศผูปกครองของเราอีกครั้ง และขจัดอุปสรรคเล็ก ๆ นอย ๆ ตอการปฏิบัติตามพระประสงคของซาร"
 SOV_church_candidates: "[SOV.GetChurchCandidatesName]"
 SOV_church_candidates_desc: "[SOV.GetChurchCandidatesDesc]"
 SOV_CHURCH_CANDIDATES_NAME_TSARIST: "ผูสมัครจากศาสนจักร"
 SOV_CHURCH_CANDIDATES_NAME_FASCIST: "ความเปนเลิศของศาสนา"
 SOV_CHURCH_CANDIDATES_DESC_TSARIST: "ศาสนจักรไดขออนุญาตสงผูสมัครของตนเองลงเลือกตั้งเซมสกีโซบอรในอนาคต เพื่อเปนการยอมรับบทบาทสําคัญของสํานักอัครบิดรในสังคมรัสเซีย เราจึงตัดสินใจอนุมัติ ปูทางไปสูความเปนไปไดที่จะหลอมรวมพระประสงคของพระเจาเขากับพระประสงคของผูปกครองอยางแทจริง"
 SOV_CHURCH_CANDIDATES_DESC_FASCIST: "ความสําคัญของศาสนาในสังคมของเรานั้นไมอาจกลาวเกินจริงได ถึงเวลาที่รัฐจะยอมรับและสนับสนุนความเปนเลิศนี้ และกาวแรกสูการรวมศาสนจักรกับรัฐเขาดวยกัน"
 SOV_reinstitute_the_mestnichestvo: "ฟนฟูระบบเมสตนิเชสตโว"
 SOV_reinstitute_the_mestnichestvo_desc: "ในอดีต ตระกูลที่เกาแกและมีเกียรติที่สุดเปนผูบริหารกิจการบานเมือง ซึ่งทําใหชนชั้นนําภักดีตอรัฐที่ตนบริหาร และคนรุนใหมแตละรุนจะถูกเลี้ยงดูตามมาตรฐานอันเขมงวดของคนรุนเกา เราควรฟนฟูระบบนี้เพื่อสรางความมั่นคงใหระบอบใหมของเรา"
 SOV_my_brothers_keeper: "ผูดูแลพี่นองของขา"
 SOV_my_brothers_keeper_desc: "ราชวงศโรมานอฟเดิมมีความสัมพันธทางเครือญาติกับตระกูลขุนนางอื่นอีกมาก บางตระกูลยังคงมีอํานาจ บางตระกูลสูญเสียบัลลังกไปแลว บัดนี้เมื่อเราฟนฟูระบอบกษัตริยของเราเองไดแลว เราควรทําใหแนใจวาผูปกครองที่ถูกตองไดขึ้นครองในประเทศอื่นเหลานั้นดวย"
 SOV_the_rightful_heir_to_the_empire: "ทายาทอันชอบธรรมแหงจักรวรรดิ"
 SOV_the_rightful_heir_to_the_empire_desc: "แมจักรวรรดิไบแซนไทนจะลมสลายไปนานแลว แตก็ยังตองมีใครสักคนปกปองผูแสวงบุญที่เดินทางสูดินแดนศักดิ์สิทธิ์ เปนที่ชัดเจนวาอังกฤษและฝรั่งเศสไมอาจทําหนาที่นี้ได หนาที่นี้จึงควรตกเปนของเราอยางชัดเจน"
 SOV_the_third_rome: "โรมที่สาม"
 SOV_the_third_rome_desc: "เมื่อบทบาทผูพิทักษสถานที่ศักดิ์สิทธิ์ของเรามั่นคงแลว เราคือผูปกปองศรัทธาที่ไมมีใครโตแยงได จึงสมควรแลวที่เราจะเรียกขานตนเองเชนนั้น หลังการลมสลายของคอนสแตนติโนเปล มอสโกไดกลายเปนโรมที่สามอยางไมตองสงสัย"
 SOV_the_third_rome_tt: "§Y$SOV_metropolitan_meletius$§! จะไมสามารถแตงตั้งเปนที่ปรึกษาไดอีกตอไป"
 SOV_vengeance_for_the_yoke: "ลางแคนใหแอกตาตาร"
 SOV_vengeance_for_the_yoke_desc: "หลายศตวรรษกอน ชาวมองโกลบุกรุกรานดินแดนรัสเซียอยางโหดราย พวกเขายังคงเปนชนชาติเดียวที่อาจกลาวไดวาเคยพิชิตรัสเซียไดอยางแทจริง ตอนนี้พวกเขาอาจดูออนแอ แตเราตองทําใหแนใจวาพวกเขาจะไมมีวันกลับมาแข็งแกรงดังเดิม เพื่อที่เราจะไมตองรูสึกถึงแอกตาตารอีกเลย"
 SOV_reclaim_uryankhay_krai: "ยึดคืนดินแดนอูเรียนไค"
 SOV_reclaim_uryankhay_krai_desc: "ในการปฏิวัติมองโกเลียป 1911 สาธารณรัฐอูเรียนไคและขานาตบ็อกดแหงมองโกเลียแยกตัวออกจากจักรวรรดิชิง และเราไดเขาไปปกปองพวกเขา เปลี่ยนภูมิภาคอูเรียนไคใหเปนดินแดนของ[ROOT.GetAdjective] แตดวยความวุนวายจากสงครามกลางเมืองเมื่อไมนานมานี้ ดูเหมือนวาพวกเขาตองการเอกราชจากเรา ซึ่งเราตองไมมอบให มิฉะนั้นมหาอํานาจโลกจะดูแคลนเราไปอีกหลายศตวรรษ!"
 SOV_westward_bound: "มุงสูตะวันตก"
 SOV_westward_bound_desc: "ดินแดนทางตะวันตกจํานวนมากของเราสูญเสียไปพรอมการลมสลายของจักรวรรดิอันเนื่องมาจากการปฏิวัติ ถึงเวลาแลวที่จะสรางโครงสรางพื้นฐานเพื่อเตรียมยึดดินแดนอันชอบธรรมของเราคืน"
 SOV_the_old_enemy: "ศัตรูเกา"
 SOV_the_old_enemy_desc: "เปนเวลาหลายปที่สวีเดนเปนหนามยอกอกของจักรวรรดิ พวกเขาโจมตีรัสเซียครั้งแลวครั้งเลาและพยายามตั้งแนวรวมตอตานเรา ซารปเตอรที่ 1 เริ่มผลักดันพวกเขากลับไปเปนคนแรก โดยเอาชนะที่โปลตาวา ในป 1809 เราเอาชนะพวกเขาไดอีกครั้ง ซึ่งนาจะทําใหพวกเขารูที่ทางของตน แตพวกเขาก็ยังพยายามแยงชิงผลประโยชนของเราในภูมิภาคบอลติก ถึงเวลาแลวที่จะบดขยี้ชาติเล็ก ๆ นี้ใหสิ้นซากเสียที"
 SOV_secure_finland: "ยึดครองฟนแลนด"
 SOV_secure_finland_desc: "ราชรัฐฟนแลนดคอยพิทักษพรมแดนทางเหนือของเรามากวาหนึ่งศตวรรษ จนกระทั่งแยกตัวออกไปในสงครามกลางเมือง วันที่จะรวมฟนแลนดกลับคืนสูมาตุภูมิมาถึงแลว"
 SOV_secure_the_baltics: "ยึดครองบอลติก"
 SOV_secure_the_baltics_desc: "ภูมิภาคบอลติกเปนสวนสําคัญของรัสเซียมาชานาน พวกเขาแยกตัวออกไปในชวงที่ชาติออนแอ และตองไดรับการยึดคืนโดยเร็วที่สุด"
 SOV_panslavic_nationalism: "ชาตินิยมสลาฟนิยม"
 SOV_panslavic_nationalism_desc: "รัสเซียเปนพี่ใหญที่สุดและอาวุโสที่สุดในครอบครัวสลาฟมาชานาน หากมีบทเรียนหนึ่งที่เราควรเรียนรูมานานแลว นั่นคือชาวสลาฟจะถูกโจมตี ถูกรังแก และถูกกดขี่เสมอ เวนแตเราจะรวมตัวกัน"
 SOV_panslavic_nationalism_tt: "§Rประเทศตาง ๆ ตองเห็นชอบขอตกลงกอนโบนัสจึงจะมีผล§!\n"
 SOV_pacify_the_rim: "สรางความสงบในแนวขอบแปซิฟก"
 SOV_pacify_the_rim_desc: "เราจะปลอยใหสงครามป 1905 เกิดซํ้าไมได เมื่อครั้งที่ดินแดนตะวันออกไกลของเราถูกโจมตีและไมไดเตรียมพรอมรับมือการบุกอยางนาเวทนา เราตองลงทุนในโครงสรางพื้นฐานทองถิ่น เพื่อใหเคลื่อนยายกําลังพลไดอยางรวดเร็วเมื่อจําเปน"
 SOV_eastern_expansion: "การขยายดินแดนสูตะวันออก"
 SOV_eastern_expansion_desc: "อนาคตของรัสเซียอยูทางตะวันออก หลังจากเราพิชิตไซบีเรียไดแลว ก็สมควรแลวที่เราจะพยายามแสวงหาดินแดนและทรัพยากรเพิ่มเติมที่นี่"
 SOV_restore_the_old_eastern_empire: "ฟนฟูจักรวรรดิตะวันออกเดิม"
 SOV_restore_the_old_eastern_empire_desc: "ครั้งหนึ่งจักรวรรดิอันรุงโรจนของเราเคยแผขยายไปตามขอบมหาสมุทรแปซิฟก รุกลึกเขาไปในทวีปอเมริกา การตัดสินใจที่ไมรอบคอบนับแตนั้นไดแลกดินแดนเหลานี้กับผลประโยชนทางการเงินระยะสั้น แตภายใตการนําของเรา รัสเซียอาจทวงคืนดินแดนในทวีปอเมริกาไดอีกครั้ง เราเพียงตองทําใหเจาของปจจุบันถอนตัวออกไป"
 SOV_intervention_in_the_americas: "การแทรกแซงในทวีปอเมริกา"
 SOV_intervention_in_the_americas_desc: "ชาติเล็ก ๆ จํานวนมากในแคริบเบียนและละตินอเมริกาโดยรวมถูกรุมเราดวยรัฐบาลที่ไมมั่นคงมานาน ถึงเวลาที่เราจะแสดงพลังทางการเมืองและ 'สงเสริม' ใหการเมืองภายในของพวกเขาพัฒนาไปในทิศทางที่เขมแข็งและมีเสถียรภาพ เมื่อพวกเขามีรัฐบาลที่มีแนวคิดเดียวกับเรา พวกเขาจะไดรับขอเสนอใหเขารวมพันธมิตรทางทหารที่กําลังเติบโตของเรา"
 SOV_intervention_in_the_americas_tt: "ประเทศที่ไดรับอิทธิพลมีแนวโนมจะกลายเปนฟาสซิสตมากขึ้น\nประเทศที่กลายเปนฟาสซิสตจากอิทธิพลนี้จะไดรับเชิญเขารวมฝายของเรา"
 SOV_memories_of_1905: "ความทรงจําแหงป 1905"
 SOV_memories_of_1905_desc: "สงครามป 1905 ยังคงเปนรอยดางในความทรงจํารวมของประชาชนเรา เราตองใชประโยชนจากสิ่งนี้ ปลุกเรากรรมกรใหทุมเทครั้งใหญเพื่อสรางกองเรือใหมที่จะครองแปซิฟก และโหมไฟแหงความเกลียดชังของพวกเขา เพื่อใหพวกเขาเรียกรองใหใชกองเรือนั้นแกแคนศัตรูเกาของเรา"
 SOV_rebuild_the_far_eastern_fleet: "สรางกองเรือตะวันออกไกลขึ้นใหม"
 SOV_rebuild_the_far_eastern_fleet_desc: "หากเราจะรักษาผลประโยชนในตะวันออกไกล ไมตองพูดถึงการรุก เราตองขยายกําลังการตอเรือและการซอมบํารุงในภูมิภาคนี้อยางมหาศาล"
 SOV_modernize_the_far_eastern_fleet: "ปรับปรุงกองเรือตะวันออกไกลใหทันสมัย"
 SOV_modernize_the_far_eastern_fleet_desc: "ซึชิมะสอนเราวาเราไมอาจพึ่งพาจํานวนได เพื่อจะชนะการรบทางเรืออยางแทจริง เราตองมีลูกเรือที่ฝกมาอยางดีและเรือรบสมัยใหมไรที่ติใหพวกเขาใช กองเรือใหมที่เราสรางตองสามารถตอกรกับกองเรือของศัตรูที่กาวหนาทางเทคโนโลยีในแปซิฟกได"
 SOV_the_lonely_island: "[SOV.GetLonelyIslandName]"
 SOV_the_lonely_island_desc: "[SOV.GetLonelyIslandDesc]"
 SOV_THE_LONELY_ISLAND_NAME_NORMAL: "เกาะโดดเดี่ยว"
 SOV_THE_LONELY_ISLAND_NAME_INDEPENDENCE: "มหาสงครามรักชาติเพื่อเอกราช"
 SOV_THE_LONELY_ISLAND_DESC_NORMAL: "ถึงเวลาแลวที่เราจะชําระความอัปยศที่ญี่ปุนกอไวกับเราในป 1905 คราวนี้จะไมมีสิ่งใดหยุดเราจากการครองทะเลญี่ปุนและทําใหพวกเขาตองคุกเขา!"
 SOV_THE_LONELY_ISLAND_DESC_INDEPENDENCE: "ราคาที่เราจายไปเพื่อแลกกับความชวยเหลือจาก[JAP.GetAdjective]ในสงครามกลางเมืองนั้นสูงเกินไปมาก พอกันที! เราจะทวงเอกราชคืนไมวาตองแลกดวยอะไร"
 SOV_an_empire_in_the_pacific: "จักรวรรดิในแปซิฟก"
 SOV_an_empire_in_the_pacific_desc: "ขณะที่จักรวรรดิของเราเริ่มแผขยายขามแปซิฟก การออกแบบเรือของเราก็ตองปรับตาม เพื่อใหสามารถแผอํานาจและอิทธิพลไปทั่วผืนมหาสมุทรอันกวางใหญนี้ได"
 SOV_dismantle_the_zemsky_sobor_tt: "ครึ่งหนึ่งของการสนับสนุน§Yที่ไมใชฟาสซิสต§!ในปจจุบันจะถูกนํามาใชเปนบทลงโทษ§Rเสถียรภาพ§!:\n"
 SOV_an_empire_in_the_pacific_tt: "ไดรับ§Gการอางสิทธิ์§!ในทุกรัฐของ§Yมหาจีน§!"
 SOV_capital_of_the_tsars: "ราชธานีแหงซาร"
 SOV_capital_of_the_tsars_desc: "ตลอดประวัติศาสตร เซนตปเตอรสเบิรกเปนเมืองหลวงของชาติอันภาคภูมิของเรา บัดนี้เมื่อพระราชวังฤดูหนาวมีโรมานอฟประทับอีกครั้ง ถึงเวลาที่จะยายเมืองหลวงอยางเปนทางการกลับมายังนครอันงดงามแหงนี้ และทุมเทความพยายามทั้งหมดเพื่อเสริมความรุงเรืองของนคร"
 SOV_capital_of_the_tsars_tt: "ซึ่งให:\nความเร็วการกอสรางในพื้นที่: §G+25%§!"
 SOV_the_iron_wall_of_russian_resolve: "กําแพงเหล็กแหงความมุงมั่นของรัสเซีย"
 SOV_the_iron_wall_of_russian_resolve_desc: "ซารทรงวาดภาพการสรางกองทัพอาวุธสงครามมหึมาที่จะทําใหรถถังที่มีอยูดูเล็กจอย และไรเทียมทานในสนามรบ ชาวรัสเซียไมเคยถูกพิชิต และไมมีวันถูกพิชิต! จักรกลเหลานี้จะเปนรูปธรรมของความมุงมั่นนั้น และทุกกองทัพที่บุกมาจะแตกพายตอหนามัน"
 SOV_the_triple_entente: "หลอมไตรภาคีขึ้นใหม"
 SOV_the_triple_entente_desc: "ศัตรูเกาของเราในยุโรปกลางตองถูกปดลอม ครั้งหนึ่งเคยมีพันธมิตรที่ตั้งขึ้นเพื่อจุดประสงคนี้ แตการถอนตัวอยางนาอับอายของเราจากมหาสงครามทําใหมันสิ้นสุดลง ถึงเวลาแลวที่จะหลอมสายสัมพันธเหลานั้นขึ้นใหม"
 SOV_our_slavic_commitments: "พันธะตอชาวสลาฟ"
 SOV_our_slavic_commitments_desc: "ครั้งหนึ่งเราเคยเปนผูพิทักษชาวสลาฟทั้งปวง ถึงขั้นเขารวมมหาสงครามเพื่อปกปองพี่นองชาวสลาฟที่ออนแอกวา ถึงเวลาแลวที่เราจะรับบทบาทนี้อีกครั้ง และใชแสนยานุภาพทางทหารปกปองพวกเขา"
 SOV_the_fate_of_romania: "ชะตากรรมของโรมาเนีย"
 SOV_the_fate_of_romania_desc: "โรมาเนียมีชนกลุมนอยชาวสลาฟจํานวนมาก และขวางเสนทางทางบกของเราไปยังชาวสลาฟในบอลขาน เพื่อแกปญหาทั้งสองในคราวเดียว เอกราชของโรมาเนียตองสิ้นสุดลง ดวยกําลังทหารหากจําเปน"
 SOV_russian_corporate_state: "รัฐบรรษัทรัสเซีย"
 SOV_russian_corporate_state_desc: "อนาคตของรัสเซียไมไดอยูที่ความขัดแยงทางชนชั้น แตอยูที่ความรวมมือระหวางชนชั้น ดวยเหตุนี้ รัฐจะจัดตั้งสหภาพแหงชาติเพื่อประสานผลประโยชนของแรงงานและทุน และควบคุมการผลิตผานสหภาพเหลานี้"
 SOV_the_berlin_moscow_axis: "อักษะเบอรลิน-มอสโก"
 SOV_the_berlin_moscow_axis_desc: "เมื่อรัฐบาลใหมของเราตั้งมั่นตามแบบอยางของเยอรมนีและอิตาลีแลว เราควรยื่นมือไปฟนฟูความสัมพันธเดิมกับเพื่อนบานทางตะวันตก หากเรามุงเนนทัศนะที่เรามีรวมกัน เราอาจสรางพันธมิตรที่แข็งแกรงและยั่งยืนระหวางเรากับ[GER.GetName]ได"
 SOV_japanese_overtures: "ทาบทามญี่ปุน"
 SOV_japanese_overtures_desc: "เมื่อปกตะวันตกของเรามั่นคงแลว เราตองดูแลปกตะวันออก ญี่ปุนมีอะไรหลายอยางคลายกับเยอรมัน และคลายกับรัฐบาลใหมของเรามากกวาที่พวกเขาอาจอยากยอมรับ มาสอบถามดูวาเยอรมันคิดอยางไรกับการสงคําเชิญไปยังพวกเขา"
 SOV_into_central_asia: "รุกสูเอเชียกลาง"
 SOV_into_central_asia_desc: "การพิชิตเอเชียกลางจะทําใหเราอยูในตําแหนงที่คุกคามอินเดียได พรอมทั้งไดชองทางเขาสูอาวเปอรเซีย ความจําเปนทางยุทธศาสตรนั้นชัดเจน และจักรวรรดิของเราจะไมจบชีวิตลงที่นี่"
 SOV_the_last_break_southward: "การบุกลงใตครั้งสุดทาย"
 SOV_the_last_break_southward_desc: "การพิชิตชุดสุดทายจะยึดเอเชียตะวันตกที่เหลือและชองแคบบอสพอรัสไดในที่สุด ทําใหเราชวงชิงการควบคุมจากอินเดียไดโดยที่ปกของเราปลอดภัย ในที่สุดเราจะไดเขาถึงทะเลอยางไมมีใครโตแยง ตั้งแตทะเลเมดิเตอรเรเนียนที่อยูใกลไปจนถึงมหาสมุทรอินเดีย"
 modify_the_red_army_tt: "ปรับ §Yกองทัพแดง§! ดังนี้:"
