 #Latvia
 LAT_suspend_the_constitution: "ระงับรัฐธรรมนูญลัตเวีย"
 LAT_suspend_the_constitution_desc: "รัฐธรรมนูญลัตเวียลงนามในป 1922 เพื่อบัญญัติสิทธิประชาธิปไตยของเราเปนกฎหมาย อยางไรก็ตาม เมื่อสงครามใกลเขามา เห็นไดชัดวารัฐธรรมนูญหมดประโยชนแลว และตองถูกระงับหากเราจะรอดพนวิกฤตนี้"
 LAT_appease_democrats: "เอาใจฝายประชาธิปไตย"
 LAT_appease_democrats_desc: "แมวิธีการของเราจะไมเปนประชาธิปไตย แตแรงจูงใจของเราคือเพื่อสาธารณรัฐ เราตองทําใหฝายคานสายประชาธิปไตยเขาใจวาเรามีแตสิ่งที่ดีที่สุดสําหรับลัตเวียอยูในใจ และบางทีการเรียกประชุมไซเอมาอีกครั้งอาจทําใหพวกเขาตระหนักถึงเจตนาที่แทจริงของเรา"
 LAT_renew_kviesis_term: "ตอวาระของควีเอซิส"
 LAT_renew_kviesis_term_desc: "อัลแบรตส ควีเอซิสพิสูจนแลววาเปนนายกรัฐมนตรีที่มีความสามารถ และแมเขาจะเปนซากที่หลงเหลือจากรัฐบาลประชาธิปไตยเกา แตเขาก็ยอมอยูใตและภักดีตออุลมานิสไมแพใครในคณะรัฐมนตรี ฝายประชาธิปไตยคงยินดีที่เห็นเราตอวาระใหเขา"
 LAT_martial_prime_minister: "นายกรัฐมนตรีสายทหาร"
 LAT_martial_prime_minister_desc: "ควีเอซิสมีประโยชนในยามสงบ แตบัดนี้สงครามใกลเขามา และเราตองการทหารมาปกครองประชาชน ยานิส บาโลดิสคือผูสมัครในอุดมคติสําหรับบทบาทนี้"
 LAT_establish_chambers_of_professions: "จัดตั้งสภาวิชาชีพ"
 LAT_establish_chambers_of_professions_desc: "ไซเอมาแบงประชาชนตามแนวภูมิภาค แตเรารูวานี่ไมใชวิธีเดียวที่จะแบงประชาชนได การจัดตั้งสภาวิชาชีพจะทําใหประชาชนมีผูแทนไมใชตามทองถิ่นที่อยู แตตามวิชาชีพของตน"
 LAT_restore_saeima: "ฟนฟูไซเอมา"
 LAT_restore_saeima_desc: "ไซเอมาคือสภาผูแทนทองถิ่นของลัตเวีย และแมจะไมไดบริหารรัฐบาลของเราอีกตอไป เราก็อาจเปดไซเอมาอีกครั้งในบทบาทที่ปรึกษาแกระบอบเผด็จการ เพื่อใหประชาชนไดภาพลวงของประชาธิปไตย"
 LAT_what_is_socialism: "สังคมนิยมลัตเวีย"
 LAT_what_is_socialism_desc: "ปจจุบันพรรคสังคมประชาธิปไตยแหงลัตเวียไดรับความนิยมสูงสุดในไซเอมาอยางทิ้งหาง และผูติดตามของฟริตซิส เมนเดอรสก็มีจํานวนมากและสงเสียงดัง บางทีการนําการปฏิรูปบางสวนของเขามาใชอาจทําใหกรรมกรลัตเวียไดสภาพแวดลอมการทํางานที่ดีขึ้นและมีผลิตภาพมากขึ้น"
 LAT_what_is_capitalism: "ทุนนิยมโดยรัฐ"
 LAT_what_is_capitalism_desc: "เมื่อสภาวิชาชีพไดรับการจัดตั้งอยางมั่นคงแลว ก็ถึงเวลาที่เราจะเขาควบคุมเศรษฐกิจโดยตรง แมเศรษฐกิจของเราจะยังคงเปนทุนนิยมโดยธรรมชาติ แตถึงเวลาแลวที่ระบอบเผด็จการจะเขาควบคุมอุตสาหกรรมสําคัญ"
 LAT_integrate_farmers_party: "ผนวกรวมพรรคชาวนา"
 LAT_integrate_farmers_party_desc: "ละครประชาธิปไตยนี้ดําเนินมานานพอแลว ถึงเวลาที่เราจะผนวกรวมพรรคชาวนาเขากับระบอบเผด็จการ และกําจัดพรรคอื่นทั้งหมดออกจากรัฐบาล"
 LAT_nationalised_industry: "อุตสาหกรรมของรัฐ"
 LAT_nationalised_industry_desc: "เศรษฐศาสตรทุนนิยมหมดยุคแลว นี่คือยามสงคราม และเราตองทําใหมั่นใจวารัฐบาลควบคุมเศรษฐกิจไดอยางมั่นคง"
 LAT_merge_presidential_titles: "รวมตําแหนงประธานาธิบดี"
 LAT_merge_presidential_titles_desc: "บาโลดิสกําลังมีอิทธิพลในรัฐบาลมากจนนาอันตราย และบางทีเวลาของเขาในฐานะผูปกครองรวมควรสิ้นสุดลง มีเพียงอุลมานิสเทานั้นที่รูหนทางรักษารัฐลัตเวียใหมั่นคง"
 LAT_improve_military_life: "ปรับปรุงชีวิตทหาร"
 LAT_improve_military_life_desc: "หากเราตองการใหผูคนสูและตายเพื่อลัตเวีย เราตองมอบวิถีชีวิตที่คุมคาแกการสูและตายใหพวกเขา ซึ่งทําไดดวยเสบียงอาหารที่ดีขึ้น และคําสัญญาถึงชีวิตที่ดีเมื่อชนะสงคราม"
 LAT_military_diarchy: "ระบอบสองผูนําแบบทหาร"
 LAT_military_diarchy_desc: "อิทธิพลของบาโลดิสในรัฐบาลเติบโตมากจนหลายคนเชื่อวาระบอบเผด็จการแทจริงแลวเปนการปกครองรวมระหวางกองทัพกับอุลมานิส คงเปนการฉลาดหากเราจะทําใหความเขาใจผิดนี้เปนจริง และมอบอํานาจควบคุมรัฐบาลแกบาโลดิสมากขึ้น"
 LAT_military_dictatorship: "เผด็จการทหาร"
 LAT_military_dictatorship_desc: "ปฏิเสธไมไดวาอุลมานิสเปนผูนําในนามที่มีประโยชนและเปนที่นิยม แตบางทีในยามที่ความขัดแยงกําลังทวีขึ้นเชนนี้ จะดีที่สุดหากเขาเปนเพียงแคนั้น คือผูนําในนาม การปกครองควรปลอยใหเปนหนาที่ของกองทัพแตเพียงผูเดียว"
 LAT_beyond_the_baltic: "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LAT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LAT_join_the_allies: "[Root.Get_Join_Allies_Focus_Loc]"
 LAT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LAT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LAT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LAT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LAT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LAT_threat_on_our_border: "[Root.Get_Threat_Border_Focus_Loc]"
 LAT_threat_on_our_border_desc: "[Root.Get_Threat_Border_Focus_desc_Loc]"
 LAT_empower_paramilitarists: "เสริมอํานาจกองกําลังกึ่งทหาร"
 LAT_empower_paramilitarists_desc: "กองทัพลัตเวียมีประโยชนและแนนอนวายิ่งใหญกวากลุมกองกําลังกึ่งทหารชายขอบใด ๆ แตเราไมอาจเพิกเฉยตอบุคคลเหลานี้ที่ยอมเสี่ยงชีวิตเพื่อลัตเวียโดยไมมีคําสัญญาถึงรางวัลหรือการยกยองไดอีกตอไป"
 LAT_the_sun_shines_equally: "ดวงตะวันสองแสงเทาเทียม"
 LAT_the_sun_shines_equally_desc: "ดวงตะวันแหงลัตเวียสองแสงอยางเทาเทียมแกทุกคน นี่คือหลักการของระบอบเผด็จการ หลายปที่ผานมา ชนชั้นทางสังคมของลัตเวียถูกแบงแยกดวยวัฒนธรรมและชาติพันธุ แตจะปลอยใหเปนเชนนี้ตอไปไมได เราตองมุงสรางโอกาสที่เทาเทียมแกทุกคน และเราไมอาจสนับสนุนกองกําลังกึ่งทหารที่ตอตานอุดมการณของเรา"
 LAT_banish_clemens: "เนรเทศเซลมินช"
 LAT_banish_clemens_desc: "กุสตาฟส เซลมินช คือฟาสซิสตอันตรายที่คุกคามเสถียรภาพของระบอบเผด็จการและความปลอดภัยของชนกลุมนอยในลัตเวียทั่วประเทศอันยิ่งใหญของเรา เขาตองถูกขับออกนอกประเทศกอนที่แปรคอนครุสตสของเขาจะสรางความเสียหายแกชาติของเรามากไปกวานี้"
 LAT_aizsargi: "อุดหนุนไอซซารกี"
 LAT_aizsargi_desc: "ไอซซารกีกอตั้งโดยรัฐบาลเฉพาะกาลในป 1919 เปนองคกรกึ่งทหารอยางเปนทางการของรัฐบาล และการที่พวกเขาสนับสนุนรัฐประหารของอุลมานิสตองไดรับการตอบแทนดวยการสนับสนุนอยางเต็มที่"
 LAT_womens_aizsargi: "ขยายไอซซารกีสตรี"
 LAT_womens_aizsargi_desc: "ชาติที่ดอยกวาอาจหามสตรีเขารับราชการทหาร แตในลัตเวีย ใครก็ตามที่เต็มใจและสามารถถือปนไรเฟลได ยอมไดรับการตอนรับใหมารับใชชาติ"
 LAT_latvia_for_latvians: "ลัตเวียเพื่อชาวลัตเวีย"
 LAT_latvia_for_latvians_desc: "ชาติของเราไมไดดํารงอยูเพื่อเอาใจชาวเยอรมันหรือชาวรัสเซีย ชาติของเราดํารงอยูเพื่อชาวลัตเวียเทานั้น แมบางคนจะมองวาแปรคอนครุสตสเปนพวกชาตินิยมสุดโตง แตเรารูวาเราตองรวมมือกับพวกเขาหากจะรักษาความอยูรอดของลัตเวีย"
 LAT_lift_ban_on_perkonkrusts: "ยกเลิกคําสั่งหามแปรคอนครุสตส"
 LAT_lift_ban_on_perkonkrusts_desc: "อยางเปนทางการแลว กลุมแปรคอนครุสตสเปนกลุมผิดกฎหมาย แตจํานวนสมาชิกก็ยังเพิ่มขึ้นทุกวัน การยกเลิกคําสั่งหามกลุมนี้จะแสดงใหเห็นวาระบอบเผด็จการเปนมิตรตออุดมการณของพวกเขา"
 LAT_fanatic_recruitment: "เกณฑพวกคลั่งอุดมการณ"
 LAT_fanatic_recruitment_desc: "ในอดีต เราคงลังเลที่จะใหพวกหัวรุนแรงเขาสูกองทัพ เพราะแรงจูงใจของพวกเขาผูกกับอุดมการณมากกวาลัตเวีย แตเซลมินชและผูติดตามยอมปรารถนาจะรักษาลัตเวียและเอกราชของเธอไวไมนอยไปกวาใคร"
 LAT_military_industrial_complex: "ศูนยอุตสาหกรรมทหารลัตเวีย"
 LAT_military_industrial_complex_desc: "เพื่อติดอาวุธใหแปรคอนครุสตสอยางครบครัน ลัตเวียตองกลายเปนโรงงานอาวุธมากกวาจะเปนรัฐ"
 LAT_the_old_ways: "วิถีโบราณ"
 LAT_the_old_ways_desc: "แปรคอนครุสตสไมไดปฏิญาณตนตอพระคริสตและคําสอนของพระองค แตสาบานตอเทพเจาองคอื่นที่เกาแกกวามาก พวกอนุรักษนิยมอาจเรียกความหลงใหลในเทพเจาโบราณของเซลมินชวานาขนลุกและผิดธรรมชาติ แตแปรคอนครุสตสสูเพื่อลัตเวียที่แทจริงยิ่งกวา ลัตเวียที่ปลอดจากอิทธิพลของเทพเจาตางชาติ"
 LAT_anti_german_propaganda: "โฆษณาชวนเชื่อตอตานเยอรมัน"
 LAT_anti_german_propaganda_desc: "เราตองแสดงใหชัดเจนวา แมชาติของเราจะรับอุดมการณฟาสซิสต แตเราไมใชของเลนของ[GER.GetLeader] และเราไมมีเจตนาจะรวมมือกับพวกเดียวกับที่กดขี่ประชาชนของเรามานานหลายศตวรรษ"
 LAT_supply_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LAT_supply_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LAT_multicultural_latvia: "ลัตเวียพหุวัฒนธรรม"
 LAT_multicultural_latvia_desc: "ชาติของเราประกอบดวยกลุมคนและบุคคลนับไมถวน ทั้งชาวลัตเวีย ชาวเยอรมันบอลติก ชาวยิว และอื่น ๆ อีกมากมาย เราตองมอบบานที่คุมคาแกการตอสูใหกลุมคนทั้งหมดนี้ และรักษาภูมิทัศนทางวัฒนธรรมอันหลากหลายของเราไว"
 LAT_ready_the_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LAT_ready_the_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LAT_prepare_underground_resistance: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LAT_prepare_underground_resistance_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LAT_prepare_covert_resistance: "[Root.Get_Covert_Resistance_Focus_Loc]"
 LAT_prepare_covert_resistance_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LAT_cave_to_enemy_pressure: "[Root.Get_Enemy_Pressure_Focus_Loc]"
 LAT_cave_to_enemy_pressure_desc: "[Root.Get_Enemy_Pressure_Focus_desc_Loc]"
 LAT_alignment_with_germany: "แสวงหาความรวมมือกับเยอรมนี"
 LAT_alignment_with_germany_desc: "ชาวเยอรมันรังเกียจทุกสิ่งที่เปนฝายซายและออนแอเชนเดียวกับเรา แมในอดีตพวกเขาเคยพยายามอยางผิดพลาดที่จะปราบลัตเวียใหอยูใตอํานาจ แตเรามั่นใจวาพวกเขาจะไมทําเชนนั้นอีกหากรัฐบาลของเรามีแนวทางสอดคลองกัน"
 LAT_the_thunder_strikes_alone: "อัสนีคํารามลําพัง"
 LAT_the_thunder_strikes_alone_desc: "เราไมตองการความชวยเหลือจากตางชาติ ลัตเวียมีความสามารถเกินพอที่จะปกปองเอกราชของตน แตตองอยูภายใตการชี้นําของแปรคอนครุสตสเทานั้น"
 LAT_free_the_ugonskrusts: "ปลดปลอยอุกุนสกรุสตส"
 LAT_free_the_ugonskrusts_desc: "กอนจะเปนแปรคอนครุสตส เราคืออุกุนสกรุสตส ผูถูกกดขี่และปราบปรามโดยระบอบลัตเวียกอนหนา บัดนี้เมื่อเราเปนอิสระแลว เราสามารถปลอยตัวนักโทษการเมืองนับไมถวนที่เพียงปรารถนารัฐลัตเวียที่เขมแข็งกวาเดิม"
 LAT_lightning_strike: "สายฟาฟาด"
 LAT_lightning_strike_desc: "เพื่อนบานของเราออนแอและถูกเอาเปรียบไดงาย คงเปนการรอบคอบหากเราจะนําลิทัวเนียและเอสโตเนียมาอยูใตการดูแลของลัตเวีย แนนอนวาเพื่อปกปองพวกเขาเอง"
 LAT_support_baltic_fascists: "สนับสนุนฟาสซิสตบอลติก"
 LAT_support_baltic_fascists_desc: "ชาวบอลติกคือพี่นอง และพี่นองตองใกลชิดกัน เราทั้งสามลวนเปนเปาการรุกรานจากตางชาติ และเราไมอาจปลอยใหรัฐบาลที่ใจเสาะปกครองชาวบอลติก การสนับสนุนขบวนการขวาจัดในลิทัวเนีย เอสโตเนีย และโปแลนด จะทําใหเราสรางกลุมบอลติกที่เปนหนึ่งเดียวและพรอมสูกับทั้งโลก"
 LAT_consecrate_the_brotherhood: "สถาปนาภราดรภาพ"
 LAT_consecrate_the_brotherhood_desc: "แมจะแตกตางกันหลายดาน แตชาวบอลติกก็ยังเปนพี่นองกัน วัฒนธรรมของเราแตกตาง แตเราเผชิญศัตรูเดียวกันและปญหาเดียวกันมาหลายศตวรรษ หากเราจะปองกันการถูกปราบใหอยูใตอํานาจ เราตองรวมภราดรภาพเขาเปนแนวรวมหนึ่งเดียว"
 LAT_consecrate_the_brotherhood_custom_tt: "ไดรับเหตุการณ "§Y[LAT.GetNameDef]§! เชิญเราเขารวมฝาย""
 LAT_dievs_keepers: "ผูพิทักษแหงดีเอฟส"
 LAT_dievs_keepers_desc: "ชาวลัตเวียผูนับถือศาสนาดั้งเดิมเริ่มมีทาทีแข็งกราวทางทหารรอบอุดมการณของเรามากขึ้นเรื่อย ๆ โดยมองเซลมินชราวกับเปนผูนําทางศาสนา ชาวคาทอลิกสายอนุรักษนิยมในรัฐบาลของเราเกรงวาความหลงใหลในศาสนาดั้งเดิมบอลติกนี้เริ่มแปรเปลี่ยนเปนลัทธิ โดยมีเซลมินชเปนผูนําผูมีเสนห แตเราก็ไดประโยชนจากการยื่นปนไรเฟลใหชายหนุมผูกระตือรือรนเหลานี้"
 LAT_state_paganism: "ศาสนาดั้งเดิมประจํารัฐ"
 LAT_state_paganism_desc: "อิทธิพลของ “ดีเอฟตูรีบา” ในกองทัพแทบบดบังความเชื่อทางศาสนาอื่นทั้งหมด รอบตัวเซลมินชเต็มไปดวยผูคลั่งศรัทธาที่อางวาพรอมจะสูและตายเพื่อเทพเจาโบราณ แมในความเปนจริง เซลมินชตางหากที่เปนเปาแหงความคลั่งไคลของพวกเขา การสถาปนาดีเอฟตูรีบาเปนศาสนาประจํารัฐอยางเปนทางการ จะทําใหเราเริ่มเผยแพรอุดมการณของแปรคอนครุสตสผานโบสถและวิหารทั่วประเทศได"
 LAT_wrath_of_the_old_gods: "พิโรธแหงเทพเจาโบราณ"
 LAT_wrath_of_the_old_gods_desc: "บอลติกไมใชที่เดียวที่ถูกศาสนาตางชาติแปดเปอน โลกสวนใหญนับถือคําสอนของพระคริสต และสิ่งนี้ตองเปลี่ยนแปลง เราตองประกาศสงครามครูเสดของเราเอง สงครามครูเสดตอตานคริสตศาสนจักร!"
 LAT_ostland: "ออสทลันด"
 LAT_ostland_desc: "ชาวเยอรมันมีแผนจะรวมบอลติกและบางภูมิภาคของโปแลนดตะวันออกเปนรัฐเดียว แมวิสัยทัศนเรื่องออสทลันดของพวกเขาจะวางชาวเยอรมันบอลติกไวบนสุดของลําดับชั้น แตก็ไมมีเหตุผลใดที่เราจะไมฉวยประโยชนจากแผนนี้ และสรางออสทลันดตามแบบของลัตเวีย"
 LAT_reorganize_forest_brothers: "ปรับโครงสรางภราดรแหงพงไพร"
 LAT_reorganize_forest_brothers_desc: "ภราดรแหงพงไพรเปนผูพิทักษอัตลักษณลัตเวียและสิทธิในการกําหนดชะตากรรมตนเองของเรา แตสิ่งที่บั่นทอนพวกเขาคือความหมกมุนที่จะปกปองเอกราชของชาวลิทัวเนียและชาวเอสโตเนียดวย สิ่งนี้จะดําเนินตอไปไมได ภราดรแหงพงไพรของลัตเวียตองปฏิญาณตนปกปองลัตเวีย เซลมินช และพรรคแปรคอนครุสตส!"
 LAT_avenge_the_ancestors: "ลางแคนใหบรรพชน"
 LAT_avenge_the_ancestors_desc: "ลัตเวียไมเคยไดสัมผัสแสงแหงเอกราชนับตั้งแตยุคชนเผาบอลติก และทั้งหมดนั้นเปนเพราะการถูกกดขี่ไมสิ้นสุดโดยชาวเยอรมัน ชาวสวีเดน และชาวรัสเซีย เราไมอาจเสี่ยงกับความโหดรายและการกดขี่อีกนับพันป เราตองทําใหพวกจักรวรรดินิยมตางชาติทั้งหมดคุกเขาตอหนาลัตเวีย!"
 LAT_united_baltic_empire: "จักรวรรดิบอลติกที่เปนหนึ่งเดียว"
 LAT_united_baltic_empire_desc: "แมแนวคิดเรื่องรัฐบอลติกหนึ่งเดียวจะดูพิสดารอยูบาง แตปฏิเสธไมไดวาภราดรภาพของเราอยูเหนือพรมแดนเพียงอยางเดียว เมื่อลิทัวเนียและเอสโตเนียอยูใตการควบคุมของเรา เราเพียงตองรวมการบริหารของพวกเขาเขากับของเรา แลวความทะเยอทะยานสูการเปนเจาแหงบอลติกก็จะกลายเปนความจริง"
 LAT_renew_the_constitution: "ฟนรัฐธรรมนูญลัตเวีย"
 LAT_renew_the_constitution_desc: "คารลิส อุลมานิสไดนํารัฐบาลที่เขมแข็งมาสูลัตเวีย สามารถฝาพายุฟาสซิสตและคอมมิวนิสตที่กําลังโหมเขามาได แตบัดนี้เมื่อรัฐบาลพลเรือนเต็มไปดวยสมาชิกพรรคชาวนาแลว ก็แทบไมมีเหตุผลที่จะไมเปดการเลือกตั้งทั่วไปอีกครั้ง"
