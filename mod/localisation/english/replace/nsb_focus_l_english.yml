 LIT_infiltrate_homeland_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LIT_a_corporatist_economy: "เศรษฐกิจแบบบรรษัทนิยม"
 LIT_a_corporatist_economy_desc: "โลกตะวันตกคาดหวังใหรัฐลิทัวเนียเปดเสรีทางเศรษฐกิจอยางรวดเร็ว อยางไรก็ตาม อันตานัส สเมโตนาชื่นชอบการควบคุมและการรวมศูนยที่มาพรอมกับรูปแบบบรรษัทนิยมมากกวา"
 LIT_a_martial_prime_minister: "นายกรัฐมนตรีสายทหาร"
 LIT_a_martial_prime_minister_desc: "ตําแหนงนายกรัฐมนตรีมักเปนของนักการเมืองที่มาจากการเลือกตั้ง แตในยามสงครามเชนนี้และเมื่ออํานาจของประธานาธิบดีเพิ่มขึ้น เราตองเลือกผูนําที่เขมแข็งมาเปนมือขวาของ[ROOT.GetLeader]!"
 LIT_a_priestly_prime_minister: "นายกรัฐมนตรีนักบวช"
 LIT_a_priestly_prime_minister_desc: "วลาดัส มิโรนัส อดีตสมาชิกสภาซึ่งปจจุบันเปนนักบวช เปนผูสมัครในอุดมคติที่จะเปนตัวแทนพรรคชาตินิยมในฐานะนายกรัฐมนตรี ตําแหนงของเขาในศาสนจักรคาทอลิกและความทุมเทตอชาวนาและเกษตรกรรมทําใหเขาเปนที่นิยมในหมูชนชั้นลางของลิทัวเนีย"
 LIT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LIT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LIT_beyond_the_baltic: "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LIT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LIT_enforce_military_rule: "บังคับใชการปกครองแบบทหาร"
 LIT_enforce_military_rule_desc: "ลิทัวเนียไมไดโดดเดี่ยวในการตอสูเพื่อเอกราช ลัตเวียและเอสโตเนียก็ถูกลอมรอบดวยศัตรูกลุมเดียวกับเรา แตรัฐบาลของพวกเขาขาดความกลาที่จะทําสิ่งที่จําเปนเพื่อปกปองประชาชน เราตองบังคับใชการปกครองโดยฝายทหารทั่วทั้งบอลติก"
 LIT_expand_military_budget: "เพิ่มงบประมาณทางทหาร"
 LIT_expand_military_budget_desc: "ขอรองเรียนทั่วไปในหมูทหารคือคาจางที่คอนขางตํ่าเมื่อเทียบกับผูทํางานในรัฐบาลพลเรือน เมื่อราชติคิสดํารงตําแหนงนายกรัฐมนตรี ก็ถึงเวลาเหมาะที่จะใหกองทัพไดงบประมาณที่ตองการ"
 LIT_exploit_the_international_bank: "ใชประโยชนจากธนาคารระหวางประเทศ"
 LIT_exploit_the_international_bank_desc: "ในฐานะสมาชิกของธนาคารระหวางประเทศ อันตานัส สเมโตนาอยูในตําแหนงที่เหมาะเจาะจะใชประโยชนจากภาคการธนาคารเพื่อประโยชนของรัฐ ในยามที่สงครามใกลเขามาเชนนี้ เราจะมีทางเลือกอื่นไดอยางไร?"
 LIT_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 LIT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LIT_lithuanian_preservationism: "ลัทธิพิทักษลิทัวเนีย"
 LIT_lithuanian_preservationism_desc: "สาธารณรัฐลิทัวเนียยังเยาววัยและยังคงคนหาที่ทางของตนในโลก หลายฝายอยากเห็นเธอยอมสยบตอลัทธิคอมมิวนิสต ฟาสซิสต หรือเสรีนิยม แตเราตองหลีกเลี่ยงแรงกระตุนที่จะยอมจํานนตออิทธิพลตางชาติเหลานี้ ลิทัวเนียที่เปนอิสระอยางแทจริงตองคนหาหนทางของตนเอง"
 LIT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LIT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LIT_martial_law: "กฎอัยการศึก"
 LIT_martial_law_desc: "เสรีภาพคือความหรูหราสําหรับชาติที่อยูในสันติภาพ แตเมื่อศัตรูรายลอมรอบตัว ลิทัวเนียก็ไมอาจมีความหรูหราเชนนั้นได"
 LIT_merge_the_military_and_civilian_governments: "รวมรัฐบาลทหารและรัฐบาลพลเรือน"
 LIT_merge_the_military_and_civilian_governments_desc: "การแบงปนอํานาจระหวางกองทัพกับประธานาธิบดีมีประโยชนอยูชวงหนึ่ง แตสเมโตนากําลังหมดประโยชนลงอยางรวดเร็ว มีเพียงการโอนอํานาจฉุกเฉินใหกองทัพเทานั้นที่จะรับประกันความปลอดภัยของลิทัวเนียตอไปได"
 LIT_peasants_reform: "การปฏิรูปชาวนา"
 LIT_peasants_reform_desc: "ชาวนาเปนกลุมคนที่ยากจนที่สุดในลิทัวเนีย แมจะสรางความมั่งคั่งทางเศรษฐกิจสวนใหญใหเรา เมื่อวลาดัส มิโรนัสเปนนายกรัฐมนตรีและหัวหนาฝายเกษตรกรรม เราก็อาจมอบสภาพความเปนอยูที่ดีขึ้นมากใหแกชนชั้นชาวนาได"
 LIT_presidential_reform: "การปฏิรูป[GetLithuanianPowerIdeaAdj]"
 LIT_presidential_reform_desc: "การเมืองแบบพรรคการเมืองเปนภัยตอรัฐลิทัวเนียมานาน จํากัดอํานาจของ[GetLithuanianLeaderTitle] [GetLithuanianLeaderTitle]คนใหมของลิทัวเนียตองอยูเหนือการทะเลาะเบาะแวงของพรรคการเมือง และเปนของลิทัวเนียเพียงผูเดียว"
 LIT_restore_public_elections: "ฟนฟูการเลือกตั้งทั่วไป"
 LIT_restore_public_elections_desc: "การปกครองแบบเผด็จการเหนือลิทัวเนียมีประโยชนอยูชวงหนึ่ง แตเมื่อรัฐมีเสถียรภาพแลว ประชาชนก็สมควรไดรับการรับฟง เราถกเถียงกันเองวาการเปนชาวลิทัวเนียหมายความวาอยางไร แตบางทีเราควรถามประชาชน"
 LIT_state_media: "สื่อของรัฐ"
 LIT_state_media_desc: "บอยครั้งเกินไปที่หนังสือพิมพเต็มไปดวยโฆษณาชวนเชื่อของฟาสซิสตและคอมมิวนิสต ประชาชนทั่วไปตองไดรับการสงเสริมใหอานสิ่งพิมพที่รัฐรับรองแทน ซึ่งเปนแหลงความจริงเพียงแหลงเดียวที่เชื่อถือได"
 LIT_the_nation_and_its_power: "ชาติและอํานาจของชาติ"
 LIT_the_nation_and_its_power_desc: "การทะเลาะกันในเซมัสไมไดเปนอะไรนอกจากอุปสรรคตออํานาจของ[GetLithuanianLeaderTitle] หากเราจะสรางชาติที่สามารถปกปองตนเองได เราตองมอบอํานาจเด็ดขาดให[GetLithuanianLeaderTitle]"
 LIT_the_nationalist_council: "สภาชาตินิยม"
 LIT_the_nationalist_council_desc: "ประธานาธิบดีของเราไมไดสังกัดพรรคการเมืองใดอยางเปนทางการอยูแลว แตเซมัสก็ยังทะเลาะกันเองเหมือนเด็กไรความสามารถ พวกเขาตองไดรับการกระตุนใหรวมมือกับ[ROOT.GetRulingParty] มิฉะนั้นก็เตรียมลาออกไดเลย"
 LIT_support_monarchism_in_POL: "สนับสนุนกษัตริยนิยมในโปแลนด"
 LIT_support_monarchism_in_POL_desc: "เชนเดียวกับลิทัวเนีย โปแลนดควรจะไดเลือกกษัตริยองคใหม แตตางจากลิทัวเนีย ชาวโปแลนดหากษัตริยที่เหมาะสมขึ้นครองบัลลังกไมได แตเราสามารถมอบผูปกครองที่เขมแข็งตามที่สัญญาไวใหชาวโปแลนดได ผูที่จะปกปองโปแลนดจากจักรวรรดินิยมเยอรมัน"
 LIT_king_of_poland: "ราชอาณาจักรโปแลนด"
 LIT_king_of_poland_desc: "ถึงเวลาเหมาะแลว ประชาชนชาวโปแลนดถูกปลุกปนใหตอตาน[POL.GetLeader] และผูสนับสนุนกษัตริยนิยมก็พรอมยื่นขอเรียกรองตอรัฐบาล ดวยการสนับสนุนของลิทัวเนีย พวกเขาจะมองวา[Root.GetLeader]คือผูปกครองที่พระเจาทรงแตงตั้ง"
 LIT_arm_monarchist_militants: "ติดอาวุธใหนักรบกษัตริยนิยม"
 LIT_arm_monarchist_militants_desc: "เรารูวามีผูคนขามพรมแดนของเราที่ปรารถนาให[Root.GetLeader]นําความสงบเรียบรอยและความมั่งคั่งมาสูชาติของพวกเขา เชนเดียวกับที่[Root.GetLeader.GetSheHe]ทําใหเรา! เราตองพรอมติดอาวุธใหนักรบกษัตริยนิยมเหลานี้ เพื่อใหพวกเขาตอสูนํากษัตริยอันชอบธรรมขึ้นครองบัลลังก"
 LIT_POL_union: "ฟนฟูเครือจักรภพ"
 LIT_POL_union_desc: "เมื่อ[Root.GetLeader]เปนกษัตริยของทั้งโปแลนดและลิทัวเนีย สิ่งที่เหลืออยูคือการรวมเซมัสเขากับเซยมอีกครั้ง แลวเครือจักรภพโปแลนด-ลิทัวเนียก็จะถือกําเนิดใหม"
 LIT_expand_lithuanian_shipyards: "ขยายอูตอเรือลิทัวเนีย"
 LIT_expand_lithuanian_shipyards_desc: "เมื่อโปแลนดอยูใตการควบคุมของเรา เราก็ไดรับโอกาสที่จะขยายขีดความสามารถทางเรืออยางมหาศาล และแขงขันเพื่อครองความเปนใหญในทะเลบอลติก"
 LIT_lithuanian_rail: "ทางรถไฟโปแลนด-ลิทัวเนีย"
 LIT_lithuanian_rail_desc: "การเดินทางภายในสหภาพตองเปนเรื่องงายดาย หากโปแลนดและลิทัวเนียจะรวมเปนหนึ่งอยางแทจริง การเชื่อมทางรถไฟของเราจะชวยปรับปรุงหวงโซเสบียงและขีดความสามารถทางอุตสาหกรรมไดอยางมาก"
 LIT_push_for_ruthenia: "รุกผานรูทีเนีย"
 LIT_push_for_ruthenia_desc: "เครือขายทางรถไฟของยูเครนและเบลารุสถูกละเลยอยางนาเศรา แตดินแดนเหลานี้ก็เปนสวนหนึ่งของเครือจักรภพไมตางจากดินแดนอื่น เราตองลงทุนในทางรถไฟฝงตะวันออก หากจะรุกฝาโซเวียตไปและทวงคืนสิ่งที่เปนของเรา"
 LIT_warsaw_to_crimea_railway: "ทางรถไฟวอรซอ-ไครเมีย"
 LIT_warsaw_to_crimea_railway_desc: "ในความทะเยอทะยานที่จะปกครองจากทะเลจรดทะเล สิ่งสําคัญยิ่งคือดินแดนทุกแหงที่เรายึดไดตองหลอมรวมเปนสวนหนึ่งของชาติอยางสมบูรณ พรมแดนธรรมชาติของเราทอดยาวจากเหนือจรดใต ตะวันออกจรดตะวันตก และความทะเยอทะยานที่จะเชื่อมไครเมียเขากับทางรถไฟของเราจะทําใหเรายึดกุมภูมิภาคนี้ไดมั่นคง"
 LIT_merge_the_arms_industries: "รวมอุตสาหกรรมอาวุธ"
 LIT_merge_the_arms_industries_desc: "ผูผลิตอาวุธของโปแลนดและลิทัวเนียตางผลิตอาวุธแยกกันมาหลายทศวรรษ แตบัดนี้เมื่อชาติของเราเปนหนึ่งเดียว เราจึงมีโอกาสที่จะทําใหอุตสาหกรรมมีความเชี่ยวชาญเฉพาะดาน และสรางความรวมมือระหวางโรงงานของโปแลนดและลิทัวเนีย"
 LIT_merge_civilian_industries: "รวมอุตสาหกรรมพลเรือน"
 LIT_merge_civilian_industries_desc: "เมื่อชาติของเรารวมเปนหนึ่งแลว ก็ไมสมเหตุสมผลที่ลิทัวเนียจะสรางเพื่อลิทัวเนียเทานั้น และโปแลนดจะสรางเพื่อโปแลนดเทานั้น อุตสาหกรรมของเราตองเปนหนึ่งเดียวเพื่อความเจริญของชาติ"
 LIT_claim_livonia_monarchy: "อางสิทธิ์ลิโวเนีย"
 LIT_claim_livonia_monarchy_desc: "ในหมูชาติบอลติกมีความรูสึกเปนพี่นองและสหายที่ไมอาจแตกหัก และบัดนี้เมื่อเรามีกษัตริยบนบัลลังก เราก็อาจอางความเปนพี่นองนั้นเปนสิทธิ์อันศักดิ์สิทธิ์ของเรา"
 LIT_claim_greater_lithuania: "อางสิทธิ์มหาลิทัวเนีย"
 LIT_claim_greater_lithuania_desc: "ลิทัวเนียที่เรารูจักทุกวันนี้เปนเพียงเงาของแกรนดดัชชีลิทัวเนียในอดีต เครือจักรภพไมไดเปนเพียงสหภาพของโปแลนดและลิทัวเนีย แตเปนสหภาพของชาวโปแลนด ชาวลิทัวเนีย ชาวยูเครน และชาวเบลารุส"
 LIT_greater_commonwealth: "มหาเครือจักรภพ"
 LIT_greater_commonwealth_desc: "ความทะเยอทะยานของเครือจักรภพไปไกลเกินกวาพรมแดนทางประวัติศาสตรของราชอาณาจักรที่ลมสลายไปนานแลว เครือจักรภพในหัวใจของชาวโปแลนดคือมหาอํานาจจักรวรรดิอันยิ่งใหญ จักรวรรดิพหุวัฒนธรรมที่เจิดจรัสจากทะเลจรดทะเล!"
 LIT_institute_royal_guards: "จัดตั้งราชองครักษ"
 LIT_institute_royal_guards_desc: "เมื่อพระมหากษัตริยประทับบนบัลลังกแลว สิ่งสําคัญยิ่งคือเราตองคัดเลือกเฉพาะยอดฝมือในกองทัพลิทัวเนียมาทําหนาที่ถวายความปลอดภัยแดพระมหากษัตริยอันเปนที่รักของเรา"
 LIT_a_king_for_our_people: "กษัตริยเพื่อประชาชนของเรา"
 LIT_a_king_for_our_people_desc: "อันตานัส สเมโตนาไมอาจปกครองลิทัวเนียเพียงลําพัง และแมหลายคนคาดวาประธานาธิบดีจะแตงตั้งนายกรัฐมนตรี แตก็ยังมีอีกทางเลือกหนึ่ง คารล เกโร ฟอน อูราค เปนโอรสโดยชอบธรรมของมินเดากัสที่ 2 และเมื่อเงาแหงการปกครองของเยอรมนีไมไดปกคลุมลิทัวเนียอีกตอไป ก็ไมมีสิ่งใดขัดขวางเราจากการสวมมงกุฎใหกษัตริยของเรา"
 LIT_a_new_noble_class: "ชนชั้นขุนนางใหม"
 LIT_a_new_noble_class_desc: "ชาติของเราถูกปกครองโดยนักการเมืองและคณาธิปไตยมานานเกินไป เพื่อใหกษัตริยทรงรับใชลิทัวเนียได พระองคตองมีราชสํานักของขุนนางผูภักดีใหทรงปกครอง"
 LIT_abolish_the_presidency: "ยกเลิกตําแหนงประธานาธิบดี"
 LIT_abolish_the_presidency_desc: "จนถึงบัดนี้ สเมโตนายังคงครองอํานาจปกครองชาติ แตเมื่อมินเดากัสที่ 3 ทรงเปนที่นิยมมากขึ้น ก็ดูเปนการรอบคอบที่จะยกเลิกตําแหนงประธานาธิบดีและแทนที่ดวยการปกครองแบบสมบูรณาญาสิทธิ์ของกษัตริย สเมโตนาจะลดบทบาทลงเปนนายกรัฐมนตรี ทําหนาที่ถวายคําปรึกษาแดมินเดากัสที่ 3 ผูทรงพระเยาว"
 LIT_claim_prussia: "ยึดปรัสเซียตะวันออก"
 LIT_claim_prussia_desc: "ปรัสเซียตะวันออกเปนถิ่นอาศัยของชนกลุมนอยชาวลิทัวเนียและโปแลนดนับไมถวน และถึงเวลาแลวที่คนเหลานี้จะไดรวมกับพี่นองของพวกเขาใน[Root.GetNameDef]"
 #Shared Baltic
 BALTIC_rejoin_the_railways: "เชื่อมทางรถไฟอีกครั้ง"
 BALTIC_rejoin_the_railways_desc: "ชาวรัสเซียและชาวเยอรมันที่เคยยึดครองเรามองเราเปนเพียงชนบทลาหลัง แตจะไมเปนเชนนั้นอีกตอไป [ROOT.GetNonIdeologyName]จะไดรับการพัฒนาอุตสาหกรรมเต็มศักยภาพ โดยเริ่มจากการปรับปรุงทางรถไฟและโครงสรางพื้นฐานของเรา"
 BALTIC_axis_investments: "แสวงหาการลงทุนจาก[GetBalticAxisInvesmentsAdj]"
 BALTIC_axis_investments_desc: "[GetBalticAxisInvesmentsDesc]"
 BALTIC_axis_investments_desc_ger: "ทาเรือพาณิชยของเยอรมนีมีอยูทั่วบอลติก และแมครั้งหนึ่งเราจะเคยเปนศัตรูกัน แตก็ปฏิเสธไมไดวาการคาและการลงทุนจากฝายอักษะจะทําใหเศรษฐกิจ[ROOT.GetNonIdeologyAdjective]แข็งแกรงขึ้นอยางประเมินคาไมได"
 BALTIC_axis_investments_desc_fasc_eur: "ลัทธิฟาสซิสตมีอิทธิพลอยางมากในยุโรป และแมจะมีขอกังขาอยูบางซึ่งเปนเรื่องเขาใจได แตก็ปฏิเสธไมไดวาการคาและการลงทุนจากฝายฟาสซิสตจะทําใหเศรษฐกิจ[ROOT.GetNonIdeologyAdjective]แข็งแกรงขึ้นอยางประเมินคาไมได"
 BALTIC_axis_investments_desc_fasc_int: "ลัทธิฟาสซิสตมีอิทธิพลอยางมากทั่วโลก และแมจะมีขอกังขาอยูบางซึ่งเปนเรื่องเขาใจได แตก็ปฏิเสธไมไดวาการคาและการลงทุนจากฝายฟาสซิสตจะทําใหเศรษฐกิจ[ROOT.GetNonIdeologyAdjective]แข็งแกรงขึ้นอยางประเมินคาไมได"
 BALTIC_axis_investments_desc_jap: "[JAP.GetName]ไดพิสูจนแสนยานุภาพทางเศรษฐกิจและการทหารแลว และแมจะไมไดเปนเพื่อนบานกันเสียทีเดียว แตก็ปฏิเสธไมไดวาการคาและการลงทุนจาก[JAP.GetAdjective]จะทําใหเศรษฐกิจ[ROOT.GetNonIdeologyAdjective]แข็งแกรงขึ้นอยางประเมินคาไมได"
 BALTIC_german_war_economics: "นําเศรษฐกิจสงครามแบบ[GetBalticAxisInvesmentsAdj]มาใช"
 BALTIC_german_war_economics_desc: "[GetGermanWarEconomicsDesc]"
 BALTIC_german_war_economics_desc_default: "เยอรมนีกําลังอยูในกระบวนการพัฒนาอุตสาหกรรมทางทหารอยางรวดเร็ว ในแบบที่ยุโรปแทบไมเคยเห็นมากอน เราควรเอาอยางพวกเขาและแสวงหาการลงทุนจากไรชสบังค"
 BALTIC_german_war_economics_desc_alt: "ผูอุปถัมภฟาสซิสตของเรากําลังอยูในกระบวนการพัฒนาอุตสาหกรรมทางทหารอยางรวดเร็ว ในแบบที่เราแทบไมเคยเห็นมากอน เราควรเอาอยางพวกเขาและแสวงหาการลงทุนจากพวกเขา"
 BALTIC_autobahn: "ออโตบาหน[Root.GetAdjective]"
 BALTIC_autobahn_desc: "ไมสําคัญเลยวา[Root.GetNonIdeologyName]จะพัฒนาอุตสาหกรรมไดดีเพียงใด หากโครงสรางพื้นฐานไมเอื้อตอการหลั่งไหลของแรงงานอยางรวดเร็วและตอเนื่อง การวางรูปแบบภาคโครงสรางพื้นฐานตามแบบไรชจะทําใหเรามีประสิทธิภาพเชนเดียวกับพวกเขา"
 BALTIC_eastwall: "กําแพงตะวันออก"
 BALTIC_eastwall_desc: "เยอรมนีคาดการณการโจมตีจากทางตะวันออกไมตางจากเรา และเจาหนาที่เยอรมันก็ควรเสริมปอมปราการชายแดนของเราอยางเขมแข็งไมแพของพวกเขาเอง"
 BALTIC_balticwall: "กําแพงบอลติก"
 BALTIC_balticwall_desc: "ปอมปราการทางตะวันออกจะไรคาหากศัตรูเลือกโจมตีจากทางทะเลแทน! เราอาจไมมีวันสรางกองทัพเรือที่ทัดเทียมอังกฤษ เยอรมนี หรือโซเวียตได แตเราทําไดเทาที่ทําไดเพื่อใหพวกเขาไรทางสูตอแนวปองกันชายฝงของเรา"
 BALTIC_german_tank_licences: "ใบอนุญาตผลิตรถถัง[GetBalticAxisInvesmentsAdj]"
 BALTIC_german_tank_licences_desc: "[GetGermanTankLicencesDesc]"
 BALTIC_german_tank_licences_desc_default: "รถถังเยอรมันไดพิสูจนแลววาสามารถทําใหศัตรูกระจัดกระจายและสับสนขณะบุกสายฟาแลบผานเปาหมาย [Root.GetNonIdeologyName]จะไดประโยชนอยางมากจากการเอาอยางยุทธวิธีเหลานี้ในสงครามทางตะวันออกที่กําลังจะมาถึง"
 BALTIC_german_tank_licences_desc_alt: "รถถังของผูอุปถัมภฟาสซิสตของเราไดพิสูจนแลววาสามารถทําใหศัตรูกระจัดกระจายและสับสนขณะบุกสายฟาแลบผานเปาหมาย [Root.GetNonIdeologyName]จะไดประโยชนอยางมากจากการเอาอยางยุทธวิธีเหลานี้ในสงครามทางตะวันออกที่กําลังจะมาถึง"
 BALTIC_german_baltic_industry: "อุตสาหกรรมอักษะ-บอลติก"
 BALTIC_german_baltic_industry_desc: "[GetGermanBalticIndustryDesc]"
 BALTIC_german_baltic_industry_desc_default: "บัดนี้ชาติของเราอุดมไปดวยการลงทุนจากเยอรมนี ภาคเอกชนของเยอรมนีและ[Root.GetNonIdeologyName]แทบแยกไมออก โดยมีบรรษัทเดียวกันจํานวนมากจางงานทั้งชาว[Root.GetNonIdeologyAdjective]และชาวเยอรมัน"
 BALTIC_german_baltic_industry_desc_alt: "บัดนี้ชาติของเราอุดมไปดวยการลงทุนจากฟาสซิสตตางชาติ ภาคเอกชนของผูอุปถัมภฟาสซิสตของเราและ[Root.GetNonIdeologyName]แทบแยกไมออก โดยมีบรรษัทเดียวกันจํานวนมากจางงานทั้งชาว[Root.GetNonIdeologyAdjective]และประชาชนของพวกเขา"
 BALTIC_request_german_support: "ขอการสนับสนุนจาก[GetBalticAxisInvesmentsAdj]"
 BALTIC_request_german_support_desc: "[GetRequestGermanSupportDesc]"
 BALTIC_request_german_support_desc_default: "เราขาดขีดความสามารถทางอุตสาหกรรมอยางเยอรมนี แตบางทีเราอาจโนมนาวเจาหนาที่เยอรมันใหมอบยุทโธปกรณที่สะสมไวแกเราเพิ่มเติม เพื่อใหเราปองกันตนเองจากภัยคอมมิวนิสตที่กําลังคืบคลานมาจากทางตะวันออกไดดียิ่งขึ้น"
 BALTIC_request_german_support_desc_alt: "เราขาดขีดความสามารถทางอุตสาหกรรมอยางผูอุปถัมภฟาสซิสตของเรา แตบางทีเราอาจโนมนาวเจาหนาที่ของพวกเขาใหมอบยุทโธปกรณที่สะสมไวแกเราเพิ่มเติม เพื่อใหเราปองกันตนเองจากภัยคอมมิวนิสตที่กําลังคืบคลานมาจากทางตะวันออกไดดียิ่งขึ้น"
 BALTIC_renew_allied_trade: "[GetBalticRenewAlliedTradeTitle]"
 BALTIC_renew_allied_trade_default: "ฟนการคากับฝายสัมพันธมิตร"
 BALTIC_renew_allied_trade_alt: "แสวงหาการลงทุนจากตางชาติ"
 BALTIC_renew_allied_trade_desc: "[GetBalticRenewAlliedTradeDesc]"
 BALTIC_renew_allied_trade_desc_default: "เราพึ่งพาการคาและการสนับสนุนทางทหารจากอังกฤษมาตั้งแตกอตั้งรัฐ และคงเปนเรื่องโงเขลาหากจะละทิ้งสิ่งนั้นในตอนนี้ เราตองดึงดูดการลงทุนจากฝายสัมพันธมิตรเขาสูประเทศ หากเราจะรอดพนการบุกกระหนํ่าของชาวเยอรมันและชาวรัสเซียที่รุกลํ้าพรมแดนของเราไดอีกครั้ง"
 BALTIC_renew_allied_trade_desc_allied: "เราพึ่งพาฝายสัมพันธมิตรดานการคาและการสนับสนุนทางทหารมาตั้งแตกอตั้งรัฐ และคงเปนเรื่องโงเขลาหากจะละทิ้งสิ่งนั้นในตอนนี้ เราตองดึงดูดการลงทุนจากฝายสัมพันธมิตรเขาสูประเทศ หากเราจะรอดพนการบุกกระหนํ่าของชาวเยอรมันและชาวรัสเซียที่รุกลํ้าพรมแดนของเราไดอีกครั้ง"
 BALTIC_renew_allied_trade_desc_international: "เราพึ่งพาชาติอื่นดานการคาและการสนับสนุนทางทหารมาตั้งแตกอตั้งรัฐ และคงเปนเรื่องโงเขลาหากจะละทิ้งสิ่งนั้นในตอนนี้ เราตองดึงดูดการลงทุนจากตางชาติเขาสูประเทศ หากเราจะรอดพนการบุกกระหนํ่าของชาวเยอรมันและชาวรัสเซียที่รุกลํ้าพรมแดนของเราไดอีกครั้ง"
 BALTIC_ford_motors: "อุตสาหกรรมฟอรด[Root.Capital.GetName]"
 BALTIC_ford_motors_desc: "บริษัทฟอรดมอเตอรประสบความสําเร็จอยางดีในการผลิตยานยนตราคายอมเยาแบบจํานวนมากใหแกชาวอเมริกันและชาติสัมพันธมิตรอื่น ๆ ทั่วโลก หากเราจัดตั้งโรงงานฟอรดขึ้นใน[Root.Capital.GetName] เราจะสามารถทั้งจัดหายานพาหนะใหกองทัพของเราเอง และทํากําไรงาม ๆ จากการสงออกไปยังโลกตะวันตกได"
 BALTIC_crossley_motors: "[Root.Capital.GetName]-ครอสลียมอเตอรส"
 BALTIC_crossley_motors_desc: "เมื่อการลงทุนจากตางชาติหลั่งไหลเขามาในประเทศ และการผลิตรถยนตมีประสิทธิภาพพอสมควรแลว เราอาจรวมมือกับบริษัทครอสลียมอเตอรเพื่อสรางแบบดั้งเดิมของเราเองสําหรับใชในกองทัพ[Root.GetNonIdeologyAdjective]!"
 BALTIC_british_designers: "เชิญนักออกแบบชาวอังกฤษ"
 BALTIC_british_designers_desc: "เราไดศึกษาแบบของอังกฤษอยางละเอียดแลว และเมื่อ[Root.Capital.GetName]-ครอสลียมอเตอรสพิสูจนแลววาประสบความสําเร็จ เราควรสงคําเชิญอยางเปนทางการใหนักออกแบบชาวอังกฤษมารวมงานกับบริษัทวิศวกรรม[Root.GetNonIdeologyAdjective]"
 BALTIC_technology_sharing: "แบงปนเทคโนโลยี"
 BALTIC_technology_sharing_desc: "เราผลิตยุทโธปกรณของพันธมิตรหลายรายการอยูแลว แตบางทีการศึกษาแบบของพวกเขาอาจชวยใหเราพัฒนาแบบของ[Root.GetNonIdeologyAdjective]เองใหดีขึ้นอยางมาก"
 BALTIC_british_aircraft: "[GetBritAircraftManufTitle]"
 BALTIC_british_aircraft_default: "การผลิตอากาศยานของอังกฤษ"
 BALTIC_british_aircraft_alt: "การผลิตอากาศยานของตางชาติ"
 BALTIC_british_aircraft_desc: "[GetBritAircraftManufDesc]"
 BALTIC_british_aircraft_desc_default: "ความพยายามออกแบบอากาศยานภายในประเทศที่ผานมานั้นอยางดีก็แคพอประมาณ จนถึงตอนนี้กองทัพอากาศยังพึ่งพาเครื่องบินที่ยึดมาจากกองกําลังเยอรมันและโซเวียต แตเราตองเริ่มผลิตอากาศยานเองหากตองการอยูรอด และกองทัพอากาศอังกฤษอาจเปนกุญแจสูชัยชนะ…"
 BALTIC_british_aircraft_desc_alt: "ความพยายามออกแบบอากาศยานภายในประเทศที่ผานมานั้นอยางดีก็แคพอประมาณ จนถึงตอนนี้กองทัพอากาศยังพึ่งพาเครื่องบินที่ยึดมาจากกองกําลังเยอรมันและโซเวียต แตเราตองเริ่มผลิตอากาศยานเองหากตองการอยูรอด และความชวยเหลือจากกองทัพอากาศตางชาติอาจเปนกุญแจสูชัยชนะ…"
 BALTIC_allied_shipments: "เพิ่มการสงของจากฝายสัมพันธมิตร"
 BALTIC_allied_shipments_desc: "นับตั้งแตป 1918 กองทัพ[Root.GetNonIdeologyAdjective]ไดรับยุทโธปกรณจากการสงของจากบริเตนใหญ และเราควรพยายามทําใหฝายสัมพันธมิตรเขาใจวา หากการสงของไมเพิ่มขึ้นอยางมาก [Root.GetNonIdeologyName]อาจตกเปนรัฐบาลหุนเชิดของโซเวียตอีกครั้ง"
 BALTIC_baltic_fleet: "กองเรือบอลติก"
 BALTIC_baltic_fleet_desc: "แมกองเรือ[Root.GetNonIdeologyAdjective]จะแทบไมใชที่อิจฉาของชาวโลก แตหากไดรับการลงทุนอยางเหมาะสม ก็อาจพิสูจนไดวาสามารถปกปอง[Root.GetNonIdeologyName]จากความพยายามรุกรานทางทะเลได"
 BALTIC_attract_workers_to_capital: "ดึงดูดแรงงานสู[Root.Capital.GetName]"
 BALTIC_attract_workers_to_capital_desc: "แรงงานของ[Root.GetNonIdeologyName]กระจัดกระจายอยูตามชนบท สวนใหญทํางานในภาคเกษตรกรรมที่ลาสมัย หากเราตองการทําใหประเทศเปนอุตสาหกรรมเพื่อสงคราม เราตองดึงดูดแรงงานเขาสูโรงงานใน[Root.Capital.GetName]!"
 BALTIC_rebuild_forts: "สรางปอม[Root.Capital.GetName]ขึ้นใหม"
 BALTIC_rebuild_forts_desc: "ในชวงสงครามประกาศเอกราช [Root.Capital.GetName]เปนปอมปราการมากกวาเปนเมือง แมวาปอมคายสวนใหญจะถูกรื้อถอนและถูกลืมเลือนไปแลว แตตองสรางขึ้นใหมและดูแลรักษาใหพรอมสําหรับสงคราม"
 BALTIC_arm_the_nation: "ติดอาวุธใหชาติ"
 BALTIC_arm_the_nation_desc: "ทั่วทั้ง[Root.GetNonIdeologyName]มีผูชายที่พรอมเผชิญภัยการรุกรานของโซเวียตที่กําลังใกลเขามา แตขาดยุทโธปกรณที่จะทําเชนนั้น เราตองเตรียมอุตสาหกรรมอาวุธใหพรอมผลิตยุทโธปกรณทหารราบอยางรวดเร็ว"
 BALTIC_unchain_education: "ปลดพันธนาการการศึกษา"
 BALTIC_unchain_education_desc: "ระบบการศึกษาของ[Root.GetNonIdeologyAdjective]ถูกจํากัดมานานดวยชุมชนประชากรที่กระจัดกระจาย แตบัดนี้เมื่อชาวชนบทยายเขามาใกลเมืองมากขึ้น เราจะสามารถใหการศึกษาแกเยาวชน[Root.GetNonIdeologyAdjective]ไดอยางมีประสิทธิภาพยิ่งขึ้น"
 BALTIC_defence_of_our_nation: "การปองกันประเทศของเรา"
 BALTIC_defence_of_our_nation_desc: "อุตสาหกรรมพลเรือนมีความสําคัญตอการปองกันประเทศไมแพอุตสาหกรรมอาวุธ เสียงเครื่องจักรที่ดังกระหึ่มไมหยุดหยอนจะกองไปทั่ว[Root.GetNonIdeologyName] ขณะที่ประชาชนผูรักชาติทําหนาที่ของตนในการพัฒนาประเทศสูอุตสาหกรรม"
 BALTIC_modernize_industry: "ปฏิรูปอุตสาหกรรมใหทันสมัย"
 BALTIC_modernize_industry_desc: "ผลผลิตของ[Root.GetNonIdeologyName]ถูกนิยามดวยเกษตรกรรมมานานเกินไปแลว แตจะไมเปนเชนนั้นอีกตอไป เราตองรวมศูนยอุตสาหกรรมไวรอบใจกลางเมืองใหญในแตละรัฐ หากเราจะเปลี่ยน[Root.GetNonIdeologyName]ใหเปนเศรษฐกิจสมัยใหม"
 BALTIC_domestic_motors: "บริษัทยานยนตในประเทศ"
 BALTIC_domestic_motors_desc: "แบบของตางชาติก็ดีอยู แตเราไมอาจพึ่งพามันไปตลอดกาล [Root.GetNonIdeologyName]เปนชาติที่มีศักดิ์ศรี และเราตองแสดงใหโลกเห็นวานักออกแบบและนักคิดของเรามีความสามารถไมแพชาวตะวันตก"
 BALTIC_school_of_aviation: "โรงเรียนการบินบอลติก"
 BALTIC_school_of_aviation_tech_bonus: "โรงเรียนการบิน"
 BALTIC_school_of_aviation_desc: "ในสงครามประกาศเอกราช การตอสูเพื่อครองนานฟาและทองทะเลเปนอังกฤษที่สูแทนเรา แตขณะที่อังกฤษยังคงยอมออนขอใหภัยนาซีครั้งแลวครั้งเลา เราไมอาจไวใจไดวาพวกเขาจะปกปองเราอีก เราตองขึ้นสูทองฟาดวยตัวเอง!"
 BALTIC_original_designs: "แบบดั้งเดิมของเราเอง"
 BALTIC_original_designs_desc: "นับจากการถือกําเนิดของชาติในป 1918 จนถึงปจจุบัน [Root.GetNonIdeologyName]ติดอาวุธใหกองทัพดวยอาวุธจากอังกฤษ แตจะไมเปนเชนนั้นอีกแลว เราไมอาจพึ่งพาอังกฤษไดอีกตอไป เราตองมองไปขางหนาและเริ่มผลิตอาวุธที่มีตนกําเนิดจาก[Root.GetNonIdeologyAdjective]"
 BALTIC_arms_industry: "การติดอาวุธที่สมบูรณ"
 BALTIC_arms_industry_desc: "เมื่อการปฏิรูปอุตสาหกรรมใหทันสมัยเสร็จสิ้น และมีองคกรอุตสาหกรรมทางทหารในประเทศนับไมถวนดําเนินงานอยูภายในประเทศ อุตสาหกรรมอาวุธของ[Root.GetAdjective]ก็สามารถแสดงศักยภาพที่แทจริงไดในที่สุด!"
 BALTIC_natural_resources: "พัฒนาทรัพยากรธรรมชาติ"
 BALTIC_natural_resources_desc: "[Root.GetNaturaResource_BAL]ทําใหประเทศของเรารํ่ารวยจากการคากับโซเวียต ฝายสัมพันธมิตร และรัฐบอลติกเพื่อนบานของเรา และเราควรลงทุนในอุตสาหกรรมนี้ใหมากขึ้นดวยการลงทุนใน[Root.GetExtraction_BAL]ทั่วประเทศ!"
 BALTIC_trade_with_neighbors: "คาขายกับเพื่อนบาน"
 BALTIC_trade_with_neighbors_desc: "ทุกครั้งที่เราคาขายกับเยอรมนีหรือโซเวียต เรากําลังมีสวนนําหายนะมาสูตัวเอง เราไมอาจปลอยใหทหารขาศึกบุกรุก[Root.GetNonIdeologyName]โดยมีธัญพืชลิทัวเนียในเสบียง และนํ้ามันเอสโตเนียในรถถังที่สรางจากเหล็กกลาลัตเวีย เราตองชวยเหลือกันและกันเพื่อเอาชนะศัตรูรวมของเรา"
 BALTIC_invest_in_baltic_trade: "ลงทุนในการคาบอลติก"
 BALTIC_invest_in_baltic_trade_desc: "ทะเลบอลติกคึกคักไปดวยการคาจากสแกนดิเนเวีย เยอรมนี และรัสเซีย จนทาเรือของเราแทบรองรับไมไหว เราตองเปดเสนทางการคาใหมกับมิตรที่ใชทะเลแหงนี้รวมกับเรา เพื่อ[Root.GetNonIdeologyName]ที่สดใสและรุงเรืองยิ่งขึ้น!"
 BALTIC_restore_workers_republic: "ฟนฟูสาธารณรัฐกรรมกร"
 BALTIC_restore_workers_republic_desc: "ระหวางการตอสูเพื่อเอกราช โซเวียตไดชวยกอตั้งสาธารณรัฐกรรมกร[Root.GetAdjective] แมสาธารณรัฐนั้นจะลมเหลว แตบรรดาผูนํายังมีชีวิตอยูทั้งใน[Root.GetNameDef]และ[SOV.GetNameDef] ความหวังสําหรับสาธารณรัฐกรรมกรจึงยังคงอยู!"
 BALTIC_seek_support_of_soviets: "แสวงหาการสนับสนุนจากโซเวียต"
 BALTIC_seek_support_of_soviets_desc: "แมกองทัพแดงจะเคยทําลายลาง[Root.GetNameDef] และนําชาติของเราเขาสูยุคใหมแหงจักรวรรดินิยมรัสเซีย แตเราไมมีทางนําสังคมนิยมมาสู[Root.GetNameDef]ไดเลยหากไมไดรับความชวยเหลือจากพวกเขา"
 BALTIC_soviet_equipment: "ยุทโธปกรณโซเวียต"
 BALTIC_soviet_equipment_desc: "เราไมอาจหวังโคนลมรัฐบาลไดหากไมไดอาวุธและวัสดุที่จําเปนตอการติดอาวุธใหกองกําลังอาสาของเราเสียกอน การขอความชวยเหลือจากรัสเซียจะทําใหเราไดอาวุธเพิ่มเติมเพื่อสนับสนุนกองทัพ หากรัฐบาลเกาพยายามหยุดยั้งการปฏิวัติ"
 BALTIC_soviet_volunteer_forces: "กองกําลังอาสาสมัครโซเวียต"
 BALTIC_soviet_volunteer_forces_desc: "สหภาพโซเวียตแทบลนไปดวยผูคนที่พรอมจะสูและตายเพื่อการปฏิวัติโลก แม[Root.GetNameDef]จะเปนเพียงหินกาวยางหนึ่งในการตอสูเพื่อโลกคอมมิวนิสต แตก็ไมขาดแคลนนักสังคมนิยมชาวรัสเซียผูกลาที่พรอมสละชีพเพื่ออุดมการณของเรา"
 BALTIC_soviet_military_staff: "คณะเสนาธิการทหารโซเวียต"
 BALTIC_soviet_military_staff_desc: "หลังสาธารณรัฐกรรมกร[Root.GetAdjective]ถูกยุบ คณะเสนาธิการทหารของเราสวนใหญไดลี้ภัยไปอยูในสหภาพโซเวียต พวกเขาตองไดกลับบาน"
 BALTIC_communist_opposition: "เปนฝายคาน"
 BALTIC_communist_opposition_desc: "สหภาพโซเวียตพิสูจนแลววาไมใชมิตรของ[Root.GetNameDef]หรือประชาชน และเราคงโงเขลาหากจะยื่นกุญแจของ[Root.GetNameDef]ใหแกแรงกาแหงกองทัพแดง ผูไมตองการสิ่งใดนอกจากปลนสะดมชาว[Root.GetAdjective] พวกเขาไวใจไดไมมากไปกวาพวกนายทุน และหาก[Root.GetCommunistParty]จะประสบความสําเร็จ ก็ตองทําดวยตัวเอง!"
 BALTIC_forment_disloyalty: "รวมพลังฝายคาน"
 BALTIC_forment_disloyalty_desc: "มีขบวนการมากมายทั้งภายในและภายนอกรัฐบาล[Root.GetAdjective] และหากเราจะโคนลมทรราชที่กําลังเปนภัยตอ[Root.GetNameDef]อยูในขณะนี้ เราตองเปนเสียงที่รวมฝายคานทั้งหมดเพื่อตอตาน[Root.GetNeutralParty]!"
 BALTIC_concessions_for_catholics: "ผอนปรนใหชาวคาทอลิก"
 BALTIC_concessions_for_catholics_desc: "ชนชั้นลางของ[Root.GetNameDef]สวนใหญเปนชาวคาทอลิกผูเครงครัด และในสมัยสาธารณรัฐกรรมกรครั้งแรก กองทัพแดงไดปราบปรามการปฏิบัติศาสนกิจอยางรุนแรง สิ่งนี้ทําใหคนยากจนจํานวนมากของ[Root.GetNameDef]หันไปตอตานการปฏิวัติ ดังนั้นหากเราจะเปนสาธารณรัฐของประชาชนอยางแทจริง เราตองใหความมั่นใจแกพวกเขาอยางชัดเจนวาศรัทธาของพวกเขาจะไดรับการคุมครอง"
 BALTIC_secure_military_support: "หาการสนับสนุนจากกองทัพ"
 BALTIC_secure_military_support_desc: "ในกองทัพมีหลายคนที่อยากกําจัด[Root.GetLeader]ออกจากประเทศ เราเพียงแคตองเขาหาพวกเขา นายพลที่แสวงหาเกียรติยศและชื่อเสียงยอมถูกดึงดูดมาสูอุดมการณของเราดวยคําสัญญาวาจะไดเปนวีรบุรุษของประชาชน"
 BALTIC_overthrow_the_government: "โคนลม[Root.GetNeutralParty]"
 BALTIC_overthrow_the_government_desc: "เราไดรวบรวมแรงสนับสนุนมากพอที่จะโคน[Root.GetLeader]และระบอบของ[Root.GetLeader.GetHerHis]แลว! เราเพียงตองเดินทัพสูเมืองหลวงและประกาศสาธารณรัฐกรรมกรขึ้นใหม!"
 BALTIC_sieze_the_means_of_production: "ยึดปจจัยการผลิต"
 BALTIC_sieze_the_means_of_production_desc: "รัฐบาลเกาเชื้อเชิญนักลงทุนจากตางแดนเขามาเอารัดเอาเปรียบแรงงานของประชาชน[Root.GetAdjective] เราไมอาจปลอยใหมือของชนชั้นกรรมาชีพรับใชนายทุนตางชาติตอไปได และโรงงานทั้งหมดที่บรรษัทขามชาติเหลานี้สรางขึ้นตองตกอยูในความดูแลของ[Root.GetNameDef]"
 BALTIC_revolutionary_cabinet: "คณะรัฐมนตรีแหงการปฏิวัติ"
 BALTIC_revolutionary_cabinet_desc: "เมื่อเรากลับคืนสูตําแหนงอันชอบธรรมในฐานะผูพิทักษที่แข็งแกรงของชนชั้นลางแลว เราก็สามารถจัดตั้งคณะรัฐมนตรีที่สอดคลองกับอุดมการณของรัฐใหมไดอีกครั้ง"
 BALTIC_direct_intervention: "การแทรกแซงโดยตรงของโซเวียต"
 BALTIC_direct_intervention_desc: "เราพิสูจนแลววาไมสามารถยึดอํานาจรัฐบาลคืนไดดวยตัวเอง และตองรองขอใหพันธมิตรของเราใน[SOV.GetNameDef]ชวยเหลือเราในการตอสู"
 BALTIC_squash_resistance: "บดขยี้การตอตานทั้งหมด"
 BALTIC_squash_resistance_desc: "ยังมีผูคนที่เชื่อวาสังคมนิยมเปนศัตรูตออธิปไตยของ[Root.GetAdjective] และคนเหลานี้ตองถูกถอนรากถอนโคน หากเราจะผลักดันการปฏิวัติใหกาวหนา"
 BALTIC_purge_of_our_own: "การกวาดลางของเราเอง"
 BALTIC_purge_of_our_own_desc: "แมเราจะพยายามอยางดีที่สุดเพื่อบดขยี้การตอตานทั้งหมด แตก็ยังมีผูที่รวมตัวกันในเงามืด สมคบคิดตอตานชนชั้นกรรมาชีพเพื่อฟนฟูเผด็จการทุนนิยมใน[Root.GetNonIdeologyName] เราตองดําเนินการกวาดลางโดยประชาชน ถอนรากถอนโคนสมาชิกรัฐบาลเกาและผูสนับสนุนทุกคน"
 BALTIC_crush_forest_brothers: "บดขยี้ภราดรแหงพงไพร"
 BALTIC_crush_forest_brothers_desc: "ภราดรแหงพงไพรเปนเสนียดของชาติเรานับตั้งแตเรายึดอํานาจ พวกเขากอวินาศกรรมตออุตสาหกรรมและทางรถไฟ และกอกวนการชุมนุมอยางเปนทางการของรัฐบาล เราตองบุกเขาไปในปาของ[Root.GetNonIdeologyName]และถอนรากถอนโคนคนหลงผิดเหลานี้"
 BALTIC_red_army: "ทหารไรเฟลแดง[Root.GetAdjective]"
 BALTIC_red_army_desc: "กองทัพของเราตองประกอบดวยผูที่เต็มใจปกปองสังคมนิยมใน[Root.GetNameDef]และเผยแพรไปสูประชาชนทั่วโลกเทานั้น และสิ่งนี้จะสําเร็จไดดวยการฟนฟูทหารไรเฟลแดง[Root.GetAdjective]"
 BALTIC_align_paramilitarists: "ปรับแนวทางกองกําลังกึ่งทหาร"
 BALTIC_align_paramilitarists_desc: "มีกลุมกองกําลังกึ่งทหารมากมายทั่ว[Root.GetNameDef] ซึ่งสวนใหญทุมเทใหแกการปกปองสิทธิในการกําหนดชะตากรรมตนเองของ[Root.GetAdjective]เพียงอยางเดียว แมจะนาชื่นชม แตจะดีกวาหากกลุมเหลานี้มองเราไมใชหุนเชิดของ[SOV.GetAdjective] แตเปนการสืบทอดอยางสมเหตุสมผลของรัฐ[Root.GetAdjective]"
 BALTIC_influence_neighbours: "แผอิทธิพลสูเพื่อนบาน"
 BALTIC_influence_neighbours_desc: "แมจะไมไดรับความนิยมเทากอนสงครามประกาศเอกราช แตแนวคิดเรื่องบอลติกที่เปนอิสระภายใตสังคมนิยมนั้นเกาแกพอ ๆ กับแนวคิดเรื่องสิทธิในการกําหนดชะตากรรมตนเองของบอลติก รัฐของเราสามารถเปนแบบอยางใหผูที่อยูใตระบอบกดขี่ของเผด็จการบอลติก และดวยการใชสิ่งนี้เปนอาวุธ เราจะสามารถเผยแพรการปฏิวัติสูเพื่อนบานไดโดยไมตองเสียเลือดเนื้อ"
 BALTIC_arm_baltic_reds: "ติดอาวุธใหพวกแดงบอลติก"
 BALTIC_arm_baltic_reds_desc: "เวทีพรอมแลว ไฟแหงคอมมิวนิสตกําลังลุกโชนไปทั่วบอลติก สิ่งที่พวกแดงตองการตอนนี้คือสัญญาณและทรัพยากรจากเรา แลวเราจะจุดชนวนการปฏิวัติบอลติก!"
 BALTIC_belarus_ssr: "สาธารณรัฐสังคมนิยมโซเวียต[Root.GetNonIdeologyName]-เบลารุส"
 BALTIC_belarus_ssr_desc: "แนวคิดการรวมเบลารุสกับบอลติกไมใชเรื่องแปลกใหม เมื่อนานมาแลว สาธารณรัฐสังคมนิยมโซเวียตลิทัวเนีย-เบลารุสเคยดํารงอยูในฐานะการหลอมรวมอยางกลมกลืนของสองชนชาติที่ดูเหมือนแตกตางกัน สังคมนิยมไมรูจักพรมแดนของวัฒนธรรมและภาษา และเราแทบไมเห็นเหตุผลวาทําไมกรรมกร[Root.GetAdjective]และเบลารุสจะอยูรวมกันไมได"
 BALTIC_end_bourgeouis_dictatorships: "ยุติเผด็จการกระฎมพี"
 BALTIC_end_bourgeouis_dictatorships_desc: "บอลติกถูกครอบงําโดยบรรดาเผด็จการที่เรียกตัวเองวา “เปนกลาง” ดวยการหนุนหลังจากกองทัพและโดยปราศจากความยินยอมของประชาชน ชนชั้นกรรมาชีพแหงบอลติกถูกกดขี่ภายใตเผด็จการทุนนิยม มีเพียงมือของกรรมกร[Root.GetAdjective]ผูเปนอิสระแลวเทานั้น ที่จะทําใหกรรมกรซึ่งถูกพรมแดนอันอยุติธรรมแบงแยกไดรวมรับการปลดปลอยอันรุงโรจนของเรา!"
 BALTIC_focus_on_the_interior: "มุงเนนภายในประเทศ"
 BALTIC_focus_on_the_interior_desc: "แมกรรมกรจํานวนมากจะกระหายที่จะเดินทัพสูเพื่อนบานและนําการปฏิวัติอันรุงโรจนไปสูชาวบอลติกทุกคน แตเราตองหันมามุงเนนภายในประเทศแทน เพื่อสรางเสถียรภาพใหระบอบหลังการปฏิวัติ"
 BALTIC_focus_on_the_interior_2: "เตรียมรับมือเยอรมัน"
 BALTIC_focus_on_the_interior_2_desc: "เราตองไมลืมความโหดรายสุดขีดที่ไฟรคอรปสนํามาสู[Root.GetNameDef]เมื่อหลายปกอน ชาวนาและกรรมกรถูกสังหารราวกับสัตว หมูบานทั้งหมูบานถูกเผาเปนเถาถานและซากปรักหักพัง และเราจะไมยอมใหประชาชน[Root.GetAdjective]ตองทนทุกขกับความโหดรายเชนนั้นอีก"
 BALTIC_united_baltic_ssr: "สาธารณรัฐสังคมนิยมโซเวียตบอลติกที่เปนหนึ่งเดียว"
 BALTIC_united_baltic_ssr_desc: "แมจะแตกตางกันทั้งวัฒนธรรม ภาษา และอัตลักษณ แตระหวางสามรัฐบอลติกมีความเปนพี่นองและมิตรภาพมาชานาน เราตองยอมรับวาเพื่อนบานของเราเปนสหายไมตางจากชาว[Root.GetAdjective]ดวยกัน และกรรมกรมีแตจะสูญเสียหากเราไมรวมเปนสาธารณรัฐกรรมกรหนึ่งเดียว"
 BALTIC_western_revolution: "นําการปฏิวัติสูตะวันตก"
 BALTIC_western_revolution_desc: "การปฏิวัติไมไดหยุดอยูแคบอลติก ชนชั้นลางแทบทั้งหมดของยุโรปยังตรากตรําทํางานดุจทาสในโรงงานภายใตท็อปบูตอันแข็งกราวของทุนนิยม และมีเพียงกรรมกร[Root.GetAdjective]เทานั้นที่สามารถปลดปลอยพวกเขาได"
 BALTIC_finnish_invasion: "บุกฟนแลนด"
 BALTIC_finnish_invasion_desc: "สําหรับเรา ฟนแลนดคือพี่นองที่พลัดหายและถูกพันธนาการดวยโซตรวนแหงทุนนิยม มีเพียงการปฏิวัติดวยกําลังเทานั้นที่จะปลดปลอยฟนแลนดได ดังที่บอลติกไดรับการปลดปลอยมาแลว"
 BALTIC_path_to_the_north_sea: "เสนทางสูทะเลเหนือ"
 BALTIC_path_to_the_north_sea_desc: "ชาวเดนมารกยังคงวางตัวเปนกลางอยางนาเวทนาในความขัดแยงระดับโลกที่ทวีความรุนแรงขึ้น และชองแคบเดนมารกคือสิ่งเดียวที่กั้นโลกสังคมนิยมออกจากทะเลเหนือ"
 BALTIC_end_swedish_neutrality: "ยุติความเปนกลางของสวีเดน"
 BALTIC_end_swedish_neutrality_desc: "สิ่งที่ชาวสวีเดนเรียกวาความเปนกลางนั้นไมใชอะไรอื่นนอกจากความออนแอ คอยโอนออนตามใจมหาอํานาจใดก็ตามที่ดูทรงพลังที่สุดในขณะนั้น โดยแทบไมแยแสตอความเปนอยูของชนชั้นลางขามพรมแดน รัฐบาลที่ใจเสาะและงอนแงนเชนนี้ไมคูควรจะมีพรมแดนติดกับเรา และเราตองสรางสวีเดนใหมที่มีกระดูกสันหลังพอจะปกปองประชาชนจากทรราช"
 BALTIC_free_the_workers_of_poland: "ปลดปลอยกรรมกรแหงโปแลนด"
 BALTIC_free_the_workers_of_poland_desc: "แมชาวโปลจะเคยปกครองบอลติก แตบัดนี้พวกเขากลายเปนเหยื่อที่เปราะบางตอระบอบนักลาของ[GER.GetNameDef] เราตองปกปองสหายของเราทางใตและรวมพวกเขาไวภายใตสาธารณรัฐสังคมนิยมโปแลนด!"
 #Baltic Entente
 LIT_baltic_economic_union: "สหภาพเศรษฐกิจบอลติก"
 LIT_baltic_economic_union_desc: "เมื่อเสรีประชาธิปไตยไดกลับคืนสูประเทศของเรา และเรากําลังสรางความสัมพันธทางการทูตอยางใกลชิดกับเพื่อนบาน การเขารวมสหภาพเศรษฐกิจกับรัฐบอลติกดวยกันจึงเปนเรื่องสมเหตุสมผล แมเศรษฐกิจของเราจะเล็ก แตเมื่อรวมกันก็อาจเติบโตแข็งแกรงได!"
 LIT_baltic_defence_army: "กองทัพปองกันบอลติก"
 LIT_baltic_defence_army_desc: "กองทัพของเราทํางานรวมกัน แตโดยพื้นฐานแลวยังเปนหนวยงานที่แยกจากกัน เมื่อความสัมพันธระหวางชาติของเราแนนแฟนขึ้น เราอาจจัดตั้งกองทัพบอลติกรวม ซึ่งเปนหนวยงานเฉพาะที่ไมอยูใตการควบคุมของรัฐบอลติกใดเลย แตเปนพันธมิตรของทุกรัฐ"
 LIT_pan_baltic_bank: "ธนาคารรวมบอลติก"
 LIT_pan_baltic_bank_desc: "เมื่อมีสหภาพเศรษฐกิจแลว เราก็มีโอกาสจัดตั้งธนาคารรวมบอลติกและสกุลเงินรวม"
 LIT_propose_baltic_union: "เสนอสหภาพบอลติก"
 LIT_propose_baltic_union_desc: "เมื่อหนวยงานตาง ๆ เหลานี้เชื่อมโยงชาติของเราเขาดวยกันแลว การจัดตั้งสหภาพบอลติกอยางเปนทางการก็ดูจะเปนสิ่งที่หลีกเลี่ยงไมได สหภาพจะใหสิทธิออกเสียงและสิทธิยับยั้งแกชาติสมาชิกทุกชาติ และจะนําชาติของเราใหใกลชิดกันยิ่งขึ้น"
 LIT_baltic_stronger_together: "รวมกันแตแยกกัน"
 LIT_baltic_stronger_together_desc: "ระหวางรัฐบอลติกมีความเปนพี่นองและมิตรภาพมาชานาน แตเราถูกพรมแดนและการเมืองแบงแยกมาโดยตลอด เราผูกพันกันทางการทูตดวยความมุงมั่นที่จะรักษาเอกราช ดังนั้นเราตองมุงมั่นสูเพื่อมิตรสหายและขยายกองทัพบอลติกรวม!"
 LIT_baltic_unification: "การรวมชาติบอลติก"
 LIT_baltic_unification_desc: "ระหวางรัฐบอลติกมีความเปนพี่นองและมิตรภาพมาชานาน แตเราถูกพรมแดนและการเมืองแบงแยกมาโดยตลอด แมอัตลักษณอิสระของแตละชาติจะเขมแข็ง แตความมุงมั่นที่จะสูเพื่อรักษาการดํารงอยูไดผูกเราไวดวยกัน บางทีถึงเวลาแลวที่สหภาพบอลติกจะพัฒนาเปนชาติหนึ่งเดียว"
