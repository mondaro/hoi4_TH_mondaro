 SOV_heavy_industry: "อุตสาหกรรมหนัก"
 SOV_heavy_industry_desc: "ขณะที่โครงการอุตสาหกรรมของเรายังคงเรงความเร็วขึ้นเรื่อย ๆ ถึงเวลาแลวที่จะหันมาใหความสําคัญกับอุตสาหกรรมหนักมากขึ้น เพื่อเตรียมผลิตยุทธปจจัยใหมากขึ้น"
 SOV_finish_the_five_year_plan: "[GetFinishTheFiveYearPlanName]"
 SOV_finish_the_five_year_plan_default: "ทําแผนหาปใหสําเร็จ"
 SOV_finish_the_five_year_plan_alt: "ยกเลิกแผนหาป"
 SOV_finish_the_five_year_plan_desc: "[GetFinishTheFiveYearPlanDesc]"
 SOV_finish_the_five_year_plan_desc_default: "แผนหาปฉบับที่สองใหความสําคัญกับการพัฒนาอุตสาหกรรมหนัก สหภาพโซเวียตตองพัฒนาอยางรวดเร็วเพื่อใหทัดเทียมกับมหาอํานาจทุนนิยมและฟาสซิสตแหงโลกตะวันตก"
 SOV_finish_the_five_year_plan_desc_alt: "แผนหาปของระบอบโซเวียตมุงเรงอุตสาหกรรมของประเทศอยางหนักหนวงเหนือสิ่งอื่นใด จนกลายเปนสัญลักษณที่ยิ่งใหญที่สุดอยางหนึ่งของการกดขี่โดยบอลเชวิค เราตองกําจัดโครงการนี้ใหสิ้นซาก และรางแผนอุตสาหกรรมแหงชาติฉบับใหมขึ้นมา"
 SOV_third_five_year_plan: "[GetThirdFiveYearPlanName]"
 SOV_third_five_year_plan_default: "แผนหาปฉบับที่สาม"
 SOV_third_five_year_plan_alt: "โครงการใหมเพื่ออุตสาหกรรมแหงชาติ"
 SOV_third_five_year_plan_desc: "[GetThirdFiveYearPlanDesc]"
 SOV_third_five_year_plan_desc_default: "ตราบใดที่สันติภาพยังคงอยู เราตองผลักดันการพัฒนาอุตสาหกรรมใหไปไดไกลและเร็วยิ่งขึ้น เพื่อตอบสนองความตองการของประชาชนและกองทัพของเรา"
 SOV_third_five_year_plan_desc_alt: "เราไดวางโครงการพัฒนาอุตสาหกรรมแหงชาติที่จะชวยเพิ่มการผลิตทั้งดานการทหารและพลเรือนในระยะยาว โดยไมจําเปนตองกดขี่ประชาชนหรือทําใหปจจัยพื้นฐานในการดํารงชีวิตของพวกเขาตกอยูในความเสี่ยง"
 SOV_reorganize_the_pc_of_heavy_industry: "[GetReorganizeThePcOfHeavyIndustryName]"
 SOV_reorganize_the_pc_of_heavy_industry_name_default: "ปรับโครงสรางคณะกรรมาธิการประชาชนดานอุตสาหกรรมหนัก"
 SOV_reorganize_the_pc_of_heavy_industry_name_alt: "ปรับโครงสรางกระทรวงอุตสาหกรรม"
 SOV_reorganize_the_pc_of_heavy_industry_desc: "การหันไปเนนอุตสาหกรรมหนักกอนหนานี้ทําใหความไรประสิทธิภาพบางอยางในการบริหารเริ่มปรากฏชัด เราตองจัดวางคนที่เหมาะสมใหอยูในตําแหนงที่เหมาะสม เพื่อใหการดําเนินงานกลับมาราบรื่นอีกครั้ง"
 SOV_industrial_modernization: "การปรับปรุงอุตสาหกรรมใหทันสมัย"
 SOV_industrial_modernization_desc: "ประเทศตะวันตกกําลังนําวิธีการผลิตแบบใหมและเทคโนโลยีใหมมาใชอยางรวดเร็ว เราจะพอใจเพียงแคตามใหทันไมได เราตองแซงหนาพวกเขาใหได!"
 SOV_increase_state_reserves: "เพิ่มทุนสํารองของรัฐ"
 SOV_increase_state_reserves_desc: "อุตสาหกรรมที่เติบโตขึ้นของเราตองการทรัพยากรมากขึ้นเรื่อย ๆ เราไมอาจรับประกันไดเสมอวาการผลิตทรัพยากรจะเติบโตทัน จึงตองสะสมทุนสํารองไวเทาที่ทําได"
 SOV_shift_to_armaments_production: "หันสูการผลิตอาวุธยุทโธปกรณ"
 SOV_shift_to_armaments_production_desc: "สงครามกําลังกอตัว เราไมรูวาใครจะลงมือกอน แตไมชาก็เร็วเราจะตองถูกโจมตี เราตองเตรียมพรอมตั้งแตบัดนี้ เพื่อใหพรอมรับมือเมื่อถึงเวลา"
 SOV_optimize_production_lines: "ปรับสายการผลิตใหเหมาะสม"
 SOV_optimize_production_lines_desc: "ประเทศอื่นประสบความสําเร็จในการนํา "ระบบฟอรด" มาใชในโรงงานเพื่อเพิ่มการผลิตใหสูงสุด เราตองเรียนรูจากตัวอยางของพวกเขา"
 SOV_steel_casting_industry: "อุตสาหกรรมหลอเหล็กกลา"
 SOV_steel_casting_industry_desc: "อุตสาหกรรมโลหการของเราเปนหัวหอกของการเติบโตทางอุตสาหกรรมมาตลอด แตยังสามารถผลักดันใหไปไดไกลกวานี้ดวยการนําวิธีการผลิตแบบใหมมาใช"
 SOV_synthetic_rubber: "ยางสังเคราะห"
 SOV_synthetic_rubber_desc: "วันหนึ่งเราจะไมสามารถพึ่งพายางนําเขาจากตางประเทศไดอีก เมื่อวันนั้นมาถึง เราตองพรอมผลิตยางในประเทศใหเพียงพอตอความตองการ"
 SOV_oil_production: "การผลิตนํ้ามัน"
 SOV_oil_production_desc: "กาวตอไปที่สมเหตุสมผลทั้งในการพัฒนาอุตสาหกรรมและการปรับปรุงกองทัพใหทันสมัยคือการเพิ่มการใชยานยนต ซึ่งตองใชนํ้ามันหลอลื่นและเชื้อเพลิงจํานวนมหาศาล โชคดีที่เรามีแหลงนํ้ามันสํารองมากมายที่นํามาใชได หากเราพัฒนาอุตสาหกรรมที่จําเปนขึ้นมา"
 SOV_restoration_and_development: "การฟนฟูและการพัฒนา"
 SOV_restoration_and_development_desc: "บัดนี้สงครามสิ้นสุดลงแลว เราสามารถกลับมาพัฒนาอุตสาหกรรมอยางสันติ และยกระดับชีวิตความเปนอยูของประชาชนได"
 SOV_fourth_five_year_plan: "[GetFourthFiveYearPlanName]"
 SOV_fourth_five_year_plan_default: "แผนหาปฉบับที่สี่"
 SOV_fourth_five_year_plan_alt: "การเริ่มตนใหม"
 SOV_fourth_five_year_plan_desc: "ยังตองใชเวลาอีกพักหนึ่งกวาจะฟนฟูความเสียหายจากสงครามไดทั้งหมด แตดวยการตั้งเปาหมายที่ถูกตอง เราก็สามารถเพิ่มผลิตภาพไดบางแลว"
 SOV_found_the_comecon: "กอตั้งโคมีคอน"
 SOV_found_the_comecon_desc: "สงครามแสดงใหเห็นวาเราตองยกระดับความรวมมือและการพัฒนาเศรษฐกิจของมิตรและพันธมิตรของเรา ดวยเหตุนี้ เราจะจัดตั้งองคการเพื่อประสานการคาและการพัฒนาเศรษฐกิจระหวางประเทศของเรา"
 SOV_found_the_warsaw_pact: "กอตั้งกติกาสัญญาวอรซอ"
 SOV_found_the_warsaw_pact_desc: "ขณะที่สายลมแหงการเปลี่ยนแปลงพัดผานยุโรป ก็ยิ่งชัดเจนวาเราตองมีสนธิสัญญาปองกันรวมกันเพื่อยับยั้งการรุกรานใด ๆ จากโลกตะวันตกที่เสื่อมทราม ดวยเหตุนี้ เราควรจัดตั้งองคการกติกาสัญญาวอรซออยางเปนทางการ เพื่อเปนสวนเสริมทางทหารของโคมีคอน"
 SOV_warsaw_pact_faction: "กติกาสัญญาวอรซอ"
 SOV_the_common_economic_space_initiative: "ขอริเริ่มเขตเศรษฐกิจรวม"
 SOV_the_common_economic_space_initiative_desc: "การขยายเศรษฐกิจจะงายขึ้นหากเราเขาถึงตลาดใหมสําหรับสินคาของเรา และไดรับทรัพยากรที่เศรษฐกิจตองการโดยมีอุปสรรคทางการคานอยลง เราควรจัดตั้งองคการเพื่อสงเสริมเรื่องนี้"
 SOV_no_time_for_peace: "ไมมีเวลาใหสันติภาพ"
 SOV_no_time_for_peace_desc: "ไมวาเราจะปรารถนาเพียงใด ความหวังที่จะไดสันติภาพที่ยั่งยืนก็มีอยูนอยนิด อาวุธและเทคโนโลยีใหมจะทําใหสงครามโหดรายยิ่งกวาเดิม และนาเศราที่เราตองลงทุนทรัพยากรที่หามาอยางยากลําบาก เพื่อใหตามศัตรูไดทัน"
 SOV_national_specialists: "ผูเชี่ยวชาญภายในชาติ"
 SOV_national_specialists_desc: "การพัฒนาเศรษฐกิจของเราตองขับเคลื่อนโดยผูที่คุนเคยกับสภาพของประเทศเปนหลัก ชาวตางชาติตองใชเวลานานกวาจะมีความรูนั้น และที่แยกวานั้น พวกเขาอาจนําความรูนั้นติดตัวกลับไปเมื่อจากไป"
 SOV_foreign_experts: "ผูเชี่ยวชาญตางชาติ"
 SOV_foreign_experts_desc: "มีผูเชี่ยวชาญตางชาติมากมายที่สามารถสอนเราไดมากเกี่ยวกับวิธีพัฒนาเศรษฐกิจ โชคดีที่หลายคนเปนนายทุน จึงสามารถซื้อตัวได"
 SOV_eastern_development: "การพัฒนาภาคตะวันออก"
 SOV_eastern_development_desc: "ดินแดนตะวันออกไกลที่อยูเลยเทือกเขาอูราลออกไปมีทรัพยากรมหาศาลที่ยังไมถูกใช และมีพื้นที่กวางขวางสําหรับการพัฒนาอุตสาหกรรม เราตองทําใหดินแดนเหลานี้พรอมรองรับโครงการที่ใหญขึ้น"
 SOV_develop_the_urals: "พัฒนาเทือกเขาอูราล"
 SOV_develop_the_urals_desc: "ภัยคุกคามที่ใหญที่สุดตอประเทศของเรานาจะมาจากชาติใดชาติหนึ่งในยุโรป การพัฒนาดินแดนที่อยูเลยเทือกเขาอูราล จะทําใหเรามีกําลังการผลิตอุตสาหกรรมสํารองที่แมแตเครื่องบินทิ้งระเบิดพิสัยไกลที่สุดก็ยากจะไปถึง"
 SOV_the_ussr_academy_of_sciences: "[GetTheUssrAcademyOfSciencesName]"
 SOV_the_ussr_academy_of_sciences_default: "สถาบันวิทยาศาสตรแหงสหภาพโซเวียต"
 SOV_the_ussr_academy_of_sciences_alt: "ราชบัณฑิตยสถานวิทยาศาสตรแหงจักรวรรดิ"
 SOV_the_ussr_academy_of_sciences_desc: "เพื่อใหสามารถแขงขันไดในสาขาวิทยาศาสตรประยุกต เราตองเปนผูนําในสาขาวิทยาศาสตรทฤษฎีดวย เรามีสถาบันวิทยาศาสตรที่มั่นคงอยูแลว แตหากไดงบประมาณเพิ่มเติมอีกเล็กนอย ก็จะกลายเปนโครงสรางพื้นฐานดานการวิจัยระดับโลกอยางแทจริง"
 SOV_national_academies_of_sciences: "สถาบันวิทยาศาสตรแหงชาติ"
 SOV_national_academies_of_sciences_desc: "ประเทศหุนสวนของเราควรไดรับการสนับสนุนใหจัดตั้งสถาบันในลักษณะเดียวกับสถาบันวิทยาศาสตรของเรา เพื่อเสริมขีดความสามารถดานการวิจัยของพวกเขาเอง"
 SOV_transformation_of_nature: "การเปลี่ยนแปลงธรรมชาติ"
 SOV_transformation_of_nature_desc: "ดวยแวดวงวิทยาศาสตรของเราที่ผลักดันขอบเขตของสิ่งที่เคยคิดวาเปนไปได แมแตโครงการที่ใหญโตและรุกลํ้าธรรมชาติที่สุดก็เริ่มเปนไปได"
 SOV_transformation_of_nature_alt: "$SOV_transformation_of_nature$"
 SOV_transformation_of_nature_alt_desc: "$SOV_transformation_of_nature_desc$"
 SOV_expand_the_aircraft_industry: "ขยายอุตสาหกรรมอากาศยาน"
 SOV_expand_the_aircraft_industry_desc: "ในสงครามที่จะมาถึง กองทัพอากาศของเราจะตองครองทองฟาเหนือศัตรูที่ติดอาวุธดวยยุทโธปกรณทันสมัยที่สุด เราตองทําใหแนใจวาพวกเขาไมเพียงมีเครื่องบินที่ทัดเทียมกัน แตยังมีจํานวนเพียงพอดวย"
 SOV_modernize_aircraft_facilities: "ปรับปรุงสถานที่ดานอากาศยานใหทันสมัย"
 SOV_modernize_aircraft_facilities_desc: "เครื่องบินที่ดีที่สุดในโลกก็จะไรประโยชนในไมชา หากตองบินขึ้นจากทางวิ่งที่ขรุขระและซอมบํารุงในโรงเก็บที่หลังคารั่ว เพื่อสมรรถนะที่ดีที่สุด เราตองมีโครงสรางพื้นฐานที่ดีที่สุดดวย"
 SOV_modernize_aircraft_facilities_tt: "หากไมมี§Yสถานทดลอง§!อื่นใน §Y[260.GetName]§! เราจะไดรับ§Yสถานวิจัยอากาศพลศาสตรและระบบอิเล็กทรอนิกสอากาศยาน§! §G1§! แหงใน §Y[260.GetName]§!"
 SOV_merge_aircraft_plants: "ควบรวมโรงงานอากาศยาน"
 SOV_merge_aircraft_plants_desc: "แมการแขงขันระหวางนักออกแบบจะเปนแรงจูงใจตามธรรมชาติใหพัฒนาอยูเสมอ แตก็สิ้นเปลืองทรัพยากรไปกับงานที่ซํ้าซอน ซึ่งเราไมอาจแบกรับได เราควรควบรวมสํานักงานออกแบบเพื่อขจัดความสูญเปลานี้"
 SOV_found_the_jet_institute: "กอตั้งสถาบันเครื่องยนตไอพน"
 SOV_found_the_jet_institute_desc: "เครื่องยนตลูกสูบในปจจุบันพัฒนาไปไดอีกไมมากนัก เครื่องบินในอนาคตจะตองพึ่งพาระบบขับเคลื่อนแบบใหม เราควรกอตั้งสถาบันวิจัยเครื่องยนตไอพน เพื่อไมใหถูกการพัฒนาของตางชาติแซงหนา"
 SOV_increase_aircraft_production: "เพิ่มการผลิตอากาศยาน"
 SOV_increase_aircraft_production_desc: "ชวงหลังมานี้มีการเนนเรื่องความปลอดภัยมากเกินไป จนเริ่มสงผลเสียตอยอดการผลิตเครื่องบินใหม เราสามารถประหยัดทรัพยากรไดมากดวยการตัดระบบความปลอดภัยที่เกินจําเปนที่สุดออก โดยยังคงรักษากองทัพอากาศที่ปลอดภัยและมีขีดความสามารถสูงไวได"
 SOV_foster_flying_clubs: "สงเสริมชมรมการบิน"
 SOV_foster_flying_clubs_desc: "การฝกนักบินใหมที่ไมเคยเห็นเครื่องบินมากอนนั้นมีคาใชจายสูง แตคนหนุมสาวจํานวนมากหลงใหลการบิน และหากไดรับการสนับสนุน ก็จะเติบโตเปนนักบินฝมือดีที่เรียนรูรายละเอียดปลีกยอยของการรบทางอากาศไดอยางรวดเร็ว หากพวกเขารูพื้นฐานการบังคับเครื่องบินอยูแลว"
 SOV_women_in_aviation: "สตรีในวงการการบิน"
 SOV_women_in_aviation_desc: "ในอดีต กลุมหัวลาหลังในสังคมประกาศวาการบินเปนเรื่องของผูชาย แตสตรีทั่วโลกไมสนใจคําพูดนั้น และไดพิสูจนแลววาพวกเธอเกงไมแพเพื่อนรวมงานชายเลย เราควรสนับสนุนใหสตรีของเราลองฝกบิน เพื่อคัดเลือกนักบินที่มีความสามารถที่สุดจากพวกเธอ"
 SOV_raskovas_aviation_group: "[GetRaskovasAviationGroupName]"
 SOV_raskovas_aviation_group_default: "กองบินของราสโควา"
 SOV_raskovas_aviation_group_alt: "กองบินหญิงลวนแหงจักรวรรดิกองแรก"
 SOV_raskovas_aviation_group_desc: "[GetRaskovasAviationGroupDesc]"
 SOV_raskovas_aviation_group_desc_default: "มารีนา ราสโควา พิสูจนแลววาเธอเปนนักเดินอากาศและนักบินที่มีความสามารถยิ่ง ในขณะที่ทรัพยากรของเราตึงตัวจากสงครามครั้งนี้ เราไมอาจปลอยใหคนที่มีประสบการณอยางเธอนั่งดูอยูขางสนามได เราควรมอบทรัพยากรใหเธอจัดตั้งหนวยการบินจํานวนหนึ่งเพื่อสนับสนุนการตอสู"
 SOV_raskovas_aviation_group_desc_alt: "เรามีนักเดินอากาศและนักบินหญิงที่มีความสามารถยิ่ง ในขณะที่ทรัพยากรของเราตึงตัวจากสงครามครั้งนี้ เราไมอาจปลอยใหคนที่มีประสบการณเชนนี้นั่งดูอยูขางสนามได เราควรจัดตั้งหนวยการบินหญิงลวนจํานวนหนึ่งเพื่อสนับสนุนการตอสู"
 SOV_intensify_pilot_training_program: "เขมขนโครงการฝกนักบิน"
 SOV_intensify_pilot_training_program_desc: "เพื่อใหสามารถแขงขันได กองทัพอากาศของเราตองบินและรบไดในทุกสถานการณ วิธีที่ดีที่สุดคือฝกนักบินใหไดมาตรฐานสูงสุด สิ่งใดที่เราขาดไปในดานจํานวนหรือความลํ้าหนาทางเทคนิค เราจะชดเชยดวยฝมือลวน ๆ"
 SOV_expand_aviation_institutes: "ขยายสถาบันการบิน"
 SOV_expand_aviation_institutes_desc: "คอขวดที่ใหญที่สุดในการขยายกองทัพอากาศคือขีดความสามารถในการฝกนักบิน การขยายโรงเรียนการบินจะวางรากฐานสําหรับกองทัพอากาศที่ใหญขึ้นและเชี่ยวชาญยิ่งขึ้น"
 SOV_ground_support: "การสนับสนุนภาคพื้นดิน"
 SOV_ground_support_desc: "ภารกิจหลักของกองทัพอากาศตองเปนการสนับสนุนกําลังภาคพื้นดิน ขอเท็จจริงพื้นฐานนี้ตองเปนหลักในการตัดสินใจทุกครั้ง"
 SOV_long_range_aircraft: "อากาศยานพิสัยไกล"
 SOV_long_range_aircraft_desc: "เทคโนโลยีกาวหนาจนถึงขั้นที่เครื่องบินทิ้งระเบิดของเราสามารถไปถึงทุกจุดในมาตุภูมิของศัตรู และทําลายขีดความสามารถในการทําสงครามของพวกเขาไดในเวลาอันสั้น กองทัพบกมีไวเพื่อตรึงแนวรบจนกวาจะบรรลุเปาหมายนี้เปนหลัก"
 SOV_the_modern_war_in_the_skies: "สงครามสมัยใหมบนฟากฟา"
 SOV_the_modern_war_in_the_skies_desc: "สงครามทางอากาศพัฒนาไปไกลมากนับตั้งแตยุคเครื่องบินสองชั้นดวลกันเหนือสนามเพลาะ ทุกวันนี้มันมีลักษณะเชิงอุตสาหกรรม ดวยจังหวะการปฏิบัติการที่สูงเพื่อกดดันศัตรูตลอดวันตลอดคืน เราตองยอมรับขอเท็จจริงนี้และวางแผนใหสอดคลอง"
 SOV_expand_the_red_fleet: "ขยายกองเรือ[GetSovietArmyAdjectiveBasedOnIdeology]"
 SOV_expand_the_red_fleet_desc: "[GetExpandTheRedFleetDesc]"
 SOV_expand_the_red_fleet_desc_default: "$SOV_expand_red_fleet_desc$"
 SOV_expand_the_red_fleet_desc_alt: "กองเรือ[GetSovietArmyAdjectiveBasedOnIdeology]ออนแออยางนาสมเพชเมื่อเทียบกับกองทัพเรือของมหาอํานาจอื่น เราตองทําใหการขยายกองเรือเปนวาระสําคัญของชาติ!"
 SOV_reinforce_western_naval_bases: "เสริมกําลังฐานทัพเรือฝงตะวันตก"
 SOV_reinforce_western_naval_bases_desc: "กองเรือบอลติกตั้งอยูในฐานทัพที่เปดโลงตอการโจมตีอยางมาก เราควรลงทุนทรัพยากรสวนหนึ่งเพื่อปกปองที่ทอดสมอของกองเรือ และปรับปรุงขีดความสามารถในการซอมบํารุง"
 SOV_reinforce_northern_naval_bases: "เสริมกําลังฐานทัพเรือฝงเหนือ"
 SOV_reinforce_northern_naval_bases_desc: "แมจะตั้งอยูเหนือเสนอารกติกเซอรเคิล แตนาขันที่มูรมันสคเปนทาเรือแหงเดียวของเราที่ไมมีนํ้าแข็งปกคลุมตลอดทั้งปและเขาถึงมหาสมุทรเปดได เราควรพัฒนาทาเรือนี้ตอไปเพื่อใหเขาถึงสวนอื่นของโลกไดดียิ่งขึ้น"
 SOV_reinforce_southern_naval_bases: "เสริมกําลังฐานทัพเรือฝงใต"
 SOV_reinforce_southern_naval_bases_desc: "ทะเลดําอาจดูเหมือนเปนสมรภูมิรอง แตหากเราสูญเสียการควบคุมทะเลแหงนี้ ดินแดนทางใตทั้งหมดของเราจะเปดโลงตอการรุกรานของศัตรู ดังที่เคยเกิดขึ้นในสงครามไครเมีย เราตองไมปลอยใหเรื่องนี้เกิดขึ้นอีก และควรเสริมกําลังฐานทัพเรือในภูมิภาคนี้"
 SOV_reinforce_eastern_naval_bases: "เสริมกําลังฐานทัพเรือฝงตะวันออก"
 SOV_reinforce_eastern_naval_bases_desc: "แมหลังความอัปยศในป 1905 ญี่ปุนก็ยังไมหยุดสงเสียงขูวาจะรุกลํ้าดินแดนของเรา เราตองพรอมทําสงครามกับพวกเขา ซึ่งหมายถึงการเสริมกําลังฐานทัพเรือในภูมิภาคนี้"
 SOV_expand_shipbuilding_plants: "ขยายโรงงานตอเรือ"
 SOV_expand_shipbuilding_plants_desc: "ภูมิศาสตรบังคับใหเราตองมีอูตอเรือกระจายอยูหางไกลกันเพื่อสนับสนุนกองเรือตาง ๆ ความพยายามใด ๆ ที่จะเพิ่มกําลังการตอเรือจึงตองกระจายออกไปเชนกัน"
 SOV_merge_naval_plants: "ควบรวมโรงงานดานนาวี"
 SOV_merge_naval_plants_desc: "การตอเรือและการออกแบบเรือเปนกระบวนการที่ใชเวลานาน การแขงขันที่มากเกินไปจึงไรประสิทธิภาพ เราควรควบรวมสํานักงานออกแบบเพื่อขจัดความสิ้นเปลืองนี้"
 SOV_pc_of_the_ussr_navy: "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_ussr_navy_default: "คณะกรรมาธิการประชาชนแหงกองทัพเรือสหภาพโซเวียต"
 SOV_pc_of_the_ussr_navy_alt: "กระทรวงทหารเรือรัสเซีย"
 SOV_pc_of_the_ussr_navy_desc: "เมื่อกองทัพเรือของเราทันสมัยและมีขีดความสามารถมากขึ้น ถึงเวลาที่ตองยอมรับวากองทัพเรือเปนเหลาทัพที่มีความสําคัญเทาเทียมกับกองทัพบก กาวแรกคือการอนุญาตใหกองทัพเรือตั้งหนวยงานบริหารแยกจากกองทัพบก"
 SOV_surface_warfare: "การรบผิวนํ้า"
 SOV_surface_warfare_desc: "เรือหลักตองใชเวลาและทรัพยากรมหาศาล และหลายครั้งก็ลาสมัยไปกอนจะตอเสร็จเสียอีก เรือขนาดเล็กสรางไดเร็วกวามาก จึงตามทันการพัฒนาทางเทคโนโลยีไดงายกวา เราควรมุงพัฒนากองกําลังเรือเบาใหเปนกําลังหลักของการรบทางเรือ"
 SOV_submarine_warfare: "การรบดวยเรือดํานํ้า"
 SOV_submarine_warfare_desc: "เรือดํานํ้ามีขอไดเปรียบอยางมากในการรบทางทะเล เรือดํานํ้าสมัยใหมที่ออกแบบมาอยางดีแทบตรวจจับไมไดเลยกอนจะยิงตอรปโด และอาจทําใหเรือหลักที่ใหญและแพงกวาหลายเทาพิการได เราควรมุงพัฒนาเรือประเภทนี้ใหเปนกําลังรุกหลักของกองทัพเรือ"
 SOV_offensive_maritime_strategy: "ยุทธศาสตรทางทะเลเชิงรุก"
 SOV_offensive_maritime_strategy_desc: "เราไมอาจนั่งรอใหศัตรูบุกเขามาหาได เราตองเปนฝายริเริ่มและโจมตีศัตรูทุกที่ที่ทําได"
 SOV_an_oceangoing_navy: "กองทัพเรือนํ้าลึก"
 SOV_an_oceangoing_navy_desc: "$SOV_ocean_going_navy_desc$"
 SOV_mine_warfare: "การสงครามทุนระเบิด"
 SOV_mine_warfare_desc: "การพยายามปองกันชายฝงทั้งหมดดวยเรือนั้นไมคุมคา การวางทุนระเบิดในจุดยุทธศาสตรจะชวยยับยั้ง หรืออยางนอยก็สรางความเสียหายแกกองเรือศัตรูที่พยายามเขาใกลชายฝงของเรา"
 SOV_long_range_raiders: "เรือจูโจมพิสัยไกล"
 SOV_long_range_raiders_desc: "ดวยระยะทางจากฐานทัพเรือของเราไปยังเสนทางเดินเรือหลัก เรือดํานํ้าปจจุบันของเราจะเขาถึงแหลงลาอันอุดมสมบูรณไดยาก เราควรพัฒนาเรือดํานํ้าพิสัยไกลขึ้น เพื่อใหมั่นใจวาเราจะโจมตีศัตรูไดตรงจุดที่เจ็บปวดที่สุด"
 SOV_advanced_maneuvers: "การซอมรบขั้นสูง"
 SOV_advanced_maneuvers_desc: "การมีเรือขนาดใหญและทันสมัยไมมีประโยชนอะไร หากลูกเรือไมรูวาจะใชงานอยางไร เราตองจัดการซอมรบทางเรือขนาดใหญเปนประจํา เพื่อฝกลูกเรือและนายทหารใหพรอมสําหรับการรบทางเรือสมัยใหม"
 SOV_expand_the_morskaya_aviatsiya: "ขยายมอรสกายา อาเวียตซียา"
 SOV_expand_the_morskaya_aviatsiya_desc: "เครื่องบินไดเปลี่ยนโฉมการรบภาคพื้นดินไปอยางมากแลว ในอนาคต เครื่องบินจะเปนภัยรายแรงแมแตกับเรือผิวนํ้าที่ทันสมัยที่สุด เราควรทําใหมั่นใจวาเราจะมีกําลังการบินนาวีที่ทันสมัยไวสนับสนุนเรือลําอื่น ๆ เสมอ"
 SOV_naval_infantry: "ทหารราบนาวี"
 SOV_naval_infantry_desc: "[GetNavalInfantryDesc]"
 SOV_naval_infantry_desc_default: "แมเราจะไมมีเจตนายกพลขึ้นบกบนชายฝงศัตรูเพื่อแผอํานาจแบบจักรวรรดินิยม แตกองกําลังทหารราบนาวีโดยเฉพาะก็มีประโยชนมากในการจูโจมสิ่งปลูกสรางชายฝงของศัตรูและคุกคามแนวชายฝงของพวกเขา"
 SOV_naval_infantry_desc_alt: "หากเราจะขยายพรมแดน กองกําลังทหารราบนาวีโดยเฉพาะจะมีประโยชนมากในการจูโจมสิ่งปลูกสรางชายฝงของศัตรู คุกคามแนวชายฝงของพวกเขา และสนับสนุนกําลังยกพลขึ้นบกหลัก"
 SOV_found_the_pcdi: "[GetFoundThePcdiName]"
 SOV_found_the_pcdi_name_default: "กอตั้งคณะกรรมาธิการประชาชนดานอุตสาหกรรมกลาโหม"
 SOV_found_the_pcdi_name_alt: "กอตั้งกระทรวงอุตสาหกรรมกลาโหม"
 SOV_found_the_pcdi_desc: "[GetFoundThePcdiDesc]"
 SOV_found_the_pcdi_desc_default: "อุตสาหกรรมอาวุธยุทโธปกรณของเราขยายตัวใหญโตมาก และตองมีหนวยงานรัฐโดยเฉพาะคอยประสานงานหากจะเติบโตตอไป เราจะจัดตั้งคณะกรรมาธิการประชาชนดานอุตสาหกรรมกลาโหม"
 SOV_found_the_pcdi_desc_alt: "อุตสาหกรรมอาวุธยุทโธปกรณของเราขยายตัวใหญโตมาก และตองมีหนวยงานรัฐโดยเฉพาะคอยประสานงานหากจะเติบโตตอไป เราจะจัดตั้งกระทรวงอุตสาหกรรมกลาโหม"
 SOV_pc_of_mechanical_engineering: "[GetPcOfMechanicalEngineeringName]"
 SOV_pc_of_mechanical_engineering_name_default: "คณะกรรมาธิการประชาชนดานวิศวกรรมเครื่องกล"
 SOV_pc_of_mechanical_engineering_name_alt: "กระทรวงวิศวกรรมเครื่องกล"
 SOV_pc_of_mechanical_engineering_desc: "อุตสาหกรรมของเราสามารถสรางเครื่องมือกลและเครื่องจักรหนักที่ใหญและซับซอนขึ้นเรื่อย ๆ จนถึงขั้นที่สมควรตั้งหนวยงานรัฐแยกตางหากเพื่อประสานโครงการเหลานี้"
 SOV_superior_war_machines: "จักรกลสงครามที่เหนือกวา"
 SOV_superior_war_machines_desc: "รถถังและยานเกราะพัฒนาไปอยางมากในชวงทศวรรษที่ผานมา ดวยอุตสาหกรรมอาวุธขนาดใหญที่ผลิตและสงกําลังบํารุงให เราสามารถสรางยานรบที่เหนือกวาและนํามาใชเปนจํานวนมหาศาลเขาบดขยี้ศัตรูได"
 SOV_the_means_to_wage_war: "ปจจัยในการทําสงคราม"
 SOV_the_means_to_wage_war_desc: "แมเครื่องบิน ปนใหญ และรถถังของกองทัพมักไดรับความสนใจมากที่สุดและดูโดดเดนที่สุดในขบวนสวนสนาม แตทหารธรรมดาใสใจกับคุณภาพของปนไรเฟลและความสบายของรองเทาบูตมากกวา เราตองยอมรับวาสิ่งเหลานี้สําคัญตอการทําสงครามไมนอยไปกวาเครื่องบินขับไลหรือปนใหญฮาวอิตเซอรหนักเลย"
 SOV_development_of_tankograd: "การพัฒนาแทงโคกราด"
 SOV_development_of_tankograd_desc: "ประเทศของเรากวางใหญไพศาล การขนสงชิ้นสวนยอยจากโรงงานหนึ่งไปอีกโรงงานหนึ่งจึงไมสะดวก เราควรรวมโรงงานรถถังแบบครบวงจรแทน โดยเหล็กกลาเขาทางหนึ่ง และรถถังที่เสร็จสมบูรณออกมาอีกทางหนึ่ง"
 SOV_pc_of_mortar_armament: "[GetPcOfMortarArmamentName]"
 SOV_pc_of_mortar_armament_name_default: "คณะกรรมาธิการประชาชนดานอาวุธปนครก"
 SOV_pc_of_mortar_armament_name_alt: "กระทรวงอาวุธปนครก"
 SOV_pc_of_mortar_armament_desc: "ปนครกธรรมดา ๆ กําลังกลายเปนอาวุธยิงสนับสนุนจากระยะไกลหลักของหนวยเราอยางรวดเร็ว เราจึงตองพยายามผลิตปนครกทุกขนาดใหไดมากที่สุด และตั้งหนวยงานรัฐที่มีหนาที่เพียงอยางเดียวคือทําเชนนั้น"
 SOV_soviet_artillery: "ปนใหญ[ROOT.GetAdjective]"
 SOV_soviet_artillery_tech_bonus_name_default: "ปนใหญโซเวียต"
 SOV_soviet_artillery_tech_bonus_name_alt: "ปนใหญรัสเซีย"
 SOV_soviet_artillery_desc: "สงครามในปจจุบันเอาชนะไดดวยการใชอํานาจการยิงอยางเปนวิทยาศาสตรในจุดที่ถูกตอง เราจะทุมเทความพยายามไมเพียงแคพัฒนาปนที่ดีกวา แตรวมถึงวิธีใชงานใหมีประสิทธิภาพสูงสุดดวย"
 SOV_merge_tank_and_materiel_plants: "ควบรวมโรงงานรถถังและยุทธภัณฑ"
 SOV_merge_tank_and_materiel_plants_desc: "รถถังและปนใหญนาจะเหมาะกับการผลิตจํานวนมากที่สุด เพราะไดประโยชนจากการประหยัดตอขนาด เราจึงควรบังคับควบรวมผูผลิตรถถังและยุทธภัณฑเพื่อใชประโยชนจากขอนี้"
 SOV_strengthen_the_mobilization_plan: "เสริมความแข็งแกรงแผนระดมพล"
 SOV_strengthen_the_mobilization_plan_desc: "ขอไดเปรียบทางทหารที่ใหญที่สุดของเรามาโดยตลอดคือความกวางใหญของประเทศและจํานวนประชากรมหาศาล แตเมื่อตองสงทหารไปแนวหนา สองสิ่งนี้อาจกลับขัดกันเอง เราตองปรับปรุงและพัฒนาแผนระดมพลอยางตอเนื่อง เพื่อใหมั่นใจวาเมื่อเกิดสงคราม เราจะรวมกําลังไดอยางรวดเร็ว"
 SOV_military_engineering_university: "มหาวิทยาลัยวิศวกรรมการทหาร"
 SOV_military_engineering_university_desc: "แมหลายคนจะประกาศวาสงครามสนามเพลาะสิ้นสุดลงแลวหลังการพัฒนารถถังและเครื่องบิน แตเปนที่ชัดเจนวาวิศวกรรมการทหารยังมีที่ทางในสนามรบสมัยใหม เราควรตั้งสถาบันเพื่อศึกษาวิธีการสรางปอมสนามสมัยใหม"
 SOV_leningrad_polytechnical_institute: "สถาบันโพลีเทคนิค[195.GetName]"
 SOV_leningrad_polytechnical_institute_desc: "ในฐานะสถาบันวิศวกรรมชั้นนําของเรา สถาบันโพลีเทคนิค[195.GetName]ไดผลิตวิศวกรและนักออกแบบอุตสาหกรรมใหประเทศมาชานาน เราควรขยายสถาบันนี้ตอไปเพื่อใหมั่นใจวาเราจะมีบุคลากรที่ดีที่สุดพรอมรับตําแหนงใหมในอุตสาหกรรมที่กําลังเติบโต"
 SOV_soviet_atomic_bomb_project: "โครงการระเบิดปรมาณู[ROOT.GetAdjective]"
 SOV_soviet_atomic_bomb_project_desc: "เรารูวานักวิทยาศาสตรในประเทศอื่นกําลังทํางานอยางหนักเพื่อพัฒนาวิธีเปลี่ยนพลังพื้นฐานที่สุดของจักรวาลใหเปนอาวุธรูปแบบใหม แมเราจะตามหลังอยู แตเราสามารถใชผลงานของพวกเขามาตอยอดงานของเราเอง และรักษาดุลแหงการทําลายลางไวได"
 SOV_soviet_atomic_bomb_project_tt: "หากไมมี§Yสถานทดลอง§!อื่นใน §Y[588.GetName]§! เราจะไดรับ§Yสถานวิจัยนิวเคลียร§! §G1§! แหงใน §Y[588.GetName]§!"
 SOV_move_industry_to_the_urals: "ยายอุตสาหกรรมไปยังเทือกเขาอูราล"
 SOV_move_industry_to_the_urals_desc: "สงครามมาถึงเราแลว และมาตุภูมิกําลังตกอยูในอันตราย แมกองกําลังของเราจะสูจนกระสุนนัดสุดทายโดยไมยอมเสียแผนดินแมแตฝกาวเดียว แตดวยกําลังขาศึกที่ประจันหนาเราอยู เราไมอาจมั่นใจไดวาจะเพียงพอ เราตองอพยพโรงงานไปยังที่ปลอดภัยกอนที่จะถูกยึด"
 SOV_the_road_of_life: "ถนนแหงชีวิต"
 SOV_the_road_of_life_desc: "ดวยหลายเมืองของเราถูกคุกคามและถูกปดลอม เราตองมุงสงสิ่งที่กองกําลังในพื้นที่เหลานั้นตองการเพื่อยืนหยัดตอไป ไมวาจะตองแลกดวยอะไรก็ตาม"
 SOV_improve_the_stalin_line: "[GetImproveTheStalinLineName]"
 SOV_improve_the_stalin_line_name_default: "ปรับปรุงแนวสตาลิน"
 SOV_improve_the_stalin_line_name_alt: "เสริมความแข็งแกรงแนวปองกันตะวันตก"
 SOV_improve_the_stalin_line_desc: "พรมแดนดานตะวันตกของเรายาวเกินกวาจะสรางปอมปราการไดทั้งหมด แตเราสามารถสรางแนวปอมที่บีบใหการโจมตีของศัตรูไหลเขาสูพื้นที่ที่คาดการณได ซึ่งเราสามารถตีโตดวยกําลังที่รวมพลไวไดอยางงายดาย"
 SOV_the_molotov_line: "[GetTheMolotovLineName]"
 SOV_the_molotov_line_name_default: "แนวโมโลตอฟ"
 SOV_the_molotov_line_name_left: "แนวทรอตสกี"
 SOV_the_molotov_line_name_right: "แนวบูคาริน"
 SOV_the_molotov_line_name_exiles: "แนวซาร"
 SOV_the_molotov_line_desc: "การเปลี่ยนแปลงภูมิศาสตรการเมืองของยุโรปเมื่อไมนานมานี้ไดเลื่อนพรมแดนดานตะวันตกของเราไปทางตะวันตกอีกมาก แผนปอมปราการเกา ๆ จึงลาสมัยไปแลว เราตองสรางแนวใหมตามพรมแดนใหมเพื่อชะลอการโจมตีของศัตรูจนกวาเราจะระดมกําลังเพื่อตีโตได"
 SOV_the_defense_of_moscow: "การปองกันมอสโก"
 SOV_the_defense_of_moscow_desc: "ศัตรูมายืนอยูหนาประตูมอสโกแลว ที่นี่คือที่ที่เราจะยืนหยัดสู และตีพวกมันใหลาถอยไปสูความพายแพ เหมือนที่เราทํากับนโปเลียน!"
 SOV_impregnable_forts: "ปอมปราการที่ไมอาจตีแตก"
 SOV_impregnable_forts_desc: "วิศวกรรม[ROOT.GetAdjective]ในตอนนี้สามารถสรางปอมปราการที่นาเกรงขามอยางแทจริง ทนทานตอแมแตการระดมยิงที่หนักหนวงที่สุดไดอยางงายดาย และแทบเปนไปไมไดที่จะบุกยึด ดวยกระสุนและเสบียงที่สะสมไวมากมาย ปอมเหลานี้จะตานทานการโจมตีของศัตรูไดนานหลายปหากจําเปน"
 SOV_protect_the_white_sea_baltic_canal: "ปกปองคลองทะเลขาว - ทะเลบอลติก"
 SOV_protect_the_white_sea_baltic_canal_desc: "คลองที่เชื่อมระหวางทะเลบอลติกกับทะเลขาวเปนสุดยอดผลงานทางวิศวกรรมสมัยใหม และตองไมปลอยใหตกอยูในมือศัตรู"
 SOV_far_east_fortification: "ปอมปราการตะวันออกไกล"
 SOV_far_east_fortification_desc: "นับตั้งแตสงครามกับญี่ปุนในป 1905 เราไดเฝาจับตาภูมิภาคนี้อยางระแวดระวังมาตลอด ไมใชความลับวากลุมหนึ่งในกองทัพญี่ปุนมองดินแดนตะวันออกไกลของเราดวยความโลภอยางไมปดบัง เราตองเตรียมพรอมสําหรับการเผชิญหนาในภูมิภาคนั้น และตองดําเนินการชะลอการโจมตีของศัตรู เพื่อซื้อเวลาในการเคลื่อนกําลังจากรัสเซียตะวันตกเขาสูภูมิภาค"
 SOV_restore_cossack_units: "ฟนฟูหนวยคอสแซค"
 SOV_restore_cossack_units_desc: "ในยามคับขัน มาตุภูมิไมถามรายละเอียดวาใครตองการรับใชเพื่อปกปองแผนดิน ทุกคนที่พรอมจับอาวุธตอสูผูรุกรานลวนไดรับการตอนรับ และจะไดรับมอบหมายงานตามความสามารถที่ดีที่สุดของตน"
 SOV_cohesion_first: "เอกภาพมากอน"
 SOV_cohesion_first_desc: "สิ่งสุดทายที่เราตองการในสถานการณนี้คือการลดมาตรฐาน ทุกคนที่ตองการรับราชการทหารลวนไดรับการตอนรับ แตพวกเขาจะตองประจําการในหนวยที่มีอยูแลว และไดรับการฝกตามมาตรฐานทางทหารที่เหมาะสม"
 SOV_rehabilitated_military: "ฟนฟูกองทัพ"
 SOV_rehabilitated_military_desc: "[GetRehabilitatedMilitaryName]"
 SOV_rehabilitated_military_desc_default: "ตอนนี้ชัดเจนแลววาการเฝาจับตากองทัพอยางใกลชิดของเราอาจเขมงวดเกินไปบาง แมจะสมเหตุสมผลในยามสงบ แตในยามสงคราม เราควรปลอยใหมืออาชีพตัดสินใจตามสถานการณทางทหาร ไมใชตามการพิจารณาทางการเมือง ถึงเวลาที่จะลดบทบาทของนายทหารการเมืองลงบาง และใหผูบังคับบัญชามีอิสระในการดําเนินการมากขึ้น"
 SOV_rehabilitated_military_desc_alt: "พวกบอลเชวิคเฝาจับตากองทัพอยางเขมงวดสุดขีด แลวมันเกิดประโยชนอะไรกับพวกเขา? แมเราจะตองคงตําแหนงนายทหารการเมืองไวเพื่อกําจัดความคิดที่ปนเปอนลัทธิคอมมิวนิสตใหสิ้น แตในยามสงคราม เราควรปลอยใหนายทหารตัดสินใจตามสถานการณทางทหาร ไมใชตามการพิจารณาทางการเมือง"
 SOV_military_reorganization: "การปรับโครงสรางกองทัพ"
 SOV_military_reorganization_desc: "ความพยายามสรางกองทัพยานเกราะลําเลียงพลขนาดใหญของเรานั้นนายกยอง แตเกินกําลังที่เราจะรับไหว เพื่อชนะสงครามนี้ เราตองมุงเนนเหลาทัพที่นํากองทัพรัสเซียสูชัยชนะมานานหลายศตวรรษ นั่นคือทหารราบและปนใหญ ซึ่งยอมตองทําใหการจัดกําลังที่มีอยูปนปวนไปบาง"
 SOV_desperate_measures: "มาตรการสิ้นหวัง"
 SOV_desperate_measures_desc: "ในสถานการณสิ้นหวังเชนนี้ เราตองใชมาตรการที่เคยคิดวาเปนไปไมได สิ่งใดก็ตามที่ชวยหยุดยั้งการรุกรานไดตองทําทั้งสิ้น"
 SOV_an_adaptable_army: "กองทัพที่ปรับตัวได"
 SOV_an_adaptable_army_desc: "สงครามครั้งนี้แผขยายขามหลายเขตภูมิอากาศและภูมิประเทศที่หลากหลาย เราตองสามารถรบไดในทุกภูมิประเทศและทุกสภาพอากาศหากตองการชนะสงครามนี้"
 SOV_lessons_of_war: "บทเรียนจากสงคราม"
 SOV_lessons_of_war_desc: "แผนการใด ๆ ที่เรามีกอนสงครามสวนใหญลวนพังทลายเมื่อปะทะกับศัตรู เราตองเปดรับบทเรียนที่สงครามครั้งนี้สอนเรา และไมยึดติดกับหลักคิดที่ลาสมัย เมื่อนั้นเราจึงจะหยุดการลาถอยและกลับมาเปนฝายรุกได"
 SOV_penal_battalions: "กองพันลงทัณฑ"
 SOV_penal_battalions_desc: "ระหวางการลาถอย ทหารที่มีความสามารถหลายคนทําใหตนเองอับอายดวยการถอยกอนที่ที่มั่นจะแตก หรือกระทําการอื่นที่ขัดตอวินัยอันดีของกองทัพ แตในสถานการณนี้ การจําคุกหรือประหารพวกเขาเพียงอยางเดียวจะทําใหเราสูญเสียนักรบฝมือดีไป เราควรตั้งหนวยพิเศษที่คนเหลานี้สามารถไถโทษตนเองผานการสูรบ"
 SOV_organization_of_the_partisans: "จัดตั้งกองโจร"
 SOV_organization_of_the_partisans_desc: "หลังแนวรบถูกตีแตก ทหารจํานวนมากที่ตกคางอยูหลังแนวขาศึกเลือกที่จะสูตอแทนการตกเปนเชลยอยางอัปยศ พวกเขารวมมือกับชาวนาและกรรมกรในดินแดนที่ถูกยึดครองเพื่อตอสูกับผูรุกรานตอไป เราตองสงความชวยเหลือไปใหพวกเขา เพื่อใหตรึงหนวยของขาศึกไวไดมากยิ่งขึ้น"
 SOV_smersh: "SMERSH"
 SOV_smersh_desc: "เราตองทําใหพลเมืองทุกคนเขาใจอยางชัดแจงวาสายลับและสายขาวของขาศึกแฝงตัวอยูทุกหนแหง และคําพูดพลอย ๆ เพียงคําเดียวก็อาจมอบขอมูลสําคัญที่ทําใหขาศึกไดเปรียบ"
 SOV_barrier_troops: "หนวยสกัดกั้น"
 SOV_barrier_troops_desc: "การรบมักเต็มไปดวยความโกลาหล และเปนเรื่องเขาใจไดที่บางครั้งทหารจะขาดการติดตอกับกองบัญชาการระดับสูง เราควรจัดตั้งหนวยไวหางหลังแนวหนา เพื่อรวบรวมทหารที่พลัดหลงและสงพวกเขากลับไปสูสนามรบ พรอมจับกุมผูที่ทรยศเพื่อนรวมรบดวยการหลบเลี่ยงหนาที่"
 SOV_experts_in_camouflage: "ผูเชี่ยวชาญการพรางตัว"
 SOV_experts_in_camouflage_desc: "เพื่อสรางและรักษาความไดเปรียบจากการจูโจมโดยไมใหตั้งตัว เราตองมั่นใจอยางเด็ดขาดวาขาศึกจะไมพบที่ตั้งหรือการเคลื่อนไหวของกองทหารเราจนกวาจะสายเกินไป ทหารทุกนายตองไดรับการฝกศิลปะการพรางตัว"
 SOV_keep_commissars_organization: "คงระบบผูตรวจการการเมืองไว"
 SOV_keep_commissars_organization_desc: "แมภายใตการจัดระเบียบใหม เรายังจําเปนตองมีบุคคลที่คอยดูแลใหกองทัพจงรักภักดีตอรัฐบาลอยางเด็ดขาด หากทหารหมดความไววางใจในรัฐบาล เราจะแพสงครามนี้ และจะแพอยางรวดเร็ว"
 SOV_adjoined_battle_priests: "บรรจุนักบวชประจํากองทัพ"
 SOV_adjoined_battle_priests_desc: "ดวยอํานาจและอิทธิพลของศาสนจักรที่เพิ่มขึ้นในประเทศเมื่อไมนานมานี้ อาจถึงเวลาแลวที่จะใหศาสนจักรมีบทบาทในกิจการทหาร เหลานักบวชจะรับหนาที่เปนนักบวชประจําหนวยทหาร คอยยํ้าใหทหารรูวาพระเจาอยูขางเรา ซึ่งอาจชวยเพิ่มขวัญกําลังใจและทําใหทหารทั่วไปสูเพื่อประเทศอยางแรงกลายิ่งขึ้น"
 SOV_swap_to_political_advisors: "ที่ปรึกษาการเมืองประจํากองทัพ"
 SOV_swap_to_political_advisors_desc: "สงครามของเรามิใชเพียงการแยงชิงทรัพยากรระหวางชาติ แตเปนการประชันกันของระบอบการเมือง แมเราไมควรปลอยใหขอพิจารณาทางการเมืองชี้นําการตัดสินใจทางทหาร แตเรายังตองมั่นใจวาขอพิจารณาเหลานั้นถูกนํามาคํานึงถึงเมื่อมีการตัดสินใจ"
 SOV_the_glory_of_the_red_army: "เกียรติภูมิแหงกองทัพ[GetSovietArmyAdjectiveBasedOnIdeology]"
 SOV_the_glory_of_the_red_army_desc: "เราตานทานการโหมโจมตีของขาศึกไวไดสําเร็จ บัดนี้ถึงเวลารุกกลับ และนําสงครามยอนกลับไปยังที่ที่มันมา!"
 SOV_the_glory_of_the_red_army_alt: "$SOV_the_glory_of_the_red_army$"
 SOV_the_glory_of_the_red_army_alt_desc: "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_path_of_marxism_leninism: "วิถีแหงลัทธิมากซ-เลนิน"
 SOV_the_path_of_marxism_leninism_desc: "คําสอนอันไมมีวันผิดพลาดของมากซ เองเงิลส และเลนิน ไดยกชาติของเราจากความลาหลังสุดขีดขึ้นสูความเทาเทียมทางเทคโนโลยีและอุตสาหกรรม การเปลี่ยนทิศทางในตอนนี้คงเปนความโงเขลาที่สุด ธงอันไมมีวันพายแหงการปลดปลอยกรรมกรจะรุดหนาตอไปไมหยุดยั้ง!"
 SOV_the_centre: "ฝายกลาง"
 SOV_the_centre_desc: "สหายสตาลินเปนนักสูที่ยิ่งใหญที่สุดของชาติเรา เราควรฝากอนาคตของการปฏิวัติไวในมืออันเปยมความสามารถของเขา"
 SOV_socialism_in_one_country: "สังคมนิยมในประเทศเดียว"
 SOV_socialism_in_one_country_desc: "แมการปฏิวัติโลกยังคงเปนเปาหมายสูงสุดของเรา และไดรับการพิสูจนทางวิทยาศาสตรแลววาจะตองเกิดขึ้นอยางแนนอน แตเราตองสรางสังคมนิยมในประเทศของเราใหมั่นคงเสียกอน มิฉะนั้นการปลดปลอยกรรมกรในสวนอื่นของโลกอาจลาชาออกไปเพราะเราพายแพ"
 SOV_the_stalin_constitution: "รัฐธรรมนูญสตาลิน"
 SOV_the_stalin_constitution_desc: "รัฐธรรมนูญป 1924 เปนความพยายามที่ดีในการจัดระเบียบรัฐหลังสงครามกลางเมือง แตไดทําหนาที่ของมันจบสิ้นแลว เราตองการรัฐธรรมนูญฉบับใหม ประการแรก เราตองยกยองการทํางานอยางไมรูเหน็ดเหนื่อยของสหายสตาลินในการรักษาสหภาพใหเขมแข็งและปลอดภัย ผูซึ่งความปราดเปรื่องและปญญาของเขาเปนกําลังสําคัญในการนําอุดมการณคอมมิวนิสตใหกาวหนา"
 SOV_the_zinovyevite_terrorist_center: "ศูนยกอการรายฝายซีโนเวียฟ"
 SOV_the_zinovyevite_terrorist_center_desc: "การลอบสังหารสหายคีรอฟในป 1934 แสดงใหเห็นวามีสมาชิกพรรคบางคนวางแผนตอตานสหายสตาลินและสหภาพทั้งมวลอยางชัดเจน เราไดคําสารภาพจากผูสมรูรวมคิดหลายคน ซึ่งพาดพิงถึงบุคคลอื่นอีกหลายคน แผนรายของฝายซีโนเวียฟนี้ ซึ่งไมตองสงสัยเลยวาถูกจัดตั้งโดยทรอตสกีหรือสายลับตะวันตก หรืออาจรวมมือกัน ตองถูกตัดทิ้งเหมือนเนื้อรายกอนที่มันจะลุกลาม"
 SOV_secure_the_administration: "ควบคุมฝายบริหารใหมั่นคง"
 SOV_secure_the_administration_desc: "หลังความตกตะลึงจากคําสารภาพของซีโนเวียฟผูกอการรายและพวกพอง เราตองตั้งคําถามถึงความจงรักภักดีของสมาชิกพรรคคนอื่น ๆ เปนเรื่องจําเปนยิ่งที่เราตองรูวาสมาชิกโปลิตบูโรแตละคนยืนอยูฝายใด"
 SOV_the_collectivization_process: "กระบวนการนารวม"
 SOV_the_collectivization_process_desc: "แมยังมีงานอีกมากที่ตองทํา และแมในบางภูมิภาคจะดําเนินการไดยํ่าแย แตกระบวนการรวมไรนาเปนนารวมในสหภาพโซเวียตก็ใกลเสร็จสมบูรณแลว และจะทําใหผลผลิตภาคเกษตรกรรมเพิ่มขึ้นในไมชา"
 SOV_the_anti_soviet_trotskyist_center: "ศูนยทรอตสกีตอตานโซเวียต"
 SOV_the_anti_soviet_trotskyist_center_desc: "การสืบสวนแผนรายฝายซีโนเวียฟเผยใหเห็นวามีเครือขายผูกอการรายตอตานโซเวียตขนาดใหญแฝงอยูในฝายบริหารของเรา สมาชิกบางคนถึงกับไมรูดวยซํ้าวากําลังชวยเหลือใคร! การสมคบคิดนี้ตองถูกถอนรากถอนโคน และอาจตองใชมาตรการเด็ดขาดเพื่อใหบรรลุผล"
 SOV_the_workers_dictatorship: "เผด็จการของกรรมกร"
 SOV_the_workers_dictatorship_desc: "อํานาจทั้งปวงในสหภาพของเราตองเปนของกรรมกรในทายที่สุด เราไมอาจปลอยใหแตกแยกเปนกกเปนเหลา จึงตองมั่นใจวาเจตจํานงของกรรมกรจะปรากฏอยูในการตัดสินใจของโปลิตบูโรเสมอ"
 SOV_organization_centralization_discipline: "การรวมศูนยและวินัย"
 SOV_organization_centralization_discipline_desc: "ในยามแหงความไมแนนอนนี้ ประชาชนตางมองหาเสถียรภาพและการชี้นําจากโปลิตบูโร เราตองมั่นใจวาองคกรผูตัดสินใจแหงนี้ไมเพียงสนับสนุน แตยังเปนหนึ่งเดียวกันเบื้องหลังการตัดสินใจของสหายสตาลิน"
 SOV_war_economy: "เศรษฐกิจสงคราม"
 SOV_war_economy_desc: "เห็นไดชัดวาชาติทุนนิยมและชาติปฏิกิริยาตามชายแดนของเรากําลังวางแผนโจมตีในยามที่เราออนแอ ยิ่งเราปรับเศรษฐกิจเขาสูภาวะสงครามไดเร็วเทาไรก็ยิ่งดี"
 SOV_the_military_conspiracy: "การสมคบคิดในกองทัพ"
 SOV_the_military_conspiracy_desc: "แผนรายของพวกทรอตสกีในประเทศเราไดลามไปถึงกองทัพแลว บัดนี้เรามีหลักฐานวานายพลระดับสูงและแมแตจอมพลไดสมคบกับหนวยขาวกรองตางชาติเพื่อโคนลมรัฐบาล! เราไมอาจปลอยใหนายทหารที่มีความภักดีนาสงสัยแมเพียงเล็กนอยคงอยูในตําแหนงที่จะบั่นทอนกองทัพของเราไดอีกตอไป"
 SOV_the_bloc_of_rights_and_trotskyites: "กลุมฝายขวาและทรอตสกี"
 SOV_the_bloc_of_rights_and_trotskyites_desc: "ในที่สุด เราก็มาถึงใจกลางของการสมคบคิดในหมูพวกเราแลว นิโคไล บุคฮาริน แทจริงแลวเปนสมาชิกกลุมทรอตสกี-ซีโนเวียฟ และนาจะเปนผูนําของคนในรัฐบาลที่พยายามกอการปฏิวัติซอน บัดนี้เรามีหลักฐานที่ไมอาจโตแยงได และดวยการพิจารณาคดีครั้งสุดทาย เราจะเปดโปงขอเท็จจริงเหลานี้ใหประจักษ"
 SOV_behead_the_snake: "ตัดหัวงู"
 SOV_behead_the_snake_desc: "เปนที่ชัดเจนอยางยิ่งแลววาสหภาพจะไมปลอดภัยจนกวาภัยคุกคามจากรัฐประหารของพวกทรอตสกีจะถูกขจัดสิ้น แมการนําทรอตสกีขึ้นศาลเพื่อเปดโปงกิจกรรมตอตานโซเวียตของเขาจะเปนเรื่องดี แตเราไมมีเวลาพอเชนนั้น ทางเลือกเดียวคือลอบสังหารเขา เพื่อตัดผูนําและผูยุยงหลักของแผนรายตอรัฐบาล"
 SOV_stalins_cult_of_personality: "ลัทธิบูชาตัวบุคคลของสตาลิน"
 SOV_stalins_cult_of_personality_desc: "หลังการเปดโปงแผนรายอันนาตกตะลึงตอสหภาพ เห็นไดชัดวามีเพียงการนําอันเฉียบแหลมของสหายสตาลินเทานั้นที่ปองกันมิใหประเทศดิ่งลงสูสงครามกลางเมืองหรือเลวรายกวานั้น พลเมืองโซเวียตทุกคน และแทจริงคือชนชั้นแรงงานทั่วโลก ลวนเปนหนี้บุญคุณสหายสตาลินชั่วนิรันดรสําหรับการทํางานอยางไมรูเหน็ดเหนื่อยในการปกปองการปฏิวัติ"
 SOV_they_will_know_fear: "พวกมันจะไดรูจักความกลัว"
 SOV_they_will_know_fear_desc: "ศัตรูของเราไดเรียนรูที่จะเกรงกลัวกองทัพแดงและประชาชนโซเวียต เราตานการโจมตีระลอกแรกไวไดแลว และถึงเวลาตอบโต เราตองพัฒนาจักรกลสงครามรุนใหมอันนาสะพรึงที่สามารถเจาะทะลวงแมแนวปองกันที่แข็งแกรงที่สุดของขาศึก จักรกลสงครามเหลานี้ตองสรางความหวาดกลัวลงลึกถึงใจกลางของขาศึกเพียงแคไดยินชื่อ..."
 SOV_inheritor_of_the_mantle_of_lenin: "ผูสืบทอดเจตนารมณของเลนิน"
 SOV_inheritor_of_the_mantle_of_lenin_desc: "สหายสตาลินเปนสหายที่ใกลชิดที่สุดและศิษยที่เลนินไววางใจที่สุดเสมอมา ในฐานะผูยึดมั่นในคําสอนของเลนินอยางซื่อสัตยที่สุด จึงเปนเรื่องธรรมดาที่เขาจะรับชวงภาระอันหนักอึ้งในการนําชาติไปสูลัทธิคอมมิวนิสต รวมถึงเตรียมพรอมสําหรับการปฏิวัติของกรรมกรทั่วโลกที่จะตองเกิดขึ้น"
 SOV_brilliant_genius: "อัจฉริยะผูปราดเปรื่อง"
 SOV_brilliant_genius_desc: "สหายสตาลินผูเปนบุรุษที่ปราดเปรื่องที่สุดในโลกอยางไมตองสงสัย จะนําชาติของเราสูความกาวหนาทางวิทยาศาสตรระดับใหม และผลักดันความกาวหนาของมวลมนุษยชาติใหรุดหนาอยางกาวกระโดด"
 SOV_the_faithful_servant_of_lenin: "ผูรับใชที่ซื่อสัตยของเลนิน"
 SOV_the_faithful_servant_of_lenin_desc: "เลนินทิ้งภารกิจที่ยิ่งใหญที่สุดในประวัติศาสตรโลกไวใหเรา นั่นคือการสรางสังคมที่ทุกคนเทาเทียมกันอยางแทจริง สังคมที่ปราศจากการกดขี่ ความทุกขยาก หรือความขาดแคลนทางวัตถุ ไมมีผูใดเหมาะสมไปกวาสหายสตาลินในการทําวิสัยทัศนนั้นใหเปนจริง เขาผูอยูเคียงขางเลนินทุกยางกาว และบัดนี้พรอมแลวที่จะทําตามคํามั่นที่ใหไวในการปฏิวัติ"
 SOV_ban_excessive_hero_worship: "หามการยกยองวีรบุรุษเกินควร"
 SOV_ban_excessive_hero_worship_desc: "เกิดกระแสการตีพิมพเรื่องเลาเพอฝนและเกินจริงอยางมากเกี่ยวกับชีวิตสวนตัวและวัยเยาวของสหายสตาลิน ไมวาเจตนาจะดีเพียงใด เรื่องเลาเหลานี้ลวนเปนการตอตานการปฏิวัติ และมุงสรางลัทธิบูชาวีรบุรุษขึ้นในความคิดของชาวโซเวียต ทั้งยังพยายามแทนที่การศึกษาทฤษฎีของสหายสตาลินอยางจริงจังดวยการบูชาอยางงมงาย"
 SOV_leader_of_the_party_and_the_people: "ผูนําของพรรคและประชาชน"
 SOV_leader_of_the_party_and_the_people_desc: "สหายสตาลินปฏิบัติภารกิจอันหนักอึ้งของตนดวยความอุตสาหะและความสามารถ และไดรับการสนับสนุนอยางเต็มที่และเปนเอกฉันทจากทั้งพรรคและประชาชน ความหลงตัวเองหรือการยกยอตนเองเปนสิ่งแปลกปลอมสําหรับเขา เขาอาจเปนบุคคลที่ถอมตนที่สุดในโลกก็เปนได"
 SOV_great_commander: "ผูบัญชาการผูยิ่งใหญ"
 SOV_great_commander_desc: "ผลงานของสหายสตาลินดานทฤษฎีการทหารและการเปนผูนํามีมากเกินกวาจะกลาวไดหมด แมทรอตสกีผูทรยศอาจเปนผูกอตั้งกองทัพแดง แตสหายสตาลินคือผูเปลี่ยนใหกองทัพแดงกลายเปนกําลังรบที่มีประสิทธิภาพในการปกปองผลงานของชนชั้นแรงงาน"
 SOV_architect_of_communism: "สถาปนิกแหงคอมมิวนิสต"
 SOV_architect_of_communism_desc: "ความยึดมั่นอยางไมหวั่นไหวตออุดมการณแหงการปฏิวัติทําใหสหายสตาลินมองเห็นความทาทายในการสรางสังคมนิยมในประเทศเดียว เมื่องานสรางสังคมนิยมคืบหนาไปมากแลว เขาจึงหันไปสูกาวใหญถัดไปได นั่นคือการเปลี่ยนผานจากสังคมนิยมไปสูคอมมิวนิสตอยางสมบูรณ"
 SOV_father_of_nations: "บิดาแหงประชาชาติ"
 SOV_father_of_nations_desc: "สหภาพของเราคือครอบครัวใหญของผูคนหลากหลายชนชาติ และทุกครอบครัวยอมตองมีหัวหนา สหายสตาลินคือหัวหนาผูนั้น ผูดูแลใหลูก ๆ มากมายไดรับการศึกษาในแนวคิดสังคมนิยม และนําทางความพยายามของเราสูอนาคตอันสดใส เมื่อตองเขมงวดเขาก็เขมงวด แตเขามีความยุติธรรมและความเปนธรรมนําทางเสมอ"
 SOV_freedom_of_debate_unity_of_action: "เสรีภาพในการถกเถียง - เอกภาพในการปฏิบัติ"
 SOV_freedom_of_debate_unity_of_action_desc: "การปกครองประเทศและนําพาไปบนเสนทางที่ถูกตองนั้นซับซอนหลายประการ ทางเลือกตาง ๆ จึงตองสามารถถกเถียงกันไดอยางเปดเผย อยางไรก็ตาม เมื่อไดขอตัดสินใจแลว เปนหนาที่ของสมาชิกโปลิตบูโรทุกคน และแทจริงคือของทั้งพรรค ที่ตองสนับสนุนการตัดสินใจนั้นโดยไมมีขอแม"
 SOV_the_construction_of_communism: "การสรางลัทธิคอมมิวนิสต"
 SOV_the_construction_of_communism_desc: "การสรางลัทธิคอมมิวนิสตยอมมาพรอมกับความทาทายและอุปสรรคในตัวเอง เมื่อโปลิตบูโรยืนหยัดเปนหนึ่งเดียวเบื้องหลังสหายสตาลิน เราก็สามารถกาวแรกสูการสรางคอมมิวนิสตได"

 SOV_addressing_internal_affairs: "จัดการกิจการภายใน"
 SOV_addressing_internal_affairs_desc: "แมการปฏิวัติยังมีศัตรูอีกมากทั่วโลก และกรรมกรอีกหลายลานคนยังคงเฝารอการปลดปลอย แตเราตองไมลืมหันมามองปญหามากมายที่รออยูภายในบานของเรา"
 SOV_nkvd_primacy: "ความเปนใหญของ NKVD"
 SOV_nkvd_primacy_desc: "จนกวาเราจะมั่นใจไดวาศัตรูของรัฐทั้งหมดถูกจัดการแลว เราตองพึ่งพา NKVD ในการปกปองการปฏิวัติตอไป"
 SOV_the_new_soviet_woman: "สตรีโซเวียตยุคใหม"
 SOV_the_new_soviet_woman_desc: "การปฏิวัติทางการเมืองนําเสรีภาพมาสูผูคนหลายลานในสหภาพของเรา ที่สําคัญที่สุดคือสตรีหลายลานคนที่ไมถูกจํากัดใหเปนเพียงภรรยาและแมอีกตอไป แตบัดนี้ยังสามารถยืนหยัดอยางเทาเทียมโดยสมบูรณในที่ทํางานไดดวย"
 SOV_expand_the_agitprop: "ขยายงานโฆษณาชวนเชื่อปลุกระดม"
 SOV_expand_the_agitprop_desc: "เพื่อเขาถึงกรรมกรหลายลานคนทั่วสหภาพ เราตองพูดภาษาเดียวกับพวกเขา เราตองทําใหขอโตแยงของเราเรียบงายและเขาใจไดงาย เพื่อใหติดอยูในความทรงจําของพลเมืองทั่วไป เราควรขยายความพยายามในดานนี้ใหมากขึ้นอีก"
 SOV_positive_heroism: "วีรกรรมเชิงบวก"
 SOV_positive_heroism_desc: "แมความสําเร็จทั้งปวงของสมาชิกชนชั้นแรงงานจะเปนของชนชั้นแรงงานทุกคนรวมกัน แตเรายังสามารถชี้ไปยังบุคคลบางคนใหเปนแบบอยางที่ผูอื่นควรเอาเยี่ยงอยางได"
 SOV_revive_the_stakhanovite_movement: "ฟนฟูขบวนการสตาฮานอฟ"
 SOV_revive_the_stakhanovite_movement_desc: "การขูดรีดอยางโหดรายผลักดันใหกรรมกรในประเทศทุนนิยมตองทํางานหนักขึ้นและผลิตมากขึ้นเพื่อเจาของโรงงาน แตในประเทศของเรา กรรมกรอยางอเล็กเซย สตาฮานอฟ ผลักดันตนเองใหกาวไกลขึ้นเพราะรูวาอิฐทุกกอนที่กอเพิ่ม ถานหินทุกตันที่ขุดเพิ่ม และหมุดยํ้าทุกตัวที่ตอกเพิ่ม ลวนชวยสรางโลกที่กรรมกรเปนอิสระจากการขูดรีดไปตลอดกาล"
 SOV_war_heroes: "วีรบุรุษสงคราม"
 SOV_war_heroes_desc: "ชาวรัสเซียสามารถและเต็มใจกระทําวีรกรรมอันกลาหาญยิ่งยวดเสมอมา เพื่อพิชิตผูรุกรานมาตุภูมิไมวาผูใด แมเราจะเปนหนึ่งเดียวในการตอสูกับขาศึก แตเราไมควรแสรงทําเปนวาไมมีทหารบางนายในกองทัพของเราที่ทําเกินกวาหนาที่ไปไกล"
 SOV_collectivist_propaganda: "โฆษณาชวนเชื่อแบบรวมหมู"
 SOV_collectivist_propaganda_desc: "ความทาทายมากมายที่เราเผชิญไมเคยตกอยูกับพลเมืองคนใดเพียงลําพัง การตอสูทั้งหมดของเราคือการตอสูรวมกัน ดังนั้นความสําเร็จทั้งหมดของเราก็คือความสําเร็จรวมกัน"
 SOV_socialist_emulation: "การแขงขันแบบสังคมนิยม"
 SOV_socialist_emulation_desc: "ภายใตระบบทุนนิยม กรรมกรตองแขงขันกันเองเพื่อแยงชิงปากทองในแตละวัน ขณะที่เจาของโรงงานไดกําไรจากทุกการปรับปรุงที่กรรมกรทําจนผลิตภาพเพิ่มขึ้น นี่เปนความสิ้นเปลืองและไรมนุษยธรรม ระบบสังคมนิยมจะมอบการสนับสนุนที่จําเปนแกผูที่ยังไมเกงที่สุด ใหไดพัฒนาความสามารถดวยการเรียนรูจากผูที่เปนเลิศ"
 SOV_socialist_realism: "สัจนิยมสังคมนิยม"
 SOV_socialist_realism_desc: "หนทางสูอนาคตสังคมนิยมอันสดใสนั้นยาวไกลและมักคดเคี้ยว บางคนอาจถึงกับหมดหวังวาเปาหมายนี้จะสําเร็จได เราตองแสดงใหพวกเขาเห็นอยางชัดเจนวาพวกเขากําลังทํางานเพื่อสิ่งใด ดวยการสงเสริมรูปแบบศิลปะที่แสดงใหเห็นวาชีวิตในประเทศสังคมนิยมจะเปนอยางไรจริง ๆ"
 SOV_the_komsomol: "คอมโซมอล"
 SOV_the_komsomol_desc: "เรามิไดสรางสังคมนิยมเพื่อผูใหญในวันนี้ แตเพื่อเด็ก ๆ และคนรุนที่ยังไมถือกําเนิด พวกเขาตองไดรับการสอนใหพัฒนาและตอยอดความสําเร็จที่เราจะสรางขึ้น เพื่อสานตองานที่เราไดเริ่มไวใหสําเร็จ เราควรตั้งองคกรเยาวชนพิเศษที่ไมเพียงใหการศึกษา แตยังสอนใหพวกเขาเปนสมาชิกที่ดีของสังคมคอมมิวนิสต"
 SOV_patriarch_of_all_russia: "อัครบิดรแหงรัสเซียทั้งปวง"
 SOV_patriarch_of_all_russia_desc: "แมในสังคมคอมมิวนิสตที่รูแจงจะไมมีเหตุผลนักสําหรับความเชื่องมงายลาหลัง แตเราตองยอมรับดวยวาผูคนจํานวนมากไดพบพลังและความอุนใจในศรัทธาของตนยามยากลําบาก การสรางสังคมรูปแบบใหมนั้นไมขาดแคลนความยากลําบาก ดังนั้นบางทีเราควรอนุญาตใหสถาบันศาสนาเหลานี้ดําเนินกิจการตอไปได ตราบเทาที่ยังจงรักภักดีตอรัฐ"
 SOV_the_comintern: "โคมินเทิรน"
 SOV_the_comintern_desc: "การตอสูเพื่อปลดปลอยกรรมกรไมไดจํากัดอยูในประเทศใดประเทศหนึ่ง แตเปนการตอสูระดับโลก เราตองยื่นความชวยเหลือแกสหายในทุกชาติทั่วโลก และตอสูกับพลังฝายปฏิกิริยาและฝายตอตานการปฏิวัติไมวาจะพบที่ใด"
 SOV_development_aid_for_eastern_allies: "ความชวยเหลือเพื่อการพัฒนาแกพันธมิตรตะวันออก"
 SOV_development_aid_for_eastern_allies_desc: "ตลอดหลายศตวรรษ จักรวรรดินิยมและลัทธิลาอาณานิคมตะวันตกไดขูดรีดประเทศตาง ๆ ในเอเชียอยางโหดราย การลงทุนเพียงเล็กนอยจากเราจะชวยใหพันธมิตรในเอเชียตานทานการรุกลํ้าของทุนนิยมไดอยางมีประสิทธิภาพยิ่งขึ้น"
 SOV_war_measures_in_the_east: "มาตรการสงครามในตะวันออก"
 SOV_war_measures_in_the_east_desc: "การตอสูระดับโลกกับลัทธิฟาสซิสตและอุดมการณตอตานการปฏิวัติอื่น ๆ จะลามมาถึงเอเชียในไมชาอยางแนนอน เราตองทําใหพันธมิตรเขาใจชัดเจนวาในยามคับขัน อาจตองใชมาตรการเด็ดขาด"
 SOV_fortify_mongolian_border: "เสริมปอมพรมแดนมองโกเลีย"
 SOV_fortify_mongolian_border_desc: "แมขณะนี้พวกหัวรุนแรงญี่ปุนจะจับตาอยูที่จีน แตเราไมอาจตัดความเปนไปไดที่พวกเขาจะตองการขยายผลดวยการโจมตีเรา เราควรดูแลใหพันธมิตรมองโกเลียของเราไมกลายเปนปกที่เปดโลง"
 SOV_send_military_advisors_to_spain: "สงที่ปรึกษาทางทหารไปสเปน"
 SOV_send_military_advisors_to_spain_desc: "สหายของเราในสเปน หลังชนะการเลือกตั้งตามระบอบประชาธิปไตย บัดนี้กําลังเผชิญกับการตอตานการปฏิวัติของฝายปฏิกิริยา เราตองสนับสนุนพวกเขา มิฉะนั้นความพายแพของพวกเขาจะเปนกําลังใจใหพวกฟาสซิสตในประเทศอื่น"
 SOV_policy_of_collective_security: "นโยบายความมั่นคงรวมกัน"
 SOV_policy_of_collective_security_desc: "แมจะเปนทุนนิยมและมักเปนฝายปฏิกิริยา แตรัฐบาลประชาธิปไตยทั่วยุโรปก็รูดีวาพวกฟาสซิสตมองพวกเขาวาออนแอและเสื่อมทราม หากสงครามมาถึง พวกเขาจะลมสลายเปนรายแรกกอนที่ความเกรี้ยวกราดเต็มกําลังของฟาสซิสตจะหันมาสูดินแดนแหงการปฏิวัติ นักการเมืองที่มองการณไกลพอจะเห็นเชนนี้ควรรูวามอสโกพรอมรับฟงพวกเขา"
 SOV_anti_fascist_policies: "นโยบายตอตานฟาสซิสต"
 SOV_anti_fascist_policies_desc: "เราไมอาจอยูรวมกับพวกฟาสซิสตอยางสันติได เราควรผูกมิตรกับพันธมิตรทุกรายที่หาได และเตรียมพรอมสําหรับการเผชิญหนาที่หลีกเลี่ยงไมได"
 SOV_seek_a_defense_pact_with_the_allies: "แสวงหาสนธิสัญญาปองกันรวมกับฝายสัมพันธมิตร"
 SOV_seek_a_defense_pact_with_the_allies_desc: "แมจะมีการติดตออยางไมเปนทางการกับประชาธิปไตยตะวันตก แตยังมีขอตกลงที่เปนรูปธรรมและมีผลผูกพันทางกฎหมายเพียงนอยนิด ถึงเวลาลงนามบนกระดาษและประกาศตอโลกวาประชาธิปไตยตะวันตกพรอมจะรวมแนวรวมกับเราเพื่อตานการขยายอํานาจของฟาสซิสต"
 SOV_the_khakimov_proposal: "ขอเสนอของฮาคีมอฟ"
 SOV_the_khakimov_proposal_desc: "ฮาคีมอฟทํางานอยางไมรูเหน็ดเหนื่อยเพื่อยกระดับสถานะของเรากับรัฐบาล[SAU.GetNameDef] ผูเชี่ยวชาญคาดวาภูมิภาคนี้อุดมไปดวยทรัพยากรธรรมชาติจํานวนมาก ซึ่งพวกนายทุนยอมกระหายจะเขาไปกอบโกยอยางไมตองสงสัย เราควรสรางความสัมพันธบนความไววางใจซึ่งกันและกันตอไป เพื่อกัน[SAU.GetNameDef]ออกจากกลุมที่เปนปรปกษ และใหเราไดสิทธิ์กอนในทรัพยากรที่อาจมีอยู"
 SOV_eradicate_western_fascism: "กวาดลางฟาสซิสตตะวันตก"
 SOV_eradicate_western_fascism_desc: "เราไมอาจรอจนระบอบฟาสซิสตในยุโรปตะวันตกเลือกเวลาโจมตีเราตามใจชอบ วิธีที่ดีที่สุดในการจัดการกับพวกฟาสซิสตคือโจมตีกอน และโจมตีใหหนัก"
 SOV_policy_of_individual_security: "นโยบายความมั่นคงเฉพาะตน"
 SOV_policy_of_individual_security_desc: "เรามีมิตรนอยในโลกนี้ แตมีศัตรูมากมาย เราไมควรกังวลมากเกินไปวาจะทําขอตกลงกับใคร อยางไรเสียไมพวกเขาก็เราจะเปนฝายฉีกขอตกลงเมื่อมันหมดประโยชนแลว"
 SOV_approach_germany: "เขาหาเยอรมนี"
 SOV_approach_germany_desc: "ไมมีเหตุผลใดที่เราจะไมสามารถหาทางประนีประนอมกับเยอรมนีได แนนอนวาเราคงอยูรวมกับพวกเขาอยางสันติไมไดตลอดไป แตชาวเยอรมันจะไมโจมตีเราขณะที่ฝายสัมพันธมิตรตะวันตกยังคงอยูขางหลังพวกเขา และเราควรสงเสริมใหเยอรมันจัดการกับพวกนั้นกอน"
 SOV_liberation_of_the_european_proletariat: "ปลดปลอยชนชั้นกรรมาชีพยุโรป"
 SOV_liberation_of_the_european_proletariat_desc: "รัฐบาลกระฎมพีไรกระดูกสันหลังในยุโรปตะวันตกแสดงใหเห็นแลววาไมเต็มใจยืนหยัดตอตานลัทธิฟาสซิสตเลยแมแตนอย ในการตอสูครั้งใหญระหวางฟาสซิสตกับคอมมิวนิสตที่กําลังจะมาถึง พวกเขาจะไมมีบทบาทใด ๆ แตกรรมกรในประเทศเหลานั้นพรอมจะรวมสูกับเราเพื่อตานภัยรายแหงฟาสซิสต เราเพียงตองมอบรัฐบาลที่พรอมจะสูใหแกพวกเขา"
 SOV_anti_capitalist_policies: "นโยบายตอตานทุนนิยม"
 SOV_anti_capitalist_policies_desc: "เห็นไดชัดวาประเทศทุนนิยมสวนใหญ หากไมใชทั้งหมด พอใจเพียงแคชี้ทางใหพวกฟาสซิสตหันไปทิศอื่นเมื่อวางแผนขยายอํานาจ เมื่อมีทางเลือก ชนชั้นกระฎมพีจะเลือกกดขี่ชนชั้นกรรมาชีพเสมอในทายที่สุด ดังนั้นเราจึงไมอาจไวใจพวกเขาได และตองพรอมจะบุกไปสูถึงถิ่นพวกเขา"
 SOV_recover_alaska: "ทวงคืนอะแลสกา"
 SOV_recover_alaska_desc: "การขายอะแลสกาใหชาวอเมริกันคือการที่ผูนําทรยศตอประชาชนรัสเซีย ถึงเวลานานแลวที่จะแกไขการทรยศนี้และทวงคืนดินแดน ประชากรที่นั่นจะมีความสุขกวามากหากไดเปนสวนหนึ่งของสหภาพเรา แทนที่จะอยูภายใตระบบขูดรีดอยางทุกวันนี้"
 SOV_the_fight_for_the_pacific: "ศึกชิงแปซิฟก"
 SOV_the_fight_for_the_pacific_desc: "ไมวากําลังทางบกของเราจะแข็งแกรงเพียงใด เราก็ตองขามนํ้าไปเผชิญหนากับศัตรูในภูมิภาคแปซิฟก ดังนั้นเราตองพัฒนาโครงสรางพื้นฐานชายฝงและอุตสาหกรรมตอเรือกอนจึงจะทําสงครามในภูมิภาคนั้นไดอยางมีประสิทธิภาพ"
 SOV_baltic_security: "ความมั่นคงบอลติก"
 SOV_baltic_security_desc: "ชะตากรรมของประเทศรอบทะเลบอลติกผูกพันอยางใกลชิดกับเรา เราไมอาจปลอยใหมีรัฐบาลที่เปนปรปกษประชิดชายแดนของเรา"
 SOV_respect_baltic_self_determination: "เคารพสิทธิกําหนดใจตนเองของบอลติก"
 SOV_respect_baltic_self_determination_desc: "ทุกชนชาติควรไดกําหนดกิจการของตนเองตามวิถีประชาธิปไตย แนนอนวาในประชาธิปไตยแบบกระฎมพีหลายแหงทางตะวันตก กระบวนการนี้ถูกบิดเบือนทันทีดวยเงินจํานวนมหาศาล เราจะดูแลใหกรรมกรในเอสโตเนีย ลัตเวีย และลิทัวเนีย มีผูแทนอยางเปนธรรมในรัฐบาลของตน"
 SOV_claims_in_baltic: "อางสิทธิ์ในบอลติก"
 SOV_claims_in_baltic_desc: "รัฐบอลติกเคยเปนสวนหนึ่งที่แยกไมไดของรัสเซีย ประชาชนของพวกเขาตองการการคุมครองจากรัฐใหญที่ปกปองพวกเขาจากการขูดรีดได หากรัฐบอลติกไมยอมรับเงื่อนไขเหลานี้ เราอาจตองใชกําลังเพื่อใหพวกเขาไดรับการคุมครองจากเรา"
 SOV_secure_leningrad: "รักษาความปลอดภัย[195.GetName]"
 SOV_secure_leningrad_desc: "พรมแดนปจจุบันของเรากับฟนแลนดอยูใกล[195.GetName]เกินกวาจะวางใจได การโจมตีจูโจมจากฟนแลนดอาจมาถึงเมืองไดภายในไมกี่ชั่วโมง ที่ตั้งนี้ยังทําใหปดลอมกองเรือบอลติกของเราไดงายมาก นี่เปนสภาพการณที่ยอมรับไมได และเราตองแจงใหรัฐบาลฟนแลนดรับรูอยางชัดเจน"
 SOV_control_scandinavia: "ควบคุมสแกนดิเนเวีย"
 SOV_control_scandinavia_desc: "ภัยคุกคามสุดทายที่เหลืออยูตอพรมแดนทางเหนือของเราคือรัฐบาลตาง ๆ บนคาบสมุทรสแกนดิเนเวีย เราตองทําใหพวกเขาตระหนักวาการอยูรวมกันอยางสันติตองอาศัยความไววางใจซึ่งกันและกัน และเราไมอาจไววางใจรัฐบาลที่มีอุดมการณไมตรงกับเรา"
 SOV_claims_on_poland: "อางสิทธิ์เหนือโปแลนด"
 SOV_claims_on_poland_desc: "โปแลนดถือครองดินแดนที่เปนของรัสเซียมาหลายศตวรรษ ทําใหยูเครนและเบลารุสถูกแบงแยกระหวางสองชาติ นี่เปนสภาพการณที่ยอมรับไมได พวกเขาอาจเอาชนะเราไดในป 1921 แตเราควรเตือนพวกเขาวากาลเวลาเปลี่ยนไปแลว"
 SOV_demand_eastern_poland: "เรียกรองโปแลนดตะวันออก"
 SOV_demand_eastern_poland_desc: "เมื่อมหาสงครามสิ้นสุดลง เสนเคอรซันไดถูกกําหนดและตกลงกันใหเปนพรมแดนดานตะวันออกของโปแลนด เสนนั้นอยูทางตะวันตกของพรมแดนปจจุบันของโปแลนดราว 200 กิโลเมตร เราควรเตือนพวกเขาถึงขอเท็จจริงทางประวัติศาสตรพื้นฐานนี้ และทําใหพรมแดนอยูในที่ที่ควรเปน"
 SOV_offer_poland_protection: "เสนอคุมครองโปแลนด"
 SOV_offer_poland_protection_desc: "โปแลนดและชาวโปลตองทนทุกขกับความขาดแคลนและความอัปยศมากมายตลอดหลายศตวรรษ เปนความลับที่ใคร ๆ ก็รูวาเยอรมนีตองการดินแดนที่ยกใหโปแลนดหลังมหาสงครามคืน และพรอมจะใชความรุนแรงเพื่อใหไดมา เราควรเสนอการคุมครองแกรัฐบาลโปแลนด ตราบเทาที่พวกเขายินดีหารือเรื่องพรมแดนรวมของเรา"
 SOV_claim_on_bessarabia: "อางสิทธิ์เหนือเบสซาราเบีย"
 SOV_claim_on_bessarabia_desc: "ในป 1918 ชาวโรมาเนียฉวยโอกาสจากปญหาภายในของเราอยางไรยางอายและผนวกเบสซาราเบีย ถึงเวลาเตือนพวกเขาวาดินแดนที่พวกเขาถือครองเปนของเราโดยชอบดวยกฎหมาย และหากไมยอมคืนพรมแดนที่ถูกตอง เราจะขับไลพวกเขาออกไปดวยกําลังทหาร"
 SOV_demand_balkan_submission: "บังคับบอลขานใหสยบ"
 SOV_demand_balkan_submission_desc: "ประสบการณในอดีตแสดงใหเห็นวาประเทศรอบตัวเราจะฉวยประโยชนจากทุกจุดออนที่เราแสดงออกมา เมื่อสงครามกําลังกอตัวในยุโรป เราไมอาจมีเพื่อนบานที่ความภักดีนาสงสัย ประเทศในคาบสมุทรบอลขานและเอเชียไมเนอรจะตองเลือกวาจะยืนขางเราหรือตอตานเรา"
 SOV_seek_balkan_cooperation: "แสวงหาความรวมมือกับบอลขาน"
 SOV_seek_balkan_cooperation_desc: "ประเทศในคาบสมุทรบอลขานและเอเชียไมเนอรอาจเปนพันธมิตรที่ทรงพลัง หากเราทําใหแนวคิดทางอุดมการณของพวกเขาใกลเคียงกับเรามากขึ้นได"
 SOV_middle_east_diplomacy: "การทูตในตะวันออกกลาง"
 SOV_middle_east_diplomacy_desc: "มีโอกาสมากมายที่จะยกระดับสถานะของเราบนคาบสมุทรอาหรับและในเอเชีย เกมใหญกับอังกฤษกําลังจะพลิกผันอีกครั้ง"
 SOV_the_southern_thrust: "การรุกลงใต"
 SOV_the_southern_thrust_desc: "พรมแดนดานใตของเราเปนปกที่เปดกวาง ซึ่งศัตรูสามารถฉวยประโยชนจากทุกจุดออน เราไมอาจทนตอสภาพนี้ และไมอาจรอการเปลี่ยนแปลงอยางสันติในภูมิภาคได"
 SOV_support_afghan_ideology: "สนับสนุนฝาย[GetIdeologyNameWithCaps]อัฟกัน"
 SOV_support_afghan_ideology_desc: "อัฟกานิสถานคือดินแดนที่ชาติผูทะนงตองถูกลดทอนศักดิ์ศรี ปฏิบัติการทางทหารในประเทศนี้จะสิ้นเปลืองมหาศาลเปนอยางนอย และอาจไมสําเร็จดวยซํ้า เรามีผูติดตอจํานวนหนึ่งในอัฟกานิสถานที่ตองการตั้งรัฐบาลที่มีอุดมการณใกลชิดกับเรามากขึ้น เราควรสนับสนุนความพยายามนี้"
 SOV_preemptive_invasion_of_iran: "ชิงบุกอิหรานกอน"
 SOV_preemptive_invasion_of_iran_desc: "เราไมอาจไวใจไดวารัฐบาล[PER.GetNameDef]จะสนับสนุนเราหากสงครามมาถึง และไมอาจไวใจไดเต็มที่วาพวกเขาจะไมเขาสูสงครามกับเรา แทนที่จะรอดูทาที เราควรบีบใหเรื่องนี้จบและทําใหสถานการณกระจาง"
 SOV_the_threat_from_the_land_of_the_rising_sun: "ภัยคุกคามจากแดนอาทิตยอุทัย"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc: "เห็นไดชัดวาญี่ปุนตองการครอบงําจีน เมื่อทําสําเร็จแลว พวกเขาจะหันขึ้นเหนือเพื่อยึดทรัพยากรอันมหาศาลในไซบีเรียอยางไมตองสงสัย ตราบใดที่พวกเขายังติดพันอยูในจีน พวกเขาคงไมอยากเคลื่อนไหวตอตานเรา เราจึงควรทําใหสงครามในจีนยืดเยื้อไปจนกวาเราจะพรอมทาทายญี่ปุน"
 SOV_the_gobi_gambit: "เดิมพันโกบี"
 SOV_the_gobi_gambit_desc: "ขณะที่ความขัดแยงระหวางญี่ปุนกับจีนกําลังรอนระอุ เรามีโอกาสยึดพื้นที่รอบทะเลทรายโกบี เพื่อใหเรามีเสียงในอนาคตของจีนและไดที่นั่งบนโตะเจรจา"
 SOV_two_red_flags: "ธงแดงสองผืน"
 SOV_two_red_flags_desc: "แมการปฏิวัติในจีนยังไมสําเร็จเสียทีเดียว แตก็ไมใชเรื่องเหนือความคาดหมาย ประเทศนี้ยังไมมีสังคมอุตสาหกรรมแบบที่จําเปนตอการปฏิวัติสังคมนิยมอยางแทจริง ถึงกระนั้น พรรคคอมมิวนิสตก็ยังเปนโอกาสที่ดีที่สุดของชาวจีนในการไปสูอนาคตแบบคอมมิวนิสต"
 SOV_support_the_kuomintang: "สนับสนุนกกมินตั๋ง"
 SOV_support_the_kuomintang_desc: "คอมมิวนิสตจีนออนแอทางการทหาร และไมมีฐานอุตสาหกรรมที่จะสรางกองทัพที่ใหญขึ้น เห็นไดชัดวากกมินตั๋งเหมาะสมที่สุดที่จะควบคุมจีนและสรางสังคมกระฎมพีที่จําเปนตอการเปนเงื่อนไขเบื้องตนของการปฏิวัติคอมมิวนิสตที่ประสบผลสําเร็จ"
 SOV_intervention_in_china: "แทรกแซงในจีน"
 SOV_intervention_in_china_desc: "สถานการณในจีนเลวรายลงจนกลายเปนภัยคุกคามตอความมั่นคงของเรา เราตองเขาแทรกแซงและตั้งรัฐบาลที่ไวใจไดในภูมิภาคนี้"
 SOV_prepare_a_war_with_japan: "เตรียมทําสงครามกับญี่ปุน"
 SOV_prepare_a_war_with_japan_desc: "กอนที่เราจะโจมตีญี่ปุน เราตองแนใจวาไมมีเรื่องไมคาดฝนรอเราอยู และตองเพิ่มความเขมขนของการลาดตระเวน"
 SOV_end_the_khalkhin_gol_conflict: "ยุติความขัดแยงคาลคินโกล"
 SOV_end_the_khalkhin_gol_conflict_desc: "ความขัดแยงตามแนวพรมแดนกับญี่ปุนยืดเยื้อมานานพอแลว หากเราไมอาจไวใจใหรัฐบาลญี่ปุนเคารพพรมแดนที่ไดรับการรับรองได เราก็จําเปนตองเปลี่ยนรัฐบาลนั้นเสีย"
 SOV_recover_the_kuril_islands: "ทวงคืนหมูเกาะคูริล"
 SOV_recover_the_kuril_islands_desc: "หมูเกาะคูริลสูญเสียไปหลังความหายนะในป 1905 หากเราโจมตีอยางรวดเร็วและรุนแรง เราจะทวงคืนหมูเกาะได และทําใหญี่ปุนเห็นวาการขยายความขัดแยงนั้นไมคุมคา"
 SOV_reconcile_japan: "คืนดีกับญี่ปุน"
 SOV_reconcile_japan_desc: "ภัยคุกคามหลักตอเราจะมาจากยุโรป เราควรขจัดปญหาคางคาทั้งหมดกับญี่ปุน เพื่อใหเรามุงความสนใจไปที่พรมแดนตะวันตกไดโดยไมตองกลัวถูกแทงขางหลัง"
 SOV_spheres_of_influence_in_china: "เขตอิทธิพลในจีน"
 SOV_spheres_of_influence_in_china_desc: "ประเด็นขัดแยงสุดทายที่เหลืออยูระหวางเราคือสถานการณในจีน ผลประโยชนของเราในภูมิภาคนี้มีจํากัด และหากเราซื้อการสนับสนุนจากญี่ปุนไดดวยขอตกลงเรื่องเขตอิทธิพล เราก็ควรทําโดยไมลังเล"
 SOV_soviet_japanese_pact_against_usa_focus: "กติกาโซเวียต-ญี่ปุนตอตานสหรัฐอเมริกา"
 SOV_soviet_japanese_pact_against_usa_focus_desc: "ญี่ปุนตองการขยายอํานาจตอไปเพื่อหลอเลี้ยงเศรษฐกิจที่กําลังเติบโต เปนประโยชนสูงสุดของเราที่จะชี้ทางการขยายอํานาจนั้นใหหางจากเรามากที่สุด และยังไดการสนับสนุนจากมหาอํานาจทางทะเลที่แข็งแกรง เราจะรวมกันขจัดสหรัฐอเมริกาออกจากเวทีโลก!"
