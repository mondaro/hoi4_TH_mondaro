 #Estonia
 EST_era_of_silence: "ยุคแหงความเงียบ"
 EST_era_of_silence_desc: "เมื่อขบวนการวาปสซึ่งเปนกลุมชาตินิยมสุดโตงที่ใชความรุนแรงแผขยายตั้งแตซาเรมาไปจนถึงวือรูมา ผูอาวุโสแหงรัฐตองนําเอสโตเนียเขาสูยุคใหม ยุคที่ไมมีการเลือกตั้ง ไมมีผูเห็นตาง และไมมีการตอตาน ชาติตองกาวเขาสูยุคแหงความเงียบ"
 EST_ismaaliit: "อิซามาลีต"
 EST_ismaaliit_desc: "เมื่อแมแตพรรคของแพตสเองก็ถูกหามดํารงตําแหนงทางการเมืองทั้งหมดในประเทศ เผด็จการจึงตองการพรรคใหมเปนศูนยกลางในการจัดตั้งตนเอง สันนิบาตผูรักชาติจะปกปองชาติจากภัยคุกคามทั้งปวง ทั้งภายในและภายนอกพรมแดนของเอสโตเนีย"
 EST_establish_the_rahvuskogu: "จัดตั้งรัฟวุสโคกู"
 EST_establish_the_rahvuskogu_desc: "เมื่อรัฐธรรมนูญฉบับเกาของเอสโตเนียพิสูจนแลววาไมอาจปกปองประชาชนจากลัทธิฟาสซิสตและทรราชได จึงมีการตัดสินใจวาตองรางรัฐธรรมนูญฉบับใหมเพื่อความมั่นคงของชาติ และฟนฟูประเพณีประชาธิปไตยที่ชาวเอสโตเนียไดตอสูและสละชีพเพื่อมันในป 1918 ในเวลาอันควร"
 EST_chamber_of_deputies: "ยึดกุมสภาผูแทนราษฎร"
 EST_chamber_of_deputies_desc: "เมื่อสภาแหงชาติอยูใตการควบคุมของอิซามาลีตอยางมั่นคงแลว สิ่งที่เหลืออยูคือการยึดกุมสภาผูแทนราษฎร เมื่อทุกสภาของรัฐบาลพลเรือนอยูใตเสียงขางมากเด็ดขาดของพรรค เผด็จการก็จะควบคุมชาติและอุตสาหกรรมไดอยางไรผูทาทาย"
 EST_exploit_the_banks: "ใชประโยชนจากธนาคาร"
 EST_exploit_the_banks_desc: "คอนสตันติน แพตสเปนบุคคลทรงอิทธิพลในวงการธนาคารเอสโตเนียมาชานาน แมบางคนจะกลาวหาอยางทรยศวาแพตสมีสวนทําใหธนาคารฉอฉลและเอารัดเอาเปรียบชนชั้นแรงงานของเอสโตเนีย แตเสนสายของแพตสในภาคเอกชนก็ทําใหเผด็จการของเราอยูในตําแหนงที่เหมาะเจาะจะหาประโยชนบาง"
 EST_modernize_capital: "พัฒนาทาลลินนใหทันสมัย"
 EST_modernize_capital_desc: "นครทาลลินนอันยิ่งใหญตกอยูในกรงเล็บอันชั่วรายของผูกดขี่ชาวเยอรมันและรัสเซียมานานเกินไป จนยังไมอาจเติบโตเต็มศักยภาพในฐานะเมืองที่บอลติกทั้งปวงตองอิจฉา นครอันยิ่งใหญของเราไมเคยและจะไมมีวันถูกกองทัพตางชาติเผาผลาญหรือยํ่ายี และตองไดรับการพัฒนาใหทันสมัยเพื่อแขงขันกับเมืองอื่น ๆ ในยุโรป"
 EST_squash_the_opposition: "บดขยี้ฝายคาน"
 EST_squash_the_opposition_desc: "เมื่อเราควบคุมรัฐบาลพลเรือนไดโดยสมบูรณแลว เราตองกําจัดเมล็ดพันธุแหงการทรยศทั้งหมดออกจากคณะรัฐมนตรีและรัฐบาลทองถิ่น ผูที่ตอตานการนําของเราตองเรียนรูในไมชาวา การตอตานอิซามาลีตก็คือการตอตานเอสโตเนีย"
 EST_formalize_baltic_entente: "ทําใหความตกลงบอลติกเปนทางการ"
 EST_formalize_baltic_entente_desc: "ความตกลงบอลติกคือขอตกลงระหวางเรากับพี่นองชาวบอลติกที่จะปกปองกันและกันในยามสงคราม แตความจริงใจในการยึดถือขอตกลงนี้ยังนาสงสัยอยางยิ่ง เมื่อเยอรมนีและโซเวียตจอคอหอยเราทุกชาติ ขณะที่อังกฤษอยูหางไกลจากชายฝงของเรา ความรวมมือจึงไมเคยสําคัญตอการรักษาเอกราชอันเปราะบางของเราเทานี้มากอน"
 EST_look_north: "มองไปทางเหนือ"
 EST_look_north_desc: "เราตระหนักดีวารัฐบอลติกเพียงลําพังอาจไมพอจะตานภัยนาซีและโซเวียตที่ชายแดนของเราได แตดวยความทะเยอทะยานตอสแกนดิเนเวียของผูรุกราน บางทีเราอาจโนมนาวพันธมิตรทางเหนือใหเขารวมความตกลงบอลติกได"
 EST_beyond_the_baltic: "เหนือกวาบอลติก"
 EST_beyond_the_baltic_desc: "แมบางคนจะยืนกรานวาความตกลงบอลติกเพียงพอจะปกปองชาติเล็ก ๆ ของเราจากการรุกราน แตเราทุกคนรูดีวานั่นเปนความเขาใจผิด ฝายสัมพันธมิตรเคยชวยเราในป 1918 ในการตอสูเพื่อกําหนดชะตาตนเอง และบางทีก็คงไมใชเรื่องโงเขลานักที่จะหวังใหพวกเขามาชวยเราอีกครั้ง!"
 EST_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 EST_join_the_allies_desc: "ฝายสัมพันธมิตรไดพิสูจนแลววาเปนมิตรตอเอกราชของ[ROOT.GetAdjective] สิ่งที่เหลืออยูคือการทําใหมิตรภาพนั้นเปนทางการ ดวยการที่[ROOT.GetNameDef]เขารวมฝายสัมพันธมิตรอยางเปนทางการ"
 EST_national_council: "ยึดกุมสภาแหงชาติ"
 EST_national_council_desc: "สภาแหงชาติคือสวนหนึ่งของรัฐบาลที่เปนตัวแทนของเทศบาล เมือง และสภาบรรษัทตาง ๆ หากเราจะเปนตัวแทนผลประโยชนของคนเหลานี้อยางเหมาะสม เราตองแนใจวาผูแทนของพวกเขาเปนสมาชิกพรรคอิซามาลีตและเจาหนาที่ทหารที่ภักดีเทานั้น เพราะมีเพียงพวกเขาที่สามารถปกปองอธิปไตยของชาวเอสโตเนียได"
 EST_new_economic_policy: "ทบทวนนโยบายเศรษฐกิจ"
 EST_new_economic_policy_desc: "เศรษฐกิจของเราแทบจะพึ่งพาการคากับสหภาพโซเวียตทั้งหมด ชาวรัสเซียเปนศัตรูโดยตรงของการกําหนดชะตาตนเองของเอสโตเนีย และตราบใดที่เรายังตองพึ่งพาพวกเขาในเรื่องใดก็ตาม เราก็ยังไมเปนอิสระอยางแทจริง เราตองแยกตัวออกจากผูกดขี่เพื่อเศรษฐกิจที่เปนอิสระอยางแทจริงยิ่งขึ้น"
 EST_support_independent_militaries: "สนับสนุนกองกําลังอิสระ"
 EST_support_independent_militaries_desc: "ทั่วทั้งประเทศ กลุมกองกําลังอิสระตางกระตือรือรนที่จะบุกเขาสูสนามรบเพื่อปกปองเอสโตเนียจากจักรวรรดินิยมตางชาติอีกครั้ง แตสิ่งที่พวกเขามีเต็มเปยมในดานจิตวิญญาณกลับขาดแคลนในดานทรัพยากร เราตองจัดหาทรัพยากรที่จําเปนใหทหารทุกคน ไมวาจะเปนทหารทางการหรือไม เพื่อปกปองชาติอันดีงามของเรา"
 EST_fight_the_vaps: "ตอสูกับวาปส"
 EST_fight_the_vaps_desc: "ขบวนการวาปซิดฝายขวาพยายามบอนทําลายเสถียรภาพของเอสโตเนีย แมขบวนการนี้จะเริ่มตนจากกลุมทหารผานศึกและวีรบุรุษของชาติ แตก็เสื่อมถอยลงอยางรวดเร็วกลายเปนขบวนการชาตินิยมสุดโตงที่[EST.GetLeader]เปรียบไดกับพวกนาซี กลุมนอกคอกเหลานี้ภายในชาติตองถูกกําจัด หากเราจะสรางอนาคตที่มั่นคงใหเอสโตเนีย"
 EST_republican_defence_league: "สันนิบาตปองกันสาธารณรัฐ"
 EST_republican_defence_league_desc: "เมื่อวาปสเสื่อมความสําคัญลง กลุมกึ่งทหารจํานวนมากก็หลงทางและไรอุดมการณใหตอสู ดวยการพยายามรวมกลุมกึ่งทหารเหลานี้เปนองคกรทางการของเอสโตเนียเพียงหนึ่งเดียว เราจะไดแหลงกําลังใหมจากชายผูกลาที่พรอมสูและสละชีพเพื่อเอกราชของเอสโตเนีย"
 EST_womens_defence_league: "สันนิบาตปองกันสตรี"
 EST_womens_defence_league_desc: "ไนสโคดูไกตเซเปนองคกรยอยของสันนิบาตปองกันสาธารณรัฐ สําหรับสตรีผูรักชาติที่พรอมทําหนาที่ของตนในการปกปองบานเกิดและครอบครัว สิ่งสําคัญยิ่งคือสันนิบาตปองกันสตรีตองไดรับยุทโธปกรณและการลงทุนอยางเหมาะสม เพื่อจัดกองรักษาการณใหบานเกิดและบุคลากรทางการแพทยใหกองทหารของเรา"
 EST_corporate_chambers: "สภาบรรษัท"
 EST_corporate_chambers_desc: "ฝายซายคัดคานแนวคิดบรรษัทนิยมมาชานาน แตบัดนี้เมื่อรีกีโคกูปลอดจากเสียงโวยวายไมหยุดหยอนของพวกเขาแลว ในที่สุดเราก็จัดตั้งสภาบรรษัทได คนงานจะถูกแบงกลุมไมใชตามอุดมการณแตตามอาชีพ โดยมีนายจางเอกชนเปนตัวแทนผลประโยชนของพวกเขาตอรัฐบาลเผด็จการ จะมีอะไรผิดพลาดไดเลา?"
 EST_cave_to_enemy_pressure: "ยอมจํานนตอแรงกดดันของศัตรู"
 EST_cave_to_enemy_pressure_desc: "เปนที่ชัดเจนแลววาไมมีอนาคตใดที่ทั้งชาติและประชาชนของเราจะอยูรอดไปดวยกันได แมเราจะทํามามากเพื่อปกปองพี่นองของเรา แตก็ชัดเจนแลววาไมมีทางที่[Root.GetNonIdeologyName]จะรักษาเอกราชไวไดโดยไมสูญเสียประชาชนอยางใหญหลวง"
 EST_threat_on_our_border: "ภัยคุกคามที่ชายแดน"
 EST_threat_on_our_border_desc: "สงครามกําลังกอตัวที่ขอบฟา เราไมรูวาเพื่ออะไร และไมรูวาเราจะตองสูกับใคร แตเรารูวาเหยี่ยวแหงสงครามไดกางกรงเล็บพรอมตะครุบ[Root.Capital.GetName]แลว และเราตองตัดสินใจวาจะยืนอยูขางใดในการตอสูที่กําลังจะมาถึง ตองวางแผนโดยมุงเนนไปที่พวกนาซีทางใตหรือโซเวียตทางตะวันออก"
 EST_fortify_tallinn: "เสริมปอมปราการทาลลินน"
 EST_fortify_tallinn_desc: "แมหลายคนอยากเชื่อวาเราจะรักษาพรมแดนเอสโตเนียไวไดทั้งหมด แตตามความเปนจริงแลว เรารูวาตองเสียสละพื้นที่บางสวนหากจะอยูรอด ปอมปราการรอบเมืองหลวงจะชวยใหเราปกปองแกนกลางของโครงสรางพื้นฐานได ไมวาจะตองแลกดวยอะไร"
 EST_hold_saaremaa: "ยึดครองซาเรมาไว"
 EST_hold_saaremaa_desc: "เราตองเตรียมพรอมสําหรับการตอตานที่ยาวนานและยากลําบาก แมหมูเกาะเอสโตเนียจะขาดอุตสาหกรรมเชนแผนดินใหญ แตการเตรียมหมูเกาะไวเปนที่มั่นสุดทายจะทําใหเรามีฐานปฏิบัติการไวสนับสนุนนักรบฝายตอตาน และในเวลาอันควร ยึดบานเกิดของเราคืน"
 EST_fortify_the_border: "เสริมปอมปราการชายแดน"
 EST_fortify_the_border_desc: "เราจะเผชิญหนากับศัตรูที่ชายแดน และเชื่อมั่นวาพี่นองของเราในลัตเวียและลิทัวเนียจะไมลมสลาย ไมวาแผนนี้จะทะเยอทะยานเพียงใด เราตองไมยอมใหผืนดินแมแตฟุตเดียวตกอยูใตการยึดครองของโซเวียตหรือเยอรมนีอีกเลย"
 EST_fight_against_communism: "ไมยอมจํานน"
 EST_fight_against_communism_desc: "เราเคยเห็นมาแลววาชีวิตภายใตการยึดครองของศัตรูเปนอยางไร และชายจํานวนมากของเราไดสละชีพในการตอสูเพื่อที่เราจะไมตองเห็นมันอีก เมื่อความรักชาติเปยมลนในหมูทหาร กองทัพของเราจะไมลมสลายไปอยางเงียบ ๆ"
 EST_long_push_east: "การรุกระยะยาว"
 EST_long_push_east_desc: "เราไมไดคาดคิดวาการทัพของเราจะไปไดดีเพียงนี้ แตนี่เราก็มาถึงแลว ปนไรเฟลอยูในมือและกําลังรุกเขาสูดินแดนหลักของศัตรู ดินแดนของพวกเขากวางใหญ สวนของเราเล็กนิดเดียว และเราตองเตรียมพรอมสําหรับการเดินทางอันยากลําบาก"
 EST_prepare_for_the_inevitable: "เตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 EST_prepare_for_the_inevitable_desc: "เราไมอาจตานทานไดตลอดไป สิ่งสําคัญยิ่งคือเราตองเตรียมรัฐบาลใหพรอมลี้ภัย และสนับสนุนความพยายามตอตานของ[Root.GetAdjective]จากแดนไกล"
 EST_forest_brothers: "พี่นองแหงพงไพร"
 EST_forest_brothers_desc: "เราไดยินเรื่องเลาถึงนักรบตอตานคอมมิวนิสตทั่วรัฐบอลติกที่ซอนตัวอยูในปาในฤดูหนาว และจูโจมกองทัพผูยึดครองครั้งแลวครั้งเลา เราตองติดตอสื่อสารกับนักสูเพื่ออิสรภาพเหลานี้ และทําทุกวิถีทางเพื่อสนับสนุนการตอสูของพวกเขาบนผืนแผนดินบอลติก"
 EST_prepare_underground_resistance: "เตรียมการตอตานทางอุตสาหกรรม"
 EST_prepare_underground_resistance_desc: "โรงงานใหญทั่ว[Root.GetNonIdeologyName]กําลังปดตัวและถูกศัตรูยึด จึงสําคัญยิ่งที่เราตองหาการลงทุนทางอุตสาหกรรมและยุทโธปกรณจากตางประเทศ เพื่อใหเรายังผลิตอาวุธใหฝายตอตานไดตอไป แมจะตองตอสูอยางลับ ๆ ก็ตาม"
 EST_prepare_covert_resistance: "เตรียมการตอตานอยางลับ"
 EST_prepare_covert_resistance_desc: "การตอตานไมไดมีเพียงคนกับปนไรเฟล แตยังรวมถึงการกอวินาศกรรมเสนทางเสบียง การติดตอกับฝายตอตาน และการทําใหศัตรูกระจัดกระจายและสับสน ขณะที่กระสุนของเราพุงเขาเปา เราตองลงทุนในขาวกรองของ[Root.GetAdjective] หากจะยึดมาตุภูมิคืน"
 EST_rally_the_nation: "ปลุกระดมชาติ"
 EST_rally_the_nation_desc: "ขบวนการวาปสคือขบวนการของทหารผานศึกจากสงครามประกาศเอกราชเอสโตเนีย และเราถูกปดปากอยางไมเปนธรรมภายใตระบอบของคอนสตันติน แพตส หากเราจะสรางเอสโตเนียที่ทํางานเพื่อชาวเอสโตเนีย เราตองทําใหโลกรูจักเรา เราตองเดินขบวนไปทั่วประเทศและบอกใหทุกคนรูวาเราอยูที่นี่ เราคือผูที่ตอสูเพื่อการดํารงอยูของเอสโตเนีย และเราสมควรไดรับการรับฟง"
 EST_march_on_talinn: "เดินขบวนสูทาลลินน"
 EST_march_on_talinn_desc: "เมื่อสมาคมทหารผานศึกและกลุมกึ่งทหารจํานวนมากในเอสโตเนียอยูขางเราแลว เราจึงมั่นใจวาคอนสตันติน แพตสจะไมอาจตานทานเราไดเมื่อเราบุกเขาทาลลินน เราจะเดินขบวนไปยังรีกีโคกู และประกาศอยางชัดแจงถึงรัฐบาลวาปซิดที่รวมเปนหนึ่งภายใตอารตูร ซีรก"
 EST_glory_of_war: "เกียรติภูมิแหงสงคราม"
 EST_glory_of_war_desc: "เราคือรัฐบาลของทหารผานศึก แตสมาชิกวาปซิดจํานวนมากแกเกินไปหรือบาดเจ็บทรุดโทรมเกินกวาจะกลับเขาประจําการได บางทีสุนัขสงครามเฒาเหลานี้อาจพบเปาหมายใหมในการฝกฝนทหารเอสโตเนียรุนใหมในวิถีแหงสงคราม"
 EST_mobilize_the_vets: "ระดมทหารผานศึก"
 EST_mobilize_the_vets_desc: "ทหารผานศึกชาวเอสโตเนียจํานวนมากถูกปฏิเสธสิทธิ์สมัครเขาประจําการเพราะมีความเกี่ยวของกับขบวนการวาปส บัดนี้เมื่อเราขึ้นเปนรัฐบาลแลว เราก็มอบสิทธิ์รับใชชาติใหคนเหลานี้ได"
 EST_vapsid_youth: "ยุวชนวาปซิด"
 EST_vapsid_youth_desc: "สมาชิกวาปสสวนใหญผานชวงรุงโรจนของชีวิตไปนานแลว แตคนหนุมสาวกลับหลงใหลในการตอสูเพื่อเอกราชอันเปนประวัติศาสตร ซึ่งเปนเอกลักษณของเอสโตเนียเมื่อไมกี่ทศวรรษกอน การจัดตั้งยุวชนวาปซิดจะมอบที่ทางใหชายหนุมผูกระตือรือรนเหลานี้ไดหวังจะเรียกคืนความรุงโรจนของบิดาและปูของพวกเขา"
 EST_veterans_government: "รัฐบาลทหารผานศึก"
 EST_veterans_government_desc: "คณะรัฐมนตรีชุดกอนออนแอและยอมกมหัวใหคอนสตันติน แพตส เราตองการคณะรัฐมนตรีชุดใหมที่เห็นอกเห็นใจอุดมการณของวาปซิด"
 EST_anti_communist_militia: "กองกําลังอาสาตอตานคอมมิวนิสต"
 EST_anti_communist_militia_desc: "ชาติของเราเต็มไปดวยชายที่พรอมสูกับภัยบอลเชวิคทางตะวันออก แตถูกรัฐบาลเกาปฏิเสธเพราะหัวรุนแรงเกินไป สําหรับวาปสแลว แนวคิดตอตานคอมมิวนิสตไมมีคําวารุนแรงเกินไป และชายเหลานี้สมควรมีที่ในกองทัพของเราไมนอยกวาใคร"
 EST_reach_out_to_germany: "ยื่นมือหาเยอรมนี"
 EST_reach_out_to_germany_desc: "หากเราสูกับโซเวียตไดดวยจิตวิญญาณและความฮึกเหิมเพียงอยางเดียว สหภาพโซเวียตคงลมสลายไปตั้งแตพรุงนี้ แตนาเศราที่เอสโตเนียขาดกําลังพลจะปองกันตนเองจากภัยคุกคามอันทวมทนเชนนี้ บางทีการเขาขางเยอรมนีอาจทําใหเรามีโอกาสอยูรอดไปถึงทศวรรษหนา"
 EST_baltic_shield: "โลแหงบอลติก"
 EST_baltic_shield_desc: "โซเวียตปรารถนาจะบดขยี้เอสโตเนียใตรองเทาบูตของจักรวรรดินิยม แตเราไมอาจปลอยใหเกิดขึ้นได ตองสรางบังเกอรตลอดแนวชายแดน เราอาจเอาชนะโซเวียตไมได แตอยางนอยเราก็อาจยืนหยัดไดนานพอใหผูอื่นทําได"
 EST_join_the_axis: "เขารวมฝายอักษะ"
 EST_join_the_axis_desc: "บัดนี้เมื่อเยอรมนีมั่นใจในเจตนาของเราแลว เราเชื่อมั่นวาการที่เอสโตเนียเขารวมฝายอักษะยอมเปนเรื่องสมเหตุสมผลโดยสิ้นเชิง"
 EST_the_brotherhood: "ภราดรภาพ"
 EST_the_brotherhood_desc: "เอสโตเนียไมไดดํารงอยูอยางโดดเดี่ยว ทางใตของเรามีสองชาติที่เปราะบางอยางยิ่ง ซึ่งนาจะมีโอกาสอยูรอดมากกวาหากรวมเขากับรัฐเอสโตเนีย รัฐบอลติกคือพี่นองกัน และในฐานะพี่นอง เราตองยืนหยัดเคียงขางกัน"
 EST_empower_finnish_militants: "เสริมพลังนักรบฟนแลนด"
 EST_empower_finnish_militants_desc: "ขบวนการวาปสคงเกิดขึ้นไมไดหากปราศจากความชวยเหลือจากทหารผานศึกชาวฟนแลนดทางเหนือ อาสาสมัครชาวฟนแลนดชวยใหเอสโตเนียไดรับเอกราช และบัดนี้ทหารผานศึกเหลานี้ก็เชนเดียวกับเรา ที่ตองการโคนลมรัฐบาลอันออนแอของตนและตั้งรัฐบาลที่ทํางานเพื่อชาวฟนน"
 EST_national_pride_in_finland: "การเดินขบวนแหงความภาคภูมิใจของชาติในฟนแลนด"
 EST_national_pride_in_finland_desc: "ทหารผานศึกชาวฟนแลนดขาดการจัดตั้งอยางที่เรามี ดังนั้นการสนับสนุนอยูหาง ๆ ของเราอาจไมพอจะนํามาซึ่งการเปลี่ยนแปลงอยางที่เราไดเห็นในเอสโตเนีย การจัดเดินขบวนในฟนแลนดอาจทําใหวันหนึ่งเราไดเห็นสองชาติของเรารวมเปนหนึ่งภายใตวีรบุรุษแหงสงครามครั้งกอน"
 EST_finno_estonian_supremacy_league: "สันนิบาตความเปนเลิศฟนโน-เอสโตเนีย"
 EST_finno_estonian_supremacy_league_desc: "บัดนี้เมื่อรัฐบาลฟนแลนดชุดเกาเปนอดีตไปแลว เราสามารถใชสายสัมพันธอันแนบแนนที่สรางไวในรัฐบาลฟนแลนดชุดใหม วางรากฐานมิตรภาพที่ยั่งยืนบนพื้นฐานการปกครองตนเองและความรูสึกตอตานบอลเชวิค"
 EST_unite_our_nations: "รวมชาติของเรา"
 EST_unite_our_nations_desc: "เมื่อฟนแลนดอยูในมือของทหารผานศึกแลว และอิทธิพลของเราก็ถักทอแนนหนาอยูในเนื้อแทของรัฐบาลฟนแลนดชุดใหม เราเพียงแคชักใยอีกเล็กนอยก็จะรวมประชาชนของเราเปนชาติเดียวได"
 EST_sieze_swedish_assets: "ยึดทรัพยสินของสวีเดน"
 EST_sieze_swedish_assets_desc: "ชาวสวีเดนนั่งทับทรัพยสินของตนโดยไมทําอะไรกับมันนอกจากสงใหมหาอํานาจใดก็ตามที่ดูนาเกรงขามที่สุดสําหรับพวกเขา การผลาญทรัพยากรของสแกนดิเนเวียเชนนี้จะดําเนินตอไปไมไดอีกแลว ทรัพยสินเหลานี้ตองตกอยูในความครอบครองของเอสโตเนีย"
 EST_secure_the_straits: "ยึดกุมชองแคบ"
 EST_secure_the_straits_desc: "เดนมารกขวางเสนทางสูแอตแลนติกของเรา และตองถูกกําจัดหากเรือของเอสโตเนียจะทองทะเลเหนือ"
 EST_occupy_norway: "ยึดครองนอรเวย"
 EST_occupy_norway_desc: "เมื่อสวีเดนและฟนแลนดอยูในกํามือของเราแลว เราเพียงแคปราบชาวนอรเวยใหยอมสยบ สแกนดิเนเวียแผนดินใหญทั้งหมดก็จะตกอยูใตการควบคุมของเอสโตเนีย"
 EST_form_scandinavia: "เอสโตเนียคือสแกนดิเนเวีย"
 EST_form_scandinavia_desc: "ผูคนมากมายทางเหนือมองวาการที่เอสโตเนียอางอัตลักษณสแกนดิเนเวียเปนเพียงเรื่องตลก แตเมื่ออนุทวีปทั้งหมดอยูใตการควบคุมของเราแลว ยังจะมีใครเหลือใหหัวเราะอีก? เมื่อสวีเดน นอรเวย และเดนมารกอยูใตรองเทาบูตของเอสโตเนียอยางมั่นคง ก็ไมมีใครหยุดเราจากการอางสิทธิ์ในสแกนดิเนเวียได!"
 EST_proclaim_finno_ugra: "ประกาศฟนโน-อูกรีอา"
 EST_proclaim_finno_ugra_desc: "เมื่อฟนแลนดอยูใตการควบคุมของเราแลว เราจึงอยูในตําแหนงพิเศษที่จะรวมอัตลักษณฟนนิกไวในรัฐของเรา มีชนชาติฟนโน-อูกริกนับไมถวนทั่วยุโรปเหนือ และดวยการรวมอัตลักษณนี้ เราจะไดทหารใหมนับไมถวนมาสูเพื่ออุดมการณวาปซิด"
 EST_unite_the_sami: "รวมชาวซามี"
 EST_unite_the_sami_desc: "ชาวซามีเปนชนชาติที่กระจัดกระจายและถูกกดขี่อยางกวางขวาง อาศัยอยูทั่วฟนแลนด สวีเดน นอรเวย และรัสเซีย ชาวซามีถูกปฏิเสธสิทธิ์ในการพูดภาษาฟนนิกของตนมานานเกินไป และพวกเขาขาดกําลังพลที่จําเปนในการตอสูกับผูกดขี่ เราตองรวมชาวซามีไวในรัฐของเราเพื่อปกปองพวกเขาจากจักรวรรดินิยมนอรดิก"
 EST_unite_karelia: "รวมคาเรเลีย"
 EST_unite_karelia_desc: "คาเรเลียเต็มไปดวยชนชาติฟนนิก ตั้งแตชาวคาเรเลียนเองไปจนถึงชาวซามีตะวันออก เมื่อฟนแลนดอยูใตการควบคุมของเรา เราก็อาจขยายรัฐเขาไปในคาเรเลียและรวมชนชาติฟนนิกที่นั่นเขาดวยกันได"
 EST_unite_the_finnic_identity: "รวมอัตลักษณฟนนิก"
 EST_unite_the_finnic_identity_desc: "เมื่อชาวฟนนกลุมหลักทั้งหมดในอนุทวีปสแกนดิเนเวียอยูใตการควบคุมของเรา เราก็สามารถรวมอัตลักษณฟนนิกและประกาศรัฐใหมที่ชาวเอสโตเนีย ชาวฟนน ชาวซามี ชาวเนเนตส และชนชาติฟนโน-อูกริกอื่น ๆ ทั้งปวงจะเรียกวาบานได"
 EST_break_the_silence: "ทําลายความเงียบ"
 EST_break_the_silence_desc: "คอนสตันติน แพตสสถาปนาเผด็จการนี้ภายใตขออางวาเพื่อปกปองเอสโตเนียจากลัทธิฟาสซิสตและคอมมิวนิสต บัดนี้เมื่ออุดมการณเหลานั้นหมดความสําคัญไปแลว ก็แทบไมมีเหตุผลใหเผด็จการดําเนินตอไป และตองเปดการเลือกตั้งเสรีอีกครั้ง"
 #Lithuania
 LIT_secure_a_loyal_cabinet: "เปดประชุมเซมัสอีกครั้ง"
 LIT_secure_a_loyal_cabinet_desc: "เมื่อรัฐประหารสําเร็จและอันตานัส สเมโตนาควบคุมรัฐบาลไดอยางเด็ดขาดแลว ถึงเวลาที่เราจะเปดประชุมเซมัสอีกครั้งเพื่อปกครองชาติอยางมีประสิทธิภาพยิ่งขึ้น โดยมีรัฐมนตรีผูภักดีอยูเคียงขางผูเผด็จการ"
 LIT_rastikis_military_reforms: "การปฏิรูปกองทัพของราชติคิส"
 LIT_rastikis_military_reforms_desc: "กองทัพไมพรอมจะรับมือภัยคุกคามในระดับความรุนแรงที่การรุกรานของเยอรมนีอีกครั้งจะนํามา และสิ่งสําคัญยิ่งคือฝายทหารของรัฐบาลตองนําผูนําที่มีความสามารถมาสูเหลาชายผูรักชาติในกองทัพลิทัวเนีย"
 LIT_patriotic_education: "การศึกษาเพื่อความรักชาติ"
 LIT_patriotic_education_desc: "ภาคการศึกษาในลิทัวเนียเคยรุงเรืองกวานี้ แตเราไมอาจปลอยใหความคิดตาง ๆ แพรระบาดในหมูเยาวชนของเราได คนหนุมสาวตองไดรับการศึกษาอยางเหมาะสมในฐานะคาทอลิกชาวลิทัวเนียผูรักชาติ ในสถาบันชั้นดีอยางริตัส"
 LIT_soviet_mutual_assistance: "ความชวยเหลือซึ่งกันและกันกับ[SOV.GetAdjective]"
 LIT_soviet_mutual_assistance_desc: "โปแลนดคือเปาหมายหลักของทั้งโซเวียตและเยอรมนี ซึ่งทุกคนรูดี เราไดยินเสียงกระซิบวามีแผนจะแบงแยกโปแลนดระหวางสองมหาอํานาจ และบางทีเราอาจโนมนาวใหโซเวียตขอการสนับสนุนจากลิทัวเนียในความพยายามนี้ เพื่อแลกกับการคืนวิลนีอุสใหเจาของที่ชอบธรรม"
 LIT_victory_in_trust: "ชัยชนะอยูที่ความไววางใจ"
 LIT_victory_in_trust_desc: "ไมมีใครในรัฐบาลที่เราไวใจได ไมวาจะเปนคาซิส กรีนิอุส เอากุสตีนัส โวลเดมาราส หรือแมแตราชติคิส คนมีอํานาจลวนขลาดเขลาและทรยศ แตปนไรเฟลกับคนดีสักคนที่จะลั่นไก? นั่นแหละที่เราไวใจได และนั่นจะนําชัยชนะมาใหเรา"
 LIT_integrate_the_opposition: "ดึงฝายคานเขามารวม"
 LIT_integrate_the_opposition_desc: "แมอันตานัส สเมโตนาจะมองวารัฐบาลชุดกอนเปนคณะของนักการเมืองไรความสามารถและพวกเห็นใจโซเวียต แตก็ยากจะปฏิเสธวามีคนเกงอยูไมนอยในหมูพวกเขา และคงเปนเรื่องโงเขลาหากไมใชประโยชนจากพวกเขาในเซมัสชุดใหม"
 LIT_patriotic_socialism: "สังคมนิยมเพื่อความรักชาติ"
 LIT_patriotic_socialism_desc: "รัฐบาลประชาธิปไตยประกอบดวยพรรคสังคมประชาธิปไตยและฝายสายกลางเปนสวนใหญ และอุดมคติสังคมนิยมก็แปดเปอนความคิดของคนงานชาวลิทัวเนีย แมคาซิส กรีนิอุสจะเปนนักสังคมนิยมอยางชัดเจน แตก็ปฏิเสธไมไดถึงจิตวิญญาณรักชาติของเขา และบางทีการนําแนวคิดบางอยางของเขามาใชอาจทําใหคนงานชาวลิทัวเนียทั้งมีผลิตภาพมากขึ้นและสนับสนุนเผด็จการมากขึ้น"
 LIT_peace_with_poland: "สันติภาพกับโปแลนด"
 LIT_peace_with_poland_desc: "อยางเปนทางการแลว สงครามระหวางโปแลนดกับลิทัวเนียดําเนินมาหลายทศวรรษ แตทั้งสองฝายแทบไมไดสูรบกันเลยตลอดชวงสงคราม แมวิลนีอุสจะยังอยูในมือพวกเขา แตเราตองเปลี่ยนภาวะชะงักงันนี้ใหเปนสันติภาพอยางเปนทางการ เพื่อมุงไปที่ศัตรูที่แทจริงทางตะวันออกและตะวันตก"
 LIT_strength_in_unity: "ความสามัคคีคือพลัง"
 LIT_strength_in_unity_desc: "เราแข็งแกรงเมื่ออยูรวมกัน และไมมีสองชาติใดที่มีสายสัมพันธเหมือนโปแลนดกับลิทัวเนีย แมเราจะไมมีวันยอมใหตนเองติดกับอยูในเครือจักรภพอีก แตบางทีสองชาติของเราอาจรวมมือกันในฐานะมิตร เพื่อปกปองเอกราชอันเปราะบางของกันและกัน"
 LIT_indivisible_power_of_the_state: "อํานาจรัฐอันแบงแยกมิได"
 LIT_indivisible_power_of_the_state_desc: "ขาคือรัฐ รัฐคือขา เมื่อกฎหมายและระเบียบของเผด็จการไดรับการสถาปนาอยางมั่นคงแลว สิ่งที่เหลืออยูคือการทําใหอํานาจของผูเผด็จการเปนอํานาจเด็ดขาด แมบางคนปรารถนาจะกลับสูประชาธิปไตย แตเรารูวานี่เปนความคิดที่อันตรายและโงเขลา ขณะที่ลมหายใจรอนผาวของหมีและอินทรีกําลังรดตนคอของลิทัวเนีย"
 LIT_purge_popular_resistance: "กวาดลางการตอตานของประชาชน"
 LIT_purge_popular_resistance_desc: "มีกลุมนอกคอกในหมูประชาชนที่ตอตานสเมโตนาและเผด็จการของเขา คนเหลานี้เปนศัตรูของเอกราชลิทัวเนีย และตองถูกกําจัดใหสิ้นเพื่อใหชาติของเรามีเสถียรภาพและอยูรอดตอไป"
 LIT_anti_communist_militia: "กองกําลังอาสาตอตานคอมมิวนิสต"
 LIT_anti_communist_militia_desc: "เปาหมายของเราคือกําจัดกลุมฝายซายออกจากชาติ และโชคดีที่มีอาสาสมัครทั่วประเทศที่มีเปาหมายเดียวกับเราอยูแลว เราเพียงแคสนับสนุนองคกรตอตานฝายซายเหลานี้ แลวพวกเขาจะทํางานปองกันโซเวียตทั้งหมดแทนเราเอง!"
 LIT_arrest_nazis_in_memel: "จับกุมพวกนาซีในเมเมิล"
 LIT_arrest_nazis_in_memel_desc: "เมเมิลเต็มไปดวยพวกนาซีและผูเห็นใจฟาสซิสต ซึ่งกําลังสรางเงื่อนไขใหเยอรมนีรุกราน หากเราตองการรักษาภูมิภาคเมเมิลไว เราตองทําใหการเปนสมาชิกพรรคนาซีเปนความผิดที่มีโทษจําคุก และเตรียมการอยางเพียงพอสําหรับการรุกรานที่อาจเกิดขึ้นของนาซี"
 LIT_reminder_of_true_enemy: "เครื่องเตือนใจถึงศัตรูที่แทจริง"
 LIT_reminder_of_true_enemy_desc: "ระหวางสงครามป 1918 เราเผชิญการกดขี่อันโหดรายจากกองทัพแดงและไฟรคอรปส และเมื่อสงครามกําลังกอตัวที่ขอบฟา ความทรงจําอันขมขื่นเหลานั้นก็แผดเผาจิตใจของรัฐมนตรีชาวลิทัวเนีย เราไมอาจรอชาได เราตองตัดสินใจวามหาอํานาจใดเปนภัยคุกคามใหญหลวงที่สุด และเตรียมการสําหรับสงครามอยางเพียงพอ!"
 LIT_appease_soviets: "ผอนปรนตอรัสเซีย"
 LIT_appease_soviets_desc: "แมเราจะพยายามทุกวิถีทางเพื่อเตรียมพรอมสําหรับสงคราม แตเราตองยอมรับความพายแพหากจะรักษาชีวิตของชาวลิทัวเนียไว"
 LIT_appease_nazis: "ผอนปรนตอเยอรมนี"
 LIT_appease_nazis_desc: "แมเราจะพยายามทุกวิถีทางเพื่อเตรียมพรอมสําหรับสงคราม แตเราตองยอมรับความพายแพหากจะรักษาชีวิตของชาวลิทัวเนียไว"
 LIT_offer_military_basing: "เสนอสิทธิ์ตั้งฐานทัพ"
 LIT_offer_military_basing_desc: "สิ่งสุดทายที่เราตองการคือสงครามอีกครั้ง ลิทัวเนียมีความสําคัญเชิงยุทธศาสตรตอทั้งเยอรมนีและโซเวียต ดังนั้นบางทีการเสนอสิทธิ์ผานแดนและตั้งฐานทัพภายในประเทศ รวมถึงสิทธิ์ในการสรางและใชบังเกอร อาจชวยใหเราหลีกเลี่ยงการถูกรุกรานได"
 LIT_offer_military_basing_tt_1: "§Gขึ้นอยูกับวาผอนปรนตอฝายใด:§!\n"
 LIT_offer_military_basing_tt_2: "§Rหรือ§!\n"
 LIT_occupation: "การยึดครอง"
 LIT_occupation_desc: "สายเกินไปสําหรับเราแลว ประเทศเต็มไปดวยทหารศัตรูที่อาจหันมาเลนงานเราไดทุกเมื่อ บางทีถึงเวลาที่ผูนําและรัฐบาลของเราตองลาออก และปลอยใหศัตรูทํากับเราตามใจชอบ"
 LIT_free_voldemares: "ปลอยตัวโวลเดมาราส"
 LIT_free_voldemares_desc: "บางทีสเมโตนาอาจรีบรอนเกินไปที่จับกุมอดีตนายกรัฐมนตรีของตน โวลเดมาราสเปนมิตรของเอกราชลิทัวเนียอยางชัดเจน และคงเปนเรื่องโงเขลาหากเราไมใชประโยชนจากความสามารถและผูสนับสนุนที่ภักดีของเขาในรัฐบาล"
 LIT_lithuanian_activist_front: "แนวรวมนักกิจกรรมลิทัวเนีย"
 LIT_lithuanian_activist_front_desc: "มีนักกิจกรรมและกลุมกึ่งทหารอยูทั่วลิทัวเนีย แมจะกระจัดกระจายและแบงแยกตามอุดมการณ แตสิ่งที่ทุกกลุมมีรวมกันคือจิตวิญญาณที่จะสูเพื่อลิทัวเนียและรักษาเอกราชของเธอ การจัดตั้งแนวรวมนักกิจกรรมลิทัวเนียจะทําใหลิทัวเนียไมใชเปาหมายงาย ๆ ใหมหาอํานาจจักรวรรดินิยมปลนสะดม"
 LIT_organize_the_iron_wolf: "จัดระเบียบหมาปาเหล็ก"
 LIT_organize_the_iron_wolf_desc: "หมาปาเหล็กยังคงกระจัดกระจายและไรระเบียบ และเชนเดียวกับโวลเดมาราสเอง พวกเขายังลังเลวาจะสนับสนุนรัฐบาลหรือตองการโคนลมมัน การมอบวิสัยทัศนและเปาหมายที่ชัดเจนใหหมาปาเหล็กจะเปลี่ยนเด็กหนุมที่หลงทางเหลานี้ใหเปนลูกผูชาย"
 LIT_new_kind_of_iron_wolf: "หมาปาเหล็กรูปแบบใหม"
 LIT_new_kind_of_iron_wolf_desc: "บัดนี้เมื่อจัดการภัยคุกคามจากหมาปาเหล็กไดแลว เราก็เรียกคืนสัญลักษณประจําชาติของเรา และแสดงมันอยางภาคภูมิทั่วกองทัพได"
 LIT_lithuanian_youth: "ยุวชนหมาปาเหล็ก"
 LIT_lithuanian_youth_desc: "กองทัพตองการกําลังคน แตในยุคแหงอุดมการณเชนนี้ เราตองปลูกฝงความคิดรักชาติใหเด็กชายของเรา เพื่อเมื่อพวกเขาโตพอ สิ่งเดียวที่ตองการคือปนไรเฟล และพวกเขาจะยินดีสละชีพเพื่อผืนดินลิทัวเนียแมเพียงนิ้วเดียว"
 LIT_rapid_fortifications_in_the_east: "สรางปอมปราการทางตะวันออกอยางเรงดวน"
 LIT_rapid_fortifications_in_the_east_desc: "เปนที่ชัดเจนวาภัยคุกคามเรงดวนที่สุดตอเอกราชของเราคือพวกคอมมิวนิสต และเราตองทําทุกอยางที่ทําไดเพื่อปกปองชาติจากภัยที่พวกเขากอ"
 LIT_defence_from_above: "การปองกันจากเบื้องบน"
 LIT_defence_from_above_desc: "ปอมปราการของเราไรประโยชนโดยสิ้นเชิงหากศัตรูยังคงทิ้งระเบิดใสจากทองฟา เราตองเตรียมการปองกันและยิงตอบโตขึ้นฟาทุกครั้งที่มีระเบิดและกระสุนตกลงมาจากเบื้องบน"
 LIT_exile_voldemares: "เนรเทศโวลเดมาราส"
 LIT_exile_voldemares_desc: "เมื่อเอากุสตีนัส โวลเดมาราสอยูหลังลูกกรงอยางปลอดภัยแลว ใคร ๆ ก็คงคิดวาหมาปาเหล็กคงไดแตเหาแตไมกัด แตองคกรของเขายังคงเคลื่อนไหวเรียกรองใหปลอยตัวเขา และยังเปนภัยคุกคามในประเทศ หากโวลเดมาราสไดรับการปลอยตัวแตถูกหามกลับเขาลิทัวเนียตลอดไป ขบวนการหมาปาเหล็กยอมสูญเสียแรงผลักดัน และเราจะพนจากภัยที่พวกเขากอ"
 LIT_root_out_the_iron_wolf: "ถอนรากถอนโคนหมาปาเหล็ก"
 LIT_root_out_the_iron_wolf_desc: "แมการเนรเทศโวลเดมาราสจะหยุดความพยายามโคนลมรัฐบาลของหมาปาเหล็กในอนาคตได แตองคกรนี้ยังคงอยู และตองผลักคนเหลานี้ไปไวชายขอบทางการเมืองใหไกลที่สุด เพื่อใหอนาคตของกองทัพลิทัวเนียมั่นคง"
 LIT_prepare_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LIT_prepare_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LIT_unify_the_military: "รวมกองทัพเปนหนึ่ง"
 LIT_unify_the_military_desc: "ทหารบางสวนในกองทัพลิทัวเนียหลงใหลโวลเดมาราสและกลุมกึ่งทหารหมาปาเหล็กของเขาอยางสิ้นเชิง ถึงขนาดที่เพียงแคสงคําเชิญ กองทัพลิทัวเนียเกือบทั้งหมดก็จะตกอยูใตอิทธิพลของหมาปาเหล็ก ดวยเหตุนี้ ในที่สุดเราก็จะโคนสเมโตนาออกจากรัฐบาลและทวงคืนลิทัวเนียได!"
 LIT_seek_ties_with_germany: "แสวงหาความสัมพันธกับเยอรมนี"
 LIT_seek_ties_with_germany_desc: "แมอยางเปนทางการเยอรมนีจะเปนศัตรูของรัฐลิทัวเนีย แตเยอรมนีก็มีศัตรูรวมกับเรา นั่นคือโปแลนด การยื่นมือหาเยอรมนีอาจชวยใหเราทวงคืนพี่นองชาวลิทัวเนียที่สูญเสียไปซึ่งตอนนี้ถูกโปแลนดยึดครองอยู"
 LIT_fortify_memel: "เสริมปอมปราการเมเมิล"
 LIT_fortify_memel_desc: "เราไวใจใหเยอรมนีปกปองอธิปไตยของลิทัวเนียไมได เหมือนที่ไวใจใหหมาจิ้งจอกเฝาเลาไกไมได! [GER.GetLeader] เปนศัตรูของรัฐลิทัวเนีย และไมใชความลับเลยวาเมเมิลทําใหเราเปนเปาการรุกรานของเยอรมนี!"
 LIT_proclaim_greater_lithuania: "ประกาศมหาลิทัวเนีย"
 LIT_proclaim_greater_lithuania_desc: "ลิทัวเนียเคยเปนหนึ่งในมหาอํานาจที่ยิ่งใหญที่สุดของยุโรป แตนับตั้งแตเราถูกโปแลนดตัดทอนและบั่นทอนกําลังเมื่อหลายศตวรรษกอน เราก็ไมอาจฟนฟูความรุงโรจนในอดีตได แตจะไมเปนเชนนั้นอีกตอไป ลิทัวเนียจะกลับมาเปนมหาอํานาจที่ยิ่งใหญที่สุดของยุโรปอีกครั้ง!"
 LIT_claim_livonia: "อางสิทธิ์ลิโวเนีย"
 LIT_claim_livonia_desc: "ทางเหนือมีสองรัฐอายุนอยที่ไมไดรูจักเอกราชมาหลายศตวรรษ พวกเขาคงไดรับการชี้นําที่ดีกวาภายใตมือของลิทัวเนียแนนอน…"
 LIT_claim_lithuania_minor: "อางสิทธิ์ลิทัวเนียนอย"
 LIT_claim_lithuania_minor_desc: "ภูมิภาคที่เยอรมนีเรียกอยางผิด ๆ วา “เคอนิกสแบรก” แทจริงคือบานเกิดบรรพบุรุษของชาวลิทัวเนีย ลิทัวเนียนอยตกอยูใตการยึดครองของเยอรมนีมาตั้งแตสงครามครูเสดบอลติก และตองทวงคืนมาใหได"
 LIT_demand_vilnius: "เรียกรองวิลนีอุส"
 LIT_demand_vilnius_desc: "นครหลวงดั้งเดิมของลิทัวเนียถูกศัตรูของเราในโปแลนดยึดครองมานานเกินไป และรัฐบาลของเราก็ออนแอเกินกวาจะทําอะไรได แตจะไมเปนเชนนั้นอีกตอไป วิลนีอุสจะกลับมาเปนของลิทัวเนียอีกครั้ง!"
 LIT_support_polish_fascists: "สนับสนุนฟาสซิสตโปแลนด"
 LIT_support_polish_fascists_desc: "โปแลนดมีศัตรูรวมกับเรา และเราไมอาจลืมความผูกพันฉันเครือญาติหลายปที่เปนเอกลักษณของประวัติศาสตรโปแลนด-ลิทัวเนีย เราตองสนับสนุนลัทธิฟาสซิสตภายในรัฐโปแลนด"
 LIT_invade_poland: "รุกรานโปแลนด"
 LIT_invade_poland_desc: "เปนเวลาหลายศตวรรษที่ลิทัวเนียถูกพันธนาการไวใน “เครือจักรภพ” ซึ่งโปแลนดกุมอํานาจสวนใหญ ชาวโปแลนดกระหายจะหวนคืนสูสภาพการณนั้น และบางทีถึงเวลาแลวที่เราจะมอบเครือจักรภพที่พวกเขาปรารถนาให"
 LIT_request_polish_occupation: "เรียกรองใหยึดครองโปแลนด"
 LIT_request_polish_occupation_desc: "ตลอดหลายทศวรรษที่ผานมา แนวคิดเรื่องรัฐโปแลนดที่ไมรวมลิทัวเนียถูกมองวาเปนเรื่องที่คิดไมถึง และอธิปไตยของลิทัวเนียก็เปนเหมือนเรื่องตลกสําหรับนักการเมืองโปแลนดรวมสมัย ดังนั้นบางทีพวกเขาอาจพอใจอยางยิ่งกับการที่ลิทัวเนียเขายึดครองชาติอันนาสมเพชของพวกเขา"
 LIT_restore_order: "ฟนฟูระเบียบ"
 LIT_restore_order_desc: "นานมาแลว ลิทัวเนียเคยเปนหุนสวนที่ยิ่งใหญกวาใน “เครือจักรภพ” และโปแลนดก็เปนเพียงรัฐแคบ ๆ ริมชายแดนของเรา ถึงเวลาแลวที่เราจะฟนฟูโลกใหกลับเปนอยางที่ควรจะเปน"
 LIT_restore_greater_lithuania: "ฟนฟูมหาลิทัวเนีย"
 LIT_restore_greater_lithuania_desc: "เมื่อผูรวมมือนับไมถวนทางตะวันออกตางกระตือรือรนจะรับตําแหนงในนามของเรา สิ่งที่เหลืออยูคือการเติมรัฐบาลทองถิ่นดวยผูภักดี และประกาศยุคใหมแหงการครอบงํารูทีเนียของลิทัวเนีย!"
 LIT_prepare_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LIT_prepare_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LIT_underground_production_centers: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LIT_underground_production_centers_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
