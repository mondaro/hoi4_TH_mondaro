  idea_SIA_overheated_economy: "เศรษฐกิจรอนแรงเกินไป"
  idea_SIA_overheated_economy_desc: "เศรษฐกิจถูกผลักดันจนเกินขีดจํากัดตามธรรมชาติ ความตองการของผูบริโภคลนเกินกําลังการผลิต และการกอสรางที่เคยเฟองฟูก็ชะงักลงระหวางรอใหสถานการณเย็นลง"
  idea_SIA_ending_military_grift: "ยุติการฉอฉลในกองทัพ"
  idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
  idea_SIA_the_military_oversight_bureau_desc: "สํานักงานตรวจสอบกิจการทหารกําหนดมาตรฐานที่สูงขึ้นสําหรับผูบังคับบัญชาใหม และเรงการพัฒนาความเชี่ยวชาญทั่วทั้งหมูนายทหาร"
  idea_SIA_public_credit_debt: "หนี้สินเชื่อสาธารณะ"
  idea_SIA_public_credit_debt_desc: "ภาระหนี้สินเชื่อของรัฐบั่นทอนเศรษฐกิจอยูตลอดเวลา กลืนกินทรัพยากรที่ควรจะไหลไปสูการผลิตและสินคาพลเรือน"
