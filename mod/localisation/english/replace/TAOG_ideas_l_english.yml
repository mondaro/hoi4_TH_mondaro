  AST_australias_glorious_fleet_desc: "กองทัพเรือออสเตรเลียเตรียมพรอมมานานสําหรับวันที่จะตองเผชิญหนากับมหาอํานาจทางทะเลอีกชาติหนึ่ง และดูเหมือนวามหาอํานาจนั้นก็คือเรา"
