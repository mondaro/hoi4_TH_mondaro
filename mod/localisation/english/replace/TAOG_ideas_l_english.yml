  idea_SIA_an_absolute_monarchy_desc: "พระราชอํานาจทางการเมืองทั้งปวงอยูที่องคพระมหากษัตริย พระราชดํารัสคือกฎหมาย ผูเห็นตางถูกปราบปราม และพระบารมีทั้งปวงถูกทุมเทใหแกการระดมสรรพกําลังของชาติ ราชบัลลังกเรียกรองความจงรักภักดี และกองทัพคือเครื่องมือของพระองค"
  idea_SIA_a_constituional_monarchy: "ราชาธิปไตยภายใตรัฐธรรมนูญ"
  idea_SIA_a_constituional_monarchy_desc: "กรอบรัฐธรรมนูญกําหนดขอบเขตพระราชอํานาจและรับรองสิทธิของปวงชน เมื่อพระมหากษัตริยทรงเปนสัญลักษณแหงความเปนหนึ่งเดียวมากกวาผูทรงอํานาจเด็ดขาด ประเทศชาติก็มีเสถียรภาพยิ่งขึ้น เปดรับแนวคิดใหมมากขึ้น และใกลชิดกับโลกประชาธิปไตยยิ่งขึ้น"
  idea_SIA_restoring_order: "ฟนฟูความสงบเรียบรอย"
  idea_SIA_japanese_fighter_instruction: "การฝกสอนเครื่องบินขับไลโดยญี่ปุน"
  idea_SIA_japanese_fighter_instruction_desc: "ครูฝกจากกองทัพอากาศกองทัพบกจักรวรรดิญี่ปุนกําลังฝกนักบินของเรา และพาวิศวกรของเราเรียนรูแบบเครื่องบินขับไลของพวกเขาทีละขั้น สิ่งที่พวกเขาทิ้งไวในสมุดบันทึกของเราจะคงอยูนานกวาตัวพวกเขาเอง"
  idea_SIA_military_expansion_costs: "ตนทุนการขยายกองทัพ" 
