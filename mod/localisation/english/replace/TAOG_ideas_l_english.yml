  NZL_railways_board: "คณะกรรมการการรถไฟของรัฐบาล"
  NZL_railways_board_desc: "คณะกรรมการการรถไฟของรัฐบาลกอตั้งขึ้นในป 1931 จากการปรับโครงสรางกรมการรถไฟ เพื่อแยกการตัดสินใจออกจากหนวยงานรัฐ ทวานับแตกอตั้งมา โครงขายรถไฟแทบไมมีวี่แววของการพัฒนาเลย แรงกดดันใหรัฐบาลยุบคณะกรรมการและดึงอํานาจควบคุมกลับมาโดยตรงจึงทวีขึ้นเรื่อย ๆ"
  NZL_great_depression: "เศรษฐกิจตกตํ่าครั้งใหญ"
  NZL_great_depression_desc: "การลมสลายของเศรษฐกิจโลกในป 1929 สงผลกระทบอยางหนักตอเศรษฐกิจนิวซีแลนดซึ่งพึ่งพาเกษตรกรรมเปนหลัก เมื่อนานาประเทศซื้อผลผลิตจากนิวซีแลนดนอยลง ผูคนจํานวนมากตองตกงาน กําลังซื้อของผูบริโภคลดลง และสงผลใหอุตสาหกรรมอื่น ๆ พังทลายตามไปดวย หลายปแหงการรัดเข็มขัดทําใหชาติโหยหาการเปลี่ยนทิศทาง"
  NZL_commonwealth_loyalty: "ความภักดีตอเครือจักรภพอังกฤษ"
  NZL_commonwealth_loyalty_desc: "นิวซีแลนดยังคงเปนสมาชิกที่มุงมั่นของเครือจักรภพอังกฤษ และยังถือวาพระมหากษัตริยทรงเปนประมุขแหงรัฐโดยชอบธรรม เศรษฐกิจของนิวซีแลนดยังผูกโยงอยางแนนแฟนกับระบบเศรษฐกิจของจักรวรรดิในวงกวาง"
  NZL_national_coal_board_idea: "คณะกรรมการถานหินแหงชาติ"
  NZL_ministry_of_public_works_dynamic_modifier: "กระทรวงโยธาธิการ"
  modify_NZL_ministry_of_public_works_dynamic_modifier_tt: "ปรับ §Y$NZL_ministry_of_public_works_dynamic_modifier$§! โดย:"

 # ABDACOM Supreme Command dynamic modifier
 ABDA_supreme_command: "กองบัญชาการสูงสุด ABDACOM"
 ABDA_supreme_command_desc: "กองบัญชาการอเมริกัน-อังกฤษ-ดัตช-ออสเตรเลีย ไดวางหลักนิยมทางเรือที่เปนเอกภาพสําหรับกองทัพเรือของสมาชิกทุกชาติ เมื่อพันธมิตรแนบแนนขึ้น การแบงปนขาวกรอง การประสานภารกิจลาดตระเวน และการสนับสนุนการสงกําลังบํารุงซึ่งกันและกัน จะคอย ๆ เพิ่มประสิทธิภาพการรบของทุกกองเรือที่ชักธงของ ABDACOM"
 modify_ABDA_supreme_command_tt: "ปรับ §Y$ABDA_supreme_command$§! โดย:"



