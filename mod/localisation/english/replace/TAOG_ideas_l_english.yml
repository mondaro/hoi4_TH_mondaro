  idea_SIA_breaking_the_burmese_line: "ทลายแนวรบพมา"
  idea_SIA_the_yellow_dossier: "สมุดปกเหลือง"
  idea_SIA_the_yellow_dossier_desc: "รายงานลับวาดวยสภาพอุตสาหกรรมภายในประเทศไดบีบใหตองเผชิญหนากับความไรประสิทธิภาพที่ฝงรากลึก การปฏิรูปที่รายงานเรียกรองเริ่มผลิดอกออกผลในโรงงานของเรา แมความปนปวนที่ตามมาจะมีราคาที่ตองจาย"
