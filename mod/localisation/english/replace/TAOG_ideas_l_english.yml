  idea_INS_volksraad: "โฟลคสราด"
  idea_INS_volksraad_desc: "โฟลคสราดเปนสภาที่เนเธอรแลนดจัดตั้งขึ้นในป 1918 เปนสวนหนึ่งของระบบ “นโยบายเชิงจริยธรรม” โดยมุงสรางระบบกึ่งประชาธิปไตยที่ชนกลุมนอยทางชาติพันธุและวัฒนธรรมตาง ๆ ทั่วหมูเกาะจะไดมีผูแทน แมในทางทฤษฎีจะมีลักษณะเปนประชาธิปไตย แตขาหลวงใหญและราชบัลลังกดัตชก็มีอํานาจยับยั้งอยางไมมีเงื่อนไข"
  INS_volksraad_custom_tt: "สามารถจาง§Yที่ปรึกษาโฟลคสราด§!ได\nสามารถใช§Yการตัดสินใจของโฟลคสราด§!ได"
  INS_great_depression: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญ"
  INS_great_depression_desc: "แมผลกระทบโดยตรงที่ภาวะเศรษฐกิจตกตํ่าครั้งใหญมีตอหมูเกาะอินดีสจะไมมากนัก แตนโยบายกีดกันทางการคาที่ประเทศตาง ๆ ทั่วโลกนํามาใชในเวลาตอมาไดสงผลรายแรงตอเศรษฐกิจของอินดีส ซึ่งตองพึ่งพาการสงออกวัตถุดิบอยางตอเนื่อง เชน ยางและนํ้ามัน"
  INS_great_depression_tt: "ปรับคา§Y$INS_great_depression$§!ดังนี้:"
  INS_dutch_east_indies: "การบริหารที่ผิดพลาด"
  INS_dutch_east_indies_desc: "อินดีสตะวันออกเปนหมูเกาะอันกวางใหญที่มีวัฒนธรรมและภาษาที่แตกตางกันนับรอย ทําใหเปนอาณานิคมที่ขึ้นชื่อวาบริหารไดยากยิ่ง ขบวนการเรียกรองเอกราชตาง ๆ อุปสรรคทางวัฒนธรรม และผลกระทบทางเศรษฐกิจจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ ลวนไมไดชวยใหปญหานี้ดีขึ้น และการบริหารก็ดําเนินไปอยางไรประสิทธิภาพอยางยิ่ง “นโยบายเชิงจริยธรรม” ที่ประกาศใชในป 1918 พยายามปรับปรุงสถานการณดวยการกําหนดกฎระเบียบแรงงานอยางมีจริยธรรม และมอบสิทธิการมีผูแทนตามระบอบประชาธิปไตยแกชนกลุมนอย แตภาวะเศรษฐกิจตกตํ่าครั้งใหญทําใหนโยบายเหลานี้แทบไมไดบังคับใช"
  INS_dutch_east_indies_tt: "ปรับคา§Y$INS_dutch_east_indies$§!ดังนี้:"
  INS_volksraad_tt: "ปรับคา§Y$INS_dutch_east_indies$§!ดังนี้:"
  INS_royal_netherlands_east_indies_army_desc: "กองทัพบกแหงราชอาณาจักรเนเธอรแลนดในอินดีส (KNIL) เปนกองทัพที่ประจําการในอินดีสตะวันออกมาชานาน และปฏิบัติการอยางเปนอิสระจากเนเธอรแลนด KNIL ประกอบดวยทหารทั้งชาวยุโรปและชาวอินโดนีเซีย แตอุปสรรคทางวัฒนธรรมและภาษาระหวางวัฒนธรรมที่หลากหลายของหมูเกาะกับเนเธอรแลนด ทําใหการรับสมัครทหารเปนไปอยางยากลําบากและเชื่องชา"
  idea_INS_netherlands_most_precious_jewel: "อัญมณีลํ้าคาที่สุดของเนเธอรแลนด"
  idea_INS_netherlands_most_precious_jewel_desc: "หมูเกาะอินดีสตะวันออกของดัตชเปนอาณานิคมของเนเธอรแลนดมาราว 350 ป และการบริหารอาณานิคมก็ผูกพันอยางแนนแฟนกับรัฐบาลดัตช อินดีสตะวันออกมักถูกเรียกวา “อัญมณีบนมงกุฎดัตช” และเนเธอรแลนดก็ไมแสดงความปรารถนาใด ๆ ที่จะคลายกํามือจากอัญมณีลํ้าคาของตน"
  INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no สามารถเพิ่มอํานาจปกครองตนเองจนถึงระดับเสรีได"
