  INS_bangka_bauxite_export_desc: "หมูเกาะบังกาและเบลีตุงเปนแหลงบอกไซตปริมาณมหาศาลของโลก ซึ่งเปนวัตถุดิบหลักของอะลูมิเนียม แมเราจะลงทุนผลิตอะลูมิเนียมเองได แตดวยปริมาณบอกไซตที่ผลิตไดอยางมหาศาล การขายแรดิบเปนจํานวนมากจึงเปนยุทธศาสตรที่ใชได"
