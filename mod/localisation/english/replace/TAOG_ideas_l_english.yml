  AST_anti_fascist_measures: "มาตรการตอตานฟาสซิสต"
  AST_anti_fascist_measures_desc: "ลัทธิฟาสซิสตยังไมไดฝงกรงเล็บลงในออสเตรเลีย และกลุมพลังประชาธิปไตยตองการใหเปนเชนนั้นตอไป สํานักงานสืบสวนแหงเครือจักรภพจะเฝาติดตามและควบคุมตัวกลุมที่นาสงสัยทั้งหมด เพื่อไมใหกลุมฟาสซิสตใดไดอิทธิพล"
  ABDA_corps_expeditionnaire_spirit: "กองกําลังสํารวจฝรั่งเศส"
  ABDA_corps_expeditionnaire_spirit_desc: "กองกําลังฝรั่งเศสที่ถูกสงไปยังสมรภูมิแปซิฟกผานการหลอหลอมจากการประจําการในอาณานิคม และคุนเคยกับการปฏิบัติการไกลบานในสภาพที่ยากลําบาก ประสบการณการรบในเอเชียตะวันออกเฉียงใตทําใหพวกเขาเขาใจยุทธวิธีของญี่ปุนและภูมิประเทศเปนอยางดี จึงกลายเปนกําลังที่ทรหดเมื่อขาศึกรุกคืบเขามา"
  ABDA_maintain_strategic_flexibility_spirit: "ความยืดหยุนทางยุทธศาสตร"
  ABDA_maintain_strategic_flexibility_spirit_desc: "ผลผลิตทางอุตสาหกรรมของอเมริกากําลังถูกทุมไปยังสมรภูมิแปซิฟก โดยเรงการผลิตของอูตอเรือเพื่อรักษากองเรือที่สามารถแผอํานาจไปไดทั่วทั้งมหาสมุทร ดวยการไมทุมกําลังเกินตัวใหกับแนวรบใดแนวรบหนึ่ง สหรัฐอเมริกาจึงมั่นใจไดวาจะนําแสนยานุภาพทางเรือไปใชไดทุกที่ที่สถานการณตองการ"
  AST_toe_the_line_spirit: "อยูในแถว"
  AST_toe_the_line_spirit_desc: "รัฐเรียกรองใหเสียสละ และประชาชนก็ตอบรับ การปนสวน ชั่วโมงทํางานที่ยาวขึ้น และการโยกยายการผลิตภาคพลเรือนมาสูความพยายามของชาติ ไดปลดปลอยทรัพยากรที่รัฐบาลไมมีทางไดมาดวยวิธีอื่น นี่คือมาตรการรัดเข็มขัด และไมใชสิ่งที่ทุกคนนิยมชมชอบ"
  AST_defying_american_interference_idea: "$AST_defying_american_interference$"
  AST_new_guard_spirit: "นิวการด"
  AST_new_guard_spirit_desc: "หลังจากเงียบหายไปหลายป กลุมกึ่งทหารชื่อดังอยางนิวการดก็ถูกบีบใหกลับเขาสูสนามอีกครั้งเพื่อตอกรกับศัตรูที่ฟนคืนชีพ\n\nแมกลุมแตกแยกบางกลุมอาจมีวาระแบบหัวรุนแรง แตองคกรนี้ก็กลับมารับหนาที่รักษาความสงบเรียบรอยของสาธารณะอีกครั้ง ดวยการปราบปรามคอมมิวนิสตและยึดมั่นในอุดมการณนิยมกษัตริยแบบอังกฤษ"
  AST_new_guard_spirit_tt: "สมาชิกนิวการด: §Y[?AST_ng_members_var|0]§!\nสมาชิกเพิ่มขึ้นตอวัน: §Y[?AST_ng_daily_var|0]§!\n\nขบวนการนี้รองรับสมาชิกไดสูงสุด §Y50,000§! คน"
  AST_add_ng_fascist_tt: "เปดเผยแผนยุทธศาสตร:\n§Y$AST_campbells_men$\n$AST_the_commander_returns$§!"
  AST_new_guard_spirit_modify: "ปรับ §Y$AST_new_guard_spirit$§! โดย:\n สมาชิกนิวการด: §Y2500§!\n สมาชิกเพิ่มขึ้นตอวัน: §Y10§!"
  AST_fascist_legion_spirit: "กองทหารฟาสซิสต"
  AST_fascist_legion_spirit_desc: "กลุมแตกแยกกลุมหนึ่งของนิวการดพิสูจนแลววามีทัศนะตรงกับรัฐบาลมากกวาตัวนิวการดเอง เมื่อไดรับมอบทรัพยากรของรัฐจากแคมปเบลล กองทหารฟาสซิสตจึงรับหนาที่สําคัญในการปกปองความเปนเอกภาพของพลเมืองดวยการกวาดลางผูเห็นตางทางการเมือง"
