  AST_faction_training_initiative_idea_1_desc: "โครงการฝกรวมของแนวรวมตอตานแหงแปซิฟกเปนโครงการความรวมมือระหวางสมาชิก เพื่อใหมั่นใจวาทหารฝายพันธมิตรทุกนายไดรับการฝกทางทหารที่เขมงวดเทาเทียมกัน"
