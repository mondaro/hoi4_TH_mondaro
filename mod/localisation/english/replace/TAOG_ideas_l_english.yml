  idea_SIA_death_to_communists: "พินาศแกคอมมิวนิสต"
  idea_SIA_death_to_communists_desc: "ความคลั่งตอตานคอมมิวนิสตแผซานไปทั่วหมูทหาร ทําใหกําลังของเราไดเปรียบเหนือกองทัพคอมมิวนิสตของจีน"
  idea_SIA_death_to_nationalists: "พินาศแกชาตินิยม"
