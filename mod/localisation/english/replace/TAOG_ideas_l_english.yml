  AST_a_sense_of_place: "สํานึกแหงถิ่นฐาน"
  AST_a_sense_of_place_desc: "อัตลักษณของชาติคือสายสัมพันธที่ยึดโยงผูคนไวดวยกัน ภายใตวัฒนธรรมที่รุงเรือง ชาวออสเตรเลียไดรวมใจกัน พรอมตอตานผูใดก็ตามที่อาจคุกคามพรมแดนของพวกเขา"
  AST_a_sense_of_place_upgraded: "สํานึกแหงถิ่นฐาน"
  AST_a_sense_of_place_upgraded_desc: "อัตลักษณของชาติที่เคยเบงบานอยางเงียบ ๆ บัดนี้แข็งกราวขึ้น มันไมใชเพียงความภาคภูมิใจในผืนแผนดินและวิถีชีวิตอีกตอไป แตเปนความเชื่อมั่นวาสิ่งที่ออสเตรเลียสรางขึ้นมานั้นคุมคาที่จะตอสูเพื่อมัน และชายหญิงผูอาศัยอยูใตกลุมดาวกางเขนใตพรอมจะทําเชนนั้น"
