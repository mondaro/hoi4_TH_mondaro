  idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
  idea_SIA_revision_of_unequal_treaties: "การแกไขสนธิสัญญาที่ไมเปนธรรม"
  idea_SIA_purged_military: "กองทัพที่ถูกกวาดลาง"
  idea_SIA_purged_military_desc: "การปลดนายทหารที่ถูกมองวาไมนาไววางใจทางการเมือง ทําใหกองทัพขาดแคลนผูนําที่มีประสบการณ สงผลตอการจัดระเบียบและการพัฒนากําลังพลที่เหลืออยู"

  SIA_khana_ratsadon_inlay_title: "คณะราษฎร"
  SIA_civilian_wing_label: "ฝายพลเรือน"
  SIA_military_wing_label: "ฝายทหาร"
  SIA_wing_state_full_support: "§Gสนับสนุนเต็มที่§!"
  SIA_wing_state_slight_support: "§Gสนับสนุนเล็กนอย§!"
  SIA_wing_state_neutral: "§Yเปนกลาง§!"
  SIA_wing_state_opposition: "§Rเปนฝายคาน§!"
  SIA_wing_state_rebellious: "§Rแข็งขอ§!"
  SIA_civilian_wing_history_tt: "ฝายพลเรือนของคณะราษฎรนําโดยนักบริหารและเทคโนแครตหัวกาวหนา ที่โดดเดนที่สุดคือ §Yปรีดี พนมยงค§! ผูสําเร็จการศึกษาดานกฎหมายจากฝรั่งเศส ปรีดีกลับมาพรอมความมุงหวังในการปฏิรูปที่ดิน การวางแผนเศรษฐกิจโดยรัฐ และระบอบประชาธิปไตยภายใตรัฐธรรมนูญที่ใหอํานาจแกราษฎรอยางแทจริง\n\nฝายพลเรือนโดยรวม§Gสนับสนุนการพัฒนา§! เนนการลงทุนดานการศึกษา โครงสรางพื้นฐาน และอุตสาหกรรม พวกเขาไมเห็นดวยกับการใชจายทางทหารจํานวนมาก และระแวงแนวโนมใด ๆ ที่จะนําไปสูการปกครองแบบผูนําเผด็จการ การไดรับการสนับสนุนจากฝายนี้ทําไดงายที่สุดดวยนโยบายที่ทําใหรัฐทันสมัยและปกปองการปกครองตามรัฐธรรมนูญ"
  SIA_military_wing_history_tt: "ฝายทหารของคณะราษฎรถูกครอบงําโดยนายทหารบกที่มองตนเองวาเปนผูพิทักษการปฏิวัติที่แทจริง บุคคลผูทะเยอทะยานที่สุดคือ §Yแปลก พิบูลสงคราม§! นายทหารยศพันเอกผูชื่นชมขบวนการชาตินิยมในยุโรปมากขึ้นทุกป\n\nฝายทหาร§Gสนับสนุนการเสริมสรางกําลังทหาร§! และนิยมรัฐที่เขมแข็งและรวมศูนยอํานาจ พวกเขาระแวงแนวคิดทางเศรษฐกิจของปรีดีซึ่งมองวาหัวรุนแรงอยางอันตราย และแทบไมมีความอดทนตอการแทรกแซงของพลเรือนในกิจการปองกันประเทศ ความภักดีของฝายนี้ไดมางายที่สุดดวยการลงทุนทางทหารและนโยบายที่แสดงแสนยานุภาพของชาติ"
  idea_SIA_wing_promotion_disruption: "การจัดขั้วอํานาจใหม"
  idea_SIA_wing_promotion_disruption_desc: "การเขาขางฝายใดฝายหนึ่งของคณะราษฎรอยางเปดเผยทําใหรัฐบาลเสียสมดุล ฝายที่ถูกมองขามจงใจถวงงาน กิจวัตรของกองทัพระสํ่าระสาย และงานบริหารราชการทั่วไปก็ยํ่าแย จนกวาการจัดสรรอํานาจใหมจะลงตัว"
  idea_SIA_military_wing_unrest: "ฝายทหารกอกบฏ"
  idea_SIA_military_wing_unrest_desc: "ความอดทนของเหลานายทหารหมดลงอีกครั้ง เมื่อยึดอํานาจโดยตรงไมสําเร็จ ฝายทหารจึงระบายความเกรี้ยวกราดผานการบอนทําลาย การหนีทัพ และการปฏิเสธความรวมมือโดยสิ้นเชิง กําลังรบของกองทัพพังทลายลงจนกวาผูไมพอใจจะถูกปราบใหสยบ"
  idea_SIA_civilian_wing_unrest: "ฝายพลเรือนกอกบฏ"
  idea_SIA_civilian_wing_unrest_desc: "ฝายของปรีดีหมดศรัทธาในรัฐบาลอีกครั้ง เมื่อไมไดรับโอกาสครั้งที่สองในการขึ้นสูอํานาจ ฝายพลเรือนจึงหันไปใชการนัดหยุดงาน การขัดขวางทางระบบราชการ และการปลุกระดมในเมือง เศรษฐกิจหยุดชะงักและประเทศแทบปกครองไมไดจนกวาอารมณจะเย็นลง"
  idea_SIA_unwavering_civilian_support: "การสนับสนุนจากฝายพลเรือนอยางไมหวั่นไหว"
  idea_SIA_unwavering_civilian_support_desc: "เมื่อฝายทหารถูกยุบและปญหาความชอบธรรมไดขอยุติ ฝายบริหารพลเรือนก็ไรผูทาทาย เมื่อพนจากการแทรกแซงของกองทัพ เหลาเทคโนแครตของปรีดีก็ทุมเทใหกับงานบริหารประเทศดวยความกระตือรือรนที่แนวรวมเดิมไมเคยรวบรวมได"
  idea_SIA_unified_khana_ratsadon: "คณะราษฎรที่เปนหนึ่งเดียว"
  idea_SIA_unified_khana_ratsadon_desc: "ความขัดแยงเการะหวางทหารกับพลเรือนสิ้นสุดลงแลว เมื่อทั้งสองฝายของคณะราษฎรมุงไปในทิศทางเดียวกันในที่สุด รัฐบาลก็สามารถดําเนินการดวยเอกภาพแหงเจตนารมณอยางที่ไมเคยมีมากอน ทหาร ขาราชการ และนักอุตสาหกรรม บัดนี้ทํางานรวมกันเปนหนึ่งเดียว"


