l_english:
 MEX_focus_national_bank: "ธนาคารแหงชาติ"
 MEX_focus_national_bank_desc: "ธนาคารแหงเม็กซิโก (Banco de México) กอตั้งขึ้นในป 1925 เพื่อฟนฟูเศรษฐกิจที่พังทลายจากสงครามกลางเมือง ทําหนาที่เปนผูใหกูแหลงสุดทาย ผูออกเงินตรา และผูลงทุนในกิจการทุกรูปแบบเพื่อประโยชนของรัฐ"
 MEX_focus_military_budget_review: "ทบทวนงบประมาณทหาร"
 MEX_focus_military_budget_review_desc: "กองทัพที่มีงบประมาณมหาศาลของระบอบดีอาซลมสลายลงเมื่อกองกําลังติดอาวุธฝายปฏิวัติเริ่มปลดปลอยเมืองตาง ๆ และตัดแหลงเงินทุน เราควรทบทวนการเงินของกองทัพเพื่อใหมั่นใจวาจะยืนหยัดไดยาวนานในยามสงคราม"
 tooltip_military_budget_review: "ทบทวนงบประมาณทหาร"
 MEX_focus_gulf_coast_naval_yards: "อูตอเรือชายฝงอาว"
 MEX_focus_gulf_coast_naval_yards_desc: "ชายฝงอาวเม็กซิโกของเราหันหนาสูยุโรปและชายฝงตะวันออกของสหรัฐอเมริกา ซึ่งเปนคูคาหลักของเรา อุตสาหกรรมนํ้ามันที่กําลังเติบโตจะไดประโยชนอยางมากจากการขยายอูตอเรือในเบรากรุซ"
 MEX_focus_pacific_coast_naval_yards: "อูตอเรือชายฝงแปซิฟก"
 MEX_focus_pacific_coast_naval_yards_desc: "การคาขามแปซิฟกกับญี่ปุนและแคลิฟอรเนียมีความสําคัญตอเรานอยกวาแอตแลนติก แตเราก็ควรปกปองผลประโยชนและเปดโอกาสใหม ๆ การขยายอูตอเรือฝงแปซิฟกจะทําใหเรามีทางเลือกมากขึ้นหากอาวเม็กซิโกถูกปดลอม"
 MEX_focus_brown_water_navy: "กองทัพเรือชายฝง"
 MEX_focus_brown_water_navy_desc: "เม็กซิโกยังพึ่งพาเรือรบลาสมัยจากยุคกอนมหาสงครามในการปกปองการคาใกลชายฝง เราพยายามซื้อเรือที่ทันสมัยกวาจากสเปนและมหาอํานาจอื่น ๆ แตความคืบหนาเปนไปอยางเชื่องชา เราตองพัฒนายุทธศาสตรทางทะเลไว เผื่อสงครามจะลุกลามไปทั่วยุโรปและลนมาถึงซีกโลกตะวันตก"
 tooltip_escort_ships: "เรือคุมกัน"
 MEX_focus_blue_water_navy: "กองทัพเรือทะเลลึก"
 MEX_focus_blue_water_navy_desc: "เม็กซิโกไมเคยเปนมหาอํานาจทางทะเล ในยุคอาณานิคม เจาอาณานิคมสเปนตองใชเรือทั้งหมดที่มีเพื่อเผชิญหนากับอังกฤษ ระหวางการตอสูเพื่อเอกราชและสงครามกลางเมืองที่ตามมา ความสนใจทั้งหมดของเราก็มุงอยูแตภายใน และหลังจากที่อเมริกาแซงหนาเราจนกลายเปนมหาอํานาจ ก็ไมมีประโยชนที่จะชวงชิงทองทะเลอีก แตบางทีในยุคอันปนปวนนี้ เม็กซิโกอาจจําเปนตองมีกองทัพเรือที่ทรงพลัง"
 tooltip_capital_ships: "เรือหลัก"
 MEX_focus_raiding_navy: "กองทัพเรือจูโจม"
 MEX_focus_raiding_navy_desc: "เราไมอาจหวังจะตามทันมหาอํานาจทางทะเลชั้นนําของโลกในการชวงชิงนานนํ้าดวยเรือประจัญบานและเรือบรรทุกเครื่องบิน เราควรมุงสกัดกั้นเรือลําเลียงพลของขาศึกกอนที่จะมาถึง เพื่อปกปองเม็กซิโกจากการรุกราน"
 MEX_focus_heroic_military_college: "วิทยาลัยการทหารวีรชน"
 MEX_focus_heroic_military_college_desc: "โรงเรียนนายรอย (Colegio Militar) กอตั้งขึ้นในป 1823 และไดรับสมัญญาเกียรติยศวา วีรชน (Heroico) หลังจากนักเรียนนายรอยหานายสูจนตัวตายกับนาวิกโยธินอเมริกันในสงครามเม็กซิโก-อเมริกา ป 1847 นักเรียนนายรอยนายที่หกหอตัวเองดวยธงชาติเม็กซิโกแลวกระโดดลงจากกําแพงเพื่อไมใหถูกจับ"
 tooltip_mexico_stability_hit_for_peacetime_expansion: "เรายังอยูในยามสงบ การขยายกองทัพจะไมเปนที่นิยมอยางยิ่ง!\n"
 MEX_focus_tank_workshops: "โรงงานรถถัง"
 MEX_focus_tank_workshops_desc: "TNCA ผูออกแบบอากาศยานของเรา เคยทดลองสรางยานรบหุมเกราะในชวงมหาสงคราม โดยสรางตนแบบตามแบบรถถังทรงขาวหลามตัดของอังกฤษ เราควรเริ่มการทดลองเหลานี้อีกครั้งและตั้งโรงงานรถถังขึ้น"
 MEX_focus_weapons_modernisation: "ปรับปรุงอาวุธใหทันสมัย"
 MEX_focus_weapons_modernisation_desc: "กอนการปฏิวัติ เม็กซิโกเคยมีอุตสาหกรรมอาวุธเบาที่ยอดเยี่ยม ดีอาซ จอมเผด็จการที่ถูกชิงชัง แมจะมีขอบกพรองมากมาย แตก็สนใจการพัฒนาอาวุธอยางจริงจัง การทดลองปนเล็กยาวอัตโนมัติในยุคดีอาซควรไดรับการศึกษาตอ"
 MEX_focus_aviation_workshops: "โรงงานการบิน"
 MEX_focus_aviation_workshops_desc: "TNCA ถูกพักงานเพราะขาดงบประมาณหลังการปฏิวัติ แตดวยอานุภาพการทําลายลางของอากาศยานที่เพิ่มขึ้นเรื่อย ๆ นับแตนั้น เราตองตามความกาวหนาดานการบินใหทัน"
 MEX_focus_military_aviation_specialists: "ผูเชี่ยวชาญการบินทหาร"
 MEX_focus_military_aviation_specialists_desc: "โรงเรียนชางผูเชี่ยวชาญการบินทหาร (Escuela Militar de Mecánicos Especialistas de Aviación) จะฝกบุคลากรดานเทคนิคที่มีทักษะเพื่อดูแลอากาศยานของเรา ยิ่งอากาศยานไดรับการบํารุงรักษาดีเทาใด นักบินก็ยิ่งมีเวลาอยูบนฟาเพื่อสั่งสมประสบการณมากขึ้นเทานั้น"
 MEX_focus_army_expansion_programme: "โครงการขยายกองทัพ"
 MEX_focus_army_expansion_programme_desc: "เม็กซิโกมีศักยภาพมหาศาลในการขยายกองทัพ ดวยโครงการสรางชาติของการปฏิวัติที่หลอมรวมมณฑลตาง ๆ ซึ่งตางคิดถึงแตผลประโยชนตนเองใหกลายเปนปตุภูมิเดียวกัน พลเมืองผูรักชาติของเราจะออกมาชวยเหลือรัฐเมื่อยามคับขัน"
 MEX_focus_heavy_artillery: "ปนใหญหนัก"
 MEX_focus_heavy_artillery_desc: "อานุภาพการทําลายลางของปนใหญสนามเปนสิ่งที่ปฏิเสธไมได มหาสงครามไดแสดงใหโลกเห็นวาปนใหญมีความสําคัญเพียงใดในการสนับสนุนการรุกและสลายการรุกของขาศึก เราตองพัฒนาปนใหญแบบดั้งเดิมของเรา"
 MEX_focus_aerial_artillery: "ปนใหญทางอากาศ"
 MEX_focus_aerial_artillery_desc: "เราเคยทดลองใชเครื่องบินทิ้งระเบิดโจมตีเปาหมาย 'ออน' ในชวงสงครามคริสเตโร และในการกบฏอีกหลายครั้งของเหลานายพลหัวแข็ง ฝายกบฏไมอาจชวงชิงนานฟาได การสนับสนุนจากเครื่องบินทิ้งระเบิดจึงเปนสิ่งจําเปนตอการปกปองรัฐเม็กซิโก"
 MEX_focus_agricultural_credit_bank: "ธนาคารสินเชื่อเกษตร"
 MEX_focus_agricultural_credit_bank_desc: "ธนาคารสินเชื่อเกษตร (Banco de Crédito Agricola) จะชวยเรงโครงการปฏิรูปที่ดินดวยการปลอยกูแกเกษตรกรในเอฆิโดเพื่อซื้อเครื่องจักรและสินคาทุนอื่น ๆ อัลแบรโต เฆ. ปานี ผูครํ่าหวอดในวงการการเงิน สามารถนําธนาคารแหงนี้และชวยใหเม็กซิโกขยายกําลังการผลิตได"
 MEX_focus_rural_infrastructure: "โครงสรางพื้นฐานชนบท"
 MEX_focus_rural_infrastructure_desc: "ระบบรถไฟในเม็กซิโกไดรับการขยายในยุคดีอาซ แตสวนใหญกระจุกตัวอยูในเมืองทางเหนือเพื่ออํานวยความสะดวกในการคากับอเมริกา เราควรขยายทางรถไฟลงไปทางใตใหมากขึ้น"
 MEX_focus_peripheral_infrastructure: "โครงสรางพื้นฐานชายขอบ"
 MEX_focus_peripheral_infrastructure_desc: "ภูมิภาคชนบทที่หางไกลที่สุดของเราแทบไมไดรับการพัฒนาโครงสรางพื้นฐานมาหลายทศวรรษ ยังมีเกษตรกรยังชีพที่ยากจนขนแคนอยูมากมาย ซึ่งจะพรอมเขาทํางานในโรงงานและรับการศึกษา หากเราขยายระบบถนนออกไป"
 MEX_focus_rural_schools: "โรงเรียนชนบท"
 MEX_focus_rural_schools_desc: "โรงเรียนคือที่ที่เราหลอหลอมชาวนาผูไมรูหนังสือใหกลายเปนพลเมืองผูรักชาติ พรอมตอสูกับความอยุติธรรมและเสริมความแข็งแกรงแกปตุภูมิ โรงเรียนชาวนาประจําภูมิภาค (Escuelas Regionales Campesinas) จะปฏิวัติชาวนา สอนทักษะทางเทคนิค และทําใหพวกเขาพึ่งพาตนเองได"
 MEX_focus_rent_freeze: "ตรึงคาเชา"
 MEX_focus_rent_freeze_desc: "แรงงานในเมืองเปนฐานเสียงสําคัญของเม็กซิโกใหมที่เรากําลังสราง พวกเขาถูกระดมเขาเปนกองพันแดงในชวงการปฏิวัติ และบัดนี้ตองการคาตอบแทนตามที่เคยไดรับสัญญาไว เรื่องเรงดวนประการหนึ่งคือเหลาเจาของที่ดินปรสิตที่รีดคาเชาจากผูสรางความมั่งคั่งที่ทํางานหนักเหลานี้"
 MEX_focus_confederation_of_mexican_workers: "สมาพันธแรงงานเม็กซิโก"
 MEX_focus_confederation_of_mexican_workers_desc: "ชนชั้นนําทางการเมืองในเม็กซิโกพยายามควบคุมกิจกรรมของสหภาพแรงงานมาโดยตลอด CTM จะเขามาแทนที่ CROM ซึ่งถูกมองวาฉอฉลและเสื่อมเสียชื่อเสียงจากความเกี่ยวพันกับอดีตผูนําของระบอบที่ไมเปนที่นิยม"
 MEX_focus_ejido_worker_militias: "กองกําลังอาสาแรงงานเอฆิโด"
 MEX_focus_ejido_worker_militias_desc: "การปฏิรูปที่ดินตามที่สัญญาไวในรัฐธรรมนูญป 1917 คืบหนาไปอยางเชื่องชา บอยครั้งที่เจาของที่ดินใชอันธพาลและกองกําลังสวนตัวขมขูผูเชาเพื่อขัดขวางการจัดสรรที่ดินใหม เราควรจัดตั้งชาวนา เกษตรกร และแรงงานเปนกองกําลังอาสาของชุมชน เพื่อปกปองผลสําเร็จที่เราไดมาในการตอสูกับความอยุติธรรม"
 MEX_focus_party_of_the_revolution: "พรรคแหงการปฏิวัติ"
 MEX_focus_party_of_the_revolution_desc: "ประธานาธิบดีการเดนัสไดรับเลือกตั้งดวยนโยบายปฏิรูปเกษตรกรรม ดวยการสนับสนุนจากองคกรแรงงานและชาวนา เราไดดําเนินการปฏิรูปแลว และบัดนี้เรามีชาติสังคมนิยมที่นาภาคภูมิใจ พรอมตอสูกับความอยุติธรรมบนเวทีโลก"
 MEX_focus_liberalize_the_banking_sector: "เปดเสรีภาคการธนาคาร"
 MEX_focus_liberalize_the_banking_sector_desc: "มีนโยบายรัฐบาลที่เขมงวดเกินเหตุมากมายที่ขัดขวางไมใหตลาดพลิกโฉมเม็กซิโก ตัวอยางเชน กฎหมายทั่วไปวาดวยสถาบันสินเชื่อป 1925 หามธนาคารถือหุนในธนาคารอื่น ไรสาระสิ้นดี! ตลาดยิ่งเสรี ประชาชนก็ยิ่งเสรี ลุยส มอนเตส เด โอกา ผูสนับสนุนเศรษฐศาสตรสํานักออสเตรีย จะชวยเราปฏิรูประบบธนาคาร"
 MEX_focus_strike_breaking: "สลายการนัดหยุดงาน"
 MEX_focus_strike_breaking_desc: "การรวมตัวเปนสหภาพแรงงานเปนสิทธิขั้นพื้นฐานที่รัฐธรรมนูญป 1917 คุมครองไว แตการทําลายทรัพยสินเปนความผิดอาญาและตองไดรับการปฏิบัติเชนนั้น การหยุดงานในอุตสาหกรรมสําคัญในยามวิกฤตอาจถูกมองวาเปนการทรยศชาติดวยซํ้า"
 MEX_focus_urban_development: "พัฒนาเมือง"
 MEX_focus_urban_development_desc: "เมืองคือศูนยกลางของกิจกรรมทางเศรษฐกิจ ความตองการของเมืองจึงตองมากอนรัฐชนบทที่ลาหลัง เราจะสรางระบบถนนและทางรถไฟในเม็กซิโกซิตีและเขตเมืองใหญอื่น ๆ ซึ่งจะทําใหความมั่งคั่งของเม็กซิโกเพิ่มพูนยิ่งขึ้น"
 MEX_focus_cientifico_camarilla: "กลุมเซียนติฟโก"
 MEX_focus_cientifico_camarilla_desc: "ระบอบดีอาซไดรับการสนับสนุนจากกลุมเทคโนแครตในคณะรัฐมนตรีและภาคธุรกิจเอกชน ระบบอุปถัมภและการเลนพรรคเลนพวกที่ไมเปนที่นิยมซึ่งพวกเขาสรางขึ้นเปนสาเหตุหนึ่งที่ทําใหระบอบลมสลาย อยางไรก็ตาม เรามีความรักและการสนับสนุนจากประชาชน และเหลาเซียนติฟโกก็มีทักษะบางอยางที่เราตองการอยางยิ่ง..."
 MEX_focus_end_land_reform: "ยุติการปฏิรูปที่ดิน"
 MEX_focus_end_land_reform_desc: "โครงการปฏิรูปที่ดินถูกผูมีอิทธิพลทองถิ่นที่มีเสนสายทางการเมืองหรืออํานาจทางทหารใชในทางมิชอบมานาน เกษตรกรผูมั่งคั่งที่ฮุบที่ดินสาธารณะเพื่อประโยชนสวนตัวไมไดชวยใหเม็กซิโกเขมแข็งหรือเปนปกแผนขึ้นเลย ที่ดินเหลานั้นควรขายใหผูเสนอราคาสูงสุดแทน เจาของที่ดินบางรายอาจกดขี่ผูเชาจริง แตนั่นเปนเรื่องของศาล"
 MEX_focus_privatization: "แปรรูปเปนของเอกชน"
 MEX_focus_privatization_desc: "ระบบเอฆิโดจํากัดการใชที่ดินตามวัตถุประสงคที่รัฐบาลกําหนด เหตุใดรัฐจึงตองบังคับใหเกษตรกรทําการเกษตรแบบยังชีพ แทนที่จะปลูกพืชเศรษฐกิจเพื่อสงออก? เราจะทําใหเม็กซิโกมั่งคั่งขึ้นไดหากแยกสลายฟารมรวมและปลอยใหเกิดการพัฒนาที่แทจริง แนวคิดการพึ่งพาตนเองที่ลาสมัยมีแตจะขวางทางความกาวหนาและโลกาภิวัตน"
 MEX_focus_caudillo_private_armies: "กองทัพสวนตัวของเหลาเกาดิโย"
 MEX_focus_caudillo_private_armies_desc: "ผูวาการ นักธุรกิจ และผูบัญชาการกองรักษาการณในแตละภูมิภาคมักเปนคนคนเดียวกัน นั่นคือนายพลฝายปฏิวัติที่สั่งสมอํานาจดวยการแตงตั้งลูกนองผูภักดีใหดํารงตําแหนงที่มีอิทธิพล เหลาเกาดิโยเปนความจริงที่เราควรบมเพาะ ไมใชตอสูดวย"
 MEX_focus_support_general_cedillo: "สนับสนุนนายพลเซดิโย"
 MEX_focus_support_general_cedillo_desc: "นายพลซาตูรนิโน เซดิโย แหงภาคเหนือ และเหลาเกาดิโยคนอื่น ๆ เชนเขา ตองการคํามั่นวารัฐบาลจะเคารพอํานาจปกครองตนเองของพวกเขา การรวมศูนยอํานาจอยางรวดเร็วภายใตประธานาธิบดีกาเยสและการเดนัสทําใหเราทุมกําลังมหาศาลแกปญหาของชาติไดแลว จึงไมจําเปนตองริบอํานาจของเหลาเกาดิโยอีก"
 tooltip_mexico_cedillo_will_be_placated: "นายพลเซดิโยจะ§Gพึงพอใจ§!\n"
 MEX_focus_oil_field_expansion: "ขยายแหลงนํ้ามัน"
 MEX_focus_oil_field_expansion_desc: "ความตองการนํ้ามันของอเมริกาไมมีวันสิ้นสุด แมจะผลิตนํ้ามันสวนใหญของโลก แตพวกเขาก็ยังนําเขาทรัพยากรนี้อีกดวย เม็กซิโกมีแหลงนํ้ามันที่ยังไมไดพัฒนาอยูตลอดแนวชายฝงอาว ซึ่งเราสามารถขุดเจาะเพื่อสงออกได"
 MEX_focus_northern_steel_plants: "โรงงานเหล็กกลาภาคเหนือ"
 MEX_focus_northern_steel_plants_desc: "ภูมิภาคที่เปนอุตสาหกรรมมากที่สุดของเม็กซิโกนอกเหนือจากเมืองหลวงคือแนวชายแดนทางเหนือที่ติดกับอเมริกา เมืองริมแมนํ้ารีโอแกรนดอยางมาตาโมรอสและซิวดัดฮัวเรซมีความผูกพันทางเศรษฐกิจอยางใกลชิดกับเมืองฝงตรงขามชายแดน เชน บราวนสวิลลและเอลแพโซ เราควรใชประโยชนจากโครงสรางพื้นฐานที่เหนือกวาในพื้นที่นี้เพื่อพัฒนาอุตสาหกรรมหนักใหกาวหนายิ่งขึ้น"
 MEX_focus_capital_reserves: "ทุนสํารอง"
 MEX_focus_capital_reserves_desc: "เงินสดที่เราไดจากการขายนํ้ามันทําใหเราแสดงพลังทางเศรษฐกิจได ตัวอยางเชน หากเราตองการซื้อเทคโนโลยีจากอเมริกาหรือสหราชอาณาจักร บัดนี้เราก็มีกําลังทรัพยพอ เราสามารถทําวิศวกรรมยอนกลับหรือผลิตแบบเหลานี้จํานวนมากไดตามที่เห็นสมควร"
 MEX_focus_oil_revenue_reinvestment: "นํารายไดจากนํ้ามันไปลงทุนตอ"
 MEX_focus_oil_revenue_reinvestment_desc: "เมื่อเราไดประโยชนจากการขายนํ้ามันมากขึ้น งบประมาณของเราก็เพิ่มขึ้นอยางรวดเร็ว และเราตองวางแผนใชเงินทุนใหมนี้ใหเกิดประโยชน เพื่อใหไดผลในระยะยาว การนํารายไดเหลานั้นไปลงทุนกระตุนเศรษฐกิจดูจะเปนทางเลือกที่ชัดเจนที่สุด"
 MEX_focus_royal_dutch_shell: "รอยัล ดัตช เชลล"
 MEX_focus_royal_dutch_shell_desc: "รอยัล ดัตช เชลล เปนบริษัทของอังกฤษและดัตชที่ถือสัมปทานนํ้ามันในเม็กซิโกถึง 60% ดวยการประนีประนอมกับบริษัทนํ้ามันตางชาติในเรื่องขอพิพาทแรงงาน เราสามารถบรรลุขอตกลงที่เปนประโยชนตอทั้งสองฝายได"
 MEX_focus_community_of_nations: "ประชาคมแหงชาติ"
 MEX_focus_community_of_nations_desc: "การที่เศรษฐกิจของเราพึ่งพาการคากับอังกฤษไมจําเปนตองเปนคําสาป ดวยการยอมรับสถานะเดิม เราสามารถดําเนินการทูตระหวางประเทศโดยมีมหาอํานาจหนุนหลัง"
 anglo_mexican_diplomacy: "การทูตอังกฤษ-เม็กซิโก"
 MEX_focus_purchase_belize: "ซื้อเบลีซ"
 MEX_focus_purchase_belize_desc: "ดินแดนเล็ก ๆ แหงนี้ถูกราชบัลลังกสเปนอางสิทธิ์มายาวนานตั้งแตยุคอาณานิคม แมจะไมเคยมีชาวสเปนโดยกําเนิดเขาไปตั้งถิ่นฐานเลยก็ตาม หลังจากสเปนสูญเสียจักรวรรดิอาณานิคมในชวงสงครามนโปเลียน อังกฤษก็คอย ๆ กระชับอํานาจเหนือดินแดนนี้ จนสถาปนาเปนอาณานิคมบริติชฮอนดูรัสในป 1862 ดินแดนนี้ควรถูกสงมอบคืนใหเม็กซิโกเพื่อแสดงเจตนาดี"
 MEX_focus_nationalize_the_oil_fields: "โอนแหลงนํ้ามันเปนของรัฐ"
 MEX_focus_nationalize_the_oil_fields_desc: "สัมปทานนํ้ามันของตางชาติกําลังครอบงําเศรษฐกิจเม็กซิโกและมีอิทธิพลเหนือกิจการของเรามากเกินไป ทั้งกิจการภายในและตางประเทศ อังกฤษและอเมริกาใสใจรอยัล ดัตช เชลล และสแตนดารดออยลมากกวารัฐบาลของเราเสียอีก!"
 tooltip_mexico_they_may_declare_war: "§Rเจาพอนํ้ามันอาจโนมนาวใหพวกเขาประกาศสงคราม!§!\n"
 MEX_focus_german_resource_exchange: "แลกเปลี่ยนทรัพยากรกับเยอรมนี"
 MEX_focus_german_resource_exchange_desc: "เครื่องจักรสงครามของเยอรมนีกําลังกลับมาเดินเครื่องอีกครั้ง และตองการนํ้ามันจากเม็กซิโกเพื่อใหทํางานไดเต็มที่ แทนที่จะกมหัวใหอเมริกาหรือขายประเทศใหรัสเซีย เราสามารถใชประโยชนจากความตองการนํ้ามันของเยอรมนีเพื่อเสริมแสนยานุภาพทางทหารของเรา"
 mexico_german_resource_exchange: "การแลกเปลี่ยนทรัพยากรเม็กซิโก-เยอรมนี"
 MEX_focus_new_world_order: "ระเบียบโลกใหม"
 MEX_focus_new_world_order_desc: "เยอรมนีคือผูเปนนายแหงยุโรปอยางชัดเจน เรายอมมีที่ยืนในระเบียบโลกใหมของพวกเขาแนนอน หากเราชวยพวกเขาตอตานอังกฤษและอเมริกา โทรเลขซิมเมอรมันนในอดีตถูกสงมาดวยเหตุผล: อเมริกาจะถูกทําลายไดก็ดวยการรุกรานทางบกเทานั้น..."
 german_mexican_diplomacy: "การทูตเยอรมนี-เม็กซิโก"
 MEX_focus_oppose_yanqui_imperialism: "ตอตานจักรวรรดินิยมแยงกี"
 MEX_focus_oppose_yanqui_imperialism_desc: "เมื่อเราทวงคืนทรัพยากรธรรมชาติของประเทศมาอยางชอบธรรมแลว ชาวตางชาติก็พากันเรียกรองคาชดเชย แตสัมปทานเหลานั้นแทจริงแลวถูกขโมยไปจากประชาชนเม็กซิโกในยามที่ออนแอภายใตจอมเผด็จการดีอาซ เหตุใดเราตองจายเงินใหโจรเพียงเพราะเอาของที่ถูกขโมยไปคืนมา?"
 MEX_focus_international_proletarianism: "สากลนิยมกรรมาชีพ"
 MEX_focus_international_proletarianism_desc: "โซเวียตไดพิสูจนแลววาสังคมนิยมของพวกเขาจะพลิกโฉมโลก การปฏิวัติที่เราตอสูมาอยางยากลําบากเปนเพียงกาวหนึ่งบนเสนทางสูการปลดปลอยประชาชน เริ่มจากประชาชนเม็กซิโก และบัดนี้คือประชาชนทั่วโลก"
 russo_mexican_diplomacy: "การทูตรัสเซีย-เม็กซิโก"
 MEX_focus_interior_defence_plan: "แผนปองกันภายในประเทศ"
 MEX_focus_interior_defence_plan_desc: "จริงอยูที่พวกแยงกีไดเปรียบเราทั้งดานจํานวนและเทคโนโลยี แตเรารูจักภูมิประเทศ ไดรับการสนับสนุนจากประชาชน และมีทั้งเวลาและพื้นที่ในการสรางแนวปองกันที่แข็งแกรง เราจะทําใหขาศึกเลือดตกยางออกในทะเลทรายและเทือกเขา ดวยยุทธวิธีตีแลวหนี การปองกันเชิงลึก และที่มั่นลับ"
 MEX_focus_compensation: "คาชดเชย"
 MEX_focus_compensation_desc: "สัมปทานนํ้ามันถูกขายใหรอยัล ดัตช เชลล และสแตนดารดออยลอยางถูกกฎหมาย เราไมอาจกลาวโทษบริษัทตางชาติที่แสวงหากําไรได เราควรรักษาความนาเชื่อถือของระบบกฎหมายดวยการจายคาชดเชยแกชาวตางชาติสําหรับการโอนสัมปทานเปนของรัฐ"
 MEX_focus_liberty_and_justice_for_all: "เสรีภาพและความยุติธรรมสําหรับทุกคน"
 MEX_focus_liberty_and_justice_for_all_desc: "บัดนี้อเมริกาคือมหาอํานาจทางเศรษฐกิจที่ยิ่งใหญที่สุดในประวัติศาสตร โซเวียตอาจกําลังสรางอุตสาหกรรมอยางรวดเร็ว และเยอรมนีอาจเขาใจสงครามดีกวา แตขอไดเปรียบของอเมริกายังเสริมดวยการยึดมั่นในเสรีภาพของปจเจกบุคคลและการพึ่งพาสถาบันมากกวากําลังดิบเถื่อน การขยายความสัมพันธทางเศรษฐกิจไปสูการเปนพันธมิตรทางทหารจึงเปนเรื่องธรรมชาติ"
 american_mexican_diplomacy: "การทูตอเมริกา-เม็กซิโก"
 MEX_focus_aztec_eagles: "อินทรีแอซเท็ก"
 MEX_focus_aztec_eagles_desc: "เราเปนหนึ่งในชาติที่มีอิทธิพลมากที่สุดในละตินอเมริกา เราควรแสดงความมุงมั่นตอความมั่นคงของโลกดวยการชวยอเมริกาตอสูกับพวกกระหายสงครามตางชาติที่คุกคามสันติภาพดวยการขยายดินแดน"
 aztec_eagles_opinion: "อินทรีแอซเท็ก"
 MEX_focus_international_peacekeepers: "ผูรักษาสันติภาพนานาชาติ"
 MEX_focus_international_peacekeepers_desc: "มหาอํานาจประชาธิปไตยของโลกวางแผนจะกอตั้งพันธมิตรของชาติที่เทาเทียมกัน คือสหประชาชาติ เพื่อรักษาความมั่นคงระหวางประเทศ โดยเปนเวทีใหประเทศตาง ๆ ไดประนีประนอมความเห็นตางและไกลเกลี่ยขอพิพาท เราจะทุมเทใหกับโครงการนี้เพื่อชวยใหชาติละตินอเมริการักษาเอกราชไวได"
 MEX_focus_march_southwards: "เดินทัพลงใต"
 MEX_focus_march_southwards_desc: "เม็กซิโกสูญเสียมณฑลทางใตหลังการตอสูเพื่อเอกราช จักรวรรดิเม็กซิโกที่ไรความสามารถเปนรอยดางในประวัติศาสตรของเรา แตเราสามารถแกไขความผิดพลาดนั้นได รัฐทางใตมีความสําคัญยิ่งตอการปองกันของเรา และเราจะทวงคืนมา"
 threat_mexico_marching_southwards: "เม็กซิโกเดินทัพลงใต"
 MEX_focus_unify_centroamerica: "รวมอเมริกากลาง"
 MEX_focus_unify_centroamerica_desc: "สาธารณรัฐกลวยหอมเล็ก ๆ อยางนิการากัว ปานามา และคอสตาริกา เล็กเกินกวาจะเปนประเทศที่อยูรอดได เราตองผนวกพวกเขาเขามาเปนสวนหนึ่งของชาติเรา และนําเกียรติยศมาสูเม็กซิโกและชาวเม็กซิกัน"
 threat_mexico_unify_centroamerica: "เม็กซิโกมุงรวมอเมริกากลาง"
 MEX_focus_push_past_the_darien_gap: "บุกผานชองดาริเอน"
 MEX_focus_push_past_the_darien_gap_desc: "หลังการรณรงครวมอเมริกากลาง บัดนี้เราตองบุกฝาปาทึบระหวางปานามากับโคลอมเบียที่เรียกวา 'ชองดาริเอน' เพื่อเหยียบแผนดินอเมริกาใต"
 threat_mexico_push_south_of_the_darien_gap: "ภัยคุกคามจากเม็กซิโกทางใตของชองดาริเอน"
 MEX_focus_andean_offensive: "การรุกแอนดีส"
 MEX_focus_andean_offensive_desc: "เมื่อเราตั้งมั่นทางเหนือของเทือกเขาแอนดีสไดแลว ชะตากรรมของเราคือรุกตอไปผานภูมิประเทศอันยากลําบากของเทือกเขาเขตรอน และรวมละตินอเมริกาใหสําเร็จ"
 threat_mexico_andean_offensive: "ภัยคุกคามจากเม็กซิโกตอรัฐแอนดีส"
 MEX_focus_seize_the_panama_canal: "ยึดคลองปานามา"
 MEX_focus_seize_the_panama_canal_desc: "คลองนี้เปนหนึ่งในชองแคบยุทธศาสตรที่สําคัญที่สุดของโลก ถูกขุดขึ้นดวยราคาแพงลิบของแรงงานลาตินที่หลั่งเลือดและลมตายใตแสของอเมริกาเพื่อผลกําไรของนายทุนอุตสาหกรรม เมื่อยึดพื้นที่โดยรอบไดแลว เราสามารถโจมตีสายฟาแลบใสกองรักษาการณเล็ก ๆ ของคลอง บีบใหพวกแยงกีตองเลือกระหวางทําสงครามนองเลือดกับเรา หรือยอมสงมอบการควบคุมคลอง"
 MEX_focus_fortify_the_canal: "เสริมปอมคลอง"
 MEX_focus_fortify_the_canal_desc: "เมื่อคลองปานามาตกอยูในมือเราในที่สุด เราตองรักษาประตูนํ้าและตลิ่งของคลองใหมั่นคง เพื่อใหกลายเปนปอมปราการที่ไมมีใครตีแตก"
 MEX_focus_integrate_the_south: "ผนวกรวมภาคใต"
 MEX_focus_integrate_the_south_desc: "การหลอมรวมประชาชนเม็กซิโกเปนกระบวนการที่เชื่องชา แตจะไมหยุดอยูแคพรมแดนภูมิภาคหรือเทือกเขา เราเคยขามผานอุปสรรคเชนนี้มาแลวในอดีต และเราจะทําอีกครั้งสําหรับมณฑลทางใต"
 MEX_focus_plan_of_agua_prieta: "แผนอากวาปรีเอตา"
 MEX_focus_plan_of_agua_prieta_desc: "การปฏิวัติตอตานดีอาซและการหํ้าหั่นกันเองอยางโหดรายที่ตามมากินเวลาถึงหนึ่งทศวรรษ เมื่อฝุนควันจางลง เหลานายพลฝายเหนือผูมีชัยไดประชุมกันที่อากวาปรีเอตา รัฐโซโนรา เพื่อวางแผนอนาคตของเม็กซิโก พวกเขาคือกลุมประชานิยมผูปฏิรูปใหทันสมัยและแยกศาสนาออกจากรัฐ หรือไมก็เปน 'สมาพันธของเหลากาซิเก' ที่ไมตางจากหัวหนาโจรแบงของโจรกัน แลวแตวาจะมองจากมุมไหน"
 MEX_focus_exile_calles: "เนรเทศกาเยส"
 MEX_focus_exile_calles_desc: "อดีตประธานาธิบดีปลูตารโก กาเยส ดํารงตําแหนงระหวางป 1924 ถึง 1928 การปกครองที่ผิดพลาดของเขาจุดชนวนสงครามคริสเตโรและการกบฏยอยนับไมถวน บัดนี้เขาพยายามครอบงําประธานาธิบดีการเดนัสเหมือนที่เคยชักใยประธานาธิบดีหุนเชิดไมกี่คนกอนหนา การเดนัสมีอาณัติจากประชาชนและแผนอนาคตของตนเอง กาเยสจึงตองออกไปเพื่อเสถียรภาพของเม็กซิโก"
 MEX_focus_institutional_revolution: "การปฏิวัติเชิงสถาบัน"
 MEX_focus_institutional_revolution_desc: "มรดกทางประชาธิปไตยในเม็กซิโกยังออนแอ แตเราไดเสริมความเขมแข็งใหแลว ความมุงมั่นตอหลักนิติธรรมของเรากําลังกาวหนา และประชาชนเริ่มไววางใจการเลือกตั้งของเรา ซึ่งในอดีตเคยถูกรัฐบาลบิดเบือน"
 MEX_focus_jefe_maximo: "เฆเฟมักซิโม"
 MEX_focus_jefe_maximo_desc: "เม็กซิโกจะดิ่งลึกสูความโกลาหลยิ่งขึ้นหากปลูตารโก กาเยส สูญเสียอิทธิพลเหนือประเทศ เขาคือผูสรางรัฐบาลของปอรเตส ออรติซ โรดรีเกซ และบัดนี้คือการเดนัส ศัตรูทางการเมืองของเขาประณามวาเขาเปน 'เฆเฟมักซิโม' ราวกับหัวหนาโจร! แทจริงแลว กาเยสเปนเพียงรัฐบุรุษสูงวัยที่มีแตเจตนาดีตอเม็กซิโก การสูญเสียเขาในขั้นนี้ของการปฏิวัติจะเปนเรื่องนาอดสู"
 MEX_focus_purge_the_bureaucracy: "กวาดลางระบบราชการ"
 MEX_focus_purge_the_bureaucracy_desc: "พวกกาเยสิสตากําลังถูกปลดออกจากตําแหนงที่มีอิทธิพลซึ่งพวกเขาไมควรได เรามีผูที่เหมาะสมจะมาแทนอยูในใจมากมาย บุคคลที่มีความสามารถและสติปญญาซึ่งจะสํานึกในโอกาสที่ไดรับใชเม็กซิโก..."
 MEX_focus_arrest_general_cedillo: "จับกุมนายพลเซดิโย"
 MEX_focus_arrest_general_cedillo_desc: "เหลาเกาดิโยเปนภัยคุกคาม พวกเขาแบงเม็กซิโกออกเปนศักดินาเล็ก ๆ ที่การแตงตั้งเจาหนาที่ทําใหพวกเขามีอํานาจเหนือเศรษฐกิจ กองทัพ และการปกครอง พวกเขากําลังปลนความมั่งคั่งของเม็กซิโก และไมมีที่ใดชัดเจนไปกวามณฑลของนายพลซาตูรนิโน เซดิโย ความเปนอิสระจากรัฐบาลกลางของเขาเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง และกบฏที่เขากําลังรวบรวมก็จะชวยอะไรเขาไมได"
 tooltip_mexico_cedillo_will_be_neutralised: "นายพลเซดิโยจะถูก§Gกําจัด§!\n"
 MEX_focus_control_the_army: "ควบคุมกองทัพ"
 MEX_focus_control_the_army_desc: "กองทัพอาจเปนฐานอํานาจที่สําคัญที่สุดในเม็กซิโก ยี่สิบปที่ผานมาแสดงใหเห็นวาเจตจํานงของประชาชนจะบังคับใชไดดวยดาบปลายปนเทานั้น นายพลนอกคอกจึงเปนภัยคุกคามตอการดํารงอยูของรัฐ ไมตองพูดถึงความชอบธรรมของรัฐ"
 MEX_focus_repeal_the_calles_law: "ยกเลิกกฎหมายกาเยส"
 MEX_focus_repeal_the_calles_law_desc: "กาเยสยุยงใหพวกคริสเตโรลุกฮือดวยการบังคับใชมาตราตอตานศาสนาในรัฐธรรมนูญอยางแข็งกราว กฎหมายกาเยสเหยียดหยามนักบวชดวยการหามสวมชุดนักบวชในที่สาธารณะ และจําคุกผูนําศาสนาที่วิจารณรัฐบาล เราเห็นดวยวาอิทธิพลทางการเมืองของศาสนจักรจําเปนตองถูกจํากัด แตนี่คือการโจมตีเสรีภาพของปจเจกบุคคล ไมใชอํานาจของศาสนจักร"
 MEX_focus_abolish_capital_punishment: "ยกเลิกโทษประหารชีวิต"
 MEX_focus_abolish_capital_punishment_desc: "ความไมสงบในชวงหลัง ทั้งการกบฏของทหาร การลุกฮือของชาวนา และสงครามคริสเตโร รวมถึงการตอบโตอยางนองเลือดของรัฐบาลตอเหตุการณเหลานี้และตอ 'อาชญากรรม' เล็กนอย ไดสรางบรรยากาศแหงความหวาดกลัวไปทั่วเม็กซิโก ผูคนไมกลาพูดอยางเสรีเพราะกลัวถูกรัฐกดขี่ เราควรคอย ๆ ยกเลิกโทษประหารชีวิต เมื่อเราคลายการควบคุมลง ผูคนก็จะไมรูสึกวาตองหลบหนีอีกตอไป"
 MEX_focus_enforce_the_calles_law: "บังคับใชกฎหมายกาเยส"
 MEX_focus_enforce_the_calles_law_desc: "ไพรพลคริสเตโรอาจไมถูกทําลายในสนามรบ แตในชวงหลายปหลังการกบฏอันไรผลของพวกเขา เราไดไลลาผูนําที่เหลือและผูเห็นใจในศาสนจักร ตัดหัวขบวนการและทําใหมั่นใจวาจะไมฟนคืนชีพ ศาสนจักรไมมีทางเลือกนอกจากยอมรับขอเรียกรองของเรา พวกเขาจะกลายเปนเครื่องมืออีกชิ้นของอํานาจรัฐ ไมเชนนั้นเราจะตัดหัวพวกเขาตอไป"
 MEX_focus_triumph_over_the_cristeros: "ชัยชนะเหนือคริสเตโร"
 MEX_focus_triumph_over_the_cristeros_desc: "บุคคลผูมีความสามารถมากมายไดกาวขึ้นสูจุดสูงสุดระหวางการปราบปรามคริสเตโร การตอสูกับฝายกบฏดวยยุทธวิธีหนวยเล็กและการสนับสนุนทางอากาศเปนโอกาสอันดีเยี่ยมใหนายพลของเราไดทดสอบความสามารถ การรณรงคปราบปรามยังทําใหเราเห็นวาใครมีใจพอจะทํางานสกปรก"
 MEX_focus_state_education: "การศึกษาของรัฐ"
 MEX_focus_state_education_desc: "การศึกษาแบบสังคมนิยมในเม็กซิโกหมายถึงการมุงเนนเหตุผลนิยมและความรักชาติ แทนการยึดถือหลักคําสอนและคําบัญชาของพระสันตะปาปา เราเพียงตองใหการศึกษาตอตานศาสนจักรที่ดีแกเยาวชนเม็กซิโกสักหนึ่งรุน แลวแรงสนับสนุนจากมวลชนของศาสนจักรจะหายไปในชั่วขามคืน ผูคนจะไมทนตอนักบวชปรสิตเมื่อรูวาโลกที่แตกตางนั้นเปนไปได"
 MEX_focus_xefo: "XEFO"
 MEX_focus_xefo_desc: "รัฐบาลไดสรางเสาวิทยุและตั้งสถานีทั่วประเทศ ซึ่งมีประโยชนในการเผยแพรโฆษณาชวนเชื่อ และยังทําใหชาวชนบทติดตอกันไดใกลชิดขึ้นดวย XEFO เปนหนึ่งในสถานีวิทยุเหลานั้น ดําเนินการโดยพรรคปฏิวัติแหงชาติ (Partido Nacional Revolucionario)"
 MEX_focus_law_on_industrial_promotion: "กฎหมายสงเสริมอุตสาหกรรม"
 MEX_focus_law_on_industrial_promotion_desc: "เปนเวลาหลายปที่รัฐตาง ๆ ของเม็กซิโกและรัฐบาลกลางพยายามสงเสริมการพัฒนาอุตสาหกรรมใหมดวยการยกเวนภาษี บอยครั้งที่กฎระเบียบทองถิ่นขัดกับผลประโยชนของชาติ โดยเบี่ยงเบนเงินทุนไปยังพื้นที่ที่ไมสําคัญหรือไรประสิทธิภาพ เราตองจัดระบบแนวทางพัฒนาอุตสาหกรรมใหสมเหตุสมผลดวยแผนแบบรวมศูนย"
 MEX_focus_nafinsa: "NAFINSA"
 MEX_focus_nafinsa_desc: "นาซิโอนัลฟนันซิเอรา (Nacional Financiera) เปนธนาคารเพื่อการพัฒนาที่ตั้งขึ้นเพื่อสงเสริมการสรางอุตสาหกรรมในเม็กซิโก มีบทบาทสําคัญเปนพิเศษในการสรางโรงงานใหมในรัฐภาคกลางของเม็กซิโก เชน โรงงานเคมีและโรงงานโลหะในเม็กซิโกซิตี"
 MEX_focus_engineering_school: "โรงเรียนวิศวกรรม"
 MEX_focus_engineering_school_desc: "โรงเรียนวิศวกรรมเครื่องกลและไฟฟาชั้นสูง (Escuela Superior de Ingenería Mecánica y Eléctrica) ซึ่งเปนสวนหนึ่งของสถาบันโปลีเทคนิคแหงชาติในเม็กซิโกซิตี กําลังฝกฝนผูบุกเบิกรุนใหมดานวิศวกรรมเครื่องกลและอิเล็กทรอนิกส"
 MEX_focus_television_innovators: "นักนวัตกรรมโทรทัศน"
 MEX_focus_television_innovators_desc: "เม็กซิโกมีอุตสาหกรรมอิเล็กทรอนิกสที่กาวหนาอยางนาประหลาดใจ กิเยรโม กอนซาเลซ กามาเรนา และสมาชิกคนอื่น ๆ ของ 'สมาคมทดลองวิทยุ' กําลังทดลองการสงสัญญาณโทรทัศนสี เราอาจกลายเปนผูนําโลกดานเทคโนโลยีการสื่อสาร หากเรามุงเนนพัฒนาการเหลานี้"
 MEX_focus_antidisestablishmentarianism: "ตอตานการแยกศาสนจักร"
 MEX_focus_antidisestablishmentarianism_desc: "ศรัทธาที่แทจริงถูกคณะผูปกครอง 'ปฏิวัติ' ยํ่ายีมานานหลายทศวรรษแลว โบสถ อาราม และที่เก็บพระธาตุลวนตกเปนของรัฐอยางเปนทางการ โดยนักบวชตองไดรับใบอนุญาตจากรัฐบาลจึงจะดูแลศาสนิกชนได บางรัฐมีบาทหลวงเพียงคนเดียวสําหรับผูศรัทธานับหมื่น เราควรยกเลิกขอกําหนดนี้และใหศาสนจักรถือครองทรัพยสินไดอีกครั้ง"
 MEX_focus_rewrite_the_constitution: "เขียนรัฐธรรมนูญป 1917 ใหม"
 MEX_focus_rewrite_the_constitution_desc: "รัฐธรรมนูญที่เขียนโดยเหลานายพลโหดรายวางรัฐไวเหนือศาสนจักร ทําใหการสมรสเปนนิติกรรมทางแพง หามนักบวชสนับสนุนผูสมัครทางการเมือง และไมยอมรับศาสนจักรคาทอลิกเปนแหลงที่มาของอํานาจทางศีลธรรมในเม็กซิโก เราตองแกไขความไมสอดคลองเหลานี้ดวยการสถาปนาศาสนาคาทอลิกเปนศาสนาประจําชาติอยางเปนทางการ"
 MEX_focus_legion_of_christ: "ทหารแหงพระคริสต"
 MEX_focus_legion_of_christ_desc: "เรากําลังแกไขความผิดของ 'การปฏิวัติ' ดวยจิตวิญญาณที่ไมรูจักเหน็ดเหนื่อยอันสมกับเปนผูรับใชของพระคริสต แตนี่เปนเพียงจุดเริ่มตน เราตองมีองคกรที่จะตามลาและลงโทษอาชญากรผูโจมตีศาสนจักรอันศักดิ์สิทธิ์ ดังที่กลาวไวในหนังสืออพยพ: ตาแทนตา ชีวิตแทนชีวิต"
 MEX_focus_crusade_against_atheism: "สงครามครูเสดตอตานอเทวนิยม"
 MEX_focus_crusade_against_atheism_desc: "ผูนําคริสเตโรสวนใหญถูกรัฐบาลไลลาและสังหารในชวงตนทศวรรษ 1930 อยางไรก็ตาม มีไมกี่คนที่รอดพนการกวาดลาง และพรอมจะนําผูศรัทธาแหงเม็กซิโกอีกครั้ง พระคริสตราชาจงทรงพระเจริญ และพระแมมารีแหงกัวดาลูเปผูไดรับพร!"
 MEX_focus_knights_of_columbus: "อัศวินแหงโคลัมบัส"
 MEX_focus_knights_of_columbus_desc: "ในชวงสงครามคริสเตโร ขณะที่ทั้งสองฝายตางกอการละเมิด ภราดรภาพนานาชาติอัศวินแหงโคลัมบัสไดเขามาชวยเหลือเรา ในตอนแรกพวกเขาแอบระดมเงินบริจาคเพื่อสนับสนุนและติดอาวุธใหคริสเตโร หลังจากบรรดาบิชอปเม็กซิโกปฏิเสธการกบฏ อัศวินก็ล็อบบี้รัฐบาลอเมริกาใหเปนเจาภาพการเจรจาซึ่งนําไปสูการยุติสงครามในที่สุด"
 MEX_focus_catholic_politics: "การเมืองคาทอลิก"
 MEX_focus_catholic_politics_desc: "พรรคการเมืองสวนใหญในเม็กซิโกถูกครอบงําโดยฝายตอตานศาสนจักรที่ขึ้นสูอํานาจหลังการปฏิวัติป 1911 หากพวกเราชาวคาทอลิกตองการยึดและรักษาอํานาจอยางถูกกฎหมาย ก็จําเปนตองกอตั้งพรรคของมวลชนผูศรัทธา"
 MEX_focus_social_catholicism: "คาทอลิกสังคม"
 MEX_focus_social_catholicism_desc: "คาทอลิกสังคมเปนหลักคําสอนศาสนาการเมืองที่มีมาตั้งแตตนทศวรรษ 1900 เนนการบรรเทาภาระของคนยากจนดวยการจัดการตนเหตุของความยากจน ความอยุติธรรมที่เกิดจากทุนนิยมอุตสาหกรรมอันไรการควบคุมตองการการตอบสนองที่เปนระบบจากศาสนจักร และนักบวชหัวกาวหนาแหงเม็กซิโกจะทําอยางดีที่สุดเพื่อแกไข"
 MEX_focus_church_schools: "โรงเรียนของศาสนจักร"
 MEX_focus_church_schools_desc: "เหลานายพลฝายปฏิวัติพยายามลางสมองเยาวชนในคายปรับทัศนคติแบบสังคมนิยมที่พวกเขาเรียกวาโรงเรียน เราตองนําศาสนากลับเขาสูหองเรียนอีกครั้ง โดยใหบาทหลวงและแมชีอบรมสั่งสอนลูกหลานของเรา"
 MEX_focus_triumph_of_synarchism: "ชัยชนะของลัทธิซินารคี"
 MEX_focus_triumph_of_synarchism_desc: "ศัตรูของเราพายแพอยางราบคาบ และกําลังซอนตัวอยูในเงามืดดุจสมุนของซาตาน บัดนี้เรามีอิสระที่จะฟนฟูรัฐในแบบที่จะรับประกันความเปนหนึ่งเดียวทั้งในศรัทธาและเจตจํานงทางการเมือง"
 MEX_focus_reform_the_cristero_guard: "ปฏิรูปกองรักษาการณคริสเตโร"
 MEX_focus_reform_the_cristero_guard_desc: "เหลาคริสเตโรปกปองศาสนจักรจากการกดขี่ของทรราชกาเยสอยางกลาหาญ และหลายคนไดสละชีพเปนมรณสักขีภายใตธงของพระคริสต บัดนี้เมื่ออํานาจของศาสนจักรอันศักดิ์สิทธิ์ไดรับการฟนฟูแลว พวกเขาตองไดรับการจัดระเบียบใหมเพื่อเปนผูพิทักษติดอาวุธของพระคริสต"
 tooltip_mexico_reform_the_cristero_guard: "ปฏิรูป§Yกองรักษาการณคริสเตโร§!:\nวาง§Y8 กองพล§! ของกองพัน§Yทหารราบ 10§! กองพัน พรอมหนวยสนับสนุน§Yปนใหญ§!"
 MEX_focus_synarchist_youth: "ยุวชนซินารคิสต"
 MEX_focus_synarchist_youth_desc: "เยาวชนคืออนาคตของชาติ หากไดรับการศึกษาอยางเหมาะสม พวกเขาจะกลายเปนตัวแทนแหงอุดมการณของเรา ไดแก ความเขมแข็ง ความภักดี และความศรัทธา"
 MEX_focus_synarchist_communes: "ชุมชนซินารคิสต"
 MEX_focus_synarchist_communes_desc: "เมื่อจิตใจของประชาชนไดรับการชวยใหพนจาก 'นักปฏิวัติ' และผูศรัทธาพากันหลั่งไหลกลับสูโบสถที่ไดรับการเสกใหม แผนเศรษฐกิจของเราก็สามารถนํามาปฏิบัติได หนวยการผลิตใหมจะชวยใหผูศรัทธาไดรับใชชาติและศาสนจักร พรอมกับสัมผัสความเปนหนึ่งเดียวทั้งในศรัทธาและจิตใจ"
 MEX_focus_revolutionary_women: "สตรีแหงการปฏิวัติ"
 MEX_focus_revolutionary_women_desc: "แมตามธรรมเนียมจะเกี่ยวของกับงานบาน แตสตรีในเม็กซิโกก็ทํางานในภาคอุตสาหกรรมมาหลายทศวรรษแลว อุตสาหกรรมยาสูบ กาแฟ และเสื้อผามักจางแรงงานหญิงเปนสวนใหญ แมจะกอใหเกิดความขัดแยงกับขบวนการสหภาพแรงงานที่ผูชายครอบงํา ผูชายมีสิทธิไดรับคาจางเทากันสําหรับงานเทากันและคาแรงขั้นตํ่าอยูแลว เราควรบังคับใชสิทธินี้กับสตรีดวย"
 MEX_focus_womens_suffrage: "สิทธิเลือกตั้งของสตรี"
 MEX_focus_womens_suffrage_desc: "สมาชิกสภาและรัฐมนตรีจํานวนมากในรัฐบาลฝายปฏิวัติคัดคานการขยายสิทธิเลือกตั้งใหสตรี เพราะเชื่อวาสตรีจะถูกโนมนาวโดยคําของนักบวชไดงายกวาและจะทําใหโครงการแยกศาสนาออกจากรัฐตองยุติลง ไมวาในอดีตจะเปนอยางไร เราไมอาจขวางทางความกาวหนา"
 MEX_focus_soldaderas: "โซลดาเดรา"
 MEX_focus_soldaderas_desc: "ทหารหญิงเปนสัญลักษณสําคัญของการปฏิวัติ พวกเธอสูรบในฐานะพลทหาร และบางคนไดเลื่อนเปนนายทหารชั้นผูนอย พวกเธอมีความสําคัญเปนพิเศษตอการสงกําลังบํารุงของกองทัพฝายปฏิวัติที่ขาดแคลนเสบียง"
 MEX_focus_ban_political_militias: "หามกองกําลังติดอาวุธทางการเมือง"
 MEX_focus_ban_political_militias_desc: "กองกําลังกึ่งทหารฝายซายและฝายขวาอางวาเปนผูรักชาติที่ตอสูกับคนขายชาติ แตแทจริงแลวพวกเขาเปนเบี้ยของมหาอํานาจตางชาติที่ตองการบอนทําลายเสถียรภาพของประเทศเพื่อเปาหมายชั่วราย รัฐบาลตองปราบปรามกองกําลังติดอาวุธฟาสซิสตและคอมมิวนิสต"
 MEX_focus_depoliticised_army: "กองทัพที่ปลอดการเมือง"
 MEX_focus_depoliticised_army_desc: "นายพลไมมีสิทธิในความจงรักภักดีของทหาร แหลงความชอบธรรมสูงสุดคือรัฐเม็กซิโก เราควรปองกันไมใหนายพลคิดกอกบฏ ดวยการหมุนเวียนพวกเขาไปตามมณฑลตาง ๆ เพื่อไมใหสรางเครือขายอุปถัมภหรือไดรับความภักดีสวนตัวจากทหาร"
 MEX_focus_professional_army: "วิทยาลัยการสงคราม (Escuela Superior de Guerra)"
 MEX_focus_professional_army_desc: "เราไมอาจพึ่งพาโซลดาเดราแบบเฉพาะกิจในการสงเสบียงใหทหารในสนามรบได เราตองมีคลังเสบียงและหนวยสงกําลังบํารุง ในวิทยาลัยการทหาร ผูบัญชาการและนายทหารของเราจะไดรับความรูทางทหารขั้นสูง ซึ่งจะชวยใหพวกเขาพัฒนาระบบเสบียงที่มีประสิทธิภาพ \nถึงตอนนี้ แมแตลาก็ยังดีกวาปลอยใหทหารหาเสบียงกันเอง"
 MEX_focus_legacy_of_revolution: "มรดกแหงการปฏิวัติ"
 MEX_focus_legacy_of_revolution_desc: "ผลสําเร็จของการปฏิวัติตองไดรับการปกปอง และคนขายชาติตองถูกถอนรากถอนโคน เหลานายพลอยูแถวหนาของการตอสูนี้ พวกเขาเห็นความยากลําบากที่รัฐบาลเผชิญในพื้นที่ทุกวัน เราควรใหอํานาจดุลยพินิจแกพวกเขามากขึ้นในการบังคับใชอํานาจรัฐ"
 MEX_focus_the_gold_shirts: "เสื้อทอง"
 MEX_focus_the_gold_shirts_desc: "นายพลนิโกลัส โรดรีเกซ การรัสโก กอตั้งกลุมเสื้อทองขึ้นในป 1933 เพื่อปราบพวกคอมมิวนิสตทรยศที่บอนทําลายรัฐบาล กลุมกึ่งทหารนี้ควรกลายเปนปกหนึ่งของรัฐบาล เพราะเปาหมายของพวกเขานายกยองและวิธีการของพวกเขาก็จําเปน"
 MEX_focus_revanchist_revolution: "การปฏิวัติแกแคน"
 MEX_focus_revanchist_revolution_desc: "ประชาชนเม็กซิโกถูกยํ่ายีจากการรุกรานของแยงกีและการแทรกซึมของคอมมิวนิสตมานาน แตเราไดกาวขามอุปสรรคตอความเปนปกแผนของชาติเหลานี้ และสรางรัฐที่เขมแข็งพรอมผูนําที่ทรงอํานาจ บัดนี้เราตองแกไขความอยุติธรรมที่เม็กซิโกตองทนทุกขในอดีต"
 trotsky_not_welcome_in_mexico: "บรรยากาศทางการเมืองไมเปนใจตอทรอตสกี"
 MEX_focus_the_red_shirts: "เสื้อแดง"
 MEX_focus_the_red_shirts_desc: "ผูวาการโตมัส การริโด กานาบัล กอตั้งกลุมเสื้อแดงขึ้นในป 1930 เพื่อปกปองการปฏิวัติจากศาสนจักรคาทอลิกและนักบวชหัวปฏิกิริยา การตามลาและทําลายศัตรูของประชาชนเปนเปาหมายอันมีคา เราจึงควรนํากลุมเสื้อแดงเขาสูกองทัพในบทบาทใดบทบาทหนึ่ง"
 MEX_focus_communist_revolution: "การปฏิวัติคอมมิวนิสต"
 MEX_focus_communist_revolution_desc: "การปฏิวัติตอตานดีอาซไดกลายเปนการปฏิวัติสังคมอยางแทจริง ซึ่งจะคลี่คลายความขัดแยงในตัวของทุนนิยมดวยการยกเลิกการผลิตเพื่อแลกเปลี่ยน และนําพาวิถีชีวิตแบบใหมมาสูประชาชน"
 MEX_focus_hispanic_culture: "วัฒนธรรมฮิสแปนิก"
 MEX_focus_hispanic_culture_desc: "ชาติตาง ๆ ในละตินอเมริกามีวัฒนธรรมที่เขมแข็ง หลอหลอมจากการพิชิตและการเอาตัวรอด การกบฏและการปกครองอยางเด็ดขาด วัฒนธรรมรวมของเราคือแหลงแหงความภาคภูมิใจและแสงนําทางสูความกาวหนาในอนาคต"
 MEX_focus_revolutionary_class_war: "สงครามชนชั้นปฏิวัติ"
 MEX_focus_revolutionary_class_war_desc: "มีเพียงชนชั้นกรรมาชีพที่ติดอาวุธและจัดตั้งเปนกองทัพชนชั้นเทานั้นที่จะปกปองและเผยแผอุดมการณแหงการปฏิวัติได"
 faction_mexico_4th_international: "สากลที่ 4"
 MEX_focus_smash_the_bureaucrats: "บดขยี้พวกขุนนางราชการ"
 MEX_focus_smash_the_bureaucrats_desc: "หลังการถึงแกอสัญกรรมของเลนิน ระบบราชการอันฉอฉลที่นําโดยสตาลินไดสรางระบอบแบบโบนาปารตขึ้นในสหภาพโซเวียต ชวงชิงอํานาจไปจากผูใชแรงงาน สหภาพโซเวียตจึงเสื่อมถอยกลายเปนรัฐกรรมกรที่เสื่อมทราม ซึ่งบิดเบือนอุดมการณแหงการปฏิวัติ"
 MEX_focus_liberate_the_antilles: "ปลดปลอยแอนทิลลีส"
 MEX_focus_liberate_the_antilles_desc: "หมูเกาะแคริบเบียนจํานวนมากยังคงถูกยึดครองโดยมหาอํานาจจักรวรรดินิยม ซึ่งยังคงขูดรีดอยางกดขี่ตอเนื่องมาตั้งแตการคนพบทวีปอเมริกา เราจะยุติความอยุติธรรมของลัทธิอาณานิคมไปตลอดกาล!"
 MEX_focus_one_world_government: "รัฐบาลโลกหนึ่งเดียว"
 MEX_focus_one_world_government_desc: "เมื่อทรราชยของสตาลินถูกกําจัดแลว เราสามารถโนมนาวผูสนับสนุนบางสวนของเขาใหวิจารณตนเองและเขารวมประชาคมของชาติที่หลุดพนจากการกดขี่ของฝายปฏิกิริยาอยางแทจริง"
 tooltip_socialist_marine_corps: "นาวิกโยธินสังคมนิยม"
 MEX_focus_international_struggle: "การตอสูระดับสากล"
 MEX_focus_international_struggle_desc: "เราไมไดโดดเดี่ยวในการตอสูกับศัตรูทางอุดมการณ เรามีพันธมิตรที่มีศักยภาพมากมายในตางแดนที่เราสามารถเชื่อมโยงดวย เราควรชวยพวกเขายึดอํานาจ เพื่อสรางกลุมพันธมิตรขนาดใหญที่จะกลับมาชวยเหลือเรา"
 MEX_focus_spanish_civil_war_refugees: "ผูลี้ภัยสงครามกลางเมืองสเปน"
 MEX_focus_spanish_civil_war_refugees_desc: "ไฟสงครามที่ลุกโชนในสเปนทําใหพลเมืองสเปนหลายหมื่นคนตองพลัดถิ่น หลายคนเปนหัวกะทิของปญญาชนสเปน หรือไมก็เปนบุคลากรดานเทคนิคที่มีทักษะสูง การใหที่ลี้ภัยแกพวกเขาเปนทั้งการทําหนาที่ดานมนุษยธรรมและเปนประโยชนตอเม็กซิโกไปพรอมกัน"
 tooltip_spanish_civil_war_technical_knowledge: "ความรูทางเทคนิคจากสงครามกลางเมืองสเปน"
 scw_over: "สงครามกลางเมืองสเปนสิ้นสุดลงแลว"
 MEX_focus_falangist_veterans: "ทหารผานศึกฟาลังเฆ"
 MEX_focus_falangist_veterans_desc: "ฟาลังเฆเปนองคกรกองกําลังกึ่งทหารฟาสซิสตในสเปน พวกเขาตอสูเพื่อพระเจาและชาติ แมหลายคนจะเปนพวกนิยมกษัตริยซึ่งนาเสียดาย ถึงกระนั้น เราควรติดตอกับทหารผานศึกฟาลังเฆจากสงครามกลางเมืองสเปนและเรียนรูจากประสบการณของพวกเขา"
 tooltip_falangist_veterans_doctrine_knowledge: "ความรูดานหลักนิยมจากทหารผานศึกฟาลังเฆ"
 falangist_veterans_opinion: "ทหารผานศึกฟาลังเฆ"
 MEX_focus_support_spains_loyalists: "สนับสนุนฝายนิยมสาธารณรัฐสเปน"
 MEX_focus_support_spains_loyalists_desc: "รัฐบาลสาธารณรัฐในสเปนไดรับเลือกตั้งมาตามระบอบประชาธิปไตย และบัดนี้ตองเผชิญการกบฏของพวกทรยศ 'ชาตินิยม' ที่แสวงหาเพียงอํานาจสวนตนและเกลียดชังสามัญชนชาวสเปนอยางชัดเจน เราควรสนับสนุนฝายนิยมสาธารณรัฐดวยการสงความชวยเหลือ และยืนหยัดเคียงขางพวกเขาในสันนิบาตชาติ ซึ่งกําลังพยายามควํ่าบาตรรัฐบาลสาธารณรัฐที่กําลังถูกรุมลอม"
 loyalist_spanish_government_support_opinion: "การสนับสนุนรัฐบาลสาธารณรัฐสเปน"
 MEX_focus_liberate_the_caribbean: "ปลดปลอยแคริบเบียน"
 MEX_focus_liberate_the_caribbean_desc: "เชนเดียวกับสวนอื่นของละตินอเมริกา รัฐในแคริบเบียนถูกจักรวรรดินิยมยุโรปขูดรีดอยางไรปรานีกอนจะสลัดพันธนาการออกได แมจะยังออนแอ รัฐเหลานี้ก็สมควรไดรับการคุมครองจากเรา ความภาคภูมิใจของชาติเม็กซิโกเรียกรองใหเรายึดครองแคริบเบียนไวเพื่อปองกันการขูดรีดจากจักรวรรดินิยม!"
 threat_mexico_pressure_the_caribbean: "ภัยคุกคามจากเม็กซิโกตอแคริบเบียน"
 MEX_focus_integrate_the_caribbean: "ผนวกรวมแคริบเบียน"
 MEX_focus_integrate_the_caribbean_desc: "สาธารณรัฐเล็ก ๆ แหงแคริบเบียนกําลังถูกหลอมรวมเขากับรัฐเม็กซิโก และบัดนี้ถึงคราวของประชาชนแหงแคริบเบียน พวกเขาจะกลายเปนพลเมืองเม็กซิโกผูภักดีเมื่อยึดถือขนบธรรมเนียมของเรา และในทางกลับกันก็จะไดรับประโยชนจากการเปนสวนหนึ่งของประชาคมแหงชาติเม็กซิโก"
 MEX_focus_hispanic_alliance: "พันธมิตรฮิสแปนิก"
 MEX_focus_hispanic_alliance_desc: "ผูปกครองของเราสืบเชื้อสายจากเปนินซูลาเรส ชาวอาณานิคมผูนําอารยธรรมมาสูโลกใหม สเปนซึ่งมีขนบอันเขมแข็งของอํานาจศาสนจักรและชนชั้นนําเจาที่ดินเคยเปนแหลงที่มาของความชอบธรรม แตทุกวันนี้สเปนดูไมเหมือนผูนําแหงโลกลาตินอีกตอไป เราตองรับบทบาทนี้ไวเอง และสรางสายสัมพันธที่แนนแฟนยิ่งขึ้นทั่วทวีป โดยใชความเปนฮิสแปนิกเปนรากฐาน"
 faction_mexico_hispanic_alliance: "พันธมิตรฮิสแปนิก"
 faction_mexico_synarchist_pact: "กติกาสัญญาซินารคิสต"
 MEX_focus_propaganda_pact: "กติกาสัญญาโฆษณาชวนเชื่อ"
 MEX_focus_propaganda_pact_desc: "ภัยคอมมิวนิสตทวีความนากลัวขึ้นทุกขณะในใจของผูรักชาติฮิสแปนิกผูศรัทธา ดวยพันธมิตรใหมของเรา เราจะตั้งกําแพงดาบปลายปนตานภัยรายบอลเชวิคอันแยบยล มาเดินสวนสนามแสดงความเปนหนึ่งเดียวและภราดรภาพตอหนาประชาชนเม็กซิโก เพื่อใหพวกเขามั่นใจในชัยชนะเบ็ดเสร็จเหนือศัตรูที่ชิงชัง!"
 MEX_focus_invite_brazil: "เชิญบราซิล"
 MEX_focus_invite_brazil_desc: "แมบราซิลในฐานะอดีตอาณานิคมของโปรตุเกสจะมีประวัติศาสตรไมตรงกับเม็กซิโกนัก แตในทางวัฒนธรรมพวกเขาก็ยังใกลชิดกับเรามากกวาจักรวรรดินิยมยุโรปที่กระหายการแกแคนหรือนักธุรกิจแยงกีผูละโมบ เราควรดึงพวกเขาเขามาใกลเขตอิทธิพลของเราเพื่อประโยชนจากการคุมครองซึ่งกันและกัน"
 MEX_focus_realpolitik: "การเมืองตามความเปนจริง"
 MEX_focus_realpolitik_desc: "เรามีความเชื่อมั่นทางอุดมการณ แตเม็กซิโกในฐานะรัฐยอมมีผลประโยชนของตนที่แยกจากการตอสูระดับสากล เราตองกาวเดินอยางระมัดระวังในยุคอันปนปวนขางหนา กาวพลาดเพียงครั้งเดียวอาจทําใหพวกจักรวรรดินิยมและทรราชที่หมายตาเราโถมกําลังทั้งหมดลงบนหัวเรา"
 MEX_focus_bolivarian_alliance: "พันธมิตรโบลิวาร"
 MEX_focus_bolivarian_alliance_desc: "ซิมอน โบลิวาร นําอาณานิคมสเปนในอเมริกาใตสูเอกราชและสรางกรันโคลอมเบียขึ้น เขาไดรับการยกยองในภาคใตไมตางจากนักสูเพื่อเอกราชอยางมิเกล อีดัลโก และมาเรียโน มาตาโมรอส ในเม็กซิโก หนึ่งในความฝนของเขาคือการรวมชาติละตินอเมริกาเพื่อตอตานการขูดรีดของจักรวรรดินิยมยุโรปและแยงกี เราสามารถทําใหความฝนนั้นเปนจริงได"
 faction_mexico_bolivarian_alliance: "พันธมิตรโบลิวาร"
 MEX_focus_coastal_defence_plan: "แผนปองกันชายฝง"
 MEX_focus_coastal_defence_plan_desc: "อเมริกาแสดงใหเราเห็นในป 1846 วา แมเราจะมีทะเลทรายและเทือกเขาเปนความลึกเชิงยุทธศาสตรทางเหนือ แตปกชายฝงของเรากลับเปราะบางตอการยกพลขึ้นบก เราควรเพิ่มแนวปองกันชายฝงใหกับทาเรือและเมืองตาง ๆ ทั้งฝงอาวและแปซิฟก"
 MEX_focus_rescind_the_mexican_cession: "ยกเลิกการยกดินแดนเม็กซิโก"
 MEX_focus_rescind_the_mexican_cession_desc: "ดินแดนกวางใหญที่สูญเสียใหผูรุกรานจากทางเหนือในป 1848 ยังคงยั่วยวนใจนักชาตินิยมเม็กซิโกบางกลุม ปจจุบันมีชาวฮิสแปนิกหลายลานคนอาศัยอยูในสหรัฐอเมริกา บางเปนลูกหลานของชาวเม็กซิโกดั้งเดิม บางเปนผูอพยพรุนหลัง เราควรกูเกียรติของเม็กซิโกคืนดวยการบดขยี้ผูรุกรานแยงกีและรวมประชาชนเม็กซิโกเปนหนึ่ง!"
 threat_mexico_rescind_cession: "เม็กซิโกยกเลิกการยกดินแดนใหอเมริกา"
 MEX_focus_redeem_aztlan: "กอบกูแอซแลน"
 MEX_focus_redeem_aztlan_desc: "ชาวเม็กซิโกที่อาศัยในดินแดนที่ไดรับการปลดปลอยจากสหรัฐอเมริกามีความฝนถึงรัฐบาลที่ไมกดขี่พวกเขาเพราะบรรพบุรุษ ถิ่นกําเนิด หรือภาษาที่ใชในบาน บัดนี้ความฝนนั้นไดกลายเปนความจริงแลว"
 ENG_parachute_regiments: "คลังกําลังสงทางอากาศ"
 ENG_parachute_regiments_desc: "หลังความสําเร็จของปฏิบัติการสงทางอากาศชวงแรกในดินแดนขาศึก เห็นไดชัดวากรมทหารพลรมคืออนาคต การจัดตั้งสถานที่ฝกและยุทโธปกรณเฉพาะทางจะชวยใหเรานําเทคโนโลยีใหมเหลานี้มาใชในยุทธศาสตรโดยรวม"
 ENG_special_air_service: "หนวยบริการทางอากาศพิเศษ"
 ENG_special_air_service_desc: "นายทหารผูหนึ่งชื่อเดวิด สเตอรลิง เสนอแนวคิดวาหนวยคอมมานโดขนาดเล็กอาจกอกวนขาศึกหลังแนวและสรางความเสียหายมหาศาลได การตั้งชื่อวา 'หนวยบริการทางอากาศ' ยังมีขอดีเพิ่มเติมคือทําใหขาศึกเชื่อวาตองปองกันพลรมดวย แนวคิดนี้อาจมีคุณคาไมนอย"
 ENG_chiefs_of_staff_committee: "คณะกรรมการเสนาธิการ"
 ENG_chiefs_of_staff_committee_desc: "เราตองมอบอํานาจใหผูบัญชาการเหลาทัพตาง ๆ ดําเนินสงครามครั้งนี้ตามที่เห็นสมควร คณะเสนาธิการรวมซึ่งกอตั้งขึ้นครั้งแรกในป 1923 จะไดรับเครื่องมือในการประสานปฏิบัติการทั่วโลก โดยรายงานตรงตอคณะรัฐมนตรีสงคราม ซึ่งจะทําใหการวางแผนปฏิบัติการทางทหารคลองตัวขึ้นอยางมาก"
 ENG_revisit_colonial_policy: "ทบทวนนโยบายอาณานิคม"
 ENG_revisit_colonial_policy_desc: "กาลเวลากําลังเปลี่ยนไป เปนที่ชัดเจนวาขบวนการเรียกรองเอกราชจะผุดขึ้นทั่วจักรวรรดิไมหยุด และจะแข็งแกรงขึ้นเรื่อย ๆ หากเราไมตองการถูกบีบใหทุมทรัพยากรมหาศาลขึ้นทุกทีเพื่อปราบปรามขบวนการเหลานี้ เราก็ตองยอมรับวาจักรวรรดิของเราไดมาถึงจุดสิ้นสุดแลว และตองปลอยใหแตละดินแดนหาเสนทางของตนเองในโลก"
 ENG_guide_the_colonies: "ชี้นําอาณานิคม"
 ENG_guide_the_colonies_desc: "การกาวแรกสูเอกราชเต็มรูปแบบหลังจากอยูใตการควบคุมของเรามายาวนานไมใชเรื่องงาย ดินแดนในปกครองตนเองของเราตองการความชวยเหลือในการปรับโครงสรางรัฐบาล เพื่อใหทํางานไดดีเมื่อเปนเอกราชโดยสมบูรณ เชนเดียวกับที่ทําไดในตอนนี้ภายใตการชี้นําของเรา"
 ENG_towards_dominion_independence: "สูเอกราชของดินแดนในปกครองตนเอง"
 ENG_towards_dominion_independence_desc: "เมื่อดูแลการปรับโครงสรางรัฐบาลของดินแดนในปกครองตนเองเรียบรอยแลว บัดนี้เราตองชวยพวกเขากาวขั้นสุดทายสูการตัดความสัมพันธอยางเปนทางการกับเวสตมินสเตอร เปนไปไดวาจะเกิดการยายถิ่นครั้งใหญ เมื่อผูที่ตองการเปนสวนหนึ่งของ[Root.GetNameDef]ตอไปพากันอพยพมา"
 ENG_foundations_for_an_indian_state: "รากฐานของรัฐอินเดีย"
 ENG_foundations_for_an_indian_state_desc: "หากอินเดียจะดํารงอยูไดในฐานะรัฐเอกราช เราตองดูแลการเพิ่มระดับอุตสาหกรรมของอินเดีย รวมถึงปรับโครงสรางรัฐบาลอยางถอนรากถอนโคน ความทาทายในการปกครองอนุทวีปทั้งหมดนั้นไมใชเรื่องงายดังที่เราไดเรียนรูมา และอินเดียตองเตรียมพรอมหากจะประสบความสําเร็จ"
 ENG_the_three_nation_solution: "ทางออกสามชาติ"
 ENG_the_three_nation_solution_desc: "ความแตกตางทางวัฒนธรรมและศาสนาทั่วอนุทวีปอินเดียนั้นรุนแรงยิ่ง ขณะนี้ก็มีความเปนปรปกษระหวางกลุมตาง ๆ ที่มีความภักดีแตกตางกันแลว แทนที่จะรวมทุกกลุมเขาเปนรัฐเดียว ทางออกที่ดีกวาอาจเปนการแบงอนุทวีปออกเปนสามรัฐ ไดแก อินเดียของชาวฮินดู ปากีสถานของชาวมุสลิมทางตะวันตกเฉียงเหนือ และบังกลาเทศของชาวมุสลิมทางตะวันออกเฉียงเหนือ"
 ENG_towards_indian_independence: "สูเอกราชของอินเดีย"
 ENG_towards_indian_independence_desc: "ถึงเวลาแลวที่จะนําอินเดียสูเสนทางแหงเอกราช เราจะเริ่มทยอยถายโอนภารกิจของรัฐบาล และเพิ่มอํานาจปกครองตนเองใหพวกเขาเพื่อเตรียมพรอมสูเอกราชเต็มรูปแบบ"
 ENG_withdraw_from_contested_territories: "ถอนตัวจากดินแดนพิพาท"
 ENG_withdraw_from_contested_territories_desc: "ดินแดนหลายแหงทั่วโลกที่ถือเปนสวนหนึ่งของดินแดนโพนทะเลของอังกฤษถูกรัฐเพื่อนบานอางสิทธิ์ ซึ่งกอใหเกิดความตึงเครียดทางการทูต จึงอาจเปนการดีกวาที่จะทบทวนสถานะของดินแดนเหลานี้ภายใตเขตอํานาจของสหราชอาณาจักร"
 ENG_self_government_for_the_mediterranean: "การปกครองตนเองแกดินแดนเมดิเตอรเรเนียน"
 ENG_self_government_for_the_mediterranean_desc: "ชาติตาง ๆ ในเมดิเตอรเรเนียนพรอมที่จะไดรับอํานาจปกครองตนเองอยางกวางขวางเพื่อเตรียมสูเอกราชเต็มรูปแบบ ซึ่งนาจะทําใหมีผูอพยพหลั่งไหลเขามาเพื่อขอรับสัญชาติอังกฤษกอนที่เอกราชจะมีผลอยางเปนทางการ"
 ENG_self_government_for_africa: "การปกครองตนเองแกดินแดนแอฟริกา"
 ENG_self_government_for_africa_desc: "ชาติตาง ๆ ในแอฟริกาพรอมที่จะไดรับอํานาจปกครองตนเองอยางกวางขวางเพื่อเตรียมสูเอกราชเต็มรูปแบบ ซึ่งนาจะทําใหมีผูอพยพหลั่งไหลเขามาเพื่อขอรับสัญชาติอังกฤษกอนที่เอกราชจะมีผลอยางเปนทางการ"
 ENG_self_government_for_the_middle_east: "การปกครองตนเองแกดินแดนตะวันออกกลาง"
 ENG_self_government_for_the_middle_east_desc: "ชาติตาง ๆ ในตะวันออกกลางพรอมที่จะไดรับอํานาจปกครองตนเองอยางกวางขวางเพื่อเตรียมสูเอกราชเต็มรูปแบบ ซึ่งนาจะทําใหมีผูอพยพหลั่งไหลเขามาเพื่อขอรับสัญชาติอังกฤษกอนที่เอกราชจะมีผลอยางเปนทางการ"
 ENG_self_government_for_the_americas: "การปกครองตนเองแกดินแดนในทวีปอเมริกา"
 ENG_self_government_for_the_americas_desc: "ชาติตาง ๆ ในทวีปอเมริกาพรอมที่จะไดรับอํานาจปกครองตนเองอยางกวางขวางเพื่อเตรียมสูเอกราชเต็มรูปแบบ ซึ่งนาจะทําใหมีผูอพยพหลั่งไหลเขามาเพื่อขอรับสัญชาติอังกฤษกอนที่เอกราชจะมีผลอยางเปนทางการ"
 ENG_self_government_for_asia: "การปกครองตนเองแกดินแดนเอเชีย"
 ENG_self_government_for_asia_desc: "ชาติตาง ๆ ในเอเชียพรอมที่จะไดรับอํานาจปกครองตนเองอยางกวางขวางเพื่อเตรียมสูเอกราชเต็มรูปแบบ ซึ่งนาจะทําใหมีผูอพยพหลั่งไหลเขามาเพื่อขอรับสัญชาติอังกฤษกอนที่เอกราชจะมีผลอยางเปนทางการ"
 ENG_decolonization: "การปลดปลอยอาณานิคม"
 ENG_decolonization_desc: "นี่คือจุดจบของยุคสมัย แตเปนจุดจบที่เราเลือกเอง แทนที่จะตองทนอัปยศกับการตอสูอยางไรผลกับกระแสเรียกรองเอกราชที่ไมอาจหยุดยั้ง เราไดเชิดหนาอยางภาคภูมิและชี้นําผูอยูใตการคุมครองของเราไปไกลที่สุดเทาที่จะทําได บัดนี้ เหลือเพียงตัดสายสัมพันธที่เหลืออยู และตอนรับอดีตดินแดนในปกครองของเราสูเวทีโลกในฐานะผูเทาเทียม"
 ENG_decolonized: "อังกฤษไดปลดปลอยอาณานิคมแลว"
 ENG_the_winds_of_change: "สายลมแหงความเปลี่ยนแปลง"
 ENG_the_winds_of_change_desc: "บัดนี้การปลดปลอยอาณานิคมใกลถึงจุดสูงสุด สายลมแหงความเปลี่ยนแปลงพัดแรงขึ้นทุกขณะทั่วโลก หากเราตองการรักษาอนาคตของหมูเกาะของเรา เราตองพยายามอพยพและถอนทรัพยสินจากอดีตอาณานิคมกลับมาสูบานเกิด"
 ENG_royal_malay_regiment_focus: "ขยายกรมทหารมลายูหลวง"
 ENG_royal_malay_regiment_focus_desc: "ในป 1920 ผูปกครองทองถิ่นทั่วดินแดนมลายูของเราไดเรียกรองใหสํานักงานอาณานิคมจัดตั้งกรมทหารราบจากประชากรในอาณานิคม แมจะไดรับอนุมัติและจัดตั้งกองรอยแรกแลว แตก็ยังเล็กเกินกวาจะถือเปนกําลังรบได เราตองขยายกรมทหารนี้ และทําใหมั่นใจวาเราจะปกปองสิงคโปรและมลายาไดอยางเพียงพอในยามสงคราม"
 ENG_territorial_army_of_malaysia_focus: "รวมกองทัพอาณาเขตแหงมาเลเซีย"
 ENG_territorial_army_of_malaysia_focus_desc: "กองกําลังของรัฐในอารักขามลายูของเรากระจัดกระจายและไรประสิทธิภาพอยางมาก เราตองแกไขดวยการรวมกองอาสาสมัครปนเล็กยาวตาง ๆ กองกําลังทหารทองถิ่น และกรมทหารแหงสหพันธรัฐเขาเปนโครงสรางกองทัพเดียว"
 ENG_south_east_asia_air_command_focus: "จัดตั้งกองบัญชาการทางอากาศเอเชียตะวันออกเฉียงใต"
 ENG_south_east_asia_air_command_focus_desc: "กองทัพอากาศอังกฤษประจําสิงคโปรยังมียุทโธปกรณไมพอที่จะปกปองนานฟาเหนืออาณานิคมอันกวางใหญในตะวันออกไกล นาวาอากาศเอกเฮนรี เคฟ-บราวน-เคฟ ไดขอใหเราขยายสิ่งอํานวยความสะดวกในภูมิภาค และจัดตั้งเหลาทัพอากาศใหมที่มีกองบัญชาการอยูที่ฐานทัพอากาศชางงีในสิงคโปร"
 ENG_sarawakrangers_focus: "เสริมกําลังหนวยเรนเจอรซาราวัก"
 ENG_sarawakrangers_focus_desc: "หนวยเรนเจอรซาราวักซึ่งรับผิดชอบปกปองราชแหงซาราวักภายใตการนําของชาลส ไวเนอร บรูก มีความเชี่ยวชาญในการรบในภูมิประเทศปาทึบอันทุรกันดาร เราควรใชประโยชนจากความรูของพวกเขา และเสริมกําลังพวกเขาเพื่อรักษาการควบคุมบอรเนียวเหนือไว"
 ENG_east_indies_fleet_focus: "จัดตั้งกองเรืออินดีสตะวันออก"
 ENG_east_indies_fleet_focus_desc: "ในป 1904 ผูบัญชาการทหารเรือสูงสุด พลเรือเอกเซอรจอหน ฟชเชอร ไดสั่งการวาหนวยบัญชาการหลักทั้งสามในตะวันออกไกล ไดแก หมูเรืออินดีสตะวันออก สถานีจีน และหมูเรือออสเตรเลีย จะตองรวมอยูภายใตกองบัญชาการเดียวที่เรียกวากองเรือตะวันออก ประจําการที่สิงคโปรในยามสงคราม เมื่อความตึงเครียดในภูมิภาคเพิ่มสูงขึ้น การเริ่มเตรียมการใหเรื่องนี้เกิดขึ้นจึงดูเปนสิ่งที่รอบคอบ"
 ENG_steady_as_she_goes: "มั่นคงตามเสนทางเดิม"
 ENG_steady_as_she_goes_desc: "วิกฤตที่ทวีความรุนแรงคือเหตุผลที่เราตองยึดมั่นในรากเหงาของตน เราจะเดินตามเสนทางที่แลนมาในชวงไมกี่ปที่ผานมา แทนที่จะเปลี่ยนแปลงทางการเมืองอยางรุนแรงซึ่งอาจกอความไมมั่นคงภายในในยามที่เรารับมือไดนอยที่สุด"
 ENG_global_defense: "การปองกันระดับโลก"
 ENG_global_defense_desc: "การปกปองชาวอังกฤษเริ่มจากการปองกันไมใหภัยคุกคามลุกลามตั้งแตแรก เราตองหาถานไฟแหงความขัดแยงและดับมันเสียในทันที กอนที่มันจะกลายเปนไฟใหญที่ลามไปทั่วและเผาเราถึงในบาน"
 ENG_every_man_will_do_his_duty: "ทุกคนจะทําหนาที่ของตน"
 ENG_every_man_will_do_his_duty_desc: "ดวยเจตนารมณตามถอยคําอันโดงดังของเนลสัน เราตองปลูกฝงสํานึกในหนาที่ใหแกประชาชน ไมวาพวกเขาจะชอบหรือไม ชาติก็ตองการการรับใชจากพวกเขาเมื่อเผชิญวิกฤตที่กําลังมาถึง"
 ENG_motion_of_no_confidence: "ญัตติไมไววางใจ"
 ENG_motion_of_no_confidence_desc: "รัฐบาลปจจุบันลมเหลวในการคลี่คลายวิกฤตโลกที่กําลังกอตัว ความพยายามใด ๆ ตอจากนี้เปนเพียงสัญญาณของความออนแอ เราตองการผูนําที่เขมแข็งกวานี้เพื่อฝาพายุที่กําลังจะมาถึง"
 ENG_no_further_appeasement: "ไมประนีประนอมอีกตอไป"
 ENG_no_further_appeasement_desc: "นโยบายประนีประนอมลมเหลวแลว และการดําเนินนโยบายนี้ตอไปเปนเรื่องโงเขลา เปนที่ชัดเจนวาศัตรูของเราจะไมถอย และยืนกรานเรียกรองมากขึ้นเรื่อย ๆ เราตองหยุดพวกเขาตอนนี้ กอนที่เราจะมอบความไดเปรียบใหพวกเขามากกวานี้"
 ENG_no_further_appeasement_tt: "ตั้งกฎ: £trigger_yes£สามารถสรางขออางและประกาศสงครามกับประเทศที่มีกลุมอุดมการณเดียวกันได\nตั้งกฎ: £trigger_yes£สามารถทําใหประเทศเปนรัฐหุนเชิดได\n"
 ENG_kickstart_the_war_industry: "เรงเครื่องอุตสาหกรรมสงคราม"
 ENG_kickstart_the_war_industry_desc: "เวลาเปนสิ่งสําคัญยิ่ง และเราไมอาจรอใหอุตสาหกรรมสงครามเติบโตไปตามธรรมชาติ เราตองลงทุนครั้งใหญเพื่อสรางโรงงานเพิ่มเติมอยางรวดเร็ว หากเราจะพรอมรบ"
 ENG_secure_the_oil_imports: "ประกันการนําเขานํ้ามัน"
 ENG_secure_the_oil_imports_desc: "เราไมอาจพึ่งพาขอตกลงการคาที่ไมแนนอนกับรัฐบาลตางชาติในการนําเขานํ้ามัน จะดีกวาหากยึดการควบคุมแหลงนํ้ามันมาไว เพื่อใหเราควบคุมไดอยางเต็มที่ไมวาผูนําทางการเมืองในชาติอื่นจะเปนใคร"
 ENG_maintaining_imperial_integrity: "รักษาบูรณภาพแหงจักรวรรดิ"
 ENG_maintaining_imperial_integrity_desc: "การปองกันจักรวรรดิเริ่มตนจากการเปนเจาทะเลและความภักดีของดินแดนในปกครองตนเอง มหาอํานาจทางทะเลอื่น ๆ ตองไดรับคําเตือนไมใหคุกคามความเหนือกวาทางทะเลของเรา และในขณะเดียวกันเราตองเพิ่มการควบคุมเหนือรัฐในอารักขาเพื่อใหเราเขมแข็งทั่วโลก"
 ENG_enforce_the_naval_treaties: "บังคับใชสนธิสัญญานาวี"
 ENG_enforce_the_naval_treaties_desc: "เราไดรับรูวามหาอํานาจบางชาติเลือกที่จะเพิกเฉยตอขอกําหนดของสนธิสัญญานาวีวอชิงตัน เราไมอาจปลอยใหเปนเชนนี้ได หากเราจะรักษาความไดเปรียบไว และเพื่อไมใหผูอื่นคิดทําเชนเดียวกัน เราตองโจมตีอยางรวดเร็วและเชือดไกใหลิงดูกับผูที่บังอาจขัดขืนเจตจํานงของเรา"
 ENG_enforce_the_naval_treaties_tt: "สิ่งนี้ใชเรียกรองใหประเทศที่มี§Yเรือหลัก§!มากเกินไปเมื่อเทียบกับเรา§Gลด§!จํานวน§Yเรือหลัก§!ลง และจะให§Yเปาหมายสงครามทําใหเปนรัฐหุนเชิด§!แกเราหากพวกเขาปฏิเสธ\n"
 ENG_maintaining_the_balance_of_power: "รักษาดุลแหงอํานาจ"
 ENG_maintaining_the_balance_of_power_desc: "ความแข็งแกรงของจักรวรรดิอยูที่ความออนแอและความชะงักงันของยุโรป หากเราจะมุงความสนใจไปที่กิจการระดับโลก เราตองทําใหยุโรปวุนวายกับเรื่องของตนเองจนไมมีเวลามาสนใจเรื่องของเรา เราจะวางตัวหางจากกิจการยุโรป ยกเวนเพื่อจัดการกับระบอบขยายดินแดนที่อาจคุกคามดุลแหงอํานาจอันเปราะบางที่เราตองการ"
 ENG_continental_intervention: "แทรกแซงภาคพื้นทวีป"
 ENG_continental_intervention_desc: "เปนที่ชัดเจนวาเราไมอาจรักษาดุลแหงอํานาจบนภาคพื้นทวีปยุโรปไดหากไมลงมือ เราตองบดขยี้ระบอบขยายดินแดนที่ผุดขึ้นมาในระยะหลัง เพื่อใหมั่นใจวาเราจะไมตองเผชิญภัยจากยุโรปที่เปนปกแผนซึ่งสามารถเตรียมรุกรานหมูเกาะอังกฤษไดโดยไมมีอะไรมาดึงความสนใจ"
 ENG_continental_intervention_tt: "ใหเปาหมายสงครามตอชาติมหาอํานาจยุโรปที่กอ§Yความตึงเครียดของโลก§!มากกวา §R10§!:\n"
 ENG_prepare_for_the_inevitable: "เตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 ENG_prepare_for_the_inevitable_desc: "ดูเหมือนแทบแนนอนแลววาชาติของเราจะตองเขาไปพัวพันกับความขัดแยงระดับโลกอีกครั้ง เราตองเพิ่มรายจายดานอุตสาหกรรมเพื่อเรงอัตราการเสริมสรางกําลังอาวุธ"
 ENG_mi6_ns: "MI6"
 ENG_a_change_in_course: "เปลี่ยนเสนทาง"
 ENG_a_change_in_course_desc: "เมื่อความตึงเครียดของโลกเพิ่มสูงขึ้น เปนที่ชัดเจนวาผูนําทางการเมืองในปจจุบันไมสามารถปกปองผลประโยชนของชาติได ถึงเวลาแลวที่จะแหวกออกจากแนวทางการเมืองในชวงหลายทศวรรษที่ผานมาอยางสิ้นเชิง"
 ENG_the_kings_party: "พรรคของกษัตริย"
 ENG_the_kings_party_desc: "เมื่อวิกฤตผานพนและรัฐบาลลมสลายแลว ผูสนับสนุนที่แข็งขันที่สุดของกษัตริยอาจจัดตั้งรัฐบาลของตนเองได ซึ่งจะ... คลอยตาม... พระราชประสงคมากกวามาก พรรคของกษัตริยนี้จะประกอบดวยเดวิด ลอยด จอรจ วินสตัน เชอรชิลล และออสวัลด มอสลีย ซึ่งขามเสนแบงพรรคการเมืองและชวยฟนฟูความเปนปกแผนของชาติ"
 edward_viii_married_wallis_simpson: "พระเจาเอ็ดเวิรดที่ 8 อภิเษกสมรสกับวอลลิส ซิมปสันแลว"
 ENG_reassess_continental_commitments: "ทบทวนพันธะตอภาคพื้นทวีป"
 ENG_reassess_continental_commitments_desc: "แมทาทีทางการเมืองตอยุโรปของเราในระยะหลังคือการผูกพันกับพันธมิตรในมหาสงคราม เพื่อตอตาน[GER.GetName]ที่กําลังฟนตัวและ[SOV.GetName]ที่ทอดเงาคุกคาม แตความแตกตางทางการเมืองระหวางเรากับพันธมิตรเกาก็เดนชัดขึ้นเรื่อย ๆ บางทีอาจถึงเวลาที่ตองทบทวนวาความภักดีของเราควรอยูที่ใด"
 ENG_isolate_the_mediterranean_threat: "โดดเดี่ยวภัยคุกคามในเมดิเตอรเรเนียน"
 ENG_isolate_the_mediterranean_threat_desc: "กองทัพเรือ[ITA.GetAdjective]คุกคามการเดินเรือของเราผานเมดิเตอรเรเนียน เราตองเริ่มรณรงคโดดเดี่ยวพวกเขาทางการทูตเพื่อสกัดกั้นภัยคุกคามนี้"
 ENG_alliance_with_germany: "เปนพันธมิตรกับเยอรมนี"
 ENG_alliance_with_germany_desc: "ผลประโยชนของเราสอดคลองกับเยอรมนี ขณะที่พวกเขาตองการเปนเจาแหงภาคพื้นทวีปยุโรป เราตองการยุโรปที่จะไมคุกคามหมูเกาะอังกฤษขณะที่เราดูแลจักรวรรดิทั่วโลก บางทีการเปนพันธมิตรตามพระราชประสงคของกษัตริยอาจไมใชความรวมมือที่แปลกประหลาดนัก"
 ENG_alliance_with_germany_tt: "ครึ่งหนึ่งของการสนับสนุน§Yประชาธิปไตย§!ในปจจุบันจะถูกนํามาเปนบทลงโทษ§Rเสถียรภาพ§!:\n"
 ENG_noninterference_treaty_with_germany: "สนธิสัญญาไมแทรกแซงกับเยอรมนี"
 ENG_noninterference_treaty_with_germany_desc: "ความทะเยอทะยานดานจักรวรรดิของเราขึ้นอยูกับการไมตองกังวลเรื่องยุโรป บางทีสิ่งนี้อาจทําไดงาย ๆ ดวยการให[GER.GetNameDef]ทําอะไรก็ไดในยุโรป แลกกับความสัมพันธอันสันติตอไปและคํามั่นวาจะไมแทรกแซงกิจการที่เกี่ยวของกับจักรวรรดิบริติช"
 ENG_take_out_the_regia_marina: "กําจัดเรเจีย มารีนา"
 ENG_take_out_the_regia_marina_desc: "ถึงเวลาจัดการกับภัยคุกคามในเมดิเตอรเรเนียนแลว เราจะรักษาเสนทางเดินเรือผานคลองสุเอซ ซึ่งเปนเสนเลือดใหญของจักรวรรดิ ดวยการกําจัดกองทัพเรือที่ขวางอยู"
 ENG_organize_the_blackshirts: "จัดตั้งกลุมเสื้อดํา"
 ENG_organize_the_blackshirts_map_category_name: "เลือกสถานที่จัดการเดินขบวนของกลุมเสื้อดํา"
 ENG_organize_the_blackshirts_desc: "ความสําเร็จของสหภาพฟาสซิสตอังกฤษขึ้นอยูกับภาพลักษณตอสาธารณะ เราสามารถแสดงจิตวิญญาณแหงความเปนหนึ่งเดียวและพลังของขบวนการดวยการจัดเดินขบวนแบบทหารทั่วประเทศ เราจะดึงดูดผูติดตามไดมากขึ้น พรอมกับขมขวัญฝายคานใหนิ่งเฉย เปาหมายสุดทายคือการเดินขบวนสูถนนดาวนิงเพื่อเรียกรองใหเปลี่ยนผูนํา"
 ENG_organize_the_blackshirts_tt: "ปลดล็อกการตัดสินใจ§Yจัดตั้งกลุมเสื้อดํา§!\n"
 ENG_the_british_path_to_fascism: "เสนทางสูฟาสซิสตแบบอังกฤษ"
 ENG_the_british_path_to_fascism_desc: "เสนทางสูฟาสซิสตของเราจะเปนของเราเอง และเราจะไมคุกเขาใหใครบนภาคพื้นทวีปที่ถือวาตนเหนือกวาเราทางอุดมการณ ประชาชนยังจดจําสงครามครั้งกอนได และความรวมมือใด ๆ กับระบอบที่ปกครอง[GER.GetName]อยูยอมทําใหพวกเขาโกรธแคนแนนอน"
 ENG_secure_the_italian_alliance: "ผูกพันธมิตรกับอิตาลี"
 ENG_secure_the_italian_alliance_desc: "มุสโสลินีมีแนวทางฟาสซิสตที่นายอมรับกวามาก และมอสลียก็ชื่นชมเขามานาน เปนเรื่องธรรมดาที่สองประเทศของเราจะสานสัมพันธที่ใกลชิดยิ่งขึ้น ซึ่งเปนประโยชนตอประชาชนของทั้งสองฝาย"
 ENG_gibraltar_for_spanish_support: "ยิบรอลตารแลกการสนับสนุนจากสเปน"
 ENG_gibraltar_for_spanish_support_desc: "แมจะถือเปนสวนสําคัญของชาติเรามานาน แตบางทีอาจคุมคาที่จะคืนยิบรอลตารใหสเปน แลกกับการที่ฟรังโกสนับสนุนเปาหมายของเรา"
 ENG_pre_empt_spanish_alignment: "ชิงตัดหนาการเลือกขางของสเปน"
 ENG_pre_empt_spanish_alignment_desc: "มีความเสี่ยงที่สเปนจะเขาขางเยอรมนีหากเราดําเนินการเชิงรุกตอเยอรมนี เราไมอาจปลอยใหเปนเชนนั้น เราตองจัดการภัยคุกคามที่อาจเกิดขึ้นนี้กอนจะมุงหนาสู[GER.GetName]"
 ENG_prevent_a_continental_hegemony: "ปองกันการเปนเจาแหงภาคพื้นทวีป"
 ENG_prevent_a_continental_hegemony_desc: "เปนที่ชัดเจนวา[GER.GetNameDef]หมายจะครอบครองภาคพื้นทวีปยุโรปทั้งหมด เราไมอาจปลอยใหสิ่งนี้เกิดขึ้นได เราตองรวมกับพันธมิตรจัดการเยอรมนีกอนที่พวกเขาจะกลายเปนความทาทายที่ยากเกินจะเอาชนะ"
 ENG_enact_the_mosley_manifesto: "ดําเนินการตามแถลงการณมอสลีย"
 ENG_enact_the_mosley_manifesto_desc: "ในชวงหลายปที่ผานมา มอสลียไดจัดทําแถลงการณวาดวยการปฏิรูปเศรษฐกิจครั้งใหญเพื่อขจัดความยากจน ถึงเวลานําขอเสนอของทานผูนํามาปฏิบัติแลว"
 ENG_god_save_the_king: "ขอพระเจาคุมครองกษัตริย"
 ENG_god_save_the_king_desc: "เหนือสิ่งอื่นใดคือหนาที่ของเราตอกษัตริยและราชบัลลังก พระองคทรงเปนสัญลักษณแหงการตอตานและความหวังของประชาชน และเปนสัญลักษณแหงความเปนหนึ่งเดียวของจักรวรรดิตอทั้งผูอยูใตปกครองและศัตรู กษัตริยตองไดรับการเทิดทูนภายในและเปนที่เกรงขามภายนอก เราจะทําใหเปนเชนนั้น"
 ENG_ceylon_forward_operating_base: "ฐานปฏิบัติการสวนหนาซีลอน"
 ENG_ceylon_forward_operating_base_desc: "เพื่อเตรียมการรุกรานครั้งใหญที่จําเปนตอการนําอินเดียกลับคืนสูการควบคุมของราชบัลลังก เราตองขยายสิ่งอํานวยความสะดวกบนเกาะซีลอนอยางมาก"
 ENG_reclaim_the_jewel_in_the_crown: "ทวงคืนอัญมณีแหงมงกุฎ"
 ENG_reclaim_the_jewel_in_the_crown_desc: "ชวงเวลาสั้น ๆ แหงเอกราชของอินเดียตองจบลงแลว กองกําลังของเราเขาประจําที่ พรอมนําอัญมณีแหงมงกุฎกลับคืนมา"
 ENG_reclaim_burma: "ทวงคืนพมา"
 ENG_reclaim_burma_desc: "ชวงเวลาสั้น ๆ แหงเอกราชของ[BRM.GetName]ตองจบลงแลว กองกําลังของเราเขาประจําที่ พรอมนําประเทศนี้กลับคืนสูเจาเหนือหัวอันชอบธรรม"
 ENG_pre_empt_the_ideological_threat: "ชิงตัดหนาภัยคุกคามทางอุดมการณ"
 ENG_pre_empt_the_ideological_threat_desc: "จักรวรรดิถูกรุมเราจากภายในโดยผูที่คิดตาง เรารูวาแนวรวมที่หาเหลานี้รับคําสั่งจากมอสโก เราจึงอาจปดปากพวกเขาไดดวยการโจมตีที่ตนตอของความชั่วรายนี้"
 ENG_expose_the_belly_of_the_bear: "เปดทองหมี"
 ENG_expose_the_belly_of_the_bear_desc: "การรับมือโซเวียตโดยไมมีหัวหาดใด ๆ เปนความทาทายอยางยิ่ง เราจะเรียกรองสิทธิ์ผานดินแดน[PER.GetName]และ[AFG.GetName] แลวโจมตีโซเวียตในจุดที่พวกเขาคาดไมถึงที่สุด คือทางบกเขาสูทองที่เปดโลงของพวกเขา"
 ENG_imperial_conscription: "การเกณฑทหารทั่วจักรวรรดิ"
 ENG_imperial_conscription_desc: "เราละเลยกําลังพลมหาศาลที่จักรวรรดิมีใหมานานแลว ถึงเวลาปรับปรุงการเกณฑทหารทั่วจักรวรรดิอยางจริงจัง และทําใหมั่นใจวาเรามีกําลังพลเหลือเฟอสําหรับทําสงคราม ทุกคนตองทําหนาที่ตอราชบัลลังก!"
 ENG_consolidate_the_british_isles: "รวมหมูเกาะอังกฤษ"
 ENG_consolidate_the_british_isles_desc: "ชาวไอริชยังคงชูแนวคิดเอกราชอันไรสาระของพวกเขา และความอดทนของเราก็หมดลงแลว ถึงเวลาบดขยี้การตอตานของพวกเขาและนําทั้งประเทศกลับมาเปนสวนหนึ่งของสหราชอาณาจักร"
 ENG_unite_the_anglosphere: "รวมโลกแองโกลสเฟยร"
 ENG_unite_the_anglosphere_desc: "มรดกจากยุคทองของเราคือวัฒนธรรมและภาษาที่แพรหลายไปทั่วโลก แทนที่จะทนอัปยศและความอกตัญูที่ดินแดนเหลานี้ยังคงเปนเอกราช เราตองรวมพวกเขาไวใตการปกครองของเราอีกครั้ง"
 ENG_appeal_to_imperial_loyalists: "เรียกรองผูภักดีตอจักรวรรดิ"
 ENG_appeal_to_imperial_loyalists_desc: "แมดินแดนในปกครองตนเองจะมีเอกราชซึ่งบัดนี้เปนเพียงในนาม แตก็ยังมีพลเมืองจํานวนมากที่ภักดีตอราชบัลลังก หากเราติดตอพวกเขาได เราอาจบอนทําลายรัฐบาลของดินแดนเหลานั้นกอนการรุกรานที่จําเปนตอการกลับมาควบคุมพวกเขา"
 ENG_appeal_to_imperial_loyalists_tt: "ปลดล็อกการตัดสินใจ§Yเรียกรองผูภักดีตอจักรวรรดิ§! ซึ่งชวยใหยุยงสงครามกลางเมืองฝายนิยมอังกฤษในอดีตดินแดนในปกครองตนเองได\n"
 ENG_bring_the_dominions_back_into_the_fold: "นําดินแดนในปกครองตนเองกลับสูออมอก"
 ENG_bring_the_dominions_back_into_the_fold_desc: "กระดานพรอมแลว และหมากทุกตัวเขาที่แลว บัดนี้ถึงเวลาเดินแผนของเรา และ 'แกไข' ความคิดเรื่องเอกราชในใจของผูนําดินแดนในปกครองตนเอง"
 ENG_bring_the_dominions_back_into_the_fold_tt: "ปลดล็อกการตัดสินใจ§Yเปนพันธมิตรกับการลุกฮือของฝายจักรวรรดินิยม§!\n"
 ENG_the_sun_never_sets: "ดวงอาทิตยไมเคยตกดิน"
 ENG_the_sun_never_sets_desc: "มีคํากลาววาจักรวรรดิบริติชกวางใหญจนดวงอาทิตยไมเคยตกดิน พลังของจักรวรรดิคือราชนาวี ซึ่งพิทักษเสนทางการคาและเสนทางเสบียงที่เชื่อมโยงจักรวรรดิไวและมีความสําคัญยิ่งตอความรุงเรืองของเรา กองทัพเรือนี้ตองเรียนรูที่จะเดินทางขามระยะทางอันไกลโพนใหรวดเร็วที่สุด เพื่อใหเราตอบโตภัยคุกคามไดทันทวงทีไมวาที่ใด"
 ENG_the_sun_never_sets_tt: "โบนัสเหลานี้จะมีผลกับเรือทุกประเภทที่วิจัยใหม\n"
 ENG_pre_empt_the_strategic_threat: "ชิงตัดหนาภัยคุกคามทางยุทธศาสตร"
 ENG_pre_empt_the_strategic_threat_desc: "จักรวรรดิถูกรุมเราจากภายนอกโดยผูที่ปรารถนาความมั่งคั่งดานทรัพยากรของเรา เรารูวาเปนใครและเพราะอะไร จึงไมมีสิ่งใดขัดขวางเราจากการบุกไปสูกับพวกเขา กอนที่พวกเขาจะตะครุบเราในยามที่เราออนแอ"
 ENG_concessions_to_the_trade_unions: "ยอมผอนปรนใหสหภาพแรงงาน"
 ENG_concessions_to_the_trade_unions_desc: "ความพยายามเสริมกําลังอาวุธของเราถูกขัดขวางจากความขัดแยงกับสหภาพแรงงานอยูตลอด การเปลี่ยนผานอาจราบรื่นกวามากหากเราเลือกรวมมือกับพวกเขา แทนที่จะตอสูกันตอไป"
 ENG_concessions_to_the_trade_unions_tt: "ปลดล็อกการตัดสินใจ§Yยอมผอนปรนใหสหภาพแรงงาน§! ซึ่งตองทําใหสําเร็จเพื่อเปนคอมมิวนิสต\n"
 ENG_concessions_to_the_trade_unions_tt_3: "ปลดล็อกการตัดสินใจ§Yการสนับสนุนจากสหภาพแรงงาน§!\n"
 ENG_concessions_to_the_trade_unions_tt_2: "§Rหากไมสามารถปลดปลอยอาณานิคมไดภายใน 2 ปหลังเปนคอมมิวนิสต สงครามกลางเมืองจะปะทุขึ้น!§!\n"
 ENG_move_to_secure_the_dominions: "เคลื่อนไหวเพื่อยึดกุมดินแดนในปกครองตนเอง"
 ENG_move_to_secure_the_dominions_desc: "ดินแดนในปกครองตนเองจับตามองการเปลี่ยนแนวทางอุดมการณของเราดวยสายตาหวาดระแวง ไมใชเรื่องเกินคาดที่พวกเขาจะทบทวนความสัมพันธกับเวสตมินสเตอรหากเราปลอยไว... ดังนั้นเราตองไมปลอย หากลงมืออยางรวดเร็ว เราอาจบีบใหเปลี่ยนรัฐบาลไดกอนที่ความสัมพันธทางการทูตจะตึงเครียดเกินไป"
 ENG_move_to_secure_the_dominions_tt: "เปดใชการตัดสินใจ§Yเคลื่อนไหวเพื่อยึดกุมดินแดนในปกครองตนเอง§!\n"
 ENG_the_fate_of_the_royal_family: "ชะตากรรมของราชวงศ"
 ENG_the_fate_of_the_royal_family_desc: "แนวคิดที่วาคนหนึ่งมีคามากกวาอีกคนเพียงเพราะชาติกําเนิดทําใหเราขยะแขยง ความมั่งคั่งมหาศาลที่ราชวงศยังคงอวดโอเปนหนามยอกอก และยอมมีประโยชนกวามากหากนําไปใชเสริมกําลังอาวุธและขยายอุตสาหกรรม บางทีอาจถึงเวลายิงปนนัดเดียวไดนกสองตัว..."
 ENG_eliminate_the_upper_class: "กําจัดชนชั้นสูง"
 ENG_eliminate_the_upper_class_desc: "กรรมกรตองลุกขึ้นและทลายการกดขี่ของชนชั้นสูง เราจะจัดการพวกเขา และยึดบริษัทของพวกเขามาเปนของรัฐ"
 ENG_eliminate_the_upper_class_tt: "ปลดจอมพล นายพล และพลเรือเอกที่เปนชนชั้นสูงออก\n"
 ENG_for_the_good_of_the_revolution: "เพื่อประโยชนของการปฏิวัติ"
 ENG_for_the_good_of_the_revolution_desc: "ทุกคนตองพรอมเสียสละความสะดวกสบายเพื่อประโยชนของรัฐ ชาวอังกฤษจะเชิดหนาสูกับการปนสวน ดวยความมั่นใจวาสิ่งนี้จะนํามาซึ่งชัยชนะของเราในที่สุด"
 ENG_the_british_communist_alternative: "ทางเลือกคอมมิวนิสตแบบอังกฤษ"
 ENG_the_british_communist_alternative_desc: "แทนที่จะเขาขางมอสโก เราจะเริ่มความรวมมือของรัฐคอมมิวนิสตของเราเอง อังกฤษไมเปนรองใครบนเวทีโลก และเราจะไมกมหัวใหมอสโก ไมวาตอนนี้หรือตลอดไป"
 ENG_enforce_decolonization: "บังคับใหปลดปลอยอาณานิคม"
 ENG_enforce_decolonization_desc: "เชนเดียวกับที่เราปลดปลอยอาณานิคมแลว ชาติอื่น ๆ ในโลกก็ตองทําเชนกัน เราจะยื่นคําขาด และผูที่ไมเห็นถึงปญญาในคําพูดของเราก็จะถูกทําใหเห็นแทน"
 ENG_reach_out_across_the_channel: "ยื่นมือขามชองแคบ"
 ENG_reach_out_across_the_channel_desc: "ลัทธิคอมมิวนิสตไดแพรขยายในประเทศฝงตรงขามชองแคบอังกฤษ เราจะยื่นมือไปหาพวกเขา และมอบการชี้นําและความชวยเหลือที่อยูใกลกวามอสโกอันหางไกลมากนัก"
 ENG_reach_out_across_the_channel_tt: "เชิญ§Y[FRA.GetName]§!หรือ§Yกลุมประเทศตํ่า§!เขารวมฝายของเรา หากเปนคอมมิวนิสต\n"
 ENG_soviet_cooperation: "ความรวมมือกับโซเวียต"
 ENG_soviet_cooperation_desc: "แมเราจะมีความแตกตางกัน แตเราก็มีศัตรูรวมกัน เราจะเสนอใหโจมตีจากทั้งสองดาน บดขยี้เยอรมนีกอนที่พวกเขาจะรูตัววาเกิดอะไรขึ้น"
 ENG_the_one_true_revolution: "การปฏิวัติที่แทจริงหนึ่งเดียว"
 ENG_the_one_true_revolution_desc: "ความรวมมือกับ[SOU.Capital.GetCapitalVictoryPointName]จะไมมีวันเกิดขึ้นได ความฉอฉลระบาดไปทั่ว[SOU.GetNameDef] และความหวังเดียวคือการควักหัวใจของมันออก แลวขึ้นเปนผูนําระดับโลกที่ไมมีใครโตแยงแหงอุดมการณกรรมกร"
 ENG_follow_moscow: "เดินตาม[SOU.Capital.GetCapitalVictoryPointName]"
 ENG_follow_moscow_desc: "โดยรากเหงาแลว ลัทธิคอมมิวนิสตในอังกฤษเดินตามคําสั่งของ[SOU.Capital.GetCapitalVictoryPointName]มาโดยตลอด การทําเชนนั้นตอไปไมเพียงสมเหตุสมผล แตยังจําเปนอีกดวย ดวยกองทัพแดงและกองทัพเรือของเรา เราจะเผยแผคําสอนของมารกซไปทั่วทุกสารทิศ และไมมีใครหยุดเราได"
 ENG_tackle_fascism: "จัดการลัทธิฟาสซิสต"
 ENG_tackle_fascism_desc: "ลัทธิฟาสซิสตคือภัยคุกคามอันดับหนึ่งตออุดมการณกรรมกร เราตองมุงกําจัดโรครายนี้ใหสิ้นไปจากยุโรป"
 ENG_preparing_the_second_front: "เตรียมแนวรบที่สอง"
 ENG_preparing_the_second_front_desc: "เมื่อสงครามเริ่มขึ้น เราตองเปดแนวรบที่สองเพื่อชวยพันธมิตรโซเวียตของเรา การเตรียมการตองเริ่มตั้งแตบัดนี้"
 ENG_tackle_capitalism: "จัดการลัทธิทุนนิยม"
 ENG_tackle_capitalism_desc: "ลัทธิทุนนิยมคือศัตรูตัวฉกาจของอุดมการณกรรมกร และเราไมอาจนิ่งดูดายขณะที่มันเฟองฟู แมจะอยูหางออกไปอีกฟากมหาสมุทร เราตองเตรียมพรอมไปจัดการมันถึงถิ่น"
 ENG_bermuda_invasion_launch_point: "จุดเริ่มการรุกรานเบอรมิวดา"
 ENG_bermuda_invasion_launch_point_desc: "การรุกรานอเมริกาเหนือไมใชเรื่องงาย เราตองเสริมสรางดินแดนในเบอรมิวดาใหรองรับกองกําลังรุกรานไดนานเทาที่จําเปน กอนจะสงไปเผยแผการปฏิวัติถึงชายฝงอเมริกาโดยตรง"
 ENG_crush_the_dream: "บดขยี้ความฝน"
 ENG_crush_the_dream_desc: "ชาวอเมริกันชอบพูดถึงความฝนของพวกเขา วาใครก็ 'ประสบความสําเร็จ' ในอเมริกาได ขอเพียงยอมเหยียบหลังเพื่อนรวมสังคมขึ้นไป เราเห็นวานี่เปนเรื่องนารังเกียจ ไมควรมีใครถูกสงเสริมใหลาเหยื่อผูอื่นเพื่อประโยชนตน เราจะปลดปลอยประชาชนของพวกเขาจากความคิดไรสาระเหลานี้ และบดขยี้ความฝนนี้จนไมเหลือรองรอย"
 ENG_socialist_science_pool: "ศูนยรวมวิทยาการสังคมนิยม"
 ENG_socialist_science_pool_desc: "เราตองประสานการแลกเปลี่ยนความรูทางเทคโนโลยี เพื่อใหพันธมิตรทุกชาติไดประโยชนจากความกาวหนาของเรา และเราก็ไดประโยชนจากความกาวหนาของพวกเขา นี่คือหนทางเดียวที่การตอสูของกรรมกรจะประสบความสําเร็จ"
 ENG_liberate_the_home_of_marx: "ปลดปลอยบานเกิดของมารกซ"
 ENG_liberate_the_home_of_marx_desc: "บานเกิดของคารล มารกซถูกลัทธิฟาสซิสตแพรระบาด ไมเพียงทําใหความทรงจําของเขามัวหมอง แตยังเปนการดูหมิ่นสังคมนิยมทั้งมวลอยางไมสิ้นสุด ถึงเวลาขจัดพลังชั่วรายนี้ออกจากแผนดินเยอรมัน และปลดปลอยประชาชนจากศาสดาจอมปลอมที่นําพวกเขาอยู"
 ENG_spirit_of_the_industrial_revolution: "จิตวิญญาณแหงการปฏิวัติอุตสาหกรรม"
 ENG_spirit_of_the_industrial_revolution_desc: "หมูเกาะอังกฤษคือแหลงกําเนิดของการปฏิวัติอุตสาหกรรม ดวยจิตวิญญาณนี้ เราจะแสดงใหโลกเห็นวากรรมกรที่ไดรับการปลดปลอยสามารถทําอะไรไดบางในระบบเศรษฐกิจที่รัฐควบคุม"
 ENG_british_commonwealth_air_training_plan: "แผนการฝกบินแหงเครือจักรภพอังกฤษ"
 ENG_british_commonwealth_air_training_plan_desc: "ความสําเร็จทางทหารของเราขึ้นอยูกับการครองนานฟา และดวยเหตุนี้จึงขึ้นอยูกับฝมือของลูกเรืออากาศยาน เราจะเริ่มโครงการฝกการบินที่ใหญที่สุดเทาที่โลกเคยเห็น เพื่อใหมั่นใจวาเรามีนักบินและลูกเรือที่ผานการฝกครบตามที่ตองการเพื่อครองมิติใหมแหงสงครามนี้"
 ENG_indian_autonomy: "อํานาจปกครองตนเองของอินเดีย"
 ENG_indian_autonomy_desc: "แทนที่จะสัญญาเอกราชเต็มรูปแบบ เราอาจบั่นทอนขบวนการเรียกรองเอกราชของอินเดียไดดวยการมอบอํานาจปกครองตนเองอยางกวางขวาง เชนเดียวกับที่ดินแดนในปกครองตนเองอื่น ๆ ไดรับอยูแลว"
 ENG_indian_autonomy_tt: "§Rหากไมมีอํานาจปกครองตนเองหรือลอรดแฮลิแฟกซเปนผูนําประเทศ [RAJ.GetNameDef]จะไมยอมรับขอเสนอใด ๆ เรื่องสหพันธจักรวรรดิ§!"
 ENG_imperial_conference_defense_dominion: "ขอตกลงดานการปองกันจากการประชุมจักรวรรดิ"
 ENG_imperial_conference_economy_dominion: "ขอตกลงดานเศรษฐกิจจากการประชุมจักรวรรดิ"
 ENG_federal_integration: "การบูรณาการแบบสหพันธ"
 ENG_imperial_conference: "จัดการประชุมจักรวรรดิ"
 ENG_imperial_conference_desc: "ครั้งลาสุดที่ผูนํารัฐบาลของอาณานิคมปกครองตนเองและดินแดนในปกครองตนเองทั้งหมดของเรามาประชุมหารือเรื่องผลประโยชนของจักรวรรดิคือป 1932 ถึงเวลาแลวที่จะจัดการประชุมอีกครั้ง โดยเฉพาะหากเราตองการเสริมความแข็งแกรงใหจักรวรรดิในอนาคตอันใกล"
 ENG_imperial_conference_tt: "ปลดล็อกการตัดสินใจ§Yการประชุมจักรวรรดิ§!เปนเวลา 60 วัน\n§Rตรวจสอบใหแนใจวาคุณสะสมอํานาจทางการเมืองไวเพียงพอเพื่อใชการตัดสินใจเหลานี้!§!\n"
 ENG_imperial_federation: "สหพันธจักรวรรดิ"
 ENG_imperial_federation_desc: "สหพันธจักรวรรดิถูกชูเปนทางเลือกแทนการปกครองตนเองมานาน หลังการเตรียมการอันยาวนาน ในที่สุดก็ถึงเวลารวมรัฐบาลของเราเขากับรัฐบาลของดินแดนในปกครองตนเอง และกลับมาครองตําแหนงอภิมหาอํานาจอันดับหนึ่งของโลก บริแทนเนียจงครองทะเล!"
 ENG_dominions_accepted_federation: "ดินแดนในปกครองตนเองเห็นชอบสหพันธจักรวรรดิ\n"
 ENG_a_s_warfare: "การสงครามตอตานเรือดํานํ้า"
 ENG_a_s_warfare_desc: "มหาสมุทรแอตแลนติกคือเสนเลือดใหญของเรา และเราตองทําใหมั่นใจวาปลอดจากศัตรูที่จองเลนงานการเดินเรืออันเปราะบางของเรา ไมวาจะบนผิวนํ้าหรือใตนํ้า เราจะมุงเนนพัฒนาการลํ้าสมัยดานการสงครามตอตานเรือดํานํ้า เพื่อใหเรือคุมกันของเรามีอาวุธและเครื่องมือตรวจจับที่ดีที่สุดเทาที่เราจะจัดหาได"
 ENG_anti_submarine_training_school: "โรงเรียนฝกการตอตานเรือดํานํ้า"
 ENG_anti_submarine_training_school_desc: "ขอไดเปรียบประการหนึ่งของเราคือความสามารถในการดึงนายทหารผูชํานาญจํานวนมากที่มีประสบการณจากสงครามครั้งกอนมาฝกลูกเรือรุนใหม ภายใตการนําของพลเรือจัตวากิลเบิรต สตีเฟนสัน ผูเชี่ยวชาญดานการตอตานเรือดํานํ้า การจัดตั้งโรงเรียนฝกการตอตานเรือดํานํ้าแหงใหมที่โทเบอรมอรีจะทําใหลูกเรือของเรามีทักษะที่จําเปนกอนออกปฏิบัติหนาที่คุมกันขบวนเรือลําเลียงในแอตแลนติกและเผชิญภัยเรือยู"
 ENG_expand_the_repair_yards: "ขยายอูซอมเรือ"
 ENG_expand_the_repair_yards_desc: "แมกองทัพเรือของเราจะเปนหนึ่งในกองทัพเรือที่ใหญที่สุดในโลก แตเราตองมีวิธีซอมเรือที่ไดรับความเสียหายจากการรบไดอยางรวดเร็วดวย มิฉะนั้นศัตรูอาจบั่นทอนเราดวยการสูญเสียสะสม การขยายอูซอมเรือไมเพียงชวยในเรื่องนี้ แตยังทําใหเราปรับปรุงเรือรุนเกาบางลําไดทันการณดวย"
 ENG_vanguard: "แวนการด"
 ENG_vanguard_desc: "[Root.GetVanguardDesc]"
 ENG_VANGUARD_DESC_HISTORICAL: "เราตองไมถูกศัตรูขมดวยจํานวนในทองทะเล เรายังมีปนขนาด 15 นิ้วจํานวนหนึ่งเก็บไวในคลัง ซึ่งสามารถใชแทนปนขนาด 16 นิ้วที่ตองใชเวลาผลิตนานสําหรับเรือประจัญบานรุนถัดไปที่วางแผนไว ซึ่งจะชวยเรงการสรางเรือลําแรกของชั้นนี้ไดอยางมาก นั่นคือ HMS Vanguard"
 ENG_VANGUARD_DESC_COMMUNIST: "เราตองไมถูกศัตรูขมดวยจํานวนในทองทะเล เรายังมีปนขนาด 15 นิ้วจํานวนหนึ่งเก็บไวในคลัง ซึ่งสามารถใชแทนปนขนาด 16 นิ้วที่ตองใชเวลาผลิตนานสําหรับเรือประจัญบานรุนถัดไปที่วางแผนไว ซึ่งจะชวยเรงการสรางเรือลําแรกของชั้นนี้ไดอยางมาก นั่นคือ WLNS Vanguard"
 ENG_vanguard_tt_hms: "สราง HMS Vanguard\n"
 ENG_vanguard_tt_communism: "สราง WLNS Vanguard\n"
 ENG_anti_non_contact_committee: "คณะกรรมการตอตานทุนระเบิดแบบไมสัมผัส"
 ENG_anti_non_contact_committee_desc: "ผูเชี่ยวชาญทางเทคนิคดานสงครามทุนระเบิดของเราใหคําแนะนําวา ทุนระเบิดแบบใหมที่จุดชนวนดวยสนามแมเหล็ก เสียง และวิธีอื่น ๆ นาจะมีบทบาทสําคัญในสงครามครั้งหนา ดวยการแตงตั้งคณะกรรมการพิเศษตอตานทุนระเบิดแบบไมสัมผัสของกองทัพเรือเพื่อวิจัยวิธีกวาดทุนระเบิดเหลานี้ตั้งแตตอนนี้ เราจะชวยใหเรือของเราปลอดภัย และอาจไดความกาวหนาดานเทคโนโลยีทุนระเบิดของเราเองไปพรอมกัน"
 ENG_secure_the_imperial_shipping_routes: "พิทักษเสนทางเดินเรือของจักรวรรดิ"
 ENG_secure_the_imperial_shipping_routes_desc: "ความเปนปกแผนของจักรวรรดิอาณานิคมของเราขึ้นอยูกับความสามารถในการปกปองการเดินเรือพาณิชยที่ผูกจักรวรรดิไวดวยกัน และการแผแสนยานุภาพไปยังทุกที่ที่จําเปน เราพึ่งพากองเรือลาดตระเวนเบาขนาดใหญในการทําสิ่งนี้มาโดยตลอด และเราตองทําใหมั่นใจวายังคงมีเรือเหลานี้ในจํานวนที่จําเปนเพื่อใหเราอยูไดทุกที่ในเวลาเดียวกัน"
 HOL_obtain_foreign_colonial_investments: "รับการลงทุนจากตางชาติในอาณานิคม"
 HOL_obtain_foreign_colonial_investments_desc: "แมอเมริกาจะตอตานลัทธิอาณานิคมอยางแข็งขัน แตก็มีผลประโยชนทางเศรษฐกิจในอาณานิคมของเรามานาน โดยเฉพาะหมูเกาะเวสตอินดีส พวกเขาพรอมกับอังกฤษและญี่ปุนตางกระหายที่จะลงทุนในการพัฒนาอาณานิคมของเรา ทั้งทางตะวันตกและตะวันออก เราควรสงเสริมสิ่งนี้"
 HOL_obtain_foreign_colonial_investments_tt: "สิ่งเหลานี้ใหโบนัสชั่วคราวตอ§Yสินคาอุปโภคบริโภค§!และ§Yความเร็วการกอสราง§! รวมถึงเพิ่มการผลิต§Yนํ้ามัน§!อยางถาวรในอินดีสตะวันออกและตะวันตก\n"
 HOL_the_western_possessions: "ดินแดนฝงตะวันตก"
 HOL_the_western_possessions_desc: "หมูเกาะเวสตอินดีสมักถูกมองขามเมื่อเทียบกับดินแดนฝงตะวันออก แตก็อุดมดวยทรัพยากรไมแพกัน การทําใหโครงสรางพื้นฐานเพียงพอคือกาวแรกสูการเพิ่มอุตสาหกรรมและการสกัดทรัพยากรในพื้นที่"
 HOL_expand_curacao_oil_refineries: "ขยายโรงกลั่นนํ้ามันกูราเซา"
 HOL_expand_curacao_oil_refineries_desc: "เนื่องจากทะเลสาบมาราไกโบมีความตื้น ตั้งแตป 1918 นํ้ามันเวเนซุเอลาแทบทั้งหมดจึงถูกขนสงดวยเรือชายฝงกินนํ้าตื้นไปกลั่นที่อารูบาและกูราเซา แลวจึงสงตอไปทั่วโลกดวยเรือบรรทุกนํ้ามันเดินสมุทร โรงกลั่นของเราที่นั่นใหญที่สุดในโลกอยูแลว แตวิกฤตโลกที่กําลังจะมาถึงอาจทําใหจําเปนตองขยายสิ่งอํานวยความสะดวกเพิ่มอีก"
 HOL_expand_curacao_oil_refineries_tt: "ปลดล็อก§Yรอยัล ดัตช เชลล§!ในฐานะบริษัทอุตสาหกรรม\n"
 HOL_open_second_paranam_bauxite_mine: "เปดเหมืองบอกไซตปารานัมแหงที่สอง"
 HOL_open_second_paranam_bauxite_mine_desc: "บอกไซตจากซูรินาเมมีความสําคัญอยางยิ่งตอการผลิตอะลูมิเนียมสําหรับอุตสาหกรรมเครื่องบินของมหาอํานาจ ดวยการเสริมสรางกําลังทหารทั่วโลกในขณะนี้ ความตองการอะลูมิเนียมไดพุงสูงขึ้นอยางมาก เราจึงเพิ่มการสงออกไดแนนอนหากเปดเหมืองบอกไซตแหงที่สองที่ปารานัม"
 HOL_antilles_defenses: "แนวปองกันแอนทิลลีส"
 HOL_antilles_defenses_desc: "เมื่อพิจารณาถึงความสําคัญมหาศาลของโรงกลั่นนํ้ามันของเราที่อารูบาและกูราเซา ก็ไมแปลกที่ฝายตางชาติที่มีผลประโยชนในโรงกลั่นเหลานี้ดูจะกังวลอยางมากกับแนวปองกันอันออนแอของเราที่นี่ หากเราตองการเลี่ยงไมใหฝายเหลานั้นรูสึกวาตองมาปองกันหมูเกาะแทนเรา บางทีเราควรปรับปรุงแนวปองกันเอง..."
 HOL_pre_empt_venezuelan_aggression_tt: "ไมมีจิตวิญญาณแหงชาติ§Yผูเฝามองมหาสงครามดวยความหวาดผวา§!"
 HOL_pre_empt_venezuelan_aggression: "ชิงตัดหนาการรุกรานของเวเนซุเอลา"
 HOL_pre_empt_venezuelan_aggression_desc: "เวเนซุเอลาแสดงใหเห็นชัดเจนแลววาหมายตาหมูเกาะแอนทิลลีสของเรา ครั้งนี้พวกเขาอาจแคพยายาม 'เสนอการคุมครอง' แตไมมีใครรูวาพวกเขาจะทําอะไรหากสถานการณของเราแยลง เราตองโจมตีกอน และรักษาความปลอดภัยของโรงกลั่นนํ้ามันของเราไว"
 HOL_the_crown_jewel_colony: "อาณานิคมอัญมณีแหงมงกุฎ"
 HOL_the_crown_jewel_colony_desc: "อินเดียสําคัญตออังกฤษเพียงใด อินดีสตะวันออกก็สําคัญตอเราเพียงนั้น อยางไรก็ตาม โครงสรางพื้นฐานที่ลาสมัยในอินดีสตะวันออกปจจุบันใชการไมไดในยุคสมัยใหมนี้ ความภาคภูมิใจของชาติตองไดรับการดูแลอยางสมฐานะ โครงสรางพื้นฐานจึงจะไดรับการปรับปรุงใหทันสมัย เพื่อใหสอดคลองกับสิ่งที่สวนสําคัญเชนนี้ของชาติพึงมี"
 HOL_java: "ชวา"
 HOL_java_desc: "เกาะที่ตั้งเมืองหลวงของอินดีสตะวันออกควรไดรับการลงทุนอยางหนัก เพื่อใหมีระดับการพัฒนาอุตสาหกรรมที่เหมาะสมกับยุคสมัย"
 HOL_reinforce_java: "เสริมกําลังชวา"
 HOL_reinforce_java_desc: "ชวาเปนที่อยูของประชากรและอุตสาหกรรมสวนใหญของหมูเกาะอินดีสตะวันออก รวมถึงเมืองหลวง ฐานทัพ และกองบัญชาการหลักทั้งหมด จึงเปนเกาะที่สําคัญที่สุดในอินดีสตะวันออกอยางไมตองสงสัย เราควรปรับปรุงแนวปองกันเพื่อใหมั่นใจวาจะยังควบคุมเกาะนี้ไวไดแมจะสูญเสียทุกอยางไปแลวก็ตาม"
 HOL_the_foundations_of_defense: ""รากฐานแหงการปองกัน""
 HOL_the_foundations_of_defense_desc: ""Defensiegrondslagen van Nederlands-Indië" เปนรายงานที่รางขึ้นในป 1927 เพื่อวิเคราะหความสามารถในการปองกันอาณานิคมของเรา เมื่อญี่ปุนแสดงความกาวราวมากขึ้นในระยะหลัง และเรารูดีวาพวกเขาหมายตาอินดีสตะวันออก บางทีเราควรปดฝุนเอกสารนี้ และใหความสําคัญกับจุดออนในการปองกันที่รายงานระบุไวเปนอันดับแรกในการจัดสรรทรัพยากรที่เพิ่งไดมา"
 HOL_the_foundations_of_defense_tt: "ตั้ง§Yฐานทัพเรือ§!ในซูราบายาเปนระดับสูงสุด\n"
 HOL_sumatra: "สุมาตรา"
 HOL_sumatra_desc: "แมจะเปนผืนแผนดินตอเนื่องที่ใหญที่สุดที่อยูในอินดีสตะวันออกทั้งหมด แตสุมาตรา เพื่อนบานทางเหนือของชวา กลับลาหลังอยางมากดานอุตสาหกรรมและโครงสรางพื้นฐาน เราควรแกไขเรื่องนี้ทันที"
 HOL_borneo_and_the_grote_oost: "บอรเนียวและดินแดนตะวันออกใหญ"
 HOL_borneo_and_the_grote_oost_desc: "เกาะบอรเนียวอันกวางใหญ และเกาะอื่น ๆ ที่เรียกรวมกันวา 'De Grote Oost' ('ดินแดนตะวันออกใหญ') เชน สุลาเวสีและหมูเกาะโมลุกกะ ควรไดรับการพัฒนาใหเขาถึงไดงายขึ้นสําหรับประชากรที่เพิ่มขึ้นของเรา เพื่อใหอุตสาหกรรมเขามาตั้งในพื้นที่เหลานี้มากขึ้น"
 HOL_curtail_colonial_autonomy: "ลดทอนอํานาจปกครองตนเองของอาณานิคม"
 HOL_curtail_colonial_autonomy_desc: "เปนไปไดวาเนเธอรแลนดภาคพื้นทวีปอาจถูกยึดครองแมเราจะเตรียมการอยางดีที่สุดแลว ในกรณีนั้นเราควรมองหาทางเลือกอื่น และหนึ่งในความเปนไปไดคือการยายรัฐบาลไปยังเมืองหลวงของอินดีสตะวันออกของดัตช คือเมืองปตตาเวียบนเกาะชวา เราควรแจงใหฝายบริหารอาณานิคมทราบอยางชัดเจนวาเราอาจเขาควบคุมกิจการของพวกเขาโดยตรงในเร็ว ๆ นี้"
 HOL_continue_the_war_in_batavia: "ทําสงครามตอที่ปตตาเวีย"
 HOL_continue_the_war_in_batavia_desc: "การรุกรานที่เราหวาดกลัวไดเกิดขึ้นแลว และแนวปองกันของเราถูกกวาดทิ้ง รัฐบาลหลบหนีออกมาไดและบัดนี้ลี้ภัยอยูในความดูแลของพันธมิตร แมสมเด็จพระราชินีจะทรงตองการใหรัฐบาลลี้ภัยตอไปและอยู 'ใกลสมรภูมิ' ในยุโรป แตเราคิดวาถึงเวลายายไปยังอินดีสตะวันออก และทําสงครามตอจากที่นั่นในฐานะรัฐอธิปไตย"
 HOL_continue_the_war_in_batavia_tt: "ซึ่งให:\n"
 HOL_a_western_capital: "เมืองหลวงตะวันตก"
 HOL_a_western_capital_desc: "อุตสาหกรรมพลเรือนในชวาตองขยายอยางมากเพื่อรองรับอุตสาหกรรมสงครามที่เราตองใชในการปลดปลอยมาตุภูมิ"
 HOL_expand_the_colonial_army: "ขยายกองทัพอาณานิคม"
 HOL_expand_the_colonial_army_desc: "สิ่งหนึ่งที่อินดีสตะวันออกไมขาดแคลนคือกําลังพล ไมวาจะตองใหสัมปทานหรือคํามั่นใดก็ตาม เราตองทําใหการรับราชการทหารนาดึงดูดยิ่งขึ้น พรอมทั้งทําใหชัดเจนวาทหารเกณฑใหมจากอาณานิคมคือแนวปองกันเดียวของหมูเกาะตอความโลภของญี่ปุน"
 HOL_colonial_shipbuilding: "การตอเรือในอาณานิคม"
 HOL_colonial_shipbuilding_desc: "เมื่อเนเธอรแลนดลมสลาย อูตอเรือในภาคพื้นทวีปของเราก็สูญเสียไปดวย เราตองจัดสรรทรัพยากรเพื่อสรางอูตอเรือแหงใหมทางตะวันออก หากเราจะเสริมสรางกําลังทางเรือ"
 HOL_the_east_indies_war_machine: "เครื่องจักรสงครามแหงอินดีสตะวันออก"
 HOL_the_east_indies_war_machine_desc: "เราไมอาจพึ่งพาพันธมิตรในเรื่องยุทโธปกรณและกระสุนตอไปได เรามีทรัพยากรอุดมสมบูรณ บัดนี้เราตองสรางอุตสาหกรรมเพื่อใชทรัพยากรเหลานี้ปอนเครื่องจักรสงครามของเรา"
 HOL_prepare_for_our_return: "เตรียมพรอมกลับคืนสูมาตุภูมิ"
 HOL_prepare_for_our_return_desc: "เราตองการเรือขนสงจํานวนมากเพื่อลําเลียงกองทหารกลับสูภาคพื้นทวีป หากตองการชวยปลดปลอยมาตุภูมิ อูตอเรือที่มากขึ้นและการพัฒนาฝมือการตอเรือสินคาใหสมบูรณแบบนาจะตอบสนองความตองการนี้ได"
 HOL_liberation: "การปลดปลอย"
 HOL_liberation_desc: "มาตุภูมิของเราไดรับการปลดปลอยแลว และกองทัพที่ยอมแพตอนเรายอมจํานนก็ไดรับอิสรภาพและกระหายการลางแคน ขวัญกําลังใจพุงทะยานขณะที่ฝูงชนตอนรับผูปลดปลอยดวยความปติยินดี และประชาชนจะไมยอมใหผูรุกรานรายใดยํ่ายีงาย ๆ อีก"
 HOL_abandon_the_gold_standard: "เลิกใชมาตรฐานทองคํา"
 HOL_abandon_the_gold_standard_desc: "การไมยอมเลิกมาตรฐานทองคําทําใหเราสูญเสียทรัพยากรมหาศาลในชวงหลายปที่ผานมา เมื่อฝรั่งเศสออกจากกลุมทองคําแลว ก็เหลือเพียงสวิตเซอรแลนดกับเรา ถึงเวลาปลอยใหคาเงินกิลเดอรลดลง และนําทรัพยากรที่ไดคืนมาไปปรับปรุงแนวปองกันที่ยํ่าแยของเรา"
 HOL_continue_the_public_works: "สานตอโครงการสาธารณูปโภค"
 HOL_continue_the_public_works_desc: "เราตองสานตอโครงการสาธารณูปโภคครั้งใหญที่เริ่มในชวงปลายทศวรรษ 1920 การถมทะเลสรางแผนดินและการกอสรางคลอง ถนน และอุโมงคใหมไมเพียงสรางงาน แตยังชวยพัฒนาประเทศดวย"
 HOL_finish_the_noordoostpolder: "สรางนอรดโอสตโพลเดอรใหเสร็จ"
 HOL_finish_the_noordoostpolder_desc: "หลังปดกั้นซาวเดอรซีดวยการสรางเขื่อนอัฟสลยตไดก และเกิดเปนทะเลสาบเทียมไอสเซิลเมรแลว บัดนี้เราตองทําโครงการถมทะเลนอรดโอสตโพลเดอรใหเสร็จ ซึ่งจะทําใหเรามีโครงสรางพื้นฐานที่ดีขึ้นและมีพื้นที่ขยายอุตสาหกรรมและเกษตรกรรมมากขึ้น"
 HOL_the_maastunnel: "อุโมงคมาส"
 HOL_the_maastunnel_desc: "แมนํ้าสายใหญของเราเปนอุปสรรคมหาศาล แตการขุดอุโมงคลอดใตแมนํ้าจะปรับปรุงโครงสรางพื้นฐานของเราไดอยางมาก อุโมงคมาสจะเปนแหงแรก ซึ่งจะทําใหเขาถึงเมืองรอตเทอรดามจากทางใตไดสะดวกขึ้นมาก"
 HOL_expand_the_artillerieinrichtingen: "ขยายอารทิลเลอรีอินริชทิงเงิน"
 HOL_expand_the_artillerieinrichtingen_desc: "อารทิลเลอรี-อินริชทิงเงินผลิตกระสุนและอาวุธเบาจํานวนเล็กนอย (ภายใตใบอนุญาต) ใหกองทัพของเรา ควรขยายโรงงานนี้หากเราตั้งเปาจะเพิ่มกําลังทหาร"
 HOL_expand_the_artillerieinrichtingen_tt: "ปลดล็อก§YA. I. Hembrug§!ในฐานะผูออกแบบยุทโธปกรณ\n"
 HOL_philips_focus: "ฟลิปส"
 HOL_philips_focus_desc: "ฟลิปสเปนผูนําตลาดดานวิทยุและอิเล็กทรอนิกสอื่น ๆ มานาน บางทีการทําสัญญาและใหทุนแกบริษัทอิเล็กทรอนิกสของดัตชแหงนี้อาจทําใหเราประสบความกาวหนาของเราเองในยุทโธปกรณทางทหารประเภทนี้ซึ่งมีความสําคัญมากขึ้นเรื่อย ๆ"
 HOL_philips_focus_tt: "ปลดล็อก§Yฟลิปส§!ในฐานะบริษัทอุตสาหกรรม\n"
 HOL_expand_RD_facilities: "ขยายสถานวิจัยและพัฒนา"
 HOL_expand_RD_facilities_desc: "การขยายอุตสาหกรรมและความกาวหนาอื่น ๆ ในระยะหลังอาจทําใหเราทําการวิจัยและพัฒนาคูขนานกันไดมากขึ้น โดยเฉพาะหากเราขยายตอยอดจากสถานที่ที่ฟลิปสมีอยูแลว"
 HOL_the_zuiderzee_works: "สานตอโครงการซาวเดอรซี"
 HOL_the_zuiderzee_works_desc: "ขั้นตอไปของการถมทะเลคือเฟลโวโพลเดอร ซึ่งตั้งชื่อตามทะเลสาบเฟลโวโบราณที่มีการกลาวถึงครั้งแรกในสมัยโรมัน นี่เปนโครงการมหึมาที่ตองใชเวลาหลายปจึงจะเสร็จสมบูรณ แตแมในระยะสั้นก็จะใหผลตอบแทนแกเราอยางงาม"
 HOL_develop_the_randstad: "พัฒนาแรนดสตัด"
 HOL_develop_the_randstad_desc: "ดวยการพัฒนาเมืองใหญที่สุดของเราและพื้นที่ที่เชื่อมตอเมืองเหลานั้นใหยิ่งขึ้นไปอีก เราสามารถวางรากฐานของสิ่งที่บางคนเริ่มเรียกวา 'นครวงแหวน' ซึ่งเปนเขตเมืองรูปวงกลมคราว ๆ ที่เชื่อมเมืองใหญอยางอัมสเตอรดัม เดอะเฮก รอตเทอรดาม และยูเทรกต ลอมรอบ 'Groene Hart' หรือ 'หัวใจสีเขียว' ที่อยูใจกลางของ 'วงแหวน'"
 HOL_expand_the_ijmuiden_steel_mill: "ขยายโรงถลุงเหล็กไอมาวเดิน"
 HOL_expand_the_ijmuiden_steel_mill_desc: "อุตสาหกรรมสงครามของเราตองการเหล็กกลาจํานวนมาก และเราตองขยายโรงงานที่มีอยูแลวที่ไอมาวเดิน"
 HOL_fokker: "ฟอกเกอร"
 HOL_fokker_desc: "ฟอกเกอร ผูนําโลกดานการผลิตเครื่องบินพลเรือน กระตือรือรนอยางยิ่งที่จะไดสรางเครื่องบินทหารเพิ่ม บางทีเราควรปลอยใหพวกเขาทํา และสนับสนุนการขยายอุตสาหกรรมที่จําเปนตอเรื่องนี้"
 HOL_fokker_tt: "ปลดล็อก§Yฟอกเกอร§!ในฐานะผูออกแบบอากาศยาน\n"
 HOL_domestic_jet_engine_designs: "การออกแบบเครื่องยนตไอพนในประเทศ"
 HOL_domestic_jet_engine_designs_desc: "ผูสรางอากาศยานหัวนวัตกรรมของเราควรไดรับการสนับสนุนใหทดลองการออกแบบแหงอนาคต แมผลลัพธอาจไมใชเครื่องบินไอพนที่ใชงานไดในทันที แตยอมนําไปสูการปรับปรุงการผลิตอากาศยานโดยรวมอยางแนนอน"
 HOL_develop_the_zandstad: "พัฒนาซันดสตัด"
 HOL_develop_the_zandstad_desc: "แทนที่จะทุมความพยายามทั้งหมดไปกับการพัฒนาเมืองใหญที่สุด เราควรกระจายอุตสาหกรรมใหมไปยังพื้นที่รอบนอกใหมากขึ้น"
 HOL_friesland_agricultural_impetus: "กระตุนเกษตรกรรมฟรีสแลนด"
 HOL_friesland_agricultural_impetus_desc: "การเพิ่มผลผลิตทางการเกษตรของประเทศเล็ก ๆ ของเราจะชวยอยางมากในการพึ่งพาตนเอง และลดความจําเปนในการนําเขา"
 HOL_daf: "DAF"
 HOL_daf_desc: "อุตสาหกรรมรถยนตในประเทศของเราไมใชวาไมมีเลย และอาจทําสัญญาใหผลิตยานพาหนะทางทหารได ดวยความชวยเหลือจากรัฐเล็กนอย Van Doorne's Aanhangwagen Fabriek (DAF) อาจสามารถจัดหายุทโธปกรณยานยนตและยานเกราะลําเลียงพลทั้งหมดที่กองทัพของเราตองการได"
 HOL_daf_tt: "ปลดล็อก§YDAF§!ในฐานะผูออกแบบยุทโธปกรณ\n"
 HOL_domestic_vehicle_designs: "การออกแบบยานพาหนะในประเทศ"
 HOL_domestic_vehicle_designs_desc: "การใหอุตสาหกรรมยานยนตมีอิสระในการจัดการแบบของตนมากขึ้นอาจสงผลพลอยไดในการปรับปรุงประสิทธิภาพการผลิตดวย"
 HOL_continental_shipbuilding: "การตอเรือในภาคพื้นทวีป"
 HOL_continental_shipbuilding_desc: "อูตอเรือของเราในฮอลแลนด เซลันด และฟรีสแลนดตองขยายอยางมาก เพื่อรองรับแผนการตอเรือรบขนาดใหญใด ๆ"
 HOL_domestic_innovation: "นวัตกรรมในประเทศ"
 HOL_domestic_innovation_desc: "การพัฒนาอุตสาหกรรมอยางรวดเร็วของชาติเราไดเปดโอกาสใหมดานการวิจัยและพัฒนาที่เราควรไขวควา"
 HOL_make_use_of_our_riches: "ใชความมั่งคั่งของเราใหเกิดประโยชน"
 HOL_make_use_of_our_riches_desc: "ชาติของเรามีทรัพยากรระดับมหาอํานาจ ทวาสวมเสื้อคลุมของชาติเล็ก บางทีหากเราใชความมั่งคั่งที่มีอยูใหเกิดประโยชนมากขึ้น เราอาจกาวขึ้นสูระดับกลาง หรือแมแตกลับมายืนในหมูมหาอํานาจชั้นนําของโลกอีกครั้ง"
 HOL_the_ultimate_deterrent: "เครื่องยับยั้งขั้นสุดยอด"
 HOL_the_ultimate_deterrent_desc: "กองทัพอากาศและกองทัพเรือที่ทรงพลังก็ดีอยูหรอก แตสิ่งที่จะยับยั้งไมใหใครกลาโจมตีอาณานิคมของเราหรือละเมิดความเปนกลางของเราไดอยางแทจริง คือการพัฒนาระเบิดปรมาณู"
 HOL_overturn_military_budget_cuts: "ยกเลิกการตัดงบประมาณทหาร"
 HOL_overturn_military_budget_cuts_desc: "เศรษฐกิจเริ่มฟนตัวเร็วอยางนาประหลาดใจหลังเราเลิกใชมาตรฐานทองคํา... การตัดงบประมาณทหารที่เราจําตองทําเพื่อไมใหคาเงินกิลเดอรลดลงจึงสามารถยกเลิกไดแลว"
 HOL_prepare_the_inundation_lines: "เตรียมแนวนํ้าทวม"
 HOL_prepare_the_inundation_lines_desc: "นับตั้งแตสงครามประกาศเอกราชกับสเปนในศตวรรษที่ 16 การปลอยนํ้าทวมแผนดินโดยเจตนาก็เปนสวนสําคัญของการปองกันของเรามาตลอด หากเตรียมการอยางเหมาะสม มันจะชวยเราไดอีกครั้งแนนอน เพราะเรายังไมเคยเห็นรถถังที่ขามนํ้าได"
 HOL_prepare_the_inundation_lines_tt: "สิ่งเหลานี้ชวยใหสามารถ§Yปลอยนํ้าทวม§!และ§Yระบายนํ้า§!ในบางจังหวัดรอบปอมปราการฮอลแลนดได ซึ่งใหโบนัสการปองกัน\n"
 HOL_protect_against_britain: "ปองกันอังกฤษ"
 HOL_protect_against_britain_desc: "ความเปนกลางที่แทจริงหมายความวาเราจะปกปองอํานาจอธิปไตยจากผูใดก็ตามที่ละเมิด... แมผูนั้นจะเปนอังกฤษที่พยายามปกปองทาเรือและสนามบินของเราจากเยอรมนีอยางผิดที่ผิดทางก็ตาม"
 HOL_further_reinforce_the_ports: "เสริมกําลังทาเรือเพิ่มเติม"
 HOL_further_reinforce_the_ports_desc: "เราควรเสริมแนวปองกันชายฝงใหแข็งแกรงยิ่งขึ้น เพื่อไมใหอังกฤษคิด "ยื่นความชวยเหลือใหเรา" โดยไมไดรับอนุญาตอยางชัดแจง"
 HOL_southward_defenses: "แนวปองกันทางใต"
 HOL_southward_defenses_desc: "เราตองสรางแนวปองกันตามแมนํ้าเมิซ เพื่อสกัดการรุกขึ้นเหนือผานเบลเยียม การเสริมแนวปองกันชายฝงขั้นสุดทายจะทําลายแผนของอังกฤษที่จะยกกองกําลังสํารวจขึ้นบกที่ทาเรือของเราลงอยางเด็ดขาด"
 HOL_germany_is_the_greater_threat: "เยอรมนีคือภัยที่ใหญกวา"
 HOL_germany_is_the_greater_threat_desc: "ดวยความกาวราวที่เพิ่มขึ้นของเยอรมนี เราควรหันแนวปองกันไปทางตะวันออก เผื่อวาพวกเขาจะเคารพความเปนกลางของเรานอยกวาในสงครามครั้งกอน..."
 HOL_fortress_holland: "ปอมปราการฮอลแลนด"
 HOL_fortress_holland_desc: "เราตองเดิมพันทุกอยางกับปอมปราการฮอลแลนด พื้นที่ทางเหนือของแมนํ้าสายใหญและทางตะวันตกของไอสเซิลเมรครอบคลุมประชากรและอุตสาหกรรมสวนใหญของเรา การสละพื้นที่สวนที่เหลือของประเทศอาจทําใหเรายืนหยัดในเขตอุตสาหกรรมไดนานพอใหพันธมิตรที่ทรงพลังกวามาชวยไดทันเวลา"
 HOL_modernize_the_grebbeline: "ปรับปรุงแนวเกรบเบอใหทันสมัย"
 HOL_modernize_the_grebbeline_desc: "แนวรบทางใตของปอมปราการฮอลแลนดไดรับการปองกันอยางดีจากแมนํ้าสายใหญ ไดแก แมนํ้าไรนและแมนํ้าเมิซ ซึ่งเหลือเพียงชองวางทางตะวันออกของอัมสเตอรดัม ระหวางไอสเซิลเมรทางเหนือกับแมนํ้าไรนทางใต แนวปองกันที่ตั้งอยูตรงนี้คือแนวเกรบเบอ ตองไดรับการปรับปรุงและเสริมกําลังหากจะตานทานการโจมตีอยางมุงมั่นได"
 HOL_war_on_pacifism: "สงครามกับลัทธิสันตินิยม"
 HOL_war_on_pacifism_desc: "นับตั้งแตมหาสงคราม ลัทธิสันตินิยมไดแพรระบาดในหมูชาวดัตช ทําใหแทบเปนไปไมไดที่จะสรางกองทัพสมัยใหม 'เจตจํานงของประชาชน' ไดขัดขวางการจัดสรรงบประมาณที่จําเปนใหกองทัพมานานเกินไปแลว พวกเขาไมรูถึงอันตรายที่ตนเองกําลังเผชิญ... เราจะประกาศสงครามกับลัทธิสันตินิยม และขจัดความรูสึกที่ไมกอประโยชนนี้ออกจากจิตใจของประชาชน!"
 HOL_war_on_pacifism_tt: "การตัดสินใจเหลานี้ชวยใหสามารถ§Gลด/ขจัด§!§Yผูเฝามองมหาสงครามดวยความหวาดผวา§!\n"
 HOL_appoint_new_supreme_commander: "แตงตั้งผูบัญชาการสูงสุดคนใหม"
 HOL_appoint_new_supreme_commander_desc: "ผูบัญชาการสูงสุดของเราดื้อรั้นยึดติดกับแผนปองกันที่เปนไปไมไดโดยสิ้นเชิง เขาควรถูกแทนที่ อองรี วิงเคิลมัน อาจถูกเรียกตัวกลับจากการเกษียณ และนาจะเปนทางเลือกที่... วางาย... กวา"
 HOL_appoint_new_supreme_commander_tt: "§Yอองรี วิงเคิลมัน§!ไดเปนจอมพล\n"
 HOL_modernize_our_infantry_equipment: "ปรับปรุงยุทโธปกรณทหารราบใหทันสมัย"
 HOL_modernize_our_infantry_equipment_desc: "ยุทโธปกรณทหารราบของเราลาสมัยอยางนาตกใจ หากเราจะมีโอกาสหยุดยั้งการรุกรานใด ๆ ได เรื่องนี้ตองไดรับการแกไข"
 HOL_modernize_our_infantry_equipment_tt: "สิ่งนี้จะทําใหเรามุงเนนการพัฒนายุทโธปกรณภายในประเทศมากกวาการผลิตภายใตใบอนุญาตในอนาคต\n"
 HOL_production_under_license: "ผลิตภายใตใบอนุญาต"
 HOL_production_under_license_desc: "เนื่องจากเราไมมีอุตสาหกรรมอาวุธในประเทศที่พอจะกลาวถึงได เราควรมองหาอาวุธเบาและปนใหญรุนใหมจากตางประเทศ หากโชคดี เราอาจไดสิทธิ์ผลิตอาวุธเหลานี้ในประเทศภายใตใบอนุญาต"
 HOL_production_under_license_tt: "สิ่งนี้จะทําใหเรามุงเนนการผลิตภายใตใบอนุญาตมากกวาการพัฒนายุทโธปกรณภายในประเทศในอนาคต\n"
 HOL_light_tanks_for_the_colonies: "รถถังเบาสําหรับอาณานิคม"
 HOL_light_tanks_for_the_colonies_desc: "รถถังเบาเหมาะอยางยิ่งในการปองกันภูมิประเทศอันกวางใหญและยากลําบากของอาณานิคมหมูเกาะของเราจากการยกพลขึ้นบกของทหารราบ"
 HOL_light_tanks_for_the_colonies_tt: "ขึ้นอยูกับวาคุณเลือกมุงเนนการปรับปรุงใหทันสมัยหรือการผลิตภายใตใบอนุญาต แผนยุทธศาสตรนี้จะใหอยางใดอยางหนึ่งตอไปนี้:\n"
 HOL_light_tanks_for_the_colonies_2tt: "หรือ:\n"
 HOL_secret_staff_talks: "การหารือลับของฝายเสนาธิการ"
 HOL_secret_staff_talks_desc: "แมอยางเปนทางการเราจะเปนกลาง แตเราก็ควรพิจารณาการหารือลับระดับเสนาธิการกับเพื่อนบาน แผนปองกันรวมที่วางไวกับเพื่อนบานรายใดรายหนึ่ง แมจะไมเปนทางการ ก็อาจมีความสําคัญมหาศาลหากเราถูกอีกรายหนึ่งรุกราน"
 HOL_secret_staff_talks_tt: "สิ่งเหลานี้ทําใหสามารถไดรับโบนัส§Yยุทโธปกรณ§! โบนัสการรบ§Yเชิงรุก§!และ§Yเชิงรับ§! โบนัสการวิจัย§Yหลักนิยมภาคพื้นดิน§! และ £legitimacy §Yความชอบธรรม§!ของรัฐบาลพลัดถิ่น\n"
 HOL_anti_tank_guns_for_the_continent: "ปนตอสูรถถังสําหรับภาคพื้นทวีป"
 HOL_anti_tank_guns_for_the_continent_desc: "นับตั้งแตมหาสงคราม เราไดเห็นเพื่อนบานในภาคพื้นทวีปพัฒนาการออกแบบรถถังใหดีขึ้น หากการรุกรานมาถึง เครื่องจักรเหลานี้ยอมเปนสวนสําคัญของการรุกรานอยางแนนอน เราตองเตรียมการใหสอดคลองกัน"
 HOL_lessons_from_the_last_war: "บทเรียนจากสงครามครั้งกอน"
 HOL_lessons_from_the_last_war_desc: "แมเราอาจไมไดเขารวม แตเราก็มีที่นั่งชั้นดีในการเฝาดูแผนการและความลมเหลวของแผนชลีฟเฟนที่หนาประตูบานเรา เราตองสรุปบทเรียนจากการสังเกตการณเหลานี้"
 HOL_expand_the_mld: "ขยาย MLD"
 HOL_expand_the_mld_desc: "สวนที่สําคัญที่สุดของกองทัพอากาศของเราคือเหลาการบินนาวี หรือ Marine Luchtvaart Dienst (MLD) เราตองขยายเหลานี้ ปรับปรุงฐานปฏิบัติการหลักในอินดีสตะวันออก และพัฒนายุทธวิธีและยุทธศาสตรใหมในการใชงาน"
 HOL_protect_the_mainland: "ปกปองแผนดินแม"
 HOL_protect_the_mainland_desc: "เพื่อปกปองเนเธอรแลนดภาคพื้นทวีป เราตองจัดหาฝูงเครื่องบินขับไลสมัยใหม เพื่อรักษาความเหนือกวาทางอากาศเหนือนานฟาของเรา"
 HOL_protect_the_colonies: "ปกปองอาณานิคม"
 HOL_protect_the_colonies_desc: "เราตองประจําการเครื่องบินทิ้งระเบิดทางทะเลสมัยใหมจํานวนมากขึ้นในอาณานิคม เพื่อยับยั้งความพยายามยกพลขึ้นบกใด ๆ และเพื่อปองกันหากจําเปน"
 netherlands_has_no_colonies_tt: "§Yเนเธอรแลนด§!หรือรัฐในอารักขาของตนไมไดครอบครอง§Yดินแดนอาณานิคม§!เริ่มตนแหงใดเลย"
 HOL_modernize_the_air_fleet: "ปรับปรุงกองบินใหทันสมัย"
 HOL_modernize_the_air_fleet_desc: "เราตองเรงการจัดหาเครื่องบินรุนที่จําเปนตอการปองกันเฉพาะหนาอยางจริงจัง เวลาเหลือนอยแลว!"
 HOL_strategic_bombing_defense: "การปองกันการทิ้งระเบิดทางยุทธศาสตร"
 HOL_strategic_bombing_defense_desc: "หากสงครามมาถึงเนเธอรแลนด ยอมตองมีการทิ้งระเบิดทางยุทธศาสตรในขนาดใหญที่สุดเทาที่จะนึกได เราตองพัฒนาหลักนิยมใหมเพื่อรับมือภัยคุกคามนี้ และตองขยายฐานทัพอากาศในภาคพื้นทวีปเพื่อรองรับกองทัพอากาศขนาดใหญที่หลักนิยมเหลานี้ตองการ"
 HOL_longer_range_models: "รุนพิสัยไกลขึ้น"
 HOL_longer_range_models_desc: "การครองทะเลเปนสิ่งจําเปนตอบูรณภาพของจักรวรรดิอาณานิคมของเรา อยางไรก็ตาม ทองทะเลนั้นกวางใหญ เราจึงตองการเครื่องบินที่มีพิสัยเพียงพอ"
 HOL_unsinkable_aircraft_carriers: "เรือบรรทุกเครื่องบินที่ไมมีวันจม"
 HOL_unsinkable_aircraft_carriers_desc: "เมื่อมิติที่สามของสงครามมาถึง เราควรทําใหกองเรือของเรามีการคุมกันทางอากาศอยางเพียงพอ อยางไรก็ตาม เรือบรรทุกเครื่องบินที่เปนแคเหล็กกลาและจมไดนั้นเปนการลงทุนที่ไมแนนอนเหลือเกิน... ในทางกลับกัน เกาะนับพันที่กระจายอยูทั่วอินดีสตะวันออกอาจทําหนาที่เปน "เรือบรรทุกเครื่องบินที่ไมมีวันจม" ได เพียงแคเราสรางสนามบินบนเกาะเหลานั้น"
 HOL_aviatic_aspirations: "ความใฝฝนดานการบิน"
 HOL_aviatic_aspirations_desc: "ทองฟาเปนสมรภูมิใหม แตไมใชสิ่งที่เราไมอาจเชี่ยวชาญได เราไดแสดงความสามารถในอุตสาหกรรมการบินพลเรือนมาแลว การถายทอดสิ่งนั้นไปสูวงการทหารก็คงไมยากนัก"
 HOL_prepare_naval_expansion: "เตรียมขยายกองทัพเรือ"
 HOL_prepare_naval_expansion_desc: "เราควรเตรียมการขยายกองทัพเรือไวลวงหนาแตเนิ่น ๆ จึงควรเริ่มทุมทรัพยากรไปกับการขยายการตอเรือของดัตชตั้งแตบัดนี้เลย"
 HOL_expand_the_amsterdam_petroleum_harbor: "ขยายทาเรือปโตรเลียมอัมสเตอรดัม"
 HOL_expand_the_amsterdam_petroleum_harbor_desc: "การขยายขนาดกองทัพเรือตองมาพรอมการขยายคลังเชื้อเพลิงในสัดสวนที่ใกลเคียงกัน มิฉะนั้นเราจะมีเรือที่ไมมีปญญาใชงาน ทาเรือปโตรเลียมอัมสเตอรดัมเปนศูนยกลางการนําเขาเชื้อเพลิงอยูแลว เราจะเพิ่มความจุในการเก็บรักษาใหมากขึ้นอีก"
 HOL_cornerstone_of_colonial_defense: "ศิลาฤกษแหงการปองกันอาณานิคม"
 HOL_cornerstone_of_colonial_defense_desc: "กองเรือคือเสาหลักที่สําคัญที่สุดในการปองกันจักรวรรดิอาณานิคมของเรา เราควรพิจารณาวาจะใชสิ่งที่มีอยูใหเกิดประโยชนสูงสุดไดอยางไร"
 HOL_rely_on_submarines: "พึ่งพาเรือดํานํ้า"
 HOL_rely_on_submarines_desc: "แมแตเรือลาดตระเวนสมัยใหมก็ชวยอะไรไมไดเมื่อตองสูกับกองทัพเรือขนาดมหึมาที่เราอาจตองเผชิญ เราจะลงทุนในเรือดํานํ้าสมัยใหมแทน เพื่อถวงเวลาการรุกของขาศึกจนกวากองเรือของพันธมิตรที่ทรงพลังกวาจะมาถึง"
 HOL_modernize_the_cruiser_fleet: "ปรับปรุงกองเรือลาดตระเวนใหทันสมัย"
 HOL_modernize_the_cruiser_fleet_desc: "เรือลาดตระเวนมีความสําคัญยิ่งตอแผนปองกันอินดีสตะวันออกของเรา แตเรือที่เรามีอยูตอนนี้ลวนเปนแบบเกา เราจะออกแบบเรือรบรุนใหมที่สามารถเริ่มสรางไดโดยเร็วที่สุด"
 HOL_the_battlecruiser_plan: "แผนเรือลาดตระเวนประจัญบาน"
 HOL_the_battlecruiser_plan_desc: "เริ่มมีเสียงสนับสนุนใหสรางเรือลาดตระเวนประจัญบานสามลํา ซึ่งใหญกวาเรือใด ๆ ที่เราเคยสรางหรือออกแบบมา ดวยไมตรีจากเยอรมนี พวกเขาอาจมอบแบบแปลนของเรือลาดตระเวนประจัญบานชารนฮอรสทใหเรา เพื่อใชเปนพื้นฐานในการออกแบบของเราเอง เรือเหลานี้ยอมยับยั้งการโจมตีใด ๆ ตออาณานิคมของเราไดแนนอน"
 HOL_the_battlecruiser_plan_tt: "§R[GER.GetNameDefCap]ตองเห็นชอบขอตกลงนี้ โบนัสจึงจะมีผล§!\n"
 HOL_air_cover_for_the_new_fleet: "การคุมกันทางอากาศสําหรับกองเรือใหม"
 HOL_air_cover_for_the_new_fleet_desc: "หากเราลงทุนในเรือลาดตระเวนประจัญบานขนาดใหญ เราก็ควรจัดการคุมกันทางอากาศใหเพียงพอ มิฉะนั้นเรือเหลานั้นจะสูญเปลา เราจะพิจารณาการออกแบบเรือบรรทุกเครื่องบิน"
 HOL_escorts_for_the_new_fleet: "เรือคุมกันสําหรับกองเรือใหม"
 HOL_escorts_for_the_new_fleet_desc: "เรือลาดตระเวนประจัญบานของเราตองการเรือคุมกันจํานวนมากเพื่อปองกันเรือตอรปโดและเรือดํานํ้า เราควรทําใหเรือคุมกันที่เราสรางทุกลําเปนแบบที่ทันสมัยที่สุดเทาที่จะเปนไปได"
 HOL_naval_heritage: "มรดกทางทะเล"
 HOL_naval_heritage_desc: "ตั้งแตปต ไฮน ถึงมีชีล เดอ เรยเตอร ประวัติศาสตรชาติเราเต็มไปดวยวีรบุรุษทางทะเลและวีรกรรมที่ประสบความสําเร็จเหนือมหาอํานาจทางทะเลในยุคนั้น ความผูกพันกับทองทะเลไหลเวียนอยูในสายเลือดของเรา เราเพียงตองโอบรับมันเพื่อฟนคืนความภาคภูมิใจและมรดกทางทะเลของเรา"
 HOL_form_new_government: "จัดตั้งรัฐบาลใหม"
 HOL_form_new_government_desc: "รัฐบาลปจจุบันของเราออนแอ และกําลังจะลมอีกครั้ง เราจะมอบหมายใหนายกรัฐมนตรีคนใหมจัดตั้งคณะรัฐมนตรีที่เขมแข็งกวา"
 HOL_gateway_to_europe: "ประตูสูยุโรป"
 HOL_gateway_to_europe_desc: "เนเธอรแลนดคือประตูการคาสูยุโรป ซึ่งคูคาของเราเขาใจดี แตแมตําแหนงนี้จะใหความแข็งแกรงแกเรา ก็ยังทําใหเราตกอยูในสถานการณที่ไมนาอิจฉา ขณะที่อังกฤษมุงปดลอมศัตรูที่นาจะเปนบนภาคพื้นทวีป เยอรมนีกลับตองการใหเราเพิ่มการคาผานประเทศของเราไปยังพวกเขา โดยใชเราเปนประตูหลังเพื่อเลี่ยงการปดลอม"
 HOL_gateway_to_europe_tt: "สิ่งเหลานี้ทําใหสามารถมอบแตมอิทธิพลทางการคาใหแก§Y[GER.GetName]§!และ§Y[ENG.GetName]§!ได\n"
 HOL_cave_to_the_germans: "ยอมตามเยอรมนี"
 HOL_cave_to_the_germans_desc: "เนื่องจากเรามีพรมแดนทางบกติดกับเยอรมนี เรายอมคาดไดวาจะถูกรุกรานหากปฏิเสธขอเรียกรองใหเพิ่มการคาผานประเทศของเรา ปลอยใหพวกเขาใชเราเปนประตูหลังเลี่ยงการปดลอมของอังกฤษไปเถอะ หากนั่นหมายถึงความปลอดภัยของเรา!"
 HOL_trade_influence_tt: "ไดรับ§Yอํานาจทางการเมือง§!เทากับยอดรวมที่ผูเขารวม§Yประตูสูยุโรป§!ทั้งหมดลงทุนไว ขณะนี้มีจํานวน:\n"
 HOL_cave_to_the_germans_tt: "@GER§Y[GER.GetName]§!มีแตมอิทธิพลทางการคามากกวา @ENG§Y[ENG.GetName]§! อยางนอย §Y15§! แตม"
 HOL_cave_to_the_germans2_tt: "@GER§Y[GER.GetName]§!มีแตมอิทธิพลทางการคาอยางนอย §Y25§! แตม"
 HOL_maintain_trade_neutrality: "รักษาความเปนกลางทางการคา"
 HOL_maintain_trade_neutrality_desc: "เราตองตานทานขอเรียกรองดานการคาจากทั้งสองฝาย และคงนโยบายการคาไวอยางที่เปนอยู การเลือกขางใดขางหนึ่งนาจะนําไปสูสงครามกับอีกฝาย..."
 HOL_maintain_trade_neutrality_tt: "ทั้ง @GER§Y[GER.GetName]§! และ @ENG§Y[ENG.GetName]§! ไมมีฝายใดมีแตมอิทธิพลทางการคามากกวาอีกฝายเกิน §Y5§! แตม\n"
 HOL_maintain_trade_neutrality2_tt: "ทั้ง @GER§Y[GER.GetName]§! และ @ENG§Y[ENG.GetName]§! มีแตมอิทธิพลทางการคาอยางนอย §Y50§! แตม\n"
 HOL_cave_to_the_british: "ยอมตามอังกฤษ"
 HOL_cave_to_the_british_desc: "อังกฤษกําลังเจรจาการคากับเราอยางดุเดือด โดยเรียกรองใหเราลดการคาผานประเทศของเราไปยังเยอรมนี เพราะกลัววาเยอรมนีจะใชเราเปนประตูหลังหนีการปดลอมของอังกฤษ หากเราปฏิเสธ อังกฤษก็จะปดลอมเราดวย... ซึ่งจะเปนหายนะตอเศรษฐกิจที่เพิ่งฟนตัวไดไมนานของเรา เราจึงไมมีทางเลือกนอกจากทําตามที่พวกเขาตองการ"
 HOL_cave_to_the_british_tt: "@ENG§Y[ENG.GetName]§!มีแตมอิทธิพลทางการคามากกวา @GER§Y[GER.GetName]§! อยางนอย §Y15§! แตม\n"
 HOL_cave_to_the_british2_tt: "@ENG§Y[ENG.GetName]§!มีแตมอิทธิพลทางการคาอยางนอย §Y25§! แตม"
 HOL_volk_en_vaderland: "ชนชาติและปตุภูมิ (Volk en Vaderland)"
 HOL_volk_en_vaderland_desc: "การตัดสินใจเขาขางเพื่อนบานรายหนึ่งมากกวาอีกรายหมายความวาเราไดละทิ้งความเปนกลางอยางเด็ดขาดแลว เสียงสนับสนุนเยอรมนีและวาทกรรมชาตินิยมที่เพิ่มขึ้นจากการตัดสินใจครั้งนี้เริ่มเห็นไดชัดในการเมืองภายในประเทศ เชน ในรูปของหนังสือพิมพขวาจัด 'ชนชาติและปตุภูมิ'"
 HOL_de_jeugdstorm: "เดอ เยอคดสตอรม"
 HOL_de_jeugdstorm_desc: "การโนมนาวประชากรใหละทิ้งลัทธิสันตินิยมอันแรงกลา และปลูกฝงวัฒนธรรมทหารนิยมภายในไมกี่ปไมใชเรื่องงาย แตดวยโฆษณาชวนเชื่อและวาทกรรมจํานวนมาก โดยเริ่มจากเยาวชนที่ยังหลอหลอมไดงาย เราจะทําใหสําเร็จไดมากที่สุดเทาที่จะทําได"
 HOL_strength_over_blood: "ความแข็งแกรงเหนือสายเลือด"
 HOL_strength_over_blood_desc: "สายเลือดไมควรเปนตัวกําหนดวาใครจะเปนผูนําหรือไม ใหผูที่แสดงความแข็งแกรงของตนเปนผูนําชาติ แทนที่จะเปนผูที่เกิดมามีเลือดสีนํ้าเงิน"
 HOL_join_germany: "เขารวมกับเยอรมนี"
 HOL_join_germany_desc: "พวกเราที่มีจิตวิญญาณเดียวกันควรรวมตัวกันตอสูกับโลก ถึงเวลาขอเขาเปนสมาชิกฝายอักษะแลว"
 HOL_german_technological_exchange: "แลกเปลี่ยนเทคโนโลยีกับเยอรมนี"
 HOL_german_technological_exchange_desc: "ดวยการเขาถึงเทคโนโลยีของเยอรมนี เราจะแบกรับภาระในการสรางระเบียบโลกใหมนี้ในสวนของเราไดดียิ่งขึ้น"
 HOL_beginnings_of_a_dutch_blitzkrieg: "จุดเริ่มตนของสงครามสายฟาแลบแบบดัตช"
 HOL_beginnings_of_a_dutch_blitzkrieg_desc: "ดวยความชวยเหลือจากเยอรมนี บางทีเราอาจรวมทําสงครามสายฟาแลบดวยกองกําลังรถถังของเราเอง"
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_1: "ไดรับ§Yใบอนุญาตการผลิต§!สําหรับ§Yรถถังขนาดกลาง§!รุนที่ดีที่สุดที่§Y[GER.GetNameDef]§!พัฒนาอยูในปจจุบัน\n"
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_2: "ไดรับโบนัสการวิจัยสําหรับ§Yรถถังขนาดกลาง§!ทุกรุนที่§Y[GER.GetNameDef]§!พัฒนาอยูในปจจุบัน\n"
 HOL_placate_the_japanese: "เอาใจญี่ปุน"
 HOL_placate_the_japanese_desc: "เปนที่รูกันวาญี่ปุนหมายตาอาณานิคมอันมั่งคั่งของเราทางตะวันออก บางทีอาจถึงเวลาตัดสินใจวาจะมอบสิทธิ์ผูกขาดทรัพยากรของหมูเกาะ หรือแมแตยกการควบคุมอาณานิคมทั้งหมดใหพวกเขา เพื่อประโยชนแหงสันติภาพและความรวมมือที่ยั่งยืน"
 HOL_assume_the_naval_burden: "รับภาระทางทะเล"
 HOL_assume_the_naval_burden_desc: "ขณะที่พันธมิตรของเราเชี่ยวชาญการรบทางบก บางทีประวัติศาสตรทางทะเลของเราอาจทําใหเราเหมาะกับการรับผิดชอบสงครามทางทะเลมากกวา"
 HOL_the_netherlands_first: "เนเธอรแลนดมากอน"
 HOL_the_netherlands_first_desc: "เนเธอรแลนดมีทรัพยากรธรรมชาติอันอุดมสมบูรณพอที่จะเปนมหาอํานาจไดดวยตนเอง หากเราใชมันอยางเหมาะสม และสรางสังคมใหเปนทหารนิยมตอไป เราก็ไมจําเปนตองพึ่งเยอรมนีในการสรางที่ยืนของเราเองในโลกนี้"
 HOL_implement_the_program: "ดําเนินการตาม "แผนงาน""
 HOL_implement_the_program_desc: "เมื่อชาติมั่นคงภายใตการนําของทานผูนําแลว ก็ถึงเวลาดําเนินการตาม 'แผนงาน' ของพรรค รัฐบาลที่เขมแข็ง การปฏิรูปเศรษฐกิจและสังคม และการยกเลิกเสรีภาพสื่อและสิทธิเลือกตั้ง เปนเพียงบางประเด็นที่จะทําใหประชาชนของเราแข็งแกรงขึ้น ทุกคนตองทําหนาที่เพื่อปตุภูมิ!"
 HOL_taking_back_french_flanders: "ทวงคืนแฟลนเดอรสของฝรั่งเศส"
 HOL_taking_back_french_flanders_desc: "ดินแดนกลุมประเทศตํ่าในประวัติศาสตรถูกแบงแยกโดยมหาอํานาจที่อยูรายรอบ ในบรรดานั้น ฝรั่งเศสยังคงถือครองดินแดนจํานวนไมนอยที่ถือเปนสวนหนึ่งของแฟลนเดอรสในประวัติศาสตร บัดนี้เราแข็งแกรงพอจะทวงคืนแลว และเราก็ควรทํา"
 HOL_the_united_netherlands: "สหราชอาณาจักรเนเธอรแลนด"
 HOL_the_united_netherlands_desc: "ประชาชนของเราแข็งแกรงกวาเมื่ออยูรวมกัน แมแตอังกฤษก็รูเรื่องนี้ดีเมื่อสรางรัฐกันชนสหราชอาณาจักรเนเธอรแลนดขึ้นหลังสงครามนโปเลียน แมจะอยูไดไมนาน แตนั่นก็หมายความเพียงวาตองมีผูนําที่เขมแข็งกวาเพื่อใหแนวคิดนี้เปนจริง เราจะนําชาวเบลเยียมและลักเซมเบิรกกลับสูออมอก เพื่อยืนหยัดอยางแข็งแกรงตอผูใดก็ตามที่อาจรุกราน"
 HOL_taking_back_our_old_colonies: "ทวงคืนอาณานิคมเกาของเรา"
 HOL_taking_back_our_old_colonies_desc: "ความออนแอชั่วคราวของเราจากการพิชิตของนโปเลียนเมื่อเกือบ 150 ปกอน ทําใหเราสูญเสียอาณานิคมจํานวนมากใหอังกฤษ ประชากรในหลายดินแดนเหลานั้นยังคงมีวัฒนธรรมและมรดกแบบดัตชรวมกับเรา เราตองทวงคืนดินแดนอาณานิคมเกาของเรา!"
 HOL_imperial_ambitions: "ความทะเยอทะยานแหงจักรวรรดิ"
 HOL_imperial_ambitions_desc: "ขณะที่ประชาชนของเราดื่มดํ่ากับเกียรติภูมิอันสมกับสถานะมหาอํานาจจักรวรรดิ สิ่งเดียวที่ยังเหลืออยูคือการทวงคืนอาณานิคมเกาของเราอยางนิวเนเดอรลันดทางตะวันออกเฉียงเหนือของสหรัฐอเมริกา"
 HOL_legacy_of_the_de_zeven_provincien_mutiny: "มรดกแหงกบฏบนเรือ "เดอเซเวนโปรวินซีเอิน""
 HOL_legacy_of_the_de_zeven_provincien_mutiny_desc: "การกบฏบนเรือลาดตระเวน "เดอเซเวนโปรวินซีเอิน" เมื่อเดือนกุมภาพันธ 1933 กลายเปนเรื่องตองหามนับแตนั้นมา เราตองทําใหเรื่องนี้กลับมาพูดถึงไดอีกครั้ง เพื่อไมใหลืมการเสียสละของเหลาวีรชนผูกลาเพื่ออุดมการณของชนชั้นแรงงาน เราทุกคนควรยึดการกระทําของพวกเขาเปนแบบอยาง และลุกขึ้นปกปองอุดมการณของเรา!"
 HOL_decolonization: "การปลดปลอยอาณานิคม"
 HOL_decolonization_desc: "มาตุภูมิของเรามีปญหามากพออยูแลว แทนที่จะสงทรัพยากรไปดูแลอาณานิคมโพนทะเลพรอมกับกดขี่ชาวพื้นเมือง เราควรมอบอิสรภาพใหพวกเขาอยางชัดเจน เพื่อใหพวกเขากาวขึ้นเปนสมาชิกที่เทาเทียมและสมบูรณของประชาคมโลก และถอนกําลังของเรากลับสูแผนดินแมไปพรอมกัน"
 HOL_decolonization_tt1: "ทุกรัฐใน §Yอินโดนีเซีย§!: ถูกควบคุมทั้งหมดโดย §Y[INS.GetNameDef]§!"
 HOL_decolonization_tt2: "ทุกรัฐใน §Yอินโดนีเซีย§!: ถูกควบคุมทั้งหมดโดย §Y[HOL.GetNameDef]§!"
 HOL_decolonization_tt: "สรางหนวย KNIL 8 หนวย ซึ่งมีกองพัน§Yทหารราบ 9§! กองพันใน §Yฮอลแลนด§!\n"
 HOL_red_is_the_new_orange: "แดงคือสมใหม"
 HOL_red_is_the_new_orange_desc: "ความเสมอภาคไมเปดชองใหผูใดอยูเหนือผูอื่น แมจะเปนราชวงศที่ผูกพันแนบแนนกับประวัติศาสตรชาติของเราก็ตาม บรรดาศักดิ์ของพวกเขาตองถูกริบ และทรัพยสินตองถูกยึดเพื่อประโยชนสวนรวม"
 HOL_affirm_loyalty_to_moscow: "ยืนยันความภักดีตอ[SOU.Capital.GetCapitalVictoryPointName]"
 HOL_affirm_loyalty_to_moscow_desc: "พรรคของเรารับคําสั่งจาก[SOU.Capital.GetCapitalVictoryPointName]มาชานาน จึงเปนเรื่องธรรมดาที่เราจะรวมกับพวกเขาในการตอสูเพื่อเผยแผลัทธิคอมมิวนิสตไปทั่วโลก"
 HOL_soviet_technical_teams: "ทีมผูเชี่ยวชาญดานเทคนิคจากโซเวียต"
 HOL_soviet_technical_teams_desc: "พันธมิตรของเราเชี่ยวชาญศิลปะแหงการผลิตยุทโธปกรณสงครามใหไดมากที่สุด การรับทีมผูเชี่ยวชาญของพวกเขาเขามาจะชวยใหเราปรับสายการผลิตของเราเองเพื่อใชประโยชนจากนวัตกรรมเหลานั้นได"
 HOL_making_the_ends_of_europe_meet: "เชื่อมสองฟากยุโรปเขาหากัน"
 HOL_making_the_ends_of_europe_meet_desc: "บัดนี้ลัทธิคอมมิวนิสตโอบลอมยุโรปไวทั้งสองฟากแลว ถึงเวลาที่จะเชื่อมสองฟากนั้นเขาหากัน และกําจัดอํานาจที่ขวางอยูตรงกลาง"
 HOL_join_the_french: "เขารวมกับฝรั่งเศส"
 HOL_join_the_french_desc: "ขบวนการคอมมิวนิสตในฝรั่งเศสประสบความสําเร็จมากขึ้นเรื่อยๆ และบัดนี้ไดเลือกที่จะแยกตัวจากโคมินเทิรน เนื่องจากพวกเขาอยูใกลเรามากกวาในทางภูมิศาสตร การผนึกกําลังกับพวกเขาจะเปนประโยชนตออุดมการณคอมมิวนิสตมากกวาการพึ่งพาโซเวียตที่อยูหางไกล"
 HOL_french_military_mission: "คณะผูแทนทางทหารฝรั่งเศส"
 HOL_french_military_mission_desc: "กองทัพฝรั่งเศสมีชื่อเสียงไปทั่วทวีป เราจะเชิญคณะผูแทนทางทหารมาใหความรูแกนักคิดทางทหารของเรา และปรับปรุงการจัดระเบียบของกองทัพเรา"
 HOL_socialist_industrial_support: "การสนับสนุนทางอุตสาหกรรมจากฝายสังคมนิยม"
 HOL_socialist_industrial_support_desc: "พันธมิตรของเรามีศักยภาพทางอุตสาหกรรมเหนือกวาเรามาก เราตองการความชวยเหลือจากพวกเขาหากจะฝาพายุที่กําลังจะมาถึง"
 HOL_for_the_common_good: "เพื่อประโยชนสวนรวม"
 HOL_for_the_common_good_desc: "เพื่อประโยชนสวนรวมของคอมมิวนิสตทั้งมวล เราตองแบงปนความกาวหนาทางเทคโนโลยีระหวางกัน"
 HOL_for_the_common_good_tt: "§Y[HOL.GetName]§! และสมาชิกฝายทั้งหมดเขารวม §Yการแลกเปลี่ยนเทคโนโลยีคอมมิวนิสต§!\n"
 HOL_mobilize_the_masses: "ระดมมวลชน"
 HOL_mobilize_the_masses_desc: "ผูเดียวที่จะปกปองกรรมกรไดก็คือกรรมกรเอง ประชาชนตองลุกขึ้นปกปองประเทศและความเชื่อของตน!"
 HOL_bastion_of_true_communism: "ปอมปราการแหงคอมมิวนิสตที่แทจริง"
 HOL_bastion_of_true_communism_desc: "เรายืนหยัดอยูโดดเดี่ยวในยุโรปตะวันตกดวยการตีความลัทธิคอมมิวนิสตในแบบของเรา เราไมมีใครใหพึ่งพิง จึงตองพึ่งตนเองเพื่อนําอุดมการณคอมมิวนิสตไปสูชัยชนะครั้งสุดทาย"
 HOL_bring_socialism_south: "นําสังคมนิยมสูแดนใต"
 HOL_bring_socialism_south_desc: "เราตองสนับสนุนสหายรวมอุดมการณทางใต ดวยกําลังหากจําเปน เนื่องจากเราอยูหางไกลจากมอสโกและถูกรายลอมดวยอุดมการณที่เปนปฏิปกษทุกดาน เราตองสรางปราการอันแข็งแกรงแหงลัทธิคอมมิวนิสตขึ้นเองบนชายฝงตะวันตกของยุโรป"
 HOL_enemies_on_all_fronts: "ศัตรูรอบทิศ"
 HOL_enemies_on_all_fronts_desc: "ประเทศของเราเล็กและขาดความลึกทางยุทธศาสตร ความหวังเดียวที่จะอยูรอดคือชายหญิงทุกคนตองทําหนาที่ของตน และผูรุกรานใดๆ จะตองเผชิญกับมวลชนที่พวกเขาไมอาจเอาชนะได"
 HOL_haven_of_tolerance: "ดินแดนแหงความอดกลั้น"
 HOL_haven_of_tolerance_desc: "จิตวิญญาณแบบดัตชยังคงฉายแสงแมในลัทธิคอมมิวนิสต เรายินดีตอนรับทุกคนที่ถูกมาตุภูมิของตนรังเกียจ เราไมถามถึงอดีตของพวกเขา ขอเพียงใหพวกเขาทําหนาที่ปกปองสวนเอเดนที่เพิ่งถือกําเนิดแหงนี้จากเหลาศัตรูที่หมายจะบีบคั้นมัน"
 HOL_pre_empt_western_intervention: "ชิงลงมือกอนการแทรกแซงจากตะวันตก"
 HOL_pre_empt_western_intervention_desc: "ขณะที่อุดมการณของเราหยั่งราก ก็มีมหาอํานาจบางแหงที่ตองการเห็นมันลมสลายตั้งแตยังอยูในเปล เราไมอาจปลอยใหเปนเชนนั้น แทนที่จะรอใหการโจมตีอันหนักหนวงที่หลีกเลี่ยงไมไดมาถึง เราตองลงมือโดยเร็วและกําจัดภัยคุกคามตอการอยูรอดของเรา"
 HOL_oranje_boven: "ออรันเยอเหนือทุกสิ่ง!"
 HOL_oranje_boven_desc: "ประวัติศาสตรของประเทศเราผูกพันกับราชวงศออเรนจ-นัสเซา สีสมจึงกลายเปนสัญลักษณประจําชาติ ซึ่งสะทอนทั้งในธรรมเนียมการประดับธงชายสีสมเหนือธงชาติในวันเฉลิมฉลองของชาติ และในเพลงรักชาติสั้นๆ อยาง 'Oranje Boven' หรือ 'ออเรนจเหนือทุกสิ่ง' ที่เทิดพระเกียรติสมเด็จพระราชินีและพระราชวงศทั้งปวง"
 HOL_symbol_of_resistance: "สัญลักษณแหงการตอตาน"
 HOL_symbol_of_resistance_desc: "นับแตวิลเลียมผูเงียบงันทรงกอบกูเอกราชของเราจากสเปนในสงครามแปดสิบป ราชวงศก็เปนสัญลักษณแหงเอกราชของชาวดัตชและการตอตานผูรุกรานตางชาติทั้งปวง หากพรมแดนของเราถูกรุกลํ้าอีกครั้ง ยอมไมตางไปจากเดิมอยางแนนอน"
 HOL_replace_the_defeatist_government: "เปลี่ยนรัฐบาลผูพายแพทางใจ"
 HOL_replace_the_defeatist_government_desc: "รัฐบาลของเราเต็มไปดวยคนขี้ขลาดที่มองไมเห็นประโยชนในการตอตานผูรุกรานตอไป เราตองแทนที่คนเหลานี้ดวยผูที่พรอมจะทําสิ่งที่จําเปนเพื่อนําการตอสูไปสูชัยชนะ"
 HOL_the_only_man_in_the_dutch_government: "บุรุษเพียงหนึ่งเดียวในรัฐบาลดัตช"
 HOL_the_only_man_in_the_dutch_government_desc: "ดังที่เชอรชิลลเคยกลาวไว สมเด็จพระราชินีวิลเฮลมินาผูทรงภาคภูมิของเราคือ 'บุรุษเพียงหนึ่งเดียวในรัฐบาลดัตช' ผูเดียวที่มีความกลาหาญพอจะทําสิ่งที่จําเปน แทนที่จะพึ่งพาผูที่ใจไมสู บางทีพระนางควรเขาควบคุมรัฐบาลโดยตรงและปกครองตามที่ทรงเห็นสมควร"
 HOL_de_vernieuwing: "เดอแฟรเนาวิง"
 HOL_de_vernieuwing_desc: "ในฐานะสวนหนึ่งของแผนงานของสมเด็จพระราชินี 'vernieuwing' หรือ 'การฟนฟู' จะขจัดแนวคิดอันบกพรองเรื่องพรรคการเมืองออกไป เปนที่รูกันดีวาพระนางไมโปรดนักการเมือง และหากพระนางทรงเชื่อวาเราจะดีขึ้นหากไมมีพวกเขา ก็อาจเปนเชนนั้นจริง อยางนอยก็ทําใหการปกครองงายขึ้นแนนอน"
 HOL_depillarization: "การสลายเสาหลักทางสังคม"
 HOL_depillarization_desc: "สังคมดัตชถูกแบงออกเปนชั้นตางๆ ที่เรียกวา 'zuilen' หรือ 'เสาหลัก' สวนหนึ่งของพระราชอาณัติใหมของสมเด็จพระราชินีคือการขจัด 'การแบงเสาหลัก' ที่บอนทําลายประเทศมาหลายป บัดนี้ผูที่มีศาสนา อุดมการณ หรือสถานะทางสังคมตางกันสามารถติดตอกันไดอยางเสรี ซึ่งชวยเพิ่มเสถียรภาพ"
 HOL_a_new_dutch_unity: "เอกภาพใหมของชาวดัตช"
 HOL_a_new_dutch_unity_desc: "เมื่อพระราชอาณัติของสมเด็จพระราชินีคืบหนาไปดวยดี เราสามารถปลุกความภาคภูมิใจและความเปนหนึ่งเดียวของชาติขึ้นใหมในหมูประชาชน เราจะเขมแข็งไดก็ตอเมื่อรวมมือกันเทานั้น และเราไมจําเปนตองกมหนาตอหนามหาอํานาจของโลกเพียงเพราะประเทศของเราเล็ก ในฐานะประชาชาติ เราตีไดหนักหนวงกวาขนาดที่เล็กของเรามากนัก"
 HOL_revive_the_buffer_state_proposal: "ฟนขอเสนอรัฐกันชน"
 HOL_revive_the_buffer_state_proposal_desc: "ในเมื่อเยอรมันและฝรั่งเศสดูจะยั้งตัวไมใหหํ้าหั่นกันซํ้าแลวซํ้าเลาไมได บางทีถึงเวลาที่จะเสนอแนวคิดรัฐกันชนอันทรงพลังแหงกลุมประเทศตํ่าอีกครั้ง หากชาวเบลเยียมและลักเซมเบิรกไมตองการเชนนี้ บางทีพวกเขาก็ควรมีสวนรวมในความพยายามทางสงครามใหมากกวานี้ อยางที่เราทํา"
 HOL_revive_the_buffer_state_proposal_tt1: "§Y[HOL.GetName]§!: มี £legitimacy §Yความชอบธรรม§! สูงกวา §Y[BEL.GetName]§!"
 HOL_revive_the_buffer_state_proposal_tt2: "§Y[HOL.GetName]§!: มี £legitimacy §Yความชอบธรรม§! สูงกวา §Y[LUX.GetName]§!"
 HOL_royal_arms_purchases: "การจัดซื้ออาวุธโดยราชสํานัก"
 HOL_royal_arms_purchases_desc: "เมื่อผลประโยชนของพระนางผูกพันแนบแนนกับผลประโยชนของประเทศมากยิ่งขึ้น สมเด็จพระราชินีจึงทรงเสนอใหใชพระราชทรัพยสวนพระองคจํานวนมากเปนทุนจัดหายุทโธปกรณใหมจากตางประเทศ"
 HOL_develop_the_south: "พัฒนาแดนใต"
 HOL_develop_the_south_desc: "เมื่อไดดินแดนที่เหลือของสหเนเธอรแลนดเดิมมาแลว เราควรดูแลใหดินแดนเหลานี้ไดรับการลงทุนเพื่อการสรางอุตสาหกรรมเชนเดียวกับดินแดนหัวใจของดัตช เพื่อไมใหลาหลังเมื่อเทียบกับสวนอื่นของประเทศ"
 HOL_wilhelminism: "ลัทธิวิลเฮลมินา"
 HOL_wilhelminism_desc: "[Root.GetWilhelminismDesc]"
 HOL_WILHELMINISM_FASCISM: "สายสัมพันธทางราชวงศระหวางราชวงศของเรากับไกเซอรแหงเยอรมนี ผูประทับอยูที่เฮาสโดรนนับแตสิ้นมหาสงคราม ยังคงแนนแฟน บางทีเราอาจใชความนิยมที่พระองคยังคงไดรับในหมูทหารเยอรมันจํานวนมากเพื่อประโยชนของเราเอง และดวยการนั้น สรางรัฐอันทรงพลังที่จะมีเหตุใหตองขอบคุณเราเมื่อสงครามสิ้นสุด"
 HOL_WILHELMINISM_NEUTRALITY: "สายสัมพันธทางราชวงศระหวางราชวงศของเรากับไกเซอรแหงเยอรมนี ผูซึ่งเพิ่งลี้ภัยประทับอยูที่เฮาสโดรนในเนเธอรแลนดจนกระทั่งไมนานมานี้ ยังคงแนนแฟน เราซึ่งเปนเครือญาติกันควรยืนหยัดเคียงขางกัน และชาวเยอรมันยอมมีเหตุใหขอบคุณเราที่ใหที่พํานักแกไกเซอรของพวกเขามาตลอดเวลานี้"
 HOL_wilhelminism_tt: "ไดรับจิตวิญญาณแหงชาติ §Yผูแปรพักตรชาวเยอรมัน§! ซึ่งจะสรางหนวยที่มีกองพัน§Yทหารราบ 7§! และ§Yปนใหญ 2§! กองพัน พรอมหนวยสนับสนุน§Yทหารชาง§! §Yลาดตระเวน§! และ§Yปนใหญ§!เปนระยะ\n"
 HOL_unity_through_democracy: ""เอกภาพผานประชาธิปไตย""
 HOL_unity_through_democracy_desc: "'ขบวนการดัตชเพื่อเอกภาพผานประชาธิปไตย' ('Eenheid door Democratie') กอตั้งขึ้นในป 1935 และนับแตนั้นก็เปนเสียงนอกสภาที่ตอตานนักปลุกระดมจากอุดมการณอื่นทั้งปวงอยางเปดเผย การสนับสนุนขบวนการนี้จะใหผลตอบแทนดวยการปกปองประชาธิปไตยและเสริมความเขมแข็งใหรัฐบาลของเรา"
 HOL_go_with_britain: "ไปกับอังกฤษ"
 HOL_go_with_britain_desc: "อังกฤษยืนหยัดเพื่ออุดมการณประชาธิปไตยในวิกฤตครั้งนี้ และมีผลประโยชนรวมกับเราในการรักษาบูรณภาพของจักรวรรดิอาณานิคม จึงเปนเรื่องธรรมดาที่เราควรเขารวมกับพวกเขา"
 HOL_de_vaarplicht: "เดอฟารพลิคต"
 HOL_de_vaarplicht_desc: "หลังจากความเปนกลางมา 150 ป และกระแสสันตินิยมที่เพิ่มขึ้นหลายทศวรรษ เราตองพิสูจนความมุงมั่นที่จะสูใหพันธมิตรใหมเห็น แทนที่จะพึ่งพากองเรือพาณิชยแบบอาสาสมัครเหมือนชาติอื่น เราจะตรากฎหมาย Vaarplicht หรือ 'หนาที่ในการเดินเรือ' พลเมืองดัตชทุกคนที่ยังไมถูกเกณฑทหารจะตองปฏิบัติหนาที่ใหแกหรือเพื่อประโยชนของกองเรือพาณิชยนับแตนี้"
 HOL_request_allied_favors: "ขอความชวยเหลือจากพันธมิตร"
 HOL_request_allied_favors_desc: "เราอาจเปนเพียงประเทศเล็ก แตเราไดแสดงความทุมเทเพื่อชัยชนะในสงครามนี้แลว อยางไรก็ตาม เราตองการความชวยเหลือเพื่อใหบรรลุ และเรานาจะไดรับนํ้าใจตอบแทนบางจากสิ่งที่เราไดทุมเทไป..."
 HOL_request_allied_favors_tt: "สิ่งเหลานี้ชวยใหสามารถรับ §Yอุตสาหกรรมนอกแผนที่§! §Yกําลังพล§! §Yยุทโธปกรณ§! และอื่นๆ จากพันธมิตรของคุณได\n"
 HOL_the_singapore_conferences: "การประชุมสิงคโปร"
 HOL_the_singapore_conferences_desc: "อังกฤษไดเชิญเรา พรอมกับสหรัฐอเมริกาและออสเตรเลีย เขารวมการประชุมชุดหนึ่งเพื่อหารือถึงการรุกรานที่เพิ่มขึ้นของญี่ปุนในชวงหลายปมานี้ ซึ่งคุกคามผลประโยชนของพวกเราทั้งหมดในเอเชียตะวันออกเฉียงใต เราจะรวมกันพัฒนาแผนปองกัน ซึ่งแมจะไมมีผลผูกพัน แตจะใหขอมูลอันมีคาเกี่ยวกับการสนับสนุนที่เราอาจคาดหวังจากพวกเขาไดหากญี่ปุนโจมตี"
 HOL_ship_a_day_sinking_quotas: "เปาจมเรือวันละลํา"
 HOL_ship_a_day_sinking_quotas_desc: "แมเราจะไมอาจปองกันหมูเกาะอินเดียตะวันออกจากการโจมตีอยางมุงมั่นไดโดยตรง แตเราตองไมปลอยใหงายดาย กองเรือดํานํ้าของเราตองโจมตีเสนทางลําเลียงของศัตรูอยางไมหยุดหยอน และตองทั้งไดรับยุทโธปกรณที่เหมาะสม และนําโดยผูบัญชาการที่ดุดันและมีความสามารถ"
 HOL_allied_technological_developments: "การพัฒนาเทคโนโลยีของฝายพันธมิตร"
 HOL_allied_technological_developments_desc: "ชัยชนะอยูที่ความเหนือกวาทางเทคโนโลยี เราตองรวมสมทบทรัพยากรมหาศาลที่ทุมเขาสูโครงการวิจัยและพัฒนาของฝายพันธมิตร เพื่อที่เราจะไดรับประโยชนจากมันดวย"
 HOL_american_west_indies_protectorate: "รัฐในอารักขาของอเมริกาในหมูเกาะเวสตอินดีส"
 HOL_american_west_indies_protectorate_desc: "เราควรขอใหอเมริกาใหความคุมครองดินแดนฝงตะวันตกที่อยูหางไกลของเรา พวกเขายอมไมตองการเห็นมหาอํานาจอื่นใดเขามายุงเกี่ยวกับหลักการมอนโรอยางแนนอน"
 HOL_american_west_indies_protectorate_tt: "§R[USA.GetNameDefCap]ตองอนุมัติขอตกลงเพื่อใหโบนัสมีผล§!\n"
 HOL_combined_chiefs_of_staff_representation: "ผูแทนในคณะเสนาธิการรวมผสม"
 HOL_combined_chiefs_of_staff_representation_desc: "การมีสวนรวมของเราไดรับการจดจําแลว และดวยแรงกดดันทางการเมืองบางสวน เราอาจไดตําแหนงผูแทน หากไมใชการมีสวนรวมโดยตรง ในสโมสรพิเศษของนักวางแผนยุทธศาสตรแองโกล-อเมริกันที่เรียกวาคณะเสนาธิการรวมผสม"
 HOL_the_fourth_ally: "พันธมิตรลําดับที่สี่"
 HOL_the_fourth_ally_desc: "แมเราจะเริ่มตนอยางตํ่าตอย แตการมีสวนรวมของเราเปนที่ปฏิเสธไมได ถึงเวลาที่เราจะขึ้นเปนพันธมิตรลําดับที่สี่ในสงครามตอตานฟาสซิสต เคียงขางสหราชอาณาจักร สหรัฐอเมริกา และสหภาพโซเวียต"
 HOL_zandery_military_airport: "ทาอากาศยานทหารซันเดอรี"
 HOL_zandery_military_airport_desc: "ดวยความสําคัญของบอกไซตจากซูรินามและนํ้ามันจากกือราเซาตอความพยายามทางสงครามของฝายพันธมิตร อเมริกาจึงเสนอจะชวยปองกันดวยการตั้งสถานีเรดารบนกือราเซา และสรางทาอากาศยานพรอมโครงสรางพื้นฐานที่ซันเดอรีในซูรินาม เมื่อแลวเสร็จ ที่นี่จะเปนทาอากาศยานทหารที่ใหญที่สุดในอเมริกาใต"
 HOL_lead_the_minor_democracies: "นําประเทศประชาธิปไตยขนาดเล็ก"
 HOL_lead_the_minor_democracies_desc: "ในเมื่อมหาอํานาจในยุคของเราดูจะมุงมั่นกอสงครามอีกครั้ง จึงเหลือเพียงประเทศประชาธิปไตยขนาดเล็กของยุโรปที่จะยับยั้งไมใหโลกลุกเปนไฟ ดั่งฝูงชนที่คอยกันนักสูสองคนไมใหเขาหากัน เราจะนําชาติอื่นๆ กอตั้งกลุมความเปนกลางเพื่อตอตานพวกกระหายสงคราม"
 HOL_form_the_benelux: "กอตั้งเบเนลักซ"
 HOL_form_the_benelux_desc: "พวกเรา ชาติเล็กๆ แหงยุโรปตะวันตกที่ถูกบีบอยูระหวางมหาอํานาจอยางอังกฤษ ฝรั่งเศส และบัดนี้เยอรมนีมานานหลายศตวรรษ ทนกับความขัดแยงที่ฉีกทวีปของเราเปนชิ้นๆ มามากพอแลว สหรัฐแหงยุโรปอาจปองกันหายนะอยางมหาสงครามไดในสักวันหนึ่ง แตดวยการกอตั้งสหภาพแบบหลวมๆ กับเพื่อนบานทางใต เราสามารถวางแกนกลางขององคกรเชนนั้นไดตั้งแตวันนี้"
 HOL_form_the_benelux_bel_tt: "ไดรับเหตุการณ '§Yเนเธอรแลนดเชิญ [BEL.GetName] เขารวมเบเนลักซ§!'\n"
 HOL_form_the_benelux_lux_tt: "ไดรับเหตุการณ '§Yเนเธอรแลนดเชิญ [LUX.GetName] เขารวมเบเนลักซ§!'\n"
 HOL_responsibility_for_our_own_defense: "รับผิดชอบการปองกันตนเอง"
 HOL_responsibility_for_our_own_defense_desc: "เมื่อไมมีมหาอํานาจใดใหพึ่งพา เราจึงไมมีทางเลือกนอกจากดูแลการปองกันของตนเอง และรับผิดชอบอยางเต็มที่ใหแนใจวาการปองกันนั้นเพียงพอตอความทาทายใดๆ ที่อาจถาโถมเขามา"
 HOL_lessons_from_the_low_countries: "บทเรียนจากกลุมประเทศตํ่า"
 HOL_lessons_from_the_low_countries_desc: "ในฐานะดินแดนเปนกลางระหวางสองมหาอํานาจ กลุมประเทศตํ่าผานสงครามมามากมาย เราตองเรียนรูจากสิ่งนี้ และเตรียมพรอมรับการรุกรานที่มากขึ้น เมื่อเพื่อนบานฝายหนึ่งพยายามบดขยี้เราอีกครั้งเพื่อไปถึงอีกฝายหนึ่ง"
 HOL_foundations_for_a_european_union: "รากฐานแหงสหภาพยุโรป"
 HOL_foundations_for_a_european_union_desc: "จากจุดเริ่มตนอันเรียบงายของเบเนลักซ เราตองสรางสหภาพแหงชาติทั่วทั้งทวีป ที่ยืนเคียงบาเคียงไหลกันเผชิญการกอสงครามไมสิ้นสุดของมหาอํานาจ สหภาพยุโรปจะนําสันติภาพและความรุงเรืองมาสูทุกคน"
 HOL_the_continents_best_and_brightest: "ยอดฝมือแหงทวีป"
 HOL_the_continents_best_and_brightest_desc: "แมแตละชาติจะมีทรัพยากรเพียงนอยนิด แตหากรวมกันเราก็สามารถทําไดทุกอยางที่มหาอํานาจทําได"
 HOL_the_best_defense: "การปองกันที่ดีที่สุด"
 HOL_the_best_defense_desc: "เราตองไมถูกจูโจมโดยไมทันตั้งตัวเหมือนในสงครามครั้งกอนๆ หากเพื่อนบานไมยอมฟงเหตุผลและยอมรับสันติภาพ เราก็ตองบังคับใหพวกเขายอม"
 ENG_fortify_the_empire: "เสริมปอมปราการใหจักรวรรดิ"
 mtg_usa_civil_war_warning_tt: "§Rสิ่งนี้จะทําใหคุณเขาใกลสงครามกลางเมืองมากขึ้น!§!\n"
 fascists_uprising_tt: "กลุมฟาสซิสตในหมูประชาชนจะเริ่มเตรียมการลุกฮือ"
 USA_intervention_mandate_tt: "§Yอาณัติการแทรกแซง§! ชวยใหเราขอใหรัฐสภาอนุมัติปฏิบัติการทางทหารตอประเทศอื่นได"
 USA_honor_the_confederacy_tt: "การตัดสินใจเหลานี้ชวยใหเราฟนฟูความเชื่อมั่นของประชาชนที่มีตอรัฐบาลในกรณีที่เกิดสงครามกลางเมือง ดวยการเชื่อมโยงกับอดีตอีกครั้ง"
 USA_foreign_support_tt: "การตัดสินใจเหลานี้ชวยใหเราติดตอประเทศมหาอํานาจเพื่อวิ่งเตนขอการสนับสนุนดานยุทโธปกรณ"
