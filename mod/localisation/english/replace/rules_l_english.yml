l_english:
 CAN_CREATE_COLLABORATION_GOVERNMENT: "สามารถจัดตั้งรัฐบาลรวมมือได"
 CAN_DECLARE_WAR_WITHOUT_WARGOAL_WHEN_IN_WAR: "สามารถประกาศสงครามกับเพื่อนบานโดยไมมีเปาหมายสงครามไดเมื่ออยูในภาวะสงครามกับมหาอํานาจ"
 CAN_DECLARE_WAR_ON_SAME_IDEOLOGY: "สามารถสรางขออางทําสงครามและประกาศสงครามกับประเทศที่มีกลุมอุดมการณเดียวกันได"
 CAN_FORCE_GOVERNMENT: "สามารถบังคับใหรัฐบาลของประเทศอื่นรับอุดมการณเดียวกันได"
 CAN_GUARANTEE_OTHER_IDEOLOGIES: "สามารถรับประกันเอกราชใหประเทศที่มีอุดมการณอื่นได"
 CAN_PUPPET: "สามารถทําใหประเทศเปนรัฐหุนเชิดได"
 CAN_ONLY_JUSTIFY_WAR_ON_THREAT_COUNTRY: "สามารถสรางขออางทําสงครามกับประเทศที่ยังไมไดกอความตึงเครียดของโลกได"
 CAN_BOOST_OTHER_IDEOLOGIES: "สามารถเพิ่มความนิยมของอุดมการณอื่นได"
 CAN_JOIN_FACTIONS: "สามารถเขารวมฝายได"
 CAN_JOIN_FACTIONS_NOT_ALLOWED_DIPLOMACY: "$COUNTRY|H$ ไมไดรับอนุญาตใหเขารวมฝาย"
 CAN_BE_SPYMASTER: "สามารถดํารงตําแหนงขาวกรองได"
 CONTRIBUTES_OPERATIVES: "สงสายลับใหแกผูควบคุมเครือขายสายลับ: ใช"
 CAN_BOOST_OWN_IDEOLOGY: "สามารถเพิ่มความนิยมของพรรคตนเองในประเทศอื่นได"
 CAN_GENERATE_FEMALE_UNIT_LEADERS: "สามารถสรางผูนําหนวยที่เปนผูหญิงได"
 CAN_GENERATE_FEMALE_COUNTRY_LEADERS: "สามารถสรางผูนําประเทศที่เปนผูหญิงได"
 CAN_ACCESS_MARKET: "สามารถเขาถึงตลาดระหวางประเทศได (§Yรัฐหุนเชิด§!และ§Yเจาอธิราช§!สามารถเขาถึงตลาดของกันและกันไดเสมอ)"
 RULE_DESC_IS_A_SUBJECT: "$DESC$ (เปนรัฐในอารักขา)"
 RULE_OVERRIDE_BREAKDOWN_TITLE_POS: "(ทั้งหมดตองเปนจริง):"
 RULE_OVERRIDE_BREAKDOWN_TITLE_NEG: "(อยางนอยหนึ่งขอตองเปนจริง):"
 RULE_OVERRIDE_BREAKDOWN_ENTRY: "  $STATUS$ $DESC$"
 RULE_DEFAULT_CONSTANT_OVERRIDE_BREAKDOWN_DESC: "จาก $ROOT|Y$ ไปยัง $FROM|Y$"
 CAN_USE_UNDERWAY_REPLENISHMENT: "สามารถใชการสงกําลังบํารุงกลางทะเลได"