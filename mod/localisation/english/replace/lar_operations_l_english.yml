 murder_trotsky_infiltration: "เอกสารปลอม"
 murder_trotsky_infiltration_desc: "สายลับของเราจะใชหนังสือเดินทางแคนาดาปลอมเดินทางไปยังที่อยูของทรอตสกีและผูกมิตรกับผูคุมกันของเขา"
 murder_trotsky_infiltration_outcome: "สายลับของเราไดรับความไววางใจจากทรอตสกีและผูคุมกันของเขาไดสําเร็จ โดยใชชองทางที่ไดมาจากหนังสือเดินทางปลอม"
 murder_trotsky_attack: "การลอบสังหาร"
 murder_trotsky_attack_desc: "สายลับของเราจะแยกทรอตสกีออกจากผูคุมกันโดยนําบทความที่อยากหารือเปนการสวนตัวไปใหเขาดู เมื่ออยูตามลําพัง เขาจะลอบสังหารทรอตสกีดวยขวานนํ้าแข็ง"
 murder_trotsky_attack_outcome: "สายลับอยูกับทรอตสกีตามลําพังไดและฟาดเขาอยางแรงดวยขวานนํ้าแข็ง ทรอตสกีไมไดเสียชีวิตทันที แตเสียชีวิตในโรงพยาบาลในเวลาตอมา"
 murder_trotsky_exfiltration: "การหลบหนี"
 murder_trotsky_exfiltration_desc: "สายลับของเราจะพยายามใชความสับสนอลหมานหลบหนีและหลีกเลี่ยงการถูกสอบสวน"
 murder_trotsky_exfiltration_outcome: "ทามกลางความสับสนหลังการโจมตี สายลับของเราหลบหนีไปไดโดยไมมีใครเห็นหนาเขาชัด"
 murder_trotsky_exfiltration_outcome_fail: "สายลับของเราถูกผูคุมกันของทรอตสกีจับตัวไดและสงมอบใหเจาหนาที่ เขาถูกตั้งขอหาฆาตกรรม"
 nuclear_espionage: "แทรกซึมโครงการปรมาณู"
 nuclear_espionage_desc: "โครงการอาวุธนิวเคลียรของเราตามหลังประเทศอื่น เราควรวางแผนปฏิบัติการแทรกซึมโครงการอาวุธปรมาณูของตางชาติ และหาพิมพเขียวและขอมูลสําคัญมาใหได"
 nuclear_espionage_outcome_tt: "เราจะแฝงสายลับเขาไปในโครงการวิจัยนิวเคลียรฝาย[FROM.GetAdjective] ซึ่งจะพยายามสงเอกสารทางเทคนิคที่นํามาใชในโครงการปรมาณูของเราเองได"
 SWI_boost_resistance_buff: "\nปฏิบัติการ §Yเสริมกําลังขบวนการตอตาน§! มีประสิทธิภาพมากขึ้นอยางมาก"
