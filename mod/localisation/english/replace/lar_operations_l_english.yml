l_english:
 operation_boost_resistance: "เสริมกําลังขบวนการตอตาน"
 operation_boost_resistance_desc: "§Lพลพรรคในดินแดนที่ถูกขาศึกยึดครองตองการการสนับสนุนอยางยิ่งเพื่อสูตอไป พวกเขากําลังตรึงกําลังทหารขาศึกไวเปนจํานวนมาก และจะเปนการลงทุนที่คุมคาอยางยิ่ง§!"
 operation_capture_cipher: "ยึดรหัสลับ"
 operation_capture_cipher_desc: "§Lการยึดสมุดรหัสของขาศึก หรือไดมาดวยวิธีอื่น จะมอบความไดเปรียบอยางเด็ดขาดใหนักถอดรหัสของเรา§!"
 infiltration_paradrop: "แทรกซึมโดยรมชูชีพ"
 infiltration_paradrop_desc: "สายลับจะถูกสงลงพื้นที่ดวยรมชูชีพ การบินตํ่าในเวลากลางคืนจะชวยหลีกเลี่ยงการสกัดกั้นจากเครื่องบินขับไลของขาศึก"
 infiltration_submarine: "สงตัวโดยเรือดํานํ้า"
 infiltration_submarine_desc: "สายลับจะถูกสงไปใกลชายฝงโดยเรือดํานํ้าลําหนึ่งของเรา เราไดลาดตระเวนจุดขึ้นฝงที่เปนไปไดและตรวจสอบเวลาลาดตระเวนของขาศึกไวแลวเพื่อหลีกเลี่ยงการถูกตรวจพบ"
 infiltration_border: "แทรกซึมผานชายแดนประเทศเปนกลาง"
 infiltration_border_desc: "สายลับจะแทรกซึมผานชายแดนของประเทศเปนกลาง คาดวาทหารรักษาชายแดนในพื้นที่จะระวังตัวนอยกวา และเราไดระบุพื้นที่หลายแหงที่มีการลาดตระเวนชายแดนนอยมากไวแลว"
 infiltration_diplomatic: "หนังสือเดินทางทางการทูต"
 infiltration_diplomatic_desc: "สายลับจะใชหนังสือเดินทางทางการทูตเพื่อเขาประเทศและเดินทางไปมา เราคาดวาหนวยตอตานขาวกรองของขาศึกจะพยายามสะกดรอยตาม แตสามารถรับมือไดดวยการฝกที่เพียงพอ"
 resistance_support_arms_depots: "สรางคลังเสบียงลับ"
 resistance_support_arms_depots_desc: "สายลับของเราจะจัดตั้งคลังลับสําหรับเก็บวัตถุระเบิดและยุทโธปกรณอื่น ๆ หลายแหง เพื่อเตรียมพรอมสําหรับการลุกฮือครั้งใหญเมื่อขบวนการตอตานแข็งแกรงพอ"
 resistance_support_distribute_weapons: "แจกจายอาวุธ"
 resistance_support_distribute_weapons_desc: "สายลับของเราจะจัดการและประสานงานการทิ้งอาวุธทางอากาศหลายครั้ง จากนั้นอาวุธจะถูกสงมอบใหสมาชิกขบวนการตอตานในทองถิ่นที่ไวใจได"
 resistance_support_organize_training: "จัดตั้งคายฝก"
 resistance_support_organize_training_desc: "สายลับของเราจะเปดหลักสูตรทักษะการหลบหนีและหลบหลีก รวมถึงทักษะภาคสนามขั้นพื้นฐาน จากนั้นผูฝกที่มีแววที่สุดจะไดฝกการใชอาวุธปนขั้นพื้นฐานตอไป"
 resistance_support_coordinate_groups: "ประสานงานกลุมตอตาน"
 resistance_support_coordinate_groups_desc: "สายลับของเราจะเดินทางไปประสานงานกลุมตอตานตาง ๆ การสรางพันธมิตรระหวางหนวยที่แตกแยกกันทางการเมืองจะตองใชความพยายามไมนอย"
 exfiltration_air_pickup: "รับตัวดวยเครื่องบิน"
 exfiltration_air_pickup_desc: "เครื่องบินลําหนึ่งของเราจะบินเขาดินแดนขาศึกในเวลากลางคืน คนหาทุงที่ทําเครื่องหมายไว ลงจอด และรับตัวสายลับของเรา"
 exfiltration_submarine_pickup: "รับตัวดวยเรือดํานํ้า"
 exfiltration_submarine_pickup_desc: "เรือดํานํ้าลําหนึ่งของเราจะประจําอยูที่จุดรับตัวที่กําหนดไวตามแนวชายฝง จังหวะเวลาเปนสิ่งสําคัญยิ่ง เพราะหนวยลาดตระเวนทางเรือของขาศึกครอบคลุมพื้นที่นี้"
 exfiltration_border: "เดินเทาขามชายแดน"
 exfiltration_border_desc: "สายลับของเราจะหลบหนีโดยขามชายแดนในเวลากลางคืน ณ พื้นที่หางไกล มัคคุเทศกทองถิ่นพรอมชวยนําทางผานพื้นที่อันตรายนี้"
 exfiltration_go_to_ground: "หลบซอนตัว"
 exfiltration_go_to_ground_desc: "สายลับของเราจะเก็บตัวเงียบและกลมกลืนไปกับประชาชนจนกวาจะพรอมสําหรับภารกิจถัดไป หากมีโอกาสถอนตัวดวยวิธีอื่น พวกเขาจะควาไว"
 operation_make_resistance_contacts: "ติดตอขบวนการตอตาน"
 operation_make_resistance_contacts_desc: "§Lการสนับสนุนใด ๆ ที่เรามอบใหพลพรรคที่เคลื่อนไหวอยูหลังแนวขาศึกจะไดผลมากขึ้นอยางยิ่ง หากเรามีชองทางสื่อสารและประสานงานกับพวกเขา§!"
 capture_cyphers_bribe: "ติดสินบนทหาร"
 capture_cyphers_bribe_desc: "เรามีคนอยูภายใน และจะมอบเงินทุนที่จําเปนใหเขาขโมยสมุดรหัสมาสงใหสายลับของเรา"
 capture_cyphers_raid: "การจูโจมของหนวยคอมมานโด"
 capture_cyphers_raid_desc: "สายลับของเราจะสํารวจพื้นที่และสงสัญญาณใหหนวยคอมมานโดยกพลขึ้นฝงเพื่อยึดสมุดรหัสและอุปกรณเขารหัส เราจะพยายามจับตัวผูเชี่ยวชาญดานการเขารหัสหนึ่งหรือสองคนมาสอบสวนดวย"
 capture_cyphers_seduction: "ใชเสนหลอลวง"
 capture_cyphers_seduction_desc: "สายลับของเราจะติดตอบุคคลที่เขาถึงรหัสลับได และใชเสนห - หรือวิธีอื่น - เพื่อใหไดสําเนามา"
 capture_cyphers_reverse_engineer: "วิศวกรรมยอนกลับ"
 capture_cyphers_reverse_engineer_desc: "เครื่องเขารหัสหลักของประเทศนั้นมีรุนที่เรียบงายกวาวางจําหนายในเชิงพาณิชย เราจะซื้อมาอยางถูกกฎหมาย แลวใชมันชวยในการทําวิศวกรรมยอนกลับเพื่อสรางเครื่องถอดรหัส"
 resistance_contacts_radio_circuits: "สรางเครือขายวิทยุ"
 resistance_contacts_radio_circuits_desc: "ทีมงานจะแจกจายวิทยุใหสมาชิกขบวนการตอตาน และสอนระเบียบการใชวิทยุขั้นพื้นฐาน โดยเฉพาะการหลีกเลี่ยงการหาทิศทางคลื่นวิทยุของขาศึก"
 resistance_support_pidgeons: "แจกจายนกพิราบ"
 resistance_support_pidgeons_desc: "ทีมงานจะแจกจายนกพิราบสื่อสารที่ผานการฝกใหผูเลี้ยงนกหลายรายที่มีสายสัมพันธกับขบวนการตอตาน นกเหลานี้จะใชนําขอความกลับมายังแนวของเรา"
 resistance_contacts_briefings: "บรรยายสรุปยุทธศาสตร"
 resistance_contacts_briefings_desc: "สายลับของเราจะบรรยายสรุปแกผูนํากลุมตอตานตาง ๆ เกี่ยวกับปฏิบัติการที่วางแผนไว เพื่อประสานงานการสนับสนุนขบวนการตอตาน"
 capture_cyphers_smuggle: "ลักลอบนํารหัสลับออกมา"
 capture_cyphers_smuggle_desc: "สายลับสองหนาคนหนึ่งของเราจะขอใหสงสําเนาใหมของรหัสลับที่ใชงานอยูในปจจุบัน กําลังประสานงานกับหนวยงานอื่นเพื่อใหแนใจวาการสงมอบจะไมถูกขัดขวาง"
 operation_steal_tech_airforce: "ขโมยพิมพเขียวอุตสาหกรรมการบิน"
 operation_steal_tech_airforce_desc: "§Lเราไดรับรายงานที่นากังวลอยางยิ่งหลายฉบับวาขาศึกลํ้าหนาเราในการออกแบบอากาศยานหลายดาน หากเปนเชนนั้นจริง เราอาจพยายามหาขอมูลวาพวกเขาลํ้าหนาไปมากเพียงใด และใชสิ่งที่พบเพื่อพัฒนาการวิจัยของเราเอง§!"
 operation_infiltrate_armed_forces_navy: "แทรกซึมกองทัพเรือ"
 operation_infiltrate_armed_forces_navy_desc: "§Lแมลูกเรือที่ใกลชิดกันของเรือฝาย[From.GetAdjective]จะเปดชองใหแทรกซึมไดนอย แตเจาหนาที่สนับสนุนบนฝงเปนอีกเรื่องหนึ่ง การสงคนเขาไปอยูภายในจะใหขอมูลอันมีคาแกเรา และเปดโอกาสใหสนับสนุนปฏิบัติการที่ยากขึ้นในภายหลัง§!"
 operation_infiltrate_civilian: "แทรกซึมฝายบริหารพลเรือน"
 operation_infiltrate_civilian_desc: "§Lรัฐบาลฝาย[From.GetAdjective]มีจุดออนมากมายที่เราอาจแทรกซึมสายลับเขาไปในการดําเนินงานได การทําเชนนั้นจะทําใหเราเขาใจกลไกภายในของ [From.GetNameDef] อยางลึกซึ้ง และยังเปดโอกาสใหใชสายลับคนนี้ในปฏิบัติการตอตาน [From.GetNameDef] ในอนาคต§!"
 operation_infiltrate_armed_forces_airforce: "แทรกซึมกองทัพอากาศ"
 operation_infiltrate_armed_forces_airforce_desc: "§Lกองทัพอากาศฝาย[From.getAdjective]เปนเหลาทัพที่อายุนอยที่สุดในกองทัพฝาย[From.GetAdjective] จึงมีบุคลากรที่มีภูมิหลังแปลกประหลาดอยูมาก เราอาจใชประโยชนจากบางคนเพื่อสงคนของเราเขาไปภายใน§!"
 operation_infiltrate_armed_forces_army: "แทรกซึมกองทัพบก"
 operation_infiltrate_armed_forces_army_desc: "§Lกองทัพบกฝาย[From.GetAdjective]มีบุคคลจํานวนหนึ่งที่อาจถูกชักจูงใหเปลี่ยนขางมาใหขอมูลและสนับสนุนปฏิบัติการในอนาคต§!"
 operation_steal_tech_army: "ขโมยพิมพเขียวทางทหาร"
 operation_steal_tech_army_desc: "§Lนักวิเคราะหขาวกรองของเราเชื่อวา [From.GetNameDef] มีความกาวหนาอยางมากในดานการสงครามภาคพื้นดินและวิศวกรรมทหาร การสืบสวนอยางละเอียดขึ้น ควบคูกับวิธีที่ตรงไปตรงมามากขึ้น อาจใหขอมูลอันมีคาสําหรับโครงการวิจัยของเราเอง§!"
 operation_steal_tech_civilian: "ขโมยพิมพเขียวอุตสาหกรรม"
 operation_steal_tech_civilian_desc: "§Lดูเหมือนวาอุตสาหกรรมของเราจะตามหลัง [From.GetNameDef] อยูหลายดาน ดวยไหวพริบและเลหกลเล็กนอย เราอาจไลตามทันไดมาก§!"
 operation_steal_tech_navy: "ขโมยพิมพเขียวทางทะเล"
 operation_steal_tech_navy_desc: "§Lมีรายงานวาฝาย[From.GetAdjective]ดูจะลํ้าหนาเราในวิศวกรรมการตอเรือบางดาน เราอาจอยูในฐานะที่จะไดเทคโนโลยีบางสวนมาทําวิศวกรรมยอนกลับ§!"
 infiltrate_military_bribe: "เสนอสินบน"
 infiltrate_military_bribe_desc: "สายลับของเราจะหาบุคคลที่มีปญหาทางการเงิน และเสนอเงินกอนใหญแลกกับการสนับสนุนเรา เงินทุนจะจัดสรรจากคลังแผนดิน"
 infiltrate_military_seduction: "ใชเสนห"
 infiltrate_military_seduction_desc: "สายลับของเราจะสรางความสัมพันธใกลชิดและลึกซึ้งกับใครบางคนภายใน เพื่อใหไดขอมูลและอํานาจตอรองเหนือเขา"
 infiltrate_military_turned_pow: "ชักจูงเชลยศึก"
 infiltrate_military_turned_pow_desc: "เราจะหาเชลยศึกที่ใชประโยชนไดในความดูแลของเรา ชักจูงใหเขาเปลี่ยนขางมาอยูฝายเรา แลวสงตัวกลับประเทศ เขาจะถูกสอบสวนอยางแนนอน แตดวยการฝกที่เหมาะสม เขาจะผานพนไปได"
 infiltrate_military_ideological_supporter: "ติดตอผูสนับสนุนทางอุดมการณ"
 infiltrate_military_ideological_supporter_desc: "เราจะใชชองทางลับทางการทูตเพื่อระบุและติดตอเจาหนาที่ในรัฐบาลฝาย[From.GetAdjective]ที่มีแนวคิดทางการเมืองไมตรงกับรัฐบาลของตน และชักชวนใหพวกเขาทํางานใหเรา"
 steal_blueprints_bribe: "เสนอสินบน"
 steal_blueprints_bribe_desc: "สายลับของเราจะเสนอเงินกอนใหญใหวิศวกรที่เกี่ยวของกับโครงการ"
 steal_blueprints_seduction: "ใชเสนห"
 steal_blueprints_seduction_desc: "สายลับของเราจะเขาใกลบุคคลที่เกี่ยวของกับโครงการและใชเสนหเพื่อลวงขอมูลเพิ่มเติม แมเราจะไมคาดหวังวาใครจะยอมสงพิมพเขียวทั้งชุดเพียงเพื่อแลกกับเวลาดี ๆ ดวยกัน แตคําพูดบนหมอนมักไมไดระวังปาก"
 steal_blueprints_infiltrate_naval_design_office: "แทรกซึมสํานักงานออกแบบเรือรบ"
 steal_blueprints_infiltrate_naval_design_office_desc: "สายลับของเราจะเขาทํางานเปนพนักงานระดับลางในบริษัทผูรับเหมาดานการตอเรือขนาดเล็ก และใชตําแหนงนี้คัดลอกแบบแปลนที่มีอยู"
 steal_blueprints_steal_prototype: "ขโมยเครื่องตนแบบ"
 steal_blueprints_steal_prototype_desc: "หลังผานการฝกบินขั้นพื้นฐาน และมีนักบินทดสอบจากกองทัพอากาศของเรารวมทางไปดวย สายลับของเราจะเขาถึงเครื่องตนแบบและบินมันกลับมายังแนวของเรา จะมีการจัดเครื่องบินขับไลคุมกันเพื่อใหแนใจวาเครื่องตนแบบจะมาถึงเราอยางปลอดภัย"
 steal_blueprints_middle_manager: "แทรกซึมผูบริหารระดับกลาง"
 steal_blueprints_middle_manager_desc: "สายลับของเราจะใชหนังสือรับรองที่จัดเตรียมไวและประวัติยอที่ปลอมแปลงเพื่อเขาทํางานในตําแหนงผูบริหารระดับกลางของบริษัทใหญ จากตําแหนงนี้ พวกเขานาจะใหขอมูลเกี่ยวกับบริษัทนั้นรวมถึงอุตสาหกรรมทั้งระบบได"
 lar_communist_uprising_organise_cells: "จัดตั้งหนวยปฏิวัติ"
 lar_communist_uprising_organise_cells_desc: "สายลับของเราจะทํางานรวมกับคนงานที่คัดเลือกมาจํานวนหนึ่ง เพื่อจัดตั้งคณะกรรมการปฏิบัติการปฏิวัติที่จะหวานเมล็ดพันธุแหงการปฏิวัติไปสูทุกโรงงาน"
 lar_communist_uprising_infiltrate_civil_service: "แทรกซึมราชการพลเรือน"
 lar_communist_uprising_infiltrate_civil_service_desc: "สายลับของเราจะทําใหแนใจวาบุคคลที่ไวใจไดหลายคนไดเขารับราชการพลเรือน เพื่อเปนแกนกลางของฝายบริหารพลเรือนหลังการปฏิวัติสําเร็จ"
 lar_communist_uprising_train_workers_militia: "ฝกกองกําลังอาสากรรมกร"
 lar_communist_uprising_train_workers_militia_desc: "สายลับของเราจะจัดการฝกขั้นพื้นฐานใหสหายที่คัดเลือกมาจํานวนหนึ่ง ซึ่งจะกลายเปนแกนนําของหนวยกองกําลังอาสา"
 lar_communist_uprising_organize_strikes: "จัดการนัดหยุดงาน"
 lar_communist_uprising_organize_strikes_desc: "สายลับของเราจะติดตอสหภาพแรงงานและผูที่ไวใจไดทางการเมืองซึ่งทํางานในอุตสาหกรรมสําคัญ และชวยพวกเขาจัดการนัดหยุดงาน ซึ่งจะเริ่มขึ้นเมื่อสงครามปะทุ"
 lar_fra_coup_pre_position_units: "วางกําลังหนวยลวงหนา"
 lar_fra_coup_pre_position_units_desc: "สายลับของเราจะเขาควบคุมหนวยทหารที่เห็นอกเห็นใจจํานวนหนึ่งในพื้นที่ และมอบหมายเปาหมายที่ตองยึดเมื่อปฏิบัติการเริ่มตน"
 lar_fra_launch_coup: "เริ่มรัฐประหาร"
 lar_fra_launch_coup_desc: "ปฏิบัติการจะเริ่มขึ้นเมื่อไดรับสัญญาณวิทยุที่เขารหัสไว"
 FRA_instigate_workers_revolution_britain: "ยุยงการปฏิวัติของกรรมกรในอังกฤษ"
 FRA_instigate_workers_revolution_italy: "ยุยงการปฏิวัติของกรรมกรในอิตาลี"
 FRA_instigate_workers_revolution_spain: "ยุยงการปฏิวัติของกรรมกรในสเปน"
 FRA_instigate_workers_revolution_germany: "ยุยงการปฏิวัติของกรรมกรในเยอรมนี"
 FRA_coup_in_north_africa: "เตรียมรัฐประหารในแอฟริกาเหนือ"
 FRA_coup_in_north_africa_flag: "เตรียมรัฐประหารในแอฟริกาเหนือ"
 FRA_coup_in_north_africa_desc: "ชาวฝรั่งเศสจํานวนมากในแอฟริกาเหนือยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 FRA_coup_in_syria: "เตรียมรัฐประหารในซีเรีย"
 FRA_coup_in_syria_flag: "เตรียมรัฐประหารในซีเรีย"
 FRA_coup_in_syria_desc: "ชาวฝรั่งเศสจํานวนมากในซีเรียยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 FRA_coup_in_indochina: "เตรียมรัฐประหารในอินโดจีน"
 FRA_coup_in_indochina_flag: "เตรียมรัฐประหารในอินโดจีน"
 FRA_coup_in_indochina_desc: "ชาวฝรั่งเศสจํานวนมากในอินโดจีนยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 FRA_coup_in_central_africa: "เตรียมรัฐประหารในแอฟริกากลาง"
 FRA_coup_in_central_africa_flag: "เตรียมรัฐประหารในแอฟริกากลาง"
 FRA_coup_in_central_africa_desc: "ชาวฝรั่งเศสจํานวนมากในแอฟริกากลางยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 FRA_coup_in_west_africa: "เตรียมรัฐประหารในแอฟริกาตะวันตก"
 FRA_coup_in_west_africa_flag: "เตรียมรัฐประหารในแอฟริกาตะวันตก"
 FRA_coup_in_west_africa_desc: "ชาวฝรั่งเศสจํานวนมากในแอฟริกาตะวันตกยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 FRA_coup_in_madagascar: "เตรียมรัฐประหารในมาดากัสการ"
 FRA_coup_in_madagascar_flag: "เตรียมรัฐประหารในมาดากัสการ"
 FRA_coup_in_madagascar_desc: "ชาวฝรั่งเศสจํานวนมากในมาดากัสการยังกระตือรือรนที่จะกลับมาตอสูกับผูรุกราน เราเพียงตองยื่นมือไปหาพวกเขา"
 targeted_sabotage_plant_explosives: "วางระเบิด"
 targeted_sabotage_plant_explosives_desc: "สายลับของเราจะรวมมือกับสมาชิกขบวนการตอตานในทองถิ่น แทรกซึมเขาโรงงานในยามดึกสงัด วางระเบิดใกลโครงสรางรับนํ้าหนัก และทําใหอาคารโรงงานทั้งหลังถลมลงทับเครื่องจักรการผลิต"
 targeted_sabotage_organize_more_meetings: "จัดประชุมใหมากขึ้น"
 targeted_sabotage_organize_more_meetings_desc: "การสัมภาษณคนงานแสดงใหเห็นวา การจัดประชุมยืดยาวเพื่อถกเรื่องเล็กนอยสงผลใหการผลิตชาลงอยางมาก โดยแทบไมมีตนทุนสําหรับสายลับของเรา"
 targeted_sabotage_destroy_bridge: "ทําลายสะพาน"
 targeted_sabotage_destroy_bridge_desc: "ขบวนการตอตานในทองถิ่นไดระบุสะพานแหงหนึ่งซึ่งเปนจุดสําคัญของการสงเสบียงของขาศึกในภูมิภาค สายลับของเราจะใชระเบิดแรงสูงไมกี่ปอนดทําลายชวงสะพานลง"
 targeted_sabotage_collapse_tunnel: "ถลมอุโมงค"
 targeted_sabotage_collapse_tunnel_desc: "ทางรถไฟสายหลักในรัฐนี้วิ่งผานอุโมงคแคบแหงหนึ่ง สายลับของเราไดระบุจุดออนทางโครงสรางของอุโมงค และจะใชระเบิดถลมอุโมงค"
 targeted_sabotage_remove_roadsigns: "ถอดปายบอกทาง"
 targeted_sabotage_remove_roadsigns_desc: "สายลับของเราจะโคนปายถนนและหันปายอื่นกลับทิศ เพื่อใหกองทหารยึดครองหาเสนทางไดยากขึ้น"
 targeted_sabotage_immobilize_rolling_stock: "ทําใหขบวนรถไฟใชการไมได"
 targeted_sabotage_immobilize_rolling_stock_desc: "ทรายเพียงกํามือเดียวในจุดหลอลื่นของตูรถไฟจะทําใหมันหยุดชะงักในที่สุด และปดกั้นทางรถไฟจนกวาจะซอมแซมได แมตูรถไฟที่เสียหายเพียงไมกี่ตูก็อาจทําใหทั้งระบบลมได"
 targeted_sabotage_burn_storage: "เผาคลังสินคา"
 targeted_sabotage_burn_storage_desc: "ขบวนการตอตานในทองถิ่นไดระบุคลังสินคาที่เก็บสารไวไฟสูง ภายใตความมืดของรัตติกาล สายลับของเราจะจุดไฟเผาคลังแลวถอนตัวออกมาทามกลางความโกลาหลที่ตามมา"
 targeted_sabotage_destroy_mining_equipment: "ทําลายอุปกรณเหมืองแร"
 targeted_sabotage_destroy_mining_equipment_desc: "กลุมตอตานในทองถิ่นชี้ใหเห็นวาเครื่องจักรหนักจํานวนมากที่ใชในการทําเหมืองเปราะบางอยางยิ่ง สายลับของเราจะใชระเบิดทําลายชิ้นสวนสําคัญจํานวนหนึ่งเพื่อทําใหการทําเหมืองทั้งหมดหยุดชะงัก"
 operation_targeted_sabotage_industry: "บอนทําลายอุตสาหกรรม"
 operation_targeted_sabotage_industry_desc: "§Lขบวนการตอตานในดินแดนขาศึกรองขอการสนับสนุนในการทําลายโรงงานอุตสาหกรรมในทองถิ่น§!"
 operation_targeted_sabotage_infrastructure: "บอนทําลายโครงสรางพื้นฐาน"
 operation_targeted_sabotage_infrastructure_desc: "§Lขบวนการตอตานในดินแดนขาศึกไดปฏิบัติการระดับยอยตอโครงสรางพื้นฐานของขาศึกมาโดยตลอด แตจนถึงตอนนี้ยังขาดทรัพยากรที่จะสรางผลกระทบรุนแรงได§!"
 operation_targeted_sabotage_resources: "บอนทําลายทรัพยากร"
 operation_targeted_sabotage_resources_desc: "§Lขบวนการตอตานในดินแดนขาศึกแจงใหเราทราบถึงความพยายามของขาศึกในการขุดทรัพยากรในรัฐนี้ การขัดขวางแผนเหลานั้นอยางถูกจุดจะชวยปองกันสิ่งนี้ได§!"
 operation_rescue_operative: "ชวยเหลือสายลับที่ถูกจับ"
 operation_rescue_operative_desc: "§Lขาศึกไดจับตัวคนของเราไปคนหนึ่ง เราตองชิงตัวกลับมาโดยเร็ว กอนที่เขาจะถูกกําจัดไปอยางถาวร§!"
 free_operative_free_in_transit: "ชิงตัวระหวางเคลื่อนยาย"
 free_operative_free_in_transit_desc: "สายลับของเราถูกเคลื่อนยายดวยรถยนตระหวางเรือนจําที่คุมขังกับสถานที่สอบสวน เรารูเสนทาง และจะสงหนวยขนาดเล็กไปซุมโจมตี สังหารผูคุม และปลดปลอยสายลับของเรา"
 free_operative_liberate_camp: "ปลดปลอยคายกักกัน"
 free_operative_liberate_camp_desc: "ระหวางถูกสอบสวน สายลับของเราถูกคุมขังในคายรวมกับนักโทษคนสําคัญคนอื่น ๆ เราจะสงหนวยขนาดเล็กเขาโจมตีคาย ปราบผูคุมทั้งหมด และปลดปลอยสายลับของเรา"
 free_operative_smuggle_in_escape_gear: "ลักลอบสงอุปกรณหลบหนี"
 free_operative_smuggle_in_escape_gear_desc: "นักวิทยาศาสตรของเราไดพัฒนาชุดเครื่องมือหลบหนี เรามีผูติดตอในทองถิ่นที่ตกลงจะนําหอพัสดุเขาไป จากนั้นสายลับของเราจะใชเครื่องมือนั้นหลบหนีไปยังจุดนัดพบเพื่อถอนตัวออกมา"
 operation_outcome_consumes_token_tt: "ปฏิบัติการนี้อาจทําให §Yสายลับที่แทรกซึมอยู§! ถูกเปดโปง"
 operation_outcome_sabotage_industry_tt: "ใหขบวนการตอตานในทองถิ่นมุงเปาไปที่อุตสาหกรรม และเพิ่มโอกาสการโจมตีสําเร็จ"
 operation_outcome_sabotage_infrastructure_tt: "ใหขบวนการตอตานในทองถิ่นมุงเปาไปที่โครงสรางพื้นฐาน และเพิ่มโอกาสการโจมตีสําเร็จ"
 operation_outcome_sabotage_resources_tt: "ใหขบวนการตอตานในทองถิ่นมุงเปาไปที่การขุดทรัพยากร และเพิ่มโอกาสการโจมตีสําเร็จ"
 operation_coup_government: "บงการรัฐประหาร"
 operation_coup_government_desc: "§L[From.GetNameDefCap] สุกงอมพรอมสําหรับการเปลี่ยนระบอบ คนดีที่ไวใจไดไมกี่คน - พรอมการสนับสนุนที่เหมาะสม - ก็อาจโคนโครงสรางอันเนาเฟะที่คํ้าจุนรัฐบาลฝาย[From.GetAdjective]ได§!"
 collaboration_government_set_up_planning_committees: "จัดตั้งคณะกรรมการวางแผน"
 collaboration_government_set_up_planning_committees_desc: "ทีมของเราจะพบกับนักการเมืองที่เห็นอกเห็นใจบางคน เพื่อหารือความเปนไปไดในการจัดตั้งรัฐบาลใหมขึ้นบริหาร [From.GetNameDef] หลังจากเรายึดครอง และจัดตั้งคณะทํางานเล็ก ๆ เพื่อวางรายละเอียด"
 collaboration_government_train_paramilitary_forces: "ฝกกองกําลังกึ่งทหาร"
 collaboration_government_train_paramilitary_forces_desc: "ทีมของเราจะจัดตั้งและฝกหนวยตาง ๆ เพื่อชวยรัฐบาลใหมรักษากฎหมายและความสงบเรียบรอย จนกวารัฐบาลใหมจะจัดตั้งเสร็จ พวกเขาจะชวยรักษาความปลอดภัยในพื้นที่แนวหลัง"
 collaboration_government_contact_military_officers: "ติดตอนายทหาร"
 collaboration_government_contact_military_officers_desc: "ทีมของเราจะติดตามเบาะแสที่บงชี้วานายทหารเกษียณบางคนไมพอใจรัฐบาลฝาย[From.GetAdjective]ชุดปจจุบันอยางมาก และยินดีชวยเราจัดตั้งรัฐบาลใหมหลังการยึดครอง"
 operation_collaboration_government: "เตรียมรัฐบาลรวมมือ"
 operation_collaboration_government_desc: "§Lการมีรัฐบาลที่เปนมิตรปกครอง [From.GetNameDef] จะทําใหเรามุงความสนใจไปที่ศัตรูอื่น ๆ ได และปลดกําลังทหารไปทําภารกิจอื่น§!"
 fake_intel_decoy_tanks: "รถถังลวงตา"
 fake_intel_decoy_tanks_desc: "เราไดประดิษฐเปาลวงราคาถูกที่ดูเหมือนรถถังเมื่อมองจากระยะไกล เราจะวางมันไวในจุดที่สังเกตเห็นไดงาย และทําใหแนใจวาขาศึกมีเวลามากพอที่จะสังเกตเห็น"
 fake_intel_radio_deception: "การลวงทางวิทยุ"
 fake_intel_radio_deception_desc: "เราจะจัดตั้งหนวยผูเชี่ยวชาญดานวิทยุขนาดเล็ก แสรงทําเปนหนวยสื่อสารของกองกําลังที่ใหญกวามาก พวกเขาจะใชรหัสลับรุนเกาของเราดวย เพื่อใหขาศึกอานขอความไดงายขึ้น"
 fake_intel_deliberate_leaks: "จงใจปลอยขอมูลรั่วไหล"
 fake_intel_deliberate_leaks_desc: "สายลับบางคนของเราในตางประเทศจะแสรงทําตัวไมระมัดระวังตอหนาคนที่ถูกตอง เพื่อใหแนใจวาขาศึกไดรับขอมูลที่เราตองการผานแหลงขาวที่ 'นาเชื่อถือ'"
 fake_intel_press_releases: "แถลงขาว"
 fake_intel_press_releases_desc: "เราจะเชิญนักขาวมาเขียนเรื่องราวโดยละเอียดเกี่ยวกับสิ่งที่เราอยากใหขาศึกรู"
 fake_intel_utilize_double_agents: "ใชสายลับสองหนา"
 fake_intel_utilize_double_agents_desc: "เราไดชักจูงผูใหขอมูลระดับลางของหนวยขาวกรองขาศึกจํานวนหนึ่งใหเปลี่ยนขาง พวกเขาจะถูกกระตุนใหสงขอมูลแบบที่เราตองการใหอีกฝาย"
 fake_intel_plant_evidence: "วางหลักฐานปลอม"
 fake_intel_plant_evidence_desc: "เราจะทําปฏิบัติการเล็ก ๆ ในพื้นที่ที่ขาศึกควบคุมแตเราไมไดสนใจในขณะนี้ และทิ้งหลักฐานไวใหมากที่สุด"
 fake_intel_release_pow: "ปลอยเชลยศึก"
 fake_intel_release_pow_desc: "นายทหารขาศึกที่ถูกจับกําลังจะถูกสงตัวกลับบานดวยเหตุผลดานมนุษยธรรม กอนเขาจะจากไป เราจะทําใหแนใจวาเขาบังเอิญไดเห็นบางสิ่ง"
 operation_fake_intel: "ปลอยขาวกรองเท็จ"
 operation_fake_intel_desc: "§Lเรารูวาหนวยขาวกรองฝาย[From.GetAdjective]เคลื่อนไหวอยูในประเทศของเรา บางครั้ง การใหคนที่กําลังหาขอมูลไดยินในสิ่งที่เขาอยากไดยินก็เปนทางเลือกที่ดีกวา§!"
 heavy_water_raid: "ปฏิบัติการกันเนอรไซด"
 heavy_water_raid_desc: "§Lเยอรมนีเริ่มผลิตนํ้ามวลหนักในโรงงานแหงหนึ่งในนอรเวย ซึ่งอาจเกี่ยวของกับโครงการพัฒนาระเบิดปรมาณู แมนํ้ามวลหนักที่ผลิตไดจะไมเพียงพอใหสรางอาวุธดังกลาว แตก็ยอมชวยการวิจัยของพวกเขาไดอยางมากแนนอน§!"
 heavy_water_infiltration: "สงทีมจูโจมและเสบียงทางอากาศ"
 heavy_water_infiltration_desc: "เครื่องบินทิ้งระเบิดดัดแปลงจะสงหนวยคอมมานโดนอรเวยขนาดเล็กลงในพื้นที่ เพื่อสมทบกับทีมลวงหนาและขบวนการตอตานในทองถิ่น"
 heavy_water_attack: "บอนทําลายโรงงานนํ้ามวลหนัก"
 heavy_water_attack_desc: "มีรายงานวาการรักษาความปลอดภัยที่โรงงานหละหลวม เรามีสมาชิกขบวนการตอตานอยูภายในที่ใหตารางการลาดตระเวนแกเรา เมื่อเขาไปได ทีมของเราจะวางระเบิดและทิ้งหลักฐานวานี่เปนปฏิบัติการทางทหารตามปกติ"
 heavy_water_exfiltration: "การถอนตัว"
 heavy_water_exfiltration_desc: "ทีมจะแยกยายกัน บางเขารวมหนวยตอตานในทองถิ่น บางพยายามเดินทางกลับสูแนวฝายเดียวกัน"
 bruneval_raid: "ปฏิบัติการไบติง"
 bruneval_raid_desc: "§Lดูเหมือนขาศึกจะลํ้าหนาเราในการพัฒนาเรดาร เราไดระบุสถานีเรดารของขาศึกในตําแหนงที่เปราะบาง ซึ่งเราเชื่อวากองกําลังขนาดเล็กที่มุงมั่นพอจะยึดไดเพื่อรวบรวมขาวกรองเพิ่มเติม§!"
 bruneval_infiltration: "สงกองกําลังจูโจมดวยรมชูชีพ"
 bruneval_infiltration_desc: "จะมีการรวบรวมทหารสงทางอากาศหนึ่งกองรอย เพื่อกระโดดรมลงใกลเปาหมายจากเพดานบินตํ่าในเวลากลางคืน"
 bruneval_attack: "ยึดสถานีเรดาร"
 bruneval_attack_desc: "กองกําลังจูโจมจะแบงเปนสี่หนวยเพื่อยึดสถานีและเคลียรชายหาดสําหรับอพยพ ผูเชี่ยวชาญจะถอดชิ้นสวนและถายภาพเครื่องเรดาร หนวยจะพยายามจับตัวชางเทคนิคของขาศึกมาสอบสวนดวย"
 bruneval_exfiltration: "อพยพดวยเรือยกพลขึ้นบก"
 bruneval_exfiltration_desc: "กองเรือยกพลขึ้นบกที่บรรทุกทหารคุมกันการอพยพจะเขาเทียบฝงและรับกองกําลังจูโจม โดยจะจัดกําลังทางเรือฝายเดียวกันคุมกันดวย"
 capture_tito: "ปฏิบัติการเริสเซิลสปรุง"
 capture_tito_desc: "§Lพลพรรคยูโกสลาเวียมีกําลังเขมแข็งขึ้นและรุกคืบอยางอาจหาญยิ่งขึ้นเรื่อย ๆ ในหลายพื้นที่ พวกเขาควบคุมชนบทไดอยางแทจริง ปดถนนและปฏิบัติการไดอยางไรการลงโทษ หัวใจสําคัญคือติโต ผูนําพลพรรคผูประสานงานและควบคุมปฏิบัติการเหลานี้ การกําจัดเขาจะเปนการโจมตีอยางหนักตอขบวนการตอตานในพื้นที่เหลานี้§!"
 capture_tito_infiltration: "สงกองกําลังทางอากาศลง"
 capture_tito_infiltration_desc: "พลรมระลอกแรกจะถูกสงลงดวยเครื่องรอนแทบจะตรงตําแหนงที่คาดวาเปนที่ซอนของติโต อาศัยความเร็วและการจูโจมโดยไมใหรูตัว พวกเขาจะเอาชนะทหารคุมกันของติโต และจับกุมหรือสังหารตัวติโตเอง"
 capture_tito_attack: "การโจมตีหลัก"
 capture_tito_attack_desc: "ขบวนยานยนตจะรุกเขาไปสมทบกับหนวยสงทางอากาศ และทําลายหนวยพลพรรคหลักทั้งหมดที่ยืนหยัดสูรบระหวางทาง"
 capture_tito_exfiltration: "รักษาพื้นที่"
 capture_tito_exfiltration_desc: "เมื่อกองกําลังจูโจมทั้งสองสมทบกันแลว พวกเขาจะรวมกําลังและกวาดลางขาศึกที่ยังรอดชีวิต"
 rescue_mussolini: "ชวยเหลือเบนิโต มุสโสลินี"
 rescue_mussolini_desc: "§Lหลังถูก [ITA.GetLeader] โคนลม มุสโสลินีถูกจับกุมคุมขังอยูในโรงแรมเล็ก ๆ บนเทือกเขาแอเพนไนน เรามีโอกาสเพียงเล็กนอยที่จะชวยเหลือเขาและนําตัวกลับมายังแนวของเรา ซึ่งเขายอมชวยบริหารดินแดนอิตาลีหลังชัยชนะของเราไดอยางไมตองสงสัย§!"
 rescue_mussolini_infiltration: "นําเครื่องรอนลงจอดใกลที่คุมขัง"
 rescue_mussolini_infiltration_desc: "หนวยที่คัดเลือกมาเปนพิเศษจะขึ้นเครื่องรอนและลงจอดใหใกลที่สุดกับสถานที่ที่หนวยขาวกรองของเราระบุวามุสโสลินีถูกคุมขัง"
 rescue_mussolini_attack: "บุกที่คุมขัง"
 rescue_mussolini_attack_desc: "หนวยจูโจมจะโจมตีและยึดโรงแรม แลวปลดปลอยมุสโสลินี ทางที่ดีที่สุดคือกองรักษาการณยอมวางอาวุธแทนที่จะสู ความเร็วและการจูโจมโดยไมใหรูตัวคือหัวใจสําคัญ"
 rescue_mussolini_exfiltration: "นําตัวออกดวยเครื่องบิน"
 rescue_mussolini_exfiltration_desc: "เครื่องบินเล็กที่ขึ้นลงในระยะสั้นไดดีเยี่ยมจะลงจอดและรับตัวมุสโสลินี แลวบินพาเขาไปยังสนามบินฝายเดียวกัน"
 GER_rescued_mussolini: "ชวยเหลือมุสโสลินีสําเร็จ"
 infiltration_paradrop_outcome: "แมจะมีปญหาในการหาจุดกระโดดรมในความมืด แตทีมก็ลงพื้นไดอยางปลอดภัย"
 infiltration_submarine_outcome: "แมความพยายามครั้งแรกจะลมเหลวเพราะคลื่นสูง แตความพยายามขึ้นฝงครั้งที่สองในวันรุงขึ้นก็ประสบความสําเร็จ และสงทีมขึ้นฝงไดอยางปลอดภัย"
 infiltration_border_outcome: "ภายใตสภาพอากาศเลวรายอยางยิ่ง ทีมของเราพบเสนทางที่สํารวจไวกอนหนา และขามชายแดนไปไดโดยไมมีปญหาใด ๆ อีก"
 infiltration_diplomatic_outcome: "ทีมเขาประเทศไดโดยไมมีปญหา และหลบเลี่ยงการสะกดรอยของหนวยตอตานขาวกรองขาศึกไดอยางคลองแคลว"
 exfiltration_air_pickup_outcome: "เครื่องบินสงสารลําเล็กหาจุดรับตัวพบไดโดยแทบไมมีปญหา และสงทีมกลับสูแนวของเราอยางปลอดภัย"
 exfiltration_submarine_pickup_outcome: "หลังจากเลนซอนหากับหนวยลาดตระเวนขาศึกในทองถิ่นอยางตึงเครียดอยูหลายวัน ทีมของเราก็จัดการนัดรับตัวและออกจากพื้นที่ไดโดยไมถูกตรวจพบ"
