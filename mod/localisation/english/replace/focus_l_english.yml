 USA_issue_war_bonds:0 "ออกพันธบัตรสงคราม"
 USA_issue_war_bonds_desc:0 "ดวยพันธบัตรสงคราม เราอาศัยการสนับสนุนความพยายามในสงครามและความรักชาติของประชาชนเพื่อหาเงินมาใชจายทางการทหาร"
 USA_office_of_strategic_services:0 "สํานักงานบริการยุทธศาสตร"
 USA_office_of_strategic_services_desc:0 "การจัดตั้งหนวยขาวกรองโดยเฉพาะจะไมเพียงชวยในสงคราม แตยังชวยในปฏิบัติการตางแดนในอนาคตดวย หนวยขาวกรองของอังกฤษสามารถใชเปนตนแบบได"
 USA_wartime_industry:0 "อุตสาหกรรมยามสงคราม"
 USA_wartime_industry_desc:0 "เรามีอุตสาหกรรมที่แข็งแกรง แตไมใชทั้งหมดที่ปรับตัวเขากับการผลิตยุทธปจจัยไดดี การคนหากระบวนการที่มีประสิทธิภาพเพื่อเอื้อตอการเปลี่ยนแปลงนี้จะเปนกุญแจสําคัญในการใชทรัพยากรของเรา"
 USA_first_special_service_force:0 "หนวยรบพิเศษที่หนึ่ง"
 USA_first_special_service_force_desc:0 "ปฏิบัติการหลังแนวขาศึกในพื้นที่ทุรกันดารจะเปนสวนหนึ่งของความขัดแยงระดับโลกใด ๆ ก็ตาม การจัดตั้งหนวยคอมมานโดเพื่อรับบทบาทเหลานี้จึงเปนสิ่งจําเปนตอการทําสงครามในอนาคตของเรา"
 USA_rubber_reserve_company:0 "บริษัทสํารองยาง"
 USA_rubber_reserve_company_desc:0 "เมื่อสงครามปะทุขึ้น เราไดสูญเสียแหลงยางนําเขาเกือบทั้งหมด\n\nดวยความพยายามรวมกันอยางมหาศาล บริษัทยางในสหรัฐอเมริกาสามารถรวมมือกันคนหาวิธีผลิตยางสังเคราะหที่ดีขึ้น และอาจถึงขั้นตอบสนองความตองการของสงครามได"
 USA_manifest_destiny:0 "ชะตาลิขิตที่ประจักษชัด"
 USA_manifest_destiny_desc:0 "สภาพการณพิเศษเกี่ยวกับการกอตั้งและประวัติศาสตรของชาติเรา มอบอาณัติใหเราลงมือตอตานความอยุติธรรมและการกดขี่ไมวาที่ใดในโลก เพื่อสรางประชาคมระหวางประเทศที่ปลอดภัย สินคาสงออกหลักของเราตองเปนเสรีภาพ"
 USA_manifest_destiny_tt:0 "§Yไดรับเปาหมายสงครามตอชาติฟาสซิสตและคอมมิวนิสตทั้งหมด§!\n"
 USA_scientist_haven:0 "แหลงพักพิงของนักวิทยาศาสตร"
 USA_scientist_haven_desc:0 "เมื่อเราประกาศตนเปนผูพิทักษเสรีภาพของโลกแลว เรายอมตอนรับนักวิจัยและปญญาชนที่ถูกขับไลจากระบอบกดขี่ในตางแดน มอบโอกาสใหพวกเขาประสบความสําเร็จและชวยเหลืออุดมการณของเราในดินแดนแหงโอกาส"
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "ผูคนนับลานยังคงทนทุกขจากการวางงานอันเปนผลจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ หนวยงานที่จะจางคนเหลานี้ทํางานในโครงการสาธารณะอาจไมไดแกปญหาไดทั้งหมด แตสํานักงานบริหารความกาวหนาของงานก็เปนกาวที่ถูกทิศทาง"
 USA_committee_on_technocracy:0 "คณะกรรมการเทคโนแครซี"
 USA_committee_on_technocracy_desc:0 "เราควรแทนที่นักการเมืองและนักธุรกิจจํานวนหนึ่งดวยนักวิทยาศาสตรและวิศวกร พวกเขามีความเชี่ยวชาญทางเทคนิคในการบริหารเศรษฐกิจ และเราจะไดเห็นความกาวหนาทางวิทยาศาสตรอยางยิ่งใหญ ซึ่งจะนําเศรษฐกิจของเรากลับมารุงเรืองอีกครั้ง"
 USA_support_rock_island:0 "สนับสนุนร็อกไอแลนด"
 USA_support_rock_island_desc:0 "การสนับสนุนกองทหารผูกลาหาญของเราทุกวิถีทางคือกุญแจสูชัยชนะ ไมวาจะเปนการระดมยิงปนใหญหนักจากระยะไกล หรือการสนับสนุนโดยตรงในสนามรบ เราตองทําใหมั่นใจวากองทหารของเรามีทุกสิ่งที่ตองการ"
 USA_military_construction:0 "การกอสรางทางทหาร"
 USA_military_construction_desc:0 "เมื่อมหาอํานาจคุกคามสันติภาพของโลก โครงการงานสาธารณะของเราจําเปนตองหันมาทํางานดานการทหารควบคูไปกับดานพลเรือน"
 USA_USACE_projects:0 "โครงการของ USACE"
 USA_USACE_projects_desc:0 "กองพลทหารชางแหงกองทัพบกสหรัฐฯ จะไดรับมอบหมายใหวางรากฐานสําหรับโครงการทางทหารในอนาคตอีกมากมาย ในแบบที่โลกไมเคยเห็นมากอน Essayons!"
 USA_arsenal_of_democracy:0 "คลังแสงแหงประชาธิปไตย"
 USA_arsenal_of_democracy_desc:0 "ไมวาเราจะเลือกเขาแทรกแซงสงครามโดยตรงหรือไมก็ตาม ชาติประชาธิปไตยทั้งหลายตองรูวาเราจะสงอาวุธและใหการสนับสนุนพวกเขา"
 USA_liberty_ships:0 "เรือลิเบอรตี"
 USA_liberty_ships_desc:0 "การผลิตเรือสินคาจํานวนมากตองดําเนินไปควบคูกับการพัฒนาทางอุตสาหกรรมของเรา เพื่อใหมั่นใจวายุทธปจจัยและกองทหารของเราจะไปถึงสมรภูมิที่ตองการ"
 USA_war_propaganda:0 "โฆษณาชวนเชื่อเพื่อสงคราม"
 USA_war_propaganda_desc:0 "ประชาชนของเราไมอยากสงลูกหลานไปตายในสงครามอีกครั้ง แตนักการเมืองหลายคนเห็นวาจําเปนตองเขาแทรกแซง โฆษณาชวนเชื่อที่ทําใหศัตรูดูชั่วรายและเรียกรองใหเปดศึกอาจไมใชเครื่องมือของทรราชเพียงอยางเดียว"
 USA_war_plan_black:0 "แผนสงครามสีดํา"
 USA_war_plan_black_desc:0 "เห็นไดชัดวาการเมืองและการขยายดินแดนของเยอรมนีเลยเถิดเกินกวาจะเรียกวามีสติ พวกเขาตองถูกหยุดยั้งกอนที่เครื่องจักรสงครามของพวกเขาจะถึงจุดที่หวนกลับไมได"
 USA_embargo_germany:0 "ควํ่าบาตรเยอรมนี"
 USA_embargo_germany_desc:0 "เยอรมนีตองพึ่งพานํ้ามันและทรัพยากรธรรมชาติอื่น ๆ เพื่อการทําสงคราม การตัดการเขาถึงสิ่งเหลานี้คือสิ่งที่นอยที่สุดที่เราทําได"
 USA_destroyers_for_bases:0 "เรือพิฆาตแลกฐานทัพ"
 USA_destroyers_for_bases_desc:0 "สหราชอาณาจักรตองการเรือ และเราตองปกปองดินแดนบานเกิดของเรา เพื่อแลกกับสิทธิ์ในการตั้งฐานทัพในดินแดนที่ปจจุบันเปนของอังกฤษ เราสามารถแลกเปลี่ยนเรือพิฆาตจํานวนหนึ่ง ซึ่งหวังวาจะถูกนําไปใชใหเกิดประโยชนเชนกัน"
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 USA_war_plan_white:0 "แผนสงครามสีขาว"
 USA_war_plan_white_desc:1 "จะปลอยใหภัยคุกคาม[GetSovietThreatName]ขยายตัวโดยไมมีการควบคุมไมได ไมวาจะมาจากภายนอกหรือภายใน ก็ไมมีภัยคุกคามใดยิ่งใหญกวานี้ตอชาติของเราและตอโลกโดยรวม"
 USA_embargo_USSR:0 "ควํ่าบาตรสหภาพโซเวียต"
 USA_embargo_USSR_desc:0 "การตัดโอกาสทางการคากับเราของสหภาพโซเวียต จะทั้งปองกันไมใหเราชวยเหลือความพยายามทางทหารของพวกเขา และพิสูจนวาระบบเศรษฐกิจของเราเหนือกวา"
 USA_war_plan_red:0 "แผนสงครามสีแดง"
 USA_war_plan_red_desc:0 "หลังจากที่ดูเหมือนจะเดินบนเสนทางแหงการเคารพประชาชน ผูกดขี่เกาของเรากลับขัดแยงกับกระแสแหงการเปลี่ยนแปลงที่เราไดยอมรับ จักรวรรดิบริติชกําลังเผยธาตุแทของตน เราตองใหพวกเขารูวาเรายืนอยูตรงไหน"
 USA_embargo_the_empire:0 "ควํ่าบาตรจักรวรรดิ"
 USA_embargo_the_empire_desc:0 "แมจะมีความสัมพันธอันดีมาชานาน แตอังกฤษไดทรยศตออุดมคติที่เราหวังวาพวกเขาจะเรียนรูที่จะยึดถือ ถึงเวลาแลวที่ตองใหพวกเขารูถึงผลที่ตามมา"
 USA_war_plan_orange:0 "แผนสงครามสีสม"
 USA_war_plan_orange_desc:0 "ไมมีภัยคุกคามใดยิ่งใหญตอเรากวาความทะเยอทะยานแบบจักรวรรดินิยมของญี่ปุน ความพยายามขยายอํานาจเขาสูเอเชียและแปซิฟกของพวกเขาจะทําใหขัดแยงกับผลประโยชนของเราในไมชา"
 USA_unlock_contain_japan_tt: "รางวัลที่ยังไมมีผลในขณะนี้ ซึ่งจะไดรับหาก§Y[JAP.GetNameDef]§!ขยายอํานาจถึงระดับที่เปนอันตราย:"
 USA_embargo_japan:0 "ควํ่าบาตรญี่ปุน"
 USA_embargo_japan_desc:0 "เราตองแสดงใหญี่ปุนเห็นวาการรุกรานของพวกเขาจะไมไดรับการยอมรับหรือความชวยเหลือจากสหรัฐอเมริกา การควํ่าบาตรจะเปนกาวแรกในการขัดขวางความทะเยอทะยานของพวกเขาในแปซิฟก"
 USA_prepare_intervention:0 "เตรียมการแทรกแซง"
 USA_prepare_intervention_desc:0 "ดวยการตัดสินใจทางการทูตและการคา จุดยืนของเราบนเวทีโลกไดเปลี่ยนจากความเปนกลางและนโยบายโดดเดี่ยว มาเปนการแสดงทาทีตอการรุกรานจากตางชาติ นโยบายทางทหารของเราในอนาคตจะสะทอนถึงสิ่งนี้"
 USA_extra_tech_team:0 "ทีมวิจัยเพิ่มเติม"
 USA_manhattan_project:0 "โครงการแมนฮัตตัน"
 USA_manhattan_project_desc:0 "การพัฒนาวัสดุทดแทน โครงการของกองทัพบกวิศวกรสหรัฐฯ ที่ฟงดูไรพิษภัย จะเปนที่รูจักในภายหลังในชื่อโครงการแมนฮัตตัน หนึ่งในภารกิจที่เปนความลับและอันตรายที่สุดในประวัติศาสตรการทหาร โดยมีเปาหมายเพื่อสรางระเบิดปรมาณูลูกแรก"
 USA_unholy_alliance:0 "พันธมิตรอัปมงคล"
 USA_unholy_alliance_desc:0 "บางครั้งเราก็ตองเลือกศัตรูของเรา และบอยครั้งการเลือกนั้นไมงายเลย อนาคตอาจตัดสินเราที่ยืนเคียงขางทรราชคนหนึ่ง หรือยกยองเราที่ชวยโลกใหรอดพนจากทรราชอีกคน"
 USA_unholy_alliance_tt:1 "เพิ่มความสัมพันธและความสัมพันธทางการคากับ[SOV.GetNameDef]หรือเยอรมนีหากทั้งสองทําสงครามกันอยู โดยเขาขางฝายที่ถูกรุกราน"
 USA_limited_intervention:0 "การแทรกแซงอยางจํากัด"
 USA_limited_intervention_desc:0 "ตองเปนการรุกรานที่รุนแรงอยางยิ่งจึงจะดึงเราเขาสูสงครามเต็มรูปแบบได แตหลังจากเหตุการณที่เกิดขึ้นเมื่อไมนานมานี้ ผูคนจํานวนมากก็เต็มใจที่จะชวยเหลือในความขัดแยงตางแดน"
 USA_the_giant_wakes:0 "ยักษตื่น"
 USA_the_giant_wakes_desc:0 "นานาชาติหันมาพึ่งพาเราใหปกปองคุณคาแหงประชาธิปไตยและเสรีภาพ โลกที่อเมริกาผูไมแทรกแซงถือกําเนิดขึ้นนั้นไมมีอยูอีกตอไป และเราตองปรับตัวใหสอดคลอง"
 USA_pearl_harbor_gambit:0 "เดิมพันเพิรลฮารเบอร"
 USA_pearl_harbor_gambit_desc:0 "ฐานทัพเรือที่เพิรลฮารเบอรเปนเปาหมายที่งายสําหรับญี่ปุน การประจํากองเรือไวที่นั่นจะแสดงใหเห็นถึงพลังของเราในแปซิฟก พวกเขาจะกลาทาทายการเคลื่อนไหวอันอาจหาญเชนนี้หรือไม?"
 USA_pearl_harbor_gambit_tt:0 "§Yระหวางที่แผนยุทธศาสตรนี้ดําเนินอยู ญี่ปุนจะมีโอกาสเปดฉากโจมตี§!"
 USA_cancel_pearl_harbor_gambit:0 "ยกเลิกเดิมพันเพิรลฮารเบอร"
 USA_cancel_pearl_harbor_gambit_desc:0 "การประจํากองเรือไวที่เพิรลฮารเบอรเปนอันตรายตอชีวิตของทหารเรือของเรา เราจะไมเสี่ยงชีวิตพวกเขาเพื่อยั่วยุใหเกิดสงครามกับญี่ปุน"
 USA_air_war_plans_division:0 "กองวางแผนสงครามทางอากาศ"
 USA_air_war_plans_division_desc:0 "การจัดลําดับความสําคัญดานการบินและการผลิตอากาศยานใหถูกตองจําเปนตองมีการวางแผนระยะยาว AWPD จะทําใหเรามีทั้งยุทโธปกรณ การจัดองคกร และแผนยุทธศาสตรที่พรอม"
 USA_air_support:0 "การสนับสนุนทางอากาศ"
 USA_air_support_desc:0 "การสงครามทางอากาศตองใชรวมกับปฏิบัติการทางทหารอื่น ๆ เปนอันดับแรก"
 USA_strategic_bombing:0 "การทิ้งระเบิดเชิงยุทธศาสตร"
 USA_strategic_bombing_desc:0 "ขีดความสามารถในการทิ้งระเบิดอยางแมนยําจะทําใหเราหยุดยั้งเครื่องจักรสงครามของชาติใดก็ไดในทันที"
 USA_TAC:0 "มุงพัฒนาเครื่องบินทิ้งระเบิดทางยุทธวิธี"
 USA_TAC_desc:0 "การสรางเครื่องบินที่ออกแบบมาเพื่อโจมตีเปาหมายทางยุทธวิธีจะเปดทางใหกองทหารของเรารุกคืบไดอยางปลอดภัยยิ่งขึ้น"
 USA_combined_bomber_offensive:0 "การรุกทิ้งระเบิดรวม"
 USA_combined_bomber_offensive_desc:0 "เมื่อมีมหาอํานาจอีกชาติอยูฝายเดียวกับเรา เราจึงไดเปรียบอยางคาดไมถึงในการวิจัยและใชการทิ้งระเบิดเชิงรุกขนาดใหญ"
 USA_fund_the_navy:0 "อัดฉีดงบกองทัพเรือ"
 USA_fund_the_navy_desc:0 "เราตองสามารถปรับตัวรับมือกับทุกสิ่งใหมที่ศัตรูโยนใสเรา การเพิ่มงบประมาณสําหรับการฝกซอมของกองทัพเรือจะทําใหกองทัพเรือมีประสิทธิภาพยิ่งขึ้นและเหนือกวาศัตรูในเชิงยุทธวิธี"
 USA_bureau_of_ships:0 "สํานักการเรือ"
 USA_bureau_of_ships_desc:1 "เราจะรวมสํานักการกอสรางและซอมบํารุงกับสํานักวิศวกรรมเขาเปนหนวยงานเดียว เพื่อกํากับดูแลการพัฒนาดานนาวีในอนาคต และในเมื่อทําอยูแลว ก็อาจถึงเวลาตรวจสอบขาวลือเรื่องประสิทธิภาพตอรปโดที่ยํ่าแย ซึ่งสํานักสรรพาวุธปฏิเสธอยางแข็งขัน"
 USA_battleship_primacy:0 "เรือประจัญบานเปนหลัก"
 USA_battleship_primacy_desc:0 "เมื่อญี่ปุนประกาศบอกเลิกสนธิสัญญานาวีวอชิงตัน เราอาจตองเผชิญการแขงขันสะสมอาวุธในมหาสมุทรอีกครั้ง เราจะทําใหมั่นใจวาเรามีเรือประจัญบานทั้งมากที่สุดและดีที่สุด"
 USA_advanced_mahanian_doctrine:0 "หลักนิยมมาฮานขั้นสูง"
 USA_advanced_mahanian_doctrine_desc:0 "อิทธิพลของอัลเฟรด เธเยอร มาฮาน ตอการสงครามทางทะเลนั้นยากจะประเมินตํ่าไปได การตอยอดผลงานของเขาจะชวยใหเราใชประโยชนจากเรือประจัญบานไดอยางเต็มที่ ซึ่งเขามองวาเปนปจจัยชี้ขาด"
 USA_carrier_primacy:0 "เรือบรรทุกเครื่องบินเปนหลัก"
 USA_carrier_primacy_desc:0 "แสนยานุภาพทางอากาศจะเปนสิ่งจําเปนในการรบที่จะมาถึง และวิธีที่ใชไดจริงที่สุดในการขยายพิสัยของมันคือการใชเรือบรรทุกเครื่องบิน เราตองสรางแบบที่กาวหนาและเฉพาะทางยิ่งขึ้น"
 USA_bureau_of_aeronautics:0 "สํานักการบิน"
 USA_bureau_of_aeronautics_desc:0 "เพื่อตอบสนองความตองการในการพัฒนาการบินนาวี สํานักการบินซึ่งรับผิดชอบเรื่องเหลานี้มานานหลายทศวรรษจะตองไดรับการขยาย"
 USA_escort_effort:0 "มุงพัฒนาเรือคุมกัน"
 USA_escort_effort_desc:0 "เรือดํานํ้าเปนภัยตอขบวนเรือสินคาของเรา การมุงพัฒนาเรือพิฆาตแบบใหมจะชวยใหเราทําสงครามตอตานเรือดํานํ้าไดอยางมีประสิทธิภาพ"
 USA_convoy_tactics:0 "ยุทธวิธีขบวนเรือลําเลียง"
 USA_convoy_tactics_desc:0 "การปกปองเรือสินคาของเราไมไดขึ้นอยูกับเรือคุมกันและขาวกรองที่มีประสิทธิภาพเทานั้น แตยังรวมถึงการเลือกทางยุทธวิธีในการจัดเสนทางและกําหนดการเดินเรือคาขายดวย"
 USA_amphibious_operations:0 "ปฏิบัติการสะเทินนํ้าสะเทินบก"
 USA_amphibious_operations_desc:0 "เวนแตฝนรายที่สุดของเราจะเปนจริง สงครามครั้งนี้จะไมจบลงบนแผนดินอเมริกา การยกพลขึ้นบกที่ดําเนินการอยางดีจะตองเปนสวนหนึ่งของเสนทางสูชัยชนะ"
 USA_expand_the_USMC:0 "ขยายนาวิกโยธินสหรัฐฯ"
 USA_expand_the_USMC_desc:0 "นาวิกโยธินสหรัฐฯ เปนกําลังชี้ขาดในสงครามหลายครั้งที่ผานมา และอาจมีความสําคัญยิ่งกวาที่เคยสําหรับการทัพสะเทินนํ้าสะเทินบกของเรา Semper fidelis!"
 USA_reinforce_monroe_doctrine:0 "ยืนยันลัทธิมอนโร"
 USA_reinforce_monroe_doctrine_desc:0 "ลัทธิมอนโรซึ่งมีมากวา 100 ป ไดวางหลักใหสหรัฐฯ เขาแทรกแซงหากยุโรปพยายามลาอาณานิคมในทวีปอเมริกา แตจะอยูหางจากกิจการของยุโรป การเสริมบทบาทของเราในฐานะผูรักษาสันติภาพบนทวีปเหลานี้จะเพิ่มอิทธิพลของเราในภูมิภาค"
 USA_carribean_sphere:0 "เขตอิทธิพลแคริบเบียน"
 USA_carribean_sphere_desc:0 "หมูเกาะแคริบเบียนเปนทําเลเหมาะที่สุดในการเปดฉากโจมตีชายฝงตะวันออกของเราหรือคลองปานามา ดังนั้นแนนอนวาเราตองแสดงใหชัดเจนวาจะไมยอมใหมีการยึดครองพื้นที่นี้โดยฝายศัตรู"
 USA_central_america:0 "อเมริกากลาง"
 USA_central_america_desc:0 "เปนเรื่องที่คิดไมถึงที่จะปลอยใหมหาอํานาจตางชาติใดเขาควบคุม หรือแมแตคุกคามคลองปานามาได ดังนั้นเราจะรับประกันเอกราชของทุกชาติในอเมริกากลาง"
 USA_the_neighbors:0 "เพื่อนบาน"
