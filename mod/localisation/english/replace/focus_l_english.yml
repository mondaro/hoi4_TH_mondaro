 unlocks_decision:0 "ปลดล็อกการตัดสินใจ:"
 USA_continue_the_new_deal:1 "สานตอนโยบายนิวดีล"
 USA_continue_the_new_deal_desc:1 "นโยบายนิวดีลไดพิสูจนแลววาไดผล เราตองไมหลงทางในตอนนี้"
 USA_suspend_the_presecution:0 "ยุติการกดขี่ขมเหง"
 USA_suspend_the_presecution_desc:0 "การขมเหงพลเมืองอเมริกันเพราะความคิดเห็นทางการเมือง ไมวาความคิดเห็นนั้นจะนารังเกียจเพียงใด ลวนขัดกับคุณคาพื้นฐานของประเทศนี้ สิ่งนี้ตองยุติลงทันที"
 USA_desegregate_the_armed_forces:1 "ยกเลิกการแบงแยกสีผิวในกองทัพ"
 USA_desegregate_the_armed_forces_desc:1 "การรับราชการทหารในกองทัพของประเทศตนอาจเปนหนาที่ที่ไมมีใครอยากทํา แตก็อาจเปนสิทธิอันลํ้าคาไดเชนกัน สิทธิที่พลเมืองของเราจํานวนมากถูกปฏิเสธเพียงเพราะเชื้อสายของพวกเขา"
 USA_full_desegregation:1 "ยกเลิกการแบงแยกสีผิวโดยสมบูรณ"
 USA_full_desegregation_desc:1 "รัฐบางรัฐของเราปฏิบัติตอผูคนแตกตางกันตามเกณฑที่เกา ลาสมัย และไรมนุษยธรรมมานานเกินไป ในสาธารณรัฐที่เสรี พลเมืองทุกคนตองไดรับการปฏิบัติอยางเทาเทียม และไมแบงแยก"
 USA_democratic_socialism:1 "สังคมนิยมประชาธิปไตย"
 USA_democratic_socialism_desc:1 "ไมมีผูมีวิจารณญาณคนใดปฏิเสธไดวาสังคมนิยมคืออนาคตของอารยธรรมมนุษย ในขณะเดียวกัน ไมมีพลเมืองผูรักชาติและภาคภูมิใจในสาธารณรัฐนี้คนใดจะสนับสนุนระบบที่รัฐบาลไมไดมาจากประชาชนและเปนของประชาชนอีกตอไป เราจะสรางรูปแบบการปกครองใหมที่ผสานทั้งสองสิ่งเขาดวยกัน เชนเดียวกับบรรพบุรุษผูนาภาคภูมิใจของเรา"
 USA_liberty_for_the_philippines:1 "อิสรภาพแกฟลิปปนส"
 USA_liberty_for_the_philippines_desc:1 "ประชาชนฟลิปปนสไดแสดงใหเห็นแลววาสามารถดูแลกิจการของตนเองได ถึงเวลาแลวที่รองรอยสุดทายของการควบคุมของอเมริกาเหนือประเทศของพวกเขาจะถูกยกเลิกอยางเปนทางการ"
 USA_pacific_decolonisation:1 "การปลดปลอยอาณานิคมในแปซิฟก"
 USA_pacific_decolonisation_desc:1 "ไมมีเหตุผลใดเลย ไมมีแมแตขอเดียว ที่มหาอํานาจยุโรปจะยังคงอยูในแปซิฟก หรือที่จะใหประชาชนบนหมูเกาะแปซิฟกตกเปนทาสรับใชนายชาวยุโรปตอไป อเมริกาจะไมนิ่งดูดายปลอยใหความอยุติธรรมนี้ดําเนินตอไปอีกแลว"
 USA_union_representation_act:1 "รัฐบัญญัติผูแทนสหภาพแรงงาน"
 USA_union_representation_act_desc:1 "การทํางานเปนแกนของชีวิตมนุษย และการรวมตัวเปนสหภาพแรงงานก็เปนสวนพื้นฐานของการจัดระเบียบสังคมประชาธิปไตย จึงสมควรแลวที่เราจะยอมรับสิ่งนี้และรับรองใหสหภาพแรงงานมีผูแทนในสภาคองเกรสโดยบังคับ"
 USA_old_age_pension_act:1 "รัฐบัญญัติบํานาญผูสูงอายุ"
 USA_old_age_pension_act_desc:1 "หลังทํางานมาตลอดชีวิต ประชาชนของเราสมควรไดรับความมั่นคงทางการเงินและความเคารพในวัยชรา กฎหมายที่มีอยูเพื่อชวยเหลือพวกเขานั้นไมเพียงพออยางชัดเจน"
 USA_accumulated_wealth_tax_act:1 "รัฐบัญญัติภาษีความมั่งคั่งสะสม"
 USA_accumulated_wealth_tax_act_desc:1 "คนบางกลุมในประเทศของเราสะสมทุนไวมากมายอยางไรเหตุผล เงินเหลานี้นอนนิ่งอยูในบัญชีธนาคาร หรือถูกลงทุนในอาคารใหญโตเกินใชงาน เฟอรนิเจอรปดทอง และภาพวาดราคาแพง ซึ่งไมมีสิ่งใดกอประโยชนทางเศรษฐกิจเลย ดวยการตั้งภาษีใหม เราจะบังคับใหพลเมืองที่สะสมความมั่งคั่งไรประโยชนเชนนี้นําเงินกลับมาลงทุนในระบบเศรษฐกิจ"
 USA_guarantee_the_american_dream:1 "รับประกันความฝนแบบอเมริกัน"
 USA_guarantee_the_american_dream_desc:0 "ประชาชนสวนใหญของเราไมไดปรารถนาอะไรมากในชีวิต แคงานที่มั่นคง สุขภาพที่ดี และที่สําหรับสรางครอบครัว ไมมีเหตุผลใดที่พวกเขาจะไมควรไดสิ่งเหลานั้น"
 USA_worker_management_act:1 "รัฐบัญญัติการบริหารโดยคนงาน"
 USA_worker_management_act_desc:1 "บอยครั้งเกินไปที่โรงงานและสํานักงานถูกบริหารโดยคนที่ไมเคยทํางานในสายการผลิต เมื่อไมเขาใจความเปนจริงของการผลิต พวกเขาก็ตั้งความคาดหวังที่เปนไปไมได เพื่อปกปองเศรษฐกิจของเราจากความเสียหายที่ผูจัดการไรความสามารถเหลานี้กอขึ้น เราจะบังคับใชการบริหารของคนงาน โดยคนงาน เพื่อคนงาน!"
 USA_militia_organization_act:1 "รัฐบัญญัติการจัดตั้งกองกําลังอาสาสมัคร"
 USA_militia_organization_act_desc:1 "สาธารณรัฐอันภาคภูมิของเรามีประเพณีอันยาวนานของทหารพลเมือง หากประเทศของเราถูกรุกรานจากตางชาติ ผูรุกรานจะตองเผชิญกองกําลังอาสาสมัครชายหญิงที่จัดตั้งอยางดีและติดอาวุธพรอม ตอสูบนผืนแผนดินที่คุนเคยเพื่อปกปองบานของตน"
 USA_communal_property_act:1 "รัฐบัญญัติทรัพยสินสวนรวม"
 USA_communal_property_act_desc:1 "ความตองการของคนสวนมากไมควรถูกความปรารถนาของคนสวนนอย หรือแมแตของคนคนเดียวมีนํ้าหนักเหนือกวา เพื่อใหแนใจในเรื่องนี้ เราจะออกกฎหมายใหมใหชุมชนทองถิ่นเวนคืนที่ดินไดงายขึ้น"
 USA_reintegration:1 "การผนวกกลับคืน"
 USA_reintegration_desc:1 "สงครามไดแบงแยกชาติของเรา แตทายที่สุดแลว แมแตผูที่ลุกขึ้นตอตานเราก็ยังไถโทษได เมื่อประชาชนเรียนรูความผิดพลาดของตนแลว พวกเขาควรไดรับอนุญาตใหกลับมามีสวนรวมในกระบวนการทางการเมืองของสาธารณรัฐอันภาคภูมิของเราอีกครั้ง"
 USA_reach_out_to_the_ware_group:1 "ติดตอกลุมแวร"
 USA_reach_out_to_the_ware_group_desc:1 "มีกลุมคอมมิวนิสตผูอุทิศตนกลุมเล็กๆ อยูในรัฐบาลของเรา พวกเขาเชื่อวาตนปฏิบัติการอยางลับๆ แตเรารูชื่อของพวกเขา บางทีพวกเขาอาจเห็นวาเปาหมายของเราสอดคลองกัน และอาจถูกโนมนาวใหเขารวมรัฐบาลได"
 USA_us_ussr_economic_cooperation:1 "ความรวมมือทางเศรษฐกิจสหรัฐฯ-โซเวียต"
 USA_us_ussr_economic_cooperation_desc:1 "แมจะถือกําเนิดขึ้นทามกลางความโกลาหลและการนองเลือด สหภาพโซเวียตก็มีความกาวหนาอยางนาทึ่งในการสรางสังคมอุตสาหกรรมสมัยใหม เราควรทําหนาที่ของเราในการชวยเหลือพวกเขา"
 USA_secure_china:1 "ยึดจีนใหมั่น"
 USA_secure_china_desc:1 "จีนตกอยูในสงครามกลางเมืองอันยาวนานและนองเลือด รัฐบาลชาตินิยมทุจริตอยางหนักและสูญเสียการสนับสนุนจากประชาชนทั้งหมด ถึงเวลาที่เราจะเริ่มสนับสนุนผูเดียวในจีนที่สามารถรวมและสรางความสงบใหประเทศได นั่นคือพรรคคอมมิวนิสต"
 USA_end_monarchism:1 "ยุติระบอบกษัตริย"
 USA_end_monarchism_desc:1 "ระบอบกษัตริยแหงยุโรปไดพาโลกเขาสูสงครามโลกมาแลวครั้งหนึ่ง เราจะปลอยใหพวกเขาทําเชนนั้นอีกไมได บรรพบุรุษของเราทําสงครามกับกษัตริยอังกฤษเพื่อแลกกับอิสรภาพ เราจะปลดปลอยโลกจากทรราชยของเขาตลอดไป!"
 USA_shatter_the_empires:1 "ทลายจักรวรรดิ"
 USA_shatter_the_empires_desc:1 "ครั้งหนึ่งเราเคยเปนอาณานิคมของจักรวรรดิระดับโลก จนกระทั่งเราแลกอิสรภาพมาดวยเลือด สาธารณรัฐของเราจะไมมีวันมั่นคงอยางแทจริงจนกวาผูที่ฝนจะเปนนายของโลกนี้จะถูกสกัดกั้นไว"
 USA_agricultural_adjustment_act:1 "รัฐบัญญัติปรับปรุงการเกษตร"
 USA_agricultural_adjustment_act_desc:1 "เกษตรกรของเราไดรับผลกระทบอยางหนักจากภาวะเศรษฐกิจตกตํ่า เราตองมั่นใจวาผูผลิตอาหารของเราจะไมถูกตลาดที่ไรการควบคุมบีบใหลมละลาย"
 USA_fair_labour_standards_act:1 "รัฐบัญญัติมาตรฐานแรงงานที่เปนธรรม"
 USA_fair_labour_standards_act_desc:1 "เมื่อสัญญาณแรกของการฟนตัวอยางชาๆ เริ่มปรากฏ ก็ถึงเวลาทําใหแนใจวาคนงานจะไดมีสวนรวมในการฟนตัวนั้น เราตองหามการเอารัดเอาเปรียบ เชน การทํางานลวงเวลาโดยไมไดคาจาง และกําหนดคาแรงขั้นตํ่าที่พอยังชีพได"
 USA_federal_housing_act:1 "รัฐบัญญัติที่อยูอาศัยแหงชาติ"
 USA_federal_housing_act_desc:1 "ในฐานะสวนหนึ่งของความพยายามขจัดความยากจนในสหรัฐอเมริกาที่ดําเนินอยู เราจะจัดตั้งโครงการที่อยูอาศัยที่ไดรับเงินอุดหนุนจากรัฐบาลกลาง"
 federal_housing_tt:0 "(§Yหารัฐแบบสุม§!): เพิ่มชองสิ่งกอสราง §G1§! ชอง"
 USA_office_of_scientific_research_and_development:1 "สํานักงานวิจัยและพัฒนาทางวิทยาศาสตร"
 USA_office_of_scientific_research_and_development_desc:1 "ดวยสงครามที่ตั้งเคาอยูที่ขอบฟา เราตองมุงความพยายามทางวิทยาศาสตรเพื่อใหแนใจวาเราจะไมดอยกวาศัตรูที่อาจเกิดขึ้นรายใด"
 USA_focus_on_europe:1 "มุงสูยุโรป"
 USA_focus_on_europe_desc:1 "มหาอํานาจแหงยุโรปกําลังจะพาโลกเขาสูสงครามโลกอีกครั้ง เราจะรอจนกวามันจะกระทบเราเหมือนครั้งกอนไมได เราตองพรอมเขาแทรกแซงอยางเด็ดขาดหากชาติใดในยุโรปคุกคามสันติภาพ"
 USA_focus_on_asia:1 "มุงสูเอเชีย"
 USA_focus_on_asia_desc:1 "ขณะที่คนสวนใหญมองไปยังยุโรปดวยความกังวล เราก็เผชิญความไมแนนอนและความไรเสถียรภาพทั่วแปซิฟกเชนกัน การเขาแทรกแซงในตางแดนกอนที่เราจะถูกโจมตีใกลบานอาจเปนผลดีที่สุดตอเรา"
 USA_magic:1 "MAGIC"
 USA_magic_desc:1 "กองทัพเรือเชื่อวาสามารถถอดรหัสลับของญี่ปุนได ซึ่งจะทําใหเราอานการสื่อสารทั้งหมดของพวกเขาได รวมถึงการเคลื่อนไหวของเรือ"
 USA_neutrality_act:1 "รัฐบัญญัติความเปนกลาง"
 USA_neutrality_act_desc:1 "ดูเหมือนจะแนนอนขึ้นเรื่อยๆ วาสงครามจะปะทุขึ้นในยุโรป ในชวงมหาสงคราม บริษัทอเมริกันขายอาวุธจํานวนมากใหฝายสัมพันธมิตร และหลายคนเชื่อวาการที่อเมริกาเขาสูสงครามนั้นมีแรงจูงใจหลักจากความตองการใหแนใจวาจะไดรับเงินคาสินคาเหลานั้น ครั้งนี้จะไมมีการคากําไรจากสงครามอีก"
 USA_lend_lease_act_neutrality_tt:0 "\n\nการผานรัฐบัญญัติความเปนกลางจะ§Rเพิ่มเงื่อนไขอยางมาก§!ในการผานรัฐบัญญัติใหยืม-เชา"
 USA_lend_lease_act:1 "รัฐบัญญัติใหยืม-เชา"
 USA_lend_lease_act_desc:1 "ประเทศประชาธิปไตยใหญๆ ของโลกกําลังถูกโจมตี หากพวกเขาพายแพ ก็เปนเพียงเรื่องของเวลากอนที่สงครามจะมาถึงชายฝงของเรา เราตองทําทุกอยางที่ทําไดเพื่อสนับสนุนพวกเขา แมวาพวกเขาจะยังจายคายุทโธปกรณไมไดในทันทีก็ตาม"
 USA_reestablish_the_gold_standard:1 "ฟนฟูมาตรฐานทองคํา"
 USA_reestablish_the_gold_standard_desc:1 "หากไมมีมาตรฐานทองคํา เงินก็เปนเพียงสิ่งที่ตั้งอยูบนความเชื่อ ขณะที่เงินเฟอที่พุงสูงกัดกินเงินออมของประชาชนและลดคาแรงงานของพวกเขา เราตองละทิ้งเสนทางที่ไรความรับผิดชอบทางการคลังนี้"
 USA_adjusted_compensation_act:1 "รัฐบัญญัติปรับปรุงคาตอบแทน"
 USA_adjusted_compensation_act_desc:1 "ทหารผานศึกมหาสงครามของเราไดรับสัญญาวาจะไดบํานาญที่เปนธรรม หลายคนตกอยูในความยากลําบากเมื่อภาวะเศรษฐกิจตกตํ่ามาเยือน เราตองทําทุกอยางที่ทําไดเพื่อชวยเหลือผูที่ตอบรับการเรียกรองของสาธารณรัฐในยามที่ตองการ"
 USA_labour_management_relations_act:1 "รัฐบัญญัติแรงงานสัมพันธ"
 USA_labour_management_relations_act_desc:1 "ธุรกิจทั่วอเมริกากําลังถูกคุกคามจากกิจกรรมสหภาพแรงงานทุกรูปแบบ ทั้งการนัดหยุดงาน การรวมตัว และการเรียกรองคาแรงที่สูงขึ้น เราจะปลอยใหสิ่งนี้ดําเนินตอไปไมได"
 USA_protectionist_tariffs:1 "ภาษีศุลกากรเพื่อการคุมครอง"
 USA_protectionist_tariffs_desc:1 "การคาเสรีไดเปดตลาดของเราใหคูแขงตางชาติ ซึ่งหลายรายตั้งภาษีศุลกากรและอากรของตนเองขึ้น บริษัทของเราเผชิญการแขงขันอยางดุเดือด ขณะที่บริษัทของพวกเขาไดรับความคุมครองหลังกําแพงภาษี สิ่งนี้ตองยุติลง"
 USA_income_tax_reform:2 "การปฏิรูปภาษีเงินได"
 USA_income_tax_reform_desc:1 "ภาษีเงินไดดึงเงินออกจากกระเปาของชาวอเมริกันทุกคน เงินที่พลเมืองของเราสามารถนําไปจับจายซื้อสิ่งอื่นและสนับสนุนเศรษฐกิจทองถิ่นได เราจะคืนอํานาจในการจัดการการเงินของตนเองใหแกชาวอเมริกัน"
 USA_institute_of_american_sciences:1 "สถาบันวิทยาศาสตรอเมริกัน"
 USA_institute_of_american_sciences_desc:1 "มหาวิทยาลัยและหองปฏิบัติการวิจัยทั่วประเทศตางดําเนินการวิจัยตามที่เห็นสมควรมาโดยตลอด สิ่งนี้ตองยุติลง เราจะจัดตั้งองคกรใหมเพื่อประสานความพยายามของนักวิทยาศาสตรระดับโลกของเรา"
 USA_america_first:0 "อเมริกามากอน"
 USA_america_first_desc:2 "บางคนตองการใหเราทุมทรัพยสมบัติและเลือดเนื้อของคนหนุมสาวในสงครามตางแดน เราตองไมหวั่นไหวไปกับพวกกระหายสงครามเหลานี้ และจะยึดถือหลักงายๆ ขอเดียว คือ อเมริกามากอน คนอื่นมาทีหลัง"
 USA_extend_the_chinese_exclusion_acts:1 "ขยายรัฐบัญญัติกีดกันชาวจีน"
 USA_extend_the_chinese_exclusion_acts_desc:2 "เมื่อจีนถูกสงครามยํ่ายี เราตองดําเนินการจํากัดผูอพยพชาวจีน มิฉะนั้นเราจะจมอยูใตคลื่นผูลี้ภัย"
 USA_empower_the_huac:1 "เสริมอํานาจ HUAC"
 USA_empower_the_huac_desc:1 "คณะกรรมาธิการสภาผูแทนราษฎรวาดวยกิจกรรมที่ไมเปนอเมริกันทําหนาที่สําคัญในระบอบประชาธิปไตยที่แข็งแรงของเรา เราตองไมปลอยใหกลุมคนที่ไมจงรักภักดีพยายามแทรกแซงกระบวนการทางการเมือง"
 USA_voter_registration_act:1 "รัฐบัญญัติการลงทะเบียนผูมีสิทธิเลือกตั้ง"
 USA_voter_registration_act_desc:1 "การเลือกตั้งคือสวนที่สําคัญที่สุดของประชาธิปไตย เปนเรื่องไรเหตุผลอยางยิ่งที่จะเรียกรองวาไมควรมีการตรวจสอบวาใครมีสิทธิเขารวม หรือบางที ผูที่สนับสนุนการเลือกตั้งที่ไรการควบคุมอาจมีแรงจูงใจที่ชั่วรายกวานั้น และตองการบอนทําลายกระบวนการดวยการโกงคะแนนเสียง..."
 USA_ally_with_the_silver_shirts:1 "ผูกมิตรกับกลุมเสื้อเงิน"
 USA_ally_with_the_silver_shirts_desc:1 "เพื่อฟนฟูชาติของเราใหกลับสูที่ทางอันเหมาะสมในโลกและทวงคืนชะตาลิขิตอันประจักษของเรา การปรับโครงสรางที่ลึกซึ้งยิ่งกวานี้เปนสิ่งจําเปน กลุมเสื้อเงินจะชวยใหเราบรรลุเปาหมายนี้"
 USA_national_prosperity_program:1 "โครงการความรุงเรืองแหงชาติ"
 USA_national_prosperity_program_desc:1 "กุญแจสูการฟนตัวอยางรวดเร็วและความรุงเรืองที่ยั่งยืนไมไดอยูที่ตลาดที่ไรการควบคุม แตอยูที่โครงการที่ไดรับการชี้นําอยางรอบคอบ ซึ่งเชื่อมโยงวิสาหกิจภาคเอกชนและภาครัฐเขาดวยกัน"
 USA_privatize_the_TVA:1 "แปรรูป TVA"
 USA_privatize_the_TVA_desc:1 "องคการลุมนํ้าเทนเนสซีไดเบียดคูแขงภาคเอกชนออกไปและผูกขาดงานกอสรางในพื้นที่ไวแนน ไมใชหนาที่ของรัฐบาลที่จะทําสิ่งที่ภาคเอกชนพิสูจนแลววาทําไดดีกวา"
 USA_de_regulate_the_banking_sector:1 "ผอนคลายกฎระเบียบภาคธนาคาร"
 USA_de_regulate_the_banking_sector_desc:1 "หลังการปรับฐานของตลาดการเงินซึ่งเปนเรื่องปกติอยางยิ่งในวัฏจักรเศรษฐกิจ รัฐบาลชุดกอนๆ ไดกําหนดขอจํากัดตอกิจกรรมทางการเงินอยางไมสมเหตุสมผลนัก แมจะมีเจตนาดีอยางไมตองสงสัย แตขอจํากัดเหลานี้กอผลเสียมากกวาผลดีอยางชัดเจน"
 USA_national_employment_strategy:1 "ยุทธศาสตรการจางงานแหงชาติ"
 USA_national_employment_strategy_desc:1 "การวางงานเกิดจากขอเท็จจริงงายๆ คือ คนไมตรงกับงานที่มีให โรงงานถูกทิ้งรางเพราะนายจางหาคนที่ตองการไมได ขณะที่ผูคนในสวนอื่นของประเทศอดอยาก เราจะนํายุทธศาสตรใหมมาใชเพื่อใหแนใจวานายจางทุกคนจะหาคนที่ตองการมาดําเนินกิจการได"
 USA_invite_foreign_support:1 "เชิญการสนับสนุนจากตางชาติ"
 USA_invite_foreign_support_desc:1 "เมื่อมีรายงานที่นาวิตกอยางยิ่งเกี่ยวกับความจงรักภักดีของกองทัพและรัฐบาลของบางรัฐ เราอาจตองมองหาการสนับสนุนจากตางประเทศ"
 USA_send_lindbergh_to_germany:1 "สงลินดเบิรกไปเยอรมนี"
 USA_send_lindbergh_to_germany_desc:1 "นักบินชื่อดังผูนี้เสนอตัวไปยุโรปเพื่อศึกษาวาเยอรมนีฟนฟูตนเองอยางไรหลังสงครามครั้งกอน ซึ่งนาจะใหประสบการณอันมีคาแกเรา ลินดเบิรกยังแสดงทาทีวายินดีเขารวมรัฐบาลในฐานะที่ปรึกษา"
 USA_work_with_the_bund:1 "รวมมือกับบุนด"
 USA_work_with_the_bund_desc:1 "สมาคมบุนดเยอรมัน-อเมริกันเสนอชวยเราสื่อสารจุดยืนไปยังชาวอเมริกันเชื้อสายเยอรมันจํานวนมาก ซึ่งจะทําใหเรามีฐานผูสนับสนุนในรัฐเหลานั้น"
 USA_work_with_the_bund_tt:0 "รับประกันวารัฐตอไปนี้จะยังอยูฝายรัฐบาลหากเกิดสงครามกลางเมือง: โอไฮโอ มิสซูรี วิสคอนซิน อิลลินอยส อินดีแอนา และมิชิแกน"
 USA_recruit_the_free_corps:1 "เกณฑกองอาสาเสรี"
 USA_recruit_the_free_corps_desc:1 "เมื่อกองทัพเปนที่นาสงสัยมากขึ้นเรื่อยๆ เราตองหันไปพึ่งวีรบุรุษแหงมหาสงคราม ในยามคับขัน ไฟรคอรปสของเยอรมนีไดเขาชวยสาธารณรัฐเยอรมัน เราตองการองคกรแบบเดียวกันที่จะจงรักภักดีตอเราเมื่อยามคับขันของเรามาถึง"
 USA_honor_the_confederacy:1 "ยกยองสมาพันธรัฐ"
 USA_honor_the_confederacy_desc:1 "เรื่องราวของสงครามกลางเมืองถูกเลาจากมุมมองของฝายเหนือมานานเกินไป เปนเรื่องราวของกบฏที่ถึงคราวลมสลาย ถึงเวลาแลวที่อีกฝายจะไดมีเสียงบาง"
 USA_war_powers_act:1 "รัฐบัญญัติอํานาจสงคราม"
 USA_war_powers_act_desc:1 "ในโลกที่อากาศยานเร็วขึ้นเรื่อยๆ และบรรทุกระเบิดไดมากขึ้นเรื่อยๆ ในโลกของเรือดํานํ้าและอาวุธเคมี การจํากัดใหประธานาธิบดีตองไดรับความยินยอมจากสภาคองเกรสกอนทําสิ่งที่จําเปนเพื่อปองกันประเทศ เทากับเชื้อเชิญหายนะ"
 USA_seize_cuba:1 "ยึดคิวบา"
 USA_seize_cuba_desc:1 "ใกลชายฝงของเรามีเรือบรรทุกเครื่องบินที่ไมมีวันจม พรอมเปนฐานทัพใหผูรุกราน เราตองไมปลอยใหเปนเชนนั้น"
 USA_eliminate_the_southern_threat:1 "ขจัดภัยคุกคามทางใต"
 USA_eliminate_the_southern_threat_desc:1 "เม็กซิโกยุงเหยิงไรเสถียรภาพมาตลอดชั่วคนที่ผานมา ไมวาความรุนแรงจะลามขามพรมแดนมา หรือมีใครรวมประเทศไดแลวยกทัพขึ้นเหนือ ก็ไมสําคัญ เราตองรักษาปกดานใตใหมั่นคง"
 USA_the_canadian_corridor:1 "ระเบียงแคนาดา"
 USA_the_canadian_corridor_desc:1 "ดินแดนแคนาดาแถบเล็กๆ ที่มีประชากรเบาบางกั้นอะแลสกาออกจากแผนดินสหรัฐฯ ตอนลาง การปองกันอะแลสกาจึงขึ้นอยูกับไมตรีของแคนาดา ทวาผูโจมตีที่นาจะเปนไปไดมากที่สุดกลับเปนแคนาดาเอง สภาพเชนนี้ดําเนินตอไปไมได"
 USA_north_american_dominion:1 "เครือจักรภพอเมริกาเหนือ"
 USA_north_american_dominion_desc:1 "เมื่อพรมแดนรอบตัวของเรามั่นคงแลว เราตองมองไกลออกไปเพื่อตัดไฟแตตนลมภัยคุกคามใดๆ ตออเมริกาเหนือ เราจะไมยอมใหมีรัฐนอกคอกใดในภูมิภาคนี้"
 USA_strategic_interests:1 "ผลประโยชนทางยุทธศาสตร"
 USA_strategic_interests_desc:1 "โลกเชื่อมโยงกันมากกวาที่เคย ภัยคุกคามในสวนหนึ่งของโลกอาจขยายตัวจนเปนอันตรายตอทั้งโลกไดงายๆ เราตองสรางเครือขายฐานทัพที่สนับสนุนซึ่งกันและกันทั่วโลก เพื่อใหตอบสนองตอทุกสถานการณไดอยางรวดเร็ว"
 USA_protect_south_america:1 "ปกปองอเมริกาใต"
 USA_protect_south_america_desc:1 "สวนใตของทวีปคูของเราเปนสนามเด็กเลนของจักรวรรดิตางๆ มาตั้งแตถูกคนพบ ถึงเวลาแลวที่ใครสักคนจะรับหนาที่ดูแลใหชาติเหลานั้นไมถูกรบกวน และไดรับการชี้นําสูอนาคตที่สรางสรรคกวาเดิม"
 USA_pacific_pacification:1 "สรางสันติในแปซิฟก"
 USA_pacific_pacification_desc:1 "ออสเตรเลียและนิวซีแลนดอยูไกลจากอังกฤษเกินกวาที่อังกฤษจะปองกันไดอยางมีประสิทธิภาพ เราจะปลอยใหชาติที่เปนศัตรูกับ[USA.GetNameDef]เขายึดครองพวกเขาไมได"
 USA_secure_asia:1 "ยึดเอเชียใหมั่น"
 USA_secure_asia_desc:1 "ชาติอาณานิคมในยุโรปดูเหมือนจะไมเต็มใจหรือไมสามารถปองกันอาณานิคมในเอเชียไดอยางมีประสิทธิภาพ เราตองรับภาระนี้แทนพวกเขา มิฉะนั้นพื้นที่เหลานี้จะกลายเปนฐานกระโดดของการรุกรานครั้งตอไป"
 USA_global_hegemony:1 "อํานาจครอบงําโลก"
 USA_global_hegemony_desc:1 "เรายืนอยูบนธรณีประตูแหงการขึ้นสูความเปนใหญเหนือโลก ซึ่งจะทําใหเราปองกันความขัดแยงไดเพียงดวยการดํารงอยูของเรา เราเพียงตองทําใหมหาอํานาจที่เหลืออยูบนโลกยอมรับสถานะของเรา"
 USA_war_plans_division:1 "กองวางแผนสงคราม"
 USA_war_plans_division_desc:1 "แมเราจะปรารถนาสันติภาพ แตเราตองเตรียมพรอมสําหรับสงคราม"
 USA_intervention_in_the_americas:1 "การแทรกแซงในทวีปอเมริกา"
 USA_intervention_in_the_americas_desc:1 "ภารกิจแรกของเราคือตองมั่นใจวาเราพรอมรับทุกสถานการณในซีกโลกของเราเอง"
 USA_war_plan_green:1 "แผนสงครามสีเขียว"
 USA_war_plan_green_desc:1 "เมื่อเม็กซิโกตกอยูในความไรเสถียรภาพอยางตอเนื่องหลังการปฏิวัติ เราตองพรอมเขาแทรกแซงอยางเด็ดขาด"
 USA_war_plan_crimson:1 "แผนสงครามสีแดงเขม"
 USA_war_plan_crimson_desc:1 "แมตอนนี้แคนาดาอาจเปนเพื่อนบานที่เปนมิตร แตก็อาจไมเปนเชนนั้นตลอดไป"
 USA_war_plan_gray:1 "แผนสงครามสีเทา"
 USA_war_plan_gray_desc:1 "ประวัติศาสตรแสดงใหเห็นวาชาติในแคริบเบียนไรเสถียรภาพอยางมาก เราอาจตองเคลื่อนไหวอยางรวดเร็วเพื่อปกปองผลประโยชนของอเมริกา หากชาติใดในนั้นตกอยูในความไรเสถียรภาพ"
 USA_hemisphere_defense:1 "การปองกันซีกโลก"
 USA_hemisphere_defense_desc:1 "ไมวาจะพัวพันกับตางชาติอยางไร เราตองดูแลละแวกบานของเราเองเปนอันดับแรก"
 USA_intervention_in_europe:1 "การแทรกแซงในยุโรป"
 USA_intervention_in_europe_desc:1 "ไมถึงสองทศวรรษหลังมหาสงครามสิ้นสุด ชาติตางๆ ในยุโรปก็พรอมจะทําสงครามอีกครั้ง เราตองเตรียมพรอมในกรณีที่สถานการณตองการการแทรกแซงอยางรวดเร็ว"
 USA_war_plan_gold:1 "แผนสงครามสีทอง"
 USA_war_plan_gold_desc:1 "ฝรั่งเศสประสบปญหาความแตกแยกภายในและลัทธิการเมืองสุดโตงที่เพิ่มขึ้น แตก็เปนหนึ่งในมหาอํานาจทางทหารที่ยิ่งใหญที่สุดของยุโรป การผสมผสานนี้ทําใหหลายคนรูสึกไมสบายใจ"
 USA_war_plan_silver:0 "แผนสงครามสีเงิน"
 USA_war_plan_silver_desc:0 "อิตาลีประกาศอยางเปดเผยถึงความทะเยอทะยานที่จะครองทะเลเมดิเตอรเรเนียน หากความปรารถนาที่จะสรางจักรวรรดิของพวกเขาขัดกับผลประโยชนของเรา เราตองเตรียมพรอม"
 USA_anti_bolshevist_aid:2 "ความชวยเหลือตอตาน[GetSovietThreatNameAlt]"
