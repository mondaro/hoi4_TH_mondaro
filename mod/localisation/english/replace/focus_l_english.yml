 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "อุตสาหกรรมของเราขับเคลื่อนดวยทรัพยากรที่ขนสงมายังบริเตนจากดินแดนหางไกลหลายแหงของจักรวรรดิ ขบวนเรือลําเลียงคือเสนเลือดใหญของเรา และตองไดรับการปกปองทั้งจากราชนาวีและกองทัพอากาศหลวง เราควรจัดตั้งหนวย RAF พิเศษเพื่อปกปองเสนทางเขาสูทาเรือของเรา!"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "อุตสาหกรรมของเราขับเคลื่อนดวยทรัพยากรที่ขนสงมายังบริเตนจากดินแดนหางไกลหลายแหงของจักรวรรดิ ขบวนเรือลําเลียงคือเสนเลือดใหญของเรา และตองไดรับการปกปองทั้งจากกองทัพเรือปลดปลอยกรรมกรและกองทัพอากาศประชาชน เราควรจัดตั้งหนวย PAF พิเศษเพื่อปกปองเสนทางเขาสูทาเรือของเรา!"
 aircraft_production_focus:0 "กลุมการผลิตอากาศยาน"
 aircraft_production_focus_desc:0 "การผลิตอากาศยานยังคงเปนภารกิจสําคัญสูงสุดของเรา ควรจัดตั้งกลุมการผลิตอากาศยานลอนดอน (LAPG) เพื่อบริหารและประสานการผลิตที่เกี่ยวของกับอากาศยานทั้งหมด"
 uk_jet_focus:0 "อากาศยานไอพน"
 uk_jet_focus_desc:0 "ดูเหมือนแทบแนนอนแลววาเครื่องยนตไอพนจะมาแทนที่เครื่องยนตใบพัดบนเครื่องบิน ศักยภาพนั้นมหาศาล และเราตองไมปลอยใหบริเตนลาหลังในการวิจัยสาขาสําคัญนี้"
 naval_rearmament_focus:0 "การฟนฟูกําลังรบทางเรือ"
 naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "แมเราจะพยายามปองกันการแขงขันสะสมอาวุธทางเรือดวยสนธิสัญญานาวีลอนดอนฉบับที่สอง แตแมแตชาติผูลงนามสวนใหญก็เพิกเฉย ราชนาวีตองไมมีวันสูญเสียความเปนใหญระดับโลก เราตองรักษาใหราชนาวียังคงเปนกองทัพเรือที่ใหญที่สุดในโลกเสมอ"
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "แมเราจะพยายามปองกันการแขงขันสะสมอาวุธทางทะเลดวยสนธิสัญญานาวีลอนดอนฉบับที่สอง แตแมแตประเทศผูลงนามเองก็แทบไมใสใจกับมัน กองทัพเรือปลดปลอยกรรมกรตองไมมีวันสูญเสียความเปนเจาทะเลระดับโลก เราตองทําใหมั่นใจเสมอวากองทัพเรือของเรายังคงใหญที่สุดในโลก"
 uk_destroyer_focus:0 "เนนเรือพิฆาต"
 uk_destroyer_focus_desc:0 "เรือประจัญบานสมัยใหมนั้นนาทึ่ง แตเราตองไมมองขามบทบาทสําคัญของเรือพิฆาตธรรมดา ๆ ในการคุมกันขบวนเรือลําเลียงของเรา"
 uk_convoy_focus:0 "เนนการคุมกันขบวนเรือลําเลียง"
 uk_convoy_focus_desc:0 "ยํ้าเทาไรก็ไมพอ ขบวนเรือลําเลียงคือเสนเลือดใหญของเรา เราตองทําทุกวิถีทางเพื่อปกปองพวกมัน และทดแทนระวางเรือที่สูญเสียไปอยางรวดเร็ว"
 uk_waves_focus:0 "บริทาเนียครองทะเล"
 uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "ภายใตเงาอันยิ่งใหญของราชนาวีอังกฤษ มหาอํานาจทางทะเลอื่น ๆ ถูกบีบใหคิดคนหลักนิยมใหม ๆ เพื่อชดเชย เราตองไมประมาทและพึ่งพาเพียงจํานวนและคุณภาพของเรือแตละลําเทานั้น"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "ภายใตเงาอันยิ่งใหญของกองทัพเรือปลดปลอยกรรมกร มหาอํานาจทางทะเลอื่น ๆ ถูกบีบใหคิดคนหลักนิยมใหม ๆ เพื่อชดเชย เราตองไมประมาทและพึ่งพาเพียงจํานวนและคุณภาพของเรือแตละลําเทานั้น"
 uk_carrier_focus:0 "เนนเรือบรรทุกเครื่องบิน"
 uk_carrier_focus_desc:0 "นักทฤษฎีทางทะเลกําลังถกเถียงกันอยางดุเดือดวาเรือประจัญบานจะยังคงมีประโยชนตอไปหรือไม บางฝายแยงวากําลังทางอากาศสมัยใหมจะเขามาครอบงํากําลังทางทะเล และเรือบรรทุกเครื่องบินจะเขามาแทนที่เรือประจัญบานในฐานะราชาแหงมหาสมุทร"
 uk_spain_focus:0 "กดดันสเปน"
 uk_spain_focus_desc:0 "ชาวสเปนรูซึ้งยิ่งกวาใครถึงอานุภาพของราชนาวีอังกฤษ แตบางทีการเตือนความจําสักหนอยก็คงไมเสียหาย..."
 uk_battleship_focus:0 "เนนเรือประจัญบาน"
 uk_battleship_focus_desc:0 "ขณะที่นักทฤษฎีทะเลาะกันเรื่องความเหนือกวาทางอากาศหรือทางทะเล ไมมีใครอยากใหปนของเรือประจัญบานเล็งมาที่วังของตน ตอใหฝายที่คลั่งไคลเรือบรรทุกเครื่องบินเปนฝายถูกในทายที่สุด เรือประจัญบานก็จะยังคงครองมหาสมุทรไปอีกหลายป"
 uk_turkey_focus:0 "กดดันตุรกี"
 uk_turkey_focus_desc:0 "พวกเติรกไมจําเปนตองรักเรา แตก็ควรรูจักเกรงกลัวเรือประจัญบานของเราบาง..."
 uk_amphibious_focus:0 "การสงครามสะเทินนํ้าสะเทินบก"
 uk_amphibious_focus_desc:0 "การครองทะเลนั้นดีอยูแลว แตบางครั้งเราก็ตองลงไปลุยนํ้าบาง เราตองไมละเลยขีดความสามารถในการยกพลขึ้นบกในดินแดนของศัตรู"
 singapore_focus:0 "ยุทธศาสตรสิงคโปร"
 singapore_focus_desc:0 "สิงคโปรควรเปนฐานทัพเรือหลักของเราในโลกตะวันออกตอไป ฮองกงอาจตกเปนของญี่ปุน แตสิงคโปรตองคงความแข็งแกรงไมอาจตีแตกได จนกวากองเรือหลักจะมาถึงเพื่อบดขยี้ศัตรูอยางเด็ดขาด"
 sp_landward_forts_focus:0 "ปอมปราการดานบก"
 sp_landward_forts_focus_desc:0 "แนวปองกันบนเกาะสิงคโปรในปจจุบันยังไมเพียงพอ เราตองทุมเทความพยายามเสริมความแข็งแกรงของปอมปราการ!"
 peninsular_focus:0 "สงครามคาบสมุทร"
 peninsular_focus_desc:0 "เราควรชิงสกัดและถวงเวลาศัตรูที่บุกลงมาจากทางเหนือผานมลายู กอนที่พวกมันจะไปถึงสิงคโปร"
 hongkong_focus:0 "ยึดมั่นฮองกง"
 hongkong_focus_desc:0 "ยุทธศาสตรสิงคโปรลาสมัยแลว แผนของเราควรกลาหาญกวานี้และพึ่งพาฐานทัพที่อยูใกลญี่ปุนมากขึ้น ดวยปอมปราการและสิ่งอํานวยความสะดวกที่เพียงพอ ฮองกงจะทําหนาที่นี้ไดอยางสมบูรณแบบ!"
 hk_landward_forts_focus:0 "ปอมปราการดานบก"
 hk_landward_forts_focus_desc:0 "ฮองกงจะตองกลายเปนนครปอมปราการ เพื่อตานทานการโจมตีตอเนื่องจากจีนแผนดินใหญ"
 hk_air_focus:0 "การปองกันภัยทางอากาศ"
 hk_air_focus_desc:0 "เราตองขยายและปรับปรุงที่ตั้งปนตอสูอากาศยานในฮองกงอยางมาก"
 uk_embargo_focus:0 "นโยบายควํ่าบาตร"
 uk_embargo_focus_desc:0 "วิธีที่ดีที่สุดในการเอาชนะเผด็จการ ไมวาจะแดงหรือนํ้าตาล ก็คือตัดทรัพยากรที่พวกมันตองใชทําสงครามเสีย ปญหาก็แคตองขมขูบรรดานายธนาคารและบรรษัทที่ทําธุรกิจกับพวกมันเทานั้น..."
 uk_sanction_italy_focus:0 "ควํ่าบาตรอิตาลี"
 uk_sanction_italy_focus_desc:0 "มุสโสลินีฝนถึงจักรวรรดิโรมันใหม และแมจะฟงดูไรสาระ แตสักวันเขาอาจโจมตีเราเพื่อทําใหความฝนนั้นเปนจริง เราควรทําทุกอยางที่ทําไดเพื่อปองกันไวกอนที่จะลุกลามเปนสงคราม"
 uk_sanction_japan_focus:0 "ควํ่าบาตรญี่ปุน"
 uk_sanction_japan_focus_desc:0 "ญี่ปุนดูมุงมั่นที่จะสราง 'วงไพบูลยรวมกันแหงมหาเอเชียบูรพา' ซึ่งแนนอนวาอยูภายใตการครองอํานาจของพวกเขา จักรวรรดิบริติชคืออุปสรรคหลัก รวมกับอาณานิคมของมหาอํานาจตะวันตกอื่น ๆ เราตองตัดพวกเขาออกจากทรัพยากรที่ตองการ"
 uk_burma_focus:0 "ถนนสายพมา"
 uk_burma_focus_desc:0 "เราควรชวยเหลือจีนในการตอสูกับญี่ปุน ดวยการสรางถนนพรอมโครงสรางพื้นฐานที่เกี่ยวของระหวางพมากับจีน เพื่อใหเสบียงไปถึงพวกเขาทางบกไดอยางปลอดภัยจากการคุกคามของญี่ปุน"
 uk_scandinavian_focus:0 "การแทรกแซงสแกนดิเนเวีย"
 uk_scandinavian_focus_desc:0 "สแกนดิเนเวียแทบไมมีความสําคัญทางยุทธศาสตร หากไมใชเพราะสิ่งหนึ่ง นั่นคือการสงออกแรเหล็กของสวีเดน เราตองกดดันทั้งสวีเดนและนอรเวย เพื่อไมใหทรัพยากรสําคัญนี้ไปถึงเยอรมนี หากพวกเขาปฏิเสธ เราอาจตองเตรียมพรอมที่จะบุก..."
 uk_iraq_focus:0 "ควบคุมอิรัก"
 uk_iraq_focus_desc:0 "เรามอบเอกราชใหอิรักในป 1932 แตเมื่อพิจารณาสถานการณโลกในปจจุบัน นั่นอาจเปนความผิดพลาด จะตองไมปลอยใหนํ้ามันของอิรักตกไปถึงมือศัตรูของเราเด็ดขาด..."
 uk_iran_focus:0 "ควบคุมอิหราน"
 uk_iran_focus_desc:0 "อิหรานไมเพียงอุดมไปดวยนํ้ามันที่ตองกันไมใหศัตรูไดไป แตยังเปนจุดเชื่อมตอทางยุทธศาสตรระหวางอินเดีย ตะวันออกกลาง และสหภาพโซเวียตอีกดวย"
 uk_free_india_focus:0 "เอกราชของอินเดีย"
 uk_free_india_focus_desc:0 "ญี่ปุนกําลังปลุกปนการกบฏในอินเดียอยางแข็งขัน และถึงกับจัดตั้ง 'กองทัพแหงชาติอินเดีย' ซึ่งประกอบดวยทหารเกณฑชาวอินเดีย สถานการณอาจกลายเปนอันตรายหากไมทําอะไรเพื่อปองกัน เราอาจเอาชนะญี่ปุนใหไดอยางรวดเร็ว หรือไมก็สัญญาวาจะใหเอกราชแกชาวอินเดียในอีกไมกี่ป"
 uk_colonial_focus:0 "สงเสริมชนชั้นนําในอาณานิคม"
 uk_colonial_focus_desc:0 "จักรวรรดิอันกวางใหญไพศาลของเราเปนที่อยูของผูมีปญญาเลิศที่สุดบางสวนของโลก แตดวยขนาดของมัน หลายคนจึงไมเคยไดพบกันเลย การสนับสนุนใหพวกเขารวมมือกันในโครงการที่สําคัญที่สุดของเรา จะชวยใหเราไดผลลัพธรวดเร็วยิ่งขึ้น"
 uk_asia_focus:0 "เสริมกําลังเอเชียตะวันออก"
 uk_asia_focus_desc:0 "อาณานิคมเกาแกหลายแหงของเราในตะวันออกกําลังถูกคุกคามจากสงครามกลางเมืองและความทะเยอทะยานเชิงจักรวรรดิของประเทศในภูมิภาค เราตองไมละเลยที่มั่นที่เหลืออยู แตตองพัฒนาภูมิภาคเหลานี้ตอไปเพื่อรักษาสถานะของเราในเวทีโลก"
 uk_china_focus:0 "แผอิทธิพลสูจีน"
 uk_china_focus_desc:0 "แมฝายชาตินิยมจีนจะประกาศตนเปนศัตรูของความพยายามดานอาณานิคมของเรา แตพวกเขาก็ติดอยูทามกลางศัตรูโดยมีพันธมิตรนอยเกินไป หากเรายื่นมือเขาไป พวกเขาอาจยอมเปลี่ยนนโยบาย"
 uk_commonwealth_focus:0 "สายสัมพันธเครือจักรภพ"
 uk_commonwealth_focus_desc:0 "ประเทศตาง ๆ ในเครือจักรภพบริติชซึ่งรวมใจกันดวยความภักดีตอราชบัลลังก คือกลุมแรกที่เราพึ่งพาไดหากเกิดความขัดแยงระดับโลกขึ้นอีกครั้ง การวางรากฐานการบริหารทางการทูตของเราที่นั่นจึงเปนเรื่องสําคัญยิ่ง"
 uk_india_focus:0 "พัฒนาบริติชราช"
 uk_india_focus_desc:0 "สถานะของอาณานิคมของเราในอินเดียยังคงเปนที่ถกเถียงทั้งในตางประเทศและในประเทศ แตไมวาอนาคตของพวกเขาจะเปนอยางไร การเสริมสรางขีดความสามารถทางอุตสาหกรรมของพวกเขาคือสิ่งสําคัญอันดับแรกในขณะนี้"
 northern_expansion_focus:0 "ขยายดินแดนขึ้นเหนือ"
 northern_expansion_focus_desc:0 "หลักนิยมขยายดินแดนขึ้นเหนือซึ่งไดรับการสนับสนุนจากกองทัพบกจักรวรรดิ ถือวาสหภาพโซเวียตเปนภัยคุกคามที่ใหญที่สุดตอความทะเยอทะยานของญี่ปุน เมื่อความตึงเครียดในยุโรปทวีความรุนแรงขึ้น จังหวะที่เหมาะสมในการโจมตีตะวันออกไกลของรัสเซียยอมตองมาถึง เราตองโจมตีอยางรวดเร็ว"
