 USA_war_plan_yellow:1 "แผนสงครามสีเหลือง"
 USA_war_plan_yellow_desc:1 "จีนอยูในภาวะสงครามกลางเมืองมานานกวาชั่วคน ไมมีใครบอกไดวาเมื่อใดสถานการณจะเลวรายถึงจุดที่เราตองเขาแทรกแซง"
