 FRA_military_factories_desc:1 "เครื่องจักรสงครามของเรากําลังตามหลังในดานกําลังการผลิต เราตองมุงผลิตยุทโธปกรณทางทหารบนแผนดินแม เพื่อใหกองกําลังของเราไดรับยุทโธปกรณใหมอยางตอเนื่อง"
