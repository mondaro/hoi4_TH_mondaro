 FRA_fortification_focus:0 "มุงเนนปอมปราการ"
 FRA_fortification_focus_desc:0 "แมปอมปราการของเราจะสําคัญยิ่ง แตเราตองหาวิธีสรางมันใหมีประสิทธิภาพยิ่งขึ้น แนวมาฌีโนเปนเครื่องยับยั้งกองกําลังขาศึกที่ทรงพลัง และเราสามารถใชความมั่นคงจากแนวปองกันเชนนี้ไดอีก"
 FRA_alpine_forts:0 "ปอมปราการเทือกเขาแอลป"
 FRA_alpine_forts_desc:0 "ชาวอิตาลีจะขามพรมแดนมาไมไดงาย ๆ เมื่อเราสรางแนวปองกันใหมที่วางแผนไวครอบคลุมเทือกเขาแอลปเสร็จสิ้น เราจะมีเวลาตอบโตและเสริมกําลังที่มั่นของเรา"
 FRA_extend_the_maginot_line:0 "ขยายแนวมาฌีโน"
 FRA_extend_the_maginot_line_desc:0 "เราไมอาจหวังพึ่งใหเบลเยียมยืนหยัดได หากพวกเขาปลอยใหกองทัพขาศึกผานไป เราอาจตกที่นั่งลําบาก การขยายแนวมาฌีโนจึงสําคัญยิ่งตอการกันกองทัพที่ไมพึงประสงคไมใหเขามาในฝรั่งเศส!"
 FRA_infantry_focus:0 "การระดมพลทั้งชาติ"
 FRA_infantry_focus_desc:0 "ชายและหญิงทุกคนที่สูไดจะตองสู การผลิตอาวุธจํานวนมากจะชวยลดตนทุน เราจะใสปนไรเฟลไวในมือของทุกคน"
 FRA_artillery_focus:0 "กร็องดบัตเตอรี"
 FRA_artillery_focus_desc:0 "ปนใหญของเราจะรวมเปนหนวยเดียวที่ทรงพลังเพื่อระดมยิงไปยังจุดเฉพาะ ยิงทีละชุด แลวเราจะบั่นทอนแนวขาศึกและตีฝาออกไปหากจําเปน!"
 FRA_heavy_armor_focus:0 "รถถังประจัญบาน"
 FRA_heavy_armor_focus_desc:0 "รถถังประจัญบานคือหนทางขางหนาของกองทัพฝรั่งเศส เราตองการควบคุมสมรภูมิ และดวยเหตุนี้เราจึงตองการรถถังใหมที่ทรงพลัง!"
 FRA_motorized_focus:0 "มุงเนนยานยนต"
 FRA_motorized_focus_desc:0 "การหาวิธีสรางยานพาหนะสําหรับทหารราบที่ดีขึ้นจะชวยเพิ่มขีดความสามารถในการสนับสนุนและเสริมกําลังแนวหนา"
 FRA_mechanized_focus:0 "มุงเนนยานเกราะลําเลียงพล"
 FRA_mechanized_focus_desc:0 "ยานเกราะมีบทบาทสําคัญมากขึ้นเรื่อย ๆ ในสงคราม แมจะดูนาเกรงขามนอยกวารถถังทั่วไปอยูบาง แตก็ทําใหเราไดเปรียบในดานการสื่อสาร การบังคับบัญชา การขนสง และการรบในเมือง"
 FRA_light_medium_armor:0 "ออโตมิทราเยิส"
 FRA_light_medium_armor_desc:0 "ตามกฎหมาย ทหารราบเปนผูควบคุมกําลังรถถังทั้งหมด 'ยานพาหนะ' ของทหารมาที่เบากวาและเร็วกวา หรือออโตมิทราเยิส จึงเหมาะกับการเคลื่อนที่มากกวา และยังสรางความเสียหายไดดวยอาวุธที่ติดตั้งอยู"
 FRA_army_reform:0 "ปฏิรูปกองทัพ"
 FRA_army_reform_desc:0 "ไมมีหนวยทหารราบหรือรถถังไฮเทคใดเพียงลําพังที่จะทําใหเราชนะสงครามได เราตองทุมเทพัฒนาขีดความสามารถทั้งทางยุทธวิธีและยุทธศาสตร ดวยคนที่เหมาะสมกับงาน เราจะพัฒนาเปนกองทัพที่กาวหนาได"
 FRA_navy_focus:0 "มุงเนนกองทัพเรือ"
 FRA_navy_focus_tt:0 "ชองกอสรางสําหรับ§Yฐานทัพเรือ§!ไมเพียงพอ"
 FRA_navy_focus_desc:0 "หากเราวางแผนจะขยายกองทัพเรือ ขั้นแรกคือการปรับปรุงและขยายฐานทัพเรือของเรา เรือที่มีเอกลักษณของเราตองไดรับการดูแลอยางตอเนื่องเพื่อใหพรอมรบอยูเสมอ"
 FRA_improved_screen_ships:0 "ปรับปรุงเรือคุมกัน"
 FRA_improved_screen_ships_desc:0 "เรือพิฆาตและเรือลาดตระเวนเบามีบทบาทสําคัญในการปกปองเรือประจัญบานหรือเรือบรรทุกเครื่องบินที่หนักกวา หากเราสูญเสียแนวปองกันในทะเล เราก็เสี่ยงที่จะเสียเรือและกําลังพลทั้งหมด เราตองทําใหมั่นใจวาเรือของเราสรางขึ้นดวยเทคโนโลยีลาสุด"
 FRA_capital_ship_focus:0 "มุงเนนเรือหลัก"
 FRA_capital_ship_focus_desc:0 "การปรับปรุงแบบเรือประจัญบานของเราจะนํามาซึ่งความไดเปรียบทางยุทธวิธีอยางมาก เมื่อพิสัยและอานุภาพของมันไมมีใครเทียบ ก็จะไมมีผูใดหนีพนปนของมันได"
 FRA_carrier_focus:0 "มุงเนนเรือบรรทุกเครื่องบิน"
 FRA_carrier_focus_desc:0 "นักทฤษฎีทางนาวีไดชี้ใหเราเห็นถึงเรือบรรทุกเครื่องบินที่ลาสมัยของเรา พวกเขามีขอเสนอวาจะใชประโยชนจากเรือบรรทุกเครื่องบินไดมากขึ้นอยางไร หากผลักดันการพัฒนาไปในทิศทางที่ถูกตอง ความกาวหนาที่แทจริงจะเกิดขึ้นไมไดหากขาดการสนับสนุนเต็มที่จากเรา"
 FRA_initiate_government_reform:0 "ปฏิรูปรัฐบาล"
 FRA_initiate_government_reform_desc:0 "โลกไดกลายเปนที่อันตราย เราไมอาจถูกพันธนาการดวยการทะเลาะเบาะแวงเล็ก ๆ นอย ๆ ของเราเองไดอีกตอไป ถึงเวลาที่ตองเสริมอํานาจใหนักการเมืองของเราและกาวไปขางหนาเพื่อฝรั่งเศส"
 FRA_support_the_left:0 "สนับสนุนฝายซาย"
 FRA_support_the_left_desc:0 "โคมินเทิรนกําลังแข็งแกรงขึ้น ถึงเวลาที่จะแสดงใหเห็นวาผลประโยชนของเราไปในทางเดียวกันได และสนับสนุนองคกรคอมมิวนิสตของเรา"
 FRA_leftist_rhetoric:0 "วาทกรรมฝายซาย"
 FRA_leftist_rhetoric_desc:0 "เปาหมายชัดเจน ความเทาเทียมสําหรับทุกคน เราไมตองการผลประโยชนของนายทุนในการเมืองฝรั่งเศส จําเปนอยางยิ่งที่เราตองสรางเงื่อนไขที่ดีที่สุดใหองคกรคอมมิวนิสตของเราเติบโต"
 FRA_scw_intervention_republicans:0 "แทรกแซงฝายสาธารณรัฐ"
 FRA_scw_intervention_republicans_desc:0 "สเปนฝายสาธารณรัฐตองการความชวยเหลือจากเรา! \nใครก็ตามที่เต็มใจสูเพื่ออุดมการณนี้ควรไดรับอนุญาตใหไป เราไมอาจปลอยใหระบอบฟาสซิสตอีกระบอบหนึ่งไดที่มั่น"
 FRA_national_mobilization:0 "ระดมพลทั้งชาติ"
 FRA_national_mobilization_desc:0 "ในที่สุดเราก็มีรัฐบาลที่สามารถลงมือทําได บัดนี้ถึงเวลาเสริมสรางกองทัพและเตรียมพรอมที่จะสูเพื่อฝรั่งเศส"
 FRA_humanite_unie:0 "มนุษยชาติผนึกกําลัง"
 FRA_humanite_unie_desc:0 "นายธนาคารอวนพีและนักปลุกปนผูกระหายอํานาจกําลังบีบรัดโลกดวยกํามือเปอนเลือดแนนขึ้นทุกที ในแตละวันเราเห็นเสรีชนตกเปนทาส และโลกถลําลึกลงสูวิกฤตที่เกิดจากความโลภของปจเจกบุคคล อุดมการณของฝรั่งเศสเปนที่ตองการมากกวาที่เคย! มนุษยชาติตองการเรา และเราตองรวมมนุษยชาติใหเปนหนึ่ง!"
 FRA_join_comintern:0 "เขารวมโคมินเทิรน"
 FRA_join_comintern_desc:0 "ดวยศัตรูที่อยูรอบดาน เราตองเสริมจุดยืนดวยพันธมิตรที่ทรงพลัง ความสัมพันธของเรากับโคมินเทิรนแนนแฟนขึ้นแลว และถึงเวลาที่เราจะอุทิศตนใหกับอุดมการณของพวกเขาอยางเต็มที่"
 FRA_support_status_quo:0 "สนับสนุนสถานะเดิม"
 FRA_support_status_quo_desc:0 "ฝรั่งเศสคือแหลงกําเนิดและผูพิทักษเสรีภาพ และควรเปนเชนนั้นตอไป หากเราปรารถนาจะกลับมาเปนหนึ่งเดียวอีกครั้ง เราตองสรางเสถียรภาพใหประชาธิปไตยของเรากอนที่มันจะเสื่อมถอย"
 FRA_little_entente:0 "ความตกลงไตรภาคีนอย"
 FRA_little_entente_desc:0 "ความตกลงไตรภาคีนอย พันธมิตรที่กอตั้งขึ้นหลังมหาสงครามเพื่อปองกันการรุกรานของออสเตรียและฮังการีตอเพื่อนบาน ไดรับการสนับสนุนจากฝรั่งเศส แตบัดนี้เริ่มแตกสลาย แทนที่จะกระชับความสัมพันธกับอังกฤษ เราควรริเริ่มฟนฟูและรวบรวมฝายนี้ใหมั่นคง โดยเริ่มจากผูกอตั้งอยางเชโกสโลวาเกีย"
 FRA_go_with_britain:0 "เคียงขางอังกฤษ"
 FRA_go_with_britain_desc:0 "เมื่อรัสเซียเปลี่ยนไปตลอดกาล เหลือเพียงฝรั่งเศสและอังกฤษจากไตรภาคีเดิม หากประวัติศาสตรถูกลิขิตใหซํ้ารอย เราตองทําใหมั่นใจวาสองชาตินี้ ซึ่งเปนปราการแหงประชาธิปไตยและเสรีภาพในยุโรป จะยังคงเปนพันธมิตรกัน"
 FRA_strengthen_government_support:0 "เสริมความแข็งแกรงใหรัฐบาล"
 FRA_strengthen_government_support_desc:0 "เราไดวางแผนสําหรับปหนาที่จะตอบสนองความปรารถนาของประชาชนทั่วทุกภาคของฝรั่งเศส แสดงใหพวกเขาเห็นวาเราสามารถลงมือทําและคูควรที่จะปกครองฝรั่งเศส เพื่อที่เราจะไดยืนหยัดเปนหนึ่งเดียวอีกครั้ง"
 FRA_defensive_strategems:0 "กลยุทธตั้งรับ"
 FRA_defensive_strategems_desc:0 "หากเราตองการใหประชาชนฝรั่งเศสสูรบในสงครามเพื่อเรา สิ่งสําคัญยิ่งกวาที่เคยคือเราตองมีทิศทางที่ชัดเจน เราตองหยุดตอสูกันเอง แลวหันมาสูเพื่อฝรั่งเศสและ "Liberté, égalité, fraternité" แทน"
 FRA_invite_yugoslavia:0 "เชิญยูโกสลาเวีย"
 FRA_invite_yugoslavia_desc:0 "ยูโกสลาเวียมีเรื่องใหกังวลมากพออยูแลวโดยไมตองหวงเพื่อนบานที่ตองการขยายดินแดน การดึงพวกเขากลับเขาสูความตกลงไตรภาคีนอยจะเปนประโยชนอยางยิ่งทั้งตอพวกเขาและตอเรา"
 FRA_invite_romania:0 "เชิญโรมาเนีย"
 FRA_invite_romania_desc:0 "ประชาธิปไตยของโรมาเนียเปราะบาง ติดอยูระหวางกลุมฟาสซิสตภายในประเทศกับคอมมิวนิสตโซเวียต การนําพวกเขาเขาสูความตกลงไตรภาคีนอยจะชวยใหพวกเขารักษาเสถียรภาพไวไดดวยการหนุนหลังจากเรา"
 FRA_polish_guarantee:0 "รับประกันโปแลนด"
 FRA_polish_guarantee_desc:0 "นักการทูตโปแลนดแสดงความกังวลตอความตึงเครียดที่ชายแดนของพวกเขา การรับประกันจากชาติอันเกรียงไกรของเรานาจะยับยั้งผูที่วางแผนรุกรานได"
 FRA_czech_guarantee:0 "รับประกันเชโกสโลวาเกีย"
 FRA_czech_guarantee_desc:0 "ความตึงเครียดที่ชายแดนเช็กกําลังเพิ่มขึ้น เราไมอาจปลอยใหชาติที่ตองการขยายดินแดนยึดครองชาติที่เสรีและเปนประชาธิปไตยได ชาวเช็กตองยังคงเปนเสรีชน ดวยการรับประกันจากเรา ผูใดที่วางแผนรุกรานจะตองคิดใหดีเสียกอน"
 FRA_revise_versailles:0 "ทบทวนสนธิสัญญาแวรซาย"
 FRA_revise_versailles_desc:0 "ชาวเยอรมันเพิกเฉยตอคาปฏิกรรมสงครามตามสนธิสัญญาแวรซายแลว แสดงวาฝรั่งเศสไมไดรับความเคารพอีกตอไป หากจะวาไป เรามีสิทธิ์เรียกรองมากกวานี้สําหรับชีวิตที่สูญเสียไปในมหาสงคราม แตสนธิสัญญาที่เปนธรรมยอมตองอาศัยฝรั่งเศสที่เขมแข็ง ฝรั่งเศสใหม เพื่อบังคับใช"
 FRA_support_the_right:0 "สนับสนุนฝายขวา"
 FRA_support_the_right_desc:0 "ฝรั่งเศสเปนชาติที่เขมแข็งและภาคภูมิมาโดยตลอด แตการที่รัฐบาลไมลงมือทําอะไรไดแบงแยกประชาชน เราตองรวมฝรั่งเศสใหเปนหนึ่งและประกาศความเหนือกวาและความแข็งแกรงของเรา เพื่อไมใหตกอยูในความเสื่อมถอย"
 FRA_right_wing_rhetoric:0 "วาทกรรมฝายขวา"
 FRA_right_wing_rhetoric_desc:0 "เราตองมุงเขาถึงชาวฝรั่งเศสทุกคนและปลุกจิตวิญญาณแหงชาติของพวกเขา แสดงใหเห็นวาเราเปนผูนําที่ทรงพลังที่พวกเขาตองการ แลวพวกเขาจะกลายเปนพลเมืองผูภาคภูมิของชาติอันรุงโรจนของเรา"
 FRA_scw_intervention_nationalists:0 "แทรกแซงฝายชาตินิยม"
 FRA_scw_intervention_nationalists_desc:0 " ในที่สุดฝายชาตินิยมก็เริ่มไดเปรียบในสเปน อุดมการณของพวกเขาชอบธรรม และใครก็ตามที่เต็มใจสูเพื่อพวกเขาควรไดรับอนุญาตใหไป"
 FRA_army_of_aggression:0 "กองทัพแหงการรุกราน"
 FRA_army_of_aggression_desc:0 "เราไมอาจนั่งอยูหลังกําแพงที่ลาสมัยไดอีกตอไป ขณะที่ศัตรูอาละวาดไปทั่วยุโรป ถึงเวลาเสริมสรางกองทัพและขยายพรมแดนของเรา เพื่อใหฝรั่งเศสยังคงเปนชาติที่ยิ่งใหญ"
 FRA_france_first:0 "ฝรั่งเศสตองมากอน"
 FRA_france_first_desc:0 "เราคือฝรั่งเศส! ผูชนะแหงมหาสงคราม! ผูกอบกูยุโรป! เราคือบานของนักคิดที่ยิ่งใหญที่สุดที่โลกเคยมี มีหลายชาติเกินไปที่หมายจะผลักโลกลงสูความโกลาหล เราเปนที่ตองการ และเราจะตอบรับการเรียกรองนั้น เราจะคุมหางเสือ ฝาพายุ และนําพามนุษยชาติสูความปลอดภัยภายใตการปกครองของเรา!"
 FRA_woo_italy:0 "เกี้ยวพาอิตาลี"
 FRA_woo_italy_desc:0 "อิตาลีมีศักยภาพที่จะเปนชาติที่ทรงพลัง ดวยการนําอันเขมแข็งของมุสโสลินี ประชาชนอิตาลีจึงเปนหนึ่งเดียวและพรอมสูเพื่ออุดมการณที่ถูกตอง ขอใหอุดมการณนั้นเปนของเรา"
 FRA_dismantle_the_democracies:0 "รื้อทําลายฝายประชาธิปไตย"
 FRA_dismantle_the_democracies_desc:0 "พันธมิตรประชาธิปไตย[GER.GetAdjective]ที่เพิ่งกอตั้งในยุโรปกลางกําลังคุกคามสถานะใหมของเรา เราตองลงมือเดี๋ยวนี้ กอนที่พวกเขาจะแข็งแกรงขึ้น"
 FRA_join_germany:0 "เขารวมกับเยอรมนี"
 FRA_join_germany_desc:0 "ไรชเยอรมันกําลังกลายเปนกําลังที่ตองเกรงขาม วิสัยทัศนของพวกเขาตออนาคตที่ดีกวาสอดคลองกับผลประโยชนของเราได เราควรสนับสนุนพวกเขา และเมื่อฝุนตลบจางลง ฝรั่งเศสจะไดสวนแบงในยุโรปที่ควรได"
 FRA_naval_doctrine:0 "หลักนิยมทางเรือ"
 FRA_naval_doctrine_desc:0 "ความกาวหนาลาสุดในการออกแบบเรือไดเปดทางเลือกใหมในการดําเนินกลยุทธทั้งทางยุทธวิธีและยุทธศาสตร กอนที่เราจะเสี่ยงกับทฤษฎีใหมเหลานี้ เราตองทดสอบใหถี่ถวนและวางแผนใหรัดกุม"
 FRA_air_focus:0 "มุงเนนกองทัพอากาศ"
 air_focus_bypass_tt:0 "ชองกอสรางสําหรับ§Yฐานทัพอากาศ§!ไมเพียงพอ"
 FRA_air_focus_desc:0 "ถึงเวลาขยายกองทัพอากาศของเราแลว! มีแผนเริ่มกอสรางฐานทัพอากาศแหงใหมเพื่อรองรับการเพิ่มขึ้นครั้งใหญทั้งบุคลากรและอากาศยาน"
 FRA_cas_focus:0 "มุงเนนเครื่องบิน CAS"
 FRA_cas_focus_desc:0 "เครื่องบินที่สนับสนุนกําลังภาคพื้นดินและเรือของเราเปนสวนเสริมที่มีประสิทธิภาพมากดวยการลงทุนที่คอนขางนอย บัดนี้มีขอเสนอปรับปรุงเครื่องบินเหลานี้หลายประการ วิศวกรของเราสามารถพัฒนาเครื่องบินสนับสนุนรุนตอไปได"
 FRA_fighter_focus:0 "มุงเนนเครื่องบินขับไล"
 FRA_fighter_focus_desc:0 "วิศวกรรมพลเรือนอันลํ้าสมัยบางอยางสามารถนํามาใชกับเครื่องบินขับไลของเราเพื่อเพิ่มความเร็ว พิสัย และเพดานบินสูงสุดได เราตองมุงเนนเรื่องนี้หากตองการตามใหทันความกาวหนาของชาติอื่น"
 FRA_bomber_focus:0 "มุงเนนเครื่องบินทิ้งระเบิด"
 FRA_bomber_focus_desc:0 "การสนับสนุนทางอากาศเปนสวนสําคัญของขีดความสามารถทั้งในการตั้งรับและการรุก หากเรามุงพัฒนาเครื่องบินทิ้งระเบิดที่เร็ว คลองตัว และแมนยํากวา เราจะไดเปรียบในการรบภาคพื้นดินทุกครั้ง"
 FRA_heavy_fighter_focus:0 "มุงเนนเครื่องบินขับไลหนัก"
 FRA_heavy_fighter_focus_desc:0 "เครื่องบินขับไลหนักของเราตองสามารถคุมกันเครื่องบินทิ้งระเบิดที่เปราะบางกวาได ซึ่งตองอาศัยอาวุธที่หนักขึ้นและพิสัยที่ไกลขึ้น แลกกับความเร็วที่ลดลงบาง"
 FRA_air_doctrine:0 "หลักนิยมทางอากาศ"
 FRA_air_doctrine_desc:0 "เราไดสั่งสมประสบการณมากพอที่จะทดสอบทฤษฎีใหมในการสงครามทางอากาศไดรวดเร็วขึ้น ซึ่งจะชวยใหเราสํารวจความเปนไปไดใหมทั้งทางยุทธวิธีและยุทธศาสตร การรบทางอากาศคือกุญแจของสงครามสมัยใหม"
 FRA_heavy_bomber_focus:0 "มุงเนนเครื่องบินทิ้งระเบิดหนัก"
 FRA_heavy_bomber_focus_desc:0 "เครื่องบินทิ้งระเบิดหนักสมัยใหมจะติดอาวุธใหรับมือกับการปะทะทางอากาศขนาดเล็กไดดวยตัวเอง หากเราใหวิศวกรมุงพัฒนาเทคโนโลยีลาสุด เราจะมีโอกาสทําลายแหลงผลิตของขาศึกไดดียิ่งขึ้น"
 FRA_naval_bomber_focus:0 "มุงเนนเครื่องบินทิ้งระเบิดทางทะเล"
 FRA_naval_bomber_focus_desc:0 "เรือไดพิสูจนแลววาเปราะบางตออากาศยานเปนพิเศษ เราควรพัฒนาเทคโนโลยีของมันตอไปเพื่อใหมั่นใจวาเราจะนําหนามาตรการตอบโตใด ๆ เสมอ"
 limited_rearmament_focus:0 "การสะสมอาวุธอยางจํากัด"
 limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "ความเคลื่อนไหวลาสุดจากเยอรมนีและมหาอํานาจฟาสซิสตอื่น ๆ ทั่วโลกบงชี้วาเราอาจไมไดอยูอยางสันติในยุคของเรา เพื่อเปนการเตรียมพรอม เราควรเริ่มวางหมากสําหรับการสะสมอาวุธของเราเอง หากสถานการณเลวรายลงอีก"
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "แนวทางใหมของเราในการเมืองภายในประเทศและความสัมพันธระหวางประเทศตองอาศัยกองทัพที่แข็งแรงคอยหนุนหลัง เพื่อเปนการเตรียมพรอม เราควรเริ่มขยายอุตสาหกรรมพลเรือน เพื่อใหเปนรากฐานที่มั่นคงสําหรับการขยายอุตสาหกรรมทางทหารในอนาคตเมื่อถึงเวลาอันควร"
 ENG_motorized_focus:0 "กองทัพยานยนต"
 ENG_motorized_focus_desc:0 "เมื่อไมนานมานี้ กองทัพบกไดทดลองหนวยทหารราบยานยนตเต็มรูปแบบ แมยังไมไดจัดตั้งกองพลยานยนตเต็มรูปแบบขึ้น แตหากพูดถูกจังหวะกับรัฐมนตรีวาการกระทรวงสงคราม เรื่องนี้ก็อาจเปนไปไดในไมชา"
 ENG_tank_focus:1 "[Root.GetRoyalTankRegimentName]"
 ENG_tank_focus_desc:1 "[Root.GetRoyalTankRegimentDesc]"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "กรมทหารรถถังหลวง"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "กรมทหารรถถังรักษาการณสาธารณรัฐ"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "อังกฤษเปนผูคิดคนรถถัง ดังนั้นกรมทหารรถถังหลวงจึงควรติดตั้งรถถังที่ดีที่สุดในโลก แตปจจุบันยังไมเปนเชนนั้น คณะกรรมการพัฒนายานพาหนะพิเศษเสนอใหวิจัยและพัฒนาแบบรถถังสมัยใหม เพื่อใหอังกฤษยังคงเปนผูนําดานการพัฒนารถถัง"
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "อังกฤษเปนผูคิดคนรถถัง ดังนั้นกรมทหารรถถังรักษาการณสาธารณรัฐจึงควรติดตั้งรถถังที่ดีที่สุดในโลก แตปจจุบันยังไมเปนเชนนั้น คณะกรรมการพัฒนายานพาหนะพิเศษเสนอใหวิจัยและพัฒนาแบบรถถังสมัยใหม เพื่อใหอังกฤษยังคงเปนผูนําดานการพัฒนารถถัง"
 ENG_vickers_experimental_facility_focus: "ศูนยทดลองวิคเคอรส"
 ENG_vickers_experimental_facility_focus_desc: "เพื่อสงเสริมการวิจัยและพัฒนาโครงการเทคโนโลยีพิเศษ เราควรพยายามขยายศูนยทดลองของวิคเคอรสที่ฟอกซวอรเรน"
 ENG_vickers_experimental_facility_focus_tt: "หากไมมี§Yศูนยทดลอง§!อื่นใน§Y[126.GetName]§! เราจะไดรับ§G1§! §Yศูนยอากาศพลศาสตรและอุปกรณการบิน§!ใน§Y[126.GetName]§!"
 ENG_expand_the_secret_intelligence_service_focus: "ขยายหนวยขาวกรองลับ"
 ENG_expand_the_secret_intelligence_service_focus_desc: "หนวยขาวกรองลับ หรือที่เรียกกันทั่วไปวา MI6 ชวยปกปองมาตุภูมิของเราจากกิจกรรมบอนทําลายและภัยคุกคามจากตางชาติ แมจะกอตั้งขึ้นในชวงมหาสงคราม แตก็ไดรับการปรับโครงสรางใหมในทศวรรษ 1920 อยางไรก็ตาม ในตอนนั้นเราไดมองขามรายละเอียดสําคัญบางประการ และควรพยายามขยายขนาดองคกรอีกครั้ง"
 uk_empire_focus:0 "เสริมกําลังจักรวรรดิ"
 uk_empire_focus_desc:0 "จักรวรรดิของเรากวางใหญไพศาล และแมจะมีอํานาจ แตก็มีการปองกันที่ออนแอ เพื่อแกไขปญหานี้ เราตองสงเสริมความรักชาติตอจักรวรรดิไปทั่วทั้งราชอาณาจักร"
 uk_service_focus:0 "ประจําการโพนทะเล"
 uk_service_focus_desc:0 "ดวยการหมุนเวียนกําลังพลไปประจําการที่สถานีในอาณานิคมแลวกลับบาน พวกเขาจะไดเรียนรูสภาพการณในแนวรบตาง ๆ ไดรับประสบการณ และถายทอดใหสหายที่บาน"
 uk_mediterranean_focus:0 "ปอมปราการเมดิเตอรเรเนียน"
 uk_mediterranean_focus_desc:0 "เสนทางผานทะเลเมดิเตอรเรเนียนเปนทางลัดที่สําคัญยิ่งในการเดินทางไปและกลับจากอินเดีย ดังนั้นการรักษาเสนทางนี้ใหเปดและอยูในมือเราจึงสําคัญที่สุด"
 uk_rock_focus:0 "เสริมปอมปราการยิบรอลตาร"
 uk_rock_focus_desc:0 "นอกจากจะควบคุมทางเขาทะเลเมดิเตอรเรเนียนแลว ยิบรอลตารยังเปนทาเรือที่ปองกันอยางแนนหนา ซึ่งเรือสามารถใชปฏิบัติการไดทั้งในมหาสมุทรแอตแลนติกและทะเลเมดิเตอรเรเนียน ดังนั้นจึงจําเปนอยางยิ่งที่ตองคุมกันอยางแข็งแกรง"
 uk_greece_focus:0 "กดดันกรีซ"
 uk_greece_focus_desc:0 "เปนผลประโยชนของเราที่จะไดสิทธิ์ตั้งฐานทัพในกรีซ และพูดตรง ๆ ชาวกรีกก็ไมอยูในฐานะที่จะปฏิเสธเราได"
 uk_malta_focus:0 "เสริมปอมปราการมอลตา"
 uk_malta_focus_desc:0 "มอลตาตั้งอยูในทําเลชั้นเยี่ยมกลางทะเลเมดิเตอรเรเนียน เปนสถานีแวะพักสําคัญบนเสนทางชีวิตของเราผานอียิปตและคลองสุเอซไปยังอินเดียและตะวันออกไกล เวลาที่ใชเสริมปอมปราการใหแข็งแกรงขึ้นไมมีวันสูญเปลา"
 ENG_mot_focus_tooltip:0 "ตอนนี้เราสามารถจัดวางกองพลทหารราบยานยนตไดแลว"
 uk_canada_focus:0 "พัฒนาแคนาดา"
 uk_canada_focus_desc:0 "การลงทุนในอุตสาหกรรมและอูตอเรือของแคนาดาจะชวยกระตุนเศรษฐกิจของพวกเขา และทําใหพวกเขามีสวนรวมไดมากขึ้นหากเกิดสงคราม"
 uk_australia_focus:0 "พัฒนาออสเตรเลีย"
 uk_australia_focus_desc:0 "การลงทุนในอูตอเรือและอุตสาหกรรมของออสเตรเลียจะชวยกระตุนเศรษฐกิจของพวกเขา และทําใหพวกเขามีสวนรวมไดมากขึ้นหากเกิดสงคราม"
 uk_protect_suez: "ปกปองสุเอซ"
 uk_protect_suez_desc:0 "การควบคุมคลองสุเอซเปนสวนหนึ่งของวิธีที่จักรวรรดิบริติชใชรักษาความเปนเจาแหงทองทะเล การสูญเสียภูมิภาคนี้จะเปนหายนะ ตองดําเนินมาตรการเพื่อเสริมปอมปราการที่นี่"
 uk_balkan_strategy:0 "ยุทธศาสตรบอลขาน"
 uk_balkan_strategy_desc:0 "หลายชาติในคาบสมุทรบอลขานนิยมอังกฤษและมองเห็นภัยคุกคามจากยุโรปกลางเชนเดียวกับเรา หากเราฉวยโอกาสและสนับสนุนพวกเขาตั้งแตเนิ่น ๆ เราจะไดความภักดีจากพวกเขา แมจะตองแลกกับการทําใหเพื่อนบานที่หมายแกแคนของพวกเขาโกรธเคือง"
 uk_new_zealand_focus:0 "พัฒนานิวซีแลนด"
 uk_new_zealand_focus_desc:0 "นิวซีแลนดยังคงมีความผูกพันแนนแฟนกับชาติของเรา และไดเตือนถึงภัยคุกคามจากฟาสซิสต การมีสวนรวมของพวกเขาหากเกิดสงครามเปนสิ่งแนนอน และเราควรชวยเหลือพวกเขาในการเตรียมพรอมใหเหมาะสม"
 uk_south_africa_focus:0 "พัฒนาแอฟริกาใต"
 uk_south_africa_focus_desc:0 "สถานการณทางการเมืองในแอฟริกาใตยังไมแนนอน เราไมอาจไวใจไดเต็มที่วาพวกเขาจะสนับสนุนความพยายามในสงครามของเรา แตดวยการชวยเสริมความแข็งแกรงใหอุตสาหกรรมของพวกเขา เราก็หวังวาจะเพิ่มการสนับสนุนตออุดมการณของอังกฤษได"
 FRA_strengthen_government_support_tooltip:0 "แนวคิด 'เสริมการสนับสนุนรัฐบาล' ไดหมดผลแลว"
 ITA_victoryinETH:0 "ชัยชนะในแอฟริกา"
 ITA_victoryinETH_desc:0 "ความลมเหลวในสงครามอิตาลี-เอธิโอเปยครั้งที่หนึ่งเปนรอยดางตอเกียรติของอิตาลีมา 40 ป การไดชัยชนะในตอนนี้จะลบรอยดางนั้น และพิสูจนความแข็งแกรงแหงเจตจํานงเหล็กของฟาสซิสต!"
 USA_reinforce_monroe_doctrine_tt:0 "เพิ่มความสัมพันธทางการคากับทุกชาติในทวีปอเมริกา\n"
 1939_bookmark_threat:0 "การขยายดินแดนของฟาสซิสตเมื่อไมนานมานี้"
 USA_civil_war_fired:0 "สงครามกลางเมืองอเมริกาครั้งที่สองไดเริ่มขึ้นแลว"
 USA_anti_imperialism:0 "ตอตานจักรวรรดินิยม"
 USA_anti_imperialism_desc:0 "อเมริกาเปนศัตรูของผูกดขี่จักรวรรดินิยมมาโดยตลอด แตเห็นไดชัดวาประเทศที่เรียกตัวเองวาประชาธิปไตยสวนใหญยินดีจะรักษาสถาบันเหลานี้ไว ตราบที่ตนยังไดประโยชน นักปฏิวัติแหงสหภาพโซเวียตเปนพันธมิตรที่ดีกวา"
 USA_fascist_menace:1 "ภัยคุกคามปรัสเซีย"
 USA_fascist_menace_desc:1 "สนธิสัญญาแวรซายและการควํ่าบาตรทางเศรษฐกิจไมอาจหยุดยั้งเยอรมนีได และลัทธิทหารปรัสเซียก็กําลังผงาดหัวอันนาเกลียดและกาวราวขึ้นมาอีกครั้ง เยอรมนีตองพายแพอีกครั้งและถูกนํามาอยูภายใตการควบคุมของเรา อยางนอยก็ในชวงเวลานี้"
 USA_crusade_against_communism:0 "สงครามครูเสดตอตานคอมมิวนิสต"
 USA_crusade_against_communism_desc:0 "ความหวาดกลัวแดงเปนภัยคุกคามที่เลวรายที่สุดที่โลกนี้เคยเผชิญ ไมวาดวยวิธีใดก็ตาม อุดมการณแหงการทําลายลางที่แผออกมาจากสหภาพโซเวียตตองถูกตัดขาดที่ตนตอ และเราจะเปนผูลงมือ"
 USA_strike_at_the_empire:0 "โจมตีจักรวรรดิ"
 USA_strike_at_the_empire_desc:0 "ภัยคุกคามที่แทจริงตอเสรีภาพของโลกคือจักรวรรดิอาณานิคมที่มหาอํานาจยุโรปสรางขึ้น พวกมันตองถูกบดขยี้และประชากรตองไดรับอิสรภาพ โดยเริ่มจากจักรวรรดิบริติชที่เราเคยปลดแอกตนเองมา"
 USA_defense_of_the_pacific:0 "ปกปองแปซิฟก"
 USA_defense_of_the_pacific_desc:0 "รัฐบาลญี่ปุนสิ้นหวังเกินเยียวยา การขยายดินแดนของพวกเขาคุกคามทั้งประชาชนของเราและเพื่อนบานในเอเชีย ชาตินี้ตองถูกนํามาอยูภายใตการบริหารของอเมริกาเพื่อปฏิรูป และปองกันไมใหทําผิดซํ้าอีก"
 ENG_home_defence:0 "ปองกันมาตุภูมิ"
 ENG_home_defence_desc:0 "จักรวรรดิที่กวางใหญไมมีประโยชนหากเราไมอาจปกปองประชาชนชาวอังกฤษได เราควรมุงความพยายามไปที่การรักษาความปลอดภัยของหมูเกาะบริติช"
 ENG_home_defence_tt: "ปลดล็อกการตัดสินใจ§Yปองกันมาตุภูมิ§!ในกรณีที่ถูกรุกราน"
 ENG_issue_gasmasks:0 "แจกหนากากกันแกส"
 ENG_issue_gasmasks_desc:0 "โลกอันตรายขึ้นทุกวัน เราควรปกปองพลเรือนจากการโจมตีดวยแกสพิษ อังกฤษจะหายใจไดอยางสบายใจ"
 ENG_military_training_act:0 "พระราชบัญญัติการฝกทหาร"
 ENG_military_training_act_desc:0 "มหาสงครามทิ้งความรูสึกไวใหประชาชนของเราวาพวกเขาจะไมตองสูรบอีก เมื่อโลกอันตรายขึ้น เราตองทําใหมั่นใจวาชายหนุมที่มีความสามารถทุกคนไดรับการฝกทหารขั้นพื้นฐาน"
 ENG_embargo_germany:0 "ควํ่าบาตรเยอรมนี"
 ENG_embargo_germany_desc:0 "การสะสมอาวุธของเยอรมนีเปนการดูหมิ่นและเปนภัยคุกคามใหญหลวงตอสันติภาพโลก เราจะไมจัดหาทรัพยากรที่พวกเขาตองการเพื่อปอนเครื่องจักรสงคราม"
 ENG_war_with_germany:0 "ทําสงครามกับเยอรมนี"
 ENG_war_with_germany_desc:0 "ชาวเยอรมันไมเหลือทางเลือกอื่นใหเรา เพื่อโลกเสรีและอนาคตของลูกหลานเรา ถึงเวลาแหงสงครามแลว"
 ENG_swedish_intervention:0 "แทรกแซงสวีเดน"
 ENG_swedish_intervention_desc:0 "ขบวนการตอตานประชาธิปไตยในสวีเดนไดรับอิทธิพลมากจนนาวิตก เราไมอาจเสี่ยงใหเหล็กกลาของสวีเดนกลายเปนปนในมือศัตรู ชาวสวีเดนจะยังคงเปนเสรีชน แตเราตองมีอิทธิพลในระดับหนึ่งเหนือประเทศของพวกเขา"
 ENG_norwegian_intervention:0 "แทรกแซงนอรเวย"
 ENG_norwegian_intervention_desc:1 "ขบวนการตอตานประชาธิปไตยในนอรเวยยังคงไดที่มั่นเพิ่มขึ้น เราควรทําใหมั่นใจวาการเมืองของพวกเขาสอดคลองกับผลประโยชนของเรา แมจะตองใชกําลังก็ตาม"
 ENG_danish_intervention:0 "แทรกแซงเดนมารก"
 ENG_danish_intervention_desc:0 "การสนับสนุนศัตรูของสันติภาพโลกในเดนมารกยังคงเพิ่มขึ้น มีเพียงวิธีเดียวที่จะทําใหพวกเขาอยูฝายเรา เราควรใชเดนมารกเปนที่มั่นทางยุทธศาสตรในภูมิภาค เผื่อจําเปนตองบุกภาคพื้นดินในยุโรป"
 ENG_benelux_intervention:0 "แทรกแซงเบเนลักซ"
 ENG_benelux_intervention_desc:0 "สภาพแวดลอมทางการเมืองในภูมิภาคเบเนลักซกําลังเปนปฏิปกษตอเรามากขึ้น เราควรสงคําเตือนที่ชัดเจนวาจะไมยอมทนตอศัตรูของประชาธิปไตยใด ๆ และเราพรอมใชกําลังหากจําเปน"
 ENG_belgium_security:0 "ยึดเบลเยียม"
 ENG_belgium_security_desc:0 "คําเตือนนั้นไมเพียงพออยางเห็นไดชัด หากแนวโนมทางการเมืองยังเปนเชนนี้ตอไป เบลเยียมจะเปนภัยคุกคามโดยตรงตอนานนํ้าของเรา เราตองแทรกแซงและสรางที่มั่นทางยุทธศาสตรบนภาคพื้นทวีปยุโรป"
 ENG_dutch_security:0 "ยึดเนเธอรแลนด"
 ENG_dutch_security_desc:0 "ขบวนการทางการเมืองในเนเธอรแลนดยังคงสนับสนุนศัตรูของเรา เนเธอรแลนดจะตองถูกปราบเพื่อใหมั่นใจวายุโรปจะเปนเสรี"
 ENG_war_with_japan:0 "ทําสงครามกับญี่ปุน"
 ENG_war_with_japan_desc:0 "ทางเลือกอื่นทั้งหมดหมดลงแลว และญี่ปุนปฏิเสธที่จะเลิกขยายดินแดน เพื่อความปลอดภัยของจักรวรรดิบริติชและประชาชนในเอเชีย เราตองปราบญี่ปุน"
 ENG_war_with_italy:0 "ทําสงครามกับอิตาลี"
 ENG_war_with_italy_desc:0 "ชาวอิตาลีปฏิเสธที่จะละทิ้งแผนการสรางจักรวรรดิใหม และไดพิสูจนแลววาพรอมทําสงครามเพื่อขยายพรมแดน เราตองทําทุกอยางที่ทําไดเพื่อกําจัดภัยคุกคามนี้กอนที่จะสายเกินไป"
 ENG_embargo_ussr:1 "ควํ่าบาตร[SOV.GetNameDefCap]"
 ENG_embargo_ussr_desc:1 "[SOV.GetNameDefCap]กําลังแข็งแกรงขึ้นและใชทรัพยากรของอังกฤษปอนความพยายามทางทหาร เราควรตัดการเขาถึงการคากับเรา"
 ENG_war_with_ussr: "ปฏิบัติการอันธินคาเบิล"
 ENG_war_with_ussr_desc:1 "ภัยคุกคามจาก[SOU.GetNameDef]ยังคงเพิ่มขึ้นแมเราจะคัดคาน เราไมอาจทนตอ[SOU.GetName]ที่กาวราวได และไมเหลือทางเลือกอื่นนอกจากทําสงครามเพื่อวันพรุงนี้ที่ดีกวา"
 kamikaze_focus_tooltip:1 "อนุญาตภารกิจทางอากาศ§Yโจมตีแบบคามิกาเซ§! ซึ่งเปนการโจมตีแบบพลีชีพตอเรือขาศึก\n"
 AST_additional_militia_training:0 "ฝกกองกําลังอาสาสมัครเพิ่มเติม"
 AST_additional_militia_training_desc:0 "กองกําลังอาสาสมัครของเราจํานวนมากไมพรอมปฏิบัติหนาที่ ทั้งเจ็บปวยหรือขาดยุทโธปกรณ เรากําลังดําเนินการแกไขขอบกพรองนี้ในโลกที่อันตราย"
 AST_royal_australian_artillery:0 "ปนใหญหลวงออสเตรเลีย"
 AST_royal_australian_artillery_desc:0 "ปนใหญคือราชินีแหงสมรภูมิ และเราตองขยายการเขาถึงปนใหญหนัก"
 AST_promote_reservists:0 "เลื่อนชั้นกําลังสํารอง"
 AST_promote_reservists_desc:0 "แมเราจะตองการกองกําลังปองกันประเทศ แตการเลื่อนกองกําลังอาสาสมัครและกําลังสํารองเขาสูกองทัพประจําการจะเพิ่มจํานวนทหารและประสบการณที่เราตองการ"
 AST_daimler_dingo:0 "เดมเลอร ดิงโก"
 AST_daimler_dingo_desc:0 "รถหุมเกราะที่ผลิตในอังกฤษคันนี้จะเพิ่มความคลองตัวในสมรภูมิของเรา และอยางไรเสีย มันก็ไดชื่อตามสุนัขประจําชาติของเรา"
 AST_hmas_assault:0 "HMAS Assault"
 AST_hmas_assault_desc:0 "สงครามในแปซิฟกจะเปนสงครามสะเทินนํ้าสะเทินบก ดังนั้นการสรางฐานทัพเรือที่เชี่ยวชาญการฝกนาวิกโยธินใหยึดชายหาดจึงจําเปนยิ่งตอความพยายามในสงคราม"
 AST_specialize_equipment:0 "ยุทโธปกรณเฉพาะทาง"
 AST_specialize_equipment_desc:0 "ยุทโธปกรณที่ผลิตในอังกฤษที่เราใชไมไดมีประสิทธิภาพกับสถานการณการรบเฉพาะของเราทั้งหมด เครื่องมือพิเศษที่ออกแบบเฉพาะจึงกลายเปนสิ่งจําเปน"
 AST_australian_womens_army_service:0 "หนวยบริการกองทัพบกสตรีออสเตรเลีย"
 AST_australian_womens_army_service_desc:0 "ผูชายทุกคนจําเปนตองไปแนวหนา ดังนั้นงานขับรถ การสื่อสาร และการซอมบํารุงจะไดรับการดูแลโดยสตรีชาวออสเตรเลียนับพัน"
 AST_australian_army_catering_corps:0 "เหลาพลาธิการเสบียงอาหารกองทัพบกออสเตรเลีย"
 AST_australian_army_catering_corps_desc:0 "กองทัพบกออสเตรเลียไดรับบริการที่ยํ่าแยในดานคุณภาพอาหาร สวนใหญเปนเพราะคุณภาพของพอครัว การจัดระบบกระบวนการนี้ใหมจะชวยเพิ่มขวัญกําลังใจและประสิทธิภาพ"
 AST_fund_owen_gun_research:0 "ทุนวิจัยปนโอเวน"
 AST_fund_owen_gun_research_desc:0 "เอเวลิน โอเวน ไดพัฒนาปนกลมือแบบใหมที่ทนทานตอสภาพอันโหดรายของการรบในปา เราควรทุมทรัพยากรของรัฐบาลในการผลิตและปรับปรุงอาวุธนี้"
 AST_sentinel_tank_project:0 "โครงการรถถังเซนทิเนล"
 AST_sentinel_tank_project_desc:0 "ออสเตรเลียควรพัฒนายานเกราะของตนเอง โครงการเซนทิเนลซึ่งอิงแนวคิดของเยอรมนีและอเมริกาควรไดรับการผลักดัน"
 AST_airborne_defence:0 "การปองกันทางอากาศ"
 AST_airborne_defence_desc:0 "เราตองปกปองนานฟาเหนือออสเตรเลียดวยการลงทุนในการปองกันทางอากาศ ทั้งเครื่องบินสกัดกั้นและปนตอสูอากาศยาน"
 AST_introduce_unconventional_warfare:0 "นําการสงครามนอกแบบมาใช"
 AST_introduce_unconventional_warfare_desc:0 "ปาดงดิบในแปซิฟกตองการการสงครามรูปแบบใหม เราตองเรียนรูที่จะเคลื่อนที่อยางรวดเร็วและเงียบเชียบผานพงไพรหนาทึบ ซุมโจมตีศัตรู และคาดหวังใหพวกเขาทําเชนเดียวกัน"
 AST_z_special_unit:0 "หนวยพิเศษ Z"
 AST_z_special_unit_desc:0 "หนวยพิเศษ Z จะเปนหนวยคอมมานโดของเรา เชี่ยวชาญการลาดตระเวนและการกอวินาศกรรมหลังแนวขาศึก ซึ่งตองอาศัยชายผูกลาที่เต็มใจผานการฝกที่เขมงวดที่สุด"
 AST_m_special_unit:0 "หนวยพิเศษ M"
 AST_m_special_unit_desc:0 "หนวยพิเศษ M จะเปนหนวยสอดแนมและลาดตระเวนลวงหนาของเราในสงคราม คอยสงขาวกรองลาสุดเกี่ยวกับการวางกําลังและที่ตั้งของขาศึก"
 AST_expand_the_raaf:0 "ขยายกองทัพอากาศออสเตรเลีย"
 AST_expand_the_raaf_desc:0 "กองทัพอากาศของเราตองเติบโต ดังนั้นเราจึงลงทุนในฐานทัพ การฝก และการผลิตเพิ่มขึ้น"
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "บูมเมอแรงจะเปนผลงานของออสเตรเลียดานการออกแบบเครื่องบินขับไล และเปนหลักประกันกรณีสูญเสียเครื่องบินนําเขา เราตองแขงขันกับเครื่องบินของญี่ปุนและอเมริกาใหได"
 AST_expand_northern_presence:0 "ขยายการประจําการทางเหนือ"
 AST_expand_northern_presence_desc:0 "เมื่อเมืองของเราสวนใหญอยูบนชายฝงตะวันออกและตะวันตกของเกาะ ชายแดนทางเหนือของออสเตรเลียจึงขาดการปองกันหรือการเตรียมพรอมที่เหมาะสมหากถูกรุกรานหรือโจมตี สิ่งกอสรางทางทหารใหมในพื้นที่นั้นจะเปนที่ตอนรับ"
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "ออสเตรเลียจะพัฒนากองกําลังเครื่องบินทิ้งระเบิดของตนเอง วูเมอราเปนเพียงเครื่องบินขนาดเบา แตก็เพียงพอสําหรับการปกปองมาตุภูมิและการสนับสนุนทางอากาศโดยใกลชิดขนาดเบา"
 AST_volunteer_air_observers_corps:0 "หนวยอาสาสมัครเฝาตรวจทางอากาศ"
 AST_volunteer_air_observers_corps_desc:0 "จับตาทองฟาไว! เราขอเรียกรองใหชาวออสเตรเลียเรียนรูรูปเงาของเครื่องบินทั่วไป และแจงรัฐบาลเมื่อพบเครื่องบินนาสงสัยหรือเครื่องบินขาศึกเขาใกลดินแดนในปกครอง"
 AST_naval_bombers:0 "เครื่องบินทิ้งระเบิดทางทะเล"
 AST_naval_bombers_desc:0 "เราถูกลอมรอบดวยนํ้า ดังนั้นเราควรศึกษาเครื่องบินและการฝกที่จะชวยใหเราสกัดกั้นและโจมตีกองเรือขาศึกได การทิ้งระเบิดทางทะเลเปนทักษะเฉพาะทางและควรไดรับความสําคัญ"
 AST_death_from_down_under:0 "มัจจุราชจากแดนใต"
 AST_death_from_down_under_desc:0 "จะไมมีเครื่องบินทิ้งระเบิดใดสรางความเสียหายแกทาเรือและเมืองของเราได เมื่อเรายกระดับระบบปองกันทางอากาศ ดวยความเขาใจในแสนยานุภาพทางอากาศที่ดีขึ้นและอานุภาพของอาวุธตอสูอากาศยาน"
 AST_womens_auxilliary_australian_air_force:0 "กองทัพอากาศสตรีสนับสนุนออสเตรเลีย"
 AST_womens_auxilliary_australian_air_force_desc:0 "ประชากรครึ่งหนึ่งของเรามีประโยชนตอความพยายามในสงครามมากกวาการนั่งอยูบาน งานซอมบํารุงอากาศยาน เหลาทหารสื่อสาร และงานที่เกี่ยวของอื่น ๆ จะมอบใหสตรีรับผิดชอบ"
 AST_dominate_the_skies:0 "ครองนานฟา"
 AST_dominate_the_skies_desc:0 "ออสเตรเลียอยูหางไกลจากฐานทัพอากาศขาศึกหลายแหง ดังนั้นเปาหมายของเราควรเปนการครองความเหนือกวาทางอากาศอยางสมบูรณในมุมโลกของเรา"
 AST_cockatoo_island_shipyards:0 "อูตอเรือเกาะค็อกคาทู"
 AST_cockatoo_island_shipyards_desc:0 "การขยายและปรับปรุงอูตอเรือเกาะค็อกคาทูเปนภารกิจสําคัญอันดับตนของรัฐบาล อาวซิดนียเขาถึงกําลังคนและทรัพยากรไดดีที่สุด และนั่นคือที่ที่เราควรมุงความพยายามดานการตอเรือ"
 AST_kangaroo_point_shipyards:0 "อูแหงแคงการูพอยต"
 AST_kangaroo_point_shipyards_desc:0 "บริษัทอีแวนส ดีกิน แอนด คอมพานี เสนอใหสรางอูตอเรือและอูแหงขนาดใหญที่แคงการูพอยต โครงการเชนนี้เหมาะอยางยิ่งตอการเพิ่มขีดความสามารถในการแผแสนยานุภาพทางเรือของเรา"
 AST_protect_overseas_commerce:0 "ปกปองการคาโพนทะเล"
 AST_protect_overseas_commerce_desc:0 "ชาติที่เปนเกาะตองพึ่งพาเสบียงที่นําเขาจากชาติอื่นขามคลื่นทะเล การปกปองเสนทางขบวนเรือลําเลียงและเสนทางการคาไมใชแคยุทธศาสตร แตเปนความจําเปน"
 AST_fly_the_jolly_roger:0 "ชักธงโจรสลัด"
 AST_fly_the_jolly_roger_desc:0 "จากที่มั่นบนเกาะของเรา เราสามารถสงฝูงเรือดํานํ้าออกไปกอกวนและทําลายการคาและเสบียงของขาศึกที่ผานชายฝงของเรา"
 AST_scrap_iron_flotilla:0 "กองเรือเศษเหล็ก"
 AST_scrap_iron_flotilla_desc:0 "จนกวาเราจะยกระดับกองเรือได เราจะใชเรือเกาที่มีอยูไปพลางกอน ศัตรูอาจเรียกเรือพิฆาตรุนเกาของเราวากองเรือเศษเหล็ก แตมันจะทําใหเราภาคภูมิใจ"
 AST_royal_australian_submarine_service:0 "หนวยบริการเรือดํานํ้าหลวงออสเตรเลีย"
 AST_royal_australian_submarine_service_desc:0 "เรือดํานํ้าคืออาวุธทางทะเลแหงอนาคต และเปนองคประกอบสําคัญของกองกําลังพันธมิตรของเรา เราตองยอมรับวิถีการสงครามแบบนี้"
 AST_naval_auxiliary_patrol:0 "หนวยลาดตระเวนทางเรือสนับสนุน"
 AST_naval_auxiliary_patrol_desc:0 "ทาเรือมากมายของแผนดินอันยิ่งใหญของเราเปนเปาหมายที่ลอตาสําหรับการโจมตีแบบลอบเรนของเรือดํานํ้า กองกําลังสนับสนุนของเรือลาดตระเวนชายฝงจะเตือนเราถึงอันตรายใด ๆ"
 AST_cruisers:0 "เรือลาดตระเวน"
 AST_cruisers_desc:0 "เราปลอยเรือประจัญบานและเรือบรรทุกเครื่องบินไวใหพวกตัวใหญได เพราะเรือขนาดเรือลาดตระเวนจํานวนมากก็ตอบสนองความตองการของเราไดเกินพอ"
 AST_pacific_area_navy:0 "กองทัพเรือเขตแปซิฟก"
 AST_pacific_area_navy_desc:0 "แมพระมหากษัตริยจะทรงสูเพื่อความอยูรอดในยุโรป แตสิ่งสําคัญเรงดวนของเราควรเปนกองทัพเรือที่สามารถสูกับศัตรูที่นี่ในแปซิฟก เราตองพัฒนายุทธศาสตรที่สอดคลองกับเปาหมายนั้น"
 AST_standard_gauge_railway:0 "ทางรถไฟรางมาตรฐาน"
 AST_standard_gauge_railway_desc:0 "นับทศวรรษที่ออสเตรเลียมีขนาดรางรถไฟหลายแบบแขงกัน ทําใหการขนสงและการลําเลียงสินคาของเรายุงเหยิง ถึงเวลาแลวที่จะทําใหขนาดรางรถไฟทั่วประเทศเปนมาตรฐานเดียวกันเสียที"
 AST_industries_assistance_corporation:0 "บรรษัทสงเสริมอุตสาหกรรม"
 AST_industries_assistance_corporation_desc:0 "ความปนปวนทางเศรษฐกิจโลกเมื่อไมนานมานี้ทําใหการลงทุนและการประกอบการในออสเตรเลียซบเซา บรรษัทสงเสริมอุตสาหกรรมจะใหคําปรึกษาและสนับสนุนเงินทุนแกธุรกิจขนาดเล็กทั่วประเทศ เพื่อใหเศรษฐกิจกลับมาขับเคลื่อนอีกครั้ง"
 AST_western_australian_government_railways:0 "การรถไฟรัฐบาลออสเตรเลียตะวันตก"
 AST_western_australian_government_railways_desc:0 "ในตอนนี้ ทางรถไฟของรัฐในออสเตรเลียตะวันตกควรไดรับความสําคัญมากกวาการสรางถนน ภูมิประเทศทางตะวันตกเอื้อตอรถไฟ เราควรใชประโยชนจากขอนี้"
 AST_south_australian_housing_trust:0 "การเคหะออสเตรเลียใต"
 AST_south_australian_housing_trust_desc:0 "ออสเตรเลียใตตองการอุตสาหกรรมและการลงทุนมากขึ้น จึงจะทุมทรัพยากรใหกับชุมชนที่วางผังไวและการปรับปรุงที่อยูอาศัยหลายโครงการ โดยเฉพาะรอบแอดิเลด"
 AST_department_of_supply_and_development:0 "กระทรวงการจัดหาและพัฒนา"
 AST_department_of_supply_and_development_desc:0 "ในยามสงคราม เราตองมีกระทรวงพิเศษเพื่อดูแลเรื่องการสงกําลังบํารุงและเสบียง ทั้งกระสุน เชื้อเพลิง และทุกสิ่งที่จําเปนเพื่อใหกองทัพเคลื่อนที่ได"
 AST_expand_lithgow_small_arms_factory:0 "ขยายโรงงานอาวุธเบาลิทโกว"
 AST_expand_lithgow_small_arms_factory_desc:0 "ปนวิคเคอรสและเบรนของเรามาจากโรงงานอาวุธเบาลิทโกว เมื่อโรงงานขยายตัว เราจะเพิ่มขีดความสามารถในการรบไดงายขึ้น"
 AST_allied_works_council:0 "สภางานกอสรางฝายสัมพันธมิตร"
 AST_allied_works_council_desc:0 "งานกอสรางทางทหารทั้งหมดในออสเตรเลียจะอยูภายใตการกํากับของสภางานกอสรางฝายสัมพันธมิตร การวางแผนแบบรวมศูนยนี้จะทําใหรัฐบาลไดผลผลิตตามที่ตองการ"
 AST_expand_the_northern_railway:0 "ขยายทางรถไฟสายเหนือ"
 AST_expand_the_northern_railway_desc:0 "เรามีทางรถไฟที่ทอดยาวจากแอดิเลดทางใตไปถึงอลิซสปริงสทางเหนือ บัดนี้เราตองตอขยายจุดปลายทางเหนือไปยังเมืองอื่น ๆ ในพื้นที่ เพื่อเชื่อมตอออสเตรเลียทั้งประเทศ"
 AST_australian_arms_production:0 "การผลิตอาวุธของออสเตรเลีย"
 AST_australian_arms_production_desc:0 "เวลาเดินทางของขบวนเรือลําเลียงที่ยาวนานหมายความวาออสเตรเลียตองรับผิดชอบผลิตอาวุธของตนเองมากกวาดินแดนในปกครองอื่น ๆ เรามีโรงงาน และเรามีความรูความชํานาญ"
 AST_uranium_mining:0 "การทําเหมืองยูเรเนียม"
 AST_uranium_mining_desc:0 "ในชวงหลายทศวรรษที่ผานมา เราไดพบแหลงแรยูเรเนียมขนาดใหญในออสเตรเลียใต โดยเฉพาะรอบภูเขากี บัดนี้ยูเรเนียมเปนทรัพยากรทางทหารที่สําคัญยิ่ง และควรเพิ่มการใชประโยชนจากแหลงสํารองเหลานี้"
 AST_establish_advisory_war_council:0 "จัดตั้งสภาที่ปรึกษาการสงคราม"
 AST_establish_advisory_war_council_desc:0 "นักการเมืองของออสเตรเลียตองวางความขัดแยงทางอุดมการณและพรรคการเมืองไวกอน แลวรวมกันปรึกษาหารือและใหคําแนะนําในการดําเนินสงคราม"
 AST_national_security_act:0 "พระราชบัญญัติความมั่นคงแหงชาติ"
 AST_national_security_act_desc:0 "เมื่อเราอยูในภาวะสงคราม รัฐบาลกลางจะมีอํานาจมากขึ้นเพื่อปกปองออสเตรเลีย ทั้งการเซ็นเซอรสื่อที่เขมงวดขึ้น การปราบปรามกลุมผูเห็นตาง และอํานาจที่มากขึ้นในการเก็บภาษีและยึดทรัพยสินเพื่อการปองกันดินแดนในปกครอง"
 AST_volunteer_defence_corps:0 "กองอาสาปองกันประเทศ"
 AST_volunteer_defence_corps_desc:0 "กองอาสาปองกันประเทศไดรวบรวมขึ้นจากทหารผานศึกสูงวัยและพลเมืองอื่นที่ไมไดอยูในกองทัพประจําการ พวกเขาจะทําหนาที่เปนกองรักษาดินแดน เพื่อใหกองทัพมีอิสระในการโจมตีศัตรูโดยตรง"
 AST_civil_construction_corps:0 "กองกอสรางพลเรือน"
 AST_civil_construction_corps_desc:0 "เราจะเกณฑชายที่มีรางกายแข็งแรงเขาประจํากองกอสรางพลเรือน เพื่อชวยสรางสนามบิน เสนทางคมนาคม ปอมปราการ และโครงสรางพื้นฐานทางทหารที่สําคัญอื่น ๆ"
 AST_army_inventions_directorate:0 "กรมสิ่งประดิษฐกองทัพบก"
 AST_army_inventions_directorate_desc:0 "สงครามกระตุนนวัตกรรมและความคิดสรางสรรค และรัฐบาลตองมีวิธีคัดแยกแนวคิดดีออกจากแนวคิดแย สํานักงานสิทธิบัตรเฉพาะทางแหงใหมจะทําหนาที่พิจารณาวาขอเสนอมากมายที่สงถึงรัฐบาลนั้น ขอเสนอใดมีคุณคาบาง"
 AST_invest_in_victory:0 "ลงทุนเพื่อชัยชนะ"
 AST_invest_in_victory_desc:0 "ดวยการขายพันธบัตรสงครามใหประชาชน พวกเขาจะสามารถนําเงินออมมาชวยความพยายามในสงครามได"
 AST_citizen_military_forces:0 "กองกําลังทหารพลเมือง"
 AST_citizen_military_forces_desc:0 "ถึงเวลาเตรียมกองทัพสํารองเพื่อเพิ่มความพรอมหากเกิดสงคราม เราจะเกณฑกองกําลังอาสาสมัครที่มีอยูเขากองทัพเพื่อปองกันประเทศ แลวเตรียมพวกเขาใหพรอมประจําการโพนทะเลหากจําเปน"
 AST_rats_of_tobruk:0 "หนูแหงโทบรุก"
 AST_rats_of_tobruk_desc:0 "ทหารผูกลาของเราไดพิสูจนตนแลววาเชี่ยวชาญการรบในทะเลทรายและการหาของจากสนามรบ พวกเขากอกวนขาศึก โจมตีจากฐานแลวถอยกลับกอนที่ขาศึกจะตีโต"
 AST_rats_of_tobruk_effect_1:0 "ไดรับหนวยรบชั้นยอดที่โทบรุก"
 AST_rats_of_tobruk_effect_2:0 "ไดรับหนวยรบชั้นยอดที่ซิดนีย"
 AST_fight_work_or_perish:0 "สู ทํางาน หรือดับสูญ"
 AST_fight_work_or_perish_desc:0 "เมื่อศัตรูเปนภัยคุกคามตอการดํารงอยูของดินแดนในปกครอง ชาวออสเตรเลียตองตัดสินใจ พวกเขาจะสู จะทํางาน หรือจะดับสูญ"
 AST_research_collaboration:0 "ความรวมมือดานการวิจัย"
 AST_research_collaboration_desc:0 "อังกฤษไดแสดงใหเราเห็นถึงขอดีของการแบงปนความกาวหนาทางวิทยาศาสตรระหวางพันธมิตรใกลชิด ฝายของเราทั้งหมดจะวิจัยและพัฒนาในยามสงครามไดอยางมีประสิทธิภาพยิ่งขึ้น หากเราดําเนินการที่จําเปนเพื่อประสานงานเรื่องนี้"
 AST_fund_australian_defense_research:0 "ทุนวิจัยกลาโหมออสเตรเลีย"
 AST_fund_australian_defense_research_desc:0 "เมื่อออสเตรเลียเปนชาติอธิปไตยโดยสมบูรณแลว เราจึงไมไดเขาถึงตนแบบและพิมพเขียวขั้นสูงเหมือนที่เคยไดรับ เราตองทําใหมั่นใจวาเราจะนําหนาศัตรูเสมอ และไมลาหลังดานเทคโนโลยี"
 AST_squash_the_squanderbugs:0 "บี้แมลงผลาญเงิน"
 AST_squash_the_squanderbugs_desc:0 "การใชจายสุรุยสุรายกับสินคาอุปโภคบริโภคที่ราคาพุงตามเงินเฟอกําลังดึงเงินออกจากพันธบัตรสงครามและความพยายามในสงคราม เราตองลดความอยากในของฟุมเฟอยขณะที่กองทัพกําลังขาดแคลน"
 AST_rationing_and_recycling:0 "การปนสวนและการรีไซเคิล"
 AST_rationing_and_recycling_desc:0 "ทรัพยากรทุกอยางมีความหมาย เราจะปนสวนอาหารใหพลเมือง รีไซเคิลเพื่อใหไดโลหะมากที่สุดจากของใชที่ชํารุด และสงเสริมการประหยัดทั่วประเทศ"
 AST_classify_aliens:0 "จําแนกคนตางดาว"
 AST_classify_aliens_desc:0 "ออสเตรเลียเปนชาติของผูอพยพ และดวยเหตุนี้ อาจไดรับบางคนที่ยังภักดีตอบานเกิดเดิมเขามา เราจะขึ้นทะเบียนและติดตามชาวออสเตรเลียที่เกิดในตางประเทศ"
 AST_strengthen_ties_with_uk:0 "กระชับสัมพันธกับสหราชอาณาจักร"
 AST_strengthen_ties_with_uk_desc:0 "ความภักดีของเราอยูกับประเทศแม เราจะไปทุกที่ที่เธอไป และมุงมั่นตอสูกับศัตรูของเธอ ขอพระเจาทรงคุมครองพระราชา"
 AST_support_the_policy_of_appeasement:0 "สนับสนุนนโยบายเอาใจ"
 AST_support_the_policy_of_appeasement_desc:0 "ความสูญเสียจากสงครามครั้งกอนยังคงหนักอึ้งในความทรงจําของชาติ หากการยอมเสียดินแดนในอีกซีกโลกหนึ่งจะทําใหออสเตรเลียไมตองเขาสูสงคราม เราก็ควรพิจารณาการยอมเสียดินแดนนั้นอยางแนนอน"
 AST_the_singapore_strategy:0 "ยุทธศาสตรสิงคโปร"
 AST_the_singapore_strategy_desc:0 "สิงคโปรอยูหางจากลอนดอนเกินกวาจะปลอดภัย ออสเตรเลียจะรับหนาที่ปกปองดานหนาของจักรวรรดิแหงนี้จากการรุกรานของผูอื่นเอง"
 AST_adopt_westminster:0 "ยึดระบบเวสตมินสเตอร"
 AST_adopt_westminster_desc:0 "เรายึดถือระบบเวสตมินสเตอรที่สืบทอดมาจากสหราชอาณาจักร"
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "องคการวิจัยวิทยาศาสตรและอุตสาหกรรมแหงเครือจักรภพเปนหนวยงานวิจัยของรัฐบาลที่มุงเพิ่มประสิทธิภาพดานวิทยาศาสตรและการผลิตในออสเตรเลีย การเพิ่มการสนับสนุนจะยิ่งเติมพลังใหกับกําลังขับเคลื่อนแหงสงคราม"
 AST_swpa_protector:0 "ผูพิทักษแปซิฟกตะวันตกเฉียงใต"
 AST_swpa_protector_desc:0 "ออสเตรเลียตองรับบทบาทหลักในฐานะผูพิทักษเขตแปซิฟกตะวันตกเฉียงใต เขตทะเลทั้งหมดตั้งแตอินโดจีนผานอินโดนีเซียไปจนถึงนิวกินีควรอยูภายใตการคุมครองของเรา"
 AST_empire_air_training_scheme:0 "โครงการฝกบินแหงจักรวรรดิ"
 AST_empire_air_training_scheme_desc:0 "ถึงเวลาที่ออสเตรเลียตองทุมเทใหกับโครงการฝกบินอยางจริงจัง ดวยการสนับสนุนจากสหราชอาณาจักร ดินแดนในปกครองทั้งหมดจะรวมมือกันสงนักบินและลูกเรือสนับสนุนเพื่อความพยายามในสงคราม"
 AST_commonwealth_aircraft_corporation:0 "บรรษัทอากาศยานเครือจักรภพ"
 AST_commonwealth_aircraft_corporation_desc:0 "บรรษัทอากาศยานเครือจักรภพเปนผูผลิตอากาศยานและเครื่องยนตอากาศยานหลักในออสเตรเลีย มีผลงานเปนที่ประจักษ และการสนับสนุนบรรษัทนี้จะทําใหนักบินของเราไดยุทโธปกรณที่ตองการ"
 AST_sever_ties_with_uk:0 "ตัดสัมพันธกับสหราชอาณาจักร"
 AST_sever_ties_with_uk_desc:0 "ถึงเวลาแยกตัวจากสหราชอาณาจักรแลว ออสเตรเลียสามารถกําหนดเสนทางของตนเองไดโดยไมตองใหลอนดอนแทรกแซง และประกาศกําหนดชะตากรรมของตนเองในภูมิภาคของตน"
 AST_protect_the_homeland:0 "ปกปองมาตุภูมิ"
 AST_protect_the_homeland_desc:0 "ออสเตรเลียกวางใหญ แตชายฝงของเราก็ปกปองได การรักษาความปลอดภัยของชาติเราเองคือสิ่งสําคัญที่สุด"
 AST_the_swpa_menace:0 "ภัยคุกคามในแปซิฟกตะวันตกเฉียงใต"
 AST_the_swpa_menace_desc:0 "ญี่ปุนกําลังสรางจักรวรรดิที่คุกคามความปลอดภัยของออสเตรเลียและเสรีภาพในภูมิภาค เราควรหันไปหาชาติที่มีแนวคิดเดียวกันมาเปนพันธมิตร"
 AST_never_another_gallipoli:0 "ไมมีกัลลิโปลีอีกแลว"
 AST_never_another_gallipoli_desc:0 "วิธีเดียวที่จะทําใหมั่นใจวาออสเตรเลียจะไมถูกลากเขาสูสงครามที่สูญเสียมหาศาลอีกเพราะความผูกพันทางใจ คือการควบคุมนโยบายตางประเทศของเราอยางสมบูรณ เราไมตองการกษัตริยที่อยูหางไกล และไมอาจปลอยใหสายสัมพันธทางสายเลือดเกาแกลากเราเขาสูความขัดแยงที่ไมเปนประโยชนตอเรา"
 AST_woo_usa:0 "เกี้ยวพาสหรัฐอเมริกา"
 AST_woo_usa_desc:0 "พันธมิตรที่แทจริงของเราคืออเมริกา มหาอํานาจแปซิฟกอีกชาติที่มีรากเหงาจากอังกฤษ ดินแดนที่มั่งคั่งและทรงพลังนี้เขาใจความตองการของเราไดดีกวา เพิ่มความรุงเรืองใหเรา และปกปองเราจากการรุกรานได"
 AST_protect_the_dutch_colonies:0 "ปกปองอาณานิคมดัตช"
 AST_protect_the_dutch_colonies_desc:0 "เนเธอรแลนดเปนเจาอาณานิคมที่ออนแอและอยูหางไกลจากอาณานิคมในอินโดนีเซีย ไมอาจปกปองดินแดนเหลานั้นจากการโจมตีของญี่ปุน จีน หรือชาติอื่นที่อาจเปนปฏิปกษได เราตองเขาควบคุมเพื่อประโยชนสวนรวม"
 AST_the_south_west_pacific_initiative:0 "ริเริ่มแปซิฟกตะวันตกเฉียงใต"
 AST_the_south_west_pacific_initiative_desc:0 "เราไดสรางฐานอํานาจและความนาเชื่อถือพอที่จะสรางเครือขายพันธมิตรของเราเอง โดยมุงปกปองเขตแปซิฟกตะวันตกเฉียงใตจากมหาอํานาจที่เปนปฏิปกษ เราจะแสวงหามหาอํานาจที่มีแนวคิดเดียวกัน และทําใหออสเตรเลียมีเสียงสําคัญในกิจการโลก"
 AST_preemptive_intervention:0 "การแทรกแซงเชิงปองกัน"
 AST_preemptive_intervention_desc:0 "การสรางจักรวรรดิของญี่ปุนตลอดทศวรรษที่ผานมาเปนภัยคุกคามตอเสรีชนทุกคนในแปซิฟก เราไมอาจรอจนกวามันจะหันสายตาหิวกระหายมาทางเรา ถึงเวลาลงมือแลว"
 AST_research_cooperation:0 "ความรวมมือดานการวิจัย"
 AST_research_cooperation_desc:1 "ชาวออสเตรเลียเปนคนฉลาดและรูจักพลิกแพลง แตเราไมมีโครงสรางพื้นฐานหรือประชากรพอสําหรับโครงการวิทยาศาสตรอยางจริงจัง เราจะรวมมือกับพันธมิตร แบงปนความรูและการคนพบเพื่อประโยชนรวมกัน"
 AST_abandon_the_westminster_system:0 "ละทิ้งระบบเวสตมินสเตอร"
 AST_abandon_the_westminster_system_desc:0 "แมรัฐสภาแบบเวสตมินสเตอรจะเปนมรดกที่เราไดรับจากบริเตนใหญ แตมันก็หมดประโยชนในยุคสมัยใหมแลว ความขัดแยงในคณะรัฐมนตรีและการแขงขันระหวางพรรคแทบไมชวยสรางเสถียรภาพใหออสเตรเลียในชวงวิกฤตเศรษฐกิจที่ผานมา"
 AST_support_the_centre_party:0 "สนับสนุนพรรคกลาง"
 AST_support_the_centre_party_desc:0 "ขบวนการตอตานคอมมิวนิสตอันแข็งขันไดกอตัวขึ้นในนิวเซาทเวลส ดวยความชวยเหลือจากพันธมิตรนิวการด พรรคกลางอาจเปนกุญแจสูการสรางความแข็งแกรงใหออสเตรเลีย"
 AST_supply_indonesian_nationalists:0 "สงเสบียงใหฝายชาตินิยมอินโดนีเซีย"
 AST_supply_indonesian_nationalists_desc:0 "เราควรสนับสนุนประชาชนอินโดนีเซียในการตอสูกับผูกดขี่ชาวดัตช พวกเขาจะตองไดรับการศึกษาและการฝกฝน แตดวยความเหนือกวาดานจํานวน ชัยชนะในการตอสูเพื่อความยุติธรรมครั้งนี้ยอมหลีกเลี่ยงไมได เชนเดียวกับความกตัญูที่พวกเขาจะมีตอเรา"
 AST_support_indonesian_uprising:0 "สนับสนุนการลุกฮือในอินโดนีเซีย"
 AST_support_indonesian_uprising_desc:0 "เมื่อชาวอินโดนีเซียจับอาวุธขึ้นสูกับดัตชแลว พวกเขาตองการมากกวาคําพูด การลุกฮือตองการปนและยุทโธปกรณอื่น ๆ รวมถึงการสนับสนุนทางการทูตอยางเต็มเสียง"
 AST_demand_new_zealand:0 "เรียกรองนิวซีแลนด"
 AST_demand_new_zealand_desc:0 "ชาวกีวีเปนพันธมิตรและมิตรที่ใกลชิดที่สุดของเรามายาวนาน เราสูรบบนชายหาดเดียวกันและตายในสงครามจักรวรรดิไรประโยชนครั้งเดียวกัน ถึงเวลารวมสองประเทศของเราไวใตธงผืนเดียว"
 AST_protect_the_south_west_pacific:0 "ปกปองแปซิฟกตะวันตกเฉียงใต"
 AST_protect_the_south_west_pacific_desc:0 "ถึงเวลาใชอํานาจในภูมิภาคของเรานําแปซิฟกตะวันตกเฉียงใตทั้งหมดเขาสูเขตอิทธิพลของเรา มีเพียงเราที่ปกปองผูคนและทรัพยากรจากคนนอกที่หมายจะปลนชิงมรดกของเราได"
 AST_a_deal_with_japan:0 "ขอตกลงกับญี่ปุน"
 AST_a_deal_with_japan_desc:0 "เมื่อแปซิฟกตะวันตกเฉียงใตอยูในวงโคจรของเรา เราก็สามารถฟนสัมพันธกับจักรวรรดิญี่ปุนได หากญี่ปุนอยูแตทางตะวันตกเฉียงเหนือและปลอยเขตอิทธิพลของเราไว ก็ไมมีเหตุผลที่เราจะตองสูกัน"
 AST_our_own_empire:0 "จักรวรรดิของเราเอง"
 AST_our_own_empire_desc:0 "ถึงเวลาแลวที่อดีตอาณานิคมจะยืนหยัดดวยตนเองและประกาศสถาปนาจักรวรรดิออสเตรเลีย ความเมตตาและการวางแผนที่มองการณไกลของเราจะเปนประโยชนตอทุกคนในภูมิภาค"
 AST_japan_tech_sharing:0 "แบงปนเทคโนโลยีกับญี่ปุน"
 AST_japan_tech_sharing_desc:0 "นักวิทยาศาสตรญี่ปุนกาวลํ้าหนาสถาบันวิจัยของเราไปแลว แตความปรองดองครั้งใหมของเรากับจักรวรรดิอาทิตยอุทัยเปดโอกาสใหมในการเรียนรูและแบงปน"
 AST_war_on_japan:0 "ทําสงครามกับญี่ปุน"
 AST_war_on_japan_desc:0 "การรุกรานของญี่ปุนดําเนินมานานเกินไปแลว มันขมขืนและปลนสะดมไปทั่วเอเชียตะวันออก และบัดนี้ก็จองมองดินแดนและทรัพยากรที่อยูไกลลงมาทางใต เราไมอาจยืนดูเฉย ๆ ได"
 AST_empower_the_workers:0 "เสริมอํานาจใหผูใชแรงงาน"
 AST_empower_the_workers_desc:0 "ชาตินักโทษ คนเลี้ยงปศุสัตว และกรรมกรทาเรือ นั่นคือออสเตรเลีย ถึงเวลามอบเสียงและอํานาจใหผูใชแรงงานและชนชั้นกรรมาชีพแหงออสเตรเลีย การปฏิวัติจงเจริญ"
 AST_delegation_to_china:0 "คณะผูแทนสูจีน"
 AST_delegation_to_china_desc:0 "ประชาชนจีนที่ถูกความโลภของจักรวรรดินิยมฉีกทึ้งมาเนิ่นนานตองการมิตร และเราก็ตองการพันธมิตรในภูมิภาคเพื่อตอตานฟาสซิสต การพบปะอยางเปนทางการกับรัฐบาลจีนครั้งนี้จะนําเราใหใกลชิดกันมากขึ้น"
 AST_commitment_to_the_cause:0 "อุทิศตนเพื่ออุดมการณ"
 AST_commitment_to_the_cause_desc:0 "ถึงเวลาสลัดพันธนาการของกษัตริยตางชาติ และสรางสวรรคของผูใชแรงงานที่ปลอดจากการกอสงครามของจักรวรรดินิยมซึ่งทําใหออสเตรเลียทั้งประเทศตกอยูในความเสี่ยง"
 AST_indirect_support:0 "การสนับสนุนทางออม"
 AST_indirect_support_desc:0 "สาธารณรัฐประชาชนจีนกําลังทําสงคราม แตเราไมอยูในฐานะที่จะเปดตัวเองใหเสี่ยงภัย การสงอาวุธจํานวนเล็กนอยและการใหกําลังใจอยางระมัดระวังคือทั้งหมดที่เราเสี่ยงไดในตอนนี้"
 AST_direct_support:0 "การสนับสนุนโดยตรง"
 AST_direct_support_desc:0 "จับอาวุธขึ้นเถิดสหาย! จงฟงเสียงเรียกรองของพี่นองชาวจีนที่ทุกขทนในสงครามตอตานฟาสซิสต! สมัครและเขารวมการตอสูระดับโลกของผูใชแรงงานทั้งปวง!"
 AST_join_comintern:0 "เขารวมโคมินเทิรน"
 AST_join_comintern_desc:0 "อนาคตของเราอยูกับคอมมิวนิสต ดังนั้นเราตองรวมกับสหายทั่วโลกในการตอสูระดับโลกครั้งนี้ ลุงโจจะนําทางเรา และนําผูใชแรงงานจากออสเตรเลียและทุกหนแหงไปสูวันพรุงนี้อันรุงโรจน"
 AST_workers_paradise:0 "สวรรคของผูใชแรงงาน"
 AST_workers_paradise_desc:0 "การทดลองคอมมิวนิสตแบบสตาลินลมเหลว แตเราเชื่อวาสังคมนิยมคือหนทางที่ถูกตอง ออสเตรเลียจะบุกเบิกเสนทางที่สองใหผูใชแรงงานเดินตาม โดยไมตองรับคําสั่งจากมอสโก"
 AST_research_city_excursions:0 "ทัศนศึกษาเมืองวิจัย"
 AST_research_city_excursions_desc:0 "สหภาพโซเวียตไดสรางเมืองวิจัยและหองปฏิบัติการทั่วดินแดน และไดเชิญนักวิจัยชาวออสเตรเลียไปเรียนรูความรุงโรจนของวิทยาศาสตรคอมมิวนิสต"
 AST_nz_puppet:0 "นิวซีแลนดรัฐหุนเชิด"
 AST_nz_puppet_desc:0 "ผูใชแรงงานแหงนิวซีแลนดควรรวมกับพี่นองชาวออสเตรเลีย เราสามารถปกปองพวกเขา และไดยื่นมือแหงมิตรภาพอันออนโยนใหแลว ตราบใดที่พวกเขายอมรับการชี้นําของเรา"
 AST_the_threat_against_the_people:0 "ภัยคุกคามตอประชาชน"
 AST_the_threat_against_the_people_desc:0 "อํานาจลัทธิทหารและฟาสซิสตของจักรวรรดิญี่ปุนเปนภัยตอความผาสุกของชาวออสเตรเลียทุกคน และขัดขวางการอยูรวมกันอยางสันติของผูใชแรงงานทั่วโลก ออสเตรเลียจะผลักดันศัตรูของประชาชนผูนี้กลับไป บีบใหพวกมันอยูแตบนเกาะหินอันหดหูของตน"
 AST_new_general_tt:0 "นายพลคนใหม§Yระดับทักษะ 3§!ชื่อ§Yไอเวน แม็กเคย§!จะปรากฏตัว"
 AST_homeland_defense_tt:0 "เสริมปอมปราการใหมาตุภูมิดวย§Yปอมชายฝงและปอมภาคพื้นดิน§! เพื่อเฝาจุดยกพลขึ้นบกและทาเรือที่คาดวาจะถูกโจมตี"
 AST_swpi_research_tt:0 "เราจะเขารวม§Yขอตกลงแบงปนเทคโนโลยี§!กับสหรัฐอเมริกาหรือสมาชิกอื่นในฝายของเรา"
 AST_deal_with_japan_tt:1 "เราจะเสนอโอนอํานาจปกครองเหนือ§Yมลายา§!ใหญี่ปุนเพื่อแลกกับการเปนพันธมิตร หากไมสําเร็จ เราจะเสนอยกรัฐ§Yกาลีมันตัน§! §Yสุลาเวสี§! และ§Yหมูเกาะโมลุกกะ§!ใหญี่ปุนแทน\n"
 CAN_rowell_sirois_commission:0 "คณะกรรมาธิการโรเวลล-ซีรัวส"
 CAN_rowell_sirois_commission_desc:0 "คณะกรรมาธิการโรเวลล-ซีรัวสไดขอสรุปวาโครงสรางรัฐธรรมนูญแบบสหพันธรัฐของแคนาดาเปนอุปสรรคตอการฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ เราควรทําใหมาตรฐานการบริการเทาเทียมกันทั่วประเทศ"
 CAN_crown_corporations:0 "บรรษัทของรัฐ"
 CAN_crown_corporations_desc:0 "เพื่อใหบริการที่จําเปนและกระตุนการเติบโตทางเศรษฐกิจและอุตสาหกรรม แคนาดาตองจัดตั้งบรรษัทของรัฐใหมจํานวนมาก ในจุดที่เอกชนไมยอมเขามา รัฐบาลตองลงมือเอง"
 CAN_war_bonds:0 "พันธบัตรสงคราม"
 CAN_war_bonds_desc:0 "เราไมอาจใชฐานภาษีอันนอยนิดหรือการสงออกทรัพยากรมาเปนทุนในการทําสงครามได ประชาชนชาวแคนาดาผูรักชาติตองลงทุนในประเทศของตนและสนับสนุนความพยายามในสงครามผานพันธบัตรสงคราม"
 CAN_defence_of_canada_regulations:0 "ระเบียบการปองกันแคนาดา"
 CAN_defence_of_canada_regulations_desc:0 "ในยามสงคราม สิทธิพลเมืองตองถูกจํากัดเพื่อปองกันการบอนทําลายความพยายามในสงคราม ซึ่งหมายถึงการจํากัดสื่อ กลุมผูเห็นตาง และสิทธิทางกฎหมายบางประการ"
 CAN_national_housing_act:0 "พระราชบัญญัติที่อยูอาศัยแหงชาติ"
 CAN_national_housing_act_desc:0 "ดินแดนในปกครองที่กําลังพัฒนาสูความทันสมัยตองมีระเบียบดานที่อยูอาศัยที่เปนมาตรฐานเดียวกันทั่วประเทศ เราตองยกระดับคุณภาพชีวิตของชาวแคนาดาทุกคน"
 CAN_dollar_a_year_men:0 "บุรุษเงินเดือนดอลลารเดียว"
 CAN_dollar_a_year_men_desc:0 "อุตสาหกรรมของแคนาดามีปญหาดานประสิทธิภาพ แตนักธุรกิจผูมั่งคั่งจํานวนหนึ่งไดเสนอตัวใหบริการและคําปรึกษาเพื่อแลกกับคาตอบแทนเพียงเล็กนอยเปนพิธี ที่ปรึกษากลุมเล็ก ๆ นี้จะนําเรากาวไปขางหนา"
 CAN_canada_pacific_railway:0 "การรถไฟแคนาเดียนแปซิฟก"
 CAN_canada_pacific_railway_desc:0 "CPR ไดนําทรัพยากรทั้งหมดมาใชเพื่อความพยายามในสงคราม เสบียงและวัสดุนับพันตันจะขามดินแดนในปกครองอันยิ่งใหญของเราจากทะเลสูทะเลโดยไมหยุดชะงัก"
 CAN_maritime_colonial_railway:0 "การรถไฟอาณานิคมทางทะเล"
 CAN_maritime_colonial_railway_desc:0 "มณฑลทางตะวันออกของเราขาดแคลนเสนทางรถไฟมาตั้งแตการขายการรถไฟอินเตอรโคโลเนียลใหแกการรถไฟแหงชาติแคนาดา เรากําลังสงเสริมและดําเนินการสรางการรถไฟอาณานิคมทางทะเลสายใหม เพื่อขยายการเชื่อมตอระหวางมณฑลตอนกลางกับมณฑลริมแอตแลนติก"
 CAN_retool_angus_shops:0 "ปรับเครื่องจักรโรงงานแองกัส"
 CAN_retool_angus_shops_desc:0 "กองทัพสมัยใหมตองมียานเกราะ และโรงงานแองกัสของ CPR ก็เหมาะสําหรับการผลิต จงปรับเครื่องจักรและปรับปรุงสิ่งอํานวยความสะดวกนี้เพื่อสรางรถถัง"
 CAN_imperial_oil:0 "อิมพีเรียลออยล"
 CAN_imperial_oil_desc:0 "อิมพีเรียลออยลตองการใหทุนสํารวจในแคนาดาตะวันตก ซึ่งจะเพิ่มปริมาณสํารองปโตรเลียมของเราและหลอลื่นเครื่องจักรสงคราม"
 CAN_department_of_munitions_and_supply:0 "กระทรวงยุทธภัณฑและการจัดหา"
 CAN_department_of_munitions_and_supply_desc:0 "เราจะนําการควบคุมและบริหารทรัพยากรแหงชาติของแคนาดามาอยูภายใต ซี.ดี. ฮาว ในกระทรวงยุทธภัณฑและการจัดหา"
 CAN_national_resources_mobilization_act:0 "พระราชบัญญัติระดมทรัพยากรแหงชาติ"
 CAN_national_resources_mobilization_act_desc:0 "แคนาดากวางใหญและประชากรกระจายตัวเปนกลุม ๆ ทั่วแผนดิน ควรพัฒนาระบบติดตามสถานะการจางงาน และทําใหมั่นใจวาสามารถหาตัวทุกคนที่มีสิทธิ์ไปประจําการโพนทะเลได"
 CAN_wartime_prices_and_trade_board:0 "คณะกรรมการราคาและการคายามสงคราม"
 CAN_wartime_prices_and_trade_board_desc:0 "เพื่อปองกันการคากําไรเกินควรและการกักตุนสินคา จึงมีการควบคุมราคาเพื่อใหชาวแคนาดาสวนใหญเขาถึงสินคาได"
 CAN_bits_and_pieces_program:0 "โครงการเศษเล็กเศษนอย"
 CAN_bits_and_pieces_program_desc:0 "โครงการเศษเล็กเศษนอยจะระดมโรงงานขนาดเล็กจํานวนหนึ่งที่เคยผลิตสินคาอุปโภคบริโภคเล็ก ๆ นอย ๆ มาชวยความพยายามในสงคราม โรงงานจักรยานก็สามารถหากําลังการผลิตมาทําสินคาสงครามที่มีประโยชนไดมากมาย"
 CAN_fund_the_national_research_council:0 "ทุนสภาวิจัยแหงชาติ"
 CAN_fund_the_national_research_council_desc:0 "แคนาดามีประวัติดานวิทยาศาสตรและความกาวหนา แตความตองการนักวิจัยมีมากกวาที่เคย ถึงเวลาทุมการสนับสนุนให NRC มากขึ้น"
 CAN_mine_the_shield:0 "ทําเหมืองบนหินฐานแคนาดา"
 CAN_mine_the_shield_desc:0 "หินฐานแคนาดาอุดมไปดวยนิกเกิล ทองแดง ทองคํา และเงิน ธรรมชาติไดมอบแรธาตุอันอุดมสมบูรณใหเรา ถึงเวลาใชประโยชนจากมันใหมากขึ้น"
 CAN_canada_wheat_board:0 "คณะกรรมการขาวสาลีแคนาดา"
 CAN_canada_wheat_board_desc:0 "ความเสียหายของเกษตรกรทางตะวันตกในชวงเศรษฐกิจตกตํ่าสามารถแกไขได หากเราฟนฟูและปลุกคณะกรรมการขาวสาลีแคนาดาขึ้นมาใหมเพื่อกําหนดราคาขายขาวสาลี ขาวบารเลย ขาวโอต และพืชผลอื่น ๆ"
 CAN_victory_aircraft_limited:0 "วิกตอรีแอรคราฟตลิมิเต็ด"
 CAN_victory_aircraft_limited_desc:0 "วิกตอรีแอรคราฟตไดรับมอบหมายใหสรางกองบินเครื่องบินทิ้งระเบิดของแคนาดา แลงคาสเตอรสําหรับทุกคน!"
 CAN_alberta_coal_towns:0 "เมืองถานหินแอลเบอรตา"
 CAN_alberta_coal_towns_desc:0 "มีแหลงถานหินอยูตลอดแนวเทือกเขาร็อกกีพรอมใหใชประโยชน เราสามารถสงเสริมการยายถิ่นไปยังแหลงเหมืองใหมเหลานี้และเพิ่มการจางงานในภาคตะวันตก"
 CAN_commit_to_the_war:0 "มุงมั่นตอสงคราม"
 CAN_commit_to_the_war_desc:0 "โลกกําลังลุกเปนไฟ และแคนาดามีบทบาทที่ตองแสดง เราขอปฏิญาณที่จะปกปองประชาธิปไตยและวิถีชีวิตแบบอังกฤษ"
 CAN_john_inglis_and_company:0 "จอหน อิงลิส แอนด คอมพานี"
 CAN_john_inglis_and_company_desc:0 "จอหน อิงลิส แอนด คอมพานี ควรไดรับคําสั่งใหสรางปนกลและปนใหญใหมสําหรับกองทัพแคนาดา"
 CAN_polymer_corporation:0 "พอลิเมอรคอรปอเรชัน"
 CAN_polymer_corporation_desc:0 "พอลิเมอรคอรปอเรชัน บรรษัทของรัฐแหงใหม ไดพิสูจนแลววามีประสิทธิภาพเปนพิเศษในการผลิตยางพอลิเมอรชนิดใหม"
 CAN_national_steel_car:0 "เนชันแนลสตีลคาร"
 CAN_national_steel_car_desc:0 "แมจะตองดิ้นรนผานภาวะเศรษฐกิจตกตํ่า แตบริษัทเนชันแนลสตีลคารก็มีความเชี่ยวชาญและประสบการณที่จะชวยสรางยานพาหนะที่เราตองการสําหรับทางรถไฟและกองทัพที่ขยายตัว"
 CAN_send_in_the_zombies:0 "สงพวกซอมบี้ไป"
 CAN_send_in_the_zombies_desc:0 "ถึงเวลาสงชายที่มีสิทธิ์ทุกคนของแคนาดาเขากองทัพ เราไดระดมชายจํานวนมากเขาทํางานในอุตสาหกรรมผาน NRMA แลว แตบัดนี้พวกเขาควรถูกสงไปโพนทะเล"
 CAN_if_day:0 "วันสมมุติ"
 CAN_if_day_desc:0 "ชาวแคนาดาไมไดมองภัยคุกคามจากการถูกตางชาติครอบงําอยางจริงจัง ดังนั้นเราจะจําลองการยึดครองวินนิเพกของนาซีเพื่อตอกยํ้าความหวาดกลัว ซึ่งจะเพิ่มยอดขายพันธบัตรแหงชัยชนะไดอยางแนนอน"
 CAN_defense_research_grants:0 "ทุนวิจัยกลาโหม"
 CAN_defense_research_grants_desc:0 "เมื่อแคนาดาเปนชาติอธิปไตยโดยสมบูรณแลว เราจึงไมไดเขาถึงตนแบบและพิมพเขียวขั้นสูงเหมือนที่เคยไดรับ เราตองทําใหมั่นใจวาเราจะนําหนาศัตรูเสมอ และไมลาหลังดานเทคโนโลยี"
 CAN_uranium_mining:0 "การทําเหมืองยูเรเนียม"
 CAN_uranium_mining_desc:0 "พันธมิตรของเรากําลังดําเนินโครงการลับที่ตองใชยูเรเนียม โชคดีที่บริษัทเอลโดราโดไดคนพบแรหายากนี้และสรางเมืองรอบเหมืองขึ้น คือพอรตเรเดียม รัฐบาลตองเขาควบคุมบริษัทนี้และปกปองแรที่ออนไหวอยางยิ่งนี้"
 CAN_long_branch_arsenal:0 "คลังอาวุธลองบรานช"
 CAN_long_branch_arsenal_desc:0 "คลังอาวุธลองบรานชทางตะวันตกของโทรอนโตจะเปนศูนยกลางการผลิตปนไรเฟลของเรา เราตองการปนลี-เอนฟลดนับพันกระบอก และทําเลใจกลางของคลังอาวุธจะชวยในการกระจายไปทั่วประเทศ"
 CAN_independent_command:0 "กองบัญชาการอิสระ"
 CAN_independent_command_desc:0 "ในมหาสงคราม ทหารแคนาดาตองขึ้นตรงตอนายทหารอังกฤษ จนนําไปสูการสังหารหมูอยางไรเหตุผลที่ซอมมและพาสเชนเดล คราวนี้ แคนาดาจะบัญชาการทหารของตนเอง"
 CAN_forced_quebec_conscription:0 "บังคับเกณฑทหารในควิเบก"
 CAN_forced_quebec_conscription_desc:0 "เชนเดียวกับป 1917 พลเมืองชาวแคนาดาเชื้อสายฝรั่งเศสในควิเบกกําลังตอตานแนวคิดการเกณฑทหารทั่วประเทศเพื่อเพิ่มกําลังพลใหกองทัพ เราจะไมยอมนิ่งเฉยปลอยใหชนกลุมนอยกลุมหนึ่งขัดขืนเจตจํานงของรัฐสภา"
 CAN_compromise_with_quebec:0 "ประนีประนอมกับควิเบก"
 CAN_compromise_with_quebec_desc:0 "ควิเบกกําลังคัดคานการเกณฑทหารทั่วประเทศ ประเด็นนี้เกือบทําใหประเทศแตกแยกในมหาสงคราม และเราไมอาจทําลายเอกภาพของชาติในยามวิกฤต บางทีเราอาจทําขอตกลงเรื่องการรับราชการสงครามสําหรับชาวควิเบกได"
 CAN_war_fueled_economy:0 "เศรษฐกิจขับเคลื่อนดวยสงคราม"
 CAN_war_fueled_economy_desc:0 "ความตองการวัตถุดิบและสินคาสําเร็จรูปจากโพนทะเลกําลังยกแคนาดาออกจากภาวะเศรษฐกิจตกตํ่า ความมั่งคั่งทางธรรมชาติทั้งปาไมและแรธาตุของเราสามารถปอนเครื่องจักรสงครามของฝายสัมพันธมิตรและทําใหชาติรํ่ารวย"
 CAN_army_modernization:0 "ปรับปรุงกองทัพใหทันสมัย"
 CAN_army_modernization_desc:0 "แคนาดาปลอดภัยอยูในบานกันไฟของเรา หางไกลจากวัตถุไวไฟมานานเกินไป จนปลอยใหกองทัพใชยุทโธปกรณและการฝกที่ลาสมัย เราตองเดินหนาปรับปรุงใหทันสมัยกอนที่จะสายเกินไป"
 CAN_canadian_infantry_corps:0 "กองทัพนอยทหารราบแคนาดา"
 CAN_canadian_infantry_corps_desc:0 "บัดนี้เรามีกําลังพลมากพอที่จะจัดตั้งหนวยระดับกองทัพนอยแลว กองทัพนอยทหารราบแคนาดาเปนหนวยขนาดกองทัพนอยหนวยแรกของเรานับตั้งแตสงครามครั้งกอน"
 CAN_cmp_truck:0 "รถบรรทุก CMP"
 CAN_cmp_truck_desc:0 "โรงงานของแคนาดาปลอดภัยจากการทิ้งระเบิดของขาศึก จึงสามารถนํามาผลิตยานพาหนะขนสงเพื่อความพยายามในสงครามได รถบรรทุก CMP ของเราใชงานไดหลากหลายและเหมาะกับหลายสภาพอากาศ"
 CAN_royal_regiment_of_canadian_artillery:0 "กรมทหารปนใหญหลวงแคนาดา"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "แมจะขาดปนใหญที่ทันสมัย แตเราตองเริ่มฝกทหารปนใหญใหพรอมรบในสงครามสมัยใหม รวมถึงการใชปนตอสูอากาศยานและปนใหญ 25 ปอนดแบบใหม"
 CAN_a_motorized_army:0 "กองทัพยานยนต"
 CAN_a_motorized_army_desc:0 "ประสบการณของแคนาดาในการผลิตรถบรรทุกและเครื่องยนตทําใหเราไดเปรียบในการวิจัยและพัฒนากองกําลังยานยนต"
 CAN_red_deer_training_camp:0 "คายฝกเรดเดียร"
 CAN_red_deer_training_camp_desc:0 "คายฝกเรดเดียรจะเปนสถานที่หลักในการฝกกองทัพใหมของเรา ดวยคลังอาวุธที่ครบครันและสนามบินใกลเคียง เรดเดียรจึงมีทําเลที่เหมาะสมที่สุด"
 CAN_the_walkie_talkie:0 "วิทยุวอลกี้ทอลกี้"
 CAN_the_walkie_talkie_desc:0 "โดนัลด ฮิงส ไดประดิษฐและกําลังจดสิทธิบัตรอุปกรณสื่อสารสองทางแบบมือถือชนิดใหมที่ทํางานดวยคลื่นวิทยุ ซึ่งจะชวยปรับปรุงการสื่อสารและการกําหนดเปาหมายไดอยางมาก"
 CAN_1st_canadian_parachute_battalion:0 "กองพันพลรมแคนาดาที่ 1"
 CAN_1st_canadian_parachute_battalion_desc:0 "แมจะมีการตอตานจากผูที่อยากใหเรามุงเนนการปองกันประเทศ แตการสงครามสงทางอากาศสมัยใหมตองมีกองพันพลรมโดยเฉพาะ เพื่อชิงความไดเปรียบเหนือศัตรู"
 CAN_the_black_devils:0 "ปศาจดํา"
 CAN_the_black_devils_desc:0 "จําเปนตองมีหนวยคอมมานโดพิเศษไวสําหรับภารกิจอันตราย มีการจัดเตรียมความรวมมือกับพันธมิตรอเมริกันในการจัดตั้งกองพลนอยปศาจแลว"
 CAN_the_valentine_tank:0 "รถถังวาเลนไทน"
 CAN_the_valentine_tank_desc:0 "แคนาดาไดรับสิทธิ์ผลิตรถถังวาเลนไทน รถถังขนาดกลางที่ทนทานซึ่งออกแบบโดยอังกฤษ"
 CAN_the_rocky_mountain_rangers:0 "หนวยพรานร็อกกีเมานเทน"
 CAN_the_rocky_mountain_rangers_desc:0 "การปองกันประเทศทางตะวันตกจะเปนหนาที่ของหนวยพรานร็อกกีเมานเทนซึ่งตั้งฐานอยูที่แคมลูปส"
 CAN_strengthen_the_commonwealth_ties:0 "กระชับสัมพันธเครือจักรภพ"
 CAN_strengthen_the_commonwealth_ties_desc:0 "ดินแดนในปกครองดวยกันคือมิตรแทที่สุดของเรา และเราทุกคนควรเดินทัพรวมกันเพื่อสนับสนุนพระมหากษัตริย"
 CAN_shadow_factories:0 "โรงงานเงา"
 CAN_shadow_factories_desc:0 "เราตองการโรงงานอากาศยาน แตการกระจายการผลิตชิ้นสวนไปยังโรงงานอื่น โดยเฉพาะใกลโรงงานรถยนต นั้นงายกวาและปลอดภัยกวา ซึ่งจะสงเสริมการรักษาความลับและความปลอดภัย"
 CAN_montreal_laboratory_collaboration:0 "ความรวมมือหองปฏิบัติการมอนทรีออล"
 CAN_montreal_laboratory_collaboration_desc:1 "หองปฏิบัติการมอนทรีออลไดกลายเปนแหลงดึงดูดนักวิทยาศาสตรจากทั่วโลก นักวิทยาศาสตรชาวฝรั่งเศสและอังกฤษรูสึกเปนที่ตอนรับเปนพิเศษ และนําความเชี่ยวชาญที่จําเปนอยางยิ่งมาสูความพยายามของดินแดนในปกครอง"
 CAN_the_plan:0 "แผนการ"
 CAN_the_plan_desc:0 "เราไดรวมมือกับพันธมิตรเพื่อแบงปนประสบการณและความรูในการฝกนักบิน สงครามอาจชนะไดดวยการรบทางอากาศ ดังนั้นแผนการฝกบินแหงเครือจักรภพอาจเปนกุญแจสูชัยชนะ"
 CAN_camp_x:0 "แคมป X"
 CAN_camp_x_desc:0 "การรวบรวมขาวกรองและการฝกสายลับจะรวมศูนยอยูที่สถานที่ลับใกลออชาวา ซึ่งตั้งอยูกึ่งกลางในการรับสัญญาณจากทั้งสหราชอาณาจักรและอเมริกา"
 CAN_supply_the_empire:0 "สงเสบียงใหจักรวรรดิ"
 CAN_supply_the_empire_desc:0 "มีชาติใดอีกที่อุดมดวยไม เหล็ก นิกเกิล และถานหินเทาเรา? ตราบใดที่ขบวนเรือลําเลียงและทางรถไฟของเราปลอดภัย เราก็สามารถขนสงวัตถุดิบไปยังทาเรือแลวสงตอใหหุนสวนในจักรวรรดิได"
 CAN_aluminium_company_of_canada:0 "บริษัทอะลูมิเนียมแหงแคนาดา"
 CAN_aluminium_company_of_canada_desc:0 "อะลูมิเนียมมีนํ้าหนักเบาและไมเปนสนิม การขยายการทําเหมืองและการผลิตอะลูมิเนียมจะทําใหมั่นใจไดวาโรงงานและสายการประกอบของเราจะมีวัตถุดิบปอนเสมอ"
 CAN_turner_valley_oilfield:0 "แหลงนํ้ามันเทิรนเนอรแวลลีย"
 CAN_turner_valley_oilfield_desc:0 "เทิรนเนอรแวลลียนอกเมืองแคลกะรีซึ่งคนพบในป 1914 ไดกลายเปนหนึ่งในแหลงนํ้ามันที่ใหญที่สุดในจักรวรรดิ การพัฒนาตอยอดควรเปนวาระสําคัญสูงสุดของทั้งภาคอุตสาหกรรมและรัฐบาล"
 CAN_patriation:0 "การโอนรัฐธรรมนูญกลับประเทศ"
 CAN_patriation_desc:0 "ถึงเวลาที่แคนาดาจะลดความผูกพันกับอังกฤษประเทศแม เราเปนชาติที่เติบใหญแลว มีชะตากรรมของตนเอง และมองไปยังทวีปของเราและขามแปซิฟกพอ ๆ กับที่มองไปยังอังกฤษและยุโรป"
 CAN_permanent_joint_defense_board:0 "คณะกรรมการปองกันรวมถาวร"
 CAN_permanent_joint_defense_board_desc:0 "ภูมิศาสตรและมรดกรวมผูกเราไวกับสหรัฐอเมริกา แตทวีปนี้กวางใหญเกินกวาที่ชาติใดชาติหนึ่งจะปกปองไดตามลําพัง จําเปนตองมีคณะกรรมการปองกันรวมเพื่อปรึกษาหารือและวางแผนการปกปองอเมริกาเหนือ"
 CAN_north_american_alliance:0 "พันธมิตรอเมริกาเหนือ"
 CAN_north_american_alliance_desc:0 "ถึงเวลาประกาศความเปนหุนสวนอันยิ่งใหญและถาวรกับสหรัฐอเมริกาแลว ไมมีผูใดทาทายเราไดเมื่อเราเปนหนึ่งเดียวในสันติภาพและภราดรภาพ"
 CAN_habakkuk_carrier:0 "เรือบรรทุกเครื่องบินฮาบากุก"
 CAN_habakkuk_carrier_desc:0 "โครงการฮาบากุกคือแผนสรางเรือบรรทุกเครื่องบินตอตานเรือดํานํ้าจากวัสดุที่ทําจากเยื่อไมและนํ้าแข็ง ซึ่งจะชวยประหยัดเหล็กกลาไวใชในงานที่สําคัญกวา และสงเสริมวิทยาศาสตรของแคนาดา"
 CAN_refuge_for_scientists:0 "ที่พักพิงของนักวิทยาศาสตร"
 CAN_refuge_for_scientists_desc:0 "แคนาดาซึ่งอยูหางไกลจากความวุนวายของสงคราม ไดพิสูจนแลววาเปนที่พักพิงอันนาสนใจสําหรับนักวิทยาศาสตรที่ปรารถนาจะทํางานโดยปราศจากระเบิดและกระสุน"
 CAN_swastika_clubs:0 "สโมสรสวัสดิกะ"
 CAN_swastika_clubs_desc:0 "ชาวแคนาดาจํานวนมากหันไปเขาสโมสรสวัสดิกะเพื่อเผยแพรแนวคิดและอุดมการณฟาสซิสต นาทึ่งจริง ๆ!"
 CAN_support_the_blue_shirts:0 "สนับสนุนกลุมเสื้อนํ้าเงิน"
 CAN_support_the_blue_shirts_desc:0 "การหันสูฟาสซิสตของชาติเราตองอาศัยกองกําลังกึ่งทหารที่แข็งแกรงเพื่อขมขูและสรางความเกรงขามแกคูแขง กลุมเสื้อนํ้าเงินจะเปนคําตอบของเราตอผูที่ขัดขืนระเบียบใหมของเรา"
 CAN_join_germany:0 "เขารวมกับเยอรมนี"
 CAN_join_germany_desc:0 "ฮิตเลอรไดพิสูจนแลววาเปนคนมีเหตุผลที่เรียกรองอยางมีเหตุผล ขณะเดียวกันก็สรางชาติใหแข็งแกรง เราจะรวมเปนหนึ่งเดียวกับไรชเพื่อยุคทองครั้งใหม"
 CAN_support_a_synarchist_baja:0 "สนับสนุนบาฮาแนวซินารคิสต"
 CAN_support_a_synarchist_baja_desc:0 "เพื่อเผยแพรลัทธิชาตินิยมอนุรักษนิยมในอเมริกาเหนือใหกวางขวางยิ่งขึ้น เราควรทุมสนับสนุนการลุกฮือของพวกซินารคิสตในเม็กซิโก เมื่อสําเร็จ เราจะมีรัฐฟาสซิสตสองรัฐพรอมเผยแพรอุดมการณไปทั่วซีกโลก"
 CAN_pinion_the_eagle:0 "ตัดปกพญาอินทรี"
 CAN_pinion_the_eagle_desc:0 "พรมแดนอันยาวเหยียดของเรากับสหรัฐอเมริกาไรการปองกันมานานเกินไป อเมริกายังคงเปนภัยคุกคามใหญที่สุดตอความมั่นคงของแคนาดา จึงตองลงมือทําใหการรุกรานของสหรัฐฯ ยากลําบากและยุงยากเกินไป"
 CAN_skewer_the_eagle:0 "เสียบไมพญาอินทรี"
 CAN_skewer_the_eagle_desc:0 "เราจะผนึกพันธมิตรกับพี่นองชาวเม็กซิกันเพื่อโอบลอมและสกัดกั้นภัยคุกคามจากอเมริกา"
 CAN_defence_scheme_no_1:1 "แผนปองกันหมายเลข 1"
 CAN_defence_scheme_no_1_desc:1 "ถึงเวลาปดฝุนแผนปองกันหมายเลข 1 แผนการตีโตสหรัฐอเมริกาหากเกิดสงครามที่เราวางไวในชวงระหวางสงคราม"
 CAN_demand_labrador_and_newfoundland:0 "เรียกรองแลบราดอรและนิวฟนดแลนด"
 CAN_demand_labrador_and_newfoundland_desc:0 "นิวฟนดแลนดเปนดินแดนในปกครองที่ลมเหลวจนตองกลับไปมีสถานะเปนอาณานิคม ที่ที่เหมาะสมของมันคือการอยูกับแคนาดา"
 CAN_burn_the_royal_portraits:0 "เผาพระบรมฉายาลักษณ"
 CAN_burn_the_royal_portraits_desc:0 "ไมเอากษัตริยอีกแลว! เราจะไมยอมอยูใตการปกครองของประมุขในนามจากตางแดนและรัฐสภาตางชาติอีกตอไป แคนาดาจะเปนอิสระและเทาเทียม ประชาชนจะลุกขึ้นสู"
 CAN_communist_labor_total_war_committee:0 "คณะกรรมการสงครามเบ็ดเสร็จแรงงานคอมมิวนิสต"
 CAN_communist_labor_total_war_committee_desc:0 "คอมมิวนิสตชาวแคนาดาก็เปนผูรักชาติ! ในสงครามโลกตอตานฟาสซิสต เราสามารถรวมมือกับพวกเสรีนิยมกระฎมพีเพื่อระดมทั้งชาติเขาสูสงคราม"
 CAN_defence_scheme_no_2:0 "แผนปองกันหมายเลข 2"
 CAN_defence_scheme_no_2_desc:0 "แผนปองกันหมายเลข 2 คือแผนฉุกเฉินของเราในกรณีเกิดสงครามในแปซิฟกระหวางสหรัฐอเมริกากับจักรวรรดิญี่ปุน ในอุดมคติเราจะวางตัวเปนกลางหากเกิดสงคราม แตไมวาสถานการณจะเปนอยางไร จะตองมีการปองกันที่แข็งแกรงบนชายฝงตะวันตกของเรา"
 CAN_supply_the_red_army:0 "สงเสบียงใหกองทัพแดง"
 CAN_supply_the_red_army_desc:0 "เมื่อสหภาพโซเวียตกําลังทําสงครามกับศัตรูของประชาชน แคนาดาควรชวยเหลือมอสโกดวยอาวุธและเสบียง"
 CAN_canada_united:1 "แคนาดาผนึกกําลัง"
 CAN_canada_united_desc:0 "แมประชากรของเราจะกระจายตัวเปนแนวบาง ๆ ทั่วทวีป แตเราก็รวมใจกันในวิกฤตโลกครั้งนี้เพื่อยืนหยัดในคานิยมของแคนาดาและปกปองผูออนแอ"
 CAN_join_comintern:0 "เขารวมโคมินเทิรน"
 CAN_join_comintern_desc:0 "สหภาพโซเวียตไดพิสูจนความจริงใจและความแข็งแกรงแลว แคนาดาควรเขารวมพันธมิตรโซเวียต"
 CAN_support_the_world_revolution:0 "สนับสนุนการปฏิวัติโลก"
 CAN_support_the_world_revolution_desc:0 "ไดยินเสียงประชาชนรองเพลงไหม? นั่นคือเพลงสากล! แคนาดาจะมุงปลดปลอยชนชั้นกรรมาชีพจากพันธนาการ"
 CAN_rcaf_station_borden:0 "สถานีกองทัพอากาศแคนาดาบอรเดน"
 CAN_rcaf_station_borden_desc:0 "กองบินของแคนาดาถือกําเนิดที่บอรเดน ออนแทรีโอ และฐานแหงนั้นควรใชฝกนักบินรุนใหม"
 CAN_we_have_the_hurricane:0 "เรามีเฮอรริเคน"
 CAN_we_have_the_hurricane_desc:0 "สหราชอาณาจักรไดอนุญาตใหเราสรางเครื่องบินขับไลเฮอรริเคน เครื่องบินเหลานี้จะเปนแกนหลักของกองบินเรา"
 CAN_the_pacific_coast_air_defence_radar_system:0 "ระบบเรดารปองกันภัยทางอากาศชายฝงแปซิฟก"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "ชายฝงบริติชโคลัมเบียเต็มไปดวยโขดหินและมีประชากรเบาบาง ยกเวนทางตอนใต เราจะตองพึ่งระบบเตือนภัยลวงหนา เชน เครือขายสถานีเรดาร เพื่อตรวจจับสิ่งผิดปกติที่ขามแปซิฟกมา"
 CAN_commonwealth_air_training_plan:0 "แผนการฝกบินแหงเครือจักรภพ"
 CAN_commonwealth_air_training_plan_desc:0 "การฝกรบทางอากาศจะประสานงานรวมกับพันธมิตรในเครือจักรภพและดินแดนในปกครอง ซึ่งมีประสิทธิภาพมากกวา และฝกไดครั้งละมาก ๆ อยางปลอดภัยที่สนามบินของเรา"
 CAN_fund_fairchilds_development:0 "ทุนพัฒนาแฟรไชลด"
 CAN_fund_fairchilds_development_desc:0 "โรงงานอากาศยานแฟรไชลดในควิเบกควรไดรับทรัพยากรที่จําเปนเพื่อเพิ่มการผลิตชิ้นสวนเครื่องบินทิ้งระเบิด เรานาจะเพิ่มการจางงานในโรงงานไดนับพันคน"
 CAN_cookie_carriers:0 "เครื่องบินขนคุกกี้"
 CAN_cookie_carriers_desc:0 "สงครามทางอากาศเชิงยุทธศาสตรตองการเครื่องบินทิ้งระเบิดหนักไวหยอนของอรอยใสศัตรู"
 CAN_the_sabre_project:0 "โครงการเซเบอร"
 CAN_the_sabre_project_desc:0 "อากาศยานไอพนจะครองทองฟาในอนาคต เราจึงควรลงทุนผลิตเครื่องบินไอพนของตางชาติในแบบฉบับของเราเอง"
 CAN_halifax_shipyards:0 "อูตอเรือแฮลิแฟกซ"
 CAN_halifax_shipyards_desc:0 "อูเรือแฮลิแฟกซซึ่งตั้งอยูในทําเลสะดวกฝงตรงขามยุโรปไดตอเรือใหมดวยความเร็วเปนประวัติการณ ยุทธนาวีแหงแอตแลนติกนั้นเอาชนะได"
 CAN_destroyer_effort:0 "มุงพัฒนาเรือพิฆาต"
 CAN_destroyer_effort_desc:0 "ภัยจากการโจมตีของเรือดํานํ้าตอขบวนเรือลําเลียงเสบียงและกําลังพลทําใหเราตองมุงสรางเรือพิฆาตเพื่อไลลาและทําลายภัยใตนํ้าเหลานี้"
 CAN_light_cruiser_effort:0 "มุงพัฒนาเรือลาดตระเวนเบา"
 CAN_light_cruiser_effort_desc:0 "เราไมมีวันสรางเรือหลักไดมากนัก แตเรือลาดตระเวนขนาดเล็กที่สรางขึ้นจํานวนมากก็ยังมีพลังทําลายลางไมนอย"
 CAN_heavy_cruiser_effort:0 "มุงพัฒนาเรือลาดตระเวนหนัก"
 CAN_heavy_cruiser_effort_desc:0 "เราสามารถสรางกองเรือโดยมีเรือลาดตระเวนหนักเปนแกน และเรามีทาเรือมากเกินพอที่จะทําใหยุทธศาสตรนี้เปนไปได"
 CAN_escort_fleet:0 "กองเรือคุมกัน"
 CAN_escort_fleet_desc:0 "มหาสมุทรแยกเราออกจากความวุนวายสวนใหญของโลก ดังนั้นหากกองทัพของเราจะไปรบและไดรับเสบียง เราตองใหความสําคัญกับหมูเรือคุมกันและการสงครามตอตานเรือดํานํ้า"
 CAN_fleet_in_being:0 "กองเรือคงอยู"
 CAN_fleet_in_being_desc:0 "ดวยการสรางกองกําลังทางเรือขนาดใหญ เพียงแคการมีอยูของมันก็เปนภัยคุกคามตอศัตรูได แมเราจะไมเคยนําออกปฏิบัติการเลย เพียงความคิดที่วาเรือของเราจะออกแลนไปโจมตีเสนทางเดินเรือของพวกเขาก็บีบใหพวกเขาตองระมัดระวัง"
 CAN_degauss_ship_hulls:0 "ลดอํานาจแมเหล็กตัวเรือ"
 CAN_degauss_ship_hulls_desc:0 "เราจะเริ่มลดอํานาจแมเหล็กของตัวเรือเพื่อลดรองรอยแมเหล็ก ซึ่งจะปกปองเรือจากทุนระเบิดแมเหล็กและลดการตรวจจับทางอิเล็กทรอนิกสของเรือ"
 CAN_trade_fleet:0 "กองเรือพาณิชย"
 CAN_trade_fleet_desc:0 "แคนาดาเปนชาติการคา จงสรางเรือสินคาและขบวนเรือลําเลียงเพิ่ม"
 CAN_united_shipyards:1 "ยูไนเต็ดชิปยารดส"
 CAN_united_shipyards_desc:0 "อูเรือมอนทรีออลของยูไนเต็ดชิปยารดสไดกลายเปนแหลงผลิตหลักของเรือยกพลขึ้นบกและเรือบรรทุกสินคาของเรา"
 CAN_mend_relations_with_the_trotskyites:0 "ฟนสัมพันธกับพวกทรอตสกี"
 CAN_mend_relations_with_the_trotskyites_desc:0 "รอยราวเกาในพรรคไดแบงแยกประชาชนของเรามานานเกินไป ถึงเวลาโอบรับผูถูกเนรเทศที่ครั้งหนึ่งเคยไวใจไดเหลานี้ และหลอมรวมเปาหมายของเราใหมในฐานะประภาคารที่แทจริงเพียงหนึ่งเดียวแหงเจตจํานงของประชาชน"
 CAN_trotsky_loves_us:0 "สหายรวมรบ"
 CAN_stalin_and_friends_hate_us_now:0 "ความระแวงผูเห็นตาง"
 CAN_reject_authoritarianism:0 "คอมมิวนิสตแบบพินิจตนเอง"
 CAN_reject_authoritarianism_desc:0 "เมื่อความขัดแยงและความแตกแยกรอบตัวเราเพิ่มขึ้น ก็เห็นไดชัดวาสภาพภูมิศาสตรและสังคมอันเปนเอกลักษณของเราทําใหเราหางเหินจากขบวนการสังคมนิยมที่กวางกวา และเปลือกนอกแหงอํานาจนิยมที่ลือกันวามาพรอมกับมัน ขบวนการของประชาชนตองเริ่มตนใหม โดยเริ่มที่เรา"
 CAN_reactivate_farmers_unity_league:0 "ฟนสันนิบาตเอกภาพเกษตรกร"
 CAN_reactivate_farmers_unity_league_desc:0 "สันนิบาตเอกภาพไดทํางานสําคัญในชวงกอนการปฏิวัติอันรุงโรจนของเรา บัดนี้ในยามที่เราจําเปนอยางยิ่ง เราตองเรียกผูภักดีในชนบทเหลานี้มาชวยรัฐทุกวิถีทางที่เปนไปได"
 CAN_liberate_the_workers_of_the_world:0 "จิตวิญญาณแหงการปฏิวัติแท"
 CAN_liberate_the_workers_of_the_world_desc:0 "ความเชื่อมั่นของเราในยูโทเปยที่เราสรางขึ้นนั้นแรงกลาเสียจนชายหญิงหนุมสาวของเราพากันมาชุมนุมใตธง เพื่อใหสหายผูถูกกดขี่ในตางแดน ซึ่งทนทุกขใตแอกของระบอบกดขี่ ไดลิ้มรสเสรีภาพแบบแคนาดาแท ๆ ของเราบาง"
 CAN_canadian_citizenship_act: "พระราชบัญญัติสัญชาติแคนาดา"
 CAN_canadian_citizenship_act_desc: "ในปจจุบัน การกําหนดวาใครเปนหรือไมเปนพลเมืองแคนาดาอิงตามกฎหมายอังกฤษ และพลเมืองแคนาดาก็ไมตางจากคนในบังคับอังกฤษ เราตองทําใหมั่นใจวาคนสัญชาติและพลเมืองแคนาดาจะไมถูกมองเปนเพียงชนชั้นยอยของสถานะคนในบังคับอังกฤษอีกตอไป"
 CAN_newfoundland_act: "พระราชบัญญัตินิวฟนดแลนด"
 CAN_newfoundland_act_desc: "ภูมิภาคนิวฟนดแลนดและแลบราดอรใกลชิดกับเราทั้งทางวัฒนธรรมและภูมิศาสตร แตยังคงอยูใตการปกครองของอังกฤษ ถึงเวลาแลวที่เราจะยื่นคําขอรวมดินแดนเหลานี้และชวยปกครอง"
 CAN_dominion_rifle_association: "สมาคมปนไรเฟลแหงดินแดนในปกครองแคนาดา"
 CAN_dominion_rifle_association_desc: "สมาคมปนไรเฟลแหงดินแดนในปกครองแคนาดากอตั้งในป 1868 และจดทะเบียนตามพระราชบัญญัติของรัฐสภาในป 1900 เราควรสนับสนุนการขยายองคกรนี้ เพื่อใหชายชาวแคนาดาไดเรียนรูการใชอาวุธปนมากขึ้น"
 SAF_support_axis_interests_effect_tt:0 "สราง§Yโครงสรางพื้นฐาน§!และเพิ่ม§Yชองกอสราง§!ในรัฐที่ยึดครองซึ่งตั้งอยูทางตอนใตและตอนกลางของแอฟริกา\n"
 SAF_a_king_for_our_people_trigger_tt:0 "พระเจาเอ็ดเวิรดถูกเนรเทศแลว"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "สาขาเหลานี้ไมสามารถเลือกรวมกันได"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "เลือกรวมกันไมไดกับ"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "แผนยุทธศาสตรนี้ยังไมมีผลในตอนนี้ การเปลี่ยนแปลงของสถานการณโลกอาจสงผลตอเรื่องนี้"
 SAF_war_measures_act:0 "พระราชบัญญัติมาตรการสงคราม"
 SAF_war_measures_act_desc:0 "เราไมอาจปลอยใหมีสิ่งใดขัดขวางความพยายามในสงคราม จึงออกกฎหมายใหมเพื่อบังคับใหทุกฝายปฏิบัติตามเปาหมายของรัฐบาลอยางเครงครัด ซึ่งจะปกปองการไหลเวียนของทรัพยากรและทําใหเรามุงพลังทางการเมืองไปยังจุดที่จําเปนได"
 SAF_emergency_workers:0 "แรงงานฉุกเฉิน"
 SAF_emergency_workers_desc:0 "ถึงเวลาระดมประชากรแอฟริกาใตเขาสูความพยายามในสงครามมากขึ้น อีกทั้งยังสามารถนําผูหญิงเขาทํางานในโรงงานดวยตนทุนที่ตํ่ากวาได"
 SAF_csir:0 "CSIR"
 SAF_csir_desc:0 "แอฟริกาใตลาหลังดินแดนในปกครองอื่น ๆ ดานวิทยาศาสตรและเทคโนโลยี การจัดตั้งสภาวิจัยวิทยาศาสตรและอุตสาหกรรมในพริทอเรียจึงกลายเปนเรื่องเรงดวนของรัฐบาล"
 SAF_cape_garrison_artillery:0 "ปนใหญกองรักษาการณแหลม"
 SAF_cape_garrison_artillery_desc:0 "แหลมกูดโฮปยังคงเปนเสนทางเดินเรือสําคัญของหลายชาติ และเปนประตูสูใจกลางแอฟริกาใต การขยายแนวปองกันชายฝงและปนใหญของกองรักษาการณควรเปนงานอันดับตนของเรา"
 SAF_reconstitute_the_cape_corps:0 "ฟนกองพลเคป"
 SAF_reconstitute_the_cape_corps_desc:0 "ในอดีต เราสามารถเกณฑประชากรผิวสีบางสวนมาชวยปองกันแอฟริกาใตได เรื่องนี้ไมเปนที่นิยมของทุกคนในประเทศ แตจะทําใหชาวแอฟริกาใตผิวขาวไดไปประจําการโพนทะเล"
 SAF_expand_the_cape_corps:0 "ขยายกองพลเคป"
 SAF_expand_the_cape_corps_desc:0 "แมเราจะฟนกองพลเคปขึ้นมาในฐานะกองกําลังที่ไมไดทําการรบเปนสวนใหญ แตภัยจากการรุกรานทําใหเราตองใหทรัพยากร การฝก และการเขาถึงอาวุธแกกองพลนี้มากขึ้น"
 SAF_work_for_all_poor:0 "งานสําหรับคนยากจนทุกคน"
 SAF_work_for_all_poor_desc:0 "ชาวแอฟริกันเนอรยากจนในชนบทไดหลั่งไหลเขาเมืองเพื่อหางานทํามาหลายป และเราแทบไมไดชวยเหลือพวกเขาเลย จนกระทั่งบัดนี้ การพัฒนาอุตสาหกรรมและการที่รัฐบาลคุมครองการเขาถึงงานจะชวยประชากรกลุมนี้ได"
 SAF_outlaw_strikes:0 "หามการนัดหยุดงาน"
 SAF_outlaw_strikes_desc:0 "การหยุดงานและการกอความวุนวายดานแรงงานถือเปนการไมรักชาติในยามวิกฤต การนัดหยุดงานถูกประกาศใหผิดกฎหมายนับจากนี้ และรัฐบาลจะบังคับใหประชาชนกลับไปทํางาน"
 SAF_support_the_policy_of_appeasement:0 "สนับสนุนนโยบายเอาใจ"
 SAF_support_the_policy_of_appeasement_desc:0 "เยอรมนีมีขอคับของใจที่ชอบธรรม และดินแดนในปกครองตางทนทุกขอยางหนักในสงครามครั้งกอน เราควรฉวยทุกโอกาสเพื่อสันติภาพในยุคของเรา"
 SAF_police_windhoek:0 "ตรึงกําลังที่วินดฮุก"
 SAF_police_windhoek_desc:0 "เราไดรับอาณัติเหนืออดีตอาณานิคมเยอรมันแหงแอฟริกาตะวันตกเฉียงใตนับตั้งแตสงครามครั้งกอนสิ้นสุด สิ่งสําคัญยิ่งคือเราตองทําหนาที่รักษาความปลอดภัยและพัฒนาเมืองใหญอยางวินดฮุก"
 SAF_joint_air_training_scheme:0 "โครงการฝกบินรวม"
 SAF_joint_air_training_scheme_desc:0 "ชาติในเครือจักรภพกําลังรวมทรัพยากรและประสบการณเพื่ออํานวยความสะดวกและเรงการฝกนักบินและลูกเรืออากาศยาน"
 SAF_desert_equipment:0 "ยุทโธปกรณทะเลทราย"
 SAF_desert_equipment_desc:0 "สงครามในแอฟริกาเหนือตองใชยุทโธปกรณเฉพาะทาง และเนื่องจากกองกําลังของเราอาจถูกเรียกไปประจําการในแนวรบนั้น การจัดหาและสงยุทโธปกรณดังกลาวจะกลายเปนเรื่องสําคัญดานการสงกําลังบํารุง"
 SAF_suppress_the_stormjaers:0 "ปราบปรามสตอรมแยรส"
 SAF_suppress_the_stormjaers_desc:0 "ออสเซวาบรันดวัค (OB) กลุมฟาสซิสตฝกใฝเยอรมนี มีกองกําลังกึ่งทหารที่เลียนแบบกลุมคลายกันในยุโรป พวกเขากําลังขัดขวางความพยายามของรัฐบาลในการเกณฑทหารและดําเนินนโยบายสงครามที่มั่นคงและเปนเอกภาพ สตอรมแยรสตองถูกสลายไป"
 SAF_secure_interests_in_africa:0 "รักษาผลประโยชนในแอฟริกา"
 SAF_secure_interests_in_africa_desc:0 "สหภาพแอฟริกาใตมีพรมแดนติดกับอาณานิคมอังกฤษหลายแหงที่อาจมอบใหเราบริหารได เราควรทําทุกอยางที่ทําไดเพื่อรักษาอาณัติเหนือแอฟริกาตะวันตกเฉียงใตไวอยางถาวรดวย"
 SAF_native_laws_amendment_act:0 "พระราชบัญญัติแกไขกฎหมายชนพื้นเมือง"
 SAF_native_laws_amendment_act_desc:0 "เพื่อรับประกันงานใหประชากรแอฟริกันเนอรมากยิ่งขึ้น เราตองจํากัดการตั้งถิ่นฐานของชาวแอฟริกาใตผิวดําในเมือง มีเพียงผูที่อาศัยอยูในเขตเทศบาลมายาวนานเทานั้นที่จะไดสิทธิ์พํานัก"
 SAF_encourage_segregation:0 "สงเสริมการแบงแยก"
 SAF_encourage_segregation_desc:0 "เราควรผลักดันการแบงแยกประชากรตางชาติพันธุทางกฎหมายใหหนักขึ้น เพื่อสงเสริมอํานาจและเอกภาพของชนชั้นปกครอง"
 SAF_abandon_westminster:0 "ละทิ้งระบบเวสตมินสเตอร"
 SAF_abandon_westminster_desc:0 "การที่เสนทางสุเอซเขามาแทนที่เสนทางแหลมกูดโฮป ประกอบกับประสบการณหลอหลอมจากสงครามบัวร ไดชวยสรางอัตลักษณแอฟริกาใตที่แตกตางจากพันธมิตรดินแดนในปกครองอื่น เราควรถอยหางจากพระมหากษัตริยและสรางเสนทางของเราเอง"
 SAF_support_the_afrikaner_broederbond:0 "สนับสนุนอาฟรีกาเนอรบรูเดอรบอนด"
 SAF_support_the_afrikaner_broederbond_desc:0 "อาฟรีกาเนอรบรูเดอรบอนดไดเคลื่อนไหวเรียกรองใหชาวแอฟริกันเนอรมีเสียงมากขึ้นและใหแบงแยกเชื้อชาติเขมงวดขึ้น ความทรงจําตอนโยบายของอังกฤษในสงครามบัวรยังคงฝงแนน และบรูเดอรบอนดสามารถชวยสรางแอฟริกาใตใหมได"
 SAF_support_ossewabrandwag:0 "สนับสนุนออสเซวาบรันดวัค"
 SAF_support_ossewabrandwag_desc:0 "กองกําลังกึ่งทหารฟาสซิสตออสเซวาบรันดวัคควรใชเปนปราการตานการปลุกปนจากตางชาติและการลุกฮือภายในที่มุงเปาไปยังชนชั้นปกครองของเรา"
 SAF_celebrate_the_great_trek:0 "เฉลิมฉลองการเดินทางครั้งใหญ"
 SAF_celebrate_the_great_trek_desc:0 "เมื่อหนึ่งศตวรรษกอน บรรพบุรุษชาวแอฟริกันเนอรของเราไดแยกตัวจากอํานาจอาณานิคมอังกฤษที่กําลังรุงเรือง และสรางชาติบัวรของตนเองทางตะวันออกเฉียงเหนือ จิตวิญญาณอันทรหดของพวกเขายังคงเปนตัวแทนของคุณธรรมที่ดีที่สุดของแอฟริกาใต"
 SAF_voortrekker_monument:0 "อนุสาวรียโฟรเทรกเกอร"
 SAF_voortrekker_monument_desc:0 "อนุสาวรียแดชาวโฟรเทรกเกอรผูรวมการเดินทางครั้งใหญจะเสริมสรางจิตวิญญาณแหงชาติและเอกภาพในยามยากลําบากนี้"
 SAF_support_nazification_of_south_west_africa:0 "สนับสนุนการทําใหแอฟริกาตะวันตกเฉียงใตเปนนาซี"
 SAF_support_nazification_of_south_west_africa_desc:0 "ในฐานะอดีตอาณานิคมเยอรมัน จึงสมควรอยางยิ่งที่เราจะสงเสริมการเติบโตของแนวคิดทางการเมืองแบบเยอรมันในแอฟริกาตะวันตกเฉียงใต"
 SAF_south_africa_first:0 "แอฟริกาใตตองมากอน"
 SAF_south_africa_first_desc:0 "แอฟริกาใตเปนชาติเอกราชที่แข็งแกรงที่สุดในทวีป จึงสามารถเปนหลักชี้นําอนาคตของแอฟริกาและอดีตอาณานิคมทั้งหลายได"
 SAF_support_the_german_coup:0 "สนับสนุนรัฐประหารฝกใฝเยอรมนี"
 SAF_support_the_german_coup_desc:0 "รัฐบาลเยอรมันมองแอฟริกาใตเปนดินแดนอันอุดมสําหรับการขยายอิทธิพลมานาน ยอนไปตั้งแตศตวรรษกอน อนาคตของเราอยูกับไรช ไมใชจักรวรรดิ ดังนั้นมาเดินหนาแผนโคนลมรัฐบาลปจจุบันกันเถอะ"
 SAF_reclaim_boer_colonies:0 "ทวงคืนอาณานิคมบัวร"
 SAF_reclaim_boer_colonies_desc:0 "ดินแดนทรานสวาลซึ่งเคยเปนของชาวบัวรและภูมิภาคอื่น ๆ ยอมเปนของทายาทผูเปนอิสระของชนชาติผูบุกเบิกนั้นโดยชอบธรรม"
 SAF_commemorate_the_battle_of_blood_river:0 "รําลึกยุทธการแมนํ้าเลือด"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "ในป 1838 คายเกวียนลอมวงของผูตั้งถิ่นฐานชาวบัวรไดตานทานนักรบซูลูนับหมื่น และสรางความเสียหายรายแรงตออํานาจของซูลูในนาตาล นี่ยอมเปนสัญญาณจากสวรรควาอุดมการณของเราถูกตอง"
 SAF_german_scientists:0 "นักวิทยาศาสตรเยอรมัน"
 SAF_german_scientists_desc:0 "นักวิทยาศาสตรเยอรมันเปนหนึ่งในกลุมที่เกงที่สุดในโลก และมีความรูมากมายที่จะแบงปนกับเรา"
 SAF_support_axis_interests:0 "สนับสนุนผลประโยชนของฝายอักษะ"
 SAF_support_axis_interests_desc:0 "ฝายอักษะมีพลังและอุดมการณที่ชวยใหแอฟริกาใตสรางที่ยืนบนเวทีโลกได เราควรใหการสนับสนุนทางการทูตแกพวกเขาอยางเต็มที่"
 SAF_a_king_for_our_people:0 "กษัตริยเพื่อประชาชนของเรา"
 SAF_a_king_for_our_people_desc:0 "แอฟริกาใตควรมีกษัตริย และโชคดีที่มีวินดเซอรคนหนึ่งที่ยังไมมีใครใชงานอยูในตอนนี้ อดีตพระเจาเอ็ดเวิรดที่ 8 ดยุกแหงวินดเซอร สามารถประทับบนบัลลังกของเราได"
 SAF_empower_the_workers:0 "เสริมอํานาจใหผูใชแรงงาน"
 SAF_empower_the_workers_desc:0 "เราเปนประเทศของคนงานเหมืองและเกษตรกร ประชาชนผูใชแรงงานแหงแอฟริกาใตคือตัวแทนที่แทจริงเพียงหนึ่งเดียวของเจตจํานงแหงชาติ"
 SAF_support_spain:0 "สนับสนุนสเปน"
 SAF_support_spain_desc:0 "ลัทธิฟาสซิสตกําลังรุงเรืองในยุโรป และเราหยุดยั้งมันไดในสเปน หรืออยางนอยก็ชะลอการแพรกระจาย ควรสงกําลังพลและยุทโธปกรณไปสนับสนุนฝายสาธารณรัฐ"
 SAF_repeal_the_native_representation_act:0 "ยกเลิกพระราชบัญญัติผูแทนชนพื้นเมือง"
 SAF_repeal_the_native_representation_act_desc:0 "การเลือกปฏิบัติทางเชื้อชาติขัดกับคุณคาแหงการปฏิวัติของประชาชนในแอฟริกาใต คนผิวดําควรไดกลับคืนสูทะเบียนผูมีสิทธิเลือกตั้งทั่วไปและไดรับสิทธิทางการเมือง"
 SAF_burn_the_kings_portraits:0 "เผาพระบรมฉายาลักษณ"
 SAF_burn_the_kings_portraits_desc:0 "โคนราชวงศ! การกระทําเชิงสัญลักษณนี้จะประกาศตอสาธารณะวาเราตัดขาดจากบัลลังกตางชาติ"
 SAF_join_comintern:0 "เขารวมโคมินเทิรน"
 SAF_join_comintern_desc:0 "สหภาพโซเวียตอยูแนวหนาของสงครามครูเสดเพื่อผูใชแรงงานและตอตานฟาสซิสต เราจะเขารวมพันธมิตรอันเกรียงไกรของพวกเขา"
 SAF_support_the_world_revolution:0 "สนับสนุนการปฏิวัติโลก"
 SAF_support_the_world_revolution_desc:0 "หนทางเดียวที่ผูใชแรงงานจะไดชัยคือการรวมทั้งโลกเขาเปนความพยายามหนึ่งเดียว การปฏิวัติตองเปนสากล และดวยเหตุนี้จึงตองถูกสงออกไป"
 SAF_equal_opportunity_employment:0 "การจางงานอยางเทาเทียม"
 SAF_equal_opportunity_employment_desc:0 "หากเราจะยกระดับชีวิตผูใชแรงงานในชาติของเรา เราตองเริ่มจากการทําใหมั่นใจวาผูใชแรงงานทุกคนไดรับการปฏิบัติอยางเทาเทียม ไมวาจะมีสีผิวใด"
 SAF_demand_madagascar:0 "เรียกรองมาดากัสการ"
 SAF_demand_madagascar_desc:1 "ดวยการเปลี่ยนแปลงครั้งใหญของสถานการณในยุโรป ถึงเวลาทบทวนระบบอาณานิคมทั้งหมด เหตุใดมาดากัสการจึงตองถูกลามไวกับจักรวรรดิที่กําลังลมสลาย?"
 SAF_invite_soviet_advisers:0 "เชิญที่ปรึกษาโซเวียต"
 SAF_invite_soviet_advisers_desc:4 "หากเราจะสนับสนุนสหภาพโซเวียตในการตอสูเพื่อนําเสรีภาพมาสูผูใชแรงงานทั่วโลก เราตองพัฒนากองทัพดวยการเรียนรูจากพวกเขา"
 SAF_south_african_soviet_research_treaty:0 "สนธิสัญญาวิจัยกับสหภาพโซเวียต"
 SAF_south_african_soviet_research_treaty_desc:1 "หลังจากไดเรียนรูบทเรียนอันมีคามากมายจากมิตรโซเวียต ถึงเวลากระชับความสัมพันธและลงนามในสนธิสัญญาอยางเปนทางการ"
 SAF_anti_colonialist_crusade:0 "สงครามครูเสดตอตานลัทธิอาณานิคม"
 SAF_anti_colonialist_crusade_desc:1 "ลัทธิอาณานิคมอยูใจกลางระบบจักรวรรดินิยมที่กดขี่ผูใชแรงงานทั่วโลก เราอยูในฐานะพิเศษที่จะทลายระบบนั้นและปลดปลอยชาวแอฟริกาจากการขูดรีดที่พวกเขาตองทนมาหลายศตวรรษ"
 SAF_Union_of_the_African_People:0 "สหภาพประชาชนแอฟริกา"
 SAF_Union_of_the_African_People_desc:1 "ชาวแอฟริกาไมมีสิทธิ์มีเสียงในการกําหนดชะตากรรมของตนเองมาชานาน วันเวลาเหลานั้นจบสิ้นแลว เราจะสรางฝายที่แข็งแกรงพอจะตานทานทุกความพยายามของมหาอํานาจผูหมายทวงคืนดินแดนที่จะทําลายความสําเร็จของเรา แอฟริกาจะเปนอิสระจากลัทธิอาณานิคม"
 SAF_liberate_portugese:0 "ปลดปลอยอาณานิคมโปรตุเกส"
 SAF_liberate_portugese_desc:1 "อาณานิคมแองโกลาและโมซัมบิกตั้งอยูติดพรมแดนของเรา ถึงเวลายุติการขูดรีดประชาชนของพวกเขา"
 SAF_liberate_british:0 "ปลดปลอยอาณานิคมอังกฤษ"
 SAF_liberate_british_desc:1 "จักรวรรดิบริติชเปนตัวอยางของลัทธิอาณานิคมที่ฉาวโฉที่สุดในประวัติศาสตร เราจะยุติมัน"
 SAF_liberate_belgian:0 "ปลดปลอยอาณานิคมเบลเยียม"
 SAF_liberate_belgian_desc:1 "เบลเยียมคองโกเปนที่รูจักกันทั่วไปวาเปนหนึ่งในเรื่องราวการขูดรีดและการกดขี่ที่โหดรายที่สุด เราจะเขียนบทสุดทายของเรื่องราวนั้น"
 SAF_south_african_railways:0 "การรถไฟแอฟริกาใต"
 SAF_south_african_railways_desc:0 "บริษัทการรถไฟแอฟริกาใตจําเปนตองขยายตัว เยาวชนสามารถเขารับการฝกที่นั่น และไดรับทักษะที่จําเปนทั้งสําหรับทํางานในประเทศและไปประจําการโพนทะเล"
 SAF_expand_the_mining_industry:0 "ขยายอุตสาหกรรมเหมืองแร"
 SAF_expand_the_mining_industry_desc:0 "ความมั่งคั่งทางแรธาตุของแอฟริกาใตเปนตํานาน และเราเพิ่งเริ่มขุดแหลงสํารองทองคํา โครเมียม และแพลทินัมอันลึกลํ้าเทานั้น"
 SAF_heavy_engineering:0 "วิศวกรรมหนัก"
 SAF_heavy_engineering_desc:0 "สิ่งสําคัญคือแอฟริกาใตตองกาวทันเทคนิควิศวกรรมลาสุด แมฐานอุตสาหกรรมของเราจะเล็ก แตเราควรลงทุนในเครื่องจักรกลหนักและวิศวกรรมเพื่อไลตามชาติอื่นใหทันอยางรวดเร็ว"
 SAF_infrastructure_effort:0 "มุงพัฒนาโครงสรางพื้นฐาน"
 SAF_infrastructure_effort_desc:0 "พื้นที่สวนใหญของแอฟริกาใตยังคงเปนชนบทและไมไดรับการพัฒนา ถนนและทางรถไฟที่มากขึ้นจะนําความมั่งคั่งทางธรรมชาติของประเทศไปสูทาเรือที่หิวกระหาย"
 SAF_armament_effort:0 "มุงพัฒนาอาวุธยุทโธปกรณ"
 SAF_armament_effort_desc:0 "แอฟริกาใตปลอดภัยจากการรุกรานของมหาอํานาจตางชาติใด ๆ แตก็อยูหางไกลจากพันธมิตร จึงจําเปนอยางยิ่งที่ตองพัฒนาอุตสาหกรรมอาวุธของตนเอง เพื่อไมใหสหภาพไรการปองกัน"
 SAF_south_african_steel:0 "เหล็กกลาแอฟริกาใต"
 SAF_south_african_steel_desc:0 "เรามีถานหินและเหล็ก บัดนี้เรามีเหตุผลแลว การขยายโรงงานเหล็กกลา Iscor ในพริทอเรียจะทําใหประเทศมีแผนเหล็กกลาหนักที่จําเปนสําหรับอาวุธสมัยใหม"
 SAF_pretoria_arms:0 "คลังอาวุธพริทอเรีย"
 SAF_pretoria_arms_desc:0 "โรงงานเหล็กกลาที่มีอยูในพริทอเรียมุงผลิตแผนเหล็กหนัก แตดวยเครื่องมือกลบางอยาง เราสามารถเปลี่ยนโรงงานบางสวนใหเปนศูนยผลิตอาวุธเบาได"
 SAF_expand_the_rand_mines:0 "ขยายเหมืองแรนด"
 SAF_expand_the_rand_mines_desc:0 "เหมืองแรนดเปนหนึ่งในเหมืองทองคําที่ลึกที่สุดในโลก ทั้งที่ใชเทคโนโลยีแหงศตวรรษที่ 19 ตอนนี้เราทําไดมากกวานั้นมาก ขุดใหลึก! และขุดอยางตะกละตะกลามไปเลย"
 SAF_fund_the_university_of_south_africa:0 "ทุนมหาวิทยาลัยแอฟริกาใต"
 SAF_fund_the_university_of_south_africa_desc:0 "มหาวิทยาลัยแอฟริกาใตในพริทอเรียเปนหนึ่งในมหาวิทยาลัยที่ดีที่สุดในทวีป หรือแมแตในซีกโลกใต การลงทุนในมหาวิทยาลัยแหงนี้จะชวยใหเราบมเพาะคนเกงในทองถิ่นไดเอง แทนที่จะสงคนหนุมสาวไปตางประเทศ"
 SAF_establish_the_atomics_energy_board:0 "จัดตั้งคณะกรรมการพลังงานปรมาณู"
 SAF_establish_the_atomics_energy_board_desc:0 "อาวุธปรมาณูจะเปนการกาวกระโดดทางทหารครั้งยิ่งใหญที่สุดนับตั้งแตดินปน ยังไมตองพูดถึงการใชพลังนี้ในทางสันติหากเราควบคุมอะตอมได จงรวบรวมนักวิทยาศาสตรชั้นนําของเรามาศึกษาเรื่องนี้"
 SAF_the_cape_defense_institute:0 "สถาบันกลาโหมเคป"
 SAF_the_cape_defense_institute_desc:0 "เมื่อแอฟริกาใตเปนชาติอธิปไตยโดยสมบูรณแลว เราจึงไมไดเขาถึงตนแบบและพิมพเขียวขั้นสูงเหมือนที่เคยไดรับ เราตองทําใหมั่นใจวาเราจะนําหนาศัตรูเสมอ และไมลาหลังดานเทคโนโลยี"
 SAF_defense_collaboration_initiative:0 "ริเริ่มความรวมมือดานกลาโหม"
 SAF_defense_collaboration_initiative_desc:0 "อังกฤษไดแสดงใหเราเห็นถึงขอดีของการแบงปนความกาวหนาทางวิทยาศาสตรระหวางพันธมิตรใกลชิด ฝายของเราทั้งหมดจะวิจัยและพัฒนาในยามสงครามไดอยางมีประสิทธิภาพยิ่งขึ้น หากเราดําเนินการที่จําเปนเพื่อประสานงานเรื่องนี้"
 SAF_special_service_battalion:0 "กองพันบริการพิเศษ"
 SAF_special_service_battalion_desc:0 "แอฟริกาใตเต็มไปดวยชายหนุมวางงานที่ตองหาอะไรที่เปนประโยชนทํา กองพันบริการพิเศษจะปลูกฝงวินัยและการจัดระเบียบที่จําเปนอยางยิ่ง"
 SAF_improve_the_three_oh_three:0 "ปรับปรุงสามศูนยสาม"
 SAF_improve_the_three_oh_three_desc:0 "ทหารแอฟริกาใตจะตองรบในสภาพอากาศที่หลากหลาย และเราโชคดีที่ปนไรเฟลลี-เอนฟลดดัดแปลงไดงาย กระสุน .303 ไดรับการดัดแปลงหลายครั้งโดยประเทศอื่นเพื่อใหเหมาะกับความตองการของตน"
 SAF_q_services_corps:0 "เหลาบริการ Q"
 SAF_q_services_corps_desc:0 "เหลาบริการ Q จะเปนหนวยงานกลางที่รับผิดชอบการสงกําลังบํารุงและเสบียงของกองทัพประจําการ โดยดูแลการแจกจายนํ้ามัน เสบียงอาหาร กระสุน และเครื่องแบบ"
 SAF__south_african_military_college:0 "วิทยาลัยการทหารแอฟริกาใต"
 SAF__south_african_military_college_desc:0 "แอฟริกาใตควรมีโรงเรียนนายรอยตามแบบเวสตพอยตของสหรัฐอเมริกา ซึ่งจะทําใหเรามีเหลานายทหารอาชีพที่ภักดีตอสหภาพ"
 SAF_expand_the_south_african_artillery:0 "ขยายกองปนใหญแอฟริกาใต"
 SAF_expand_the_south_african_artillery_desc:0 "เหลาทหารปนใหญไดรวมเปนหนึ่งเดียวในป 1934 บัดนี้ถึงเวลาเพิ่มขนาดและขีดความสามารถ"
 SAF_sa_engineer_corps:0 "เหลาทหารชางแอฟริกาใต"
 SAF_sa_engineer_corps_desc:0 "เหลาทหารชางแอฟริกาใตมีกําลังพลในเครื่องแบบเพียงราว 600 นาย ซึ่งรับไมไดสําหรับกองทัพสมัยใหม เราตองการกําลังพลและการฝกมากขึ้นสําหรับภารกิจสําคัญนี้"
 SAF_equipment_effort:0 "มุงพัฒนายุทโธปกรณ"
 SAF_equipment_effort_desc:0 "เราไมอาจละเลยการจัดหายุทโธปกรณสนับสนุนที่กองทัพตองการ ปนและรถถังก็ดีอยู แตเรายังตองการเครื่องแบบ วิทยุ ชุดซอมบํารุง และอื่น ๆ อีกมาก"
 SAF_south_african_special_forces:0 "หนวยรบพิเศษแอฟริกาใต"
 SAF_south_african_special_forces_desc:0 "แอฟริกาใตตองการหนวยคอมมานโดของตนเองเพื่อจัดการงานยากในพื้นที่ที่เขาถึงไดลําบาก"
 SAF_mechanization_effort:0 "มุงพัฒนายานเกราะลําเลียงพล"
 SAF_mechanization_effort_desc:0 "สงครามยานยนตและยานเกราะลําเลียงพลมาถึงแลว การเดินทางครั้งใหญแหงอนาคตจะนําทางโดยยานพาหนะทั้งแบบสายพานและแบบลอ"
 SAF_armor_effort:0 "มุงพัฒนายานเกราะ"
 SAF_armor_effort_desc:0 "รถถังพัฒนามาไกลจากสัตวรายเชื่องชาในสงครามครั้งกอน การวิจัยและการฝกของเราจะลาหลังศัตรูหรือแมแตมิตรไมได"
 SAF_commit_to_the_five_year_plan:0 "มุงมั่นตอแผนหาป"
 SAF_commit_to_the_five_year_plan_desc:0 "เราไดจัดทําแผนหาปเพื่อปรับปรุงและขยายกองทัพอากาศแอฟริกาใตใหทันสมัย รัฐบาลตองประกาศตอสาธารณะวาจะไมลาชากวากําหนดการนี้"
 SAF_improve_the_hawker_hartbees:0 "ปรับปรุงฮอวกเกอรฮารตบีส"
 SAF_improve_the_hawker_hartbees_desc:0 "ฮอวกเกอรฮารตบีสที่เรามีไมใชเครื่องบินขับไลที่กาวหนาที่สุดในโลก แตเราจะใชไปพลางกอน การปรับปรุงกลไกและการฝกจะดึงศักยภาพสูงสุดจากเครื่องบินปกสองชั้นเหลานี้ออกมา"
 SAF_replace_the_blenheim:0 "ทดแทนเบลนิม"
 SAF_replace_the_blenheim_desc:0 "บริสตอลเบลนิมเปนเครื่องบินทิ้งระเบิดเบาที่ใชงานไดดีของ RAF และดินแดนในปกครอง แตอาจถึงเวลาหาเครื่องบินที่ทนทานกวาและมีพิสัยไกลกวา"
 SAF_perfect_the_cab_rank_technique:0 "ฝกเทคนิค "แถวรถแท็กซี่" ใหสมบูรณ"
 SAF_perfect_the_cab_rank_technique_desc:0 "เทคนิค "แถวรถแท็กซี่" ใหเครื่องบินทิ้งระเบิดหลายลําโจมตีเปาหมายทีละลําเรียงเปนแถวยาว ซึ่งชวยรักษาแรงกดดันตอขาศึก แตตองใชทักษะสูงมาก"
 SAF_desert_air_force:0 "กองทัพอากาศทะเลทราย"
 SAF_desert_air_force_desc:0 "ทองฟาเหนือทะเลทรายนั้นโปรงใส แตความรอนและทรายหมายถึงตองใสใจกลไกของอากาศยานเปนพิเศษ มีทักษะอันมีคามากมายใหเรียนรูในสภาพแวดลอมอันโหดรายนี้"
 SAF_secure_the_cape_sea_route:0 "รักษาเสนทางเดินเรือแหลมกูดโฮป"
 SAF_secure_the_cape_sea_route_desc:0 "หากสุเอซแตก แหลมกูดโฮปจะกลับมาเปนประตูสูตะวันออกอีกครั้ง จงปกปองมันไมวาตองแลกดวยอะไร"
 SAF_retain_experienced_pilots:0 "รักษานักบินผูมีประสบการณ"
 SAF_retain_experienced_pilots_desc:0 "บอยครั้งที่นักบินผูมีประสบการณของเรายายไปอยู RAF แทนที่จะอยูกับกองทัพของเรา RAF มีโอกาสกาวหนาและไดรบมากกวา แตเราควรพยายามรักษานักบินที่ผานการฝกไวใกลบาน ซึ่งพวกเขาจะสรางแรงบันดาลใจและใหความรูแกชาวแอฟริกาใตคนอื่น ๆ ได"
 SAF_seaward_defence_force:0 "กองกําลังปองกันทางทะเล"
 SAF_seaward_defence_force_desc:0 "กองกําลังปองกันทางทะเลทําหนาที่เปนกองทัพเรือของเรามาสองทศวรรษ ควรเพิ่มงบประมาณให"
 SAF_protect_the_trade:0 "ปกปองการคา"
 SAF_protect_the_trade_desc:0 "สงครามครั้งกอนแสดงใหเห็นถึงความสําคัญของขบวนเรือลําเลียงและเรือคุมกัน แอฟริกาใตตั้งอยูบนเสนทางการคาสําคัญ และควรทําใหมั่นใจวาสินคาจะไปถึงจุดหมาย"
 SAF_disrupt_the_trade:0 "ขัดขวางการคา"
 SAF_disrupt_the_trade_desc:0 "สงครามครั้งกอนแสดงใหเห็นถึงความสําคัญของขบวนเรือลําเลียงและเรือคุมกัน แอฟริกาใตตั้งอยูบนเสนทางการคาสําคัญ และอยูในทําเลที่เหมาะอยางยิ่งในการสกัดกั้นและทําลายการขนสงทางเรือของขาศึก"
 SAF_expand_the_simons_town_base:0 "ขยายฐานทัพไซมอนสทาวน"
 SAF_expand_the_simons_town_base_desc:0 "ไซมอนสทาวนบนแหลมกูดโฮปเปนฐานทัพเรือที่สําคัญที่สุดในแอฟริกาตอนใตมาตั้งแตทศวรรษ 1790 ควรไดรับการปรับปรุงและขยายเพื่อรองรับเรือที่มากขึ้นและใหญขึ้น"
 SAF_anti_submarine_tactics:0 "ยุทธวิธีตอตานเรือดํานํ้า"
 SAF_anti_submarine_tactics_desc:0 "เรือดํานํ้าคุกคามเรือที่แลนผานแหลมกูดโฮป เราตองคนหาและทําลายพวกมัน"
 SAF_submarine_warfare:0 "การสงครามเรือดํานํ้า"
 SAF_submarine_warfare_desc:0 "ขบวนเรือสินคาของขาศึกยังคงใชเสนทางผานแหลมกูดโฮป เราจะโจมตีพวกมันจากใตนํ้า"
 SAF_prepare_overseas_offensive:0 "เตรียมการรุกโพนทะเล"
 SAF_prepare_overseas_offensive_desc:0 "ดวยแนวชายฝงยาวหลายไมล แอฟริกาใตจึงเหมาะแกการฝกทหารในการสงครามสะเทินนํ้าสะเทินบก นี่เปนหนึ่งในทักษะที่ยากที่สุด แตหนุม ๆ ของเรารับมือได"
 SAF_strengthen_the_cape_garrison_artillery:0 "เสริมกําลังปนใหญกองรักษาการณแหลม"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "ปนของกองรักษาการณแหลมตองไดรับการยกระดับและเพิ่มจํานวนเพื่อปกปองแหลมกูดโฮปจากการโจมตีของขาศึก"
 SAF_civil_war_tt:1 "§Rสงครามกลางเมืองจะปะทุขึ้น§!ระหวาง§Yฝายชาตินิยมฟาสซิสต§!ในแอฟริกาตะวันตกเฉียงใตกับ§Yฝายสหภาพนิยมประชาธิปไตย§!ในสวนที่เหลือของประเทศ"
 SAF_german_research_tt:0 "เราจะเขารวมขอตกลงแบงปนเทคโนโลยีกับเยอรมนี"
 scw_in_progress_tt:0 "สเปนอยูในภาวะสงครามกลางเมือง"
 NZL_transfer_the_new_zealand_division:0 "สงกองพลนิวซีแลนดไปประจําการ"
 NZL_transfer_the_new_zealand_division_desc:0 "กองพลนิวซีแลนดที่ 2 ไดรับการระดมพลพรอมปฏิบัติการแลว เราจึงควรสงไปยังที่ที่มีการสูรบ กองพลนิวซีแลนดในมหาสงครามเคยขึ้นกับแนวรบเมดิเตอรเรเนียน และกองพลใหมก็จะเปนเชนนั้น"
 NZL_form_the_rnzn:0 "กอตั้งกองทัพเรือนิวซีแลนด"
 NZL_form_the_rnzn_desc:0 "หนวยลาดตระเวนชายฝงที่เคยเล็กของเราไดเติบโตจนมีเรือที่ปฏิบัติการไดอยางอิสระโดยไมตองอยูใตการกํากับของราชนาวีอังกฤษ นิวซีแลนดจะมีกองทัพเรือของตนเอง"
 NZL_expand_devonport_naval_base:0 "ขยายฐานทัพเรือเดวอนพอรต"
 NZL_expand_devonport_naval_base_desc:0 "ฐานทัพเรือเดวอนพอรตจะเปนกองบัญชาการของกองทัพเรือเรา แตตองไดรับการขยายเพื่อตอบสนองความตองการใหมของสงครามเบ็ดเสร็จ"
 NZL_purchase_old_ships: "$SMB_purchase_destroyers_and_subs$"
 NZL_purchase_old_ships_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 NZL_coastal_defense:0 "การปองกันชายฝง"
 NZL_coastal_defense_desc:0 "นิวซีแลนดเปนชาติหมูเกาะที่อยูหางไกลจากศัตรู ดังนั้นเราตองเตรียมพรอมรับการโจมตีสะเทินนํ้าสะเทินบกตามแนวชายฝง"
 NZL_destroyer_effort:0 "มุงพัฒนาเรือพิฆาต"
 NZL_destroyer_effort_desc:0 "ดวยฐานอุตสาหกรรมที่เล็ก เรือพิฆาตคือวิธีที่มีประสิทธิภาพที่สุดสําหรับนิวซีแลนดในการแผแสนยานุภาพทางเรือ ใชลาดตระเวนชายฝง สกัดกั้นเรือดํานํ้า และตั้งแนวเตือนภัยลวงหนา"
 NZL_submarine_effort:0 "มุงพัฒนาเรือดํานํ้า"
 NZL_submarine_effort_desc:0 "เนื่องจากการรุกรานใด ๆ จะตองมาทางทะเล หมาปาแหงมหาสมุทรจึงเปนแนวปองกันที่แข็งแกรงได ดวยการลอบเรนและลาเปนฝูง กองเรือดํานํ้าสามารถปกปองเสนทางเดินเรือของเรา"
 NZL_light_cruiser_effort:0 "มุงพัฒนาเรือลาดตระเวนเบา"
 NZL_light_cruiser_effort_desc:0 "เรือขนาดกลางเหมาะกับมหาอํานาจขนาดกลาง เรือลาดตระเวนเบามีอานุภาพไมนอย แตก็มีความเร็วพอจะหลบหนีจากการปะทะครั้งใหญไดหากจําเปน"
 NZL_capital_ship_effort:0 "มุงพัฒนาเรือหลัก"
 NZL_capital_ship_effort_desc:0 "หากนิวซีแลนดจะมีกองทัพเรือชั้นหนึ่ง ก็ตองมีเรือชั้นหนึ่ง เราตองลงทุนในเรือประจัญบานและเรือลาดตระเวนหนัก"
 NZL_expand_the_nzpaf:0 "ขยายกองทัพอากาศประจําการนิวซีแลนด"
 NZL_expand_the_nzpaf_desc:0 "กองทัพอากาศประจําการนิวซีแลนดตองการเครื่องบินลาดตระเวนชายฝงและเครื่องบินทิ้งระเบิดทางทะเลลําใหม ชาติสมัยใหมไมอาจละเลยสงครามทางอากาศได"
 NZL_form_the_rnzaf:0 "จัดตั้งกองทัพอากาศแหงราชนาวีนิวซีแลนด"
 NZL_form_the_rnzaf_desc:0 "ถึงเวลาแลวที่จะแยกกองทัพอากาศใหเปนอิสระจากเหลาทัพอื่น ๆ กองทัพอากาศแหงนิวซีแลนดจะมีโครงสรางการบังคับบัญชาของตนเอง แตจะรวมมืออยางใกลชิดกับกองทัพอากาศอังกฤษ"
 NZL_fighter_focus:0 "เนนเครื่องบินขับไล"
 NZL_fighter_focus_desc:0 "เครื่องบินขับไลมีประสิทธิภาพในการสกัดกั้นและคุมกันเครื่องบินทิ้งระเบิด ซึ่งจะเปนอาวุธชี้ขาดของพันธมิตรของเรา"
 NZL_bomber_focus:0 "เนนเครื่องบินทิ้งระเบิด"
 NZL_bomber_focus_desc:0 "เครื่องบินทิ้งระเบิดเบาสามารถปกปองแนวชายฝงของเราไดอยางมีประสิทธิภาพ และจะเปนที่ตองการในการตอสูกับศัตรูในตางแดน"
 NZL_defend_our_islands:0 "ปกปองหมูเกาะของเรา"
 NZL_defend_our_islands_desc:0 "เราตองเตรียมพรอมรับการโจมตีจากทะเลตอสรวงสวรรคบนเกาะของเรา เครื่องบินทิ้งระเบิดทางทะเลสามารถสกัดกั้นและโจมตีเรือยกพลขึ้นบก หรือแมแตเล็งเปาไปที่เรือหลักได"
 NZL_modern_fighters:0 "เครื่องบินขับไลสมัยใหม"
 NZL_modern_fighters_desc:0 "ถึงเวลาแลวที่จะยกระดับแบบเครื่องบินขับไลของเราใหเร็วขึ้นและมีพิสัยไกลขึ้น พันธมิตรของเราไดชี้ทางไวแลวดวยเครื่องบินที่ลํ้าสมัยที่สุดบางแบบที่โลกเคยเห็น"
 NZL_heavy_bombers:0 "เครื่องบินทิ้งระเบิดหนัก"
 NZL_heavy_bombers_desc:0 "สงครามจะชนะไดก็ดวยการโจมตีเขาสูหัวใจของมาตุภูมิศัตรูเทานั้น เครื่องบินทิ้งระเบิดหนักเปนสิ่งจําเปนในการทําลายโรงงานและเมืองของศัตรูอยางยอยยับ"
 NZL_the_plan: "แผนการฝกนักบินแหงเครือจักรภพบริติช"
 NZL_the_plan_desc: "เราไดรวมมือกับพันธมิตรเพื่อแบงปนประสบการณและความรูในการฝกนักบิน สงครามอาจชนะไดจากทองฟา แผนการฝกนักบินแหงเครือจักรภพจึงอาจเปนกุญแจสูชัยชนะ"
 NZL_national_roads_board:0 "คณะกรรมการถนนแหงชาติ"
 NZL_national_roads_board_desc:0 "ภูมิประเทศที่ทุรกันดารของนิวซีแลนดเปนอุปสรรคตอการสรางระบบถนนที่เชื่อมโยงกัน แตเราจําเปนตองปรับปรุงสิ่งที่มีอยู ควรศึกษาระบบทางหลวง ลาดยางถนน และตัดเสนทางใหมผานเทือกเขา"
 NZL_new_zealand_steel:0 "เหล็กกลานิวซีแลนด"
 NZL_new_zealand_steel_desc:0 "นิวซีแลนดไดรับพรดวยแหลงทรายเหล็กอันอุดมสมบูรณ โดยเฉพาะบนเกาะเหนือ ตองใชกรรมวิธีพิเศษในการสกัดแรจากทรายนี้ แตมันสามารถเปนรากฐานของอุตสาหกรรมเหล็กกลาของเราไปอีกหลายป"
 NZL_taranaki_oil:0 "นํ้ามันทารานากิ"
 NZL_taranaki_oil_desc:0 "ภูมิภาคทารานากิบนเกาะเหนืออุดมไปดวยแรธาตุและปโตรเลียม ผูประกอบการหลายรายพยายามใชประโยชนจากแหลงนํ้ามันสํารองเหลานี้ แตยังตองการการลงทุนในโรงกลั่นและการขุดเจาะมากกวานี้"
 NZL_wairarapa_sheep_farms:0 "ฟารมแกะไวราราปา"
 NZL_wairarapa_sheep_farms_desc:0 "อุตสาหกรรมขนแกะของไวราราปาเปนหนึ่งในเสาหลักของเศรษฐกิจนิวซีแลนด เมื่อโลกหลุดพนจากภาวะเศรษฐกิจตกตํ่า ความตองการขนแกะของเราจะเพิ่มสูงขึ้น"
 NZL_bureau_of_industry:0 "สํานักงานอุตสาหกรรม"
 NZL_bureau_of_industry_desc:0 "นิวซีแลนดเปนสังคมเกษตรกรรมที่เนนการเลี้ยงปศุสัตว สํานักงานอุตสาหกรรมตองสงเสริมการลงทุนครั้งใหญในโครงสรางพื้นฐานดานทุนและการผลิตทางอุตสาหกรรม"
 NZL_department_of_scientific_and_industrial_research:0 "กรมการวิจัยทางวิทยาศาสตรและอุตสาหกรรม"
 NZL_department_of_scientific_and_industrial_research_desc:0 "ชาติอื่น ๆ ในเครือจักรภพและประเทศในเครือตางลงทุนในการวิจัยทางวิทยาศาสตรและอุตสาหกรรม เราก็ควรทําเชนเดียวกัน"
 NZL_industrial_conscription:0 "การเกณฑแรงงานอุตสาหกรรม"
 NZL_industrial_conscription_desc:0 "ไมมีเหตุผลใดที่ชายรางกายแข็งแรงจะไมรับใชในกองทัพหรือทํางานในอุตสาหกรรมที่เกี่ยวของกับสงคราม กฎหมายใหมของเราจะใหทุกคนรวมแรงรวมใจในการระดมพลและการผลิต"
 NZL_think_big:0 "คิดการใหญ"
 NZL_think_big_desc:0 "เราเคยชินกับการมองตนเองวาเปนประเทศในเครือที่ดอยกวาพันธมิตรชาวออสเตรเลียหรือแคนาดา แตนิวซีแลนดมีศักยภาพเต็มเปยมที่จะยิ่งใหญทางอุตสาหกรรม"
 NZL_project_seal:0 "โครงการซีล"
 NZL_project_seal_desc:0 "โครงการซีลเปนความริเริ่มใหมรวมกับชาวอเมริกัน เพื่อพัฒนาอาวุธที่สามารถกอใหเกิดคลื่นสึนามิถาโถมใสศัตรูของเรา ฟงดูเพอฝนอยูบาง แตระเบิดกระดอนที่พัฒนาขึ้นมาก็แสดงใหเห็นถึงความหวังอันยิ่งใหญ"
 NZL_national_defense_institute:0 "สถาบันปองกันประเทศ"
 NZL_national_defense_institute_desc:0 "บัดนี้นิวซีแลนดเปนชาติที่มีอธิปไตยโดยสมบูรณแลว เราจึงไมไดรับสิทธิ์เขาถึงตนแบบและพิมพเขียวขั้นสูงเหมือนที่เคยไดรับอีกตอไป เราตองทําใหมั่นใจวาเราจะนําหนาศัตรูเสมอ และไมลาหลังทางเทคโนโลยี"
 NZL_expand_the_university_of_auckland:0 "ขยายมหาวิทยาลัยโอกแลนด"
 NZL_expand_the_university_of_auckland_desc:0 "มหาวิทยาลัยโอกแลนดเปนสถาบันอุดมศึกษาที่สําคัญที่สุดของเรา การขยายสิ่งอํานวยความสะดวกจะชวยใหเรารักษาผูมีปญญาเลิศบางสวนไวในบานเกิดได"
 NZL_army_reforms:0 "ปฏิรูปกองทัพบก"
 NZL_army_reforms_desc:0 "เราควรปรับปรุงระบบการฝกและการเลื่อนยศของกองทัพบกใหทันสมัย ดวยวิธีนี้เราจะพรอมรับมือกับทุกสิ่งที่อาจเกิดขึ้นในวิกฤตโลกที่กําลังดําเนินอยู"
 NZL_charlton_automatic_rifle:0 "ปนเล็กยาวอัตโนมัติชารลตัน"
 NZL_charlton_automatic_rifle_desc:0 "พลเมืองคนหนึ่งของเราไดดัดแปลงปนเล็กยาวลี-เอนฟลดมาตรฐานใหเปนปนอัตโนมัติเต็มรูปแบบ นี่คือความเฉลียวฉลาดแบบนิวซีแลนดในระดับสูงสุด และเราควรสงเสริมนวัตกรรมในแนวทางนี้"
 NZL_bob_semple_tank:0 "รถถังบ็อบ เซมเพิล"
 NZL_bob_semple_tank_desc:1 "ทําไมนิวซีแลนดจะมีรถถังเปนของตัวเองไมได? กระทรวงโยธาธิการในเทมูกากําลังพัฒนารถถังเบาที่ติดอาวุธเพียงปนกล แมเราจะไมเคยพัฒนาใหไปไกลเกินกวาตนแบบ ประสบการณที่ไดรับก็จะมีคาอยางยิ่ง"
 NZL_domestic_arms_industry:0 "อุตสาหกรรมอาวุธในประเทศ"
 NZL_domestic_arms_industry_desc:0 "เราควรเปลี่ยนอุตสาหกรรมใหมากที่สุดเทาที่ทําไดมาผลิตอาวุธเบา เราตองการกระสุน ชิ้นสวนปน ยุทโธปกรณสนับสนุน และอื่น ๆ สิ่งเหลานี้ผลิตไดภายในประเทศ"
 NZL_schofield_tank:0 "รถถังสโคฟลด"
 NZL_schofield_tank_desc:0 "หากรถถังเซมเพิลไมตอบสนองความตองการของเรา บางทีรถถังที่ติดปนใหญจริงจังอาจไดผล ระบบลอผสมสายพานนั้นแปลกใหม และอาจนําเราไปสูความเขาใจใหม ๆ ในการออกแบบรถถัง"
 NZL_long_range_patrol:0 "หนวยลาดตระเวนระยะไกล"
 NZL_long_range_patrol_desc:0 "หนวยลาดตระเวนระยะไกลมีเปาหมายเพื่อครอบคลุมพื้นที่อันกวางใหญในแอฟริกาเหนือ หนวยลาดตระเวนและคอมมานโดนี้จะปฏิบัติภารกิจพิเศษในสภาพภูมิอากาศที่โหดรายที่สุดบางแหงของโลก"
 NZL_artillery_focus:0 "เนนปนใหญ"
 NZL_artillery_focus_desc:0 "ปนใหญมีความสําคัญยิ่งตอการสนับสนุนการรุกคืบของทหารราบของเรา จงขยายการวิจัยดานขีปนวิถีและปนลํากลองใหญขึ้น"
 NZL_big_bob_tank:0 "รถถังบิ๊กบ็อบ"
 NZL_big_bob_tank_desc:0 "สมรภูมิในยุโรปเรียกรองยานเกราะที่หนักขึ้นเพื่อแขงกับรถถังยักษของศัตรู บิ๊กบ็อบจะเปนผลงานของนิวซีแลนดในความพยายามดานการออกแบบนี้"
 NZL_research_collaboration:0 "ความรวมมือดานการวิจัย"
 NZL_research_collaboration_desc:0 "อังกฤษไดแสดงใหเราเห็นถึงขอดีของการแบงปนความกาวหนาทางวิทยาศาสตรระหวางพันธมิตรใกลชิด ทั้งฝายของเราจะสามารถดําเนินการวิจัยและพัฒนาในยามสงครามไดอยางมีประสิทธิภาพยิ่งขึ้น หากเราดําเนินการที่จําเปนเพื่อประสานงานเรื่องนี้"
 NZL_the_first_labor_government:0 "รัฐบาลพรรคแรงงานชุดแรก"
 NZL_the_first_labor_government_desc:0 "รัฐบาลพรรคแรงงานชุดแรกของนิวซีแลนดมีโอกาสผลักดันวาระทางสังคมและเศรษฐกิจแบบกาวหนา ทั้งการกํากับดูแลอุตสาหกรรม สิทธิแรงงาน กฎหมายสวัสดิการสังคม และกฎเกณฑดานคาจาง ลวนอยูในวาระทั้งสิ้น"
 NZL_ratana_alliance:0 "พันธมิตรราตานา"
 NZL_ratana_alliance_desc:0 "การเปนพันธมิตรกับขบวนการราตานาจะนําชาวนิวซีแลนดเชื้อสายเมารีเขาสูรัฐบาล และหวังวาจะเริ่มเยียวยาบาดแผลบางสวนจากการพิชิตของอังกฤษ"
 NZL_maori_affairs_act:0 "พระราชบัญญัติกิจการชาวเมารี"
 NZL_maori_affairs_act_desc:0 "ที่ดินจํานวนมากที่ชาวเมารีเปนเจาของไมกอใหเกิดผลผลิตทางเศรษฐกิจ หากเราสามารถรวบรวมและนําที่ดินมาอยูใตการควบคุมของรัฐบาลมากขึ้น เราก็จะเปลี่ยนพื้นที่รกรางเหลานี้ใหเปนแหลงอุตสาหกรรมและการคาที่อุดมสมบูรณได"
 NZL_social_security_act:0 "พระราชบัญญัติประกันสังคม"
 NZL_social_security_act_desc:0 "ผูวางงานในนิวซีแลนดตองไดรับการดูแลจนกวาเศรษฐกิจจะฟนตัวและมีงานมากขึ้น เราเริ่มตนดวยโบนัสคริสตมาสในป 1935 แตถึงเวลาแลวที่จะมีตาขายรองรับทางสังคมที่เหมาะสมสําหรับพลเมืองทุกคน"
 NZL_the_manpower_act:0 "พระราชบัญญัติกําลังคน"
 NZL_the_manpower_act_desc:0 "นับตั้งแตสงครามเริ่มขึ้น ชาวเมารีจํานวนมากไดอพยพเขาสูเมือง พระราชบัญญัติกําลังคนจะชวยใหเราชี้นําพลังเหลานั้นเขาสูโรงงานของนิวซีแลนด"
 NZL_amend_the_maori_affairs_act:0 "แกไขพระราชบัญญัติกิจการชาวเมารี"
 NZL_amend_the_maori_affairs_act_desc:0 "เราตองแกไขพระราชบัญญัติกิจการชาวเมารีใหชวยเพิ่มผลผลิตจากที่ดินที่ยังใชประโยชนไมเต็มที่ แตไมขับไลพลเมืองชาวเมารีของเราโดยไมจําเปน"
 NZL_waitangi_tribunal:0 "ศาลไวทังกิ"
 NZL_waitangi_tribunal_desc:0 "ชาวนิวซีแลนดเชื้อสายอังกฤษควรยอมรับสิ่งที่บรรพบุรุษของตนไดกระทําในการขับไล ทําลายวิถีชีวิต และผลักไสชาวเมารีแหงนิวซีแลนดใหเปนคนชายขอบ ทั้งสงครามนองเลือด การยึดที่ดิน และการเพิกเฉยตอสิทธิตามธรรมชาติ การยอมรับมรดกเหลานี้คือกาวหนึ่งสูการเยียวยา"
 NZL_maori_conscription:0 "การเกณฑทหารชาวเมารี"
 NZL_maori_conscription_desc:0 "ความกลาหาญและวีรกรรมของกองพันเมารีที่สังกัดกองกําลังรบนอกประเทศ เปนสัญญาณวาเราควรใชประโยชนจากประชากรทั้งหมดของเราใหมากที่สุด ดวยการเกณฑแมแตชาวเมารีที่ไมเต็มใจเขารับราชการ"
 NZL_maori_volunteers:0 "อาสาสมัครชาวเมารี"
 NZL_maori_volunteers_desc:0 "ชาวเมารีหลายรอยคนแสดงความรักชาติดวยการกาวออกมาสมัครเปนอาสาสมัครรับใชในกองทัพนิวซีแลนด"
 NZL_strengthen_the_commonwealth:0 "เสริมความแข็งแกรงใหเครือจักรภพ"
 NZL_strengthen_the_commonwealth_desc:0 "ในฐานะประเทศในเครือขนาดเล็ก การอยูใกลชิดกับมิตรสหายและครอบครัวเปนเรื่องสําคัญ เราจะกระชับสายสัมพันธกับดินแดนบริติชดวยกัน"
 NZL_statute_of_westminster:0 "ธรรมนูญแหงเวสตมินสเตอร"
 NZL_statute_of_westminster_desc:0 "ธรรมนูญแหงเวสตมินสเตอรมอบความเปนอิสระที่มากขึ้นใหแกเราภายใตราชบัลลังก ขณะที่ยังคงอยูในจักรวรรดิ"
 NZL_2nzef:0 "2NZEF"
 NZL_2nzef_desc:0 "แมจะผานความโหดรายของสงครามครั้งกอนมา นิวซีแลนดก็พรอมจะเดินทัพอีกครั้ง กองกําลังรบนอกประเทศนิวซีแลนดที่ 2 กําลังถูกจัดตั้งขึ้นในขณะนี้"
 NZL_arrest_pacifist_leaders:0 "จับกุมผูนําฝายสันตินิยม"
 NZL_arrest_pacifist_leaders_desc:0 "บัดนี้ไมใชเวลาสําหรับความแตกแยกภายในประเทศ ทุกคนตองมุงไปที่การเอาชนะสงคราม และหากนั่นหมายถึงการควบคุมตัวผูที่พูดตอตานสงคราม เราก็จะทําเชนนั้น"
 NZL_technology_sharing_with_britain:0 "แบงปนเทคโนโลยีกับอังกฤษ"
 NZL_technology_sharing_with_britain_desc:0 "ฐานทางวิทยาศาสตรและอุตสาหกรรมของบริเตนใหญเหนือกวาของเราอยางมาก แตเพราะเราเปนครอบครัวเดียวกัน พวกเขาจึงยินดีแบงปนความรูใหแกเรา"
 NZL_the_lee_affair:0 "กรณีลี"
 NZL_the_lee_affair_desc:0 "จอหน ลี สมาชิกรัฐสภาเขตเกรยลินน ไดกอปญหาภายในกลุม ส.ส. พรรคแรงงาน เขาปลุกปนใหผลักดันวาระที่หัวรุนแรงขึ้นแทนแนวทางระมัดระวังที่เรากําลังดําเนินอยู ตองมีมาตรการเพื่อสยบการแข็งขอของเขา"
 NZL_empower_the_working_class:0 "เสริมอํานาจชนชั้นแรงงาน"
 NZL_empower_the_working_class_desc:0 "พรรคแรงงานยืนหยัดเคียงขางชนชั้นแรงงานมาตั้งแตกอตั้ง อันที่จริงผูนําของเราหลายคนก็มีพื้นเพมาจากชนชั้นแรงงาน มาผลักดันการคุมครองและอํานาจใหแกสหภาพแรงงานอยางเด็ดขาดยิ่งขึ้นกันเถอะ"
 NZL_join_comintern:0 "เขารวมโคมินเทิรน"
 NZL_join_comintern_desc:0 "ถึงเวลาแลวที่จะรวมเปนพันธมิตรกับพี่นองสังคมนิยมของเรา ผานโคมินเทิรน เราจะบรรลุถึงสวรรคของกรรมกร"
 NZL_technology_sharing_with_soviet_union:0 "แบงปนเทคโนโลยีกับสหภาพโซเวียต"
 NZL_technology_sharing_with_soviet_union_desc:0 "สหภาพโซเวียตมีนักวิทยาศาสตรและนักนวัตกรรมเทคโนโลยีชั้นนําของโลกจํานวนมาก พวกเขาใจกวางพอที่จะแบงปนความรูใหแกเรา สหายรวมรบของพวกเขา"
 NZL_in_the_darkness:0 "ในความมืดมิด"
 NZL_in_the_darkness_desc:0 "มีความเนาเฟะแฝงอยูในระบอบประชาธิปไตยที่ประเทศแมของเรายกยอง ความแข็งแกรงที่แทจริงไมอาจแสดงออกไดดวยการประนีประนอม"
 NZL_befriend_japan:0 "ผูกมิตรกับญี่ปุน"
 NZL_befriend_japan_desc:0 "ในฐานะชาติในแปซิฟก การเขาขางมหาอํานาจที่แข็งแกรงที่สุดในภูมิภาคยอมเหมาะกับผลประโยชนดานความมั่นคงของเรา ญี่ปุนและกองทัพเรืออันเกรียงไกรสามารถปกปองเราจากภยันตรายของโลกได"
 NZL_rule_them_all:0 "ปกครองพวกเขาทั้งหมด"
 NZL_rule_them_all_desc: "ชาติตาง ๆ ในซีกโลกใตแหงแปซิฟกใตควรรวมเปนมหาอํานาจหนึ่งเดียว ออสเตรเลียควรพิจารณายอมรับอุดมการณอันเหนือกวาของเรา"
 NZL_technology_sharing_with_japan:0 "แบงปนเทคโนโลยีกับญี่ปุน"
 NZL_technology_sharing_with_japan_desc:0 "ญี่ปุนมีนักวิทยาศาสตรและนักนวัตกรรมเทคโนโลยีชั้นนําของโลกจํานวนมาก พวกเขาใจกวางพอที่จะแบงปนความรูใหแกเรา พี่นองรวมรบของพวกเขา"
 NZL_constitution_amendment_act:0 "พระราชบัญญัติแกไขรัฐธรรมนูญ"
 NZL_constitution_amendment_act_desc:0 "ถึงเวลาแลวที่นิวซีแลนดจะพิจารณาแยกตัวออกจากการครอบงําของอังกฤษ เราจะแกไขรัฐธรรมนูญเพื่อยืนยันการควบคุมกิจการของเราเองใหมากขึ้น"
 NZL_independent_new_zealand:0 "นิวซีแลนดที่เปนเอกราช"
 NZL_independent_new_zealand_desc:0 "บัดนี้เราเปนสาธารณรัฐแลว! นิวซีแลนดไมไดติดคางสิ่งใดตอสหราชอาณาจักร นอกจากความกตัญูที่ลูกพึงมีตอแมผูเลี้ยงดูมาอยางปลอดภัย แตเราตองออกจากรังอันปลอดภัยของเครือจักรภพ และมองโลกโดยคํานึงถึงผลประโยชนของเราเอง"
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap]โอน§Yเรือลาดตระเวนเบา 2 ลํา§!ใหแกเรา"
 RAJ_provincial_elections:0 "การเลือกตั้งระดับจังหวัด"
 RAJ_provincial_elections_desc:0 "พระราชบัญญัติรัฐบาลอินเดียฉบับใหมกําหนดใหมีการเลือกตั้งในจังหวัดตาง ๆ เพื่อจัดตั้งรัฐบาลทองถิ่นในระดับหนึ่งที่รับผิดชอบตอประชากรอินเดีย เราจะไดเห็นวาสิ่งนี้สงผลอยางไรตอการปกครองของอังกฤษ"
 RAJ_swaraj:0 "สวราช"
 RAJ_swaraj_desc:0 "แนวคิดการปกครองตนเองของคานธี หรือ สวราช กําลังไดรับความนิยมไปทั่วอินเดีย แนวคิดนี้สนับสนุนการตัดขาดจากสถาบันและขนบธรรมเนียมของอังกฤษโดยสิ้นเชิง และกลุมสวราชกําลังเคลื่อนไหวปลุกระดมตามโรงเรียนตาง ๆ ในอินเดีย"
 RAJ_indian_national_congress:0 "พรรคคองเกรสแหงชาติอินเดีย"
 RAJ_indian_national_congress_desc:0 "พรรคคองเกรสแหงชาติอินเดียประสบความสําเร็จอยางมากในการเลือกตั้งทั่วอนุทวีป พวกเขาเปนกระบอกเสียงที่แข็งแกรงเพื่ออินเดียที่เปนเอกราช หรืออยางนอยก็อินเดียที่มีอํานาจปกครองตนเองมากขึ้นภายในจักรวรรดิ"
 RAJ_quit_india_movement:0 "ขบวนการออกไปจากอินเดีย"
 RAJ_quit_india_movement_desc:0 "การรณรงคเพื่อเอกราชของอินเดียของคานธีมาถึงจุดสูงสุดดวยการเรียกรองใหอังกฤษออกไปจากอินเดีย เปนไปไมไดที่การปกครองของบริติชราชจะสิ้นสุดลงกอนสงครามจบ แตสถานการณในพื้นที่ตึงเครียดขึ้นทุกวัน"
 RAJ_all_india_forward_bloc:0 "กลุมฟอรเวิรดบล็อกแหงอินเดียทั้งปวง"
 RAJ_all_india_forward_bloc_desc:0 "กลุมฟอรเวิรดบล็อกแหงอินเดียทั้งปวงเห็นวาการถอนตัวของอังกฤษจากอินเดียใชเวลานานเกินไป ตองมีจุดยืนที่แข็งกราวขึ้น หรือแมแตใชกําลัง"
 RAJ_seek_help_from_soviet:0 "ขอความชวยเหลือจากโซเวียต"
 RAJ_seek_help_from_soviet_promised:0 " สหภาพโซเวียตใหคํามั่นวาจะชวยเหลือ"
 RAJ_seek_help_from_soviet_desc:0 "สหภาพโซเวียตคือตัวถวงดุลตามธรรมชาติตออํานาจจักรวรรดิบริติช พวกเขาอางวาเปนเครื่องยนตแหงการปฏิวัติ และเราควรสนับสนุนใหพวกเขาสงออกการปฏิวัติมายังอินเดีย"
 RAJ_indian_peoples_army:0 "กองทัพประชาชนอินเดีย"
 RAJ_indian_peoples_army_effect:0 "ผูสนับสนุนคอมมิวนิสตเริ่มสงครามกลางเมืองเพื่ออิสรภาพ ขนาดขึ้นอยูกับการสนับสนุนพรรคและความคืบหนาของอํานาจปกครองตนเอง"
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap]จะสนับสนุนอุดมการณของพวกเขา"
 RAJ_indian_peoples_army_desc:0 "เราควรจัดตั้งกองกําลังทหารที่จะเรียนรูจากและเปนพันธมิตรกับฝายคอมมิวนิสต"
 RAJ_research_city_excursions:0 "ทัศนศึกษาเมืองวิจัย"
 RAJ_research_city_excursions_desc:0 "เมืองวิจัยของโซเวียตเปนสิ่งมหัศจรรย และประชากรของอินเดียก็เต็มไปดวยผูมีปญญาที่กระตือรือรนและเฉลียวฉลาด การสงวิศวกรรุนใหมของเราไปยังเมืองเหลานี้จะชวยใหเราพัฒนาฐานการวิจัยและอุตสาหกรรมในประเทศ"
 RAJ_combined_arms_academy:0 "สถาบันการรบรวมเหลา"
 RAJ_combined_arms_academy_desc:0 "การฝกทหารแบบโซเวียตสามารถทําใหมีประสิทธิภาพยิ่งขึ้นผานสถาบันการรบรวมเหลาแหงใหม เราจะทันสมัยในการสงครามยุคใหม ทั้งการใชกําลังทางอากาศ ทางบก และทางทะเล"
 RAJ_rani_of_jhans:0 "รานีแหงฌานสี"
 RAJ_rani_of_jhans_desc:0 "รานีแหงฌานสีคือวีรสตรีผูยิ่งใหญแหงการปฏิวัติอินเดียป 1857 ความกลาหาญและความภาคภูมิใจในชาติของพระนางเปนแบบอยางใหสตรีชาวอินเดียทุกคนที่ปรารถนาจะจับอาวุธและจัดตั้งกรมทหารของตนเอง"
 RAJ_rebuilding_the_nation:0 "ฟนฟูชาติ"
 RAJ_rebuilding_the_nation_desc:0 "เมื่อผูกดขี่แหงจักรวรรดิถูกขับไลออกไปและประชาชนชาวอินเดียถูกระดมพลพรอมลงมือแลว ถึงเวลาซอมแซมความเสียหายจากการยึดครองตลอดสองศตวรรษ"
 RAJ_seek_help_from_germany:0 "ขอความชวยเหลือจากเยอรมนี"
 RAJ_seek_help_from_germany_promised:0 " ไรชเยอรมันไดใหคํามั่นวาจะชวยเหลือ"
 RAJ_seek_help_from_germany_desc:0 "เยอรมนีไมเคยทํารายเราเหมือนที่อังกฤษทํา และไรชคือผูทาทายอํานาจของอังกฤษที่นาจะเปนไปไดมากที่สุด เราควรใกลชิดกับฝายอักษะใหมากขึ้น"
 RAJ_indian_national_army:0 "กองทัพแหงชาติอินเดีย"
 RAJ_indian_national_army_effect:0 "ผูสนับสนุนฟาสซิสตจะกอสงครามกลางเมืองเพื่ออิสรภาพ ขนาดขึ้นอยูกับความนิยมของพรรคและความคืบหนาของอํานาจปกครองตนเอง"
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] จะสนับสนุนการตอสูของพวกเขา"
 RAJ_indian_national_army_desc:0 "กองทัพแหงชาติอินเดียซึ่งแยกจากกองกําลังที่อังกฤษควบคุมไดถูกจัดตั้งขึ้นแลว เราสามารถสรางกองทัพนี้ในภูมิภาคที่ปลอดจากการแทรกแซงของอังกฤษ และตั้งแนวตอตานฝายสัมพันธมิตร ดึงกําลังพลชาวอินเดียออกไปจากราช"
 RAJ_battaglione_azad_hindoustan:0 "Battaglione Azad Hindoustan"
 RAJ_battaglione_azad_hindoustan_desc:0 "อิตาลีไดจัดตั้ง Battaglione Azad Hindoustan กองทหารที่ประกอบดวยอดีตเชลยศึกชาวอินเดีย ซึ่งไดรับการฝกดานการกอวินาศกรรม การโดดรม และการแทรกซึม หนวย BAH อาจเปนกาวสําคัญของความภาคภูมิใจแหงชาติ"
 RAJ_german_technology:1 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_german:0 "เทคโนโลยีเยอรมัน"
 RAJ_german_technology_japan:0 "เทคโนโลยีญี่ปุน"
 RAJ_german_technology_desc:0 "นักวิทยาศาสตรเยอรมันเกงที่สุดในโลก และเครื่องจักรสงครามของพวกเขาตั้งอยูบนเทคนิควิศวกรรมสมัยใหมที่ดีที่สุด พวกเขายินดีแบงปนความกาวหนาเหลานั้นกับเรา"
 RAJ_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_german:0 "โรงเรียนฝกการบินลุฟทวัฟเฟอ"
 RAJ_japanese_army_air_force_academy_japan:0 "โรงเรียนนายเรืออากาศแหงกองทัพบกญี่ปุน"
 RAJ_japanese_army_air_force_academy_desc:0 "โรงเรียนการบินของญี่ปุนตัดสินใจตอนรับทหารใหมชาวอินเดียที่ปรารถนาจะตอสูกับการครอบงําของยุโรปในเอเชีย"
 RAJ_cripps_mission:0 "ภารกิจของคริปส"
 RAJ_cripps_mission_desc:0 "เราตองรักษาใหอินเดียภักดีตอฝายสัมพันธมิตรและอังกฤษ แมกระแสชาตินิยมเรียกรองเอกราชจะพุงสูงขึ้นก็ตาม เซอรสแตฟฟอรด คริปส เปนนักเจรจาฝมือดีที่สามารถใหความมั่นใจแกผูนําชาตินิยมวาขอเรียกรองของพวกเขาจะไดรับการพิจารณา"
 RAJ_two_nation_theory:0 "ทฤษฎีสองชาติ"
 RAJ_two_nation_theory_effect:0 "ปากีสถานจะไดรับเอกราชเมื่ออินเดียไดรับอิสรภาพ\n"
 RAJ_two_nation_theory_desc:0 "แมจะถูกปกครองเปนดินแดนเดียวมาชานาน แตการมองอินเดียเปนสองชาติก็สมเหตุสมผล คือชาติฮินดูและชาติมุสลิม การแบงแยกประเทศอาจไมใชคําตอบเดียว แตขอตกลงใดๆ เพื่ออินเดียที่เปนเอกราชตองเผชิญกับธรรมชาติสองขั้วของอนุทวีปนี้"
 RAJ_princely_state_donations:0 "การบริจาคของรัฐมหาราชา"
 RAJ_princely_state_donations_desc:0 "รัฐมหาราชาของอินเดียไดสงกําลังคนมาเปนแกนหลักของกองทัพอินเดียภายใตอังกฤษมาเปนเวลานาน การบริจาคเพิ่มเติมจากผูปกครองทองถิ่นเหลานี้ตอกยํ้าการสนับสนุนที่พวกเขามีตอจักรวรรดิ"
 RAJ_imperial_service_troops:0 "กองทหารบริการจักรวรรดิ"
 RAJ_imperial_service_troops_desc:0 "กองทหารบริการจักรวรรดิเกณฑมาโดยเหลามหาราชาแหงอินเดีย และอาจมีจํานวนนับแสนนาย ในยามยากลําบากเชนนี้ เปนเรื่องดีที่ไดรูวาองคพระมหากษัตริยสามารถพึ่งพาความจงรักภักดีของเหลาราชาได"
 RAJ_raf_funding:0 "งบประมาณกองทัพอากาศ"
 RAJ_raf_funding_desc:0 "กองทัพอากาศหลวงแหงอินเดียจะไดรับงบประมาณและทรัพยสินเพิ่มเติมจากสหราชอาณาจักร"
 RAJ_navy_funding:0 "งบประมาณกองทัพเรือ"
 RAJ_navy_funding_effect:0 "§Yเรือลาดตระเวนเบา 2 ลํา§! จะถูกเพิ่มเขากองทัพเรือของคุณหากคุณมีเทคโนโลยีแลว\n"
 RAJ_navy_funding_effect_mtg:0 "§Yเรือลาดตระเวนเบา 2 ลํา§! แบบนี้จะถูกเพิ่มเขากองทัพเรือของเรา\n"
 RAJ_navy_funding_desc:0 "กองทัพเรือหลวงแหงอินเดียจะไดรับงบประมาณและทรัพยสินเพิ่มเติมจากสหราชอาณาจักร"
 RAJ_british_army_support:0 "การสนับสนุนจากกองทัพบกอังกฤษ"
 RAJ_british_army_support_desc:0 "กองทัพบกอังกฤษรูจักอินเดียเปนอยางดีหลังการยึดครองกวา 200 ป พวกเขารูจักทั้งผูคนและผืนแผนดิน และจะชวยสนับสนุนการฝกทหารอินเดียใหตอสูในบานเกิดได"
 RAJ_red_eagle_division:0 "กองพลอินทรีแดง"
 RAJ_create_unit_red_eagles_tt:0 "ไดรับกองพลทหารราบชั้นยอดหนึ่งกองพลในเดลี\n"
 RAJ_red_eagle_division_desc:0 "กองพลอินทรีแดงจะเปนกองพลอินเดียกองพลแรกที่ไดรับการฝกเพื่อรบในตางแดน พรอมสูรบในสภาพที่ทารุณ"
 RAJ_chindits:0 "ชินดิตส"
 RAJ_orde_wingate_tt:0 "§Yนายพลระดับทักษะ 4§! ชื่อ §Yออรด วินเกต§! จะปรากฏตัว\n"
 RAJ_chindits_desc:0 "อินเดียตองการกองพลรบพิเศษ เราจึงจัดตั้งหนวยชินดิตสขึ้นเพื่อปฏิบัติการหลังแนวขาศึกในปาดงดิบของเอเชีย นี่เปนปฏิบัติการที่เสี่ยงและจะมีอัตราสูญเสียสูง แตอาจเปนประโยชนอยางยิ่งตอความพยายามในสงคราม"
 RAJ_jungle_training:0 "การฝกรบในปา"
 RAJ_jungle_training_effect:0 "ปลดล็อก §Hการฝกรบในปา§!\n§Hนาวิกโยธิน\n    ปา§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n§Hทหารภูเขา\n    ปา§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n§Hพลรม\n    ปา§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n"
 RAJ_jungle_training_desc:0 "อินเดีย พมา และอินโดจีนปกคลุมไปดวยปาดงดิบ จึงควรมีการฝกพิเศษเพื่อใหทหารของเรารบไดอยางมีประสิทธิภาพในภูมิประเทศอันตรายนี้"
 RAJ_lessons_of_the_great_war:0 "บทเรียนจากมหาสงคราม"
 RAJ_lessons_of_the_great_war_desc:0 "ทหารอาณานิคมอินเดียเคยเขารวมในสงครามโลกครั้งที่แลว และบทเรียนจากความขัดแยงครั้งนั้นควรนํามาใชกับการฝกและการจัดระเบียบกองทัพ"
 RAJ_indianisation_of_army:0 "การทําใหกองทัพเปนของชาวอินเดีย"
 RAJ_indianisation_of_army_desc:0 "เพื่อปกปองอินเดียอยางเหมาะสมในสงครามเบ็ดเสร็จ ประชากรอินเดียทั้งหมดควรถูกระดมพล ซึ่งไมไดหมายถึงแคการเกณฑทหารจากประชากรอินเดียใหกวางขวางขึ้น แตยังตองยอมใหนายทหารชาวอินเดียขึ้นมาบังคับบัญชาในบางระดับของสายการบังคับบัญชาดวย"
 RAJ_indian_gurkhas:0 "กุรขาอินเดีย"
 RAJ_indian_gurkhas_desc:0 "ชาวกุรขาแหงที่ราบสูงปญจาบและเนปาลเลื่องชื่อในดานฝมือการรบ พวกเขารับใชราชอยางจงรักภักดีมาหลายป และเชี่ยวชาญการรบทุกรูปแบบ"
 RAJ_an_indian_sandhurst:0 "แซนดเฮิรสตแหงอินเดีย"
 RAJ_an_indian_sandhurst_desc:0 "อินเดียเรียกรองโรงเรียนทหารของตนเองมาตั้งแตสงครามครั้งกอน และในที่สุดเราก็กอตั้งขึ้นในป 1932 สถาบันการทหารอินเดียผลิตนายทหารชาวอินเดียมาหลายปแลว ทําใหเรามีกลุมผูบังคับบัญชาแกนหลัก"
 RAJ_lions_of_the_great_war:0 "สิงหแหงมหาสงคราม"
 RAJ_lions_of_the_great_war_desc:0 "ชาวซิกขมีประเพณีทางทหารที่เขมแข็งและไดรับเครื่องอิสริยาภรณมากมายในสงครามครั้งกอน สิงหแหงปญจาบสามารถตั้งเปนกรมทหารที่แข็งแกรงไดดวยตัวเอง และภูมิภาคนี้ยังพรอมสําหรับการเกณฑทหารเพิ่มเติม"
 RAJ_indian_gentlemen_officers:0 "นายทหารสุภาพบุรุษชาวอินเดีย"
 RAJ_indian_gentlemen_officers_desc:0 "เหลาสุภาพบุรุษที่รับใชราชผานความรวมมืออยางใกลชิดกับทางการจักรวรรดิ คือแหลงผูบังคับบัญชาที่พรอมใชงาน หากเราตองการผูภักดีมานํากองทัพอินเดียใหม"
 RAJ_the_bangalore_torpedo:0 "ตอรปโดบังกาลอร"
 RAJ_the_bangalore_torpedo_desc:0 "หนึ่งในผลงานยิ่งใหญที่สุดของบริติชอินเดียตอศิลปะการสงครามคือตอรปโดบังกาลอร ซึ่งเปนทอตอกันหลายทอที่ใชทําลายสิ่งกีดขวางขณะที่ทหารชางตกอยูใตการระดมยิง อุปกรณนี้ไดรับความนิยมอยางมากทั่วโลก"
 RAJ_vickers_berthier_gun:0 "ปน Vickers-Berthier"
 RAJ_vickers_berthier_gun_desc:0 "Vickers-Berthier อาจเทอะทะไปสักหนอย แตมีขอดีคือผลิตไดงายและรวดเร็ว สําหรับชาติอยางอินเดีย นี่คือคุณสมบัติที่สําคัญยิ่งของปน"
 RAJ_royal_indian_artillery:0 "กองทหารปนใหญหลวง[ROOT.GetAdjective]"
 RAJ_royal_indian_artillery_desc:0 "กองทหารปนใหญหลวงแหงอินเดียมีมาตั้งแตบริษัทอินเดียตะวันออกจัดตั้งกองพันปนใหญที่มีพลปนชาวอินเดียในป 1748 เราสามารถใชประสบการณหลายทศวรรษนี้ได"
 RAJ_army_motorization:0 "การทําใหกองทัพเปนยานยนต"
 RAJ_army_motorization_desc:0 "อินเดียกวางใหญเกินกวาที่รถไฟและมาจะครอบคลุมไดอยางมีประสิทธิภาพ กองทัพควรมีกองพลยานยนตและการขนสงดวยรถบรรทุกเปนประจํา"
 RAJ_revive_the_screw_guns:0 "ฟนคืนชีพปนสกรู"
 mountain_guns_tt: "ปลดล็อก §Hปนใหญภูเขา§!\n§Hปนใหญ (ภูเขา)§!\n    การโจมตี: §G+8%§!\n    การเคลื่อนที่: §G+15%§!\n§Hตอสูรถถัง (ภูเขา)§!\n    การโจมตี: §G+8%§!\n    การเคลื่อนที่: §G+15%§!"

 RAJ_revive_the_screw_guns_desc:0 "ภูมิประเทศภูเขาทางตอนเหนือของอินเดียนําไปสูการพัฒนาปนใหญที่สามารถถอดแยกชิ้นและบรรทุกบนหลังลอไปยังที่ใดก็ไดที่ตองการ ปนขนาด 7 ปอนดนี้อาจลาสมัยไปบาง แตเราไมควรมองขามประโยชนของมัน"
 RAJ_indian_armor:0 "ยานเกราะอินเดีย"
 RAJ_indian_armor_desc:0 "อินเดียควรมุงพัฒนายานเกราะและกองพลรถถังที่ผลิตเองภายในประเทศ"
 RAJ_modernizing_army:0 "การปรับปรุงกองทัพบกใหทันสมัย"
 RAJ_modernizing_army_desc:0 "กองทัพอินเดียถูกมองเปนเพียงดานหนาอาณานิคมมานานเกินไป ไดรับประโยชนและยุทโธปกรณเพียงนอยนิดเมื่อเทียบกับกองทัพในบานเกิดที่อังกฤษ ถึงเวลาปรับปรุงสิ่งที่เรามีในราชใหทันสมัยแลว"
 RAJ_indian_defense_research:0 "การวิจัยดานกลาโหมอินเดีย"
 RAJ_indian_defense_research_desc:0 "เมื่ออินเดียเปนชาติที่มีอธิปไตยอยางสมบูรณแลว เราจึงไมไดรับสิทธิ์เขาถึงตนแบบและพิมพเขียวขั้นสูงเหมือนแตกอน เราตองมั่นใจวาจะนําหนาศัตรูอยูเสมอ และไมลาหลังดานเทคโนโลยี"
 RAJ_british_pilot_training:0 "การฝกนักบินโดยอังกฤษ"
 RAJ_british_pilot_training_desc:0 "กองทัพอากาศหลวงตกลงรับนักบินชาวอินเดียเขารับการฝก การศึกษานี้จะชวยอยางมากในการพัฒนากองบินของเราเอง"
 RAJ_expand_air_bases:0 "ขยายฐานทัพอากาศ"
 RAJ_expand_air_bases_desc:0 "อินเดียกวางใหญมาก การลาดตระเวนและปกปองนานฟาจึงหมายความวาเราตองเพิ่มขีดความสามารถทางอากาศที่ฐานทัพทั่วอนุทวีป"
 RAJ_air_support_effort:0 "การทุมเทดานการสนับสนุนทางอากาศ"
 RAJ_air_support_effort_desc:0 "การรบแบบผสมเหลาคือวิถีใหมของสงคราม เราจึงตองทุมเทพลังสวนหนึ่งใหกับการฝกและผลิตอากาศยานที่สนับสนุนกองกําลังภาคพื้นดินและทางทะเลได"
 RAJ_fighter_effort:0 "การทุมเทดานเครื่องบินขับไล"
 RAJ_fighter_effort_desc:0 "เราตองการเครื่องบินขับไลเพื่อคุมกันเครื่องบินทิ้งระเบิดและสกัดกั้นเครื่องบินขาศึกที่คุกคามชาติของเรา"
 RAJ_royal_indian_air_force:0 "กองทัพอากาศหลวงอินเดีย"
 RAJ_royal_indian_air_force_desc:0 "ถึงเวลานํากองบินเล็กๆ ของเรามาขยายเปนเหลาทัพของตนเองแลว กองทัพอากาศแหงชาติที่มีการบังคับบัญชาเปนอิสระจะรับใชประชาชนชาวอินเดียและจักรวรรดิไดดียิ่งขึ้น"
 RAJ_the_smiling_buddha:0 "พระพุทธเจายิ้ม"
 RAJ_the_smiling_buddha_desc:0 "นักวิทยาศาสตรใกลจะไขความลับของพลังงานปรมาณูไดแลว และสิ่งนี้จะนําไปสูการสรางวัตถุระเบิดที่ทรงพลังมหาศาล เราจะลาหลังในการแขงขันพัฒนาอาวุธปรมาณูไมได"
 RAJ_great_indian_peninsula_railway:0 "ทางรถไฟคาบสมุทรอินเดียใหญ"
 RAJ_great_indian_peninsula_railway_desc:0 "การที่รัฐบาลเขาควบคุมทางรถไฟคาบสมุทรอินเดียใหญในป 1925 หมายความวาการขยายและปรับปรุงเปนหนาที่ของเรา ประชากรที่เพิ่มขึ้นตองการโครงสรางพื้นฐานดานการขนสงที่ดีกวาเดิม"
 RAJ_industrial_expansion:0 "การขยายตัวทางอุตสาหกรรม"
 RAJ_industrial_expansion_desc:0 "ผูคนหลายรอยลานคนเรียกอินเดียวาบาน ไมมีเหตุผลใดที่ประชากรเหลานี้จะไมเปนรากฐานของยักษใหญทางอุตสาหกรรม"
 RAJ_tata_steel:0 "ทาทาสตีล"
 RAJ_tata_steel_desc:0 "ทาทาสตีลกําลังจะกลายเปนผูผลิตเหล็กกลารายใหญที่สุดในจักรวรรดิ การผลิตที่มากขึ้นจะยิ่งผลักดันการพัฒนาอินเดียใหทันสมัย"
 RAJ_assam_oil:0 "นํ้ามันอัสสัม"
 RAJ_assam_oil_desc:0 "อัสสัมคือศูนยกลางการผลิตนํ้ามันของอินเดีย โดยเฉพาะโรงกลั่นที่ดิกบอย การเขาถึงทรัพยากรนี้ตองไดรับการขยายและใชประโยชน"
 RAJ_indian_institute_of_science:0 "สถาบันวิทยาศาสตรอินเดีย"
 RAJ_indian_institute_of_science_desc:0 "วิทยาเขตสถาบันวิทยาศาสตรอินเดียในบังกาลอรเปดโอกาสใหคนเกงที่สุดของอินเดียชวยผลักดันความกาวหนาของเรา"
 RAJ_institute_of_fundamental_research:0 "สถาบันวิจัยพื้นฐาน"
 RAJ_institute_of_fundamental_research_desc:0 "นักวิทยาศาสตรและนักอุตสาหกรรมชั้นนําบางคนของเรากําลังผลักดันการตั้งสถาบันวิจัยพื้นฐานแหงใหม เพื่อใชประโยชนจากการคนพบลาสุดทางวิทยาศาสตรกายภาพ"
 RAJ_research_collaboration:0 "ความรวมมือดานการวิจัย"
 RAJ_research_collaboration_desc:0 "อังกฤษแสดงใหเราเห็นขอดีของการแบงปนความกาวหนาทางวิทยาศาสตรระหวางพันธมิตรใกลชิด ทั้งฝายของเราจะวิจัยและพัฒนาในยามสงครามไดอยางมีประสิทธิภาพยิ่งขึ้น หากเราดําเนินการที่จําเปนเพื่อประสานงานเรื่องนี้"
 RAJ_expand_mazagon_dock:0 "ขยายอูตอเรือมาซากอน"
 RAJ_expand_mazagon_dock_desc:0 "อูตอเรือมาซากอนในมุมไบคือผูตอเรือที่สําคัญที่สุดของเราบนชายฝงตะวันตก ในวิกฤตโลกครั้งนี้ อูตองมีขีดความสามารถมากขึ้น"
 RAJ_found_scindia_shipyard:0 "กอตั้งอูตอเรือซินเดีย"
 RAJ_found_scindia_shipyard_desc:0 "เราตองมีอูตอเรือบนชายฝงตะวันออกของประเทศ การกอตั้งอูตอเรือซินเดียที่วิศาขาปตนัมจึงสมเหตุสมผลสําหรับอนาคตทางทะเลของเรา"
 RAJ_royal_indian_navy:0 "กองทัพเรือหลวง[ROOT.GetAdjective]"
 RAJ_royal_indian_navy_desc:0 "กองทัพเรือหลวง[ROOT.GetAdjective]จะตองขยายตัวอยางรวดเร็ว ยุทธวิธีใหมและเรือใหมควรเปนสิ่งที่ใหความสําคัญเปนอันดับแรก"
 RAJ_screening_effort:0 "การทุมเทดานเรือคุมกัน"
 RAJ_screening_effort_desc:0 "อินเดียมีบทบาทสําคัญในการปองกันเสนทางตอนใตสูคลองสุเอซ ภารกิจคุมกันและอารักขาจะชวยใหเสบียงและทหารที่จําเปนยิ่งไปถึงสมรภูมิยุโรปและแอฟริกาได"
 RAJ_cruiser_effort:0 "การทุมเทดานเรือลาดตระเวน"
 RAJ_cruiser_effort_desc:0 "ในตอนนี้เรือลาดตระเวนก็เพียงพอสําหรับการพัฒนาและขยายแสนยานุภาพทางเรือของ[ROOT.GetAdjective]"
 RAJ_submarine_effort:0 "การทุมเทดานเรือดํานํ้า"
 RAJ_submarine_effort_desc:0 "ดวยแสนยานุภาพเรือผิวนํ้าของญี่ปุนที่ผงาดขึ้นในเอเชีย การทุมพลังของเราไปใตทะเลและโจมตีจากเรือดํานํ้าอาจสมเหตุสมผล"
 RAJ_capital_ship_effort:0 "การทุมเทดานเรือหลัก"
 RAJ_capital_ship_effort_desc:0 "ในฐานะดานหนาของอังกฤษ อินเดียไดเห็นพลังของเรือหลักในการครองทะเลมาแลว เราควรสรางเรือลาดตระเวนหนักและเรือประจัญบานของเราเอง"
 RAJ_modernizing_navy:0 "การปรับปรุงกองทัพเรือใหทันสมัย"
 RAJ_modernizing_navy_desc:0 "เครื่องยนตที่ดีขึ้น พื้นที่ลูกเรือมากขึ้น ความเร็วสูงขึ้น และปนใหญขึ้น อีกไมนานกองทัพเรืออินเดียจะยืนหยัดเคียงขางกองทัพเรือที่ดีที่สุดในทวีป"
 RAJ_east_india_railways:0 "ทางรถไฟอินเดียตะวันออก"
 RAJ_east_india_railways_desc:0 "การที่รัฐบาลควบคุมทางรถไฟอินเดียตะวันออก ทําใหการตัดสินใจทั้งหมดเรื่องการขยายและปรับปรุงอยูในมือรัฐมนตรีของเรา"
 RAJ_integrate_princely_railways:0 "ผนวกรวมทางรถไฟของรัฐมหาราชา"
 RAJ_integrate_princely_railways_desc:0 "มหาราชาอินเดียบางพระองคไดลงทุนสรางระบบรถไฟของตนเอง แตจนถึงตอนนี้ยังเชื่อมตอกับทางรถไฟที่ราชสรางไวไดไมดีนัก ตองทําอะไรสักอยางเพื่อเชื่อมโยงรถไฟของชาติเขาดวยกัน"
 RAJ_ishapore_arsenal:0 "คลังแสงอิชาปอร"
 RAJ_ishapore_arsenal_desc:0 "คลังแสงและโรงงานปนไรเฟลอิชาปอรดําเนินการมาตั้งแตศตวรรษที่ 18 เปนตนกําเนิดนวัตกรรมดานการออกแบบปนมากมาย และเปนหัวใจของระบบการผลิตอาวุธของเรา"
 RAJ_clamp_down_on_corruption:0 "ปราบปรามการทุจริต"
 RAJ_clamp_down_on_corruption_desc:0 "แมอังกฤษจะพยายามขยายระบบรถไฟของอินเดียทางอุตสาหกรรม แตประโยชนจากการขยายตัวนั้นดูเหมือนจะตกถึงอินเดียนอยมาก การทุจริตและการคดโกงฝงรากลึกในภาคการขนสง และเราตองแสดงใหเห็นวาไดลงมือจัดการเรื่องนี้"
 RAJ_strengthen_ties_with_british_investors:0 "กระชับความสัมพันธกับนักลงทุนอังกฤษ"
 RAJ_strengthen_ties_with_british_investors_desc:0 "การขยายโรงงานและทรัพยากรของเรายังคงพึ่งพาทุนจากอังกฤษอยางหนัก จนกวาเราจะมีภาคธนาคารที่แข็งแกรงของตนเอง เราตองคุกเขาขอความชวยเหลือจากลอนดอนตอไป"
 RAJ_british_rail_investors:0 "นักลงทุนรถไฟอังกฤษ"
 RAJ_british_rail_investors_desc:0 "โครงสรางพื้นฐานดานพลเรือนและการขนสงในอินเดียตองการเงินทุนกอนใหญจากนักการเงินอังกฤษ"
 RAJ_british_arms_investors:0 "นักลงทุนอาวุธอังกฤษ"
 RAJ_british_arms_investors_desc:0 "หากเราตองการใหโรงงานอาวุธเดินเครื่องไดอยางรวดเร็ว เราจะตองขอใหธนาคารอังกฤษลงทุนในโครงสรางพื้นฐานทางทหารของเรา"
