l_english:
 WHILE_FOCUSING:0 "ระหวางดําเนินแผนนี้ จะเกิดผลดังตอไปนี้:\n$EFF$"
 generic_focus:0 "แผนยุทธศาสตรแหงชาติ"
 army_effort:0 "ทุมเทดานกองทัพบก"
 army_effort_desc:0 "แมสงครามทางอากาศและทางทะเลจะมีบทบาทมากขึ้นเรื่อย ๆ แตการรบภาคพื้นดินยังคงเปนหัวใจของสงครามในอนาคต ดวยการเตรียมพรอม เราจะไมตองกลับไปเผชิญนรกในสนามเพลาะอีก"
 equipment_effort:0 "ทุมเทดานยุทโธปกรณ"
 equipment_effort_desc:0 "ขีดจํากัดของยุทโธปกรณที่ทหารราบแบกไปไดถูกผลักดันใหกาวไกลอยูเสมอ เราจะมุงมอบเครื่องมือที่ดีที่สุดใหแกทหารของเรา"
 motorization_effort:0 "ทุมเทดานยานยนต"
 motorization_effort_desc:0 "ความคลองตัวและการปองกันเปนสิ่งสําคัญยิ่งในการนําทหารราบเขาและออกจากสนามรบอยางปลอดภัย การมุงพัฒนาดานนี้จะชวยใหเราปฏิบัติการไดอยางรวดเร็ว"
 doctrine_effort:0 "ทุมเทดานหลักนิยม"
 doctrine_effort_desc:0 "หลักนิยมทางทหารที่กําหนดการรบภาคพื้นดินในมหาสงครามนั้นลาสมัยไปแลว เราตองใหผูมีปญญาเลิศที่สุดของเรามารวมกันวางรากฐานความคิดทางทหารแหงอนาคต"
 equipment_effort_2:0 "ทุมเทดานยุทโธปกรณ II"
 equipment_effort_2_desc:0 "เราจะเดินหนาพยายามตอไปเพื่อใหทหารราบและหนวยสนับสนุนของเรามียุทโธปกรณที่ดีที่สุดในยุค"
 mechanization_effort:0 "ทุมเทดานยานเกราะลําเลียงพล"
 mechanization_effort_desc:0 "เมื่อทบทวนศักยภาพของทหารราบยานยนตใหม เราสามารถผลักดันขีดจํากัดของยานพาหนะที่สรางไดในปจจุบัน"
 doctrine_effort_2:0 "ทุมเทดานหลักนิยม II"
 doctrine_effort_2_desc:0 "สนามรบเปลี่ยนแปลงไปไมเพียงในชวงระหวางสงคราม แตยังรวมถึงในความขัดแยงครั้งหลัง ๆ ดวย เราตองทบทวนหลักนิยมของเราอยางตอเนื่องใหสอดคลองกับความเปลี่ยนแปลงนี้"
 equipment_effort_3:0 "ทุมเทดานยุทโธปกรณ III"
 equipment_effort_3_desc:0 "แทนที่จะลอกเลียนหรือซื้อยุทโธปกรณจากตางชาติ เราควรมุงเปนผูนําของโลกดานอาวุธทหารราบ"
 armor_effort:0 "ทุมเทดานยานเกราะ"
 armor_effort_desc:0 "ดวยบทเรียนจากการทําใหทหารราบเปนหนวยยานเกราะลําเลียงพล เราสามารถพัฒนายานเกราะของเราไดเชนกัน"
 special_forces:0 "กองกําลังพิเศษ"
 special_forces_desc:0 "เราตองการกองกําลังชั้นยอด ทหารภูเขาและพลรมควรเปนสิ่งที่เราใหความสําคัญเปนอันดับแรก"
 aviation_effort:0 "ทุมเทดานการบิน"
 aviation_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yฐานทัพอากาศ§!"
 aviation_effort_desc:0 "ไมมีที่ใดที่ความกาวหนาทางเทคโนโลยีจะรวดเร็วไปกวาการสงครามทางอากาศ การบินคือสาขาที่ชาติสมัยใหมทุกชาติตองเชี่ยวชาญ"
 fighter_focus:0 "มุงเนนเครื่องบินขับไล"
 fighter_focus_desc:0 "การตอสูกลางอากาศไมไดจบลงพรอมกับมหาสงคราม การนําหนาในการพัฒนาเครื่องบินขับไลจะทําใหเราไดเปรียบในอนาคต"
 bomber_focus:0 "มุงเนนเครื่องบินทิ้งระเบิด"
 bomber_focus_desc:0 "เมื่อคนรุนหลังพูดถึงความสยดสยองของสงครามในยุคนี้ ไฟที่โปรยลงมาจากฟากฟาจะเปนภาพที่โดดเดน เราจะทําทุกทางเพื่อใหเรื่องเลาเหลานั้นถูกเลาโดยศัตรูของเรา"
 aviation_effort_2:0 "ทุมเทดานการบิน II"
 aviation_effort_2_desc:0 "ความกาวหนาดานการบินที่มากขึ้นเปนสิ่งจําเปน เพื่อผสานกองทัพอากาศของเราเขากับเหลาทัพอื่นไดอยางกลมกลืน"
 CAS_effort:0 "ทุมเทดาน CAS"
 CAS_effort_desc:0 "กองทัพสมัยใหมตองการการสนับสนุนจากยานพาหนะ ไมเพียงบนพื้นดิน แตยังรวมถึงบนทองฟาดวย"
 rocket_effort:0 "ทุมเทดานจรวด"
 rocket_effort_desc:0 "เครื่องยนตจรวดและเครื่องยนตไอพนทําใหทั้งอากาศยานไรคนขับและมีคนขับทําความเร็วไดอยางที่ไมเคยมีมากอน การบุกเบิกเทคโนโลยีเหลานี้จะชวยใหเราจูโจมขาศึกไดอยางไมทันตั้งตัว"
 NAV_effort:0 "ทุมเทดาน NAV"
 NAV_effort_desc:0 "เชนเดียวกับที่การสงครามทางทะเลยุคใหมสวนหนึ่งเกิดขึ้นใตผิวนํ้า อีกสวนหนึ่งก็เกิดขึ้นบนทองฟาเหนือนานนํ้า"
 naval_effort:0 "ทุมเทดานกองทัพเรือ"
 naval_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yอูตอเรือ§!"
 naval_effort_desc:0 "การขยายกองทัพเรือควรเปนภารกิจสําคัญอันดับแรกของเรา จัดสรรทรัพยากรทั้งหมดที่มีใหกับอูตอเรือแหงใหมและการวิจัยเรือผิวนํ้าขนาดเบา"
 GER_naval_effort2:0 "ขยายสิ่งอํานวยความสะดวกของอูตอเรือ"
 GER_naval_effort2_desc:0 "เพื่อฟนฟูกองทัพเรือที่ควรคาแกการจดจําอยางแทจริง เราตองขยายขีดความสามารถในการตอเรืออยางมหาศาล"
 GER_naval_effort2_tt: "สราง §Yอูตอเรือ 2 แหง§! ใน §Y2§! รัฐชายฝงที่อยูภายใตการควบคุมของ §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 flexible_navy:0 "กองทัพเรือที่ยืดหยุน"
 flexible_navy_desc:0 "การปฏิรูปการสงครามทางทะเลใหรองรับความกาวหนาของเทคโนโลยีเรือดํานํ้า จะชวยใหเราโจมตีขบวนเรือลําเลียงของขาศึกไดอยางมีประสิทธิภาพ"
 large_navy:0 "กองทัพเรือขนาดใหญ"
 large_navy_desc:0 "การปรับหลักนิยมทางเรือใหรองรับเรือขนาดใหญและรับประกันความปลอดภัยของขบวนเรือลําเลียงทางการคา จะสอนเราไดมากวาเราตองการเรือแบบใด"
 submarine_effort:0 "ทุมเทดานเรือดํานํ้า"
 submarine_effort_desc:0 "การสงครามเรือดํานํ้าคือพัฒนาการทางเรือที่นาตื่นเตนที่สุดนับตั้งแตการประดิษฐเรือตอรปโด เราไมควรเพียงปองกันตนเองจากเรือดํานํ้า แตควรใชมันโจมตีการเดินเรือของขาศึกดวย"
 cruiser_effort:0 "ทุมเทดานเรือลาดตระเวน"
 cruiser_effort_desc:0 "กอนจะกาวเขาสูการวิจัยเรือประจัญบานขั้นสูง เรือลาดตระเวนที่มีขนาดเล็กกวาจําเปนตองไดรับการทดแทนเสียกอน"
 destroyer_effort:0 "ทุมเทดานเรือพิฆาต"
 destroyer_effort_desc:0 "จากการศึกษาการออกแบบและการใชเรือดํานํ้าเชิงยุทธศาสตร เราไดเรียนรูวิธีตอตานยุทธศาสตรเหลานั้นดวย เรือพิฆาตจะมีบทบาทสําคัญยิ่งในเรื่องนี้"
 capital_ships_effort:0 "ทุมเทดานเรือหลัก"
 capital_ships_effort_desc:0 "ชาติที่มีเรือประจัญบานมากที่สุดจะครองมหาสมุทร เรือประจัญบานและเรือบรรทุกเครื่องบินคือตัวแทนของความเหนือกวาทางทะเลทั้งแบบเกาและแบบใหม"
 industrial_effort:0 "ทุมเทดานอุตสาหกรรม"
 industrial_effort_desc:0 "ทุมเทความพยายามทางการเมืองทั้งหมดเพื่อสรางอุตสาหกรรมพลเรือนใหกาวกระโดดไปขางหนา"
 industrial_effort_2:0 "ทุมเทดานอุตสาหกรรม II"
 industrial_effort_2_desc:0 "ดวยเจตจํานงอันแนวแนดั่งเหล็กและจรรยาบรรณการทํางานที่ไมลดละ เราสามารถระดมประชาชนเพื่อการพัฒนาอุตสาหกรรมครั้งใหญอีกครั้ง"
 construction_effort:0 "ทุมเทดานการกอสราง"
 construction_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yโรงงานพลเรือน§!"
 construction_effort_desc:0 "ขีดความสามารถทางอุตสาหกรรมพลเรือนตองไมถูกมองขาม แมในยามที่สงครามกําลังคุกคามโลก"
 production_effort:0 "ทุมเทดานอาวุธยุทโธปกรณ"
 production_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yโรงงานทหาร§!"
 production_effort_desc:0 "ถาสรางรถแทรกเตอรได ก็สรางรถถังได! เราตองไมปลอยใหขีดความสามารถในการผลิตทางทหารลาหลัง"
 construction_effort_2:0 "ทุมเทดานการกอสราง II"
 construction_effort_2_desc:0 "การขยายโรงงานอยางตอเนื่องจะชวยเรงการผลิตสินคาเพื่อการคาและการกอสรางตอไป"
 production_effort_2:0 "ทุมเทดานอาวุธยุทโธปกรณ II"
 production_effort_2_desc:0 "การพยายามดัดแปลงโรงงานพลเรือนใหผลิตยุทโธปกรณทางทหารนั้นไรประสิทธิภาพ เราควรมุงเตรียมการผลิตทางทหารตั้งแตบัดนี้"
 production_effort_3:0 "ทุมเทดานอาวุธยุทโธปกรณ III"
 production_effort_3_desc:0 "การขยายโรงงานทหารอยางตอเนื่องเปนสิ่งจําเปนเพื่อตอบสนองความตองการยุทโธปกรณใหม"
 infrastructure_effort:0 "ทุมเทดานโครงสรางพื้นฐาน"
 infrastructure_effort_desc:0 "ประเทศที่ไมมีโครงสรางพื้นฐานที่เหมาะสมยอมไมอาจดําเนินโครงการหรือการกอสรางขั้นสูงได"
 infrastructure_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yโครงสรางพื้นฐาน§!"
 synth_oil_effort_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yโรงกลั่นสังเคราะห§!"
 infrastructure_effort_2:0 "ทุมเทดานโครงสรางพื้นฐาน II"
 infrastructure_effort_2_desc:0 "การขยายโครงสรางพื้นฐานของเราตอไปจะเอื้อใหเกิดการขนสงและการสื่อสารที่จําเปนสําหรับโครงการลับเทคโนโลยีขั้นสูง"
 construction_effort_3:0 "ทุมเทดานการกอสราง III"
 construction_effort_3_desc:0 "การขยายเครือขายโครงสรางพื้นฐานไดเพิ่มขีดความสามารถในการกอสรางของเราอยางมีนัยสําคัญ"
 nuclear_effort:0 "ทุมเทดานนิวเคลียร"
 nuclear_effort_desc:0 "ขณะที่เรายืนอยูบนขอบของการคนพบที่จะเปลี่ยนโลก เราไมอาจปลอยใหผูอื่นจุดไฟที่วันหนึ่งอาจเผาผลาญทั้งโลกได"
 extra_tech_slot:0 "ชองการวิจัยเพิ่มเติม"
 extra_tech_slot_desc:0 "การขยายตัวทางอุตสาหกรรมและความกาวหนาอื่น ๆ เมื่อไมนานมานี้ อาจชวยใหเราดําเนินการวิจัยและพัฒนาหลายโครงการไปพรอมกันไดมากขึ้น"
 extra_tech_slot_2:0 "ชองการวิจัยเพิ่มเติม II"
 extra_tech_slot_2_desc:0 "การพัฒนาอุตสาหกรรมอยางรวดเร็วของชาติเราไดเปดโอกาสใหม ๆ ดานการวิจัยและพัฒนาที่เราควรไขวควา"
 technology_sharing:0 "การแบงปนเทคโนโลยี"
 technology_sharing_desc:0 "ดวยการแบงปนความกาวหนาทางเทคโนโลยีกับพันธมิตร ฝายของเราทั้งหมดจะสามารถดําเนินการวิจัยและพัฒนาในยามสงครามไดอยางมีประสิทธิภาพยิ่งขึ้น"
 secret_weapons:0 "อาวุธลับ"
 secret_weapons_desc:0 "การทุมทรัพยากรสวนเกินทั้งหมดไปพัฒนารถถังและเครื่องบินนั้นเปนเรื่องที่นาดึงดูดใจ แตกุญแจสูชัยชนะในสงครามอยูในศาสตรแขนงใหมทั้งหมด ไดแก อิเล็กทรอนิกส จรวด และการวิจัยนิวเคลียร"
 political_effort:0 "ทุมเทดานการเมือง"
 political_effort_desc:0 "หากจะเปลี่ยนแปลงโลก เราตองสามารถเปลี่ยนแปลงประเทศของเราเองไดกอน การเสริมสรางสถานะทางการเมืองควรมาเปนอันดับแรก"
 collectivist_ethos:0 "อุดมคติแบบรวมหมู"
 collectivist_ethos_desc:0 "ศัตรูอาจใชวิธีแบงแยกแลวพิชิตชาติที่ออนแอกวา แตประชาชนของเราจะยืนหยัดเปนหนึ่งเดียว หนึ่งคนเพื่อทุกคน และทุกคนเพื่อหนึ่งคน"
 liberty_ethos:0 "อุดมคติแหงเสรีภาพ"
 liberty_ethos_desc:0 "ในยุคที่พวกคลั่งอุดมการณพยายามบีบคั้นจิตวิญญาณมนุษย เราจะปกปองสิทธิเสรีภาพของปจเจกบุคคล"
 militarism:0 "ลัทธิทหารนิยม"
 militarism_desc:0 "ผูที่มองกองทัพเปนเพียงความชั่วรายที่จําเปน ยอมถูกลิขิตใหลังเลเมื่อเผชิญสงคราม เราจะปลูกฝงลัทธิทหารนิยมลงในวัฒนธรรมของเราเพื่อใหกลายเปนชนชาติแหงนักรบ"
 political_correctness:0 "ความถูกตองทางการเมือง"
 political_correctness_desc:0 "ผูที่มีความเห็นคอนขางขัดแยงหรือนาอับอายดูเหมือนจะกังวลวามีการสมคบคิดวงกวางเพื่อตอตานพวกเขา ฟงดูเปนความคิดที่ยอดเยี่ยมทีเดียว"
 neutrality_focus:0 "มุงเนนความเปนกลาง"
 neutrality_focus_desc:0 "แมผูอื่นอาจอางวาตองใชความกลาหาญและปญญาในการเลือกขางในความขัดแยงระดับโลก แตเรารูดีวาการปฏิเสธที่จะเลือกขางตองใชมากกวานั้น"
 interventionism_focus:0 "มุงเนนการแทรกแซง"
 interventionism_focus_desc:0 "เราใหคุณคากับเสรีภาพของมวลมนุษย ไมใชเพียงพลเมืองของเราเอง หากการปองกันทรราชหมายถึงสงคราม ก็จงเปนเชนนั้น"
 military_youth:0 "ยุวชนทหาร"
 military_youth_desc:0 "องคกรที่สงเสริมวินัยและการศึกษาทางการเมืองแกเยาวชนของชาติจะปลูกฝงความภักดีและการเสียสละตั้งแตเยาววัย"
 deterrence:0 "การปองปราม"
 deterrence_desc:0 "หากยืนหยัดอยูเพียงลําพัง เราแทบไมไดประโยชนจากสงคราม โชคดีที่เรารูวาการปองกันที่ดีที่สุดคือการปองกันที่ทุกคนรูจักดีจนไมตองนํามาใชจริง"
 volunteer_corps:0 "กองอาสาสมัคร"
 volunteer_corps_desc:0 "การบังคับใหประชาชนตายเพื่ออุดมคติแหงเสรีภาพคงเปนเรื่องยอนแยง แตการเปดชองทางใหผูที่ตองการชวยเหลือผูคนในตางแดนนั้นไมใช"
 paramilitarism:0 "ลัทธิกึ่งทหาร"
 paramilitarism_desc:0 "หลักการทางทหารสามารถนําไปใชนอกกองทัพได ดวยการพัฒนาหนวยกึ่งทหารเพื่อเสริมกําลังกองทัพ ประชาชนจะไดรับการฝกทางทหารมากขึ้น"
 indoctrination_focus:0 "การปลูกฝงอุดมการณ"
 indoctrination_focus_desc:0 "เมื่ออุดมการณของเราไดรับการสถาปนาบนพื้นฐานของความจริงแลว ก็ยอมสอนกันไดในฐานะความจริง การศึกษาและสื่อตองสะทอนบทเรียนนี้"
 foreign_expeditions:0 "การสํารวจทางทหารในตางแดน"
 foreign_expeditions_desc:0 "เมื่อศัตรูของเราพรอมจะแทรกแซงความขัดแยงในแดนไกลเพื่ออุดมการณของพวกเขา เราก็ตองพรอมทําเชนเดียวกันเพื่ออุดมการณของเรา"
 why_we_fight:0 "เหตุผลที่เราตองสู"
 why_we_fight_effect:0 "หากเราไมมีจิตวิญญาณ §Yนโยบายตางประเทศแบบเปนกลาง§! เราจะสามารถกอตั้งฝายได\n"
 why_we_fight_desc:0 "โลกกําลังไมปลอดภัยขึ้นเรื่อย ๆ ประชาชนของเราจําเปนตองเห็นความโหดรายที่ผูกระหายอํานาจกําลังกอ ถึงเวลาแลวที่เราจะปลุกระดมประชาชนใหรวมอุดมการณของเรา และทําใหทุกคนพรอมสูเพื่อเสรีภาพของเรา"
 political_commissars:0 "ผูตรวจการทางการเมือง"
 political_commissars_desc:0 "เพื่อใหนโยบายของเราไดรับการปฏิบัติตามในทางทหาร เราจะแตงตั้งเจาหนาที่ทางการเมืองเขาไปในกองทัพ"
 internationalism_focus:0 "มุงเนนสากลนิยม"
 internationalism_focus_desc:0 "อุดมการณไมมีพรมแดน ชาติอื่นอาจเรียกตนวามีอธิปไตย แตความเชื่อมั่นของเราอยูเหนือขออางเชนนั้น"
 nationalism_focus:0 "มุงเนนชาตินิยม"
 nationalism_focus_desc:0 "ชาติของเรามีเอกลักษณ และความสําเร็จทางการเมืองของเราจะเกิดขึ้นไดก็แตที่นี่เทานั้น เราตองตอสูเพื่อมันไมวาตองแลกดวยอะไร"
 ideological_fanaticism:0 "ความคลั่งไคลในอุดมการณ"
 ideological_fanaticism_desc:0 "คุณคาและเปาหมายทางการเมืองที่เราสถาปนาไวควรคาแกการสละชีพไมตางจากศรัทธาโบราณใด ๆ ผูศรัทธาทุกคนควรพรอมเผชิญความตาย และผูที่หลงทางก็ควรเตรียมใจเผชิญความตายเชนกัน"
 air_innovation:0 "นวัตกรรมทางอากาศ"
 air_innovation_desc:0 "สงครามสมัยใหมไมอาจชนะไดหากไมครองทองฟา เราตองทําทุกอยางที่ทําไดเพื่อพัฒนากองทัพอากาศ!"
 air_innovation_2:0 "นวัตกรรมทางอากาศ II"
 air_innovation_2_desc:0 "ทุกความไดเปรียบที่เราไดมาบนทองฟาลวนมีคายิ่ง เราควรทุมความพยายามทั้งหมดในการพัฒนาเครื่องบินขับไล"
 naval_air_effort:0 "ทุมเทดานการบินนาวี"
 naval_air_effort_desc:0 "ชาวอเมริกันไดแสดงใหเห็นถึงประสิทธิผลของการโจมตีทางอากาศตอเปาหมายทางทะเลมาตั้งแตป 1921 เราไมควรละเลยกองทัพอากาศสาขานี้ หากเราตั้งใจจะทําสงครามกับมหาอํานาจทางทะเล"
 german_focus:0 "แผนยุทธศาสตรแหงชาติเยอรมนี"
 GER_autobahn:0 "ไรชสเอาโทบาน"
 GER_autobahn_tt:0 "เพิ่ม §Yโครงสรางพื้นฐาน§! สูงสุดใน §Yบรันเดินบวรค§!, §Yฮันโนเฟอร§!, §Yทือริงเงิน§! และ §Yฟรังเคิน§!"
 GER_autobahn_desc: "นับตั้งแตเริ่มตนในป 1933 โครงการ [GetAutobahnName] ประสบความสําเร็จอยางงดงาม การกอสรางชวยลดการวางงาน และถนนกวางใหญเหลานี้ยืนหยัดเปนอนุสรณแหงการฟนตัวทางเศรษฐกิจของ [GER.GetName] อยางไรก็ตาม ยังมีงานอีกมากที่ตองทํา"
 GER_west_wall:0 "กําแพงตะวันตก"
 GER_west_wall_desc:0 "กําแพงตะวันตกทอดขนานไปกับแนวมาฌีโนอันเลื่องชื่อของฝรั่งเศส โดยครอบคลุมพื้นที่สวนใหญเดียวกับที่แนวซีกฟรีดเคยตั้งอยูในมหาสงครามครั้งกอน การเสริมความแข็งแกรงของแนวปองกันนี้จะชวยใหเรารักษาพรมแดนไดดวยกําลังพลที่นอยลง และปลดกองพลไปรวมการทัพทางตะวันออกที่อาจเกิดขึ้นได"
 GER_west_wall_tt:0 "§Rหากไรนลันทไดรับการฟนฟูกําลังทหารแลว คุณจะไดรับเพิ่มเติม:§!\n"
 GER_west_wall_forts:0 "เพิ่ม §Yปอมภาคพื้นดิน 12 แหง§! บนพรมแดนฝรั่งเศส\n"
 GER_tactical_air_effort:0 "ทุมเทดานการบินทางยุทธวิธี"
 GER_tactical_air_effort_desc:0 "ชัยชนะจะไดมาดวยการทําลายลางกองกําลังภาคพื้นดินของขาศึก เราตองมุงสนับสนุนกองทัพของเราดวยการโจมตีทางยุทธวิธีตอเปาหมายทั้งระยะใกลและในเชิงลึก"
 GER_long_range_escorts:0 "เครื่องบินคุมกันพิสัยไกล"
 GER_long_range_escorts_desc:0 "เครื่องบินทิ้งระเบิดทางยุทธวิธีและทางยุทธศาสตรของเราตองการเครื่องบินคุมกันพิสัยไกลขึ้น เพื่อคุมครองตลอดเสนทางไปยังพื้นที่เปาหมายและเดินทางกลับ"
 GER_strategic_air_effort:0 "ทุมเทดานการบินทางยุทธศาสตร"
 GER_strategic_air_effort_desc:0 "ชัยชนะจะไดมาดวยการทําลายอุตสาหกรรมของขาศึก เราตองมุงความพยายามไปที่การออกแบบและผลิตเครื่องบินทิ้งระเบิดทางยุทธศาสตร"
 GER_army_innovation:0 "นวัตกรรมกองทัพบก"
 GER_army_innovation_desc:1 "ไฮนทซ กูเดรีอัน และนักทฤษฎีหัวกาวหนาคนอื่น ๆ กําลังผลักดันหลักนิยมใหมอันกลาหาญที่เนนการสื่อสาร การระบุ 'ชแวรพุงคเทอ' (จุดศูนยถวง) และการรวมกําลังผสมเหลาเฉพาะจุด การใหอิสระแกพวกเขาอาจชวยใหเราหลีกเลี่ยงโรงบดเนื้อมนุษยอันนาสยดสยองของมหาสงครามได"
 GER_soviet_treaty:1 "สนธิสัญญากับ[GER.GetTheUSSRName]"
 GER_soviet_treaty_desc:1 "เราสามารถทําสนธิสัญญาวิจัยฉบับใหมกับ [SOV.GetNameDef] โดยมุงพัฒนารถถังที่ดีขึ้นเปนหลัก หากพวกเขาตกลง เราจะเปดโรงเรียนรถถังที่เราปดไปที่คามาในป 1933 ไดอีกครั้ง แนนอนวาความรวมมือจาก[SOV.GetAdjective]ยอมหมายความวาพวกเขาเองก็จะไดประโยชนจากนวัตกรรมที่เกิดขึ้นดวย..."
 GER_air_innovation_2:0 "นวัตกรรมทางอากาศ II"
 GER_air_innovation_2_desc:0 "ภารกิจของกระทรวงการบินแหงไรชมีความสําคัญสูงสุด ลุฟทวัฟเฟอตองเปนกองทัพอากาศที่กาวหนาที่สุดในโลก!"
 GER_army_innovation_2:0 "นวัตกรรมกองทัพบก II"
 GER_army_innovation_2_desc:0 "บทเรียนที่ไดจากสถานที่ของเราในสหภาพโซเวียตจะชวยใหเราพัฒนาหลักนิยมและยุทโธปกรณไดยิ่งขึ้น แตคราวนี้เราจะเก็บความกาวหนาไวกับตัวเอง!"
 GER_rocketry_focus:0 "วิทยาการจรวด"
 GER_rocketry_focus_desc:0 "ระบบขับเคลื่อนดวยจรวดคือกุญแจสูนวัตกรรมครั้งใหญในเหลาทัพทั้งสาม"
 GER_wunderwaffe:0 "อาวุธมหัศจรรย"
 GER_wunderwaffe_desc:0 "ไฮเซนแบรคและฟอน เบรานใจจดใจจออยากสํารวจแนวคิดบางอยางเกี่ยวกับอาวุธวันสิ้นโลกอยางแทจริง สิ่งที่พวกเขาตองการก็แคทรัพยากรเพิ่มเติม..."
 GER_mol_rib_pact:1 "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc:1 "สนธิสัญญามิตรภาพและไมรุกรานกับ[GER.GetTheUSSRName]อาจชวนคลื่นไส แตจะทําใหนํ้ามันอันลํ้าคาของพวกเขายังคงไหลเขาสูเยอรมนี ภาคผนวกลับจะแบงดินแดนโรมาเนีย โปแลนด ลิทัวเนีย ลัตเวีย เอสโตเนีย และฟนแลนดออกเปนเขตอิทธิพลของ[GER.GetAdjective]และ[SOV.GetAdjective]..."
 GER_mol_rib_pact_tt:1 "ทํา§Yสนธิสัญญาไมรุกราน§!กับ§Yสหภาพโซเวียต§! และตกลง§Yแบงโปแลนด§!ระหวาง [SOV.GetName] และเยอรมนี\n"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST: "กติกาสัญญา[GetMolotovInMRPact]-[GetRibbentropInMRPact]"
 SOV_MOLOTOV_RIBBENTROP_NAME_EXILES:0 "กติกาสัญญาแบงโปแลนด"
 GER_soviet_ally:1 "พันธมิตรกับ[GER.GetTheUSSRName]"
 GER_soviet_ally_desc:1 "บางทีเราอาจวางความแตกตางทาง[GER.GetUSSRAllianceDesc]ที่มีกับ[GER.GetRussiansDemonym]ไวกอน และหันมาเนนสิ่งที่เรามีรวมกันแทน นั่นคือความเกลียดชังเสรีนิยมอันเห็นแกตัวและโลกตะวันตกที่เสื่อมทราม หากมี[GER.GetTheUSSRName]เปนพันธมิตร เราจะเขาถึงทรัพยากรทั้งหมดที่ตองการ และแนนอน รวมถึงแสนยานุภาพทางทหารของพวกเขาดวย..."
 SOV_USSR_ALLIANCE_DESC_COMMUNIST:0 "อุดมการณ"
 SOV_USSR_ALLIANCE_DESC_EXILES:0 "ชาตินิยม"
 GER_turkey_puppet:0 "ตุรกีหุนเชิด"
 GER_turkey_puppet_desc:0 "ตุรกีถูกบีบอยูระหวางเรากับสหภาพโซเวียต หากถูกกดดัน ชาวเติรกนาจะยอมทําตามความตองการของเราและกลายเปนรัฐหุนเชิด โดยเปนสวนหนึ่งของขอตกลง สหภาพโซเวียตจะไดดินแดนบางสวนทางตะวันออกของตุรกี อยางไรก็ตาม หากพวกเขาปฏิเสธขอเรียกรอง นั่นยอมหมายถึงสงคราม"
 GER_rhineland:0 "ไรนลันท"
 GER_rhineland_desc:0 "ไรนลันทถูกปลอดทหารมาตั้งแตมหาสงครามสิ้นสุด แตการดูหมิ่นนี้จะไมดํารงอยูอีกตอไป! เยอรมนีเปนชาติที่มีอธิปไตยและมีอิสระที่จะเคลื่อนทัพไปที่ใดก็ไดภายในพรมแดนของตน!"
 GER_rhineland_ultimatum:0 "§Rการฟนฟูกําลังทหารอาจถูกยกเลิก หากคุณถูกเผชิญหนาแลวยอมถอย§!\n"
 GER_japan_friend:0 "ผูกมิตรกับญี่ปุน"
 GER_japan_friend_desc:0 "เรามีความสัมพันธอันเกิดดอกออกผลกับจีนมายาวนาน แตความทะเยอทะยานของเราอาจไดประโยชนมากกวาหากหันไปจับมือกับญี่ปุน ชาติที่มีวัฒนธรรมนักรบเชนเดียวกับเรา แมจะหมายถึงการโยนจีนใหหมาปาก็ตาม..."
 GER_japan_friend_tt:0 "เรียกตัวฟอน ฟลเคนเฮาเซินกลับ\n"
 GER_china_friend:0 "ผูกมิตรกับจีน"
 GER_china_friend_desc:0 "ใหเรากระชับมิตรภาพอันยาวนานกับจีนใหแนนแฟนยิ่งขึ้น การทําเชนนี้จะทําใหญี่ปุนหมางเมิน แตญี่ปุนจะเปนอะไรไปไดมากกวาอิตาลีแหงตะวันออกเลา?"
 GER_anti_comintern_pact: "กติกาสัญญาตอตานโคมินเทิรน"
 GER_anti_comintern_pact_desc: "การแทรกแซงกิจการภายในของชาติตาง ๆ โดยองคการคอมมิวนิสตสากล ไมเพียงเปนภัยตอความสงบภายในและความผาสุกทางสังคมของชาติเหลานั้น แตยังเปนภัยคุกคามตอสันติภาพของโลกดวย! เราจะเชิญชาติที่ไมใชคอมมิวนิสตจํานวนมากใหรวมลงนามในกติกาสัญญานี้ และทําใหมั่นใจวาภัยแดงจะถูกควบคุมไว"
 GER_anti_soviet_pact: "กติกาสัญญาตอตาน[SOV.GetAdjective]"
 GER_anti_soviet_pact_desc:0 "เราสามารถยกระดับกติกาสัญญาตอตานโคมินเทิรนขึ้นไปอีกขั้น โดยขอใหสมาชิกทุกชาติใหคํามั่นเขารวมแนวรวมตอตานสหภาพโซเวียต หากชาติผูลงนามใดเขาสูสงครามกับสหภาพโซเวียต สมาชิกอื่นทั้งหมดตองประกาศสงครามดวย"
 GER_anti_soviet_pact_tt:0 "§Yสงขอเสนอถึงสมาชิกทุกชาติของกติกาสัญญาตอตานโคมินเทิรนใหเขารวมพันธมิตรเชิงปองกันตอตานสหภาพโซเวียต§!"
 GER_anti_soviet_pact_tt_2: "§Yพันธมิตรเชิงปองกันจะเรียกสมาชิกเขาสูสงครามหากชาติใดชาติหนึ่งถูกโคมินเทิรนโจมตี§!"
 GER_anti_soviet_pact_tt_3:0 "ไดรับจิตวิญญาณแหงชาติ §Yกติกาสัญญาตอตานโซเวียต§!\n"
 GER_ussr_war_goal:1 "สงครามกับ[GER.GetTheUSSRName]"
 GER_ussr_war_goal_desc:1 "เราสามารถทุมเทการโฆษณาชวนเชื่อเพื่อเตรียมประชาชนเยอรมัน รวมถึงชาวโลก ใหพรอมสําหรับสงครามอันชอบธรรมตอ [SOV.GetNameDef]"
 GER_turkey_friend:0 "ผูกมิตรกับตุรกี"
 GER_turkey_friend_desc:0 "ตุรกีของอตาเติรกกําลังเดินบนเสนทางสูความทันสมัยอยางนาชื่นชม และประเทศนี้ยังควบคุมทางเขาทะเลดําผานชองแคบบอสพอรัสและดารดะเนลส การดึงตุรกีเขาสูเขตอิทธิพลของเราควรเปนภารกิจสําคัญอันดับแรก!"
 GER_anschluss_old:0 "อันชลุส"
 GER_anschluss_desc_old:0 "อันชลุส หรือการรวมชาติกับออสเตรีย เปนเปาหมายที่ชาวเยอรมันปรารถนามายาวนาน แมสนธิสัญญาแวรซายจะหามไว แตในที่สุดเวลาที่จะทําใหเปนจริงก็มาถึงแลว ใหเรามอบโอกาสแกชาวออสเตรียไดรวมชะตากรรมอันรุงโรจนกับเรา!"
 GER_anschluss_eq_trigger_tt:0 "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y50.000§! หนวย"
 #anschluss_mefo_bills_tt:0 "Uses Austrian gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 anschluss_mefo_bills_double_reduction:0 "ปรับ §Yพันธบัตร MEFO§! ดวย §G+0.10§! อํานาจทางการเมืองที่ไดรับตอวัน\n"
 GER_demand_memel:0 "ยืนยันการอางสิทธิ์ทางตะวันออก"
 GER_demand_memel_desc:0 "มหาสงครามทําใหเยอรมนีสูญเสียดินแดนทางตะวันออกไปมาก ทั้งจากการฟนคืนชีพของโปแลนดและการโอนเมเมลใหแกลิทัวเนีย เราจะสงคําขาดไปยังทั้งสองชาติ แตอยางนอยโปแลนดคงไมยอมกมหัวใหแคถอยคําเปนแน"
 GER_demand_memel_threat:0 "เยอรมนียืนยันการอางสิทธิ์ทางตะวันออก"
 GER_danzig_or_war:0 "ดานซิกหรือสงคราม"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] ตองยอมรับขอตกลงจึงจะไดรับโบนัส พวกเขาจะออกจาก [Root.GetFactionName] หากมีการประกาศสงคราม§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] ตองยอมรับขอตกลงจึงจะไดรับโบนัส คุณจะออกจากฝาย [Root.GetFactionName] หากมีการประกาศสงคราม§!\n"
 GER_danzig_or_war_desc:0 "ดานซิกเคยเปนของเยอรมัน ดานซิกยังคงเปนของเยอรมัน และดานซิกจะเปนของเยอรมันนับจากนี้ไป! หากโปแลนดไมยอมยกดินแดนนี้ให เราตองเตรียมประชาชนเยอรมันใหพรอมสําหรับสงครามที่หลีกเลี่ยงไมได ดานซิกและดินแดนโดยรอบจะตองกลับคืนสูเยอรมนี!"
 GER_czech_friend:0 "ผูกมิตรกับเชโกสโลวาเกีย"
 GER_czech_friend_desc:0 "ชาวเช็กและชาวสโลวักเปนชนชาติที่ขยันขันแข็งและนาชื่นชม นาเสียดายที่ความทะเยอทะยานทางดินแดนของเราขัดแยงกับพวกเขา แตยังไมสายเกินไปที่จะเลือกมิตรภาพแทนการกดขี่"
 GER_demand_sudetenland:0 "เรียกรองซูเดเทินลันด"
 GER_demand_sudetenland_desc:0 "ชะตากรรมของชาวเยอรมันในซูเดเทินเปนหนึ่งในความอยุติธรรมที่เลวรายที่สุดที่สนธิสัญญาแวรซายกอขึ้น พวกเขาตองไดรับความคุมครองจากเรา ไมวาเช็กจะคัดคานอยางไร"
 GER_demand_sudetenland_threat:0 "เยอรมนีเรียกรองซูเดเทินลันด"
 GER_first_vienna_award:0 "คําตัดสินเวียนนาครั้งที่หนึ่ง"
 GER_first_vienna_award_desc:0 "ชาวฮังการีเปนหนึ่งในชนชาติที่ทุกขยากที่สุดหลังมหาสงคราม ในการลมสลายของจักรวรรดิออสเตรีย-ฮังการี ชาวฮังการีจํานวนมากตองตกคางอยูบนแผนดินตางชาติ ทั้งที่บรรพบุรุษของพวกเขาอาศัยอยูที่นั่นมาหลายชั่วอายุคน เราสามารถกระชับความสัมพันธกับฮังการีไดอยางมากดวยการมอบดินแดนบางสวนจากเชโกสโลวาเกียใหแกพวกเขา"
 GER_end_of_czechoslovakia:0 "ชะตากรรมของเชโกสโลวาเกีย"
 GER_end_of_czechoslovakia_desc:0 "ถึงเวลาแลวที่จะแบงดินแดนเช็กเดิมใหแกผูที่สามารถปกครองไดอยางเหมาะสม เราควรพิจารณาจัดตั้งรัฐหุนเชิดสโลวักแยกตางหากทางตะวันออกดวย"
 #end_of_czechoslovakia_mefo_bills_tt:0 "Uses Czechoslovak gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 GER_second_vienna_award:0 "คําตัดสินเวียนนาครั้งที่สอง"
 GER_second_vienna_award_desc:0 "ทรานซิลเวเนียมีชาวฮังการีเปนประชากรสวนใหญ และควรเปนของมิตรของเราในฮังการีโดยชอบธรรม อยางไรก็ตาม ยากจะคาดเดาวารัฐบาลและประชาชนโรมาเนียจะตอบสนองตอขอเรียกรองนี้อยางไร"
 GER_italy_ally:0 "พันธมิตรกับอิตาลี"
 GER_italy_ally_desc:0 "ชาวอิตาลีอาจไวใจไมได ดังที่พิสูจนแลวในมหาสงคราม แตมุสโสลินีและขบวนการฟาสซิสตของเขาไดแสดงใหเห็นวาอิตาลียังมีความหวัง แนนอนวาเยอรมนีมีแตจะไดประโยชนจากการเปนพันธมิตรกับอิตาลี ใชหรือไม?"
 GER_nationalist_spain_ally:0 "พันธมิตรกับสเปน"
 GER_nationalist_spain_ally_desc:0 "ชัยชนะของฝายชาตินิยมในสงครามกลางเมืองสเปนไดปูทางสูความสัมพันธที่ใกลชิดยิ่งขึ้นระหวางสองประเทศของเรา ฟรังโกถือกุญแจสูทะเลเมดิเตอรเรเนียน"
 GER_nationalist_spain_ally_tt:0 "เพิ่มความสัมพันธทางการทูตกับ §Yสเปนฝายชาตินิยม§!"
 GER_danzig_vs_slovakia:0 "ดานซิกแลกสโลวาเกีย"
 GER_danzig_vs_slovakia_desc:0 "ชาวโปลขวางทางแผนการเลเบนสเรามของเรา ถึงกระนั้นก็ยังไมสายเกินไปที่จะเปลี่ยนลําดับความสําคัญระยะยาวและแสวงหามิตรภาพกับพวกเขาแทน หนทางเดียวที่จะเปนไปไดคือการแลกเปลี่ยนดินแดน ดานซิกแลกกับสโลวาเกีย โปแลนดแสดงความสนใจในภูมิภาคนี้แลวดวยการยึดครองซาออลเซีย"
 GER_poland_friend:0 "ผูกมิตรกับโปแลนด"
 GER_poland_friend_desc:0 "แมโปแลนดจะไมมีทางออกสูทะเลอีกตอไป แตเราไดพิสูจนเจตนาดีดวยการมอบสโลวาเกียให บางทีเราอาจดึงพวกเขาใหใกลชิดยิ่งขึ้นดวยคําสัญญาลม ๆ แลง ๆ วาจะไดดินแดนทางตะวันออกในอนาคต"
 GER_war_with_france:0 "สงครามกับฝรั่งเศส"
 GER_war_with_france_desc:0 "เมื่อเยอรมนีพบทางออกที่นาพอใจสําหรับปญหาพรมแดนตะวันออกแลว อยางนอยในตอนนี้ ก็ถึงเวลาหันความสนใจไปทางตะวันตก การสูญเสียแควนอาลซัส-ลอแรนเปนรอยดางพรอยตอเกียรติภูมิของชาวเยอรมัน และมีเพียงสงครามอันยุติธรรมและชอบธรรมเทานั้นที่จะลางแคนนี้ได"
 GER_war_with_france_threat:0 "การอางสิทธิ์เหนือดินแดนฝรั่งเศส"
 GER_operation_tannenbaum:0 "ปฏิบัติการทันเนินเบาม"
 GER_operation_tannenbaum_desc:0 "สวิตเซอรแลนดมีประชาชนและระบอบการเมืองที่นารังเกียจและนาสมเพชที่สุด ในที่สุดเราก็มีเวลาจัดการกับศัตรูคูอาฆาตของเยอรมนียุคใหมเหลานี้เสียที"
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "ผนวกลักเซมเบิรกและอาลซัส-ลอแรนกลับคืน"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "เมื่อเรายึดดินแดนที่เคยเปนของเยอรมันในประวัติศาสตรกลับคืนมาไดสําเร็จ เราก็สามารถเริ่มกระบวนการผนวกดินแดนเหลานี้กลับเขาสู [Root.GetName] ประชากรของพวกเขาตองไดรับโอกาสทําหนาที่อันรักชาติเพื่อมาตุภูมิ"
 GER_naval_rearmament:0 "การฟนฟูกําลังรบทางเรือ"
 GER_naval_rearmament_desc:0 "ความตกลงทางนาวีอังกฤษ-เยอรมนีที่เราไดมาในป 1935 เปดโอกาสใหเราขยายกองทัพเรือไดอยางมาก เราควรทุมเทอยางเต็มที่"
 GER_plan_z:0 "แผน Z"
 GER_plan_z_desc:0 "พลเรือเอกเรเดอรเชื่อวาวิธีที่ดีที่สุดในการเอาชนะอังกฤษคือนโยบายการจูโจมดวยเรือผิวนํ้า การสรางเรือประจัญบานและเรือบรรทุกเครื่องบินใหเพียงพอจะเปนภารกิจมหึมาและตองใชเวลา บางทีอาจนานเกินไป... ในทางกลับกัน กองเรือผิวนํ้าของเราในปจจุบันก็ไมเพียงพออยางนาเวทนา"
 GER_u_boat_effort:0 "ทุมเทดานเรืออู"
 GER_u_boat_effort_desc:0 "พลเรือจัตวาเดอนิทซสนับสนุนยุทธศาสตรการสงครามเรือดํานํ้าแบบไมจํากัดวาเปนหนทางที่ดีที่สุดในการทําใหอังกฤษคุกเขา ดวยเรืออูที่มากพอ เราอาจตัดทรัพยากรที่จําเปนทั้งหมดจากจักรวรรดิอันกวางไกลของอังกฤษไมใหไปถึงอุตสาหกรรมในประเทศของพวกเขาได"
 GER_trade_interdiction_old:0 "การสกัดกั้นการคา"
 GER_trade_interdiction_desc_old:0 "อูตอเรือของเรามุงมั่นผลิตเรืออูออกมาไมหยุด แตเราตองพัฒนาวิธีใช 'ฝูงหมาปา' เหลานี้ใหดีขึ้น มอบทุกสิ่งที่พลเรือเอกตองการเพื่อทําการจําลองและเกมสงคราม..."
 GER_modular_construction:0 "การกอสรางแบบโมดูล"
 GER_modular_construction_desc:0 "ดวยการแยกสรางชิ้นสวนเรือดํานํ้าตามสถานที่กอสรางตาง ๆ ความเร็วในการประกอบและการกอสรางจะดีขึ้นอยางมาก"
 GER_denmark_friend:0 "ผูกมิตรกับเดนมารก"
 GER_denmark_friend_desc:0 "การทูตเรือปนยังไมตาย แผนขยายกองทัพเรือของเราเปนที่รูกันดีในหมูเพื่อนบานเล็ก ๆ ทางเหนือ เมื่อรวมกับความหวาดกลัวตอกองทัพที่เหนือกวามหาศาลของเรา การขมขูใหพวกเขาเขามาอยูในเขตอิทธิพลของเรานาจะงายพอ"
 GER_norway_friend:0 "ผูกมิตรกับนอรเวย"
 GER_norway_friend_desc:0 "นอรเวยควบคุมการสงออกแรเหล็กอันลํ้าคาจํานวนมากจากเหมืองขนาดใหญทางตอนเหนือของสวีเดน เราควรขมขูใหพวกเขายอมเปน 'มิตร' ดวยภัยคุกคามจากกองทัพเรือที่กําลังขยายตัวของเรา"
 GER_dutch_friend:0 "ผูกมิตรกับเนเธอรแลนด"
 GER_dutch_friend_desc:0 "ชาวดัตชรูดีวาพวกเขาจะตานทานไดนานเพียงใดหากเกิดมหาสงครามอีกครั้ง หากโนมนาวใหพวกเขาเชื่อวาเยอรมนีคุกคามอังกฤษไดจริง พวกเขาอาจเลือกเปนพันธมิตรกับเราเพื่อหลีกเลี่ยงการยึดครองอันโหดราย"
 GER_sweden_friend:0 "ผูกมิตรกับสวีเดน"
 GER_sweden_friend_desc:0 "ประเทศสแกนดิเนเวียเปรียบเหมือนโดมิโน ยืนหยัดและลมลงไปดวยกัน เมื่อนอรเวยและเดนมารกอยูในเขตอิทธิพลของเรา สวีเดนก็จะตามมาอยางแนนอน"
 GER_improve_national_spirit:0 "ปลุกขวัญแหงชาติ"
 GER_improve_national_spirit_desc:0 "เมื่อเมืองหลวงของผูชนะในมหาสงครามอยูในกํามือเรา ในที่สุดเราก็สลัดเงาแหงความพายแพทิ้งไปได ยุคใหมกําลังรุงอรุณสําหรับเยอรมนี!"
 GER_improve_national_spirit_tooltip:0 "เราหรือสมาชิกในฝายของเราตองควบคุมลอนดอนและปารีส รวมถึงรัฐที่ทั้งสองเมืองตั้งอยู"
 needs_approval:0 "§R[This.GetName] ตองยอมรับขอตกลงจึงจะไดรับโบนัส§!\n"
 GER_demand_slovenia:0 "เรียกรองสโลวีเนีย"
 GER_demand_slovenia_threat:0 "เยอรมนีเรียกรองสโลวีเนีย"
 GER_demand_slovenia_desc:0 "สนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลทําใหดินแดนประวัติศาสตรของออสเตรียจํานวนมากตกไปเปนของรัฐผูสืบทอด เมื่อออสเตรียไดรวมเขากับชาติเยอรมันอีกครั้ง ก็ถึงเวลายุติความอยุติธรรมเหลานี้ ดินแดนประวัติศาสตรคารนิโอลาและสติเรีย ซึ่งปจจุบันเรียกวาสโลวีเนีย ตองกลับคืนสูมาตุภูมิ"
 GER_first_ljubljana_award:0 "คําตัดสินลูบลิยานาครั้งที่หนึ่ง"
 GER_first_ljubljana_award_desc:0 "มหาอํานาจตะวันตกจอมมือถือสากปากถือศีลปาวประกาศเรื่องการกําหนดใจตนเองของชนชาติ ขณะที่ยกชนกลุมนอยจํานวนมากใหอยูใตการปกครองของชาวเซิรบ เราอยูในฐานะที่จะแกไขความผิดพลาดทางประวัติศาสตรนั้นและไดมิตรไปพรอมกัน สําหรับผูที่ปรารถนาจะเขาขางเราในระเบียบยุโรป เราจะใจกวางอยางยิ่ง"
 GER_first_ljubljana_award_tt:0 "รัฐดินแดนหลักดั้งเดิมของ[YUG.GetAdjective]ทั้งหมดเปนของ §Y[YUG.GetName]§! หรือรัฐในอารักขาใด ๆ ของประเทศนั้น\n"
 GER_fate_of_yugoslavia:0 "ชะตากรรมของยูโกสลาเวีย"
 GER_fate_of_yugoslavia_desc:0 "รัฐยูโกสลาเวียเปนสิ่งประดิษฐที่ถูกสรางขึ้นมาโดยตลอด และอํานาจสวนกลางก็เริ่มลมสลาย เราตองเขาไปฟนฟูความสงบเรียบรอย คําถามเดียวที่เราเผชิญคือวิธีใดดีที่สุด"
 #yugoslavia_mefo_bills_tt:0 "Uses Yugoslav gold to reduce the cost of §YMEFO bills§!.\n"
 GER_second_ljubljana_award:0 "คําตัดสินลูบลิยานาครั้งที่สอง"
 GER_second_ljubljana_award_tt:0 "เหตุการณจะเปดโอกาสใหเรียกรองดินแดนใหแก [Root.GetName] หรือพันธมิตรที่คูควร"
 GER_second_ljubljana_award_desc:0 "เมื่อปญหายูโกสลาเวียไดรับการแกไขแลว ก็ถึงเวลาหันความสนใจไปที่กรีซ พวกเขาเองก็ไดดินแดนเพิ่มอยางไมยุติธรรมจากฝายสัมพันธมิตร ถึงเวลาดูแลววาใครคือมิตรแทของเรา"
 GER_war_with_greece:0 "สงครามกับกรีซ"
 GER_war_with_greece_desc:0 "เมื่อกรีซอยูในภาวะสงครามอยูแลว คงนาเสียดายหากเยอรมนีพลาดโอกาสไดฐานทัพในเมดิเตอรเรเนียนตะวันออก"
 GER_fate_of_greece:0 "ชะตากรรมของกรีซ"
 GER_fate_of_greece_desc:0 "กรีซไดพิสูจนแลววาไมอาจรับมือกับพลังใหมที่ถาโถมเขาสูยุโรปได ถึงเวลาเสนอความคุมครองที่มีเพียงเยอรมนีเทานั้นที่มอบใหได"
 GER_weserubung:0 "ปฏิบัติการเวเซอรอือบุง"
 GER_weserubung_desc:0 "นอรเวยเปนจุดยุทธศาสตรสําคัญยิ่ง และเปนเปาโจมตีที่ชัดเจนสําหรับศัตรูที่ตองการขัดขวางการคาเหล็กกลาของเรากับสวีเดน เราไมอาจเสี่ยงใหศัตรูตั้งฐานทัพในภูมิภาคนี้ได เพื่อใหไดพื้นที่เตรียมการที่ดีสําหรับการบุกนอรเวย เราตองเคลื่อนทัพเขาเดนมารกกอน"
 GER_weserubung_tt: "\nการควบคุม §Y[144.GetName]§! อยางสมบูรณจะทําใหไดรับแรคุณภาพสูงจาก §Y[SWE.GetName]§! ผาน §Yนารวิก§! ทุกเดือน ซึ่งจะทําใหได §Yโรงงานพลเรือนนอกประเทศ§! เพิ่มขึ้นหนึ่งแหงทุก 6 เดือน สูงสุดรวม 8 แหง §Yโรงงานพลเรือนนอกประเทศ§! การขนสงเหลานี้อาจถูกขัดจังหวะหากสูญเสียการควบคุม §Y[144.GetName]§! หาก [ENG.GetNameDefCap] บุก [SWE.GetName] สําเร็จและกอวินาศกรรมเหมือง หรือหาก [SWE.GetNameDef] ระเบิดเหมืองทิ้ง โรงงานพลเรือนจะสูญเสียไปอยางถาวร การขนสงจะกลับมาดําเนินตอไดหากเหมืองกลับมาดําเนินการ"
 GER_weserubung_tt_complete: "§Yโรงงานพลเรือนนอกประเทศ§! ที่ไดรับในปจจุบันจากการควบคุม §Yนารวิก§!: §G[?GER_narvik_civs]§!\nความคืบหนาการขนสงจนถึงโรงงานถัดไป: [?GER_narvik_shipments]/6"
 GER_around_maginot:0 "ออมแนวมาฌีโน"
 GER_around_maginot_desc:0 "หากเราตองการไดเปรียบทางยุทธวิธีเหนือฝรั่งเศส เราตองสามารถโจมตีพวกเขาไดจากทุกดาน พวกเขาจะไมคาดคิดวาจะถูกโจมตีจากทางเหนือ ซึ่งเปนจุดที่เราจะโจมตีพอดี เมื่อเรากําจัดอุปสรรคบางอยางไปแลว"
 italian_focus:0 "แผนยุทธศาสตรแหงชาติอิตาลี"
 GER_danzig_or_war_POL_civil_war:0 "ยึดดานซิกเพื่อแลกกับการสนับสนุน"
 GER_danzig_trigger_polish_civil_war:0 "โปแลนดอยูในสงครามกลางเมืองและตองเปนไปตามเงื่อนไขขอใดขอหนึ่งตอไปนี้\n      เยอรมนีสงอาสาสมัครไปสนับสนุนฝายหนึ่ง\n      ฝายหนึ่งอยูในฝายเดียวกับเยอรมนี"
