 FRA_jet_effort:0 "มุงพัฒนาเครื่องยนตไอพน"
 FRA_jet_effort_desc:0 "การรบทางอากาศคือเรื่องของความคลองตัว เครื่องยนตไอพนเปนความกาวหนาที่ทรงพลังเสียจนนักบินขาศึกดูเหมือนหยุดนิ่ง ขณะที่เรากระชากพวกเขาลงจากทองฟา"
