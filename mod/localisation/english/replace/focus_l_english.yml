 GER_a_new_and_better_germany_desc:0 "ขณะที่เรากําลังฟนฟูชาติ เราควรตั้งเปาใหเหนือกวาสิ่งที่จําเปน เพื่อใหสิ่งที่เราสรางในวันนี้ยืนหยัดผานกาลเวลา"
 GER_bulwark_against_bolshevism:1 "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc:1 "ชาติของเรายืนหยัดเปนโลตานทาน[GER.GetBulwarkBolshevismDesc] ปกปองโลกตะวันตกจากอิทธิพลของ[GER.GetBulwarkCommunismDesc] เราตองแบกรับภาระนี้อยางภาคภูมิ และเตรียมจับอาวุธหากจําเปน"
 GER_bulwark_against_bolshevism_tt:1 "§Rจิตวิญญาณแหงชาตินี้จะสูญเสียไปหากอยูในฝายเดียวกับ หรือทําสงครามอยูฝายเดียวกับ [SOV.GetNameDef]§!\n"
 SOV_BULWARK_NAME_COMMUNIST:0 "ปราการตานบอลเชวิค"
 SOV_BULWARK_NAME_FASCISM:0 "ปอมปราการตานฟาสซิสต"
 SOV_BULWARK_NAME_NEUTRALITY:0 "ที่มั่นตานรัสเซีย"
 SOV_BULWARK_BOLSHEVISM_DESC_COMMUNIST:0 "ลัทธิบอลเชวิค"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM:0 "ลัทธิฟาสซิสต"
 SOV_BULWARK_BOLSHEVISM_DESC_NEUTRALITY:0 "จักรวรรดินิยมรัสเซีย"
 SOV_BULWARK_COMMUNISM_DESC_COMMUNIST:0 "ลัทธิคอมมิวนิสต"
 SOV_BULWARK_COMMUNISM_DESC_FASCISM:0 "ลัทธิฟาสซิสต"
 SOV_BULWARK_COMMUNISM_DESC_NEUTRALITY:0 "รัสเซีย"
 GER_return_of_the_kaiser:0 "การกลับมาของไกเซอร"
 GER_return_of_the_kaiser_desc:0 "จักรวรรดิเยอรมันตองมีไกเซอร และวิลเฮลมที่ 2 ยังมีพระชนมชีพอยูระหวางลี้ภัยในเนเธอรแลนด เราจะยกเลิกการเนรเทศและทูลเชิญพระองคเสด็จกลับมาขึ้นครองราชย ไมวาประเทศประชาธิปไตยตะวันตกจะคิดอยางไร"
 GER_focus_on_the_true_enemy:0 "มุงสูศัตรูที่แทจริง"
 GER_focus_on_the_true_enemy_desc:0 "ศัตรูของเราไมไดอยูภายใน แตอยูภายนอก อาชญากรรมการผูกขาดอาณานิคมของตะวันตกที่ดําเนินตอเนื่องมานั้น ถูกบดบังไดก็แตดวยความอยุติธรรมของสนธิสัญญาแวรซายที่เราถูกบังคับใหยอมรับหลังจากที่เราพยายามหาที่ยืนใตดวงอาทิตย ทั้งหมดจะจบลงในวันนี้"
 GER_rebuild_the_high_seas_fleet:0 "ฟนฟูกองเรือทะเลหลวง"
 GER_rebuild_the_high_seas_fleet_desc:0 "เราจําเปนตองมีโครงการเสริมสรางกําลังทางเรือขนาดมหึมาเพื่อฟนฟูกองเรือทะเลหลวงอันเคยรุงโรจน หากเราหวังจะทาทายตะวันตกไดสําเร็จ"
 GER_our_place_in_the_sun:0 "ที่ยืนใตดวงอาทิตยของเรา"
 GER_our_place_in_the_sun_desc:0 "ใหทุกคนไดรูวาจักรวรรดิเยอรมันยืนยันสิทธิ์ที่จะมีที่ยืนใตดวงอาทิตยอีกครั้ง! ประชาชนของเราจะไมถูกเหยียดหยามอยูในเงามืดอีกตอไป"
 GER_pride_of_the_modern_germany:0 "ความภาคภูมิแหงเยอรมนียุคใหม"
 GER_pride_of_the_modern_germany_desc:0 "ตองใชเวลาหลายปกวาจะมีขนาดทัดเทียมราชนาวีอังกฤษ ดังนั้นเราตองเหนือกวาในดานคุณภาพ เรือของเราจะทันสมัยและทรงพลังที่สุดเทาที่เคยแลนในทองทะเล!"
 GER_prepare_for_the_next_blockade:0 "เตรียมรับการปดลอมครั้งตอไป"
 GER_prepare_for_the_next_blockade_desc:0 "การปดลอมอันเลวรายของอังกฤษคือสิ่งที่ทําใหเราแพสงครามครั้งกอน เราจะไมทําผิดพลาดซํ้าอีก ครั้งนี้เราจะเตรียมประชาชนใหพรอมรับสิ่งที่จะเกิดขึ้นอยางเต็มที่ยิ่งกวาเดิม"
 GER_break_the_anglo_french_colonial_hegemony:0 "ทําลายอํานาจครอบงําอาณานิคมของอังกฤษ-ฝรั่งเศส"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "ถึงเวลาแลวที่จะทลายการผูกขาดลัทธิอาณานิคมที่ตะวันตกยึดครองมายาวนานเกินไป"
 flag_franco_british_union:0 "สหภาพฝรั่งเศส-อังกฤษ"
 GER_schlieffen_once_more:0 "ชลีฟเฟนอีกครั้ง"
 GER_schlieffen_once_more_desc:0 "เราตองออมแนวมาฌีโน เราจะผานเบลเยียมและลักเซมเบิรกอีกครั้งในการโจมตีอันรวดเร็วสูชัยชนะ"
 GER_reinstate_imperial_possessions:0 "คืนสถานะดินแดนของจักรวรรดิ"
 GER_reinstate_imperial_possessions_desc:0 "เมื่อเรายึดดินแดนที่เคยเปนของเยอรมันในประวัติศาสตรกลับคืนมาไดสําเร็จ เราก็สามารถเริ่มกระบวนการคืนดินแดนเหลานี้เขาสู [Root.GetName] ในฐานะจังหวัดที่สมบูรณ ความอัปยศสุดทายจากแวรซายถูกลบลางในที่สุด!"
 GER_crossing_the_atlantic:0 "ขามแอตแลนติก"
 GER_crossing_the_atlantic_desc: "เมื่อกําจัดฝายตอตานการปกครองของเราบนภาคพื้นทวีปไดหมดสิ้นแลว เราตองหันความพยายามในการผลิตไปสรางกองทัพเรือขนาดมหึมา เพื่อนําการตอสูไปถึงชาวอังกฤษและชาวอเมริกัน เราจะไมหยุดพัก จนกวาในเวลาอันเหมาะสมของพระเจา โลกเกาพรอมดวยพลังและอํานาจทั้งปวงจะกาวออกมาพิชิตและทําใหโลกใหมตองอัปยศ"
 GER_crossing_the_atlantic_trigger_tt: "ไม: ประเทศศัตรูใด ๆ: \n  ถือเปนประเทศมหาอํานาจ \n  รัฐที่ควบคุมใด ๆ:\n     อยูใน §Yยุโรป§!"
 GER_crossing_the_atlantic_2_factories_tt:0 "ลบ §Yโรงงานทหาร 2 แหง§! จากรัฐที่ไมติดทะเลหนึ่งรัฐ ตอทุกรัฐชายฝงที่ไดรับอูตอเรือเหลานี้\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "ลบ §Yโรงงานทหาร 1 แหง§! จากรัฐที่ไมติดทะเลหนึ่งรัฐ ตอทุกรัฐชายฝงที่ไดรับอูตอเรือเหลานี้\n"
 GER_the_central_powers:0 "ฝายมหาอํานาจกลาง"
 GER_the_central_powers_desc:0 "เราตองมีพันธมิตรหากจะยืนหยัดตอตานตะวันตก เราจะกอตั้งฝายของเราเองเพื่อตอตานการกดขี่ของประเทศประชาธิปไตย"
 GER_prepare_italian_coup:0 "เตรียมรัฐประหารในอิตาลี"
 GER_prepare_italian_coup_desc:0 "การที่อิตาลีตกสูลัทธิฟาสซิสตตองถูกแกไข เราจะติดตอฝายนิยมกษัตริยของอิตาลีพรอมขอเสนอใหกอรัฐประหารโดยมีเราสนับสนุน"
 GER_prepare_italian_coup_tt:0 "หากพวกเขายอมรับขอเสนอของเรา:\n"
 GER_assassinate_mussolini:0 "ลอบสังหารมุสโสลินี"
 GER_assassinate_mussolini_desc:0 "ถึงเวลาแลวที่จะกําจัดแกนหลักของลัทธิฟาสซิสตอิตาลี มือของชาวเยอรมันจะลอบสังหารผูนํา หลังจากนั้นฝายนิยมกษัตริยของอิตาลีจะยึดอํานาจในพริบตา"
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! ไมไดปฏิเสธขอเสนอการลอบสังหารของเรา"
 GER_rekindle_imperial_sentiment:0 "ปลุกความรูสึกจักรวรรดินิยมอีกครั้ง"
 GER_rekindle_imperial_sentiment_desc:0 "แมจักรวรรดิออสเตรีย-ฮังการีจะแตกสลายหลังมหาสงคราม แตยังมีผูที่โศกเศราตอการลมสลายของจักรวรรดิอยู เราจะบมเพาะความรูสึกจักรวรรดินิยมเหลานี้ดวยความหวังวารัฐผูสืบทอดอาจตัดสินใจกลับมารวมกันเพื่อความเขมแข็งของตนเอง"
 GER_rekindle_imperial_sentiment_tt:0 "เมื่อการสนับสนุนฝายไมฝกใฝฝายใดสูงพอ จะเปดการตัดสินใจใหชาติเหลานี้ฟนฟูจักรวรรดิออสเตรีย-ฮังการีและเขารวมฝายมหาอํานาจกลาง\n"
 GER_rekindle_imperial_sentiment_tt_2: "เมื่อการสนับสนุนฝายไมฝกใฝฝายใดสูงพอ จะเปดการตัดสินใจใหชาติเหลานี้ฟนฟูจักรวรรดิออสเตรีย-ฮังการีและเขารวมมิทเทิลยูโรปา\n"
 GER_expatriate_the_communists:0 "เนรเทศพวกคอมมิวนิสต"
 GER_expatriate_the_communists_desc:0 "ภัยคุกคามภายในจากลัทธิคอมมิวนิสตยังคงสรางความเดือดรอนแกชาติของเรา เราตองกําจัดมันใหสิ้น ไมวาผูนิยมลัทธินี้จะหนีไปที่ใด"
 GER_accept_british_naval_dominance:0 "ยอมรับความเปนใหญทางทะเลของอังกฤษ"
 GER_accept_british_naval_dominance_desc:0 "เราตองการพันธมิตรเพื่อตอสูกับลัทธิคอมมิวนิสต และอังกฤษคือตัวเลือกชั้นยอด เราจะคลายความกังวลของพวกเขาดวยการยอมรับความเหนือกวาทางทะเลของพวกเขาและปฏิเสธการเสริมกําลังทางเรือขนานใหญใด ๆ เพื่อความสัมพันธที่ดีขึ้น"
 GER_ally_the_shade:0 "พันธมิตรกับผูทอดเงา"
 GER_ally_the_shade_desc:0 "หากเราไมอาจแยงที่ยืนใตดวงอาทิตยของพวกเขาได เราก็จะเปนพันธมิตรกับผูที่ทอดเงาทับเรา"
 GER_carte_blanche_for_alsace_and_french_colonies:0 "อิสระเต็มที่ในอาลซัสและอาณานิคมฝรั่งเศส"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "เราตองรองขอใหพันธมิตรใหมของเราเปดทางใหเรามีอิสระเต็มที่ในการทวงคืนดินแดนอาลซัส-ลอแรนอันชอบธรรมของเรา และสวนแบงอาณานิคมแอฟริกาอยางเปนธรรม"
 GER_bypass_maginot_in_the_south:0 "ออมแนวมาฌีโนทางใต"
 GER_bypass_maginot_in_the_south_desc:0 "อังกฤษมีผลประโยชนในกลุมประเทศตํ่า เราจึงตองหาเสนทางอื่นออมแนวมาฌีโน ทางใตแมจะเปนภูเขาและเดินทัพยาก แตก็ตองใชใหได ความเฉลียวฉลาดของชาวเยอรมันจะนําเราผานไป"
 GER_see_to_the_eastern_front:0 "ดูแลแนวรบดานตะวันออก"
 GER_see_to_the_eastern_front_desc:0 "หากมีสิ่งใดที่เราไดเรียนรูจากมหาสงคราม นั่นคือเราตองเตรียมรับการโจมตีตอดินแดนรอบนอกทางตะวันออก ดินแดนเหลานี้ตองไดรับการฟนฟูและเสริมปอมปองกันการรุกราน"
 GER_see_to_the_eastern_front_tt:1 "เพิ่ม §Yปอมภาคพื้นดิน§! 6 แหงใน 3 จังหวัดบนพรมแดนตะวันออก\n"
 GER_see_to_the_eastern_front_tt2:1 "เพิ่ม §Yปอมภาคพื้นดิน§! 8 แหงใน 4 จังหวัดบนพรมแดนตะวันออก\n"
 GER_danzig_for_guarantees:0 "ดานซิกแลกการรับประกัน"
 GER_danzig_for_guarantees_desc:2 "ชาวโปลยอมรูสึกถึงภัยจาก[GER.GetDanzigGuaranteesBolsheviksDesc]อยางแนนอน บางทีเราอาจบรรลุขอตกลงเรื่องการคืนดานซิก พอซนาน และจังหวัดไซลีเซีย เพื่อแลกกับการรับประกันการสนับสนุนทางทหารในกรณีถูกรุกราน[GER.GetDanzigGuaranteesRedsDesc]"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_COMMUNIST:0 "พวกบอลเชวิค"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_FASCISM:0 "พวกฟาสซิสตทางตะวันออก"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_NEUTRALITY:0 "ชาวรัสเซีย"
 SOV_DANZIG_GUARANTEES_REDS_DESC_COMMUNIST:0 "โดยพวกแดง"
 SOV_DANZIG_GUARANTEES_REDS_DESC_NEUTRALITY:0 "จากทางตะวันออก"
 GER_safeguard_the_baltic:0 "ปกปองรัฐบอลติก"
 GER_safeguard_the_baltic_desc:1 "รัฐบอลติกเคยเปนสวนหนึ่งของจักรวรรดิรัสเซียจนกระทั่งไมกี่ทศวรรษกอน จึงมีเหตุผลที่[GER.GetRussiansDemonym]อาจพยายามผนวกดินแดนเหลานี้อีกครั้ง เราตองปองกันเรื่องนี้ และเสนอการสนับสนุนทางทหารในกรณีที่[SOV.GetAdjective]รุกราน"
 GER_support_the_finns:0 "สนับสนุนชาวฟนน"
