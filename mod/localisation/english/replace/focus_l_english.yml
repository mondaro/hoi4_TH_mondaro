 RAJ_administrative_oversight:0 "การกํากับดูแลดานการบริหาร"
 RAJ_administrative_oversight_desc:0 "เมื่อจัดการการทุจริตในภาคอุตสาหกรรมไดและเอกราชของเรามั่นคงแลว ถึงเวลานําผูบริหารทองถิ่นเขามาอยูใตปกของรัฐบาล แมอาจดูเปนงานยาก แตผูนําชนเผาและเจาหนาที่ทองถิ่นมีอิทธิพลเหนือประชากรของเราจํานวนมหาศาล พวกเขาตองถูกผนวกเขามาเพื่อประโยชนของประเทศในยามมืดมนเชนนี้"
 RAJ_enable_local_industrialization:0 "ปลดล็อกการตัดสินใจ §Hการพัฒนาอุตสาหกรรมในชนบท§! ซึ่งชวยใหปรับเปลี่ยนจิตวิญญาณแหงชาติ §Hสังคมเกษตรกรรม§! ได"
 RAJ_land_clearance:0 "การบุกเบิกที่ดิน"
 RAJ_land_clearance_desc:0 "ดวยอิทธิพลที่เพิ่มขึ้นผานผูนําทองถิ่น เราสามารถใชทรัพยากรธรรมชาติและที่ดินในนามของรัฐไดดียิ่งขึ้น"
 RAJ_workforce_integration:0 "การผนวกรวมแรงงาน"
 RAJ_workforce_integration_desc:0 "ดวยอํานาจในทองถิ่นของผูนําระดับภูมิภาคและผูนําชนเผา เราสามารถนําทรัพยากรที่ไมเชนนั้นจะสูญเปลาไปใชในโครงการพัฒนาพื้นที่ชนบทได"
