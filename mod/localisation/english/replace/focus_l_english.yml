 GER_the_mannheim_project:0 "โครงการมันไฮม"
 GER_the_mannheim_project_desc:1 "เมื่อโรงงานผลิตนํ้ามวลหนักในนอรเวยอยูภายใตการควบคุมของเราแลว เราสามารถเพิ่มความพยายามเปนทวีคูณในการไขความลับของอะตอม และศึกษาการนํามันมาเปนอาวุธตอตาน[GER.GetDanzigGuaranteesBolsheviksDesc]"
 GER_the_mannheim_project_tt:0 "แผนยุทธศาสตรนี้ใหรางวัลแตกตางกันตามระดับการวิจัยปรมาณูในปจจุบัน:\n\n"
 GER_pool_technical_know_how:0 "รวมความรูทางเทคนิค"
 GER_pool_technical_know_how_desc:0 "แตละชาติมีวิธีบริหารอุตสาหกรรมและบํารุงรักษายุทโธปกรณเปนของตนเอง เราสามารถเรียนรูจากกันและกันโดยสงทีมเทคนิคไปเผยแพรความรูนี้ในหมูสมาชิกพันธมิตร"
 GER_pool_technical_know_how_tt: "ทุก §Yชาติ§! ใน §Yฝาย§! ของเราจะไดรับ §Yจิตวิญญาณแหงชาติ§! นี้ดวย"
 ITA_ethiopian_war_logistics:0 "การสงกําลังบํารุงในสงครามเอธิโอเปย"
 ITA_ethiopian_war_logistics_desc:0 "เราอาจประเมินสถานการณการสงกําลังบํารุงสําหรับการพิชิตเอธิโอเปยอันรุงโรจนผิดไป เราตองตั้งเปาหมายหลักใหทหารผูกลาของเราไดรับเสบียงที่จําเปน"
 ITA_fortification_effort:0 "ทุมเทดานปอมปราการ"
 ITA_fortification_effort_desc:0 "เราตองปกปองชายฝงและพรมแดนจากการรุกรานของมหาอํานาจจักรวรรดิที่เสื่อมทรามและกําลังรวงโรยอยางฝรั่งเศสและอังกฤษ"
 ITA_fortification_effort_forts:0 "เพิ่ม §Yปอมภาคพื้นดิน 15 แหง§! บนพรมแดนฝรั่งเศส\n"
 ITA_army_primacy:0 "กองทัพบกมากอน"
 ITA_army_primacy_desc:0 "ในดานอุตสาหกรรม อิตาลียังลาหลังจักรวรรดิอาณานิคมที่เสื่อมทราม เราตองเลือกวาจะใหความสําคัญกับกองทัพบกหรือกองทัพเรือ คําตอบดูชัดเจน เชนเดียวกับที่จักรวรรดิโรมันโบราณพึ่งพากองทหารลีเจียน จักรวรรดิอิตาลีใหมก็ตองเปนเชนนั้น!"
 ITA_modernized_artillery:0 "ปนใหญทันสมัย"
 ITA_modernized_artillery_desc:0 "ในทางทฤษฎี เรเจียเอเซรชีโตเปนหนึ่งในกองทัพที่ใหญที่สุดในโลก นาเสียดายที่เราไมมีทางติดอาวุธใหทหารทั้งหมดไดอยางเหมาะสม ที่แยที่สุดคือปนใหญสวนใหญของเรามาจากป 1918!"
 ITA_modernized_army:0 "กองทัพทันสมัย"
 ITA_modernized_army_desc:0 "ปนใหญที่ดีขึ้นจะเพิ่มประสิทธิภาพการรบของเราอยางมาก แตเรายังตองการยุทธวิธีและหลักนิยมใหมดวย"
 ITA_armored_effort:0 "ทุมเทดานยานเกราะ"
 ITA_armored_effort_desc:0 "การรบในเอธิโอเปยก็ดีอยูหรอก แตรถถังของเรายังไมไดมาตรฐานที่จําเปนสําหรับการสูกับระบอบธนาธิปไตยประชาธิปไตยของยุโรปที่เสื่อมทรามแตยังทรงพลัง"
 ITA_mare_nostrum:0 "มาเรนอสตรุม"
 ITA_mare_nostrum_desc:0 "ทรัพยากรของเรามีจํากัดและเราตองเลือกทางที่เจ็บปวด แตจักรวรรดิอังกฤษไดขังเราไวในทะเลเมดิเตอรเรเนียน การฝาออกไปตองอาศัยกองทัพเรือที่ทัดเทียมแมกระทั่งกองทัพเรือของพวกเขา..."
 ITA_carrier_effort:0 "ทุมเทดานเรือบรรทุกเครื่องบิน"
 ITA_carrier_effort_desc:0 "กองเรือรบสมัยใหมจะมีเรือบรรทุกเครื่องบินเปนศูนยกลาง ไมใชเรือประจัญบาน ชาวอเมริกันไดแสดงใหเห็นถึงความเหนือกวาของกําลังทางอากาศตอเรือรบมาตั้งแตป 1921!"
 ITA_capital_ships:0 "ทุมเทดานเรือหลัก"
 ITA_capital_ships_desc:0 "ชาติที่มีเรือประจัญบานมากที่สุดจะครองมหาสมุทร เราตองไมปลอยใหราชนาวีอังกฤษมีอํานาจการยิงเหนือกวาเราในเมดิเตอรเรเนียน..."
 ITA_bomber_effort:0 "ทุมเทดานเครื่องบินทิ้งระเบิด"
 ITA_bomber_effort_desc:0 "ยุคที่กองทัพชนะสงครามไดโดยไมตองมองทองฟาไดผานพนไปแลว เราตองพัฒนาเครื่องบินทิ้งระเบิดทางยุทธวิธีเพื่อใหการสนับสนุนทางอากาศที่ทหารของเราตองการ"
 ITA_atlantic_fleet:0 "กองเรือแอตแลนติก"
 ITA_atlantic_fleet_desc:0 "เมื่อเราฝากรงขังของอังกฤษออกมาไดแลว เราจะตองแผอํานาจขามมหาสมุทร นี่ตองเปนภารกิจสําคัญอันดับแรกของเรา"
 ITA_marines_and_landing_craft:0 "นาวิกโยธินและเรือยกพลขึ้นบก"
 ITA_marines_and_landing_craft_desc:0 "สงครามไมไดชนะดวยกําลังทางเรือเพียงอยางเดียว เราตองสามารถลําเลียงกองทัพขามคลื่นและสงขึ้นฝงไดอยางปลอดภัยดวย..."
 ITA_jet_engine_effort:0 "ทุมเทดานเครื่องยนตไอพน"
 ITA_jet_engine_effort_desc:0 "อิตาลีควรเปนผูนําในการพัฒนาเครื่องยนตไอพน ดวยผลงานอันยอดเยี่ยมของเซกอนโด คัมปนี เราควรมอบทรัพยากรทั้งหมดที่เขาตองการเพื่อพัฒนาแบบของเขาใหดียิ่งขึ้นสําหรับเรเจียแอโรเนาติกา"
 ITA_light_ship_effort:0 "ทุมเทดานเรือขนาดเบา"
 ITA_light_ship_effort_desc:0 "ขบวนเรือลําเลียงไปยังดินแดนโพนทะเลของเราตองการการคุมกัน เราตองพัฒนาหลักนิยมใหมและเรือพิฆาตที่ทันสมัยยิ่งขึ้น"
 ITA_escort_effort:0 "ทุมเทดานการคุมกัน"
 ITA_escort_effort_desc:0 "เราควรเพิ่มความพยายามในการปกปองขบวนเรือลําเลียงที่เปราะบางของเราในเมดิเตอรเรเนียน"
 ITA_sea_wolves:0 "หมาปาแหงทองทะเล"
 ITA_sea_wolves_desc:0 "พันธมิตรเยอรมันของเราไดพัฒนาเรือดํานํ้าที่มีประสิทธิภาพนาสะพรึงกลัว และหลักนิยม 'ฝูงหมาปา' เพื่อใชงานมัน เราควรเรียนรูจากพวกเขา"
 ITA_slovenia_dalmatia_claims:0 "การอางสิทธิ์เหนือยูโกสลาเวีย"
 ITA_slovenia_dalmatia_claims_desc:0 "ยังคงมีประชากรชาวอิตาลีจํานวนมากในยูโกสลาเวีย ซึ่งยอนกลับไปไดอยางนอยถึงยุครุงเรืองของเวนิส การนําภูมิภาคเหลานี้กลับคืนสูการปกครองของอิตาลีเปนกาวสําคัญสูการฟนฟูจักรวรรดิโรมัน!"
 ITA_slovenia_dalmatia_claims_threat:0 "อิตาลีอางสิทธิ์เหนือยูโกสลาเวีย"
 ITA_yugoslavia_friend:0 "ผูกมิตรกับยูโกสลาเวีย"
 ITA_yugoslavia_friend_desc:0 "แทนที่จะเปนปฏิปกษกับยูโกสลาเวียในตอนนี้ เราสามารถเลื่อนการพิชิตออกไปจนกวาจะถึงเวลาที่เหมาะสมกวา และหันไปผูกมิตรกับระบอบนี้เพื่อดึงประเทศเขาสูเขตอิทธิพลของเราแทน"
 ITA_support_nationalist_spain:0 "สนับสนุนสเปนฝายชาตินิยม"
 ITA_support_nationalist_spain_desc:0 "สเปนอยูทามกลางสงครามกลางเมืองที่จะตัดสินวาจะเปนพันธมิตรฟาสซิสตที่เปนไปไดในอนาคต หรือยังคงเปนสาธารณรัฐที่ไรประโยชน หรือแยกวานั้นคือตกเปนของลัทธิคอมมิวนิสตหรืออนาธิปไตย เราตองสนับสนุนชาวสเปนที่แทจริงกอนจะสายเกินไป!"
 ITA_demand_balearic_islands:0 "เรียกรองหมูเกาะแบลีแอริก"
 ITA_demand_balearic_islands_desc:0 "เมื่อไดพิสูจนการสนับสนุนตอระบอบใหมของฟรังโกแลว เราอยูในฐานะที่จะขอใหยกดินแดนสําคัญแหงหนึ่งที่เราสูรบเพื่อปกปอง นั่นคือหมูเกาะแบลีแอริก ใหแกอิตาลี เพื่อเสริมความมั่นคงทางยุทธศาสตรในเมดิเตอรเรเนียน"
 ITA_bulgaria_friend:0 "ผูกมิตรกับบัลแกเรีย"
 ITA_bulgaria_friend_desc:0 "บัลแกเรียอยูในเขตอิทธิพลของเรา การที่พวกเขาเขาขางอิตาลีอยางมั่นคงคือกุญแจสูความทะเยอทะยานของเราในบอลขาน"
 ITA_albania_war_goal:1 "ยึดครองแอลเบเนีย"
 ITA_albania_war_goal_desc:1 "แอลเบเนียเปนเปาหมายที่งายสําหรับทหารของเราที่จะเขายึดครอง เราคงไมพบการตอตานมากนัก เราตองแสดงใหโลกเห็นถึงแสนยานุภาพของอิตาลีและฟนฟูความรุงโรจนของจักรวรรดิโรมัน!"
 ITA_pact_of_steel:0 "กติกาสัญญาเหล็ก"
 ITA_pact_of_steel_desc:0 "ความสัมพันธของเรากับเยอรมนีนาซีมีปญหาจากความแตกตางทางอุดมการณและเปาหมายที่ขัดแยงกัน อิลดูเชระแวงความทะเยอทะยานของเยอรมนีในออสเตรียและบอลขานอยางยิ่ง อยางไรก็ตาม ความเปนจริงยอมเปลี่ยนแปลงได..."
 ITA_germ_italy_same_tt:0 "§Yอิตาลี§! และ §Yเยอรมนี§! มี §Yอุดมการณ§! เดียวกัน"
 ITA_german_millitary_cooperation:0 "ความรวมมือทางทหารกับเยอรมนี"
 ITA_german_millitary_cooperation_desc:0 "ดวยความรวมมืออยางใกลชิดกับกองทัพเยอรมันอันทรงพลัง เราสามารถผสานสวนที่ดีที่สุดของประสิทธิภาพแบบเยอรมันและนวัตกรรมแบบอิตาลีเขาดวยกัน เราจะไดเปรียบทางยุทธศาสตรเหนือใครก็ตามที่กลาเผชิญหนากับเรา"
 ITA_claims_on_france:0 "การอางสิทธิ์เหนือฝรั่งเศส"
 ITA_claims_on_france_desc:0 "ยึดดินแดนจากฝรั่งเศสเขตวีชี เมื่อเยอรมนีพิชิตปารีสและมีการจัดตั้งรัฐบาลใหมในฝรั่งเศส ก็ถึงเวลาที่เราจะอางสิทธิ์ในสวนแบงอันชอบธรรมของเราในยุโรปตอนใต เยอรมนีขยายดินแดนทางเหนือไปมากแลว จึงเปนการยุติธรรมที่เราจะไดสวนแบงของเราบาง"
 ITA_claims_on_france_tt:0 "§Yฝรั่งเศสเขตวีชี§! ยังคงอยูและควบคุม §Yซาวัว§! และ §Yคอรซิกา§!"
 ITA_go_after_france:0 "เลนงานฝรั่งเศส"
 ITA_go_after_france_desc:0 "ฝรั่งเศส... อีกหนึ่งประชาธิปไตยหัวปฏิกิริยาแหงตะวันตกที่คอยขัดขวางความกาวหนาของเราทุกขณะ และหลายครั้งไดคุกคามแมกระทั่งการดํารงอยูของชาวอิตาลี เราออกรบเพื่อประโยชนของอิตาลีและอนาคตของจักรวรรดิ"
 ITA_claims_on_turkey:0 "การอางสิทธิ์เหนือตุรกี"
 ITA_claims_on_turkey_desc:0 "สนธิสัญญาลอนดอนป 1915 สัญญาวาจะมอบดินแดนตุรกีในอานาโตเลียใหอิตาลี เพื่อแลกกับดินแดนที่มหาอํานาจตะวันตกไดในลิแวนต พวกเขารับสวนของตนไป โดยอางวาเปนเพียงดินแดนในอาณัติของสันนิบาตชาติ ขณะที่อิตาลีถูกปฏิเสธ อิตาลีใหมแข็งแกรงกวาอิตาลีเกามาก และเราจะบีบใหชาวเติรกทําตามคําสัญญาของอังกฤษ"
 ITA_italy_first:0 "อิตาลีตองมากอน"
 ITA_italy_first_desc:1 "ทานดูเชผูยิ่งใหญของเราจะไมมีวันเปนเบอรสองรองฮิตเลอร! เราตองจดจําบทเรียนจากจักรวรรดิโรมัน การแทรกแซงกิจการอิตาลีของชาวทิวตันไมเคยจบลงดวยดี..."
 ITA_romania_friend:0 "ผูกมิตรกับโรมาเนีย"
 ITA_romania_friend_desc:0 "การดึงญาติหาง ๆ ของเราในโรมาเนียเขาสูเขตอิทธิพลของเราจะเปนประโยชนสูงสุด อิลดูเชเห็นศักยภาพอันยิ่งใหญใน 'กองกําลังพิทักษเหล็ก' ของพวกเขา"
 ITA_german_rd_treaty:0 "สนธิสัญญากับเยอรมนี"
 ITA_german_rd_treaty_desc:0 "เราควรขอใหชาวเยอรมันแลกเปลี่ยนความลับทางเทคโนโลยีเพื่อประโยชนของทั้งสองชาติอันยิ่งใหญของเรา"
 ITA_spanish_italian_faction:0 "พันธมิตรสเปน-อิตาลี"
 ITA_spanish_italian_faction_desc:0 "ฟรังโกและฝายชาตินิยมสเปนคือพันธมิตรโดยธรรมชาติของเรา เปนหนึ่งเดียวกันดวยศาสนา วัฒนธรรม และอุดมการณ เราสามารถรวมกันยึดยิบรอลตารและทําใหราชนาวีอังกฤษลําบากอยางยิ่ง..."
 ITA_italian_highways:0 "ทางหลวงอิตาลี"
 ITA_italian_highways_desc:0 "เราตองขยายโครงสรางพื้นฐานเพื่อใหทหารเคลื่อนยายไดสะดวกทั่วทั้งจักรวรรดิ เมื่อศัตรูอยูทุกมุมโลก นี่จึงเปนสวนสําคัญยิ่งในการปกปองแผนดินอิตาลีทั้งหมด"
 ITA_libyan_infrastructure:0 "โครงสรางพื้นฐานลิเบีย"
 ITA_libyan_infrastructure_desc:0 "ดินแดนอันกวางใหญของเราในแอฟริกาเหนือยังลาหลังสวนอื่นของจักรวรรดิในดานโครงสรางพื้นฐาน เราควรทุมเทความพยายามเพื่อยกระดับใหทัดเทียม"
 ITA_greece_war_goal:0 "สงครามกับกรีซ"
 ITA_greece_war_goal_desc:0 "จักรวรรดิโรมันที่เรากําลังฟนฟูจะเปนจักรวรรดิแบบไหนกัน หากไมรวมกรีซเขาไปดวย? กรีซนาจะเปนเปาหมายที่งาย..."
 ITA_greece_friend:0 "ผูกมิตรกับกรีซ"
 ITA_greece_friend_desc:0 "ชาวกรีกเปนชนชาติโบราณเชนเดียวกับเรา และเปนแหลงกําเนิดอารยธรรมตะวันตก การทําใหเปาหมายของพวกเขาสอดคลองกับของเราคงไมใชเรื่องที่เปนไปไมได..."
 ITA_turkey_friend:0 "ผูกมิตรกับตุรกี"
 ITA_turkey_friend_desc:0 "ชาวเติรกไมมีเหตุผลที่จะรักเราหลังสงครามอิตาลี-ตุรกีและมหาสงคราม อยางไรก็ตาม การเมืองตามสภาพจริงยอมมากอนความบาดหมางเกา และสถานการณปจจุบันในเมดิเตอรเรเนียนอาจทําใหดวงดาวของเราทั้งสองโคจรมาบรรจบกัน"
 ITA_portugal_friend:0 "ผูกมิตรกับโปรตุเกส"
 ITA_portugal_friend_desc:0 "โปรตุเกสเปนพันธมิตรโดยธรรมชาติของชาวอิตาลีเชนเดียวกับสเปน เราตองกระชับสายสัมพันธแหงมิตรภาพนี้ใหแนนแฟน"
 ITA_anti_uk_war_goals:0 "สงครามกับสหราชอาณาจักร"
 ITA_anti_uk_war_goals_desc:0 "จักรวรรดิอังกฤษที่กําลังเสื่อมถอยไดขังเราไวในทะเลเมดิเตอรเรเนียน และจะไมมีวันยอมยื่นกุญแจใหเราโดยสมัครใจ เราตองโจมตีอังกฤษทันทีที่ถึงเวลาเหมาะสม!"
 ITA_japan_friend:0 "ผูกมิตรกับญี่ปุน"
 ITA_japan_friend_desc:0 "ชาวญี่ปุนคลายกับเรามาก เปนมหาอํานาจหนุมที่หิวกระหาย มีโครงสรางประชากรที่เติบโต แตถูกการคาของระบอบธนาธิปไตยประชาธิปไตยที่กําลังเสื่อมถอยอยางสหราชอาณาจักรและเนเธอรแลนดจับเปนตัวประกัน เราควรรวมพลังกับพวกเขาเพื่อสรางฝายอักษะทางทะเลอันเกรียงไกรขามมหาสมุทร!"
 soviet_focus:0 "แผนยุทธศาสตรแหงชาติโซเวียต"
 #SOV_finish_five_year_plan:0 "Finish the Five Year Plan"
 #SOV_finish_the_five_year_plan_desc:0 "The second Five Year Plan prioritizes the development of heavy industry. The Soviet Union must develop quickly in order to match the Capitalist and Fascist powers of the West."
 SOV_move_industry_to_urals:0 "ยายอุตสาหกรรมไปเทือกเขาอูราล"
 SOV_move_industry_to_urals_desc:0 "เราตองไมปลอยใหพวกฮิตเลอรจอมทรยศยึดโรงงานอันลํ้าคาของเราทางตะวันตกของสหภาพโซเวียต ดวยความพยายามและการเสียสละสูงสุด เรานาจะยายเครื่องจักรหนักและสิ่งอํานวยความสะดวกที่มีคาที่สุดไปยังเชเลียบินสคและพื้นที่อื่น ๆ ในเทือกเขาอูราลไดอยางรวดเร็ว"
 SOV_defense_of_moscow:0 "การปองกันมอสโก"
 SOV_defense_of_moscow_desc:0 "พวกฟาสซิสตมาเคาะประตูเมืองหลวงแลว! มอสโกตองไมแตกไมวาจะตองแลกดวยอะไร ระดมทุกคนตั้งแตเด็กจนถึงคนชราเพื่อเรงสรางแนวปองกันเทาที่ทําได!"
 SOV_defense_of_moscow_forts:0 "เพิ่ม §Yปอมภาคพื้นดิน 28 แหง§! ในและรอบมอสโก\n"
 SOV_infrastructure_effort:0 "ทุมเทดานโครงสรางพื้นฐาน"
 SOV_infrastructure_effort_desc:1 "[ROOT.GetNameDefCap] กวางใหญแตสวนใหญวางเปลา เราตองทําใหมั่นใจวาจะขนสงสินคาและยุทโธปกรณขามความกวางของประเทศไดอยางรวดเร็ว"
 SOV_tranformation_of_nature:0 "การปฏิรูปธรรมชาติ"
 SOV_tranformation_of_nature_desc:0 "แผนการอันยิ่งใหญของสตาลินเพื่อการปฏิรูปธรรมชาติตองถูกนํามาปฏิบัติ สิ่งแวดลอมตองถูกหลอหลอมและปรับเปลี่ยนในระดับมหึมาเพื่อประโยชนของประชาชน"
 SOV_stalin_constitution:0 "รัฐธรรมนูญสตาลิน"
 SOV_stalin_constitution_desc:0 "ถึงเวลาปรับปรุงรัฐธรรมนูญฉบับเกาของเรา และทําใหโลกประทับใจกับสิทธิที่กรรมกรและชาวนาแหงสหภาพโซเวียตไดรับ!"
 #SOV_collectivist_propaganda:0 "Collectivist Propaganda"
 #SOV_collectivist_propaganda_desc:0 "In the Soviet Union, there is no room for individual glory. Our propaganda should strongly emphasize collective efforts; surpassed production goals, successful expeditions and massive construction projects."
 SOV_militarized_schools:0 "โรงเรียนแบบทหาร"
 SOV_militarized_schools_desc:0 "เด็กโซเวียตควรไดรับการปลูกฝงวินัยทหารและคุณธรรมแบบสังคมนิยม เชน การเสียสละและความเปนปกแผน จิตใจของเยาวชนนั้นหลอหลอมไดงายกวา"
 SOV_workers_culture:0 "วัฒนธรรมกรรมกร"
 SOV_workers_culture_desc:0 "สังคมนิยมไมใชเพียงระบบเศรษฐกิจ และลัทธิมารกซไมใชเพียงศาสตร เราตองเปลี่ยนแปลงโครงสรางของสังคมโซเวียตจากรากฐาน เพื่อกําจัดเศษซากของขนบธรรมเนียมและประเพณีแบบกระฎมพีใหสิ้น"
 SOV_new_soviet_man:0 "มนุษยโซเวียตใหม"
 SOV_new_soviet_man_desc:0 "มนุษยโซเวียตใหมคือผูไมเห็นแกตัว มีความรู มีวินัย และแข็งแรง เปนชัยชนะที่มีชีวิตเหนือสัญชาตญาณตํ่าและจิตสํานึกจอมปลอม บุรุษจะยินดีสละชีพเพื่อประโยชนของสวนรวม และสตรีจะใหกําเนิดบุตรมากมายเพื่ออนาคตของสังคมโซเวียต"
 #SOV_positive_heroism:0 "Positive Heroism"
 #SOV_positive_heroism_desc:0 "It is time to move on from the old Leninist collectivist propaganda and transform various exceptional individuals into larger-than-life Heroes of Socialism!"
 SOV_progress_cult:0 "ลัทธิบูชาความกาวหนา"
 SOV_progress_cult_desc:0 "เราควรเฉลิมฉลองนวัตกรรมของนักวิทยาศาสตรโซเวียตผูโดดเดน และสงเสริมการคิดอยางเสรีในแบบที่ถูกตอง สหภาพโซเวียตจะนําหนาตะวันตกที่เสื่อมทรามเสมอในศาสตรแขนงใหมที่ทาทาย ดูผลงานอันยอดเยี่ยมของสหายลืยเซนโคสิ!"
 SOV_socialist_science:0 "วิทยาศาสตรสังคมนิยม"
 SOV_socialist_science_desc:0 "โลกก็เหมือนจิตใจ ที่เคลื่อนไหวอยูเสมอ ธรรมชาติอยูในสภาวะกาวหนาไมหยุดนิ่ง กระทั่งปฏิวัติอยูตลอดเวลา หลักวัตถุนิยมวิภาษวิธีจึงนํามาใชกับวิทยาศาสตรธรรมชาติไดไมตางจากสังคมศาสตร..."
 SOV_aviation_cult:0 "ลัทธิบูชาการบิน"
 SOV_aviation_cult_desc:0 "สหภาพโซเวียตจะทําใหโลกตะลึงดวยความสําเร็จดานการบินอันนาทึ่ง นักบินผูกลาหาญของเราคืออัศวินแหงวัฒนธรรมและความกาวหนาแบบบอลเชวิค ซึ่งแสดงใหเห็นถึงความเชี่ยวชาญทางเทคโนโลยีของเราเหนือธรรมชาติ เรากาวมาไกลเพียงใดนับจากยุคซาร!"
 SOV_women_pilots:0 "สตรีในการบิน"
 SOV_women_pilots_desc:0 "สหายรัสโควา นักบินทางไกลผูกลาหาญของเรา ควรไดรับอนุญาตใหจัดตั้งกรมทหารอากาศที่มีแตสตรีผานโครงการกลุมการบินที่ 122 ของเธอ"
 SOV_night_witches_tt:0 "กรมทิ้งระเบิดกลางคืนที่ 588. เริ่มปฏิบัติการในมอสโก"
 #SOV_socialist_realism:0 "Socialist Realism"
 #SOV_socialist_realism_desc:0 "All works of art in the Soviet Union must strive to educate the people in the goals and meaning of Communism, depicting the proletariat in realistic and typical scenes of everyday life. Soviet artists are the engineers of souls!"
 SOV_improve_railway_network:0 "ปรับปรุงเครือขายทางรถไฟ"
 SOV_improve_railway_network_desc:0 "แผนหาปฉบับแรกของเราประสบความสําเร็จมากเกินไป การขยายตัวมหาศาลของอุตสาหกรรมหนักทําใหสหภาพโซเวียตอยูในฐานะที่แข็งแกรงขึ้นมากในการปองกันตนเอง แตเครือขายทางรถไฟโซเวียตกลับเผชิญคอขวดรายแรงหลายจุด คณะกรรมาธิการประชาชนดานการรถไฟ (NKPS) มีแผนอันทะเยอทะยานที่จะแกคอขวดเหลานี้และรับประกันวาเราจะปกปองมาตุภูมิได"
 SOV_transpolar_flights:0 "เที่ยวบินขามขั้วโลก"
 SOV_transpolar_flights_desc:0 "นักบินที่กลาหาญที่สุดของเรากําลังเริ่มพิสูจนวาเสนทางอันทาทายขามแถบอารกติกเปนไปได ดวยการใชทางลัดที่ไมคาดคิดเชนนี้ในการวางแผนสงครามทางอากาศ เราจะสามารถจูโจมขาศึกไดอยางไมทันตั้งตัว"
 SOV_ocean_going_navy:0 "กองทัพเรือทะเลลึก"
 SOV_ocean_going_navy_desc:0 "แมสหภาพจะมีพื้นที่แผนดินกวางใหญกวาชาติใดในโลก แตมหาสมุทรของโลกยังไมไดอยูใตการครอบครองของเรือเรา เรือประจัญบานหุมเกราะหนาจะเปนสวนหนึ่งของกองเรือทะเลลึกในอนาคตของเรา"
 SOV_peoples_commissariat:0 "กอตั้ง PCDI"
 SOV_peoples_commissariat_desc:0 "คณะกรรมาธิการประชาชนดานอุตสาหกรรมกลาโหมแหงสหภาพโซเวียตจะเปนกระทรวงอุตสาหกรรมหนักที่มุงเนนโครงการอุตสาหกรรมทางทหาร ในระยะยาว ปริมาณงานอาจจําเปนตองแบงกระทรวงออกเปนหนวยยอยเพิ่มเติม"
 SOV_anti_fascist_diplomacy:0 "การทูตตอตานฟาสซิสต"
 SOV_anti_fascist_diplomacy_desc:0 "แมระบอบตะวันตกทั้งหมดจะกดขี่และฉอฉล แตไมมีระบอบใดเลวรายไปกวาพวกที่แสรงทําเปนหัวกาวหนา หรือกระทั่งเปนสังคมนิยม! ดวยการเผยแพรจิตสํานึกจอมปลอมเชนนี้ในหมูชนชั้นกรรมาชีพ พวกเขากําลังพยายามถวงการปฏิวัติและจองจํากรรมกรไวชั่วกาลนาน"
 SOV_operation_zet:0 "ปฏิบัติการเซต"
 SOV_operation_zet_desc:0 "แมกกมินตั๋งจะเปนพวกหัวปฏิกิริยา แตดูเหมือนเหมาและลัทธิคอมมิวนิสตแบบของเขาคงไมมีทางชนะในจีน เราควรพยายามกระชับความสัมพันธกับเจียง จักรวรรดิญี่ปุนที่ลาหลังอยางนาขันอยางไรก็คงลมสลายในไมชา"
 SOV_annex_tannu_tuva:0 "ผนวกตูวา"
 SOV_annex_tannu_tuva_desc:0 "แมแทบไมมีความสําคัญทางเศรษฐกิจ แตดวยเหตุผลทางการเมือง เราควรผนวกสาธารณรัฐประชาชนตันนูตูวาอยางเปนทางการในฐานะแควนปกครองตนเองภายในสหภาพโซเวียต"
 SOV_improve_stalin_line:0 "ปรับปรุงแนวสตาลิน"
 SOV_improve_stalin_line_desc:0 "พรมแดนตะวันตกของเราตองไดรับการปกปองจากการรุกรานของฟาสซิสตใหดีขึ้น แนวสตาลินควรไดรับการขยายและปรับปรุงใหทันสมัย"
 #SOV_far_east_fortification:0 "Far East Fortification"
 #SOV_far_east_fortification_desc:0 "The Japanese are constantly making incursions across the border with Manchuria. We must improve our defenses along that frontier in order to deter them permanently."
 SOV_far_east_fortification_forts_1:0 "เพิ่ม §Yปอมภาคพื้นดิน 6 แหง§! บนพรมแดนญี่ปุน\n"
 SOV_far_east_fortification_forts_2:0 "เพิ่ม §Yปอมภาคพื้นดิน 8 แหง§! บนพรมแดนญี่ปุน\n"
 SOV_far_east_fortification_forts_3:0 "เพิ่ม §Yปอมภาคพื้นดิน 4 แหง§! บนพรมแดนญี่ปุน\n"
 SOV_xian_incident:0 "อุบัติการณซีอาน"
 SOV_xian_incident_desc:0 "ผานสายสัมพันธกับเจาหนาที่ระดับสูงของกกมินตั๋ง เรานาจะลักพาตัวเจียงไคเชกและบีบใหเขาแบงอํานาจกับเหมาได ซึ่งจะยุติความขัดแยงอันบอนทําลายของทั้งสองฝาย เพื่อใหจีนตานทานการรุกรานของญี่ปุนไดดีขึ้น"
 SOV_xian_incident_tt:0 "หากทั้งสองฝายตกลง จะบังคับใหเกิดการพักรบระหวางจีนคณะชาติและจีนคอมมิวนิสต"
 SOV_anti_capitalist_diplomacy:0 "การทูตตอตานทุนนิยม"
 SOV_anti_capitalist_diplomacy_desc:0 "อุปสรรคที่เลวรายที่สุดตอการปฏิวัติโลกคือนายธนาคารอวนพีแหงสหรัฐอเมริกาและผูกดขี่อาณานิคมอันโหดเหี้ยมแหงสหราชอาณาจักรอยางไมตองสงสัย เปาหมายหลักของเราตองเปนการตบมือที่ละโมบของพวกเขาและบอนทําลายโฆษณาชวนเชื่อแบบเสรีนิยมของพวกเขาเสมอ"
 SOV_expand_red_fleet:0 "ขยายกองเรือแดง"
 SOV_expand_red_fleet_desc:0 "กองเรือแดงออนแออยางนาเวทนาเมื่อเทียบกับกองทัพเรือของมหาอํานาจจักรวรรดินิยม เราตองทําใหการขยายกองเรือเปนวาระแหงชาติ!"
 SOV_anti_colonialist_rebels:0 "โคมินเทิรน"
 SOV_anti_colonialist_rebels_desc:0 "เมื่อระบบทุนนิยมกําลังเขาสูชวงลมสลายครั้งสุดทาย จุดยืนที่ถูกตองของพรรคคอมมิวนิสตทั้งหมดตองเปนแนวทางซายจัดที่กาวราวและแข็งกราวอยางยิ่ง โดยเฉพาะอยางยิ่ง เราขอเรียกรองใหพรรคคอมมิวนิสตทั่วโลกทุมกําลังเพื่อทําลายฝายซายสายกลาง"
 SOV_southern_thrust:0 "บุกลงใต"
 SOV_southern_thrust_desc:0 "การผนวกอิหรานและอิรักจะทั้งยึดแหลงนํ้ามันมหาศาลไวเพื่อการปฏิวัติ และกดดันพวกจักรวรรดินิยมอังกฤษในอียิปตและอินเดียโดยตรง"
 #SOV_reconcile_japan:0 "Reconcile Japan"
 #SOV_reconcile_japan_desc:0 "Our relations with Japan have always been troubled, but there are bigger fish to fry. By exploiting their desperate lack of natural resources, the Japanese could be led by the nose... Their anachronistic feudal regime is bound to fall soon anyway."
 SOV_claim_on_sinkiang:0 "อางสิทธิ์ซินเจียง"
 SOV_claim_on_sinkiang_desc:0 "ภายใตการปกครองของสหายเซิ่งซื่อไฉ ซินเจียงก็แทบจะเปนรัฐหุนเชิดของโซเวียตอยูแลว เราควรทําใหเปนทางการ..."
 SOV_claim_on_sinkiang_threat:0 "โซเวียตอางสิทธิ์ซินเจียง"
 SOV_pan_slavic_rhetoric:0 "วาทกรรมสลาฟนิยม"
 SOV_pan_slavic_rhetoric_desc:0 "สหายเลนินไปไกลเกินไปในการละทิ้งอัตลักษณรัสเซียและสลาฟเพื่อไลตามการปฏิวัติโลก ชาตินิยมในระดับหนึ่งนาจะเปนประโยชนตอเรา และการฟนฟูลัทธิสลาฟนิยมบางรูปแบบอาจชวยดึงเราใหใกลชิดกับชาติสลาฟอื่น ๆ"
 SOV_claims_on_baltic:0 "การอางสิทธิ์ในบอลติก"
 SOV_claims_on_baltic_desc:0 "พระเจาปเตอรมหาราชทรงถูกตองที่แสวงหาทางเขาถึงทาเรือทางตะวันตก รัฐบอลติกที่สูญเสียไปหลังการปฏิวัติควรถูกผนวกกลับเขาสูสหภาพโซเวียต"
 SOV_claim_bessarabia:0 "การอางสิทธิ์เหนือเบสซาราเบีย"
 SOV_claim_bessarabia_desc:0 "ทะเลดําสําคัญตอเศรษฐกิจของเรายิ่งกวาทะเลบอลติก เราตองทําทุกวิถีทางเพื่อควบคุมชองแคบบอสพอรัสและดารดะเนลส"
 SOV_claims_on_turkey:0 "การอางสิทธิ์เหนือตุรกี"
 SOV_claims_on_turkey_desc:0 "ชาวเติรกไมเพียงปฏิเสธขอเรียกรองของเราเรื่องการควบคุมชองแคบบอสพอรัสรวมกันมาโดยตลอด แตยังปฏิเสธที่จะเจรจาปรับพรมแดนทางตะวันออกดวย บางทีถึงเวลาสั่งสอนพวกเขาแลว!"
 #SOV_baltic_security:0 "Baltic Security"
 #SOV_baltic_security_desc:0 "The Baltic is our front yard and must be protected at all costs. Karelia must be seized to give Leningrad a secure buffer zone, and the self-rule of Estonia is just ridiculous!"
 #SOV_claims_on_poland:0 "Claims on Poland"
 #SOV_claims_on_poland_desc:0 "The display of incompetence and embarrassment that was the Soviet-Polish war must be avenged and eastern Poland reintegrated into the USSR!"
 #SOV_demand_eastern_poland:0 "Demand Eastern Poland"
 #SOV_demand_eastern_poland_desc:0 "Having reasserted our right to Poland's eastern territories, we should make clear that they can only save themselves from another partition by handing them over peacefully."
 #SOV_offer_poland_protection:0 "Offer Poland Protection"
 #SOV_offer_poland_protection_desc:0 "Although we could simply seize eastern Poland, it would be much preferable if they joined our Comintern in the process. We would need to offer something in return for our claims, however. If we promise them eastern Germany, they might be interested."
 SOV_offer_poland_protection_tt:0 "§Yโปแลนดจะไดรับรัฐที่อางสิทธิ์ผานขอตกลงนี้ ในกรณีที่โซเวียตพิชิตได§!\n"
 SOV_great_purge:0 "การกวาดลางครั้งใหญ"
 SOV_great_purge_bypass_tt:0 "ทรอตสกีขึ้นเปนผูนําสหภาพโซเวียต"
 SOV_great_purge_desc:0 "มีแผนสมคบคิดของพวกทรอตสกีอันตรายกําลังกอตัวในหมูนายทหาร แมกระทั่งในระดับสูงสุด แมจะยังไมทราบวาทรอตสกีเกี่ยวของโดยตรงหรือไม แตภัยคุกคามนั้นใหญหลวง สหภาพโซเวียตอาจถูกโยนเขาสูสงครามกลางเมืองอีกครั้ง... เวนแตเราจะพรอมทุบไขบาง"
 SOV_great_purge_tt:0 "จะมีการจัด §Yการพิจารณาคดีเพื่อแสดง§! ตอเนื่องเพื่อกวาดลางรัฐมนตรีและผูนําที่ตองสงสัยวาเปนพวกทรอตสกี\n"
 SOV_great_purge_tt2:3 "จํานวนการกวาดลางที่สําเร็จจะสงผลตอโอกาสที่ §Yสงครามกลางเมือง§! จะปะทุขึ้นอีก และปรับระดับผลของ §Hนายทหารถูกกวาดลาง§!\nการไมเลือกแผนยุทธศาสตรนี้จะนําไปสู §Yสงครามกลางเมือง§! และอาจทําให §Yเลฟ ทรอตสกี§! กลับมาจากการลี้ภัย\n\n"
 SOV_permanent_revolution:0 "การปฏิวัติถาวร"
 SOV_permanent_revolution_tt:0 "ทรอตสกีกลับมาแลว"
 SOV_permanent_revolution_tt2:0 "§Yทรอตสกี§! ไดรับคุณลักษณะผูนําที่ดีขึ้น"
 SOV_permanent_revolution_desc:0 "นักปลุกปนผูกดขี่จากไปแลว! อํานาจที่แทจริงไดกลับคืนสูประชาชนแหงชาติเรา ทุกคนสามารถแสวงหาผลประโยชนของตนไดอยางอิสระและไมตองประนีประนอม เราจะเปลี่ยนแปลงตลอดไป การปฏิวัติถาวรคือการปฏิวัติแหงชัยชนะ"
 #SOV_rehabilitated_military:0 "Rehabilitated Military"
 #SOV_rehabilitated_military_desc:0 "With the taint of Trotskyism finally cleansed from the officer corps, it might be possible to allow the military some freedom from political interference again."
 #SOV_military_reorganization:0 "Military Reorganization"
 #SOV_military_reorganization_desc:0 "The Purge has not left the military in a good state. The new leadership is green and ineffective, and no work has been done to develop our doctrines. We must rectify this situation immediately!"
 #SOV_nkvd_primacy:0 "NKVD Primacy"
 #SOV_nkvd_primacy_desc:0 "The military has shown that it can never be trusted. Therefore, the NKVD will need to be expanded and given greater powers, with more political commissars to keep an eye on the officers."
 SOV_nkvd_divisions:0 "กองพล NKVD"
 SOV_nkvd_divisions_desc:0 "NKVD ควรไดรับกองพลของตนเองเพื่อทําหนาที่เปนกองกําลังภายใน คอยปกปองทางรถไฟและสถานที่สําคัญ"
 #SOV_lessons_of_war:0 "Lessons Of War"
 #SOV_lessons_of_war_desc:0 "With the experiences gained fighting limited wars, we should be able to make some breakthroughs in armored warfare, and perhaps even finally whip the depleted officer corps into shape!"
 #SOV_smersh:0 "SMERSH"
 #SOV_smersh_desc:0 "SMERSH, or 'Death to Spies', is a proposed counter-intelligence initiative that would serve a dual purpose; rooting out enemy spies and executing deserters and partisans within the ranks of the Red Army."
 SOV_smersh_tt:0 "§Yขจัดความเสี่ยงของรัฐประหาร§!\n"
 SOV_partisan_suppression:0 "ปราบปรามพลพรรค"
 SOV_partisan_suppression_desc:0 "SMERSH ควรไดรับการขยายเพื่อใหแทรกซึมและปราบปรามกิจกรรมพลพรรคทุกรูปแบบในดินแดนที่ยึดครองอยางไรปรานีไดดียิ่งขึ้น"
 SOV_war_with_germany:0 "สงครามกับเยอรมนี"
 SOV_war_with_germany_desc:0 "ภัยคุกคามจากเยอรมนียังคงเพิ่มขึ้น เราสามารถและตองทําลายกองทัพเยอรมัน และทําใหพวกเขากมหัวใหผูปกครองคนใหม"
 SOV_war_with_germany_tt:0 "กติกาสัญญาโมโลตอฟ-ริบเบนทรอพไมมีผลบังคับ"
 SOV_war_with_japan:0 "สงครามกับญี่ปุน"
 SOV_has_not_officers_purged_tt:0 "ไมมีจิตวิญญาณแหงชาติ §Yนายทหารถูกกวาดลาง§!"
 SOV_war_with_japan_desc:0 "ดูเหมือนญี่ปุนไมมีแผนจะถอย สิ่งเดียวที่ยับยั้งไดอยางไดผลคือสงคราม พวกเขาจะเสียใจที่ขัดขืนขอเรียกรองของเราเมื่อกองทัพแดงบดขยี้พวกเขา"
 SOV_war_with_uk:0 "สงครามกับสหราชอาณาจักร"
 SOV_war_with_uk_desc:0 "อังกฤษจักรวรรดินิยมไมเคยใหความเคารพเราเลย ไมตองสงสัยเลยวาพวกเขาจะหันมาหาสหภาพโซเวียตเมื่อจัดการสวนที่เหลือของโลกเสร็จ มีหนทางเดียวที่จะหยุดการขยายอํานาจอันกาวราวของพวกเขา สงคราม!"
 SOV_claim_on_the_straits:0 "อางสิทธิ์ชองแคบ"
 SOV_claim_on_the_straits_desc:0 "ชองแคบที่เชื่อมทะเลดํากับทะเลอีเจียนเปนจุดยุทธศาสตรสําคัญ เราไมอาจยอมใหดินแดนนี้อยูใตการควบคุมของตางชาติ เพื่อใหกองเรือแดงมีบทบาท เราตองยึดชองแคบไวใหได"
 SOV_ultimatum_to_greece:0 "ยื่นคําขาดตอกรีซ"
 SOV_ultimatum_to_greece_desc:0 "หมูเกาะอีเจียนคือชิ้นสวนทางยุทธศาสตรชิ้นสุดทายที่เราตองการเพื่อใหกองเรือแดงปฏิบัติการไดอยางอิสระ ชาวกรีกถูกกดดันจากทุกทิศทาง และนาจะยอมสละดินแดนเล็กนอยเพื่อหลีกเลี่ยงสงครามเต็มรูปแบบ"
 SOV_diversify_the_programme:0 "กระจายโครงการ"
 SOV_diversify_the_programme_desc:0 "เราไดเรียนรูมากมายในชวงหลายปที่ผานมา และมีความกาวหนาในดานการสงครามแบบดั้งเดิม เราเปนชาติของนักวิทยาศาสตรผูยิ่งใหญที่มีศักยภาพจะคนพบวิธีทําสงครามที่ใหความไดเปรียบมหาศาล เราตองทําใหพวกเขามีสภาพการทํางานที่ดีที่สุด หากเราตองการเห็นผลลัพธ"
 SOV_research_city_experiment:0 "การทดลองนครวิจัย"
 SOV_research_city_experiment_desc:0 "คูรชาตอฟ หนึ่งในนักวิทยาศาสตรชั้นนําของเรา ไดตั้งขอสังเกตวาเมื่อแยกนิวเคลียสในยูเรเนียมหนึ่งกิโลกรัม พลังงานที่ปลดปลอยออกมาจะเทียบเทากับการระเบิดของทีเอ็นที 20,000 ตัน เราตองควบคุมพลังนี้ใหไดกอนศัตรูเพื่อความอยูรอดของมาตุภูมิ"
 SOV_closed_city_network:0 "เครือขายนครปด"
 SOV_closed_city_network_desc:0 "เราควรจัดตั้งนครปดสําหรับงานวิจัยที่ตองการพื้นที่มากกวาที่ฐานทัพของเรามีอยู การจํากัดการเขาถึงนครเหลานี้จะชวยรักษาความลับของงานวิจัย ขณะที่ใหนักวิทยาศาสตรมีพื้นที่เพียงพอสําหรับการทดลองขนาดใหญ"
 strike_usa_focus:0 "โจมตีสหรัฐอเมริกา!"
 strike_usa_focus_desc:0 "ชาวอเมริกันผูทรยศกุมชะตาเราไวในมือ ดวยการควบคุมแหลงนํ้ามันและทรัพยากรอื่นที่เราตองการอยางยิ่ง อุตสาหกรรมของพวกเขาเหนือกวาเรามหาศาล ดังนั้นหากจะโจมตี ก็ตองโจมตีใหหนัก! เราไมอาจหวังชนะสงครามยืดเยื้อกับสหรัฐอเมริกาได..."
 chinese_puppet_focus:0 "จีนหุนเชิด"
 chinese_puppet_focus_desc:1 "จีนไดพิสูจนแลววาพยายามหลีกเลี่ยงสงครามกับเรา บางทีผูนําของพวกเขาอาจมองวาความแตกแยกภายในเปนภัยที่ใหญกวา เราอาจเสนอความคุมครองจากพวกคอมมิวนิสตและขุนศึก โดยใหพวกเขาเปนรัฐในอารักขาในวงไพบูลยรวมแหงมหาเอเชียบูรพา"
 chinese_war_focus:0 "สงครามกับจีน"
 chinese_war_focus_desc:0 "อุบัติการณสะพานมารโคโปโลพิสูจนแลววาชาวจีนไมสนใจความรวมมือ ดวยความตึงเครียดที่เพิ่มขึ้นคุกคามการหยุดยิงที่ตามมา สงครามอาจเปนหนทางเดียวที่จะนําความสงบเรียบรอยมาสูชาติจีน"
 subdue_warlords_focus:0 "ปราบขุนศึก"
 subdue_warlords_focus_desc:0 "ชาวจีนปลอยใหจักรวรรดิที่เคยภาคภูมิของตนแตกสลาย ถูกพวกหัวรุนแรงและกลุมทหารฉีกเปนชิ้น ๆ จักรวรรดิญี่ปุนจะไมยอมรับความแตกแยกเชนนี้ แมแตในหมูผูอยูใตปกครอง"
 oust_germans_focus:0 "ตัดสัมพันธจีน-เยอรมนี"
 oust_germans_focus_desc:0 "ที่ปรึกษาทางทหารชาวเยอรมันอยูในจีนมาตั้งแตอยางนอยทศวรรษที่ 1920 คอยใหการสนับสนุนสําคัญแกกกมินตั๋ง เรื่องนี้ไมอาจยอมรับไดอีกตอไป เรามีสิทธิ์เรียกรองใหเยอรมนีถอนการสนับสนุนทั้งหมดตอจีนโดยทันที ถึงเวลาที่เยอรมนีตองเลือกขาง"
 found_own_faction_focus:0 "กอตั้งฝายของเรา"
 found_own_faction_focus_desc:1 "เราไดพยายามสรางวงไพบูลยรวมแหงมหาเอเชียบูรพามาแลว เพื่อรับประกันชัยชนะที่ยั่งยืน ญี่ปุนตองแข็งแกรงพอที่จะนําไดเพียงลําพัง ทั้งในเอเชียและที่อื่น"
 axis_leanings_focus:0 "โนมเอียงสูฝายอักษะ"
 axis_leanings_focus_desc:0 "เรามีผลประโยชนและคานิยมรวมกันมากมายกับเยอรมนียุคใหม ซึ่งกําลังสรางฐานอํานาจในยุโรป การเขารวมเปนพันธมิตรกับพวกเขาจะทําใหเรามีมิตรที่ทรงพลังซึ่งอยูไกลพอจะไมแขงขันกับการปกครองเอเชียของเรา"
 subvert_india_focus:0 "กองทัพแหงชาติอินเดีย"
 subvert_india_focus_desc:0 "หากอังกฤษตัดสินความพยายามสรางจักรวรรดิของเรา เราจะแสดงใหพวกเขาเห็นวาจักรวรรดิของพวกเขาเองกําลังพังทลาย เชลยศึกและชาวอินเดียโพนทะเลจะเปนรากฐานของขบวนการที่สามารถโคนลมบริติชราชได"
 jap_improved_sprit_focus:0 "ขวัญแหงชาติที่ดีขึ้น"
 jap_improved_sprit_focus_desc:0 "ความภาคภูมิใจในชาติและการสนับสนุนสงครามแผซานไปทั่วราษฎรทุกคนขององคจักรพรรดิ ผลักดันใหพวกเขาทุมเทยิ่งขึ้นไปอีก!"
 befriend_siam_focus:0 "ผูกมิตรกับสยาม"
 befriend_siam_focus_desc:0 "สยามรอดพนจากการเปนอาณานิคมของยุโรปและไมคุนเคยกับการเปนรัฐในอารักขา แทนที่จะปราบใหสยบ เราควรโนมนาวใหพวกเขารวมมือกับเราเพื่อใหสยามคงสถานะเชนนั้นไว"
 army_primancy_focus:0 "กองทัพบกมากอน"
 army_primancy_focus_desc:0 "ในบรรดาสองเหลาทัพหลัก กองทัพบกคือแขนขวาอันแข็งแกรงของจักรวรรดิอยางแทจริง! ความสามารถในการยึดและรักษาพื้นที่ของกองทัพบกนั้นเหนือกวาบริการเล็กนอยที่กองทัพเรือใหไดมากนัก ดวยการยอมรับขอเท็จจริงอันเรียบงายและประจักษชัดนี้ และทุมทรัพยากรใหกองทัพบกมากขึ้น ความเปนไปไดยอมไรขีดจํากัด"
 JAP_army_primancy_focus_bypass_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yโรงงานทหาร§! ในพื้นที่บานเกิด"
 jap_sia_love:0 "การทูตญี่ปุน-สยาม"
 jap_sia_love_desc:0 "ญี่ปุนทุมเทความพยายามทางการทูตเพื่อกระชับความสัมพันธกับสยาม"
 navy_primancy_focus:0 "กองทัพเรือมากอน"
 JAP_navy_primancy_focus_bypass_tt:0 "ชองสิ่งกอสรางไมเพียงพอสําหรับ §Yอูตอเรือ§! ในพื้นที่บานเกิด"
 navy_primancy_focus_desc:0 "ในบรรดาสองเหลาทัพหลัก กองทัพเรือคือแขนขวาอันแข็งแกรงของจักรวรรดิอยางแทจริง! ความสามารถในการควบคุมทองทะเลของกองทัพเรือนั้นเหนือกวาบริการเล็กนอยที่กองทัพบกใหไดมากนัก ดวยการยอมรับขอเท็จจริงอันเรียบงายและประจักษชัดนี้ และทุมทรัพยากรใหกองทัพเรือมากขึ้น ความเปนไปไดยอมไรขีดจํากัด"
 army_innovations_focus:0 "นวัตกรรมกองทัพบก"
 army_innovations_focus_desc:0 "เมื่อกองทัพบกไดรับการยอมรับเปนเหลาทัพอันดับหนึ่งของจักรวรรดิแลว เราจึงควรทุมทรัพยากรใหกับการศึกษาหลักนิยมภาคพื้นดินมากขึ้น"
 army_air_innovations_focus:0 "นวัตกรรมการบินของกองทัพบก"
 army_air_innovations_focus_desc:0 "ภารกิจหลักของกองทัพอากาศตองเปนการสนับสนุนกองทัพบกอันเกรียงไกรของเรา!"
 army_motorization_focus:0 "การเพิ่มยานยนตใหกองทัพบก"
 army_motorization_focus_desc:0 "การใหความสําคัญกับยานยนตมากขึ้นจะเพิ่มความเร็วที่ทหารราบไปถึงสนามรบ อยางนอยก็ในพื้นที่ที่มีถนนดี"
 air_base_expansion_focus:0 "ขยายฐานทัพอากาศ"
 air_base_expansion_focus_desc:0 "เพื่อสนับสนุนกองทัพบกไดดียิ่งขึ้น กองทัพอากาศตองการฐานทัพอากาศที่ใหญขึ้น"
 armor_innovations_focus:0 "นวัตกรรมยานเกราะ"
 armor_innovations_focus_desc:0 "เมื่อกองทัพบกรุงเรือง นายพลบางคนเสนอใหเราลงทุนในยานเกราะสมัยใหมจํานวนหนึ่ง"
 naval_innovations_focus:0 "นวัตกรรมกองทัพเรือ"
 naval_innovations_focus_desc:0 "เมื่อกองทัพเรือไดรับการยอมรับเปนเหลาทัพอันดับหนึ่งของจักรวรรดิแลว เราจึงควรทุมทรัพยากรใหกับการออกแบบเรือชั้นใหมมากขึ้น"
 naval_air_innovations_focus:0 "นวัตกรรมการบินนาวี"
 naval_air_innovations_focus_desc:0 "ภารกิจหลักของกองทัพอากาศตองเปนการสนับสนุนกองทัพเรืออันเกรียงไกรของเรา!"
 convoy_protection_focus:0 "การคุมครองขบวนเรือลําเลียง"
 convoy_protection_focus_desc:0 "แมจะเปนยุทธวิธีที่ขี้ขลาดและไรเกียรติ แตชาติศัตรูอาจมุงโจมตีเรือสินคาที่ขนสงเสบียงและทรัพยากรทั่วจักรวรรดิของเรา เราตองศึกษาวิธีที่ดีที่สุดในการปกปองเรือเหลานี้ หากเรื่องเชนนี้เกิดขึ้น"
 advanced_torpedoes_focus:0 "ตอรปโดขั้นสูง"
 advanced_torpedoes_focus_desc:0 "ดวยการใชออกซิเจนอัดแทนอากาศอัดในระบบขับเคลื่อน ตอรปโดของเราจะเดินทางไดไกลขึ้นและบรรทุกหัวรบที่ใหญกวาตอรปโดแบบใด ๆ กอนหนา"
 shbb_focus:0 "เรือประจัญบานหนักพิเศษ"
 shbb_focus_desc:0 "ในระยะสั้น เราคงไมสามารถสรางเรือประจัญบานไดมากกวาอังกฤษหรือสหรัฐอเมริกา แตบางทีเราอาจไมจําเปนตองทําเชนนั้น เราอาจสรางเรือประจัญบานที่ทรงพลังกวาที่สนธิสัญญาวอชิงตันอนุญาตใหชาติตะวันตกสรางไดอยางมหาศาลแทน"
 naval_base_focus:0 "ขยายฐานทัพเรือ"
 naval_base_focus_desc:0 "การขยายกองทัพเรือตองการฐานทัพเรือเพิ่มขึ้น"
 carrier_focus:0 "มุงเนนเรือบรรทุกเครื่องบิน"
 carrier_focus_desc:0 "ญี่ปุนตองการกองทัพเรือที่ทรงพลัง และเรือบรรทุกเครื่องบินตองเปนแกนหลักแหงกําลังของกองเรือเรา ยุคของเรือประจัญบานไดสิ้นสุดลงแลว ดังที่ศัตรูของเราจะไดรูในไมชา!"
