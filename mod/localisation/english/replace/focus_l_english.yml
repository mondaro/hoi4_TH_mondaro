 FRA_defensive_focus:0 "มุงเนนการตั้งรับ"
 FRA_defensive_focus_desc:0 "ในยามเชนนี้ ทางที่ดีที่สุดคือเสริมการปองกันของเรา หากมีภัยคุกคาม ก็ปลอยใหมันมาหาเรา เพื่อที่เราจะจัดการกับมันบนแผนดินของเราเอง เรามีผูที่เหมาะสมที่สุดในการนํากองทัพของเราแลว ขอเพียงคําสั่งจากทาน"
