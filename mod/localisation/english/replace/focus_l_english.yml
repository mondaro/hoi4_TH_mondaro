 continuous_naval_production:0 "การผลิตทางเรือ"
 continuous_naval_production_desc:0 "ดวยการทุมทรัพยากรใหอูตอเรือและยกเวนการเกณฑทหารใหชางตอเรือฝมือดี เราจะลดเวลาการผลิตเรือไดอยางมาก"
 continuous_air_production:0 "การผลิตอากาศยาน"
 continuous_air_production_desc:0 "เราสามารถจัดระเบียบอุตสาหกรรมการบินใหมเพื่อขจัดความสิ้นเปลืองและทําใหการผลิตคลองตัวขึ้น"
 continuous_non_factory_construct:0 "วิศวกรรมการกอสราง"
 continuous_non_factory_construct_desc:0 "อุตสาหกรรมการกอสรางของเรายังมีสวนที่หยอนยานอยูมาก หากเรามุงความสนใจไปที่มัน เราจะเพิ่มความเร็วการกอสรางไดอยางมีนัยสําคัญ นาเสียดายที่การผลิตเครื่องมือกลกลายเปนคอขวดสําคัญในการขยายอุตสาหกรรมหนักของเรา ดังนั้นจึงจะไมไดรับประโยชนจากความพยายามในดานนี้"
 continuous_reduce_training_time:0 "การฝกกองทัพบก"
 continuous_reduce_training_time_desc:0 "ดวยการจัดตั้งหนวยฝกขั้นสูงเฉพาะทางภายในแตละกองพล เราสามารถสงแมแตกองพลที่เดิมตองถูกกันไวใหฝกจนจบไปยังแนวหนาได"
 continuous_suppression:0 "การปราบปรามการตอตาน"
 continuous_suppression_desc:0 "ดวยการแทรกซึมกลุมตอตานหลักในดินแดนยึดครองและเกลี้ยกลอมผูนําของพวกเขาใหแปรพักตร เราสามารถลดความเสียหายที่พวกเขากอไดอยางมาก"
 continuous_repair:0 "การซอมแซมสิ่งกอสราง"
 continuous_repair_desc:0 "เราจะจัดตั้งทีมซอมแซมเฉพาะทางจากคนงานโรงงานและคนงานกอสราง และควบคุมการสงกําลังจากสวนกลางเพื่อเรงการฟนฟูโครงสรางพื้นฐานที่เสียหาย"
 continuous_tech_share:0 "การแบงปนเทคโนโลยี"
 continuous_tech_share_desc:0 "เราจะสงเสริมใหสถาบันวิจัยและมหาวิทยาลัยของเราติดตอกับสถาบันคูเทียบในประเทศพันธมิตร ซึ่งจะทําใหเราไดรับโบนัสการแบงปนเทคโนโลยี"
 continuous_boost_freedom:0 "เพิ่มอํานาจปกครองตนเอง"
 continuous_boost_freedom_desc:0 "ดวยการจัดระเบียบระบบราชการอาณานิคมใหมและรับสมัครผูบริหารชาวพื้นเมือง ในที่สุดเราจะสามารถดูแลกิจการของเราเองได"
 continuous_restrict_freedom:0 "ปราบปรามรัฐในอารักขา"
 continuous_restrict_freedom_desc:0 "ประชากรในอาณานิคมของเรามีความคิดเหลวไหลเกี่ยวกับเรื่องอยาง "การกําหนดชะตากรรมตนเอง" หรือ "เอกราชของชาติ" ถึงเวลาทําใหพวกเขาเลิกคิดเรื่องเหลานี้แลว"
 continuous_special_facility: "การกอสรางสิ่งอํานวยความสะดวก"
 continuous_special_facility_desc: "เรามีโอกาสปรับปรุงสถานที่วิจัยใหรองรับนักวิทยาศาสตรไดมากขึ้น เพื่อคนหาความกาวหนาครั้งใหมที่จะเปลี่ยนแปลงการสงครามในอนาคตของเรา"
