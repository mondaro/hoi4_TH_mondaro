 HUN_unify_with_austria_tt: "\nพวกเขามีแนวโนมจะยอมจํานนมากขึ้นหาก:\n - พวกเขามี§Hการสนับสนุนสงครามตํ่ากวา 50%§!\n - พวกเขาไมไดอยูใน§Hฝาย§!ใด\n - พวกเขามี§Hความเห็นที่ดี§!ตอเรา\n - §Hกองทัพของพวกเขาออนแอกวา§!ของเรา"
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§! §Rแทบไมมีทาง§!ยอมตามขอเรียกรองของเรา เวนแตจะตกอยูในสถานการณสิ้นหวัง\n\n"
 CAN_offer_concessions_for_labrador_tooltip:1 "§H[ENG.GetName]§! มีแนวโนมจะพิจารณาคําขอนี้มากกวาการยื่นคําขาดโดยตรง พวกเขาจะ§Gมีแนวโนมมากขึ้น§!ที่จะยอมตามคําขอของเราหาก:\n  - อยูในภาวะสงคราม\n  - มีความเห็นที่ดีตอเรา\n  - มีความคืบหนาการยอมจํานนมากกวา §H25%§!\n  - มีอุดมการณเดียวกับเรา\n\nหากพวกเขายอมรับ:\n"
 tfv_canada.63.t:0 "[CAN.GetNameDef]เสนอสัมปทานเพื่อแลกนิวฟนดแลนด"
 tfv_canada.63.d:0 "รัฐบาลใหมของรัฐ[CAN.GetAdjective]ยื่นขอเสนอที่นาสนใจเพื่อขอสัมปทานดินแดนของเราในนิวฟนดแลนด แมกฎหมายของชาติเราจะรับรองวารัฐเปนหนึ่งเดียวแบงแยกมิได แตที่ปรึกษาของเราเรงเราใหพิจารณาความเปนไปไดที่แนวรบใหมอาจดึงความสนใจไปจากสถานการณในยุโรป"
 tfv_canada.63.a:0 "เปนเชนนั้น"
 tfv_canada.63.b:0 "ไมมีวัน!"
 CAN_offer_concessions_for_labrador_and_newfoundland:0 "สัมปทานแลบราดอรและนิวฟนดแลนด"
 CAN_offer_concessions_for_labrador_and_newfoundland_desc:0 "อังกฤษอางอํานาจปกครองเหนือดินแดนที่อยูติดกับใจกลางประเทศของเรา แมเราไมตองการทําสงครามกับศัตรูที่เหนือกวา แตพวกเขาอาจยอมพิจารณาการแลกเปลี่ยนที่ไมคอยเปนประโยชนนัก หากสถานการณบีบบังคับ"
 AST_central_bureau:0 "ประสานงานสํานักงานกลาง"
 AST_central_bureau_desc:0 "สํานักงานสื่อสารและขาวกรองที่ประสานงานรวมกับสหรัฐฯ จะมอบความไดเปรียบทางยุทธศาสตรใหเราในพายุที่กําลังจะมาถึง ความเชี่ยวชาญของเราในดานนี้ควรไดรับการยอมรับ"
 HUN_a_new_flagship:0 "ความภาคภูมิใจแหงกองเรือ"
 HUN_a_new_flagship_desc:0 "ประวัติศาสตรอันเลื่องลือของประเพณีทางเรือของเราเต็มไปดวยบททดสอบ ความยากลําบาก และการทรยศ เพื่อฟนฟูความภาคภูมิใจในมรดกของเรา เหลาพลเรือเอกจึงเสนอใหสรางเรือธงลําใหมเพื่อปลุกใจคนทั้งชาติ"
 HUN_dockyards:0 "ฟนฟูอุตสาหกรรมการเดินเรือ"
 HUN_dockyards_desc:0 "เมื่อเราตั้งเปาหมายอยางแนวแนที่จะฟนฟูพรมแดนของเรา เราตองเริ่มพัฒนากองเรือเมดิเตอรเรเนียนใหทัดเทียมความรุงโรจนในอดีต"
 if_no_depression_get_stuff_TT:0 "\nหาก §H$CAN_great_depression_1$§! ถูกยกเลิกไปแลว จะไดรับโบนัสอื่นแทน\n\n"
 BEL_luxembourg_war_goal: "การผนวกรวมลักเซมเบิรก"
 BEL_luxembourg_war_goal_desc: "ลักเซมเบิรกมีหลายสิ่งรวมกับเบลเยียม ทั้งภาษา วัฒนธรรม และภูมิศาสตร ทั้งสองยอมควรรวมเปนหนึ่งเดียวกัน!"

