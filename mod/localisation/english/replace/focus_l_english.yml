 GER_secure_the_new_state:0 "สรางความมั่นคงใหรัฐใหม"
 GER_secure_the_new_state_desc:0 "เนื่องจากถือกําเนิดจากสงครามกลางเมือง รัฐบาลเฉพาะกาลจึงยังขาดความเขมแข็ง เราตองทําใหมั่นใจวารัฐบาลมั่นคงและไมอาจถูกโคนลมไดโดยงาย"
 GER_clamp_down_on_fascism:0 "ปราบปรามลัทธิฟาสซิสต"
 GER_clamp_down_on_fascism_desc:0 "ในชวงไมกี่ปที่ผานมาภายใตระบอบนาซี ธรรมชาติอันกดขี่ เผด็จการ และตอตานราชวงศของรัฐบาลรวมถึงนักอุดมการณและผูสนับสนุนฟาสซิสตไดปรากฏชัดเกินไปแลว เราตองทําใหมั่นใจวาแนวคิดของพวกเขาจะถูกบดขยี้ไมวาจะโผลหัวขึ้นมาที่ใด"
