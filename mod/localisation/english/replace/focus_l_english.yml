 GER_reichskommissariats_tt: "เปดใหจัดตั้ง §Yรัฐในอารักขา§! และ §Yเขตการปกครอง§! แบบพิเศษในดินแดนที่พิชิตได เชน §Yไรชสคอมมิสซาเรียท§! และ §Yรัฐอารักขา§! อีกทั้งยังเปดใหแบงยุโรปออกเปนเขตอิทธิพลตามที่วางแผนไว\n"
