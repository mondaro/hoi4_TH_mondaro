 GER_land_cruiser_equipment_1_short: "Ratte"
 GER_land_cruiser_equipment_1_desc: "P.1000 Ratte เปนแนวคิดรถถังหนักพิเศษของเยอรมนีที่พัฒนาขึ้นในชวงสงครามโลกครั้งที่สอง Krupp เสนอแบบนี้ในป 1942 โดยวาดภาพยานหุมเกราะขนาดยักษหนัก 1000 ตัน ติดปนเรือขนาด 280mm สองกระบอก อาวุธรองหลายชนิด และเกราะหนาถึง 360mm Ratte ถูกวางใหเปนปอมปราการเคลื่อนที่ที่สามารถบดขยี้การตอตานใด ๆ ในสนามรบ อยางไรก็ตาม ดวยขนาดมหึมา การกินเชื้อเพลิงสูง และความไมสมเหตุสมผลดานการสงกําลังบํารุง โครงการนี้จึงถูกมองวาเปนไปไมไดและถูกยกเลิกในที่สุดในป 1943"

