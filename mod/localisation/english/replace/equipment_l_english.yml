 GER_medium_tank_equipment_2_short: "Panzer IV"
 GER_medium_tank_equipment_2_desc: "Panzer IV ออกแบบมาเปนรถถังสนับสนุนทหารราบ เดิมไมไดตั้งใจใหตอสูกับยานเกราะขาศึก เพราะหนาที่นั้นเปนของ Panzer III ที่เบากวา อยางไรก็ตาม เมื่อขอบกพรองของหลักนิยมกอนสงครามปรากฏชัด และตองเผชิญหนากับรถถัง T-34 ของโซเวียต Panzer IV จึงรับบทบาทตอสูรถถังแทนญาติที่ลาสมัยลงเรื่อย ๆ ในไมชา ในฐานะรถถังเยอรมันที่ผลิตและใชงานมากที่สุดในสงครามโลกครั้งที่สอง Panzer IV ยังเปนพื้นฐานของยานรบอื่นอีกมากมาย"
