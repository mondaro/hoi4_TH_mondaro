l_english:
 submarine: "เรือดํานํ้า"
 submarine_desc: "เรือดํานํ้าอาศัยการพรางตัวและตอรปโดอันทรงพลังเพื่อทําลายขบวนเรือลําเลียงของขาศึก"
 both_cruisers_desc: "เรือลาดตระเวนเบา - เรือคุมกันขนาดเบา หนาที่หลักคือปกปองเรือหลักจากเรือเบาของขาศึก แตก็สามารถยิงตอรปโดอันทรงพลังที่ทําความเสียหายแกเรือขนาดใหญได\n\nเรือลาดตระเวนหนัก - เรือลาดตระเวนหุมเกราะขนาดใหญที่ยืดหยุนพอสมควร เปนตัวเลือกที่ดีสําหรับประเทศที่ไมมีกําลังพอจะสรางเรือหลักขนาดใหญกวา"
 light_cruiser: "เรือลาดตระเวนเบา"
 light_cruiser_desc: "เรือคุมกันขนาดเบา หนาที่หลักคือปกปองเรือหลักจากเรือเบาของขาศึก แตก็สามารถยิงตอรปโดอันทรงพลังที่ทําความเสียหายแกเรือขนาดใหญได"
 heavy_cruiser: "เรือลาดตระเวนหนัก"
 heavy_cruiser_desc: "เรือลาดตระเวนหุมเกราะขนาดใหญที่ยืดหยุนพอสมควร เปนตัวเลือกที่ดีสําหรับประเทศที่ไมมีกําลังพอจะสรางเรือหลักขนาดใหญกวา"
 destroyer: "เรือพิฆาต"
 destroyer_desc: "เรือคุมกันที่เบาที่สุด มีหนาที่ปกปองเรือขนาดใหญกวา และคนหาและทําลายเรือดํานํ้า"
 ship_hull_light: "ตัวเรือเบา"
 ship_hull_light_desc: "เรือคุมกันที่เบาที่สุด มีหนาที่ปกปองเรือขนาดใหญกวา และคนหาและทําลายเรือดํานํ้า"
 carrier: "เรือบรรทุกเครื่องบิน"
 carrier_desc: "เรือหลักที่สามารถนํากองบินของอากาศยานประจําเรือบรรทุกเครื่องบินอันทรงพลังเขาสูการรบ ยังมีประโยชนในฐานะสนามบินลอยนํ้าที่คุณสามารถวางกําลังไวนอกชายฝงของขาศึก"
 battleship: "เรือประจัญบาน"
 battleship_desc: "เรือหลักขนาดใหญที่สุด พรอมปนใหญที่สุดและเกราะแข็งแกรงที่สุดที่เงินจะซื้อได การลงทุนราคาแพงเชนนี้สมควรไดรับการสนับสนุนอยางเหมาะสมจากเรือคุมกันขนาดเล็ก"
 armor_desc: "เกราะที่ใหญและแข็งแกรงที่สุดที่เงินจะซื้อได"
 battle_cruiser: "เรือลาดตระเวนประจัญบาน"
 battle_cruiser_desc: "เรือหลักขนาดใหญที่มักมีขีดความสามารถเชิงรุกใกลเคียงเรือประจัญบาน แตยอมแลกเกราะที่ออนกวากับความเร็วที่สูงกวา"
 convoy: "ขบวนเรือลําเลียง"
 convoy_desc: "ขบวนเรือลําเลียงใชสําหรับการคาสินคาและทรัพยากรระหวางประเทศ ยังใชลําเลียงทหารและดําเนินการยกพลขึ้นบกดวย"
 sh_battleship: "เรือประจัญบานซูเปอรเฮฟวี"
 sh_battleship_desc: "เรือหลักขนาดใหญที่สุด พรอมปนใหญที่สุดและเกราะแข็งแกรงที่สุดที่เงินจะซื้อได การลงทุนราคาแพงเชนนี้สมควรไดรับการสนับสนุนอยางเหมาะสมจากเรือคุมกันขนาดเล็ก"
 light_airframe: "โครงอากาศยานเบา"
 light_airframe_desc: "อากาศยานที่ใชโครงอากาศยานเบา"
 medium_airframe: "โครงอากาศยานขนาดกลาง"
 medium_airframe_desc: "อากาศยานที่ใชโครงอากาศยานขนาดกลาง"
 heavy_airframe: "โครงอากาศยานหนัก"
 heavy_airframe_desc: "อากาศยานที่ใชโครงอากาศยานหนัก"
 jet_engines: "เครื่องยนตไอพน"
 JET_ENGINES_SPECIAL: "การพัฒนาเครื่องยนตไอพนเปนเงื่อนไขสําคัญที่ตองมีกอนการพัฒนาอากาศยานขับเคลื่อนดวยไอพน ตองวิจัยสิ่งนี้กอนจึงจะวิจัยอากาศยานขั้นสูงได"
 jet_engines_desc: "เครื่องยนตไอพนคือความกาวหนาครั้งสําคัญของเทคโนโลยีขับเคลื่อน ซึ่งจะเปดทางสูการพัฒนาอากาศยานยุคใหมโดยสิ้นเชิง"
 convoy_1: "ขบวนเรือลําเลียง"
 armored_car_equipment: "รถหุมเกราะ"
 armored_car_equipment_desc: "ยานยนตลอหุมเกราะนํ้าหนักเบา นิยมใชในการลาดตระเวนและปราบปรามการตอตาน แตสามารถติดตั้งอาวุธที่หนักกวาได"
 motorized_equipment: "รถบรรทุก"
 motorized_equipment_desc: "รถบรรทุกที่ใชลําเลียงทหาร เสบียง และใชปรับกองพลใหเปนหนวยยานยนต"
 motorized_equipment_0: "รถบรรทุกยุคแรก"
 motorized_equipment_0_desc: "ในชวงมหาสงคราม กองทัพตาง ๆ เริ่มใชรถบรรทุกพลเรือนพื้นฐานเพื่อลําเลียงเสบียงและขนยุทโธปกรณ นับแตนั้นรถบรรทุกก็กลายเปนสวนสําคัญของกองทัพสวนใหญ"
 motorized_equipment_1: "รถบรรทุก"
 motorized_equipment_1_desc: "การปรับทหารราบเปนหนวยยานยนตคือขั้นแรกสูการปรับกองทัพใหเปนหนวยยานเกราะ รถบรรทุกพลเรือนดัดแปลงใชทางทหารไดงาย ทั้งลําเลียงทหาร ลากจูงปน และขนยุทโธปกรณกับเสบียง ซึ่งเพิ่มความคลองตัวทางยุทธศาสตรของหนวยทหารราบอยางมาก จากเดิมที่ตองอาศัยการเดินเทา"
 support_equipment_short: "ยุทโธปกรณสนับสนุน"
