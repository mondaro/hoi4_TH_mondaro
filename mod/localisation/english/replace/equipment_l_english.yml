 tank_armor_upgrade: "เกราะ"
 tank_armor_upgrade_desc: "เกราะที่ขาศึกเจาะไมทะลุเปนขอไดเปรียบมหาศาลสําหรับกองพลของคุณ แตก็อาจทําใหเคลื่อนที่ชาลง"
 tank_gun_upgrade: "ปนหลัก"
 tank_gun_upgrade_desc: "สิ่งสําคัญคือตองมีปนที่ตามทันความแข็งแกรงของเกราะขาศึกและเจาะทะลุได"
 tank_aa_upgrade: "อาวุธตอสูอากาศยาน"
 tank_aa_upgrade_desc: "ทําใหมั่นใจวาอาวุธตอสูอากาศยานของเราสามารถยิงเครื่องบินรุนลาสุดใหตกได"
 tank_at_upgrade: "อาวุธตอสูรถถัง"
 tank_at_upgrade_desc: "ทําใหมั่นใจวารถถังพิฆาตของเราสามารถเอาชนะรถถังรุนลาสุดของขาศึกได"
 tank_art_upgrade: "อาวุธปนใหญ"
 tank_art_upgrade_desc: "ทําใหมั่นใจวาปนใหญอัตตาจรของเรามีอํานาจการยิงมหาศาลที่จะฉีกทําลายขาศึกที่ไรเกราะไดทุกหนวย"
 tank_reliability_upgrade: "ความนาเชื่อถือ"
 tank_reliability_upgrade_desc: "การปรับปรุงความนาเชื่อถือจะทําใหยุทโธปกรณชํารุดเสียหายนอยลงและตองเปลี่ยนทดแทนนอยลง"
 mech_cost_upgrade: "ตนทุนการผลิต"
 mech_cost_upgrade_desc: "การปรับแตงแบบใหเหมาะสมและการใชวัสดุที่สําคัญนอยกวาทดแทนชวยใหสรางยานไดเร็วขึ้น แตจะมีขอบกพรองเพิ่มขึ้นเล็กนอย"
 tank_engine_upgrade: "เครื่องยนต"
 tank_engine_upgrade_desc: "ความคลองตัวที่มากขึ้นใหขอไดเปรียบทั้งทางยุทธวิธีและยุทธศาสตร อีกทั้งยังติดเกราะไดมากขึ้นโดยไมทําใหชาลงมากนัก"
 ac_engine_upgrade: "เครื่องยนต"
 ac_engine_upgrade_desc: "ความคลองตัวที่มากขึ้นใหขอไดเปรียบทั้งทางยุทธวิธีและยุทธศาสตร อีกทั้งยังติดเกราะไดมากขึ้นโดยไมทําใหชาลงมากนัก"
 ship_gun_upgrade: "ปน"
 ship_gun_upgrade_desc: "สิ่งสําคัญคือตองมีปนที่ตามทันความแข็งแกรงของเกราะขาศึกและเจาะทะลุได"
 ship_torpedo_upgrade: "ตอรปโด"
 ship_torpedo_upgrade_desc: "ตอรปโดเปนการโจมตีอันทรงพลังที่เรือขนาดเล็กสามารถยิงไดเมื่อเขาสูระยะ และมีโอกาสสูงที่จะสรางความเสียหายรายแรง"
 ship_armor_upgrade: "เกราะ"
 ship_armor_upgrade_desc: "เกราะที่มากขึ้นเพื่อปกปองเรือของคุณจากการยิงของขาศึก"
 carrier_armor_upgrade: "เกราะ"
 carrier_armor_upgrade_desc: "เกราะที่มากขึ้นเพื่อปกปองเรือของคุณจากการยิงของขาศึก"
 ship_engine_upgrade: "เครื่องยนต"
 ship_engine_upgrade_desc: "เรือที่มีเครื่องยนตทรงพลังกวาสามารถควบคุมระยะหางจากคูตอสูในการรบได"
 ship_reliability_upgrade: "ความนาเชื่อถือ"
 ship_reliability_upgrade_desc: "เรือที่มีความนาเชื่อถือสูงจะมีโอกาสถูกโจมตีจุดสําคัญนอยลง ซึ่งการโจมตีดังกลาวสามารถสรางความเสียหายมหาศาลแกเรือที่ไมไดออกแบบโครงสรางมาอยางรอบคอบ"
 ship_anti_air_upgrade: "ตอสูอากาศยาน"
 ship_anti_air_upgrade_desc: "ยิ่งมีปนสาดกระสุนขึ้นฟามากเทาไร เครื่องบินขาศึกก็ยิ่งถูกยิงตกมากเทานั้น!"
