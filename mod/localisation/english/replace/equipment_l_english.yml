 mechanized_equipment_1_desc: "ทหารราบยานเกราะลําเลียงพลติดตั้งรถหุมเกราะลําเลียงพล (APC) หรือรถรบทหารราบ (IFV) เพื่อใชขนสงและสูรบ ทหารราบยานเกราะลําเลียงพลแตกตางจากทหารราบยานยนตตรงที่ยานพาหนะของพวกเขาใหการปองกันจากการยิงของขาศึกไดระดับหนึ่ง ตางจากยานพาหนะลอยางไรเกราะ (รถบรรทุกหรือรถจี๊ป) ของทหารราบยานยนต"
 mechanized_equipment_2: "ยุทโธปกรณยานเกราะลําเลียงพล II"
