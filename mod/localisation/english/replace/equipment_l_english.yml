 GER_medium_tank_artillery_equipment_2_short: "Hummel"
 GER_medium_tank_artillery_equipment_2_desc: "Hummel (ภาษาเยอรมัน: 'ผึ้งภู') เปนปนใหญอัตตาจรที่สรางบนแชสซี Geschützwagen III/IV ติดปนฮาวอิตเซอรขนาด 15 ซม. กองทัพแวรมัคทของเยอรมนีใชงานในสงครามโลกครั้งที่สองตั้งแตตนป 1943 จนสิ้นสงคราม"
