 GER_light_tank_equipment_3_desc: "VK1602 Leopard เปนยานลาดตระเวนตามแผนของเยอรมนีที่ออกแบบในป 1942 เดิมวางแผนจะติดปน 75mm KwK 41 แตภายหลังเปลี่ยนเปนปนใหญขนาด 50 มม. ที่เล็กกวา VK 1602 มีเกราะหนาลาดเอียงซึ่งไดรับอิทธิพลจากรถถังกลาง Panther และเพื่อเพิ่มสมรรถนะการเคลื่อนที่ในภูมิประเทศ VK 1602 จึงติดสายพานกวาง 350 มม."
