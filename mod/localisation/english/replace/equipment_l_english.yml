 GER_medium_tank_destroyer_equipment_1: "Sturmgeschütz III"
 GER_medium_tank_destroyer_equipment_1_short: "StuG III"
 GER_medium_tank_destroyer_equipment_1_desc: "ปนจูโจม Sturmgeschütz III เปนยานรบหุมเกราะที่เยอรมนีผลิตมากที่สุดในสงครามโลกครั้งที่สอง สรางบนแชสซีของรถถัง Panzer III ที่พิสูจนตัวเองแลว เดิมตั้งใจใหเปนปนเบาหุมเกราะเคลื่อนที่สําหรับสนับสนุนทหารราบ แต StuG ไดรับการดัดแปลงอยางตอเนื่องและถูกใชเปนรถถังพิฆาตอยางกวางขวาง"
 GER_medium_tank_destroyer_equipment_2: "Jagdpanzer IV"
 GER_medium_tank_destroyer_equipment_2_short: "JagdPz IV"
 GER_medium_tank_destroyer_equipment_2_desc: "Jagdpanzer IV ประจําการในกองพันตอสูรถถังของกองพลยานเกราะและกองพลยานเกราะ SS รวมรบในนอรม็องดี ยุทธการตอกลิ่ม (Battle of the Bulge) และแนวรบดานตะวันออก เปนรถถังพิฆาตที่ประสบความสําเร็จอยางมาก แตทําไดไมดีเมื่อถูกใชผิดบทบาทแทนรถถัง ถึงกระนั้นในชวงทายสงครามก็ถูกใชแทนรถถังมากขึ้นเรื่อย ๆ เพราะบอยครั้งไมมีอะไรอื่นใหใช"
 GER_medium_tank_destroyer_equipment_3: "Jagdpanther"
 GER_medium_tank_destroyer_equipment_3_short: "Jagdpanther"
 GER_medium_tank_destroyer_equipment_3_desc: "Jagdpanther (ภาษาเยอรมัน: 'เสือดํานักลา') เปนรถถังพิฆาตที่นาซีเยอรมนีสรางในสงครามโลกครั้งที่สองบนแชสซีของรถถัง Panther เขาประจําการในชวงปลายสงคราม (1944) และรบทั้งในแนวรบดานตะวันออกและตะวันตก Jagdpanther ผสานปนใหญ 8.8 cm PaK 43 อันทรงพลังของ Tiger II เขากับเกราะและระบบรองรับอันยอดเยี่ยมของแชสซี Panther แตก็ไดรับผลกระทบจากสภาพยํ่าแยของเยอรมนีในชวงหลังของสงคราม สงผลใหผลิตไดนอย ขาดแคลนอะไหล และพลประจํารถไดรับการฝกไมดี"
