 GER_heavy_tank_equipment_3_short: "King Tiger"
 GER_heavy_tank_equipment_3_desc: "เปนที่รูจักในชื่อไมเปนทางการวา Königstiger ซึ่งทหารฝายสัมพันธมิตรมักแปลกึ่งตรงตัววา King Tiger แบบรถถังยึดแนวคิดเดียวกับ Tiger I แตตั้งใจใหนาเกรงขามยิ่งกวา Tiger II ผสานเกราะหนาของ Tiger I เขากับเกราะลาดเอียงแบบที่ใชในรถถังกลาง Panther รถถังหนักเกือบเจ็ดสิบเมตริกตัน มีเกราะดานหนาหนา 100 ถึง 180 มม. และติดปนลํากลองยาว 8.8 cm Kampfwagenkanone 43 L/71"
