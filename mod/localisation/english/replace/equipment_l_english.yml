 GER_medium_tank_artillery_equipment_1_short: "Grille"
 GER_medium_tank_artillery_equipment_1_desc: "Sd.Kfz. 138/1 Grille (ภาษาเยอรมัน: 'จิ้งหรีด') เปนปนใหญอัตตาจรที่เยอรมนีใชในสงครามโลกครั้งที่สอง ผลิตราว 490-500 คัน ใชงานโดยกองรอยปนทหารราบของกรมทหารยานเกราะลําเลียงพล (Panzergrenadier) เพื่อใหการยิงสนับสนุนหนักแบบเคลื่อนที่"
