 GER_medium_tank_equipment_3: "Panzerkampfwagen V Panther"
 GER_medium_tank_equipment_3_short: "Panther"
 GER_medium_tank_equipment_3_desc: "Panther คือชื่อเรียกทั่วไปของรถถังกลางที่เยอรมนีใชในสงครามโลกครั้งที่สอง ตั้งแตกลางป 1943 จนสงครามในยุโรปยุติในป 1945 ออกแบบมาเพื่อรับมือ T-34 ของรัสเซีย และเพื่อแทนที่ Panzer III และ Panzer IV แมจะไมเคยแทนที่ Panzer IV ได แตก็ประจําการเคียงขางกันและรวมกับรถถัง Tiger ที่หนักกวาจนสิ้นสงคราม การผสมผสานอันยอดเยี่ยมระหวางอํานาจการยิง ความคลองตัว และการปองกันของ Panther กลายเปนมาตรฐานสําหรับการออกแบบรถถังของชาติอื่นในชวงปลายสงครามและหลังสงคราม และถือเปนหนึ่งในรถถังที่ดีที่สุดของสงครามโลกครั้งที่สอง"
