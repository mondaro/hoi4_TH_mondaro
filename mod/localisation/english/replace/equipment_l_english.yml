 GER_mechanized_equipment_1_desc: "Sd.Kfz. 11 (Sonderkraftfahrzeug - ยานยนตพิเศษ) เปนรถกึ่งสายพานของเยอรมนีที่ถูกใชงานอยางแพรหลายในสงครามโลกครั้งที่สอง สามารถบรรทุกทหารไดแปดนายพรอมกับลากปนใหญหรือรถพวง"
