 GER_medium_tank_aa_equipment_1: "Flakpanzer III Möbelwagen"
 GER_medium_tank_aa_equipment_1_short: "Möbelwagen"
 GER_medium_tank_aa_equipment_1_desc: "ไดฉายาวา Möbelwagen (รถขนเฟอรนิเจอร) เพราะปอมปนทรงกลองเมื่อปด เปนปนตอสูอากาศยานอัตตาจรแบบชั่วคราวที่สรางจากแชสซีของ Panzer IV และติดปนขนาด 3.7 ซม."
 GER_medium_tank_aa_equipment_2: "Flakpanzer IV Ostwind"
 GER_medium_tank_aa_equipment_2_short: "Ostwind"
 GER_medium_tank_aa_equipment_2_desc: "Flakpanzer IV 'Ostwind' (ภาษาเยอรมัน: 'ลมตะวันออก') เปนปนตอสูอากาศยานอัตตาจรที่สรางบนรถถัง Panzer IV พัฒนาในป 1944 เพื่อสืบตอจาก Flakpanzer IV รุนกอน ปอมปนของ Panzer IV ถูกถอดออกและแทนที่ดวยปอมหกเหลี่ยมหลังคาเปดซึ่งติดปน 3.7 cm FlaK 43 แบบหลังคาปดจะดีกวา แตทําไมไดเพราะปนกอควันหนาทึบ"
