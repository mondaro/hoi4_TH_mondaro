 medium_tank_destroyer_equipment_desc: "รถถังพิฆาตคือยานสายพานที่ติดปนใหญกวาปกติบนฐานยึดตายตัวแทนปอมปน รถถังพิฆาตขนาดกลางสรางบนแชสซีของรถถังกลาง จึงคอนขางคลองตัวและมีอํานาจการยิงนาเกรงขาม"
