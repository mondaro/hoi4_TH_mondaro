 infantry_equipment_short: "ยุทโธปกรณทหารราบ"
 infantry_equipment_desc: "อาวุธประจํากายและอาวุธประจําหนวยของทหารราบ รวมถึงอุปกรณอื่น ๆ ที่ทหารคนหนึ่งจําเปนตองมี"
 infantry_equipment_0: "ยุทโธปกรณทหารราบพื้นฐาน"
 infantry_equipment_0_short: "ยุทโธปกรณพื้นฐาน"
 infantry_equipment_0_desc: "ยุทโธปกรณพื้นฐานของทหารราบที่พัฒนาขึ้นกอนและระหวางมหาสงคราม"
 infantry_equipment_1: "ยุทโธปกรณทหารราบ I"
 infantry_equipment_1_short: "อาวุธ I"
 infantry_equipment_1_desc: "อาวุธประจํากายและอาวุธประจําหนวยของทหารราบ รวมถึงอุปกรณอื่น ๆ ที่ทหารคนหนึ่งจําเปนตองมี"
 infantry_equipment_2: "ยุทโธปกรณทหารราบ II"
 infantry_equipment_2_short: "อาวุธ II"
 infantry_equipment_2_desc: "อาวุธประจํากายและอาวุธประจําหนวยของทหารราบ รวมถึงอุปกรณอื่น ๆ ที่ทหารคนหนึ่งจําเปนตองมี ปรับปรุงใหทันสมัยโดยเพิ่มปนกลมือและปนเล็กยาวตอสูรถถังจํานวนมาก"
 infantry_equipment_3: "ยุทโธปกรณทหารราบ III"
 infantry_equipment_3_short: "อาวุธ III"
 infantry_equipment_3_desc: "อาวุธประจํากายและอาวุธประจําหนวยของทหารราบ รวมถึงอุปกรณอื่น ๆ ที่ทหารคนหนึ่งจําเปนตองมี ปรับปรุงใหทันสมัยยิ่งขึ้นโดยเพิ่มปนเล็กยาวจูโจมประจํากายและจรวดตอสูรถถัง"

 gw_armored_car_equipment: "รถหุมเกราะยุคระหวางสงคราม"
 gw_armored_car_equipment_desc: "ในขณะที่รถหุมเกราะรุนกอน ๆ เปนเพียงรถเชิงพาณิชยที่หุมแผนเหล็กบาง ๆ รุนนี้ไดรับการออกแบบตั้งแตตนเพื่อรองรับเกราะและอาวุธเบา"
 armored_car_equipment_1: "รถหุมเกราะพื้นฐาน"
 armored_car_equipment_1_desc: "การจัดวางภายในที่ดีขึ้นและที่เก็บกระสุนเพิ่มเติมทําใหรถหุมเกราะมีประสิทธิภาพมากขึ้น"
 armored_car_equipment_2: "รถหุมเกราะปรับปรุง"
 armored_car_equipment_2_desc: "ความเปลี่ยนแปลงในสนามรบตองการอาวุธที่หนักขึ้นมากและเกราะที่หนาขึ้น เพื่อเอาชนะหนวยเบาของขาศึกและรอดกลับมารายงานได"
 armored_car_at_equipment: "รถหุมเกราะตอสูรถถัง"
 armored_car_at_equipment_desc: "หนวยยานเกราะเบาของเรายอมตองปะทะกับกองกําลังรถถังของขาศึกในสักวันหนึ่ง การพัฒนารุนตอสูรถถังโดยเฉพาะจะทําใหพวกเขามีโอกาสตอกร"

