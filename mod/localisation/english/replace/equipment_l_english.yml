 GER_light_tank_equipment_1_desc: "Panzer I เปนรถถังเบาที่ผลิตในเยอรมนีในทศวรรษ 1930 เริ่มออกแบบในป 1932 และเริ่มผลิตจํานวนมากในป 1934 แมตั้งใจใหเปนเพียงรถถังฝกเพื่อแนะนําแนวคิดสงครามยานเกราะแกกองทัพเยอรมัน แต PzKpfw I กลับถูกใชในการรบอยางกวางขวางเนื่องจากขาดแคลนรถถังที่ทันสมัยกวา"
