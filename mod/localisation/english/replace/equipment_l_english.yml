 GER_medium_tank_equipment_1: "Panzerkampfwagen III"
 GER_medium_tank_equipment_1_short: "Panzer III"
 GER_medium_tank_equipment_1_desc: "ตั้งแตป 1934/35 นายพลไฮนทซ กูเดรีอัน ไดวางแนวคิดรถถังพื้นฐานสองแบบใหเปนยุทโธปกรณหลักที่มีจํานวนมากที่สุดของกองพลยานเกราะเยอรมันในอนาคต แบบแรกติดปนตอสูรถถังและปนกลสองกระบอก สวนแบบที่สองเปนยานสนับสนุนที่ติดปนขนาดลํากลองใหญกวา แบบแรกในที่สุดเปนที่รูจักในชื่อ Panzerkampfwagen III ซึ่งจะเปนรถถังมาตรฐานของกองรอยเบาทั้งสามของกองพันรถถัง สวนแบบที่สองเปนที่รูจักในชื่อ Panzerkampfwagen IV"
