 gw_tank_equipment_desc: "รถถังในสงครามโลกครั้งที่หนึ่งถูกพัฒนาแยกกันแตในเวลาเดียวกันโดยสหราชอาณาจักรและฝรั่งเศส เพื่อทําลายภาวะชะงักงันของสงครามสนามเพลาะบนแนวรบดานตะวันตก ชื่อ Tank (ถังนํ้า) ถูกอังกฤษนํามาใชในชวงแรกของการพัฒนาเพื่อปกปดจุดประสงคที่แทจริง รถถังยุคแรกติดอาวุธปนกลและปนใหญขนาดเล็ก เคลื่อนที่ชา และมีเกราะเพียงพอแคตานกระสุนอาวุธเบาเทานั้น"
 GER_gw_tank_equipment: "Leichttraktor"
 GER_gw_tank_equipment_short: "Leichttraktor"
 GER_gw_tank_equipment_desc: "Leichttraktor เปนรถถังทดลองของเยอรมนี หลังสงครามโลกครั้งที่หนึ่ง เยอรมนีถูกสนธิสัญญาแวรซายจํากัดการพัฒนาทางทหาร แตโครงการลับภายใตชื่อบังหนา 'Traktor' ไดพัฒนายานรบหุมเกราะและปนใหญ"
