 BRA_liberated_by_communist_brazil: "ไดรับการปลดปลอยโดย[BRA.GetNameDefCap]"
 BRA_liberated_by_communist_brazil_desc: "ในที่สุดประเทศของเราก็ไดรับเอกราชอันชอบธรรมจากเจาอาณานิคม ดวยความชวยเหลือของ[BRA.GetNameDef] เราไดกลับมาเปนประเทศเสรีอีกครั้ง และเมื่อการกระทําของพวกเขาชวยเหลือเราอยางเห็นไดชัด แนวคิดคอมมิวนิสตที่พวกเขาเผยแพรก็เริ่มฝงรากในหมูประชาชนของเรา"
