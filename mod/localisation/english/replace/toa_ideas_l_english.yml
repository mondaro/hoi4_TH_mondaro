 PAR_febrerista_land_reform: "การปฏิรูปที่ดินของกลุมเฟเบรริสตา"
 PAR_guarani_in_the_army: "ภาษากวารานีในกองทัพ"
 PAR_guarani_in_the_army_desc: "ระหวางสงครามชาโก กองทัพปารากวัยไดนําภาษากวารานีมาใชสื่อสารระหวางทหารกับกองบัญชาการระดับสูงแทนภาษาสเปน เพื่อไมใหศัตรูชาวโบลิเวียถอดความไดงาย ซึ่งพิสูจนแลววาไดผลอยางยิ่ง"

 BOL_era_of_national_regression: "ยุคแหงการถดถอยของชาติ"
 BOL_era_of_national_regression_desc: "หลายทศวรรษที่ผานมาเปนชวงเวลาที่ยากลําบากสําหรับโบลิเวีย เริ่มจากสงครามแปซิฟกในป 1879 ถึง 1883 ตามดวยสงครามอากรีในป 1899 ถึง 1903 และทายที่สุดคือความพายแพครั้งลาสุดของชาติในสงครามชาโกระหวางป 1932 ถึง 1935"
