 BRA_us_of_brazil: "ปกปองเสรีภาพ"
 BRA_us_of_brazil_desc: "อุดมการณแหงเสรีภาพและประชาธิปไตยคือรากฐานที่สาธารณรัฐของเราสรางขึ้นมา เราจะทําทุกวิถีทางเพื่อปกปองคุณคาเหลานี้ทั้งในประเทศและตางแดนหากจําเปน"
 BRA_radicalized_proletariat: "ชนชั้นกรรมาชีพหัวรุนแรง"
 BRA_radicalized_proletariat_desc: "แนวคิดคอมมิวนิสตไดฝงรากลงในชนชั้นแรงงานของ[BRA.GetNameDef] เรากําลังเดินบนเสนดายระหวางการเอาใจพวกเขากับการไมทําใหฝายทหารไมพอใจ" 
 BRA_aid_brazilian_communists: "ชวยเหลือคอมมิวนิสตบราซิล"
 BRA_us_of_south_america: "ผูพิทักษแหงแดนใต"
 BRA_us_of_south_america_desc: "พรมแดนของเราขยายออกจนครอบคลุมทวีปสวนใหญ เราจึงถือเปนหนาที่อันศักดิ์สิทธิ์ที่จะปกปองสิทธิของทุกคนที่เรียกอเมริกาใตวาบาน"
 BRA_stability_and_unity: "ระเบียบและความกาวหนา"
 BRA_stability_and_unity_desc: "ดวยการเดินเกมการเมืองอยางรอบคอบ เราไดสรางสาธารณรัฐที่เขมแข็งและเปนปกแผนยิ่งขึ้น บนรากฐานนี้เราจะปกปองพลเมืองของประเทศอันยิ่งใหญของเราตอไป"
 BRA_romanticize_the_old_empire_idea: "กระแสนิยมจักรวรรดิ"
 BRA_romanticize_the_old_empire_idea_desc: "ผูที่ไมพอใจรัฐบาลบราซิลมีอยูไมนอย ดวยการจุดกระแสนิยมจักรวรรดิและความโหยหาอดีตขึ้นมาใหม เราจะรวมกลุมที่แตกแยกเหลานี้ใหเปนพลังหนึ่งเดียว"
