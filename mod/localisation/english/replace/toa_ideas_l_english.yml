 USA_monroe_doctrine_idea: "ลัทธิมอนโร"
 USA_monroe_doctrine_idea_desc: "สหรัฐอเมริกาใหสัญญามานานแลววาจะปกปองซีกโลกตะวันตกจากการแทรกแซงของมหาอํานาจอาณานิคมภายนอก หมายความวาการรุกลํ้าดินแดนของเราใด ๆ มีแนวโนมที่สหรัฐอเมริกาจะเขามาชวยเหลือ แตหากแนวทางการเมืองของเราไมสอดคลองกับสหรัฐอเมริกาอีกตอไป เราอาจพบวาตนเองไรผูคุมครอง"
 USA_monroe_doctrine_enforcer: "ผูบังคับใชลัทธิมอนโร"
 USA_monroe_doctrine_enforcer_desc: "นับตั้งแตกลางศตวรรษที่ 19 เราพยายามปกปองซีกโลกตะวันตกจากการแทรกแซงของมหาอํานาจอาณานิคมภายนอก แมขอบเขตของลัทธินี้จะเปลี่ยนแปลงไปตามกาลเวลา แตหัวใจสําคัญคือเพื่อนบานของเราในอเมริกาเหนือและใตจะคาดหวังใหเราชวยเหลือในยามขัดแยง ทั้งนี้ ขึ้นอยูกับรัฐบาลของเราเองที่จะกําหนดวาจะบังคับใชลัทธินี้เมื่อใดและอยางไร"

