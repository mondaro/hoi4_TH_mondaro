 BRA_unwilling_subjects: "ราษฎรที่ไมเต็มใจ"
 BRA_unwilling_subjects_desc: "เมื่อระบอบกษัตริยเขามาครอบงําระบบการเมืองของประเทศมากขึ้นอีกครั้ง ประชาชนก็เริ่มอึดอัดและคับของใจที่ตองตกเปนขาใตปกครองของผูมีอํานาจเบ็ดเสร็จอีกครา"
