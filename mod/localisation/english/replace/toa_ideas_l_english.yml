 BRA_brown_water_navy_idea_bonus_tt: "ทหารราบทุกหนวย:\n §Y-แมนํ้า:§!\n การเคลื่อนที่: §G+10%§!\n การโจมตี: §G+10%§!\n การปองกัน: §G+5%§!"

 ARG_political_corruption_modifier: "การทุจริตทางการเมือง"
 ARG_political_corruption_modifier_desc: "เปนเวลาหลายปที่[ARG.GetNameDef]ประสบปญหาการทุจริตอยางหนักภายในรัฐบาล แมจะเคยคิดกันวาการปลอยใหกลุมกอนกอรดันเซียกอตั้งขึ้นอาจชวยบรรเทาปญหาได แตการโกงคะแนนเสียงและการขมขูผูมีสิทธิเลือกตั้งก็ยังคงมีอยู"
 ARG_modify_corruption_ns_intro: "ปรับ §Y$ARG_political_corruption_modifier$§! โดย"
 ARG_international_loan_modifier: "เงินกูระหวางประเทศ"
 ARG_international_loan_modifier_desc: "ไมใชเรื่องแปลกที่ประเทศตาง ๆ จะขอความชวยเหลือทางการเงินจากชาติอื่นทั่วโลกในยามวิกฤต เมื่อพิจารณาสภาพเศรษฐกิจของ[ROOT.GetNameDef]ในปจจุบัน การรับความชวยเหลือจากมหาอํานาจที่มีบทบาทในความขัดแยงครั้งนี้จึงสมเหตุสมผลอยางยิ่ง"
 ARG_modify_international_loan_intro: "ปรับ §Y$ARG_international_loan_modifier$§! โดย"
 ARG_corruption_crackdown_modifier: "$ARG_crack_down_on_corruption$"
 ARG_corruption_crackdown_modifier_desc: "การทุจริตที่บอนทําลายรัฐบาลของชาติเราเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง ดวยนโยบายของโรแบรโต มาริอา ออรติซ ในที่สุดเราก็เริ่มยุติพฤติกรรมฉอฉลอยางโจงแจงที่นักการเมืองของเรามีสวนรวมได"
 ARG_anti_corruption_modifier: "นโยบายตอตานการทุจริต"
 ARG_anti_corruption_modifier_desc: "การทุจริตที่บอนทําลายรัฐบาลของชาติเราเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง ดวยนโยบายของมารเซโล ที. เด อัลเบอาร ในที่สุดเราก็เริ่มยุติพฤติกรรมฉอฉลอยางโจงแจงที่นักการเมืองของเรามีสวนรวมได"
 ARG_infamous_decade_idea: "ทศวรรษอัปยศ"
 ARG_infamous_decade_idea_desc: "ทศวรรษอัปยศคือชวงเวลาหนึ่งในประวัติศาสตรอารเจนตินาที่เริ่มตนจากรัฐประหารป 1930 ตอประธานาธิบดีอิโปลิโต อีริโกเยน เปนยุคที่โดดเดนดวยสองสิ่ง ดานหนึ่งคือการอพยพออกจากชนบทครั้งใหญหลังภาวะเศรษฐกิจตกตํ่าครั้งใหญ อีกดานหนึ่งคือการโกงการเลือกตั้งอยางโจงแจงเพื่อรักษารัฐบาลอนุรักษนิยมใหอยูในอํานาจ"
 ARG_infamous_decade_2_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_2_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_3_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_3_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_4_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_4_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_public_works_investment_idea: "การลงทุนในงานสาธารณะ"
 ARG_public_works_investment_idea_desc: "เปนเรื่องสําคัญที่รัฐบาล[ARG.GetAdjective]จะตองใหทุนและจัดหาโครงการงานสาธารณะเพื่อการนันทนาการ การจางงาน สาธารณสุข และความปลอดภัย ซึ่งจะชวยยกระดับคุณภาพชีวิตของสังคม[ARG.GetAdjective]โดยรวม"
 ARG_towards_a_greater_argentina_idea: "$ARG_towards_a_greater_argentina$"
 ARG_towards_a_greater_argentina_idea_desc: "[ARG.GetNameDefCap]ประสบความยากลําบากอยางหนักในชวงตนศตวรรษที่ 20 ทั้งจากภาวะเศรษฐกิจตกตํ่าครั้งใหญและการเริ่มตนของทศวรรษอัปยศที่ตามมา แมจะมีการเลือกตั้งที่ฉอฉล ความพยายามกอรัฐประหาร และเจาหนาที่รัฐที่ทุจริตอยูตลอด แตเราก็ผานพนมาไดและกลายเปนชาติที่มีเสถียรภาพและมีประสิทธิภาพ"
 ARG_economic_reactivation_idea: "การฟนฟูเศรษฐกิจ"
 ARG_economic_reactivation_idea_desc: "พระราชบัญญัติการฟนฟูเศรษฐกิจเปนกฎหมายที่ตราขึ้นเพื่อใหเงินของรัฐบาลถูกสงไปพัฒนาภาคเศรษฐกิจและอุตสาหกรรมมากยิ่งขึ้น"
 ARG_civilian_economy_boost_idea: "เศรษฐกิจพลเรือนที่พัฒนาแลว"
 ARG_civilian_economy_boost_idea_desc: "ดวยการวางแผนอยางรอบคอบและการอุดหนุนอยางตรงจุด เราไดพัฒนาเศรษฐกิจพลเรือนอยางเต็มที่ สิ่งอํานวยความสะดวกที่เพิ่มขึ้นสําหรับพลเมืองจะทําใหดัชนีความสุขของชาติคอย ๆ สูงขึ้นตามกาลเวลา"
 ARG_invest_in_roads_idea: "ลงทุนดานถนน"
 ARG_invest_in_roads_idea_desc: "ทางหลวงของประเทศมีความสําคัญยิ่งตอขีดความสามารถทางเศรษฐกิจ อุตสาหกรรม และการทหารของ[ARG.GetNameDef] การลงทุนสรางและบํารุงรักษาทางหลวงจะเปนประโยชนตอเราไปอีกหลายป"
 ARG_invest_in_railways_idea: "ลงทุนดานทางรถไฟ"
 ARG_invest_in_railways_idea_desc: "ในยุคสมัยใหม ทุกอุตสาหกรรมลวนพึ่งพากระดูกสันหลังอยางระบบรถไฟแหงชาติ เมื่อเราขยายเสนทางรถไฟไปทั่วประเทศ เราก็ไดวางรากฐานที่มั่นคงสําหรับการขนสงสินคาจากชุมชนชนบทเขาสูเมือง"
 ARG_roca_runciman_treaty_idea: "สนธิสัญญาโรกา-รันซิมัน"
 ARG_roca_runciman_treaty_idea_desc: "ขอตกลงโรกา-รันซิมันเปนสนธิสัญญาการคาสําคัญระหวาง[ARG.GetNameDef]และ[ENG.GetNameDef] ซึ่งลงนามในเดือนพฤษภาคม 1933 รับประกันให[ARG.GetNameDef]ไดสวนแบงคงที่ในตลาดเนื้อสัตว[ENG.GetAdjective] แลกกับการที่[ARG.GetNameDef]ยอมรับขอจํากัดดานการคาและการแลกเปลี่ยนเงินตรา เพื่อรักษาผลประโยชนทางการคาของ[ENG.GetNameDef]ในประเทศ"
 ARG_eden_malbran_treaty_idea: "สนธิสัญญาอีเดน-มัลบรัน"
 ARG_eden_malbran_treaty_idea_desc: "เพื่อตอบโตขอจํากัดอันเขมงวดในขอตกลงโรกา-รันซิมัน จึงมีการเจรจาขอตกลงใหมภายใตชื่อสนธิสัญญาอีเดน-มัลบรัน ซึ่งใหสัมปทานเพิ่มเติมแก[ENG.GetNameDef] พรอมลดคาระวางขนสงขาวสาลี"
 ARG_raf_cooperation_idea: "ความรวมมือกับ RAF"
 ARG_raf_cooperation_idea_desc: "ขณะที่ความขัดแยงทั่วโลกยังคงลุกลาม เราตองทําทุกอยางเทาที่ทําไดเพื่อสนับสนุนพันธมิตรของเรา ความรวมมือที่ใกลชิดยิ่งขึ้นกับกองทัพอากาศแหงราชอาณาจักรของ[ENG.GetNameDef]จะยกระดับนักบินของเราใหทันสมัยขึ้นอยางแนนอน"
 ARG_argentine_beef_idea: "เนื้อวัวอารเจนตินา"
 ARG_argentine_beef_idea_desc: "นับตั้งแตผูพิชิตชาวสเปนนําวัวเขามายัง[ARG.GetNameDef]เปนครั้งแรกในป 1536 เนื้อวัวก็กลายเปนวัตถุดิบหลักของอาหารอารเจนตินาดั้งเดิม ดวยเหตุนี้ เนื้อวัวของเราจึงมีชื่อเสียงไปทั่วโลก และมีความตองการสงออกสูง"
 ARG_argentine_metropole_idea: "มหานครอารเจนตินา"
 ARG_argentine_metropole_idea_desc: "จนถึงเมื่อไมนานมานี้ ประเทศของเราเจริญรุงเรืองไดดวยกระดูกสันหลังอยางชุมชนเกษตรกรรมและเหมืองแรในชนบท แตเมื่อเราพัฒนาตอไปในศตวรรษที่ 20 กาลเวลาก็เปลี่ยนไป และภาพของชีวิต[ARG.GetAdjective]ในอุดมคติก็เปลี่ยนตามไปดวย ผูคนจํานวนมากหลั่งไหลเขาสูเมืองที่ขยายตัวและเฟองฟูของเรา ดวยหวังจะลงหลักปกฐานและปรับตัวเขากับวิถีชีวิตคนเมือง"
 ARG_our_own_path_idea: "$ARG_our_own_path$"
 ARG_our_own_path_idea_desc: "แมจะตองผานความยากลําบากมากมายกวาจะมาถึงจุดนี้ แต[ARG.GetNameDef]ก็สามารถยืนหยัดไดดวยลําแขงของตนเอง โดยไมตองคุกเขาใหชาติ ฝาย หรือกลุมทุนอื่นใด เราเลือกเสนทางของเราเองในยามผันผวนเชนนี้"
 ARG_british_cooperation_idea: "$ARG_british_cooperation$"
 ARG_british_cooperation_idea_desc: "[ENG.GetNameDefCap]เปนหนึ่งในคูคาที่ยาวนานที่สุดของเรา ขณะที่เรายังคงยึดมั่นในสนธิสัญญาและขอตกลงมากมาย อุดมการณของเราก็อาจเปลี่ยนไปในทิศทางเดียวกับพวกเขา"
 ARG_subdue_dissension_idea: "ปราบปรามความแตกแยกแลว"
 ARG_subdue_dissension_idea_desc: "ความแตกแยกในกองทัพที่ยืดเยื้อมานานถูกปราบลงไดในที่สุด นี่ควรเปนบทเรียนใหเราเฝาระวังความไมสงบที่อาจเกิดขึ้นอีกภายในหนวยงานตาง ๆ ของรัฐบาลในอนาคต"
 ARG_improved_cooperation_idea: "ความรวมมือที่ดีขึ้น"
 ARG_improved_cooperation_idea_desc: "[ARG.GetNameDefCap]และ[ENG.GetNameDef]กําลังมีผลประโยชนสอดคลองกัน"
 ARG_refused_embargo_idea: "ปฏิเสธคําขอใหควํ่าบาตร"
 ARG_refused_embargo_idea_desc: "[ARG.GetNameDefCap]ปฏิเสธคําขอของเราใหควํ่าบาตรฝายอักษะ"
 ARG_maintain_neutrality_idea: "มุงมั่นเพื่อตนเอง"
 ARG_maintain_neutrality_idea_desc: "เราไดแสดงใหเห็นแลววาเราไมสนใจความขัดแยงใหญที่ลุกลามไปทั่วโลก เราตองหวงเรื่องของตัวเองกอนเปนอันดับแรก ขอใหนี่เปนคําประกาศตอทุกฝายวา[ARG.GetNameDef]จะมุงเนนเปาหมายของตนเอง"
 ARG_american_allyship_idea: "ความสัมพันธใกลชิดกับวอชิงตัน"
 ARG_american_allyship_idea_desc: "ดวยเจตนารมณแหงความรวมมือของทวีปอเมริกา เราไดกระชับความสัมพันธทางการเมืองกับ[USA.GetNameDef] ขณะที่เรายืนหยัดรวมกันภายใตถอยคําอันทรงความหมายของลัทธิมอนโร ไมมีมหาอํานาจใดในยุโรปจะแทรกเขามาทําลายแนวรวมอันเปนปกแผนของเราได"
 ARG_envoy_to_london_idea: "ความสัมพันธใกลชิดกับลอนดอน"
 ARG_envoy_to_london_idea_desc: "ตราบใดที่เรายังคงสนับสนุนซึ่งกันและกัน [ENG.GetNameDev]จะมีมิตรแทอยาง[ARG.GetNameDef]เสมอ เปนเรื่องสําคัญที่สองชาติของเราจะตองรักษาความเชื่อมโยงทางการเมืองและทําใหเปาหมายของเราสอดคลองกันตอไป"
 ARG_counter_interlligence_program_idea: "โครงการตอตานขาวกรองอารเจนตินา"
 ARG_counter_interlligence_program_idea_desc: "การจารกรรมเปนหนึ่งในแนวรบมากมายที่เราตองเผชิญในความขัดแยงระดับโลกครั้งนี้ การดําเนินโครงการตอตานขาวกรองของเราเองอยางมีประสิทธิภาพจึงสําคัญยิ่งตอการอยูรอดในสงคราม เราเลือกมุงเนนนโยบายเชิงรับมากกวายุทธวิธีบอนทําลายเชิงรุก"
 ARG_disrupt_bolivar_lar: "ตอตานปฏิบัติการโบลิวาร"
 ARG_disrupt_bolivar_lar_desc: "ปฏิบัติการโบลิวารเปนหนามยอกอกของเรามาหลายปแลว และเปนหนาที่ของเราที่จะยืนหยัดตอตานการจารกรรมอันชั่วรายของศัตรูนี้"
 ARG_cut_ties_with_britain_idea: "ตัดสัมพันธกับอังกฤษ"
 ARG_cut_ties_with_britain_idea_desc: "[ARG.GetNameDefCap]ไดตัดความสัมพันธกับเราแลว"
 ARG_disrupt_bolivar_no_lar: "ขัดขวางปฏิบัติการโบลิวารแลว"
 ARG_disrupt_bolivar_no_lar_desc: "$ARG_disrupt_bolivar_lar_desc$"
 ARG_red_scare_idea: "ผลกระทบจากภัยแดง"
 ARG_red_scare_idea_desc: "ความตึงเครียดทางอุดมการณระหวางสองชาตินี้ปะทุขึ้นจนลนทะลัก"
 ARG_anti_soviet_idea: "กระแสตอตานโซเวียต"
 ARG_anti_soviet_idea_desc: "ภัยคุกคามจากลัทธิคอมมิวนิสตและอันตรายที่มีตอชาติของเรานั้นสําคัญเกินกวาจะมองขาม [SOV.GetNameDefCap]ยังคงพิสูจนตัวเองวาเปนมหาอํานาจที่สามารถทําลายวิถีชีวิตของเราได ประชาชนหวาดกลัวภัยแดง และก็สมควรกลัวแลว!"
 ARG_buying_the_islands_idea: "ซื้อหมูเกาะแอตแลนติกใตแลว"
 ARG_buying_the_islands_idea_desc: "ปรากฏวาการซื้อเกาะทั้งสองเกาะนั้นแพงไมใชเลน เราจะตองผอนชําระหนี้นี้ไปอีกพักใหญ"
 ARG_siam_di_tella: "SIAM Di Tella"
 ARG_chade_cade: "CHADE-CADE"
 ARG_anti_british_sentiment_idea: "กระแสตอตานอังกฤษ"
 ARG_anti_british_sentiment_idea_desc: "นับตั้งแตเราตัดสัมพันธกับ[ENG.GetNameDef] กระแสตอตานอังกฤษก็แทรกซึมเขาสูรัฐบาลของเรา เราไมถูกผูกมัดดวยสนธิสัญญาและขอตกลงการคาของพวกเขาอีกตอไป! บัดนี้เราสามารถทุมเทใหกับสิ่งที่สําคัญกวา นั่นคือสงคราม"
 ARG_growing_nationalism_modifier: "ขบวนการชาตินิยมที่กําลังเติบโต"
 ARG_growing_nationalism_modifier_desc: "พรรคชาตินิยมอารเจนตินาสรางกระแสไปทั่วประเทศ ผูคนจึงหลั่งไหลเขารวมเพื่อสนับสนุนอุดมการณที่กําลังเติบโตของพรรคมากขึ้นเรื่อย ๆ ชาตินิยมอารเจนตินายึดถือแนวคิดการฟนฟูอัตลักษณ[ARG.GetAdjective] และสถาปนาตนเปนมหาอํานาจที่ครอบงําอเมริกาใต"
 ARG_modify_growing_nationalism_ns_intro: "ปรับ §Y$ARG_growing_nationalism_modifier$§! โดย"
 ARG_military_government_idea: "รัฐบาลทหาร"
 ARG_military_government_idea_desc: "เปโดร ปาโบล รามีเรซ เขายึดอํานาจรัฐบาลและสถาปนารัฐที่บริหารโดยทหารขึ้นแทน การเปลี่ยนระบอบครั้งนี้เกิดจากเสียงเรียกรองการเปลี่ยนแปลงมากมายตอกลุมกอนกอรดันเซียที่ทุจริตและฉอฉลในอดีต ดวยแถลงการณที่มุงเนนการขยายดินแดน[ARG.GeAdjective] ประเทศของเรายอมตองเผชิญความขัดแยงมากมายในอนาคตอยางแนนอน"
 ARG_spirit_of_the_conquistadors_idea: "จิตวิญญาณแหงผูพิชิต"
 ARG_spirit_of_the_conquistadors_idea_desc: "เปนเพราะเกียรติภูมิของเหลาผูพิชิตที่นําบรรพบุรุษของเรามาสูดินแดนแหงเงินอันงดงามแหงนี้ พวกเขามีบทบาทสําคัญในประวัติศาสตรของเรา และบัดนี้เปนแรงบันดาลใจใหรัฐบาลชาตินิยมชุดใหมของนิมิโอ เด อันกิน [ARG.GetNameDefCap]จะยิ่งใหญขึ้นเมื่อเราพิชิตเพื่อนบานที่ออนแอกวาและกลายเปนมหาอํานาจที่ครอบงําอเมริกาใต"
 ARG_rapid_militarization_idea: "การเรงสรางกําลังทหาร"
 ARG_rapid_militarization_idea_desc: "การเรงสรางกําลังทหารคือกระบวนการที่สังคมจัดระเบียบตนเองเพื่อรองรับความขัดแยงและความรุนแรงทางทหาร เราไดตัดสินใจพัฒนาศูนยรวมอุตสาหกรรมการทหารอยางเต็มที่และเตรียมพรอมสําหรับการรบที่จะมาถึง"
 ARG_argentine_nationalism_idea: "ชาตินิยมอารเจนตินา"
 ARG_argentine_nationalism_idea_desc: "ในฐานะชาว[ARG.GetAdjective] เรามีสิ่งที่นาภาคภูมิใจมากมาย เราจึงยังคงสงเสริมใหผูคนในพรมแดนของเรายึดถือและสนับสนุนผลประโยชนของชาติ เราไมตองการความชวยเหลือจากผูที่หมายจะใชกฎระเบียบอันเขมงวดหรือขูเราดวยสงคราม [ARG.GetNameDefCap]เปนประเทศที่มีอธิปไตยและยืนหยัดไดดวยตนเอง"
 ARG_war_division_idea: "กองสงคราม"
 ARG_war_division_idea_desc: "เมื่อชาติของเรามีรัฐบาลที่มั่นคงและเศรษฐกิจที่แข็งแกรงแลว ในที่สุดเราก็ไดรับการสนับสนุนจากประชาชนมากพอที่จะเตรียมดําเนินเปาหมายการขยายดินแดนของเรา"
 ARG_preparing_for_war_idea: "เตรียมพรอมสูสงคราม"
 ARG_preparing_for_war_idea_desc: "ทวีปอเมริกาใตทั้งทวีปอยูตรงหนาเรา สุกงอมรอใหเขายึด กองทัพของเราเตรียมพรอมสูสงคราม ขณะที่นักการเมืองและนักการทูตของเราเรงรางเอกสารและคําขาดเพื่อเตรียมการพิชิต อสรพิษพรอมฉกแลว"
 ARG_spirit_of_the_cisplatine_war_idea: "จิตวิญญาณแหงสงครามซิสพลาทีน"
 ARG_spirit_of_the_cisplatine_war_idea_desc: "สงครามซิสพลาทีนเปนที่รูจักกันทั่วไปในชื่อสงครามอารเจนตินา-บราซิล เปนการสูรบที่เกิดขึ้นในทศวรรษ 1820 และนับแตนั้นมา สันติภาพอันตึงเครียดและเปราะบางก็ดํารงอยูระหวางสองชาติของเรา แตบัดนี้ไมใชอีกตอไป [BRA.GetNameDefCap]เปนภัยคุกคามที่ตองจัดการ ทหารของเราเดินทัพไปพรอมจิตวิญญาณแหงอดีตที่หนุนหลัง"
 ARG_integrate_operation_bolivar_idea_lar: "ผนวกรวมปฏิบัติการโบลิวาร"
 ARG_integrate_operation_bolivar_idea_lar_desc: "ดวยความสัมพันธที่ใกลชิดยิ่งขึ้นกับฝายอักษะ เราจึงเริ่มผนวกรวมปฏิบัติการโบลิวารไดสําเร็จ และรวมสนับสนุนสมรภูมิอเมริกาใตดวยโครงการจารกรรมของเราเอง"
 ARG_integrate_operation_bolivar_idea_no_lar: "ผนวกรวมปฏิบัติการโบลิวาร"
 ARG_integrate_operation_bolivar_idea_no_lar_desc: "$ARG_integrate_operation_bolivar_idea_lar_desc$"
 ARG_anti_american_idea: "กระแสตอตานอเมริกา"
 ARG_anti_american_idea_desc: "$ARG_red_scare_idea_desc$"
 ARG_anti_american_propaganda_idea: "โฆษณาชวนเชื่อตอตานอเมริกา"
 ARG_anti_american_propaganda_idea_desc: "[USA.GetNameDefCap]เปนภัยคุกคามสําคัญตอระบอบของเรา แมพวกเขาจะไดชื่อวาเปนยักษหลับ แตเราไมมีทางรูไดวาเมื่อใดพวกเขาจะตื่นขึ้นและหันความสนใจมาที่เรา ดวยฝมือของกรมโฆษณาการ ทหารของเราพรอมเผชิญหนากับภัย[USA.GetAdjective]จากทางเหนือแลว"
 ARG_state_unions_idea: "สหภาพแรงงานของรัฐ"
 ARG_state_unions_idea_desc: "สหภาพแรงงานคือองคกรของคนงานที่มุงรักษาและปรับปรุงสภาพการจางงาน ซึ่งรวมถึงคาจางและสวัสดิการที่ดีขึ้น ความปลอดภัยและสภาพการทํางานที่ดีขึ้น ตลอดจนการดูแลไมใหคนงานทั่วไปถูกฝายบริหารปฏิบัติอยางไมเปนธรรม"
 ARG_FJC_empowered_idea: "เสริมอํานาจ FJC"
 ARG_FJC_empowered_idea_desc: "สหพันธเยาวชนคอมมิวนิสตแหงอารเจนตินาเปนหนึ่งในองคกรการเมืองเยาวชนที่ทรงอิทธิพลที่สุดในประวัติศาสตรของประเทศ เปนองคกรเยาวชนในสังกัด PCA กอตั้งขึ้นในป 1921 เพื่อเผยแพรนโยบายของพรรคในหมูเยาวชนอารเจนตินา เมื่อ PCA ครองอํานาจรัฐบาลอยางเต็มที่แลว FJC ก็สามารถเติบโตตอไปและหลอหลอมคนหนุมสาวของอารเจนตินาใหเปนนักปฏิวัติเต็มตัว!"
 ARG_state_atheism_idea: "อเทวนิยมโดยรัฐ"
 ARG_state_atheism_idea_desc: "อเทวนิยมโดยรัฐคือการนําอเทวนิยมแบบเขมขนมาผนวกเขากับระบอบการเมือง หลายคนมองวาเปนขั้วตรงขามของเทววิทยา และเปนนโยบายที่รัฐคอมมิวนิสตนิยมใช โดยเดินตามรอยสหภาพโซเวียตเมื่อครั้งขึ้นสูอํานาจ"
 ARG_liberation_theology_idea: "เทววิทยาการปลดปลอย"
 ARG_liberation_theology_idea_desc: "เทววิทยาการปลดปลอยเปนแนวทางหนึ่งของศาสนาคริสตที่เนนการปลดปลอยผูถูกกดขี่ ในฐานะศาสนา แนวคิดนี้วิเคราะหประเด็นทางสังคมและเศรษฐกิจ ใสใจตอคนยากจน และมุงปลดปลอยทางการเมืองใหแกผูถูกกดขี่ เทววิทยาการปลดปลอยกอตัวขึ้นจากความปรารถนาของประชาชนเราที่ตองการเสรีภาพทางศาสนาและการสนับสนุนเปาหมายการปฏิวัติของเรา"
 ARG_committee_of_state_security_idea_lar: "คณะกรรมการความมั่นคงแหงรัฐ"
 ARG_committee_of_state_security_idea_lar_desc: "คณะกรรมการความมั่นคงแหงรัฐอารเจนตินาจัดตั้งขึ้นตามแบบอยางหนวยขาวกรองรัสเซีย เพื่อปฏิบัติภารกิจขาวกรองตางประเทศ การตอตานขาวกรอง และตํารวจลับ"
 ARG_committee_of_state_security_idea_no_lar: "$ARG_committee_of_state_security_idea_lar$"
 ARG_committee_of_state_security_idea_no_lar_desc: "$ARG_committee_of_state_security_idea_lar_desc$"
 ARG_socialist_unification_idea: "การรวมชาติสังคมนิยม"
 ARG_socialist_unification_idea_desc: "ดวยพลังแหงการปฏิวัติอันรุงโรจน ในที่สุดเราก็สถาปนาตนเปนอุดมการณที่ครอบงําทวีปอเมริกาใต สงครามครั้งนี้ซึ่งไดชัยมาดวยเลือดและความกลาหาญ ไดปลุกความปรารถนาในหมูประชาชนของเราใหมีมาตุภูมิที่ยิ่งใหญกวาเดิมสําหรับสาธารณรัฐสังคมนิยมอเมริกาใต"
 ARG_eliminate_american_imperialism_idea: "ปฏิบัติการอัสดงสีชาด"
 ARG_eliminate_american_imperialism_idea_desc: "ยักษใหญทางเหนือยืนหยัดเปนปอมปราการของทุนนิยมมานานแลว ถึงเวลาที่เราจะยุติจักรวรรดินิยมอเมริกันและนํามาซึ่งอัสดงสีชาด"
 ARG_women_in_industry_idea: "$ARG_women_in_industry$"
 ARG_women_in_industry_idea_desc: "การที่ผูนําของ[ARG.GetNameDef]เปนสตรีไดสรางบรรทัดฐานวาสตรีควรมีสิทธิทํางานในอุตสาหกรรมอื่น ๆ ดวย แรงงานจํานวนมากที่เพิ่มเขามานี้จะนําความกาวหนาทางเศรษฐกิจครั้งใหญมาสูประเทศของเรา"
 ARG_socialist_volunteers_idea: "$ARG_socialist_volunteers$"
 ARG_socialist_volunteers_idea_desc: "เพื่อชวยใหการปฏิวัติระหวางประเทศมั่นคง เราตองใหความชวยเหลือแกรัฐสังคมนิยมพี่นองทุกครั้งที่จําเปน หากเรามีกําลังพลเหลือพอ เราตองสงอาสาสมัครไปชวยตอสูกับชนชั้นกระฎมพีทั่วโลก!"
 ARG_free_association_idea: "สมาคมเสรีของผูผลิต"
 ARG_free_association_idea_desc: "สมาคมเสรีคือความสัมพันธระหวางปจเจกบุคคลที่ปราศจากรัฐ ชนชั้นทางสังคม ลําดับชั้น หรือกรรมสิทธิ์สวนบุคคลในปจจัยการผลิต ตามแนวคิดของฝายอนาธิปไตย-สหการนิยมที่ครองอํานาจ สิ่งนี้จะทําใหปจเจกบุคคลรวมกลุมกันไดอยางเสรีโดยไมมีขอจํากัดทางสังคม เพื่อผลิตและสรางเงื่อนไขการดํารงชีวิตของตนเอง"
 ARG_no_gods_no_masters_idea: "¡Liberación! - ปลดปลอย!"
 ARG_no_gods_no_masters_idea_desc: "แมประเทศอื่น ๆ ในทวีปอาจไมเห็นพองกับรัฐบาลของเรา แตการนั่งดูพวกเขาถูกผูรุกรานที่บาคลั่งและกาวราวพิชิตไปก็ขัดกับอุดมการณของเรา หากเพื่อนบานคนใดตกอยูใตเงื้อมมือผูรุกราน เราตองจับอาวุธขึ้นเพื่อปลดปลอยพวกเขา"
 ARG_regulated_salaries: "ควบคุมคาจาง"
 ARG_regulated_salaries_desc: "เราไดดําเนินมาตรการปองกันไมใหพลเมืองที่มีงานทําไดรับคาจางตํ่าเกินไปจากอุตสาหกรรมในประเทศ ขอตกลงที่ทํารวมกับทั้งภาคอุตสาหกรรมและคนงานพิสูจนแลววาเปนประโยชนอยางยิ่งตอประเทศของเรา"
 ARG_social_welfare_fund_ns: "กองทุนสวัสดิการสังคม[ARG.GetAdjective]"
 ARG_social_welfare_fund_ns_desc: "[ARG.GetNameDef]ไดเพิ่มการใชจายดานมาตรการสวัสดิการสังคม ขณะนี้เราเริ่มเห็นผลดีจากงบประมาณที่เพิ่มขึ้น ทั้งในรูปของประชาชนที่พึงพอใจมากขึ้นและทัศนคติตอรัฐบาลที่ดีขึ้นเรื่อย ๆ"
 ARG_british_argentine_agreement: "ขอตกลง[ENG.GetAdjective]-[ARG.GetAdjective]"
