 CHL_compania_general_electricidad: "บริษัทไฟฟาทั่วไป (CGE)"
 CHL_compania_general_electricidad_desc: "CGE กอตั้งเมื่อวันที่ 21 กุมภาพันธ 1905 โดยกลุมผูเชี่ยวชาญซึ่งนําโดยวิศวกรฟรันซิสโก อูเนอุส กานา และราอุล กลาโร โซลาร เปนผูพัฒนาดานอิเล็กทรอนิกสรายใหญที่สุดใน[ROOT.GetName]"
 CHL_compania_sudamerica_vapores: "บริษัทเดินเรือกลไฟอเมริกาใต (CSAV)"
 CHL_compania_sudamerica_vapores_desc: "CSAV เปนบริษัทเดินเรือ[CHL.GetAdjective] ซึ่งปจจุบันเปนบริษัทประเภทนี้ที่ใหญที่สุดในละตินอเมริกา และเปนหนึ่งในบริษัทที่เกาแกที่สุด กอตั้งเมื่อป 1872 สามารถใชเพื่อเพิ่มการผลิตเรือเดินทะเลพลเรือนได"
 CHL_via_trans_radio: "บริษัทวิทยุโทรเลขชิลี (VTR)"
 CHL_via_trans_radio_desc: "VTR กอตั้งเมื่อวันที่ 26 กันยายน 1928 จากการรวมลงทุนของ Radio Corporation of America, Marconi Wireless Telegraph Company, Compagnie Generale de Telegraphie sans Fils และ Telefunken Gesellschaft บริษัทใหบริการวิทยุโทรเลขทั้งในและนอกประเทศ และเปนหนึ่งในบริษัทโทรคมนาคมเอกชนแหงแรก ๆ ใน[ROOT.GetName]"
 CHL_banco_central_de_chile: "ธนาคารกลางแหงชิลี"
 CHL_banco_central_de_chile_desc: "ธนาคารกลางแหงชิลีกอตั้งขึ้นในเดือนสิงหาคม 1925 ตามพระราชกฤษฎีกาที่ 486 ซึ่งยังกําหนดใหธนาคารผูกขาดการออกธนบัตรภายใตระบบมาตรฐานทองคํา ธนาคารถูกกอตั้งขึ้นในสมัยแรกของประธานาธิบดีอารตูโร อาเลสซันดรี"
 CHL_compania_electro_industrial_valdivia: "บริษัทเหล็กและอุตสาหกรรมไฟฟาแหงบัลดิเบีย"
 CHL_compania_electro_industrial_valdivia_desc: "ESVAL เปนอุตสาหกรรมเหล็กและเหล็กกลาที่ตั้งอยูในบัลดิเบีย ประเทศชิลี ถือเปนผูสืบทอดของ Altos Hornos y Acerías de Corral ซึ่งไดซื้อโครงสรางพื้นฐานมาในป 1926 เมื่อผูประกอบการจากบัลดิเบียกอตั้งบริษัทขึ้น"
 CHL_empresa_ferrocarries_del_estado: "การรถไฟแหงรัฐ (EFE)"
 CHL_empresa_ferrocarries_del_estado_desc: "EFE คือการรถไฟแหงชาติและรัฐวิสาหกิจที่เกาแกที่สุดในชิลี ดูแลโครงสรางพื้นฐานและใหบริการเดินรถไฟในประเทศ"
 CHL_compania_manufacura_cartones: "บริษัทผลิตกระดาษและกระดาษแข็ง (CMPC)"
 CHL_compania_manufacura_cartones_desc: "CMPC เปนบริษัทเยื่อกระดาษและกระดาษ[CHL.GetAdjective] มีสํานักงานใหญที่ซานติอาโก เปนผูผลิตกระดาษรายใหญที่สุดในประเทศ บริษัทกอตั้งเมื่อป 1920 จากการควบรวมโรงงานของการตอนเดลไมโปและเอสเปรันซา และการรวมมือระหวางนักธุรกิจลุยส มัตเต ลารราอิน กับวิศวกรชาวเยอรมันเฆรมัน เอ็บบิงเฮาส"
 CHL_corporacion_fomento_production: "บรรษัทสงเสริมการผลิตแหงชิลี (CORFO)"
 CHL_corporacion_fomento_production_desc: "หลังแผนดินไหวที่ชิยัน CORFO ไดถูกกอตั้งขึ้นเพื่อแจกจายสิ่งของแกผูประสบภัย รวมทั้งชวยควบคุม แจกจาย และขนสงสินคาภายในประเทศ[ROOT.GetAdjective]"
 
