 BRA_presidential_republic: "สาธารณรัฐระบบประธานาธิบดี"
 BRA_presidential_republic_desc: "ประเทศชาติตองการผูนําที่เขมแข็งและเด็ดขาด ผูสามารถรวมใจประชาชนและปกปองพรมแดนของเราได ดวยเหตุนี้ เราจึงรวมอํานาจทางการเมืองไวที่ประธานาธิบดีแหงสาธารณรัฐ แตก็ตองมีระบบตรวจสอบและถวงดุลที่เขมแข็ง เพื่อปองกันไมใหมีวารกัสคนใหมพยายามยึดอํานาจ"
 BRA_tax_haven: "แหลงหลบเลี่ยงภาษีที่กําลังเฟองฟู"
 BRA_tax_haven_desc: "ภาษีนิติบุคคลที่ตํ่าและชองโหวทางกฎหมายหลายประการทําใหบรรษัทขามชาติยายเขามาในบราซิลมากขึ้น อยางไรเสีย ไดภาษีจากพวกเขาบางก็ยังดีกวาไมไดเลย"
 BRA_nationalized_banks: "ธนาคารของรัฐ"
 BRA_nationalized_banks_desc: "ดวยการโอนธนาคารเปนของรัฐ เราสามารถควบคุมปริมาณเงินในระบบเศรษฐกิจไดมากขึ้น และเปลี่ยนเสนทางเงินจากกระเปาผูถือหุนไปสูมือของกรรมกร"
 #BRA_court_the_military_ideaa: "Courting the Military"
 #BRA_court_the_military_ideaa_desc: "We can not maintain our grip on power without the established influence and resources of the military. At least for the time being, we must try to keep them on our side."
 BRA_collaboration_with_the_church: "รวมมือกับศาสนจักร"
 BRA_collaboration_with_the_church_desc: "ศาสนจักรมีความสําคัญยิ่งตอชาวบราซิลจํานวนมาก การปรึกษาหารือกับศาสนจักรในเรื่องนโยบายจะทําใหรัฐบาลของเราไดรับการสนับสนุนจากมวลชน"
 BRA_atheist_state: "รัฐอเทวนิยม"
 BRA_atheist_state_desc: "ในฐานะรัฐที่มุงเนนความกาวหนาทางวิทยาศาสตร เราไมอาจเสียเวลาไปเอาใจนักบวช การบริหารประเทศกับศาสนาของประชาชนไมควรปะปนกัน และเราตั้งใจจะรักษาไวเชนนั้น"
 BRA_collectivized_agriculture: "เกษตรกรรมแบบนารวม"
 BRA_collectivized_agriculture_desc: "การรวมอุตสาหกรรมเกษตรเปนแบบนารวมทําใหมีประสิทธิภาพมากขึ้น และเสริมสรางอุดมการณคอมมิวนิสตในหมูประชาชนของเรา"
 BRA_article_138: "มาตรา 138"
