 CHL_stricter_labor_laws: "กฎหมายแรงงานที่เขมงวดขึ้น"
 CHL_enact_stricter_labor_laws_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$CHL_stricter_labor_laws$§! ถูกนําออก จะปรับ §Y$CHL_chilean_economy_dynamic_modifier$§! ดังนี้:\n $MODIFIER_STABILITY_FACTOR$: §G+10%§! \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-25%§!"

 CHL_carabineros_de_chile_fascist: "การาบิเนโรสแหงชิลี"
 CHL_carabineros_de_chile_fascist_desc: "การาบิเนโรสแหงชิลีเปนกองตํารวจภูธรผูบังคับใชกฎหมายระดับชาติของเรา ซึ่งมีอํานาจครอบคลุมทั่วทั้งประเทศ กอตั้งโดยอดีตประธานาธิบดีการโลส อิบัญเญซ เดล กัมโป เมื่อป 1927 ภารกิจของพวกเขาคือการรักษาความสงบเรียบรอยและบังคับใชกฎหมายของชิลี"
 CHL_carabineros_de_chile_neutrality: "การาบิเนโรสแหงชิลี"
 CHL_carabineros_de_chile_neutrality_desc: "การาบิเนโรสแหงชิลีเปนกองตํารวจภูธรผูบังคับใชกฎหมายระดับชาติของเรา ซึ่งมีอํานาจครอบคลุมทั่วทั้งประเทศ กอตั้งโดยประธานาธิบดีผูยิ่งใหญของเรา การโลส อิบัญเญซ เดล กัมโป เมื่อป 1927 ภารกิจของพวกเขาคือการรักษาความสงบเรียบรอยและบังคับใชกฎหมายของชิลี"

 CHL_the_francoist_model: "แบบอยางฟรังโก"
 CHL_the_francoist_model_desc: "ดวยการเดินตามหลักการของเผด็จการที่วางตัวเปนกลาง ดังเชนที่นายพลฟรันซิสโก ฟรังโก แหงสเปนไดใหคํามั่นไว เราจะสามารถหลีกเลี่ยงความขัดแยงระดับโลก และหันมามุงเนนเขตอิทธิพลของเราเองแทน"
 CHL_the_francoist_model_conquest: "แบบอยางฟรังโก"
 CHL_the_francoist_model_conquest_desc: "ดวยการเดินตามหลักการของเผด็จการที่วางตัวเปนกลาง ดังเชนที่นายพลฟรันซิสโก ฟรังโก แหงสเปนไดใหคํามั่นไว เราจะสามารถหลีกเลี่ยงความขัดแยงระดับโลก และหันมามุงเนนเขตอิทธิพลของเราเองแทน"

 CHL_state_supporting_resistance_modifier: "การตอตานที่ชิลีหนุนหลัง"
 CHL_state_supporting_resistance_modifier_desc: "ชิลีกําลังลอบสงอาวุธและยุทโธปกรณ รวมถึงการฝกทางทหารใหแกกลุมตอตานและกองโจรในทองถิ่น"

 CHL_mapuche_nationalism_dynamic_modifier: "ชาตินิยมมาปูเช"
 CHL_mapuche_nationalism_dynamic_modifier_desc: "ชาตินิยมมาปูเชแมจะมีอยู แตก็ยังไมแพรหลายในประเทศของเรามานานนัก เราจึงตองหลอหลอมมันดวยตนเอง เพื่อใหมันมีรูปแบบตามที่เราปรารถนามากที่สุด"

 CHL_an_empire_in_the_pacific_idea: "จักรวรรดิในแปซิฟก"
 CHL_an_empire_in_the_pacific_idea_desc: "ในที่สุดก็ถึงเวลาที่[CHL.GetNameDef]จะทวงคืนชะตากรรมของตนและสรางจักรวรรดิอันเกรียงไกรในแปซิฟก"

 CHL_mapuche_social_classes: "ชนชั้นทางสังคมและอัตลักษณทางเพศรวมของมาปูเช"
 CHL_mapuche_social_classes_desc: "ดวยการนําชนชั้นทางสังคมและบรรทัดฐานของสังคมดั้งเดิมของเรามาใชในสังคมใหม เราจะทําใหมันรุงเรืองไดอีกครั้ง"

 CHL_cattle_and_wool: "ปศุสัตวและขนแกะของมาปูเช"
 CHL_cattle_and_wool_desc: "ดวยเทคนิคการตอนสัตวและการเลี้ยงปศุสัตวอันยอดเยี่ยมของชาวมาปูเช ประเทศจึงสามารถใชประโยชนจากทรัพยากรอันนอยนิดที่มีไดอยางเต็มที่"

 CHL_machi_in_the_army: "องคกรมาชีในกองทัพ"
 CHL_machi_in_the_army_desc: "ดวยการใหหมอผีมาชีเดินทัพไปพรอมกับกองกําลังของเรา เราจะมั่นใจไดวาทหารจะกระปรี้กระเปราและมีขวัญกําลังใจอยูเสมอ"

 CHL_legacy_of_caupolican: "มรดกของเกาโปลิกัน"
 CHL_legacy_of_caupolican_desc: "มรดกของเกาโปลิกันยังคงสงผลตอเรามาจนถึงทุกวันนี้ และจิตวิญญาณกับเจตจํานงของเขาจะสืบทอดตอไปในความคิดและการกระทําของทหารของเรา"

 CHL_unified_in_spirit_idea: "หนึ่งเดียวในจิตวิญญาณ"
 CHL_unified_in_spirit_idea_desc: "ชนพื้นเมืองอเมริกันและชาวโพลินีเชียกําลังรวมมือกันประสานงานและฝกกองทัพ ทําใหมีประสิทธิภาพสูงขึ้นอยางมาก"

 CHL_patagonian_giants: "ยักษแหงปาตาโกเนีย"
 CHL_patagonian_giants_desc: "กาลครั้งหนึ่ง ชาวปาตาโกเนสเคยสรางความหวาดกลัวในใจแมแตนักสํารวจชาวยุโรปที่กลาหาญที่สุด เราควรทําใหกองทัพของเราเปนตัวแทนแหงจิตวิญญาณของชนในตํานานเหลานี้ และไดรับความเคารพยําเกรงจากทุกผูคนรอบตัวเรา"

 CHL_crusade_against_imperialism_idea: "สงครามครูเสดครั้งใหญตอตานจักรวรรดินิยม"
 CHL_crusade_against_imperialism_idea_desc: "ในที่สุดก็ถึงเวลาที่จะขับไลมหาอํานาจจักรวรรดินิยมและเจาอาณานิคมออกจากทวีปของเรา และปลดปลอยชนพื้นเมืองอเมริกันและชาวโพลินีเชียจากการกดขี่ของตางชาติ!"

 CHL_local_mapuche_defense_groups: "กลุมปองกันตนเองมาปูเชทองถิ่น"

 CHL_ibanez_foriegn_support: "การลงทุนทางเศรษฐกิจจากตางประเทศ"
 CHL_ibanez_foriegn_support_desc: "ดวยเงินกูใหมจํานวนมหาศาล ประเทศจึงคอย ๆ กลับมาเดินหนาไดอีกครั้ง ขณะที่เงินทุนใหมหลั่งไหลเขาสูภาคอุตสาหกรรมของเรา"

 CHL_state_catholicism_idea: "นิกายคาทอลิกประจําชาติ"
 CHL_state_catholicism_idea_desc: "ในอีกกาวหนึ่งสูกลุมประเทศที่ใชภาษาฝรั่งเศส [CHL.GetNameDef]ไดรับเอานิกายคาทอลิกเปนศาสนาประจําชาติใหม"

 CHL_french_investments: "การลงทุนจากฝรั่งเศส"
 CHL_french_investments_desc: "ฌัก อองตวน แบรนาร เดินทางมายังประเทศพรอมเงินทุนสนับสนุนจากขุนนางฝรั่งเศสที่ไมพอใจสาธารณรัฐที่ตนอาศัยอยู โดยหวังจะไดอนาคตที่ดีกวาใน[CHL.GetNameDef]"

 CHL_veteran_legionaries: "ทหารผานศึกกองทหารตางดาว"
 CHL_veteran_legionaries_desc: "สมาชิกกองทหารตางดาวฝรั่งเศสจํานวนมากไดรวมเดินทางมากับอองตวน แบรนารสูประเทศของเรา และจะชวยเหลือเขาในการพิชิตอันรุงโรจน"
 CHL_popular_resistance: "การตอตานของประชาชน"
 CHL_popular_resistance_desc: "ยังมีผูคนอีกมากในประเทศที่ไมเชื่อในพระปรีชาสามารถของกษัตริยอองตวน แบรนาร พวกเขาตองถูกจัดการโดยเร็ว!"

 CHL_french_aristocracy: "ชนชั้นสูงฝรั่งเศส"
 CHL_araucanian_aristocracy: "ชนชั้นสูงใหมแหงอาเรากาเนีย"
 araucanian_capital_perquenco: "เปรเกงโก"

 CHL_invited_french_academia: "วงวิชาการฝรั่งเศส"
 CHL_invited_french_academia_desc: "สวนสําคัญของการเปนสมาชิกกลุมประเทศที่ใชภาษาฝรั่งเศสคือการคิดไปในทางเดียวกัน และเพื่อใหเปนเชนนั้น เราจะสงเสริมใหนักวิชาการฝรั่งเศสยายมายัง[CHL.GetNameDef]"

 CHL_royal_mountaineers: "ทหารภูเขาหลวง"
 CHL_royal_mountaineers_desc: "แมปาตาโกเนียอาจไมใช แตอาเรากาเนียเปนดินแดนแหงขุนเขาและปาทึบอยางแนนอน กษัตริยจึงทรงมีพระราชประสงคใหจัดตั้งกองทหารภูเขาหลวง ซึ่งเชี่ยวชาญการรบในภูมิประเทศอันทุรกันดารเชนนี้"

 CHL_peru_payments_to_chile: "การชําระเงินแกชิลี"
 CHL_peru_payments_to_chile_desc: "ขณะนี้เราจําเปนตองจายเงินกอนใหญใหแก[CHL.GetNameDef]ทุกเดือน เนื่องจากการซื้อ[951.GetName]"
 CHL_chile_payments_from_peru: "การชําระเงินจากเปรู"
 CHL_chile_payments_from_peru_desc: "เนื่องจากการซื้อ[951.GetName]เมื่อไมนานมานี้ [PRU.GetNameDef]จึงจายเงินกอนใหญใหเราทุกเดือน ชวยกระตุนเศรษฐกิจของเรา"

 CHL_puppeteering_idea: "ปกครองจากเงามืด"
 CHL_puppeteering_idea_desc: "การปกครองไมใชเพียงการพิชิตทุกสิ่งแลวพยายามสวมมงกุฎใหตนเองเปนกษัตริย แตตองหาขารับใชผูภักดี และแตงตั้งพวกเขาขึ้นครองบัลลังกของศัตรูที่ถูกพิชิต ดังที่นโปเลียน โบนาปารตผูยิ่งใหญเคยทํามาแลว!"

 BOL_plurinational_democracy: "พหุชาตินิยมประชาธิปไตย"
 BOL_plurinational_democracy_desc: "รัฐของเรานิยามดวยการอยูรวมกันของกลุมชาติพันธุจํานวนมากที่คงอัตลักษณของตนไวภายในรัฐเดียว ใน[BOL.GetNameDef] แนวคิดเรื่องสัญชาติเปนแบบพหุ กลาวคือมีหลายชนชาติอยูรวมกันภายในชุมชนหรือประชาคมที่มีการจัดระเบียบ"

