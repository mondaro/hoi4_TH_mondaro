l_english:
 URG_terra_dictatorship: "ระบอบเผด็จการของแตรรา"
 URG_terra_dictatorship_desc: "นับตั้งแตการปฏิวัติวันที่ 31 มีนาคม 1933 กาเบรียล แตรราและผูสนับสนุนของเขา ซึ่งรวมถึงผูที่เดินตามแนวทางบาเยฆิสโม ตลอดจนพรรคขาวและหลุยส อัลแบรโต เด เอรเรรา ผูนําพรรค ก็ไดกุมอํานาจไว โดยไมเหลือผูมีอํานาจใดที่จะทาทายการตัดสินใจของเขาได สําหรับอุรุกวัย นี่หมายถึงความเปนกลางอยางเครงครัด เพราะแตรราตองการพัฒนาภายในประเทศและควบคุมการเลือกขางในสงครามใด ๆ ที่อาจเกิดขึ้นโดยไมคาดคิด ทั้งในอเมริกาใตและขามมหาสมุทรแอตแลนติก"

 BOL_toll_of_the_chaco_war: "ความสูญเสียจากสงครามชาโก"
 BOL_toll_of_the_chaco_war_desc: "สงครามชาโกเพิ่งยุติลง หลังจากยืดเยื้อตั้งแตป 1932 ถึง 1935 เจตจํานงในการสูรบไดเหือดหายไปจนหมดสิ้น แมแตในหมูผูสนับสนุนลัทธิขยายดินแดนที่แรงกลาที่สุดทั้งในโบลิเวียและปารากวัย และผูคนมากมายตองจบชีวิตลงในดินแดนชาโกโบเรอัลซึ่งยังคงเปนขอพิพาทอยู"

 BOL_toll_of_the_chaco_war_2: "ความสูญเสียจากสงครามชาโก"
 BOL_toll_of_the_chaco_war_2_desc: "สงครามชาโกเพิ่งยุติลง หลังจากยืดเยื้อตั้งแตป 1932 ถึง 1935 เจตจํานงในการสูรบไดเหือดหายไปจนหมดสิ้น แมแตในหมูผูสนับสนุนลัทธิขยายดินแดนที่แรงกลาที่สุดทั้งในโบลิเวียและปารากวัย และผูคนมากมายตองจบชีวิตลงในดินแดนชาโกโบเรอัลซึ่งยังคงเปนขอพิพาทอยู"

 PRU_amazonian_war: "สงครามแอมะซอน"
 PRU_no_factions_tt: "เขารวมฝายได: §Rไมได§!"

 CHL_the_mapuche_conflict: "ความขัดแยงมาปูเช"
 CHL_the_mapuche_conflict_desc: "นับตั้งแตการปราบปรามอาเรากาเนียและการบังคับผนวกดินแดนและผูคนเขากับรัฐชิลี ชาวมาปูเชพื้นเมืองก็ถูกขับไลออกจากถิ่นฐาน ถูกเลือกปฏิบัติ และไมพอใจมาโดยตลอด แมจะมีบางกลุมที่มุงรวมมือและผสมกลมกลืน แตก็มีอีกหลายกลุมที่ตอสูเพื่อบอนทําลายรัฐในทุกวิถีทางที่ทําได"
 CHL_mapuche_conflict_up_tt: "§Rทําให§!ความขัดแยงมาปูเชรุนแรงขึ้น\n"
 CHL_mapuche_conflict_down_tt: "§Gบรรเทา§!ความขัดแยงมาปูเช\n"

 idea_CHL_the_Hacienda_inquilinaje_system: "ระบบฮาเซียนดา-อินกีลินาเฆ"
 idea_CHL_the_Hacienda_inquilinaje_system_desc: "ระบบฮาเซียนดา-อินกีลินาเฆของเจาที่ดินและผูเชานั้นสืบทอดมาจากวิถีการปกครองแบบโรมันโบราณและจักรวรรดิสเปน และยอมลาสมัยและกดขี่อยางยิ่งตามที่คาดไว ฮาเซียนดาของชิลีในปจจุบันโดดเดนในเรื่องสภาพความเปนอยูอันยํ่าแยของคนงาน และเปนสวนที่ลาหลังของเศรษฐกิจ เนื่องจากแทบจะยังใชระบบทาสติดที่ดินมาจนถึงทุกวันนี้ หนทางเดียวที่เราจะกําจัดปญหานี้ไดอยางแทจริงคือ§Yการปฏิรูปที่ดิน§! ซึ่งควรเปนวาระสําคัญอันดับตนหากเราตองการฟนฟูเศรษฐกิจ"
 
 idea_CHL_near_anarchic_society: "สังคมที่ใกลอนาธิปไตย"
 idea_CHL_near_anarchic_society_desc: "ปจจุบันประเทศของเราประสบกับความพยายามกอรัฐประหารและการจลาจลอยูบอยครั้ง รวมถึงการประทวงที่เกิดขึ้นเปนเรื่องปกติในชีวิตประจําวัน อีกทั้งความเปนปรปกษอยางรุนแรงระหวางนักการเมือง กองทัพ และหนวยงานรัฐ ทําใหไมมีสิ่งใดทํางานไดอยางมีประสิทธิภาพเพียงพอ เราตองแกไขปญหาเหลานี้หากตองการทําใหประเทศมีเสถียรภาพอยางถาวร"
 CHL_anarchic_society_level_down_tt: "§Gลด§!ผลกระทบของ $idea_CHL_near_anarchic_society$"
 CHL_anarchic_society_up_tt: "§Rเพิ่ม§!ผลกระทบของ $idea_CHL_near_anarchic_society$"
 CHL_can_not_have_anarchy_tt: "ไมมี $idea_CHL_near_anarchic_society$"

 idea_CHL_repubican_guard: "กองพิทักษสาธารณรัฐ"
 idea_CHL_repubican_guard_desc: "ในสถานการณปจจุบัน สาธารณรัฐตกอยูในอันตรายใหญหลวงและใกลจะลมสลาย อยางไรก็ตาม ประธานาธิบดีอารตูโร อาเลสซันดรีไดทําใหสถานการณสวนใหญมีเสถียรภาพขึ้นมาตั้งแตป 1925 และบัดนี้การพึ่งพากองกําลังติดอาวุธลับนี้กําลังดึงงบประมาณที่ควรจะเปนของกองทัพไป จึงขัดขวางการขยายกําลังทหารประจําการ"

 CHL_german_compensation_idea: "คาชดเชยจากเยอรมนี"

 CHL_spirit_of_the_conquistadors: "จิตวิญญาณแหงกองกิสตาดอร"
 CHL_spirit_of_the_conquistadors_desc: "ดวยเกียรติภูมิของเหลากองกิสตาดอรที่นําพาประชาชนของเรามายังราชอาณาจักรอันยิ่งใหญริมแอตแลนติกใตแหงนี้ พวกเขามีบทบาทสําคัญในประวัติศาสตรของเรา และบัดนี้เปนแรงบันดาลใจแกประชาชน เจตจํานงของพวกเขาจะนําทางเราสูอนาคต [CHL.GetNameDefCap] จะยิ่งใหญขึ้นเมื่อเราพิชิตเพื่อนบานที่ออนแอกวาและกลายเปนมหาอํานาจที่ครอบงําอเมริกาใต"

 CHL_relief_efforts_idea: "การบรรเทาทุกข"
 CHL_relief_efforts_idea_desc: "รัฐบาลไดจัดตั้งบรรษัทฟนฟูและบรรเทาทุกขขึ้นเพื่อจัดระเบียบและสนับสนุนการบรรเทาทุกขและการฟนฟูภายหลังแผนดินไหวที่ชิยันเมื่อป 1939 ใหดียิ่งขึ้น"

 CHL_spanish_refugees: "ปญญาชนผูลี้ภัยชาวสเปน"

 CHL_has_left_wing_government: "มีรัฐบาลฝายซาย"
 CHL_has_right_wing_government: "มีรัฐบาลฝายขวา"

 CHL_public_works_modifier: "โครงการงานสาธารณะ"

 CHL_deeper_mines_modifier: "เครือขายเหมืองแรขนาดใหญ"

 CHL_devalue_the_peso_idea: "การลดคาเงินเปโซ"
 CHL_devalue_the_peso_idea_desc: "เพื่อใหเศรษฐกิจของเรามีพลังที่จําเปนตอการเติบโต เงินเปโซจึงอยูระหวางการลดคา แมจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"
 CHL_devalue_the_franc_idea: "การลดคาเงินฟรังก"
 CHL_devalue_the_franc_idea_desc: "เพื่อใหเศรษฐกิจของเรามีพลังที่จําเปนตอการเติบโต เงินฟรังกจึงอยูระหวางการลดคา แมจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"

 CHL_introduced_the_franc_idea: "นําเงินฟรังกมาใชแลว"
 CHL_introduced_the_franc_idea_desc: "เพื่อใหประเทศฟนตัวจากบาดแผลและหาที่ยืนบนเวทีโลก ประเทศจําเปนตองเปนสวนหนึ่งของกลุมประเทศที่ใชภาษาฝรั่งเศสในวงกวาง กาวสําคัญในทิศทางนี้ไดเกิดขึ้นแลวดวยการแทนที่เงินเปโซเดิมดวยฟรังกอาเรากาเนีย"

 CHL_hydroelectric_power: "พลังงานไฟฟาพลังนํ้า"
 CHL_hydroelectric_power_desc: "ดวยการลงทุนในภูมิภาคอาเรากาเนีย ในที่สุดเราก็ไดสรางเครือขายเขื่อนที่ผลิตกระแสไฟฟาและควบคุมการไหลของแมนํ้าไดสําเร็จ"

 CHL_siphoning_funds: "ยักยอกงบประมาณ"
 CHL_siphoning_funds_desc: "ฝายโฆษณาชวนเชื่อของพรรคนาซิสตากําลังยักยอกเงินจากภาคสาธารณะ เพื่อเพิ่มอิทธิพลเหนือประชากร[CHL.GetAdjective]"

 CHL_the_kings_scouts: "ลูกเสือหลวง"
 CHL_the_kings_scouts_desc: "ตั้งแตองคกษัตริยของเรายังทรงพระเยาว พระองคทรงโปรดการเขารวมกิจกรรมกึ่งทหารของขบวนการลูกเสือฝรั่งเศส บัดนี้พระองคจะทรงนําความสุขและความกระตือรือรนเชนเดียวกันนี้มาสูเยาวชน[CHL.GetAdjective]"

 CHL_national_falange: "ฟาลังเฆนาซีโอนัล"
 CHL_national_falange_desc: "ฟาลังเฆนาซีโอนัล พรรคการเมืองคริสเตียนแนวกาวหนาและปฏิรูปซึ่งแยกตัวออกจากพรรคอนุรักษนิยมในป 1935 พรอมอยางยิ่งที่จะสนับสนุนรัฐบาลผสมของเราในปจจุบัน"

 CHL_popular_front_in_power: "แนวรวมประชาชน"

 CHL_liberal_party_in_power: "พรรคเสรีนิยม"

 CHL_communist_party_in_power: "พรรคคอมมิวนิสต"

 CHL_democratic_alliance_in_power: "พันธมิตรประชาธิปไตย"

 CHL_conservative_party_in_power: "พรรคอนุรักษนิยม"

 CHL_radical_party_in_power: "พรรคหัวรุนแรง"

 CHL_popular_freedom_alliance_in_power: "พันธมิตรประชาชนเพื่อการปลดปลอย"

 CHL_from_support_chile_static_modifier: "สนับสนุนราชอาณาจักรอาเรากาเนียและปาตาโกเนีย"

 CHL_non_lar_encryption: "โบนัสการเขารหัส"
 CHL_lar_encryption: "โบนัสการเขารหัส"

 CHL_imposed_new_taxes: "จัดเก็บภาษีใหม"
 CHL_impose_new_taxes_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$CHL_imposed_new_taxes$§! ถูกนําออก จะปรับ §Y$CHL_chilean_economy_dynamic_modifier$§! ดังนี้:\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§! \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10%§!"

 CHL_relief_efforts_idea_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$CHL_relief_efforts_idea$§! ถูกนําออก:"

 CHL_aid_SPR: "ใหความชวยเหลือสาธารณรัฐสเปน"
 CHL_aid_araucania: "ใหความชวยเหลือราชอาณาจักรอาเรากาเนียและปาตาโกเนีย"

 CHL_aiding_CHL_payment: "คาตอบแทนจากการชวยเหลือราชอาณาจักรอาเรากาเนียและปาตาโกเนีย"
 CHL_payment_for_aid: "คาตอบแทนจากความชวยเหลือตางประเทศ"

 CHL_anti_americanism: "กระแสตอตานอเมริกา"

 CHL_empowered_preparations_department: "เสริมอํานาจฝายเตรียมการ"
 CHL_empowered_preparations_department_desc: "ฝายเตรียมการของพรรคนาซิสตากําลังไดรับความสําคัญเปนอันดับแรกจากพรรค และกลุมนี้กําลังเตรียมกอรัฐประหารตอรัฐบาลเสรีนิยม"

 CHL_lack_of_funds: "ขาดแคลนงบประมาณ"
 CHL_lack_of_funds_desc: "รัฐบาลเสรีนิยมไดขโมยเงินทุนจํานวนมหาศาลในประเทศแลวหลบหนีไปตางแดน เราตองใชเวลาอีกนานกวาจะฟนตัวจากความสูญเสียทางเศรษฐกิจครั้งนี้"

 CHL_republican_guards_in_exile: "กองพิทักษสาธารณรัฐ[CHL.GetAdjective]พลัดถิ่น"
 CHL_republican_guards_in_exile_desc: "รัฐบาลเสรีนิยม[CHL.GetAdjective]ไดจัดตั้งกองกําลังกึ่งทหารติดอาวุธขึ้นในประเทศของเรา ซึ่งจะชวยพวกเขารับมือกับภัยคุกคามฟาสซิสตในประเทศของพวกเขา หากเราทําสงครามกับพวกเขา"

 CHL_naval_mutiny: "กบฏทหารเรือ"
 CHL_naval_mutiny_desc: "การกอกบฏของทหารเรืออีกครั้งกําลังเกิดขึ้นเพื่อประทวงการขึ้นสูอํานาจของขบวนการเรา และกําลังบั่นทอนประเทศชาติอยางหนัก"

 CHL_the_international_revolution: "การปฏิวัติสากล"
 CHL_the_international_revolution_desc: "เราตองทําใหแนใจวาเปลวไฟแหงการปฏิวัติ เมื่อถูกจุดขึ้นในตางแดนแลว จะตองไมถูกปลอยใหมอดดับลง"

 CHL_laissez_faire: "ปลอยใหตลาดทํางานเสรี"
 CHL_laissez_faire_desc: "ตลาดตองดําเนินไปอยางเสรี และเศรษฐกิจของเราจะฟนตัวไดก็ตอเมื่อรัฐหลีกเลี่ยงการแทรกแซงกิจการอุตสาหกรรมเทานั้น"

 CHL_strict_secularism: "ฆราวาสนิยมอยางเครงครัด"
 CHL_strict_secularism_desc: "ศาสนจักรไมมีสิทธิ์มีเสียงในการเมือง และตองถือวาแยกออกจากการเมืองโดยสิ้นเชิง เราตองกําหนดใหนักการเมืองของเราสาบานวาจะไมนําศาสนาของตนเขาสูรัฐสภา"

 CHL_catholic_church_holding_political_power: "ศาสนจักรคาทอลิกกุมอํานาจทางการเมือง"
 CHL_catholic_church_holding_political_power_desc: "ขณะนี้ศาสนจักรคาทอลิกไดรับอนุญาตใหมีสิทธิ์มีเสียงในนโยบายอยางเปนทางการของรัฐบาล ซึ่งจํากัดไมใหฝายซายสามารถรวมตัวเปนแนวรวมที่เขมแข็งเพื่อตอตานเราได"

 CHL_development_inwards_idea: "การพัฒนาจากภายใน"
 CHL_development_inwards_idea_desc: "หลักนิยมทางเศรษฐกิจใหมที่เรียกวาการพัฒนาจากภายในจะชวยในการฟนฟูประเทศของเรา หลังจากหลายปแหงความทุกขยากและความเฉื่อยชา"

 CHL_socialist_land_reform: "การปฏิรูปที่ดินแบบสังคมนิยม"
 CHL_socialist_land_reform_desc: "ยุคของเหลาอาเซนดาโดสิ้นสุดลงแลว และชาวนาของเราจะไมตองใชชีวิตอยางทาสติดที่ดินอีกตอไป ยุคใหมไดมาถึง[CHL.GetNameDef]อยางแทจริงแลว!"

 CHL_abolished_serfdom: "ยกเลิกระบบทาสติดที่ดิน"
 CHL_abolished_serfdom_desc: "ยุคของเหลาอาเซนดาโดสิ้นสุดลงแลว และชาวนาของเราจะไมตองใชชีวิตอยางทาสติดที่ดินอีกตอไป!"

 CHL_comptroller_general_of_chile: "สํานักงานผูตรวจเงินแผนดินแหงสาธารณรัฐ"
 CHL_comptroller_general_of_chile_desc: "สํานักงานผูตรวจเงินแผนดินแหงสาธารณรัฐเปนองคกรตรวจสอบสูงสุดของชิลี มีความเปนอิสระและมีสถานะตามรัฐธรรมนูญ ทําหนาที่ควบคุมความชอบดวยกฎหมายของการกระทําของฝายบริหารราชการ กํากับดูแลรายไดและการลงทุนของหนวยงานการคลัง เทศบาล และองคกรและบริการอื่น ๆ ตามที่กฎหมายกําหนด ตรวจสอบและวินิจฉัยบัญชีของบุคคลผูรับผิดชอบทรัพยสินของรัฐและเทศบาล จัดทําบัญชีกลางของประเทศ และปฏิบัติหนาที่อื่น ๆ ตามที่กฎหมายมอบหมาย"

 CHL_oppressed_working_class: "ชนชั้นแรงงานที่ถูกกดขี่"
 CHL_oppressed_working_class_desc: "ดวยการกดขี่อยางโหดเหี้ยมตอทุกสิ่งที่มีกลิ่นอายคอมมิวนิสต สหภาพแรงงานไมสามารถเคลื่อนไหวในประเทศไดอีกตอไป และชนชั้นแรงงานสามารถถูกสั่งการใหทําตามความตองการของเรา โดยไมอาจประทวงไดอยางแทจริง มิฉะนั้นจะเปนการละเมิดกฎหมายปองกันประเทศถาวร"

 CHL_socialist_youth_idea: "เยาวชนสังคมนิยม"
 CHL_socialist_youth_idea_desc: "องคกรเยาวชนสังคมนิยมจะชวยเราจัดตั้งปกกึ่งทหารที่สามารถสนับสนุนทหารของเราในการรบได"

 CHL_anti_communist_action: "ปฏิบัติการตอตานคอมมิวนิสตชิลี"
 CHL_anti_communist_action_desc: "เพื่อตอสูกับภัยคอมมิวนิสตภายในประเทศอยางไดผล เราตองจัดตั้งกลุมรักชาติที่พรอมปราบปรามขบวนการฝายซายทุกรูปแบบ"

 CHL_ligas_patrioticas: "สันนิบาตผูรักชาติ"
 CHL_ligas_patrioticas_desc: "สันนิบาตผูรักชาติ (ลีกัสปาตริโอติกัส) เปนองคกรพลเรือนกึ่งตํารวจฝายขวาจัดที่ปฏิบัติการใน[CHL.GetNameDef] คอยชวยเราปราบปรามผูเห็นตางและหามปรามไมใหผูใดหลีกเลี่ยงการเกณฑทหาร"

 CHL_hosting_german_intel_lar: "ใหที่พักพิงหนวยขาวกรองและสายลับเยอรมัน"
