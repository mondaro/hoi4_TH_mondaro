 BRA_undiversified_economy_modifier: "เศรษฐกิจที่ไมหลากหลาย"
 BRA_undiversified_economy_modifier_desc: "การพึ่งพาการสงออกกาแฟมากเกินไปทําใหเศรษฐกิจบราซิลพังทลายเมื่อเกิดภาวะเศรษฐกิจตกตํ่าครั้งใหญ และนานาประเทศหยุดซื้อเครื่องดื่มกระตุนที่ทําใหติดนี้ ไมวารัฐบาลใดก็ตองกระจายเศรษฐกิจไปสูภาคสวนใหม ๆ หากตองการใหประเทศรุงเรือง"
 BRA_weak_government: "รัฐบาลที่ออนแอ"
 BRA_weak_government_desc: "การปฏิวัติและความพยายามกอรัฐประหารตลอดหลายปที่ผานมาไดบั่นทอนอํานาจของรัฐบาลบราซิล สถานการณยิ่งเลวรายลงดวยรัฐธรรมนูญป 1934 ซึ่งเปนขอตกลงที่เกิดจากการประนีประนอมและแทบไมมีผูสนับสนุน ไมวาอนาคตของบราซิลจะเปนอยางไร ที่แนนอนคือระเบียบทางการเมืองในปจจุบันไมอาจดํารงอยูได"
 BRA_aftermath_of_the_coup: "ภาวะฉุกเฉิน"
 BRA_aftermath_of_the_coup_desc: "ภาวะฉุกเฉินถูกประกาศขึ้นในเดือนพฤศจิกายน 1935 เมื่อฝายคอมมิวนิสตกอรัฐประหารซึ่งเสี่ยงจะลุกลามกลายเปนสงครามกลางเมืองเต็มรูปแบบ แมรัฐประหารจะถูกขัดขวางได แตประธานาธิบดีก็ยังไมยกเลิกภาวะฉุกเฉิน ผูคนจํานวนมากจากทุกขั้วการเมืองตางกังวลวาระบอบนี้จะใชอํานาจฉุกเฉินตอไปเพื่อปราบปรามผูเห็นตาง"

