 CHL_spirit_of_the_pacific_war: "ปลุกจิตวิญญาณแหงสงครามแปซิฟก"
 CHL_spirit_of_the_pacific_war_desc: "ครั้งหนึ่งเราเคยเอาชนะกองทัพ[BOL.GetAdjective]และ[PRU.GetAdjective]ได แมจะมีกําลังนอยกวามาก บัดนี้ถึงเวลาที่เราจะใชเรื่องนี้เปนโฆษณาชวนเชื่อเพื่อปลุกใจทหารของเราใหรุกไปขางหนา!"

