 BRA_new_capital_modifier_desc: "เรากําลังดําเนินการสรางเมืองหลวงแหงใหมใจกลางประเทศ เพื่อลดความรูสึกโดดเดี่ยวในหมูรัฐชนบท"
 BRA_separatism_idea: "กระแสแบงแยกดินแดน"
 BRA_separatism_idea_desc: "มีผูคนจํานวนมากทั่วประเทศที่ไมพอใจรัฐบาลกลางของบราซิล หรือขุนเคืองที่ตองแบกรับรัฐที่ยากจนกวา ในอดีต ความรูสึกเหลานี้เคยนําไปสูขบวนการแบงแยกดินแดนที่แยกรัฐของตนออกจากประเทศไดชั่วระยะหนึ่ง หากเราไมอาจทําใหสถานการณการเมืองมีเสถียรภาพไดในเร็ววัน ขบวนการเชนนี้อาจทําใหบราซิลแตกเปนเสี่ยง ๆ"
 BRA_propaganda_idea: "กรมโฆษณาการ"
 BRA_propaganda_idea_desc: "ในยามคับขันเชนนี้ เราตองทําใหมั่นใจวาประชาชนไดรับเฉพาะขอมูลที่จําเปนตอการทํางานตอไปและการสนับสนุนรัฐบาลเทานั้น"
 BRA_cangaceiro_state: "กังกาซูเคลื่อนไหวในรัฐ"
 BRA_cangaceiro_state_desc: "ครั้งหนึ่งเคยเกิดสุญญากาศทางอํานาจขึ้นทางตะวันออกเฉียงเหนือของบราซิล นําไปสูการผงาดขึ้นของกลุมโจรที่เรียกวากังกาซู โจรเหลานี้สรางความเดือดรอนใหภูมิภาคมานานหลายทศวรรษ และมักไดรับความชวยเหลือจากชาวบานที่เห็นใจ เราตองจัดการกับการปลนสะดมและเขนฆาของพวกมันกอนที่จะสูญเสียการควบคุมภูมิภาคนี้ไปโดยสิ้นเชิง"
 BRA_disrupt_bolivar_LaR: "งบประมาณการตอตานขาวกรอง"
 BRA_disrupt_bolivar_LaR_desc: "หนวยขาวกรองตางชาติปฏิบัติการที่นี่อยางไมเกรงกลัวมานานเกินไปแลว ดวยงบประมาณใหมนี้ เราจะทําใหแนใจวาไมมีสิ่งใดเกิดขึ้นบนแผนดินของเราโดยที่เราไมรูลวงหนา"
