 CHL_mapuche_ancestral_resistance_good: "การตอตานของบรรพชนมาปูเช"

 CHL_democratic_volunteer_corps: "การปกปองประชาธิปไตยในระดับสากล"
 CHL_democratic_volunteer_corps_desc: "ไมวาระบอบอํานาจนิยมจะกลาโผลหัวอันนารังเกียจขึ้นมาที่ใด ทหารของเราจะยืนหยัดอยางภาคภูมิและพรอมกําจัดมันทันทีที่ไดรับคําสั่ง"
