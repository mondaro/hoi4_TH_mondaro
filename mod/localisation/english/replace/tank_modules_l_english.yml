 tank_anti_air_cannon_2: "ปนตอสูอากาศยานแบบปรับปรุง"
 tank_anti_air_cannon_2_desc: "ปนอัตโนมัติยิงเร็วที่ออกแบบมาเพื่อตอสูกับอากาศยาน มีศักยภาพจํากัดในฐานะอาวุธยิงสนับสนุนตอเปาหมายภาคพื้นดิน"
 tank_anti_air_cannon_3: "ปนตอสูอากาศยานขั้นสูง"
 tank_anti_air_cannon_3_desc: "ปนอัตโนมัติยิงเร็วที่ออกแบบมาเพื่อตอสูกับอากาศยาน มีศักยภาพจํากัดในฐานะอาวุธยิงสนับสนุนตอเปาหมายภาคพื้นดิน"
 tank_medium_howitzer: "ปนใหญวิถีโคงขนาดกลาง"
 tank_medium_howitzer_desc: "ปนใหญวิถีโคงสนามขนาดกลางที่ดัดแปลงใหติดตั้งบนยานพาหนะ หนาที่หลักคือยิงสนับสนุนเล็งจําลองตอเปาออน แตสามารถยิงเล็งตรงใสเปาหมายไดหากจําเปน เนื่องจากบรรทุกกระสุนเจาะเกราะไดเพียงเล็กนอย จึงไมเหมาะกับงานตอสูรถถัง"
 tank_medium_howitzer_2: "ปนใหญวิถีโคงขนาดกลางแบบปรับปรุง"
