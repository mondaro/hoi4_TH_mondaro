 tank_rocket_launcher: "เครื่องยิงจรวด"
 tank_rocket_launcher_desc: "เครื่องยิงหลายลํากลองสําหรับจรวดระเบิดแรงสูงแบบไมนําวิถี ปริมาณการยิงที่สูงทําใหมีสมรรถนะยอดเยี่ยมตอเปาออน แตแมจะยิงถูกโดยตรงก็สรางความเสียหายตอเปาหมายหุมเกราะไดนอย"
 tank_rocket_launcher_2: "เครื่องยิงจรวดแบบปรับปรุง"
 tank_rocket_launcher_2_desc: "แมจะมีการปรับปรุงความแมนยําหลายประการ แตขอไดเปรียบหลักของเครื่องยิงจรวดแบบปรับปรุงนี้คือสามารถบรรจุจรวดไดมากขึ้นเพื่อยิงใสขาศึก"
 tank_wheeled_suspension: "ระบบรองรับแบบลอ"
 tank_wheeled_suspension_desc: "พัฒนามาจากแชสซีรถบรรทุก ระบบรองรับนี้รับนํ้าหนักไดจํากัดมากและมีสมรรถนะการวิ่งในภูมิประเทศทุรกันดารที่จํากัด แตมีขอดีคือผลิตไดในราคาถูกมาก"
 tank_half_track_suspension: "ระบบรองรับแบบกึ่งสายพาน"
 tank_half_track_suspension_desc: "ลูกผสมระหวางยานพาหนะสายพานเต็มรูปแบบกับระบบรองรับแบบลอทั่วไป มีลอคูหนาสําหรับบังคับเลี้ยวและเพลาหลังแบบสายพานเพื่อเพิ่มสมรรถนะการวิ่งในภูมิประเทศทุรกันดาร แมจะรับนํ้าหนักไดจํากัด แตก็ยังถูกกวาแบบสายพานเต็มรูปแบบ"
 squeezebore_adaptor: "อะแดปเตอรบีบลํากลอง"
 squeezebore_adaptor_desc: "อะแดปเตอรพิเศษที่ปลายปนจะลดเสนผานศูนยกลางของลํากลองและบีบกระสุนใหมีขนาดลํากลองเล็กลง ซึ่งเพิ่มความเร็วตนและอํานาจเจาะเกราะของปนอยางมาก แตตองใชกระสุนพิเศษที่ทําจากวัสดุหายาก"
 armor_skirts: "แผนเกราะกระโปรง"
 armor_skirts_desc: "ชุดแผนโลหะบางที่ติดตั้งดานขางยานพาหนะ ใหการปองกันเพิ่มเติมจากปนเล็กยาวตอตานรถถังและหัวรบดินโพรง"
 dozer_blade: "ใบมีดดันดิน"
 dozer_blade_desc: "ใบมีดดันดินชวยใหยานพาหนะสรางที่มั่นรบในสนามไดอยางรวดเร็วโดยไมตองพึ่งการสนับสนุนจากทหารชาง"
 auto_loader: "ระบบบรรจุกระสุนอัตโนมัติ"
 auto_loader_desc: "กลไกอัตโนมัติที่บรรจุกระสุนและชวยใหรถถังรักษาอัตราการยิงที่สูงไดเปนเวลานาน"
 easy_maintenance: "ซอมบํารุงงาย"
 easy_maintenance_desc: "ชองเปดรอบตัวยานพาหนะชวยใหเขาถึงชิ้นสวนตาง ๆ ไดมากมาย และชวยใหพลประจํารถทําการซอมบํารุงแมแตงานที่ซับซอนไดคอนขางงาย"
 additional_machine_guns: "ปนกลเพิ่มเติม"
 additional_machine_guns_desc: "ชุดปนกลในปอมขางตัวรถและฐานติดตั้งแบบหมุนพิเศษ ชวยเพิ่มการปองกันยานพาหนะจากการโจมตีของทหารราบในระยะประชิด"

