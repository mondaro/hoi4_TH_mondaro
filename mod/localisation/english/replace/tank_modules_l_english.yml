 tank_heavy_howitzer: "ปนใหญวิถีโคงขนาดหนัก"
 tank_heavy_howitzer_desc: "ปนใหญวิถีโคงสนามขนาดหนักที่ดัดแปลงใหติดตั้งบนยานพาหนะ หนาที่หลักคือยิงสนับสนุนเล็งจําลองตอเปาออน แตสามารถยิงเล็งตรงใสเปาหมายไดหากจําเปน เนื่องจากบรรทุกกระสุนเจาะเกราะไดเพียงเล็กนอย จึงไมเหมาะกับงานตอสูรถถัง"
 tank_small_cannon: "ปนใหญขนาดเล็ก"
 tank_small_cannon_desc: "ปนใหญขนาดเล็กราคาถูก สามารถยิงไดทั้งกระสุนตอตานบุคคลและกระสุนตอตานยานเกราะ แตขนาดลํากลองที่เล็กจํากัดประโยชนใชสอย"
 tank_small_cannon_2: "ปนใหญขนาดเล็กแบบปรับปรุง"
 tank_small_cannon_2_desc: "ปนใหญขนาดเล็กราคาถูก สามารถยิงไดทั้งกระสุนตอตานบุคคลและกระสุนตอตานยานเกราะ แตขนาดลํากลองที่เล็กจํากัดประโยชนใชสอย"
 tank_medium_cannon: "ปนใหญขนาดกลาง"
 tank_medium_cannon_desc: "อาวุธอเนกประสงคที่เหมาะกับภารกิจหลากหลาย แมจะไมโดดเดนทั้งในการตอตานทหารราบและการตอสูรถถัง แตก็ใหความยืดหยุนแกยานพาหนะอยางมาก"
 tank_medium_cannon_2: "ปนใหญขนาดกลางแบบปรับปรุง"
 tank_medium_cannon_2_desc: "อาวุธอเนกประสงคที่เหมาะกับภารกิจหลากหลาย แมจะไมโดดเดนทั้งในการตอตานทหารราบและการตอสูรถถัง แตก็ใหความยืดหยุนแกยานพาหนะอยางมาก"
 tank_high_velocity_cannon: "ปนใหญความเร็วสูงพื้นฐาน"
 tank_high_velocity_cannon_desc: "ปนใหญที่ออกแบบมาโดยเฉพาะใหมีความเร็วตนของกระสุนสูง เมื่อใชกระสุนชนิดพิเศษจะมีคุณสมบัติในการตอตานยานเกราะที่ยอดเยี่ยม แตสมรรถนะตอเปาออนจะดอยลง"
 tank_high_velocity_cannon_2: "ปนใหญความเร็วสูงแบบปรับปรุง"
 tank_high_velocity_cannon_2_desc: "ปนใหญที่ออกแบบมาโดยเฉพาะใหมีความเร็วตนของกระสุนสูง เมื่อใชกระสุนชนิดพิเศษจะมีคุณสมบัติในการตอตานยานเกราะที่ยอดเยี่ยม แตสมรรถนะตอเปาออนจะดอยลง"
