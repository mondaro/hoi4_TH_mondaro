 tank_super_heavy_cannon: "ปนใหญหนักพิเศษ"
 tank_super_heavy_cannon_desc: "อาวุธขนาดใหญอยางเหลือเชื่อที่มีสมรรถนะไรเทียมทาน มีสิ่งเพียงไมกี่อยางที่อาวุธนี้ทําลายไมได และไมมีสิ่งใดในนั้นที่ควรมายิงใสรถถัง"
 NOR_rikstanken_turret: "ปอมปนชั่วคราว"
 NOR_rikstanken_turret_desc: "มันบรรจุปนไว และหมุนได เมื่อมันอยากจะหมุน"
 tank_close_support_gun: "ปนสนับสนุนระยะใกล"
 tank_close_support_gun_desc: "อาวุธขนาดเล็กที่ออกแบบมาเพื่อยิงกระสุนระเบิดแรงสูงใสที่มั่นสนามของขาศึกเพื่อชวยทหารราบในการบุก แมจะสูกับรถถังได แตลํากลองที่สั้นและกระสุนที่จํากัดทําใหไมสามารถรับมือกับรถถังขาศึกที่ทรงพลังกวาได"
 tank_radio_1: "วิทยุพื้นฐาน"
 tank_radio_1_desc: "วิทยุสื่อสารสองทางพื้นฐานชวยใหรถถังประสานการดําเนินกลยุทธทางยุทธวิธีในระดับเล็กได"
 tank_radio_2: "วิทยุแบบปรับปรุง"
 tank_radio_2_desc: "วิทยุแบบปรับปรุงชวยใหผูบังคับบัญชาควบคุมรูปขบวนรถถังขนาดใหญไดอยางมีประสิทธิภาพ ทําใหสามารถดําเนินกลยุทธทางยุทธการขนาดใหญได"
 tank_radio_3: "วิทยุขั้นสูง"
 tank_radio_3_desc: "ดวยเครื่องสงที่ทรงพลังกวาและการรับสัญญาณที่ดีกวา วิทยุนี้จึงสื่อสารไดไกลหลายสิบกิโลเมตร แมเผชิญกับการรบกวนสัญญาณของขาศึก"
 amphibious_drive: "ระบบขับเคลื่อนสะเทินนํ้าสะเทินบก"
 amphibious_drive_desc: "ชุดอุปกรณลอยนํ้าและใบจักรขนาดเล็กชวยใหรถถังนี้ถูกดัดแปลงอยางรวดเร็วเพื่อขามนํ้า ไมวาจะจากเรือขึ้นฝงหรือขามแมนํ้า"
 secondary_turret_hmg: "ปนกลหนัก"
 secondary_turret_hmg_desc: "ปนกลหนักในปอมปนรอง ตําแหนงของปอมปนจํากัดมุมการยิง ทําใหประสิทธิภาพโดยรวมของปนลดลง แตก็ชวยใหรถถังโจมตีเปาหมายไดมากขึ้น ซึ่งมีประโยชนอยางยิ่งเมื่ออยูในการรุก"
 secondary_turret_small_cannon: "ปนใหญขนาดเล็ก"
 secondary_turret_small_cannon_desc: "ปนใหญขนาดเล็กในปอมปนรอง ตําแหนงของปอมปนจํากัดมุมการยิง ทําใหประสิทธิภาพโดยรวมของปนลดลง แตก็ชวยใหรถถังโจมตีเปาหมายไดมากขึ้น ซึ่งมีประโยชนอยางยิ่งเมื่ออยูในการรุก"
 secondary_turret_close_support_gun: "ปนสนับสนุนระยะใกล"
 secondary_turret_close_support_gun_desc: "ปนสนับสนุนระยะใกลในปอมปนรอง ตําแหนงของปอมปนจํากัดมุมการยิง ทําใหประสิทธิภาพโดยรวมของปนลดลง แตก็ชวยใหรถถังโจมตีเปาหมายไดมากขึ้น ซึ่งมีประโยชนอยางยิ่งเมื่ออยูในการรุก"
 sloped_armor: "เกราะลาดเอียง"
 sloped_armor_desc: "เกราะที่วางทํามุมกับทิศทางกระสุนที่พุงเขามาจะมีความหนาประสิทธิผลมากกวาเกราะปริมาณเทากันที่วางในแนวตั้งอยางมาก อีกทั้งยังเพิ่มโอกาสที่กระสุนจะแฉลบออกไปโดยไมเปนอันตราย อยางไรก็ตาม รถถังทั้งคันตองไดรับการออกแบบโดยยึดเกราะแบบนี้เปนหลัก ทําใหประกอบยานพาหนะไดยากขึ้น"
 stabilizer: "ระบบรักษาการทรงตัว"
 stabilizer_desc: "อุปกรณเชิงกลที่รักษาใหปนชี้ไปในทิศทางเดิมขณะรถถังเคลื่อนที่ แมจะยังไมกาวหนาพอที่จะยิงไดแมนยําขณะเคลื่อนที่ แตก็ชวยใหพลยิงยิงไดแมนยําเมื่อหยุดชั่วครู โดยไมตองหาเปาหมายใหม"
 smoke_launchers: "เครื่องยิงลูกระเบิดควัน"
 smoke_launchers_desc: "ชุดอุปกรณดอกไมเพลิงที่สั่งการไดจากภายในรถถังเพื่อสรางกลุมควันหนาทึบอําพรางรถถัง มีประโยชนมากเมื่ออยูในการตั้งรับหรือหลังจากขับเขาไปติดกับดักซุมโจมตี"
 extra_ammo_storage: "ที่เก็บกระสุนเพิ่มเติม"
