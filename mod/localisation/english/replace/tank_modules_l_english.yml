 ### EQUIPMENT MODULES ###
 
 tank_gasoline_engine: "เครื่องยนตเบนซิน"
 tank_gasoline_engine_desc: "เครื่องยนตที่ใชนํ้ามันเบนซินจะเร็วกวาเมื่อขนาดเครื่องยนตเทากัน แตเชื้อเพลิงจะติดไฟไดงายกวามาก"
 tank_diesel_engine: "เครื่องยนตดีเซล"
 tank_diesel_engine_desc: "เครื่องยนตที่ใชนํ้ามันดีเซลมีความนาเชื่อถือมากกวาเครื่องยนตเบนซิน แตไมเร็วเทาเมื่อขนาดเครื่องยนตเทากัน"
 tank_petrol_electric_engine: "เครื่องยนตเบนซิน-ไฟฟา"
 tank_petrol_electric_engine_desc: "การผสมผสานระหวางเครื่องยนตเบนซินที่จายพลังงานใหมอเตอรไฟฟา มีความซับซอน ราคาแพง และไมนาเชื่อถือ แตใหสมรรถนะการเคลื่อนที่ทางยุทธวิธีที่ไมมีใครเทียบได"
 tank_gas_turbine_engine: "กังหันกาซ"
 tank_gas_turbine_engine_desc: "กังหันที่พัฒนามาจากเครื่องยนตไอพน สิ้นเปลืองเชื้อเพลิงสูง แตใหความเร็วสูงสุดในบรรดาเครื่องยนตทุกแบบเมื่อขนาดเครื่องยนตเทากัน"
 tank_riveted_armor: "เกราะตอกหมุดยํ้า"
 tank_riveted_armor_desc: "แผนเกราะที่ยึดกับโครงดวยสลักเกลียวและยึดเขาดวยกันดวยหมุดยํ้าที่ตอกตามขอบ เปนเทคโนโลยีที่พิสูจนแลวและคอนขางราคาถูก แตขอบที่ตอกหมุดยํ้าจะเปนจุดออนของเกราะ และอาจทํารายพลประจํารถไดหากหมุดยํ้าถูกยิง"
 tank_cast_armor: "เกราะหลอ"
 tank_cast_armor_desc: "ตัวถังทั้งหมดรวมถึงเกราะถูกหลอขึ้นเปนชิ้นเดียว เปนกระบวนการที่แพงและใชเวลานาน แตทําใหไดเกราะที่หนากวามากและมีจุดออนนอยลง"
 tank_welded_armor: "เกราะเชื่อม"
 tank_welded_armor_desc: "แผนเกราะถูกเชื่อมเขากับตัวถัง เปนกระบวนการที่เร็วกวาการหลอ ขณะที่ยังใหการปองกันที่ดี"
 NOR_tank_rikstanken_armor: "เกราะชั่วคราว"
 NOR_tank_rikstanken_armor_desc: "ทําจากแผนเหล็กธรรมดาแทนเหล็กกลาเพื่อประหยัดเงิน ดีกวาไมมีเกราะเลย... มั้ง"
 tank_torsion_bar_suspension: "ทอรชันบาร"
 tank_torsion_bar_suspension_desc: "ระบบรองรับที่คอนขางนาเชื่อถือ ประกอบดวยแทงโลหะที่ยึดกับตัวถังยานพาหนะ ซึ่งใหการขับขี่ที่นุมนวลกวาระบบรองรับแบบอื่น"
 tank_christie_suspension: "ระบบรองรับแบบคริสตี"
 tank_christie_suspension_desc: "พัฒนาโดยนักประดิษฐชาวอเมริกัน ระบบรองรับนี้ทําใหทําความเร็วไดสูงเปนพิเศษ"
 tank_bogie_suspension: "ระบบรองรับแบบโบกี้"
 tank_bogie_suspension_desc: "ระบบรองรับแบบเรียบงายและคอนขางราคาถูก โดยลอกดสายพานแตละลอติดตั้งแยกกัน ทําใหเปลี่ยนไดงายเมื่อเสียหาย"
 tank_interleaved_suspension: "ลอกดสายพานแบบซอนเหลื่อม"
 tank_interleaved_suspension_desc: "การวางลอกดสายพานใหซอนเหลื่อมกันทําใหติดตั้งลอไดมากขึ้นในความยาวตัวถังเทาเดิม จึงชวยเพิ่มความคลองตัวและใหการปองกันดานขางเพิ่มเติมบางสวน"
 tank_light_one_man_tank_turret: "ปอมปนหนึ่งคน"
 tank_light_one_man_tank_turret_desc: "ปอมปนขนาดเล็กที่แทบจะจุพลประจํารถไดเพียงคนเดียว ซึ่งตองทําหนาที่ทั้งเล็งและบรรจุกระสุนอาวุธหลัก รวมถึงเฝาระวังเปาหมายและภัยคุกคาม"
 tank_light_two_man_tank_turret: "ปอมปนสองคน"
 tank_light_two_man_tank_turret_desc: "ปอมปนที่ใหพลประจํารถสองคนแบงงานควบคุมอาวุธและสังเกตสถานการณ แตก็ยังไมสามารถแบงหนาที่ระหวางพลประจํารถไดอยางมีประสิทธิภาพ"
 tank_light_three_man_tank_turret: "ปอมปนสามคน"
 tank_light_three_man_tank_turret_desc: "ปอมปนที่ใหญพอใหพลประจํารถสามคนแบงหนาที่บรรจุกระสุนและเล็งอาวุธหลัก รวมถึงคอยรับรูสถานการณรอบตัว"
 tank_light_fixed_superstructure_turret: "โครงสรางสวนบนแบบตายตัวขนาดเบา"
 tank_light_fixed_superstructure_turret_desc: "โครงสรางสวนบนแบบตายตัวทําใหอาวุธหลักหันไดเพียงในมุมแคบโดยไมตองหมุนทั้งคัน อยางไรก็ตาม มันชวยใหติดตั้งอาวุธที่ใหญขึ้นได ขณะที่ตัวรถโดยรวมมีขนาดเล็กลง ทําใหเหมาะอยางยิ่งสําหรับการซุมโจมตี"
 tank_medium_one_man_tank_turret: "ปอมปนหนึ่งคน"
 tank_medium_one_man_tank_turret_desc: "ปอมปนขนาดเล็กที่แทบจะจุพลประจํารถไดเพียงคนเดียว ซึ่งตองทําหนาที่ทั้งเล็งและบรรจุกระสุนอาวุธหลัก รวมถึงเฝาระวังเปาหมายและภัยคุกคาม"
 tank_medium_two_man_tank_turret: "ปอมปนสองคน"
 tank_medium_two_man_tank_turret_desc: "ปอมปนที่ใหพลประจํารถสองคนแบงงานควบคุมอาวุธและสังเกตสถานการณ แตก็ยังไมสามารถแบงหนาที่ระหวางพลประจํารถไดอยางมีประสิทธิภาพ"
 tank_medium_three_man_tank_turret: "ปอมปนสามคน"
 tank_medium_three_man_tank_turret_desc: "ปอมปนที่ใหญพอใหพลประจํารถสามคนแบงหนาที่บรรจุกระสุนและเล็งอาวุธหลัก รวมถึงคอยรับรูสถานการณรอบตัว"
 tank_medium_fixed_superstructure_turret: "โครงสรางสวนบนแบบตายตัวขนาดกลาง"
 tank_medium_fixed_superstructure_turret_desc: "โครงสรางสวนบนแบบตายตัวทําใหอาวุธหลักหันไดเพียงในมุมแคบโดยไมตองหมุนทั้งคัน อยางไรก็ตาม มันชวยใหติดตั้งอาวุธที่ใหญขึ้นได ขณะที่ตัวรถโดยรวมมีขนาดเล็กลง ทําใหเหมาะอยางยิ่งสําหรับการซุมโจมตี"
 tank_heavy_two_man_tank_turret: "ปอมปนสองคน"
 tank_heavy_two_man_tank_turret_desc: "ปอมปนที่ใหพลประจํารถสองคนแบงงานควบคุมอาวุธและสังเกตสถานการณ แตก็ยังไมสามารถแบงหนาที่ระหวางพลประจํารถไดอยางมีประสิทธิภาพ"
 tank_heavy_three_man_tank_turret: "ปอมปนสามคน"
 tank_heavy_three_man_tank_turret_desc: "ปอมปนที่ใหญพอใหพลประจํารถสามคนแบงหนาที่บรรจุกระสุนและเล็งอาวุธหลัก รวมถึงคอยรับรูสถานการณรอบตัว"
 tank_heavy_fixed_superstructure_turret: "โครงสรางสวนบนแบบตายตัวขนาดหนัก"
 tank_heavy_fixed_superstructure_turret_desc: "โครงสรางสวนบนแบบตายตัวทําใหอาวุธหลักหันไดเพียงในมุมแคบโดยไมตองหมุนทั้งคัน อยางไรก็ตาม มันชวยใหติดตั้งอาวุธที่ใหญขึ้นได ขณะที่ตัวรถโดยรวมมีขนาดเล็กลง ทําใหเหมาะอยางยิ่งสําหรับการซุมโจมตี"
 tank_super_heavy_four_man_tank_turret: "ปอมปนสี่คน"
 tank_super_heavy_four_man_tank_turret_desc: "ปอมปนขนาดใหญที่มีพื้นที่เพิ่มเติมสําหรับพลบรรจุกระสุนคนที่สองเพื่อประจําปนหลัก"
 tank_super_heavy_three_man_tank_turret: "ปอมปนสามคน"
 tank_super_heavy_three_man_tank_turret_desc: "ปอมปนที่ใหญพอใหพลประจํารถสามคนแบงหนาที่บรรจุกระสุนและเล็งอาวุธหลัก รวมถึงคอยรับรูสถานการณรอบตัว"
 tank_modern_tank_turret: "ปอมปนสมัยใหม"
 tank_modern_tank_turret_desc: "ปอมปนที่จัดวางอยางดีชวยใหพลประจํารถสามคนควบคุมอาวุธหลักและติดตามสภาพแวดลอมรอบตัวไดอยางมีประสิทธิภาพ"
 tank_heavy_machine_gun: "ปนกลหนัก"
 tank_heavy_machine_gun_desc: "ปนกลใหขีดความสามารถในการตอตานทหารราบไดดีพอสมควรดวยตนทุนตํ่า แมจะใชกระสุนเจาะเกราะพิเศษ สมรรถนะในการตอตานยานเกราะก็ยังไมนาพอใจนัก"
 flamethrower: "เครื่องพนไฟ"
 flamethrower_desc: "อุปกรณสําหรับพนของเหลวที่ลุกไหมออกไปเปนสาย แมจะมีประโยชนมากในการรบในเมืองและการโจมตีปอมปราการ แตไมมีขีดความสามารถในการตอตานยานเกราะ และตองใชพลประจํารถที่ผานการฝกพิเศษในหนวยแยกตางหากจึงจะมีประสิทธิภาพ"
 advanced_flamethrower: "เครื่องพนไฟขั้นสูง"
 advanced_flamethrower_desc: "ระบบเครื่องพนไฟที่พัฒนาขึ้น เหมาะอยางยิ่งสําหรับกวาดลางที่มั่นที่มีการเสริมความแข็งแรงและสรางความเสียหายรุนแรงในการรบระยะประชิด"
 tank_auto_cannon: "ปนใหญอัตโนมัติ"
 tank_auto_cannon_desc: "ดัดแปลงมาจากปนตอสูอากาศยานที่ยิงเร็ว ปนใหญอัตโนมัตินี้สามารถสาดกระสุนเปนหาฝนที่สรางความเสียหายรายแรงตอเปาออน แตขนาดลํากลองที่เล็กจํากัดสมรรถนะในการตอตานยานเกราะ"
 tank_auto_cannon_2: "ปนใหญอัตโนมัติแบบปรับปรุง"
 tank_auto_cannon_2_desc: "ดัดแปลงมาจากปนตอสูอากาศยานที่ยิงเร็ว ปนใหญอัตโนมัตินี้สามารถสาดกระสุนเปนหาฝนที่สรางความเสียหายรายแรงตอเปาออน แตขนาดลํากลองที่เล็กจํากัดสมรรถนะในการตอตานยานเกราะ"
 tank_anti_air_cannon: "ปนตอสูอากาศยานพื้นฐาน"
