 lc_heavy_naval_guns: "ปนเรือขนาดหนัก"
 lc_heavy_naval_guns_desc: "อาวุธหลักมาตรฐานสําหรับยานเกราะขนาดมหึมาเชนนี้ ปนใหญทรงพลังระดับเรือรบเหลานี้ถูกดัดแปลงสําหรับการปะทะโดยตรง มอบอํานาจการยิงทําลายลางตอทั้งเปาหมายหุมเกราะและเปาหมายที่มีปอมปราการ"
 lc_super_heavy_railway_gun: "ปนใหญรถไฟหนักพิเศษ"
 lc_super_heavy_railway_gun_desc: "ปนขนาดมหึมานี้เดิมสรางขึ้นสําหรับแทนรถไฟ สามารถระดมยิงเปาหมายจากระยะไกลสุดขีดดวยอํานาจทําลายลางที่ไมมีใครเทียบได"
 lc_high_impact_obliterator_cannon: "ปนใหญลบลางแรงปะทะสูง"
 lc_high_impact_obliterator_cannon_desc: "ออกแบบมาโดยเฉพาะเพื่อเจาะเกราะที่หนามาก พลังงานจลนสูงของอาวุธนี้ทําใหมันเปนอาวุธตอบโตที่นาเกรงขามตอรถถังหนักพิเศษคันอื่น ๆ"
 lc_heavy_anti_air_platform: "แทนตอสูอากาศยานหนัก"
 lc_heavy_anti_air_platform_desc: "แทนที่ติดตั้งปนตอสูอากาศยานลํากลองใหญหลายกระบอก ออกแบบมาเพื่อปองกันเครื่องบินทิ้งระเบิดและเครื่องบินลาดตระเวนของขาศึกที่คุกคามเรือลาดตระเวนบก"
 lc_medium_naval_guns: "ปนเรือขนาดกลาง"
 lc_medium_naval_guns_desc: "ใหการผสมผสานที่สมดุลระหวางอัตราการยิงและอํานาจการยิง ปนเหลานี้มีประสิทธิภาพในการตอสูกับยานพาหนะที่เบากวาและใหการสนับสนุนตอเปาหมายที่ไมมีเกราะ"
 lc_hull_mounted_railway_gun: "ปนใหญรถไฟติดตั้งในตัวถัง"
 lc_hull_mounted_railway_gun_desc: "ปนใหญรถไฟที่นํามาใชใหมโดยติดตั้งเขากับตัวถังโดยตรงเพื่อความมั่นคงสูงสุด ใหการยิงสนับสนุนอยางหนักและโจมตีเปาหมายระยะไกลไดอยางแมนยําสูง"
 lc_super_heavy_howitzer: "ปนใหญวิถีโคงหนักพิเศษ"
 lc_super_heavy_howitzer_desc: "ปนใหญวิถีโคงขนาดมหึมาที่ออกแบบมาเพื่อทุบทําลายปอมปราการและแนวปองกันในเมือง รุนนี้เชี่ยวชาญการยิงกระสุนระเบิดแรงสูง เหมาะสําหรับกวาดลางที่มั่นที่ขุดสนามเพลาะไวและทําลายสิ่งปลูกสรางที่เสริมความแข็งแรงใหราบคาบ"
 lc_heavy_high_velocity_cannons: "ปนใหญความเร็วสูงขนาดหนัก"
 lc_heavy_high_velocity_cannons_desc: "ปนตอสูรถถังที่ออกแบบมาเพื่อตอสูและทําลายยานเกราะของขาศึกดวยความแมนยําสูง กระสุนความเร็วสูงชวยใหเจาะเกราะไดยอดเยี่ยมในระยะไกล"
 lc_heavy_anti_air_battery: "ชุดปนตอสูอากาศยานหนัก"
 lc_heavy_anti_air_battery_desc: "ชุดปนตอสูอากาศยานที่ติดตั้งปนลํากลองใหญเพื่อเล็งเปาอากาศยานความเร็วสูงและบินสูง สรางเขตปองกันรอบตัวยานพาหนะ"
 lc_medium_cannon_turret: "ปนใหญขนาดกลางรวมแกน"
 lc_medium_cannon_turret_desc: "ปนใหญมาตรฐานที่ติดตั้งในปอมปน สามารถตอสูกับทหารราบและยานพาหนะเบาได การออกแบบที่กะทัดรัดทําใหใชงานไดหลากหลายในการรบระยะประชิดและบทบาทรอง"
 lc_assault_gun: "ปนจูโจม"
 lc_assault_gun_desc: "ออกแบบมาสําหรับการรบในเมืองระยะใกลและการทําลายบังเกอร อาวุธนี้ยิงกระสุนระเบิดแรงสูงอันทรงพลังเพื่อกวาดลางทหารราบและเปาหมายที่แข็งแรง"
 lc_high_velocity_cannon_turret: "ปนใหญความเร็วสูงรวมแกน"
 lc_high_velocity_cannon_turret_desc: "ปอมปนที่ติดตั้งปนใหญความเร็วสูงเพื่อตอสูกับยานเกราะขาศึก ขนาดที่เล็กกวาชวยใหยิงสนับสนุนไดอยางรวดเร็วและฉับไวตอภัยคุกคามหุมเกราะที่เบากวา"
 lc_light_anti_air_battery: "ชุดปนตอสูอากาศยานเบา"
 lc_light_anti_air_battery_desc: "ชุดปนตอสูอากาศยานเบาที่ออกแบบมาเพื่อเล็งเปาอากาศยานที่บินตํ่า และปกปองยานพาหนะจากการกราดยิงและเครื่องบินทิ้งระเบิดแบบดิ่ง"
 lc_flamethrower_turret: "ชุดเครื่องพนไฟ"
 lc_flamethrower_turret_desc: "ปอมปนเฉพาะทางที่พนสายไฟออกไป เหมาะอยางยิ่งสําหรับกวาดลางที่มั่นที่มีปอมปราการ ทหารราบ และจุดซุมโจมตี เหมาะสําหรับการปะทะระยะประชิดในสภาพแวดลอมเมืองที่หนาแนน"
 lc_rocket_launcher: "เครื่องยิงจรวด"
 lc_rocket_launcher_desc: "ระบบจรวดแบบโมดูลที่ติดตั้งบนเรือลาดตระเวนบก ยิงจรวดระดมใสอยางรุนแรงเพื่อกดดันแนวปองกันของขาศึกและบดขยี้รูปขบวนขนาดใหญ"
 lc_radio_1: "$tank_radio_1$"
 lc_radio_1_desc: "$tank_radio_1_desc$"
 lc_radio_2: "$tank_radio_2$"
 lc_radio_2_desc: "$tank_radio_2_desc$"
 lc_radio_3: "$tank_radio_3$"
 lc_radio_3_desc: "$tank_radio_3_desc$"
 lc_command_center: "ศูนยบัญชาการ"
 lc_command_center_desc: "ศูนยบัญชาการแบบบูรณาการเต็มรูปแบบที่เปลี่ยนเรือลาดตระเวนบกใหเปนกองบัญชาการเคลื่อนที่ ติดตั้งระบบสื่อสารขั้นสูงเพื่อประสานปฏิบัติการทางทหารขนาดใหญ"
 lc_radar: "เรดาร"
 lc_radar_desc: "ระบบตรวจจับลวงหนาที่ชวยเพิ่มการรับรูถึงอากาศยานขาศึกและกองกําลังที่อยูใกลเคียง ทําใหเรือลาดตระเวนบกเตรียมรับมือกับภัยคุกคามทางอากาศหรือภาคพื้นดินที่อาจเกิดขึ้นได"
 lc_aircraft_catapult: "เครื่องดีดสงอากาศยาน"
 lc_aircraft_catapult_desc: "ระบบสงขึ้นบินสําหรับเครื่องบินลาดตระเวนขนาดเล็ก ชวยใหเรือลาดตระเวนบกสอดแนมพื้นที่หางไกลและใหขาวกรองสนามรบแบบทันทวงที"
 lc_helipad: "ลานจอดเฮลิคอปเตอร"
 lc_helipad_desc: "แทนสําหรับสงเฮลิคอปเตอรขึ้นบิน ออกแบบมาเพื่อการลาดตระเวนทางอากาศขั้นสูงและเพิ่มการรับรูสถานการณในสนามรบ"
 lc_armored_skirts: "แผนเกราะกระโปรง"
 lc_armored_skirts_desc: "แผนเกราะเสริมความแข็งแรงที่ติดตั้งตามดานขาง เพื่อปกปองสายพานและระบบรองรับที่เปราะบางจากอาวุธตอตานรถถังและการยิงของอาวุธเล็ก"
 lc_bunker_emplacement: "ที่ตั้งบังเกอร"
 lc_bunker_emplacement_desc: "โครงสรางปอมปราการภายในที่เปลี่ยนเรือลาดตระเวนบกใหเปนบังเกอรเคลื่อนที่ ชวยใหพลประจํารถตรึงที่มั่นตั้งรับและยิงตอบโตขาศึกไดแมอยูภายใตการยิงอยางหนัก"
 lc_obstacle_clearance_gear: "อุปกรณเคลียรสิ่งกีดขวาง"
 lc_obstacle_clearance_gear_desc: "อุปกรณเสริมสําหรับงานหนัก เชน ใบมีดดันดินขนาดมหึมาและปนจั่น ออกแบบมาเพื่อเคลียรซากปรักหักพัง เปดเสนทางผานภูมิประเทศที่ยากลําบาก และชวยในการขุดสนามเพลาะ"
 lc_internal_fuel_tanks: "ถังเชื้อเพลิงภายใน"
 lc_internal_fuel_tanks_desc: "ชองเก็บเชื้อเพลิงที่ขยายเพิ่มภายในตัวถัง ชวยเพิ่มระยะปฏิบัติการของยานพาหนะและลดความจําเปนในการหยุดเติมเชื้อเพลิงบอยครั้งระหวางการทัพที่ยืดเยื้อ"
 lc_internal_ammunition_compartments: "ชองเก็บกระสุนภายใน"
 lc_internal_ammunition_compartments_desc: "พื้นที่จัดเก็บเสริมความแข็งแรงสําหรับบรรทุกกระสุนเพิ่มเติม ชวยใหเรือลาดตระเวนบกสูรบตอเนื่องไดยาวนานโดยไมตองเติมเสบียง"
 lc_wet_ammunition_storage: "ที่เก็บกระสุนแบบเปยก"
 lc_wet_ammunition_storage_desc: "ชองเก็บเฉพาะทางที่บรรจุของเหลวหลอเย็นเพื่อลดความเสี่ยงที่กระสุนจะระเบิดเมื่อถูกขาศึกยิง ชวยเพิ่มความปลอดภัยของพลประจํารถไดอยางมาก"
 lc_smoke_generators: "เครื่องสรางควัน"
 lc_smoke_generators_desc: "ระบบที่ออกแบบมาเพื่อปลอยมานควันหนาทึบ อําพรางการเคลื่อนไหวของยานพาหนะและลดการมองเห็นจากภัยคุกคามทั้งภาคพื้นดินและทางอากาศ"
 lc_stabilizers: "ระบบรักษาการทรงตัว"
 lc_stabilizers_desc: "อุปกรณเชิงกลที่ลดแรงสะทอนถอยหลังและรักษาแนวปนขณะยิง ชวยใหหาเปาหมายใหมไดเร็วขึ้นและยิงไดแมนยําขึ้นเมื่อหยุดชั่วครู"