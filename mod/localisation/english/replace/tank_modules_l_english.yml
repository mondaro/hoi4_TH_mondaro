 gwtank_chassis: "การพัฒนารถถังยุคระหวางสงคราม"
 gwtank_chassis_desc: "รถถังไดพิสูจนตัวเองแลววาเปนอาวุธทรงพลังในมหาสงคราม แมการพัฒนาจะชะลอตัวลงในชวงหลายปที่ผานมา แตไมตองสงสัยเลยวามันจะมีบทบาทสําคัญในสงครามที่จะมาถึง"
 armor_tech_1: "การปองกันดวยเกราะพื้นฐาน"
 armor_tech_1_desc: "รถถังในมหาสงครามตองรับมือเพียงอาวุธเล็กของขาศึก จึงใชเกราะที่คอนขางบางได แตอาวุธตอตานรถถังยุคใหมทําใหสนามรบอันตรายตอรถถังมากขึ้น จึงตองการการปองกันที่หนักกวามาก"
 armor_tech_2: "การปองกันดวยเกราะแบบปรับปรุง"
 armor_tech_2_desc: "เมื่ออาวุธตอตานรถถังที่หนักขึ้นเรื่อย ๆ ถูกนําเขาประจําการทั่วโลก รถถังรุนตอไปจะตองการการปองกันที่ดียิ่งขึ้น"
 armor_tech_3: "การปองกันดวยเกราะขั้นสูง"
 armor_tech_3_desc: "แมปนตอสูรถถังที่ประจําการอยูอาจถึงขีดจํากัดแลว แตรถถังรุนใหมจะติดอาวุธที่กาวหนากวา ซึ่งสามารถเจาะเกราะทุกระดับในปจจุบันไดจากระยะไกล"
 armor_tech_4: "การปองกันดวยเกราะสมัยใหม"
 armor_tech_4_desc: "ระหวางสงคราม ภัยคุกคามตอรถถังทวีคูณขึ้น ตั้งแตรถถังขาศึก ปนตอสูรถถัง รถถังพิฆาตโดยเฉพาะ ไปจนถึงอาวุธทหารราบสมัยใหมที่ยิงหัวรบดินโพรงซึ่งเจาะทะลุไดแมแตเกราะหนา เราตองพัฒนาวิธีการปองกันแบบใหมเพื่อใหรถถังของเรารอดพนจากภัยคุกคามเหลานี้"
 engine_tech_1: "เครื่องยนตพื้นฐาน"
 engine_tech_1_desc: "ในขณะที่รถถังในมหาสงครามเปนเหมือนสัตวรายเชื่องชางุมงาม รถถังสมัยใหมกลับพึ่งพาความเร็วและความคลองตัวเปนอยางมากในการควาชัยชนะ"
 engine_tech_2: "เครื่องยนตแบบปรับปรุง"
 engine_tech_2_desc: "ดวยปนที่ใหญขึ้นและเกราะที่หนักขึ้น รถถังรุนใหมจึงตองการเครื่องยนตที่ทรงพลังกวาเดิมเพื่อคงความคลองตัวไว"
 engine_tech_3: "เครื่องยนตขั้นสูง"
 engine_tech_3_desc: "สงครามยานเกราะเปนรูปแบบการรบที่ตองการการตัดสินใจที่รวดเร็ว และการเคลื่อนยายกําลังพลและเสบียงที่รวดเร็ว หากรถถังของเราตองติดอาวุธสมัยใหมและเกราะที่เพียงพอตอการอยูรอดในสนามรบ ก็ตองมีเครื่องยนตที่ทรงพลังเพื่อใหตามทันทหารราบยานยนต"
 engine_tech_4: "เครื่องยนตสมัยใหม"
 engine_tech_4_desc: "สวนเพิ่มเติมใหมมากมายที่สงครามสมัยใหมบังคับใหตองติดตั้งบนรถถัง ทําใหนํ้าหนักของยานพาหนะเพิ่มขึ้นอยางมาก เพื่อขับเคลื่อนมวลทั้งหมดนั้น เราตองการเครื่องยนตที่มีกําลังสูง"
