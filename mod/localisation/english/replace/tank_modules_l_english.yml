 modern_tank_chassis: "รถถังสมัยใหม"
 modern_tank_chassis_desc: "แชสซีที่ทันสมัยซึ่งยืมแนวคิดจากรถถังขนาดกลางรุนกอน ๆ อยางมาก แตเนนความเร็วและความคลองตัวมากขึ้นอยางยิ่ง ขณะเดียวกันก็รองรับเกราะที่มากขึ้นและปนที่ใหญกวาที่รถถังขนาดกลางมักติดตั้ง ผลลัพธคือยานพาหนะที่สามารถทําหนาที่ไดหลากหลายบทบาท"
 main_battle_tank_chassis_desc: "ประสบการณแสดงใหเห็นวาแบบของรถถังเบา รถถังขนาดกลาง และรถถังหนักกําลังหลอมรวมเขาหากันมากขึ้นเรื่อย ๆ รถถังหนักมีความคลองตัวมากขึ้น ขณะที่รถถังเบาตองติดอาวุธและเกราะที่หนักขึ้นเพื่อความอยูรอด จึงมีประโยชนที่จะรวมทั้งสามแบบเขาเปนประเภทเดียว ซึ่งจะเปนรถถังหลักอเนกประสงค"
 modern_tank_chassis_1: "รถถังสมัยใหม"
