 tank_high_velocity_cannon_3_desc: "ปนใหญที่ออกแบบมาโดยเฉพาะใหมีความเร็วตนของกระสุนสูง เมื่อใชกระสุนชนิดพิเศษจะมีคุณสมบัติในการตอตานยานเกราะที่ยอดเยี่ยม แตสมรรถนะตอเปาออนจะดอยลง"
 tank_heavy_cannon: "ปนใหญหนักพื้นฐาน"
 tank_heavy_cannon_desc: "อาวุธที่ยิงกระสุนขนาดใหญได มีอํานาจเจาะเกราะยอดเยี่ยมและสมรรถนะตอเปาออนที่ดีพอสมควร ขอเสียที่ใหญที่สุดคือขนาดและตนทุนที่สูงมาก ทําใหเทอะทะเกินกวาจะติดตั้งบนยานพาหนะสวนใหญที่ไมไดออกแบบมาเพื่อบรรทุกมันโดยเฉพาะ"
 tank_heavy_cannon_2: "ปนใหญหนักแบบปรับปรุง"
 tank_heavy_cannon_2_desc: "อาวุธที่ยิงกระสุนขนาดใหญได มีอํานาจเจาะเกราะยอดเยี่ยมและสมรรถนะตอเปาออนที่ดีพอสมควร ขอเสียที่ใหญที่สุดคือขนาดและตนทุนที่สูงมาก ทําใหเทอะทะเกินกวาจะติดตั้งบนยานพาหนะสวนใหญที่ไมไดออกแบบมาเพื่อบรรทุกมันโดยเฉพาะ"
 tank_heavy_cannon_3: "ปนใหญหนักขั้นสูง"
