 amphibious_tank_chassis: "รถถังสะเทินนํ้าสะเทินบก"
 amphibious_tank_chassis_desc: "ตัวถังรถถังขนาดเล็กที่ออกแบบมาโดยเฉพาะใหลอยนํ้าได ซึ่งตองจํากัดขนาดของอาวุธและความหนาของเกราะที่ยานพาหนะบรรทุกอยางเขมงวด"
