 light_flame_tank: "กองรอยรถถังพนไฟเบา"
 light_flame_tank_desc: "กองรอยยานพาหนะเบาติดเครื่องพนไฟ เพื่อใหการสนับสนุนในการบุกโจมตีเมืองและปอมปราการ"
 medium_flame_tank: "กองรอยรถถังพนไฟขนาดกลาง"
 medium_flame_tank_desc: "กองรอยยานพาหนะขนาดกลางติดเครื่องพนไฟ เพื่อใหการสนับสนุนในการบุกโจมตีเมืองและปอมปราการ"
 heavy_flame_tank: "กองรอยรถถังพนไฟหนัก"
 heavy_flame_tank_desc: "กองรอยยานพาหนะหนักติดเครื่องพนไฟ เพื่อใหการสนับสนุนในการบุกโจมตีเมืองและปอมปราการ"

 
 light_tank_amphibious_chassis_desc: "รถถังเบาที่ติดตั้งอุปกรณลอยนํ้าและใบจักร"
 medium_tank_amphibious_chassis_desc: "รถถังขนาดกลางที่ติดตั้งอุปกรณลอยนํ้าและใบจักร"
 heavy_tank_amphibious_chassis_desc: "รถถังหนักที่ติดตั้งอุปกรณลอยนํ้าและใบจักร"
 
 expanded_fuel_tank: "ถังเชื้อเพลิง"
 expanded_fuel_tank_desc: "ถังเชื้อเพลิงที่ติดตั้งภายนอก ออกแบบมาเพื่อขยายระยะปฏิบัติการของยานเกราะ"

 land_cruiser_chassis: "แชสซีเรือลาดตระเวนบก"
 land_cruiser_chassis_desc: "แชสซีขนาดมหึมาที่หุมเกราะหนา ออกแบบมาเพื่อรองรับอาวุธหนักพิเศษและทนทานตอการโจมตีอยางหนักหนวงในสนามรบ แตสิ้นเปลืองเชื้อเพลิงสูงและเคลื่อนที่ชาเนื่องจากขนาดที่ใหญโต"
