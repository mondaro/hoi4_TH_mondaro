 HUN_treaty_of_triannon: "สนธิสัญญาทรียานง"
 HUN_treaty_of_triannon_desc: "สนธิสัญญาทรียานงในหลายแงมุมคลายกับสนธิสัญญาแวรซาย ซึ่งบั่นทอนกองทัพของเราและขัดขวางการเสริมกําลังอาวุธ การทําใหสนธิสัญญานี้ถูกแกไขหรือยกเลิกตองเปนเปาหมายสูงสุดของเรา เราทําไดโดยการแสวงหาการปรองดองกับความตกลงไตรภาคีนอย เสนอขอตกลงเบลด หรือประกาศสละสนธิสัญญาไปเลย ทางเลือกสุดทายจะถูกมองอยางกวางขวางวากาวราวมาก และอาจกระตุนใหเกิดการตอบโตอยางรุนแรง"
