 YUG_idea_slovene_nationalism_desc: "ชาวสโลวีนตองการรัฐของตนเองมานานแลว แมพวกเขาจะยอมรับการปกครองของเรา แตก็ไมไดกระตือรือรนนัก นักอุตสาหกรรมชาวสโลวีนแทบไมลงทุนในธุรกิจทองถิ่น และดูเหมือนจะชอบนําเงินไปใชตางประเทศมากกวา"
 YUG_idea_slovene_nationalism_2: "การปกครองตนเองของสโลวีเนีย"
