 ITA_ricostruzione_industriale_dynamic_modifier_desc: "ความพยายามกอบกูอุตสาหกรรมภายในประเทศหลังภาวะเศรษฐกิจตกตํ่าครั้งใหญไดพิสูจนแลววาประสบความสําเร็จ หากเราลงทุนในกําลังการผลิตทางอุตสาหกรรมของอิตาลีมากขึ้นไปอีก ผลิตภาพของเราจะทัดเทียมมหาอํานาจไดในไมชา"
