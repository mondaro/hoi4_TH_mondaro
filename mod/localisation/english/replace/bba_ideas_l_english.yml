 SWI_seized_gold: "ทองคําที่ถูกยึด"
 SWI_stole_our_gold_reserves: "ทองคําสํารองที่ถูกขโมย"
 SWI_foreign_investments_idea: "การลงทุนจากตางชาติ"
 SWI_swiss_democratic_propaganda: "โฆษณาชวนเชื่อประชาธิปไตยของสวิส"
 SWI_swiss_democratic_propaganda_desc: "หลังจากผลักดันใหโฟรารลแบรกเขารวมกับพวกเขา [SWI.GetNameDef]ก็ดําเนินการรณรงคโฆษณาชวนเชื่ออยางกวางขวางไปทั่ว[AUS.GetNonIdeologyName] โดยมุงสงเสริมประชาธิปไตยในแบบฉบับเฉพาะตัว การตอตานลัทธิฟาสซิสต และเหนือสิ่งอื่นใดคือการเขารวมสมาพันธรัฐของพวกเขา"
