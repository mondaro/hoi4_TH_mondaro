 SWI_frontier_defense_plan_idea_1: "แผนปองกันชายแดน"
 SWI_infrastructure_rigged_to_blow: "โครงสรางพื้นฐานติดระเบิดพรอมทําลาย"
 SWI_infrastructure_rigged_to_blow_desc: "เราไมอาจปลอยใหขาศึกใชโครงสรางพื้นฐานและอุตสาหกรรมที่เราสรางมาอยางยากลําบากยอนกลับมาทํารายเรา เราพรอมจะระเบิดทุกอยางทิ้งทันทีที่ขาศึกเขาควบคุม"
 SWI_aktion_nationaler_widerstand_idea: "ปฏิบัติการตอตานแหงชาติ"
 SWI_aktion_nationaler_widerstand_idea_desc: "กลุมลับของพลเรือนที่เปนตัวแทนจากทุกภาคสวนของสังคมสวิส ซึ่งมุงมั่นจะสงเสริมคุณคาของสวิตเซอรแลนดและวางรากฐานการตอตานหากเกิดเหตุรายที่สุดขึ้น"
 SWI_old_switzerland_idea: "หวนคืนสูสวิตเซอรแลนดแบบเดิม"
 SWI_old_switzerland_idea_desc: "หลังผานสงครามอันโหดรายและการขยายดินแดนอยางไรศีลธรรมมายาวนาน ประชาชนของ[ROOT.GetName]เรียกรองใหกลับคืนสูความเปนกลางและประชาธิปไตยแบบกอนสงครามเปนอยางนอย ชวงเวลาอันวุนวายนี้จะสิ้นสุดลงในไมชา"
 SWI_extended_supply_lines_idea: "เสนทางเสบียงที่ขยายออกไป"
 SWI_extended_supply_lines_idea_desc: "เราไดปรับปรุงการสงกําลังบํารุงจนสามารถขยายเสนทางเสบียงไดไกลขึ้น และสรางเสนทางใหมไดเร็วกวาที่เคย"
 SWI_expanded_special_forces: "หนวยรบพิเศษที่ขยายตัว"
 SWI_swiss_women_in_the_military: "สตรีสวิสในกองทัพ"
 SWI_volunteer_forces_idea: "กองกําลังอาสาสมัคร"
 SWI_volunteer_forces_idea_desc: "แมตามนโยบายปกติของเรา [SWI.GetNameDef]จะไมไดเปนสวนหนึ่งของความขัดแยงใดอยางเปนทางการ แตเราก็อนุญาตและแอบสงเสริมใหมีการเขารวมในฐานะอาสาสมัคร โดยเฉพาะเมื่อเปนการปกปองประชาธิปไตย"
 SWI_frozen_assets: "ทรัพยสินถูกสวิตเซอรแลนดอายัด"
 SWI_frozen_assets_desc: "หลังจากเราพึ่งพาธนาคารสวิสมานานหลายป พวกเขาก็เผยเจตนาที่แทจริงและแทงขางหลังเราดวยการอายัดทรัพยสินของเรา! เราจะฟนตัวทางการเงินจากเรื่องนี้ได แตตองใชเวลา"
 SWI_intel_support_idea: "การสนับสนุนดานขาวกรอง"
 SWI_humanitarian_effort: "ภารกิจดานมนุษยธรรม"
 SWI_communist_party_banned_idea: "สั่งหามลัทธิคอมมิวนิสต"
 SWI_alpine_redoubt_dynamic_modifier: "$SWI_alpine_redoubt$"
 SWI_democratic_unrest: "ความไมสงบเรียกรองประชาธิปไตย"
 SWI_democratic_unrest_desc: "หลังจากมีประชาธิปไตยทางตรงมาเปนศตวรรษ ชาว[ROOT.GetAdjective]จะไมนิ่งเงียบตอสภาพการเมืองในปจจุบันของ[ROOT.GetName]"
 SWI_resistance_groups_funded_by_foreign_country: "กลุมตอตานไดรับเงินทุนจากตางชาติ"
