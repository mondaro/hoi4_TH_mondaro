 SWI_mountaineer_paratroopers_idea: "$SWI_mountaneer_paratroopers$"
 SWI_mountaineer_paratroopers_idea_desc: "การเขาถึงยอดเขาที่สูงชันที่สุดบางแหง และวัฒนธรรมเทือกเขาแอลปที่สืบทอดมาหลายศตวรรษ ทําใหพลรมสวิสไดเปรียบเหนือทหารราบสงทางอากาศทั้งปวง พวกเขาสามารถกระโดดลงจากเครื่องบินลําเลียงของเราและครองยอดเขาไดราวกับอยูบนมอนเตโรซาหรือแมตเทอรฮอรน"
