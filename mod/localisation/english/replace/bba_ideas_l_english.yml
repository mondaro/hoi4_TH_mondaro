 ITA_offensive_in_ethiopia: "การรุกในเอธิโอเปย"
 ITA_offensive_in_ethiopia_desc: "กองทัพของเรามุงมั่นจะผลักดันขาศึกกลับไป ไมวาจะตองแลกดวยอะไรก็ตาม!"
 ITA_logistics_in_ethiopia: "การสงกําลังบํารุงในเอธิโอเปย"
 ITA_logistics_in_ethiopia_desc: "ดวยการวางแผนและการสงกําลังบํารุงที่เหมาะสม เราจะรุกคืบไดทีละเล็กละนอยแตมั่นคง โดยไมตองสังเวยทหารโดยไมจําเปน"
 ITA_stockpiling_fuel: "กักตุนเชื้อเพลิง"
 ITA_stockpiling_fuel_desc: "การมีเชื้อเพลิงสํารองจํานวนมากจะทําใหกองทัพของเราปฏิบัติการไดนานขึ้น"
 ITA_foggia_farm_fields: "ไรนาฟอจจา"
 ITA_foggia_farm_fields_desc: "การปรับปรุงเกษตรกรรมของฟอจจาใหทันสมัยจะทําใหผลิตอาหารไดมากขึ้น"
 ITA_hardened_irregular_bands: "กองกําลังนอกแบบที่ชํ่าชอง"
 ITA_hardened_irregular_bands_desc: "ดวยการใชประโยชนจากนักรบพื้นเมือง เราจะไดรับประโยชนอยางมากจากประสบการณการรบและความรูดานภูมิประเทศของพวกเขา"
 ITA_hardened_irregular_bands_tt: "การโจมตี การปองกัน และความเร็ว §G+5.00%§! สําหรับ §Y$irregular_infantry$§!, §Y$cavalry$§! และ §Y$camelry$§!"
 ITA_servizio_informazione_militare_ns: "$ITA_servizio_informazione_militare$"
 ITA_servizio_informazione_militare_ns_desc: "หนวยขาวกรองของเราจะชวยยับยั้งการจารกรรมจากตางชาติที่มุงเปามายังเรา รวมทั้งสงเสริมความทะเยอทะยานในระดับนานาชาติของเราเอง"
 ITA_devaluated_lira: "ลดคาเงินลีรา"
 ITA_devaluated_lira_desc: "สงครามครั้งหลัง ๆ ของเราสิ้นเปลืองมหาศาลและฉุดรั้งเศรษฐกิจ การลดคาเงินทําใหสินคาของเราแขงขันในตลาดโลกไดดีขึ้น และกระตุนเศรษฐกิจที่กําลังตองการแรงหนุนอยางยิ่ง"
 ITA_battaglia_del_grano: "ยุทธการธัญพืช"
 ITA_battaglia_del_grano_desc: "หากจะเปนเอกราชอยางแทจริง เราไมอาจพึ่งพามหาอํานาจตางชาติในดานอาหาร แตตองพึ่งพาตนเองทางการเกษตรใหได ยุทธการธัญพืชจะทําใหเราพึ่งพาตนเองไดและแสนยานุภาพของเราจะยิ่งเติบโต"
 ITA_battaglia_per_la_terra: "ยุทธการเพื่อผืนดิน"
 ITA_battaglia_per_la_terra_desc: "ยุทธการเพื่อผืนดินจะระบายนํ้าออกจากหนองบึงหลายไมลและสรางเปนที่ดินทํากิน ทั้งยังสรางโอกาสการจางงานใหม ๆ และรัฐบาลตางชาติก็ประทับใจในจิตวิญญาณอันไมยอทอของชาวอิตาลีแลว"
 ITA_battaglia_per_la_nascite: "ยุทธการเพื่อการเกิด"
 ITA_battaglia_per_la_nascite_desc: "เพื่อใหอิตาลีรุงเรืองอยางแทจริง เราตองการทหารมากขึ้น จะมีทหารมากขึ้นได เราตองมีประชากรมากขึ้น จะมีประชากรมากขึ้นได เราตองมีแม และสิ่งที่แมตองการคือใหเราเอาชนะยุทธการเพื่อการเกิด"
 ITA_camicie_nere: "Camicie Nere"
 ITA_camicie_nere_desc: "หนวยเสื้อดําไดใหคําสัตยปฏิญาณตอ[ITA.GetLeader]เปนการสวนตัว ทําใหพวกเขาไวใจไดและภักดียิ่งกวากองทัพสวนอื่น การมอบอํานาจและความรับผิดชอบที่มากขึ้นแกพวกเขาจะยิ่งเสริมความมั่นคงใหการปกครองของเรา"
 ITA_camicie_nere_mp_tt: "§Yสารวัตรทหาร§!: โบนัสการปราบปราม: §G+5.0%§!"
 ITA_italian_irredentism_ns: "$ITA_italian_irredentism$"
 ITA_italian_irredentism_ns_desc: "เพื่อให[ITA.GetNameDef]บรรลุศักยภาพและแสนยานุภาพเต็มที่ เราตองขยายสูพรมแดนตามธรรมชาติและรวมดินแดนทั้งหมดที่เปนของชาวอิตาลีโดยชอบธรรมเขาดวยกัน!"
 ITA_bandits_war: "สงครามปราบโจร"
 ITA_bandits_war_desc: "ความคลองตัวและการใชเครื่องจักรกลคืออนาคตของการสงคราม เราตองทุมลงทุนอยางหนักในการปรับปรุงกองทัพใหทันสมัย เพื่อใหประสบความสําเร็จในสนามรบยุคปจจุบัน"
 ITA_alpine_defense: "การปองกันเทือกเขาแอลป"
 ITA_alpine_defense_desc: "การสูรบอันโหดรายบนภูเขาในมหาสงครามยังคงฝงอยูในความทรงจําของผูคนมากมาย เราตองรักษาแนวรบดานเหนือจากการโจมตีใด ๆ ที่อาจเกิดขึ้น ดวยทหารที่มีความสามารถและรบไดอยางมีประสิทธิภาพในภูมิประเทศเชนนั้น"
 ITA_aviazione_legionaria: "Aviazione Legionaria"
 ITA_aviazione_legionaria_desc: "การครองความเหนือกวาทางอากาศเปนสิ่งสําคัญยิ่งสําหรับกองทัพใด ๆ ที่จะไดเปรียบและผลักดันขาศึกกลับไป"
 ITA_sold_obsolete_escort_ships_ns: "ขายเรือคุมกันที่ลาสมัย"
 ITA_sold_obsolete_escort_ships_ns_desc: "การสงออกเรือรบไปยังชาติอื่นไดเสริมความแข็งแกรงใหขีดความสามารถทางอุตสาหกรรมของเรา"
 ITA_strengthened_heavy_industry: "อุตสาหกรรมหนักที่แข็งแกรงขึ้น"
 ITA_strengthened_heavy_industry_desc: "การขยายกําลังการผลิตทางอุตสาหกรรมจะเพิ่มผลิตภาพทางอุตสาหกรรมของเรา"
 ITA_strengthened_the_army: "กองทัพที่แข็งแกรงขึ้น"
 ITA_strengthened_the_army_desc: "การขยายกองทัพไดสอนเราหลายสิ่งเกี่ยวกับการระดมพลและการจัดกําลังใหเปนกองกําลังรบที่เปนเอกภาพ"
 ITA_disgruntlement_in_the_army: "ความไมพอใจในกองทัพ"
 ITA_disgruntlement_in_the_army_desc: "ความไมพอใจไดแพรซึมเขาสูกองทัพ หลังจากถูกตําหนิวาขยายกําลังไดไมเร็วพอ"
 ITA_efficient_supply_lines: "เสนทางเสบียงที่มีประสิทธิภาพ"
 ITA_efficient_supply_lines_desc: "การสงกําลังบํารุงของกองทัพจะไมยุงยากเทาเดิม เมื่อเสนทางเสบียงไดประโยชนอยางมากจากกองรถบรรทุกเสบียงที่เพิ่งสรางขึ้นใหม"
 ITA_fuel_reserves: "เชื้อเพลิงสํารอง"
 ITA_fuel_reserves_desc: "การมีเชื้อเพลิงสํารองจํานวนมากจะชวยใหกองทัพของเราออกปฏิบัติการไดบอยขึ้นและกระตือรือรนมากขึ้น"
 ITA_strengthened_the_airforce: "กองทัพอากาศที่แข็งแกรงขึ้น"
 ITA_strengthened_the_airforce_desc: "กองทัพอากาศอิตาลีกลับมาเปนหนึ่งในกองบินที่ยิ่งใหญที่สุดในโลกอีกครั้ง นักบินที่เพิ่งผานการฝกตางกระหายจะแสดงใหเห็นวากองทัพอากาศของเรายิ่งใหญเพียงใด"
 ITA_disgruntlement_in_the_airforce: "ความไมพอใจในกองทัพอากาศ"
 ITA_disgruntlement_in_the_airforce_desc: "กองทัพอากาศไดรับสัญญาวาจะไดทรัพยากรและงบประมาณใหมเพื่อขยายกําลัง แตก็ไมมีอะไรมาถึง และความไมพอใจกําลังแพรกระจายในหมูทหาร"
 ITA_expanded_intelligence_service_basic: "หนวยขาวกรองที่ขยายตัว"
 ITA_expanded_intelligence_service_basic_desc: "หนวยขาวกรองที่ขยายตัวจะเสริมความมั่นคงภายในประเทศของเรา"
 ITA_bolstered_political_cabinet: "คณะรัฐมนตรีที่แข็งแกรงขึ้น"
 ITA_bolstered_political_cabinet_desc: "การมีคนที่ใชในตําแหนงที่ใชจะเสริมความแข็งแกรงใหระบอบฟาสซิสตและการปกครอง[ITA.GetNameDef]ของเรา"
 ITA_bolstered_military_high_command: "กองบัญชาการทหารสูงสุดที่แข็งแกรงขึ้น"
 ITA_bolstered_military_high_command_desc: "การมีผูนําที่มีความสามารถเปนสิ่งสําคัญยิ่งเพื่อใหกองทัพทํางานไดอยางเต็มประสิทธิภาพและประสบความสําเร็จในสนามรบ"
 ITA_all_within_the_state_ns: "$ITA_all_within_the_state$"
 ITA_all_within_the_state_ns_desc: "การเสริมขีดความสามารถหลังแนวหนาจะปูทางไปสูชัยชนะอยางมั่นคง"
 ITA_anti_partisan_measures_ns: "$ITA_anti_partisan_measures$"
 ITA_anti_partisan_measures_ns_desc: "หนวยเฉพาะกิจของเรากําลังขัดขวางการเคลื่อนไหวของพลพรรค ทําใหพวกเขาโจมตีหลังแนวหนาไดยากขึ้น"
