 SWI_pro_helvetia_idea: "Pro Helvetia"
 SWI_pro_helvetia_idea_desc: "เพื่อใหสวิตเซอรแลนดอยูรอด ประเทศตองมีอัตลักษณที่แยกออกจากภาษาตาง ๆ ที่ใชพูดกันภายใน ดวยเหตุนี้  Pro Helvetia จึงมีหนาที่สงเสริมคุณคาแบบสวิส และความยึดมั่นในประชาธิปไตยที่มาพรอมกับคุณคาเหลานั้น"
 SWI_martial_law_idea: "กฎอัยการศึก"
 SWI_martial_law_idea_desc: "ยามอันตรายยอมตองใชมาตรการที่เสี่ยงอันตราย กองทัพตองเขาควบคุมเพื่อรับประกันความสงบเรียบรอยและเสถียรภาพ หากโชคเขาขาง สักวันหนึ่ง[ROOT.GetAdjective]อาจไดรับการฟนฟู"
 SWI_extensive_press_censorship_idea: "การเซ็นเซอรสื่ออยางกวางขวาง"
 SWI_active_trade_agreement: "เสบียงจากขอตกลงการคา"
 SWI_trading_with_switzerland_military: "นําเขาการผลิตทางทหารจากสวิตเซอรแลนด"
 SWI_trading_with_switzerland_civilian: "นําเขาการผลิตพลเรือนจากสวิตเซอรแลนด"
 SWI_no_confederation_president_idea: "ไมมีการเลือกประธานสมาพันธรัฐ"
 SWI_no_confederation_president_idea_desc: "สิ่งที่ไมนาเปนไปไดไดเกิดขึ้นแลว สภาสหพันธไมสามารถเลือกประธานสมาพันธรัฐสวิสได ตองใชความพยายามอยางมากกวาจะหลุดพนจากสถานการณนี้"
 SWI_foreign_fascist_propaganda: "โฆษณาชวนเชื่อฟาสซิสตจากตางชาติ"
 SWI_foreign_fascist_propaganda_desc: "แมจะไมมีขบวนการฟาสซิสตขนาดใหญที่เกิดขึ้นภายใน[SWI.GetName] แตเพื่อนบานฟาสซิสตของเราตางกระหายจะฉีกสมาพันธรัฐของเราจากภายใน ดวยปฏิบัติการแนวรวมที่หาและโฆษณาชวนเชื่อในทุกรัฐ โดยเฉพาะรัฐที่พูดภาษา[GER.GetAdjective]และ[ITA.GetAdjective]"
 SWI_extensive_fascist_propaganda: "โฆษณาชวนเชื่อฟาสซิสตอยางกวางขวาง"
 SWI_extensive_fascist_propaganda_desc: "โฆษณาชวนเชื่อฟาสซิสตในสวิตเซอรแลนดเคยมาจากภายนอก แตบัดนี้ขบวนการไดแรงสงมากพอจะทําใหโฆษณาชวนเชื่อฟาสซิสตทวมทนประเทศทั้งจากภายในและภายนอก"
 SWI_rearmaming_idea: "การฟนฟูกําลังรบที่ดําเนินอยู"
 SWI_increased_defense_budget: "เพิ่มงบประมาณกลาโหม"
 SWI_war_bonds: "พันธบัตรสงคราม"
 SWI_banned_foreign_nazi_propaganda_idea: "สั่งหามโฆษณาชวนเชื่อนาซีจากตางชาติ"
 SWI_banned_foreign_nazi_propaganda_idea_desc: "ลัทธินาซีไมมีที่ยืนในสังคมเชนของเรา เราจึงไมอาจปลอยใหอุดมการณที่คุกคามรากฐานของสมาพันธรัฐแพรกระจายได ยิ่งไมตองพูดถึงโฆษณาชวนเชื่อจากชาติตางแดน"
 SWI_rearmed_idea_industrial: "สวิตเซอรแลนดที่ติดอาวุธใหม"
 SWI_army_limitations_TT: "§Rไมสามารถฝกกองกําลังประจําการนอกเหนือจากกองกําลังพลเมือง และไมสามารถแกไขแมแบบที่มีอยูนอกเหนือจากการตัดสินใจดานความพรอมรบ§!\n\n§Yสวิตเซอรแลนด§! พึ่งพาประชาชนพลเรือนใหจับอาวุธเมื่อจําเปน สามารถฝกกองกําลังพลเมืองไดในจํานวนจํากัด และ§Yการจัดระเบียบ§!ของพวกเขาจะถูกจํากัดเพดานไวในชวงแรก\n\nเมื่อแผนยุทธศาสตร §Y$SWI_armed_neutrality$§! สําเร็จ กองกําลังพลเมืองจะสามารถขยาย ปรับปรุง และในที่สุดก็สงออกปฏิบัติการไดดวยการตัดสินใจ §Y$SWI_activate_militia$§! ระหวางที่กองกําลังพลเมืองถูกสงออกปฏิบัติการ บทลงโทษตอเศรษฐกิจสวิสจะสะสมเพิ่มขึ้นตามเวลา แตจะถูกรีเซ็ตเมื่อเรียกกองกําลังกลับ"
 SWI_citizen_militia_1: "กองกําลังพลเมืองสวิส"
 SWI_citizen_militia_1_desc: "ตางจากชาติอื่นสวนใหญ ในสวิตเซอรแลนด ทุกคนที่มีคุณสมบัติตามเกณฑการเกณฑทหารจะตองจับอาวุธเขารวมกองกําลังพลเมืองในทองถิ่นเมื่อถูกเรียกตัว ทําใหเรามีประชากรสัดสวนมากเปนกําลังสํารองโดยไมกระทบเศรษฐกิจมากนัก ตราบใดที่ยังไมไดสงพวกเขาออกปฏิบัติการ\n"
 SWI_citizen_militia_2: "กองกําลังพลเมืองสวิสที่ขยายตัว"
 SWI_citizen_militia_2_desc: "$SWI_citizen_militia_1_desc$"
