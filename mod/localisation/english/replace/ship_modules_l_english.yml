 ### EQUIPMENT MODULES ###
 ship_light_battery_1: "ปนใหญยิงเร็ว 85 มม."
 ship_light_battery_1_short: "ปนใหญเรือขนาดเบา I"
 ship_light_battery_1_desc: "ปนขนาดคอนขางเล็กสําหรับใชบนเรือพิฆาตและเรือขนาดเล็กกวา"
 ship_light_battery_2: "ปนใหญยิงเร็ว 105 มม."
 ship_light_battery_2_short: "ปนใหญเรือขนาดเบา II"
 ship_light_battery_2_desc: "ปนขนาดเล็กบนแทนที่ขับเคลื่อนดวยกําลัง ทําใหติดตามเปาหมายไดอยางรวดเร็ว"
 ship_light_battery_3: "ปนใหญยิงเร็ว 127 มม."
 ship_light_battery_3_short: "ปนใหญเรือขนาดเบา III"
 ship_light_battery_3_desc: "ปนขนาดเล็กที่มีโลปนเพื่อปกปองพลประจําปนจากสะเก็ดกระสุนและสภาพอากาศเลวราย"
 ship_light_battery_4: "ปนใหญยิงเร็ว 130 มม."
 ship_light_battery_4_short: "ปนใหญเรือขนาดเบา IV"
 ship_light_battery_4_desc: "ปนขนาดเล็กคูหนึ่งบนแทนหุมเกราะที่ขับเคลื่อนดวยกําลัง"
 dp_light_battery_1: "ปนใหญเรืออเนกประสงค 100 มม."
 dp_light_battery_1_short: "ปนใหญหลักอเนกประสงค I"
 dp_light_battery_1_desc: "ปนขนาดเล็กบนแทนพิเศษ ทําใหโจมตีไดทั้งอากาศยานและเปาหมายผิวนํ้า"
 dp_light_battery_2: "ปนใหญเรืออเนกประสงค 113 มม."
 dp_light_battery_2_short: "ปนใหญหลักอเนกประสงค II"
 dp_light_battery_2_desc: "ปนขนาดเล็กบนแทนมุมยิงสูงพรอมโลปน ทําใหโจมตีไดทั้งอากาศยานและเปาหมายผิวนํ้า"
 dp_light_battery_3: "ปนใหญเรืออเนกประสงค 127 มม."
 dp_light_battery_3_short: "ปนใหญหลักอเนกประสงค III"
 dp_light_battery_3_desc: "ปนขนาดเล็กในปอมปนแบบปดมุมยิงสูง ทําใหโจมตีไดทั้งอากาศยานและเปาหมายผิวนํ้า"
 dp_light_battery_4: "ปนใหญเรืออเนกประสงคยิงเร็ว 127 มม."
 dp_light_battery_4_short: "ปนใหญหลักอเนกประสงค IV"
 dp_light_battery_4_desc: "ปนขนาดเล็กยิงเร็วในปอมปนมุมยิงสูงที่ขับเคลื่อนดวยกําลัง ทําใหโจมตีไดทั้งอากาศยานและเปาหมายผิวนํ้า"
 ship_heavy_battery_1: "ปนใหญ 28 ซม."
 ship_heavy_battery_1_short: "ปนใหญเรือขนาดหนัก I"
 ship_heavy_battery_1_desc: "ปนใหญขนาดลํากลองใหญที่มีมาตั้งแตกอนมหาสงคราม"
 ship_heavy_battery_2: "ปนใหญ 30.5 ซม."
 ship_heavy_battery_2_short: "ปนใหญเรือขนาดหนัก II"
 ship_heavy_battery_2_desc: "ชุดปนใหญขนาดลํากลองใหญบนแทนที่หุมเกราะหนา การออกแบบปอมปนใหมทําใหยกปนไดสูงขึ้น จึงเพิ่มระยะยิง"
 ship_heavy_battery_3: "ปนใหญ 38 ซม."
 ship_heavy_battery_3_short: "ปนใหญเรือขนาดหนัก III"
 ship_heavy_battery_3_desc: "แทนปนหุมเกราะหนาสําหรับปนหนัก ที่ผสานเทคโนโลยีใหมหลายอยางเพื่อเพิ่มความแมนยําและความเร็วในการยิง"
 ship_heavy_battery_4: "ปนใหญ 40.6 ซม."
 ship_heavy_battery_4_short: "ปนใหญเรือขนาดหนัก IV"
 ship_heavy_battery_4_desc: "วิวัฒนาการขั้นสุดยอดของอํานาจการยิงหนัก แทนปนหุมเกราะหนานี้ใหความแมนยําสูงในระยะไกล"
 ship_super_heavy_battery_1: "ปนใหญ 46 ซม."
 ship_super_heavy_battery_1_short: "ปนใหญเรือขนาดหนักพิเศษ"
 ship_super_heavy_battery_1_desc: "ปนที่ใหญที่สุดเทาที่เคยติดตั้งบนเรือ ปนใหญมหึมาเหลานี้ไดรับการออกแบบใหเจาะทะลุเกราะใด ๆ ที่เปนไปไดในทุกระยะ"
 ship_light_medium_battery_1: "ปนใหญ 14.5 ซม."
 ship_light_medium_battery_1_short: "ปนใหญเรือลาดตระเวนเบา I"
 ship_light_medium_battery_1_desc: "ปนนี้เปนการประนีประนอมระหวางอัตราการยิงกับนํ้าหนักกระสุน ออกแบบมาเพื่อใชบนเรือลาดตระเวนเบาในการเอาชนะเรือขนาดเล็กกวา"
 ship_light_medium_battery_2: "ปนใหญ 15 ซม."
 ship_light_medium_battery_2_short: "ปนใหญเรือลาดตระเวนเบา II"
 ship_light_medium_battery_2_desc: "ปนนี้เปนวิวัฒนาการตามธรรมชาติจากรุนกอน ๆ และมุงใหเรือลาดตระเวนเบามีความไดเปรียบดานอํานาจการยิงเหนือเรือพิฆาตและเรือลาดตระเวนรุนเกาอยางสบาย"
 ship_light_medium_battery_3: "ปนใหญ 15.5 ซม."
 ship_light_medium_battery_3_short: "ปนใหญเรือลาดตระเวนเบา III"
 ship_light_medium_battery_3_desc: "แทนปนหุมเกราะบางนี้ผสานเทคโนโลยีใหมหลายอยาง ชวยถางชองวางระหวางปนใหญหลักของเรือพิฆาตกับเรือลาดตระเวนเบาใหกวางยิ่งขึ้น"
 ship_light_medium_battery_4: "ปนใหญบรรจุกระสุนอัตโนมัติ 15.5 ซม."
 ship_light_medium_battery_4_short: "ปนใหญเรือลาดตระเวนเบาบรรจุกระสุนอัตโนมัติ"
 ship_light_medium_battery_4_desc: "แทนปนนี้ออกแบบใหมทั้งหมดเพื่ออัตราการยิงสูง ชวยใหเรือลาดตระเวนเบาสามารถทําใหขาศึกที่ใหญกวาหมดสภาพไดดวยการยิงถูกจํานวนมาก"
 dp_ship_medium_1: "ปนใหญเรืออเนกประสงคยิงเร็ว 152 มม."
 dp_ship_medium_1_short: "ปนใหญเรือลาดตระเวนเบา IV"
 dp_ship_medium_1_desc: "แทนปนนี้ออกแบบใหมทั้งหมดเพื่อมุมยิงสูง ชวยใหเรือลาดตระเวนเบาสามารถตอสูกับเรือที่ใหญกวาและอากาศยานได"
 ship_medium_battery_1: "ปนใหญ 17 ซม."
 ship_medium_battery_1_short: "ปนใหญเรือลาดตระเวนหนัก I"
 ship_medium_battery_1_desc: "แมจะไมสามารถสรางความเสียหายสําคัญตอเรือประจัญบานได แตปนขนาดกลางนี้ชวยใหเรือลาดตระเวนหนักตอสูกับเรือที่เบากวาและเรือลาดตระเวนอื่น ๆ ไดอยางมั่นใจ"
 ship_medium_battery_2: "ปนใหญ 19 ซม."
 ship_medium_battery_2_short: "ปนใหญเรือลาดตระเวนหนัก II"
 ship_medium_battery_2_desc: "ปนนี้เปนวิวัฒนาการจากแบบกอนหนา สรางขึ้นเพื่อใหทันกับเกราะที่หนาขึ้นและระยะการรบทางเรือที่ไกลขึ้น"
 ship_medium_battery_3: "ปนใหญ 20.3 ซม."
 ship_medium_battery_3_short: "ปนใหญเรือลาดตระเวนหนัก III"
 ship_medium_battery_3_desc: "แมจะไมใชปนที่ใหญที่สุดที่ติดตั้งบนเรือลาดตระเวนได แตปนใหญนี้ใหสมดุลที่ดีที่สุดระหวางนํ้าหนักอาวุธกับอํานาจการยิง และเจาะเกราะเรือลาดตระเวนไดอยางเชื่อถือได"
 ship_medium_battery_4: "ปนใหญบรรจุกระสุนอัตโนมัติ 20.3 ซม."
 ship_medium_battery_4_short: "ปนใหญเรือลาดตระเวนหนัก IV"
 ship_medium_battery_4_desc: "ดวยขนาดลํากลองที่ถูกจํากัดโดยกระสุนที่มีอยู และคํานึงถึงการปรับปรุงเรือรุนเกา ปนรุนใหมนี้มีระบบบรรจุกระสุนอัตโนมัติขั้นสูงที่เพิ่มอัตราการยิงอยางมาก"
 ship_secondaries_1: "ปนใหญยิงเร็ว 75 มม."
 ship_secondaries_1_short: "ปนใหญรอง I"
 ship_secondaries_1_desc: "ปนใหญเบานี้ติดตั้งในปอมขางลําเรือ ชวยใหเรือขนาดใหญมีการปองกันตนเองจากเรือขนาดเล็กไดบาง"
 ship_secondaries_2: "ปนใหญยิงเร็ว 120 มม."
 ship_secondaries_2_short: "ปนใหญรอง II"
 ship_secondaries_2_desc: "แทนปอมปนขนาดเล็กสําหรับปนใหญยิงเร็ว ออกแบบมาเพื่อปกปองเรือหลักจากเรือพิฆาตและเรือตอรปโด"
 dp_ship_secondaries_1: "ปนใหญรองอเนกประสงค 100 มม."
 dp_ship_secondaries_1_short: "ปนใหญรองอเนกประสงค I"
 dp_ship_secondaries_1_desc: "ดวยการรวมหนาที่ของปนตอสูอากาศยานหนักกับปนใหญรองเขาดวยกัน แทนปนนี้ชวยเพิ่มขีดความสามารถในการตอสูอากาศยานของเรืออยางมาก พรอมทั้งใหการปองกันจากเปาหมายผิวนํ้าขนาดเล็กไดบาง"
 dp_ship_secondaries_2: "ปนใหญรองอเนกประสงค 113 มม."
 dp_ship_secondaries_2_short: "ปนใหญรองอเนกประสงค II"
 dp_ship_secondaries_2_desc: "การติดตั้งปนรองอเนกประสงคไวในปอมปนชวยเพิ่มการปกปองพลประจําปนอยางมาก"
 dp_ship_secondaries_3: "ปนใหญรองอเนกประสงค 127 มม."
 dp_ship_secondaries_3_short: "ปนใหญรองอเนกประสงค III"
 dp_ship_secondaries_3_desc: "ปอมปนแฝดอเนกประสงคที่ขับเคลื่อนดวยกําลังชวยเพิ่มอํานาจการยิงไดอยางมาก"
 dp_ship_secondaries_4: "ปนใหญรองอเนกประสงคยิงเร็ว 127 มม."
 dp_ship_secondaries_4_short: "ปนใหญรองอเนกประสงค IV"
 dp_ship_secondaries_4_desc: "สรางขึ้นเพื่อการยิงเร็วตอเปาหมายทุกรูปแบบ นี่คืออาวุธรองขั้นสุดยอด"
 ship_fire_control_system_0: "การวัดระยะจากศูนยกลาง"
 ship_fire_control_system_0_short: "การควบคุมการยิง 0"
 ship_fire_control_system_0_desc: "สถานีกลางบนยอดเสากระโดงเรือจะวัดระยะถึงเปาหมายและสงขอมูลนั้นไปยังแทนปน"
 ship_fire_control_system_1: "การยิงดวยเครื่องอํานวยการยิง"
 ship_fire_control_system_1_short: "การควบคุมการยิง I"
 ship_fire_control_system_1_desc: "สถานีอํานวยการยิงกลางจะยิงปนทั้งหมดพรอมกันตามคําสั่งของนายทหารการปน"
 ship_fire_control_system_2: "เครื่องคํานวณระยะเชิงกล"
 ship_fire_control_system_2_short: "การควบคุมการยิง II"
 ship_fire_control_system_2_desc: "คอมพิวเตอรเชิงกลบนเรือจะปรับปรุงระยะและทิศทางถึงเปาหมายอยางตอเนื่อง จากขอมูลที่ไดรับจากเครื่องวัดระยะและเซนเซอรอื่น ๆ"
 ship_fire_control_system_3: "คอมพิวเตอรขีปนวิถี"
 ship_fire_control_system_3_short: "การควบคุมการยิง III"
 ship_fire_control_system_3_desc: "คอมพิวเตอรเชิงกลที่ซับซอนกวาจะพิจารณาปจจัยหลากหลายเมื่อคํานวณวิถีกระสุนเพื่อโจมตีเปาหมาย"
 ship_torpedo_1: "แทนยิงตอรปโด 3x 450 มม."
 ship_torpedo_1_short: "แทนยิงตอรปโด I"
 ship_torpedo_1_desc: "ชุดตอรปโดขนาดกลางที่สามารถติดตั้งบนเรือรบผิวนํ้าได"
 ship_torpedo_2: "แทนยิงตอรปโด 4x 450 มม."
 ship_torpedo_2_short: "แทนยิงตอรปโด II"
 ship_torpedo_2_desc: "ดวยการติดตั้งทอตอรปโดเพิ่มอีกหนึ่งทอบนแทน เรือผิวนํ้าจะยิงกระจายไดกวางขึ้นและมีโอกาสยิงถูกสูงขึ้น"
 ship_torpedo_3: "แทนยิงตอรปโด 3x 533 มม."
 ship_torpedo_3_short: "แทนยิงตอรปโด III"
 ship_torpedo_3_desc: "ตอรปโดที่ใหญขึ้นสามารถบรรทุกหัวรบที่ใหญขึ้น สรางความเสียหายตอเปาหมายไดมากขึ้นอยางมาก อยางไรก็ตาม แทนยิงจะตองมีจํานวนทอนอยลง"
 ship_torpedo_4: "แทนยิงตอรปโด 4x 533 มม."
 ship_torpedo_4_short: "แทนยิงตอรปโด IV"
 ship_torpedo_4_desc: "เมื่อแกปญหาเชิงกลไกในการยิงตอรปโดขนาดใหญจากเรือผิวนํ้าไดแลว รุนขั้นสูงนี้ยังสามารถบรรจุใหมไดอยางรวดเร็วสําหรับการยิงชุดถัดไป"
 ship_torpedo_sub_1: "ทอตอรปโด 4x 450 มม."
 ship_torpedo_sub_1_short: "ทอตอรปโด I"
 ship_torpedo_sub_1_desc: "ชุดทอตอรปโดพื้นฐานที่สามารถบรรจุใหมจากภายในเรือดํานํ้าได"
 ship_torpedo_sub_2: "ทอตอรปโด 6x 450 มม."
 ship_torpedo_sub_2_short: "ทอตอรปโด II"
 ship_torpedo_sub_2_desc: "หองตอรปโดที่ใหญขึ้นชวยใหติดตั้งทอตอรปโดไดมากขึ้น และยังเพิ่มพื้นที่อยูอาศัยใหลูกเรือเล็กนอย"
 ship_torpedo_sub_3: "ทอตอรปโด 4x 533 มม."
 ship_torpedo_sub_3_short: "ทอตอรปโด III"
 ship_torpedo_sub_3_desc: "ชุดทอตอรปโดที่ใหญขึ้นชวยใหเรือดํานํ้ายิงตอรปโดขนาดใหญขึ้นได"
 ship_torpedo_sub_4: "ทอตอรปโด 6x 533 มม."
 ship_torpedo_sub_4_short: "ทอตอรปโด IV"
 ship_torpedo_sub_4_desc: "การเพิ่มเครื่องกระทุงบรรจุไฟฟาทําใหบรรจุทอตอรปโดใหมไดภายในไมกี่นาที"
 ship_anti_air_1: "ปนกล .50 cal."
 ship_anti_air_1_short: "ตอสูอากาศยาน I"
 ship_anti_air_1_desc: "ชุดปนกลหนักใหการปองกันระยะประชิดจากเครื่องบินไดเล็กนอย"
 ship_anti_air_2: "ปนตอสูอากาศยาน 20 มม."
 ship_anti_air_2_short: "ตอสูอากาศยาน II"
 ship_anti_air_2_desc: "ปนใหญอัตโนมัติขนาดเล็กยิงกระสุนที่ใหญกวามาก สามารถสังหารอากาศยานที่เขาโจมตีไดดวยการยิงถูกไมกี่นัด"
 ship_anti_air_3: "ปนตอสูอากาศยาน 37 มม."
 ship_anti_air_3_short: "ตอสูอากาศยาน III"
 ship_anti_air_3_desc: "ปนขนาดลํากลองรุนกอน ๆ พิสูจนแลววาเบาเกินไปที่จะสังหารเครื่องบินที่เขาโจมตีไดอยางแนนอนกอนที่มันจะปลอยอาวุธ กระสุนที่ใหญขึ้นตองใชปนที่ใหญขึ้น แตมีโอกาสทําลายเปาหมายสูงกวามากเมื่อยิงถูก"
 ship_anti_air_4: "ปนตอสูอากาศยานสี่ลํากลอง 40 มม."
 ship_anti_air_4_short: "ตอสูอากาศยาน IV"
 ship_anti_air_4_desc: "ปนตอสูอากาศยานรุนลาสุดมีแทนที่ขับเคลื่อนดวยกําลังเพื่อติดตามเปาหมายที่บินเร็ว และระบบอํานวยการยิงขั้นสูงเพื่อประสานการยิงจากตําแหนงปนหลายแหงไปยังเปาหมายเดียว"
 ship_mine_layer_1: "รางวางทุนระเบิด"
 ship_mine_layer_1_desc: "การดัดแปลงเรือผิวนํ้าใหบรรทุกและวางทุนระเบิดทางทะเลได"
 ship_mine_sweeper_1: "อุปกรณกวาดทุนระเบิด"
 ship_mine_sweeper_1_desc: "อุปกรณสําหรับปลอยเครื่องมือกวาดทุนระเบิดประเภทตาง ๆ"
 ship_mine_layer_sub: "ทอวางทุนระเบิด"
 ship_mine_layer_sub_desc: "การดัดแปลงตัวเรือดํานํ้าใหสามารถวางทุนระเบิดไดจํานวนหนึ่ง"
 ship_depth_charge_1: "รางปลอยระเบิดลึก"
 ship_depth_charge_1_short: "ระเบิดลึก I"
 ship_depth_charge_1_desc: "ชุดรางอยางงายชวยใหกลิ้งระเบิดลึกลงจากทายเรือไดเมื่อเรือแลนผานเหนือเปาหมายใตนํ้า"
 ship_depth_charge_2: "เครื่องยิงระเบิดลึก"
 ship_depth_charge_2_short: "ระเบิดลึก II"
 ship_depth_charge_2_desc: "อุปกรณนี้ใชดินระเบิดขนาดเล็กเหวี่ยงระเบิดลึกออกไปไดไกลพอสมควร ทําใหเรือเพียงลําเดียวทิ้งระเบิดลึกเปนรูปแบบครอบคลุมพื้นที่กวางขึ้นได"
 ship_depth_charge_3: "ปนครกปราบเรือดํานํ้า"
 ship_depth_charge_3_short: "ระเบิดลึก III"
 ship_depth_charge_3_desc: "เครื่องยิงระเบิดลึกขนาดเล็กที่มีชนวนกระทบแตก ชวยใหเรือโจมตีเปาหมายไดโดยไมขาดการติดตอทางโซนาร"
 ship_depth_charge_4: "ปนครกปราบเรือดํานํ้าขั้นสูง"
 ship_depth_charge_4_short: "ระเบิดลึก IV"
 ship_depth_charge_4_desc: "วิวัฒนาการจากรุนกอนหนา ปนครกนี้สามารถยิงลูกระเบิดที่ใหญกวามากไดในระยะไกลขึ้น"
 ship_sub_snorkel_1: "ทอหายใจใตนํ้าพื้นฐาน"
 ship_sub_snorkel_1_desc: "อุปกรณที่ชวยใหเรือดํานํ้าเดินเครื่องยนตหลักใตนํ้าได ทําใหชารจแบตเตอรี่ไดโดยไมตองโผลขึ้นผิวนํ้าและเสี่ยงตอการถูกโจมตี"
 ship_sub_snorkel_2: "ทอหายใจใตนํ้าแบบปรับปรุง"
 ship_sub_snorkel_2_desc: "การปรับปรุงแบบทอหายใจใตนํ้าชวยลดปญหาเมื่อใชเครื่องยนตหลักในทะเลคลื่นแรง พรอมทั้งลดโอกาสที่ทอหายใจจะถูกตรวจจับดวยเรดาร"
 ship_airplane_launcher_1: "เครื่องดีดสงเครื่องบินทะเล"
 ship_airplane_launcher_1_desc: "เครื่องดีดสงเครื่องบินอยางงายที่สงเครื่องบินลาดตระเวนขนาดเล็กขึ้นสูอากาศ"
 ship_airplane_launcher_2: "เครื่องดีดสงเครื่องบินทะเลแบบปรับปรุง"
 ship_airplane_launcher_2_desc: "กลไกการสงขึ้นบินที่ปรับปรุงแลว ชวยใหเรือสงเครื่องบินที่ใหญขึ้นซึ่งมีพิสัยและความเร็วสูงขึ้นได"
 ship_seaplane_tender_1: "เรือพี่เลี้ยงเครื่องบินทะเล"
 ship_seaplane_tender_1_desc: "อุปกรณสําหรับเติมเชื้อเพลิงและเก็บกูเครื่องบินทะเล ทําใหเครื่องบินปฏิบัติการไดโดยพึ่งพาการสงกําลังบํารุงจากฝงนอยลง"
 ship_seaplane_tender_2: "เรือพี่เลี้ยงเครื่องบินทะเลแบบปรับปรุง"
 ship_seaplane_tender_2_desc: "ขณะที่เรือพี่เลี้ยงเครื่องบินทะเลรุนแรกสุดดัดแปลงจากเรือสินคา รุนใหม ๆ สรางขึ้นเพื่อภารกิจนี้โดยเฉพาะ และมีขีดความสามารถในการสนับสนุนเครื่องบินทะเลที่ดีขึ้นอยางมาก"
 sub_missile_launcher: "แทนยิงขีปนาวุธเรือดํานํ้า"
 sub_missile_launcher_desc: "แทนยิงที่ติดตั้งบนเรือดํานํ้าสําหรับขีปนาวุธนําวิถีและขีปนาวุธทิ้งตัว"
 slbm_launcher: "แทนยิงขีปนาวุธนิวเคลียรเรือดํานํ้า"
 slbm_launcher_desc: "แทนยิงที่ติดตั้งบนเรือดํานํ้าสําหรับขีปนาวุธทิ้งตัวนิวเคลียร"
 ship_engine_sub_aip_1: "ระบบขับเคลื่อนไมพึ่งอากาศ"
 ship_engine_sub_aip_1_desc: "เครื่องยนตแบบใหมรุนแรก ชวยใหเรือดํานํ้าปฏิบัติการใตนํ้าไดนานขึ้น แลกกับการใชเชื้อเพลิงที่เพิ่มขึ้นมากและพิสัยเรือที่ลดลง"
 ship_engine_sub_aip_2: "เครื่องยนตผสม AIP-ดีเซล"
 ship_engine_sub_aip_2_desc: "ระบบขับเคลื่อนไมพึ่งอากาศรุนใหม ใหสมรรถนะที่ดีขึ้นพรอมการใชเชื้อเพลิงที่ตํ่าลง"
 ship_engine_sub_aip_3: "เครื่องยนตวัลเทอรความเร็วสูง"
 ship_engine_sub_aip_3_desc: "เราไดมาถึงจุดสูงสุดของสิ่งที่เราคิดวาเครื่องยนต AIP จะทําไดแลว เครื่องยนตนี้ใหความเร็วยอดเยี่ยม ขณะเดียวกันก็รักษาการใชเชื้อเพลิงไวในระดับที่ยอมรับได"
 ship_anechoic_tile: "แผนดูดซับเสียงสะทอน"
 ship_anechoic_tile_desc: "แผนยางเคลือบตัวเรือที่ออกแบบมาเพื่อลดระยะที่เรือจะถูกตรวจจับไดทั้งดวยโซนารแบบรับและแบบสง"
 ship_torpedo_sub_nuclear: "ตอรปโดนิวเคลียร"
 ship_torpedo_sub_nuclear_desc: "ตอรปโดที่บรรทุกหัวรบนิวเคลียร เปนอาวุธที่มีประสิทธิภาพสูงตอเรือขาศึก แลกกับความเสี่ยงตออุบัติเหตุที่สูงขึ้น"
 ship_deck_space: "พื้นที่โรงเก็บเครื่องบิน"
 ship_deck_space_desc: "พื้นที่โลงขนาดใหญภายในเรือสําหรับซอมบํารุงและติดอาวุธใหเครื่องบินแบบมีลอ การเพิ่มพื้นที่โรงเก็บเครื่องบินใหเรือจะทําใหตนทุนสูงขึ้นอยางมาก"
 big_ship_deck_space: "ทางวิ่งสนามบินลอยนํ้า"
 big_ship_deck_space_desc: "พื้นที่โลงสําหรับซอมบํารุง เติมเชื้อเพลิง และสงกําลังบํารุงใหเครื่องบิน รวมถึงเตรียมความพรอมสําหรับภารกิจ สามารถเก็บและใชงานเครื่องบินรุนที่ไมใชรุนสําหรับเรือบรรทุกเครื่องบินได"
 ship_escort_deck_space: "โรงเก็บเครื่องบินของเรือบรรทุกเครื่องบินคุมกัน"
 ship_escort_deck_space_desc: "พื้นที่โลงภายในเรือสําหรับซอมบํารุงและติดอาวุธใหเครื่องบินแบบมีลอ มีขนาดเล็กและคับแคบกวาโรงเก็บเครื่องบินบนเรือบรรทุกเครื่องบินหลักมาก"
 ship_submarine_deck_space: "โรงเก็บเครื่องบินของเรือดํานํ้าบรรทุกเครื่องบิน"
 ship_submarine_deck_space_desc: "หองกันนํ้าและอุปกรณเครื่องดีดสง ชวยใหเรือดํานํ้าบรรทุก สงขึ้นบิน และเก็บกูเครื่องบินทะเลจํานวนเล็กนอยได"
 ship_sonar_1: "ไฮโดรโฟน"
 ship_sonar_1_desc: "ชุดไฮโดรโฟนอยางงายสําหรับติดตามเปาหมายใตนํ้าจากเสียงที่มันสรางขึ้น"
 ship_sonar_2: "โซนารแบบสง"
 ship_sonar_2_desc: "เครื่องสงสัญญาณเสียงที่สง 'ปง' สั้น ๆ ลงไปในนํ้า แลวฟงเสียงสะทอนจากตัวเรือดํานํ้าที่ดําอยูใตนํ้า"
 ship_sonar_3: "โซนารขั้นสูง"
 ship_sonar_3_desc: "ชุดโซนารแบบสงที่ปรับปรุงแลว ใชคลื่นสัญญาณที่แรงขึ้นและการสแกนแบบกําหนดทิศทาง"
 ship_sonar_4: "โซนารสมัยใหม"
 ship_sonar_4_desc: "ระบบโซนารที่ลํ้าสมัยที่สุด ใหการติดตามเปาหมายใตนํ้าที่เหนือกวา"
 ship_radar_1: "เรดารคนหาทางทะเลคลื่นเดซิเมตร"
 ship_radar_1_short: "เรดาร I"
 ship_radar_1_desc: "ชุดเรดารอยางงายที่ทํางานในชวงความยาวคลื่น 50 ซม. ชวยใหตรวจจับเรือผิวนํ้าไดแมในสภาพอากาศเลวราย ในระยะกวา 10 กิโลเมตร"
 ship_radar_2: "เรดารคนหาทางทะเลคลื่นเดซิเมตรแบบปรับปรุง"
 ship_radar_2_short: "เรดาร II"
 ship_radar_2_desc: "ชุดเรดารที่ปรับปรุงแลวซึ่งทํางานในชวงความยาวคลื่น 30 ซม. สามารถวัดระยะและทิศทางของเรือแมลําเล็กไดอยางแมนยําในระยะกวา 25 กิโลเมตร"
 ship_radar_3: "เรดารการปนคลื่นเซนติเมตร"
 ship_radar_3_short: "เรดาร III"
 ship_radar_3_desc: "ชุดเรดารนี้ติดตั้งแมกนีตรอนแบบโพรง ไมเพียงตรวจจับเปาหมายขนาดเล็กมากได แตยังตรวจจับละอองนํ้าจากกระสุนตกไดดวย ทําใหยิงเปาหมายแบบมองไมเห็นไดอยางแทจริง แมในเวลากลางคืนหรือในสภาพอากาศเลวราย"
 ship_radar_4: "เรดารควบคุมการยิงแบบบูรณาการ"
 ship_radar_4_short: "เรดาร IV"
 ship_radar_4_desc: "ชุดเรดารนี้ทํางานในชวงความยาวคลื่นเซนติเมตร บูรณาการเขากับระบบควบคุมการปนของเรืออยางสมบูรณ และชวยใหควบคุมการยิงไดอยางแมนยําสูงในทุกสภาพอากาศ"
 ship_extra_fuel_tank: "ถังเชื้อเพลิงเสริม"
 ship_extra_fuel_tank_desc: "พื้นที่เก็บเชื้อเพลิงที่ขยายเพิ่มชวยเพิ่มพิสัยปฏิบัติการ"
 light_ship_engine_1: "เครื่องยนต 35,000 แรงมาเพลา"
 light_ship_engine_1_short: "เครื่องยนตเบา I"
 light_ship_engine_1_desc: "ชุดกังหันไอนํ้าขนาดเล็กสามารถขับเคลื่อนเรือขนาดเล็กดวยความเร็วสูง หรือขับเคลื่อนเรือขนาดใหญดวยความเร็วตํ่ากวาได"
 light_ship_engine_2: "เครื่องยนต 40,000 แรงมาเพลา"
 light_ship_engine_2_short: "เครื่องยนตเบา II"
 light_ship_engine_2_desc: "ดวยการใชหมอไอนํ้าแรงดันสูง เครื่องจักรที่มีนํ้าหนักและขนาดเทาเดิมสามารถใหกําลังที่สูงขึ้น"
 light_ship_engine_3: "เครื่องยนต 45,000 แรงมาเพลา"
 light_ship_engine_3_short: "เครื่องยนตเบา III"
 light_ship_engine_3_desc: "พัฒนาการใหมดานวัสดุชวยใหไดแรงดันไอนํ้าสูงขึ้นมาก จึงใหกําลังที่มากขึ้น"
 light_ship_engine_4: "เครื่องยนต 50,000 แรงมาเพลา"
 light_ship_engine_4_short: "เครื่องยนตเบา IV"
 light_ship_engine_4_desc: "การจัดวางเครื่องยนตและระบบเฟองกังหันที่ปรับปรุงแลว ชวยใหมีประสิทธิภาพสูงขึ้นที่นํ้าหนักเทาเดิม"
 sub_ship_engine_1: "เครื่องยนต 1,000 แรงมาเพลา"
 sub_ship_engine_1_short: "เครื่องยนตเรือดํานํ้า I"
 sub_ship_engine_1_desc: "การผสมผสานเครื่องยนตดีเซลกับมอเตอรไฟฟาชวยใหเรือดํานํ้าปฏิบัติการใตนํ้าไดดวยความเร็วที่พอเหมาะ"
 sub_ship_engine_2: "เครื่องยนต 2,000 แรงมาเพลา"
 sub_ship_engine_2_short: "เครื่องยนตเรือดํานํ้า II"
 sub_ship_engine_2_desc: "เครื่องยนตดีเซลที่ทรงพลังกวาชวยใหเรือดํานํ้าเรงเขาที่ตั้งไดเมื่อตรวจพบเปาหมาย"
 sub_ship_engine_3: "เครื่องยนต 3,000 แรงมาเพลา"
 sub_ship_engine_3_short: "เครื่องยนตเรือดํานํ้า III"
 sub_ship_engine_3_desc: "วัสดุและวิธีการผลิตใหมชวยใหสรางเครื่องยนตที่เดินเครื่องเต็มกําลังไดนานขึ้น"
 sub_ship_engine_4: "เครื่องยนต 4,000 แรงมาเพลา"
 sub_ship_engine_4_short: "เครื่องยนตเรือดํานํ้า IV"
 sub_ship_engine_4_desc: "เครื่องยนตขั้นสูงที่มีเทอรโบชารจเจอรสามารถเรงความเร็วไดมากในชวงเวลาสั้น ๆ ไมวาจะเพื่อไลลาเปาหมายหรือชารจแบตเตอรี่ใหเร็วขึ้น"
 sub_ship_nuclear_engine_1: "เครื่องปฏิกรณนิวเคลียรเรือดํานํ้า"
 sub_ship_nuclear_engine_1_short: "เครื่องปฏิกรณเรือดํานํ้า"
 sub_ship_nuclear_engine_1_desc: "เครื่องปฏิกรณขนาดเล็กที่ใหระบบขับเคลื่อนนิวเคลียรแกเรือดํานํ้า ชวยใหอยูใตนํ้าไดนานและปฏิบัติการไดอยางมีประสิทธิภาพสําหรับกองเรือสมัยใหม"
 cruiser_ship_engine_1: "เครื่องยนต 60,000 แรงมาเพลา"
 cruiser_ship_engine_1_short: "เครื่องยนตเรือลาดตระเวน I"
 cruiser_ship_engine_1_desc: "ชุดหมอไอนํ้าพื้นฐานที่สงไอนํ้าใหแกกังหันแบบไมมีเฟองทด"
 cruiser_ship_engine_2: "เครื่องยนต 70,000 แรงมาเพลา"
 cruiser_ship_engine_2_short: "เครื่องยนตเรือลาดตระเวน II"
 cruiser_ship_engine_2_desc: "กังหันไอนํ้าที่ติดตั้งเฟองทดมีประสิทธิภาพสูงกวามาก ทําใหนํานํ้าหนักสวนเกินไปใชเพิ่มกําลังได"
 cruiser_ship_engine_3: "เครื่องยนต 80,000 แรงมาเพลา"
 cruiser_ship_engine_3_short: "เครื่องยนตเรือลาดตระเวน III"
 cruiser_ship_engine_3_desc: "การจัดวางหมอไอนํ้าที่ปรับปรุงแลวใหแรงดันไอนํ้าสูงขึ้นเพื่อกําลังที่มากขึ้น"
 cruiser_ship_engine_4: "เครื่องยนต 90,000 แรงมาเพลา"
 cruiser_ship_engine_4_short: "เครื่องยนตเรือลาดตระเวน IV"
 cruiser_ship_engine_4_desc: "วัสดุขั้นสูงทําใหเครื่องยนตนี้เดินเครื่องภายใตภาระสูงไดนานขึ้นมาก"
 heavy_ship_engine_1: "เครื่องยนต 30,000 แรงมาเพลา"
 heavy_ship_engine_1_short: "เครื่องยนตเรือหนัก I"
 heavy_ship_engine_1_desc: "เครื่องยนตนี้มุงเพื่อประหยัดนํ้าหนักไวสําหรับปนและเกราะ จึงไมเคยถูกออกแบบมาใหทําความเร็วไดสูงเปนพิเศษ"
 heavy_ship_engine_2: "เครื่องยนต 90,000 แรงมาเพลา"
 heavy_ship_engine_2_short: "เครื่องยนตเรือหนัก II"
 heavy_ship_engine_2_desc: "ทรงพลังกวาแบบกอน ๆ อยางมาก เครื่องยนตนี้มุงใหเรือหนักมีความเร็วเหนือกวารุนเกาอยางสบาย"
 heavy_ship_engine_3: "เครื่องยนต 150,000 แรงมาเพลา"
 heavy_ship_engine_3_short: "เครื่องยนตเรือหนัก III"
 heavy_ship_engine_3_desc: "เมื่อปนและเกราะมีนํ้าหนักมากขึ้น เครื่องยนตนี้จึงถูกออกแบบใหทําความเร็วไดสูงขึ้น เพื่อไลลาขาศึกที่หลบหนีหรือรักษาระยะหางจากขาศึกที่เหนือกวา"
 heavy_ship_engine_4: "เครื่องยนต 210,000 แรงมาเพลา"
 heavy_ship_engine_4_short: "เครื่องยนตเรือหนัก IV"
 heavy_ship_engine_4_desc: "ออกแบบดวยวัสดุใหมและการออกแบบหมอไอนํ้าที่ปรับปรุงแลว ระบบขับเคลื่อนนี้มุงใหเรือประจัญบานสมัยใหมแลนทันเรือบรรทุกเครื่องบินและเรือลาดตระเวนที่รวดเร็วได"
 heavy_ship_nuclear_engine_1: "เครื่องปฏิกรณนิวเคลียรเรือหนัก"
 heavy_ship_nuclear_engine_1_short: "เครื่องปฏิกรณเรือหนัก"
 heavy_ship_nuclear_engine_1_desc: "เครื่องปฏิกรณนิวเคลียรอันทรงพลัง สามารถขับเคลื่อนเรือที่หนักที่สุดไดโดยไมตองเติมเชื้อเพลิง"
 carrier_ship_engine_1: "เครื่องยนต 50,000 แรงมาเพลา"
 carrier_ship_engine_1_short: "เครื่องยนตเรือบรรทุกเครื่องบิน I"
 carrier_ship_engine_1_desc: "ชุดเครื่องยนตพื้นฐานที่ชวยใหเรือบรรทุกเครื่องบินขนาดกลางทําความเร็วไดถึงระดับที่จําเปนตอการปฏิบัติการอากาศยานอยางปลอดภัย"
 carrier_ship_engine_2: "เครื่องยนต 120,000 แรงมาเพลา"
 carrier_ship_engine_2_short: "เครื่องยนตเรือบรรทุกเครื่องบิน II"
 carrier_ship_engine_2_desc: "ระบบขับเคลื่อนใหมนี้ออกแบบใหเรือบรรทุกเครื่องบินแลนไดเร็วกวาเรือลาดตระเวนรุนเกาสวนใหญและเรือพิฆาตบางลํา ทําใหหลบหลีกกองกําลังผิวนํ้าของขาศึกได"
 carrier_ship_engine_3: "เครื่องยนต 150,000 แรงมาเพลา"
 carrier_ship_engine_3_short: "เครื่องยนตเรือบรรทุกเครื่องบิน III"
 carrier_ship_engine_3_desc: "เครื่องยนตที่ออกแบบใหแมแตเรือบรรทุกเครื่องบินขนาดใหญก็เคลื่อนที่ไดดวยความเร็วสูงมาก"
 carrier_ship_engine_4: "เครื่องยนต 210,000 แรงมาเพลา"
 carrier_ship_engine_4_short: "เครื่องยนตเรือบรรทุกเครื่องบิน IV"
 carrier_ship_engine_4_desc: "ระบบขับเคลื่อนนี้ออกแบบมาเพื่อติดตั้งบน 'เรือบรรทุกเครื่องบินเร็ว' สมัยใหม ซึ่งมุงใหเปนศูนยกลางของกลุมเรือบรรทุกเครื่องบิน"
 carrier_ship_nuclear_engine_1: "เครื่องปฏิกรณนิวเคลียรเรือบรรทุกเครื่องบิน"
 carrier_ship_nuclear_engine_1_short: "เครื่องปฏิกรณเรือบรรทุกเครื่องบิน"
 carrier_ship_nuclear_engine_1_desc: "เครื่องปฏิกรณนิวเคลียรอันทรงพลัง สามารถขับเคลื่อนเรือบรรทุกเครื่องบินขนาดมหึมาไดโดยไมตองเติมเชื้อเพลิง"
 ship_armor_bb_1: "สายเกราะ 200 มม./ดาดฟา 40 มม."
 ship_armor_bb_1_short: "เกราะเรือประจัญบาน I"
 ship_armor_bb_1_desc: "รูปแบบเกราะนี้ออกแบบมาเพื่อปกปองเรือจากปนขนาดลํากลองเดียวกับตนเอง ทําใหมั่นใจวาทุกสวนของเรือไดรับการปกปองอยางดีตามความสําคัญ"
 ship_armor_bc_1: "สายเกราะ 150 มม./ดาดฟา 25 มม."
 ship_armor_bc_1_short: "เกราะเรือลาดตระเวนประจัญบาน I"
 ship_armor_bc_1_desc: "รูปแบบเกราะนี้ออกแบบมาเพื่อปกปองเรือจากปนขนาดเล็กกวา มีนํ้าหนักเบากวามากเพื่อใหทําความเร็วไดสูงขึ้น"
 ship_armor_bb_2: "สายเกราะ 350 มม./ดาดฟา 150 มม."
 ship_armor_bb_2_short: "เกราะเรือประจัญบาน II"
 ship_armor_bb_2_desc: "รูปแบบเกราะนี้มีสายเกราะแบบเอียง ออกแบบมาเพื่อปกปองเรือรบแนวหนาจากปนขนาดลํากลองเดียวกับตนเอง"
 ship_armor_bc_2: "สายเกราะ 305 มม./ดาดฟา 100 มม."
 ship_armor_bc_2_short: "เกราะเรือลาดตระเวนประจัญบาน II"
 ship_armor_bc_2_desc: "รูปแบบเกราะนี้เปนการประนีประนอมระหวางความเร็วกับการปองกัน ออกแบบมาเพื่อปองกันเรือจากปนของเรือลาดตระเวนและเรือพิฆาต"
 ship_armor_bb_3: "สายเกราะ 380 มม./ดาดฟา 155 มม."
 ship_armor_bb_3_short: "เกราะเรือประจัญบาน III"
 ship_armor_bb_3_desc: "แบบเกราะนี้แตกตางจากรูปแบบเกราะกอนหนาอยางสิ้นเชิง โดยสรางปอมกลางลําที่หุมเกราะหนาไวกลางเรือ แตยอมสละการปองกันสวนอื่น ๆ ของเรือ มุงปองกันเรือจากปนขนาดลํากลองเดียวกับตนเอง"
 ship_armor_bc_3: "สายเกราะ 330 มม./ดาดฟา 130 มม."
 ship_armor_bc_3_short: "เกราะเรือลาดตระเวนประจัญบาน III"
 ship_armor_bc_3_desc: "รูปแบบเกราะนี้ออกแบบโดยคํานึงถึงขอจํากัดดานนํ้าหนัก พยายามเพิ่มการปองกันสวนสําคัญของเรือใหมากที่สุดโดยปลอยสวนอื่นใหเปดโลง รูปแบบนี้ไมไดมีไวเพื่อทนทานตออาวุธระดับเรือประจัญบานไดนาน"
 ship_armor_shbb: "สายเกราะ 450 มม./ดาดฟา 210 มม."
 ship_armor_shbb_short: "เกราะหนักพิเศษ"
 ship_armor_shbb_desc: "ที่สุดแหงการออกแบบเกราะ รูปแบบเกราะนี้มุงตานทานกระสุนปนใหญหลักทุกชนิดที่รูจัก ทําใหเรือที่ติดตั้งสามารถตอสูและจมเรือประจัญบานลําใดก็ไดในโลกปจจุบัน"
 ship_armor_cruiser_1: "สายเกราะ 50 มม./ดาดฟา 40 มม."
 ship_armor_cruiser_1_short: "เกราะเรือลาดตระเวน I"
 ship_armor_cruiser_1_desc: "รูปแบบเกราะที่มุงใหเรือลาดตระเวนไดเปรียบเล็กนอยเมื่อตอสูกับเรือพิฆาตและเรือที่มีอาวุธเบาอื่น ๆ"
 ship_armor_cruiser_2: "สายเกราะ 100 มม./ดาดฟา 30 มม."
 ship_armor_cruiser_2_short: "เกราะเรือลาดตระเวน II"
 ship_armor_cruiser_2_desc: "สายเกราะที่หนักขึ้น มุงใหเรือลาดตระเวนตอสูกับเรือลาดตระเวนเบารุนเกาและเรือขนาดเล็กกวาไดดวยการปองกันที่ดีพอสมควร"
 ship_armor_cruiser_3: "สายเกราะ 120 มม./ดาดฟา 50 มม."
 ship_armor_cruiser_3_short: "เกราะเรือลาดตระเวน III"
 ship_armor_cruiser_3_desc: "รูปแบบเกราะนี้เลียนแบบวิธีที่ใชหุมเกราะเรือประจัญบาน ออกแบบมาเพื่อใหทันกับพัฒนาการดานอาวุธทั่วโลก"
 ship_armor_cruiser_4: "สายเกราะ 150 มม./ดาดฟา 60 มม."
 ship_armor_cruiser_4_short: "เกราะเรือลาดตระเวน IV"
 ship_armor_cruiser_4_desc: "รูปแบบเกราะนี้พยายามเพิ่มการปองกันใหมากที่สุดในสวนที่จําเปนอยางยิ่งตอการรักษาใหเรือลอยลําและยังรบตอได โดยแลกกับสวนอื่นทั้งหมด"
 ship_armor_carrier_deck: "ดาดฟา 90 มม."
 ship_armor_carrier_deck_short: "เกราะดาดฟาบิน"
 ship_armor_carrier_deck_desc: "แผนเกราะหนาชวยปกปองพื้นที่โรงเก็บเครื่องบินจากการโจมตีของเครื่องบินทิ้งระเบิดขาศึก แลกกับพื้นที่ทํางานที่ลดลง"
 ship_armor_ice_carrier_deck_1: "การเสริมความแข็งแรงทางวิ่งไพเครต"
 ship_armor_ice_carrier_deck_1_desc: "การเสริมโครงสรางเพิ่มเติม ทําใหสิ่งกอสรางแข็งแรงและทนทานยิ่งขึ้น พรอมทั้งตานทานสภาพอากาศไดดีขึ้น"
 ship_armor_ice_carrier_deck_2: "ทางวิ่งไพเครตเสริมเหล็กกลา"
 ship_armor_ice_carrier_deck_2_desc: "ไพเครตเสริมเหล็กกลาใหโครงสรางที่แข็งแรงกวา ทนความเสียหายไดมากขึ้น พรอมทั้งเปนฉนวนไดดียิ่งขึ้น"
 ship_armor_ice_carrier_deck_3: "ทางวิ่งวัสดุผสมนํ้าแข็ง"
 ship_armor_ice_carrier_deck_3_desc: "วัสดุและวิธีการที่ใชใหความทนทานของโครงสรางดีที่สุด และลดผลกระทบของสภาพอากาศตอการปฏิบัติการของเรือ"
