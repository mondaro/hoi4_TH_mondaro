 HINT_NATIONAL_FOCUS_TEXT: "นี่คือหนาจอ§Yแผนยุทธศาสตร§! ซึ่งชวยใหประเทศของคุณเลือกเปาหมายทางการเมือง อันจะนําไปสูผลหรือโบนัสที่ชวยใหเกมดําเนินไปขางหนา\n\nเราไดไฮไลตแผนยุทธศาสตรสองสามแผนที่แนะนําใหคุณเริ่มตนไวเพื่อความสะดวก เหตุผลที่แนะนําเสนทางนี้เพราะจะชวยใหคุณไดรับ§Yชองวิจัย§!เพิ่มอีกหนึ่งชองโดยเร็วที่สุด ซึ่งจะทําใหคุณวิจัย £tech_mod  §Yเทคโนโลยี§!ไดพรอมกันเพิ่มขึ้นอีกหนึ่งรายการ"
