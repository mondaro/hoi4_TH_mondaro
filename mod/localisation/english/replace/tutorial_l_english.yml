 HINT_AIR_BASE: "เคล็ดลับ: ฐานทัพอากาศ"
 HINT_AIR_BASE_TEXT: "โลกถูกแบงออกเปน§Yภูมิภาคทางอากาศ§!ที่กําหนดไวลวงหนา §Yกองบิน§!คือกลุมอากาศยานประเภทเดียวกัน (เชน เครื่องบินขับไลหรือเครื่องบินทิ้งระเบิด) และสามารถมอบหมายใหประจําภูมิภาคได\n\nเมื่อคุณคลิก§Yฐานทัพอากาศ§!บนแผนที่ ระบบจะเปดฐานทัพอากาศนั้นและเลือกกองบินทั้งหมดในฐานโดยอัตโนมัติ\n\nหากตองการมอบหมายกองบินที่เลือกใหประจําภูมิภาค หรือยายไปยังฐานทัพอากาศอื่น ให§Gคลิกขวา§!ที่ภูมิภาคทางอากาศหรือฐานทัพอากาศนั้น\n\nคุณยังสามารถผูกกองบินเขากับกองทัพได โดยเลือกกองบินแลว§Gคลิกขวา§!ที่กองทัพดานลางของหนาจอ"
 HINT_CONSTRUCTIONS: "เคล็ดลับ: การกอสราง"
 HINT_CONSTRUCTIONS_TEXT: "นี่คือหนาจอ§Yการกอสราง§! ซึ่งใชพัฒนารัฐและจังหวัดของคุณดวยการกอสรางสิ่งปลูกสราง ในชวงตนเกม แนะนําใหสราง £GFX_civ_factory §Yโรงงานพลเรือน§!สักสองสามปกอนเริ่มสราง £GFX_mil_factory §Yโรงงานทหาร§!หรือสิ่งปลูกสรางเฉพาะทางอื่น ๆ การสรางโรงงานพลเรือนจะชวยใหคุณกอสรางสิ่งปลูกสรางไดมากขึ้นในระยะยาว\n\nโรงงานพลเรือนที่วางทั้งหมดจะกอสรางสิ่งปลูกสรางใหมตามลําดับในคิวการกอสราง ยิ่ง £GFX_infrastructure_texticon §G80%§! §Yโครงสรางพื้นฐานของรัฐ§!สูงเทาไร การกอสรางก็จะยิ่งเร็วขึ้น\n\nโรงงานพลเรือนถูกไฮไลตไวเพื่อความสะดวกของคุณ §Yคลิกเพื่อเปดโหมดการสราง§! เมื่อโหมดการสรางเปดอยู ใหคลิกบนแผนที่เพื่อเพิ่มการกอสรางสิ่งปลูกสรางลงในคิว §Yกด Shift คางไวแลวคลิกเพื่อเพิ่มลงคิวในจํานวนสูงสุด§!"

 HINT_ARMY_PLANNER: "เคล็ดลับ: การเกณฑและประจําการ"
 HINT_ARMY_PLANNER_TEXT_1_1: "นี่คือหนาจอ§Yการเกณฑและประจําการ§! ซึ่งเปนที่ที่คุณเพิ่มกองพลใหมลงในคิวเพื่อฝกและนําไปประจําการในภายหลัง เราแนะนําใหคุณเพิ่มกองพล§YDivisione di Fanteria§!ลงในคิว\n\nกองพลที่อยูระหวางการฝกจะพยายามรวบรวม§Yยุทโธปกรณ§!ที่ตองการกอน เมื่อไดยุทโธปกรณแลวจึงจะเริ่มการฝก ความคืบหนาการฝกจะไมมีวันเกินความคืบหนาของยุทโธปกรณ\n\nคลิกปุม§Yฝก§!เพื่อเพิ่มกองพลเขารับการฝก"
 HINT_ARMY_PLANNER_TEXT_1_2: "เมื่อกองพลฝกเสร็จสิ้นแลว จะสามารถ§Yนําไปประจําการ§!ยัง§Yตําแหนงที่คุณเลือก§!ได คุณสามารถนํากองพลไปประจําการไดเฉพาะในดินแดนหลักของคุณเทานั้น"
 HINT_ARMY_PLANNER_TEXT_2: "กองพลสามารถผลิตแบบตอเนื่องและ/หรือแบบคูขนานได\n\nกองพลที่ฝกแบบคูขนานจะไดรับ§Yยุทโธปกรณ§!ในอัตราเดียวกัน จึงเสร็จสิ้นในเวลาใกลเคียงกัน เมื่อกองพลมียุทโธปกรณครบตามที่ตองการและฝกเสร็จสมบูรณแลว ก็จะถูกนําไปประจําการยังตําแหนงที่คุณเลือกไว\n\nคลิก§Yเพิ่มหนวย§!เพื่อเพิ่มกองพลอีกกองพลสําหรับการฝกแบบคูขนาน\n\nหากกระแสสงครามพลิกกลับมาเปนผลรายตอคุณ การนํากองพลไปประจําการ§Yกอนที่จะไดรับยุทโธปกรณและการฝกครบถวน§!ก็อาจเปนทางเลือกที่ใชได แตควรหลีกเลี่ยงหากทําได\n\nคุณสามารถอานเพิ่มเติมวาควรเกณฑหนวยใดไดที่ HOI4 Wiki!"
 HINT_DIPLOMACY_SCREEN: "เคล็ดลับ: การทูต"
 HINT_DIPLOMACY_TEXT: "นี่คือหนาจอ§Yการทูต§! ซึ่งคุณจะเห็นภาพรวมของทัศนคติที่ประเทศอื่นมีตอคุณ และดูวาประเทศเหลานั้นไดรับการรับประกันเอกราชจากประเทศอื่นหรือไม\n\nการตรวจสอบวาเปาหมายที่คุณหมายตามีพันธมิตรที่สามารถเรียกใหมาชวยไดหรือไมเปนสิ่งที่ดี\n\nคุณยังสามารถ§Gคลิกขวา§!ที่ประเทศใดก็ไดเพื่อดูการดําเนินการทางการทูตที่ใชได"
 HINT_DIVISION_DESIGNER: "เคล็ดลับ: ผูออกแบบกองพล"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "นี่คือ§Yผูออกแบบกองพล§! ซึ่งใชสรางหรือแกไข§Yแมแบบกองพล§! การแกไขหรือสรางแมแบบกองพลใหมจะใช £army_experience  §Yประสบการณกองทัพบก§! ประสบการณกองทัพบกจะไดรับเมื่อหนวยของคุณเขารวมการรบหรือฝกซอมทางทหาร หนวยที่มีประสบการณระดับ 1 - §Yมือใหม§! จะไมสราง £army_experience  ประสบการณกองทัพบก\n\nคุณตองมี £army_experience ประสบการณกองทัพบกมากกวานี้กอนจึงจะสรางหรือแกไขแมแบบกองพลได"
 HINT_DIVISION_DESIGNER_XP_TEXT: "นี่คือ§Yผูออกแบบกองพล§! ซึ่งใชสรางหรือแกไข§Yแมแบบกองพล§! การแกไขหรือสรางแมแบบกองพลใหมจะใช £army_experience  §Yประสบการณกองทัพบก§! ประสบการณกองทัพบกจะไดรับเมื่อหนวยของคุณเขารวมการรบหรือฝกซอมทางทหาร หนวยที่มีประสบการณระดับ 1 - §Yมือใหม§! จะไมสราง £army_experience  ประสบการณกองทัพบก\n\nสําหรับการแกไขแมแบบครั้งแรก เราแนะนําใหคลิกชองวางใตคอลัมนสนับสนุนเพื่อเพิ่ม £unit_artillery_icon_small §Yปนใหญสนับสนุน§! ใหกองพลของคุณ เมื่อเพิ่มแลว ใหคลิก§Yบันทึก§! กองพลที่ใชแมแบบนี้จะเริ่มตองการ§Yยุทโธปกรณ§!ปนใหญ"
 HINT_EDIT_TEMPLATE_TEXT: "คุณกําลังผลิตยุทโธปกรณที่ไมมี§Yแมแบบกองพล§!ใดใชงาน แตคุณก็มี £army_experience §Yประสบการณกองทัพบก§!ที่จะใชแกไขเรื่องนี้ได\n\nคลิก§Yแกไข§!ขาง§YDivisione di Fanteria§! หรือกองพลอื่นใดก็ไดตามที่คุณเลือก"
 HINT_EXECUTE_ORDER_TEXT: "ใตภาพบุคคลจะมีแถบความคืบหนาเล็ก ๆ (3) ที่แสดงกําลังเปรียบเทียบระหวางกองทัพของคุณกับกองกําลังขาศึกที่อาจเผชิญ\n\n หากคุณยังไมไดแตงตั้งผูบัญชาการใหกองทัพ ก็ควรทําตอนนี้ คลิกชองภาพบุคคลที่วางอยูที่มุมซายบน\n\nหากทุกอยางดูเปนใจใหคุณ ไฟประเมินแผน (2) ควรเปนสีเขียว ถาเปนเชนนั้น ใหคลิกปุมดําเนินแผน (1)"
 HINT_NAVAL_MISSIONS: "เคล็ดลับ: ภารกิจทางเรือ"
 HINT_NAVAL_MISSIONS_TEXT: "นี่คือหนาตาง§Yกองเรือ§! ซึ่งคุณสามารถดูและออกคําสั่งใหกองเรือที่เลือกได คุณสามารถใหกองเรือทํางานบางอยางไดโดยสงไปปฏิบัติ§Yภารกิจทางเรือ§!\n\nโดยปกติกองเรือจะแบงออกเปน§Yหมูเรือเฉพาะกิจ§!หลายหมู กองเรือสามารถปฏิบัติการในหลายภูมิภาคพรอมกันได แตหมูเรือเฉพาะกิจมักทําไมได เมื่อกองเรือปฏิบัติภารกิจทางเรือ จะพยายามครอบคลุมทุกเขตที่ไดรับมอบหมาย แตอาจทําใหกระจายกําลังมากเกินไปจนตานทานกองกําลังศัตรูที่แข็งแกรงไมได \n\nหากตองการสงกองเรือไปปฏิบัติ§Yภารกิจทางเรือ§! ใหคลิกปุมภารกิจที่ถูกไฮไลตปุมใดปุมหนึ่ง แลว§Gคลิกขวา§!ที่§Yภูมิภาคทางทะเล§! การสั่งใหกองเรือ§Yลาดตระเวน§!ในภูมิภาคหนึ่งอาจเปนความคิดที่ดี"
 HINT_LOGISTICS: "เคล็ดลับ: การสงกําลังบํารุงและเสบียง"
 HINT_LOGISTICS_TEXT: "นี่คือหนาจอ§Yการสงกําลังบํารุง§! มีไวเพื่อชวยใหคุณเห็นวากําลังผลิตยุทโธปกรณเร็วกวาหรือชากวาที่ใชไป\n\nหากคุณผลิต§Yยุทโธปกรณ§!ประเภทหนึ่งมากเกินกวาที่คิดวาจําเปน ก็อาจเปนความคิดที่ดีที่จะลดจํานวนโรงงานที่ทํางานใน§Yสายการผลิต§!ที่ผลิตยุทโธปกรณประเภทนั้น\n\nการที่กองพลของคุณมี§Yเสบียง§!เพียงพอหรือไมเปนสวนสําคัญตอความสําเร็จในสนามรบ คุณสามารถตรวจสอบสถานะเสบียงไดโดยเปลี่ยนไปที่§Yโหมดแผนที่เสบียง§! £GFX_F4  ."
 HINT_LOGISTICS_TEXT_2: "เสบียงจะถูกแจกจายจาก £GFX_capital_hub_texticon §Yศูนยเสบียงเมืองหลวง§! และไหลผาน £GFX_train_texticon §Yรถไฟ§! หรือ £GFX_convoy_texticon §Yขบวนเรือลําเลียง§! ไปยัง £GFX_supply_hub_texticon §Yศูนยเสบียง§! หรือ £GFX_naval_supply_hub_texticon §Yฐานทัพเรือ§! ในจังหวัดตาง ๆ \n\nจากนั้นเสบียงจะถูกแจกจายใหกองพลที่ประจําการอยูภายในระยะของศูนย คุณสามารถดูระยะไดโดยเลือก £GFX_supply_hub_texticon §Yศูนยเสบียง§! แลวกด £GFX_shift. คางไว ระยะอาจไดรับผลจากการใชยานยนตซึ่งตองใช £GFX_unit_motorized_icon_small §Yรถบรรทุก§!\n\nประสิทธิภาพยังไดรับผลกระทบจากระดับของ £GFX_railways_texticon §Yทางรถไฟ§! และ £GFX_naval_supply_hub_texticon §Yฐานทัพเรือ§! การขาดแคลน £GFX_train_texticon §Yรถไฟ§! และการโจมตีทางอากาศของศัตรู ซึ่งทําใหเกิด§Rคอขวด§! ปญหาเหลานี้บรรเทาไดดวยการยกระดับทางรถไฟที่เชื่อมไปยังศูนยเสบียงเมืองหลวง จัดการปองกันภัยทางอากาศดวยเครื่องบินขับไล และตรวจสอบใหมีรถไฟเพียงพอ ความพรอมของเสบียงจะแสดงใน§Yโหมดแผนที่เสบียง§!  £GFX_F4  ."
