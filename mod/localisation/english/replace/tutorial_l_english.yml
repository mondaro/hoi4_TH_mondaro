 HINT_RESEARCH_TREE: "เคล็ดลับ: ผังการวิจัย"
 HINT_RESEARCH_TREE_TEXT: "นี่คือ§Yผังการวิจัย§! แมในตอนแรกอาจดูมากมายจนลนหลาม แตจริง ๆ แลวไมซับซอนนัก เราไดไฮไลตเทคโนโลยีบางรายการที่แนะนําใหวิจัยในชวงตนเกมไวแลว\n\nการวิจัยเทคโนโลยีที่เสริมฐานอุตสาหกรรมของประเทศ รวมถึงการพัฒนาทางทหารทั่วไป เปนความคิดที่ดี เมื่อเกมดําเนินไป การวิจัยเทคโนโลยีเฉพาะทางมากขึ้น เชน รถถังหรืออากาศยาน ก็อาจเปนทางเลือกที่เหมาะสม ทั้งหมดขึ้นอยูกับสิ่งที่คุณพยายามจะบรรลุ\n\nเทคโนโลยีจะใชเวลาวิจัยนานขึ้นหากคุณพยายามวิจัยลวงหนากอนเวลา มี§Yแผนยุทธศาสตร§!ที่สามารถลดโทษจากการวิจัยลวงหนาสําหรับเทคโนโลยีบางรายการได"
 HINT_RESEARCH_SCREEN: "เคล็ดลับ: การวิจัย"
 HINT_RESEARCH_SCREEN_TEXT: "นี่คือหนาจอ§Yการวิจัย§! คุณมีชองวิจัยจํานวนหนึ่ง แตละชองสามารถวิจัย £tech_mod  §Yเทคโนโลยี§!ไดหนึ่งรายการ คลิก§Yชองวิจัย§!ที่วางอยูเพื่อเลือกสิ่งที่จะวิจัย\n\nแตละประเทศมีจํานวนชองวิจัยแตกตางกัน โดยมหาอํานาจมักมีมากกวา สามารถปลดล็อกชองเพิ่มเติมไดผาน§Yแผนยุทธศาสตร§! ซึ่งจะอธิบายไวในการแจงเตือนและเคล็ดลับอื่น"
 HINT_DECISION_SCREEN: "เคล็ดลับ: เหตุการณและการตัดสินใจ"
 HINT_DECISION_SCREEN_TEXT: "§Yเหตุการณ§!จะเกิดขึ้นตลอดการเลน ในเกมมีเหตุการณมากมาย ซึ่งอาจสงผลในเชิงบวก เชิงลบ หรือผสมผสานตอประเทศของผูเลน เหตุการณจะปรากฏในรูปแบบการแจงเตือนแบบปอปอัปบนหนาจอของผูเลน ซึ่งอาจใหผูเลนเลือกทางเลือก หรืออาจเพียงแจงผลที่ตามมาและใหผูเลนรับทราบวาเหตุการณไดเกิดขึ้นแลว\n\n§Yการตัดสินใจ§!คือเปาหมายระยะยาวและ/หรือระยะสั้นที่คุณสามารถมุงไปใหถึง การตัดสินใจตองใช £pol_power §Yอํานาจทางการเมือง§! \n\nการตัดสินใจบางอยางมีกําหนดเวลา และตองทําเงื่อนไขบางประการใหสําเร็จภายในระยะเวลาที่กําหนด"
 HINT_INTELLIGENCEAGENCY_SCREEN: "เคล็ดลับ: หนวยขาวกรอง"
 HINT_INTELLIGENCEAGENCY_SCREEN_TEXT: "นี่คือหนาจอ§Yหนวยขาวกรอง§! จําเปนตองมี§Yหนวยขาวกรอง§!สําหรับการเกณฑสายลับ การรวบรวมขาวกรอง การสราง§Yเครือขาย§!สายลับ และการดําเนิน§Yปฏิบัติการ§!ลับ §Yวิทยาการรหัสลับ§!เปนอีกแงมุมหนึ่งของสงคราม และการถอดรหัสลับของศัตรูไดสามารถใหความไดเปรียบมหาศาลในสนามรบ\n\nยิ่งขาวกรองของคุณสูงเทาไร คุณก็ยิ่งรูเกี่ยวกับการวางกําลังทหาร ศักยภาพทางอุตสาหกรรม ทิศทางการวิจัย และอื่น ๆ ของศัตรูมากขึ้นเทานั้น\n\nคุณสามารถ§Gคลิกขวา§!ที่ประเทศเพื่อแสดง§Yบันทึกขาวกรอง§!ของประเทศนั้นในแท็บถัดจาก§Yการทูต§!"
 HINT_OFFICER_CORPS_SCREEN: "เคล็ดลับ: เหลานายทหาร"
 HINT_OFFICER_CORPS_SCREEN_TEXT_1: "นี่คือหนาจอ§Yเหลานายทหาร§! ซึ่งเปนที่ที่คุณแตงตั้ง§Yกองบัญชาการทหารสูงสุด§! §Yนักทฤษฎี§! รวมถึง§Yเสนาธิการทหารบก§! §Yทหารเรือ§! และ§Yทหารอากาศ§! \n\nกองบัญชาการทหารสูงสุดและเสนาธิการจะมอบ £army_experience  §Yประสบการณกองทัพบก§! £navy_experience  §Yประสบการณกองทัพเรือ§! £air_experience  §Yประสบการณกองทัพอากาศ§! รายวัน รวมถึงโบนัสตอคาสถานะเฉพาะที่แสดงไวใตแตละเหลาทัพ"
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "นักทฤษฎีจะลดตนทุนของ§Yหลักนิยม§!ภาคพื้นดิน ทางเรือ และทางอากาศ ซึ่งมุงเนนยุทธศาสตรโดยรวม หลักนิยมจะกําหนดแยกตามแตละเหลาทัพ และมอบโบนัสใหกองพล กองเรือ และกองบินที่ประจําการอยู"
 HINT_OCCUPIED_TERRITORIES_SCREEN: "เคล็ดลับ: ดินแดนที่ถูกยึดครอง"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "เพื่อปราบปรามการตอตานและรักษาความสงบในหมูประชาชน รัฐที่ถูกยึดครองจําเปนตองมีกองทหารประจําการเพื่อทําหนาที่ตํารวจ กองรักษาการณในเกมแสดงถึงสิ่งนี้ และสามารถกําหนดไดจากแท็บ§Yดินแดนที่ถูกยึดครอง§!ใน§Yหนาจอการเมือง§! ซึ่งเปดไดโดยคลิกธงประเทศของคุณที่มุมซายบน\n\nกองพลที่จําเปนตอการประจํากองรักษาการณจะไมปรากฏบนแผนที่ และจะไดรับการจัดสรรรวมถึงไดรับยุทโธปกรณโดยอัตโนมัติ การจัดสรรยุทโธปกรณสามารถตั้งคาไดผานแท็บ§Yการเกณฑและประจําการ§!"
 HINT_SELECT_UNIT_TEXT: "ถึงเวลาทําสงครามกับ§Yเอธิโอเปย§!แลว คุณควรเริ่มดวยการออกคําสั่งใหหนวยของคุณโดยสรางแผนการรบพรอมคําสั่งรุก\n\n§Yเลือกกองพลที่ถูกไฮไลต§!ในรัฐ§Yเอริเทรีย§!"
 HINT_TRADE_SCREEN: "เคล็ดลับ: การคา"
 HINT_TRADE_SCREEN_TEXT: "นี่คือหนาจอ§Yการคา§! ซึ่งชวยใหคุณแลกเปลี่ยน £GFX_civ_factory §Yโรงงานพลเรือน§!ของคุณกับทรัพยากรได\n\n§Yการแจงเตือนทรัพยากรไมเพียงพอ§!จะแสดงขึ้นเมื่อใดก็ตามที่สายการผลิตของคุณขาดทรัพยากรที่ตองใช สายการผลิตจะยังคงผลิตยุทโธปกรณตอไป แตดวยความเร็วที่ลดลง การคาจึงเปนทางเลือกที่ใชแกปญหานี้ได\n\nโปรดทราบวาเมื่อคุณนําโรงงานพลเรือนไปแลกกับทรัพยากร โรงงานเหลานั้นจะไมสามารถใชกอสรางสิ่งปลูกสรางได"
 HINT_WAR_SCREEN: "เคล็ดลับ: สงคราม"
 HINT_WAR_SCREEN_TEXT: "นี่คือหนาจอ§Yสงคราม§! ซึ่งจะแสดงใหคุณเห็นวาสงครามดําเนินไปอยางไร\n\nอิตาลีเริ่มเกมดวยการทําสงครามกับเอธิโอเปย แตคุณยังไมตองกังวลเรื่องนั้นในตอนนี้ ใหดําเนินการตอโดยดูการแจงเตือนอื่น ๆ"
 HINT_WORLD_TENSION: "เคล็ดลับ: ความตึงเครียดของโลก"
 HINT_WORLD_TENSION_TEXT: "นี่คือหนาจอ £world_tension_icon  §Yความตึงเครียดของโลก§! เหตุการณทั้งหมดที่สงผลตอความตึงเครียดของโลกไมทางใดก็ทางหนึ่งจะแสดงอยูในรายการนี้\n\nความตึงเครียดของโลกเปนมาตรวัดวาสถานการณในเกมรอนระอุเพียงใด บางประเทศอาจมี§Yการดําเนินการทางการทูต§!บางอยางที่ถูกล็อกไวจนกวาความตึงเครียดของโลกจะสูงพอ\n\nโดยทั่วไปแลว ฝายอักษะตองการใหความตึงเครียดของโลกอยูในระดับตํ่าเพื่อปองกันไมใหประเทศประชาธิปไตยเขาแทรกแซง ขณะที่ประเทศประชาธิปไตยตองการใหความตึงเครียดของโลกสูงเพื่อที่จะเขาแทรกแซงได\n\nการประกาศสงคราม การสรางขออางอางสิทธิ์ การผนวกดินแดน และการดําเนิน§Yแผนยุทธศาสตร§!บางอยางใหสําเร็จ ลวนเปนตัวอยางของการกระทําที่อาจเพิ่มความตึงเครียดของโลก\n\nยิ่งความตึงเครียดของโลกสูงเทาไร ก็ยิ่งใกลสงครามโลกมากขึ้นเทานั้น"
 HINT_WORLD_TENSION_TEXT_2: "£world_tension_icon  §Yความตึงเครียดของโลก§! เปนมาตรวัดวาสถานการณในเกมรอนระอุเพียงใด บางประเทศอาจมี§Yการดําเนินการทางการทูต§!บางอยางที่ถูกล็อกไวจนกวาความตึงเครียดของโลกจะสูงพอ\n\nโดยทั่วไปแลว มหาอํานาจฟาสซิสตและคอมมิวนิสตตองการใหความตึงเครียดของโลกอยูในระดับตํ่าเพื่อปองกันไมใหประเทศประชาธิปไตยเขาแทรกแซง ขณะที่ประเทศประชาธิปไตยตองการใหความตึงเครียดของโลกสูงเพื่อที่จะเขาแทรกแซงได\n\nการประกาศสงคราม การสรางขออางอางสิทธิ์ การผนวกดินแดน และการดําเนิน§Yแผนยุทธศาสตร§!บางอยางใหสําเร็จ ลวนเปนตัวอยางของการกระทําที่อาจเพิ่มความตึงเครียดของโลก\n\nยิ่งความตึงเครียดของโลกสูงเทาไร ก็ยิ่งใกลสงครามโลกมากขึ้นเทานั้น"
 HINT_LOW_SUPPLY: "คําแนะนํา: เสบียง"
 HINT_LOW_SUPPLY_TEXT_1: "เพื่อใหกองพลของคุณพรอมรบอยูเสมอ คุณจําเปนตองมีเสบียง เสบียงจะถูกกระจายออกจาก £GFX_capital_hub_texticon §Yศูนยเสบียงเมืองหลวง§! และสงตอผาน £GFX_train_texticon §Yรถไฟ§! หรือ £GFX_convoy_texticon §Yขบวนเรือลําเลียง§! ไปยัง £GFX_supply_hub_texticon §Yศูนยเสบียง§! หรือ £GFX_naval_supply_hub_texticon §Yฐานทัพเรือ§! ในจังหวัดตาง ๆ \n\nจากนั้นเสบียงจะถูกกระจายไปยังกองพลที่ประจําการอยูในระยะของศูนย คุณสามารถดูระยะไดโดยเลือก £GFX_supply_hub_texticon §Yศูนยเสบียง§! แลวกด £GFX_shift คางไว §Yลําดับความสําคัญการใชยานยนต§! สามารถเพิ่มระยะของศูนย ซึ่งจะเพิ่มระยะที่กองพลของคุณไดรับเสบียง โดยจะใช £GFX_unit_motorized_icon_small §Yรถบรรทุก§!"
 HINT_LOW_SUPPLY_TEXT_2: "คุณสามารถเปลี่ยน §Yลําดับความสําคัญการใชยานยนต§! ของกองทัพไดโดยเลือกกองทัพนั้นแลววนเลือกระหวางสามระดับที่มุมซายบน โดยคาเริ่มตนจะตั้งไวที่ระดับตํ่า ซึ่งจะไมใช £GFX_unit_motorized_icon_small §Yรถบรรทุก§! \n\nปริมาณเสบียงที่มีจะแสดงใน §Yโหมดแผนที่เสบียง§!  £GFX_F4  หากตองการกลับไปยัง §Yโหมดแผนที่เริ่มตน§! ใหคลิกที่ £GFX_F1"
