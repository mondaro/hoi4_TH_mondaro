 HINT_NO_TEMPLATE_NO_XP_TEXT: "คุณไดคลิก§Yการแจงเตือนไมมีแมแบบ§! ไมตองกังวล! เปนเรื่องดีมากที่คุณคอยดูการแจงเตือนเพื่อหาคําตอบ เพราะการแจงเตือนมีไวเพื่อชวยคุณ\n\nเปนไปไดมากวาคุณไดสรางสายการผลิตที่ผลิตยุทโธปกรณปนใหญ ในขณะนี้ไมมี§Yกองพล§!ใดของคุณที่ใชยุทโธปกรณนั้นใน§Yแมแบบกองพล§!ของตน\n\nเมื่อคุณไดรับ £army_experience  §Yประสบการณกองทัพบก§!มากขึ้น คุณสามารถแกไขแมแบบกองพลใหมีปนใหญได £army_experience  ประสบการณกองทัพบกจะไดรับเมื่อกองพลของคุณเขารวมการรบหรือฝกซอมทางทหาร\n\nตอนนี้คุณสามารถเพิกเฉยตอการแจงเตือนนี้ไปกอนได เพราะบทเรียนนี้จะชวยคุณเมื่อคุณไดรับ £army_experience  ประสบการณกองทัพบกมากขึ้น"
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "คุณไดคลิก§Yการแจงเตือนไมมีแมแบบ§! ซึ่งแสดงใหเห็นวาคุณกําลังผลิตยุทโธปกรณที่ยังไมไดใชงานอยูในขณะนี้\n\nหากตองการใหกองพลเริ่มใชยุทโธปกรณประเภทใหม คุณตองแกไข§Yแมแบบกองพล§!ของกองพลนั้น การแกไขแมแบบกองพลจะใช £army_experience  §Yประสบการณกองทัพบก§!\n\nไปที่หนาจอ§Yการเกณฑและประจําการ§! แลวเลือกแมแบบกองพลที่จะ§Yแกไข§!\n\nเมื่อวางเมาสเหนือการแจงเตือนนี้เพื่อดูคําอธิบาย คุณจะเห็นวากําลังผลิตยุทโธปกรณประเภทใดที่ยังไมไดใชงานอยูในขณะนี้"
 HINT_POLITICS_SCREEN: "เคล็ดลับ: การเมือง"
 HINT_POLITICS_SCREEN_TEXT: "นี่คือ§Yหนาจอการเมือง§! ซึ่งคุณสามารถเขาถึงสิ่งตาง ๆ เชน §Yแผนยุทธศาสตร§! £pol_idea §Yแนวคิด§! §Yกฎหมาย§! และอื่น ๆ ของประเทศคุณ\n\n£pol_power §Yอํานาจทางการเมือง§! แสดงถึงความสามารถของประเทศในการบรรลุเปาหมายทางการเมือง\nการแตงตั้งที่ปรึกษา การสรางขออางอางสิทธิ์ หรือการรับประกันเอกราช ลวนเปนตัวอยางของการกระทําที่ตองใช £pol_power อํานาจทางการเมือง\n\n£pol_idea แนวคิดจะมอบโบนัสในดานตาง ๆ ใหประเทศของคุณ แตก็ตองใช £pol_power อํานาจทางการเมืองในการเปดใชงานเชนกัน"
 HINT_PRODUCTION_LINES: "เคล็ดลับ: สายการผลิต"
 HINT_PRODUCTION_LINES_TEXT_1: "นี่คือหนาจอ§Yสายการผลิต§! สายการผลิตจะผลิตยุทโธปกรณที่จําเปนตอการทําสงครามของคุณ แนะนําใหผลิตทั้งยุทโธปกรณที่ตองใชในตอนนี้และที่อาจตองใชในอนาคต\n\nสายการผลิตมีสองประเภท ไดแก ทางทหารและทางเรือ ประเภทแรกใช £factory_item  §Yโรงงานทหาร§! สวนประเภทหลังใช £naval_factory_icon  §Yอูตอเรือ§! ยิ่งมอบหมายโรงงานใหสายการผลิตมากเทาไร ก็จะยิ่งผลิตยุทโธปกรณที่คุณตองการไดเร็วขึ้นเทานั้น\n\nสามารถสรางสายการผลิตไดโดยคลิกปุมใดปุมหนึ่งในสี่ปุมที่ถูกไฮไลต"
 HINT_PRODUCTION_LINES_TEXT_2: "เมื่อคุณเลือกประเภทยุทโธปกรณแลว ระบบจะสรางสายการผลิตสําหรับยุทโธปกรณประเภทนั้น\n\nอาน§Yหนาถัดไป§!ของเคล็ดลับนี้เพื่อ§Yดูคําแนะนํา§!วาควรผลิตอะไรและควรมอบหมายโรงงานใหแตละสายการผลิตกี่แหง"
