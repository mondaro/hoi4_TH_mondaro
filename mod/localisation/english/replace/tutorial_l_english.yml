 tut_1_text_1: "ยินดีตอนรับสูบทเรียนของ §YHearts of Iron IV§!\n\nคุณจะไดรับหนาที่ควบคุมอิตาลี @ITA ในชวงเวลากอนที่สงครามจะปะทุ การอานคําอธิบายจะชวยใหคุณเขาใจสิ่งตาง ๆ ระหวางเลน ดังนั้นจึงแนะนําใหใชประโยชนจากคําอธิบายเหลานั้นใหเต็มที่"
 tut_1_text_alert: "เริ่มตนดวยการ§Yจัดการกับการแจงเตือน§!ที่ดานบนของหนาจอ"
 tut_2_text_1: "ดีมาก! เมื่อจัดการการแจงเตือนเรียบรอยแลว คุณก็สามารถเริ่มเจาะลึกรายละเอียดของการทําสงครามได อิตาลีเริ่มเกมดวยการทําสงครามกับเอธิโอเปย และคุณไมนาจะลําบากนักในการเอาชนะสงครามนั้นเมื่อไดเรียนรูวิธีการแลว\n\nเลื่อนกลองไปทางตะวันออกเฉียงใตจนกวาจะพบเอริเทรียในทวีปแอฟริกา เมื่อตําแหนงกลองเปลี่ยนแลว ให§Yเลือกกองพล§!ในรัฐ $STATE|Y$ โดยกด§Gคลิกซาย§!คางไวแลวลากเพื่อเลือก"
 tut_3_text_1: "ยอดเยี่ยม! ตอไปคุณจะไดเรียนรูวิธีเริ่มวางแผนการรุก\n\nกองพลสามารถรวมกันเปน§Yกองทัพ§!ได กองทัพใชสําหรับวาดแผนการรบ และสามารถแตงตั้ง§Yผูบัญชาการ§!ใหนําทัพได"
 tut_3_text_2: "ขณะที่เลือกกองพลอยู ใหคลิกปุม§Yกองทัพใหม§!ที่ดานลางของหนาจอ จากนั้นทําขั้นตอนเดียวกันกับกองพลทางใตใน§Yโซมาลิแลนด§!"
 tut_4_text_1: "ดีมาก! การสรางกองทัพคือขั้นตอนแรก\n\nคุณสามารถสั่งการ§Yกองทัพ§!ไดดวยการวาด§Yแผนการรบ§! \n\nคลิกปุม§Yแนวหนา§! แลวคลิกที่พรมแดนติดกับเอธิโอเปย วางเมาสเหนือปุม§Yแนวหนา§!เพื่อดูขอมูลเพิ่มเติมเกี่ยวกับวิธีวาดแนวหนา หากตองการลบแนวหนา ใหคลิก§Yลบคําสั่ง§!"
 tut_5_text_1: "ดีมาก! ตอนนี้มี§Yแนวหนา§!หันไปทางเอธิโอเปยแลว เพื่อใหกองทหารของคุณเขาโจมตีดวย§Yแผนการรบ§! คุณตองวาด§Yคําสั่งรุก§!กอนดวย\n\nคลิกปุม§Yแนวรุก§! จากนั้นกด§Gคลิกขวา§!คางไวแลวลากระหวางจังหวัดสองแหงที่ถูกไฮไลต แลวทําขั้นตอนเดียวกันกับกองพลทางใตใน§Yโซมาลิแลนด§!"
 tut_6_text_1: "ตอนนี้คุณไดสรางคําสั่งรุกเพื่อโจมตีเมืองหลวงของเอธิโอเปยแลว กอนจะออกคําสั่งใหดําเนินแผน ควรเตรียมการใหเหมาะสมเสียกอน\n\nหากคุณปลอยใหหนวยเตรียมการเปนเวลา $DAYS_OF_PLANNING|0Y$ วัน หนวยจะไดรับโบนัสการรบสูงสุดถึง §G+$PLANNING_MAX|0%$§! £tech_mod  §Yหลักนิยมภาคพื้นดิน§!บางอยางสามารถปรับระยะเวลาที่คุณสามารถ§Yเตรียมการ§!ได ขณะที่บางอยางอาจปรับความเร็วในการไปถึงระดับการเตรียมการสูงสุด\n\nขอแนะนําใหเตรียมกองทัพอากาศของคุณดวยเชนกัน คลิก§Yฐานทัพอากาศ§!ใน§Yเอริเทรีย§!"
 tut_7_text_1: "ดีมาก! เพื่อใหกองทหารของคุณมีโอกาสประสบความสําเร็จในการรบสูงขึ้น การมอบ§Yการสนับสนุนทางอากาศ§!ที่จําเปนใหแกพวกเขาก็เปนสิ่งสําคัญ\n\n§Yกองบิน§!ที่ไดรับมอบหมายใหประจํา§Yภูมิภาคทางอากาศ§!สามารถสงไปปฏิบัติภารกิจได กองบิน§Yสนับสนุน§!สามารถสงไปปฏิบัติภารกิจ§Yสนับสนุนทางอากาศโดยใกลชิด§! ซึ่งจะทําใหพวกเขาเขารวมการรบภาคพื้นดินได\n\nมอบหมาย§Yกองบิน§!ที่ประจําอยูที่§Yฐานทัพอากาศเอริเทรีย§!โดย§Gคลิกขวา§!ที่§Yดานากิล§! และออกคําสั่งเมื่อไดรับมอบหมายแลว"
 tut_8_text_1: "ดีมาก! ตอนนี้คุณมี§Yกองบิน§!ที่ไดรับมอบหมายใหประจํา§Yภูมิภาคทางอากาศ§!แอฟริกาตะวันออกแลว อยางไรก็ตาม กอนที่กองบินจะเริ่มทําอะไร คุณตองมอบ§Yภารกิจ§!ใหกองบินกอน หากกองบินไมมีภารกิจที่ใชงานอยู ก็จะอยูที่ฐานทัพอากาศ\n\n§Yภารกิจทางอากาศ§!มีหลายประเภท และภารกิจที่กองบินสามารถปฏิบัติไดขึ้นอยูกับประเภทของกองบิน §Yกองบินสนับสนุน§!สามารถสงไปปฏิบัติภารกิจ§Yสนับสนุนทางอากาศโดยใกลชิด§! ซึ่งทําใหเขารวมการรบภาคพื้นดินและโจมตีศัตรูของคุณได\n\nหากตองการสงกองบินไปปฏิบัติภารกิจ ใหคลิกไอคอนภารกิจในหนาตางทางอากาศ"
 tut_9_text_1: "ดีมาก! เมื่อเตรียมการเกือบทุกอยางเรียบรอยแลว ก็ถึงเวลาดําเนิน§Yแผนการรบ§!และพิชิตเอธิโอเปยเพื่ออิตาลี\n\nคลิกปุม§Yโหมดแผนที่เริ่มตน§! £GFX_F1    ที่มุมขวาลาง จากนั้นเลือกกองทัพของคุณโดยคลิกที่ภาพบุคคลดานลางของหนาจอ"
 tut_10_text_1: "ดีมาก! กอนที่เราจะเริ่มบุกเอธิโอเปย คุณควรแตงตั้งผูบัญชาการใหกองทัพหากยังไมไดทํา คลิก§Yชองภาพผูนําที่วางอยู§!ที่มุมซายบนของหนาจอ แลวเลือกผูบัญชาการจากรายชื่อ\n\nคลิกปุม§Yดําเนินแผน§!ที่ดานลางของหนาจอเพื่อสั่งใหกองทหารเริ่มการบุก"
 tut_10_text_2: "ปุมดําเนินแผน"
 tut_11_text_1: "กองกําลังของคุณจะเริ่มการรุกสูแอดดิสอาบาบา เมืองหลวงของเอธิโอเปย เมื่อคุณยึดครองดินแดนของศัตรูไดมากพอ พวกเขาจะยอมแพ\n\n§Yเลนเกมตอ§!โดยกด £SPACE . คุณสามารถปรับความเร็วเกมไดโดยกดปุม £KP_PLUS  หรือ £KP_MINUS  เปนเรื่องปกติที่ผูเลนมักปรับความเร็วเกมตามความตองการ แทนที่จะเลนดวยความเร็วเดียวตลอดเวลา\n\nเคล็ดลับ: หากคุณรูสึกวาควบคุมหนวยไดดีกวานี้ ใหเลือกกองพลแลว§Gคลิกขวา§!ที่จังหวัดเพื่อสั่งการดวยตนเองแทนคําสั่งที่หนวยไดรับจากแผนการรบ"
 tut_12_text_1: "เอธิโอเปยยอมแพแลว! คุณชนะ!\nตอนนี้คุณสามารถยื่นขอเรียกรองในระหวาง§Yการประชุมสันติภาพ§!ได เราแนะนําใหคุณเลือก§Yยึดทุกรัฐ§!\n\nขอเรียกรองแตละขอจะเพิ่ม £world_tension_icon  §Yความตึงเครียดของโลก§!ในระดับหนึ่ง ยิ่ง§Yความตึงเครียดของโลก§!สูงเทาไร ก็ยิ่งใกลสงครามโลกมากขึ้นเทานั้น\n\nบางประเทศจะมี§Yการดําเนินการทางการทูต§!บางอยางที่ถูกล็อกไวจนกวาความตึงเครียดของโลกจะสูงพอ อานเพิ่มเติมไดในเคล็ดลับดานลาง"
 tut_13_text_1: "คุณไดรับชัยชนะ! สงครามสิ้นสุดลงและเอธิโอเปยพายแพแลว\n\nในยามสงบ คุณอาจตองการ§Yขนสงกองทหาร§!ขามมหาสมุทรเพื่อยายไปประจําการยังที่ตาง ๆ หรืออาจเพื่อเตรียมพรอมทําสงคราม \n\nเมื่อเอธิโอเปยพายแพแลว คุณไมจําเปนตองมีกองพลจํานวนมากอยูที่นั่นอีก\n\nเลือกกองพลอยางนอย §Y4 กองพล§! แลวยายไปยัง§Yทาเรือที่ถูกไฮไลต§!โดย§Gคลิกขวา§!ที่จังหวัดนั้น"
 tut_14_text_1: "ในการเคลื่อนยายกองทหารระหวางดินแดนฝายเดียวกันสองแหง กองทหารของคุณตองอยูที่ทาเรือกอน\n\nเลือกหนวยที่§Yอยูในทาเรือ§! แลว§Gคลิกขวา§!ที่§Yทาเรืออื่นในอิตาลี§!"
