 #NAVAL
 POL_submarine_1: "ชั้น Wilk"
 POL_submarine_1_desc: "เรือชั้น Wilk ประกอบดวยเรือดํานํ้าสามลําที่ฝรั่งเศสตอใหกองทัพเรือโปแลนด และเขาประจําการในชวงตนทศวรรษ 1930 โดยใชแบบของเรือชั้น Saphir ของฝรั่งเศส เปนเรือดํานํ้าขนาดคอนขางใหญ มีระวางขับนํ้าเกือบ 1,000 ตัน ติดตั้งทอตอรปโดขนาด 550 มม. หกทอ และดําไดลึกถึง 80 เมตร"
 POL_submarine_2: "ชั้น Orzeł"
 POL_submarine_2_desc: "เรือชั้น Orzeł ประกอบดวยเรือดํานํ้าสองลําที่ตอในเนเธอรแลนดใหกองทัพเรือโปแลนด เรือสรางเสร็จเพียงไมกี่เดือนกอนเยอรมนีบุกโปแลนด เปนเรือดํานํ้าขนาดใหญ มีระวางขับนํ้า 1,100 ตัน ติดตั้งทอตอรปโดขนาด 550 มม. สิบสองทอ และดําไดลึก 80 เมตร"
 POL_submarine_3: "ชั้น Sokół"
 POL_submarine_3_desc: "เรือดํานํ้าสองลําของชั้น Sokół คือเรือดํานํ้าชั้น U ของอังกฤษที่สรางเสร็จใหกองทัพเรือโปแลนดพลัดถิ่นในป 1941-42 มีระวางขับนํ้า 540 ตัน ติดตั้งทอตอรปโดขนาด 533 มม. สี่ทอ มีเรดารและโซนารของอังกฤษครบครัน และดําไดลึก 60 เมตร"
 POL_submarine_4: "ชั้น Delfin"
 POL_destroyer_1: "ชั้น Wicher"
 POL_destroyer_1_desc: "เรือพิฆาตชั้น Wicher สองลําเปนเรือผิวนํ้าขนาดใหญชุดแรกของกองทัพเรือโปแลนด และเขาประจําการระหวางป 1930 ถึง 1932 เปนเรือขนาดใหญ มีระวางขับนํ้า 1,540 ตัน ตามแบบเดิมติดตั้งปน 130mm/40 M1924 สี่กระบอก แตไดรับการปรับปรุงเปนปนขนาด 120 มม. ของสวีเดนกอนเยอรมนีบุกไมนาน ทอตอรปโดและอาวุธตอสูอากาศยานก็ไดรับการปรับปรุงดวยเชนกัน"
 POL_destroyer_2: "ชั้น Grom"
 POL_destroyer_2_desc: "เรือพิฆาตสองลําของชั้น Grom ตอขึ้นในอังกฤษใหกองทัพเรือโปแลนด และเขาประจําการในป 1937 นับเปนเรือพิฆาตที่ใหญและเร็วที่สุดลําหนึ่งในสงครามโลกครั้งที่สอง มีระวางขับนํ้าเกือบ 2,000 ตัน ติดอาวุธหลักเปนปนใหญ Bofors M34 ขนาด 120mm/50 หากระบอก นอกจากนี้ยังมีทอตอรปโดขนาด 533 มม. หกทอ และอุปกรณปราบเรือดํานํ้าที่ดี"
 POL_destroyer_3: "ชั้น Piorun"
 POL_destroyer_3_desc: "เรือพิฆาต Piorun ของโปแลนดคือเรือพิฆาตชั้น N ของอังกฤษที่สรางใหกองทัพเรือโปแลนดพลัดถิ่น และเขาประจําการในป 1940 มีระวางขับนํ้า 1,770 ตัน มีความเร็วและความนาเชื่อถือในระดับดี ติดอาวุธหลักเปนปนใหญ 120mm/45 QF Mk XII หกกระบอก และยังมีทอตอรปโดขนาด 533 มม. หาทอ อุปกรณปราบเรือดํานํ้าที่ดีพอใช รวมถึงเรดารและโซนารรุนลาสุดของอังกฤษในขณะนั้น"
