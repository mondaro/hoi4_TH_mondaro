 taxes_desc: "เราจายภาษีเปนสัดสวนของรายไดตามขั้นที่เรียกวาขั้นภาษี เมื่อรายไดเพิ่มขึ้น อัตราภาษีของรายไดขั้นถัดไปก็จะสูงขึ้น\n\nเมื่อสิ้นสุดปงบประมาณแตละป เราตองจายภาษีใหรัฐบาล[ENG.GetAdjective] ตามขนาดอุตสาหกรรมของเรา ซึ่งกําหนดจากจํานวน§Yโรงงานพลเรือน§!\n\nจํานวนที่ตองจายอยูในรูป §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!\nจํานวนที่ตองจายจะกําหนดตามขั้นภาษีตางๆ ดังนี้:\n"
 eic_industry_tt: "จํานวนโรงงานพลเรือนที่ตองเสียภาษี: §Y[?var:actually_controlled_civs]§!\n$RAJ_dividents_status_tt$"
