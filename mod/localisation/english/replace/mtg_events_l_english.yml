 mtg_news.29.t: "[From.GetName] ปฏิเสธคําขาดของ[ENG.GetAdjective]"
 mtg_news.29.desc: "รัฐบาล[From.GetAdjective]ปฏิเสธคําขาดของฝาย[ENG.GetAdjective]ที่เรียกรองใหหนวยทหาร[ENG.GetAdjective]ผานดินแดนไดอยางเสรี รวมถึงการควบคุมกิจการภายในอยางกวางขวาง [From.GetLeader] กลาววารัฐบาลคาดการณไวแลววาฝาย[ENG.GetAdjective]จะตอบโต และไดสั่งใหกองทัพเตรียมพรอมขั้นสูงสุด"
