 mtg_news.28.t: "[From.GetName] ยอมสยบตอ [ENG.GetName]"
 mtg_news.28.desc: "เพื่อตอบคําขาดของฝาย[ENG.GetAdjective]ที่เรียกรองใหหนวยทหาร[ENG.GetAdjective]ผานดินแดนไดอยางเสรี รวมถึงการควบคุมกิจการภายในอยางกวางขวาง รัฐบาล[From.GetAdjective]ไดประกาศยอมสยบแลว เจาหนาที่ฝาย[ENG.GetAdjective]เขาไปประจําการเพื่อกํากับดูแลกิจการภายในของประเทศนั้นแลว"
