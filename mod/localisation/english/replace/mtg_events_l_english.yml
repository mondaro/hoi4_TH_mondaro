 mtg_news.11.desc: "ความพยายามของ[HOL.GetAdjective]ที่จะรักษาความเปนกลางทางการคาลมเหลว และมาตรการลาสุดที่รัฐบาล[HOL.GetAdjective]นํามาใชแสดงใหเห็นชัดวาพวกเขาจะดําเนินนโยบายการคาที่เอื้อประโยชนแก[ENG.GetName] ซึ่งมีแนวโนมจะทําใหอิทธิพลของ[ENG.GetAdjective]เหนือ[HOL.GetNameDef]เพิ่มขึ้นอยางมาก"
