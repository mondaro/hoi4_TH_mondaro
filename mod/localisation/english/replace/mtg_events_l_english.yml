 mtg_britain.1.t: "วิกฤตการสละราชสมบัติของพระเจาเอ็ดเวิรดที่ 8"
 mtg_britain.1.d: "เปนเวลาระยะหนึ่งแลวที่พระเจาเอ็ดเวิรดที่ 8 ทรงหวังจะอภิเษกสมรสกับวอลลิส ซิมปสัน หญิงชาวอเมริกัน บัดนี้เกิดวิกฤตทางรัฐธรรมนูญขึ้น เพราะนางซิมปสันไมเพียงหยาขาดจากสามีคนกอนมาแลว แตที่จริงยังคงสมรสอยูกับสามีคนปจจุบัน และกําลังดําเนินการหยาเปนครั้งที่สอง ความไมพอใจลุกลามไปทั่ว ดวยเหตุผลวาในฐานะพระมหากษัตริยและประมุขแหงคริสตจักรแหงอังกฤษ พระเจาเอ็ดเวิรดไมอาจอภิเษกสมรสกับหญิงที่ผานการหยารางได\n\nอยางไรก็ตาม พระองคทรงแสดงใหเห็นชัดแจงวาทรงรักนางซิมปสันอยางสุดหัวใจ และตั้งพระทัยจะอภิเษกสมรสกับนางโดยไมสนใจความเห็นของรัฐบาลหรือราษฎรของพระองค ดวยเหตุนี้ จึงเหลือทางเลือกใหพระองคเพียงสามทางเทานั้น\n\nรัฐบาลอังกฤษและรัฐบาลของประเทศในเครือจักรภพไดแถลงไวแลววาทางเลือกใดก็ตามนอกจากการสละราชสมบัติเปนสิ่งที่ยอมรับไมได และผลที่ตามมาจากการพยายามดึงดันอภิเษกสมรส แมจะเปนเพียงการประนีประนอม ก็นาจะรายแรงยิ่ง ไมเฉพาะตออังกฤษเอง แตยังรวมถึงสายสัมพันธกับเครือจักรภพดวย ขณะที่ที่ปรึกษาใกลชิดของพระองคยังคงพยายามโนมนาวพระทัย สาธารณชนตางเฝารอดวยใจระทึกวาความขัดแยงระหวางพระมหากษัตริยกับคณะรัฐมนตรีจะจบลงอยางไร"
 mtg_britain.1.a: "ยืนกรานการอภิเษกสมรสอยางเปนทางการ"
 mtg_britain.1_tt: "เริ่มเตรียมการพระราชพิธีอภิเษกสมรส\n"
 mtg_britain.1.b: "ประนีประนอมดวยการสมรสแบบมอรแกเนติก"
 mtg_britain.1.c: "หากพระองคไมทรงเปลี่ยนพระทัย ก็ตองสละราชสมบัติ"
 edward_viii_refused_to_abdicate_flag: "พระเจาเอ็ดเวิรดที่ 8 ทรงปฏิเสธการสละราชสมบัติ"
 mtg_britain.2.t: "เกิดแรงสนับสนุนพระเจาเอ็ดเวิรดที่ 8"
 mtg_britain.2.d: "ทามกลางความไมพอใจอยางรุนแรงจากพระราชวินิจฉัยของพระมหากษัตริย เริ่มมีเสียงสนับสนุนพระเจาเอ็ดเวิรดดังขึ้นมาบาง แมจะอยูนอกพรรคการเมืองหลัก แตชื่อของพวกเขาก็มีนํ้าหนักไมนอย ไดแก วินสตัน เชอรชิลล ออสวัลด มอสลีย และเดวิด ลอยด จอรจ\n\nแมในชวงแรกจะยังไมมั่นใจนัก แตกลุมพันธมิตรทางการเมืองที่ไมนาจะมารวมกันไดนี้ก็เริ่มไดรับความนิยมจากประชาชน และเมื่อมีผูนําทาง ก็มีผูกลาออกมาสนับสนุนพระราชวินิจฉัยของพระเจาเอ็ดเวิรดอยางเปดเผยมากขึ้นเรื่อย ๆ\n\nเมื่อไดแรงหนุนเชนนี้ พระมหากษัตริยจึงทรงแสดงใหเห็นชัดวาไมมีพระประสงคจะเปลี่ยนพระทัยในเรื่องนี้ พระราชพิธีอภิเษกสมรสจะดําเนินไปตามกําหนด"
 mtg_britain.2.a: "ดีมาก เราจะกําหนดวันกัน"
 mtg_britain.2_tt: "เตรียมการพระราชพิธีอภิเษกสมรสตอไป\n"
 mtg_britain.2.b: "บางทีประชาชนอาจพูดถูก พระมหากษัตริยควรสละราชสมบัติ"
 mtg_britain.3.t: "คณะรัฐมนตรีลาออก"
 mtg_britain.3.d: "เมื่อพระมหากษัตริยไมทรงแสดงทีทาวาจะรับฟงรัฐบาลของพระองค [Root.GetLeader] จึงไมเห็นทางออกอื่นนอกจากยุบคณะรัฐมนตรี โดยกลาวในแถลงการณวา "เปนที่ประจักษแลววาคณะรัฐมนตรีไมอาจทํางานไดหากปราศจากความไววางพระราชหฤทัยจากพระมหากษัตริย การที่ทรงเพิกเฉยตอคําถวายความเห็นอันเปนเอกฉันทของรัฐมนตรีครั้งแลวครั้งเลา แสดงใหเห็นชัดวาคําถวายความเห็นนั้นไมเปนที่ตองการและไมไดรับการใสพระทัย คืนนี้ขาพเจาจึงจะเขาเฝาเพื่อกราบถวายการลาออกของคณะรัฐมนตรี"\n\nเห็นไดชัดวานี่คือการประทวงครั้งสุดทายตอพระราชวินิจฉัยของพระมหากษัตริย แตยังไมแนวาจะไดผลหรือไม และยังไมมีใครทราบวาพระมหากษัตริยจะทรงประกาศใหผูใดสืบตําแหนงตอจาก [Root.GetLeader] หรือเมื่อใด"
 mtg_britain.3.a: "ไปเสียไดก็ดี พวกเขาหยุดพระมหากษัตริยไมไดหรอก"
 mtg_britain.4.t: "ประเทศในเครือจักรภพตัดขาดจากราชบัลลังก"
 mtg_britain.4.d: "ผูแทนรัฐบาลของประเทศในเครือจักรภพแจงเราเปนเสียงเดียวกันวาจะตัดความสัมพันธกับราชบัลลังกโดยฝายเดียว โดยอางวาการที่พระมหากษัตริยทรงเพิกเฉยอยางโจงแจงตอความเห็นและความตองการของรัฐบาลและประชาชนในเครือจักรภพ เปนเหตุผลหลักที่ทําใหความสัมพันธระหวางอังกฤษกับเครือจักรภพไมอาจดําเนินตอไปได\n\nเจาหนาที่เครือจักรภพผูหนึ่งกลาวในการใหสัมภาษณอยางดุเดือดวา "กษัตริยที่ไมอาจวางหนาที่ไวเหนือความรูสึกสวนตัว ยอมไมอาจไววางใจใหทําเพื่อประโยชนสูงสุดของราษฎรได จากเหตุการณที่ผานมา เห็นไดวาพระมหากษัตริยไมใสพระทัยตอความเห็นของสาธารณชนในประเทศเลยแมแตนอย และหากพระองคทรงปฏิบัติตอชาวอังกฤษเองเชนนี้ สถานการณของราษฎรในเครือจักรภพก็มีแตจะเลวรายลง เพื่อปกปองผลประโยชนของประชาชนของเรา เราจึงไมเห็นทางเลือกอื่นนอกจากถอดพระมหากษัตริยออกจากตําแหนงประมุขแหงรัฐของเรา"\n\nพวกเขาคงหวังวาภาวะชะงักงันทางการเมืองของเราในตอนนี้จะทําใหเราไมอาจตอบโตความเคลื่อนไหวอันกะทันหันนี้ได"
 mtg_britain.4.a: "เราไมมีกําลังจะหยุดพวกเขาได อยางนอยก็ในตอนนี้"
 mtg_britain.5.t: "พระราชพิธีอภิเษกสมรสของพระเจาเอ็ดเวิรดที่ 8"
 mtg_britain.5.d: "ในที่สุดวันมงคลแหงพระราชพิธีอภิเษกสมรสก็มาถึง ฝูงชนนับพันมารวมตัวกันตลอดเสนทางเสด็จจากพระราชวังบักกิงแฮมไปยังมหาวิหารเวสตมินสเตอร\n\nการตอตานการอภิเษกสมรสภายในประเทศแสดงใหเห็นถึงความไรพลังมากขึ้นเรื่อย ๆ ผานการลาออกเชิงสัญลักษณและการประทวงอันไรผลอื่น ๆ และบัดนี้แทบจะเงียบหายไปแลว การกระทําครั้งสุดทายในลักษณะนี้คือการเกษียณของคอสโม แลง อารชบิชอปแหงแคนเทอรเบอรี ซึ่งตอมาถูกแทนที่ดวยบุคคลที่... คลอยตามพระประสงคของพระมหากษัตริยมากกวา\n\nทามกลางความปนปวนทางการเมืองที่วิกฤตครั้งนี้กอขึ้น การเฉลิมฉลองที่กําลังดําเนินอยูเปนสิ่งจําเปนอยางยิ่งในการนําความเปนปกติกลับคืนสูกิจการบานเมืองบาง และเปนจุดเริ่มตนในการคลี่คลายปญหาทางการเมืองที่มีอยู"
 mtg_britain.5.a: "แตจะสมานรอยราวในชาติของเราไดหรือไม?"
 mtg_britain.7.t: "หนังสือพิมพสนับสนุนการอภิเษกสมรส"
 eng_newspaper_daily_express: "เดลีเอกซเพรส"
 eng_newspaper_daily_mail: "เดลีเมล"
 eng_newspaper_the_times: "เดอะไทมส"
 eng_newspaper_the_morning_post: "เดอะมอรนิงโพสต"
 eng_newspaper_daily_herald: "เดลีเฮรัลด"
 eng_newspaper_the_daily_telegraph: "เดอะเดลีเทเลกราฟ"
 mtg_britain.7.d: "บทความลาสุดใน [GETUKPROKINGNEWSPAPER] เนนยํ้าถึงสิทธิในความสุขของพระมหากษัตริย และแยงวาหากกฎเกณฑไมอนุญาตใหพระองคอภิเษกสมรสกับหญิงที่ผานการหยาราง บางทีก็ถึงเวลาที่ตองปรับปรุงกฎเกณฑเหลานั้นใหทันสมัย"
 mtg_britain.7.a: "เปนการแสดงการสนับสนุนพระมหากษัตริยที่นายินดี"
 mtg_britain.8.t: "หนังสือพิมพคัดคานการอภิเษกสมรส"
 mtg_britain.8.d: "บทความลาสุดใน [GETUKANTIKINGNEWSPAPER] ยกพระราชภาระที่พระมหากษัตริยมีตอประเทศและราษฎรขึ้นมากลาว โดยระบุวาพระราชสถานะและพระราชอภิสิทธิ์มาพรอมกับภาระหนาที่ พระองคจึงตองเสียสละอยางใดอยางหนึ่ง ระหวางการอภิเษกสมรสหรือราชบัลลังก"
 mtg_britain.8.a: "เปนการโจมตีพระมหากษัตริยที่นาเสียดาย"
 mtg_britain.9.t: "นายกรัฐมนตรีจํากัดบทบาทพระมหากษัตริย"
 mtg_britain.9.d: "ดวยเกรงวาหากพระมหากษัตริยมีพระราชดํารัสทางวิทยุตอสาธารณชน จะทําใหพระองคไดรับการสนับสนุนจากประชาชนมากเกินไป นายกรัฐมนตรี [Root.GetLeader] จึงไมยอมอนุญาตใหทําเชนนั้น เมื่อไมอาจขัดนายกรัฐมนตรีในเรื่องนี้ได พระมหากษัตริยจึงจําตองเก็บ 'ความจริงจากฝงของพระองค' ไวกับพระองคเองไปกอน"
 mtg_britain.9.a: "วิกฤตลุกลามไปถึงระดับสูงสุดของรัฐบาลแลว"
 mtg_britain.10.t: "รัฐสภาคัดคานการอภิเษกสมรส"
 mtg_britain.10.d: "วันนี้สมาชิกรัฐสภาหลายคนออกมาคัดคานแผนการอภิเษกสมรสกับนางซิมปสันของพระมหากษัตริยอยางแข็งกราว และปลุกเราใหเพื่อนสมาชิกจํานวนหนึ่งรวมจุดยืน การตอตานทางการเมืองตอการอภิเษกสมรสจึงเพิ่มขึ้นอยางเห็นไดชัด"
 mtg_britain.10.a: "นักการเมืองจะไปรูอะไรเรื่องความรักกันเลา"
 mtg_britain.11.t: "ชนชั้นสูงคัดคานการอภิเษกสมรส"
 mtg_britain.11.d: "บุคคลสําคัญในหมูขุนนางแสดงความรังเกียจอยางไมไวหนาตอการที่พระมหากษัตริยจะอภิเษกสมรสกับผูที่พวกเขามองวาเปน 'หญิงสามัญชนไรยางอาย' ทาทีดูแคลนที่พระองคทรงมีตอขนบธรรมเนียมและพิธีการดูจะสรางความขุนเคืองแกผูทรงอิทธิพลที่สุดของประเทศจํานวนมาก"
 mtg_britain.11.a: "พวกเขาก็แคอิจฉาที่พระองคไดพบรักแท"
 mtg_britain.12.t: "ชนชั้นแรงงานสนับสนุนการอภิเษกสมรส"
 mtg_britain.12.d: "การสนับสนุนพระมหากษัตริยดูจะเพิ่มขึ้นในหมูประชาชนชนชั้นลาง พวกเขาไมเพียงไมเห็นวาการที่พระมหากษัตริยอภิเษกสมรสกับ 'สามัญชน' เปนเรื่องผิด แตยังดูจะชื่นชอบเรื่องราวราวกับเทพนิยายของ 'หญิงสามัญชน' ที่ชนะใจพระมหากษัตริยและไดเขาสูราชวงศ"
 mtg_britain.12.a: "สูตรสําเร็จของนิยายขายดีชัด ๆ"
 mtg_britain.13.t: "พระเจาเอ็ดเวิรดที่ 8 มีพระราชดํารัสทางวิทยุ"
 mtg_britain.13.d: "ในที่สุดพระเจาเอ็ดเวิรดก็ทรงโนมนาวใหรัฐบาลอนุญาตใหมีพระราชดํารัสทางวิทยุได เพื่อเลาสิ่งที่พระองคเรียกวา 'ความจริงจากฝงของพระองค' พระองคทรงหวังวาจะชวยใหประชาชนเขาใจมากขึ้นวาเหตุใดพระองคจึงรูสึกวาตองทําเชนนี้"
 mtg_britain.13.a: "ปรากฏวา 'ความจริงจากฝงของพระองค' ฟงขึ้นทีเดียว"
 mtg_britain.15.t: "วิกฤตการสละราชสมบัติของพระเจาเอ็ดเวิรดที่ 8"
 mtg_britain.15.d: "รัฐบาลอังกฤษสั่นคลอนถึงแกนเมื่อมีการประกาศวาพระมหากษัตริยมีพระประสงคจะอภิเษกสมรสกับวอลลิส ซิมปสัน หญิงหยารางผูมีชาติกําเนิดตํ่าตอย เรื่องนี้กอใหเกิดความไมพอใจทั้งในหมูสมาชิกรัฐสภาและสาธารณชน ฝายคัดคานแยงวาหนาที่ของพระมหากษัตริยตองมีตอราษฎรและประเทศเปนอันดับแรก สวนความสุขสวนพระองคเปนเรื่องรอง และยังแยงวาในฐานะประมุขแหงคริสตจักรแหงอังกฤษ ซึ่งไมอนุญาตใหผูที่หยารางสมรสใหม พระมหากษัตริยจึงไมอาจอภิเษกสมรสกับนางซิมปสันได\n\nบัดนี้การถกเถียงไดลามมาถึงประเทศในเครือจักรภพ และเมื่อพระมหากษัตริยไมทรงแสดงทีทาวาจะรับฟงคําถวายความเห็นของคณะรัฐมนตรี เราตองถือวาแผนการอภิเษกสมรสจะไมเปลี่ยนแปลง หากพระองคทรงดึงดันตามพระประสงค เราจะตอบสนองอยางไร?"
 mtg_britain.15.a: "กษัตริยของเราจะอภิเษกสมรสกับสามัญชนที่หยารางไมได"
 mtg_britain.15_tt: "เราจะประกาศเอกราชและออกจากฝายสัมพันธมิตร หากพระเจาเอ็ดเวิรดที่ 8 ไมทรงเปลี่ยนพระทัย\n"
 mtg_britain.15.b: "พระองคจะยังเปนกษัตริยของเราไมวาอยางไร"
 mtg_britain.15_tt_2: "เราจะยังอยูกับอังกฤษ แมพระเจาเอ็ดเวิรดที่ 8 จะอภิเษกสมรสกับวอลลิส ซิมปสัน\n"
 ENG_staying_loyal_tt: "§Rเราจะถูกล็อกใหอยูในสายฝายภักดีของผังยุทธศาสตร!§!\n"
 mtg_britain.16.t: "พระเจาเอ็ดเวิรดที่ 8 ทรงเดินหนาอภิเษกสมรส"
 mtg_britain.16.d: "ดังที่เราเกรงไว พระเจาเอ็ดเวิรดที่ 8 ทรงตัดสินพระทัยเดินหนาอภิเษกสมรสกับวอลลิส ซิมปสัน ซึ่งบัดนี้รูจักกันในนามวอลลิส ดัชเชสแหงวินดเซอร"
 mtg_britain.16.a: "ถาเชนนั้นเราตองตัดขาดจากราชบัลลังก"
 mtg_britain.17.t: "อังกฤษเปนผูชี้นํา"
 mtg_britain.17.d: "เพื่อเตรียมความพรอมใหเราสูเอกราช [ENG.GetNameDef] ตัดสินใจคอยชี้นําเราในชวงเปลี่ยนผาน เราสามารถพึ่งพาการสนับสนุนของพวกเขาไดจนกวาจะยืนหยัดไดดวยตนเอง"
 mtg_britain.17.a: "เราจงใชความชวยเหลือของพวกเขาใหคุมคาที่สุด"
 mtg_britain.18.t: "มุงสูเอกราชของประเทศในเครือจักรภพ"
 mtg_britain.18.d: "การเปลี่ยนผานชวงแรกเสร็จสิ้นแลว และรัฐบาล[ENG.GetAdjective]แจงเราวากําลังเริ่มเตรียมการสงมอบอํานาจอธิปไตยเต็มรูปแบบ"
 mtg_britain.18.a: "ขาวดีอยางยิ่ง!"
 mtg_britain.19.t: "รากฐานของรัฐอินเดีย"
 mtg_britain.19.d: "เพื่อเตรียมความพรอมใหเราสูเอกราช [ENG.GetNameDef] ตัดสินใจคอยชี้นําเราในชวงเปลี่ยนผาน เราสามารถพึ่งพาการสนับสนุนของพวกเขาในการพัฒนารัฐบาลใหเติบโต รวมถึงยกระดับอุตสาหกรรมของประเทศ จนกวาจะยืนหยัดไดดวยตนเอง"
 mtg_britain.20.t: "ทางออกสามประเทศ"
 mtg_britain.20.d: "เพื่อประโยชนแหงสันติภาพ รัฐบาล[ENG.GetAdjective]ตัดสินใจแบงอนุทวีปตามเสนแบงทางศาสนาและวัฒนธรรม ขอเสนอนี้จะกอใหเกิดรัฐแยกกันสามรัฐ ไดแก อินเดีย ปากีสถาน และบังกลาเทศ โดยหวังวาทางออกนี้จะปองกันสงครามกลางเมืองที่อาจสรางความพินาศได"
 mtg_britain.20.a: "ไมนาจะทําใหฝายใดพอใจเลย"
 mtg_britain.21.t: "มุงสูเอกราชของอินเดีย"
 mtg_britain.22.t: "การลงมติไมไววางใจ"
 mtg_britain.22.d: "ในการลงมติไมไววางใจวันนี้ สภาสามัญแสดงใหเห็นชัดวาหมดความเชื่อมั่นในรัฐบาลชุดปจจุบันแลว หลังจากกราบถวายการลาออกตอพระมหากษัตริย [Root.GetLeader] ไดเสนอชื่อวินสตัน เชอรชิลลเปนผูสืบตําแหนง\n\nคาดกันวานายกรัฐมนตรีคนใหมจะถอยหางจากนโยบายเอาใจผูรุกรานที่เปนที่ถกเถียง และอาจถึงขั้นตอบโตการทาทายครั้งตอไปดวยกําลังทหาร"
 mtg_britain.22.a: "เชอรชิลลจงเจริญ!"
 mtg_britain.23.t: "โดดเดี่ยวภัยคุกคามในเมดิเตอรเรเนียน"
 mtg_britain.23.d: "[From.GetNameDefCap] ติดตอมาขอใหเราโดดเดี่ยวชาวอิตาลีทางการทูต หากเรายินดี พวกเขาก็พรอมจะพิจารณาการเปนพันธมิตรกับเราในอนาคต"
 mtg_britain.23.a: "เรื่องนี้มีแวว"
 mtg_britain.23.b: "เราไมยอมใหอังกฤษมาสั่งเราหรอก!"
 mtg_britain.24.t: "[From.GetName] ทอดทิ้ง [ITA.GetName]"
 mtg_britain.24.d: "[From.GetNameDefCap] แจงเราวาไดตัดความสัมพันธทางการทูตกับ [ITA.GetNameDef] แลว"
 mtg_britain.24.a: "เรื่องนี้จะเปนประโยชนตอเราอยางมาก"
 mtg_britain.25.t: "การปรองดองระหวางเยอรมนีกับอังกฤษ"
 mtg_britain.25.d: "[From.GetNameDefCap] แจงเราวาไดตัดความสัมพันธทางการทูตกับเราตามการยุยงของฝาย[ENG.GetAdjective]"
 mtg_britain.25.a: "พวกเขากลาดีอยางไร?!"
 mtg_britain.26.t: "[From.GetName] สนับสนุน [ITA.GetName]"
 mtg_britain.26.d: "[From.GetNameDefCap] แจงเราวาตัดสินใจไมตัดความสัมพันธทางการทูตกับ [ITA.GetNameDef]"
 mtg_britain.26.a: "เรื่องนี้ทําใหสถานการณยุงยากขึ้นแน..."
 ENG_germany_rejected_isolate_the_italian_threat: "เยอรมนีปฏิเสธที่จะโดดเดี่ยวภัยคุกคามในเมดิเตอรเรเนียน\n"
 mtg_britain.27.t: "เปนพันธมิตรกับ [From.GetName]"
 mtg_britain.27.d: "ดังที่เคยกลาวไว บัดนี้ [From.GetNameDef] เสนอเขารวมพันธมิตรของเรา เพื่อสานตอความรวมมือและโดดเดี่ยวชาวอิตาลีใหมากขึ้น"
 mtg_britain.27.a: "ความคิดที่ยอดเยี่ยม!"
 mtg_britain.27.b: "เราไมสนใจเรื่องนี้"
 mtg_britain.28.t: "[From.GetName] ตอบรับการเปนพันธมิตร"
 mtg_britain.28.d: "[From.GetNameDefCap] ตอบรับขอเสนอเปนพันธมิตรของเราแลว นับจากนี้เราจะครองทั้งทะเลและแผนดิน"
 mtg_britain.29.t: "[From.GetName] ปฏิเสธการเปนพันธมิตร"
 mtg_britain.29.d: "[From.GetNameDefCap] ปฏิเสธขอเสนอเปนพันธมิตรของเรา ไมมีใครเดาไดวาพวกเขากําลังวางแผนอะไรอยู..."
 mtg_britain.30.t: "[From.GetName] ขอใหตางฝายไมแทรกแซงกัน"
 mtg_britain.30.d: "[From.GetNameDefCap] เสนอสนธิสัญญาไมแทรกแซง ซึ่งจะปลอยใหเรามีอิสระเต็มที่บนภาคพื้นทวีป ขอเพียงเราทําเปนมองไมเห็นการที่อังกฤษเขาไปเกี่ยวของกับจักรวรรดิของตน และกับชาวอิตาลี"
 mtg_britain.30.a: "ยอมรับได"
 mtg_britain.30.b: "เราไมตองการถูกมัดมือเชนนี้"
 mtg_britain.31.t: "[From.GetNameDefCap] ตอบรับการไมแทรกแซง"
 mtg_britain.31.d: "เจาหนาที่ฝาย[From.GetAdjective]แจงเราวาไดตอบรับขอเสนอสนธิสัญญาไมแทรกแซงของเราแลว พวกเขาจะทําเปนมองไมเห็นธุระของเรากับจักรวรรดิและกับอิตาลี สวนเราจะปลอยใหพวกเขาทําตามใจบนภาคพื้นทวีป"
 mtg_britain.32.t: "[From.GetNameDefCap] ปฏิเสธการไมแทรกแซง"
 mtg_britain.32.d: "เจาหนาที่ฝาย[From.GetAdjective]แจงเราวาไดปฏิเสธขอเสนอสนธิสัญญาไมแทรกแซงของเรา หากพวกเขาตั้งใจจะเปดทางเลือกไว เราตองระวังตัว..."
 mtg_britain.33.t: "ความรุนแรงทางการเมืองบานปลายเปนสงครามกลางเมือง"
 mtg_britain.33.d: "การเดินขบวนครั้งลาสุดเกิดความรุนแรงขึ้นอีกระหวางกลุมเสื้อดํากับผูประทวงฝายคอมมิวนิสตและสังคมนิยม แตความรุนแรงครั้งนี้ไมไดจํากัดอยูแคที่นั่น มันเปรียบเหมือนประกายไฟที่จุดชนวนสถานการณอันตึงเครียดขึ้นเรื่อย ๆ ในประเทศของเราตลอดหลายเดือนที่ผานมา\n\nกองกําลังติดอาวุธทั่วประเทศเริ่มปะทะกัน ยึดครองเมืองใหญนอยและพื้นที่โดยรอบ บีบใหกองทัพตองเลือกขาง ขณะที่ประเทศในเครือจักรภพและกองทัพเรือยังคงสนับสนุนสิ่งที่พวกเขาเรียกวารัฐบาลประชาธิปไตยที่ 'ชอบธรรม' อยางเต็มที่ สถานการณในกองทัพบกกลับไมชัดเจนนัก และหลายหนวยไดเขารวมฝายเรา\n\nเมื่อแนวหนาเริ่มกอตัว ออสวัลด มอสลีย ไดประกาศจัดตั้งรัฐบาลรับมือวิกฤตชั่วคราวภายใตการนําของเขา เพื่อดูแลกิจการที่จําเปนจนกวาสงครามกลางเมืองจะยุติ"
 mtg_britain.33.a: "อนาคตของชาติเราเปนเดิมพัน!"
 mtg_britain.34.t: "สงครามกลางเมืองอังกฤษสิ้นสุดลง"
 mtg_britain.34.d: "แทนที่จะสูสงครามกลางเมืองอันสิ้นหวังตอไปจากอาณานิคม การขาดแรงสนับสนุนจากประชาชนทําใหรัฐบาลประชาธิปไตยยอมรับชัยชนะของเราและขอเจรจาสันติภาพ หลังการตัดสินใจนี้ ราชนาวีก็กลับมาอยูใตบังคับบัญชาของเราอีกครั้ง\n\nอยางไรก็ตาม ประเทศในเครือจักรภพแสดงใหเห็นชัดวาไมมีความตั้งใจจะยอมตามรัฐบาลที่ไมเปนประชาธิปไตย และมุงจะดําเนินตอไปในฐานะประเทศสมาชิกที่เปนเอกราชของเครือจักรภพแหงประชาชาติ"
 mtg_britain.34.a: "เริ่มการฟนฟูกันเถิด"
 mtg_britain.35.t: "เดินขบวนสูดาวนิงสตรีท"
 mtg_britain.35.d: "การเดินขบวนสูดาวนิงสตรีทของเราประสบความสําเร็จอยางงดงาม และภายใตแรงกดดันโดยตรงจากประชาชน [Root.GetLeader] ไมมีทางเลือกนอกจากประกาศใหมีการเลือกตั้งโดยทันที ผลคือชัยชนะอยางชัดเจนของฝายขวา และดวยพระราชานุญาตของพระมหากษัตริย ออสวัลด มอสลีย กําลังจัดตั้งคณะรัฐมนตรี ในแถลงการณเมื่อชวงตนวันนี้ นายกรัฐมนตรีคนใหมไดประกาศการปฏิรูปเศรษฐกิจครั้งใหญและแนวทางใหมดานการทูตในยุโรปแลว\n\nในขณะเดียวกัน ความไมพอใจในหมูประเทศในเครือจักรภพดูจะพุงสูงสุดเปนประวัติการณ และเสียงเรียกรองเอกราชไมเคยดังเทานี้มากอน อีกไมกี่เดือนขางหนาจะเปนชวงเวลาสําคัญยิ่งสําหรับจักรวรรดิ"
 mtg_britain.35.a: "ภายใตการนําของมอสลีย เราจะฝาพายุไปได!"
 mtg_britain.36.t: "[From.GetName] ขอเปนพันธมิตร"
 mtg_britain.36.d: "นักการทูตฝาย[From.GetAdjective]ติดตอเรามาพรอมขอเสนอแยบยล พวกเขาเสนอใหจัดตั้งพันธมิตรเพื่อตอตานผูที่หมายจะเปนเจาครองยุโรป และเสนอจะตัดสัมพันธทางการทูตทั้งหมดกับฝรั่งเศสเปนการตอบแทน"
 mtg_britain.36.a: "ความคิดที่ยอดเยี่ยม! เราตอบรับ"
 mtg_britain.36.b: "เราไมตองการพันธมิตรที่แทงขางหลังเชนนี้"
 mtg_britain.37.t: "[From.GetName] ตอบรับการเปนพันธมิตร"
 mtg_britain.37.d: "[From.GetNameDefCap] แจงเราวาสนใจขอเสนอของเราและตัดสินใจตอบรับ เราจะยืนหยัดเคียงขางพันธมิตรทางอุดมการณและเผชิญภัยคุกคามของโลกไปดวยกัน"
 mtg_britain.38.t: "[From.GetName] ปฏิเสธการเปนพันธมิตร"
 mtg_britain.38.d: "[From.GetNameDefCap] แจงเราวาเห็นวาขอเสนอของเราเลวทรามอยางที่สุด จึงปฏิเสธโดยไมลังเล"
 mtg_britain.39.t: "[From.GetName] ทอดทิ้งเรา"
 mtg_britain.39.d: "[From.GetNameDefCap] แจงเราวาเราไมเกี่ยวของกับผลประโยชนปจจุบันของพวกเขาอีกตอไป และพวกเขาตัดสินใจ 'ทบทวน' สายสัมพันธที่เรารวมสรางมาตั้งแตมหาสงคราม แลวหันไปเปนพันธมิตรกับชาวอิตาลีแทน"
 mtg_britain.39.a: "ชางเปนการทรยศ!"
 mtg_britain.40.t: "[From.GetName] เสนอการเปนพันธมิตร"
 mtg_britain.40.d: "รัฐบาล[From.GetAdjective]ติดตอเรามาพรอมขอเสนอจะคืนยิบรอลตารใหเรา แลกกับการที่เราเขารวมพันธมิตรของพวกเขา"
 mtg_britain.40.a: "ความคิดที่ดีเยี่ยม!"
 mtg_britain.40.b: "เราวาไมดีกวา"
 mtg_britain.41.t: "[From.GetName] ตอบรับการเปนพันธมิตร"
 mtg_britain.41.d: "[From.GetNameDefCap] แจงเราวาตัดสินใจตอบรับขอเสนอเปนพันธมิตรของเราเพื่อแลกกับยิบรอลตาร"
 mtg_britain.42.t: "[From.GetName] ปฏิเสธการเปนพันธมิตร"
 mtg_britain.42.d: "[From.GetNameDefCap] แจงเราวาตัดสินใจปฏิเสธขอเสนอเปนพันธมิตรของเรา ยิบรอลตารยังคงเปนของเรา"
 mtg_britain.43.t: "ชะตากรรมของพระราชวงศ"
 mtg_britain.43.d: "นับตั้งแตการถายโอนอํานาจ พระราชวงศถูกกักบริเวณอยางไมเปนทางการอยูในพระราชวังบักกิงแฮมอันโออา บัดนี้ถึงเวลาตัดสินแลววาจะจัดการกับพระราชวงศอยางไร มติมหาชนชัดเจนวาพวกเขาตองไป ที่เหลือก็เพียงตัดสินวาจะไปดวยวิธีใด และจะทําอยางไรกับทรัพยสินเมื่อเรายึดมาได..."
 mtg_britain.43.a: "เนรเทศไปแคนาดา!"
 mtg_britain.43.b: "พวกเขาจะถูกพิจารณาคดีและลงโทษ"
 mtg_britain.44.t: "พระราชวงศพลัดถิ่น"
 mtg_britain.44.d: "รัฐบาล[From.GetAdjective]แสดง 'ความผอนปรน' ตอพระราชวงศดวยการเนรเทศ บัดนี้พระราชวงศเสด็จมาถึงดินแดนของเราและขอลี้ภัย"
 mtg_britain.44.a: "ที่นี่ยินดีตอนรับ"
 mtg_britain.45.t: "กําจัดชนชั้นสูง"
 mtg_britain.45.d: "เมื่อเราสถาปนาที่ทางของลัทธิคอมมิวนิสตในชาติไดมั่นคงแลว ก็ถึงเวลาเริ่มกระจายความมั่งคั่งที่พลเมืองถือครองอยู ชอนเงินของชนชั้นสูงตองถูก... ยึดไปโดยใชกําลัง"
 mtg_britain.45.a: "ถึงตาสุนัขจิ้งจอกแดงแลว"
 mtg_britain.46.t: "[From.GetName] เรียกรองใหปลดปลอยอาณานิคม"
 mtg_britain.46.d: "[From.GetNameDefCap] ยื่นคําขาดเรียกรองใหเราเดินตามแบบอยางของพวกเขาโดยทันที และมอบเอกราชโดยสมบูรณแกดินแดนอาณานิคมของเรา มิฉะนั้นพวกเขาพรอมจะใชกําลังทหารบังคับตามขอเรียกรอง..."
 mtg_britain.46.a: "ถาเชนนั้นเราก็ไมมีทางเลือก"
 mtg_britain.46.b: "ใหพวกเขาลองดู"
 mtg_britain.47.t: "[From.GetName] ปลดปลอยอาณานิคม"
 mtg_britain.47.d: "[From.GetNameDefCap] ปลดปลอยอาณานิคมตามขอเรียกรองของเราแลว"
 mtg_britain.47.a: "พวกเขาชวยปลดแอกกรรมกร"
 mtg_britain.48.t: "[From.GetName] ปฏิเสธขอเรียกรอง"
 mtg_britain.48.d: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองใหปลดปลอยอาณานิคมของเรา"
 mtg_britain.48.a: "ถาเชนนั้นก็ตองเปนสงคราม"
 mtg_britain.49.t: "อังกฤษเสนอความรวมมือ"
 mtg_britain.49.d: "[From.GetNameDefCap] เสนอใหรวมมือกันโจมตี [GER.GetNameDef] จากสองทิศทาง หากพวกเขาทําตามขอตกลงและเปดแนวรบที่สองอยางรวดเร็ว นี่อาจเปนโอกาสอันดียิ่ง"
 mtg_britain.49.a: "ความคิดที่ดี ลงมือกันเลย"
 mtg_britain.49.b: "นี่ดูเหมือนการฆาตัวตาย เรารอดูไปกอนดีกวา"
 mtg_britain.50.t: "[From.GetName] ตอบรับขอเสนอ"
 mtg_britain.50.d: "[From.GetNameDefCap] ตอบรับขอเสนอของเราแลว และพรอมจะโจมตีเยอรมนี"
 mtg_britain.50.a: "เราจะบดขยี้ชาวเยอรมัน"
 mtg_britain.51.t: "[From.GetName] ปฏิเสธขอเสนอ"
 mtg_britain.51.d: "[From.GetNameDefCap] ปฏิเสธขอเสนอของเรา โดยบอกวาไมมีเจตนาเปนปรปกษตอชาวเยอรมัน"
 mtg_britain.51.a: "นาเสียดายจริง"
 mtg_britain.52.t: "[From.GetName] ขอเปนพันธมิตร"
 mtg_britain.52.d: "[From.GetNameDefCap] ติดตอเรามาเพื่อขอเขารวมโคมินเทิรน"
 mtg_britain.52.a: "พวกเขาเปนสหายคอมมิวนิสต ควรอยูเคียงขางเรา"
 mtg_britain.52.b: "ลัทธิคอมมิวนิสตของพวกเขาไมใชแนวทางของสตาลิน"
 mtg_britain.53.t: "[From.GetName] อนุมัติคําขอ"
 mtg_britain.53.d: "[From.GetNameDefCap] รับเราเปนสมาชิกโคมินเทิรนแลว บัดนี้เราจะยืนเคียงขางพวกเขาเพื่อปกปองกรรมกรทั่วโลก"
 mtg_britain.54.t: "[From.GetName] ปฏิเสธคําขอ"
 mtg_britain.54.d: "[From.GetNameDefCap] ปฏิเสธคําขอเขารวมโคมินเทิรนของเรา เราตองยืนหยัดเพียงลําพัง"
 mtg_britain.55.t: "สงครามกลางเมืองคอมมิวนิสต"
 mtg_britain.55.d: "กลุมบางกลุมในพรรคของเรากลาวหามานานวาเราเพียงแตพูดถึงอุดมการณคอมมิวนิสตวาดวยเสรีภาพและความเทาเทียมแคลมปาก บัดนี้กลุมเหลานี้ไดกอการรัฐประหาร เราสามารถรักษาอํานาจไวได แตสถานการณไดบานปลายเปนสงครามกลางเมืองเต็มรูปแบบ"
 mtg_britain.55.a: "พวกทรยศ!"
 mtg_britain.56.t: "สงครามกลางเมืองคอมมิวนิสตสิ้นสุดลง"
 mtg_britain.56.d: "หลังสงครามกลางเมืองอันทรหด เราสามารถกลับมาควบคุมสถานการณได ตอนนี้เราเริ่มกวาดลางกลุมทรยศเหลานี้ในประเทศไดแลว..."
 mtg_britain.56.a: "อยาไดปรานีพวกมัน"
 mtg_britain.57.t: "การเดินขบวนอยางสงบใน [ENG_blackshirt_march_state.GetName]"
 mtg_britain.57.d: "การเดินขบวนใน [ENG_blackshirt_march_state.GetName] ประสบความสําเร็จอยางงดงาม ผูประทวงฝายตรงขามมีนอยมาก และกลุมเสื้อดําของเราประพฤติตนเปนแบบอยางที่ดี กระแสความนิยมที่พุงขึ้นจากเหตุการณนี้ทําใหเราไดเปรียบทางการเมืองอยางมากซึ่งเปนประโยชนตอขบวนการของเรา"
 mtg_britain.57.a: "เดินหนาสูชัยชนะอยางไมมีใครหยุดยั้ง!"
 mtg_britain.58.t: "การเดินขบวนใน [ENG_blackshirt_march_state.GetName]"
 mtg_britain.58.d: "แมจะมีผูประทวงฝายตรงขามและการปะทะเล็กนอยบาง แตการเดินขบวนใน [ENG_blackshirt_march_state.GetName] ก็ประสบความสําเร็จ กลุมเสื้อดําไดรักษาเกียรติของพรรคไว และเราจะเดินหนาตอไปสูชัยชนะทางการเมืองโดยสมบูรณ"
 mtg_britain.58.a: "ไมมีใครขวางทางความกาวหนาได"
 mtg_britain.59.t: "การเดินขบวนอันรุนแรงใน [ENG_blackshirt_march_state.GetName]"
 mtg_britain.59.d: "การเดินขบวนใน [ENG_blackshirt_march_state.GetName] ทําใหเกิดการประทวงตอตานครั้งใหญและการตอสูบนทองถนนอยางกวางขวาง แมจะมีผูบาดเจ็บจํานวนมากและมีผูเสียชีวิตบาง แตกลุมเสื้อดําของเราก็ตานพวกกอความวุนวายไวไดจนกระทั่งตํารวจเขามาระงับเหตุ"
 mtg_britain.59.a: "ไขแตกไมกี่ฟองจะเปนไรไปเมื่อเทียบกับอนาคตของชาติ?"
 mtg_britain.60.t: "มอสลียปราศรัยตอตาน [GER.GetName]"
 mtg_britain.60.d: "เพื่อโตขอกลาวหาวาเขาเปนเพียงสุนัขรับใชของ [GER.GetLeader] วันนี้ออสวัลด มอสลียไดกลาวปราศรัยอยางปลุกใจ โดยยืนยันถึงความเปนเอกลักษณและความเปนตัวของตัวเองของลัทธิฟาสซิสตอังกฤษ และเนนยํ้าความแตกตางระหวางนโยบายของเขากับของผูเผด็จการเยอรมัน กอนปดทายดวยถอยคําทรงพลังวา "ไมมีผูใดนอกจากชาวบริตันที่จะปกครองบริเตน!""
 mtg_britain.60.a: "ดูเหมือนสาธารณชนจะตอบรับคอนขางดี"
 mtg_britain.61.t: "[From.GetName] สนับสนุนฝายภักดีตอจักรวรรดิ"
 mtg_britain.61.d: "เราทราบมาวา [From.GetNameDef] กําลังสนับสนุนฝายภักดีตอจักรวรรดิในประเทศของเรา หากปลอยไว การบอนทําลายของพวกเขาอาจลงเอยดวยสงครามกลางเมืองเต็มรูปแบบ!"
 mtg_britain.61.a: "เราตองตื่นตัวไว"
 mtg_britain.62.t: "[From.GetName] เคลื่อนไหวเพื่อควบคุมประเทศในเครือจักรภพ"
 mtg_britain.62.d: "รัฐบาล[From.GetAdjective]ชุดใหมประกาศเจตนาจะบดขยี้การตอตานใด ๆ ในหมูประเทศในเครือจักรภพดวยกําลังทหารหากจําเปน แมกองทัพของพวกเขาจะกระจายบางเกินไปที่จะทําเชนนั้นไดทั่วทั้งจักรวรรดิ แตเห็นไดชัดวาพวกเขาตั้งใจจะลอง"
 mtg_britain.62.a: "พวกเขาอาจมาเลนงานเรา"
 mtg_britain.63.t: "[From.GetName] ประกาศกฎอัยการศึก"
 mtg_britain.63.d: "หลังจากสงกองกําลังเขามาในแผนดินใหญของเรา รัฐบาล[From.GetAdjective]ไดประกาศกฎอัยการศึกและระงับการทํางานของรัฐบาลเปนการชั่วคราว"
 mtg_britain.63.a: "พวกเขากลาดีอยางไร?!"
 mtg_britain.64.t: "[From.GetName] เผยแพรโฆษณาชวนเชื่อ"
 mtg_britain.64.d: "รัฐบาล[From.GetAdjective]เริ่มเผยแพรโฆษณาชวนเชื่อทางอุดมการณอยางกวางขวาง โดยใชกฎอัยการศึกปดกั้นสื่อ"
 mtg_britain.64.a: "เราไดแตหวังวามันจะไมสงผลตอประชาชนมากเกินไป"
 mtg_britain.65.t: "[From.GetName] เปลี่ยนรัฐบาล"
 mtg_britain.65.d: "ดวยการสนับสนุนจากประชาชนของเรา [From.GetNameDefCap] ไดยุบรัฐบาลของเราทั้งหมดและประกาศใหมีการเลือกตั้งใหม ซึ่งไมตางอะไรจากละครตลก โดยรัฐบาลฝายภักดีชนะอยางถลมทลาย"
 mtg_britain.65.a: "พวกเขากลาดีอยาง-- เออ หมายถึง บริแทนเนียจงเปนใหญ!"
 mtg_britain.66.t: "ความภักดีตออังกฤษ"
 mtg_britain.66.d: "รัฐบาล[ENG.GetAdjective]ผานการเปลี่ยนแปลงทางการเมืองครั้งใหญ เราตองตัดสินใจวาจะยังคงภักดีตอไปหรือไม เมื่ออุดมการณของเราแตกตางกันมากถึงเพียงนี้"
 mtg_britain.66.a: "เราไมเห็นวาสถานการณนี้มีอะไรผิด"
 mtg_britain.66.b: "รับไมได! เราจะประกาศเอกราช!"
 mtg_britain.66.c: "รัฐบาลของเราอาจยังไมมีความเชื่อแบบ[ENG.GetAdjective] แตกระแสลมกําลังเปลี่ยนทิศ"
 mtg_britain.67.t: "[From.GetName] ประกาศเอกราช"
 mtg_britain.67.d: "[From.GetNameDefCap] แจงเราวาไมอาจเห็นพองกับแนวทางอุดมการณที่เราเลือก จึงไมเห็นทางเลือกอื่นนอกจากแยกตัวออกจากจักรวรรดิ"
 mtg_britain.67.a: "คอยดูกันวาจะอยูไดนานแคไหน"
 ENG_dominions_stayed_with_fascist_britain_flag: "อยูกับอังกฤษฟาสซิสตตอไป"
 mtg_britain.68.t: "ลัทธิคอมมิวนิสตในแคนาดา"
 mtg_britain.68.d: "[ENG.GetNameDefCap] กําลังบังคับสถาปนารัฐบาลคอมมิวนิสตใน [FROM.GetNameDef] เราจะยอมใหภัยคุกคามทางอุดมการณเชนนี้ปรากฏขึ้นที่ชายแดนของเราไดอยางไร?!"
 mtg_britain.68.a: "เราจะคัดคานอยางแข็งกราว"
 mtg_britain.68.b: "เราทําอะไรไมได"
 mtg_britain.69.t: "[USA.GetName] คัดคานลัทธิคอมมิวนิสตใน[CAN.GetAdjective]"
 mtg_britain.69.d: "[From.GetNameDefCap] ยื่นคําขาดเรียกรองใหเราหยุดการแพรขยายลัทธิคอมมิวนิสตใน [CAN.GetNameDef] โดยทันที"
 mtg_britain.69.a: "ใหพวกเขาลองบังคับตามขอเรียกรองนั้นดู"
 mtg_britain.69.b: "ถาเชนนั้นเราก็ไมมีทางเลือกนอกจากยอมทําตาม"
 mtg_britain.70.t: "[From.GetName] ไมยอมถอย"
 mtg_britain.70.d: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา และแจงวาเราไมมีอํานาจใด ๆ เหนือกรรมกรชาว[CAN.GetAdjective]"
 mtg_britain.70.a: "ถาเชนนั้นเราตองสรางอํานาจดวยกําลังทหาร"
 mtg_britain.70.b: "พวกเขาจับไตเราได เราตองถอย"
 mtg_britain.71.t: "[From.GetName] ยอมถอย"
 mtg_britain.71.d: "[From.GetNameDefCap] แจงเราวาจะงดเวนการแพรขยายลัทธิคอมมิวนิสตใน [CAN.GetNameDef]"
 mtg_britain.71.a: "พวกเขารูวาอะไรดีสําหรับตัวเอง"
 ENG_ditched_the_italians_flag: "ตีตัวออกหางจากชาวอิตาลีเพื่อเขาหาอังกฤษ\n"
 ENG_ditched_by_the_germans_flag: "ถูกชาวเยอรมันทอดทิ้งเพื่อเขาหาอังกฤษ\n"
 ENG_democratic_civil_war_tt: "ฝายสนับสนุนประชาธิปไตยกอสงครามกลางเมือง\n"
 mtg_britain.34_tt: "ราชนาวีกลับมาอยูใตการควบคุมของเรา\n"
 ENG_communist_civil_war_tt: "ฝายสนับสนุนคอมมิวนิสตกอสงครามกลางเมือง\n"
 mtg_britain.62_tt: "อังกฤษจะสามารถเปลี่ยนเราใหเปนอุดมการณเดียวกับพวกเขาไดภายใน 180 วันขางหนา\n"
 mtg_britain.68_tt: "ยกเลิกความพยายามทั้งหมดในการควบคุมแคนาดา\n"
 mtg_britain.72.t: "ความไมสงบในอินเดียตอนเหนือ"
 mtg_britain.72.d: "ความพยายามจะรักษาอนุทวีปอินเดียใหเปนรัฐเดียวกําลังกอใหเกิดความขัดแยงอยางมาก ความแตกตางทางศาสนาเริ่มนําไปสูความไมสงบและการปะทะกันของประชาชน โดยเฉพาะทางตะวันตกเฉียงเหนือและตะวันออกเฉียงเหนือของประเทศ ขณะที่บุคคลสําคัญหลายคนใชวาทกรรมที่เปนปรปกษมากขึ้นเรื่อย ๆ วิกฤตนี้ไมมีทีทาวาจะชะลอลง แมแตในพมาก็มีผูคนพูดถึงการแยกตัว..."
 mtg_britain.72.a: "ลางราย... เราควรเตรียมรับมือกับสิ่งเลวรายที่สุด"
 mtg_britain.73.t: "สงครามกลางเมืองอินเดีย"
 mtg_britain.73.d: "ความตึงเครียดทางตอนเหนือของประเทศถึงจุดแตกหักในที่สุด และความรุนแรงอยางเปดเผยระหวางชาวมุสลิมกับชาวฮินดูไดบานปลายเปนสงครามกลางเมือง รัฐบาลมุสลิมชั่วคราวไดจัดตั้งขึ้นและประกาศเอกราชโดยสมบูรณของปากีสถาน พรอมแสดงเจตนารมณจะปกปองเอกราชนั้นดวยกําลังทหาร"
 mtg_britain.73.a: "เราจะปลอยใหพวกเขาแยกตัวไปงาย ๆ แบบนี้ไมได!"
 mtg_britain.73.b: "เรื่องนี้ไมคุมที่จะทําสงคราม"
 mtg_britain.74.t: "สงครามกลางเมืองกับ [PAK.GetName] ชะงักงัน"
 mtg_britain.74.d: "สงครามของเรากับ [PAK.GetNameDef] ชะงักงัน และมติมหาชนเริ่มตอตานการสูญเสียชีวิตอยางไรความหมาย โดยที่สงครามไมมีวี่แววจะสิ้นสุด บางทีนี่อาจเปนเวลาที่ดีที่จะเริ่มเจรจาสันติภาพ?"
 mtg_britain.74.a: "ถึงเวลายอมรับเอกราชของพวกเขาแลว"
 mtg_britain.74.b: "เราจะไมมีวันยอมรับเอกราชของพวกเขา!"
 mtg_britain.75.t: "[RAJ.GetName] รับรองเอกราชของเรา"
 mtg_britain.75.d: "[RAJ.GetNameDef] จําตองยอมรับเอกราชของเรา เมื่อแรงสนับสนุนภายในประเทศดิ่งลง พวกเขาเห็นวาไมมีประโยชนที่จะสูสงครามอันทรหดนี้ตอไป"
 mtg_britain.75.a: "ในที่สุด"
 mtg_britain.76.t: "สงครามกลางเมืองปากีสถาน"
 mtg_britain.76.d: "ความแตกตางทางวัฒนธรรมระหวาง[PAK.GetName]ตะวันออกและตะวันตกกอใหเกิดความตึงเครียดมากขึ้นเรื่อย ๆ และบัดนี้ชาวบังกลาเทศไดลุกฮือขึ้นตอตานสิ่งที่พวกเขามองวาเปน 'การกดขี่ของเรา' อยางเปดเผย เราคงไมอาจนําพื้นที่นี้กลับมาอยูใตการควบคุมไดโดยไมเสียเลือดเนื้อ..."
 mtg_britain.76.a: "ถาเชนนั้นก็ตองเสียเลือดเนื้อ"
 mtg_britain.76.b: "มันไรความหมาย เราตองยอมรับเอกราชของพวกเขา"
 mtg_britain.77.t: "สงครามกลางเมืองกับ [BAN.GetName] ชะงักงัน"
 mtg_britain.77.d: "สงครามของเรากับ [BAN.GetNameDef] ชะงักงัน และมติมหาชนเริ่มตอตานการสูญเสียชีวิตอยางไรความหมาย โดยที่สงครามไมมีวี่แววจะสิ้นสุด บางทีนี่อาจเปนเวลาที่ดีที่จะเริ่มเจรจาสันติภาพ?"
 mtg_britain.77.a: "ถึงเวลายอมรับเอกราชของพวกเขาแลว"
 mtg_britain.77.b: "เราจะไมมีวันยอมรับเอกราชของพวกเขา!"
 mtg_britain.78.t: "[PAK.GetName] รับรองเอกราชของเรา"
 mtg_britain.78.d: "[PAK.GetNameDef] จําตองยอมรับเอกราชของเรา เมื่อแรงสนับสนุนภายในประเทศดิ่งลง พวกเขาเห็นวาไมมีประโยชนที่จะสูสงครามอันทรหดนี้ตอไป"
 mtg_britain.79.t: "[From.GetNameDefCap] เรียกรองใหยอมทําตาม"
 mtg_britain.79.d: "[From.GetNameDefCap] แจงเราวาตองการผานดินแดนของเราเพื่อโจมตีศัตรูของพวกเขา คือ [SOV.GetNameDef] พวกเขาเรียกรองใหเรายอมทําตามโดยทันที พรอมทั้งยอมใหกํากับดูแลรัฐบาลอยางกวางขวาง หากเราไมยอม พวกเขาบอกวาไมมีทางเลือกนอกจากเคลื่อนกําลังผานดินแดนของเราโดยไมตองไดรับความยินยอม..."
 mtg_britain.79.a: "อยางนอยดวยวิธีนี้เราก็ไมตองสูกับโซเวียตเพียงลําพัง"
 mtg_britain.79.b: "ขามศพเราไปกอนเถอะ ถาอยากใหเรายอม!"
 mtg_britain.80.t: "[From.GetNameDefCap] ยอมรับขอเรียกรอง"
 mtg_britain.80.d: "[From.GetNameDefCap] ยอมรับขอเรียกรองของเรา และมอบอํานาจควบคุมดินแดนของพวกเขาใหเราอยางกวางขวาง"
 mtg_britain.80.a: "ดีมาก ผานคอเคซัสมุงสูสตาลินกราด!"
 mtg_britain.81.t: "[From.GetName] ปฏิเสธขอเรียกรอง"
 mtg_britain.81.d: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา ผูแทนของพวกเขากลาววา "ถาอยากใหเรายอม ก็ตองขามศพเราไปกอน!""
 mtg_britain.81.a: "พวกเขาหาเรื่องเอง"
 mtg_britain.82.t: "การประชุมจักรวรรดิ [?global.year|0]"
 mtg_britain.82.d: "ตลอดสองเดือนขางหนา ผูแทนจากรัฐบาลอังกฤษและประเทศในเครือจักรภพจะมาประชุมกันที่ลอนดอนเพื่อหารือเรื่องที่เกี่ยวของกับทั้งจักรวรรดิ นี่เปนโอกาสอันดีที่จะหารือเรื่องตาง ๆ เชน การปองกัน การคา หรือนโยบายเอาใจผูรุกราน ซึ่งหวังวาจะชวยใหจักรวรรดิมีโอกาสดีที่สุดในการผานพนวิกฤตปจจุบัน\n\nนอกจากนี้ อาจเปนเวลาที่ดีที่สุดที่จะยุติปญหาเรื่องสหพันธจักรวรรดิใหเด็ดขาด ซึ่งถูกยกขึ้นมาหลายครั้งแลวในการประชุมจักรวรรดิครั้งกอน ๆ อนาคตของเครือจักรภพแหงประชาชาติบริติชจะเปนเพียงการรวมกลุมหลวม ๆ ของชาติที่เปนเอกราชและมีอธิปไตย หรือจะเปนสหพันธที่เหนียวแนนซึ่งยืนหยัดไดอยางมั่นคงทามกลางความปนปวนของโลก อาจถูกตัดสินในอีกไมกี่เดือนขางหนานี้"
 mtg_britain.82.a: "ผลักดันวาระของเรากันเถิด"
 mtg_britain.82.b: "ใหเสียงของเราไดรับการรับฟง!"
 mtg_britain.82_tt: "ตัวปรับคาความสัมพันธนี้จะถูกนําออกเมื่อการประชุมสิ้นสุดลง ยิ่งผูเขารวมมีความสัมพันธที่ดีมากเทาใด ก็ยิ่งมีโอกาสที่พวกเขาจะเห็นดวยกับขอเสนอของคุณมากขึ้นเทานั้น\n"
 mtg_britain.83.t: "การประชุมจักรวรรดิ: การปองกัน"
 mtg_britain.83.d: "ในภาวะวิกฤตของโลกขณะนี้ เห็นไดชัดวาเราไมอาจแบกรับภาระการปองกันจักรวรรดิไวแตเพียงผูเดียวไดอีกตอไป และตองพึ่งพาประเทศในเครือจักรภพมากขึ้น แตละรัฐตองเพิ่มงบประมาณดานการปองกันของตน เพื่อใหทั้งจักรวรรดิแข็งแกรงขึ้นรับมือกับทุกสิ่งที่โลกอาจโยนใสเรา"
 mtg_britain.83.a: "หวังวาประเทศในเครือจักรภพจะเห็นดวย"
 mtg_britain.83.b: "ใชความพยายามทางการทูตเพื่อโนมนาวประเทศในเครือจักรภพใหเห็นดวย"
 mtg_britain.83.c: "ใชความพยายามทางการทูตอยางเต็มที่เพื่อโนมนาวประเทศในเครือจักรภพใหเห็นดวย"
 mtg_britain.84.d: "ผูแทนฝาย[From.GetAdjective]ในที่ประชุมแสดงความตองการใหทั้งจักรวรรดิใชจายดานการเสริมกําลังอาวุธและการปองกันมากขึ้น หากเราเห็นดวย เราจะตองรับภาระดูแลการปองกันในพื้นที่ของตนเองใหดีขึ้น และพึ่งพาการสนับสนุนจากฝาย[From.GetAdjective]นอยลง"
 mtg_britain.84.a: "การปองกันจักรวรรดิขึ้นอยูกับพวกเราทุกคน"
 mtg_britain.84.b: "งบประมาณของเราไมเพียงพอสําหรับเรื่องนี้"
 mtg_britain.85.t: "การประชุมจักรวรรดิ: การปองกัน - [From.GetName] เห็นดวย"
 mtg_britain.85.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยกับขอเสนอเพิ่มงบประมาณดานการปองกันของเรา และใหคํามั่นวาจะดําเนินการโดยทันที"
 mtg_britain.85.a: "พวกเขาทําหนาที่ตอจักรวรรดิ"
 mtg_britain.86.t: "การประชุมจักรวรรดิ: การปองกัน - [From.GetName] ปฏิเสธ"
 mtg_britain.86.d: "รัฐบาล[From.GetAdjective]แจงเราวาไมมีกําลังพอจะเพิ่มงบประมาณดานการปองกัน จึงจําตองปฏิเสธขอเสนอของเรา"
 mtg_britain.86.a: "พวกเขาเกาะการคุมครองของเรากิน!"
 mtg_britain.87.t: "การประชุมจักรวรรดิ: การคา"
 mtg_britain.87.d: "หากจักรวรรดิจะรุงเรือง เราตองขยายขอตกลงการคาแบบใหสิทธิพิเศษที่มีอยูแลว เราเสนอใหประเทศในเครือจักรภพเพิ่มการสงออกไปยังศูนยกลางอุตสาหกรรมของเกาะบริเตน เพื่อใหเราปอนวัตถุดิบแกอุตสาหกรรมไดอยางมีประสิทธิภาพที่สุด"
 mtg_britain.88.d: "รัฐบาล[From.GetAdjective]แสดงความตองการขยายขอตกลงการคาแบบใหสิทธิพิเศษที่มีอยูแลว เพื่อเพิ่มสินคานําเขาสูศูนยกลางอุตสาหกรรมของอังกฤษ โดยใหเหตุผลวาอังกฤษที่แข็งแกรงขึ้นยอมหมายถึงจักรวรรดิที่แข็งแกรงขึ้นโดยรวม"
 mtg_britain.88.a: "ความอยูรอดของจักรวรรดิขึ้นอยูกับเรื่องนี้"
 mtg_britain.88.b: "เราจะคาขายตามที่เราพอใจ"
 mtg_britain.89.t: "การประชุมจักรวรรดิ: การคา - [From.GetName] เห็นดวย"
 mtg_britain.89.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยกับขอเสนอเพิ่มการสงออกของเรา และจะแกไขระเบียบการคาโดยไมชักชา"
 mtg_britain.89.a: "เราจะรุงเรืองไปดวยกัน"
 mtg_britain.90.t: "การประชุมจักรวรรดิ: การคา - [From.GetName] ปฏิเสธ"
 mtg_britain.90.d: "รัฐบาล[From.GetAdjective]ปฏิเสธขอเสนอเพิ่มการสงออกและขยายโครงการการคาแบบใหสิทธิพิเศษของเรา เพราะเกรงวาจะสงผลเสียตอเศรษฐกิจภายในประเทศ"
 mtg_britain.90.a: "พวกเขาคิดถึงแตตัวเอง!"
 mtg_britain.91.t: "การประชุมจักรวรรดิ: เศรษฐกิจ"
 mtg_britain.91.d: "เศรษฐกิจที่แข็งแกรงคือกระดูกสันหลังที่คํ้าจุนทั้งจักรวรรดิ จําเปนอยางยิ่งที่ประเทศในเครือจักรภพตองไมละเลยการสรางอุตสาหกรรมภายในประเทศ แตตองลงทุนอยางหนักเพื่อพัฒนาอุตสาหกรรมใหกาวหนาตอเนื่อง"
 mtg_britain.92.d: "ผูนําฝาย[From.GetAdjective]ใหเหตุผลอยางหนักแนนถึงความสําคัญของการสรางอุตสาหกรรมภายในประเทศของเรา และตองการใหเราเพิ่มการลงทุนของรัฐในภาคสวนนี้"
 mtg_britain.92.a: "เศรษฐกิจของเราตองแข็งแกรงเพื่อฝาพายุที่รออยูขางหนา"
 mtg_britain.92.b: "ตอนนี้เราไมมีเงินทุนสําหรับเรื่องนี้"
 mtg_britain.93.t: "การประชุมจักรวรรดิ: เศรษฐกิจ - [From.GetName] เห็นดวย"
 mtg_britain.93.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยกับคําขอใหเพิ่มการลงทุนในอุตสาหกรรมภายในประเทศของพวกเขา และจะจัดสรรเงินทุนนี้โดยทันที"
 mtg_britain.93.a: "การลงทุนของพวกเขาจะใหผลตอบแทนงดงาม"
 mtg_britain.94.t: "การประชุมจักรวรรดิ: เศรษฐกิจ - [From.GetName] ปฏิเสธ"
 mtg_britain.94.d: "รัฐบาล[From.GetAdjective]ปฏิเสธคําขอใหเพิ่มการลงทุนในอุตสาหกรรมภายในประเทศของพวกเขา โดยอางวาการเติบโตตามธรรมชาติจะเปนประโยชนตอภาคสวนนี้มากกวาในระยะยาว"
 mtg_britain.94.a: "พวกเขาเกาะความมั่งคั่งของเรากิน!"
 mtg_britain.95.t: "การประชุมจักรวรรดิ: นโยบายเอาใจผูรุกราน"
 mtg_britain.95.d: "นโยบายเอาใจผูรุกรานไมไดปราศจากผูวิจารณภายในจักรวรรดิ เราตองยกประเด็นนี้ขึ้นมาหารืออีกครั้ง และยอมรับวาบางทีอาจจําเปนตองเปลี่ยนทาทีทางการทูต แตการนั้นตองไดรับการสนับสนุนจากจักรวรรดิ"
 mtg_britain.96.d: "ผูนําฝาย[From.GetAdjective]ยอมรับวานโยบายเอาใจผูรุกรานอาจมีขอบกพรอง และยินดีจะยกขึ้นมาหารือ พวกเขาพรอมจะเปลี่ยนจุดยืนทางการทูต แตจะทําก็ตอเมื่อไดรับการสนับสนุนจากจักรวรรดิเทานั้น"
 mtg_britain.96.a: "บางทีเราตองยอมรับความลมเหลวของนโยบายเอาใจผูรุกราน"
 mtg_britain.96.b: "เราตองยึดมั่นในนโยบายเอาใจผูรุกรานตอไป"
 mtg_britain.97.t: "การประชุมจักรวรรดิ: นโยบายเอาใจผูรุกราน - [From.GetName] เห็นดวย"
 mtg_britain.97.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยวานโยบายเอาใจผูรุกรานถึงคราวสิ้นสุดแลว และจําเปนตองมีทาทีที่แข็งกราวขึ้นเพื่อปกปองผลประโยชนของเราทั่วโลก แมอาจนําไปสูสงครามก็ตาม"
 mtg_britain.97.a: "พวกเขามองเห็นภัยคุกคาม"
 mtg_britain.98.t: "การประชุมจักรวรรดิ: นโยบายเอาใจผูรุกราน - [From.GetName] ปฏิเสธ"
 mtg_britain.98.d: "รัฐบาล[From.GetAdjective]ไมเห็นดวยกับขอกังขาของเราตอนโยบายเอาใจผูรุกราน โดยแยงวาเราไมอาจเสี่ยงถูกลากเขาสูสงคราม และตองคงนโยบายเอาใจผูที่ตองการลองดีกับเราตอไป"
 mtg_britain.98.a: "พวกเขาไมมีกระดูกสันหลัง!"
 mtg_britain.99.t: "การประชุมจักรวรรดิ: สหพันธ"
 mtg_britain.99.d: "แนวคิดเรื่องอภิรัฐแบบสหพันธที่ครอบคลุมทั่วทั้งจักรวรรดิบริติชมีมาเกินครึ่งศตวรรษแลว แตการประชุมจักรวรรดิครั้งกอน ๆ ไมอาจหาขอยุติในเรื่องนี้ได เรามีโอกาสสุดทายเพียงครั้งเดียว กอนที่เราจะมุงไปสูการใหประเทศในเครือจักรภพปกครองตนเองจนหวนกลับไมได เราตองทําใหพวกเขาเขาใจวานี่คือทางออกที่ดีที่สุดทั้งสําหรับประชาชนของพวกเขาและสําหรับเครือจักรภพแหงประชาชาติโดยรวม"
 mtg_britain.100.d: "รัฐบาล[From.GetAdjective]เสนออีกครั้งใหจัดตั้งอภิรัฐแบบสหพันธที่ครอบคลุมทั่วทั้งจักรวรรดิบริติช ซึ่งรัฐสมาชิกทุกรัฐจะมีสิทธิ์มีเสียงในนโยบายตางประเทศและนโยบายภายในประเทศ พวกเขาบอกวานี่จะเปนทางเลือกที่เปนไปไดแทนแนวคิด 'การปกครองตนเอง' ซึ่งทายที่สุดจะทําใหเราเปนเอกราชโดยสมบูรณ"
 mtg_britain.100.a: "เราจะแข็งแกรงขึ้นเมื่ออยูรวมกัน"
 mtg_britain.100_tt: "§Rหากเห็นดวย §!§Y[FROM.GetNameDef]§!§R อาจจัดตั้ง§!§Yสหพันธจักรวรรดิ§!§R และผนวกเรา§!\n\nหากมติผาน คุณจะไดรับ:\n"
 mtg_britain.100.b: "เราจะไมมีวันยอมสละเอกราชของเรา!"
 mtg_britain.101.t: "การประชุมจักรวรรดิ: สหพันธ - [From.GetName] เห็นดวย"
 mtg_britain.101.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยกับขอเสนอสหพันธจักรวรรดิของเรา พวกเขาสนับสนุนเราเต็มที่ และจะพยายามเตรียมพรอมสําหรับการรวมเปนหนึ่งหากญัตติผาน"
 mtg_britain.101.a: "เราจะแข็งแกรงขึ้นเมื่อเปนหนึ่งเดียว"
 mtg_britain.102.t: "การประชุมจักรวรรดิ: สหพันธ - [From.GetName] ปฏิเสธ"
 mtg_britain.102.d: "รัฐบาล[From.GetAdjective]แจงเราวาไดปฏิเสธขอเสนอสหพันธจักรวรรดิของเรา พวกเขาเห็นวาแนวคิดนี้เปนการละเมิดสิทธิของประชาชนของตนที่ยอมรับไมได เพื่อใหไดมาซึ่งสิทธิในการกําหนดชะตากรรมตนเองอันมิอาจพรากไปไดของประชาชน การปกครองตนเองจึงเปนหนทางเดียวที่จะกาวไปขางหนา"
 mtg_britain.102.a: "พวกเขามองไมเห็นอนาคต..."
 mtg_britain.103.t: "การประชุมจักรวรรดิ: สหพันธ - สําเร็จ"
 mtg_britain.103.d: "ญัตติสหพันธจักรวรรดิผานอยางเปนเอกฉันท บัดนี้ทุกฝายที่เกี่ยวของจะตองเริ่มกระบวนการอันยาวนานในการปรับโครงสรางและบูรณาการรัฐบาลของตนในระดับสหพันธ เพื่อนําไปสูการรวมดินแดนของเราเปนหนึ่งเดียวโดยสมบูรณในทายที่สุด"
 mtg_britain.103.a: "วาระประวัติศาสตรของจักรวรรดิ!"
 mtg_britain.104.t: "การประชุมจักรวรรดิ: สหพันธ - สําเร็จบางสวน"
 mtg_britain.104.d: "ญัตติสหพันธจักรวรรดิมาถึงทางตัน แม [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef] และ [NZL.GetNameDef] จะเห็นดวย แตรัฐบาล[RAJ.GetAdjective]อางความแตกตางทางวัฒนธรรมขั้นพื้นฐาน รวมถึงการไมเคารพสิทธิของรัฐอินเดียอยางเพียงพอ เปนเหตุผลในการปฏิเสธญัตติของเรา\n\nบัดนี้เราตองตัดสินใจวาจะเดินหนาตอกับประเทศในเครือจักรภพที่เห็นดวย ซึ่งหมายถึงการมอบเอกราชให [RAJ.GetNameDef] หรือจะระงับขอเสนอนี้ไปทั้งหมด"
 mtg_britain.104.a: "ถาเชนนั้นเสนทางของเราตองแยกจากกันที่นี่"
 mtg_britain.104.b: "หากไมมีอินเดีย เราก็ไมเหลืออะไร"
 mtg_britain.105.t: "การประชุมจักรวรรดิ: สหพันธ - ลมเหลว"
 mtg_britain.105.d: "เมื่อไมไดรับการสนับสนุนอยางเปนเอกฉันท ญัตติสหพันธจักรวรรดิจึงตกไป และเมื่อความสนใจในทางเลือกแทนการปกครองตนเองนี้ดูจะลดลงแทนที่จะเพิ่มขึ้น ขอเสนอนี้จะถูกตัดออกจากวาระการประชุมจักรวรรดิในอนาคตอยางเด็ดขาด เราจะมุงหนาสูการบรรลุเอกราชโดยสมบูรณในทายที่สุดตอไป"
 mtg_britain.105.a: "ถาเชนนั้น เรามามุงเปาหมายที่เปนไปไดมากกวากันเถิด"
 mtg_britain.106.t: "[From.GetName] เรียกรองใหปฏิบัติตามสนธิสัญญา"
 mtg_britain.106.d: "[From.GetNameDefCap] ยื่นคําขาดเรียกรองใหเราลดจํานวนเรือหลักลงโดยทันที เพื่อใหกลับมาสอดคลองกับขอกําหนดของสนธิสัญญานาวีวอชิงตัน พวกเขากลาวเสริมวาหากเราไมปฏิบัติตามภายใน 60 วัน พวกเขาพรอมจะลดจํานวนเรือหลักของเราดวยการใชกําลังทหาร"
 mtg_britain.106.a: "พวกเขากลัวเรา"
 mtg_britain.107.t: "[From.GetName] ปฏิบัติตามสนธิสัญญา"
 mtg_britain.107.d: "ผูแทนฝาย[From.GetAdjective]ขออภัยเปนการใหญที่ละเมิดสนธิสัญญานาวีวอชิงตัน และยืนยันกับเราวาไดลดจํานวนเรือหลักลงใหสอดคลองกับขอกําหนดของสนธิสัญญาแลว"
 mtg_britain.107.a: "อยาใหเกิดขึ้นอีก"
 mtg_britain.108.t: "[From.GetName] ฝาฝนสนธิสัญญา"
 mtg_britain.108.d: "ฝาย[From.GetAdjective]เงียบกริบในเรื่องพันธกรณีตามสนธิสัญญา ไมมีวี่แววใด ๆ วาจะลดจํานวนเรือหลักลง"
 mtg_britain.108.a: "พวกเขาจะไมกลาขัดขืนเราอีก"
 mtg_britain.200.t: "[FROM.GetNameDefCap] พยายามสถาปนาระบอบ[FROM.GetRulingIdeology]"
 mtg_britain.200.d: "ในเหตุการณที่พลิกผันอยางนาตกตะลึง รัฐบาลของ [FROM.GetLeader] พยายามระดมแรงสนับสนุนใน [ROOT.GetName] เพื่อเปลี่ยนพรรครัฐบาลของเราใหเปน[FROM.GetRulingIdeology]"
 mtg_britain.200.a: "ยอมตามไวปลอดภัยกวา"
 mtg_britain.200.b: "ขามศพเราไปกอน!"
 mtg_britain.200.tt: "§Rเรื่องนี้อาจสงผลรายแรง§!"
 mtg_britain.201.t: "[FROM.GetNameDefCap] ปฏิเสธการเปลี่ยนระบอบ"
 mtg_britain.201.d: "ในการแสดงความไมภักดีอยางนาตกตะลึง [FROM.GetLeader] ประกาศปฏิเสธที่จะยอมตามความตองการของ [ROOT.GetLeader] ในเรื่องบทบาทของ[ROOT.GetRulingIdeology]ในรัฐบาลของพวกเขา หนทางเดียวที่เราจะเปลี่ยนระบอบไดในตอนนี้คือการทําสงครามกับ [FROM.GetNameDef]"
 mtg_britain.201.a: "เลิกพูดเรื่องนี้เถิด ความเปนเอกภาพสําคัญกวา"
 mtg_britain.201.b: "สงครามเทานั้น"
 mtg_britain.202.t: "[FROM.GetNameDefCap] ประกาศสงคราม"
 mtg_britain.202.d: "ดูเหมือน [FROM.GetLeader] จะไมพอใจการปฏิเสธของเราอยางมาก ถึงขั้นประกาศสงครามอยางเปนทางการ!"
 mtg_britain.202.a: "บางสิ่งก็คุมคาที่จะตอสูเพื่อมัน"
 mtg_britain.203.t: "[FROM.GetNameDefCap] ยุติเรื่องการเปลี่ยนระบอบ"
 mtg_britain.203.d: "ในสาสนจาก [FROM.GetLeader] พวกเขาประกาศยอมรับการปฏิเสธของเรา โดยอางถึงความจําเปนในการรักษาเอกภาพของเครือจักรภพ"
 mtg_britain.203.a: "ไมทําสงครามกับประเทศแม"
 panay_inc_opinion_modifier: "กรณีเรือพาเนย"
 panay_inc2_opinion_modifier: "การโจมตีเรือ HMS Ladybird"
 panay_incident.2.t: "เรือ USS Panay ถูกจมในจีน!"
 panay_incident.2.d: "เรือปน USS Panay ถูกโจมตีเมื่อชวงตนวันนี้ ขณะกําลังอพยพพลเรือนจากแนวหนาของสงครามระหวาง [JAP.GetName] กับ [CHI.GetName] ทั้งที่ประดับธง[USA.GetAdjective]ไวอยางชัดเจน เรือถูกระเบิดสองลูกและจมลงในชวงหลังของวัน มีพลเมืองสหรัฐฯ เสียชีวิตสามรายและบาดเจ็บอีกจํานวนมาก ผูรอดชีวิตไดรับการชวยเหลือจากเรือปน[USA.GetAdjective]และ[ENG.GetAdjective]ที่อยูในพื้นที่\n\n[JAP.GetNameDef] รีบออกมาอางวาเปนอุบัติเหตุและขออภัย แตบางคนเชื่อวาการโจมตีครั้งนี้เปนการจงใจ และที่ปรึกษาจํานวนหนึ่งเรียกรองใหทําสงคราม อยางไรก็ตาม การสนับสนุนสงครามจากสาธารณชนยังคงตํ่า และการประกาศสงครามใด ๆ นาจะสรางความแตกแยกอยางรุนแรง เราควรตอบสนองอยางไร?"
 panay_incident.2.e: "เรือปน USS Panay ถูกโจมตีเมื่อชวงตนวันนี้ ขณะกําลังอพยพพลเรือนจากแนวหนาของสงครามระหวาง [JAP.GetName] กับ [CHI.GetName] ทั้งที่ประดับธง[USA.GetAdjective]ไวอยางชัดเจน เรือถูกระเบิดสองลูกและจมลงในชวงหลังของวัน มีพลเมืองสหรัฐฯ เสียชีวิตสามรายและบาดเจ็บอีกจํานวนมาก ผูรอดชีวิตไดรับการชวยเหลือจากเรือปน[USA.GetAdjective]และ[ENG.GetAdjective]ที่อยูในพื้นที่\n\n[JAP.GetNameDef] รีบออกมาอางวาเปนอุบัติเหตุและขออภัย แตบางคนเชื่อวาการโจมตีครั้งนี้เปนการจงใจ และที่ปรึกษาจํานวนหนึ่งเรียกรองใหทําสงคราม เราควรตอบสนองอยางไร?"
 panay_incident.2.a: "ถอนกําลังของเราออกจากจีน"
 panay_incident.2.a.tt: "สาธารณชนกังวลอยางยิ่งกับการเขาไปพัวพันกับตางประเทศ เหตุการณนี้คงไมเกิดขึ้นหากทหารของเราไมไดอยูใน [CHI.GetName] ตั้งแตแรก การถอนเรือปนและกําลังพลจํานวนเล็กนอยในจีนออกมาจะชวยเพิ่มเสถียรภาพภายในประเทศ แตก็จะทําใหเราหางไกลจากการแทรกแซงทางทหารในอนาคตมากขึ้นดวย\n\n"
 panay_incident.2.e.tt: "ขณะที่การสนับสนุนสงครามกําลังเพิ่มขึ้น การถอนตัวจาก [CHI.GetName] ตอนนี้จะบั่นทอนความพยายามสรางความชอบธรรมใหการใชกําลังทหารในอนาคต แตการทําใหสาธารณชนมั่นใจวาเราตองการสันติภาพก็นาจะชวยเสถียรภาพภายในประเทศ\n\n"
 panay_incident.2.b: "เรียกรองคาชดเชย"
 panay_incident.2.b.tt: "ขอเรียกรองของเราจะถูกสงถึงรัฐบาลญี่ปุน และเราควรรอฟงคําตอบ\n\n"
 panay_incident.2.c: "สงคราม!"
 panay_incident.2.c.tt: "แมฐานอุตสาหกรรมที่แข็งแกรงกวามากของเราจะเปนขอไดเปรียบสําคัญ แตการสนับสนุนจากสาธารณชนที่ตํ่าจะทําใหสงครามเปนเรื่องเสี่ยง และจํากัดความสามารถของเราในการเขาไปมีบทบาทในสถานการณอื่น ๆ ของโลก\n\n"
 panay_incident.3.t: "[USA.GetName] เรียกรองคําขอโทษและคาชดเชย"
 panay_incident.3.d: "เพื่อตอบโตการที่เราจมเรือ USS Panay เมื่อตนสัปดาหนี้ [USA.GetNameDef] เรียกรองคําขอโทษ การลงโทษนายทหารที่เกี่ยวของ และคาชดเชย แมการโจมตีครั้งนี้ไมไดมาจากคําสั่งของรัฐบาล แตก็ยังไมชัดเจนนักวาเปนความผิดพลาดของนักบินที่ใจรอนเกินไป หรือเปนความพยายามของฝายทหารหัวรุนแรงที่จะกดดันให [USA.GetNameDef] และ [ENG.GetName] ถอนกําลังออกจาก [CHI.GetName] บางคนในรัฐบาลคงไมพอใจหากเรายอมตามเงื่อนไขของฝาย[USA.GetAdjective] แตการปฏิเสธอาจหมายถึงสงคราม"
 panay_incident.3.a: "ยอมรับเงื่อนไขของฝาย[USA.GetAdjective]"
 panay_incident.3.b: "เราจะไมมีวันกมหัวใหพวกตะวันตกที่เสื่อมทราม!"
 panay_incident.3.b.tt: "การปฏิเสธเงื่อนไขของฝาย[USA.GetAdjective]จะถูกมองวาเปนการแสดงความแข็งแกรงภายในประเทศ และเพิ่มการสนับสนุนตอรัฐบาลของเรา แตคุมกับความเสี่ยงที่จะเกิดสงครามกับ [USA.GetNameDef] หรือไม?\n\n"
 panay_incident.4.t: "[JAP.GetName] ยอมจายคาชดเชย"
 panay_incident.4.d: "เราไดรับคําตอบจากเอกอัครราชทูต[JAP.GetAdjective] ซึ่งยอมรับขอเรียกรองคาชดเชยกรณีการจมเรือ USS Panay  แมทัศนคติของสาธารณชนใน [USA.GetNameDef] ที่มีตอ [JAP.GetName] จะยังไดรับอิทธิพลจากเหตุการณนี้ไปอีกระยะหนึ่ง แตสงครามก็\nถูกหลีกเลี่ยงไปไดแลว"
 panay_incident.4.a: "โชคดีที่ [JAP.GetName] ยังมีเหตุผล"
 panay_incident.5.t: "[JAP.GetName] ปฏิเสธการจายคาชดเชย"
 panay_incident.5.d: "เห็นไดชัดวาคําขอโทษของฝาย[JAP.GetAdjective]กรณีการจมเรือ USS Panay เปนเพียงลมปาก เพราะพวกเขาปฏิเสธคําขอคาชดเชยของเราอยางไมไยดี ทําใหเราตกอยูในสถานการณลําบาก เพราะประเทศยังไมพรอมสําหรับสงครามที่ไมเปนที่นิยม แตการถอยจะทําใหเราเสียหายทางการเมืองและตอกยํ้าจุดยืนตอตานการแทรกแซงของสาธารณชน อยางไรก็ตาม การถอยหางจากสงครามจะทําใหผูมีสิทธิเลือกตั้งมั่นใจวารัฐบาลพูดจริงเรื่องการหลีกเลี่ยงการพัวพันกับตางประเทศ"
 panay_incident.5.a: "สงครามไมไดทําใหเรือ USS Panay กลับคืนมา"
 panay_incident.5.b: "เราจะทําให [JAP.GetName] ตองชดใช!"
 panay_incident.6.t: "[USA.GetName] ถอนตัวออกจากจีน"
 panay_incident.6.d: "การสูญเสียเรือ USS Panay ทําใหเกิดความหวาดกลัวสงครามใน [USA.GetNameDef] นักการเมือง[USA.GetAdjective]ซึ่งเห็นไดชัดวาไมตองการเผชิญหนา ไดล็อบบี้จนสําเร็จใหถอนเรือปนและกําลังพล[USA.GetAdjective]ที่เหลือทั้งหมดออกจากจีน"
 panay_incident.6.a: "ความออนแอของพวกเขาคือความแข็งแกรงของเรา"
 mtg_netherlands.1.t: "เวเนซุเอลาเสนอ 'คุมครอง' หมูเกาะ ABC"
 mtg_netherlands.1.d: "โดยอางถึงความออนแอทางทหารของเราในขณะนี้ หลังจากมาตุภูมิของเราถูกรุกราน รัฐบาล[VEN.GetAdjective]ไดยื่นขอเสนอจะ 'ชวยคุมครอง' หมูเกาะ ABC จากการโจมตีของศัตรู แตนาสงสัยวาพวกเขาจะยอมจากไปหรือไมเมื่อไมตองการความชวยเหลือแลว..."
 mtg_netherlands.1.a: "ไมใชทางที่ดีนัก แตเราไมมีทางเลือก"
 mtg_netherlands.1.b: "ไม! พวกเขาแคอยากไดหมูเกาะไปเปนของตัวเอง"
 mtg_netherlands.1.c: "มอบการควบคุมใหอังกฤษแทน กอนที่สถานการณจะบานปลาย"
 mtg_netherlands.1.e: "มอบการควบคุมใหอเมริกาแทน กอนที่สถานการณจะบานปลาย"
 mtg_netherlands.2.t: "[From.GetNameDefCap] ตอบรับขอเสนอของเรา"
 mtg_netherlands.2.d: "รัฐบาล[HOL.GetAdjective]ตอบรับขอเสนอของเราที่จะให 'การคุมครอง' หมูเกาะ ABC แลว"
 mtg_netherlands.2.a: "แผนของเราสําเร็จ"
 mtg_netherlands.3.t: "[From.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 mtg_netherlands.3.d: "รัฐบาล[HOL.GetAdjective]ปฏิเสธขอเสนอของเราที่จะให 'การคุมครอง' หมูเกาะ ABC"
 mtg_netherlands.3.a: "เราจะไมปลอยเรื่องนี้ไปงาย ๆ!"
 mtg_netherlands.4.t: "[From.GetNameDefCap] ขอใหเราคุมครองหมูเกาะ ABC"
 mtg_netherlands.4.d: "รัฐบาล[HOL.GetAdjective]ขอใหเรารับหนาที่คุมครองกือราเซา พวกเขาถูกชาวเวเนซุเอลาติดตอมาโดยอางวา 'เสนอการคุมครอง' และเกรงวาจะเกิดการสูรบขึ้นหากปฏิเสธ 'ขอเสนอ' ของฝาย[VEN.GetAdjective]"
 mtg_netherlands.4.a: "เราจะรับภาระนี้ไว"
 mtg_netherlands.4.b: "เราไมอาจเขาไปพัวพันกับขอพิพาทดินแดนในทองถิ่นได"
 mtg_netherlands.5.t: "[From.GetNameDefCap] ตอบรับการคุมครองหมูเกาะ ABC"
 mtg_netherlands.5.d: "[From.GetNameDefCap] ตัดสินใจรับหนาที่ดูแลรับผิดชอบหมูเกาะ ABC แลว"
 mtg_netherlands.5.a: "ยังดีกวาทางเลือกอื่น"
 mtg_netherlands.6.t: "[From.GetNameDefCap] ปฏิเสธการคุมครองหมูเกาะ ABC"
 mtg_netherlands.6.d: "[From.GetNameDefCap] ตัดสินใจปฏิเสธการรับหนาที่ดูแลรับผิดชอบหมูเกาะ ABC โดยบอกวาไมอาจเขาไปพัวพันกับสิ่งที่พวกเขาเรียกวา 'ขอพิพาทดินแดนในทองถิ่น' ได"
 mtg_netherlands.6.a: "ถาเชนนั้นเราก็ไมมีทางเลือกนอกจากรับขอเสนอของฝาย[VEN.GetAdjective]"
 mtg_netherlands.6.b: "ชางเถอะ ยังไงชาวเวเนซุเอลาก็ไมไดมันไปหรอก!"
 ven_claims_abc_islands: "§Yเวเนซุเอลา§! เสนอจะ 'คุมครอง' §Yกือราเซา§!\n"
 mtg_netherlands.7.t: "[From.GetNameDefCap] ขอแบบแปลนเรือลาดตระเวนประจัญบาน"
 mtg_netherlands.7.d: "[From.GetNameDefCap] ขอใหเราแบงปนแบบแปลนเรือลาดตระเวนประจัญบานชั้นชารนฮอรสต พวกเขาตองการนําไปสราง "Design 1047 Battlecruiser" ของตนเอง เพื่อใชแสดงแสนยานุภาพในอาณานิคมหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.7.a: "ทําไมจะไมได"
 mtg_netherlands.7.b: "ไม พวกเขาออกแบบเรือเองได"
 mtg_netherlands.8.t: "[From.GetNameDefCap] แบงปนแบบแปลนเรือลาดตระเวนประจัญบาน"
 mtg_netherlands.8.d: "[From.GetNameDefCap] ตัดสินใจแบงปนแบบแปลนเรือลาดตระเวนประจัญบานชั้นชารนฮอรสตใหเรา"
 mtg_netherlands.8.a: "ขาวดี!"
 mtg_netherlands.9.t: "[From.GetNameDefCap] ปฏิเสธการแบงปนแบบแปลนเรือลาดตระเวนประจัญบาน"
 mtg_netherlands.9.d: "[From.GetNameDefCap] ตัดสินใจไมแบงปนแบบแปลนเรือลาดตระเวนประจัญบานชั้นชารนฮอรสตใหเรา"
 mtg_netherlands.9.a: "นาเสียดายยิ่งนัก..."
 mtg_netherlands.10.t: "จัดตั้งรัฐบาลใหม"
 mtg_netherlands.10.d: "คณะรัฐมนตรีชุดที่หาของคอไลนลมสลายลงอีกครั้งเชนเดียวกับชุดกอน ๆ และรัฐมนตรีแหงรัฐ เดิรก ยัน เดอ เคร ไดรับการทาบทามใหรับผิดชอบจัดตั้งรัฐบาลใหม เขาเคยดํารงตําแหนงครั้งลาสุดในป 1933 และพิสูจนแลววามีความสามารถรับใชประเทศในยามสงบ แตเมื่อความตึงเครียดของโลกเพิ่มสูงขึ้น ก็ยังไมชัดเจนวานายกรัฐมนตรีคนใหมจะนําประเทศในสงครามที่ดูจะเกิดขึ้นแนไดอยางไร"
 mtg_netherlands.10.a: "หวังวาจะมีเสถียรภาพมากกวาชุดที่แลว"
 mtg_netherlands.11.t: "ญี่ปุนสนใจหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.11.d: "ไมใชความลับวาญี่ปุนสนใจทรัพยากรในหมูเกาะอินเดียตะวันออกของเราอยางมาก เรามีทางเลือกสองทาง คือมอบสิทธิ์เฉพาะในทรัพยากรที่ญี่ปุนตองการในอาณานิคมของเรา หรือยกการควบคุมอาณานิคมทั้งหมดใหพวกเขาไปเลย หากเราตองการรักษาความสัมพันธอันสงบสุขกับ [JAP.GetNameDef] เราจะตองเลือก"
 mtg_netherlands.11.a: "ยกการควบคุมหมูเกาะใหพวกเขา"
 mtg_netherlands.11.b: "สัญญาวาจะสงทรัพยากรสําคัญใหในปริมาณมาก"
 mtg_netherlands.12.t: "[From.GetNameDefCap] เสนอยกการควบคุมหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.12.d: "เพื่อรักษาสันติภาพ และดวยรูวาเราสนใจพื้นที่อันอุดมดวยทรัพยากรแหงนี้ [From.GetNameDefCap] จึงเสนอโอนหมูเกาะอินเดียตะวันออกทั้งหมดมาอยูใตการควบคุมของเรา"
 mtg_netherlands.12.a: "นี่เปนทางออกที่ยอมรับไดสําหรับปญหาของเรา"
 mtg_netherlands.12.b: "พวกเขาเก็บอาณานิคมไวเถิด เรามีทางออกอื่น"
 mtg_netherlands.13.t: "[From.GetNameDefCap] เสนอสงทรัพยากรจากหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.13.d: "เพื่อรักษาสันติภาพ และดวยรูวาเราสนใจพื้นที่อันอุดมดวยทรัพยากรแหงนี้ [From.GetNameDefCap] จึงคิดหาทางออกขึ้นมา แทนที่จะยกการควบคุมพื้นที่ใหเราโดยตรง พวกเขาเสนอใหสิทธิ์แตเพียงผูเดียวในทรัพยากรที่พบที่นั่นแกเรา"
 mtg_netherlands.13.a: "นี่เปนการประนีประนอมที่ยอมรับได"
 mtg_netherlands.13.b: "'การประนีประนอม' นี้ยังไมดีพอ"
 mtg_netherlands.14.t: "สมเด็จพระราชินีทรงปลดรัฐมนตรีฝายยอมแพ"
 mtg_netherlands.14.d: "ดวยทรงเบื่อหนายกับลัทธิยอมแพที่แผซานไปทั่วรัฐบาล สมเด็จพระราชินีวิลเฮลมินาจึงทรงผลักดันใหปลดรัฐมนตรีที่มีความผิด นายกรัฐมนตรีเดอ เครไดรับอนุญาตใหลาออกดวย 'เหตุผลดานสุขภาพ' แทนที่จะตองเสียหนาตอสาธารณะ หวังวาเขาจะไมสรางปญหาใหเราอีกในอนาคต...\n\nผูมาแทนที่คือ ปเตอร โชเอิรดส แครบรันดี ซึ่งโดดเดนแลวจากการปฏิเสธทัศนคติยอมแพของเดอ เคร หากเขายังคงทัศนคตินี้ตลอดสงคราม เขาจะเปนแบบอยางที่ดีแกคณะรัฐมนตรีที่เหลือ"
 mtg_netherlands.14.a: "หากมีผูคนแนวแนอยางพระองคมากกวานี้ก็คงดี"
 mtg_netherlands.15.t: "[From.GetNameDefCap] เสนอสหเนเธอรแลนด"
 mtg_netherlands.15.d: "[From.GetNameDefCap] ยื่นขอเสนอใหฟนฟูรัฐกันชนสหเนเธอรแลนดที่เคยมีอยูหลังสงครามนโปเลียน โดยอางถึงการมีสวนรวมในความพยายามทําสงครามของพวกเขา เทียบกับความไรประโยชนของชาวเบลเยียมและลักเซมเบิรก วาเปนเหตุผลที่พวกเขาไมเพียงควรไดรับรางวัล แตแผนนี้ยังจะชวยรักษาสันติภาพในภาคพื้นทวีปในอนาคตดวย"
 mtg_netherlands.15.a: "ความคิดที่ยอดเยี่ยม"
 mtg_netherlands.15.b: "เราวาไมดีกวา"
 mtg_netherlands.16.t: "[From.GetNameDefCap] สนับสนุนขอเสนอสหเนเธอรแลนด"
 mtg_netherlands.16.d: "อังกฤษตอบรับขอเสนอรวมกลุมประเทศแผนดินตํ่าของเราดวยดี เราสามารถเริ่มเตรียมการผนวกรวมดินแดนเมื่อไดรับการปลดปลอยแลว"
 mtg_netherlands.16.a: "ขาวดีอยางยิ่ง"
 mtg_netherlands.17.t: "[From.GetNameDefCap] ปฏิเสธขอเสนอสหเนเธอรแลนด"
 mtg_netherlands.17.d: "อังกฤษแสดงใหเห็นชัดวาไมไดเห็นดีกับขอเสนอรวมกลุมประเทศแผนดินตํ่าของเรา"
 mtg_netherlands.17.a: "ชางเนรคุณเสียเหลือเกิน..."
 mtg_netherlands.18.d: "เราทราบมาวาอังกฤษไดตอบรับขอเสนอของดัตชที่จะรวมกลุมประเทศแผนดินตํ่าไวใตธงดัตช โดยที่ผูแทนรัฐบาลของเราไมไดรับการปรึกษาเลย..."
 mtg_netherlands.18.a: "เปลวไฟแหงเสรีภาพตองมาดับลงเชนนี้หรือ?"
 mtg_netherlands.19.t: "[From.GetNameDefCap] เชิญเขารวมเบเนลักซ"
 mtg_netherlands.19.d: "ผูแทนฝาย[HOL.GetAdjective]ติดตอเรามาพรอมขอเสนอความรวมมืออยางใกลชิดระหวางชาติตาง ๆ ในกลุมประเทศแผนดินตํ่า และบัดนี้ตองการการสนับสนุนอยางเปนทางการจากเราสําหรับโครงการนี้"
 mtg_netherlands.19.a: "เปนความคิดที่ยอดเยี่ยมยิ่งนัก!"
 mtg_netherlands.19.b: "เราไมสนใจ"
 mtg_netherlands.20.t: "[From.GetNameDefCap] เชิญเขารวมสหภาพยุโรป"
 mtg_netherlands.20.d: "ผูแทนฝาย[HOL.GetAdjective]ติดตอเรามาพรอมขอเสนอความรวมมืออยางใกลชิดระหวางชาติประชาธิปไตยขนาดเล็กในยุโรป และบัดนี้ตองการการสนับสนุนอยางเปนทางการจากเราสําหรับโครงการนี้"
 mtg_netherlands.21.t: "[From.GetNameDefCap] หมายรวมอาณานิคมเขาดวยกัน"
 mtg_netherlands.21.d: "จากการติดตอกันที่ผานมา เห็นไดชัดวา [From.GetNameDefCap] กําลังหาทางควบคุมกิจการของเราใหมั่นคง... หนวยงานรัฐยอย ๆ บางแหงที่ซํ้าซอนถูกมองวา 'ไมจําเปน' แลว และนับจากนี้จะถูกบริหารโดยตรงจากอัมสเตอรดัม"
 mtg_netherlands.21.a: "ถาพวกเขาคิดวาแบบนั้นดีกวา..."
 mtg_netherlands.22.t: "[From.GetNameDefCap] ยายเมืองหลวงไปปตตาเวีย"
 mtg_netherlands.22.d: "ผูแทนจากรัฐบาลพลัดถิ่นแจงเราวารัฐบาลจะยายไปยังปตตาเวีย และนับจากนี้จะบริหารอาณานิคมโดยตรงจากที่นั่น เราไมจําเปนตองใหบริการอีกตอไป"
 mtg_netherlands.22.a: "บางทีเราอาจรับใชรัฐบาลใหมในทางอื่นได..."
 mtg_netherlands.23.t: "[From.GetNameDefCap] ตอบรับการโอนหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.23.d: "[From.GetNameDefCap] ตอบรับขอเสนอของเราที่จะเขาครอบครองหมูเกาะอินเดียตะวันออกทั้งหมด"
 mtg_netherlands.23.a: "สันติภาพไดรับการรักษาไวแลว"
 mtg_netherlands.24.t: "[From.GetNameDefCap] ตอบรับทรัพยากรจากหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.24.d: "[From.GetNameDefCap] ตอบรับขอเสนอของเราที่จะไดรับสิทธิ์แตเพียงผูเดียวในทรัพยากรของหมูเกาะอินเดียตะวันออก"
 mtg_netherlands.25.t: "[From.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 mtg_netherlands.25.d: "[From.GetNameDefCap] แจงเราวาไมสนใจขอเสนอของเรา"
 mtg_netherlands.25.a: "แปลกจริง... และนากังวลดวย..."
 mtg_netherlands.26.t: "[From.GetNameDefCap] ขอใหสหรัฐฯ คุมครองหมูเกาะเวสตอินดีส"
 mtg_netherlands.26.d: "รัฐบาล[HOL.GetAdjective]ขอใหเราคุมครองหมูเกาะเวสตอินดีส พวกเขาเกรงการโจมตีจากฝายที่สามในชวงที่กําลังออนแอทางทหาร และชี้วาการปลอยใหเกิดความขัดแยงในเขตอิทธิพลของเราอาจไมเปนประโยชนตอเรา"
 mtg_netherlands.26.a: "เราไมอาจปลอยใหตางชาติแทรกแซงในทะเลแคริบเบียน"
 mtg_netherlands.26.b: "พวกเขาไมควรมาบอกเราวาอะไรคือผลประโยชนของเรา"
 mtg_netherlands.27.t: "[From.GetNameDefCap] ตอบรับการคุมครองหมูเกาะเวสตอินดีส"
 mtg_netherlands.27.d: "[From.GetNameDefCap] ตัดสินใจรับหนาที่คุมครองหมูเกาะเวสตอินดีส อาณานิคมของเรานาจะปลอดภัยจากการโจมตี"
 mtg_netherlands.27.a: "เมื่อสหรัฐฯ อยูฝายเรา ก็ยากจะมีใครมาคุกคามพวกเขาได"
 mtg_netherlands.28.t: "[From.GetNameDefCap] ปฏิเสธการคุมครองหมูเกาะเวสตอินดีส"
 mtg_netherlands.28.d: "[From.GetNameDefCap] แจงเราวาหมูเกาะเวสตอินดีสไมใชธุระของพวกเขา และไมตองการใหคํามั่นใด ๆ เกี่ยวกับการปองกันอาณานิคมของเรา"
 mtg_netherlands.28.a: "นาผิดหวังยิ่งนัก..."
 mtg_netherlands.29.t: "[From.GetNameDefCap] ขอยุทโธปกรณ"
 mtg_netherlands.29.d: "รัฐบาล[HOL.GetAdjective]ติดตอเรามาเพื่อขอยุทโธปกรณล็อตหนึ่ง โดยแจงวาหากไมไดรับความชวยเหลือ พวกเขาจะไมสามารถติดอาวุธใหกองทัพไดทันกอนการบุก"
 mtg_netherlands.29.a: "ใหยุทโธปกรณทหารราบแกพวกเขา"
 mtg_netherlands.29.b: "ใหยุทโธปกรณสนับสนุนแกพวกเขา"
 mtg_netherlands.29.c: "ใหยุทโธปกรณปนใหญแกพวกเขา"
 mtg_netherlands.29.e: "พวกเขาตองพึ่งตัวเอง"
 mtg_netherlands.30.t: "[From.GetNameDefCap] สงยุทโธปกรณ"
 mtg_netherlands.30.d: "[From.GetNameDefCap] สงยุทโธปกรณมาใหเราล็อตหนึ่งเพื่อชวยในการฟนฟูกําลังทหาร"
 mtg_netherlands.30.a: "เราจะไมลืมความชวยเหลือของพวกเขา"
 mtg_netherlands.31.t: "[From.GetNameDefCap] ปฏิเสธการสงยุทโธปกรณ"
 mtg_netherlands.31.d: "[From.GetNameDefCap] ปฏิเสธที่จะสงยุทโธปกรณใหเรา และแนะนําใหเรามุงใชอุตสาหกรรมของเราเองผลิตเพิ่มหากจําเปน"
 mtg_netherlands.31.a: "พวกเขาประเมินกําลังการผลิตทางอุตสาหกรรมของเราสูงเกินไป..."
 mtg_netherlands.32.t: "[From.GetNameDefCap] เสนอแผนเสนาธิการรวม"
 mtg_netherlands.32.d: "ผูแทนฝาย[HOL.GetAdjective]เสนอใหรางแผนเสนาธิการลับรวมกัน เพื่อใหเราประสานการปองกันไดหากพวกเขาถูกรุกราน โดยแจงวาจําเปนอยางยิ่งที่เรื่องนี้ตองไมเปดเผยตอสาธารณะ เพราะเกรงวาการละเมิดความเปนกลางใด ๆ จะนําไปสูสงคราม..."
 mtg_netherlands.32.a: "ความคิดที่ยอดเยี่ยม!"
 mtg_netherlands.32_tt: "§Y[From.GetNameDefCap]§! จะไดรับโบนัสการปองกันของกองพลในดินแดนหลักเปนเวลา 180 วัน หลังถูกโจมตีโดยมหาอํานาจยุโรปตะวันตก\n"
 mtg_netherlands.32.b: "หากพวกเขาตองการการคุมครองจากเรา ก็ตองเขารวมกับเราอยางเปนทางการ"
 mtg_netherlands.33.t: "[From.GetNameDefCap] ตอบรับแผนเสนาธิการรวม"
 mtg_netherlands.33.d: "[From.GetNameDefCap] ตอบรับขอเสนอแผนเสนาธิการรวมของเราแลว"
 mtg_netherlands.33.a: "วิเศษมาก!"
 mtg_netherlands.33_tt: "เราจะไดรับโบนัสการปองกันของกองพลในดินแดนหลักเปนเวลา 180 วัน หลังถูกโจมตีโดยมหาอํานาจยุโรปตะวันตก\n"
 mtg_netherlands.34.t: "[From.GetNameDefCap] ปฏิเสธแผนเสนาธิการรวม"
 mtg_netherlands.34.d: "[From.GetNameDefCap] ปฏิเสธขอเสนอแผนเสนาธิการรวมของเรา หากเราตองการความชวยเหลือจากพวกเขา ก็ตองรองขออยางเปนทางการ"
 mtg_netherlands.34.a: "เปนไปไมได"
 mtg_netherlands.35.t: "[From.GetNameDefCap] ขอแลกเปลี่ยนขาวกรอง"
 mtg_netherlands.35.d: "[From.GetNameDefCap] เสนอใหแลกเปลี่ยนขาวกรองเกี่ยวกับศัตรูที่เราอาจตองเผชิญในสนามรบเมื่อสูรวมกัน"
 mtg_netherlands.35.a: "เปนความคิดที่ยอดเยี่ยม!"
 mtg_netherlands.35_tt: "§Y[From.GetNameDefCap]§! จะไดรับโบนัสการโจมตีและการปองกันเฉพาะตอผูรุกรานเปนเวลา 180 วัน หลังถูกโจมตีโดยมหาอํานาจยุโรปตะวันตก\n"
 mtg_netherlands.35_tt_2: "เราจะไดรับโบนัสการโจมตีและการปองกันเฉพาะตอมหาอํานาจยุโรปตะวันตกอีกชาติหนึ่ง หากทําสงครามกับพวกเขา\n"
 mtg_netherlands.35.b: "เราไมอาจมอบขาวกรองที่รวบรวมมาใหพวกเขาได"
 mtg_netherlands.36.t: "[From.GetNameDefCap] ตกลงแลกเปลี่ยนขาวกรอง"
 mtg_netherlands.36.d: "[From.GetNameDefCap] ตกลงแลกเปลี่ยนขาวกรองเกี่ยวกับศัตรูที่เราอาจตองเผชิญในสนามรบเมื่อสูรวมกัน"
 mtg_netherlands.36.a: "เรื่องนี้จะชวยการปองกันของเราไดมาก"
 mtg_netherlands.36_tt: "§Y[From.GetNameDefCap]§! จะไดรับโบนัสการโจมตีและการปองกันเฉพาะตอผูรุกรานเปนเวลา 180 วัน หลังทําสงครามกับมหาอํานาจยุโรปตะวันตก\n"
 mtg_netherlands.36_tt_2: "เราจะไดรับโบนัสการโจมตีและการปองกันเฉพาะตอผูรุกรานเปนเวลา 180 วัน หลังถูกโจมตีโดยมหาอํานาจยุโรปตะวันตก\n"
 mtg_netherlands.37.t: "[From.GetNameDefCap] ปฏิเสธการแลกเปลี่ยนขาวกรอง"
 mtg_netherlands.37.desc: "[From.GetNameDefCap] ปฏิเสธที่จะแบงปนขาวกรองของพวกเขา"
 mtg_netherlands.37.a: "ดูเหมือนเราจะยังไมนาไวใจพอ..."
 mtg_netherlands.41.t: "[From.GetNameDefCap] ขอใหแบงปนความรูทางทหาร"
 mtg_netherlands.41.d: "[From.GetNameDefCap] ขอใหเราแบงปนความรูทางทหารบางสวน เพื่อใหพวกเขาพัฒนาหลักนิยมทางทหารไดอยางกาวกระโดด"
 mtg_netherlands.41.a: "[From.GetName] ที่แข็งแกรงคือ [From.GetName] ที่มีประโยชน"
 mtg_netherlands.41.b: "[From.GetName] ที่ออนแอคือ [From.GetName] ที่ดีกวา"
 mtg_netherlands.42.t: "[From.GetNameDefCap] แบงปนความรูทางทหาร"
 mtg_netherlands.42.d: "[From.GetNameDefCap] แบงปนหลักนิยมและความรูทางทหารบางสวนใหเรา"
 mtg_netherlands.42.a: "เรื่องนี้จะชวยใหกองทัพของเราทันสมัยขึ้นไดมาก"
 mtg_netherlands.43.t: "[From.GetNameDefCap] ปฏิเสธการแบงปนความรูทางทหาร"
 mtg_netherlands.43.d: "[From.GetNameDefCap] ปฏิเสธที่จะแบงปนความรูทางทหารใหเรา"
 mtg_netherlands.43.a: "พวกเขาตองการใหเราออนแอตอไปหรือ?"
 mtg_netherlands.45.t: "เจาชายแบรนารดพัวพันเรื่องอื้อฉาว"
 mtg_netherlands.45.d: "ดูเหมือนเจาชายแบรนารดจะเขาไปพัวพันกับเรื่องอื้อฉาวที่นากังวล แมความเปนคนรักอิสระของพระองคบางครั้งจะเปนพร แตดูเหมือนก็กลายเปนคําสาปไดเชนกัน... บัดนี้รัฐบาลจําตองใชทรัพยากรอันมีคาไปกับการกูภาพลักษณของเจาชายตอสาธารณชน"
 mtg_netherlands.45.a: "นาเสียดายยิ่งนัก"
 mtg_netherlands.46.t: "เจาชายแบรนารดสรางความประทับใจ"
 mtg_netherlands.46.d: "เมื่อเร็ว ๆ นี้เจาชายแบรนารดสรางความประทับใจตอสาธารณชนอยางยิ่ง ปลุกขวัญกําลังใจและจุดประกายความหวังในชัยชนะครั้งสุดทายไมวาจะเสด็จไปที่ใด แมในทางเทคนิคพระองคจะไมใชตัวแทนของรัฐบาล แตก็ไมไดขัดขวางเราจากการไดประโยชนจากความสําเร็จอันไมคาดฝนนี้"
 mtg_netherlands.46.a: "ทายาทแหงราชวงศออเรนจอยางแทจริง"
 mtg_netherlands.47.t: "เจาชายแบรนารดเปนแบบอยางที่ดี"
 mtg_netherlands.47.d: "ในการปฏิสัมพันธกับเพื่อนนักบิน เจาชายแบรนารดเปนแบบอยางที่ดีทั้งดานความประพฤติและการบินรบ เมื่อแบบอยางนี้ยังติดตาอยู ผูบังคับบัญชาก็สังเกตเห็นการพัฒนาเล็กนอยแตชัดเจนในการรบทางอากาศบนนานฟาของเรา"
 mtg_netherlands.47.a: "พระองคบินไดดี"
 mtg_netherlands.48.t: "เจาชายแบรนารดเปนแบบอยางที่ไมดี"
 mtg_netherlands.48.d: "ดวยความมั่นใจเกินตัวอยางโจงแจง ดูเหมือนเจาชายแบรนารดไดให 'คําแนะนํา' แกเพื่อนนักบิน ซึ่งในเชิงยุทธวิธีแลวกลับใหผลเสีย และหลายครั้งก็อันตรายอยางยิ่ง ความกลาบาบิ่นไดเพิ่มความสูญเสียแลว"
 mtg_netherlands.48.a: "บาบิ่น..."
 mtg_netherlands.48.b: "เราตองหักลาง 'คําแนะนํา' ของเจาชายเพื่อกูสถานการณ"
 mtg_netherlands.49.t: "เจาชายแบรนารดกาวกายยุทธศาสตรในทางที่ดี"
 mtg_netherlands.49.d: "ดูเหมือนเจาชายแบรนารดจะกาวกายแผนการรบลาสุดอยางมาก โชคดีที่คําแนะนํานั้นถูกตอง และแผนตาง ๆ ดูจะไดผลยอดเยี่ยม"
 mtg_netherlands.49.a: "พระองคทรงปรีชาสามารถยิ่ง"
 mtg_netherlands.50.t: "เจาชายแบรนารดกาวกายยุทธศาสตรในทางที่ไมดี"
 mtg_netherlands.50.d: "ดูเหมือนเจาชายแบรนารดจะกาวกายแผนการรบลาสุดอยางมาก ดวยการใชตําแหนงและฐานันดร ประกอบกับความหาวหาญและความมั่นใจตามปกติของพระองค ทําใหผูที่ไมเห็นดวยกับขอเสนอของพระองคตองเงียบเสียงลง บัดนี้แผนการรบหลายแผนแสดงขอบกพรองขั้นพื้นฐานเมื่อนําไปปฏิบัติ"
 mtg_netherlands.50.a: "สายเกินกวาจะทําอะไรไดแลว..."
 mtg_netherlands.50.b: "นายพลของเราตองเพิกเฉยตอ 'คําแนะนํา' ของพระองค แมจะทําใหชื่อเสียงของเจาชายมัวหมองก็ตาม"
 mtg_netherlands.51.t: "เจาชายแบรนารดตองการรวบรวมขาวกรอง"
 mtg_netherlands.51.d: "ในชวงหลายสัปดาหที่ผานมา ขาวกรองไมเพียงพอตอการวางแผนการรบที่เหมาะสม และเมื่อทราบเรื่องนี้ในการประชุมเสนาธิการครั้งลาสุด เจาชายแบรนารดจึงยืนกรานจะใชเสนสายสวนพระองคใน [GER.GetNameDef] เพื่อหาขาวกรองที่เราตองการอยางยิ่งมาให"
 mtg_netherlands.51.a: "ความคิดที่ยอดเยี่ยม!"
 mtg_netherlands.51.b: "เราจะพึ่งพาสิ่งที่พระองคหามาไดไมได!"
 mtg_netherlands.52.t: "เจาชายแบรนารดไดขาวกรองที่ดี"
 mtg_netherlands.52.d: "ดูเหมือนขาวกรองที่เจาชายรวบรวมมาจะมีประโยชนอยางมากในสนามรบ ความสําเร็จหลายครั้งเปนผลโดยตรงจากขอมูลที่สงตอมาจากผูติดตอของพระองค"
 mtg_netherlands.52.a: "พระองคเปนความภาคภูมิใจของหนวยสืบราชการลับ"
 mtg_netherlands.53.t: "เจาชายแบรนารดไดขาวกรองที่ผิดพลาด"
 mtg_netherlands.53.d: "ดูเหมือนขาวกรองที่เจาชายรวบรวมมาจะไมคอยแมนยํานัก... ศัตรูโจมตีซํ้าแลวซํ้าเลาในจุดที่เราถอนทหารออกไปเสริมจุดอื่นที่คาดวาจะถูกโจมตี"
 mtg_netherlands.53.a: "เปนการเดิมพันที่เราเลือกเอง..."
 mtg_netherlands.54.t: "เจาชายแบรนารดหมายจัดตั้งขบวนการตอตาน"
 mtg_netherlands.54.d: "เมื่อการสนทนาในการประชุมเสนาธิการครั้งลาสุดหันมาที่การตอตานอันออนแอในมาตุภูมิที่ถูกยึดครองของเรา ดูเหมือนเจาชายแบรนารดจะรับหนาที่ 'จัดระเบียบใหเขาที่' ดวยพระองคเอง พระองคกําลังเตรียมกระโดดรมลงหลังแนวขาศึกแลว"
 mtg_netherlands.54.a: "พระองคตองทําในสิ่งที่ทรงเห็นวาถูกตอง"
 mtg_netherlands.54.b: "อันตรายเกินไป เราตองหาม!"
 mtg_netherlands.55.t: "เจาชายแบรนารดจัดตั้งขบวนการตอตาน"
 mtg_netherlands.55.d: "หลังเสด็จกลับมาโดยเรือดํานํ้า ผลงานของเจาชายก็ปรากฏใหเห็นแลว ขบวนการตอตานมีประสิทธิภาพและเคลื่อนไหวมากขึ้นอยางมาก"
 mtg_netherlands.55.a: "ผลงานที่นาทึ่ง"
 mtg_netherlands.56.t: "เจาชายแบรนารดบาดเจ็บระหวางจัดตั้งขบวนการตอตาน"
 mtg_netherlands.56.d: "ระหวางความพยายามจัดตั้งขบวนการตอตาน การบุกจูโจมของฝายยึดครองทําใหพระองคไดรับบาดเจ็บ พระองคถูกนําตัวกลับมาโดยเรือดํานํ้าแลว แตคงตองใชเวลาสักระยะกวาจะกลับมาพรอมรบเต็มที่"
 mtg_netherlands.56.a: "คราวนี้ความกลาหาญของพระองคไมไดรับผลตอบแทนเปนความสําเร็จ"
 mtg_netherlands.58.t: "เจาชายแบรนารดกอกรณีพิพาททางการทูต"
 mtg_netherlands.58.d: "ในการพบปะกับบุคคลสําคัญตางชาติเมื่อเร็ว ๆ นี้ ดูเหมือนเจาชายแบรนารดจะกอกรณีพิพาททางการทูตขึ้น ผูแทนฝาย[HOL_bernhard_row_target.GetAdjective]กลาวหาวาพระองคกาวกายกิจการภายใน และยังทําอยางไมแนบเนียนเลยดวย"
 mtg_netherlands.58.a: "นาอับอายยิ่งนัก..."
 mtg_netherlands.59.t: "กรณีพิพาททางการทูตกับ [From.GetName]"
 mtg_netherlands.59.d: "ในการพบปะกับบุคคลสําคัญของเราเมื่อเร็ว ๆ นี้ เจาชายแบรนารดแหงดัตชไดเกิดกรณีพิพาททางการทูตกับผูแทนคนหนึ่งของเรา ดูเหมือนผูแทนของเราจะกลาวหาเจาชายวา 'กาวกายกิจการภายใน'"
 mtg_netherlands.59.a: "นากังวล... หวังวาเรื่องจะไมบานปลาย"
 mtg_netherlands.60.t: "[From.GetNameDef] ยกระดับกรณีพิพาททางการทูต"
 mtg_netherlands.60.d: "ทางการ[HOL.Adjective]ยกระดับกรณีพิพาททางการทูต โดยเรียกรองอยางเปนปรปกษใหเราขอโทษอยางเต็มที่"
 mtg_netherlands.60.a: "ใหพวกเขาเขามาเลย"
 mtg_netherlands.60.b: "เราตองคลายความตึงเครียด"
 mtg_netherlands.61.t: "[From.GetNameDef] ยกระดับกรณีพิพาทยิ่งขึ้น"
 mtg_netherlands.61.d: "[From.GetNameDef] ไมยอมถอย และปฏิเสธที่จะขอโทษตอขอกลาวหาอันดูหมิ่นและการใสรายเจาชายแบรนารด ไมวาพวกเขาจะพูดถูกและเจาชายกาวกายกิจการภายในจริงหรือไมก็ไมใชประเด็นแลว บัดนี้ความสัมพันธระหวางประเทศมาถึงจุดแตกหักแลว"
 mtg_netherlands.61.a: "ถาเชนนั้นก็ตองเปนสงคราม"
 mtg_netherlands.62.t: "[From.GetNameDef] คลายความตึงเครียด"
 mtg_netherlands.62.d: "รัฐบาล[From.GetAdjective]ยอมถอยและขอโทษอยางเต็มที่ตอขอกลาวหาที่มีตอเจาชายแบรนารดแลว สวนพระองคกาวกายกิจการภายในของพวกเขาจริงหรือไมยังตองรอดูกันตอไป แตอยางนอยในตอนนี้พระองคก็ตัดสินพระทัยจะเก็บตัวเงียบในเรื่องนี้"
 mtg_netherlands.62.a: "ก็ได"
 mtg_netherlands.63.t: "อพยพทองคําสํารอง"
 mtg_netherlands.63.d: "กอนที่เราจะยอมจํานน เมื่อเห็นชัดแลววาแพการรบ เราไดดําเนินแผนอพยพทองคําสํารองไปยังพันธมิตรใหมของเราสําเร็จ ทองคําซึ่งถูกเก็บไวบนเรือพรอมออกเดินทางไดทุกเมื่อ บัดนี้มาถึงประเทศเจาบานของเราอยางปลอดภัยแลว และนาจะชวยรัฐบาลพลัดถิ่นของเราไดอยางมหาศาล"
 mtg_netherlands.63.a: "โชคดีที่เรามองการณไกลและเตรียมการไว"
 mtg_netherlands.64.t: "โครงการซาวเดอรเซนําความกาวหนาดานโครงสรางพื้นฐาน"
 mtg_netherlands.64.d: "งานในพื้นที่ฟเลโฟโพลเดอรเริ่มตนไปไดดี และแมโครงการจะตองใชเวลาอีกหลายปกวาจะแลวเสร็จสมบูรณ เราก็เริ่มเก็บเกี่ยวผลจากความเหนื่อยยากไดบางแลว\n\nจากประสบการณจริงในโครงการถมทะเลขนาดมหึมาเชนนี้ วิศวกรไดพัฒนาวิธีการใหมในการกอสรางถนน ทางรถไฟ และทางนํ้า หากเราลงทุนในความกาวหนาเหลานี้ เราจะไดรับการพัฒนาอยางมากในดานเหลานี้ไปอีกนาน"
 mtg_netherlands.64.a: "ฟงดูเปนความคิดที่ยอดเยี่ยม!"
 mtg_netherlands.64.b: "ตอนนี้เราไมมีเงินทุนสําหรับเรื่องนี้"
 mtg_netherlands.65.t: "โครงการซาวเดอรเซนําความกาวหนาดานอุตสาหกรรม"
 mtg_netherlands.65.d: "ขณะที่งานในฟเลโฟโพลเดอรคืบหนาไป อุตสาหกรรมที่ปอนวัสดุใหโครงการมหึมานี้ก็เติบโตตามไปดวย วิศวกรที่ทุมเทจัดหาวัสดุกอสรางที่จําเปนใหโครงการไดความรูใหมในการพัฒนาอุตสาหกรรมและการกอสรางโรงงานและอูตอเรือ หากเราลงทุนในความกาวหนาเหลานี้ เราจะไดรับการพัฒนาอยางมากในดานนี้ไปอีกนาน"
 mtg_germany.1.t: "[From.GetName] เรียกรองใหยอมทําตาม"
 mtg_germany.1.d: "เมื่อเราเพิ่งยอมตามขอเรียกรองทางการคาของพวกเขา บัดนี้ [From.GetNameDef] จึงยื่นคําขาดวา เราตองเขารวมกับพวกเขาโดยทันที มิฉะนั้นจะตองเผชิญกับแสนยานุภาพทางทหารของพวกเขา"
 mtg_germany.1.a: "ถาเชนนั้นเราจะเขารวมกับพวกเขา"
 mtg_germany.1.b: "ถาเชนนั้นเราจะเผชิญหนากับพวกเขา"
 mtg_germany.2.t: "[From.GetName] ยอมทําตาม"
 mtg_germany.2.d: "รัฐบาล[From.GetAdjective]ตอบรับขอเรียกรองของเราดวยดี และจะใหความชวยเหลือเราในสงคราม"
 mtg_germany.3.t: "[From.GetName] ปฏิเสธที่จะยอมทําตาม"
 mtg_germany.3.d: "รัฐบาล[From.GetAdjective]ปฏิเสธขอเรียกรองของเรา แมเราจะขูวาจะใชกําลังทหาร"
 mtg_germany.3.a: "ถาเชนนั้นพวกเขาก็เลือกความตายเอง"
 mtg_exile_government.2.title: "รัฐบาลพลัดถิ่น[From.GetAdjective]"
 mtg_exile_government.2.desc: "[From.GetLeader] ขออนุญาตอยางเปนทางการจากรัฐบาล[Root.GetAdjective]เพื่อกลับไปยัง [From.GetNameDef] และจัดตั้งคณะรัฐมนตรี[From.GetRulingPartyLong]ชั่วคราวขึ้นใหม เพื่อเตรียมพรอมสําหรับสันติภาพหลังสงคราม"
 mtg_exile_government.2.a: "ถึงเวลาที่พวกเขาจะกลับสูดินแดนของตนแลว"
 mtg_exile_government.2.b: "ยังไมถึงเวลาอันสมควร"
 mtg_exile_government.3.title: "[From.GetName] ขอรวมกองทัพเรือ"
 mtg_exile_government.3.desc: "ผูนํากองทัพเรือ[From.GetAdjective]เสนอแผนใหรวมกองทัพเรือของเราเขากับกองทัพเรือของพวกเขา โดยแยงวาการใหนักวางแผนทางเรือฝาย[From.GetAdjective]ควบคุมเรือของเราอยางเต็มที่ จะทําใหเรือมีประสิทธิภาพสูงขึ้นอยางมากเมื่อเทียบกับการปฏิบัติการอยางอิสระในปจจุบัน"
 mtg_exile_government.3.a: "เราเห็นดวย"
 mtg_exile_government.3.b: "เราจะไมยอมอยูใตบังคับบัญชาของพวกเขา"
 mtg_exile_government.4.title: "[From.GetName] ตอบรับการรวมกองทัพเรือ"
 mtg_exile_government.4.desc: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นดวยกับขอเสนอของเรา และนับจากนี้เรือของพวกเขาจะปฏิบัติการภายใตบังคับบัญชาของเรา"
 mtg_exile_government.5.title: "[From.GetName] ปฏิเสธการรวมกองทัพเรือ"
 mtg_exile_government.5.desc: "รัฐบาล[From.GetAdjective]แจงเราวากองทัพเรือของพวกเขาจะไมมีวันอยูใตบังคับบัญชาของมหาอํานาจตางชาติ พวกเขาตั้งใจจะชวยเรา แตจะทําอยางเปนอิสระ"
 mtg_exile_government.5.a: "พวกเขาวางศักดิ์ศรีไวเหนือผลประโยชนของพันธมิตร"
 mtg_generic.1.title: "[From.GetName] บังคับเปลี่ยนรัฐบาล"
 mtg_generic.1.desc: "โดยอางถึงการขาดเสียงสนับสนุนจากการเลือกตั้งอยางชัดเจนของรัฐบาลชุดปจจุบันของเรา [From.GetNameDef] เรียกรองใหมีการเปลี่ยนแปลงทางการเมือง"
 mtg_generic.1.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 mtg_news.13.desc: "รัฐบาล[From.GetAdjective]ประกาศจัดการประชุมจักรวรรดิครั้งที่สิบสอง ตลอดสองเดือนขางหนา ผูแทนจากรัฐบาล[From.GetAdjective]และประเทศในเครือจักรภพจะมาประชุมกันที่ลอนดอนเพื่อหารือเรื่องที่เกี่ยวของกับทั้งจักรวรรดิ\n\nยังไมชัดเจนวาเรื่องนี้จะมีความหมายอยางไรตอสถานการณโลก แตเปนไปไดวาการหารือจะครอบคลุมประเด็นสหพันธจักรวรรดิ ซึ่งหากจัดตั้งขึ้นก็นาจะสงผลอยางมากตอมหาอํานาจของโลก"
 mtg_news.13.a: "ชะตากรรมของจักรวรรดิแขวนอยูบนเสนดาย"
 mtg_news.13.b: "เรามีเรื่องตองหารือกันมาก"
 mtg_news.13.c: "เราจะติดตามความเคลื่อนไหวอยางใกลชิด"
 mtg_news.14.t: "[From.GetName] ทบทวนนโยบายอาณานิคม"
 mtg_news.14.desc: "ในการปราศรัยวันนี้ [From.GetLeader] ประกาศเปลี่ยนนโยบายอาณานิคมของประเทศ "ดวยตระหนักถึงสิทธิในการกําหนดชะตากรรมตนเองของทุกชนชาติ รัฐบาล[From.GetAdjective]จึงตัดสินใจนําดินแดนในอาณัติทั้งหมดของจักรวรรดิเขาสูเสนทางแหงเอกราช ซึ่งตั้งใจใหบรรลุผลในอนาคตอันใกล"\n\nเพื่อตอบขอกังวลวาเรื่องนี้จะบั่นทอนสถานะของ [From.GetNameDef] ในเวทีโลกอยางมาก [From.GetLeader] กลาววา "ทุกชาติที่ประสงคจะอยูตอ ยินดีตอนรับใหเปนสมาชิกของประชาคมแหงชาติที่กอตั้งขึ้นใหม แตในฐานะภาคีที่เทาเทียมและเปนอิสระอยางสมบูรณ" ยังตองรอดูวาจะมีชาติใดตอบรับขอเสนอนี้หรือไม"
 mtg_news.14.a: "นี่คือสิ่งที่ถูกตอง"
 mtg_news.14.b: "เอกราชของเรารออยู"
 mtg_news.14.c: "พวกเขาสติแตกไปแลว"
 mtg_news.14.d: "หวังวาเรื่องไรสาระนี้จะไมกระทบดินแดนของเรา!"
 mtg_news.15.t: "การปลดปลอยอาณานิคมของจักรวรรดิบริติช"
 mtg_news.15.desc: "เมื่อเที่ยงคืนวันนี้ การโอนอํานาจอธิปไตยโดยสมบูรณใหแกดินแดนในอาณัติตาง ๆ ของจักรวรรดิบริติชที่รอคอยมานานไดเสร็จสิ้นลง แมรัฐบาล[From.GetAdjective]จะเชิญดินแดนในอาณัติเดิมใหเขารวม [From.GetFactionName] แตหลายแหงก็เลือกเดินทางของตนเอง\n\nความเคลื่อนไหวนี้ยังคงเปนที่ถกเถียงภายในประเทศ แตไดรับเสียงชื่นชมอยางมากจากฝายสังคมนิยมทั่วโลก ยังตองรอดูวาเรื่องนี้ทําใหสถานะของ [From.GetNameDef] ในเวทีโลกออนแอลงเพียงใด รวมถึงสถานการณของชาติที่เลือกเดินทางของตนเอง"
 mtg_news.15.a: "อนาคตเปนสิ่งหลีกเลี่ยงไมได เราจึงทําใหมันเกิดขึ้นในตอนนี้"
 mtg_news.15.b: "จุดสิ้นสุดของยุคสมัย"
 mtg_news.16.t: "[From.GetName] ปฏิเสธนโยบายเอาใจผูรุกราน"
 mtg_news.16.desc: "ในแถลงการณตอสาธารณะวันนี้ [From.GetLeader] นายกรัฐมนตรี[From.GetAdjective]คนใหม ประกาศเจตนาของรัฐบาลใหมที่จะหันเหออกจากนโยบายเอาใจผูรุกรานที่รัฐบาลชุดกอนยึดถืออยางภักดี [From.GetLeader] แสดงใหเห็นชัดอยางไมมีขอสงสัยวาเปาหมายของ [From.GetNameDef] คือ "หยุดยั้งการรุกคืบของทรราช ไมวามันจะผงาดหัวอันนาเกลียดขึ้นมาที่ใด"\n\nยังตองรอดูวาภัยคุกคามของสงครามจะหยุดยั้งการขยายดินแดนของบางชาติไดหรือไม แตโครงการเกณฑทหารใน [From.GetNameDef] ก็เดินหนาไปมากแลว ซึ่งทําใหคําแถลงของพวกเขานาเชื่อถือขึ้น"
 mtg_news.16.a: "ยุคแหงการเอาใจสิ้นสุดแลว บัดนี้เราไดขีดเสนไวแลว"
 mtg_news.16.b: "อังกฤษโยนถุงมือทาดวลแลว"
 mtg_news.17.t: "[From.GetName] บังคับใชสนธิสัญญานาวี"
 mtg_news.17.desc: "วันนี้รัฐบาล[From.GetAdjective]ประกาศเจตนาจะปราบปรามการละเมิดสนธิสัญญานาวีวอชิงตันป 1922 ชาติผูลงนามใดที่ละเมิดสัดสวนเรือหลัก 5:5:3:1.75:1.75 ที่ระบุไวในสนธิสัญญา นาจะไดรับคําขาดจากฝาย[From.GetAdjective]โดยทันที เรียกรองใหลดจํานวนเรือลงตามโควตาที่ไดรับจัดสรรในสนธิสัญญา\n\nจนถึงตอนนี้ ปฏิกิริยาจากทั่วโลกคือความไมอยากเชื่อวาอังกฤษจะทําสงครามเพราะเรื่องนี้"
 mtg_news.17.a: "แตเราจะทํา"
 mtg_news.17.b: "เราควรคาดวาจะไดรับคําขาดจากพวกเขาไดทุกเมื่อ..."
 mtg_news.17.c: "อังกฤษจริงจังกับความเปนเจาทะเลของตนมาก..."
 mtg_news.18.t: "[From.GetName] พิจารณาแทรกแซงภาคพื้นทวีป"
 mtg_news.18.desc: "\nวันนี้รัฐบาล[From.GetAdjective]ประกาศเจตนาจะ "ฟนฟูดุลอํานาจในยุโรป" ดวยการใชกําลังทหารหากจําเปน นายกรัฐมนตรี [From.GetLeader] กลาววาลัทธิจักรวรรดินิยมในภาคพื้นทวีปยุโรป "เปนภัยตอความมั่นคงของชาติอังกฤษ จึงตองถูกปดลอม"\n\nยังไมชัดเจนวาเรื่องนี้หมายความวาอยางไรกันแน แตประเทศไดระดมพลแลวและดูพรอมทําสงคราม"
 mtg_news.18.a: "เรารอใหพวกเขาแข็งแกรงขึ้นอีกตอไปไมไดแลว"
 mtg_news.18.b: "พวกเขากําลังมาเลนงานเรา"
 mtg_news.18.c: "พวกเขาขามเสนแลว"
 mtg_news.19.t: "[From.GetLeader] เสริมอํานาจพรรคของกษัตริย"
 mtg_news.19.desc: "หลังพระราชพิธีอภิเษกสมรสระหวางพระเจา [From.GetLeader] กับวอลลิส ซิมปสัน บัดนี้พระมหากษัตริยไดทรงแตงตั้งผูนําของ "พรรคของกษัตริย" ฝายนิยมกษัตริยที่เพิ่งกอตั้งขึ้น ไดแก วินสตัน เชอรชิลล ออสวัลด มอสลีย และเดวิด ลอยด จอรจ ใหจัดตั้งรัฐบาลใหม หลังจากที่ประเทศไรรัฐบาลมาเปนเวลานาน\n\nผูสนับสนุน [From.GetLeader] ตางชื่นชมการจัดตั้งรัฐบาลที่จงรักภักดี แตผูวิจารณชี้วารัฐบาลใหมสนับสนุนพระประสงคของพระมหากษัตริยอยางเต็มที่จนแทบจะถือไดวาพระองคทรงเปนสมบูรณาญาสิทธิราชยโดยพฤตินัย"
 mtg_news.19.a: "ขอพระเจาคุมครองพระราชา!"
 mtg_news.19.b: "กาวถอยหลังสูอดีต"
 mtg_news.20.t: "การโดดเดี่ยวทางการทูตของ[ITA.GetAdjective]"
 mtg_news.20.desc: "เมื่อเร็ว ๆ นี้ ความสัมพันธทางการทูตระหวาง [ITA.GetNameDef] กับ [GER.GetNameDef] เลวรายลง โดยรัฐบาล[GER.GetAdjective]ฉวยเอาเหตุการณทางการทูตเล็ก ๆ นอย ๆ หลายครั้งมาโหมวาทกรรมที่เปนปรปกษ แมความสัมพันธอิตาลี-เยอรมนีจะเริ่มดีขึ้นในชวงไมกี่ปที่ผานมา แตพัฒนาการใหมนี้ดูจะปดประตูความรวมมือในอนาคตระหวางสองมหาอํานาจยุโรปนี้ไปโดยสิ้นเชิง\n\nผูวิจารณชี้ถึงความสัมพันธอังกฤษ-เยอรมนีที่ดีขึ้นในเวลาเดียวกัน รวมถึง 'ความสะดวก' ที่การโดดเดี่ยวทางการทูตของ[ITA.GetAdjective]มอบใหแกอังกฤษ ซึ่งอาจบงชี้ถึงการตกลงลับหลังฉากระหวางสองชาตินี้"
 mtg_news.20.a: "เยอรมนีชวยเราไวมาก"
 mtg_news.20.b: "เสนทางนี้ใหโอกาสที่ดีกวาแกเรา"
 mtg_news.20.c: "แผนชั่วรายของอังกฤษคือตนเหตุของเรื่องนี้!"
 mtg_news.20.d: "อังกฤษวางแผนมาตลอด..."
 mtg_news.21.t: "พันธมิตรอังกฤษ-เยอรมนี"
 mtg_news.21.desc: "รัฐบาล[ENG.GetAdjective]และ[GER.GetAdjective]ประกาศกติกาสัญญาชวยเหลือกันทางทหาร พรอมแสดงเจตนาจะ "เคารพเขตอิทธิพลของอีกฝาย" หลายคนอาจไมแปลกใจกับพัฒนาการนี้ หลังจากที่ [GER.GetNameDef] ใชวาทกรรมที่เอนเอียงเขาหาฝาย[ENG.GetAdjective]มากขึ้นเรื่อย ๆ ในชวงหลายเดือนที่ผานมา แตถอยคําในสนธิสัญญาก็ทําใหผูเชี่ยวชาญจํานวนมากตกตะลึง และถึงขั้นทําใหบางคนออกมาเตือนวาเรื่องนี้อาจมีความหมายอยางไรตอยุโรป"
 mtg_news.21.a: "บัดนี้ไมมีใครขวางทางเราได"
 mtg_news.21.b: "ทองทะเลปลอดภัยแลว"
 mtg_news.21.c: "เราควรระมัดระวัง..."
 mtg_news.22.t: "กติกาสัญญาอังกฤษ-เยอรมนี"
 mtg_news.22.desc: "รัฐบาล[ENG.GetAdjective]และ[GER.GetAdjective]ประกาศกติกาสัญญาไมรุกรานและไมแทรกแซงกัน โดยมีขอกําหนดเพิ่มเติมระบุเจตนาจะ "เคารพเขตอิทธิพลของอีกฝาย" หลายคนอาจไมแปลกใจกับพัฒนาการนี้ หลังจากที่ [GER.GetNameDef] ใชวาทกรรมที่เอนเอียงเขาหาฝาย[ENG.GetAdjective]มากขึ้นเรื่อย ๆ ในชวงหลายเดือนที่ผานมา แตผูวิจารณก็ยังเตือนวาเรื่องนี้อาจมีความหมายอยางไรตอยุโรป"
 mtg_news.22.a: "แผนดินใหญปลอดภัยแลว"
 mtg_news.22.b: "ปกของเราปลอดภัยแลว"
 mtg_news.22.c: "พวกเขากําลังแบงโลกกัน..."
 mtg_news.23.t: "กลุมเสื้อดํารวมตัวใน [From.GetName]"
 mtg_news.23.desc: "ภายใตการนําของออสวัลด มอสลีย สหภาพฟาสซิสตอังกฤษไดเริ่มรณรงคเดินขบวนอยางเปนระบบไปทั่วประเทศ เพื่อเพิ่มจํานวนผูสนับสนุนฟาสซิสตทั่ว [From.GetNameDef]\n\nอยางไรก็ตาม การตอบโตอยางรุนแรงจากกลุมตอตานฟาสซิสตในหมูประชาชนไดกอใหเกิดการตอสูบนทองถนนหลายครั้งแลว และยังไมแนวาเสถียรภาพจะคงอยู หรือความไมสงบทางการเมืองจะเลวรายลงไปอีก สวนแกนนําของ B.U.F. ก็ประกาศแลววาจะไมหยุด "จนกวาจะไดเดินขบวนไปถึงดาวนิงสตรีทและเรียกรองใหเปลี่ยนรัฐบาล""
 mtg_news.23.a: "เราจะผานบททดสอบนี้ออกมาแข็งแกรงกวาที่เคย"
 mtg_news.23.b: "มาดูกันวาพวกเขาจะเลี่ยงสงครามกลางเมืองไดหรือไม"
 mtg_news.24.t: "พันธมิตรอังกฤษ-อิตาลี"
 mtg_news.24.desc: "ในความเคลื่อนไหวที่ไมเคยมีมากอน รัฐบาล[Root.GetAdjective]ชุดใหมไดตีตัวออกหางจากพันธมิตรครั้งมหาสงครามใน [FRA.GetNameDef] และหันไปประกาศเปนพันธมิตรกับชาวอิตาลีแทน การเปลี่ยนขางอยางกะทันหันนี้สรางแรงสั่นสะเทือนไปทั่ววงการการทูตยุโรป และถูกจับตาดวยความระแวงเปนพิเศษใน [FRA.GetNameDef] และ [GER.GetNameDef] ซึ่งฝายหลังตกเปนเปาวาทกรรมที่เปนปรปกษจาก [From.GetLeader] ซํ้าแลวซํ้าเลา"
 mtg_news.24.a: "ยังไงฝรั่งเศสก็ไรประโยชนอยูแลว"
 mtg_news.24.b: "พวกเราฟาสซิสตที่แทจริงตองยืนหยัดรวมกัน"
 mtg_news.24.c: "อยาไดไวใจพวกเนื้ออบอังกฤษ!"
 mtg_news.24.d: "เราขอประทวง!"
 mtg_news.24.e: "นี่เปนการเดินหมากทางการทูตครั้งสําคัญของอังกฤษ..."
 mtg_news.25.t: "คืนยิบรอลตารใหสเปนฝายชาตินิยม"
 mtg_news.25.desc: "วันนี้รัฐบาล[Root.GetAdjective]และรัฐบาลสเปนออกแถลงการณรวม ประกาศคืนยิบรอลตารใหสเปนฝายชาตินิยม พรอมทั้งกระชับสนธิสัญญาความรวมมือทางทหารฉบับใหมระหวางสองมหาอํานาจ"
 mtg_news.25.a: "เปนการแลกเปลี่ยนที่จําเปน"
 mtg_news.25.b: "ผลตอบแทนคุมคา"
 mtg_news.25.c: "พัฒนาการที่นาสนใจ..."
 mtg_news.26.t: "สงครามกลางเมืองฝายนิยมจักรวรรดิใน [From.GetName]"
 mtg_news.26.desc: "\nกลุมนิยมจักรวรรดิใน [From.GetName] ลุกฮือตอตานรัฐบาลอยางเปดเผย เรียกรองใหประเทศกลับไปเปนประเทศในเครือจักรภพของจักรวรรดิบริติชโดยทันที สถานการณไดบานปลายเปนสงครามกลางเมืองเต็มรูปแบบแลว และรัฐบาล[From.GetAdjective]กลาวหาวา [ENG.GetNameDef] สงอาวุธและกระสุนสมัยใหมที่จําเปนใหแกฝายกบฏ ซึ่งรัฐบาล[ENG.GetAdjective]ปฏิเสธอยางเด็ดขาด"
 mtg_news.26.a: "พวกเขาจะกลาวหาเราอยางไรก็ตามใจ"
 mtg_news.26.b: "อังกฤษจอมจุนจานที่นาสาปแชง!"
 mtg_news.26.c: "พวกเขากําลังมาเลนงานพวกเราทุกคน"
 mtg_news.26.d: "กลยุทธใตดิน..."
 mtg_news.27.t: "[ENG.GetName] เปนพันธมิตรกับฝายภักดีตอจักรวรรดิของ[From.GetAdjective]"
 mtg_news.27.desc: "\nวันนี้รัฐบาล[ENG.GetAdjective]ประกาศวาจะรับรัฐบาลฝายภักดีตอจักรวรรดิที่เพิ่งกอตั้งใน [From.GetNameDef] ไวใตความคุมครอง [From.GetNameDefCap] กําลังอยูทามกลางสงครามกลางเมือง และนี่ดูจะบงชี้วานับจากนี้ [ENG.GetNameDef] จะเขามามีบทบาทมากขึ้นในความปนปวนทางการเมืองภายในของประเทศนั้น"
 mtg_news.27.a: "เราตองตอนรับพวกเขากลับสูออมอก"
 mtg_news.27.b: "พวกเขากลาดีอยางไร?!"
 mtg_news.27.c: "เราตองยืนหยัดรวมกันตอตานอังกฤษ"
