 mtg_news.12.t: "[HOL.GetName] ยึดมั่นความเปนกลางทางการคา"
 mtg_news.12.desc: "\nความพยายามของ[HOL.GetAdjective]ในการรักษาความเปนกลางทางการคาประสบผลสําเร็จ และสรางความขุนเคืองใหทั้งอังกฤษและเยอรมัน เพราะดูเหมือนวาชาวดัตชจะยิ่งแนวแนมากขึ้นเมื่อเผชิญแรงกดดันจากฝาย[ENG.GetAdjective]และ[GER.GetAdjective]"
 mtg_news.12.a: "ชนชาติที่ละโมบหาผลประโยชนสวนตนโดยสันดานเชนนี้ สมควรถูกบดขยี้และตกเปนทาส!"
 mtg_news.12.b: "ชางเปนการตัดสินใจที่ไมฉลาดเอาเสียเลย"
