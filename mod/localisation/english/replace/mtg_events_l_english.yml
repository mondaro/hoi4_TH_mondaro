 mtg_news.30.t: "[From.GetName] เคลื่อนไหวเพื่อควบคุมประเทศในเครือจักรภพ"
 mtg_news.30.desc: "การกระทําลาสุดของรัฐบาล[From.GetAdjective]แสดงใหเห็นชัดวากําลังจํากัดอํานาจปกครองตนเองของประเทศในเครือจักรภพมากขึ้นเรื่อย ๆ เมื่อมีการเตรียมสงทหารขามทะเล ก็คาดวาอาจถึงขั้นใชการวางกําลังทหารเพื่อสกัดความคิดใด ๆ ที่จะแยกตัวจากรัฐบาลใหม"
 mtg_news.30.a: "พวกเขาอยาไดคิดทําอะไรแผลง ๆ เชียว..."
 mtg_news.30.b: "พวกเขากําลังมาเลนงานเรา"
 mtg_news.30.c: "มาตรการรุนแรง..."
 mtg_news.31.t: "[ENG.GetName] ประกาศกฎอัยการศึกใน [From.GetName]"
 mtg_news.31.desc: "\nเมื่อชวงตนวันนี้ หนวยทหาร[ENG.GetAdjective]ไดเขาประจําการทั่ว [From.GetNameDef] และรัฐบาล[ENG.GetAdjective]ไดประกาศกฎอัยการศึกในประเทศในเครือจักรภพของตน รัฐบาลทองถิ่นถูกระงับ และกิจการประจําวันจะถูกจัดการโดยตรงจากลอนดอน อยางนอยก็ในขณะนี้\n\nยังไมชัดเจนวาสถานการณใหมนี้จะยืดเยื้อไปนานเทาใด แตผูวิจารณตางออกมาบอกแลววาจุดยืนของฝาย[ENG.GetAdjective] 'ไมอาจดํารงอยูได' ในระยะยาว"
 mtg_news.31.a: "เปนความเคลื่อนไหวที่จําเปน"
 mtg_news.31.b: "พวกเขากลาดีอยางไร?!"
 mtg_news.31.c: "เรามีสิทธิ์!"
 mtg_news.31.d: "อังกฤษกําลังใชไมแข็งกับประเทศในเครือจักรภพ"
 mtg_news.32.t: "[ENG.GetName] สถาปนารัฐบาล[From.GetAdjective]ฝายภักดี"
 mtg_news.32.desc: "\nในความเคลื่อนไหวที่ไมเคยมีมากอน [ENG.GetNameDef] ไดจัดการเลือกตั้งใหมใน [From.GetNameDef] ซึ่งผลคือพรรคฝายภักดีที่นิยม[ENG.GetAdjective]ชนะอยางถลมทลาย\n\nผูวิจารณตั้งขอสงสัยกับผลการเลือกตั้ง และชี้วาอาจมีการโกงการเลือกตั้งอยางกวางขวาง ขอกลาวหาเหลานี้ถูกรัฐบาล[ENG.GetAdjective]ปฏิเสธอยางเด็ดขาด ขณะที่รัฐบาล[From.GetAdjective]ชุดใหมไดเขาบริหารประเทศแลว และกําลังดําเนินนโยบายที่นิยมอังกฤษอยางชัดเจน"
 mtg_news.32.a: "เสร็จสิ้นแลว"
 mtg_news.32.b: "โกง! โก-- อะแฮม ชางเปนผลลัพธที่วิเศษจากการเลือกตั้งที่เสรีและเปนประชาธิปไตย"
 mtg_news.32.c: "มีแตเราหรือที่มองเห็นความกดขี่ที่ถูกยัดเยียดใหเรา?!"
 mtg_news.32.d: "นี่เปนเรื่องภายใน"
 mtg_news.33.t: "[From.GetName] ยอมออนขอใหสหภาพแรงงาน"
 mtg_news.33.desc: "โดยอางวาเพื่อหาแรงสนับสนุนจากประชาชนใหกับโครงการเสริมกําลังอาวุธ รัฐบาล[From.GetAdjective]ไดเริ่มเจรจากับสหภาพแรงงาน โดยเสนอจะยอมออนขอเพื่อแลกกับการสนับสนุน คาดวาเรื่องนี้จะทําใหอิทธิพลของฝายสังคมนิยมตอรัฐบาลเพิ่มขึ้นอยางมาก"
 mtg_news.33.a: "เราทําในสิ่งที่ตองทํา"
 mtg_news.33.b: "พัฒนาการที่นากังวล..."
 mtg_news.33.c: "ขาวดีสําหรับกรรมกร[From.GetAdjective]!"
 mtg_news.34.t: "[ENG.GetName] เนรเทศพระราชวงศ"
 mtg_news.34.desc: "ในสิ่งที่เรียกวาเปนการตัดสินใจอยาง 'เมตตา' พระราชวงศ[ENG.GetAdjective]ทั้งหมดถูกเนรเทศออกนอกประเทศ โฆษกรัฐบาลและผูแทนพระราชวงศไมไดใหความเห็นเพิ่มเติม เมื่อชวงตนวันนี้ พระราชวงศเสด็จถึง [From.GetNameDef] และขอลี้ภัยที่นั่น ซึ่งไดรับการตอบรับแลว"
 mtg_news.34.a: "ไปเสียไดก็ดี"
 mtg_news.34.b: "ความกดขี่แบบสังคมนิยมถูกเปดโปงใหทุกคนเห็นแลว"
 mtg_news.34.c: "ชัยชนะของการตอสูทางชนชั้น!"
 mtg_news.35.t: "การหายสาบสูญของพระราชวงศ[ENG.GetAdjective]"
 mtg_news.35.desc: "เมื่อผานไปอีกสัปดาหหนึ่งนับจากที่สมาชิกพระราชวงศ[From.GetAdjective]ปรากฏพระองคตอสาธารณะครั้งสุดทาย ขาวลือเกี่ยวกับชะตากรรมของพระราชวงศก็แพรสะพัด รัฐบาลปฏิเสธที่จะแสดงความเห็นใด ๆ ในเรื่องนี้ และเริ่มปราบปรามรายงานขาวใด ๆ ที่จะดึงความสนใจมาที่ประเด็นนี้\n\nความเงียบของรัฐบาลยิ่งเดนชัดขึ้น เมื่อมีคําบอกเลาจากบุคคลนิรนามบางรายที่อางวาเคยเปนขาราชบริพารในพระราชวงศ ซึ่งเลาวา "เห็นพระราชวงศถูกชายสวมหนากากบังคับนําตัวออกจากพระราชวังบักกิงแฮม" เมื่อหลายสัปดาหกอน"
 mtg_news.35.a: "มันจําเปนตองทํา"
 mtg_news.35.b: "พวกสังคมนิยมไมเคารพชีวิตมนุษยเลย!"
 mtg_news.35.c: "พวกเขาไดรับสิ่งที่สมควรแลว"
 mtg_news.36.t: "ทางเลือกคอมมิวนิสตแบบอังกฤษ"
 mtg_news.36.desc: "[From.GetNameDefCap] ประกาศ 'ทางเลือกคอมมิวนิสต' ใหมแทนโคมินเทิรน ซึ่ง [From.GetLeader] กลาววา "รัฐสังคมนิยมทุกรัฐที่ตองการเปนอิสระจากมอสโก สามารถเขารวมกับเราในการปกปองสิทธิของกรรมกรทั่วโลก" ยังตองรอดูวาฝายสังคมนิยมใหมนี้จะยืนหยัดตานมอสโกไดหรือไม"
 mtg_news.36.a: "เราเปดออมแขนรับสหายของเราแลว"
 mtg_news.36.b: "พวกเขาคือผูทรยศตอสังคมนิยมที่แทจริง!"
 mtg_news.36.c: "เกิดความแตกแยกอีกครั้งในหมูฝายแดง"
 mtg_news.37.t: "[From.GetName] เรียกรองใหปลดปลอยอาณานิคม"
 mtg_news.37.desc: "รัฐบาล[From.GetAdjective]ยื่นคําขาดตอมหาอํานาจเจาอาณานิคมอื่น ๆ เรียกรองใหถอนตัวออกจากอาณานิคมและมอบเอกราชโดยสมบูรณโดยทันที เชนเดียวกับที่อังกฤษไดทําไปแลว พวกเขาแสดงความพรอมจะใชกําลังทหารบังคับตามขอเรียกรองเหลานี้หากจําเปน"
 mtg_news.37.a: "และเราจะทํา"
 mtg_news.37.b: "เรามีเรื่องตองตัดสินใจ..."
 mtg_news.37.c: "อังกฤษกําลังอวดแสนยานุภาพไปทั่วโลก"
 mtg_news.38.t: "[From.GetName] ทาทายสังคมนิยมแบบ[SOV.GetAdjective]"
 mtg_news.38.desc: "[From.GetNameDefCap] กลาวหาวา [SOV.GetNameDef] "ทรยศตอคุณคาที่มารกซยึดถือ" และประกาศวาไดตัดสินใจจะ "กวาดลางผูทรยศออกจากสังคมนิยม" ประเทศไดสั่งใหกองทัพเตรียมพรอมขั้นสูงสุด เพราะสิ่งที่ดูเปนเพียงการทาชิงความเปนผูนําของโลกสังคมนิยม ดูจะตองลุกลามเปนสงครามเต็มรูปแบบอยางแนนอน"
 mtg_news.38.a: "เราคือสังคมนิยมที่แทจริง!"
 mtg_news.38.b: "ลองดูสิ พวกทรยศ!"
 mtg_news.38.c: "ฝายแดงหันมาหํ้าหั่นกันเอง..."
 mtg_news.39.t: "[From.GetName] ทาทายลัทธิฟาสซิสต"
 mtg_news.39.desc: "วาทกรรมลาสุดจากรัฐบาล[From.GetAdjective]เปนปรปกษและตอตานฟาสซิสตมากขึ้นเรื่อย ๆ เมื่อประกอบกับการผานกฎหมายตอตานฟาสซิสตหลายฉบับ เชื่อกันวานี่เปนสัญญาณวาประเทศกําลังเตรียมพรอมเผชิญหนาทางทหารกับศัตรูทางอุดมการณในอนาคตอันใกล"
 mtg_news.39.a: "ใชแลว"
 mtg_news.39.b: "เราไมกลัวพวกเขา"
 mtg_news.39.c: "สงครามกําลังกอตัว"
 mtg_news.40.t: "[From.GetName] ทาทายลัทธิทุนนิยม"
 mtg_news.40.desc: "วาทกรรมลาสุดจากรัฐบาล[From.GetAdjective]เปนปรปกษและตอตานทุนนิยมมากขึ้นเรื่อย ๆ เมื่อประกอบกับการผานกฎหมายตอตานอเมริกาหลายฉบับ เชื่อกันวานี่เปนสัญญาณวาประเทศกําลังเตรียมพรอมเผชิญหนาทางทหารกับศัตรูทางอุดมการณในโลกใหมในอนาคตอันใกล"
 mtg_news.40.a: "เรากําลังไปเลนงานพวกเขา"
 mtg_news.40.b: "ใหพวกเขาลองดู"
 mtg_news.40.c: "คงเปนความพยายามที่กลาหาญนาดู"
 mtg_news.41.t: "สงครามกลางเมืองใน [From.GetName]"
 mtg_news.41.desc: "ความตึงเครียดที่เพิ่มสูงขึ้นจากการเดินขบวนของกลุมเสื้อดําอยางตอเนื่องใน [From.GetNameDef] บัดนี้ถึงจุดเดือดแลว การตอสูบนทองถนนชุดลาสุดที่เกิดจากการเดินขบวนเหลานี้ลุกลามจนควบคุมไมได และบานปลายจนกองทัพตองเขามาเกี่ยวของ\n\nขณะที่ราชนาวียังคงภักดีตอรัฐบาล[From.GetAdjective]อยางเปนทางการ สถานการณในกองทัพบกกลับแตกตางออกไปมาก โดยหนวยตาง ๆ ประกาศสนับสนุนฝายภักดีบาง ฝายฟาสซิสตบาง เมื่อมีการจัดตั้งรัฐบาลฟาสซิสตชั่วคราว เวทีก็พรอมสําหรับความขัดแยงยืดเยื้อบนเกาะบริเตน"
 mtg_news.41.a: "เราจะชนะ"
 mtg_news.41.b: "อังกฤษกําลังทําลายตัวเอง..."
 mtg_news.42.t: "สงครามกลางเมืองใน [From.GetName] สิ้นสุดลง"
 mtg_news.42.desc: "เมื่อรัฐบาลประชาธิปไตย[From.GetAdjective]ลมสลาย สถานการณบนเกาะบริเตนก็กลับมามีเสถียรภาพ เนื่องจากรัฐบาลปฏิเสธที่จะหนีไปยังประเทศในเครือจักรภพเมื่อเผชิญการรุกคืบของฝายฟาสซิสต บัดนี้ราชนาวีจึงประกาศสนับสนุนรัฐบาลเดียวที่เหลืออยู ยังไมแนวาความภักดีนี้จะไดรับความเชื่อถือตามที่เห็น หรือจะมีการกวาดลางกลุมที่ไมภักดีออกจากกองทัพเรือ"
 mtg_news.42.a: "ในที่สุดก็ไดชัยชนะ!"
 mtg_news.42.b: "พวกเขาทําใหตัวเองออนแอลงอยางมาก..."
 mtg_news.43.t: "สงครามกลางเมืองคอมมิวนิสตใน [From.GetName]"
 mtg_news.43.desc: "กลุมตาง ๆ ในพรรคสังคมนิยม[From.GetAdjective]ไดแสดงความกังวลซํ้าแลวซํ้าเลาตอการที่รัฐบาลดูจะปฏิเสธการปลดปลอยอาณานิคม บัดนี้ดวยความเบื่อหนายตอความเฉยเมยของรัฐบาลในเรื่องนี้ พวกเขาจึงเริ่มกลาวหารัฐบาลวา "กบฏตอคุณคาของสังคมนิยมอยางรายแรง" และจับอาวุธขึ้นเพื่อโคนรัฐบาล ความพยายามกอรัฐประหารบานปลายอยางรวดเร็ว และประเทศก็ตกอยูในภาวะสงครามกลางเมืองเต็มรูปแบบอยางปฏิเสธไมได"
 mtg_news.43.a: "เราจะคืนความเปนเอกภาพใหชาติของเรา!"
 mtg_news.43.b: "คําโกหกของพวกเขาถูกเปดโปงแลว!"
 mtg_news.43.c: "ฝายแดงหันมาฟาดฟนกันเอง..."
 mtg_news.44.t: "สงครามกลางเมืองอินเดีย"
 mtg_news.44.desc: "ผลจากการที่ [RAJ.GetNameDef] ไดรับเอกราชอยางไมเปนระเบียบ ความตึงเครียดทางศาสนาในอนุทวีปจึงคุกรุนอยูใตพื้นผิวนับแตนั้น บัดนี้ความตึงเครียดเหลานี้ปะทุขึ้นอยางกะทันหันดวยการปะทะอยางรุนแรงในเมืองใหญทางตะวันตกเฉียงเหนือและตะวันออกเฉียงเหนือของประเทศ\n\nเจาหนาที่ทองถิ่นไมสามารถยับยั้งไมใหสถานการณบานปลายได และบัดนี้กองกําลังติดอาวุธรวมถึงหนวยทหารไดรวมตัวกันสนับสนุนสันนิบาตมุสลิม ประกาศเอกราชของปากีสถาน พรอมเจตนาจะสูกับชาวอินเดียจนกวาจะไดเอกราชมา"
 mtg_news.44.a: "เราจะไดเอกราชหรือไมก็ตายไปกับมัน!"
 mtg_news.44.b: "เราจะไมยอมใหอนุทวีปนี้แตกเปนสองเสี่ยง!"
 mtg_news.44.c: "นี่เปนความผิดของเราหรือ?"
 mtg_news.44.d: "อังกฤษนาจะคาดการณเรื่องนี้ไดแท ๆ..."
 mtg_news.45.t: "สงครามกลางเมืองปากีสถาน"
 mtg_news.45.desc: "การถือกําเนิดอันนองเลือดของ [From.GetNameDefCap] ยังคงกอความไรเสถียรภาพในชาติที่เพิ่งตั้งไข โดยกองกําลังติดอาวุธมีอํานาจมาก โดยเฉพาะในพื้นที่หางไกล ความแตกตางทางวัฒนธรรมระหวางประชากรมุสลิมกลุมตาง ๆ ทางตะวันตกเฉียงเหนือและตะวันออกเฉียงเหนือของอินเดียก็ชัดเจนขึ้นเรื่อย ๆ โดยทาทีดูแคลนของชาวปากีสถานตะวันตกตอพี่นองทางตะวันออกไดจุดไฟใหอารมณที่ยังไมเย็นลงนับแตสงครามกลางเมือง\n\nบัดนี้ฝายตะวันออกไดจับอาวุธขึ้นอีกครั้ง โดยบอกวา "พอกันที" และพวกเขาก็ตองการเอกราชโดยสมบูรณเชนกัน"
 mtg_news.45.a: "พวกเด็กเมื่อวานซืน!"
 mtg_news.45.b: "พวกเขาจะกดขี่เราไมไดอีกตอไป!"
 mtg_news.45.d: "ทั้งหมดนี้ปองกันไดงาย ๆ แท ๆ..."
 mtg_news.46.t: "[From.GetName] ยายรัฐบาลไปปตตาเวีย"
 mtg_news.46.desc: "เมื่อสูญเสียดินแดนในภาคพื้นทวีปยุโรป รัฐบาล[From.GetAdjective]จึงตัดสินใจยายไปยังเมืองปตตาเวียบนเกาะชวาของอินโดนีเซีย รัฐบาลอาณานิคมที่นั่นจะถูกแทนที่ โดยรัฐบาล[From.GetAdjective]จะบริหารโดยตรงแทน\n\nจากฐานที่มั่นในอาณานิคมแหงนี้ พวกเขาใหคํามั่นวาจะสูรบกับผูรุกรานตอไป"
 mtg_news.46.a: "เราจะสูตอไป!"
 mtg_news.46.b: "พวกเขาไมยอมแพ"
 mtg_news.47.t: "[From.GetName] สานตอโครงการซาวเดอรเซ"
 mtg_news.47.desc: "โครงการถมทะเลขนาดใหญไดเริ่มขึ้นใน [From.GetNameDef] ซึ่งเปนการสานตอโครงการชุดหนึ่งที่เรียกรวมกันวา "โครงการซาวเดอรเซ" หลังจากปดกั้นทะเลสาบไอเซิลดวยเขื่อนอัฟสเลาตไดก และถมพื้นที่วีริงเงอรเมรและนอรดโอสตโพลเดอรแลว โครงการนี้มุงไปที่การถมพื้นที่ฟเลโฟโพลเดอร ซึ่งเปนพื้นที่ใหญที่สุดที่จะถมคืนจากทะเล\n\nแมโครงการทั้งหมดจะตองใชเวลาหลายปอยางแนนอน แตการระบายนํ้าคืบหนาไปมากพอที่พื้นที่สวนเล็ก ๆ เริ่มเขาถึงไดแลว และประโยชนตออุตสาหกรรม[From.GetAdjective]ก็เห็นไดชัด"
 mtg_news.47.a: "มันจะเปนสิ่งมหัศจรรยของโลกยุคใหม"
 mtg_news.47.b: "การเดิมพันที่กลาหาญ"
 mtg_news.48.t: "[JAP.GetName] ไดหมูเกาะอินเดียตะวันออก"
 mtg_news.48.desc: "รัฐบาล[From.GetAdjective]และ[JAP.GetAdjective]ออกแถลงการณรวมประกาศโอนหมูเกาะอินเดียตะวันออกของดัตชทั้งหมดใหอยูใตการควบคุมของ[JAP.GetAdjective] การปรับเปลี่ยนดินแดนครั้งใหญในตะวันออกไกลนี้มีผลทันที แมจะมีการประทวงจากฝายที่สามหลายฝาย เชน อเมริกาและอังกฤษ"
 mtg_news.48.a: "เปนความชั่วรายที่จําเปน"
 mtg_news.48.b: "เปนเรื่องนายินดีที่ไมคาดคิด"
 mtg_news.48.c: "นากังวล"
 mtg_news.49.t: "[JAP.GetName] ไดทรัพยากรจากหมูเกาะอินเดียตะวันออก"
 mtg_news.49.desc: "รัฐบาล[From.GetAdjective]และ[JAP.GetAdjective]ออกแถลงการณรวมประกาศขอตกลงการคาผูกขาดระหวางสองชาติ นับจากนี้ญี่ปุนจะไดรับสิทธิ์แตเพียงผูเดียวในทรัพยากรทั้งหมดที่ขุดคนไดในหมูเกาะอินโดนีเซีย\n\nขอตกลงการคาที่ไมเคยมีมากอนนี้ยอมเปนความพยายามของรัฐบาล[From.GetAdjective]ที่จะปองกันภัยคุกคามจากญี่ปุนอยางไมตองสงสัย แตก็สรางความวิตกอยางมากใหชาติอื่นที่มีผลประโยชนเกี่ยวของ เชน [USA.GetNameDef] และ [ENG.GetNameDef]"
 mtg_news.49.a: "การประนีประนอมที่ยอมรับได"
 mtg_news.49.b: "ยังไงเราก็สนใจแคทรัพยากรอยูแลว"
 mtg_news.49.c: "พวกเขาสมรูรวมคิดกัน"
 mtg_news.50.t: "[From.GetName] ปลดปลอยอาณานิคม"
 mtg_news.50.desc: "รัฐบาล[From.GetAdjective]ชุดใหมทําตามคําสัญญาหาเสียงอยางรวดเร็ว ดวยการมอบเอกราชใหดินแดนตาง ๆ ที่ยังเปนของจักรวรรดิอาณานิคม[From.GetAdjective]\n\nมีผลทันที รัฐเหลานี้จะไดรับเอกราชโดยสมบูรณ และกองทัพหลวงเนเธอรแลนดอินเดียตะวันออก (KNIL) จะกลับมาเสริมกําลังกองทัพ[From.GetAdjective]ในภาคพื้นทวีปยุโรปแทน"
 mtg_news.50.a: "ตอนนี้เรามุงความสนใจไปที่แผนดินใหญไดแลว"
 mtg_news.50.b: "พวกเขาสนับสนุนเสรีภาพอยางแทจริง"
 mtg_news.51.t: "การสถาปนารัฐกันชนเบเนลักซ"
 mtg_news.51.desc: "ดวยความออนแอในปจจุบันของรัฐลักเซมเบิรกและเบลเยียม ดูเหมือน [ENG.GetNameDef] จะยอมตามเสียงเรียกรองของฝาย[From.GetAdjective]ใหฟนฟู "รัฐกันชน" ยุคหลังนโปเลียนในกลุมประเทศแผนดินตํ่า อังกฤษยินยอมมอบดินแดนที่ไดรับการปลดปลอยใหแก [From.GetNameDef] โดยตรง ยังตองรอดูวาคราวนี้ชาวดัตชจะรักษาเสถียรภาพภายในไดดีกวาเดิมหรือไม"
 mtg_news.51.a: "เราจะทําได"
 mtg_news.51.b: "การเดินหมากทางการทูตอันยอดเยี่ยมของฝาย[From.GetAdjective]"
 mtg_news.52.t: "[USA.GetName] คุมครองหมูเกาะเวสตอินดีสของ[From.GetAdjective]"
 mtg_news.52.desc: "ตามคํารองขอของรัฐบาล[From.GetAdjective] [USA.GetNameDef] ไดออกประกาศระบุวาถือวาหมูเกาะเวสตอินดีสของดัตชเปนสวนสําคัญของเขตอิทธิพลของตน และใหคํามั่นวาจะปกปองดินแดนนี้จากผูใดก็ตามที่อาจโจมตีเจาของโดยชอบธรรม"
 mtg_news.52.a: "ฝงตะวันตกปลอดภัยแลว"
 mtg_news.52.b: "เปนฝาย[From.GetAdjective]ยังดีกวาใครอื่น"
 mtg_news.52.c: "พวกเขาจริงจังกับ "เขตอิทธิพล" ของตนไมนอยเลย"
 mtg_news.53.t: "กอตั้งเบเนลักซ"
 mtg_news.53.desc: "ภายใตการนําของรัฐบาล[From.GetAdjective] พันธมิตรใหมที่ประกอบดวยกลุมประเทศแผนดินตํ่าไดกอตั้งขึ้น ผูนําของพวกเขาแสดงความหวังวาพันธมิตรที่เพิ่งตั้งไขนี้ "จะคงความเปนกลางทามกลางวิกฤตโลกที่ทวีความรุนแรง" และหวังวาชาติอื่น ๆ จะเขารวมในที่สุด เพื่อเสริมความแข็งแกรงให "กลุมแหงความเปนกลางและเหตุผล ทามกลางความบาคลั่งที่กําลังครอบงําโลกอยูในขณะนี้""
 mtg_news.53.a: "เรายินดีตอนรับทุกชาติที่เบื่อหนายการทะเลาะเบาะแวงของมหาอํานาจ"
 mtg_news.53.b: "ความริเริ่มที่กลาหาญ"
 mtg_news.54.t: "กอตั้งสหภาพยุโรป"
 mtg_news.54.desc: "นับตั้งแตกอตั้งเบเนลักซ รัฐบาลของกลุมประเทศแผนดินตํ่าไดพยายามดึงดูดความสนใจตอ "กลุมแหงสติสัมปชัญญะที่แข็งแกรงและเปนกลาง" มากขึ้น บัดนี้ชาติใหมจํานวนมากไดรับเชิญใหเขารวมพันธมิตร และเพื่อรองรับประเทศสมาชิกใหมที่หลั่งไหลเขามา จึงตัดสินใจเปลี่ยนชื่อเปน "สหภาพยุโรป""
 mtg_news.54.a: "เราแข็งแกรงขึ้นกวาที่เคย"
 mtg_news.54.b: "สหภาพเติบโตขึ้น"
 MTG_naval_treaty.1.t: "[From.GetNameDefCap] ตองการจํากัดการเสริมกําลังทางเรือ"
 MTG_naval_treaty.1.desc: "ความพยายามลาสุดในการสรางกองเรือที่ใหญขึ้นไดผลักดันเราขึ้นสูระดับมหาอํานาจทางทะเล [From.GetNameDefCap] รูสึกถูกคุกคามจากกองเรือที่ขยายตัวของเราอยางเห็นไดชัด และไดสงคณะผูแทนมายังเมืองหลวงของเราเพื่อเจรจาสนธิสัญญาจํากัดอาวุธรวมกัน \n\nสนธิสัญญานี้จะยึดแบบอยางจากสนธิสัญญานาวีลอนดอนฉบับที่สอง โดยจํากัดขนาดเรือหลักของเรา รวมถึงจํากัดขนาดกองเรือโดยรวมในสวนของเรือหลักไมใหเกินกองเรือของ [ENG.GetNameDef]"
 MTG_naval_treaty.1.a: "เงื่อนไขเหลานี้ยอมรับได"
 MTG_naval_treaty.1.b: "เราจะไมยอมถูกจํากัดความทะเยอทะยาน!"
 MTG_naval_treaty.2.t: "[From.GetNameDefCap] ลงนามสนธิสัญญาลดอาวุธทางเรือ"
 MTG_naval_treaty.2.desc: "รัฐบาลของ [From.GetLeader] ตกลงจํากัดการเสริมกําลังทางเรือรวมกัน หมึกบนสนธิสัญญายังไมทันแหง คณะกรรมาธิการควบคุมก็เริ่มงานตรวจรับรองวาการตอเรือใหมทั้งหมดเปนไปตามขอจํากัดของสนธิสัญญา"
 MTG_naval_treaty.2.a: "เลี่ยงการแขงขันสะสมอาวุธไดอีกครั้ง"
 MTG_naval_treaty.3.t: "[From.GetNameDefCap] ยุติการเจรจา"
 MTG_naval_treaty.3.desc: "คณะผูแทนจาก [From.GetNameDef] เดินออกจากการเจรจา โดยอางวา "อีกฝายปฏิเสธโดยสิ้นเชิงที่จะยอมรับความเปนจริงทางการเมืองและยุทธศาสตรที่ [From.GetNameDef] เผชิญอยู"\n\n เมื่อเปาหมายดานนโยบายตางประเทศในการควบคุมอาวุธพังทลายอยางเห็นไดชัด ผูสังเกตการณจํานวนมากตางสงสัยวาภาคีอื่นของสนธิสัญญาจะยอมรับขอจํากัดดานอาวุธของตนตอไปไดอีกนานเทาใด"
 MTG_naval_treaty.3.a: ""พังทลาย" เปนคําที่แรงไปหนอย"
 MTG_naval_treaty.4.t: "[From.GetNameDefCap] ออกคําเตือนอยางเขมงวด"
 MTG_naval_treaty.4.desc: "วันนี้เอกอัครราชทูต[From.GetAdjective]ประจําประเทศของเราไดเขาพบ [This.GetLeader] เพื่อสงสาสนจากรัฐบาลของเขา พวกเขาเฝามองการขยายกองทัพเรือของเราอยางตอเนื่องดวยความกังวลอยางยิ่ง และบัดนี้ถือวากองทัพเรือของเราเปน "ปจจัยบอนทําลายเสถียรภาพในภูมิภาค" \n\nสาสนระบุตอไปวา หากเรายังคงดําเนินโครงการขยายกองทัพเรือในปจจุบันตอไป รัฐบาล[From.GetAdjective]จะจําตองพิจารณาทุกมาตรการที่เปนไปได"
 MTG_naval_treaty.4.a: "เราไมอยากรูวามาตรการเหลานั้นคืออะไร"
 MTG_naval_treaty.4.b: "การขูที่มองทะลุได"
 MTG_naval_treaty.5.t: "[From.GetNameDefCap] ใหคํามั่นลดอาวุธ"
 MTG_naval_treaty.5.desc: "สาสนอันหนักแนนของเราถึงรัฐบาล[From.GetAdjective]ไดผลตามที่ตองการอยางชัดเจน หลังการหารือภายในตลอดคืนอันยาวนาน [From.GetLeader] ไดใหคํายืนยันตอเอกอัครราชทูตของเรา ตอหนารัฐมนตรีทหารเรือ วาคณะรัฐมนตรีไดอนุมัติการลดงบประมาณกองทัพเรือ ซึ่งจะบังคับให [From.GetNameDef] ตองปลดระวางเรือหลักจํานวนหนึ่ง และจะจัดสรรงบประมาณเฉพาะการตอเรือทดแทนลําที่เสื่อมสภาพในอนาคตเทานั้น"
 MTG_naval_treaty.5.a: "ทีนี้มาดูกันวาพวกเขาจะทําตามนั้นหรือไม"
 MTG_naval_treaty.6.t: "[From.GetNameDefCap] ปฏิเสธคําเตือน"
 MTG_naval_treaty.6.desc: "การพบปะกับรัฐมนตรีตางประเทศของ [From.GetNameDef] ไมเปนไปดวยดีอยางที่เราหวัง ตามรายงานของเอกอัครราชทูตของเรา รัฐบาล[From.GetAdjective]ไดตัดสินใจไวแลววาจะปฏิเสธคําเตือนใด ๆ ที่เราอาจออก เขาจึงไดรับเพียงสาสนสั้น ๆ ระบุวารัฐบาลของ [From.GetLeader] ไมเห็นวาขณะนี้มีเรื่องใดตองหารือ"
 MTG_naval_treaty.6.a: "มาดูกันวาเรือ[From.GetAdjective]จะลอยไดดีแคไหนหากไมมีเหล็กกลาจาก[Root.GetAdjective]"
 MTG_naval_treaty.6.b: "สนธิสัญญาจะแข็งแกรงไดก็เพียงเทาเจตจํานงที่จะรักษามันไว..."
 MTG_naval_treaty.7.t: "[From.GetNameDefCap] ละทิ้งสนธิสัญญานาวี"
 broken_naval_treaty_opinion_mod: "เพิกเฉยตอการลงโทษตามสนธิสัญญา"
 MTG_naval_treaty.7.desc: "วันนี้ [From.GetLeader] ประกาศวา [From.GetNameDef] จะไมถือวาตนผูกพันตามสนธิสัญญานาวีที่เคยลงนามไวอีกตอไป เขากลาววาสถานการณโลกทําใหการเลือกนี้หลีกเลี่ยงไมได ดูเหมือน [From.GetNameDefCap] จะไดรับรายงานที่เชื่อถือไดวาประเทศเพื่อนบานหลายประเทศไดเริ่มโครงการขยายกองทัพเรืออยางกาวราว ซึ่งคุกคามผลประโยชนอันชอบธรรมของฝาย[From.GetAdjective]ในภูมิภาค\n\nกองบัญชาการทหารเรือ[From.GetAdjective]ปฏิเสธที่จะแสดงความเห็นตอขาวลือวาเรือหลายลําที่กําลังตออยูถูกวางแผนไวตั้งแตตนโดยไมคํานึงถึงขอจํากัดของสนธิสัญญา"
 MTG_naval_treaty.7.a: "เราควรทบทวนการเขารวมสนธิสัญญาของเราเอง"
 MTG_naval_treaty.8.t: "จุดจบของสนธิสัญญานาวีลอนดอน"
 MTG_naval_treaty.8.desc: "เมื่อเหลือเพียงสองชาติที่ยังยึดถือสนธิสัญญานาวีลอนดอน ก็เปนเพียงเรื่องของเวลาที่ชาติใดชาติหนึ่งจะถอนตัว และทําใหสนธิสัญญาสิ้นสุดลงโดยสมบูรณ เห็นไดชัดวารัฐบาลของ [From.GetNameDef] ตัดสินวาสนธิสัญญาไมบรรลุวัตถุประสงคที่ระบุไวอีกตอไป และการจํากัดอาวุธทางเรือของตนเปนภัยตอความมั่นคงของชาติ\n\nผูเชี่ยวชาญจํานวนมากทั่วโลกคาดการณวางบประมาณกองทัพเรือจะเพิ่มขึ้นอยางรวดเร็ว เพราะหลายประเทศตองการชดเชยขอจํากัดอันเขมงวดของสนธิสัญญาตลอดหลายทศวรรษ"
 MTG_naval_treaty.8.a: "แนวคิดที่ถูกกําหนดใหลมเหลวตั้งแตแรก"
 MTG_naval_treaty.8.b: "เราเลือกถูกแลว"
 MTG_naval_treaty.8.c: "นี่คือจุดเริ่มตนของการแขงขันเรือเดรดนอตครั้งใหมหรือ?"
 MTG_naval_treaty.9.t: "ลงนามสนธิสัญญานาวีลอนดอนฉบับที่สอง"
 MTG_naval_treaty.9.desc: "คณะผูแทนจากอังกฤษ ฝรั่งเศส อิตาลี ญี่ปุน และสหรัฐอเมริกา ประชุมกันในเดือนธันวาคม 1935 เพื่อหารือการตออายุสนธิสัญญานาวีลอนดอนฉบับแรก ซึ่งจํากัดจํานวนและขนาดของเรือลาดตระเวนและเรือดํานํ้า การเจรจาดุเดือดไมนอยในประเด็นสงครามของอิตาลีในเอธิโอเปย และความตองการของญี่ปุนที่จะไดรับการยอมรับวาเทาเทียมกับอังกฤษและสหรัฐฯ\n\nเมื่อการเจรจาสิ้นสุดลง ชาติผูลงนามไดตกลงจํากัดขนาดของเรือประจัญบานและเรือบรรทุกเครื่องบิน โดยหวังจะปองกันการแขงขันสะสมอาวุธที่สรางความหายนะอีกครั้ง"
 MTG_naval_treaty.9.a: "สิ่งนี้จะปกปองสันติภาพไดดีกวาเรือประจัญบานยักษใด ๆ!"
 MTG_naval_treaty.9.b: "ทําไมพวกเขาถึงจํากัดตัวเองแบบนี้?"
 MTG_naval_treaty.9.c: "ถาเชนนั้นก็มีเงินใหกองทัพบกมากขึ้น"
 MTG_naval_treaty.9.d:  "ใครจะไปสนกองทัพเรือ..."
 MTG_naval_treaty.11.t: "ยกเลิกสนธิสัญญานาวี"
 MTG_naval_treaty.11.desc: "เมื่อสงครามปะทุขึ้น รัฐบาล[From.GetAdjective]ไดแจงชาติผูลงนามที่เหลือของสนธิสัญญานาวีลอนดอนอยางเปนทางการวา ตามมาตรา 24 รัฐบาลถือวาขอจํากัดของสนธิสัญญานาวีไมเปนประโยชนตอชาติอีกตอไป เอกอัครราชทูต[From.GetAdjective]จึงประกาศระงับสนธิสัญญานาวีตลอดชวงสงคราม ยังตองรอดูวาขอจํากัดจะกลับมามีผลบังคับหลังสงครามสิ้นสุดหรือไม แตในขณะนี้ เราควรถือวาตนไมผูกพันตามพันธกรณีของสนธิสัญญาอีกตอไปในการออกแบบและตอเรือ"
 MTG_naval_treaty.11.a: "เปนความพยายามอันสูงสงในการปกปองสันติภาพ"
 mtg_britain.999.t: "พระราชวังบักกิงแฮมถูกทิ้งระเบิด - พระเจาเอ็ดเวิรดสวรรคต"
 mtg_britain.999.d: "การทิ้งระเบิดทางยุทธศาสตรอยางหนักในเขตเมืองหลวงไดกอความสูญเสียครั้งใหญที่สุดแลว เมื่อเวลา 3:41 p.m. บายวานนี้ สวนเซนตเจมสและพระราชวังบักกิงแฮมถูกโจมตีโดยเครื่องบินทิ้งระเบิดของขาศึกหลายลํา แมหนวยกูภัยจะมาถึงที่เกิดเหตุภายในไมกี่นาที แตก็ตองสรุปวาพระเจาเอ็ดเวิรดและวอลลิสพระชายาสวรรคตและสิ้นพระชนมทันที เมื่อระเบิดลูกหนึ่งระเบิดขึ้นทําใหเพดานหองใตดินถลมลงมาทับ\n\nแมการสวรรคตของพระมหากษัตริยจะทําใหทั้งชาติตกอยูในความโศกเศรา แตการเตรียมพระราชพิธีบรมราชาภิเษกของผูสืบราชสันตติวงศก็เริ่มขึ้นแลว ผลจากการอภิเษกสมรสแบบมอรแกเนติกของพระมหากษัตริย ทําใหสายการสืบราชสันตติวงศตกไปยังอัลเบิรต พระอนุชาของพระองค ซึ่งทรงเลือกพระนามรัชกาลวาจอรจที่ 6 ขณะเตรียมเขาพระราชพิธีบรมราชาภิเษก"
 mtg_britain.999.a: "พระราชาสวรรคตแลว พระราชาจงทรงพระเจริญ!"
 mtg_britain.1000.t: "พระเจาจอรจที่ 6 สวรรคต"
 mtg_britain.1000.d: "เชานี้มีขาวการสวรรคตของพระเจาจอรจที่ 6 ระยะหลังความเครียดจากสงครามไดบั่นทอนพระพลานามัยของพระมหากษัตริยมากขึ้นเรื่อย ๆ และในที่สุดการสูบบุหรี่จัดของพระองค ซึ่งนําไปสูภาวะหลอดเลือดแดงแข็งและโรคเบอรเกอร ทําใหเอลิซาเบธพระราชธิดาตองรับพระราชกรณียกิจหลายอยางแทนพระราชบิดาไปแลว\n\nบัดนี้เอลิซาเบธจะเสด็จขึ้นครองราชบัลลังกตอจากพระราชบิดา โดยใชพระนามรัชกาลวาเอลิซาเบธที่ 2 แมจะยังทรงพระเยาว แตพระองคทรงไดรับการเตรียมพรอมสําหรับวาระนี้มาตั้งแตการอภิเษกสมรสแบบมอรแกเนติกของพระปตุลาทําใหสายการสืบราชสันตติวงศชัดเจน และคาดวาจะทรงเปนสมเด็จพระราชินีที่ดีแมจะยังทรงพระเยาว"
 mtg_britain.1000.a: "พระราชาสวรรคตแลว สมเด็จพระราชินีจงทรงพระเจริญ!"
 mtg_news.55.t: "พระเจาเอ็ดเวิรดสวรรคต"
 mtg_news.55.desc: "การทิ้งระเบิดลอนดอนเมื่อเร็ว ๆ นี้ทําใหพระเจาเอ็ดเวิรดและวอลลิสพระชายาสวรรคตและสิ้นพระชนม ราว 3 นาฬกา การโจมตีทางอากาศแบบจูโจมบีบใหทั้งสองพระองคตองหลบภัยในหองใตดินของพระราชวัง ระเบิดลูกหนึ่งตกถูกอาคารดานบนและทําใหเพดานหองใตดินถลมลงมาทับพระมหากษัตริยและผูติดตาม\n\nขณะที่ทั้งชาติโศกเศรากับการสูญเสียพระมหากษัตริย อัลเบิรต พระอนุชาของพระองค กําลังเตรียมสืบราชสมบัติ โดยใชพระนามรัชกาลวาจอรจที่ 6"
 mtg_news.55.a: "แมจะไมเต็มพระทัย แตพระองคจะทรงรับใชประเทศไดดี"
 mtg_news.55.b: "พวกเขาตองชดใชดวยราคาสูงสุด"
 mtg_news.56.t: "[From.GetName] สถาปนาระบอบกษัตริยในอเมริกา"
 mtg_news.56.desc: "หลังพิชิตแผนดินใหญอเมริกาไดไมนาน [From.GetLeader] ไดออกพระราชกฤษฎีกายกเลิกตําแหนงประธานาธิบดีแหงสหรัฐอเมริกา และแทนที่ดวยโครงสรางการปกครองแบบกษัตริยคลายกับของ [From.GetNameDef] ผูที่พระเจาเอ็ดเวิรดทรงเลือกใหขึ้นครองบัลลังกนี้ไมใชใครอื่น นอกจากพระชายาของพระองค สมเด็จพระราชินีวอลลิส ซึ่งนับจากนี้จะทรงพระนามรัชกาลวาวอลลิสที่ 1 และปกครองสหราชอาณาจักรอเมริกาในพระนามของพระสวามี\n\nยังตองรอดูวาสาธารณชนอเมริกันจะปรับตัวกับรูปแบบการปกครองใหมนี้อยางไร"
 mtg_news.56.a: "ชาติที่ไมมีกษัตริยจะเปนชาติไดอยางไร? หรือราชินีก็ตาม"
 mtg_news.56.b: ""ผูลางแคนใหงานเลี้ยงนํ้าชาบอสตัน" เอาจริงหรือ?!"
 mtg_news.56.c: "ความรักของพระราชาไรขอบเขต"
 mtg_news.57.t: "การสถาปนาเครือจักรภพอเมริกาเหนือ"
 mtg_news.57.desc: "หลังพิชิตแผนดินใหญอเมริกาไดไมนาน [From.GetLeader] ไดออกพระราชกฤษฎีกาผนวกอดีตสหรัฐอเมริกาเขากับเครือจักรภพแคนาดา และเปลี่ยนชื่อเปนเครือจักรภพอเมริกาเหนือ"
 mtg_news.57.a: "สิ่งนี้จะเปนประโยชนอยางมากตอการบริหารจักรวรรดิ"
 mtg_news.57.b: "ความรับผิดชอบอันยิ่งใหญ"
 mtg_news.57.c: "พวกเขากําลังรวบอํานาจ"
 mtg_news.59.t: "พระเจาจอรจที่ 6 สวรรคต"
 mtg_news.59.desc: "รัฐบาล[ENG.GetAdjective]ไดยืนยันในวันนี้ถึงการสวรรคตของพระเจาจอรจที่ 6 เปนเวลานานแลวที่การสูบบุหรี่จัดของพระองค ซึ่งนาจะมีสาเหตุจากความตึงเครียดของสงคราม ไดบั่นทอนพระพลานามัยลงเรื่อย ๆ จนในที่สุดทรงประชวรดวยมะเร็งปอด ภาวะหลอดเลือดแดงแข็ง และโรคเบอรเกอร\n\nขณะนี้ไดเริ่มเตรียมการพระราชพิธีบรมราชาภิเษกของเจาหญิงเอลิซาเบธ พระราชธิดา ซึ่งในระยะหลังไดทรงรับพระราชภารกิจหลายประการแทนพระราชบิดาอยูแลว"
 mtg_news.59.a: "พระชนมายุที่ยังนอยมิไดสะทอนถึงความเขมแข็งของพระองค"
 mtg_netherlands.66.t: "[ENG.GetName]ครอบงําการเจรจาการคาของ[HOL.GetAdjective]"
 mtg_netherlands.66.d.a: "อังกฤษไดขยายอิทธิพลเหนือเราจนถึงขั้นที่เราจําตองเอื้อประโยชนใหพวกเขาในการเจรจาการคาครั้งนี้"
 mtg_netherlands.66.d.b: "อังกฤษไดขยายอิทธิพลเหนือ[HOL.GetNameDef]จนถึงขั้นที่รัฐบาล[HOL.GetAdjective]รูสึกวาจําตองเอื้อประโยชนใหพวกเขาในการเจรจาการคาครั้งนี้"
 mtg_netherlands.66.a: "นากังวล"
 mtg_netherlands.66.b: "เราปลอยใหพวกเขาไหลเขาสูเขตอิทธิพลของ[ENG.GetAdjective]ไมได!"
 mtg_netherlands.67.t: "[GER.GetName]ครอบงําการเจรจาการคาของ[HOL.GetAdjective]"
 mtg_netherlands.67.d.a: "เยอรมันไดขยายอิทธิพลเหนือเราจนถึงขั้นที่เราจําตองเอื้อประโยชนใหพวกเขาในการเจรจาการคาครั้งนี้"
 mtg_netherlands.67.d.b: "เยอรมันไดขยายอิทธิพลเหนือ[HOL.GetNameDef]จนถึงขั้นที่รัฐบาล[HOL.GetAdjective]รูสึกวาจําตองเอื้อประโยชนใหพวกเขาในการเจรจาการคาครั้งนี้"
 mtg_netherlands.67.b: "เราปลอยใหพวกเขาไหลเขาสูเขตอิทธิพลของ[GER.GetAdjective]ไมได!"
 mtg_netherlands.69.t: "ประชาชนทองถิ่นตอตานการปลอยนํ้าทวม ‘ไรเหตุผล’"
 mtg_netherlands.69.d: "เมื่อดูเหมือนไมมีความจําเปนเรงดวนใด ๆ ที่ตองปลอยนํ้าทวมแนวปองกันนํ้าของดัตช ประชาชนในทองถิ่นจึงเริ่มเรียกรองใหระบายนํ้าออกจากพื้นที่ชนบท เพื่อใหพวกเขากลับไปใชชีวิตตามปกติได การปฏิเสธขอเรียกรองนี้มีแตจะนําไปสูความไมสงบที่มากขึ้นในภายหลัง"
 mtg_netherlands.69.a: "พวกเขาตองอดทนอีกสักพัก"
 mtg_netherlands.69.b: "ระบายนํ้าออกจากผืนดินเถิด"
 mtg_netherlands.70.t: "ผูแปรพักตรชาวเยอรมันจัดตั้งกองพล"
 mtg_netherlands.70.d: "ผูแปรพักตรชาวเยอรมันจํานวนมากไดรวมตัวกันเปนหนวยรบเต็มรูปแบบแลว เพียงแคจัดหายุทโธปกรณให เราก็สงพวกเขาเขาสูสนามรบในนามของเราไดทันที"
 mtg_netherlands.71.t: "ทหารแปรพักตรไปเขากับ[HOL.GetName]"
 mtg_netherlands.71.d: "สมเด็จพระราชินีวิลเฮลมินาแหง[HOL.GetNameDef]ทรงประกาศพระราชประสงคที่จะฟนฟูไกเซอรวิลเฮลมที่ 2 ใหกลับขึ้นครองบัลลังกเยอรมนีหลังสงครามสิ้นสุด คําประกาศนี้กอใหเกิดความหวังลม ๆ แลง ๆ และความภักดีที่ผิดที่ผิดทางในหมูทหารของเรา ซึ่งเริ่มแปรพักตรและพยายามหนีไปยัง[HOL.GetNameDef]เพื่อสูรบในนามของพระราชินี\n\nการปราบปรามกระแสนี้จะยากยิ่ง หากเราไมสามารถยุติสงครามไดอยางเด็ดขาด..."
 mtg_netherlands.71.a: "คนทรยศ! ทุกคนนั่นแหละ!"
 mtg_netherlands.72.d: "เมื่อคืนนี้ ไกเซอรวิลเฮลมที่ 2 ซึ่งประทับอยูในความดูแลของเรามาจนบั้นปลายพระชนมชีพ ไดสวรรคตอยางสงบในขณะบรรทม พระราชโอรสคือฟรีดริช วิลเฮลม ไดขึ้นเปนประมุขแหงราชวงศฟอน โฮเอินโซลแลรน และทรงเลือกพระนามรัชกาลวาวิลเฮลมที่ 3"
 mtg_netherlands.72.a: "ขอตกลงที่เรามีกับพระราชบิดาจะตกทอดมาถึงพระองค"
 mtg_netherlands.73.t: "[HOL_kaiserreich_germany.GetLeader]นําสงครามกลางเมืองเยอรมัน"
 mtg_netherlands.73.d: "เมื่อปลดปลอยดินแดนเยอรมันผืนแรกไดแลว สมเด็จพระราชินีวิลเฮลมินาก็ทรงทําตามพระปฏิญาณแรกเริ่ม โดยใหไกเซอร[HOL_kaiserreich_germany.GetLeader]จัดตั้งรัฐบาลชั่วคราวขึ้นในดินแดนที่ยึดครองได บัดนี้[HOL_kaiserreich_germany.GetLeader]สามารถนําสงครามเพื่อปลดปลอยสวนที่เหลือของประเทศจากบนผืนแผนดินเยอรมันเอง และดึงดูดผูคนใหมารวมรบในนามของพระองคมากขึ้นเรื่อย ๆ"
 mtg_netherlands.73.a: "กาวสําคัญสูยุโรปแหงระบอบกษัตริย!"
 mtg_netherlands.74.t: "[HOL_kaiserreich_germany.GetLeader]เสนอเปนพันธมิตร"
 mtg_netherlands.74.d: "เมื่อสงครามสิ้นสุดลง [HOL_kaiserreich_germany.GetLeader]เห็นสมควรที่จะเตือนเราถึงขอตกลงที่เคยใหไว และเสนอใหสองชาติของเราเปนพันธมิตรกันอยางเทาเทียม เพื่อรับมือกับการตอตานจากฝายตะวันตกที่ยอมเกิดขึ้นตอยุโรปแหงระบอบกษัตริยใหมนี้"
 mtg_netherlands.74.a: "เราจะทําตามพันธะของเรา"
 mtg_netherlands.75.t: "วิลเฮลมินาตอรองกับวิลเฮลมที่ 2"
 mtg_netherlands.75.d: "ในสิ่งที่เรียกไดเพียงวาเปนการดูหมิ่นเราอยางสิ้นเชิง สมเด็จพระราชินีวิลเฮลมินาแหง[HOL.GetAdjective]ไดทรงประกาศพระราชปณิธานที่จะนําวิลเฮลมที่ 2 กลับขึ้นครองบัลลังกเยอรมนีหลังสงครามครั้งนี้สิ้นสุดลง พระนางยังเชิญชวนชาวเยอรมันทุกคนที่ตองการสูเพื่อไกเซอรองคเกาใหเดินทางไปยังดินแดนที่[HOL.GetAdjective]ยึดครองอยู ซึ่งเห็นไดชัดวาเปนความพยายามบั่นทอนสถานะของ[GER.GetAdjective]และเสริมสถานะของพระนางเอง"
 mtg_netherlands.75.a: "นารังเกียจ - ไวเราคอยจัดการพระนางทีหลัง"
 mtg_netherlands.76.t: "กองทหารเยอรมันของพระราชินียุบตัว"
 mtg_netherlands.76.d: "เมื่อสงครามสิ้นสุดลง ทหารเยอรมันที่สูรบในนามของเราไดกลับสูมาตุภูมิ และเตรียมพรอมที่จะสูเพื่อไกเซอรของพวกเขาโดยตรง"
 mtg_netherlands.76.a: "เปนเรื่องที่หลีกเลี่ยงไมได การรับใชของพวกเขามีคาเหลือประมาณ"
 mtg_news.58.desc: "ดวยพระปฏิญาณของสมเด็จพระราชินีวิลเฮลมินาแหง[HOL.GetAdjective]ที่จะนําราชวงศฟอน โฮเอินโซลแลรนกลับคืนสูบัลลังกเยอรมนี ประกอบกับการปลดปลอยดินแดนเยอรมันผืนแรก ไกเซอรจึงไดเสด็จกลับสูดินแดนเยอรมันเพื่อนําสิ่งที่กลายเปนสงครามกลางเมืองเต็มรูปแบบเพื่อแยงชิงอํานาจเหนือมาตุภูมิของพระองค\n\nในขณะเดียวกัน ผูแปรพักตรชาวเยอรมันยังคงหลั่งไหลไปยังดินแดนที่[HOL.GetAdjective]ยึดครองเพื่อสูรบในนามของพระราชินีและไกเซอรของพวกเขา คอย ๆ พลิกดุลกําลังทีละนอย มหาอํานาจฝายสัมพันธมิตรในมหาสงครามยังไมไดออกแถลงการณอยางเปนทางการ แตรายงานบงชี้วารัฐบาลของพวกเขาไมพอใจอยางยิ่ง"
 mtg_news.58.a: "อีกกาวบนเสนทางสูชัยชนะเบ็ดเสร็จ"
 mtg_news.58.b: "พวกเขากลาดีอยางไร?!"
 mtg_news.58.c: "นั่นยังพูดเบาไปดวยซํ้า... ดัตชจะตองไดรับผลกรรม"
 mtg_news.58.d: "นี่คือยอดฝมือทางการทูตหรือความบาบิ่นกันแน?"
 mtg_britain.109.t: "พมาแยกตัว"
 mtg_britain.109.d: "ในสถานการณลาสุด ชาวพมาไดประกาศเอกราชของตนเอง โดยคาดหมายเต็มที่วาเรากําลังวุนอยูกับชาวปากีสถาน จึงไมอาจจัดการกับพวกเขาได"
 mtg_britain.109.a: "เราไมมีทางเลือกนอกจากตองยอมรับ"
 mtg_britain.113.t: "[From.GetName]กลับเขารวมจักรวรรดิ"
 mtg_britain.113.d: "หลังจากชนะสงครามกลางเมืองและรวมมาตุภูมิไดอีกครั้ง ผูนําของ[From.GetNameDef]ไดขอกลับเขารวมจักรวรรดิ ดวยปรารถนาการชี้นําและการคุมครองจากเราสําหรับสิ่งที่อาจเกิดขึ้นในอนาคต"
 mtg_britain.113.a: "เรายินดีตอนรับพวกเขากลับสูออมอก"
 mtg_news.62.desc: "ผูแทนรัฐบาลของเครือจักรภพในปกครองตนเองประกาศในวันนี้วาจะตัดความสัมพันธกับราชบัลลังกโดยฝายเดียว โดยอางวาเหตุผลหลักที่ความสัมพันธระหวางอังกฤษกับเครือจักรภพไมอาจดําเนินตอไปไดคือการที่กษัตริยทรงเพิกเฉยตอความเห็นและความปรารถนาของรัฐบาลและประชาชนในดินแดนเหลานั้นอยางโจงแจง วิกฤตครั้งนี้ซึ่งเกิดจากพระราชประสงคที่จะอภิเษกสมรสกับวอลลิส ซิมปสัน ไดนําไปสูการกอตั้งเครือจักรภพแหงประชาชาติขึ้นใหมรวมกับดินแดนในปกครองตนเองตาง ๆ และดูเหมือนวาภาวะชะงักงันของรัฐบาลอังกฤษในขณะนี้จะทําใหไมอาจดําเนินการใด ๆ ตอบโตได ซึ่งยอมเปนสิ่งที่ดินแดนเหลานั้นหวังไวอยางไมตองสงสัย"
 mtg_news.62.b: "จักรวรรดิกําลังอยูในวิกฤต"
 mtg_news.63.t: "[Root.GetName]ประกาศเอกราช"
 mtg_news.63.desc: "รัฐบาล[Root.GetAdjective]ประกาศในวันนี้วาจะตัดความสัมพันธกับรัฐบาล[ENG.GetAdjective]โดยฝายเดียว โดยอางวาเหตุผลหลักคือไมอาจประนีประนอมแนวคิดทางการเมืองของตนกับพัฒนาการทางการเมืองที่กําลังเกิดขึ้นใน[ENG.GetName]ได"
 mtg_netherlands.77.t: "[From.GetNameDef]เสนอใหรวมเปนสหพันธ"
 mtg_netherlands.77.d: "รัฐบาล[From.GetAdjective]ไดยื่นขอเสนอตอรัฐบาลของเราใหรวมกลุมประเทศตํ่าเปนรัฐเดียว โดยใหเหตุผลวาวิกฤตการณโลกในปจจุบันจําเปนตองอาศัยความรวมมือและความเปนหนึ่งเดียวที่ใกลชิดยิ่งขึ้นระหวางประชาชนของเรา ในแบบที่จะบรรลุไดก็ดวยการรวมชาติอยางสมบูรณเทานั้น หากเรายอมรับ จะมีการเตรียมการสละอํานาจอธิปไตยทันทีใหแกรัฐเหนือชาติแหงใหมภายใตการนําของ[From.GetAdjective]"
 mtg_netherlands.77.a: "ความคิดอันยอดเยี่ยม - หากไมมีสิ่งนี้เรายอมไมมีทางรอด"
 mtg_netherlands.77.b: "อํานาจอธิปไตยของเราสําคัญที่สุด - เราจะรวมมือไดมาก แตไมถึงขั้นนั้น"
 mtg_netherlands.78.t: "[From.GetNameDef]ยอมรับการรวมเปนสหพันธ"
 mtg_netherlands.78.d: "รัฐบาล[From.GetAdjective]แจงเราวาเห็นชอบกับขอเสนอของเราในการตั้งรัฐเดียวในกลุมประเทศตํ่า หากทุกฝายยอมรับ เราก็สามารถดําเนินการตามแผนได"
 mtg_netherlands.79.t: "[From.GetNameDef]ปฏิเสธการรวมเปนสหพันธ"
 mtg_netherlands.79.d: "ผูแทนของ[From.GetAdjective]แจงเราวาในขณะนี้ยังไมเห็นความจําเปนที่จะตั้งรัฐเดียวในกลุมประเทศตํ่า พวกเขาหวังจะรวมมือกับเราตอไป แตขอคงอํานาจอธิปไตยไวอยางเต็มที่"
 mtg_news.64.t: "กลุมประเทศตํ่ารวมเปนหนึ่ง"
 mtg_news.64.desc: "ดวยเหตุผลวามีภัยคุกคามจากภายนอกอยางรายแรงตอความมั่นคงของชาติ รัฐบาลของกลุมประเทศตํ่าไดประกาศรวมรัฐบาลและกองทัพเขาดวยกันโดยทันที เพื่อเสริมสถานะของประชาชน ภายใตการนําของ[From.GetOldAdjective] การลงทุนดานอุตสาหกรรมและการวางแผนปองกันทางทหารจะไดรับความสําคัญเหนือกิจการภายในอื่น ๆ โดยมุงใหกองทัพมีความพรอมเพียงพอที่จะตอบโตการกระทําใด ๆ ที่อาจคุกคามอํานาจอธิปไตยของรัฐใหมนี้"
 mtg_news.64.a: "ประชาชนทุกหมูเหลาของเรายืนหยัดรวมกันปกปองมาตุภูมิ"
 mtg_news.64.b: "รวมกันอีกแลวหรือ? ตัดสินใจใหไดสักทีเถอะ!"
