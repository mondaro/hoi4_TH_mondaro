l_english:
 flag_mexico_cedillo_has_revolted: " นายพลเซดิโยไดกอกบฏตอตานรัฐบาล"
 mexico.1.title: "นายพลเซดิโยกอกบฏ"
 mexico.1.desc: "เปนเวลาระยะหนึ่งแลวที่บรรดานายพลและผูวาการเห็นอํานาจสวนตัวของตนเลือนหายไป ขณะที่รัฐบาลกลางควบคุมเหลาเกาดิโยที่ดื้อดานไดดีขึ้น ประวัติศาสตรการกบฏของขุนศึกทองถิ่นในเม็กซิโกดูเหมือนกําลังจะสิ้นสุดลง แตนาเสียดายที่เราไมไดจัดการกับนายพลเซดิโยแหงซานลุยสโปโตซี และเขาไดรวบรวมกบฏที่ไดรับอภัยโทษและโจรใจโหดไวมากพอที่จะพยายามโคนลมรัฐบาลกลาง ปลด[Root.GetLeader] และปองกันไมใหอํานาจหลุดมือเขาไปอีก"
 mexico.1.a: "คนทรยศ!"
 mexico.2.title: "การโอนกิจการนํ้ามัน[From.GetAdjective]เปนของรัฐ"
 mexico.2.desc: "[From.GetLeader]ไดปลุกปนกระแสประชานิยมไรสาระที่มุงตอตานผลประโยชนทางเศรษฐกิจของเราในเม็กซิโก และบัดนี้[From.GetRulingPartyLong]ไดผานกฎหมายโอนทรัพยสินของ Royal Dutch Shell, Standard Oil of California และบริษัทนํ้ามันระหวางประเทศอื่น ๆ อีกมากมายเปนของรัฐ! แมรัฐธรรมนูญของพวกเขาจะอนุญาตใหทําเชนนี้ได แตความยุติธรรมระหวางประเทศเรียกรองใหชดเชยความเสียหายที่บริษัทไดรับ เหลาเจาพอนํ้ามันกําลังเรียกรองใหเราลงมือ"
 mexico.2.a: "มันเปนเรื่องที่เกิดขึ้นแลว เราทําอะไรไมได"
 mexico.2.b: "เราจะควํ่าบาตรทางการคากับเม็กซิโกจนกวาพวกเขาจะไดสติ"
 mexico.2.c: "ทางเลือกของเรามีจํากัด ตองพิจารณาใชกําลังอาวุธ"
 mexico.3.title: "การควํ่าบาตรของ[From.GetAdjective]"
 mexico.3.desc: "เพื่อตอบโตการที่เราโอนสัมปทานนํ้ามันของพวกเขาเปนของรัฐ [From.GetLeader]ไดตัดสินใจยอมรับขอเรียกรองของบริษัทนํ้ามันและประกาศควํ่าบาตรประเทศของเรา [From.GetNameDef]จะไมซื้อหรือขายทรัพยากรกับเราอีกตอไป เราควรพิจารณาวาจะชดเชยใหบริษัทนํ้ามัน หรือละทิ้งสถานะเดิมของระเบียบระหวางประเทศแลวไปแสวงหาโชคกับศัตรูของทุนนิยมเสรี"
 mexico.3.a: "ประชาชนเม็กซิโกจะไมยอมเรื่องนี้!"
 mexico.4.title: "การชดเชยของ[From.GetAdjective]"
 mexico.4.desc: "รัฐบาลของ[From.GetLeader]ตกลงตามขอเรียกรองของ Royal Dutch Shell และ Standard Oil of California ที่ขอคาชดเชยสําหรับความเสียหายที่บริษัทไดรับระหวางการโอนแหลงนํ้ามันเปนของรัฐ แม[From.GetNameDef]จะไมคืนสัมปทานนํ้ามันใด ๆ แตอยางนอยเกียรติภูมิของชาติและผลประโยชนทางการเงินของเราก็ไดรับการตอบสนอง"
 mexico.4.a: "ดี เราคาขายภายใตเงื่อนไขนี้ได"
 mexico.4.b: "คงการควํ่าบาตรไว เรากําลังรอขอตกลงที่ดีกวานี้"
 mexico.8.title: "[From.GetAdjective]เขารวม[Root.GetFactionName]"
 mexico.8.desc: "[From.GetLeader]ไดยื่นคําขอเขารวม[Root.GetFactionName] ไมทราบวาเขาตองการการคุมครองซึ่งกันและกันหรือการขยายดินแดน แตนํ้ามันของเม็กซิโกเปนทรัพยสินอันมีคาที่ควรมีไวขางเรา"
 mexico.8.a: "เราจะสนับสนุนใหเม็กซิโกเขารวม[Root.GetFactionName]"
 mexico.8.b: "เรามีแผนอื่นสําหรับเม็กซิโก"
 mexico.9.title: "เม็กซิโกเขารวม[Root.GetFactionName]"
 mexico.9.desc: "[From.GetLeader]ไดสนับสนุนคําขอของเม็กซิโกในการเขารวม[Root.GetFactionName] ไมทราบวาเม็กซิโกตองการการคุมครองซึ่งกันและกันหรือการขยายดินแดน แตนํ้ามันของเม็กซิโกเปนทรัพยสินอันมีคาที่ควรมีไวขางเรา"
 mexico.9.a: "เราจะสนับสนุนใหเม็กซิโกเขารวม[Root.GetFactionName]"
 mexico.9.b: "เรามีแผนอื่นสําหรับเม็กซิโก"
 mexico.10.title: "[From.GetFactionName]"
 mexico.10.desc: "[From.GetLeader]ไดเชิญ[Root.GetNameDef]เขารวม[From.GetFactionName] กลุมประเทศฝายขวานี้จะปกปองละตินอเมริกาจากการแทรกซึมของคอมมิวนิสต พรอมกับเดินบนเสนทางที่เปนอิสระจากพวกแยงกีผูเสื่อมทราม"
 mexico.10.a: "[Root.GetLeader]ยอมรับขอเสนอ"
 mexico.10.b: "ชาวอเมริกันจะไมยอมรับแผนการเชนนี้"
 mexico.11.title: "[From.GetFactionName]"
 mexico.11.desc: "[From.GetLeader]ไดเชิญ[Root.GetNameDef]เขารวม[From.GetFactionName] กลุมประเทศฝายซายนี้จะปกปองละตินอเมริกาจากทรราชฟาสซิสต พรอมกับเดินบนเสนทางที่เปนอิสระจากพวกแยงกีผูกดขี่"
 mexico.11.a: "[Root.GetLeader]ยอมรับขอเสนอ"
 mexico.11.b: "ชาวอเมริกันจะไมยอมรับแผนการเชนนี้"
 mexico.12.title: "การขายบริติชฮอนดูรัส"
 mexico.12.desc: "[From.GetLeader]ไดขอให[Root.GetNameDef]ขายดินแดนเล็ก ๆ ของบริติชฮอนดูรัส ซึ่งบางครั้งเรียกวาเบลีซ จักรวรรดิสเปนเคยอางสิทธิ์เหนือภูมิภาคนี้แตไมเคยเขาไปตั้งถิ่นฐาน เม็กซิโกจึงแทบไมมีสิทธิ์ที่แทจริงเหนือดินแดนนี้ อยางไรก็ตาม เราอาจขายดินแดนนี้ใหมิตรชาวเม็กซิกันของเราเพื่อแสดงความจริงใจ"
 mexico.12.a: "[Root.GetLeader]ยอมรับขอเสนอ"
 mexico.12.b: "ดินแดนนั้นมีประโยชนในฐานะฐานทัพเรือ"
 mexico.13.title: "อังกฤษยกเบลีซให"
 mexico.13.desc: "[From.GetLeader]ตกลงที่จะสงมอบการควบคุมอดีตอาณานิคมบริติชฮอนดูรัสใหแกเราเพื่อแสดงความจริงใจ รัฐนี้มีขนาดเล็ก ยังไมพัฒนา และขาดทรัพยากรธรรมชาติอื่นนอกจากไม แตสิ่งนี้แสดงใหเห็นถึงสถานะที่ดีขึ้นของเม็กซิโกบนเวทีโลก"
 mexico.13.a: "[From.GetNameDef]เปนมิตรแทของเราอยางแทจริง"
 mexico.14.title: "อังกฤษปฏิเสธการขายเบลีซ"
 mexico.14.desc: "[From.GetLeader]ปฏิเสธที่จะขายอาณานิคมบริติชฮอนดูรัสใหแกเรา โดยอางถึงประโยชนในฐานะฐานทัพเรือ รัฐบาล[From.GetAdjective]แถลงวาตองการรักษาอาณานิคมนี้ไว ผูอยูอาศัยสวนใหญพูดภาษาอังกฤษ การปฏิเสธจึงเปนเรื่องที่เขาใจได แมจะนาผิดหวัง"
 mexico.14.a: "บางที[From.GetAdjective]อาจไมใชมิตรของเราจริง ๆ"
 mexico.15.title: "อารชบิชอปปสกวล ดิอัส ถึงแกมรณภาพ"
 mexico.15.desc: "พระอัครสังฆราชปสกวล ดิอัส อี บารเรโต อารชบิชอปแหงเม็กซิโกซิตี ถึงแกมรณภาพในวันนี้ดวยโรคลําไสใหญอักเสบ สิริอายุ 59 ป มรดกของทานคือการตอตานนโยบายสังคมนิยมของรัฐบาลอยางแข็งกราว ควบคูกับความพยายามประนีประนอมในชวงทายของสงครามคริสเตโร\n\nผูสืบทอดตําแหนงคือลุยส มาริอา มารติเนซ นักปฏิรูปสังคมและสหายสวนตัวของประธานาธิบดีการเดนัส ผูสืบทอดตําแหนงคงไดรับเลือกโดยพระสันตะปาปาเพื่อใหศาสนจักรและรัฐบาลในเม็กซิโกยังคงอยูอยางสันติตอไป"
 mexico.15.a: "ขอใหทานไปสูสุคติ"
 mexico.15.b: "ไปลุกเปนไฟในนรกเถอะ ไอคนทรยศ"
 mexico.16.title: "การนัดหยุดงานของคนงานนํ้ามัน"
 mexico.16.desc: "คนงานนํ้ามันรวมตัวกันเปนสหภาพในป 1935 โดยไดรับความเห็นชอบจากประธานาธิบดีการเดนัส กอตั้งเปน Sindicato Único de Trabajadores Petroleros พวกเขาเริ่มเจรจาขอคาจางที่สูงขึ้นและสภาพการทํางานที่ดีขึ้นทันที แตถูกปฏิเสธโดยบริษัทนํ้ามันระหวางประเทศทรงอิทธิพลอยาง Royal Dutch Shell และ Standard Oil of California เรื่องนี้ถูกสงตอไปยังคณะกรรมการอนุญาโตตุลาการและทายที่สุดก็ขึ้นสูศาล โดยประเด็นรอนคือบริษัทนํ้ามันสามารถจายคาจางที่สูงขึ้นไดหรือไม\n\nจากการสอบสวนเมื่อเร็ว ๆ นี้ บริษัทสาขาในเม็กซิโกทํากําไรไดมากกวาบริษัทนํ้ามันในสหรัฐอเมริกาเสียอีก แตยังคงปฏิเสธที่จะตกลงกับคนงาน ดูเหมือนพวกเขาจะไดรับการหนุนหลังจากผูมีอิทธิพลในทองถิ่นและมองวาตนอยูเหนือกฎหมาย"
 mexico.16.a: "อุกอาจ! การขูดรีดนี้ผิดศีลธรรมและตองยุติ!"
 mexico.16.b: "นั่นแหละทุนนิยม"
 mexico.17.title: "ทรอตสกีเดินทางมาถึง"
 mexico.17.desc: "เลฟ ทรอตสกี นักปฏิวัติคอมมิวนิสตและนักเขียน ผูถูกเนรเทศออกจากสหภาพโซเวียตเพราะตอตานการขึ้นสูอํานาจของสตาลิน ถูกกลาวโทษในปญหาสารพัดตั้งแตความพายแพทางทหารไปจนถึงอุบัติเหตุในอุตสาหกรรม และถูกแรงกดดันทางการเมืองขับไลจากประเทศหนึ่งไปอีกประเทศหนึ่ง ไดเดินทางมาถึงเม็กซิโกหลังจากโดยสารเรือบรรทุกนํ้ามันมาจากนอรเวย"
 mexico.17.a: "เราไมใชหุนเชิดของสตาลิน ใหที่ลี้ภัยแกเขา"
 mexico.17.b: "สงตัวเขาขามแดนไปยังสหภาพโซเวียตเพื่อรับการพิจารณาคดีตามความผิด"
 mexico.17.c: "เขาเปนอัจฉริยะดานการจัดองคกร เชิญเขาเขารวมรัฐบาล"
 mexico_extradited_trotsky: "สงตัวทรอตสกีขามแดนแลว"
 mexico_communist_menace: "ภัยคุกคามคอมมิวนิสต"
 mexico_snubbed_stalin: "หักหนาสตาลิน"
 mexico_trotskyite_wreckers: "พวกบอนทําลายสายทรอตสกี"
 flag_mexico_invited_trotsky_to_government: " ทรอตสกีไดรับเชิญใหเขารวมรัฐบาล"
 flag_trotsky_dead: " ทรอตสกีถูกสายลับของฝายสตาลินสังหาร"
 mexico.18.title: "การรณรงคหาเสียงเลือกตั้งเริ่มตนขึ้น"
 mexico.18.desc: "การรณรงคหาเสียงเลือกตั้งประธานาธิบดีคนตอไปมีกําหนดเริ่มตนในอีกไมกี่วันขางหนา การปฏิรูปรัฐธรรมนูญป 1933 ถูกนํามาใชเพื่อตอบสนองตอความโกรธแคนตอแนวคิดที่กาเยสจะดํารงตําแหนงประธานาธิบดีเปนสมัยที่สอง และหลังจากการลอบสังหารอัลบาโร โอเบรกอน ผูดํารงตําแหนงกอนกาเยสที่พยายามจะดํารงตําแหนงสมัยที่สองเชนกัน การปฏิรูปนี้หามไมใหเจาหนาที่ที่ไดรับเลือกตั้งดํารงตําแหนงสองครั้ง แมวาจะเคยเปนเพียงผูรักษาการหรือผูดูแลชั่วคราวก็ตาม ซึ่งชวยปองกันไมใหเกิดยุคปอรฟริอาโตซํ้าอีก อันเปนยุคที่จอมเผด็จการปอรฟริโอ ดิอัส ครองตําแหนงถึงเจ็ดสมัยในชวงสามสิบป และเปนชนวนใหเกิดการปฏิวัติเม็กซิโกป 1910 ซึ่งทําใหประเทศจมอยูในความขัดแยงภายในนานนับทศวรรษ\n\nกฎหมายนี้มีขอดีคือทําใหเครือขายอุปถัมภนอกพรรคดํารงอยูไดยากขึ้น แตก็ทําใหเจาหนาที่ไมตองรับผิดชอบตอผูเลือกตั้งโดยตรง เพราะพวกเขาจะยายไปอยูในรัฐบาลระดับอื่นหลังหมดวาระ ทําใหตองพึ่งพาระบบอุปถัมภภายในพรรค"
 mexico.18.a: "การปฏิรูปรัฐธรรมนูญนี้จําเปนตอเสถียรภาพของประเทศ"
 mexico.18.b: "ไรสาระ! [Root.GetLeader]รูดีที่สุด เขาจะดํารงตําแหนงสมัยที่สอง!"
 mexico.19.title: "ผูสืบทอดของ[Root.GetRulingParty]"
 mexico.19.desc: "ภายในพรรคกําลังหารือกันเรื่องผูสืบทอดตําแหนงตอจาก[Root.GetLeader] การเลือกตั้งที่มีการแขงขันอยางแทจริงยังคงไมมั่นคงในเม็กซิโก และ[Root.GetRulingPartyLong]ที่ครองอํานาจ ซึ่งประสานงานกับกองทัพและหนวยงานความมั่นคง ยอมชนะการเลือกตั้งทั่วไปอยางแนนอน"
 mexico.19.a: "ฟรันซิสโก มูฮิกา นายพลแหงการปฏิวัติและนักปฏิรูปสังคม"
 mexico.19.b: "มานูเอล อาบิลา กามาโช เสนาธิการทหารผูครํ่าหวอด"
 mexico.19.c: "ซาตูรนิโน เซดิโย เกาดิโยฝายขวา"
 mexico.19.d: "ฮวน อันเดรว อัลมาซัน นักธุรกิจฝายขวา"
 mexico.19.e: "บิเซนเต โลมบารโด นักสหภาพแรงงานหัวรุนแรง"
 mexico.19.f: "ฟรันซิสโก มูฮิกา นายพลแหงการปฏิวัติและนักปฏิรูปสังคม"
 mexico.19.g: "มานูเอล อาบิลา กามาโช เสนาธิการทหารผูครํ่าหวอด"
 mexico.19.h: "ฮวน อันเดรว อัลมาซัน นักธุรกิจและนายพลฝายขวา"
 mexico.19.i: "บิเซนเต โลมบารโด นักสหภาพแรงงานหัวรุนแรง"
 mexico.19.j: "ฟรันซิสโก มูฮิกา นายพลแหงการปฏิวัติและนักปฏิรูปสังคม"
 mexico.19.k: "ดิโอนิซิโอ เอนซินา ผูภักดีตอพรรคสายสตาลิน"
 mexico.19.l: "เอรนัน ลาบอรเด ผูนําพรรคสายทรอตสกี"
 mexico.19.m: "เลฟ ทรอตสกี วีรบุรุษแหงการปฏิวัติเดือนตุลาคม"
 mexico.19.n: "ซาตูรนิโน เซดิโย นายพลแหงการปฏิวัติและผูสมัครสายสืบทอดอํานาจ"
 mexico.19.o: "ฮวน อันเดรว อัลมาซัน นักธุรกิจฝายขวาและนายพลแหงการปฏิวัติ"
 mexico.19.p: "เฆซุส เดโกยาโด กีซาร นายพลแหงฝายคริสเตโร"
 mexico.19.q: "ซัลบาดอร อาบัสกัล ผูนําซินารกิสตาสายแข็งกราว"
 mexico.19.r: "บาเลนติน กัมปา นักสหการนิยมสายรถไฟผูใกลชิดลาบอรเด"
 mexico.20.title: "ฮวน อันเดรวประณามการเลือกตั้ง"
 mexico.20.desc: "ฮวน อันเดรว อัลมาซัน นักธุรกิจฝายขวาและนายพลแหงการปฏิวัติ ไดประณามผลการเลือกตั้งครั้งลาสุด เขาอางวาตนไดรับการสนับสนุนมากกวา และ[Root.GetLeader]ชนะไดก็เพราะการบิดเบือนผลเทานั้น แมเรื่องนี้อาจเปนความจริง แตฮวน อันเดรวก็ทําตัวเหมือนคนแพแลวพาลอยางแนนอน เขาไดลี้ภัยไปยังอเมริกาโดยสมัครใจและกําลังพยายามวางแผนกอรัฐประหารตอ[Root.GetRulingPartyLong] การรักษาความสัมพันธอันดีกับอเมริกาไวจึงเปนเรื่องที่ฉลาด"
 mexico.20.a: "เอาเลย วิ่งไปหาพวกแยงกีสิ"
 mexico.21.title: "เม็กซิโกสงตัวทรอตสกีขามแดน"
 mexico.21.desc: "แมรัฐบาลเม็กซิโกจะสัญญาใหที่ลี้ภัยเมื่อไมกี่เดือนกอน แตทันทีที่เดินทางมาถึง เลฟ ทรอตสกีกลับถูกหนวยความมั่นคงของ[From.GetRulingPartyLong]จับกุม และสงตัวกลับสหภาพโซเวียตทันทีเพื่อรับการพิจารณาคดีจากอาชญากรรมมากมายที่เขากอตอรัฐปฏิวัติ [From.GetLeader]ยังแสดงความหวังวาเม็กซิโกและสหภาพโซเวียตจะมีความสัมพันธที่ใกลชิดกันยิ่งขึ้นในอนาคต"
 mexico.21.a: "ทุบเคนคําสารภาพแลวยิงทิ้งซะ! เรียกพลตรีบลอคิน!"
 mexico.22.title: "เลฟ ทรอตสกีกลับสูสหภาพโซเวียต"
 mexico.22.desc: "หลังจากกระแสตอตานสตาลินเติบโตขึ้นในสหภาพโซเวียต กลุมผูปกครองของประเทศนั้นไดตัดสินใจเรียกตัวทรอตสกีกลับจากการลี้ภัยและตั้งใหเปนผูนําในนามสูงสุดของรัฐบาล เจาหนาที่ขาวกรองของเราประเมินวาเขาจะเปนเพียงหุนเชิดของกลุมอํานาจอื่นในรัสเซียเสียมากกวา แตเลฟ ทรอตสกียืนกรานที่จะกลับสูถิ่นกําเนิดของการปฏิวัติเดือนตุลาคม"
 mexico.22.a: "ดาสวีดานิยา"
 flag_trotsky_has_returned_to_ussr_from_mexico: " ทรอตสกีไดกลับสูสหภาพโซเวียตแลว"
 mexico.23.title: "สงครามเรือดํานํ้าไมจํากัดขอบเขต"
 mexico.23.desc: "ดวยการคุมกันขบวนเรือลําเลียงของขาศึกที่ถูกกระจายจนบางเบา และเรือดํานํ้าของเราที่ออกลาในมหาสมุทรไดโดยไมถูกรบกวน เราสามารถทําลายเรือสินคาที่แลนอยูโดดเดี่ยวไดแทบตามใจ ผูบังคับการเรือดํานํ้าของเราเรียกชวงเวลานี้วา 'ยุคแหงความสุข' มีเปาหมายยั่วยวนใจใหเลือกมากมาย เชน เรือบรรทุกนํ้ามันของเม็กซิโกที่เปนกลาง เหลาพลเรือเอกขออนุญาตโจมตีเรือบรรทุกนํ้ามันเหลานี้ แมกระทรวงการตางประเทศจะเตือนวาอาจสงผลเสียตอความสัมพันธกับเม็กซิโก"
 mexico.23.a: "การคาขายกับศัตรูของเราไมตางอะไรกับการเปนคูสงครามอยางเปดเผย"
 mexico.23.b: "อยาสรางศัตรูเพิ่มเกินความจําเปนจะดีกวา"
 mexico.24.title: "การโจมตีของเรือดํานํ้า U-Boat เยอรมัน"
 mexico.24.desc: "เรือบรรทุกนํ้ามันของเม็กซิโก 'โปเตรโร เดล ยาโน' และ 'ฟาฆา เด โอโร' ถูกฝูงหมาปาเยอรมันที่ปฏิบัติการตามหลักนิยม 'สงครามเรือดํานํ้าไมจํากัดขอบเขต' จมลงสูกนทะเลแคริบเบียน การโจมตีเรือของประเทศที่เปนกลางนี้ถือเปนการกระทําเยี่ยงสงคราม เรามีสิทธิ์โดยชอบที่จะโจมตีเรือเยอรมันที่พบในทะเล\n\nเราควรพิจารณาเขารวมฝายของอเมริกาที่กําลังสูรบกับเยอรมันดวย ซึ่งจะทําใหพวกแยงกีติดหนี้บุญคุณเรา และแสดงใหโลกเห็นวาเม็กซิโกเปนผูเลนบนเวทีระหวางประเทศ"
 mexico.24.a: "แกจะไดรับผลกรรม [From.GetLeader]"
 mexico.24.b: "เราจะทําอะไรได?"
 mexico.25.title: "เม็กซิโกแสวงหาพันธมิตร"
 mexico.25.desc: "[From.GetLeader]ตองการเขารวมสงครามตอตานเยอรมนี หลังจากนโยบายสงครามเรือดํานํ้าไมจํากัดขอบเขตของเยอรมนีทําใหเรือ U-Boat จมเรือบรรทุกนํ้ามันของเม็กซิโกที่เปนกลางหลายลํานอกชายฝงเม็กซิโก"
 mexico.25.a: "มีสวนชวยแมเพียงเล็กนอยก็ยังดี"
 mexico.25.b: "เรายอมหาพันธมิตรที่ดีกวาชาวเม็กซิกันไดแน"
 mexico.26.title: "เม็กซิโกเขารวม[From.GetFactionName]"
 mexico.26.desc: "[From.GetLeader]ยินดีตอนรับขอเสนอสนับสนุนในสงครามตอตานเยอรมนีจากประธานาธิบดีเม็กซิโก เมื่อไมนานมานี้ฝูงหมาปาเยอรมันไดจมเรือบรรทุกนํ้ามัน 'โปเตรโร เดล ยาโน' และ 'ฟาฆา เด โอโร' ของเม็กซิโกที่เปนกลาง ซึ่งเปนการกระทําเยี่ยงสงครามที่ทําใหพลเรือนเสียชีวิต และรัฐบาลเม็กซิโกไดแถลงวาตองการเห็นการปฏิบัติการของเรือ U-Boat เยอรมันในทะเลแคริบเบียนยุติลงโดยเด็ดขาด\n\nรัฐบาลเม็กซิโกแสวงหาการยอมรับจากมหาอํานาจโลกมาระยะหนึ่งแลว และเชื่อวาการใหการสนับสนุนอเมริกาและ[From.GetFactionName]จะพิสูจนวาพวกเขาเปนผูเลนบนเวทีระหวางประเทศ"
 mexico.26.a: "เม็กซิโกมีสิทธิ์โดยชอบที่จะทําสงครามเพราะเรื่องนี้"
 mexico.26.b: "เม็กซิโกมีกองทัพดวยหรือ?"
 mexico.26.c: "การโจมตีการเดินเรือของประเทศที่เปนกลางเปนอาชญากรรมรายแรงตามกฎแหงสงคราม"
 mexico.27.title: "Firmissimam Constantiam"
 mexico.27.desc: "สมเด็จพระสันตะปาปาปอุสที่ 11 ทรงออกสมณสาสนวาดวยสถานการณในเม็กซิโก แมการจลาจลคริสติอาดาจะยุติลงที่โตะเจรจาและการนองเลือดอยางเปดเผยไดสิ้นสุดลงแลว แตศาสนจักรยังคงกังวลตอทิศทางที่เม็กซิโกกําลังมุงหนาไป\n\nสมณสาสนนี้เรียกรองใหผูมีสิทธิเลือกตั้งชาวเม็กซิกันเลือกผูสมัครที่ยึดมั่นในศาสนา และเรียกรองใหพรรคการเมืองทางศาสนาของเม็กซิโก เชน คาทอลิกแอคชัน แกไขปญหาสังคมอยางความยากจน เพื่อปองกันความรุนแรงจากการปฏิวัติที่อาจเกิดขึ้นอีก"
 mexico.27.a: "เปนเรื่องดีที่ความรุนแรงตอศาสนจักรไดยุติลงแลว"
 mexico.27.b: "โฆษณาชวนเชื่อแบบงมงาย สกัดการเผยแพรการทรยศนี้!"
 mexico.28.title: "การลุกฮือทางศาสนา"
 mexico.28.desc: "การโจมตีศาสนจักรผูทรยศของเราเห็นไดชัดวายังเขมขนไมพอ พวกทรยศไดใชเสรีภาพที่เรามอบใหวางแผนกอรัฐประหาร พวกงมงายโงเขลาเหลานี้หวนรําลึกถึงสงครามคริสเตโรอันไรผลที่เราเอาชนะไดอยางชอบธรรมเมื่อหลายปกอน ไดชูธงไมกางเขนขึ้นและรวมตัวอยูเบื้องหลังเหลานักบวชจอมโกหก และบัดนี้กําลังพยายามทําลายความกาวหนาสูความทันสมัยที่เราสรางมา"
 mexico.28.a: "เรานาจะกําจัดการทรยศนี้ใหสิ้นซากตั้งแตแรก!"
 mexico.29.title: "คริสติอาดาครั้งที่สอง"
 mexico.29.desc: "กองกําลังของศาสนจักรและการปฏิวัติปะทะกันอีกครั้งในเม็กซิโก เมื่อรัฐบาลรื้อฟนการโจมตีศาสนจักร พรรคคาทอลิกและขบวนการทางสังคมที่ถูกรุมเราจึงลุกขึ้นกอกบฏดวยอาวุธเพื่อยึดอํานาจควบคุมเม็กซิโก กองกําลังคริสเตโรกําลังรวมตัวกันใหมหลังจากสงบนิ่งมานับทศวรรษ โดยมีทหารที่แปรพักตรจากกองทัพสหพันธมาเสริมกําลัง พวกเขายึดรัฐในชนบทไดหลายรัฐและใชเปนฐานปฏิบัติการ\n\nคริสติอาดาครั้งแรกยุติลงดวยขอตกลงที่เจรจากันระหวางผูนําระดับสูงของฝายปฏิวัติและศาสนจักรโดยมีรัฐบาลอเมริกาเปนตัวกลาง แตดูเหมือนวาความรุนแรงครั้งนี้จะจบลงก็ตอเมื่อคูสงครามฝายใดฝายหนึ่งถูกทําลายจนสิ้นซากเทานั้น"
 mexico.29.a: "การสังหารพวกโงเขลาหูเบาที่มีนักบวชเลอะเลือนเปนผูนํานั้นงายดายนัก"
 mexico.29.b: "'จงทรงพระเจริญ พระคริสตราชา และพระนางมารียผูไดรับพรแหงกวาดาลูเป!'"
 mexico.29.c: "สถานการณในเม็กซิโกดูซับซอนเกินกวาคนนอกจะเขาใจได"
 mexico.30.title: "การลุกฮือของพวกไมมีศาสนา"
 mexico.30.desc1: "คนชั่วที่เราคิดวาไดปราบลงแลวไดรวมตัวกันเพื่อการตอสูครั้งสุดทายอันไรผลกับผูรับใชของพระเจา สมุนของซาตานอยางปลูตารโก กาเยส และบริวาร 'นักปฏิวัติ' จอมทรราชของเขากําลังหลั่งไหลออกมาจากรังแหงความชั่วราย พรอมปนไรเฟลและดาบปลายปนเพื่อแทงผูศรัทธา เราตองปราบปรามการโจมตีตอพระกายของพระคริสตนี้ มิฉะนั้นงานที่เราทําเพื่อรักษาและโหมไฟแหงความศรัทธาใหลุกโชนจะสิ้นสุดลง และความรูในบัญญัติของพระผูไถและพระราชาของเราที่สืบทอดมายี่สิบศตวรรษจะถูกลืมเลือน"
 mexico.30.desc2: "คนชั่วที่เราคิดวาไดปราบลงแลวไดรวมตัวกันเพื่อการตอสูครั้งสุดทายอันไรผลกับผูรับใชของพระเจา สมุนของซาตานอยางบิเซนเต โลมบารโด และบริวาร 'นักปฏิวัติ' จอมทรราชของเขากําลังหลั่งไหลออกมาจากรังแหงความชั่วราย พรอมปนไรเฟลและดาบปลายปนเพื่อแทงผูศรัทธา เราตองปราบปรามการโจมตีตอพระกายของพระคริสตนี้ มิฉะนั้นงานที่เราทําเพื่อรักษาและโหมไฟแหงความศรัทธาใหลุกโชนจะสิ้นสุดลง และความรูในบัญญัติของพระผูไถและพระราชาของเราที่สืบทอดมายี่สิบศตวรรษจะถูกลืมเลือน"
 mexico.30.a: "'นี่คือเวลาของพวกทาน และอํานาจแหงความมืด'"
 mexico.31.title: "การปฏิวัติเม็กซิโกครั้งที่สอง"
 mexico.31.desc: "กองกําลังของศาสนจักรและการปฏิวัติปะทะกันอีกครั้งในเม็กซิโก เมื่อพรรคคาทอลิกและขบวนการทางสังคมมีกําลังเขมแข็งขึ้น กองกําลังฝายฆราวาสนิยมจึงลุกขึ้นกอกบฏดวยอาวุธเพื่อยึดอํานาจรัฐบาลคืน 'กองพลนอยแดง' กําลังรวมตัวกันใหมหลังจากสงบนิ่งมานับทศวรรษ ขณะที่ทหารที่แปรพักตรจากกองทัพสหพันธกําลังรวมพลในรัฐที่ยังอยูใตการควบคุมของผูวาการฝายตอตานศาสนจักร\n\nคริสติอาดายุติลงดวยขอตกลงที่เจรจากันระหวางผูนําระดับสูงของฝายปฏิวัติและศาสนจักรโดยมีรัฐบาลอเมริกาเปนตัวกลาง แตดูเหมือนวาความรุนแรงครั้งนี้จะจบลงก็ตอเมื่อคูสงครามฝายใดฝายหนึ่งถูกทําลายจนสิ้นซากเทานั้น"
 mexico.31.a: "จงทรงพระเจริญ พระคริสตราชา และพระนางมารียผูไดรับพรแหงกวาดาลูเป!"
 mexico.31.b: "การสังหารพวกโงเขลาหูเบาที่มีนักบวชเลอะเลือนเปนผูนํานั้นงายดายนัก"
 mexico.31.c: "สถานการณในเม็กซิโกดูซับซอนเกินกวาคนนอกจะเขาใจได"
 mexico.32.title: "การจลาจล 'ซูตสูท'"
 mexico.32.desc: "เยาวชนเชื้อสายฮิสแปนิกที่สวมเสื้อผาหรูหราฉูดฉาด หรือ 'ซูตสูท' ตกเปนเปาของการจลาจลที่มีชนวนจากเชื้อชาติในเมืองชายแดนทางใต อันเปนผลมาจากการรายงานขาวแบบเราอารมณเกี่ยวกับการเสียชีวิตของวัยรุนคนหนึ่งในลอสแอนเจลิส เยาวชนเชื้อสายเม็กซิกัน-อเมริกันเกาคนถูกตัดสินวามีความผิดฐานฆาตกรรมจากเหตุการณนี้\n\nเจาหนาที่ขาวกรองไดรวบรวมรายงานที่ระบุวาแทจริงแลวพวกซูตสูทคือสายลับฟาสซิสต ที่รวมมือกับกลุมซินารกิสตาคาทอลิกสุดโตงในเม็กซิโกเพื่อชวยใหญี่ปุนและเยอรมนีบุกทวีปอเมริกา"
 mexico.32.a: "ฟงดูไมนาเปนไปไดเลย เราจายเงินใหเจาหนาที่พวกนี้ไปเทาไรกัน?"
 mexico.32.b: "จับกุมพวกซูตสูทอยูดี การจลาจลเปนภัยตอความพยายามในการทําสงครามของเรา"
 mexico.33.title: "การจลาจล 'ซูตสูท'"
 mexico.33.desc: "เยาวชนเชื้อสายฮิสแปนิกที่สวมเสื้อผาหรูหราฉูดฉาด หรือ 'ซูตสูท' ตกเปนเปาของการจลาจลที่มีชนวนจากเชื้อชาติในเมืองชายแดนทางเหนือของเรา อันเปนผลมาจากการรายงานขาวแบบเราอารมณเกี่ยวกับการเสียชีวิตของวัยรุนคนหนึ่งในลอสแอนเจลิส เยาวชนเชื้อสายเม็กซิกัน-อเมริกันเกาคนถูกตัดสินวามีความผิดฐานฆาตกรรมจากเหตุการณนี้\n\nเจาหนาที่ขาวกรองของอเมริกาไดรวบรวมรายงานที่ระบุวาแทจริงแลวพวกซูตสูทคือสายลับฟาสซิสต ที่รวมมือกับกลุมซินารกิสตาคาทอลิกสุดโตงในเม็กซิโกเพื่อชวยใหญี่ปุนและเยอรมนีบุกทวีปอเมริกา"
 mexico.33.a: "พวกซินารกิสตาเปนภัยตอทั้งอเมริกาและเม็กซิโก"
 mexico.33.b: "พวกเขายังเปนแคเด็ก! นี่คือความอยุติธรรม!"
 mexico.34.title: "การแลกเปลี่ยนทรัพยากรกับเม็กซิโก"
 mexico.34.desc: "[From.GetLeader]เสนอขอตกลงการคากับเยอรมนี หาก[Root.GetLeader]ยอมสงแบบรถถังเบาและรถถังกลางรุนลาสุดที่เราพัฒนาขึ้นใหแกเม็กซิโก นี่ดูเหมือนจะเปนกาวแรกของความสัมพันธที่ใกลชิดขึ้นระหวางเม็กซิโกกับเยอรมนี แมจะไมมีประโยชนทางการทหาร แตก็อาจเปนประโยชนตอเราในทางภูมิรัฐศาสตร แนนอนวาแบบรถถังลํ้าสมัยเหลานี้อาจตกไปอยูในมือของศัตรูในอนาคตได..."
 mexico.34.a: "ขอตกลงนี้จะเปนประโยชนทั้งตอเยอรมนีและเม็กซิโก"
 mexico.34.b: "แบบใด ๆ ที่เราสงไปคงไปตกอยูในมือชาวอเมริกันในที่สุด"
 mexico.35.title: "แบบรถถังของเยอรมนี"
 mexico.35.desc: "[From.GetLeader]ตกลงมอบใบอนุญาตแบบรถถังเบาและรถถังกลางรุนลาสุดของเยอรมนีใหแกเรา หวังวานี่จะเปนกาวแรกของความสัมพันธที่ใกลชิดขึ้นระหวางเม็กซิโกกับเยอรมนี และยังเปนความรูทางการทหารที่มีประโยชนอีกดวย"
 mexico.35.a: "ดีมาก"
 mexico.36.title: "เยอรมนีปฏิเสธขอเสนอ"
 mexico.36.desc: "[From.GetLeader]ปฏิเสธขอเสนอแลกเปลี่ยนทรัพยากรของเรา โดยอางถึงความเปนไปไดที่แบบรถถังขั้นสูงของเยอรมนีจะตกไปอยูในมือศัตรู เราคงตองพัฒนาแบบรถถังของเราเอง หรือจายเงินซื้อใบอนุญาตจากเยอรมัน..."
 mexico.36.a: "ใหตายสิ"
 mexico.40.title: "ปฏิบัติการจัสตคอสสําเร็จ"
 mexico.40.desc: "การจูโจมฐานทัพของพวกแยงกีในปานามาอยางไมทันตั้งตัวของเราประสบความสําเร็จ เราขับไลพวกจักรวรรดินิยมออกไปไดแลว และกําลังรอการตอบโตจากจักรวรรดิทางเหนือที่ผุพัง หากพวกเขาเลือกที่จะพุงเขาใสแนวปองกันของเรา เราจะทําใหพวกเขาตองชดใช"
 mexico.40.a: "อเมริกากลางจะปลอดภัยจากการรุกรานของอเมริกา"
 mexico.41.title: "[From.GetAdjective]ยึดคลองปานามา"
 mexico.41.desc: "จอมเผด็จการแหงเม็กซิโก [From.GetLeader] บังอาจเปดฉากโจมตีครั้งใหญตอกองกําลังคลองปานามาของเราจากพื้นที่รวมพลใกลเคียง 'ปฏิบัติการจัสตคอส' ของพวกเขาประสบความสําเร็จ และทหารของเรากําลังถอยรนอยางสับสน ชาวเม็กซิกันไมไดรุกขามเขามาในแผนดินใหญของสหรัฐอเมริกา นี่จึงไมใชการโหมโรงของการรุกรานเต็มรูปแบบ แตการโจมตีครั้งนี้ไดบั่นทอนขีดความสามารถในการแผอํานาจไปทั่วโลกของเรา และทําใหเราอับอายบนเวทีระหวางประเทศ"
 mexico.41.a: "นาเสียดายที่เรามีเรื่องเรงดวนกวานี้ การควํ่าบาตรนาจะเพียงพอแลว"
 mexico.41.b: "อธิปไตยของเราถูกคุกคาม เรื่องนี้ตองตอบโตดวยกําลังทหาร"
 mexico.42.title: "ปฏิบัติการจัสตคอสลมเหลว"
 mexico.42.desc: "การจูโจมฐานทัพของพวกแยงกีในปานามาอยางไมทันตั้งตัวของเราผิดพลาด บางทีเราอาจสงทหารไปไมมากพอ หรือผูบัญชาการอาจไรความสามารถ ไมวาจะดวยเหตุใด เราถูกพวกจักรวรรดินิยมขับไลออกมา และกําลังรอการตอบโตจากจักรวรรดิทางเหนือที่ผุพัง หากพวกเขาเลือกที่จะพุงเขาใสแนวปองกันของเรา เราจะทําใหพวกเขาตองชดใช"
 mexico.42.a: "อเมริกากลางยังคงถูกคุกคามจากการรุกรานของอเมริกา"
 mexico.43.title: "[From.GetAdjective]โจมตีคลองปานามา"
 mexico.43.desc: "จอมเผด็จการแหงเม็กซิโก [From.GetLeader] บังอาจเปดฉากโจมตีครั้งใหญตอกองกําลังคลองปานามาของเราจากพื้นที่รวมพลใกลเคียง โชคดีที่ทหารผูกลาหาญของเราสามารถตานทาน 'ปฏิบัติการจัสตคอส' และตีผูรุกรานใหถอยกลับไปได ชาวเม็กซิกันไมไดรุกขามเขามาในแผนดินใหญของสหรัฐอเมริกา นี่จึงไมใชการโหมโรงของการรุกรานเต็มรูปแบบ แตการโจมตีครั้งนี้ไดแสดงใหเห็นวาเราไมใชเจาแหงทวีปอเมริกาอีกตอไป และทําใหเราอับอายบนเวทีระหวางประเทศ"
 mexico.43.a: "นาเสียดายที่เรามีเรื่องเรงดวนกวานี้ การควํ่าบาตรนาจะเพียงพอแลว"
 mexico.43.b: "อธิปไตยของเราถูกคุกคาม เรื่องนี้ตองตอบโตดวยกําลังทหาร"
 mexico.44.title: "เม็กซิโกยึดคลองปานามา"
 mexico.44.desc1: "หลังจาก[From.GetAdjective]บุกรุกฐานทัพอเมริกันที่คลองปานามา ทหารทั้งสองฝงชายแดนตางระดมพลเพื่อทําสงคราม แมชาวเม็กซิกันจะลงมือกอนและยึดเขตคลองที่มีความสําคัญทางยุทธศาสตรไวได แตดูเหมือนวาฝายอเมริกาจะเปนฝายที่เตรียมเปดฉากรุกเพื่อลงโทษเพื่อนบานผูอวดดี 'หนังสือพิมพชั้นตํ่า' ตางประณาม[From.GetRulingPartyLong]วาเปนแกงโจรที่ไมเคารพกฎหมายระหวางประเทศ และเรียกรองใหเปลี่ยนแปลงระบอบการปกครอง\n\nหากสงครามเม็กซิโก-อเมริกาครั้งที่สองปะทุขึ้น การสูรบจะเกิดขึ้นในภูมิประเทศอันโหดรายของเทือกเขาและทะเลทราย และจะสูญเสียชีวิตมากกวาการปะทะเล็ก ๆ ในป 1847 กอนการยกดินแดนของเม็กซิโกอยางมาก"
 mexico.44.desc2: "รายงานวาทหาร[From.GetAdjective]เขาสูฐานทัพอเมริกันที่คลองปานามาไดรับการยืนยันจาก[From.GetLeader] ซึ่งอางวาเปนการปกปองผลประโยชนของ[From.GetAdjective]ในอเมริกากลางหลังเกิดความปนปวนภายในสหรัฐอเมริกา กระทรวงโฆษณาชวนเชื่อของ[From.GetRulingPartyLong]ไดเรียกรองใหทหารอเมริกันที่เหลืออยูในพื้นที่ทั้งหมดวางอาวุธและเคารพ 'การสงมอบอํานาจอยางสันติ' ในเขตคลอง ประธานาธิบดีอเมริกาถูก 'หนังสือพิมพชั้นตํ่า' วิจารณอยางหนักที่ไมสูใหเต็มที่เพื่อรักษาผลประโยชนของชาติในพื้นที่ และไมตอบโตการโจมตีของ[From.GetAdjective]ดวยการระดมพลทั่วไปตอ[From.GetNameDef]"
 mexico.44.a: "มาเอาไปสิ!"
 mexico.44.b: "การโจมตีอธิปไตยของอเมริกาอยางอุกอาจ"
 mexico.44.c: "เจาตัวเล็กใจกลา... เม็กซิโกเนี่ยนะ?"
 mexico.45.title: "การปะทะตามแนวชายแดน[MEX.GetAdjective]-อเมริกา"
 mexico.45.desc1: "ทหารอเมริกันตามแนวชายแดนทางใตถูกสั่งใหอยูในภาวะเตรียมพรอมสูงสุด เนื่องจากการรุกรานฐานทัพอเมริกันที่คลองปานามาของ[From.GetAdjective]เมื่อเร็ว ๆ นี้ทําใหมีความเปนไปไดที่จะเกิดสงครามขนาดใหญระหวางสองเพื่อนบาน แมการโจมตีแบบไมทันตั้งตัวของ[From.GetLeader]จะลมเหลว แตมีรายงานวาประธานาธิบดีอเมริกาไดตัดสินใจลงโทษเพื่อนบานทางใตผูอวดดี 'หนังสือพิมพชั้นตํ่า' ตางประณาม[From.GetRulingPartyLong]วาเปนแกงโจรที่ไมเคารพกฎหมายระหวางประเทศ และเรียกรองใหเปลี่ยนแปลงระบอบการปกครอง\n\nหากสงครามเม็กซิโก-อเมริกาครั้งที่สองปะทุขึ้น การสูรบจะเกิดขึ้นในภูมิประเทศอันโหดรายของเทือกเขาและทะเลทราย และจะสูญเสียชีวิตมากกวาการปะทะเล็ก ๆ ในป 1847 กอนการยกดินแดนของเม็กซิโกอยางมาก"
 mexico.45.desc2: "ทหารอเมริกันตามแนวชายแดนทางใตถูกสั่งใหอยูในภาวะเตรียมพรอมสูงสุด เนื่องจากการรุกรานฐานทัพอเมริกันที่คลองปานามาของ[From.GetAdjective]เมื่อเร็ว ๆ นี้สรางความประหลาดใจใหผูสังเกตการณสวนใหญ แมผูเชี่ยวชาญดานละตินอเมริกาบางคนจะเตือนมาตลอดวาการโจมตีรัฐในอเมริกากลางของ[From.GetAdjective]จะจบลงดวยการปะทะกับอเมริกาเพราะผลประโยชนที่ขัดแยงกันในภูมิภาค [USA.GetLeader]ไดควํ่าบาตรเม็กซิโกหลังการยึดคลอง แตนอกเหนือจากนั้นก็งดเวนการปฏิบัติการทางทหาร แนวทางเชนนี้อาจชวยใหรัฐบาล[From.GetRulingPartyLong]ผูกาวราวยอมคืนดี หรืออาจกระตุนใหพวกเขาลงมือมากขึ้นก็เปนได"
 mexico.45.a: "มาเอาไปสิ!"
 mexico.45.b: "การโจมตีอธิปไตยของอเมริกาอยางอุกอาจ"
 mexico.45.c: "เม็กซิโกเสี่ยงไมนอยกับการเดิมพันครั้งนั้น"
 mexico.46.title: "[From.GetFactionName]"
 mexico.46.desc: "ประธานาธิบดี[From.GetLeader]แหง[From.GetRulingPartyLong]ของเม็กซิโก ไดประกาศกอตั้งกลุมประเทศใหมในซีกโลกตะวันตก [From.GetFactionName]ประกาศวาทั้งการปลุกปนของฝายซายและการแทรกแซงจากตางชาติจะถูกปราบลงดวยการสรางพันธมิตรแหงการทวงคืนดินแดนของเหลาผูนําเผด็จการ ซึ่งจะจัดระเบียบภูมิภาคใหมเพื่อสรางดุลอํานาจที่แข็งแกรงถวงฝายอื่น ๆ"
 mexico.47.title: "[From.GetFactionName]"
 mexico.47.desc: "ประธานาธิบดี[From.GetLeader]แหง[From.GetRulingPartyLong]ของเม็กซิโก ไดประกาศกอตั้งกลุมประเทศใหมในซีกโลกตะวันตก [From.GetFactionName]ตั้งชื่อตามซีมอน โบลีวาร นักตอสูเพื่อเอกราชผูชวยใหหลายชาติในละตินอเมริกาที่กําลังรวมตัวกันเปนพันธมิตรในขณะนี้ไดรับอิสรภาพ เปาหมายที่ประกาศไวคือการยุติการครอบงําทวีปโดยจักรวรรดิเกาของยุโรปและอเมริกา ดวยการสรางรัฐสังคมนิยมที่เขมแข็งซึ่งเชื่อมโยงกันทั้งทางเศรษฐกิจและการทูต"
 mexico.46.a: "ดวยพันธมิตรผูภักดี มาตุภูมิจะไมมีวันพายแพ!"
 mexico.46.b: "จํานวนเพียงอยางเดียวชวยพวกโงจอมเสแสรงเหลานี้ไมไดหรอก"
 mexico.46.c: "นี่คือการโหมโรงของการสูรบที่มากขึ้นอีกหรือไม?"
 mexico.50.title: "การขนสงอาวุธจากเม็กซิโก"
 mexico.50.desc: "ญาติทางอุดมการณของเราใน[From.GetRulingPartyLong]ไดประกาศสนับสนุนเปาหมายของเรา และสงปนไรเฟลมาใหเราชุดหนึ่งเพื่อชวยในการตอสูกับศัตรูที่เราเกลียดชัง"
 mexico.50.a: "[From.GetLeader]เปนมิตรแทของชาวสเปน"
 mexico.51.title: "การขนสงอาวุธสูญหาย"
 mexico.51.desc: "นานนํ้ารอบชายฝงสเปนมีเรือของทั้งฝายรัฐบาลและฝายกบฏสเปนลาดตระเวนอยู รวมทั้งเรือลาดตระเวนของอิตาลี เรือดํานํ้าของรัสเซีย และแมแตเรือของสันนิบาตชาติที่ถูกสงมาบังคับใชมาตรการหามสงอาวุธ เพื่อปองกันไมใหสงครามกลางเมืองลุกลามไปทั่วยุโรป จึงไมนาแปลกใจที่การขนสงอาวุธครั้งลาสุดของเราถูกสกัดและสูญหายไป"
 mexico.51.a: "เสียของจริง ๆ"
 mexico.52.title: "[MEX.GetLeader]ประกาศรวมขบวนการคอมมิวนิสตทั้งมวล"
 mexico.52.desc_not_trotsky: "ในการประชุมใหญของ[MEX.GetFactionName] [MEX.GetLeader]ไดประกาศความเปนเลิศของการตีความลัทธิมารกซ เอ็งเงิลส และเลนินตามแนวทรอตสกี เหนือการตีความการปฏิวัติที่ผิดพลาดอยางลัทธิสตาลิน เมื่อองคการสากลที่ 3 (หรือที่รูจักกันในชื่อโคมินเทิรน) ลมสลาย ผูนําคอมมิวนิสตทั่วโลกจึงไดรับเชิญใหวิจารณตนเอง หลังจากสารภาพถึงความมืดบอดทางการเมืองตอจิตวิญญาณแหงการปฏิวัติที่แทจริง พวกเขาจะไดรับเชิญเขาสูองคการสากลที่ 4 และชวยนํามาซึ่งการปฏิวัติสังคมนิยมโลก"
 mexico.52.desc_trotsky: "ในการประชุมใหญของ[MEX.GetFactionName] [MEX.GetLeader]ไดประกาศความเปนเลิศของการตีความลัทธิมารกซ เอ็งเงิลส และเลนินตามแนวทางของเขา เหนือการตีความทฤษฎีการปฏิวัติที่ผิดพลาดอยางลัทธิสตาลิน เมื่อองคการสากลที่ 3 (หรือที่รูจักกันในชื่อโคมินเทิรน) ลมสลาย ผูนําคอมมิวนิสตทั้งหมดจึงไดรับเชิญใหวิจารณตนเอง หลังจากสารภาพถึงความมืดบอดทางการเมืองตอจิตวิญญาณแหงการปฏิวัติที่แทจริง พวกเขาจะไดรับเชิญเขาสูองคการสากลที่ 4 และชวยนํามาซึ่งการปฏิวัติสังคมนิยมโลก"
 mexico.52.a: "ในที่สุดเราก็มองเห็นความผิดพลาดของตนเอง"
 mexico.52.b: "การตีความวิสัยทัศนของมารกซของเราคือแนวทางเดียวที่ชอบธรรม"
 mexico.53.title: "[MEX.GetLeader]ประกาศรวมขบวนการคอมมิวนิสตทั้งมวล"
 mexico.53.desc: "เราเชื่อมานานวาผูนําของเราเผยแพรการตีความลัทธิมารกซ เอ็งเงิลส และเลนินที่แทจริง แตบัดนี้พวกเขาถูกบังคับให 'วิจารณตนเอง' และสารภาพตอสาธารณะวาการตีความเลนินตามแนวทรอตสกีคือเสนทางเดียวที่ถูกตองสูชัยชนะของสังคมนิยม ผลที่ตามมาคือเราพบวาตนเองโดดเดี่ยวในทันที พันธมิตรของเราลมสลาย และเรากําลังเผชิญกับทางสองแพรงอันยากยิ่ง: ยอมรับความถูกตองของแนวคิดทรอตสกี หรือตองโดดเดี่ยวและขัดแยงกับ[MEX.GetFactionName]"
 mexico.53.a: "ในที่สุดเราก็มองเห็นความผิดพลาดของตนเอง"
 mexico.53.b: "การตีความวิสัยทัศนของมารกซของเราคือแนวทางเดียวที่ชอบธรรม"
 mexico.54.title: "[MEX.GetLeader]เรียกรองใหเราถอนตัวจากแคริบเบียน"
 mexico.54.desc: "ในสุนทรพจนอันเรารอนที่ยาวกวา 4 ชั่วโมง [MEX.GetLeader]เรียกรองใหเราละทิ้งอาณานิคมทั้งหมดในภูมิภาคแคริบเบียน เพราะตามที่เขากลาว อาณานิคมเหลานี้คือ "หลักฐานที่เห็นไดชัดที่สุดของการกดขี่แบบจักรวรรดินิยมของเราเหนือภูมิภาคนี้" ขณะที่บางคนแยงวาเราไมอาจทําใหเม็กซิโกโกรธเคืองไดในตอนนี้ ที่ปรึกษาที่แนวแนกวากลับเนนยํ้าวาเราสามารถตานทานพวกเขาไดอยางแนนอน และบูรณภาพแหงดินแดนของเราไมควรถูกทําใหตกอยูในอันตรายเด็ดขาด"
 mexico.54.a: "ยอมตามขอเรียกรองของเขา"
 mexico.54.b: "เราไมเจรจากับพวกนักปฏิวัติ!"
 mexico.55.title: "[From.GetNameDef]ถอยออกจากแคริบเบียนแลว!"
 mexico.55.desc: "เมื่อตองเผชิญหนากับความขัดแยงในตัวเองแบบจักรวรรดินิยม รัฐบาล[From.GetAdjective]ไดปลดปลอยดินแดนในครอบครองในแคริบเบียน วันนี้เปนวันยิ่งใหญของเหลากรรมกร แตการตอสูยังอีกยาวไกล กระบวนการนี้ยังไมไดนํามาซึ่งอิสรภาพโดยสมบูรณของกรรมกร เพราะพวกเขายังอยูภายใตสถาบันที่กดขี่"
 mexico.55.a: "การตอสูเพื่ออิสรภาพของชนชั้นกรรมาชีพทั่วโลกยังคงดําเนินตอไป"
 mexico.56.title: "[From.GetNameDef]ปฏิเสธขอเรียกรองของเรา"
 mexico.56.desc: "ดวยคําตอบอันโอหังตามแบบฉบับของผูกดขี่จักรวรรดินิยม [From.GetNameDef]ปฏิเสธขอเรียกรองของเราที่ใหปลอยมือจากการยึดครองแคริบเบียนอยางละโมบ! บัดนี้ชนชั้นกรรมาชีพของพวกเขาตองเผชิญหนากับความขัดแยงของรัฐบาลตน และตระหนักวาพวกเขากําลังทํางานรับใชทรราช"
 mexico.56.a: "พวกเขาจะตองรับความพิโรธของชนชั้นกรรมาชีพติดอาวุธ!"
 mtg_usa_civil_war_fascists.1.t: "การประทวงของซิลเวอรลีเจียน"
 mtg_usa_civil_war_fascists.1.desc: "องคกรสายกลางและฝายขวาจํานวนหนึ่ง ซึ่งนําและจัดตั้งโดยซิลเวอรลีเจียนแหงอเมริกา ไดเดินขบวนผานเมืองหลวงในวันนี้ นับเปนการชุมนุมครั้งใหญที่สุดครั้งหนึ่งที่วอชิงตันเคยพบมา มีรายงานการชุมนุมอื่น ๆ ทั่วประเทศ\n\nการเดินขบวนสิ้นสุดลงหนาอาคารรัฐสภา ซึ่งฝูงชนเรียกรองใหสงตัว "พวกคอมมิวนิสตในสภาคองเกรส" มาใหพวกเขาเพื่อขึ้นศาลตอหนา "คณะลูกขุนใหญของประชาชน" ในขอหากบฏตอสหรัฐอเมริกา\n\nเปนการสวนตัว สมาชิกบางคนในรัฐบาลเห็นดวยกับขอกังวลที่ชอบธรรมกวาของผูประทวงบางขอ เกี่ยวกับหลักนิติธรรมและการยึดถือระบบถวงดุลตามรัฐธรรมนูญ แตบางคนกลับเสนอใหใชมาตรการแข็งกราวกับพวกเขา ดวยการชุมนุมที่วางแผนไวอีกในสัปดาหตอ ๆ ไป เราตองตัดสินใจโดยเร็ว"
 mtg_usa_civil_war_fascists.1.a: "เราตองหลีกเลี่ยงการทําใหสถานการณบานปลาย"
 mtg_usa_civil_war_fascists.1.b: "เราตองไมกมหัวใหม็อบ"
 mtg_usa_civil_war_fascists.2.t: "การประทวงบานปลายเปนความรุนแรง"
 mtg_usa_civil_war_fascists.2.desc: "ความตึงเครียดปะทุขึ้นในการประทวงอีกครั้งที่เมืองหลวงวันนี้ ขณะที่การชุมนุมใหญอีกครั้งถูกเรียกโดยกลุมตาง ๆ ซึ่งรวมถึงซิลเวอรลีเจียนแหงอเมริกา ผูประทวงยํ้าขอเรียกรองเดิมใหจับกุมสมาชิกสภาคองเกรสจํานวนหนึ่งและสงตัวใหพวกเขา พรอมยื่นคําขาดหนึ่งชั่วโมงกอนจะบุกอาคารรัฐสภาและนําตัวผูมีรายชื่อออกมาดวยกําลัง \n\nเมื่อครบกําหนดคําขาดโดยไมมีการตอบสนอง หนวยเล็ก ๆ ของสมาชิกซิลเวอรลีเจียนก็พุงเขาใสแนวตํารวจรัฐสภา เกิดการตะลุมบอนนองเลือดที่ลุกลามไปยังผูประทวงคนอื่นอยางรวดเร็ว เมื่อตํารวจติดพันอยู กลุมอื่น ๆ จึงเขาไปในอาคารได พวกเขาไลคนทีละหองและพบเหยื่อที่หมายตาไวหลายคน แตถูกตํารวจติดอาวุธขวางไมใหออกไป ในการยิงตอสูที่ตามมา ผูบุกรุกหลายคนถูกสังหาร ขณะที่สมาชิกสภาคองเกรสสองคนไดรับบาดเจ็บ\n\nบรรยากาศอันเลวรายปกคลุมเมืองหลวง โดยทั้งสองฝายตางกลาวโทษอีกฝายวาเปนตนเหตุใหสถานการณบานปลาย อีกไมกี่สัปดาหขางหนาจะแสดงใหเห็นวาเหตุการณที่บัดนี้เรียกกันวายุทธการแคปทอลฮิลล คือจุดจบของการประทวง หรือเปนเพียงการโหมโรงของความขัดแยงที่ใหญกวาเดิม"
 mtg_usa_civil_war_fascists.2.a: "เลือดไดหลั่งแลว เราตองคาดวาจะมีเลือดหลั่งอีกกอนที่เรื่องนี้จะจบ"
 mtg_usa_civil_war_fascists.10.t: "คลังอาวุธถูกบุกปลน"
 mtg_usa_civil_war_fascists.10.desc: "คลังอาวุธของกองทัพบกสหรัฐฯ ใน[GetCSAState]ถูกโจมตีและยึดไวไดชั่วครูเมื่อวานนี้ หนวยยามกลุมเล็ก ๆ ตองเผชิญหนากับม็อบติดอาวุธขนาดใหญที่เรียกรองกุญแจหองเก็บอาวุธ เมื่อกําลังเสริมจากกองรักษาการณใกลเคียงมาถึง ผูโจมตีก็ถอยไปแลว พรอมขนอาวุธเล็กไปเปนจํานวนมาก\n\nเมื่อพิจารณาวายามไมไดรับบาดเจ็บเลยแมแตนอย และกําลังเสริมใชเวลานานจนนาสงสัยกวาจะมาถึง บางคนในรัฐบาลจึงคาดวานี่เปนการโจมตีที่มีการประสานงานกัน"
 mtg_usa_civil_war_fascists.10.a: "ขาวที่นากังวลอยางยิ่ง"
 mtg_usa_civil_war_fascists.11.t: "รัฐแทรกแซงการจัดเก็บภาษี"
 mtg_usa_civil_war_fascists.11.desc: "รัฐบาลของ[GetCSAState]ไดสงตํารวจรัฐไปปดการดําเนินงานจัดเก็บและประเมินภาษีทั้งหมดในรัฐ ยิ่งไปกวานั้น ผูวาการรัฐไดประกาศใหภาษีและอากรทุกประเภทที่เรียกเก็บจากยาสูบและสุราเปนโมฆะ และสั่งไมใหภาคธุรกิจจายภาษีศุลกากรหรืออากรใด ๆ ใหแกกระทรวงการคลัง \n\n อยางไรก็ตาม เขายังสั่งใหภาคธุรกิจและบุคคลทั่วไปยื่นภาษีตอหนวยงานภาษีของรัฐตอไป รวมถึงภาษีที่ตามปกติตองชําระใหกระทรวงการคลังดวย"
 mtg_usa_civil_war_fascists.11.a: "ละโมบ"
 mtg_usa_civil_war_fascists.12.t: "นายพล[From.GetName]ลาออก"
 mtg_usa_civil_war_fascists.12.desc: "นายพล[From.GetName]ไดยื่นใบลาออกโดยอางปญหาสุขภาพ อยางไรก็ตาม เปนความลับที่ใคร ๆ ก็รูวาเขาไดแสดงความกังวลอยางลึกซึ้งเปนการสวนตัวเกี่ยวกับทิศทางการเมืองของประเทศ ถึงขั้นกลาวอางวาสงครามกลางเมืองอเมริกาครั้งใหมใกลจะมาถึงแลว\n\nแทนที่จะไตรตรองวาตนเองจะภักดีตอฝายใด ดูเหมือนเขาจะตัดสินใจไมจับอาวุธสูกับเพื่อนรวมชาติเลย"
 mtg_usa_civil_war_fascists.12.a: "เราจะคิดถึงเขา"
 mtg_usa_civil_war_fascists.13.t: "ผูวาการรัฐระดมกองกําลังปองกันชาติ"
 mtg_usa_civil_war_fascists.13.desc: "ผูวาการรัฐ[usa_ng_mobilized.GetName]ประกาศวาไดระดมกองกําลังปองกันชาติของรัฐเพื่อสิ่งที่เขาเรียกวา "การฝกและการซอมรบระยะยาว" กระทรวงกลาโหมอางวาไมทราบถึงการซอมรบใด ๆ ที่วางแผนไวใน[usa_ng_mobilized.GetName] \n\n ดูเหมือนวาหนวยกองกําลังปองกันชาติยังขนเสบียงและกระสุนจริงไปครบตามอัตราเมื่อเคลื่อนพลออกไป ทําใหเกิดคําถามวาพวกเขากําลังเตรียมการเพื่ออะไรกันแน"
 mtg_usa_civil_war_fascists.13.a: "นากังวลใจยิ่งนัก"
 mtg_usa_civil_war_fascists.14.t: "ทหารหนีทัพ"
 mtg_usa_civil_war_fascists.14.desc: "มีรายงานที่นาตกใจจากหลายหนวยวาทหารไมกลับมาหลังลาพัก หรือหนีออกจากที่มั่นไปเฉย ๆ ที่นาตกใจยิ่งกวาคือทหารเหลานี้จํานวนมากมาจากพื้นที่ทางภูมิศาสตรเดียวกัน และหลายคนไดรับจดหมายจากบานเพียงไมกี่วันกอนที่จะหายตัวไป\n\nดูเหมือนวากําลังมีความพยายามอยางเปนระบบที่จะเรียกทหารจากรัฐทางใตใหกลับบาน"
 mtg_usa_civil_war_fascists.14.a: "ชางไมจงรักภักดีเสียจริง"
 mtg_usa_civil_war_fascists.15.t: "นักอุตสาหกรรมยายโรงงานอาวุธ"
 mtg_usa_civil_war_fascists.15.desc: "เจาของบริษัทอาวุธรายใหญรายหนึ่งประกาศวันนี้วาจะยายการผลิตไปยังสถานที่ที่เหมาะสมกวา โดยอางวาบรรยากาศทางการเมืองไมเอื้อตอธุรกิจ เขาระบุโดยเฉพาะถึงกิจกรรมของสหภาพแรงงานที่เพิ่มขึ้น ซึ่งเขาอางวาทําใหการผลิตลดลงและบั่นทอนความเชื่อมั่นของนักลงทุน บริษัทจะสรางโรงงานแหงใหมในสถานที่ที่ไมเปดเผยในรัฐทางใตแทน"
 mtg_usa_civil_war_fascists.15.a: "ไมนาจะสําคัญมากนัก"
 mtg_usa_civil_war_fascists.16.t: "นักอุตสาหกรรมยายโรงงานพลเรือน"
 mtg_usa_civil_war_fascists.16.desc: "ตามรายงานลับจากกระทรวงพาณิชย นักอุตสาหกรรมในภาคเหนือของสหรัฐฯ จํานวนมากขึ้นเรื่อย ๆ ไดวางแผนยายการผลิตไปยังรัฐอื่น หลังสหภาพแรงงานเรียกนัดหยุดงานหลายครั้งเพื่อเรียกรองคาจางที่สูงขึ้นและชั่วโมงทํางานที่สั้นลง บรรยากาศแหงความกังวลอยางหนักไดปกคลุมวงการธุรกิจ โดยหลายคนใหเหตุผลวาการทํากําไรอยางสมเหตุสมผลกําลังยากขึ้นเรื่อย ๆ ในรัฐที่ไมยอมลงมือปราบปรามผูนัดหยุดงานเหลานี้"
 mtg_usa_civil_war_fascists.16.a: "จุดยืนที่ไรสาระและไมสมเปนอเมริกัน"
 mtg_usa_civil_war_fascists.20.t: "แยกตัว!"
 mtg_usa_civil_war_fascists.20.desc: "เวลา 8:00 น. ของวันนี้ ทูตพิเศษจาก[CSAcapital.GetName]เดินทางมาถึงทําเนียบขาวเพื่อยื่นหนังสือจากสภานิติบัญญัติของรัฐแกประธานาธิบดี[USA.GetLeader] ประกาศวา[CSAcapital.GetName]จะไมถือวาตนเปนสวนหนึ่งของสาธารณรัฐอีกตอไป หนังสือดังกลาวอางวานี่เปนสิทธิขั้นพื้นฐานของประชาชนผูมีอารยะทุกกลุม พรอมยกขอความจากคําประกาศอิสรภาพมาอยางยืดยาว และยังระบุอยางหนักแนนวาการแยกตัวอยางสันติเปนประโยชนตอทุกฝาย และรัฐใหมไมปรารถนาสิ่งใดมากไปกวาการดําเนินกิจการของตนเองในฐานะเพื่อนบานที่ดีของ[USA.GetNameDef]"
 mtg_usa_civil_war_fascists.20.a: "เรียกมันใหถูก: การกบฏ"
 mtg_usa_civil_war_fascists.21.t: "บานที่แตกแยก"
 mtg_usa_civil_war_fascists.21.desc: "เพียงไมกี่ชั่วโมงหลังจากรัฐแรกตัดความสัมพันธกับ[USA.GetNameDef] รัฐอื่น ๆ ก็ทําตามดวยคําประกาศที่แทบจะเหมือนกันทุกถอยคํา ความหวังที่จะแยกทางกันอยางสันติดับวูบลงอยางรวดเร็ว เมื่อการชุมนุมหลายครั้งในรัฐเหลานั้นที่สนับสนุนใหยังคงเปนสวนหนึ่งของ[USA.GetNameDef]กลายเปนการนองเลือด และเจาหนาที่รัฐบาลกลางจํานวนหนึ่งถูกทําราย ในบางกรณี ผูสนับสนุนประธานาธิบดี[USA.GetLeader] หรือแมแตผูที่ถูกกลาวหาวากระตือรือรนตอการเปนเอกราชไมมากพอ ถูกฝูงชนรุมประชาทัณฑจนเสียชีวิต ประธานาธิบดีชั่วคราว[CSA.GetLeader]เรียกเหตุการณเหลานี้วา "การตอบโตของพลเมืองตอการใชอํานาจเกินขอบเขตของรัฐบาล ซึ่งนาเสียใจแตก็เขาใจได" และสัญญาวาจะมอบการอภัยโทษจากประธานาธิบดีใหแกผูกระทําผิดหากพวกเขามอบตัว\n\n เขายังเรียกรองใหถอนทหารของรัฐบาลกลางทั้งหมดออกจากดินแดนของรัฐใหม และใหมีเขตปลอดทหารตามแนวชายแดนเพื่อหลีกเลี่ยง "ความเขาใจผิดเพิ่มเติม" ประธานาธิบดี[USA.GetLeader]ปฏิเสธที่จะพิจารณาขอเสนอนี้แมแตนอย และสั่งใหกองทัพฟนฟูความสงบเรียบรอยในรัฐที่กอกบฏ"
 mtg_usa_civil_war_fascists.21.a: "เราเคยเจอเรื่องแบบนี้มากอนแลว ใชไหม?"
 mtg_usa_civil_war_fascists.22.t: "กลุมรัฐเปนกลางกอตัวขึ้น"
 mtg_usa_civil_war_fascists.22.desc: "หลังการสูรบปะทุขึ้นระหวาง[USA.GetNameDef]และ[CSA.GetNameDef] สภานิติบัญญัติของรัฐจํานวนหนึ่งไดผานญัตติไมแทรกแซง กฎหมายเหลานี้สั่งใหผูวาการรัฐรักษาบูรณภาพแหงดินแดนของรัฐ และปองกันไมใหกองกําลังรบของฝายใดเขามา ยิ่งไปกวานั้นยังหามการเกณฑทหารทุกรูปแบบของทั้งสองฝาย แตที่สําคัญคือไมไดจํากัดการขายอาวุธและกระสุนใหแกฝายใดในความขัดแยง ตราบใดที่ชําระเงินลวงหนา \n\nญัตติเหลานี้ยังยํ้าวารัฐตาง ๆ ถือวาตนเปนสวนหนึ่งของ[USA.GetNameDef] และไมตองการจัดตั้งรัฐบาลถาวรของตนเอง"
 mtg_usa_civil_war_fascists.22.a: "พวกเขาขี้ขลาดแนนอน แตอยางนอยก็ไมใชศัตรู"
 mtg_usa_civil_war_fascists.22.b: "พวกเขาไดเลือกขางแลว"
 mtg_usa_civil_war_fascists.23.t: "กลุมรัฐเปนกลางสลายตัว"
 mtg_usa_civil_war_fascists.23.desc: "เมื่อสงครามสิ้นสุดลง รัฐในกลุมรัฐเปนกลางไดประกาศยกเลิกกฎหมายและมาตรการตาง ๆ ที่ใชรักษาความเปนกลาง นับจากวันนี้ไป กองกําลังรบสามารถเขาสูดินแดนของพวกเขาไดอยางเสรีอีกครั้ง กองกําลังอาสาที่ตั้งขึ้นระหวางสงครามไดสลายตัวไปอยางสงบ"
 mtg_usa_civil_war_fascists.23.a: "ทายที่สุดพวกเขาก็ไมคุมกับเลือดที่ตองเสียไป"
 mtg_usa_civil_war_fascists.201.t: "อาสาสมัครจาก[CSA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.201.desc: "ขณะที่กองกําลังของเรารุกคืบเขาสู[CSA_liberated_state.GetName] เราไดพบพลเมืองจํานวนมากที่เห็นอกเห็นใจและแอบสนับสนุนเรามานาน ดวยความฮึกเหิมแหงความรักชาติ พวกเขาจึงขอเขารวมกองทัพของเรา"
 mtg_usa_civil_war_fascists.201.a: "จัดพวกเขาเปนหนวยแยกตางหาก"
 mtg_usa_civil_war_fascists.201.b: "ผนวกพวกเขาเขาสูกองทัพบก"
 mtg_usa_civil_war_fascists.202.t: "อาสาสมัครจาก[USA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.202.desc: "ขณะที่กองกําลังของเรารุกคืบเขาสู[USA_liberated_state.GetName] เราไดพบพลเมืองจํานวนมากที่เห็นอกเห็นใจและแอบสนับสนุนเรามานาน ดวยความฮึกเหิมแหงความรักชาติ พวกเขาจึงขอเขารวมกองทัพของเรา"
 mtg_usa_civil_war_fascists.203.t: "ฝายกบฏตั้งรัฐบาลรวมมือใน[USA_state_government_created.GetName]"
 mtg_usa_civil_war_fascists.203.desc: "กลุมที่เรียกตนเองวาสภาพลเมือง[USA_state_government_created.GetName] ประกาศวาไดรับชวงการบริหาร[USA_state_government_created.GetName]ตอจากฝายทหาร[CSA.GetAdjective]แลว แมจะอางวาไมไดฝกใฝฝายใดในความขัดแยงที่ดําเนินอยู แตพวกเขาก็ประกาศวาจะบังคับใชกฎหมายใหมหลายฉบับเกี่ยวกับการเกณฑทหารใหกองทัพ[CSA.GetAdjective]\n\nในการประกาศครั้งนี้ พวกเขายังระบุวาผูแทนในสภาคองเกรสที่ยังคงอยูในเมืองหลวงไมไดเปนตัวแทนของประชาชน[USA_state_government_created.GetName]อีกตอไป"
 mtg_usa_civil_war_fascists.203.a: "พวกทรยศทั้งสิ้น"
 mtg_usa_congress_remove_state_tt: "วุฒิสมาชิกสองคนถูกถอดออกจากสภาคองเกรส\n"
 mtg_usa_congress_add_state_tt: "วุฒิสมาชิกสองคนถูกเพิ่มเขาสูสภาคองเกรส ในชวงแรกพวกเขาจะ §Gสนับสนุนรัฐบาล§!\n"
 mtg_usa_civil_war_democrats.1.t: "การประทวงในเมืองหลวง"
 mtg_usa_civil_war_democrats.1.desc: "การประทวงครั้งใหญอีกระลอกไดปะทุขึ้นในเมืองหลวง โดยผูชุมนุมปดถนนสายหลักทุกสายในและรอบอาคารรัฐสภา การประทวงที่จัดโดย "คณะกรรมการปฏิบัติการเพื่อพิทักษสาธารณรัฐ" เรียกรองใหมีการสอบสวนอยางเปนอิสระตอขอกลาวหาเรื่องการทุจริตและการประพฤติมิชอบในรัฐบาลของประธานาธิบดี[USA.GetLeader] โดยเฉพาะอยางยิ่ง พวกเขาเรียกรองใหประธานาธิบดีประณามซิลเวอรลีเจียนและใหคํามั่นตอสาธารณะวาสิทธิในฐานะผูมีสิทธิเลือกตั้งของพวกเขาจะไดรับการเคารพ\n\nประธานาธิบดี[USA.GetLeader]ปฏิเสธที่จะแสดงความเห็นในเรื่องนี้"
 mtg_usa_civil_war_democrats.1.a: "ปลอยใหพวกเขาประทวงไป เรามีประเทศตองบริหาร"
 mtg_usa_civil_war_democrats.2.t: "การเดินขบวนสิบลานคน"
 mtg_usa_civil_war_democrats.2.desc: "ทั่วประเทศ การประทวงตอตานนโยบายของประธานาธิบดี[USA.GetLeader]ที่เกิดขึ้นเปนประจํามีขนาดใหญขึ้นเรื่อย ๆ จนขณะนี้มีผูประทวงหลายลานคนเปนประจํา วันนี้มีผูเดินขบวนมากกวาหนึ่งลานคนบนทองถนนในวอชิงตัน และมีรายงานจํานวนใกลเคียงกันในอีกอยางนอยเกาแหง ยังไมนับรวมการเดินขบวนที่เล็กกวาในเมืองหลวงของรัฐและเมืองขนาดเล็ก ซึ่งแตละแหงยังดึงผูคนไดหลายพันคน บางแหงถึงหลายแสนคน การประทวงเกิดขึ้นหลังจากรัฐบาลตัดสินใจเชิงนโยบายที่ไมเปนที่นิยมหลายครั้ง ซึ่งผูจัดอางวาบอนทําลายรากฐานประชาธิปไตยของสาธารณรัฐ\n\n จากเดิมที่ผูประทวงเรียกรองใหประธานาธิบดีตีตัวออกหางจากอุดมการณที่หัวรุนแรงกวา บัดนี้พวกเขาเรียกรองใหปลดเขาออกจากตําแหนงทันที"
 mtg_usa_civil_war_democrats.2.a: "แลวพวกเขาจะบังคับใหเปนไปตามขอเรียกรองนั้นไดอยางไร?"
 mtg_usa_civil_war_democrats.10.desc: "คลังอาวุธของสหรัฐฯ ในพื้นที่หางไกลของ[GETUSASTATE]ถูกกองกําลังไมทราบฝายโจมตีเมื่อคืนที่ผานมา ชายติดอาวุธกลุมเล็ก ๆ บังคับยามไมกี่นายเขาไปในโรงเก็บของและขังไว เมื่อทหารหนีออกมาไดหลังรุงสาง ก็พบวาคลังอาวุธถูกปลนจนเกลี้ยง ดูเหมือนวาในระหวางคืนนั้น ผูโจมตีไดขนยุทโธปกรณจํานวนมากไปยังสถานที่ที่ไมทราบแนชัด"
 mtg_usa_civil_war_democrats.11.t: "กองกําลังพลเมืองกอตัวขึ้น"
 mtg_usa_civil_war_democrats.11.desc: "ระหวางการเดินขบวนและการชุมนุมตอตานนโยบายของประธานาธิบดี[USA.GetLeader]ชุดลาสุด ผูประทวงจํานวนมากพกอาวุธอยางเปดเผยและสวมปลอกแขนที่ระบุวาเปนสวนหนึ่งของขบวนการ "กองกําลังพลเมือง" ที่กําลังเติบโต เมื่อถูกตํารวจตั้งคําถาม ผูประทวงอางวาพวกเขาเพียงใชสิทธิตามบทแกไขเพิ่มเติมรัฐธรรมนูญครั้งที่ 2 แต FBI พบสัญญาณวากลุมเหลานี้ไมไดเพียงสงเสริมการครอบครองอาวุธสวนบุคคลเทานั้น\n\nผูใหขอมูลรายงานวากลุมติดอาวุธเหลานี้จัดประชุมเปนประจํา และพยายามหาคูมือการฝกทหารราบมาครอบครอง"
 mtg_usa_civil_war_democrats.11.a: "ไมเห็นมีอะไรผิด"
 citizen_militia_tt: "พลเมืองในรัฐจะจัดตั้งหนวยกองกําลังอาสา ซึ่งจะเริ่มปฏิบัติการเมื่อสงครามปะทุขึ้น"
 mtg_usa_civil_war_democrats.14.t: "คนงานนัดหยุดงาน"
 mtg_usa_civil_war_democrats.14.desc: "มีรายงานการนัดหยุดงานครั้งใหญทั่วสหรัฐฯ โดยสหภาพแรงงานหลากหลายแหงเรียกรองใหลงมือ มีเพียงบริการที่สําคัญยิ่งเทานั้นที่ไดรับการยกเวน เกิดการตอสูในหลายพื้นที่ระหวางผูนัดหยุดงานกับผูทําลายการนัดหยุดงาน \n\nที่ผิดปกติคือ คนงานไมไดเรียกรองคาจางที่สูงขึ้นหรือขอผอนปรนอื่น ๆ แตเรียกรองไมนอยไปกวาการลาออกของประธานาธิบดี[USA.GetLeader]"
 mtg_usa_civil_war_democrats.14.a: "จะคาดหวังอะไรไดอีกจากพวกคอมมิวนิสตผูทรยศเหลานี้?"
 mtg_usa_civil_war_democrats.15.t: "นักอุตสาหกรรมยายโรงงานอาวุธ"
 mtg_usa_civil_war_democrats.15.desc: "เมื่อความไมมั่นคงลุกลามไปทั่วประเทศ ผูประกอบการจํานวนมากเริ่มมองหาสถานที่ที่ปลอดภัยกวาเพื่อตั้งกิจการอยางเงียบ ๆ โดยเฉพาะรัฐทางใตของสหรัฐฯ ที่ไดเห็นผลผลิตภาคอุตสาหกรรมฟนตัวขึ้นอีกครั้ง บางบริษัทถึงกับยายโรงงานทั้งโรงขามประเทศมาครึ่งทาง"
 mtg_usa_civil_war_democrats.15.a: "ยินดีตอนรับพวกเขาเปนอยางยิ่ง"
 mtg_usa_civil_war_democrats.16.t: "การยายถิ่นทางเศรษฐกิจ"
 mtg_usa_civil_war_democrats.16.desc: "หลังจากการยายถิ่นจากชนบทไปยังศูนยกลางอุตสาหกรรมทางตะวันออกเฉียงเหนือมานานหลายทศวรรษ รายงานของรัฐบาลเมื่อเร็ว ๆ นี้แสดงใหเห็นถึงการพลิกกลับอยางมาก บริษัทในภาคพลเรือนยายไปยังรัฐทางใตและตั้งรกรากในภูมิภาคที่เคยดอยพัฒนามากขึ้นเรื่อย ๆ พรอมนําตําแหนงงานใหมหลายรอยตําแหนงมาดวย เจาของโรงงานหลายรายอางถึงบรรยากาศที่ "ไมเปนมิตร" ในภาคเหนือ ซึ่งเต็มไปดวยการนัดหยุดงานเปนประจําและสหภาพแรงงานที่กาวราวขึ้นเรื่อย ๆ วาเปนหนึ่งในสาเหตุ"
 mtg_usa_civil_war_democrats.16.a: "นี่พิสูจนวานโยบายของประธานาธิบดีไดผล!"
 mtg_usa_civil_war_democrats.20.t: "กบฏบอสตัน"
 mtg_usa_civil_war_democrats.20.desc: "การประทวงตอตานประธานาธิบดีที่เกิดขึ้นตอเนื่องไดมาถึงจุดสูงสุดในที่สุด เมื่อวานนี้ หลังจากการเดินขบวนไปถึงจุดหมายใจกลางบอสตัน ผูประทวงไมไดแยกยายกลับบาน แตกลับแตกออกเปนกลุมยอยและยึดสถานที่สําคัญทั่วเมือง พอตกคํ่าพวกเขาก็ควบคุมเมืองไดทั้งหมด ตํารวจสวนใหญเปลี่ยนไปเขาขางผูประทวง และผูวาการรัฐแมสซาชูเซตสปฏิเสธที่จะสงกองกําลังปองกันชาติเขาไป\n\n"คณะกรรมการพลเมืองบอสตัน" ไดเขาควบคุมเมืองและมีรายงานวากําลังรวมมือกับฝายกบฏ รัฐอื่น ๆ ในนิวอิงแลนดไดผานญัตติสนับสนุน โดยระบุวาพวกเขาไมถือวาตนผูกพันกับกฎหมายใด ๆ ที่ลงนามโดยประธานาธิบดี[USA.GetLeader]อีกตอไป และเรียกรองใหรัฐบาลมลรัฐอื่น ๆ ทั้งหมดในสหรัฐอเมริกาประกาศปลดประธานาธิบดี ยุบสภาคองเกรส และจัดการเลือกตั้งใหม\n\nแมกองทัพบางสวนยังคงอยูขางเรา แตหนวยทั้งหนวยไดแจงแกนายทหารของตนวาจะไมปฏิบัติตามคําสั่งใหปราบปรามการกบฏ"
 mtg_usa_civil_war_democrats.20.a: "ไมมีใครเอาจริงเอาจังกับพวกเขาหรอก เรื่องนี้จะซาไปเอง"
 mtg_usa_civil_war_democrats.21.t: "การกบฏลุกลามสูชายฝงตะวันตก"
 mtg_usa_civil_war_democrats.21.desc: "รัฐบาลมลรัฐแคลิฟอรเนีย ออริกอน และวอชิงตัน ตางประกาศสนับสนุนรัฐบาลบอสตัน และสั่งใหเจาหนาที่รัฐบาลกลางทุกคนลาออกจากตําแหนงหรือออกจากดินแดนของรัฐเหลานี้ทันที แมจะมีรายงานการตอตานประปรายอยูบาง แตดูเหมือนวาการเคลื่อนไหวนี้จะไดรับการสนับสนุนจากประชาชนสวนใหญ"
 mtg_usa_civil_war_democrats.21.a: "เรายังคงยึดใจกลางประเทศไวได"
 mtg_usa_civil_war_democrats.22.t: "มิดเวสตประกาศสนับสนุนรัฐบาล"
 mtg_usa_civil_war_democrats.22.desc: "เมื่อรัฐตาง ๆ ปฏิเสธที่จะทําตามคําสั่งของรัฐบาลอันชอบธรรมมากขึ้นเรื่อย ๆ ผูวาการรัฐโอไฮโอ มิสซูรี วิสคอนซิน อิลลินอยส อินดีแอนา และมิชิแกน ไดรวมกันประกาศวาจะไมยอมทนตอพฤติกรรมยุยงปลุกปนใด ๆ ในหมูประชาชนของตน พวกเขาใหเหตุผลวาสงครามกลางเมืองครั้งใหมจะทําใหสหรัฐฯ ออนแอลงอยางอันตรายเมื่อเผชิญกับการรุกรานจากตางชาติ"
 mtg_usa_civil_war_democrats.22.a: "ก็สมควรแลว"
 mtg_usa_civil_war_democrats.23.t: "ชายฝงตะวันออกเขารวมการกบฏ"
 mtg_usa_civil_war_democrats.23.desc: "กองกําลังกบฏที่เคลื่อนลงใตจากนิวอิงแลนดไดรับการตอนรับอยางกวางขวางในฐานะผูปลดปลอยในแมริแลนด นิวยอรก เพนซิลเวเนีย และนิวเจอรซีย โดยผูวาการรัฐในพื้นที่สั่งใหตํารวจรัฐและกองกําลังปองกันชาติไมเขาแทรกแซง ความพยายามใด ๆ ที่จะรวบรวมกองกําลังฝายภักดีรอบเมืองหลวงลมเหลวทั้งหมด ประธานาธิบดี[USA.GetLeader]ถูกอพยพออกจากวอชิงตันเพียงไมกี่ชั่วโมงกอนที่กองกําลังกบฏจะปดทางออกทั้งหมด ขบวนรถของเขาไปถึงริชมอนด รัฐเวอรจิเนีย และนาจะมุงหนาลงใตตอไป"
 mtg_usa_civil_war_democrats.23.a: "เราจะกลับมา"
 mtg_usa_civil_war_democrats.25.t: "ภาคตะวันตกเฉียงเหนือแยกตัว"
 mtg_usa_civil_war_democrats.25.desc: "ผูวาการรัฐไวโอมิง ไอดาโฮ และมอนแทนา ไดรวมกันประกาศสนับสนุนรัฐบาลบอสตัน กองกําลังกบฏจากวอชิงตันและออริกอนไดเชื่อมตอกับสหายรวมรบในรัฐเหลานั้นแลว"
 mtg_usa_civil_war_democrats.25.a: "ยังไงก็เปนที่ดินวางเปลาเสียสวนใหญ"
 mtg_usa_civil_war_democrats.26.t: "ภาคตะวันตกเฉียงเหนือประกาศสนับสนุนรัฐบาล"
 mtg_usa_civil_war_democrats.26.desc: "สภานิติบัญญัติของรัฐไวโอมิง ไอดาโฮ และมอนแทนา ไดผานกฎหมายตอตานการยุยงปลุกปนชุดหนึ่ง ซึ่งใหอํานาจอยางกวางขวางแกหนวยงานบังคับใชกฎหมายทองถิ่นในการจับกุมและควบคุมตัวผูใดก็ตามที่พบวาพูดตอตานรัฐบาลกลางตลอดชวงภาวะฉุกเฉินนี้ อยางไรก็ตาม การที่มีกองกําลังกบฏอยูในวอชิงตันและออริกอนที่อยูใกลเคียง ทําใหตองไดรับการสนับสนุนจากกองกําลังฝายภักดีอยางรวดเร็ว"
 mtg_usa_civil_war_democrats.26.a: "เปนดินแดนทางยุทธศาสตร"
 mtg_usa_civil_war_democrats.27.t: "ภาคตะวันตกเฉียงใตแยกตัว"
 mtg_usa_civil_war_democrats.27.desc: "เนวาดา แอริโซนา ยูทาห นิวเม็กซิโก และโคโลราโด ตางประกาศเขารวมการกบฏ เจาหนาที่รัฐที่ปฏิเสธคําสั่งใหกองกําลังกบฏจากแคลิฟอรเนียผานทางถูกปลดออกจากตําแหนงโดยทันที และในหลายกรณีถูกจําคุก"
 mtg_usa_civil_war_democrats.27.a: "ยอดเยี่ยม ทะเลทรายไรประโยชนที่ตองปองกันนอยลง"
 mtg_usa_civil_war_democrats.28.t: "ภาคตะวันตกเฉียงใตประกาศสนับสนุนรัฐบาล"
 mtg_usa_civil_war_democrats.28.desc: "ผูวาการรัฐเนวาดา แอริโซนา ยูทาห นิวเม็กซิโก และโคโลราโด ไดประกาศภาวะฉุกเฉินหลังการชุมนุมสนับสนุนรัฐบาลบอสตันที่แพรกระจายไปทั่ว ในหลายกรณี ตํารวจรัฐและหนวยกองกําลังปองกันชาติไดเปดฉากยิงใสผูประทวง ซึ่งหนีไปดวยความตื่นตระหนกพรอมลากรางผูเสียชีวิตและผูบาดเจ็บไปดวย"
 mtg_usa_civil_war_democrats.28.a: "เวลาของการชุมนุมและการปราศรัยผานพนไปนานแลว"
 mtg_usa_civil_war_democrats.29.t: "มิดเวสตตะวันตกแยกตัว"
 mtg_usa_civil_war_democrats.29.desc: "รัฐบาลมลรัฐดาโคตาทั้งสอง ไอโอวา มินนิโซตา และเนแบรสกา ถูกกวาดลางออกจากอํานาจโดยการลุกฮือที่ประสานงานและดําเนินการมาอยางดี โดยไดรับการสนับสนุนจากเจาหนาที่บังคับใชกฎหมายทองถิ่นและทหารกองกําลังปองกันชาติที่เห็นอกเห็นใจ ผูวาการรัฐชั่วคราวที่ไดรับเลือกอยางเรงรีบไดประกาศสนับสนุนรัฐบาลบอสตัน"
 mtg_usa_civil_war_democrats.29.a: "ดินแดนนั้นยึดคืนไดงายดาย"
 mtg_usa_civil_war_democrats.30.t: "มิดเวสตตะวันตกประกาศสนับสนุนรัฐบาล"
 mtg_usa_civil_war_democrats.30.desc: "วันนี้รัฐบาลมลรัฐดาโคตาทั้งสอง ไอโอวา มินนิโซตา และเนแบรสกา สามารถสกัดความพยายามกอรัฐประหารที่ดูเหมือนจะวางแผนมาอยางดีของกลุมฝายซายไดอยางหวุดหวิด ซึ่งไดรับการสนับสนุนจากเจาหนาที่บังคับใชกฎหมายและทหารกองกําลังปองกันชาติที่กอกบฏ พลเมืองฝายภักดีสามารถปกปองสภานิติบัญญัติของรัฐและปองกันไมใหผูวาการรัฐหลายคนถูกจับตัวได แตก็ตองสูญเสียในการยิงตอสูอันดุเดือดหลายครั้งในเมืองหลวงของรัฐ"
 mtg_usa_civil_war_democrats.30.a: "วีรบุรุษกันทุกคน"
 mtg_usa_civil_war_democrats.31.t: "มิดเวสตแยกตัว"
 mtg_usa_civil_war_democrats.31.desc: "ผูวาการรัฐโอไฮโอ มิสซูรี วิสคอนซิน อิลลินอยส อินดีแอนา และมิชิแกน ไดประกาศสนับสนุนรัฐบาลบอสตัน โดยอางถึงการขาดการสนับสนุนจากรัฐบาลและ "การขาดภาวะผูนําอยางนาตกใจของอดีตประธานาธิบดี[USA.GetLeader]" ความสัมพันธภายในคายกบฏนาจะตึงเครียด เพราะผูวาการรัฐเหลานี้ลวนเคยถูกมองวาอยูในคายของประธานาธิบดีอยางมั่นคงมากอน"
 mtg_usa_civil_war_democrats.31.a: "พวกเขาเปนเพียงกลุมสุดทายในแถวยาวเหยียดของพวกทรยศที่ตองจัดการ"
 mtg_usa_civil_war_democrats.40.t: "แมกอาเธอรเสนอตัวนํารัฐบาล"
 mtg_usa_civil_war_democrats.40.desc: "ขณะที่รัฐบาลกําลังลาถอยอยางเต็มที่และพื้นที่สวนใหญของประเทศเขาขางฝายกอการ นายพลแมกอาเธอรไดเขามาหาเราพรอมขอเสนอ แมกอาเธอรชี้วามีเพียงเขาเทานั้นที่เขาใจความคิดของชาวอเมริกันอยางแทจริงและสามารถมอบเสถียรภาพและภาวะผูนําในหวงวิกฤตนี้ได จึงเสนอตัวนํา 'รัฐบาลปองกันประเทศ' จนกวาฝายกอการจะพายแพ ตามคํากลาวของแมกอาเธอร การนี้จะชวยลดความขัดแยงระหวางผูนําฝายพลเรือนกับผูบัญชาการทหาร ดวยการใหนายพลแมกอาเธอรเปนผูกุมอํานาจ\n\nบางคนในรัฐบาลรูสึกอึดอัดอยูบางที่เขายังคงเรียกตัวเองดวยบุรุษที่สามอยูเรื่อย"
 mtg_usa_civil_war_democrats.40.a: "ยามคับขันยอมตองใชมาตรการเด็ดขาด"
 mtg_usa_civil_war_democrats.40.b: "นั่นจะเปนจุดจบของสาธารณรัฐ"
 mtg_usa_civil_war_democrats.41.t: "วิลเลียม ดัดลีย เพลลีย ทาทาย[USA.GetLeader]"
 mtg_usa_civil_war_democrats.41.desc: "เมื่อการกอการที่บอสตันสิ้นสุดลงในที่สุด หลายคนในรัฐบาลไมแนใจวาจะดําเนินการตออยางไร เดิมทีรัฐบาลปองกันประเทศของแมกอาเธอรถูกวางไวใหอยูจนสิ้นสงครามเทานั้น แตโลกรอบ[USA.GetNameDef]กลับยิ่งเปนปรปกษมากขึ้น และอีกไมนานเราอาจตองทําสงครามอีกครั้ง วิลเลียม ดัดลีย เพลลีย ผูนําฝายฟาสซิสต ไดเรียกรองตอสาธารณะใหกลับคืนสู 'รัฐบาลที่ชอบดวยกฎหมายและมีระเบียบ' พรอมขอบคุณแมกอาเธอรสําหรับการรับใชชาติ เพลลียชี้ถึงกระแสสนับสนุนขบวนการของเขาที่พุงสูงขึ้นในชวงสงคราม และเห็นไดชัดวาเขามองวาตนถูกลิขิตมาใหดํารงตําแหนงประธานาธิบดีและผูนําแหงอเมริกา[USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\nดวยทาทีถอมตนที่ไมเคยเห็นมากอน [USA.GetLeader]เสนอที่จะลงจากตําแหนงหากประชามติตองการ ชาวอเมริกันกําลังจับตาดูเราวาคนอื่น ๆ ในรัฐบาลมีความเห็นตอเรื่องนี้อยางไร"
 USA_hilt_candidate: "\n\n ที่ทําใหสับสนยิ่งขึ้นคือนายอดัม ฮิลต ผูไมเคยมีชื่อเสียงทางการเมืองมากอน หัวหนาบริษัทสถาปนิก Hilt & Partner ที่มีชื่อเสียงระดับโลก ซึ่งเดิมตั้งอยูในเบอรลินแตอพยพมายังบราวโนว รัฐอารคันซอ ระหวางสงครามกลางเมืองเยอรมนี เขาเพิ่งประกาศตอสาธารณะวาพรอมจะรับใชประเทศที่เขาถือกําเนิด ฝายวิจารณบางคนตั้งคําถามถึงสําเนียงเยอรมันที่ชัดเจนของฮิลต ซึ่งนายฮิลตอางวามาจากการทํางานและศึกษาศิลปะในเยอรมนีมาหลายป ฮิลตกลาววารายละเอียดเล็กนอยเชนนี้มีแตจะเบี่ยงเบนความสนใจจากประเด็นใหญ และเปนเพียงความพยายามอันขี้ขลาดที่จะใสรายผูรักชาติและพลเมืองโดยกําเนิดเทานั้น"
 USA_lindbergh_candidate: "\n\nชาลส ลินดเบิรก นักบินผูมีชื่อเสียง ไดลงชิงตําแหนงดวยเชนกัน โดยอางถึงการรับใชประเทศของเขาในชวงกอนสงครามครั้งลาสุดและคุณูปการตอวงการการบินโดยรวม ลินดเบิรกชี้วาผูสมัครหลักทั้งสองคนสรางความแตกแยก และเชื่อวาตนคือบุคคลที่ดีที่สุดที่จะรวมใจและปลุกเราประเทศใหกาวขามความแตกตางและกลับคืนสูความยิ่งใหญดังเดิม"
 mtg_usa_civil_war_democrats.41.d: "ขอใหชาลส ลินดเบิรกจัดตั้งรัฐบาล"
 mtg_usa_civil_war_democrats.41.a: "เขาไดทําหนาที่ของเขาแลว"
 mtg_usa_civil_war_democrats.41.b: "สาธารณรัฐยังตองการเขาอยู"
 mtg_usa_civil_war_democrats.41.c: "นายฮิลตดูจะเปนผูสมัครที่ดีที่สุดในการฟนฟูประเทศ"
 mtg_usa_canadian_corridor.1.t: "ระเบียงแคนาดา"
 mtg_usa_canadian_corridor.1.desc: "วันนี้เอกอัครราชทูตของเราใน[USA.GetNameDef]ถูกเรียกตัวไปยังกระทรวงการตางประเทศและไดรับคําขาด ตามหนังสือที่ยื่นให รัฐบาลของ[USA.GetNameDef]ไมอาจยอมรับอธิปไตยของแคนาดาเหนือพื้นที่ระหวางวอชิงตันกับอะแลสกาไดอีกตอไป \n\nขอเสนอที่จะเจรจาสนธิสัญญาเพื่ออนุญาตใหทหารผานแดนและยกเวนการควบคุมชายแดนบางประการถูกปฏิเสธอยางไมไยดี รัฐบาล[USA.GetAdjective]คาดหวังคําตอบภายในเที่ยงคืน"
 mtg_usa_canadian_corridor.1.a: "พวกเขาจะไดคําตอบ"
 mtg_usa_canadian_corridor.1.b: "ไมมีวัน!"
 mtg_usa_canadian_corridor.2.t: "[CAN.GetNameDefCap]ยอมรับ"
 mtg_usa_canadian_corridor.2.desc: "รัฐบาลของ[CAN.GetLeader]ตกลงตามขอเรียกรองของเราและถอนตัวออกจากดินแดนพิพาท กองกําลังของเราไดรุกคืบเขาไปเพื่อสถาปนาการควบคุมเหนือฐานที่มั่นแหงอารยธรรมเทาที่มีอยูนอกเขตเมือง"
 mtg_usa_canadian_corridor.2.a: "พวกเขาเลือกไดอยางชาญฉลาด"
 mtg_usa_canadian_corridor.3.t: "[CAN.GetNameDefCap]ปฏิเสธ"
 mtg_usa_canadian_corridor.3.desc: "[CAN.GetLeader]ประณามความพยายามทางการทูตใด ๆ เพิ่มเติมอยางเปดเผย โดยเรียกขอเสนอของเราวา "ไมตางอะไรกับการยื่น 'แวนคูเวอรหรือสงคราม!' และหวังใหเราพับเพียบยอมอยางคนขี้ขลาด" มีรายงานวากองกําลัง[CAN.GetAdjective]อยูในภาวะเตรียมพรอมสูงสุดและเขายึดที่มั่นตั้งรับตามแนวชายแดน"
 mtg_usa_canadian_corridor.3.a: "เรายื่นสันติภาพให แตพวกเขาเลือกสงคราม"
 mtg_usa_canadian_corridor.3.b: "เราไมอาจทําสงครามเพื่อแลกกับกอนหินและตนไมกองหนึ่ง"
 mtg_usa_southern_threat.1.t: "[USA.GetNameDefCap]เรียกรองสนธิสัญญาวาดวยการปรึกษาหารือและมิตรภาพ"
 mtg_usa_southern_threat.1.desc: "ประธานาธิบดี[USA.GetLeader]ไดเรียกตัวเอกอัครราชทูตของเราไปเพื่อยื่นขอเรียกรองชุดหนึ่งจากรัฐบาลสหรัฐฯ ซึ่งรวมถึงสิทธิพิเศษในการปรึกษาหารือสําหรับเอกอัครราชทูต[USA.GetAdjective] ในทางปฏิบัติ สิทธิเหลานี้จะทําใหรัฐบาล[USA.GetAdjective]มีอํานาจยับยั้งการตัดสินใจใด ๆ ที่เราทํา\n\nหนังสือดังกลาวระบุตอไปวา หากเราปฏิเสธ รัฐบาล[USA.GetAdjective]จะจําตอง "ดําเนินมาตรการที่เห็นวาจําเปนเพื่อประกันความมั่นคงของชาติ""
 mtg_usa_southern_threat.1.a: "เราตองยอมรับสิ่งที่ไมอาจยอมรับไดเพื่อหลีกเลี่ยงการนองเลือด"
 mtg_usa_southern_threat.1.b: "ไมมีวัน!"
 mtg_usa_southern_threat.2.t: "[MEX.GetLeader]ยอมรับ"
 mtg_usa_southern_threat.2.desc: "เมื่อตระหนักวาสถานการณของตนสิ้นหวัง รัฐบาลของ[MEX.GetLeader]จึงยอมรับขอเสนอของเราและตกลงที่จะปรึกษาเรากอนตัดสินใจเชิงนโยบายที่สําคัญทุกครั้ง"
 mtg_usa_southern_threat.2.a: "เพอรชิงคงภูมิใจ"
 mtg_usa_southern_threat.3.t: "[MEX.GetLeader]ปฏิเสธ"
 mtg_usa_southern_threat.3.desc: "ในสุนทรพจนยืดยาวที่ยอนรําลึกถึงวีรกรรมของชาวเม็กซิกันรุนกอน ๆ ในการเผชิญ "การรุกรานอยางโจงแจงของอเมริกา" [MEX.GetLeader]ปฏิเสธที่จะพิจารณาคําขอของเราแมแตนอย และบอกเอกอัครราชทูตของเราวาชาวเม็กซิกันจะไมมีวันกมหัวใหผูรุกรานตางชาติ"
 mtg_usa_southern_threat.3.a: "เราไมอาจปลอยใหการดูหมิ่นนี้ผานไปโดยไมลงโทษ"
 mtg_usa_southern_threat.3.b: "สงครามไมใชประโยชนสูงสุดของเราในขณะนี้"
 mtg_usa_north_american_dominion.1.t: "[USA.GetNameDefCap]เรียกรองการควบคุมนโยบายตางประเทศ"
 mtg_usa_north_american_dominion.1.desc: "ในสิ่งที่ดูเหมือนจะเปนสวนหนึ่งของการรุกทางการทูตอยางเปนระบบทั่วอเมริกาเหนือและแคริบเบียน เอกอัครราชทูต[USA.GetAdjective]ไดยื่นหนังสือจากประธานาธิบดี[USA.GetLeader] แจงวารัฐบาลของเขาคาดหวังใหเราปรึกษาพวกเขาในการตัดสินใจดานนโยบายตางประเทศทุกครั้งในอนาคต "เพื่อสันติภาพและไมตรีจิตที่ตอเนื่องระหวางชาติของเรา""
 mtg_usa_north_american_dominion.1.a: "เราไมมีทางเลือก"
 mtg_usa_north_american_dominion.2.t: "[From.GetNameDefCap]ยอมรับการตกอยูใตอํานาจ"
 mtg_usa_north_american_dominion.2.desc: "รัฐบาลของ[From.GetLeader]ตกลงตามคําขอของเรา และจะใหเอกอัครราชทูตของเรามีอํานาจยับยั้งการตัดสินใจเชิงนโยบายที่สําคัญใด ๆ ที่พวกเขาทํา"
 mtg_usa_north_american_dominion.2.a: "เปนทางเลือกที่ชาญฉลาด"
 mtg_usa_north_american_dominion.3.t: "[From.GetNameDefCap]ปฏิเสธ"
 mtg_usa_north_american_dominion.3.desc: "[From.GetLeader]แสดงปฏิกิริยาตื่นตระหนกอยางยิ่งตอหนังสือทางการทูตของเรา ในคําตอบของเขา เขาประกาศวา[From.GetNameDef]มีประวัติศาสตรแหงเอกราชและอธิปไตยอันยาวนานและนาภาคภูมิใจ และจะไมมีวันยอมใหมหาอํานาจตางชาติบังคับเจตจํานงเหนือพวกเขา\n\nเขายังวิงวอนใหประธานาธิบดี[USA.GetLeader]พิจารณาผลที่ตามมาของสงครามในประเด็นนี้ ซึ่งจะทําให[USA.GetNameDef]ถูกตราหนาวาเปนภัยคุกคามตอสันติภาพที่ใหญที่สุดอยางแนนอน และจะกอผลลัพธที่ไมอาจจินตนาการได"
 mtg_usa_north_american_dominion.3.a: "คําพูดกลาหาญจากผูที่ออนแอเหลือเกิน"
 mtg_usa_north_american_dominion.3.b: "บางทีเขาอาจพูดถูก"
 mtg_usa_strategic_interests.1.t: "สหรัฐฯ เรียกรองดินแดน"
 mtg_usa_strategic_interests.1.desc: "ประธานาธิบดี[USA.GetLeader]เดินทางมาถึงลอนดอนเพื่อหารือขอเสนอหลายประการเกี่ยวกับกรรมสิทธิ์ในพื้นที่ยุทธศาสตรหลายแหงทั่วโลก ตามที่รัฐบาล[USA.GetAdjective]ระบุ [ENG.GetNameDef]ขาดทั้งทรัพยากรและความตั้งใจที่จะปองกันพื้นที่เหลานั้นอยางเพียงพอในแบบที่รับประกันผลประโยชนของ[USA.GetAdjective] นักวิเคราะหเชื่อวาหากรัฐบาล[ENG.GetAdjective]ไมสามารถใหหลักประกันที่เพียงพอวาจะปฏิบัติตามพันธะเหลานี้ได [USA.GetLeader]จะเรียกรองใหเราสงมอบการควบคุมดินแดนเหลานี้ใหแก[USA.GetNameDefCap]"
 mtg_usa_strategic_interests.1.a: "เอาไปไดเลย"
 mtg_usa_strategic_interests.1.b: "นี่คือดินแดนทางยุทธศาสตร!"
 mtg_usa_strategic_interests.2.t: "[From.GetNameDefCap]สงมอบดินแดน"
 mtg_usa_strategic_interests.2.desc: "หลังจากการถกเถียงภายในอยางยาวนาน รัฐบาล[ENG.GetAdjective]ตัดสินใจยอมรับขอเสนอของเรา ทั้งสองฝายไดตกลงกําหนดการโอนกรรมสิทธิ์ดินแดนที่รองขอแลว"
 mtg_usa_strategic_interests.2.a: "เยี่ยม!"
 mtg_usa_strategic_interests.3.t: "[From.GetNameDefCap]ปฏิเสธที่จะใหความรวมมือ"
 mtg_usa_strategic_interests.3.desc: "เพียงไมกี่นาทีหลังเริ่มการประชุม [ENG.GetLeader]และ[USA.GetLeader]ก็ยุติการเจรจา เมื่อคําตอบของ[ENG.GetAdjective]คือคําวา "ไม" สั้น ๆ หลังจากนั้นมีหนังสืออยางเปนทางการที่ละเอียดกวาตามมา แตก็เพียงตอกยํ้าการปฏิเสธที่จะหารือเงื่อนไขใด ๆ"
 mtg_usa_strategic_interests.3.a: "ถาอยางนั้นก็มาดูกันวาพวกเขาจะปองกันมันไดดีแคไหน!"
 mtg_usa_strategic_interests.3.b: "ดินแดนเหลานี้ไมคุมกับราคาที่ตองจาย"
 mtg_usa_pacific_pacification.1.t: "[USA.GetNameDefCap]เรียกรองดินแดนอาณานิคม"
 mtg_usa_pacific_pacification.1.desc_a: "คณะผูแทนของรัฐบาล[USA.GetAdjective]เดินทางมาถึงเพื่อหารือเรื่องความมั่นคงของดินแดนในครอบครองของเราในแปซิฟก ประธานาธิบดี[USA.GetLeader]ชี้ถึงความไมมั่นคงที่ยังคงดําเนินอยูในจีนและสถานการณในญี่ปุน และยินดีที่จะรับผิดชอบการปองกัน[GET_AUSTRALIA_NEW_ZEALAND_STATUS] เพื่อแลกกับเอกสิทธิ์และสิทธิสงวนจํานวนหนึ่ง\n\n แมฝาย[USA.GetAdjective]จะอางวาสิทธิเหลานี้จะใชเพื่อประกันความมั่นคงของ[GET_AUSTRALIA_NEW_ZEALAND_STATUS]เทานั้น แตหลายคนในรัฐบาลเชื่อวามันจะทําให[GET_AUSTRALIA_NEW_ZEALAND_STATUS]แทบไมตางอะไรกับหุนเชิด"
 mtg_usa_pacific_pacification.1.desc_b: "คณะผูแทนของรัฐบาล[USA.GetAdjective]เดินทางมาถึงเพื่อหารือแผนการปองกันรวมกัน ดูเหมือนวาประธานาธิบดี[USA.GetLeader]จะมองวาดินแดนเล็ก ๆ ของเราในมุมนี้ของโลกมีความสําคัญยิ่งตอความมั่นคงของ[USA.GetNameDef] อยางไรก็ตาม นอกเหนือจากการรับประกันงาย ๆ วาจะมาชวยเหลือเรา รัฐบาล[USA.GetAdjective]ยังตองการใหแนใจวาเราเองจะไมกลายเปนภัยคุกคาม ดวยเหตุนี้ ขอตกลงจึงมาพรอมกับขอกําหนดหลายประการที่จะให[USA.GetNameDef]มีสิทธิ์มีเสียงอยางมากในการดําเนินกิจการภายในของเรา\n\nแมจนถึงตอนนี้จะยังไมมีการขูทําสงครามในการเจรจา แตก็เห็นไดชัดวาประธานาธิบดี[USA.GetLeader]จะถือวาการปฏิเสธของเราเปนการกระทําที่เปนปรปกษอยางยิ่ง"
 AST_NZL_PUPPET: "ออสเตรเลียและนิวซีแลนด"
 AST_NZL_NO_PUPPET_FALLBACK: "ประเทศตาง ๆ ในภูมิภาคแปซิฟกใต"
 mtg_usa_pacific_pacification.1.a: "พวกเขาคงไมแทรกแซงกิจการภายในหรอก"
 mtg_usa_pacific_pacification.1.b: "เราปองกันพื้นที่เหลานั้นไดดีอยูแลว"
 mtg_usa_pacific_pacification.2.t: "[From.GetNameDefCap]ยอมรับ"
 mtg_usa_pacific_pacification.2.desc: "รัฐบาลของ[From.GetLeader]ยอมรับขอเสนอของเราแลว คณะกรรมการรวมพิเศษไดถูกจัดตั้งขึ้นเพื่อประสานการดําเนินการในรายละเอียด"
 mtg_usa_pacific_pacification.2.a: "เยี่ยมมาก"
 mtg_usa_pacific_pacification.3.t: "[From.GetNameDefCap]ปฏิเสธ"
 mtg_usa_pacific_pacification.3.desc: "รัฐบาลของ[From.GetNameDef]ปฏิเสธแมแตจะพบกับคณะผูแทนของเรา โดยอางวาไมมีประเด็นคางคาใด ๆ ระหวางชาติของเรา อยางไรก็ตาม ผูชวยทูตฝายทหารใน[GET_AUSTRALIA_NEW_ZEALAND_STATUS]รายงานวามีการซอมรบเพิ่มขึ้นอยางมากเมื่อเร็ว ๆ นี้"
 mtg_usa_pacific_pacification.3.a: "เราไมมีทางเลือกนอกจากใชกําลัง"
 mtg_usa_pacific_pacification.3.b: "เราไมอาจทําสงครามได"
 mtg_usa_secure_asia.1.t: "[USA.GetNameDefCap]กดดัน"
 mtg_usa_secure_asia.1.desc: "ประธานาธิบดี[USA.GetLeader]ไดสงผูแทนพิเศษมายังเมืองหลวงเพื่อพบกับ[This.GetLeader]และหารือถึงความสนใจครั้งใหมของ[USA.GetNameDef]ในพื้นที่นี้ เห็นไดชัดวา[This.GetNameDefCap]เปนหัวใจสําคัญของยุทธศาสตร[USA.GetAdjective]ในภูมิภาค ดวยเหตุนี้ จึงมีการแจงรัฐบาลของเราวา[USA.GetNameDef]ไมอาจยอมใหมีรัฐบาลที่ไมเปนมิตรหรือเปนปรปกษใน[This.GetNameDef]ได"
 mtg_usa_secure_asia.1.a: "คุกเขาอยูรอดยอมดีกวา"
 mtg_usa_secure_asia.1.b: "ยืนหยัดตายอยางมีศักดิ์ศรียอมดีกวา"
 mtg_usa_secure_asia.2.t: "[From.GetLeader]ยอมรับ"
 mtg_usa_secure_asia.2.desc: "หลังการเจรจาอยางยืดเยื้อและการรับประกันความปลอดภัยสวนตัวของเขา [From.GetLeader]ไดยอมใหทูตพิเศษของเรามีสิทธิ์ในการปรึกษาหารืออยางกวางขวาง ซึ่งทําใหเรามีอิทธิพลอยางมากเหนือกิจการภายในของพวกเขา"
 mtg_usa_secure_asia.2.a: "ยอดเยี่ยม"
 mtg_usa_secure_asia.3.t: "[From.GetNameDefCap]ทาทาย"
 mtg_usa_secure_asia.3.desc: "มีสารจากรัฐบาล[From.GetAdjective]มาถึง: "อิสรภาพเมื่อไดมาแลว จะตองไมมีวันยอมสละ" หลังจากนั้นก็ไมมีการติดตอใด ๆ อีก และเอกอัครราชทูตของเราใน[From.GetNameDef]ไดรับหนังสือเดินทางคืนใหกลับประเทศ"
 mtg_usa_secure_asia.3.a: "กลาหาญ โงเขลาแนนอน แตกลาหาญ"
 mtg_usa_secure_asia.3.b: "ยังไงพวกเขาก็ไมสําคัญอยูแลว"
 mtg_usa_secure_asia.4.t: "สหรัฐฯ เรียกรองการควบคุมอาณานิคม"
 mtg_usa_secure_asia.4.desc: "ในการแถลงขาวเมื่อเร็ว ๆ นี้ ประธานาธิบดี[USA.GetLeader]ไดประกาศทัศนะทางยุทธศาสตรใหมตอภูมิภาคอินโดจีนและเอเชียตะวันออกเฉียงใตโดยรวม รัฐบาลของเขาจะไมยอมรับสุญญากาศทางอํานาจที่เห็นไดชัดในภูมิภาคนี้อีกตอไป การควบคุมอินโดนีเซียเทาที่มีอยูนั้นออนแอเกินกวาจะประกันความมั่นคงของผลประโยชน[USA.GetAdjective]ในภูมิภาคได และรัฐบาลของเขามุงจะเปลี่ยนแปลงสิ่งนี้ \n\nเมื่อถูก[This.GetLeader]เรียกตัวมาชี้แจงคํากลาวดังกลาว เอกอัครราชทูต[USA.GetAdjective]ไดยื่นหนังสือที่อธิบายจุดยืนของ[USA.GetAdjective]อยางละเอียด ขอเรียกรองเหลานี้ไมตางอะไรกับการสงมอบการควบคุมหมูเกาะอินโดนีเซียใหอยูภายใตการควบคุมของ[USA.GetAdjective]"
 mtg_usa_secure_asia.4.a: "เอาไปไดเลย"
 mtg_usa_secure_asia.4.b: "ขอเสนอที่ไรสาระสิ้นดี"
 mtg_usa_secure_asia.5.t: "[From.GetLeader]ยอมรับขอเสนอของเรา"
 mtg_usa_secure_asia.5.desc: "[From.GetLeader]แถลงตอสื่อมวลชนวันนี้วารัฐบาลของเขาไดลงนามในสนธิสัญญากับ[USA.GetNameDef]วาดวยอธิปไตยรวมในหมูเกาะอีสตอินดีส\n\nสนธิสัญญานี้มีขอกําหนดลับหลายประการที่โดยสาระแลวจะโอนการควบคุมมาใหเราทันทีที่ผูบริหารของเราเขาประจําการ กระทรวงการตางประเทศไดสงเจาหนาที่จํานวนหนึ่งไปยังภูมิภาคแลว"
 mtg_usa_secure_asia.5.a: "ผลลัพธที่ดีที่สุดเทาที่เปนไปได"
 mtg_usa_secure_asia.6.t: "[From.GetNameDefCap]เดินออกจากการเจรจา"
 mtg_usa_secure_asia.6.desc: "การเจรจากับ[From.GetNameDef]ลมสลายแทบจะทันทีที่เริ่มตน คณะรัฐมนตรี[From.GetAdjective]หารือหนังสือของเราไมถึงชั่วโมงกอนจะปฏิเสธโดยทันที รัฐมนตรีวาการกระทรวงการตางประเทศ[From.GetAdjective]แจงเอกอัครราชทูตของเราวา หากขอเสนอไมไดรับการแกไขอยางมีนัยสําคัญ ก็ไมมีอะไรตองหารือ"
 mtg_usa_secure_asia.6.a: "พวกเขามีโอกาสจะแกปญหานี้อยางสันติ แตเลือกที่จะไมทํา"
 mtg_usa_secure_asia.6.b: "พวกเขาเก็บดินแดนไวได...ในตอนนี้"
 mtg_usa_secure_asia.7.t: "[USA.GetNameDefCap]เรียกรองอินโดจีน"
 mtg_usa_secure_asia.7.desc: "ในฐานะสวนหนึ่งของการรุกทางการทูตที่ใหญกวา ประธานาธิบดี[USA.GetLeader]ไดระบุตอสาธารณะวาเวียดนามและอินโดจีนเปนภูมิภาคที่มีความสําคัญยิ่งตอ[USA.GetNameDef] ดังนั้น[USA.GetNameDef]จะมุงเพิ่มบทบาทในพื้นที่นี้\n\nเบื้องหลัง [USA.GetNameDef]ไดแสดงทาทีกาวราวอยางมากเกี่ยวกับอินโดจีน นอกจากกดดัน[SIA.GetNameDef]แลว พวกเขายังเรียกรองสิทธิ์ในการตั้งกองทหารในอาณานิคมของเราและ 'กํากับ' การบริหารอาณานิคม \n\nในทางปฏิบัติ นี่ก็เทากับการยกดินแดนเหลานั้นใหอยูใตการควบคุมของพวกเขา"
 mtg_usa_secure_asia.7.a: "ยกเวียดนามใหพวกเขาไป"
 mtg_usa_secure_asia.7.b: "นี่คือดินแดนสําคัญยิ่งของ[This.GetAdjective]!"
 mtg_usa_secure_asia.8.t: "[From.GetNameDefCap]ยกอินโดจีนให"
 mtg_usa_secure_asia.8.desc: "รัฐบาล[From.GetAdjective]ตกลงตามขอเรียกรองของเรา และสั่งใหการบริหารทองถิ่นใหความรวมมืออยางเต็มที่จนกวาเราจะสงคนของเราเขาประจําการได"
 mtg_usa_secure_asia.8.a: "การเขามามีบทบาทในเวียดนามของเราเปนจุดเริ่มตนของยุคใหมแหงสันติภาพและความรุงเรืองของภูมิภาค"
 mtg_usa_secure_asia.9.t: "[From.GetNameDefCap]ปฏิเสธ"
 mtg_usa_secure_asia.9.desc: "หลังการเจรจาที่ยืดเยื้อและรอนแรงขึ้นเรื่อย ๆ รัฐบาล[From.GetAdjective]ก็ปฏิเสธขอเสนอของเราในที่สุด เอกอัครราชทูตของเราใน[From.GetNameDef]รายงานวาเขาไมสามารถแมแตจะนัดพบกับ[From.GetLeader]ไดอีกตอไป"
 mtg_usa_secure_asia.9.a: "เราจะไมประนีประนอมในเรื่องความมั่นคงของชาติ"
 mtg_usa_secure_asia.9.b: "ยังไงการเขาไปพัวพันในเวียดนามก็เปนความผิดพลาดรายแรงอยูดี"
 mtg_usa_protect_south_america.1.t: "การประชุมสุดยอดดานความมั่นคงอเมริกาใต"
 mtg_usa_protect_south_america.1.desc: "ในการประชุมสุดยอดที่เมืองหลวงของ[USA.GetAdjective] ประธานาธิบดี[USA.GetAdjective] [USA.GetLeader] ไดเรียกรองใหมีโครงสรางความมั่นคงใหมในอเมริกาใต แมจะใชถอยคําทางการทูต แตรัฐบาล[USA.GetAdjective]เห็นไดชัดวามองตนเปนกําลังหลักเบื้องหลังความมั่นคงของทวีป และคาดหวังใหเราทําตามแนวทางทางการเมืองของพวกเขาเปนการตอบแทน\n\n อันที่จริง นักการทูต[USA.GetAdjective]กําลังผลักดันเรื่องนี้อยูเบื้องหลังแลว และแปลงขอเสนอเหลานี้เปนมาตรการที่เปนรูปธรรม เชน สิทธิพิเศษในการปรึกษาหารือและอํานาจยับยั้งสําหรับเอกอัครราชทูตสหรัฐฯ และเฉพาะเอกอัครราชทูตสหรัฐฯ เทานั้น\n\nที่นาหวาดหวั่นยิ่งกวาคือ ตามคํากลาวของประธานาธิบดี การปฏิเสธที่จะยอมรับเรื่องนี้จะถูกมองวาเปนการกระทําที่เปนปรปกษและบอนทําลายเสถียรภาพ ซึ่งจะมีผลที่ตามมาอัน 'นาเสียดายอยางยิ่ง'"
 mtg_usa_protect_south_america.1.a: "ผลที่ตามมาหนักหนาเกินกวาจะแบกรับ"
 mtg_usa_protect_south_america.1.b: "เราจะปกปองอิสรภาพของเรา!"
 mtg_usa_protect_south_america.2.t: "[From.GetNameDefCap]ยอมรับแนวทางของเรา"
 mtg_usa_protect_south_america.2.desc: "ประธานาธิบดี[From.GetLeader]ยอมรับขอเสนอของเราและสั่งใหรัฐมนตรีวาการกระทรวงการตางประเทศ[From.GetAdjective]เจรจาในรายละเอียด"
 mtg_usa_protect_south_america.2.a: "ผูนําที่แทจริง"
 mtg_usa_protect_south_america.3.t: "[From.GetNameDefCap]ปฏิเสธแนวทางของเรา"
 mtg_usa_protect_south_america.3.desc: "คณะผูแทนจาก[From.GetNameDef]รีบออกจากการประชุมสุดยอดเพื่อเดินทางกลับประเทศ เอกอัครราชทูต[From.GetAdjective]ยังปฏิเสธที่จะแสดงความเห็นในเรื่องนี้ โดยอางวายังรอคําสั่งจากรัฐบาลอยู"
 mtg_usa_protect_south_america.3.a: "เราไมอาจปลอยใหพวกนอกคอกเหลานี้คุกคามภูมิภาคได"
 mtg_usa_protect_south_america.3.b: "สงครามมีแตจะเรงใหภูมิภาคไรเสถียรภาพเร็วขึ้น"
 mtg_usa_foreign_support.1.t: "เงินบริจาคเพื่อ[USA.GetNameDef]"
 mtg_usa_foreign_support.1.desc: "สมาชิกระดับนําบางคนของซิลเวอรลีเจียนแหงอเมริกาไดตระเวนบรรยายทั่ว[This.GetNameDef] โดยพูดอยางยืดยาวถึงภัยคุกคามที่ประเทศของพวกเขาเผชิญจากพวกคอมมิวนิสตที่ฝงรากลึกอยูในรัฐบาลทุกระดับ วิถีชีวิตแบบอเมริกันกําลังถูกโจมตี และการสนับสนุนในรูปแบบใดก็ตามที่เรามอบใหไดจะเปนที่ซาบซึ้งอยางยิ่ง และอาจสรางความแตกตางในการตอสูที่นาเศราแตจําเปนซึ่งกําลังจะมาถึง"
 mtg_usa_foreign_support.1.a: "เราตองทําเทาที่ทําได"
 mtg_usa_foreign_support.1.b: "เราไมมีอะไรจะใหเลย"
 mtg_usa_foreign_support.2.t: "[From.GetNameDefCap]อนุมัติการบริจาค"
 mtg_usa_foreign_support.2.desc: "คณะผูแทนที่เราสงไปยัง[From.GetNameDef]รายงานวาการระดมเงินบริจาคประสบความสําเร็จดวยดี มีรายงานวา[From.GetLeader]เองไดบริจาคเปนจํานวนมาก"
 mtg_usa_foreign_support.2.a: "มันจะมีประโยชนในอนาคต"
 mtg_usa_foreign_support.3.t: "[From.GetNameDefCap]ไมอนุญาตใหบริจาค"
 mtg_usa_foreign_support.3.desc: "คณะผูแทนของเราใน[From.GetNameDef]แทบไมประสบความสําเร็จ ตองพูดตอหนาหองวางเปลาและไมสามารถแมแตจะพบกับผูนําทางการเมือง พวกเขากลับมามือเปลา"
 mtg_usa_foreign_support.3.a: "นาเสียดาย"
 mtg_usa_foreign_support.4.t: "อาวุธเพื่อ[USA.GetNameDef]"
 mtg_usa_foreign_support.4.desc: "สมาชิกซิลเวอรลีเจียนจํานวนหนึ่งไดติดตอเราผานชองทางลับเพื่อเจรจาซื้ออาวุธ พวกเขาเชื่ออยางแรงกลาวาประเทศของตนกําลังมุงหนาสูสงครามกลางเมืองกับกลุมคอมมิวนิสตที่บิดเบือนวิถีชีวิตแบบอเมริกัน ซึ่งอาจไดรับการสนับสนุนจากภายนอก \n\nพวกเขาเพียงตองการถวงดุลโอกาสสักเล็กนอย และถามวาเราพอจะแบงยุทโธปกรณใหไดบางหรือไม"
 mtg_usa_foreign_support.4.a: "สงปนไรเฟลไปบาง"
 mtg_usa_foreign_support.4.b: "สงปนใหญสนามไปบาง"
 mtg_usa_foreign_support.4.c: "สงรถถังเกาไปบาง"
 mtg_usa_foreign_support.4.d: "พวกเขาตองเอาตัวรอดเอง"
 mtg_usa_foreign_support.5.t: "[From.GetNameDefCap]สงปนไรเฟล"
 mtg_usa_foreign_support.5.desc: "สายสัมพันธของเรากับ[From.GetNameDef]ไดผลแลว ดวยความเห็นชอบอยางชัดแจงจาก[From.GetLeader] บริษัท[From.GetAdjective]ไดเริ่มขายปนไรเฟลใหเราแบบเงินเชื่อ อาวุธเหลานี้จะถูกเก็บไวในคลังในประเทศที่เปนกลางจนกวาสงครามจะมาถึง"
 mtg_usa_foreign_support.5.a: "มันจะมีประโยชนแน"
 mtg_usa_foreign_support.6.t: "[From.GetLeader]ปฏิเสธการสนับสนุน"
 mtg_usa_foreign_support.6.desc: "ความพยายามจัดหาอาวุธใหมจาก[From.GetNameDef]ของเราถูกปฏิเสธอยางไรมารยาท [From.GetLeader]ประกาศวารัฐบาลของเขาจะไมมีวันยอมใหทรัพยากรของประชาชน[From.GetAdjective]ถูกผลาญไปกับความพยายามโงเขลาเชนนี้"
 mtg_usa_foreign_support.6.a: "ชางหยาบคาย"
 mtg_usa_foreign_support.7.t: "[From.GetNameDefCap]สงปนใหญสนาม"
 mtg_usa_foreign_support.7.desc: "คณะผูแทนของเราใน[From.GetNameDef]รายงานความคืบหนาครั้งสําคัญในความพยายามหาการสนับสนุนใหแกอุดมการณของเรา กองทัพ[From.GetAdjective]ตกลงจะสละปนใหญสนามเกาจํานวนหนึ่งใหแกเรา เพื่อไมใหศัตรูไหวตัว ปนเหลานี้จะถูกเก็บไวในสถานที่ลับจนกวาจะถึงเวลา"
 mtg_usa_foreign_support.7.a: "ยอดเยี่ยม!"
 mtg_usa_foreign_support.8.t: "[From.GetNameDefCap]สงรถถัง"
 mtg_usa_foreign_support.8.desc: "สายลับของเราใน[From.GetNameDef]รายงานความสําเร็จอันนาทึ่ง ระหวางอาหารคํ่าสวนตัว [From.GetLeader]ตกลงจะขายยานเกราะจํานวนหนึ่งใหเราแบบเงินเชื่อ [From.GetNameDefCap]กําลังจับตาดูความเคลื่อนไหวใน[USA.GetNameDef]ดวยความสนใจอยางยิ่ง และยินดีอยางมากที่จะชวยเหลือเราทุกวิถีทาง\n\nอยางไรก็ตาม รัฐบาล[From.GetAdjective]ไมอาจแสดงตัวสนับสนุนฝายที่ยังไมไดครองอํานาจอยางเปดเผย รถถังจึงจะถูกสงมอบเมื่อสงครามปะทุขึ้น"
 mtg_usa_foreign_support.8.a: "ศัตรูของเราจงระวังตัวไว!"
 mtg_usa_foreign_support.9.t: "ซิลเวอรลีเจียนตองการสรางคายฝก"
 mtg_usa_foreign_support.9.desc: "ซิลเวอรลีเจียนแหงอเมริกาไดติดตอเราพรอมคําขอสรางคายฝกจํานวนหนึ่งเพื่อฝกอาสาสมัคร เมื่อสถานการณการเมืองในประเทศบานเกิดเลวรายลงอยางรวดเร็ว พวกเขาตองการใหแนใจวาจะพรอมสําหรับสงครามที่เชื่อวากําลังจะมาถึง"
 mtg_usa_foreign_support.9.a: "เราจะปนพวกเขาใหเปนลูกผูชาย!"
 mtg_usa_foreign_support.9.b: "ไปเลนเปนทหารที่อื่นเถอะ"
 mtg_usa_foreign_support.10.t: "[From.GetNameDefCap]อนุมัติคายฝก"
 mtg_usa_foreign_support.10.desc: "มีสารจากคณะผูแทนของเราใน[From.GetNameDef]มาถึง รัฐบาล[From.GetAdjective]ไดอนุมัติการสรางคายฝกหลายแหงเพื่อฝกยุทธวิธีทหารราบใหแกสมาชิกซิลเวอรลีเจียน พวกเขาจะฝกฝนทักษะไปจนกวาสงครามจะปะทุขึ้น"
 mtg_usa_foreign_support.10.a: "วีรบุรุษ[USA.GetAdjective]ตัวจริง"
 mtg_usa_foreign_support.11.t: "[From.GetNameDefCap]ปฏิเสธที่จะชวยเหลือ"
 mtg_usa_foreign_support.11.desc: "มีสารจากคณะผูแทนของเราใน[From.GetNameDef]มาถึง พวกเขาไมสามารถขออนุญาตสรางคายฝกที่เสนอไวจาก[From.GetLeader]ได และกําลังขอคําสั่งเพิ่มเติม"
 mtg_usa_foreign_support.11.a: "เราจะจําเรื่องนี้ไว"
 mtg_usa_foreign_support.12.t: "ซิลเวอรลีเจียนตองการฝกนักบิน"
 mtg_usa_foreign_support.12.desc: "ฟาสซิสตอเมริกันแหงซิลเวอรลีเจียนไดพบกับ[This.GetLeader]เพื่อขออนุญาตสงอาสาสมัครจํานวนหนึ่งมาฝกเปนนักบิน ผูสมัครจะไดรับการคัดเลือกอยางรอบคอบทั้งดานทักษะและรากฐานทางอุดมการณที่ถูกตองกอนที่เราจะอนุมัติ ดูเหมือนวากองทหารนี้เชื่อวานักบินอาชีพจํานวนมากในกองทัพปจจุบันจะไมยอมรับรัฐบาลฟาสซิสตในสหรัฐฯ และจะสนับสนุนการกอการกบฏ"
 mtg_usa_foreign_support.12.a: "พวกเขาจะตองพิสูจนตัวเองจนไดปกนักบิน"
 mtg_usa_foreign_support.12.b: "เราไมมีเวลาใหเรื่องไรสาระนี้"
 mtg_usa_foreign_support.13.t: "[From.GetNameDefCap]อนุมัติการฝกนักบิน"
 mtg_usa_foreign_support.13.desc: "รัฐบาล[From.GetAdjective]ไดอนุมัติใหสมาชิกซิลเวอรลีเจียนจํานวนเล็กนอยเขารับการฝกเปนนักบิน การเจรจาเพิ่มเติมยังทําใหไดขอตกลงซื้อเครื่องบินขับไลจํานวนเล็กนอยแบบเงินเชื่อ ซึ่งจะสงมอบเมื่อสงครามปะทุขึ้น"
 mtg_usa_foreign_support.13.a: "เราจะรอคอยพวกเขาอยางใจจดใจจอ"
 mtg_usa_foreign_support.14.t: "[From.GetNameDefCap]ปฏิเสธการฝกนักบิน"
 mtg_usa_foreign_support.14.desc: "รัฐบาล[From.GetAdjective]ปฏิเสธที่จะอนุญาตโครงการฝกนักบินที่เราเสนอ โดยอางถึงความกังวลอยางยิ่งตอความเหมาะสมของผูสมัคร"
 mtg_usa_foreign_support.14.a: "ขับเครื่องบินมันไมไดยากขนาดนั้นหรอกใชไหม?"
 us_pilot_training_tt: "ฝูงบินขนาดเล็กที่มีเครื่องบินขับไล 25 ลําจะถูกโอนใหเมื่อสงครามปะทุขึ้น"
 mtg_usa_foreign_support.15.t: "ซิลเวอรลีเจียนตองการจัดหาเรือ"
 mtg_usa_foreign_support.15.desc: "ผูแทนของซิลเวอรลีเจียนเดินทางมาขอความชวยเหลือในการหาเงินทุนสําหรับโครงการตอเรือหลายโครงการใน[USA.GetNameDef] ซิลเวอรลีเจียนซึ่งไดรับการหนุนหลังจากบุคคลในรัฐบาล[USA.GetAdjective] ตองการเก็บเรือเหลานี้ไวนอกบัญชี จึงตองมองหาแหลงเงินทุนอื่น"
 mtg_usa_foreign_support.15.a: "เปนการลงทุนที่คุมคา"
 mtg_usa_foreign_support.15.b: "นั่นคงเปนการสิ้นเปลืองเงินเปลา"
 mtg_usa_foreign_support.16.t: "[From.GetNameDefCap]อนุมัติเงินทุน"
 mtg_usa_foreign_support.16.desc: "รัฐบาล[From.GetAdjective]ไดอนุมัติเงินทุนที่จําเปนในการซื้อเรือ แผนปจจุบันคือซื้อเรือและอาวุธแยกกัน แลวนํามาประกอบเขาดวยกันเมื่อสงครามเริ่มตน กระบวนการนี้คงตองใชเวลาพอสมควรอยางไมตองสงสัย"
 mtg_usa_foreign_support.16.a: "ตอเรือใหเสร็จในวันเดียวไมไดหรอก"
 mtg_usa_foreign_support.17.t: "[From.GetNameDefCap]ปฏิเสธการใหเงินทุน"
 mtg_usa_foreign_support.17.desc: "แมจะไดพบกับ[From.GetLeader]เปนการสวนตัว แตสายลับของเราใน[From.GetNameDef]ก็ไดรับแจงวารัฐบาล[From.GetAdjective]ไมสามารถแบงเงินมาชวยเราซื้อเรือได"
 mtg_usa_foreign_support.17.a: "นาเสียดาย"
 mtg_usa_diplomatic_protest.1.t: "[USA.GetNameDefCap]สงหนังสือประทวง"
 mtg_usa_diplomatic_protest.1.desc: "จดหมายสวนตัวจากประธานาธิบดี[USA.GetAdjective] [USA.GetLeader] มาถึงแลว ประธานาธิบดีประณามดวยถอยคํารุนแรงถึง "การกระทําอันไมอาจยอมรับไดเมื่อเร็ว ๆ นี้" ของเรา ซึ่งบอนทําลายเสถียรภาพของภูมิภาค จดหมายระบุวา[From.GetNameDefCap]ยังคงยึดมั่นในสันติภาพและเสถียรภาพของภูมิภาค และจะจําตองพิจารณามาตรการเพิ่มเติม รวมถึงการปฏิบัติการทางทหาร หากเรายังคงดําเนินแนวทางนี้ตอไป"
 mtg_usa_diplomatic_protest.1.a: "พวกเขาแคขู บางทีนะ"
 mtg_usa_diplomatic_protest.2.t: "[USA.GetNameDefCap]เรียกรองใหโอนดินแดนในทวีปอเมริกา"
 mtg_usa_diplomatic_protest.2.desc: "ในสุนทรพจนตอหนาสภาคองเกรสทั้งสองสภา ประธานาธิบดี[USA.GetLeader]ประกาศวารัฐบาลของเขายังคงยึดมั่นในหลักการมอนโร ซึ่งระบุวาไมควรอนุญาตใหมหาอํานาจภายนอกใดครอบครองดินแดนในทวีปอเมริกา แมในทางปฏิบัติ รัฐบาล[USA.GetAdjective]จะยอมใหประเทศ[USA.GetRulingIdeology]อื่น ๆ ครอบครองดินแดนเล็ก ๆ ได แตก็ไมอาจยอมรับสิ่งที่เขาเรียกวา "การยึดครองที่ผิดกฎหมายและภัยคุกคามโดยตรงตอความมั่นคงของ[USA.GetNameDef]" \n\nไมนานหลังจากนั้น เอกอัครราชทูต[USA.GetAdjective]ไดยื่นหนังสือพรอมคําขาดจากประธานาธิบดีใหสงมอบการควบคุมดินแดนของเราในทวีปอเมริกาแก[USA.GetNameDef]"
 mtg_usa_diplomatic_protest.2.a: "ดินแดนเหลานี้ไมคุมที่จะทําสงคราม"
 mtg_usa_diplomatic_protest.2.b: "บอกประธานาธิบดีใหไปสนใจเรื่องของตัวเอง"
 mtg_usa_diplomatic_protest.3.t: "[From.GetNameDefCap]คืนดินแดน"
 mtg_usa_diplomatic_protest.3.desc: "รัฐบาลของ[From.GetLeader]ตกลงสงมอบการควบคุมดินแดนของพวกเขาในทวีปอเมริกาใหแกเรา โดยอางถึงความตองการที่จะหลีกเลี่ยงการนองเลือด วาเราควรมอบอธิปไตยเต็มที่ใหแกดินแดนเหลานั้นทันทีหรือเก็บไวภายใตการบริหารโดยตรงของเรา ยังเปนประเด็นถกเถียงกันอยูในกระทรวงการตางประเทศ"
 mtg_usa_diplomatic_protest.3.a: "เราจะพิจารณาทางเลือกของเรา"
 mtg_usa_diplomatic_protest.4.t: "[From.GetNameDefCap]ปฏิเสธคําขาด"
 mtg_usa_diplomatic_protest.4.desc: "รัฐบาล[From.GetAdjective]ปฏิเสธอยางไมไยดีที่จะหารือเรื่องอธิปไตยเหนือดินแดนของพวกเขาในทวีปอเมริกา โดยเรียกหนังสือของเราวาเปน "การลวงลํ้ากิจการภายในของ[From.GetNameDef]อยางไมอาจยอมรับได""
 mtg_usa_diplomatic_protest.4.a: "พวกเขาไดรับคําเตือนแลว แตเลือกที่จะไมใสใจ"
 mtg_usa_diplomatic_protest.4.b: "เรื่องนี้แกไมไดดวยความรุนแรง"
 mtg_exile_leader_added.1.t: "ผูนําพลัดถิ่น[exile_nation.GetAdjective]เสนอตัวรับใช"
 mtg_exile_leader_added.1.desc: "หลังการเดินทางอันยาวนานและอันตรายผานดินแดนที่ศัตรูยึดครองและรัฐที่เปนกลางหลายรัฐ ในที่สุด[From.GetName]ก็เดินทางมาถึงเมืองหลวง หลังจากพักฟนเพียงชวงสั้น ๆ [From.GetSheHe]ไดเสนอความสามารถของ[From.GetHerHis]เพื่อรับใชในการตอสูรวมกันของเรา\n\nมีรายงานวา[From.GetSheHe]คอนขางกระตือรือรนที่จะ "กลับไปทําธุรกิจฆาคนและทําลายขาวของอีกครั้ง""
 mtg_exile_leader_added.1.a: "การตอสูของทานยังไมจบ"
 mtg_news.1.t: "สงครามกลางเมืองอเมริกาครั้งที่สอง"
 mtg_news.1.desc: "ความตึงเครียดในสหรัฐอเมริกามาถึงจุดเดือดแลว ดวยความไมพอใจตอนโยบายของประธานาธิบดี[USA.GetLeader] สภานิติบัญญัติของรัฐหลายรัฐในสหรัฐฯ ไดลงมติแยกตัวออกจากสหภาพ\n\nความหวังใด ๆ ที่จะยุติความขัดแยงอยางสันติมลายสิ้น และการสูรบไดปะทุขึ้นตลอดแนวหนา ดูเหมือนวารัฐบาลสวนใหญตัดสินใจอยูขางรัฐบาลอันชอบธรรม แตรายงานตาง ๆ แสดงใหเห็นวามีอาสาสมัครหลั่งไหลเขามาทั่วรัฐที่แยกตัว\n\nเมื่อไมมีฝายใดยอมถอย ผูสังเกตการณตางคาดวาจะเปนการตอสูที่ยาวนานและขมขื่น"
 mtg_news.1.a: "ประวัติศาสตรซํ้ารอย"
 mtg_news.1.b: "การทดลองของอเมริกากําลังลมเหลวตอหนาตอตาเรา"
 mtg_news.1.c: "ความกาวหนาทุกกาวตองแลกมาดวยเลือด"
 mtg_news.1.d: "ดุลอํานาจกําลังเอนเอียงไปทางพวกสุดโตง"
 mtg_news.2.desc: "หลังการประทวงนานหลายเดือนและความตึงเครียดที่เพิ่มขึ้นระหวางผูสนับสนุนประธานาธิบดี[USA.GetLeader]กับฝายตรงขามในคายที่เรียกวา "ฝายพิทักษรัฐธรรมนูญ" นักการเมืองฝายพิทักษรัฐธรรมนูญไดประกาศจัดตั้งรัฐบาลใหมที่บอสตัน ถิ่นกําเนิดของการปฏิวัติอเมริกาครั้งแรก ความแตกแยกในสังคมพาดผานทั้งครอบครัวและสถาบันตาง ๆ ดูเหมือนวากองทัพสวนใหญเล็กนอยตัดสินใจเขาขางฝายพิทักษรัฐธรรมนูญ ขณะที่รัฐบาลมลรัฐทั่วแผนดินใหญสหรัฐอเมริกาตางประกาศความภักดีตอฝายใดฝายหนึ่ง"
 mtg_news.2.a: "ศัตรูภายในก็ยังคงเปนศัตรู"
 mtg_news.2.b: "การตอสูเพื่อจิตวิญญาณของอเมริกาไดปะทุขึ้นอยางเปดเผยแลว"
 mtg_news.2.c: "นี่แหละผลของการเพิกเฉยตอพวกฟาสซิสตนานเกินไป"
 mtg_news.2.d: "สาธารณรัฐอเมริกากําลังตอสูเพื่อความอยูรอด!"
 mtg_news.3.t: "สภาคองเกรสสหรัฐฯ ผานกฎหมายความเปนกลาง"
 mtg_news.3.desc: "ขณะที่ความตึงเครียดทั่วโลกทวีขึ้น สภาคองเกรสสหรัฐฯ กลายเปนเวทีของการถกเถียงอยางเขมขนเกี่ยวกับบทบาทที่[USA.GetNameDef]ควรมีบนเวทีโลก สมาชิกหลายคนกังวลวาประธานาธิบดี[USA.GetLeader]อาจกําลังวางแผนอยางลับ ๆ ที่จะแทรกแซงสงครามในยุโรปหรือเอเชีย บางคนยังจําบทบาทของประเทศในมหาสงครามได และตองการให[USA.GetNameDef]อยูหางจากการพัวพันกับตางประเทศ\n\nดวยความกระตือรือรนที่จะสรางแรงสนับสนุนใหกับโครงการปฏิรูปเศรษฐกิจที่เสนอไว ประธานาธิบดี[USA.GetLeader]จึงลงนามประกาศใชกฎหมายความเปนกลาง ซึ่งจํากัดการคากับชาติที่อยูในภาวะสงครามอยางเขมงวด และหามประธานาธิบดีใหการสนับสนุนใด ๆ แกชาติอื่นโดยเฉพาะ"
 mtg_news.3.a: "ลูกหลานของเราจะไมถูกสงไปรบในสงครามตางแดน"
 mtg_news.3.b: "ปลอยใหยักษหลับตอไป"
 mtg_news.3.c: "ถาอยางนั้นการนิ่งเฉยของพวกเขาก็คือการสนับสนุนพวกฟาสซิสต"
 mtg_news.3.d: "ลองถามชาวเบลเยียมดูวาความเปนกลางปกปองพวกเขาไดดีแคไหนในป 1914"
 mtg_news.3.e: "พวกเขารูถึงความสําคัญของการเปนกลาง"
 mtg_news.3.f: "ความเปนกลางตองมีกําลังหนุนหลัง"
 mtg_news.3.g: "แตพวกเขาก็ยังสนับสนุนเราอยางไมหวั่นไหว!"
 mtg_news.3.g_tt: "การรับประกันที่พวกเขามีตอเรา§Rไม§!ไดรับผลกระทบจากเรื่องนี้!"
 mtg_news.4.t: "[USA.GetNameDefCap]ดําเนินนโยบายแทรกแซง"
 mtg_news.4.desc: "\nขบวนการสันติภาพใน[USA.GetNameDef]ประสบความลมเหลวอยางหนัก เมื่อสภาคองเกรสผานมติรวมสนับสนุนใหประธานาธิบดี[USA.GetLeader]ใชกําลังทหารหากจําเปน เพื่อปกปองผลประโยชนของ[USA.GetAdjective]ทั่วโลก\n\nดูเหมือนวาหลายคนในสภาคองเกรสไดขอสรุปวา ความลังเลของ[USA.GetAdjective]คือสิ่งที่ทําใหมหาสงครามยืดเยื้อยาวนานและคราชีวิตผูคนมากมาย พวกเขาชี้วาภายในไมกี่เดือนหลังทหารสหรัฐฯ เขาสูยุโรป มหาสงครามก็สิ้นสุดลง พวกเขาใหเหตุผลวาการแทรกแซงที่เร็วกวานั้นอาจชวยชีวิตผูคนไดหลายแสนคน"
 mtg_news.4.a: "เราจะสูกับพวกเขาที่โนน เพื่อที่จะไมตองสูกับพวกเขาที่นี่"
 mtg_news.4.b: "พวกเขาควรอยูหาง ๆ จากเรื่องของคนอื่น"
 mtg_news.4.c: "ถูกกลุมอุตสาหกรรมทางทหารยุยงอยูเบื้องหลังแนนอน"
 mtg_news.4.d: "คราวนี้ยักษจะไมหลับอีกแลว"
 mtg_news.5.t: "[USA.GetNameDefCap]ผานกฎหมายอํานาจสงคราม"
 mtg_news.5.desc: "หลังการลงมติดวยการยืนประกาศในหองประชุมวุฒิสภา ประธานาธิบดี[USA.GetLeader]ไดลงนามประกาศใชกฎหมายอํานาจสงครามทันที กฎหมายนี้ใหดุลยพินิจแกตําแหนงประธานาธิบดีในการใชกองทัพมากกวาที่เคยเปนมาอยางมาก บัดนี้ประธานาธิบดีสามารถสงทหารไปปกปองผลประโยชนของ[USA.GetAdjective]ไดทุกเมื่อและทุกที่ที่เห็นวาจําเปน โดยไมจํากัดระยะเวลา\n\nแมประธานาธิบดี[USA.GetLeader]จะอางวาอํานาจใหมนี้จะใชเฉพาะในสถานการณที่เลวรายที่สุดเทานั้น แตแหลงขาวในกระทรวงการตางประเทศอางวานี่เปนเพียงกาวแรกของโครงการขนาดใหญที่จะปรับเปลี่ยนดุลอํานาจของโลก"
 mtg_news.5.a: "บัดนี้คําพูดของเราจะมีนํ้าหนักมากขึ้น"
 mtg_news.5.b: "ตราบใดที่พวกเขาอยูในเขตอิทธิพลของตนก็พอ"
 mtg_news.5.c: "ในที่สุดพวกฟาสซิสตก็เผยโฉมหนาที่แทจริง"
 mtg_news.5.d: "เรายืนอยู ณ รุงอรุณแหงยุคใหม"
 mtg_news.6.t: "กรรมกรมีชัยในสงครามกลางเมืองอเมริกาครั้งที่สอง!"
 mtg_news.6.desc: "\nหลังการนองเลือดนานหลายเดือนและความสูญเสียนับพันนับหมื่นที่ไมอาจนับได สงครามกลางเมืองอเมริกาครั้งที่สองก็สิ้นสุดลง ความพยายามแยกตัวของรัฐทางใตลมเหลว ผูสังเกตการณหลายคนชี้ถึงความคลายคลึงกับสงครามกลางเมืองอเมริกาครั้งแรก อีกครั้งที่แสนยานุภาพทางอุตสาหกรรมของรัฐทางเหนือพิสูจนใหเห็นวาเหนือกวาความมุงมั่นของฝายใต \n\nบัดนี้รัฐบาลของ[USA.GetLeader]ตองเผชิญกับภารกิจอันยากลําบากในการผนวกรัฐที่แยกตัวกลับคืนสู[USA.GetNameDef] เมื่อเกิดการลุกฮือสองครั้งหางกันเพียงราว 80 ป หลายคนในรัฐบาลจึงผลักดันใหลงโทษฝายกบฏอยางรุนแรงกวาหลังสงครามครั้งแรกมาก"
 mtg_news.6.a: "ในที่สุดก็จบลงเสียที"
 mtg_news.6.b: "อีกดินแดนหนึ่งที่ตองปลดปลอยจากแอกของลัทธิบอลเชวิค"
 mtg_news.6.c: "การปฏิวัติเดินหนาสูชัยชนะที่หลีกเลี่ยงไมได!"
 mtg_news.6.d: "เราทําไดเพียงหวังวาฝายที่ถูกตองจะเปนผูชนะ"
 mtg_news.7.t: "[USA.GetNameDefCap]ครองความเปนใหญ!"
 mtg_news.7.desc: "\nหลังการนองเลือดนานหลายเดือนและความสูญเสียนับพันนับหมื่นที่ไมอาจนับได สงครามกลางเมืองอเมริกาครั้งที่สองก็สิ้นสุดลง ประธานาธิบดี[USA.GetLeader]ประกาศวาปฏิบัติการรบหลักไดยุติลงแลว แมกลุมที่หลงเหลือของรัฐบาลกบฏยังคงตอตานอยางไรผล แตสวนใหญถูกกวาดจับในการกวาดลางของรัฐบาล หรือไมก็กลืนหายกลับไปในหมูประชาชน \n\nตามคํากลาวของประธานาธิบดี[USA.GetLeader] สงครามครั้งนี้เห็นไดชัดวาเปนฝมือของอิทธิพลตางชาติที่ตองการบอนทําลายเสถียรภาพและแบงแยกประเทศ เขาสัญญาวาเมื่อถึงเวลา ผูรับผิดชอบจะตองชดใชหนี้แกชาติอเมริกันที่กําลังฟนตัวดวยเลือด"
 mtg_news.7.b: "ความยุติธรรมไดรับชัยชนะ!"
 mtg_news.7.c: "สักวันหนึ่ง กรรมกรอเมริกันจะไดหายใจอยางเสรีอีกครั้ง"
 mtg_news.7.d: "อนาคตของประชาธิปไตยยิ่งไมแนนอนมากขึ้นทุกที"
 mtg_news.8.t: "การผงาดขึ้นของ[Root.GetNameDef]"
 mtg_news.8.desc: "เมื่อเผชิญกับภัยคุกคามระดับโลก รัฐบาลอังกฤษไดออกแถลงการณรวมกับรัฐบาลของ[CAN.GetNameDef] [SAF.GetNameDef] [AST.GetNameDef] และ[NZL.GetNameDef] วาเครือจักรภพแหงชาติอังกฤษจะถูกสถาปนาอยางเปนทางการดวยโครงสรางรัฐบาลแบบสหพันธใหม\n\nดวยการที่รัฐบาล[RAJ.GetAdjective]กอนหนานี้ไดปฏิเสธขอเสนอนี้ และดวยการนําโครงสรางสหพันธมาใชกับเครือจักรภพในขณะนี้ [RAJ.GetNameDef]จึงเลือกที่จะไมเขารวมกับอภิรัฐใหมนี้\n\nถึงกระนั้น ความเคลื่อนไหวนี้ยอมสงผลอยางที่ไมเคยมีมากอนตอเวทีโลกอยางไมตองสงสัย"
