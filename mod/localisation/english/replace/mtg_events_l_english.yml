 mtg_news.10.t: "[HOL.GetName]ยอมจํานนตอเยอรมัน"
 mtg_news.10.desc: "ความพยายามของ[HOL.GetAdjective]ที่จะรักษาความเปนกลางทางการคาลมเหลว และมาตรการลาสุดที่รัฐบาล[HOL.GetAdjective]นํามาใชแสดงใหเห็นชัดวาพวกเขาจะดําเนินนโยบายการคาที่เอื้อประโยชนแก[GER.GetName] ซึ่งมีแนวโนมจะทําใหอิทธิพลของ[GER.GetAdjective]เหนือ[HOL.GetNameDef]เพิ่มขึ้นอยางมาก"
