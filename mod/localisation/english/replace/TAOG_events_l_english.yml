### AST - Union Control Events ###
  AST_union_control_events.1.t: "สายลับตางชาติในสหภาพแรงงานของเรา"
  AST_union_control_events.1.desc: "หนวยขาวกรองไดนํารายงานที่นากังวลมาเสนอตอรัฐบาล สายลับคอมมิวนิสตชาวออสเตรเลียไดติดตอกับผูนําสหภาพแรงงานในทองถิ่น แจกจายเอกสารหัวรุนแรง และปลุกระดมใหคนงานรวมตัวกันตามแนวทางปฏิวัติ ขบวนการนี้ยังมีขนาดเล็กอยูในตอนนี้ แตเจาหนาที่ความมั่นคงเตือนวานี่คือจุดเริ่มตนของเรื่องแบบนี้ทุกครั้ง ตองตัดสินใจกอนที่มันจะหยั่งราก"
  AST_union_control_events.1.a: "เฝาติดตามพวกเขาไว เราจะจับตาดูและรอ"

  AST_union_control_events.4.t: "ผูแทรกซึมคอมมิวนิสตยึดดินแดน[MAL.GetAdjective]"
  AST_union_control_events.4.desc: "รายงานที่นาตกตะลึงมาถึงรัฐบาล ปฏิบัติการที่ประสานงานกันอยางดีไดยึดรัฐหนึ่งของเราและประกาศใหเปนสวนหนึ่งของรัฐบาลปฏิวัติ ความรวดเร็วและการจัดระเบียบของการโจมตีทําใหเกิดคําถามที่นาอึดอัด — หนวยขาวกรองของเราสงสัยวาผูกอการไมไดลงมือเพียงลําพัง และอาจมีมือตางชาตินําทางพวกเขามายังชายฝงของเรา ผูที่หนีรอดจากการยึดครองไมไดยอมจํานน พวกเขารวมตัวกันใหมและจับอาวุธขึ้นสู มุงมั่นที่จะทวงคืนสิ่งที่ถูกพรากไป"
  AST_union_control_events.4.a: "สืบหาใหไดวาใครอยูเบื้องหลัง ผูกอการเหลานี้จะยึดพื้นที่นั้นไวไดไมนาน"
  AST_union_control_events.4.a.tt: "กองกําลังอาสาตอตานคอมมิวนิสตไดรวมตัวและจัดตั้งขึ้นเพื่อตอตานการยึดครองของคอมมิวนิสต"

  AST_union_control_events.5.t: "หายนะใน[MAL.GetAdjective]"
  AST_union_control_events.5.desc: "ปฏิบัติการจบลงดวยหายนะ ทหารของเราไมเคยขึ้นฝงไดเลย พวกเขาถูกหนวยลาดตระเวนฝายภักดีผลักดันกลับ หลงทางในชองแคบ หรือถูกจับกุมกอนจะตั้งที่มั่นได รายละเอียดยังคลุมเครือ แตผลลัพธนั้นชัดเจน ที่แยกวานั้นคือสื่อไดกลิ่นเรื่องนี้แลว ในรัฐสภามีการตั้งคําถามวากองกําลังของเราไปทําอะไรในนานนํ้านั้นกันแน ปฏิกิริยาของสาธารณชนมีแตความตกตะลึงและความอับอาย ไมวาเราหวังจะไดอะไรเพื่อการปฏิวัติ เราก็ตองหาทางอื่นแลว"
  AST_union_control_events.5.a: "ความลมเหลวครั้งรายแรง เราตองหันไปหาชองทางอื่นเพื่อสนับสนุนสหายของเรา"

  AST_union_control_events.3.t: "การปฏิวัติปะทุขึ้นใน[MAL.GetNonIdeologyName]"
  AST_union_control_events.3.desc: "กรรมกรแหง[MAL.GetNonIdeologyName]ไดลุกฮือขึ้นแลว หนวยคอมมิวนิสตที่เราบมเพาะมาตลอดการรณรงคอันยาวนานไดจับอาวุธขึ้นทั่วประเทศ — แตภาพจากสนามกลับนากังวล กองกําลังปฏิวัติไปกระจุกตัวอยูผิดพื้นที่ ถูกแยกออกจากใจกลางคาบสมุทรดวยทะเลและปาดิบ หากไมมีที่มั่นบนแผนดินใหญ รัฐบาลก็เพียงรอใหพวกเขาหมดแรงและทําใหการปฏิวัติอดตายกอนที่จะลุกลาม ออสเตรเลียตองลงมืออยางลับ ๆ และรวดเร็วเพื่อสงนักรบขึ้นบกบนคาบสมุทร และมอบพื้นที่ที่การปฏิวัติจําเปนตองใชเพื่อความอยูรอด"
  AST_union_control_events.3.a: "เราจะปลอยใหการปฏิวัติตายบนชายหาดไมได จงหาที่มั่นใหพวกเขา"

  AST_union_control_events.2.t: "ผูปลุกปนที่[AST.GetAdjective]หนุนหลังบนทองถนนของเรา"
  AST_union_control_events.2.desc: "สายลับของรัฐบาลคอมมิวนิสตออสเตรเลียไดมาถึงเมืองตาง ๆ ของเราแลว พวกเขาไมไดหลบซอน — มีการแจกใบปลิวที่หนาประตูโรงงาน กลาวปราศรัยในจัตุรัสสาธารณะ และสรางเครือขายความสมานฉันทระหวางสายลับออสเตรเลียกับกลุมหัวรุนแรงในทองถิ่น เครือขายอิทธิพลตางชาติที่มีอยูเดิมดูเหมือนจะไดรับการปลุกใหฟนคืนชีพในชั่วขามคืน นี่คือการรณรงคที่มีการประสานงาน และรัฐบาลตองตัดสินใจวาจะรับมืออยางไร กอนที่ความไมพอใจของประชาชนจะกลายเปนสิ่งที่ยากจะควบคุม"
  AST_union_control_events.2.b: "พัฒนาการที่นากังวล"

  ###########################
  ##### ABDACOM EVENTS ######
  ###########################

  ABDA_events.1.t: "คําเชิญสูกองบัญชาการสูงสุดแหงใหม"
  ABDA_events.1.desc: "[FROM.GetNameDef]ไดจัดตั้งกองบัญชาการสูงสุดรวมสําหรับเขตสงครามแปซิฟก และไดเชิญใหเราเขารวม ความริเริ่มนี้ซึ่งรูจักกันในชื่อ ABDACOM มุงรวมกําลังทางเรือ ทางอากาศ และภาคพื้นดินของชาติพันธมิตรที่ปฏิบัติการในภูมิภาคนี้ไวภายใตโครงสรางการบังคับบัญชาเดียวกัน การเปนสมาชิกหมายถึงการประสานงานที่ใกลชิดยิ่งขึ้นกับ[FROM.GetNameDef]และหุนสวนอื่น ๆ ที่รวมในความพยายามนี้แลว เราตองตัดสินใจวาจะตอบรับหรือไม"
  ABDA_events.1.a: "เราจะยืนหยัดไปดวยกัน"
  ABDA_events.1.b: "ขณะนี้เรายังไมอาจใหคํามั่นในเรื่องนี้ได"

  ABDA_events.2.t: "[FROM.GetName] เขารวม ABDACOM"
  ABDA_events.2.desc: "[FROM.GetNameDef] ไดตอบรับคําเชิญของเราใหเขารวมกองบัญชาการสูงสุด ABDACOM แลว กองกําลังของพวกเขาจะปฏิบัติการภายใตโครงสรางการบัญชาการรวม ซึ่งจะเสริมสถานะของเราในเขตสงครามแปซิฟกใหแข็งแกรงยิ่งขึ้น"
  ABDA_events.2.a: "เปนพัฒนาการที่นายินดี"

  ABDA_events.3.t: "[FROM.GetName] ปฏิเสธการเขารวม"
  ABDA_events.3.desc: "[FROM.GetNameDef] ไดปฏิเสธคําเชิญของเราใหเขารวมกองบัญชาการสูงสุด ABDACOM กองกําลังของพวกเขาจะยังไมเขารวมความพยายามรวมกันในขณะนี้ แมวาประตูอาจยังคงเปดอยูก็ตาม"
  ABDA_events.3.a: "นาเสียดาย แตรับทราบ"

  ABDA_events.5.t: "คําเชิญใหเขารวม ABDACOM"
  ABDA_events.5.desc: "[FROM.GetNameDef] ไดยื่นคําเชิญใหเราเขารวมกองบัญชาการอเมริกัน-อังกฤษ-ดัตช-ออสเตรเลีย ABDACOM ไดสถาปนาตนเปนองคกรประสานงานสูงสุดของกองกําลังสัมพันธมิตรในเขตสงครามแปซิฟกแลว โดยรวมกองทัพเรือและกองทัพบกของมหาอํานาจฝายสัมพันธมิตรไวภายใตการบัญชาการเดียว การเปนสมาชิกจะนํากองกําลังของเราเขาสูโครงสรางที่เปนเอกภาพนี้ พรอมทั้งไดรับขาวกรองรวม หลักนิยมที่ประสานกัน และการสนับสนุนเต็มกําลังจากฝายสัมพันธมิตร เราตองตัดสินใจ"
  ABDA_events.5.a: "เราจะยืนหยัดไปดวยกัน"
  ABDA_events.5.b: "ขณะนี้เรายังไมอาจใหคํามั่นในเรื่องนี้ได"

  ABDA_events.4.t: "การปองกันสิงคโปร"
  ABDA_events.4.desc: "เมื่อสิงคโปรไดรับการกําหนดใหเปนหัวใจสําคัญของแนวปองกัน ABDACOM ผูบัญชาการของเราจึงตองตัดสินใจวาจะลงทุนกับปอมปราการของที่นี่อยางไร เราอาจใหความสําคัญกับเสนทางเขาทางทะเลและการปองกันทาเรือ เสริมความแข็งแกรงใหดานบกเพื่อรับมือการบุกทางภาคพื้นดิน หรือกระจายทรัพยากรใหทั้งสองดาน แตละทางเลือกจะกําหนดวาสิงคโปรจะถูกปองกันอยางไรเมื่อขาศึกมาถึง"
  ABDA_events.4.a: "เสริมกําลังเสนทางเขาทางทะเล จุดแข็งของสิงคโปรคือทาเรือ"
  ABDA_events.4.b: "สรางปอมปราการแนวดานบก ภัยคุกคามที่แทจริงจะมาทางภาคพื้นดิน"
  ABDA_events.4.c: "แนวทางที่สมดุล ตองไมมีเสนทางบุกใดถูกปลอยไวโดยไมมีการปองกัน"

  ABDA_fortress_singapore_choice_tt: "เมื่อแผนยุทธศาสตรนี้เสร็จสิ้น จะมีทางเลือกใหวาจะเสริมปอมปราการสิงคโปรอยางไร"
  ABDA_faction_membership_requirement_tt: "สมาชิกฝายที่มีคุณสมบัติจะไดรับคําเชิญใหเขารวม"