### INS News
  taog_news.1.t: "รุงอรุณแหงสหภาพเนเธอรแลนด-อินโดนีเซีย"
  taog_news.1.desc: "เมื่อวานนี้ สมเด็จพระราชินีวิลเฮลมินามีพระราชดํารัสใน [1058.GetName] ประกาศการกอตั้งรัฐสหภาพเนเธอรแลนด–อินโดนีเซียอยางไมมีใครคาดคิด เมื่อมาตุภูมิถูกยึดครอง รัฐบาลพลัดถิ่น[HOL.GetAdjective]และฝายบริหาร[INS.GetAdjective]จึงตกลงจะปกครองรวมกันเปนองคกรเดียวภายใตราชบัลลังก เจาหนาที่ของทั้งสองประเทศระบุวาการตัดสินใจนี้เปนมาตรการจําเปนมากกวาทางเลือก เปนความพยายามอยางสิ้นหวังเพื่อรักษาเอกภาพและอํานาจของราชอาณาจักรไวบนสองทวีป"
  taog_news.1.a: "พัฒนาการที่นาสนใจ"
  taog_news.2.t: "การประกาศเอกราชของอินโดนีเซีย"
  taog_news.2.desc: "วันนี้ [INS.GetLeader] นักปฏิวัติชาว[INS.GetAdjective] กลาวสุนทรพจนในชวา ประกาศเอกราชของสาธารณรัฐอินโดนีเซียที่เพิ่งกอตั้งขึ้น [HOL.GetNameDef] ไมรับรองอธิปไตยของสาธารณรัฐใหมนี้ แตกองกําลังติดอาวุธฝายสาธารณรัฐก็ควบคุมดินแดนบางสวนไวไดโดยพฤตินัยแลว"
  taog_news.2.a: "เรื่องนี้อาจจุดชนวนการเปลี่ยนแปลงครั้งใหญทั่วโลก"


  ############
  ### SIAM ###
  ############
  siam.1.t: "[SIA_phraya_phahon.GetName] พัวพันเรื่องอื้อฉาว"
  siam.1.desc: "[SIA_phraya_phahon.GetName] ถูกกลาวหาวาขายที่ดินของพระมหากษัตริยใหแกขาราชการในราคาตํ่ากวาทองตลาด เรื่องอื้อฉาวนี้ทําใหความชอบธรรมของเขาในสภาผูแทนราษฎรลดลงอยางมาก ดูเหมือนวาอิทธิพลของ [SIA_phraya_phahon.GetName] กําลังจะสิ้นสุดลง"
  siam.1.a: "บางทีนี่อาจเปดทางใหใครบางคน?"

  #Spmgsiradet rebellion historical
  siam.2.t: "การลอบสังหาร [SIA_plaek_phibunsongkhram.GetName] ครั้งที่สาม"
  siam.2.desc: "ขาวจากผูสื่อขาวรอยเตอรประจํากรุงเทพฯ เผยวามีความพยายามวางยาพิษนายกรัฐมนตรีแหงสยาม (นายพิบูลสงคราม) เปนครั้งที่สามในรอบสี่ป\nมีรายงานวาเมื่อสัปดาหที่แลว มีผูลอบผสมยาพิษลงในอาหาร สงผลใหนายพิบูลสงคราม ภริยา และบุตรสาวไดรับพิษชั่วคราว\nรัฐมนตรีวาการกระทรวงการตางประเทศอังกฤษ (ลอรดแฮลิแฟกซ) ไดสงสาสนถึงนายพิบูลสงคราม แสดงความตระหนกตอความพยายามอันขลาดเขลาที่จะปลิดชีพนายกรัฐมนตรี และยินดีที่ทานรอดพนมาได" #https://trove.nla.gov.au/newspaper/article/47990695
  siam.2.a: "ใครกันนะที่ทําเรื่องแบบนี้?"

  siam.3.t: "พระยาทรงสุรเดชถูกเนรเทศ"
  siam.3.desc: "พระยาทรงสุรเดชถูกกลาวหาวาเปนผูบงการเบื้องหลังการลอบสังหาร [SIA_plaek_phibunsongkhram.GetName] หนึ่งครั้งหรือมากกวานั้น รวมทั้งวางแผนกอรัฐประหารลมรัฐบาลของเขา รัฐบาลมีมติใหปลดพระยาทรงสุรเดชออกจากตําแหนงบังคับบัญชา  ถอดยศและบรรดาศักดิ์ ใหออกจากราชการทหารโดยไมไดรับบํานาญ และเนรเทศออกนอกประเทศ\nฝายวิจารณอางวานี่คือการกวาดลางที่แทบไมไดปดบัง ซึ่ง [SIA_plaek_phibunsongkhram.GetName] เปนผูริเริ่มเพื่อกําจัดคูแขงคนสําคัญ แตนั่นยอมเปนการใสรายปายสีอยางชัดเจน"
  siam.3.a: "จุดจบอันนาเศรา"

  siam.4.t: "จับกุมผูฝกใฝพระยาทรงสุรเดช"
  siam.4.desc: "ในชวงเชามืด รัฐบาลไดจับกุมผูตองสงสัยและผูฝกใฝเพิ่มอีก 51 คน ดวยความรวมมือจากกรมตํารวจ ในจํานวนนี้มีพระองคเจารังสิตประยูรศักดิ์ พระยาเทพหัสดิน และพระยาอุดมพงศเพ็ญสวัสดิ์ ทั้งหมดถูกกลาวหาวาสมคบกับพระยาทรงสุรเดชตอตานรัฐ ที่นาจับตาเปนพิเศษคือพระองคเจารังสิตฯ ซึ่งเปนพระบรมวงศานุวงศจะตองเสด็จขึ้นศาล ผูสังเกตการณบางคนสงสัยวาพระองคทรงตกเปนเปาโดยเจาะจง เพื่อสงสารถึงเจานายที่ยังคงอยูใน [THIS.GetName] วาจงอยูในโอวาท มิฉะนั้นจะตองลมสลาย"
  siam.4.a: "เรื่องราวยิ่งซับซอนขึ้น"

  siam.5.t: "กบฏ 18 ศพ"
  siam.5.desc: "จอมพล ป. ไดตั้งศาลพิเศษขึ้นเพื่อพิจารณาคดีผูเกี่ยวของกับการกบฏ 51 คน ในจํานวนนี้ 25 คนถูกตัดสินจําคุกตลอดชีวิต และ 21 คนถูกตัดสินประหารชีวิตดวยการยิงเปา ในจํานวน 21 คนนั้น มี 3 คนไดรับการลดโทษเนื่องจากเคยทําคุณงามความดีไว ไดแก พระองคเจารังสิตประยูรศักดิ์ และพระยาเทพหัสดิน"
  siam.5.a: "เรื่องนี้เปนอันยุติ"

  #Songsuradet rebellion alternative

  siam.6.t: "ความขัดแยงกับพระยาทรงสุรเดช"
  siam.6.desc: "พระยาทรงสุรเดชถูกกลาวหาวาเปนผูบงการการลอบสังหาร [SIA_plaek_phibunsongkhram.GetName] หนึ่งครั้งหรือมากกวานั้น รวมทั้งวางแผนกอรัฐประหารลมรัฐบาลของเขา รัฐบาลมีมติใหปลดพระยาทรงสุรเดชออกจากตําแหนงบังคับบัญชาและเนรเทศ\nอยางไรก็ตาม การจับกุมถูกขัดขวางโดยทหารที่ภักดีตอพระยาทรงสุรเดช ซึ่งประณามวาการจับกุมครั้งนี้มีแรงจูงใจทางการเมือง ขณะนี้รัฐบาลและกลุมทหารของพระยาทรงสุรเดชตกอยูในภาวะชะงักงัน ตางฝายตางไมยอมถอย"
  siam.6.a: "เราจะไมยอมถอย"
  siam.6.b: "เรื่องนี้กลับสงผลราย ถอยออกมากอนเถอะ"

  siam.7.t: "พระยาทรงสุรเดชแสวงหาการสนับสนุนจากกองทัพเรือ"
  siam.7.desc: "ขณะที่การเผชิญหนาอันตึงเครียดระหวางกองกําลังรัฐบาลกับกลุมทหารของพระยาทรงสุรเดชยังคงดําเนินตอไป เจาหนาที่สืบสวนของรัฐบาลเริ่มไดยินขาวลือวากองทัพเรือไดผนึกกําลังกับพระยาทรงสุรเดช โดยมีเจตนาชัดแจงที่จะตอตานอํานาจเผด็จการที่เพิ่มพูนขึ้นของจอมพล ป.\nยังไมหมดเพียงเทานั้น ขาราชบริพารบางคนในสํานักพระราชวังรายงานวา ผูแทนของพระยาทรงสุรเดชไดเขาเฝาเจานายชั้นสูงหลายพระองค ยิ่งทําใหเกิดความหวาดเกรงวาราชวงศจะเขาขางฝายตรงขามดวย"
  siam.7.a: "เราคือรัฐบาล เราจะไมยอมถูกขมขู!"
  siam.7.b: "เรื่องนี้เริ่มเกินควบคุมแลว ถอยออกมากอนเถอะ"

    #alt-hist actual rebellion
   siam.8.t: "กบฏพระยาทรงสุรเดช"
   siam.8.desc: "เมื่อไดรับการสนับสนุนเพียงพอทั้งทางการเมืองและการทหาร กลุมทหารของพระยาทรงสุรเดชซึ่งรวมมือกับกองทัพเรือก็สามารถยึดครองพื้นที่สวนใหญของ [THIS.GetName] ได ในชวงเชามืด เสียงปนดังกึกกองทั่วชานกรุงเทพฯ และทั้งประเทศดูเหมือนกําลังจะเขาสูสงครามกลางเมืองเต็มรูปแบบระหวางรัฐบาลกับพระยาทรงสุรเดช"
   siam.8.a: "รัฐบาลตองอยูรอด"

  #alt-hist actual rebellion
   siam.9.t: "จุดจบของกบฏพระยาทรงสุรเดช"
   siam.9.desc: "การกบฏพังทลายลงแลว และเมื่อพระยาทรงสุรเดชถูกจับกุม สิ่งที่เหลืออยูก็มีเพียงการพิจารณาคดี ซึ่ง ณ จุดนี้เปนเพียงพิธีการเทานั้น การสมคบคิดมิไดพบเพียงในกองทัพบกและกองทัพเรือ แตยังลามไปถึงราชวงศดวย โดยพบวาพระองคเจารังสิตประยูรศักดิ์ทรงสนับสนุนฝายกบฏอยางเปดเผย การกวาดลางผูเห็นตางอยางถึงรากจึงกลายเปนความจําเปน มิใชทางเลือก"
   siam.9.a: "ไดเวลาฟนฟูประเทศ"

   #Attack Indochina

  siam.10.t: "ชัยชนะ!"
  siam.10.desc: "ขาศึกกําลังแตกพาย และชัยชนะของเราดูเหมือนจะแนนอนแลว เมื่อดินแดนอยูในการควบคุมของเราอยางมั่นคง กองกําลังจักรวรรดินิยมเกาคงกําลังขวัญหนีดีฝอ พวกเขาจะแพไดอยางไรกัน? นี่คือสัญญาณแหงการอํานวยพรจากเบื้องบน"
  siam.10.a: "เพื่อ[ROOT.GetName]!"
  siam.10.b: "ที่จริงแลวสถานการณก็ไปไดดีทีเดียว"

  siam.11.t: "การเจาะแนวทางยุทธศาสตรของฝาย[FROM.GetAdjective]"
  siam.11.desc: "ผิดความคาดหมาย กองทัพ[FROM.GetAdjective]ไดใชยุทธวิธีเหนือกวากองกําลังของเรา และยึดครองพื้นที่พิพาทไวได การยึดครองของพวกเขาบั่นทอนอํานาจของเราและทําใหการอางสิทธิ์ของเราเหนือพื้นที่นั้นถูกตั้งคําถาม การสูรบตอไปเสี่ยงที่จะทําใหวินัยและความเชื่อมั่นเสื่อมถอยลงอีก แตการยอมสละดินแดนก็เทากับยอมรับความลมเหลวตอสาธารณชน"
  siam.11.a: "เราตองตัดใจยอมเสียและถอนกําลัง"
  siam.11.b: "เราจะไมละทิ้งการอางสิทธิ์ของเรา!"

  siam.12.t: "[FROM.GetName] ยอมรับความพายแพ"
  siam.12.desc: "การรบของเราประสบความสําเร็จ การตอตานของขาศึกพังทลายลง และ [FROM.GetName] ไดสละการควบคุมดินแดนพิพาทอยางเปนทางการ เพื่อหลีกเลี่ยงความเสียหายที่มากขึ้น ชัยชนะครั้งนี้ยกระดับสถานะของเราและทําใหพรมแดนของเรามั่นคง — อยางนอยก็ในตอนนี้"
  siam.12.a: "พลังของเราเปนที่ประจักษ"

  siam.13.t: "[FROM.GetName] ปฏิเสธการตกลงใด ๆ"
  siam.13.desc: "[FROM.GetName] ปดตกขอเสนอทั้งหมดที่เกี่ยวของกับการยอมเสียดินแดน โดยประณามวาเปนสิ่งที่ยอมรับไมได ผูนําของพวกเขาประกาศวามีเพียงการทําลายรัฐของเราเทานั้นที่จะยุติความขัดแยงนี้ได"
  siam.13.a: "ถาเชนนั้นก็ตามใจ"

  siam.14.t: "[FROM.GetNameDefCap] ประกาศสงครามเบ็ดเสร็จ"
  siam.14.desc: "[FROM.GetNameDefCap] ทิ้งทาทีการเจรจาไปจนหมดสิ้น เจตนาของพวกเขาชัดเจน คือพิชิตและกลืนชาติของเราอยางสมบูรณ สงครามครั้งนี้จะไมตัดสินกันดวยสนธิสัญญา แตดวยชัยชนะเด็ดขาดหรือการลมสลายโดยสิ้นเชิง"
  siam.14.a: "ไมประนีประนอม ไมยอมจํานน"

  siam.15.t: "การบุกของ[SIA.GetAdjective]ชะงักงัน"
  siam.15.desc: "การบุกอยางรวดเร็วของกองกําลัง[SIA.GetAdjective]อาจทําใหเราตั้งตัวไมทัน แตเมื่อการรุกของพวกเขาเริ่มสะดุดภายใตแรงกดดันที่ทวีขึ้น จุดออนของพวกเขาก็ปรากฏชัด สิ่งที่ตั้งใจใหเปนสงครามสายฟาแลบไดกลายเปนความทรมานอันยืดเยื้อสําหรับกองทัพ[SIA.GetAdjective] เราอาจเลือกแสดงความใจกวางและเปดทางออกใหดวยการยอมผอนปรน แตการตัดสินใจอยูที่เราวาความเมตตาจะเปนประโยชนตอเรามากกวาชัยชนะเด็ดขาดหรือไม"
  siam.15.a: "ยื่นขอเสนอผอนปรน"
  siam.15.b: "เรายอมรับไดเพียงชัยชนะเด็ดขาดเทานั้น"

  siam.16.t: "การรุกชะงักงัน"
  siam.16.desc: "การรุกของเราชะงักงัน นั่นไมใชปญหา ปญหาคือขาศึกรูเรื่องนี้ พวกเขาไดยื่นคําขาดมาวา จะยอมแพตอนนี้โดยสูญเสียนอยที่สุด หรือจะรบตอไปโดยตองนองเลือดยิ่งขึ้น ความแตกตางมีเพียงจํานวนศพที่ตองฝงเทานั้น"
  siam.16.a: "ถาเชนนั้นก็สงบศึก"
  siam.16.b: "เราจะไมมีวันยอมจํานน!"

  siam.17.t: "[FROM.GetName] ไมยอมออนขอ"
  siam.17.desc: "[FROM.GetName] ประกาศอยางชัดเจนวายอมเห็นทั้งประเทศลุกเปนไฟ ดีกวายอมยกดินแดนใหเราแมแตสวนเดียว สงครามยังคงดําเนินตอไป"
  siam.17.a: "ก็จงไดสมใจ"

  siam.18.t: "[FROM.GetName] ตองการบีบใหเรายอมจํานน!"
  siam.18.desc: "การดักฟงการสื่อสารของกองบัญชาการระดับสูงฝายขาศึกไดยืนยันสิ่งที่เราหวาดกลัวที่สุด จะไมมีการเจรจาตกลง ไมมีการผอนปรนใด ๆ ที่จะยุติสงครามนี้อยางพอประมาณ พวกเขาตองการไมนอยไปกวาการยอมจํานนโดยสมบูรณของชาติเรา ใหเราตองตกอยูใตท็อปบูตของจักรวรรดินิยมอีกครั้ง หากนั่นคือเปาหมายของพวกเขา เราก็มีคําตอบเพียงหนึ่งเดียว เราไมยอมออนขอ"
  siam.18.a: "[ROOT.GetNameDefCap] ยืนหยัด!"

  siam.19.t: "[SIA.GetName] เรียกรองดินแดนคืน"
  siam.19.desc: "[SIA.GetName] ไดใจจากกระแสชาตินิยมที่เพิ่มสูงขึ้นและความออนแอของเราในภูมิภาคที่พวกเขามองเห็น จึงเรียกรองใหคืนดินแดนที่พวกเขาถือวาเปนสวนหลักของรัฐตน เห็นไดชัดวาพวกเขากําลังพยายามทําเกินกําลังตัวเอง แตดินแดนที่พวกเขาอางสิทธิ์ก็ใชวาจะคุมคาแกการสูรบ ในขณะที่สถานการณโลกกําลังดิ่งสูวันสิ้นโลก"
  siam.19.a: "ไมคุมที่จะตอสูเพื่อมัน"
  siam.19.b: "ฝนไปเถอะ!"

  siam.20.t: "[FROM.GetName] ยอมคืนดินแดน"
  siam.20.desc: "[FROM.GetName] ตัดสินใจคืนดินแดนของเราแลว ไมวาพวกเขาจะยอมรับอธิปไตยของเราเหนือดินแดนเหลานี้ หรือเพียงเพราะถูกกดดันจากฝายอื่น ก็ไมสําคัญ อุดมการณของเรายังคงชอบธรรม"
  siam.20.a: "วันอันยิ่งใหญ!"

  siam.21.t: "[FROM.GetName] ปฏิเสธการคืนดินแดน"
  siam.21.desc: "[FROM.GetName] ปฏิเสธคําเรียกรองของเรา จักรวรรดินิยมเหลานี้ยังยึดติดอยูกับศตวรรษที่แลวดวยกรงเล็บและโซตรวน ไมอาจยอมรับกับตัวเองไดวายุคสมัยของสิ่งที่เรียกวา \"ชาติมหาอํานาจ\"  ไดหมดลงแลว"
  siam.21.a: "เราจะทําใหพวกเขาไดรูสํานึก"

  SIA_sent_bureaucrats_to_us: "ฝกอบรมขาราชการพลเรือนรวมกับเรา"
  SIA_tied_their_currency_to_ours: "ผูกคาเงินไวกับสกุลเงินของเรา"
  SIA_sent_started_cooperative_with_us: "ริเริ่มสหการพัฒนารวมกับเรา"

  siam.22.t: "สงขาราชการ[SIA.GetName]ไปตางประเทศ"
  siam.22.desc: "ขาราชการของเรายังไมเหมาะกับเศรษฐกิจสมัยใหม ขาดการฝกฝนที่จําเปนตอการขับเคลื่อนการเติบโต โชคดีที่มีหลายประเทศซึ่งมีระบบราชการสมัยใหมที่วางรากฐานไวมั่นคง ซึ่งเราสามารถสงพวกเขาไปหาประสบการณได โดยไมตองนําเขาการปกครองของประเทศเหลานั้นมาดวย"
  siam.22.a: "สงไปยัง[ENG.GetName]"
  siam.22.b: "สงไปยัง[JAP.GetName]"

  siam.23.t: "พระราชบัญญัติรักษาเสถียรภาพเงินบาท"
  siam.23.desc: "เงินบาทไมอาจลอยตัวไรหลักยึดไดอีกตอไป ในขณะที่ [ROOT.GetName] กําลังแสวงหาความเปนระเบียบทางการคาและการเงิน บรรดาเจาหนาที่ของเราตางเห็นวาเสถียรภาพทางการเงินจําเปนตองมีหลักยึดภายนอกที่มั่นคง โดยผูกไวกับสกุลเงินที่มีนํ้าหนักพอจะสรางความมั่นใจใหแกพอคา เจาหนี้ และคูคาตางประเทศ ทางเลือกตรงหนาเรามิใชเพียงเรื่องทางเทคนิค แตจะกําหนดทิศทางการคา ลักษณะการพัฒนา และอิทธิพลตางชาติที่จะเขามาครอบงําเศรษฐกิจ[SIA.GetAdjective]"
  siam.23.a: "ผูกไวกับเงินปอนดสเตอรลิง"
  siam.23.b: "ผูกไวกับเงินเยน"

  siam.24.t: "สหการพัฒนา[SIA.GetAdjective]"
  siam.24.desc: "สหการพัฒนา[SIA.GetAdjective]ไดมอบเครื่องมือใหมแกรัฐในการพัฒนาชาติ แตความทะเยอทะยานยังคงกาวลํ้าทุนภายในประเทศ ทั้งทางรถไฟ โรงงาน และกิจการไฟฟา ลวนตองพึ่งพาเงินทุนจากภายนอกหากตองการใหเติบโตไดอยางรวดเร็ว บัดนี้มีสองหนทางอยูตรงหนา การลงทุนจาก[ENG.GetAdjective]เปดทางสูตลาดที่มั่นคง บริษัทที่มีประสบการณ และเกียรติภูมิทางการเงินของลอนดอน สวนการลงทุนจาก[JAP.GetAdjective]ใหคํามั่นถึงความเปนหุนสวนทางอุตสาหกรรมที่ใกลชิดกับมหาอํานาจเอเชียที่กําลังผงาดขึ้นและกระหายจะขยายอิทธิพล ไมวาหนทางใดก็อาจเรงการพัฒนาได แตก็ลวนมาพรอมพันธะผูกพันทั้งสิ้น"
  siam.24.a: "ขอรับการลงทุนจาก[ENG.GetName]"
  siam.24.b: "ขอรับการลงทุนจาก[JAP.GetName]"

  siam.25.t: "การสวรรคตของพระบาทสมเด็จพระปกเกลาเจาอยูหัว"
  siam.25.desc: "พระบาทสมเด็จพระปกเกลาเจาอยูหัวเสด็จสวรรคตแลว อดีตพระมหากษัตริยผูซึ่งพระนามของพระองคเปนดั่งความทรงจําแหงระบอบเกาตลอดหลายปแหงการประทับในตางแดนและความปนปวน บัดนี้ไดเสด็จพนจากกิจการทางโลกเขาสูหนาประวัติศาสตร สําหรับบางคน การสวรรคตของพระองคคือการปดฉากบทสุดทายของการตอสูที่เริ่มขึ้นนับแตสิ้นสุดระบอบสมบูรณาญาสิทธิราชย ทวาอุดมการณที่พระองคทรงเปนสัญลักษณมิไดสูญสิ้นไปพรอมกับพระองค ราชบัลลังกยังคงดํารงอยู ราชวงศยังคงสืบตอ และภารกิจในการฟนฟูเกียรติภูมิและเสถียรภาพใหแก [ROOT.GetName] จะตองดําเนินตอไปในพระนามของในหลวงอานันทมหิดลผูทรงพระเยาว"
  siam.25.a: "ขอพระองคเสด็จสูสวรรคาลัย"

  siam.27.t: "หลอหลอมพระมหากษัตริย"
  siam.27.desc: "ในหลวงอานันทมหิดลยังคงประทับอยูที่[SWI.GetName] หางไกลจากราชอาณาจักรที่พระองคจะทรงครองในวันหนึ่ง อยางไรก็ตาม ระยะทางมิไดทําใหพระองคพนจากอิทธิพลของเรา เราสามารถเลือกพระอาจารย กําหนดวิชาที่จะทรงเนน และสงเสริมพระจริยวัตร เพื่อหลอหลอมพระดําริของพระองคไปสูอนาคตที่เราวาดหวังไวสําหรับ[ROOT.GetNameDef] ไมวาพระองคจะเสด็จกลับมาในฐานะนักรบ นักปราชญ หรือยิ่งกวานั้น ยอมขึ้นอยูกับสิ่งที่พระองคทรงศึกษาในบัดนี้ไมนอย\n\nเพราะแทจริงแลว พระมหากษัตริยจะเปนอื่นใดได หากมิใชสวนขยายของประเทศ?"
  siam.27.a: "ถวายการชี้นําสูวิถีแหงนักปราชญ"
  siam.27.b: "ถวายความรูดานการทหาร"
  siam.27.c: "ถวายการชี้นําดานการบริหารและการสงกําลังบํารุง"
  siam.27.d: "ถวายความรูดานอุตสาหกรรมและการพัฒนา"

  siam.28.t: "พระราชพิธีบรมราชาภิเษกในหลวงอานันทมหิดล"
  siam.28.desc: "ชวงเวลาอันยาวนานแหงการสําเร็จราชการแทนพระองคไดมาถึงจุดสิ้นสุดตามกําหนด ณ กรุงเทพฯ ตอหนาพระบรมวงศานุวงศ พระสงฆ รัฐมนตรี และขาราชการแผนดิน ในหลวงอานันทมหิดลเสด็จขึ้นครองราชยโดยสมบูรณดวยพระองคเอง และทรงรับพระเกียรติอันสมควรแกพระมหากษัตริยแหงราชวงศจักรี พระราชพิธีนี้ประกาศถึงความสืบเนื่องในยามที่เคยมีความปนปวน และระเบียบอันศักดิ์สิทธิ์ในยามที่เคยมีความขัดแยง สําหรับราชอาณาจักร พระราชพิธีบรมราชาภิเษกครั้งนี้มิใชเพียงงานพิธีอันตระการตา แตเปนการประกาศวาราชบัลลังกยังคงดํารงอยู แผนดินมิไดแตกสลายเพราะการลี้ภัยและสงครามกลางเมือง และรัชสมัยใหมไดเริ่มตนขึ้นแลวเหนือ[ROOT.GetNameDef]"
  siam.28.a: "ทรงพระเจริญ"

  siam.29.t: "การศึกษารถถังแบบดั้งเดิม"
  siam.29.desc: "รถถังแบบดั้งเดิมยังคงเปนราชาแหงสนามรบ เราจึงตองเรียนรูจากผูที่เกงที่สุด เพื่อสรางกองรถถังที่ทรงพลัง"
  siam.29.a: "เราจะเรียนรูจากเยอรมนี"
  siam.29.b: "เราจะเรียนรูจากสหรัฐอเมริกา"
  siam.29.c: "เราจะเรียนรูจากสหราชอาณาจักร"
  
  siam.31.t: "การจัดหาเรือดํานํ้า"
  siam.31.desc: "การขยายกองทัพเรือจําเปนตองมีกองเรือดํานํ้า และเราตองตัดสินใจวาจะจัดหาเรือจากที่ใด ทั้ง[ENG.GetNameDef]และ[JAP.GetNameDef]ตางยื่นขอเสนอมา — แตทางเลือกนี้มีนัยสําคัญที่ไปไกลกวาอูตอเรือ"
  siam.31.a: "เรือของ[ENG.GetAdjective]จะรับใชเราไดเปนอยางดี"
  siam.31.b: "เราจะสรางกองเรือดํานํ้าโดยอิงแบบเรือของ[JAP.GetAdjective]"

  siam.32.t: "การจัดหาเรือปองกันชายฝง"
  siam.32.desc: "นานนํ้าชายฝงของเราตองการเรือปองกันที่มีขีดความสามารถ และเราตองเลือกผูจัดหา [ENG.GetNameDefCap]และ[JAP.GetNameDef]ตางพรอมสงมอบ — การตัดสินใจนี้จะกําหนดทั้งกองเรือและความสัมพันธระหวางประเทศของเรา"
  siam.32.a: "เราจะพึ่งพาเรือของ[ENG.GetAdjective]ในการปองกันชายฝง"
  siam.32.b: "เราจะพึ่งพาเรือของ[JAP.GetAdjective]สําหรับกองเรือชายฝง"

  siam.33.t: "การขายบริษัทอูกรุงเทพ"
  siam.33.desc: "การขายบริษัทอูกรุงเทพเสร็จสิ้นแลว และรายไดก็เขาสูทองพระคลังเรียบรอย รัฐบาลตองตัดสินใจวาจะนําเงินกอนนี้ไปใชที่ใดใหเกิดประโยชนสูงสุด — จะบรรเทาภาระทางการเงินของประชาชนทั่วไป เรงความทะเยอทะยานทางเทคนิคของชาติ หรือเสริมสรางความเชื่อมั่นในอนาคตของประเทศ"
  siam.33.a: "ลดภาระภาษีของประชาชน"
  siam.33.b: "นําเงินไปใชในการวิจัยดานนาวี"
  siam.33.c: "ใชลาภลอยนี้สรางความมั่นใจแกประชาชน"

  siam.34.t: "ขอเรียกรองของ[FROM.GetAdjective]ที่ชายฝงของเรา"
  siam.34.desc: "บัดนี้กองกําลัง[FROM.GetAdjective]กําลังกดดัน[ROOT.GetNameDef] และนักการทูตของพวกเขาก็พูดดวยความมั่นใจของผูที่เชื่อวาเรื่องนี้ไดขอยุติแลว พวกเขาเสนอถอยคําเดิม ๆ เรื่องความเปนระเบียบและเสถียรภาพ แตสิ่งที่พวกเขาตองการจริง ๆ คือการเชื่อฟง เราอาจยอมจํานนและรักษารัฐไวในสภาพที่ลดทอนลง เขารวมฝายของพวกเขาโดยหวังวาจะยังคงมีอิสระในการดําเนินการอยูบาง หรือตอบโตแรงกดดันนี้ดวยการทาทายอยางเปดเผยและสั่งใหผูรุกรานออกไปจากชายฝงของเรา"
  siam.34.a: "เราจะเขารวมฝายของพวกเขาและรักษาการปกครองของเราไว"
  siam.34.b: "บอกใหพวกเขาออกไปจากชายฝงของเรา"

  siam.35.t: "[JAP.GetNameDefCap] เรียกรองใหเราพิมพธนบัตรเพิ่ม"
  siam.35.desc: "[JAP.GetNameDefCap] แสดงความคาดหวังอยางชัดเจน: เราตองเพิ่มปริมาณเงินเพื่อตอบสนองความตองการทางเศรษฐกิจของพวกเขา ภาระจะตกอยูกับประชาชนของเราเองผานคาครองชีพที่สูงขึ้น ขณะที่อุตสาหกรรม[JAP.GetAdjective]กลับไดประโยชน เราแทบไมมีชองทางจะปฏิเสธ"
  siam.35.a: "ทําตามขอเรียกรองของ[JAP.GetNameDef]"

  siam.36.t: "[SIA.GetNameDefCap] เรียกรองใหชําระหนี้"
  siam.36.desc: "[SIA.GetNameDefCap] ไดเรียกรองอยางเปนทางการใหเราชดใชคาใชจายที่เกิดจากการพิมพธนบัตรตามที่เราบังคับใหพวกเขาทํา ขอตกลงนั้นเปนประโยชนตอเราอยางมาก แตบัดนี้ถึงเวลาตองชําระบัญชีแลว"
  siam.36.a: "รับผิดชอบหนี้สินและเริ่มชําระคืน"

  siam.37.t: "[JAP.GetNameDefCap] ตกลงชําระหนี้ใหเรา"
  siam.37.desc: "หลังจากที่เราเรียกรอง [JAP.GetNameDef] ไดตกลงที่จะเริ่มชดใชตนทุนทางเศรษฐกิจจากขอตกลงการพิมพธนบัตร การชดเชยนี้จะไมอาจลบลางภาระที่ตกอยูกับประชาชนของเราไดทั้งหมด แตก็จะชวยบรรเทาภาระของทองพระคลังไดบาง"
  siam.37.a: "เปนขอยุติที่เปนธรรม เศรษฐกิจของเราจะฟนตัว"

  siam.38.t: "[SIA.GetName]ขอเจรจาเงื่อนไข"
  siam.38.desc: "รัฐบาล[SIA.GetAdjective]ไดยื่นคําขอเจรจาเงื่อนไขตอเรา บรรดารัฐมนตรีของพวกเขายอมรับในสิ่งที่ปนของเราไดพิสูจนแลว วา[ROOT.GetNameDef]เปนฝายกุมความไดเปรียบในการตอสูครั้งนี้ เราอาจรับการยอมจํานนและบังคับใหพวกเขาอยูใตอํานาจ ผูกพวกเขาเขากับฝายของเราเพื่อใหรัฐบาลของพวกเขารับใชเปาหมายที่กวางไกลกวาของเรา หรือปฏิเสธการประนีประนอมทั้งปวงแลวเดินหนาการรบตอไปจนกวาจะยึดสยามไดทั้งหมด"
  siam.38.a: "รับการยอมจํานนของพวกเขา"
  siam.38.b: "ไม เราจะจบเรื่องนี้ดวยกําลัง"

  siam.39.t: "รัฐบาล[FROM.GetAdjective]ยอมรับการยอมจํานนของเรา"
  siam.39.desc: "[FROM.GetLeader]ตัดสินใจรับการยอมจํานนของเรา ในตอนนี้[ROOT.GetNameDef]รอดพนจากความพินาศที่มากกวานี้ แมจะไมพนจากความอัปยศ กองทัพไดรับคําสั่งใหวางอาวุธ และรัฐบาลยังคงอยูไดก็ดวยความยินยอมของมหาอํานาจที่เขมแข็งกวาเทานั้น เรารักษารัฐไวได แตตองแลกดวยศักดิ์ศรีและอิสระในการกําหนดทางเดินของตนเอง"
  siam.39.a: "เราตองอดทนตอสิ่งที่จําเปน"
 
  siam.40.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอของเรา"
  siam.40.desc: "[FROM.GetLeader]ปฏิเสธทุกขอเสนอที่สงไปจากกรุงเทพฯ ไมมีการยอมจํานนใดที่พวกเขาเห็นวาเพียงพอ และไมมีการประนีประนอมใดที่ยอมรับได ขาศึกตั้งใจจะยุติเรื่องนี้ดวยการพิชิตอยางสิ้นเชิงเทานั้น บัดนี้[ROOT.GetNameDef]ไมเหลือทางเลือกอื่นนอกจากการตอตาน หากพวกเขาไมยอมออกไปจากแผนดินของเราดวยการตกลง ก็ตองขับไลพวกเขาออกไปดวยกําลัง"
  siam.40.a: "ถาเชนนั้น เราจะสู"

  siam.41.t: "[FROM.GetNameDefCap]สงขาราชการมาศึกษาวิธีการของเรา"
  siam.41.desc: "คณะขาราชการ[FROM.GetAdjective]ไดเดินทางมาถึงเพื่อสังเกตการณและศึกษาแนวทางการบริหารราชการและการวิจัยของเรา [FROM.GetNameDefCap]ดูจะมุงมั่นปรับปรุงระบบราชการใหทันสมัยโดยอาศัยความเชี่ยวชาญจากตางประเทศ และไดเลือก[ROOT.GetNameDef]เปนตนแบบ การเยือนครั้งนี้จึงเปนการยอมรับวิธีการของเราโดยปริยาย และเปนโอกาสสรางไมตรีกับอีกรัฐบาลหนึ่ง"
  siam.41.a: "เรายินดีตอนรับคณะของพวกเขา"

  siam.42.t: "[FROM.GetNameDefCap]ผูกคาเงินไวกับสกุลเงินของเรา"
  siam.42.desc: "[FROM.GetNameDefCap]ไดตัดสินใจอยางเปนทางการที่จะผูกคาเงินของตนไวกับสกุลเงินของเรา การตัดสินใจนี้ดึง[FROM.GetNameDef]เขามาใกลวงโคจรทางเศรษฐกิจของเรายิ่งขึ้น และแสดงถึงความไววางใจในเสถียรภาพของสถาบันการเงินของเรา การคาระหวางสองชาตินาจะคาดการณไดมากขึ้น และพอคา[FROM.GetAdjective]จะทําธุรกิจกับพอคาของเราไดสะดวกขึ้น"
  siam.42.a: "นับเปนพัฒนาการที่ดีตอความสัมพันธทางการคาของเรา"

  siam.43.t: "[FROM.GetNameDefCap]ขอการลงทุนเพื่อการพัฒนา"
  siam.43.desc: "[FROM.GetNameDefCap]ไดเชิญวิศวกรและผูเชี่ยวชาญของเราไปชวยพัฒนาประเทศของพวกเขา ความรวมมือนี้เปดโอกาสใหอุตสาหกรรมของเราไดตั้งหลักในภูมิภาค และกระชับความสัมพันธทางเศรษฐกิจระหวางสองรัฐบาล แมเปนขอเสนอเล็กๆ แตในระยะยาวอาจใหผลตอบแทนอยางมาก"
  siam.43.a: "เรายินดีใหความชวยเหลือ"

  siam.44.t: "[FROM.GetNameDefCap]สั่งซื้อเรือดํานํ้า"
  siam.44.desc: "[FROM.GetNameDefCap]ไดสั่งซื้อเรือดํานํ้าที่ตอตามแบบของเรา การขายครั้งนี้สะทอนความเชื่อมั่นอยางมีนัยสําคัญตออุตสาหกรรมทางเรือของเรา และขยายอิทธิพล[FROM.GetAdjective]เขาสูนานนํ้าเอเชียตะวันออกเฉียงใต"
  siam.44.a: "คําสั่งซื้อที่นายินดีสําหรับอูตอเรือของเรา"
  SIA_purchased_submarines_from_us: "ซื้อเรือดํานํ้าจากเรา"

  siam.45.t: "[FROM.GetNameDefCap]เสนอใหรวมพันธมิตร"
  siam.45.desc: "คณะผูแทนจาก[FROM.GetName]ไดเดินทางมาพรอมขอเสนอจาก[FROM.GetLeader] พวกเขาชี้วาพันธมิตรที่แยกกันของเราตางมุงเปาหมายใหญอยางเดียวกัน แตกลับแบงกําลังพล ยุทโธปกรณ และอิทธิพลทางการทูตไปใหกองบัญชาการที่แขงขันกันเอง\n\nหากรวมกําลังของเราเขากับพวกเขา เราจะไดกลุมอํานาจที่แข็งแกรงกวา สามารถประสานยุทธศาสตรไดในแนวรบที่กวางขึ้น ขอตกลงเชนนี้จะเสริมกําลังใหแกเปาหมายรวมกัน แตก็หมายความวาเราตองยอมรับอิทธิพล[FROM.GetAdjective]ตอทิศทางในอนาคตของพันธมิตรดวย"
  siam.45.a: "แนวรวมที่เปนหนึ่งเดียวคือสิ่งจําเปน"
  siam.45.b: "พันธมิตรของเรายังคงเปนของเรา"

  siam.46.t: "[FROM.GetNameDefCap]ยอมรับการรวมพันธมิตร"
  siam.46.desc: "[FROM.GetLeader]ไดยอมรับขอเสนอของเราที่จะรวมพันธมิตรเปนแนวรวมเดียว สิ่งที่เคยเปนกองบัญชาการและชองทางการทูตที่แยกจากกัน บัดนี้กําลังถูกรวมเขาเปนโครงสรางเดียว ทําใหรัฐบาลของเราประสานแผนสงคราม การจัดการเสบียง และนโยบายตางประเทศไดชัดเจนยิ่งขึ้นมาก\n\nขอตกลงนี้ใชวาจะปราศจากความยุงยาก แตความจําเปนที่ตองเปนหนึ่งเดียวกันไดรับชัยชนะ"
  siam.46.a: "เมื่อรวมมือกัน เรายอมแข็งแกรงกวา"

  siam.47.t: "[FROM.GetNameDefCap]ปฏิเสธการรวมพันธมิตร"
  siam.47.desc: "[FROM.GetLeader]ไดปฏิเสธขอเสนอของเราที่จะรวมพันธมิตร รัฐบาลของพวกเขาอางวาความรวมมือยังดําเนินตอไปไดในเรื่องที่ผลประโยชนตรงกัน แตจะไมยอมนําพันธมิตรของตนเขาไปอยูในแนวรวมที่ใหญกวาซึ่งบัญชาการจาก[ROOT.Capital.GetCapitalVictoryPointName]\n\nในตอนนี้ ความแตกแยกระหวางสองกลุมยังคงอยู เราตองมุงสูเปาหมายของเราโดยไมคาดหวังวาพวกเขาจะทุมเทเต็มที่"
  siam.47.a: "ถาเชนนั้น เราจะเดินหนาตามลําพัง"

  siam.48.t: "[SIA.GetName]ขอความชวยเหลือจาก[JAP.GetAdjective]"
  siam.48.desc: "[SIA.GetNameDefCap]ไดรองขอความชวยเหลือทางทหารอยางเปนทางการเพื่อตอตานกองกําลังที่รุกรานประเทศของตน เพื่อเปนการตอบแทน รัฐบาล[SIA.GetAdjective]พรอมจะใหบริษัท[JAP.GetAdjective]ไดสิทธิพิเศษในการเขาถึงทรัพยากรยุทธศาสตร โครงสรางพื้นฐาน และสิทธิทางการคา\n\nการสนับสนุน[SIA.GetName]จะขยายอิทธิพลของเราในเอเชียตะวันออกเฉียงใตและจัดหาวัตถุดิบอันมีคาใหแกจักรวรรดิ แตก็อาจดึงเราใหถลําลึกเขาไปในความขัดแยงของภูมิภาคมากยิ่งขึ้น"
  siam.48.a: "รับขอเสนอของพวกเขา"
  siam.48.b: "[JAP.GetName]ไมอาจแบงทรัพยากรใหได"

  siam.49.t: "[JAP.GetName]ตอบรับคํารองขอของเรา"
  siam.49.desc: "[JAP.GetNameDefCap]ตกลงสนับสนุน[ROOT.GetNameDef]ในการตอสูครั้งนี้ ที่ปรึกษา ยุทโธปกรณ และเสบียงจาก[JAP.GetAdjective]จะเริ่มทยอยมาถึงในไมชา ขณะที่สัมปทานทางเศรษฐกิจไดมอบใหแกบริษัท[JAP.GetAdjective]ตามขอตกลงแลว\n\nแมคณะรัฐมนตรีจะยินดีที่ชาติรอดพนมาได แตหลายคนก็แอบสงสัยอยูเงียบๆ วาเราตองแลกเอกราชไปมากเพียงใดกับความชวยเหลือครั้งนี้"
  siam.49.a: "เราไดพันธมิตรมาแลว"

  SIA_japan_aid_request.4.t: "[JAP.GetName]ปฏิเสธคํารองขอของเรา"
  SIA_japan_aid_request.4.desc: "รัฐบาล[JAP.GetNameDef]ไดปฏิเสธคําขอความชวยเหลือทางทหารของเรา โตเกียวอางวาในเวลานี้จักรวรรดิไมอาจทุมกําลังพลและยุทโธปกรณใหแกการตอสูของเราได\n\nเมื่อปราศจากความชวยเหลือจากตางชาติ [ROOT.GetNameDef]ตองพึ่งพากําลังของตนเองเพื่อเอาชีวิตรอดจากการรุกราน"
  SIA_japan_aid_request.4.a: "ถาเชนนั้น เราจะยืนหยัดตามลําพัง"

  siam_adc.1.t: "[FROM.GetNameDefCap]เรียกรองใหปลดปลอย[?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
  siam_adc.1.desc: "หนังสือแจงอยางเปนทางการไดมาถึงจาก[FROM.GetNameDef] โดย[FROM.GetLeader]ประณามการที่เรายังคงยึดครองประเทศตางๆ ในเอเชียวาเปนการหยามหยันสิทธิในการกําหนดชะตากรรมของตนเองอยางไมอาจยอมรับได สาสนระบุวาเอเชียมิใชรางวัลที่จะนํามาแบงสรรหรือปกครองตามอําเภอใจของตางชาติ และเรียกรองใหเราถอนกําลังทันที พรอมฟนฟูรัฐบาลที่เปนเอกราชใน[?var:SIA_adc_demand_country_to_be_released.GetNameDef]\n\nขอเรียกรองนี้ไมเหลือที่วางใหเขาใจผิด [FROM.GetNameDefCap]คาดหวังใหเราปฏิบัติตาม และการปฏิเสธใดๆ จะถูกจดจําวาเปนการดูหมิ่นชาติของพวกเขาโดยเจตนา"
  siam_adc.1.a: "เราจะปลดปลอยพวกเขา"
  siam_adc.1.b: "พวกเขาจะยังอยูภายใตการยึดครอง"

  siam_adc.2.t: "[FROM.GetNameDefCap]เสนอคืนเอกราชใหแกเรา"
  siam_adc.2.desc: "หลังจากที่[FROM.GetAdjective]ยอมรับขอเรียกรองของ[SIA.GetNameDef]วาดวยอนาคตของ[ROOT.GetNameDef] บัดนี้[FROM.GetLeader]ไดวางคําถามสุดทายไวตรงหนาเรา เจาหนาที่ฝายยึดครองพรอมจะถอนตัวและรับรองรัฐบาล[ROOT.GetAdjective]ที่มีอธิปไตย หากเราเลือกจะยืนหยัดดวยตนเองอีกครั้ง\n\nเอกราชมอบศักดิ์ศรีและอิสระในการกําหนดทางเดิน แตก็หมายถึงการฟนฟูรัฐโดยไมมีหลักประกันจาก[FROM.GetNameDef] การอยูภายใตความคุมครองของพวกเขาตอไปเปนทางที่ถอมตนกวา แตอาจชวยใหประเทศพนจากความวุนวายเพิ่มเติมในยามที่ไมแนนอนเชนนี้"
  siam_adc.2.a: "เราจะยืนหยัดในฐานะชาติที่เปนอิสระ"
  siam_adc.2.b: "เราจะอยูภายใตความคุมครองของ[FROM.GetAdjective]ตอไป"

  siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName]ยอมรับเอกราช"
  siam_adc.3.desc: "รัฐบาลของ[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]ไดเลือกเอกราช เมื่อฝายบริหารการยึดครองกําลังจะถูกยุบ [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]ก็เตรียมกลับคืนสูสถานะชาติที่มีอธิปไตยในประชาคมโลกอีกครั้ง"
  siam_adc.3.a: "อนาคตของพวกเขาจะเปนเชนไร?"

  siam_air.1.t: "โตเกียวสงครูฝกมา"
  siam_air.1.desc: "คณะผูเชี่ยวชาญทางเทคนิคจากญี่ปุนเดินทางมาถึงพรอมครูฝก คูมือ และขอเสนอเรื่องเครื่องบิน นักบินของเราตองตัดสินใจวาความชวยเหลือของพวกเขาจะเกิดประโยชนสูงสุดในดานใด"
  siam_air.1.a: "ฝกการรบแบบเครื่องบินขับไล"
  siam_air.1.b: "ฝกการโจมตีภาคพื้นดิน"
  siam_air.1.c: "ชุดความชวยเหลือแบบกลางๆ อยางระมัดระวัง"
  siam_air.2.t: "จะเคี่ยวนักบินหนักเพียงใด"
  siam_air.2.desc: "การบินเหนือปาดงดิบไมใหอภัยใคร และนักบินมือใหมกําลังตองจายราคาดวยซากเครื่องบินที่พังยับ เราจะเดินหนาตอแลวปลอยใหผูรอดชีวิตกลายเปนนักบินผานศึก หรือสั่งงดบินนักบินที่ไรประสบการณไวกอนจนกวาสภาพจะดีขึ้น?"
  siam_air.2.a: "ยอมรับความสูญเสีย"
  siam_air.2.b: "สั่งงดบินนักบินมือใหม"

  siam_adc.4.t: "[FROM.GetNameDefCap]ปฏิเสธเอกราช"
  siam_adc.4.desc: "แมจะมีโอกาสไดรับอิสรภาพ แตรัฐบาลของ[FROM.GetNameDef]ไดปฏิเสธเอกราชในทันที บรรดารัฐมนตรีของพวกเขาใหเหตุผลวารัฐยังไมพรอมจะแบกรับภาระของอธิปไตยเต็มรูปแบบ และในตอนนี้ขอคงสถานะเดิมไวกอน"
  siam_adc.4.a: "ถาเชนนั้น ขอตกลงเดิมก็ดําเนินตอไป"

  siam_adc.5.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
  siam_adc.5.desc: "[FROM.GetName]แสดงใหเห็นชัดวาขอเรียกรองของเราเปนเรื่องนาขบขันเปนอยางนอย พวกเขาชี้วากองทัพอันกระจอยรอยของเราคือหลักฐานวาเราไมอยูในฐานะที่จะทาทายสถานะเดิมได"
  siam_adc.5.a: "ถาเชนนั้น เราจะแสดงใหพวกเขาเห็น"


  siam_dem_event_count: "ยิ่งเรารอนานเทาไร ฝายทหารก็ยิ่งวางแผนรณรงคใสรายปายสีมากขึ้นเทานั้น"
  siam_dem.2.t: "กองทัพคัดคาน"
  siam_dem.2.desc: "ในการประชุมลับระหวางรัฐมนตรีและนายทหารชั้นผูใหญ ผูแทนฝายทหารไดวิจารณขอเสนอสมุดปกเหลืองอยางรุนแรง เขาโตแยงวาผูรางพูดถึงการชี้นําโดยรัฐ การกระจายความมั่งคั่ง และพันธะทางสังคมอยางเสรีเกินไป ขณะที่ใหความสําคัญนอยเกินไปกับวินัย กรรมสิทธิ์ในทรัพยสิน และภาระที่จะตกแกเหลานายทหารและชนบท ในทัศนะของเขา [ROOT.GetNameDef]ไมอาจสรางขึ้นใหมไดดวยทฤษฎีที่รางไวบนกระดาษ ในขณะที่โลกทวีความอันตรายขึ้นทุกเดือน"
  siam_dem.2.a: "กองทัพไดแถลงจุดยืนแลว"

  siam_dem.3.t: "การตําหนิตอสาธารณะ"
  siam_dem.3.desc: "ขอพิพาทไดหลุดออกจากหองประชุมกรรมาธิการแลว หนังสือพิมพฉบับหนึ่งซึ่งเปนที่รูกันวาเปนกระบอกเสียงของฝายทหารไดตีพิมพบทความประณามสมุดปกเหลืองอยางเต็มที่ โดยกลาวหาวาเปนแผนการของตางชาติที่สวมเสื้อคลุมดวยถอยคํารักชาติ บรรณาธิการเตือนวาขอเสนอนี้ยกความคับแคนทางชนชั้นไวเหนือเอกภาพของชาติ บั่นทอนความเชื่อมั่นในสถาบันที่มีอยู และปลุกความคาดหวังอันอันตรายในหมูกรรมกรและชาวนา พอตกบาย บทความนี้ก็ถูกพูดตอกันในคายทหาร สํานักงาน และรานนํ้าชา สิ่งที่เคยเปนการถกเถียงภายในไดกลายเปนกรณีอื้อฉาวสาธารณะไปแลว"
  siam_dem.3.a: "คําวิจารณแพรกระจายออกไป"

  siam_dem.4.t: "หลวงพิบูลสงครามประณามสมุดปกเหลือง"
  siam_dem.4.desc: "หลวงพิบูลสงครามไดเขารวมวิวาทะอยางเปดเผยและดวยทาทีที่แข็งกราวอยางไมตองสงสัย เมื่อกลาวตอหนาผูสนับสนุนและเหลานายทหาร เขาประณามสมุดปกเหลืองวาโดยเนื้อแทแลวคือคอมมิวนิสต ไมวาฝายที่ปกปองจะเลือกใชถอยคําใดก็ตาม เขาประกาศวาแผนการใดก็ตามที่ยกรัฐไวเหนือกรรมสิทธิ์ในทรัพยสิน สัญญาวาจะเปลี่ยนแปลงสังคมอยางถอนรากถอนโคน และปลุกปนชนชั้นลาง ยอมเปนการนําพิษแดงเขาสู[ROOT.GetNameDef]ภายใตชื่ออื่นนั่นเอง"
  siam_dem.4.a: "เขาไมเหลือขอกังขาใดๆ"

  siam_dem.5.t: "ตองจัดตั้งรัฐบาล"
  siam_dem.5.desc: "ระบอบเกาพังทลายลงแลว และเสรีไทยยืนหยัดอยางผูมีชัย แตชัยชนะยังไมใชการปกครอง และแนวรวมที่รวมตัวกันตอตานจอมพล ป. พิบูลสงครามก็ยังหางไกลจากการตกลงกันวาใครควรสืบทอดอํานาจตอ มีสามชื่อที่ถูกเอยถึงในแวดวงอํานาจ ไดแก ปรีดี พนมยงค มโนธรรมแหงขบวนการตอตาน ควง อภัยวงศ ผูที่ประนีประนอมพอจะไมขัดใจใคร และพลโท ผิน ชุณหะวัณ ซึ่งเหลานายทหารของเขาคาดหวังสวนแบงที่สมควรไดรับ ผูที่เราเลือกยกขึ้นในวันนี้จะกําหนดรูปโฉมของสันติภาพที่จะมาถึง"
  siam_dem.5.a: "ปรีดี พนมยงคจะเปนผูนํา ขบวนการตอตานสมควรไดรับสิ่งนี้"
  siam_dem.5.b: "ควง อภัยวงศ บุคคลที่ทุกฝายยอมรับได"
  siam_dem.5.c: "พลโท ผิน ชุณหะวัณ กองทัพจะตองมีที่ยืนของตน"

  ###################
  #### AUSTRALIA ####
  ###################
  AST_election_events.1.t.a: "UAP ชนะ!"
  AST_election_events.1.t.b: "พรรคแรงงานชนะ!"
  AST_election_events.1.desc.a: "นับคะแนนเสร็จสิ้นแลว พรรคยูไนเต็ดออสเตรเลียชนะการเลือกตั้ง\n\nUAP จะผานชวงจัดตั้งรัฐบาลอันสั้น กอนจะใชเวลาสามปขางหนาพิสูจนวาความไววางใจของพลเมืองที่มอบใหแกผูแทนของพรรคนั้นถูกที่แลว"
  AST_election_events.1.desc.b: "นับคะแนนเสร็จสิ้นแลว พรรคแรงงานออสเตรเลียชนะการเลือกตั้ง\n\nพรรคแรงงานจะผานชวงจัดตั้งรัฐบาลอันสั้น กอนจะใชเวลาสามปขางหนาพิสูจนวาความไววางใจของพลเมืองที่มอบใหแกผูแทนของพรรคนั้นถูกที่แลว"
  AST_election_events.1.a: "ประชาชนไดตัดสินแลว"

  AST_election_events.2.t: "ครึ่งทางสูการเลือกตั้งระดับสหพันธ"
  AST_election_events.2.desc: "$AST_democratic_party_long$ ไดนํา [AST.GetName] มาตั้งแตป 1931 พาประเทศหลุดพนจากภาวะเศรษฐกิจตกตํ่าครั้งใหญและหางไกลจากกระแสตอตานประชาธิปไตย ดวยการนําที่มั่นคง แนวทางอนุรักษนิยม และความภักดีตอบริเตน UAP ไดเสริมฐานสนับสนุนจนมีแนวโนมจะไดเปนรัฐบาลอีกสมัยมากขึ้นเรื่อย ๆ ทวายังมีอีกพรรคหนึ่งที่มีสวนกําหนดเรื่องนี้\n\n$AST_labor_party_long$ ซึ่งยังฟนตัวจากญัตติไมไววางใจที่โคนพรรคลงจากอํานาจในป 1931 กําลังเริ่มกลับมามีแรงสงอีกครั้ง เมื่อเสียงของคอมมิวนิสตถูกปดปาก ชนชั้นแรงงานจึงมองหาแสงนําทางใหม ในพันธกิจที่จะเปนตัวแทนของพลเมืองทุกคน ALP ไดหันมามีมุมมองที่ตางออกไปตอลัทธิจักรวรรดินิยมและความภักดีของออสเตรเลียตอจักรวรรดิ ความตองการภายในประเทศตองมากอน และผลประโยชนตางชาติไมควรไดรับความสําคัญเปนอันดับแรกอีกตอไป\n\nเหลือเวลาอีกหนึ่งปครึ่งกอนการเลือกตั้งระดับสหพันธครั้งหนา หาก UAP ตองการควาชัยอีกครั้ง ผูนําพรรคตองเรงการปฏิรูปเพื่อรักษาแรงสนับสนุนจากสาธารณชน มิฉะนั้นการหาเสียงของ ALP อาจกูสถานะของพรรคกลับคืนมาไดอีกครั้ง"
  AST_election_events.2.a: "UAP จะดําเนินการปฏิรูปครั้งสุดทาย"
  AST_election_events.2.b: "การหาเสียงทั่วออสเตรเลียจะเพิ่มแรงสนับสนุนให ALP"

  AST_election_events.3.t: "$AST_election_season_cat$"
  AST_election_events.3.desc: "$AST_election_season_cat_desc$"
  AST_election_events.3.a: "มันเริ่มตนแลว"

  AST_diplomatic_events.1.t: "สนธิสัญญาไมรุกรานของออสเตรเลีย"
  AST_diplomatic_events.1.desc: "ในฐานะสวนหนึ่งของความพยายามทางการทูตเมื่อไมนานมานี้ รัฐบาลออสเตรเลียตองการลงนามขอตกลงไมรุกรานกับชาติเอเชียที่คัดเลือกไวไมกี่ชาติ และเราคือหนึ่งในนั้น ความพยายามหลีกเลี่ยงสงครามครั้งนี้จะเผยใหเห็นวาเจาหนาที่ออสเตรเลียหลุดโลก หรือจะทําใหพวกเขาดูบริสุทธิ์ใจอยางนานับถือ คําตอบของเราจะมีสวนตัดสิน\n\nเราจะลงนามสนธิสัญญาไมรุกรานกับ [AST.GetName] หรือไม?"
  AST_diplomatic_events.1.a: "ไมตองคิดเลย — ไม"
  AST_diplomatic_events.1.b: "แนนอน เราจะลงนาม"

  AST_diplomatic_events.2.t: "การตอตานกติกาสัญญาแปซิฟก"
  AST_diplomatic_events.2.desc: "คณะผูแทนที่สงไปยัง [FROM.GetNameDef] ไดสงโทรเลขแจงคําตอบของชาตินั้นตอขอเสนอสนธิสัญญาไมรุกรานของเรา เรารูอยูแลววาความริเริ่มนี้ทะเยอทะยานเกินไป การปฏิเสธของ [FROM.GetLeader] จึงแทบไมนาแปลกใจ"
  AST_diplomatic_events.2.a: "อยางนอยก็เปนความพยายามที่นานับถือ"

  AST_diplomatic_events.3.t: "กติกาสัญญาแปซิฟกจงเจริญ"
  AST_diplomatic_events.3.desc: "คณะผูแทนที่สงไปยัง [FROM.GetNameDef] ไดสงโทรเลขแจงคําตอบของชาตินั้นตอขอเสนอสนธิสัญญาไมรุกรานของเรา ที่นายินดีที่สุดคือ [FROM.GetLeader] ชื่นชมความริเริ่มของเราและตกลงประทับตรารับรอง"
  AST_diplomatic_events.3.a: "ยอดเยี่ยม!"

  AST_diplomatic_events.4.t: "ออสเตรเลียขอสิงคโปร"
  AST_diplomatic_events.4.desc: "[AST.GetNameDefCap] ตั้งคําถามมานานถึงความนาเชื่อถือของยุทธศาสตรสิงคโปร เจาหนาที่ออสเตรเลียเห็นวาความสามารถของเราในการเขาชวยเหลือพวกเขาหากเกิดสงครามในแปซิฟกนั้นไมแนนอน การโอนความรับผิดชอบทางทะเลในแปซิฟกให [AST.GetName] จะชวยลดภาระบนบาของอังกฤษ แตก็จะยายภาระเดียวกันนั้นไปไวบนบาของออสเตรเลียแทน\n\nเราจะไวใจไดหรือไมวาการใหออสเตรเลียมีอํานาจควบคุมมากขึ้นจะทําใหรัฐในอารักขาและดินแดนของเราในแปซิฟกอยูในสถานะที่แข็งแกรงกวาการที่สิงคโปรยังอยูกับเรา?"
  AST_diplomatic_events.4.a: "ได เราไวใจได"
  AST_diplomatic_events.4.b: "สิงคโปรจะยังคงเปนของเรา"

  AST_diplomatic_events.5.t: "บริเตนตกลงตามคําขอของเรา"
  AST_diplomatic_events.5.desc: "บริเตนตกลงโอนสิงคโปรใหอยูภายใตอํานาจของออสเตรเลีย ในที่สุดสิ่งนี้จะยุติยุทธศาสตรสิงคโปรที่ลาสมัย และทําใหเรากุมบังเหียนการปองกันของตนเอง"
  AST_diplomatic_events.5.a: "ยุทธศาสตรถูกเขียนขึ้นใหม!"
  AST_diplomatic_events.5.a.tt: "§Yสิงคโปร§!:\n  ถูกควบคุมโดย §Yออสเตรเลีย§!\n  เปนของ §Yออสเตรเลีย§!\n§Yเกาะคริสตมาส§!:\n  ถูกควบคุมโดย §Yออสเตรเลีย§!\n  เปนของ §Yออสเตรเลีย§!\n§Yหมูเกาะโคโคส§!:\n  ถูกควบคุมโดย §Yออสเตรเลีย§!\n  เปนของ §Yออสเตรเลีย§!"

  AST_diplomatic_events.6.t: "บริเตนปฏิเสธคําขอของเรา"
  AST_diplomatic_events.6.desc: "บริเตนปฏิเสธที่จะโอนสิงคโปรใหอยูภายใตอํานาจของออสเตรเลีย สถานะเดิมจะยังคงอยู"
  AST_diplomatic_events.6.a: "ยุทธศาสตรสิงคโปรตองยืนหยัดตอไป"

  AST_diplomatic_events.7.t: "[AST.GetName] ขอความชวยเหลือจากเรา"
  AST_diplomatic_events.7.desc: "[AST.GetNameDefCap] ตองการรับยุทโธปกรณจากพันธมิตรเพื่อใชในสงคราม และขอใหเราชวยจัดการการขนสงที่จําเปน เราจะแบงขบวนเรือลําเลียงให [AST.GetName] ใชไดหรือไม?"
  AST_diplomatic_events.7.a: "ได"
  AST_diplomatic_events.7.b: "ไมได"

  AST_diplomatic_events.8.t: "[USA.GetName] ตกลงตามคําขอของเรา"
  AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] ตกลงแบงขบวนเรือลําเลียงจํานวนหนึ่งมาชวยการสงเสบียงของ [AST.GetName]"
  AST_diplomatic_events.8.a: "จะเปนประโยชนอยางยิ่ง!"

  AST_diplomatic_events.9.t: "[USA.GetName] ปฏิเสธคําขอของเรา"
  AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] ไมมีขบวนเรือลําเลียงเหลือพอจะแบงใหการสงเสบียงของ [AST.GetName]"
  AST_diplomatic_events.9.a: "เราตองจัดการการขนสงเอง"

  AST_diplomatic_events.10.t: "พันธมิตรยามสงคราม"
  AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] ใหคุณคาอยางยิ่งกับการเปนพันธมิตรกับ [USA.GetNameDef] และบัดนี้ขอใหทําใหเปนทางการดวยการรวมกลุมเปนแนวรวมยามสงครามระหวางประเทศ หากผนึกกําลังกัน สองชาติของเราจะชวยเหลือกันไดทั้งในความขัดแยงปจจุบันและอนาคต"
  AST_diplomatic_events.10.a: "เราตองตกลง"
  AST_diplomatic_events.10.b: "[USA.GetNameDefCap] จะแข็งแกรงกวาหากไมมีพวกเขา"

  AST_diplomatic_events.11.t: "พันธมิตรยามสงคราม"
  AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] ตกลงผนึกกําลังแลว ในฐานะสมาชิกของ [AST.GetFactionName] [AST.GetName] และ [USA.GetName] จะชวยเหลือกันทั้งในความขัดแยงปจจุบันและอนาคต"
  AST_diplomatic_events.11.a: "ศัตรูจะตองเกรงกลัวเรา"

  AST_diplomatic_events.12.t: "พันธมิตรยามสงครามที่ถูกปฏิเสธ"
  AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] ปฏิเสธขอเสนอผนึกกําลังของเรา [AST.GetNameDefCap] และ [USA.GetName] จะยังคงแยกกันทําสงครามตางคนตางทํา"
  AST_diplomatic_events.12.a: "เราตองยืนหยัดโดยไมมีพวกเขา"

  AST_diplomatic_events.13.t: "มาตรา 6"
  AST_diplomatic_events.13.desc: "ระหวางกระบวนการรวมอาณานิคมออสเตรเลียเปนสหพันธรัฐ ในทายที่สุดนิวซีแลนดตัดสินใจไมเขารวม อยางไรก็ตาม นับแตนั้นรัฐธรรมนูญออสเตรเลียยังคงกําหนดใหเราเปนหนึ่งในรัฐที่อาจเขารวมเครือรัฐ และเปดชองใหเราเขารวมได\n\nบัดนี้ [AST.GetName] อางวาสถานการณโลกในปจจุบันตองการความเปนเอกภาพ และขอให [NZL.GetName] เขามาอยูภายใตอํานาจของออสเตรเลีย เราจะจัดการลงประชามติในเรื่องนี้หรือไม?" 
  AST_diplomatic_events.13.a: "เราจะจัด"
  AST_diplomatic_events.13.a.tt: "จะมีการลงประชามติ ซึ่งอาจนําไปสูการ§Rผนวก§! §Y[NZL.GetName]§!"
  AST_diplomatic_events.13.b: "ไมมีทางเด็ดขาด!"

  AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] กลายเปนรัฐหนึ่งของออสเตรเลีย"
  AST_diplomatic_events.14.desc: "หลังการลงประชามติที่เพิ่งจัดขึ้น [NZL.GetNameDef] ตัดสินใจใชมาตรา 6 ของรัฐธรรมนูญออสเตรเลีย ชาวนิวซีแลนดเห็นพองวาแผนดินของตนจะปลอดภัยกวาภายใตการปกครองของออสเตรเลีย จึงตกลงเขารวมกับ [AST.GetNameDef]" 
  AST_diplomatic_events.14.a: "ออสเตรเลียขยายตัว"

  AST_diplomatic_events.15.t: "สาธารณชนนิวซีแลนดตอตาน"
  AST_diplomatic_events.15.desc: "หลังการลงประชามติที่เพิ่งจัดขึ้น [NZL.GetNameDef] ตัดสินใจไมใชมาตรา 6 ของรัฐธรรมนูญออสเตรเลีย [NZL.GetNameDefCap] จะยังคงเปนชาติของตนเอง" 
  AST_diplomatic_events.15.a: "ออสเตรเลียจะยังคงเปนอยางเดิม"

  AST_diplomatic_events.16.t: "เจาหนาที่ของ [NZL.GetNameDefCap] ตอตาน"
  AST_diplomatic_events.16.desc: "แมออสเตรเลียจะกดดัน แต [NZL.GetNameDef] ก็ตัดสินใจไมจัดการลงประชามติเพื่อใชมาตรา 6 ของรัฐธรรมนูญออสเตรเลีย [NZL.GetNameDefCap] จะยังคงเปนชาติของตนเอง" 
  AST_diplomatic_events.16.a: "ออสเตรเลียยังคงเปนอยางเดิม"

  AST_diplomatic_events.17.t: "หุนสวนออสเตรเลีย"
  AST_diplomatic_events.17.desc: "ศัตรูกําลังมาจากทางเหนือ และเปนเพียงเรื่องของเวลากอนที่มันจะมาถึงหนาประตูบานเรา อยางนอยเจาหนาที่ออสเตรเลียก็อางเชนนั้น [AST.GetNameDefCap] เสนอใหเรารวมกันเปนกําแพงเดียว โดยควรให [INS.GetName] อยูภายใตอํานาจของออสเตรเลีย หรืออยางนอยที่สุดก็ใหสิทธิ์ผานแดนทางทหาร"
  AST_diplomatic_events.17.a: "ตกลงอยูภายใตอํานาจของออสเตรเลีย"
  AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! จะกลายเปน§Yรัฐหุนเชิด§!ของ §Y[AST.GetNameDefCap]§!"
  AST_diplomatic_events.17.b: "ใหสิทธิ์ผานแดนทางทหาร"
  AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! จะให§Yสิทธิ์ผานแดนทางทหาร§!แก §Y[AST.GetNameDefCap]§!"
  AST_diplomatic_events.17.c: "เราจะไมตกลงทั้งสองอยาง"

  AST_diplomatic_events.18.t: "[INS.GetNameDefCap] ยอมตามคําขอของออสเตรเลีย"
  AST_diplomatic_events.18.desc: "[INS.GetName] ตกลงตามคําขอของเรา ความรวมมือของเราจะสงผลอยางมากตอขีดความสามารถดานการปองกันของทั้งสองชาติ"
  AST_diplomatic_events.18.a: "ยอดเยี่ยม!"

  AST_diplomatic_events.19.t: "[INS.GetNameDefCap] ปฏิเสธ"
  AST_diplomatic_events.19.desc: "[INS.GetName] ปฏิเสธคําขอของเรา ชาติของเราตางตองดูแลการปองกันของตนเอง"
  AST_diplomatic_events.19.a: "[AST.GetNameDefCap] จะฝาฟนความขัดแยงไปโดยไมมีพวกเขา"

  AST_diplomatic_events.20.t: "หมายเรียกเขาคณะรัฐมนตรีสงครามอังกฤษ"
  AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] เรียกนายกรัฐมนตรีออสเตรเลียเขารวมคณะรัฐมนตรีสงครามอังกฤษ สถานการณโลกเลวรายอยางยิ่ง ทําใหบริเตนตองแสวงหายุทธศาสตรรวมและความรวมมือทางทหารกับพันธมิตร\n\nอยางไรก็ตาม ออสเตรเลียก็มีความกังวลของตนเอง เราจะแบงเวลาของนายกรัฐมนตรีบางสวนเพื่อเอาใจอังกฤษไดหรือไม?"
  AST_diplomatic_events.20.a: "[AST.GetLeader] จะเดินทางไปบริเตน"
  AST_diplomatic_events.20.b: "ที่นี่ตองการตัวเขา"
  AST_bwc_count_2: "เปนครั้งที่สองที่ [ENG.GetLeader] ขอให [AST.GetLeader] เขารวม โดยอางวาความรวมมืออยางใกลชิดของเราคือสิ่งที่จะกําหนดผลของการตอสูรวมกันของเรา\n\n"
  AST_bwc_count_3: "[AST.GetLeader] ถูกขอใหขามทะเลไปรักษาความรวมมือในเครือจักรภพอีกครั้ง อยางไรก็ตาม คาดวาจะไมมีคําขอเชนนี้อีกมากนัก ตราบใดที่เราแสดงใหชัดวาผลประโยชนของเราอยูที่ความพยายามรวมกันหรืออยูที่การดูแลกิจการของตนเอง\n\n"
  AST_bwc_accept_effect_tt: "§Yผลจากการตอบรับหมายเรียก 3 ครั้ง:§!"
  AST_bwc_accept_tt: "ตอบรับหมายเรียก §Y[?var:AST_bwc_accept]§!/§Y3§! ครั้ง"
  
  AST_diplomatic_events.22.t: "การมีสวนรวมในคณะรัฐมนตรีสงครามอังกฤษอยางประสบความสําเร็จ"
  AST_diplomatic_events.22.desc: "ตลอดปที่ผานมา นายกรัฐมนตรีออสเตรเลียเขารวมคณะรัฐมนตรีสงครามอังกฤษอยางสมํ่าเสมอ แมบางครั้ง [AST.GetNameDef] เองจะตองจายราคา แตบัดนี้ชาติของเราแข็งแกรงขึ้นจากความรวมมือทางทหารกับอังกฤษ"
  AST_diplomatic_events.22.a: "ทายที่สุดก็คุมคากับราคาที่จายไป"

  AST_diplomatic_events.23.t: "[ENG.GetLeader] ไมแสวงหาอิทธิพลดานสงครามจากออสเตรเลียอีกตอไป"
  AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] เรียกนายกรัฐมนตรีออสเตรเลียเขารวมคณะรัฐมนตรีสงครามอังกฤษหลายครั้ง แตหลังจากถูกปฏิเสธซํ้าแลวซํ้าเลา [ENG.GetLeader] ก็ไมเห็นเหตุผลที่จะทําตอไปอีก"
  AST_diplomatic_events.23.a: "เขาใจได"

  AST_diplomatic_events.24.t: "การเปลี่ยนผูนํา"
  AST_diplomatic_events.24.desc: "นายกรัฐมนตรีออสเตรเลียมีอิทธิพลอยางมากตอความพยายามในสงครามของเครือจักรภพอังกฤษ ระหวางการเยือนลอนดอนเปนประจํา โรเบิรต เมนซีสไดรับความไววางใจจากรัฐมนตรีอังกฤษ ขณะที่ศรัทธาที่พวกเขามีตอนายกรัฐมนตรีของตนเองคอย ๆ จางลง บัดนี้เหลารัฐมนตรีไดกดดันใหผูนําของ [ENG.GetNameDef] ลาออก และใหเมนซีสขึ้นดํารงตําแหนงแทน\n\nแม [AST.GetName] จะเสียนายกรัฐมนตรีไป แตก็ไดความภักดีชั่วนิรันดรจากเจาเหนือหัว โดยมีชาวออสเตรเลียผูกุมบังเหียนบริเตนอยูในขณะนี้คอยดูแล ดินแดนใตสุดของโลกตองการอํานาจมากขึ้น และโรเบิรต เมนซีสคือคนแรกที่ลงชื่อสนับสนุน"
  AST_diplomatic_events.24.a: "สายลมกําลังเปลี่ยนทิศ"

  AST_diplomatic_events.25.t: "ภายใตการปกครองของแคนเบอรรา"
  AST_diplomatic_events.25.desc: "ความตึงเครียดที่เพิ่มขึ้นในหมูชาติแปซิฟกนาเปนหวง และเมื่อบริเตนติดพันอยูกับการรบของตนเอง ความสามารถของเราในการเขาชวยเหลือรัฐในอารักขาก็ดูเปนไปไมได อยางนอย [AST.GetName] ก็อางเชนนั้น\n\nพวกเขาตองการปรับโครงสรางเครือจักรภพอังกฤษใหม ใหชาติในมหาสมุทรแปซิฟกและมหาสมุทรอินเดียบริหารโดยตรงจากแคนเบอรรา เราจะตกลงหรือไม?"
  AST_diplomatic_events.25.a: "เราตกลง ภูมิภาคแปซิฟกจะแข็งแกรงขึ้นภายใตการควบคุมแบบรวมศูนย"
  AST_diplomatic_events.25.b: "ไมมีทางแนนอน!"

  AST_diplomatic_events.26.t: "เครือจักรภพแปซิฟก"
  AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] ตกลงแลว ภูมิภาคแปซิฟกจะแข็งแกรงขึ้นภายใตการควบคุมแบบรวมศูนย ดินแดนแปซิฟกของอังกฤษไดถูกนํามาไวภายใตอํานาจของเราแลว"
  AST_diplomatic_events.26.a: "ชาติแปซิฟกผนึกกําลังกัน"
  
  AST_diplomatic_events.27.t: "บริเตนปฏิเสธคําขอของเรา"
  AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] ไมเห็นดวย ภูมิภาคแปซิฟกจะไมไดรับการเสริมความแข็งแกรงดวยการควบคุมแบบรวมศูนย ดินแดนแปซิฟกจะยังคงอยูภายใตอํานาจของอังกฤษ"
  AST_diplomatic_events.27.a: "ถึงกระนั้น ออสเตรเลียจะยืนหยัดตอไป"

  AST_diplomatic_events.28.t: "[ENG.GetLeader] วางสาย"
  AST_diplomatic_events.28.desc: "ขอพิพาททางโทรเลขระหวางนายกรัฐมนตรีกับ [ENG.GetLeader] ทําใหออสเตรเลียไดกําลังเสริมมาเพียงเล็กนอย แตกลับเพิ่มความขุนเคืองของอังกฤษตอ [AST.GetLeader] ที่ผลักดันผลประโยชนของออสเตรเลีย"
  AST_diplomatic_events.28.a: "ออสเตรเลียตองดูแลการปองกันของตนเอง"

  AST_diplomatic_events.29.t: "บริเตนมาชวยเรา"
  AST_diplomatic_events.29.desc: "หลังออสเตรเลียกดดัน [ENG.GetNameDef] ใหเปดฉากความขัดแยงกับ [JAP.GetName] บริเตนไดตกลงสนับสนุนการกอสรางแนวปองกันของเรา"
  AST_diplomatic_events.29.a: "ยินดีรับความชวยเหลือ แตมันจะไมชวยใหรอดพนสงครามกับญี่ปุน"

  AST_diplomatic_events.30.t: "ออสเตรเลียขอสิทธิ์ในทรัพยากร"
  AST_diplomatic_events.30.desc: "ผูรุกรานลัทธิขยายดินแดนหมายตาอินโดจีนไมเพียงเพราะตัวดินแดน แตยังรวมถึงทรัพยากรที่มีอยูดวย หากความมั่งคั่งเหลานี้ตกไปอยูในมือศัตรู ก็มีแตจะทําใหสงครามยืดเยื้อ ขณะที่หากอยูในมือออสเตรเลียก็อาจชวยยุติสงครามได อยางนอยรัฐบาลออสเตรเลียก็อางเชนนั้น\n\nเราจะตกลงใหสิทธิ์ในทรัพยากรภายในดินแดนของเราแกพวกเขาหรือไม?"
  AST_diplomatic_events.30.a: "เราตกลง"
  AST_diplomatic_events.30.b: "ทรัพยากรเหลานี้ไมใชของ [AST.GetName] ที่จะมาเอาไปเชนกัน"

  AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] ใหสิทธิ์ในทรัพยากรแก [AST.GetName]"
  AST_diplomatic_events.31.desc: "ผูรุกรานลัทธิขยายดินแดนหมายตาอินโดจีนไมเพียงเพราะตัวดินแดน แตยังรวมถึงทรัพยากรที่มีอยูดวย หากความมั่งคั่งเหลานี้ตกไปอยูในมือศัตรู ก็มีแตจะทําใหสงครามยืดเยื้อ ขณะที่หากอยูในมือออสเตรเลียก็อาจชวยยุติสงครามได อยางนอยรัฐบาลออสเตรเลียก็อางเชนนั้น\n\n[ROOT.OVERLORD.GetNameDefCap] ไดตกลงตามคําขอแลว"
  AST_diplomatic_events.31.a: "เรื่องนี้อยูนอกเหนือการควบคุมของเรา"

  AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] ใหสิทธิ์ในทรัพยากร"
  AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap] เห็นดวยวาทรัพยากรของอินโดจีนจะถูกใชไดดีกวาในมือของออสเตรเลีย และไดมอบสิทธิ์ในทรัพยากรใหแกเรา"
  AST_diplomatic_events.32.a: "จะเปนประโยชนอยางยิ่ง"

  AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะใหสิทธิ์ในทรัพยากร"
  AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap] ไมเห็นดวยวาทรัพยากรของอินโดจีนจะถูกใชไดดีกวาในมือของออสเตรเลีย และปฏิเสธที่จะมอบสิทธิ์ในทรัพยากรใหแกเรา"
  AST_diplomatic_events.33.a: "หวังวามันจะไมตกไปอยูในมือศัตรู"

  AST_diplomatic_events.34.t: "[AST.GetNameDefCap] ขอแบงดินแดนแปซิฟก"
  AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] เสนอขอตกลงฉบับหนึ่ง ที่จะยุติความขัดแยงที่อาจเกิดขึ้นระหวางสองชาติของเรากอนที่มันจะมีโอกาสเกิด ดวยการแบงดินแดนแปซิฟกระหวางกัน เราจะวางแผนการขยายตัวในอนาคตไดโดยไมตองกลัววาอีกฝายจะเขามาแทรกแซง"
  AST_diplomatic_events.34.a: "ขอตกลงนี้ดูสมเหตุสมผล"
  AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] จะขยายตัวตามที่เห็นสมควร"

  AST_diplomatic_events.35.t: "แปซิฟกถูกแบงแลว"
  AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] และ [JAP.GetNameDefCap] ไดตกลงกันแลววาแตละประเทศจะขยายตัวเขาไปในดินแดนแปซิฟกสวนใดไดบาง หวังวาสิ่งนี้จะชวยปองกันความขัดแยงที่อาจเกิดขึ้นระหวางสองมหาอํานาจของเราในอนาคต"
  AST_diplomatic_events.35.a: "ตกลงกันเรียบรอยแลว!"

  AST_diplomatic_events.36.t: "แปซิฟกจะแบงตัวเอง"
  AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap] จะไมตกลงแบงดินแดนแปซิฟกระหวางสองชาติของเรา รัฐบาลญี่ปุนจะขยายตัวตามที่เห็นสมควร"
  AST_diplomatic_events.36.a: "ออสเตรเลียก็เชนกัน"

  AST_diplomatic_events.37.t: "การโอนอํานาจเจาเหนือหัว"
  AST_diplomatic_events.37.desc: "ดวยเหตุผลที่ไมมีใครทราบ [AST.GetName] ตัดสินใจโอนการควบคุมดินแดนของเราใหแก [JAP.GetNameDef] มีบางสิ่งอันเปนลางรายกําลังคุกรุนอยูเบื้องหลัง และเปนเพียงเรื่องของเวลากอนที่โลกจะไดรูวามันคืออะไร"
  AST_diplomatic_events.37.a: "เห็นไดชัดวาเราไมมีสิทธิ์มีเสียงในเรื่องนี้"

  AST_diplomatic_events.38.t: "กติกาสัญญานาอูรู"
  AST_diplomatic_events.38.desc: "ผลจากสงครามโลกครั้งที่หนึ่ง ทําใหดินแดนของเยอรมนีหลายแหงในแปซิฟกตกอยูภายใตการควบคุมของออสเตรเลีย แตบัดนี้อาจมีหนทางที่จะไดดินแดนแหงหนึ่งคืนมา นั่นคือเกาะนาอูรู\n\n[AST.GetFascistParty] ยึดถือคานิยมที่สอดคลองกับผลประโยชนของเรา หนึ่งในนั้นคือการแยก [AST.GetName] ออกจาก [ENG.GetNameDef] อยางสมบูรณ เนื่องจากขบวนการนี้ยังมีอิทธิพลจํากัด ผูแทนของพวกเขาจึงขอการสนับสนุนจากเราเพื่อเรงการเติบโต และเมื่อไดอํานาจเต็มที่แลว พวกเขายืนยันวาจะคืนการควบคุมเกาะนาอูรูให โดยมีเงื่อนไขวาเราตองรับประกันเอกราชใหพวกเขาเมื่อพวกเขาแสวงหาอิสรภาพ"
  AST_diplomatic_events.38.a: "ดินแดนของเราจะไดกลับคืนมา!"
  AST_diplomatic_events.38.b: "เราไมอาจผูกมัดตัวเองกับคําสัญญาลม ๆ แลง ๆ ได"

  AST_diplomatic_events.39.t: "[GER.GetNameDefCap] ตกลงตามกติกาสัญญานาอูรู"
  AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] และ [AST.GetFascistParty] ไดตกลงกันในเปาหมายรวม คือ [AST.GetName] จะตองไดรับเอกราช เนื่องจากอิทธิพลทางการเมืองของ [AST.GetFascistParty] ในปจจุบันยังมีจํากัด [GER.GetNameDef] จะใหเงินทุนสนับสนุนเพื่อเรงการเติบโต และเมื่ออิทธิพลของเราไมถูกจํากัดอีกตอไป ขอตกลงก็จะไดรับการปฏิบัติอยางสมบูรณ"
  AST_diplomatic_events.39.a: "ยอดเยี่ยม!"

  AST_diplomatic_events.40.t: "กติกาสัญญานาอูรูพังทลาย"
  AST_diplomatic_events.40.desc: "[GER.GetNameDef] ไมอาจผูกมัดตนกับคําสัญญาที่ยังทําใหเปนจริงไมได จึงปฏิเสธที่จะสนับสนุนการกาวขึ้นสูอํานาจของเรา กติกาสัญญานาอูรูจบลงกอนที่จะไดเริ่มเสียอีก และความทะเยอทะยานของ [AST.GetFascistParty] ก็จะตกอยูบนบาของเราแตเพียงผูเดียว"
  AST_diplomatic_events.40.a: "[AST.GetFascistParty] จะเดินหนาตอโดยไมมีการสนับสนุนจากเยอรมนี"

  AST_diplomatic_events.41.t: "นาอูรูกลับคืนสูมือเยอรมนี"
  AST_diplomatic_events.41.desc: "เมื่อไดอํานาจเต็มที่แลว [AST.GetFascistParty] ก็รักษาคํามั่นและทําตามขอตกลงในสวนของตน นาอูรูถูกคืนใหแก [GER.GetNameDef] และเราจะรับประกันเอกราชของออสเตรเลีย"
  AST_diplomatic_events.41.a: "เราจะทําเชนนั้น"

  AST_diplomatic_events.42.t: "[AST.GetFascistParty] ผิดคําสัญญา"
  AST_diplomatic_events.42.desc: "คําสัญญามีจุดออนรายแรงอยูขอหนึ่ง นั่นคือมันถูกทําลายได เมื่อกุมบังเหียนอํานาจแลว ผูนําของ [AST.GetFascistParty] ตัดสินใจวาไมเพียงนาอูรูจะเปนของพวกเขาตอไป แตเกาะอื่น ๆ ในแปซิฟกก็เปนของพวกเขาที่จะยึดเอาดวย\n\nดินแดนแปซิฟกเดิมของเราจะยังหางไกลจากการเปนของเราเหมือนกอนลงนามกติกาสัญญานาอูรู และหากเราตองการใหเปนอยางอื่น ก็ตองมีสงคราม"
  AST_diplomatic_events.42.a: "อนาคตจะเปนตัวกําหนดผลที่ตามมา"

  AST_diplomatic_events.43.t: "[AST.GetNameDefCap] ขอเอเชียตะวันออกเฉียงใต"
  AST_diplomatic_events.43.desc: "[AST.GetName] ใหเหตุผลวาการขยายตัวขึ้นไปทางเหนือของพวกเขาจะชวยเพิ่มอิทธิพลรวมของเราเหนือการทูตและความขัดแยงในเอเชียตะวันออกเฉียงใต แมจะไมใชการเรียกรองอยางโจงแจง แต [AST.GetLeader] ก็บอกเปนนัยวาจะไมยอมรับการปฏิเสธ"
  AST_diplomatic_events.43.a: "ในเมื่อความสนใจของเราอยูที่อื่น นี่คงเปนทางที่ดีที่สุด"
  AST_diplomatic_events.43.b: "ไมวาอยางไร พวกเขาก็จะไดรับการปฏิเสธ"

  AST_diplomatic_events.44.t: "การโอนเอเชียตะวันออกเฉียงใต"
  AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap] ตัดสินใจอยางชาญฉลาดที่จะโอนดินแดนในเอเชียตะวันออกเฉียงใตของตนใหแกเรา เมื่อพรมแดนของออสเตรเลียขยายออกไป อิทธิพลของเราก็ขยายตามไปดวย เปนเพียงเรื่องของเวลากอนที่โลกทั้งใบจะอยูในกํามือของเรา"
  AST_diplomatic_events.44.a: "อนาคตดูสดใส"

  AST_diplomatic_events.45.t: "เอเชียตะวันออกเฉียงใตคงอยูอยางเดิม"
  AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] ปฏิเสธที่จะโอนดินแดนในเอเชียตะวันออกเฉียงใตของตนใหแกเรา ถึงกระนั้น ความนาดึงดูดของการควบคุมภูมิภาคนี้ยังคงชัดเจนสําหรับเรา และแมมันจะไมไดเปนของเราดวยการรองขอ แตมันก็อาจยังตกเปนของเราได"
  AST_diplomatic_events.45.a: "ใช มันอาจเปนเชนนั้น"

  #AST_diplomatic_events.46.t was removed

  AST_diplomatic_events.47.t: "การแบงเบาภาระ"
  AST_diplomatic_events.47.desc: "แมจะเพิ่งแยกตัวออกจากเครือจักรภพอังกฤษ แต [AST.GetName] ก็เสนอความรวมมือทางทหาร [AST.GetName] อางวาการแบงเบาภาระจะเปนประโยชนตอ [ENG.GetNameDefCap] เมื่อพิจารณาวากําลังของพวกเขากระจายบางไปทั่วโลกเพียงใด"
  AST_diplomatic_events.47.a: "เราตกลง"
  AST_diplomatic_events.47.b: "เราจะพึ่งพาตนเอง"

  AST_diplomatic_events.48.t: "กติกาสัญญาอังกฤษ-ออสเตรเลีย"
  AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] ตกลงลงนามสนธิสัญญาไมรุกราน วางรากฐานสําหรับความรวมมือทางทหาร"
  AST_diplomatic_events.48.a: "นี่คือบทใหมของความสัมพันธระหวางเรา"

  AST_diplomatic_events.49.t: "กติกาสัญญาที่ไมไดลงนาม"
  AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] ปฏิเสธที่จะลงนามสนธิสัญญาไมรุกราน ความพยายามของเราที่จะสรางความรวมมือทางทหารระหวางสองชาติจึงลมเหลว และเราตองรุกคืบออกไปภายนอกตามลําพัง"
  AST_diplomatic_events.49.a: "เราตองทําเชนนั้นจริง ๆ"

  AST_diplomatic_events.50.t: "กองรักษาการณแปซิฟกของออสเตรเลีย"
  AST_diplomatic_events.50.desc: "แมการปกปองเอเชียตะวันออกเฉียงใตและแปซิฟกจะเปนผลประโยชนของบริเตน แตภูมิภาคนี้ก็อยูหางไกลจากเกาะอังกฤษ [FROM.GetName] เขาใจเรื่องนี้ดี เพื่อแลกกับการสนับสนุนดานเสบียงจากเรา พวกเขาเสนอจะรับหนาที่บัญชาการการปองกันดินแดนนี้ เพื่อใหเราหันความสนใจไปที่อื่นได"
  AST_diplomatic_events.50.a: "ยินดีรับความชวยเหลือจาก [FROM.GetName]"
  AST_diplomatic_events.50.b: "ภูมิภาคนี้ไมไดไกลขนาดนั้น"

  AST_diplomatic_events.51.t: "กองรักษาการณแปซิฟกของ [ENG.GetNameDefCap]"
  AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap] ตกลงแลว นานนํ้าเอเชียตะวันออกเฉียงใตจะไดรับการปกปองโดยเรา เพื่อแลกกับเชื้อเพลิงที่อังกฤษสงมาให [ROOT.GetName] จะทุมเทความพยายามเพื่อเพิ่มความเปนเจาทางทะเลในนานนํ้าใกลเคียงของเรา"
  AST_diplomatic_events.51.a: "นานนํ้าจะเปนของเรา"

  AST_diplomatic_events.52.t: "กองรักษาการณแปซิฟกของออสเตรเลียเอง"
  AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap] ไมเห็นดวย พวกเขาไมตองการความชวยเหลือในการปองกันนานนํ้าเอเชียตะวันออกเฉียงใต อยางไรก็ตาม ไมวาจะมีการสนับสนุนจากอังกฤษหรือไม [ROOT.GetName] จะทุมเทความพยายามเพื่อเพิ่มความเปนเจาทางทะเลในนานนํ้าใกลเคียง"
  AST_diplomatic_events.52.a: "นานนํ้าจะเปนของเรา"

  AST_diplomatic_events.53.t: "ขับวีชีออกจากแอฟริกา"
  AST_diplomatic_events.53.desc: "[AST.GetName] สงสัยวาการลมสลายหรือการยอมรวมมือของฝรั่งเศสวีชีเปนหนึ่งในเปาหมายหลักของ [ENG.GetNameDef] จึงเสนอตัวเขารวมไลลาอาณานิคมฝรั่งเศสในแอฟริกาจนกวาวีชีจะสยบ แมอาจมีวาระซอนเรนอยูเบื้องหลังขอเสนอนี้ แตไมตองสงสัยเลยวาการที่ฝายพันธมิตรมีกําลังในภูมิภาคมากขึ้นจะเปนประโยชนตอเรา\n\nหากเราอนุญาต [AST.GetName] จะเริ่มการหารือกับฝรั่งเศสวีชี เพื่อขอโอนอาณานิคมอยางสันติและจัดตั้งกองรักษาการณของออสเตรเลีย"
  AST_diplomatic_events.53.a: "เรายินดีรับการสนับสนุนจากพวกเขา"
  AST_diplomatic_events.53.b: "เสี่ยงเกินไปที่ [AST.GetName] จะใชมันเปนเครื่องตอรองกับเรา"

  AST_diplomatic_events.54.t: "เขาชวยเหลือพวกเขา"
  AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap] เห็นดวย การที่ฝายพันธมิตรมีกําลังในแอฟริกามากขึ้นจะเปนประโยชนตอเครือจักรภพ\n\nเราจะเริ่มการหารือกับฝรั่งเศสวีชี เพื่อขอโอนอาณานิคมอยางสันติและจัดตั้งกองรักษาการณของออสเตรเลีย"
  AST_diplomatic_events.54.a: "เราจะทําเชนนั้น"

  AST_diplomatic_events.55.t: "จะไดรับอนุญาตหรือไมก็ตาม"
  AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap] ปฏิเสธความชวยเหลือของออสเตรเลียในแอฟริกา และจะจัดการเรื่องฝรั่งเศสวีชีเอง ถึงกระนั้น ความทะเยอทะยานของเราก็ไมอาจเบี่ยงเบนไดงาย ๆ\n\nการที่ออสเตรเลียควบคุมดินแดนแอฟริกาของฝรั่งเศสวีชีจะทําใหเราเทาเทียมกับเครือจักรภพอังกฤษแทนที่จะเปนผูใตบังคับบัญชา เราตองไลลาดินแดนเหลานี้แมจะขัดความประสงคของ [ENG.GetNameDef] แมจะตองใชกําลังก็ตาม"
  AST_diplomatic_events.55.a: "เราจะขยายตัว"

  AST_diplomatic_events.56.t: "[AST.GetName] เรียกรองดินแดนในแอฟริกา"
  AST_diplomatic_events.56.desc: "[AST.GetName] มาเคาะประตูบานเราในนามของ [ENG.GetNameDef] เรียกรองใหโอนดินแดนในแอฟริกา\n\n[ENG.GetNameDefCap] ตั้งใจแนวแนที่จะขยายการควบคุมในแอฟริกา และหากเราไมยอมใหออสเตรเลียเขายึดครอง พวกเขาจะกลับมาที่หนาประตูบานเราพรอมอาวุธ"
  AST_diplomatic_events.56.a: "เพื่อหลีกเลี่ยงความขัดแยง จะโอนดินแดนให"
  AST_diplomatic_events.56.b: "ถาอยางนั้นก็กลับมาพรอมอาวุธเถอะ"

  AST_diplomatic_events.57.t: "วีชีโอนดินแดนในแอฟริกา"
  AST_diplomatic_events.57.desc: "ฝรั่งเศสวีชีตกลงโอนดินแดนในแอฟริกาตามที่ถูกเรียกรอง และยอมใหกองรักษาการณของออสเตรเลียเขาควบคุมภูมิภาคนี้"
  AST_diplomatic_events.57.a: "การขยายตัวเขาสูแอฟริกาจะดําเนินตอไป!"

  AST_diplomatic_events.58.t: "วีชีปฏิเสธดินแดนแก [AST.GetName]"
  AST_diplomatic_events.58.desc: "ฝรั่งเศสวีชีปฏิเสธที่จะโอนดินแดนในแอฟริกาใหเรา อยางไรก็ตาม นี่ไมใชคําขอ แตเปนคําเรียกรอง\n\nเราจะไลลาภูมิภาคที่พวกเขาปฏิเสธไมใหเรา แมจะตองใชกําลังก็ตาม"
  AST_diplomatic_events.58.a: "จะโดยสันติหรือไมก็ตาม [AST.GetName] จะขยายตัว"

  #AST_diplomatic_events.59 was removed

  #AST_diplomatic_events.60 was removed
  
  #AST_diplomatic_events.61 was removed

  AST_diplomatic_events.62.t: "กติกาสัญญาตอตานบริเตน?"
  AST_diplomatic_events.62.desc: "นักการทูตจาก [AST.GetName] มาหาเราพรอมขอเสนอใหจัดตั้งกติกาสัญญาตอตานอังกฤษ ซึ่งหมายถึงพวกเขาจะชวยเรายึดไอรแลนดเหนือคืนจากพวกแองโกล โดยที่เราไมตองแทรกแซงโดยตรง\n เพื่อแลกเปลี่ยน หากพวกเขาทําสําเร็จ เราจะเขารวมฝายของพวกเขาและชวยเหลือในสงครามกับบริเตนในอนาคตหากเกิดขึ้น\nแมการรวมชาติกับทางเหนือจะนาดึงดูด แตเราตองพิจารณาอยางรอบคอบวาเราอยูในฐานะที่จะยั่วยุเพื่อนบานที่แข็งแกรงกวาเชนนี้ไดหรือไม และที่สําคัญกวานั้น เราจะไดรับชัยชนะหรือไมหากเกิดความขัดแยง มิฉะนั้นทั้งไอรแลนดอาจกลับไปเปนเพียงอาณานิคมของอังกฤษอีกครั้ง"
  AST_diplomatic_events.62.a: "การรวมชาติรอไมได! ลงนามกติกาสัญญา!"
  AST_diplomatic_events.62.b: "อันตรายเกินไป"

  AST_diplomatic_events.63.t: "ไอรแลนดปฏิเสธ!"
  AST_diplomatic_events.63.desc: "ไอรแลนดปฏิเสธที่จะลงนามกติกาสัญญาตอตานบริเตน"
  AST_diplomatic_events.63.a: "ถาอยางนั้นไอรแลนดก็จะยังแตกแยกตอไป"

  AST_diplomatic_events.64.t: "ไอรแลนดตอบรับ!"
  AST_diplomatic_events.64.desc: "ไอรแลนดตอบรับการลงนามกติกาสัญญาตอตานบริเตน"
  AST_diplomatic_events.64.a: "เดินหนาสูเบลฟาสต!"

  AST_diplomatic_events.65.t: "[FROM.GetName] ใหการสนับสนุน"  ### Support for the Chinese Communists - Sends event from AST to PRC offering support
  AST_diplomatic_events.65.desc: "อิทธิพลที่เพิ่มขึ้นของ [FROM.GetCommunistParty] ใน [FROM.GetNameDef] เริ่มผลิดอกออกผลแลว เมื่อผูแทนของพวกเขาเดินทางขามจีนมาแจงเราวากองกําลังอาสาสมัคร[FROM.GetAdjective]กําลังระดมพลเพื่อสนับสนุนกองกําลังของเรา นอกจากนี้ อาสาสมัครเหลานี้ยังนํายุทโธปกรณสํารองมาชวยติดอาวุธใหทหารของเราดวย"
  AST_diplomatic_events.65.a: "จุดเริ่มตนที่ดีของความรวมมือกับสหาย[FROM.GetAdjective]ของเรา"
  #AST_diplomatic_events.65.b: "They should focus on their own revolution"

  AST_diplomatic_events.66.t: "[FROM.GetName] ขอบคุณเราสําหรับการสนับสนุน" ### Support for the Chinese Communists - They accept
  AST_diplomatic_events.66.desc: "ผูแทนของ [FROM.GetLeader] ไดสงคําขอบคุณของเขาสําหรับการสนับสนุนจากอาสาสมัครของเราและยุทธปจจัยที่มอบให ประสบการณอันกวางขวางในสงครามกลางเมืองของ[FROM.GetAdjective]ยอมหมายความวาทรัพยากรเหลานี้จะถูกใชอยางมีประสิทธิภาพแนนอน"
  AST_diplomatic_events.66.a: "กาวแรกที่ยอดเยี่ยม"

  AST_diplomatic_events.67.t: "[FROM.GetName] ขอบคุณเราสําหรับการสนับสนุน" ### Support for the Chinese Communists - They accept
  AST_diplomatic_events.67.desc: "ผูแทนของ [FROM.GetLeader] ไดสงคําขอบคุณของเขาสําหรับการสนับสนุนจากอาสาสมัครของเราและยุทธปจจัยที่มอบให ประสบการณอันกวางขวางในสงครามกลางเมืองของ[FROM.GetAdjective]ยอมหมายความวาทรัพยากรเหลานี้จะถูกใชอยางมีประสิทธิภาพแนนอน"
  AST_diplomatic_events.67.a: "กาวแรกที่ยอดเยี่ยม"

  AST_diplomatic_events.68.t: "ขอเรียกรองของออสเตรเลีย"
  AST_diplomatic_events.68.desc: "ออสเตรเลียไมตองการเผชิญหนากับศัตรูที่เหนือกวาอยางทวมทนเพียงลําพัง นั่นคือ [JAP.GetNameDef] พวกเขากําลังกดดันใหเราเปนฝายเริ่มกอน และยุติความขัดแยงที่กําลังกอตัวโดยเร็วที่สุด"
  AST_diplomatic_events.68.a: "สถานการณพลิกกลับเสียแลว"

  AST_diplomatic_events.69.t: "ผูกพันกันอีกครั้ง"
  AST_diplomatic_events.69.desc: "สายสัมพันธระหวาง [ENG.GetNameDef] กับ [AST.GetName] กําลังถูกทดสอบ แตฝายหลังมุงมั่นที่จะฟนฟูใหกลับมาแนนแฟนเต็มที่ [AST.GetName] มีเสนสายและพันธมิตรในรัฐบาลอังกฤษมากถึงขนาดที่ผูนําของพวกเขาไมอาจปฏิเสธได ทั้งสองชาติจะเขารวมฝายเดียวกันอีกครั้ง และหมูเกาะอังกฤษกับดินแดนใตสุดของโลกจะรวมมือกันอีกครั้ง"
  AST_diplomatic_events.69.a: "ใหเปนเชนนั้น"

  AST_diplomatic_events.71.t: "ออสเตรเลียขอหมูเกาะแปซิฟก"
  AST_diplomatic_events.71.desc: "[AST.GetName] เรียกรองการควบคุมหมูเกาะแปซิฟกของเรา โดยอางวาแปซิฟกตะวันตกไมใชที่ที่ [USA.GetNameDef] จะมาบงการ หมูเกาะเหลานี้อาจเปนราคาเพียงเล็กนอยเพื่อสงบความเปนปรปกษของออสเตรเลีย แตก็ยังเปนราคาที่ตองจายอยูดี เราจะเสี่ยงยั่วยุมหาอํานาจฟาสซิสตที่กําลังผงาดขึ้น ทั้งที่มือเราก็เต็มอยูแลวหรือไม?"
  AST_diplomatic_events.71.a: "ไม เราจะไมเสี่ยง"
  AST_diplomatic_events.71.b: "หมูเกาะแปซิฟกจะยังคงเปนของเรา"

  AST_diplomatic_events.72.t: "การโอนหมูเกาะแปซิฟกของ [USA.GetNameDef]"
  AST_diplomatic_events.72.desc: "ในเมื่อมือเต็มอยูแลว หมูเกาะแปซิฟกจึงเปนราคาเล็กนอยที่ [USA.GetNameDef] ยอมจายเพื่อสงบความเปนปรปกษของออสเตรเลีย บัดนี้หมูเกาะแปซิฟกของพวกเขาเปนของเราแลว"
  AST_diplomatic_events.72.a: "ยอดเยี่ยม"

  AST_diplomatic_events.73.t: "[USA.GetNameDefCap] ปฏิเสธ"
  AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] ปฏิเสธที่จะยอมมอบหมูเกาะแปซิฟกใหเรา แมเราจะเรียกรองและมีอิทธิพลในแปซิฟกเพิ่มขึ้น แตวอชิงตันก็ยังไมยอมสละอํานาจเหนือหมูเกาะเหลานั้น"
  AST_diplomatic_events.73.a: "หมูเกาะอาจยังไมเปนของเรา ในตอนนี้"

  AST_diplomatic_events.74.t: "ออสเตรเลียเรียกรองใหโอนฟลิปปนส"
  AST_diplomatic_events.74.desc: "ดวยความทะเยอทะยานที่จะขยายดินแดน [AST.GetName] เรียกรองการควบคุม [PHI.GetNameDef] หากเราปฏิเสธ [AST.GetName] ขูวาจะทําสงคราม โดยเห็นวาเปนเรื่องที่คิดไมถึงเลยที่ [USA.GetNameDef] จะยังคงครองดินแดนในเขตอิทธิพลของ [AST.GetName]"
  AST_diplomatic_events.74.a: "เราเสี่ยงทําสงครามไมได ทําตามขอเรียกรองของพวกเขา"
  AST_diplomatic_events.74.b: "ฟลิปปนสจะยังคงเปนของเรา!"

  AST_diplomatic_events.75.t: "การโอน [PHI.GetNameDef]"
  AST_diplomatic_events.75.desc: "เปนที่ชัดเจนวาการผงาดขึ้นเปนมหาอํานาจฟาสซิสตของ [AST.GetName] เริ่มใหประโยชนบางอยางแลว เมื่อชาติตาง ๆ เกรงกลัวความโกรธเกรี้ยวของเราถึงเพียงนี้ [USA.GetNameDefCap] ตกลงแลว [PHI.GetNameDef] เปนของเรา"
  AST_diplomatic_events.75.a: "ระเบียบใหมปรากฏขึ้น"

  AST_diplomatic_events.76.t: "[USA.GetNameDefCap] ปฏิเสธ"
  AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] ปฏิเสธที่จะยอมมอบ [PHI.GetNameDef] ใหเรา แมเราจะเรียกรองและมีอิทธิพลในแปซิฟกเพิ่มขึ้น แตวอชิงตันก็ยังไมยอมสละอํานาจเหนือดินแดนนั้น"
  AST_diplomatic_events.76.a: "นี่หมายถึงสงคราม"

  AST_diplomatic_events.78.t: "[AST.GetName] ขอการรับประกันเพื่อรับมือยักษใหญ"
  AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] เปดเผยเปาหมายอันกลาหาญของพวกเขาแกเรา:\n\n'เงาของ [USA.GetNameDefCap] ทาบทับอยูเหนือเรา พรอมจะแทรกแซงทุกครั้งที่การกระทําของเราไมตรงกับผลประโยชนของพวกเขา ตราบใดที่มหาอํานาจระดับโลกขนาดนี้ยังยุมยามในกิจการของออสเตรเลียและญี่ปุน เอเชียตะวันออกจะไมมีวันเปนของเราอยางแทจริง ดังนั้น [AST.GetName] จะทําสงคราม'\n\nนายกรัฐมนตรี [AST.GetLeader] แสดงเจตนาอยางชัดแจง [AST.GetName] ตั้งใจจะเผชิญหนากับ [USA.GetNameDef] และขอความชวยเหลือจากเราหากชาวอเมริกันแข็งแกรงเกินกวาจะเอาชนะไดตามลําพัง"
  AST_diplomatic_events.78.a: "เราจะรับประกันพวกเขา"
  AST_diplomatic_events.78.b: "[JAP.GetNameDefCap] มีเรื่องของตนเองตองดูแล"

  AST_diplomatic_events.79.t: "[JAP.GetNameDefCap] รับประกัน [AST.GetName]"
  AST_diplomatic_events.79.desc: "ไมใชแคเราที่เห็นชัดวาการแทรกแซงของ [USA.GetNameDef] ในการทูตของเอเชียและโอเชียเนียนั้นทั้งไมพึงปรารถนาและรับไมได [JAP.GetNameDefCap] ตกลงรับประกันชาติของเรา ทําใหเราชูธงสูศัตรูไดอยางองอาจ ดวยรูวาจะมีพันธมิตรมาชวยหากชาวอเมริกันแข็งแกรงเกินกวาจะเอาชนะไดตามลําพัง"
  AST_diplomatic_events.79.a: "เราเดินทัพสูสงคราม"

  AST_diplomatic_events.80.t: "[JAP.GetNameDefCap] ปฏิเสธที่จะรับประกันเรา"
  AST_diplomatic_events.80.desc: "การแทรกแซงของ [USA.GetNameDefCap] ในการทูตของเอเชียและโอเชียเนียนั้นทั้งไมพึงปรารถนาและรับไมได แตดูเหมือนจะมีเพียงเราที่เห็นชัด [JAP.GetNameDefCap] ปฏิเสธที่จะรับประกันเรา บีบใหเราตองเผชิญหนาศัตรูโดยไมมีพวกเขา"
  AST_diplomatic_events.80.a: "และเราจะทําเชนนั้น"

  AST_diplomatic_events.81.t: "สัญลักษณแหงเอกภาพอันนารัก"
  AST_diplomatic_events.81.desc: "ความสนใจในสัตวของนายกรัฐมนตรีอังกฤษแทบไมมีใครไมรู และคอลเลกชันของเขาก็นาประทับใจไมนอย สัตวตัวใหมที่เพิ่มเขาไปในครอบครัวสัตวอันหลากหลายของเขายอมไดรับการชื่นชมแนนอน และยิ่งถาเปนสัตวแปลกหายากก็ยิ่งดี\n\n[ENG.GetLeader] เองไดแสดงความสนใจในตุนปากเปดของออสเตรเลีย และแมปจจุบันจะหามสงออกเนื่องจากการขนสงเปนอันตรายตอสุขภาพของสัตวตัวเล็กนี้ แตก็อาจคุมคาที่จะยกเวนให\n\nเราจะทําตามความปรารถนาของนายกรัฐมนตรีเพื่อเปนสัญลักษณแหงเอกภาพหรือไม?"
  AST_diplomatic_events.81.a: "[ENG.GetLeader] จะไดตุนปากเปดของเขา"
  AST_diplomatic_events.81.b: "การหามสงออกจะไมถูกยกเลิก แมแตสําหรับนายกรัฐมนตรี"

  AST_diplomatic_events.82.t: "รายงานอันนาเศราจาก [ENG.GetLeader]"
  AST_diplomatic_events.82.desc: "เรือขนสงตุนปากเปดที่ออกจากทาเรือเมลเบิรนเมื่อหกสัปดาหกอน พรอมคอกเลี้ยงตุนปากเปดครบชุดบนเรือ ไดเดินทางถึง [ENG.GetNameDef] แลว ทวาการมาถึงของเรือไมไดนายินดีนัก เพราะพบวาสัตวตัวนั้นตายเสียแลว [ENG.GetLeader] โศกเศรากับสัตวเลี้ยงที่จากไป ซึ่งเขาถึงกับตั้งชื่อตามตัวเองระหวางรอคอยการมาถึงของมัน แตอางวาศัตรูตองรับผิดชอบตอการตายของมัน เห็นวาแรงระเบิดจากการโจมตีของเรือดํานํ้าทําใหตุนปากเปดตกใจจนตาย\n\nอยางไรก็ตาม สมุดบันทึกของผูดูแลตุนปากเปดชี้ไปที่สาเหตุการตายอีกอยางที่เปนไปได อุณหภูมิของนํ้าและอากาศในคอกเลี้ยงนั้นสูงเกินระดับที่ยอมรับไดไปมาก\n\nไมวาอยางไร ตุนปากเปด [ENG.GetLeader] ก็ตายไปแลว และนายกรัฐมนตรีอังกฤษก็จะยังคงไมมีตุนปากเปดตอไป"
  AST_diplomatic_events.82.a: "ชางเปนขาวที่นาเศราจริง ๆ"

  AST_diplomatic_events.83.t: "นิวซีแลนดรวมเขากับ [AST.GetNameDef]"
  AST_diplomatic_events.83.desc: "หลังการลงประชามติที่เพิ่งจัดขึ้น [NZL.GetNameDef] ตัดสินใจใชมาตรา 6 ของรัฐธรรมนูญออสเตรเลีย\n\nระหวางกระบวนการรวมอาณานิคมออสเตรเลียเปนสหพันธรัฐในป 1901 ในทายที่สุดนิวซีแลนดตัดสินใจไมเขารวม อยางไรก็ตาม นับแตนั้นรัฐธรรมนูญออสเตรเลียยังคงกําหนดใหนิวซีแลนดเปนหนึ่งในรัฐที่อาจเขารวม และเปดชองใหดินแดนนี้เขารวมได\n\nบัดนี้ชาวนิวซีแลนดเห็นพองวาแผนดินของตนจะปลอดภัยกวาภายใตการปกครองของออสเตรเลีย จึงตกลงเขารวมกับ [AST.GetNameDef]"
  AST_diplomatic_events.83.a: "เราทําอะไรไดไมมากนัก"

  AST_diplomatic_events.84.t: "[AST.GetNameDefCap] ขอดินแดน"
  AST_diplomatic_events.84.desc: "ความตึงเครียดที่เพิ่มขึ้นในแปซิฟกนาเปนหวง ขณะที่ความสามารถของเราในการปองกันดินแดนที่ไดรับผลกระทบดูจะมีจํากัด อยางนอย [AST.GetNameDef] ก็อางเชนนั้น\n\nพวกเขาตองการขยายอาณาเขตเพื่อปองกันเอเชียตะวันออกเฉียงใตทั้งหมด จึงขอใหโอนดินแดนบางสวน เราจะตกลงหรือไม?"
  AST_diplomatic_events.84.a: "ดินแดนจะถูกโอนไปอยูในมือของออสเตรเลีย"
  AST_diplomatic_events.84.b: "เราจะไมตกลงเรื่องเชนนั้น"

  AST_diplomatic_events.85.t: "[FROM.GetNameDefCap] ตกลงตามคําขอของเรา"
  AST_diplomatic_events.85.desc: "ความตึงเครียดที่เพิ่มขึ้นในแปซิฟกนาเปนหวง โดยเฉพาะเมื่อความสามารถของบางชาติในการปองกันดินแดนของตนดูจะมีจํากัด และ [FROM.GetNameDef] ก็เห็นดวย พวกเขาจะโอนดินแดนที่เรารองขอโดยทันที"
  AST_diplomatic_events.85.a: "พวกเขาเลือกไดอยางชาญฉลาด!"

  AST_diplomatic_events.86.t: "[FROM.GetNameDefCap] ปฏิเสธคําขอของเรา"
  AST_diplomatic_events.86.desc: "ความตึงเครียดที่เพิ่มขึ้นในแปซิฟกนาเปนหวง โดยเฉพาะเมื่อความสามารถของบางชาติในการปองกันดินแดนของตนดูจะมีจํากัด ถึงกระนั้น [FROM.GetNameDef] ก็ปฏิเสธที่จะโอนดินแดนที่เรารองขอ"
  AST_diplomatic_events.86.a: "เราทําอะไรไดไมมากนัก"

  AST_political_events.1.t: "เรียกรองใหมีการลงประชามติ"
  AST_political_events.1.desc: "มีสองดานที่เราในฐานะรัฐบาลตองการเพิ่มอํานาจควบคุมของสหพันธ คือ การบิน และการตลาด\n\nในดานการบิน เปาหมายคือแกไขรัฐธรรมนูญเพื่อมอบอํานาจแกรัฐสภาเครือรัฐในการออกกฎหมายเกี่ยวกับการเดินอากาศและอากาศยาน\n\nสวนการแกไขดานการตลาดนั้นเพื่ออนุญาตใหเครือรัฐและรัฐตาง ๆ รวมมือกันในดานการตลาด ซึ่งปจจุบันเปนไปไมไดตามรัฐธรรมนูญ\n\nเราจะจัดการลงประชามติในเรื่องใด?"
  AST_political_events.1.a: "การบิน เพื่อกํากับการเดินอากาศทั่ว [AST.GetName]"
  AST_political_events.1.a.tt: "เมื่อการปฏิรูปผาน:\n เพิ่ม §Yผานการปฏิรูปการบินแลว§! ซึ่งให:\n ความเร็วการวิจัยดานอากาศ: §G+15%§!\n ความเร็วการกอสราง §Yฐานทัพอากาศ§!: §G+5.00%§!"
  AST_political_events.1.b: "การตลาด เพื่อประสานโครงการการตลาดสินคาเกษตรทั่วประเทศ"
  AST_political_events.1.b.tt: "เมื่อการปฏิรูปผาน:\n เพิ่ม §Yผานการปฏิรูปการตลาดแลว§! ซึ่งให:\n สัดสวนโรงงานสินคาอุปโภคบริโภค: §Y-10.0%§!"
  
  AST_political_events.2.t: "การลงประชามติประสบความสําเร็จ"
  AST_political_events.2.desc.a: "สาธารณชนเห็นชอบใหการปฏิรูปการบินของเรามีผลบังคับใช เนื่องจากการบินยังไมมีอยูในตอนที่รางรัฐธรรมนูญออสเตรเลีย จึงเปนการสมควรแลวที่ในที่สุดรัฐบาลจะมีอํานาจเหนือการเดินอากาศและการกํากับดูแล เพื่อความปลอดภัยและประสิทธิภาพ กฎหมายการบินที่เปนแบบเดียวกันทั่วประเทศจะตามมา"
  AST_political_events.2.desc.b: "สาธารณชนเห็นชอบใหการปฏิรูปการตลาดของเรามีผลบังคับใช ดวยอํานาจในการกํากับผลผลิตทางการเกษตรและการตลาด รัฐบาลจะสามารถรักษาเสถียรภาพของตลาดและสงเสริมความรวมมือระหวางรัฐตาง ๆ ได รายไดของเกษตรกรจะมั่นคงขึ้น และเศรษฐกิจของชาติก็เชนกัน"
  AST_political_events.2.a: "อํานาจควบคุมของสหพันธจะขยายออกไป!"

  AST_political_events.4.t: "นายกรัฐมนตรีถึงแกอสัญกรรม"
  AST_political_events.4.desc: "ผูนําของ [AST.GetName] ตรากตรําทํางานภายใตแรงกดดันจากการเตรียมพรอมสงครามมานาน และในที่สุดความเครียดก็คราเหยื่อระดับสูงสุดไป นายกรัฐมนตรีเสียชีวิตดวยอาการหัวใจวาย\n\nในสภาพโลกปจจุบัน การนําของเขาจะเปนที่คิดถึงอยางยิ่ง ถึงกระนั้น ออสเตรเลียตองเดินหนาตอไปโดยมีผูนําคนใหมกุมบังเหียน นั่นคือ [AST.GetLeader]"
  AST_political_events.4.a: "โศกนาฏกรรมของชาติ"

  AST_political_events.5.t: "รัฐบาลออสเตรเลียใชไมแข็ง"
  AST_political_events.5.desc: "กลุมเสียงที่ทาทายและเปนที่ถกเถียงไดกอตัวขึ้น นั่นคือขบวนการออสเตรเลียมากอน รัฐบาลเกรงวาเจตนาของกลุมนี้อาจไมเปนประชาธิปไตยเสียทีเดียว จึงตัดสินใจเฝาติดตามทั้งกลุมและสมาชิก การแทรกแซงของฝายประชาธิปไตยจะลดขีดความสามารถในการจัดตั้งของเรา และขัดขวางการรับสมาชิกใหม"
  AST_political_events.5.a: "มีเพียงเวลาเทานั้นที่จะบอกธาตุแทของขบวนการนี้"

  AST_political_events.6.t: "การฉลองครบรอบ 150 ป ค.ศ. 1938"
  AST_political_events.6.desc: "เมื่อชวงตนวันนี้ ขณะที่งานรําลึกครบรอบ 150 ปในป 1938 ดําเนินไป และขบวนแห 'การเดินทางสูความเปนชาติของออสเตรเลีย' เคลื่อนผานถนนสายหลักของซิดนีย ไดมีการประทวงขึ้นที่ออสเตรเลียฮอลล\n\nนักเคลื่อนไหวและกลุมตาง ๆ ดานสิทธิของชาวอะบอริจินรวมตัวกันเพื่อเรียกรองความสนใจตอขอเท็จจริงที่วา การครบรอบ 150 ปนี้ไมไดเปนเพียงจุดเริ่มตนของการลาอาณานิคมของอังกฤษ แตยังเปนจุดเริ่มตนของการเลือกปฏิบัติตอชาวอะบอริจินตามรัฐธรรมนูญดวย นักเคลื่อนไหวเรียกรองกฎหมายใหมเพื่อการศึกษาและการดูแลชาวอะบอริจิน รวมถึงนโยบายใหมที่จะยกสถานะชนพื้นเมืองใหเปนพลเมืองโดยสมบูรณ"
  AST_political_events.6.a: "ตองลงมือทําบางอยาง"

  AST_political_events.7.t: "แรงกดดันจากจักรวรรดิ"
  AST_political_events.7.desc: "หลังเหตุการณลาสุด ไมอาจปฏิเสธไดอีกตอไปวาการเมืองออสเตรเลียกําลังเปลี่ยนทิศ [ENG.GetNameDefCap] ไดดําเนินการทางการทูตเพื่อใหแนใจวา [AST.GetName] ยังคงอยูบนเสนทางที่เหมาะสมสําหรับชาติภายใตรมเครือจักรภพ โดยหวังวาการสะกิดอยางสันติใหไปในทิศทางที่ถูกตองจะเพียงพอที่จะรักษาความภักดีของประเทศในเครือของตนไวได"
  AST_political_events.7.a: "แมบริเตนจะพยายาม แต [AST.GetName] จะกําหนดเสนทางของตนเอง"

  AST_political_events.8.t: "สงครามกําลังมา"
  AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
  AST_political_events.8.a: "เราตองเตรียมพรอม"

  AST_political_events.9.t: "ขอพิพาทดาลแฟรม"
  AST_political_events.9.desc: "สิ่งที่เริ่มจากขอพิพาทเรื่องการบรรทุกเหล็กถลุงไดจุดชนวนบางสิ่งที่ใหญกวามาก คนงานทั่วออสเตรเลียพากันหยุดงานเพื่อแสดงความเปนนํ้าหนึ่งใจเดียว ทาทายทั้งรัฐบาลและภาคอุตสาหกรรม เมื่อการนัดหยุดงานลุกลามและความตึงเครียดเพิ่มสูงขึ้น วิกฤตก็บานปลาย และเรียกรองใหผูกุมอํานาจลาออก และแลว เมื่อลมเหลวโดยสิ้นเชิงในการควบคุมสถานการณ รัฐบาลก็ลาออกจริง ๆ เปดทางให [AST.GetCommunistParty] เขามาครองตําแหนงพรรครัฐบาล"
  AST_political_events.9.a: "และเราจะครองมัน"

  AST_political_events.10.t: "ยุทธการบริสเบน"
  AST_political_events.10.desc: "เมื่อคืนนี้ ทหารสวมหมวกเหล็กถูกเรียกออกมาปราบจลาจลบนถนนในบริสเบน ทหารนายหนึ่งถูกยิงเสียชีวิต และทหารอีกหกนายไดรับบาดเจ็บระหวางความวุนวายที่กินเวลาสามชั่วโมง\n\nฝูงชนเกือบ 1,000 คน ซึ่งรวมถึงทหารและกะลาสีจํานวนมาก รวมตัวกันหนาโรงอาหารที่หัวมุมถนนครีกกับถนนแอดิเลด ไมวาจะเพื่อรวมวงหรือดูการวิวาทที่เกิดขึ้น รถดับเพลิงมาถึงพรอมเสียงไซเรนแหลมเพื่อแยกฝูงชน แตเมื่อรถกลับไป การตะลุมบอนก็เริ่มขึ้นใหม ฝูงชนที่ตะโกนโหวกเหวกบุกเขาทางเขาโรงอาหารและทุบกระจกหนาตางของอาคารแตก สารวัตรทหารตองเหวี่ยงกระบองเพื่อสลายฝูงชนอีกครั้ง\n\nหลังความวุนวายผานไปหนึ่งชั่วโมง ก็มีเสียงปนดังขึ้น ทําใหมีผูบาดเจ็บหลายรายและเสียชีวิตหนึ่งราย กําลังเสริมของสารวัตรทหารมาถึงเพื่อสลายการจลาจลใหสิ้นซาก โดยมีกําลังสํารองตํารวจพลเรือนทั้งหมดที่มีและทหารสวมหมวกเหล็กคอยสนับสนุน"
  AST_political_events.10.a: "พฤติกรรมที่ยอมรับไมได!"
  
  AST_political_events.11.t: "พลิกหนาใหม"
  AST_political_events.11.desc: "หลังอยูใตอํานาจเจาเหนือหัวอังกฤษมาสองศตวรรษ [AST.GetName] ก็เปนอิสระแลว เมื่อไมมีขอจํากัดเรื่องนโยบายและการปฏิรูป ผูกําหนดนโยบายหลายคนจึงกระตือรือรนที่จะเสนอแนวคิดของตน และขอเสนอหนึ่งไดจุดกระแสถกเถียงในสังคม\n\nขอเสนอนั้นเกี่ยวกับธง[AST.GetAdjective] ควรเปลี่ยนธงใหมเพื่อเปนสัญลักษณของการแยกตัวเมื่อไมนานมานี้หรือไม?"
  AST_political_events.11.a: "ชักธงผืนใหมขึ้น"
  AST_political_events.11.b: "ประวัติศาสตรของ [AST.GetName] ไมควรถูกลบ ธงของเราจะคงอยู"

  #AST_political_events.12 is hidden

  AST_political_events.13.t: "นิวการดผงาดขึ้นอีกครั้ง"
  AST_political_events.13.desc: "$AST_new_guard_spirit_desc$"
  AST_political_events.13.a: "มีเพียงเวลาเทานั้นที่จะบอกไดวาครั้งนี้พวกเขาจะประสบความสําเร็จเพียงใด"

  AST_political_events.14.t: "แตงตั้งประธานสภาแหงราชบัลลังก"
  AST_political_events.14.desc: "สภาแหงราชบัลลังกที่เพิ่งจัดตั้งขึ้นจะชวยเหลือรัฐดวยการทบทวนกฎหมาย และใหคําแนะนําดานนโยบาย ภาวะฉุกเฉิน และเรื่องรัฐธรรมนูญ รัฐบุรุษทุกคนที่ไดรับแตงตั้งเขาสภาจะใหคําปรึกษาแกประมุขแหงรัฐและรัฐบาล แตจะมีประธานหนึ่งคนเปนผูนําทั้งหมด อิทธิพลที่ประธานจะมีเหนือกิจการของสภานั้นไมอาจประเมินตํ่าได ดังนั้นการแตงตั้งจึงตองทําดวยความรอบคอบอยางยิ่ง\n\nใครจะไดรับแตงตั้งเปนประธานสภาแหงราชบัลลังก?"
  AST_political_events.14.a: "ผูภักดีตออังกฤษและผูประสานงานภาคอุตสาหกรรม อาเดลา แพงคเฮิรสต วอลช"
  AST_political_events.14.b: "อดีตนายกรัฐมนตรีผูรักชาติอยางแรงกลา บิลลี ฮิวส"
  AST_political_events.14.c: "ประมุขแหงรัฐเอง อเล็กซานเดอร ฮอร-รัทเวน"

  AST_canberra_air_disaster_events.1.t: "โศกนาฏกรรมทางอากาศที่แคนเบอรรา"
  AST_canberra_air_disaster_events.1.desc: "เมื่อชวงตนวันนี้ เครื่องบิน Lockheed Hudson ตกนอกกรุงแคนเบอรรา ในบรรดาผูโดยสารสิบคนบนเครื่อง มีผูบัญชาการทหารบกและคณะทํางาน ซึ่งกําลังเดินทางไปตามหมายเรียกเขาประชุมคณะรัฐมนตรี พวกเขาและลูกเรือทั้งหมดเสียชีวิตอยางนาสลดใจ\n\nสาเหตุของเครื่องบินตกยังคงเปนปริศนา สภาพอากาศเหมาะแกการบินอยางยิ่ง และเที่ยวบินนี้ขับโดยเรืออากาศเอกโรเบิรต ฮิตชค็อก นายทหาร RAAF ผูมีประสบการณ\n\nไมวาสาเหตุจะเปนอะไร นี่คือวันอันมืดมนของทั้งชาติ โดยเฉพาะสําหรับครอบครัวและมิตรสหายของผูเสียชีวิต และบัดนี้ออสเตรเลียหันไปมองผูนําของตน พวกเขาจะรับมืออยางไร?"
  AST_canberra_air_disaster_events.1.a: "เหตุการณที่นาสลดใจอยางยิ่ง"
  AST_canberra_air_disaster_events.1.a.tt: "ปลดล็อก§Yการตัดสินใจ 'ความไววางใจในคณะรัฐมนตรี'§! และ§Yภารกิจ§!เพื่อรักษาหรือโคนรัฐบาลชุดปจจุบัน"
  
  AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty] ยืนหยัดได"
  AST_canberra_air_disaster_events.2.desc: "รัฐบาลชุดปจจุบันนําออสเตรเลียผานความปนปวนของชาติหลังโศกนาฏกรรมทางอากาศที่แคนเบอรราไดสําเร็จ ดุจแสงนําทาง [AST.GetRulingParty] ไดพิสูจนความนาเชื่อถือและความแข็งแกรงในยามยากลําบาก จนทายที่สุดไดรับการสนับสนุนจากสาธารณชนทั่วประเทศเพิ่มขึ้น"
  AST_canberra_air_disaster_events.2.a: "อนาคตรออยูเบื้องหนา"
  
  AST_canberra_air_disaster_events.3.t: "ญัตติไมไววางใจ"
  AST_canberra_air_disaster_events.3.desc: "หลังญัตติไมไววางใจผานความเห็นชอบ ในที่สุดรัฐบาลชุดปจจุบันก็ถูกแทนที่ และสงมอบบังเหียนใหผูสืบทอดอยางไมเต็มใจ หลังชวงเวลาแหงความไรเสถียรภาพทางการเมืองและความไมไววางใจของสาธารณชน ออสเตรเลียก็พรอมสําหรับการเริ่มตนใหม"
  AST_canberra_air_disaster_events.3.a: "ผูนําชุดใหมมาชวยออสเตรเลีย"
 
  AST_canberra_air_disaster_events.4.t: "การเปลี่ยนผูนํา"
  AST_canberra_air_disaster_events.4.desc: "หลังชวงเวลาแหงความไรเสถียรภาพทางการเมืองและความไมไววางใจของสาธารณชน [AST.GetRulingParty] ไดเปลี่ยนผูนําพรรค เสียงขางมากบีบใหนายกรัฐมนตรีลงจากตําแหนง และเปดทางใหผูสืบทอดขึ้นมาแทน"
  AST_canberra_air_disaster_events.4.a: "หวังวาสิ่งนี้จะปูทางใหออสเตรเลีย"
  
  AST_canberra_air_disaster_events.5.t: "ขอกลาวหาของออสเตรเลีย"
  AST_canberra_air_disaster_events.5.desc: "ในการแถลงขาว [AST.GetName] ไดกลาวหาเรา โดยอางวาเราเปนผูรับผิดชอบตอเหตุเครื่องบินตกบนแผนดินออสเตรเลียเมื่อไมนานมานี้ ซึ่งทําใหเจาหนาที่ทางการเมืองหลายคนเสียชีวิต\n\nแนนอนวาขอกลาวหานี้เปนเท็จทั้งสิ้น ยิ่งทําใหการดูหมิ่นนี้มุงรายมากขึ้นไปอีก"
  AST_canberra_air_disaster_events.5.a: "ขอกลาวหาเปนเท็จ เราไมจําเปนตองทําอะไร"
  AST_canberra_air_disaster_events.5.b: "เรื่องนี้จะไมถูกปลอยไปโดยไมไดรับโทษ"
  
  AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] ตอบโต"
  AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap] ไมไดมองขอกลาวหาของเราเปนเรื่องเล็ก และถือวาเปนการรุกรานครั้งแรก [JAP.GetLeader] ไดยกระดับความขัดแยงยิ่งขึ้น โดยแถลงวาบัดนี้ชาติของเขามีสิทธิ์เต็มที่ที่จะบุกดินแดนของเรา"
  AST_canberra_air_disaster_events.6.a: "เราจะไมเพิ่มความตึงเครียดอีก"
  AST_canberra_air_disaster_events.6.b: "เรื่องนี้จะปลอยไวโดยไมตอบโตไมได"

  AST_canberra_air_disaster_events.7.t: "ฮอร-รัทเวนยังคงกุมอํานาจ"
  AST_canberra_air_disaster_events.7.desc.a: "การแทรกแซงของ [ENG.GetNameDefCap] ดวยมืออันมั่นคงและการชี้นําที่หนักแนน ไดโนมนาวผูสําเร็จราชการ[AST.GetAdjective] อเล็กซานเดอร ฮอร-รัทเวน วายังไมอาจมอบ [AST.GetName] ไวในมือผูนําฝายประชาธิปไตยคนใดได\n\nพรรคการเมืองฝายประชาธิปไตยไดแสดงใหเห็นแลววาไมสามารถนํา [AST.GetName] ฝาวิกฤตของชาติได และความไรความสามารถนั้นไมอาจยอมรับได โดยเฉพาะเมื่อทั้ง [AST.GetName] และโลกตางอยูในสภาพไรเสถียรภาพ [ENG.GetNameDef] เกรงวาหากการควบคุมของฮอร-รัทเวนสิ้นสุดลง กระแสฟาสซิสตที่เพิ่งกอตัวขึ้นในประเทศของเราอาจบีบรัดคอหอยของ [AST.GetName] ไดอยางสมบูรณ\n\n[AST.GetName] ตองการผูนําที่เด็ดเดี่ยวและความเปนเอกภาพ ซึ่งฮอร-รัทเวนจะเปนผูมอบใหจนกวาจะมีประกาศเปลี่ยนแปลง"
  AST_canberra_air_disaster_events.7.desc.b: "นิวการดและผูเห็นอกเห็นใจฝายนิยมกษัตริยไดโนมนาวผูสําเร็จราชการ[AST.GetAdjective] อเล็กซานเดอร ฮอร-รัทเวน วายังไมอาจมอบ [AST.GetName] ไวในมือผูนําฝายประชาธิปไตยคนใดได\n\nพรรคการเมืองฝายประชาธิปไตยไดแสดงใหเห็นแลววาไมสามารถนํา [AST.GetName] ฝาวิกฤตของชาติได และความไรความสามารถนั้นไมอาจยอมรับได โดยเฉพาะเมื่อโลกอยูในสภาพไรเสถียรภาพ [AST.GetName] ตองการผูนําที่เด็ดเดี่ยวและความเปนเอกภาพ ซึ่งฮอร-รัทเวนจะเปนผูมอบใหจนกวาจะมีประกาศเปลี่ยนแปลง"
  AST_canberra_air_disaster_events.7.a: "เปลี่ยนเสนทาง"

  INS_limited_war_events.1.t: "บดขยี้มลายา!"
  INS_limited_war_events.1.desc: "แนวขาศึกแตกพาย และทหารของเรารุกคืบไปขางหนาโดยไรการตอตาน ฝงตรงขามชองแคบ รัฐบริวารของอังกฤษพังทลายลงภายใตแรงโกรธเกรี้ยวของประชาชน หุนเชิดของลอนดอนคิดวาดาบปลายปนจะปกปองพวกเขาจากประวัติศาสตรได พวกเขาคิดผิด"
  INS_limited_war_events.1.a: "เมอรเดกา!"
  INS_limited_war_events.1.b: "วันที่ดีของสาธารณรัฐ"
  
  INS_limited_war_events.2.t: "การตีโตของ[FROM.GetAdjective]"
  INS_limited_war_events.2.desc: "สิ่งที่สัญญาไววาจะเปนการโจมตีอยางรวดเร็วตอระบอบหุนเชิดกลับกลายเปนเรื่องเลวราย กองกําลัง[FROM.GetAdjective]ที่ไดรับการเสริมกําลังจากนายจางจักรวรรดินิยม ไดขับไลทหารของเราออกจากพื้นที่พิพาทและบัดนี้ยึดครองพื้นที่นั้นอยู ทุกวันวิทยุก็สงขาวการโออวดของพวกเขา การรุกตอไปรังแตจะนําความอัปยศมาเพิ่ม แตการถอนตัวก็เทากับยอมรับความพายแพตอหนาทั้งหมูเกาะ"
  INS_limited_war_events.2.a: "ถอนทหาร รักษาสิ่งที่รักษาได"
  INS_limited_war_events.2.b: "เราจะไมยอมพวกหุนเชิด!"
  
  INS_limited_war_events.3.t: "[FROM.GetName] ยอมกมหัวใหสาธารณรัฐ"
  INS_limited_war_events.3.desc: "ขาวมาจากกัวลาลัมเปอร รัฐบาลหุนเชิดซึ่งถูกนายแหงลอนดอนทอดทิ้งในชั่วโมงชี้ขาด ยอมรับเงื่อนไขของเราแทนที่จะปลอยใหเมืองของตนถูกเผา ดินแดนพิพาทเปนของเราแลว บทเรียนนี้จะไมสูญเปลาสําหรับรัฐบริวารอื่น ๆ ในภูมิภาค"
  INS_limited_war_events.3.a: "อินโดนีเซียผงาดขึ้น"
  
  INS_limited_war_events.4.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
  INS_limited_war_events.4.desc: "[FROM.GetName]โยนขอเสนอของเรากลับมาใสหนา บรรดารัฐมนตรีหุนเชิดอานตามบทที่เขียนมาจากไวตฮอลล ประกาศวาจะไมยอมเสียแผนดินแมแตนิ้วเดียว และสาธารณรัฐเองตองถูกบังคับใหศิโรราบกอนที่เสียงปนจะสงบลง"
  INS_limited_war_events.4.a: "ถาเชนนั้นก็ใหเสียงปนเปนผูตอบ"
  
  INS_limited_war_events.5.t: "[FROM.GetNameDef]เรียกรองใหทําลายลางเรา"
  INS_limited_war_events.5.desc: "[FROM.GetNameDefCap]ไดทิ้งขออางสุดทายของการทําสงครามอยางจํากัดแลว บัดนี้การกระจายเสียงของพวกเขาพูดอยางเปดเผยถึงการแยกชิ้นสวนสาธารณรัฐ และแบงหมูเกาะของเราใหแกเจาอาณานิคมเกา เรื่องนี้จะไมจบลงอยางเงียบ ๆ เมื่อถึงที่สุด อินโดนีเซียจะตองยังคงยืนหยัดอยู หรือไมก็ลมสลายไปเลย"
  INS_limited_war_events.5.a: "เราจะยืนหยัดหรือลมสลายไปดวยกัน"
  
  INS_limited_war_events.6.t: "การรุกของฝาย[FROM.GetAdjective]เริ่มชะงัก"
  INS_limited_war_events.6.desc: "การโจมตีของฝาย[FROM.GetAdjective]ทําใหเราไมทันตั้งตัว และชวงหนึ่งเราหวั่นเกรงวาจะเลวรายที่สุด ทวาการรุกของพวกเขากลับจมอยูในโคลน ทหารของพวกเขาเหนื่อยลา แนวรบยืดยาว และคําโออวดจากลอนดอนก็เบาบางลงทุกครั้งที่ออกแถลงการณ สาธารณรัฐอาจแสดงความใจกวางและเปดทางใหพวกหุนเชิดถอนตัวจากเรื่องนี้ แมหลายคนจะบอกวาชัยชนะเด็ดขาดยอมเปนประโยชนตออุดมการณมากกวาชัยชนะแบบพอประมาณ"
  INS_limited_war_events.6.a: "เสนอเงื่อนไขใหพวกเขา"
  INS_limited_war_events.6.b: "ไมมีความเมตตาใหพวกหุนเชิด"
  
  INS_limited_war_events.7.t: "การรุกของเราหยุดชะงัก"
  INS_limited_war_events.7.desc: "การรุกของเราหยุดนิ่ง และที่แยกวานั้นคือศัตรูรูดี มีขอเรียกรองสงมาจากอีกฟากของชองแคบ ใหวางอาวุธเสียตอนนี้และยอมรับเงื่อนไขของพวกเขา หรือจะเฝามองรายชื่อผูเสียชีวิตยาวขึ้นเรื่อย ๆ เพื่อผลลัพธแบบเดียวกัน ทางเลือกที่พวกเขาเสนอคือขนาดของงานศพเทานั้น"
  INS_limited_war_events.7.a: "สันติภาพที่ยํ่าแยยังดีกวาสงครามที่เลวรายกวา"
  INS_limited_war_events.7.b: "สาธารณรัฐไมยอมจํานน"
  
  INS_limited_war_events.8.t: "[FROM.GetName]ไมยอมออนขอ"
  INS_limited_war_events.8.desc: "[FROM.GetName]ตอบขอเสนอของเราดวยการทาทาย รัฐมนตรีของพวกเขาประกาศวายอมเห็นทุกกัมปงตั้งแตปนังถึงยะโฮรถูกเผาเปนจุณ ดีกวาจะยอมออนขอใหสาธารณรัฐแมแตขอเดียว สงครามจึงดําเนินตอไป"
  INS_limited_war_events.8.a: "ถาเชนนั้นก็ตามนั้น"
  
  INS_limited_war_events.9.t: "[FROM.GetName]ตั้งใจจะบดขยี้สาธารณรัฐ!"
  INS_limited_war_events.9.desc: "การดักฟงวิทยุจากกองบัญชาการของศัตรูไดยืนยันสิ่งที่เลวรายที่สุดแลว จะไมมีการตกลง ไมมีสันติภาพแบบพอประมาณ ไมมีการกลับไปสูแนวที่เราเคยยึดไว พวกหุนเชิดและนายใหญในลอนดอนเรียกรองใหสาธารณรัฐยอมจํานนโดยสิ้นเชิง ใหอินโดนีเซียถูกทรมานจนแหลกสลาย และหมูเกาะของเธอถูกสงคืนใหอยูใตรองเทาบูตของจักรวรรดินิยมที่เราไดดึงพวกมันออกมา ตอเรื่องนี้มีคําตอบเพียงหนึ่งเดียว"
  INS_limited_war_events.9.a: "อินโดนีเซียยืนหยัด!"

### INS - Martial Law Events

  INS_martial_law_events.1.t: "[INS.GetNameDefCap]ตองการกระชับความสัมพันธทางการคากับเรา"
  INS_martial_law_events.1.desc: "ประธานาธิบดีแหง[INS.GetName]ไดติดตอมาเพื่อแสดงความปรารถนาที่จะกระชับความสัมพันธทางการคาระหวางเรา และให[INS.GetName]มีบทบาทมากขึ้นในวงไพบูลยรวมกัน [INS.GetLeader] ประธานาธิบดีแหง[INS.GetName] ไดเสนอขอตกลงที่นาดึงดูด ซึ่งยางและทรัพยากรอื่น ๆ จะถูกขายใหเราโดยไมมีคาธรรมเนียมหรือภาษี พรอมการควบคุมตลาดเพื่อใหราคาตํ่า"
  INS_martial_law_events.1.a: "แนนอน!"
  INS_martial_law_events.1.b: "เราไมสนใจ"

  INS_martial_law_events.2.t: "[FROM.GetName]ตกลงตามขอตกลงการคา"
  INS_martial_law_events.2.desc: "[ROOT.GetLeader]เดินทางกลับจากการพบปะกับรัฐบาล[JAP.GetAdjective]ที่[JAP.GetCapitalVictoryPointName]ในวันนี้พรอมขาวดี ขอตกลงการคาที่เสนอใน[JAP.GetCapitalVictoryPointName]ไดรับความเห็นชอบจากทุกฝาย และจะมีผลบังคับใชในเร็ว ๆ นี้"
  INS_martial_law_events.2.a: "สิ่งนี้จะเปนประโยชนอยางยิ่งตอเศรษฐกิจของทั้งสองฝาย!"

  INS_martial_law_events.3.t: "[FROM.GetName]ปฏิเสธขอตกลงการคา"
  INS_martial_law_events.3.desc: "[ROOT.GetLeader]เดินทางกลับจากการพบปะกับรัฐบาล[JAP.GetAdjective]ที่[JAP.GetCapitalVictoryPointName]ในวันนี้พรอมขาวรายวา การเจรจาชะงักงันหลังจากทั้งสองฝายไมยอมออนขอในบางประเด็น สงผลใหไมมีขอตกลงการคาใดผานความเห็นชอบ"
  INS_martial_law_events.3.a: "นาเสียดาย"

  INS_martial_law_events.4.t: "[FROM.GetName]ขอใหเรารับรองการอางสิทธิ์ในดินแดนมลายูของพวกเขา"
  INS_martial_law_events.4.desc: "ทูตจาก[FROM.GetNameDef]ไดยื่นคํารองอยางเปนทางการตอรัฐบาลของเรา ประธานาธิบดี[FROM.GetLeader] ผูประกาศวาการรวมโลกมลายูเปนหนึ่งเดียวคือเปาหมายสูงสุดของรัฐบาล ขอใหเรารับรองการอางสิทธิ์ของ[INS.GetAdjective]เหนือดินแดนของชาติพันธุมลายูทั้งหมด ตั้งแตศรีลังกาไปจนถึงฟลิปปนส"
  INS_martial_law_events.4.a: "เราจะรับรองสิทธิ์ของพวกเขาเหนือดินแดนทางประวัติศาสตร"
  INS_martial_law_events.4.b: "นี่ไมใชเรื่องของเรา"

  INS_martial_law_events.5.t: "[FROM.GetName]รับรองการอางสิทธิ์ของเรา"
  INS_martial_law_events.5.desc: "รัฐบาล[FROM.GetName]ไดรับรองการอางสิทธิ์ของเราเหนือดินแดนมลายูอยางเปนทางการ ดวยความเห็นชอบจากพันธมิตรที่ทรงอํานาจที่สุดของเรา การรวมโลกมลายูเปนหนึ่งเดียวก็ดูเปนไปไดมากขึ้นอยางยิ่ง"
  INS_martial_law_events.5.a: "เอกภาพ!"

  INS_martial_law_events.6.t: "[FROM.GetName]ปฏิเสธที่จะรับรองการอางสิทธิ์ของเรา"
  INS_martial_law_events.6.desc: "รัฐบาล[FROM.GetName]ปฏิเสธที่จะรับรองการอางสิทธิ์ของเราเหนือโลกมลายู ดูเหมือนวาสิ่งที่เรียกวาพันธมิตรของเราอยากใหชนชาติมลายูแตกแยกกันตอไป มากกวาจะเห็นเราเขมแข็งขึ้น เราจะจดจําการดูหมิ่นครั้งนี้ไวเมื่อถึงเวลา"
  INS_martial_law_events.6.a: "นี่เปนเพียงอุปสรรคชั่วคราว เราจะอดทน และเราจะประสบความสําเร็จ!"

  INS_martial_law_events.7.t: "[FROM.GetName]เรียกรองการควบคุมมลายูตอนเหนือ"
  INS_martial_law_events.7.desc: "[FROM.GetName]ไดสงคํารองอยางเปนทางการใหเราเคารพการรับรองการอางสิทธิ์ในดินแดนมลายูของพวกเขา ดวยการจัดการโอนมลายูตอนเหนือ ซึ่งปจจุบันอยูใตการควบคุมของ[SIA.GetName] ใหแก[FROM.GetName] การกระทํานี้อาจทําใหผูนํา[SIA.GetAdjective]ไมพอใจ แตจะกระชับความสัมพันธของเรากับ[INS.GetName]อยางมาก"
  INS_martial_law_events.7.a: "เราตองรักษาขอตกลง"
  INS_martial_law_events.7.b: "ไมคุมที่จะกอความขัดแยงภายในฝาย"

  INS_martial_law_events.8.t: "[FROM.GetName]ปฏิเสธคํารองของเรา"
  INS_martial_law_events.8.desc: "แมจะรับรองการอางสิทธิ์ของเราอยางเปนทางการแลว แตรัฐบาล[JAP.GetAdjective]กลับปฏิเสธที่จะเปนตัวกลางในการโอนมลายูตอนเหนือ โดย[JAP.GetLeader]ยืนกรานวาไมอาจเสี่ยงใหเกิดความขัดแยงภายในฝาย เห็นไดชัดวาคําสัญญาของพวกเขาวางเปลา และคําพูดของพวกเขาแทบไมมีความหมายเมื่อถึงคราวคับขัน"
  INS_martial_law_events.8.a: "พวกเขาไดแสดงใหเห็นแลววาไมอาจทําตามที่พูดได"
  
  INS_martial_law_events.9.t: "[FROM.GetName]ขอใหเราโอนมลายูตอนเหนือใหแก[INS.GetNameDef]"
  INS_martial_law_events.9.desc: "[FROM.GetName]แจงเราวา[INS.GetName]เรียกรองใหเราโอนมลายูตอนเหนือใหแก[INS.GetName] ในฐานะสวนหนึ่งของการอางสิทธิ์เหนือดินแดนของชาติพันธุมลายูทั้งหมด รัฐบาล[JAP.GetAdjective]สนับสนุนการอางสิทธิ์ของ[INS.GetAdjective]อยางเปนทางการ และที่ปรึกษาชาว[JAP.GetAdjective]เตือนวาเราอาจเสี่ยงตอความขัดแยงดวยอาวุธหากปฏิเสธ"
  INS_martial_law_events.9.a: "ใชวาเราจะมีทางเลือกนี่"
  INS_martial_law_events.9.b: "เราจะไมยอมพายแพตอจักรวรรดินิยม!"
  INS_martial_law_events.9.a.tt: "§W§Rเราเสี่ยงที่จะถูกมองวาออนแอ ซึ่งอาจนําไปสูการถูกเรียกรองใหยอมออนขอในอนาคต§!§!"
  
  INS_martial_law_events.10.t: "[JAP.GetName]และ[FROM.GetName]ตกลงยินยอมการโอน"
  INS_martial_law_events.10.desc: "[JAP.GetName]ตกลงเปนตัวกลางในการโอนมลายูตอนเหนือ และไดสงทูตไปเจรจาที่[SIA.GetCapitalVictoryPointName]รวมกับทูตชาว[INS.GetAdjective] ทั้งสามฝายบรรลุขอตกลงแลว โดยสรุปวามลายูตอนเหนือเปนดินแดนของ[INS.GetAdjective]โดยมีผลทันที"
  INS_martial_law_events.10.a: "ยอดเยี่ยม!"
  
  INS_martial_law_events.11.t: "[FROM.GetName]ปฏิเสธการโอน"
  INS_martial_law_events.11.desc: "[SIA.GetLeader]ปฏิเสธที่จะเขารวมการประชุม และแสดงใหเห็นชัดเจนวาไมมีเจตนาจะยอมสละมลายูตอนเหนือไมวาผลที่ตามมาจะเปนอยางไร เมื่อเราแจงถึงความรายแรงของการตัดสินใจนี้ [SIA.GetLeader]ก็ไมหวั่นไหวและทาใหเราทําตามคําขู โดยปฏิเสธที่จะทําตามขอเรียกรองใด ๆ นาเสียดายที่สิ่งนี้ทําใหเราเหลือทางเลือกไมมากนัก"
  INS_martial_law_events.11.a: "ถาเชนนั้นก็ตองเปนสงคราม"
  
  INS_martial_law_events.12.t: "[FROM.GetName]แจงเราวา[SIA.GetName]ปฏิเสธที่จะทําตาม"
  INS_martial_law_events.12.desc: "ทูตจาก[FROM.GetName]ไดเดินทางมาถึง[ROOT.GetCapitalVictoryPointName] พรอมขาวรายวาฝาย[SIA.GetAdjective]ปฏิเสธอยางสิ้นเชิงที่จะยอมรับการโอนหรือการเจรจาใด ๆ และ[JAP.GetNameDef]ไดขับ[SIA.GetNameDef]ออกจากฝายอยางเปนทางการแลว"
  INS_martial_law_events.12.a: "ถาเชนนั้นก็ตองเปนสงคราม"
  
  INS_martial_law_events.13.t: "[FROM.GetName]ขอเปนเจาเหนือหัวของ[SIA.GetName]"
  INS_martial_law_events.13.desc: "[FROM.GetName]แจงเราถึงความปรารถนาที่จะไดเปนเจาเหนือหัวของ[SIA.GetName] เนื่องจาก[FROM.GetLeader]เชื่อวา[SIA.GetName]เปนชาติที่ออนแอ ไมอาจยืนหยัดปกปองตนเองได ซึ่งเห็นไดชัดเจนจากการยอมจํานนตอคํารองเรื่องมลายูตอนเหนือในทันที คุณคาที่[INS.GetName]มอบใหแกฝายนั้นไมใชนอย และดูเหมือนวาเราเสี่ยงที่จะเสียพวกเขาไปจากการเปนพันธมิตร หากเราไมทําตามคํารองของพวกเขา"
  INS_martial_law_events.13.a: "พวกเขาสมควรไดรับ"
  INS_martial_law_events.13.b: "ไมมีทางเด็ดขาด"
  
  INS_martial_law_events.14.t: "[FROM.GetName]ตกลงยินยอมการโอน"
  INS_martial_law_events.14.desc: "รัฐบาล[FROM.GetName]ตกลงที่จะให[SIA.GetNameDef]อยูภายใตอํานาจของเราโดยมีผลทันที"
  INS_martial_law_events.14.a: "ยอดเยี่ยม"
  
  INS_martial_law_events.15.t: "[FROM.GetName]ปฏิเสธการโอน"
  INS_martial_law_events.15.desc: "รัฐบาล[FROM.GetName]ปฏิเสธที่จะโอนสถานะเจาเหนือหัวของ[SIA.GetName]ใหแกเรา แมพวกเขาจะแสดงใหเห็นแลววาไมสามารถปกปองตนเองได"
  INS_martial_law_events.15.a: "นาเสียดาย"

  INS_martial_law_events.16.t: "ผูนําชุดใหมของ[ROOT.GetName]"
  INS_martial_law_events.16.desc: "ดวยการปรับโครงสรางรัฐบาลของเราเปนสหภาพจังหวัดอินโดนีเซีย ระบบเดิมที่มีคณะประธานาธิบดีกํากับดูแลสภาที่มาจากการเลือกตั้งตามระบอบประชาธิปไตย จะถูกแทนที่ดวยระบบประธานาธิบดีแบบสหพันธรัฐ เราตองเลือกประธานาธิบดีคนใหม"
  INS_martial_law_events.16.a: "นี่เปนเพียงการปรับโครงสรางภายใน ใหคงผูนําชุดเดิมไว"
  INS_martial_law_events.16.b: "ฮัตตาจะเขารับตําแหนง"
  INS_martial_law_events.16.c: "การโตซูวีรโยเปนตัวเลือกที่ไดรับความนิยม!"
  INS_martial_law_events.16.d: "ในตอนนี้จําเปนตองมีการปกครองโดยทหาร"

