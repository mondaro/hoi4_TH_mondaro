### INS - Political Events
  INS_political_events.1.t: "ผูสําเร็จราชการคนใหมของ[INS.GetNameDef]"
  INS_political_events.1.desc: "วาระหาปของ[INS.GetLeader]ใกลสิ้นสุดลง เราจึงตองตัดสินใจเลือกผูนําที่เหมาะสมมาแทน สมเด็จพระราชินีวิลเฮลมีนาทรงเสนอชื่ออาลีดีอึส ชารดา ฟน สตารเคินบอรค สตาเคาเวอร ผูแสดงศักยภาพอยางยิ่งในฐานะเอกอัครราชทูตวิสามัญผูมีอํานาจเต็ม"
  INS_political_events.1.a: "ตามพระราชประสงคของสมเด็จพระราชินี"
  INS_political_events.1.b: "[INS.GetLeader]ทํางานไดดี ควรดํารงตําแหนงตออีกวาระ"
  INS_political_events.2.t: "[FROM.GetName]เรียกรองกรรมสิทธิ์เหนือ[721.GetName]"
  INS_political_events.2.desc: "รัฐบาลฝายสาธารณรัฐชุดใหมในอดีตอินดีสไดประกาศใหหมูเกาะทั้งหมดเปนดินแดนของตน [FROM.GetLeader]ไดสงขอเรียกรองอยางเปนทางการใหเราสละ[721.GetName] พรอมขูวาจะใชกําลังทหารหากปฏิเสธ"
  INS_political_events.2.a: "ก็ได ไมคุมที่จะกอเรื่อง"
  INS_political_events.2.b: "ไมมีทางเด็ดขาด!"
  INS_political_events.3.t: "[FROM.GetName]ยอมสละ[721.GetName]"
  INS_political_events.3.desc: "ตามที่คาดไว [FROM.GetLeader]ยอมตามขอเรียกรองของเราและเริ่มถอนกําลังออกจาก[721.GetName] กองกําลัง TKR ไดเขาสูภูมิภาคพรอมกับผูแทนรัฐบาลหลายคน [INS.GetLeader]เองไดกลาวสุนทรพจนที่ดิลีประกาศอิสรภาพจากอิทธิพลอาณานิคม"
  INS_political_events.3.a: "ยอดเยี่ยม!"
  INS_political_events.4.t: "[FROM.GetName]ปฏิเสธที่จะสละ[721.GetName]"
  INS_political_events.4.desc: "การเจรจากับ[FROM.GetName]ไมราบรื่น [FROM.GetLeader]ปฏิเสธที่จะสละ[721.GetName]ไมวาดวยเหตุผลใด และยุติการประชุมกอนกําหนด"
  INS_political_events.4.a: "ถาอยางนั้นก็สงคราม"

  INS_political_events.5.t: "การเลือกตั้งทั่วไปของอินโดนีเซีย"
  INS_political_events.5.desc: "วันนี้คือหมุดหมายทางประวัติศาสตรของอินโดนีเซีย เมื่อการปฏิวัติสิ้นสุดลงอยางเปนทางการ นายกรัฐมนตรี[INS.GetLeader]ไดประกาศวาอินโดนีเซียจะจัดการเลือกตั้งที่เสรีและเปนประชาธิปไตยครั้งแรก ผลของการเลือกตั้งครั้งนี้จะสงผลตออินโดนีเซียไปอีกยาวนาน"
  INS_political_events.5.a: "ซูตัน ชาหรีร นําประเทศมาถึงจุดนี้ เขาจะนําทางเราตอไป!"
  INS_political_events.5.b: "อามีร ชารีฟุดดิน คือการประนีประนอมที่ยุติธรรมระหวางฝายสังคมนิยมและฝายชาตินิยม"
  INS_political_events.5.c: "โมฮัมหมัด ฮัตตา เริ่มการปฏิวัติ และเขาจะทําใหมันสําเร็จ"

  INS_political_events.6.t: "การเตรียมการของเราไดผล"
  INS_political_events.6.desc: "เมื่อการปฏิวัติเริ่มตนขึ้น กองโจรของเราที่แทรกซึมเขาไปในรัฐบาลอินดีสไมจําเปนตองปฏิบัติการอยางลับๆ อีกตอไป และจะเริ่มภารกิจกอวินาศกรรมกอนที่เนเธอรแลนดจะทันตอบสนอง"
  INS_political_events.6.a: "เราตองเคลื่อนไหวอยางรวดเร็วตอไป"

  INS_political_events.7.t: "คํารองซูตารโจ"
  INS_political_events.7.desc: "คํารองในโฟลกสรัดที่ซูตารโจจัดทําขึ้น ซึ่งขอใหจัดการประชุมโตะกลมระหวางผูแทนชาวดัตชและชาวอินโดนีเซียเพื่อหารือถึงความปรารถนาที่จะปกครองตนเองของชาวอินโดนีเซีย ไดผานการอภิปรายภายในแลว และถูกสงไปยังผูสําเร็จราชการเพื่ออนุมัติ แมที่ปรึกษาหลายคนยืนกรานวาตองรักษาสถานะเดิมไวและควรยับยั้งคํารองนี้ แตก็ปฏิเสธไมไดวาขบวนการชาตินิยมมีแตจะแข็งแกรงและสุดโตงขึ้น หากเรายังคงปฏิเสธทุกคําขอปกครองตนเองอยางสันติ ฝายชาตินิยมอาจหันไปใชทางเลือกที่รุนแรงกวาแทน"
  INS_political_events.7.a: "เราตองเริ่มการเจรจาเพื่อหลีกเลี่ยงสงครามกลางเมืองที่หลีกเลี่ยงไมได"
  INS_political_events.7.b: "สถานะเดิมตองคงอยูตอไป"
  INS_political_events.7.c: "บางทีฝายชาตินิยมอาจมีเหตุผลก็ได?"

  INS_political_events.8.t: "การยึดครองของ[?event_target:INS_invasion_event_invader.GetAdjective]ใกลเขามา"
  INS_political_events.8.desc: "ทหารจาก[?event_target:INS_invasion_event_invader.GetName]มาถึง[?event_target:INS_invasion_event_invaded_state.GetName]แลว และทหารของเราในพื้นที่ซึ่งมีจํานวนนอยกวามาก ไดรับคําสั่งใหอพยพทางทหารออกจาก[?event_target:INS_invasion_event_invaded_state.GetName]ทั้งหมด กองกําลัง[?event_target:INS_invasion_event_invader.GetAdjective]ยังคงรุกคืบในอินดีส และโอกาสที่เราจะรอดพนจากการถูกยึดครองดูริบหรี่"
  INS_political_events.8.a: "เราจะจับกุมพวกชาตินิยมและปกปองบานเกิดจนตัวตาย!"

  INS_political_events.9.t: "ชาวอินโดนีเซียประกาศเอกราช"
  INS_political_events.9.desc: "เมื่อ[JAP.GetNameDef]เริ่มถอนกําลังออกจากหมูเกาะอินดีสตะวันออก เราไดสงทหารไปปตตาเวียเพื่อฟนฟูรัฐบาลอาณานิคม อยางไรก็ตาม ทหารของเราพบวาภูมิทัศนทางการเมืองในอินดีสเปลี่ยนไปอยางมากนับตั้งแตการยึดครอง กอนที่กองทหารของเราจะไปถึงปตตาเวียเสียอีก [INS.GetLeader]ไดลงนามในคําประกาศเอกราชแลว โดยประกาศใหสาธารณรัฐอินโดนีเซียเปนชาติเอกราช และไดรับการสนับสนุนจากประชาชนอยางลนหลามจนนาตกใจ"
  INS_political_events.9.a: "สงรถถังเขาไป!"
  INS_political_events.9.b: "มันสิ้นหวังแลว การสูรบเพิ่มไมใชสิ่งที่เราตองการ เราควรมุงฟนฟูมาตุภูมิ"

  INS_political_events.11.t: "[HOL.GetNameDefCap]รับรองอธิปไตยของอินโดนีเซีย"
  INS_political_events.11.desc: "ทันทีที่ประกาศเอกราช กองกําลังติดอาวุธของเราก็เคลื่อนกําลังเขาปองกันดินแดนจากการรุกรานของดัตชที่คาดไว อยางไรก็ตาม ทามกลางความประหลาดใจของหลายคน [HOL.GetLeader]ประกาศวาจะไมสั่งการรุกราน แตจะใหความสําคัญกับการฟนฟูมาตุภูมิของดัตชและหลีกเลี่ยงความขัดแยงเพิ่มเติม"
  INS_political_events.11.a: "นาประหลาดใจ แตเปนเรื่องนายินดี"

  INS_political_events.12.t: "การประชุมกับฝายชาตินิยมอินโดนีเซีย"
  INS_political_events.12.desc: "กองทหารของเรายกพลขึ้นบกที่[?event_target:INS_invasion_event_invaded_state.GetName]แลว และชัยชนะในแนวรบอินโดนีเซียใกลเขามา เราตองตัดสินใจวาจะยึดครองอินโดนีเซียอยางไร แมการยึดครองโดยตรงจะใหทรัพยากรที่เราตองการ แตก็สิ้นเปลืองและยากลําบาก เราไดเจรจากับซูการโน นักปฏิวัติคนสําคัญ และวางแผนจัดตั้งรัฐหุนเชิดอินโดนีเซียที่มีซูการโนเปนผูนํารวมอยางเปนทางการ แตอยูภายใตการบังคับบัญชาของเรา ซึ่งจะทําใหพลเรือนชาวอินโดนีเซียสงบลง และประหยัดกวาการยึดครองเบ็ดเสร็จมาก"
  INS_political_events.12.a: "เราควรเจรจากับซูการโนตอไป"
  INS_political_events.12.b: "เราไมสนใจรวมมือกับพวกนักปฏิวัติ"

  INS_political_events.13.t: "การยึดครองของ[?event_target:INS_invasion_event_invader.GetAdjective]ใกลเขามา"
  INS_political_events.13.desc: "ทหารจาก[?event_target:INS_invasion_event_invader.GetName]มาถึง[?event_target:INS_invasion_event_invaded_state.GetName]แลว และทหารของเราในพื้นที่ซึ่งมีจํานวนนอยกวามาก ไดรับคําสั่งใหอพยพทางทหารออกจาก[?event_target:INS_invasion_event_invaded_state.GetName]ทั้งหมด กองกําลัง[?event_target:INS_invasion_event_invader.GetAdjective]ยังคงรุกคืบในอินดีส และโอกาสที่เราจะรอดพนจากการถูกยึดครองดูริบหรี่ นอกจากนี้ สายลับของเรายังรายงานวาพบเห็น[?event_target:INS_invasion_event_invader.GetLeader]กําลังเจรจากับซูการโนและผูนําชาตินิยมคนอื่นๆ โดยมุงจัดตั้งรัฐหุนเชิดอินโดนีเซียที่มีซูการโนเปนผูนําภายใตวงไพบูลยรวม"
  INS_political_events.13.a: "เราจะจับกุมพวกชาตินิยมและปกปองบานเกิดจนตัวตาย!"
  INS_political_events.13.b: "มันอันตราย แตบางทีนี่อาจเปนโอกาสแทจริงที่จะไดเอกราช?"
  INS_peta_explain_tt: "เราจะสามารถใชความโกลาหลจากการยึดครองประกาศเอกราชโดยสมบูรณได หาก[JAP.GetName]ถูกผลักดันถอยกลับไป"
  INS_peta_explain_tt_jap: "§R[INS.GetName]อาจยังภักดีตอเรา แตหากเราเริ่มเสียการควบคุมดินแดน พวกเขาอาจทาทายเราและประกาศเอกราช§!"

  INS_political_events.14.t: "ผูนําชาตินิยมถูกจับกุม"
  INS_political_events.14.desc: "ซูการโนและนักปฏิวัติระดับสูงอีกหลายคนในอินโดนีเซียถูกสารวัตรทหารดัตชจับกุม กอนที่เราจะจัดตั้งระบอบหุนเชิดได"
  INS_political_events.14.a: "นาเสียดาย เขานาจะเปนพันธมิตรที่มีคา"

  INS_political_events.15.t: "ผูพิทักษมาตุภูมิ"
  INS_political_events.15.desc: "การเจรจากับซูการโนไดขอยุติแลว และระบอบหุนเชิดในอินโดนีเซียกําลังดําเนินไป ซูการโนไดใชเสนสายของเขารวมกับการมีกําลังทหารของเราบั่นทอนเสถียรภาพของรัฐบาลดัตช และสถาปนาการควบคุมหมูเกาะโดยพฤตินัย"
  INS_political_events.15.a: "เราไมเพียงไดทรัพยากรราคาถูก แตยังไดพันธมิตรที่มีคาอีกดวย"

  INS_political_events.16.t: "การยึดครองอินดีสของ[?event_target:INS_invasion_event_invader.GetAdjective]"
  INS_political_events.16.desc: "กองกําลัง[?event_target:INS_invasion_event_invader.GetAdjective]ในอินดีสไดรวมมือกับฝายชาตินิยมอินโดนีเซียบั่นทอนเสถียรภาพของรัฐบาลอาณานิคมของเรา และยึดครองอินดีสไดทั้งหมด ธงดัตชถูกลดลงและแทนที่ดวยธงอินโดนีเซีย และชาวพื้นเมืองในอินดีสดูเหมือนจะตอนรับผูยึดครอง[?event_target:INS_invasion_event_invader.GetAdjective] สถานการณของจักรวรรดิอาณานิคมของเราดูไมสูดีนัก"
  INS_political_events.16.a: "พวกเขาชนะการรบ แตยังไมชนะสงคราม"

  INS_political_events.17.t: "[INS.GetName]ประกาศเอกราช"
  INS_political_events.17.desc: "ขาวจากปตตาเวียมาถึงกองบัญชาการใหญจักรวรรดิแลว ซูการโนและพรรคพวก ซึ่งเราเปนผูยกขึ้นมาปกครองหมูเกาะในพระนามของจักรพรรดิ ไดประกาศสาธารณรัฐ[FROM.GetAdjective] เพื่อตอบโตการสูญเสียดินแดนซํ้าแลวซํ้าเลาของเรา โดยเชื่อวาเรากระจายกําลังบางเกินกวาจะทําอะไรได"
  INS_political_events.17.a: "นาเสียดาย พวกเขาอาจคิดถูก"

  INS_political_events.18.t: "ตัน มะละกา กลับสูอินโดนีเซีย"
  INS_political_events.18.desc: "ตัน มะละกา นักคอมมิวนิสตชาวอินโดนีเซียผูทําหนาที่เปนที่ปรึกษาที่ไววางใจไดของรัฐบาลเรามาหลายป ไดประกาศวาจะเดินทางออกไปทันที เมื่อ[INS.GetNameDef]ไดเปนสาธารณรัฐเสรีแลว เขาตั้งใจจะกลับไปยังประเทศที่เขาเหยียบครั้งสุดทายในฐานะผูหลบหนีเมื่อกวาสองทศวรรษกอน เขาขอบคุณเราที่ใหที่พักพิงและเสรีภาพในการทํางานตอ และกลาวเพียงวาที่ของเขาตอนนี้คือบานเกิด"
  INS_political_events.18.a: "ขออวยพรใหเขาโชคดี"

  INS_political_events.19.t: "[HOL.GetName]เรียกตัวพลเรือเอกเฮลฟริชกลับ"
  INS_political_events.19.desc: "ขาวมาถึง[1058.GetName]วาพลเรือเอกคอนราด เฮลฟริช ผูบัญชาการกองกําลังทางเรือและนายทหารที่มีความสามารถที่สุดของเราในนานนํ้านี้ ไดรับคําสั่งใหกลับประเทศ กรุงเฮกอางถึงความจําเปนเรงดวนในเมืองแม และแทบไมใหคําอธิบายอื่นใด การจากไปของเขาทําใหหมูเกาะมีการปองกันบางเบาในขณะที่สถานะของเราที่นี่ยังหางไกลจากความมั่นคง และวากันวาหองนายทหารในสุราบายาตกอยูในบรรยากาศขุนมัว"
  INS_political_events.19.a: "วันอันมืดมนของกองเรือ"

### INS - Industrial Events
  INS_industrial_events.4.t: "การจัดสรรงบประมาณใหมใน[FROM.FROM.GetName]"
  INS_industrial_events.4.desc: "ดวยการปดสวนยางพาราใน[FROM.FROM.GetName] เราไดมีงบประมาณสําหรับโครงการอุตสาหกรรมใหมในภูมิภาคนี้"
  INS_industrial_events.4.a: "เราจะสรางบอนํ้ามันใน[FROM.FROM.GetName]"
  INS_industrial_events.4.b: "เราควรเปดโรงถลุงอะลูมิเนียมใน[FROM.FROM.GetName]"
  INS_industrial_events.4.c: "เราควรสํารวจหาทรัพยากรที่เรายังขาดการผลิต"
  INS_industrial_events.4.d: "เราสามารถเปดเหมืองถานหินใน[FROM.FROM.GetName]"

  INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
  INS_industrial_events_5_t_colonial: "ชะตากรรมของธนาคารชวา"
  INS_industrial_events_5_t_independent: "ชะตากรรมของธนาคารอินโดนีเซีย"
  INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
  INS_industrial_events_5_desc_colonial: "ทุนสํารองของธนาคารชวาลดลงตํ่าสุดในรอบทศวรรษ เงินกิลเดอรซื้อของไดนอยลงทุกเดือน และเจาของสวนเรียกรองใหจายเปนเงินตราตางประเทศ ที่ปรึกษาดานการเงินของเราเห็นพองวาธนาคารเพียงลําพังไมอาจพลิกสถานการณได แตเห็นตางอยางรุนแรงเรื่องวิธีแกไข"
  INS_industrial_events_5_desc_independent: "ธนาคารอินโดนีเซียรายงานวาเงินรูเปยหสูญเสียมูลคาไปเกือบหนึ่งในหาในไตรมาสที่แลวเพียงไตรมาสเดียว พอคาขาวในสุราบายาเริ่มปฏิเสธไมรับเงินรูเปยหเลย และหันไปรับธนบัตรตางประเทศแทน รัฐมนตรีคลังของเรายืนยันวาคาเงินยังรักษาไวได แตตองลงมืออยางเด็ดขาดและโดยเร็ว"
  INS_industrial_events.5.a: "เราควรพยายามทําใหเงินกิลเดอรแข็งแกรงขึ้น ไมใชแทนที่มัน"
  INS_industrial_events.5.b: "เราจะผูกคาเงินกิลเดอรอินดีสไวกับเงินกิลเดอรดัตช"
  INS_industrial_events.5.c: "เราจะผูกคากิลเดอรอินดีสไวกับดอลลารสหรัฐ"

  INS_industrial_events.6.t: "ขอตกลงที่ทํากําไรไดมากกวาเดิม"
  INS_industrial_events.6.desc: "สํานักงานซิงโคนายอมรับเงื่อนไขของเราแลว ในเมื่อโรคมาลาเรียกําลังระบาดหนักไปทั่วครึ่งหนึ่งของเขตรอน และยังไมมีสิ่งใดทดแทนควินินได พวกเขาจึงแทบไมมีทางเลือก ขอตกลงฉบับใหมรับประกันวาเราจะไดสวนแบงกําไรมากขึ้นอยางมากจากควินินทุกกรัมที่สงออกจากชายฝงของเรา คําถามตอนนี้คือเราจะนําโชคลาภกอนนี้ไปใชที่ใด"
  INS_industrial_events.6.a: "ลงทุนในเมืองของเรา"
  INS_industrial_events.6.b: "พัฒนาหมูเกาะรอบนอก"
  INS_industrial_events.6.c: "เสริมกําลังอุตสาหกรรมทหารของเรา"

  # Rubber shipment dispatched
  INS_industrial_events.28.t: "สงยางพาราออกไปแลว"
  INS_industrial_events.28.desc: "ขบวนเรือลําเลียงบรรทุกยางล็อตสุดทายเสร็จและออกเดินทางสูทะเลแลว ผูซื้อของเราจะไดรับสินคาตามที่จายเงินไว และบัญชีของเราจะบันทึกคาตอบแทนตามที่ตกลงกันในเวลาอันควร ตลอดสองปขางหนา ตนทุนของธุรกรรมนี้จะปรากฏอยูในงบดุลของเรา เปนเครื่องเตือนใจถึงสิ่งที่ภาวะเศรษฐกิจตกตํ่าเรียกรองจากเรา"
  INS_industrial_events.28.a: "รับทราบ"
  INS_industrial_events.28.b: "จัดการสงสินคาอีกรอบ"

  # Oil shipment dispatched
  INS_industrial_events.36.t: "สงนํ้ามันออกไปแลว"
  INS_industrial_events.36.desc: "เรือบรรทุกนํ้ามันออกจากโรงกลั่นของเราแลว มุงหนาสูทาเรือของผูซื้อ คาตอบแทนไดตกลงกันเรียบรอยและจะไดรับครบถวน แมภาระจากการขายครั้งนี้จะถวงเศรษฐกิจของเราไปอีกสองป นี่คือเงื่อนไขที่โลกหยิบยื่นใหเราในยามขาวยากหมากแพงเชนนี้"
  INS_industrial_events.36.a: "รับทราบ"
  INS_industrial_events.36.b: "จัดการสงสินคาอีกรอบ"

### INS - Volksraad
  INS_volksraad_events.2.t: "[HOL.GetLeader] ไดยับยั้งคํารองของโฟลคสราด"
  INS_volksraad_events.2.desc: "แมคํารองนี้จะไดรับการอนุมัติจาก [INS.GetLeader] แลว แตก็ถูกยับยั้งหลังผานการพิจารณาของ [HOL.GetLeader] เราจึงไมสามารถดําเนินการตอไดในขณะนี้"
  INS_volksraad_events.2.a: "บางทีในอนาคตเราอาจลองใหมดวยคํารองที่ไดรับการรับรองแลว"
  # Generic/Reused
  INS_volksraad_events.10.t: "ญัตติในโฟลคสราดใหอนุญาตใชภาษาอินโดนีเซียในโรงเรียน"
  INS_volksraad_events.10.desc: "[INS.GetLeader] ไดอนุมัติคํารองของโฟลคสราดเพื่อสงเสริมการกอตั้งโรงเรียนและมหาวิทยาลัยที่ใชภาษาอินโดนีเซียใน [INS.GetNameDef] และไดสงตอให [HOL.GetLeader] อนุมัติขั้นสุดทายแลว"
  INS_volksraad_events.10.a: "โฟลคสราดกําลังทําหนาที่ของตน"
  INS_volksraad_events.10.b: "ไมมีทาง ยับยั้งเสีย!"
  INS_volksraad_events.11.t: "การศึกษาภาษาอินโดนีเซียจะถูกจัดตั้งขึ้น"
  INS_volksraad_events.11.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.11.a: "โฟลคสราดกําลังทําหนาที่ของตน"
  # Individual laws
  INS_volksraad_events.20.t: "ญัตติในโฟลคสราดใหอนุญาตใชภาษาอินโดนีเซียในรัฐบาล"
  INS_volksraad_events.20.desc: "ตําแหนงในรัฐบาลของอินดีส รวมถึงโฟลคสราด ลวนกําหนดใหตองใชภาษาดัตชไดคลอง ซึ่งทําใหสมาชิกโฟลคสราดจํานวนมาก โดยเฉพาะผูแทนจากชุมชนพื้นเมือง ตั้งคําถามถึงความชอบธรรมของประชาธิปไตยในสภา พวกเขาจึงรวมกันเสนอญัตติยืนยันวาตําแหนงในรัฐบาลควรเปดใหผูที่พูดภาษาอินโดนีเซียดํารงตําแหนงไดเมื่อเปนไปได"
  INS_volksraad_events.21.t: "บัดนี้อนุญาตใหใชภาษาอินโดนีเซียในรัฐบาลแลว!"
  INS_volksraad_events.21.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.30.t: "ญัตติในโฟลคสราดใหยกเลิกระบบโควตาการศึกษา"
  INS_volksraad_events.30.desc: "[INS.GetLeader] ไดอนุมัติคํารองของโฟลคสราดใหยกเลิกระบบโควตาการศึกษาใน [INS.GetNameDef] เพื่อยุติขอถกเถียงที่ยืดเยื้อมานานในโฟลคสราดเรื่องการบังคับใชและความเปนธรรมของระบบนี้ และไดสงตอให [HOL.GetLeader] อนุมัติขั้นสุดทายแลว"
  INS_volksraad_events.31.t: "ระบบโควตาการศึกษาถูกยกเลิกแลว"
  INS_volksraad_events.31.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.40.t: "ญัตติในโฟลคสราดใหลดภาษีสงออกยางพารา"
  INS_volksraad_events.40.desc: "[INS.GetLeader] ไดลงนามและอนุมัติคํารองของโฟลคสราดใหลดภาษีอัตราสูงที่เรียกเก็บจากสวนยางของเอกชน ในอดีตภาษีเหลานี้ทําใหรัฐบาลผูกขาดยางพาราและทํากําไรไดมหาศาล ทวานโยบายกีดกันทางการคาระหวางประเทศทําใหระบบนี้ทํากําไรไดนอยลงมาก [INS.GetLeader] แถลงวาเขาไมเชื่ออีกตอไปแลววาภาษีเหลานี้คุมคากับผลกระทบทางเศรษฐกิจที่ตามมา"
  INS_volksraad_events.40.a: "[INS.GetLeader] พูดมีเหตุผล"
  INS_volksraad_events.40.b: "ภาษียังคงอยู"
  INS_volksraad_events.41.t: "ภาษีสงออกยางพาราของเอกชนไดรับการลดหยอนแลว"
  INS_volksraad_events.41.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.60.t: "ญัตติในโฟลคสราดใหยกเลิกเพดานยศที่ไมเปนลายลักษณอักษรของนายทหารชาวอินโดนีเซีย"
  INS_volksraad_events.60.desc: "[INS.GetLeader] ไดอนุมัติคํารองของโฟลคสราดใหยกเลิกกฎที่ไมเปนลายลักษณอักษรซึ่งจํากัดยศของนายทหาร KNIL ที่ไมใชชาวดัตช และใหเลื่อนยศนายทหารชาวอินโดนีเซียที่ถือวาไดยศตํ่ากวาผลงาน คํารองนี้ไดสงตอให [HOL.GetLeader] อนุมัติขั้นสุดทายแลว"
  INS_volksraad_events.61.t: "เพดานยศที่มองไมเห็นของนายพลชาว[INS.GetAdjective]ถูกยกเลิกแลว"
  INS_volksraad_events.61.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.70.t: "ญัตติในโฟลคสราดใหการแสดงธงและสัญลักษณชาตินิยมในที่สาธารณะเปนสิ่งถูกกฎหมาย"
  INS_volksraad_events.70.desc: "[INS.GetLeader] ไดอนุมัติคํารองของโฟลคสราดใหยกเลิกขอจํากัดการแสดงธงและสัญลักษณชาตินิยมในพื้นที่สาธารณะของ [INS.GetNameDef] โดยมีเปาหมายหลักเพื่อลดการหัวรุนแรงของนักชาตินิยมรุนใหมจํานวนมาก [INS.GetLeader] ยืนยันวาเราควรวางทาทีตั้งรับในประเด็นนี้ รวมมือกับผูนําชาตินิยมสายสันติ ขณะเดียวกันก็กวาดลางขบวนการปฏิวัติ อยางไรก็ตาม การตัดสินใจขั้นสุดทายอยูที่เรา"
  INS_volksraad_events.71.t: "การแสดงธงแดงขาวไมผิดกฎหมายอีกตอไปแลว!"
  INS_volksraad_events.71.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"
  INS_volksraad_events.100.t: "ญัตติในโฟลคสราดใหผูอยูอาศัยที่ไมใชชาวดัตชไดรับทุนอุดหนุนการศึกษา"
  INS_volksraad_events.100.desc: "[INS.GetLeader] ไดอนุมัติคํารองของโฟลคสราดใหผูอยูอาศัยใน [INS.GetNameDef] ที่ไมใชชาวดัตชสามารถยื่นขอทุนอุดหนุนการศึกษาได คํารองนี้ไดสงตอให [HOL.GetLeader] อนุมัติขั้นสุดทายแลว"
  INS_volksraad_events.101.t: "ชาว[INS.GetAdjective]สามารถยื่นขอทุนอุดหนุนการศึกษาไดแลว"
  INS_volksraad_events.101.desc: "[HOL.GetLeader] ไดลงนามในคํารองแลว และบัดนี้มีผลบังคับใชอยางเปนทางการ การดําเนินการตามคํารองจะเริ่มขึ้นในไมชาเมื่อตกลงรายละเอียดสุดทายได"

### INS - Dutch Interaction Events
  INS_dutch_events.1.t: "[INS.GetNameDefCap] ขอรับการบัญชาการกองทัพเรือของเรา"
  INS_dutch_events.1.desc: "หลังการลมสลายของมาตุภูมิ [INS.GetNameDef] ไดยื่นคํารองขอใหเราโอนการบัญชาการกองกําลังทางเรือของเราไปให [INS.GetNameDef] พวกเขาใหเหตุผลวาการบัญชาการแบบรวมศูนยจะชวยใหประสานงานไดดีขึ้นในชวงเวลาที่ไมเคยเกิดขึ้นมากอนเชนนี้"
  INS_dutch_events.1.a: "หากเปนประโยชนตออุดมการณของเรา เราก็ตองยอม"
  INS_dutch_events.1.b: "เรือของเราจะฟงคําสั่งจากกรุงเฮกเทานั้น"

  INS_dutch_events.2.t: "[HOL.GetNameDefCap] ยอมรับขอเสนอเรื่องการบัญชาการทางเรือของเรา"
  INS_dutch_events.2.desc: "[HOL.GetNameDefCap] ยอมรับขอเสนอของเราใหเราเขารับการบัญชาการกองกําลังทางเรือรวม การเปลี่ยนผานเปนไปอยางราบรื่น และนายทหารทั้งชาว[HOL.GetAdjective]และชาว[INS.GetAdjective]กําลังทํางานเคียงบาเคียงไหลกันเพื่อเสริมความมั่นคงของเราในแปซิฟก"
  INS_dutch_events.2.a: "เราจะรวมกันยึดแปซิฟกไว"

  INS_dutch_events.3.t: "[HOL.GetNameDefCap] ปฏิเสธขอเสนอเรื่องการบัญชาการทางเรือของเรา"
  INS_dutch_events.3.desc: "[HOL.GetNameDefCap] ปฏิเสธขอเสนอของเราเรื่องการบัญชาการทางเรือแบบรวมศูนย โดยอางขอกังวลดานการสงกําลังบํารุงและการบริหาร แมจะนาผิดหวัง แตความรวมมือของเรายังคงดําเนินตอไปผานชองทางอื่นของความพยายามในสงคราม"
  INS_dutch_events.3.a: "เราจะหาทางอื่นเพื่อเพิ่มอิทธิพลทางนาวีของเรา"

  INS_dutch_events.4.t: "[HOL.GetNameDefCap] กอตั้งโครงการนาวี [HOL.GetName]-[INS.GetName]"
  INS_dutch_events.4.desc: "[HOL.GetNameDefCap] ประกาศกอตั้งโครงการนาวี [HOL.GetName]-[INS.GetName] ซึ่งเปนความริเริ่มรวมกันเพื่อปรับโครงสรางและขยายกองกําลังทางทะเลของเรา ความเชี่ยวชาญของชาว[HOL.GetAdjective]และกําลังพลของชาว[INS.GetAdjective]จะรวมกันเปนกระดูกสันหลังของเครือขายปองกันแปซิฟกแหงใหม"
  INS_dutch_events.4.a: "กาวที่มั่นคงสูการอยูรอดรวมกัน"


### INS - Netherlands–Indonesia Union Events
  INS_union_events.1.t: "[HOL.GetNameDefCap] ขอยายรัฐบาลไปยัง [1058.GetName]"
  INS_union_events.1.desc: "เมื่อสูญเสียมาตุภูมิไปแลว [HOL.GetNameDef] ไดแจงเราวารัฐบาลและราชสํานักของพวกเขาจะยายไปยัง [1058.GetName] พวกเขาเขียนถึงความจําเปน ความตอเนื่อง และความจําเปนที่จะตองรักษาราชอาณาจักรใหคงอยู ณ ที่ซึ่งธงยังคงโบกสะบัด"
  INS_union_events.1.a: "สงครามจะดําเนินตอไปจาก [1058.GetName]"
  INS_union_events.1.b: "พวกเขาคิดวาตัวเองเปนใครกัน! นี่ไมใชอะไรอื่นนอกจากความพยายามจะกลับมาครอบงําแบบอาณานิคมอีกครั้ง!"

  INS_union_events.2.t: "[INS.GetNameDefCap] ยอมรับขอเสนอการยายรัฐบาล"
  INS_union_events.2.desc: "[INS.GetNameDefCap] ตกลงใหรัฐบาลพลัดถิ่นของเราตั้งอยูที่ [1058.GetName] การเตรียมการยายกําลังดําเนินอยู และฝายบริหารทั้งสองกําลังประสานงานเพื่อรวมสํานักงานและบุคลากรเขาดวยกัน เราจะรวมกันชูคบเพลิงแหงราชอาณาจักรตอไปจากดินแดนตะวันออก"
  INS_union_events.2.a: "แนวรวมหนึ่งเดียวตอตานศัตรูรวมของเรา"

  INS_union_events.3.t: "[INS.GetNameDefCap] ปฏิเสธขอเสนอการยายรัฐบาล"
  INS_union_events.3.desc: "[INS.GetNameDefCap] ปฏิเสธคําขอของเราที่จะยายไปยัง [1058.GetName] อยางสิ้นเชิง [INS.GetLeader] แถลงวาเราไมมีสิทธิ์เรียกรองความชวยเหลือระดับนี้ ในขณะที่พวกเขาเองก็แบกภาระเกินกําลังอยูแลว"
  INS_union_events.3.a: "ดูเหมือนพวกเขาจะลืมไปแลววาธงผืนใดที่ยังผูกมัดเราไวดวยกัน"

  INS_union_events.4.t: "[HOL.GetNameDefCap] ยายกองทัพไปยัง [1058.GetName]"
  INS_union_events.4.desc: "เรือลําเลียงชุดแรกมาถึงจากมาตุภูมิแลว เรือแตละลําแนนขนัดไปดวยนายทหาร พลทหาร และคลังแสงที่หลงเหลืออยู ตามที่คาดไว ขบวนเรือลําเลียงบางสวนไปไมถึงทา สิ่งที่รอดมาไดจะกลายเปนแกนหลักของกองกําลังเราใน [1058.GetName]"
  INS_union_events.4.a: "พอใหธงยังคงโบกสะบัดตอไป"

  # INS proposed union
  INS_union_events.5.t: "[INS.GetNameDefCap] เสนอสหภาพเนเธอรแลนด–อินโดนีเซีย"
  INS_union_events.5.desc: "ทั่วโลกตางเห็นชัดวาสงครามไมเปนใจใหเรา ประเทศของเราลมสลาย และฐานปฏิบัติการของเรายายไปทางตะวันออกแลว รัฐมนตรีใน [INS.GetName] สงขอเสนอมาใหเราจัดตั้งรัฐสหภาพรวมที่มีสมเด็จพระราชินีวิลเฮลมินาเปนประมุข เพื่อรับประกันความรวมมืออยางเต็มที่ แมดูเหมือนจะไมมีใครพอใจกับขอเสนอนี้นัก แตมันอาจเปนกุญแจสูการอยูรอดของเรา"
  INS_union_events.5.a: "เปนความเสี่ยงที่เราตองยอมรับ ทรงพระเจริญ!"
  INS_union_events.5.b: "เราไมอาจตกลงเรื่องนี้ได"

  INS_union_events.6.t: "[HOL.GetNameDefCap] ยอมรับขอเสนอสหภาพ"
  INS_union_events.6.desc: "หลังการถกเถียงอยางเรงดวนในคณะรัฐมนตรี [HOL.GetLeader] ไดอนุมัติขอเสนอของ[INS.GetAdjective] พระราชกฤษฎีกานั้นสั้นกระชับและไรพิธีรีตอง นับแตนี้รัฐบาลของเราจะดําเนินการเปนหนึ่งเดียวภายใตราชบัลลังกจนกวาสงครามจะสิ้นสุด"
  INS_union_events.6.a: "ขอตกลงทางประวัติศาสตรของทั้งสองชาติ"

  INS_union_events.7.t: "[HOL.GetNameDefCap] ปฏิเสธขอเสนอสหภาพ"
  INS_union_events.7.desc: "สภาใน [HOL.GetNameDef] ไดปดตกขอเสนอเรื่องสหภาพรวม สาสนของพวกเขาหนักแนน ความรวมมือจะดําเนินตอไป แตอํานาจอธิปไตยจะไมถูกแบงปน"
  INS_union_events.7.a: "ถึงอยางไรก็คงไปไมรอดอยูดี"

  # HOL proposed union
  INS_union_events.8.t: "[HOL.GetNameDefCap] เสนอสหภาพเนเธอรแลนด–อินโดนีเซีย"
  INS_union_events.8.desc: "ทั่วโลกตางเห็นชัดวาสงครามไมเปนใจใหเรา [HOL.GetNameDef] ลมสลาย และฐานปฏิบัติการของพวกเขายายมาทางตะวันออกแลว ผูนําชาว[HOL.GetAdjective]สงขอเสนอมาใหเราจัดตั้งรัฐสหภาพรวมที่มีสมเด็จพระราชินีวิลเฮลมินาเปนประมุข เพื่อรับประกันความรวมมืออยางเต็มที่ แมดูเหมือนจะไมมีใครพอใจกับขอเสนอนี้นัก แตมันอาจเปนกุญแจสูการอยูรอดของเรา"
  INS_union_events.8.a: "ตองทําเชนนั้น"
  INS_union_events.8.b: "นี่เปนเพียงความพยายามจะกลับมาครอบงําแบบอาณานิคมอีกครั้ง"

  INS_union_events.9.t: "[INS.GetNameDefCap] ยอมรับขอเสนอสหภาพ"
  INS_union_events.9.desc: "[INS.GetNameDefCap] ตกลงตามขอเสนอของเราแลว ยังไมชัดวาผลจะออกมาอยางไร แตเราตองมุงความสนใจไปที่ความพยายามในสงคราม"
  INS_union_events.9.a: "หากเราจะอดทนใหรอด เราก็ตองอดทนไปดวยกัน"

  INS_union_events.10.t: "[INS.GetNameDefCap] ปฏิเสธขอเสนอสหภาพ"
  INS_union_events.10.desc: "[INS.GetNameDefCap] ปฏิเสธขอเสนอเรื่องสหภาพ ประชาชนและผูนําชาว[INS.GetAdjective]ไมเห็นวาเรื่องนี้จะไปรอดในระยะยาว และคัดคานขอเสนอใด ๆ ที่ตองสละอํานาจ"
  INS_union_events.10.a: "ถึงอยางไรก็คงไปไมรอดอยูดี"

  # Flags
  INS_exile_accepted_flag: "กําลังใหที่พักพิงแก [HOL.GetNameDef] ที่ลี้ภัย"
  INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§Rการกระทํานี้จะทําใหเกมของคุณจบลง§!"

  # Revolution events
  INS_revolution_events.1.t: "[HOL.GetNameDefCap] เคลื่อนกําลังเขาบดขยี้สาธารณรัฐ"
  INS_revolution_events.1.desc: "ตามที่คาดไว รัฐบาลดัตชตอบโตขอเรียกรองเอกราชของเราดวยการสงทหารมายัง [1058.GetName] และเผยแพรโฆษณาชวนเชื่อตอตานสาธารณรัฐผานสื่อ"
  INS_revolution_events.1.a: "เราตองลงมืออยางรวดเร็ว"

  INS_revolution_events.2.t: "[HOL.GetNameDefCap] ขอความชวยเหลือเพิ่มเติม"
  INS_revolution_events.2.desc: "[HOL.GetLeader] เรียกประชุมฉุกเฉินกับผูนําของเรา ขอใหเราชวยเหลือเพิ่มเติมในการยึดอินดีสคืน ถึงขั้นเขารวมความขัดแยงโดยตรง [HOL.GetLeader] แถลงวาสถานการณเลวรายอยางยิ่ง และกองกําลังดัตชไมสามารถผลักดันกองกําลังติดอาวุธฝายปฏิวัติกลับไปได [HOL.GetLeader] สัญญาวาหากเราชวยเหลือ เราจะไดรับบอรเนียวเปนคาตอบแทน"
  INS_revolution_events.2.a: "เพื่อบอรเนียว เราจะทํา"
  INS_revolution_events.2.b: "เราไมสนใจ"
  
  INS_revolution_events.3.t: "[ENG.GetNameDefCap] ตกลงตามความตกลงลอนดอน-บาตาเวีย"
  INS_revolution_events.3.desc: "[ENG.GetNameDefCap] ตกลงเขารวมความขัดแยงโดยตรง โดยสงกองพลหลายกองไปรบที่บาตาเวีย แมเราจะตองสละบอรเนียว แตสิ่งนี้ทําใหสถานการณพลิกมาเปนตอเราอยางมาก"
  INS_revolution_events.3.a: "บอรเนียวคือสิ่งที่ตองเสียสละ"
  
  INS_revolution_events.4.t: "[ENG.GetNameDefCap] ปฏิเสธความตกลงลอนดอน-บาตาเวีย"
  INS_revolution_events.4.desc: "[ENG.GetNameDefCap] ปฏิเสธที่จะชวยเหลือเพิ่มเติมในความขัดแยงนี้ แมจะมีความเรงดวนและรางวัลตอบแทนที่เสนอให [ENG.GetLeader] แถลงวาแมการที่เรารักษาจักรวรรดิอาณานิคมไวไดจะเปนประโยชนสูงสุดตอพวกเขา แตความเสี่ยงที่ความขัดแยงจะลุกลามเปนระดับโลกหากพวกเขาเขารวมนั้นสูงเกินไป และเราจะตองจัดการเรื่องนี้เอง"
  INS_revolution_events.4.a: "สถานการณดูไมดีเลย"
  
  INS_revolution_events.5.t: "[HOL.GetNameDefCap] ขอความชวยเหลือจากเรา"
  INS_revolution_events.5.desc: "นักปฏิวัติในหมูเกาะอินเดียตะวันออกของดัตชประกาศเอกราชจาก [HOL.GetNameDef] และยึดครองเมืองสําคัญหลายแหง [HOL.GetLeader] ติดตอมายังเราอยางเรงดวน ขอใหเราชวยเหลือทางทหารขณะที่พวกเขาเตรียมการบุก"
  INS_revolution_events.5.a: "หากนักปฏิวัติทําสําเร็จ พลเมืองในอาณานิคมของเราอาจไดแรงบันดาลใจใหทําแบบเดียวกัน"
  INS_revolution_events.5.b: "เราไมสนใจ"
  
  INS_revolution_events.6.t: "[ENG.GetNameDefCap] ตกลงชวยเหลือเรา"
  INS_revolution_events.6.desc: "[ENG.GetNameDefCap] ตกลงสงทหารอาสาและยุทโธปกรณไปยัง [1058.GetName] เพื่อชวยเรายึดอํานาจควบคุมอินดีสกลับคืนมา"
  INS_revolution_events.6.a: "งานนี้งายแน"
  
  INS_revolution_events.7.t: "[ENG.GetNameDefCap] ปฏิเสธที่จะชวยเหลือเรา"
  INS_revolution_events.7.desc: "[ENG.GetNameDefCap] ปฏิเสธที่จะชวยเราฟนฟูอํานาจควบคุมเหนืออินดีส โดยยืนกรานวาอินดีสไมใชเรื่องของพวกเขา แมจะอยูใกลความขัดแยงก็ตาม เราจะตองติดอาวุธให KNIL ใหมดวยตัวเอง"
  INS_revolution_events.7.a: "รับไมได!"

  INS_revolution_events.8.t: "กองกําลังติดอาวุธฝายปฏิวัติวางแผนการในอินดีส"
  INS_revolution_events.8.desc: "ตํารวจอาณานิคมของเราในอินเดียตะวันออกไดจับกุมและสอบสวนสมาชิกหลายคนของขบวนการปฏิวัติที่กําลังเติบโตในอินโดนีเซีย ดูเหมือนพวกเขากําลังพยายามสรางกําลังทางทหาร เพื่อเตรียมเปดฉากการรณรงคเรียกรองเอกราชของชาติ เรายังไมแนใจนัก แตพวกเขาอาจกําลังวางแผนการปฏิวัติดวยอาวุธ"
  INS_revolution_events.8.a: "เราตองจับตาดูอยางใกลชิด"
  INS_revolution_events.9.t: "การประกาศเอกราชของอินโดนีเซีย"
  INS_revolution_events.9.desc: "วันนี้ [INS.GetLeader] ไดกลาวสุนทรพจนในชวา ประกาศเอกราชของสาธารณรัฐอินโดนีเซียที่เพิ่งกอตั้งขึ้น แมเราจะไมรับรองสาธารณรัฐใหมนี้ แตกองกําลังติดอาวุธของพวกเขาไดยึดครองดินแดน และตํารวจของเราก็ไมสามารถปกครองพื้นที่เหลานี้ได หากเราไมจัดการสถานการณนี้อยางจริงจัง มันอาจลุกลามเปนสงครามเต็มรูปแบบ"
  INS_revolution_events.9.a: "รับไมได!"
  INS_revolution_events.9.b: "ไมคุมที่จะเปลืองแรง ถาอยากไดเอกราชนักก็ใหไปเถอะ"


  #INS_revolution_events.10.t: ""
  #INS_revolution_events.10.desc: ""
  #INS_revolution_events.10.a: ""
  INS_revolution_events.11.t: "กองกําลังทหารอินดีสหยุดยั้งการรุกของกองกําลังติดอาวุธไดสําเร็จ"
  INS_revolution_events.11.desc: "กองกําลังติดอาวุธฝายสาธารณรัฐกลุมหนึ่งไดเปดปฏิบัติการทางทหารเพื่อยึดครอง [?event_target:INS_temp_occupied_state.GetName] ทหารผูกลาหาญของเราในอินดีสสามารถผลักดันกองกําลังติดอาวุธออกไปไดสําเร็จ และเรายังคงควบคุมภูมิภาคนี้ไดอยางสมบูรณ"
  INS_revolution_events.11.a: "ชัยชนะอีกครั้งของ [HOL.GetNameDef]"
  INS_revolution_events.12.t: "กองกําลังติดอาวุธพยายามยึดครอง [?event_target:INS_temp_occupied_state.GetName]"
  INS_revolution_events.12.desc: "กองกําลังติดอาวุธฝายสาธารณรัฐกลุมหนึ่งไดเปดปฏิบัติการทางทหารเพื่อยึดครอง [?event_target:INS_temp_occupied_state.GetName] ในที่สุดตํารวจและทหารของเราก็ควบคุมสถานการณไวได แตเหตุการณนี้ไดจุดชนวนความไมพอใจใน [?event_target:INS_temp_occupied_state.GetName] โดยพลเรือนจํานวนมากสนับสนุนกองกําลังติดอาวุธและออกมาพูดตอตานรัฐบาล[HOL.GetAdjective]อยางเปดเผย"
  INS_revolution_events.12.a: "เราจะปลอยใหเรื่องนี้บานปลายไมได"
  INS_revolution_events.14.t: "กองกําลังติดอาวุธยึดครอง [?event_target:INS_temp_occupied_state.GetName]"
  INS_revolution_events.14.desc: "แมตํารวจอาณานิคมและทหารของเราจะพยายามอยางเต็มที่ แตกองกําลังติดอาวุธฝายสาธารณรัฐก็เปดปฏิบัติการทางทหารยึดครอง [?event_target:INS_temp_occupied_state.GetName] ไดสําเร็จ ตํารวจและทหารของเราตองอพยพออกมา และประกาศวาไมสามารถปกครองภูมิภาคนี้ไดเนื่องจากการตอตานของกองกําลังติดอาวุธ หากเราปลอยใหกองกําลังติดอาวุธขมเหงเราตอไป เราเสี่ยงที่จะสูญเสียอาณานิคมอันยิ่งใหญของเราไปตลอดกาล"
  INS_revolution_events.14.a: "นี่มันอุกอาจเกินไปแลว!"
  INS_revolution_no_effect_tt: "ไมมีผลใด ๆ"

  INS_revolution_events.19.t: "การเจรจาสันติภาพในอินดีส"
  INS_revolution_events.19.desc: "[HOL.GetLeader] ไดรับเชิญเขาประชุมกับ [INS.GetLeader] เพื่อหารือถึงขอตกลงสันติภาพที่อาจเกิดขึ้น [INS.GetLeader] กลาววามีผูคนสูญเสียชีวิตไปมากเกินไปแลว และเสนอทางออกแบบสองรัฐ โดยคงพรมแดนไวตามปจจุบันพรอมปรับเล็กนอย และยุติการสูรบอยางถาวร"
  INS_revolution_events.19.a: "เราตองตกลง มีผูสูญเสียชีวิตมากเกินไปแลว"
  INS_revolution_events.19.b: "ถาอยากไดสันติภาพนักก็ยอมจํานนเสียสิ!"

  INS_revolution_events.20.t: "[HOL.GetNameDefCap] ตกลงตามทางออกแบบสองรัฐ!"
  INS_revolution_events.20.desc: "[INS.GetLeader] กลับมาจากการประชุมกับ [HOL.GetLeader] พรอมขาวดี ทั้งสองฝายตกลงกันเรื่องทางออกแบบสองรัฐแลว และเราจะเริ่มเคลื่อนยายทหารตามพรมแดนใหมทันที แมจะไมมีใครยินดีที่ตองทิ้งพี่นองชาวอินโดนีเซียไวเบื้องหลัง แตการตัดสินใจยุติการสูรบก็เปนสิ่งที่ดีที่สุดในทายที่สุด"
  INS_revolution_events.20.a: "การนองเลือดจะสิ้นสุดลงเสียที"

  INS_revolution_events.21.t: "[HOL.GetNameDefCap] ปฏิเสธที่จะหยุดสูรบ"
  INS_revolution_events.21.desc: "การประชุมระหวาง [INS.GetLeader] กับ [HOL.GetLeader] ไมเปนไปตามแผน ทั้งสองฝายตางโกรธเคืองอยางเห็นไดชัดและไมยอมประนีประนอม จนการประชุมตองยุติลงกอนกําหนด"
  INS_revolution_events.21.a: "ตองสูญเสียชีวิตอีกสักเทาไร?"

  INS_revolution_events.22.t: "[HOL.GetNameDefCap] ขอความชวยเหลือจากเรา"
  INS_revolution_events.22.desc: "[HOL.GetLeader] ไดเรียกประชุมกับ [FRA.GetLeader] ที่อัมสเตอรดัมเพื่อหารือถึงสถานการณที่ยังดําเนินอยูในอินดีส ระหวางการประชุม [HOL.GetLeader] อธิบายวานักปฏิวัติเริ่มติดอาวุธใหกองกําลังติดอาวุธในอัตราที่กองทัพดัตชตามไมทัน และ [HOL.GetNameDef] กําลังเสี่ยงที่จะสูญเสียอํานาจครอบงําในอาณานิคม [HOL.GetLeader.GetHeShe] ขอใหเราเขารวมความขัดแยงอยางเปนทางการในฝายดัตช และสงกองพลไปยังบาตาเวียเพื่อชวยยึดอินดีสคืน เพื่อแลกเปลี่ยน เราจะไดสิทธิ์ในสุมาตราตะวันออกเฉียงเหนือเมื่อความสงบเรียบรอยกลับคืนมา"
  INS_revolution_events.22.a: "แมการชวยเหลือจะสิ้นเปลือง แตสุมาตราก็อาจทําใหคุมคา"
  INS_revolution_events.22.b: "นี่เปนการขอมากเกินไป"

  INS_revolution_events.23.t: "[FRA.GetNameDefCap] ตกลงชวยเหลือเรา!"
  INS_revolution_events.23.desc: "[FRA.GetNameDefCap] ตอบรับคําขอความชวยเหลือของเรา และไดสงกองพลฝรั่งเศสจํานวนมากไปยังบาตาเวียเพื่อชวยเหลือเราทันที"
  INS_revolution_events.23.a: "ตอนนี้เราไดเปรียบแลว"

  INS_revolution_events.24.t: "[FRA.GetNameDefCap] ปฏิเสธที่จะชวยเหลือ"
  INS_revolution_events.24.desc: "[FRA.GetNameDefCap] ปฏิเสธที่จะชวยเราจัดการกับการปฏิวัติ แมสถานการณจะเรงดวน เราตองเริ่มสะสมอาวุธใหมอยางรวดเร็ว มิฉะนั้นไมนานเราจะถูกขาศึกที่มีจํานวนมากกวาทวมทน"
  INS_revolution_events.24.a: "สถานการณดูไมดีเลย"

  INS_revolution_events.25.t: "จุดจบของสงครามในอินโดนีเซีย"
  INS_revolution_events.25.desc: "กองกําลัง[HOL.GetAdjective]ไดทําลายฐานที่มั่นหลักของกองกําลังติดอาวุธและโคนลมรัฐบาลสาธารณรัฐ ชนชั้นนําและผูบัญชาการฝายสาธารณรัฐถูกจับกุม และรัฐบาลอินดีสกําลังฟนฟูการบริหารในดินแดนอดีตสาธารณรัฐ ตามที่สัญญาไวเพื่อตอบแทนความชวยเหลือของเรา ดินแดนที่ตกลงกันไวไดถูกมอบใหแกเราแลว"
  INS_revolution_events.25.a: "ยอดเยี่ยม!"

  INS_revolution_events.26.t: "จุดจบของสงครามในอินโดนีเซีย"
  INS_revolution_events.26.desc: "กองกําลัง[HOL.GetAdjective]และกองกําลังติดอาวุธฝายสาธารณรัฐสูรบกันยืดเยื้อกวาที่ทั้งสองฝายคาดไวมาก และ [HOL.GetLeader] ไดตกลงลงนามในขอตกลงสันติภาพที่กําหนดทางออกแบบสองรัฐ อยางไรก็ตาม เนื่องจากเราไดทําตามขอตกลงในสวนของเราแลว [HOL.GetLeader] จึงยืนยันวาเราจะยังคงไดรับดินแดนตามที่สัญญาไว"
  INS_revolution_events.26.a: "พัฒนาการที่นาสนใจ"

  INS_revolution_events.27.t: "จุดจบของสงครามในอินโดนีเซีย"
  INS_revolution_events.27.desc: "กองกําลัง[HOL.GetAdjective]และกองกําลังติดอาวุธฝายสาธารณรัฐสูรบกันยืดเยื้อกวาที่ทั้งสองฝายคาดไวมาก และแม [HOL.GetNameDef] จะพยายามอยางเต็มที่และเราเองก็เขารวมทางทหารดวย แตจํานวนมหาศาลของกองกําลังติดอาวุธและลักษณะการรบแบบกองโจรของพวกเขาทําใหความขัดแยงเขาสูภาวะชะงักงันที่ฝายสาธารณรัฐไดเปรียบอยางมาก ดังนั้นวันนี้ [HOL.GetLeader] จึงประกาศวา[HOL.GetLeader.GetHeShe]ไดลงนามในขอตกลงสันติภาพกับสาธารณรัฐ กําหนดทางออกแบบสองรัฐที่เอื้อประโยชนแกฝายสาธารณรัฐ สิ่งที่เหลืออยูของอินดีสเปนเพียงเปลือกของความรุงเรืองในอดีต [HOL.GetLeader] แถลงวาเนื่องจากความขัดแยงจบลงดวยความพายแพ เขาจึงไมสามารถมอบดินแดนที่สัญญาไวเพื่อตอบแทนการสนับสนุนทางทหารของเราได"
  INS_revolution_events.27.a: "นี่มันบาไปแลว!"

  INS_revolution_events.28.t: "การลมสลายของอินดีส"
  INS_revolution_events.28.desc: "แม [HOL.GetNameDef] จะทุมงบประมาณทางทหารมหาศาล และเราเองก็เขารวมความขัดแยงโดยตรง แตจํานวนมหาศาลของกองกําลังติดอาวุธในอินดีสก็สามารถเอาชนะกองกําลังของเรา และยึดครองเมืองสําคัญทั้งหมด โคนลมการบริหารของดัตชและบีบใหยอมจํานน"
  INS_revolution_events.28.a: "แตเราไดรับสัญญาเรื่องดินแดนไวแลวนะ!"

  INS_revolution_events.29.t: "การลมสลายของอินดีส"
  INS_revolution_events.29.desc: "แมเราจะพยายามอยางเต็มที่ แตนักปฏิวัติในอินดีสก็ยึดเมืองสําคัญของเราไดและทําลายรัฐบาลอาณานิคมจากภายใน นายพลของเราถูกจับ และเสนทางการสื่อสารของเราถูกตัดขาด เราไมมีทางเลือกนอกจากยอมรับความพายแพ"
  INS_revolution_events.29.a: "นี่คือโศกนาฏกรรม"

  INS_revolution_events.30.t: "[INS.GetLeader] เสนอขอตกลงหยุดยิงเฉพาะพื้นที่"
  INS_revolution_events.30.desc: "[INS.GetLeader] เสนอใหหยุดยิงเฉพาะพื้นที่ใน [FROM.GetName] โดยสัญญาวาจะถอนทหารของเขาออกจาก [FROM.GetName] หากเราตกลง ซึ่งจะทําใหทหารของเรากลับเขาควบคุมภูมิภาคนี้ไดอีกครั้ง อยางไรก็ตาม มีเงื่อนไขวาเราตองชะลอปฏิบัติการทางทหารหลักไวชั่วคราว ซึ่งจะทําใหนักปฏิวัติมีเวลาวางแผน"
  INS_revolution_events.30.a: "เราจะตกลงตามนี้"
  INS_revolution_events.30.b: "เราปฏิเสธ เราจะยึด [FROM.GetName] คืนดวยกําลัง!"

  INS_revolution_events.31.t: "[HOL.GetNameDefCap] ตกลงหยุดยิงใน [FROM.GetName]"
  INS_revolution_events.31.desc: "การเจรจาหยุดยิงเปนไปดวยดี [HOL.GetLeader] ตกลงตามเงื่อนไขของเรา เราไดสั่งใหผูบัญชาการกองกําลังติดอาวุธใน [FROM.GetName] ถอนกําลังออกทันที"
  INS_revolution_events.31.a: "หวังวาพวกเขาจะทําตามขอตกลงในสวนของตน"

  INS_revolution_events.32.t: "[HOL.GetNameDefCap] ปฏิเสธการหยุดยิง"
  INS_revolution_events.32.desc: "การเจรจาหยุดยิงไมเปนไปตามแผน [HOL.GetLeader] ปฏิเสธที่จะลงนามในขอตกลงและตัดการเจรจาลงกอนที่จะหาขอประนีประนอมได"
  INS_revolution_events.32.a: "รับไมได!"

  INS_revolution_events.33.t: "[INS.GetNameDefCap] ขอใหไกลเกลี่ย"
  INS_revolution_events.33.desc: "ฝายสาธารณรัฐอินโดนีเซียไดรองขออยางเปนทางการใหเราชวยเปนตัวกลางหาขอยุติกับฝายดัตช ที่ปรึกษาของเราในภูมิภาครายงานวาสถานการณกําลังเลวรายลงอยางรวดเร็ว และปฏิบัติการทางทหารของดัตชที่ดําเนินตอไปเสี่ยงจะผลักนักชาตินิยมไปสูออมแขนของโซเวียต เนเธอรแลนดเปนพันธมิตรที่มีคาในยุโรป แตเราไมอาจเพิกเฉยตอความเปนจริงทางการเมืองในเอเชียตะวันออกเฉียงใตได หากอินโดนีเซียตกเปนของคอมมิวนิสตเพราะเรานิ่งเฉย นั่นจะเปนความลมเหลวของเรา"
  INS_revolution_events.33.a: "สงผูไกลเกลี่ยไป"
  INS_revolution_events.33.b: "เราไมอาจเสี่ยงตอความสัมพันธกับดัตชได"
  
  INS_revolution_events.34.t: "[FROM.GetNameDefCap] ตกลงเปนผูไกลเกลี่ย"
  INS_revolution_events.34.desc: "วอชิงตันตกลงเปนตัวกลางไกลเกลี่ยระหวางรัฐบาลของเรากับฝายดัตช ทูตอเมริกันกําลังเดินทางมา และจะมีการเสนอใหหยุดยิงอยางเปนทางการ นี่คือโอกาสครั้งใหญ เมื่อมหาอํานาจอันดับหนึ่งของโลกหนุนหลังการเจรจา ฝายดัตชจะถวงเวลาหรือหันไปใชกําลังไดยากขึ้นมาก เราตองยืนหยัดบนโตะเจรจา และปลอยใหชาวอเมริกันทําในสิ่งที่พวกเขาถนัดที่สุด"
  INS_revolution_events.34.a: "หวังวาดัตชจะมองเห็นเหตุผล"
  
  INS_revolution_events.35.t: "[USA.GetNameDefCap] ประกาศเปนผูไกลเกลี่ย"
  INS_revolution_events.35.desc: "ชาวอเมริกันไดแทรกตัวเขามาในปญหาอินโดนีเซีย วอชิงตันอางวาทําหนาที่เปนผูไกลเกลี่ยที่เปนกลาง แตนัยนั้นชัดเจน หากเราไมอาจคลี่คลายความขัดแยงนี้ใหเปนที่พอใจของพวกเขาได พวกเขาจะใชอํานาจตอรองมหาศาลที่มีอยูเลนงานเรา ผูเจรจาของเราตองระมัดระวังอยางยิ่ง ไมตรีจากอเมริกาไมใชสิ่งที่เราจะทิ้งขวางได"
  INS_revolution_events.35.a: "เราจะยุติเรื่องนี้ตามเงื่อนไขของเราเอง"
  
  INS_revolution_events.36.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะแทรกแซง"
  INS_revolution_events.36.desc: "ชาวอเมริกันปฏิเสธคําขอใหไกลเกลี่ยของเรา วอชิงตันเลือกยืนขางพันธมิตรยุโรปแทนที่จะสนับสนุนการตอสูเพื่อกําหนดชะตากรรมของตนเองของเรา เราตองสูดวยตัวเอง นี่เปนความเจ็บปวด แตการปฏิวัติไมไดเริ่มขึ้นเพราะเราคาดหวังใหมหาอํานาจตางชาติยื่นอิสรภาพให"
  INS_revolution_events.36.a: "เราจะชนะสงครามนี้โดยไมตองพึ่งพวกเขา"
  
  INS_revolution_events.37.t: "[USA.GetNameDefCap] ยื่นคําขาด"
  INS_revolution_events.37.desc: "ชาวอเมริกันหมดความอดทนแลว วอชิงตันยื่นคําขาดเรียกรองใหยุติปฏิบัติการทางทหารทั้งหมดในอินโดนีเซียทันทีและรับรองอธิปไตยของอินโดนีเซีย คําขูนั้นแทบไมไดปดบัง สถานะของเราในประชาคมระหวางประเทศจะไมรอดหากแตกหักกับอเมริกาอยางเปดเผย และเศรษฐกิจของเราก็ไมอาจรับผลที่ตามมาได นายพลของเรายืนยันวายังเอาชนะการรบครั้งนี้ได แตตองแลกดวยราคาเทาใด?"
  INS_revolution_events.37.a: "เราไมมีทางเลือกนอกจากตองทําตาม"
  INS_revolution_events.37.b: "อินโดนีเซียเปนของเรา เราจะไมยอม"
  
  INS_revolution_events.38.t: "ดัตชยอมถอย"
  INS_revolution_events.38.desc: "ทุกอยางจบแลว รัฐบาลดัตชยอมรับคําขาดของอเมริกาและรับรองอธิปไตยของเรา การปกครองแบบอาณานิคมสามรอยหาสิบปสิ้นสุดลง ไมใชเพียงในสนามรบ แตบนโตะเจรจาดวย โดยมีนํ้าหนักของมหาอํานาจที่ยิ่งใหญที่สุดในโลกหนุนหลังอุดมการณของเรา ในที่สุดสาธารณรัฐก็เปนของเราอยางแทจริงและสมบูรณ"
  INS_revolution_events.38.a: "เมอรเดกา!"
  
  INS_revolution_events.39.t: "ดัตชปฏิเสธ"
  INS_revolution_events.39.desc: "ผิดความคาดหมายทั้งปวง ฝายดัตชปฏิเสธคําขาดของอเมริกา นายพลของพวกเขาคงเชื่อวาจะชนะสงครามนี้ไดกอนที่วอชิงตันจะลงมือ พวกเขาคิดผิด เมื่ออเมริกาประกาศสนับสนุนอุดมการณของเราอยางเปดเผย ดุลอํานาจก็เปลี่ยนไปอยางเด็ดขาด ใหพวกเขามาเถอะ เราไมไดสูอยางโดดเดี่ยวอีกตอไปแลว"
  INS_revolution_events.39.a: "โลกยืนเคียงขางเรา"
  
  INS_revolution_events.40.t: "ดัตชยอมรับเงื่อนไขของเรา"
  INS_revolution_events.40.desc: "กรุงเฮกยอมรับคําขาดของเราแลว กองกําลังดัตชในอินโดนีเซียจะยุติการปฏิบัติการ และอธิปไตยจะถูกโอนใหแกสาธารณรัฐอินโดนีเซีย นับเปนบทสรุปที่นาพอใจของเหตุการณอันนาเสียดาย ผลประโยชนของเราในภูมิภาคนี้จะไดรับการตอบสนองดีกวามากดวยอินโดนีเซียที่มั่นคงและเปนเอกราช แทนที่จะคํ้าจุนกิจการอาณานิคมที่ดัตชไมอาจแบกรับไดอีกตอไป"
  INS_revolution_events.40.a: "ผลลัพธที่สมเหตุสมผล"
  
  INS_revolution_events.41.t: "ดัตชทาทายเรา"
  INS_revolution_events.41.desc: "กรุงเฮกปฏิเสธคําขาดของเราโดยสิ้นเชิง กองกําลังดัตชในอินโดนีเซียยังคงปฏิบัติการตอไปโดยทาทายขอเรียกรองของอเมริกาอยางเปดเผย นี่เปนการคํานวณที่ผิดพลาดอยางรายแรง เนเธอรแลนดไมอาจทําสงครามอาณานิคมในเอเชียไปพรอมกับพึ่งพาความชวยเหลือจากอเมริกาในยุโรปได พวกเขาบีบใหเราตองลงมือเอง"
  INS_revolution_events.41.a: "ถาอยางนั้นก็ตามนั้น"

  INS_revolution_events.42.t: "การทอยลูกเตาครั้งสุดทาย"
  INS_revolution_events.42.desc: "รายงานจากหนวยขาวกรองของเราในบาตาเวียระบุถึงการเตรียมการของขาศึกที่ไมเหมือนสิ่งใดที่เราเคยเห็นจากฝายสาธารณรัฐมากอน ดูเหมือนพวกเขากําลังเตรียมปฏิบัติการบอนทําลายเสถียรภาพเพื่อบุกชวาและทําลายโครงสรางพื้นฐานดานการสื่อสารทั้งหมดของเรา ซึ่งแทบจะรับประกันชัยชนะของพวกเขา อยางไรก็ตาม ปฏิบัติการนี้เสี่ยงอยางยิ่ง และตองทุมทรัพยากรเกือบทั้งหมดที่มี นายพลของเราประเมินวาพวกเขาจะคงสภาพนี้ไวไดเพียงราวสองป และไมอาจถอนตัวไดงาย ๆ หากเรายันพวกเขาไวไดนานพอ เราจะบดขยี้รัฐบาลและการปฏิวัติของพวกเขาไดเหมือนบี้มะเขือเทศสุกงอม"
  INS_revolution_events.42.a: "การรบครั้งสุดทายจึงเริ่มตนขึ้น"

  INS_revolution_events.43.t: "จัดตั้งฐานกองกําลังติดอาวุธใน [FROM.GetName] แลว"
  INS_revolution_events.43.desc: "ความพยายามของเราใน [FROM.GetName] ประสบความสําเร็จ และผูนํากองกําลังติดอาวุธทองถิ่นยืนยันวาพรอมจะลงมือเมื่อถึงเวลา"
  INS_revolution_events.43.a: "เราตองพยายามตอไป"

  # Chaos Events
  INS_chaos_events.1.t: "การรบที่สุราบายา"
  INS_chaos_events.1.desc: "หลังการประกาศเอกราช อํานาจในสุราบายาก็ไรเสถียรภาพ วันนี้กลุมผูภักดีตอดัตชไดชักธงอาณานิคมผืนเกาขึ้นบนยอดอดีตโรงแรมยามาโตะ เหลาเยาวชนเปอมูดาในทองถิ่นบุกเขาไปในอาคารและปลดธงลง แลวชักธงแดงขาวของอินโดนีเซียขึ้นแทน เหตุการณนี้บานปลายกลายเปนการปะทะอยางรุนแรงและไรระเบียบ"
  INS_chaos_events.1.a: "สมควรแลว!"
  INS_chaos_events.1.b: "สั่งหยุดยิง เราเสี่ยงใหเรื่องบานปลายไมได"

  INS_chaos_events.2.t: "พรรคสังคมนิยมควบรวมกัน"
  INS_chaos_events.2.desc: "สองพรรคสังคมนิยมที่ใหญที่สุดในอินโดนีเซีย ซึ่งนําโดยอามีร ชารีฟุดดิน และซูตัน ชาหรีร ประกาศควบรวมกันในวันนี้ กอตั้งเปนพรรคสังคมนิยมอินโดนีเซียที่เปนเอกภาพ ซึ่งเพิ่มอิทธิพลทางการเมืองของพรรคอยางมาก และอาจเปนภัยตอรัฐบาลของเรา"
  INS_chaos_events.2.a: "อนุญาต"
  INS_chaos_events.2.b: "ไมมีเวลาเลนการเมือง ประกาศกฎอัยการศึก!"

  INS_chaos_events.3.t: "ความพยายามลอบสังหารซูการโนลมเหลว"
  INS_chaos_events.3.desc: "วันนี้มีความพยายามลอบสังหารซูการโนโดยทหารดัตชผูหนึ่ง ซึ่งยิงใสรถของซูการโน โชคดีที่ซูการโนไมไดอยูในรถ แตคนขับรถของเขาไดรับบาดเจ็บสาหัส แมความพยายามครั้งนี้จะลมเหลว แตชัดเจนวานี่จะไมใชครั้งสุดทาย ทั้งจากทหารดัตชและฝายคานชาวอินโดนีเซีย"
  INS_chaos_events.3.a: "เราตองฟนฟูความสงบเรียบรอย!"

  INS_chaos_events.4.t: "การลอบสังหารซูการโน"
  INS_chaos_events.4.desc: "วันนี้เปนวันแหงโศกนาฏกรรมของอินโดนีเซีย ซูการโนถูกลอบสังหารอีกครั้ง และครั้งนี้สําเร็จ เราตองไมปลอยใหเกิดวิกฤตการสืบทอดอํานาจขึ้น ตองฟนฟูความสงบเรียบรอยโดยเร็ว มิฉะนั้นสาธารณรัฐจะลมสลาย"
  INS_chaos_events.4.a: "รองประธานาธิบดีฮัตตาจะรับชวงตอ"
  INS_chaos_events.4.b: "พรรคสังคมนิยมจะรับชวงตอ"
  INS_chaos_events.4.c: "ลมลางสาธารณรัฐ ตัน มะละกาจะนําเราสูชัยชนะ!"

  # Loyalist Events
  INS_loyalist_events.1.t: "[INS.GetLeader] ขอใหโอนยายอองรี วิงเคิลมัน"
  INS_loyalist_events.1.desc: "[INS.GetLeader] ติดตอเราเกี่ยวกับความขัดแยงที่กําลังเกิดขึ้นทั่วโลกและสถานะอันตรายที่ [INS.GetNameDef] กําลังเผชิญ [INS.GetLeader] เสนอใหโอนยายอองรี วิงเคิลมัน อดีตผูบัญชาการกองทัพบกหลวงเนเธอรแลนดอินเดียตะวันออก กลับไปยัง [INS.GetNameDef] อยางเปนทางการ เพื่อรับประกันความมั่นคงของอาณานิคม"
  INS_loyalist_events.1.a: "เราจะจัดการโอนยายเขาทันที"
  INS_loyalist_events.1.b: "มาตุภูมิยังตองการอองรี วิงเคิลมัน"
  INS_loyalist_events.2.t: "[HOL.GetLeader] ตกลงโอนยายอองรี วิงเคิลมัน"
  INS_loyalist_events.2.desc: "[INS.GetLeader] เดินทางกลับจาก [HOL.GetNameDef] หลังพบกับ [HOL.GetLeader] การประชุมเปนไปดวยดี [HOL.GetLeader] รับทราบสถานการณและตกลงโอนยายวิงเคิลมันทันที อองรี วิงเคิลมันกําลังเดินทางไปยัง [1058.GetName] เพื่อรอคําสั่งจากเรา"
  INS_loyalist_events.2.a: "นี่จะเปนประโยชนอยางยิ่ง"
  INS_loyalist_events.3.t: "[HOL.GetLeader] ปฏิเสธที่จะโอนยายอองรี วิงเคิลมัน"
  INS_loyalist_events.3.desc: "[INS.GetLeader] เดินทางกลับจาก [HOL.GetNameDef] หลังพบกับ [HOL.GetLeader] นาเสียดายที่อองรี วิงเคิลมันจะไมถูกสงมายังอินดีส และเราจะตองปองกันตัวเองโดยไมมีเขา"
  INS_loyalist_events.3.a: "เราตองรีบคิดแผนใหม"

  INS_henri_winkelman_tt: "คําขอโอนยายอองรี วิงเคิลมันถูกปฏิเสธ"

  # MALAYA CHAIN - Independent Malaya
  
  INS_loyalist_events.4.t: "[FROM.GetNameDefCap] เสนอการรวมชาติ"
  INS_loyalist_events.4.desc: "คณะผูแทน[FROM.GetAdjective]เดินทางมาถึง [ROOT.Capital.GetCapitalVictoryPointName] พรอมขอเสนอใหรวมชาติ พวกเขาชี้ถึงมรดกมลายูรวมกันของประชาชนทั้งสองฝาย และระบุวาพรมแดนระหวางสองชาตินั้นถูกขีดขึ้นโดยผูบริหารอาณานิคมชาวยุโรป ไมใชโดยผูคนที่อาศัยอยูบนแผนดินนี้ ขอเสนอนี้จะยุบรัฐบาลทั้งสองแลวจัดตั้งใหมเปนรัฐเดียว"
  INS_loyalist_events.4.a: "เรายอมรับขอเสนอ"
  INS_loyalist_events.4.b: "เราตองปฏิเสธ"
  
  INS_loyalist_events.5.t: "[FROM.GetNameDefCap] ยอมรับการรวมชาติ"
  INS_loyalist_events.5.desc: "นักการทูตของเรากลับจาก [FROM.Capital.GetCapitalVictoryPointName] พรอมขาวดียิ่ง รัฐบาล[FROM.GetAdjective]ยอมรับขอเสนอของเรา และเจาหนาที่ของพวกเขากําลังเตรียมการผนวกดินแดนเขาสูการบริหารของเราแลว"
  INS_loyalist_events.5.a: "รวมกันเราแข็งแกรงกวา!"
  
  INS_loyalist_events.6.t: "[FROM.GetNameDefCap] ปฏิเสธการรวมชาติ"
  INS_loyalist_events.6.desc: "นักการทูตของเรากลับจาก [FROM.Capital.GetCapitalVictoryPointName] มือเปลา รัฐบาล[FROM.GetAdjective]ไมยินดีจะพิจารณาขอเสนอ ใหเหตุผลมาเพียงเล็กนอย และคณะผูแทนของเราก็ถูกสงกลับบานพรอมพิธีการตามมารยาทเพียงเทานั้น"
  INS_loyalist_events.6.a: "พวกเขาเสียเอง"
  
  # MALAYA CHAIN - Subject Malaya (Overlord receives)
  
  INS_loyalist_events.7.t: "[FROM.GetNameDefCap] เรียกรองใหลงประชามติใน [MAL.GetName]"
  INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] รองขออยางเปนทางการใหเราอนุญาตการลงประชามติใน [MAL.GetName] วาดวยการรวมเขากับรัฐของพวกเขา เอกอัครราชทูตของพวกเขาพูดตรง ๆ ถึงผลที่นาจะเกิดขึ้น โดยระบุวาชาวมลายูทั้งสองฝงพรมแดนถือวาตนเปนชาติเดียวกัน การอนุญาตใหลงคะแนนเสียงแทบจะหมายถึงการเสีย [MAL.GetName] ไปอยางแนนอน"
  INS_loyalist_events.7.a: "ใหประชาชนตัดสินใจ"
  INS_loyalist_events.7.b: "เราจะไมอนุญาต"
  
  # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
  
  INS_loyalist_events.8.t: "[FROM.GetNameDefCap] อนุมัติการลงประชามติรวมชาติ"
  INS_loyalist_events.8.desc: "เจาเหนือหัวของเราอนุญาตให [FROM.FROM.GetNameDef] จัดการลงประชามติในประเทศของเรา นักรณรงคชาว[FROM.FROM.GetAdjective]หลั่งไหลเขามาเปนจํานวนมาก และการลงคะแนนจะเริ่มขึ้นภายในเดือนนี้ คําถามที่ประชาชนของเราตองตอบนั้นเรียบงาย เราตองการเขารวมกับ [FROM.FROM.GetNameDef] หรือตองการคงอยูอยางที่เปน?"
  INS_loyalist_events.8.a: "เราจะเขารวมกับพวกเขา"
  INS_loyalist_events.8.b: "เราขอคงอยูอยางเดิม"
  
  # MALAYA CHAIN - Overlord informed of MAL's choice
  
  INS_loyalist_events.9.t: "[FROM.GetNameDefCap] ลงมติไมรวมชาติ"
  INS_loyalist_events.9.desc: "การลงประชามติใน [FROM.GetName] เสร็จสิ้นแลว ประชาชนชาว[FROM.GetAdjective]ลงมติขออยูภายใตการบริหารของเราตอไป นักรณรงคชาว[FROM.FROM.GetAdjective]ไดเดินทางกลับไปแลว"
  INS_loyalist_events.9.a: "เปนไปตามคาด"
  
  INS_loyalist_events.10.t: "[FROM.GetNameDefCap] ลงมติรวมชาติ"
  INS_loyalist_events.10.desc: "การลงประชามติใน [FROM.GetName] เสร็จสิ้นลงดวยคะแนนเสียงทวมทนสนับสนุนการรวมกับ [FROM.FROM.GetNameDef] ผูบริหารของเราในภูมิภาครายงานวาผลเปนไปตามคาด เรามีพันธะตองเคารพผลนี้"
  INS_loyalist_events.10.a: "เราใหคํามั่นไวแลว"
  
  # MALAYA CHAIN - INS receives result
  
  INS_loyalist_events.11.t: "การลงประชามติมลายาประสบความสําเร็จ"
  INS_loyalist_events.11.desc: "ประชาชนแหง [MAL.GetName] ลงมติเขารวมกับชาติของเรา เจาหนาที่ชาว[MAL.GetAdjective]กําลังรวมมือกับฝายบริหารของเราเพื่อเริ่มการถายโอนอํานาจ แผนที่โลกมลายูจะมีพรมแดนลดลงอีกหนึ่งเสน"
  INS_loyalist_events.11.a: "ยินดีตอนรับกลับบาน"
  
  INS_loyalist_events.12.t: "การรวมมลายาถูกปฏิเสธ"
  INS_loyalist_events.12.desc: "ขอเสนอรวมชาติกับ [MAL.GetName] ของเราถูกปดตก รัฐบาล[MAL.GetAdjective] หรือผูที่อยูเหนือพวกเขา ตัดสินใจไมเห็นดวย เราคงตองกลับมาพิจารณาเรื่องนี้ใหมในเวลาที่เหมาะสมกวานี้"
  INS_loyalist_events.12.a: "เราจะไมลืมเรื่องนี้"

  INS_loyalist_events.13.t: "[FROM.GetNameDefCap] เสนอการประนีประนอมเรื่องสิงคโปร"
  INS_loyalist_events.13.desc: "รัฐบาล[FROM.GetAdjective]ยื่นขอเสนอเกี่ยวกับสิงคโปรมายังเรา พวกเขาขออํานาจอธิปไตยเหนือเกาะ โดยอางถึงที่ทางของเกาะนี้ในโลกมลายู เพื่อแลกเปลี่ยน พวกเขาพรอมรับประกันวาเราจะยังเขาใชทาเรือ ฐานทัพ และสิทธิในการขุดทรัพยากรทั้งหมดที่มีผลอยูในปจจุบันไดตอไป"
  INS_loyalist_events.13.a: "ขอตกลงที่ยุติธรรม"
  INS_loyalist_events.13.b: "สิงคโปรไมใชของขาย"
  
  INS_loyalist_events.14.t: "ยอมรับการประนีประนอมเรื่องสิงคโปร"
  INS_loyalist_events.14.desc: "ขอตกลงไดรับการยอมรับแลว สิงคโปรจะถูกโอนมาอยูภายใตการควบคุมของเรา ขณะที่ผูควบคุมเดิมยังคงสิทธิ์เขาใชทาเรือทั้งทางการคาและการทหาร บัดนี้ธงของเราโบกสะบัดเหนือหนึ่งในทาเรือที่สําคัญที่สุดในเอเชีย"
  INS_loyalist_events.14.a: "ชองแคบเปนของเราแลว"
  
  INS_loyalist_events.15.t: "การประนีประนอมเรื่องสิงคโปรถูกปฏิเสธ"
  INS_loyalist_events.15.desc: "ขอเสนอของเราถูกปฏิเสธ ผูควบคุมสิงคโปรไมยอมสละเกาะนี้ไมวาดวยเงื่อนไขใด เราเสนอทุกอยางใหแลวยกเวนอํานาจอธิปไตย แตก็ยังไมพอ"
  INS_loyalist_events.15.a: "ถาอยางนั้นก็ตามนั้น"

  INS_loyalist_events.16.t: "[FROM.GetNameDefCap] ขอใหโอนซีลอน"
  INS_loyalist_events.16.desc: "รัฐบาล[FROM.GetAdjective]ไดยื่นคําขออยางเปนทางการใหโอนซีลอน นักการทูตของพวกเขาอางถึงความเชื่อมโยงทางการคาและชาติพันธุอันยาวนานระหวางเกาะนี้กับโลกมลายู พูดกันตรง ๆ ขออางนี้คอนขางออน แต [FROM.GetNameDef] เติบโตจนทรงอํานาจพอที่คําขอเชนนี้ตองไดรับการพิจารณาอยางจริงจัง"
  INS_loyalist_events.16.a: "ก็ได ยกใหพวกเขาไป"
  INS_loyalist_events.16.b: "ซีลอนจะยังอยูภายใตการควบคุมของเรา"
  
  INS_loyalist_events.17.t: "โอนซีลอนแลว"
  INS_loyalist_events.17.desc: "การโอนซีลอนเสร็จสมบูรณ ฝายบริหารของเราเริ่มสงเจาหนาที่ไปยังเกาะ และการสงมอบดําเนินไปโดยไมมีเหตุรายใด ๆ บัดนี้เรามีที่มั่นอยูทั้งสองฝงชองแคบ"
  INS_loyalist_events.17.a: "ยอดเยี่ยม"
  
  INS_loyalist_events.18.t: "คําขอเรื่องซีลอนถูกปฏิเสธ"
  INS_loyalist_events.18.desc: "คําขอใหโอนซีลอนของเราถูกปฏิเสธ ผูควบคุมในปจจุบันไมมีเจตนาจะสละเกาะนี้ และนักการทูตของเรารายงานวาการหารือเรื่องนี้ตอไปคงไรผล"
  INS_loyalist_events.18.a: "ไวคราวหนาก็แลวกัน"

  INS_loyalist_events.19.t: "[FROM.GetNameDefCap] เรียกรองใหลงประชามติในปาปว"
  INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] เรียกรองใหเราอนุญาตการลงประชามติในปาปวตะวันออก ฝง[FROM.GetAdjective]ของพรมแดนมีถนนสายใหมตัดผานปา มีสถานพยาบาลที่มีแพทยของรัฐประจํา และมีโรงเรียนที่สอนดวยภาษาทองถิ่น สวนฝงของเรา ผูวาการคนลาสุดไปเยือนพอรตมอรสบีเพียงสองครั้งในสามป เอกอัครราชทูต[FROM.GetAdjective]แทบไมจําเปนตองพูดอะไรมากไปกวานั้น"
  INS_loyalist_events.19.a: "ใหพวกเขาลงคะแนนไป"
  INS_loyalist_events.19.b: "เราจะไมอนุญาตเรื่องนี้"

  INS_loyalist_events.20.t: "อนุมัติการลงประชามติปาปว"
  INS_loyalist_events.20.desc: "ออสเตรเลียตกลงใหจัดการลงประชามติ ทุกเขตในปาปวตะวันออกใหผลลัพธเดียวกัน การลงทุนของเราในครึ่งตะวันตกของเกาะพูดแทนไดดังกวาโปสเตอรหาเสียงใด ๆ"
  INS_loyalist_events.20.a: "ในที่สุดเกาะก็เปนหนึ่งเดียว"
  
  INS_loyalist_events.21.t: "การลงประชามติปาปวถูกปฏิเสธ"
  INS_loyalist_events.21.desc: "ออสเตรเลียปฏิเสธ ผูวาการของพวกเขาในพอรตมอรสบีออกแถลงการณระบุวาคําขอนี้เปนการหยามอธิปไตยของออสเตรเลีย สวนชาวปาปวเองกลับไมไดรับการถามความเห็นเลย"
  INS_loyalist_events.21.a: "เราจะจดจําเรื่องนี้ไว"

  INS_loyalist_events.22.t: "[FROM.GetNameDefCap] เรียกรองติมอรตะวันออก"
  INS_loyalist_events.22.desc: "รัฐบาล[FROM.GetAdjective]ยื่นขอเรียกรองอยางเปนทางการใหสงมอบติมอรตะวันออก เอกอัครราชทูตของพวกเขาชี้วากองรักษาการณของเราที่นั่นมีกําลังไมถึงสองรอยนาย และลิสบอนแทบไมไดจัดสรรอะไรใหดินแดนนี้มาหลายปแลว จากนั้นเขาก็ถามวาเราคิดวากําลังยึดอะไรไวกันแน"
  INS_loyalist_events.22.a: "ไมคุมที่จะสูเพื่อมัน"
  INS_loyalist_events.22.b: "ติมอรเปนของเราและจะเปนเชนนั้นตอไป"

  INS_loyalist_events.23.t: "สงมอบติมอรตะวันออกแลว"
  INS_loyalist_events.23.desc: "ผูควบคุมติมอรตะวันออกเริ่มถอนกองรักษาการณและรื้อถอนการบริหารอาณานิคมแลว ไมนานทั้งเกาะจะอยูภายใตอํานาจของ[INS.GetAdjective]"
  INS_loyalist_events.23.a: "สมควรเปนเชนนั้น"

  INS_loyalist_events.24.t: "ขอเรียกรองติมอรตะวันออกถูกปฏิเสธ"
  INS_loyalist_events.24.desc: "ผูวาการอาณานิคมในดิลีเขียนจดหมายปฏิเสธขอเรียกรองของเราดวยตนเอง ยืนกรานวาติมอรตะวันออกยังคงเปนดินแดนในอธิปไตยของรัฐบาลของเขา เสนาธิการทหารของเราไดรางแผนรองรับไวแลว หากคณะรัฐมนตรีตองการเดินหนาเรื่องนี้ตอ"
  INS_loyalist_events.24.a: "เริ่มการเตรียมการ"

  INS_loyalist_events.25.t: "[FROM.GetNameDefCap] เสนอการรวมชาติ"
  INS_loyalist_events.25.desc: "คณะผูแทน[FROM.GetAdjective]เดินทางมาพรอมขอเสนอใหรวมสองสาธารณรัฐของเราเขาดวยกัน พวกเขาใหเหตุผลวาประชาชนของเรามีรากเหงาออสโตรนีเซียนรวมกันที่เกาแกกวาพรมแดนอาณานิคมที่แบงแยกเรามาก และรัฐเดียวที่ครอบคลุมทั้งหมูเกาะจะเปนมหาอํานาจอันดับหนึ่งในเอเชียตะวันออกเฉียงใต การยอมรับหมายถึงการยุบรัฐบาลของเราและรวมเขากับรัฐบาลของพวกเขา"
  INS_loyalist_events.25.a: "เรายอมรับ"
  INS_loyalist_events.25.b: "เราตอสูเพื่อสาธารณรัฐนี้มาอยางหนักเกินไป"
  
  INS_loyalist_events.26.t: "[FROM.GetNameDefCap] ยอมรับการรวมชาติ"
  INS_loyalist_events.26.desc: "รัฐบาล[FROM.GetAdjective]ยอมรับขอเสนอของเราแลว เจาหนาที่ของพวกเขากําลังประสานงานกับเจาหนาที่ของเราเพื่อเริ่มกระบวนการรวมประเทศ จากอาเจะหถึงลูซอน จากบอรเนียวถึงมินดาเนา บัดนี้ชาติของเราแผไพศาลครอบคลุมทั่วทั้งหมูเกาะมลายู"
  INS_loyalist_events.26.a: "ยุคใหมเริ่มตนขึ้น"
  
  INS_loyalist_events.27.t: "[FROM.GetNameDefCap] ปฏิเสธการรวมชาติ"
  INS_loyalist_events.27.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธ การตอสูเพื่อเอกราชของพวกเขาเองยังเพิ่งผานมาไมนานและตองแลกดวยราคาแพงเกินกวาจะยอมสละอธิปไตยใหรัฐอื่น ขอเสนอนี้จึงถูกพักไว"
  INS_loyalist_events.27.a: "นาเสียดาย"

  INS_loyalist_events.28.t: "[FROM.GetNameDefCap] ขอใหลงประชามติใน [PHI.GetName]"
  INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] รองขออยางเปนทางการใหเราอนุญาตการลงประชามติใน [PHI.GetName] วาดวยการรวมชาติ นักการทูตของพวกเขาเนนยํ้าถึงบรรพบุรุษออสโตรนีเซียนรวมกันของประชาชนทั้งสอง และความไมเปนธรรมชาติของพรมแดนอาณานิคมที่แบงแยกพวกเขา หากการลงคะแนนเกิดขึ้น ผลลัพธมีแนวโนมจะเปนประโยชนตอ [FROM.GetNameDef]"
  INS_loyalist_events.28.a: "ประชาชนควรมีสิทธิ์ออกเสียง"
  INS_loyalist_events.28.b: "ไมมีทางเปนไปได"

  INS_loyalist_events.29.t: "อนุมัติการลงประชามติรวมชาติ"
  INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] เสนอใหรวมสองชาติของเราเขาดวยกันบนพื้นฐานของมรดกออสโตรนีเซียนรวมกัน เจาเหนือหัวของเราอนุญาตใหพวกเขาจัดการลงประชามติในเรื่องนี้ และนักรณรงคชาว[FROM.FROM.GetAdjective]ก็เริ่มเดินทางมาถึงแลว ผลการลงคะแนนจะเปนตัวตัดสินวาสาธารณรัฐของเราจะเขารวมกับ [FROM.FROM.GetNameDef] หรือคงอยูภายใตการจัดการแบบเดิม"
  INS_loyalist_events.29.a: "ขอเสนอนี้นาสนใจ"
  INS_loyalist_events.29.b: "ไมมีทางเด็ดขาด"

  INS_loyalist_events.30.t: "[FROM.GetNameDefCap] ลงมติไมรวมชาติ"
  INS_loyalist_events.30.desc: "นับคะแนนในหีบเสร็จแลว และนักรณรงคชาว[FROM.FROM.GetAdjective]ก็ถูกสงกลับบานไป ประชาชนชาว[FROM.GetAdjective]ลงมติขออยูตอ ดูเหมือนเอกราชยังคงมีความหมายใน [FROM.Capital.GetCapitalVictoryPointName]"
  INS_loyalist_events.30.a: "เรื่องนี้จบเพียงเทานี้"
  
  INS_loyalist_events.31.t: "[FROM.GetNameDefCap] ลงมติรวมชาติ"
  INS_loyalist_events.31.desc: "นับคะแนนในหีบเสร็จแลว ประชาชนชาว[FROM.GetAdjective]เลือก [FROM.FROM.GetNameDef] แทนเรา และคะแนนก็หางกันไมนอย ผูบริหารของเรากําลังไดรับคําสั่งใหเริ่มการสงมอบแลว"
  INS_loyalist_events.31.a: "ประชาชนไดตัดสินแลว"

  INS_loyalist_events.32.t: "[PHI.GetNameDefCap] ลงมติรวมชาติ"
  INS_loyalist_events.32.desc: "การลงประชามติของ[PHI.GetAdjective]จบลงโดยเปนผลดีตอเรา รัฐบาลของพวกเขายอมรับผลและไดติดตอกระทรวงการตางประเทศของเราเพื่อจัดการถายโอนอํานาจ"
  INS_loyalist_events.32.a: "ในที่สุดก็ไดอยูรวมกัน"

  INS_loyalist_events.33.t: "[PHI.GetNameDefCap] ปฏิเสธการรวมชาติ"
  INS_loyalist_events.33.desc: "รัฐบาล[PHI.GetAdjective]ปฏิเสธขอเสนอรวมชาติของเรา รัฐสภาของพวกเขาลงมติควํ่าโดยไมแมแตจะพิจารณาวาระที่สอง เราเสนอที่ทางในชาติที่ยิ่งใหญที่สุดในเอเชียตะวันออกเฉียงใตให แตพวกเขากลับถมนํ้าลายใส"
  INS_loyalist_events.33.a: "แคอุปสรรคชั่วคราว ไมมีอะไรมากกวานั้น"

  INS_communist_events.6.t: "สายลับ[FROM.GetAdjective]ปลุกปนใน [ROOT.GetName]"
  INS_communist_events.6.desc: "หนวยขาวกรองของเรายืนยันสิ่งที่เราสงสัยมานาน [FROM.GetNameDefCap] ดําเนินการบอนทําลายภายในพรมแดนของเราอยางตอเนื่อง ทั้งใหทุนแกกลุมหัวรุนแรง แจกจายใบปลิวยุยงปลุกปน และจัดการนัดหยุดงานในหมูคนงาน สายลับของพวกเขาแทรกซึมเขาไปในสหภาพแรงงานและสหกรณชนบท และบัดนี้กําลังเรียกรองอยางเปดเผยใหโคนลมรัฐบาลของเรา สถานการณมาถึงจุดวิกฤตแลว เราตองลงมืออยางเด็ดขาดกอนที่มันจะหลุดจากการควบคุม"
  INS_communist_events.6.a: "เรื่องนี้ยอมไมได!"

  INS_communist_events.7.t: "การบอนทําลายของคอมมิวนิสตใน [FROM.GetName]"
  INS_communist_events.7.desc: "รายงานที่นากังวลสงมาถึงเราจาก [FROM.FROM.GetName] สายลับที่ปฏิบัติการในนามของ [FROM.GetNameDef] กําลังปลุกกระแสปฏิวัติในหมูประชาชนทองถิ่น ฉวยประโยชนจากความคับแคนที่มีตอการบริหารของเราเพื่อสรางแรงสนับสนุนใหคอมมิวนิสตยึดอํานาจ หากปลอยไว [FROM.FROM.GetNameDef] อาจตกไปอยูในมือพวกหัวรุนแรงทั้งหมด และความเนาเฟะนี้อาจลามไปยังดินแดนอื่นของเราดวย"
  INS_communist_events.7.a: "เราตองขยี้มันใหสิ้นกอนที่จะลุกลาม!"

  INS_communist_events.8.t: "โฆษณาชวนเชื่อ[FROM.GetAdjective]แพรสะพัดใน [ROOT.GetName]"
  INS_communist_events.8.desc: "ใบปลิวและแผนพับที่มาจาก[FROM.GetAdjective]ปรากฏในโรงงาน ตลาด และมหาวิทยาลัยของเราบอยขึ้นเรื่อย ๆ เนื้อหาเทศนาถึงสงครามชนชั้นและสัญญาวาจะปลดปลอยดวยการปฏิวัติ ตํารวจของเรารายงานวาเนื้อหาเหลานี้ไดรับการตอบรับอยางดีในหมูผูไมพอใจ ถึงจะหยาบแตก็ไดผล และการแพรกระจายก็ไมมีวี่แวววาจะชะลอลง"
  INS_communist_events.8.a: "หาตัวคนที่แจกจายของสกปรกพวกนี้ใหเจอ!"

  ## Call for Revolution - Main Event (sent to target) ##
 
  INS_communist_events.1.t: "การปฏิวัติใน [ROOT.GetName]"
  INS_communist_events.1.desc: "สถานการณเลวรายเกินกวาจะกอบกูไดแลว การปลุกปนของ[FROM.GetAdjective]ตลอดหลายเดือนไดผล และขบวนการคอมมิวนิสตใน [ROOT.GetName] ไมอาจถูกควบคุมดวยมาตรการปกติไดอีกตอไป การนัดหยุดงานทั่วไปทําใหเมืองตาง ๆ เปนอัมพาต กองโจรติดอาวุธครองอํานาจเหนือจังหวัดทั้งจังหวัด และรัฐบาล[FROM.GetAdjective]ก็ทุมกําลังทั้งหมดหนุนหลังนักปฏิวัติ กองกําลังรักษาความมั่นคงของเราตึงมือ และความภักดีของพวกเขาก็ไมแนนอนอีกตอไป เราตองตัดสินใจเดี๋ยวนี้วาจะสูเพื่อความอยูรอดของรัฐ หรือยอมรับสิ่งที่หลีกเลี่ยงไมไดกอนที่เลือดจะนองมากกวานี้"
  INS_communist_events.1.a: "รวมพลกองทัพ เราจะไมยอมจํานนงาย ๆ"
  INS_communist_events.1.b: "การตอตานตอไปมีแตจะนําหายนะมาสูประชาชนของเรา"
  INS_communist_events.1.c: "บางทีถาเราใหที่นั่งบนโตะแกพวกเขา เราอาจยังควบคุมสถานการณได"
 
  ## Civil War Chosen - sent to Indonesia ##
 
  INS_communist_events.2.t: "[FROM.GetNameDefCap] เลือกที่จะสู"
  INS_communist_events.2.desc: "รัฐบาลใน [FROM.GetName] ปฏิเสธที่จะยอมจํานน และสั่งใหกองทัพปราบปรามขบวนการปฏิวัติดวยกําลัง สหายของเราที่นั่นกําลังเขาประจําที่และยึดฐานที่มั่นสําคัญ การตอสูคงไมจบลงในเร็ววัน แตประชาชนแหง [FROM.GetName] ไดเลือกแลว และเราจะทําใหแนใจวาพวกเขาจะไมตองสูอยางโดดเดี่ยว"
  INS_communist_events.2.a: "การปฏิวัติรุดหนาตอไป"
 
  ## Surrender - sent to Indonesia ##
 
  INS_communist_events.3.t: "[FROM.GetNameDefCap] ลมสลายแลว"
  INS_communist_events.3.desc: "รัฐบาลเกาใน [FROM.GetName] ยอมจํานนแลว เมื่อตองเผชิญกับขบวนการปฏิวัติเต็มรูปแบบ และรูแนชัดวา [ROOT.GetNameDef] หนุนหลังอยู พวกเขาก็มองไมเห็นหนทางอื่นนอกจากยอมแพ อํานาจถูกถายโอนใหพรรคคอมมิวนิสตทองถิ่น และรัฐบาลใหมก็เริ่มติดตอขอคําชี้แนะจากเราแลว อีกหนึ่งชาติไดรับการปลดปลอยจากเงื้อมมือของระบอบเกา"
  INS_communist_events.3.a: "ชัยชนะอันยิ่งใหญของมวลชนผูใชแรงงานทั่วโลก"
 
  ## Civil War in Subject - sent to overlord ##
 
  INS_communist_events.4.t: "สงครามกลางเมืองปะทุขึ้นใน [FROM.GetName]"
  INS_communist_events.4.desc: "นักปฏิวัติคอมมิวนิสตที่ติดอาวุธและจัดตั้งอยางเปนระบบโดยไดรับการหนุนหลังจาก [FROM.FROM.GetNameDef] ไดเปดฉากการลุกฮืออยางเปดเผยใน [FROM.GetName] ฝายบริหารอาณานิคมสูญเสียการควบคุมดินแดนเปนบริเวณกวาง และผูวาการรายงานวากองรักษาการณทองถิ่นไมสามารถฟนฟูความสงบเรียบรอยไดหากไมมีกําลังเสริม"
  INS_communist_events.4.a: "สงทหารเขาไป [FROM.GetName] เปนของเรา!"
 
  ## Subject Surrendered - sent to overlord ##
 
  INS_communist_events.5.t: "[FROM.GetName] ตกเปนของคอมมิวนิสต"
  INS_communist_events.5.desc: "ฝายบริหารใน [FROM.GetName] ยอมจํานนตอกลุมกอความไมสงบคอมมิวนิสตโดยไมสูรบ ผูวาการและคณะทํางานถูกจับกุม ธงของเราถูกลดลง และมีการประกาศจัดตั้งรัฐบาลปฏิวัติขึ้นแทน ทั้งหมดนี้ถูกบงการโดย [FROM.FROM.GetNameDef] และสายลับของพวกเขา ซึ่งทํางานบอนทําลายอํานาจของเราที่นั่นมาหลายเดือน นี่ไมใชอะไรอื่นนอกจากการปลน และจะไมถูกปลอยผานโดยไมมีการตอบโต"
  INS_communist_events.5.a: "นี่มันอุกอาจที่สุด!"

 # Cooperate with Revolutionaries (sent to target)
  INS_communist_events.9.t: "พบเจาหนาที่[FROM.GetAdjective]พบปะกับกลุมผูเห็นตาง"
  INS_communist_events.9.desc: "มีผูพบเห็นเจาหนาที่[FROM.GetAdjective]อยูรวมกับนักปลุกปนและผูนํากลุมติดอาวุธที่เปนที่รูจักทั่วประเทศ นักจัดตั้งนักศึกษาที่เคยแจกใบปลิวตามหัวมุมถนน บัดนี้กลับจัดประชุมลับหลังประตูที่ปดสนิทกับชายที่ถือเอกสารทางการทูตของ[FROM.GetAdjective] สิ่งพิมพตองหามถูกพิมพออกมาเร็วกวาที่ตํารวจจะยึดทัน และการประทวงที่เคยมอดลงภายในบายเดียว บัดนี้ทําใหทั้งเขตเปนอัมพาตไปหลายวัน พวกคอมมิวนิสตเหลานี้เรียนรูที่จะจัดตั้งกลุมใหญขึ้นทุกวัน หากเราไมรีบลงมือ เราอาจควบคุมพวกเขาไมไดอีก"
  INS_communist_events.9.a: "กวาดลางสายลับตางชาติพวกนี้ทันที!"
 
  # Spread Anti-Colonialist Sentiment (sent to subject target)
  INS_communist_events.10.t: "วาทกรรม[FROM.GetAdjective]ไดรับความนิยมมากขึ้น"
  INS_communist_events.10.desc: "ใบปลิว[FROM.GetAdjective]แพรสะพัดในคายทหารและในหมูขาราชการ และความพยายามยึดก็แทบไมชวยตานกระแสได เนื้อหาพูดถึงชาติที่หลุดพนจากพันธนาการ ถึงผูคนที่สลัดผูวาการอาณานิคมทิ้งและสรางสิ่งที่เปนของตนเองขึ้นมา คงปราบไดงายกวานี้หากความรูสึกนั้นไมไดฟงดูจริง แมแตเจาหนาที่ผูภักดีก็เริ่มถามกันเงียบ ๆ วาการจัดการในปจจุบันของเรารับใชประชาชน หรือเพียงรับใชนายของเรา"
  INS_communist_events.10.a: "เราตองระมัดระวัง"

