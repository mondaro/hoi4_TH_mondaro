 lar_portugal_iberian_summit.6.t: "การประชุมสุดยอดไอบีเรีย - [From.GetNameDef]ตอบรับ"
 lar_portugal_iberian_summit.6.desc: "รัฐบาล[From.GetAdjective]ตอบรับขอเสนอของเราในการเขารวม[?global.POR_iberian_summit_target.GetFactionName]แลว เราไดรวมกันลงนามในคํารองเพื่อยื่นตอ[?global.POR_iberian_summit_target.GetNameDef]โดยเร็วที่สุด"
