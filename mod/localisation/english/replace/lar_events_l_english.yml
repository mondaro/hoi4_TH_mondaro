 lar_portugal_iberian_summit.8.desc: "สเปนและโปรตุเกสไดสงคํารองรวมกันเพื่อขอเขารวม[Root.GetFactionName] พวกเขาหวังใหเรารับทั้งสองชาติไอบีเรียเขาสูพันธมิตรของเรา \n\nขณะที่เราประเมินโอกาสในการรักษาเสนทางเขาสูทะเลเมดิเตอรเรเนียน ผูบัญชาการทหารของเราก็กังวลวาอาจตองเปดแนวรบใหมที่เราอาจไมมีทรัพยากรพอจะปองกัน..."
 lar_portugal_iberian_summit.8.a: "เราตอบรับ เราจะรวมกันพิชิตศัตรู!"
 lar_portugal_iberian_summit.8.b: "เราปฏิเสธ พวกเขาจะทําใหเราออนแอลงเปลา ๆ"
 lar_portugal_iberian_summit.9.t: "การประชุมสุดยอดไอบีเรีย - [From.GetNameDef]ปฏิเสธ"
 lar_portugal_iberian_summit.9.desc: "ดวยความเขาใจสถานการณผิดอยางชัดเจนและไรเจตนาที่แทจริงจะรวมมือกับเรา รัฐบาล[From.GetAdjective]ไดปฏิเสธขอเสนอของเราในการเขารวม[?global.POR_iberian_summit_target.GetFactionName] \nบางทีตอนนี้เราควรมุงหาพันธมิตรดวยตัวเอง..."
 lar_portugal_iberian_summit.9.a: "ชางเปนเพื่อนบานที่โงเขลาเสียจริง!"
 lar_portugal_navy_mutiny.1.t: "กบฏกองทัพเรือ"
 lar_portugal_navy_mutiny.1.desc: "องคการปฏิวัติแหงกองเรือ (Organização Revolucionária da Armada) ไดกอกบฏขึ้นในกองทัพเรือของเรา และจับกุมนายทหารไวหลายนาย จุดประสงคของการกบฏทางเรือครั้งนี้ ซึ่งนําโดยเรือพิฆาตดาว คือการแลนเรือไปยังทาเรือของสเปนในทะเลเมดิเตอรเรเนียนเพื่อเขารวมสงครามกลางเมืองสเปนขางฝายสาธารณรัฐ \n\nอยางไรก็ตาม ความลังเลของลูกเรือบางลําไดขัดขวางความสําเร็จของฝายกบฏ และเรายังมีโอกาสหยุดยั้งพวกเขาได"
 lar_portugal_navy_mutiny.1.a: "อุดมการณของพวกเขาชอบธรรม ปลอยพวกเขาไป!"
 lar_portugal_navy_mutiny.1_allow_tt: "เรือที่กอกบฏจะถูกโอนไปยัง[SPD.GetNameDefCap] \nหาก[SPD.GetFlag][SPD.GetNameDef]ชนะสงครามกลางเมืองสเปน พวกเขาจะโอนเรือจํานวนเทาเดิมกลับคืนมา\n§Rการสนับสนุนคอมมิวนิสต§!จะสงผลตอจํานวนเรือที่ออกไป"
 lar_portugal_navy_mutiny.1_stop_tt: "เราจะพยายามหยุดยั้งฝายกบฏ\nเรือฝายกบฏมีโอกาสหนีสําเร็จและถูกโอนไปยัง[SPD.GetNameDefCap]\n§Rการสนับสนุนคอมมิวนิสต§!จะสงผลตอจํานวนเรือฝายกบฏและโอกาสที่พวกเขาจะหนีออกไปได"
 lar_portugal_navy_mutiny.1.b: "หยุดความบาบิ่นนี้เสีย!"
 lar_portugal_navy_mutiny.2.t: "ผูกอกบฏแลนเรือจากไป"
 lar_portugal_navy_mutiny.2.desc: "อยางไมคาดคิด หลังทราบการตัดสินใจของเราที่ยอมใหเรือฝายกบฏออกจากทา ลูกเรือสวนใหญกลับตัดสินใจไมกอกบฏ โดยหวังวารัฐบาลของเราจะดําเนินการที่จริงจังกวานี้และเขารวมสงครามกลางเมืองสเปนเคียงขางฝายสาธารณรัฐในอนาคตอันใกล\nมีเพียงเรือพิฆาตดาวซึ่งกําลังมุงหนาไปสเปนอยูแลวที่ปฏิเสธจะหันหลังกลับ \nรัฐบาลสเปนสัญญาวาจะสงเรือพิฆาตหนึ่งลํามาชดเชยใหเราเมื่อสงครามกลางเมืองยุติลง"
 lar_portugal_navy_mutiny.2_extra.desc: "ผูกอกบฏสวนใหญตางประหลาดใจที่เรือของพวกเขาไดรับอนุญาตใหออกไป และขณะนี้กําลังมุงหนาสูทาเรือของสเปน เรือพิฆาตดาวนําขบวน โดยมีเรืออื่นอีก [?POR_ships_revolted_not_including_dao] ลําตามไป \n\nเราไดติดตอรัฐบาลสาธารณรัฐสเปนแลว และพวกเขายืนยันวาจะจัดหาเรือใหโปรตุเกสเมื่อสงครามกลางเมืองยุติลง"
 lar_portugal_navy_mutiny.2.a: "หวังวาพวกเขาจะกลับมาครบถวน..."
 lar_portugal_navy_mutiny.2_tt: "เรือ [?POR_ships_revolted] ลําจะถูกโอนกลับคืนให[Root.GetNameDef] หาก[SPD.GetNameDef]ชนะสงครามกลางเมืองสเปน"
 lar_portugal_navy_mutiny.3.t: "รายงานการกบฏ"
 lar_portugal_navy_mutiny.3.desc: "การกบฏถูกปราบลงแลว ดวยปฏิบัติการอันรวดเร็วของกองกําลังรักษาชายฝงผูภักดีของเรา ฝายกบฏถูกจับกุมและลงโทษตามการกระทําอันทรยศของพวกเขา เพื่อปองกันการขัดคําสั่งซํ้าอีก เราไดเปลี่ยนลูกเรือของเรือที่เกี่ยวของกับการกบฏครั้งนี้เปนกะลาสีที่ไวใจไดซึ่งสังกัดองคกรของเรา"
 lar_portugal_navy_mutiny.3_extra.desc: "การกบฏครั้งนี้จัดตั้งมาดีกวาที่นายทหารของเราคาดไวในตอนแรก เมื่อปนใหญรักษาชายฝงของเราเปดฉากยิงใสเรือฝายกบฏ ผูกอกบฏก็เรงเครื่อง และเรือพิฆาตดาวนําขบวนออกจากทา โดยมีเรืออีกหลายลําตามไปเปนระยะ เรือบางลําถูกยิงขณะพยายามหลบหนีและเกยตื้นบนชายฝง ซึ่งทหารของเราไดจับกุมผูทรยศไว\n\nโชครายที่เรือ [?POR_ships_revolted] ลําหลบหนีไปไดและกําลังมุงหนาสูสเปนอยูในขณะนี้ เราจะติดตอรัฐบาลสเปนหลังสงครามกลางเมืองเพื่อใหแนใจวาเราจะไดรับการชดเชยสําหรับความสูญเสียนี้"
 lar_portugal_navy_mutiny.3.a: "เรื่องเชนนี้จะตองไมเกิดขึ้นอีก!"
 lar_portugal_navy_mutiny.3_no_ships_tt: "§Gการกบฏถูกปราบลงแลว§!"
 lar_portugal_navy_mutiny.3_ships_tt: "§Rเรือ [?POR_ships_revolted] ลํา §!จะถูกโอนไปยังสเปนฝายสาธารณรัฐ\nหากฝายสาธารณรัฐไดรับชัยชนะในสงครามกลางเมืองสเปน พวกเขาจะโอนเรือจํานวนเทาเดิมกลับคืนมา"
 lar_portugal_navy_mutiny.4.t: "กะลาสีโปรตุเกสมาชวยเรา!"
 lar_portugal_navy_mutiny.4.desc: "ดวยความตองการชวยสาธารณรัฐสเปนตอตานการกบฏของฝายชาตินิยม ลูกเรือโปรตุเกสไดกอกบฏขึ้นบนเรือรบหลายลํา นายทหารถูกจับกุม และดวยความคาดวาจะตองเผชิญการตอตานอยางหนักจากฝง เรือตาง ๆ จึงเตรียมพรอมออกจากทาโดยเร็วที่สุด \n\nทวาลูกเรือตางประหลาดใจเมื่อรัฐบาลโปรตุเกส ซึ่งตองการหลีกเลี่ยงไมใหเรื่องบานปลาย ยอมออนขอและอนุญาตใหกะลาสีแลนเรือออกไปสูเพื่ออุดมการณของเรา ตราบใดที่พวกเขากลับมาเมื่อสงครามกลางเมืองสเปนจบลง \n\nลูกเรือบางสวนจึงตัดสินใจอยูในโปรตุเกสตอเพื่อกดดันใหรัฐบาลดําเนินการตอตานฝายชาตินิยมใหมากขึ้น และทายที่สุด เรือ [?POR.POR_ships_revolted] ลํากําลังมุงหนามายังทาเรือของเรา เราตองตอนรับสหายของเราและขอบคุณในความกลาหาญของพวกเขา"
 lar_portugal_navy_mutiny.4_extra.desc: "ดวยความตองการชวยสาธารณรัฐสเปนตอตานการกบฏของฝายชาตินิยม ลูกเรือโปรตุเกสไดกอกบฏขึ้นบนเรือรบหลายลํา หลังจับกุมนายทหารของตน กะลาสีพยายามนําเรือออกจากทา แตถูกกองทัพบกตอบโตอยางดุเดือด \nดวยการตีฝาออกมาอยางสิ้นหวังทามกลางการระดมยิงของปนใหญรักษาชายฝง เรือ [?POR.POR_ships_revolted] ลําหลบหนีออกมาไดและกําลังมุงหนาสูสเปน \n\nหลังลมเหลวในการควบคุมการกบฏครั้งนี้ รัฐบาลโปรตุเกสไดเรียกรองใหเราชดเชยความสูญเสียของพวกเขาเมื่อสงครามจบลง \n\nอยางไรก็ตาม ในตอนนี้เราตองตอนรับสหายของเราและขอบคุณกะลาสีผูกลาหาญทุกคนสําหรับการเสียสละ เพราะหลายคนถูกจับกุมหรือบาดเจ็บระหวางการกบฏ"
 lar_portugal_navy_mutiny.4.a: "เราจะไมลืมวีรกรรมของชาวโปรตุเกสผูกลาเหลานี้!"
 lar_portugal_navy_mutiny.4_tt: "§Gเรือ[POR.GetAdjective] [?POR.POR_ships_revolted] ลํา§! ถูกโอนมายัง[Root.GetNameDef]และอยูภายใตการควบคุมของเราแลว \nเรือเหลานี้จะถูกโอนกลับคืนให[POR.GetNameDef]เมื่อสงครามกลางเมืองสเปนจบลง"
 lar_portugal_navy_mutiny.5.t: "กะลาสีของเรากลับจากสงครามกลางเมืองสเปน"
 lar_portugal_navy_mutiny.5.desc: "สงครามกลางเมืองสเปนจบลงแลว และรัฐบาลฝายสาธารณรัฐตกลงจะจัดหาเรือ [?POR_ships_revolted] ลําใหเราเพื่อชดเชยเรือที่แลนไปชวยพวกเขาในชวงตนของความขัดแยง อยางไรก็ตาม เรือพิฆาตของเราอาจไมไดอยูในสภาพดีที่สุดหลังปฏิบัติภารกิจ สาธารณรัฐสเปนจึงจะทําการตรวจสภาพเพื่อตัดสินวาเรือลําใดของเราควรถูกแทนที่ดวยเรือของพวกเขาเอง"
 lar_portugal_navy_mutiny.5.a: "ดูกันวาเรือเหลานั้นจะใชการไดดีแคไหน..."
 lar_portugal_navy_mutiny.5_tt: "§G[SPD.GetNameDefCap]จะโอนเรือ [?POR_ships_revolted] ลํากลับคืนให[Root.GetNameDef]§!"
 lar_portugal_navy_mutiny.6.t: "ถึงเวลาอําลาสหายชาวโปรตุเกส"
 lar_portugal_navy_mutiny.6.desc: "บัดนี้เมื่อการกบฏของฝายชาตินิยมพายแพไปแลว ก็ถึงเวลาที่กะลาสีโปรตุเกสผูกลาซึ่งมาชวยเราในชวงไมกี่เดือนแรกของความขัดแยงจะไดกลับสูบานเกิดเสียที\nเราจะตรวจสภาพเพื่อตัดสินวาเรือโปรตุเกสลําใดอยูในสภาพดีพอจะแลนกลับโปรตุเกส และลําใดตองถูกแทนที่ดวยเรือของเราเอง\n\nเรามีเรื่องตองขอบคุณกะลาสีผูกลาเหลานี้มากมาย และเราจะไมมีวันลืมความกลาหาญของพวกเขา"
 lar_portugal_navy_mutiny.6.a: "ลากอน สหายรวมรบ!"
 lar_portugal_navy_mutiny.6_tt: "เรือ [?POR.POR_ships_revolted] ลําจะถูกโอนกลับคืนให[POR.GetNameDef]"
 lar_portugal_iberian_workers_united.1.t: "แรงงานไอบีเรียผนึกกําลัง"
 lar_portugal_iberian_workers_united.1.desc: "เปนเวลานานที่สเปนและโปรตุเกสเปนชาติอิสระที่เนนยํ้าความแตกตางแทนที่จะมองความคลายคลึง แตยุคนั้นไดจบลงแลว วันที่แรงงานสเปนและโปรตุเกสจะผนึกกําลังกันตอสูกับฟาสซิสตไดมาถึงแลว!"
 lar_portugal_iberian_workers_united.1.a: "เมื่อรวมกันเปนหนึ่ง เราจะไมมีวันพายแพ!"
 lar_portugal_iberian_workers_united.2.t: "สหภาพสังคมนิยมไอบีเรีย"
 lar_portugal_iberian_workers_united.2.desc: "บัดนี้เมื่อเราไดสันติภาพมาในที่สุด [From.GetNameDefCap]ไดติดตอรัฐบาลของเราเพื่อพิจารณาการรวมคาบสมุทรไอบีเรียภายใตรัฐบาลสังคมนิยมประชาชน ซึ่งจะทําใหอัตลักษณ[Root.GetAdjective]และ[From.GetAdjective]เลือนหายไป เมื่อเราทุกคนกลายเปนพลเมืองไอบีเรียแหงสหภาพสังคมนิยมไอบีเรีย"
 lar_portugal_iberian_workers_united.2.a: "[Root.GetNameDefCap]และ[POR.GetNameDef]จะรวมเปนหนึ่ง!"
 lar_portugal_iberian_workers_united.2.a_tt: "§Yสหภาพสังคมนิยมไอบีเรีย§! ผนวก §Yสเปนฝายสาธารณรัฐ§!\n"
 lar_portugal_iberian_workers_united.2.b: "[Root.GetNameDefCap]จะยังคงเปนชาติอิสระ"
 lar_portugal_naval_blockade.1.t: "[POR.GetNameDefCap]ปฏิเสธการปดลอมทางทะเลของ[ENG.GetAdjective]"
 lar_portugal_naval_blockade.1.desc: "รัฐบาล[POR.GetAdjective]ประกาศวาตนไมมีพันธะตองปฏิบัติตามการปดลอมทางทะเลที่[ENG.GetNameDef]บังคับใชกับเรา เราไดรับสาสนเสนอขอตกลงอันเปนธรรม โดยขบวนเรือลําเลียง[POR.GetAdjective]จะสนับสนุนความพยายามทําสงครามของเรา ขนสงสินคาไปยังจุดที่ขบวนเรือลําเลียงของเราเองไปไมถึง แลกกับขอตกลงการคาที่จะสงสินคาอุปโภคบริโภคราคาถูกไปยัง[POR.GetNameDef]"
 lar_portugal_naval_blockade.1.a: "เราจะพิจารณาขอตกลงนี้..."
 lar_portugal_naval_blockade.1_tt: "ปลดล็อกการตัดสินใจสําหรับประเทศที่อยูในภาวะสงครามกับ[ENG.GetNameDefCap]"
 lar_portugal_naval_blockade.2.t: "[From.GetName]ตอบรับขอเสนอของเราในการเลี่ยงการปดลอมทางทะเล"
 lar_portugal_naval_blockade.2.desc: "วันนี้มีสาสนจาก[From.GetNameDef]มาถึง ตอบรับขอเสนอของเราในการเลี่ยงการปดลอมทางทะเลของอังกฤษ เราจะใชขบวนเรือลําเลียงของเราตอบสนองความตองการเสบียงของพวกเขาในจุดที่เรือ[From.GetAdjective]ไปไมถึง เพื่อเปนการตอบแทน พวกเขาจะเบนการผลิตจากโรงงานแหงหนึ่งมาจัดหาวัตถุดิบที่เราตองการสําหรับโครงการของเราเอง"
 lar_portugal_naval_blockade.2.a: "เรื่องนี้จะเปนประโยชนแกทั้งสองชาติ"
 lar_portugal_naval_blockade.3.t: "[POR.GetNameDefCap]ปฏิเสธการปดลอมทางทะเล"
 lar_portugal_naval_blockade.3.desc: "รัฐบาล[POR.GetAdjective]ประกาศวาจะไมปฏิบัติตามการปดลอมทางทะเลที่เราบังคับใช [POR.GetNameDefCap]ไดเสนอขอตกลงแกศัตรูของเรา โดยเสนอจะสนับสนุนความพยายามทําสงครามของพวกเขาดวยการใชขบวนเรือลําเลียง[POR.GetAdjective]ลักลอบขนสินคา\n\nแมเราจะเคารพและเขาใจความเปนกลางของพวกเขาในความขัดแยงนี้ แตดูเหมือนวาอดีตมิตรของเราไมปรารถนาจะยึดถือพันธมิตรอังกฤษ-โปรตุเกสอีกตอไป พวกเขาสนับสนุนศัตรูของเราอยางเปดเผย และดวยเหตุนี้จึงละเมิดสนธิสัญญาที่มีมากวาหาศตวรรษระหวางสองประเทศของเรา..."
 lar_portugal_naval_blockade.3.a: "พวกฉวยโอกาสทรยศ!"
 lar_portugal_promote_monarchist_cause.1.t: "โปรตุเกสกําลังปลุกกระแสนิยมกษัตริย!"
 lar_portugal_promote_monarchist_cause.1.desc: "รัฐบาลโปรตุเกสกําลังเรียกรองความสนใจจากฝายนิยมกษัตริยชาวบราซิล โดยสนับสนุนการโฆษณาชวนเชื่อที่ยกยองเจาชายเปดรู เอนรีกี และอางสิทธิ์ของพระองคในการขึ้นครองบัลลังกบราซิล \nเราไมควรมองขามผลกระทบที่อาจเกิดขึ้นตอประชาชนบราซิล มิฉะนั้นเราอาจถูกขบวนการนิยมกษัตริยขนาดมหึมาถาโถมใสจนรัฐบาลถูกโคนลม"
 lar_portugal_promote_monarchist_cause.1.a: "พวกเขากลาดีอยางไร?!"
 lar_portugal_promote_monarchist_cause.2.t: "รวมราชอาณาจักรโปรตุเกสและบราซิลอีกครั้ง"
 lar_portugal_promote_monarchist_cause.2.desc: "[POR.GetNameDefCap]ไดติดตอรัฐบาลของเรา เสนอใหรวมสองชาติของเราภายใตการปกครองของดง ดูอารตี นูนู ซึ่งจะไดรับการสวมมงกุฎเปนกษัตริยแหงโปรตุเกสและบราซิล \n\nรัฐบาล[POR.GetAdjective]ประกาศวาจะไมยอมรับคําปฏิเสธ และเรงเราใหเรายอมรับขอเสนอเพื่อหลีกเลี่ยงความขัดแยงที่อาจเกิดขึ้นระหวางสองชาติ"
 lar_portugal_promote_monarchist_cause.2.a: "[Root.GetNameDefCap]และ[POR.GetNameDef]จะกลับมารวมกันอีกครั้ง"
 lar_portugal_promote_monarchist_cause.2.b: "[Root.GetNameDefCap]จะยังคงเปนชาติอิสระ"
 lar_portugal_promote_monarchist_cause.3.t: "การลุกฮือของฝายนิยมกษัตริย!"
 lar_portugal_promote_monarchist_cause.3.desc: "ดวยความชวยเหลือจากรัฐบาล[POR.GetAdjective] ฝายนิยมกษัตริยชาวบราซิลไดยึดริโอเดจาเนโรไว และกําลังลุกขึ้นจับอาวุธทั่วประเทศตอตานพวกทรยศฟาสซิสตที่ขัดขวางเรา \nศัตรูไดแสวงหาแรงสนับสนุนจากกลุมตาง ๆ ในประเทศของเรา แตราษฎรผูภักดีแหง[Root.GetName]ที่ไดรับการฟนฟูไมมีสิ่งใดตองกลัว เพราะจักรพรรดิ[Root.GetLeader]ผูชอบธรรมของพวกเขาจะนําพวกเขาสูชัยชนะ!"
 lar_portugal_promote_monarchist_cause.3.desc_anti_monarchist: "ดวยความชวยเหลือจากรัฐบาลโปรตุเกส ฝายนิยมกษัตริยชาวบราซิลกําลังลุกขึ้นจับอาวุธทั่วประเทศ หากพวกทรยศเหลานั้นฟนฟูระบอบกษัตริยไดสําเร็จ เปนไปไดสูงวาไมนานหลังจากนั้นประเทศอันเปนที่รักของเราจะตองตกอยูใตการควบคุมของโปรตุเกส \n\nเราเสียพื้นที่สวนใหญของประเทศไปแลว แตโชคดีที่ฝายกบฏลมเหลวในการยึดริโอเดจาเนโร ทําใหเรามีโอกาสรวบรวมกําลังพลและเคลื่อนทัพจากเมืองหลวงไปกอบกูแผนดินของเราคืนจากผูที่ตองการทําลายมัน"
 lar_portugal_promote_monarchist_cause.3.a: "บัลลังกบราซิลจะไดรับการฟนฟู!"
 lar_portugal_promote_monarchist_cause.3.a_tt: "[From.GetFlag]§Y[From.GetNameDefCap]§G จะเขารวมสงครามกลางเมืองฝายเรา§!§!"
 lar_portugal_promote_monarchist_cause.3.b: "เราตองกวาดลางพวกทรยศเหลานี้!"
 lar_portugal_promote_monarchist_cause.3.b_tt: "[From.GetFlag]§Y[From.GetNameDefCap]§R จะเขารวมสงครามกลางเมืองเพื่อตอตานเรา§!§!"
 lar_portugal_promote_monarchist_cause.4.t: "บัลลังกบราซิลไดรับการฟนฟู"
 lar_portugal_promote_monarchist_cause.4.desc: "ดวยความชวยเหลือจากรัฐบาล[POR.GetAdjective] ฝายนิยมกษัตริยชาวบราซิลสามารถเปลี่ยนรัฐบาลไดอยางสันติ ยังมีกลุมเล็ก ๆ กระจายอยูทั่วประเทศที่ยังคัดคานการขึ้นครองราชยของจักรพรรดิ[Root.GetLeader]ผูชอบธรรมของเรา แตอีกไมนานก็จะสงบลง"
 lar_portugal_promote_monarchist_cause.4.a: "จักรพรรดิจงทรงพระเจริญ!"
 lar_portugal_promote_monarchist_cause.5.t: "บราซิลยอมรับการรวมชาติ"
 lar_portugal_promote_monarchist_cause.5.desc: "รัฐบาลบราซิลตัดสินใจอยางชาญฉลาดที่จะลงนามยอมรับขอเสนอรวมชาติของเรา สหราชอาณาจักรโปรตุเกสและบราซิลอันยิ่งใหญไดผงาดขึ้นอีกครั้งภายใตการปกครองของกษัตริย[Root.GetLeader]\n\nขอพระองคทรงนําพลังอํานาจและความรุงเรืองมาสูชาติอันเปนที่รักของเรา!"
 lar_portugal_promote_monarchist_cause.5.a: "นี่จะทําใหโปรตุเกสแข็งแกรงขึ้น"
 lar_portugal_promote_monarchist_cause.6.t: "บราซิลปฏิเสธการรวมชาติ"
 lar_portugal_promote_monarchist_cause.6.desc: "รัฐบาล[BRA.GetAdjective]เลือกอยางบุมบามที่จะปฏิเสธขอเสนอของเราในการรวมสองชาติภายใตการปกครองของ[Root.GetLeader]\nแมนี่จะเปนสิ่งที่เรายอมรับไมไดโดยสิ้นเชิง แตก็เปนเพียงอุปสรรคเล็กนอยบนเสนทางฟนฟูอํานาจของอดีตราชอาณาจักรโปรตุเกส\n\nทายที่สุด พวกเขาจะตองยอมทําตามขอเรียกรองของเรา เชนเดียวกับที่คนอื่น ๆ จะทํา..."
 lar_portugal_promote_monarchist_cause.6.a: "ชะตากรรมของพวกเขาถูกกําหนดแลว"
 lar_portugal_promote_monarchist_cause.7.t: "ฝายนิยมกษัตริยกําลังผงาด!"
 lar_portugal_promote_monarchist_cause.7.desc: "สถานการณในประเทศของเราอยูในขั้นวิกฤต ขบวนการนิยมกษัตริยกําลังไดแรงหนุน และแนวรวมตอตานกษัตริยไดขึ้นกุมอํานาจรัฐบาล เพื่อปองกันการลุกฮือที่ใกลจะเกิดขึ้น \nความไมมั่นคงทางสังคมเพิ่มขึ้นอยางรวดเร็วเมื่อพลเมืองบราซิลตระหนักวาผูนําของแนวรวมนี้ฝกใฝฟาสซิสต และสังคมของเราก็แตกขั้วระหวางฟาสซิสตกับฝายนิยมกษัตริยมากขึ้นทุกที\nในสถานการณชี้ชะตาเชนนี้ ถึงเวลาที่เราตองเลือกขาง"
 lar_portugal_promote_monarchist_cause.7.a: "สนับสนุนฝายนิยมกษัตริย"
 lar_portugal_promote_monarchist_cause.7.a_tt: "คุณจะอยูขางฝายนิยมกษัตริยหากเกิดสงครามกลางเมือง"
 lar_portugal_promote_monarchist_cause.7.b: "สนับสนุนแนวรวมตอตานกษัตริย"
 lar_portugal_promote_monarchist_cause.7.b_tt: "คุณจะอยูขางฝายฟาสซิสตหากเกิดสงครามกลางเมือง"
 POR_portugal_joined_brazilian_civil_war_flag: "โปรตุเกสเขารวมสงครามกลางเมืองบราซิลแลว"
 POR_brazil_supports_monarchism_flag: "บราซิลสนับสนุนระบอบกษัตริย"
 lar_portugal_purchase_ships.1.t: "[From.GetNameDefCap]ตองการซื้อเรือ[Root.GetAdjective]"
 lar_portugal_purchase_ships.1.desc: "รัฐบาล[From.GetAdjective]ตระหนักดีวาตนขาดกองทัพเรือที่เหมาะสม จึงยื่นขอเสนอขอซื้อเรือ[Root.GetAdjective] หากเรายอมตอเรือตามที่พวกเขาตองการ พวกเขาจะจัดหาสินคาที่เรานําไปใชประโยชนของเราเองได"
 lar_portugal_purchase_ships.1.a: "เรื่องนี้จะเปนประโยชนแกทั้งสองฝาย"
 lar_portugal_purchase_ships.1.a_tt: "เราจะไดรับ§Yโรงงานพลเรือน§! นอกแผนที่ §Y1§! แหงเปนคาตอบแทน เมื่อ[POR.GetNameDefCap]เลือกขอตกลง"
 lar_portugal_purchase_ships.1.b: "เราไมสนใจ"
 lar_portugal_purchase_ships.2.t: "[From.GetNameDefCap]ยอมตอเรือใหเรา"
 lar_portugal_purchase_ships.2.desc: "รัฐบาล[From.GetAdjective]ตกลงจะตอเรือใหกองทัพเรือ[Root.GetAdjective] พวกเขาไดยื่นขอเสนอสามแบบใหเราเลือก"
 lar_portugal_purchase_ships.2.a: "ซื้อเรือดํานํ้า"
 lar_portugal_purchase_ships.2.b: "ซื้อเรือพิฆาต"
 lar_portugal_purchase_ships.2.c: "ซื้อเรือลาดตระเวนเบา"
 lar_portugal_purchase_ships.3.t: "[From.GetNameDefCap]ปฏิเสธที่จะตอเรือใหเรา"
 lar_portugal_purchase_ships.3.desc: "[From.GetNameDefCap]ไดปฏิเสธขอเสนอของเราในการซื้อเรือของ[From.GetNameDefCap]สําหรับกองทัพเรือของเรา \nเราจะตองหาประเทศอื่นที่ยินดีรับขอตกลง หรือมุงพัฒนาสิ่งอํานวยการทางเรือของเราเอง เพื่อที่เราจะไมตองพึ่งพามหาอํานาจตางชาติใดในการสรางกองเรือ[Root.GetAdjective]อันเกรียงไกร"
 lar_portugal_purchase_ships.3.a: "เราจะจัดการไดโดยไมตองพึ่งพวกเขา"
 lar_portugal_purchase_ships.4.t: "การตอเรือเสร็จสิ้น - เรือดํานํ้า"
 lar_portugal_purchase_ships.4.desc: "หลังการตอเรือเกือบหนึ่งป เรือดํานํ้า[GetPortugueseShipsBuilder]สามลําที่เราสั่งตอไดผานการทดสอบในทะเลหลายครั้ง และพรอมเขาประจําการในกองทัพเรืออยางเปนทางการในที่สุด\n เรือเหลานี้จอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 lar_portugal_purchase_ships.4.a: "ดี"
 lar_portugal_purchase_ships.4.a_tt: "เพิ่มเรือดํานํ้าสามลําเขาสูกองเรือสํารอง"
 lar_portugal_purchase_ships.5.t: "การตอเรือเสร็จสิ้น - เรือพิฆาต"
 lar_portugal_purchase_ships.5.desc: "หลังการตอเรือเกือบหนึ่งป เรือพิฆาต[GetPortugueseShipsBuilder]สองลําที่เราสั่งตอไดผานการทดสอบในทะเลหลายครั้ง และพรอมเขาประจําการในกองทัพเรืออยางเปนทางการในที่สุด\nเรือเหลานี้จอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 lar_portugal_purchase_ships.5.a: "ดี"
 lar_portugal_purchase_ships.5.a_tt: "เพิ่มเรือพิฆาตสองลําเขาสูกองเรือสํารอง"
 lar_portugal_purchase_ships.6.t: "การตอเรือเสร็จสิ้น - เรือลาดตระเวนเบา"
 lar_portugal_purchase_ships.6.desc: "หลังการตอเรือเกือบหนึ่งปครึ่ง เรือลาดตระเวนเบา[GetPortugueseShipsBuilder]ที่เราสั่งตอไดผานการทดสอบในทะเลหลายครั้ง และพรอมเขาประจําการในกองทัพเรืออยางเปนทางการในที่สุด\nเรือจอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 lar_portugal_purchase_ships.6.a: "ดี"
 lar_portugal_purchase_ships.6.a_tt: "เพิ่มเรือลาดตระเวนเบาหนึ่งลําเขาสูกองเรือสํารอง"
 POR_ENG_Ship_Builder: "[ENG.GetAdjective]"
 POR_ITA_Ship_builder: "[ITA.GetAdjective]"
 lar_portugal_spanish_civil_war.1.t: "[POR.GetNameDefCap]เห็นใจสาธารณรัฐสเปน"
 lar_portugal_spanish_civil_war.1.desc: "วันนี้[POR.GetNameDef]ไดประกาศสนับสนุนสาธารณรัฐสเปน และแถลงวารัฐบาลกําลังพิจารณาใชมาตรการเด็ดขาดในสงครามกลางเมืองสเปน ระหวางการปราศรัย [POR.GetLeader]ไดประณามภัยคุกคามฟาสซิสตที่กําลังกอตัวในไอบีเรีย โดยอางวาเปนหนาที่ของ[POR.GetNameDef]ที่จะชวยเหลือสหายชาวสเปนในการตอสูกับฝายชาตินิยม"
 lar_portugal_spanish_civil_war.1.a: "พวกเขาอยามาขวางทางเราจะดีกวา..."
 lar_portugal_spanish_civil_war.1_tt: "§R[POR.GetNameDefCap]จะสามารถเขารวมกับ[SPD.GetFlag][SPD.GetNameDef]ในสงครามกลางเมืองสเปนเพื่อสูกับเราได!§!"
 lar_portugal_spanish_civil_war.2.t: "[POR.GetNameDefCap]เห็นใจฝายชาตินิยมสเปน"
 lar_portugal_spanish_civil_war.2.desc: "รัฐบาล[POR.GetAdjective]ไดประกาศสนับสนุนฝายชาตินิยมสเปน และแถลงวา[POR.GetNameDef]กําลังพิจารณาใชมาตรการเด็ดขาดในสงครามกลางเมืองสเปน ระหวางการปราศรัย [POR.GetLeader]ไดประณามการแพรกระจายของภัยคุกคามคอมมิวนิสตและอนาธิปไตยในไอบีเรีย โดยอางวาเปนหนาที่ของ[POR.GetNameDef]ที่จะชวยเหลือเพื่อนบานชาวสเปนในการตอสูกับฝายสาธารณรัฐ"
 lar_portugal_spanish_civil_war.2.a: "พวกเขาไมควรเขามายุงเรื่องนี้..."
 lar_portugal_spanish_civil_war.2_tt: "§R[POR.GetNameDefCap]จะสามารถเขารวมกับ[SPA.GetFlag][SPA.GetNameDef]ในสงครามกลางเมืองสเปนเพื่อสูกับเราได!§!"
 lar_portugal_spanish_civil_war.3.t: "[POR.GetNameDefCap]เห็นใจฝายคารลิสตสเปน"
 lar_portugal_spanish_civil_war.3.desc: "วันนี้รัฐบาล[POR.GetAdjective]ไดประกาศสนับสนุนฝายคารลิสตสเปน และแถลงวา[POR.GetNameDef]กําลังพิจารณาใชมาตรการเด็ดขาดในสงครามกลางเมืองสเปน ระหวางการปราศรัย [POR.GetLeader]ประกาศวาระบอบกษัตริยเปนหนทางเดียวที่จะนําเสถียรภาพและความรุงเรืองมาสูคาบสมุทรไอบีเรียซึ่งแตกขั้วทางการเมืองอยางรุนแรง และเปนหนาที่ของ[POR.GetNameDef]ที่จะชวยเหลือฝายนิยมเจาสเปนในการตอสูเพื่อฟนฟูระบอบกษัตริย"
 lar_portugal_spanish_civil_war.3.a: "พวกเขาไมควรเขามายุงเรื่องนี้..."
 lar_portugal_spanish_civil_war.3_tt: "§R[POR.GetNameDefCap]จะสามารถเขารวมกับ[SPB.GetFlag][SPB.GetNameDef]ในสงครามกลางเมืองสเปนเพื่อสูกับเราได!§!"
 lar_portugal_royal_iberian_alliance.1.t: "กอตั้งพันธมิตรราชวงศไอบีเรีย"
 lar_portugal_royal_iberian_alliance.1.desc: "[From.GetNameDefCap]แถลงวา หลังความแตกแยกทางสังคมและความไมมั่นคงทั้งหมดที่ประเทศของเราตองเผชิญระหวางสงครามกลางเมืองสเปน เพื่อประโยชนของประเทศไอบีเรีย เราควรรวมมือกันแสวงหาความรุงเรืองและความกาวหนา\n\nรัฐบาล[From.GetAdjective]เสนอใหเจรจาเปนพันธมิตรระหวางสองราชอาณาจักรของเรา ทิ้งความแตกตางในอดีตไวเบื้องหลัง และรวมมือกันเอาชนะภัยคุกคามมากมายที่รอเราอยู ไมเพียงในยุโรป แตทั่วทั้งโลก"
 lar_portugal_royal_iberian_alliance.1.a: "พันธมิตรนี้จะเปนประโยชนตอโปรตุเกส"
 lar_portugal_royal_iberian_alliance.1.b: "สนธิสัญญานี้เปนสิ่งที่เรายอมรับไมได"
 lar_portugal_overseas_provinces.1.t: "ผนวกรวมดินแดนแองโกลา"
 lar_portugal_overseas_provinces.1.desc: "ดินแดนของเราทางตอนเหนือและตอนใตของแองโกลาไดถูกผนวกรวมเขากับชาติของเราในที่สุด ชาวแองโกลาในทองถิ่นไดรับสัญชาติโปรตุเกส และบัดนี้มีสิทธิและหนาที่เชนเดียวกับพลเมืองโปรตุเกสคนอื่น ๆ รวมถึงการรับราชการทหาร ซึ่งจะเปนแหลงกําลังพลใหมที่เสริมกําลังกองทัพของเรา"
 lar_portugal_overseas_provinces.1.a: "ขาวดี!"
 lar_portugal_overseas_provinces.2.t: "ผนวกรวมดินแดนโมซัมบิก"
 lar_portugal_overseas_provinces.2.desc: "อดีตอาณานิคมโมซัมบิกของเราไดถูกผนวกรวมเขากับชาติของเราในที่สุด ชาวโมซัมบิกในทองถิ่นไดรับสัญชาติโปรตุเกส และบัดนี้มีสิทธิและหนาที่เชนเดียวกับพลเมืองโปรตุเกสคนอื่น ๆ รวมถึงการรับราชการทหาร ซึ่งจะเปนแหลงกําลังพลใหมที่เสริมกําลังกองทัพของเรา"
 lar_portugal_overseas_provinces.2.a: "ทั้งหมดนี้เพื่อโปรตุเกส"
 lar_portugal_overseas_provinces.3.t: "ผนวกรวมดินแดนติมอร"
 lar_portugal_overseas_provinces.3.desc: "อดีตอาณานิคมติมอรตะวันออกของเราไดถูกผนวกรวมเขากับชาติของเราในที่สุด ชาวติมอรในทองถิ่นไดรับสัญชาติโปรตุเกส และบัดนี้มีสิทธิและหนาที่เชนเดียวกับพลเมืองโปรตุเกสคนอื่น ๆ รวมถึงการรับราชการทหาร ซึ่งจะเปนแหลงกําลังพลใหมที่เสริมกําลังกองทัพของเรา"
 lar_portugal_overseas_provinces.3.a: "ทั้งหมดนี้เพื่อโปรตุเกส"
 lar_news.7.t: "กติกาสัญญาฝรั่งเศส-เยอรมนี"
 lar_news.7.desc: "[FRA.GetLeader]และ[GER.GetLeader]ไดพบกันที่เบอรลินเพื่อหารือสถานการณทางการเมืองและยุทธศาสตรในยุโรปกลาง แมรายละเอียดของการประชุมจะมีนอยและไมมีแถลงการณอยางเปนทางการ แตผูสังเกตการณไดสังเกตเห็นการเปลี่ยนแปลงอยางชัดเจนในวาทกรรมและนโยบายของ[FRA.GetAdjective]และ[GER.GetAdjective]ตอกลุมประเทศเบเนลักซ \n\nจากที่ครั้งหนึ่งชนกลุมนอยเยอรมันในเบลเยียมเคยเปนประเด็นที่โฆษณาชวนเชื่อของเยอรมนีตีกลองยํ้าอยูไมหยุด บัดนี้กลับถูกกลาวถึงเพียงผาน ๆ พรอมระบุวาเบลเยียมเปน "สิ่งประดิษฐ ไมใชชาติ เปนเพียงการรวมชาติตาง ๆ เขาดวยกันอยางสะเปะสะปะ" และเนนยํ้าอยางมากถึงประชากรที่พูดภาษาฝรั่งเศสจํานวนมาก"
 lar_news.7.a: "เราตองดูแลการปองกันของเรา!"
 lar_news.7.b: "ฝรั่งเศสแสดงพลัง"
 lar_news.7.c: "ชาติเล็ก ๆ ในยุโรปตางหวาดผวา"
 lar_news.7.d: "ถึงเวลาขีดเสนพรมแดนยุโรปใหม"
 lar_news.7.e: "ทางออกที่สมเหตุสมผลระหวางชาติที่มีเหตุผล"
 lar_news.8.t: "[FRA.GetLeader]อางสิทธิ์ในบัลลังกฝรั่งเศส"
 lar_news.8.desc: "ในพิธีที่[This.GetFrenchCoronationCity] [FRA.GetLeader]ไดรับการประกาศเปน[This.GetFrenchRoyalTitle]อยางเปนทางการ \n\nการขึ้นสูอํานาจของเขาถูกมองอยางกวางขวางวาเปนผลโดยตรงจากความลมเหลวของสาธารณรัฐที่สามในการสรางเสถียรภาพทางการเมือง ทามกลางบรรยากาศที่เต็มไปดวยการปะทะอยางรุนแรงระหวางกลุมสุดขั้วทั้งสองฝงของการเมืองมากขึ้นทุกที บัดนี้เขาตองเผชิญภารกิจอันยากลําบากในการฟนฟูและรวมประเทศที่แตกแยกอยางลึกซึ้งใหเปนหนึ่ง ขณะที่ผูสังเกตการณหลายคนชี้วาบทบาทของสันนิบาตขวาจัดในการผลักดันเขาสูอํานาจเปนสัญญาณวา "[This.GetFrenchRoyalTitle]" แทจริงแลวเปนเพียงผูปกครองที่อยูไดดวยความกรุณาของม็อบฝายขวา"
 lar_news.8.a: "อีกชาติหนึ่งกลับคืนสูระเบียบตามธรรมชาติ"
 lar_news.8.b: "อีกไมนานพวกเขาก็จะปฏิวัติกันอีก"
 lar_news.8.c: "การหวนคืนสูวันวานที่คิดวาผานพนไปนานแลว"
 lar_news.8.d: "[FRA.GetLeader]จงเจริญ!"
 lar_news.8.e: "นั่นมันผูปกครองเบ็ดเสร็จผิดประเภท!"
 LaR_France_Reims: "แร็งส"
 LaR_France_Paris: "ปารีส"
 LaR_France_Emperor: "จักรพรรดิแหงชาวฝรั่งเศส"
 LaR_France_King: "กษัตริยแหงฝรั่งเศส"
 LaR_France_King_of_The_French: "กษัตริยแหงชาวฝรั่งเศส"
 lar_news.9.t: "คอมมิวนิสตฝรั่งเศสยึดอํานาจ"
 lar_news.9.desc: "หลังการปฏิรูปทางการเมืองและเศรษฐกิจมาเปนเวลานาน วันนี้รัฐมนตรีฝายคอมมิวนิสตในรัฐบาลแนวรวมประชาชนไดเรียกรองใหรัฐมนตรีสายกลางที่เหลืออยูลาออกและยอมรับพรรคคอมมิวนิสตเปนพรรครัฐบาลเพียงพรรคเดียว หรือไมก็เขารวมพรรคคอมมิวนิสตทันที\n\nในเวลาเดียวกัน กรรมกรติดอาวุธจากโรงงานขนาดใหญหลายแหงที่รัฐเปนเจาของไดเคลื่อนกําลังเขายึดจุดยุทธศาสตรทั่วประเทศ กองทัพซึ่งไดรับคําสั่งจากปารีสยังคงอยูในคายและปฏิเสธที่จะเขาแทรกแซง \n\nพอตกคํ่า รัฐประหารของคอมมิวนิสตก็เสร็จสมบูรณ และรัฐบาลใหมไดกุมอํานาจไวแลว"
 lar_news.9.a: "พวกหัวรุนแรงยึดอํานาจไปแลว"
 lar_news.9.b: "การปฏิวัติฝรั่งเศสครั้งสุดทาย"
 lar_news.9.c: "พวกเขาหนีฟาสซิสตดวยการเลือกทางเลือกที่แยที่สุด"
 lar_news.9.d: "การปฏิวัติไดรับชัยชนะ!"
 lar_news.9.e: "ภัยคุกคามอีกหนึ่งผงาดขึ้นในยุโรป"
 lar_news.10.t: "การลุกฮือของคารลิสตในสงครามกลางเมืองสเปน"
 lar_news.10.desc: "ดวยความระแวงที่ถูกเบียดตกขอบมากขึ้นเรื่อย ๆ และอิทธิพลเหนือแนวรวมชาตินิยมถูกลดทอนลงทุกที กองกําลังคารลิสตภายใตมานูเอล ฟล กอนเด จึงประกาศตัดขาดจากฝายชาตินิยม หนวยเรเกเตของคารลิสต ซึ่งสวนใหญอยูทางเหนือของประเทศ ไดประกาศกอการลุกฮืออยางเปนอิสระของตนเอง และหันมาเลนงานอดีตพันธมิตร ขณะเดียวกันก็ยังคงสูรบกับศัตรูฝายสาธารณรัฐตอไป\n\nผูนําฝายชาตินิยมพยายามลดทอนความสําคัญของผลกระทบตอสถานะทางทหารในสงครามกลางเมือง แตเห็นไดชัดวาความโกลาหลในขณะนี้เปดโอกาสมากมายใหฝายสาธารณรัฐ"
 lar_news.10.desc_2: "ดวยความระแวงที่ถูกเบียดตกขอบมากขึ้นเรื่อย ๆ และอิทธิพลเหนือรัฐบาลชาตินิยมหลังสงครามที่เพิ่งตั้งไขถูกลดทอนลงทุกที กองกําลังคารลิสตภายใตมานูเอล ฟล กอนเด จึงประกาศถอนการสนับสนุนรัฐบาลใหมนี้ ในการลุกฮืออีกครั้ง หนวยเรเกเตของคารลิสต ซึ่งสวนใหญอยูทางเหนือของประเทศ ไดหันมาเลนงานอดีตพันธมิตร และประกาศตั้งรัฐบาลคูแขงขึ้นใหม\n\nผูนําฝายชาตินิยมรีบประณามการกระทําของฟล กอนเด กลาวโทษวาเขา "ผลักสเปนใหจมลงสูสงครามกลางเมืองอีกครั้ง" แตฝายคารลิสตตอบโตโดยอางถึงความพยายามอยางเปนระบบของผูนําฝายชาตินิยมที่จะกําจัดขบวนการนี้นับตั้งแตฝายสาธารณรัฐพายแพ ทําใหพวกเขาไมมีทางเลือกอื่นนอกจากตองปกปองตนเอง"
 lar_news.10.a: "ตอนนี้พวกเขาตองเห็นเราอยูในสายตาแลว!"
 lar_news.10.b: "ความสายตาสั้นของพวกเขากําลังทําใหสงครามของเราตกอยูในอันตราย!"
 lar_news.10.b_2: "พวกเขากลาเสี่ยงชัยชนะของเราเหนือฝายสาธารณรัฐเชียวหรือ?!"
 lar_news.10.c: "นี่ดีกวาที่เราคาดหวังไวเสียอีก!"
 lar_news.10.c_2: "ปลอยใหพวกเขาสําลักชัยชนะของตัวเองไป!"
 lar_news.10.d: "เรื่องชักจะซับซอนแลว..."
 lar_news.10.d_2: "มันจะไมมีวันจบหรืออยางไร?!"
 lar_news.11.t: "การลุกฮือของฝายอนาธิปไตยในสงครามกลางเมืองสเปน"
 lar_news.11.desc: "ความพยายามอยางตอเนื่องของรัฐบาลที่จะรวบอํานาจควบคุมแบบรวมศูนยเหนือคอมมูนอนาธิปไตยทางตะวันออกเฉียงเหนือของสเปนซึ่งสวนใหญดําเนินการอยางอิสระ ประกอบกับการปราบปรามแนวคิดคอมมิวนิสตฝายเห็นตางโดยพวกสตาลินนิสต ไดนําไปสูการตอสูกันเองอยางเต็มรูปแบบภายในแนวรวมฝายสาธารณรัฐ\n\nในชวงแรกจํากัดอยูเพียงการสูรบตามทองถนนและการปะทะขนาดเล็กระหวางกองกําลังอาสากับกองกําลังรัฐบาลหรือสตาลินนิสต แตการที่ไมมีฝายใดยอมประนีประนอมทําใหความขัดแยงลุกลามอยางรวดเร็วภายในเวลาเพียงไมกี่วัน การโยกยายทรัพยากรทางทหารมารับมือภัยคุกคามภายในนี้ทําใหแนวหนาที่เผชิญฝายชาตินิยมออนแอลงอยางเห็นไดชัด"
 lar_news.11.desc_2: "ความพยายามอยางตอเนื่องของรัฐบาลที่จะรวบอํานาจควบคุมแบบรวมศูนยเหนือคอมมูนอนาธิปไตยทางตะวันออกเฉียงเหนือของสเปนซึ่งสวนใหญดําเนินการอยางอิสระ ประกอบกับการปราบปรามแนวคิดคอมมิวนิสตฝายเห็นตางโดยพวกสตาลินนิสต ไดนําไปสูการตอสูกันเองอยางเต็มรูปแบบในหมูฝายสาธารณรัฐผูชนะสงครามกลางเมืองสเปน\n\nในชวงแรกจํากัดอยูเพียงการสูรบตามทองถนนและการปะทะขนาดเล็กระหวางกองกําลังอาสากับกองกําลังรัฐบาลหรือสตาลินนิสต แตการที่ไมมีฝายใดยอมประนีประนอมทําใหความขัดแยงลุกลามอยางรวดเร็วภายในเวลาเพียงไมกี่วัน เมื่อผูนําแตละฝายปฏิเสธจะพิจารณาการปรองดองและแนวรบถูกขีดขึ้น สเปนดูเหมือนถูกลิขิตใหจมลงสูสงครามกลางเมืองอีกครั้ง"
 lar_news.11.a: "ยอดเยี่ยม ปลอยใหพวกเขาฉีกกันเองไป!"
 lar_news.11.b: "ไมทางใดก็ทางหนึ่ง การแทรกแซงของพวกเขาจะตองสิ้นสุดลง"
 lar_news.11.b_2: "พวกเขากลาเสี่ยงชัยชนะของเราเหนือฝายชาตินิยมเชียวหรือ?!"
 lar_news.11.c: "ถึงเวลาสลัดแอกทิ้งแลว!"
 lar_news.11.d: "ฝายสาธารณรัฐแทบไมตองใหใครชวยก็แพเองได..."
 lar_news.12.t: "[From.GetNameDefCap]เขารวม[From.GetFactionName]"
 lar_news.12.desc: "แมยังอยูระหวางการฟนตัวจากสงครามกลางเมือง [From.GetNameDef]ก็ไดเจรจาเขารวม[From.GetFactionName]อยางนาประหลาดใจ ดูเหมือนวาความชวยเหลือขนาดใหญจากฝายอักษะที่ฝายชาตินิยมไดรับระหวางสงครามกลางเมืองไมไดทําใหรัฐบาล[From.GetAdjective]ชุดใหมใกลชิดกับผูสนับสนุนตางชาติของตนมากขึ้น"
 lar_news.12.a: "เราตองมีพันธมิตร"
 lar_news.12.b: "เรายินดีตอนรับพวกเขาเขาสูครอบครัว"
 lar_news.12.c: "งั้นเราก็จะพิชิตพวกเขาดวย"
 lar_news.12.d: "พวกเขาเลือกขางแลว"
 lar_news.13.desc: "แมยังอยูระหวางการฟนตัวจากสงครามกลางเมือง [From.GetNameDef]ก็ไดเจรจาเขารวม[From.GetFactionName]อยางนาประหลาดใจ ความรวมมือไดเริ่มขึ้นแลวตั้งแตสงครามกลางเมือง ซึ่ง[From.GetNameDef]ไดรับความชวยเหลือทางทหารอยางมหาศาลจาก[From.GetFactionName] และดูเหมือนวานั่นเปนเพียงจุดเริ่มตนของอนาคตที่เชื่อมโยงกันแนนแฟนยิ่งขึ้น"
 lar_news.14.t: "[SPA.GetNameDefCap]เรียกรองแอฟริกาเหนือของฝรั่งเศส"
 lar_news.14.desc: "หลังเผชิญแรงกดดันอยางไมลดละจาก[SPA.GetAdjective]มาหลายสัปดาห จนถึงจุดสูงสุดดวยคําขาดฉบับสุดทายเมื่อวานนี้ รัฐบาล[From.GetAdjective]ไมเห็นทางอื่นนอกจากยอมตามขอเรียกรองและสละอํานาจควบคุมแอฟริกาเหนือ เพื่อรักษาสันติภาพกับเพื่อนบาน"
 lar_news.14.a: "พวกเขาตัดสินใจไดชาญฉลาด"
 lar_news.14.b: "เราไมมีทางเลือกอื่น"
 lar_news.14.c: "ไอพวกสารเลวกําลังยกดินแดนของเราเองแท ๆ ใหคนอื่น!"
 lar_news.14.d: "และเพียงชั่วพริบตา เราก็เสียแอฟริกาเหนือไป..."
 lar_news.14.e: "พวกเขากําลังฉวยโอกาส"
 lar_news.15.t: "สหภาพฝรั่งเศส-สเปน"
 lar_news.15.desc: "นับตั้งแตขบวนการนิยมกษัตริยคูแฝดใน[SPB.GetNameDef]และ[FRA.GetNameDef]ขึ้นสูอํานาจเมื่อระยะหนึ่งกอน ความสัมพันธฝรั่งเศส-สเปนก็แนนแฟนขึ้น และนโยบายตางประเทศของทั้งสองก็พันเกี่ยวกันมากขึ้นเรื่อย ๆ\n\nบัดนี้ หลังขบวนการเลจิติมิสตใน[FRA.GetNameDef]ประกาศอยางเปนทางการใหกษัตริย[SPB.GetLeader]เปนผูอางสิทธิ์โดยชอบธรรมในบัลลังกฝรั่งเศส พระองคไดออกพระราชประกาศอยางเปนทางการถึงพระราชประสงคที่จะรับมงกุฎฝรั่งเศส รัฐบาลเลจิติมิสตใน[FRA.GetNameDef]จึงเริ่มเตรียมพิธีราชาภิเษกอันยิ่งใหญในมหาวิหารแร็งส"
 lar_news.15.a: "มหาอํานาจใหมกําลังจะผงาดขึ้น!"
 lar_news.15.b: "อนาคตอันงดงามรอฝรั่งเศสอยู!"
 lar_news.15.c: "นี่จะเปนการพลิกดุลอํานาจครั้งใหญ!"
 lar_news.16.t: "สหภาพไอบีเรีย"
 lar_news.16.desc: "หลังถูกกดดันจากรัฐบาล[SPB.GetAdjective]มาหลายเดือน [POR.GetNameDef]ซึ่งโดดเดี่ยว ไรพันธมิตร และตองเผชิญกองทัพ[SPB.GetAdjective]ที่เหนือกวาอยางทวมทน ไมเห็นทางเลือกอื่นนอกจากยอมรับการอางสิทธิ์ของ[SPB.GetLeader]ในบัลลังก[POR.GetAdjective] ผลคือบัดนี้ชาติดังกลาวเปนเพียงจังหวัดหนึ่งของ[SPB.GetNameDef]ที่กําลังขยายตัว"
 lar_news.16.a: "สหภาพไอบีเรียกลับมาเปนอยางที่ควรเปนอีกครั้ง!"
 lar_news.16.b: "ไอบีเรียรวมกันอีกครั้งหรือ? นาสนใจ"
 lar_news.17.t: "ฟนฟูราชาธิปไตย[From.GetAdjective]"
 lar_news.17.b: "ดีสําหรับพวกเขาเลย"
 lar_news.18.desc: "หลายเดือนหลังการตัดสินใจอันนาประหลาดใจของฟรันซิสโก ฟรังโก ที่สละอํานาจและประกาศการกลับมาของกษัตริยโดยชอบธรรมแหงสเปน [From.GetSPBkingloc]ก็ไดเสด็จเขาสูมาดริดในเชาวันนี้ในที่สุด ทามกลางเสียงโหรองของฝูงชนที่ปลาบปลื้ม ขบวนเสด็จไดเคลื่อนผานถนนในมาดริดไปยังโบสถซานเฆโรนิโมเอลเรอัล\n\nในพิธีอันโออา [From.GetSPBking2loc]\n\nแมประเทศสวนใหญยังคงอยูในซากปรักหักพัง แตบางทีกษัตริยองคใหมอาจเปนพลังที่หลอมรวมและเยียวยา และนํา[From.GetNameDef]ไปสูอนาคตที่รุงโรจนยิ่งขึ้น"
 lar_news.18.a: "ในที่สุดเราก็ไดประมุขแหงรัฐโดยชอบธรรมกลับคืนมา!"
 lar_news.18.b: "แตพระองคจะนําความเปลี่ยนแปลงที่เห็นไดชัดมาหรือไม?"
 lar_news.19.t: "กลุมละติน"
 lar_news.19.desc: "วันนี้[From.GetNameDef]ไดประกาศกอตั้งพันธมิตรใหมของมหาอํานาจละติน ซึ่งอาจเปนทางเลือกแทนกลุมอํานาจหลักของโลก แมจะเจรจากันมาหลายเดือน แตยังไมชัดเจนนักวาชาติใดจะเลือกเขารวมองคกรใหมนี้ แมผูเชี่ยวชาญจะเสนอชื่อ[POR.GetNameDef] [FRA.GetNameDef] และ[ITA.GetNameDef]"
 lar_news.19.a: "นี่คือหนทางที่ดีที่สุดในการปกปองผลประโยชนรวมของเรา"
 lar_news.19.b: "กาวที่กลาหาญ"
 lar_news.20.t: "สงครามประกาศเอกราช[SPD.GetAdjective]"
 lar_news.20.desc: "ในชวงหลายเดือนที่ผานมา ความสัมพันธ[SOV.GetAdjective]-[SPD.GetAdjective]ตึงเครียดขึ้นเรื่อย ๆ และผูสังเกตการณอิสระไดสังเกตเห็นการปลดคอมมิวนิสตออกจากตําแหนงที่มีอิทธิพลของ[SPD.GetAdjective]อยางเปนระบบ เพื่อตอบโต [SOV.GetNameDef]ไดตั้งเขตยึดครองโดยตรงขึ้นทางตะวันออกของประเทศ เพื่อพยายามบังคับรัฐบาล[SPD.GetAdjective]ที่ดื้อดึงใหอยูในโอวาท\n\nบัดนี้สถานการณมาถึงจุดแตกหัก เมื่อ[SPD.GetLeader]กลาวออกอากาศอยางเรารอน ประกาศเอกราช[SPD.GetAdjective] และปลุกระดมเพื่อนรวมชาติให "กวาดลางอิทธิพลโซเวียตออกจากชาติใหสิ้นซาก" ในเวลาเดียวกัน การโจมตีแบบจูโจมครั้งใหญของ[SPD.GetAdjective]ตอเขตยึดครองก็ไดเริ่มขึ้น"
 lar_news.20.a: "¡Por la libertad! (เพื่อเสรีภาพ!)"
 lar_news.20.b: "การแกแคนของเราจะรวดเร็วและนาสะพรึงกลัว!"
 lar_news.20.c: "ชางพอเหมาะพอเจาะ ¡Buena suerte, España! (โชคดีนะ สเปน!)"
 lar_news.20.d: "หนีเสือปะจระเข..."
 lar_news.21.t: "รวมสํานักงานลอนดอน"
 lar_news.21.desc: "เมื่อ[From.GetAdjective]แข็งแกรงขึ้น รัฐบาลจึงเห็นสมควรประกาศกอตั้งพันธมิตรคอมมิวนิสตใหมในชื่อ สํานักงานระหวางประเทศเพื่อเอกภาพสังคมนิยมปฏิวัติ ซึ่งคัดคานการตีความลัทธิมารกซทั้งแบบทรอตสกีและแบบสตาลิน\n\nเริ่มตนจาก "สํานักงานลอนดอน" คณะกรรมการที่ประกอบดวยองคกรคอมมิวนิสตอิสระซึ่งตั้งอยูในลอนดอน บัดนี้พวกเขายินดีตอนรับทุกชาติที่ "ปรารถนาหนทางสูอุดมการณคอมมิวนิสตโดยปราศจากการแทรกแซงจากภายนอก" ใหมารวมขบวน"
 lar_news.21.a: "เราจะนําโลกมารกซิสตที่บริสุทธิ์"
 lar_news.21.b: "นารังเกียจ!"
 lar_news.21.c: "ขอเสนอที่นาสนใจ!"
 lar_news.21.d: "ขบวนการคอมมิวนิสตยิ่งแตกแยกหนักขึ้นไปอีก!"
 lar_news.22.t: "ลัทธิอนาธิปไตยประสบความสําเร็จ"
 lar_news.22.desc: "แมเวลาจะผานไปพอสมควรนับตั้งแตสงครามกลางเมืองสเปนยุติลง แตการลมสลายของคอมมูนอนาธิปไตยในไอบีเรียที่หลายคนคาดไวกลับไมเกิดขึ้น ตรงกันขาม มีรายงานวาคอมมูนตาง ๆ สามารถสรางเสถียรภาพและฟนฟูภูมิภาคไดสําเร็จ และยังคงดึงดูดผูอพยพที่มีแนวคิดเดียวกันจากหลายชาติทั่วโลก\n\nอยางไรก็ตาม ทามกลางความเปนปรปกษจากนานาชาติที่ยังไมลดลง คอมมูนจึงเลือกคงการจัดตั้งไวภายใต "สภาปองกัน" และเดินหนาโครงการเสริมสรางอาวุธอยางกวางขวางตอไป"
 lar_news.22.a: "เราทําสําเร็จมามากแลว แตตองเตรียมรับสิ่งที่เลวรายที่สุด!"
 lar_news.22.b: "พวกเขาเปนภัยคุกคามตอการดํารงอยูของวิถีชีวิตเรา!"
 lar_news.23.t: "ชาติไอบีเรียเขารวม[ENG.GetFactionName]"
 lar_news.23.desc: "นักการเมือง[POR.GetAdjective]และ[?global.POR_iberian_summit_spanish_tag.GetAdjective]ไดรวมมือกันยื่นคํารองตอรัฐบาล[ENG.GetAdjective]เพื่อขอเขารวม[ENG.GetFactionName] ยังไมชัดเจนวาพวกเขาเพียงตองการการคุมครองจากภัยคุกคามตางชาติ หรือพรอมจะรวมตอสูเพื่อประชาธิปไตยอยางแทจริง \n\nอยางไรก็ตาม หลังประเมินสถานการณแลว [ENG.GetNameDefCap]เห็นวาเรื่องนี้เปนประโยชนตอผลประโยชนของตน และในที่สุดก็อนุญาตใหชาติไอบีเรียเขารวมพันธมิตร"
 lar_news.23.a: "ตอนนี้เราจะสูไปดวยกัน"
 lar_news.23.b: "ก็แคเหยื่อเพิ่มอีกรายสําหรับเรา"
 lar_news.23.c: "เราจะรวมกันตอสูเพื่อเสรีภาพ!"
 lar_news.23.d: "ในที่สุดชาติไอบีเรียก็รวมมือกัน..."
 lar_news.24.t: "ชาติไอบีเรียเขารวม[GER.GetFactionName]"
 lar_news.24.desc: "นักการเมือง[POR.GetAdjective]และ[?global.POR_iberian_summit_spanish_tag.GetAdjective]ไดรวมมือกันยื่นคํารองตอรัฐบาล[GER.GetAdjective]เพื่อขอเขารวม[GER.GetFactionName] ยังไมชัดเจนวานี่เปนการฉวยโอกาสเพื่อหวังดินแดนใหม หรือเปนเพียงความพยายามอยางสิ้นหวังเพื่อเลี่ยงการถูกยึดครอง \n\nอยางไรก็ตาม หลังประเมินสถานการณแลว [GER.GetNameDefCap]เห็นวาเรื่องนี้เปนประโยชนตอผลประโยชนของตน และในที่สุดก็อนุญาตใหชาติไอบีเรียเขารวมพันธมิตร"
 lar_news.24.a: "เราเลือกขางถูกแลว"
 lar_news.24.b: "บัดนี้ศัตรูของเราจะตองพินาศ!"
 lar_news.24.c: "พวกเขาไปเขาขางปศาจ"
 lar_news.24.d: "ในที่สุดชาติไอบีเรียก็รวมมือกัน..."
 lar_news.25.t: "พระราชพิธีอภิเษกสมรสในบราซิล"
 lar_news.25.desc: "วันนี้ ดง ดูอารตี นูนู ดยุกแหงบรากังซา ไดอภิเษกสมรสกับเจาหญิงมาเรีย ฟรันซิสกาแหงออรเลอ็อง-บรากังซา ณ มหาวิหารเปโตรโปลิสในบราซิล การอภิเษกสมรสครั้งนี้ไมเพียงทําใหราชสกุลบรากังซาของโปรตุเกสและบราซิลคืนดีกัน แตยังรวมฝายมิเกลิสตและฝายบรากังซาสายเสรีนิยมเขาดวยกัน ทิ้งความบาดหมางภายในราชวงศโปรตุเกสไวเบื้องหลัง และปลุกกระแสนิยมกษัตริยในทั้งสองประเทศ \n\nกลาวกันวาหลังพิธี ดง ดูอารตีไดสนทนากับสุภาพสตรีและสุภาพบุรุษฝายนิยมเจาที่มีชื่อเสียงทั้งชาวบราซิลและโปรตุเกสหลายครั้ง ซึ่งมีการเอยถึงคําวา 'การฟนฟู' และ 'ระบอบกษัตริย' อยางเปดเผย"
 lar_news.25.a: "นี่เปนเพียงจุดเริ่มตน"
 lar_news.25.b: "พัฒนาการที่นาสนใจ..."
 lar_news.26.t: "จักรวรรดิโปรตุเกสและบราซิล"
 lar_news.26.desc: "หลังการฟนฟูระบอบกษัตริยในโปรตุเกสและบราซิล กษัตริยโปรตุเกสและจักรพรรดิบราซิลไดเขารวมการประชุมหลายครั้งเพื่อหารือถึงความจําเปนและประโยชนที่อาจไดรับจากการรวมสองประเทศอีกครั้ง \nหลังการเจรจาอันยาวนานในการประชุมสุดยอดบราซิล-โปรตุเกสครั้งลาสุด ผูปกครองทั้งสองไดตกลงสถาปนา[POR.GetNameDef]ขึ้นใหมอยางเปนทางการ \n\nวันนี้ ทามกลางการถวายพระพรของฝูงชนผูนิยมกษัตริยที่มาชุมนุมกัน [POR.GetLeader]ไดรับการสวมมงกุฎเปนจักรพรรดิแหงโปรตุเกสและบราซิล จักรพรรดิไดขอบใจราษฎรสําหรับความจงรักภักดี และประกาศวาพระองคจะปกครองเพื่อประโยชนของพลเมืองทุกคนที่อยูใตการปกครองของพระองค"
 lar_news.26.a: "จักรพรรดิจงทรงพระเจริญ!"
 lar_news.26.b: "จักรวรรดิที่ผงาดขึ้นมาเพื่อลมสลายอีกครั้ง"
 lar_news.26.c: "แคภาพลวงแหงความยิ่งใหญ..."
 lar_news.27.t: "การรวมชาติไอบีเรีย"
 lar_news.27.desc: "นักการเมืองโปรตุเกสและสเปนไดประชุมกันหลายครั้งในชวงหลายเดือนที่ผานมา เพื่อหารือถึงความเปนไปไดในการเปนรัฐฝายซายหนึ่งเดียวในไอบีเรีย ซึ่งปกครองโดยนักการเมืองจากทั้งสองชาติ \n\nหลังการเตรียมการและเจรจามาอยางยาวนาน วันนี้ผูนําโปรตุเกสและสเปนไดประกาศกอตั้ง[POR.GetNameDef]อยางเปนทางการ รัฐใหมที่พลเมืองไอบีเรียจะไดเลือกผูนําที่เปนตัวแทนผลประโยชนสวนรวมไดดีที่สุด และจะสามารถเดินทางไปมาไดอยางเสรี"
 lar_news.27.a: "นี่เปนเพียงจุดเริ่มตน"
 lar_news.27.b: "ความริเริ่มที่ดีของประชาชนไอบีเรีย"
 lar_news.27.c: "ภัยคอมมิวนิสตแพรกระจายราวกับโรคระบาด..."
 lar_news.27.d: "ก็แคชื่อหรูไวปกปดความทะเยอทะยานที่แทจริง"
 lar_news.28.t: "ฝายสาธารณรัฐสเปนพายแพ"
 lar_news.28.desc: "สงครามกลางเมืองสเปนดูเหมือนจะจบลงแลว เมื่อกองกําลังฝายสาธารณรัฐที่เหลืออยูยอมจํานนหรือหลบซอนตัว แมผูนําฝายชาตินิยมจะฉวยจังหวะประกาศยุติสงครามกลางเมืองไปแลว แตผูเชี่ยวชาญชี้ถึงความขัดแยงที่เพิ่มขึ้นเรื่อย ๆ ภายในฝายชาตินิยมเอง และโตแยงวาสงครามอาจเพียงกาวเขาสูขั้นใหม เมื่อไมมีศัตรูรวมแลว พวกเขาเห็นวาเปนไปไดสูงยิ่งที่ความเห็นไมลงรอยเหลานี้จะทําใหเอกภาพของฝายชาตินิยมแตกราวยิ่งขึ้น\n\nในระดับหนึ่ง ผูนําฝายชาตินิยมและประชาชนเองก็ดูจะเห็นเชนนั้น เพราะกองกําลังอาสาที่ตั้งขึ้นระหวางสงครามกลางเมืองเพื่อปราบฝายสาธารณรัฐยังไมถูกยุบ และกลับคอยจับตาเพื่อนบานอยางระแวดระวัง"
 lar_news.28.a: "อยางนอยสงครามกลางเมืองก็พลิกมาเปนผลดีตอเรา"
 lar_news.28.b: "ความขัดแยงดูเหมือนยังไมยุติ"
 lar_news.28.c: "ปลอยใหพวกเขาฉีกกันเองทามกลางชัยชนะ!"
 lar_news.28.d: "อีกไมนานเราก็ตองจัดการกับพวกคารลิสต..."
 lar_news.28.e: "เราตองลงมือโดยเร็ว มิฉะนั้นพวกคารลิสตและฟาลังเฆจะทําใหชาติแตกแยกอีกครั้ง!"
 lar_news.28.f: "อีกไมนานเราก็ตองจัดการกับพวกฟาลังเฆ..."
 lar_news.29.t: "ฝายชาตินิยมสเปนพายแพ"
 lar_news.29.desc: "สงครามกลางเมืองสเปนดูเหมือนจะจบลงแลว เมื่อกองกําลังฝายชาตินิยมที่เหลืออยูยอมจํานนหรือหลบซอนตัว แมผูนําฝายสาธารณรัฐจะฉวยจังหวะประกาศยุติสงครามกลางเมืองไปแลว แตผูเชี่ยวชาญชี้ถึงความขัดแยงที่เพิ่มขึ้นเรื่อย ๆ ภายในฝายสาธารณรัฐเอง และโตแยงวาสงครามอาจเพียงกาวเขาสูขั้นใหม เมื่อไมมีศัตรูรวมแลว พวกเขาเห็นวาเปนไปไดสูงยิ่งที่ความเห็นไมลงรอยเหลานี้จะทําใหเอกภาพของสาธารณรัฐที่สองแตกราวยิ่งขึ้น\n\nในระดับหนึ่ง ผูนําฝายสาธารณรัฐและประชาชนเองก็ดูจะเห็นเชนนั้น เพราะกองกําลังอาสาที่ตั้งขึ้นระหวางสงครามกลางเมืองเพื่อปราบฝายชาตินิยมยังไมถูกยุบ และกลับคอยจับตาเพื่อนบานอยางระแวดระวัง"
 lar_news.29.d: "อีกไมนานเราก็ตองจัดการกับรัฐบาล..."
 lar_news.29.e: "อีกไมนานเราก็ตองจัดการกับพวกอนาธิปไตย..."
 lar_news.281.t: "ฟนฟูอันดาลูเซีย!"
 lar_news.281.desc: "หลายศตวรรษกอน ชาวมัวรถูกขับไลออกจากไอบีเรียในสงครามยึดดินแดนคืน (เรกองกิสตา) บัดนี้ กองกําลัง[From.GetOldAdjective]ไดรุกลึกเขาสูไอบีเรียตอนใตและเริ่มตั้งถิ่นฐานของชาวมัวรในภูมิภาคนี้เปนครั้งแรกในรอบหลายศตวรรษ [From.GetOldNameDefCap]จึงไดรับการจัดระเบียบใหมเปนชาติใหมที่รูจักกันในชื่อ “[From.GetNameDefCap]” เพื่อทวงคืนมรดกของรัฐสุลตานโบราณที่ครั้งหนึ่งเคยปกครองทั่วทั้งไอบีเรีย\n\nรัฐเคาะลีฟะฮอุมัยยะฮโบราณเคยปกครองโลกอิสลามเกือบทั้งหมด ตั้งแตไอบีเรียทางตะวันตกจรดเปอรเซียทางตะวันออก บางที[From.GetLeader]อาจปรารถนาจะเจริญรอยตามจักรวรรดิเกาแกนี้ และรวมผูคนที่กระจัดกระจายในตะวันออกกลาง แอฟริกาเหนือ และยุโรปเขาดวยกันอีกครั้ง"
 lar_news.281.a: "วันอันรุงโรจน!"
 lar_news.281.b: "เรื่องนี้จะมีความหมายตอสเปนอยางไร?"
 lar_news.291.t: "โพลินีเซียรวมเปนหนึ่ง!"
 lar_news.291.desc: "เมื่อหมูเกาะฮาวาย อาโอเทอารัว ตาฮีตี และซามัวอยูภายใตการควบคุมของ[From.GetOldAdjective]อยางมั่นคงแลว [From.GetLeader]ไดประกาศวาประเทศนี้จะเปนที่รูจักในชื่อ[From.GetNameDef] และเปนบานอันชอบธรรมของชาวแปซิฟกทั้งปวง\n\nทั่วโลกโพลินีเซียตางเฉลิมฉลองกันอยางยิ่งใหญ บางคนถึงกับประกาศวา[From.GetLeader]คือผูสืบทอดที่แทจริงเพียงหนึ่งเดียวของคาเมฮาเมฮา กษัตริยฮาวายผูทําใหคําพยากรณนาฮาเปนจริงเมื่อกวาสองศตวรรษกอน"
 lar_news.291.new_zealand_desc: "เมื่อหมูเกาะฮาวาย อาโอเทอารัว ตาฮีตี และซามัวอยูภายใตการควบคุมของ[From.GetOldAdjective]อยางมั่นคงแลว [From.GetLeader]ไดประกาศวาประเทศนี้จะเปนที่รูจักในชื่อ[From.GetNameDef] และเปนบานอันชอบธรรมของชาวแปซิฟกทั้งปวง\n\nดวยประวัติศาสตรอันยาวนานของการแสวงประโยชนแบบอาณานิคม ชาวเมารีพื้นเมืองมักลังเลที่จะแสดงความภักดีหรือใหการสนับสนุนใด ๆ แกรัฐบาล[From.GetOldAdjective] แตนับตั้งแตการลงนามพันธมิตรราตานาระหวางผูนําชาวกีวีและชาวเมารี และการที่ชาวเมารีมีผูแทนในรัฐบาลเพิ่มขึ้น [From.GetNameDef]ก็กลายเปนชาติตนแบบของพหุวัฒนธรรมหลังยุคอาณานิคม"
 lar_news.291.a: "Kei whea mai! (ไมมีใครเทียบได!)"
 lar_news.291.b: "อะโลฮา!"
 LAR_fra_voted_independence_tt: "ลงมติเลือกเอกราช"
 SPR_core_of_spain_flag: "เปนดินแดนหลักของสเปน"
 lar_fra_join_the_ententes.1.t: "[From.GetNameDefCap]เสนอพันธมิตรทางยุทธศาสตร"
 lar_fra_join_the_ententes.1.desc: "รัฐบาล[From.GetAdjective]ไดติดตอเราพรอมขอเสนอเพื่อประสานผลประโยชนทางยุทธศาสตรที่แตกตางกันของเรา แมพวกเขาตั้งใจจะยึดมั่นในพันธะทางการทูตและการทหารบนภาคพื้นทวีป แตก็ตระหนักถึงผลประโยชนรวมของเราในหลายภูมิภาคทั่วโลก\n\nขอเสนอของพวกเขาจึงเสนอใหเรารวมเปนพันธมิตร ซึ่งจะรับประกันการชวยเหลือซึ่งกันและกันหากฝายใดเห็นวาผลประโยชนของตนถูกคุกคาม"
 lar_fra_join_the_ententes.1.a: "ขอเสนอที่สมเหตุสมผล"
 lar_fra_join_the_ententes.1.b: "นี่ไมเปนประโยชนตอเรา"
 lar_fra_join_the_ententes.2.t: "[From.GetNameDefCap]ตอบรับขอเสนอของเรา"
 lar_fra_join_the_ententes.2.desc: "รัฐบาล[From.GetAdjective]ไดหารือเรื่องพันธมิตรที่เราเสนอและตัดสินใจตอบรับ ขณะที่หนวยงานการทูตของทั้งสองฝายหารือรายละเอียดปลีกยอย เรามั่นใจไดวา[From.GetNameDef]จะมาชวยเหลือเราหากเราตองการ - ตราบใดที่เราพรอมจะทําเชนเดียวกันใหพวกเขา"
 lar_fra_join_the_ententes.2.a: "พันธมิตรของเราแข็งแกรงยิ่งขึ้น"
 lar_fra_join_the_ententes.3.t: "[From.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 lar_fra_join_the_ententes.3.desc: "หลังการหารืออยางยืดเยื้อ คณะรัฐมนตรี[From.GetAdjective]ไดลงมติดวยคะแนนเสียงฉิวเฉียดใหปฏิเสธขอเสนอของเรา คําตอบอยางเปนทางการระบุวาพันธมิตรระหวาง[From.GetNameDef]กับ[This.GetNameDef]จะผูกมัดให[From.GetNameDef]ตองปกปองประเทศที่ตนตั้งใจไมผูกพันดวยอยางหลีกเลี่ยงไมได คําตอบยังระบุตอวา แมเรายอมมีอิสระในการกําหนดนโยบายตางประเทศของเราเอง แตเราไมควรคาดหวังให[From.GetNameDef]มาชวยเหลือหากเราถูกลากเขาสูความขัดแยงที่ใหญกวา"
 lar_fra_join_the_ententes.3.a: "พวกโงสายตาสั้น!"
 LaR_france_vichy_notification_events.1.t: "ซีเรียแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.1.desc: "หลังการเรียกรองโดยตรงจาก[FRA.GetLeader] ผูวาการดินแดนไดประกาศสวามิภักดิ์ตอสิ่งที่เรียกวา "รัฐบาลพลัดถิ่น[FRA.GetAdjective]" ซึ่งมี[FRA.GetLeader]เปนผูนํา ทหารของเราในพื้นที่ไดรับการขอใหเขารวมกองกําลังของ[FRA.GetLeader] แตสวนใหญเลือกที่จะถูกสงตัวกลับมายังแนวของเรา\n\nอยางไรก็ตาม บัดนี้[FRA.GetLeader]ไดควบคุมภูมิภาคนี้แลว"
 LaR_france_vichy_notification_events.1.a: "กบฏและทรยศ!"
 LaR_france_vichy_notification_events.2.t: "อินโดจีนแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.3.t: "แอฟริกากลางแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.4.t: "แอฟริกาตะวันตกแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.5.t: "แอฟริกาเหนือแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.6.t: "มาดากัสการแปรพักตรไปเขากับ[FRA.GetLeader]"
 LaR_france_vichy_notification_events.7.t: "รัฐประหารหนุน[FRA.GetLeader]ในซีเรีย"
 LaR_france_vichy_notification_events.7.desc: "กองกําลังที่ภักดีตอ[FRA.GetLeader]ไดกอรัฐประหารขึ้นในดินแดนนี้ กอนรุงสางเพียงเล็กนอย กลุมติดอาวุธหลายกลุมซึ่งเห็นไดชัดวาทําตามคําสั่งของ[FRA.GetLeader] ไดเขายึดจุดยุทธศาสตรทั่วพื้นที่เพื่อสกัดความพยายามตอตานที่ประสานกันใด ๆ พอถึงเที่ยงวัน พวกเขาก็ควบคุมศูนยกลางประชากรสําคัญทั้งหมดและยึดอํานาจควบคุมดินแดนไวไดอยางแทจริง"
 LaR_france_vichy_notification_events.7.a: "ชางเปนวิธีที่สกปรกและไมสมเปนชาวฝรั่งเศสเลย!"
 LaR_france_vichy_notification_events.8.t: "รัฐประหารหนุน[FRA.GetLeader]ในอินโดจีน"
 LaR_france_vichy_notification_events.9.t: "รัฐประหารหนุน[FRA.GetLeader]ในแอฟริกากลาง"
 LaR_france_vichy_notification_events.10.t: "รัฐประหารหนุน[FRA.GetLeader]ในแอฟริกาตะวันตก"
 LaR_france_vichy_notification_events.11.t: "รัฐประหารหนุน[FRA.GetLeader]ในแอฟริกาเหนือ"
 LaR_france_vichy_notification_events.12.t: "รัฐประหารหนุน[FRA.GetLeader]ในมาดากัสการ"

 lar_spain.100.t: "การรวมชาวฮิสแปนิก!"
 lar_spain.100.d: "นับแตวันนี้ [SPR.GetLeader]ไดประกาศการรวมชาวฮิสแปนิกทั้งปวงภายใตธงของ[SPR.GetNameDef] พวกเขาแถลงวาเปาหมายคือการปกปองและนําพาชาวฮิสแปนิกทั้งหมดไปสูความรุงเรือง และทําใหจักรวรรดิยืนหยัดอยูไดอีกพันป พรอมระบุอีกวาภารกิจแหงชาติของพวกเขายังไมสิ้นสุด"
 lar_spain.100.a: "พวกเขาจะลมสลายอีกครั้ง"
 lar_spain.100.b: "เรากลับมาเปนมหาอํานาจโลกอีกครั้ง!"
 
