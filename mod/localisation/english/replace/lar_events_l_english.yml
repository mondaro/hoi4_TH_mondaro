l_english:
 LAR_concessions_stresa_front_tt: "คุณจะตองรักษาคํามั่นดวยการเขารวมแนวรวมสเตรซาตอตานเยอรมนี หากปฏิเสธ จะไมมีการยกดินแดนให"
 lar_concessions_italy_tt: "อิตาลีจะมีแนวโนมยอมรวมปฏิบัติการตอตานเยอรมนีมากขึ้น"
 lar_france_stresa_front_italy_agreed: "อิตาลีตกลงเขารวมแนวรวมสเตรซาเพื่อแลกกับการไดรับดินแดน"
 france_continue_the_fight_tt: "เราจะไมไดรับโอกาสยอมจํานนอยางมีเกียรติอีกแลว หากเราพายแพ ฝรั่งเศสภาคพื้นทวีปทั้งหมดจะถูกยึดครอง"
 lar_congress_of_paris.1.t: "การประชุมแหงปารีส"
 lar_congress_of_paris.1.desc: "ตามคําเชิญของ[This.GetLeader] [ITA.GetLeader] [SPA.GetLeader] และ[POR.GetLeader]ไดเดินทางมาถึงปารีสเพื่อหารือสนธิสัญญาวาดวยเขตอิทธิพลอาณานิคมในแอฟริกา ดวยฝรั่งเศสและอิตาลีเปนมหาอํานาจหลักที่ตองการขยายจักรวรรดิ จึงจําเปนตองยอมผอนปรนให[SPA.GetNameDef]และ[POR.GetNameDef] เพื่อโนมนาวใหทั้งสองเขารวมพันธมิตรและทําสงครามเพื่อบรรลุเปาหมายเหลานี้\n\nขณะที่[POR.GetLeader]นาจะพยายามหาการสนับสนุนแผนการรวมแองโกลาและโมซัมบิกที่วาดฝนมานาน [SPA.GetLeader]คงตองถูกซื้อใจดวยการยกดินแดนบางสวนในแอฟริกาเหนือของฝรั่งเศสให"
 lar_congress_of_paris.1.a: "เราจะไดรับคาชดเชยที่อื่นแทน"
 lar_congress_of_paris.2.t: "วาดแผนที่แอฟริกาใหม"
 lar_congress_of_paris.2.desc: "ในการเจรจารอบแรก คณะผูแทนฝรั่งเศสเสนอใหแบงทวีปออกเปนสองสวนตรงกลางอยางงาย ๆ โดยใหเราไดสิทธิ์อางสิทธิ์เหนืออียิปต ซูดาน และลึกลงไปทางใตจนถึงเคนยา แมขอเสนอนี้จะขาดรายละเอียด และสวนใหญเกี่ยวกับดินแดนที่ทั้งสองฝายไมไดควบคุมจริง แตก็เปนคํามั่นวาฝรั่งเศสจะสนับสนุนการพิชิตจักรวรรดิแอฟริกาอันกวางใหญ"
 lar_congress_of_paris.2.a: "ความฝนถึงจักรวรรดิอิตาลีในแอฟริกาคุมคาที่จะเสี่ยงสักหนอย"
 lar_congress_of_paris.2.b: "ไมมีเหตุผลที่เราจะตองสนับสนุนเรื่องนี้"
 lar_congress_of_paris.3.t: "[From.GetNameDefCap]ตกลง"
 lar_congress_of_paris.3.desc: "คณะผูแทนจาก[From.GetNameDef]ไดตกลงในหลักการตอการเปลี่ยนแปลงดินแดนที่เสนอแลว แมยังมีรายละเอียดปลีกยอยบางประการที่ตองตกลงกัน และตําแหนงที่แนชัดของพรมแดนใหมยังเปนที่ถกเถียงอยูบาง แตนักการทูตของเราคาดวาจะไมมีปญหาใหญที่จะทําใหขอตกลงลม"
 lar_congress_of_paris.3.a: "ทําไดดีมาก"
 lar_congress_of_paris.4.t: "[From.GetNameDefCap]ปฏิเสธ"
 lar_congress_of_paris.4.desc: "คณะผูแทนจาก[From.GetNameDef]ประกาศยุติการเจรจา โดยอางความเห็นที่แตกตางกันอยางสิ้นเชิงตอการเปลี่ยนแปลงที่เสนอ พวกเขาไดออกจากปารีสเพื่อเดินทางกลับ[From.GetNameDef]\n\n หลังการจากไปอยางเรงรีบ เอกอัครราชทูต[From.GetAdjective]ประกาศวารัฐบาล[From.GetAdjective]ไมถือวาตนผูกพันกับสนธิสัญญาความชวยเหลือซึ่งกันและกันหรือพันธมิตรใด ๆ กับเราอีกตอไป"
 lar_congress_of_paris.4.a: "ยิ่งเหลือใหเรามากขึ้น"
 lar_congress_of_paris.5.desc: "ขณะที่คณะผูแทนอื่น ๆ ในปารีสถกเถียงกันวาใครควรไดดินแดนที่ไมมีประเทศใดควบคุมอยูจริง นักการทูตของเรากลับผลักดันเปาหมายที่เปนไปไดมากกวา รัฐบาลฝรั่งเศสไดสงสัญญาณวาเห็นดวยกับขอเสนอของเราที่จะยกโมร็อกโกใหเรา เพื่อแลกกับคํามั่นวาเราจะสนับสนุนพวกเขาในสงครามใด ๆ ที่จะเกิดขึ้น ซึ่งจะเชื่อมดินแดนของเราในแอฟริกาเหนือและแอฟริกาตะวันตกเขาดวยกัน"
 lar_congress_of_paris.5.a: "หากพวกเขายอมจายราคา เราก็พรอมทําหนาที่ของเรา"
 lar_congress_of_paris.5.b: "ทะเลทรายมากเทาใดก็ไมคุมกับเลือดชาวสเปนแมแตหยดเดียว"
 lar_congress_of_paris.6.desc: "แมการขาดแสนยานุภาพทางทหารจะทําใหนักการทูตของเราในปารีสมีบทบาทตอการประชุมไดไมมากนัก แตเราก็ยังไดรับขอเสนอสนับสนุนใหยึดดินแดนระหวางแองโกลาและโมซัมบิก รวมถึงโอกาสอางสิทธิ์เหนือแอฟริกาใตสวนใหญ ดูเหมือนวาการยกดินแดนเหลานี้ใหเราเปนวิธีที่มหาอํานาจทั้งสองใชหลีกเลี่ยงความขัดแยงที่อาจทําใหสนธิสัญญาทั้งฉบับลมเหลว\n\nอยางไรก็ตาม การยอมรับขอเสนอนี้จะผูกมัดใหเราตองสูรบเคียงขางฝรั่งเศสและอิตาลีในการแสวงหาการขยายจักรวรรดิของแตละฝาย"
 lar_congress_of_paris.6.a: "ราคาเพียงเล็กนอยที่ตองจาย"
 lar_congress_of_paris.6.b: "พวกเขาเรียกรองมากเกินไปแตใหนอยเกินไป"
 lar_france_political_violence.1.t: "การประทวงกลายเปนความรุนแรง"
 lar_france_political_violence.1.desc: "วันนี้ สันนิบาตฝายขวาและขวาจัดที่รวมตัวกันอยางหลวม ๆ ไดจัดการประทวงและเดินขบวนไปทั่วปารีส ดูเหมือนวาผูประทวงไมเคยตั้งใจจะชุมนุมและสลายตัวอยางสงบเลย ราวกับไดรับสัญญาณที่ไมตองเอยปาก ขบวนผูชุมนุมเปลี่ยนเสนทางและมุงหนาไปรวมกันที่สภาแหงชาติ ตํารวจปราบจลาจลที่ถูกเรียกตัวมาอยางเรงดวนสามารถสกัดขบวนไวไดในระยะที่มองเห็นอาคาร หลายครั้งที่กลุมผูชุมนุมพุงเขาชนแนวตํารวจและถูกผลักกลับไปไดอยางยากลําบาก\n\nผูประทวงสลายตัวไปหลังเที่ยงคืนไปนานแลว ขาวการจลาจลแพรสะพัดออกไป และนาจะบั่นทอนความเชื่อมั่นของประชาชนตอความสามารถของรัฐบาลในการรักษาความสงบเรียบรอย"
 lar_france_political_violence.1.a: "สาธารณรัฐตองอดทนผานเรื่องนี้ไปใหได"
 lar_france_political_violence.1.b: "ดําเนินคดีกับผูรับผิดชอบ"
 lar_france_political_violence.2.desc: "แนวรวมสหภาพแรงงานและปญญาชนไดเรียกรองใหมี 'วันแหงการเคลื่อนไหว' ในเมืองหลวง เพื่อตอบโตการตัดสินใจทางการเมืองครั้งลาสุด แมตํารวจจะพยายามควบคุมการชุมนุมไว แตกลุมอนาธิปไตยและพวกหัวรุนแรงคอมมิวนิสตกลุมเล็ก ๆ ก็พยายามยุยงใหเกิดการจลาจล รานคาหลายแหงถูกปลนสะดม และรถรางถูกพลิกควํ่า ความพยายามของผูกอจลาจลที่จะตั้งเครื่องกีดขวางบนถนนรอยัลเพื่อปดทางเขาสภาแหงชาติถูกขัดขวางโดยตํารวจมา\n\nเมื่อผูกอจลาจลแยกยายกันไปทั่วฝรั่งเศสและคนงานกลับสูโตะทํางาน หลายคนในประเทศตางสงสัยวารัฐบาลยังมีความสามารถรักษากฎหมายและความสงบเรียบรอยอยูหรือไม"
 lar_france_political_violence.3.t: "จลาจลฝายขวา"
 lar_france_political_violence.3.desc: "หลังการตัดสินใจลาสุดของรัฐบาล กลุมกษัตริยนิยมและพวกขวาจัดจากทั่วประเทศไดหลั่งไหลเขาสูเมืองหลวง ดวยจุดประสงคชัดเจนที่จะ 'สานตองานที่คางคาไวในป 1934' เมื่อครั้งที่การจลาจลในลักษณะเดียวกันบุกยึดรัฐสภาไมสําเร็จ แตก็สามารถบีบใหรัฐบาลลาออกได\n\nแมตํารวจจะไดรับคําเตือนลวงหนาวาการประทวงมีแนวโนมจะกลายเปนความรุนแรง แตพวกเขาก็ไมไดเตรียมรับมือกับการจัดตั้งที่เปนระบบและความกาวราวของกลุมที่เตรียมตัวมาอยางดีเหลานี้ หลายครั้งที่ตํารวจซึ่งเฝาจัตุรัสกงกอรดถูกบีบใหตองเปดฉากยิงใสผูประทวงเพื่อรักษาที่มั่นไว\n\nดวยผูเสียชีวิตหลายสิบรายและบาดเจ็บนับรอย ผูประทวงไดถอนตัวออกจากเมืองหลวงไปเลียแผล แตพวกเขาก็ประสบความสําเร็จในการแสดงใหทั้งประเทศเห็นวารัฐบาลไมปลอดภัยแมแตในเมืองหลวงของตนเอง"
 lar_france_political_violence.3.a: "การลงมือใด ๆ ในตอนนี้มีแตจะทําใหเรื่องแยลง"
 lar_france_political_violence.3.b: "สาธารณรัฐจะตองอยูรอด!"
 lar_france_french_union.2.t: "แอฟริกาเหนือลงมติเขารวมสหภาพ"
 lar_france_french_union.2.desc: "สรางความประหลาดใจแกผูสังเกตการณจํานวนมาก ประชาชนในแอลจีเรีย โมร็อกโก และตูนิเซียไดลงมติรับรองประชามติวาดวยสหภาพฝรั่งเศสดวยคะแนนเฉียดฉิว เมื่อผูอยูอาศัยในพื้นที่เหลานี้ไดรับสถานะพลเมืองเต็มขั้นแลว พวกเขาจึงสามารถสงผูแทนจํานวนหนึ่งเขาสูสภาแหงชาติได\n\nแมกลุมชาตินิยมจะยังคงมีอยูในทั้งสามประเทศ แตขวัญกําลังใจของพวกเขาก็ไดรับความเสียหายอยางหนัก และตองใชเวลาอยางนอยหนึ่งชั่วอายุคนกวาจะฟนตัว"
 lar_france_french_union.2.a: "พวกเขาเขาใจความหมายของภราดรภาพ!"
 lar_france_french_union.3.t: "แอฟริกาเหนือลงมติแยกตัว"
 lar_france_french_union.3.desc: "แมรัฐบาลทองถิ่นจะพยายามทุกวิถีทาง แตผูลงคะแนนในแอลจีเรีย โมร็อกโก และตูนิเซียก็ปฏิเสธขอเสนอสหภาพฝรั่งเศสอยางทวมทน ทันทีที่ประกาศผล การเดินขบวนขนาดใหญก็เกิดขึ้นในหลายเมืองใหญทั่วภูมิภาค ขณะที่กลุมชาตินิยมฉวยโอกาสจากชัยชนะเรียกรองเอกราชโดยสมบูรณใหแกประเทศของตนในทันที\n\nผูบัญชาการกองกําลังฝรั่งเศสในแอฟริกาเหนือไดสงคําขอกําลังเสริมดวน เนื่องจากดูเหมือนวากลุมหัวรุนแรงบางกลุมอาจพยายามลงมือจัดการเรื่องนี้เอง"
 lar_france_french_union.3.a: "ชางเนรคุณเสียจริง!"
 lar_france_french_union.4.t: "แอฟริกาตะวันตกลงมติเขารวมสหภาพ"
 lar_france_french_union.4.desc: "หลังการรณรงคนานหลายสัปดาห ประชาชนทั่วดินแดนฝรั่งเศสในแอฟริกาตะวันตกไดออกไปลงคะแนนเพื่อตัดสินวาดินแดนของตนควรเปนสวนหนึ่งของสหภาพฝรั่งเศสใหมหรือไม ผลเบื้องตนแสดงใหเห็นวาฝายสนับสนุนสหภาพไดเสียงขางมากอยางชัดเจน ขบวนการชาตินิยมดูเหมือนจะถูกบดขยี้ตั้งแตยังไมทันเติบโต โดยนักเคลื่อนไหวเพื่อเอกราชจํานวนมากกําลังเตรียมสานตอการตอสูเพื่อสิทธิในการกําหนดชะตากรรมทางการเมืองของตนเองจากภายในสภาแหงชาติ"
 lar_france_french_union.5.t: "แอฟริกาตะวันตกลงมติแยกตัว"
 lar_france_french_union.5.desc: "หลังการรณรงคอันดุเดือดและบางครั้งก็วุนวาย ดูเหมือนวาฝายชาตินิยมจะชนะประชามติวาดวยการเปนสมาชิกสหภาพฝรั่งเศสในพื้นที่สวนใหญของแอฟริกาตะวันตกของฝรั่งเศส ขณะที่ชาวยุโรปในทองถิ่นยังคงพยายามทําใจกับผลลัพธ ผูนําขบวนการเอกราชในทองถิ่นก็เรียกรองใหลงมือ และประกาศวาผลประชามตินี้คืออาณัติอันชัดเจนสูเอกราชโดยสมบูรณ"
 lar_france_french_union.6.t: "แอฟริกากลางลงมติเขารวมสหภาพ"
 lar_france_french_union.6.desc: "ขณะที่ผลการลงคะแนนทยอยเขามาอยางเชื่องชาจากภูมิภาคที่กวางใหญและดอยพัฒนาแหงนี้ ดูเหมือนวาผูลงคะแนนเสียงขางมากเพียงเล็กนอยไดรับรองประชามติเขารวมสหภาพฝรั่งเศสใหม กลุมชาตินิยมยอมรับความพายแพ แตเรียกรองใหรัฐใหมลงทุนพัฒนาภูมิภาคมากขึ้นเพื่อตอบแทนความภักดีที่แสดงออกมา"
 lar_france_french_union.7.t: "แอฟริกากลางลงมติแยกตัว"
 lar_france_french_union.7.desc: "พรรคการเมืองฝายสนับสนุนสหภาพทั่วแอฟริกากลางของฝรั่งเศสประสบความลมเหลวทางการเมืองตอเนื่อง เมื่อดินแดนแลวดินแดนเลาลงมติไมเขารวมสหภาพฝรั่งเศสใหม ขณะที่พรรคฝายสนับสนุนเอกราชเฉลิมฉลองชัยชนะครั้งแลวครั้งเลา นักเคลื่อนไหวจํานวนมากตางประกาศวาการปกครองของฝรั่งเศสเหนือภูมิภาคนี้ไดพายแพอยางราบคาบแลว"
 lar_france_french_union.8.t: "ซีเรียลงมติเขารวมสหภาพ"
 lar_france_french_union.8.desc: "ดินแดนในอาณัติของฝรั่งเศสอยางซีเรียและเลบานอนไดลงมติเปนสวนหนึ่งของสหภาพฝรั่งเศสใหม แมผูสังเกตการณจํานวนมากจะมองวาผลลัพธนี้แทบเปนไปไมได แตดูเหมือนวาประชาชนในทองถิ่นเชื่อวาการเปนสมาชิกสหภาพฝรั่งเศสจะรับประกันการเขาถึงตลาดยุโรปและการลงทุนในเศรษฐกิจทองถิ่นที่มากขึ้น"
 lar_france_french_union.9.t: "ซีเรียลงมติไมรับสหภาพ"
 lar_france_french_union.9.desc: "การประกาศผลประชามติวาดวยสหภาพฝรั่งเศสครั้งลาสุดไดรับเสียงโหรองยินดีกึกกองในดามัสกัสและเบรุต เมื่อเปนที่ชัดเจนวาภูมิภาคนี้ลงมติไมเขารวมสหภาพใหมอยางทวมทน ขณะที่พรรคชาตินิยมหลักตางประกาศวาประชามตินี้คือการลงมติเรื่องเอกราชที่แฝงมา ผูบัญชาการทหารในทองถิ่นก็ไดสงรายงานที่นากังวลหลายฉบับมายังเมืองหลวงเพื่อขอกําลังเสริม"
 lar_france_french_union.10.t: "อินโดจีนลงมติเขารวมสหภาพ"
 lar_france_french_union.10.desc: "รายงานจากอินโดจีนระบุวาประชาชนในเวียดนาม ลาว และกัมพูชาไดลงมติเปนสวนหนึ่งของสหภาพฝรั่งเศสใหมดวยคะแนนที่เฉียดฉิวที่สุด ผลนี้ดูเหมือนจะทําใหแมแตผูบริหารทองถิ่นยังประหลาดใจ จนตองสั่งนับคะแนนใหมทันที กลุมชาตินิยมในภูมิภาคไดรับความเสียหายอยางหนักเมื่อขวัญกําลังใจพังทลาย สมาชิกจํานวนมากถึงกับตั้งคําถามอยางเปดเผยวาพวกเขาเปนตัวแทนเจตจํานงของประชาชนอยางที่เชื่อมาตลอดจริงหรือไม"
 lar_france_french_union.11.t: "อินโดจีนลงมติไมรับสหภาพ"
 lar_france_french_union.11.desc: "ผลประชามติจากอินโดจีนสะทอนภาพที่มืดมนกวาที่คาดไว แมในเมืองหลวงจะมีไมกี่คนที่เชื่อวาแหลงบมเพาะชาตินิยมจะลงมติเขารวมสหภาพ แตดูเหมือนวากระแสชาตินิยมจะแพรหลายกวางขวางกวาที่เคยคิดไวมาก ทายที่สุดแลว ไมมีพื้นที่ใดในดินแดนนี้ใหเสียงขางมากแกการเขารวมสหภาพเลย นักเคลื่อนไหวชาตินิยมตางเรียกรองใหแยกตัวจากฝรั่งเศสทันที แมจะตองแลกดวยสงคราม เพราะเชื่อวานี่คือชวงเวลาที่จะไดมาซึ่งเอกราชของชาติ"
 FRA_syria_intervention.1.t: "ฝายสัมพันธมิตรยึดซีเรียได"
 FRA_syria_intervention.1.desc: "ในพิธีอันเงียบสงบที่ดามัสกัส ผูบัญชาการกองกําลังวิชีในทองถิ่นไดมอบดินแดนใหแกฝายสัมพันธมิตรอยางเปนทางการ การสูรบไดยุติลงทั่วทั้งภูมิภาค โดยกองกําลังวิชีที่เหลือรอดตางเดินเขาสูการเปนเชลย ทหารฝรั่งเศสที่เกี่ยวของมีเพียงไมกี่คนที่แสดงความประสงคจะเขารวมกองกําลังฝรั่งเศสเสรี สวนใหญตองการถูกสงตัวกลับประเทศมากกวา"
 FRA_syria_intervention.1.a: "สูไดดีมาก"
 FRA_syria_intervention.2.t: "วิชียึดซีเรียไวได"
 FRA_syria_intervention.2.desc: "หลังการสูรบอยางดุเดือดที่ทําใหการรุกของฝายสัมพันธมิตรชะงักลงที่จุดสําคัญหลายแหง ผูบัญชาการฝายสัมพันธมิตรในพื้นที่ไดสั่งระงับปฏิบัติการ กองกําลังสัมพันธมิตรสวนใหญถอนกลับไปยังที่ตั้งเริ่มตน ขณะที่ทหารวิชีเสริมความมั่นคงใหที่มั่นของตน กองกําลังวิชีไมไดไลติดตาม และดูพอใจที่จะรักษาที่มั่นไวเทานั้น"
 FRA_syria_intervention.2.a: "คนดี ๆ มากมายตองตายไปอยางสูญเปลา"
 FRA_syria_intervention.3.t: "หยุดยิงในซีเรีย"
 FRA_syria_intervention.3.desc: "การรุกของฝายสัมพันธมิตรเขาสูซีเรียชะงักลง และกองกําลังวิชีสามารถสรางแนวปองกันที่มั่นคงได แมจะโจมตีอยางประสานงานกันดีหลายครั้ง แตกองกําลังสัมพันธมิตรในพื้นที่ก็ไมอาจขับไลฝายตั้งรับออกไปได ทั้งสองฝายตางขุดสนามเพลาะตั้งมั่น และไดตกลงหยุดยิงกัน โดยวิชียังคงควบคุมพื้นที่สําคัญทั้งหมดไว"
 FRA_syria_intervention.3.a: "สถานะเดิมยังคงอยู"
 FRA_indochina_intervention.1.t: "ฝายสัมพันธมิตรยึดอินโดจีนได"
 FRA_indochina_intervention.1.desc: "ขบวนจูโจมของฝายสัมพันธมิตรไดมาถึงเมืองใหญหลายแหงในอินโดจีน ทําใหขาหลวงทองถิ่นขอหยุดยิง ดวยฝายตั้งรับที่กระจัดกระจายและขาดการประสานงาน การตอตานใด ๆ อีกจึงถูกมองวาไรประโยชน ฝายตั้งรับที่เหลือไดวางอาวุธและรอการสงตัวกลับฝรั่งเศสวิชี"
 FRA_indochina_intervention.1.a: "ความสําเร็จอันสําคัญยิ่ง"
 FRA_indochina_intervention.2.t: "วิชียึดอินโดจีนไวได"
 FRA_indochina_intervention.2.desc: "หลังการสูรบอยางหนักในภูมิประเทศที่ยากลําบากอยางยิ่ง ผูบัญชาการฝายสัมพันธมิตรในภูมิภาคไดสั่งระงับปฏิบัติการ เมื่อสถานการณเสบียงของหนวยแนวหนาเลวรายลงเรื่อย ๆ และการตอตานของวิชีแข็งแกรงขึ้น กองกําลังสัมพันธมิตรจึงตัดสินใจถอนกําลังและตั้งมั่น ปลอยใหวิชีควบคุมดินแดนตอไป"
 FRA_indochina_intervention.2.a: "ชางเปลืองทั้งเวลาและชีวิตคนเสียจริง"
 FRA_indochina_intervention.3.t: "หยุดยิงในอินโดจีน"
 FRA_indochina_intervention.3.desc: "เมื่อสภาพอากาศเลวรายลงและเสบียงของทั้งสองฝายรอยหรอ ผูบัญชาการกองกําลังสัมพันธมิตรและวิชีในอินโดจีนจึงตกลงหยุดยิงกัน เมื่อพิจารณาถึงความยากลําบากอยางมหาศาลที่ฝายสัมพันธมิตรผูรุกตองเผชิญ และการที่สูญเสียความไดเปรียบจากการจูโจมโดยไมคาดฝนไปแลว กองบัญชาการระดับสูงจึงไมคาดวาจะกลับมารุกตอไดแมสถานการณจะดีขึ้น"
 FRA_indochina_intervention.3.a: "ลงทุนไปมาก ไดกลับมานอย"
 FRA_central_africa_intervention.1.t: "ฝายสัมพันธมิตรยึดแอฟริกากลางได"
 FRA_central_africa_intervention.1.desc: "หนวยของฝายสัมพันธมิตรเผชิญการตอตานเพียงเล็กนอย และสามารถรุกลึกเขาไปในพื้นที่ที่วิชียึดครองในแอฟริกากลางได แมวิชีจะสั่งใหยืนหยัดใหนานที่สุด แตหนวยฝรั่งเศสในพื้นที่สวนใหญก็ยุติการตอตานและไมไดขัดขวางการรุกของฝายสัมพันธมิตรอีกตอไป"
 FRA_central_africa_intervention.1.a: "พวกเขารูดีวาใครคือศัตรูตัวจริง"
 FRA_central_africa_intervention.2.t: "วิชียึดแอฟริกากลางไวได"
 FRA_central_africa_intervention.2.desc: "หนวยฝรั่งเศสในแอฟริกากลางตอตานอยางแข็งแกรงเกินคาด ซุมโจมตีขบวนจูโจมของฝายสัมพันธมิตรหลายขบวนและสรางความสูญเสียอยางเจ็บปวด เมื่อเผชิญกับสถานการณที่สับสนและเห็นไดชัดวาประเมินขาศึกตํ่าเกินไป ผูบัญชาการฝายสัมพันธมิตรในพื้นที่จึงถอนกําลังกลับไปยังที่ตั้งเริ่มตนและตั้งมั่นรอคําสั่ง"
 FRA_central_africa_intervention.2.a: "ทําไมพวกเขาถึงตอตานผูปลดปลอยของตนเองเลา?"
 FRA_central_africa_intervention.3.t: "หยุดยิงในแอฟริกากลาง"
 FRA_central_africa_intervention.3.desc: "การสูรบอยางหนักรอบจุดสําคัญหลายแหงในแอฟริกากลางทําใหทั้งสองฝายออนลาและไมอาจดําเนินปฏิบัติการตอได แมกองกําลังฝรั่งเศสวิชีจะยังคงควบคุมพื้นที่ยุทธศาสตรสวนใหญในภูมิภาค แตกองกําลังสัมพันธมิตรก็สามารถรุกคืบไดเล็กนอยในบางพื้นที่ อยางไรก็ตาม สถานการณเสบียงไดเลวรายลงจนทั้งสองฝายไมสามารถเปดการรุกครั้งใหมไดในเร็ววันนี้"
 FRA_central_africa_intervention.3.a: "เราไมไดอะไรเลย"
 FRA_west_africa_intervention.1.t: "ฝายสัมพันธมิตรยึดแอฟริกาตะวันตกได"
 FRA_west_africa_intervention.1.desc: "หนวยของฝายสัมพันธมิตรเคลื่อนที่อยางรวดเร็วผานภูมิประเทศที่เปดโลง และสามารถโอบปกฝายตั้งรับชาวฝรั่งเศสสวนใหญจนบีบใหยอมจํานน เมื่อไมมีกําลังสํารองเหลือไวหยุดยั้งการรุกของฝายสัมพันธมิตร ขาหลวงทองถิ่นจึงยอมมอบดินแดนอยางเปนทางการ"
 FRA_west_africa_intervention.1.a: "อีกสวนหนึ่งของโลกไดสูดอากาศแหงเสรีภาพแลว"
 FRA_west_africa_intervention.2.t: "วิชียึดแอฟริกาตะวันตกไวได"
 FRA_west_africa_intervention.2.desc: "หลังการโจมตีที่ลมเหลวหลายครั้งและการสูรบอันดุเดือด ผูบัญชาการฝายสัมพันธมิตรในพื้นที่ไดสั่งระงับปฏิบัติการรุกในบริเวณนี้ และสั่งใหหนวยที่ลอแหลมถอยกลับไปยังภูมิประเทศที่ปองกันไดงายกวา กองกําลังวิชีไดรวมกําลังรอบจุดสําคัญและตั้งมั่น ทําใหการโจมตีครั้งตอไปไมนาจะประสบผล"
 FRA_west_africa_intervention.2.a: "โชคชะตาไมไดเขาขางผูกลา"
 FRA_west_africa_intervention.3.t: "หยุดยิงในแอฟริกาตะวันตก"
 FRA_west_africa_intervention.3.desc: "ดวยตระหนักถึงสถานการณเสบียงที่ลอแหลมและการขาดกําลังเสริม กองกําลังวิชีและฝายสัมพันธมิตรไดดําเนินการดําเนินกลยุทธและตอบโตกันมาเปนเวลานาน เพื่อพยายามลอใหอีกฝายทุมกําลังเขาสูการรบชี้ขาดในสภาพที่เสียเปรียบ เมื่อทั้งกําลังพลและยุทโธปกรณตางออนลา และยังมองไมเห็นผลแพชนะ ทั้งสองฝายจึงขุดสนามเพลาะตั้งมั่นและรอใหอีกฝายเคลื่อนไหวกอน"
 FRA_west_africa_intervention.3.a: "ชางเสียเวลาเปลา"
 lar_compensate_italy.1.t: "ฝรั่งเศสเสนอคาชดเชยดานอาณานิคม"
 lar_compensate_italy.1.desc: "[From.GetLeader]ไดเดินทางมาถึงโรมเพื่อหารือเงื่อนไขของสนธิสัญญาที่จะแกไขปญหาคางคาบางประการระหวางสองชาติ เขากลาวถึงภราดรภาพอันยาวนานระหวางสองชาติของเรา ซึ่งไดรับการตอกยํ้าดวยการเสียสละรวมกันในมหาสงคราม และเสนอที่จะมอบทาเรือจิบูตีของฝรั่งเศสใหอยูใตการควบคุมของเรา เพื่อแลกกับคํารับรองวาเราจะชวยเหลือฝรั่งเศสในยามสงคราม"
 lar_compensate_italy.1.a: "เขาจะไดพันธมิตรตามที่ตองการ"
 lar_compensate_italy.1.b: "เราไมไดถูกซื้องายขนาดนั้น"
 lar_compensate_italy.2.t: "[From.GetLeader]ตกลง"
 lar_compensate_italy.2.desc: "[This.GetLeader]เดินทางกลับจากอิตาลีอยางผูมีชัย เมื่อ[From.GetLeader]ตกลงลงนามในสนธิสัญญาที่เสนอ สิ่งที่เหลืออยูตอนนี้คือการสงมอบดินแดนของเราในแอฟริกาตะวันออกใหแกอิตาลีอยางเปนทางการ"
 lar_compensate_italy.2.a: "ราคาเพียงเล็กนอยที่ตองจาย"
 lar_compensate_italy.3.t: "[From.GetLeader]ปฏิเสธ"
 lar_compensate_italy.3.desc: "แมในชวงแรกจะประสบความสําเร็จ แตการเจรจากับอิตาลีก็ลมเหลวอยางรวดเร็ว เมื่อเปนที่ชัดเจนวา[From.GetLeader]คาดหวังขอผอนปรนที่กวางขวางกวาการโอนจิบูตีตามที่เสนอไวมาก"
 lar_compensate_italy.3.a: "แลวเราจะไปทางไหนตอ?"
 lar_intervention_in_greece.1.t: "ฝรั่งเศสเสนอการแทรกแซงในกรีซ"
 lar_intervention_in_greece.1.desc: "เอกอัครราชทูตฝรั่งเศสไดยื่นบันทึกจากรัฐบาลของตน ซึ่งชี้ใหเห็นถึงผลประโยชนรวมกันของเราในเมดิเตอรเรเนียนตะวันออก รัฐบาลของ[From.GetLeader]ดูจะสนใจเปนพิเศษที่จะไดเกาะครีตไวเปนฐานทัพเรือ แตก็ระบุดวยวาการมีรัฐบาลที่ 'ไมเปนมิตรหรือเปนปฏิปกษ' ในกรีซจะทําใหการปฏิบัติการในพื้นที่ยากลําบากขึ้นมาก ดวยเหตุนี้ รัฐบาล[From.GetAdjective]จึงตองการหยั่งทาทีของเราตอความเปนไปไดในการรวมกันแทรกแซงกรีซ เพื่อสถาปนารัฐบาลที่เปนมิตรมากขึ้น หรือเขาบริหารดินแดนเหลานั้นเสียเอง"
 lar_intervention_in_greece.1.a: "คนเกงยอมคิดเหมือนกัน!"
 lar_intervention_in_greece.1.b: "เราจะกําหนดยุทธศาสตรของเราเอง"
 lar_intervention_in_greece.2.t: "[From.GetLeader]ตกลง"
 lar_intervention_in_greece.2.desc: "[From.GetLeader]ไดสงสาสนตอบกลับผานเอกอัครราชทูตของเราในโรม แสดงการสนับสนุนอยางสุดซึ้งและยืนยันวาเห็นพองกับทัศนะของเราอยางสมบูรณ กองทัพ[From.GetAdjective]ไดรับคําสั่งใหเตรียมแผนปฏิบัติการทางทหารรวมตอกรีซ หากมีความจําเปน"
 lar_intervention_in_greece.2.a: "ความจําเปนนั้นแทบจะเกิดขึ้นแนนอน"
 lar_intervention_in_greece.3.t: "[From.GetLeader]ปฏิเสธ"
 lar_intervention_in_greece.3.desc: "ตามบันทึกสั้น ๆ หวน ๆ จากเอกอัครราชทูต[From.GetAdjective] รัฐบาลของเขาไมสนใจที่จะเปลี่ยนแปลงสถานะเดิมในเมดิเตอรเรเนียนตะวันออกในขณะนี้ โดยพอใจกับสถานการณปจจุบันมากกวาความไมแนนอนที่ปฏิบัติการทางทหารอาจนํามา"
 lar_intervention_in_greece.3.a: "นั่นคือเสียงของความหวาดกลัว"
 lar_dominate_the_middle_east.1.t: "ฝรั่งเศสเรียกรองใหยอมสยบ"
 lar_dominate_the_middle_east.1.desc: "รัฐบาลของ[From.GetLeader]ไดแตงตั้งผูแทนผูมีอํานาจเต็มคนใหมประจําตะวันออกกลาง ในการพบหารือกับ[This.GetLeader]ที่เมืองหลวงของเราวันนี้ ผูแทนฝรั่งเศสระบุวารัฐบาลฝรั่งเศสตองการมีบทบาทเชิงรุกในภูมิภาคมากขึ้น และคาดหวังวาจะไดรับการปรึกษาโดยตรงในทุกเรื่องที่เกี่ยวกับเสถียรภาพในภูมิภาค \n\nแมเขาจะไมไดกลาวถึงผลที่จะตามมาหากปฏิเสธ แตก็ระบุวารัฐบาลฝรั่งเศสคง 'ยากที่จะยอมรับ' นโยบายตางประเทศที่เปนอิสระจากรัฐบาลของเรา"
 lar_dominate_the_middle_east.1.a: "เราตองยอมรับความจริงใหมนี้"
 lar_dominate_the_middle_east.1.b: "เราไดเสรีภาพมาดวยความพยายามของเราเอง และจะไมยอมปลอยมันไปงาย ๆ!"
 lar_dominate_the_middle_east.2.t: "[From.GetNameDefCap]ยอมสยบ"
 lar_dominate_the_middle_east.2.desc: "หลังการถกเถียงกับเหลาที่ปรึกษา [From.GetLeader]ไดยอมรับคําเรียกรองของเราอยางเปนทางการ และอนุญาตใหผูแทนของเรารวมปรึกษาในการตัดสินใจดานนโยบายตางประเทศทุกเรื่อง เพื่อใหมั่นใจวาสอดคลองกับความประสงคของเรา"
 lar_dominate_the_middle_east.2.a: "ก็สมควรแลว"
 lar_dominate_the_middle_east.3.t: "[From.GetNameDefCap]ทาทาย"
 lar_dominate_the_middle_east.3.desc: "ในสุนทรพจนยืดยาวตอผูแทนของเรา [From.GetLeader]ไดสรรเสริญประเพณีนักรบอันยาวนานและภาคภูมิของชาว[From.GetAdjective] อธิบายวาพวกเขาไมเคยกมหัวใหผูปกครองตางชาติคนใด จะตอตานทุกความพยายามที่จะบีบบังคับพวกเขา และยอมตายอยางยืนหยัดดีกวามีชีวิตอยูอยางคุกเขา"
 lar_dominate_the_middle_east.3.a: "ถาเชนนั้นก็ใหพวกเขาตายอยางยืนหยัดไปเถิด"
 lar_dominate_the_middle_east.3.b: "มันก็แคผืนดินไรคาที่เต็มไปดวยผูคนไรประโยชน"
 lar_spheres_of_influence.1.t: "ฝรั่งเศสตองการหารือเรื่องเขตอิทธิพล"
 lar_spheres_of_influence.1.desc: "[From.GetLeader]ไดเดินทางมาถึงเบอรลินเพื่อพบ[This.GetLeader] ดวยความพยายามที่จะขจัดชนวนความตึงเครียดที่ยังคางคาระหวางสองชาติ หนึ่งในประเด็นที่หารือกันคือการปรับโครงสรางยุโรปกลาง [From.GetLeader]แสดงจุดยืนชัดเจนวาเขาถือวา[BEL.GetNameDef] ซึ่งมีประชากรพูดภาษาฝรั่งเศส เปนผลประโยชนหลักของชาติตน \n\nอยางไรก็ตาม รัฐบาลของเขามีความยืดหยุนมากกวาเมื่อพูดถึงชะตากรรมของ[HOL.GetNameDef]และ[LUX.GetNameDef] และไดเสนอบันทึกความเขาใจวาสองประเทศหลังนี้ควรถือวาอยูในเขตอิทธิพลของเรา ขณะที่ประเทศแรกอยูในเขตอิทธิพลของฝรั่งเศส"
 lar_spheres_of_influence.1.a: "ขอเสนอที่สมเหตุสมผล"
 lar_spheres_of_influence.1.b: "จะมีเขตอิทธิพลได ก็ตองมีอิทธิพลเสียกอนนะ ฝรั่งเศส"
 lar_spheres_of_influence.2.t: "[From.GetNameDefCap]ตกลง"
 lar_spheres_of_influence.2.desc: "การเจรจากับ[From.GetLeader]ใชเวลาเพียงไมกี่นาที โดยผูนําทั้งสองบรรลุขอตกลงตามแนวทางที่เราเสนออยางรวดเร็ว ประเด็นขัดแยงเพียงขอเดียวคือชุมชนเล็ก ๆ ที่พูดภาษาเยอรมันในเบลเยียม ซึ่งไดมอบหมายใหฝายการทูตเปนผูแกไข"
 lar_spheres_of_influence.2.a: "อีกหนึ่งความสําเร็จของยุทธศาสตรการทูตของเรา"
 lar_spheres_of_influence.3.t: "[From.GetLeader]ปฏิเสธ"
 lar_spheres_of_influence.3.desc: "ในการพบกันที่วากันวาตึงเครียดอยางยิ่งระหวาง[From.GetLeader]และ[This.GetLeader] ความหวังใด ๆ ที่จะคลายความตึงเครียดระหวางสองชาติก็มลายหายไปภายในไมกี่นาที คณะผูแทนเยอรมันไมยอมขยับจากจุดยืน โดยประกาศวาเบลเยียมซึ่งมีชนกลุมนอยเชื้อสายเยอรมันจํานวนมาก เปนผลประโยชนโดยธรรมชาติของ[From.GetNameDef] และความคิดที่จะใหเรามีอิสระในการจัดการกับเบลเยียมนั้นเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง"
 lar_spheres_of_influence.3.a: "ดูเหมือนเราจะเสียเวลาเปลา"
 lar_align_belgium.1.t: "ฝรั่งเศสเรียกรองสิทธิพิเศษ"
 lar_align_belgium.1.desc: "หลังเกิดเหตุการณหลายครั้งที่พลเมืองผูพูดภาษาฝรั่งเศสของเราถูกกลุมอันธพาลสวมหนากากทํารายบนทองถนน วันนี้เอกอัครราชทูตฝรั่งเศสไดเขาพบ[This.GetLeader]และยื่นบันทึกจากรัฐบาลของตน ระบุวาในเมื่อเราไมสามารถปกปองชุมชนชาวฝรั่งเศสภายในพรมแดนของเราไดอยางชัดเจน รัฐบาลฝรั่งเศสจึงถือเปนหนาที่ที่จะทําแทนเรา เพื่อการนี้ พวกเขาเรียกรองสิทธิอันกวางขวางหลายประการ รวมถึงสิทธิในการตั้งกองทหารในประเทศของเรา และใหตํารวจภูธรฝรั่งเศสดําเนินการสืบสวนภายในพรมแดนของเรา\n\nบันทึกระบุวาการปฏิเสธไมใหสิทธิเหลานี้จะถือเปนการกระทําอันเปนปฏิปกษ ซึ่งจะนําไปสูผลที่รายแรงที่สุด"
 lar_align_belgium.1.a: "เราไมมีทางเลือกนอกจากยอมตกลง"
 lar_align_belgium.1.b: "เราไมกมหัวในป 1914 และเราจะไมกมหัวในตอนนี้!"
 lar_align_belgium.2.t: "[From.GetNameDefCap]ยอมสยบ"
 lar_align_belgium.2.desc: "คณะรัฐมนตรี[From.GetAdjective]ลงมติเปนเอกฉันทยอมรับขอเสนอของเรา แมจะมีรัฐมนตรีหลายคนยอมลาออกแทนที่จะลงมติเห็นชอบ หนวยประสานงานทางทหารและขาราชการกลุมเล็ก ๆ ไดเดินทางไปยังบรัสเซลสแลวเพื่อประสานงานกับทางการ[From.GetAdjective]"
 lar_align_belgium.2.a: "พวกเขาเลือกไดอยางชาญฉลาด"
 lar_align_belgium.3.t: "[From.GetNameDefCap]ประกาศวาจะสู"
 lar_align_belgium.3.desc: "แทนที่จะตอบบันทึกของเราทางการทูต ดูเหมือนวารัฐบาล[From.GetAdjective]ไดสั่งใหกองทัพเตรียมพรอมเต็มที่และปดพรมแดน หนังสือพิมพในบรัสเซลสแมจะมองโอกาสชนะตามความเปนจริง แตก็เต็มไปดวยการอางถึงยุทธการวอเตอรลู และทํานายวากองกําลังฝรั่งเศสจะพายแพอยางนาอับอายหากเรารุกราน"
 lar_align_belgium.3.a: "คอยดูกันไป"
 lar_align_belgium.3.b: "เบลเยียมไมคุมคากระสุนแมนัดเดียวหรือเลือดแมหยดเดียว"
 lar_split_belgium.1.t: "[From.GetLeader]เรียกรองวัลลูน"
 lar_split_belgium.1.desc: "ตลอดหลายสัปดาหที่ผานมา กลุมตาง ๆ ที่อางตนเปนตัวแทนประชากรผูพูดภาษาฝรั่งเศสในประเทศของเราไดผุดขึ้นมาและเริ่มเคลื่อนไหวเรียกรองให 'รวมชาติ' วัลลูนเขากับฝรั่งเศส วันนี้เอกอัครราชทูตฝรั่งเศสไดยื่นบันทึกประกาศวารัฐบาลของ[From.GetLeader]ไดกําหนดใหการผนวกพื้นที่ที่พูดภาษาฝรั่งเศสของประเทศเราเขากับประเทศของตนเปนนโยบายอยางเปนทางการ\n\nรายงานการระดมกําลังทหารที่ชายแดนแสดงใหเห็นวาพวกเขาพรอมบังคับใชนโยบายใหมนี้ดวยทุกวิถีทางที่จําเปน"
 lar_split_belgium.1.a: "การตอสูกับสิ่งที่หลีกเลี่ยงไมไดไมไดใหประโยชนอะไร"
 lar_split_belgium.1.b: "นี่คือประเทศของเรา และเราจะสูเพื่อผืนดินทุกตารางนิ้ว"
 lar_split_belgium.2.t: "เบลเยียมยอมแบงแยกประเทศ"
 lar_split_belgium.2.desc: "รัฐบาลเบลเยียมตกลงจัดการลงประชามติหลายครั้งเรื่องการรวมเขากับฝรั่งเศสในพื้นที่ที่พูดภาษาฝรั่งเศสของเบลเยียมภายใตการกํากับดูแลของเรา เมื่อพรรคฝายสนับสนุนเบลเยียมทั้งหมดเรียกรองใหควํ่าบาตรการลงคะแนน ชัยชนะของเราจึงแทบจะแนนอน"
 lar_split_belgium.2.a: "ประชาธิปไตยชางเปนสิ่งที่งดงามเสียจริง"
 lar_split_belgium.3.t: "เบลเยียมทาทาย"
 lar_split_belgium.3.desc: "รัฐบาล[From.GetAdjective]ตอบโตทุกการพูดถึงการรวมวัลลูนเขากับฝรั่งเศสดวยการปราบปรามอยางรุนแรง บุกคนสํานักงานของกลุมที่สนับสนุนการรวมชาติและจับกุมแกนนํา เมื่อเอกอัครราชทูตของเรายื่นประทวงอยางเปนทางการ เขากลับไดรับแจงอยางหวน ๆ วารัฐบาล[From.GetAdjective]มีหนาที่รักษาความสงบภายในประเทศ จึงไมจําเปนตองใหคนนอกมาสั่งสอน"
 lar_split_belgium.3.a: "เราจะสอนใหพวกเขารูจักความเคารพ!"
 lar_split_belgium.3.b: "เรื่องนี้ไมคุมคาแกความพยายาม"
 lar_concessions_to_italy.1.t: "ฝรั่งเศสเสนอคาชดเชยดานดินแดนแกอิตาลี"
 lar_concessions_to_italy.1.desc: "รัฐบาลของ[From.GetLeader]ไดหยั่งทาทีของเราตอความพยายามดึงอิตาลีมาอยูฝายเราและสกัดกั้นพันธมิตรที่อาจเกิดขึ้นระหวางเยอรมนีกับอิตาลี [ITA.GetLeader]คงตองถูกซื้อใจดวยขอผอนปรนหรือคาชดเชยบางอยาง เมื่อพิจารณาดินแดนของเราในแอฟริกาตะวันออก ชาว[From.GetAdjective]เสนอใหยกจิบูตีและโซมาลิแลนดใหอิตาลี เพื่อแลกกับพันธมิตรอยางเปนทางการที่มุงปดลอมเยอรมนี"
 lar_concessions_to_italy.1.a: "เราบีบคอสิ่งที่เรียกวาฝายอักษะนี้ไดตั้งแตยังอยูในเปล!"
 lar_concessions_to_italy.1.b: "ไมมีทางไวใจให[ITA.GetLeader]รักษาสัญญาได"
 lar_concessions_to_italy.2.t: "[From.GetLeader]ตกลง"
 lar_concessions_to_italy.2.desc: "คณะรัฐมนตรี[From.GetAdjective]ลงมติรับรองขอเสนอของเราดวยคะแนนเฉียดฉิว แมในแวดวงการทูตยังคงมีขอกังขาอยางมากเกี่ยวกับผลที่จะตามมาจากการเปนพันธมิตรกับ[ITA.GetLeader] แตบัดนี้เราสามารถเดินหนาและเสนอขอเสนอรวมของเราตอชาว[ITA.GetAdjective]ไดแลว"
 lar_concessions_to_italy.2.a: "สงสาสนไป"
 lar_concessions_to_italy.3.t: "[From.GetLeader]ปฏิเสธ"
 lar_concessions_to_italy.3.desc: "ขอเสนอของเราไมไดรับการสนับสนุนใด ๆ ในคณะรัฐมนตรี[From.GetAdjective] แมจะเห็นพองกันวาการเปนพันธมิตรกับ[ITA.GetNameDef]จะเปนประโยชน แตรัฐบาล[From.GetAdjective]ไมอาจยอมรับแนวคิดการยกดินแดนเพื่อใหบรรลุเปาหมายนี้ได"
 lar_concessions_to_italy.3.a: "เราคงตองเสนอเรื่องนี้ตามลําพัง"
 lar_concessions_to_italy.4.t: "อังกฤษและฝรั่งเศสเสนอขอตกลงดานอาณานิคม"
 lar_concessions_to_italy.4.desc: "เอกอัครราชทูตของ[ENG.GetNameDef]และ[FRA.GetNameDef]ไดพบหารือกับ[This.GetLeader] เพื่อผลักดันการใหสัตยาบันขอตกลงที่ทําไวในสเตรซาอีกครั้ง ในฐานะสวนหนึ่งของการรุกทางการทูตครั้งลาสุด บัดนี้พวกเขาเสนอยกดินแดนในแอฟริกาตะวันออกให ทั้งจิบูตีและโซมาเลียสวนที่เปนของอังกฤษ\n\nการโอนดินแดนจริงจะผูกกับการใหสัตยาบันสนธิสัญญาพันธมิตร"
 lar_concessions_to_italy.4.a: "อะไรก็ไดเพื่อพรมแดนที่สวยงาม"
 lar_concessions_to_italy.4.b: "เราไมไดถูกซื้อได!"
 lar_concessions_to_italy.5.t: "ฝรั่งเศสเสนอยกดินแดนอาณานิคม"
 lar_concessions_to_italy.5.desc: "เอกอัครราชทูต[From.GetAdjective]ไดยื่นบันทึกจากรัฐบาลของตน ดูเหมือนวา[From.GetLeader]ตองการใหสัตยาบันขอตกลงเบื้องตนที่บรรลุในสเตรซาอยางเปนทางการ เพื่อใหขอเสนอนาสนใจยิ่งขึ้น ชาว[From.GetAdjective]เสนอดินแดนฝรั่งเศสในแอฟริกาตะวันออกใหเราหากเราตกลง\n\nมีขาวลือในแวดวงการทูตวากอนหนานี้ชาว[From.GetAdjective]เคยทาบทามชาว[ENG.GetAdjective]ใหออกแถลงการณรวมพรอมการยกดินแดนที่มากกวานี้ แตถูกปฏิเสธ"
 lar_concessions_to_italy.5.a: "ฟงดูสมเหตุสมผล"
 lar_concessions_to_italy.5.b: "นั่นเปนการใหนอยเกินไปแตเรียกรองมากเกินไป"
 lar_concessions_to_italy.6.t: "[ITA.GetLeader]ตกลง"
 lar_concessions_to_italy.6.desc: "รัฐบาล[From.GetAdjective]ตกลงในหลักการตอการแลกเปลี่ยนดินแดนที่เราเสนอ และสัญญาวาจะใหสัตยาบันขอตกลงสเตรซาเมื่อตกลงเงื่อนไขสุดทายของสนธิสัญญากันได การเจรจารายละเอียดปลีกยอยไดมอบหมายใหฝายการทูตดําเนินการ โดยสนธิสัญญาฉบับสุดทายจะใหสัตยาบันในภายหลัง การโอนดินแดนจะยังไมเกิดขึ้นจนกวาจะลงนามสนธิสัญญานี้"
 lar_concessions_to_italy.6.a: "เราควรทําเรื่องนี้ใหสําเร็จ"
 lar_concessions_to_italy.7.t: "[ITA.GetLeader]ปฏิเสธ"
 lar_concessions_to_italy.7.desc: "ในคําตอบอันหวน ๆ ตอบันทึกของเรา รัฐบาล[From.GetAdjective]ระบุวาไมสนใจจะสรางพันธมิตรหรือใหสัตยาบันขอตกลงสเตรซาในขณะนี้ และอางวาไมวาจะยกดินแดนใหมากเพียงใดก็คงไมทําใหเรื่องนี้เปลี่ยนไป"
 lar_concessions_to_italy.7.a: "เรื่องนี้ทําใหเราลําบากใจอยูบาง"
 lar_ratify_the_stresa_front.1.t: "การใหสัตยาบันแนวรวมสเตรซา"
 lar_ratify_the_stresa_front.1.desc: "การเตรียมการลงนามและใหสัตยาบันความตกลงสเตรซากําลังดําเนินอยู ซึ่งจะทําใหพันธมิตรกับฝรั่งเศสเปนทางการเพื่อแลกกับการไดรับดินแดน หลังฝายการทูตทํางานมาหลายเดือน สิ่งเดียวที่เหลืออยูคือการจรดปากกาลงนาม"
 lar_ratify_the_stresa_front.1.a: "ชัยชนะของการทูต[This.GetAdjective]"
 lar_ratify_the_stresa_front.1.b: "เรื่องนี้ไมเปนประโยชนตอเราอีกตอไป"
 lar_ratify_the_stresa_front.2.desc: "ถึงเวลาแลวที่จะทําตามสัญญาที่ใหไวกับรัฐบาล[From.GetAdjective] เมื่อพันธมิตรมีผลบังคับใชแลว เรามีพันธะตองโอนจิบูตีใหอยูภายใตการควบคุมของพวกเขา"
 lar_ratify_the_stresa_front.2.a: "ฝรั่งเศสรักษาสัญญาเสมอ"
 lar_ratify_the_stresa_front.2.b: "สถานการณเปลี่ยนไปแลว"
 lar_ratify_the_stresa_front.3.t: "[From.GetNameDefCap]ปฏิเสธการใหสัตยาบันพันธมิตร"
 lar_ratify_the_stresa_front.3.desc: "รัฐบาล[From.GetAdjective]กลับลําอยางกะทันหัน ตัดสินใจไมรักษาคํามั่นเดิมที่จะใหสัตยาบันความตกลงสเตรซาอีกตอไป ความพยายามทุกทางที่จะขอคําอธิบายผานชองทางการทูตลวนลมเหลว โดยนักการทูต[From.GetAdjective]เองก็ดูตกตะลึงไมแพกันกับการเปลี่ยนใจอยางกะทันหันนี้"
 lar_ratify_the_stresa_front.3.a: "วันอันมืดมน"
 lar_ratify_the_stresa_front.4.desc: "[FRA.GetNameDefCap]และ[ITA.GetNameDef]ไดลงนามในความตกลงสเตรซาและทําใหพันธมิตรเปนทางการแลว บัดนี้ถึงคราวที่เราตองทําตามขอตกลงในสวนของเรา ลงนามในความตกลง และโอนดินแดนของเราในโซมาเลียใหอยูภายใตการควบคุมของ[ITA.GetAdjective]"
 lar_ratify_the_stresa_front.4.a: "เราใหคํามั่นไวแลว"
 lar_ratify_the_stresa_front.4.b: "ผลประโยชนของเราไมตรงกันอีกตอไป"
 lar_franco_soviet_treaty.1.t: "ฝรั่งเศสเสนอสนธิสัญญาความชวยเหลือซึ่งกันและกัน"
 lar_franco_soviet_treaty.1.desc: "รัฐบาลของ[From.GetLeader]ไดสงทูตพิเศษมายังมอสโกเพื่อหารือความเปนไปไดในการเปนพันธมิตร ภายใตขอเสนอของ[From.GetAdjective] เราจะใหคํามั่นวาจะเขารวมสงครามปองกันตนเองใด ๆ ที่[From.GetNameDef]ตองเผชิญ โดย[From.GetNameDef]จะมาชวยเหลือเราหากเราถูกโจมตี"
 lar_franco_soviet_treaty.1.a: "จิตวิญญาณแหงป 1894 ยังคงอยู!"
 lar_franco_soviet_treaty.1.b: "ไมมีฝายใดสามารถชวยเหลืออีกฝายไดอยางมีประสิทธิภาพ"
 lar_franco_soviet_treaty.2.t: "[From.GetNameDefCap]ตกลง"
 lar_franco_soviet_treaty.2.desc: "รัฐบาล[From.GetAdjective]ตกลงตามขอเสนอของเรา แตยํ้าวาจะไมมีวันยอมรับสงครามเปนเครื่องมือเปลี่ยนแปลงภูมิทัศนทางการเมืองของยุโรปอยางมีนัยสําคัญ พันธมิตรของเราจึงเปนการปองกันอยางเครงครัด โดยแตละฝายผูกพันที่จะชวยเหลืออีกฝายก็ตอเมื่อถูกมหาอํานาจที่สามโจมตีเทานั้น"
 lar_franco_soviet_treaty.2.a: "เทานั้นก็นาจะพอแลว"
 lar_franco_soviet_treaty.3.t: "[From.GetNameDefCap]ปฏิเสธ"
 lar_franco_soviet_treaty.3.desc: "ในการพบหารืออันเย็นชากับรัฐมนตรีวาการกระทรวงการตางประเทศ[From.GetAdjective] เอกอัครราชทูตของเราไดรับแจงวาการเปนพันธมิตรกับเราไมเปนประโยชนตอ[From.GetAdjective] เขาไดรับคําอธิบายวาความเปนจริงทางภูมิศาสตรของยุโรปทําใหทหาร[From.GetAdjective]ไมอาจสนับสนุนเราไดอยางมีประสิทธิภาพหากดินแดนของเราถูกโจมตี และในทางกลับกันก็เชนเดียวกัน รัฐบาล[From.GetAdjective]จึงตองปฏิเสธขอเสนอเชนนี้"
 lar_franco_soviet_treaty.3.a: "เปนไปไมไดจริง หรือแคไมสะดวกกันแน?"
 lar_end_the_occupation.1.t: "การสิ้นสุดของการยึดครอง"
 lar_end_the_occupation.1.desc: "หลังผานไปหลายป รัฐบาลของ[From.GetLeader]ไดประกาศอยางเปนทางการวาโครงการ 'การปฏิวัติแหงชาติ' ประสบความสําเร็จแลว เขากลาวในการปราศรัยทางวิทยุวาความออนแอและความเสื่อมโทรมของระบบการเมืองฝรั่งเศสแบบเกาไดถูกขจัดสิ้นไป และถูกแทนที่ดวยระบบการปกครองใหมที่ฟนคืนชีวิต ซึ่งเหมาะสมกับชาติอันสูงสงและเปยมดวยจิตวิญญาณนักรบอยางฝรั่งเศสยิ่งกวา\n\nในฐานะสวนหนึ่งของความพยายามนี้ รัฐบาลของเขาไดรองขออยางเปนทางการใหยกเลิกพันธะและขอจํากัดที่สัญญาสงบศึกกําหนดไว และใหรัฐบาลของเขาไดควบคุมดินแดนฝรั่งเศสทั้งหมดอยางสมบูรณ\n\nเพื่อเปนการตอบแทน เขาเสนอที่จะกลับเขารวมสงครามเพื่อลงโทษผูที่ฉุดสองประเทศของเราเขาสูสงครามนองเลือดครั้งที่สองภายในชั่วอายุคนเดียว"
 lar_end_the_occupation.1.a: "เรายินดีตอนรับพวกเขาดวยออมแขนที่เปดกวาง!"
 lar_end_the_occupation.1.b: "ดูเหมือนเขาจะคิดการใหญเกินฐานะของตนไปมาก"
 lar_end_the_occupation.2.t: "การยึดครองสิ้นสุดลง"
 lar_end_the_occupation.2.desc: "หลังจาก[This.GetLeader]ลงนามในกติกาสัญญาเหล็ก ทหารเยอรมันทั่วประเทศก็ไดสงมอบการควบคุมใหแกกองกําลังฝรั่งเศส หลังพิธีที่ทั้ง[From.GetLeader]และ[This.GetLeader]เขารวม กองรักษาการณเยอรมันในปารีสไดลดธง[From.GetAdjective]ลงและเดินแถวออกจากเมือง ปลอยใหปารีสอยูใตธงไตรรงคเปนครั้งแรกในรอบหลายป"
 lar_end_the_occupation.2.a: "เราไดเกียรติยศของเรากลับคืนมาแลว"
 lar_end_the_occupation.3.t: "[From.GetLeader]ปฏิเสธ"
 lar_end_the_occupation.3.desc: "แมเราจะเสนออยางใจกวางที่จะยืนหยัดเคียงขางกันตอตานภัยคุกคามบอลเชวิค และไลลาพวกกระหายสงครามที่กอสงครามครั้งนี้ แต[From.GetLeader]กลับปฏิเสธการทาบทามทางการทูตของเราอยางไมไยดี เขาประกาศวาชาวฝรั่งเศสไมไดแสดงความสามารถทางการทหารใด ๆ ในสงครามครั้งนี้เลย และเขาไมเห็นเหตุผลที่จะไววางใจใหประเทศที่เคยพายแพมาแลวครั้งหนึ่งปกปองพรมแดนดานตะวันตกของ[From.GetNameDef]"
 lar_end_the_occupation.3.a: "ถึงเวลาแลวที่จะรวมมือกับ[FRA.GetLeader]!"
 lar_end_the_occupation.3.b: "เราจะตอบโตการดูหมิ่นนี้ดวยเหล็กกลาและเปลวเพลิง!"
 lar_end_the_occupation.4.t: "ขอเสนอจากวิชี"
 lar_end_the_occupation.4.desc: "ในความพลิกผันที่ไมมีใครคาดคิด ผูแทนของ[From.GetLeader]ไดติดตอเรามาพรอมขอเสนอใหรวมมือกัน หลังจากฟนฟูกองทัพอยางระมัดระวังภายใตความลับขั้นสูงสุด [From.GetLeader]เชื่อวาถึงเวลาแลวที่จะกลับเขารวมสงครามและปลดปลอยมาตุภูมิ\n\nอยางไรก็ตาม แหลงขาวของเราภายในรัฐบาลของเขาชี้วา แรงจูงใจที่แทจริงเบื้องหลังความเคลื่อนไหวครั้งลาสุดนี้คือความลมเหลวของความพยายามกอนหนาในการเจรจาขอคืนดินแดนฝรั่งเศสที่ถูกยึดครอง"
 lar_end_the_occupation.4.a: "ในที่สุดพวกเขาก็คิดได"
 lar_end_the_occupation.4.b: "ทําไมเราตองชวยพวกขี้ขลาดและคนทรยศดวย?"
 lar_end_the_occupation.5.t: "[From.GetLeader]ตกลง"
 lar_end_the_occupation.5.desc: "คณะผูแทนของเราที่ไปพบ[From.GetLeader]ไดเดินทางกลับมาอยางประสบความสําเร็จ พรอมกับตัวเขาเอง [From.GetLeader]ไดเหยียบแผนดินฝรั่งเศสเปนครั้งแรกในรอบหลายป และไดพบหารือกับ[This.GetLeader]เพื่อตกลงรายละเอียดที่แนชัดของการถายโอนอํานาจ"
 lar_end_the_occupation.5.a: "ยอดเยี่ยม"
 lar_end_the_occupation.6.t: "[From.GetLeader]ปฏิเสธ"
 lar_end_the_occupation.6.desc: "หลังการเทศนายืดยาวถึงความลมเหลวนานัปการของ[This.GetLeader]ทั้งในฐานะบุรุษ ผูรักชาติ ทหาร และพลเมือง คณะผูแทนของเราที่ไปพบ[From.GetLeader]ก็ถูกสงกลับมามือเปลา ในการออกอากาศทางวิทยุชวงหลังของวันนั้น [From.GetLeader]ไดประณามรัฐบาลของเราตอสาธารณะวาเปน 'การรวมตัวของพวกขี้ขลาดและคนทรยศที่ยิ่งใหญที่สุดในประวัติศาสตรฝรั่งเศส'\n\nหากเราจะกอบกูมาตุภูมิและปลดปลอยจากเยอรมัน เราคงตองทําโดยไมมีความชวยเหลือจากพวกเขา"
 lar_end_the_occupation.6.a: "ผูรักชาติที่แทจริงที่ไหนจะปดมือเพื่อนรวมชาติชาวฝรั่งเศสทิ้งเชนนี้?"
 lar_low_stability_civil_war.1.t: "การลุกฮือของคอมมิวนิสต!"
 lar_low_stability_civil_war.1.desc: "หลังการปลุกระดมและการเตรียมการลับนานหลายสัปดาห การนัดหยุดงานครั้งใหญไดปะทุขึ้นในหลายเมืองของฝรั่งเศส แทบจะทันที 'กองพลนอยปองกันแรงงาน' ติดอาวุธก็ถูกจัดตั้งขึ้น ในบางกรณีไดรับการสนับสนุนจากหนวยทหารที่กอกบฏ กองกําลังที่ภักดีตอรัฐบาลถูกยิงใสหลายครั้งทั่วประเทศ การปะทะระหวางฝายกบฏกับฝายภักดีลุกลามเปนการยิงตอสูกันอยางดุเดือด\n\nเมื่อความสงบเรียบรอยภายในเสื่อมถอยลงเรื่อย ๆ รัฐบาลก็สูญเสียการควบคุมพื้นที่กวางใหญของประเทศไปแลวโดยปริยาย"
 lar_low_stability_civil_war.1.a: "การปฏิวัติฝรั่งเศสอีกครั้งงั้นหรือ?"
 lar_low_stability_civil_war.2.t: "การลุกฮือของฝายปฏิกิริยา!"
 lar_low_stability_civil_war.2.desc: "เห็นไดชัดวากลุมลับของนายทหารหัวปฏิกิริยาและเจาที่ดินผูมั่งคั่งไดเตรียมการรัฐประหารตอรัฐบาล แมตํารวจจะรูตัวตนของบางคน แตอีกหลายคนยังไมถูกระบุตัว หลังขอมูลรั่วไหลจากภายในการสืบสวน ผูสมคบคิดจึงตัดสินใจลงมือกอนที่แผนการทั้งหมดจะถูกเปดโปง\n\nความเรงรีบและสับสนของรัฐประหารทําใหไมอาจจูโจมไดอยางไมใหทันตั้งตัวตามที่ตองการ หนวยตาง ๆ ไมไดอยูในตําแหนง และกองรักษาการณในทองถิ่นไดรับคําเตือนลวงหนา ทหารฝายภักดีลงมืออยางรวดเร็วและสามารถปองกันการโจมตีเพื่อตัดหัวรัฐบาลของเราไดสําเร็จ แตก็ตองละทิ้งพื้นที่สวนใหญของประเทศเพื่อทําเชนนั้น เมื่อการกบฏลุกลาม ดูเหมือนวาประเทศไดถลําเขาสูสงครามกลางเมืองเต็มรูปแบบแลว"
 lar_low_stability_civil_war.2.a: "เราตางรูอยูแลววาเรื่องนี้จะตองเกิดขึ้น"
 lar_worker_shortage.1.t: "การขาดแคลนแรงงานทวีความรุนแรง"
 lar_worker_shortage.1.desc: "หลังการขยายการเกณฑทหารและการเรียกตัวคนงานที่เคยไดรับการยกเวน บริษัทจํานวนมากรายงานปญหาในการหาคนมาทํางานแทนตําแหนงที่วาง แมแตอุตสาหกรรมอาวุธยังไดรับผลกระทบจากการขาดแคลนแรงงานนี้ และผลผลิตก็เริ่มลดลงตามไปดวย\n\nผูเชี่ยวชาญดานอุตสาหกรรมเรียกรองใหรัฐบาลหาแหลงกําลังคนใหม ไมวาจะดวยการปลดผูชายที่อยูในกองทัพออกมา หรือหาคนมาแทนคนงานที่ถูกเกณฑเขากองทัพ"
 lar_worker_shortage.1.a: "บางทีพวกเขาอาจจางผูหญิงแทนก็ได?"
 lar_worker_shortage.2.t: "ทหารกลับสูโตะทํางาน"
 lar_worker_shortage.2.desc: "แมกองทัพจะคัดคานอยางชัดแจง แตการลดการเกณฑทหารและการคืนสิทธิยกเวนการเกณฑใหแกแรงงานฝมือไดชวยบรรเทาการขาดแคลนแรงงาน สถิติแสดงใหเห็นถึงผลิตภาพที่ดีขึ้นอยางเห็นไดชัด และกลับคืนสูระดับกอนการขยายการเกณฑทหารอยางรวดเร็ว"
 lar_worker_shortage.2.a: "คุณภาพ ไมใชปริมาณ!"
 lar_arms_purchases.1.t: "[From.GetNameDefCap]ตองการซื้ออาวุธ"
 lar_arms_purchases.1.desc: "ดวยสถานการณในยุโรปที่เลวรายลงอยางรวดเร็ว เจาหนาที่ฝรั่งเศสไดติดตอเราเพื่อขอใบอนุญาตสงออกอาวุธหนักและเครื่องบินทันสมัย โดยจะสั่งผลิตในโรงงานของเราทันทีที่ไดรับใบอนุญาต แมปริมาณคําสั่งซื้อโดยรวมจะนอยเกินกวาจะสงผลตอเศรษฐกิจอยางเห็นไดชัด แตก็ยังจะสรางงานไดไมนอย"
 lar_arms_purchases.1.a: "แนนอน!"
 lar_arms_purchases.1.b: "ไมมีทาง!"
 lar_arms_purchases.2.t: "[From.GetNameDefCap]ตกลง"
 lar_arms_purchases.2.desc: "ดวยการสนับสนุนของประธานาธิบดี[From.GetLeader] วุฒิสภาสหรัฐฯ ไดผานรางกฎหมายฉบับกวางขวางที่อนุญาตใหเราสั่งผลิตอาวุธในโรงงานของสหรัฐฯ ได แตจํากัดทางเลือกดานการเงินอยางเขมงวด เนื่องจากกลุมโดดเดี่ยวนิยมในสหรัฐฯ ยังคงเชื่อวาหนี้มหาศาลที่เรากอไวในชวงมหาสงครามคือสาเหตุที่ทําใหสหรัฐฯ ประกาศสงครามกับเยอรมนี พวกเขาจึงดูกระตือรือรนอยางยิ่งที่จะใหเราจายคาอาวุธเหลานี้ดวยเงินสด"
 lar_arms_purchases.2.a: "ถาตองทําเชนนั้นก็ยอม"
 lar_arms_purchases.3.t: "[From.GetNameDefCap]ปฏิเสธ"
 lar_arms_purchases.3.desc: "แมจะล็อบบี้อยางกวางขวางและไดรับการสนับสนุนจากวุฒิสมาชิกฝายแทรกแซงหลายคน แตความพยายามของเราในการขอใบอนุญาตสงออกยุทโธปกรณทางทหารจากสหรัฐฯ ก็ลมเหลว กลุมล็อบบี้โดดเดี่ยวนิยมในรัฐสภาสกัดทุกความพยายามที่จะนําเรื่องนี้เขาวาระไดสําเร็จ ดวยเกรงวาการขายอาวุธใด ๆ จะเปนกาวแรกสูการแทรกแซงเต็มรูปแบบ"
 lar_arms_purchases.3.a: "ชางกลานัก!"
 lar_france_volunteers.1.t: "อาสาสมัครจาก[From.GetNameDef]"
 lar_france_volunteers.1.desc: "เมื่อรัฐบาลของ[From.GetLeader]ตัดสินใจผอนคลายการควบคุมชายแดนระหวางสเปนกับ[From.GetNameDef] คลื่นอาสาสมัครก็เริ่มหลั่งไหลเขามาเพื่อสูรบเคียงขางเรา\n\nนาเสียดายที่นโยบายใหมนี้ใชกับทุกฝาย หมายความวาฝายอื่น ๆ ในสงครามก็นาจะไดรับการสนับสนุนเพิ่มเติมเชนกัน"
 lar_france_volunteers.1.a: "ดีมั้ง?"
 lar_france_volunteers.3.t: "อาสาสมัครกลับบาน"
 lar_france_volunteers.3.desc: "เมื่อการสูรบในสเปนสิ้นสุดลง ผูคนบางสวนที่ไปสูรบให[From.GetLeader]ไดเดินทางกลับมาแลว หนวยขาวกรองทางทหารตองการสัมภาษณพวกเขาเพื่อดูวาประสบการณของพวกเขาใหขอคิดเกี่ยวกับสงครามสมัยใหมบางหรือไม แตหลายคนในรัฐบาลกังวลวาพวกเขาอาจไปปลุกปนกลุมการเมืองอื่นใหหัวรุนแรงขึ้น"
 lar_france_volunteers.3.a: "ปลอยใหพวกเขากลับมา"
 lar_france_volunteers.3.b: "สงพวกเขากลับไป"
 lar_non_intervention.1.t: "[From.GetNameDefCap]เชิญเราเขารวมคณะกรรมการไมแทรกแซง"
 lar_non_intervention.1.desc: "[From.GetLeader]ไดเรียกรองอยางเปนทางการใหจัดตั้งคณะกรรมการไมแทรกแซง ซึ่งมีหนาที่รับประกันวาจะไมมีการแทรกแซงจากภายนอกในสงครามที่กําลังดําเนินอยูในสเปน อยางไรก็ตาม รางขอเสนอที่แนบมากับสาสนแทบไมมีกลไกที่หนักแนนในการบังคับใชการไมแทรกแซงเลย\n\nแมเราจะตกลงไมแทรกแซง แตชองโหวมากมายก็ทําใหเรายังสามารถสงผลตอสงครามในสเปนไดหากเราตองการ ผลที่จับตองไดเพียงอยางเดียวคือความนิยมตอรัฐบาลของ[From.GetLeader]ที่เพิ่มขึ้นเล็กนอย"
 lar_non_intervention.1.a: "เงื่อนไขเหลานี้ยอมรับได"
 lar_non_intervention.1.b: "นี่เปนเรื่องเหลวไหล และเราจะไมเขาไปมีสวนรวมใด ๆ!"
 lar_non_intervention.2.t: "[From.GetNameDefCap]เขารวมคณะกรรมการไมแทรกแซง"
 lar_non_intervention.2.desc: "[From.GetnameDef]ไดลงนามเขารวมคณะกรรมการไมแทรกแซงอยางเปนทางการ โดยเรียกวาเปนกาวสําคัญในการยุติความรุนแรงในสเปน แตพวกเขาจะปฏิบัติตามเงื่อนไขจริงหรือไมนั้นยังตองรอดูกันตอไป"
 lar_non_intervention.2.a: "เราไมมีเหตุผลที่จะสงสัยพวกเขา ใชไหม?"
 lar_non_intervention.3.t: "[From.GetNameDefCap]ปฏิเสธการเขารวมคณะกรรมการไมแทรกแซง"
 lar_non_intervention.3.desc: "[From.GetNameDef]ไดปฏิเสธขอเสนอของเราในการเขารวมคณะกรรมการไมแทรกแซงอยางเปนทางการ โดยอางวาขาดกลไกบังคับใชที่หนักแนน ยังไมชัดเจนวานี่หมายความวา[From.GetLeader]ตองการแทรกแซงในสเปนโดยตรงหรือไม"
 lar_non_intervention.3.a: "เวลาเทานั้นที่จะใหคําตอบ"
 lar_appeal_to_overseas_territories.2.t: "อินโดจีนยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.2.desc: "ขาหลวงทองถิ่นแหงอินโดจีนไดปฏิเสธอยางเปนทางการและเปดเผยวาจะไมแมแตพิจารณาเปลี่ยนขางมาสนับสนุนรัฐบาลของเรา ในการปราศรัยทางวิทยุตออาณานิคม เขายังประกาศปราบปรามอยางรุนแรงตอกลุมใด ๆ ที่พยายาม 'ลงมือเปลี่ยนแปลงสถานะนี้โดยพลการและอยางไรความรับผิดชอบ'"
 lar_appeal_to_overseas_territories.2.a: "ไอขี้ขลาดและคนทรยศ"
 lar_appeal_to_overseas_territories.3.t: "อินโดจีนประกาศสนับสนุน[This.GetLeader]"
 lar_appeal_to_overseas_territories.3.desc: "ขาหลวงแหงอินโดจีนไดประกาศสนับสนุน[This.GetLeader] โดยระบุวารัฐบาลที่วิชีไมมีความชอบธรรมตามรัฐธรรมนูญ และเห็นไดชัดวากระทําการภายใตการบีบบังคับ อยางไรก็ตาม กองกําลังทหารในพื้นที่สวนใหญยังคงภักดีตอรัฐบาลวิชี และขณะนี้กําลังเจรจาขอตกลงเพื่อสงพวกเขากลับประเทศ"
 lar_appeal_to_overseas_territories.3.a: "ยอดเยี่ยม!"
 lar_appeal_to_overseas_territories.4.t: "ซีเรียยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.4.desc: "ผูบริหารทองถิ่นในซีเรียเลือกที่จะเพิกเฉยตอคํารองขอของเราโดยสิ้นเชิง แหลงขาวบางแหงระบุวามีการหารือลับหลังประตูที่ปดสนิทอยูชวงสั้น ๆ แตทายที่สุดก็ไมมีความเห็นอยางเปนทางการใด ๆ ตอคํารองขอทางวิทยุ หรือการดําเนินการใดเพื่อสนับสนุนอุดมการณของเรา"
 lar_appeal_to_overseas_territories.5.t: "ซีเรียประกาศสนับสนุน[This.GetLeader]"
 lar_appeal_to_overseas_territories.5.desc: "ดูเหมือนวาไดเกิดรัฐประหารแบบเงียบ ๆ ขึ้นในซีเรีย โดยบุคคลสําคัญหลายคนในฝายบริหารอาณานิคมถูกขาหลวงสั่งจับกุม จากนั้นเขาก็ประกาศความภักดีตอ[This.GetLeader] และเรียกรองใหชาวฝรั่งเศสผูรักชาติทุกคนจับอาวุธตอสูกับศัตรูที่กําลังยึดครองมาตุภูมิของเรา"
 lar_appeal_to_overseas_territories.6.t: "แอฟริกากลางยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.6.desc: "ผูบริหารอาณานิคมในดินแดนแอฟริกากลางของเราไดรวมกันปฏิเสธคํารองขอทางวิทยุของ[This.GetLeader] โดยเรียกวาเปนการทรยศที่มุงบอนทําลายอํานาจของรัฐบาลอันชอบธรรม แหลงขาวระบุวาพวกเขาเกรงปฏิกิริยาของประชากรพื้นเมืองหากเปลี่ยนขาง และกังวลวาจะขาดการสนับสนุนหากกลุมคนที่มีแนวคิดอิสระมากกวาตัดสินใจพยายามแยกตัวเปนอิสระ"
 lar_appeal_to_overseas_territories.6.a: "รวมพวกมันทุกคนเขาดวยกันก็ยังไมสมควรถูกเรียกวาลูกผูชาย!"
 lar_appeal_to_overseas_territories.7.t: "แอฟริกากลางเปลี่ยนขาง"
 lar_appeal_to_overseas_territories.7.desc: "ภายใตการนําของผูบริหารเฟลิกซ เอบูเอ อาณานิคมในแอฟริกากลางไดเขารวมอุดมการณของเรา การรณรงครับสมัครในหมูประชากรทองถิ่นไดเริ่มขึ้นแลว"
 lar_appeal_to_overseas_territories.8.t: "แอฟริกาตะวันตกยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.8.desc: "แมผูบริหารทองถิ่นในแอฟริกาตะวันตกโดยรวมจะสนับสนุนการเปลี่ยนมาอยูฝายเรา แตดูเหมือนวาชาวยุโรปจํานวนมากในพื้นที่ไมเห็นดวย เมื่อแรงกดดันจากสาธารณชนทวีขึ้น ขาหลวงทองถิ่นจึงถูกบีบใหตองประกาศสนับสนุนรัฐบาลวิชีตอสาธารณะ"
 lar_appeal_to_overseas_territories.9.t: "แอฟริกาตะวันตกประกาศสนับสนุน[This.GetNameDef]"
 lar_appeal_to_overseas_territories.9.desc: "ขณะที่ผูบริหารทองถิ่นในดินแดนแอฟริกาตะวันตกของเรายังคงถกเถียงกันวาจะตอบสนองตอคํารองขอของ[This.GetLeader]อยางไร พลเมืองผูรักชาติในภูมิภาคก็เลือกที่จะลงมือและเขายึดตําแหนงในรัฐบาลอาณานิคม บัดนี้พื้นที่ดังกลาวอยูภายใตการควบคุมของเราแลว"
 lar_appeal_to_overseas_territories.10.t: "มาดากัสการยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.10.desc: "ขาหลวงแหงเกาะไดรองขอใหพลเมืองสงบสติอารมณและปฏิบัติตามคําสั่งของรัฐบาลอันชอบธรรมที่วิชี ดูเหมือนวาบนเกาะจะมีความไมพอใจเพียงเล็กนอย โดยผูอยูอาศัยสวนใหญยอมทําตามคําสั่งนี้"
 lar_appeal_to_overseas_territories.11.t: "มาดากัสการเปลี่ยนขาง"
 lar_appeal_to_overseas_territories.11.desc: "ขาหลวงแหงมาดากัสการไดเสนอฐานทัพบนเกาะใหแกกองกําลังของเราและพันธมิตร พรอมขอการสนับสนุนเพิ่มเติมเพื่อปกปองเกาะจากการโจมตีใด ๆ"
 lar_appeal_to_overseas_territories.12.t: "แอฟริกาเหนือยังคงอยูกับวิชี"
 lar_appeal_to_overseas_territories.12.desc: "แมในฝายเราจะมีไมกี่คนที่หวังวาฐานที่มั่นแหงอํานาจวิชีในแอฟริกาเหนือจะเปลี่ยนขาง แตความรุนแรงของการปฏิเสธก็ยังสรางความตกตะลึงไมนอย ขาหลวงทองถิ่นไดตราหนา[This.GetLeader]วาเปนคนทรยศและคนบา และปฏิญาณวาจะสนับสนุนรัฐบาลวิชีดวยทุกวิถีทางที่จําเปน"
 lar_appeal_to_overseas_territories.13.t: "แอฟริกาเหนือเปลี่ยนขาง"
 lar_appeal_to_overseas_territories.13.desc: "ในความพลิกผันที่ไมมีใครคาดคิด ขาหลวงทองถิ่นแหงแอฟริกาเหนือของฝรั่งเศสไดสั่งใหทหารจับกุมเจาหนาที่ผูสนับสนุนวิชีอยางเปดเผยจํานวนหนึ่ง และประกาศสนับสนุนรัฐบาลใหมของ[This.GetLeader]"
 lar_france_political_violence.4.t: "ความรุนแรงทางการเมืองหวนคืน"
 lar_france_political_violence.4.desc: "หลังชวงเวลาสงบอันสั้น ๆ ที่ความนิยมตอ[This.GetLeader]พุงสูงอยางไมเคยมีมากอน ดูเหมือนวาความรุนแรงทางการเมืองที่ฝงรากลึกระหวางคอมมิวนิสตกับกลุมปฏิกิริยาไดหวนกลับมาอีกครั้ง ตํารวจรายงานการเพิ่มขึ้นอยางนากังวลของอาชญากรรมที่มีแรงจูงใจทางการเมืองตอบุคคลและกิจการ ชวนใหนึกถึงวันเวลาอันวุนวายที่เราคิดวาไดทิ้งไวเบื้องหลังแลว"
 lar_france_political_violence.4.a: "ตองหยุดยั้งพวกหัวรุนแรงเหลานี้"
 france.10.e: "สูตอไป"
 lar_france_vichy_reunification.1.t: "[From.GetLeader]เรียกรองการรวมชาติ"
 lar_france_vichy_reunification.1.desc: "หลังกองกําลังของเขาปลดปลอยปารีสได ผูนํากองกําลังฝรั่งเศสพลัดถิ่น [From.GetLeader] ไดเรียกรองใหรัฐบาลของเขาไดรับอํานาจเต็มเหนือพื้นที่ที่ไมถูกยึดครองทั้งหมดของฝรั่งเศส เขากลาววาการปฏิเสธไมยอมสงมอบอํานาจใด ๆ จะถือเปนการจับอาวุธตอตานรัฐบาลอันชอบธรรมแหงสาธารณรัฐ"
 lar_france_vichy_reunification.1.a: "ถึงเวลาแลวที่จะเยียวยาการแตกแยกอันผิดธรรมชาตินี้"
 lar_france_vichy_reunification.1.b: "คนทรยศไมมีสิทธิ์เรียกรองสิ่งใด"
 lar_france_vichy_reunification.2.t: "รัฐบาลวิชียุบตัว"
 lar_france_vichy_reunification.2.desc: "รัฐบาลวิชีไดลงมติยุบตัวเองและสงมอบอํานาจการปกครองใหแกเรา ขาราชการระดับลางสวนใหญเลือกที่จะอยูในตําแหนงตอ และกองกําลังทหารที่เหลือไดเขามาอยูภายใตการบัญชาการของเรา"
 lar_france_vichy_reunification.2.a: "เรากลับมาเปนหนึ่งเดียวกันอีกครั้ง"
 lar_france_vichy_reunification.3.t: "รัฐบาลวิชียังคงอยู"
 lar_france_vichy_reunification.3.desc: "รัฐบาลของ[From.GetLeader]ปฏิเสธที่จะสงมอบอํานาจการปกครองใหแกเรา ทุกความพยายามที่จะเปดการเจรจาไดรับเพียงความเงียบ และเราอาจตองบีบบังคับพวกเขาดวยกําลังอาวุธ"
 lar_france_vichy_reunification.3.a: "ถาเชนนั้นเราจะสรางเอกภาพดวยกําลัง"
 SPA_civil_war_event_tt: "§Gปลดล็อกแมแบบกองพลที่ถูกล็อกไว§!\n"
 SPR_civil_war_event_tt: "§Gปลดล็อกแมแบบกองพลที่ถูกล็อกไว§! และ§Rยุบหนวยที่เกี่ยวของ§!\n"
 lar_spain.1.desc: "แมสมาพันธสิทธิปกครองตนเองแหงสเปนจะรณรงคหาเสียงอยางหนัก แตดูเหมือนวาแนวรวมประชาชนฝายซายที่กอตั้งโดยพรรคสังคมนิยมแรงงานสเปนและพรรคฝายซายรีพับลิกัน โดยไดรับความชวยเหลือจากฝายอนาธิปไตย คอมมิวนิสต และสหภาพแรงงาน จะเปนผูชนะการเลือกตั้งป 1936 สะทอนภูมิทัศนทางการเมืองของสเปนที่แตกแยกอยางหนัก คะแนนนําของแนวรวมประชาชนในคะแนนเสียงรวมดูจะแคบกวาคะแนนนําอยางสบาย ๆ ในจํานวนที่นั่งมาก\n\nไมวารัฐบาลใหมชุดใดจะถูกจัดตั้งขึ้นภายใตการนําของประธานาธิบดี[Root.GetLeader]ในอีกไมกี่วันหรือสัปดาหขางหนา ก็จะตองรับมือกับฝายขวาทางการเมืองที่แปลกแยกและเปนปฏิปกษมากขึ้นเรื่อย ๆ ดังนั้น แทนที่จะแกไขความรุนแรงทางการเมืองและความไมสงบในสังคมที่ครอบงําประเทศเรา ผลการเลือกตั้งครั้งลาสุดดูจะมีแตทําใหสถานการณเลวรายลง"
 lar_spain.1.a: "สเปนจะอยูรอดไดก็ดวยการดับสิ้นลัทธิฟาสซิสตเทานั้น!"
 lar_spain.1.b: "สเปนจะถูกหลอมขึ้นใหมไดก็จากเถาถานของสาธารณรัฐที่สองเทานั้น!"
 SPR_republican_garrison_control_decisions_tt: "\nปลดล็อกการตัดสินใจบนแผนที่ §Yขยายการควบคุมกองรักษาการณ§! ทําใหสามารถ§Gตอบโต§!§Yอิทธิพลฝายชาตินิยม§!ในรัฐตาง ๆ ได\n\nรัฐที่ฝายชาตินิยมไมมี§Yการควบคุมกองรักษาการณ§!ระดับ§Rเบ็ดเสร็จ§!เมื่อสงครามกลางเมืองเริ่มขึ้น จะเริ่มความขัดแยงภายใต§Yการครอบครองของฝายสาธารณรัฐ§!\n"
 SPA_nationalist_garrison_control_decisions_tt: "\nปลดล็อกการตัดสินใจบนแผนที่ §Yขยายการควบคุมกองรักษาการณ§! ทําใหสามารถ§Gขยาย§!§Yอิทธิพลฝายชาตินิยม§!ในรัฐตาง ๆ ได\n\nเฉพาะรัฐที่ฝายชาตินิยมมี§Yการควบคุมกองรักษาการณ§!ระดับ§Gเบ็ดเสร็จ§!เมื่อสงครามกลางเมืองเริ่มขึ้นเทานั้น จึงจะเริ่มความขัดแยงภายใต§Yการครอบครองของฝายชาตินิยม§!\n"
 lar_spain.2.t: "สงครามกลางเมืองสเปน"
 lar_spain.2.desc: "เวลา 5:00 น. ตรงของเชาวันนี้ หนึ่งวันพอดีหลังจากขาดการติดตอกับกองรักษาการณในแอฟริกาเหนือ ปฏิบัติการทางทหารที่เตรียมการมาอยางดีไดเปดฉากขึ้นทั่วสเปน โดยมีเปาหมายเพื่อยึดอํานาจควบคุมสถาบันรัฐบาลทั้งหมดและจุดยุทธศาสตรในเมืองใหญ กองทัพบก กองทัพเรือ และกองทัพอากาศสวนใหญหยุดตอบสนองตอคําสั่งของรัฐบาล ขณะเดียวกันกองกําลังติดอาวุธคารลิสตก็กอกบฏขึ้นทางตอนเหนือของประเทศ\n\nความพยายามกอรัฐประหารครั้งนี้ไมประสบความสําเร็จอยางสมบูรณก็เพราะกองกําลังอาสาของประชาชนที่ไมเปนทางการ ซึ่งลงมืออยางรวดเร็วจนสามารถรักษาการควบคุมสถานที่และเมืองเปาหมายจํานวนมากไวได อยางไรก็ตาม แมจะลมเหลวในการบรรลุเปาหมายแรกเริ่ม ก็ดูไมนาเปนไปไดที่ผูนําการกอกบฏจะยอมสละตําแหนงที่แข็งแกรงของตนอยางงายดายเหมือนในป 1932 เมื่อไมมีฝายใดดูจะมีทีทาประนีประนอม หนทางจึงเปดกวางใหสถานการณปจจุบันบานปลายกลายเปนสงครามกลางเมืองทั่วประเทศ..."
 lar_spain.2.a: "...ซึ่งเราจะเปนฝายชนะในฐานะแนวรวมชาตินิยมที่เปนหนึ่งเดียว!"
 lar_spain.2.b: "...ซึ่งเราจะเปนฝายชนะภายใตการนําของฟาลังเฆ!"
 lar_spain.2.c: "...ซึ่งเราจะเปนฝายชนะ ดวยพระเจา ปตุภูมิ และกษัตริย!"
 lar_spain.2.d: "...ซึ่งเราจะเปนฝายชนะ ดวยการยึดมั่นในหลักการประชาธิปไตยของเรา!"
 lar_spain.2.e: "...ซึ่งเราจะเปนฝายชนะ ดวยความกลาหาญของชนชั้นแรงงาน!"
 lar_spain.2.f: "...ซึ่งเราจะเปนฝายชนะ ดวยการตอสูปฏิวัติของประชาคม!"
 lar_spain.6.t: "แนวหนาสงครามกลางเมืองเริ่มคงที่"
 lar_spain.6.desc: "เพิ่งสูรบกันไดเพียงสัปดาหเดียว ก็เริ่มเห็นไดชัดแลววาชนบทของสเปนไมเหมาะกับการขนสงยุทโธปกรณปริมาณมาก ปญหาในการสงเสบียงใหแนวหนาและการรุกของเราเริ่มปรากฏขึ้น และจะยิ่งเลวรายลงหากเรายังพยายามสูรบทุกแหงพรอมกัน"
 lar_spain.6_tt: "\nปลดล็อกการตัดสินใจบนแผนที่ §Yการรุกในสงครามกลางเมือง§! ทําใหสามารถขจัดบทลงโทษในการรบจาก§Rการรุกที่ไมไดวางแผน§!ในรัฐเปาหมายได\n"
 lar_spain.6.a: "ถาเชนนั้นเราจะรอจังหวะ และโจมตีเมื่อถึงเวลาที่เหมาะสม"
 lar_spain.7.t: "การลุกฮือของฝายคารลิสต!"
 lar_spain.7.desc: "ดวยความระแวงตออิทธิพลที่เพิ่มขึ้นของเราเหนือแนวรวมชาตินิยม ฝายคารลิสตหมดความอดทนและเลือกที่จะลงมือเอง หนวยเรเกเตของพวกเขาหันมาโจมตีกองกําลังของเรา ขณะเดียวกันก็ยังคงสูรบกับศัตรูของเราตอไป\n\nไมมีใครรูวาพวกเขาหวังจะไดอะไรจากการกระทําอันโงเขลานี้ แตจนถึงตอนนี้ มันมีแตจะเสริมความแข็งแกรงใหฝายสาธารณรัฐ"
 lar_spain.7.desc_2: "ดวยความระแวงตออิทธิพลที่เพิ่มขึ้นของเราเหนือรัฐบาลหลังสงครามที่เพิ่งกอตั้ง ฝายคารลิสตหมดความอดทนและเลือกที่จะลงมือเอง หนวยเรเกเตของพวกเขาหันมาโจมตีกองกําลังของเรา\n\nพวกเขายอมเสี่ยงชัยชนะที่เราไดมาอยางยากลําบากเหนือฝายสาธารณรัฐ เพียงเพื่อสถาปนาอํานาจเหนือรัฐบาลใหม!"
 lar_spain.7.a: "ความดื้อดึงของพวกเขาจะทําใหพวกเขาเสียหายมากกวาเรา!"
 lar_spain.8.t: "การกวาดลางของฝายฟาสซิสต!"
 lar_spain.8.desc: "ดวยความไมพอใจที่เรายังคงยืนกรานความเปนอิสระทางการเมือง ผูนําฟาลังเฆจึงตัดสินใจพยายามลบขบวนการของเราออกจากแผนที่ กองกําลังฟาลังเฆหันมาโจมตีหนวยเรเกเตของเรา และมีความพยายามจับกุมนักคิดและนักการเมืองระดับแกนนําของเราหลายคน\n\nดวยความหัวแข็งของพวกเขา ตําแหนงของแนวรวมชาตินิยมทั้งหมดตกอยูในอันตราย และอาจเปดชองที่กองกําลังฝายสาธารณรัฐตองการพอดี"
 lar_spain.8.desc_2: "ดวยความไมพอใจที่เรายังคงยืนกรานจะมีอิทธิพลในระดับหนึ่งเหนือรัฐบาลหลังสงคราม ผูนําฟาลังเฆจึงตัดสินใจพยายามลบขบวนการของเราออกจากแผนที่โดยสิ้นเชิง! กองกําลังฟาลังเฆหันมาโจมตีหนวยเรเกเตของเรา และมีความพยายามจับกุมนักคิดและนักการเมืองระดับแกนนําของเราหลายคน\n\nพวกเขายอมเสี่ยงชัยชนะที่เราไดมาอยางยากลําบากเหนือฝายสาธารณรัฐ เพียงเพื่อกันไมใหเรามีอิทธิพลเหนือรัฐบาลใหม!"
 lar_spain.8.a: "ความโงเขลาของพวกเขาจะทําใหพวกเขาเสียหายมากกวาเรา!"
 lar_spain.9.t: "การลุกฮือของฝายอนาธิปไตย!"
 lar_spain.9.desc: "ความเปนอิสระที่เพิ่มมากขึ้นในการดําเนินการของคอมมูนฝายอนาธิปไตยไดมาถึงจุดแตกหักจากเหตุการณลาสุด ดวยความหงุดหงิดตอความพยายามอันสมเหตุสมผลอยางยิ่งของเราในการรักษาการควบคุมจากสวนกลางเหนือสวนสําคัญของการทําสงครามรวมกัน ฝายอนาธิปไตยและพันธมิตร POUM ของพวกเขาไดยกระดับความขัดแยงในทองถิ่นจนกลายเปนการสูรบบนทองถนนเต็มรูปแบบกับกองกําลังของเรา\n\nแมจะเริ่มตนในวงจํากัด แตการตอสูกันเองไดลุกลามออกไป คุกคามความมั่นคงของแนวหนาที่เผชิญกับฝายชาตินิยม"
 lar_spain.9.desc_2: "ความเปนอิสระที่เพิ่มมากขึ้นในการดําเนินการของคอมมูนฝายอนาธิปไตยไดมาถึงจุดแตกหักจากเหตุการณลาสุด ดวยความหงุดหงิดตอความพยายามอันสมเหตุสมผลอยางยิ่งของเราในการเริ่มกลับคืนสูรัฐบาลรวมศูนยที่มีเสถียรภาพทีละขั้น ฝายอนาธิปไตยและพันธมิตร POUM ของพวกเขาไดยกระดับความขัดแยงในทองถิ่นจนกลายเปนการสูรบบนทองถนนเต็มรูปแบบกับกองกําลังของเรา\n\nพวกเขายอมเสี่ยงชัยชนะที่เราไดมาอยางยากลําบากเหนือฝายชาตินิยม เพียงเพื่อรักษาความคิดเพอฝนเรื่องความเปนอิสระของตน!"
 lar_spain.9.a: "ถึงเวลาแลวที่จะบังคับใชอํานาจรัฐบาลเหนือพื้นที่เหลานี้อีกครั้ง"
 lar_spain.10.t: "การกวาดลางของรัฐบาล!"
 lar_spain.10.desc: "รัฐบาลสาธารณรัฐที่สองและพันธมิตรสตาลินนิสตคงไมพอใจที่เรายังคงดําเนินการอยางเปนอิสระ จึงพยายามยึดอํานาจควบคุมจุดยุทธศาสตรและอาคารสําคัญในดินแดนของเรา การตานทานความพยายามเหลานี้นําไปสูการยิงปะทะกับอดีตพันธมิตรของเรา ซึ่งตอมาไดบานปลายเปนการสูรบบนทองถนนเต็มรูปแบบ\n\nดวยความไมยอมประนีประนอม รัฐบาลไดทําใหเราตกอยูในภาวะสงครามกับพวกเขาโดยปริยาย และดวยเหตุนั้นจึงเสริมความแข็งแกรงใหฝายชาตินิยมอยางมาก"
 lar_spain.10.desc_2: "รัฐบาลสาธารณรัฐที่สองและพันธมิตรสตาลินนิสตคงไมพอใจที่เรายังคงดําเนินการอยางเปนอิสระ จึงพยายามยึดอํานาจควบคุมจุดยุทธศาสตรและอาคารสําคัญในดินแดนของเรา การตานทานความพยายามเหลานี้นําไปสูการยิงปะทะกับอดีตพันธมิตรของเรา ซึ่งตอมาไดบานปลายเปนการสูรบบนทองถนนเต็มรูปแบบ\n\nแทนที่จะปลอยใหเราอยูอยางสงบสุข พวกเขากลับยอมเสี่ยงชัยชนะที่เราไดมาอยางยากลําบากเหนือฝายชาตินิยม เพียงเพื่อเลี่ยงการประนีประนอมและการสละอํานาจ!"
 lar_spain.10.a: "การปฏิวัติของเราจะไมถูกดับลงไดงาย ๆ!"
 lar_spain.11.t: "ฝายคารลิสตพายแพ"
 lar_spain.11.desc: "แมจะสูอยางคลั่งไคล แตที่มั่นตอตานแหงสุดทายของฝายคารลิสตก็ถูกกองกําลังของเราปราบลงได แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.11.a: "แตเราก็กําลังรุดหนา"
 lar_spain.12.t: "ฟาลังเฆพายแพ"
 lar_spain.12.desc: "กองกําลังฟาลังเฆยอมจํานนกันเปนจํานวนมากหลังที่มั่นสําคัญแหงสุดทายถูกยึด และแมจะยังมีการตอตานประปรายอยู แตนี่ก็ถือเปนจุดจบของกองทัพที่มีการจัดตั้งของฟาลังเฆ แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.13.t: "ฝายชาตินิยมพายแพ"
 lar_spain.13.desc: "หลังความพายแพทางทหารครั้งลาสุดของฝายชาตินิยม นายพลฟรังโกไดประกาศยอมจํานนพรอมกองกําลังทั้งหมดของเขา แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.14.t: "ฝายอนาธิปไตยพายแพ"
 lar_spain.14.desc: "การตอตานของฝายอนาธิปไตยแมจะดุเดือด แตก็ไรระเบียบมากขึ้นเรื่อย ๆ ในชวงหลายสัปดาหที่ผานมา ชัยชนะทางทหารในวันนี้ทําใหสภาปองกันยอมจํานนโดยไมมีเงื่อนไขในที่สุด แมจะยังมีการสูรบประปรายในที่ที่คอมมูนบางแหงไมยอมรับคําสั่ง แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.15.t: "POUM พายแพ"
 lar_spain.15.desc: "การตอตานของ POUM แมจะดุเดือด แตก็ไรระเบียบมากขึ้นเรื่อย ๆ ในชวงหลายสัปดาหที่ผานมา ชัยชนะทางทหารในวันนี้ทําใหผูนําคอมมิวนิสตยอมจํานนโดยไมมีเงื่อนไขในที่สุด กองกําลังของเราจึงเริ่มเขาสูที่มั่นของพวกเขาที่ไมมีใครตานทานแลว แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.16.t: "สาธารณรัฐที่สองพายแพ"
 lar_spain.16.desc: "หลังความพายแพทางทหารหลายครั้งติดตอกัน และเห็นดินแดนที่ตนควบคุมหดเหลือเพียงเศษเสี้ยวของคาบสมุทร ผูนําทหารของสาธารณรัฐที่สองไดโคนลมรัฐบาลและขอสันติภาพ แมจะเกิดการลุกฮือของคอมมิวนิสตอีกครั้งเพื่อขัดขวางเรื่องนี้ แตกองกําลังฝายสาธารณรัฐที่เหลือก็ปราบลงได และบัดนี้ เมื่อแทบไมมีทางเลือกอื่น จึงยอมจํานนโดยไมมีเงื่อนไข\n\nแมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.17.t: "ฝายสตาลินนิสตพายแพ"
 lar_spain.17.desc: "หลังความพายแพทางทหารหลายครั้งติดตอกัน และเห็นดินแดนที่ตนควบคุมหดเหลือเพียงเศษเสี้ยวของคาบสมุทร ผูนําทหารฝายคอมมิวนิสตก็ขอสันติภาพในที่สุด แมความขัดแยงจะคลี่คลายลงมากจากผลนี้ แตการตอสูของเรากับศัตรูที่เหลืออยูยังคงดําเนินตอไป"
 lar_spain.18.t: "ฝายกบฏรอจังหวะ"
 lar_spain.18.desc: "แผนการของเราเสร็จสมบูรณ และเราอยูในตําแหนงพรอมกอรัฐประหารแลว อยางไรก็ตาม เพื่อไมใหซํ้ารอยความลมเหลวอยางนาอับอายของความพยายามรัฐประหารซันฆูรฆาดาในป 1932 เราควรรอจนกวาบรรยากาศทางการเมืองจะสุกงอมที่สุด เราจะใชทรัพยากรของเราเพื่อกลบรองรอยระหวางรอจังหวะที่เหมาะสม..."
 lar_spain.18.a: "เราไมควรรีรอนานกวานี้"
 lar_spain.18.a_tt: "จิตวิญญาณแหงชาตินี้จะถูกนําออกเมื่อสงครามกลางเมืองเริ่มขึ้น\n"
 lar_spain.19.t: "[From.GetNameDefCap]เรียกรองใหยอมสยบ"
 lar_spain.19.desc: "นักการทูต[From.GetAdjective]เรียกรองใหเราทํานโยบายตางประเทศใหอยูใตนโยบายของพวกเขา โดยอางวา[From.GetNameDef]จะ 'รับบทผูนําโลกฮิสแปนิก' ในกิจการระดับโลก"
 lar_spain.19.a: "เราตองการผูนําที่เขมแข็ง แลวทําไมจะเปนพวกเขาไมได?"
 lar_spain.19.b: "เราปกปองผลประโยชนของตัวเองไดดวยตัวเราเอง"
 lar_spain.20.t: "[From.GetNameDefCap]ยอมสยบ"
 lar_spain.20.desc: "ดวยการยืนกรานของเรา รัฐบาล[From.GetAdjective]ไดยอมรับการนําของเราในกิจการระหวางประเทศที่เกี่ยวกับโลกฮิสแปนิก"
 lar_spain.20.a: "เราจะนําพวกเขาสูความรุงโรจน"
 lar_spain.21.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรอง"
 lar_spain.21.desc: "แมเราจะยืนกราน แตรัฐบาล[From.GetAdjective]ก็ปฏิเสธการนําของเราในกิจการระหวางประเทศที่เกี่ยวกับโลกฮิสแปนิก พวกเขาจะดําเนินนโยบายตางประเทศของตนเองตอไป"
 lar_spain.21.a: "ถาเชนนั้นเราจะแสดงใหพวกเขาเห็นประโยชนของการนําของเราดวยกําลัง"
 lar_spain.22.t: "[From.GetNameDefCap]ขอความชวยเหลือ"
 lar_spain.22.desc: "รัฐบาล[From.GetAdjective]ไดสงขาวมาขอความชวยเหลือดานยุทธปจจัยในการตอสูกับฝายสาธารณรัฐ สงครามกลางเมืองกําลังสรางความเสียหายอยางหนัก และบั่นทอนเสบียงของพวกเขา พวกเขายืนยันกับเราวาความชวยเหลือใด ๆ ที่เรามอบใหจะมีคาอยางยิ่งในการเอาชนะภัยคุกคามจากคอมมิวนิสต"
 lar_spain.22.a: "เราตองชวยเหลือพวกเขาเทาที่ทําได"
 lar_spain.22.b: "ตอนนี้เราไมมีอะไรเหลือพอจะแบงให"
 lar_spain.23.t: "[From.GetNameDefCap]สงความชวยเหลือ"
 lar_spain.23.desc: "รัฐบาล[From.GetAdjective]แจงวาพวกเขาจะสงยุทธปจจัยมาสนับสนุนเราในการตอสูเพื่อสกัดกั้นคอมมิวนิสต"
 lar_spain.23.a: "เราจะจดจําความชวยเหลือของพวกเขา"
 lar_spain.24.t: "[From.GetNameDefCap]ไมสงความชวยเหลือ"
 lar_spain.24.desc: "นักการทูต[From.GetAdjective]แจงวานาเสียดายที่พวกเขาไมสามารถใหความชวยเหลือเราไดในขณะนี้"
 lar_spain.24.a: "พวกเขานั่งสบายอยูเฉย ๆ ขณะที่คอมมิวนิสตถูกสกัดดวยเลือดชาวสเปน"
 lar_spain.25.t: "กติกาสัญญาไอบีเรีย"
 lar_spain.25.desc: "ทูต[From.GetAdjective]ไดนําขอเสนอที่จะเสริมความแข็งแกรงใหการปองกันรวมกันของเรา และรักษาสันติภาพภายในคาบสมุทรไอบีเรียมาเสนอ\n\nกติกาสัญญาที่เสนอนี้จะผูกมัดใหแตละฝายตองเขารวมพันธมิตรใดก็ตามที่อีกฝายเปนสมาชิก และกําหนดใหทั้งสองฝายตองเขาขางเดียวกันในความขัดแยงใด ๆ ที่อีกฝายเขารวม ไมวาจะในฐานะผูรุกรานหรือถูกประกาศสงครามใส"
 lar_spain.25.a: "กติกาสัญญาเชนนี้จะกระชับความสัมพันธของเราอยางหาที่เปรียบมิได"
 lar_spain.25.b: "เราตองรักษาอิสรภาพในการดําเนินการของเรา"
 lar_spain.26.desc: "[From.GetNameDefCap]แจงวายอมรับกติกาสัญญาไอบีเรียที่เสนออยางเต็มใจ นับแตนี้พวกเขาจะยืนเคียงขางเราไมวาเราจะอยูในพันธมิตรหรือสงครามใด"
 lar_spain.26.a: "พวกเขาเปนมิตรแทที่ภักดีจริง ๆ"
 lar_spain.27.desc: "[From.GetNameDefCap]แจงวาปฏิเสธกติกาสัญญาไอบีเรียที่เสนอ เพราะเกรงวาจะจํากัดความสามารถในการดําเนินนโยบายตางประเทศอยางอิสระของตนมากเกินไป"
 lar_spain.27.a: "พวกเขากําลังทําใหตัวเองออนแอโดยไมรูตัว"
 lar_spain.28.t: "กติกาสัญญาไอบีเรียมีผลบังคับ"
 lar_spain.28.desc: "[iberian_pact_invitee.GetNameDefCap]ไดรับการตอนรับเขาสู[iberian_pact_invitee.GetFactionName]แลว ดังนั้น เพื่อรักษาสันติภาพในคาบสมุทรไอบีเรีย ถึงเวลาแลวที่เราตองทําตามขอตกลงในสวนของเราและเขารวมพันธมิตรนี้ดวย"
 lar_spain.28.a: "เรามีพันธะแลว"
 lar_spain.29.desc: "ถึงเวลาแลว [iberian_pact_war_target.GetNameDefCap]ไดเขาสูสงครามกับศัตรูของตน ดังนั้นตามขอกําหนดของกติกาสัญญา เราตองเขารวมกับพวกเขาและแสดงแนวรวมที่เปนหนึ่งเดียวตอโลกภายนอก"
 lar_spain.30.t: "กลุมละติน"
 lar_spain.30.desc: "เมื่อความรวมมือระหวางเราเพิ่มขึ้นอยางตอเนื่อง รัฐบาล[From.GetAdjective]จึงไดเสนอใหจัดตั้งพันธมิตรเต็มรูปแบบ ซึ่งนอกจากเราและชาวสเปนแลว อาจรวมถึงชาวอิตาลีและชาวฝรั่งเศสดวย"
 lar_spain.30.a: "ชางเปนความคิดที่ยอดเยี่ยม"
 lar_spain.30.b: "การเปนพันธมิตรกับประเทศเหลานี้ไมเปนประโยชนตอเราที่สุดในตอนนี้"
 lar_spain.31.desc: "รัฐบาล[From.GetAdjective]แจงวายอมรับขอเสนอของเราในการจัดตั้งกลุมละติน"
 lar_spain.31.a: "พวกเขาจะเปนสมาชิกที่มีคายิ่งของพันธมิตรที่เพิ่งกอตั้งนี้"
 lar_spain.32.desc: "รัฐบาล[From.GetAdjective]แจงวาไมสนใจเขารวมพันธมิตรละตินในขณะนี้"
 lar_spain.32.a: "บางทีพวกเขาอาจเปลี่ยนใจในภายหลัง"
 lar_spain.33.t: "อูนิออนมิลิตารเอสปญญอลา"
 lar_spain.33.desc: "อุดมการณคารลิสตยังคงมีพันธมิตรอยูในกองทัพ การประสานงานกับพวกเขาและไดรับความชวยเหลือจะชวยใหการลุกฮือของเราประสบความสําเร็จไดมาก"
 lar_spain.33.a: "หาพันธมิตรจากอูนิออนมิลิตารใน[union_militar_target_state_1.GetName]"
 lar_spain.33.b: "หาพันธมิตรจากอูนิออนมิลิตารใน[union_militar_target_state_2.GetName]"
 lar_spain.33.c: "หาพันธมิตรจากอูนิออนมิลิตารใน[union_militar_target_state_3.GetName]"
 lar_spain.33_tt: "จะสรางหนวยเรเกเตคารลิสตที่ฝกมาอยางดี 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน เมื่อการลุกฮือของฝายคารลิสตเริ่มขึ้น\n"
 lar_spain.34.t: "ปญหาการสืบราชสันตติวงศ"
 lar_spain.34.desc: "เมื่ออัลฟอนโซ การโลสผูไรทายาทสิ้นพระชนม สายราชสกุลคารลิสตก็สิ้นสุดลง และสงผลใหเกิดความแตกแยกขึ้นในขบวนการคารลิสต\n\nมีผูที่สนับสนุนการอางสิทธิ์ของผูสืบทอดที่อัลฟอนโซ การโลสแตงตั้งเอง คือซาเวียรแหงบูรบง-ปารมา แตพระองคไมมีสิทธิ์ในราชบัลลังกตามสายราชวงศ ขณะที่อีกฝายตองการสนับสนุนการอางสิทธิ์ของพระเจาอัลฟอนโซที่ 13 ผูลี้ภัย ซึ่งแมจะเปนทายาทของสายผูทรยศที่สืบเชื้อสายมาจากพระนางอิซาเบลที่ 2 แตก็มีสิทธิ์ในราชบัลลังกตามสายราชวงศ\n\nหากปญหานี้ไมไดรับการจัดการอยางรวดเร็ว ก็อาจทําใหฐานสนับสนุนของเราแตกออกเปนหลายฝกฝายที่ทะเลาะเบาะแวงกัน"
 lar_spain.34.a: "พระประสงคของกษัตริยตองเปนไป ซาเวียรจะเปนกษัตริยองคใหมของเรา!"
 lar_spain.34.a_tt: "ซาเวียรแหงบูรบง-ปารมาจะขึ้นครองราชยเมื่อมีการฟนฟูระบอบกษัตริย\n"
 lar_spain.34.b: "ตองรักษาความตอเนื่องของราชวงศ อัลฟอนโซที่ 13 จะเปนกษัตริยของเรา!"
 lar_spain.34.b_tt: "อัลฟอนโซที่ 13 จะขึ้นครองราชยเมื่อมีการฟนฟูระบอบกษัตริย\n"
 lar_spain.34.c: "ผูอางสิทธิ์จากราชวงศฮาพสบวรคไดพิสูจนแลววาคูควร"
 lar_spain.34.c_tt: "คารล ปอุส ฟอน ฮาพสบวรค จะขึ้นครองราชยเมื่อมีการฟนฟูระบอบกษัตริย\n"
 SPB_karl_pius_king: "คารล ปอุส ฟอน ฮาพสบวรค"
 lar_spain.35.t: "การฟนฟูระบอบกษัตริย"
 lar_spain.35.desc: "หลังจากไรกษัตริยมากวาครึ่งทศวรรษ ความปติยินดีของฝูงชนที่มาตอนรับในมาดริดก็ยากจะเก็บกลั้นไวได เมื่อ[From.GetSPBkingloc]เสด็จเขาสูเมืองเมื่อเชานี้ ทามกลางเสียงโหรองของผูชมที่ปลาบปลื้ม ขบวนเสด็จไดเคลื่อนผานถนนในมาดริดไปยังโบสถซานเฮโรนิโมเอลเรอัล\n\nในพิธีอันยิ่งใหญ [From.GetSPBking2loc]\n\nแมประเทศสวนใหญยังคงอยูในซากปรักหักพัง แตบางทีกษัตริยองคใหมอาจเปนพลังแหงการรวมใจและเยียวยา และนําพา[From.GetNameDef]สูอนาคตที่รุงโรจนยิ่งขึ้น"
 SPB_xavier_king: "ซาเวียรแหงบูรบง-ปารมา"
 SPB_alfonso_king: "อัลฟอนโซที่ 13"
 SPB_xavier_king2: "ซาเวียรทรงรับมงกุฎและพระนามาภิไธยวาพระเจาฆาเบียรที่ 1 ในที่สุดก็ไดทายาทแหงสายคารลิสตอันชอบธรรมขึ้นครองบัลลังกสเปน"
 SPB_alfonso_king2: "พระเจาอัลฟอนโซที่ 13 หลังลี้ภัยอยูหลายป ไดเสด็จกลับคืนสูบัลลังกสเปน ยุติการนองเลือดนับศตวรรษดวยการรวมสองสายการสืบราชสันตติวงศเขาดวยกันในที่สุด"
 lar_spain.35.a: "วันนี้ความอยุติธรรมนับศตวรรษไดรับการแกไขแลว ทรงพระเจริญ!"
 lar_spain.36.t: "การยึดครองแทนเจียร"
 lar_spain.36.desc: "ดวยการเพิกเฉยอยางโจงแจงตอพิธีสารแทนเจียรป 1924 ทหาร[From.GetAdjective]ไดเขาสูเขตนานาชาติแทนเจียรในลักษณะที่เรียกไดเพียงวาเปนกองกําลังยึดครอง แมชาตินิยมชาวสเปนจะเรียกรองใหผนวกดินแดนนี้โดยตรง แตเอกอัครราชทูต[From.GetAdjective]ยืนยันกับเราวานี่เปนเพียง 'มาตรการชั่วคราวในยามสงคราม' และเมืองนี้จะกลับคืนสูสถานะกอนสงครามในภายหลัง"
 lar_spain.36.a: "ถาเราไมลุกขึ้นปกปองสิทธิของชาวแทนเจียร แลวใครจะทํา?"
 lar_spain.36_tt: "หาก§Y[SPA.GetName]§!ไมยอมถอย เราจะไดรับ:\n"
 lar_spain.36.b: "คําสัญญาของพวกเขาก็พอแลวสําหรับตอนนี้"
 lar_spain.37.desc: "[FROM.GetNameDefCap]ไดยื่นคัดคานอยางเปนทางการและเด็ดขาดตอการยึดครองแทนเจียรของเรา พวกเขาถือวาการกระทําของเราผิดกฎหมาย และถึงกับบอกเปนนัยวาจะใชกําลังทหารขับไลเราออกจากเขตนานาชาติหากเราไมถอนตัวทันที"
 lar_spain.37.a: "เราจะไมหวาดกลัวคําขูลม ๆ แลง ๆ ของพวกเขา"
 lar_spain.37.b: "ถาเชนนั้นเราตองถอย"
 lar_spain.38.desc: "ตามคาด รัฐบาล[From.GetAdjective]ที่ออนแอไมกลาทาทายการยึดครองแทนเจียรของเรา เรามีอิสระที่จะผนวกเมืองนี้เขากับชาติของเราอยางสมบูรณยิ่งขึ้น"
 lar_spain.38.a: "กลับมาเปนของสเปนอีกครั้ง!"
 lar_spain.39.t: "[From.GetNameDefCap]เรียกรองแอฟริกาเหนือ"
 lar_spain.39.desc: "นักการทูต[From.GetAdjective]ไดยื่นคําขาดตอเรา เรียกรองใหเราสละการควบคุมแอฟริกาเหนือใหแก[From.GetNameDef]ทันที ไมตองสงสัยเลยวาพวกเขาตั้งใจฉวยโอกาสจากความออนแอของสถานะระหวางประเทศของเราในขณะนี้..."
 lar_spain.39.a: "เราไมอาจรับมือกับสงครามอีกครั้งได เราตองยอมรับ"
 lar_spain.39.b: "พวกเขาจะไมไดมันไปงาย ๆ!"
 lar_spain.40.t: "[From.GetNameDefCap]ยอมรับขอเรียกรอง"
 lar_spain.40.desc: "[From.GetNameDefCap]ไดยอมรับขอเรียกรองของเรา และนักการทูตของพวกเขายืนยันวากําลังเตรียมการโอนการควบคุมแอฟริกาเหนือในทันที"
 lar_spain.40.a: "มีประสิทธิภาพมาก"
 lar_spain.41.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรอง"
 lar_spain.41.desc: "นักการทูต[From.GetAdjective]แจงเราวาพวกเขาปฏิเสธขอเรียกรองทั้งหมดของสเปนตอแอฟริกาเหนืออยางเด็ดขาด"
 lar_spain.41.a: "ถาเชนนั้นเราคงตองยึดมาดวยกําลัง"
 lar_spain.42.t: "[From.GetNameDefCap]อางสิทธิ์ในราชบัลลังกฝรั่งเศส"
 lar_spain.42.desc: "หลังเพิ่งขึ้นครองบัลลังกสเปน พระเจา[From.GetLeader]ก็ไดแสดงความทะเยอทะยานตอราชบัลลังกฝรั่งเศสอยางชัดเจน โดยยกการอางสิทธิ์ตามแนวทางลัทธิเลจิทิมิสตในมงกุฎเปนพื้นฐาน\n\nดวยชัยชนะทางการเมืองครั้งลาสุดของฝายเลจิทิมิสตในประเทศของเรา บัดนี้กษัตริยทรงเห็นสมควรที่จะลงมือตามความทะเยอทะยานนี้ในที่สุด และไดประกาศอยางเปนทางการถึงพระประสงคที่จะเขาพิธีราชาภิเษกที่แร็งสโดยเร็วที่สุด"
 lar_spain.42.a: "พระองคมีสิทธิ์อันชอบธรรม เรายินดียอมรับ ทรงพระเจริญ!"
 lar_spain.42.b: "ฝรั่งเศสจะไมมีวันยอมอยูใตสเปน!"
 lar_spain.43.t: "[From.GetNameDefCap]รับรองการอางสิทธิ์"
 lar_spain.43.desc: "รัฐบาลเลจิทิมิสต[From.GetAdjective]ไดรับทราบคําขอของพระเจา[Root.GetLeader] และไดแจงเราอยางเปนทางการวายอมรับสิทธิ์อันชอบธรรมของพระองคในมงกุฎฝรั่งเศส พวกเขายืนยันวาจะเตรียมการจัดพิธีราชาภิเษกโดยทันที"
 lar_spain.43.a: "ทุกสิ่งเปนไปตามที่ควรจะเปน"
 lar_spain.43_tt: "การเตรียมพิธีราชาภิเษกจะเริ่มขึ้น"
 lar_spain.44.t: "[From.GetNameDefCap]ปฏิเสธการอางสิทธิ์"
 lar_spain.44.desc: "แมพระเจา[Root.GetLeader]จะมีสิทธิ์อันชอบธรรมในมงกุฎฝรั่งเศส แตดูเหมือนรัฐบาล[From.GetAdjective]จะเกิดใจฝอในนาทีสุดทาย โดยอางความกังวลตอความไมสงบของประชาชนที่อาจมองวาสเปนเขาควบคุมฝรั่งเศส พวกเขาจึง 'ขอปฏิเสธดวยความเสียใจ' ตอพิธีราชาภิเษกอยางเปนทางการ"
 lar_spain.44.a: "ไมวาอยางไร[Root.GetLeader]ก็จะเปนกษัตริยแหงฝรั่งเศส"
 lar_spain.45.t: "สหภาพไอบีเรีย"
 lar_spain.45.desc: "เชนเดียวกับชวงป 1580 ถึง 1640 [From.GetNameDef]เสนอใหรวมสองชาติของเราภายใต[From.GetLeader] นักการทูต[From.GetAdjective]เรงเราใหเราพิจารณาถึงพลังที่ไอบีเรียที่เปนหนึ่งเดียวภายใตผูนําคนเดียวจะแสดงตอโลกได"
 lar_spain.45.a: "พวกเขาพูดอยางชาญฉลาด"
 lar_spain.45.b: "โปรตุเกสจะไมมีวันยอมใหชาวสเปนปกครองโดยเต็มใจ!"
 lar_spain.46.t: "สหภาพไอบีเรีย - [From.GetNameDefCap]ยอมรับ"
 lar_spain.46.desc: "[From.GetNameDefCap]ไดยอมรับขอเสนอของเราในการรวมไอบีเรียภายใตการนําของ[Root.GetLeader] พวกเขาจะเตรียมการที่จําเปนเพื่อเริ่มผนวกกลไกรัฐบาลของตนเขากับของเรา"
 lar_spain.46.a: "พวกเขาเลือกไดอยางชาญฉลาด เมื่อรวมกันเราก็แข็งแกรงยิ่งขึ้น!"
 lar_spain.47.t: "สหภาพไอบีเรีย - [From.GetNameDefCap]ปฏิเสธ"
 lar_spain.47.desc: "[From.GetNameDefCap]ไดปฏิเสธทุกความคิดที่จะรวมคาบสมุทรไอบีเรียภายใตการนํารวมกัน แมจะเจรจากันอยางยืดเยื้อ แตจุดยืนของคณะผูแทน[From.GetAdjective]สรุปไดงาย ๆ วา "แนจริงก็มาเอาไปสิ""
 lar_spain.47.a: "ขอเสนอของพวกเขายอมรับได"
 lar_spain.48.t: "ลัทธิอนาธิปไตยโปรตุเกส"
 lar_spain.48.desc: "ในชวงหลายวันที่ผานมา การสูรบใน[From.GetNameDef]ไดลุกลามเขาสูภูมิภาคชายแดน[Root.GetAdjective] และกองกําลังอาสาฝายอนาธิปไตย[From.GetAdjective]ก็เริ่มดึงดูดผูมีแนวคิดเดียวกันจากเมืองในทองถิ่นอยางรวดเร็ว แมกองกําลังชายแดนของเราจะลงมืออยางฉับไว แตความรุนแรงของการสูรบก็ทําใหพวกเขาไมทันตั้งตัว และหลังการปะทะในชวงแรกกับกองกําลัง[From.GetAdjective]ที่ผานการรบมาจากทั้งสองฝายของสงครามกลางเมือง พวกเขาก็ถูกบีบใหตองถอย\n\nในวันตอ ๆ มา การสนับสนุนอุดมการณอนาธิปไตย[From.GetAdjective]ไดแพรกระจายไปทั่วสังคม[Root.GetAdjective] ซึ่งเห็นไดชัดวาเปนผลอยางมากจากการสนับสนุนอยางลับ ๆ จากตางชาติ\n\nผลที่ตามมาคือ แมเราจะพยายามอยางเต็มที่ ประเทศก็ถูกดึงเขาไปพัวพันกับสงครามกลางเมือง[From.GetAdjective]ที่ใหญกวาโดยปริยาย"
 lar_spain.48.a: "ทําไมพวกเขาตองลากเราเขาไปเกี่ยวดวย?!"
 lar_spain.49.desc: "นับตั้งแตการสูรบ[Root.GetAdjective]ลุกลามขามพรมแดน[From.GetAdjective] ผูสนับสนุนฝายอนาธิปไตยในทองถิ่นก็หลั่งไหลมาเขารวมอุดมการณของเรา ดวย 'การกระตุน' ที่วางแผนและดําเนินการมาอยางดี กระแสสนับสนุนอนาธิปไตยไดลุกลามราวไฟลามทุงในหมูคนรุนใหมของสังคม[From.GetAdjective]\n\nผลจากการสงคลังอาวุธ[Root.GetAdjective]ใหแกหนวยลับอนาธิปไตย[From.GetAdjective]เหลานี้ สถานการณใน[From.GetNameDef]ไดบานปลายจนรัฐบาลตองปราบปรามการลุกฮือเต็มรูปแบบ บัดนี้ผูนําการลุกฮือไดขอความชวยเหลือที่เปนทางการและโดยตรงมากขึ้นจากเรา โดยเสนอใหเรารับบทผูนําในการตอสูของฝายอนาธิปไตยทั่วโลก และเสนอวาพวกเขาจะเขารวมกับเราอยางเปนทางการมากขึ้นเมื่อการสูรบสงบลง"
 lar_spain.49.a: "เรายินดีตอนรับการสนับสนุนอุดมการณอนาธิปไตยจากพวกเขา!"
 lar_spain.50.t: "ลัทธิอนาธิปไตยโปรตุเกส - สงครามกลางเมืองสิ้นสุด"
 lar_spain.50.desc: "เมื่อการตอสูของฝายอนาธิปไตยในสวนของ[From.GetAdjective]จบลงอยางนาพอใจ บัดนี้หนวยลับ[From.GetAdjective]จึงขอเขารวมกับสภาปองกัน"
 lar_spain.50.a: "เราจะรับพวกเขาไวใตการคุมครองของเรา"
 lar_spain.51.t: "ยายทุนสํารองทองคํา"
 lar_spain.51.desc: "ทุนสํารองทองคําของชาติเรากําลังถูกคุกคามจากการรุกของฝายชาตินิยม เราควรลงมือและขนยายทุนสํารองไปตางประเทศอยางปลอดภัย เพื่อไมใหตกอยูในมือศัตรู"
 lar_spain.51.a: "เราจะขนสงไปยัง[SOV.GetNameDef]"
 lar_spain.51.b: "เราจะขนสงไปยัง[SPR_relocated_gold_reserves_selection_1.GetNameDefCap]"
 lar_spain.51.c: "เราจะขนสงไปยัง[SPR_relocated_gold_reserves_selection_2.GetNameDefCap]"
 lar_spain.51.d: "เราจะขนสงไปยัง[SPR_relocated_gold_reserves_selection_3.GetNameDefCap]"
 lar_spain.52.t: "[From.GetNameDefCap]ยายทุนสํารองทองคํา"
 lar_spain.52.desc: "การขนสงจาก[From.GetNameDef]เริ่มทยอยมาถึงประเทศของเรา เนื่องจากรัฐบาล[From.GetAdjective]กําลังยายทุนสํารองทองคําไปตางประเทศเพื่อเก็บรักษาไวอยางปลอดภัยตลอดชวงสงครามกลางเมือง"
 lar_spain.52.a: "บางทีนี่อาจเปนโอกาส..."
 lar_spain.53.t: "ทุนสํารองทองคําของสเปน"
 lar_spain.53.desc: "ผานมาระยะหนึ่งแลวนับตั้งแตทุนสํารองทองคํา[SPR.GetAdjective]มาถึงประเทศของเรา และเราก็ยังคงสงความชวยเหลือจํานวนมากให[SPR.GetNameDef]โดยไมไดรับคาตอบแทน สมาชิกรัฐบาลเริ่มวิพากษวิจารณถึงสภาพการณอันนาขันนี้"
 lar_spain.53.a: "เราจะยึดทุนสํารองทองคําเปน 'คาตอบแทน'"
 lar_spain.53.b: "ชัยชนะของ[SPR.GetAdjective]ก็เปนคาตอบแทนที่เพียงพอแลว"
 lar_spain.54.t: "ทุนสํารองทองคําถูกยึด!"
 lar_spain.54.desc: "นักการทูตของเราใน[From.GetNameDef]แจงวารัฐบาล[From.GetAdjective]ไดยึดทุนสํารองทองคําของเราไปแลว! วากันวาพวกเขาไมเห็นวาจําเปนตองออกแถลงการณอยางเปนทางการดวยซํ้า โดยระบุวานี่เปน 'เรื่องปกติ' ในการรับ 'คาตอบแทนที่คางชําระ' สําหรับความชวยเหลือดานยุทธปจจัยของพวกเขา"
 lar_spain.54.a: "พวกเขากลาดียังไง?!"
 lar_spain.54.a_tt: "§Rเรื่องนี้จะสงผลตอเศรษฐกิจของเราหลังสงครามกลางเมือง!§!\n"
 lar_spain.55.t: "รัฐบาลขาดแคลนงบประมาณ"
 lar_spain.55.desc: "เมื่อทุนสํารองทองคําของเราถูกยึด บัดนี้เราจึงขาดแคลนทองคําแทงที่จะใชเปนทุนในการฟนฟูประเทศอยางเรงดวน การลงทุนในภาครัฐจึงตองเลื่อนออกไปอยางนาเสียดาย"
 lar_spain.55.a: "นาเสียดาย..."
 lar_spain.56.t: "[From.GetNameDefCap]รองขออํานาจปกครองตนเอง"
 lar_spain.56.desc: "แมจะกระตือรือรนที่จะพิสูจนความภักดีและทําหนาที่ของตนเพื่อการปฏิวัติตอไป แตผูแทน[From.GetAdjective]ก็ไดรองขอใหเพิ่มอํานาจปกครองตนเอง พวกเขาใหเหตุผลวาหากเราผอนบังเหียนลงบาง พวกเขาจะชวยเหลืออุดมการณของเราไดดียิ่งขึ้นมาก"
 lar_spain.56.a: "พวกเขาสมควรไดรับความไววางใจจากเรา"
 lar_spain.56.b: "แตการกุมบังเหียนไวแนน ๆ ดีกวา"
 lar_spain.57.t: "[From.GetNameDefCap]ใหอํานาจปกครองตนเอง"
 lar_spain.57.desc: "ผูแทนของเราใน[From.GetNameDef]แจงวารัฐบาล[From.GetAdjective]เห็นสมควรใหอํานาจปกครองตนเองแกเรามากขึ้น"
 lar_spain.57.a: "กาวหนา!"
 lar_spain.58.t: "[From.GetNameDefCap]ปฏิเสธอํานาจปกครองตนเอง"
 lar_spain.58.desc: "ผูแทนของเราใน[From.GetNameDefCap]แจงวารัฐบาล[From.GetAdjective]ไดปฏิเสธคํารองขอเพิ่มอํานาจปกครองตนเองของเรา"
 lar_spain.58.a: "พวกเขาไมไวใจเราหรือ?"
 lar_spain.59.t: "ไอบีเรียแดง"
 lar_spain.59.desc: "ดวยเห็นถึงผลประโยชนทางอุดมการณรวมกัน [From.GetNameDefCap]ไดสงทูตมาพรอมขอเสนอใหรวมไอบีเรียเปนหนึ่งเดียว พวกเขาเสนอวาหากเราละทิ้งความแตกตางและรวมมือกันภายใตการนําของ[From.GetAdjective] เราจะสามารถรับประกันความสําเร็จของการปฏิวัติไอบีเรียไดดียิ่งขึ้น"
 lar_spain.59.a: "อุดมการณของชนชั้นแรงงานจะแข็งแกรงขึ้นอยางมาก!"
 lar_spain.59.b: "เราเผยแพรการปฏิวัติไดดีกวาดวยตัวเราเอง"
 lar_spain.60.t: "ไอบีเรียแดง - [From.GetNameDefCap]ยอมรับ"
 lar_spain.60.desc: "[From.GetNameDefCap]ไดตอบรับการทาบทามของเราดวยความเห็นชอบ พวกเขาเห็นดวยกับแนวคิดไอบีเรียสังคมนิยมที่เปนหนึ่งเดียว"
 lar_spain.60.a: "เมื่อรวมกันเราก็แข็งแกรงยิ่งขึ้น"
 lar_spain.61.t: "ไอบีเรียแดง - [From.GetNameDefCap]ปฏิเสธ"
 lar_spain.61.desc: "[From.GetNameDefCap]ไดปฏิเสธขอเสนอไอบีเรียสังคมนิยมที่เปนหนึ่งเดียวของเราอยางตรงไปตรงมา แมจะเห็นดวยวาเรามีผลประโยชนรวมกันหลายประการ แตพวกเขาใหเหตุผลวาเราจะแสวงหาผลประโยชนเหลานี้ไดดีกวาในฐานะสองชาติที่เปนอิสระ"
 lar_spain.61.a: "พวกเขายังไมรูวาตัวเองคิดผิดแคไหน"
 lar_spain.62.t: "การลุกฮือของคอมมิวนิสต!"
 lar_spain.62.desc: "การแทรกแซงอยางไมหยุดหยอนของ[From.GetAdjective] และหนวยใตดินที่ไดรับการสนับสนุนอยางผิดกฎหมายจาก[From.GetNameDef] ไดทําใหกลุมคอมมิวนิสตในทองถิ่นที่เราตอสูมานานหลายปฮึกเหิมขึ้นในชวงหลายเดือนที่ผานมา กลุมเหลานี้ซึ่งคงไดรับสัญญาวาจะไดความชวยเหลือจากตางชาติเพิ่มเติมอยางไมตองสงสัย บัดนี้ไดจับอาวุธขึ้นสู และมีกลุมทหารที่ไมภักดีเขารวมในการลุกฮือครั้งใหญ โดยมุงยึดอํานาจรัฐบาลดวยกําลัง"
 lar_spain.62.a: "เราจะบดขยี้การกบฏครั้งนี้!"
 lar_spain.63.t: "การลุกฮือของคอมมิวนิสตใน[From.GetNameDefCap]!"
 lar_spain.63.desc: "ตามคาด ดวยการสนับสนุนดานยุทธปจจัยที่วางไวอยางเหมาะเจาะ กลุมคอมมิวนิสตที่สรางปญหาใหรัฐบาล[From.GetAdjective]มาระยะหนึ่งไดฮึกเหิมจนลงมือแลว การลุกฮือครั้งใหญมุงยึดอํานาจรัฐบาล แตตองพึ่งพาการสนับสนุนจากเราอยางมาก ผูนําของการลุกฮือแมจะมีอุดมคติและกระตือรือรน แตก็มีประสบการณนอยในการทําสงครามกลางเมือง และบัดนี้ไดหันมาพึ่งการนําและความชวยเหลือจากเรา"
 lar_spain.63.a: "และพวกเขาจะไดรับมัน!"
 lar_spain.64.t: "[From.GetNameDefCap]ขอความชวยเหลือ"
 lar_spain.64.desc: "แมสถานการณการเมืองใน[From.GetNameDef]จะไมมั่นคงมานาน แตดูเหมือนความรุนแรงของความขัดแยงจะทําใหรัฐบาล[From.GetAdjective]ไมทันตั้งตัว พวกเขาขอความชวยเหลือใด ๆ ที่เราจะระดมไดเพื่อชวยในการตอสูกับลัทธิฟาสซิสต และเรงเราใหเราอยารีรอนานเกินไปในชวงเวลาวิกฤตนี้\n\nเปนที่นาสงสัยวารัฐบาลสาธารณรัฐจะชนะสงครามกลางเมืองครั้งนี้ไดโดยไมมีความชวยเหลือจากภายนอก และแมชัยชนะของสเปนประชาธิปไตยจะเปนผลลัพธที่พึงปรารถนา แตการใหความชวยเหลือนี้ก็นาจะเปนการใหกําลังใจแกผูฝกใฝคอมมิวนิสตในประเทศของเราเอง"
 lar_spain.64.a: "พวกเขาพึ่งพาเรา และเราตองชวยแมจะตองเสี่ยงเอง"
 lar_spain.64.b: "เราไมอาจเสี่ยงเสถียรภาพทางการเมืองของตัวเองเพื่อชวยพวกเขา"
 lar_spain.65.t: "[From.GetNameDefCap]ใหความชวยเหลือ"
 lar_spain.65.desc: "รัฐบาล[From.GetAdjective]แจงวาจะสงความชวยเหลือเชิงสัญลักษณชุดแรกมาใหเรา แมจะสําคัญตอการเสริมขวัญกําลังใจ แตผลดานยุทธปจจัยจริงก็แทบไมมีเลย อยางไรก็ตาม ฝรั่งเศสยืนยันวากําลังพิจารณาทางเลือกในการใหความชวยเหลือที่เปนรูปธรรมมากขึ้นในอนาคต"
 lar_spain.65.a: "นี่เปนขาวที่ยอดเยี่ยม!"
 lar_spain.66.t: "[From.GetNameDefCap]ปฏิเสธคําขอ"
 lar_spain.66.desc: "ฝรั่งเศสแจงวานาเสียดายที่พวกเขาไมสามารถสงความชวยเหลือมาใหเราได เพราะจะเปนการเสี่ยงตอเสถียรภาพทางการเมืองภายในประเทศของพวกเขา"
 lar_spain.66.a: "แลวพวกเขาคิดวาการมีพรมแดนติดกับพวกฟาสซิสตอีกดานจะไมเสี่ยงหรือ?"
 lar_spain.67.t: "สงครามประกาศเอกราช[From.GetAdjective]!"
 lar_spain.67.desc: "ดูเหมือนรัฐบาล[From.GetAdjective]จะลืมไปอยางรวดเร็ววาชัยชนะในสงครามกลางเมืองเมื่อเร็ว ๆ นี้เปนเพราะใคร เมื่อเชานี้ การติดตอสื่อสารทั้งหมดกับผูแทนของเราใน[From.GetNameDef]ถูกตัดขาดอยางกะทันหัน และสื่อของรัฐก็ออกอากาศประกาศจาก[From.GetLeader] ซึ่งพนโฆษณาชวนเชื่อเพื่อปลุกระดมชาว[From.GetAdjective]ใหรวมทําสงครามอีกครั้งอยางเห็นไดชัด\n\nคําประกาศเอกราชอยางเปนทางการไดถูกสงมาถึงมอสโกในชวงสายของเชาวันนี้"
 lar_spain.67.a: "เราจะบดขยี้ความดื้อรั้นนี้!"
 lar_spain.67.b: "เราไมมีทางเลือกนอกจากยอมรับ"
 lar_spain.68.t: "[From.GetNameDefCap]ขอความชวยเหลือ"
 lar_spain.68.desc: "[From.GetNameDefCap]ไดติดตอมาขอความชวยเหลือดานยุทธปจจัยในสงครามประกาศเอกราชกับ[SOV.GetNameDef]"
 lar_spain.68.a: "และพวกเขาจะไดรับมัน"
 lar_spain.68.b: "เราไมอาจเสี่ยงความสัมพันธกับโซเวียต"
 lar_spain.69.t: "[From.GetNameDefCap]ใหความชวยเหลือ"
 lar_spain.69.desc: "[From.GetNameDefCap]ไดรับทราบคํารองขอความชวยเหลือของเรา และบัดนี้ไดเสนอใหเราเขารวมโครงการชวยเหลือแบบใหยืม-เชาของพวกเขาอยางกวางขวางยิ่งขึ้น"
 lar_spain.69.a: "นี่เปนขาวดีมาก"
 lar_spain.70.t: "[From.GetNameDefCap]ปฏิเสธการชวยเหลือ"
 lar_spain.70.desc: "[From.GetNameDefCap]แจงวาในขณะนี้พวกเขาไมสามารถใหความชวยเหลือเราได สวนใหญเปนเพราะเกรงผลกระทบตอความคิดเห็นของสาธารณชนทั้งในและตางประเทศ หากถูกมองวาชวยเหลืออุดมการณของเรา"
 lar_spain.70.a: "พวกเขาทอดทิ้งเราเปนครั้งที่สอง"
 lar_spain.71.t: "[From.GetNameDefCap]ขอทําสนธิสัญญาไมรุกราน"
 lar_spain.71.desc: "ในเมื่อเราทั้งคูตางทําสงครามกับคอมมิวนิสต [From.GetNameDefCap]จึงเสนอใหทําสนธิสัญญาไมรุกราน ซึ่งจะชวยใหเรามุงความสนใจไปที่ภัยคุกคามแดงที่เรงดวนกวา โดยมองขามความแตกตางของเราไปกอน"
 lar_spain.71.a: "เมื่อเทียบกับการกําจัด[SOV.GetNameDef]แลว เรื่องอื่นลวนเปนรอง"
 lar_spain.71.b: "สนธิสัญญากับฝายสาธารณรัฐงั้นหรือ? ไมมีวัน!"
 lar_spain.72.t: "[From.GetNameDefCap]ยอมทําสนธิสัญญาไมรุกราน"
 lar_spain.72.desc: "รัฐบาล[From.GetAdjective]ตกลงตามขอเสนอสนธิสัญญาไมรุกรานของเราอยางชาญฉลาด สนธิสัญญาจะมีผลทันที"
 lar_spain.72.a: "พวกเขาตระหนักถึงภัยที่ใหญกวา"
 lar_spain.73.t: "[From.GetNameDefCap]ปฏิเสธสนธิสัญญาไมรุกราน"
 lar_spain.73.desc: "[From.GetNameDefCap]ไดรับทราบขอเสนอสนธิสัญญาไมรุกรานของเรา แตแจงวาพวกเขาไมเห็นวาเรื่องนี้เปนประโยชนสูงสุดตอตนในขณะนี้"
 lar_spain.73.a: "พวกเขากําลังวางแผนอะไรอยู?"
 lar_spain.74.t: "[From.GetNameDefCap]ขอความชวยเหลือ"
 lar_spain.74.desc: "ฝาย[From.GetAdjective]ไดขอความชวยเหลือจากเราในสงครามกับ[SOV.GetNameDef] พวกเขายืนยันวาไมไดตองการอะไรมาก เพียงแคแบงปนขาวกรองสําคัญบางสวน หรือชวยฝกฝายเสนาธิการใหรับมือกับยุทธวิธี[SOV.GetAdjective]ไดดีขึ้น ก็มีคาอยางยิ่งแลว"
 lar_spain.74.a: "ความคิดที่ยอดเยี่ยม โซเวียตจงพินาศ!"
 lar_spain.74.b: "เราตองหวงแหนความไดเปรียบของเราไว"
 lar_spain.75.t: "[From.GetNameDefCap]ใหความชวยเหลือ"
 lar_spain.75.desc: "หลังพิจารณาคําขอของเรา [From.GetNameDef]ไดเสนอสงผูเชี่ยวชาญทางทหารมาฝกฝายเสนาธิการของเราใหรับมือกับยุทธศาสตร[SOV.GetAdjective]ที่พวกเขาเคยเผชิญไดดีขึ้น พรอมทั้งมอบขาวกรองอันมีคาบางสวนใหแกเรา"
 lar_spain.75.a: "สิ่งนี้จะมีคาอยางยิ่งในการตอสูกับโซเวียตของเรา"
 lar_spain.76.t: "[From.GetNameDefCap]ปฏิเสธการชวยเหลือ"
 lar_spain.76.desc: "แมเราจะรองขอ แต[From.GetNameDef]ก็ปฏิเสธที่จะใหความชวยเหลือใด ๆ ในการตอสูกับโซเวียตของเรา ทุกความพยายามที่จะขอขอมูลที่เปนประโยชนเกี่ยวกับแนวรบโซเวียตจากพวกเขาก็พบเพียงกําแพงแหงความเงียบ"
 lar_spain.76.a: "พวกเขาหวงแหนความลับทั้งหมดของตนไว"
 lar_spain.77.t: "พระเจาอัลฟอนโซที่ 13 สวรรคต"
 lar_spain.77.desc1: "พระเจาอัลฟอนโซที่ 13 กษัตริยพระองคสุดทายที่ปกครองสเปน ซึ่งประทับลี้ภัยมาตั้งแตการสถาปนาสาธารณรัฐที่สองในป 1931 ไดสวรรคตที่กรุงโรมเมื่อชวงเชาวันนี้ ดวยพระอาการประชวรทางพระหทัยในพระชนมายุที่คอนขางนอย และดวยสถานะผูลี้ภัยของพระองครวมถึงสถานการณปจจุบันใน[Root.GetNameDef] คาดวาพระองคจะถูกฝงพระศพที่กรุงโรมนั่นเอง\n\nแมพระราชโอรสองคแรกและองคที่สองของพระเจาอัลฟอนโซจะสละสิทธิ์ในราชบัลลังกไปแลวตั้งแตป 1933 ซึ่งดูเหมือนวาพระราชโอรสองคที่สาม อินฟนเตฮวน จะเปนรัชทายาท แตก็มีขาวลือวาพระราชโอรสองคที่สองของกษัตริยผูลวงลับ อินฟนเตไฮเม กําลังพิจารณายืนยันสิทธิ์ในการสืบราชสันตติวงศของพระองคอีกครั้ง"
 lar_spain.77.desc2: "เมื่อชวงเชาวันนี้ พระเจาอัลฟอนโซที่ 13 ไดสวรรคตอยางกะทันหันที่กรุงมาดริด หลังทรงมีอาการเจ็บพระอุระอยางรุนแรง พระบรมศพจะไดรับการประดิษฐานในโบสถซานเฮโรนิโมเอลเรอัลในมาดริดในไมชา เพื่อใหมหาชนไดถวายสักการะกอนพระราชพิธีฝงพระบรมศพ\n\nแมกอนหนานี้จะทรงสละสิทธิ์ในการสืบราชสันตติวงศไปเนื่องจากพระกรรณหนวก แตพระราชโอรสองคที่สองของกษัตริย อินฟนเตไฮเม ก็รีบยืนยันสิทธิ์ในราชบัลลังกของพระองคอีกครั้งภายในไมกี่ชั่วโมงหลังพระราชบิดาสวรรคต ดวยแรงสนับสนุนอยางทวมทนจากฝายคารลิสต พระอนุชา อินฟนเตฮวน จึงไมนาจะโตแยงการอางสิทธิ์นี้ได"
 lar_spain.77.a: "กษัตริยสวรรคตแลว ขอกษัตริยทรงพระเจริญ!"
 lar_spain.78.t: "ซันฆูรโฆเสียชีวิต"
 lar_spain.78.desc: "เพียงไมกี่วันหลังสงครามกลางเมืองเริ่มขึ้น ฝายเราก็ตองประสบโศกนาฏกรรม เมื่อโฆเซ ซันฆูรโฆ ผูนําที่ไดรับเลือกของรัฐประหาร เสียชีวิตในอุบัติเหตุเครื่องบินตกระหวางเดินทางจากโปรตุเกสเพื่อมารับตําแหนงผูบัญชาการกองกําลังฝายชาตินิยมในสเปน\n\nดูเหมือนวาเพื่อสรางภาพ "นักบินผูกลาหาญ" อยางวีรบุรุษเมื่อกลับมาเหยียบแผนดินสเปนหลังลี้ภัยกวาสองป นายพลผูนี้ยืนกรานจะบินดวยเครื่องบินลําเล็กแทนที่จะใชลําใหญที่มีอยู และยังทําใหเครื่องบรรทุกเกินพิกัดดวยการเรียกรองใหขนสัมภาระหนักทั้งหมดของเขาขึ้นเครื่องลําเดียวกัน\n\nเครื่องบินตกทันทีหลังขึ้นบิน เขาเสียชีวิตในทันที และการตายของเขาทําใหฝายนําของชาตินิยมเหลือเพียงกลุมนายพลที่แกงแยงกันชิงอํานาจ"
 lar_spain.78.a: "เขากลาเกินไป"
 lar_spain.78_tt: "§Yโฆเซ ซันฆูรโฆ เสียชีวิต§!\n"
 lar_spain.79.t: "พระราชพิธีราชาภิเษก[Root.GetLeader]"
 lar_spain.79.desc: "วันนี้ พระราชพิธีราชาภิเษกพระเจา[Root.GetLeader]ไดจัดขึ้นที่อาสนวิหารแร็งสทามกลางความยิ่งใหญและการเฉลิมฉลอง หลังพิธีอยางเปนทางการ กษัตริยทรงทักทายฝูงชนที่ปลาบปลื้มซึ่งรอคอยอยูดานนอก ผูซึ่งปติยินดีที่ไดเห็นชาติของตนกลับคืนสูระบอบกษัตริย\n\nในพระราชดํารัสตอพสกนิกร กษัตริยทรงเนนยํ้าถึงความเปนหนึ่งเดียวของฝรั่งเศสและสเปน ซึ่งมีพระองคเปนสัญลักษณ ไมวาที่ใดในโลกที่ผลประโยชนของชาวฝรั่งเศสถูกคุกคาม พวกเขาจะพบชาวสเปนอยูเคียงขางเพื่อปกปองอุดมการณของพวกเขา"
 lar_spain.79.a: "วันอันยิ่งใหญของราชอาณาจักร!"
 lar_spain.81.t: "ราคาของชัยชนะ"
 lar_spain.81.desc: "เนื่องจากการเขาไปมีสวนรวมอยางหนักในสงครามกลางเมืองสเปน อิทธิพลของเราเหนือรัฐบาล[SPD.GetAdjective]ไดขยายตัวจนพวกเขากลายเปนรัฐบริวารของมอสโกโดยปริยาย"
 lar_spain.81.a: "อิทธิพลของเราในยุโรปตะวันตกเพิ่มพูนขึ้น!"
 lar_spain.82.t: "ราคาของชัยชนะ"
 lar_spain.82.desc: "ชัยชนะในสงครามกลางเมืองเปนของเราแลว แตการที่เราพึ่งพาความชวยเหลือจากโซเวียตอยางหนักทําใหเราติดหนี้กอนใหญที่ตองชดใช ชวงเวลาอันโกลาหลของสงครามกลางเมืองยังเปดโอกาสใหพวกสตาลินนิสตแทรกซึมเขาสูตําแหนงสําคัญในกองทัพและรัฐบาลใหมของเราได เราจึงตกอยูในสถานการณที่ยากลําบาก\n\nมอสโกเริ่มสง "ขอเสนอแนะ" ใหแตงตั้งรัฐมนตรีและนายทหารที่ภักดีตอพวกเขาแลว และในตอนนี้เราไมอาจขัดขืนขอเรียกรองไดโดยไมตองเผชิญผลกระทบทางเศรษฐกิจอยางรุนแรง หรือรายกวานั้นคือจุดชนวนสงครามกลางเมืองครั้งใหม หากเราปรารถนาเอกราชที่แทจริง เราตองเดินหมากอยางระมัดระวัง และไมพิสูจนความภักดีของเรา ก็ตองบอนทําลายและรื้อถอนอิทธิพลของพวกสตาลินนิสตในรัฐของเราเสียกอน"
 lar_spain.82.a: "ดูกันวาสถานการณเชนนี้จะคงอยูไดนานเพียงใด"
 lar_spain.83.t: "สัญญาณแหงการทรยศ"
 lar_spain.83.desc: "ตลอดหลายสัปดาหที่ผานมา ผูประสานงาน ผูแทน ตลอดจนรัฐมนตรีและนายทหารสายสตาลินนิสตผูภักดีของเราใน[SPD.GetNameDef] ถูกปดบังขอมูลสําคัญและถูกกีดกันไมใหเขาถึงเจาหนาที่รัฐบาลและกองทัพ[SPD.GetAdjective]ครั้งแลวครั้งเลา บัดนี้มีขาวมาถึงเราวาคนของเรากําลังถูกปลดออกจากตําแหนงที่มีอิทธิพลอยางเปนระบบ และแมแตโครงการชวยเหลือตางประเทศของเราก็ถูกขัดขวาง\n\n"เรื่องบังเอิญ" ที่เกิดถี่ขนาดนี้ไมอาจเปนเพียงความบังเอิญ รัฐบาล[SPD.GetAdjective]กําลังแสดงสัญญาณของการทรยศอยางชัดเจน และตองการเบี้ยวพันธะที่มีตอ[SOV.GetNameDef] เสียงในมอสโกจึงเริ่มเรียกรองใหลงโทษและกระชับบังเหียนใหแนนขึ้น"
 lar_spain.83.a: "เราจะสงสารดวยการตั้งเขตยึดครองในคาตาลุญญา"
 lar_spain.83.b: "ทุกอยางจะคลี่คลายเองโดยที่เราไมตองแทรกแซง"
 lar_spain.84.t: "เขตยึดครองคาตาลุญญา"
 lar_spain.84.desc: "ความอดทนของมอสโกตอการที่เราขัดขวางความพยายามของพวกเขาในการเพิ่มอํานาจควบคุมเหนือรัฐบาลของเราอยางเปนระบบไดมาถึงขีดสุดแลว โซเวียตไดตั้งเขตยึดครองขึ้นฝายเดียวในคาตาลุญญา บาเลนเซีย และบางสวนของอารากอน พรอมรัฐบาลที่เปนอิสระแตในนามซึ่งแทบไมมีอํานาจจริงเลย กองกําลังคอมมิวนิสตฝายภักดีพากันหลั่งไหลเขาสูเขตใหมนี้ และประกาศสนับสนุน "รัฐบาล" ที่นิยมมอสโก\n\nสารนั้นชัดเจน: จงเชื่อฟงคําสั่งจากมอสโก มิฉะนั้นจะตองเผชิญการลงโทษที่หนักขึ้น แมไมนาเปนไปไดที่พวกเขาจะขยายอิทธิพลไดมากนักกอนแผนการของเราจะสัมฤทธิ์ผล แตการขับไลการยึดครองของโซเวียตออกจากแผนดินของเรายอมเปนงานที่ทาทายอยางไมตองสงสัย"
 lar_spain.84.a: "ความตึงเครียดกําลังกอตัว เราตองเรงเดินหนาตามแผน!"
 lar_spain.85.t: "[SPD.GetNameDefCap]ยึด[SPR_stolen_state_name.GetName]ไวได"
 lar_spain.85.desc: "กองกําลังของเรายึด[SPR_stolen_state_name.GetName]ไวไดอยางเบ็ดเสร็จ ขับไลผูสนับสนุนโซเวียตและผูนําทองถิ่นที่นิยมมอสโกออกไปแลว และเรากําลังเรงฟนฟูรัฐบาลทองถิ่น[SPD.GetAdjective]ขึ้นในพื้นที่นั้น"
 lar_spain.85.a: "เราจะกวาดลางอิทธิพลสตาลินนิสตออกจากประเทศทีละรัฐ!"
 lar_spain.88.t: "[SPD.GetNameDefCap]ยึด[SPR_stolen_state_name.GetName]ไวได"
 lar_spain.88.desc: "กองกําลัง[SPD.GetAdjective]ยึด[SPR_stolen_state_name.GetName]ไวไดอยางเบ็ดเสร็จ ขับไลผูสนับสนุนของเราและผูนําทองถิ่นที่นิยมมอสโกออกไป และกําลังเรงฟนฟูรัฐบาลทองถิ่นของพวกเขาขึ้นในพื้นที่นั้น"
 lar_spain.88.a: "ชนะศึกหนึ่งครั้งไมไดแปลวาชนะสงคราม"
 lar_spain.89.t: "[From.GetNameDefCap]ยอมรับขอเรียกรอง"
 lar_spain.89.desc: "อยางไมคาดคิด รัฐบาล[From.GetAdjective]ยอมถอยและตกลงตามขอเรียกรองเอกราชของเรา ดูเหมือนพวกเขาไมตองการถลําเขาสูความขัดแยงอีกครั้งในยุโรปตะวันตก"
 lar_spain.89.a: "ถึงอยางไรพวกเขาก็คงแพอยูดี"
 lar_spain.90.t: "การปลดนิเซโต อัลกาลา-ซาโมรา"
 lar_spain.90.desc: "การแยงชิงอํานาจระหวางพรรคฝายซายตาง ๆ ซึ่งเพิ่งรวมตัวกันควาชัยในการเลือกตั้งป 1936 ไดมาถึงจุดแตกหักแลว ดวยความระแวงตอนโยบายสายกลางและประนีประนอมของประธานาธิบดีนิเซโต อัลกาลา-ซาโมรา อดีตผูสนับสนุนที่หันหลังใหเขาในรัฐสภากอรเตสจึงวินิจฉัยวาการยุบสภากอรเตสซึ่งนําไปสูการเลือกตั้งนั้นขัดตอรัฐธรรมนูญ และปลดเขาออกจากตําแหนง\n\nแทนที่อัลกาลา-ซาโมรา รัฐสภากอรเตสไดเลือกมานูเอล อาซาญา คูแขงเกาของเขา ซึ่งบัดนี้ตองรับภาระอันไมมีใครอยากไดในการนําเสถียรภาพกลับคืนสูเวทีการเมืองสเปนที่แตกขั้วรุนแรงขึ้นทุกขณะ"
 lar_spain.90.a: "ความโกลาหลสมบูรณแบบ"
 SPR_spanish_elections_flag: "การเลือกตั้งสเปนป 1936 ไดจัดขึ้นแลว"
 lar_heavy_water.1.t: "โรงงานนํ้ามวลหนักเทเลมารกถูกทําลาย"
 lar_heavy_water.1.desc: "ผูบัญชาการกองรักษาการณในเทเลมารกรายงานวาโรงไฟฟาพลังนํ้าเวมอรกเกิดระเบิดครั้งใหญเมื่อคืนที่ผานมา ทําลายสิ่งอํานวยการที่ใชผลิตนํ้ามวลหนัก แมการสอบสวนยังดําเนินอยู แตหลักฐานที่มีบงชี้อยางหนักแนนวาเปนการกอวินาศกรรมโดยหนวยรบพิเศษของขาศึก\n\nดูเหมือนวาหนวยคอมมานโดกระโดดรมลงในพื้นที่ แทรกซึมเขาโรงงานโดยอาศัยการรักษาความปลอดภัยที่หละหลวมอยางนาตกใจ วางระเบิดไวใกลถังเก็บ แลวถอนตัวหายไปในความมืดเพียงไมกี่นาทีกอนระเบิดทํางาน\n\nไมมีรายงานพลเรือนเสียชีวิต ผูบัญชาการจึงสันนิษฐานวาขบวนการตอตานในทองถิ่นอาจรูเรื่องการจูโจมนี้ลวงหนา ขณะนี้กองรักษาการณทองถิ่นกําลังกวาดลางพื้นที่ แตยังไมพบเบาะแสใด และคาดวาทีมดังกลาวคงหนีออกจากพื้นที่ไปแลว"
 lar_heavy_water.1.a: "ความพายแพครั้งสําคัญ"
 lar_heavy_water.2.t: "ปฏิบัติการกันเนอรไซดสําเร็จ"
 lar_heavy_water.2.desc: "รายงานจากผูติดตอในเทเลมารกระบุวาปฏิบัติการกันเนอรไซดประสบความสําเร็จอยางสมบูรณ หลังกระโดดรมลงพื้นที่ ทีมไดแทรกซึมเขาโรงงานโดยหลบเลี่ยงยามทั้งหมดไดสําเร็จ\n\nหลังวางระเบิด ทีมไดหลบหนีออกมาอยางหมดจดและแยกยายกันเพื่อหลบหนวยคนหาที่ไลลาอยู เรายังไมไดรับขาวใดจากทีมนับตั้งแตการจูโจม แตนั่นเปนไปตามคาด และเราคาดวาเยอรมันจะประกาศตอสาธารณะหากพวกเขาสังหารหรือจับกุมหนวยคอมมานโดของเราได"
 lar_heavy_water.2.a: "ผูกลายอมชนะ"
 lar_bruneval_raid.1.t: "คอมมานโดขาศึกจูโจมยึดอุปกรณเรดาร"
 lar_bruneval_raid.1.desc: "มีรายงานการจูโจมของขาศึกเขามา ระบุวากองกําลังขาศึกขนาดเล็กไดโจมตีสถานีเรดารแหงหนึ่งของเรา หลังกองรักษาการณตานทานอยางหาวหาญแตไมสําเร็จ ขาศึกไดยึดสถานีไวชั่วระยะหนึ่ง กอนที่การตีโตกลับทันทีอยางดุดันจะผลักดันพวกเขากลับไปยังชายหาด ซึ่งพวกเขารีบลงเรือยกพลและถอนตัวไป\n\nการตรวจสอบสถานีเรดารอยางละเอียดพบวาชิ้นสวนหลายชิ้นถูกถอดไป และการขานชื่อพบวาชางเทคนิคเรดารคนหนึ่งหายตัวไป ซึ่งอาจถูกขาศึกลักพาตัวไป"
 lar_bruneval_raid.1.a: "ชางเปนวิธีทําสงครามที่ขลาดเขลานัก"
 lar_bruneval_raid.2.t: "ปฏิบัติการไบติงสําเร็จ"
 lar_bruneval_raid.2.desc: "การจูโจมสถานีเรดารของขาศึกประสบความสําเร็จอยางสมบูรณ หนวยจูโจมลงพื้นไดสําเร็จ โดยกระจัดกระจายจากการกระโดดรมเพียงเล็กนอย\n\nหลังรวบรวมยุทโธปกรณและกําหนดทิศทาง พลรมไดเคลื่อนเขาหาเปาหมายและทําลายกองรักษาการณที่ออนแอในการปะทะสั้น ๆ แตดุเดือด เมื่อพื้นที่ปลอดภัยแลว ชางเทคนิคเรดารที่ติดตามหนวยจูโจมมาไดถายภาพอุปกรณเรดารและถอดชิ้นสวนที่คัดเลือกไวเพื่อขนกลับมาใหเรา\n\nหลังการปะทะครั้งที่สองกับกองรักษาการณที่ตื่นตัวแลว ชายหาดสําหรับถอนตัวก็ถูกเคลียร และหนวยไดขึ้นเรือยกพลกลับสูแนวของเรา พรอมนําตัวชางเทคนิคเรดารของขาศึกมาสอบสวนดวย"
 lar_capture_tito.1.t: "ปฏิบัติการรอสเซิลสพรุงลมเหลว"
 lar_capture_tito.1.desc: "ปฏิบัติการจับเปนหรือสังหารตีโต ผูนํากองโจรยูโกสลาเวีย ไมประสบความสําเร็จ ทหารสงทางอากาศระลอกแรกลงพื้นใกลถํ้าที่เราสงสัยวาตีโตซอนตัวอยู แตกลับเจอการยิงอยางหนักหนวงจากหนวยขาศึกที่แข็งแกรงซึ่งขาวกรองของเราตกหลนไป แมทหารของเราจะสูอยางกลาหาญ แตกําลังเสริมของขาศึกมาถึงเร็วกวาที่คาด แมแตความพยายามตีฝาวงลอมอยางสิ้นหวังก็ไมสําเร็จ \n\nผูรอดชีวิตไดถอนตัวกลับสูแนวฝายเรา ขณะนี้ไมทราบวาตีโตอยูที่ใด"
 lar_capture_tito.1.a: "ครั้งนี้เขารอดไปได"
 lar_capture_tito.2.t: "ปฏิบัติการรอสเซิลสพรุงสําเร็จ"
 lar_capture_tito.2.desc: "ปฏิบัติการกําจัดตีโต ผูนํากองโจร ประสบความสําเร็จอยางสมบูรณ แมขาศึกจะคาดการณวาจะถูกโจมตี แตการผสานการสนับสนุนทางอากาศโดยใกลชิดเขากับการบุกตรงเขาสูกองบัญชาการของตีโตโดยทหารสงทางอากาศทําใหพวกเขาถูกจูโจมโดยไมทันตั้งตัว หลังการปะทะอยางดุเดือดทั้งในและรอบกองบัญชาการในถํ้า ไดพบศพของตีโตอยูทามกลางผูเสียชีวิต"
 lar_capture_tito.2.a: "เราไดตัวเขาแลว"
 Tito_killed: "§Yโยซิป บรอซ ตีโต§! ถูกสังหารแลว"
 lar_rescue_mussolini.1.t: "ความพยายามชวยเหลือลมเหลว"
 lar_rescue_mussolini.1.desc: "ความพยายามชวยเหลือมุสโสลินีลมเหลวและสูญเสียชีวิตจํานวนมาก เครื่องรอนหลายลําที่ใชลําเลียงพลรมบรรทุกทหารและยุทโธปกรณเกินพิกัด จึงไตระดับไมพอจะขามภูเขาและตกทามกลางสภาพอากาศเลวราย เมื่อเหลือกําลังจูโจมเพียงสวนนอย ผูบัญชาการจึงตัดสินใจเสี่ยงโดยอาศัยความรวดเร็วและการจูโจมโดยไมใหตั้งตัว \n\nโชครายที่ถึงตอนนั้นผูคุมเรือนจําอยูในภาวะเตรียมพรอมเต็มที่แลว และเปดฉากยิงเมื่อหนวยจูโจมพยายามบุกเขาโรงแรม หลังการตอสูสั้น ๆ เมื่อที่มั่นไมอาจรักษาไวไดและกระสุนใกลหมด ผูบัญชาการจึงยอมจํานนพรอมหนวยของเขา"
 lar_rescue_mussolini.1.a: "อยางนอยก็คุมที่จะลอง"
 lar_rescue_mussolini.2.t: "มุสโสลินีไดรับการชวยเหลือ"
 lar_rescue_mussolini.2.desc: "ภารกิจปลดปลอยมุสโสลินีประสบความสําเร็จ หนวยพลรมขนาดเล็กรอนลงใกลโรงแรมไดสําเร็จและบุกเขายึดอาคารโดยไมมีการยิงแมแตนัดเดียว ผูคุมในพื้นที่ยอมวางอาวุธหลังตระหนักวาการตอตานไรความหมาย จากนั้นมุสโสลินีถูกนําตัวบินออกมาดวยเครื่องบิน Fiesler Storch กลับสูแนวฝายเรา และจะเดินทางตอไปพบกับ[GER.GetLeader]"
 lar_rescue_mussolini.2.a: "เราไมลืมมิตรสหายของเรา"
 lar_operative_event.1.t: "สายลับถูกจับกุม"
 lar_operative_event.1.desc: "ระหวางปฏิบัติการอยูหลังแนวขาศึก [This.GetName] ถูกหนวยตอตานขาวกรอง[From.From.GetAdjective]ของขาศึกจับกุมตัว รายงานจากแหลงขาวอื่นระบุวา[This.GetSheHe]ถูกคุมตัวไว ณ สถานที่หางไกลเพื่อสอบสวน แมเราเชื่อวา[This.GetSheHe]จะพยายามตานทานการสอบสวนใหนานที่สุด แตมีแนวโนมวาขาศึกจะไดขาวกรองที่เปนประโยชนไปในที่สุด เวนแต[This.GetSheHe]จะไดรับการชวยเหลือหรือถูกสังหารเสียกอนที่[This.GetSheHe]จะยอมแตก"
 lar_operative_event.1.a: "เราตองจัดปฏิบัติการชวยเหลือ!"
 lar_operative_event.2.t: "สายลับถูกบีบใหหลบซอน"
 lar_operative_event.2.desc: "ระหวางปฏิบัติภารกิจใน[From.From.GetNameDef] เห็นไดชัดวา [This.GetName] ถูกหนวยตอตานขาวกรอง[From.From.GetAdjective]ตรวจพบ ขอความสุดทายที่[This.GetSheHe]สงมาระบุวา[This.GetSheHe]สังเกตเห็นการสะกดรอยของขาศึกตาม[This.GetHerHim]อยู และ[This.GetSheHe]กําลังจะดําเนินขั้นตอนหลบหลีกและหลบหนี \n\nในฐานะสวนหนึ่งของขั้นตอนดังกลาว [This.GetName] ยอมตัดการติดตอกับผูควบคุมของ[This.GetHerHis]เพื่อไมใหพวกเขาหรือผูอื่นถูกเปดโปง\n\nหากสําเร็จ [This.GetName] จะติดตอกลับมาหาเราในอีกไมกี่สัปดาห"
 lar_operative_event.2.a: "เราทําไดเพียงรอคอยและหวัง"
 lar_operative_event.3.t: "สายลับเสียชีวิต"
 lar_operative_event.3.desc: "ดูเหมือนวา [This.GetName] สายลับคนหนึ่งของเราที่ปฏิบัติการอยูใน[From.From.GetNameDef] ไดเสียสละขั้นสูงสุดและเสียชีวิตขณะปฏิบัติหนาที่ รายงานจากแหลงขาว[From.From.GetAdjective]ยอมมีอยูนอยนิด แตดูเหมือนวา [This.GetName] ถูกหนวยตอตานขาวกรอง[From.From.GetAdjective]ติดตามอยู เปนไปไดวา[This.GetSheHe]กําลังจะถูกจับ และเลือกความตายเพื่อไมใหหลุดขอมูลสําคัญระหวางการสอบสวน หรือไมก็ถูกสายลับ[From.From.GetAdjective]สังหารขณะขัดขืนการจับกุม"
 lar_operative_event.3.a: "วีรชนผูไดหลับใหลชั่วนิรันดรของ[This.GetHerHis]"
 lar_operative_event.4.t: "สายลับไดรับบาดเจ็บ"
 lar_operative_event.4.desc: "หลังจากเฉียดฉิวกับหนวยตอตานขาวกรอง[From.From.GetAdjective] [This.GetName] รายงานวา[This.GetSheHe]จะตองพักการปฏิบัติงานชั่วระยะหนึ่งเพื่อรักษาบาดแผลที่[This.GetSheHe]ไดรับขณะตอสูขัดขืนความพยายามจับกุมตัว[This.GetHerHim] \n\nขณะนี้ [This.GetName] อยูในที่ปลอดภัย กําลังรักษาบาดแผลของ[This.GetHerHis] และจะไมพรอมปฏิบัติงานไปอีกหลายสัปดาหระหวางที่[This.GetSheHe]พักฟน"
 lar_operative_event.4.a: "อีกไมนาน[This.GetSheHe]ก็จะกลับมารวมสูอีกครั้ง"
 lar_operative_event.5.t: "สายลับขาศึกแปรพักตร"
 lar_operative_event.5.desc: "หนวยตอตานขาวกรองของเราประสบความสําเร็จครั้งใหญ: หลังการสอบสวนอยางเขมขน และเมื่อไดรับแจงถึงชะตากรรมที่นาจะเกิดกับ[This.GetHerHis]หาก[This.GetSheHe]ถูกตั้งขอหาจารกรรม สายลับ[From.From.GetAdjective]ที่ถูกจับ [This.GetName] ไดตกลงใหความรวมมือกับเรา เพื่อแลกกับการนิรโทษกรรมเต็มรูปแบบสําหรับความผิดตอรัฐของ[This.GetHerHis]\n\nดวยความรูเชิงลึกของ[This.GetHerHis]เกี่ยวกับกลไกภายในของหนวยขาวกรอง[From.From.GetAdjective] [This.GetSheHe]ยอมแทรกซึมเขาสู[From.From.GetNameDef]และหลบเลี่ยงการตรวจจับของหนวยตอตานขาวกรอง[From.From.GetAdjective]ไดงายกวามากอยางไมตองสงสัย"
 lar_operative_event.5.a: "แตเราคาดไววา[This.GetHerHim]จะตายไมใชหรือ?"
 lar_operative_event.6.t: "จับกุมสายลับ[From.GetAdjective]ได!"
 lar_operative_event.6.desc: "[This.GetName] ถูกจับไดขณะพยายามแทรกซึมเขาสูหนวยงานบริหารของเราและสงขอมูลลับกลับไปใหผูบังคับบัญชาของ[This.GetHerHis] เมื่อถูกสอบสวน [This.GetSheHe]เปดเผยวา[This.GetHerselfHimself]เปนสายลับตางชาติของ[From.GetAgency]ที่ปฏิบัติการอยูบนแผนดิน[From.From.GetAdjective] ยังไมทราบแนชัดวาฝาย[From.GetAdjective]สนใจประเทศของเราในเรื่องใด หรือหนวยงานสวนใดของเราถูกหนวยขาวกรอง[From.GetAdjective]ลวงรูไปแลวบาง ขณะที่ [This.GetName] ถูกคุมขังรอการสอบสวนเพิ่มเติม เราไดแตหวังวาในที่สุด[This.GetSheHe]จะเปดเผยทุกสิ่งที่ควรรูเกี่ยวกับปฏิบัติการของ[From.GetAdjective]ใน[From.From.GetNameDef]"
