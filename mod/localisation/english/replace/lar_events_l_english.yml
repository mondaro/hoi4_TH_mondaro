 lar_news.1.t_anarchists: "ฝายอนาธิปไตยชนะสงครามกลางเมืองสเปน"
 lar_news.2.desc_republic_no_help: "หลังสงครามกลางเมืองอันยาวนานและทรหด สาธารณรัฐที่สองก็ปราบศัตรูฝายอนาธิปไตยและฝายชาตินิยมลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายชาตินิยมที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายสาธารณรัฐในพื้นที่ที่เคยเปนของฝายชาตินิยม แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nสวนทางกับทุกความคาดหมาย และดวยการพึ่งพาความชวยเหลือจากโซเวียตเพียงนอยนิด สาธารณรัฐสเปนสามารถรักษาความเปนประชาธิปไตยไวได ขณะถูกรุมเราทั้งจากศัตรูภายในและภายนอก ขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม ยังตองรอดูวาสเปนที่เปนประชาธิปไตยจะทําอะไรในวิกฤตการณโลกครั้งนี้"
 lar_news.2.desc_republic_soviet_help: "ดวยความชวยเหลืออยางมหาศาลจากโซเวียต สาธารณรัฐที่สองก็ปราบศัตรูฝายอนาธิปไตยและฝายชาตินิยมลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายชาตินิยมที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายสาธารณรัฐในพื้นที่ที่เคยเปนของฝายชาตินิยม แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม แรงกดดันจากโซเวียตตอประเทศก็ทวีขึ้นเรื่อย ๆ ยังตองรอดูวารัฐบาลประชาธิปไตยของสเปนจะยังยึดมั่นในหลักการประชาธิปไตยได หรือจะกลายเปนเพียงดานหนาแหงอิทธิพลของมอสโกในยุโรปตะวันตก"
 lar_news.2.desc_stalinist: "หลังสงครามกลางเมืองอันยาวนานและทรหด สาธารณรัฐที่สองก็ปราบศัตรูฝายอนาธิปไตยและฝายชาตินิยมลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายชาตินิยมที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายสาธารณรัฐในพื้นที่ที่เคยเปนของฝายชาตินิยม แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nสงครามกลางเมืองครั้งนี้ไดเห็นสเปนเปลี่ยนผานอยางสันติสูรัฐบาลคอมมิวนิสต ซึ่งไดรับความชวยเหลืออยางมหาศาลจากโซเวียต ขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม สายสัมพันธสเปน-โซเวียตดูจะแนนแฟนยิ่งขึ้น และคาดวาสหภาพโซเวียตจะเขามามีบทบาทอยางมากในโครงการฟนฟูอุตสาหกรรมหลังสงคราม"
 lar_news.2.desc_independent_communist: "หลังสงครามกลางเมืองอันยาวนานและทรหด คอมมิวนิสตอิสระของสเปนก็ปราบศัตรูฝายสาธารณรัฐและฝายชาตินิยมลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายชาตินิยมที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายคอมมิวนิสตในพื้นที่ที่เคยเปนของฝายชาตินิยม แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม รัฐคอมมิวนิสตสเปนใหมไดตัดความสัมพันธทั้งหมดกับ[SOV.GetNameDef]แลว แตไดเชิญพรรคคอมมิวนิสตทุกพรรคที่ปฏิเสธทั้งลัทธิสตาลินและลัทธิทรอตสกีใหมารวมกันบุกเบิกหนทางอันเปนอิสระ"
 lar_news.2.desc_anarchists: "หลังสงครามกลางเมืองอันยาวนานและทรหด ฝายอนาธิปไตยของสเปนก็ปราบศัตรูฝายสาธารณรัฐและฝายชาตินิยมลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายชาตินิยมที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการกอตั้งคอมมูนอยางสันติในพื้นที่ที่เคยเปนของฝายชาตินิยม แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่คอมมูนตาง ๆ ทุมเทกับการฟนฟูหมูบาน เมืองเล็ก เมืองใหญ และอุตสาหกรรมที่บอบชํ้าจากสงคราม พวกเขาเลือกที่จะคงการจัดตั้งไวภายใตสภาปองกันภูมิภาคสมัยสงคราม ซึ่งดูเหมือนเปนการตอบโตวาทกรรมที่เปนปรปกษมากขึ้นเรื่อย ๆ จากปฏิกิริยาของผูนําโลกหลายคนตอชัยชนะของฝายอนาธิปไตย"
 lar_news.2.a: "จะปลอยให 'ชัยชนะ' นี้ยั่งยืนไมได!"
 lar_news.2.b: "ทางเลือกที่นาสนใจแทนคอมมิวนิสตรูปแบบเดิมที่ฝงรากลึก"
 lar_news.2.c: "อยางนอยพวกเขาก็ไมใชลิ่วลอของสตาลิน"
 lar_news.2.d: "จะปลอยใหการบิดเบือนคอมมิวนิสตเชนนี้เฟองฟูไมได!"
 lar_news.2.e: "ชัยชนะอันนาประทับใจ!"
 lar_news.2.f: "อยางนอยผูชนะก็ไมใชพวกฟาสซิสต"
 lar_news.2.g: "ผลลัพธที่ดีที่สุดเทาที่จะเปนไปได"
 lar_news.2.h: "อิทธิพล[SOV.GetAdjective]เหนือ[SPD.GetNameDef]นาเปนหวง..."
 lar_news.3.t: "การประชุมแหงปารีส"
 lar_news.3.desc: "หลังการเจรจาอยางยืดเยื้อระหวางผูแทนของ[FRA.GetNameDef] [ITA.GetNameDef] [POR.GetNameDef] และ[SPA.GetNameDef] การประชุมแหงปารีสไดมีมติใหขีดเสนพรมแดนแอฟริกาใหม โดย[FRA.GetLeader]เรียกผลที่ไดวาเปน "ความสําเร็จสูงสุดของการทูตฝรั่งเศสในประวัติศาสตรที่มีการบันทึก"\n\nรัฐบาลของมหาอํานาจอาณานิคมอื่น ๆ รีบประณามขอตกลงนี้ทันที โดยเรียกวาเปน "ภัยคุกคามตอสันติภาพและความสงบเรียบรอยของทวีป"\n\nเมื่อขอตกลงนี้มอบดินแดนกวางใหญใหแกประเทศที่ยังไมไดครอบครองดินแดนเหลานั้น จึงไมนาเปนไปไดที่แผนซึ่งรางขึ้นในปารีสจะนําไปปฏิบัติไดโดยไมมีการนองเลือด"
 lar_news.3.a: "อีกไมนานพวกเขาจะมาหาเรา"
 lar_news.3.b: "ถึงเวลาขีดเสนพรมแดนแอฟริกาใหม"
 lar_news.3.c: "การแบงสรรทวีปครั้งใหม"
 lar_news.4.t: "รัฐบาลฝรั่งเศสกลับสูปารีส"
 lar_news.4.desc: "หลังการเจรจาในระดับสูงสุด วันนี้[GER.GetLeader]ประกาศวาการปกครองทางทหารของเยอรมนีในฝรั่งเศสตอนเหนือจะสิ้นสุดลงในไมชา และดินแดนเหลานั้นจะกลับคืนสูอธิปไตยของฝรั่งเศสโดยสมบูรณ เพื่อเปนการตอบแทน [VIC.GetLeader]ประกาศวารัฐบาลของเขาไดเขารวมกติกาสัญญาเหล็กกลาแลว\n\nทหารเยอรมันที่ประจําการปองกันพื้นที่เหลานั้นอยูจะยังคงอยูตอไปในขณะนี้ จนกวาจะมีทหารฝรั่งเศสมาแทนที่ ประเด็นที่เปนขอถกเถียงมากกวา เชน สถานะของอาลซัส-ลอแรน ไมไดถูกหยิบยกขึ้นมาหารือ และดูจากทุกสิ่งแลว ดินแดนนั้นยังคงอยูภายใตการปกครองของเยอรมนี"
 lar_news.4.a: "เราขอตอนรับสหายรวมรบของเรา!"
 lar_news.4.b: "เกียรติของพวกเขาซื้อไดในราคาถูกเพียงนี้เองหรือ?"
 lar_news.4.c: "ดูเหมือนปญหาเรื่องความชอบธรรมจะไดขอยุติแลว"
 lar_news.4.d: "'รัฐบาลหนึ่ง' ของฝรั่งเศส ไมใช 'รัฐบาล' ฝรั่งเศส"
 lar_news.4.e: "เรากลับมาอยูในที่ที่เราควรอยูแลว"
 lar_news.5.t: "การใหสัตยาบันแนวรวมสเตรซา"
 lar_news.5.desc: "แมจะเผชิญอุปสรรคในชวงแรกและความเห็นไมลงรอยกันเรื่องการรุกรานเอธิโอเปยของอิตาลี ผูนําของ[This.GetStresaMembers]ก็ไดมารวมตัวกันเพื่อยกระดับขอตกลงที่บรรลุไวเมื่อเดือนเมษายน 1935 ใหเปนคํามั่นเปนพันธมิตรอยางเปนทางการ\n\nในฐานะสวนหนึ่งของการเจรจา [This.GetStresaConcessions] แมผูนําของพันธมิตรใหมนี้จะอางวาขอตกลงมุงเพียงรักษาสันติภาพในยุโรป แตนักการทูตจํานวนมากเห็นพองกันวามันมีเจตนาหลักเพื่อปดลอมเยอรมนี"
 lar_news.5.a: "เมื่ออิตาลีพูด โลกยอมรับฟง"
 lar_news.5.b: "พันธมิตรของเราแข็งแกรงยิ่งขึ้น"
 lar_news.5.c: "วงลอมรอบเยอรมนีบีบแคบเขามา"
 lar_news.5.d: "ปกดานใตของเราปลอดภัยแลว"
 lar_news.5.e: "อิตาลีก็ยังเปนพันธมิตรที่ไวใจไดเหมือนเคย"
