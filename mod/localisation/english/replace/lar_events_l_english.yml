 occupied_countries.1.title: "รัฐบาลเฉพาะกาลแหง[From.From.GetNameDef]"
 occupied_countries.1.desc: "หลังความพยายามอยางตอเนื่องและยาวนานในการปรับปรุงความรวมมือและการยอมรับปกครองระหวางกองกําลังยึดครองของเรากับฝายปกครองพลเรือนทองถิ่น บัดนี้เราพรอมแลวที่จะคืนอํานาจควบคุม[From.From.GetNameDef]สูมือรัฐบาลทองถิ่น รัฐบาลใหมนี้ประกอบดวยพลเรือนที่เห็นอกเห็นใจเรา และพรอมจะประสานงานอยางใกลชิดกับเรา"
