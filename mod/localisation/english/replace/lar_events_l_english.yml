 lar_news.1.t_franco: "ฝายชาตินิยมชนะสงครามกลางเมืองสเปน"
 lar_news.1.t_falangist: "ฝายฟาลังเฆชนะสงครามกลางเมืองสเปน"
 lar_news.1.t_carlists: "ฝายคารลิสตชนะสงครามกลางเมืองสเปน"
 lar_news.1.desc_franco: "หลังสงครามกลางเมืองอันยาวนานและทรหด ฝายชาตินิยมซึ่งรวมตัวกันภายใตฟรันซิสโก ฟรังโก ก็ปราบศัตรูฝายสาธารณรัฐลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายสาธารณรัฐที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายชาตินิยมในพื้นที่ที่เคยเปนของฝายสาธารณรัฐ แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม ยังตองรอดูวาการหลอมรวมทางอุดมการณของฝายชาตินิยมจะสงผลตอนโยบายตางประเทศอยางไร และความชวยเหลือทางทหารอันเอื้อเฟอจากตางชาติที่ไดรับมาจะไดรับการตอบแทนหรือไม"
 lar_news.1.desc_franco_unified: "ในชวงหลายสัปดาหที่ผานมา ความตึงเครียดระหวางกลุมตาง ๆ ภายในฝายชาตินิยมผูชนะไดทวีขึ้น แตบัดนี้ ดวยการเนรเทศผูนําที่แข็งขอและการบังคับรวมพรรคการเมือง ฟรันซิสโก ฟรังโก ดูเหมือนจะสามารถประสานรอยราวเหลานี้ และรวมกลุมที่เหลือใหอยูเบื้องหลังอุดมการณของเขาได แมกองกําลังฝายสาธารณรัฐที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร แตสงครามกลางเมืองก็นับไดวายุติลงอยางแทจริงแลว\n\nขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม ยังตองรอดูวาการหลอมรวมทางอุดมการณของฝายชาตินิยมจะสงผลตอนโยบายตางประเทศอยางไร และความชวยเหลือทางทหารอันเอื้อเฟอจากตางชาติที่ไดรับมาจะไดรับการตอบแทนหรือไม"
 lar_news.1.desc_franco_uprising: "ความแตกตางภายในฝายชาตินิยมนั้นใหญหลวงเกินกวาจะกาวขามได แตหลังสงครามกลางเมืองอันยาวนานและทรหด ฝายชาตินิยมภายใตฟรันซิสโก ฟรังโก ก็ปราบศัตรูฝายคารลิสตและฝายสาธารณรัฐลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายสาธารณรัฐที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายชาตินิยมในพื้นที่ที่เคยเปนของฝายสาธารณรัฐ แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่ประเทศทุมเทกับการฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม ยังตองรอดูวาความชวยเหลือทางทหารอันเอื้อเฟอจากตางชาติที่ไดรับมาจะไดรับการตอบแทนหรือไม"
 lar_news.1.desc_falangist: "หลังสงครามกลางเมืองอันยาวนานและทรหด ฝายชาตินิยมภายใตเอมิลิโอ โมลา ก็ปราบศัตรูฝายคารลิสตและฝายสาธารณรัฐลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายสาธารณรัฐที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายชาตินิยมในพื้นที่ที่เคยเปนของฝายสาธารณรัฐ แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nขณะที่ประเทศฟนฟูเมืองและอุตสาหกรรมที่บอบชํ้าจากสงคราม ก็มีการเตรียมการเปลี่ยนผานกลับสูรัฐบาลพลเรือนภายใตโฆเซ อันโตนิโอ ปรีโม เด ริเบรา ยังตองรอดูวาความทะเยอทะยานแบบจักรวรรดินิยมของสเปนจะปรากฏออกมาอยางไรในวิกฤตการณโลกครั้งนี้"
 lar_news.1.desc_carlists: "กองกําลังคารลิสตภายใตมานูเอล ฟล กอนเด ไดปราบศัตรูฝายฟาลังเฆและฝายสาธารณรัฐลงไดในที่สุด และยึดอํานาจควบคุมสเปนไดทั้งหมด แมกองกําลังฝายสาธารณรัฐที่หลงเหลืออยูประปรายยังคงทําสงครามกองโจร ซึ่งอาจเปนอุปสรรคตอการสถาปนาอํานาจของฝายคารลิสตในพื้นที่ที่เคยเปนของฝายสาธารณรัฐ แตก็ไมนาจะเกิดการตอตานที่ประสานกันและมีนัยสําคัญใด ๆ อีก\n\nความกลาหาญและความคลั่งศรัทธาของหนวยเรเกเตของคารลิสตคือหัวใจสําคัญแหงชัยชนะ และขวัญกําลังใจอันสูงสงเดียวกันนี้ก็เปนลักษณะเดนของความพยายามฟนฟูสเปนหลังสงคราม อยางไรก็ตาม เมื่อสงครามยุติลง ชาวคารลิสตจํานวนมากตางรอคอยอยางใจรอนใหความพยายามของพวกเขาไดรับผลตอบแทน และใหผูอางสิทธิ์โดยชอบธรรมของคารลิสตไดขึ้นครองบัลลังกสเปนเสียที"
 lar_news.1.a: "ชัยชนะที่เรายอมรับได"
 lar_news.1.b: "พวกคลั่งลัทธิเหลานี้ยังคงใชชีวิตอยูในยุคกลาง..."
