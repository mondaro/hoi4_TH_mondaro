 lar_news.6.t: "ฝรั่งเศสปรับทิศทางนโยบายตางประเทศ"
 lar_news.6.desc: "ประธานาธิบดี[FRA.GetLeader]ไดประกาศการเปลี่ยนแปลงครั้งใหญในนโยบายตางประเทศของฝรั่งเศส รวมถึงการทบทวนพันธมิตรทางยุทธศาสตรและการรับประกันทางการเมืองที่รัฐบาลชุดกอน ๆ ไดใหไวอยางละเอียดถี่ถวน\n\nโดยเฉพาะอยางยิ่ง เครือขายพันธมิตรที่ผูกฝรั่งเศสไวกับประเทศตาง ๆ ในยุโรปตะวันออกจะถูก "ตรวจสอบอยางใกลชิด" ซึ่งผูสังเกตการณจํานวนมากตีความวามันจะถูกยุบเลิก\n\nผูนําใน[POL.GetNameDef] [CZE.GetNameDef] และ[ROM.GetNameDef] ยังคงปฏิเสธที่จะแสดงความเห็นตอประเด็นนี้หรือตอปฏิกิริยาใด ๆ ที่อาจเกิดขึ้น"
 lar_news.6.a: "เราถูกทรยศอีกแลว"
 lar_news.6.b: "เราจะเปนรายตอไปหรือ?"
 lar_news.6.c: "ฝรั่งเศสกําลังวางแผนอะไรอยู?"
 lar_news.6.d: "เราจะไมถูกลากเขาสูสงครามอีกครั้งเพราะพันธมิตรโง ๆ"
 lar_news.6.e: "พวกเขาฉลาดพอที่จะไมยุงกับเรื่องที่ไมเกี่ยวกับตน"
 lar_portugal_iberian_summit.1.t: "การประชุมสุดยอดไอบีเรีย"
 lar_portugal_iberian_summit.1.desc: "เราไดรับสาสนจาก[From.GetNameDef] เสนอใหเราละทิ้งความขัดแยงและเริ่มรวมมือกันเพื่อเปาหมายรวม พวกเขาเสนอใหหารือเรื่องการยื่นคํารองรวมกันเพื่อเขารวม[?global.POR_iberian_summit_target.GetFactionName] และสงไปยัง[?global.POR_iberian_summit_target.GetNameDef] \n\n เราตองประเมินไมเพียงวาขอเสนอนี้มีโอกาสสําเร็จจริงหรือไม แตยังตองดูดวยวามันสอดคลองกับผลประโยชนของเราจริงหรือเปลา"
 lar_portugal_iberian_summit.1.a: "ขอเสนอนี้สอดคลองกับผลประโยชนของเรา"
 lar_portugal_iberian_summit.1_a_tt: "เราจะสงขอเสนอไปยัง[GER.GetFlag][GER.GetNameDefCap]ทันที\n"
 lar_portugal_iberian_summit.1.b: "เราตองติดตอนักการทูต[?global.POR_iberian_summit_target.GetAdjective]กอน"
 lar_portugal_iberian_summit.1_b_tt: "ขอเสนอจะถูกสงไปยัง[GER.GetFlag][GER.GetNameDefCap]ในอีกหกเดือน\n"
 lar_portugal_iberian_summit.1.c: "ชางเปนความคิดที่นาขัน!"
 lar_portugal_iberian_summit.2.t: "การประชุมสุดยอดไอบีเรีย - [From.GetNameDef]ตอบรับ"
 lar_portugal_iberian_summit.2.desc: "รัฐบาล[From.GetAdjective]ตอบรับขอเสนอของเราในการเขารวม[?global.POR_iberian_summit_target.GetFactionName]แลว เราไดรวมกันลงนามในคํารองเพื่อยื่นตอ[?global.POR_iberian_summit_target.GetNameDef]โดยเร็วที่สุด"
 lar_portugal_iberian_summit.2.a: "ยื่นคํารองทันที"
 lar_portugal_iberian_summit.3.t: "การประชุมสุดยอดไอบีเรีย - [From.GetNameDef]ขอเลื่อนคํารอง"
 lar_portugal_iberian_summit.3.desc: "รัฐบาล[From.GetAdjective]ระบุวาเราจะมีโอกาสเขารวม[?global.POR_iberian_summit_target.GetFactionName]มากขึ้น หากเราใชเวลาติดตอนักการทูต[?global.POR_iberian_summit_target.GetAdjective]บางคนกอนยื่นขอเสนอตอ[?global.POR_iberian_summit_target.GetNameDef] ดวยวิธีนี้ เราจะไดขอมูลสําคัญเกี่ยวกับเปาหมายและเจตนาของฝาย[?global.POR_iberian_summit_target.GetAdjective] และจะสามารถยื่นขอเสนอที่ตรงกับผลประโยชนของพวกเขามากขึ้น"
 lar_portugal_iberian_summit.3.a: "หวังวามันจะคุมคา..."
 lar_portugal_iberian_summit.4.t: "ชาติไอบีเรียขอเขารวม[Root.GetFactionName]"
 lar_portugal_iberian_summit.4.desc: "สเปนและโปรตุเกสไดสงคํารองรวมกันเพื่อขอเขารวม[Root.GetFactionName] พวกเขาหวังใหเรารับทั้งสองชาติไอบีเรียเขาสูพันธมิตรของเรา \n\nขณะที่เราประเมินโอกาสในการรักษาเสนทางเขาสูทะเลเมดิเตอรเรเนียน ผูบัญชาการทหารของเราก็กังวลวาอาจตองเปดแนวรบใหมที่เราอาจไมมีทรัพยากรพอจะปองกัน..."
 lar_portugal_iberian_summit.4.a: "เราตอบรับ พวกเขาอาจเปนประโยชนตอเรา"
 lar_portugal_iberian_summit.4.b: "เราปฏิเสธ พวกเขาแคตองการเกาะการคุมครองของเรา!"
 lar_portugal_iberian_summit.5.t: "การประชุมสุดยอดไอบีเรีย"
 lar_portugal_iberian_summit.5.desc: "เราไดรับสาสนจาก[From.GetNameDef] เสนอใหเราละทิ้งความขัดแยงและเริ่มรวมมือกันเพื่อเปาหมายรวม พวกเขาเสนอใหหารือเรื่องการยื่นคํารองรวมกันเพื่อเขารวม[?global.POR_iberian_summit_target.GetFactionName] และสงไปยัง[?global.POR_iberian_summit_target.GetNameDef] \n\n เราตองประเมินไมเพียงวาขอเสนอนี้มีโอกาสสําเร็จจริงหรือไม แตยังตองดูดวยวามันสอดคลองกับผลประโยชนของเราจริงหรือเปลา"
