 YUG_instigate_in_bulgaria: "ปลุกปนการลุกฮือของชาวนาในบัลแกเรีย"
 YUG_instigate_in_bulgaria_desc: "แรงงานชาวสลาฟใตเกือบทั้งหมดไดรับการปลดปลอยโดยรัฐของเราแลว ยกเวนชาวบัลแกเรีย มีเพียงการปลุกเราใหชาวบัลแกเรียลุกขึ้นตอตานผูกดขี่เทานั้น ที่เราจะอางไดอยางแทจริงวาไดปลดปลอยแรงงานชาวสลาฟแหงบอลขานแลว"
 YUG_instigate_in_albania: "ปลุกปนการลุกฮือของชาวนาในแอลเบเนีย"
 YUG_instigate_in_albania_desc: "แมชาวแอลเบเนียจะไมถือวาตนเปนชาวสลาฟ แตความใกลชิดกับพรมแดนของเรา และการแลกเปลี่ยนทางวัฒนธรรมระหวางชาวแอลเบเนียกับชาวสลาฟใต ทําใหพวกเขาเปนผูที่เหมาะสมอยางยิ่งที่จะเขารวมสภาแรงงานรวมชาติสลาฟ"
 YUG_instigate_in_greece: "ปลุกปนการลุกฮือของชาวนาในกรีซ"
 YUG_instigate_in_romania: "ปลุกปนการลุกฮือของชาวนาในโรมาเนีย"
 YUG_instigate_in_hungary: "ปลุกปนการลุกฮือของชาวนาในฮังการี"
 YUG_instigate_in_turkey: "ปลุกปนการลุกฮือของชาวนาในตุรกี"
 YUG_propaganda_in_target: "รณรงคโฆษณาชวนเชื่อใน[YUG_communist_coup_target.GetNameDef]"
 YUG_propaganda_in_target_desc: "เราไดเลือกเปาหมายแลว สิ่งที่เหลือคือสงโฆษณาชวนเชื่อที่ไดผลใหพันธมิตรสังคมนิยมของเรา แลวอีกไมนานเราจะหวานเมล็ดพันธุแหงการกบฏที่จําเปนตอการโคนลมชนชั้นสูงแหงบอลขาน"
 YUG_arm_communist_militants: "ติดอาวุธใหนักรบ[YUG_communist_coup_target.GetAdjective]"
 YUG_arm_communist_militants_desc: "เราไมอาจนําการปฏิวัติไปสูสหายขามพรมแดนไดดวยคําพูดเพียงอยางเดียว เราตองจัดหาอาวุธที่จําเปนใหพันธมิตรของเราเพื่อโคนลมนายเหนือหัวของพวกเขา"
 YUG_communist_coup: "ปลุกปนรัฐประหารคอมมิวนิสต"
 YUG_communist_coup_desc: "พวกเขาเตรียมตัวมานานพอแลว สิ่งที่เราตองทําตอนนี้คือใหไฟเขียวแกนักรบขามพรมแดน แลวพวกเขาจะพยายามกอรัฐประหารตอรัฐบาลทุนนิยมที่ฉอฉลของตน!"
 YUG_abandon_communist_effort: "ลมเลิกความพยายามใน[YUG_communist_coup_target.GetNameDef]"
 YUG_abandon_communist_effort_desc: "เห็นไดชัดวาประชาชนของ[YUG_communist_coup_target.GetNameDef]ยังไมพรอมจะปลดแอกตนเองจากพันธนาการของรัฐบาล และเราตองลมเลิกความพยายามที่จะปลุกปนรัฐประหารคอมมิวนิสตในประเทศของพวกเขา"
 YUG_uprising_strength_tt: "ดวยแรงสนับสนุนในปจจุบัน ความแข็งแกรงของ§Yฝายคอมมิวนิสต§!จะอยูในระดับ [YUG_communist_coup_target.Get_Yugo_Uprising_strength]\nซึ่งอิงจากแรงสนับสนุน§Yคอมมิวนิสต§!ในปจจุบันและจํานวนครั้งที่ชาวนาไดรับการติดอาวุธ"
