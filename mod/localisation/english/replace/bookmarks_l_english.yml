 YUG_GATHERING_STORM_DESC: "ยูโกสลาเวียถือกําเนิดขึ้นหลังจากรัฐใหมของชาวเซิรบ โครแอต และสโลวีน รวมเขากับราชอาณาจักรเซอรเบียซึ่งเดิมเปนเอกราชในป 1922 ในชวงแรกยูโกสลาเวียไดเขารวมทั้งความตกลงไตรภาคีนอยและกติกาสัญญาบอลขานเพื่อรักษาเอกราช แตเมื่อไมนานมานี้ การลอบปลงพระชนมพระเจาอเล็กซานดาร ประกอบกับแรงกดดันภายในที่เพิ่มขึ้นจากฝายชาตินิยมและแรงกดดันภายนอกจากอิตาลีและเยอรมนี ไดกอใหเกิดความปนปวนอยางรุนแรงและการทบทวนจุดยืนทางการเมืองและยุทธศาสตรใหม"
 YUG_BLITZKRIEG_DESC: "ยูโกสลาเวียถือกําเนิดขึ้นหลังจากราชอาณาจักรใหมของชาวเซิรบ โครแอต และสโลวีน รวมเขากับราชอาณาจักรเซอรเบียซึ่งเดิมเปนเอกราชในป 1922 ในชวงแรกยูโกสลาเวียไดเขารวมทั้งความตกลงไตรภาคีนอยและกติกาสัญญาบอลขานเพื่อรักษาเอกราช แตเมื่อไมนานมานี้ แรงกดดันภายในที่เพิ่มขึ้นจากฝายชาตินิยมและแรงกดดันภายนอกจากอิตาลีและเยอรมนี ไดกอใหเกิดความปนปวนอยางรุนแรงและการทบทวนจุดยืนทางการเมืองและยุทธศาสตรใหม"
 CHI_GATHERING_STORM_DESC: "หลังการปฏิวัติที่โคนลมจักรพรรดิองคสุดทายแหงราชวงศชิง สาธารณรัฐจีนที่ยังเยาววัยตองดิ้นรนเพื่อความอยูรอด ขุนศึกปกครองดินแดนสวนใหญในเขตชายขอบ ในใจกลางประเทศ ฝายคอมมิวนิสตไดตั้งฐานที่มั่นในหุบเขาหางไกล สวนถัดออกไปจากพรมแดน ญี่ปุนไดตั้งรัฐบาลหุนเชิดภายใตจักรพรรดิองคสุดทายของจีน และจะพยายามรวมประเทศเปนหนึ่งภายใตการปกครองของพระองค\n\nเมื่อถูกศัตรูมากมายคุกคาม รัฐบาลของเจียง ไคเชก จะตองตัดสินใจอยางยากลําบากหากตองการอยูรอดและเปนใหญเหนือจีน"
 PRC_GATHERING_STORM_DESC: "เมื่อเพียงสองปกอน พรรคคอมมิวนิสตจีนเผชิญกับการถูกทําลายลางอยางสิ้นเชิง เพื่อความอยูรอด พรรคไดออกเดินทางอันยิ่งใหญที่จะเปนที่รูจักในชื่อการเดินทัพทางไกล ดวยกองทัพที่รอดพนความยากลําบากของการเดินทัพมาไดเพียงเศษเสี้ยว และอุตสาหกรรมที่มีอยูนอยนิด โอกาสที่จะไดรับชัยชนะในสงครามกลางเมืองจีนจึงริบหรี่อยางยิ่ง\n\nแตเมื่อเวลาผานไป ประชาชนอาจหันมาสนับสนุนอุดมการณคอมมิวนิสต กองทัพใหมจะถูกสรางขึ้น ฐานที่มั่นใหมจะถูกกอตั้ง และเมื่อถึงเวลาที่เหมาะสม การตอสูเพื่อการปฏิวัติจะเริ่มตนขึ้นอีกครั้ง จนกวาจะไดรับชัยชนะขั้นสุดทาย"
 CHI_BLITZKRIEG_DESC: "หลังสองปแหงสงครามกับญี่ปุน กองทัพของเจียง ไคเชก เสียเลือดเนื้อจนแทบหมดสิ้นในการพยายามหยุดยั้งการบุก ศัตรูไดยึดครองพื้นที่ที่มั่งคั่งที่สุดของประเทศ ความชวยเหลือจากประชาธิปไตยตะวันตกแทบไมมี และฝายคอมมิวนิสตก็ดูไมเต็มใจที่จะเผชิญหนากับศัตรูในการรบแบบเปด\n\nเมื่อสงครามมีแนวโนมจะลุกลามออกไปอีก ดูเหมือนวาสิ่งที่เลวรายที่สุดยังมาไมถึง แตเมื่อการบุกของญี่ปุนถูกชะลอดวยความกวางใหญของประเทศ พวกเขาอาจหันไปมองทิศทางอื่น และพันธมิตรใหมก็อาจพลิกสถานการณได..."
 PRC_BLITZKRIEG_DESC: "เมื่อเผชิญกับการบุกเต็มรูปแบบของญี่ปุน ฝายชาตินิยมและฝายคอมมิวนิสตไดทําการสงบศึกอยางไมไววางใจกัน ทั้งสองฝายตางรูดีวาแนวรวมนี้ไมอาจยั่งยืน ฐานที่มั่นของคอมมิวนิสตที่เหยียนอานบัดนี้กลายเปนแนวหนาในสงครามตอตานญี่ปุน\n\nฝายคอมมิวนิสตตองใชทรัพยากรอยางระมัดระวังหากตองการอยูรอด ความสูญเสียใด ๆ ในการตอสูกับญี่ปุนจะสงผลเปนสองเทาเมื่อถึงเวลาตองทําสงครามกับฝายชาตินิยม และนี่อาจเปนสิ่งที่รัฐบาลของเจียง ไคเชก กําลังหวังไว..."
 MAN_GATHERING_STORM_DESC: "ปูยี จักรพรรดิองคสุดทายของจีน ถูกขับออกจากบัลลังกมังกรเมื่อพระชนมายุเพียงหกพรรษา และไดรอคอยโอกาสมาโดยตลอด ขณะที่อาณาจักรเดิมของพระองคแตกแยกในสงครามกลางเมืองจีน ปูยีไดพบพันธมิตรใหมในญี่ปุน\n\nสําหรับปูยี การกอตั้งจักรวรรดิแมนจูกัวในป 1932 เปนเพียงกาวแรกในการทวงคืนสิทธิโดยกําเนิดจากบรรพบุรุษ ในขณะนี้ พระองคยังตองพึ่งพากองทัพญี่ปุนเพื่อรักษาอํานาจ แตเมื่อเวลาผานไป อาจมีโอกาสใหสลัดพันธนาการแหงการเปนขารับใช และกลายเปนสิ่งที่พระองคถือกําเนิดมาเพื่อเปน..."
 MAN_BLITZKRIEG_DESC: "ปูยี จักรพรรดิองคสุดทายของจีน ถูกขับออกจากบัลลังกมังกรเมื่อพระชนมายุเพียงหกพรรษา และไดรอคอยโอกาสมาโดยตลอด ขณะที่อาณาจักรเดิมของพระองคแตกแยกในสงครามกลางเมืองจีน ปูยีไดพบพันธมิตรใหมในญี่ปุน\n\nสําหรับปูยี การกอตั้งจักรวรรดิแมนจูกัวในป 1932 เปนเพียงกาวแรกในการทวงคืนสิทธิโดยกําเนิดจากบรรพบุรุษ ในขณะนี้ พระองคยังตองพึ่งพากองทัพญี่ปุนเพื่อรักษาอํานาจ แตเมื่อเวลาผานไป อาจมีโอกาสใหสลัดพันธนาการแหงการเปนขารับใช และกลายเปนสิ่งที่พระองคถือกําเนิดมาเพื่อเปน..."
  MAN_TSR_GATHERING_STORM_DESC: "จักรวรรดิแมนจูเรียตั้งอยูบนรากฐานที่สั่นคลอน จักรวรรดินี้ถูกกอตั้งขึ้นในป 1932 เพื่อใหญี่ปุนมีความชอบธรรมในการปกครองแมนจูเรีย โดยญี่ปุนเลือกใหปูยีเปนจักรพรรดิของรัฐใหมนี้\n\nคําถามในตอนนี้คือ ปูยีจะยังคงอยูในเงามืดตอไปขณะที่สมาคมคองคอรเดียและกองทัพญี่ปุนปกครองประเทศ หรือพระองคจะพยายามทวงคืนอํานาจ และอาจสูญเสียอํานาจทั้งหมดใหกับกลุมโจรที่หมายปองบทบาทนั้นเชนกัน?"
 MAN_TSR_BLITZKRIEG_DESC: "แมนจูกัว ซึ่งครั้งหนึ่งเคยเปนรัฐเศษเสี้ยวที่กองทัพญี่ปุนแบงแยกออกมาจากภาคเหนือของจีน และยึดเหนี่ยวความชอบธรรมทุกเสนสายดวยการคํ้าจุนปูยีใหเปนจักรพรรดิ บัดนี้ไดกลายเปนสมาชิกเต็มตัวของวงไพบูลยรวมแหงมหาเอเชียบูรพาแลว คําถามในตอนนี้คือรัฐจะยังคงอยูในมือของสมาคมคองคอรเดีย หรือจะตกไปอยูในมือของปูยี"
 WARLORDS_GATHERING_STORM_DESC: "ความออนแอของรัฐบาลกลางอาจเปดโอกาสใหบุรุษที่มีความทะเยอทะยานมากพอไดกาวขึ้นสูอํานาจ ตามชายขอบของประเทศ ผูนําทองถิ่นไดแบงเขตปกครองเล็ก ๆ ของตนเอง โดยแทบไมสนใจคําสั่งของรัฐบาลกลาง \n\nสงครามกําลังมาถึง และขุนศึกแตละคนตองเผชิญกับทางเลือกที่ยากลําบาก: รวมมือกับรัฐบาลกลาง หรือเปนพันธมิตรกับฝายคอมมิวนิสต? ทั้งสองทางเลือกลวนใหโอกาสไดที่นั่งบนโตะเจรจา แตยังมีความเปนไปไดที่สาม - คือการยึดจีนไวเปนของตนเองทั้งหมด"
 WARLORDS_BLITZKRIEG_DESC: "สงครามกับญี่ปุนบีบใหขุนศึกจีนตองเลือกขาง แตไมตองสงสัยเลยวาพันธมิตรนี้กําลังอยูบนเวลาที่หยิบยืมมา วันหนึ่งพันธมิตรนี้จะหมดประโยชน และในวันนั้นเกมจะเปดกวางอีกครั้งสําหรับทุกคนที่ทะเยอทะยานและโหดเหี้ยมมากพอที่จะชิงตําแหนงผูปกครองจีน"
 MEXICO_GATHERING_STORM_DESC: "เม็กซิโกเผชิญกับสงครามกลางเมืองยาวนานสองทศวรรษหลังการโคนลมทรราชปอรฟริโอ ดีอัซ ฝายรวมศูนยอํานาจตอสูกับฝายนิยมภูมิภาค ชาวนาและนักสังคมนิยมรวมตัวตอตานเจาของที่ดินฮาเซียนดา และการตอสูวาดวยบทบาทของรัฐกับศาสนาก็หลุดออกมาจากบันทึกแหงยุคเรืองปญญาเพื่อสรางความหวาดกลัวใหแกเม็กซิโก\n\nรัฐบาลฝายฆราวาสนิยมยืนกรานวาตนเปนผูชนะในการตอสูเหลานี้ แตก็นั่งอยูบนบัลลังกแหงซากปรักหักพัง เมื่อเม็กซิโกไดรับการฟนฟูขึ้นใหม บางทีอาจมีผูชนะคนอื่นปรากฏขึ้นมาก็ได"
 MEXICO_BLITZKRIEG_DESC: "รัฐบาลของลาซาโร การเดนัส ไดแสดงใหเห็นวาเปนพลังขับเคลื่อนการเปลี่ยนแปลงทางสังคมในเชิงบวกที่ยิ่งใหญกวารัฐบาลของประธานาธิบดีปลูตารโก กาเยส ผูมากอน ซึ่งบัดนี้ถูกเนรเทศไปยังอเมริกาแลว เมื่อสถานการณเศรษฐกิจมีเสถียรภาพ และบริษัทนํ้ามันตางชาติถูกนํามาอยูภายใตการดูแลของรัฐ รัฐบาลเม็กซิโกก็สามารถเริ่มมองออกไปภายนอกได อเมริกากําลังเผชิญศัตรูในหลายแนวรบและนาจะยอมใหอภัยการโอนกิจการสแตนดารดออยลเปนของรัฐ แตการผูกมิตรกับศัตรูเหลานั้นอาจใหผลตอบแทนที่คุมคายิ่งกวา..."
 NETHERLANDS_GATHERING_STORM_DESC: "รัฐบาลเนเธอรแลนดจับตาความตึงเครียดระดับโลกที่ทวีขึ้นดวยความกังวล ดวยเศรษฐกิจที่ยํ่าแย ขบวนการสันตินิยมที่ทรงพลัง และความเชื่อมั่นอยางแรงกลาในความเปนกลางจนถึงขั้นผลักไสพันธมิตรที่อาจเปนไปไดออกไป พวกเขาจึงไมสามารถเตรียมการปองกันไดอยางเหมาะสม\n\nในขณะเดียวกัน ความสําคัญของเนเธอรแลนดในฐานะประตูการคาสูภาคพื้นทวีป ทําใหทั้งอังกฤษและเยอรมนีตางตองการ 'ความรวมมือ' จากดัตชเพื่อขัดขวางอีกฝาย และอาจถือวาการปฏิเสธเปนเหตุแหงการเปนปรปกษ บางทีการถอยไปยังอาณานิคมอาจเปนหนทางเดียวที่จะตานทานการรุกรานเชนนั้นได..."
 NETHERLANDS_BLITZKRIEG_DESC: "สงครามระหวางเยอรมนีกับมหาอํานาจยุโรปอื่น ๆ ดูเหมือนจะหลีกเลี่ยงไมได และแมเนเธอรแลนดจะฝากความหวังไวกับความเปนกลางของตนอีกครั้ง บรรดาผูนําก็กําลังพิจารณาจัดทําแผนเสนาธิการลับรวมกับเพื่อนบานทางใต เพื่อเตรียมรับมือกับการสูรบที่อาจเกิดขึ้น\n\nกองทัพไดรับการระดมพลแลว และงานสรางแนวปองกันของดัตชก็เรงรัดยิ่งขึ้น เพื่อเตรียมประเทศใหพรอมที่สุดในการปองกันการละเมิดอธิปไตยใด ๆ หากทําไมสําเร็จ ก็ยังมีอาณานิคมเหลืออยูเสมอ..."
 SPAIN_GATHERING_STORM_DESC: "ในชวงหาปแรกของการกอตั้ง สาธารณรัฐสเปนที่สองซึ่งยังไมมั่นคงตองเผชิญทั้งการนัดหยุดงาน ความพยายามรัฐประหารของทหาร และการลุกฮือปฏิวัติครั้งใหญ แมจะผานพนความทาทายเหลานี้มาได สังคมสเปนก็ยังคงเต็มไปดวยความแตกแยกทางการเมืองและความรุนแรงระหวางกลุมอนาธิปไตย คอมมิวนิสต และฟาลังเฆ\n\nทั้งสองฝายตางจับตามองการเลือกตั้งทั่วไปป 1936 ที่กําลังจะมาถึงดวยความหวัง แตไมนาเปนไปไดที่ชัยชนะของฝายใดจะนําเสถียรภาพกลับคืนมา และในขณะที่ความรุนแรงยังดําเนินตอไป กองทัพก็เฝารอและวางแผนการ..."
 SPAIN_BLITZKRIEG_DESC: "สงครามกลางเมืองที่ทําลายลางประเทศมาตลอดสามปไดสิ้นสุดลงในที่สุด ภายใตการนําของฟรังโก ฝายผูชนะตองดูแลการฟนฟูสเปน การกวาดลางกลุมตอตานที่ยังหลงเหลืออยู และการสมานรอยราวที่สงครามไดกอขึ้น\n\nอยางไรก็ตาม เวลามีไมมากนัก เพราะโลกทั้งใบยังคงเดินหนาอยางไมอาจหยุดยั้งสูสงครามที่ยอมใหญกวาและนองเลือดยิ่งกวาเดิม หากสเปนจะยืนหยัดได ไมตองพูดถึงการเก็บเกี่ยวโอกาสจากความขัดแยงที่กําลังจะมาถึง ก็ตองเตรียมอุตสาหกรรมและกองทัพใหพรอมโดยไมชักชา"
 PORTUGAL_GATHERING_STORM_DESC: "นับตั้งแตซาลาซารขึ้นสูอํานาจในป 1932 โปรตุเกสก็คอย ๆ ถอยหางจากยุคสาธารณรัฐที่หนึ่งอันไรเสถียรภาพ ความเปนอิสระทางการคลังและความเปนอิสระทางการเมืองจากมหาอํานาจนําไปสูการกอตั้งเอชตาดูโนโว ซึ่งวางรากฐานใหแกการพัฒนาอุตสาหกรรมของโปรตุเกสและการปฏิรูปกองทัพใหทันสมัย \n\nบัดนี้ โปรตุเกสตองตัดสินใจเลือกหนทางขางหนา ขณะที่ความไมมั่นคงทางการเมืองและสังคมในสเปนเพื่อนบานทวีความรุนแรงขึ้น และความตึงเครียดระหวางประเทศก็เลวรายลงอยางสิ้นหวัง..."
 PORTUGAL_BLITZKRIEG_DESC: "รัฐบาลอนุรักษนิยมของซาลาซารทําใหโปรตุเกสคงความเปนกลางไดตลอดสงครามกลางเมืองสเปน ขณะเดียวกันก็สนับสนุนฝายชาตินิยมอยางแข็งขัน จนทําใหฝายคอมมิวนิสตและอนาธิปไตยพายแพ \n\nเมื่อคาบสมุทรไอบีเรียกลับคืนสูเสถียรภาพในที่สุด ก็ถึงเวลาที่จะมองออกไปภายนอกเพื่อหาพันธมิตรที่เปนไปได และพิจารณาบทบาทที่โปรตุเกสจะมีในความขัดแยงระดับโลกที่ดูเหมือนจะหลีกเลี่ยงไมได"
 LIT_GATHERING_STORM_DESC: "ดวยโปแลนดที่ยังกระหายจะดึงลิทัวเนียเขาสูเครือจักรภพใหม สหภาพโซเวียตที่ไมยอมรับสิทธิในการกําหนดชะตากรรมตนเองของลิทัวเนีย และภัยคุกคามจากนาซีที่เพิ่มขึ้นในภูมิภาคเมเมล ทหารผานศึกจากสงครามประกาศเอกราชผูหนึ่งจึงกาวขึ้นมาเพื่อรักษาเสถียรภาพและเอกราชของชาติลิทัวเนีย ดวยทรัพยากรอันจํากัดที่มีอยู อันตานัส สเมโตนา นั่งอยูบนหัวของระบอบที่ไรเสถียรภาพ โดยมีกองกําลังกึ่งทหารฟาสซิสตหมาปาเหล็กออกตระเวนไปทั่วชนบท ดวยความโกรธแคนที่ผูนําของพวกเขาถูกจําคุก นั่นคือ เอากุสตินัส โวลเดมาราส เมื่อสงครามใกลเขามา ลิทัวเนียตองปกปองประชาชนของตน ไมวาจะตองแลกดวยสิ่งใด"
 LIT_BLITZKRIEG_DESC: "เวทีพรอมแลว อันตานัส สเมโตนา ไดกุมอํานาจเผด็จการไวอยางมั่นคง และความฝนที่จะฟนฟูสาธารณรัฐลิทัวเนียก็อยูไกลเกินเอื้อม มีการทําขอตกลงกับโซเวียตใหคืนวิลนีอุสแกลิทัวเนียเมื่อมีการแบงแยกโปแลนด แตสเมโตนาจะไวใจสตาลินและเครื่องจักรสงครามอันกระหายของเขาใหเคารพอธิปไตยของลิทัวเนียไปตลอดไดมากเพียงใด?"
 LAT_GATHERING_STORM_DESC: "สองปผานไปนับตั้งแตรัฐประหารเดือนพฤษภาคม และลัตเวียยังคงอยูในสภาพไมแนนอน การลิส อุลมานิส ผูเคยดํารงตําแหนงนายกรัฐมนตรีของลัตเวีย บัดนี้ตั้งตนเปนผูเผด็จการ โดยฝายสนับสนุนประชาธิปไตยตอตานการโจมตีเสรีภาพของลัตเวียครั้งนี้อยางหนัก องคกรฟาสซิสตแปรกอนกรุสตถูกยั่วยุจากการจับกุมผูนําของพวกเขา กุสตาฟส เซลมินช และหากระบอบเผด็จการไมกําจัดภัยคุกคามนี้อยางรวดเร็ว ลัตเวียก็เสี่ยงตอสงครามกลางเมือง\n\nดวยภัยคุกคามทั้งจากตะวันออกและตะวันตก ลัตเวียจึงพบวาตนกําลังเดินอยูบนคมมีดระหวางชัยชนะกับความสูญสลาย"
 LAT_BLITZKRIEG_DESC: "การพึ่งพาการคากับโซเวียตมากเกินไปของลัตเวียไดยอนกลับมาเลนงานระบอบเผด็จการในที่สุด สหภาพโซเวียตและไรชเยอรมันไดแสดงเขี้ยวเล็บ และกําลังหายใจรดตนคออุลมานิส การระดมพลอยางรวดเร็วเปนสิ่งจําเปนหากจะรักษาเอกราชของลัตเวียไว เวนแตระบอบเผด็จการจะเลือกหมอบราบและออนวอนขอความเมตตาจากโซเวียต..."
 EST_GATHERING_STORM_DESC: "ดวยภัยคุกคามจากคอมมิวนิสตทางตะวันออกและฟาสซิสตทางใต คอนสตันติน แพตส และพรรคอีซามาลีต จึงยึดอํานาจควบคุมประเทศทั้งหมดเพื่อรักษาอนาคตของเอสโตเนีย กลุมทหารผานศึกสงครามประกาศเอกราชเอสโตเนียไดรวมตัวกันเปนขบวนการที่เรียกวาวาปส กลุมประชานิยมฝายขวาที่ตองการแยงชิงอํานาจปกครองประเทศจากมือของฝายเปนกลาง\n\nอนาคตของเอสโตเนียยังไมแนนอน แพตสจะรักษาสันติภาพและนํามาซึ่งยุคแหงความเงียบงัน หรือวาปสจะยึดอํานาจและกอตั้งรัฐเอสโตเนียใหม?"
 EST_BLITZKRIEG_DESC: "เอสโตเนียติดกับอยูระหวางภัยแดงทางตะวันออกกับทะเล และพบวาตนไรความชวยเหลือจากพันธมิตรในอดีต แมการยอมจํานนจะดูเหมือนหลีกเลี่ยงไมได ชาติเอสโตเนียก็อาจอยูรอดตอไปได ไมวาจะในฐานะทาสของสหภาพโซเวียต หรือในฐานะขบวนการตอตานใตดินที่สูรบจากในปา"
 BUL_GATHERING_STORM_DESC: "นับตั้งแตสงครามปลดปลอยป 1878 และการที่ประชาธิปไตยตะวันตกปฏิเสธสนธิสัญญาซานสเตฟาโน บัลแกเรียไดผานประวัติศาสตรอันยาวนานแหงความขัดแยงและการทรยศหักหลังในคาบสมุทรบอลขาน ในฐานะสมาชิกฝายมหาอํานาจกลางที่พายแพในมหาสงคราม บัลแกเรียตองสูญเสียดินแดนอยางหนัก และสนธิสัญญานอยยี-ซูร-แซนไดกําหนดมาตรการลงโทษทางเศรษฐกิจอันรุนแรงและขอจํากัดทางทหารอยางเขมงวด \n\nแตดวยการเปลี่ยนแปลงครั้งใหญทางการเมืองและสังคมที่เกิดขึ้นในยุโรป ถึงเวลาแลวที่บัลแกเรียจะเลือกเสนทางของตนเองและคนหาที่ทางอันชอบธรรมในคาบสมุทรบอลขาน"
 BUL_BLITZKRIEG_DESC: "ตลอดหลายปที่ผานมา ซารบอริสไดรวบอํานาจของพระองค ยุบองคกรสมคบคิดซเวโน และปรับทิศทางการเมืองระหวางประเทศของบัลแกเรียใหหันไปหาเยอรมนี การเจรจาลาสุดกับเพื่อนบานในบอลขานทําใหสหราชอาณาจักรยกเลิกขอจํากัดทางทหารที่บังคับใชกับประเทศหลังมหาสงคราม ดวยหวังวาจะปองกันไมใหบัลแกเรียเขารวมกับฝายอักษะ \nบัดนี้ ซารทรงตองการเอาดินแดนที่สูญเสียไปในอดีตคืนมาโดยไมลากประเทศเขาสูความขัดแยงครั้งใหม แตเมื่อความตึงเครียดระหวางประเทศในยุโรปเพิ่มสูงขึ้น ก็ยังตองรอดูวาอนาคตของบัลแกเรียจะเปนเชนไร..."
 GRE_GATHERING_STORM_DESC: "กรีซเปนชาติที่อยูในภาวะวิกฤต ฝายนิยมกษัตริยและฝายนิยมสาธารณรัฐไดตอสูแยงชิงจิตวิญญาณของชาติอยางดุเดือด จนนําไปสูการลมเลิกสาธารณรัฐเฮลเลนิกที่สองในป 1935 กษัตริยผูเปนชาวตางชาติและปกครองแบบอัตตาธิปไตย ยังคงเปนบุคคลที่สรางความแตกแยกอยางมากและมีอนาคตไมแนนอน \n\nขณะที่มัวแตวุนอยูกับการเมืองภายในอันจุกจิก บัลแกเรียผูมุงรายและคิดแกแคนก็ถูกปลอยใหบมเพาะอยูทางเหนือ สวนตุรกี ศัตรูเกาแกและพันธมิตรใหมของกรีซ ก็กําลังผานการเปลี่ยนแปลงทางการเมืองครั้งใหญทางตะวันออก และนั่นยังไมตองพูดถึงอสุรกายที่กําลังตื่นขึ้นอีกฟากหนึ่งของทะเลเอเดรียติก..."
 GRE_BLITZKRIEG_DESC: "ภายใตการปกครองอันเขมแข็งของผูเผด็จการ อิโออันนิส เมทาซัส เสถียรภาพไดกลับคืนสูกรีซ แผนสี่ปทําใหฐานอุตสาหกรรมของกรีซเติบโตอยางมหาศาลในชวงไมกี่ปที่ผานมา และหนี้สินของประเทศ แมจะยังสูงเกินควร ก็ดูเหมือนจะพอจัดการไดบาง \n\nนาเสียดายที่รัฐบาลอันเขมแข็งและนโยบายเศรษฐกิจที่สมเหตุสมผลอาจไมชวยอะไรชาติที่ตกอยูในอันตรายนี้เลย สงครามอันยิ่งใหญและนาสะพรึงกลัวกําลังกอตัวขึ้นที่ขอบฟา และแมเมทาซัสจะยืนกรานหนักแนนวากรีซจะคงความเปนกลางตลอดความขัดแยงใด ๆ ที่อาจเกิดขึ้น แตทายที่สุดแลวการตัดสินใจนั้นอาจไมไดอยูในมือของเขา..."
 TUR_GATHERING_STORM_DESC: "สาธารณรัฐตุรกีถือกําเนิดขึ้นจากเถาถานของจักรวรรดิออตโตมัน เอกราชของตุรกีไดมาดวยเลือดและกระสุนในการทัพแหงชาติป 1923 และแมการตอสูนั้นจะชอบธรรม แตราคาที่ตองจายยังคงเปนภาระหนักอึ้งตอชาวตุรกี \n\nกลุมอนุรักษนิยมทางศาสนาสรางปญหาในพื้นที่หางไกลและตอตานความพยายามปฏิรูปประเทศใหทันสมัยอยางรุนแรงที่สุด ขณะที่กลุมชาตินิยมเคิรดกอความวุนวายทางตะวันออกของประเทศ ประธานาธิบดีมุสตาฟา เคมาล อตาเติรก ผูไดรับการยกยองดุจวีรบุรุษ ตองรวมประเทศใหเปนหนึ่งเดียว หรือสงไมตอใหผูนําที่ทําได และตองทําโดยเร็ว เพราะปญหากําลังกอตัวในยุโรป..."
 TUR_BLITZKRIEG_DESC: "บิดาแหงชาวเติรก มุสตาฟา เคมาล อตาเติรก ไดถึงแกอสัญกรรมแลว ตุรกีเปนชาติที่อยูในความโศกเศรา บัดนี้นําโดยรัฐบุรุษผูทรงเกียรติ อิสเมต อีเนอนือ อีเนอนือรับชวงประเทศที่แตกราว ซึ่งความแตกแยกยิ่งปรากฏชัดขึ้นจากการจากไปของแสงนําทาง \n\nนอกเหนือจากปญหาภายในประเทศแลว อีเนอนือยังตองเผชิญกับโอกาสที่จะเกิดสงครามในยุโรปซึ่งอาจทําลายลางยิ่งกวามหาสงครามเสียอีก อตาเติรกมักกลาวคําขวัญวา “สันติภาพในบาน สันติภาพในโลก” อีเนอนือจะหวังรักษาสันติภาพไวไดหรือไมในยามที่วุนวายเชนนี้?"
 ETH_GATHERING_STORM_DESC: "เอธิโอเปยมีประวัติศาสตรยอนหลังไปหลายศตวรรษ และมีราชวงศจักรพรรดิที่เกาแกไมแพกัน แมไฮเล เซลาสซี จะกาวหนาไปมากในการปฏิรูปจักรวรรดิใหทันสมัย แตกระบวนการนั้นก็ตองสะดุดลงเมื่อเอธิโอเปยถูกอิตาลีโจมตีเปนครั้งที่สองในรอบ 40 ป สถานการณดูมืดมน แตหากจักรวรรดิสามัคคีกัน ก็จะหยุดยั้งผูรุกรานไดอีกครั้ง \n\nหากเอธิโอเปยจะคงความเปนอิสระ แอฟริกาตะวันออกทั้งหมดตองไดรับการปลดปลอยจากแอกการปกครองของยุโรปอยางเด็ดขาดเสียที"
 AFA_GATHERING_STORM_DESC: "ชาวอาฟารอาศัยอยูในทะเลทรายดานากิลอันกวางใหญมาชานาน ซึ่งทอดตัวจากจิบูตีทางตะวันออกไปจนถึงเอธิโอเปยทางตะวันตก อยางไรก็ตาม เมื่อไมนานมานี้ อิตาลีมีอิทธิพลเหนือรัฐนี้มากขึ้น โดยโมฮัมเหม็ด ยัยโย เอนเอียงไปทางเบนิโต มุสโสลินี มากกวาไฮเล เซลาสซี \n\nเมื่อสงครามอิตาลี-เอธิโอเปยครั้งที่สองกําลังลุกโชน ดูเหมือนวาจะตองเลือกจุดยืนในอนาคตอันใกล อนาคตของชาวอาฟารจะอยูกับอิตาลี หรือพวกเขาจะดีกวาหากยืนหยัดดวยตนเอง?"
 FIN_GATHERING_STORM_DESC: "ฟนแลนดเปนประเทศที่ยังใหม ไดรับเอกราชจากรัสเซียในป 1917 ตามมาดวยสงครามกลางเมืองอันนองเลือด บาดแผลจากสงครามยังคงสดใหม และรัฐบาลผสมของประเทศยังคงดิ้นรนที่จะทํางานรวมกันอยางมีประสิทธิภาพ สหภาพโซเวียตดูเหมือนจะหมายปองดินแดนของฟนแลนดที่อยูใกลเลนินกราด และฟนแลนดก็ยังไมพรอมรับมือกับความขัดแยงที่อาจเกิดขึ้น แตฟนแลนดก็มีประวัติศาสตรอันยาวนานแหงความกลาหาญและความมุงมั่นทางทหาร และทหารของประเทศก็จงรักภักดีตอชาติอยางแรงกลา \n\nเมื่อความตึงเครียดเพิ่มขึ้นและภัยแหงความขัดแยงกําลังคืบใกล อนาคตของฟนแลนดจึงแขวนอยูบนเสนดาย"
 FIN_BLITZKRIEG_DESC: "ฟนแลนดพบวาตนติดอยูระหวางสหภาพโซเวียตกับนาซีเยอรมนี ขณะที่ความตึงเครียดระหวางสองมหาอํานาจกําลังเพิ่มสูงขึ้น การเจรจากับสหภาพโซเวียตลมเหลว และบัดนี้รัฐบาลตองเผชิญการตัดสินใจอันยากลําบากวาจะปกปองอธิปไตยของประเทศอยางไร \n\nมีความพยายามเสริมความแข็งแกรงใหแนวปองกันของฟนแลนด แตกองทัพยังคงขาดแคลนยุทโธปกรณ สวนกองทัพอากาศและกองทัพเรือแทบไมมีอยูเลย ถึงกระนั้น ความภาคภูมิใจในชาติและความกลาหาญทางทหารอันแรงกลาของฟนแลนดก็มอบความมุงมั่นอันดุเดือดในการปกปองเอกราชของตน"
 SWE_GATHERING_STORM_DESC: "แมจะคงความเปนกลางในมหาสงคราม สวีเดนก็ตองทนทุกขอยางมากจากความพยายามของอังกฤษที่จะปดลอมเยอรมนี เมื่อความตึงเครียดบนภาคพื้นทวีปเพิ่มสูงขึ้น ชาวสวีเดนก็กังวลวาพวกตนจะตองทนทุกขจากนํ้ามือของมหาอํานาจอีกครั้ง \n\nในขณะเดียวกัน พรรคสังคมประชาธิปไตยก็พยายามหาจุดสมดุลระหวางการสรางรัฐสวัสดิการที่สามารถชวยเหลือประชาชนผูยากลําบาก กับการสรางกําลังทหารที่นาเกรงขามพอจะยับยั้งศัตรู เพื่อรักษาพันธะตอความเปนกลางที่ชาติยึดถือมานับศตวรรษ"
 SWE_BLITZKRIEG_DESC: "เสียงคํารามของมหาสงครามครั้งใหมดังขึ้นทุกวัน ขณะที่เยอรมนีกัดกรอนพรมแดนของเพื่อนบาน เมื่อมหาอํานาจนิยมทหารนี้ตองพึ่งพาแรเหล็กของสวีเดน ความกลัวก็เพิ่มขึ้นวาความทะเยอทะยานทางดินแดนของพวกเขาอาจลุกลามเลยทะเลบอลติกเขาสูสแกนดิเนเวียในไมชา \n\nเพื่อเตรียมรับภัยคุกคามดังกลาว กองทัพสวีเดนไดเริ่มติดอาวุธใหมและปรับปรุงใหทันสมัย ดวยอุตสาหกรรมปองกันประเทศที่กําลังเฟองฟู สิ่งที่เหลือใหตองรอดูก็คือ ชาติจะสามารถยับยั้งการรุกรานไดหรือไม"
 NOR_GATHERING_STORM_DESC: "นับตั้งแตไดรับเอกราชจากสวีเดนในป 1905 นอรเวยก็ดิ้นรนหาจุดยืนทางการเมืองมาตลอด และเพิ่งจะเริ่มแสดงสัญญาณของเสถียรภาพทางการเมืองและการฟนตัวจากทศวรรษ 1930 อันยากลําบาก\n\nบัดนี้ เมื่อเพื่อนบานทางใตเริ่มทะเลาะเบาะแวง สงครามก็ดูใกลเขามากวาที่เคย นอรเวยตองหาหนทางรักษาเอกราชอันเปราะบางของตน คณะรัฐมนตรีนีกอรดสโวลเดิมพันกับความเปนกลางและการลดอาวุธ เพื่อใหดูไมเปนภัยตอมหาอํานาจของยุโรปมากที่สุด แตคุณคาของแนวทางนี้ยังตองรอดูกันตอไป"
 NOR_BLITZKRIEG_DESC: "ขณะที่ไรชที่สามเติบโตทั้งดานอํานาจและขนาด กลุมฟาสซิสตภายในนอรเวยก็ดูเหมือนพรอมจะฉวยโอกาสจากการรุกรานของเยอรมนีที่อาจเกิดขึ้น เพื่อยึดอํานาจปกครองประเทศและรวมมือกับศัตรู\n\nวิดคุน ควิสลิง สมุนไรยางอายของพรรคนาซี ดูเหมือนกําลังสมคบคิดเพื่อแสวงหาอํานาจใหแกตนเองและพรรคนัสโยนัลซัมลิงของเขา ถึงเวลาแลวที่จะตองเรงเตรียมการ และใหนอรเวยยืนหยัดรวมกันเพื่อปดปองภยันตรายที่แฝงอยูทั้งภายในและภายนอก"
 DEN_GATHERING_STORM_DESC: "ขณะที่ความตึงเครียดในยุโรปกําลังเพิ่มสูงขึ้นอีกครั้ง เดนมารกพบวาตนมีกองทัพที่ออนแอ และภาวะเศรษฐกิจตกตํ่าครั้งใหญยังคงกัดกินเศรษฐกิจอยู\n\nชาวเดนมารกตองหาทางรับมือกับอัตราการวางงานที่สูงและขบวนการสุดโตงที่เติบโตขึ้นบนชายขอบทางการเมือง ขณะเดียวกันก็ตองทบทวนคุณคาของนโยบายความเปนกลางและการผอนปรนเอาใจ\n\nเดนมารกยังคงเปนผูกําหนดชะตากรรมของตนเอง แตจะนานเพียงใดนั้นยังตองรอดูกันตอไป"
 DEN_BLITZKRIEG_DESC: "เดนมารกตกอยูในสถานการณลอแหลม ดวยกองทัพที่ถูกละเลยและถูกตัดงบประมาณปแลวปเลา เพื่อเอาใจเพื่อนบานที่ใหญกวาและแข็งแกรงกวามากอยางเยอรมนี \n\nทวาการผอนปรนเอาใจก็ไมไดขัดขวางไรชเยอรมันจากการรวบอํานาจในยุโรปและอางสิทธิ์เหนือชาติอื่น ๆ บัดนี้เดนมารกตองฝากความหวังไวกับการประกาศความเปนกลาง ซึ่งเคยชวยใหพวกเขารอดพนจากมหาสงครามอันหายนะมาแลว"
 ICE_GATHERING_STORM_DESC: "ไอซแลนดมีประวัติศาสตรอันยาวนานแหงความโดดเดี่ยวและการสํารวจ เคยเปลี่ยนมือจากนอรเวยผูปกครองเดิมมาสูเดนมารกผูปกครองปจจุบัน เมื่อนอรเวยกลายเปนหุนสวนรองของสวีเดนในป 1814 และเพิ่งไดรับสิทธิปกครองตนเองในป 1919\n\nเมื่อภาวะเศรษฐกิจตกตํ่าครั้งใหญโจมตีไอซแลนด สถานการณก็ดูมืดมน และดวยความขัดแยงที่กําลังกอตัวที่ขอบฟา อาจถึงเวลาแลวที่จะกระโดดลงจากเรือและตัดความสัมพันธกับเดนมารกอยางเด็ดขาด"
 ICE_BLITZKRIEG_DESC: "ดวยขอเรียกรองลาสุดจากเยอรมนี ทุกวันยิ่งเห็นชัดขึ้นวาสถานการณในยุโรปไมอาจดํารงอยูได และการโจมตีเดนมารกแทบจะหลีกเลี่ยงไมได\n\nดวยเหตุนี้ อนาคตของไอซแลนดจึงแขวนอยูบนปากเหว และเธอคงตองขอความคุมครองจากชาวอเมริกัน หากตองการอยูนอกความขัดแยงที่กําลังจะเริ่มขึ้นในไมชา"
 BRA_GATHERING_STORM_DESC: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญไดทําลายเศรษฐกิจของบราซิล เนื่องจากการพึ่งพาการสงออกมากเกินไป ในปตอ ๆ มาความปนปวนทางการเมืองทวีขึ้น เมื่อแนวรวมของนายทหาร แรงงาน และนักการเมืองโคนลมคณาธิปไตยที่ปกครองประเทศ และแทนที่ดวยรัฐธรรมนูญประชาธิปไตยอันเปราะบาง \n\nเจตูลียู วารกัส ไดกาวขึ้นมาเปนแถวหนาของการเมืองบราซิล เพิ่งปราบรัฐประหารของคอมมิวนิสตและรับอํานาจฉุกเฉินมาไวในมือ ยังตองรอดูวาประชาธิปไตยจะไดรับการฟนฟู หรือวารกัสจะนําประเทศไปในทิศทางที่เปนเผด็จการมากขึ้น"
 BRA_BLITZKRIEG_DESC: "เจตูลียู วารกัส ไดยึดอํานาจรัฐบาลและระงับกระบวนการประชาธิปไตย เมื่อกุมอํานาจไวมั่นคงแลวในขณะนี้ ผูนําบราซิลจึงหันมาสนใจกิจการระหวางประเทศ สงครามในยุโรปดูเหมือนจะหลีกเลี่ยงไมได และความหวาดระแวงวาอารเจนตินาจะรุกลํ้าดินแดนบราซิลก็วนเวียนอยูในความคิดของผูนําประเทศ แตก็ยังมีความหวังวาการเขาขางสหรัฐอเมริกาจะชวยรักษาอนาคตของบราซิลไวได"
 ARG_GATHERING_STORM_DESC: "ในป 1930 คณะรัฐมนตรีของอิโปลิโต อีรีโกเยน ถูกโคนลมในรัฐประหารโดยทหารครั้งแรกนับตั้งแตมีการประกาศใชรัฐธรรมนูญอารเจนตินา นําไปสูยุคที่รูจักกันในชื่อทศวรรษอัปยศ อารเจนตินาตองหาทางผานโลกที่เปลี่ยนแปลงอยางรวดเร็ว ซึ่งมหาอํานาจตาง ๆ คุกคามสันติภาพอันเปราะบางที่ดํารงมาตั้งแตมหาสงครามสิ้นสุดลง \n\nภัยคุกคามใดที่สําคัญกวากัน? พายุที่กําลังกอตัวในยุโรป? เพื่อนบานของพวกเขาเอง? หรือตัวพวกเขาเอง? อารเจนตินาจะตองยืนหยัดและสรางที่ยืนอันมั่นคงบนเวทีโลก"
 ARG_BLITZKRIEG_DESC: "ผานการเลือกตั้งที่ทุจริตที่สุดในประวัติศาสตรอารเจนตินา กลุมกอนกอรดันเซียยังคงครองเสียงขางมากในรัฐบาล โดยมีโรเบรโต มาริอา ออรติซ เปนประธานาธิบดีปกครองประเทศ \n\nอยางไรก็ตาม เมื่อความตึงเครียดเพิ่มขึ้นระหวางมิตรที่ใกลชิดที่สุดสองประเทศของอารเจนตินาในยุโรป ประเทศจึงตองเตรียมพรอมสําหรับสิ่งที่หลีกเลี่ยงไมได คือการถูกฉุดกระชากระหวางสองฝาย ไมเพียงเทานั้น ความไมพอใจในกองทัพยังเพิ่มขึ้น และความหวาดระแวงตอคูแขงทางเหนือที่ยังคงหลับใหลก็ถูกปลุกปนอยูตลอด อารเจนตินายืนอยูบนทางแยกสําคัญ และตองคิดอยางรอบคอบวาจะรับมืออยางไร"
 CHL_GATHERING_STORM_DESC: "ผลจากวิกฤตวอลลสตรีท ทําใหสหรัฐอเมริกาหยุดนําเขาทองแดงและไนเตรตจากชิลี ซึ่งเปนแหลงรายไดหลักของประเทศ สงผลใหชิลีกลายเปนประเทศในอเมริกาใตที่ไดรับผลกระทบจากภาวะเศรษฐกิจตกตํ่ารุนแรงที่สุด และความไมมั่นคงทางการเมืองซึ่งยิ่งเลวรายลงจากภาวะเศรษฐกิจตกตํ่าก็ยังไมไดรับการแกไข \n\nขณะที่วาระของอารตูโร อาเลสซานดรี ใกลสิ้นสุดลงเปนครั้งสุดทาย ขบวนการฟาสซิสตก็กําลังรุงเรือง และประเทศยังจดจํารัฐประหารหลายครั้งในทศวรรษกอนไดอยางชัดเจน รวมถึงสาธารณรัฐสังคมนิยมชิลีในป 1932 ดวย"
 CHL_BLITZKRIEG_DESC: "หลังจากความพยายามรัฐประหารของฆอรเฆ กอนซาเลซ ฟอน มาเรส และพวกนาซิสตาเพิ่งถูกจัดการไป อารตูโร อาเลสซานดรี ก็ลงจากตําแหนง และเปโดร อากีรเร เซรดา ไดรับเลือกเปนประธานาธิบดีคนใหมของชิลี อยางไรก็ตาม ภัยคุกคามจากกองทัพยังคงใกลตัว และดูเหมือนวานายพลอาริออสโต เอรเรรา และผูสนับสนุนของเขากําลังจะพยายามกอรัฐประหารของตนเองในไมชา \n\nสงครามก็กําลังกอตัวที่ขอบฟาเชนกัน เมื่อความตึงเครียดเพิ่มขึ้นไมเพียงในยุโรปและเอเชีย แตยังรวมถึงในแอมะซอน ใกลกับดินแดนใจกลางของชิลีดวย"
 PAR_GATHERING_STORM_DESC: "แมเพิ่งไดรับชัยชนะจากสงครามชาโกอันนองเลือดกับโบลิเวีย ประเทศก็ออนลาทางเศรษฐกิจและถูกทําใหเปนรัฐทหารอยางหนัก โดยอายาลาผูไมเปนที่นิยมไมสามารถควบคุมสถานการณได เพราะเขาและมือขวาอยางโฆเซ เฟลิกซ เอสติการริเบีย ถูกตําหนิวาเปนตนเหตุที่ทําใหเกิดสงครามขึ้นตั้งแตแรก\n\nกองทัพซึ่งรวมตัวกันอยูเบื้องหลังราฟาเอล ฟรังโก และขบวนการสังคมนิยมเฟเบรริสตา ดูเหมือนกําลังเตรียมขับไลรัฐบาล และดูเหมือนวาพวกเขาจะไมยอมถอยโดยไมสู"
 PAR_BLITZKRIEG_DESC: "เมื่อรัฐประหารของฝายเฟเบรริสตาขับไลอายาลาและพวกพองเสรีนิยมของเขาไดสําเร็จ หลายคนตางหวังใหราฟาเอล ฟรังโก ลางแคนความอัปยศมากมายของชาติและโจมตีโบลิเวียอีกครั้ง แมวาสิ่งนี้ดูจะเปนไปไดยากยิ่งขึ้นทุกที \n\nนายทหารบางสวนกําลังวางแผนโคนลมเขาแลวแทนที่ดวยอีฮินีโอ โมรีนีโก โดยอาศัยความชวยเหลือจากองคกรกึ่งทหารฟาสซิสตกิออนโรโฆ เพื่อแสวงหาความสัมพันธที่ใกลชิดยิ่งขึ้นกับฝายอักษะ"
 URG_GATHERING_STORM_DESC: "ในเหตุการณที่เรียกวารัฐประหารอุรุกวัยป 1933 ประธานาธิบดีกาเบรียล เตรรา ไดรัฐประหารรัฐบาลของตนเอง ยุบรัฐสภา ลดทอนกลไกถวงดุลตามรัฐธรรมนูญ และปกครองดวยวิธีที่เปนเผด็จการมากขึ้นเรื่อย ๆ จนถึงตอนนั้น อุรุกวัยเคยเปนหนึ่งในประเทศประชาธิปไตยที่กาวหนาที่สุดในละตินอเมริกาภายใตโฆเซ บาตเย อี ออรโดเญซ ดวยหลักการเสรีนิยมที่เรียกวาบาตยิสโม\n\nหนี้ตางประเทศไมไดชวยใหสถานการณทางการเมืองดีขึ้น และบัดนี้สาธารณรัฐตะวันออกแหงนี้ก็ตกอยูทามกลางระบอบเผด็จการ ซึ่งไมอาจคงอยูไดตลอดไป"
 URG_BLITZKRIEG_DESC: "อดีตผูเผด็จการกาเบรียล เตรรา เพิ่งสงมอบอํานาจใหแกอัลเฟรโด บัลโดมีร นองเขยของเขา ซึ่งเปนสมาชิกพรรคโกโลราโดเชนกัน ดวยความที่เขามีแนวคิดเสรีนิยมมากกวาและนิยมฝายสัมพันธมิตร ดูเหมือนวาประเทศถูกลิขิตใหกาวเดินบนเสนทางประชาธิปไตยเสรีนิยมอีกครั้ง และชวยเหลือมหาอํานาจในการธํารงกฎหมายและระเบียบระหวางประเทศ"
 AUS_GATHERING_STORM_DESC: "ยังคงสั่นคลอนจาก 'การยุบตัวเองของรัฐสภา' ในป 1934 และการลอบสังหารนายกรัฐมนตรีเอ็งเงิลแบรท ดอลลฟุส ที่ตามมา ความตึงเครียดภายในออสเตรียยังคงสูง ดวยพันธะจากสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลอันเขมงวด และวิกฤตเศรษฐกิจที่ตองเผชิญ ผูนําออสเตรียภายใตนายกรัฐมนตรีชุชนิกกจึงตองตัดสินใจในเรื่องที่ยิ่งใหญมหาศาล จะยอมรับชะตากรรม หากเยอรมนีมาเอาตัว? จะตอตานจนถึงที่สุด ทั้งทางการทูตหรือทางทหาร? หรือจะมองยอนไปยังอดีต เคยเปนจักรวรรดิอยางไร ก็จะเปนจักรวรรดิอีกครั้ง?"
 AFG_GATHERING_STORM_DESC: "ภายใตการปกครองของกษัตริยซาฮีร ชาห และบรรดาพระปตุลา อัฟกานิสถานกําลังเขาสูยุคที่มีเสถียรภาพพอสมควร แตใตพื้นผิวของราชอาณาจักรอันเกาแกนี้ กระแสแหงความโกรธแคนและความไมไววางใจยังคงเดือดพลาน บางคนหวังใหมีการปฏิรูปอยางถึงรากดังที่อามานุลลาห ขาน ผูถูกเนรเทศเคยพยายามทํา ซึ่งบางคนเชื่อวาเขากําลังวางแผนกลับสูบัลลังก ขณะที่อีกฝายเชื่อวาการเปลี่ยนแปลงอันเชื่องชาภายใตซาฮีร ชาห ยังเร็วเกินไป และประเทศตองหวนคืนสูรากเหงาดั้งเดิม แตบางทีเมื่อโลกรอบขางไรเสถียรภาพ ประชาชนอัฟกานิสถานอาจรวมใจกันเพื่อฉวยโอกาสจากสถานการณนี้"
 AFG_BLITZKRIEG_DESC: "ขณะที่กษัตริยซาฮีร ชาห ทรงเติบโตในบทบาทของพระองค ความทาทายตอการปกครองก็ยิ่งทับถมขึ้น อังกฤษ เยอรมนี และสหภาพโซเวียต ตางแยงชิงอิทธิพลเหนือราชอาณาจักรที่ตั้งอยูในทําเลยุทธศาสตรแหงนี้ ซึ่งนํามาทั้งการลงทุนและภัยคุกคามจากการแทรกแซง ขณะเดียวกัน ผูกอความวุนวายก็ขามไปมาตามพรมแดนกับบริติชราช ปลุกปนความไมสงบทั้งสองฝง แตเมื่อโลกดิ่งลงสูสงครามอีกครั้ง คําถามในภูมิภาคนี้ก็คือ ‘อัฟกานิสถานจะทําอยางไร?’"
 BEL_GATHERING_STORM_DESC: "เบลเยียมยังคงมีบาดแผลจากประสบการณในมหาสงคราม พื้นที่สวนใหญของประเทศยังคงเปนซากปรักหักพัง และยังมีบาดแผลที่ลึกกวานั้นฝงอยูในจิตใจของประชาชน อนาคตแบบประชาธิปไตยของชาติเองก็ตกอยูในความสงสัย เมื่อถูกกลุมฟาสซิสตตาง ๆ รุมกลาวหาวาทุจริต \n\nในระดับระหวางประเทศ เบลเยียมเดินอยูบนเสนเชือกตึงระหวางพันธะตามสนธิสัญญาที่มีตอผูที่เปลี่ยนประเทศใหเปนสมรภูมิ กับความกังวลตอความมั่นคงของตนในโลกที่ไมสงบมากขึ้นทุกที"
 BEL_BLITZKRIEG_DESC: "ความไรเสถียรภาพยังคงเลนงานเบลเยียมภายในประเทศ แตก็เทียบไมไดเลยกับความไรเสถียรภาพบนเวทีโลกในขณะนี้ กองทัพของชาติไดรับการปรับปรุงใหทันสมัยและขยายกําลัง โดยใหความสําคัญอยางยิ่งกับปอมปราการอันแข็งแกรงที่ทัดเทียมแมกระทั่งแนวมาฌีโนของฝรั่งเศส \n\nรัฐบาลเบลเยียมไดละทิ้งพันธมิตรและประกาศความเปนกลางอยางสมบูรณ แตก็ไมไดหยุดยั้งการลงนามขอตกลงลับหลังฉากในกรณีที่ถูกโจมตี เบลเยียมจับตามองลัทธิทหารที่เพิ่มขึ้นของเพื่อนบานดวยความกังวลอยางยิ่ง"
 COG_GATHERING_STORM_DESC: "แมจะยังมีบาดแผลจากยุครัฐอิสระคองโกและกษัตริยเลโอโปลดที่ 2 แตเบลเจียนคองโกก็กาวมาไกลนับแตนั้น รัฐบาลอาณานิคมยังคงใชแรงงานราคาถูกในเหมือง และมีเพดานที่มองไมเห็นซึ่งทําใหประชากรสวนใหญของประเทศไมสามารถเขาถึงการศึกษาระดับสูงได แตใชวาทุกอยางจะมืดมน\n\nขณะที่ความทะเยอทะยานดานอาณานิคมของอิตาลีขยายใหญขึ้นเรื่อย ๆ และดวยผลงานที่ดีในมหาสงคราม ฟอรซปูบลีกก็กําลังเตรียมพรอมอีกครั้งเพื่อปกปองรัฐ แมจะขาดแคลนยุทโธปกรณก็ตาม"
 COG_BLITZKRIEG_DESC: "เมื่อการพิชิตอะบิสซิเนียของอิตาลีเสร็จสิ้น และไรชเยอรมันไดดินแดนใหมในยุโรป สถานการณก็ดูอันตราย ความทะเยอทะยานดานอาณานิคมของอิตาลีไมไดหยุดอยูแคแอฟริกาตะวันออก และอาจคุกคามเราในอนาคตอันใกล ขณะที่ฮิตเลอรก็กําลังจองมองเจาอาณานิคมเบลเยียมของเราอยางจริงจัง เปนกาวหนึ่งในแผนการครองความเปนใหญเหนือภาคพื้นทวีปยุโรป\n\nดูเหมือนวาสงครามจะมาถึงเราในไมชา หากเราไมบุกไปหาพวกเขากอน..."
 PER_GATHERING_STORM_DESC: "อิหราน ชาติอันยิ่งใหญที่เคยรูจักกันในชื่อเปอรเซีย พบวาตนติดอยูทามกลางหากระสุนของยักษใหญที่กําลังคําราม ขณะที่อิหรานผูเปนกลางปรับปรุงประเทศใหทันสมัยอยางรวดเร็วดวยความชวยเหลือจากไรชเยอรมัน อดีตหุนสวนอยางบริเตนใหญและสหภาพโซเวียตก็จับตามองดวยความระแวง เรซา ชาห ปาหลาวี ปฏิเสธที่จะปลอยใหสองชาตินี้รุกลํ้าอธิปไตยของอิหราน แมการรุกรานจะเปนความเสี่ยงที่มีอยูจริง\n\nความเปนกลางของอิหรานจะไดรับความเคารพหรือไม? เราพรอมจะปกปองมาตุภูมิจากผูรุกรานที่มุงรายแลวหรือยัง? หากทุกอยางลมเหลว บางทีอาจถึงเวลาที่จะมองยอนสูอดีตและจุดประกายจิตวิญญาณของจักรวรรดิเปอรเซียโบราณขึ้นอีกครั้ง..."
 IRQ_GATHERING_STORM_DESC: "ภายใตการปกครองของกษัตริยไฟซาลที่ 1 และตอมาคือพระราชโอรส กษัตริยฆอซี อิรักตองฟนฝาผลพวงอันวุนวายของสงครามโลกครั้งที่หนึ่งในฐานะดินแดนในอาณัติของอังกฤษ ราชวงศฮัชไมตพยายามรักษาสมดุลระหวางการปฏิรูปใหทันสมัยกับลัทธิชาตินิยม แตใตพื้นผิวนั้น ความไมพอใจกําลังคุกรุน ผูนําชนเผาไมพอใจอํานาจสวนกลาง ขณะที่ชนชั้นนําในเมืองผลักดันใหเปนอิสระจากอิทธิพลอังกฤษมากขึ้น กระแสนิยมอาหรับปะทะกับอัตลักษณทางชาติพันธุและศาสนาอันหลากหลายของอิรัก กอใหเกิดเอกภาพอันเปราะบาง ขณะที่โลกขยับเขาใกลความขัดแยงครั้งใหญอีกครั้ง อิรักก็โอนเอนระหวางการรวมศูนยอํานาจกับความปนปวน อนาคตไมแนนอนแตเปยมไปดวยความเปนไปได"
 IRQ_BLITZKRIEG_DESC: "ในชวงไมกี่ปที่ผานมา อิรักตกอยูในความวุนวายที่ทวีขึ้น รัฐประหารป 1936 ซึ่งนําโดยบักร ซิดกี ไดทําลายอํานาจอันเปราะบางของราชวงศฮัชไมต และสรางบรรทัดฐานอันตรายใหทหารเขาแทรกแซงการเมือง ใตพื้นผิวนั้น ความตึงเครียดคุกรุนระหวางผูนําชนเผาที่ตอตานการรวมศูนย นักปฏิรูปที่ผลักดันความทันสมัย และกองทัพที่กระสับกระสายซึ่งไดใจจากอํานาจที่เพิ่งไดมา ลัทธิชาตินิยมอาหรับกําลังรุงเรือง ทาทายอิทธิพลของอังกฤษและปลุกความฝนถึงเอกภาพในภูมิภาค ขณะที่โลกไรเสถียรภาพมากขึ้นทุกที อิรักก็ยืนอยูบนทางแยก อนาคตไมแนนอนและประชาชนแตกแยก" 
 PER_BLITZKRIEG_DESC: "อิหรานยืนอยูบนปากเหวของอนาคตอันปนปวนและไมแนนอน เมื่อสงครามเริ่มขึ้นในยุโรป เรซา ชาห ปาหลาวี เฝามองดวยความกังวล เพราะพบวาตนถูกขนาบอยูระหวางผูเลนสําคัญสองรายที่ดูเหมือนสนใจจะเขาไปพัวพันกับความขัดแยงครั้งใหญนี้\n\nอธิปไตยของอิหรานอาจถูกทาทายหากเรื่องทรัพยากรเขามาเกี่ยวของ และรัฐบาลของชาหตองเตรียมพรอมที่จะขับไลการรุกรานใด ๆ ที่อาจเกิดขึ้น คําถามก็คือ พวกเขาจะระดมพลไดทันเวลาหรือไม?"
 PHI_GATHERING_STORM_DESC: "ในป 1935 สหรัฐอเมริกาไดตกลงในที่สุดที่จะใหมีการเปลี่ยนผานสูเอกราชอยางสันติภายในระยะเวลาสิบป ฟลิปปนสยังอยูในชวงตนของกระบวนการ แตบัดนี้ก็สามารถกําหนดชะตากรรมของตนเองไดมากขึ้นเรื่อย ๆ \n\nพวกเขาจะรักษาความสัมพันธกับสหรัฐอเมริกาไว หรือจะแสวงหาการสนับสนุนจากตางชาติเพื่อเรงกระบวนการสูอิสรภาพ? ฟลิปปนสมองไปยังอนาคตอันรุงเรือง แตจะมีฉลามวนเวียนรอบชาติที่เพิ่งตั้งไขนี้อยูแลวหรือไม?"
 SIA_BLITZKRIEG_DESC: "นับตั้งแตขึ้นสูอํานาจในปลายป 1938 นายกรัฐมนตรีจอมพล ป. พิบูลสงคราม ไดปรับเปลี่ยนสยามตามแบบฉบับของตนเอง ประเทศมีชื่อใหมวา ไทย และมีหลักความเชื่อใหม ไดแก วินัยแบบทหาร ลัทธิชาตินิยมแบบรวมชาติไทย และความทะเยอทะยานทางดินแดนที่มุงไปยังชนชาติที่พูดภาษาไทยซึ่งยังอยูใตการปกครองอาณานิคมของฝรั่งเศสและอังกฤษ\n\nขณะที่ยุโรปไถลเขาสูสงครามและญี่ปุนบุกลึกเขาไปในจีน กองทัพของจอมพล ป. ก็แข็งแกรงขึ้นทุกวัน ความทะเยอทะยานของเขาไมใชความลับ คําถามเดียวคือ ไทยจะยืนเคียงขางใครเมื่อถึงเวลา"
 PHI_BLITZKRIEG_DESC: "จนถึงขณะนี้ สหรัฐอเมริกายังคงรักษาคําพูด ชวยเหลือฟลิปปนสบนเสนทางสูเอกราช \n\nในขณะเดียวกัน สงครามไดปะทุขึ้นระหวางจีนกับญี่ปุน และประเทศหมูเกาะแหงนี้ก็เฝามองความทะเยอทะยานแบบจักรวรรดินิยมของเพื่อนบานทางเหนือดวยความกังวล \n\nกําลังเสริมจากอเมริกาเริ่มเดินทางมาถึงเพื่อเสริมแนวปองกัน แตจะเพียงพอหรือไม? ญี่ปุนไดกลิ่นเลือดในนํ้าแลว"
 SIA_GATHERING_STORM_DESC: "เพียงสี่ปผานไปนับตั้งแตคณะราษฎรยุติระบอบสมบูรณาญาสิทธิราชยที่ดํารงมาหลายศตวรรษ สยามกําลังกาวแรกในฐานะรัฐธรรมนูญ แตความเปนเอกภาพก็เริ่มราวฉานแลว ฝายพลเรือนนักปฏิรูปใฝฝนถึงประชาธิปไตย ขณะที่ฝายทหารเรียกรองความแข็งแกรง วินัย และการขยายดินแดนแบบรวมชาติไทย\n\nสยามถูกโอบลอมดวยอํานาจอาณานิคมของอังกฤษและฝรั่งเศส ขณะที่ญี่ปุนซึ่งฮึกเหิมกําลังรุกคืบอยูทางเหนือ สยามจึงตองดําเนินการอยางระมัดระวัง พายุที่กําลังจะมาถึงอาจบีบใหชาติอันออนเยาวนี้ตองเลือกขาง หรือหาหนทางอยูรอดโดยไมตองเลือกขางใดเลย"
 INS_GATHERING_STORM_DESC: "ตลอดกวาสามศตวรรษ หมูเกาะอินเดียตะวันออกของดัตชเปนดั่งอัญมณีบนมงกุฎแหงจักรวรรดิอาณานิคมของเนเธอรแลนด หมูเกาะอันกวางใหญที่เต็มไปดวยเกาะ ภาษา และวัฒนธรรมมากมาย ถูกยึดโยงไวดวยกันดวยแทบไมมีสิ่งใดนอกจากรัฐบาลอาณานิคมที่ปกครองอยู\n\nการกุมอํานาจของกรุงเฮกยิ่งไมแนนอนขึ้นทุกวัน ประชาชนที่เหนื่อยหนายตอการถูกขูดรีดเปดรับขบวนการชาตินิยมมากขึ้นเรื่อย ๆ แตขบวนการเหลานี้ยังหางไกลจากความเปนเอกภาพ แตละกลุมมีวิสัยทัศนตออินโดนีเซียที่ขัดแยงกัน การที่พวกเขาจะวางความแตกตางไวและพูดเปนเสียงเดียวกันไดหรือไม อาจเปนตัวตัดสินชะตากรรมของหมูเกาะแหงนี้"
 INS_BLITZKRIEG_DESC: "เมื่อสามปกอน ซูตารดโจและคณะผูยื่นคํารองไดขอใหกรุงเฮกจัดการประชุมเรื่องการปกครองตนเองภายในหนึ่งทศวรรษ เมื่อเดือนพฤศจิกายนที่ผานมา พระราชกฤษฎีกาไดตอบกลับมา คําตอบคือไม\n\nการปฏิเสธครั้งนี้ทําในสิ่งที่การเคลื่อนไหวนานหลายปไมอาจทําได ในเดือนพฤษภาคม องคกรชาตินิยมที่ใหญที่สุดแปดแหงไดวางความขัดแยงไวและรวมตัวกันเปนสหพันธเดียว เรียกรองดวยเสียงเดียวกันใหมีรัฐสภาอินโดนีเซีย รัฐบาลอาณานิคมตอบสนองเหมือนที่เคยทํามาตลอด แตญี่ปุนกําลังบดขยี้ลงใตผานจีนเรื่อย ๆ และหมูเกาะอินเดียตะวันออกก็อยูหางไกลจากกรุงเฮกมาก"
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$" 
