l_english:
 BM_HISTORY_TITLE: "ประวัติศาสตรโดยสังเขป"
 GATHERING_STORM_NAME: "พายุตั้งเคา"
 GATHERING_STORM_DESC: "ยุคมืดกําลังคืบคลานเขามา ในยุโรป ฮิตเลอรไดรวบอํานาจไวในมืออยางมั่นคง และความสนใจของเขาก็มุงออกไปนอกพรมแดนเยอรมนีมากขึ้นทุกที อิตาลีของมุสโสลินียังคงเดินหนาผจญภัยทางทหารอยางอาจหาญ ขณะที่จักรวรรดิญี่ปุนก็พรอมจะโจมตีจีนในเอเชีย เวลาผานไปเกือบยี่สิบปนับตั้งแตมหาสงครามสิ้นสุดลง และโลกก็ถูกราดดวยนํ้ามันอีกครั้ง เพียงประกายไฟเดียวก็อาจเพียงพอ"
 HITTING_FAN_NAME: "เมื่อเรื่องบานปลาย"
 HITTING_FAN_DESC: "ใชแลว! คอลเลกชันรมของคุณกําลังจะไดใชประโยชนจริง ๆ แลว"
 ENG_GATHERING_STORM_DESC: "แมสหราชอาณาจักรจะไดรับชัยชนะในมหาสงคราม แตรากฐานของจักรวรรดิอันยิ่งใหญก็สั่นคลอนถึงแกน คนรุนที่ดีที่สุดของประเทศตองสังเวยชีวิตในสนามเพลาะแหงฟลานเดอสและภาคเหนือของฝรั่งเศส ขณะที่ความไมสงบแพรกระจายไปทั่วเครือจักรภพและหนี้สินมหาศาลก็พอกพูนขึ้น\n\nดวยบาดแผลจากสงครามครั้งกอนที่ยังคงสดใหมในความทรงจํา ประเทศกําลังเผชิญกับแนวโนมของสงครามอีกครั้ง และเริ่มชัดเจนขึ้นทุกทีวาจะไมมีสันติภาพในยุคสมัยของเรา"
 FRA_GATHERING_STORM_DESC: "แมจะไดรับความเสียหายยอยยับจากมหาสงคราม แตฝรั่งเศสก็กําลังฟนตัวดวยเศรษฐกิจที่แข็งแกรง อยางไรก็ตาม ภาวะเศรษฐกิจตกตํ่ายังคงสงผลกระทบตอประเทศ และระบอบใหมของเยอรมนีก็ไมมีความสนใจที่จะจายคาปฏิกรรมสงครามตามที่สนธิสัญญาแวรซายกําหนดไว\n\nเมื่อมีการลงนามสนธิสัญญา จอมพลชาวฝรั่งเศสผูหนึ่งไดกลาวไวอยางโดงดังวานี่ไมใชสันติภาพ แตเปนเพียงการพักรบ 20 ป และบัดนี้ 20 ปนั้นกําลังจะหมดลงอยางรวดเร็ว"
 GER_GATHERING_STORM_DESC: "เยอรมนีใหมไดผงาดขึ้นแลว สามปผานไปนับตั้งแตสาธารณรัฐไวมารถูกรื้อถอนและแทนที่ดวยไรชที่สามของฮิตเลอร เสถียรภาพทางเศรษฐกิจไดกลับคืนมาหลังผานพนชวงปอันยากลําบากของภาวะเศรษฐกิจตกตํ่าครั้งใหญ และปญหาการวางงานครั้งใหญก็ไดรับการแกไขแลว\n\nขอจํากัดทางทหารที่สนธิสัญญาแวรซายบังคับใชกับเยอรมนีถูกลืมไปนานแลว และกองทัพแวรมัคทก็แข็งแกรงขึ้นทุกวัน มหาสงครามโลกอีกครั้งกําลังปรากฏขึ้นที่ขอบฟา"
 ITA_GATHERING_STORM_DESC: "ดวยการผงาดขึ้นของลัทธิฟาสซิสต อิตาลีไดกาวเขาสูยุครุงโรจนครั้งใหม ขณะนี้กองทัพของอิตาลีกําลังผนวกเอธิโอเปยเขาเปนสวนหนึ่งของจักรวรรดิอาณานิคมอิตาลีที่กําลังขยายตัว แตความทะเยอทะยานของมุสโสลินีไมไดหยุดอยูแคนั้น\n\nการครองความเปนใหญเหนือทะเลเมดิเตอรเรเนียนคือชะตากรรมของอิตาลีมาโดยตลอด และระเบียบใหมกําลังกอตัวขึ้นในยุโรป เมื่อคลื่นยักษแหงการเปลี่ยนแปลงมาถึง อิตาลีตองหาที่ยืนบนยอดคลื่นใหได มิฉะนั้นก็เสี่ยงที่จะถูกกวาดหายไป"
 JAP_GATHERING_STORM_DESC: "จักรวรรดิญี่ปุนกําลังยืนอยูบนทางแยก โฮคุชินรอน หรือหลักนิยมขยายดินแดนขึ้นเหนือ ไดรับการสนับสนุนจากกองทัพบกและเรียกรองใหรุกเขาสูไซบีเรีย สวนนันชินรอน หรือหลักนิยมขยายดินแดนลงใต ไดรับการสนับสนุนจากกองทัพเรือ และมุงเปาไปยังอาณานิคมอันมั่งคั่งของยุโรปในเอเชียตะวันออกเฉียงใตและแปซิฟก \n\nและแนนอนวายังมีจีนอยูเสมอ ญี่ปุนมีกองทัพที่นาเกรงขาม แตอุตสาหกรรมกําลังหิวกระหายทรัพยากรและเวลากําลังจะหมดลง จะเลือกเสนทางใด?"
 SOV_GATHERING_STORM_DESC: "เมื่อฝุนควันของสงครามกลางเมืองรัสเซียจางลง สหภาพโซเวียตไดกาวขึ้นเปนผูปกครองที่ไมมีใครโตแยงเหนือดินแดนสวนใหญที่เคยเปนจักรวรรดิรัสเซีย ตามมาดวยการพัฒนาอุตสาหกรรมและการรวมที่ดินเปนนารวมอยางรวดเร็ว ซึ่งมักแลกมาดวยชีวิตมนุษยจํานวนมหาศาล \n\nบัดนี้สหภาพโซเวียตกําลังเผชิญภัยคุกคามจากเยอรมนีที่ฟนคืนกําลังทางตะวันตก และญี่ปุนที่กระหายสงครามทางตะวันออก และแนนอนวายังมีภัยคุกคามภายในจากในหมูสมาชิกพรรคคอมมิวนิสตที่ตองรับมืออีกดวย..."
 USA_GATHERING_STORM_DESC: "สหรัฐอเมริกาหวนกลับสูนโยบายโดดเดี่ยวเมื่อสงครามครั้งกอนสิ้นสุดลง และไดดื่มดํ่ากับความรุงเรืองทางเศรษฐกิจในยุคทศวรรษ 1920 ที่คึกคัก กอนที่ทุกอยางจะจบลงอยางพลิกผันเมื่อประเทศตกอยูในภาวะเศรษฐกิจตกตํ่าครั้งใหญ\n\nนโยบายไมแทรกแซงสงครามตางแดนของอเมริกายังคงหนักแนน แตความตึงเครียดกําลังทวีขึ้นทั้งในยุโรปและเอเชีย 'มหาอํานาจผูเปนกลาง' อาจพบวาตนเองถูกดึงเขาสูวังวนไมวาจะตองการหรือไมก็ตาม"
 OTHER_GATHERING_STORM_DESC: "ไมใชทุกประเทศในโลก ทั้งใหญและเล็ก ที่จะพอใจกับการกลั้นหายใจรอคอยการปะทุของความขัดแยงระดับโลกอีกครั้ง ตั้งแตมหาอํานาจที่อยูบนปากเหวสงครามกลางเมือง ไปจนถึงหลายชาติที่ถือกําเนิดและเปลี่ยนแปลงไปจากมหาสงคราม ทุกชาติลวนตองตัดสินใจอยางยากลําบาก และสรางสมดุลระหวางอุดมการณกับความเปนจริง เพื่อสงผลตออนาคตของโลก"
 POL_GATHERING_STORM_DESC: "หลังจากหลายศตวรรษที่ชาติโปแลนดถูกแบงแยกโดยสามจักรวรรดิ บัดนี้โปแลนดไดกลับมาเปนเอกราชอีกครั้ง แตสถานะของโปแลนดไมไดงายดายเลย \n\nทางตะวันออก สหภาพโซเวียตยังไมลืมความพายแพอันนาอับอายในสงครามโปแลนด-โซเวียต \n\nทางตะวันตก ผูนําเยอรมนี อดอลฟ ฮิตเลอร ไมไดปดบังความปรารถนาที่จะได "พื้นที่อยูอาศัย" เพิ่มขึ้น - และดินแดนเดิมของเยอรมนีที่ปจจุบันอยูใตการควบคุมของโปแลนดจะเปนกาวแรกสูเปาหมายนั้น"
 CAN_GATHERING_STORM_DESC: "แคนาดาเขาสูมหาสงครามในฐานะอาณานิคม และออกมาในฐานะชาติหนึ่ง แคนาดาที่ถือกําเนิดจากโคลนตมแหงพาสเชินดาเลอ กําลังกาวแรกอยางไมมั่นใจนักสูเวทีโลก \n\nดวยความบอบชํ้าจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ และความแตกแยกภายในระหวางผูพูดภาษาอังกฤษกับผูพูดภาษาฝรั่งเศส อนาคตของชาติใหมนี้ดูไมมั่นคงเลยแมแตนอย"
 AST_GATHERING_STORM_DESC: "ชาวออสเตรเลียไดจารึกชื่อไวในหนาประวัติศาสตรของมหาสงครามดวยเลือด การเสียสละในยุทธการกัลลิโพลียังไมถูกลืม - และผูที่สั่งการก็เชนกัน \n\nบัดนี้ออสเตรเลียยืนอยูบนทางแยก: ควรอยูเคียงขางเจาอาณานิคมซึ่งกําลังจะถูกดึงเขาสูความขัดแยงอีกครั้งในยุโรปอันหางไกล หรือควรมุงความสนใจไปที่ภัยคุกคามที่กําลังปรากฏใกลบานมากขึ้น?"
 AST_BLITZKRIEG_TAOG_DESC: "เหลาดิกเกอรตื่นขึ้นจากการหลับใหล ขยี้ตาไลความงวงขณะที่จิตวิญญาณแอนแซกของพวกเขาตื่นขึ้น ขณะที่ชาวออสเตรเลียสวมเครื่องแบบและอําลาบานเกิดอีกครั้ง เคาลางของสงครามก็ลอยอยูในอากาศเหมือนปนปลอยตัวที่รอการลั่นไก\n\nการลงทุนทางทหารในชวงหลายปที่ผานมาจะเพียงพอตอการตานทานภัยคุกคามทั้งจากยุโรปและเอเชียหรือไม และอังกฤษจะสามารถรักษาคํามั่นที่ใหไวกับออสเตรเลียไดหรือไม ขณะที่กําลังถูกกระจายไปทั่วโลก? ยังมีคําถามอีกมากมาย แตมีคําถามหนึ่งที่มีคําตอบเสมอ: เมื่อตองสูรบ ออสเตรเลียจะอยูที่นั่นเพื่อสู"
 SAF_GATHERING_STORM_DESC: "เมื่อมหาสงครามเริ่มตนขึ้น ชาวแอฟริกาใตจํานวนมากปฏิเสธที่จะจับอาวุธเพื่อเจานายชาวอังกฤษ กองทัพแอฟริกาใตใชเวลาสวนใหญของมหาสงครามไลลากองกําลังเยอรมันในอาณานิคมแอฟริกาของเยอรมนี และประสบความสําเร็จอยางจํากัด \n\nบัดนี้สงครามครั้งใหมกําลังกอตัวขึ้นที่ขอบฟา ทั้งในอดีตและปจจุบัน มีชาวแอฟริกาใตบางสวนที่คิดวาประเทศไมควรตอสูกับเยอรมันเลย บางคนถึงกับเชื่อวาถึงเวลาแลวที่ลูกหลานของชาวบัวรจะตองลุกขึ้นทวงคืนเสรีภาพที่บรรพบุรุษของพวกเขาถูกพรากไป"
 NZL_GATHERING_STORM_DESC: "ชาติเล็ก ๆ ในแปซิฟกใตแหงนี้ไดตอสูอยางกลาหาญในมหาสงคราม และสูญเสียอยางหนักในการรบนองเลือดที่กัลลิโพลีและแนวรบดานตะวันตก ชายวัยสูรบเกือบครึ่งหนึ่งไดไปรบในตางแดน และหลายคนไมไดกลับมา\n\nราวยี่สิบปหลังสิ้นสุดมหาสงคราม ประชาชนนิวซีแลนดมองเวทีโลกดวยความวิตกกังวล เพราะครั้งนี้ ภัยคุกคามของสงครามดูเหมือนจะคืบใกลบานของพวกเขาเองยิ่งขึ้นทุกที..."
 RAJ_GATHERING_STORM_DESC: "มณีเม็ดงามแหงจักรวรรดิอังกฤษ บริติชราชแหงอินเดียเปนสวนผสมอันแปลกประหลาดระหวางอํานาจจักรวรรดิและความไรอํานาจของจักรวรรดิ ขาราชการพลเรือนชาวอังกฤษกลุมเล็ก ๆ ปกครองอนุทวีปอันกวางใหญที่มีราษฎรหลายรอยลานคน กองทัพอินเดียซึ่งตอสูอยางกลาหาญในมหาสงครามก็เกณฑมาจากราษฎรเหลานี้\n\nผูนําอินเดียหวังวาการเสียสละในสงครามครั้งกอนจะชวยใหอินเดียไดรับเอกราชจากอังกฤษ แตจนถึงตอนนี้ ความหวังนั้นก็ตองผิดหวัง เมื่อสงครามครั้งใหมกําลังคืบใกล หลายคนเชื่อวาถึงเวลาแลวที่จะตองควาอิสรภาพนั้นมา - ไมวาจะดวยวิธีใดก็ตาม"
 SWI_GATHERING_STORM_DESC: "สวิตเซอรแลนดมีเอกลักษณเฉพาะตัวในหมูชาติยุโรป เปนชาติพหุวัฒนธรรมและกระจายอํานาจที่กอตั้งขึ้นบนหลักการของความเคารพและการสนับสนุนซึ่งกันและกัน\n\nความเปนกลางที่ยึดมั่นอยางแนวแนของสวิตเซอรแลนดรอดพนจากมหาสงครามมาได และหลังจากไดเห็นความโหดรายของสงครามจากระยะไกล สวิตเซอรแลนดก็ยิ่งเชื่อมั่นมากกวาที่เคยวาจําเปนตองปกปองตนเอง เมื่อเงาของสงครามคืบใกลเขามา ชาติที่รักสันติแหงนี้ตองเลือกวาจะคงความเปนกลางและยับยั้งผูรุกรานดวยความเปนกลางติดอาวุธ จะผูกพันธมิตรอยางไมเต็มใจกับเพื่อนบานประเทศใดประเทศหนึ่ง หรือจะชิงลงมือเอาชนะศัตรูกอนที่พวกมันจะกลาคิดรุกลํ้า"
 SWI_BLITZKRIEG_DESC: "สวิตเซอรแลนดอยูในสถานการณตึงเครียดตั้งแตกอนการผนวกออสเตรีย แตบัดนี้เมื่อไรชเยอรมันไดลิ้มรสการขยายดินแดนอยางงายดายเขาสูดินแดนที่พูดภาษาเยอรมันอื่น ๆ แลว ก็มีอันตรายอยางแทจริงที่ชาติแหงเทือกเขาแอลปที่รักสันติแหงนี้จะเปนรายตอไป ความเปนกลางโดยสมบูรณของสวิตเซอรแลนดจะถูกทดสอบยิ่งกวาครั้งใด และหากทุกอยางผิดพลาด แมแตการปองกันของประเทศก็อาจถูกทดสอบดวย"
 BLITZKRIEG_NAME: "สงครามสายฟาแลบ"
 BLITZKRIEG_DESC: "ในชวงไมกี่ปที่ผานมา โลกไดเห็นสงครามใหมปะทุขึ้นในยุโรปและเอเชีย สเปนอยูภายใตการปกครองของฝายชาตินิยม และญี่ปุนไดทําสงครามแยงชิงดินแดนกับทั้งสหภาพโซเวียตและจีน โดยการรบกับจีนประสบความสําเร็จมากกวาสําหรับญี่ปุน สนธิสัญญาไมรุกรานฉบับใหมระหวางสหภาพโซเวียตกับเยอรมนีอาจเปนขาวรายสําหรับยุโรปสวนที่เหลือ"
 ENG_BLITZKRIEG_DESC: "แมสหราชอาณาจักรจะไดรับชัยชนะในมหาสงคราม แตรากฐานของจักรวรรดิอันยิ่งใหญก็สั่นคลอนถึงแกน คนรุนที่ดีที่สุดของประเทศตองสังเวยชีวิตในสนามเพลาะแหงฟลานเดอสและภาคเหนือของฝรั่งเศส ขณะที่ความไมสงบแพรกระจายไปทั่วเครือจักรภพและหนี้สินมหาศาลก็พอกพูนขึ้น\n\nดวยบาดแผลจากสงครามครั้งกอนที่ยังคงสดใหมในความทรงจํา ประเทศกําลังเผชิญกับแนวโนมของสงครามอีกครั้ง และเริ่มชัดเจนขึ้นทุกทีวาจะไมมีสันติภาพในยุคสมัยของเรา"
 FRA_BLITZKRIEG_DESC: "ดวยความทรงจําถึงมหาสงครามที่ยังคงสดใหม ฝรั่งเศสตองเผชิญกับความขัดแยงครั้งใหม หลังจากเยอรมนีแสดงใหเห็นวาไมมีเจตนาจะรักษาสันติภาพ การเสริมการปองกันชายแดนและการเลือกพันธมิตรอยางชาญฉลาดอาจเปนหนทางใหฝรั่งเศสหลีกเลี่ยงสงครามอันหายนะได\n\n ฝรั่งเศสเคยไดรับชัยชนะมาแลวครั้งหนึ่ง ครั้งนี้ก็จะไมตางกัน!"
 GER_BLITZKRIEG_DESC: "หลังการฟนฟูกําลังทหารในไรนแลนด ฝรั่งเศสและอังกฤษเริ่มระแวงเจตนาของเยอรมนีมากขึ้นเรื่อย ๆ ขอตกลงมิวนิกอนุญาตใหเยอรมนีผนวกซูเดเทนแลนดเพื่อประโยชนของชาวเยอรมันที่นั่น กติกาสัญญาโมโลตอฟ-ริบเบนทรอปรับประกันการไมรุกรานระหวางเยอรมนีกับสหภาพโซเวียต แตยังระบุถึงการแบงโปแลนดระหวางสองชาติดวย \n\nเยอรมนีรอคอยชวงเวลานี้มานานเกินไปแลว ถึงเวลาลงมือแลว!"
 JAP_BLITZKRIEG_DESC: "สงครามกําลังลุกโชนทางตะวันออกเฉียงใต แมญี่ปุนจะสูญเสียไปบางในชวงตนป '39 แตดินแดนสวนใหญของจีนก็อยูใตการควบคุมของญี่ปุน ความตึงเครียดกําลังทวีขึ้นในยุโรป และขณะที่สหภาพโซเวียตกําลังมุงความสนใจไปที่เรื่องเหลานั้น พวกเขาก็ไมนาจะเขามาแทรกแซงสงครามในเอเชีย \n\nเมื่อทรัพยากรของจีนตกอยูในมือญี่ปุนแลว การรับมือกับโซเวียตก็จะเปนเรื่องงาย"
 ITA_BLITZKRIEG_DESC: "มุสโสลินี ผูเผด็จการแหงอิตาลี มีชื่อเสียงในฐานะผูรักษาสันติภาพจากบทบาทของเขาในขอตกลงมิวนิกเมื่อปกอน อยางไรก็ตาม การขยายดินแดนของเยอรมนีทําใหอิตาลีเห็นวายังมีดินแดนอีกมากที่จะอางสิทธิ์ได หากสามารถบรรลุความเขาใจกับเยอรมันได \n\nแอลเบเนียถูกพิชิตเพียงเพื่อใหไดลิ้มรสขีดความสามารถทางทหารของอิตาลีเทานั้น และสวนที่เหลือของโลกก็ควรจะกังวลไว"
 SOV_BLITZKRIEG_DESC: "การสนับสนุนมานูเอล อาซาญา และ 'สาธารณรัฐสเปนที่สอง' ระหวางสงครามกลางเมืองสเปน แสดงใหเห็นอยางชัดเจนวาสหภาพโซเวียตยืนอยูตรงไหนเมื่อเทียบกับอิตาลีและเยอรมนี ดวยชัยชนะเหนือกองทัพญี่ปุนในความขัดแยงชายแดนหลายครั้งเมื่อไมนานมานี้ สหภาพโซเวียตในปจจุบันดูจะเปนมหาอํานาจที่ยิ่งใหญเกินกวาประเทศใดประเทศหนึ่งจะตอตานได \n\nคํามั่นของเยอรมนีที่จะแบงรัฐบอลติกและโปแลนดเปนสิ่งที่นายินดีในเวลานี้"
 USA_BLITZKRIEG_DESC: "ความตึงเครียดที่ทวีขึ้นในยุโรปเปนเรื่องนากังวล แมจะยังไมใชขอกังวลที่แทจริงสําหรับสหรัฐอเมริกา แตการรุกรานที่เยอรมนีแสดงออกมาอาจดังกองไปทั่วโลกในไมชา แมทางตะวันตกจะคอนขางสงบสุข แตเมื่อพิจารณาทุกอยางแลว การเตรียมพรอมทางทหารก็อาจไมใชความคิดที่เลว \n\nหากสหรัฐอเมริกาถูกดึงเขาสูสงครามอีกครั้ง พวกเขาจะเปนผูยุติมันเอง"
 OTHER_BLITZKRIEG_DESC: "ไมใชทุกประเทศในโลก ทั้งใหญและเล็ก ที่จะพอใจกับการกลั้นหายใจรอคอยการปะทุของความขัดแยงระดับโลกอีกครั้ง ตั้งแตมหาอํานาจที่อยูบนปากเหวสงครามกลางเมือง ไปจนถึงหลายชาติที่ถือกําเนิดและเปลี่ยนแปลงไปจากมหาสงคราม ทุกชาติลวนตองตัดสินใจอยางยากลําบาก และสรางสมดุลระหวางอุดมการณกับความเปนจริง เพื่อสงผลตออนาคตของโลก"
 POL_BLITZKRIEG_DESC: "หลังจากหลายศตวรรษที่ชาติโปแลนดถูกแบงแยกโดยสามจักรวรรดิ บัดนี้โปแลนดไดกลับมาเปนเอกราชอีกครั้ง แตสถานะของโปแลนดไมไดงายดายเลย \n\nทางตะวันออก สหภาพโซเวียตยังไมลืมความพายแพอันนาอับอายในสงครามโปแลนด-โซเวียต \n\nทางตะวันตก ผูนําเยอรมนี อดอลฟ ฮิตเลอร ไมไดปดบังความปรารถนาที่จะได "พื้นที่อยูอาศัย" เพิ่มขึ้น - และดินแดนเดิมของเยอรมนีที่ปจจุบันอยูใตการควบคุมของโปแลนดจะเปนกาวแรกสูเปาหมายนั้น"
 CAN_BLITZKRIEG_DESC: "แคนาดาเขาสูมหาสงครามในฐานะอาณานิคม และออกมาในฐานะชาติหนึ่ง แคนาดาที่ถือกําเนิดจากโคลนตมแหงพาสเชินดาเลอ กําลังกาวแรกอยางไมมั่นใจนักสูเวทีโลก \n\nดวยความบอบชํ้าจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ และความแตกแยกภายในระหวางผูพูดภาษาอังกฤษกับผูพูดภาษาฝรั่งเศส อนาคตของชาติใหมนี้ดูไมมั่นคงเลยแมแตนอย"
 AST_BLITZKRIEG_DESC: "ชาวออสเตรเลียไดจารึกชื่อไวในหนาประวัติศาสตรของมหาสงครามดวยเลือด การเสียสละในยุทธการกัลลิโพลียังไมถูกลืม - และผูที่สั่งการก็เชนกัน \n\nบัดนี้ออสเตรเลียยืนอยูบนทางแยก: ควรอยูเคียงขางเจาอาณานิคมซึ่งกําลังจะถูกดึงเขาสูความขัดแยงอีกครั้งในยุโรปอันหางไกล หรือควรมุงความสนใจไปที่ภัยคุกคามที่กําลังปรากฏใกลบานมากขึ้น?"
 SAF_BLITZKRIEG_DESC: "เมื่อมหาสงครามเริ่มตนขึ้น ชาวแอฟริกาใตจํานวนมากปฏิเสธที่จะจับอาวุธเพื่อเจานายชาวอังกฤษ กองทัพแอฟริกาใตใชเวลาสวนใหญของมหาสงครามไลลากองกําลังเยอรมันในอาณานิคมแอฟริกาของเยอรมนี และประสบความสําเร็จอยางจํากัด \n\nบัดนี้สงครามครั้งใหมกําลังกอตัวขึ้นที่ขอบฟา ทั้งในอดีตและปจจุบัน มีชาวแอฟริกาใตบางสวนที่คิดวาประเทศไมควรตอสูกับเยอรมันเลย บางคนถึงกับเชื่อวาถึงเวลาแลวที่ลูกหลานของชาวบัวรจะตองลุกขึ้นทวงคืนเสรีภาพที่บรรพบุรุษของพวกเขาถูกพรากไป"
 NZL_BLITZKRIEG_DESC: "ชาติเล็ก ๆ ในแปซิฟกใตแหงนี้ไดตอสูอยางกลาหาญในมหาสงคราม และสูญเสียอยางหนักในการรบนองเลือดที่กัลลิโพลีและแนวรบดานตะวันตก ชายวัยสูรบเกือบครึ่งหนึ่งไดไปรบในตางแดน และหลายคนไมไดกลับมา\n\nราวยี่สิบปหลังสิ้นสุดมหาสงคราม ประชาชนนิวซีแลนดมองเวทีโลกดวยความวิตกกังวล เพราะครั้งนี้ ภัยคุกคามของสงครามดูเหมือนจะคืบใกลบานของพวกเขาเองยิ่งขึ้นทุกที..."
 RAJ_BLITZKRIEG_DESC: "มณีเม็ดงามแหงจักรวรรดิอังกฤษ บริติชราชแหงอินเดียเปนสวนผสมอันแปลกประหลาดระหวางอํานาจจักรวรรดิและความไรอํานาจของจักรวรรดิ ขาราชการพลเรือนชาวอังกฤษกลุมเล็ก ๆ ปกครองอนุทวีปอันกวางใหญที่มีราษฎรหลายรอยลานคน กองทัพอินเดียซึ่งตอสูอยางกลาหาญในมหาสงครามก็เกณฑมาจากราษฎรเหลานี้\n\nผูนําอินเดียหวังวาการเสียสละในสงครามครั้งกอนจะชวยใหอินเดียไดรับเอกราชจากอังกฤษ แตจนถึงตอนนี้ ความหวังนั้นก็ตองผิดหวัง เมื่อสงครามครั้งใหมกําลังคืบใกล หลายคนเชื่อวาถึงเวลาแลวที่จะตองควาอิสรภาพนั้นมา - ไมวาจะดวยวิธีใดก็ตาม"
 CZE_GATHERING_STORM_DESC: "ระหวางมหาสงคราม ทหารเช็กไดตอสูเคียงขางกองกําลังฝายไตรภาคีทั่วยุโรป เพื่อใหชาติของตนไดรับการยอมรับ ความพยายามของพวกเขาประสบผลสําเร็จ และเชโกสโลวาเกียก็ผงาดขึ้นจากเถาถานของจักรวรรดิออสเตรีย-ฮังการี \n\nนับตั้งแตกาวเขาสูความเปนรัฐอยางโดดเดน เชโกสโลวาเกียไดกอตั้งพันธมิตร 'ความตกลงไตรภาคีนอย' กับยูโกสลาเวียและโรมาเนีย โดยมีเปาหมายเพื่อสกัดกั้นความพยายามของฮังการีที่จะฟนฟูจักรวรรดิออสเตรีย-ฮังการี แตเมื่ออํานาจของเยอรมนีที่ฟนคืนเติบโตขึ้น ภูมิทัศนทางการเมืองของยุโรปก็กําลังเปลี่ยนแปลงอยางรวดเร็ว"
 HUN_GATHERING_STORM_DESC: "ในฐานะครึ่งหนึ่งของจักรวรรดิออสเตรีย-ฮังการีที่ลมสลายไปแลว ฮังการีถูกฝายไตรภาคีผูชนะปฏิบัติเยี่ยงศัตรูผูพายแพหลังมหาสงคราม ในสนธิสัญญาทรียานง ประเทศสูญเสียดินแดนไปเกือบสองในสาม ชาวฮังการีหลายลานคนพบวาตนเองอาศัยอยูนอกพรมแดน และเศรษฐกิจก็พังพินาศ ขอจํากัดอันเขมงวดตอการฟนฟูกําลังทหารมีขึ้นเพื่อใหแนใจวาฮังการีจะไมมีวันคุกคามสันติภาพในยุโรปไดอีก \n\nแตเมื่อบรรยากาศทางการเมืองในยุโรปเปลี่ยนแปลงไป อาจถึงเวลาแลวที่จะแกไขความผิดพลาดในอดีตเสียที และทวงคืนความรุงโรจนในอดีตของชาติ"
 ROM_GATHERING_STORM_DESC: "โรมาเนียอยูฝายผูชนะในมหาสงคราม และผลที่ตามมาคือไดดินแดนและผูคนใหม ๆ - ซึ่งไมใชทุกคนที่เปนชาวโรมาเนีย เพื่อปองกันความปรารถนาจะทวงคืนดินแดนของประเทศที่ถูกบังคับใหยกดินแดน โรมาเนียไดสรางเครือขายพันธมิตรทั่วคาบสมุทรบอลขาน อยางไรก็ตาม ในชวงไมกี่ปที่ผานมา ประเทศกลับสนใจแตเรื่องภายในเปนสวนใหญ และรัฐบาลของพระเจาคาโรลที่ 2 ก็ปลอยใหพันธมิตรเหลานี้หมดอายุลง \n\nเมื่อสถานการณทางการเมืองในยุโรปเปลี่ยนแปลงไป โรมาเนียอาจพบวาตนเองตองยืนหยัดอยูเพียงลําพัง - และเปราะบาง"
 HUN_BLITZKRIEG_DESC: "ในฐานะครึ่งหนึ่งของจักรวรรดิออสเตรีย-ฮังการีที่ลมสลายไปแลว ฮังการีถูกฝายไตรภาคีผูชนะปฏิบัติเยี่ยงศัตรูผูพายแพหลังมหาสงคราม ในสนธิสัญญาทรียานง ประเทศสูญเสียดินแดนไปเกือบสองในสาม ชาวฮังการีหลายลานคนพบวาตนเองอาศัยอยูนอกพรมแดน และเศรษฐกิจก็พังพินาศ ขอจํากัดอันเขมงวดตอการฟนฟูกําลังทหารมีขึ้นเพื่อใหแนใจวาฮังการีจะไมมีวันคุกคามสันติภาพในยุโรปไดอีก \n\nแตเมื่อบรรยากาศทางการเมืองในยุโรปเปลี่ยนแปลงไป อาจถึงเวลาแลวที่จะแกไขความผิดพลาดในอดีตเสียที และทวงคืนความรุงโรจนในอดีตของชาติ"
