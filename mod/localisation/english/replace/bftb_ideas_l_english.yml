 GRE_george_ii: "จอรจที่ 2"
 GRE_george_ii_desc: "จอรจที่ 2 คือกษัตริยแหงชาวกรีกผูไมเปนที่นิยม ซึ่งไดกลับคืนสูราชบัลลังกจากการลี้ภัยในป 1935 ดวยการลงประชามติที่ถูกโกง พระองคทรงตั้งพระทัยที่จะรักษาราชบัลลังกไวใหไดในครั้งนี้"
 GRE_george_ii_restrained: "จอรจที่ 2"
 GRE_george_ii_restrained_desc: "จอรจที่ 2 คือกษัตริยแหงชาวกรีกผูสรางความแตกแยก ซึ่งไดกลับคืนสูราชบัลลังกจากการลี้ภัยในป 1935 ดวยการลงประชามติที่ถูกโกง แทนที่จะปลอยใหสถานะของบุรุษผูเดียวนี้ฉีกชาติกรีกออกเปนเสี่ยงอีกครั้ง ฝายเวนิเซลอสไดยอมใหจอรจที่ 2 ดํารงตําแหนงตอไปในฐานะพระมหากษัตริยภายใตรัฐธรรมนูญตามแบบอยางสวีเดน"
 GRE_schachtplan: "แผนชาคท"
 GRE_schachtplan_desc: "แผนชาคทเปนผลงานความคิดของยัลมาร ชาคท นักเศรษฐศาสตรชาวเยอรมัน ซึ่งรับประกันการเขาถึงตลาดเยอรมนีของกรีซ เพื่อแลกกับการนําเขาวัตถุดิบจากกรีซไปยังเยอรมนีที่เพิ่มขึ้น ชาวเยอรมันไดชวยพยุงเราไวอยางใจกวาง แตเราอาจตกหลุมพรางของพวกเขาไปแลวดวยการพึ่งพาความใจกวางนั้นมากเกินไป"
 GRE_schachtplan_modified: "แผนชาคท"
 GRE_schachtplan_modified_desc: "แผนชาคทเปนผลงานความคิดของยัลมาร ชาคทผูปราดเปรื่อง ซึ่งรับประกันการเขาถึงตลาดเยอรมนีของกรีซ เพื่อแลกกับสิทธิ์เขาถึงวัตถุดิบของกรีซเปนลําดับแรก ในอดีตชาวเยอรมันไดชวยพยุงเราไวอยางใจกวาง และเราไดรวมกันสรางความสัมพันธทางเศรษฐกิจที่พิเศษอยางแทจริง"
 GRE_schachtplan_fascistised: "แผนกอตซามานิส-ชาคท"
 GRE_schachtplan_fascistised_desc: "แผนชาคทฉบับใหมซึ่งอิงจากแผนชาคทดั้งเดิมของยัลมาร ชาคท ไดรับการจัดทําอยางพิถีพิถันโดยนักเศรษฐศาสตรบรรษัทนิยมที่ยิ่งใหญที่สุดของเยอรมนีและกรีซ เปนการสรางกติกาสัญญาทางเศรษฐกิจฉบับใหมบนหลักการของลัทธินาซี แมขอตกลงทางเศรษฐกิจนี้อาจไมนาเชื่อถือในระยะยาว แตก็จะเปนประโยชนแกเรามากพอในชวงปแหงความขัดแยงนี้"
 GRE_agrarian_society: "สังคมเกษตรกรรม"
 GRE_agrarian_society_desc: "กรีซพึ่งพาการเกษตรและอุตสาหกรรมเบามาแตดั้งเดิม โดยมีผลิตภัณฑเชิงพาณิชยอยางยาสูบเปนสินคาสงออกหลัก การพึ่งพารูปแบบการผลิตแบบดั้งเดิมทําใหเราตองพึ่งพาอุตสาหกรรมหนักของมหาอํานาจที่ใหญกวาสําหรับโครงการกอสราง ความขัดแยงกําลังกอตัว และเราตองสรางนวัตกรรม - อยางรวดเร็ว"
 GRE_foreign_monopolies: "การผูกขาดของตางชาติ"
 GRE_foreign_monopolies_desc: "การพึ่งพาอุตสาหกรรมหนักของมหาอํานาจตางชาติทําใหภาคสวนที่กําลังพัฒนาของเราจํานวนมากตกอยูในมือของบริษัททรงอิทธิพลที่ขึ้นตรงตอรัฐบาลตางชาติเทานั้น เราไมอาจคาดหวังจะเรงกระบวนการปรับปรุงใหทันสมัยไดเต็มที่ จนกวาเราจะทําขอตกลงกับผูผูกขาดเหลานี้ หรือเตะพวกเขาออกจากประเทศไปอยางถาวร"
