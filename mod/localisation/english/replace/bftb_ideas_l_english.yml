 TUR_first_five_year_plan: "แผนพัฒนาอุตสาหกรรมหาปฉบับที่หนึ่ง"
 TUR_first_five_year_plan_desc: "แผนหาปฉบับแรกของเราเริ่มมีผลบังคับใชเมื่อวันที่ 17 เมษายน 1934 โดยอิงแบบอยางแผนหาปของ[SOV.GetAdjective] และไดรับคําแนะนําจากผูเชี่ยวชาญทั้งชาว[SOV.GetAdjective]และชาว[USA.GetAdjective] ผานแผนนี้ เรามุงหวังจะสรางโรงงานใหม 20 แหงใหแลวเสร็จภายในเวลาที่แผนฉบับที่สองเริ่มดําเนินการ"

 TUR_widespread_illiteracy_idea: "การไมรูหนังสืออยางแพรหลาย"
 TUR_widespread_illiteracy_idea_desc: "แมอัตราการรูหนังสือในชาติของเราจะเพิ่มขึ้นอยางมากนับตั้งแตเริ่มปฏิรูปตัวอักษรและภาษา ดวยการผลักดันการรูหนังสือของอตาเติรกและการรณรงคการศึกษาแหงชาติ ถึงขนาดที่เขาไดรับสมญานามวา บาชเออเรทเมน (ครูใหญ) แตก็ยังมีอะไรตองทําอีกมาก"

 TUR_kemalist_army_officers_powerful_loyal: "นายทหารฝายเคมาล"
 TUR_kemalist_army_officers_powerful_loyal_desc: "คณะนายทหารชั้นยอดของตุรกีเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง ลัทธิเคมาลไมเคยหยั่งรากลึกในตุรกีเทาวันนี้มากอน และรัฐของเราไมเคยอยูในมือที่ปลอดภัยเทาภายใตรัฐบาลชุดปจจุบัน"
