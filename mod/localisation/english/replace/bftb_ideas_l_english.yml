 TUR_kemalist_army_officers_decreased_power_disloyal: "นายทหารฝายเคมาล"
 TUR_kemalist_army_officers_decreased_power_disloyal_desc: "คณะนายทหารของตุรกีเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง ลัทธิเคมาลเผชิญอุปสรรคบางประการในการชนะใจประชาชน ซึ่งคณะนายทหารสวนใหญมองวาเปนผลจากนโยบายและการกระทําของรัฐบาลชุดปจจุบัน"
 TUR_kemalist_army_officers_minimal_power_loyal: "นายทหารฝายเคมาล"
 TUR_kemalist_army_officers_minimal_power_loyal_desc: "คณะนายทหารของตุรกีเคยเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง แตบัดนี้กลุมผูภักดีตอเคมาลที่หมดแรงทําไดเพียงวิจารณรัฐบาลชุดปจจุบันอยางผาน ๆ เทานั้น"
 TUR_kemalist_army_officers_minimal_power_neutral: "นายทหารสายเคมาลิสต"
 TUR_kemalist_army_officers_minimal_power_neutral_desc: "เหลานายทหารตุรกีเคยเปนผูพิทักษคานิยมแบบเคมาลิสตที่แข็งขันที่สุดกลุมหนึ่ง แตบัดนี้พวกเขาถูกลดบทบาทลงจนเหลือเพียงหนาที่ในเชิงพิธีการเปนสวนใหญ"
 TUR_kemalist_army_officers_minimal_power_disloyal: "นายทหารสายเคมาลิสต"
 TUR_kemalist_army_officers_minimal_power_disloyal_desc: "เหลานายทหารตุรกีเคยเปนผูพิทักษคานิยมแบบเคมาลิสตที่แข็งขันที่สุดกลุมหนึ่ง แตบัดนี้กลุมผูภักดีตอแนวทางเคมาลิสตที่หดเล็กลงอยางนาเวทนา ทําไดเพียงประณามรัฐบาลปจจุบันอยางผาน ๆ เทานั้น"
 TUR_disorganised_armed_forces: "กองทัพที่ขาดการจัดระเบียบ"
 TUR_disorganised_armed_forces_desc: "กองทัพตุรกียังออนวัยไมตางจากประเทศตุรกีเอง แมกองทัพของเราจะไดรับชัยชนะเหนือฝายไตรภาคีและจักรวรรดิออตโตมันในสงครามกูเอกราช แตชาติของเราก็ตองแลกอิสรภาพมาดวยเลือดเนื้อ หลังจากสูญเสียประชากรไปเกือบหนึ่งในสี่ในมหาสงคราม ผูคนแทบไมมีความกระตือรือรนตอสงครามอีกเลย ทวาเมื่อเงาทะมึนของสงครามปกคลุมโลกอีกครั้ง ดูเหมือนวาเราจะไมมีทางเลือกอื่น นอกจากเรงปรับปรุงกองทัพใหทันสมัยโดยเร็ว หรือไมก็ตองทําใหแนใจวาสงครามจะไมมีวันลุกลามมาถึงพรมแดนของเรา"
