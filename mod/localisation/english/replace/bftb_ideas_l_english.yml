 GRE_battle_for_the_bosporus: "ศึกชิงบอสพอรัส"
 GRE_battle_for_the_bosporus_desc: "ศึกชิงบอสพอรัสไดเริ่มขึ้นแลว และเราเปนฝายไดเปรียบ! เราตองรุกใหหนักที่สุดเทาที่ทําไดในขณะที่ยังทําได เพื่อใหชัยชนะเปนของเราอยางแนนอน!"
