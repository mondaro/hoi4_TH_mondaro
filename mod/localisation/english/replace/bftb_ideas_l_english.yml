 BUL_anti_capitalism: "ตอตานทุนนิยม"
 BUL_anti_capitalism_desc: "[GetAntiCapitalismFocusLoc]"
 BUL_anti_capitalism_tt: "โบนัสการโจมตีตอ§Yประเทศประชาธิปไตยมหาอํานาจในยุโรป§!: §G10.0%§!, โบนัสการปองกันตอ§Yประเทศประชาธิปไตยมหาอํานาจในยุโรป§!: §G10.0%§!"
 BUL_the_balkans_united: "บอลขานรวมเปนหนึ่ง"
 BUL_the_balkans_united_desc: "[GetUnitedWeShallPrevailFocusLoc]"
 BUL_balkan_federation_project_propaganda: "โฆษณาชวนเชื่อสหพันธรัฐบอลขาน"
 BUL_balkan_federation_project_propaganda_desc: "แรงสนับสนุนจากประชาชนตอโครงการสหพันธรัฐบอลขานแบบใหมของบัลแกเรียกําลังแพรกระจายอยางรวดเร็ว ดวยการรณรงคโฆษณาชวนเชื่อทั่วประเทศที่รัฐบาลบัลแกเรียใหทุนสนับสนุน"
 BUL_defying_moscow: "ทาทายมอสโก"
 BUL_defying_moscow_desc: "[GetDefyingMoscowFocusLoc]"
 BUL_ferdinands_puppet: "รัฐหุนเชิดของซารเฟอรดินานด"
