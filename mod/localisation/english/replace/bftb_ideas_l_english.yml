 GRE_COOPERATIVE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST: "ผูผูกขาดตางชาติที่ถูกโอนเปนของรัฐ"
 GRE_political_instability: "ความไรเสถียรภาพทางการเมือง"
 GRE_political_instability_desc: "§W£faction_gre_monarchist §Yฝายนิยมกษัตริย§! อยูในระดับ [Root.GetMonarchistLoyaltyLevel]§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §Yฝายสาธารณรัฐ§! อยูในระดับ [Root.GetRepublicanLoyaltyLevel]§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §Yฝายคอมมิวนิสต§! อยูในระดับ [Root.GetCommunistLoyaltyLevel]§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §Yฝายฟาสซิสต§! อยูในระดับ [Root.GetFascistLoyaltyLevel]§! [ROOT.GetFascistLoyaltyEffects] \n\nระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! ประชาชนเหนื่อยหนายเต็มทีและพรอมสําหรับเสถียรภาพในรัฐบาล แตพวกเขาก็ยังคงสงสัยอยางระมัดระวังวารัฐบาลใดจะอยูรอดไดนานแคไหน เราตองพิสูจนวาพวกเขาคิดผิด และยุติการตอสูภายในที่ไมรูจบดวยการปราบศัตรูทางการเมืองใหอยูหมัด"
 GRE_political_instability_dummy_desc: "ระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! ประชาชนเหนื่อยหนายเต็มทีและพรอมสําหรับเสถียรภาพในรัฐบาล แตพวกเขาก็ยังคงสงสัยอยางระมัดระวังวารัฐบาลใดจะอยูรอดไดนานแคไหน เราตองพิสูจนวาพวกเขาคิดผิด และยุติการตอสูภายในที่ไมรูจบดวยการปราบศัตรูทางการเมืองใหอยูหมัด"
 GRE_political_instability_republican: "ความไรเสถียรภาพทางการเมือง"
 GRE_political_instability_republican_desc: "§W£faction_gre_monarchist §Yฝายนิยมกษัตริย§! อยูในระดับ [Root.GetMonarchistLoyaltyLevel]§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §Yฝายสาธารณรัฐ§! อยูในระดับ [Root.GetRepublicanLoyaltyLevel]§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §Yฝายคอมมิวนิสต§! อยูในระดับ [Root.GetCommunistLoyaltyLevel]§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §Yฝายฟาสซิสต§! อยูในระดับ [Root.GetFascistLoyaltyLevel]§! [ROOT.GetFascistLoyaltyEffects] \n\nระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! พวกเราฝายเวนิเซลอสไมอาจปฏิเสธ... บทบาทเล็ก ๆ ที่เราอาจมีสวนในเรื่องนั้นได อยางนอยประชาชนก็คุนเคยกับเราในฐานะปศาจที่พวกเขารูจักดี! นาเสียดายที่ความทรงจําเกี่ยวกับมหันตภัยอานาโตเลียยังคงสดใหมในใจของชาวกรีก และพวกเขาก็ไมลืมบทบาทที่เรามีในเหตุการณนั้นเชนกัน"
 GRE_political_instability_republican_2: "ความไรเสถียรภาพทางการเมือง"
 GRE_political_instability_republican_2_desc: "§W£faction_gre_monarchist §Yฝายนิยมกษัตริย§! อยูในระดับ [Root.GetMonarchistLoyaltyLevel]§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §Yฝายสาธารณรัฐ§! อยูในระดับ [Root.GetRepublicanLoyaltyLevel]§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §Yฝายคอมมิวนิสต§! อยูในระดับ [Root.GetCommunistLoyaltyLevel]§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §Yฝายฟาสซิสต§! อยูในระดับ [Root.GetFascistLoyaltyLevel]§! [ROOT.GetFascistLoyaltyEffects] \n\nระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! พวกเราฝายเวนิเซลอสไมอาจปฏิเสธ... บทบาทเล็ก ๆ ที่เราอาจมีสวนในเรื่องนั้นได อยางนอยประชาชนก็คุนเคยกับเราในฐานะปศาจที่พวกเขารูจักดี! บัดนี้ขึ้นอยูกับเราที่จะสานตอมรดกของเรา และเดินทางที่กรีซเริ่มไวในป 1919 ใหสําเร็จ เมื่อครั้งที่เราพยายามทวงคืนคอนสแตนติโนเปล..."
 GRE_political_instability_communist: "ความไรเสถียรภาพทางการเมือง"
 GRE_political_instability_communist_desc: "§W£faction_gre_monarchist §Yฝายนิยมกษัตริย§! อยูในระดับ [Root.GetMonarchistLoyaltyLevel]§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §Yฝายสาธารณรัฐ§! อยูในระดับ [Root.GetRepublicanLoyaltyLevel]§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §Yฝายคอมมิวนิสต§! อยูในระดับ [Root.GetCommunistLoyaltyLevel]§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §Yฝายฟาสซิสต§! อยูในระดับ [Root.GetFascistLoyaltyLevel]§! [ROOT.GetFascistLoyaltyEffects] \n\nระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! เปนครั้งแรกในรอบเวลาอันยาวนานที่ในที่สุดกรีซก็มีขบวนการที่ใหความสําคัญกับชาวกรีกเปนอันดับแรกขึ้นมากุมอํานาจปกครองชาติ แตขบวนการของเรายังเยาว และเรายังตองพิสูจนตัวเองอีกมากกอนที่ประชาชนจะไววางใจการปกครองของเราอยางแทจริง"
 GRE_political_instability_metaxas: "ความไรเสถียรภาพทางการเมือง"
 GRE_political_instability_metaxas_desc: "§W£faction_gre_monarchist §Yฝายนิยมกษัตริย§! อยูในระดับ [Root.GetMonarchistLoyaltyLevel]§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §Yฝายสาธารณรัฐ§! อยูในระดับ [Root.GetRepublicanLoyaltyLevel]§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §Yฝายคอมมิวนิสต§! อยูในระดับ [Root.GetCommunistLoyaltyLevel]§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §Yฝายฟาสซิสต§! อยูในระดับ [Root.GetFascistLoyaltyLevel]§! [ROOT.GetFascistLoyaltyEffects] \n\nระหวางป 1924 ถึง 1935 เราเปลี่ยนรัฐบาลมาแลวยี่สิบสามครั้ง เกิดรัฐประหารสิบสามครั้ง และมีเผด็จการหนึ่งครั้ง! ภายใตการนําของเมทาซัส เราจะบรรลุเอกภาพผานความแข็งแกรงดวยการบดขยี้ศัตรูทั้งปวง! ชาวกรีกจะไดเรียนรูวารัฐบาลที่มีเจตจํานงจะสรางระเบียบในประเทศที่ไรขื่อแปนี้ทํางานอยางไร"
 GRE_political_instability_fascism: "ความไรเสถียรภาพทางการเมือง"
