 BUL_army_restrictions: "ขอจํากัดทางทหาร"
 BUL_army_restrictions_desc: "ผลพวงอีกประการของสนธิสัญญานุยยี-ซูร-แซนคือขอจํากัดอันเขมงวดที่บังคับใชกับกองทัพของเรา ไมเพียงหามการเกณฑทหารภาคบังคับ จํากัดจํานวนทหารและนายทหาร และหามเราครอบครองยุทโธปกรณทันสมัยใด ๆ เทานั้น แตยังหามการซอมรบหรือการวางแผนการทัพใด ๆ และถึงขั้นกําหนดจํานวนปนไรเฟลที่เราใชไดดวย"
 BUL_army_restrictions_mobilization_law_tt: "§Rไมสามารถยกระดับกฎหมายการเกณฑทหารหรือประกาศสงครามได\nไมสามารถฝก ยุบ หรือแกไขแมแบบหนวยได\nไมสามารถผลิตยานเกราะ อากาศยาน หรือเรือได§!"
 BUL_second_national_catastrophe: "หายนะแหงชาติครั้งที่สอง"
 BUL_second_national_catastrophe_desc: "หลังพายแพในมหาสงคราม สนธิสัญญานุยยี-ซูร-แซนบังคับใหเรายกดินแดนกวางใหญซึ่งปจจุบันเปนของยูโกสลาเวีย กรีซ และโรมาเนีย และจนกระทั่งไมนานมานี้ สันนิบาตชาติยังบังคับใหเราตองใหความสําคัญกับการจายคาปฏิกรรมสงครามกอนมหาศาล จนเศรษฐกิจของเราพังทลายและหนี้ของประเทศพอกพูนขึ้นอยางหลีกเลี่ยงไมได จิตวิญญาณของชาติไมเคยฟนตัวจากการโจมตีครั้งนี้ไดอยางแทจริง จึงไมนาแปลกใจที่ชาวบัลแกเรียเรียกสนธิสัญญานี้วาหายนะแหงชาติครั้งที่สอง..."
 BUL_second_national_catastrophe_tt: "จะถูกยกเลิกหากฟนฟูมหาบัลแกเรียไดสําเร็จ:\nควบคุม §Yโซเฟย§!, §Yพลอฟดิฟ§!, §Yมีเซีย§!, §Yบูรกาส§!, §Yเซอรเบียตอนใต§!, §Yมาซิโดเนีย§!, §Yมาซิโดเนียตอนกลาง§!, §Yเทรซ§!, §Yโดบรูจา§!, §Yโดบรูจาตอนเหนือ§! ไดอยางสมบูรณ"
 BUL_imro_01: "IMRO"
 BUL_imro_01_desc: "อาชญากรรมฆาลางพวกเดียวกันที่องคการปฏิวัติมาซิโดเนียภายใน (IMRO) กออยางตอเนื่อง ไดสรางความเสียหายรายแรงตอความสัมพันธระหวางประเทศของเรา และนําไปสูการปราบปรามทางทหารตอฐานที่มั่นของ IMRO ในเปตริชเมื่อป 1934 ซึ่งเปนการโจมตีครั้งสําคัญตอองคการ และบีบใหผูนําสวนใหญตองหนีไปตางประเทศ อยางไรก็ตาม เซลลปฏิวัติบางกลุมยังคงเคลื่อนไหวอยูในบัลแกเรีย และความสัมพันธทางการทูตสวนใหญของเรายังคงยํ่าแย"
 BUL_imro_02: "IMRO"
 BUL_imro_02_desc: "อาชญากรรมฆาลางพวกเดียวกันที่องคการปฏิวัติมาซิโดเนียภายใน (IMRO) กออยางตอเนื่อง ไดสรางความเสียหายรายแรงตอความสัมพันธระหวางประเทศของเรามานานเกินไปแลว แตอยางนอยตอนนี้มหาอํานาจตางชาติก็ยอมรับความพยายามของเราในการทําลายองคการนี้ เพื่อรักษาสันติภาพในคาบสมุทรบอลขาน"
 BUL_imro_04: "IMRO"
 BUL_imro_04_desc: "ความรวมมือของเรากับองคการปฏิวัติมาซิโดเนียภายใน (IMRO) ถูกวิพากษวิจารณอยางกวางขวาง ไมเพียงจากเพื่อนบาน แตยังจากมหาอํานาจตางชาติหลายประเทศ และแมแตประชาชนของเราบางกลุมดวย"
 BUL_tsar_boris_positive_01: "ซารบอริสที่ 3"
 BUL_tsar_boris_positive_01_desc: "นโยบายของบอริสพิสูจนแลววาเปนประโยชนอยางยิ่งตอบัลแกเรีย ดวยเหตุนี้ซารจึงไดรับความนิยมจากประชาชนอยางสูง ไมเพียงในหมูชนชั้นนําและแวดวงผูมีอภิสิทธิ์ แตยังรวมถึงชนชั้นที่ตํ่าตอยที่สุดดวย"
 BUL_tsar_boris_negative_01: "ซารบอริสที่ 3"
 BUL_tsar_boris_negative_01_desc: "บอริสที่ 3 รูดีวาระบอบเผด็จการของพระองคกําลังจะสิ้นสุดลง และไมนาแปลกใจที่พระองคทรงปฏิเสธการเปลี่ยนแปลงใด ๆ ที่รัฐมนตรีของเราเสนอ โดยอาศัยสมาชิกฝายภักดีในรัฐบาลใหขัดขวางขอเสนอทั้งหมดของเรา และพยายามอยางสิ้นหวังที่จะกุมอํานาจการเมืองบัลแกเรียไวใหนานที่สุด"
 BUL_zveno_ns: "ซเวโน"
 BUL_zveno_ns_desc: "การยุบสหภาพทหารเปนเรื่องจําเปน แตก็มีผลตามมา: ในที่สุดเราก็กําจัดบุคคลในกลุมซเวโนหลายคนที่ไมไดทําอะไรนอกจากขัดขวางสายการบังคับบัญชา แตเราก็สูญเสียครูฝกที่มีคาและนายทหารผูมากประสบการณในโรงเรียนทหารของเราไปดวย"
 BUL_fatherland_front_positive: "แนวรวมปตุภูมิ"
 BUL_fatherland_front_positive_desc: "แนวรวมปตุภูมิกอตั้งขึ้นเดิมโดยพรรคกรรมกรบัลแกเรียในฐานะขบวนการตอตานทางการเมืองเพื่อเผชิญหนากับการกดขี่และลัทธิฟาสซิสตในบัลแกเรีย ปจจุบันประกอบดวยสมาชิกจากหลายองคกร ที่รวมตัวกันตอตานทุกผูที่หมายจะกดขี่ชนชั้นกรรมาชีพบัลแกเรีย"
 BUL_fatherland_front_negative_desc: "แนวรวมปตุภูมิเปนขบวนการตอตานทางการเมืองที่กอตั้งขึ้นเดิมโดยพรรคกรรมกรบัลแกเรียซึ่งเปนคอมมิวนิสต แตปจจุบันรวมกลุมและองคกรหลายแหงที่มีอุดมการณแตกตางกันอยางมาก ซึ่งรวมตัวกันตอตานเผด็จการทหารที่นิยมเยอรมนีในบัลแกเรีย"
 BUL_paramilitary_organizations: "องคกรกึ่งทหาร"
 BUL_paramilitary_organizations_desc: "สมาชิกขององคกรกึ่งทหารคือผูภักดีที่มีวินัยทางทหารอยูบางแลว และพรอมจะทําสงครามเพื่อเกียรติยศอันยิ่งใหญของประเทศเรา นับตั้งแตเราไดรับความภักดีจากพวกเขา พวกเขาก็พิสูจนตัวเองวาเปนแหลงกําลังพลที่พึ่งพาได"
 BUL_brannik: "บรานนิก"
 BUL_brannik_desc: "องคกรเยาวชนแหงชาติที่นิยมฟาสซิสตซึ่งกอตั้งโดยบอกดัน ฟลอฟนี้ กําลังขยายตัวใหญขึ้นเรื่อย ๆ และนับตั้งแตกอตั้ง ก็ไดมอบสมาชิกจํานวนมากที่กระตือรือรนจะเขารวมกองทัพของเรา"
 BUL_liberal_trade_policies: "นโยบายการคาเสรี"
 BUL_liberal_trade_policies_desc: "เศรษฐกิจบัลแกเรียซวนเซจากวิกฤตหนึ่งไปสูอีกวิกฤตหนึ่งนับตั้งแตไดรับเอกราชจากจักรวรรดิออตโตมัน นโยบายพึ่งพาตนเองพิสูจนแลววาไมเพียงพอในอดีต ถึงเวลาแลวที่จะกาวไปสูการเปดเสรีทางเศรษฐกิจ"
 BUL_bulgarian_patriarchate_restored: "สังฆราชบัลแกเรีย"
 BUL_bulgarian_patriarchate_restored_desc: "ในที่สุดเราก็ฟนฟูศักดิ์ศรีของคริสตจักรออรโธดอกซบัลแกเรียได และประชาชนตางยินดีกับการเลือกตั้งพระสังฆราชบัลแกเรียองคแรก นับตั้งแตการลมสลายของทารโนโวภายใตการปกครองของออตโตมันในป 1393"
 BUL_national_industry_01: "อุตสาหกรรมแหงชาติ"
 BUL_national_industry_01_desc: "เราไดจัดหาเครื่องมือทันสมัยสําหรับการผลิตทางอุตสาหกรรม อาจเปนเพียงกาวเล็ก ๆ แตเปนกาวที่จําเปนบนเสนทางสูการพัฒนาอุตสาหกรรมแหงชาติที่แข็งแกรง"
 BUL_national_industry_02: "อุตสาหกรรมแหงชาติ"
 BUL_national_industry_02_desc: "โครงการพัฒนาอุตสาหกรรมแหงชาติของเราพิสูจนแลววามีตนทุนสูง แตก็ประสบความสําเร็จอยางมาก เพราะชวยใหเกิดอุตสาหกรรมใหมหลายแขนง และปรับปรุงอุตสาหกรรมที่มีอยูบางสวนใหทันสมัย"
 BUL_foreign_industry_dynamic_modifier: "อุตสาหกรรมตางชาติ"
 BUL_foreign_industry_dynamic_modifier_desc: "เราขาดหนทางที่จะสรางอุตสาหกรรมที่ทรงพลังและมีประสิทธิภาพไดดวยตนเอง ทางเลือกที่ดีที่สุดจึงเปนการดึงดูดนักลงทุนตางชาติที่ตองการขยายธุรกิจและดําเนินกิจการในบัลแกเรีย"
 BUL_tobacco_exports: "การสงออกยาสูบ"
 BUL_tobacco_exports_desc: "เรากําลังเปลี่ยนจากการปลูกธัญพืชไปเปนยาสูบซึ่งมีมูลคาสูงกวา และสรางรายไดมหาศาลใหแกเรา"
 BUL_nationalized_industry: "อุตสาหกรรมที่โอนเปนของรัฐ"
 BUL_nationalized_industry_desc: "เราไดยึดโรงงานตางชาติทุกแหงในบัลแกเรีย ซึ่งชวยเพิ่มขีดความสามารถในการผลิตทางอุตสาหกรรมของเราอยางมาก"
 BUL_aircraft_repair_facilities: "ศูนยซอมบํารุงอากาศยาน"
 BUL_aircraft_repair_facilities_desc: "เราไดพัฒนาโครงการขยายศูนยซอมอากาศยานเทเรม เกออรกี เบนคอฟสกี ทําใหกองทัพอากาศของเราสามารถบํารุงรักษาและซอมแซมอากาศยานไดอยางเต็มประสิทธิภาพ"
 BUL_international_pilot_training_program: "โครงการฝกนักบินนานาชาติ"
 BUL_international_pilot_training_program_desc: "เรามีโครงการฝกนักบินนานาชาติที่ดําเนินอยู ซึ่งชวยเพิ่มจํานวนนักบินและลูกเรือที่มีฝมือใหแกกองทัพอากาศของเราอยางมาก"
 BUL_bulgarian_army_01: "กองทัพบัลแกเรีย"
 BUL_bulgarian_army_01_desc: "เราถูกลอมรอบดวยศัตรูที่อาจเกิดขึ้น ดังที่ประวัติศาสตรไดสอนเราอยางโหดราย และหากเราตองการชนะในความขัดแยงใด ๆ ในอนาคต จําเปนอยางยิ่งที่จะตองสรางกองทัพที่ทรงพลังและพัฒนายุทธวิธีสมัยใหม"
 BUL_prussia_of_the_balkans_01: "ปรัสเซียแหงบอลขาน"
 BUL_prussia_of_the_balkans_01_desc: "ในชวงแรกเริ่ม ราชอาณาจักรซารแหงบัลแกเรียเปนรัฐที่มีการทหารเขมแข็ง มีกองทัพขนาดใหญและยุทโธปกรณครบครัน จนไดรับขนานนามวาปรัสเซียแหงบอลขาน จนกระทั่งถูกพันธมิตรเกาผูทรยศหักหลัง อยางไรก็ตาม เราไดฟนฟูประเทศหลังความพายแพอันนาอัปยศในอดีต และบัดนี้ถึงเวลาที่จะทวงคืนความรุงโรจนในอดีตของบัลแกเรีย โลกจะตองเรียกเราวาปรัสเซียแหงบอลขานอีกครั้ง!"
 BUL_worker_strikes: "การนัดหยุดงานของกรรมกร"
 BUL_worker_strikes_desc: "พวกสังคมนิยมสายกวางไดรวมมือกับคอมมิวนิสตในความพยายามจุดชนวนการนัดหยุดงานทั่วประเทศในหมูกรรมกรอุตสาหกรรม ซึ่งขัดขวางการผลิตของเราอยางรุนแรงและกอใหเกิดการปะทะระหวางพวกเขากับเจาหนาที่"
 BUL_buhovo_uranium_mines: "เหมืองยูเรเนียมบูโฮโว"
 BUL_buhovo_uranium_mines_desc: "มีการคนพบแหลงแรยูเรเนียมจํานวนมากในบูโฮโว เมืองของบัลแกเรียใกลกรุงโซเฟย เหมืองของเรากําลังสกัดทรัพยากรลํ้าคานี้ ซึ่งพิสูจนแลววามีความสําคัญยิ่งตอการพัฒนาอาวุธทางทหารรูปแบบใหมที่ทรงพลัง"
 BUL_uranium_concession_agreement_ns: "ขอตกลงสัมปทานยูเรเนียม"
 BUL_uranium_concession_agreement_ns_desc: "เราไมสามารถใชประโยชนจากแหลงแรยูเรเนียมในผืนดินของเราไดอยางเต็มที่ และจะเปนประโยชนมากกวา ไมเพียงตอเราแตยังตอพันธมิตร[FROM.GetAdjective]ดวย หากเราลงนามในสัญญามอบสิทธิ์การขุดคนใหพวกเขา แลกกับวัตถุดิบและผลิตภัณฑที่เปนประโยชนตออุตสาหกรรมและเกษตรกรรมในประเทศของเรา"
 BUL_volunteers_in_spain_republican: "อาสาสมัครในสเปน"
 BUL_volunteers_in_spain_republican_desc: "[GetSpanishStruggleFocusLoc]"
 BUL_volunteers_in_spain_nationalist: "อาสาสมัครในสเปน"
 BUL_volunteers_in_spain_nationalist_desc: "[GetSupportTheSpanishCoupFocusLoc]"
 BUL_elites_crushed: "กวาดลางชนชั้นนํา"
 BUL_elites_crushed_desc: "เราไดริบอภิสิทธิ์มากมายของชนชั้นสูงบัลแกเรีย แตผลที่ตามมาคือเราไดสรางศัตรูจํานวนไมนอยในตําแหนงสําคัญทางการเมืองและการทหาร เราตองกําจัดบุคคลเหลานี้ที่ไมไดทําอะไรนอกจากขัดขวางความกาวหนาทางสังคมในบัลแกเรีย"
 BUL_government_reforms_communists_01: "การปฏิรูปของรัฐบาล"
 BUL_government_reforms_communists_01_desc: "การปฏิรูปที่รัฐบาลดําเนินการในดานเกษตรกรรมและอุตสาหกรรม ยอมมีความสําคัญอยางไมตองสงสัยตอการพัฒนาและความกาวหนาของชาติบัลแกเรีย"
 BUL_trained_youth_wings: "ฝายเยาวชนที่ผานการฝก"
