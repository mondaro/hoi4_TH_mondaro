l_english:
 GRE_debt_to_the_ifc: "หนี้ตอ I.F.C."
 GRE_debt_to_the_ifc_desc: "กรีซมีหนี้สินจํานวนมหาศาลตอคณะกรรมาธิการการเงินระหวางประเทศ องคกรที่ครั้งหนึ่งเคยทรงอิทธิพล แตปจจุบันมีเพียงสหราชอาณาจักร ฝรั่งเศส และอิตาลีเปนประธาน แม I.F.C. จะอยูในสภาพเทอะทะ แตประเทศสมาชิกยังคงตองการใหกรีซชําระหนี้เต็มจํานวน - หมายความวาจนกวาเราจะชําระหนี้หมด หรือหลุดพนดวยวิธีอื่น I.F.C. จะกุมกระเปาเงินของเราไว"
 GRE_debt_to_the_ifc_2: "หนี้ตอ I.F.C."
