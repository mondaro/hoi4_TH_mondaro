 GRE_metaxism_7_desc: "ลัทธิเมทาซัสคืออุดมการณที่จะใชสรางอารยธรรมกรีกที่สาม ลัทธิเมทาซัสยึดถือบรรษัทนิยม ชาตินิยม และอํานาจนิยมเปนหลักการที่ชาติ[ROOT.GetAdjective]ทั้งมวลจะเติบโตและรุงเรือง"
 GRE_martyrs_of_the_anatolian_catastrophe: "มรณสักขีแหงมหันตภัยอานาโตเลีย"
 GRE_martyrs_of_the_anatolian_catastrophe_desc: "เราใหคํามั่นตอไมเพียงผูที่สละชีพในการรบกับชาวเติรกเมื่อป 1922 แตยังรวมถึงผูที่ถูกขับไลออกจากบานและถูกบังคับใหมาใชชีวิตอยางแรนแคนที่นี่ นั่นคือความลมเหลวที่จะชําระแคนไดเพียงวิธีเดียว คือการพิชิตคอนสแตนติโนเปล รัฐบุรุษผูยิ่งใหญทานหนึ่งเคยกลาวไววา 'คอนสแตนติโนเปลคือมหานครหลวง คือนครแหงนคร คือความฝนและความหวังของชาวกรีกทั้งปวง' เราจะถูกจดจําในฐานะผูนําผูยิ่งใหญที่ในที่สุดก็ทําความฝนนิรันดรของชาวกรีกใหเปนจริง และดวยการนั้นเราจะลางมลทินจากเหตุการณป 1922"
 GRE_farmer_culture: "วัฒนธรรมที่มุงเนนเกษตรกร"
 GRE_farmer_culture_desc: "เราไมจําเปนตองอับอายกับรากเหงาเกษตรกรรมของเรา เราสามารถกาวสูยุคสมัยใหมโดยไมลืมงานฝมือที่นิยามตัวตนของเรามาหลายศตวรรษ เราเขาใจคนงานชาวกรีก และเราไมกลัวที่จะยกยองงานฝมือของเขาอีกตอไป ไมวามันจะมีประโยชนตอรัฐหรือไมก็ตาม"
 GRE_industrializing_society: "สังคมที่กําลังเปนอุตสาหกรรม"
 GRE_industrializing_society_desc: "เราอยูในยุคของเครื่องจักรสงคราม และไมอาจยอมใหคนงานชาวกรีกสวนใหญใชชีวิตตรากตรําในไรผลิตสินคาฟุมเฟอยไรประโยชนอีกตอไป เราไดเริ่มการเปลี่ยนผานที่จะปรับโฉมกรีซและชาวกรีกอยางถึงราก แมนาเสียดายที่เราไมอาจคาดหวังใหชาวกรีกตามทันไดเต็มที่ในอีกหลายทศวรรษ"
 GRE_industrializing_society_communist: "สังคมที่กําลังเปนอุตสาหกรรม"
 GRE_industrializing_society_communist_desc: "เราอยูในยุคของเครื่องจักรสงคราม และไมอาจยอมใหคนงานชาวกรีกสวนใหญใชชีวิตตรากตรําในไรผลิตสินคาฟุมเฟอยไรประโยชนอีกตอไป เราไดเริ่มการเปลี่ยนผานที่จะปรับโฉมกรีซและชาวกรีกอยางถึงราก แมนาเสียดายที่เราไมอาจคาดหวังใหชาวกรีกตามทันไดเต็มที่ในอีกหลายทศวรรษ"
 GRE_command_economy: "เศรษฐกิจแบบสั่งการ"
 GRE_command_economy_desc: "เราอยูในยุคของเครื่องจักรสงคราม และไมอาจยอมใหคนงานชาวกรีกสวนใหญใชชีวิตตรากตรําในไรผลิตสินคาฟุมเฟอยไรประโยชนอีกตอไป เราไดเริ่มการเปลี่ยนผานที่จะปรับโฉมกรีซและชาวกรีกอยางถึงราก และดวยเศรษฐกิจที่รัฐเปนผูบริหาร เราจะนําทางชาวกรีกไปในทิศทางที่ถูกตอง"
 GRE_agricultural_communes_idea: "การเกษตรแบบนารวม"
 GRE_agricultural_communes_idea_desc: "กรีซพึ่งพาการเกษตรและอุตสาหกรรมเบามาแตดั้งเดิม โดยมีผลิตภัณฑเชิงพาณิชยอยางยาสูบเปนสินคาสงออกหลัก การพึ่งพารูปแบบการผลิตแบบดั้งเดิมเคยทําใหเราตองพึ่งพาอุตสาหกรรมหนักของมหาอํานาจที่ใหญกวาสําหรับโครงการกอสราง แตเมื่อฟารมทั้งหมดถูกจัดระเบียบภายใตแผนนารวม เราจะเตรียมพรอมสําหรับโครงการที่ทะเยอทะยานยิ่งขึ้นในอนาคตไดดีกวาเดิม"
 GRE_farmer_managed_communes: "คอมมูนเกษตรที่เกษตรกรบริหารเอง"
 GRE_farmer_managed_communes_desc: "เราไมจําเปนตองอับอายกับรากเหงาเกษตรกรรมของเรา เราสามารถกาวสูยุคสมัยใหมโดยไมลืมงานฝมือที่นิยามตัวตนของเรามาหลายศตวรรษ เราเขาใจคนงานชาวกรีก และเราไมกลัวที่จะยกยองงานฝมือของเขา หรือมอบอํานาจควบคุมการดํารงชีพของเขาใหมากขึ้นอีกตอไป"
 GRE_rural_exodus: "การอพยพออกจากชนบท"
 GRE_rural_exodus_Desc: "ดวยการผลักดันสูการเปนอุตสาหกรรม ผูคนไดทิ้งบานในพื้นที่ชนบทของประเทศเพื่อหลั่งไหลเขาสูเมืองใหญ"
 GRE_sophistry_and_science_idea: "วาทศิลปและวิทยาศาสตร"
 GRE_sophistry_and_science_idea_desc: "ดวยการสงเสริมการพึ่งพาอาศัยกันระหวางนักการเมืองและนักวิทยาศาสตร เราจะกาวเขาใกลความทันสมัยไปอีกขั้น"
 GRE_megali_idea_triumphant: "ชัยชนะแหงเมกาลีไอเดีย"
 GRE_megali_idea_triumphant_desc: "สําเร็จแลว: เราชนะแลว! ความทรงจําของเอเลฟเทริออส เวนิเซลอส ไดรับการแกแคนแลว และในที่สุด [ROOT.GetNameDef] ก็บรรลุชะตากรรมของตน"
 GRE_eon: "องคการเยาวชนแหงชาติ"
 GRE_eon_desc: "มีบางสิ่งที่นาชื่นชมในวิธีที่ชาวเยอรมันและชาวอิตาลีจัดระเบียบเยาวชนของพวกเขา เราสามารถปรับใชแบบอยางของพวกเขาเพื่อใหมั่นใจวาเยาวชนของเราจะไมประพฤติตนตอตานสังคมหรือไมเคารพผูนําผูยิ่งใหญของเรา [ROOT.GetLeader]"
 GRE_eon_fascist: "องคการเยาวชนแหงชาติ"
 GRE_eon_fascist_desc: "มีบางสิ่งที่นาชื่นชมในวิธีที่ชาวเยอรมันและชาวอิตาลีจัดระเบียบเยาวชนของพวกเขา เราสามารถปรับใชแบบอยางของพวกเขาเพื่อใหมั่นใจวาเยาวชนของเราจะไมประพฤติตนตอตานสังคมหรือไมเคารพผูนําผูยิ่งใหญของเรา [ROOT.GetLeader]"
 GRE_security_batallions: "กองพันรักษาความมั่นคง"
 GRE_security_batallions_desc: "เพื่อรักษาความสงบในดินแดนที่ยึดครองและในประเทศของเราเอง เราจําตองจัดตั้งกองพันรักษาความมั่นคงซึ่งประกอบดวยพวกฟาสซิสตที่แข็งขันที่สุดที่ชาติของเรามี"
 GRE_eee_in_government: "แนวรวมกับ EEE"
 GRE_eee_in_government_desc: "ความจําเปนบีบใหเราตองเขาขางพรรคฟาสซิสตเอทนิกี เอโนซิส เอลลาโดส เราไดแตหวังวาการตัดสินใจรวมมือกับพวกฟาสซิสตครั้งนี้จะไมยอนกลับมาทํารายเราในอนาคต..."
 GRE_booming_tourism: "อุตสาหกรรมทองเที่ยวเฟองฟู"
 GRE_booming_tourism_desc: "ผูคนจากตางแดนเดินทางมายัง [ROOT.GetNameDef] มากกวาชวงเวลาใดในประวัติศาสตรที่มีการบันทึกไว!"
 GRE_four_year_plan_spirit: "แผนสี่ป"
 GRE_improving_our_defensive_lines: "[Root.GetDefensiveLineName]"
 GRE_DEFENSIVE_FORT_SPIRIT_STANDARD: "ปรับปรุงแนวเลโอนีดัสใหทันสมัย"
 GRE_DEFENSIVE_FORT_SPIRIT_METAXAS: "ปรับปรุงแนวเมทาซัสใหทันสมัย"
 GRE_improving_our_defensive_lines_desc: "การรุกที่ดีที่สุดคือการตั้งรับที่ดี และเราตั้งใจจะมีแนวปองกันที่ไมมีใครเอาชนะไดโดยสิ้นเชิง"
 GRE_protectors_of_the_mediterranean_spirit: "[Root.GetProtectorsMediterraneanSpiritName]"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_STANDARD: "ผูพิทักษแหงเมดิเตอรเรเนียน"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_MONARCHIST: "แชมเปยนแหงเมดิเตอรเรเนียน"
 GRE_protectors_of_the_mediterranean_spirit_desc: "เมดิเตอรเรเนียนเปนบานของเรามายาวนานกวาของผูใดทั้งสิ้น เรามีความรับผิดชอบตอภูมิภาคนี้และตอผูคนในภูมิภาค - และเราไมตั้งใจจะละทิ้งหนาที่อันศักดิ์สิทธิ์นี้"
 GRE_ancient_talents: "พรสวรรคแตโบราณ"
 GRE_ancient_talents_desc: "เราชื่นชอบการเดินเรือมาเสมอนับตั้งแตยุคสําริด ดวยการสงเสริมประเพณีทางทะเลที่เขมแข็ง เราไดแสดงความเคารพตอประเพณีอันเกาแกที่ไหลเวียนอยูในสายเลือดของเรา"
 GRE_hellenic_army: "กองทัพกรีก"
 GRE_hellenic_army_desc: "กองทัพของเราอาจดูไมนาประทับใจนักในสายตาผูสังเกตการณที่มาเยือน แตประชาชนของเรามีจิตวิญญาณนักสูอยางแทจริง เปนเปลวไฟในใจที่ไมยอมมอดดับ คุณสมบัติเชนนี้หาไดยาก และเราตองไมกลัวที่จะใชประโยชนจากมัน เพื่อใหเราเผชิญหนาศัตรูไดอยางทัดเทียม"
 GRE_hellenic_army_2: "กองทัพกรีก"
 GRE_hellenic_army_2_desc: "กองทัพของเราอาจไมมีวันเปนกองทัพที่ใหญที่สุดในคาบสมุทรบอลขาน แตจะเปนกองทัพที่มีประสิทธิภาพที่สุดอยางแนนอน"
 GRE_hellenic_army_3: "กองทัพกรีก"
 GRE_hellenic_army_3_desc: "กองทัพของเราอาจไมมีวันเปนกองทัพที่ใหญที่สุดในคาบสมุทรบอลขาน แตจะเปนกองทัพที่มีประสิทธิภาพที่สุดอยางแนนอน"
 GRE_byzantine_army: "กองทัพไบแซนไทน"
 GRE_byzantine_army_desc: "เมื่อไมนานมานี้เรายังหมกมุนกับการมีกองทัพที่สามารถรักษาและปกปองพรมแดนของเรา แตวันนี้เราติดอาวุธและฝกทหารที่พรอมจะเดินทัพขามครึ่งโลกเพื่อทวงคืนจักรวรรดิ กองทัพของเราไมเหมือนกองทัพใดในโลก และดวยกองทัพนี้ ในที่สุดเราจะทวงคืนสิ่งที่ถูกพรากไปจากเรา"
 GRE_hellenic_air_force_academy: "โรงเรียนนายเรืออากาศกรีก"
 GRE_hellenic_air_force_academy_desc: "นักบินของเรามีความเต็มใจ มีความสามารถ และเชี่ยวชาญ - พวกเขาบัญชาการกองทัพอากาศที่คูควรกับชาติของเรา"
 GRE_venerate_the_ancient_hellenes_spirit: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_spirit_desc: "เราไมใชทายาทของชาวกรีกผูนาเคารพในอดีตหรอกหรือ? เราไมไดมีสายเลือดเดียวกับเหลาปรมาจารยแหงวาทศาสตร ปรัชญา และการสงครามหรอกหรือ? เราจะปลูกฝงความภาคภูมิใจอันแรงกลากลับคืนสูประชาชนของเรา เพื่อใหเราไดกลับมาเปนดาวนําทางแหงยุโรปอีกครั้ง"
 GRE_venerate_the_ancient_hellenes_2: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_2_desc: "เราจะเรียนรูจากความเฉลียวฉลาดของนักรบธีบส ผูโคนลมความเปนเจาของสปารตาดวยกําลังและปญญา"
 GRE_venerate_the_ancient_hellenes_3: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_3_desc: "เราจะเรียนรูจากนักปรัชญาแหงเอเธนส ผูคิดคนแนวคิดประชาธิปไตยดังที่เรารูจักในปจจุบัน"
 GRE_venerate_the_ancient_hellenes_4: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_4_desc: "เราจะเรียนรูจากแบบอยางของราชวงศอารกีด ผูพิชิตครึ่งหนึ่งของโลกที่รูจักในขณะนั้นโดยเริ่มจากมาซิโดเนียอันตํ่าตอย"
 GRE_venerate_the_ancient_hellenes_5: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_5_desc: "เราจะเรียนรูจากความเฉลียวฉลาดของนักรบธีบสผูโคนลมความเปนเจาของสปารตา และจากนักปรัชญาแหงเอเธนส ผูคิดคนแนวคิดประชาธิปไตยดังที่เรารูจักในปจจุบัน"
 GRE_venerate_the_ancient_hellenes_6: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_6_desc: "เราจะเรียนรูจากความเฉลียวฉลาดของนักรบธีบสผูโคนลมความเปนเจาของสปารตา และจากแบบอยางของราชวงศอารกีด ผูพิชิตครึ่งหนึ่งของโลกที่รูจักในขณะนั้นโดยเริ่มจากมาซิโดเนียอันตํ่าตอย"
 GRE_venerate_the_ancient_hellenes_7: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_7_desc: "เราจะเรียนรูจากนักปรัชญาแหงเอเธนสผูคิดคนแนวคิดประชาธิปไตยดังที่เรารูจักในปจจุบัน และจากแบบอยางของราชวงศอารกีด ผูพิชิตครึ่งหนึ่งของโลกที่รูจักในขณะนั้น โดยเริ่มจากมาซิโดเนียอันตํ่าตอย"
 GRE_venerate_the_ancient_hellenes_8: "ยกยองชาวเฮลลีนโบราณ"
 GRE_venerate_the_ancient_hellenes_8_desc: "เรายังคงมีคุณสมบัติทั้งหมดที่ทําใหบรรพบุรุษของเรายิ่งใหญ และเพียงผลักดันอีกเล็กนอย เราก็สามารถปลุกคุณสมบัติเหลานั้นในตัวประชาชนของเราขึ้นมาไดอีกครั้ง"
 GRE_reviving_the_double_headed_eagle_spirit: "ฟนคืนจิตวิญญาณแหงอินทรีสองหัว"
 GRE_reviving_the_double_headed_eagle_spirit_desc: "พวกเวนิเซลอสเปนพวกขี้ขลาดที่ไมยอมใหกรีซฟนฟูเกียรติภูมิที่สูญหายไปอยางแทจริง – เกียรติภูมิแหงไบแซนเทียม! จะหยุดแคชายฝงตุรกีทําไม ในเมื่อเราสามารถทวงคืนดินแดนที่สูญเสียไปทั้งหมดของจักรวรรดิได? ยุคใหมแหงเกียรติภูมิของกรีซไดเริ่มตนขึ้นแลว!"
 GRE_reviving_the_double_headed_eagle_2: "ฟนคืนจิตวิญญาณแหงอินทรีสองหัว"
 GRE_reviving_the_double_headed_eagle_2_desc: "พวกเวนิเซลอสเปนพวกขี้ขลาดที่ไมยอมใหกรีซฟนฟูเกียรติภูมิที่สูญหายไปอยางแทจริง – เกียรติภูมิแหงไบแซนเทียม! จะหยุดแคชายฝงตุรกีทําไม ในเมื่อเราสามารถทวงคืนดินแดนที่สูญเสียไปทั้งหมดของจักรวรรดิได? ยุคใหมแหงเกียรติภูมิของกรีซไดเริ่มตนขึ้นแลว!"
 GRE_socialist_economy_spirit: "สังคมนิยมกรีก"
 GRE_socialist_economy_spirit_desc: "เราไดใชระบบเศรษฐกิจที่ใหความสําคัญกับประชาชนมากกวาผลกําไร เรามีศัตรูที่ชัดเจน คือนายทุนตางชาติผูขูดรีด และพวกฉวยโอกาสในประเทศที่หมายจะโกงคาตอบแทนอันเปนธรรมของคนงาน[ROOT.GetAdjective]"
 GRE_socialist_economy_2: "สังคมนิยมกรีก"
 GRE_socialist_economy_2_desc: "ชาวกรีกตองหลั่งเลือดมานานเกินไปภายใตการปกครองแบบอัตตาธิปไตยของกษัตริยจอมปลอมและพวกเวนิเซลอสผูกระหายสงคราม ถึงเวลาแลวที่ประชาชนจะรุงเรืองภายใตรัฐบาลที่ใหความสําคัญกับพวกเขาเปนอันดับแรก!"
 GRE_socialist_economy_3: "ลัทธิสตาลินกรีก"
 GRE_socialist_economy_3_desc: "พรรคมากอนสิ่งอื่นใด หากผูใดไมภักดีตอพรรค ผูนั้นคือคนทรยศที่บอนทําลายและเปนภัยตอทั้งชาติ"
 GRE_socialist_economy_4: "คอมมิวนิสตกรีก"
 GRE_socialist_economy_4_desc: "คนงานมากอนสิ่งอื่นใด หากเราในฐานะรัฐบาลที่คนงานเลือกขึ้นมาและประกอบดวยคนงาน ไมอาจเปนตัวแทนผลประโยชนสูงสุดของคนงานได แลวใครเลาจะทําได?"
 GRE_cooperative_trade_unions: "สหภาพแรงงานแบบสหกรณ"
 GRE_red_militias_spirit: "กองกําลังอาสาแดง"
 GRE_red_militias_spirit_desc: "มีหลายฝายที่หมายจะขัดขวางความพยายามของเราในการปรับปรุงสังคมกรีกใหทันสมัย แตดวยการจัดตั้งกองกําลังอาสาที่อุทิศตนเพื่อพิทักษการปฏิวัติ พวกเขาจะหยุดยั้งเราไดยากยิ่งขึ้น"
 GRE_red_militias_2: "กองทัพแดง"
 GRE_red_militias_2_desc: "รัฐคอมมิวนิสตที่แทจริงตองมีกองทัพประชาชนที่สามารถปฏิบัติตามเจตจํานงของคนงานไดโดยไมตองเกรงกลัวสิ่งใด"
 GRE_red_militias_3: "ผูบังคับใชแดง"
 GRE_red_militias_3_desc: "สายลับบอนทําลายที่สมคบคิดตอตานพรรคมีอยูทุกหนแหง แตเราเพียงตองฝกคนที่มีความสามารถกลุมเล็ก ๆ เพื่อตามหาและถอนรากถอนโคนพวกมัน..."
