 TUR_kemalist_army_officers_powerful_neutral_desc: "คณะนายทหารชั้นยอดของตุรกีเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง ลัทธิเคมาลไมเคยหยั่งรากลึกในตุรกีเทาวันนี้มากอน"
 TUR_kemalist_army_officers_powerful_disloyal: "นายทหารฝายเคมาล"
 TUR_kemalist_army_officers_powerful_disloyal_desc: "คณะนายทหารชั้นยอดของตุรกีเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง ลัทธิเคมาลไมเคยหยั่งรากลึกในตุรกีเทาวันนี้มากอน และคณะนายทหารยอมรังเกียจเราอยางแนนอนที่ทําตัวขัดกับคานิยมเคมาลในยามที่ลัทธิเคมาลไดรับความเคารพจากผูคนมากมาย"
 TUR_kemalist_army_officers_extended_power_loyal: "นายทหารฝายเคมาล"
 TUR_kemalist_army_officers_extended_power_loyal_desc: "คณะนายทหารชั้นยอดของตุรกีเปนผูพิทักษคานิยมเคมาลที่แข็งขันที่สุดกลุมหนึ่ง ลัทธิเคมาลคอย ๆ ชนะใจผูคนทั่วตุรกีดังที่อตาเติรกหวังไว และคณะนายทหารยืนหยัดเคียงขางรัฐบาลชุดปจจุบันตอตานภัยทั้งปวงตออธิปไตยของตุรกี"
