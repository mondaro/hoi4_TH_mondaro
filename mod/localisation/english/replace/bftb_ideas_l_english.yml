 TUR_sectarian_woes_desc: "§W[TUR.GetNameDefCap]มีความแตกแยกภายในที่สะทอนออกมาตามภูมิศาสตรผาน§! §Yตัวปรับคาของรัฐ§!§W: กลุม§! £faction_tur_kemalist §Yเคมาลิสต§! §Wอยูทางตะวันตกและทางเหนือ กลุม§! £faction_tur_traditionalist §Yอนุรักษนิยม§! §Wสายศาสนาอยูในดินแดนตอนในสวนกลางและทางใต สวน§! £faction_tur_kurdish §Yชาวเคิรด§! §Wอยูทางตะวันออกเฉียงใตของประเทศ§! \n\n§Wสามารถดําเนินการกับ§! §Yกลุมตาง ๆ§! §Wไดผาน§! §Yแท็บการตัดสินใจ§!§W รวมถึงผาน§! §Yผลของแผนยุทธศาสตร§! §Wและ§! §Yตัวเลือกในเหตุการณ§!§Wบางสวน§! \n\nตุรกีถูกรุมเราดวยความแตกแยกภายในทั้งทางอุดมการณ ศาสนา และชาติพันธุ กลุมเคมาลิสตหวังจะเปลี่ยนตุรกีใหเปนรัฐฆราวาส แตประชากรจํานวนมากตอตานแนวคิดฆราวาสนิยมอยางถึงรากถึงโคน ทางตะวันออก ชาวเคิรดไดสรางความยุงยากใหรัฐบาลตุรกีอยางมาก และดูเหมือนจะมุงมั่นเลือกหนทางกบฏมากกวายอมถูกกลืนกลาย หากจะเยียวยาความแตกแยกภายในประเทศ เราจําเปนตองจัดการปญหาเหลานี้ดวยความนุมนวล หรือไมก็ดวยกําปนเหล็ก"
 TUR_sectarian_woes_1: "ความแตกแยกภายในชาติ"
 TUR_sectarian_woes_1_desc: "§W[TUR.GetNameDefCap]มีความแตกแยกภายในที่สะทอนออกมาตามภูมิศาสตรผาน§! §Yตัวปรับคาของรัฐ§!§W: กลุม§! £faction_tur_kemalist §Yเคมาลิสต§! §Wอยูทางตะวันตกและทางเหนือ กลุม§! £faction_tur_traditionalist §Yอนุรักษนิยม§! §Wสายศาสนาอยูในดินแดนตอนในสวนกลางและทางใต สวน§! £faction_tur_kurdish §Yชาวเคิรด§! §Wอยูทางตะวันออกเฉียงใตของประเทศ§! \n\n§Wสามารถดําเนินการกับ§! §Yกลุมตาง ๆ§! §Wไดผาน§! §Yแท็บการตัดสินใจ§!§W รวมถึงผาน§! §Yผลของแผนยุทธศาสตร§! §Wและ§! §Yตัวเลือกในเหตุการณ§!§Wบางสวน§! \n\nตุรกีถูกรุมเราดวยความแตกแยกภายในทั้งทางอุดมการณ ศาสนา และชาติพันธุ กลุมเคมาลิสตหวังจะเปลี่ยนตุรกีใหเปนรัฐฆราวาส แตประชากรจํานวนมากยังคงตอตานแนวคิดฆราวาสนิยมอยางถึงรากถึงโคน หากจะเยียวยาความแตกแยกภายในประเทศ เราจําเปนตองจัดการปญหาเหลานี้ดวยความนุมนวล หรือไมก็ดวยกําปนเหล็ก"
 TUR_sectarian_woes_2: "ความแตกแยกภายในชาติ"
 TUR_sectarian_woes_desc_2: "§W[TUR.GetNameDefCap]มีความแตกแยกภายในที่สะทอนออกมาตามภูมิศาสตรผาน§! §Yตัวปรับคาของรัฐ§!§W: กลุม§! £faction_tur_kemalist §Yเคมาลิสต§! §Wอยูทางตะวันตกและทางเหนือ กลุม§! £faction_tur_traditionalist §Yอนุรักษนิยม§! §Wสายศาสนาอยูในดินแดนตอนในสวนกลางและทางใต สวน§! £faction_tur_kurdish §Yชาวเคิรด§! §Wอยูทางตะวันออกเฉียงใตของประเทศ§! \n\n§Wสามารถดําเนินการกับ§! §Yกลุมตาง ๆ§! §Wไดผาน§! §Yแท็บการตัดสินใจ§!§W รวมถึงผาน§! §Yผลของแผนยุทธศาสตร§! §Wและ§! §Yตัวเลือกในเหตุการณ§!§Wบางสวน§! \n\nตุรกีถูกรุมเราดวยความแตกแยกภายในทั้งทางอุดมการณ ศาสนา และชาติพันธุ ทางตะวันออก ชาวเคิรดไดสรางความยุงยากใหรัฐบาลตุรกีอยางมาก และดูเหมือนจะมุงมั่นเลือกหนทางกบฏมากกวายอมถูกกลืนกลาย หากจะเยียวยาความแตกแยกภายในประเทศ เราจําเปนตองจัดการปญหาเหลานี้ดวยความนุมนวล หรือไมก็ดวยกําปนเหล็ก"
 TUR_rearmament_scheme: "แผนการฟนฟูกําลังรบที่เตรียมไว"
 TUR_rearmament_scheme_desc: "แผนการฟนฟูกําลังรบอยางครอบคลุมไดรับการเตรียมการไวมาระยะหนึ่งแลว เพียงแตยังไมมีความจําเปนตองนํามาใช - ทวาบัดนี้โลกกําลังยืนอยูบนปากเหวของสงครามอีกครั้ง และตุรกีจะไมยอมถูกจูโจมโดยไมทันตั้งตัว"
 TUR_infrastructure_privatised_idea: "โครงสรางพื้นฐานที่แปรรูปเปนของเอกชน"
 TUR_infrastructure_privatised_idea_desc: "การใหภาคเอกชนเขามามีสวนควบคุมโครงสรางพื้นฐานของรัฐ ทําใหเรามีทรัพยากรเหลือไปจัดสรรดานอื่นมากขึ้น แตในตอนนี้ก็ทําใหการสรางโครงสรางพื้นฐานเพิ่มเติมกลายเปนเรื่องที่ลาชาติดขัดอยางนารําคาญ"
 TUR_financing_private_enterprise: "สนับสนุนทุนแกวิสาหกิจเอกชน"
 TUR_financing_private_enterprise_desc: "เปนหนาที่ของรัฐที่จะสรางแรงจูงใจและมอบรางวัลแกผูที่มีหัวการคามากที่สุดในหมูประชาชนของเรา การลงทุนในผูที่จะทําใหชาติดีขึ้น ก็คือการลงทุนในอนาคตของประเทศเรา"
 TUR_etatism: "ลัทธิรัฐนิยมเศรษฐกิจ (เอตาติซึม)"
 TUR_etatism_desc: "เศรษฐกิจแบบผสมของเราไมเหมือนที่ใดในโลก: มีทั้งองคประกอบของเสรีนิยมแบบอังกฤษ บรรษัทนิยมแบบอิตาลี และการวางแผนจากสวนกลางแบบโซเวียต นี่คือการหลอมรวมสุดยอดของแบบจําลองทางเศรษฐกิจ และเปนเพชรเม็ดงามแหงระบอบเคมาลิสต \n\n§Rหากเรายกระดับกฎหมายเศรษฐกิจ ก็ควรเตรียมรับมือกับความขัดแยงที่จะเกิดขึ้นระหวางแบบจําลองทางเศรษฐกิจที่เขากันไมไดของเรา§!"
 TUR_etatism_2: "ลัทธิรัฐนิยมเศรษฐกิจ (เอตาติซึม)"
 TUR_etatism_2_desc: "เศรษฐกิจแบบผสมของเราไมเหมือนที่ใดในโลก: มีทั้งองคประกอบของเสรีนิยมแบบอังกฤษ บรรษัทนิยมแบบอิตาลี และการวางแผนจากสวนกลางแบบโซเวียต นี่คือการหลอมรวมสุดยอดของแบบจําลองทางเศรษฐกิจ และเปนเพชรเม็ดงามแหงระบอบเคมาลิสต แตเราตองระวังไมกดดันมันมากเกินไปดวยการพยายามประคองเศรษฐกิจสงครามไปพรอมกัน \n\n§Rหากเรายกระดับกฎหมายเศรษฐกิจ ก็ควรเตรียมรับมือกับความขัดแยงที่เพิ่มขึ้นระหวางแบบจําลองทางเศรษฐกิจที่เขากันไมไดของเรา§!"
 TUR_etatism_3: "ลัทธิรัฐนิยมเศรษฐกิจ (เอตาติซึม)"
 TUR_etatism_3_desc: "เศรษฐกิจแบบผสมของเราไมเหมือนที่ใดในโลก: มีทั้งองคประกอบของเสรีนิยมแบบอังกฤษ บรรษัทนิยมแบบอิตาลี และการวางแผนจากสวนกลางแบบโซเวียต นี่คือการหลอมรวมสุดยอดของแบบจําลองทางเศรษฐกิจ และเคยเปนเพชรเม็ดงามแหงระบอบเคมาลิสต แตเราไดทําใหมันตึงเครียดดวยการพยายามประคองเศรษฐกิจสงครามไปพรอมกัน เราอาจตองทบทวนแนวทางของเราและยุติการทดลองแบบเอตาติซึม \n\n§Rหากเรายกระดับกฎหมายเศรษฐกิจ ก็ควรเตรียมรับมือกับความขัดแยงที่เพิ่มขึ้นระหวางแบบจําลองทางเศรษฐกิจที่เขากันไมไดของเรา§!"
 TUR_etatism_4: "ลัทธิรัฐนิยมเศรษฐกิจ (เอตาติซึม)"
 TUR_etatism_4_desc: "เศรษฐกิจแบบผสมของเราเคยไมเหมือนที่ใดในโลก: ประกอบดวยเสรีนิยมแบบอังกฤษ บรรษัทนิยมแบบอิตาลี และการวางแผนจากสวนกลางแบบโซเวียต เราประมาทและละโมบเกินไป และกําลังเสี่ยงจะทําลายเศรษฐกิจของประเทศดวยการพยายามรักษาแบบจําลองเอตาติซึมไวขณะดําเนินเศรษฐกิจสงคราม เรากําลังเอาทุกสิ่งไปเสี่ยงโดยไมไดอะไรกลับมา: เราตองยกเลิกเอตาติซึมกอนที่จะสายเกินไป \n\n§Rหากเรายกระดับกฎหมายเศรษฐกิจอีกครั้งโดยไมยกเลิกเอตาติซึม จะเกิดภาวะเศรษฐกิจตกตํ่า!§!"
 TUR_economic_collapse: "เศรษฐกิจลมสลาย"
 TUR_economic_collapse_desc: "เราพินาศแลว: เอตาติซึมเคยชวยใหเรารอดพนความเจ็บปวดจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ แตดูเหมือนเราจะหนีหายนะทางเศรษฐกิจไมพนตลอดไป เราไดทําใหประเทศ ประชาชน และอุดมการณของเราผิดหวัง และไดทําใหมรดกของอตาเติรกเองตองมัวหมองไปตลอดกาล..."
 TUR_etatism_stabilisation: "การรักษาเสถียรภาพแบบเอตาติซึม"
 TUR_etatism_stabilisation_desc: "ขอดีของเศรษฐกิจแบบผสมคือเรามีขีดความสามารถและอํานาจที่จะใชมาตรการฉุกเฉินเมื่อจําเปน และเราก็ไดทําเชนนั้นแลว เราซื้อเวลาไวไดกอนความผันผวนทางเศรษฐกิจครั้งตอไป แตมันจะไมคงอยูตลอดไป เราตองใชเวลาที่มีอยางรอบคอบ"
 kemalist_neutrality_idea: "ความเปนกลางแบบเคมาลิสต"
 kemalist_neutrality_idea_desc: "สันติภาพในบาน สันติภาพในโลก - อตาเติรกไดประกาศไว และบัดนี้เราไดบัญญัติใหเปนรากฐานของนโยบายตางประเทศ เราตองรักษาสันติภาพไว และหากไมอาจมีสันติภาพในโลกได เราก็ตองพอใจกับสันติภาพในบาน"
 TUR_second_five_year_plan_inonu: "แผนหาปของอีเนอนู"
 TUR_second_five_year_plan_inonu_desc: "อิสเมต อีเนอนูยึดตนแบบการพัฒนาอุตสาหกรรมของโซเวียต และใหความสําคัญเปนอันดับแรกกับการเพิ่มอุตสาหกรรมเบาใน[ROOT.GetNameDef] รวมถึงการปรับปรุงโครงสรางพื้นฐานทั่วประเทศใหทันสมัย"
 TUR_second_five_year_plan_cakmak: "แผนหาปของชักมัก"
 TUR_second_five_year_plan_cakmak_desc: "เฟฟซี ชักมักยึดตนแบบการฟนฟูกําลังทหารของเยอรมนี และใหความสําคัญเปนอันดับแรกกับการเพิ่มอุตสาหกรรมหนักใน[ROOT.GetNameDef] รวมถึงการปรับปรุงโครงสรางพื้นฐานทั่วประเทศใหทันสมัย"
 TUR_investment_financing_spirit: "สนับสนุนทุนการลงทุน"
 TUR_investment_financing_spirit_desc: "โลกหมุนไปดวยการแลกเปลี่ยนสินคาเพื่อสนองความตองการ เรามีความตองการแนนอน แตหากอยากใหใครชวยเกาหลังให เราก็ตองเปนฝายเกาหลังใหคนอื่นกอน"
 TUR_sheltered_foreign_outcasts: "ที่พักพิงของผูถูกขับไลจากตางแดน"
 TUR_sheltered_foreign_outcasts_desc: "เปนพันธะทางศีลธรรมของเราที่จะตองชวยเหลือผูถูกขมเหงทั่วโลกเมื่อเรามีกําลังพอ และจนถึงตอนนี้เราก็มีกําลังพอแนนอน เราจะใหสัญชาติ ปกปอง และดูแลพวกเขาราวกับเปนลูกหลานโดยกําเนิดของ[TUR.GetNameDef]"
 TUR_debt_council: "สภาหนี้สาธารณะ"
 TUR_debt_council_desc: "เมื่อจักรวรรดิออตโตมันกลายเปนเพียงเรื่องในตําราประวัติศาสตร มันไดทิ้งของขวัญอําลาไวใหเรา: หนี้กอนมหึมา เราติดคางเงินและทรัพยสินจํานวนมากตอมหาอํานาจตะวันตก แตที่นาอัปยศที่สุดคือหนี้ของเราไมไดถูกบริหารภายในประเทศเราเองดวยซํ้า สภาหนี้สาธารณะผูปราดเปรื่องไรขีดจํากัดนั้นประชุมกันอยูที่ฝรั่งเศส"
 TUR_tpda: "TPDA"
 TUR_tpda_desc: "ในที่สุดเราก็แยงชิงบังเหียนคืนมาจากพวกจักรวรรดินิยม และสามารถจัดการหนี้ของเราเองไดจากเมืองหลวงของเรา สภาหนี้สาธารณะไมมีอีกตอไปแลว บัดนี้เหลาฉลามผูมีอภิสิทธิ์จะไมมีทางเลือกอื่นนอกจากตองมาหาเราเมื่อตองการการชดใชหรือการยอมจํานน"
 TUR_tpda_absorbed: "สํานักงานบริหารหนี้สาธารณะตุรกี"
 TUR_tpda_absorbed_desc: "เพียงตวัดปลายปากกา สํานักงานบริหารหนี้สาธารณะตุรกีก็เปลี่ยนจากหนวยงานเอกชนเปนหนวยงานสาธารณะของรัฐ เราบริหารหนี้ของเรา ควบคุมหนี้ของเรา และลดหนี้ของเราไดเอง เราไดกาวขึ้นมาอยูในจุดที่สูงสงในโลกแลว"
 TUR_debt_council_reined_in_flag: "สภาหนี้สาธารณะของตางชาติไดรับการปรับโครงสรางเปนสถาบันแหงชาติ"
 TUR_varlik_vergisi_spirit: "วารลึก แวรกิซี"
 TUR_varlik_vergisi_spirit_desc: "'ภาษีความมั่งคั่ง' นี้เปนเพียงการนําภาษีจิซยะกลับมาใชใหมอยางแนบเนียนเพียงผิวเผิน และเราอาจตองพิจารณายกเลิกมันกอนที่เราจะสูญเสียแมกระทั่งภาพลวงตาวากําลังบริหารสาธารณรัฐฆราวาส"
 TUR_inanc_vergisi_spirit: "อินันช แวรกิซี"
 TUR_inanc_vergisi_spirit_desc: "'ภาษีศรัทธา' คือจุดสูงสุดของหลักการฆราวาสนิยมแบบเคมาลิสต เปนการผลักดันอยางดุดันที่หลายคนมองวาเปนกาวใหญสูการเปนรัฐอเทวนิยม นาเสียดายที่มันเปนความฝนที่เปนจริงไมได - และในอนาคตเราจะตองพิจารณายกเลิกภาษีนี้"
 TUR_political_landscape_shifting: "ภูมิทัศนทางการเมืองที่เปลี่ยนแปลง"
 TUR_political_landscape_shifting_desc: "เปนเวลายาวนานที่เปาหมายสูงสุดของลัทธิเคมาลิสตคือการสถาปนาประชาธิปไตยเสรีแบบหลายพรรคใน[TUR.GetNameDef]... แตกาลเวลาเปลี่ยนไป เราอยูในยุคอันนาตื่นเตนที่อุดมการณสมัยใหมตอสูกันเพื่อชิงความเปนใหญเหนือระเบียบโลก และดูเหมือนสมรภูมิทางอุดมการณนั้นไดมาตั้งหลักที่นี่แลวเชนกัน"
 TUR_the_redshirts: "พวกเสื้อแดง"
 TUR_the_redshirts_desc: "พวกเสื้อแดงคือกองกําลังกึ่งทหารฟาสซิสตของเราเอง ที่ลาดตระเวนตามทองถนนในเขตเมืองและคอยดูแลใหผูคนยึดมั่นในหลักการเคมาลิสตอยางเครงครัด บางครั้งพวกเขาอาจรุนแรงไปบาง ดวยหัวใจเหล็กกลาและหัวสมองที่เต็มไปดวยอุดมคติปฏิวัติ แตอยางนอยอุดมการณของพวกเขาก็ชอบธรรม!"
 TUR_turkish_workers_militia: "กองกําลังติดอาวุธกรรมกรตุรกี"
 TUR_turkish_workers_militia_desc: "ผูที่อยูในฐานะดีที่สุดที่จะปกปองสิทธิของกรรมกรก็คือตัวกรรมกรเอง แนนอนวาการชี้นําเล็กนอยจากรัฐบาลของเราและบันทึกสั่งการจากมอสโกเปนครั้งคราว ยิ่งชวยเพิ่มประสิทธิภาพของพวกเขาในฐานะกองกําลังกรรมกร"
 TUR_turkish_interventionism: "นโยบายแทรกแซงของตุรกี"
 TUR_turkish_interventionism_desc: "สันติภาพในบาน สันติภาพในโลก - อตาเติรกไดประกาศไว และบัดนี้เราไดบัญญัติใหเปนรากฐานของนโยบายตางประเทศ เราไมอาจนั่งดูโลกตกอยูในความวุนวายขณะที่เรายืนอยูขางสนามโดยไมทําอะไรไดอีกตอไป หนทางเดียวที่จะรักษาสันติภาพในบานไดคือการตอสูเพื่อสันติภาพในโลก"
 TUR_balkan_defense_council_spirit: "สภาปองกันบอลขาน"
 TUR_balkan_defense_council_spirit_desc: "คณะผูแทนจากสมาชิกทุกประเทศของกติกาสัญญาบอลขานพบปะกันเปนประจํา เพื่อแลกเปลี่ยนเรื่องราวเกี่ยวกับเหตุการณในโลกและความคืบหนาดานสถานการณการปองกันของแตละฝาย องคความรูทางการทหารที่เรามีรวมกันเปนประโยชนอยางยิ่งตอพวกเราทุกคน"
 TUR_three_year_plan_balkans: "แผนสามปรวมกัน"
 TUR_three_year_plan_balkans_desc: "กติกาสัญญาบอลขานไดดําเนินโครงการพัฒนาอุตสาหกรรมที่กลาหาญที่สุดโครงการหนึ่งในประวัติศาสตร ดวยการสนับสนุนแผนเศรษฐกิจแบบวางแผนจากสวนกลางขามชาติที่รวมกันลงทุน เพื่อใหมั่นใจวาฐานอุตสาหกรรมของเราโดยรวมแข็งแกรงพอจะตานทานการโจมตีจากมหาอํานาจได"
 TUR_central_balkan_bank_wealthy_greece: "ธนาคารกลางบอลขานแหงเอเธนส"
 TUR_central_balkan_bank_wealthy_greece_desc: "ไมมีใครคาดคิดมากอนวา[GRE.GetNameDef] จะเปนประเทศแรกในหมูพวกเราที่จัดการเรื่องการเงินไดอยางไรที่ติเชนนี้ ทุกฝายจึงเห็นพองเปนเอกฉันทใหกอตั้งธนาคารกลางบอลขานขึ้นที่เทสซาโลนิกิ ดวยความเปนเลิศดานการบริหารการคลังของ[GRE.GetAdjective]"
 TUR_central_balkan_bank: "ธนาคารกลางบอลขาน"
 TUR_central_balkan_bank_desc: "ธนาคารกลางบอลขานจะเปนเวทีสําหรับการหมุนเวียนวัตถุดิบ สินคา และกิจการดานพาณิชยอยางเสรีสําหรับทุกชาติในกติกาสัญญาบอลขาน เมื่อเวลาผานไป อิซมีรจะกลายเปนศูนยกลางธุรกิจและการคาที่ทัดเทียมแฟรงกเฟรต เซี่ยงไฮ และนิวยอรก"
 TUR_joint_fortification_budget: "งบประมาณสรางปอมปราการรวม"
 TUR_joint_fortification_budget_desc: "กติกาสัญญาบอลขานเปรียบเสมือนโดมิโนที่ตั้งเรียงกัน: เมื่อตัวหนึ่งลม ตัวที่เหลือก็จะลมตามอยางรวดเร็ว เราทุกคนตองรวมรับผิดชอบการปองกันและเตรียมพรมแดนใหพรอมรับการรุกรานทุกรูปแบบ"
 TUR_emergency_fortification_directive: "คําสั่งสรางปอมปราการฉุกเฉิน"
 TUR_emergency_fortification_directive_desc: "ยามวิกฤตตองใชมาตรการเด็ดขาด และเราจําตองจัดสรรทรัพยากรอยางเรงดวนเพื่อสรางปอมปราการ ความอยูรอดของเราอาจกําลังตกอยูในความเสี่ยง"
 TUR_united_balkan_security_forces: "กองกําลังความมั่นคงบอลขานรวม"
 TUR_united_balkan_security_forces_desc: "กองพันความมั่นคงรวมเปนการยกระดับที่เปนไปตามธรรมชาติ หลังจากที่ผูบัญชาการระดับสูงของสมาชิกแลกเปลี่ยนแผนการรบและขาวกรองกันอยูบอยครั้ง การลดภาระดานการรักษาความสงบตามพรมแดนภายในลงบาง จะชวยแบงเบาภาระของกองทัพแหงชาติและทําใหเราพรอมสําหรับสงครามมากขึ้น"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact: "กองทัพประสานงานแหงกติกาสัญญาบอลขาน"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact_desc: "ความแข็งแกรงของเรามาจากความเปนหนึ่งเดียว เราประสานงานเปนหนึ่ง สูรบเปนหนึ่ง และลมลงเปนหนึ่ง เมื่อฝุนควันจางหายและเสียงปนใหญสงบลง กติกาสัญญาบอลขานจะยังคงยืนหยัดอยู"
 TUR_balkan_pact_innovative_transport_techniques: "นวัตกรรมการขนสงทั่วบอลขาน"
 TUR_balkan_pact_innovative_transport_techniques_desc: "เพื่อประสานงานและอํานวยความสะดวกในการเคลื่อนยายกองทัพขามพรมแดนมากมายของเรา เราในฐานะกลุมประเทศตองรวมกันปรับปรุงโครงสรางพื้นฐาน หวังวาโครงการนี้จะชวยบรรเทาอุปสรรคดังกลาวไดบาง"
 TUR_victory_at_all_costs: "ชัยชนะไมวาตองแลกดวยอะไร"
 TUR_victory_at_all_costs_desc: "เราไมไดตอสูอยางสุดกําลังในฐานะชาติระหวางสงครามกูเอกราช เพียงเพื่อจะถูกทําลายลางในอีกไมกี่ทศวรรษตอมา ไม เรื่องราวของ[TUR.GetNameDef]จะไมจบลงที่นี่ - เราตองไมลม เราจะไมลม!"
 TUR_funkplan: "แผนฟุงค"
 TUR_funkplan_desc: "แผนฟุงคของวัลเทอร ฟุงค ซึ่งยึดตนแบบจากแผนชัคทของยัลมาร ชัคท รับประกันใหเยอรมนีเขาถึงแรธาตุของ[TUR.GetAdjective] พรอมกับเปดทางให[TUR.GetAdjective]เขาถึงตลาดสินคาพาณิชยของเยอรมนี ขอตกลงลับในแผนฟุงคยังรับประกันวัตถุดิบขั้นตํ่าที่เราตองใชในการขยายอุตสาหกรรมหนักอีกดวย"
 TUR_german_advisors: "ที่ปรึกษาชาวเยอรมัน"
 TUR_german_advisors_desc: "บัดนี้เรามีนายทหารชาวเยอรมันกลุมใหญ ซึ่งอยางเปนทางการทําหนาที่เปนทูตและที่ปรึกษาทางธุรกิจ พรอมชวยเราปรับปรุงกองทัพใหทันสมัยและกลายเปนกําลังรบที่มีประสิทธิภาพสูงสุด"
 TUR_integrated_german_officers: "นายทหารเยอรมันในสายบังคับบัญชา"
 TUR_integrated_german_officers_desc: "เมื่อไมจําเปนตองปดบังบทบาทของเจาหนาที่ทหารเยอรมันในประเทศของเราอีกตอไป เราจึงผนวกพวกเขาเขาสูสายการบังคับบัญชาอยางเปนทางการ ดวยความยินยอมโดยชัดแจงจาก[GER.GetLeader]"
 TUR_the_antalya_naval_academy: "โรงเรียนนายเรืออันทัลยา"
 TUR_the_antalya_naval_academy_desc: "เราไดรวมมือกับชาว[ITA.GetAdjective]กอตั้งสถาบันสําหรับวาที่พลเรือเอกและนายทหารเรือรุนใหมที่ไมเหมือนที่ใดในโลก"
 TUR_tuz_golu_training_facility: "ศูนยฝกทะเลสาบตุซ"
 TUR_tuz_golu_training_facility_desc: "ภูมิอากาศแบบเมดิเตอรเรเนียนของประเทศเราไมเหมาะกับการฝกทหารใหปฏิบัติการไดอยางเพียงพอในภูมิอากาศแหงแลง เราจึงเลือกสรางศูนยฝกใกลทะเลสาบเกลือตุซ เพื่อใหกองทหารของเราพรอมรบในสภาพแวดลอมที่แหงแลงไดดีขึ้น"
 TUR_sub_zero_survival_training: "การฝกเอาชีวิตรอดในอุณหภูมิตํ่ากวาศูนย"
 TUR_sub_zero_survival_training_desc: "การจําลองความหนาวเหน็บของยูเรเชียไมใชเรื่องงาย แตเราก็จําตองหาทางทําใหได เราเลือกสรางศูนยฝกบนยอดเขาปาลันเดอเคนในแอรซูรุม พรอมศูนยขนาดเล็กอีกแหงรอบภูเขาอารารัต เพื่อใหกองทหารของเราไดฝกในสภาพแบบเทือกเขาสูงและธารนํ้าแข็งไดตลอดทั้งป"
 TUR_italo_turkish_merchant_fleet: "กองเรือพาณิชยอิตาลี-[TUR.GetAdjective]"
 TUR_italo_turkish_merchant_fleet_desc: "ยุคที่ชาว[ENG.GetAdjective]ครองนานนํ้าเมดิเตอรเรเนียนไดสิ้นสุดลงแลว ทะเลเมดิเตอรเรเนียนเปนของชาว[ITA.GetAdjective]และชาว[GRE.GetAdjective]!"
 TUR_turkic_volunteers_from_abroad: "อาสาสมัครชาวเติรกจากตางแดน"
 TUR_turkic_volunteers_from_abroad_desc: "พี่นองชาวเติรกของเรามาจากทุกมุมของยูเรเชียเพื่อสนับสนุนการตอสูรวมกันของเรา เราจะรวมกันสถาปนายุคแหงหมาปา"
 TUR_golden_age_of_the_wolf: "ยุคทองแหงหมาปา"
 TUR_golden_age_of_the_wolf_desc: "หมาปาเยอรมันและหมาปา[TUR.GetAdjective]ครองยุโรป ศัตรูของเราคือกระตาย แมพวกมันจะวิ่งหนีและหลบซอนได แตสุดทายก็ยอมถูกขากรรไกรอันยิ่งใหญและทรงพลังของเราขยํ้าอยางหลีกเลี่ยงไมได!"
 TUR_refugees_from_the_fascist_menace: "ผูลี้ภัยจากภัยฟาสซิสต"
 TUR_refugees_from_the_fascist_menace_desc: "พวกฟาสซิสตใชการเมืองแบบกีดกันและละเมิดสิทธิมนุษยชนอันมิอาจพรากไดอยูทุกครั้ง การกระทําของพวกเขาโหดรายดั่งปศาจ และการปกปองคุมครองผูที่หนีจากอคติของฟาสซิสตคือสิ่งนอยที่สุดที่เราทําได"
 TUR_revolutionary_brigades_from_abroad: "กองพลนอยนักปฏิวัติจากตางแดน"
 TUR_revolutionary_brigades_from_abroad_desc: "ลัทธิมากซเปนหลักความเชื่อแบบสากลนิยมโดยพื้นฐาน จึงเปนเรื่องธรรมดาที่นักปฏิวัติจากทั่วโลกจะหลั่งไหลมายังชาติของเราเพื่อรวมตอสูในการตอสูระดับโลกรวมกันของเรา"
 TUR_construct_a_red_navy: "กองทัพเรือแดง"
 TUR_construct_a_red_navy_desc: "หากปราศจากกําลังทางเรือที่แข็งแกรงเปนกระดูกสันหลัง ความพยายามใด ๆ ที่จะเผยแพรการปฏิวัติไปทั่วโลกยอมตองลมเหลว"
 TUR_the_revolutionary_officer_college_of_kars: "วิทยาลัยนายทหารปฏิวัติแหงคารส"
 TUR_the_revolutionary_officer_college_of_kars_desc: "คารสเปนเมืองที่มีประวัติศาสตรอันยาวนาน และความใกลชิดกับ[SOV.GetNameDef]ทําใหเปนสถานที่ที่เหมาะสมที่สุดในการกอตั้งโรงเรียนนายทหารที่ฝกใฝการเมืองแหงใหม นายทหารของเราจะไมเพียงไดเรียนรูพื้นฐานของการสงคราม แตยังไดเรียนรูความลึกซึ้งของหลักนิยมมากซิสตดวย"
 TUR_arctic_wolves_training: "การฝกหมาปาอารกติก"
 TUR_arctic_wolves_training_desc: "ทหารของเราจะยางกรายบนหิมะดั่งหมาปาลาเหยื่อในปาเขตหนาว ดวยการฝกของเรา ศัตรูจะไดเรียนรูวาในสายลมเยือกแข็งนั้นมีสิ่งที่นากลัวยิ่งกวาความหนาว"
 TUR_red_officers: "นายทหารแดง"
 TUR_red_officers_desc: "เชนเดียวกับที่นายทหารสายเคมาลิสตเปนตัวแทนและผูพิทักษอุดมการณของตน นายทหารรุนใหมของเราจะทําหนาที่เปนผูพิทักษลัทธิมากซใน[TUR.GetNameDef]"
 TUR_kemalism_with_socialist_characteristics: "ลัทธิเคมาลิสตที่มีอัตลักษณแบบสังคมนิยม"
 TUR_kemalism_with_socialist_characteristics_desc: "เราไมมีความประสงคจะทิ้งลัทธิเคมาลิสต การกําจัดอุดมการณกาวหนาที่เกิดขึ้นในบานเราเองยอมเปนการทํารายโลก ลัทธิเคมาลิสตมีพลวัตมากพอที่จะปรับเปลี่ยนใหสอดคลองกับคานิยมมากซิสตไดมากขึ้นโดยไมทําลายรากฐานจนหมดสิ้น"
 TUR_turkish_bolshevism: "บอลเชวิคตุรกี"
 TUR_turkish_bolshevism_desc: "ลัทธิเคมาลิสตไดทําหนาที่ของมันแลว และบัดนี้จะถูกบันทึกไวในตําราประวัติศาสตร... อยางนอยก็ในตําราประวัติศาสตรตองหามบางเลม [TUR.GetNameDef]ในตอนนี้ยึดแบบอยางการปฏิวัติของวลาดีมีร เลนิน แทนที่จะเปนมุสตาฟา เคมาล อตาเติรก นักลัทธิแกฝายปฏิกิริยา และขบวนการที่ถูกบดขยี้ของเขา"
 TUR_reappropriated_exploitative_finance: "ยึดคืนทุนแหงการขูดรีด"
 TUR_reappropriated_exploitative_finance_desc: "เราจะนําความมั่งคั่งของพวกนายทุนเงินกูตางชาติและปรสิตทุนนิยมอันนารังเกียจในประเทศของเรา มาใชสรางสังคมที่รับใชชนชั้นกรรมาชีพของ[TUR.GetNameDef]อยางแทจริง"
 TUR_emergency_deployment_of_defensive_bases: "การวางฐานปองกันฉุกเฉิน"
 TUR_emergency_deployment_of_defensive_bases_desc: "ฐานปองกันของชาติเราลาสมัยอยางนาเศรา และแทบไรคาในสงครามสมัยใหม เราตองทุมเทความพยายามครั้งใหญระดับชาติเพื่อปรับปรุงการปองกันใหทันสมัยและขมขวัญผูที่คิดจะรุกราน"
 TUR_the_battle_for_our_nations_survival: "ศึกเพื่อความอยูรอดของชาติ"
 TUR_the_battle_for_our_nations_survival_desc: "สิ่งที่ไมมีใครคาดคิดไดเกิดขึ้นแลว: [SOV.GetNameDef]ไดรุกรานชาติของเรา และบัดนี้อนาคตของรัฐ[TUR.GetAdjective]กําลังตกอยูในอันตราย ประชาชน[TUR.GetAdjective]ไดตอบรับเสียงเรียกของ[TUR.GetLeader] แตเมื่อตองเผชิญสงครามเบ็ดเสร็จกับภัยคุกคามที่ทรงพลังกวาอยางไมตองสงสัย ความฮึกเหิมนี้จะคงอยูไดนานเพียงใด?"
 TUR_rebuilding_our_home: "ฟนฟูบานของเรา"
 TUR_rebuilding_our_home_desc: "ชาติของเราถูกพวกสุนัขเคมาลิสตยํ่ายีทั้งทางวัตถุ ทางกายภาพ และทางจิตวิญญาณ แตในที่สุดความกดขี่ของพวกมันก็ถึงจุดจบ เรายืนอยูบนธรณีประตูของยุคใหมสําหรับประชาชนของเรา: ยุคที่เราจะไดแกไขความผิดพลาดในอดีตในที่สุด เราตองสรางเพื่ออนาคต เพื่อที่จะฟนคืนอดีตขึ้นมาได"
 TUR_rising_islamist_dissidence: "กระแสตอตานของฝายอิสลามนิยมที่กอตัว"
 TUR_rising_islamist_dissidence_desc: "ทุกครั้งที่มีการพูดถึงแนวคิดเรื่องการเลือกตั้งเสรีใน[TUR.GetNameDef] พวกหัวรุนแรงทางศาสนาจะพยายามชวงชิงเวทีใด ๆ ที่ใชตอตานพรรค CHP และดูเหมือนครั้งนี้ก็จะไมตางกัน ทั่วประเทศมีจิตสํานึกแบบหัวรุนแรงที่กอตัวขึ้น ขณะที่ศัตรูทางอุดมการณของเรารวมพลังเพื่อโคนอํานาจการปกครองของเรา ดวยการลบหลูหีบเลือกตั้งที่เรามอบใหพวกเขาเอง"
 TUR_objectors_flocking_to_military_service: "ผูคัดคานแหเขารับราชการทหาร"
 TUR_objectors_flocking_to_military_service_desc: "พลเมือง[TUR.GetAdjective]ทุกกลุมที่เคยหลบเลี่ยงการเกณฑทหาร กําลังสมัครเขารับใชในกองทัพของเรา ประชาชนตอบรับแนวทางมาตุภูมิตองมากอนของรัฐบาลเปนอยางดี และหลายคนเริ่มเขาใจที่ทางของตนในสังคมของประเทศ ทั้งที่กอนหนานี้พวกเขารูสึกเหมือนคนนอก"
 TUR_legacy_of_ataturk_fulfilled: "มรดกของอตาเติรก"
 TUR_legacy_of_ataturk_fulfilled_desc: "เราไดผลักดันและทําใหความทะเยอทะยานสูงสุดของมุสตาฟา เคมาล อตาเติรกที่มีตอรัฐ[ROOT.GetAdjective]เปนจริง ดวยการเปลี่ยนใหเปนรัฐประชาธิปไตยเสรีแบบหลายพรรคอยางชอบธรรม เราไดทําใหความฝนตลอดชีวิตของอตาเติรกเปนจริง และดวยเหตุนี้การปกครองของเราจึงมั่นคงขึ้นอยางมากในสายตาของประชาชน"
 TUR_legacy_of_ataturk_preserved: "มรดกของอตาเติรก"
 TUR_legacy_of_ataturk_preserved_desc: "เราไดยืดสถานะเดิมออกไปดวยการคงระบอบอํานาจนิยมที่สงเสริมอุดมคติแบบเคมาลิสตไว เราไมไดทําลายความมุงหวังของมุสตาฟา เคมาล อตาเติรกที่มีตอรัฐ[ROOT.GetAdjective] แตก็แทบไมไดทําอะไรเพื่อสานตอเปาหมายเหลานั้นเชนกัน คงตองเปนหนาที่ของคนรุนหลังที่จะใชรากฐานที่เราวางไว เพื่อรับชวงสืบทอดลัทธิเคมาลิสตตอไป..."
 TUR_legacy_of_ataturk_defiled: "มรดกของอตาเติรก"
 TUR_legacy_of_ataturk_defiled_desc: "เราทําใหทานผิดหวัง: บิดาแหงชาวเติรกจะมองสภาพการณปจจุบันใน[ROOT.GetNameDef]ดวยสายตาอื่นใดได นอกจากความดูแคลนเหยียดหยาม? เราคงตองเชื่อวาความทะเยอทะยานของทานที่มีตอชาตินี้ผิด และของเราถูก..."
 TUR_republicanism: "สาธารณรัฐนิยม"
 TUR_republicanism_desc: "เพราะเอกราชคือสิทธิอันสมบูรณของชาติผูเคารพบูชาพระเจาของขา!"
 TUR_nationalism: "ชาตินิยม"
 TUR_nationalism_desc: "อยาไดหวั่นเกรง เพราะธงสีแดงชาดที่โบกสะบัดอยางภาคภูมิในรุงอรุณอันรุงโรจนนี้ จะไมมีวันจางหาย ตราบที่เตาไฟดวงสุดทายที่ลุกโชนในมาตุภูมิของขายังไมมอดดับ เพราะนั่นคือดวงดาวแหงประชาชาติของขา และจะสองแสงตลอดไป มันเปนของขา และเปนของชาติผูกลาหาญของขาแตเพียงผูเดียว"
 TUR_populism: "ประชานิยม"
 TUR_populism_desc: "ใครเลาจะไมสละชีวิตเพื่อแผนดินดุจสรวงสวรรคนี้? หากบีบดินเพียงกํามือ เหลาผูพลีชีพก็จะพวยพุงออกมา! ผูพลีชีพ!"
 TUR_reformism: "ปฏิรูปนิยม"
 TUR_reformism_desc: "ขอบฟาของตะวันตกอาจถูกลอมดวยกําแพงเหล็กกลา แตพรมแดนของขาถูกปกปองดวยอกอันแกรงกลาของผูศรัทธา จงคํารามออกมา อยาไดกลัว! และจงคิดดู: ศรัทธาอันลุกโชนนี้จะถูกดับลงไดอยางไร ดวยปศาจเขี้ยวเดียวที่บอบชํ้าซึ่งพวกเจาเรียกวา "อารยธรรม"?"
 TUR_revolutionism: "ปฏิวัตินิยม"
 TUR_revolutionism_desc: "จงโบกสะบัดพลิ้วไหวดั่งฟารุงอรุณอันสดใส โอ จันทรเสี้ยวอันรุงโรจน เพื่อเลือดทุกหยดสุดทายของเราจะไดรับพรและมีคุณคาในที่สุด! ทั้งเจาและพี่นองของขาจะไมมีวันดับสูญ!"
 TUR_liberalism: "เสรีนิยม"
 TUR_liberalism_desc: "ขาเปนอิสระมาตั้งแตเริ่มแรกและจะเปนเชนนั้นตลอดไป คนบาคนใดกันจะมาลามโซขา! ขาขอทาทายความคิดนั้น! เพราะเสรีภาพคือสิทธิอันสมบูรณของธงที่เปนอิสระตลอดกาลของขา!"
 TUR_fundamentalism: "มูลฐานนิยม"
 TUR_fundamentalism_desc: "โอ พระผูเปนเจาผูทรงเกียรติ ความปรารถนาเดียวของหัวใจที่เจ็บปวดของขา คือขออยาใหมือของคนนอกศาสนาไดแตะตองออมอกแหงศาสนสถานอันศักดิ์สิทธิ์ของขา"
 TUR_absolutism: "สมบูรณาญาสิทธินิยม"
 TUR_absolutism_desc: "อยามองผืนดินที่เจาเหยียบยํ่าเปนเพียงดิน - จงตระหนักถึงมัน! และจงคิดถึงคนนับพันที่ไรผาหอศพซึ่งนอนอยูใตเจาอยางสงางาม เจาคือบุตรผูรุงโรจนของผูพลีชีพ - จงละอายใจ อยาทําใหบรรพบุรุษตองโศกเศรา! อยาไดปลอยมือจากมาตุภูมิดุจสรวงสวรรคนี้ แมจะมีผูสัญญาจะมอบโลกทั้งใบใหก็ตาม"
 TUR_ultranationalism: "อุลตราชาตินิยม"
 TUR_ultranationalism_desc: "หากพระเจาประสงค ขอพระองคทรงเอาชีวิต คนที่ขารัก และทรัพยสินทั้งหมดของขาไปเถิด แตขออยาไดพรากมาตุภูมิที่แทจริงเพียงหนึ่งเดียวในโลกของขาไป เสียงอะซานเหลานี้และคําปฏิญาณของมันคือรากฐานแหงศาสนาของขา และขอใหเสียงอันสูงสงนั้นกึกกองไปทั่วมาตุภูมิอันนิรันดรของขา"
 TUR_socialism: "สังคมนิยม"
 TUR_socialism_desc: "สหายเอย! อยาปลอยมาตุภูมิของขาไวในมือคนชั่ว! จงใชอกของเจาเปนเกราะ และใชรางกายเปนปราการ! จงหยุดการรุกรานอันนาอัปยศนี้!"

