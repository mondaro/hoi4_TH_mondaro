 expand_civil_communist_support_desc: "เราตองทําใหแรงสนับสนุนตออุดมการณของเราแพรกระจายในหมูประชาชนตอไป และกระตุนใหพวกเขาทาทายอํานาจของรัฐบาลปจจุบันอยางเปดเผย เมื่อสถานะของรัฐบาลถูกบอนทําลายมากขึ้นและความไมสงบในสังคมทวีความรุนแรง การบรรลุเปาหมายของเราก็จะงายขึ้น โดยเฉพาะอยางยิ่งหากเปาหมายเหลานั้นตางจากการเปลี่ยนรัฐบาลโดยชอบดวยกฎหมาย แตเกี่ยวของกับวิธีการเปลี่ยนระบอบที่... ชั่วรายกวานั้น"
 army_support_for_communist_civil_war: "ขยายแรงสนับสนุนจากกองทัพ"
 army_support_for_communist_civil_war_desc: "หากปราศจากแรงสนับสนุนอยางเพียงพอจากกองทัพ ความหวังที่จะชนะการตอสูทางอุดมการณยอมไรผล เราตองรับประกันความภักดีของหนวยทหารที่อยูในตําแหนงสําคัญ"
 ensure_general_loyalty_for_communist_civil_war: "สรางความภักดีของผูบัญชาการระดับลาง"
 ensure_general_loyalty_for_communist_civil_war_desc: "เปนไปไดวานายพลบางคนแอบฝกใฝประชาธิปไตยอยูในใจ เราตองเขาหาพวกเขาและรับประกันความภักดีไวใหพรอมเมื่อการสูรบเริ่มขึ้น"
 ensure_marshal_loyalty_for_communist_civil_war: "สรางความภักดีของผูบัญชาการระดับสูง"
 ensure_marshal_loyalty_for_communist_civil_war_desc: "เปนไปไดวาจอมพลบางคนแอบฝกใฝฟาสซิสตอยูในใจ เราตองเขาหาพวกเขาและรับประกันความภักดีไวใหพรอมเมื่อการสูรบเริ่มขึ้น"
 siphon_equipment_stockpiles_for_communist_civil_war: "ยักยอกยุทโธปกรณ"
 siphon_equipment_stockpiles_for_communist_civil_war_desc: "ดวยการแอบดึงยุทโธปกรณจากคลังของชาติ เราสามารถสะสมคลังอาวุธเล็ก ๆ ไวชวยในการตอสูของเราในอนาคต"
 formulate_surprise_attack_plan_for_communist_civil_war: "วางแผนการโจมตีแบบจูโจม"
 formulate_surprise_attack_plan_for_communist_civil_war_desc: "ศัตรูไมรูเลยถึงหายนะที่กําลังจะมาเยือน เราตองรักษาความลับนี้ไว พรอมกับวางแผนการรบใหใชประโยชนจากการจูโจมโดยไมทันตั้งตัวใหมากที่สุด"
 ignite_the_communist_civil_war: "จุดชนวนสงครามกลางเมือง"
 ignite_the_communist_civil_war_desc: "ถึงเวลาตัดสินใจครั้งสําคัญแลว การเตรียมการทั้งหมดที่เราเห็นวาจําเปนไดเสร็จสิ้นแลว บัดนี้ไมมีทางถอยกลับอีกตอไป"
 rebuild_the_nation_communism: "ฟนฟูประเทศชาติ"
 rebuild_the_nation_communism_desc: "เมื่อสงครามกลางเมืองสิ้นสุดลง บัดนี้ถึงเวลาฟนฟูประเทศชาติที่บอบชํ้าของเราแลว"
 open_up_political_discourse_communist: "เปดกวางทางการเมือง"
 open_up_political_discourse_communist_desc: "เราตองเปดรับความคิดเห็นที่แตกตางในรัฐบาลใหมากขึ้น บางทีสิ่งนี้อาจทําใหการเปลี่ยนแปลงทางการเมืองของชาติอยางสันติเปนไปไดในที่สุด"
 discredit_government_communism: "ทําลายความนาเชื่อถือของรัฐบาล"
 discredit_government_communism_desc: "ดวยการชี้ใหเห็นขอบกพรองมากมายของรัฐบาลปจจุบัน เราจะทําใหประชาชนคิดถึงตนเหตุทางอุดมการณของความลมเหลวเหลานี้"
 hold_the_communist_national_referendum: "จัดการลงประชามติระดับชาติ"
 hold_the_communist_national_referendum_desc: "ดวยแรงสนับสนุนที่เพียงพอ บัดนี้เราสามารถจัดการลงประชามติเพื่อเปลี่ยนรัฐบาลไดอยางปลอดภัยโดยไมตองนองเลือด"
