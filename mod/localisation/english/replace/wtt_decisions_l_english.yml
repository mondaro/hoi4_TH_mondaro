 prepare_for_fascist_civil_war_desc: "เราไมมีเวลารอใหความคิดของประชาชนคอย ๆ เปลี่ยนไป เพื่อประโยชนของพวกเขาเอง เราตองเรงผลักดันเรื่องนี้ใหเร็วที่สุด แมวาบางคนอาจตองสูญเสียชีวิตไปในระหวางนั้น สงครามกลางเมืองตางจากการลงประชามติอยางสันติ เพราะจะสรางความเสียหายมหาศาลแกกองทัพ อุตสาหกรรม และโครงสรางพื้นฐานของประเทศ แตก็รวดเร็วกวา และรับประกันวาหลังจากนั้นเราจะบังคับใชเจตจํานงของเราไดอยางเด็ดขาดยิ่งขึ้น"
 expand_civil_fascism_support: "ขยายแรงสนับสนุนจากพลเรือน"
 expand_civil_fascism_support_desc: "เราตองทําใหแรงสนับสนุนตออุดมการณของเราแพรกระจายในหมูประชาชนตอไป และกระตุนใหพวกเขาทาทายอํานาจของรัฐบาลปจจุบันอยางเปดเผย เมื่อสถานะของรัฐบาลถูกบอนทําลายมากขึ้นและความไมสงบในสังคมทวีความรุนแรง การบรรลุเปาหมายของเราก็จะงายขึ้น โดยเฉพาะอยางยิ่งหากเปาหมายเหลานั้นตางจากการเปลี่ยนรัฐบาลโดยชอบดวยกฎหมาย แตเกี่ยวของกับวิธีการเปลี่ยนระบอบที่... ชั่วรายกวานั้น"
 army_support_for_fascist_civil_war: "ขยายแรงสนับสนุนจากกองทัพ"
 army_support_for_fascist_civil_war_desc: "หากปราศจากแรงสนับสนุนอยางเพียงพอจากกองทัพ ความหวังที่จะชนะการตอสูทางอุดมการณดวยกําลังอาวุธยอมไรผล เราตองรับประกันความภักดีของหนวยทหารที่อยูในตําแหนงสําคัญ"
 army_support_TT: "ทุกครั้งที่เพิ่มแรงสนับสนุนจากกองทัพ ความแข็งแกรงของฝายคุณในสงครามกลางเมืองจะเพิ่มขึ้น 10% สูงสุดรวมไมเกิน 70%\n"
 ensure_general_loyalty_for_fascist_civil_war: "สรางความภักดีของผูบัญชาการระดับลาง"
 ensure_general_loyalty_for_fascist_civil_war_desc: "เปนไปไดวานายพลบางคนแอบฝกใฝฟาสซิสตอยูในใจ เราตองเขาหาพวกเขาและรับประกันความภักดีไวใหพรอมเมื่อการสูรบเริ่มขึ้น"
 ensure_marshal_loyalty_for_fascist_civil_war: "สรางความภักดีของผูบัญชาการระดับสูง"
 ensure_marshal_loyalty_for_fascist_civil_war_desc: "เปนไปไดวาจอมพลบางคนแอบฝกใฝฟาสซิสตอยูในใจ เราตองเขาหาพวกเขาและรับประกันความภักดีไวใหพรอมเมื่อการสูรบเริ่มขึ้น"
 siphon_equipment_stockpiles_for_fascist_civil_war: "ยักยอกยุทโธปกรณ"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc: "ดวยการแอบดึงยุทโธปกรณจากคลังของชาติ เราสามารถสะสมคลังอาวุธเล็ก ๆ ไวชวยในการตอสูของเราในอนาคต"
 formulate_surprise_attack_plan_for_fascist_civil_war: "วางแผนการโจมตีแบบจูโจม"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc: "ศัตรูไมรูเลยถึงหายนะที่กําลังจะมาเยือน เราตองรักษาความลับนี้ไว พรอมกับวางแผนการรบใหใชประโยชนจากการจูโจมโดยไมทันตั้งตัวใหมากที่สุด"
 formulate_surprise_attack_plan_for_civil_war_tt: "แผนการโจมตีแบบจูโจมจะใหโบนัสการโจมตี 25% แกทุกกองพลที่อยูบนดินแดนหลัก เปนเวลา 30 วัน\n"
 ignite_the_fascist_civil_war: "จุดชนวนสงครามกลางเมือง"
 ignite_the_fascist_civil_war_desc: "ถึงเวลาตัดสินใจครั้งสําคัญแลว การเตรียมการทั้งหมดที่เราเห็นวาจําเปนไดเสร็จสิ้นแลว บัดนี้ไมมีทางถอยกลับอีกตอไป"
 rebuild_the_nation_fascism: "ฟนฟูประเทศชาติ"
 rebuild_the_nation_fascism_desc: "เมื่อสงครามกลางเมืองสิ้นสุดลง บัดนี้ถึงเวลาฟนฟูประเทศชาติที่บอบชํ้าของเราแลว"
 open_up_political_discourse_fascism: "เปดกวางทางการเมือง"
 open_up_political_discourse_fascism_desc: "เราตองเปดรับความคิดเห็นที่แตกตางในรัฐบาลใหมากขึ้น บางทีสิ่งนี้อาจทําใหการเปลี่ยนแปลงทางการเมืองของชาติอยางสันติเปนไปไดในที่สุด"
 discredit_government_fascism: "ทําลายความนาเชื่อถือของรัฐบาล"
 discredit_government_fascism_desc: "ดวยการชี้ใหเห็นขอบกพรองมากมายของรัฐบาลปจจุบัน เราจะทําใหประชาชนคิดถึงตนเหตุทางอุดมการณของความลมเหลวเหลานี้"
 hold_the_fascist_national_referendum: "จัดการลงประชามติระดับชาติ"
 hold_the_fascist_national_referendum_desc: "ดวยแรงสนับสนุนที่เพียงพอ บัดนี้เราสามารถจัดการลงประชามติเพื่อเปลี่ยนรัฐบาลไดอยางปลอดภัยโดยไมตองนองเลือด"
 democratic_on_the_rise: "ประชาธิปไตยกําลังผงาด"
 democratic_on_the_rise_desc: "กลุมการเมืองที่สงเสียงดังเริ่มออกมาสนับสนุนคานิยมแบบประชาธิปไตย และไดรับแรงสนับสนุนจากประชาชนจํานวนมากขึ้นเรื่อย ๆ หนทางสูประชาธิปไตยของชาติเปดกวางแลว เหลือเพียงการเลือกวาจะเปลี่ยนผานอยางสันติหรือดวยความรุนแรง"
