 byz_triumph_for_italy_desc: "อิตาลีตกอยูใตการควบคุมของเราแลว เราควรผนวกรวมอิตาลีเขาสูจักรวรรดิในพิธีอันยิ่งใหญ!"
 byz_triumph_for_middle_east: "ชัยชนะแหงลิแวนต"
