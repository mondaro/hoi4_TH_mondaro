 JAP_sue_for_peace_nuke: "ยอมจํานนโดยไมมีเงื่อนไข"
 JAP_sue_for_peace_nuke_desc: "ศัตรูไดใชระเบิดชนิดใหมที่โหดรายที่สุด สถานการณสงครามไมไดพัฒนาไปในทางที่เปนประโยชนตอเราเสมอไป เราตองอดทนตอสิ่งที่ไมอาจอดทนได"
 JAP_sue_for_peace_nuke_mission: "โจมตีดวยอาวุธนิวเคลียรบนแผนดินญี่ปุน"
 JAP_sue_for_peace_nuke_mission_desc: "การทดสอบระเบิดนิวเคลียรที่ประสบความสําเร็จเมื่อไมนานมานี้เปดทางเลือกอื่นนอกเหนือจากการบุกหมูเกาะหลักของญี่ปุนเต็มรูปแบบ ขาวกรองชี้วาหากเรายึดโอกินาวะและอิโวจิมะจากญี่ปุนได และลดกองเรือของพวกเขาเหลือเพียง 30 ลํา การโจมตีสองจุดในหมูเกาะหลักดวยระเบิดนิวเคลียรติดตอกันอยางรวดเร็วจะบีบใหรัฐบาลญี่ปุนยอมจํานนโดยไมมีเงื่อนไข"
