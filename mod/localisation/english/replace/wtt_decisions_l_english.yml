 reinstate_wilhelm_iv_succession_rights_desc: "พระโอรสของไกเซอรวิลเฮลมที่ 3 ถูกบีบใหสละสิทธิในการสืบราชสันตติวงศ เพราะปรารถนาจะอภิเษกสมรสโดยไมไดรับความเห็นชอบจากวิลเฮลมที่ 2 ประมุขแหงราชวงศในขณะนั้น บัดนี้เมื่อวิลเฮลมที่ 3 รับบทบาทดังกลาวแลว พระองคอาจกดดันพระราชบิดาที่ลี้ภัยอยูใหสนับสนุนการกลับคําตัดสินนี้ได"
