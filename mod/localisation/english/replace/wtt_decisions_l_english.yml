 USA_women_in_the_workforce_desc: "คุณใชเครื่องผสมอาหารไฟฟาเปนไหม? ถาเปน คุณก็เรียนรูการใชสวานได ตลอดสงคราม สตรีอเมริกันกวาหกลานคนเขาทํางานในโรงงาน งานกอสราง และงานใชแรงอื่น ๆ และพิสูจนใหเห็นตลอดกาลวาสตรีทํางานไดดีไมแพบุรุษ"
 CAN_women_in_the_workforce: "รอนนี่สาวปนเบรน"
 CAN_women_in_the_workforce_desc: "รอนนี่บอกวา: "สงมาอีกเรื่อย ๆ!" เมื่อบุรุษของเรารับใชในกองทัพ ภาระการผลิตทางทหารก็ตกอยูบนบาของสตรีในชาติเรา ตลอดสงคราม สตรีแคนาดา 800,000 คนเขาทํางานแทนผูที่สมัครเปนทหาร และพิสูจนใหเห็นตลอดกาลวาสตรีทํางานไดดีไมแพบุรุษ"
