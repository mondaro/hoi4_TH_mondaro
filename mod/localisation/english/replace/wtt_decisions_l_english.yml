 blow_suez_canal: "ระเบิดคลองสุเอซ"
 blow_suez_canal_desc: "เราไมอาจปลอยใหศัตรูใชคลองสุเอซซึ่งมีความสําคัญทางยุทธศาสตรอยางยิ่งได ดังนั้นเราตองเริ่มเตรียมการสรางความเสียหายแบบเจาะจงเปาหมายแกคลองใหมากพอที่จะทําใหใชการไมไดไปอีกนาน ซึ่งจะจํากัดความสามารถของศัตรูในการเคลื่อนยายเรือจากเอเชียและแอฟริกาตะวันออกเขาสูทะเลเมดิเตอรเรเนียนไดอยางมาก"
 blow_panama_canal: "ระเบิดคลองปานามา"
 blow_panama_canal_desc: "เราไมอาจปลอยใหศัตรูใชคลองปานามาซึ่งมีความสําคัญทางยุทธศาสตรอยางยิ่งได ดังนั้นเราตองเริ่มเตรียมการสรางความเสียหายแบบเจาะจงเปาหมายแกคลองใหมากพอที่จะทําใหใชการไมไดไปอีกนาน ซึ่งจะทําใหศัตรูเคลื่อนยายเรือจากมหาสมุทรแปซิฟกไปยังมหาสมุทรแอตแลนติกและในทางกลับกันไดยากขึ้นอยางมาก"
 rebuild_suez_canal: "ซอมแซมคลองสุเอซ"
 rebuild_suez_canal_desc: "คลองสุเอซมีความสําคัญสูงสุดตอความพยายามทําสงครามของเรา เราตองจัดสรรทรัพยากรทุกอยางที่จําเปนเพื่อบูรณะคลองอันยิ่งใหญนี้ เพื่อใหเราสามารถเคลื่อนยายเรือและกําลังทหารระหวางทะเลเมดิเตอรเรเนียนกับมหาสมุทรอินเดียไดอยางเสรี"
 rebuild_panama_canal: "ซอมแซมคลองปานามา"
 rebuild_panama_canal_desc: "คลองปานามามีความสําคัญสูงสุดตอความพยายามทําสงครามของเรา เราตองจัดสรรทรัพยากรทุกอยางที่จําเปนเพื่อบูรณะคลองอันยิ่งใหญนี้ เพื่อใหเราสามารถเคลื่อนยายเรือและกําลังทหารระหวางมหาสมุทรแปซิฟกกับมหาสมุทรแอตแลนติกไดอยางเสรี"
