 hold_fight_on_the_beaches_speech: "กลาวสุนทรพจน 'เราจะสูบนชายหาด'"
 hold_fight_on_the_beaches_speech_desc: "'เราจะสูไปจนถึงที่สุด เราจะสูในฝรั่งเศส เราจะสูในทองทะเลและมหาสมุทร เราจะสูดวยความมั่นใจและกําลังที่เพิ่มพูนขึ้นในนานฟา เราจะปกปองเกาะของเรา ไมวาจะตองแลกดวยอะไรก็ตาม เราจะสูบนชายหาด เราจะสูที่จุดยกพลขึ้นบก เราจะสูในทุงและบนถนน เราจะสูบนเนินเขา เราจะไมมีวันยอมจํานน...'"
 fight_on_the_beaches_speech: "สุนทรพจน 'เราจะสูบนชายหาด'"
 operation_fork: "ปฏิบัติการฟอรก"
 operation_fork_desc: "ไอซแลนด ชาติที่เพิ่งไดรับเอกราช ตั้งอยูในตําแหนงที่มีความสําคัญทางยุทธศาสตรอยางยิ่งในแอตแลนติกเหนือ การเสียนอรเวยจะทําใหเกาะที่ไรการปองกันแหงนี้ตกอยูในสถานะเปราะบาง เราตองชิงบุกและยึดครองไอซแลนดกอนศัตรู มิฉะนั้นพวกเขาจะไดฐานทัพทางยุทธศาสตรบนเกาะไวคุกคามเสนทางเสบียงของเรา ชาวไอซแลนดจะปลอดภัยจากศัตรูก็ตอเมื่ออยูภายใตการคุมครองของเราเทานั้น"
 ENG_operation_valentine: "ปฏิบัติการวาเลนไทน"
 ENG_operation_valentine_desc: "เราจะปกปองหมูเกาะแฟโรจากความโหดรายทั้งปวงของสงคราม และตั้งมั่นที่นั่นอยางสะดวกทั้งทางทะเลและทางอากาศ จนกวาจะถึงเวลาที่จะสงคืนหมูเกาะแกเดนมารกโดยปลดปลอยจากพันธนาการอันโสมมที่การรุกรานของศัตรูไดผลักใหตกอยู ขณะเดียวกันก็เสริมสรางสถานะของเราเองในทะเลเหนือ"
 invade_ireland: "รุกรานไอรแลนด"
 invade_ireland_desc: "เราตองรักษาความปลอดภัยของขบวนเรือลําเลียงดวยทุกวิถีทาง การรุกรานไอรแลนดอาจไมเปนที่ยอมรับของบางคนในหมูเรา แตหากนั่นคือสิ่งที่ตองทําเพื่อใหไดใชฐานทัพอากาศของพวกเขา ก็ตองเปนเชนนั้น"
 macdonald_proposal: "ขอเสนอแมกโดนัลด"
 macdonald_proposal_desc: "เราตองรักษาความปลอดภัยของขบวนเรือลําเลียง และเพื่อการนี้ ฐานทัพอากาศและฐานทัพเรือของไอรแลนดมีความสําคัญสูงสุด เราจะสงทูตไปเสนอแลกไอรแลนดเหนือกับการที่ไอรแลนดเขารวมสงครามฝายเราในทันที"
 hold_blood_toil_tears_sweat_speech: "กลาวสุนทรพจน 'เลือด หยาดเหงื่อ นํ้าตา และความตรากตรํา'"
 hold_blood_toil_tears_sweat_speech_desc: "'ขาพเจาไมมีสิ่งใดจะมอบใหนอกจากเลือด ความตรากตรํา นํ้าตา และหยาดเหงื่อ [...] ทานถามวานโยบายของเราคืออะไร ขาพเจาจะตอบวา คือการทําสงคราม ทั้งทางทะเล ทางบก และทางอากาศ ดวยกําลังทั้งหมดที่เรามีและดวยพละกําลังทั้งปวงที่พระเจาประทานให เพื่อทําสงครามกับทรราชอันชั่วรายที่ไมเคยมีใครเทียบไดในบัญชีอาชญากรรมอันมืดมนและนาสลดของมนุษยชาติ นั่นคือนโยบายของเรา ทานถามวาเปาหมายของเราคืออะไร ขาพเจาตอบไดในคําเดียว ชัยชนะ ชัยชนะไมวาตองแลกดวยอะไร—ชัยชนะแมจะเผชิญความหวาดกลัวทั้งปวง—ชัยชนะ ไมวาหนทางจะยาวไกลและยากลําบากเพียงใด เพราะหากไรชัยชนะก็ไมมีการอยูรอด'"
 blood_toil_tears_sweat_speech: "สุนทรพจน 'เลือด หยาดเหงื่อ นํ้าตา และความตรากตรํา'"
 hold_this_was_their_finest_hour_speech: "กลาวสุนทรพจน 'นี่คือชวงเวลาที่งดงามที่สุดของพวกเขา'"
 hold_this_was_their_finest_hour_speech_desc: "'ฉะนั้นขอใหเราเตรียมใจรับหนาที่ของเรา และวางตนเชนนั้น เพื่อวาหากจักรวรรดิบริติชและเครือจักรภพยืนยงไปอีกพันป ผูคนก็จะยังกลาววา นี่คือชวงเวลาที่งดงามที่สุดของพวกเขา'"
