 MAN_banditry_category: "การปลนสะดมของโจร"
 MAN_banditry_category_desc: "กองทัพกวานตงแทบไมสนใจชวยเหลือผูอยูอาศัยในแมนจูเรีย เพราะมองวาเปนการยึดครองทางทหารมากกวาการสรางชาติ รัฐบาลแมนจูกัวซึ่งมีอยูแคในนาม ไดรับทรัพยากรจากญี่ปุนเพียงนอยนิดสําหรับรักษาความสงบเรียบรอย ชองวางแหงอํานาจนี้จึงเต็มไปดวยโจรผูรายทุกรูปแบบ บางครั้งเปนพวกที่อางตนวาเปน 'นักสูเพื่ออิสรภาพ' ซึ่งฆาและปลนในนามของอุดมการณนามธรรมอยาง 'การปลดปลอยชาติ' หรือ 'สากลนิยมของชนชั้นกรรมาชีพ' แตบอยครั้งกวานั้นก็ไมมีอุดมการณใด ๆ มาบังหนาการกระทําอันโหดรายของพวกเขาเลย"
