 form_scandinavia_category: "ฟนฟูสหภาพคาลมาร"
 form_scandinavia_category_desc: "เมื่อพิชิตดินแดนสแกนดิเนเวียไดทั้งหมดแลว ถึงเวลาฟนฟูจิตวิญญาณแหงสหภาพคาลมาร สแกนดิเนเวียทั้งมวลจะรุงเรืองภายใตการปกครองของเรา"
 form_nordic_league_category: "ประกาศเอกภาพนอรดิก"
 form_nordic_league_category_desc: "ชาวนอรดิกรูสึกผูกพันกันมาชานาน บัดนี้เมื่อเราควบคุมดินแดนทั้งหมดที่เคยเปนของรัฐนอรดิกแลว เราก็สามารถยกระดับความเปนเครือญาตินั้นสูจุดสูงสุดใหมได"
 form_gran_colombia_category: "ฟนคืนมรดกของโบลิวาร"
 form_gran_colombia_category_desc: "แมการทดลองสรางกรันโคลอมเบียเมื่อศตวรรษกอนจะอยูไดเพียงชวงสั้น ๆ แตบัดนี้เราสามารถชวงชิงดินแดนที่เคยประกอบเปนประเทศนั้นมาไดอีกครั้ง เราอาจทําใหความฝนของโบลิวารเปนจริงไดอีกครา"
 form_austria_hungary_category: "ฟนฟูจักรวรรดิออสเตรีย-ฮังการี"
 form_austria_hungary_category_desc: "ดินแดนออสเตรีย-ฮังการีเดิมถูกพิชิตแลว และในฐานะรัฐผูสืบทอดเพียงหนึ่งเดียวที่ยังเหลืออยู การฟนฟูจักรวรรดิจึงขึ้นอยูกับเรา อยาไดรอชา จงดําเนินการทันที"
 form_commonwealth_category: "กอตั้งเครือจักรภพขึ้นใหม"
 form_commonwealth_category_desc: "โปแลนดและลิทัวเนียมีประวัติศาสตรรวมกันมากมาย บัดนี้เมื่อเรากลับมารวมกันอีกครั้งดวยกําลังอาวุธ บางทีอาจถึงเวลาฟนคืนวันอันรุงโรจนที่สุดในอดีตของเรา"
 form_united_netherlands_category: "บอกเลิกสนธิสัญญาลอนดอน"
 form_united_netherlands_category_desc: "สนธิสัญญาลอนดอนป 1839 แยกดินแดนตอนเหนือและตอนใตของกลุมประเทศแผนดินตํ่าออกจากกันอยางนาอัปยศ หลังจากรวมเปนหนึ่งไดเพียงชวงสั้น ๆ บัดนี้ ภายใตการนําของเรา เราสามารถสรางวันเวลาเหลานั้นขึ้นใหม และยืนหยัดในที่ทางที่ควรเปนในฐานะตัวถวงดุลฝรั่งเศสและเยอรมนี"
 form_united_central_america_category: "สถาปนาสาธารณรัฐสหพันธขึ้นใหม"
 form_united_central_america_category_desc: "รัฐอันทรงพลังที่ชาติของเราเคยเปนสวนหนึ่งเมื่อศตวรรษกอนมีอายุสั้นเกินไป บัดนี้เมื่อเราพิชิตรัฐที่แยกตัวซึ่งเปนตนเหตุแหงการลมสลายไดแลว เราก็สามารถมุงสูการสถาปนาสาธารณรัฐสหพันธขึ้นใหม และเริ่มแผขยายอํานาจของอเมริกากลางที่เปนหนึ่งเดียว"
 form_baltic_federation_category: "รวมชาติบอลติก"
 form_baltic_federation_category_desc: "ปฏิญญาวาดวยความเปนปกแผนในภูมิภาคและนโยบายตางประเทศรวมกันที่เราเคยประกาศไว ยอมพัฒนาตอไดอีกเมื่อเราควบคุมบอลติกไดทั้งหมดแลว การผนวกรวมเพื่อนบานเดิมของเราจะเพิ่มความมั่นคงใหแกทุกฝาย ทามกลางภยันตรายจากทั้งตะวันตกและตะวันออก"
 form_ottoman_empire_category: "กอตั้งจักรวรรดิออตโตมันขึ้นใหม"
 form_ottoman_empire_category_desc: "ดวยกําลังอาวุธ เราไดกอบกูความสูญเสียที่เราไดรับจากความออนแอในมหาสงคราม เพื่อเฉลิมฉลองวาระประวัติศาสตรนี้ ไมมีสิ่งใดจะเหมาะสมไปกวาการประกาศฟนฟูจักรวรรดิออตโตมัน"
 form_european_union_category: "สรางเอกภาพแหงยุโรป"
 form_european_union_category_desc: "แมแนวคิดเรื่องยุโรปที่เปนหนึ่งเดียวทางการเมืองเพิ่งจะไดรับความสนใจอยูบางในชวงไมกี่ทศวรรษที่ผานมา แตการพิชิตชาติที่ทรงพลังที่สุดในภาคพื้นทวีปยุโรปเมื่อไมนานมานี้ไดทําใหมันกลายเปนความจริงอยางไมคาดฝน บางทีอาจจําเปนตองปรับโครงสรางประเทศเพื่อใชประโยชนจากโอกาสนี้ใหเต็มที่"
 form_mutapa_category: "สรางจักรวรรดิซิมบับเวขึ้นใหม"
 form_mutapa_category_desc: "เมื่อกําจัดอิทธิพลอาณานิคมออกจากดินแดนตอนใตของทวีปไดแลว บางทีอาจถึงเวลารวมใจประชาชนภายใตแนวคิดจักรวรรดิอันทรงพลังจากอดีตของเรา ภูมิภาคนี้เคยมีจักรวรรดิอยูหลายแหง และเราตองการเพียงชื่อหนึ่งชื่อเพื่อเปนสัญลักษณ"
 form_roman_empire_category: "สานฝนโรมัน"
 form_roman_empire_category_desc: "แนวคิดเรื่องจักรวรรดิที่แผไพศาลทั่วเมดิเตอรเรเนียนไดกลับมาอยูในความคิดของมหาชนในชวงไมกี่ปที่ผานมา บัดนี้ การทัพของเราประสบผลเกินกวาที่แมแตผูสนับสนุนที่กระตือรือรนที่สุดจะฝนถึง และเรากําลังอยูในจุดที่จะทําใหความทะเยอทะยานนี้เปนจริงได Roma invicta!"
 form_persian_empire_category: "สรางจักรวรรดิเปอรเซียขึ้นใหม"
 form_persian_empire_category_desc: "การพิชิตครั้งลาสุดของเราไดแผไปถึงขอบเขตของจักรวรรดิเปอรเซียในอดีต ดวยประวัติศาสตรอันรุมรวยของภูมิภาคเรา เราจะไมฉวยโอกาสนี้ประกาศใหอาณาจักรของเราเปนผูสืบทอดจักรวรรดิในกาลกอนไดอยางไร"
 form_byzantine_empire_category: "ฟนฟูไบแซนไทน"
 form_byzantine_empire_category_desc: "เมื่อปลดแอกตุรกีออกจากดินแดนเกาของเราไดแลว ดวยการโฆษณาชวนเชื่ออีกเล็กนอย เราก็สามารถอางไดวาชาติของเราคือผูสืบทอดจักรวรรดิที่ชาวเติรกลมลางไปเมื่อหาศตวรรษกอน มรดกนี้จะทําใหเกียรติภูมิระหวางประเทศของเราพุงทะยานอยางแนนอน!"
 form_arabia_category: "การรวมชาติอาหรับ"
 form_arabia_category_desc: "รัฐอาหรับถูกแบงแยกดวยการแขงขันในภูมิภาคมานานเกินไปแลว บัดนี้เมื่อเรารวมคาบสมุทรไวภายใตการปกครองของเราได ในที่สุดเราก็สามารถประกาศการกอตั้งอาระเบียที่เปนหนึ่งเดียว!"
 form_majapahit_empire_category: "ความฝนแหงนูซันตาราที่เปนหนึ่งเดียว"
 form_majapahit_empire_category_desc: "เมื่อหลายศตวรรษกอน จักรวรรดิอันยิ่งใหญเคยแผไพศาลทั่วหมูเกาะอินโดนีเซียและครอบงําการคาในภูมิภาค เราไดขยายพรมแดนจนครอบคลุมขอบเขตของจักรวรรดินั้นแลว และการใชดินแดนนี้เปนฐานของรัฐชาติใหมอาจเปนสัญลักษณแหงเอกภาพของภูมิภาคไดเปนอยางดี"
 form_rattanakosin_kingdom_category: "เสริมสรางมรดกแหงรัตนโกสินทร"
 form_rattanakosin_kingdom_category_desc: "ในชวงไมกี่ปที่ผานมา เราไดหางเหินจากคุณคาดั้งเดิมที่ชาติของเราตั้งอยูบนรากฐาน บัดนี้เมื่อเราไดดินแดนกลับคืนมาเทากับยุครุงเรืองแลว บางทีอาจถึงเวลาที่จะยึดมั่นในประวัติศาสตรของเราใหแนนแฟนยิ่งขึ้น"
 form_pan_tai_empire: "สถาปนาจักรวรรดิรวมชาติไท"
 form_pan_tai_empire_category: "สถาปนาจักรวรรดิรวมชาติไท"
 form_pan_tai_empire_category_desc: "มหาอาณาจักรไทยไดนําชาติของเรากลับคืนสูพรมแดนแหงยุครุงเรือง ทวาชนชาติไทยังกระจายตัวไกลออกไปกวานั้นมาก ตั้งแตไทใหญบนเทือกเขาฉาน ไทลื้อแหงยูนนาน จวงแหงกวางสี ไปจนถึงไทอาหมอันหางไกลในอัสสัม พี่นองของเรายังคงถูกแบงแยก บัดนี้เมื่อธงของเราโบกสะบัดเหนือมาตุภูมิของบรรพบุรุษเหลานี้แลว จงประกาศจักรวรรดิหนึ่งเดียวสําหรับชาวไททั้งมวล"
 form_hre_category: "ฟนฟูจักรวรรดิโรมันอันศักดิ์สิทธิ์"
 form_hre_category_desc: "[GetWhoIsFormingHre]"
 GER_is_forming_hre: "ความรุงโรจนของจักรพรรดินีของเราไรขีดจํากัด และพรมแดนของชาติเราก็เชนกัน บัดนี้พรมแดนไดขยายออกจนครอบคลุมขอบเขตของจักรวรรดิโรมันอันศักดิ์สิทธิ์ในอดีต และชาติที่ขวางทางเราก็ไมอยูในฐานะที่จะคัดคานนโยบายของเราไดอีก จักรพรรดินีมีพระราชโองการใหฉวยโอกาสนี้ไว และใหชาติรับบทบาทเปนผูสืบทอดทางจิตวิญญาณของจักรวรรดิโรมันอันศักดิ์สิทธิ์ Aquila Elegit Iovis Omnia Vincit!"
 GER_is_forming_hre_without_victoria: "ความรุงโรจนของรัฐบาลเราไรขีดจํากัด และพรมแดนของชาติเราก็เชนกัน บัดนี้พรมแดนไดขยายออกจนครอบคลุมขอบเขตของจักรวรรดิโรมันอันศักดิ์สิทธิ์ในอดีต และชาติที่ขวางทางเราก็ไมอยูในฐานะที่จะคัดคานนโยบายของเราไดอีก บัดนี้มีคําสั่งใหฉวยโอกาสนี้ไว และใหชาติรับบทบาทเปนผูสืบทอดทางจิตวิญญาณของจักรวรรดิโรมันอันศักดิ์สิทธิ์ Aquila Elegit Iovis Omnia Vincit!"
 AUS_is_forming_hre: "ความรุงโรจนของอารชดยุก [ROOT.GetLeader] ไรขีดจํากัด และพรมแดนของชาติเราก็เชนกัน บัดนี้พรมแดนไดขยายออกจนครอบคลุมขอบเขตของจักรวรรดิโรมันอันศักดิ์สิทธิ์ในอดีต และชาติที่ขวางทางเราก็ไมอยูในฐานะที่จะคัดคานนโยบายของเราไดอีก อารชดยุกมีบัญชาใหฉวยโอกาสนี้ไว และใหชาติรับบทบาทเปนผูสืบทอดทางจิตวิญญาณของจักรวรรดิโรมันอันศักดิ์สิทธิ์ Aquila Elegit Iovis Omnia Vincit!"
 form_greater_german_reich_category: "มหาไรชเยอรมันแหงชนชาติเยอรมัน"
 form_greater_german_reich_category_desc: "ศัตรูของเราถูกทําใหราบคาบ และเปาหมายการขยายดินแดนสูตะวันออกก็สําเร็จลุลวงแลว บัดนี้ถึงเวลาที่จะทําใหโลกตระหนักถึงความยิ่งใหญของชาติเรา และเริ่มเปลี่ยนแปลงเมืองหลวงของเราใหเปนสิ่งที่ทุกคนมองดวยความภาคภูมิใจ"
 form_greater_german_reich: "ประกาศระเบียบใหม"
 form_greater_german_state_category: "ระเบียบใหมแหงชนชั้นกรรมาชีพ"
 form_greater_german_state_category_desc: "แมจะถูกตอตานจากทุกทิศทาง เราก็สามารถเอาชนะรัฐบาลฉอฉลแหงยุโรปตะวันตกได พวกเขาไมอาจกดขี่กรรมกรไดอีกตอไป บัดนี้กรรมกรไดรับอิสรภาพและกําลังมารวมอุดมการณของเราอยูในขณะนี้ พันธนาการแหงทุนนิยมถูกทําลายแลว และระเบียบใหมกําลังรุงอรุณขึ้นเหนือยุโรป - และทั่วโลก"
