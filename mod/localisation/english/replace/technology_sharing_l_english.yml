 SWE_allies_tech_sharing_group_desc: "การแลกเปลี่ยนเทคโนโลยีทางทหารระหวางสวีเดนและพันธมิตร"
 DEN_danish_partnership_tech_sharing: "โครงการวิจัยและหุนสวนรวม"
 DEN_danish_partnership_tech_sharing_desc: "ขอริเริ่มของเดนมารกเพื่อสงเสริมการกระชับความเปนหุนสวนและการวิจัยและพัฒนาเทคโนโลยี"
 DEN_danish_military_cooperation_program: "โครงการความรวมมือทางทหารของเดนมารก"
 DEN_danish_military_cooperation_program_desc: "ขอริเริ่มของเดนมารกในการจัดตั้งโครงการความรวมมือทางทหารเพื่อแลกเปลี่ยนเทคโนโลยี"
 DEN_german_danish_joint_military_program: "โครงการทางทหารรวมเยอรมนี-เดนมารก"
