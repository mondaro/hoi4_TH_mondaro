 DEN_northern_technological_advancements_group: "กลุมความกาวหนาทางเทคโนโลยีแหงภาคเหนือ"
 DEN_northern_technological_advancements_group_desc: "ขอริเริ่มของเดนมารกเพื่อแบงปนความกาวหนาทางเทคโนโลยี"
 ICE_communist_tech_sharing_group_name: "ประชาคมวิจัยนานาชาติเรคยาวิก"
 ICE_communist_tech_sharing_group_desc: "โครงการรวมเพื่อความกาวหนาทางสังคมและเทคโนโลยี มีสํานักงานใหญอยูที่เรคยาวิก ประเทศไอซแลนด"
 CHL_communist_tech_sharing_group_name: "ประชาคมวิจัยนานาชาติซานติอาโก"
 CHL_communist_tech_sharing_group_desc: "โครงการรวมเพื่อความกาวหนาทางสังคมและเทคโนโลยี มีสํานักงานใหญอยูที่ซานติอาโก ประเทศชิลี"
 CHL_fascist_tech_sharing_group_name: "สมาคมความกาวหนาฮิสแปนิก"
 CHL_fascist_tech_sharing_group_desc: "สมาคมวิจัยรวมที่กอตั้งขึ้นระหวางสมาชิกของพันธมิตรฮิสแปนิก โดยมีเปาหมายเพื่อรวมกันพัฒนาเทคโนโลยีใหกาวหนาที่สุดเทาที่จะทําได"
 ARG_italian_argentine_tech_sharing_group_name: "ความตกลงอิตาลี-อารเจนตินา"
 ARG_italian_argentine_tech_sharing_group_desc: "โครงการวิจัยรวมที่พัฒนาขึ้นเพื่อเปนเกียรติแกการทูตระหวางอิตาลีและอารเจนตินา"
 BRA_commonwealth_tech_sharing_name: "ความตกลงดานเทคโนโลยีแหงเครือจักรภพลูโซโฟน"
 BRA_commonwealth_tech_sharing_desc: "รัฐสมาชิกของเครือจักรภพลูโซโฟนตกลงที่จะแบงปนพัฒนาการทางเทคโนโลยีของตนเพื่อประโยชนรวมกันของทุกฝาย"
 BRA_USA_tech_sharing_group_name: "โครงการแลกเปลี่ยนเทคโนโลยีสหรัฐอเมริกา-บราซิล"
 BRA_USA_tech_sharing_group_desc: "สหรัฐอเมริกาและบราซิลตกลงที่จะรวบรวมความรูทางวิทยาศาสตรของตนเขาดวยกัน ภายหลังความเคลื่อนไหวของรัฐบาลบราซิลที่จะทํางานใกลชิดกับเพื่อนบานทางเหนือมากขึ้นในเรื่องนโยบายตางประเทศ"
 BRA_south_american_tech_sharing_group_name: "สภาวิจัยละตินอเมริกา"
 BRA_south_american_tech_sharing_group_desc: "ชาติตาง ๆ ในละตินอเมริกาตกลงที่จะรวบรวมความรูทางวิทยาศาสตรของตนเขาดวยกันเพื่อประโยชนรวมกันของภูมิภาค"

 HABSBURG_tech_sharing_group_name: "สมาคมความกาวหนาแหงดานูบ"
 HABSBURG_tech_sharing_group_desc: "สมาคมวิจัยรวมที่กอตั้งขึ้นระหวางสมาชิกของสหพันธใหมริมแมนํ้าดานูบ โดยมีเปาหมายเพื่อรวมกันพัฒนาเทคโนโลยีใหกาวหนาที่สุดเทาที่จะทําได"

 AUS_allied_tech_sharing_group_name: "คณะกรรมการวิจัยฝายสัมพันธมิตรแหงยุโรป"
 AUS_allied_tech_sharing_group_desc: "ขอริเริ่มที่ชาว[AUS.GetAdjective]เริ่มตนขึ้นเพื่อรวมกันพัฒนาเทคโนโลยีภายในฝายสัมพันธมิตร"

 GER_JAP_naval_tech_sharing_name: "การแลกเปลี่ยนเทคโนโลยีทางเรือเยอรมนี-ญี่ปุน"
 GER_JAP_naval_tech_sharing_desc: "ริเริ่มโดยวิศวกรทางเรือใน[GER.GetNameDef] ผูนํา[GER.GetAdjective]ไดยื่นมือไปยังญี่ปุนเพื่อแสวงหาความเปนเลิศดานเทคโนโลยีทางเรือ"

 GER_anglo_german_naval_development_group: "ขอริเริ่มพัฒนากองทัพเรือแองโกล-เยอรมัน"
 GER_anglo_german_naval_development_group_desc: "ริเริ่มโดยวิศวกรทางเรือใน[GER.GetNameDef] ผูนํา[GER.GetAdjective]ไดยื่นมือไปยังชาว[ENG.GetAdjective]เพื่อรวมมือกันแสวงหาความเปนเลิศดานเทคโนโลยีทางเรือ"

 GER_SOV_industrial_development_group: "สหกรณพัฒนาอุตสาหกรรมโซเวียต-เยอรมนี"
 GER_SOV_industrial_development_group_desc: "หลังจากความสัมพันธและความรวมมือทางอุตสาหกรรมระหวาง[GER.GetNameDef]และ[SOV.GetNameDef]แนนแฟนขึ้นเรื่อย ๆ ชาว[GER.GetAdjective]ไดยื่นมือไปยังชาว[SOV.GetAdjective]เพื่อสงเสริมความพยายามทางอุตสาหกรรมของทั้งสองฝาย"

 EU_tech_sharing_group_name: "กลุมวิจัยสหภาพยุโรป"
 EU_tech_sharing_group_desc: "ขอริเริ่มการวิจัยรวมที่ประธานาธิบดีแหงสหภาพยุโรปเริ่มตนขึ้นในนามของความกาวหนาทางเทคโนโลยีที่รวดเร็วขึ้นในหมูสมาชิกสหภาพยุโรป"

 AFG_SOV_tech_sharing_group_name: "ความตกลงความรวมมือทางเทคโนโลยีอัฟกัน-โซเวียต"
 AFG_SOV_tech_sharing_group_desc: "ประชาชนของ[AFG.GetNameDef]และ[SOV.GetNameDef]ไดเริ่มแบงปนความรูและการคนพบทางวิทยาศาสตรเพื่อความเจริญของทั้งสองฝาย"

 RAJ_naval_tech_sharing_group_name: "การแลกเปลี่ยนเทคโนโลยีทางเรืออีสตอินเดีย-ลอนดอน"
 RAJ_naval_tech_sharing_group_desc: "การแลกเปลี่ยนการวิจัยทางเรือระหวางบริษัทอินเดียตะวันออกและลอนดอน นักการทูตบางคนกระซิบวาการมอบอํานาจมากขนาดนี้ใหบริษัทแหงหนึ่งไมใชเรื่องฉลาด แตพวกเขาจะไปรูอะไร?"

 SSB_tech_sharing_group_name: "คณะกรรมการวิทยาศาสตรซาอาดาบาด"
 SSB_tech_sharing_group_desc: "ความตกลงการวิจัยแบบรวมเปนหนึ่งระหวางประเทศผูลงนามในกติกาซาอาดาบาด ซึ่งเปดใหรวมมือกันวิจัยไดอยางเต็มที่ บางทีสิ่งนี้อาจทําใหภูมิภาคที่เล็กแหงนี้กลายเปนมหาอํานาจได"
 MAN_PRC_technology_sharing_group_name: "กลุมวิจัยรวมของพรรคคอมมิวนิสตจีน"
 MAN_PRC_technology_sharing_group_desc: "การที่มีดินแดนมากกวาหนึ่งแหงอยูภายใตการควบคุมของพรรคคอมมิวนิสตจีน หมายความวาตองเพิ่มการสื่อสารระหวางกันเพื่อไมใหสวนใดสวนหนึ่งลาหลัง การประสานความพยายามดานการวิจัยเปนหนึ่งในสวนที่สําคัญที่สุดของการสื่อสารนี้"

 CZE_balkan_tech_sharing_group_name: "คณะกรรมการวิทยาศาสตรความตกลงไมตรีนอย"
 CZE_balkan_tech_sharing_group_desc: "ความตกลงดานการวิจัยระหวางชาติในบอลขานเปนหลักกับ[CZE.GetNameDef] เพื่อรักษาเทคโนโลยีอุตสาหกรรมของตนใหทัดเทียมกับชาติที่ใหญกวา"

 CZE_german_czechoslovak_equipment_design_group_name: "คณะกรรมการออกแบบยุทโธปกรณเชโกสโลวัก-เยอรมัน"
 CZE_german_czechoslovak_equipment_design_group_desc: "นักวิทยาศาสตรของ[GER.GetNameDef]และ[CZE.GetNameDef]ไดเริ่มรวมมือกันออกแบบรถถังและเครื่องบิน"
 
 cominwealth_allied_research_name: "การวิจัยของโคมินเวลท"
 cominwealth_allied_research_desc: "ลดเวลาการวิจัยสําหรับเทคโนโลยีที่สมาชิกของโคมินเวลทวิจัยแลว"

 siam_tech_sharing_group: "การวิจัยของไทย"
 siam_tech_sharing_group_desc: "ลดเวลาการวิจัยสําหรับเทคโนโลยีที่ประเทศพันธมิตรไทยอื่นๆ วิจัยแลว"
