 SWI_recently_finished_president_initiative_desc: "ดวยอํานาจอันจํากัดของประธานาธิบดีสมาพันธรัฐและสภาสหพันธ เราตองรอจนกวาจะสามารถดําเนินโครงการริเริ่มรวมกันครั้งใหมได การมอบอํานาจใหสภามากขึ้นอาจเปนหนทางที่จะทําโครงการเหลานี้ไดมากขึ้น แตเราตองพิจารณาวานั่นเปนแนวทางที่ดีที่สุดสําหรับคานิยมประชาธิปไตยที่หยั่งรากลึกของสวิตเซอรแลนดหรือไม"
 SWI_defense_fund_drive: "รณรงคระดมทุนเพื่อการปองกัน"
 SWI_defense_fund_drive_desc: "การปองกันตนเองจากผูรุกรานที่อาจเกิดขึ้นตองใชเงินที่รัฐบาลสหพันธสวิสไมมี แตเราสามารถรณรงคใหพลเมืองสวิสรวมกันจัดหาทุนเหลานี้ ในฐานะโครงการริเริ่มจากรากหญาอยางแทจริง"
 SWI_swiss_democratic_tradition_campaign: "รณรงคประเพณีประชาธิปไตยสวิส"
 SWI_swiss_democratic_tradition_campaign_desc: "เราสามารถเตือนใจชาวสวิสถึงประเพณีประชาธิปไตยอันมีประวัติยาวนานของเรา ซึ่งเปนประชาธิปไตยที่เกาแกที่สุดในยุโรป และอาจเปนประชาธิปไตยที่แทจริงเพียงหนึ่งเดียว"
 SWI_rally_workers: "ปลุกระดมแรงงาน"
 SWI_rally_workers_desc: "แรงงานอาจเปนสวนสําคัญในการปองกัน[SWI.GetName] เราจึงสามารถสงเสริมใหพวกเขาเขารวมในอุตสาหกรรมการทหาร[SWI.GetAdjective]อยางกระตือรือรน และอดทนตอการเสียสละที่จําเปน"
 SWI_anti_fascist_drive: "รณรงคตอตานฟาสซิสต"
 SWI_anti_fascist_drive_desc: "ไมมีที่ยืนสําหรับพวกฟาสซิสตใน[ROOT.GetName] ในฐานะประเทศที่อุทิศตนเพื่อการกําหนดชะตากรรมของตนเองและอํานาจประชาธิปไตยระดับทองถิ่น และมุงหวังจะเปนสวรรคของประชาชน จึงเปนหนาที่ของเราที่จะกําจัดพวกฟาสซิสตทุกคนที่ยังหลงเหลืออยูในประเทศ ไมวาพวกเขาจะอยูที่ใดก็ตาม"
 SWI_spouse_fascism: "รับเอาอุดมการณฟาสซิสต"
 SWI_spouse_fascism_desc: "ดวยสถานการณโลกที่เปนอยู การเขาขางมหาอํานาจฟาสซิสตอาจเปนทางเลือกที่ปลอดภัยที่สุด เราสามารถเริ่มเผยแพรโฆษณาชวนเชื่อแบบฟาสซิสตเพื่อใหประชาชนพรอมสําหรับการปรับเปลี่ยนคานิยมของเรา"
 SWI_focus_on_swiss_unity: "มุงเนนเอกภาพของสวิส"
 SWI_focus_on_swiss_unity_desc: "เราสามารถโนมนาวประชาชน[SWI.GetAdjective]วาสถานการณเรียกรองใหเราละทิ้งความแตกตางทั้งดานภาษา ชนชั้น ภูมิหลัง และแนวคิดทางการเมือง เพื่อรวมทรัพยากรและความพยายามของเราในการปกปองเอกภาพและความหลากหลายที่เปนตัวตนของ[SWI.GetNameDef]"
 SWI_isolate_switzerland: "โดดเดี่ยวสวิตเซอรแลนด"
 SWI_isolate_switzerland_desc: "เราสามารถทุมเททุกอยางเพื่อใหแนใจวา[SWI.GetName]จะยืนหยัดไดดวยตนเองและพึ่งพาตนเองได ซึ่งอาจเปนโอกาสเดียวที่จะไมสูญเสียเอกราชที่เราหวงแหน"
 SWI_militarization_drive: "รณรงคเสริมสรางกําลังทหาร"
 SWI_militarization_drive_desc: "เราสามารถเปลี่ยนจุดเนนไปสูการขยายเครื่องจักรสงคราม[SWI.GetAdjective] เพื่อใหเราปองกันตนเองได และอาจถึงขั้นชวงชิงความริเริ่มและตัดหนาการรุกของพวกเขา"
 SWI_expand_covert_operations: "ขยายปฏิบัติการลับ"
 SWI_expand_covert_operations_desc: "เราสามารถเพิ่มทรัพยากรดานการจารกรรมเพื่อชักจูงกิจการโลกใหเปนประโยชนตอเรา ขณะที่ยังคงรักษาภาพความเปนกลางไว"
 SWI_expand_arms_industry: "ขยายอุตสาหกรรมอาวุธ"
 SWI_expand_arms_industry_desc: "เราสามารถเพิ่มขีดความสามารถในการพัฒนาอาวุธใหมและผลิตไดอยางรวดเร็ว เพื่อไมตองพึ่งพามหาอํานาจตางชาติในการปองกันประเทศ"
 SWI_support_humanitarian_efforts: "สนับสนุนงานดานมนุษยธรรม"
 SWI_support_humanitarian_efforts_desc: "เราไมอาจนิ่งดูดายขณะที่ความโหดรายเกิดขึ้นรอบตัวเรา เรามีพันธะทางศีลธรรมที่จะชวยเหลือผูถูกกดขี่แหงยุโรปและใหที่ลี้ภัยแกพวกเขาในดินแดนของเรา"
 SWI_diplomatic_mission: "คณะทูตสัมพันธไมตรี"
 SWI_diplomatic_mission_desc: "เราสามารถเดินทางเยือนชาติอื่นๆ ทางการทูตเพื่อกระชับความสัมพันธ และคลายขอสงสัยใดๆ ที่พวกเขาอาจมีตอความเปนกลางของเรา เพื่อหลีกเลี่ยงการรุกรานที่อาจเกิดขึ้นจากพวกเขา"
 SWI_appease_fascists: "โอนออนตอฟาสซิสต"
 SWI_appease_fascists_desc: "เราสามารถยอมรับระเบียบใหมของยุโรปและเรียนรูที่จะอยูรวมกับเพื่อนบานฟาสซิสต สิ่งนี้อาจชวยใหเรารอดพนจากสงคราม และรักษาเอกราชและความเปนกลางของเราไวได"
