 leave_org_of_african_unity: "ออกจากองคการเอกภาพแอฟริกา"
 threaten_member_state: "ขมขูผูนํา[FROM.GetAdjective]"
 threaten_member_state_desc: "เราจะสงสารถึงผูนําของ [FROM.GetNameDef] วาหากพวกเขาไมยอมบูรณาการกับองคการเอกภาพแอฟริกาใหลึกซึ้งยิ่งขึ้น จะเกิดผลรายแรงตอตัวพวกเขาเอง..."
 threaten_member_state_tt: "\nผูนําของประเทศที่ถูกขมขูจะมีแนวโนมยอมรับขอเสนอการบูรณาการมากขึ้นตลอด §G60 วัน§! ที่การตัดสินใจนี้มีผล"

