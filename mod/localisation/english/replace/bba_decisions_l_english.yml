 ETH_2ndItaloEthiopianWar: "[ITA.GetName] ไดรุกรานมาตุภูมิของเราอยางผิดกฎหมาย แมเราจะเปนสมาชิกเต็มตัวของสันนิบาตชาติ แตโลกกลับไมดําเนินการใด ๆ และมองความขัดแยงนี้เปนเพียงการปะทะเล็ก ๆ ในอาณานิคม \nเราตองพิสูจนใหสันนิบาตชาติเห็นวานี่คือสงครามรุกรานเต็มรูปแบบของรัฐสมาชิกหนึ่งตออีกรัฐหนึ่ง และบีบใหโลกตองดําเนินการตอตาน [ITA.GetLeader]"
 ITA_2ndItaloEthiopianWar: "จนถึงตอนนี้สันนิบาตชาติยังไมไดดําเนินการใด ๆ ตอเรา มีเพียงการคัดคานเชิงสัญลักษณตอการพิชิตเอธิโอเปยของเราเทานั้น อยางไรก็ตาม ยิ่งความขัดแยงยืดเยื้อและเราสงทหารประจําการไปมากขึ้นเทาใด ความเสี่ยงที่พวกเขาจะเริ่มเขามาแทรกแซงกิจการของเราก็ยิ่งมากขึ้นเทานั้น เราตองยุติสงครามนี้กอนที่ [ETH.GetLeader] จะโนมนาวสันนิบาตชาติใหลงมือได"
