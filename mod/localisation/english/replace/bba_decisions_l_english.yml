l_english:
 #### Ethiopia

 # Balance of Power
 ETH_recall_balco_safo_decision: "เรียกตัว $ETH_balcho_safo$ กลับจากการปลดเกษียณ"
 ETH_recall_balco_safo_decision_desc: "$ETH_balcho_safo$ อาจเปนผูคัดคานที่แข็งกราวตอความทะเยอทะยานของจักรพรรดิในการปฏิรูปและรวมศูนยอํานาจของ [ROOT.GetName] แตในขณะเดียวกัน เขาก็เปนวีรบุรุษที่เคยสูรบทั้งในยุทธการที่เมเกเลและชัยชนะอันรุงโรจนที่อัดวา เขายังเปนผูนําที่ไดรับความนิยม ดังนั้นการขอใหเขาจับอาวุธอีกครั้งเพื่อ [ROOT.GetName] จะไมเพียงทําใหเราไดผูบัญชาการที่มีประสบการณ แตยังนาจะทําใหมีทหารมาเขารวมใตธงของเรามากขึ้นดวย"
 balcho_safo_recalled_tt: "ไดรับ §Y$irregular_infantry$§! 1 หนวย"
 ETH_bop_increase_mesafint_privileges: "เพิ่มอภิสิทธิ์ของเมซาฟนต"
 ETH_bop_increase_mesafint_privileges_desc: "เหลาราสทองถิ่นคือผูที่เหมาะสมที่สุดในการปกครองภูมิภาคตาง ๆ อํานาจสวนกลางใน [ROOT.capital.GetCapitalVictoryPointName] ไมควรวุนวายกับรายละเอียดเล็ก ๆ นอย ๆ อยางไรก็ตาม เราตองระวังไมใหดําเนินการเร็วเกินไป มิฉะนั้นพวกเขาจะใชอํานาจนั้นแยกตัวออกไปอยางสิ้นเชิง"
 ETH_bop_increase_the_power_of_the_mekwanint: "เพิ่มอํานาจของเมกวานินต"
 ETH_bop_increase_the_power_of_the_mekwanint_desc: "รัฐมนตรีที่ไดรับการแตงตั้งตองมีอํานาจเหนือกิจการทองถิ่นมากขึ้น เราควรถายโอนอํานาจจากเมซาฟนตไปยังเมกวานินต คอย ๆ ยายการควบคุมไปสูรัฐบาลกลางและ [ROOT.GetLeader] แนนอนวาสิ่งนี้จะทําใหเหลาราสไมพอใจ แตก็จําเปนหากเราจะสราง [ROOT.GetName] ที่เขมแข็ง"
 ETH_bop_privileges_changed: " ยังไมถึงหนึ่งปนับตั้งแตเปลี่ยนอภิสิทธิ์ครั้งลาสุด"
 ETH_bop_increase_anarchist_influence: "เพิ่มการสนับสนุนฝายอนาธิปไตย"
 ETH_bop_increase_communist_influence: "เพิ่มการสนับสนุนฝายคอมมิวนิสต"
 ETH_bop_increase_anarchist_influence_desc: "เราตองทําใหแนใจวาฝายอนาธิปไตยมีอิทธิพลเพียงพอที่จะปองกันไมใหรัฐบาลกลางลิดรอนสิทธิของประชาชนอีก เราควรเริ่มรณรงคโฆษณาชวนเชื่อเพื่อเพิ่มการสนับสนุนในหมูประชาชนตออุดมการณของเรา "
 ETH_bop_increase_communist_influence_desc: "เราตองทําใหแนใจวาฝายคอมมิวนิสตมีอิทธิพลเหนือการตัดสินใจของรัฐบาลกลาง เราควรเริ่มรณรงคโฆษณาชวนเชื่อเพื่อเพิ่มการสนับสนุนในหมูประชาชนตออุดมการณของเรา กอนที่ชาติจะแตกสลาย"

# Decisions Menu
 ETH_placeholder_political_category: "ขอความชั่วคราว - จะถูกนําออก"
 ETH_placeholder_political_category_desc: "ขอความชั่วคราว - จะถูกนําออก\n- การกระจายอํานาจ / การรวมศูนยอํานาจ: [GetPlaceholderBopText]"
 war_escalation_text: "£generic_war_escalation_text_icon ระดับการยกระดับสงคราม: §Y[?ETH.ETH_war_escalation_level]§!"
 war_escalation_level_tt: "§Yการยกระดับสงครามปจจุบัน§!\nระดับการยกระดับจะเพิ่มขึ้นตามเวลา และจากการกระทําตาง ๆ ของอิตาลีดวย\n\nระยะเวลาสงคราม: §Y+[?ETH.ETH_escalation_time_increase_total]§!\nอิตาลีเปดการรุกครั้งใหญ (+1) [GetItalianRenewedOffensiveText]\n\nอิตาลีสงกองพลประจําการอยางนอย 25 กองพล (+1) [GetItalian20DivisionsText]\n\nอิตาลีสงอากาศยานอยางนอย 300 ลํา (+1) [GetItalianAircraftsText] [GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_escalation_icon_tt: "§Yการยกระดับสงคราม§!\nผลที่เกิดจากการยกระดับสงคราม แยกตามระดับ:\n ระดับ 3:\n §Yสันนิบาตชาติ§!: ปลดล็อกการขอใหควํ่าบาตร\n §Yเอธิโอเปย§!: ชื่อเสียงระหวางประเทศเพิ่มขึ้น \nระดับ 4:\n §Yสันนิบาตชาติ§!: ปลดล็อกการซื้ออาวุธ\n §Yอิตาลี§!: สาธารณชนอิตาลีกังวล\nระดับ 5:\n §Yสันนิบาตชาติ§!: ปลดล็อกการปดคลองสุเอซ\n §Yอิตาลี§!: กองทัพแอฟริกาทอแท\nระดับ 6: \n §Yสันนิบาตชาติ§!: ปลดล็อกกองพลนอยนานาชาติ\n §Yเอธิโอเปย§!: ขวัญกําลังใจกองทัพเพิ่มขึ้น\n §Yอิตาลี§!: ความไมสงบในอาณานิคม\nระดับ 7: \n §Yสันนิบาตชาติ§!: ปลดล็อกการไกลเกลี่ยระหวางประเทศ\n §Yอิตาลี§!: สาธารณชนอิตาลีตั้งคําถามตอความพยายามทําสงคราม \nระดับ 8:\n §Yเอธิโอเปย§!: ขาศึกหนีทัพ\n §Yอิตาลี§!: การหนีทัพครั้งใหญ \nระดับ 9:\n §Yเอธิโอเปย§!: รอดพนแมทุกอยางไมเปนใจ \nระดับ 10:\n §Yเอธิโอเปย§!: สงครามประชาชน\n §Yอิตาลี§!: ความวุนวายในอาณานิคม"
 war_escalation_1_tt: "ระดับ 1\n ไมมีผล"
 war_escalation_2_tt: "ระดับ 2\n ไมมีผล"
 war_escalation_3_tt: "ระดับ 3\n §Yสันนิบาตชาติ§!: เอธิโอเปยสามารถขอใหควํ่าบาตรได\n §Yเอธิโอเปย§!: ชื่อเสียงระหวางประเทศเพิ่มขึ้น ปลดล็อกแผนยุทธศาสตร §Yขอใหควํ่าบาตร§!"
 war_escalation_4_tt: "ระดับ 4\n §Yสันนิบาตชาติ§!: เอธิโอเปยสามารถขออาวุธได\n §Yอิตาลี§!: สาธารณชนอิตาลีกังวล \n §Yเอธิโอเปย§!: ปลดล็อกแผนยุทธศาสตร §Yการซื้ออาวุธ§!"
 war_escalation_5_tt: "ระดับ 5\n §Yสันนิบาตชาติ§!: เอธิโอเปยสามารถขอใหปดคลองสุเอซได\n §Yอิตาลี§!: กองทัพแอฟริกาทอแท \n §Yเอธิโอเปย§!: ปลดล็อกแผนยุทธศาสตร §Yปดคลองสุเอซ§!"
 war_escalation_6_tt: "ระดับ 6 \n §Yสันนิบาตชาติ§!:เอธิโอเปยสามารถขอกองพลนอยนานาชาติได\n §Yเอธิโอเปย§!: ขวัญกําลังใจกองทัพเพิ่มขึ้น ปลดล็อกแผนยุทธศาสตร §Yกองพลนอยนานาชาติ§!\n §Yอิตาลี§!: ความไมสงบในอาณานิคม"
 war_escalation_7_tt: "ระดับ 7\n §Yสันนิบาตชาติ§!: เอธิโอเปยสามารถขอการไกลเกลี่ยระหวางประเทศได\n§Y อิตาลี§!: สาธารณชนอิตาลีตั้งคําถามตอความพยายามทําสงคราม \n§Yเอธิโอเปย§!: ปลดล็อกแผนยุทธศาสตร §Yการไกลเกลี่ยระหวางประเทศ§!"
 war_escalation_8_tt: "ระดับ 8\n §Yเอธิโอเปย§!: ขาศึกหนีทัพ\n §Yอิตาลี§!: การหนีทัพครั้งใหญ"
 war_escalation_9_tt: "ระดับ 9\n §Yเอธิโอเปย§!: รอดพนแมทุกอยางไมเปนใจ"
 war_escalation_10_tt: "ระดับ 10\n §Yเอธิโอเปย§!: สงครามประชาชน\n §Yอิตาลี§!: ความวุนวายในอาณานิคม"

