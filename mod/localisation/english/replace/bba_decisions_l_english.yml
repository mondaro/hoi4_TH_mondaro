 ETH_italian_uprising_warning_mission_desc: "มีขาวลือวา [ETH.GetLeader] ไดเรียกรองใหฝายกบฏในประเทศลุกฮือขึ้นโจมตี [ROOT.GetName] อยางประสานกัน"
 ETH_italian_uprising_warning_mission_tt: "การลุกฮือเริ่มขึ้น"
 ETH_coup_haile_selassie_imru: "ยุยงรัฐประหารในวัง"
 ETH_coup_haile_selassie_imru_desc: "$ETH_ras_imru_haile_selassie$ ผูมีแนวคิดประชาธิปไตยไดปกครองประเทศขณะที่จักรพรรดิไมอยู ไมตองสงสัยเลยวามวลชนมองเขาเปนวีรบุรุษตัวจริงของ [ROOT.GetName] หลังจากนําประเทศผานสงคราม เสียงเรียกรองให [ROOT.GetName] เปนประชาธิปไตยมากขึ้นดังขึ้นเรื่อย ๆ บางทีตอนนี้อาจถึงเวลาสรางความเปลี่ยนแปลงอยางแทจริงใน [ROOT.GetNameDef]"
 ETH_palace_coup_tt: "§Y$ETH_ras_imru_haile_selassie$§! พยายามกอรัฐประหาร"
