 ITA_withdraw_from_ethiopia: "ถอนตัวจากเอธิโอเปย"
 ITA_withdraw_from_ethiopia_desc: "สงครามกับเอธิโอเปยเปนความผิดพลาด ถึงเวลายุติเรื่องอื้อฉาวนี้แลว"
 ITA_transfer_lost_states_tt: "§Y[550.GetName]§!, §Y[559.GetName]§! และ §Y[844.GetName]§! จะถูกโอนให §Y[ETH.GetName]§! หากพวกเขาควบคุมไดทั้งหมด §Y[908.GetName]§! จะถูกโอนดวยหากเปนของ [ROOT.GetNameDef]"

 ITA_missiolinis: "ภารกิจจากดูเช"
 ITA_missiolinis_desc: "ดูเชมีแผนการใหญที่จะนําชาติอิตาลีอันภาคภูมิไปสูที่ทางอันชอบธรรม เพื่อใหวิสัยทัศนแหงอิตาลีที่ยิ่งใหญกวาเดิมเปนจริง เขากําลังออกคําสั่งที่เกี่ยวของ ซึ่งเขาเชื่อมั่นวาจะถูกปฏิบัติตามอยางทันทวงที \n\n£ITA_missiolini_text_icon ภารกิจที่ดําเนินอยู: §Y[?ITA_missiolinis_active_missions]§! \n£ITA_missiolini_text_icon ภารกิจที่สําเร็จ: §Y[?ITA_missiolinis_successful_missions]§! \n£ITA_missiolini_silver_text_icon ภารกิจที่ลมเหลว: §R[?ITA_missiolinis_failed_missions]§!"
 ITA_missiolini_conquer_ethiopia: "พิชิตเอธิโอเปย"
 ITA_missiolini_conquer_ethiopia_desc: "ฐานที่มั่นของอะบิสซิเนียที่ยังหลงเหลืออยูตองถูกจัดการเพื่อรับประกันชัยชนะของอิตาลี"
 ITA_missiolini_pacify_ethiopia: "สรางความสงบในเอธิโอเปย"
 ITA_missiolini_pacify_ethiopia_desc: "ดูเชไดออกคําสั่งใหปราบปรามฝายตอตานชาวอะบิสซิเนียดวยกําลังอยางเด็ดขาด และออกกฎหมายเพื่อควบคุมประชาชน เขาตองการใหทั้งประเทศสงบราบคาบและถูกนําเขาสูออมอกของอิตาลีโดยเร็วที่สุด"
 ITA_missiolini_pacify_ethiopia_vanilla: "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc: "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_pacify_ethiopia_goal_tt: "รัฐเริ่มตนทั้งหมดของเอธิโอเปยมีการยอมรับปกครองมากกวา §Y60%§!"
 ITA_missiolini_strengthen_heavy_industry: "โครงการพัฒนาอุตสาหกรรม"
 ITA_missiolini_strengthen_heavy_industry_desc: "เพื่อใหอิตาลีเจริญรุงเรืองอยางแทจริง เราตองสรางโรงงานใหมเพื่อรองรับการเติบโตของจักรวรรดิอันคึกคักของเรา และขยายขีดความสามารถในการผลิต"
 ITA_missiolini_strengthen_heavy_industry_trigger_tt: "$TRIGGER_NUM_OF_CIVILIAN_FACTORIES_MORE_THAN$§Y[?ITA_missiolinis_required_civs]§! (ปจจุบัน §[GetColorNumOfCivsMissiolinis][?ROOT.num_of_civilian_factories]§!)"
 ITA_missiolini_strengthen_the_army: "เสริมกําลังกองทัพบก"
 ITA_missiolini_strengthen_the_army_desc: "เชนเดียวกับจักรวรรดิโรมันในอดีต จักรวรรดิที่กําลังเติบโตของเราแผขยายไปไกลกวาง และตองการกองทัพที่แข็งแกรงเพื่อปกปองจากฝูงคนเถื่อนที่อยูเลยพรมแดนออกไป"
 ITA_missiolini_stockpile_trucks: "สะสมรถบรรทุก"
 ITA_missiolini_stockpile_trucks_desc: "เราตองการกองกําลังทหารที่คลองตัวมากขึ้น ซึ่งเคลื่อนที่ไดรวดเร็วผานภูมิประเทศกวางใหญโดยไมถูกจํากัดดวยการสงกําลังบํารุงที่ตามไมทัน"
 ITA_missiolini_stockpile_fuel: "เพิ่มเชื้อเพลิงสํารอง"
 ITA_missiolini_stockpile_fuel_desc: "กองทัพสมัยใหมไมไดเดินทัพดวยทองเพียงอยางเดียว แตยังตองอาศัยเชื้อเพลิงดวย และหากไมมี เครื่องจักรสงครามทั้งหมดก็จะหยุดชะงัก ทุกเหลาทัพตองใชมัน และเราตองจัดหานํ้ามันในปริมาณมากไดหากเราจะประสบความสําเร็จในสนามรบ"
 ITA_missiolini_strengthen_the_airforce: "เสริมกําลังกองทัพอากาศ"
 ITA_missiolini_strengthen_the_airforce_desc: "Regia Aeronautica กลายเปนสัญลักษณแหงความภาคภูมิใจของชาติ และครั้งหนึ่งเคยเปนหนึ่งในกองทัพอากาศที่ยิ่งใหญที่สุดในโลก เราตองผลิตอากาศยานเพิ่มเติมเพื่อเสริมกําลังกองทัพอากาศและทําใหยิ่งใหญอีกครั้ง"
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt: "ไดผลิตหรือจัดหาอากาศยาน §Y$fighter_equipment$§! ใหม §Y[?ROOT.ITA_missiolinis_fighters_to_produce]§! ลํา \nเครื่องบินขับไลที่ประจําการอยู: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§! - เครื่องบินขับไลในคลัง §G[?ROOT.num_equipment@small_plane_airframe]§! - เปาหมายเครื่องบินขับไลทั้งหมด §Y[?ITA_missiolinis_fighters_goal]§! \n\n"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt: "ไดผลิตหรือจัดหาอากาศยาน §Y$CAS_equipment$§!, §Y$nav_bomber_equipment$§! หรือ §Y$tac_bomber_equipment$§! ใหม §Y[?ROOT.ITA_missiolinis_bombers_to_produce]§! ลํา (ประเภทเดียวเทานั้น) \nCAS ที่ประจําการอยู: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§! - CAS ในคลัง §G[?ROOT.num_equipment@small_plane_cas_airframe]§! - เปาหมาย CAS ทั้งหมด §Y[?ITA_missiolinis_cas_goal]§! \nเครื่องบินทิ้งระเบิดทางทะเลที่ประจําการอยู: §G[?ROOT.num_deployed_planes_with_type@small_plane_naval_bomber_airframe]§! - เครื่องบินทิ้งระเบิดทางทะเลในคลัง §G[?ROOT.num_equipment@small_plane_naval_bomber_airframe]§! - เปาหมายเครื่องบินทิ้งระเบิดทางทะเลทั้งหมด §Y[?ITA_missiolinis_naval_bombers_goal]§! \nเครื่องบินทิ้งระเบิดทางยุทธวิธีที่ประจําการอยู: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§! - เครื่องบินทิ้งระเบิดทางยุทธวิธีในคลัง §G[?ROOT.num_equipment@medium_plane_airframe]§! - เปาหมายเครื่องบินทิ้งระเบิดทางยุทธวิธีทั้งหมด §Y[?ITA_missiolinis_tactical_bombers_goal]§!"
 ITA_missiolini_industrial_research: "การวิจัยดานอุตสาหกรรม"
 ITA_missiolini_industrial_research_desc: "เราตองแสดงใหโลกเห็นวาลัทธิฟาสซิสตและชาวอิตาลีสามารถกาวกระโดดทางเทคโนโลยีไดอยางรวดเร็วเพียงใด"
 ITA_missiolini_expand_intelligence_agency: "ขยายหนวยขาวกรอง"
 ITA_missiolini_expand_intelligence_agency_desc: "ดวยการขยายหนวยขาวกรอง เราจะแทรกซึมเขาไปในทุกแงมุมของสังคมอิตาลี เพื่อลากพวกคอมมิวนิสต อาชญากร และกลุมเปนภัยอื่น ๆ ออกมาสูแสงสวางและนําตัวมาลงโทษ ทําใหอิตาลีปลอดภัยยิ่งขึ้น"
 ITA_missiolini_occupy_albania: "ยึดครองแอลเบเนีย"
 ITA_missiolini_occupy_albania_desc: "สายสัมพันธอันแนนแฟนระหวางอิตาลีกับแอลเบเนียยอนไปหลายพันปถึงสมัยจักรวรรดิโรมัน เราตองผนวกแอลเบเนียเขากับอิตาลีเพื่อรักษาทางเขาสูทะเลเอเดรียติก"
 ITA_missiolini_firmly_established_italian_administration_autonomy_text: "การบริหาร[ROOT.GetAdjective]ที่ตั้งมั่นอยางแนนหนา"
 ITA_missiolini_occupy_albania_occupation_effects: "หาก [ROOT.GetFlag][ROOT.GetNameDef] ควบคุมดินแดนหลัก[ALB.GetFlag][ALB.GetAdjective]: \n"
 ITA_missiolini_occupy_albania_subject_effects: "หาก [ALB.GetFlag][ALB.GetNameDef] เปนรัฐในอารักขาของ §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_occupy_dalmatia: "ยึดครอง [103.GetName]"
 ITA_missiolini_occupy_dalmatia_desc: "เราตองแกไขความอยุติธรรมรายแรงจากมหาสงคราม และยึดสิ่งที่เปนของเราโดยชอบธรรมดวยกําลัง ดัลเมเชียตองเปนของอิตาลี!"
 ITA_missiolini_occupy_dalmatia_occupation_effects: "\nหาก [ROOT.GetFlag][ROOT.GetNameDef] ควบคุม §Y[103.GetName]§!: \nทุกรัฐที่เปนดินแดนหลัก[YUG.GetFlag][YUG.GetAdjective]ซึ่ง [ROOT.GetFlag][ROOT.GetNameDef] ควบคุมทั้งหมด: \n   การยอมรับปกครอง: §G+5.0%§! \n   การตอตาน: §G-5.0%§!"
 ITA_missiolini_occupy_dalmatia_subject_effects: "\n หาก §Y[103.GetName]§! ถูกควบคุมทั้งหมดโดยรัฐในอารักขา[ROOT.GetAdjective]ที่มีตนกําเนิดจาก[YUG.GetAdjective]: \n   รัฐในอารักขา[ROOT.GetAdjective]ทั้งหมดที่มีตนกําเนิดจาก[YUG.GetAdjective]: \n"
 ITA_missiolini_occupy_greece: "ยึดครอง [GRE.GetName]"
 ITA_missiolini_occupy_greece_desc: "เชนเดียวกับกองทหารโรมันในอดีต เราก็สามารถทําลายขอจํากัดที่ถูกยัดเยียดใหเราไดดวยการพิชิตกรีซ และรวมประชาชนพี่นองของเราเปนหนึ่งเดียว"
 ITA_missiolini_occupy_greece_occupation_effects: "\nทุกรัฐที่เปนดินแดนหลัก[GRE.GetFlag][GRE.GetAdjective]ซึ่ง [ROOT.GetFlag][ROOT.GetNameDef] ควบคุมทั้งหมด: \n   การยอมรับปกครอง: §G+5.0%§! \n   การตอตาน: §G-5.0%§! \n\nผลปจจุบัน:"
 ITA_missiolini_occupy_greece_subject_effects: "\nหาก [GRE.GetFlag][GRE.GetName] เปนรัฐในอารักขาของ §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_occupy_ticino: "ยึดครอง [846.GetName]"
 ITA_missiolini_occupy_ticino_desc: "นับตั้งแตฮันนิบาลขามเทือกเขาแอลปพรอมชางของเขา ภูเขาเหลานี้ก็เปนทางดวนใหคนเถื่อนบุกตรงเขาสูใจกลางของอิตาลี เราตองรักษาพรมแดนทางเหนือของเราใหมั่นคง"
 ITA_missiolini_occupy_ticino_occupation_effects: "\n[846.GetName] และทุกรัฐที่เปนดินแดนหลัก[SWI.GetFlag][SWI.GetAdjective]ซึ่ง [ROOT.GetFlag][ROOT.GetNameDef] ควบคุมทั้งหมด: \n   การยอมรับปกครอง: §G+5.0%§! \n   การตอตาน: §G-5.0%§! \n\nผลปจจุบัน:"
 ITA_missiolini_occupy_ticino_subject_effects: "\nหาก [SWI.GetFlag][SWI.GetName] เปนรัฐในอารักขาของ §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_bolster_political_cabinet: "เสริมความแข็งแกรงคณะรัฐมนตรี"
