 ETH_formal_request_to_host_desc: "เราควรเขาหารัฐบาล[?ETH.host_nation.GetAdjective]และขอใหสนับสนุน [ROOT.GetLeader] อยางเต็มที่ในสงครามตอตาน [ITA.GetNameDef] สิ่งนี้จะเริ่มตนชวงสุดทายของการยึดชาติของเราคืน"
 ETH_false_flag_operation_decision: "ดําเนินปฏิบัติการใสรายปายสี"
 ETH_false_flag_operation_decision_desc: "เพื่อโนมนาวเจาบานของเราวา [ITA.GetName] ไมนาไววางใจ เราตองจัดฉากโจมตีดานชายแดนของเยอรมนี แลวโยนความผิดใหชาวอิตาลี"
 ETH_throw_grand_party_for_host: "จัดงานเลี้ยงอยางหรูหรา"
 ETH_throw_grand_party_for_host_desc: "งานเลี้ยงใหญที่บานพักของ [ROOT.GetLeader] จะเปนโอกาสอันดีเยี่ยมในการล็อบบี้อยางไมเปนทางการควบคูไปกับการล็อบบี้อยางเปนทางการ"
