 SWI_renounce_guiding_principles_desc_cantons: "คํามั่นเดิมของเราที่จะกระจายอํานาจสูแคนตันและสมัชชาสหพันธตอไปอาจเร็วเกินไป สถานการณปจจุบันแสดงใหเห็นชัดวาสภาสหพันธที่กระฉับกระเฉงและมีอํานาจมากขึ้นเปนสิ่งจําเปนตอการอยูรอดของเรา"
