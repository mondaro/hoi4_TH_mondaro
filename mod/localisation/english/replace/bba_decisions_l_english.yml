 ETH_improve_country_category: "ความกาวหนาของ [ROOT.GetName]"
 ETH_improve_country_category_desc: "[ETH.GetNameDefCap] มีเศรษฐกิจที่พึ่งพาเกษตรกรรมเปนหลัก โดยมีเกษตรกรทําไรเพื่อยังชีพ เพื่อใหเปนอุตสาหกรรม เราตองลงทุนมหาศาลในการขยายไฟฟาและโครงสรางพื้นฐานดานการขนสง เพื่อใหแรงงานจํานวนมากขึ้นยายจากภาคเกษตรเขาสูโรงงานได"
 ETH_build_local_resistance_force: "จัดตั้งกองกําลังตอตานใน [FROM.GetName]"
 ETH_build_local_resistance_force_desc: "เราตองทําทุกวิถีทางเพื่อสนับสนุนขบวนการตอตานในดินแดนที่ถูกยึดครอง สิ่งนี้จะชวยบั่นทอนอํานาจการยึดกุมภูมิภาคของ[ITA.GetAdjective]ไดมาก และทําใหพวกเขาวุนอยูขณะที่เราเตรียมการปลดปลอย [ETH.GetName] ซึ่งจะตองมาถึงอยางแนนอน"
 ETH_build_local_resistance_force_increase_tt: "เกณฑกองพลอารเบญโญช §G1§! กองพลที่สามารถลุกฮือขึ้นในรัฐได"
