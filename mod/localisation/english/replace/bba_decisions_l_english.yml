 invite_to_ACB: "เชิญ [FROM.GetName] เขารวมธนาคารกลางแอฟริกา"
 invite_to_ACB_tt: "ชาติที่มีอุดมการณแตกตางจากคุณไมนาจะยอมรับการบูรณาการทางเศรษฐกิจกับคุณ"
 invite_to_org_alliance: "เชิญ [FROM.GetName] เขารวมขอตกลงปองกันรวมกัน"
 invite_to_org_alliance_tt: "ชาติที่มีอุดมการณแตกตางจากคุณจะมีแนวโนมลงนามในขอตกลงปองกันนอยลง"
 invite_to_exec_council: "เชิญ [FROM.GetName] เขารวมคณะมนตรีบริหาร"
 invite_to_exec_council_tt: "ชาติที่มีอุดมการณแตกตางจะไมสนับสนุนการรวมกันทางการเมืองกับคุณ"
 threaten_org_member: "ขมขูผูนําของ [FROM.GetName]"
