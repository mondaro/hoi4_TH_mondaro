 ETH_time_based_war_escalation_mission_desc: "ยิ่งสงครามยืดเยื้อนานเทาใด โลกก็จะยิ่งกังวลมากขึ้นเทานั้น ทุก ๆ หกเดือนที่ผานไปนับตั้งแตเริ่มตนในเดือนตุลาคม 1935 การยกระดับสงครามจะเพิ่มขึ้นหนึ่งระดับ"

