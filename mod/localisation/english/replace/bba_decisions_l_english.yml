 african_union_category_desc: "เราจะสรางสถาบันที่รวบรวมความสามารถและทรัพยากรของทั้งทวีปเขาดวยกัน และกาวเขาใกลการรวมกันทางการเมืองมากขึ้นทุกที มีเพียงการยืนหยัดรวมกันและรวมมือกันเทานั้น ประชาชนแหงแอฟริกาจึงจะหวังตานทานไมใหตกเปนเมืองขึ้นอีกครั้งได"
 promote_org_of_african_unity: "สงเสริมองคการใน [FROM.GetName]"
 invite_to_org: "เชิญ [FROM.OWNER.GetNameDef] เขารวมองคการ"
