 wuw_GER_reichskommissariats.17.desc: "เมื่อยึดเขตยุทธศาสตรสโลวาเกียไดแลว ก็เกิดคําถามวาควรจัดการภูมิภาคนี้อยางไร บางแผนรวมพื้นที่นี้ไวในบอลขาน ขณะที่บางฝายเสนอวาอาจผนวกเขากับรัฐโบฮีเมีย หรืออาจถึงขั้นผนวกรวมเขากับมหาอาณาจักรเยอรมัน เราวาอยางไร?"
