 GER_inner_circle_himmler.00.t: "หนาที่ของฮิมมเลอร"
 GER_inner_circle_himmler.00.desc: "ฮิมมเลอรไดสั่งสมอิทธิพลอยางมากเหนือการเมืองและการกําหนดนโยบายของเยอรมนี หลังจากเขาควบคุมทั้งหนวยเอสเอสและเกสตาโป แมสิ่งนี้จะทําใหเขากลายเปนบุคคลทรงอํานาจในกิจการของเยอรมนี แตเขามีเวลาจํากัดที่จะเสริมความแข็งแกรงใหองคกรใดองคกรหนึ่งเทานั้น คําถามคือ องคกรใดจะไดรับความสําคัญกอน?"
 GER_inner_circle_himmler.00.a: "วัฟเฟน-เอสเอสคือสิ่งสําคัญอันดับแรก"
 GER_inner_circle_himmler.00.b: "มุงเนนการพัฒนาขาวกรองของเรา"
 GER_inner_circle_himmler_ss_tt: "§Y$GER_heinrich_himmler$§! จะเริ่มดําเนินการตามแผนยุทธศาสตร §Y$GER_expand_ss_security_duties$§! ในเร็ว ๆ นี้"
 GER_inner_circle_himmler_gestapo_tt: "§Y$GER_heinrich_himmler$§! จะเริ่มดําเนินการตามแผนยุทธศาสตร §Y$GER_expand_gestapo$§! ในเร็ว ๆ นี้"
 GER_inner_circle.01.t: "การผงาดขึ้นของ[GetAscendingAdvisorName]"
 GER_inner_circle.01.desc: "[GetAscendingAdvisorName] ไดแสดงความทะเยอทะยานอยางแรงกลาและมีอิทธิพลมากขึ้นภายในพรรค อยางไรก็ตาม ความพยายามที่จะกุมอํานาจมากขึ้นของเขาทําใหสมาชิกคนอื่น ๆ คัดคาน จนเกิดการแยงชิงอํานาจขึ้น คําถามคือ[GetAscendingAdvisorName]สรางความประทับใจให[GER.GetLeader]มากพอที่จะไดที่นั่งในวงในหรือไม"
 GER_inner_circle.01.a: "แทนที่[GetAscendedAdvisorName1]"
 GER_inner_circle.01.b: "แทนที่[GetAscendedAdvisorName2]"
 GER_inner_circle.01.c: "แทนที่[GetAscendedAdvisorName3]"
 GER_inner_circle.01.d: "[GetAscendingAdvisorName] ไมคูควรกับความไววางใจของทานผูนํา"
 GER_inner_circle.02.t: "ทานผูนําคนใหมผงาดขึ้น"
 GER_inner_circle.02.desc: "เหลาไรชสไลเทอรที่ใกลชิด[GER.GetLeader]ที่สุดเริ่มตั้งคําถามตอการนําของ[GER.GetLeader.GetHersHis]และวิสัยทัศนที่[GER.GetLeader.GetSheHe]มีตออนาคตของ[GER.GetNameDef] บัดนี้พวกเขาวางแผนจะโคน[GER.GetLeader]ลงจากอํานาจและยึดตําแหนงทานผูนํามาเปนของตน คําถามคือ ใครจะผงาดเหนือคนอื่น ๆ และนําทางไปสูอนาคตอันรุงโรจน?"
 GER_inner_circle.02.a: "[GetAscendedAdvisorName1] จะเปนผูนําชาติ"
 GER_inner_circle.02.b: "[GetAscendedAdvisorName2] เหมาะสมที่สุดสําหรับภารกิจนี้"
 GER_inner_circle.02.c: "[GetAscendedAdvisorName3] จะเปนผูนําที่แทจริงของประชาชน[ROOT.GetAdjective]"
 GER_inner_circle.02.d: "เรายังไมพรอมสําหรับการเปลี่ยนผูนํา"
 GER_inner_circle.03.t: "แผนอุตสาหกรรมของ[GetIntrigueCharacterName]ถูกตั้งคําถาม"
 GER_inner_circle.03.desc: "การแยงชิงอํานาจอันขมขื่นไดปะทุขึ้นระหวางคูแขงภายในวงในของ[GER.GetLeader] ความตึงเครียดเพิ่มสูงขึ้นเมื่อ[GetIntrigueCharacterName]มีอิทธิพลและอํานาจมากขึ้น [GetIndustrialReichsleiterNames] ตางวิจารณวิธีการของกันและกันอยางเปดเผยในเรื่องการบริหารอุตสาหกรรมและการผลิตอาวุธของเยอรมนีใหดีที่สุด ขณะเดียวกันก็แขงกันเอาใจ[GER.GetLeader]"
 GER_inner_circle.03.a: "[GetIntrigueCharacterName] ไดรับความไววางใจจากทานผูนําอยางเต็มที่"
 GER_inner_circle.03.b: "$GER_fritz_todt$ มีประสบการณที่จําเปนในการจัดการเรื่องนี้"
 GER_inner_circle.03.c: "$GER_albert_speer$ จะเขามาดูแลกิจการอุตสาหกรรม"
 GER_inner_circle.03.d: "$GER_hermann_goring$ คือมือขวาของทานผูนํา แตงตั้งเขา!"
 GER_inner_circle_industrial_reichsleiter: "[GetIndustrialReichsleiterNames]"
 GER_inner_circle_industrial_reichsleiter_all: "$GER_fritz_todt$, $GER_albert_speer$ และ $GER_hermann_goring$"
 GER_inner_circle_industrial_reichsleiter_no_goring: "$GER_fritz_todt$ และ $GER_albert_speer$"


