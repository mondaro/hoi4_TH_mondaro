 wuw_GER_reichskommissariats.14.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในไอบีเรียแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
