 WW_hungary.123.t: "การเดินขบวนสูบูดาเปสตของกางเขนเคียว"
 WW_hungary.123.desc: "ทหารของเราไดสกัดกั้นโซลตาน เบอเซอรเมญ นักการเมืองชาติสังคมนิยมหัวรุนแรง และผูติดตามที่กําลังเดินขบวนสูบูดาเปสต ในความพยายามรัฐประหารที่ไดรับอิทธิพลอยางมากจากการเดินขบวนสูโรมของมุสโสลินี นักเคลื่อนไหวทางการเมืองชายขอบผูนี้ ซึ่งเรียกตัวเองวา 'ยักษใหญทามกลางยักษใหญแหงปญญา และกวีฮังการีผูยิ่งใหญผูมีพันธกิจแหงการพยากรณ' ไดรวบรวมกลุมผูติดตามชาวไรชาวนาที่ไมพอใจภายใตธงกางเขนเคียวของพวกเขา และกําลังเคลื่อนเขาสูเมืองหลวงของเรา เราควรจัดการอยางไร?"
 WW_hungary.123.a: "สลายการชุมนุมและจับกุมผูนําที่นาสมเพชของพวกเขา!"
 WW_hungary.123.b: "เปดฉากยิงขูใหหนีไป"

 HUN_third_mexican_empire_tt: "§Yเม็กซิโก§! จะเปนที่รูจักในชื่อ §Yจักรวรรดิเม็กซิโกที่สาม§!\n"
 HUN_croatia_slavonia_tt: "§Yโครเอเชีย§! จะเปนที่รูจักในชื่อ §Yราชอาณาจักรโครเอเชีย-สลาโวเนีย§!\n"
 HUN_bohemia_and_silesia_tt: "§Yเชโกสโลวาเกีย§! จะเปนที่รูจักในชื่อ §Yราชอาณาจักรโบฮีเมีย-โมราเวียและไซลีเซีย§!\n"
 HUN_cisleithania_tt: "§Yออสเตรีย§! จะเปนที่รูจักในชื่อ §Yราชอาณาจักรและดินแดนที่มีผูแทนในสภาจักรวรรดิ§!\n"

 WW_hungary.124.t: "ชายผูกลับคืนสูบานเกิด"
 WW_hungary.124.desc: "เชาตรูวันนี้ เจาหนาที่ในเมืองโกรีรายงานวามีชายคนหนึ่งเรียกรองขอคืนที่ดินไรนาที่เขาอางวาเคยเปนของตน โดยบอกวาเพิ่งกลับมาบานเกิดไดและหนีพนเงื้อมมือของภัยคุกคามรัสเซีย เขายังสัญญาวาหากไดรับอนุญาตใหเขาสูการเมือง เขาจะนําชาติของเราสูความรุงโรจนได เพราะดูเหมือนเขาสืบเชื้อสายมาจากนักการเมืองที่ประสบความสําเร็จ เขาคือคนที่เราตองการเพื่อฟนฟูความฝนถึงจอรเจียที่ยิ่งใหญหรือไม?"
 WW_hungary.124.a: "ใหตําแหนงชายคนนี้เดี๋ยวนี้!"
 WW_hungary.124.b: "ไมวาเขาจะพูดอะไร เราไวใจเขาไมได"


 



 ### HUN news events ###

 wuw_HUN_news_events.1.t: "[HUN.GetNameDEFCAP]ประกาศโครงการเจอร"
 wuw_HUN_news_events.1.d: "\nรัฐบาล[HUN.GetAdjective]ภายใต [HUN.GetLeader] ไดประกาศโครงการอุตสาหกรรมขนาดใหญครั้งใหม โดยมีเจตนาฟนฟูกําลังทหารของชาติอยางมีประสิทธิภาพและรวดเร็วที่สุด ผูสังเกตการณตางชาติมองวานี่เปนการแสดงความกาวราวของ[HUN.GetNameDef]ตอเพื่อนบาน แตมีเพียงเวลาเทานั้นที่จะบอกไดวาเจตนาที่แทจริงของพวกเขาคืออะไร"
 wuw_HUN_news_events.1.a: "พวกเขากําลังเตรียมการบางอยาง..."
 wuw_HUN_news_events.1.b: "สิ่งนี้จะรับประกันอนาคตของเรา!"

 wuw_HUN_news_events.2.t: "[HUN.GetNameDefCap]เขารวมกับชาว[GER.GetAdjective]"
 wuw_HUN_news_events.2.d: "หลังลงนามสนธิสัญญาฉบับใหมวาดวยการชวยเหลือซึ่งกันและกันและการสงเสริมเปาหมายแหงชาติของแตละฝาย วันนี้ [GER.GetLeader] และ [HUN.GetLeader] ไดประกาศการเขารวมฝาย[GER.GetAdjective]ของ[HUN.GetNameDef]"
 wuw_HUN_news_events.2.a: "เรื่องนี้จะลงเอยอยางไร?"
 wuw_HUN_news_events.2.b: "เพื่ออนาคตที่ยิ่งใหญกวา!"
 wuw_HUN_news_events.2.c: "พวกเขาจะเปนหมากที่มีประโยชน"

 wuw_HUN_news_events.3.t: "[HUN.GetNameDefCap]ฟนฟูฝายมหาอํานาจกลาง"
 wuw_HUN_news_events.3.desc: "\nเมื่อไมมีทางเลือกดานพันธมิตรที่เปนไปไดในพื้นที่ใกลเคียง [HUN.GetNameDef]จึงหันมาฟนฟูฝายมหาอํานาจกลางขึ้นอีกครั้ง หลังหลุดพนจากสนธิสัญญาที่ถูกบังคับใช ประเทศนี้ไดหันไปเสริมกําลังทหารอยางรวดเร็ว พันธมิตรใหมของพวกเขาจะเหมือนฝายชื่อเดียวกันในมหาสงครามหรือไมนั้นยังตองรอดูตอไป"
 wuw_HUN_news_events.3.a: "นาเปนหวงอยางยิ่ง"
 wuw_HUN_news_events.3.b: "เราจะทวงคืนความรุงโรจนในอดีต!"
 wuw_HUN_news_events.3.c: "พวกเขาสืบสานมรดกของเรา"
 GER_Rejected_HUN_central_powers: "เยอรมนีปฏิเสธการเขารวมฝายมหาอํานาจกลางของเรา"

 wuw_HUN_news_events.4.t: "[HUN.GetNameDefCap]ประกาศครองโลก"
 wuw_HUN_news_events.4.desc: "[HUN.GetLeader] แหง[HUN.GetNameDef]ไดประกาศความทะเยอทะยานของชาติที่จะครอบงําโลก และสถาปนาความเปนเจาของ[HUN.GetAdjective]ในทุกทวีป พวกเขาอางวานี่คือสิทธิ์โดยกําเนิดของประชาชนแหงราชอาณาจักรอัครสาวก และพวกเขาจะไมมีวันกมหัวใหมหาอํานาจตางชาติอีก"
 wuw_HUN_news_events.4.a: "พวกเขาตองถูกทําลาย!"
 wuw_HUN_news_events.4.b: "โลกทั้งใบเปนของเรา!"

 wuw_HUN_news_events.5.t: "[HUN.GetLeader]ขึ้นครองราชบัลลังกฮังการี"
 wuw_HUN_news_events.5.desc: "ชาว[HUN.GetAdjective]ซึ่งแสวงหากษัตริยใหชาติของตน หลังการเจรจาและเตรียมการอันยาวนาน ไดสวมมงกุฎให [HUN.GetLeader] อยางเปนทางการเมื่อตนสัปดาหนี้ วันนี้ทามกลางการเฉลิมฉลองอันยิ่งใหญ พระองคไดรับการสวมมงกุฎเปนกษัตริยแหงฮังการีในพิธีอันศักดิ์สิทธิ์ ณ พระราชวังหลวงในบูดาเปสต"
 wuw_HUN_news_events.5.a: "มีกษัตริยเสียที!"
 wuw_HUN_news_events.5.b: "ศัตรูใหมไดผงาดขึ้น"
 wuw_HUN_news_events.5.c: "พันธมิตรที่มีศักยภาพ?"

 wuw_HUN_news_events.6.t: "โยเซฟ เอากุสท ขึ้นครองราชบัลลังกฮังการี"
 wuw_HUN_news_events.6.desc: "ชาว[HUN.GetAdjective]ซึ่งแสวงหากษัตริยใหชาติของตน หลังการเจรจาและเตรียมการอันยาวนาน ไดสวมมงกุฎใหโยเซฟ เอากุสท ฟอน ฮาพสบวรค พาลาไทนองคสุดทายแหงฮังการี อารชดยุกแหงออสเตรีย เจาชายแหงฮังการีและโบฮีเมีย และจอมพลแหงกองทัพออสเตรีย-ฮังการีเดิม อยางเปนทางการเมื่อตนสัปดาหนี้ วันนี้ทามกลางการเฉลิมฉลองอันยิ่งใหญ พระองคไดรับการสวมมงกุฎเปนกษัตริยแหงฮังการีในพิธีอันศักดิ์สิทธิ์ ณ พระราชวังหลวงในบูดาเปสต\nในฐานะวิเตซและขุนนางราชวงศฮาพสบวรค แนวคิดทางอุดมการณของกษัตริยองคใหมจึงชัดเจน และพระองคไดประกาศแลววา 'จะนําความยิ่งใหญที่ฮังการีสมควรไดรับมาให โดยไมละเมิดสนธิสัญญาที่ยุบจักรวรรดิออสเตรีย-ฮังการี' ประกอบกับคํามั่นของกษัตริยที่จะ 'แกไขความอยุติธรรมที่เราไดรับในอดีต' จึงไมนาที่พิธีบรมราชาภิเษกครั้งนี้จะชวยลดความตึงเครียดในภูมิภาคลงได"
 wuw_HUN_news_events.6.a: "มีกษัตริยเสียที!"
 wuw_HUN_news_events.6.b: "ศัตรูใหมไดผงาดขึ้น"
 wuw_HUN_news_events.6.c: "พันธมิตรที่มีศักยภาพ?"

 wuw_HUN_news_events.7.t: "การฟนฟูสาธารณรัฐโซเวียตฮังการี"
 wuw_HUN_news_events.7.desc: "วันนี้ เบลา กุน ประธานสภาบริหารกลางแหงฮังการี ไดประกาศจัดตั้งสาธารณรัฐสหพันธสังคมนิยมแหงสภาในฮังการีขึ้นใหม ซึ่งเคยสิ้นสุดลงอยางกะทันหันในเดือนสิงหาคม 1919 แมในอดีตจะถูกบดขยี้โดยกองกําลังผสมของฝายตอตานการปฏิวัติและความตกลงไตรภาคีนอย แตเบลา กุน ก็แถลงวาครั้งนี้จะตางออกไป อะไรรอคาบสมุทรบอลขานอยูในปตอๆ ไป?"
 wuw_HUN_news_events.7.a: "กรรมกรทั่วโลก จงรวมกัน!"
 wuw_HUN_news_events.7.b: "พวกเขากําลังวางแผนอะไรกันแน?"
 wuw_HUN_news_events.7.c: "พวกลัทธิแกจอมเสแสรง..."

 wuw_HUN_news_events.8.t: "การประกาศสาธารณรัฐประชาชนฮังการี"
 wuw_HUN_news_events.8.desc: "วันนี้ มาตยาช ราโกชี เลขาธิการใหญแหงฮังการี ไดประกาศจัดตั้งสาธารณรัฐประชาชนฮังการีขึ้นใหม พรอมแถลงวาชาติจะแสวงหาความรวมมือกับ[SOV.GetNameDef]มากขึ้น แมเขาจะประกาศวาชาติเปนประชาธิปไตยแบบเปด แตการปกครองแบบเผด็จการของชาตินี้ก็สังเกตไดไมยาก อนาคตของประชาชนฮังการีจะเปนอยางไร?"
 wuw_HUN_news_events.8.a: "เสียที!"
 wuw_HUN_news_events.8.b: "สันติภาพไมเคยเปนทางเลือก..."
 wuw_HUN_news_events.8.c: "นาประหลาดใจแนนอน แตก็นายินดี"

 wuw_HUN_news_events.9.t: "[HUN.GetNameDefCap]ยึดครองบูรเกนลันด"
 wuw_HUN_news_events.9.desc: "เมื่อตนสัปดาหนี้ กองกําลัง[HUN.GetAdjective]ไดเคลื่อนเขาไอเซนชตัดทและยึดครองพื้นที่ พวกเขาอางวาเปนการปกปองประชาชน[HUN.GetAdjective]ในภูมิภาค ซึ่งเพิ่งออกมาประทวงตามทองถนนตอตานสิ่งที่พวกเขาเรียกวาการยึดครองภูมิภาคอยางผิดกฎหมายหลังสนธิสัญญาทรียานง เรื่องนี้จะนําไปสูสงครามครั้งใหมในคาบสมุทรบอลขาน หรือเปนเพียงการปรับพรมแดนเล็กนอย?"
 wuw_HUN_news_events.9.a: "กลับคืนสูมือที่ถูกตอง"
 wuw_HUN_news_events.9.b: "มันไมใชของพวกเขา!"
 wuw_HUN_news_events.9.c: "พัฒนาการที่นาสนใจ"





 ##### Belgian events #####

 #### Historical ####
 ### Political Events

 #Government Resigns
 ww_BEL_event_political.1.t: "รัฐบาลลาออกและการเลือกตั้งกอนกําหนด"
 ww_BEL_event_political.1.desc: "แรงกดดันตอรัฐบาลจากเรื่องอื้อฉาวการทุจริตที่ยังดําเนินอยูทําใหรัฐบาลลมสลายในที่สุด คณะผูสอบสวนที่นําโดยเลออน เดอเกรล ผูนําขบวนการเร็กซิสตฝายฟาสซิสต ไดสอบสวนการติดสินบนรัฐมนตรีมาหลายป จนพบการจายเงินจํานวนมาก \n\nเพื่อกอบกูความชอบธรรม นายกรัฐมนตรีปอล ฟาน เซลันด ผูกําลังถูกรุมเรา ไดประกาศเลือกตั้งกอนกําหนดเพื่อเรียกความนาเชื่อถือและความชอบธรรมคืนมา และบัดนี้ผลก็ออกมาแลว \n\nพรรคแรงงานเบลเยียม (Parti Ouvrier Belge) ซึ่งนําโดยเอมีล ว็องแดรแวลด ทําผลงานไดดีที่สุด โดยอาศัยความไมเปนที่นิยมของคูแขงทางการเมือง เขาอาจใชชัยชนะนี้จัดตั้งรัฐบาลเสียงขางนอย หรือรวมมือกับพรรคคาทอลิกของปอล ฟาน เซลันด เพื่อสรางเสียงขางมากที่มั่นคงกวาและจัดตั้งรัฐบาลเอกภาพแหงชาติ \n\nที่ควรกลาวถึงดวยคือพรรคเร็กซิสตของเลออน เดอเกรล ก็ทําผลงานไดดีมาก โดยจุดยืนตอตานการทุจริตของเขาไดรับความนิยมอยางสูง"
 ww_BEL_event_political.1.a: "จัดตั้งรัฐบาลเอกภาพแหงชาติ"
 ww_BEL_event_political.1.b: "ว็องแดรแวลดจัดตั้งรัฐบาลเสียงขางนอย"
 BEL_paul_van_zeeland_remains_tt: "§Yปอล ฟาน เซลันด§! ยังคงเปนนายกรัฐมนตรี นํารัฐบาลผสมขนาดใหญของพรรค§Yประชาธิปไตย§!"

 #Corrupt Zeeland
 ww_BEL_event_political.2.t: "เรื่องอื้อฉาวการทุจริตของปอล ฟาน เซลันด"
 ww_BEL_event_political.2.desc: "เรื่องอื้อฉาวการทุจริตที่ตามหลอกหลอนพรรคคาทอลิกของปอล ฟาน เซลันด ทวีความรุนแรงขึ้นในวันนี้ เมื่อพบวานายกรัฐมนตรีเองก็รับ "เงินบริจาค"! ดูเหมือนเปนเพียงเรื่องของเวลากอนที่รัฐบาลของเขาจะลมสลายอีกครั้ง..."
 ww_BEL_event_political.2.a: "การทุจริตนี้ไมมีวันจบสิ้นเลยหรือ?!"

 #Royal Appointment
 ww_BEL_event_political.3.t: "การแตงตั้งโดยพระมหากษัตริย"
 ww_BEL_event_political.3.desc: "ในที่สุดปอล ฟาน เซลันด ก็ลาออกจากตําแหนงนายกรัฐมนตรีและพนจากตําแหนงอยางอัปยศ ครั้งนี้พระเจาเลโอโปลดที่ 3 ทรงประกาศวาจะเขามาแตงตั้งนายกรัฐมนตรีคนใหมดวยพระองคเอง มีผูสมัครที่โดดเดนสองคน: \n\nปอล-เอมีล ฌ็องซง สมาชิกพรรคเสรีนิยมและสมาชิกรัฐบาลเอกภาพแหงชาติ ซึ่งถูกมองวาเปนผูที่มั่นคง อีกคนคือเลออน เดอเกรล ผูไดรับการยกยองวาเปนกระบอกเสียงแหงกฎหมายและระเบียบ และเพิ่งไดแรงหนุนจากความสําเร็จของพรรคในการเลือกตั้ง"
 ww_BEL_event_political.3.a: "แตงตั้งผูที่มั่นคง ปอล-เอมีล ฌ็องซง จากพรรคเสรีนิยม"
 ww_BEL_event_political.3.b: "เลือกเลออน เดอเกรล จากพรรคเร็กซิสต เพื่อฟนฟูกฎหมายและระเบียบ"

  #Budgetary Crisis
 ww_BEL_event_political.4.t: "วิกฤตงบประมาณ"
 ww_BEL_event_political.4.desc: "แมจะมีสัญญาณเริ่มแรกของการฟนตัวทางเศรษฐกิจ แตเราก็ตองเผชิญวิกฤตการเงินอีกครั้ง นายกรัฐมนตรี [BEL.GetLeader] ไมสามารถผลักดันงบประมาณของ[BEL.GetHerHis]ใหผานรัฐสภาได เพราะไมอาจสรางฉันทามติกวางขวางเรื่องการปฏิรูปภาษีที่จําเปนตอการรับมือฐานะการคลังสาธารณะที่ทรุดหนักลง จนนําไปสูการลมสลายของรัฐบาลอีกครั้ง \n\nเหตุการณนี้นําไปสูการสงมอบอํานาจอยางรวดเร็วใหปอล-อ็องรี สปาก ดาวรุงของพรรคแรงงาน และนายกรัฐมนตรีสังคมนิยมคนแรกของเบลเยียม"
 ww_BEL_event_political.4.a: "หวังวานายกรัฐมนตรีสปากจะอยูไดนานกวานี้!"

  #Adriaan Martens Crisis
 ww_BEL_event_political.5.t: "วิกฤตอาดรียาน มารเตินส"
 ww_BEL_event_political.5.desc: "สิ่งที่เริ่มตนจากการแตงตั้งตามปกติไดกลายเปนวิกฤตการเมืองอีกครั้งสําหรับรัฐบาลของเรา นายกรัฐมนตรีตองแตงตั้งสมาชิกใหมของราชบัณฑิตยสถานการแพทย และเขาเสนอชื่ออาดรียาน มารเตินส ซึ่งกลายเปนตัวเลือกที่สรางขอถกเถียง เนื่องจากมารเตินสมีแนวคิดชาตินิยมเฟลมิชและเคยรวมมือกับผูยึดครองชาวเยอรมันในมหาสงคราม ตัวเลือกนี้ถูกตอตานอยางหนักจากทหารผานศึก ฝายเสรีนิยม ชาวเบลเยียมที่พูดภาษาฝรั่งเศส และแมแตพระมหากษัตริยก็ทรงแสดงความไมพอพระทัย \n\n[BEL.GetLeader] พยายามปกปองการตัดสินใจนี้ แตถูกกดดันหนักขึ้นเรื่อยๆ ฝายตรงขามเรียกรองใหจัดการเลือกตั้งกอนกําหนดเพื่อเลือกผูนําคนใหม แมสปากอาจมีทุนทางการเมืองพอจะสูเพื่อรักษาตําแหนงนี้ไว"
 ww_BEL_event_political.5.a: "นายกรัฐมนตรีควรลาออกและประกาศเลือกตั้งกอนกําหนด"
 ww_BEL_event_political.5.b: "สปากมีแรงสนับสนุนทางการเมืองพอจะรอดพนเรื่องนี้"

  #The Flemish Question
 ww_BEL_event_political.6.t: "ปญหาเฟลมิช"
 ww_BEL_event_political.6.desc: "นับตั้งแตกอตั้ง เบลเยียมเปนประเทศที่ถูกแบงแยกระหวางสองกลุมภาษา คือชาววัลลูนที่พูดภาษาฝรั่งเศส และชาวเฟลมิชที่พูดภาษาดัตช สิ่งนี้กอใหเกิดปญหามากมายภายในชาติ ตั้งแตความเขาใจผิดงายๆ ระหวางเพื่อนฝูง คําสั่งทางทหารที่ถูกปฏิบัติผิดพลาด ไปจนถึงความผิดพลาดในกระบวนการยุติธรรมเพราะจําเลยไมไดพูดภาษาเดียวกับศาลที่พิจารณาคดี\n\nถึงเวลาแลวที่จะวางความแตกแยกนี้ลงอยางถาวร และตัดสินวาจะรวมชาติของเราภายใตรูปแบบภาษากลางอยางไรดีที่สุด"
 ww_BEL_event_political.6.a: "ควรใหความสําคัญกับภาษาดัตช"
 ww_BEL_event_political.6.b: "ควรใหความสําคัญกับภาษาฝรั่งเศส"
 ww_BEL_event_political.6.c: "เบลเยียมนิยามดวยทั้งสองวัฒนธรรมอยางเทาเทียม"

  #The Snap Election
 ww_BEL_event_political.7.t: "การเลือกตั้งกอนกําหนด"
 ww_BEL_event_political.7.desc: "เมื่อวิกฤตรัฐธรรมนูญถูกควบคุมไวไดในขณะนี้ ก็ถึงเวลาทําใหรัฐบาลกลับมามีความชอบธรรมอีกครั้ง ไมเชนนั้นก็ไมตางจากผูที่เพิ่งถูกโคนลงไป ขณะนี้ปอล-อ็องรี สปาก จากพรรคสังคมนิยม และอูแบร ปแยรโล จากพรรคคาทอลิก เปนตัวเต็งในการเลือกตั้งกอนกําหนดที่อาจเกิดขึ้น"
 ww_BEL_event_political.7.a: "อูแบร ปแยรโล และพรรคคาทอลิกจะยืนหยัดตอตานผูที่คุกคามเรา"
 ww_BEL_event_political.7.b: "ปอล-อ็องรี สปาก และพรรคแรงงานจะนําเราสูอนาคตสังคมนิยมใหม"

 #Communist Language Problems
 ww_BEL_event_political.8.t: "ภาษาของประชาชน"
 ww_BEL_event_political.8.desc: "ประชาชนของเราถูกแบงแยกดวยภาษามาเปนเวลานาน ชาววัลลูนพูดภาษาฝรั่งเศส และชาวเฟลมิชพูดภาษาดัตช ซึ่งสรางรอยราวระหวางกลุมและขัดขวางไมให[ROOT.GetName]ที่เปนเอกภาพมากขึ้นไดพัฒนา เราตองตัดสินใจวาภาษาราชการของเราคืออะไร มิฉะนั้นความเขาใจผิดระหวางเพื่อนฝูง คําสั่งทางทหารที่ถูกปฏิบัติผิดพลาด และความผิดพลาดในกระบวนการยุติธรรมจะไมมีวันหมดไปจากชีวิตประจําวันของชาว[ROOT.GetAdjective]"
 ww_BEL_event_political.8.a: "ภาษาดัตชคือภาษาของเรา"
 ww_BEL_event_political.8.b: "ภาษาฝรั่งเศสคือภาษาของเรา"
 ww_BEL_event_political.8.c: "ภาษาของเราเทาเทียมกัน และเราจะรักษาไวทั้งสองภาษา!"

 ### Diplomatic Events

 #Repudiate Treaties
 ww_BEL_event_diplomatic.1.t: "[FROM.GetNameDefCap]ยกเลิกการรับประกันของเรา"
 ww_BEL_event_diplomatic.1.desc: "[FROM.GetLeader] แจงเราวาสนธิสัญญาปองกันรวมกันระหวางสองประเทศเปนโมฆะ เนื่องจากพวกเขาตองการวางตัวเปนกลางในชวงเวลาที่วุนวายนี้ แตทวาแนวทางนั้นก็ไมไดชวยอะไรพวกเขาเลยในมหาสงคราม...."
 ww_BEL_event_diplomatic.1.a: "ปลอยใหพวกเขาเดินหนาไปตามลําพัง"

 #Luxembourg Receives Ultimatum - to LUX
 ww_BEL_event_diplomatic.2.t: "[FROM.GetNameDefCap]เรียกรองใหผนวกเรา"
 ww_BEL_event_diplomatic.2.desc: "[FROM.GetLeader] อางถึงสายสัมพันธในอดีต รวมถึงมรดกและภาษาที่เรามีรวมกัน เพื่อผลักดันใหเราถูกผนวกเขากับชาติของพวกเขา"
 ww_BEL_event_diplomatic.2.a: "รวมกันเราแข็งแกรงกวา"
 ww_BEL_event_diplomatic.2.b: "ลักเซมเบิรกเปนชาติที่ภาคภูมิใจและเปนเอกราช!"

 #Luxembourg Yields - to BEL
 ww_BEL_event_diplomatic.3.t: "[FROM.GetNameDefCap]ยอมจํานน"
 ww_BEL_event_diplomatic.3.desc: "เราไดรับขาวดีเยี่ยม! ประชาชนแหง[FROM.GetNameDefCap]ไดตัดสินใจอยางชาญฉลาดวาเราแข็งแกรงกวาเมื่อรวมกัน และกําลังมีการเตรียมการบริหารดินแดนนี้ใหมแลว"
 ww_BEL_event_diplomatic.3.a: "ยอดเยี่ยม"

 #Luxembourg Resists - to BEL
 ww_BEL_event_diplomatic.4.t: "[FROM.GetNameDefCap]ตอตาน!"
 ww_BEL_event_diplomatic.4.desc: "นาเสียดายที่ดูเหมือนประชาชนแหง[FROM.GetNameDefCap]จะประเมินอํานาจอธิปไตยของตนสูงเกินจริง และเลือกปฏิเสธขอเสนอรวมชาติอันมีนํ้าใจของเรา เราจะตองแสดงใหพวกเขาเห็นถึงความแข็งแกรงของชาติเรา และนําพวกเขาเขาสูสหภาพของเราดวยกําลัง"
 ww_BEL_event_diplomatic.4.a: "พวกเขาเลือกผิดแลว"

 ##Demand Calais Events

 # To Belgium : What can we offer?
 ww_BEL_event_diplomatic.5.t: "เราควรไดกาแลมาอยางไร?"
 ww_BEL_event_diplomatic.5.desc: "เราตัดสินใจเรียกรองกาแลจากฝรั่งเศสแลว แตเรายังตองเลือกวาจะไดมาดวยวิธีใด แนนอนวากองทัพอันเกรียงไกรของเรายึดดินแดนนี้ไดไมยาก แตเราควรคํานึงถึงความเสียหายขางเคียงที่อาจเกิดขึ้น จึงอาจลองหาวิธีอื่นในการไดมา วิธีรวมดินแดนไมใชเรื่องสําคัญสําหรับเรา ขอเพียงไดสิ่งที่เปนของเราโดยชอบธรรม!"
 ww_BEL_event_diplomatic.5.a: "ขูทําสงคราม"
 ww_BEL_event_diplomatic.5.b: "แลกคองโกกับกาแล"
 ww_BEL_event_diplomatic.5.c: "ใหคาตอบแทนเปนเงิน"
 ww_BEL_event_diplomatic.5.d: "เสนอเปนพันธมิตรแลกเปลี่ยน"

 # To France : Belgium demand Calais
 ww_BEL_event_diplomatic.6.t: "เบลเยียมเรียกรองกาแล"
 ww_BEL_event_diplomatic.6.desc: "เราเพิ่งไดรับขอเรียกรองอันอวดดีจาก[BEL.GetName]ใหมอบกาแลแกพวกเขา! พวกเขาอางวาดินแดนนี้เปนสวนหนึ่งของเบลเยียมโดยชอบธรรมเพราะดัชชีเบอรกันดีในประวัติศาสตร ซึ่งพวกเขาอางวาเปนผูสืบทอดในบางรูปแบบ เอกอัครราชทูตของพวกเขาขูอยางชัดเจนวาจะใชความรุนแรงหากเราไมยอมตาม แตเมื่อรูกําลังทหารของพวกเขาแลว นี่นาจะเปนแคการขู"
 ww_BEL_event_diplomatic.6.a: "ซาเคร เบลอ! ไมมีทาง!"
 ww_BEL_event_diplomatic.6.b: "ตอนนี้เราไมอาจมีศัตรูเพิ่มอีก"

 # To France : Belgium offers Congo land for Calais
 ww_BEL_event_diplomatic.7.t: "เบลเยียมตองการแลกเปลี่ยนกาแล"
 ww_BEL_event_diplomatic.7.desc: "เราเพิ่งไดรับขอเสนอที่นาสนใจจากคณะผูแทน[BEL.GetAdjective] พวกเขาเสนอแลกเปลี่ยนดินแดน คือกาแลแลกกับคองโกสวนใหญ เราจะไดรัฐโกกียาวิลลและสแตนลียวิลลซึ่งติดกับดินแดนปจจุบันของเราในพื้นที่นั้น นักการทูตของพวกเขามีการขูแฝงอยูบางหากเราปฏิเสธขอเสนอนี้ และนี่จะเปนการขยายดินแดนในแอฟริกาของเราอยางมาก แตคุมคากับสิ่งที่ตองเสียหรือไม?"
 ww_BEL_event_diplomatic.7.a: "ไม กาแลมีคากับเรามากกวา"
 ww_BEL_event_diplomatic.7.b: "ก็ได เปนการแลกเปลี่ยนที่ยุติธรรม"

 # To France : Belgium offers payment for Calais
 ww_BEL_event_diplomatic.8.t: "เบลเยียมตองการซื้อกาแล"
 ww_BEL_event_diplomatic.8.desc: "เราเพิ่งไดรับขอเสนอที่นาสนใจจากคณะผูแทน[BEL.GetAdjective] พวกเขาแสดงความสนใจจะซื้อกาแลจากเราเพื่อ "รวมดินแดนทางประวัติศาสตรของตนกลับคืน" จํานวนเงินที่เสนอนั้นสูงทีเดียว และยอมชวยปรับปรุงเศรษฐกิจของเราไดไมนอย คําถามคือเราเชื่อหรือไมวาการเสียดินแดนนี้คุมกับราคานั้น ควรทราบดวยวานักการทูตของพวกเขาบอกเปนนัยวาความตึงเครียดจะทวีขึ้นหากเราปฏิเสธขอเสนอ"
 ww_BEL_event_diplomatic.8.a: "ไม กาแลมีคากับเรามากกวา"
 ww_BEL_event_diplomatic.8.b: "ราคาดูยุติธรรมดี!"

# To Congo : Belgium just handed land over to France
 ww_BEL_event_diplomatic.9.t: "โกกียาวิลลและสแตนลียวิลลถูกขายใหฝรั่งเศส!"
 ww_BEL_event_diplomatic.9.desc: "ผูวาการอาณานิคมของเราเพิ่งไดรับแจงวา[BEL.GetName]ไดทําขอตกลงกับ[FRA.GetName]เพื่อแลกกาแลกับรัฐของเราสองแหง คือโกกียาวิลลและสแตนลียวิลล เจาอาณานิคมยุโรปเปลี่ยนพรมแดนแอฟริกาอีกครั้งโดยไมถามความเห็นพวกเราที่อาศัยอยูที่นี่จริงๆ เลยสักนิด!"
 ww_BEL_event_diplomatic.9.a: "เราคงตองแกแผนที่... อีกแลว"

 # To Belgium : France accepted! We got the land.
 ww_BEL_event_diplomatic.10.t: "ฝรั่งเศสตอบรับ!"
 ww_BEL_event_diplomatic.10.desc: "เราไดรับขาวจากคณะผูแทนในปารีสวา[FRA.GetName]เลือกที่จะยอมรับขอเสนอของเรา และกําลังดําเนินการโอนการบริหารกาแลและดินแดนโดยรอบใหเราแลว!"
 ww_BEL_event_diplomatic.10.a: "ดินแดนอันชอบธรรมของเราไดกลับคืนมาแลว!"

 # To Belgium : France refused. Escalate?
 ww_BEL_event_diplomatic.11.t: "ความตึงเครียดเรื่องกาแลทวีขึ้น"
 ww_BEL_event_diplomatic.11.desc: "คณะผูแทนของเราในปารีสสงขาวมาวาการเจรจาเรื่องกาแลลมเหลว และเราอาจตองใชกําลังเพื่อยึดดินแดนที่เปนของเราโดยชอบธรรมนี้ เราพยายามเสนออยางมีเหตุผลแลว แตพวกเขาปฏิเสธเราทุกขั้นตอน ถึงเวลาแสดงใหพวกเขาเห็นแสนยานุภาพที่แทจริงของกองทัพ[BEL.GetAdjective]"
 ww_BEL_event_diplomatic.11.a: "ถอยออกจากปากเหว"
 ww_BEL_event_diplomatic.11.b: "ถาอยางนั้นพวกเขาก็เลือกสงคราม!" #Tool tip to say occupying Paris may be enough to force peace.

 #To ENG/FRA/SOV: Belgium requests guarantee
 ww_BEL_event_diplomatic.12.t: "[FROM.GetNameDefCap]ขอความชวยเหลือจากเรา"
 ww_BEL_event_diplomatic.12.desc: "เราเพิ่งไดรับสารจากผูนํา[FROM.GetAdjective] ขณะที่โลกรอบตัวพวกเขาเปนปฏิปกษมากขึ้นทุกที พวกเขากังวลถึงความสามารถของตนในการปกปองประเทศ ความชวยเหลือของเราจะเปนที่ซาบซึ้งยิ่ง และจะมีบทบาทสําคัญในการรักษาสันติภาพในภูมิภาค"
 ww_BEL_event_diplomatic.12.a: "เราจะชวยพวกเขา!"
 ww_BEL_event_diplomatic.12.b: "เราชวยพวกเขาไมได"

 #To Belgium: Gets guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.13.t: "[FROM.GetNameDefCap]รับประกันเอกราชของเรา"
 ww_BEL_event_diplomatic.13.desc: "เราไดรับขาวอันนายินดียิ่งจากนักการทูต[FROM.GetAdjective] พวกเขาเห็นดวยวาความปลอดภัยของเราอาจถูกคุกคาม และกองทัพของเราอาจไมพอจะปกปองเอกราชไวได ดวยเหตุนี้พวกเขาจึงใหการรับประกันตามที่เรารองขอ"
 ww_BEL_event_diplomatic.13.a: "สิ่งนี้จะทําใหเราปลอดภัย"

 #To Belgium: Does not get guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.14.t: "[FROM.GetNameDefCap]ปฏิเสธการรับประกันเรา"
 ww_BEL_event_diplomatic.14.desc: "แมจะมีภัยคุกคามตอการดํารงอยูของเราอยางชัดเจน แตผูนํา[FROM.GetAdjective]ก็ปฏิเสธคําขอการรับประกันของเรา เราพยายามเจรจาดวยเหตุผลแลว แตพวกเขาไมยอมเห็นความรายแรงของสถานการณ ดูเหมือนเราจะตองพึ่งตัวเอง"
 ww_BEL_event_diplomatic.14.a: "ชางไรมารยาทนัก!"

 #To GER/FRA/ENG: Exiled Belgium Requests equipment
 ww_BEL_event_diplomatic.15.t: "[FROM.GetNameDefCap]ขอยุทโธปกรณ"
 ww_BEL_event_diplomatic.15.desc: "เราเพิ่งไดรับคําขอจากผูนํา[FROM.GetAdjective]พลัดถิ่น พวกเขาตองการยุทโธปกรณบางสวนจากเราเพื่อฝกทหารที่ยังเหลืออยู ดวยหวังวาสักวันจะยึดบานเกิดคืนได"
 ww_BEL_event_diplomatic.15.a: "เราจะสง$infantry_equipment$ใหพวกเขา!"
 ww_BEL_event_diplomatic.15.c: "เราจะสง$support_equipment$ใหพวกเขา!"
 ww_BEL_event_diplomatic.15.b: "ความทะเยอทะยานของพวกเขานายกยอง แตเราชวยไมได"

 #To GER/FRA/ENG: Exiled Belgium Requests factories
 ww_BEL_event_diplomatic.16.t: "[FROM.GetNameDefCap]ขอใชโรงงาน"
 ww_BEL_event_diplomatic.16.desc: "เราไดรับคําขอจากผูนํา[FROM.GetAdjective]ใหใชโรงงานของเราผลิตยุทโธปกรณสําหรับทหารที่เหลืออยูของพวกเขา พวกเขาปรารถนาจะยึดบานเกิดคืน และเพื่อการนั้น ทหารของพวกเขาตองการยุทโธปกรณ"
 ww_BEL_event_diplomatic.16.a: "แนนอนวาเราจะชวย"
 ww_BEL_event_diplomatic.16.b: "เราไมมีกําลังการผลิตพอจะชวย"

 #To GER/USA/ENG: BEL requests military experience sharing
 ww_BEL_event_diplomatic.17.t: "[FROM.GetNameDefCap]เสนอแบงปนประสบการณทางทหาร"
 ww_BEL_event_diplomatic.17.desc: "รัฐบาลพลัดถิ่นของ[FROM.GetNameDef]ติดตอมาเสนอความรวมมือแบงปนประสบการณทางทหารระหวางกองทัพของเรา ซึ่งเปนประโยชนตอเราไดพอๆ กับพวกเขา"
 ww_BEL_event_diplomatic.17.a: "ความคิดที่ยอดเยี่ยม!"
 ww_BEL_event_diplomatic.17.b: "ไมคุมเวลา"

 #To BEL: Generic accept
 ww_BEL_event_diplomatic.18.t: "[FROM.GetNameDefCap]ตกลง"
 ww_BEL_event_diplomatic.18.desc: "ขอเสนอของเราเพื่อเสริมสถานะและชวยฟนฟูกองทัพสําหรับยึดบานเกิดคืนไดรับความเห็นชอบจาก[FROM.GetNameDef] แมสิ่งนี้เพียงลําพังจะแกปญหาของเราไมได แตก็จะเปนกาวสําคัญสูการไดเอกราชคืนในที่สุด"
 ww_BEL_event_diplomatic.18.a: "ขาวดี!"

 #To BEL: generic reject
 ww_BEL_event_diplomatic.19.t: "[FROM.GetNameDefCap]ปฏิเสธ"
 ww_BEL_event_diplomatic.19.desc: "ขอเสนอของเราเพื่อเสริมสถานะและชวยฟนฟูกองทัพสําหรับยึดบานเกิดคืนถูก[FROM.GetNameDef]ปฏิเสธ เราหวังวานี่จะเปนกาวสําคัญสูอนาคต แตดูเหมือนแผนนั้นจะสูญเปลาแลว"
 ww_BEL_event_diplomatic.19.a: "นาเสียดาย"

 ww_BEL_event_diplomatic.20.t: "[FROM.GetNameDefCap]เชิญเราเขารวมโครงการความรวมมือยุโรป"
 ww_BEL_event_diplomatic.20.desc: "เราไดรับคําเชิญอยางเปนทางการจาก[FROM.GetNameDef]ใหเขารวม[FROM.GetFactionName] นี่คือความริเริ่มใหมของพวกเขาเพื่อสงเสริมความรวมมือในภูมิภาค โดยหวังวาจะชวยสรางเสถียรภาพใหภูมิภาคและสงเสริมความสัมพันธทางการทูตที่ดีขึ้น"
 ww_BEL_event_diplomatic.20.a: "ความริเริ่มที่ยอดเยี่ยม!"
 ww_BEL_event_diplomatic.20.b: "ฟงดูนาสงสัย..."

 ww_BEL_event_diplomatic.21.t: "[FROM.GetNameDefCap]เขารวม[ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.21.desc: "คําเชิญของเราถึง[FROM.GetNameDef]ไดรับการตอบรับ พวกเขาเห็นดวยวาประชาคมยุโรปที่ใหญขึ้นคือหนทางที่ถูกตอง ดวยความรวมมือกัน เราจะสรางเสถียรภาพใหภูมิภาคไดอีกครั้ง"
 ww_BEL_event_diplomatic.21.a: "ขาวดี!"

 ww_BEL_event_diplomatic.22.t: "[FROM.GetNameDefCap]ปฏิเสธคําเชิญเขารวม[ROOT.GetFactionName]ของเรา"
 ww_BEL_event_diplomatic.22.desc: "นักการทูต[FROM.GetAdjective]กลับมาพรอมคําตอบที่นาผิดหวัง พวกเขาอางวาแมแนวคิดนี้อาจสูงสง แตจะตองลมเหลวอยางหลีกเลี่ยงไมได เชนเดียวกับความริเริ่มทํานองเดียวกันกอนหนานี้"
 ww_BEL_event_diplomatic.22.a: "นาเสียดายจริงๆ..."

 ww_BEL_event_diplomatic.23.t: "[FROM.GetNameDefCap]เชิญเรารวมความพยายามดานการวิจัย"
 ww_BEL_event_diplomatic.23.desc: "คณะผูแทน[FROM.GetAdjective]ไดติดตอเรามาเพื่อเสนอความพยายามดานการวิจัยรวมกันทั่วทั้ง[FROM.GetFactionName] ในฐานะพันธมิตรใกลชิด เราจําเปนตองแบงปนเทคโนโลยีระหวางกันเพื่อใหทุกคนในสหภาพกาวหนา"
 ww_BEL_event_diplomatic.23.a: "ได เราจะเขารวม"
 ww_BEL_event_diplomatic.23.b: "เทคโนโลยีของเราจะเปนของเราเทานั้น"

 ww_BEL_event_diplomatic.24.t: "[FROM.GetNameDefCap]เขารวมกลุมวิจัยสหภาพยุโรป"
 ww_BEL_event_diplomatic.24.desc: "ความริเริ่มของเราในการสรางเวทีแบงปนเทคโนโลยีระหวางพันธมิตรไดรับความเห็นชอบจาก[FROM.GetNameDef] พวกเขาเขารวมแลว และจะแบงปนความกาวหนาทางเทคโนโลยีกับเราและพันธมิตรรวม เชนเดียวกับที่เราจะแบงปนของเรากับพวกเขา"
 ww_BEL_event_diplomatic.24.a: "ยอดเยี่ยม!"

 ww_BEL_event_diplomatic.25.t: "[FROM.GetNameDefCap]ปฏิเสธการเขารวมกลุมวิจัยสหภาพยุโรป"
 ww_BEL_event_diplomatic.25.desc: "แมเราคิดวาไดนําเสนอเหตุผลที่หนักแนนเรื่องกลุมวิจัยสหภาพยุโรปตอ[FROM.GetNameDef]แลว แตพวกเขาก็ปฏิเสธที่จะเขารวม เรายังหวังวาจะไดประโยชนจากความริเริ่มนี้ แตก็ตองเปนไปโดยไมมี[FROM.GetNameDef]"
 ww_BEL_event_diplomatic.25.a: "ชางเถอะ..."

 ww_BEL_event_diplomatic.26.t: "[FROM.GetNameDefCap] ขอใหรวมเปนสหพันธแบบจํากัด"
 ww_BEL_event_diplomatic.26.desc: "เราไดรับคําขอจาก[FROM.GetNameDef] ในฐานะประธานของ[ROOT.GetFactionName] พวกเขาตระหนักวายุโรปที่มีลักษณะเปนสหพันธมากขึ้นจะชวยเสริมความพยายามดานการปองกันและการพาณิชยของกลุม จึงขอใหเราเขารวมในความพยายามนี้"
 ww_BEL_event_diplomatic.26.a: "เพื่อความรุงเรืองของ[FROM.GetFactionName]"
 ww_BEL_event_diplomatic.26.b: "ไม เราตองคํานึงถึงอธิปไตยของเรา!"
 ww_BEL_event_diplomatic.26.b_tt: "§Rพวกเขาอาจขับเราออกจากฝาย!§!"

 ww_BEL_event_diplomatic.27.t: "[FROM.GetNameDefCap] ยอมรับการรวมเปนสหพันธแบบจํากัด"
 ww_BEL_event_diplomatic.27.desc: "[FROM.GetNameDefCap] ไดอนุมัติคําขอของเราใหผูกพันตนเองใกลชิดกับ[FROM.GetFactionName]มากขึ้น เราจะไดรับอํานาจบางสวนเหนือนโยบายตางประเทศของพวกเขา และการคาระหวางพวกเราทั้งหมดจะงายขึ้น"
 ww_BEL_event_diplomatic.27.a: "ยอดเยี่ยม!"

 ww_BEL_event_diplomatic.28.t: "[FROM.GetNameDefCap] ปฏิเสธการรวมเปนสหพันธแบบจํากัด"
 ww_BEL_event_diplomatic.28.desc: "แมจะมีขอดีที่เห็นไดชัด แต[FROM.GetNameDef]กลับเลือกที่จะไมเขารวมแนวคิดยุโรปแบบสหพันธของเรา พวกเขาอางวาอธิปไตยของตนสําคัญเหนือความผาสุกของ$EU_tech_sharing_group_name$ทั้งหมด ซึ่งเปนความรูสึกที่นากังวลไมนอยเมื่อมาจากภายในสหภาพเอง"
 ww_BEL_event_diplomatic.28.a: "นั่นนากังวลมาก"
 ww_BEL_event_diplomatic.28.b: "พวกเขาเปนภัยตอเราทุกคน!"

 ww_BEL_event_diplomatic.29.t: "ออทโท ฟอน ฮาพสบวรค เสนอใหการสนับสนุน"
 ww_BEL_event_diplomatic.29.desc: "เราไดรับขอเสนอการสนับสนุนจากบุคคลที่เราคอนขางประหลาดใจที่จะไดยินขาว ออทโท ฟอน ฮาพสบวรค อาจเปนรัชทายาทของจักรพรรดิคารลที่ 1 แหงออสเตรีย พระมหากษัตริยแหงฮังการีและโครเอเชีย แตดูเหมือนวาตางจากพระบิดา ออทโทมีแนวโนมสนับสนุนความรวมมือภายในยุโรปมากกวา เขาชื่นชมความพยายามของเราและเสนอความชวยเหลือดานการทูต เครือขายการทูตที่กวางขวางของเขาอาจเปนประโยชนตอเรา และเขายินดีที่จะมอบความชวยเหลือนี้ให"
 ww_BEL_event_diplomatic.29.a: "เปนเกียรติอยางยิ่งที่ไดเขามารวมทาง"
 ww_BEL_event_diplomatic.29.b: "ราชวงศฮาพสบวรคควรเปนเพียงอดีต"

 ww_BEL_event_diplomatic.30.t: "[FROM.GetNameDefCap] ขอเขารวม[ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.30.desc: "หลังจากการตัดสินใจของฝาย[FROM.GetAdjective]ที่จะลมเลิกความมุงหมายในการเปนกลาง ผูนําของ[FROM.GetNameDef]ก็ไดเขามาใกลชิดกับวาระทางการเมืองของเรามากยิ่งขึ้น บัดนี้พวกเขาไดติดตอมาพรอมคําขอเขารวม[ROOT.GetFactionName]อยางเปนทางการ ความชวยเหลือของพวกเขาอาจเปนประโยชน เปดทางใหมใหเราวางยุทธศาสตรสําหรับการขยายอํานาจในอนาคต"
 ww_BEL_event_diplomatic.30.a: "ยินดีตอนรับพวกเขา"
 ww_BEL_event_diplomatic.30.b: "เราไมตองการพวกเขา"

 ww_BEL_event_diplomatic.31.t: "[FROM.GetNameDefCap] รับเราเขาสู[FROM.GetFactionName]"
 ww_BEL_event_diplomatic.31.desc: "[FROM.GetLeader] ผูนํา[FROM.GetAdjective] ไดติดตอมาเพื่อตอนรับเราเขาสู[FROM.GetFactionName] นับจากนี้เราจะสูเคียงบาเคียงไหลกันตอภัยคุกคามรวม ยุคแหงความเปนกลางของเราสิ้นสุดลงแลว!"
 ww_BEL_event_diplomatic.31.a: "ขาวดี"

 ww_BEL_event_diplomatic.32.t: "[FROM.GetNameDefCap] ปฏิเสธการเปนสมาชิก[FROM.GetFactionName]ของเรา"
 ww_BEL_event_diplomatic.32.desc: "แมจะมีประโยชนที่เห็นไดชัด [FROM.GetLeader] ผูนํา[FROM.GetAdjective] ก็ปฏิเสธไมรับเราเปนสมาชิกของ[FROM.GetFactionName] เราสามารถมอบสิ่งตาง ๆ ไดมากมาย แตเมื่อพิจารณาจากคําตอบนี้ เราควรทบทวนความทะเยอทะยานที่จะเขารวมกับพวกเขาใหม ทั้งในตอนนี้และในอนาคต"
 ww_BEL_event_diplomatic.32.a: "เราสรางสิ่งที่ดีกวาได!"
 BEL_tried_to_join_the_axis_flag: "เคยพยายามเขารวม[GER.GetFactionName]แลว"

 ww_BEL_event_diplomatic.33.t: "อนาคตของความเปนกลางของ[ROOT.GetAdjective]"
 ww_BEL_event_diplomatic.33.desc: "ความเปนกลางรับใชประเทศของเรามาเปนอยางดี แตการคงความเปนกลางตอไปอาจทําใหผูอื่นมองเราเปนเพียงผูดูอยูเฉย ๆ และเปนเปาหมาย เราตองพิจารณาอนาคตของนโยบายตางประเทศและจุดยืนตอการตอสูดวยอาวุธอยางรอบคอบ เพราะดูเหมือนวาความขัดแยงอาจลามมาถึงเราในอนาคตอันใกล"
 ww_BEL_event_diplomatic.33.a: "เราตองสลัดพันธนาการและเตรียมพรอม!"
 ww_BEL_event_diplomatic.33.b: "ตองรักษาความเปนกลางไว!"

 ww_BEL_event_diplomatic.34.t: "[FRA.GetNameDefCap]: มิตรหรือศัตรู?"
 ww_BEL_event_diplomatic.34.desc: "ไมวาเราจะมีอาวุธพรอมเพียงใด เราก็ตองยอมรับความจริงวาเพื่อนบานทางใตของเรานาจะมีศักยภาพมากกวาเราเสมอ เราตองตกลงใหไดวาจะมองพวกเขาเปนมิตรหรือศัตรู?"
 ww_BEL_event_diplomatic.34.a: "ชาว[FRA.GetAdjective]คือมิตรของเรา"
 ww_BEL_event_diplomatic.34.b: "ชาว[FRA.GetAdjective]ไวใจไมได!"

 ww_BEL_event_diplomatic.35.t: "[FROM.GetNameDefCap] ติดตอมาหาเรา"
 ww_BEL_event_diplomatic.35.desc: "เพื่อนบานทางเหนือของเราไดติดตอมา พวกเขาตองการสรางความสัมพันธทางการทูตที่จริงจังยิ่งขึ้นกับเรา ขอเสนอของพวกเขาอาจเปนประโยชนตอทั้งสองฝาย แตเราก็ยังตองแนใจวาจะเลือกทางที่ถูกตองในเรื่องนี้"
 ww_BEL_event_diplomatic.35.a: "แนนอนอยูแลว!"
 ww_BEL_event_diplomatic.35.b: "ไม เราไมเห็นประโยชนของเรื่องนี้"

 ww_BEL_event_diplomatic.36.t: "ฝาย[FROM.GetAdjective]เห็นดวย"
 ww_BEL_event_diplomatic.36.desc: "ผูนําของ[FROM.GetNameDef]เห็นพองวาทั้งสองฝายอาจไดประโยชนจากการกระชับความสัมพันธทางการทูต เราสามารถพึ่งพาพวกเขาในฐานะมิตรและพันธมิตรในโลกที่เปนปฏิปกษมากขึ้นทุกขณะนี้"
 ww_BEL_event_diplomatic.36.a: "ยอดเยี่ยม!"

 ww_BEL_event_diplomatic.37.t: "ฝาย[FROM.GetAdjective]ไมเห็นดวย"
 ww_BEL_event_diplomatic.37.desc: "แมจะมีประโยชนที่เห็นไดชัดตอทั้งสองฝาย แตดูเหมือนวาชาว[FROM.GetAdjective]ไมตองการสานความสัมพันธทางการทูตกับเราเกินกวาที่มีอยูแลว เราตั้งความหวังไวสูง แตดูเหมือนพวกเขาจะไมไดคิดเชนเดียวกัน"
 ww_BEL_event_diplomatic.37.a: "นาเสียดาย..."


 ### War Events

 #Relocate Air Industries
 ww_BEL_event_war.1.t: "อุตสาหกรรมอากาศยานที่ยายฐานเริ่มดําเนินการแลว"
 ww_BEL_event_war.1.desc: "วิสัยทัศนของเราในการสรางสายสัมพันธการทํางานที่ดีกับบริษัทอุตสาหกรรมตางชาติไดผลตอบแทนแลว โรงงานของพวกเขาพรอมเริ่มการผลิตไดทันที"
 ww_BEL_event_war.1.a: "นี่แหละคือเหตุผลที่เราวางแผนลวงหนา!"

 ### King's Surrender Chain

 #Unknown Sympathies
 ww_BEL_event_war.2.t: "ความฝกใฝที่ไมอาจรูได"
 ww_BEL_event_war.2.desc: "พระเจาเลโอโปลดที่ 3 ทรงอยูภายใตเงาของพระราชบิดา พระเจาอาลแบร กษัตริยนักรบผูมีชื่อเสียงจากการรักษาเบลเยียมไวในมหาสงคราม และขัดขวางไมใหจักรวรรดิเยอรมันไดชัยชนะ แมในระหวางนั้นประเทศจะกลายเปนสมรภูมิ แตเกียรติภูมิทางทหารของชาติก็ไรมลทิน และชื่อเสียงของเบลเยียมก็สูงสงขึ้นบนเวทีโลก \n\nบัดนี้ เมื่อเบลเยียมเขาสูสงครามอีกครั้ง บททดสอบที่แทจริงตอพระอุปนิสัยของเลโอโปลดจะเริ่มขึ้น และมีเสียงซุบซิบที่ทําใหเรากังวลแลว \n\nดวยขออางวาตองการรักษาชีวิตประชาชนของพระองค พระมหากษัตริยไดเริ่มหยั่งเชิงเพื่อสันติภาพแลว และเราสงสัยวาหากบรัสเซลส ลีแยฌ หรือแอนตเวิรปแตก พระองคอาจยอมจํานนกอนเวลาอันควร โดยไมคํานึงถึงเจตจํานงแบบประชาธิปไตยของประชาชนที่ตองการสูตอ"
 ww_BEL_event_war.2.a: "พระเจาเลโอโปลดจะทรงนําเราสูชัยชนะ"
 BEL_unknown_sympathies_tt: "§Rพระเจาเลโอโปลดจะทรงยอมจํานนหากเราเสียลีแยฌ แอนตเวิรป หรือบรัสเซลสแหงใดแหงหนึ่ง เมื่อถึงเวลานั้นคุณอาจยังมีทางเลือกอยูบาง§!"

 #The King's Surrender
 ww_BEL_event_war.3.t: "การยอมจํานนของพระมหากษัตริย"
 ww_BEL_event_war.3.desc: "พระมหากษัตริยในฐานะจอมทัพแหงกองทัพ ไดทรงเสนอการยอมจํานนอยางไมมีเงื่อนไขของ[BEL.GetName]ในวันนี้ โดยไมรอการใหสัตยาบันจากรัฐสภา[BEL.GetAdjective] ตามหลักแลว ในฐานะจอมทัพ พระองคมีอํานาจยอมจํานนกองทัพได แตไมใชตัวประเทศเอง \n\nรัฐสภาพลเรือนไดลี้ภัยออกนอกประเทศไปแลว และแสดงเจตนาชัดเจนที่จะทําสงครามตอโดยใชทรัพยากรทั้งหมดของจักรวรรดิ[BEL.GetAdjective]"
 ww_BEL_event_war.3.a: "นี่คือพระราชประสงค!"
 ww_BEL_event_war.3.b: "สูตอไป!"
 ww_BEL_event_war.3.c: "พระองคไมมีสิทธิ์! กักบริเวณพระมหากษัตริยไวในพระตําหนัก"

 #Royal Prisoner
 ww_BEL_event_war.4.t: "นักโทษในราชวงศ"
 ww_BEL_event_war.4.desc: "หลังจากการทรยศดวยการมอบชาติใหแกผูรุกราน พระมหากษัตริยไดถูกกักบริเวณ และถูกถอดจากตําแหนงจอมทัพ ถูกถอดฐานันดรศักดิ์ และแนนอนวาถูกถอดจากราชบัลลังก อยางไรก็ตาม ประชาชนยังตองการผูปกครอง และเปนหนาที่ของเราที่จะเลือกวาใครควรเปนผูสําเร็จราชการจนกวาพระราชโอรสจะทรงเจริญพระชนมพรรษาพอจะขึ้นครองราชย มีสองทางเลือก: \n\nทางแรกคือ เลออง เดอแกรล นายกรัฐมนตรีและผูนําประชาชนที่ไดรับการแตงตั้งโดยชอบดวยกฎหมาย อีกทางหนึ่งคือ เจาชายชารลส เคานตแหงฟลานเดอรส พระอนุชาของเลโอโปลด ซึ่งจะมอบความชอบธรรมและความตอเนื่องของราชบัลลังก"
 ww_BEL_event_war.4.a: "แตงตั้งเลออง เดอแกรลเปนผูสําเร็จราชการคนใหม"
 ww_BEL_event_war.4.b: "รักษาสายสืบสันตติวงศอันชอบธรรมดวยเจาชายชารลส"

 #The King's Surrender - Triggered via capitulation rather than event
 ww_BEL_event_war.5.t: "การยอมจํานนของพระมหากษัตริย"
 ww_BEL_event_war.5.desc: "หลังจากการปองกันชาติอยางหาวหาญ พระเจาเลโอโปลดที่ 3 ก็ทรงเสนอการยอมจํานนของ[BEL.GetName]ในที่สุด และรัฐบาลของเราถูกบีบใหลี้ภัย เลโอโปลดทรงเลือกที่จะประทับอยูกับประชาชน และกลายเปนนักโทษในพระตําหนักของพระองคเอง เรายังพึ่งพาไมตรีของพันธมิตรและทรัพยากรของจักรวรรดิ[BEL.GetAdjective]ได และเมื่อถึงเวลาก็จะกอบกูมาตุภูมิคืนมา"
 ww_BEL_event_war.5.a: "อนาคตยังไมแนนอน"

 ## King's Surrender Chain Ends

 # Belgium demands special treatment (-_-)ゞ゛ - Event for any occupier of Belgium 
 ww_BEL_event_war.6.t: "เลขาธิการใหญ"
 ww_BEL_event_war.6.desc: "กลุมขาราชการพลเรือนชาวเบลเยียมไดเขามาหาเราพรอมขอเสนอ ใหพวกเขาทํางานในตําแหนงราชการตอไป แลวพวกเขาจะดูแลใหการปกครองสวนทองถิ่นดําเนินไปอยางราบรื่นในชวงเปลี่ยนผานนี้ รัฐบาลเบลเยียมไดออกกฎหมายใหการรวมมือกับเราเปนเรื่องถูกกฎหมาย เพื่อลดผลกระทบของการยึดครองตอประชาชน ถึงขั้นอนุญาตใหธนาคารเบลเยียมจายคาจางแกผูบริหารเหลานี้ตอไป นี่เปนโอกาสที่เราจะแสดงความเต็มใจทํางานรวมกับคนทองถิ่น และจะชวยบรรเทาการตอตานในภูมิภาคไดระดับหนึ่ง"
 ww_BEL_event_war.6.a: "เปนความริเริ่มที่ดี รวมมือกับพวกเขาเพื่อใหการยึดครองราบรื่น"
 ww_BEL_event_war.6.b: "เปนแนวคิดที่นาสนใจ เราจะพิจารณาขอเสนอของพวกเขา"
 ww_BEL_event_war.6.c: "นี่เปนแคขออางใหการตอตานดูชอบธรรม ไม"

 BEL_set_secretaries_general_tt: "§Yเลขาธิการใหญ§! จะถูกใชเปน§Yกฎหมายการยึดครอง§!ทั่วเบลเยียม"
 BEL_available_secretaries_general_tt: "§Yเลขาธิการใหญ§! สามารถใชเปน§Yกฎหมายการยึดครอง§!ในเบลเยียมไดแลว"
 BEL_no_secretaries_general_tt: "§Yเลขาธิการใหญ§! จะถูกนําออกจาก§Yกฎหมายการยึดครอง§!ในเบลเยียม"
 BEL_remove_secretaries_general_civs_tt: "ลบ§Yโรงงานพลเรือนนอกแผนที่§! 2 แหง"

## France Limited War

 # To Belgium: Inform Belgium of Limited War goals
 ww_BEL_event_war.7.t: "สงครามจํากัดที่อาจเกิดขึ้น - ปารีสตองแตก!"
 ww_BEL_event_war.7.desc: "นักการทูตและนายพลระดับสูงของเราเพิ่งประชุมกัน และแนะนําวาหากความขัดแยงนี้ยังคงจํากัดขอบเขต กลาวคือไมมีมหาอํานาจอื่นเขามาเกี่ยวของ เราอาจบีบให[FRA.GetName]มาเจรจาและไดขอตกลงสันติภาพอยางรวดเร็ว เรารูวาพวกเขากลัวความตึงเครียดที่เพิ่มขึ้น และเชนเดียวกับเรา ไมตองการถูกลากเขาสูความขัดแยงระดับโลกอีกครั้ง \n\nดวยเหตุนี้ เราจึงคํานวณวาหากปารีสแตก นั่นจะเปนการแสดงศักยภาพของเราที่มากพอใหพวกเขายอมเจรจาโอนกาเลสที่เปนขอพิพาทให"
 ww_BEL_event_war.7.a: "อีกไมนานกองทัพของเราจะเดินสวนสนามบนถนนในปารีส!"

 # To France: Paris has fallen! Sue for peace?
 ww_BEL_event_war.8.t: "ปารีสแตกแลว!"
 ww_BEL_event_war.8.desc: "หายนะแหงชาติ ปารีสเมืองหลวงอันภาคภูมิของเราแตกแลว! อีกครั้งที่กองทัพของเราแสดงใหเห็นวาไมเพียงพอตอหนาศัตรูที่ดอยกวาอยางชัดเจน ชาว[FROM.GetAdjective]เสนอจะถอนทหารและละเวนสวนที่เหลือของประเทศ แตแลกกับการที่เราตองยกกาเลสใหพวกเขา \n\nเรารูสึกไดวาเหลาแรงกําลังวนเวียนอยูแลว และการนี้จะใหเวลาเรานําบทเรียนที่ไดรับไปเตรียมรับศัตรูที่ใหญกวาในอนาคต"
 ww_BEL_event_war.8.a: "ยกกาเลสแลกสันติภาพ"
 ww_BEL_event_war.8.b: "สูตอไป! สงครามนี้ยังไมจบ"

 # To Belgium: Accept peace offer?
 ww_BEL_event_war.9.t: "ฝรั่งเศสยอมรับสันติภาพ"
 ww_BEL_event_war.9.desc: "วันนี้ เราไดตอนรับคณะผูแทนฝรั่งเศสที่มาเจรจายุติความขัดแยงอยางสันติหลังจากเมืองหลวงของพวกเขาแตก หลังจากการหารือหลายรอบ พวกเขาตกลงเสนอกาเลสใหเราแลกกับการยุติการสูรบทันที \n\nพึงสังเกตวานี่เปนขอเสนอเพียงครั้งเดียว และหากเราปฏิเสธ พวกเขาจะตั้งรับอยางแนวแนยิ่งขึ้น และไมนาจะเสนออีก"
 ww_BEL_event_war.9.a: "เรายอมรับ! กาเลสแลกสันติภาพ"
 ww_BEL_event_war.9.b: "สูตอไป! เรายึดไดมากกวานี้"

 ww_BEL_event_war.10.t: "ปารีสอยูภายใตการควบคุมของ[ROOT.GetAdjective]"
 ww_BEL_event_war.10.desc: "เปาหมายที่วางไวในการหารือชวงแรกของสงครามกับ[FRA.GetAdjective]บรรลุแลว ปารีสอยูในการควบคุมของเรา จึงอาจคาดไดวาชาว[FRA.GetAdjective]ตึงเครียดมากพอที่ขอเสนอถอนทหารแลกกับกาเลสจะไดรับการยอมรับอยางไมเต็มใจ\n\nขณะเดียวกันก็มีเสียงดังขึ้นวา เรามาไกลถึงขนาดนี้แลว และชาว[FRA.GetAdjective]ก็หยุดเราไมไดอยางชัดเจน จะหยุดตอนนี้ทําไม?"
 ww_BEL_event_war.10.a: "เราไดสิ่งที่ตองการแลว เจรจาสันติภาพ!"
 ww_BEL_event_war.10.b: "เราตองการทั้งหมด!"

 ### King's Surrender Chain End

 ### Spanish Civil War Interaction Events ###

 ww_BEL_event_spanish_interaction.1.t: "[FROM.GetNameDefCap] สงยุทโธปกรณมาให"
 ww_BEL_event_spanish_interaction.1.desc: "เราไดรับปนไรเฟลล็อตหนึ่งจากรัฐบาล[FROM.GetAdjective] พวกเขามีความรูสึกเดียวกับเราวาฝายชาตินิยมตองถูกหยุดยั้ง และตองการชวยการตอสูของเรา ไมใชแคดวยคําพูด"
 ww_BEL_event_spanish_interaction.1.a: "เราจะใชมันใหคุมคา!"

 ww_BEL_event_spanish_interaction.2.t: "สงยุทโธปกรณเพิ่มเติมใหฝายสาธารณรัฐ[SPR.GetAdjective]"
 ww_BEL_event_spanish_interaction.2.desc: "การสงยุทโธปกรณครั้งกอนให[SPR.GetAdjective]เปนประโยชนอยางมากตอมิตรฝายสาธารณรัฐของเรา แตการตอสูของพวกเขายังอีกยาวไกล และเรานาจะสงยุทโธปกรณเพิ่มใหไดอีก"
 ww_BEL_event_spanish_interaction.2.a: "สงปนไรเฟลเพิ่ม!"
 ww_BEL_event_spanish_interaction.2.b: "พวกเขาตองการยุทโธปกรณสนับสนุน!"
 ww_BEL_event_spanish_interaction.2.c: "สงปนใหญไปให!"

 ww_BEL_event_spanish_interaction.3.t: "[FROM.GetNameDefCap] สงยุทโธปกรณมาเพิ่ม"
 ww_BEL_event_spanish_interaction.3.desc: "เราไดรับยุทโธปกรณ[FROM.GetAdjective]อีกล็อตหนึ่ง การสนับสนุนของพวกเขาจะชวยเราไดมากในการตอสูขับไลภัยรายชาตินิยมที่กําลังยํ่ายีมาตุภูมิของเรา"
 ww_BEL_event_spanish_interaction.3.a: "ยอดเยี่ยม!"

 ww_BEL_event_spanish_interaction.4.t: "สุนทรพจนของ[FROM.GetAdjective]เพื่อสนับสนุนการตอสูของเรา"
 ww_BEL_event_spanish_interaction.4.desc: "เราไดรับแจงวาเมื่อไมกี่ชั่วโมงกอนมีการชุมนุมและสุนทรพจนเพื่อสนับสนุนเราใน[FROM.GetNameDef] ผูนํา[FROM.GetAdjective]ยํ้าการสนับสนุนตอเราอีกครั้ง โดยหวังวาจะเปดชองใหเราดําเนินการไดมากขึ้นเมื่อประชาชนมีศรัทธาในตัวเรามากขึ้น"
 ww_BEL_event_spanish_interaction.4.a: "สงคําขอบคุณถึงชาว[FROM.GetAdjective]!"

 ww_BEL_event_spanish_interaction.5.t: "การสงเสริมการอพยพของชาว[FROM.GetAdjective]"
 ww_BEL_event_spanish_interaction.5.desc: "ไมนานมานี้ เราพบวาพลเมือง[FROM.GetAdjective]อพยพเขามามากขึ้น ผูอพยพจํานวนมากแสดงความเต็มใจที่จะเขารวมกองทัพของเราหากเราตองการความชวยเหลือ คาดไดเพียงวานี่เปนความพยายามโดยเจตนาของชาว[FROM.GetAdjective]"
 ww_BEL_event_spanish_interaction.5.a: "ขาวดี!"

 ww_BEL_event_spanish_interaction.6.t: "[FROM.GetNameDefCap] เสนอเปนพันธมิตร"
 ww_BEL_event_spanish_interaction.6.desc: "ชาว[FROM.GetAdjective]ซึ่งเคยเปนกลางอยางยิ่งไดสงขอเสนอที่นาประหลาดใจมาใหเรา พวกเขาตองการเปนพันธมิตรกับเรา โดยหวังวาจะชวยใหพวกเขาสนับสนุนการตอสูของเรากับฝายชาตินิยมไดดียิ่งขึ้น"
 ww_BEL_event_spanish_interaction.6.a: "ความคิดที่ยอดเยี่ยม!"
 ww_BEL_event_spanish_interaction.6.b: "เราขอบคุณการสนับสนุนของพวกเขา แตไม"

 ww_BEL_event_spanish_interaction.7.t: "[FROM.GetNameDef] เขารวม[ROOT.GetFactionName]"
 ww_BEL_event_spanish_interaction.7.desc: "ชาว[FROM.GetAdjective]ตอบรับขอเสนอของเราในการกอตั้ง[ROOT.GetFactionName]แลว เราจะยืนหยัดรวมกันตอตานภัยคุกคามจากฝายชาตินิยม!"
 ww_BEL_event_spanish_interaction.7.a: "เดินหนา!"

 ww_BEL_event_spanish_interaction.8.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอเปนพันธมิตรของเรา"
 ww_BEL_event_spanish_interaction.8.desc: "เมื่อพิจารณาถึงการสนับสนุนที่เรามอบใหชาว[FROM.GetAdjective]มาโดยตลอด เราหวังวาขอเสนอของเราจะไดรับการตอบรับในทางบวก แตดูเหมือนจะไมเปนเชนนั้น เพราะพวกเขาปฏิเสธขอเสนอของเรา โดยบอกวายินดีรับความชวยเหลือ แตไมตองการเปนพันธมิตร"
 ww_BEL_event_spanish_interaction.8.a: "ชางหยาบคายนัก!"

 ww_BEL_event_spanish_interaction.9.t: "[FROM.GetNameDefCap] ยุบ$BEL_SPR_alliance$"
 ww_BEL_event_spanish_interaction.9.desc: "เมื่อสงครามกลางเมืองของเราสิ้นสุดลง ฝาย[FROM.GetAdjective]ตัดสินใจวาถึงเวลายุติความเปนหุนสวนของเราแลว แมจะเปนการยุติพันธมิตรในตอนนี้ แตพวกเขายํ้าหนักแนนวาไมไดหมายความวาเราจะไมไดเปนพันธมิตรกันอีก"
 ww_BEL_event_spanish_interaction.9.a: "นาเสียดายจริง ๆ"

 ww_BEL_event_misc.1.t: "เจานายสิ้นชีพแลว"
 ww_BEL_event_misc.1.desc: "เอมีล ว็องแดรแวลด ฉายา 'เลอ ปาทรง' (เจานาย) นักการเมืองสังคมนิยมผูครํ่าหวอดและนายกรัฐมนตรีแหง[BEL.GetName] ไดถึงแกกรรมแลว เขาเปนที่รูจักในฐานะสมาชิกคณะผูแทนเบลเยียมในการประชุมสันติภาพปารีสที่ยุติมหาสงคราม และกลายเปนผูตอตานลัทธิฟาสซิสตอยางแข็งขัน ถึงขั้นสนับสนุนใหแทรกแซงสงครามกลางเมืองสเปนโดยตรงเขาขางฝายสาธารณรัฐ \n\nอ็องรี เดอ มัน ไดขึ้นดํารงตําแหนงนายกรัฐมนตรีคนใหม และจะเขาพิธีสาบานตนตอพระมหากษัตริยในวันนี้"
 ww_BEL_event_misc.1.a: "ผูสืบทอดของเขาคือคนที่จะทํางานนี้ใหสําเร็จ!"

 ww_BEL_event_misc.3.t: "ค็อกเคอริล: หัวใจแหงการผลิตของเบลเยียม"
 ww_BEL_event_misc.3.desc: "ค็อกเคอริลคือบริษัทที่อยูใจกลางภาคการผลิตของเบลเยียม ตลอดประวัติศาสตร บริษัทไมเพียงผลิตเหล็กและเหล็กกลา แตยังผลิตเครื่องจักรวิศวกรรมชั้นเยี่ยม ทั้งเครื่องจักรไอนํ้า รถไฟ และแมแตเรือประจัญบาน บริษัทสรางชื่อเสียงอันโดดเดนและกาวขึ้นเปนกําลังสําคัญของอุตสาหกรรมเหล็กกลาในยุโรปตะวันตก \n\nอดอลฟ แกรนเนอร ผูอํานวยการใหญ พรอมดวยผูบริหารคนอื่น ๆ ยังคงประจําตําแหนงตลอดการลอมลีแยฌในมหาสงคราม เพื่อใหคนงานยังมีงานทํานานที่สุดเทาที่ทําได เมื่อถูกยึดครอง บริษัทปฏิเสธที่จะผลิตใหกองกําลังยึดครอง จึงถูกริบอุปกรณแปรรูปเหล็กกลาหนักไปเกือบทั้งหมด \n\nนับแตนั้นบริษัทไดฟนตัวในชวงระหวางสงคราม และยังคงเปนกิจการอุตสาหกรรมชั้นนํา"
 ww_BEL_event_misc.3.a: "พวกเขานาจะเปนผูสรางเครื่องยนตของเศรษฐกิจเราเลยทีเดียว!"

 ### Congolese events ###

 ww_congo.1.t: "เบลเยียมลงทุนในการพัฒนาของเรา"
 ww_congo.1.desc: "สํานักงานอาณานิคมเบลเยียมไดผานรางกฎหมายในวันนี้ เพื่อจัดสรรทรัพยากรจํานวนมากขึ้นใหแกการพัฒนาอุตสาหกรรมของเรา และไดเริ่มกอสรางโรงงานอุตสาหกรรมใน[295.GetName]แลว"
 ww_congo.1.a: "ประโยชนมหาศาล"

 ww_congo.4.t: "ราอูล ฟาน โอเฟอรสตราเทน กลับเบลเยียม"
 ww_congo.4.desc: "ราอูล ฟาน โอเฟอรสตราเทน นายทหารเบลเยียมผูรับใชชาติของเรามาจนกระทั่งไมนานนี้ ไดตัดสินใจเดินทางกลับบานที่ยุโรปแผนดินใหญหลังทราบขาวเอกราชครั้งใหมของเรา เราไมตองการชาวยุโรปอยางเขาอีกตอไป และการสูญเสียนี้จะยิ่งทําใหเราแข็งแกรงขึ้นอยางแนนอน"
 ww_congo.4.a: "ไปใหพน จักรวรรดินิยม!"

 ww_congo.5.t: "[COG.GetLeader] ตองการเพิ่มการผลิตอาหารในคองโก"
 ww_congo.5.desc: "[COG.GetLeader] ผูวาการของเราในคองโก แสดงความประสงคที่จะเพิ่มการผลิตอาหารโดยลดการผลิตเหมืองแร เปนสวนหนึ่งของความพยายาม 'ยกระดับสภาพสังคมของประชากรในอาณานิคม' แมจะกระทบความสามารถทํากําไรของอาณานิคมในระยะสั้นแนนอน แตแทบจะแนใจไดวาจะชวยในระยะยาว"
 ww_congo.5.a: "นั่นจะทําใหกําไรลดลง!"
 ww_congo.5.b: "ถาเขาคิดวาดีที่สุดก็ตามนั้น..."
 CONGO_refused_increased_food_production: "เจาอาณานิคมปฏิเสธแผนเพิ่มการผลิตอาหารของเรา"
 CONGO_accepted_increased_food_production: "เจาอาณานิคมอนุมัติแผนเพิ่มการผลิตอาหารของเรา"

 ww_congo.6.t: "ชาว[BEL.GetAdjective]ปฏิเสธแผนการผลิตอาหารของเรา"
 ww_congo.6.desc: "ฝายบริหารอาณานิคมใน[BEL.GetNameDef]ไดปฏิเสธคําขอของเราที่จะเพิ่มการผลิตอาหารโดยลดการผลิตเหมืองแร โดยมีเปาหมาย 'ยกระดับสภาพสังคมของประชากรในอาณานิคม'"
 ww_congo.6.a: "ก็คาดไวอยูแลว"

 ww_congo.7.t: "ชาว[BEL.GetAdjective]อนุมัติแผนการผลิตอาหารของเรา"
 ww_congo.7.desc: "ฝายบริหารอาณานิคมใน[BEL.GetNameDef]ไดอนุมัติคําขอของเราที่จะเพิ่มการผลิตอาหารโดยลดการผลิตเหมืองแร โดยมีเปาหมาย 'ยกระดับสภาพสังคมของประชากรในอาณานิคม'"
 ww_congo.7.a: "ยอดเยี่ยม!"

 ww_congo.8.t: "การถือกําเนิดของชนชั้นกลางใหม"
 ww_congo.8.desc: "ชาวคองโกจํานวนมากขึ้นเรื่อย ๆ มีความรูภาษาฝรั่งเศสดี นับถือศาสนาคริสต และไดรับการศึกษาสูงกวาระดับประถม ผูบริหารอาณานิคมเริ่มเรียกพวกเขาวา เอโวลูเอ หรือผูที่รับวัฒนธรรมยุโรป แมพวกเขาจะยังถูกจํากัดวาจะกาวหนาในสังคมของเราไดแคไหนตามขอกําหนดของการปกครองอาณานิคม แตประชากรที่มีการศึกษามากขึ้นยอมนําความรุงเรืองมาสูชาติของเราสักวันหนึ่ง"
 ww_congo.8.a: "เราคงตองรอดูวาจะพัฒนาไปอยางไร"
 evolue_will_start_attempting_to_enter_politics_tt: "เหลาเอโวลูเอจะเริ่มพยายามเขาสูการเมือง ทําใหมี§Yที่ปรึกษาทางการเมือง§!ใหม ๆ มากมายใหเลือก"
 evolue_have_entered_politics: "§Yผูสนับสนุนเอกราช§!และ§Yนักคิดทางการเมืองชาวคองโก§!หลายคนจะพรอมใหแตงตั้งเปน§Yที่ปรึกษาทางการเมือง§!"

 ww_congo.9.t: "เหลาเอโวลูเอเริ่มเขาสูการเมือง[ROOT.GetAdjective]"
 ww_congo.9.desc: "ดวยชนชั้นกลางที่เติบโตขึ้นและผูคนจํานวนมากในเขตเมืองที่ไดรับการศึกษาสูงกวาระดับประถม ชาว[COG.GetAdjective]จํานวนมากเริ่มอานงานของนักทฤษฎีการเมือง และนักการเมืองกับผูสนับสนุนเอกราชหนาใหมจํานวนมากเริ่มกาวเขาสูเวที นี่คือรุงอรุณใหมของชาติ[COG.GetAdjective]!"
 ww_congo.9.a: "คนเหลานี้จะนําชาติของเราสูเอกราชอยางแนนอน"

 ww_congo.10.t: "[FROM.GetNameDefCap] เรียกรอง[772.GetName]"
 ww_congo.10.d: "กองกําลังคองโกตั้งประจําตามแนวชายแดนอาณานิคมของเราใน[772.GetName] และเรียกรองสิทธิ์เขาถึงฐานทัพและสิ่งอํานวยความสะดวกของเราทั้งหมด! หากเรายอมตาม ก็เทากับยกการควบคุม[772.GetName]ใหพวกเขา แตในอีกดาน เราก็ไมมีกําลังพอจะสูกับพวกเขาในเรื่องนี้"
 ww_congo.10.a: "เราไมมีทางเลือกนอกจากยอมตาม"
 ww_congo.10.b: "ไมมีวัน!"

 ww_congo.11.t: "ฝรั่งเศสยอมรับขอเรียกรองของเรา"
 ww_congo.11.d: "ฝรั่งเศสยอมรับขอเรียกรองของเรา และฐานทัพกับสิ่งอํานวยความสะดวกใน[772.GetName]อยูในความควบคุมของเราโดยสมบูรณ เทากับวาพวกเขาไดยกการควบคุมอาณานิคมทั้งหมดใหเราแลว"
 ww_congo.11.a: "การตัดสินใจที่ชาญฉลาด"

 ww_congo.12.t: "ฝรั่งเศสปฏิเสธขอเรียกรองของเรา"
 ww_congo.12.d: "ฝรั่งเศสปฏิเสธขอเรียกรองของเราอยางอุกอาจ! ดูเหมือนวาหากเราตองการ[772.GetName] เราจะตองยึดมาดวยกําลัง!"
 ww_congo.12.a: "พวกโง!"

 ww_congo.13.t: "[FROM.GetNameDefCap] เรียกรองใหเรารวมเขากับพวกเขา"
 ww_congo.13.d: "กองกําลังคองโกตั้งประจําตามแนวชายแดนของเรา และเรียกรองการควบคุมฐานทัพ สถาบัน และสิ่งอํานวยความสะดวกของเราทั้งหมด! หากเรายอมตาม ก็เทากับยุติเอกราชของเราและกลายเปนสวนหนึ่งของชาติพวกเขา แตในอีกดาน เราก็ไมมีกําลังพอจะสูกับพวกเขาในเรื่องนี้"
 ww_congo.13.a: "เราจะแข็งแกรงขึ้นดวยกัน!"
 ww_congo.13.b: "ไมมีวัน!"

 ww_congo.14.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 ww_congo.14.d: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา และชาติของพวกเขาจะสิ้นสภาพการเปนรัฐอิสระภายในไมกี่วันขางหนา เทากับวาพวกเขาไดยกการควบคุมประเทศทั้งหมดใหเราแลว"
 ww_congo.14.a: "การตัดสินใจที่ชาญฉลาด"

 ww_congo.15.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 ww_congo.15.d: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเราอยางอุกอาจ! ดูเหมือนวาหากเราตองการ[772.GetName] เราจะตองยึดมาดวยกําลัง!"
 ww_congo.15.a: "พวกโง!"

 ww_congo.16.t: "แอฟริกาลาตินรวมเปนหนึ่ง"
 ww_congo.16.d: "เพื่อตอบสนองตอความตึงเครียดของโลกที่เพิ่มสูงขึ้น และดวยชัยชนะลาสุดของ[FROM.GetLeader] การรวมประเทศในแอฟริกากลางที่พูดภาษากลุมโรมานซก็สําเร็จลง บัดนี้พวกเขาประกาศตนเปนมหาอํานาจโลกใหม และใหคํามั่นจะปกปองประชาชน[FROM.GetAdjective]ไมวาตองแลกดวยอะไร"
 ww_congo.16.a: "พวกเขาถูกลิขิตใหลมเหลว"
 ww_congo.16.b: "[ROOT.GetNameDef]จงเจริญ!"

 ww_congo.17.t: "คองโกไดรับเอกราช"
 ww_congo.17.d: "หลังไดรับการอนุมัติจากทางการ[BEL.GetAdjective]ในรัฐ ปาทริส ลูมุมบา นายกรัฐมนตรี[COG.GetAdjective]คนใหม ไดกลาวสุนทรพจนสั้น ๆ เฉลิมฉลองเอกราชครั้งใหมของประเทศ ในนั้นมีการวิพากษลัทธิอาณานิคมและสิ่งที่เรียกวา "ภารกิจสรางอารยธรรมของ[BEL.GetAdjective]" อยางตรงไปตรงมา แมจะไดรับการตอบรับดีภายในประเทศ แตหลายคนนอกประเทศตีความวาเปนการโจมตีประมุขแหงรัฐ[BEL.GetAdjective]เปนการสวนตัว ยุคแหงการปลดแอกอาณานิคมเพิ่งเริ่มตนเทานั้น!"
 ww_congo.17.a: "ดุลอํานาจในแอฟริกาเปลี่ยนไปแลว"
 ww_congo.17.b: "ถึงเวลาพิสูจนวาเราเปนสองประเทศที่เทาเทียมและเปนอิสระ"
 ww_congo.17.c: "บางทีนี่อาจดีที่สุดแลว..."

 ww_congo.18.t: "การลุกฮือของคองโกถูกปราบ"
 ww_congo.18.d: "ไมนานมานี้ รัฐบาลคองโกเสรีในสแตนลียวิลลพยายามแยกตัวออกจากจักรวรรดิอาณานิคมเบลเยียม แมจะไดรับการสนับสนุนอยางมากในประเทศ แตการกบฏของพวกเขาก็ถูกปราบอยางรวดเร็วโดยทหารที่ภักดีตอเบลเยียมและทหารรับจางตางชาติ"
 ww_congo.18.a: "ยุคจักรวรรดินิยมยังไมสิ้นสุด"
 ww_congo.18.b: "พวกทรยศไดรับสิ่งที่สมควรแลว"
 ww_congo.18.c: "สามัคคีคือพลัง"

 ww_congo.19.t: "การลุกฮือของคองโกประสบความสําเร็จ"
 ww_congo.19.d: "ไมนานมานี้ รัฐบาลคองโกเสรีในสแตนลียวิลลไดเริ่มสงครามประกาศเอกราชจากจักรวรรดิอาณานิคมเบลเยียม แมจะใชเวลาพอสมควร แตการกบฏของพวกเขาก็สามารถเอาชนะทหารอาณานิคมที่ประจําในพื้นที่และยึดเมืองสําคัญในคองโกไดในที่สุด บัดนี้พวกเขาประกาศเอกราชอยางเปนทางการ และกําลังแสวงหาขอตกลงสันติภาพกับอดีตผูกดขี่.."
 ww_congo.19.a: "ยุคจักรวรรดินิยมสิ้นสุดแลว"
 ww_congo.19.b: "เราไดชัยชนะ!"
 ww_congo.19.c: "ความสูญเสียอันรายแรง..."

 ww_congo.20.t: "การปฏิวัติรวันดา"
 ww_congo.20.d: "ดวยการควบคุมที่หละหลวมอยางยิ่งของรัฐบาลเราเหนือดินแดนในอาณัติรวันดา-อุรุนดี และกระแสชาตินิยมที่แพรไปทั่วภูมิภาค มวามี มูตาราที่ 3 รูดาฮิกวา พระมหากษัตริยแหงรวันดา ไดประกาศใหประเทศเปนรัฐเอกราช ตัดขาดจากรัฐบาลกลางของเรา เราควรเขาแทรกแซงหรือไม?"
 ww_congo.20.a: "ไมใชหนาที่ของเราที่จะหยุดพวกเขา"
 ww_congo.20.b: "ใครบอกวาพวกเขาจะไดเอกราช?"

 ww_congo.21.t: "การประกาศของมวัมบุตซา"
 ww_congo.21.d: "ดวยการควบคุมที่หละหลวมอยางยิ่งของรัฐบาลเราเหนือดินแดนในอาณัติรวันดา-อุรุนดี และกระแสชาตินิยมที่แพรไปทั่วภูมิภาค มวามี มวัมบุตซาที่ 4 พระมหากษัตริยแหงบุรุนดี ไดประกาศใหประเทศเปนรัฐเอกราช ตัดขาดจากรัฐบาลกลางของเรา เราควรเขาแทรกแซงหรือไม?"
 ww_congo.21.a: "ไมใชหนาที่ของเราที่จะหยุดพวกเขา"
 ww_congo.21.b: "ใครบอกวาพวกเขาจะไดเอกราช?"

 threatened_us_opinion_modifier: "พวกเขาขมขูเรา!"
 attempted_diplomacy_opinion_modifier: "พวกเขาพยายามติดตอเราทางการทูต"
 BEL_commonwealth_faction: "เครือจักรภพเบลเยียม"

 ww_congo.22.t: "[COG.GetLeader] ขอใหเพิ่มการอพยพมายังคองโก"
 ww_congo.22.desc: "[COG.GetLeader] ผูวาการของเราในคองโก แสดงความประสงคใหชาว[ROOT.GetAdjective]อพยพมายังภูมิภาคมากขึ้น เพื่อนําผูมีความรูและเงินทุนเขามา ดินแดนอันอุดมและอบอุนของกาตังกายอมดึงดูดผูที่มีจิตวิญญาณนักผจญภัยหรือสํานึกในหนาที่ และหากเราสงเสริม ก็ยอมกระตุนใหผูคนยายมามากขึ้นอีก.."
 ww_congo.22.a: "เราจะทําตาม"
 ww_congo.22.b: "เขาคิดวาตัวเองเปนใคร?"

 ww_congo.23.t: "ชาว[FROM.GetAdjective]อนุมัติแผนการอพยพของเรา"
 ww_congo.23.desc: "ฝายบริหารอาณานิคมใน[FROM.GetNameDef]ไดอนุมัติคําขอของเราที่จะสงเสริมการอพยพของชาว[FROM.GetAdjective]มายังรัฐของเรามากขึ้น ผูคนระลอกใหมที่พรอมชวยสรางรัฐของเราจะเริ่มหลั่งไหลเขามาอยางแนนอน"
 ww_congo.23.a: "เยี่ยมเลย"

 ww_congo.24.t: "ชาว[FROM.GetAdjective]ปฏิเสธแผนการอพยพของเรา"
 ww_congo.24.desc: "ฝายบริหารอาณานิคมใน[FROM.GetNameDef]ไดปฏิเสธคําขอของเราที่จะสงเสริมการอพยพของชาว[FROM.GetAdjective]มายังรัฐของเรามากขึ้น นาเสียดายจริง ๆ แตเราก็ทําอะไรไมไดมากที่จะเปลี่ยนใจพวกเขา"
 ww_congo.24.a: "ก็นะ เราคาดหวังอะไรละ?"

 ww_congo.25.t: "อัลแบรต เดอ ฟเลสเฮาเวอร เดินทางไปตางประเทศเพื่อหาการสนับสนุน"
 ww_congo.25.desc: "อัลแบรต เดอ ฟเลสเฮาเวอร รัฐมนตรีวาการกระทรวงอาณานิคมของเบลเยียม และพันธมิตรใกลชิดของปแยร ริกแมนส ตัดสินใจเดินทางไปตางประเทศเพื่อหาการสนับสนุนจากพันธมิตรใหมของเรา เนื่องจากสถานการณดูเลวรายและนักการเมืองในแผนดินแมไมยอมดําเนินการ บางทีเราอาจไดขอตกลงที่เปนประโยชนดวยความชวยเหลือของเขา?"
 ww_congo.25.a: "นี่คือจุดที่สงครามเริ่มตนอยางแทจริง"

 ww_congo.26.t: "[FROM.GetNameDefCap] ยึดครอง[796.GetName]!"
 ww_congo.26.desc: "\nตนสัปดาหนี้ กองกําลังของ[COG.GetNameDef]ไดเคลื่อนเขายึดครองดินแดน[796.GetName]ของเรา โดยอางวามีภารกิจปกปองภูมิภาคจากการถูกศัตรูของพวกเขายึดครอง นี่เปนการกระทําเยี่ยงสงครามอยางชัดเจน แตเราอาจเลือกที่จะเพิกเฉยได เพราะพวกเขาคงไมไดตองการหาเรื่องกับเรา หากแตตองการรวมลุมแมนํ้าคองโกเปนหนึ่งเดียวอีกครั้ง"
 ww_congo.26.a: "ไมคุมที่จะสูกันเพราะเรื่องนี้"
 ww_congo.26.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 ww_congo.27.t: "การกอกบฏที่ลูลัวบูรก"
 ww_congo.27.desc: "ตนสัปดาหนี้ นายทหารชั้นประทวนชาวคองโกนําโดยจาสิบเอก อึนโกอี มูคาลาบูชี ไดกอกบฏที่ลูลัวบูรกในจังหวัดกาซาอี ชนวนหลักดูเหมือนจะมาจากการปฏิบัติตอพวกเขาของนายทหารชาวเบลเยียม ผูกอกบฏบุกเขาคลังอาวุธของฐานในตอนเชาและปลนสะดมยานคนขาวของเมือง พวกเขายังโจมตีสัญลักษณที่เห็นไดชัดของทางการอาณานิคมและประกาศความตองการเอกราช จากนั้นจึงแยกยายกลับหมูบานบานเกิดพรอมปลนสะดมไปตลอดทาง แตดูเหมือนจะไมสามารถลามการกอการไปยังกองรักษาการณใกลเคียงได เราควรจัดการสถานการณนี้อยางไร?"
 ww_congo.27.a: "จับกุมพวกเขาและลงโทษมูคาลาบูชีใหเปนเยี่ยงอยาง"
 ww_congo.27.b: "นี่เปนสัญญาณวาจําเปนตองมีการเปลี่ยนแปลงครั้งใหญ"
 COG_pro_independence_reforms_in_the_force_publique_structure: "การปฏิรูปเพื่อเอกราชในฟอรซปูบลิก"

 ww_congo.28.t: "ความระแวงตอคณะกรรมการแหงชาติที่เพิ่มขึ้น"
 ww_congo.28.desc: "เมื่อคณะกรรมการแหงชาติเพื่อการปลดปลอยที่เพิ่งกอตั้งขึ้นแสดงทาทีเหินหางตอรัฐบาลอาณานิคมมากขึ้น ผูคนจํานวนมากในชนบทเริ่มกังวลวาคณะกรรมการอาจไมเลือกหนทางสันติไปสูเอกราช ยิ่งไปกวานั้น ในภูมิภาคกาตังกาก็เริ่มมีเสียงกระซิบเรื่องการแยกตัว และเปนไปไดวารัฐนั้นอาจพยายามประกาศเอกราชเมื่อสงครามปลดปลอยของเราเริ่มขึ้น..."
 ww_congo.28.a: "พวกเขาตองถูกโนมนาว หรือถูกปลดปลอยดวยกําลัง"
 COG_coquilatville_and_lusambo_will_join_the_belgian_loyalsits_tt: "§Y[538.GetName]§! และ §Y[888.GetName]§! จะเขารวม§Yฝายผูภักดีที่นิยมเบลเยียม§!เมื่อสงครามประกาศเอกราชเริ่มขึ้น"

 ww_congo.29.t: "นักชาตินิยมคองโกติดตอขอความชวยเหลือจากเรา"
 ww_congo.29.desc: "นักชาตินิยมคองโกที่เรียกตนเองวาคณะกรรมการแหงชาติเพื่อการปลดปลอยกําลังเตรียมทําสงครามประกาศเอกราชตอเจาอาณานิคม พวกเขาสัญญาวาจะเขามาใกลชิดกับเรามากขึ้นเมื่อชนะสงคราม หากเราสงอาวุธใหเมื่อการสูรบเริ่มขึ้น และอางวา[BEL.GetName]ที่ออนแอลงยอมเปนประโยชนตอเรา"
 ww_congo.29.a: "ไดเลย"
 ww_congo.29.b: "ไมมีเหตุผลที่ตองเขาแทรกแซง"

 ww_congo.30.t: "[FROM.GetNameDefCap] ตัดสินใจชวยเหลือเรา"
 ww_congo.30.desc: "นักการทูตของเรากลับมาจากการเจรจากับคณะเสนาธิการทหาร[FROM.GetAdjective] และวากันวาไดบรรลุขอตกลงวาพวกเขาจะสงกําลังพลและยุทโธปกรณมาใหเมื่อเราตัดสินใจประกาศสงครามกับผูกดขี่ วันนี้เปนวันที่ดีของประชาชนคองโก!"
 ww_congo.30.a: "เยี่ยมเลย"

 ww_congo.31.t: "[FROM.GetNameDefCap] ตัดสินใจไมชวยเหลือเรา"
 ww_congo.31.desc: "นักการทูตของเรากลับมาจากการเจรจากับคณะเสนาธิการทหาร[FROM.GetAdjective]มือเปลา ดูเหมือนวาไมอาจบรรลุขอตกลงได และพันธมิตรที่เราคิดวาเปนมิตรไดทรยศเรา..."
 ww_congo.31.a: "นาเสียดายจริง ๆ"

 ww_congo.32.t: "รัฐประหารของซิมบา"
 ww_congo.32.desc: "ขบวนการซิมบาไดรับการสนับสนุนอยางมากในประเทศเมื่อไมนานมานี้ บัดนี้พวกเขาไดเขาสูสภาแหงชาติและเรียกรองใหเปลี่ยนผูนํา นักการเมืองของเราทําอะไรไมไดมากนอกจากยอมรับสถานการณ แตคําถามคือ ใครควรนํารัฐของเราในตอนนี้?"
 ww_congo.32.a: "ซีริล อาดูลา เปนรัฐบุรุษที่ดี"
 ww_congo.32.b: "คริสตอฟ กเบนเย ควรเปนผูนํา"

 ww_congo.33.t: "ปญหาเรื่องผูนํา"
 ww_congo.33.desc: "ความเปนผูนําของชาติเราถูกตั้งคําถามเมื่อไมนานมานี้ อันเนื่องมาจากความสัมพันธของซีริล อาดูลา กับชาวอเมริกันและสหภาพแรงงานเบลเยียม หลายคนเชื่อวาคริสตอฟ กเบนเย ผูนําของซิมบา ควรขึ้นรับตําแหนงประธานแหงรัฐคนใหม เราควรยอมพวกเขาหรือไม?"
 ww_congo.33.a: "ซีริล อาดูลา เปนรัฐบุรุษที่ดี เขาจะไปไมได"
 ww_congo.33.b: "คริสตอฟ กเบนเย ควรเปนผูนํา"

 ww_congo.34.t: "การเยือนอยางเปนทางการของควาเม เอ็นครูมาห"
 ww_congo.34.desc: "ควาเม เอ็นครูมาห นักการเมืองแพน-แอฟริกันนิสตชาวกานา ไดเดินทางถึงเมืองหลวงของเราในวันนี้ตามคําเชิญอยางเปนทางการของ[ROOT.GetLeader] ในฐานะนักสังคมนิยมผูแข็งขัน หลายคนเชื่อวาการรวมมือกับเขาอาจเปนประโยชนหากเราตองการรักษาอนาคตของแอฟริกา บางคนถึงกับอางวาเขาควรขึ้นเปนผูนําชาติของเรา แนวทางใดดีที่สุด?"
 ww_congo.34.a: "เราเชื่อวาความรวมมืออันยิ่งใหญจะเกิดขึ้นได"
 ww_congo.34.b: "เขาคือผูนําที่เราตองการ!"

 ww_congo.35.t: "[COG.GetNameDefCap] ปลุกปนการตอตานในอาณานิคม"
 ww_congo.35.desc: "\nมีรายงานวารัฐบาล[COG.GetAdjective]เริ่มสงอาวุธใหกลุมตอตานในแอฟริกา และใหที่พักพิงพรอมฝกฝนผูเห็นตางและกองกําลังติดอาวุธ เพื่อพยายามปลดปลอยรัฐของพวกเขาที่อยูภายใตการยึดครองของเรา เราตองระมัดระวังภูมิภาคนี้ตอจากนี้..."
 ww_congo.35.a: "เราตองยุติเรื่องนี้ทันที!"
 ww_congo.35.b: "ถึงเวลาของแอฟริกาแลว"

 ww_congo.36.t: "[FROM.GetName] ปฏิเสธขอเสนอสันติภาพ"
 ww_congo.36.desc: "เอกอัครราชทูตจาก[FROM.GetNameDef]ปฏิเสธขอเสนอสันติภาพของเรา พวกเขาอางวาการโจมตีของเรานั้นไรเหตุผลโดยสิ้นเชิง ดังนั้นพวกเขาจะไมยอมรับสิ่งใดนอกจากการยอมจํานนอยางไมมีเงื่อนไขจากเรา ฐานเปนภัยตอสันติภาพในภูมิภาค"
 ww_congo.36.a: "ชางหนาไหวหลังหลอก ความรุนแรงแบบจักรวรรดินิยมของพวกเขาหยุดไดดวยกําลังเทานั้น"

 ww_congo.37.t: "[FROM.GetNameDefCap] เสนอสันติภาพแลกเอกราชของ[?COG.COG_disputed_colony.GetAdjective]"
 ww_congo.37.desc: "นักการทูต[FROM.GetAdjective]เขามาหาเราพรอมขอเสนอสันติภาพ ขอเสนอนี้ขึ้นอยูกับการที่เรายอมสละการอางสิทธิ์เหนือดินแดน[?COG.COG_disputed_colony.GetAdjective]ที่เราเสียให[FROM.GetNameDef]ระหวางความขัดแยงนี้ นักการทูตยังระบุวาจะมีการลงคะแนนเสียงในดินแดน[?COG.COG_disputed_colony.GetAdjective]ที่สละไปเพื่อเลือกรัฐบาลใหม แตการเลือกตั้งดังกลาวจะเปนอิสระเพียงใดยังไมชัดเจน"
 ww_congo.37.a: "เราจะไมยอมเสียดินแดนของเรา"
 ww_congo.37.b: "เราไมมีทางเลือกนอกจากยอมตาม"

 ww_congo.38.t: "[FROM.GetName] ยอมรับขอเสนอสันติภาพ"
 ww_congo.38.desc: "นักการทูตจาก[FROM.GetNameDef]แจงเราวารัฐบาลของพวกเขายินดีสละการอางสิทธิ์เหนือดินแดน[?COG.COG_disputed_colony.GetAdjective]ที่เราไดปลดปลอยแลว บัดนี้พวกเขากําลังถอนกําลังไปยังพรมแดนที่สถาปนาขึ้นใหมในภูมิภาค"
 ww_congo.38.a: "ชัยชนะอันกลาหาญเหนือจักรวรรดินิยม!"

 ww_congo.39.t: "การเลือกตั้งครั้งแรกของคองโก"
 ww_congo.39.desc: "การเลือกตั้งเสรีครั้งแรกเสร็จสิ้นลง และโฌเซฟ กาซา-วูบู ไดรับชัยชนะ บัดนี้เขากําลังเรงจัดตั้งคณะรัฐมนตรีชุดแรกของคองโก ดวยความนิยมอยางกวางขวางทั่วประเทศและความสามารถในหนาที่อันยอดเยี่ยม เขาจะถูกจดจําในฐานะประธานาธิบดีผูยิ่งใหญไปอีกหลายชั่วรุนอยางแนนอน"
 ww_congo.39.a: "กาซา-วูบู เปนรัฐบุรุษที่ดี เราตองการเขา"

 ww_congo.40.t: "คณะรัฐมนตรีชุดแรกของกาซา-วูบู"
 ww_congo.40.desc: "ประธานาธิบดี[ROOT.GetLeader]ของเรากําลังจัดตั้งคณะรัฐมนตรีอยางเปนทางการชุดแรก หลังไดรับชัยชนะในการเลือกตั้งที่ผานมา ดวยความนิยมอยางกวางขวางทั่วประเทศ เขาจะเปนที่รูจักในฐานะบิดาผูกอตั้งรัฐสมัยใหมของเราไปอีกหลายชั่วรุนอยางแนนอน!"
 ww_congo.40.a: "กาซา-วูบู คือคนที่เหมาะกับงานนี้จริง ๆ"

 ww_congo.41.t: "[FROM.GetLeader] เรียกรองการรวมชาวบาคองโกเปนหนึ่งเดียว"
 ww_congo.41.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef]และพันธมิตรแหงบาคองโก ไดติดตอมาเรียกรองใหเรายกดินแดนที่ชาวบาคองโกเปนประชากรสวนใหญใหแกพวกเขา เราควรตอบสนองอยางไร?"
 ww_congo.41.a: "เพื่อประโยชนสวนรวมที่ยิ่งใหญกวา"
 ww_congo.41.b: "ไมมีทาง!"

 ww_congo.42.t: "[FROM.GetLeader] สงมอบดินแดนบาคองโก"
 ww_congo.42.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดตกลงสงมอบดินแดนทั้งหมดที่มีชาวบาคองโกอาศัยอยูจํานวนมาก พรอมอวยพรใหเราโชคดีในอนาคต วันนี้เปนวันที่ยิ่งใหญของชาติคองโก"
 ww_congo.42.a: "ยอดเยี่ยม!"

 ww_congo.43.t: "[FROM.GetLeader] ไมยอมสงมอบดินแดนบาคองโก"
 ww_congo.43.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดปฏิเสธขอเรียกรองของเราที่ใหสงมอบดินแดนทั้งหมดที่มีชาวบาคองโกอาศัยอยูจํานวนมาก เราควรตอบสนองตอการกดขี่ประชาชนของเราโดยมหาอํานาจตางชาติอยางไร?"
 ww_congo.43.a: "เราทําอะไรไดไมมากนัก"
 ww_congo.43.b: "เราจะสั่งสอนพวกเขา!"

 ww_congo.44.t: "ราชวงศอากวา โรซาดา"
 ww_congo.44.desc: "สภาไดตัดสินวาผูปกครองคองโกที่ชอบธรรมที่สุดคือดง เปดรูที่ 7 ผูอางสิทธิ์ในราชบัลลังกปจจุบันของราชอาณาจักรคองโกที่เพิ่งถูกยุบไป ซึ่งเคยตั้งอยูในจังหวัดทางตะวันตกของเรา รวมถึงพื้นที่ที่ปจจุบันคือกาบินดาและแองโกลา เขายอมนําเสถียรภาพมาได และรวมชาวบาคองโกเปนหนึ่งเดียวไดแนหรือ?"
 ww_congo.44.a: "เขาคือผูสมัครที่ชอบธรรมที่สุดที่เราจะหาได!"
 ww_congo.44.b: "ไม เราตองการคนอื่น!"

 ww_congo.45.t: "นยิมแหงบากูบา"
 ww_congo.45.desc: "สภาไดตัดสินวาผูปกครองคองโกที่ชอบธรรมรองลงมาคือ อึมบ็อป มาบีอินก มาอึมเบกี กษัตริยแหงราชอาณาจักรกูบา อาณาจักรเล็ก ๆ ในจังหวัดตอนกลางของเรา เขายอมนําเสถียรภาพมาได และบรรลุสิ่งที่ไมกี่คนทําไดแนหรือ?"
 ww_congo.45.a: "เขาคือผูที่จะนําเราสูความยิ่งใหญ!"
 ww_congo.45.b: "ไม เราตองการคนอื่น!"

 ww_congo.46.t: "มาโลอันโก"
 ww_congo.46.desc: "สภาไดตัดสินวาผูปกครองคองโกที่ชอบธรรมรองลงมาคือ โมเอ โปอาตีที่ 3 มาโลอันโกแหงราชอาณาจักรโลอันโก รัฐที่ตั้งอยูในและรอบจังหวัดทางตะวันตกสุดของเรา สวนใหญในพื้นที่ที่ปจจุบันคือคองโกตอนกลาง เขายอมนําเสถียรภาพมาได และรวมกับจังหวัดคองโกทางตะวันตกไดแนหรือ?"
 ww_congo.46.a: "เขาใหสิทธิ์อันชอบธรรมเหนือคองโกตอนกลางแกเราได!"
 ww_congo.46.b: "ไม เราตองการคนอื่น!"

 ww_congo.47.t: "ราชวงศอึนตเวโรแหงบุรุนดี"
 ww_congo.47.desc: "สภาไดตัดสินวาผูที่อาจปกครองคองโกไดอีกคนคือ มวัมบุตซาที่ 4 มวามีแหงราชอาณาจักรบุรุนดี อาณาจักรทางตะวันออก เขายอมนําเสถียรภาพมาได และรวมกับรัฐบุรุนดีไดแนหรือ?"
 ww_congo.47.a: "อยางนอยเขาก็ใหสิทธิ์อันชอบธรรมเหนือบุรุนดีแกเราได..."
 ww_congo.47.b: "ไม เราตองการคนอื่น!"

 ww_congo.48.t: "ตระกูลอาบันยีกินยาแหงรวันดา"
 ww_congo.48.desc: "สภาไดตัดสินวาผูที่อาจปกครองคองโกไดอีกคนคือ มูตาราที่ 3 รูดาฮิกวา อูมวามีแหงราชอาณาจักรรวันดา อาณาจักรทางตะวันออก เขายอมนําเสถียรภาพมาได และรวมกับรัฐรวันดาไดแนหรือ?"
 ww_congo.48.a: "อยางนอยเขาก็ใหสิทธิ์อันชอบธรรมเหนือรวันดาแกเราได..."
 ww_congo.48.b: "ไม เราตองการคนอื่น!"

 ww_congo.49.t: "ผูรวมมือกับเยอรมัน"
 ww_congo.49.desc: "สภาไดตัดสินวา เมื่อไมมีทางเลือกอื่นเหลืออยู ผูที่อาจปกครองคองโกไดคนสุดทายคือ ยูฮีที่ 5 มูซินกา อูมวามีแหงราชอาณาจักรรวันดา อาณาจักรทางตะวันออก ผูถูกผูวาการเบลเยียมโคนจากอํานาจหลังมหาสงคราม เพราะความรวมมือและความชื่นชมที่มีตอจักรวรรดิอาณานิคมเยอรมัน เขาอาจเปนเดิมพันที่เสี่ยง แตอยางนอยก็มีความทะเยอทะยานสูง..."
 ww_congo.49.a: "คงตองเปนเขาแลวละ..."
 ww_congo.49.b: "เรื่องนี้ไมไดเปนไปตามที่เราวางแผนไวเลย..."

 ww_congo.50.t: "[FROM.GetNameDefCap] ตองการสรางพันธมิตร"
 ww_congo.50.desc: "\n[FROM.GetNameDefCap] ไดติดตอมาขอสรางพันธมิตรรวมกัน พวกเขาเริ่มเสริมกําลังทหารและแสดงความประสงคจะรวมมือกันเพื่อใหทั้งสองฝายแข็งแกรงขึ้น ในอดีตความสัมพันธของเราขรุขระมาตลอด แตไมมีเวลาใดเหมาะกับการคืนดีไปกวาตอนนี้"
 ww_congo.50.a: "เรายินดีอยางยิ่ง"
 ww_congo.50.b: "เราไมตองการพวกเขา"

 ww_congo.51.t: "[FROM.GetNameDefCap] ตกลงสรางพันธมิตร"
 ww_congo.51.desc: "\n[FROM.GetNameDefCap] ตอบรับคําขอเปนพันธมิตรของเราอยางกระตือรือรน และลงนามเอกสารที่จําเปนทั้งหมดเพื่อใหเปนทางการแลว เราจะไมตองสูตามลําพังกับผูที่คุกคามเราอีกตอไป!"
 ww_congo.51.a: "เราแข็งแกรงขึ้นเมื่ออยูดวยกัน!"

 ww_congo.52.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอสรางพันธมิตรของเรา"
 ww_congo.52.desc: "\nขอเสนอสรางพันธมิตรของเราถูก[FROM.GetLeader]ปฏิเสธอยางเย็นชา เราพยายามชี้ใหเห็นประโยชนของเราแลว แตนาเสียดายที่[FROM.GetNameDef]ตัดสินใจไปแลว แมจะนาหงุดหงิดยิ่งนัก แตเราจะไมทอถอย และจะหาทางออกอื่นแทน"
 ww_congo.52.a: "เราจะสั่งสอนพวกเขา"

 ww_congo.53.t: "[FROM.GetLeader] เรียกรองการรวมชาวบุรุนดีเปนหนึ่งเดียว"
 ww_congo.53.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef]และชาวบุรุนดี ไดติดตอมาเรียกรองใหเรายกดินแดนที่ชาวบุรุนดีเปนประชากรสวนใหญใหแกพวกเขา เราควรตอบสนองอยางไร?"
 ww_congo.53.a: "เพื่อประโยชนสวนรวมที่ยิ่งใหญกวา"
 ww_congo.53.b: "ไมมีทาง!"

 ww_congo.54.t: "[FROM.GetLeader] สงมอบดินแดนบุรุนดี"
 ww_congo.54.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดตกลงสงมอบดินแดนทั้งหมดที่มีชาวบุรุนดีอาศัยอยูจํานวนมาก พรอมอวยพรใหเราโชคดีในอนาคต วันนี้เปนวันที่ยิ่งใหญของชาติคองโก"
 ww_congo.54.a: "ยอดเยี่ยม!"

 ww_congo.55.t: "[FROM.GetLeader] ไมยอมสงมอบดินแดนบุรุนดี"
 ww_congo.55.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดปฏิเสธขอเรียกรองของเราที่ใหสงมอบดินแดนทั้งหมดที่มีชาวบุรุนดีอาศัยอยูจํานวนมาก เราควรตอบสนองตอการกดขี่ประชาชนของเราโดยมหาอํานาจตางชาติอยางไร?"
 ww_congo.55.a: "เราทําอะไรไดไมมากนัก"
 ww_congo.55.b: "เราจะสั่งสอนพวกเขา!"

 ww_congo.56.t: "[FROM.GetLeader] เรียกรองการรวมชาวรวันดาเปนหนึ่งเดียว"
 ww_congo.56.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef]และชาวรวันดา ไดติดตอมาเรียกรองใหเรายกดินแดนที่ชาวรวันดาเปนประชากรสวนใหญใหแกพวกเขา เราควรตอบสนองอยางไร?"
 ww_congo.56.a: "เพื่อประโยชนสวนรวมที่ยิ่งใหญกวา"
 ww_congo.56.b: "ไมมีทาง!"

 ww_congo.57.t: "[FROM.GetLeader] สงมอบดินแดนรวันดา"
 ww_congo.57.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดตกลงสงมอบดินแดนทั้งหมดที่มีชาวรวันดาอาศัยอยูจํานวนมาก พรอมอวยพรใหเราโชคดีในอนาคต วันนี้เปนวันที่ยิ่งใหญของชาติคองโก"
 ww_congo.57.a: "ยอดเยี่ยม!"

 ww_congo.58.t: "[FROM.GetLeader] ไมยอมสงมอบดินแดนรวันดา"
 ww_congo.58.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดปฏิเสธขอเรียกรองของเราที่ใหสงมอบดินแดนทั้งหมดที่มีชาวรวันดาอาศัยอยูจํานวนมาก เราควรตอบสนองตอการกดขี่ประชาชนของเราโดยมหาอํานาจตางชาติอยางไร?"
 ww_congo.58.a: "เราทําอะไรไดไมมากนัก"
 ww_congo.58.b: "เราจะสั่งสอนพวกเขา!"

 ww_congo.59.t: "[FROM.GetLeader] ขอเปนรัฐในอารักขา"
 ww_congo.59.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ไดเขาหานักการทูตคนหนึ่งของเราเมื่อไมนานมานี้ ออนวอนรองขอใหเราฟนฟูอํานาจเหนืออาณาจักรของเขาอีกครั้ง ถึงขั้นตั้งชื่อรัฐของตนวามิทเทิลอาฟรีกา เขาเคยอยูภายใตการคุมครองของเราสมัยที่ครองราชยเปนกษัตริยแหงรวันดา แตภายหลังถูกทางการเบลเยียมโคนจากอํานาจ เราควรฟงคําขอของกษัตริยบาผูนี้หรือไม?"
 ww_congo.59.a: "เปนโอกาสที่เราพลาดไมได"
 ww_congo.59.b: "ไม!"

 ww_congo.60.t: "[FROM.GetLeader] ยอมรับคําขอของเราที่จะเปนผูอารักขา"
 ww_congo.60.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ตัดสินใจยอมรับคําขอของเรา และใหเรากลับมาเปนผูอารักขาชาติของพวกเขาอีกครั้ง ดุลอํานาจในแอฟริกาไดรับการฟนฟูแลวอยางแทจริง!"
 ww_congo.60.a: "วันนี้เปนวันที่ตองจดจํา!"

 ww_congo.61.t: "[FROM.GetLeader] ปฏิเสธคําขอของเราที่จะเปนผูอารักขา"
 ww_congo.61.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ตัดสินใจปฏิเสธคําขอของเรา เพราะเห็นวาภูมิภาคของเรามีคุณคานอย และอางวาเราไมมีอะไรมากนักที่จะมอบใหซึ่งพวกเขายังไมมี"
 ww_congo.61.a: "วันนี้เปนวันที่ตองจดจํา..."

 ww_congo.62.t: "ราอูล ฟาน โอเฟอรสตราเทน กลับเบลเยียม"
 ww_congo.62.desc: "ราอูล ฟาน โอเฟอรสตราเทน นายทหารเบลเยียมผูรับใชชาติของเรามาจนกระทั่งไมนานนี้ ถูกเรียกตัวกลับ[BEL.GetName]เนื่องจากการสูญเสียมาตุภูมิของพวกเขา เขารับใชเราที่นี่เปนอยางดี และเราหวังวาเขาจะชวยขับไลผูรุกรานได"
 ww_congo.62.a: "ขอใหโชคดี!"

 ww_congo.63.t: "[FROM.GetLeader] ตองการขายยูเรเนียมใหเรา"
 ww_congo.63.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] เขามาหาเราพรอมขอเสนอที่นาสนใจ ดูเหมือนวาแหลงยูเรเนียมของประเทศนั้นอุดมสมบูรณเกินคาด และตอนนี้มีแนวคิดที่จะลักลอบขนวัตถุดิบบางสวนมายังประเทศเราโดยคิดราคา"
 ww_congo.63.a: "เปนโชคที่นายินดี"
 ww_congo.63.b: "เราจะไมลดตัวไปทําเรื่องผิดกฎหมาย"

 ww_congo.64.t: "[FROM.GetLeader] ยอมรับขอตกลงยูเรเนียม"
 ww_congo.64.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ตกลงลงนามในขอตกลงยูเรเนียมที่เราเสนอ และสงเงินที่เราขอมาใหเรียบรอยแลว"
 ww_congo.64.a: "ยอดเยี่ยม!"

 ww_congo.65.t: "[FROM.GetLeader] ปฏิเสธขอตกลงยูเรเนียม"
 ww_congo.65.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ปฏิเสธคําขอของเราที่จะลักลอบขนยูเรเนียมไปยังประเทศของพวกเขาโดยคิดราคา โดยอางวาจะไมลดตัวไปเปนอาชญากรระหวางประเทศ"
 ww_congo.65.a: "นาเสียดาย..."

 ww_congo.66.t: "[FROM.GetNameDefCap] ยกเลิกขอตกลงยูเรเนียม"
 ww_congo.66.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ตัดสินใจยกเลิกขอตกลงยูเรเนียมที่ดําเนินอยู เพราะเห็นวามีตนทุนสูงเกินไปสําหรับชาติ[FROM.GetAdjective]"
 ww_congo.66.a: "ก็นาเสียดายนะ..."

 ww_congo.67.t: "[FROM.GetLeader] เชิญเราเขารวมกองทุนพัฒนายูเรเนียม"
 ww_congo.67.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] เขามาหาเราพรอมขอเสนอที่นาสนใจ พวกเขาตองการใหเราเขารวมกองทุนพัฒนายูเรเนียมรวม และแบงปนวัสดุนิวเคลียรและงานวิจัยระหวางกัน แมอาจทําใหขอมูลรั่วไหลไดงายขึ้น แตก็อาจคุมคาอยางยิ่งเพื่อยูเรเนียมที่เราตองการอยางยิ่ง"
 ww_congo.67.a: "ดวยความยินดี!"
 ww_congo.67.b: "อันตรายเกินไป"

 ww_congo.68.t: "[FROM.GetLeader] เขารวมกองทุนพัฒนายูเรเนียม"
 ww_congo.68.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ตกลงเขารวมกองทุนพัฒนายูเรเนียมที่เราเสนอ และในที่สุดโครงการนิวเคลียรของพวกเขาก็กลับมาเดินหนาไดอีกครั้งดวยยูเรเนียมที่เพิ่งไดมา"
 ww_congo.68.a: "ยอดเยี่ยม!"

 ww_congo.69.t: "[FROM.GetLeader] ปดตกแนวคิดของเรา"
 ww_congo.69.desc: "\n [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] ปฏิเสธคําเชิญเขารวมกองทุนพัฒนายูเรเนียมของเรา โดยอางวาตองเก็บโครงการนิวเคลียรทั้งหมดเปนความลับ เพราะการเปดเผยขอมูลใด ๆ ที่อาจรั่วไหลถึงศัตรูนั้นอันตรายเกินกวาจะยอมรับขอเสนอเชนนี้ไดตั้งแตแรก"
 ww_congo.69.a: "นาเสียดาย..."

 ww_congo.70.t: "ยาน ซุมบัค เขารวมกับฝาย[ENG.GetAdjective]"
 ww_congo.70.desc: "ยาน ซุมบัค นักบินของเราไดจากเราไปและตัดสินใจรวมรบกับ RAF การตัดสินใจทิ้งสหายของเขาไมใชเรื่องงาย แตเราตองยกยองเขาที่ตองการสูตอเพื่อโปแลนดที่เปนเอกราชและปลอดจากการกดขี่"
 ww_congo.70.a: "ขอใหบินอยางปลอดภัย"

 ww_congo.71.t: "ยาน ซุมบัค ตองการเดินทางไปคองโก"
 ww_congo.71.desc: "ยาน ซุมบัค นักบินมือหนึ่งของเราที่มาจากโปแลนด แจงวาเขาตองการจากเราไปยังคองโกเพื่อชวยจัดตั้งกองทัพอากาศที่นั่น เราควรอนุญาตหรือไม?."
 ww_congo.71.a: "ปลอยใหเขาไป"
 ww_congo.71.b: "ขวางไมใหเขาออกไป!"

 ww_congo.72.t: "ยาน ซุมบัค มาถึงแลว"
 ww_congo.72.desc: "ยาน ซุมบัค นักบินขับไลชาวโปแลนด เพิ่งเดินทางมาถึงประเทศของเรา และแจงวาตองการเขารวมกองทัพอากาศของเราและรบเพื่อเรา คงมีบทบาทใดที่เรามอบหมายใหเขาไดแน?"
 ww_congo.72.a: "เราจะใหเขาเริ่มงาน"

 ww_congo.73.t: "[FROM.GetNameDefCap] เสนอสันติภาพแลกเอกราชของอาณานิคมเรา"
 ww_congo.73.desc: "นักการทูต[FROM.GetAdjective]เขามาหาเราพรอมขอเสนอสันติภาพ ขอเสนอนี้ขึ้นอยูกับการที่เรายอมสละการอางสิทธิ์เหนือดินแดนบางสวนในแอฟริกาและถอนกําลังออกจากภูมิภาค เราจะยอมรับหรือไม?"
 ww_congo.73.a: "เราจะไมยอมเสียดินแดนของเรา"
 ww_congo.73.b: "เราไมมีทางเลือกนอกจากยอมตาม"


 #### THE WHISPERS AND NEGOTIATIONS OF INDEPENDENCE EVENT CHAIN ####

 congo_independence_struggle.1.t: "เสียงกระซิบแหงเอกราช"
 congo_independence_struggle.1.d: "นับตั้งแตทวีปของเราถูกชาวยุโรปแบงสรรกัน เราก็โหยหาอิสรภาพและโอกาสกําหนดอนาคตของตนเอง อดีตของเราในฐานะอาณานิคมของ[BEL.GetNameDefCap]เต็มไปดวยการขูดรีดและการลดทอนความเปนมนุษย แตเราถูกกดไวใตเทาเสมอเพราะความแตกแยกของเราเองและอํานาจการยิงที่เหนือกวาของพวกเขา \n\nเสียงกระซิบแหงการกอการดังขึ้นอีกครั้งตามทองถนนและในปาลึก ขณะที่ประชาชนของเราเปลงเสียงถึงความฝนที่จะมีคองโกที่ปลอดจากการแทรกแซงของเจาอาณานิคม คองโกที่มีอิสระในการตราและบังคับใชกฎหมายของตนเอง คองโกที่มีอิสระไดรับผลจากหยาดเหงื่อของตนเอง คองโกที่มีอิสระกําหนดอนาคตของตนเอง"
 congo_independence_struggle.1.a: "เราควรพยายามไดอิสรภาพผานการทูต"
 congo_independence_struggle.1.b: "เราตองไดเอกราชไมวาจะตองแลกดวยอะไร"

 congo_independence_struggle.2.t: "[FROM.GetNameDefCap] ติดตอเราเรื่องเอกราชของพวกเขา"
 congo_independence_struggle.2.d: "เราเพิ่งไดรับการติดตอจากกลุมที่อางวาเปนตัวแทนขบวนการเอกราชของดินแดนในอาณานิคมของเรา [COG.GetNameDef] แมฝายบริหารอาณานิคมที่นั่นจะรับรูถึงกระแสเรียกรองเอกราชที่เพิ่มขึ้นมาระยะหนึ่งแลว แตความกลาที่จะรองขอจริง ๆ ก็ทําใหพวกเขาประหลาดใจอยูบาง พวกเขาเตือนเราวามีการสนับสนุนอยางกวางขวางในทองถิ่นตอเปาหมายการเปนชาติเสรีและเอกราช และหากเราเลือกตอบโตรุนแรงเกินไป อาจนําไปสูความรุนแรงหรือแมแตสงคราม \n\nเรายังตองคํานึงถึงพันธกรณีและเกียรติภูมิในระดับโลกดวย ดังนั้น ขอเสนอที่เปนการทูตที่สุดคือใหพวกเขาเขารวมกับเราในฐานะหุนสวนที่เทาเทียมในเครือจักรภพ[BEL.GetAdjective] \n\nอีกทางหนึ่ง ความมั่งคั่งสวนสําคัญของเรามาจากดินแดนนั้น และการเงินของเราจะไดรับผลกระทบหนักเปนพิเศษหากสูญเสียไป เราอาจขอใหพวกเขาจายคาอิสรภาพ ในราคาที่คอนขางสูง \n\nสุดทาย เราสามารถปฏิเสธไปเลย และระดมกําลังเพื่อเปนการเตือนการลุกฮือใด ๆ ที่อาจเกิดขึ้น"
 congo_independence_struggle.2.a: "ตราบใดที่พวกเขายังสูเคียงขางเรา"
 congo_independence_struggle.2.b: "ก็ได แตพวกเขาตองจายคาชดเชยกอนใหญใหเรา"
 congo_independence_struggle.2.c: "เราจะไมมีวันปลอยพวกเขาไปโดยดี!"

 congo_independence_struggle.3.t: "[FROM.GetNameDefCap] จะใหอิสรภาพแกเราหากเราเขารวมฝายของพวกเขา"
 congo_independence_struggle.3.d: "เราไดรับขาวจาก[BEL.GetName] พวกเขายอมรับวายุคของจักรวรรดิอาณานิคมกําลังจะสิ้นสุดในไมชา จึงยื่นขอเสนอใหเราเขารวมเครือจักรภพ[Bel.GetAdjective]ในฐานะชาติเสรีและเอกราช และในฐานะหุนสวนที่เทาเทียม เรายังคงตองผูกพันตามเงื่อนไขเดียวกับพันธมิตรทางทหารอื่น ๆ จึงจะถูกคาดหวังใหเขารวมสงครามดวยกัน \n\nนี่นาจะเปนผลลัพธทางการทูตที่ดีที่สุดที่เราหวังได และจะชวยใหเราหลีกเลี่ยงการนองเลือดกับมิตรชาวยุโรปไดทั้งหมด พรอมทั้งธํารงศักดิ์ศรีและเอกราชของแอฟริกา"
 congo_independence_struggle.3.a: "ฟงดูสมเหตุสมผลมาก เรายอมรับ!"
 congo_independence_struggle.3.b: "เราไมอาจยอมรับเงื่อนไขเหลานั้นได..."

 congo_independence_struggle.4.t: "[FROM.GetNameDefCap] จะใหเราเปนอิสระหากเราจายคาชดเชย"
 congo_independence_struggle.4.d: "เราไดรับขาวจาก[BEL.GetName] และพวกเขาไดตั้งราคาใหเอกราชของเราอยางแทจริง พวกเขาเตือนเราถึงเงินทุนจํานวนมหาศาลที่ลงทุนในชาติของเรา ตั้งแตการวางรางรถไฟระยะทางยาวเหยียด การพัฒนาศักยภาพเหมืองแร ไปจนถึงการขยายโครงสรางพื้นฐานโดยทั่วไป \n\nในตอนนั้นมีการอางวานี่เปนสวนหนึ่งของความรับผิดชอบที่มีตอเราในฐานะเจาอาณานิคม และเปนเพียงสวนหนึ่งของกระบวนการสรางอารยธรรมใหชาติ แตบัดนี้พวกเขากลับใชมันเปนหลักประกันกดดันเรา เพื่อรักษาความภักดีของเราตอไปผานการพึ่งพาทางเศรษฐกิจ \n\nราคาที่เรียกรองไมใชสิ่งที่เกินเอื้อม แตสูงอยางยิ่งและจะทําใหชาติของเรายากจนในระยะสั้น และทําใหเราผูกมัดกับพวกเขาดวยหนี้สินไปอีกนานหลังจากนั้น คําถามตอนนี้คือ สิ่งนี้คุมกับราคาของเอกราชหรือไม หรือควรจายดวยเลือด?"  
 congo_independence_struggle.4.a: "เราจะหาเงินทุนมาใหได ไมทางใดก็ทางหนึ่ง"
 congo_independence_struggle.4.b: "เราไมอาจยอมรับเงื่อนไขเหลานั้นได..."

 congo_independence_struggle.5.t: "ปลอย[FROM.GetNameDef]ไป"
 congo_independence_struggle.5.d: "เราเพิ่งไดรับขาวจากเอกอัครราชทูตคนใหมของ[COG.GetName] ประกาศวาพวกเขายอมรับขอเสนอเอกราชจากการปกครองอาณานิคมของ[BEL.GetAdjective] แลกกับการเขารวมเครือจักรภพ[BEL.GetAdjective]ในฐานะสมาชิกเต็มตัวที่เทาเทียม บัดนี้งานถอนการบริหารออกจากสํานักงานอาณานิคมและมอบความรับผิดชอบนี้ใหรัฐบาลใหมของพวกเขาไดเริ่มขึ้นแลว"
 congo_independence_struggle.5.a: "ภารกิจของเราสิ้นสุดลงแลว!"

 congo_independence_struggle.6.t: "[FROM.GetNameDefCap] ไมยอมรับเงื่อนไขของเรา"
 congo_independence_struggle.6.d: "ปรากฏวา[COG.GetNameDef]ปฏิเสธขอเสนออันเอื้อเฟอของเราสําหรับเสนทางสูเอกราชอยางสันติและเปนประโยชนรวมกัน ดังนั้นจึงขึ้นอยูกับเราแลววาจะยึดอาณานิคมดื้อรั้นนี้ไวดวยกําลังมากนอยเพียงใด เรามีสามทางเลือกดังนี้;\n\nทางเลือกแรก หากเราเชื่อวาความมุงมั่นที่จะไดเอกราชของพวกเขากําลังสั่นคลอน เราอาจเสนอสถานะจังหวัดโพนทะเล ซึ่งเทากับเปลี่ยนพวกเขาจากสินทรัพยอาณานิคมเปนสวนหนึ่งที่อยูหางไกลของประเทศเราโดยแท โดยมีอํานาจปกครองตนเองจํากัดมาก \n\nทางเลือกที่สองคือยั่วยุใหพวกเขาเปดฉากความขัดแยง แลวแสดงแสนยานุภาพเหนือพวกเขาในสนามรบ นี่เปนการเสี่ยงมากกวา แตหากเราชนะ หนทางสูการครอบงําโดยสมบูรณจะเปดออก และเราจะยึดทรัพยสินทั้งหมดของพวกเขาไดโดยไมถูกนานาชาติประณาม \n\nทางเลือกที่สามเปนการทูตที่สุด คือเราใชแบบอยางคลายจักรวรรดิบริติช โดยให[COG.GetNameDef]ไดสิทธิ์เปนดินแดนปกครองตนเอง การตัดสินใจทางการทูตของพวกเขายังคงเปนของเรา แตนอกนั้นอํานาจปกครองตนเองของพวกเขาจะขยายออกไปอยางมาก \n\nอยางไรก็ตาม เราควรตระหนักวาหากพวกเขาปฏิเสธขอใดขอหนึ่งเหลานี้ ก็คงไมมีทางอื่นนอกจากความรุนแรง"
 congo_independence_struggle.6.a: "เรียกรองใหพวกเขาเปนจังหวัดโพนทะเล"
 congo_independence_struggle.6.b: "ถาอยางนั้นก็ไมตองเจรจากันแลว"
 congo_independence_struggle.6.c: "ใชการทูตตอไป บางทีพวกเขาอาจยอมเปนดินแดนปกครองตนเอง?"

 congo_independence_struggle.7.t: "ปลอย[FROM.GetNameDef]ไป"
 congo_independence_struggle.7.d: "เราเพิ่งไดรับขาวจากเอกอัครราชทูตคนใหมของ[COG.GetNameDef] ประกาศวาพวกเขายอมรับขอเสนอใหซื้อเอกราชจากการปกครองอาณานิคมของเรา บัดนี้งานถอนการบริหารออกจากสํานักงานอาณานิคมและมอบความรับผิดชอบนี้ใหรัฐบาลใหมของพวกเขาไดเริ่มขึ้นแลว และแนนอนวาตองจัดตั้งบัญชีธนาคารและบริษัทโฮลดิ้งเพื่อเริ่มรับเงินที่พึงได"
 congo_independence_struggle.7.a: "ภารกิจของเราสิ้นสุดลง แตผลกําไรของเรายังไมสิ้นสุด!"

 congo_independence_struggle.8.t: "[FROM.GetNameDefCap] ตองการใหเราเปนจังหวัดโพนทะเล"
 congo_independence_struggle.8.d: "ดูเหมือน[BEL.GetName]คิดวาเราไมสามารถชิงเอกราชจากพวกเขาดวยกําลังได และไดทาทายคําขูของเรา พวกเขาเสนอ "โอกาส" ใหเราเปนจังหวัดโพนทะเล ซึ่งโดยพื้นฐานแลวคือการทําใหเราเปนสวนขยายของชาติพวกเขา ไดสิทธิ์ความเปนพลเมืองแตไมมีอํานาจปกครองตนเองที่จะกําหนดอนาคตของตนเอง พวกเขาอาจถูกที่วาเราขาดกําลังทหารที่จะตอตาน แตทายที่สุดการตัดสินใจก็เปนของเรา"
 congo_independence_struggle.8.a: "ก็ได เรายอมรับ..."
 congo_independence_struggle.8.b: "นี่เปนสิ่งที่ยอมรับไมได เราเรียกรองเอกราชโดยสมบูรณ!"

 congo_independence_struggle.9.t: "ฟอรซปูบลิกโจมตีกองกําลังของเราในเลโอโปลดวิลล"
 congo_independence_struggle.9.d: "รุงอรุณเชานี้เริ่มตนดวยเสียงปน เมื่อกลุมกบฏในฟอรซปูบลิกบุกโจมตีอาคารรัฐบาลในเลโอโปลดวิลล ทหารยามผูภักดียิงตอบโตและผลักดันกบฏกลับไปได อยางไรก็ตาม ความตึงเครียดสูงอยางยิ่ง และมีรายงานการกอกบฏเพิ่มเติมทั่วหนวยตาง ๆ ของฟอรซปูบลิก ขณะที่กองกําลังติดอาวุธทองถิ่นเริ่มติดอาวุธและรวมตัวกันทั่วคองโก"
 congo_independence_struggle.9.a: "วิกฤตกําลังกอตัวในคองโก"

 congo_independence_struggle.22.t: "การกอตั้งจังหวัดโพนทะเลแหงใหม"
 congo_independence_struggle.22.d: "เราไดรับขาวจากคณะผูแทนของ[COG.GetNameDef]ที่ถูกตําหนิอยางหนัก วาพวกเขาตัดสินใจยอมรับสถานะเปนจังหวัดโพนทะเลของ[BEL.GetName] สํานักงานสัญชาติและภาษีของเราไดเริ่มรางเอกสารเพื่อผนวกพลเมืองใหมเหลานี้เขาสูระบบของเราอยางถูกตอง และสํานักงานอาณานิคมไดเริ่มรางระบบการปกครองทองถิ่นแบบใหมที่ใกลเคียงกับแนวทางของ[BEL.GetAdjective]มากขึ้น"
 congo_independence_struggle.22.a: "เราหลอกพวกเขาไดสําเร็จ!"

 congo_independence_struggle.23.t: "[FROM.GetNameDefCap] ตองการใหเราเปนดินแดนปกครองตนเอง"
 congo_independence_struggle.23.d: "การประชุมกับนักการทูต[BEL.GetName]ของเราไดผล และดูเหมือนวาพวกเขายังตองการเดินตามแนวทางการทูต พวกเขาเสนอใหเรามีอํานาจปกครองตนเองมากขึ้นในฐานะดินแดนปกครองตนเอง คลายกับแบบอยางของบริติช เรายังคงตองปฏิบัติตามการทูตของ[BEL.GetAdjective] แตจะมีสิทธิ์ปกครองตนเองมากขึ้นอยางมาก ขณะที่ยังอยูภายใตการคุมครองของพวกเขา"
 congo_independence_struggle.23.a: "ใช เรายอมรับได"
 congo_independence_struggle.23.b: "นี่เปนสิ่งที่ยอมรับไมได เราเรียกรองเอกราชโดยสมบูรณ!"

 congo_independence_struggle.10.t: "[FROM.GetNameDefCap] ยินดียอมรับสถานะดินแดนปกครองตนเอง"
 congo_independence_struggle.10.d: "เราเพิ่งไดรับคําตอบจาก[COG.GetNameDef]เกี่ยวกับขอเสนอยกสถานะพวกเขาเปนดินแดนปกครองตนเอง และพวกเขาตกลงแลว! \n\nเมื่อเห็นวาพวกเขายินดีเจรจา หากเรากดดันอีกสักหนอย อาจตอรองใหพวกเขายอมลงไดอีก แตก็มีความเสี่ยง เราอาจเสียพวกเขาไปทั้งหมด หรือแยกวานั้นคือตอนพวกเขาจนมุม"
 congo_independence_struggle.10.a: "เราพอใจใหพวกเขาเปนดินแดนปกครองตนเอง"
 congo_independence_struggle.10.b: "ไม เราผลักดันใหพวกเขาผนวกรวมมากขึ้นได"

 congo_independence_struggle.11.t: "การสถาปนาดินแดนปกครองตนเองคองโก"
 congo_independence_struggle.11.d: "ตามขอตกลงกับ[BEL.GetName] เราไดวางศิลาฤกษเมื่อเชานี้เพื่อเริ่มกอสรางอาคารรัฐบาลแหงใหมสําหรับรัฐสภาดินแดนปกครองตนเอง ขั้นตอไปคือเริ่มกระบวนการรางรัฐธรรมนูญและจัดการเลือกตั้งครั้งแรก จากจุดเริ่มตนอันเรียบงายนี้ เราจะเริ่มหลอหลอมอัตลักษณทางการเมืองในอนาคตของชาตินี้ได"
 congo_independence_struggle.11.a: "ถึงเวลาลงมือทํางาน และสรางดินแดนปกครองตนเองใหมของเราแลว!"

 congo_independence_struggle.12.t: "[FROM.GetNameDefCap] ปฏิเสธทางออกแบบดินแดนปกครองตนเอง"
 congo_independence_struggle.12.d: "อยางนาตกตะลึง [BEL.GetName]ตัดสินใจถอนขอเสนอการกอตั้งดินแดนปกครองตนเอง! เราไมแนใจนักวาอะไรทําใหทาทีเปลี่ยนไป บางทีหลังจากยอมถอยไปครั้งหนึ่ง เจาอาณานิคมก็กําลังทําสิ่งที่ถนัดที่สุด คือฉวยประโยชนจากสถานการณ เราตองตัดสินใจวาจะตอบโตการหยามเกียรตินี้อยางไร"
 congo_independence_struggle.12.a: "นี่เปนสิ่งที่ยอมรับไมได! ขูวาจะใชกําลัง"
 congo_independence_struggle.12.b: "เราควรถอย ดินแดนโพนทะเลก็ไมไดแยนัก"

 congo_independence_struggle.13.t: "คองโกยอมถอยและตกลงเปนดินแดนโพนทะเล"
 congo_independence_struggle.13.d: "กลอุบายทางการทูตของเราตอ[COG.GetName]ไดผล! คณะผูแทนของพวกเขามาพบเราวันนี้เพื่อยอมรับสถานะดินแดนโพนทะเล"
 congo_independence_struggle.13.a: "เยี่ยมเลย!"

 congo_independence_struggle.14.t: "[FROM.GetNameDefCap] ขูจะทําสงคราม"
 congo_independence_struggle.14.d: "ผูแทนที่แข็งกราวอยางยิ่งจาก[COG.GetNameDef]ไดพบกับผูวาการอาณานิคมกอนหนานี้ ดวยความหงุดหงิดอยางเห็นไดชัดตอความคืบหนาของการเจรจาที่ผานมา พวกเขาไดยื่นคําขาด \n\nไมเรายอมรับเอกราชของพวกเขาโดยมีผลทันที ก็พวกเขาจะลั่นระฆังแหงเสรีภาพตอตานเรา เราไดรับรายงานแลววามีหนวยกองกําลังติดอาวุธกําลังรวมตัว และเกิดการปะทะหลายครั้งกับกองรักษาการณของฟอรซปูบลิก ยังไมมีใครเสียชีวิต แตดวยความตึงเครียดระดับนี้ก็เปนเพียงเรื่องของเวลา"
 congo_independence_struggle.14.a: "ถาเชนนั้นพวกเขาจะไดสงคราม! [COG.GetNameDef]เปนของเรา!"
 congo_independence_struggle.14.b: "ตอนนี้เรากระจายกําลังเกินตัวเกินไป มอบอิสรภาพที่พวกเขาปรารถนาใหไป"

 congo_independence_struggle.15.t: "[FROM.GetNameDefCap] จะไมจากไปโดยไมสู"
 congo_independence_struggle.15.d: "หนวยฟอรซปูบลิกฝายภักดีพยายามกวาดจับผูนําขบวนการเอกราชในวันนี้ กองกําลังติดอาวุธ[COG.GetAdjective]เขาขัดขวาง และเกิดการยิงตอบโตกัน ดูเหมือนการทูตลมเหลวแลว และสงครามประกาศเอกราชไดเริ่มขึ้นอยางเปนทางการ"
 congo_independence_struggle.15.a: "เราจะไดชัยชนะ"

 congo_independence_struggle.16.t: "[FROM.GetNameDefCap] ยอมถอยและใหเอกราชแกเรา"
 congo_independence_struggle.16.d: "เรากลับมาจากปากเหวของสงครามกับเจาอาณานิคมไดสําเร็จ หรือจะพูดใหถูกคือ อดีตเจาอาณานิคม \n\nคณะผูแทนที่เราสงไปพบฝายบริหารไดพบผูวาการอาณานิคมเมื่อเชานี้ และทั้งสองฝายลงนามในเอกสารประกาศเอกราชของ[COG.GetNameDef]อยางเปนทางการ บัดนี้เราเปนชาติเสรีของเราเองแลว และการสงมอบอํานาจไดเริ่มขึ้นแลว \n\nนับจากนี้เรากุมชะตากรรมของตนเองไวอยางมั่นคง โดยไมตองจายดวยเลือด ศักดิ์ศรี หรือเงินทอง"
 congo_independence_struggle.16.a: "วันนี้เปนวันแหงการเฉลิมฉลอง!"

 congo_independence_struggle.17.t: "[FROM.GetNameDefCap] แสวงหาเอกราชไมวาจะตองแลกดวยอะไร"
 congo_independence_struggle.17.d: "เชานี้เราไดรับรายงานที่รวบรวมอยางเรงรีบทางวิทยุจากผูวาการอาณานิคมของ[COG.GetNameDef] เขาอางวาฝูงชนบุกเขาทําเนียบ ควบคุมทหารยามดวยอาวุธที่ผลิตจากตางประเทศ และยื่นคําประกาศเอกราชใสมือเขา แลวก็จากไปทันที ที่นาตกใจที่สุดคือมีขอบงชี้วาฝูงชนนี้นําโดยกลุมคนในฟอรซปูบลิก ตํารวจภูธรที่มีหนาที่รักษาความสงบเรียบรอย \n\nคําประกาศเรียกรองใหฝายบริหารอาณานิคมถอนตัวทันที และสงมอบอํานาจอันชอบธรรมแกรัฐบาลพลเรือนที่จะจัดตั้งจากแกนนําการกบฏนี้ เราตองไมหลงคิดวาความเสี่ยงนี้ไมจริง และการที่ฝูงชนนี้ติดอาวุธที่ไมใชแบบของ[BEL.GetAdjective] อาจบงชี้วามีตางชาติเขามาเกี่ยวของโดยตรง และอาจสนับสนุนกบฏทางทหาร"
 congo_independence_struggle.17.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 congo_independence_struggle.17.b: "พวกเขาเพอฝน จัดกองกําลังสํารวจไปฟนฟูความสงบเรียบรอยทันที!"

 congo_independence_struggle.18.t: "[FROM.GetNameDefCap] ปลอยเราไป"
 congo_independence_struggle.18.d: "ดูเหมือนคําขาดของเราจะไดรับการพิจารณาอยางจริงจังพอสมควรจากเจาอาณานิคม เพราะวันนี้เราไดรับหนังสือรับรองเอกราชที่ลงนามแลวจากฝายบริหารอาณานิคม แผนการเชิญธง[BEL.GetAdjective]ลงอยางเปนทางการกําลังดําเนินไป พรอมกับการถายโอนอํานาจอยางสันติสูระบอบใหมของเรา แมเปาหมายหลักจะบรรลุแลว แตงานที่แทจริงในการจัดตั้งรัฐบาลเพิ่งเริ่มตน เรามีอีกมากที่ตองทํา ทั้งเศรษฐกิจที่ตองพัฒนา ความสัมพันธกับชาติอื่นที่ตองทําใหเปนปกติ และแนนอนวาหนี้บางอยางที่ตองชดใชแกผูที่สนับสนุนเราใหบรรลุความฝนนี้"
 congo_independence_struggle.18.a: "วันนี้เปนวันแหงการเฉลิมฉลอง!"

 congo_independence_struggle.19.t: "[FROM.GetNameDefCap] เตรียมทําสงคราม"
 congo_independence_struggle.19.d: "เรามีรายงานวาทหาร[BEL.GetAdjective]เริ่มระดมพลในเลโอโปลดวิลล และกวาดลางกลุมคนที่ไมภักดีทั่วฟอรซปูบลิก แมเราจะพยายามอยางดีที่สุดที่จะขมรัฐบาล[BEL.GetAdjective]ใหยอมจํานนและบรรลุเอกราชโดยไมนองเลือด แตเจาอาณานิคมเลือกรักษาอํานาจดวยวิธีเดียวที่พวกเขารูจัก นั่นคือกําลัง หนาตางแหงโอกาสของเรากําลังปดลงอยางรวดเร็ว และเราตองตัดสินใจวาจะสงสัญญาณใหผูสนับสนุนลุกฮือ หรือจะถอยกอนที่สถานการณจะบานปลายเกินควบคุม"
 congo_independence_struggle.19.a: "ชัยชนะจะเปนของเรา!"
 congo_independence_struggle.19.b: "อันตรายเกินไป เราตองถอย"

 congo_independence_struggle.20.t: "คองโกประกาศสงครามเพื่อเอกราช!"
 congo_independence_struggle.20.d: "เราใชมาตรการเทาที่ทําไดเพื่อรักษาการควบคุมสถานการณที่เลวรายลงอยางรวดเร็ว รวมถึงการกวาดลางกลุมคนทรยศในฟอรซปูบลิกอยางเปนระบบ นาเสียดายที่การกระทําที่โจงแจงกวานี้ถูกมองวาเปนการยั่วยุ และหนวยกบฏก็เปดฉากยิงใสนายทหารของตนทันทีที่เห็นเขามาใกล ดวยกระสุนเหลานี้ สงครามประกาศเอกราชไดเริ่มขึ้นอยางจริงจัง และหลุดจากการควบคุมของทั้งสองฝายไปแลว \n\nมีบางพื้นที่ที่ยังภักดีตอเรา เพราะไดรับประโยชนจากการลาอาณานิคมโดยตรงที่สุด แตประเทศสวนใหญไดตั้งตนเปนปฏิปกษกับเราแลว"
 congo_independence_struggle.20.a: "จับอาวุธขึ้นเถิดพี่นอง!"

 congo_independence_struggle.21.t: "คองโกยอมถอยและตกลงเปนดินแดนโพนทะเล"
 congo_independence_struggle.21.d: "การตอบสนองอยางรวดเร็วของเราตอสถานการณในคองโกดูเหมือนจะชวยคลายความตึงเครียดที่นั่น นายทหาร[BEL.GetAdjective]เคลื่อนไหวอยางรวดเร็วเพื่อปราบกลุมกบฏที่รูจักในฟอรซปูบลิก เมื่อรักษาความภักดีของพวกเขาไวได ไฟแหงการกบฏก็มอดลงอยางรวดเร็ว และเสียงที่ดังที่สุดก็ถูกทําใหเงียบ สวนใหญดวยกําแพงหนาของคุก \n\nฝายบริหารอาณานิคมไดริเริ่มและฉวยโอกาสที่ไดรับ ขยายการควบคุมของตนไปทุกระดับของการปกครอง สงผลใหเราควบคุมอาณานิคมไดมากกวาเดิมอยางมาก"
 congo_independence_struggle.21.a: "เกียรติยศจงมีแดจักรวรรดิ[BEL.GetAdjective]!"

 congo_independence_struggle.24.t: "ฝายภักดีในเลโอโปลดวิลลยกระดับความขัดแยง"
 congo_independence_struggle.24.d: "เสียงปนทําลายความเงียบยามเชา หนวยตํารวจ[BEL.GetAdjective]ถูกสงไปควบคุมตัวกลุมผูรักชาติในฟอรซปูบลิก แตกลับถูกตอนรับดวยหากระสุน การกบฏลุกลามอยางรวดเร็ว และกองกําลังติดอาวุธเริ่มจับอาวุธขึ้นทั่วประเทศ การสนับสนุนอุดมการณนี้แพรหลายไปทั่วประเทศ แตกองกําลังอาณานิคมยังควบคุมหลายพื้นที่ไวได โดยเฉพาะพื้นที่ที่พวกเขาขูดรีดมากที่สุดและจึงมีกําลังทหารประจําอยูมากที่สุด \n\nสงครามประกาศเอกราชไดเริ่มขึ้นอยางจริงจัง และเราจะไมหยุดพักจนกวาคองโกจะปลอดจากการยึดครองของยุโรป"
 congo_independence_struggle.24.a: "นี่คือสงครามที่เราแพไมได!"

 congolese_civil_war_starting_tt: "คองโกจะประกาศสงครามประกาศเอกราชกับเรา พวกเขาจะบีบใหเกิดสันติภาพและไดเอกราชโดยสมบูรณหากควบคุม§Yเลโอโปลดวิลล§! §Yเอลีซาเบ็ทวิลล§! และ§Yสแตนลียวิลล§!ได \n\nในทํานองเดียวกัน เราจะบีบใหเกิดสันติภาพและรักษาการควบคุมพื้นที่ไวไดหากควบคุม§Yเลโอโปลดวิลล§! §Yเอลีซาเบ็ทวิลล§! และ§Yสแตนลียวิลล§!"
 congolese_civil_war_starting_congo_side_tt: "ฝายผูภักดีตอเบลเยียมจะเปดฉากสงครามกลางเมืองกับเรา เราจะบีบใหอดีตเจาอาณานิคมยอมสันติภาพและไดเอกราชโดยสมบูรณหากควบคุม§Yเลโอโปลดวิลล§! §Yเอลีซาเบ็ทวิลล§! และ§Yสแตนลียวิลล§!ได \n\nในทํานองเดียวกัน พวกเขาจะบีบใหเกิดสันติภาพและรักษาการควบคุมประเทศของเราไวไดหากควบคุม§Yเลโอโปลดวิลล§! §Yเอลีซาเบ็ทวิลล§! และ§Yสแตนลียวิลล§!"






