 GOT_guarantee_events.01.t: "การรับประกันอธิปไตยของโปแลนด"
 GOT_guarantee_events.01.desc: "เปนที่ชัดเจนวา[GER.GetLeader]ไมอาจเจรจาดวยเหตุผลได และจะไมหยุดจนกวาจะครองโลก [GER.GetLeader.GetSheHe]เชื่อมั่นวาไมมีใครกลาขวางทาง[GER.GetNameDef]และความทะเยอทะยานกับความกระหายดินแดนที่เพิ่มขึ้นเรื่อย ๆ"
 GOT_guarantee_events.01.a: "เราตองเสนอการคุมครองแกชาวโปแลนด!"
 GOT_guarantee_events.01.b: "ปลอยให[GER.GetLeader]ทําตามที่[GER.GetLeader.GetSheHe]ตองการ"


 #NEWS EVENTS
 GOT_newsevents.1.t: "การผงาดขึ้นของ[FROM.GetNameDef]"
 GOT_newsevents.1.desc: "ชาว[FROM.GetAdjective]สามารถพิชิตชาวยุโรปและสถาปนาตนเปนมหาอํานาจผูครองความเปนใหญเหนือทวีปไดสําเร็จ และไดเริ่มผนวกรวมดินแดนที่เพิ่งพิชิตมา รัฐบาล[FROM.GetAdjective]พยายามระดมประชาชนใหสนับสนุนรัฐและอุดมการณสังคมนิยม โดยเปดตัวการโฆษณาชวนเชื่อแบบรวมชาติหลายครั้งเพื่อเพิ่มการสนับสนุนจากชนชั้นกรรมาชีพ\n\n[FROM.GetLeader] ประกาศวานับจากนี้ ชนชั้นกรรมาชีพแหงยุโรปที่รวมเปนหนึ่งจะเปนที่รูจักในนาม '[From.GetNameDef]'"
 GOT_newsevents.1.a: "เราผงาดขึ้นดวยกัน"
 GOT_newsevents.1.b: "นี่ไมใชลางดี"