l_english:
 # News events 
 
 wuw_GER_news.1.t: "การรวมชาติเยอรมนี"
 wuw_GER_news.1.d: "หลังจากถูกแบงแยกเปนรัฐตาง ๆ มาเนิ่นนาน ดวยพรมแดนตามอําเภอใจที่พรากพี่นองออกจากกัน บัดนี้ชาวเยอรมันจะไดชื่นชมยินดีอีกครั้ง เมื่อรัฐเยอรมันใหมกําลังผงาดขึ้น หลังความสําเร็จทางการเมืองเมื่อไมนานมานี้ [FROM.GetLeader] ไดแสดงใหเห็นถึงจิตวิญญาณของบิสมารก และประกาศการรวมชาติเยอรมนี ชาติที่จะยืนหยัดไปอีกพันป!"
 wuw_GER_news.1.a: "ในที่สุดเยอรมนีก็กลับมาเปนหนึ่งเดียวอีกครั้ง"
 wuw_GER_news.1.b: "นี่เปนเพียงจุดเริ่มตน"

 wuw_GER_news.2.t: "การลุกฮือในไซลีเซีย"
 wuw_GER_news.2.desc: "นับเปนครั้งที่สี่นับตั้งแตการลงนามสนธิสัญญาแวรซาย ที่กลุมกบฏในไซลีเซียของเยอรมนีลุกฮือขึ้นตอตานรัฐบาล ครั้งนี้ [SIL.GetLeader] อางวาเปาหมายหลักของปฏิบัติการทางทหารคือการไดมาซึ่งเอกราชของรัฐไซลีเซีย พรอมกับปกปองชาวไซลีเซียจากภยันตรายในระหวางสงครามกลางเมืองเยอรมัน แมวาการกบฏครั้งกอน ๆ จะมีเปาหมายเพื่อใหไดอํานาจปกครองตนเองภายในรัฐโปแลนดก็ตาม เวลาเทานั้นที่จะบอกไดวาพวกเขาจะตานทานกองทัพเยอรมันไดหรือไม"
 wuw_GER_news.2.a: "สถานการณพลิกผันที่นาสนใจ"
 wuw_GER_news.2.b: "พวกเขาเคยพยายามและลมเหลวมาแลว"
 wuw_GER_news.2.c: "นี่คือชวงเวลาของเรา!"
 wuw_GER_news.2.d: "หวังวาครั้งนี้พวกเขาจะสําเร็จ"



 # Austrian events

 AUS_political_events.1.t: "ชะตากรรมของ Creditanstalt-Bankverein"
 AUS_political_events.1.desc: "เราไดทราบวาการควบรวมธนาคารในป 1934 ซึ่ง Creditanstalt ที่ไดรับการเพิ่มทุนใหมไดเขาครอบครองสินทรัพยและหนี้สินทั้งหมดของ Wiener Bankverein รวมถึงกิจการที่ยังดําเนินไดของ Niederösterreichische Escompte-Gesellschaft ไดยอนกลับมาเลนงานเรา เพราะมันขัดขวางการพัฒนาเศรษฐกิจของเราอยางมาก และสรางการผูกขาดในภาคการเงินขึ้นโดยไมตั้งใจ เมื่อตอนนี้เรากําลังกํากับดูแลภาคสวนนี้ เราควรจัดการกับสถานการณนี้อยางไร?"
 AUS_political_events.1.a: "คงไวอยางเดิมจะปลอดภัยที่สุด"
 AUS_political_events.1.a_tt: "จะไมมีการเปลี่ยนแปลงใด ๆ ตอกลุมอุตสาหกรรมของเรา Creditanstalt-Bankverein จะยังคงพรอมใชงาน โดยให:"
 AUS_political_events.1.b: "Österreichische Creditanstalt คือทางเลือกที่ฉลาดที่สุด"
 AUS_political_events.1.c: "Wiener Bankverein จะไมทําใหเราผิดหวัง"
 AUS_reestablish_creditanstalt: "Creditanstalt-Bankverein จะถูกยุบ และ Österreichische Creditanstalt ที่ตั้งขึ้นใหมจะไดรับการสนับสนุนจากเราอยางเต็มที่"
 AUS_reestablish_benkverein: "Creditanstalt-Bankverein จะถูกยุบ และ Wiener Bankverein ที่ตั้งขึ้นใหมจะไดรับการสนับสนุนจากเราอยางเต็มที่"

 AUS_political_events.2.t: "เรื่องอื้อฉาวของบริษัทประกันภัยเฟอนิกซ"
 AUS_political_events.2.desc: "ไมนานหลังการเสียชีวิตของวิลเฮลม แบรลีเนอร ผูอํานวยการใหญที่เปนที่รัก บริษัทประกันภัยเฟอนิกซก็ประสบปญหาหนักขึ้นอีก เอแบรฮารด ไรนิงเฮาส ผูอํานวยการที่เพิ่งไดรับแตงตั้ง ไดนํางบดุลที่ถูกปลอมแปลงมาแจงใหรัฐบาลทราบ ซึ่งเผยใหเห็นการขาดดุลยอนหลังไปถึงป 1929 รวมกวา 250 ลานชิลลิง \n \n บริษัทไดประกาศลมละลายและหยุดดําเนินกิจการทันที ประกันผูเขารวมสงครามที่ไดรับความนิยมอยางมากตองยุติลงอยางกะทันหัน กอใหเกิดเสียงโวยวายจากผูคนจํานวนมากที่พึ่งพาเงินชดเชยจากประกันนี้"
 AUS_political_events.2.a: "แยจริง ๆ!"
 AUS_political_events.2.b: "เราจะรับภาระจายเงินชดเชยเอง!"
 AUS_political_events.2.b_tt: "การรับภาระประกันภัยนี้จะทําใหเราสามารถฟนฟูบริษัทประกันภัยเฟอนิกซไดในภายหลัง"

 AUS_political_events.3.t: "การฟนฟูกําลังทหารของเยอรมนีสรางความกังวลอยางกวางขวาง"
 AUS_political_events.3.desc: "การฟนฟูกําลังทหารในไรนแลนดเมื่อไมนานมานี้สรางความกังวลอยางมากในหมูประชาชนของเรา ภายในรัฐบาลของเรามีการตั้งคําถามวา 'เราจะเปนรายตอไปหรือไม?' แมทานผูนําจะยืนยันมาตลอดวาการผนวกออสเตรียไมไดอยูในความสนใจของเขา แตเราตองพิจารณาวาการกระทําเชนนั้นอาจไมใชเรื่องที่เปนไปไมไดอีกตอไป"
 AUS_political_events.3.a: "เราควรเตรียมรับมือกับสิ่งที่เลวรายที่สุด..."
 AUS_political_events.3.a_tt: "ปลดล็อกการตัดสินใจ §Yมาตรการตอตานอันชลุส§!"

 AUS_political_events.4.t: "การเปลี่ยนความคิดเห็น"
 AUS_political_events.4.desc: "พระคารดินัลเทโอดอร อินนิทเซอร ซึ่งกอนหนานี้แสดงตนเปนฟาสซิสตอยางเปดเผย ไดเปลี่ยนวาทศิลปของตนไปอยางสิ้นเชิงเมื่อไมนานมานี้ จากที่เคยสนับสนุนลัทธินาซีและทานผูนํา[GER.GetAdjective]อยางเปดเผยและโจงแจง ในพิธีมิสซาเมื่อวันที่ 7 ตุลาคม เขากลับแสดงจุดยืนตอตานทานผูนําอยางชัดเจน แทนที่จะเทศนาตามปกติวามวลชนควรฝากศรัทธาไวกับ [GER.GetLeader] บัดนี้เขากลับชี้นําพวกเขากลับไปหาพระผูเปนเจา \n \n ผูนํา[GER.GetAdjective]โกรธจัดและตองการใหเราดําเนินการ"
 AUS_political_events.4.a: "กําจัดคนทรยศ!"
 AUS_political_events.4.b: "คุณอินนิทเซอรมีสิทธิ์ในความคิดเห็นของตนเอง"

 AUS_political_events.5.t: "[AUS.GetNameDefCap] ขอความรวมมือระหวางกองทัพอากาศของเรา"
 AUS_political_events.5.desc: "ขอเสนอจากนักการทูต[AUS.GetAdjective]ในประเทศของเราเพิ่งมาถึง เมื่อพนจากพันธะของสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล พวกเขาตองการสรางกองทัพขึ้นใหม ซึ่งพวกเขายืนยันวาเพื่อการปองกัน ประเทศของพวกเขามีประวัติการสรางโครงเครื่องบินที่คอนขางแข็งแรงทนทานและมีนักบินฝมือดีอยูไมนอย แตดวยชองวางในการผลิตและการฝก ตอนนี้พวกเขาจึงเผชิญความทาทายในการฟนฟูขีดความสามารถนี้ หากเราพรอมจะมองขามการกระทําของพวกเขาในมหาสงคราม เราก็อาจไดประโยชนจากความรวมมือนี้"
 AUS_political_events.5.a: "คุมคา เราจะชวยใหมากที่สุดเทาที่ทําได!"
 AUS_political_events.5.b: "เราเรียนรูที่จะทํางานรวมกันได"
 AUS_political_events.5.c: "เราไมเชื่อคําโกหกเรื่อง 'การปองกัน' ของพวกเขาหรอก"

 AUS_political_events.6.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเราและใหสิทธิ์ซื้อยุทโธปกรณ"
 AUS_political_events.6.desc: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเราเรื่องความรวมมือในการเสริมสรางกองทัพอากาศและแบงปนประสบการณอยางดี พวกเขาเห็นถึงความยากลําบากที่เราเผชิญหลังหลุดพนจากสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล และยังเสนอโอกาสใหเราซื้อยุทโธปกรณสวนเกินจากพวกเขาอีกดวย!"
 AUS_political_events.6.a: "ดื่มฉลองใหกับความรวมมืออันยิ่งใหญ!"

 AUS_political_events.7.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเรา"
 AUS_political_events.7.desc: "[FROM.GetNameDefCap] ตอบรับขอเสนอลาสุดของเราเรื่องความรวมมือในการเสริมสรางกองทัพอากาศของแตละฝายคอนขางดี แมพวกเขาจะไมสามารถใหการสนับสนุนดานวัตถุได แตก็ตกลงที่จะแบงปนวิธีการฝกนักบินลาสุดบางสวนของพวกเขา"
 AUS_political_events.7.a: "ยอดเยี่ยม!"

 AUS_political_events.8.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอความรวมมือของเรา"
 AUS_political_events.8.desc: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา โดยระบุวาขอตกลงนี้ไมสมดุล ไมเปนประโยชนตอพวกเขาเลย และเราเปนผูทําใหตัวเองตกอยูในสถานการณนี้จากการกระทําของเราในมหาสงครามเอง"
 AUS_political_events.8.a: "แลวสถานการณนี้จะเปนประโยชนอะไรกับพวกเขาละ?"
 AUS_air_force_partnership_big: "ความรวมมือดานกองทัพอากาศอยางกวางขวาง"
 AUS_air_force_partnership_small: "ความรวมมือดานกองทัพอากาศ"
 AUS_rejected_air_force_partnership: "ความรวมมือดานกองทัพอากาศถูกปฏิเสธ"

 AUS_political_events.9.t: "วิลเฮลม เซหเนอร ถูกลอบสังหาร"
 AUS_political_events.9.desc: "วิลเฮลม เซหเนอร หนึ่งในสมาชิกกองบัญชาการทหารสูงสุดของเรา ถูกพบเปนศพในอพารตเมนตของเขา นักการทูต[GER.GetAdjective]ปฏิเสธทุกอยางและอางวาไมไดมีสวนเกี่ยวของ และเซหเนอรคงลงมือเองดวยปนที่พบอยูกับตัว แตการสืบสวนคดีอาญากลับชี้ไปในทิศทางที่แตกตางออกไปโดยสิ้นเชิง..."
 AUS_political_events.9.a: "ชาว[GER.GetAdjective]เปนทั้งคนโกหกและฆาตกรสินะ..."
 AUS_political_events.9.a_tt: "§Yวิลเฮลม เซหเนอร§!§R ถูกสังหาร!§!"
 AUS_anschluss_ratio_lowered: "§Yความแข็งแกรงในการรบรวมของกองทัพ§! ที่ตองใชสําหรับ §Yอันชลุส§! จะ§Yลดลง§!"
 AUS_anschluss_ratio_raised: "§Yความแข็งแกรงในการรบรวมของกองทัพ§! ที่ตองใชสําหรับ §Yอันชลุส§! จะ§Yเพิ่มขึ้น§!"

 AUS_political_events.10.t: "การลอบสังหารวิลเฮลม เซหเนอร ถูกขัดขวาง"
 AUS_political_events.10.desc: "เมื่อเย็นวานนี้ เกสตาโปบุกเขาไปในอพารตเมนตของวิลเฮลม เซหเนอร และตองเผชิญหนากับทหารยามที่เราวางกําลังไวรอบกองบัญชาการสูงสุดของเรา การตอสูกินเวลาไมนาน และเซหเนอรก็รอดพนจากเหตุปะทะมาไดโดยไมบาดเจ็บแมแตนอย"
 AUS_political_events.10.a: "เรารูอยูแลว!"

 AUS_political_events.11.t: "[GER.GetNameDefCap] แสดงความไมพอใจตอกองบัญชาการทหารสูงสุดของเรา"
 AUS_political_events.11.desc: "นักการทูตจาก [GER.GetNameDef] ไดแสดงความกังวลเกี่ยวกับสมาชิกคนหนึ่งในกองบัญชาการทหารสูงสุดของเรา พวกเขาอางวาแมเราจะเปนรัฐอธิปไตยและทําอะไรก็ไดตามตองการ แตเรื่องนี้อาจทําใหความสัมพันธทางการทูตของเรากับ [GER.GetNameDef] สั่นคลอน \n\nเราคาดไดวาพวกเขาจะลงมือจัดการเองหากเราไมทําตามผลประโยชนของพวกเขา"
 AUS_political_events.11.a: "นี่ไมใชเรื่องของพวกเขา!"
 AUS_political_events.11.a_tt: "เริ่มภารกิจ §Yความเปนปรปกษของ[GER.GetAdjective]ตอกองบัญชาการทหารสูงสุด§!\n\nหากไมสามารถปองกันการเสียชีวิตของเซหเนอรได §Yความแข็งแกรงในการรบรวมของกองทัพ§! ที่ตองใชสําหรับ §Yอันชลุส§! จะ§Yลดลง§!"
 AUS_political_events.11.b: "ถานั่นคือสิ่งที่ตองทําเพื่อหยุดพฤติกรรมของพวกเขา..."

 AUS_political_events.12.t: "[FROM.GetNameDefCap] เสนอยุทโธปกรณทหารราบใหเรา"
 AUS_political_events.12.desc: "[FROM.GetNameDefCap] ไดติดตอมาเสนอการสนับสนุนในรูปของยุทโธปกรณทหารราบ พวกเขายกยองเราในฐานะพันธมิตรที่มีคายิ่ง และหวังวาปนไรเฟลเหลานี้จะถูกใชในความพยายามทําสงครามของเราใน [ETH.GetNameDef] เพื่อชวยใหเราไดรับชัยชนะในสงครามครั้งนี้"
 AUS_political_events.12.a: "ไมคาดคิดมากอน แตยินดีรับไวอยางยิ่ง"

 AUS_political_events.13.t: "[FROM.GetNameDefCap] คัดคานการควํ่าบาตร [ITA.GetNameDef]"
 AUS_political_events.13.desc: "เราไดรับการประทวงตอการควํ่าบาตรที่เราและอีกหลายประเทศไดประกาศใชตอ [ITA.GetNameDef] ผูนํา[AUS.GetAdjective]อางวาการควํ่าบาตรนี้ไมสมเหตุสมผลและไรมูลความจริง และเรียกรองใหเรายกเลิกการควํ่าบาตร\n\nเมื่อถูกซักถามถึงเหตุผลในการประทวง ผูนําของ [FROM.GetNameDef] ปฏิเสธที่จะอธิบายเพิ่มเติม"
 AUS_political_events.13.a: "ชาว[AUS.GetAdjective]ไมมีสิทธิ์เรียกรองเชนนี้"
 AUS_political_events.13.b: "ก็ได"

 AUS_political_events.14.t: "[FROM.GetNameDefCap] ออกมาคัดคานการควํ่าบาตรตอเรา"
 AUS_political_events.14.desc: "[FROM.GetNameDefCap] เพิ่งประทวงการควํ่าบาตรที่มีตอเรา โดยกลาววาเราเปนพันธมิตรที่มีคายิ่ง และไดสงหนังสือคัดคานไปยังทุกประเทศที่ควํ่าบาตรเรา เพื่อพยายามบรรเทาสถานการณใหเราแมเพียงเล็กนอย"
 AUS_political_events.14.a: "ชางเปนการเคลื่อนไหวที่กลาหาญของชาว[FROM.GetAdjective]"

 AUS_political_events.15.t: "[FROM.GetNameDefCap] สั่งหาม DNSAP"
 AUS_political_events.15.desc: "ขาวเพิ่งมาถึงเราวารัฐบาล[FROM.GetAdjective]ไดออกคําสั่งหามพรรค DNSAP ใน [FROM.GetNameDef] กอนหนานี้มีการหามแบบหลวม ๆ มาตั้งแตป 1934 แลว แมวาทั้งพรรคการเมืองและรัฐบาลจะเพิกเฉยตอคําสั่งดังกลาวเปนสวนใหญก็ตาม เรื่องนี้บงบอกถึงทาทีที่เปลี่ยนไปของผูนํา[FROM.GetAdjective]ที่มีตอเรา \n\nนอกจากจะเปนการดูหมิ่นอยางชัดแจงแลว เรื่องนี้ยังอาจบั่นทอนอิทธิพลของเราที่มีตอ [FROM.GetNameDef] อีกดวย"
 AUS_political_events.15.a: "พวกเขาจะสลัดเราทิ้งไมไดงาย ๆ หรอก!"
 AUS_political_events.15.b: "หยาบคายสิ้นดี!"
 AUS_political_events.15.c: "ตอนนี้เราไมมีเวลาสําหรับเรื่องนั้น!"

 AUS_banned_dnsap: "DNSAP ถูกสั่งหาม"
 AUS_meddling_with_our_politics: "แทรกแซงการเมืองของเรา"

 AUS_political_events.16.t: "นาซีในรัฐบาล"
 AUS_political_events.16.desc: "ตามที่คาดไว [FROM.GetNameDef] มีปฏิกิริยาอยางรุนแรงตอการสั่งหาม DNSAP ของเราเมื่อไมนานมานี้ นอกจากขอเรียกรองที่ชัดเจนใหเรายกเลิกคําสั่งหามทันทีแลว พวกเขายังเรียกรองใหเราแตงตั้งอารทูร ไซส-อินควารท เปนที่ปรึกษาดวย พวกเขายืนกรานอยางแข็งขันในเรื่องนี้ และแมเราจะรูมาตลอดวาเขาชื่นชอบแนวทางแบบ[FROM.GetAdjective]อยางมาก แตก็ยังชวนใหสงสัยวา ทําไม?" 
 AUS_political_events.16.a: "เราตองจับตาดูเขาอยางใกลชิด" 
 AUS_political_events.16.b: "ไมมีทาง!"
 AUS_political_events.16.a_tt: "แตงตั้ง §Yอารทูร ไซส-อินควารท§! เปนที่ปรึกษาที่§Rไมสามารถปลดได§!\n"

 AUS_political_events.17.t: "[FROM.GetNameDefCap] ประทวงการสั่งหาม DNSAP ของเรา"
 AUS_political_events.17.desc: "ตามที่คาดไว [FROM.GetNameDef] มีปฏิกิริยาอยางรุนแรงตอการสั่งหาม DNSAP ของเราเมื่อไมนานมานี้ พวกเขามองวานี่เปนการโจมตีอุดมการณของพวกเขาเอง และแสดงความผิดหวังและความโกรธอยางมากตอการตัดสินใจของเรา แมเราจะมีเหตุผลอันสมควรในการสั่งหาม DNSAP แตบัดนี้ผูนํา[FROM.GetAdjective]เรียกรองใหเรายกเลิกคําสั่งหามทันที" 
 AUS_political_events.17.a: "พวกเขาไมมีสิทธิ์มาแทรกแซงการเมืองของเรา"

 AUS_political_events.18.t: "[FROM.GetNameDefCap] แตงตั้งอารทูร ไซส-อินควารท เปนที่ปรึกษา"
 AUS_political_events.18.desc: "ดูเหมือนวาชาว[FROM.GetAdjective]จะยอมฟงเหตุผลในที่สุด คําสั่งหามพรรคพี่นองของเราใน [FROM.GetNameDef] ยังคงมีผลอยู แตอยางนอยพวกเขาก็แตงตั้งอารทูร ไซส-อินควารท เปนที่ปรึกษา ทําใหเราพอจะลวงรูความเคลื่อนไหวทางการเมืองของพวกเขาไดบาง" 
 AUS_political_events.18.a: "ดี"

 AUS_political_events.19.t: "ก็อดวิน ฟอน บรูมอฟสกี เสนอตัวรับใชชาติ"
 AUS_political_events.19.desc: "ยอดนักบินขับไลที่ประสบความสําเร็จสูงสุดของเราในมหาสงครามไดมาเสนอตัวรับใชเราอีกครั้งในยามที่เราเขาสูสงคราม แมเขาจะไมไดหนุมแนนแลว และไมอาจบินไดอยางที่เคยหลังจากเฉียดตายในป 1936 แตเขาก็เสนอตัวจะนํากองทัพอากาศของเราสูชัยชนะจากภาคพื้นดิน นักบินในปจจุบันของเรายังคงใหความเคารพเขาอยางสูง และมีความเห็นกันอยางกวางขวางวาเขาจะสามารถฝกนักบินของเราใหยิ่งใหญทัดเทียมตัวเขาเองได"
 AUS_political_events.19.a: "เราตองการความชวยเหลือทุกทางที่หาได!"
 AUS_political_events.19.b: "ดวยการที่เขามีสวนพัวพันกับรัฐประหารป 1934 เราเสี่ยงไมได"
 AUS_von_brumowski_recruited_flag: "รับก็อดวิน ฟอน บรูมอฟสกี เขาประจําการแลว"

 AUS_political_events.20.t: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเรา"
 AUS_political_events.20.desc: "[GetGuarantorFlavorText]"
 AUS_guarantor_is_italy_key: "[FROM.GetNameDefCap] ไดสงนายพลและผูชวยทูตทหารเปนครั้งคราว เอมีล ลีบิทซกี มาหาเราพรอมคําขอความชวยเหลือ เขาและคนอื่น ๆ ในหมูผูนํา[FROM.GetAdjective]ไดเห็นแนวโนมที่นากังวลจาก [GER.GetNameDef] และตอนนี้ตองการการสนับสนุนจากเราอยางเปนทางการมากขึ้น ในกรณีที่การประเมินสถานการณของพวกเขาถูกตองจริง \n\nในฐานะภาคีที่ลงนามในสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล เรานาจะถูกคาดหวังใหชวยเหลือพวกเขา แมวาคงหาชองโหวในตัวบทไดก็ตาม"
 AUS_guarantor_is_not_italy_key: "[FROM.GetNameDefCap] ไดสงเอกอัครราชทูตมาขอความชวยเหลือจากเรา ผูนํา[FROM.GetAdjective]ไดเห็นแนวโนมที่นากังวลจากผูนําของ [GER.GetNameDef] และเนื่องจากพวกเขาไมสามารถระดมพลเพื่อรับมือภัยคุกคามไดเพราะสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล ตอนนี้พวกเขาจึงขอการสนับสนุนจากเราอยางเปนทางการมากขึ้น ในสนธิสัญญาและสัญญาที่ตามมา เราไดตกลงที่จะชวยเหลือพวกเขา แตไมมีการระบุไววาการสนับสนุนนี้ควรมีลักษณะอยางไร"
 AUS_political_events.20.a: "เอกราชของพวกเขามีความสําคัญสูงสุดสําหรับเรา!"
 AUS_political_events.20.b: "เราจะสนับสนุนพวกเขาทางการทูต"
 AUS_political_events.20.c: "บางทีเราอาจบรรลุขอตกลงที่เปนประโยชนตอทั้งสองฝาย"
 AUS_political_events.20.d: "เราจะไมเสี่ยงอะไรเพื่อพวกเขา"

 AUS_political_events.21.t: "[FROM.GetNameDefCap] รับประกันเอกราชของเรา"
 AUS_political_events.21.desc: "ตามที่ระบุไวในสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล [FROM.GetNameDef] ไดตกลงที่จะรับประกันเอกราชของเรา และเพื่อความมั่นใจ พวกเขายังเปดทางใหเราจัดหายุทโธปกรณบางสวนดวย เนื่องจากขณะนี้เรายังไมอยูในสภาพที่จะผลิตยุทโธปกรณเองได"
 AUS_political_events.21.a: "ยอดเยี่ยม!"

 AUS_political_events.22.t: "[FROM.GetNameDefCap] สนับสนุนเอกราชของเราทางการทูต"
 AUS_political_events.22.desc: "ดวยการใชประโยชนจากขอกําหนดที่ไมคอยเปนที่รูจักและรายละเอียดปลีกยอย [FROM.GetNameDef] ตัดสินใจที่จะไมใหการรับประกันแกเรา แตเสนอเพียงการสนับสนุนทางการทูตในกรณีที่เกิดการรุกราน พวกเขาอางวามั่นใจวาคําพูดของพวกเขาสามารถโนมนาว [GER.GetLeader] ไดดีพอ ๆ กับการขูวาจะเขาแทรกแซง จึงไมเห็นเหตุผลที่จะตองเตรียมกําลังพลไวเพื่อเรา"
 AUS_political_events.22.a: "ไมใชสิ่งที่เราขอ แตก็ดีกวาไมมีอะไรเลย"
 AUS_political_events.22.b: "การทูตและยุทโธปกรณชวยเราไมไดหรอก!"

 AUS_political_events.23.t: "[FROM.GetNameDefCap] เสนอการรับประกันแบบมีเงื่อนไข"
 AUS_political_events.23.desc: "[FROM.GetNameDefCap] ตอบคําขอความชวยเหลือของเราดวยคําขอของพวกเขาเอง นับตั้งแตสนธิสัญญานี้ถูกบังคับใชกับเรา เราพยายามยึดอัลโตอาดีเจและเตรนตีโนกลับคืนมาเปนของเรา เพราะดินแดนเหลานี้เปนของเราโดยชอบธรรม [FROM.GetNameDef] ถือวาดินแดนเหลานี้เปนของพวกเขา และหากพวกเขาจะรับประกันเอกราชของเรา พวกเขาตองการใหเราสละการอางสิทธิ์เหลานี้อยางเด็ดขาด"
 AUS_political_events.23.a: "ความปลอดภัยเฉพาะหนาของเราสําคัญกวาการอางสิทธิ์เหลานั้น"
 AUS_political_events.23.b: "พวกเขากําลังพยายามหาผลประโยชนจากความลําบากของเรา ไมมีทางเด็ดขาด"

 AUS_political_events.24.t: "[FROM.GetNameDefCap] ปฏิเสธคําขอการสนับสนุนของเรา"
 AUS_political_events.24.desc: "ดวยการใชประโยชนจากกรณียกเวน รายละเอียดปลีกยอย และขอกําหนดคลุมเครือมากมายในสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล [FROM.GetNameDef] ก็หาทางเลี่ยงไมตองสนับสนุนเราจนได เอกสารระบุไวชัดเจนวาเราจะไดรับความชวยเหลือจากภายนอกเพื่อแลกกับการที่เราไมไดรับอนุญาตใหมีกองทัพที่ดีพอ แตปรากฏวา [FROM.GetNameDef] ตัดสินใจวาเรื่องนี้ไมเกี่ยวกับพวกเขา เราคงตองพึ่งพาตนเอง"
 AUS_political_events.24.a: "เราเคยชี้ขอบกพรองนี้ใหภาคีอื่น ๆ เห็นแลวแท ๆ..."
 AUS_political_events.24.b: "เราจะใหสิ่งจูงใจพวกเขา!"

 AUS_political_events.25.t: "[FROM.GetNameDefCap] ยกเลิกการอางสิทธิ์เหนือดินแดนของเรา"
 AUS_political_events.25.desc: "[FROM.GetNameDefCap] ไดตอบสนองตอขอเรียกรองของเราใหยกเลิกการอางสิทธิ์เหนือดินแดนของเราดวยการยอมทําตาม พวกเขาไดลมเลิกแนวคิดที่จะเอาดินแดนเหลานี้เปนการแลกกับการสนับสนุนของเราโดยสิ้นเชิง"
 AUS_political_events.25.a: "ขาวดี!"

 AUS_political_events.26.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะยกเลิกการอางสิทธิ์"
 AUS_political_events.26.desc: "เราคิดวาชาว[FROM.GetAdjective]เปนชาติที่มีเหตุผล หลังจากที่พวกเขาเพิ่งมาขอความชวยเหลือจากเราเมื่อไมนานมานี้ แตปรากฏวาเราคิดผิด เมื่อถูกขอใหยกเลิกการอางสิทธิ์เหนือดินแดนที่เปนของเราโดยชอบธรรม พวกเขากลับปฏิเสธอยางไมไยดี"
 AUS_political_events.26.a: "ถาอยางนั้นก็ไมมีความชวยเหลือใด ๆ ใหพวกเขาเลย"

 AUS_political_events.27.t: "[AUS.GetNameDefCap] ตองการฟนฟูกําลังทหาร"
 AUS_political_events.27.desc: "[AUS.GetNameDefCap] ไดติดตอมาขอความเห็นชอบใหฟนฟูกําลังทหารและยกเลิกสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล โดยระบุวาพื้นที่ใกลเคียงของพวกเขากลายเปนปรปกษมากขึ้นเมื่อไมนานมานี้ และพวกเขาไมรูสึกปลอดภัยอีกตอไปหากไมมีกองทัพของตนเอง คําถามนี้ถูกสงไปยังมหาอํานาจทั้งสามที่ลงนามในสนธิสัญญา ไดแก [ITA.GetNameDef] [ENG.GetNameDef] และ [FRA.GetNameDef] รวมถึง [USA.GetNameDef] และตามสนธิสัญญา ฝายใดฝายหนึ่งในพวกเราสามารถใชสิทธิ์ยับยั้งไดหากตองการ"
 AUS_political_events.27.a: "พวกเขาไมกออันตรายอะไรหรอก"
 AUS_political_events.27.b: "ไมมีทางเด็ดขาด"

 AUS_political_events.28.t: "ผูคํ้าประกันเห็นชอบการฟนฟูกําลังทหาร"
 AUS_political_events.28.desc: "ในที่สุดเราก็ไดรับคําตอบจากบรรดาผูคํ้าประกัน และมันคุมคากับการรอคอย หลังจากการหารือและเจรจากันหลายครั้ง พวกเขาตกลงวาเราสามารถฟนฟูกําลังทหารได และประกาศใหสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล สิ้นผล เราไมตองถูกผูกมัดดวยการกระทําของบรรพบุรุษอีกตอไป"
 AUS_political_events.28.a: "ยอดเยี่ยม!"

 AUS_political_events.29.t: "ผูคํ้าประกันปฏิเสธคํารองขอฟนฟูกําลังทหาร"
 AUS_political_events.29.desc: "หลังจากการหารือที่ยาวนานและการถกเถียงหลายครั้ง บรรดาผูคํ้าประกันตัดสินใจไมอนุมัติคําขอฟนฟูกําลังทหารของเรา เราพยายามเจรจาดวยเหตุผลแลว แตคําตอบของพวกเขายังคงแนวแน แมจะมีความเสี่ยงชัดเจนตออธิปไตยและเอกราชของเรา"
 AUS_political_events.29.a: "ถาเชนนั้นเราก็ไมมีทางเลือก..."
 AUS_political_events.29.a_tt: "§Rหากเลือกตัวเลือกนี้ คุณจะยกเลิกสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล อยางถาวร แตอาจมีผลที่ตามมา§!"
 AUS_political_events.29.b: "เราตองเจรจาเรื่องนี้!"
 AUS_political_events.29.c: "พวกเขาวางกับดักใหเราลมเหลว แตเราจะทําอะไรได?"
 AUS_political_events.29.c_tt: "§Rหากเลือกตัวเลือกนี้ สนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล จะยังคงมีผลจนถึง 16 กรกฎาคม 1940§!"

 AUS_political_events.30.t: "[AUS.GetNameDefCap] ละเมิดสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล"
 AUS_political_events.30.desc: "[GetTreatyStatus]"
 AUS_treaty_asked_permission_key: "แมเราจะพยายามอยางเต็มที่เพื่อหยุดยั้ง แตรัฐบาล[AUS.GetAdjective]ก็ตัดสินใจสั่งฟนฟูกําลังทหารของ [AUS.GetNameDef] ซึ่งเปนการละเมิดสนธิสัญญาอยางชัดแจง เราหวังวาเรื่องจะไมมาถึงขั้นนี้ แตดูเหมือนจะไมมีอะไรหยุดพวกเขาจากการเดินบนเสนทางนี้ได"
 AUS_treaty_no_permission_key: "โดยไมมีการเตือนลวงหนาใด ๆ เราไดรับแจงวา [AUS.GetNameDef] จะไมปฏิบัติตามสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล และทุกสิ่งที่เกี่ยวของอีกตอไป ที่สําคัญที่สุดคือ นั่นหมายความวาพวกเขาจะฟนฟูกําลังทหารไดอยางเสรีโดยไมสนใจขอจํากัดที่ถูกกําหนดไวหลังมหาสงคราม ยังไมชัดเจนวาเหตุใดพวกเขาจึงตองการฟนฟูกําลังทหารอยางกะทันหันเชนนี้"
 AUS_political_events.30.a: "เราหยุดพวกเขาไมได แตเราถวงเวลาพวกเขาได"
 AUS_political_events.30.b: "ก็ได ปลอยพวกเขาไป"
 AUS_political_events.30.c: "ไมมีการรับประกันใหพวกเขาอีกตอไป!"
 AUS_broke_the_treaty: "ละเมิดสนธิสัญญาของเรา"
 AUS_broke_the_treaty_democratic: "ละเมิดสนธิสัญญาของเรา"

 AUS_political_events.31.t: "[FROM.GetNameDefCap] ขอคาตอบแทนสําหรับความชวยเหลือ"
 AUS_political_events.31.desc: "เมื่อฝุนควันของสงครามกลางเมืองจางลง ชาว[FROM.GetAdjective]ไดติดตอเรามาเรื่องคาตอบแทนสําหรับความพยายามของพวกเขาในสงครามกลางเมือง พวกเขาตองการคาตอบแทนบางอยางสําหรับงานที่ทํา ทหารที่สูญเสียไป และอาวุธที่อาสาสมัครของพวกเขาใชจนเสียหาย"
 AUS_political_events.31.a: "เราจะชวยดานอุตสาหกรรม"
 AUS_political_events.31.b: "ใหพวกเขารับยุทโธปกรณบางสวนที่เรายึดมาไดไป"
 AUS_political_events.31.c: "การสนับสนุนของพวกเขาแทบไมมีความหมาย"

 AUS_political_events.32.t: "[FROM.GetNameDefCap] เสนอชวยสรางโรงงานใหม"
 AUS_political_events.32.desc: "ฝายชาตินิยม[FROM.GetAdjective]ไดรับฟงคําขอคาตอบแทนของเรา และเพื่อเปนการขอบคุณ พวกเขาไดใหยืมแรงงานและวัสดุเพื่อสรางโรงงานใหมในนีเดอรเอิสเตอรไรช ซึ่งจะชวยใหเราทดแทนยุทโธปกรณที่สูญเสียไปและเปนประโยชนอยางยิ่งในอนาคตดวย"
 AUS_political_events.32.a: "ยอดเยี่ยม!"

 AUS_political_events.33.t: "[FROM.GetNameDefCap] เสนอยุทโธปกรณที่ยึดมาได"
 AUS_political_events.33.desc: "ชาว[SPA.GetAdjective]ไดรับฟงคําขอคาตอบแทนของเรา และเพื่อเปนการขอบคุณ พวกเขาไดสงยุทโธปกรณบางสวนที่ยึดมาจากฝายตรงขามระหวางสงครามกลางเมืองมาใหเรา เพื่อชดเชยยุทโธปกรณบางสวนที่เราสูญเสียไปจากการชวยเหลือพวกเขา"
 AUS_political_events.33.a: "ยอดเยี่ยม!"

 AUS_political_events.34.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะชดเชยใหเรา"
 AUS_political_events.34.desc: "หลังจากชวยเหลือชาว[SPA.GetAdjective]ในสงครามกลางเมือง อยางนอยที่สุดเราก็คาดหวังการชดเชยหรือความซาบซึ้งบาง แตดูเหมือนเราจะหวังมากเกินไป ผูนําของ [SPA.GetNameDef] ระบุวาความชวยเหลือของเราไมใชเรื่องใหญโตอะไร และปฏิเสธแนวคิดที่วาเราควรไดรับคาตอบแทนใด ๆ สําหรับการสนับสนุนที่เรามอบให"
 AUS_political_events.34.a: "หยาบคายจริง ๆ..."

 AUS_political_events.35.t: "กิจกรรมของกองกําลังกึ่งทหารกอความไมสงบในหมูพลเรือน"
 AUS_political_events.35.desc: "ความรวมมือลาสุดของเรากับ [GetMilitiaName] ไดกอใหเกิดผลขางเคียงที่นากังวล เมื่อองคกรนี้ไดรับความชอบธรรมจากผูนําประเทศ [GetMilitiaName] ก็ยิ่งกลาลงมือกับประชาชนพลเรือนมากขึ้น\n\nความไมสงบภายในประเทศเพิ่มสูงขึ้น เพราะประชาชนของเราไมรูสึกสบายใจกับวิธีการทํางานขององคกรนี้อีกตอไป มีการตั้งคําถามตอผูนําของเราวาเราควบคุม [GetMilitiaName] ไดจริงหรือไม และการตัดสินใจนี้จะชวยใหประเทศปลอดภัยไดจริงหรือ"
 AUS_political_events.35.a: "[GetMilitiaName] ไดรับโอกาสไปแลว"
 AUS_political_events.35.b: "ประชาชนแคตองปรับตัว"
 AUS_political_events.35.c: "นี่จะเปน [ROOT.GetName] ยุคใหม!"

 AUS_political_events.36.t: "อนาคตของ [ROOT.GetNameDef]"
 AUS_political_events.36.desc: "เสนทางของเราในการฟนคืนจากการเปนประเทศเล็กที่บอบชํ้าอยางหนักนั้นยาวนานและยากลําบาก เมื่อมองยอนกลับไปยังจุดเริ่มตน ก็เห็นไดชัดเจนวาการเดินทางครั้งนี้คุมคา บัดนี้เมื่อเราเกิดใหมและแข็งแกรงยิ่งกวาเดิม ถึงเวลาแลวที่เราตองตัดสินใจวาอนาคตของเราจะเปนอยางไร และเราตองการใหโลกรูจักเราในนามใด"
 AUS_political_events.36.a: "เมื่อถึงเวลา โลกจะรูจักเราในนาม [GetGrossosterreichCosmeticIdeology]"
 AUS_grossosterreich_fascism_key: "Großösterreich"
 AUS_grossosterreich_neutrality_key: "จักรวรรดิออสเตรียอันยิ่งใหญ"
 AUS_political_events.36.a_tt: "§Yปลดล็อกการตัดสินใจ§! เพื่อ§Yผนวกดินแดนหลักของเยอรมนี§!เมื่อเวลาผานไป"
 AUS_political_events.36.b: "เราจะเปนที่รูจักในนามซึดดอยชลันด"
 AUS_political_events.36.c: "เราสมบูรณแบบอยูแลวอยางที่เปน"

 AUS_political_events.37.t: "คําขาดจาก [FROM.GetNameDef]"
 AUS_political_events.37.desc: "[GetIntegrationEventTarget]"
 AUS_integration_target_is_poland_key: "สารอันแข็งกราวถูกสงมาถึงเราจากรัฐบาล[FROM.GetAdjective] พวกเขาเรียกรองใหเราสงมอบ [Get37PuppetOrNotDesc] ใหแกพวกเขา และเตือนวาอาจมีผลที่ตามมาหากเราพยายามตอตาน\n\nการกระทําอันกาวราวนี้จาก [FROM.GetNameDef] ไมใชเรื่องเหนือความคาดหมายเสียทีเดียว หลังจากที่มีขอเรียกรองในทํานองเดียวกันตอประเทศอื่น ๆ ในละแวกใกลเคียงหลายครั้ง"
 AUS_integration_target_is_not_poland_key: "รัฐบาล[FROM.GetAdjective]ไดยื่นคําขาดมายังเรา ใหยอมสงมอบ [Get37PuppetOrNotDesc] โดยดี หรือเผชิญหนากับแสนยานุภาพของเครื่องจักรสงครามที่พวกเขาสรางขึ้นใหมในสนามรบ ไมวาเราจะเลือกทางใดในเรื่องนี้ ดูเหมือนวาจะไมมีทางไปตอไดโดยไมมีผลที่ตามมา"
 AUS_political_events.37.a: "เราจะไมยอมจํานนตอพวกเขา!"
 AUS_political_events.37.b: "เราไมมีทางสูพวกเขาได"
 AUS_political_events.37_tt: "เราจะสงมอบรัฐที่พวกเขาอางสิทธิ์ให"
 37DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 37DescIsNotPuppet: "รัฐเดิมของพวกเขา"

 AUS_political_events.38.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.38.desc: "เราตองการใหโอกาสชาว[FROM.GetAdjective][Get38PuppetOrNotDesc]เขากับสังคมของเรา แตดูเหมือนขอเสนออันเอื้อเฟอที่สุดของเราจะไมไดรับการตอบรับ ทายที่สุดแลวเรารูดีวา [FROM.GetNameDef] จะเจริญรุงเรืองกวามากภายใตการนําของเรา"
 AUS_political_events.38.a: "พวกเขาจะตองเขารวมกับเรา ไมวาพวกเขาจะคิดวาตนตองการอะไร"
 AUS_political_events.38_tt: "สรางเปาหมายสงคราม §Yยึดรัฐที่อางสิทธิ์§! ตอ §Y[FROM.FROM.OWNER.GetNameWithFlag]§!"
 38DescIsPuppet: "ไดสงมอบ [FROM.FROM.OWNER.GetName] และผนวกรวม"
 38DescIsNotPuppet: "ไดผนวกรวมอยางสันติ"

 AUS_political_events.39.t: "[FROM.GetNameDefCap] ยอมถอย"
 AUS_political_events.39.desc: "คําตอบจากผูนํา[FROM.GetAdjective]เปนที่นายินดีอยางยิ่ง พวกเขาจะวางอาวุธและไมตอสูขัดขืนขณะที่เราผนวกสิ่งที่เปนของเราโดยชอบธรรม เห็นไดชัดวาพวกเขาตระหนักถึงคุณคาของการไมนําประเทศเขาสูสงครามที่ไรความหมายดวยเรื่องเชนนี้.."
 AUS_political_events.39.a: "ยินดีตอนรับสู [ROOT.GetNameDef]!"

 AUS_political_events.40.t: "[FROM.GetNameDefCap] ตองการเขารวม [ROOT.GetFactionName]"
 AUS_political_events.40.desc: "[FROM.GetNameDefCap] ไดติดตอมาขอเขารวมฝายของเรา พวกเขาไดเริ่มเสริมสรางกําลังทหารและแสดงความปรารถนาที่จะรวมมือกันเพื่อใหทั้งสองฝายแข็งแกรงขึ้น ในอดีตชาตินี้เคยเปนกําลังสําคัญที่ตองเกรงขามในสนามรบ แมตอนนี้จะออนแอลงแลว แตพวกเขาก็ยังยืนยันวาจะเปนพันธมิตรที่มีประโยชนที่สุดสําหรับเรา"
 AUS_political_events.40.a: "ยินดีตอนรับพวกเขาใหเขารวมกับเรา"
 AUS_political_events.40.b: "เราไมตองการพวกเขา"

 AUS_political_events.41.t: "[FROM.GetNameDefCap] ตกลงใหเราเขารวม [FROM.GetFactionName]"
 AUS_political_events.41.desc: "[FROM.GetNameDefCap] ตอบรับคําขอเขารวมของเราอยางกระตือรือรนและตอนรับเราเขาสูฝายแลว เราจะไมตองตอสูเพียงลําพังกับผูที่คุกคามเราอีกตอไป!"
 AUS_political_events.41.a: "เราแข็งแกรงขึ้นเมื่ออยูดวยกัน!"

 AUS_political_events.42.t: "[FROM.GetNameDefCap] ปฏิเสธไมใหเราเขารวม [FROM.GetFactionName]"
 AUS_political_events.42.desc: "คําขอเขารวม [FROM.GetFactionName] ของเราถูกปฏิเสธอยางเย็นชา เราพยายามชี้ใหเห็นถึงประโยชนของเราแลว แตนาเสียดายที่ [FROM.GetNameDef] ตัดสินใจไปแลว แมจะนาหงุดหงิดอยางยิ่ง แตเราจะไมทอแท และจะหาทางออกอื่นแทน"
 AUS_political_events.42.a: "เราจะแสดงใหพวกเขาเห็น"

 AUS_political_events.43.t: "[FROM.GetNameDefCap] เรียกรอง[Get43PuppetOrNotTitle]"
 43TitleIsPuppet: "ใหเราสงมอบรัฐในอารักขาของเรา"
 43TitleIsNotPuppet: "ใหเรายอมอยูใตอํานาจ"
 AUS_political_events.43.desc: "ขอเรียกรองที่ใชถอยคํารุนแรงจาก [FROM.GetNameDef] มาถึงเราเมื่อเชานี้ โดยเรียกรองใหเรา[Get43PuppetOrNotDesc]ทันที ขอเรียกรองนี้แฝงไวดวยการขูใชกําลังอยางแทบไมปดบัง และดูเหมือนวาการสูรบอาจปะทุขึ้นหากเราปฏิเสธขอเสนอของพวกเขา"
 43DescIsPuppet: "สงมอบการควบคุม [FROM.FROM.OWNER.GetNameDef] ใหแกพวกเขา"
 43DescIsNotPuppet: "ยอมทําตามขอเรียกรองและกลายเปนรัฐในอารักขาภายใตการปกครองของพวกเขา"
 AUS_political_events.43.a: "เราไมอยูในฐานะที่จะตอสูได"
 AUS_political_events.43.a.tt: "§Y[Get43PuppetOrNotTt]§! อาจถูกบังคับใหเขารวมฝาย[FROM.GetAdjective]"

 AUS_political_events.43.b: "ขามศพเราไปกอน"
 AUS_political_events.43.c: "เราไมเคยเปนรัฐในอารักขาของพวกเขา แตพวกเขาจะเอารัฐที่เคยเปนของพวกเขาคืนไปก็ได"
 43TtIsPuppet: "[FROM.FROM.OWNER.GetNameDefCap]"
 43TtIsNotPuppet: "[ROOT.GetNameDefCap]"

 AUS_political_events.44.t: "[FROM.GetNameDefCap] ยอมทําตามขอเรียกรองของเรา"
 AUS_political_events.44.desc: "คําตอบตอขอเรียกรองของเราที่มีตอ [FROM.GetNameDef] เปนที่นายินดีอยางยิ่ง พวกเขาจะยอมให[Get44PuppetOrNotDesc]อยูภายใตการปกครองของเราและเปนรัฐในอารักขาของเรา โดยมีผลทันที นี่เปนความสําเร็จครั้งยิ่งใหญในความพยายามสถาปนาจักรวรรดิของเราขึ้นใหม!"
 AUS_political_events.44.a: "วุนเดอรบาร!"
 44DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 44DescIsNotPuppet: "ตนเอง"

 AUS_political_events.45.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.45.desc: "ดวยการแสดงความไมเคารพอยางโจงแจงและไมใสใจตอความปลอดภัยของตนเอง [FROM.GetNameDef] ไดตัดสินใจปฏิเสธขอเสนอของเรา ขอตกลงนี้นาจะเปนประโยชนตอทั้งสองฝาย แตดูเหมือนพวกเขาจะไมไดรูสึกเชนเดียวกับเราในเรื่องนี้"
 AUS_political_events.45.a: "ถาอยางนั้นก็สูกันเพื่อเรื่องนี้!"

 AUS_political_events.46.t: "[FROM.GetNameDefCap] โอนรัฐเพื่อหลีกเลี่ยงการตกอยูใตอํานาจ"
 AUS_political_events.46.desc: "ในความพยายามที่จะหลีกเลี่ยงการตกอยูใตอํานาจและการถูกลิดรอนเอกราช ผูนํา[FROM.GetAdjective]ไดใชมาตรการขั้นเด็ดขาด แทนที่จะเปนรัฐในอารักขาของเรา พวกเขากลับสงมอบรัฐที่เคยอยูภายใตการควบคุมของเราคืนใหแกเรา นี่ไมใชผลลัพธที่เราคาดหวังจากขอเรียกรอง และตอนนี้เราตองตัดสินใจวาจะยอมรับหรือไม"
 AUS_political_events.46.a: "ยิ่งดีเขาไปใหญ!"
 AUS_political_events.46.b: "ไม เราตองการใหพวกเขาอยูใตการควบคุมของเรา!"

 AUS_political_events.47.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอ"
 AUS_political_events.47.desc: "แมเราจะพยายามอยางเต็มที่เพื่อทําใหชาว[FROM.GetAdjective]ใจเย็นลง แตดูเหมือนพวกเขาจะมุงมั่นวาผลลัพธเดียวที่ยอมรับไดคือเราตองยอมทําตามขอเรียกรองและปลอยใหพวกเขาตั้งรัฐบาลหุนเชิดในประเทศของเรา พวกเขายํ้าวาไมมีที่วางสําหรับการประนีประนอม หากเราไมอยูขางพวกเขา ก็คือเปนศัตรู"
 AUS_political_events.47.a: "เราจะไมยอมถูกขมเหงใหทําเชนนี้!"
 AUS_political_events.47.b: "ก็คุมที่จะลองดู"

 AUS_political_events.48.t: "[FROM.GetNameDefCap] ตั้งกษัตริยราชวงศฮาพสบวรคขึ้นครองบัลลังกของเรา"
 AUS_political_events.48.desc: "ดวยประวัติศาสตรของ [FROM.GetNameDef] ในฐานะเจาเหนือหัวของเรา เปนเรื่องหลีกเลี่ยงไมไดที่ไมชาก็เร็วพวกเขาจะเขามาแทรกแซงการเมืองภายในของเรา เราไดรับแจงวาพวกเขาไดตั้ง [ROOT.GetLeader] ขึ้นเปนผูนําประเทศของเรา"
 AUS_political_events.48.a: "ก็สมกับเปนฮาพสบวรค..."

 AUS_political_events.49.t: "[FROM.GetNameDefCap] ขอใหสงมอบไซลีเซีย"
 AUS_political_events.49.desc: "โลกรอบตัวเรากําลังเปลี่ยนแปลงไปขณะที่ความตึงเครียดเพิ่มสูงขึ้น วันนี้เราไดรับสารที่รัฐบาล[FROM.GetAdjective]ขอใหเราสงมอบไซลีเซียใหแกพวกเขา ในทางประวัติศาสตร ไซลีเซียเคยเปนสวนหนึ่งของจักรวรรดิของพวกเขา แตหลังมหาสงครามสิ้นสุดลงก็ตกมาอยูภายใตการควบคุมของเรานับแตนั้น\n\n[FROM.GetNameDefCap] เลือกที่จะเสนอโรงงานจํานวนหนึ่งเปนการแลกกับรัฐนีเดอรชเลเซียนและโอเบอรชเลเซียน ดวยหวังวาจะชวยใหเราตัดสินใจไดงายขึ้น"
 AUS_political_events.49.a: "ก็ได ใหรัฐเหลานั้นไปเถอะ"
 AUS_political_events.49.b: "ดินแดนของเรามีคามากกวานั้นเยอะ!"

 AUS_political_events.50.t: "[FROM.GetNameDefCap] สงมอบไซลีเซีย"
 AUS_political_events.50.desc: "เราไดรับคําตอบจากชาว[FROM.GetAdjective]เกี่ยวกับความประสงคของเราที่จะไดไซลีเซียมา พวกเขาตกลงตามขอตกลงนี้อยางเต็มใจและจะโอนรัฐเหลานั้นใหเราทันที ในทางกลับกัน เราไดสรางโรงงานจํานวนหนึ่งใหพวกเขาในรัฐที่พวกเขาเลือก"
 AUS_political_events.50.a: "ขอตกลงที่ยุติธรรมที่สุด!"

 AUS_political_events.51.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะสงมอบไซลีเซีย"
 AUS_political_events.51.desc: "สารจากนักการทูต[FROM.GetAdjective]ไมใชสิ่งที่เราหวังจะไดยิน [FROM.GetNameDef] ไมเพียงปฏิเสธขอตกลง แตยังทําเชนนั้นในลักษณะที่เรียกไดเพียงวาดูหมิ่นและเหยียดหยาม พรอมตั้งคําถามวาทําไมพวกเขาจะตองตกลงทําอะไรเชนนั้น และทําไมเราถึงคิดวาเรามีสิทธิ์เรียกรองสิ่งใด"
 AUS_political_events.51.a: "พวกเขาจะตองกลืนคําพูดเหลานั้น!"

 AUS_political_events.52.t: "[FROM.GetNameDefCap] เรียกรองใหเรารวมเขากับพวกเขา"
 AUS_political_events.52.desc: "โดยอาศัยการอางสิทธิ์อันเกาแกและความผูกพันทางสายตระกูล [FROM.GetLeader] กษัตริย[FROM.GetAdjective] ไดเรียกรองใหเรายอมอยูภายใตการปกครองของเขา โดยอางวาเมืองฮาพสบวรค ซึ่งเปนดินแดนเกาแกของตระกูลเขา เปนของประเทศเขาโดยชอบธรรม เขาเรียกรองใหเรารวมเขากับพวกเขาทันที มิฉะนั้นจะตองเผชิญความพิโรธของกองทัพที่เขาเพิ่งสรางขึ้นใหม"
 AUS_political_events.52.a: "เราไมมีทางเลือกนอกจากยอมจํานน"
 AUS_political_events.52.b: "ราชวงศฮาพสบวรคไมมีสิทธิ์ในฮาพสบวรค!"

 AUS_political_events.53.t: "[FROM.GetNameDefCap] รวมเขากับเราอยางสันติ"
 AUS_political_events.53.desc: "เราไดรับขาววาชาว[FROM.GetAdjective]จะไมตอตานการผนวกประเทศของพวกเขา และจะรวมเขากับ [ROOT.GetName] อันรุงโรจนของเราอยางสันติ ในที่สุดเราก็ไดครอบครองและควบคุมบานเกิดเกาของเรา หมูบานฮาพสบวรค กลับคืนมา"
 AUS_political_events.53.a: "ในที่สุด!"

 AUS_political_events.54.t: "[FROM.GetNameDefCap] ปฏิเสธสิทธิ์อันชอบธรรมของเราเหนือฮาพสบวรค"
 AUS_political_events.54.desc: "เราไดรับคําตอบจากผูนํา[FROM.GetAdjective]แลว พวกเขาจะไมยอมทําตามขอเรียกรองของเรา การเพิกเฉยตอสิทธิ์ทางสายตระกูลของเราเหนือเมืองฮาพสบวรค เทากับปฏิเสธกรรมสิทธิ์อันชอบธรรมของเราในดินแดนนั้น และเปนรอยดางตอเกียรติของเรา เรื่องนี้ยอมไมได!"
 AUS_political_events.54.a: "เพื่อฮาพสบวรค!"

 AUS_political_events.55.t: "[FROM.GetNameDefCap] ตองการทําขอตกลงเรื่องกรรมสิทธิ์ใน [39.GetName] และ [850.GetName]"
 AUS_political_events.55.desc: "ผูนํา[FROM.GetAdjective]ไดติดตอมาพรอมขอเสนอ พวกเขาปรารถนาจะได [39.GetName] และ [850.GetName] จากเรามานานแลว และตอนนี้เสนอโรงงานจํานวนหนึ่งเปนการตอบแทน หากเรายอมขายรัฐเหลานี้ใหพวกเขาโดยปริยาย"
 AUS_political_events.55.a: "ขอตกลงที่ยุติธรรม"
 AUS_political_events.55.b: "แผนดินของเราไมไดมีไวขาย!"

 AUS_political_events.56.t: "[GetHostilityItalianClaimTitle56]"
 AUS_seeks_a_deal_title_56: "[FROM.GetNameDefCap] สงมอบรัฐเพื่อแลกกับการลงทุนดานอุตสาหกรรม"
 AUS_makes_demands_title_56: "[FROM.GetNameDefCap] สงมอบรัฐ"
 AUS_political_events.56.desc: "[GetHostilityItalianClaimDesc56]"
 AUS_seeks_a_deal_desc_56: "ขอตกลงที่เราเสนอตอ [FROM.GetNameDef] ไดรับการอนุมัติแลว เพื่อแลกกับการลงทุนดานอุตสาหกรรมจํานวนมาก ชาว[FROM.GetAdjective]ตกลงสงมอบรัฐ [39.GetName] และ [850.GetName] ตามที่เรารองขอ"
 AUS_makes_demands_desc_56: "ขอเรียกรองที่เรายื่นตอ [FROM.GetNameDef] ไดรับการอนุมัติแลว ชาว[FROM.GetAdjective]จะสงมอบรัฐ [39.GetName] และ [850.GetName] ใหเราทันที และในที่สุดสองรัฐนี้จะกลับมาเปนของเราอีกครั้ง!"
 AUS_political_events.56.a: "ขาวดี"

 AUS_political_events.57.t: "[GetHostilityItalianClaimTitle57]"
 AUS_seeks_a_deal_title_57: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงที่เราเสนอ"
 AUS_makes_demands_title_57: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.57.desc: "[GetHostilityItalianClaimDesc57]"
 AUS_seeks_a_deal_desc_57: "คําตอบจากชาว[FROM.GetADjective]มาถึงเราแลว พวกเขาไมเห็นดวยกับขอตกลง โดยระบุวาแผนดินของพวกเขาไมไดมีไวขาย และปฏิเสธอยางหนักแนนตอความเปนไปไดใด ๆ ในการขายหรือทําขอตกลงใด ๆ เกี่ยวกับรัฐดังกลาว"
 AUS_makes_demands_desc_57: "ขอเรียกรองที่เราสงถึงผูนํา[FROM.GetAdjective]ไมไดรับการตอบรับที่ดี พวกเขาปฏิเสธขอเรียกรองของเรา โดยไมเหลือชองวางใหเรากดดันตอหรือพยายามเรียกรองเชนนี้อีก"
 AUS_political_events.57.a: "ก็คุมที่จะลองดู"

 AUS_political_events.58.t: "[FROM.GetNameDefCap] เรียกรองกรรมสิทธิ์ใน [39.GetName] และ [850.GetName]"
 AUS_political_events.58.desc: "[FROM.GetNameDefCap] ไดติดตอมาพรอมสิ่งที่ดูเหมือนเปนการขมขู พวกเขาแจงเราดวยถอยคําที่ไมเปนมิตรวาตองการ [39.GetName] และ [850.GetName] ซึ่งพวกเขาอางวาเปนของพวกเขาโดยชอบธรรม รัฐเหลานี้เคยเปนสวนหนึ่งของดินแดนใจกลาง[FROM.GetAdjective] แตตั้งแตมหาสงครามก็ตกเปนของเรา"
 AUS_political_events.58.a: "ก็ได"
 AUS_political_events.58.b: "ไมมีทางเด็ดขาด!"

 AUS_political_events.59.t: "[FROM.GetNameDefCap] สนับสนุนแผนของอัลเฟรท ยันซา"
 AUS_political_events.59.desc: "รัฐบาลของ [FROM.GetNameDef] ไดฝากความไววางใจไวกับอัลเฟรท ยันซา อีกครั้ง จอมพลผูมีทาทีตอตาน[ROOT.GetAdjective]อยางชัดเจน ดวยแผนเสริมปอมปราการตามแนวชายแดนและแผนที่ออกแบบมาเพื่อตอบโตการโจมตีจากเราโดยเฉพาะ จอมพลผูนี้เคยเปนตัวปญหาสําหรับเรามากอน และนาจะเปนเชนนั้นอีก"
 AUS_political_events.59.a: "เขาตองไป!"
 AUS_political_events.59.b: "นั่นเปนการตัดสินใจของพวกเขา"

 AUS_political_events.60.t: "[FROM.GetNameDefCap] คัดคานแผนปองกันของอัลเฟรท ยันซา"
 AUS_political_events.60.desc: "[FROM.GetNameDef] ไดยื่นคํารองเรียนอยางเปนทางการเกี่ยวกับการที่เราเพิ่งยึดมั่นในแผนปองกันตามที่อัลเฟรท ยันซา เสนอ พวกเขาอางวาการกระทํานี้เห็นไดชัดวามาจากความเปนปรปกษตอพวกเขา และจะเปนอุปสรรคตอความสัมพันธทางการทูตในอนาคตของเรา เราไมแนใจวาเหตุใดเรื่องนี้จึงทําใหเกิดปฏิกิริยารุนแรงถึงเพียงนี้"
 AUS_political_events.60.a: "ก็ได เราจะเลือกฟรันซ เบอเมอ แทน"
 AUS_political_events.60.a_tt: "§Yฟรันซ เบอเมอ§! จะ§Gพรอมใหแตงตั้ง§!เปนเสนาธิการทหารบก \n\n§Yอัลเฟรท ยันซา§! จะ§Rไมสามารถแตงตั้งไดอีกตอไป§!ในตําแหนงเสนาธิการทหารบก"
 AUS_political_events.60.b: "ยิ่งเปนเหตุผลที่อัลเฟรท ยันซา ตองอยูตอ!"
 AUS_political_events.60.b_tt: "§Yอัลเฟรท ยันซา§! จะยังคงพรอมใหแตงตั้งเปนเสนาธิการทหารบก"

 AUS_political_events.61.t: "[FROM.GetNameDefCap] แทนที่อัลเฟรท ยันซา"
 AUS_political_events.61.desc: "การกดดันของเราใหชาว[FROM.GetAdjective]เปลี่ยนตัวอัลเฟรท ยันซา และแผนปองกันอันโงเขลาของเขาโดยทันทีไดผลแลว แทนที่จะเปนยันซาผูตอตาน[ROOT.GetAdjective]อยางรุนแรง ชาว[FROM.GetAdjective]ไดเลือกฟรันซ เบอเมอ ผูเปนที่ยอมรับไดมากกวาแทน"
 AUS_political_events.61.a: "ยอดเยี่ยม!"

 AUS_political_events.62.t: "[FROM.GetNameDefCap] ใหอัลเฟรท ยันซา คงอํานาจตอไป"
 AUS_political_events.62.desc: "แมเราจะเรียกรองให [FROM.GetNameDef] ยุติการดําเนินการตามสิ่งที่เรียกวาแผนยันซา และไมใหชายผูนี้มีอํานาจหรืออิทธิพลใด ๆ แตชาว[FROM.GetAdjective]กลับปฏิเสธที่จะรับฟงขอเรียกรองของเรา เราไดแตคาดวานี่เปนลางรายตอความสัมพันธในอนาคตของเรา"
 AUS_political_events.62.a: "พวกเขากลาดีอยางไร?"

 AUS_political_events.63.t: "ชาว[AUS.GetAdjective]ผูลี้ภัยเสนอตัวรับใช"
 AUS_political_events.63.desc: "อันชลุสของ [AUS.GetNameDef] ทําใหชาว[AUS.GetAdjective]จํานวนมากที่ตอตานเหตุการณนี้ตองลี้ภัยจากบานเกิด ผูเห็นตางบางสวนไดเดินทางมาถึง [ROOT.GetNameDef] แลว และเสนอตัวรับใชทั้งในโรงงาน บนทองถนน และในแนวหนา"
 AUS_political_events.63.a: "เราไมอาจรับประกันความภักดีของพวกเขาได"
 AUS_political_events.63.b: "ความชวยเหลือของพวกเขานาจะมีประโยชน"

 AUS_political_events.64.t: "[FROM.GetNameDefCap] เสนอการสนับสนุนดานอุตสาหกรรม"
 AUS_political_events.64.desc: "ชาว[FROM.GetAdjective]ไดติดตอมาเสนอชวยยกระดับอุตสาหกรรมของเราใหกาวหนายิ่งขึ้น โดยดูเหมือนไมมีเหตุจูงใจใดเปนพิเศษ พวกเขาเสนอจะรับภาระการผลิตสินคาอุปโภคบริโภคสําหรับพลเรือนบางสวนที่เราตองผลิต เพื่อใหเรามุงเนนการสรางโรงงานไดมากขึ้น"
 AUS_political_events.64.a: "เปนเรื่องนายินดีที่ไมคาดคิด!"
 AUS_industrial_help: "การสนับสนุนดานอุตสาหกรรม"

 AUS_political_events.65.t: "[FROM.GetNameDefCap] เสนอการสนับสนุนดานตลาด"
 AUS_political_events.65.desc: "ชาว[FROM.GetAdjective]ไดติดตอมาเสนอสวนลดยุทโธปกรณของพวกเขาในตลาดนานาชาติ โดยดูเหมือนไมมีเหตุจูงใจใดเปนพิเศษ ยังไมชัดเจนวานี่เปนกลอุบายใหเราซื้อจากพวกเขามากขึ้น หรือเปนขอเสนอที่จริงใจ"
 AUS_political_events.65.a: "ยังไงก็มีประโยชน!"
 AUS_market_help: "การสนับสนุนดานตลาด"

 AUS_political_events.66.t: "[FROM.Get.GetNameDefCap] เสนอการรวมเปนสหพันธ"
 AUS_political_events.66.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ไดติดตอมาพรอมสิ่งที่เขาเรียกวาขอเสนอ เมื่อสหพันธขยายตัวขึ้น การที่ทุกประเทศที่เกี่ยวของทํางานรวมกันอยางไมผิดพลาดก็ยิ่งสําคัญมากขึ้นเรื่อย ๆ เพื่อใหเรื่องนี้งายขึ้น [FROM.GetLeader] จึงเสนอใหเราทุกฝายรวมเปนหนึ่งภายใตพวกเขา \n\nเราจะตองยอมสละอธิปไตยบางสวน แตในฐานะสวนหนึ่งของชาติสหพันธเดียวกัน เราก็จะไดรับความมั่นคงที่มาพรอมกับกองทัพที่ใหญขึ้นและพลังทางการทูตที่แข็งแกรงขึ้น"
 AUS_political_events.66.a: "ฟงดูเปนขอตกลงที่ยุติธรรม"
 AUS_political_events.66.b: "นี่ไมเปนประโยชนตอเราเลย!"

 AUS_political_events.67.t: "[FROM.GetNameDefCap] ยอมรับการรวมเปนสหพันธ"
 AUS_political_events.67.desc: "ขาวอันรุงโรจนวา [FROM.GetNameDef] ยอมรับที่จะเปนสวนหนึ่งของรัฐสหพันธใหมของเราเพิ่งมาถึง สิ่งที่เราเสนอใหเห็นไดชัดวาเพียงพอที่จะทําใหพวกเขามองวาขอเสนอนี้คุมคา แมจะตองเสียอธิปไตยไปบางเล็กนอยก็ตาม"
 AUS_political_events.67.a: "ยอดเยี่ยม!"

 AUS_political_events.68.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวมการรวมเปนสหพันธ"
 AUS_political_events.68.desc: "แมจะมีขอไดเปรียบอยางชัดเจนและเปนสิ่งที่ดีที่สุดสําหรับสหพันธ แต [FROM.GetNameDef] กลับปฏิเสธขอเสนอของเราในการรวมตัวกันใกลชิดยิ่งขึ้น เราไดแตคาดเดาถึงเหตุผลของพวกเขา แตดูเหมือนพวกเขาอาจไมไดคํานึงถึงผลประโยชนสูงสุดของสหพันธ"
 AUS_political_events.68.a: "พวกเขาเปนภัยตอความเปนเอกภาพของสหพันธ!"
 AUS_political_events.68.b: "เราจะจับตาดูพวกเขาอยางใกลชิด"

 AUS_political_events.69.t: "ความเสี่ยงตออันชลุสลดลง"
 AUS_political_events.69.desc: "[GetHowAvoidedAnschluss]"
 AUS_joined_faction: "เมื่อตอนนี้เราเปนสวนหนึ่งของ [ROOT.GetFactionName] แลว ดูเหมือนวา [GER.GetLeader] จะตัดสินใจไมพยายามผนวกเราเขากับ [GER.GetNameDef]\n\nเราทุมเททํางานอยางหนักเพื่อใหแนใจวาจะรักษาเอกราชไวได และผลตอบแทนก็คุมคากับเวลาที่เสียไปอยางยิ่ง"
 AUS_became_subject: "[ROOT.GetNameDefCap] กําลังเผชิญการเปลี่ยนแปลงครั้งใหญนับตั้งแตเราสูญเสียเอกราช แมหลายอยางจะเปนผลขางเคียงที่ไมนาพึงใจนักจากการไมไดเปนอิสระอยางสมบูรณอีกตอไป แตเมื่อไมนานมานี้ผลดีที่หาไดยากประการหนึ่งก็ปรากฏขึ้น เมื่อเราไมไดเปนอิสระอีกตอไป ความพยายามใด ๆ ที่จะผนวกเราจะไมไดปลุกเพียงความโกรธของเราเทานั้น\n\nดูเหมือนวา [GER.GetLeader] จะตระหนักดีถึงเรื่องนี้ จึงไดยกเลิกแผนที่จะบังคับใหเราเขารวมกับ [GER.GetNameDef]"
 AUS_political_events.69.a: "ยังมีแสงสวางในสถานการณของเราตอนนี้"
 AUS_political_events.69.b: "ความปลอดภัยสําหรับยุคของเรา!"
 AUS_political_events.69.a_tt: "ลบการตัดสินใจ §Yมาตรการตอตานอันชลุสส§! ออก"

 AUS_political_events.70.t: "รัฐบาล[FROM.GetAdjective]เสนอคาตอบแทนเพื่อแลกกับการรับประกัน"
 AUS_political_events.70.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef]ติดตอเรามาดวยตนเองในครั้งนี้ การติดตอกันครั้งกอนไมเปนไปอยางที่พวกเขาหวังไว พวกเขาจึงตัดสินใจยื่นขอเสนอใหมดวยหวังวาจะเปลี่ยนใจเราได\n\nเนื่องจากเรื่องนี้สําคัญยิ่งสําหรับพวกเขา พวกเขาจึงเสนอจะชวยออกคาใชจายสรางโรงงานใหมสองแหงในประเทศของเรา และยืนยันวาจะซาบซึ้งในนํ้าใจของเราอยางยิ่งหากเราเปลี่ยนใจและใหการรับประกันแกพวกเขา"
 AUS_political_events.70.a: "แบบนี้คอยวากันใหม!"
 AUS_political_events.70.b: "คําตอบของเรายังเหมือนเดิม ไม"

 AUS_political_events.71.t: "[FROM.GetNameDefCap]เสนอการรับประกันแลกกับการสนับสนุนทางอุตสาหกรรม"
 AUS_political_events.71.desc: "ความพยายามโนมนาว [FROM.GetLeader] ผูนํา[FROM.GetAdjective]ของเราไดผลแลว เราจะตองสนับสนุนการสรางโรงงานสองแหงใหพวกเขา แมนี่อาจถวงความพยายามทางอุตสาหกรรมของเราเอง แตตอนนี้เราก็วางใจไดมากขึ้นวาพวกเขาจะอยูขางเราหากอธิปไตยของเราถูกโจมตี"
 AUS_political_events.71.a: "ขาวดีเสียที!"

 AUS_political_events.72.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะชวยแมจะไดรับขอเสนอคาตอบแทน"
 AUS_political_events.72.desc: "ไมมีใครพูดไดวาเราไมไดพยายามอยางเต็มที่ เราอางถึงสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล และเสนอคาตอบแทนเกินกวาที่ประเทศขนาดเทาเราและในสถานการณอยางเราจะทําไดไปมาก ถึงกระนั้น[FROM.GetNameDef]ก็ยังดื้อดึงไมยอมรับประกันเราตามสนธิสัญญาที่พวกเขาเองมีสวนรางขึ้น เราไมอาจพึ่งความชวยเหลือจากพวกเขาไดอีกตอไป"
 AUS_political_events.72.a: "เราจะผานไปใหได และจะใหพวกเขาเห็น!"

 AUS_political_events.73.t: "[FROM.GetNameDef]เสนอใหแกไขสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล"
 AUS_political_events.73.desc: "\nชาว[FROM.GetAdjective]ยังคงมุงมั่นที่จะไดรับอนุญาตใหฟนฟูกําลังทหาร จึงติดตอมาอีกครั้งพรอมเสนอสนธิสัญญาฉบับแกไขที่ผอนปรนลง เพื่อใหเราควบคุมอัตราการฟนฟูกําลังทหารของพวกเขาได ฉบับแกไขนี้จะอนุญาตใหพวกเขาเริ่มฝกทหารได แตอุตสาหกรรมจะยังถูกจํากัดตอไปอีกหนึ่งป"
 AUS_political_events.73.a: "เรายอมรับได"
 AUS_political_events.73.a_tt: "เราจะสนับสนุนการแกไขที่[FROM.GetNameDef]เสนอ ผูรับประกันทุกรายตองเห็นชอบการแกไขจึงจะมีผล"
 AUS_political_events.73.b: "ไม สนธิสัญญาตองคงอยู"
 AUS_political_events.73.b_tt: "เราจะ§Rไม§!สนับสนุนการแกไขที่[FROM.GetNameDef]เสนอ ผูรับประกันทุกรายตองเห็นชอบการแกไขจึงจะมีผล"
 AUS_political_events.73.c: "หากจะฟนฟูกําลังทหาร เราตองการใหมีคนคอยกํากับดูแล!"
 AUS_political_events.73.c_tt: "ผูกํากับดูแลที่มีแนวคิดฝกใฝประชาธิปไตยจะถูกแตงตั้งประจําออสเตรียตลอดระยะเวลาของสนธิสัญญาฉบับแกไข"

 AUS_political_events.74.t: "ผูรับประกันเห็นชอบการแกไขสนธิสัญญา"
 AUS_political_events.74.desc: "หลังการถกเถียงและหารือกันอยูนาน ในที่สุดผูรับประกันก็ไดขอสรุป เราจะไดรับอนุญาตใหฟนฟูกําลังทหารบางสวนไปตามเวลา นับแตวันนี้จะไมมีขอจํากัดใดขวางเราในการฝกทหารใหมและเพิ่มจํานวนทหารในสนามรบอีกตอไป\n\nอุตสาหกรรมของเรายังมีขอจํากัดอยูแมจะเบาลง ขอจํากัดเหลานี้จะถูกยกเลิกทั้งหมดภายในหนึ่งป หากโลกไมเปลี่ยนแปลงไปอยางรุนแรงเสียกอน"
 AUS_political_events.74.a: "ความพยายามทางการทูตคุมคาจริงๆ!"

 AUS_political_events.75.t: "ผูรับประกันปฏิเสธที่จะแกไขสนธิสัญญา"
 AUS_political_events.75.desc: "ไมวาเราจะพยายามเพียงใด ผูรับประกันก็ยังยืนกรานไมเปลี่ยน เราจะไมไดรับอนุญาตใหฟนฟูกําลังทหารไมวากรณีใด ความพยายามทางการทูตเพื่อโนมนาวและเสนอทางประนีประนอมลวนไรผลเหมือนพูดกับคนหูหนวก บัดนี้ประชาชน[ROOT.GetAdjective]รูสึกขุนเคืองผูรับประกันเหลานี้อยางรุนแรง"
 AUS_political_events.75.a: "เราตองอดทนตอไป"
 AUS_political_events.75.b: "พอกันที เราไมตองการพวกเขา!"

 AUS_political_events.76.t: "ผูรับประกันเห็นชอบการแกไขสนธิสัญญา พรอมแตงตั้งผูกํากับดูแล"
 AUS_political_events.76.desc: "\nหลังการถกเถียงและหารือกันอยูนาน ในที่สุดผูรับประกันก็ไดขอสรุป เราจะไดรับอนุญาตใหฟนฟูกําลังทหารบางสวนไปตามเวลา นับแตวันนี้จะไมมีขอจํากัดใดขวางเราในการฝกทหารใหมและเพิ่มจํานวนทหารในสนามรบอีกตอไป อุตสาหกรรมของเรายังมีขอจํากัดอยูแมจะเบาลง ขอจํากัดเหลานี้จะถูกยกเลิกทั้งหมดภายในหนึ่งป หากโลกไมเปลี่ยนแปลงไปอยางรุนแรงเสียกอน\n\nอยางไรก็ตาม ชัยชนะนี้มีราคาที่ตองจาย ผูรับประกันไมเชื่อวาเราจะอยูหางจากความขัดแยงได จึงแตงตั้งผูกํากับดูแลซึ่งตองอยูในรัฐบาลของเราตลอดกระบวนการนี้"
 AUS_political_events.76.a: "เรารับไว!"

 AUS_political_events.77.t: "ภัยคุกคามที่ใกลเขามา"
 AUS_political_events.77.desc: "นักการทูตที่มากประสบการณและฝมือที่สุดบางคนของเราเฝาติดตามมานานถึงความเสี่ยงที่[GER.GetNameDef]จะลงมือตามแผนการที่ [GER.GetLeader] บางครั้งก็ยืนยัน บางครั้งก็ปฏิเสธ ดูเหมือนเมื่อไมนานมานี้จะเกิดการเปลี่ยนแปลงครั้งใหญ และแหลงขาวของเราเชื่อวาความพยายามผนวกเราอาจเกิดขึ้นในไมชา"
 AUS_political_events.77.a: "เตรียมรับแรงกระแทก..."
 AUS_political_events.77.a_tt: "§R[GER.GetNameWithFlag]ไดเริ่มกระบวนการอันชลุสสเราแลว เราไมอาจเปลี่ยนแปลงสิ่งนี้ไดอีก!§!"

 AUS_political_events.78.t: "คอมมิวนิสตใน[FROM.GetNameDef]ขอการสนับสนุนจากเรา"
 AUS_political_events.78.desc: "ผูนําของ[FROM.GetCommunistParty]ใน[FROM.GetNameDef]ติดตอมาขอความชวยเหลือจากเราอีกครั้ง แมขณะนี้พวกเขาจะไมไดอยูในการสูรบดวยอาวุธ แตความลมเหลวอันเจ็บปวดจากสงครามกลางเมืองและรัฐประหารในป 1934 รวมกับพรรคสังคมประชาธิปไตยยังคงฝงอยูในใจพวกเขา พวกเขาตองการความชวยเหลือจากเราขณะที่ตอสูเพื่อชิงอํานาจในประเทศของตนอีกครั้ง"
 AUS_political_events.78.a: "เราจะชวยหากทําได!"
 AUS_political_events.78.b: "เรามีเรื่องที่ดีกวานี้ตองทํา"

 AUS_political_events.79.t: "[FROM.GetNameDefCap]เสนอการสนับสนุน"
 AUS_political_events.79.desc: "ดังที่เราหวังไว ผูนํา[FROM.GetAdjective]ไดเสนอการสนับสนุนแกเราในชวงเวลาที่ยากลําบากนี้ แนนอนวาเราไมอาจพึ่งพาพวกเขาใหแกปญหาทั้งหมดได แตการไดรับการสนับสนุนจากพวกเขาอีกครั้งก็เปนความชวยเหลือที่นายินดียิ่ง โดยเฉพาะเมื่อการชิงอํานาจของเรายังยืดเยื้อตอไป"
 AUS_political_events.79.a: "ยอดเยี่ยม!"
 AUS_political_events.79.a_tt: "หากเกิดสงคราม [FROM.GetFlag]§Y[FROM.GetNameDef]§! มีแนวโนมจะสงอาสาสมัครและยุทโธปกรณแบบใหยืม-เชามาใหเรามากขึ้น"

 AUS_political_events.80.t: "[FROM.GetNameDefCap]ปฏิเสธคําขอการสนับสนุนของเรา"
 AUS_political_events.80.desc: "[FROM.GetNameDef]ปฏิเสธคําขอความชวยเหลือของเรา โดยอางความแตกตางทางอุดมการณเล็กนอยและความลังเลของเราตอลัทธิคอมมิวนิสตแบบปฏิวัติ เราจะตองยืนหยัดดวยตัวเอง"
 AUS_political_events.80.a: "เรานึกวาพวกเขาจะชวยจริงๆ!"

 AUS_political_events.81.t: "[FROM.GetNameDefCap]ปรับแนวทางการเมืองใหสอดคลองกับเรา"
 AUS_political_events.81.desc: "เปนเวลานานที่ชาว[FROM.GetAdjective]ยึดมั่นอยางดื้อดึงในคอมมิวนิสตรูปแบบของตนเองที่เรียกวาลัทธิมารกซแบบออสเตรีย ความแตกแยกทางการเมืองนี้เปนการผสมผสานระหวางสังคมประชาธิปไตยกับคอมมิวนิสตแทที่เราไมคอยชื่นชอบนัก ดูเหมือนตอนนี้พวกเขาจะไดสติในที่สุด และละทิ้งอุดมการณที่ผิดพลาดนี้เพื่อมาเขาแนวทางเดียวกับเรา ดวยหวังจะเปนที่โปรดปรานและไดรับการคุมครองจากเราหากถูกกองกําลังศัตรูโจมตี"
 AUS_political_events.81.a: "ดีมาก เราจะใหความคุมครอง"
 AUS_political_events.81.b: "พวกเขาจะเปนพันธมิตรที่มีคาที่สุด... แตยังไมใชตอนนี้"
 AUS_aligned_with_our_values: "สอดคลองกับคานิยมของเรา"

 AUS_political_events.82.t: "[FROM.GetNameDefCap]เสนอการรับประกัน"
 AUS_political_events.82.desc: "การตัดสินใจของเราที่จะปรับแนวทางใหใกลชิดกับอุดมการณทางการเมืองของ [FROM.GetLeader] ไดรับการตอบรับเปนอยางดี [FROM.GetNameDefCap]เสนอการรับประกันแกเรา และจะสนับสนุนเราหากเราถูกรุกราน"
 AUS_political_events.82.a: "ยอดเยี่ยม!"

 AUS_political_events.83.t: "[FROM.GetNameDefCap]เห็นชอบการเปลี่ยนแนวทางการเมืองของเรา"
 AUS_political_events.83.desc: "การตัดสินใจของเราที่จะปรับแนวทางใหใกลชิดกับอุดมการณทางการเมืองของ [FROM.GetLeader] ไดรับการตอบรับเปนอยางดี [FROM.GetNameDefCap]แสดงความชื่นชมวานี่เปนกาวที่ถูกทาง และหวังวาจะไดเห็นเราเปนพันธมิตรในอนาคต"
 AUS_political_events.83.a: "เราตั้งตารอ!" 

 AUS_political_events.84.t: "ชาว[FROM.GetAdjective]ปลุกกระแสคอมมิวนิสตในประเทศของเรา"
 AUS_political_events.84.desc: "\nเราไดรับรายงานวาขณะนี้[AUS.GetNameDef]กําลังพยายามปลุกกระแสคอมมิวนิสตในหมูแรงงานของเรา แมเรื่องนี้อาจไมเปนพิษภัย แตก็อาจเปนการเตรียมการเพื่อบางสิ่ง เราไมรูวาเจตนาที่แทจริงของพวกเขาคืออะไร แตเราตองพิจารณาทุกความเปนไปได"
 AUS_political_events.84.a: "เราไมเห็นวามีปญหาอะไร"
 AUS_political_events.84.b: "สั่งหามพวกเขา!"
 AUS_political_events.84.b_tt: "§Rสิ่งนี้อาจนํามาซึ่งผลรายแรง!§!"

 AUS_political_events.85.t: "[FROM.GetNameDefCap]อนุญาตใหเราจัดตั้งแรงงาน"
 AUS_political_events.85.desc: "\nเรารูดีวากิจกรรมของเราใน[FROM.GetNameDef]จะถูกคนพบไมชาก็เร็ว โชคดีที่ดูเหมือน [FROM.GetLeader] จะไมติดใจที่เราปลุกกระแสคอมมิวนิสตในหมูแรงงานของพวกเขา และใหความรูแกแรงงานเรื่องสิทธิและหนาที่ของการเปนแรงงานที่ดี"
 AUS_political_events.85.a: "ยอดเยี่ยม"
 AUS_political_events.85.a_tt: "ปลดล็อกการตัดสินใจ §Yเรียกรองการปลดปลอยแรงงาน§! เมื่อแผนยุทธศาสตร §Yเรียกรองการปลดปลอยแรงงาน§! เสร็จสิ้น"
 AUS_political_events.85.2.a_tt: "ปลดล็อกการตัดสินใจ §Yเรียกรองการปลดปลอยแรงงานใน[FROM.GetNameDef]§!"

 AUS_political_events.86.t: "[FROM.GetNameDefCap]สั่งหามการจัดตั้งแรงงาน"
 AUS_political_events.86.desc: "\n[FROM.GetLeader] สั่งหามความพยายามของเราที่จะใหความรูแกแรงงานเรื่องสิทธิของพวกเขาในสังคม ซึ่งเปนการไมเคารพแรงงานของตนเอง นี่เปนการกระทําที่เปนปฏิปกษอยางชัดเจน ไมเพียงตอเรา แตตอแรงงานทั่วโลกดวย"
 AUS_political_events.86.a: "ใหตายสิ!"
 AUS_political_events.86.b: "เราจะหยุดความเปนปฏิปกษนี้!"

 AUS_political_events.87.t: "[FROM.GetAdjective]เรียกรองใหมีระบอบคอมมิวนิสต"
 AUS_political_events.87.desc: "หลังจากกระแสคอมมิวนิสตเพิ่มขึ้นมาระยะหนึ่งจากการโฆษณาชวนเชื่อของ[FROM.GetAdjective]ที่แพรไปในหมูแรงงานของเรา บัดนี้คําขาดไดมาถึงเราแลว [FROM.GetLeader] เรียกรองใหเรายอมใหคอมมิวนิสตเขายึดอํานาจโดยสันติ เพราะเขาเห็นวาประชาชนของเราตองการเชนนั้น และหากเราปฏิเสธ เขายืนยันวาพวกเขาจะยืนเคียงขางแรงงานของเราไมวาแรงงานจะตองการทําสิ่งใด"
 AUS_political_events.87.a: "เราไมมีทางเลือก"
 AUS_political_events.87.b: "เราตัดสินใจเอง"

 AUS_political_events.88.t: "[FROM.GetNameDefCap]สถาปนารัฐบาลคอมมิวนิสต"
 AUS_political_events.88.desc: "ความพยายามอยางไมลดละของเราใน[FROM.GetNameDef]ไดผลในที่สุด แรงงานตางปลาบปลื้มเมื่อ [FROM.GetLeader] ผูนําคนใหมขึ้นปกครองประเทศ"
 AUS_political_events.88.a: "ยินดีตอนรับ สหาย!"

 AUS_political_events.89.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.89.desc: "แมจะมีสัญญาณชัดเจนวาประชาชนตองการ แตชาว[FROM.GetAdjective]และ [FROM.GetLeader] ผูนําของพวกเขาก็เลือกที่จะไมลงจากอํานาจเพื่อใหรัฐบาลที่เหมาะสมกวาเขามาแทน เราตองพิจารณาทางเลือกและทําสิ่งที่ถูกตองเพื่อประชาชน"
 AUS_political_events.89.a: "สงครามจะยิ่งเลวรายกวา"
 AUS_political_events.89.b: "เสียงของประชาชนจะตองไดรับการรับฟง!"

 AUS_political_events.90.t: "ผลการเลือกตั้งของเรา"
 AUS_political_events.90.desc: "การเลือกตั้งครั้งแรกนับตั้งแต 'รัฐสภายุบตัวเอง' ไดเสร็จสิ้นลงแลว ผูมาใชสิทธิ์มีจํานวนสูง เพราะประชาชนไดเห็นแลววาชาติจะกลายเปนอยางไรหากพวกเขาละเลยหนาที่ผูมีสิทธิ์เลือกตั้ง ผูสมัครสามอันดับแรกมีคะแนนหางกันเพียงไมกี่เสียงขณะที่การนับคะแนนรอบสุดทายกําลังดําเนินไป"
 AUS_political_events.90.a: "คูรท ชุชนิกก เปนนักประชาธิปไตยโดยแท!"
 AUS_political_events.90.a_tt: "§Yคูรท ชุชนิกก§! ขึ้นเปนผูนําพรรค§Yประชาธิปไตย§!"
 AUS_political_events.90.b: "คารล เรนเนอร เคยรับใชเรามาเปนอยางดี!"
 AUS_political_events.90.c: "วินเซนซ ชูมี ตอบโจทยผูมีสิทธิ์เลือกตั้งไดเกือบทุกกลุม!"

 AUS_political_events.91.t: "[ROOT.GetLeader]ปรารถนาจะออกสูสนามรบ"
 AUS_political_events.91.desc: "ระยะหลังนี้เราพบวาอารชดยุกของเรา [ROOT.GetLeader] ครุนคิดถึงสถานการณในแนวหนาอยูไมหยุด พระองคทรงรูสึกวาตนยังทําไดไมพอ และปรารถนาจะนําทหารดวยพระองคเองโดยตรง วันนี้เรื่องนี้ถูกยกขึ้นมาอีกครั้ง อารชดยุกของเราปรารถนาจะนําทหารเขาสูรบอยางกลาหาญ และมอบการปกครองใหผูอื่น"
 AUS_political_events.91.a: "เสด็จไปเถิดอารชดยุก! เราจะใหคนดูแลบัลลังกไวให"
 AUS_political_events.91.b: "แมแตอารชดยุกก็ตองอยูในที่ของตน"
 AUS_political_events.91.a_tt: "เมืองหลวงแหงใหมจะมีชื่อวา §Yฟาดุซ§!"
 AUS_political_events.91.a_tt2: "§Yอ็อทโท ฟอน ฮาพสบวรค§! กลายเปนจอมพล §Yระดับทักษะ 2§!"

 AUS_political_events.92.t: "[FROM.GetNameDefCap]ขอซื้ออะแลสกา"
 AUS_political_events.92.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ติดตอเรามาเพื่อขอซื้อรัฐ[463.GetName] ยอนไปในป 1867 เมื่อ[USA.GetNameDef]ซื้อรัฐนี้จากจักรวรรดิรัสเซียในเวลานั้น ขอเสนอนี้เคยถูกยื่นให[FROM.GetNameDef]กอน ตอนนั้นพวกเขาปฏิเสธ แตนับแตนั้นพวกเขาก็เปลี่ยนความคิด และตอนนี้ตองการไดรัฐนี้ไปจากเรา โดยเสนอจะจายเงินใหเราอยางงาม"
 AUS_political_events.92.a: "ดินแดนของเราไมมีไวขาย!"
 AUS_political_events.92.b: "เราไมมีประโยชนอะไรกับ[463.GetName]"
 generic_this_might_cause_tt: "§Rสิ่งนี้อาจทําใหเกิด§!:"

 AUS_political_events.93.t: "[FROM.GetNameDefCap]ขาย[463.GetName]ใหเรา"
 AUS_political_events.93.desc: "เราไดรับขาวจาก [FROM.GetLeader] วาพวกเขายอมขายรัฐ[463.GetName]ใหเราในราคาที่เราเสนอ รัฐนี้จะถูกโอนมาใหเราทันทีเพื่อใหเราเริ่มดําเนินการผนวกรวมได"
 AUS_political_events.93.a: "ยอดเยี่ยม"

 AUS_political_events.94.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะขาย[463.GetName]"
 AUS_political_events.94.desc: "แมเราจะเสนอเงินจํานวนมหาศาลให[FROM.GetNameDef]เพื่อซื้อ[463.GetName] พวกเขาก็ยังปฏิเสธขอตกลงนี้ เรามีสิทธิ์อันชอบธรรมเหนือ[463.GetName] ที่พวกเขากําลังปฏิเสธเราอยางโจงแจง เราตองคิดวาจะดําเนินการตออยางไรดีที่สุด"
 AUS_political_events.94.a: "ก็คุมที่จะลองดู"
 AUS_political_events.94.b: "เราจะปลดปลอยพวกเขา!"

 AUS_political_events.95.t: "กองทัพ[ROOT.GetAdjective]กลับมาหลังการทัพที่ประสบความสําเร็จ"
 AUS_political_events.95.desc: "เมื่อสงครามออสเตรีย-ปรัสเซียสิ้นสุดลงในวันที่ 22 กรกฎาคม 1866 กองทัพผูกลาหาญของเราเดินทัพกลับบาน กลาวกันวาเมื่อกลับมา ในแถวทหารมีทหารมากกวาตอนออกไปรบหนึ่งคน เรื่องนี้จริงหรือเปนเพียงเรื่องเลาเกินจริงยังเปนที่ถกเถียง แตเรายืนยันไดวาเรื่องนี้เกิดขึ้นแลวในตอนนี้ เมื่อกองทัพอันรุงโรจนของเรากลับมาพรอมกําลังเพิ่มขึ้นหนึ่งคน"
 AUS_political_events.95.a: "ยินดีตอนรับสู[ROOT.GetNameDef]!"
 AUS_political_events.95.a_tt: "ผูรักชาติ[ROOT.GetAdjective]ตัวจริงอีกคนไดเขารวมแถวของเราแลว"

 AUS_political_events.96.t: "[FROM.GetNameDefCap]ขอเขารวม[ROOT.GetFactionName]"
 AUS_political_events.96.desc: "[FROM.GetLeader] แหง[FROM.GetName]ซึ่งเพิ่งหันมาเปนประชาธิปไตย ไดติดตอเรามาเพื่อขอเขารวม[ROOT.GetFactionName] แมพวกเขาจะยืนอยูลําพังมาตั้งแตมหาสงครามสิ้นสุด แตบรรยากาศทางการเมืองปจจุบันและความตึงเครียดที่เพิ่มขึ้นทั่วโลกทําใหพวกเขาเปลี่ยนใจ เมื่อตอนนี้พวกเขากลับมาเปนประชาธิปไตยอยางแทจริงอีกครั้ง จึงเลือกติดตอเรามา พรอมยืนยันวาจะเปนกําลังสําคัญของฝายอยางแนนอน!"
 AUS_political_events.96.a: "ยินดีตอนรับพวกเขาอยางยิ่ง!"
 AUS_political_events.96.b: "เราไมไวใจพวกเขา"

 AUS_political_events.97.t: "[FROM.GetNameDefCap]ตอนรับเราสู[ROOT.GetFactionName]"
 AUS_political_events.97.desc: "คําขอเขารวม[ROOT.GetFactionName]ของเราไดรับการอนุมัติแลว! แมเราจะมั่นใจอยางยิ่งวาการเปลี่ยนทิศทางครั้งใหญนี้คือสิ่งที่ประเทศของเราตองการ แตสถานการณก็หนักหนาไมนอย หลังมหาสงคราม เราตัดความสัมพันธกับพันธมิตรทั้งหมดดวยหวังวาสถานการณเชนนั้นจะไมเกิดขึ้นอีก ขณะที่เราปรับตัวเขากับความปลอดภัยในระดับหนึ่งของพันธมิตรใหม เราก็ตระหนักดีวาสันติภาพเปนสิ่งเปราะบางจริงๆ"
 AUS_political_events.97.a: "มันจําเปนตองทํา"

 AUS_political_events.98.t: "[FROM.GetNameDefCap]ปฏิเสธคําขอเขารวม[FROM.GetFactionName]ของเรา"
 AUS_political_events.98.desc: "แมเราจะพยายามอยางดีที่สุด คําขอเขารวม[FROM.GetFactionName]ที่เราสงถึงชาว[FROM.GetAdjective]ก็ถูกปฏิเสธ คําตอบของพวกเขาไมไดใหเหตุผลที่แทจริงเลย และดูเหมือนเราถูกทิ้งใหตองเอาตัวรอดเพียงลําพังอีกครั้ง"
 AUS_political_events.98.a: "พวกเขาชางใจรายนัก!"
 AUS_political_events.98.b: "ดูเหมือนเราตองทําทุกอยางเอง!"

 AUS_political_events.99.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.99.desc: "[GetRejectionAmounts]"
 AUS_has_not_rejected_before: "[FROM.GetLeader] ผูนําฝาย[FROM.GetAdjective]ไดตอบขอเรียกรองของเราแลว จดหมายใชถอยคําทางการทูต แตก็แฝงนํ้าเสียงดูหมิ่นอยู ขอกังวลของเราถูกปดตกราวกับไมมีความหมาย ซึ่งแสดงวาความกังวลของเราเกี่ยวกับ[FROM.GetNameDef]นั้นมีมูลจริง มีเสียงจากภายในผูนําของเราใหกดดันชาว[FROM.GetAdjective]ตอไปจนกวาจะยอม เพราะอาจทําใหแผนการในอนาคตของเราสําเร็จไดงายขึ้น แตเสียงสวนนอยก็เห็นวาเราควรปลอยใหชาว[FROM.GetAdjective]ไดชัยชนะที่ไรความหมายนี้ไป"
 AUS_GER_cannot_take_a_no: "แมจะถูกกดดันอยางตอเนื่องและหนักขึ้นเรื่อยๆ ตอ[FROM.GetNameDef] [FROM.GetLeader] ก็ยังยืนหยัดในจุดยืนของ[FROM.GetLeader.GetHerHis] อารทูร ไซส-อินควารท จะไมไดรับการแตงตั้งเปนที่ปรึกษาในรัฐบาล ไมวาเราจะพูดหรือทําอะไร เราจะตองหาทางออม ซึ่งก็เปนเพียงความรําคาญเล็กนอยเทานั้น"
 AUS_political_events.99.a: "พวกเขาจะตองยอมเรา!"
 AUS_refuses_to_submit: "ปฏิเสธที่จะยอมเรา"
 AUS_political_events.99.b: "ปลอยใหพวกเขาไดไป ใหพวกเขาลดการระวังตัวลง..."
 AUS_bullied_austria: "กดดัน[AUS.GetNameDef]"

 AUS_political_events.100.t: "แรงกดดันเพิ่มเติมใหแตงตั้งอารทูร ไซส-อินควารท"
 AUS_political_events.100.desc: "\nแมกอนหนานี้เราจะปฏิเสธการแตงตั้งอารทูร ไซส-อินควารทเขาสูรัฐบาลของเราแลว แต [FROM.GetLeader] ผูนํา[FROM.GetAdjective]ก็ยังไมหยุดเรียกรอง แมแรงกดดันตอเราจะเพิ่มขึ้นเพราะเรื่องนี้ เราก็ยังคงมีอธิปไตยและควบคุมการเมืองของเราเองได และการตัดสินใจยังคงเปนของเรา"
 AUS_political_events.100.a: "พวกเขากดดันเราดวยเหตุผลบางอยาง อยายอม!"
 AUS_trying_to_control_us: "พยายามควบคุมเรา"
 AUS_political_events.100.b: "เราเสี่ยงถูกตอบโตหากปฏิเสธ"

 AUS_political_events.101.t: "[FROM.GetNameDefCap]ยุติความพยายามแตงตั้งอารทูร ไซส-อินควารท"
 AUS_political_events.101.desc: "หลังการโตตอบกันไปมานานในเรื่องที่ไมเกี่ยวกับพวกเขาเลย ในที่สุด[FROM.GetNameDef]ก็หยุดความพยายามแทรกแซงการเมืองของเราอยางผิดกฎหมาย คงเดาไดวาตอนนี้พวกเขาไมพอใจเราอยางมาก แตนั่นไมใชความกังวลหลักของเรา ความกังวลหลักของเราเปนมาเสมอ เปนอยู และจะเปนตลอดไป คือความเจริญรุงเรืองของ[ROOT.GetNameDef]"
 AUS_political_events.101.a: "เสียที"

 AUS_political_events.102.t: "ฟอเรอรวางแผนขยายดินแดน"
 AUS_political_events.102.desc: "ในการประชุมที่ [ROOT.GetLeader] เรียกขึ้นเมื่อไมนานมานี้ ฟอเรอรไดเผยความทะเยอทะยานบางสวนในการขยายดินแดนของ[ROOT.GetNameDef]ในอนาคต การขยายดินแดนครั้งแรกเปนสิ่งที่[ROOT.GetLeader.GetSheHe]เห็นวามีความเสี่ยงตํ่า ประชาชน[AUS.GetAdjective]ไมตางจากเรา และสวนใหญมีความเห็นคลายกัน ดังที่บรรยากาศทางการเมืองในประเทศนั้นพิสูจนใหเห็น ฟอเรอรเชื่อวาการขยายดินแดนเชนนี้จะสําเร็จไดดวยวิธีทางการทูต หากมีเวลาพอใหความรูสึกเปนมิตรตอ[ROOT.GetAdjective]เติบโตขึ้นใน[AUS.GetNameDef]"
 AUS_political_events.102.a: "ความคิดที่ยอดเยี่ยม!"
 AUS_anschluss_ratio_ticking_down: "§Yกําลังรบรวมของกองทัพบก§!ที่ตองใชเพื่อเริ่มแผนยุทธศาสตร §Yอันชลุสส§! จะลดลงทุกสัปดาห โดยจํานวนจะสอดคลองกับความนิยมของ§Yความเปนกลาง§!ใน§Y[AUS.GetNameWithFlag]§!"
 AUS_anschluss_ratio_ticking_down_monarchist: "§Yกําลังรบรวมของกองทัพบก§!ที่ตองใชเพื่อเริ่มแผนยุทธศาสตร §Yอันชลุสส§! จะลดลงทุกสัปดาห โดยจํานวนจะสอดคลองกับความนิยมของ§Yฟาสซิสต§!ใน§Y[AUS.GetNameWithFlag]§!"

 AUS_political_events.103.t: "รายงานนากังวลเรื่องการขยายดินแดนของ[GER.GetAdjective]"
 AUS_political_events.103.desc: "แมเราจะสงสัยมานานแลววา[GER.GetAdjective]มีเจตนาจะผนวกเรา แตรายงานที่เราไดรับเมื่อเชานี้ทําใหทุกอยางดูนากลัวขึ้นมาก ดูเหมือนเมื่อไมนานมานี้มีการประชุมขึ้น และในการประชุมนั้น [GER.GetLeader] ไดเผยแนวคิดอันชั่วรายวาจะผนวกเราเขากับประเทศของพวกเขาอยางไร แมเราจะพยายามอยางดีที่สุด ขอมูลลับสุดยอดนี้ก็ยังรั่วไหลไปถึงมวลชน และที่นากังวลกวานั้นคือไปถึงพรรคการเมืองที่ดูจะเห็นวาเปนความคิดที่ดี กลุมเหลานี้นาจะบอนทําลายเจตจํานงที่จะสูกลับของประชาชนเรา หากแผนการอันเลวรายของ [GER.GetLeader] กลายเปนจริง"
 AUS_political_events.103.a: "แยแลว"

 AUS_political_events.104.t: "ผูลี้ภัยชาว[GER.GetAdjective]"
 AUS_political_events.104.desc: "เชานี้เกิดการพบปะที่แปลกประหลาดอยางยิ่ง ผูนําของเราไดเผชิญหนากับชายแปลกหนาคนหนึ่งที่พวกเขารูสึกไมหายวาเคยเห็นมากอน แมแตเสียงก็ฟงคุนหู ชายผูนี้อางวาเปนศิลปนที่ใฝฝนจะประสบความสําเร็จ เดินทางมาจาก[GER.GetNameDef] และตองการชวยเหลือเรา เขาบอกวาตนเปนผูนําที่มีฝมือ และประเทศของเรากําลังตองการผูนําเชนนั้นอยางยิ่ง\n\nเมื่อสอบถามทหารรักษาชายแดน พวกเขาปฏิเสธวาไมมีใครชื่อนี้ขามชายแดนมาเลย และคนที่ใกลเคียงที่สุดก็คือเอลิซาเบธ ฮีดเลอร"
 AUS_political_events.104.a: "ไมมีทาง เราไมหลงกลหรอก" 
 AUS_political_events.104.b: "จะมีอะไรผิดพลาดไดละ?"
 AUS_political_events.104.c: "เอลิซาเบธ..?"
 AUS_british_monarch: "ผูนําผูสืบเชื้อสายมาจากราชินีอังกฤษหลายรุน"

 AUS_political_events.105.t: "[FROM.GetNameDefCap]ถอนการสนับสนุน"
 AUS_political_events.105.desc: "ขณะที่[GER.GetNameDef]กดดันอยางกาวราวขึ้นเรื่อยๆ ใหเรายอมถูกผนวก เราคิดวาจะพึ่งพาชาว[ITA.GetAdjective]และการรับประกันของพวกเขาได แตดูเหมือนจะไมใช เมื่อเผชิญภัยคุกคามจากการรุกรานของ[GER.GetAdjective] พวกเขาก็ถอยทันที ทิ้งเราไวในสถานการณลอแหลม ดูเหมือนคําสัญญาของพวกเขาเปนเพียงลมปาก"
 AUS_political_events.105.a: "ตอนนี้หมดหวังแลว"
 AUS_political_events.105.b: "เราจะยืนหยัดเพียงลําพัง!"

 AUS_political_events.106.t: "[FROM.GetNameDefCap]ยืนยันการสนับสนุนอีกครั้ง"
 AUS_political_events.106.desc: "จากการแสดงความเปนปฏิปกษของ[GER.GetNameDef]เมื่อไมนานมานี้ ชาว[ITA.GetAdjective]ไดติดตอมายืนยันการสนับสนุนเราอีกครั้ง ไมวาจะถูกขมขูอยางไร พวกเขาจะรับประกันเอกราชของเรา และหากเกิดการสูรบดวยอาวุธ พวกเขาจะสูเคียงขางเรา"
 AUS_political_events.106.a: "ชาว[GER.GetAdjective]จะตองเสียใจกับการกระทําของตน!"

 AUS_political_events.107.t: "[FROM.GetNameDefCap]ยอมจํานนตอแรงกดดันของ[GER.GetAdjective]"
 AUS_political_events.107.desc: "เราไดรับขาวรายแรงวา [FROM.GetLeader] ยอมตามขอเรียกรองของ[GER.GetAdjective]ใหผนวกรวมเขากับ[GER.GetNameDef]แลว แมเราจะใหการรับประกันแกชาว[FROM.GetAdjective] แตดูเหมือนคําสัญญานั้นไมพอจะทําใหพวกเขากลาสูกลับ เรายังมีผลประโยชนในพื้นที่นี้ ดังนั้นในอนาคตเราอาจตองพิจารณาปลดปลอยชาว[FROM.GetAdjective]"
 AUS_political_events.107.a: "เราจะชวยพวกเขา!"
 AUS_political_events.107.a_tt: "เมื่อเริ่มสงครามกับ[GER.GetNameDef] เราจะไดรับ:\n"
 AUS_political_events.107.b: "หมดหวังแลว"
 
 AUS_political_events.108.t: "[FROM.GetNameDefCap]ซอมรบที่ชายแดนของเรา"
 AUS_political_events.108.desc: "เราไดรับรายงานวากองทัพ[FROM.GetAdjective]ไดเริ่มการซอมรบขนาดใหญตรงชายแดนของเรา แมจะไมมีการขมขูดวยวาจา แตเราก็อดรูสึกไมไดวานี่เปนการเตือนถึงสิ่งที่กําลังจะมา เราตองระมัดระวังการกระทําตอพวกเขา ไมเชนนั้นพวกเขาอาจตอบโตรุนแรงขึ้น"
 AUS_political_events.108.a: "เราจะเฝาระวังอยางใกลชิด!"

 AUS_political_events.109.t: "[FROM.GetNameDefCap]ติดอาวุธใหทหารรักษาชายแดน"
 AUS_political_events.109.desc: "ระยะหลังนี้หนวยลาดตระเวนชายแดนของเรารายงานวามีหนวยลาดตระเวนและแมแตทหารรักษาการณฝง[FROM.GetAdjective]ของชายแดนมากขึ้นอยางมาก ที่นาตกใจกวานั้นคือทหารเหลานี้ไมไดติดอาวุธเบาอีกตอไป แตถือปนไรเฟลเทียบเทาที่กองทัพใช หากดูจากถอยแถลงกอนหนานี้ของพวกเขา เรื่องนี้อาจนาเปนหวง"
 AUS_political_events.109.a: "นากังวล..."

 AUS_political_events.110.t: "กระแสตอตาน[ROOT.GetAdjective]เพิ่มขึ้นใน[FROM.GetNameDef]"
 AUS_political_events.110.desc: "ผลจากการชุมนุมที่รัฐบาลใหทุนสนับสนุน เราไดรับรายงานวากระแสตอตาน[ROOT.GetAdjective]ใน[FROM.GetNameDef]เพิ่มขึ้นอยางรวดเร็ว ผูนํา[FROM.GetAdjective]ไมไดติดตอเราโดยตรงเพื่อหารือเรื่องนี้ จึงคาดไดเพียงวาตอนนี้พวกเขาไมสนใจการทูตแลว"
 AUS_political_events.110.a: "นาเปนหวง"

 AUS_political_events.111.t: "[FROM.GetNameDefCap]เสนอสนธิสัญญาไมรุกราน"
 AUS_political_events.111.desc: "เราเพิ่งไดรับสารจากผูนํา[FROM.GetAdjective] พวกเขาขอใหเราลงนามขอตกลงสันติภาพรวมกันระหวางสองประเทศ พวกเขายอมรับวาเราเคยมีปญหากันมาไมนอยในอดีต แตตองการการเจรจาที่สรางสรรคมากขึ้นทั้งในปจจุบันและอนาคต"
 AUS_political_events.111.a: "อดีตก็คืออดีต เราจะลงนาม!"
 AUS_political_events.111.b: "รูจักชาว[FROM.GetAdjective]และสิ่งที่พวกเขากอไวดี ไมมีทางเด็ดขาด!"

 AUS_political_events.112.t: "[FROM.GetNameDefCap]ลงนามสนธิสัญญาไมรุกราน"
 AUS_political_events.112.desc: "แผนการของเราตอ[FROM.GetNameDef]กาวหนาไปอีกขั้นในวันนี้ เมื่อเราไดลงนามสนธิสัญญาไมรุกรานแลว เราจะพยายามผูกพวกเขาใหใกลชิดกับเรายิ่งขึ้นตอไป อนาคตยังไมมีใครเขียนไว หากเราตองการเดินหนาตามแผนตอไป"
 AUS_political_events.112.a: "ยอดเยี่ยม"

 AUS_political_events.113.t: "[FROM.GetNameDefCap]ปฏิเสธสนธิสัญญาไมรุกราน"
 AUS_political_events.113.desc: "ดูเหมือนขอเสนอของเราตอผูนํา[FROM.GetAdjective]จะไมดีพอสําหรับพวกเขา ไมพวกเขามองทะลุแผนการในอนาคตของเรา ก็พวกเขาเองมีแผนรายตอเรา เราตองเตรียมรับความเปนไปไดนั้น และหากเราตองการเดินหนาตามแผน อาจตองใชการกระทําที่เปนปฏิปกษมากขึ้น"
 AUS_political_events.113.a: "นาเสียดาย"

 AUS_political_events.114.t: "[FROM.GetNameDef]เสนอการสนับสนุนทางอุตสาหกรรม"
 AUS_political_events.114.desc: "จากขอตกลงสันติภาพระหวางสองประเทศเมื่อไมนานมานี้ ชาว[FROM.GetAdjective]ไดเสนอการสนับสนุนทางอุตสาหกรรมแกเรา แมภาคอุตสาหกรรมของเรามักไดมาตรฐานตามที่เราตองการอยูแลว แตความชวยเหลือของพวกเขาก็ยอมเปนที่ยินดี มีบางเสียงเตือนใหระวัง โดยอางวา[FROM.GetNameDefCap]ตองทําเชนนี้ดวยเหตุผลบางอยางแน"
 AUS_political_events.114.a: "ฝากคําขอบคุณของเราไปดวย"

 AUS_political_events.115.t: "ขอเสนอการซอมรบรวม[FROM.GetAdjective]-[ROOT.GetAdjective]"
 AUS_political_events.115.desc: "เจาหนาที่จากกองทัพ[FROM.GetAdjective]ติดตอเรามาดวยหวังจะจัดการซอมรบรวมระหวางกองทัพของทั้งสอง พวกเขายืนยันวานี่จะเปนประโยชนที่สุดตอทั้งสองประเทศ และเราจะไดเรียนรูจากพวกเขามากมาย เชนเดียวกับที่พวกเขาจะไดเรียนรูจากเรา"
 AUS_political_events.115.a: "ทําไมจะไมละ?"
 AUS_political_events.115.b: "ฟงดูมีลับลมคมใน..."

 AUS_political_events.116.t: "การซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective]เสร็จสิ้น"
 AUS_political_events.116.desc: "วันนี้เปนวันสิ้นสุดการซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective] ทหารของเราไดประโยชนอยางมากจากการซอมรบนี้ และเราหวังวาชาว[FROM.GetAdjective]จะไดประโยชนเชนกัน การไดเห็นการปฏิบัติการของกองทัพ[FROM.GetAdjective]อยางใกลชิดยังทําใหเราเห็นภาพรวมที่ดีวาเราจะตองจัดการกับอะไร เมื่อแผนการของเราเกี่ยวกับอนาคตของพวกเขาเปนจริง"
 AUS_political_events.116.a: "ยอดเยี่ยม!"

 AUS_political_events.117.t: "[FROM.GetAdjective]ปฏิเสธการซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective]"
 AUS_political_events.117.desc: "\nแมจะมีประโยชนชัดเจนที่สุดทั้งตอเราและ[FROM.GetNameDef] แตพวกเขาก็ปฏิเสธขอเสนอซอมรบรวมของเรา กองทัพของเราทั้งสองอาจไดเรียนรูจากกันและกันมากมาย และนี่อาจเปนโอกาสอันดีที่เราจะชักนํา[FROM.GetNameDef]ไปในทิศทางที่เราตองการตามแผนในอนาคต"
 AUS_political_events.117.a: "ชางเถอะ..."

 AUS_political_events.118.t: "การจัดระเบียบจักรวรรดิ"
 AUS_political_events.118.desc: "เมื่อเราเริ่มตนเสนทางฟนฟูจักรวรรดิ คําถามวาเราจะจัดระเบียบจักรวรรดิอยางไรก็กลับมาอยูตรงหนาอีกครั้ง บรรพบุรุษของเราลมเหลวในเรื่องนี้ จนไดจักรวรรดิที่ใหญโตแตไรระเบียบ มีผูเสนอใหกอตั้งฝายขึ้นเพื่อใหรัฐบริวารของเราจงรักภักดีตอเรา และไมทะเลาะเบาะแวงกันเอง"
 AUS_political_events.118.a: "พวกเขาจะตองเขารวมกับเรา"
 AUS_political_events.118.b: "เราจะปลอยใหขอตกลงที่มีอยูจัดการเรื่องนี้"
 AUS_political_events.118.c: "เราจะตั้งองคกรที่เหมาะสมขึ้นมาจัดการเรื่องนี้!"
 AUS_political_events.118.c.tt: "§Y[FROM.FROM.GetNameDefCap]§! จะถูกบังคับใหเขารวมฝาย§Y[ROOT.GetAdjective]§!"

 AUS_political_events.119.t: "[FROM.GetNameDefCap]เรียกรองสัมปทานเพิ่มเติม"
 AUS_political_events.119.desc: "แมจะอางสิทธิ์ในคาบสมุทรบอลขานไปมากแลว แตดูเหมือนชาว[FROM.GetAdjective]ยังตองการมากกวานั้น ขอเรียกรองครั้งนี้จะรุกลํ้าเขตอิทธิพลของเราหากเรายอม ขณะเดียวกัน ผลที่ตามมาจากการปฏิเสธที่พวกเขาเอยถึงก็อาจรายแรงอยางยิ่ง"
 AUS_political_events.119.a: "เราตองยอม"
 AUS_political_events.119.b: "เราไมอาจยอมใหเปนเชนนี้!"

 AUS_political_events.120.t: "[FROM.GetNameDefCap]ยอมตามขอเรียกรองของเรา"
 AUS_political_events.120.desc: "ขอเรียกรองดินแดนที่เรายื่นตอผูนํา[FROM.GetAdjective]ไดรับการยอมรับแลว แมเราจะคาดไวอยูแลว แตก็ยังนายินดีที่ไมตองใชมาตรการรุนแรงกวานี้เพื่อยึดดินแดนอันชอบธรรมของเรา"
 AUS_political_events.120.a: "รุงโรจนยิ่งนัก"

 AUS_political_events.121.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 AUS_political_events.121.desc: "แมเราจะมีสิทธิ์อันชอบธรรมอยางยิ่งเหนือดินแดนที่ปจจุบันอยูในการครอบครองของ[FROM.GetAdjective] แต [FROM.GetLeader] ก็ตัดสินใจไมยอมมอบดินแดนตามที่รองขอ นี่เปนความถดถอยแนนอน แตเราจะเอาดินแดนเหลานั้นคืนมาใหไดไมวาอยางไร"
 AUS_political_events.121.a: "เราจะเอาดินแดนนั้นมาใหได!"

 AUS_political_events.122.t: "มนตรักเรือดํานํ้า[ROOT.GetAdjective]?"
 AUS_political_events.122.desc: "เกออรค ฟอน ทราพพ เคยเปนพลเรือเอกที่ไดรับความเคารพในกองทัพเรือออสเตรีย-ฮังการีอันยิ่งใหญ หลังจักรวรรดิอันเกรียงไกรของเราลมสลายและเราสูญเสียชายฝงทะเล เขาก็หันไปทํากิจการอื่นเชนเดียวกับอีกหลายคน หลังผานชวงทําธุรกิจการเงินที่ทําใหเขาสูญเสียทรัพยสินเกือบทั้งหมด เขาก็หันมาทางดนตรี\n\n บัดนี้เมื่อเราไดครอบครองชายฝงทะเล ฟอน ทราพพก็เสนอตัวจะออกทะเลอีกครั้งในนามของชาติอันยิ่งใหญของเรา"
 AUS_political_events.122.a: "ยอดเยี่ยม พาเขาเขากองทัพเรือ!"
 AUS_political_events.122.b: "ถึงเราจะชอบเขามากแคไหน... ก็ไม"
 AUS_political_events.123.t: "ชาว[FROM.GetAdjective]ฟนฟูฝายมหาอํานาจกลาง"
 AUS_political_events.123.desc: "ขาววาออสเตรียไดฟนฟูฝายมหาอํานาจกลางมาถึงเราเมื่อเชานี้เอง พันธมิตรทางทหารนี้ยืนหยัดรวมกันตลอดมหาสงคราม แตลมสลายเมื่อสมาชิกหลักสวนใหญลมสลาย ชาว[FROM.GetAdjective]ตัดสินใจรื้อฟนฝายนี้ขึ้นอีกครั้ง และเนื่องจากเราเคยเปนสวนหนึ่งของฝายนี้มากอน พวกเขาจึงเห็นสมควรสงคําเชิญมาถึงเรา"
 AUS_political_events.123.a: "เราจะยืนหยัดรวมกัน!"
 AUS_political_events.123.b: "ครั้งเดียวก็พอแลว"

 AUS_political_events.124.t: "[FROM.GetNameDefCap]เขารวม[ROOT.GetFactionName]"
 AUS_political_events.124.desc: "ดังที่เราคาดหวังจากพันธมิตรของเรา พวกเขายินดีอยางยิ่งที่ไดรับคําเชิญใหรวมฝายอันรุงโรจนของเราขึ้นอีกครั้ง พวกเขาตกลงเขารวมการตอสูของเรากับโลกที่ปฏิบัติตอเราอยางไมเปนธรรมเมื่อมหาสงครามสิ้นสุด"
 AUS_political_events.124.a: "จักรวรรดิของเราจะผงาดขึ้นอีกครั้ง!"

 AUS_political_events.125.t: "[FROM.GetNameDefCap]ปฏิเสธคําเชิญของเรา"
 AUS_political_events.125.desc: "เราหวังวาชาว[FROM.GetAdjective]จะเห็นประโยชนชัดเจนของการรวมมือกับเราอีกครั้ง แตดูเหมือนความพายแพที่เราเคยประสบในตอนนั้นไดบดบังวิสัยทัศนของพวกเขา [ROOT.GetLeader] ผูนําของเราตอบสนองเรื่องนี้อยางสงางามและเด็ดเดี่ยว นี่เปนเพียงความถดถอยเล็กนอยเทานั้น"
 AUS_political_events.125.a: "หากพวกเขาไมอยูขางเรา..."

 AUS_news_events.1.t: "[AUS.GetNameDefCap]ปฏิเสธอันชลุสสของ[GER.GetAdjective]"
 AUS_news_events.1.desc: "แมตองเผชิญศัตรูที่แข็งแกรงกวามาก ผูนํา[AUS.GetAdjective]ก็ตัดสินใจไมยอมตามขอเรียกรองลาสุดของ[GER.GetAdjective]ที่ใหยอมจํานนและรวมเขากับ[GER.GetNameDef] ทหารจาก[GER.GetNameDef]ไดตั้งแถวอยูที่ชายแดน[AUS.GetAdjective] แตยังตองรอดูวาจะมีการรุกรานเต็มรูปแบบหรือไม\n\nเหตุการณนี้เกิดขึ้นหลังจากความสัมพันธระหวางสองประเทศเลวรายลงเปนเวลาหลายป และแรงกดดันที่เพิ่มขึ้นจาก[GER.GetAdjective]ให[AUS.GetNameDef]รวมเขากับ[GER.GetNameDef]"
 AUS_news_events.1.a: "เราขอให[AUS.GetNameDef]โชคดีในเรื่องนี้..."
 AUS_news_events.1.b: "เราจะใหพวกเขาเห็น..."
 AUS_news_events.1.c: "Östfrei!"

 AUS_news_events.3.t: "จุดจบของยอดนักบินขับไล"
 AUS_news_events.3.desc: "กอดวิน ฟอน บรูมอฟสกี ยอดนักบินขับไลชาว[AUS.GetAdjective] เสียชีวิตในอุบัติเหตุเครื่องบินตกอยางรุนแรงพรอมกับนักเรียนการบินชาว[HOL.GetAdjective]ที่เขากําลังฝกสอนอยูเหนือสนามบินสคิปโฮล\n\nฟอน บรูมอฟสกีเปนยอดนักบินขับไลที่ประสบความสําเร็จสูงสุดของกองบินลุฟทฟารททรุพเพินอันเกรียงไกร ไดรับการยกยองวามีชัยชนะทางอากาศเดี่ยว 35 ครั้ง ชัยชนะรวม 12 ครั้ง และชัยชนะที่ยังไมไดรับการยืนยันอีก 8 ครั้ง เขาเคยรวมรบทั้งในมหาสงครามและสงครามกลางเมืองป 1934 ใน[AUS.GetNameDef]"
 AUS_news_events.3.a: "เขารับใชเรามาเปนอยางดี ขอใหไปสูสุคติ"
 AUS_news_events.3.b: "นาเศรา"

 AUS_news_events.4.t: "ยอดนักบินขับไลรอดจากหายนะอยางหวุดหวิด"
 AUS_news_events.4.desc: "เมื่อวานนี้ กอดวิน ฟอน บรูมอฟสกี ยอดนักบินขับไลชาว[AUS.GetAdjective] เกือบประสบหายนะขณะฝกสอนนักเรียนการบินชาว[HOL.GetAdjective]อยูเหนือสนามบินสคิปโฮล\n\nฟอน บรูมอฟสกีเปนยอดนักบินขับไลที่ประสบความสําเร็จสูงสุดของกองบินลุฟทฟารททรุพเพินอันเกรียงไกร ไดรับการยกยองวามีชัยชนะทางอากาศ 35 ครั้ง ชัยชนะรวมอีก 12 ครั้ง และชัยชนะที่ยังไมไดรับการยืนยันอีก 8 ครั้ง เขาเคยรวมรบทั้งในมหาสงครามและสงครามกลางเมืองป 1934 ใน[AUS.GetNameDef]\n\nทั้งคูรอดจากเหตุการณมาไดโดยแทบไมไดรับบาดเจ็บ"
 AUS_news_events.4.a: "เฉียดฉิว"

 AUS_news_events.5.t: "ชาว[AUS.GetAdjective]ยกเลิกสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล"
 AUS_news_events.5.desc: "\n[AUS.GetLeader] แหง[AUS.GetNameDef]ไดแถลงเมื่อไมนานมานี้ถึงความตั้งใจที่จะยกเลิกสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลอยางถาวรและฟนฟูกําลังทหารอีกครั้ง สนธิสัญญานี้ถูกทําขึ้นหลังมหาสงครามเพื่อปองกันไมให[AUS.GetNameDef]กอการซํ้ารอยที่จุดชนวนสงคราม และขยายดินแดนเพื่อแสวงหาอํานาจ นักวิเคราะหคาดวานี่เปนการตอบสนองตอความตึงเครียดที่คอยๆ เพิ่มขึ้นทั่วโลก สวนการเสริมกําลังทหารครั้งนี้มีเจตนาเพื่อปองกันหรือรุกรานนั้นยังตองรอดูตอไป"
 AUS_news_events.5.a: "นาเปนหวง"
 AUS_news_events.5.b: "เสียที!"

 AUS_news_events.6.t: "[AUS.GetNameDefCap]ฟนฟูฝายมหาอํานาจกลาง"
 AUS_news_events.6.desc: "\n\nเมื่อไมมีทางเลือกดานพันธมิตรที่เปนไปไดในพื้นที่ใกลเคียง [AUS.GetNameDef]จึงหันมาฟนฟูฝายมหาอํานาจกลางขึ้นอีกครั้ง หลังหลุดพนจากสนธิสัญญาที่ถูกบังคับใช ประเทศนี้ไดหันไปเสริมกําลังทหารอยางรวดเร็ว พันธมิตรใหมของพวกเขาจะเหมือนฝายชื่อเดียวกันในมหาสงครามหรือไมนั้นยังตองรอดูตอไป"
 AUS_news_events.6.a: "นาเปนหวง"
 AUS_news_events.6.b: "วันที่ยิ่งใหญ!"

 AUS_news_events.7.t: "อ็อทโท ฟอน ฮาพสบวรค เสด็จกลับสู[AUS.GetNameDef]"
 AUS_news_events.7.desc: "\nหลังจากใชชีวิตสวนใหญในการลี้ภัย ครั้งแรกที่[SWI.GetNameDef] และตอมาที่เกาะมาเดราใน[POR.GetNameDef] อ็อทโท ฟอน ฮาพสบวรค ไดเสด็จกลับสู[AUS.GetNameDef]แลว เจาชายพระองคนี้เสด็จหนีออกนอกประเทศในป 1918 พรอมพระบิดาคือจักรพรรดิคารลที่ 1 และพระมารดาคือจักรพรรดินีซิตา หลังระบอบกษัตริยลมสลายเมื่อมหาสงครามสิ้นสุด การเสด็จกลับมาเปนประมุขแหงรัฐ[AUS.GetAdjective]ของพระองคแสดงถึงการเปลี่ยนแปลงครั้งสําคัญของบรรยากาศทางการเมืองใน[AUS.GetNameDef]"
 AUS_news_events.7.a: "ขอเจาชายแหงฮาพสบวรคทรงพระเจริญ!"
 AUS_news_events.7.b: "นี่ไมใชสิ่งที่เรากําหนดไวในสนธิสัญญา!"
 AUS_news_events.7.c: "ดีสําหรับพระองค"

 AUS_news_events.8.t: "ราชวงศฮาพสบวรคครองฮาพสบวรค"
 AUS_news_events.8.desc: "ภายใตการปกครองของ [AUS.GetLeader] [AUS.GetNameDef]ไดทวงคืนเมืองฮาพสบวรค หลังบังคับใหชาว[SWI.GetAdjective]ยอมตามความตองการ จุดประสงคของการนี้คือเสริมอํานาจของราชวงศฮาพสบวรค และเปนการหวนคืนสู[AUS.GetName]ที่เปนจักรวรรดินิยมมากขึ้นอยางชัดเจน"
 AUS_news_events.8.a: "ทําไมพวกเขาถึงทําแบบนั้น?"
 AUS_news_events.8.b: "ฮาพสบวรคเปนของเรา!"

 AUS_news_events.9.t: "รัฐประหารคอมมิวนิสตใน[FROM.GetNameDef]"
 AUS_news_events.9.desc: "หลังการสนับสนุน[FROM.GetCommunistParty]ใน[FROM.GetNameDef]เพิ่มขึ้นเปนเวลานาน ก็เกิดรัฐประหารอยางสันติขึ้นใน[FROM.GetNameDef] ฝายคอมมิวนิสตขึ้นสูอํานาจอยางสันติและเขาแทนที่ในรัฐบาลโดยแทบไมมีการตอตาน \n\nนี่เปนการเปลี่ยนแปลงครั้งใหญจากสิ่งที่[FROM.GetNameDef]เปนมาตลอดหลายทศวรรษที่ผานมา"
 AUS_news_events.9.a: "ไมคาดคิดเลย"
 AUS_news_events.9.b: "ขอใหพวกเขาโชคดี!"
 AUS_news_events.9.c: "เสียที!"

 AUS_news_events.10.t: "สงครามกลางเมืองใน[FROM.GetNameDef]"
 AUS_news_events.10.desc: "สงครามกลางเมืองอันรุนแรงปะทุขึ้นใน[FROM.GetNameDef] [FROM.GetCommunistParty]ฝายคอมมิวนิสตไดลุกฮือตอตาน[FROM.GetNeutralParty]ที่ปกครองอยู หลังไดรับการสนับสนุนจํานวนมากในชวงที่ผานมา ฝายคอมมิวนิสตก็กลายเปนกําลังที่ตองจับตามองใน[FROM.GetNameDef]"
 AUS_news_events.10.a: "ไรสาระสิ้นดี"
 AUS_news_events.10.b: "ทําไดดี และขอใหโชคดี!"
 AUS_news_events.10.c: "เดินหนา!"

 AUS_news_events.11.t: "[AUS.GetNameDefCap]กอตั้งกลุมดานูบ"
 AUS_news_events.11.desc: "หลังหันหลังใหอดีตอยางสิ้นเชิง ผูนํา[AUS.GetAdjective]ซึ่งมี [AUS.GetLeader] เปนหัวหนา ไดตัดสินใจกอตั้งฝายของตนเอง เขาแสดงความหวังวาแรงงานคนอื่นๆ ในยุโรปกลางจะลุกขึ้นตอตานผูกดขี่และรวมกับพวกเขาในการตอสูเพื่อสิทธิของประชาชน"
 AUS_news_events.11.a: "ทําไมพวกเขาถึงทําแบบนั้น?"
 AUS_news_events.11.b: "ขอใหพวกเขาประสบแตสิ่งดีๆ!"
 AUS_news_events.11.c: "วันที่ยิ่งใหญของ[AUS.GetNameDef]!"
 
 AUS_news_events.12.t: "[AUS.GetNameDefCap]จัดการเลือกตั้งแบบประชาธิปไตยอีกครั้ง"
 AUS_news_events.12.desc: "\nเปนครั้งแรกนับตั้งแตวันที่ 11 กันยายน 1930 ที่[AUS.GetNameDef]จัดการเลือกตั้งแบบประชาธิปไตย ผูมาใชสิทธิ์มีจํานวนสูง และเมื่อการนับคะแนนเสร็จสิ้น [AUS.GetLeader] แหง[AUS.GetDemocraticParty]ก็เปนผูชนะ บัดนี้เขาตองเผชิญภารกิจอันยากลําบากในการนําประเทศสูเสนทางใหมที่เปนประชาธิปไตยมากขึ้น"
 AUS_news_events.12.a: "ยอดเยี่ยม"
 AUS_news_events.12.b: "รับทราบ"


 # Hungarian country events

 WW_hungary.1.t: "[HUN.GetName]เปดตัวโครงการผลิตรวมของพันธมิตร"
 WW_hungary.1.desc: "[HUN.GetNameDef]พันธมิตรของเราไดริเริ่มโครงการพัฒนาอากาศยานรวมกันภายในฝายของเรา และไดเริ่มตนดวยการลงทุนในการพัฒนาของเรา เพื่อตอยอดการพัฒนาของพวกเขาเองในอนาคต"
 WW_hungary.1.a: "เปนประโยชนแนนอน"

 WW_hungary.2.t: "อาวุธจาก[FROM.GetAdjective]มาถึงแลว"
 WW_hungary.2.desc: "รัฐบาล[FROM.GetAdjective]ประกาศจุดยืนสนับสนุนประเทศของเราในความพยายามทําสงครามอยางเปดเผย และในฐานะสวนหนึ่งของการสนับสนุนครั้งใหม พวกเขาไดสงอาวุธมาใหเรา สิ่งนี้จะชวยเราในสงครามครั้งนี้ไดแนนอน"
 WW_hungary.2.a: "ยอดเยี่ยม!"

 WW_hungary.3.t: "การถึงแกอสัญกรรมของนายกรัฐมนตรีจูลา เกิมเบิช"
 WW_hungary.3.desc: "มีรายงานวาจูลา เกิมเบิช นายกรัฐมนตรีของเรา นายทหารและผูนําสมาคมปองกันชาติฮังการี ไดถึงแกอสัญกรรมดวยโรคมะเร็งอัณฑะระหวางภารกิจทางการทูตที่มิวนิก แม [ROOT.GetLeader] จะมีนายกรัฐมนตรีคนใหมอยูในใจแลว คือคาลมาน ดาราญี ผูมีแนวคิดสายกลาง แตยังคงมีคําถามวาจะทําอยางไรกับองคกรกึ่งทหารฟาสซิสตที่เกิมเบิชเคยนํา ดวยจุดยืนตอตานคอมมิวนิสตที่พวกเขามีรวมกับ [ROOT.GetLeader] เราอาจโนมนาวใหพวกเขาทํางานใหเราได แตการไมรูวาความภักดีที่แทจริงของพวกเขาอยูที่ใดอาจเปนอันตรายตอเราในอนาคตหากเรารวมพวกเขาเขากับกองทัพ เราควรจัดการกับ MOVE อยางไร?"
 WW_hungary.3.a: "เราควรพยายามผนวกรวม MOVE"
 WW_hungary.3.b: "ยุบพวกฟาสซิสตเซแกดนี่ทันที!"
 WW_hungary.3.c: "ปลอยพวกเขาไป จะเลวรายสักแคไหนกันเชียว?"
 HUN_gombos_has_died_flag: "§Yจูลา เกิมเบิช§! ถึงแกอสัญกรรมแลว"

 WW_hungary.4.t: "[HUN.GetNameDefCap]เรียกรองทรานซิลเวเนีย"
 WW_hungary.4.desc: "ทรานซิลเวเนียเคยเปนสวนหนึ่งของ[HUN.GetNameDef]มายาวนาน กอนจะถูกยึดไปตามสนธิสัญญาทรียานง นาเสียดายที่[HUN.GetNameDef]ไมเคยทําใจกับการสูญเสียดินแดนนี้ได หลายครั้งที่พวกเขาอางอยางเปดเผยวาทรานซิลเวเนียเปนสวนที่แยกไมไดของชาติตน และดวยสถานการณทางการเมืองที่เปลี่ยนไปเมื่อไมนานมานี้ พวกเขาจึงตัดสินใจรุกการอางสิทธิ์อีกครั้ง โดยเรียกรองใหเรามอบทรานซิลเวเนียทั้งหมดแกพวกเขา...ไมอยางนั้นละก็"
 WW_hungary.4.a: "ชางเถอะ เอาไปก็ได..."
 WW_hungary.4.b: "ไมอยางนั้น...จะทําไม?"

 WW_hungary.5.t: "[FROM.GetNameDefCap]โอนทรานซิลเวเนีย"
 WW_hungary.5.desc: "แทนที่จะเผชิญหนากับแสนยานุภาพของกองทัพเรา ชาว[FROM.GetAdjective]ผูขลาดเขลาตัดสินใจคืนดินแดนอันชอบธรรมใหเรา ดินแดนทั้งหมดในทรานซิลเวเนียที่พวกเขาควบคุมอยูถูกสงมอบใหอยูใตการบริหารของเรา และกองกําลังของเราไดเขาควบคุมอยางสมบูรณแลว"
 WW_hungary.5.a: "อยางที่ควรจะเปน"

 WW_hungary.6.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะโอนทรานซิลเวเนีย"
 WW_hungary.6.desc: "ผูนําผูหยิ่งยโสใน[FROM.getNameDef]ตัดสินใจปฏิเสธขอเสนอสันติภาพของเรา และอางวายอมทําสงครามดีกวามอบทรานซิลเวเนียใหเรา บางทีพวกเขาอาจจับไดวาเราขู หรือบางทีนี่อาจเปนเวลาเหมาะที่จะโจมตีพวกเขา มีเพียงเวลาเทานั้นที่จะบอกได"
 WW_hungary.6.a: "ถาอยางนั้นก็สงคราม"
 WW_hungary.6.b: "มันไมคุมคาความพยายามเลย"

 WW_hungary.7.t: "[FROM.GetNameDefCap]เรียกรองสโลวาเกียตอนใต"
 WW_hungary.7.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองสโลวาเกียตอนใตของ[FROM.GetAdjective]อยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.7.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.7.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.8.t: "[HUN.GetNameDefCap]เสนอการคุมครองแลกกับ[975.GetName]"
 WW_hungary.8.desc: "[HUN.GetLeader] แหง[HUN.GetNameDef]ไดติดตอเรามาพรอมขอเสนอที่นาสนใจ เขาบอกวาหากเราคืน[975.GetName] หรือที่พวกเขาเรียกวาลอยตาบานชาก ใหอยูในมือของ[HUN.GetAdjective] พวกเขายินดีจะรับประกันเอกราชของเรา และยืนเคียงขางเราหากชาว[GER.GetAdjective]บุกมา เราควรรับขอเสนอนี้หรือไม?"
 WW_hungary.8.a: "เราตองการความชวยเหลือทุกทางที่หาได..."
 WW_hungary.8.b: "แลวการรับประกันของพวกเขามีคาแคไหนกันแน?"

 WW_hungary.9.t: "[FROM.GetNameDefCap]มอบ[975.GetName]แลกกับการรับประกัน"
 WW_hungary.9.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจรับขอเสนอของเรา และจะสงมอบการควบคุมภูมิภาค[975.GetName]ใหเราโดยเร็วเพื่อแลกกับการรับประกันเอกราช เราขยายใหญขึ้น และมิตรภาพของเรากับชาว[FROM.GetAdjective]ก็กลับมาเบงบานอีกครั้ง"
 WW_hungary.9.a: "วันนี้เรายืนหยัดดั่งมิตรเกาที่ไดกลับมาพบกันอีกครั้ง!"

 WW_hungary.10.t: "[FROM.GetNameDefCap]ปฏิเสธการคุมครองของเรา"
 WW_hungary.10.desc: "ผูนําผูโงเขลาใน[FROM.GetNameDef]ปฏิเสธขอเสนอของเรา โดยอางวาเห็นไดชัดวามันเปนประโยชนตอเรามากกวาพวกเขา และพวกเขาไมอาจเชื่อไดอยางมีเหตุผลวาเราจะรักษาคํามั่นสัญญา... พวกเขาคิดวาเราเปนใครกัน!?"
 WW_hungary.10.a: "พวกเขาคงสติไมดี..."

 WW_hungary.11.t: "[FROM.GetNameDefCap]เรียกรองการควบคุมดินแดน[SLO.GetAdjective]ของเรา"
 WW_hungary.11.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองสโลวาเกียของ[FROM.GetAdjective]อยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.11.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.11.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.12.t: "[FROM.GetNameDefCap]มอบดินแดน[SLO.GetAdjective]ของตน"
 WW_hungary.12.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในสโลวาเกียของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.12.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.13.t: "[FROM.GetNameDefCap]ยืนหยัดในสโลวาเกีย"
 WW_hungary.13.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.13.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.13.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.14.t: "[FROM.GetNameDefCap]เรียกรองวอยวอดีนา"
 WW_hungary.14.desc: "รัฐบาล[HUN.GetAdjective]เริ่มกดดันหนักขึ้นในประเด็นวอยวอดีนา โดยอางวาดินแดนนี้เคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ จึงควรถูกสงคืน พวกเขาอางวาการรวมเขากับเซอรเบียเมื่อมหาสงครามสิ้นสุด "เปนโมฆะเพราะถูกกดดันจากภายนอก" ดินแดนนี้จึงยังคงเปนของ[HUN.GetAdjective]ตามกฎหมาย"
 WW_hungary.14.a: "นี่ไมใชความขัดแยงที่เราจะชนะได"
 WW_hungary.14.b: "เราจะไมสนับสนุนความเพอฝนของพวกเขา"

 WW_hungary.15.t: "[FROM.GetNameDefCap]โอนวอยวอดีนา"
 WW_hungary.15.desc: "\n[FROM.GetNameDef]ตกลงยกวอยวอดีนาใหเราแลว กองกําลังของเราเขาควบคุมภูมิภาคนี้อยางสมบูรณ และการผนวกรวมจะเริ่มขึ้นในทันที"
 WW_hungary.15.a: "ยอดเยี่ยม"

 WW_hungary.16.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 WW_hungary.16.desc: "ในการประชุมอันตึงเครียดกับ [FROM.GetLeader] คณะผูแทนของเราไดรับแจงวาอธิปไตยเหนือวอยวอดีนาไมใชเรื่องที่จะนํามาหารือ และไมวากรณีใด รัฐบาล[FROM.GetAdjective]จะไมมีวันยอมกมหัวใหแรงกดดันเชนนี้ ประชาชนในวอยวอดีนาไดแสดงเจตจํานงแลวในป 1919 และพวกเขาเลือกที่จะไมรวมกับเราในตอนนั้น สําหรับรัฐบาล[FROM.GetAdjective]แลว เรื่องนี้จบไปแลว"
 WW_hungary.16.a: "บางทีก็อาจจะจริง"
 WW_hungary.16.b: "พวกเขาจะตองเสียใจกับวันนี้"

 WW_hungary.17.t: "[HUN.GetName]เรียกรองใหยึดครองบานัตตะวันตก"
 WW_hungary.17.desc: "วันนี้ [HUN.GetLeader] แหง[HUN.GetNameDef]สงคําขาดมาเรียกรองใหเรายอมให[HUN.GetName]ยึดครองภูมิภาคบานัตตะวันตก หากเราไมยอมตามขอเรียกรองของ [HUN.GetLeader] เราคงตองเผชิญความขัดแยงทางทหารแน"
 WW_hungary.17.a: "ใหพวกเขาไปเถอะ"
 WW_hungary.17.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 WW_hungary.18.t: "[FROM.GetNameDefCap]ยอมรับขอเรียกรองของเรา"
 WW_hungary.18.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ยอมรับขอเรียกรองใหเรายึดครองบานัตตะวันตกอยางนุมนวล และยกดินแดนนี้ใหเราในเวลาตอมา พวกเขาเลือกเอาใจเรามากกวาจะยืนหยัดตอตาน ซึ่งจะยิ่งชวยผลักดันเปาหมายของอิตาลีในคาบสมุทรบอลขาน"
 WW_hungary.18.a: "ทุกอยางเปนไปตามแผน"

 WW_hungary.19.t: "[FROM.GetLeader] ผูโงเขลาปฏิเสธคําขาดของเรา"
 WW_hungary.19.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาปฏิเสธดินแดนอันชอบธรรมของเรา บัดนี้ถึงเวลาโคน[FROM.GetNameDef]ลงดวยการโจมตีอันรวดเร็วเพียงครั้งเดียว ซึ่งจะรับประกันการอางสิทธิ์ของเราเหนือบานัตตะวันตกไดในอนาคตอันใกลแนนอน"
 WW_hungary.19.a: "ถาอยางนั้นก็ตองใชกําลัง"

 WW_hungary.20.t: "[FROM.GetNameDefCap]เรียกรองรูทีเนียคารเพเทียน"
 WW_hungary.20.desc: "รัฐบาล[HUN.GetAdjective]เริ่มกดดันหนักขึ้นในประเด็นรูทีเนียคารเพเทียน โดยอางวาดินแดนนี้เคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ จึงควรถูกสงคืน พวกเขาอางวาสาธารณรัฐฮุตซุลและรัฐสืบทอดทั้งหมดในพื้นที่นี้ไมชอบธรรม และความอยุติธรรมนี้จะถูกแกไขไดก็ตอเมื่อภูมิภาคนี้กลับมาเปนของ[HUN.GetAdjective]อีกครั้ง"
 WW_hungary.20.a: "นี่ไมใชความขัดแยงที่เราจะชนะได"
 WW_hungary.20.b: "พวกเขาทําไดจริงอยางที่พูดหรือ?"

 WW_hungary.21.t: "[FROM.GetNameDefCap]โอนรูทีเนียคารเพเทียน"
 WW_hungary.21.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในรูทีเนียคารเพเทียนของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.21.a: "ยอดเยี่ยม"

 WW_hungary.22.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 WW_hungary.22.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทเรื่องรูทีเนียคารเพเทียน"
 WW_hungary.22.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.22.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.23.t: "[FROM.GetNameDefCap]เรียกรองบูรเกนลันด"
 WW_hungary.23.desc: "รัฐบาล[HUN.GetAdjective]เริ่มกดดันหนักขึ้นในประเด็นบูรเกนลันด โดยอางวาดินแดนนี้เคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ จึงควรถูกสงคืน พวกเขาอางวาตองฟนฟูลอยตาบานชากขึ้นในพื้นที่นี้ และการปกครองของเราไมชอบธรรม เราควรตอบสนองอยางไร?"
 WW_hungary.23.a: "นี่ไมใชความขัดแยงที่เราจะชนะได"
 WW_hungary.23.b: "พวกเขาทําไดจริงอยางที่พูดหรือ?"

 WW_hungary.24.t: "[FROM.GetNameDefCap]โอนบูรเกนลันด"
 WW_hungary.24.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในบูรเกนลันดของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.24.a: "ยอดเยี่ยม"

 WW_hungary.25.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 WW_hungary.25.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทเรื่องบูรเกนลันด"
 WW_hungary.25.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.25.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.26.t: "[FROM.GetNameDefCap]ตองการเขารวมฝายของเรา"
 WW_hungary.26.desc: "[FROM.GetLeader] ติดตอเรามาหลังเยือนเมืองหลวงอันยิ่งใหญของเรา โดยอางวาพูดในนามของประชาชน[FROM.GetAdjective]ทั้งมวล และปรารถนาใหทั้งสองชาติรวมเปนพันธมิตรทางทหาร โดยมีเปาหมายขยายดินแดนของทั้งชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตอไป"
 WW_hungary.26.a: "ยินดีตอนรับใหเขารวมกับเรา"
 WW_hungary.26.b: "เราไมมีประโยชนอะไรกับพวกเขา"

 WW_hungary.27.t: "[FROM.GetNameDefCap]ยอมใหเราเขารวม"
 WW_hungary.27.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูยิ่งใหญตกลงกอตั้งพันธมิตรทางทหารใหม เสริมความสัมพันธที่มีอยูแลวระหวางสองชาติใหแนนแฟนขึ้น ประชาชนของเราออกมาเฉลิมฉลองตามทองถนนในโอกาสสําคัญนี้ เพราะเปนการเกิดใหมของรัฐ[ROOT.GetAdjective] และเปนจุดเริ่มตนยุคใหมของประชาชน"
 WW_hungary.27.a: "มาสรางอนาคตของเราดวยกัน!"

 WW_hungary.28.t: "[FROM.GetNameDefCap]ไมยอมใหเราเขารวม"
 WW_hungary.28.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูตํ่าชาปฏิเสธคําขอของเรา ซึ่งเทากับปดโอกาสความรวมมือระหวางสองรัฐในอนาคตอันใกลทั้งหมด เราจึงตองแสวงหาพันธมิตรอื่น หรือไมก็ยืนหยัดดวยตนเอง"
 WW_hungary.28.a: "มันไมใชโชคชะตา"

 WW_hungary.29.t: "[FROM.GetNameDefCap]จะฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.29.desc: "รัฐบาลใน[FROM.GetNameDef]ประกาศเจตนาจะนําพระราชกฤษฎีกาแพรกมาติกป 1713 กลับมาใชอีกครั้ง ซึ่งเทากับเปดทางใหราชวงศฮาพสบวรคขึ้นครองบัลลังกอีกครั้ง สวนทางกับขอเรียกรองของเราหลังมหาสงคราม เราไมอาจอางเหตุทําสงครามเพราะเรื่องนี้ได แตเมื่อพวกเขาอาจเปนภัยตอเราในไมชา บางทีเราควรลองบีบพวกเขาดู?"
 WW_hungary.29.a: "ยื่นหนังสือประทวงทางการทูต"
 WW_hungary.29.b: "ประกาศควํ่าบาตรและยื่นหนังสือประทวง"

 WW_hungary.30.t: "ความตกลงไตรภาคีนอยตองการคํามั่นวาจะรักษาสันติภาพ"
 WW_hungary.30.desc: "ประเทศสมาชิกความตกลงไตรภาคีนอยไมไดมองขามความพยายามฟนฟูระบอบกษัตริยฮาพสบวรคของคารลที่ 4 ในป 1921 และยังคงไมยอมใหมีการกระทําเชนนั้น แตครั้งนี้พวกเขาไมไดขูจะทําสงครามกับเราเพราะเรื่องนี้ หากเรียกรองใหเราแสดงเจตนาอันสันติ มิฉะนั้นพวกเขาจะตองยุติระบอบกษัตริยของเราใหสิ้นซาก"
 WW_hungary.30.a: "เราสัญญาวาจะไมรุกรานได ในตอนนี้..."
 WW_hungary.30.b: "พวกเขาบังคับเราไมได!"
 HUN_habsburg_refused_promises_of_peace: "ปฏิเสธที่จะใหคํามั่นรักษาสันติภาพแกความตกลงไตรภาคีนอย"

 WW_hungary.31.t: "[FROM.GetNameDefCap]แตงตั้งพระมหากษัตริยองคใหมใหเรา"
 WW_hungary.31.desc: "[FROM.GetNameDefCap]ไดแตงตั้งโยเซฟ เอากุสท ฟอน ฮาพสบวรค เปนพาลาไทนองคใหมของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.31.a: "แนนอน"

 WW_hungary.32.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.32.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูดินแดนซิสไลทาเนีย และสวมมงกุฎใหราชวงศฮาพสบวรคเปนพระมหากษัตริยของเราอีกครั้ง ซึ่งเทากับยุติเอกราชของเรา แตอาจชวยใหเรารอดพนจากการถูกผนวกทั้งหมด เราจะยอมรับที่ทางในสหพันธจักรวรรดิใหมหรือไม?"
 WW_hungary.32.a: "พวกเขาพูดถูก"
 WW_hungary.32.b: "ราชวงศฮาพสบวรคถูกเนรเทศก็เพราะมีเหตุผล!"

 WW_hungary.33.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยฮาพสบวรค"
 WW_hungary.33.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหพระมหากษัตริยฮาพสบวรคตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม รุงอรุณใหมจะฉายแสงแกสหพันธจักรวรรดิของเรา!"
 WW_hungary.33.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.34.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยฮาพสบวรค"
 WW_hungary.34.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจไมลงจากตําแหนง ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหโยเซฟ เอากุสท ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.34.a: "พวกเขาเลือกผิดแลว"

 WW_hungary.35.t: "[FROM.GetNameDefCap]ตองการเขารวมฝายของเรา"
 WW_hungary.35.desc: "[FROM.GetLeader] ติดตอเรามาหลังเยือนเมืองหลวงอันยิ่งใหญของเรา โดยอางวาพูดในนามของประชาชน[FROM.GetAdjective]ทั้งมวล และปรารถนาใหทั้งสองชาติรวมเปนพันธมิตรทางทหาร โดยมีเปาหมายขยายดินแดนของทั้งชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตอไป"
 WW_hungary.35.a: "ยินดีตอนรับใหเขารวมกับเรา"
 WW_hungary.35.b: "เราไมมีประโยชนอะไรกับพวกเขา"

 WW_hungary.36.t: "[FROM.GetNameDefCap]ฟนฟูฝายมหาอํานาจกลาง"
 WW_hungary.36.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูยิ่งใหญและทรงเกียรติตกลงกอตั้งพันธมิตรทางทหารใหม เสริมความสัมพันธที่มีอยูแลวระหวางสองชาติใหแนนแฟนขึ้น ประชาชนของเราออกมาเฉลิมฉลองตามทองถนนในโอกาสสําคัญนี้ เพราะเปนการเกิดใหมของรัฐ[ROOT.GetAdjective] และเปนจุดเริ่มตนยุคใหมของประชาชน"
 WW_hungary.36.a: "มาสรางอนาคตของเราดวยกัน!"

 WW_hungary.37.t: "[FROM.GetNameDefCap]หยามเกียรติเรา"
 WW_hungary.37.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูตํ่าชาปฏิเสธคําขอของเรา ซึ่งเทากับปดโอกาสความรวมมือระหวางสองรัฐในอนาคตอันใกลทั้งหมด เราจึงตองแสวงหาพันธมิตรอื่น หรือไมก็ยืนหยัดดวยตนเอง"
 WW_hungary.37.a: "มันไมใชโชคชะตา"

 WW_hungary.38.t: "[FROM.GetNameDefCap]เชิญเราเขารวมฝายมหาอํานาจกลาง"
 WW_hungary.38.desc: "[FROM.GetLeader] ติดตอเรามาหลังเยือนเมืองหลวงของเรา โดยอางวาพูดในนามของประชาชน[FROM.GetAdjective]ทั้งมวล และปรารถนาใหทั้งสองชาติกลับมารวมเปนพันธมิตรทางทหารอีกครั้ง โดยมีเปาหมายขยายดินแดนของทั้งชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตอไป เราจะตอบคํารองของพวกเขาอยางไร?"
 WW_hungary.38.a: "พวกเขาจะไมมีวันยืนอยูลําพัง"
 WW_hungary.38.b: "พวกเขาเปนแคภาระ"

 WW_hungary.39.t: "[FROM.GetNameDefCap]เขารวมฝายมหาอํานาจกลาง"
 WW_hungary.39.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูยิ่งใหญและทรงเกียรติตกลงเขารวมพันธมิตรทางทหารใหมของเรา เสริมความสัมพันธที่มีอยูแลวระหวางสองชาติใหแนนแฟนขึ้น ประชาชนของเราออกมาเฉลิมฉลองตามทองถนนในโอกาสสําคัญนี้ เพราะเปนการเกิดใหมของรัฐ[ROOT.GetAdjective] และเปนจุดเริ่มตนยุคใหมของประชาชน"
 WW_hungary.39.a: "มาแกไขความผิดพลาดของมหาสงครามกัน!"

 WW_hungary.40.t: "[FROM.GetNameDefCap]หยามเกียรติเรา"
 WW_hungary.40.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูตํ่าชาปฏิเสธคําขอของเรา ซึ่งเทากับปดโอกาสความรวมมือระหวางสองรัฐในอนาคตอันใกลทั้งหมด เราจึงตองแสวงหาพันธมิตรอื่น เพราะพวกเขาไมยินดีจะรวมเปนพันธมิตรกับเรา"
 WW_hungary.40.a: "ถาอยางนั้นเราจะนําเอง!"
 WW_hungary.40.b: "เราตองลองวิธีอื่น"

 WW_hungary.41.t: "[FROM.GetNameDefCap]ตองการฟนฟูมหาพันธมิตร"
 WW_hungary.41.desc: "[FROM.GetLeader] ติดตอเรามาหลังเยือนเมืองหลวงอันยิ่งใหญของเรา โดยอางวาพูดในนามของประชาชน[FROM.GetAdjective]ทั้งมวล และปรารถนาใหทั้งสองชาติรวมเปนพันธมิตรทางทหาร โดยมีเปาหมายขยายดินแดนของทั้งชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตอไป"
 WW_hungary.41.a: "ยินดีตอนรับใหเขารวมกับเรา"
 WW_hungary.41.b: "เราไมมีประโยชนอะไรกับพวกเขา"

 WW_hungary.42.t: "[FROM.GetNameDefCap]ใหเกียรติมหาพันธมิตร"
 WW_hungary.42.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูยิ่งใหญและทรงเกียรติตกลงกอตั้งพันธมิตรทางทหารใหม ประชาชนของเราออกมาเฉลิมฉลองตามทองถนนในโอกาสสําคัญนี้ เพราะเปนการเกิดใหมของรัฐ[ROOT.GetAdjective] และเปนจุดเริ่มตนยุคใหมของประชาชน"
 WW_hungary.42.a: "มาปกปองอนาคตของเราดวยกัน!"

 WW_hungary.43.t: "[FROM.GetNameDefCap]หยามเกียรติเรา"
 WW_hungary.43.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูตํ่าชาปฏิเสธคําขอของเรา ซึ่งเทากับปดโอกาสความรวมมือระหวางสองรัฐในอนาคตอันใกลทั้งหมด เราจึงตองแสวงหาพันธมิตรอื่น หรือไมก็ยืนหยัดดวยตนเอง"
 WW_hungary.43.a: "ไวใจไดจริงก็แตคนในครอบครัว"
 ENG_Rejected_HUN_grand_alliance: "อังกฤษปฏิเสธการฟนฟูมหาพันธมิตร"

 WW_hungary.44.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศวีด"
 WW_hungary.44.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูราชบัลลังกของราชวงศวีด และสวมมงกุฎใหวิลเฮลมแหงวีดเปนพระมหากษัตริยของเราอีกครั้ง ซึ่งเทากับยุติเอกราชของเรา แตอาจชวยใหเรารอดพนจากการถูกผนวกทั้งหมด เราจะยอมรับที่ทางในสหพันธจักรวรรดิใหมหรือไม?"
 WW_hungary.44.a: "พวกเขาพูดถูก"
 WW_hungary.44.b: "ราชวงศวีดถูกเนรเทศก็เพราะมีเหตุผล!"

 WW_hungary.45.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยราชวงศวีด"
 WW_hungary.45.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหวิลเฮลมแหงวีดตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม รุงอรุณใหมจะฉายแสงแกสหพันธจักรวรรดิของเรา!"
 WW_hungary.45.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.46.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยราชวงศวีด"
 WW_hungary.46.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจไมลงจากตําแหนง ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหวิลเฮลมแหงวีดขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.46.a: "พวกเขาเลือกผิดแลว"

 WW_hungary.47.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.47.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรคเหนือดินแดนของเราตามที่ตกลงกันไวในพระราชบัญญัติ 5 พฤศจิกายน และสวมมงกุฎใหราชวงศฮาพสบวรคเปนพระมหากษัตริยของเราอีกครั้ง ซึ่งจะทําใหเราอยูฝายเดียวกับพวกเขาและเขารวมพันธมิตรของพวกเขาได โดยไมตองสูญเสียเอกราชทั้งหมด"
 WW_hungary.47.a: "เปนหนาที่ของเรา"
 WW_hungary.47.b: "ลมลางกษัตริย!"

 WW_hungary.48.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยฮาพสบวรค"
 WW_hungary.48.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหพระมหากษัตริยฮาพสบวรคตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม"
 WW_hungary.48.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.49.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยฮาพสบวรค"
 WW_hungary.49.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจไมลงจากตําแหนง ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหคารล อัลเบรชท ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.49.a: "พวกเขาเลือกผิดแลว"

 WW_hungary.50.t: "[FROM.GetNameDefCap]แตงตั้งพระมหากษัตริยฮาพสบวรคใหเรา"
 WW_hungary.50.desc: "[FROM.GetNameDefCap]ไดแตงตั้งคารล ปอุส ฟอน ฮาพสบวรค เปนกษัตริยองคใหมของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.50.a: "แนนอน"

 WW_hungary.51.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.51.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรคเหนือดินแดนของเราดังที่เคยเปนระหวางป 1516 ถึง 1700 และสวมมงกุฎใหราชวงศฮาพสบวรคเปนพระมหากษัตริยของเราอีกครั้ง ซึ่งจะทําใหเราอยูฝายเดียวกับพวกเขาและเขารวมพันธมิตรของพวกเขาได โดยไมตองสูญเสียเอกราชทั้งหมด"
 WW_hungary.51.a: "เปนหนาที่ของเรา"
 WW_hungary.51.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 WW_hungary.52.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยฮาพสบวรค"
 WW_hungary.52.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหพระมหากษัตริยฮาพสบวรคตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม"
 WW_hungary.52.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.53.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยฮาพสบวรค"
 WW_hungary.53.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจไมลงจากตําแหนง ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหคารล ปอุส ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.53.a: "พวกเขาเลือกผิดแลว"

 WW_hungary.54.t: "[FROM.GetNameDefCap]แตงตั้งพระมหากษัตริยฮาพสบวรคใหเรา"
 WW_hungary.54.desc: "[FROM.GetNameDefCap]ไดแตงตั้งวาซิล วือชือวานือ ฟอน ฮาพสบวรค เปนกษัตริยองคใหมของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.54.a: "แนนอน"

 WW_hungary.55.t: "ออสเตรีย-ฮังการีเสนอ "การคุมครอง""
 WW_hungary.55.desc: "ดวยภูมิทัศนทางการเมืองในคาบสมุทรบอลขานที่เปลี่ยนแปลงอยางรุนแรงเมื่อไมนานมานี้ คําถามเรื่องความสัมพันธของเรากับจักรวรรดิออสเตรีย-ฮังการีใหมจึงถูกยกขึ้นมาซํ้าแลวซํ้าเลา วันนี้เอกอัครราชทูตฮังการีไดสงมอบหนังสือทางการ ขอใหเราประกาศจุดยืนตอจักรวรรดิอยางเปนทางการ ราชวงศฮาพสบวรคอางวาโบฮีเมียและโมราเวียเปนของพวกเขาในฐานะดินแดนในราชบัลลังกเกา \n\nอยางไรก็ตาม [HUN.GetLeader] ไดสงสัญญาณวาจะยอมรับทางออกแบบประนีประนอม โดยตนจะเปนประมุขแหงรัฐของประเทศเราในนาม แตมีอํานาจจริงนอยมาก"
 WW_hungary.55.a: "เราจะกลับคืนสูจักรวรรดิ"
 WW_hungary.55.b: "เราจะไมมีวันยอมแลกเสรีภาพกับความปลอดภัย!"

 WW_hungary.56.t: "โบฮีเมียกลับคืนสูราชบัลลังก"
 WW_hungary.56.desc: "หลังการหารือในระดับสูงสุดที่ยืดเยื้อไปจนดึกดื่น รัฐบาล[CZE.GetAdjective]ตัดสินใจยอมรับขอเสนอของเรา และประกาศใหอัลเบรชท ฟรันซ เปนกษัตริยแหงโบฮีเมีย มารเกรฟแหงโมราเวีย และดยุกแหงเทเชน ทหารของกองทัพเช็กเดิมไดสาบานตนตอกษัตริยและจักรพรรดิองคใหม และการบริหารราชการพลเรือนของอาณาจักรเหลานี้ไดถูกผนวกรวมในนามแลว"
 WW_hungary.56.a: "อีกกาวหนึ่งบนเสนทางทวงคืนสิทธิ์โดยกําเนิดของเรา"
 
 WW_hungary.57.t: "[CZE.GetNameDefCap]ปฏิเสธการทาบทาม"
 WW_hungary.57.desc: "[CZE.GetNameDefCap]ปฏิเสธที่จะพิจารณาขอตกลงหรือการประนีประนอมใดๆ เกี่ยวกับความสัมพันธกับเราในอนาคต เมื่อเอกอัครราชทูตของเราไปถึงกระทรวงการตางประเทศเพื่อหารือเรื่องหนังสือทางการที่สงมอบไปกอนหนานี้ เขาไดรับแจงวาไมมีอะไรตองคุย และถูกเชิญออกไปอยางรวดเร็ว เอกอัครราชทูต[CZE.GetAdjective]ประจํารัฐบาลของเราประกาศวา แมรัฐบาลของเขาตองการความสัมพันธอันสงบสุขและเปนมิตรระหวางสองชาติ แตไมมีทางที่[CZE.GetNameDef]จะถูกผนวกเขากับจักรวรรดิออสเตรีย-ฮังการี"
 WW_hungary.57.a: "นาเสียดาย..."

 WW_hungary.58.t: "[FROM.GetNameDefCap]เรียกรองการควบคุมกาลิเซียและบูโควีนา"
 WW_hungary.58.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองดินแดนกาลิเซียและบูโควีนาอยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.58.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.58.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.59.t: "[FROM.GetNameDefCap]มอบดินแดนกาลิเซียและบูโควีนาของตน"
 WW_hungary.59.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในกาลิเซียและบูโควีนาของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.59.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.60.t: "[FROM.GetNameDefCap]ยืนหยัดไมยอม"
 WW_hungary.60.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.60.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.60.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.61.t: "[FROM.GetNameDefCap]ฟนฟูการปกครองของราชวงศอิตูรบิเด"
 WW_hungary.61.desc: "[FROM.GetNameDefCap]ไดแตงตั้งมาริอา โฆเซฟา โซเฟย เด อิตูรบิเด เปนราชินีองคใหมของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.61.a: "แนนอน"

 WW_hungary.62.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองแบบจักรวรรดิ"
 WW_hungary.62.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูการปกครองของราชวงศอิตูรบิเด-ฮาพสบวรคเหนือดินแดนของเราดังที่เคยเปนระหวางป 1821 ถึง 1823 และป 1864 ถึง 1867 และสวมมงกุฎใหพระมหากษัตริยอีกครั้ง ซึ่งจะทําใหเราอยูฝายเดียวกับพวกเขาและเขารวมพันธมิตรของพวกเขาได โดยไมตองสูญเสียเอกราชทั้งหมด"
 WW_hungary.62.a: "ก็ถึงเวลาแลวอยูดี"
 WW_hungary.62.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 WW_hungary.63.t: "[FROM.GetNameDefCap]ยอมรับการปกครองแบบจักรวรรดิ"
 WW_hungary.63.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหมาริอา โฆเซฟา โซเฟย เด อิตูรบิเด เปนจักรพรรดินีองคใหมตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหราชินีองคใหม"
 WW_hungary.63.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.64.t: "[FROM.GetNameDefCap]ปฏิเสธการปกครองแบบจักรวรรดิ"
 WW_hungary.64.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจไมลงจากตําแหนง ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหมาริอา โฆเซฟา โซเฟย เด อิตูรบิเด ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.64.a: "พวกเขาเลือกผิดแลว"

 WW_hungary.65.t: "[FROM.GetNameDefCap]แตงตั้งพระมหากษัตริยฮาพสบวรคใหเรา"
 WW_hungary.65.desc: "[FROM.GetNameDefCap]ไดแตงตั้งโยเซฟ ฟรันซ ฟอน ฮาพสบวรค เปนกษัตริยองคใหมของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.65.a: "แนนอน"

 WW_hungary.66.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.66.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรคเหนือดินแดนของเราดังที่เคยเปนจนกระทั่งจักรวรรดิออสเตรีย-ฮังการีลมสลาย และสวมมงกุฎใหราชวงศฮาพสบวรคเปนพระมหากษัตริยของเราอีกครั้ง อยางไรก็ตาม พวกเขาสัญญาวาจะใหอํานาจปกครองตนเองแกเรามากกวาเดิม พรอมคํามั่นอันยิ่งใหญเรื่องสิ่งที่เรียกวาราชาธิปไตยไตรภาคี เราวาอยางไร?"
 WW_hungary.66.a: "นี่คือสิ่งที่เราตองการมาตลอด!"
 WW_hungary.66.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 WW_hungary.67.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยฮาพสบวรค"
 WW_hungary.67.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหพระมหากษัตริยฮาพสบวรคตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม"
 WW_hungary.67.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.68.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยฮาพสบวรค"
 WW_hungary.68.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจคงอยูในตําแหนงตอไป ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหโยเซฟ ฟรันซ ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.68.a: "พวกเขาเลือกอยางไมฉลาด..."

 WW_hungary.69.t: "[FROM.GetLeader]เรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรค"
 WW_hungary.69.desc: "จักรพรรดิ [FROM.GetLeader] แหง[FROM.GetNameDefCap]ทรงเรียกรองใหเราฟนฟูการปกครองของราชวงศฮาพสบวรคเหนือดินแดนของเราดังที่เคยเปนจนกระทั่งเรารวมเขากับอิตาลี และสวมมงกุฎใหราชวงศฮาพสบวรคเปนพระมหากษัตริยของเราอีกครั้ง อยางไรก็ตาม พวกเขาสัญญาวาจะใหอํานาจปกครองตนเองแกเรามากกวาเดิม เราวาอยางไร?"
 WW_hungary.69.a: "เรายินดีเขารวม"
 WW_hungary.69.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 WW_hungary.70.t: "[FROM.GetNameDefCap]ยอมรับพระมหากษัตริยฮาพสบวรค"
 WW_hungary.70.desc: "ผูนําผูชาญฉลาดใน[FROM.GetNameDef]ตัดสินใจสวมมงกุฎใหพระมหากษัตริยฮาพสบวรคตามขอเรียกรองของเรา และลงจากตําแหนงเพื่อเปดทางใหกษัตริยองคใหม"
 WW_hungary.70.a: "พวกเขาเลือกถูกแลว"

 WW_hungary.71.t: "[FROM.GetNameDefCap]ปฏิเสธพระมหากษัตริยฮาพสบวรค"
 WW_hungary.71.desc: "ผูนําผูเสื่อมทรามใน[FROM.GetNameDef]ตัดสินใจคงอยูในตําแหนงตอไป ดวยเชื่ออยางไรก็ไมรูวาตนฉลาดกวาพระมหากษัตริยที่พระเจาทรงเลือกเอง เราจะโคนพวกเขาลงและใหโรแบรท ขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไม!"
 WW_hungary.71.a: "พวกเขาเลือกอยางไมฉลาด..."

 WW_hungary.72.t: "[FROM.GetNameDefCap]เรียกรองการควบคุมดินแดน[SIL.GetAdjective]ของเรา"
 WW_hungary.72.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองไซลีเซียของ[FROM.GetAdjective]อยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.72.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.72.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.73.t: "[FROM.GetNameDefCap]มอบดินแดน[SIL.GetAdjective]ของตน"
 WW_hungary.73.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในไซลีเซียของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.73.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.74.t: "[FROM.GetNameDefCap]ยืนหยัดในไซลีเซีย"
 WW_hungary.74.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.74.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.74.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.75.t: "[FROM.GetNameDefCap]เรียกรองดินแดนศักดิ์สิทธิ์"
 WW_hungary.75.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดเรียกรองใหกองกําลัง[FROM.GetAdjective]เขายึดครองดินแดนศักดิ์สิทธิ์ และเรียกรองใหเรามอบดินแดนนี้พรอมถอนกําลังของเราออกจากภูมิภาค สถานการณอาจบานปลายจนควบคุมไมไดหากเราไมระมัดระวัง เราควรตอบสนองอยางไร?"
 WW_hungary.75.a: "ผูพิทักษนิกายคาทอลิกเอาไปก็ได"
 WW_hungary.75.b: "สงครามครูเสดลมเหลวไปกี่ครั้งแลวนะ?"

 WW_hungary.76.t: "[FROM.GetNameDefCap]มอบดินแดนศักดิ์สิทธิ์"
 WW_hungary.76.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบปาเลสไตนใหเรา และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.76.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.77.t: "[FROM.GetNameDefCap]ยืนหยัดในดินแดนศักดิ์สิทธิ์"
 WW_hungary.77.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.77.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.77.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.78.t: "[FROM.GetNameDefCap]แตงตั้งผูนําคนใหมใหเรา"
 WW_hungary.78.desc: "[FROM.GetNameDefCap]ไดแตงตั้งสมเด็จพระสันตะปาปาองคใหมเปนผูนําของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.78.a: "แนนอน"

 WW_hungary.79.t: "[FROM.GetNameDefCap]แตงตั้งผูนําคนใหมใหเรา"
 WW_hungary.79.desc: "[FROM.GetNameDefCap]ไดแตงตั้งพระมหากษัตริยองคใหมเปนผูนําของชาติเรา สิ่งนี้จะเสริมความมั่นคงของระบอบเราแนนอน"
 WW_hungary.79.a: "แนนอน"

 WW_hungary.80.t: "[HUN.GetNameDefCap]ตองการผนวกรวมเรา"
 WW_hungary.80.desc: "[HUN.GetNameDefCap]ตัดสินใจแลววาถึงเวลาที่ดินแดนของเราจะถูกผนวกรวมกลับเขาสูราชบัลลังกออสเตรีย-ฮังการี เราทําอะไรไมไดมากนอกจากยอมรับความจริงขอนี้...."
 WW_hungary.80.a: "เปนไปอยางที่ควรจะเปน"
 WW_hungary.80.b: "พวกเขาจะไมมีวันจับเราไดทั้งเปน!"

 WW_hungary.81.t: "[FROM.GetNameDefCap]ยอมรับการผนวกรวม"
 WW_hungary.81.desc: "[FROM.GetNameDefCap]ตัดสินใจยอมรับขอเรียกรองของเราใหผนวกรวมดินแดนของพวกเขากลับเขาสูราชบัลลังกออสเตรีย-ฮังการี วันนี้เปนวันที่ยิ่งใหญของจักรวรรดิ!"
 WW_hungary.81.a: "และทุกสิ่งในโลกก็เรียบรอยดี"

 WW_hungary.82.t: "[FROM.GetNameDefCap]ปฏิเสธการผนวกรวม"
 WW_hungary.82.desc: "[FROM.GetNameDefCap]ตัดสินใจปฏิเสธขอเรียกรองของเราใหผนวกรวมดินแดนของพวกเขากลับเขาสูราชบัลลังกออสเตรีย-ฮังการี เราจึงตองใชกําลัง..."
 WW_hungary.82.a: "เราจะทําใหพวกเขาชดใช"

 WW_hungary.83.t: "[FROM.GetNameDefCap]เสนอขอซื้อ[975.GetName]"
 WW_hungary.83.desc: "รัฐบาล[HUN.GetAdjective]ยังคงมองวา[975.GetName]เปนภูมิภาคที่แยกไมไดจากอาณาจักรของตน โดยอางวาเคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ จึงควรถูกสงคืน บัดนี้พวกเขาติดตอเรามาพรอมขอเสนอขอซื้อภูมิภาคนี้คืนจากเราในราคาที่ดี"
 WW_hungary.83.a: "เราจะรับเงินใหไดมากที่สุด"
 WW_hungary.83.b: "[975.GetName]เปนของ[ROOT.GetAdjective]!"

 WW_hungary.84.t: "[FROM.GetNameDefCap]ขาย[975.GetName]ใหเรา"
 WW_hungary.84.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบ[975.GetName]ใหเรา และไดรับเงินตามที่เราสัญญาไวแลว วันนี้เปนวันที่ยิ่งใหญของประชาชน[ROOT.GetAdjective]!"
 WW_hungary.84.a: "สมบูรณแบบ"

 WW_hungary.85.t: "[From.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 WW_hungary.85.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดปฏิเสธคําขอของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทเรื่อง[975.GetName]"
 WW_hungary.85.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.85.b: "พวกเขาปฏิเสธแลว และเราจะเคารพการตัดสินใจนั้น"

 WW_hungary.86.t: "[FROM.GetNameDefCap]กอการลุกฮือใน[975.GetName]"
 WW_hungary.86.desc: "กลุมกบฏจากองคกรกึ่งทหาร[FROM.GetAdjective]ไดยึดอาคารสําคัญในภูมิภาค[975.GetName] และจัดการลงประชามติอยางเรงรีบเพื่อกลับไปรวมกับ[FROM.GetNameDef] ซึ่งผลที่ถูกโกงอยางเห็นไดชัดออกมาสนับสนุนอยางทวมทน ทหารของเราเตรียมพรอมอยูใกลๆ แตยังรอคําสั่งวาการเขาแทรกแซงเปนทางเลือกที่ถูกตองหรือไม"
 WW_hungary.86.a: "เราไมมีกําลังพอจะสูพวกเขา"
 WW_hungary.86.b: "พวกเขาจะไดเรียนรูที่จะเสียใจกับการตัดสินใจนี้!"

 WW_hungary.87.t: "[FROM.GetNameDefCap]ตองการเขารวมฝายของเรา"
 WW_hungary.87.desc: "[FROM.GetLeader] ติดตอเรามาหลังเยือนเมืองหลวงของเรา โดยอางวาพูดในนามของประชาชน[FROM.GetAdjective]ทั้งมวล และปรารถนาใหทั้งสองชาติรวมเปนพันธมิตรทางทหาร โดยมีเปาหมายปกปองประชาชนของทั้งชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]"
 WW_hungary.87.a: "ยินดีตอนรับใหเขารวมกับเรา"
 WW_hungary.87.b: "เราไมมีประโยชนอะไรกับพวกเขา"

 WW_hungary.88.t: "[FROM.GetNameDefCap]ยอมใหเราเขารวม"
 WW_hungary.88.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ตกลงกอตั้งพันธมิตรทางทหารใหม เสริมความสัมพันธระหวางสองชาติใหแนนแฟนขึ้น ประชาชนของเราออกมาเฉลิมฉลองตามทองถนนในโอกาสสําคัญนี้ เพราะเปนการเกิดใหมของรัฐ[ROOT.GetAdjective] และเปนจุดเริ่มตนยุคใหมที่ปลอดภัยยิ่งขึ้นของประชาชน"
 WW_hungary.88.a: "มาสรางอนาคตของเราดวยกัน!"

 WW_hungary.89.t: "[FROM.GetNameDefCap]ไมยอมใหเราเขารวม"
 WW_hungary.89.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ปฏิเสธคําขอของเรา ซึ่งเทากับปดโอกาสความรวมมือระหวางสองรัฐในอนาคตอันใกลทั้งหมด เราจึงตองแสวงหาพันธมิตรอื่น หรือไมก็ยืนหยัดดวยตนเอง"
 WW_hungary.89.a: "มันไมใชโชคชะตา"

 WW_hungary.90.t: "พิธีบรมราชาภิเษกกษัตริยอัครสาวก"
 WW_hungary.90.desc: "บัดนี้มีการตัดสินแลววาจะฟนฟูระบอบกษัตริยอยางเปนทางการ แตเรามีปญหาอยู ยังไมมีผูสมัครที่เหมาะสมปรากฏขึ้น ทวาผูสําเร็จราชการตองเลือกในเร็วๆ นี้ เขาอาจสวมมงกุฎใหตนเอง แมจะไมเปนที่นิยมอยางกวางขวาง หรืออาจเลือกอีกทางหนึ่งโดยสวมมงกุฎใหอิชตวาน ฮอรตี บุตรชายของเขา ซึ่งเปนที่นิยมอยางมากในหมูประชาชน ใครควรไดรับเลือกใหดํารงตําแหนงนี้?"
 WW_hungary.90.a: "มิโคลช ฮอรตี คือตัวเลือกโดยธรรมชาติ"
 WW_hungary.90.b: "อิชตวาน ฮอรตี ไดรับการสนับสนุนจากประชาชน"

 WW_hungary.91.t: "[FROM.GetNameDefCap]เสนอการรวมชาติ"
 WW_hungary.91.desc: "รัฐบาล[HUN.GetAdjective]ไดติดตอเรามาพรอมขอเสนอที่นาสนใจใหรวมสองประเทศเปนหนึ่งเดียว แนนอนวาพวกเขาตองการใหเปนไปตามเงื่อนไขของตน หมายความวารัฐบาลของพวกเขาจะปกครองทั้งสองประเทศ แตบางทีนั่นอาจเปนทางเลือกที่ปลอดภัยที่สุด?"
 WW_hungary.91.a: "ก็ได เรายอมรับ"
 WW_hungary.91.b: "พวกเขาคงหลงตัวเองมาก"

 WW_hungary.92.t: "[FROM.GetNameDefCap]ยอมรับการรวมชาติ"
 WW_hungary.92.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบการควบคุมรัฐบาลใหเรา เริ่มตนกระบวนการรวมสองชาติภายใตกษัตริยองคเดียว เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.92.a: "ยอดเยี่ยม!"

 WW_hungary.93.t: "[From.GetNameDefCap]ปฏิเสธการรวมชาติ"
 WW_hungary.93.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับขอเสนอของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียว โดยประกาศวา 'โรมาเนียก็คือโรมาเนีย!'"
 WW_hungary.93.a: "เปนสิทธิ์ของพวกเขาที่จะเลือก"

 WW_hungary.94.t: "การเลือกประธานาธิบดี[ROOT.GetAdjective]คนใหม"
 WW_hungary.94.desc: "เมื่อฝุนควันของสงครามกลางเมืองจางลง ชาติก็ตองการผูแทนประชาชนที่มาจากการเลือกตั้งอยางยิ่ง ฝายหนึ่งคือมิฮาย กาโรยี ผูเปนที่นิยม นักการเมืองอนุรักษนิยมและอดีตนายกรัฐมนตรีฮังการี อีกฝายคือคอมมิวนิสต ซึ่งบางสวนสนับสนุนใหเบลา กุน อดีตผูนําสาธารณรัฐโซเวียตฮังการีกลับคืนสูอํานาจ ขณะที่อีกสวนสนับสนุนมาตยาช ราโกชี ผูนิยมสตาลิน ซึ่งเพิ่งไดรับคํายกยองจากการสูรบในแนวหนา ใครจะนําประเทศสูอนาคต?"
 WW_hungary.94.a: "เบลา กุน ตองกลับคืนสูอํานาจ"
 WW_hungary.94.b: "มาตยาช ราโกชี ไดรับความเคารพจากประชาชน"
 WW_hungary.94.c: "มิฮาย กาโรยี ควรนําพวกเรา"

 WW_hungary.95.t: "การเลือกตั้งประธานาธิบดีครั้งแรกแหงสาธารณรัฐที่สอง"
 WW_hungary.95.desc: "ถึงเวลาแลวที่จะจัดการเลือกตั้งประธานาธิบดีของชาติเสียที และทําใหหลักการประชาธิปไตยของเราสองสวางดั่งประภาคารใจกลางยุโรป ผูสมัครหลักไดแก มิฮาย กาโรยี ประธานาธิบดีแหงสาธารณรัฐที่หนึ่ง อารปาด ซอกอชิตช ผูนําพรรคสังคมประชาธิปไตยฮังการี และยาโนช ซิชี ผูนําพรรคคริสเตียนเศรษฐกิจและสังคมฮังการี ซึ่งเปนสมาชิกบัณฑิตยสถานวิทยาศาสตรฮังการีดวย อนาคตแบบใดรอฮังการีอยู?"
 WW_hungary.95.a: "มิฮาย กาโรยี รูวิธีนํา"
 WW_hungary.95.b: "อารปาด ซอกอชิตช หาจุดกึ่งกลางที่ดีได"
 WW_hungary.95.c: "ยาโนช ซิชี ชวยใหเราลุกขึ้นยืนไดอีกครั้ง"

 WW_hungary.96.t: "[FROM.GetNameDefCap]เรียกรองการควบคุมดินแดน[SLO.GetAdjective]ของเรา"
 WW_hungary.96.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองสโลวาเกียของ[FROM.GetAdjective]อยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.96.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.96.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.97.t: "[FROM.GetNameDefCap]มอบดินแดน[SLO.GetAdjective]ของตน"
 WW_hungary.97.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในสโลวาเกียของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.97.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.98.t: "[FROM.GetNameDefCap]ยืนหยัดในสโลวาเกีย"
 WW_hungary.98.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.98.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.98.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.99.t: "ฮังการีเรียกรองอํานาจเหนือดินแดนเซเคย"
 WW_hungary.99.desc: "พื้นที่สวนใหญของ[76.GetName] ซึ่งชาว[HUN.GetAdjective]รูจักในชื่อเซเคยเฟลด มีพี่นองรวมเชื้อชาติของพวกเขาอาศัยอยูเปนสวนใหญ คือชาวฮังการีเซเคย พวกเขาพูดภาษาถิ่นเฉพาะของตนและมีวัฒนธรรมอันเปนเอกลักษณ [HUN.GetLeader] จึงแถลงวาพวกเขาไมจําเปนตองถูกผนวกเปนสวนหนึ่งของชาติ อยางไรก็ตาม ฮังการีตองการเปนผูพิทักษประชาชนกลุมนี้ และขอใหเรามอบอํานาจเหนือพื้นที่นี้แกพวกเขา"
 WW_hungary.99.a: "เพื่อโลกที่ยุติธรรมยิ่งขึ้น!"
 WW_hungary.99.b: "พวกเขาเพอเจอชัดๆ"

 WW_hungary.100.t: "[FROM.GetName]มอบรัฐในอารักขาเซเคยเฟลดใหเรา"
 WW_hungary.100.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ยอมรับขอเรียกรองของเรา และมอบภูมิภาคเซเคยเฟลดในฐานะเขตปกครองตนเอง บัดนี้เรามีหนาที่ปกปองและพัฒนาภูมิภาคนี้"
 WW_hungary.100.a: "ไดกลับมารวมกันเสียที!"

 WW_hungary.101.t: "[FROM.GetName]ปฏิเสธรัฐในอารักขาเซเคยเฟลดของเรา"
 WW_hungary.101.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ปฏิเสธขอเรียกรองของเราใหตั้งรัฐในอารักขาเซเคยที่ปกครองตนเอง ชาวเซเคยยังคงเปราะบางและไรผูคุมครอง เมื่อผูปกครองปจจุบันแทบไมใสใจพวกเขา เราควรเขาแทรกแซงและยึดครองภูมิภาคนี้หรือไม?"
 WW_hungary.101.a: "พวกเขาจะตองเสียใจกับการกระทําของตน"
 WW_hungary.101.b: "เราทําอะไรไดไมมากนัก"

 WW_hungary.102.t: "การเดินขบวนสูบูดาเปสต"
 WW_hungary.102.desc: "หลังการรณรงคและประทวงตอตานผูสําเร็จราชการมิโคลช ฮอรตี มาหลายเดือน ขบวนการฟาสซิสตที่ไดแรงบันดาลใจจากกบฏกางเขนเคียวและการเดินขบวนสูโรมของมุสโสลินี ก็ไดเดินขบวนสูเมืองหลวงของเราแลว เรียกรองใหฮอรตีลงจากตําแหนงเพื่อใหจูลา เกิมเบิช ผูเปนที่นิยมมากกวาขึ้นดํารงตําแหนงแทน"
 WW_hungary.102.a: "เกิมเบิชตองรับอํานาจฉุกเฉิน!"

 WW_hungary.103.t: "รัฐประหารของแฟแรนตส ซาลาชี"
 WW_hungary.103.desc: "หลังติดอาวุธใหพรรคเจตจํานงแหงชาติเพื่อใหเดินขบวนสูบูดาเปสตจนเขาไดขึ้นเปนผูนําชาติ เกิมเบิชก็ไมตองการพวกเขาอีกตอไปและเริ่มดําเนินการปราบปราม แตเชานี้พวกเขาไดลอมพระราชวังชานโดรในบูดาเปสต เรียกรองใหเขาลงจากตําแหนงเพื่อใหแฟแรนตส ซาลาชี ผูนําของพวกเขาขึ้นแทน MOVE ไดตอบโตดวยการเคลื่อนกําลังเขาโอบลอมเมือง และประเทศกําลังยืนอยูบนปากเหวแหงการลมสลาย ควรทําอยางไรดี?"
 WW_hungary.103.a: "ลงจากตําแหนงและใหซาลาชีเปนเนมเซตเวเซเตอคนใหม"
 WW_hungary.103.b: "เราจะยอมตามเงื่อนไขของพวกเขา โดยมีขอแม"

 WW_hungary.104.t: "[FROM.GetNameDefCap]เรียกรองการควบคุมโครเอเชีย"
 WW_hungary.104.desc: "[FROM.GetLeader] ผูหุนหันพลันแลนไดประณามสิ่งที่เขาเรียกวาการยึดครองดินแดนโครเอเชียอยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และทหารของพวกเขากําลังรวมพลที่ชายแดนของเรา เราควรตอบสนองอยางไร?"
 WW_hungary.104.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 WW_hungary.104.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 WW_hungary.105.t: "[FROM.GetNameDefCap]มอบดินแดนโครเอเชียของตน"
 WW_hungary.105.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ผูมีเหตุผลไดตกลงมอบดินแดนในโครเอเชียของตน และสั่งใหทหารยุติการเผชิญหนาและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 WW_hungary.105.a: "วันนี้ชางยิ่งใหญ!"

 WW_hungary.106.t: "[FROM.GetNameDefCap]ยืนหยัดไมยอม"
 WW_hungary.106.desc: "แมจะไมใชเรื่องเกินคาดเสียทีเดียว แต [FROM.GetLeader] แหง[FROM.GetNameDef]ผูโงเขลาไดสั่งใหทหารของชาติเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 WW_hungary.106.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 WW_hungary.106.b: "เราตองปลอยเรื่องนี้ไป"

 WW_hungary.108.t: "[FROM.GetNameDefCap]ตองการสวมมงกุฎใหแฮรมันน เกอริง เปนกษัตริย"
 WW_hungary.108.desc: "\nเมื่อผูนํา[FROM.GetAdjective]ภายใต [FROM.GetLeader] มีแนวทางใกลชิดกับเราแลว พวกเขาไดขอสวมมงกุฎใหกษัตริยชาวเยอรมันขึ้นครองตําแหนงบนบัลลังก[FROM.GetAdjective]ที่ตอนนี้เปนเพียงสัญลักษณ พวกเขาเลือกแฮรมันน เกอริง และนักประวัติศาสตรของพวกเขาก็เริ่มเขียนเชื่อมโยงเขาเขากับอารปาด ผูนําฮังการีในอดีตแลว เราควรอนุญาตใหเขาไปยัง[FROM.GetNameDef]หรือไม?"
 WW_hungary.108.a: "เราอนุญาต"
 WW_hungary.108.b: "ไมเหมาะสม"

 WW_hungary.109.t: "[FROM.GetLeader]อนุญาตใหสวมมงกุฎแกเกอริง"
 WW_hungary.109.desc: "[GER.GetLeader] ผูยิ่งใหญไดอนุญาตใหแฮรมันน เกอริง ยายมายังประเทศของเราและเปนกษัตริยภายใตรัฐธรรมนูญองคใหมของประชาชนเรา สายสัมพันธของเราแนนแฟนยิ่งขึ้น และในที่สุดบัลลังกก็ไมวางเปลาอีกตอไป"
 WW_hungary.109.a: "เราขอบคุณ"

 WW_hungary.110.t: "[FROM.GetLeader]ไมอนุญาตใหสวมมงกุฎแกเกอริง"
 WW_hungary.110.desc: "[FROM.GetLeader] ผูหวาดระแวงตัดสินใจไมอนุญาตใหแฮรมันน เกอริง ยายมายังประเทศของเรา แมเราจะรบเราไมหยุดและนําเสนอเหตุผลอยางดี เราจะตองอยูโดยไมมีกษัตริย และใหซาลาชีเปนผูนําชาติแตเพียงผูเดียว"
 WW_hungary.110.a: "ดูเหมือนจะไมเปนราชอาณาจักรอีกตอไป"

 WW_hungary.111.t: "ประชามติเขารวมรัฐ[HUN.GetAdjective]"
 WW_hungary.111.desc: "การลงประชามติดําเนินมาตลอดเดือนที่ผานมาใน[664.GetName] เพื่อตัดสินวาพวกเขาตองการเขารวมกับ[HUN.GetNameDef]หรือไม เนื่องจากไดรับการรับรองจากผูสังเกตการณนานาชาติ จึงพอจะเชื่อไดวาคงไมมีการโกงการเลือกตั้งมากนัก ผลออกมาแลว โดยประชาชนสวนใหญลงคะแนนใหแยกออกจากชาติของเรา เราควรยอมรับหรือไม?"
 WW_hungary.111.a: "หากนี่คือสิ่งที่ประชาชนตองการ"
 WW_hungary.111.b: "การลงประชามติครั้งนี้มีการโกง"

 WW_hungary.112.t: "[FROM.GetNameDefCap]ยอมรับผลประชามติ"
 WW_hungary.112.desc: "ผูนําใน[FROM.GetNameDef]ไดออกมาแถลงตอสาธารณะถึงการสนับสนุนอยางไมสั่นคลอนตอสิทธิ์ในการกําหนดชะตากรรมตนเองของประชาชนในภูมิภาค[664.GetName] [FROm.GetLeader] กลาวเมื่อตนสัปดาหนี้วาถึงเวลาแลวที่พวกเขาจะไดเลือกวาตองการอยูในรัฐใด ซึ่งเทากับสละการอางสิทธิ์เหนือพื้นที่นี้"
 WW_hungary.112.a: "เปนการตอบสนองที่มีเหตุผล"

 WW_hungary.113.t: "[FROM.GetNameDefCap]ประกาศวาประชามติไมชอบธรรม"
