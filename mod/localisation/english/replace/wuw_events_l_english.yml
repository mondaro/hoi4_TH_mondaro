 wuw_GER_reichskommissariats.23.c: "ควรผนวกรวมเขากับโคลัมบัส"

 wuw_GER_reichskommissariats.24.t: "ผูนําแหงอาระเบีย"
 wuw_GER_reichskommissariats.24.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในอาระเบียแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.24.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.24.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.25.t: "ผูนําแหงมหาฮินดูสถาน"
 wuw_GER_reichskommissariats.25.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในฮินดูสถานแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.25.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.25.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.26.t: "ผูนําแหงเอเชียตะวันออก"
 wuw_GER_reichskommissariats.26.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในเอเชียตะวันออกแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.26.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.26.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.27.t: "ผูนําแหงออสตราเลเซีย"
 wuw_GER_reichskommissariats.27.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในออสตราเลเซียแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.27.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.27.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_realpolitik.1.t: "[FROM.GetNameDefCap] เชิญเราเปนพันธมิตร"
 wuw_GER_realpolitik.1.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมยื่นขอเสนอ พวกเขาตองการใหเราเขารวมพันธมิตรของพวกเขา และมีสวนรวมในความเปนหุนสวนและสหภาพทั้งหมดที่ไดกอตั้งไวกอนหนานี้ เราจะรับขอเสนอนี้หรือไม?"
 wuw_GER_realpolitik.1.a: "เราขอนอมรับขอเสนอนี้"
 wuw_GER_realpolitik.1.b: "เราไมตองการมิตรภาพของพวกเขา!"

 wuw_GER_realpolitik.2.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_realpolitik.2.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการเขารวมพันธมิตรของเราอยางสมบูรณ"
 wuw_GER_realpolitik.2.a: "ดีมาก"

 wuw_GER_realpolitik.3.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.3.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบคําเชิญเขารวมพันธมิตรของเราดวยความไมพอใจอยางรุนแรง และอางวาความเปนหุนสวนใด ๆ ระหวางสองประเทศไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป พวกเขาคิดวาเราเปนอะไร ผูพิชิตหรืออยางไร?"
 wuw_GER_realpolitik.3.a: "พวกเขากําลังพลาดโอกาส..."

 wuw_GER_realpolitik.4.t: "[FROM.GetNameDefCap] สงความชวยเหลือทางทหาร"
 wuw_GER_realpolitik.4.desc: "ชาว[FROM.GetAdjective]ตองการสนับสนุนความพยายามในสงครามของเรา และไดสงยุทโธปกรณมาจํานวนหนึ่ง แมจะเปนการสงมอบขนาดคอนขางเล็ก แตความชวยเหลือใด ๆ ก็เปนที่ยินดีรับ"
 wuw_GER_realpolitik.4.a: "นี่จะมีประโยชนแนนอน"

 wuw_GER_weltpolitik.16.t: "[FROM.GetNameDefCap] สถาปนาเขตอิทธิพล"
 wuw_GER_weltpolitik.16.desc: "[FROM.GetNameDefCap] แจงใหเราทราบวาพวกเขาไดสถาปนาเขตอิทธิพลขึ้นแลว แมเรื่องนี้จะไมกระทบเราโดยตรงเพราะไมมีขอตกลงอยางเปนทางการ แตก็เปนสิ่งที่เราตองจับตาไว พวกเขาอาจพยายามบีบใหเรายอมรับ หรือเรียกรองดินแดนจากเราหากเราเขาควบคุมพื้นที่นั้น"
 wuw_GER_weltpolitik.16.a: "เราจะพิชิตโลกไปดวยกัน!"
 wuw_GER_weltpolitik.16.b: "ไมมีทาง!"

 wuw_GER_weltpolitik.17.t: "[FROM.GetNameDefCap] ตกลงกําหนดเขตอิทธิพล"
 wuw_GER_weltpolitik.17.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]วาพวกเขาเห็นชอบกับแนวคิดการกําหนดเขตอิทธิพลของเรา สิ่งนี้จะชวยปองกันการเปนปฏิปกษและลดความเสี่ยงของความขัดแยงเหนือดินแดนในพื้นที่ใกลเคียงของเรา"
 wuw_GER_weltpolitik.17.a: "ยอดเยี่ยม!"

 wuw_GER_weltpolitik.18.t: "[FROM.GetNameDefCap] ปฏิเสธการกําหนดเขตอิทธิพล"
 wuw_GER_weltpolitik.18.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]วาพวกเขาจะไมยอมรับและไมรับรองเขตอิทธิพลของเรา สวนเขตอิทธิพลของตนเอง พวกเขาระบุวาจะกําหนดเองโดยไมใหฝายเรามีสวนเกี่ยวของ เรื่องนี้อาจกอใหเกิดความตึงเครียดในภูมิภาค"
 wuw_GER_weltpolitik.18.a: "ชางไรมารยาท!"

 wuw_GER_weltpolitik.19.t: "[FROM.GetNameDefCap] เรียกรองการควบคุมดินแดน[ANG.GetAdjective]ของเรา"
 wuw_GER_weltpolitik.19.desc: "[FROM.GetLeader] ผูบุมบามเพิ่งประณามสิ่งที่เขาเรียกวาการยึดครองแองโกลาของ[FROM.GetAdjective]อยางผิดกฎหมายของเรา บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และกองทหารของพวกเขากําลังรวมพลอยูที่ชายแดนของเรา เราควรตอบโตอยางไร?"
 wuw_GER_weltpolitik.19.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 wuw_GER_weltpolitik.19.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 wuw_GER_weltpolitik.20.t: "[FROM.GetNameDefCap] สงมอบดินแดน[ANG.GetAdjective]ของตน"
 wuw_GER_weltpolitik.20.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ผูมีเหตุผลตกลงสงมอบดินแดนในแองโกลา และสั่งใหกองทหารของตนวางอาวุธและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 wuw_GER_weltpolitik.20.a: "วันนี้เปนวันที่ยิ่งใหญ!"

 wuw_GER_weltpolitik.21.t: "[FROM.GetNameDefCap] ยืนหยัดในแองโกลา"
 wuw_GER_weltpolitik.21.desc: "แมจะไมใชเรื่องเหนือความคาดหมายเสียทีเดียว แต[FROM.GetLeader]ผูโงเขลาแหง[FROM.GetNameDef]ไดสั่งใหกองทหารของประเทศเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 wuw_GER_weltpolitik.21.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 wuw_GER_weltpolitik.21.b: "เราตองปลอยเรื่องนี้ไป"

 wuw_GER_realpolitik.5.t: "ปญหา[LIT.GetAdjective]"
 wuw_GER_realpolitik.5.desc: "ตามที่ระบุไวในสนธิสัญญาเบรสต-ลีตอฟสค ดินแดนที่ปจจุบันเรียกวาลิทัวเนียจะตองกลายเปนรัฐบริวารของเรา แมรายละเอียดที่แนชัดจะยังไมไดตกลงกันอยางครบถวน บัดนี้เมื่อเรื่องนี้กลับมามีความสําคัญอีกครั้ง เราตองตัดสินใจวาจะจัดการกับ[LIT.GetNameDef]อยางไร?"
 wuw_GER_realpolitik.5.a: "ควรผนวกรวมพวกเขาเขากับ[ROOT.GetNameDef]"
 wuw_GER_realpolitik.5.b: "บางทีเราอาจใหพวกเขาเปนรัฐบริวารของเรา"

 wuw_GER_realpolitik.6.t: "[FROM.GetNameDefCap] เรียกรองใหผนวกเรา"
 wuw_GER_realpolitik.6.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายอมอยูใตการปกครองของพวกเขาและกลายเปนเขตปกครองตนเองภายในชาติของพวกเขา ตามที่ไดวางไวแตแรกในสนธิสัญญาเบรสต-ลีตอฟสคเมื่อนานมาแลว เราควรยอมตามขอเรียกรองของพวกเขาหรือไม?"
 wuw_GER_realpolitik.6.a: "เราทําอะไรเพื่อหยุดพวกเขาไมไดมากนัก..."
 wuw_GER_realpolitik.6.b: "เราจะไมมีวันสละเสรีภาพของเรา!"

 wuw_GER_realpolitik.7.t: "[FROM.GetNameDefCap] เรียกรองใหเราเปนรัฐบริวาร"
 wuw_GER_realpolitik.7.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายอมอยูใตการปกครองของพวกเขาและกลายเปนรัฐบริวารของพวกเขา ตามที่ไดวางไวแตแรกในสนธิสัญญาเบรสต-ลีตอฟสคเมื่อนานมาแลว เราควรยอมตามขอเรียกรองของพวกเขาหรือไม?"
 wuw_GER_realpolitik.7.a: "เราทําอะไรเพื่อหยุดพวกเขาไมไดมากนัก..."
 wuw_GER_realpolitik.7.b: "เราจะไมมีวันสละเสรีภาพของเรา!"

 wuw_GER_realpolitik.8.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.8.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะยอมอยูใตการปกครองของเรา เพราะพวกเขาไมมีกําลังพอจะหยุดเรา และการสูรบมีแตจะนําความพินาศมาสูดินแดนและประชาชนของพวกเขามากขึ้น"
 wuw_GER_realpolitik.8.a: "วันอันยิ่งใหญของ[ROOT.GetNameDef]!"

 wuw_GER_realpolitik.9.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.9.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองใหพวกเขายอมจํานนนั้นมีพื้นฐานจากเอกสารลอย ๆ ที่ไมมีคุณคาจริง และไดประณามประเทศของเราทั้งหมดอยางเปดเผย ดูเหมือนพวกเขาตั้งใจจะสูเพื่อเสรีภาพหากจําเปน..."
 wuw_GER_realpolitik.9.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

 wuw_GER_realpolitik.10.t: "[FROM.GetNameDefCap] เรียกรองใหเราฟนฟูระบอบกษัตริย"
 wuw_GER_realpolitik.10.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายอมอยูใตการปกครองของพวกเขาและกลายเปนรัฐบริวารของพวกเขา ตามแผนเดิมเมื่อครั้งที่เรายอมรับเจาชายฟอน เฮสเซินขึ้นครองบัลลังกของเราในป 1918 เราควรยอมตามขอเรียกรองของพวกเขาหรือไม?"
 wuw_GER_realpolitik.10.a: "บางทีพวกเขาอาจปกปองเราจากชาว[SOV.GetAdjective]ได"
 wuw_GER_realpolitik.10.b: "ดวยจิตวิญญาณซีซู เราจะไมยอมแพ!"

 wuw_GER_realpolitik.11.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.11.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะยอมอยูใตการปกครองของเรา เพราะเปนความผิดพลาดของรัฐบาลชุดกอนที่ละทิ้งระบอบกษัตริยและผูอางสิทธิ์ในบัลลังกชาวเยอรมัน"
 wuw_GER_realpolitik.11.a: "วันอันยิ่งใหญของ[ROOT.GetNameDef]!"

 wuw_GER_realpolitik.12.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.12.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองใหพวกเขายอมจํานนนั้นออนแอพอ ๆ กับประชาชนและเจตจํานงของชาติเราเอง ดูเหมือนพวกเขาตั้งใจจะสูเพื่อเสรีภาพหากจําเปน..."
 wuw_GER_realpolitik.12.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

 wuw_GER_realpolitik.13.t: "[FROM.GetNameDefCap] เรียกรองใหเราเปนรัฐบริวาร"
 wuw_GER_realpolitik.13.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายอมอยูใตการปกครองของพวกเขาและกลายเปนรัฐบริวารของพวกเขา โดยอางวาเพื่อใหปกปองเราจากภัยคุกคามของ[SOV.GetAdjective]ไดงายขึ้น เราควรยอมตามขอเรียกรองของพวกเขาหรือไม?"
 wuw_GER_realpolitik.13.a: "บางทีพวกเขาอาจปกปองเราจากชาว[SOV.GetAdjective]ได"
 wuw_GER_realpolitik.13.b: "ดวยจิตวิญญาณซีซู เราจะไมยอมแพ!"

 wuw_GER_realpolitik.14.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.14.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะยอมอยูใตการปกครองของเรา เพราะพวกเขาตองการความชวยเหลือทุกทางหากตองการทําสงครามไฮโมโซดัตตอไป"
 wuw_GER_realpolitik.14.a: "วันอันยิ่งใหญของ[ROOT.GetNameDef]!"

 wuw_GER_realpolitik.15.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.15.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองใหพวกเขายอมจํานนนั้นออนแอพอ ๆ กับประชาชนและเจตจํานงของชาติเราเอง ดูเหมือนพวกเขาตั้งใจจะสูเพื่อเสรีภาพหากจําเปน..."
 wuw_GER_realpolitik.15.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

 wuw_GER_realpolitik.16.t: "[FROM.GetNameDefCap] เรียกรองใหผนวกเรา"
 wuw_GER_realpolitik.16.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาการดํารงอยูของเราตองสิ้นสุดลงโดยเร็วที่สุด เพราะเราควรถูกผนวกรวมเขากับรัฐ[FROM.GetAdjective] เราควรยอมรับขอเรียกรองของพวกเขาหรือไม?"
 wuw_GER_realpolitik.16.a: "นี่คือจุดจบของเรา"
 wuw_GER_realpolitik.16.b: "จับอาวุธขึ้นเถิดเหลาทหาร!"

 wuw_GER_realpolitik.17.t: "[FROM.GetNameDefCap] เรียกรองดินแดนจักรวรรดิเดิม"
 wuw_GER_realpolitik.17.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเราคืนดินแดนจักรวรรดิเดิมทางตะวันออกใหพวกเขา ไดแก มณฑลปรัสเซียตะวันตก มณฑลไซลีเซีย และมณฑลโพเซิน นี่เปนดินแดนจํานวนมาก แตบางทีการคืนใหพวกเขาอาจเปนทางเดียวที่จะหลีกเลี่ยงหุบเหวแหงการตกเปนเมืองขึ้น"
 wuw_GER_realpolitik.17.a: "ถาตองทําเชนนั้นก็ยอม..."
 wuw_GER_realpolitik.17.b: "พวกเขาตองมาแยงไปจากมือเราเอง!"

 wuw_GER_realpolitik.18.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.18.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะคืนดินแดนจักรวรรดิเดิมทางตะวันออกใหแกเรา ในที่สุด ความอยุติธรรมทางประวัติศาสตรจากสนธิสัญญาแวรซายก็ไดรับการแกไขแลว!"
 wuw_GER_realpolitik.18.a: "วันอันยิ่งใหญของชาติ[ROOT.GetAdjective]!"

 wuw_GER_realpolitik.19.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.19.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองดินแดนของพวกเขาถูกทําใหเปนโมฆะโดยสนธิสัญญาแวรซาย ซึ่งเปนสนธิสัญญาที่เราไมมีสิทธิ์ละเมิด"
 wuw_GER_realpolitik.19.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"
 wuw_GER_realpolitik.19.b: "นี่ไมใชเวลาที่จะใจรอน"
 GER_kaiserreich_decided_not_to_attack_poland: "ตัดสินใจไมโจมตี§Yโปแลนด§! แมถูกปฏิเสธการคืนดินแดนจักรวรรดิเดิม"

 wuw_GER_realpolitik.20.t: "[FROM.GetNameDefCap] เรียกรองสัมปทานเพิ่มเติม"
 wuw_GER_realpolitik.20.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายกดินแดนใหพวกเขาเพิ่มอีก ครั้งนี้พวกเขาตองการ [87.GetName], [98.GetName] และ [97.GetName] พวกเขารุกลํ้ารัฐของเราอีกครั้ง แตบางทีนี่อาจเปนทางเดียวที่จะหลีกเลี่ยงการถูกทําลายลาง เราควรยอมรับเงื่อนไขของพวกเขาหรือไม?"
 wuw_GER_realpolitik.20.a: "หวังวานี่จะเปนครั้งสุดทาย..."
 wuw_GER_realpolitik.20.b: "ครั้งนี้พวกเขาทําเกินไปแลว!"

 wuw_GER_realpolitik.21.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.21.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะสงมอบ [87.GetName], [98.GetName] และ [97.GetName] ใหแกเรา บางทีพวกเขาอาจยังไมรูวาเราเตรียมแผนอะไรไวสําหรับรัฐ[FROM.GetAdjective]"
 wuw_GER_realpolitik.21.a: "วันอันยิ่งใหญของชาติ[ROOT.GetAdjective]!"

 wuw_GER_realpolitik.22.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.22.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองดินแดน[FROM.GetAdjective]เปนเพียงคําโกหกที่กุขึ้น และพวกเขาจะไมนิ่งเฉยขณะที่เราขโมยดินแดนดั้งเดิมของ[FROM.GetAdjective]ไปจากประชาชน ดูเหมือนพวกเขาจะจับไตเราได"
 wuw_GER_realpolitik.22.a: "พวกเขาไมหลงกลเรา แตเราจะไมหวั่นไหว!"

 wuw_GER_realpolitik.23.t: "[FROM.GetNameDefCap] เชิญเราเปนพันธมิตร"
 wuw_GER_realpolitik.23.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมยื่นขอเสนอ พวกเขาตองการใหเราเขารวมพันธมิตรของพวกเขา และมีสวนรวมในความเปนหุนสวนและสหภาพทั้งหมดที่ไดกอตั้งไวกอนหนานี้ พวกเขายังอางวาจะชวยเรายึดดินแดนออตโตมันเดิมกลับคืนมา เราจะรับขอเสนอนี้หรือไม?"
 wuw_GER_realpolitik.23.a: "ถึงเวลาทวงคืนสิ่งที่เปนของเราโดยกําเนิด!"
 wuw_GER_realpolitik.23.b: "เราไมตองการมิตรภาพของพวกเขา!"

 wuw_GER_realpolitik.24.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_realpolitik.24.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการเขารวมพันธมิตรของเราอยางสมบูรณ พวกเขายินดีรับความชวยเหลือจากเราในการทวงคืนดินแดนออตโตมันเดิม"
 wuw_GER_realpolitik.24.a: "ดีมาก"

 wuw_GER_realpolitik.25.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.25.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบคําเชิญเขารวมพันธมิตรของเราดวยความไมพอใจอยางรุนแรง และอางวาความเปนหุนสวนใด ๆ ระหวางสองประเทศไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป ดูเหมือนพวกเขาไมตองการความชวยเหลือจากเราในการทวงคืนดินแดนออตโตมันเดิม..."
 wuw_GER_realpolitik.25.a: "พวกเขากําลังพลาดโอกาส..."

 wuw_GER_realpolitik.26.t: "[FROM.GetNameDefCap] ขอทําขอตกลงการคา"
 wuw_GER_realpolitik.26.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดสงนักการทูตมายังเมืองหลวงของเราเพื่อหารือถึงลูทางความสัมพันธทางการคาที่ลึกซึ้งกับชาติ[FROM.GetAdjective] สิ่งนี้จะทําใหความสัมพันธของเราใกลชิดขึ้น แตก็จะเปดใหพวกเขาเขาถึงทรัพยากรของเราในราคาที่ถูกลง ซึ่งเสี่ยงที่จะกระทบตอเศรษฐกิจของเรา"
 wuw_GER_realpolitik.26.a: "เราไมเห็นวามีปญหาอะไร"
 wuw_GER_realpolitik.26.b: "เอาเอกสารของพวกคุณกลับไปเบอรลินไดเลย!"

 wuw_GER_realpolitik.27.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 wuw_GER_realpolitik.27.desc: "หลังจากแนวคิดนิยมกษัตริยกอตัวขึ้นเรื่อย ๆ มาเปนเวลานาน ดูเหมือนวากลุมอนุรักษนิยม[ROOT.GetAdjective]จะเบื่อหนายกับการรอคอยการเปลี่ยนแปลงรัฐบาลอยางสันติแลว โดยอางวารัฐบาลของเราตั้งใจจะกุมอํานาจทั้งหมดไวเองและไมยอมใหหวนคืนสูยุคเกา หลังการถกเถียงอยางดุเดือด การทูตดูจะลมเหลวและความขัดแยงดวยอาวุธก็ปะทุขึ้น"
 wuw_GER_realpolitik.27.a: "เพื่อองคกษัตริย!"
 wuw_GER_realpolitik.27.b: "เราตองหยุดความบาบิ่นนี้!"

 wuw_GER_realpolitik.28.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 wuw_GER_realpolitik.28.desc: "หลังจากแนวคิดประชาธิปไตยกอตัวขึ้นเรื่อย ๆ มาเปนเวลานาน ดูเหมือนวากลุมประชาธิปไตย[ROOT.GetAdjective]จะเบื่อหนายกับการรอคอยการเปลี่ยนแปลงรัฐบาลอยางสันติแลว โดยอางวารัฐบาลปจจุบันที่ตั้งใจจะกุมอํานาจทั้งหมดไวเองตองถูกโคนลมเพื่อใหประชาธิปไตยไดเบงบาน หลังการถกเถียงอยางดุเดือด การทูตดูจะลมเหลวและความขัดแยงดวยอาวุธก็ปะทุขึ้น"
 wuw_GER_realpolitik.28.a: "เพื่อสาธารณรัฐ!"
 wuw_GER_realpolitik.28.b: "เราตองหยุดความบาบิ่นนี้!"

 wuw_GER_realpolitik.29.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 wuw_GER_realpolitik.29.desc: "หลังจากแนวคิดฟาสซิสตกอตัวขึ้นเรื่อย ๆ มาเปนเวลานาน ดูเหมือนวากลุมฟาสซิสต[ROOT.GetAdjective]จะเบื่อหนายกับการรอคอยการเปลี่ยนแปลงรัฐบาลอยางสันติแลว และไดวางระเบิดสถานีตํารวจทองถิ่นแหงหนึ่ง จนจุดชนวนใหเกิดการสูรบตามทองถนน หลังการถกเถียงอยางดุเดือด การทูตดูจะลมเหลวและความขัดแยงดวยอาวุธก็ปะทุขึ้น เราทําไดเพียงรอคอยดวยใจระทึกวาอนาคตของชาติ[ROOT.GetAdjective]จะเปนอยางไร"
 wuw_GER_realpolitik.29.a: "เพื่อการปฏิวัติ!"
 wuw_GER_realpolitik.29.b: "เราตองหยุดความบาบิ่นนี้!"

 # wuw_GER_realpolitik.30, wuw_GER_realpolitik.31 and wuw_GER_realpolitik.32 use other loc 

 wuw_GER_realpolitik.33.t: "[FROM.GetNameDefCap] เรียกรองการบูรณาการทางเศรษฐกิจ"
 wuw_GER_realpolitik.33.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมยื่นขอเสนอ พวกเขาตองการใหเราเพิ่มกิจกรรมของสหภาพศุลกากรและบูรณาการทางเศรษฐกิจกับพวกเขามากขึ้น สิ่งนี้จะชวยเศรษฐกิจของเราไดอยางมาก แตทั้งหมดนี้ดูมีอะไรแปลก ๆ อยู..."
 wuw_GER_realpolitik.33.a: "ดีเกินกวาจะปลอยผาน"
 wuw_GER_realpolitik.33.b: "เราจะไมสละเอกราชทางเศรษฐกิจของเรา!"

 wuw_GER_realpolitik.34.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_realpolitik.34.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการบูรณาการทางเศรษฐกิจที่ลึกซึ้งยิ่งขึ้น"
 wuw_GER_realpolitik.34.a: "เราขอบคุณในความไรเดียงสาของพวกเขา"

 wuw_GER_realpolitik.35.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.35.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบคําเชิญบูรณาการของเราดวยความไมพอใจอยางรุนแรง และอางวาความเปนหุนสวนทางเศรษฐกิจที่ใกลชิดขึ้นใด ๆ ระหวางสองประเทศไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป บางทีพวกเขาอาจมองออกวาเราเตรียมอะไรไวให..."
 wuw_GER_realpolitik.35.a: "ขาวรายจริง ๆ..."

 wuw_GER_realpolitik.36.t: "[FROM.GetNameDefCap] เสนอการรวมชาติ"
 wuw_GER_realpolitik.36.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เสนอใหชาติของเรารวมเขากับชาติของพวกเขา เพราะประชาชนเปนชนชาติเดียวกัน และจะรูสึกไดรับการปกปองดีกวาเมื่อรวมกันภายใตรัฐเดียวที่แข็งแกรงกวา ขอความนั้นแฝงไวดวยความกดดันและความกาวราว แตบางทีการเปนสวนหนึ่งของสิ่งที่ยิ่งใหญกวาอาจเปนทางที่ดีที่สุด?"
 wuw_GER_realpolitik.36.a: "แนวทางเยอรมันนอยเปนความผิดพลาด"
 wuw_GER_realpolitik.36.b: "เราจะไมประนีประนอมเรื่องเอกราชของเรา!"

 wuw_GER_realpolitik.37.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 wuw_GER_realpolitik.37.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาหลังจากจัดการลงคะแนนเสียงของประชาชน ไดมีมติวาชาติ[FROM.GetAdjective]จะสิ้นสภาพอยางเปนทางการนับแตวันนี้ และกลายเปนสวนหนึ่งของอาณาจักร[ROOT.GetAdjective]โดยสมบูรณ ดูเหมือนการโนมนาวของเราจะสําเร็จ"
 wuw_GER_realpolitik.37.a: "วันอันยิ่งใหญของชาติ[ROOT.GetAdjective]!"

 wuw_GER_realpolitik.38.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 wuw_GER_realpolitik.38.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาเหตุผลที่เราเรียกรองให[FROM.GetAdjective]ยอมอยูใตอํานาจนั้นบอนทําลายแนวคิดเรื่องอธิปไตยและการกําหนดชะตากรรมตนเองของ[FROM.GetAdjective]โดยสิ้นเชิง ดูเหมือนพวกเขาไมตองการเปนสวนหนึ่งของมหารัฐเจอรแมนิก"
 wuw_GER_realpolitik.38.a: "ถาเชนนั้นเราตองเคารพความตองการของพวกเขา"
 wuw_GER_realpolitik.38.b: "[FROM.GetNameDefCap] เปนของ[ROOT.GetAdjective]!"
 AUS_is_more_likely_to_accept_being_brothers_in_arms_flag: "ประชาชน§Y[AUS.GetAdjective]§!ถูกโนมนาวใหมาอยูฝายเราแลว"

 wuw_GER_realpolitik.39.t: "[FROM.GetNameDefCap] เชิญเราเปนพันธมิตร"
 wuw_GER_realpolitik.39.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมยื่นขอเสนอ พวกเขาตองการใหเราเขารวมพันธมิตรของพวกเขา และมีสวนรวมในความเปนหุนสวนและสหภาพทั้งหมดที่ไดกอตั้งไวกอนหนานี้ พวกเขายังอางวาจะชวยเรายึดดินแดนฮังการีเดิมกลับคืนมา และชวยฟนฟูมหาฮังการี เราควรรับขอเสนอนี้หรือไม?"
 wuw_GER_realpolitik.39.a: "ถึงเวลาทวงคืนสิ่งที่เปนของเราโดยกําเนิด!"
 wuw_GER_realpolitik.39.b: "เราไมตองการมิตรภาพของพวกเขา!"

 wuw_GER_realpolitik.40.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_realpolitik.40.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการเขารวมพันธมิตรของเราอยางสมบูรณ พวกเขายินดีรับความชวยเหลือจากเราในการทวงคืนดินแดนฮังการีเดิม"
 wuw_GER_realpolitik.40.a: "ดีมาก"

 wuw_GER_realpolitik.41.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.41.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบคําเชิญเขารวมพันธมิตรของเราดวยความไมพอใจอยางรุนแรง และอางวาความเปนหุนสวนใด ๆ ระหวางสองประเทศไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป ดูเหมือนพวกเขาไมตองการความชวยเหลือจากเราในการทวงคืนดินแดนฮังการีเดิม..."
 wuw_GER_realpolitik.41.a: "พวกเขากําลังพลาดโอกาส..."

 wuw_GER_realpolitik.42.t: "[FROM.GetNameDefCap] เชิญเราเปนพันธมิตร"
 wuw_GER_realpolitik.42.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมยื่นขอเสนอ พวกเขาตองการใหเราเขารวมพันธมิตรของพวกเขา และกลับมาสูเคียงบาเคียงไหลกันฉันพี่นองอีกครั้ง เหมือนที่เคยทําในมหาสงคราม พวกเขายังอางวาจะชวยเรายึดดินแดนออสเตรีย-ฮังการีเดิมกลับคืนมา และชวยฟนฟูบูรณภาพแหงดินแดนของจักรวรรดิ เราควรรับขอเสนอของพวกเขาหรือไม?"
 wuw_GER_realpolitik.42.a: "ถึงเวลาทวงคืนสิ่งที่เปนของเราโดยกําเนิด!"
 wuw_GER_realpolitik.42.b: "เราไมตองการมิตรภาพของพวกเขา!"

 wuw_GER_realpolitik.43.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_realpolitik.43.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการเขารวมมิทเทลยูโรปาอยางสมบูรณ พวกเขายินดีรับความชวยเหลือจากเราในการทวงคืนดินแดนออสเตรีย-ฮังการีเดิม และปรารถนาจะกลับมาสูเคียงบาเคียงไหลกันฉันพี่นองเพื่อตอกรกับทั้งโลกอีกครั้ง"
 wuw_GER_realpolitik.43.a: "วิเศษยิ่งนัก"

 wuw_GER_realpolitik.44.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.44.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบคําเชิญเขารวมพันธมิตรของเราดวยความไมพอใจอยางรุนแรง และอางวาความเปนหุนสวนใด ๆ ระหวางสองประเทศไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป ดูเหมือนพวกเขาไมตองการความชวยเหลือจากเราในการทวงคืนดินแดนออสเตรีย-ฮังการีเดิม..."
 wuw_GER_realpolitik.44.a: "พวกเขามองไมเห็นสิ่งที่ดีที่สุดสําหรับประชาชนของตนเอง"

 wuw_GER_realpolitik.45.t: "[FROM.GetLeader] ตองการแบงเชโกสโลวาเกีย"
 wuw_GER_realpolitik.45.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดมาพบเราพรอมขอเสนอที่นาสนใจ พวกเขาตองการแบงดินแดนเชโกสโลวาเกียเดิมระหวางสองชาติของเรา ฟงดูเปนความคิดที่ดีใชไหม?"
 wuw_GER_realpolitik.45.a: "ตกลง!"
 wuw_GER_realpolitik.45.b: "เราตกลงเรื่องนี้ไมได"

 wuw_GER_realpolitik.46.t: "[GER.GetNameDefCap] เรียกรองดินแดนเชโกสโลวาเกีย"
 wuw_GER_realpolitik.46.desc: "[GER.GetLeader] แหง[GER.GetNameDef] เรียกรองใหเราสงมอบดินแดนเชโกสโลวาเกียทั้งหมดที่เคยเปนสวนหนึ่งของจักรวรรดิออสเตรีย-ฮังการีคืนใหแกพวกเขาและพันธมิตร ฟงดูเปนขอตกลงที่แยสําหรับเรา แตบางทีเราอาจตานทานพวกเขาไมได?"
 wuw_GER_realpolitik.46.a: "เราสูกับทั้งสองฝายไมได..."
 wuw_GER_realpolitik.46.b: "เราจะไมมีวันยอมแพ!"

 wuw_GER_realpolitik.47.t: "[FROM.GetLeader] ยอมรับการแบงเชโกสโลวาเกีย"
 wuw_GER_realpolitik.47.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมตามขอเรียกรองของเรา แมมันจะโหดรายเพียงใดก็ตาม กองทหารของเราเริ่มเคลื่อนพลแลว และในที่สุดก็ถึงเวลาฟนฟูเกียรติยศในอดีตที่สูญหายไปนาน"
 wuw_GER_realpolitik.47.a: "ยอดเยี่ยม"

 wuw_GER_realpolitik.48.t: "[FROM.GetLeader] ปฏิเสธการแบงเชโกสโลวาเกีย"
 wuw_GER_realpolitik.48.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ปฏิเสธดินแดนอันชอบธรรมของเรา และอางวาหากเราตองการ ก็ตองมายึดไปดวยมือของเราเอง ชาว[FROM.GetAdjective]ชางพูดจาโอหัง แตพวกเขาจะทําไดอยางที่พูดหรือเปลา?"
 wuw_GER_realpolitik.48.a: "เราจะทวงคืนสิ่งที่เปนของเรา!"

 wuw_GER_realpolitik.49.t: "เจาเหนือหัวของเรายกเราให[GER.GetNameDef]"
 wuw_GER_realpolitik.49.desc: "เจาเหนือหัวของเราทรยศเราโดยสิ้นเชิง และเลือกที่จะสงมอบดินแดนของเราใหแก[GER.GetNameDef] เราควรยอมตามการตัดสินใจของพวกเขา หรือพยายามตอตาน?"
 wuw_GER_realpolitik.49.a: "ก็ได..."
 wuw_GER_realpolitik.49.b: "ถาอยางนั้นพวกเขาตองยึดเราดวยกําลัง!"

 wuw_GER_realpolitik.50.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_realpolitik.50.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ปฏิเสธญัตติของเราที่จะแบงแยกดินแดนเชโกสโลวาเกียของออสเตรีย-ฮังการีเดิม ดูเหมือนขอตกลงจะลมไปแลว..."
 wuw_GER_realpolitik.50.a: "ถาอยางนั้นเราก็ทําอะไรไดไมมาก..."

 wuw_GER_realpolitik.51.t: "คําวินิจฉัยเบอรลินครั้งที่หนึ่ง"
 wuw_GER_realpolitik.51.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เพิ่งประณามสิ่งที่พวกเขาเรียกวาการยึดครองดินแดนกาลิเซียของเราอยางผิดกฎหมาย โดยอางวาดินแดนเหลานั้นยังคงเปนสวนหนึ่งอันชอบธรรมของจักรวรรดิออสเตรีย-ฮังการีเดิม ซึ่ง[FROM.GetNameDef]และพันธมิตรอางสิทธิ์อยางสมบูรณ บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และกองทหารของพวกเขากําลังรวมพลอยูที่ชายแดนของเรา เราควรตอบโตอยางไร?"
 wuw_GER_realpolitik.51.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 wuw_GER_realpolitik.51.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 wuw_GER_realpolitik.52.t: "[FROM.GetNameDefCap] โอนกาลิเซีย"
 wuw_GER_realpolitik.52.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ผูมีเหตุผลตกลงสงมอบดินแดนในกาลิเซียใหแกพันธมิตรของเรา และสั่งใหกองทหารของตนวางอาวุธและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 wuw_GER_realpolitik.52.a: "วันนี้เปนวันที่ยิ่งใหญ!"

 wuw_GER_realpolitik.53.t: "[FROM.GetNameDefCap] ยืนหยัด"
 wuw_GER_realpolitik.53.desc: "แมจะไมใชเรื่องเหนือความคาดหมายเสียทีเดียว แต[FROM.GetLeader]ผูโงเขลาแหง[FROM.GetNameDef]ไดสั่งใหกองทหารของประเทศเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 wuw_GER_realpolitik.53.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 wuw_GER_realpolitik.53.b: "เราตองปลอยเรื่องนี้ไป..."

 wuw_GER_realpolitik.54.t: "คําวินิจฉัยเบอรลินครั้งที่สอง"
 wuw_GER_realpolitik.54.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เพิ่งประณามสิ่งที่พวกเขาเรียกวาการยึดครองดินแดนบานัตและทรานซิลเวเนียของเราอยางผิดกฎหมาย โดยอางวาดินแดนเหลานั้นยังคงเปนสวนหนึ่งอันชอบธรรมของจักรวรรดิออสเตรีย-ฮังการีเดิม ซึ่ง[FROM.GetNameDef]และพันธมิตรอางสิทธิ์อยางสมบูรณ บัดนี้เราไดรับคําขาดจาก[FROM.GetAdjective] และกองทหารของพวกเขากําลังรวมพลอยูที่ชายแดนของเรา เราควรตอบโตอยางไร?"
 wuw_GER_realpolitik.54.a: "ไมคุมที่จะตองเสียเลือดเนื้อ"
 wuw_GER_realpolitik.54.b: "ถาอยางนั้นก็มาเอาไปสิ!"

 wuw_GER_realpolitik.55.t: "[FROM.GetNameDefCap] โอนดินแดนฮังการีเดิม"
 wuw_GER_realpolitik.55.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ผูมีเหตุผลตกลงสงมอบดินแดนในเขตฮังการีเดิมใหแกพันธมิตรของเรา และสั่งใหกองทหารของตนวางอาวุธและถอนกําลังออกจากพื้นที่ เราไดรับชัยชนะอีกครั้ง!"
 wuw_GER_realpolitik.55.a: "วันนี้เปนวันที่ยิ่งใหญ!"

 wuw_GER_realpolitik.56.t: "[FROM.GetNameDefCap] ยืนหยัด"
 wuw_GER_realpolitik.56.desc: "แมจะไมใชเรื่องเหนือความคาดหมายเสียทีเดียว แต[FROM.GetLeader]ผูโงเขลาแหง[FROM.GetNameDef]ไดสั่งใหกองทหารของประเทศเตรียมพรอมขั้นสูงสุดหลังไดรับคําขาดของเรา และสงทูตมาแจงวาพวกเขาจะไมถอยแมแตกาวเดียวในขอพิพาทนี้"
 wuw_GER_realpolitik.56.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 wuw_GER_realpolitik.56.b: "เราตองปลอยเรื่องนี้ไป..."

 wuw_GER_realpolitik.57.t: "[FROM.GetNameDefCap] ผนวกรวมเศรษฐกิจของเรา"
 wuw_GER_realpolitik.57.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดกาวไปไกลกวาที่สัญญาไวแตแรก และกําลังบิดเบือนกลไกตลาดเพื่อเพิ่มการพึ่งพาเศรษฐกิจของพวกเขามากขึ้น เพื่อใหแนใจวาเราจะไมอาจออกนอกเสนทางของพวกเขาได หากเราไมแยกตัวออกจากพวกเขาในทันที นี่จะเปนจุดจบของสถานะชาติเอกราชของเราโดยปริยาย เราจะจัดการเรื่องนี้อยางไร?"
 wuw_GER_realpolitik.57.a: "เราคงตองยอมรับสถานการณ"
 wuw_GER_realpolitik.57.b: "ชัยชนะหรือความตาย!"

 wuw_GER_realpolitik.58.t: "[FROM.GetNameDefCap] ยอมรับการผนวกรวมเพิ่มเติม"
 wuw_GER_realpolitik.58.desc: "ขาวอันนายินดีที่ผูนําใน[FROM.GetNameDef]ยอมรับการผนวกรวมกับเรามากขึ้น ไดรับเสียงปรบมือกึกกองในสภาไรชสทาคเมื่อชวงเชาวันนี้ สิ่งที่เราเสนอใหไดนั้นเพียงพออยางชัดเจนที่จะทําใหพวกเขามองวาขอเสนอนี้คุมคา แมอธิปไตยของพวกเขาจะถูกกระทบอยูบาง"
 wuw_GER_realpolitik.58.a: "ยอดเยี่ยม!"

 wuw_GER_realpolitik.59.t: "[FROM.GetNameDefCap] ปฏิเสธการผนวกรวมเพิ่มเติม"
 wuw_GER_realpolitik.59.desc: "แมจะมีขอไดเปรียบชัดเจนและเห็นไดชัดวาเปนสิ่งที่ดีที่สุดสําหรับสหภาพ แต[FROM.GetNameDef]ก็ปฏิเสธขอเสนอผนวกรวมเพิ่มเติมของเรา เราทําไดเพียงคาดเดาถึงเหตุผลของพวกเขา แตดูเหมือนวาพวกเขาอาจไมไดคํานึงถึงผลประโยชนสูงสุดของสหภาพ"
 wuw_GER_realpolitik.59.a: "พวกเขาเปนภัยตอเอกภาพของสมาพันธ!"
 wuw_GER_realpolitik.59.b: "เราจะจับตาพวกเขาอยางใกลชิด"

 wuw_GER_realpolitik.60.t: "[FROM.GetNameDefCap] เรียกรองการผนวกรวมโดยสมบูรณ"
 wuw_GER_realpolitik.60.desc: "การผนวกรวมเศรษฐกิจของเราดูจะยังไมเพียงพอที่จะทําใหชาว[FROM.GetAdjective]พอใจ เพราะวันนี้[FROM.GetLeader]แหง[FROM.GetNameDef]ไดกาวไปไกลกวาที่สัญญาไวแตแรก และตอนนี้เรียกรองใหเราผนวกรวมเขากับชาติของพวกเขาโดยสมบูรณ หากเราไมแยกตัวออกจากพวกเขาในทันที นี่จะเปนจุดจบของสถานะชาติเอกราชของเรา เราจะจัดการเรื่องนี้อยางไร?"
 wuw_GER_realpolitik.60.a: "เราคงตองยอมรับสถานการณ"
 wuw_GER_realpolitik.60.b: "ชัยชนะหรือความตาย!"

 wuw_GER_realpolitik.61.t: "[FROM.GetNameDefCap] ยอมรับการผนวกรวมโดยสมบูรณ"
 wuw_GER_realpolitik.61.desc: "ขาวอันนายินดีที่ผูนําใน[FROM.GetNameDef]ยอมรับการผนวกรวมเขากับชาติของเรา ไดรับเสียงปรบมือกึกกองในสภาไรชสทาคเมื่อชวงเชาวันนี้ สิ่งที่เราเสนอใหไดนั้นเพียงพออยางชัดเจนที่จะทําใหพวกเขามองวาขอเสนอนี้คุมคา แมจะตองสิ้นสุดอธิปไตยของตนก็ตาม"
 wuw_GER_realpolitik.61.a: "ยอดเยี่ยม!"

 wuw_GER_realpolitik.62.t: "[FROM.GetNameDefCap] ปฏิเสธการผนวกรวมโดยสมบูรณ"
 wuw_GER_realpolitik.62.desc: "แมจะมีขอไดเปรียบชัดเจนและเห็นไดชัดวาเปนสิ่งที่ดีที่สุดสําหรับสหภาพ แต[FROM.GetNameDef]ก็ปฏิเสธขอเสนอผนวกรวมโดยสมบูรณของเรา เราทําไดเพียงคาดเดาถึงเหตุผลของพวกเขา แตดูเหมือนวาพวกเขาอาจไมไดคํานึงถึงผลประโยชนสูงสุดของสหภาพ"
 wuw_GER_realpolitik.62.a: "พวกเขาเปนภัยตอเอกภาพของสหพันธ!"
 wuw_GER_realpolitik.62.b: "เราจะจับตาพวกเขาอยางใกลชิด"

 wuw_GER_realpolitik.63.t: "[FROM.GetNameDefCap] เชิญเราเขารวมสหภาพศุลกากร"
 wuw_GER_realpolitik.63.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดมาพบเราพรอมขอเสนอใหเขารวมสหภาพศุลกากรกับพวกเขา ซึ่งจะมีแตชวยเสริมความแข็งแกรงใหเศรษฐกิจของทั้งสองชาติ ฟงดูเปนขอตกลงที่ดีเกินกวาจะปลอยผานใชไหม?"
 wuw_GER_realpolitik.63.a: "เรายินดีตอบรับ"
 wuw_GER_realpolitik.63.b: "ฟงดูนาสงสัยนะ..."



 GOT_GER_integrated_puppet_economies.01.t: "ความชวยเหลือเพื่อการพัฒนาจาก[FROM.GetAdjective]"
 GOT_GER_integrated_puppet_economies.01.desc: "ชาวเยอรมันกําลังลงทุนในอุตสาหกรรมเพื่อพัฒนาการผลิตทางทหารของเราและผนวกรวมเศรษฐกิจบางสวนของเรา แมสิ่งนี้จะชวยเพิ่มผลิตภาพของเราอยางแนนอน แตก็จะลดอํานาจปกครองตนเองและเอกราชของเราลงดวย"
 GOT_GER_integrated_puppet_economies.01.a: "เราตองทําใหเรื่องนี้เปนประโยชนตอเรา"
 GOT_GER_integrated_puppet_economies.02.t: "โครงการแสวงประโยชนของ[FROM.GetAdjective]"
 GOT_GER_integrated_puppet_economies.02.desc: "เพื่อเสริมกําลังการผลิตทางอุตสาหกรรมของตนเอง ชาวเยอรมันกําลังดําเนินนโยบายแสวงประโยชนเพื่อดูดทรัพยากรและผลิตภาพทั้งหมดของเรา ซึ่งจะทําใหเราเหลือแตความแหงแลง"
 GOT_GER_integrated_puppet_economies.02.a: "เราตองทําใหเรื่องนี้เปนประโยชนตอเรา"
 GER_idea_added_for_limited_time: "แนวคิดตอไปนี้จะถูกเพิ่มเปนเวลา §Y$TIME$§! วัน: \n$IDEA$"
 
 wuw_GER_the_battle_of_britain.01.t: "ยุทธการแหงบริเตน"
 wuw_GER_the_battle_of_britain.01.desc: "$GER_hermann_goring$ กระตือรือรนที่จะแสดงใหเห็นถึงความเหนือชั้นของลุฟทวัฟเฟอ และทําลายขวัญกําลังใจของประชาชน[ENG.GetAdjective] เขาตั้งเปาจะทําเชนนี้ดวยการทิ้งระเบิดใสบิ๊กเบน แลนดมารกอันเปนสัญลักษณของลอนดอน เขาอางวาสิ่งนี้จะทําให[ENG.GetNameDef]ยอมสยบและทําใหสงครามสั้นลง เขายังรับประกันดวยตัวเองวาจะไมมีระเบิดแมแตลูกเดียวตกลงที่เบอรลินระหวางการรบครั้งนี้ ไมอยางนั้นจะเรียกเขาวาแฮรมันน 'ไมเออร' ก็ได"
 wuw_GER_the_battle_of_britain.01.a: "ปลอยใหเขาลองดู"
 wuw_GER_the_battle_of_britain.01.b: "เขาสัญญามากเกินไป"
 GER_unlocks_big_ben_raid_tt: "ปลดล็อก§Yการโจมตีทางอากาศ§!ตอ§Yบิ๊กเบน§!"

 wuw_GER_uncertain_future.01.t: "$GER_growing_public_dissent_mission$"
 wuw_GER_uncertain_future.01.desc: "เมื่อสงครามกลางเมืองสิ้นสุดลงในที่สุด เรากําลังคอย ๆ ฟนฟูชาติ ขณะที่ประชาชนโหยหาเสถียรภาพและความมั่นคง แตก็มีความรูสึกเควงควางไรจุดหมายหรือเปาหมายโดยรวมมากขึ้นเรื่อย ๆ ประชาชนเริ่มเหนื่อยหนายกับความไมแนนอนนี้และเรียกรองทิศทางที่มั่นคง"
 wuw_GER_uncertain_future.01.a: "เราตองลงมือโดยเร็ว!"
 wuw_GER_uncertain_future.02.t: "[ROOT.GetNameDefCap] เผชิญอนาคตที่ไมแนนอน"
 wuw_GER_uncertain_future.02.desc: "เมื่อสงครามกลางเมืองสิ้นสุดลงในที่สุด ชาติเยอรมันกําลังคอย ๆ ฟนฟู แตประชาชนโหยหาเสถียรภาพและความมั่นคง [ROOT.GetLeader] ไมไดพยายามกาวไปขางหนา และดูไมสนใจที่จะตัดสินวาอนาคตของรัฐเยอรมันใหมควรเปนอยางไร สิ่งนี้สรางความกังวลอยางมากในหมูประชาชนที่กระตือรือรนจะกาวออกจากอดีตอันแตกสลาย"
 wuw_GER_uncertain_future.02.a: "ประชาชนเริ่มกระสับกระสายงั้นหรือ?"

 wuw_GER_german_politics.01.t: "การกลับมาของประชาธิปไตย"
 wuw_GER_german_politics.01.desc: "เมื่อการเลือกตั้งเสรีกลับมาอีกครั้ง ประชาชน[ROOT.GetAdjective]ตางหลั่งไหลไปยังหนวยเลือกตั้งเพื่อกําหนดอนาคตของเยอรมนี ความรูสึกปติยินดีแผซานไปทั่วทองถนน พรอมกับความรูสึกวาในที่สุดก็ไดทิ้งวันเวลาอันมืดมนไวเบื้องหลัง ทําใหวันนี้ดูเหมือนงานเฉลิมฉลองมากกวาการเลือกตั้งระดับชาติ"
 wuw_GER_german_politics.01.a: "เราตองการนักอนุรักษนิยมผูรอบคอบ"
 wuw_GER_german_politics.01.b: "เราตองการนักสังคมนิยมผูมองการณไกล"
 wuw_GER_german_politics.02.t: "ผูนําเพื่อประชาชน"
 wuw_GER_german_politics.02.desc: "การหวนคืนสูอุดมการณของสันนิบาตสปารตาคัสมาพรอมกับความปรารถนาที่จะใหประชาชนมีสวนรวมอยางจริงจังมากขึ้น จึงมีการจัดการเลือกตั้งเพื่อเลือกผูแทนของเรา และเมื่อนับคะแนนครบทุกใบแลว ผลที่ออกมาก็สูสีกันมาก ประชาชนเห็นไดชัดวาผูสมัครทั้งสองคนเหมาะสมจะเปนผูนํา[ROOT.GetNameDef] แตนาเสียดายที่เราแตงตั้งไดเพียงคนเดียว"
 wuw_GER_german_politics.02.a: "ไฮนริช บรันดเลอรคือตัวเลือกที่ถูกตอง!"
 wuw_GER_german_politics.02.b: "ใหแอนสท เทลมันนอยูในอํานาจตอไป!"
 wuw_GER_german_politics.02.c: "เราตองการนักสังคมนิยมสายปฏิบัตินิยม!"

 GOT_GER_amerikabomber.01.t: "โครงการอเมริกาบอมเบอร"
 GOT_GER_amerikabomber.01.desc: "เมื่อการตัดสินใจสรางเครื่องบินทิ้งระเบิดพิสัยไกลไดเริ่มดําเนินการแลว แบบจากทีมตาง ๆ ก็ถูกสงเขามา แตละทีมตางสัญญาวาจะสรางเครื่องจักรที่สามารถนําสงครามขามมหาสมุทรแอตแลนติกไปได ขั้นตอนเดียวที่เหลืออยูคือการเลือกทีมที่จะทําใหแผนอันทะเยอทะยานนี้เปนจริง"
 GOT_GER_amerikabomber.01.a: "$GER_focke_wulf_organization$"
 GOT_GER_amerikabomber.01.b: "$GER_heinkel_organization$"
 GOT_GER_amerikabomber.01.c: "$GER_junkers_organization$"
 GOT_GER_amerikabomber.01.d: "$GER_messerschmitt_organization$"
 when_intercontinental_bomber_project_is_completed_tt: "เมื่อโครงการพิเศษ §Y$sp_air_intercontinental_bomber$§! เสร็จสมบูรณ:"
 GER_amerikabomber_focke_wulf_flag: "§Y$GER_focke_wulf_organization$§! ไดรับมอบหมายใหพัฒนา§Yอเมริกาบอมเบอร§!"
 GER_amerikabomber_heinkel_flag: "§Y$GER_heinkel_organization$§! ไดรับมอบหมายใหพัฒนา§Yอเมริกาบอมเบอร§!"
 GER_amerikabomber_messerschmitt_flag: "§Y$GER_messerschmitt_organization$§! ไดรับมอบหมายใหพัฒนา§Yอเมริกาบอมเบอร§!"
 GER_amerikabomber_junkers_flag: "§Y$GER_junkers_organization$§! ไดรับมอบหมายใหพัฒนา§Yอเมริกาบอมเบอร§!"


 # Event for GER
 GER_operation_panzerfaust_events.01.t: "คําถามเรื่องความภักดีของฮอรที"
 GER_operation_panzerfaust_events.01.desc: "มีความเปนไปไดวามิกโลช ฮอรที พันธมิตรของเรา กําลังเจรจาสันติภาพลับกับศัตรูของเรา เราตองกดดันเขาเพื่อใหแนใจวาฮังการียังคงภักดีตออุดมการณของเรา"
 GER_operation_panzerfaust_events.01.a: "เรียกรองใหเขาสยบยอมตอทานผูนํา"
 GER_operation_panzerfaust_events.01.b: "นี่เปนการตื่นตูมเกินเหตุ ฮอรทีภักดีตอเรา!"

 # Event for HUN
 GER_operation_panzerfaust_events.02.t: "[GER.GetLeader] เรียกรองใหฮอรทีลาออก"
 GER_operation_panzerfaust_events.02.desc: "วันนี้เราไดรับขาววาชาวเยอรมันเรียกรองใหมิกโลช ฮอรทีลงจากตําแหนงและใหแฟแร็นตส ซาลาชีขึ้นแทน ซึ่งพวกเขาเห็นวาไววางใจไดมากกวา พวกเขายังระบุดวยวาหากไมไดตามที่ตองการ อาจจําเปนตองเขาแทรกแซงประเทศของเรา"
 GER_operation_panzerfaust_events.02.a: "เราไมอยูในฐานะที่จะคัดคานพวกเขาได"
 GER_operation_panzerfaust_events.02.b: "พวกเขาไมมีอํานาจที่นี่"

 # Event for GER
 GER_operation_panzerfaust_events.03.t: "ฮังการียอมจํานน"
 GER_operation_panzerfaust_events.03.desc: "มิกโลช ฮอรทียอมจํานนแลว และฮังการีก็อยูในกํามือของเราโดยสมบูรณ ดูเหมือนการขมขูของเราจะไดผล"
 GER_operation_panzerfaust_events.03.a: "ยอดเยี่ยม"

 # Event for GER
 GER_operation_panzerfaust_events.04.t: "ฮอรทียังคงแข็งขอ"
 GER_operation_panzerfaust_events.04.desc: "วันนี้มิกโลช ฮอรทีประกาศวาเขาจะไมยอมจํานนตอแรงกดดันของเยอรมนี และฮังการีจะไมตกอยูในมือของเยอรมนี เมื่อแรงกดดันทางการทูตเพียงอยางเดียวดูจะไมเพียงพอ เราตองตัดสินใจวาจะดําเนินการอยางไรตอไป"
 GER_operation_panzerfaust_events.04.a: "เรื่องนี้ไปไกลเกินไปแลว เริ่มปฏิบัติการมารกาเรเทอ!"
 GER_operation_panzerfaust_events.04.b: "เราจะไมเลนตามเกมของเขา"
 GER_operation_panzerfaust_events.04.c: "ถาอยางนั้นปลอยใหสายลับของเราจัดการ..."

 # Event for HUN
 GER_operation_panzerfaust_events.05.t: "เยอรมนีเริ่มปฏิบัติการมารกาเรเทอ"
 GER_operation_panzerfaust_events.05.desc: "ทานผูนําทําตามคําพูดและประกาศเริ่มปฏิบัติการมารกาเรเทอแลว ซึ่งเปนการรุกรานประเทศของเราโดยมีเปาหมายเพื่อใหเราตกอยูใตอํานาจ เราตองยืนหยัดตอตาน!"
 GER_operation_panzerfaust_events.05.a: "ใหพวกเขามาเลย"

 # Event for HUN
 GER_operation_panzerfaust_events.06.t: "เยอรมนีพยายามลดความตึงเครียด"
 GER_operation_panzerfaust_events.06.desc: "แมจะมีการคุกคามพรมแดนและอธิปไตยของเรามาตลอด แตบัดนี้เยอรมนีพยายามลดความตึงเครียดของสถานการณดวยการถอนขอเรียกรองของตน"
 GER_operation_panzerfaust_events.06.a: "ถาเชนนั้นก็ตามนั้น"

 # Event for GER
 GER_operation_panzerfaust_events.07.t: "ปฏิบัติการพันเซอรเฟาสตลมเหลว"
 GER_operation_panzerfaust_events.07.desc: "แมเราหวังวานี่จะเปนการโจมตีครั้งสุดทายตอชาวฮังการีที่แข็งขอมากขึ้นเรื่อย ๆ แตวันนี้ปฏิบัติการพันเซอรเฟาสตกลับถูกขัดขวาง หลังสายลับของเราถูกจับกุมใกลที่พักของฮอรที"
 GER_operation_panzerfaust_events.07.a: "พวกเขาคงตองอยูนอกกํามือเราไปกอน ในตอนนี้"

 # Event for GER
 GER_operation_panzerfaust_events.08.t: "ปฏิบัติการพันเซอรเฟาสตสําเร็จ"
 GER_operation_panzerfaust_events.08.desc: "เราจับตัวฮอรทีและบุตรชายไดสําเร็จ และไดสงมอบอํานาจใหแฟแร็นตส ซาลาชีแลว ดวยเหตุนี้ ฮังการีจะภักดีตออุดมการณของเรานับจากนี้"
 GER_operation_panzerfaust_events.08.a: "ยอดเยี่ยมที่สุด"

 # Event for HUN
 GER_operation_panzerfaust_events.09.t: "แผนการตอฮอรทีถูกขัดขวาง"
 GER_operation_panzerfaust_events.09.desc: "วันนี้เราไดรับขาววาแผนการของชาวเยอรมันที่จะโคนอํานาจและลักพาตัวฮอรทีกับบุตรชายลมเหลว หลังสายลับของพวกเขาถูกจับกุมนอกที่พัก"
 GER_operation_panzerfaust_events.09.a: "เราปลอดภัยแลว ในตอนนี้"

 # Event for HUN
 GER_operation_panzerfaust_events.10.t: "ฮอรทีถูกลักพาตัว"
 GER_operation_panzerfaust_events.10.desc: "วันนี้ชาวเยอรมันนํารถถังบุกขึ้นเนินปราสาทและจับตัวมิกโลช ฮอรทีไป มีขาวลือวาพวกเขาไดพาตัวมิกโลช ฮอรทีผูลูกไปยังออสเตรีย พวกเขาไดออกอากาศขอความวาเราตองยอมจํานน มิฉะนั้นพวกเขาจะบังคับใหเรายอม"
 GER_operation_panzerfaust_events.10.a: "เราคงตองยอมรับเงื่อนไขของพวกเขา"
 GER_operation_panzerfaust_events.10.b: "เราจะไมมีวันยอมจํานน!"

 GOT_GER_fading_eagle.01.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมอยูใตอํานาจ"
 GOT_GER_fading_eagle.01.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเรายอมอยูใตอํานาจของพวกเขา ทามกลางการรณรงคเพื่อยึดอํานาจควบคุมบอลขานและจักรวรรดิอิตาลีเดิมกลับคืน ในขณะนี้เราไมมีกําลังพอจะตานทานพวกเขาไดจริง แตบางทีนี่อาจเปนโอกาสแหงอิสรภาพที่เรารอคอยมาตลอด?"
 GOT_GER_fading_eagle.01.a: "เราตองยอมไปกอน"
 GOT_GER_fading_eagle.01.b: "เราจะไมมีวันสละอธิปไตยของเรา!"

 GOT_GER_fading_eagle.02.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา"
 GOT_GER_fading_eagle.02.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะยอมมอบตนใหแกเรา และจะภักดีตออุดมการณของเราจนถึงที่สุด"
 GOT_GER_fading_eagle.02.a: "เรากําลังไดอํานาจควบคุมคืนมา!"

 GOT_GER_fading_eagle.03.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 GOT_GER_fading_eagle.03.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาพวกเขาจะไมยอมตกอยูใตอํานาจอีกเปนครั้งที่สอง และหากเราตองการดินแดนของพวกเขา ก็ตองยึดไปดวยกําลัง"
 GOT_GER_fading_eagle.03.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"
 GOT_GER_fading_eagle.03.b: "เราไมอาจมีศัตรูเพิ่มอีกได"


