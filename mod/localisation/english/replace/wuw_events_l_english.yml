 #### GERMAN RELEASABLE AND FORMABLE EVENTS ####

 wuw_GER_releasable.1.t: "เมืองหลวงของประชาชนเยอรมัน"
 wuw_GER_releasable.1.desc: "เมื่อรัฐเยอรมันไดรับการปฏิรูป นักการเมืองหลายคนของเราโตแยงวาควรพิจารณาเมืองหลวงใหม พวกเขาอางวาเมืองหลวงปจจุบันไมสมกับฐานะอยาง 'เมืองหลวงของประชาชนเยอรมัน' หากเปนเชนนั้น เราตองการยายเมืองหลวงไปที่ใด?"
 wuw_GER_releasable.1.a: "เบอรลินคือตัวเลือกที่ชัดเจน!"
 wuw_GER_releasable.1.b: "ควรเปนมิวนิก"
 wuw_GER_releasable.1.c: "แฟรงกเฟรตจะเปนเมืองหลวงฝงตะวันตกที่ดี"
 wuw_GER_releasable.1.d: "เมืองหลวงของเราดีอยูแลว"

 wuw_GER_releasable.2.t: "การเลือกตั้ง"
 wuw_GER_releasable.2.desc: "เมื่อผลการเลือกตั้งออกมาเปนประโยชนตอพรรคไรตสปารไต ก็ถึงเวลาเลือกบุคคลที่เหมาะสมที่สุดในการปกครองประเทศ พรรคตองการใหปแยร ดูปง ขึ้นเปนผูนําในตอนนี้ เพื่อใหโฌเซฟ เบ็ก มีเวลาไปทําเรื่องสําคัญอื่น ๆ แตขณะที่เมฆดํากําลังกอตัวเหนือยุโรป การเปลี่ยนแปลงภูมิทัศนทางการเมืองครั้งใหญอาจเปนสิ่งที่ฉลาด มิฉะนั้นเราอาจตกเปนของมหาอํานาจเพื่อนบาน..."
 wuw_GER_releasable.2.a: "ปแยร ดูปง ขึ้นกุมบังเหียน"
 wuw_GER_releasable.2.b: "เรายังตองการโฌเซฟ เบ็ก"
 wuw_GER_releasable.2.c: "ในยามอันตรายนี้ ราชวงศตองลงมือ!"
 wuw_GER_releasable.2.d: "ประชาชนควรประทวงการเลือกตั้งที่ถูกโกงอยางโจงแจงเชนนี้!"

 ### GERMAN CIVIL WAR EVENTS ###

 wuw_GER_civil_war.1.t: "คอมมิวนิสตพลัดถิ่นกลับบาน"
 wuw_GER_civil_war.1.desc: "ดวยรัฐประหารของเวรมัคทตอระบอบนาซีเมื่อไมนานมานี้ คอมมิวนิสตจํานวนมากที่เคยออกนอกประเทศกําลังหลั่งไหลกลับขามพรมแดนเขามา เพราะเห็นโอกาสที่จะชวยเราสูกับผูที่เคยทํารายพวกเขา เราควรใหพวกเขารวมรบ หรือควรพยายามปดบังการกลับมาของพวกเขาไว โดยหวังวาพวกเขาจะไมไดรับความนิยมมากพอจะกอการปฏิวัติของตนเอง?"
 wuw_GER_civil_war.1.a: "ยินดีตอนรับกลับบาน สหาย!"
 wuw_GER_civil_war.1.b: "ตองมีคนคอยจับตาดูพวกเขา"

 wuw_GER_civil_war.2.t: "แอ็นสท เทลมัน ถูกปลดปลอยจากคุก"
 wuw_GER_civil_war.2.desc: "มีรายงานวากลุมพลพรรคคอมมิวนิสตไดบุกเขาเรือนจําเบาทเซินในซัคเซิน และปลดปลอยแอ็นสท เทลมัน คอมมิวนิสตผูแนวแนและอดีตผูนําพรรค KPD วัลเทอร อุลบริชท คูแขงในพรรคของเขาไดประณามการบุกเรือนจําวาเปนการกอการรายตอตานการปฏิวัติ ซึ่งนาจะมาจากความกลัววาเทลมันผูเปนที่ชื่นชอบอยางกวางขวางจะกลับมาเปนผูนําพรรคได"
 wuw_GER_civil_war.2.a: "พัฒนาการที่นาสนใจ"
 GER_thalmann_freed_from_prison_tt: "§Yแอ็นสท เทลมัน§! ถูกพลพรรคคอมมิวนิสตปลดปลอยจากคุก"
 GER_thalmann_freed_from_prison_flag: "§Yแอ็นสท เทลมัน§! ไดรับการปลดปลอยจากคุกแลว"

 wuw_GER_civil_war.3.t: "การฟนฟูกองกําลังกึ่งทหาร"
 wuw_GER_civil_war.3.desc: "นักการเมืองและนายพลของเราเพิ่งหารือกันเรื่องการนํากองกําลังกึ่งทหารเขามาในกองทัพ พรรคอนุรักษนิยมตองการฟนฟูยุวชนบิสมารค ขบวนการเยาวชนตอตานลัทธิมารกซที่เกี่ยวของกับพรรค DNVP แตคนอื่น ๆ มองวาแนวรวมเหล็กสังคมประชาธิปไตยที่สูรบอยูแลวเปนองคกรชั้นยอดที่ควรเสริมกําลัง หากเราตองการใชกองกําลังกึ่งทหารในกองทัพมากขึ้น"
 wuw_GER_civil_war.3.a: "ยุวชนบิสมารคใหมควรมาเปนอันดับแรก"
 wuw_GER_civil_war.3.b: "หากจะทํา เราควรเสริมกําลังแนวรวมเหล็ก"

 wuw_GER_civil_war.4.t: "อนาคตของกองกําลังกึ่งทหาร"
 wuw_GER_civil_war.4.desc: "เมื่อสงครามกลางเมืองสิ้นสุดลงและระบอบนาซีถูกรื้อถอนโดยสมบูรณ ก็เกิดคําถามวาการปลอยใหองคกรกึ่งทหารที่มีจุดยืนทางการเมืองชัดเจนดําเนินการอยางเสรีในประเทศเปนเรื่องฉลาดจริงหรือ เนื่องจากคณะรัฐบาลทหารแทบไมมีอํานาจควบคุมอยางเปนทางการเหนือพวกเขา จึงอาจเปนการดีที่จะสั่งหามและบังคับใหยุบ มิฉะนั้น เราอาจพยายามเก็บพวกเขาไว แตลดขนาดลงจนไมเปนภัยคุกคาม?"
 wuw_GER_civil_war.4.a: "พยายามยุบพวกเขาใหหมด"
 wuw_GER_civil_war.4.b: "บางทีเราอาจแคปลดประจําการพวกเขาไวกอน?"

 wuw_GER_civil_war.5.t: "การลุกฮือซิลีเซียครั้งที่สี่"
 wuw_GER_civil_war.5.desc: "มีรายงานมาถึงเราวาพลพรรคชาวซิลีเซียและโปแลนดเปดฉากยิงใสทหารเยอรมันในซิลีเซีย พวกเขาตองการเอกราชใหชาติของตน และมองวาสงครามกลางเมืองของเราเปนสัญญาณความออนแอที่ทําใหพวกเขากลาแยกตัว เราตองทําใหแนใจวาเปาหมายของพวกเขาจะไมสําเร็จ และปราบการกบฏใหเร็วที่สุด"
 wuw_GER_civil_war.5.a: "เราจะปลอยใหพวกเขาสําเร็จไมได!"

 wuw_GER_civil_war.6.t: "สงครามกลางเมืองคอมมิวนิสตใน[ROOT.GetNameDef]"
 wuw_GER_civil_war.6.desc: "หลังจากชวงเวลาแหงความไมพอใจอยางรุนแรงของชนชั้นกรรมาชีพ สถานการณใน[ROOT.GetNameDef]ก็กลายเปนความเปนปฏิปกษ กองกําลังของ[ROOT.GetLeader]ถูกตีแตกในหลายรัฐจากการลุกฮือตอเนื่อง การกบฏนี้จะลงเอยอยางไรยังตองรอดู"
 wuw_GER_civil_war.6.a: "เพื่อชนชั้นกรรมาชีพ!"
 wuw_GER_civil_war.6.b: "เราจะบดขยี้พวกเศษเดนนี้!"

 GER_shalva_maglakelidze_and_giorgi_kvinitadze_join: "§Yกีออรกี ควินีตัดเซ§! และ §Yชัลวา มากลาเคลิดเซ§! จะเขารวมกับเราในฐานะ§Yจอมพล§!และ§Yนายพล§!\n"
 GER_georgian_legion_recruitment_tt: "ไดรับหนวย§Yทหารราบ§!กองพันจอรเจียสองหนวย"
 GER_andrey_shckuro_and_pyotr_krasnov_join_tt: "§Yอันเดรย ชคูโร§! และ §Yปออตร ครัสนอฟ§! จะเขารวมกับเราในฐานะนายพล\n"
 GER_white_russian_exiles_divisions_recruitment_tt: "ไดรับหนวยคอสแซคสองหนวยและหนวย§Yทหารราบ§!รัสเซียหนึ่งหนวย"
 GER_cossack_exiles_divisions_recruitment_tt: "ไดรับหนวย§Yทหารมา§!คอสแซคสองหนวย"

 wuw_GER_civil_war.7.t: "ความภักดีของครีกสมารีเนอ"
 wuw_GER_civil_war.7.desc: "เราไดรับทราบวาครีกสมารีเนออาจเลือกเขาขาง[ROOT.GetLeader]เมื่อเรากอรัฐประหาร เหตุผลดูเหมือนวาแอริช เรเดอร ผูนําของพวกเขาไดรับสัญญาจาก[ROOT.GetLeader]วาเหลาทัพของเขาจะไดรับการลงทุนมหาศาลและอิสระภายใตระบอบของเขา ซึ่งรัฐบาลเกาทําไมสําเร็จ บางทีเราควรใหสัญญาในทํานองเดียวกัน เพื่อดึงเขามาอยูขางเรา?"
 wuw_GER_civil_war.7.a: "เราตองรักษาความภักดีของพวกเขาไวไมวาจะตองแลกดวยอะไร"
 wuw_GER_civil_war.7.b: "เราตองไมเอาใจแอริช เรเดอร"
 GER_promised_erich_raeder_a_great_navy_tt: "แอริช เรเดอร และครีกสมารีเนอสวนใหญจะเขารวมฝายเราเมื่อเกิดรัฐประหาร แตหากเราไมสามารถทํา§Y$GER_rebuild_the_high_seas_fleet_ww$§! หรือ§Y$GER_high_seas_fleet$§! และ§Y$GER_re_establish_the_seekriegsleitung$§!ใหสําเร็จภายในสองป เขาอาจ§Rกอกบฏตอระบอบของเรา§!"
 GER_chose_to_not_placate_erich_raeder_tt: "ครีกสมารีเนอเพียงสวนนอยจะเขารวมฝายเราเมื่อเกิดรัฐประหาร แตเราจะไมถูกผูกมัดดวยคําสัญญาใด ๆ ตอแอริช เรเดอร"

 wuw_GER_civil_war.8.t: "รัฐประหารของครีกสมารีเนอ"
 wuw_GER_civil_war.8.desc: "หลายปหลังจากที่เราสัญญาจะฟนฟูกองทัพเรือใหกลับสูความรุงโรจนดังเดิม ดูเหมือนแอริช เรเดอรและครีกสมารีเนอจะทนการถวงเวลาไมสิ้นสุดของเราไมไหวแลว เพราะเมื่อตนวันนี้พวกเขาพยายามกอรัฐประหารตอรัฐบาลของเรา โชคดีที่ลมเหลว แตเพื่อใหแนใจวาจะไมเกิดขึ้นอีก เราตองกวาดลางเจาหนาที่ระดับสูงและกลุมคนจํานวนมากในกองทัพ..."
 wuw_GER_civil_war.8.a: "พวกเขาจะตองชดใชการทรยศ!"
 wuw_GER_civil_war.8.b: "รัฐจะตองเสียใจที่ผิดสัญญา"
 this_will_happen_tt: "สิ่งตอไปนี้จะเกิดขึ้น:\n"

 wuw_GER_civil_war.9.t: "เอากุสท ฟอน มัคเคนเซิน ปลดเกษียณจากกองทัพ"
 wuw_GER_civil_war.9.desc: "เมื่อไดชัยชนะเหนือภัยนาซีแลว เอากุสท ฟอน มัคเคนเซิน หัวหนารัฐบาลทหาร ตัดสินใจถอยจากการบัญชาการในสนามอีกครั้งเนื่องจากอายุและสุขภาพที่ทรุดลง และกลาววานับจากนี้เขาจะชวยงานบริหารเทานั้น"
 wuw_GER_civil_war.9.a: "เขารับใชเราเปนอยางดี"
 GER_mackensen_went_into_retirement_tt: "§Yเอากุสท ฟอน มัคเคนเซิน§! พนจากการเปน§Yจอมพล§!"
 GER_recalled_hans_krebs_from_russia_flag: "§Yฮันส เครพส§! ถูกเรียกตัวกลับจาก§Y[SOV.GetNameDef]§!"


 ### GERMAN FOREIGN LEGIONS AND LEGIONARIES EVENTS ###

 wuw_GER_legions.1.t: "การกอตั้งกองทหารตางชาติจอรเจีย"
 wuw_GER_legions.1.desc: "ดวยการประกาศเมื่อไมนานนี้วาเราตั้งใจจะฟนฟูพรมแดนตามสนธิสัญญาสันติภาพเบรสต-ลีตอฟสค นายพลและทหารชาวจอรเจียพลัดถิ่นจํานวนหนึ่งไดเขามาหาเรา ตองการชวยเรายึดบานเกิดเดิมของพวกเขาคืน แลกกับคําสัญญาที่จะฟนฟูรัฐจอรเจียและใหอํานาจปกครองเหนือคอเคซัส เราควรรับความชวยเหลือของพวกเขาหรือไม?"
 wuw_GER_legions.1.a: "ยินดีตอนรับใหมารวมกับเรา"
 wuw_GER_legions.1.b: "เราไมตองการพวกเขา"

 wuw_GER_legions.2.t: "ฮันส เครพส ถูกเรียกตัวกลับจาก[SOV.GetNameDef]"
 wuw_GER_legions.2.desc: "ดวยการประกาศความเปนปฏิปกษระหวางเรากับชาว[SOV.GetAdjective]เมื่อไมนานมานี้ คณะผูชวยทูตทหารของเรานําโดยพลตรีฮันส เครพส ถูกเรียกตัวกลับลวงหนาไมกี่สัปดาหและเพิ่งเดินทางถึงเบอรลิน บัดนี้เขาพรอมรับใชในแนวรบดานตะวันออก โดยกลาววาเขามีประสบการณและความรูเกี่ยวกับกองทัพ[SOV.GetAdjective]ที่เราตองการเพื่อการบุกดินแดนของพวกเขาใหสําเร็จ"
 wuw_GER_legions.2.a: "ขาวกรองทางทหารของเขามีประโยชนตอเรา"

 wuw_GER_legions.3.t: "โอกาสความรวมมือในโลค็อต"
 wuw_GER_legions.3.desc: "หลังการยึดครองแควนบรยันสค คูรสค และโอริออล กองทัพของเราไดวางแผนใชผูรวมมือทองถิ่นในโลค็อตเพื่อปกครองภูมิภาคไดงายขึ้น ขณะเดียวกันก็ใหพวกเขาระดมหนวยเพิ่มเพื่อสูในนามการตอตาน[SOV.GetAdjective] อยางไรก็ตาม การนี้จะทําใหกลุมกองทัพของเราไมไดผลประโยชนจากสงครามในภูมิภาคนี้ เราควรอนุมัติการจัดตั้งเขตปกครองตนเองโลค็อตหรือไม?"
 wuw_GER_legions.3.a: "ศัตรูของศัตรูคือมิตรของเราเสมอ!"
 wuw_GER_legions.3.b: "เราไมตองการผูรวมมือทองถิ่น"

 wuw_GER_legions.4.t: "ผูรวมมือในโลค็อต!"
 wuw_GER_legions.4.desc: "เราไดรับทราบวากองทัพ[GER.GetAdjective]ไดจัดตั้งเขตปกครองตนเองโลค็อตในพื้นที่ชายแดนระหวางแควนบรยันสค คูรสค และโอริออล หลังจากไดรับการติดตอจากผูรวมมือผูกระตือรือรนอยางคอนสตันติน วอสโคบอยนิก และบรอนิสลาฟ คามินสกี ดูเหมือนพวกเขาไดรับมอบหมายใหปกครองภูมิภาคและจัดการกับพลพรรคและการตอตาน เราตองตอบโตศัตรูและทําลายรัฐปลอมนี้ใหเร็วที่สุด!"
 wuw_GER_legions.4.a: "พวกเขาเลือกผิดแลว"
 lokot_autonomy_has_been_established_flag: "§Yเขตปกครองตนเองโลค็อต§!ไดรับการจัดตั้งแลว"
 lokot_autonomy_has_been_crushed_flag: "§Yเขตปกครองตนเองโลค็อต§!ถูกบดขยี้แลว"
 SOV_recapture_lokot_to_destroy_the_autonomy_tt: "หากเรายึด§Y[224.GetName]§! §Y[220.GetName]§! และ§Y[222.GetName]§!คืนได เราจะรื้อถอน§Yเขตปกครองตนเองโลค็อต§!ไดอยางรวดเร็ว"

 wuw_GER_legions.5.t: "การรื้อถอนเขตปกครองตนเองโลค็อต"
 wuw_GER_legions.5.desc: "หลังยึดแควนบรยันสค คูรสค และโอริออลคืนได กองทัพของเราจับกุมผูรวมมือสวนใหญในโลค็อต และฟนฟูรัฐบาลทองถิ่นของเราในภูมิภาค กองทัพ[GER.GetAdjective]ไดถอยออกจากภูมิภาค และผูบัญชาการของเรายืนยันวาวันแหงชัยชนะใกลเขามาทุกที"
 wuw_GER_legions.5.a: "เราจะไดชัยชนะ!"

 wuw_GER_legions.6.t: "การทําลายเขตปกครองตนเองโลค็อต"
 wuw_GER_legions.6.desc: "หลังฝาย[SOV.GetAdjective]ยึดภูมิภาคโลค็อตคืน พวกเขาไดรื้อถอนรัฐปกครองตนเองที่เราจัดตั้งไว รวมทั้งจับกุมและกําจัดสมาชิกทั้งหมดของรัฐบาลรวมมือทองถิ่น"
 wuw_GER_legions.6.a: "สงครามพลิกผันแลว"
 GER_lokot_collaborators_have_been_captured_by_the_soviets_tt: "§Y[GER.SOV_bronislav_kaminski.GetName]§! และ §Y[GER.SOV_konstantin_voskoboinik.GetName]§! ถูกกองกําลัง[SOV.GetAdjective]จับกุม"

 wuw_GER_legions.7.t: "ขอเสนอจากชาวรัสเซียพลัดถิ่นในเซอรเบีย"
 wuw_GER_legions.7.desc: "หลังการจัดตั้งรัฐบาลกอบกูชาติเซอรเบียในดินแดนที่เราเพิ่งยึดครอง ผูอพยพรัสเซียขาวจํานวนหนึ่งไดเสนอชวยจัดตั้งกองพลพิทักษรัสเซีย ซึ่งจะชวยเราคุมครองโรงงานและอาคารรัฐบาลในเซอรเบียที่ถูกยึดครอง รวมทั้งชวยปราบเชตนิกและนักสูฝายตอตานอื่น ๆ ในภูมิภาค เราควรใชความชวยเหลือของพวกเขาหรือไม?"
 wuw_GER_legions.7.a: "ความชวยเหลือของพวกเขามีประโยชนในการปราบเซอรเบีย"
 wuw_GER_legions.7.b: "เราไมตองการพวกรัสเซียเศษเดนนี้"

 wuw_GER_legions.8.t: "ขอเสนอจากคอสแซคผูไมพอใจ"
 wuw_GER_legions.8.desc: "เมื่อเจตนาของเราที่จะถีบประตูผุพังของ[SOV.GetNameDef]ชัดเจนขึ้นทุกที ผูแพหลายคนในสงครามกลางเมืองรัสเซียไดเขามาหาเรา ตองการโอกาสที่จะโคนรัฐบาล[SOV,GetAdjective]ปจจุบัน ในจํานวนนั้นมีคอสแซคดอนและคูบาน [SOV.SOV_pyotr_krasnov.GetName] และ [SOV.SOV_andrey_shkuro.GetName] ที่ตองการรบใหเรา เราควรรับความชวยเหลือของพวกเขาหรือไม?"
 wuw_GER_legions.8.a: "ความรูเรื่องทุงหญาคูบานของพวกเขามีประโยชนตอเรา"
 wuw_GER_legions.8.b: "แลวเราจะตองการความชวยเหลือจากคอสแซคไปทําไม?"






 ### GERMAN MONROE DOCTRINE EVENTS ###

 wuw_GER_monroe.1.t: "ความสนใจของ[FROM.GetAdjectiveCap]ตอลัทธิมอนโร"
 wuw_GER_monroe.1.desc: "เราไดรับรายงานที่นาตกใจวา[FROM.GetNameDef]เริ่มแสดงความสนใจมากขึ้นในการบอนทําลายลัทธิมอนโร ลัทธินี้ถูกวางไวเพื่อปองกันไมใหชาติตางชาติกอปญหาในทวีปอเมริกาซึ่งเราถือเปนเขตอิทธิพลของเรา จากประสบการณที่ผานมากับ[FROM.GetNameDef] เราไดแตสันนิษฐานวาเจตนาของพวกเขาไมดี"
 wuw_GER_monroe.1.a: "เราตองเขาแทรกแซง!"
 wuw_GER_monroe.1.a_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมความแข็งแกรงลัทธิมอนโร§!\n\n[GER.GetNameDefCap] ไดปลดล็อกการตัดสินใจเพื่อพยายาม§Rบอนทําลายลัทธิมอนโร§!"
 wuw_GER_monroe.1.b: "ใครจะสนละ?"
 wuw_GER_monroe.1.b_tt: "[GER.GetNameDefCap] ไดปลดล็อกการตัดสินใจเพื่อพยายาม§Rบอนทําลายลัทธิมอนโร§!\n\nหากเลือกตัวเลือกนี้ เราจะ§Rไม§!ไดรับการแจงเตือนใด ๆ เกี่ยวกับลัทธิมอนโรอีก [FROM.GetNameDefCap] จะสามารถพยายามลมลัทธินี้ไดโดยไมถูกขัดขวาง\n\n§Rเลือกตัวเลือกนี้เฉพาะเมื่อมีแผนสํารองพรอมแลวเทานั้น!§!"

 wuw_GER_monroe.2.t: "ลัทธิมอนโรพังทลาย"
 wuw_GER_monroe.2.desc: "หลังแรงกดดันอยางหนักจาก[FROM.GetAdjective] ดูเหมือนลัทธิมอนโรกําลังพังทลายในที่สุด หลายประเทศลุกขึ้นตอตานลัทธินี้และหันไปใกลชิดกับชาว[FROM.GetAdjective]มากขึ้น แมเสียงคัดคานจะดัง แตก็ยังมีผูที่อาจเห็นวาลัทธินี้ควรคาแกการรักษาไว อยางนอยก็ในระดับหนึ่ง ณ จุดนี้การกระทําทั้งหมดของเราจะถือเปนยุทธวิธีบรรเทาความเสียหาย เราควรเลือกการตอบสนองอยางระมัดระวัง"
 wuw_GER_monroe.2.a: "เราจะปกปองทุกประเทศที่ไมไดตอตานเรา!"
 wuw_GER_monroe.2.a_tt: "§Yลัทธิมอนโร§!จะถูกนําออกจากทุกประเทศที่ยังมีอยู รับประกันเอกราชใหทุกประเทศที่ไมไดตอตานลัทธินี้อยางเปดเผย โดยมีคาใชจาย £GFX_pol_power §Y25 อํานาจทางการเมือง§! §Rตอประเทศที่ไดรับการรับประกัน§!!\n\nขณะนี้มี §Y[?global.monroe_countries_in_support^num] ประเทศ§!ที่สนับสนุน และ §Y[?global.monroe_doctrine_countries_to_destabilize^num] ประเทศ§!ที่สนับสนุนลัทธินี้อยางเงียบ ๆ\n\nคาใชจายการรับประกันปจจุบันคือ £GFX_pol_power §Y[?USA.monroe_countries_all_in_support_guarantee_cost] อํานาจทางการเมือง§!"
 wuw_GER_monroe.2.b: "เรารับประกันไดเฉพาะผูที่ยังภักดีเทานั้น"
 wuw_GER_monroe.2.b_tt: "§Yลัทธิมอนโร§!จะถูกนําออกจากทุกประเทศที่ยังมีอยู รับประกันเอกราชใหทุกประเทศที่สนับสนุนลัทธินี้อยางเปดเผย โดยมีคาใชจาย £GFX_pol_power §Y25 อํานาจทางการเมือง§! §Rตอประเทศที่ไดรับการรับประกัน§!!\n\nขณะนี้มี §Y[?global.monroe_countries_in_support^num]§! ประเทศที่สนับสนุน\n\nคาใชจายการรับประกันปจจุบันคือ £GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost] อํานาจทางการเมือง§!"
 wuw_GER_monroe.2.c: "ถาพวกเขาตองการการรับประกัน ก็ควรหยุดเรื่องนี้ตั้งแตแรก"

 wuw_GER_monroe.3.t: "[FROM.GetNameDefCap] เสริมความแข็งแกรงลัทธิมอนโร"
 wuw_GER_monroe.3.desc: "ไมนาแปลกใจที่[FROM.GetNameDef]รูทันความพยายามบอนทําลายภูมิภาคของเรา ดวยการเปดแคมเปญโฆษณาชวนเชื่อ แบล็กเมล และติดสินบนครั้งใหญ ชาว[FROM.GetAdjective]ไดดึงประเทศตาง ๆ ภายใตลัทธิมอนโรมาอยูฝายตนและรวมพลังตอตานเรา ลัทธิมอนโรแข็งแกรงกวาที่เคย"
 wuw_GER_monroe.3.a: "ใหตายสิ!"

 wuw_GER_monroe.4.t: "[FROM.GetNameDefCap] เรียกรองใหเราละทิ้งลัทธิมอนโร"
 wuw_GER_monroe.4.desc: "เราไดรับสาสนที่ใชถอยคําคอนขางรุนแรงจาก[FROM.GetNameDef] พวกเขาประกาศวาลัทธิมอนโรจะพังทลาย และอีกไมนานเราจะไมอยูภายใตการคุมครองของ[USA.GetNameDef]อีกตอไป หากเรายกเลิกลัทธินี้ตอนนี้ พวกเขาเสนอการคุมครองของตนเองแทน แตยํ้าชัดเจนวาขอเสนอนี้ขึ้นอยูกับการที่เราตองลงมือเร็ว"
 wuw_GER_monroe.4.a: "[USA.GetNameDef]เคยทําอะไรใหเราบางละ?"
 wuw_GER_monroe.4.a_tt: "เราจะแสดง§Rการตอตาน§!ลัทธิมอนโรอยางเปดเผย หากลัทธินี้ยังคงอยู เราจะ§Rไมมีการรับประกัน§! §Y[USA.GetFlag][USA.GetNameDefCap]§! จะไมสามารถโนมนาวเราไดอีก"
 wuw_GER_monroe.4.b: "เราจะไมฟงคําโกหกของพวกเขา!"
 wuw_GER_monroe.4.b_tt: "เราจะปฏิเสธที่จะแสดงจุดยืนในเรื่องนี้ §Y[USA.GetNameWithFlag]§! อาจพยายามโนมนาวใหเราเขาขางพวกเขา"
 monroe_country_in_opposition_flag: "ประเทศนี้ไดแสดงจุดยืนตอตานลัทธิมอนโรไปแลว"

 wuw_GER_monroe.5.t: "[FROM.GetNameDefCap] แทรกแซงการเมือง[ROOT.GetAdjective]"
 wuw_GER_monroe.5.desc: "เราไดรับทราบวาสายลับ[FROM.GetAdjective]ในประเทศของเรากําลังพยายามมีอิทธิพลตอการเมืองของเราอยางแข็งขัน อิทธิพลนี้ไมไดรุกลํ้ามากนัก นอกจากการปลุกระดมกลุมที่มีอยูแลวและเสริมสถานะของพวกเขาในบรรยากาศทางการเมือง"
 wuw_GER_monroe.5.a: "ก็ได"
 wuw_GER_monroe.5.b: "พวกเขาไมมีสิทธิ์มายุงกับการเมืองของเรา!"

 wuw_GER_monroe.6.t: "[FROM.GetNameDefCap] เรียกรองใหเรายืนยันจุดยืนตอลัทธิมอนโร"
 wuw_GER_monroe.6.desc: "สาสนจาก[FROM.GetNameDef]เพิ่งมาถึงเรา พวกเขาเห็นสายลับ[GER.GetAdjective]เคลื่อนไหวบอนทําลายภูมิภาคเพื่อพยายามขัดขวางและลมลัทธิมอนโรในที่สุด และตอนนี้ตองการตรวจสอบความภักดีของเราตอลัทธินี้"
 wuw_GER_monroe.6.a: "เราจะสนับสนุนลัทธินี้เชนเดิม"
 wuw_GER_monroe.6.a_tt: "เราจะแสดง§Gการสนับสนุน§!ลัทธิมอนโรอยางเปดเผย หากลัทธินี้พังทลาย เรายังมีโอกาสไดรับ§Gการรับประกัน§!จาก[FROM.GetNameDef] §Y[GER.GetFlag][GER.GetNameDefCap]§! จะไมสามารถโนมนาวเราไดอีก"
 wuw_GER_monroe.6.b: "เราจะไมผูกมัดตัวเอง"
 wuw_GER_monroe.6.b_tt: "เราจะปฏิเสธที่จะแสดงจุดยืนในเรื่องนี้ §Y[GER.GetNameWithFlag]§! อาจพยายามโนมนาวใหเราเขาขางพวกเขา"
 monroe_country_in_support_flag: "ประเทศนี้ไดแสดงจุดยืนสนับสนุนลัทธิมอนโรไปแลว"

 wuw_GER_monroe.7.t: "คําขาดของ[FROM.GetAdjective]"
 wuw_GER_monroe.7.desc: "สาสนที่ใชถอยคํารุนแรงจาก[FROM.GetAdjective]มาถึงเรา พวกเขาอางวาความพยายามบอนทําลายลัทธิมอนโรประสบความสําเร็จ และเปนเพียงเรื่องของเวลากอนที่[USA.GetNameDef]จะรื้อถอนลัทธินี้อยางเปนทางการ ดวยความตองการใหโอกาสเราละทิ้งลัทธินี้และหลีกเลี่ยงความโกรธเกรี้ยวของพวกเขา จึงใหโอกาสสุดทายนี้แกเราในการตอตานลัทธินี้"
 wuw_GER_monroe.7.a: "ละทิ้งมันเสีย เพื่อหลีกเลี่ยงความโกรธเกรี้ยวของ[FROM.GetAdjective]!"
 wuw_GER_monroe.7.b: "เราจะไมยอมถูกขมขู!"

 wuw_GER_monroe.8.t: "[FROM.GetNameDefCap] ยืนกรานในลัทธิมอนโร"
 wuw_GER_monroe.8.desc: "[FROM.GetLeader] ผูนํา[FROM.GetAdjective] ไดติดตอเรามาเปนการสวนตัว [FROM.GetLeader.GetSheHeCap] เตือนเราวาลัทธิมอนโรยังคงอยู แม[GER.GetAdjective]จะพยายามบอนทําลาย พวกเขายํ้าวาเราไดรับการคุมครองจากพวกเขามาตลอด และสิ่งนี้มาพรอมความรับผิดชอบที่ตองธํารงลัทธินี้รวมกับพวกเขา"
 wuw_GER_monroe.8.a: "กลับไปยึดถือลัทธินี้"
 wuw_GER_monroe.8.b: "เราไมเคยขอลัทธิมอนโรตั้งแตแรก!"
 wuw_GER_monroe.8.c: "แนนอน เราแครอใหพายุผานไปเทานั้น"

 wuw_GER_monroe.9.t: "[FROM.GetNameDefCap] รื้อถอนลัทธิมอนโร"
 wuw_GER_monroe.9.desc: "ความพยายามของเราไดผลในที่สุด [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] เพิ่งประกาศรื้อถอนลัทธิมอนโร แนนอนวา[FROM.GetLeader.GetSheHe]พูดถึงเรื่องนี้ราวกับเปนสิ่งเลวราย แตเรารูดีวาประเทศที่เคยอยูภายใตลัทธินี้จะยินดีกับพัฒนาการนี้"
 wuw_GER_monroe.9.a: "วิเศษไปเลย!"

 wuw_GER_monroe.10.t: "[FROM.GetNameDefCap] รื้อถอนลัทธิมอนโรบางสวน"
 wuw_GER_monroe.10.desc: "ความพยายามของเราไดผลในที่สุด [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] เพิ่งประกาศรื้อถอนลัทธิมอนโร แตเพียงบางสวน [FROM.GetLeader.GetSheHe]กลาวตอวาพวกเขาตั้งใจจะรับประกันเอกราชของทุกประเทศที่ไมไดลุกขึ้นตอตาน เพราะเชื่อวานั่นคือการตัดสินใจที่ถูกตอง สิ่งนี้อาจขัดขวางความคืบหนาของเราในภูมิภาค แตเรายอมเอาชนะไดเชนกัน"
 wuw_GER_monroe.10.a: "เดินหนาตอไป"

 wuw_GER_monroe.11.t: "[FROM.GetNameDefCap] รื้อถอนลัทธิมอนโรบางสวน"
 wuw_GER_monroe.11.desc: "ความพยายามของเราไดผลในที่สุด [FROM.GetLeader] ผูนําของ[FROM.GetNameDef] เพิ่งประกาศรื้อถอนลัทธิมอนโร แตเพียงบางสวน [FROM.GetLeader.GetSheHe]กลาวตอวาพวกเขาตั้งใจจะรับประกันเอกราชของผูที่ยังสนับสนุนลัทธิมอนโร แมตอนนี้จะมีจํานวนนอยลง แตพวกเขาอางวายังแข็งแกรงเหมือนเดิม สิ่งนี้อาจขัดขวางความคืบหนาของเราในภูมิภาค แตก็ไมไดเปนอุปสรรคสําคัญ เรายอมเอาชนะไดเชนกัน"
 wuw_GER_monroe.11.a: "เดินหนาตอไป"

 wuw_GER_monroe.12.t: "สงครามระหวาง[USA.GetNameDef]และ[GER.GetNameDef]ยุติขอพิพาทเรื่องลัทธิมอนโร"
 wuw_GER_monroe.12.desc: "ขอพิพาทระดับตํ่าและความรุนแรงตํ่าเรื่องลัทธิมอนโรไดจางหายไป หลังจากสองประเทศของเราจมอยูในสงคราม การทูตและปฏิบัติการลับในตางแดนดูไรความหมายเกินไป แมแตสําหรับนักการเมืองที่อยูหางไกลแนวหนา เมื่อประเทศของเราปะทะกันโดยตรงยิ่งกวา"
 wuw_GER_monroe.12.a: "เราจะแกปญหานี้ดวยปนแทน!"

 wuw_GER_monroe.13.t: "มหาอํานาจตางชาติเคลื่อนไหวบอนทําลายภูมิภาค"
 wuw_GER_monroe.13.desc: "เราไดรับทราบวาผูเลนฝาย[GER.GetAdjective]แสดงความสนใจในภูมิภาคเพิ่มขึ้น รายงานของเรามีเพียงขอมูลพื้นฐาน แตดูเหมือนวามีความพยายามบอนทําลายและตอไปอาจถึงขั้นรื้อถอนลัทธิมอนโร"
 wuw_GER_monroe.13.a: "แยแลว..."

 wuw_GER_monroe_news.1.t: "การลมสลายของลัทธิมอนโร"
 wuw_GER_monroe_news.1.desc: "หลังแรงกดดันอยางหนักและความพยายามทางการทูตของ[GER.GetNameDef] สิ่งที่เรียกวาลัทธิมอนโรก็ลมสลายลง ลัทธินี้ถูกวางไวโดย[USA.GetNameDef]เพื่อปกปองทวีปอเมริกา และไดรับรองสันติภาพในทวีปไวอยางนอยในระดับหนึ่ง แรงจูงใจของชาว[GER.GetAdjective]ในการทําเชนนี้ยังไมชัดเจน"
 wuw_GER_monroe_news.1.a: "วิเศษจริง ๆ"
 wuw_GER_monroe_news.1.b: "ชางเลวราย"
 wuw_GER_monroe_news.1.c: "วันที่ยิ่งใหญ!"
 wuw_GER_monroe_news.1.d: "วันที่เลวราย!"

 GER_crushed_the_monroe_doctrine_good: "บดขยี้ลัทธิมอนโร"
 GER_crushed_the_monroe_doctrine_bad: "บดขยี้ลัทธิมอนโร"
 GER_saved_the_monroe_doctrine_bad: "เสริมความแข็งแกรงลัทธิมอนโร"
 GER_supported_the_monroe_doctrine_good: "สนับสนุนลัทธิมอนโร"
 GER_opposed_the_monroe_doctrine_good: "ตอตานลัทธิมอนโร"

 ###### OTHER GERMAN EVENTS ######
 
 germany_mefo_bills.1.t: "อนาคตของโครงการฟนฟูกําลังรบของเยอรมนี"
 germany_mefo_bills.1.desc: "ภาระทางการเงินของโครงการฟนฟูกําลังรบเสี่ยงทําใหเศรษฐกิจของเราลมสลาย หากเราตองการคงการผลิตอาวุธไวในระดับเดิม เราตองหาแหลงเงินทุนใหม หรือเปลี่ยนลําดับความสําคัญ"
 germany_mefo_bills.1.a: "การฟนฟูกําลังรบคือเปาหมายของเรามาตลอด"
 germany_mefo_bills.1.b: "โครงการนี้แพงเกินไป"
 germany_mefo_bills.2.t: "คาใชจายในการฟนฟูกําลังรบที่เพิ่มขึ้น"
 germany_mefo_bills.2.desc: "โครงการฟนฟูกําลังรบของเรา แมจะจําเปนและมีเจตนาอันสูงสง แตเริ่มสรางความกังวลแกนักเศรษฐศาสตรบางคน พวกเขากังวลวาการผลิตทางทหารจะตองใชเงินทุนมากขึ้นเรื่อย ๆ เพื่อดํารงอยู เราตองจับตาอยางใกลชิดไมใหรายจายทางทหารบานปลายจนควบคุมไมได"
 germany_mefo_bills.2.a: "ตอนนี้เรายังรับมือได"
 germany_mefo_bills.3.t: "ความกังวลเรื่องการฟนฟูกําลังรบที่เพิ่มขึ้น"
 germany_mefo_bills.3.desc: "ขณะที่ความพยายามฟนฟูกําลังรบของเราแข็งแกรงขึ้นเรื่อย ๆ ภาระในการหาเงินทุนใหโครงการก็หนักขึ้นเชนกัน ตอนนี้การผลิตทางทหารใชการเงินของชาติไปเปนจํานวนมาก ทําใหผูคนกังวลถึงเสถียรภาพของเศรษฐกิจมากขึ้นเรื่อย ๆ หากเราไมสามารถลดรายจายทางทหารได จะกระทบเศรษฐกิจของเราอยางรุนแรง"
 germany_mefo_bills.3.a: "เราตองหาแหลงเงินทุนอื่น"
 germany_mefo_bills.4.t: "การผลิตทางทหารกอวิกฤตเศรษฐกิจ"
 germany_mefo_bills.4.desc: "รายจายทางทหารพุงสูระดับที่ไมเคยมีมากอน และกระทบการเงินของเราอยางแทจริง หากไมมีเงินทุนในทันที การผลิตอาวุธของเราจะหยุดชะงัก และเศรษฐกิจโดยรวมจะตึงเครียดภายใตภาระการพยุงมันไว"
 germany_mefo_bills.4.a: "เราปลอยใหวิกฤตนี้ดําเนินตอไปไมได!"
 GER_mefo_bills_warning_tt: "§Y[GetMilitaryProductionModifierName]§! ถึง$MODIFIER_CONSUMER_GOODS_FACTOR$แลว: §Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!"

 anschluss_mefo_bills_tt: "ใชทองคําของออสเตรียเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"
 end_of_czechoslovakia_mefo_bills_tt: "ใชทองคําของเชโกสโลวาเกียเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"
 yugoslavia_mefo_bills_tt: "ใชทองคําของยูโกสลาเวียเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"
 lithuania_mefo_bills_tt: "ใชทองคําของลิทัวเนียเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"
 poland_mefo_bills_tt: "ใชทองคําของโปแลนดเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"
 generic_lower_mefo_bills_tt: "ใชทองคําที่เพิ่งยึดมาเพื่อลดตนทุนของ§Y[GetMilitaryProductionModifierName]§!\n"

 wuw_GER_military_events.2.t: "นักบินไวชีวิตลูกเรือเครื่องบินทิ้งระเบิด[USA.GetAdjective]"
 wuw_GER_military_events.2.desc: "หลังการทิ้งระเบิดอยางหนักใสอุตสาหกรรมทหารของเรา เรื่องราวที่ไมนาเปนไปไดก็ปรากฏขึ้น แมจะมีคําสั่งชัดเจนใหยิงเครื่องบินขาศึกทุกลําที่ลวงลํ้านานฟาของเราใหตก แตนักบินขับไลคนหนึ่งปฏิเสธที่จะทําเชนนั้น นักบินผูนี้ชื่อฟรันทซ ชติกเลอร พบเครื่องบินทิ้งระเบิดที่เสียหายหนักหลังการโจมตีและเลือกที่จะไมเปดฉากยิง เขาใหเหตุผลวาเครื่องบินทิ้งระเบิดที่เสียหายนั้นไมตางจากคนที่หอยรมชูชีพ และการยิงใสพวกเขาก็นารังเกียจไมแพกัน หลังจากพยายามสื่อสารกับลูกเรือใหลงจอดใน[GER.GetNameDef]และยอมจํานน หรืออยางนอยมุงหนาไปดินแดนเปนกลาง ชติกเลอรก็ลมเลิกความพยายามอันมีมนุษยธรรมนี้ และกลับคุมกันเครื่องบินขาศึกไปยังที่ปลอดภัยแทน\n\nฟรันทซ ชติกเลอร เปนนักบินที่มีพรสวรรค แตหากปลอยใหเขาทําเชนนี้ตอไป ตัวเขาและการกระทําที่ขัดคําสั่งอาจสรางปญหาใหเรา"
 wuw_GER_military_events.2.a: "เราจะไวชีวิตเขา แตเรื่องนี้ตองไมเกิดซํ้า!"
 wuw_GER_military_events.2.b: "ลงโทษเขาใหเปนเยี่ยงอยาง!"
 wuw_GER_military_events.2.c: "หามพูดถึงเรื่องนี้แมแตคําเดียว"

 wuw_GER_diplomacy.1.t: "[FROM.GetNameDefCap] เสนอความเปนหุนสวนทางการคา"
 #wuw_GER_diplomacy.1.desc - there is none - using AAT_germany.1.desc
 wuw_GER_diplomacy.1.a: "เราทั้งสองฝายจะไดประโยชนจากเรื่องนี้"
 wuw_GER_diplomacy.1.b: "ขอตกลงนี้จะเปนประโยชนแกฝายเดียวเทานั้น..."
 wuw_GER_diplomacy.2.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอทางการคาของเรา"
 wuw_GER_diplomacy.2.desc: "[FROM.GetLeader] ดูเหมือนจะเปนผูนําที่มีเหตุผลซึ่งคํานึงถึงผลประโยชนสูงสุดของประเทศ[FROM.GetLeader.GetHerHis] บังเอิญวานั่นก็เปนผลประโยชนสูงสุดของประเทศเราเชนกัน เราจะใชทรัพยากรสวนเพิ่มจาก[FROM.GetName]ใหเกิดประโยชน"
 #wuw_GER_diplomacy.2.a - there is none
 wuw_GER_diplomacy.3.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอทางการคาของเรา"
 wuw_GER_diplomacy.3.desc: "[FROM.GetLeader] ดูเหมือนจะเปนผูนําที่ไรเหตุผลและไมฉลาด ผูไมใสใจเลยวาอะไรดีที่สุดสําหรับประเทศ[FROM.GetLeader.GetHerHis] เราจะหันไปหาสิ่งที่ตองการจากที่อื่น"
 wuw_GER_diplomacy.3.a: "พวกเขาเสียเอง"
 #wuw_GER_diplomacy.10.t - using old loc
 #wuw_GER_diplomacy.10.desc - using old loc
 wuw_GER_diplomacy.10.a: "เราไมกลาปฏิเสธ...."
 wuw_GER_diplomacy.10.b: "นี่เปนสิ่งที่ยอมรับไมได!"
 wuw_GER_diplomacy.11.t: "[FROM.GetNameDefCap] ทําลายแผนของเรา"
 wuw_GER_diplomacy.11.desc: "[FROM.GetLeader] แหง[FROM.GetName] ไดแจงใหเรารูอยางไมออมคอมวา[FROM.GetLeader.GetSheHe]คิดอยางไรกับความพยายามของเราเมื่อไมนานนี้ที่จะแทรกแซงการเมืองภายในของพวกเขา ไมตองบอกก็รูวานักการทูตของเราตองเรียบเรียงขอความบางสวนใหมกอนนําเสนอตอ[ROOT.GetLeader]"
 wuw_GER_diplomacy.11.a: "ชางอวดดีนัก!"
 wuw_GER_diplomacy.20.t: "คําเชิญเขารวม[FROM.GetFactionName]"
 wuw_GER_diplomacy.20.desc: "[FROM.GetLeader] ไดสงคําเชิญเขารวม[FROM.GetFactionName]ถึง[ROOT.GetLeader]เปนการสวนตัว ผูแทนจากกองบัญชาการสูงสุด[FROM.GetAdjective]ยืนยันกับเราวา เมื่อรวมกับพันธมิตรที่ทรงพลังอยูแลวของพวกเขา เราจะพิชิตศัตรูรวมไดอยางงายดาย และรับประกันความเปนใหญของ[ROOT.GetAdjective]ในภูมิภาคของเรา"
 wuw_GER_diplomacy.20.a: "รวมกันสูชัยชนะ!"
 wuw_GER_diplomacy.20.b: "เรามีแผนอื่น"
 wuw_GER_diplomacy.21.t: "[FROM.GetNameDefCap] เขารวม[ROOT.GetFactionName]"
 wuw_GER_diplomacy.21.desc: "กองบัญชาการทหารสูงสุดของเรารวมกับนักการทูตผูเชี่ยวชาญไดโนมนาว[FROM.GetLeader]และรัฐบาล[FROM.GetAdjective]ใหผนึกกําลังกับเราเพื่อบดขยี้ศัตรูรวมไดสําเร็จ แนนอนวาเราไมไดตองการความชวยเหลือของพวกเขาจริง ๆ ในการทําลายลางศัตรู แตทหารของพวกเขาจะเปนเหยื่อกระสุนไดดี ขณะที่ทหารของเราโคนลมฝายตอตานทั้งหมด"
 wuw_GER_diplomacy.21.a: "ยินดีตอนรับสูพวกเรา!"
 wuw_GER_diplomacy.22.t: "[FROM.GetNameDefCap] ปฏิเสธคําเชิญของเรา"
 wuw_GER_diplomacy.22.desc: "แมเราจะพยายามอยางดีที่สุด และ[FROM.GetNameDef]จะไดประโยชนอยางชัดเจนจากการผนึกกําลังกัน แต[FROM.GetLeader]และรัฐบาล[FROM.GetAdjective]กลับตัดสินใจผิดพลาดที่จะปฏิเสธคําเชิญเขารวม[ROOT.GetFactionName] แนนอนวาเรื่องนี้ไมไดเปลี่ยนแปลงอะไรมากสําหรับเรา เพราะคําเชิญนี้มีไวเพื่อประโยชนของ[FROM.GetName]มากกวา"
 wuw_GER_diplomacy.22.a: "มาดูกันวาพวกเขาจะอยูลําพังไดนานแคไหน"
 wuw_GER_diplomacy.23.t: "[FROM.GetNameDefCap] ขอควบคุมอดีตอาณานิคม"
 wuw_GER_diplomacy.23.desc: "[FROM.GetLeader] ผูนํา[FROM.GetAdjective] ไดเขามาหาเราพรอมขอเสนอขอตกลงที่อยางนอยตามความเห็นของ[FROM.GetLeader.GetHerHis] เปนประโยชนรวมกัน [FROM.GetLeader.GetHerHis]ตองการอดีตอาณานิคมคืน แตเปนการตอบแทนก็เสนอขอมูลเชิงลึกเกี่ยวกับการผลิตรถถังและคํามั่นวาจะมีสันติภาพระหวางสองประเทศ"
 wuw_GER_diplomacy.23.a: "ชาว[FROM.GetADjective]ใหเหตุผลที่นาฟง"
 wuw_GER_diplomacy.23.b: "นั่นไมเปนประโยชนตอเราเลย!"
 wuw_GER_diplomacy.24.t: "ฝาย[FROM.GetAdjective]โอนอดีตอาณานิคม[ROOT.GetAdjective]ให"
 wuw_GER_diplomacy.24.desc: "เราไดรับสาสนที่นายินดียิ่งจาก[FROM.GetNameDef] พวกเขาเห็นประโยชนในขอตกลงที่เราเสนอ และไดโอนอาณานิคมเกาทั้งหมดของเราที่เคยอยูภายใตการควบคุมของพวกเขามาเปนของเราแลว"
 wuw_GER_diplomacy.24.a: "ขาวดีเยี่ยม!"
 wuw_GER_diplomacy.25.t: "ฝาย[FROM.GetAdjective]ปฏิเสธที่จะโอนอาณานิคมเกาคืนใหเรา"
 wuw_GER_diplomacy.25.desc: "เราคิดวา[FROM.GetLeader]แหง[FROM.GetNameDef]เปนคนมีเหตุผลอยางยิ่ง แตดูเหมือนเราอาจคิดผิด ชาว[FROM.GetAdjective]ดื้อดึงปฏิเสธขอตกลงที่เราเสนอ แมจะมีประโยชนชัดเจนตอพวกเขา เราคงตองอยูโดยไมมีอาณานิคมเกาของเรา"
 wuw_GER_diplomacy.25.a: "เปนการตัดสินใจที่แยของพวกเขาเอง..."
 wuw_GER_diplomacy.26.t: "ขอเสนอการวิจัยรวม"
 wuw_GER_diplomacy.26.desc: "[FROM.GetLeader] ผูนํา[FROM.GetAdjective] ไดเขามาหาเราพรอมขอเสนอความรวมมือทางวิทยาศาสตร [FROM.GetLeader.GetSheHeCap] ระบุวาเมื่อเรามีอุดมการณคลายกันแตมีจุดเนนที่แตกตางกันมากในการบริหารกองทัพเรือ จึงมีโอกาสมากมายสําหรับความรวมมือ การตกลงในสนธิสัญญานี้หมายถึงการแบงปนผลการคนพบบางสวนกับพวกเขา แตก็จะทําใหเราไดเรียนรูจากพวกเขาดวย"
 wuw_GER_diplomacy.26.a: "ฟงดูยุติธรรมดี"
 wuw_GER_diplomacy.26.b: "เราไมสนใจเรื่องนี้"
 wuw_GER_diplomacy.27.t: "[FROM.GetNameDefCap] ตกลงรวมมือวิจัย"
 wuw_GER_diplomacy.27.desc: "ผูนํา[FROM.GetAdjective]ตอบรับขอเสนอการวิจัยรวมของเราอยางดียิ่ง เมื่อแนวทางดานกองทัพเรือของเราแตกตางกันมาก พวกเขาก็เห็นคุณคาของการเรียนรูจากกันและกัน เพื่อใหเราแข็งแกรงขึ้นดวยกันยิ่งกวาเดิม"
 wuw_GER_diplomacy.27.a: "ยอดเยี่ยม!"
 wuw_GER_diplomacy.28.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอการวิจัยของเรา"
 wuw_GER_diplomacy.28.desc: "คําตอบจาก[FROM.GetNameDef]ไมเปนไปตามที่เราหวัง พวกเขาดูไมเต็มใจแบงปนผลการคนพบดานวิศวกรรมกองทัพเรือ แมเราจะเสนอขอตกลงที่เปนประโยชนอยางยิ่ง คือแบงปนผลการคนพบของเราใหพวกเขาดวย พรอมกับการปฏิเสธยังมีถอยแถลงวากองทัพเรือ[FROM.GetAdjective]เหนือกวาของเราอยางมาก และจนกวาเราจะพัฒนาเทคโนโลยีทางเรือไดอยางมีนัยสําคัญ ขอตกลงใด ๆ ในลักษณะนี้ก็ไมตองพูดถึง"
 wuw_GER_diplomacy.29.t: "พันธมิตรเกาเสนอขอตกลงการคา"
 wuw_GER_diplomacy.29.desc: "ครั้งหนึ่งเราเคยถือวา[FROM.GetNameDef] หรืออยางนอยก็รัฐกอนหนาของพวกเขา เปนพันธมิตรของเรา ในชวงไมกี่ปมานี้เราหางเหินกันไป แตดูเหมือนตอนนี้พวกเขาตองการฟนมิตรภาพ ดวยการเสนอขอตกลงการคาที่เปนประโยชนรวมกัน ชาว[FROM.GetAdjective]ไดยื่นมือมาหาเราอีกครั้ง"
 wuw_GER_diplomacy.29.a: "ไมคาดคิด แตยินดีตอนรับ!"
 wuw_GER_diplomacy.29.b: "ฟงดูนาสงสัย..."
 wuw_GER_diplomacy.30.t: "[FROM.GetAdjective]ยอมรับขอเสนอการคา"
 wuw_GER_diplomacy.30.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอขอตกลงการคาของเราในทางบวก เราเคยมีขอตกลงการคาที่เปนประโยชนอยางยิ่งกับพวกเขามากอน และ[ROOT.GetLeader]มั่นใจอยางยิ่งวาสิ่งนี้จะนําผลกําไรมหาศาลมาใหเรา"
 wuw_GER_diplomacy.30.a: "ขาวดี!"
 wuw_GER_diplomacy.31.t: "[FROM.GetAdjective]ปฏิเสธขอเสนอการคาของเรา"
 wuw_GER_diplomacy.31.desc: "แมจะมีสายสัมพันธทางประวัติศาสตรและประโยชนที่ชัดเจนตอพวกเขา แต[FROM.GetNameDef]กลับปฏิเสธขอตกลงการคาที่เราเสนอ ขอตกลงนี้จะชวยใหการคาระหวางสองประเทศเพิ่มขึ้นและกระชับมิตรภาพของเรา นาเสียดายที่ดูเหมือนชาว[FROM.GetAdjective]จะมีความคิดอื่น"
 wuw_GER_diplomacy.31.a: "พวกเขาเสียเอง"
 wuw_GER_diplomacy.32.t: "[FROM.GetAdjective]ขอกลับมาเชา[743.GetName]อีกครั้ง"
 wuw_GER_diplomacy.32.desc: "จากการเจรจาในป 1898 [743.GetName]ถูกใหเชาแกสิ่งที่ตอนนั้นเรียกวาจักรวรรดิเยอรมัน วันนี้ [FROM.GetNameDef] ผูสืบทอดของพวกเขา ไดติดตอเรามาเพื่อขอกลับมาเชาอีกครั้ง สัญญาเชาเดิมมีกําหนดถึงป 1997 แตถูกตัดสั้นลงเพราะมหาสงครามและการยึดครองของ[JAP.GetAdjective]"
 wuw_GER_diplomacy.32.a: "เราไมสนใจที่จะกลับมาใหเชาอีก"
 wuw_GER_diplomacy.32.b: "เราจะเคารพขอตกลงเดิมของเรา"
 wuw_GER_diplomacy.33.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะกลับสูขอตกลงของเรา"
 wuw_GER_diplomacy.33.desc: "ขอตกลงของเราเมื่อป 1898 นั้นชัดเจน [743.GetName]เปนของเราจนถึงป 1997 แตดูเหมือนชาว[FROM.GetAdjective]จะเกิดใจฝอ พวกเขาดูจะคิดวาเพียงเพราะสงครามนั้นและการยึดครองของ[JAP.GetAdjective]ที่ตามมา ขอตกลงของเราจึงไมมีผลอีกตอไป ขอตกลงไมไดระบุเงื่อนไขเชนนั้นไวเลย แตดูเหมือนเราจะมีทางเลือกไมมาก หากตองการ[743.GetName]คืน เราอาจตองใชมาตรการที่รุนแรงกวานี้"
 wuw_GER_diplomacy.33.a: "ชางหยาบคายนัก!"
 wuw_GER_diplomacy.34.t: "[FROM.GetNameDefCap] กลับสูสัญญาเชา[743.GetName]"
 wuw_GER_diplomacy.34.desc: "ชาว[FROM.GetAdjective]พิสูจนแลววาเปนหุนสวนที่ภักดีที่สุด เดิมเราลงนามสัญญาเชา[743.GetName] 99 ปไวเมื่อป 1898 แตสัญญาเชาถูกขัดจังหวะเมื่อมหาสงครามโหมกระหนํ่าไปทั่วโลก หลังถูก[JAP.GetNameDef]ยึดครองชวงหนึ่ง ดินแดนนี้ก็ถูกคืนให[FROM.GetNameDef] แตโชคดีที่พวกเขาจะเคารพขอตกลงของเรา"
 wuw_GER_diplomacy.34.a: "ขาวดีเยี่ยม!"
 wuw_GER_diplomacy.35.t: "[FROM.GetNameDefCap] ขอควบคุมอดีตอาณานิคม"
 wuw_GER_diplomacy.35.desc: "เราไดรับขาวจาก[FROM.GetLeder] ผูนํา[FROM.GetAdjective] วา[FROM.GetLeader.GetSheHe]ตองการควบคุมอดีตอาณานิคมของพวกเขาที่ปจจุบันอยูในการควบคุมของเราคืน สาสนดูไมมีพิษภัยนัก แตเมื่อพิจารณาสถานการณการเมืองของ[FROM.GetNameDef]ในตอนนี้ หากเราปฏิเสธอาจเกิดผลรายแรงตามมา"
 wuw_GER_diplomacy.35.a: "ดินแดนเหลานั้นไมใชของพวกเขา!"
 wuw_GER_diplomacy.35.b: "ไมคุมที่จะเสี่ยงปฏิเสธพวกเขา!"
 wuw_GER_diplomacy.36.t: "[FROM.GetAdjective]ปฏิเสธที่จะโอนอาณานิคมของเรา"
 wuw_GER_diplomacy.36.desc: "เราคิดวาเราไดแจง[FROM.GetNameDef]ชัดเจนแลววาการโอนอาณานิคมอันชอบธรรมของเราไมใชทางเลือก แตพวกเขาก็ยังดื้อดึงไมยอมทําสิ่งที่ถูกตองและดีที่สุดสําหรับตนเอง เรายังคงอางสิทธิ์เหนือดินแดนนี้ และพวกเขาไมมีสิทธิ์มาขวางทางเรา!"
 wuw_GER_diplomacy.36.a: "ดินแดนเหลานั้นเปนของเรา!"
 wuw_GER_diplomacy.37.t: "[FROM.GetNameDefCap] ยกดินแดนใหเรา"
 wuw_GER_diplomacy.37.desc: "คําขอคืนอาณานิคมของเราจาก[FROM.GetNameDef]ไดรับความเขาใจและการยินยอมจาก[FROM.GetLeader] โดยระบุวาพวกเขาใหความสําคัญกับความสัมพันธของเรามากกวาดินแดน พวกเขาจึงกรุณาโอนดินแดนที่เปนของเราโดยชอบธรรมคืนใหเราอีกครั้ง"
 wuw_GER_diplomacy.37.a: "การตัดสินใจที่ชาญฉลาด"
 wuw_GER_diplomacy.38.t: "[FROM.GetAdjective]เรียกรองดินแดน"
 wuw_GER_diplomacy.38.desc: "[GetGERAfricanColonyOverlordDesc]"
 GER_is_not_colonial_overlord_desc: "เราไดรับขอเรียกรองใหสงมอบดินแดนของเราแก[FROM.GetNameDef] ดวยเหตุผลทางประวัติศาสตร พวกเขาอางวาเปนเจาของที่ชอบธรรมของดินแดนเหลานี้ ขอเรียกรองใชถอยคําคอนขางรุนแรง แตเรายังมีชองทางตอบสนองตามวาระของเราเอง"
 GER_is_colonial_overlord_desc: "เราเกรงวาวันนี้จะมาถึง แตก็หวังวาจะไมมา [FROM.GetLeader] แหง[FROM.GetNameDef] ไดเรียกรองใหเราในฐานะรัฐในอารักขาของ[FROM.GetLeader.GetHerHis] สละเอกราชและกลายเปนสวนหนึ่งของ[FROM.GetNameDef]โดยสมบูรณ ความเห็นของเราไมมีความหมายในเรื่องนี้อีกตอไป เราทําไดเพียงยอมตาม"
 wuw_GER_diplomacy.38.a: "[GetGERAfricanColonyOverlordOption]"
 GER_is_not_colonial_overlord_option: "กันไวดีกวาแก..."
 GER_is_colonial_overlord_option: "เราก็ไปไดสวยมาพอสมควรแลว"
 wuw_GER_diplomacy.38.b: "ไมมีทางเด็ดขาด!"
 wuw_GER_diplomacy.39.t: "[FROM.GetNameDefCap] ยกดินแดนใหเรา"
 wuw_GER_diplomacy.39.desc: "ขอเรียกรองของเราตอผูนํา[FROM.GetAdjective]ไดรับการยินยอมอยางไมเต็มใจ แมพวกเขาดูไมคอยพอใจนักที่ตองสงมอบดินแดน แตความคิดของพวกเขาไมใชเรื่องที่เราตองกังวล การไดดินแดนที่เปนของเราโดยชอบธรรมตางหากที่สําคัญ"
 wuw_GER_diplomacy.39.a: "ยอดเยี่ยม!"
 wuw_GER_diplomacy.40.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองดินแดนของเรา"
 wuw_GER_diplomacy.40.desc: "แมจะกดดัน[FROM.GetLeader] ผูนํา[FROM.GetAdjective] และผูนํา[FROM.GetAdjective]คนอื่น ๆ หนักขึ้นเรื่อย ๆ แตพวกเขาก็ไมยอมขยับ เราจะไมสามารถควบคุมอาณานิคมเกาของเราที่อยูภายใตการควบคุมของพวกเขาไดอยางสันติ"
 wuw_GER_diplomacy.40.a: "เราจะหาวิธีอื่น"
 wuw_GER_diplomacy.100.t: "[FROM.GetAdjective]หยุดจายคาใชจายการยึดครอง"
 wuw_GER_diplomacy.100.desc: "เอกอัครราชทูตของ[FROM.GetName]แจงเราวาเราจะไมไดรับเงินคาใชจายการยึดครองที่ตกลงกันไวจากพวกเขาอีกตอไป"
 wuw_GER_diplomacy.100.a: "ก็ชางเถอะ"

 wuw_GER_diplomacy.50.t: "[FROM.GetNameDefCap] ตองการริเริ่มความรวมมือพัฒนากองทัพเรือ"
 wuw_GER_diplomacy.50.desc: "\nนักการทูตและวิศวกรทหารเรือของ[FROM.GetNameDef]ไดเขามาหาเราพรอมขอเสนอแปลก ๆ พวกเขาอางวาตองการเริ่มโครงการความรวมมือทางเรืออยางกวางขวาง แบงปนการพัฒนาและเทคนิคระหวางสองประเทศ สิ่งนี้อาจเปนประโยชนตอเรา แตก็เสี่ยงที่ขอมูลลับจะรั่วไหลถึงชาว[FROM.GetAdjective] เราจะวาอยางไร?"
 wuw_GER_diplomacy.50.a: "วิเศษสุด ๆ!"
 wuw_GER_diplomacy.50.b: "ไมรวมมือกับพวกเยอรมัน!"

 wuw_GER_diplomacy.51.t: "[FROM.GetNameDefCap] ยอมรับความรวมมือพัฒนากองทัพเรือ"
 wuw_GER_diplomacy.51.desc: "วันนี้[FROM.GetLeader]ไดกลาวสนับสนุนขอตกลงความรวมมือทางเรือที่เราเพิ่งเสนอไป และอางวาวิศวกรทหารเรือ[FROM.GetAdjective]กําลังเตรียมเริ่มการพัฒนาและวิจัยรวมดานเรือรบและอาวุธตั้งแตสัปดาหหนา วันนี้เปนวันที่ยิ่งใหญของ[ROOT.GetNameDef]และกองทัพเรือของเธอ!"
 wuw_GER_diplomacy.51.a: "กองทัพเรือของเราจะกลับมาแข็งแกรงอีกครั้ง"

 wuw_GER_diplomacy.52.t: "[FROM.GetNameDefCap] ปฏิเสธความรวมมือพัฒนากองทัพเรือ"
 wuw_GER_diplomacy.52.desc: "วันนี้[FROM.GetLeader]ไดกลาวคัดคานขอตกลงความรวมมือทางเรือที่เราเพิ่งเสนอไป และอางวามันเปนกลอุบายที่ชัดแจงเพื่อขโมยความลับทางวิศวกรรมของ[FROM.GetAdjective]..."
 wuw_GER_diplomacy.52.a: "การตัดสินใจที่โงเขลา"

 wuw_GER_diplomacy.53.t: "[FROM.GetNameDefCap] เสนอความเปนหุนสวนทางการคา"
 wuw_GER_diplomacy.53.desc: "นักการทูตของ[FROM.GetNameDef]ไดเขามาหาเราเรื่องขอเสนอที่ทํากําไรงาม พวกเขาตองการซื้อสิทธิ์ในแหลงทรัพยากรธรรมชาติบางแหงในอาณานิคมของเรา และเสนอความชวยเหลือดานอุตสาหกรรมเปนการตอบแทน เราควรยอมรับขอตกลงนี้หรือไม?"
 wuw_GER_diplomacy.53.a: "เราทั้งสองฝายจะไดประโยชนจากเรื่องนี้"
 wuw_GER_diplomacy.53.b: "ขอตกลงนี้จะเปนประโยชนแกฝายเดียวเทานั้น..."

 wuw_GER_diplomacy.54.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอทางการคาของเรา"
 wuw_GER_diplomacy.54.desc: "[FROM.GetLeader] ดูเหมือนจะเปนผูนําที่มีเหตุผลซึ่งคํานึงถึงผลประโยชนสูงสุดของประเทศ[FROM.GetLeader.GetHerHis] และนั่นก็บังเอิญเปนผลประโยชนสูงสุดของประเทศเราเชนกัน เราจะใชทรัพยากรสวนเพิ่มจาก[FROM.GetName]ใหเกิดประโยชน"
 wuw_GER_diplomacy.54.a: "เยี่ยมเลย!"

 wuw_GER_diplomacy.55.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอทางการคาของเรา"
 wuw_GER_diplomacy.55.desc: "[FROM.GetLeader] ดูเหมือนจะเปนผูนําที่ไรเหตุผลและไมฉลาด ผูไมใสใจเลยวาอะไรดีที่สุดสําหรับประเทศ[FROM.GetLeader.GetHerHis] เราจะหันไปหาสิ่งที่ตองการจากที่อื่น"
 wuw_GER_diplomacy.55.a: "พวกเขาเสียเอง"

 wuw_GER_diplomacy.56.t: "[FROM.GetNameDefCap] ยึดเงินในบัญชีของเรา"
 wuw_GER_diplomacy.56.desc: "เจาหนาที่และนายธนาคาร[FROM.GetAdjective]ไดตัดสิทธิ์เขาถึงบัญชีของเราในเยอรมนี และถอนเงินออกจนหมด หมายความวา[GER.GetNameDef]ไดยึดเงินสดที่เราไดจากสนธิสัญญาการคาเกิมเบิช ซึ่งเทากับทําใหสนธิสัญญาเปนโมฆะ เราไมอาจเชื่อคําพูดของพวกเขาไดอีก..."
 wuw_GER_diplomacy.56.a: "พวกเขากลาดีอยางไร!"

 wuw_GER_diplomacy.57.t: "[FROM.GetNameDefCap] เรียกรองใหคืนชเลสวิกเหนือ"
 wuw_GER_diplomacy.57.desc: "\nวาทกรรมจาก[FROM.GetLeader]และรัฐบาล[FROM.GetAdjective]เปนปฏิปกษตอเรามากขึ้นอยางมากเมื่อไมนานมานี้ โดยอางวาการลงประชามติชเลสวิกป 1920 ผิดกฎหมายและมีการฉอโกง และตอนนี้เรียกรองใหเราคืนดินแดนแกพวกเขา เรารูดีวานั่นไมจริง แตบางทีการหลีกเลี่ยงความขัดแยงโดยเปดเผยกับ[FROM.GetNameDef]อาจดีที่สุด?"
 wuw_GER_diplomacy.57.a: "เราไมตองการความขัดแยง จึงตองยอมตาม..."
 wuw_GER_diplomacy.57.b: "อยากไดก็มาเอาไปสิ!"

 wuw_GER_diplomacy.58.t: "[FROM.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 wuw_GER_diplomacy.58.desc: "[FROM.GetLeader] ประกาศวาเนื่องจากไมตองการเขาสูความขัดแยงดวยอาวุธกับเรา พวกเขาจึงเลือกคืนดินแดนที่ไดมาจากการลงประชามติชเลสวิกป 1920 ประชาชนในภูมิภาคตางปติยินดี เพราะไดกลับคืนสูออมอกอีกครั้ง"
 wuw_GER_diplomacy.58.a: "วันที่ยิ่งใหญของประชาชน[ROOT.GetAdjective]!"

 wuw_GER_diplomacy.59.t: "[FROM.GetNameDefCap] ยืนหยัดในผลประชามติชเลสวิก"
 wuw_GER_diplomacy.59.desc: "\n[FROM.GetLeader]ผูมั่นใจเกินตัวไดประกาศวาชเลสวิกเหนือเปนและจะเปนของ[FROM.GetAdjective]ตลอดไป กองทัพของ[FROM.GetNameDefCap]ไดระดมพลและกําลังเคลื่อนยายมายังชายแดนของเราอยางรวดเร็ว ดูเหมือนพวกเขากําลังเตรียมทําสงคราม เราควรตอบสนองตอการยั่วยุนี้อยางไร"
 wuw_GER_diplomacy.59.a: "ถาอยางนั้นเราจะงัดมันออกจากมือที่เย็นชืดของพวกเขาเอง!"
 wuw_GER_diplomacy.59.b: "เราไมควรยกระดับความขัดแยงจริง ๆ..."

 wuw_GER_mutual_guarantees.1.t: "[FROM.GetNameDefCap] ขอความรวมมือซึ่งกันและกัน"
 wuw_GER_mutual_guarantees.1.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดเขามาหาเราพรอมขอเสนอการรับประกันและความรวมมือซึ่งกันและกัน ขอตกลงนี้จะครอบคลุมการปกปองดินแดนของกันและกัน และอาจเติบโตเปนสิ่งที่ยิ่งใหญกวาในอนาคต เราจะวาอยางไร?"
 wuw_GER_mutual_guarantees.1.a: "เปนขอตกลงที่เปนประโยชนรวมกัน"
 wuw_GER_mutual_guarantees.1.b: "เราไมเห็นคุณคาในสนธิสัญญานี้"

 wuw_GER_mutual_guarantees.2.t: "[FROM.GetNameDefCap] ยินดีรวมมือซึ่งกันและกัน"
 wuw_GER_mutual_guarantees.2.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมรับคําขอความรวมมือและการรับประกันซึ่งกันและกันของเรา และตอนรับนักการทูตของเราดวยออมแขนที่เปดกวาง โดยกลาววาเราตองรวมมือกันเทานั้นจึงจะปกปองชาติของเราจากมหาอํานาจตางชาติที่คุกคามดุลอํานาจได"
 wuw_GER_mutual_guarantees.2.a: "ยอดเยี่ยม"

 wuw_GER_mutual_guarantees.3.t: "[FROM.GetNameDefCap] ปฏิเสธความรวมมือซึ่งกันและกัน"
 wuw_GER_mutual_guarantees.3.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดปฏิเสธคําขอสนธิสัญญาคุมครองและความรวมมือซึ่งกันและกันของเรา โดยอางวาเปนวิธีที่เราจะแทรกซึมเขาไปในใจประชาชนของพวกเขาอยางลับ ๆ เพื่อบั่นทอนพวกเขา และยังเปนกลอุบายเพื่อครอบงํารัฐของพวกเขาในทายที่สุด พวกเขาไมรูตัวเลยจริง ๆ วากําลังพลาดขอเสนออะไรไป..."
 wuw_GER_mutual_guarantees.3.a: "พวกเขากําลังทําผิดพลาดครั้งใหญ"

 wuw_GER_weltpolitik.1.t: "[FROM.GetName] ขอคืนอดีตดินแดนอาณานิคม"
 wuw_GER_weltpolitik.1.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดเขามาหาเราพรอมคําขอที่นาสนใจ พวกเขาขอใหเราคืนอดีตดินแดนอาณานิคม[FROM.GetAdjective]ให แลกกับการกระชับความสัมพันธระหวางสองประเทศและการสนับสนุนรัฐบาลของเราอยางเปนทางการในระดับโลก ดูจะเอนเอียงไปขางเดียวอยูบาง แตบางทีอาจดีที่สุดแลว?"
 wuw_GER_weltpolitik.1.a: "เพื่อมิตรของเรา อะไรก็ได"
 wuw_GER_weltpolitik.1.b: "ไม ตอนนี้มันเปนของเราแลว"

 wuw_GER_weltpolitik.2.t: "[FROM.GetNameDefCap] คืนอาณานิคมของเรา"
 wuw_GER_weltpolitik.2.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมรับคําขอคืนอดีตอาณานิคมของเรา โดยระบุวาดินแดนเหลานั้นอยูในมือเราจะดีกวา ผูคนเฉลิมฉลองกันบนทองถนน เพราะดูเหมือนจักรวรรดิอาณานิคม[ROOT.GetAdjective]จะกลับมาอยูบนแผนที่อีกครั้งในที่สุด"
 wuw_GER_weltpolitik.2.a: "เรากําลังเขาใกลยุคทองครั้งใหมอยางรวดเร็ว!"

 wuw_GER_weltpolitik.3.t: "[FROM.GetNameDefCap] ไมคืนอาณานิคมของเรา"
 wuw_GER_weltpolitik.3.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ไดปฏิเสธคําขอคืนอาณานิคมเกาของเรา โดยอางวาเปนขอตกลงที่เอนเอียงขางเดียวซึ่งพวกเขาแทบไมไดอะไรเลย"
 wuw_GER_weltpolitik.3.a: "มันไมไดถูกลิขิตมา..."

 wuw_GER_diplomacy.60.t: "[FROM.GetNameDefCap] เรียกรองชเลสวิกเหนือ"
 wuw_GER_diplomacy.60.desc: "\nวาทกรรมจาก[FROM.GetLeader]และรัฐบาล[FROM.GetAdjective]เปนปฏิปกษตอผูบริหารทองถิ่นของเราใน[912.GetName]มากขึ้น โดยอางวาชเลสวิกเหนือเปนของเยอรมันมาตลอดและจะเปนตลอดไป และตอนนี้เรียกรองใหเราคืนดินแดนแกพวกเขา เรารูดีวานั่นไมจริง แตบางทีการหลีกเลี่ยงความขัดแยงโดยเปดเผยกับ[FROM.GetNameDef]อาจดีที่สุด?"
 wuw_GER_diplomacy.60.a: "พวกเขาพูดถูก"
 wuw_GER_diplomacy.60.b: "พวกเขาเพอฝนไปหรือเปลา?"

 wuw_GER_diplomacy.61.t: "[FROM.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 wuw_GER_diplomacy.61.desc: "[FROM.GetLeader] ประกาศวาเนื่องจากไมตองการเขาสูความขัดแยงดวยอาวุธกับเรา พวกเขาจึงเลือกคืนดินแดน[912.GetName] ประชาชนในภูมิภาคตางปติยินดี เพราะไดกลับคืนสูออมอกอีกครั้ง"
 wuw_GER_diplomacy.61.a: "วันที่ยิ่งใหญของประชาชน[ROOT.GetAdjective]!"

 wuw_GER_diplomacy.62.t: "[FROM.GetNameDefCap] ยืนหยัดใน[912.GetName]"
 wuw_GER_diplomacy.62.desc: "\n[FROM.GetLeader]ผูมั่นใจเกินตัวไดประกาศวาชเลสวิกเหนือเปนและจะเปนของ[FROM.GetAdjective]ตลอดไป กองทัพของ[FROM.GetNameDefCap]ไดระดมพลและกําลังประจําการในภูมิภาคเพื่อปองปรามการรุกราน เราควรตอบสนองตอการยั่วยุนี้อยางไร?"
 wuw_GER_diplomacy.62.a: "เราจะไมประนีประนอมเรื่องเสรีภาพของประชาชนเรา!"
 wuw_GER_diplomacy.62.b: "เราไมควรยกระดับเรื่องนี้จริง ๆ..."

 wuw_GER_diplomacy.63.t: "[FROM.GetNameDefCap] ยึด[912.GetName]"
 wuw_GER_diplomacy.63.desc: "\n[FROM.GetLeader] เจาเหนือหัวของเรา ไดประกาศวาชเลสวิกเหนือเปนและจะเปนของ[FROM.GetAdjective]ตลอดไป กองทัพของ[FROM.GetNameDefCap]ไดเคลื่อนเขาสูภูมิภาค และผูบริหารทองถิ่นคนใหมของพวกเขาไดบีบบังคับนักการเมืองของเราใหลงนามรางกฎหมายใหพวกเขาเชาดินแดนนี้ไปอีก 100 ปขางหนา"
 wuw_GER_diplomacy.63.a: "นาเสียดายที่เราทําอะไรเพื่อหยุดพวกเขาไมไดมากนัก..."
 GER_seized_north_schleswig: "เยอรมนียึดชเลสวิกเหนือ"

 wuw_GER_chinese_diplomacy.1.t: "[FROM.GetNameDefCap] สงอาวุธและยุทธปจจัยมาใหเรา"
 wuw_GER_chinese_diplomacy.1.desc: "\nพันธมิตรผูยิ่งใหญของเราทางตะวันตก ชาว[FROM.GetAdjective] ไดสงอาวุธและกระสุนมาใหเราชุดหนึ่ง แตนั่นยังไมใชทั้งหมด พวกเขายังสงคณะวิศวกรและนักอุตสาหกรรมมาชวยพัฒนาการผลิตอาวุธของเราเอง เพื่อใหเศรษฐกิจการทหารของเรากลับมาเดินหนาไดอีกครั้งหลังจากตองทนอัปยศมานานหลายศตวรรษ"
 wuw_GER_chinese_diplomacy.1.a: "นี่จะมีประโยชนมากทีเดียว"

 wuw_GER_chinese_diplomacy.2.t: "[FROM.GetNameDefCap] เสนอความชวยเหลือดานอุตสาหกรรมแลกกับสิทธิ์ในทรัพยากร"
 wuw_GER_chinese_diplomacy.2.desc: "\nพันธมิตรผูยิ่งใหญของเราทางตะวันตก ชาว[FROM.GetAdjective] ไดสงคณะผูแทนมาพบเรา คณะผูแทนแจงวาพวกเขาพรอมจะลงทุนในอุตสาหกรรมของเรา โดยแลกกับสิทธิ์ในขอตกลงการคาที่ดีกวาเดิมเกี่ยวกับทรัพยากรธรรมชาติของเรา พวกเขาชางเปนมิตรที่ดีจริง ๆ"
 wuw_GER_chinese_diplomacy.2.a: "เปนมิตรที่ดีจริง ๆ"
 wuw_GER_chinese_diplomacy.2.b: "เรายกทรัพยากรธรรมชาติของเราใหไมได"

 wuw_GER_chinese_diplomacy.3.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 wuw_GER_chinese_diplomacy.3.desc: "\nคณะผูแทนของเรากลับมาพรอมขาวดียิ่ง พวกเขารายงานวารัฐบาล[FROM.GetAdjective]ยินดีอยางยิ่งที่จะลงนามในขอตกลงที่เราเสนอ และสนธิสัญญาจะมีผลทันที เราจึงไดสิทธิ์เขาถึงทรัพยากรธรรมชาติของพวกเขาสําเร็จ แลกกับตนทุนเพียงเล็กนอยในการชวยพวกเขาพัฒนาอุตสาหกรรม"
 wuw_GER_chinese_diplomacy.3.a: "ยอดเยี่ยม"

 wuw_GER_chinese_diplomacy.4.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_chinese_diplomacy.4.desc: "\nคณะผูแทนของเรากลับมาพรอมขาวที่นาผิดหวัง พวกเขารายงานวารัฐบาล[FROM.GetAdjective]ปฏิเสธที่จะลงนามในขอตกลง โดยอางวาเรากําลังพยายามเอารัดเอาเปรียบพวกเขาภายใตหนากากของความชวยเหลือดานอุตสาหกรรม"
 wuw_GER_chinese_diplomacy.4.a: "นาผิดหวังจริง ๆ"

 wuw_GER_diplomacy.64.t: "[FROM.GetNameDefCap] เสนอการคุมครองแลกกับบรรณาการ"
 wuw_GER_diplomacy.64.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ไดติดตอเรามาเพื่อเสนอการคุมครองจากภัยคุกคามทางตะวันออก อยางไรก็ตาม การคุมครองนี้ไมไดมาฟรี ๆ เพราะมีการระบุวาเราตองสงบรรณาการใหชาว[FROM.GetAdjective]หากตองการไดรับการคุมครอง"
 wuw_GER_diplomacy.64.a: "ถาตองทําเชนนั้นก็ยอม"
 wuw_GER_diplomacy.64.b: "มันแพงเกินกวาจะรับได..."

 wuw_GER_diplomacy.65.t: "[FROM.GetNameDefCap] ยอมรับเงื่อนไขของเรา"
 wuw_GER_diplomacy.65.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดตอบขอเสนอของเราแลว โดยระบุวาเพื่อใหอนาคตของ[FROM.GetAdjective]มั่นคง พวกเขาจะปฏิบัติตามเงื่อนไขของเรา และจะเริ่มชําระเงินตามที่กําหนดทันที"
 wuw_GER_diplomacy.65.a: "ทุกอยางกําลังลงตัว!"

 wuw_GER_diplomacy.66.t: "[FROM.GetNameDefCap] ปฏิเสธเงื่อนไขของเรา"
 wuw_GER_diplomacy.66.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดตอบขอเสนอของเราแลว โดยระบุวาเงื่อนไขการคุมครองของเราเขมงวดเกินไป และคาใชจายก็สูงเกินไปมาก พวกเขาดูแลตัวเองได และไมจําเปนตองพึ่งพากองทัพที่อยากเปนปรัสเซียอยางเรา"
 wuw_GER_diplomacy.66.a: "ชางเถอะ"
 wuw_GER_diplomacy.66.b: "พวกเขายังตองการการคุมครอง แมจะไมยอมจายก็ตาม!"

 wuw_GER_diplomacy.67.t: "[FROM.GetNameDefCap] เสนอสนธิสัญญาลับ"
 wuw_GER_diplomacy.67.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดติดตอเราอยางลับ ๆ เพื่อเสนอใหรวมกันแบงแยกดินแดนของเพื่อนบาน ผานสนธิสัญญาที่เราจะเขาเปนพันธมิตรกันและกําหนดเขตอิทธิพลในแถบประเทศตํ่า เราควรรับขอเสนอที่นาสงสัยนี้หรือไม?"
 wuw_GER_diplomacy.67.a: "นี่จะเปนประโยชนตอเราแนนอน"
 wuw_GER_diplomacy.67.b: "นี่มันผิดศีลธรรม!"

 wuw_GER_diplomacy.68.t: "[FROM.GetNameDefCap] ตกลงตามสนธิสัญญา"
 wuw_GER_diplomacy.68.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดตอบขอเสนอของเราแลว โดยระบุวาเพื่อรับประกันอนาคตของ[FROM.GetAdjective] พวกเขาจะตกลงตามสนธิสัญญาและกําหนดเขตอิทธิพลรวมกัน"
 wuw_GER_diplomacy.68.a: "ถึงเวลาโจมตีแลว!"
 wuw_GER_diplomacy.68.b: "ขาวดี แตเราตองอดทนรอกอน"

 wuw_GER_diplomacy.69.t: "[FROM.GetNameDefCap] ปฏิเสธสนธิสัญญา"
 wuw_GER_diplomacy.69.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดตอบขอเสนอของเราแลว โดยระบุวาการแบงแยกดินแดนเพื่อนบานและแทงขางหลังพวกเขานั้นไมใชสิ่งที่ถูกตอง และหากเราตองการเปนผูรุกรานในความขัดแยงใด ๆ ในอนาคต ก็ควรไปหาพันธมิตรที่อื่น"
 wuw_GER_diplomacy.69.a: "เราคงตองหาพันธมิตรอื่น"
 warning_they_may_instead_apporach_our_neighbor_tt: "§R[FROM.GetNameDefCap] อาจหันไปติดตอเพื่อนบานของเราแทน§!"

 wuw_GER_diplomacy.70.t: "[FROM.GetNameDefCap] แทรกแซงการเมืองของเรา"
 wuw_GER_diplomacy.70.desc: "นักโฆษณาชวนเชื่อชาว[FROM.GetAdjective]เริ่มเขามามีอิทธิพลตอประชาชนของเราและโนมนาวใหเขาขางพวกเขา โดยสัญญาวาประชาชนของเราจะมีอนาคตที่รุงโรจนหากเราเขารวมเปนพันธมิตรกับรัฐของพวกเขา เรื่องนี้ไมไดคุกคามเอกราชของเราโดยตรง แตก็เปนการกระทําที่กาวราวตอรัฐบาลปจจุบันของเราอยางแนนอน เพราะหนังสือพิมพที่เพิ่งแจกจายจํานวนมากตางพากันปาวประกาศถึงจุดออนในระบบของเรา บางทีเราอาจตองการมิตรเพิ่มอีกสักรายในโลกนี้ แมวานี่คงไมใชครั้งสุดทายที่เราจะไดยินเรื่องราวของ[FROM.GetLeader]และเหลาหมากของ[FROM.GetLeader.GetHerHis]"
 wuw_GER_diplomacy.70.a: "ไมใชความคิดที่แย เราตองการพันธมิตรเพิ่ม"
 wuw_GER_diplomacy.70.b: "ไมรวมมือกับชาว[FROM.GetAdjective] ปดปากนักโฆษณาชวนเชื่อพวกนี้ทันที!"

 wuw_GER_diplomacy.71.t: "การสถาปนาฟอลคสคอมมิสซาเรียต [ROOT.GetNonIdeologyName]"
 wuw_GER_diplomacy.71.desc: "เจาเหนือหัวของเราใน[FROM.GetNameDef]เพิ่งแจงใหเราทราบถึงการปรับโครงสรางขอตกลงปจจุบันระหวางกัน ในความพยายามที่จะรวมแรงงานทั่วทุกแหงเปนหนึ่งเดียว เราจะถูกขอใหเปดทางใหพวกเขาเขาถึงอุตสาหกรรมของเราในสัดสวนที่มากขึ้น เพื่อนําไปใชเพื่อประโยชนสูงสุดของประชาชนของเรา แมเราจะไมมีสิทธิ์มีเสียงในเรื่องนี้ แตก็ไมมีชองใหเราโอดครวญ เรารูอยูแลวตั้งแตตอนที่พวกเขายื่นมือมาชวยวานี่อาจเปนราคาที่ตองจาย"
 wuw_GER_diplomacy.71.a: "นี่เปนประโยชนสูงสุดตอประชาชนของเรา"

 wuw_GER_diplomacy.72.t: "อิทธิพลคอมมิวนิสตจาก[FROM.GetNameDef]"
 wuw_GER_diplomacy.72.desc: "เราไดรับทราบวาขณะนี้มีเครือขายชาว[FROM.GetAdjective]เคลื่อนไหวอยูในประเทศของเราเพื่อเผยแพรแนวคิดคอมมิวนิสต แมวาลําพังเรื่องนี้ดูเหมือนจะไมเปนอันตรายนัก แตโฆษณาชวนเชื่อบางสวนก็คอนขางมีลักษณะปลุกปนใหปฏิวัติ รายงานวาคนงานถูกยุยงใหรวมตัวจัดตั้งกลุมเกิดขึ้นถี่ขึ้นเรื่อย ๆ และหากดูจากประวัติศาสตรชวงที่ผานมา เราไมอาจแนใจไดวานี่ไมใชแผนการอันแยบยลของผูนํา[GER.GetAdjective]เพื่อผนวกรวมเราในทายที่สุด"
 wuw_GER_diplomacy.72.a: "เราไมมีเหตุผลที่จะไมไวใจพวกเขา"
 wuw_GER_diplomacy.72.a_tt: "§Rหากฝายสนับสนุนคอมมิวนิสตชนะสงครามกลางเมือง [FROM.GetNameWithFlag] อาจพยายามทําใหเราตกอยูใตอํานาจ!§!"
 wuw_GER_diplomacy.72.b: "เราจะไมหลงกลแน!"

 wuw_GER_diplomacy.73.t: "[FROM.GetNameDefCap] ยอมใหเราเสริมสรางแนวคิดคอมมิวนิสต"
 wuw_GER_diplomacy.73.desc: "สายลับของเราที่ปฏิบัติการใน[FROM.GetNameDef]เพื่อเสริมความแข็งแกรงใหขบวนการคอมมิวนิสตถูกผูนําของประเทศนั้นจับตาได โชคดีที่พวกเขาดูไมคอยใสใจกับจํานวนประชาชนที่สนับสนุนอุดมการณของชนชั้นกรรมาชีพซึ่งเพิ่มขึ้นเรื่อย ๆ และเราสามารถดําเนินการตอไปได"
 wuw_GER_diplomacy.73.a: "เพื่อชนชั้นกรรมาชีพ!"

 wuw_GER_diplomacy.74.t: "[FROM.GetNameDefCap] ไมอนุญาตปฏิบัติการสรางอิทธิพลทางการเมือง"
 wuw_GER_diplomacy.74.desc: "สายลับของเราที่ปฏิบัติการใน[FROM.GetNameDef]เพื่อเสริมความแข็งแกรงใหขบวนการคอมมิวนิสตถูกผูนําของประเทศนั้นจับตาได เราไดรับจดหมายอันเขมงวดจากพวกเขา เรียกรองใหเราหยุดปฏิบัติการนี้ในทันที ดูเหมือนวาการที่เราแจงใหคนงานรูถึงสิทธิของตนดวยเจตนาดี ไดเปดโปงตัวตนที่แทจริงของ[FROM.GetLeader]ในฐานะศัตรูของสามัญชน"
 wuw_GER_diplomacy.74.a: "เราตองปลดปลอยสหายชาว[FROM.GetAdjective]ของเรา!"

 wuw_GER_diplomacy.75.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 wuw_GER_diplomacy.75.desc: "หลังจากแนวคิดคอมมิวนิสตกอตัวขึ้นเรื่อย ๆ มาเปนเวลานาน ดูเหมือนวาชนชั้นกรรมาชีพ[ROOT.GetAdjective]จะเบื่อหนายกับการรอคอยการเปลี่ยนแปลงรัฐบาลอยางสันติแลว หลังการถกเถียงอยางดุเดือด การทูตดูจะลมเหลวและความขัดแยงดวยอาวุธก็ปะทุขึ้น"
 wuw_GER_diplomacy.75.a: "เพื่อชนชั้นกรรมาชีพ!"
 wuw_GER_diplomacy.75.b: "เราตองหยุดความบาบิ่นนี้!"

 wuw_GER_diplomacy.76.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมอยูใตอํานาจ"
 wuw_GER_diplomacy.76.desc: "หลังจากสงครามกลางเมืองสงบลงในที่สุด [FROM.GetNameDef] ก็กลับมาเรียกรองใหเรายอมอยูใตอํานาจของพวกเขา เราคาดไวแลววาเรื่องนี้จะเกิดขึ้น แตเลือกที่จะมองขามเพื่อแลกกับความชวยเหลือในการโคนลมรัฐบาลเดิม จนถึงตอนนี้พวกเขาก็ปฏิบัติตอเราคอนขางดี จึงยังมีความหวังวาเรื่องนี้อาจไมเลวรายนักสําหรับเรา"
 wuw_GER_diplomacy.76.a: "นี่คือราคาที่เราตองจาย"

 wuw_GER_diplomacy.77.t: "[FROM.GetNameDefCap] เรียกรองใหเราจัดการลงประชามติเพื่อเขารวมกับพวกเขา"
 wuw_GER_diplomacy.77.desc: "เพื่อนบานทางเหนือของเราไดสงขอเรียกรองใหเราจัดการลงประชามติเพื่อเขารวมกับพวกเขา โดยอางวาประชาชนของเราก็เหมือนกับประชาชนของพวกเขา และสมควรไดอยูรวมกันเปนหนึ่งเดียว พวกเขาบอกเปนนัยวาเราควรยอมอยูใตอํานาจของพวกเขา เราจะยังมีอิสระอยูบาง แตนโยบายตางประเทศและเรื่องอื่น ๆ จะถูกชาว[FROM.GetAdjective]ควบคุมและกํากับดูแล"
 wuw_GER_diplomacy.77.a: "ทําไมจะไมละ?"
 wuw_GER_diplomacy.77.b: "ไมมีทาง!"

 wuw_GER_diplomacy.78.t: "[FROM.GetNameDefCap] ยอมสวามิภักดิ์"
 wuw_GER_diplomacy.78.desc: "หลังจากฝาย[FROM.GetAdjective]ที่ตองการเขารวมกับเราไดรับชัยชนะในการลงประชามติครั้งลาสุด ผูนําของ[FROM.GetNameDef]ก็ไดตอบกลับเรามาในทางบวก นับจากนี้พวกเขาจะยอมอยูใตอํานาจของเราเพื่อประโยชนของประชาชนของเรา"
 wuw_GER_diplomacy.78.a: "เปนวันที่ควรคาแกการเฉลิมฉลอง!"

 wuw_GER_diplomacy.79.t: "ผูนํา[FROM.GetNameDefCap]ปฏิเสธที่จะเขารวมกับเรา"
 wuw_GER_diplomacy.79.desc: "คําตอบปฏิเสธจากผูนํา[FROM.GetAdjective]มาถึงเราเร็วเกินกวาที่เราจะเชื่อไดวามีการลงประชามติจริง แมจะมีสัญญาณชัดเจนวาประชาชนของพวกเขาจะมีชีวิตที่ดีกวามากภายใตการนําอันมั่นคงของเรา แต[FROM.GetLeader]กลับเลือกอํานาจของ[FROM.GetLeader.GetHerHis]เองแทนที่จะเลือกสิ่งที่ดีที่สุดใหประชาชนของ[FROM.GetLeader.GetHerHis]"
 wuw_GER_diplomacy.79.a: "เราตองปลดปลอยพวกเขา!"

 wuw_GER_diplomacy.80.t: "[FROM.GetNameDefCap] ลงทุนในอุตสาหกรรมของเรา"
 wuw_GER_diplomacy.80.desc: "รัฐบาล[FROM.GetAdjective]ไดลงทุนจํานวนมากเพื่อยกระดับอุตสาหกรรมของเราใหไดมาตรฐานเดียวกับของพวกเขา พวกเขานําเสนอวานี่เปนขอตกลงที่เปนประโยชนรวมกัน เราในฐานะประเทศจะไดอุตสาหกรรมที่พัฒนามากขึ้น และเมื่อกําลังการผลิตของเราเพิ่มขึ้น พวกเขาก็จะไดใชประโยชนจากมันดวย"
 wuw_GER_diplomacy.80.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.81.t: "การผนวกรวม[ROOT.GetNameDef]"
 wuw_GER_diplomacy.81.desc: "ชวงเวลาที่เราเปนฟอลคสคอมมิสซาเรียตไดสิ้นสุดลงแลว ผูนํา[FROM.GetAdjective]พอใจในความพยายามของเราเปนอยางยิ่ง และตอนนี้มองวาประเทศของเราเปนมากกวารัฐในอารักขา ดวยเหตุนี้ พวกเขาจึงตองการตอบแทนเราดวยการใหเราเปนสวนหนึ่งของประเทศอันยิ่งใหญของพวกเขา แทนที่จะเปนเพียงรัฐในอารักขา แนนอนวานี่หมายความวาเราจะไมมีเอกราชใด ๆ อีกตอไป แตพวกเขาใหคํามั่นวาจะดูแลประชาชนของเราเปนอยางดี"
 wuw_GER_diplomacy.81.a: "แทบไมใชรางวัลเลย แตเรามีทางเลือกอื่นหรือ?"

 wuw_GER_diplomacy.82.t: "การสนับสนุนการลุกฮือจาก[FROM.GetAdjective]"
 wuw_GER_diplomacy.82.desc: "สหายของเราใน[FROM.GetNameDef]ไดสงปนไรเฟลมาชุดหนึ่งเพื่อชวยเราตอสูกับทุนนิยมและชนชั้นกระฎมพี ความชวยเหลือนี้คงตองแลกดวยราคาบางอยางในภายหลัง แตเราเปนใครถึงจะปฏิเสธความชวยเหลือของพวกเขา?"
 wuw_GER_diplomacy.82.a: "ใชปนเหลานี้ใหคุมคา!"

 wuw_GER_diplomacy.83.t: "[GER.GetNameDefCap] เชิญเราเขารวม [GER.GetFactionName]"
 wuw_GER_diplomacy.83.desc: "หลังจากเราไดรับชัยชนะในสงครามกลางเมืองและหันมาเปนคอมมิวนิสต [GER.GetNameDef] ก็ไดยื่นมือมาหาเราดวยมิตรภาพฉันสหาย สวนการสนับสนุนที่เราไดรับจากชาว[GER.GetAdjective]มีบทบาทมากนอยเพียงใดนั้น ไมพูดถึงจะดีกวา เมื่อตอนนี้เรามีอุดมการณใกลเคียงกัน พวกเขาจึงยื่นขอเสนอนี้มา แตเรามีทางเลือกในเรื่องนี้มากแคไหนนั้นยังไมคอยชัดเจนนัก"
 wuw_GER_diplomacy.83.a: "แนนอนวาเราจะเขารวม"
 wuw_GER_diplomacy.83.b: "เราขอยืนหยัดดวยตัวเองดีกวา"

 wuw_GER_diplomacy.84.t: "[FROM.GetNameDefCap] ขอความเปนปกแผนของชนชั้นกรรมาชีพมากขึ้น"
 wuw_GER_diplomacy.84.desc: "[GetIsRootProletarianSubject]"
 GER_root_is_proletarian_subject: "เมื่อประเทศของเราไดรับการนําโดยผูแทนของคนงานและชนชั้นกรรมาชีพอยางชอบธรรมแลว ชาว[FROM.GetAdjective]ก็ไดติดตอเรามา พวกเขาพูดถึงสิ่งที่เรียกวาความเปนปกแผนของชนชั้นกรรมาชีพ และวาเราในฐานะรัฐในอารักขาของพวกเขาควรแบงอุตสาหกรรมบางสวนใหพวกเขา เพื่อตอบแทนความชวยเหลือในการสรางประเทศของเรา"
 GER_root_not_proletarian_subject: "เมื่อประเทศของเราไดรับการนําโดยผูแทนของคนงานและชนชั้นกรรมาชีพอยางชอบธรรมแลว ชาว[FROM.GetAdjective]ก็ไดติดตอเรามา พวกเขาพูดถึงความเปนปกแผนระหวางชาติคอมมิวนิสตเพื่อยกระดับชีวิตของประชาชนของเรา การเปดการคาระหวางสองประเทศอาจเปนประโยชนตอคนงานทั้งสองฝาย ขณะเดียวกันก็ยังปองกันอิทธิพลจากประเทศทุนนิยมที่จะกัดกรอนระบบการเมืองที่เราสรางขึ้นมาอยางระมัดระวัง"
 wuw_GER_diplomacy.84.a: "เราเห็นดวย ความเปนปกแผนเพื่อทุกคน!"
 wuw_GER_diplomacy.84.b: "ฟงดูเปนประโยชนกับพวกเขามากกวา"

 wuw_GER_diplomacy.85.t: "[FROM.GetNameDefCap] เรียกรองใหเราผนวกรวม"
 wuw_GER_diplomacy.85.desc: "ขอเรียกรองที่ถอยคํารุนแรงจากฝาย[FROM.GetAdjective]มาถึงเราแลว พวกเขาเห็นวาความรวมมือในปจจุบันแมจะเปนประโยชน แตก็ยังไมดีพอ ทางออกของพวกเขาคือเรียกรองใหเราผนวกรวมเขากับ[FROM.GetNameDef] แมจะไมไดกลาวถึงผลที่ตามมาหากปฏิเสธ แตก็พอเดาไดวาการปฏิเสธไมใชเรื่องที่ควรทําอยางงายดาย"
 wuw_GER_diplomacy.85.a: "เราไมมีทางเลือก"
 wuw_GER_diplomacy.85.b: "ถาตองสู เราก็จะสู!"

 wuw_GER_diplomacy.86.t: "[FROM.FROM.GetNameDefCap] สงมอบดินแดนในเขตอิทธิพลของเรา"
 wuw_GER_diplomacy.86.desc: "วันนี้เราไดรับขาวที่นายินดียิ่ง หลังจากเขาควบคุมดินแดนของ[FROM.GetAdjective]ที่อยูในเขตอิทธิพลของเรา [FROM.FROM.GetNameDef] ไดตัดสินใจทําตามขอตกลงของเรา ดินแดนภายในเขตอิทธิพลของเราไดถูกโอนมาเปนกรรมสิทธิ์ของเราแลว"
 wuw_GER_diplomacy.86.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.87.t: "เคารพเขตอิทธิพล"
 wuw_GER_diplomacy.87.desc: "ผลจากชัยชนะในสงครามครั้งลาสุด ทําใหเรามีเรื่องตองตัดสินใจ ดินแดนบางสวนที่เรายึดมาไดไมไดอยูในเขตอิทธิพลของเรา ตามขอตกลง เราตองสงมอบดินแดนเหลานี้ อยางไรก็ตาม ขอตกลงนั้นไมเคยถูกเขียนเปนลายลักษณอักษร จึงอาจโตแยงไดวามันไมมีผลผูกพัน..."
 wuw_GER_diplomacy.87.a: "เราตองเคารพขอตกลง!"
 wuw_GER_diplomacy.87.b: "เราไดดินแดนนั้นมาอยางยุติธรรม!"

 wuw_GER_diplomacy.88.t: "[FROM.GetNameDefCap] สงมอบดินแดนในเขตอิทธิพลของเรา"
 wuw_GER_diplomacy.88.desc: "วันนี้เราไดรับขาวที่นายินดียิ่ง หลังจากเขาควบคุมดินแดนของ[FROM.GetAdjective]ที่อยูในเขตอิทธิพลของเรา [FROM.FROM.GetNameDef] ไดตัดสินใจทําตามขอตกลงของเรา ดินแดนภายในเขตอิทธิพลของเราไดถูกโอนมาเปนกรรมสิทธิ์ของเราแลว"
 wuw_GER_diplomacy.88.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.89.t: "[FROM.GetNameDefCap] สถาปนาเขตอิทธิพล"
 wuw_GER_diplomacy.89.desc: "[FROM.GetNameDefCap] แจงใหเราทราบวาพวกเขาไดสถาปนาเขตอิทธิพลขึ้นแลว แมเรื่องนี้จะไมกระทบเราโดยตรงเพราะไมมีขอตกลงอยางเปนทางการ แตก็เปนสิ่งที่เราตองจับตาไว พวกเขาอาจพยายามบีบใหเรายอมรับ หรือเรียกรองดินแดนจากเราหากเราเขาควบคุมพื้นที่นั้น"
 wuw_GER_diplomacy.89.a: "ก็ได..."
 wuw_GER_diplomacy.89.b: "ยอมรับไมได"

 wuw_GER_diplomacy.90.t: "[FROM.GetNameDefCap] ขอทําสนธิสัญญาไมรุกราน"
 wuw_GER_diplomacy.90.desc: "[FROM.GetLeader] ไดติดตอเรามาพรอมคําขอ [FROM.GetLeader.GetSheHe] ตองการลงนามในสนธิสัญญาไมรุกรานซึ่งกันและกันกับเรา เพื่อตอกยํ้าวาแมเราอาจไมใชพันธมิตรกันอยางแทจริง แตก็ไมใชศัตรูกันแนนอน สนธิสัญญาเชนนี้จะจํากัดเสรีภาพในการเคลื่อนไหวของเราหากเกิดบาดหมางกับชาว[FROM.GetAdjective]ขึ้นมา แตก็มีโอกาสลดความเสี่ยงที่จะเกิดเรื่องเชนนั้นไดเชนกัน"
 wuw_GER_diplomacy.90.a: "นี่จะทําใหเราแข็งแกรงขึ้น!"
 wuw_GER_diplomacy.90.b: "เราจะผูกมัดตัวเองกับพวกเขาไมได"

 wuw_GER_diplomacy.91.t: "[FROM.GetNameDefCap] แสดงความประสงคจะเดินแนวทางเดียวกัน"
 wuw_GER_diplomacy.91.desc: "เราเพิ่งไดรับสารจากผูนํา[FROM.GetAdjective]วาพวกเขาตองการปรับแนวทางใหสอดคลองกับหลักการทางการเมืองของเรา พวกเขาหวังวานี่จะเปนรากฐานที่ดีสําหรับความรวมมือตอไปในอนาคต แตก็ยํ้าวาแผนดังกลาวไมจําเปนตองดําเนินการในตอนนี้ นี่เปนโอกาสทองที่เราจะไดมีอิทธิพลตอชนชั้นนําทางการเมืองของพวกเขา"
 wuw_GER_diplomacy.91.a: "เรารูจักคนคนหนึ่ง..."

 wuw_GER_diplomacy.92.t: "[FROM.GetNameDefCap] เห็นชอบการเดินแนวทางเดียวกันของเรา"
 wuw_GER_diplomacy.92.desc: "คําตอบจากสหายของเราใน[FROM.GetNameDef]เปนไปในทางบวก พวกเขายินดีตอนรับการที่เราปรับแนวทางใหสอดคลองกับหลักการทางการเมืองของพวกเขา และมีความหวังเชนเดียวกับเราวาจะมีความสัมพันธการทํางานที่ดีในอนาคต สวนวิธีที่ดีที่สุดในการทําเชนนั้น พวกเขามีขอเสนอที่จะทําใหการเปลี่ยนผานงายและรวดเร็วขึ้น พวกเขาแนะนําใหเราเปลี่ยนผูนําทางการเมือง แมแอนสท เทลมันนจะเปนผูนําที่มีความสามารถอยางแนนอน แตพวกเขามั่นใจวาวัลเทอร อุลบริชทจะเปนรากฐานที่ดีกวาสําหรับความรวมมือของเราในอนาคต"
 wuw_GER_diplomacy.92.a: "อุลบริชทก็มีความสามารถไมแพกัน เราจะเปลี่ยน"
 wuw_GER_diplomacy.92.b: "ไม เราจะไมยอมใหพวกเขาเขามากาวกาย!"

 wuw_GER_diplomacy.93.t: "[FROM.GetNameDef] แตงตั้งวัลเทอร อุลบริชท"
 wuw_GER_diplomacy.93.desc: "อาจนาประหลาดใจอยูบางที่ผูนํา[FROM.GetAdjective]ยินยอมเปลี่ยนตัวแอนสท เทลมันน พวกเขาดําเนินการนี้เพื่อสงเสริมความสัมพันธอันดีกับเรา และเพื่อใหแนใจวาวาระทางการเมืองของเราใกลเคียงกันมากพอที่ความรวมมือจะราบรื่นไรรอยตอ นี่ตองถือวาเปนความสําเร็จ!"
 wuw_GER_diplomacy.93.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.94.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเปลี่ยนตัวแอนสท เทลมันน"
 wuw_GER_diplomacy.94.desc: "แมขอเสนอแนะของเราจะเปนความพยายามดวยเจตนาดีที่สุดในการชวยเหลือสหายชาว[FROM.GetAdjective] แตพวกเขากลับดื้อดึงไมยอมรับฟงคําแนะนําของเรา ดูเหมือนพวกเขาจะมองวาขอเสนอนี้เปนความพยายามแทรกแซงการเมืองของพวกเขา ทั้งที่เราไมไดมีเจตนาเชนนั้นเลย"
 wuw_GER_diplomacy.94.a: "ชาว[FROM.GetAdjective]หัวรั้น..."

 wuw_GER_diplomacy.95.t: "ขอเสนอความรวมมือทางอุตสาหกรรม"
 wuw_GER_diplomacy.95.desc: "ผูนํา[FROM.GetAdjective]ไดมาพบเราพรอมขอเสนอความรวมมือทางอุตสาหกรรมระหวางสองประเทศ ขอเสนอของพวกเขาระบุรายละเอียดวาเราจะปรับปรุงและขยายกําลังอุตสาหกรรมรวมกันไดอยางไร สวนเราจะไดประโยชนจริงหรือไม หรือนี่เปนเพียงสิ่งที่เปนประโยชนตอชาว[FROM.GetAdjective]ฝายเดียว ยังตองรอดูกันตอไป"
 wuw_GER_diplomacy.95.a: "ฟงดูยุติธรรมดี"
 wuw_GER_diplomacy.95.b: "พวกเขาคงคิดวาเราโง"

 wuw_GER_diplomacy.96.t: "[FROM.GetNameDefCap] ตกลงรวมมือทางอุตสาหกรรม"
 wuw_GER_diplomacy.96.desc: "ขอเสนอความรวมมือทางอุตสาหกรรมที่เรายื่นใหชาว[FROM.GetAdjective]ไดรับการตอบรับ ในอนาคตเราจะไดรวมมือกันทั้งในการขยายและเพิ่มประสิทธิภาพใหอุตสาหกรรมของเรา"
 wuw_GER_diplomacy.96.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.97.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 wuw_GER_diplomacy.97.desc: "ขอเสนอที่เรายื่นใหชาว[FROM.GetAdjective]ถูกปดตก แมขอตกลงนี้จะเปนประโยชนอยางยิ่งทั้งตอเราและพวกเขา แตพวกเขากลับไมยอมฟงเรา แมแผนนี้จะลมเหลว แตเรายังบรรลุเปาหมายบางสวนได เรายังสามารถเพิ่มประสิทธิภาพการขยายอุตสาหกรรมไดดวยตัวเอง"
 wuw_GER_diplomacy.97.a: "ถาอยางนั้นเราจะขยายดวยตัวเอง"

 wuw_GER_diplomacy.98.t: "[FROM.GetNameDefCap] เชิญเราเขารวมโครงการแบงปนเทคโนโลยี"
 wuw_GER_diplomacy.98.desc: "สหายของเราใน[FROM.GetNameDef]เพิ่งติดตอเรามาเกี่ยวกับความเปนไปไดในการจัดตั้งโครงการรวบรวมองคความรูดานอุตสาหกรรมและการผลิตรวมกัน เราจะแบงปนความรูใหพวกเขา และพวกเขาก็จะแบงปนความรูใหเราเปนการตอบแทน ทั้งหมดนี้อาจเปนประโยชนตอคนงานและสายการผลิตของเรา"
 wuw_GER_diplomacy.98.a: "เปนโครงการที่ยอดเยี่ยม"
 wuw_GER_diplomacy.98.b: "พวกเขาไวใจไมได"

 wuw_GER_diplomacy.99.t: "[FROM.GetNameDefCap] เขารวมโครงการแบงปนเทคโนโลยี"
 wuw_GER_diplomacy.99.desc: "เปนที่นายินดีวาชาว[FROM.GetAdjective]มองเห็นประโยชนของกลุมแบงปนเทคโนโลยีที่เราเสนอ นับจากนี้เราจะเขาถึงความรูของพวกเขาได เชนเดียวกับที่พวกเขาเขาถึงความรูของเรา ผลที่ตามมาคือเรานาจะเห็นความกาวหนาครั้งใหญในดานอุตสาหกรรมและการผลิต"
 wuw_GER_diplomacy.99.a: "ยอดเยี่ยม"

 wuw_GER_diplomacy.101.t: "[FROM.GetNameDefCap] ไมเห็นชอบโครงการแบงปนเทคโนโลยี"
 wuw_GER_diplomacy.101.desc: "แมจะเห็นประโยชนชัดเจนตอทุกฝาย แต[FROM.GetNameDef]ก็ปฏิเสธที่จะเขารวมโครงการแบงปนเทคโนโลยีของเรา พวกเขาอางวาเราไวใจไมไดที่จะดูแลเทคโนโลยีของพวกเขา จึงปฏิเสธขอเสนอของเรา และขอใหเราอยาเสนอความคิดโงเขลาเชนนี้ใหพวกเขาอีก"
 wuw_GER_diplomacy.101.a: "ชาว[FROM.GetAdjective]ไรเหตุผล..."

 wuw_GER_diplomacy.102.t: "[FROM.GetNameDefCap] ตกลงทําสนธิสัญญาไมรุกราน"
 wuw_GER_diplomacy.102.desc: "คําขอทําสนธิสัญญาไมรุกรานกับ[FROM.GetNameDef]ของเราไดรับการตอบรับ นับจากนี้ทั้งสองฝายจะงดเวนการรุกรานซึ่งกันและกัน เรามั่นใจวานี่จะเปนประโยชนอยางยิ่งตอทั้งสองชาติ"
 wuw_GER_diplomacy.102.a: "ยอดเยี่ยม"

 wuw_GER_diplomacy.103.t: "[FROM.GetNameDefCap] ปฏิเสธสนธิสัญญาไมรุกราน"
 wuw_GER_diplomacy.103.desc: "แมจะเห็นประโยชนชัดเจนตอทั้งสองฝาย แต[FROM.GetNameDef]ก็ปฏิเสธสนธิสัญญาไมรุกรานที่เราเสนอ เราไมรูวาเหตุผลเบื้องหลังคืออะไร แตการปฏิเสธนี้คอนขางนากังวล เราจะจับตาพวกเขาอยางใกลชิด"
 wuw_GER_diplomacy.103.a: "นากังวล"

 wuw_GER_diplomacy.104.t: "[FROM.GetNameDefCap] ตกลงกําหนดเขตอิทธิพล"
 wuw_GER_diplomacy.104.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]วาพวกเขาเห็นชอบกับแนวคิดการกําหนดเขตอิทธิพลของเรา สิ่งนี้จะชวยปองกันการเปนปฏิปกษและลดความเสี่ยงของความขัดแยงเหนือดินแดนในพื้นที่ใกลเคียงของเรา"
 wuw_GER_diplomacy.104.a: "ยอดเยี่ยม!"

 wuw_GER_diplomacy.105.t: "[FROM.GetNameDefCap] ปฏิเสธการกําหนดเขตอิทธิพล"
 wuw_GER_diplomacy.105.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]วาพวกเขาจะไมยอมรับและไมรับรองเขตอิทธิพลของเรา สวนเขตอิทธิพลของตนเอง พวกเขาระบุวาจะกําหนดเองโดยไมใหฝายเรามีสวนเกี่ยวของ เรื่องนี้อาจกอใหเกิดความตึงเครียดในภูมิภาค"
 wuw_GER_diplomacy.105.a: "ชางไรมารยาท!"

 wuw_GER_diplomacy.107.t: "ชาว[FROM.GetAdjective]เสนออุตสาหกรรมแลกทรัพยากร"
 wuw_GER_diplomacy.107.desc: "เราไดรับขอเสนอจาก[FROM.GetNameDef] พวกเขาสนใจการคาทรัพยากรระยะยาวโดยแลกกับการยายอุตสาหกรรมบางสวนของพวกเขามา ขณะนี้พวกเขาหมายตาทรัพยากรใน[FROM.FROM.GetName] และตองการไดรับสวนแบงบางสวน"
 wuw_GER_diplomacy.107.a: "ทําไมจะไมละ?"
 wuw_GER_diplomacy.107.b: "ตอนนี้ไมใชเวลาที่เหมาะสม"
 wuw_GER_diplomacy.107.c: "ขอเสนอที่ไมยุติธรรม อยาเสนอมาอีก!"

 wuw_GER_diplomacy.108.t: "[FROM.GetAdjective]ตกลงเรื่องการยายอุตสาหกรรม"
 wuw_GER_diplomacy.108.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]เกี่ยวกับคําขอยายอุตสาหกรรมแลกกับทรัพยากรบางสวนของพวกเขา ดูเหมือนเราจะเห็นตรงกันถึงประโยชนของขอตกลงนี้ และพวกเขาก็ยินดีตกลงดวย เราจะไดรับทรัพยากรในไมชา"
 wuw_GER_diplomacy.108.a: "ยอดเยี่ยม"

 wuw_GER_diplomacy.109.t: "[FROM.GetAdjective]ปฏิเสธขอตกลงยายอุตสาหกรรม"
 wuw_GER_diplomacy.109.desc: "แมจะคอนขางเปนกลางตอขอตกลงที่เราเสนอ แตทายที่สุดชาว[FROM.GetAdjective]ก็เลือกปฏิเสธขอเสนอยายอุตสาหกรรมไปใหพวกเขาเพื่อแลกกับทรัพยากร พวกเขาอางวาตอนนี้ไมใชเวลาที่เหมาะสม ฟงดูเหมือนวาเราอาจบรรลุขอตกลงกันไดในอนาคต เมื่อความสัมพันธของเราแนนแฟนขึ้นกวานี้"
 wuw_GER_diplomacy.109.a: "ถาครั้งแรกไมสําเร็จ..."

 wuw_GER_diplomacy.110.t: "[FROM.GetAdjective]ปฏิเสธขอตกลงยายอุตสาหกรรมอยางไมไยดี"
 wuw_GER_diplomacy.110.desc: "ดูเหมือนขอตกลงอันยุติธรรมยิ่งที่เรายื่นใหชาว[FROM.GetAdjective]จะถูกปฏิเสธอยางเย็นชา ไมเพียงเทานั้น พวกเขายังแสดงออกอยางชัดเจนวาไมตองการใหเราติดตอเรื่องนี้กับพวกเขาอีก หากเราตองการทรัพยากรเหลานั้น เราอาจตองหา... วิธีอื่น"
 wuw_GER_diplomacy.110.a: "ชาว[FROM.GetAdjective]เห็นแกตัว..."
 GER_SOV_have_had_enough_tt: "§Rลบ§Yการตัดสินใจ§!ยายอุตสาหกรรมไปยัง §Y[SOV.GetNameWithFlag]§! เพื่อแลกกับทรัพยากร§!"

 wuw_GER_diplomacy.111.t: "สนธิสัญญาเพื่อการพัฒนาความสัมพันธทางเศรษฐกิจ"
 wuw_GER_diplomacy.111.desc: "นักการทูตจาก[FROM.GetNameDef]ยืนกรานใหเราลงนามในขอเสนอสนธิสัญญาเยอรมัน–โรมาเนียเพื่อการพัฒนาความสัมพันธทางเศรษฐกิจระหวางสองประเทศ พวกเขาอางวาขอตกลงนี้จะเปนประโยชนตอทั้งสองประเทศ เพราะพวกเขาตองการทรัพยากรธรรมชาติของเราสําหรับอุตสาหกรรม สวนเราจะไดราคาที่ดีกวาสําหรับอาวุธยุทโธปกรณของเยอรมัน ขอตกลงนี้ดูไมเปนประโยชนตอเราอยางที่ชาวเยอรมันอาง แตการปฏิเสธยอมทําใหพวกเขาโกรธเคืองแน..."
 wuw_GER_diplomacy.111.a: "เราไมมีทางเลือกอื่นนอกจากยอมรับ..."
 wuw_GER_diplomacy.111.b: "เรายอมรับสิ่งนี้ไมได ผลจะเปนอยางไรก็ชางมัน!"

 wuw_GER_diplomacy.112.desc: "[FROM.GetLeader] ดูเปนผูนําที่มีเหตุผลซึ่งคํานึงถึงผลประโยชนสูงสุดของประเทศของ[FROM.GetLeader.GetHerHis] บังเอิญเหลือเกินที่ขอตกลงอันไมสมดุลนี้ก็เปนผลประโยชนสูงสุดของประเทศเราดวยเชนกัน เราจะใชทรัพยากรสวนเพิ่มจาก[FROM.GetName]ใหเกิดประโยชนสูงสุด"

 wuw_GER_diplomacy.113.desc: "[FROM.GetLeader] ดูเปนผูนําที่ไรเหตุผลและไมฉลาด ไมใสใจเลยวาอะไรดีที่สุดสําหรับประเทศของ[FROM.GetLeader.GetHerHis] ประชาชน[FROM.GetAdjective]จะตองทนทุกขจากความโงเขลานี้"
 wuw_GER_diplomacy.113.b: "ถาเชนนั้นก็สงคราม!"
 wuw_GER_diplomacy.117.a: "เราไมมีหวังจะตานทานพวกเขาได..."
 wuw_GER_diplomacy.117.b: "เราจะไมมีวันยอมจํานน!"
 wuw_GER_diplomacy.118.t: "[FROM.GetNameDefCap] ยอมสวามิภักดิ์"
 wuw_GER_diplomacy.118.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ประกาศวาชาติ[FROM.GetAdjective]จะยอมอยูใตการปกครองของเรา ซึ่งเปนสิ่งที่ดีที่สุดแลว เพราะพวกเขาไมมีกําลังพอจะหยุดเรา และการสูรบมีแตจะนําความพินาศมาสูดินแดนและประชาชนของพวกเขา"
 wuw_GER_diplomacy.119.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะยอมสวามิภักดิ์"
 wuw_GER_diplomacy.119.desc: "ชาว[FROM.GetAdjective]ผูหัวรั้นปฏิเสธขอเสนอของเราที่จะรวมสองประเทศเปนหนึ่งเดียวที่แข็งแกรงกวาเดิม นี่หรือคือสิ่งตอบแทนหลังจากทุกสิ่งที่เราทําใหพวกเขา?"


 wuw_GER_weltpolitik.4.t: "[FROM.GetLeader] ตองการแบงแยกคองโก"
 wuw_GER_weltpolitik.4.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดติดตอเราเรื่องอาณานิคมของ[FROM.GetAdjective]ที่สูญเสียไป เนื่องจากพวกเขารูสึกวาถูกปลนโดยสนธิสัญญาแวรซาย ขณะนี้พวกเขาเรียกรองใหเราลงนามในสนธิสัญญากับชาติ[GER.GetAdjective]เพื่อแบงคองโกออกเปนเขตอิทธิพล และรวมกันยื่นขอเรียกรองใหดําเนินการ เราควรยอมพวกเขาและลงนามในสนธิสัญญาเชนนี้หรือไม?"
 wuw_GER_weltpolitik.4.a: "เปนขอตกลงที่เปนประโยชนรวมกัน"
 wuw_GER_weltpolitik.4.b: "เราจะไมสนับสนุนการรุกรานนี้"

 wuw_GER_weltpolitik.5.t: "[FROM.GetLeader] เรียกรองใหเรายกคองโกให"
 wuw_GER_weltpolitik.5.desc: "ในแถลงการณรวมกับ[GER.GetLeader] [FROM.GetLeader] แหง[FROM.GetNameDef] ไดติดตอเรามาเพื่อเรียกรองใหเรายกคองโกใหแกสองรัฐที่พวกเขาเปนตัวแทน เราควรสูกับพวกเขาในเรื่องนี้ หรือควรยอมแพและสงมอบคองโกใหพวกเขา?"
 wuw_GER_weltpolitik.5.a: "นาเสียดายที่เราทําอะไรไดไมมาก"
 wuw_GER_weltpolitik.5.b: "เรายอมรับสิ่งนี้ไมได"

 wuw_GER_weltpolitik.6.t: "[FROM.GetLeader] ปฏิเสธขอตกลง"
 wuw_GER_weltpolitik.6.desc: "[FROM.GetLeader] ประกาศวา[FROM.GetLeader.GetSheHe]ยืนหยัดเคียงขางพลเมืองผูกลาหาญทุกคนของ[FROM.GetNameDef] เมื่อ[FROM.GetLeader.GetSheHe]กลาววาพวกเขาจะไมสนับสนุนแนวคิดพิลึกพิลั่นของเราที่จะรวมกันแบงแยกคองโก รัฐที่ไมไดมีพรมแดนติดกับรัฐใดของเราเลย ดูเหมือนวาการตัดสินใจนี้จะเปนที่สิ้นสุดแลว"
 wuw_GER_weltpolitik.6.a: "ถาอยางนั้นทั้งหมดจะเปนของเรา!"
 wuw_GER_weltpolitik.6.b: "เราไมควรกดดันตอไป"

 wuw_GER_weltpolitik.7.t: "[BEL.GetNameDefCap] วางแผนจะสละเสรีภาพของเรา"
 wuw_GER_weltpolitik.7.desc: "[BEL.GetLeader] แหง[BEL.GetNameDef] ไดยอมจํานนตอขอเรียกรองรวมของ[GER.GetAdjective]และ[ENG.GetAdjective] และตัดสินใจยกชาติของเราใหถูกแบงกันระหวางพวกเขา ซึ่งจะเปนการยุติเอกราชใด ๆ ที่เราอาจมีอยูในปจจุบันโดยสิ้นเชิง เราควรนอนรอยอมรับชะตากรรมเชนนี้จริง ๆ หรือ?"
 wuw_GER_weltpolitik.7.a: "เราสูเรื่องนี้ไมได..."
 wuw_GER_weltpolitik.7.b: "เรายอมรับสิ่งนี้ไมได จับอาวุธขึ้นสู!"

 wuw_GER_weltpolitik.8.t: "[BEL.GetNameDefCap] จะยกคองโกให"
 wuw_GER_weltpolitik.8.desc: "[BEL.GetLeader] แหง[BEL.GetNameDef] ไดยอมตามขอเรียกรองของเรา และประกาศวาจะโอนคองโกใหเรามีผลทันที ยังไมแนชัดวาประชาชนและผูวาการในคองโกจะยอมรับเรื่องนี้หรือไม แตอยางนอยชาว[BEl.GetAdjective]ก็ยอมแลว"
 wuw_GER_weltpolitik.8.a: "สมบูรณแบบ"

 wuw_GER_weltpolitik.9.t: "[BEL.GetNameDefCap] ปฏิเสธที่จะยกคองโกให"
 wuw_GER_weltpolitik.9.desc: "[BEL.GetLeader] แหง[BEL.GetNameDef] ตัดสินใจยืนหยัดตอตานขอเรียกรองของเรา โดยประกาศวากองทัพ[BEL.GetAdjective]จะไมถอยตอหนาฝายตรงขาม และจะสูจนคนสุดทายเพื่อคองโก พวกเขาไมรูเลยวากําลังลองดีกับใคร"
 wuw_GER_weltpolitik.9.a: "ถาเชนนั้นพวกเขาจะถูกทําลาย"
 wuw_GER_weltpolitik.9.b: "ถาอยางนั้นก็ไมจําเปนตองกดดันตอ"

 wuw_GER_weltpolitik.10.t: "วิกฤตการณคองโก"
 wuw_GER_weltpolitik.10.desc: "สนธิสัญญาไดรับการลงนามอยางเปนทางการแลว และดินแดนจะตองถูกสงมอบ อยางไรก็ตาม เกิดการตอตานขึ้นในคองโก ซึ่งเปนการตอตานที่เราตองจัดการ..."
 wuw_GER_weltpolitik.10.a: "เราจะยึดมาดวยกําลัง"
 wuw_GER_weltpolitik.10.b: "วันนี้เปนวันที่ดี"

 wuw_GER_weltpolitik.11.t: "วิกฤตการณคองโก"
 wuw_GER_weltpolitik.11.desc: "ผูวาการของเราในคองโกรายงานวาพวกเขาจะไมยอมรับชะตากรรมที่เราเลือกให และจะยืนหยัดเพื่ออํานาจปกครองตนเองของ[COG.GetAdjective] เราตองบดขยี้การตอตานของพวกเขา มิฉะนั้นมันจะกลายเปนหายนะของชาติเรา หาก[ENG.GetNameDef]และ[GER.GetNameDef]มองวานี่คือการตอตานจากฝายเรา"
 wuw_GER_weltpolitik.11.a: "เราตองทําลายพวกเขาเพื่อความปลอดภัยของประชาชน!"

 wuw_GER_chinese_diplomacy.5.t: "โครงการวิจัยรวมจีน-เยอรมัน"
 wuw_GER_chinese_diplomacy.5.desc: "พันธมิตรผูยิ่งใหญของเราทางตะวันตก ชาว[FROM.GetAdjective] ไดสงคณะผูแทนมาขอใหเราเริ่มรวมมือกันพัฒนาเทคโนโลยีใหม โดยเรียกโครงการที่วางแผนไววา 'โครงการวิจัยรวมจีน-เยอรมัน' เราควรเขารวมกับพวกเขาหรือไม?"
 wuw_GER_chinese_diplomacy.5.a: "เปนโครงการที่ยอดเยี่ยม!"
 wuw_GER_chinese_diplomacy.5.b: "เราไมคิดวามันจะชวยเราได"

 wuw_GER_chinese_diplomacy.6.t: "[FROM.GetNameDefCap] ตกลงรวมมือ"
 wuw_GER_chinese_diplomacy.6.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตัดสินใจตอบรับขอเสนอของเรา และแสดงความสนใจอยางยิ่งตอโครงการวิจัยรวมจีน-เยอรมันของเรา ถึงเวลาเริ่มงานแลว!"
 wuw_GER_chinese_diplomacy.6.a: "วิเศษมาก"

 wuw_GER_chinese_diplomacy.7.t: "[FROM.GetNameDefCap] ปฏิเสธการรวมมือ"
 wuw_GER_chinese_diplomacy.7.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตัดสินใจปฏิเสธขอเสนอของเรา และอางวาพวกเขาพึ่งพาตนเองไดโดยไมตองใชเทคโนโลยีตะวันตก ก็เปนอยางนั้นแหละ..."
 wuw_GER_chinese_diplomacy.7.a: "พวกเขาไมรูวากําลังพลาดอะไรไป"

 wuw_GER_weltpolitik.12.t: "[FROM.GetName] ขอคืนดินแดนอาณานิคมเดิม"
 wuw_GER_weltpolitik.12.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ไดมาพบเราพรอมคําขอที่นาสนใจ พวกเขาขอใหเราคืนดินแดนอาณานิคมเกาของ[FROM.GetAdjective] โดยแลกกับการกระชับความสัมพันธระหวางสองประเทศ และการสนับสนุนรัฐบาลของเราอยางเปนทางการในเวทีโลก ฟงดูคอนขางไดเปรียบฝายเดียว แตบางทีนี่อาจเปนทางที่ดีที่สุด?"
 wuw_GER_weltpolitik.12.a: "ทําไดทุกอยางเพื่อมิตรของเรา"
 wuw_GER_weltpolitik.12.b: "ไม ตอนนี้มันเปนของเราแลว"

 wuw_GER_weltpolitik.13.t: "[FROM.GetNameDefCap] คืนอาณานิคมของเรา"
 wuw_GER_weltpolitik.13.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ยอมรับคําขอคืนอาณานิคมเดิมของเรา โดยระบุวาดินแดนเหลานั้นอยูในมือเราจะดีกวา ผูคนพากันเฉลิมฉลองตามทองถนน เพราะดูเหมือนวาจักรวรรดิอาณานิคม[ROOT.GetAdjective]จะกลับมาปรากฏบนแผนที่อีกครั้งในที่สุด"
 wuw_GER_weltpolitik.13.a: "จักรวรรดินิยมกลับมาแลว!"

 wuw_GER_weltpolitik.14.t: "[FROM.GetNameDefCap] ไมคืนอาณานิคมของเรา"
 wuw_GER_weltpolitik.14.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ปฏิเสธคําขอคืนอาณานิคมเกาของเรา โดยอางวาเปนขอตกลงที่ไดเปรียบฝายเดียว ซึ่งพวกเขาแทบไมไดประโยชนอะไรเลย"
 wuw_GER_weltpolitik.14.a: "มันไมใชโชคชะตา..."

 wuw_GER_weltpolitik.15.t: "[FROM.GetNameDefCap] โอนดินแดนให[GER.GetNameDefCap]"
 wuw_GER_weltpolitik.15.desc: "\n[FROM.GetLeader] แหง[FROM.GetNameDef] ไดตัดสินใจอยางพลิกความคาดหมาย โอนดินแดนอาณานิคมเกาทั้งหมดของ[GER.GetAdjective]คืนใหพวกเขา รวมถึงดินแดนที่เราถือครองอยูดวย นาเสียดายที่เราทําอะไรเพื่อหยุดการกระทําครั้งใหมนี้ไมไดมากนัก แตอยางนอยเราก็เรียกรองคาชดเชยบางอยางจากพวกเขาได"
 wuw_GER_weltpolitik.15.a: "เราขอเรียกรองคาชดเชย!"

 wuw_GER_reichskommissariats.1.t: "ผูนําแหงเบลเยียม-ฝรั่งเศสตอนเหนือ"
 wuw_GER_reichskommissariats.1.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในเบลเยียมและฝรั่งเศสตอนเหนือแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.1.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.1.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

