 wuw_GER_reichskommissariats.5.t: "ผูนําแหงออสทลันด"
 wuw_GER_reichskommissariats.5.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในออสทลันดแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.5.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.5.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.6.t: "ผูนําแหงคอเคซัส"
 wuw_GER_reichskommissariats.6.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในคอเคซัสแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.6.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.6.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.7.t: "ผูนําแหงเติรกสถาน"
 wuw_GER_reichskommissariats.7.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในเติรกสถานแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.7.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.7.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.8.t: "ผูนําแหงมอสโควี"
 wuw_GER_reichskommissariats.8.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในมอสโควีแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงขาหลวงใหญแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.8.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.8.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.9.t: "สถานะของเยอรมันลุมแมนํ้าวอลกา"
 wuw_GER_reichskommissariats.9.desc: "[ROOT.GetLeader] แสดงความตองการอยางเปดเผยที่จะเปลี่ยนนิคมชาวเยอรมันลุมแมนํ้าวอลกาใหเปนดินแดนของไรช และผนวกรวมใหมากที่สุดเทาที่จะทําได อยางไรก็ตาม ผูบริหารทองถิ่นหลายคนเห็นวาการปกครองจากรัฐที่อยูใกลกวานาจะฉลาดกวา เราควรจัดการเรื่องนี้อยางไร?"
 wuw_GER_reichskommissariats.9.a: "ควรเปลี่ยนใหเปนดินแดนไรช!"
 wuw_GER_reichskommissariats.9.b: "ควรผนวกรวมเขากับมอสโควี"
 wuw_GER_reichskommissariats.9.c: "ควรผนวกรวมเขากับเติรกสถาน"

 wuw_GER_reichskommissariats.10.t: "สถานะของเทือกเขาอูราลตอนใต"
 wuw_GER_reichskommissariats.10.desc: "เมื่อยึดเขตยุทธศาสตรอูราลตอนใตไดแลว ก็เกิดคําถามวาควรจัดการภูมิภาคนี้อยางไร บางแผนรวมพื้นที่นี้ไวในมอสโควี ขณะที่บางฝายเสนอวาอาจตั้งเปนรัฐของตนเอง หรือแมแตเปนสวนหนึ่งของเติรกสถาน เราวาอยางไร?"
 wuw_GER_reichskommissariats.10.a: "ควรตั้งเปนเขตขาหลวงใหญแหงไรชของตนเอง"
 wuw_GER_reichskommissariats.10.b: "ควรผนวกรวมเขากับมอสโควี"
 wuw_GER_reichskommissariats.10.c: "ควรผนวกรวมเขากับเติรกสถาน"

 wuw_GER_reichskommissariats.11.t: "สถานะของคาเรเลียตะวันออก"
 wuw_GER_reichskommissariats.11.desc: "เมื่อยึดเขตยุทธศาสตรคาเรเลียตะวันออกไดแลว ก็เกิดคําถามวาควรจัดการภูมิภาคนี้อยางไร บางแผนรวมพื้นที่นี้ไวในมอสโควี ขณะที่บางฝายเสนอวาอาจผนวกเขากับรัฐฟนแลนด เราวาอยางไร?"
 wuw_GER_reichskommissariats.11.a: "ฟนแลนดควรไดรับรางวัล"
 wuw_GER_reichskommissariats.11.b: "ควรผนวกรวมเขากับมอสโควี"

 wuw_GER_reichskommissariats.12.t: "ผูนําแหงเขตผูวาการใหญ"
 wuw_GER_reichskommissariats.12.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในโปแลนดตอนใตแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงผูวาการใหญ หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.12.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.12.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

 wuw_GER_reichskommissariats.13.t: "ผูนําแหงโบฮีเมีย-โมราเวีย"
 wuw_GER_reichskommissariats.13.desc: "เมื่อเราไดจัดตั้งฝายบริหารพลเรือนชุดใหมในโบฮีเมียและโมราเวียแลว เราตองตัดสินใจไมเพียงแคบทบาทของรัฐในอารักขาแหงใหม แตยังตองเลือกวาใครจะเปนผูนําประชาชนในภูมิภาคนี้ และดูแลใหนโยบายของเราถูกนําไปปฏิบัติอยางถูกตอง เราควรแตงตั้งนักการเมือง[ROOT.GetAdjective]ใหดํารงตําแหนงผูพิทักษแหงไรช หรือควรใชผูรวมมือทองถิ่น?"
 wuw_GER_reichskommissariats.13.a: "พวกเขาตองมีเจาหนาที่ชาวเยอรมัน"
 wuw_GER_reichskommissariats.13.b: "การใชผูรวมมือทองถิ่นอาจเปนทางที่ฉลาด"

