 LOW_SUPPLIES_TIPS: "การดําเนินการตอไปนี้อาจชวยแกไขสถานการณได:\n - กระจายหรือมอบหมายหนวยของคุณใหมเพื่อลดการบริโภคในพื้นที่\n\n - สรางโครงสรางพื้นฐานระดับสูงขึ้น และตรวจสอบใหแนใจวาไมมีคอขวดทางรถไฟจากเมืองหลวง\n\n - หากคุณมีรถบรรทุกเพียงพอ คุณสามารถเปลี่ยนศูนยสงกําลังในภูมิภาคเปนแบบยานยนต เพื่อเพิ่มขีดจํากัดเสบียงและพิสัย\n\nหากเสบียงในพื้นที่ถูกสงทางทะเล คุณยังสามารถ:\n - ยกระดับฐานทัพเรือในจังหวัดตนทางและปลายทาง\n\n - ตรวจสอบใหแนใจวาคุณสรางขบวนเรือลําเลียงเพียงพอ\n\n - ตรวจสอบใหแนใจวาคุณคุมกันขบวนเรือลําเลียงดวยภารกิจทางเรือ 'คุมกันขบวนเรือลําเลียง' ตลอดเสนทาง ประสิทธิภาพการสงอาจลดลงหากขบวนเรือลําเลียงถูกจม"
