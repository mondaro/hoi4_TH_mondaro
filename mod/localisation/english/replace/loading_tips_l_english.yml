l_english:
 LOADING_TIP_0: "การนั่งกอดอกอยูเฉยๆ ขณะที่คนอื่นกําลังเขียนประวัติศาสตรเปนเรื่องนาอัปยศ ใครจะชนะนั้นไมสําคัญนัก\n- เบนิโต มุสโสลินี"
 LOADING_TIP_1: "หากจะทําใหชนชาติใดยิ่งใหญ ก็จําเปนตองสงพวกเขาเขาสูสนามรบ แมจะตองเตะกนไลไปก็ตาม และนั่นคือสิ่งที่ขาจะทํา\n- เบนิโต มุสโสลินี"
 LOADING_TIP_2: "ทหารทุกนายตองรูกอนเขาสูสนามรบวา การรบเล็กๆ ที่ตนจะสูนั้นเขากับภาพรวมใหญอยางไร\n- เบอรนารด แอล. มอนตโกเมอรี"
 LOADING_TIP_3: "หากเราแพสงครามบนทองฟา เราก็แพสงคราม และจะแพอยางรวดเร็ว\n- เบอรนารด แอล. มอนตโกเมอรี"
 LOADING_TIP_4: "การไวใจผูอื่นเปนเรื่องดี แตการไมไวใจนั้นดีกวามาก\n- เบนิโต มุสโสลินี"
 LOADING_TIP_5: "ในทางปรัชญาและหลักการ ขาไมเชื่อในสันติภาพอันถาวร\n- เบนิโต มุสโสลินี"
 LOADING_TIP_6: "ยีราฟเปนสัตวไรหัวใจ"
 LOADING_TIP_7: "ตราบใดที่ยังมีชาติอธิปไตยที่ครอบครองอํานาจอันยิ่งใหญ สงครามก็ยอมหลีกเลี่ยงไมได\n- อัลเบิรต ไอนสไตน"
 LOADING_TIP_8: "ผูลงคะแนนเสียงไมไดตัดสินอะไรเลย ผูนับคะแนนตางหากที่ตัดสินทุกสิ่ง\n- โจเซฟ สตาลิน"
 LOADING_TIP_9: "ประวัติศาสตรแสดงใหเห็นวาไมมีกองทัพใดที่ไรเทียมทาน และไมเคยมีมากอน\n- โจเซฟ สตาลิน"
 LOADING_TIP_10: "สันตะปาปาหรือ! เขามีกี่กองพลกัน?\n- โจเซฟ สตาลิน"
 LOADING_TIP_11: "ความรื่นเริงคือลักษณะเดนที่สุดของสหภาพโซเวียต\n- โจเซฟ สตาลิน"
 LOADING_TIP_12: "อํานาจที่แทจริงเพียงหนึ่งเดียวมาจากปากกระบอกปนยาว\n- โจเซฟ สตาลิน"
 LOADING_TIP_13: "พันธมิตรใดที่ไมไดมีเจตนาจะทําสงคราม ยอมไรเหตุผลและไรประโยชน\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_14: "นักโกหกตัวยงก็เปนนักมายากลตัวยงเชนกัน\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_15: "หากวันนี้ขายืนอยูตรงนี้ในฐานะนักปฏิวัติ ขาก็คือนักปฏิวัติที่ตอตานการปฏิวัติ\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_16: "หากคุณโกหกเรื่องใหญพอ และพูดซํ้าบอยพอ ผูคนก็จะเชื่อ\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_17: "เยอรมนีจะตองเปนมหาอํานาจโลก หรือไมก็จะไมมีอยูเลย\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_18: "ความสําเร็จคือการกาวจากความลมเหลวหนึ่งสูอีกความลมเหลวหนึ่งโดยไมสูญเสียความกระตือรือรน\n- วินสตัน เชอรชิลล"
 LOADING_TIP_19: "หากคุณกําลังเดินผานนรก ก็จงเดินตอไป\n- วินสตัน เชอรชิลล"
 LOADING_TIP_20: "ขอโตแยงที่ดีที่สุดตอระบอบประชาธิปไตย คือการสนทนาหานาทีกับผูมีสิทธิเลือกตั้งทั่วไป\n- วินสตัน เชอรชิลล"
 LOADING_TIP_21: "ไมวาการรบในสงครามอนาคตจะเกิดขึ้นที่ใด กองกําลังยานเกราะจะมีบทบาทชี้ขาด\n- ไฮนซ กูเดเรียน"
 LOADING_TIP_22: "รถถังแพนเทอรและไทเกอรรุนใหมของเยอรมนีสามารถใชงานจนกวาจะเสียไดเลยโดยไมตองพยายามซอม เพราะมีเครื่องยนต ระบบสงกําลัง และระบบรองรับที่แย\n- กรมสรรพาวุธแหงกองทัพแดง"
 LOADING_TIP_23: "ไมเคยมีไอสารเลวคนไหนชนะสงครามดวยการตายเพื่อชาติ มันชนะดวยการทําใหไอสารเลวโงเงานาสงสารอีกฝายตายเพื่อชาติของมันตางหาก\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_24: "แผนที่ดีซึ่งลงมือทําอยางรุนแรงในตอนนี้ ดีกวาแผนที่สมบูรณแบบซึ่งลงมือทําในสัปดาหหนา\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_25: "นําขา ตามขา หรือไมก็หลีกทางไป\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_26: "ไมเคยมีใครปองกันสิ่งใดไดสําเร็จ มีเพียงการโจมตี โจมตี และโจมตีใหมากขึ้นอีก\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_27: "สงครามอาจสูกันดวยอาวุธ แตผูที่ชนะคือมนุษย จิตวิญญาณของผูที่ตามและของผูที่นําตางหากที่ควาชัยชนะมาได\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_28: "ครั้งแรกที่ผมเห็นเครื่องบินเจ็ต ผมก็ยิงมันรวงเลย\n- ชัค เยเกอร, USAAF"
 LOADING_TIP_29: "ธีโอ ไฮนริชพูด เพิ่งยิงเครื่องบินทิ้งระเบิดตกไปสองลํา กระสุนหมดแลว ผมจะพุงชน ลากอน แลวพบกันที่วัลฮัลลา!\n- ไฮนริช แอรเลอร, Luftwaffe"
 LOADING_TIP_30: "ภาวะผูนําคือการเลือกคนดี และชวยใหพวกเขาทําไดดีที่สุด\n- เชสเตอร ดับเบิลยู. นิมิตซ"
 LOADING_TIP_31: "ปฏิบัติการที่เสนอมามีแนวโนมจะสําเร็จหรือไม? อยูในขอบเขตที่ปฏิบัติไดจริงในแงของยุทธปจจัยและเสบียงหรือไม?\n- เชสเตอร ดับเบิลยู. นิมิตซ"
 LOADING_TIP_32: "ในการเตรียมการรบ ขาพบเสมอวาแผนนั้นไรประโยชน แตการวางแผนนั้นขาดไมได\n- ดไวต ดี. ไอเซนฮาวร"
 LOADING_TIP_33: "สิ่งที่สําคัญไมจําเปนตองเปนขนาดของสุนัขในการตอสู - แตเปนขนาดของใจสูในตัวสุนัข\n- ดไวต ดี. ไอเซนฮาวร"
 LOADING_TIP_34: "ไมตองสงสัยเลยวาเมื่อการอยูรอดถูกคุกคาม การตอสูระหวางผูคนยอมปะทุขึ้น และนําไปสูสงครามอันนาเศราระหวางชาติ\n- ฮิเดกิ โทโจ"
 LOADING_TIP_35: "ในการตอสูตัวตอตัว ผูชนะคือคนที่มีกระสุนเหลือในซองมากกวาอีกหนึ่งนัด\n- แอรวิน ร็อมเมิล"
 LOADING_TIP_36: "ขายอมเปนคอนดีกวาเปนทั่ง\n- แอรวิน ร็อมเมิล"
 LOADING_TIP_37: "หยาดเหงื่อชวยประหยัดเลือด เลือดชวยรักษาชีวิต แตสมองชวยรักษาไดทั้งสองอยาง\n- แอรวิน ร็อมเมิล"
 LOADING_TIP_38: "เนวิลล แชมเบอรเลนผูนาสงสารเชื่อวาเขาไวใจฮิตเลอรได เขาคิดผิด แตผมไมคิดวาผมคิดผิดเรื่องสตาลิน\n- วินสตัน เชอรชิลล หลังการประชุมยัลตา"
 LOADING_TIP_39: "ผมเชื่อวานี่คือสันติภาพสําหรับยุคสมัยของเรา\n- เนวิลล แชมเบอรเลน, ค.ศ. 1938 หลังความตกลงมิวนิก"
 LOADING_TIP_40: "ไมมีเครื่องบินทิ้งระเบิดของขาศึกลําใดบินมาถึงรูรได หากมีสักลํามาถึงรูร ขาก็ไมใชเกอริง เรียกขาวาไมเออรไดเลย\n- แฮรมันน ไมเออร"
 LOADING_TIP_41: "เราแคถีบประตูเขาไป แลวโครงสรางอันเนาเฟะทั้งหมดก็จะพังครืนลงมา\n- อดอลฟ ฮิตเลอร (กลาวถึงสหภาพโซเวียต)"
 LOADING_TIP_42: "ขาสามารถบุกตะลุยไดอยางไรขีดจํากัดในชวงหกถึงสิบสองเดือนแรกของสงครามกับสหรัฐอเมริกาและสหราชอาณาจักร หลังจากนั้น ขาไมคาดหวังวาจะประสบความสําเร็จ\n- อิโซโรกุ ยามาโมโตะ"
 LOADING_TIP_43: "หากเราเจอสนามทุนระเบิด ทหารราบของเราจะบุกโจมตีราวกับวามันไมมีอยูตรงนั้น\n- เกออรกี จูคอฟ"
 LOADING_TIP_44: "เราประเมินยักษใหญรัสเซียตํ่าเกินไป... ทุกครั้งที่กองพลนับโหลถูกทําลาย รัสเซียก็สงอีกโหลมาแทน\n- ฟรันซ ฮัลเดอร"
 LOADING_TIP_45: "NUTS!\n- แอนโทนี ซี. แมคออลิฟฟ ตอบขอเรียกรองใหยอมจํานนของเยอรมนี"
 LOADING_TIP_46: "วันนี้คือเรา พรุงนี้ก็จะเปนพวกทาน\n- จักรพรรดิไฮเล เซลาสซีที่ 1, ค.ศ. 1936"
 LOADING_TIP_47: "หามถอยแมแตกาวเดียว!\n- คําสั่งโซเวียตที่ 227"
 LOADING_TIP_48: "โทระ! โทระ! โทระ!\n- มิตสึโอะ ฟุจิดะ, 7 ธันวาคม ค.ศ. 1941"
 LOADING_TIP_49: "ไมมีใครรูจักชื่อของทาน แตวีรกรรมของทานเปนอมตะ\n- อนุสรณสถานทหารนิรนาม (มอสโก)"
 LOADING_TIP_50: "หมูเรือเฉพาะกิจที่สามสิบสี่อยูที่ไหน ยํ้า อยูที่ไหน? ทั้งโลกสงสัย\n- CINCPAC, ยุทธนาวีอาวเลยเต"
 LOADING_TIP_51: "สถานการณสงครามไดพัฒนาไปในทางที่ไมจําเปนตองเปนประโยชนตอญี่ปุน\n- จักรพรรดิฮิโระฮิโตะ, ค.ศ. 1945"
 LOADING_TIP_52: "เราควรรูดีกวานี้หลังสงครามครั้งแรก\n- แกรท ฟอน รุนทชเตดท"
 LOADING_TIP_53: "ความกวางใหญของรัสเซียกลืนกินพวกเรา\n- แกรท ฟอน รุนทชเตดท"
 LOADING_TIP_54: "ขาขอถามพวกทาน พวกทานตองการสงครามเบ็ดเสร็จหรือไม? หากจําเปน พวกทานตองการสงครามที่เบ็ดเสร็จและรุนแรงยิ่งกวาที่เราจะจินตนาการไดหรือไม?\n- โยเซฟ เกิบเบิลส"
 LOADING_TIP_55: "การโจมตีครั้งหนึ่งจากกองทัพเยอรมัน และอีกครั้งจากกองทัพโซเวียต ไดยุติผลผลิตอันนาเกลียดของแวรซายนี้ลง\n- เวียเชสลาฟ โมโลตอฟ (หลังการลมสลายของโปแลนด)"
 LOADING_TIP_56: "ขีดฆาเรือบรรทุกเครื่องบินไปหนึ่งลํา! ดิกสันถึงเรือบรรทุกเครื่องบิน: ขีดฆาไปหนึ่งลํา!\n- โรเบิรต อี. ดิกสัน, ยุทธนาวีทะเลคอรัล"
 LOADING_TIP_57: "มันนาสะพรึงกลัวไมใชหรือ? เราสองคนนายทหารแหงเสนาธิการทหารบกเยอรมัน กําลังหารือกันวาจะสังหารผูบัญชาการสูงสุดของเราอยางไรใหดีที่สุด\n- เฮนนิง ฟอน เทรสโคว"
 LOADING_TIP_58: "ฮิตเลอรคือนักบวชเดอรวิชที่กําลังรายรํา เขาตองถูกยิงทิ้ง\n- เฮนนิง ฟอน เทรสโคว"
 LOADING_TIP_59: "พวกนาซีเขาสูสงครามนี้ดวยความหลงผิดอยางไรเดียงสาวา พวกเขาจะทิ้งระเบิดใสคนอื่นทั้งหมด และจะไมมีใครทิ้งระเบิดใสพวกเขา\n- อารเธอร 'บอมเบอร' แฮรริส"
 LOADING_TIP_60: "หากฮิตเลอรบุกนรก อยางนอยผมก็จะกลาวถึงซาตานในแงดีบางในสภาสามัญ\n- วินสตัน เชอรชิลล, 21 มิถุนายน ค.ศ. 1941"
 LOADING_TIP_61: "ไอสารเลวนั่นตายแลวหรือ? นาเสียดายที่เราจับมันเปนๆ ไมได!\n- โจเซฟ สตาลิน (เมื่อไดยินขาวการฆาตัวตายของฮิตเลอร)"
 LOADING_TIP_62: "เราพายแพแลว เราถูกตีแตก เราแพการรบแลว\n- ปอล เรโน, 15 พฤษภาคม ค.ศ. 1940"
 LOADING_TIP_63: "ขาตองการแคคนตายไมกี่พันคน เพื่อที่ขาจะไดนั่งในการประชุมสันติภาพในฐานะคนที่ไดรวมรบ\n- เบนิโต มุสโสลินี"
 LOADING_TIP_64: "ฝรั่งเศสโกหกชาวโปแลนดวาจะโจมตี ทั้งที่ไมมีความคิดเชนนั้นเลย\n- เอ็ดมันด ไอรอนไซด"
 LOADING_TIP_65: "ทําไมตองตายเพื่อดานซิก?\n- คําขวัญตอตานสงครามของฝรั่งเศส, ค.ศ. 1939"
 LOADING_TIP_66: "สงครามครั้งนี้มีบางอยางที่ดูไมจริงเอาเสียเลย\n- วิลเลียม โบราห วุฒิสมาชิกสหรัฐฯ, ค.ศ. 1939"
 LOADING_TIP_67: "สวิตเซอรแลนดมีประชาชนและระบบการเมืองที่นารังเกียจและนาสมเพชที่สุด ชาวสวิสคือศัตรูคูอาฆาตของเยอรมนีใหม\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_68: "ผลแหงชัยชนะกําลังรวงหลนเขาปากเราเร็วเกินไป\n- จักรพรรดิฮิโระฮิโตะ"
 LOADING_TIP_69: "พวกทานทั้งหมดจะจบลงดวยการขัดรองเทาใหพวกเยอรมัน!\n- อิตาโล บัลโบ"
 LOADING_TIP_70: "จม เผา ยึด ทําลาย อยาใหสิ่งใดผานไปได\n- แอนดรูว คันนิงแฮม, ยุทธการตูนิเซีย"
 LOADING_TIP_71: "ผมคิดวาเราอาจกําลังไปไกลเกินไปหนึ่งสะพาน\n- เฟรเดอริก บราวนิง (กอนปฏิบัติการมารเก็ตการเดน)"
 LOADING_TIP_72: "ขอบคุณพระเจาที่มีกองทัพฝรั่งเศส\n- วินสตัน เชอรชิลล, ค.ศ. 1933"
 LOADING_TIP_73: "เมื่อคุณเห็นงูหางกระดิ่งตั้งทาจะฉก คุณไมรอใหมันฉกกอนแลวจึงบดขยี้มัน\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_74: "กฎไมจําเปนตองศักดิ์สิทธิ์ แตหลักการนั้นศักดิ์สิทธิ์\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_75: "ผูคนที่หิวโหยและตกงาน คือวัตถุดิบที่ใชสรางระบอบเผด็จการ\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_76: "คนเราตองตื่นตัวตลอดเวลาหากหวังจะมีลมหายใจตอไป ไมอยางนั้นไอลูกหมาเยอรมันสักตัวจะยองมาขางหลังแลวฟาดเขาจนตายดวยถุงเทาที่ยัดขี้ไวเต็ม\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_77: "ปอมปราการ ปนใหญ ความชวยเหลือจากตางชาติ - จะไรคา เวนแตทหารธรรมดาจะรูวา เขานั่นเองที่เปนผูปกปองประเทศของตน\n- คารล กุสตาฟ เอมิล มันเนอรไฮม"
 LOADING_TIP_78: "ฝาโคลนและเลือด สูทุงหญาเขียวขจีที่อยูเบื้องหนา\n- คําขวัญไมเปนทางการของกองพลยานเกราะแคนาดา"
 LOADING_TIP_79: "ในกองเรืออังกฤษมีความอยากรูทั่วไปวา ชาวอิตาลียังมีฝมือเทากับในสงครามครั้งกอนหรือไม หรือวาตกตํ่าลงไปบางแลว\n- วินสตัน เชอรชิลล (กลาวถึงการประกาศสงครามของอิตาลี)"
 LOADING_TIP_80: "และเราจะสูกับพวกมันดวยกนขวดเบียรแตกๆ เพราะนั่นแหละคือทั้งหมดที่เรามี!\n - วินสตัน เชอรชิลล (ทันทีหลังจากสัญญาวาจะสูในทุงนาและบนทองถนน)"
 LOADING_TIP_81: "ประสบการณแสดงใหเห็นวา การโจมตีรถถังดวยอาวุธประชิดตัวโดยทหารที่มุงมั่นมากพอ แทบจะประสบความสําเร็จเสมอ\n - คูมือตอตานรถถังของกลุมกองทัพกลางแหงเยอรมนี"
 LOADING_TIP_82: "ให DC-3 แกขาหาสิบลํา แลวญี่ปุนจะเอาถนนพมาไปก็ได\n - เจียง ไคเชก"
 LOADING_TIP_83: "การเมืองคือสงครามที่ไมหลั่งเลือด สวนสงครามคือการเมืองที่หลั่งเลือด\n - เหมา เจอตง"
 LOADING_TIP_84: "รักษาคน เสียดินแดน: ดินแดนยังยึดคืนได รักษาดินแดน เสียคน: ทั้งดินแดนและคนจะสูญสิ้น\n - เหมา เจอตง"
 LOADING_TIP_85: "ขายอมตายในหนองนํ้าของโรมาเนียอันยิ่งใหญ ดีกวาอยูในสวรรคของโรมาเนียอันเล็กกระจอยรอย\n - ยอน อันโตเนสคู"
 LOADING_TIP_86: "ผูคนไมสําคัญ สิ่งที่สําคัญคือสิ่งที่พวกเขาเปนตัวแทน\n - ยอน อันโตเนสคู"
 LOADING_TIP_87: "ในยามสงคราม ความจริงนั้นลํ้าคาเสียจนตองมีคําโกหกคอยคุมกันอยูเสมอ\n - วินสตัน เชอรชิลล"
 LOADING_TIP_88: "วันนี้เราพายแพตอกําลังเครื่องจักร แตในอนาคตเราจะเอาชนะไดดวยกําลังเครื่องจักรที่เหนือกวา ชะตากรรมของโลกขึ้นอยูกับสิ่งนี้\n - ชารล เดอ โกล"
 LOADING_TIP_89: "เสียงสะอื้นอันยาวนานของไวโอลินแหงฤดูใบไมรวง กรีดหัวใจขาดวยความเฉื่อยชาอันซํ้าซาก\n - ขอความเขารหัสของ SOE ถึงขบวนการตอตานฝรั่งเศส"
 LOADING_TIP_90: "รัฐอยางสวิตเซอรแลนด ซึ่งเปนเพียงสิวเม็ดหนึ่งบนใบหนาของยุโรป ไมอาจปลอยใหคงอยูตอไปได\n- อดอลฟ ฮิตเลอร"
 LOADING_TIP_91: "ผูที่ชนะสงครามไดดีมักไมคอยสรางสันติภาพที่ดีได และผูที่สรางสันติภาพที่ดีไดก็คงไมมีวันชนะสงคราม\n- วินสตัน เชอรชิลล"
 LOADING_TIP_92: "ผูประนีประนอมคือผูที่ปอนอาหารใหจระเข โดยหวังวามันจะกินตนเปนคนสุดทาย\n- วินสตัน เชอรชิลล"
 LOADING_TIP_93: "ใครก็ตามที่บอกวาปากกาทรงพลังกวาดาบ เห็นไดชัดวาไมเคยเจออาวุธอัตโนมัติ\n- ดักลาส แมกอาเธอร"
 LOADING_TIP_94: "ไมขาจะไดรับเหรียญตรา ก็จะถูกสงขึ้นศาลทหาร ยิง!\n- เบียรเยอร เอริกเซน"
 LOADING_TIP_95: "ในการปลุกเสือ จงใชไมยาว\n- เหมา เจอตง"
 LOADING_TIP_96: "หากทุกคนคิดเหมือนกันหมด แสดงวามีใครบางคนไมไดคิด\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_97: "เรานาจะไดใบมีดโกนพวกนั้นมาใชบางนะ ทานไรชสมารแชล\n- แอรวิน ร็อมเมิล หลังจากเกอริงอางวาชาวอเมริกันรูจักแตทําใบมีดโกน"
 LOADING_TIP_98: "ผมไมอาจคาดการณการกระทําของรัสเซียใหทานได มันคือปริศนาที่หอหุมดวยความลึกลับซึ่งซอนอยูภายในเงื่อนงํา\n- วินสตัน เชอรชิลล"
 LOADING_TIP_99: "ไมวายุทธศาสตรจะงดงามเพียงใด บางครั้งคุณก็ควรดูผลลัพธดวย\n- วินสตัน เชอรชิลล"
 LOADING_TIP_100: "นับตั้งแตสงครามอิตาลี-กรีซ ผูคนไมไดพูดวา \"ชาวกรีกสูราวกับวีรบุรุษ\" อีกตอไป แตพูดวา \"วีรบุรุษสูราวกับชาวกรีก\"\n- The Montreal Daily Star, ค.ศ. 1942"
 LOADING_TIP_101: "ความรักชาติคือการที่ความรักตอคนในชาติมาเปนอันดับแรก ชาตินิยมคือการที่ความเกลียดชังตอคนชาติอื่นมาเปนอันดับแรก\n- ชารล เดอ โกล"
 LOADING_TIP_102: "มันตองเปนสันติภาพที่ไมมีผูชนะ ชัยชนะหมายถึงสันติภาพที่ถูกบังคับยัดเยียดใหผูแพ เงื่อนไขของผูชนะที่ถูกกําหนดใหแกผูพายแพ ซึ่งจะถูกยอมรับดวยความอัปยศและทิ้งไวซึ่งความแคนเคือง\n- วูดโรว วิลสัน, ค.ศ. 1917"
 LOADING_TIP_103: "หากคุณตองการความมั่นคงปลอดภัยอยางสมบูรณ ก็จงเขาคุก ที่นั่นคุณจะไดกิน ไดเสื้อผา ไดรับการรักษาพยาบาล และอื่นๆ สิ่งเดียวที่ขาดไปคืออิสรภาพ\n- ดไวต ดี. ไอเซนฮาวร"
 LOADING_TIP_104: "กองทัพคือทีม มันอยู กิน นอน และสูในฐานะทีม เรื่องวีรบุรุษเดี่ยวๆ พวกนี้มันไรสาระทั้งเพ\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_105: "อยาบอกผูคนวาตองทําสิ่งตางๆ อยางไร จงบอกพวกเขาวาตองทําอะไร แลวพวกเขาจะทําใหคุณประหลาดใจดวยความเฉลียวฉลาด\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_106: "มนุษยทุกคนลวนหวาดกลัว ยิ่งฉลาดมากเทาไร ก็ยิ่งหวาดกลัวมากเทานั้น\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_107: "ความเมตตาของมนุษยไมเคยทําใหความอดทนของประชาชนเสรีออนแอลง หรือทําใหความแกรงของพวกเขาออนปวกเปยก ชาติไมจําเปนตองโหดรายเพื่อจะแข็งแกรง\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_108: "นักการทูตที่จริงใจก็เหมือนนํ้าที่แหงหรือเหล็กที่ทําจากไม\n- โจเซฟ สตาลิน"
 LOADING_TIP_109: "ตลอดประวัติศาสตร ความเฉื่อยชาของผูที่สามารถลงมือได และความเฉยเมยของผูที่ควรรูดีกวา คือสิ่งที่ทําใหความชั่วรายมีชัย\n- จักรพรรดิไฮเล เซลาสซีที่ 1"
 LOADING_TIP_110: "วอรซอไมไดรอคอยคําสรรเสริญอันวางเปลา คําแสดงความยอมรับ หรือคํายืนยันถึงความเห็นใจ วอรซอกําลังรอคอยอาวุธและกระสุน\n- ยูแซฟ ปวซุดสกี"
 LOADING_TIP_111: "ความโงเขลาและการปดกั้นปญญาไมเคยสรางสิ่งใดไดนอกจากฝูงทาสใหแกทรราช\n- เอมิเลียโน ซาปาตา"
 LOADING_TIP_112: "ขายอมตายทั้งที่ยืนหยัด ดีกวามีชีวิตอยูอยางคุกเขา\n- เอมิเลียโน ซาปาตา"
 LOADING_TIP_113: "สุภาพบุรุษทั้งหลาย พวกทานสูราวกับราชสีห แตถูกนําโดยลา\n- แอรวิน ร็อมเมิล กลาวแกนายทหารอังกฤษที่ถูกจับระหวางการปดลอมโทบรุก"
 LOADING_TIP_114: "ปญหาของการเลือกตั้งเสรีคือ คุณไมมีทางรูเลยวาผลจะออกมาเปนอยางไร\n- เวียเชสลาฟ โมโลตอฟ"
 LOADING_TIP_115: "ศพจะสนใจอะไรวาใครถูกใครผิด?\n- มานวยล อาซาญา"
 LOADING_TIP_116: "ภารกิจของพวกทานจะไมงาย ขาศึกไดรับการฝกมาอยางดี มียุทโธปกรณพรอม และผานศึกมาอยางโชกโชน เขาจะสูอยางดุเดือด\n- ดไวต ดี. ไอเซนฮาวร, มิถุนายน ค.ศ. 1944"
 LOADING_TIP_117: "วิธีที่เร็วที่สุดในการยุติสงครามคือการแพมัน\n- จอรจ ออรเวลล"
 LOADING_TIP_118: "เราไมตองการการโกงเลือกตั้งอีกตอไป ไมตองการคําโกหกอีก เราไมตองการใหคนที่ไมทํางานมีชีวิตอยูโดยอาศัยคนที่ทํางาน\n- ฆวน เปรอน"
 LOADING_TIP_119: "นั่นไงเรือเชียรตัวแสบ! ยิงมันเลย!\n- เฟรเดอริก เซกเกอร เบลล"
 LOADING_TIP_120: "เราตองไมยอมพายแพตอความกลัวภยันตรายที่เรากําลังเตรียมรับมือ สิ่งเดียวที่เราตองกลัวคือความกลัวนั่นเอง\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_121: "เสรีภาพของเราไดพิสูจนแลววาอยูรอดผานสงครามได แตเสรีภาพของเราจะไมมีวันอยูรอดผานการยอมจํานน\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_122: "มีเพียงความโงเขลาขั้นสุดเทานั้นที่จะทําใหใครคิดจะรุกราน ไมมีใครจะยกพลขึ้นบกที่นี่ได แมแตทหารเพียงนายเดียว\n- เบนิโต มุสโสลินี, ซิซิลี, ค.ศ. 1937"
 LOADING_TIP_123: "ขาจับอาวุธขึ้นสูกับเผด็จการในรูปของลัทธินาซีและฟาสซิสต หากขาตองตายในการตอสูกับเผด็จการรูปแบบใหม ขาก็จะยอมตาย\n- ดราจา มีไฮโลวิช"
 LOADING_TIP_124: "ขาไมรูวาสงครามโลกครั้งที่ 3 จะสูกันดวยอาวุธอะไร แตสงครามโลกครั้งที่ 4 จะสูกันดวยไมและกอนหิน\n- อัลเบิรต ไอนสไตน"
 LOADING_TIP_125: "ขาคือผูนําของประเทศหนึ่งซึ่งมีสองอักษร สามภาษา สี่ศาสนา หาเชื้อชาติ หกสาธารณรัฐ ลอมรอบดวยเพื่อนบานเจ็ดประเทศ เปนประเทศที่มีชนกลุมนอยแปดกลุมอาศัยอยู\n- โยซิป บรอซ ตีโต"
 LOADING_TIP_126: "ประวัติศาสตรในอนาคตจะตัดสินชาวเยอรมันอยางไร หากไมมีแมแตคนไมกี่คนที่กลาพอจะยุติอาชญากรผูนั้น?\n- เฮนนิง ฟอน เทรสโคว"
 LOADING_TIP_127: "บัดนี้ทั้งโลกจะประณามเรา แตขายังคงเชื่อมั่นเต็มที่วาเราไดทําสิ่งที่ถูกตอง ฮิตเลอรคือศัตรูตัวฉกาจไมเพียงของเยอรมนี แตของทั้งโลก\n- เฮนนิง ฟอน เทรสโคว"
 LOADING_TIP_128: "ขาศึกไดเริ่มใชระเบิดชนิดใหมที่โหดรายที่สุด ซึ่งมีอํานาจทําลายลางที่ประเมินคาไมได และคราชีวิตผูบริสุทธิ์ไปมากมาย\n- จักรพรรดิฮิโระฮิโตะ, ค.ศ. 1945"
 LOADING_TIP_129: "กฎขอที่ 1 ในหนาที่ 1 ของตําราสงครามคือ: \"อยาเดินทัพไปมอสโก\" หลายคนเคยลองมาแลว และมันไมไดผล\n- เบอรนารด แอล. มอนตโกเมอรี"
 LOADING_TIP_130: "คําโกหกที่วาเยอรมนีจะตะครุบออสเตรียในวันพรุงนี้หรือมะรืนนี้ กําลังถูกแพรกระจายอีกครั้ง\n- อดอลฟ ฮิตเลอร, ค.ศ. 1936"
 LOADING_TIP_131: "ทหารเยอรมันทําใหโลกตะลึง สวนทหารแบรซาลิเอรีของอิตาลีทําใหทหารเยอรมันตะลึง\n- แอรวิน ร็อมเมิล"
 LOADING_TIP_132: "นี่คือขอเรียกรองดินแดนครั้งสุดทายที่ขาจะเรียกรองในยุโรป\n- อดอลฟ ฮิตเลอร กลาวถึงซูเดเทนลันดในป ค.ศ. 1938"
 LOADING_TIP_133: "เราไมอยูในฐานะที่จะทนตอสงครามแบบตั้งรับยืดเยื้อได ไมวาฝายสัมพันธมิตรจะรวมกําลังไวที่ใด พวกเขาจะเจาะแนวผานไปได\n- แกรท ฟอน รุนทชเตดท"
 LOADING_TIP_134: "หากเราทําสงครามกับสหรัฐอเมริกา เราจะไมมีหวังชนะเลย เวนแตจะทําลายกองเรือสหรัฐฯ ในนานนํ้าฮาวายได\n- อิโซโรกุ ยามาโมโตะ, ค.ศ. 1941"
 LOADING_TIP_135: "คุณมีศัตรูหรือ? ดีแลว นั่นหมายความวาครั้งหนึ่งในชีวิต คุณเคยยืนหยัดเพื่อบางสิ่ง\n- วินสตัน เชอรชิลล"
 LOADING_TIP_136: "นี่ไมใชสันติภาพ แตเปนการสงบศึกยี่สิบป\n- แฟรดินอง ฟอช, ค.ศ. 1919"
 LOADING_TIP_137: "คุณอาจจายราคาที่สูงเกินไปได แมกระทั่งเพื่อสันติภาพ\n- ไมเคิล โจเซฟ ซาเวจ กลาวถึงนโยบายประนีประนอมของแชมเบอรเลน"
 LOADING_TIP_138: "กําลังคือภาษาเดียวที่พวกเขาเขาใจ เหมือนพวกอันธพาล\n- แฟรงคลิน ดี. โรสเวลต กลาวถึงอดอลฟ ฮิตเลอรและเบนิโต มุสโสลินี"
 LOADING_TIP_139: "มีคนกลาววา ประชาธิปไตยคือรูปแบบการปกครองที่เลวรายที่สุด ยกเวนรูปแบบอื่นๆ ทั้งหมดที่เคยลองใชกันมา\n- วินสตัน เชอรชิลล"
 LOADING_TIP_140: "โลกจะไมถูกทําลายโดยผูที่ทําชั่ว แตโดยผูที่เฝามองพวกเขาโดยไมทําอะไรเลย\n- อัลเบิรต ไอนสไตน"
 LOADING_TIP_141: "อันตรายรายแรงตอมนุษยชาติที่แฝงอยูในขอเสนอนี้ มีนํ้าหนักเหนือกวาขอไดเปรียบทางทหารใดๆ โดยสิ้นเชิง\n- โรเบิรต ออปเพนไฮเมอร กลาวถึงอาวุธเทอรโมนิวเคลียร, ค.ศ. 1949"
 LOADING_TIP_142: "เรารูวาโลกจะไมเหมือนเดิมอีกตอไป บางคนหัวเราะ บางคนรองไห คนสวนใหญเงียบงัน\n- โรเบิรต ออปเพนไฮเมอร หลังการทดสอบทรินิตี"
 LOADING_TIP_143: "บัดนี้ขาไดกลายเปนมัจจุราช ผูทําลายลางโลก\n- โรเบิรต ออปเพนไฮเมอร หลังการทดสอบทรินิตี"
 LOADING_TIP_144: "ทุกคนลวนกลัวในการรบครั้งแรก หากใครบอกวาไมกลัว เขาคือคนโกหก\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_145: "วีรบุรุษที่แทจริงคือคนที่สูทั้งที่ยังกลัว\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_146: "จงเสี่ยงอยางมีการคํานวณ ซึ่งตางจากความบุมบามอยางสิ้นเชิง\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_147: "มีหลุมศพเรียงรายเปนระเบียบสี่รอยหลุมในซิซิลี ทั้งหมดเพราะชายคนหนึ่งหลับในหนาที่ แตนั่นเปนหลุมศพของทหารเยอรมัน เพราะเราจับไอสารเลวนั่นไดขณะหลับกอนที่นายทหารของมันจะทันเห็น\n- จอรจ เอส. แพตตัน"
 LOADING_TIP_148: "ขาไดเห็นสงคราม ขาไดเห็นเลือดไหลจากผูบาดเจ็บ ขาไดเห็นคนตายในโคลนตม ขาไดเห็นเมืองถูกทําลาย ขาเกลียดสงคราม\n- แฟรงคลิน ดี. โรสเวลต"
 LOADING_TIP_149: "พระคริสตราชาจงทรงพระเจริญ! ออสเตรียจงเจริญ!\n- คําพูดสุดทายของไฮนริช ไมเออร, ค.ศ. 1945"
 LOADING_TIP_150: "ขาปฏิเสธลัทธิฟาสซิสตแบบนาซีสําหรับออสเตรียโดยสิ้นเชิง... ขบวนการที่ไมใชออสเตรียนี้สัญญาทุกสิ่งแกทุกคน แตแทจริงแลวมุงกดขี่ชาวออสเตรียอยางไรปรานีที่สุด!\n- อ็อตโต ฟอน ฮาพสบวรค"
 LOADING_TIP_151: "ไมมีทางที่จะยอมรับตัวแทนนาซีเขาสูคณะรัฐมนตรีออสเตรียเปนอันขาด\n- คัวรท ชุชนิก, ค.ศ. 1938"
 LOADING_TIP_152: "กษัตริยเปนอํานาจที่สมมุติขึ้นพอๆ กับพระเจา ขอเท็จจริงนี้ทําใหทั้งอเทวนิยมและสาธารณรัฐนิยมเปนสองดานของเหรียญเดียวกัน\n- โนเอ จอรดาเนีย"
 LOADING_TIP_153: "มีหลายทศวรรษที่ไมมีอะไรเกิดขึ้นเลย และมีบางสัปดาหที่เหตุการณหลายทศวรรษเกิดขึ้น\n- วลาดีมีร เลนิน"
 LOADING_TIP_154: "การชักธงขึ้นบนยอดซูริบาจิครั้งนั้น หมายความวานาวิกโยธินจะคงอยูไปอีกหารอยป\n- เจมส ฟอรเรสทัล รัฐมนตรีวาการกระทรวงทหารเรือ, อิโวจิมะ, ค.ศ. 1945"
 LOADING_TIP_155: "ดังนั้นขอใหเราเตรียมพรอมปฏิบัติหนาที่ และวางตนใหสมกับที่วา หากจักรวรรดิอังกฤษและเครือจักรภพยืนยงไปอีกพันป ผูคนจะยังคงกลาววา 'นี่คือชวงเวลาที่รุงโรจนที่สุดของพวกเขา'\n- วินสตัน เชอรชิลล"
 LOADING_TIP_156: "ขากําลังผานชวงเวลาที่เศราที่สุดในชีวิต เพราะขากําลังปฏิบัติหนาที่อันเจ็บปวดที่สุด หนาที่ซึ่งสําหรับขาแลวเลวรายยิ่งกวาความตาย\n- ยาน ซีโรวี, ค.ศ. 1938 หลังยอมรับความตกลงมิวนิก"
 LOADING_TIP_157: "สาธารณรัฐคือลูกของขา มันกําลังจะจมนํ้า ขาพยายามประคองใหมันลอยอยู ขณะที่เรากําลังถูกกระแสนํ้าพัดพาไป ขารองขอความชวยเหลือไปยังอังกฤษและอเมริกา พวกเขากลับยืนอยูบนฝงและเยยหยันขา \n- ซุน ยัตเซ็น"
 LOADING_TIP_158: "V คืออักษรตัวแรกของคําวา 'Victoire' ในภาษาฝรั่งเศส และ 'Vrijheid' ในภาษาเฟลมิช... ชัยชนะของมิตรที่ดีของเรา ชาวอังกฤษ คําวาชัยชนะของพวกเขาก็ขึ้นตนดวย V เชนกัน \n- วิกตอร เดอ ลาเวอแลย, แคมเปญ V for Victory" 
 LOADING_TIP_159: "ประชาชนชาวฟลิปปนส ขากลับมาแลว \n- ดักลาส แมกอาเธอร"
 LOADING_TIP_160: "การตอสูเพื่ออิสรภาพไมใชการตอสูของคนคนเดียว หรือของชาติใดชาติเดียว แตเปนการตอสูรวมกันของทุกคนที่ปฏิเสธจะสวมโซตรวนของนาย \n- เซรคิโอ โอสเมนยา" 
 LOADING_TIP_161: "หนวยเฝาชายฝงชวยกัวดัลคาแนลไว และกัวดัลคาแนลชวยแปซิฟกใตไว \n- วิลเลียม ฮัลซีย"
 LOADING_TIP_162: "หากขาตองยึดนรก ขาจะใชชาวออสเตรเลียยึด และใชชาวนิวซีแลนดรักษาไว \n- แอรวิน ร็อมเมิล"