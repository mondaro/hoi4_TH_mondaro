 BUL_bury_the_grudges_of_the_past_explanatory_tt: "ชาติ§Yคอมมิวนิสต§!ที่เปนเอกราชทุกชาติในคาบสมุทรบอลขานจะไดรับเหตุการณ §Y'บัลแกเรียเชิญเราเขารวมสหพันธรัฐสาธารณรัฐสังคมนิยมบอลขาน'§!\n§Rบัลแกเรียจะสละการอางสิทธิ์ดินแดนทั้งหมดในประเทศเหลานั้น§!"
