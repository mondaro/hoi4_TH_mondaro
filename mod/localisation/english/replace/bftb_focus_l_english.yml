 BUL_dominance_in_the_adriatic_aegean_success: "หลังความสําเร็จในการยึดครองทะเลอีเจียน ขวัญกําลังใจของทหารและพลเรือนบัลแกเรียสูงกวาที่เคย เราตองฉวยโอกาสนี้ยึดครองทะเลเอเดรียติก เพื่อใหปรัสเซียแหงบอลขานเปนผูพิทักษสามทะเลเพียงผูเดียวโดยไมมีใครโตแยง"
 BUL_dominance_in_the_adriatic_aegean_failure: "ความลมเหลวในการยึดครองทะเลอีเจียนเปนการทําลายขวัญของบัลแกเรียอยางรุนแรง หากเราตองการเรียกความกลาหาญและความมั่นใจคืนมา เราตองสถาปนาความเปนใหญของบัลแกเรียในทะเลเอเดรียติก"
 BUL_dominance_in_the_adriatic_total_failure: "ความเสียหายที่เราไดรับจากความลมเหลวในการยึดครองทั้งทะเลอีเจียนและทะเลดํา กอใหเกิดกระแสความทอแทและความไมไววางใจตอรัฐบาลไปทั่วประเทศ หากเราจะแกไขความผิดพลาดและนําเกียรติภูมิที่ปรัสเซียแหงบอลขานสมควรไดรับกลับคืนมา เราตองสถาปนาความเปนใหญของบัลแกเรียในทะเลเอเดรียติก"
 BUL_bulgaria_on_the_three_seas: "บัลแกเรียแหงสามทะเล"
 BUL_bulgaria_on_the_three_seas_desc: "ดังเชนในยุคโบราณสมัยจักรวรรดิบัลแกเรียที่หนึ่งและที่สอง ชายฝงของ [ROOT.GetNameDef] ไดถูกโอบลอมดวยทะเลอีเจียน ทะเลเอเดรียติก และทะเลดําอีกครั้ง ขั้นตอไปคือการพัฒนาโครงสรางพื้นฐานที่จําเปนเพื่อสรางกองทัพเรืออันทรงพลังที่สามารถรักษาความเปนใหญของบัลแกเรียในสามทะเล"
 BUL_national_submarine_production: "การผลิตเรือดํานํ้าแหงชาติ"
 BUL_national_submarine_production_desc: "กองทัพเรือของเราออนแอเกินกวาจะทาทายกองเรือตางชาติและชวงชิงความเปนใหญบนผิวนํ้า อยางไรก็ตาม เราสามารถมุงผลิตเรือดํานํ้าที่จะคอยรังควานกองเรือขาศึกและคุกคามเสนทางเดินเรือของพวกเขาจากใตนํ้าได"
 BUL_bulgarian_shipping_chamber: "สภาการเดินเรือบัลแกเรีย"
 BUL_bulgarian_shipping_chamber_desc: "เราตองจัดหาสิ่งที่บริษัทเดินเรือและสหกรณของบัลแกเรียตองการเพื่อขยายกองเรืออยางตอเนื่อง เพราะขบวนเรือลําเลียงของพวกเขามีความสําคัญยิ่งตอการคาในยามสงบ และตอการลําเลียงทหารและเสบียงในยามสงคราม"
 BUL_strike_from_the_seas: "โจมตีจากทะเล"
 BUL_strike_from_the_seas_desc: "มีหมูเกาะนับไมถวนและจุดยุทธศาสตรมากมายตามชายฝงทะเลเมดิเตอรเรเนียนและทะเลดํา ดังนั้นเราจึงตองมีกําลังที่แข็งแกรงพรอมเรือลําเลียงที่เพียงพอ ซึ่งสามารถโจมตีจากทะเลและยึดตําแหนงสําคัญเหลานั้นไวเปนฐานเปดการรุกครั้งใหญ"
 BUL_expand_varna_naval_base: "ขยายฐานทัพเรือวารนา"
 BUL_expand_varna_naval_base_desc: "เราตองขยายสิ่งอํานวยความสะดวกของฐานทัพเรือวารนา และสรางอูตอเรือที่เพียงพอสําหรับการผลิตเรือรบ"
 BUL_develop_burgas_shipyards: "พัฒนาอูตอเรือบูรกัส"
 BUL_develop_burgas_shipyards_desc: "เพื่อเพิ่มขีดความสามารถในการผลิตเรือรบ เราจะลงทุนขยายฐานทัพเรือบูรกัสและสรางอูตอเรือแหงใหมในพื้นที่"
 BUL_an_aegean_sea_fleet: "กองเรือทะเลอีเจียน"
 BUL_an_aegean_sea_fleet_desc: "เมื่อเรามีกําลังอยูในทะเลอีเจียนแลว เราตองแสวงหาความเปนใหญเหนือทะเลแหงนี้อยางสมบูรณ เพื่อบรรลุเปาหมายนี้ เราไมอาจพึ่งพาเพียงเรือพิฆาตและเรือดํานํ้า เราตองมีเรือระวางขับนํ้าขนาดใหญขึ้นในกองเรือของเรา"
 BUL_a_powerful_bulgarian_navy: "กองทัพเรือบัลแกเรียอันเกรียงไกร"
 BUL_a_powerful_bulgarian_navy_desc: "เราตองมุงสรางเรือหลักที่จะเสริมอํานาจการยิงที่กองเรือของเรายังขาดอยูในปจจุบัน เราอาจไมมีกองทัพเรือที่ใหญที่สุด แตหากเราทุมเทความพยายาม เราอาจอยูในฐานะที่ชวงชิงความเปนใหญในนานนํ้าของเราได แมตองเผชิญกับมหาอํานาจทางทะเล"
 BUL_modern_tactics: "ยุทธวิธีสมัยใหม"
 BUL_modern_tactics_desc: "กองทัพเรือสมัยใหมตองการการพัฒนายุทธวิธีสมัยใหมเพื่อใชประโยชนไดอยางเต็มที่ แตเราไมควรพึ่งพาเพียงกองทัพเรือเมื่อตองเผชิญกองทัพขาศึกที่ทรงพลัง เพราะจุดออนที่ใหญที่สุดอยางหนึ่งของเรือคือความเปราะบางตอการโจมตีทางอากาศ..."
 BUL_oppose_the_royal_dictatorship: "ตอตานเผด็จการราชวงศ"
 BUL_oppose_the_royal_dictatorship_desc: "หากเราตองการยุติระบอบกดขี่ของ [GetBulgarianTsar] เราตองเริ่มจากการแสวงหาการสนับสนุนที่จําเปนเพื่อสรางฝายคานที่มีพลังตอรัฐบาลปจจุบัน ซึ่งประกอบดวยหุนเชิดของฝายนิยมซารทั้งสิ้น"
 BUL_appoint_communist_ministers: "แตงตั้งรัฐมนตรีคอมมิวนิสต"
 BUL_appoint_communist_ministers_desc: "เราตองกดดันรัฐบาลบัลแกเรียใหแตงตั้งรัฐมนตรีที่ตองการเปลี่ยนทิศทางออกจากระบอบเผด็จการของซาร มีเพียงการทํางานจากภายในรัฐบาลเทานั้นที่เราจะโคนลมระบอบซารได"
 BUL_the_spanish_struggle: "การตอสูในสเปน"
 BUL_the_spanish_struggle_desc: "สหายชาวสเปนของเรากําลังเผชิญหนากับพวกฟาสซิสตสารเลว ซึ่งดวยการสนับสนุนจากมหาอํานาจฝายขวาอื่น ๆ ในยุโรป กําลังคุกคามอยางหนักที่จะเอาชนะรัฐบาลสาธารณรัฐ \nเมื่อเผชิญกับความโหดรายเชนนี้ [ROOT.GetNameDef] ไมอาจเมินเฉยได เราตองจัดตั้งกองพลนอยอาสาสมัครเพื่อสูเคียงบาเคียงไหลกับกองกําลังอาสาชาวสเปนในการปกปองเสรีภาพ"
 BUL_overthrow_the_tsar: "โคนลมซาร"
 BUL_overthrow_the_tsar_desc: "กระแสตอตานซารกําลังแพรกระจายในบัลแกเรีย และเราตองฉวยโอกาสอันมีคานี้โคนลม [GetBulgarianTsar] และลมเลิกระบอบกษัตริยบัลแกเรียไปตลอดกาล ในบัลแกเรียยุคใหมไมมีที่วางสําหรับรูปแบบการปกครองที่ลาสมัยเชนนี้!"
 BUL_abolish_the_tarnovo_constitution: "ยกเลิกรัฐธรรมนูญทารโนโว"
 BUL_abolish_the_tarnovo_constitution_desc: "รัฐธรรมนูญทารโนโวเคยถูกมองวาเสรีและกาวหนาในศตวรรษที่แลว แตทุกวันนี้กลับใชเพียงเพื่อใหความชอบธรรมแกระบอบเผด็จการที่กดขี่ ถึงเวลาที่จะยกเลิกรัฐธรรมนูญนี้และรางฉบับใหม โดยอิงแบบอยางรัฐธรรมนูญโซเวียตป 1936 ซึ่งรวมถึงสิทธิขั้นพื้นฐาน เชน ความเสมอภาคของพลเมืองภายใตกฎหมาย เสรีภาพในการพูดและการชุมนุม และระบบสวัสดิการถวนหนา"
 BUL_unify_the_bourgeois_movement: "รวมขบวนการกระฎมพี"
 BUL_unify_the_bourgeois_movement_desc: "หากเราตองการตอสูกับลัทธิฟาสซิสตในบัลแกเรีย เราตองรวมขบวนการกระฎมพีใหเปนขบวนการเดียวกัน เพื่อบรรลุเปาหมายนี้ พรรคคอมมิวนิสตบัลแกเรียตองรวมมือกับฝายสังคมนิยม โดยละทิ้งความแตกตางระหวางกันเพื่อประโยชนสวนรวม"
 BUL_united_front_against_fascism: "แนวรวมตอตานฟาสซิสต"
 BUL_united_front_against_fascism_desc: "ขั้นตอไปหลังจากรวมขบวนการกระฎมพีคือการจัดตั้งกลุมตอตานฟาสซิสต ซึ่งเปนยุทธวิธีที่การประชุมสมัชชาครั้งที่ 7 ขององคการคอมมิวนิสตสากลเสนอไวในป 1935 เราตองเชิญชวนฝายเกษตรกรและแมแตฝายประชาธิปไตยใหเขารวมแนวรวมของเราเพื่อตอตานลัทธิฟาสซิสตบัลแกเรีย"
 BUL_the_fatherland_front: "แนวรวมปตุภูมิ"
 BUL_the_fatherland_front_desc: "หลังจากรวบรวมการสนับสนุนอยางมากจากกลุมการเมืองจํานวนมาก ถึงเวลาที่แนวรวมตอตานฟาสซิสตของเราจะกลายเปนขบวนการทางการเมืองโดยตัวเอง รวมสมาชิกขององคกรการเมืองตาง ๆ เหลานี้เขาเปนพรรคเดียว ซึ่งมุงมั่นจะตอตานลัทธิฟาสซิสตในบัลแกเรียไมวาจะตองแลกดวยสิ่งใด"
 BUL_full_voting_rights_for_women: "สิทธิเลือกตั้งเต็มที่สําหรับสตรี"
 BUL_full_voting_rights_for_women_desc: "หากเราตองการใหเสรีภาพ ความเสมอภาค และความกาวหนาเปนใหญในประเทศของเรา ถึงเวลาที่จะมอบสิทธิเลือกตั้งเต็มที่แกสตรี และสนับสนุนสหภาพสตรีบัลแกเรียในภารกิจสรางความตระหนักทางสังคมตอประเด็นของสตรีใน [ROOT.GetNameDef]"
 BUL_the_peoples_republic_of_bulgaria: "สาธารณรัฐประชาชนบัลแกเรีย"
 BUL_the_peoples_republic_of_bulgaria_desc: "เมื่อเราขจัดระบอบกษัตริยบัลแกเรียไปแลว เราตองทําการเปลี่ยนแปลงที่จําเปนอยางยิ่งตอการปกครองประเทศ ถึงเวลาที่จะยุติยุคสมัยแหงเผด็จการและการกดขี่ที่รุมเราประเทศมาหลายป และสถาปนาสาธารณรัฐประชาชนบัลแกเรีย \nสามัคคีคือพลัง!"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance: "สนธิสัญญาชวยเหลือซึ่งกันและกันโซเวียต-บัลแกเรีย"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc: "[SOU.GetNameDef] คือพันธมิตรทรงพลังที่สามารถกระตุนเศรษฐกิจของเรา และชวยรับประกันบูรณภาพแหงดินแดนของ [ROOT.GetNameDef] ในยามยากลําบากนี้ เราตองพยายามกระชับความสัมพันธกับรัฐบาล[SOU.GetAdjective] และไดรับการสนับสนุนอันมีคา หากเราจะเอาชนะศัตรูมากมายที่รายลอมเราอยู"
 BUL_follow_the_stalinist_doctrine: "ดําเนินตามหลักนิยมสตาลิน"
 BUL_follow_the_stalinist_doctrine_desc: "ถึงเวลาที่เราจะยื่นขอเปนสมาชิก [SOV.GetFactionName] อยางเปนทางการ เพื่อพัฒนาความรวมมือที่ดีขึ้นระหวาง [SOV.GetNameDef] กับ [ROOT.GetNameDef] ไมเพียงในดานเศรษฐกิจและอุตสาหกรรม แตรวมถึงดานการทหารดวย"
 BUL_joint_research_effort: "ความรวมมือดานการวิจัย"
 BUL_joint_research_effort_desc: "เราตองรวมความพยายามดานการวิจัยทางทหารเขากับของพันธมิตร เพื่อสงเสริมการพัฒนาอาวุธสมัยใหมที่จะพลิกดุลใหเปนประโยชนตอเราในความขัดแยงทางทหาร"
 BUL_soviet_military_exercises: "การฝกซอมทางทหารของโซเวียต"
 BUL_soviet_military_exercises_desc: "กองทัพของเรายังมีอะไรตองเรียนรูอีกมากจากกองทัพแดงที่มีความสามารถและมีวินัย เราควรเชิญที่ปรึกษาทางทหารจาก [SOV.GetNameDef] มายัง [ROOT.GetNameDef] เพื่อชวยพัฒนาโครงการฝกทหารตามแบบอยางโซเวียต"
 BUL_soviet_bulgarian_war_industry: "อุตสาหกรรมสงครามโซเวียต-บัลแกเรีย"
 BUL_soviet_bulgarian_war_industry_desc: "หากเราตองการวางรากฐานอุตสาหกรรมทหารแหงชาติที่สามารถรองรับกองทัพขนาดใหญ เราตองขอความรวมมือจากโซเวียตมากขึ้นในการพัฒนาและผลิตอาวุธสมัยใหม"
 BUL_carry_the_revolution_abroad: "นําการปฏิวัติสูตางแดน"
 BUL_carry_the_revolution_abroad_desc: "บัลแกเรียตองเปนหัวหอกของการปฏิวัติคอมมิวนิสตในคาบสมุทรบอลขาน เราจะเชิญรัฐบาลที่มีแนวคิดเดียวกันใหเขารวมพันธมิตร และเราจะรับหนาที่นําการปฏิวัติไปสูเพื่อนบานที่เหลือดวยกําลัง"
 BUL_liberation_of_the_proletariat: "การปลดปลอยชนชั้นกรรมาชีพ"
 BUL_liberation_of_the_proletariat_desc: "เปนหนาที่ของเราที่จะยุติระบอบกดขี่ที่ชนชั้นแรงงานในประเทศเพื่อนบานตองตกอยูภายใต กองทัพประชาชนบัลแกเรียจะไมหยุดพักจนกวารัฐบาลทรราชเหลานี้จะถูกโคนลม แมจะตองสูกับมหาอํานาจยุโรปที่หนุนหลังพวกเขาก็ตาม"
 BUL_the_anti_capitalist_fight: "การตอสูตอตานทุนนิยม"
 BUL_the_anti_capitalist_fight_desc: "ตลอดประวัติศาสตร สิ่งที่เรียกวามหาประชาธิปไตยแหงยุโรปไดแทรกแซงเศรษฐกิจและพรมแดนของประเทศในคาบสมุทรบอลขาน โดยคํานึงถึงผลประโยชนของตนเองและไมใยดีตอความขัดแยงนองเลือดที่ตนกอขึ้น แตถึงเวลาแลวที่นายทุนเนาเฟะเหลานั้นจะตองสูญสิ้นไป เพราะบัดนี้ถึงคราวที่บัลแกเรียจะเปนผูกําหนดเศรษฐกิจ รัฐบาล และพรมแดนของพวกเขา"
 BUL_united_we_shall_prevail: "สามัคคีกัน เราจะชนะ!"
 BUL_united_we_shall_prevail_desc: "คาบสมุทรบอลขานตกอยูใตอํานาจของชาติตางชาติมานาน แตบัดนี้ถึงเวลาที่ประชาชนของเราจะรวมมือกันตอตานผูรุกราน และตอสูเพื่อผืนดินที่เปนของเราโดยชอบธรรม"
 BUL_the_unification_of_the_balkans: "การรวมคาบสมุทรบอลขาน"
 BUL_the_unification_of_the_balkans_desc: "ถึงเวลาแลวที่จะทําใหวิสัยทัศนของสหพันธรัฐบอลขานที่เปนปกแผนและเปนเอกราชเปนจริง ซึ่งพลเมืองทุกคนเทาเทียมกันและเดินทางไดอยางเสรีโดยไมคํานึงถึงเชื้อชาติ วัฒนธรรม หรือความเชื่อ"
 BUL_the_peoples_militia_directorate: "กองอํานวยการกองกําลังอาสาประชาชน"
 BUL_the_peoples_militia_directorate_desc: "เราจะจัดตั้งกองอํานวยการกองกําลังอาสาประชาชน ภายใตการควบคุมโดยตรงของกระทรวงมหาดไทย มีหนาที่ดูแลความมั่นคงทางการเมือง รักษาความสงบเรียบรอยของประชาชน และสืบสวนคดีอาญา"
 BUL_purge_the_elites: "กวาดลางชนชั้นนํา"
 BUL_purge_the_elites_desc: "ถึงเวลาที่ชนชั้นอภิสิทธิ์ของบัลแกเรียจะเลิกกักตุนความมั่งคั่ง หากเราตองการใหประเทศและเศรษฐกิจรุงเรือง คนรวยจําเปนตองแบงปนสิ่งที่มีใหแกผูที่ไมมีอะไรเลย แทนที่จะแบงใหธนาคาร"
 BUL_collectivization_of_the_countryside: "การรวมชนบทเปนนารวม"
 BUL_collectivization_of_the_countryside_desc: "วิกฤตการกระจายผลผลิตทางการเกษตรเคยกอความไมสงบอยางใหญหลวงในบัลแกเรียมาแลว และทางออกของปญหานี้คือการเปลี่ยนฟารมที่เปนของปจเจกใหเปนฟารมที่ดําเนินงานแบบรวมหมู ซึ่งเปนกระบวนการที่สหภาพโซเวียตดําเนินการสําเร็จมาแลว"
 BUL_heavy_industry: "อุตสาหกรรมหนัก"
 BUL_heavy_industry_desc: "หลังการปรับโครงสรางการเกษตรสําเร็จ ในที่สุดเราก็อยูในฐานะที่จะดําเนินโครงการอุตสาหกรรมสมัยใหมอันทะเยอทะยานในบัลแกเรียได"
 BUL_train_the_youth_wings: "ฝกฝนกลุมเยาวชน"
 BUL_train_the_youth_wings_desc: "เพื่อชดเชยการขาดแคลนกําลังพลในกองทัพ เราตองจัดหลักสูตรการฝกขั้นพื้นฐานเพื่อสอนสมาชิกกลุมเยาวชนของเราใหใชอาวุธและยุทธวิธีทางทหาร เพื่อใหพวกเขาเสริมกําลังแถวของเราไดหากจําเปน"
 BUL_treaty_of_perpetual_friendship: "สนธิสัญญามิตรภาพถาวร"
 BUL_treaty_of_perpetual_friendship_desc: "ในฐานะกาวแรกของการพัฒนาความสัมพันธอันดีกับเพื่อนบานในคาบสมุทรบอลขาน เราตองเสนอตอรัฐบาลยูโกสลาเวียใหลงนามในสนธิสัญญาที่วางรากฐานความรวมมือระหวางสองประเทศ และ [ROOT.GetNameDef] จะยุติการอางสิทธิ์แบบดินแดนนิยมใน [YUG.GetNameDef] ในที่สุด"
 BUL_balkan_federation_of_socialist_republics: "สหพันธรัฐสาธารณรัฐสังคมนิยมบอลขาน"
 BUL_balkan_federation_of_socialist_republics_desc: "โครงการสหพันธรัฐบอลขานลมเหลวในทศวรรษ 1920 เนื่องจากความทะเยอทะยานแบบชาตินิยมของสมาชิกตาง ๆ แตกาลเวลาเปลี่ยนไปแลว และเราตองนําเสนอโครงการสหพันธรัฐใหมของเราแกชาติบอลขานอื่น ๆ โดยเริ่มจาก [YUG.GetNameDef]"
 BUL_bury_the_grudges_of_the_past: "ฝงความแคนในอดีต"
 BUL_bury_the_grudges_of_the_past_desc: "ถึงเวลาที่จะทิ้งขอพิพาทในอดีตไวเบื้องหลัง และเริ่มมองไปสูอนาคตแหงความเปนปกแผนและความรวมมือในคาบสมุทรบอลขาน เราตองเรงเราใหเพื่อนบานเขารวม [GetFederationOrConfederation] ของเรา เพราะโครงการบอลขานที่เปนหนึ่งเดียวจะไมมีวันสมบูรณหากขาดพวกเขา"
 BUL_balkan_trade_union_secretariat: "สํานักเลขาธิการสหภาพแรงงานบอลขาน"
 BUL_balkan_trade_union_secretariat_desc: "เราตองจัดตั้งสํานักเลขาธิการสหภาพแรงงานที่กําหนดแนวทางใหสหภาพแรงงานตาง ๆ ปฏิบัติตาม โดยมีเปาหมายเพื่อกระตุนเศรษฐกิจและสงเสริมความรวมมือระหวางประเทศใน [GetFederationOrConfederation] ของเรา"
 BUL_defy_moscow: "ทาทายมอสโก"
 BUL_defy_moscow_desc: "สหภาพโซเวียตไดประโยชนจากความเปนปรปกษระหวางประเทศในคาบสมุทรบอลขานมานาน โดยไมลังเลที่จะแทรกแซงการเมืองของเราหากเปนประโยชนแกตน บัดนี้ถึงเวลาที่ [GetFederationOrConfederation] ของเราจะลงมือกอนที่รัฐบาลโซเวียตจะรูตัววากลุมบอลขานที่เปนหนึ่งเดียวของเราอยูในฐานะที่จะทาทายความเปนเจาของมอสโกได"
 BUL_balkan_research_cooperation: "ความรวมมือดานการวิจัยบอลขาน"
 BUL_balkan_research_cooperation_desc: "เราตองพัฒนาโครงการความรวมมือที่ชวยใหนักวิทยาศาสตรจากประเทศตาง ๆ ใน [GetFederationOrConfederation] ของเราแบงปนการคนพบและสงเสริมความกาวหนาทางเทคโนโลยีใหม ๆ"
 BUL_recover_italian_territories: "ทวงคืนดินแดนจากอิตาลี"
 BUL_recover_italian_territories_desc: "กอนที่ความทะเยอทะยานทางดินแดนของอิตาลีจะไปไกลกวานี้ เราตองเรียกรองใหรัฐบาลอิตาลีโอนการควบคุมดินแดนที่ยึดครองในคาบสมุทรบอลขานคืนแกประเทศที่เปนเจาของโดยชอบธรรม มิฉะนั้นจะตองเผชิญผลที่ตามมา"
 BUL_democratic_principles: "หลักการประชาธิปไตย"
 BUL_democratic_principles_desc: "แมเปาหมายหลักของเราคือการยุติระบอบอํานาจนิยมของซาร แตเราไมอาจปลอยใหรัฐบาลคอมมิวนิสตเบ็ดเสร็จนิยมขึ้นมาแทนที่ได เราตองยึดมั่นในอุดมการณประชาธิปไตย และพยายามเพิ่มอิทธิพลของรัฐมนตรีที่มีแนวคิดเดียวกันในรัฐบาล"
 BUL_legalize_the_agrarian_party: "สนับสนุนสหภาพเกษตรกร"
 BUL_legalize_the_agrarian_party_desc: "แนวคิดดานเศรษฐกิจของสหภาพเกษตรกรแหงชาติบัลแกเรียอาจแตกตางจากของเราเล็กนอย แตหากเราละทิ้งเรื่องหยุมหยิมเหลานี้ไว สมาชิกของสหภาพก็อาจหันมาสนับสนุนนโยบายของเรา ดังนั้นเราตองดําเนินการใหองคกรนี้ถูกกฎหมายและแสวงหาความรวมมือระหวางพรรคของเรา เพราะหากเราจะนําบัลแกเรียสูประชาธิปไตยที่แทจริง เราตองการการสนับสนุนทุกอยางเทาที่หาได..."
 BUL_form_a_popular_bloc: "จัดตั้งกลุมประชาชน"
 BUL_form_a_popular_bloc_desc: "เพื่อจัดตั้งกลุมที่เปนปกแผนและเขมแข็งตอตานอํานาจนิยมและการกดขี่ใน [ROOT.GetNameDef] เราตองโนมเอียงไปทางนโยบายสังคมนิยม และแสวงหาความเปนเอกภาพระหวางกลุมการเมืองฝายซายที่พรอมตอสูกับระบอบฟาสซิสตและระบอบนิยมกษัตริย"
 BUL_abolish_the_monarchy: "ลมเลิกระบอบกษัตริย"
 BUL_abolish_the_monarchy_desc: "ระบอบกษัตริยอาจเคยเปนเครื่องมือที่มีประโยชนในการรักษาเสถียรภาพของบัลแกเรียในชวงปแรก ๆ ของรัฐบัลแกเรียที่สาม แตหลังจากสงครามอันหายนะและระบอบทรราช ประชาชนไดสิ้นศรัทธาในระบบการปกครองอันลาสมัยนี้แลว ถึงเวลาที่จะลมเลิกมัน"
 BUL_seek_cooperation_with_the_tsar: "แสวงหาความรวมมือกับซาร"
 BUL_seek_cooperation_with_the_tsar_desc: "ซารยังคงมีอํานาจในรัฐบาลมากเกินไป และอาจขัดขวางขอเสนอทั้งหมดของเราไดหากถูกยั่วยุ ทางเลือกที่ดีที่สุดจึงเปนการพยายามรวมมือกับพระองค ขณะที่คอย ๆ เพิ่มอิทธิพลของเราในรัฐบาล"
 BUL_legislative_elections: "การเลือกตั้งสภานิติบัญญัติ"
 BUL_legislative_elections_desc: "พรรคประชาธิปไตยบัลแกเรียไดรับการสนับสนุนอยางลนหลาม และบัดนี้อยูในฐานะที่จะกดดันรัฐบาลใหจัดการเลือกตั้งรัฐสภา ซึ่งครั้งนี้จะปราศจากการโกงที่เคยเกิดขึ้นมาหลายป"
 BUL_petorka: "เปโตรกาตา"
 BUL_petorka_desc: "เราไดรับขอเสนอใหรวมมือกับกลุมการเมืองบางกลุมที่เชนเดียวกับเรา ตองการปกปองหลักการประชาธิปไตยจากกองกําลังทางการเมืองทั้งปวงที่พยายามสถาปนาระบอบเผด็จการ ไมวาจะเปนฝายนิยมซาร ฟาสซิสต หรือคอมมิวนิสต แนวรวมนี้จะประกอบดวยหาองคกร รวมถึงพรรคประชาธิปไตยหัวรุนแรง พรรคเสรีนิยมแหงชาติ และแนนอน พรรคประชาธิปไตยบัลแกเรีย"
 BUL_land_reorganization: "การปรับโครงสรางที่ดิน"
 BUL_land_reorganization_desc: "ถึงเวลาดําเนินการปรับโครงสรางอุตสาหกรรมและการเกษตร ตามแผนของเราที่จะนําการปฏิรูปชุดใหมมาใชเพื่อเสริมความแข็งแกรงใหภาคสวนเหลานี้ในอนาคตอันใกล"
 BUL_agrarian_cooperative_movement: "ขบวนการสหกรณการเกษตร"
 BUL_agrarian_cooperative_movement_desc: "เราตองไดแรงบันดาลใจจากมาตรการดานการเกษตรที่สหภาพเกษตรกรแหงชาติเสนอ และสงเสริมการจัดระเบียบชนบทโดยยึดระบบสหกรณเปนหลัก"
 BUL_modernize_the_industry: "ปรับปรุงอุตสาหกรรมใหทันสมัย"
 BUL_modernize_the_industry_desc: "หากเราจะสถาปนาตนเปนมหาอํานาจทางอุตสาหกรรมอันดับหนึ่งในคาบสมุทรบอลขาน เราตองมุงมั่นปรับปรุงอุตสาหกรรมใหทันสมัย! การจัดสรรงบประมาณที่เพิ่มขึ้นและเครื่องมือที่ดีขึ้นจะทําใหความฝนของเราเปนจริง"
 BUL_the_salonika_agreement: "ขอตกลงซาโลนิกา"
 BUL_the_salonika_agreement_desc: "เห็นไดชัดวาบัลแกเรียเพียงลําพังไมไดเปนภัยคุกคามใด ๆ ตอชาติที่รวมตัวกันเปนความตกลงบอลขานเพื่อเผชิญหนากับประเทศของเรา ดังนั้นเราตองพยายามฟนฟูความสัมพันธฉันมิตรกับเพื่อนบาน และจะมีวิธีเริ่มตนใดดีไปกวาการลงนามขอตกลงกับผูนําของ [GRE.GetNameDef] คือ [GRE.GetLeader]?"
 BUL_a_balkan_confederation: "สมาพันธรัฐบอลขาน"
 BUL_a_balkan_confederation_desc: "เหตุผลที่นําไปสูการกอตั้งความตกลงบอลขานนั้นลาสมัยไปแลว ในยามปนปวนเชนนี้ ชาติบอลขานควรทิ้งความขัดแยงในอดีตไวเบื้องหลัง และรวมตัวกันเพื่อปองกันตนเองจากมหาอํานาจตางชาติที่หวังจะครอบงําพวกเขา"
 BUL_approach_the_united_kingdom: "ผูกสัมพันธกับสหราชอาณาจักร"
 BUL_approach_the_united_kingdom_desc: "[ROOT.GetNameDef] ตองการการคุมครองจากมหาอํานาจประชาธิปไตยในยุโรป หากจะอยูรอดในยามไมแนนอนเชนนี้ เราตองพบปะกับรัฐบาล[ENG.GetAdjective]เพื่อเจรจากติกาความรวมมือระหวางสองประเทศ"
 BUL_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 BUL_join_the_allies_desc: "เราตองแสดงความปรารถนาที่จะเขารวม [ENG.GetFactionName] อยางเปนทางการ ดวยการยื่นคํารองตอรัฐบาล[ENG.GetAdjective]ใหพิจารณารับ [ROOT.GetNameDef] เปนสมาชิกพันธมิตรของพวกเขา"
 BUL_consolidate_the_third_bulgarian_state: "สรางความมั่นคงแกรัฐบัลแกเรียที่สาม"
 BUL_consolidate_the_third_bulgarian_state_desc: "หลังจากความขัดแยงทางสังคม ภาวะเศรษฐกิจตกตํ่า และขอพิพาทระหวางประเทศมาอยางยาวนาน ในที่สุดเราก็พรอมที่จะสรางเสถียรภาพและความแข็งแกรงใหแกรัฐบัลแกเรียที่สาม"
 BUL_free_balkan_states: "รัฐบอลขานเสรี"
 BUL_free_balkan_states_desc: "เปนหนาที่ของเราในฐานะมหาอํานาจบอลขานที่จะปกปองเพื่อนบานที่ออนแอกวาจากความทะเยอทะยานของชาติใดก็ตามที่หมายจะรุกรานดินแดนของเรา เราตองพัฒนาความรวมมือระหวางชาติที่เปนมิตรในภูมิภาค และเตรียมพรอมปองกันคาบสมุทรบอลขาน"
 BUL_fight_tyranny: "ตอสูกับทรราช"
 BUL_fight_tyranny_desc: "ถึงเวลาที่จะเผชิญหนากับมหาอํานาจยุโรปที่ดําเนินนโยบายฟาสซิสตอันนากังวล ซึ่งผูนําของพวกเขาไมฝนถึงสิ่งใดนอกจากการขยายอาณาเขตและพิชิตโลก"
 BUL_assert_our_claims: "ยืนยันการอางสิทธิ์ของเรา"
 BUL_assert_our_claims_desc: "ถึงเวลาจัดการปญหาดินแดนที่รุมเราประเทศของเรามาหลายทศวรรษ เราตองขอการสนับสนุนจากรัฐบาล[ENG.GetAdjective]เพื่อแกไขความอยุติธรรมที่บัลแกเรียไดรับนับแตไดรับการปลดปลอย"
 BUL_appeal_to_european_capitalists: "เชิญชวนนายทุนยุโรป"
 BUL_appeal_to_european_capitalists_desc: "[ROOT.GetNameDef] ตองการการอัดฉีดทุนใหมเพื่อกระตุนการพัฒนาอุตสาหกรรมแหงชาติ และเพื่อเจรจาหนี้ใหมกับบริษัทขามชาติขนาดใหญที่ลงทุนในประเทศอยูแลว"
 BUL_obliterate_the_bolshevik_threat: "ทําลายภัยคุกคามบอลเชวิค"
 BUL_obliterate_the_bolshevik_threat_desc: "ไมชาก็เร็ว ชาติคอมมิวนิสตจะพยายามนําการปฏิวัติอันตองสาปของพวกเขามาสู [ROOT.GetNameDef] จะรอใหพวกบอลเชวิคจูโจมทําไม ในเมื่อเราสามารถใชประโยชนจากการจูโจมโดยไมใหรูตัว? เราตองเปนฝายลงมือกอน และตองลงมืออยางดุเดือดจนการปฏิวัติอันเปนที่รักของพวกเขาแหลกสลายไปตลอดกาล!"
 BUL_research_sharing: "แบงปนการวิจัย"
 BUL_research_sharing_desc: "ประเทศของเราลาหลังในดานการวิจัยทางวิทยาศาสตร หากเราตองการผลิตเครื่องจักรสงครามที่ลํ้าสมัยและพัฒนาอุตสาหกรรมสมัยใหม เราตองเสนอใหพันธมิตรดําเนินโครงการความรวมมือทางเทคโนโลยี"
 BUL_power_to_the_tsar: "อํานาจสูซาร"
 BUL_power_to_the_tsar_desc: "กลุมซเวโนไดสถาปนาระบอบทหารอํานาจนิยมกอนถูกซารบอริสที่ 3 โคนลมในป 1935 แตซารยังคงรักษาการรวมศูนยอํานาจนี้ไว และถึงเวลาที่จะใชประโยชนจากมันใหดี หากเราจะรวมชาติที่แตกแยกใหเปนหนึ่ง"
 BUL_condemn_macedonian_organizations: "ประณามองคกรมาซิโดเนีย"
 BUL_condemn_macedonian_organizations_desc: "เราตองประกาศความไมพอใจตอ IMRO และเริ่มไลลากําจัดหนวยปฏิวัติมาซิโดเนียที่ยังเคลื่อนไหวอยูในบัลแกเรีย เพื่อสานตอสิ่งที่กลุมซเวโนเริ่มไวในป 1934 ใหสิ้นสุด และปรับปรุงความสัมพันธตางประเทศของเราไปพรอมกัน"
 BUL_support_macedonian_organizations: "สนับสนุนองคกรมาซิโดเนีย"
 BUL_support_macedonian_organizations_desc: "หากเราตองการทําความฝนที่จะรวมและผนวกมาซิโดเนียใหเปนจริง จะเปนประโยชนมากกวาหากรวมมือกับผูนํา IMRO ที่ลี้ภัยอยู ซึ่งสามารถปูทางใหบัลแกเรียเขายึดครองมาซิโดเนียไดในอนาคต"
 BUL_dissolve_the_military_union: "ยุบสหภาพทหาร"
 BUL_dissolve_the_military_union_desc: "กลุมซเวโนมีอิทธิพลตอนายทหารของเรามากเกินไป และมีความขุนเคืองอยางแทจริงในหมูพวกเขาหลังจากซารบอริสขับพวกเขาออกจากอํานาจในป 1935 หากเราตองการหลีกเลี่ยงรัฐประหารครั้งใหมของซเวโน เราตองเรียกประชุมนายทหารที่โซเฟยและประกาศยุบสหภาพทหาร"
 BUL_cooperate_with_the_zveno: "รวมมือกับกลุมซเวโน"
 BUL_cooperate_with_the_zveno_desc: "เราตองทํางานรวมกับกลุมซเวโนแทนที่จะทําใหเปนศัตรู หากเราตัดสินใจยอมใหสัมปทานบางอยาง เราอาจไดพันธมิตรที่ทรงพลัง"
 BUL_the_tsars_regime: "ระบอบของซาร"
 BUL_the_tsars_regime_desc: "ประเทศของเราแตกออกเปนหลายกลุม ขบวนการทางสังคม และองคกรการเมืองตองหาม ซารตองสถาปนาพระราชอํานาจอยางเต็มที่ หากจะนําความเปนเอกภาพและเสถียรภาพมาสูบัลแกเรียในที่สุด"
 BUL_restrained_paramilitary_organizations: "องคกรกึ่งทหารที่ถูกควบคุม"
 BUL_restrained_paramilitary_organizations_desc: "สมาชิกขององคกรกึ่งทหารเปนผูภักดีที่มีวินัยทางทหารอยูบางแลว และพรอมจะทําสงครามเพื่อเกียรติภูมิอันยิ่งใหญของประเทศเรา หากเราดึงองคกรเหลานี้มาได พวกเขาอาจเปนแหลงกําลังพลที่เชื่อถือได"
 BUL_ban_far_right_organizations: "สั่งหามองคกรขวาจัด"
 BUL_ban_far_right_organizations_desc: "พวกหัวรุนแรงขวาจัดไมลังเลที่จะใชความรุนแรงตอผูมีอํานาจ เปนภัยคุกคามใหญหลวงตอรัฐบาลและพลเมืองของเรา เราตองสั่งหามขบวนการทางสังคมทุกอยางในลักษณะนี้และยุบองคกรกึ่งทหารที่เกี่ยวของ"
 BUL_restore_the_tarnovo_constitution: "ฟนฟูรัฐธรรมนูญทารโนโว"
 BUL_restore_the_tarnovo_constitution_desc: "นับตั้งแตรัฐประหารป 1934 รัฐถูกปกครองภายใตรัฐธรรมนูญที่ถูกระงับโดยพฤตินัย ถึงเวลาที่เราจะฟนฟูรัฐธรรมนูญทารโนโวอยางเปนทางการ ซึ่งไมเพียงจะทําใหพลเมืองพอใจ แตยังรองรับระบอบอํานาจนิยมของเราตามกฎหมายดวย"
 BUL_freedom_of_press: "เสรีภาพสื่อมวลชน"
 BUL_freedom_of_press_desc: "เมื่อรัฐธรรมนูญไดรับการฟนฟูแลว เราตองรับประกันสิทธิและหลักการตามรัฐธรรมนูญ การอนุญาตใหเผยแพรหนังสือพิมพที่ถูกสั่งหามอยูอาจเปนกาวแรกสูความรวมมือกับองคกรบางแหง"
 BUL_promote_bulgarian_nationalism: "สงเสริมชาตินิยมบัลแกเรีย"
 BUL_promote_bulgarian_nationalism_desc: "ชาติของเราอาจมีภัยคุกคามนับไมถวนทั้งจากภายนอกและภายใน แตหากชาวบัลแกเรียเรายืนหยัดรวมกันและทํางานเคียงบาเคียงไหล เราจะผานพนยามปนปวนที่รออยูขางหนาได!"
 BUL_crush_the_communists: "บดขยี้พวกคอมมิวนิสต"
 BUL_crush_the_communists_desc: "แมจะถูกปราบปรามมาหลายครั้งแลวในศตวรรษนี้ พวกคอมมิวนิสตก็ยังซุมอยูในเงามืด คอยหาเหยื่อจากผูทุกขยากและผูถูกทอดทิ้งเพื่อเพิ่มพวกพอง เปนหนาที่ของเราที่จะกําจัดพวกเขาใหสิ้นซากไปตลอดกาล ดวยวิธีการใดก็ตามที่จําเปน..."
 BUL_illusions_of_a_non_partisan_system: "ภาพลวงของระบบไรพรรค"
 BUL_illusions_of_a_non_partisan_system_desc: "ซารตองการการสนับสนุนจากราษฎรผูนิยมประชาธิปไตยเพื่อบรรลุวิสัยทัศนบัลแกเรียที่เปนหนึ่งเดียว เราตองจัดสิ่งที่จะเปนเพียงภาพลวงของการเลือกตั้งรัฐสภา โดยยังคงสั่งหามพรรคฝายคานที่ไดรับความนิยม และทําใหมั่นใจวาผูสมัครฝายรัฐบาลจะไดที่นั่งขางมาก"
 BUL_limited_womens_suffrage: "สิทธิเลือกตั้งสตรีแบบจํากัด"
 BUL_limited_womens_suffrage_desc: "สตรีบัลแกเรียเรียกรองความกาวหนาทางสังคมและความเสมอภาค และฝายชาตินิยมก็ไดเตือนแลววาการตอสูนี้ไมใชแคประเด็นของสตรี แตเปนเรื่องของการพัฒนาสังคมและการสรางชาติ ดังนั้น เพื่อเดินตามเสนทางแหงความกาวหนาโดยยังคงควบคุมการเมืองไดเต็มที่ เราจะมอบสิทธิเลือกตั้งแบบมีเงื่อนไขแกสตรีที่สมรสแลวและไมใชคอมมิวนิสต"
 BUL_found_the_brannik: "กอตั้งบรานนิก"
 BUL_found_the_brannik_desc: "บ็อกดาน ฟลอฟ มีขอเสนอที่นาสนใจในการกอตั้งองคกรเยาวชนแหงชาติที่ฝกใฝฟาสซิสต ชื่อวาบรานนิก ใกลชิดกับทางการและจงรักภักดีตอซาร โดยอิงแบบอยางองคกรเยาวชนของเยอรมนี ฟลอฟเชื่อวาบรานนิกจะเติบโตเปนองคกรขนาดใหญ และเปนแหลงกําลังพลสําคัญใหแกเรา\n"บอริส บัลแกเรีย พระเจา!""
 BUL_bulgarian_irredentism: "ดินแดนนิยมบัลแกเรีย"
 BUL_bulgarian_irredentism_desc: "ชาตินิยมบัลแกเรียเรียกรองใหขีดเสนพรมแดนบอลขานใหมใหเปนประโยชนตอบัลแกเรีย และแมแตฝายคอมมิวนิสตและฝายประชาธิปไตยก็เห็นดวย เราตองเนนยํ้าความจําเปนในการฟนฟูมหาบัลแกเรีย ซึ่งเปนเปาหมายรวมของประชาชนทุกคน"
 BUL_strengthen_the_royal_dictatorship: "เสริมความแข็งแกรงใหเผด็จการราชวงศ"
 BUL_strengthen_the_royal_dictatorship_desc: "เราตองมุงสงเสริมความจงรักภักดีตอบอริสและขจัดฝายตอตานระบอบทั้งหมด เพื่อปูทางใหซารผูรวมชาตินําเกียรติภูมิที่ชาติอันเปนที่รักของเราสมควรไดรับมาสูในที่สุด"
 BUL_war_industry: "อุตสาหกรรมสงคราม"
 BUL_war_industry_desc: "กองทัพที่อยูในสงครามตองการยุทโธปกรณ อาวุธ และอากาศยานอยางตอเนื่อง หากเราจะไดรับชัยชนะจากความขัดแยงนี้ เราตองเพิ่มการผลิตทางทหารเพื่อปอนกองกําลังของเรา"
 BUL_liberalization_of_trade_policies: "เปดเสรีนโยบายการคา"
 BUL_liberalization_of_trade_policies_desc: "เศรษฐกิจบัลแกเรียซวนเซจากวิกฤตหนึ่งไปสูอีกวิกฤตหนึ่งนับตั้งแตไดรับเอกราชจากจักรวรรดิออตโตมัน นโยบายพึ่งพาตนเองไดพิสูจนแลววาไมเพียงพอในอดีต จึงถึงเวลาที่จะกาวไปสูการเปดเสรีทางเศรษฐกิจ"
 BUL_plot_against_boris: "[GetPlotAgainstBorisFocusName]"
 BUL_plot_against_boris_plot: "แผนลับตอตานบอริส"
 BUL_plot_against_boris_death: "การสวรรคตของซารบอริส"
 BUL_plot_against_boris_desc: "[GetPlotAgainstBorisFocusDesc]"
 BUL_plot_against_boris_desc_plot: "เราเคยคิดวาซารบอริสคือพระมหากษัตริยที่จะนําประเทศไปสูความยิ่งใหญ แตระบอบอํานาจนิยมที่ใกลเคียงเผด็จการของพระองคกําลังพิสูจนวาเราคิดผิด และคุกคามที่จะทําใหประเทศไรเสถียรภาพยิ่งขึ้น เปนหนาที่ของเราในฐานะผูรับใชที่ภักดีตอบัลแกเรียที่จะกําจัดผูปกครองที่ไมคูควรผูนี้ออกไป และจัดตั้งรัฐบาลใหมที่คูควรกับความไววางใจของประชาชน"
 BUL_plot_against_boris_desc_death: "[GetBorisDeathContext]"
 BUL_form_a_regency_council: "จัดตั้งคณะผูสําเร็จราชการ"
 BUL_form_a_regency_council_desc: "หลังการสวรรคตของซารบอริส และเนื่องจากรัชทายาทของพระองค [GetSimeonsAge] จึงตองแตงตั้งคณะผูสําเร็จราชการเพื่อบริหารราชการแผนดินแทนซีเมโอนที่ 2 ผูทรงพระเยาว"
 BUL_the_return_of_ferdinand_i: "การคืนบัลลังกของซารแฟรดีนันดที่ 1"
 BUL_the_return_of_ferdinand_i_desc: "แมจะทรงพระชราและถูกบังคับใหสละราชสมบัติในป 1918 หลังบัลแกเรียพายแพในมหาสงคราม แตประสบการณทางการเมืองและพระปรีชาสามารถทางการทหารของอดีตซารแฟรดีนันดที่ 1 ทําใหพระองคเปนผูที่เหมาะสมที่สุดที่จะนําชาติไปสูความยิ่งใหญ เราตองจัดเตรียมการที่จําเปนเพื่อนําแฟรดีนันดกลับสูราชบัลลังกบัลแกเรีย"
 BUL_amend_old_grudges: "ชําระความแคนเกา"
 BUL_amend_old_grudges_desc: "ถึงเวลาแกแคนความเสียหายและความอัปยศทั้งปวงที่ศัตรูมากมายไดกระทําตอบัลแกเรียในอดีต ตั้งแตชาวโรมาเนียและชาวเติรกผูทรยศที่แทงขางหลังเราในสงครามบอลขานครั้งที่สอง ไปจนถึงฝายสัมพันธมิตรที่เอาชนะเราในมหาสงครามและขัดขวางการพัฒนาประเทศของเรามาโดยตลอด"
 BUL_the_fate_of_the_balkans: "ชะตากรรมแหงบอลขาน"
 BUL_the_fate_of_the_balkans_desc: "บัลแกเรียตกอยูใตความตองการของประเทศเพื่อนบานและมหาอํานาจยุโรปที่หนุนหลังพวกเขามานานเกินไปแลว... แตกาลเวลาเปลี่ยนไป ประเทศของเราเขมแข็งขึ้นอยางที่ไมมีชาติบอลขานใดเทียบได และในที่สุดบัลแกเรียก็ทรงพลังพอที่จะยืนยันความเปนใหญและพิชิตรัฐนาสมเพชที่รายลอมอยู"
 BUL_toppling_giants: "โคนยักษ"
 BUL_toppling_giants_desc: "ตลอดประวัติศาสตร ชาติที่กําลังผงาดขึ้นไดโคนลมจักรวรรดิอันยิ่งใหญที่ยืนยงมานาน หาก [ROOT.GetNameDef] จะเปนมหาอํานาจรายตอไปของยุโรป เราตองทาทายความเปนเจาของมหาอํานาจอื่นใดที่อยูในเอื้อมมือของเราเสียกอน"
 BUL_nationalist_propaganda: "โฆษณาชวนเชื่อชาตินิยม"
 BUL_nationalist_propaganda_desc: "ยังมีประชาชนบัลแกเรียบางกลุมที่คัดคานบทบาทของบัลแกเรียในฐานะมหาอํานาจที่ครองความเปนใหญในคาบสมุทรบอลขาน โดยอางวานโยบายของรัฐบาล "กดขี่อยางยิ่ง" เพื่อทําใหเสียงเหลานี้เงียบลง เราตองสนับสนุนงบประมาณการรณรงคโฆษณาชวนเชื่อที่จะชวยใหความชอบธรรมแกการกระทําของรัฐบาลและจุดประกายชาตินิยมบัลแกเรียอีกครั้ง"
 BUL_bulgarian_academy_of_sciences: "ราชบัณฑิตยสถานวิทยาศาสตรบัลแกเรีย"
 BUL_guardians_of_the_balkans: "ผูพิทักษแหงบอลขาน"
 BUL_guardians_of_the_balkans_desc: "เราตองรักษาความเปนเจาของบัลแกเรียในคาบสมุทรบอลขานจากศัตรูใดก็ตามที่กลาทาทาย ดังนั้นเราจะเพิ่มความพยายามทางทหารเปนสองเทา และเรงเรารัฐบาลหุนเชิดของเราในคาบสมุทรบอลขานใหทําเชนเดียวกันเพื่อชวยเราปกปองอาณาเขต"
 BUL_consolidate_dominance_of_the_seas: "รวบรวมความเปนใหญเหนือทองทะเล"
 BUL_consolidate_dominance_of_the_seas_desc: "หากเราตองการยึดครองคาบสมุทรบอลขานใหมั่นคง การวางกองทัพขนาดใหญบนคาบสมุทรยังไมเพียงพอ เรายังตองสรางกองทัพเรืออันทรงพลังที่จะเฝาระวังทองทะเลที่รายลอมอยูดวย"
 BUL_appoint_right_wing_ministers: "แตงตั้งรัฐมนตรีฝายขวา"
 BUL_appoint_right_wing_ministers_desc: "ระบอบของซารแมจะชวยใหควบคุมประเทศไดอยางมั่นคง แตก็ขาดเปาหมายที่แทจริงในการปรับปรุงสถานะของบัลแกเรียบนเวทีระหวางประเทศ เราตองใชประโยชนจากลักษณะอํานาจนิยมของระบบปจจุบันเพื่อแตงตั้งรัฐมนตรีใหมที่พรอมจะทําการเปลี่ยนแปลงทางการเมืองและสังคมที่บัลแกเรียตองการอยางแทจริง"
 BUL_the_path_towards_a_greater_bulgaria: "เสนทางสูมหาบัลแกเรีย"
 BUL_the_path_towards_a_greater_bulgaria_desc: "เราตองเริ่มปรับเศรษฐกิจใหรองรับการระดมพลของกองทัพบัลแกเรียที่ใกลเขามา เพราะเสนทางสูมหาบัลแกเรียนั้นเต็มไปดวยสงครามและความขัดแยง"
 BUL_depose_the_tsar: "ปลดซาร"
 BUL_depose_the_tsar_desc: "ระบอบกษัตริยบัลแกเรียกลายเปนภาระที่มีแตจะขัดขวางเราจากการบรรลุเปาหมาย ประโยชนของซารสิ้นสุดลงแลว และถึงเวลาที่จะเอาพระองคออกไปใหพนทาง"
 BUL_military_dictatorship: "เผด็จการทหาร"
 BUL_military_dictatorship_desc: "เราตองควบคุมประเทศอยางเบ็ดเสร็จและปกครองภายใตระบอบอํานาจนิยมแบบทหาร ซึ่งเปดทางใหเราใชมาตรการที่จําเปนเพื่อดําเนินความพยายามทางทหารตอไป"
 BUL_support_the_spanish_coup: "สนับสนุนรัฐประหารในสเปน"
 BUL_support_the_spanish_coup_desc: "สมรภูมิแรกของสงครามตอตานบอลเชวิคคือสเปน หากเราสนับสนุนการลุกฮือของทหารอยางเปนทางการและจัดกลุมอาสาสมัครไปชวยฝายกบฏ สงครามกลางเมืองสเปนอาจกลายเปนสนามทดสอบที่สมบูรณแบบสําหรับกองทหารของเรา"
 BUL_allow_far_right_organizations: "อนุญาตองคกรขวาจัด"
 BUL_allow_far_right_organizations_desc: "การทําใหองคกรขวาจัดบางแหง เชน ขบวนการสังคมแหงชาติหรือรัตนิก ถูกกฎหมาย อาจทําใหเราไดพันธมิตรที่เปนประโยชนและภักดี ซึ่งสนับสนุนระบอบและอุดมการณของเรา"
 BUL_integrate_the_ratniks: "ผนวกรวมกลุมรัตนิก"
 BUL_integrate_the_ratniks_desc: "รัตนิก หรือสหภาพนักรบเพื่อความกาวหนาแหงความเปนบัลแกเรีย เปนองคกรกึ่งทหารชาตินิยมที่เพิ่งกอตั้งขึ้น ซึ่งอาจพิสูจนไดวาเปนเครื่องมือที่มีประโยชนอยางยิ่งในการสนับสนุนระบอบและเปนแหลงกําลังพลจํานวนมากใหแกกองทัพ"
 BUL_economic_protectionism: "นโยบายคุมครองทางเศรษฐกิจ"
 BUL_economic_protectionism_desc: "เราตองดําเนินการปฏิรูปใหมเพื่อกระตุนเศรษฐกิจและอุตสาหกรรมแหงชาติ ในขณะเดียวกันก็ปกปองภาคสวนพื้นฐานในบัลแกเรีย เชน การเกษตรและหัตถกรรม"
 BUL_industrial_autarky: "อุตสาหกรรมพึ่งพาตนเอง"
 BUL_industrial_autarky_desc: "การปฏิรูปแบบคุมครองของเราประสบความสําเร็จอยางยิ่งในการกระตุนเศรษฐกิจและอุตสาหกรรมของประเทศ ดังนั้นเราตองเดินหนาตอไปในแนวทางนี้และดําเนินการปฏิรูปใหมที่นําบัลแกเรียเขาใกลการพึ่งพาตนเองยิ่งขึ้น"
 BUL_corporatism: "บรรษัทนิยม"
 BUL_corporatism_desc: "ตามแบบอยางของอิตาลี แรงงานและนายทุนจากภาคเศรษฐกิจตาง ๆ ตองมีสวนรวมในการกําหนดนโยบายระดับชาติ เพื่อใหเราไกลเกลี่ยระหวางกลุมเหลานี้และดําเนินการปฏิรูปที่เปนประโยชนสูงสุดตอเศรษฐกิจของชาติ"
 BUL_approach_germany: "ผูกสัมพันธกับเยอรมนี"
 BUL_approach_germany_desc: "ขณะที่อังกฤษและฝรั่งเศสบีบคั้นเศรษฐกิจของเรามาตลอดนับตั้งแตความอัปยศของสนธิสัญญานุยยี ชาวเยอรมันไมเพียงแสดงทาทีวาจะยอมรับการอางสิทธิ์ดินแดนของเรา แตยังชวยเราลางหนี้และซื้อผลผลิตทางการเกษตรของเราจํานวนมาก ซึ่งกระตุนเศรษฐกิจและทําใหเราดําเนินการปฏิรูปอุตสาหกรรมและการเกษตรที่สําคัญได"
 BUL_approach_germany_foreign_industry_tt: "ลดตนทุนการตัดสินใจ §Yขอตกลงตางประเทศ§! กับ [GER.GetNameDef] และเพิ่มเพดานโรงงาน[GER.GetAdjective]"
 BUL_approach_british_foreign_industry_tt: "ลดตนทุนการตัดสินใจ §Yขอตกลงตางประเทศ§! กับ [ENG.GetNameDef] และเพิ่มเพดานโรงงาน[ENG.GetAdjective]"
 BUL_approach_soviet_foreign_industry_tt: "ลดตนทุนการตัดสินใจ §Yขอตกลงตางประเทศ§! กับ [SOV.GetNameDef] และเพิ่มเพดานโรงงาน[SOV.GetAdjective]"
 BUL_cooperation_with_italy: "รวมมือกับอิตาลี"
 BUL_cooperation_with_italy_desc: "ชาวอิตาลีแสดงความสนใจทางเศรษฐกิจตอประเทศของเราหลายครั้ง และเราตองไมลืมการอภิเษกสมรสระหวางซารบอริสกับเจาหญิงโจวันนา เราจะกระชับความสัมพันธทั้งทางการทูตและเศรษฐกิจกับพวกเขา เพราะพวกเขาอาจเปนพันธมิตรที่แข็งแกรงในคาบสมุทรบอลขานในอนาคตอันใกล"
 BUL_join_the_tripartite_pact: "เขารวม [GetGermanFactionName]"
 BUL_join_the_tripartite_pact_axis: "กติกาสัญญาไตรภาคี"
 BUL_join_the_tripartite_pact_central_powers: "ฝายมหาอํานาจกลาง"
 BUL_join_the_tripartite_pact_desc: "[GetJoinTripartitePactFocusDesc]"
 BUL_join_the_tripartite_pact_desc_axis: "เราจะแจงชาวเยอรมันวาเราพรอมและเต็มใจที่จะลงนามใน [GetGermanFactionName] และเขารวมฝายของพวกเขาอยางเปนทางการในฐานะพันธมิตร"
 BUL_join_the_tripartite_pact_desc_central_powers: "ไกเซอรกลับมาแลว และเราตองพยายามฟนฟูพันธมิตรเกาของเราอีกครั้ง คราวนี้เราจะแกไขความอยุติธรรมที่กระทําตอประเทศอันภาคภูมิของเรา คราวนี้จะไมมีสิ่งใดขวางทางเราสูเกียรติยศและความยิ่งใหญ คราวนี้เราจะเปนฝายชนะ!"
 BUL_peaceful_development: "การพัฒนาอยางสันติ"
 BUL_peaceful_development_desc: "จะเขารวมสงครามที่นํามาซึ่งความตายและหายนะแกประชาชนไปทําไม ในเมื่อเราสามารถรับบทผูรักษาสันติภาพในดินแดนบอลขานที่ถูกยึดครอง เก็บเกี่ยวผลประโยชนทางดินแดนโดยไมตองสงทหารแมแตคนเดียวไปตายในแนวรบหางไกล?"
 BUL_military_secrets_sharing: "แบงปนความลับทางทหาร"
 BUL_military_secrets_sharing_desc: "เทคโนโลยีของเยอรมนีเหนือกวาของเรามาก และจะเปนประโยชนอยางยิ่งหากเราลงนามขอตกลงที่ใหนักวิทยาศาสตรและวิศวกรบัลแกเรียเขาถึงสิ่งมหัศจรรยทางเทคโนโลยีบางอยางของเยอรมนี ซึ่งจะปูทางใหเราพัฒนาการวิจัยของตนเองตอไป"
 BUL_bulgarian_administration_of_the_balkans: "การผนวกรวมบอลขานเขากับบัลแกเรีย"
 BUL_bulgarian_administration_of_the_balkans_desc: "เพื่อเสริมการอางสิทธิ์ในคาบสมุทรบอลขาน เราตองดําเนินการผนวกรวมดินแดนที่ถูกยึดครองใหเปนบัลแกเรีย เพื่อวาหลังชัยชนะของ[GetGermanFactionNameDef]ในสงคราม [GetGermanOrIndependent] จะไดเห็นความเปนบัลแกเรียของดินแดนเหลานั้น และจะไมกลาทําลายบูรณภาพแหงชาติของเรา ดังที่อังกฤษเคยทําในป 1878"
 BUL_bulgarian_administration_of_the_balkans_axis_name_def: "ฝายอักษะ"
 BUL_bulgarian_administration_of_the_balkans_central_powers_name_def: "ฝายมหาอํานาจกลาง"
 BUL_bulgarian_administration_of_the_balkans_independent_name_def: "เรา"
 BUL_bulgarian_administration_of_the_balkans_germans_name: "ชาวเยอรมัน"
 BUL_bulgarian_administration_of_the_balkans_everyone_name: "ชาวโลก"
 BUL_restore_the_bulgarian_patriarchate: "ฟนฟูสังฆราชบัลแกเรีย"
 BUL_restore_the_bulgarian_patriarchate_desc: "ตองกดดันอัครบิดรแหงคอนสแตนติโนเปลใหรับรองความเปนอิสระของศาสนจักรบัลแกเรีย และจัดเตรียมการที่จําเปนเพื่อใหสมัชชาศักดิ์สิทธิ์แหงศาสนจักรออรโธดอกซบัลแกเรียเลือกตั้งมุขนายกนครหลวง ผูซึ่งจะเปนอัครบิดรแหงบัลแกเรีย"
 BUL_total_war: "สงครามเบ็ดเสร็จ"
 BUL_total_war_desc: "เราตองประกาศการอางสิทธิ์ดินแดนในโรมาเนียอยางเปนทางการ โดยมีเปาหมายเพื่อใหไดแหลงนํ้ามันมาคํ้าจุนความพยายามในสงคราม เพราะในที่สุด [ROOT.GetNameDef] ก็พรอมแลวที่จะทําสงครามเต็มรูปแบบกับศัตรูของพันธมิตร"
 BUL_the_eastern_front: "แนวรบดานตะวันออก"
 BUL_the_eastern_front_desc: "จนถึงบัดนี้ พลเมืองของเราไมเต็มใจยอมใหมีความเปนปรปกษใด ๆ ตอผูปลดปลอยประชาชนบัลแกเรีย แตสงครามอันหายนะระหวางพันธมิตรของเรากับ [SOV.GetNameDef] ไดเปลี่ยนความคิดของผูคัดคานในอดีตจํานวนมาก ซึ่งบัดนี้สนับสนุนขอเสนอของเราที่จะเขารวมแนวรบดานตะวันออก"
 BUL_the_third_bulgarian_empire: "จักรวรรดิบัลแกเรียที่สาม"
 BUL_the_third_bulgarian_empire_desc: "เราตองกาวขั้นสุดทายบนเสนทางสูเกียรติยศและความยิ่งใหญ ประเทศที่เคยดูแคลนบัลแกเรียในอดีตจะไมมีทางเลือกอื่นนอกจากยอมรับความเปนใหญของชาติอันเกรียงไกรของเรา \nถึงเวลาประกาศสถาปนาจักรวรรดิบัลแกเรียที่สาม!"
