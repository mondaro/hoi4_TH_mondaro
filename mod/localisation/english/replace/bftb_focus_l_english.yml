l_english:
 GRE_bring_home_the_exiled_republicans: "นํานักสาธารณรัฐที่ถูกเนรเทศกลับบาน"
 GRE_bring_home_the_exiled_republicans_desc: "เมื่อผูนําของเรา เอเลฟเทริออส เวนิเซลอส กลับมากุมอํานาจในที่สุด เราก็สามารถเชิญสหายของเรากลับมาจากการลี้ภัยอันยาวนานที่ระบอบนิยมกษัตริยบีบบังคับพวกเขาไวได เราตองการความชวยเหลือทุกทางหากจะนําประเทศกลับสูเสนทางที่ถูกตอง!"
 GRE_bring_home_the_exiled_republicans_focus_tt: "รัฐมนตรีและนายพลฝาย§Yเวนิเซลิสต§!จะกลับจากการลี้ภัยและพรอมใหแตงตั้ง"
 GRE_compromise_with_the_monarchists: "ประนีประนอมกับฝายนิยมกษัตริย"
 GRE_compromise_with_the_monarchists_desc: "เราอาจไมชอบกษัตริย แตประเทศของเราแตกแยกเพราะประเด็นนี้มานานเกินไปแลว แทนที่จะเสี่ยงกับสงครามกลางเมืองอีกครั้ง ขอใหเราเชิญฝายนิยมกษัตริยมารวมโตะเจรจาเงื่อนไขกัน ยุคแหงการตอสูไดจบลงแลว"
 GRE_compromise_with_the_monarchists_focus_tt: "§Yจอรจที่ 2§! จะคลายการกุมอํานาจเหนือประเทศและกลายเปนกษัตริยภายใตรัฐธรรมนูญ \n\n£faction_gre_monarchist §Yฝายนิยมกษัตริย§! จะกลายเปน§Gมิตร§! \n£faction_gre_communist §Yฝายคอมมิวนิสต§! จะกลายเปน§Rศัตรู§!"
 GRE_request_communist_support: "ขอการสนับสนุนจากคอมมิวนิสต"
 GRE_request_communist_support_desc: "จอรจที่ 2 ไมใชชาวกรีก และไมมีสิทธิ์ใดๆ ที่จะแทรกแซงกิจการของกรีซ! ประเทศของเราตองหลั่งเลือดมานับครั้งไมถวนเพราะสิทธิในการปกครองที่เขากุขึ้น และบัดนี้เราตองนําอาชญากรผูนี้มาลงโทษใหได! แตเราไมอาจทําเพียงลําพัง และมีเพียงกลุมเดียวเทานั้นที่เกลียดกษัตริยมากพอๆ กับเรา..."
 GRE_request_communist_support_focus_tt: "£faction_gre_communist §Yฝายคอมมิวนิสต§! จะกลายเปน§Gมิตร§! \n£faction_gre_monarchist §Yฝายนิยมกษัตริย§! จะกลายเปน§Rศัตรู§! \n\nนายพลและรัฐมนตรี£faction_gre_monarchist §Yฝายนิยมกษัตริย§!จะ§Rลาออก§!จากราชการ แตนายพลและรัฐมนตรี£faction_gre_communist §Yฝายคอมมิวนิสต§!จะ§Gพรอมใหแตงตั้ง§!"
 GRE_remembering_the_anatolian_catastrophe: "รําลึกถึงหายนะอนาโตเลีย"
 GRE_remembering_the_anatolian_catastrophe_desc: "การทัพเอเชียไมเนอรคือหายนะโดยแท ประชาชนของเราถูกสังหาร เกียรติภูมิพังทลาย และขบวนการทางการเมืองของเราถูกบดขยี้ – ทั้งหมดนี้เกิดขึ้นภายในสามป! เราไมอาจปลอยใหสิ่งนี้เปนมรดกของเรา เราตองบิดเรื่องราวใหประชาชนโทษชาวเติรกแทนที่จะโทษเรา – และบางทีหลังจากผานไปหลายป เราอาจไดทําความฝนถึงมหากรีซใหเปนจริงในที่สุด..."
 GRE_old_memories_stir_new_threats_tt: "การปลุกเราอารมณเรื่องอนาโตเลียอาจนําไปสู§Yผลที่ไมคาดคิด§!..."
 GRE_a_socialist_economy: "เศรษฐกิจสังคมนิยม"
 GRE_a_socialist_economy_desc: "ชาวกรีกหลั่งเลือดมานานเกินไปภายใตการปกครองแบบเผด็จการของกษัตริยจอมปลอมและพวกเวนิเซลิสตผูกระหายสงคราม ถึงเวลาแลวที่ประชาชนจะไดรุงเรืองภายใตรัฐบาลที่ใหความสําคัญกับพวกเขาเปนอันดับแรก!"
 GRE_restoring_our_home: "ฟนฟูบานเกิดของเรา"
 GRE_restoring_our_home_desc: "หลายปที่ผานมาโหดรายตอกรีซยิ่งนัก – เราถูกสงคราม หนี้สิน และความยากจนยํ่ายี เมื่อประชาธิปไตยกลับคืนสูแผนดินของเราแลว ถึงเวลาที่จะปฏิเสธชาวเยอรมันและชาวอิตาลีผูฉวยประโยชน เราควรมุงเนนความสัมพันธอันใกลชิดกับอังกฤษ โดยหวังวาพวกเขาจะชวยเราสรางชาติขึ้นใหม – ทั้งดานอุตสาหกรรมและจิตวิญญาณ"
 GRE_venerate_the_ancient_hellenes: "เทิดทูนชาวเฮลเลนโบราณ"
 GRE_venerate_the_ancient_hellenes_desc: "เราไมใชทายาทของชาวกรีกผูนาเคารพในอดีตหรอกหรือ? \nเราไมไดมีสายเลือดเดียวกับเหลาปรมาจารยแหงวาทศิลป ปรัชญา และการสงครามหรอกหรือ? เราจะปลูกฝงความภาคภูมิใจอันแรงกลากลับคืนสูประชาชน เพื่อที่เราจะไดกลับมาเปนดาวนําทางของยุโรปอีกครั้ง"
 GRE_the_birthplace_of_democracy: "แหลงกําเนิดประชาธิปไตย"
 GRE_the_birthplace_of_democracy_desc: "ทรราชแทบไมเคยไดรับความเคารพในใจของชาวกรีก และนั่นคือคุณลักษณะที่เราภาคภูมิใจรักษาไวตั้งแตสมัยเพริคลีส! ประชาธิปไตยคือหนึ่งในผลผลิตมากมายจากอัจฉริยภาพของเรา และเปนการสมควรแลวที่เราจะปกปองมันจากทรราชที่ไดแรงบันดาลใจจากโรมันและทิวทัน!"
 GRE_nationalized_banks: "ธนาคารของรัฐ"
 GRE_nationalized_banks_desc: "ดอยซแบงกและธนาคารแหงอังกฤษขูดรีดประชาชนกรีซมานานเกินไปแลว ยักยอกรายไดอันนอยนิดของพวกเขาและลงโทษพวกเขาจากการกระทําของรัฐบาลเผด็จการที่พวกเขาไมไดเลือก! เราขอประกาศวาชาวกรีกจะไมถูกขูดรีดอีกตอไป และเงินทุนของพวกเขาควรเปนของรัฐบาลของพวกเขาแทน!"
 GRE_soviet_subsidised_railways: "ทางรถไฟที่โซเวียตอุดหนุน"
 GRE_soviet_subsidised_railways_desc: "กรีซถูกมหาอํานาจยุโรปขมเหงมาทุกทาง ถึงเวลาแลวที่จะมองขามทะเลดํา หากเราตองการมีโอกาสปรับปรุงเศรษฐกิจของกรีซใหทันสมัย"
 GRE_agricultural_communes: "คอมมูนเกษตรกรรม"
 GRE_agricultural_communes_desc: "โลกรอบตัวเราไดกาวสูยุคอุตสาหกรรมแลว และถึงเวลาอยางยิ่งที่เราจะตามใหทัน แตประชาชนจํานวนมากของเราไมรูจักชีวิตอื่นนอกจากงานเกษตร และเราไมอาจละทิ้งรากเหงาไดงายๆ เราจะจัดระเบียบภาคเกษตรกรรมเปนคอมมูนที่มีประสิทธิภาพ เพื่อปลดปลอยแรงงานที่มีความสามารถไปสูสาขาอื่น เชน การผลิตหรืองานดานการทหาร"
 GRE_theban_warriors: "นักรบแหงธีบส"
 GRE_theban_warriors_desc: "เปาหมายของเราไมใชการสรางสังคมนักรบที่ยกยองพละกําลังเหนือสิ่งอื่นใด เราคัดคานและปฏิเสธทุกความพยายามที่จะเลียนแบบระบอบการปกครองของมุสโสลินี! เราคือชาวกรีก ไมใชชาวโรมัน! แทนที่จะสรางลัทธิบูชาชาวสปารตาผูรุนแรง ขอใหเราเฉลิมฉลองชาวธีบส – ผูโคนลมความเปนเจาของสปารตาดวยไหวพริบ!"
 GRE_athenian_thinkers: "นักคิดแหงเอเธนส"
 GRE_athenian_thinkers_desc: "นักคิดที่ยอดเยี่ยมที่สุดบางคนของมนุษยชาติมาจากเอเธนส และดวยการสงเสริมศิลปะและวิทยาศาสตรเพียงเล็กนอย เราจะไดเห็นปราชญผูยิ่งใหญผุดขึ้นทั่วกรีซอีกครั้ง!"
 GRE_macedonian_generals: "นายพลแหงมาซิโดเนีย"
 GRE_macedonian_generals_desc: "อเล็กซานเดอรมหาราชเคยแผอาณาเขตครอบครองดินแดนสวนใหญของโลกเปนของตน และพระองคทําทั้งหมดนั้นจากมาซิโดเนียอันตํ่าตอย สิ่งที่ทําใหพระองคยิ่งใหญไหลเวียนอยูในสายเลือดของพวกเราทุกคน และเราควรยึดอเล็กซานเดอรและราชวงศอารกีดเปนแบบอยางแหงความเปนเลิศดานการบัญชาการของกรีก"
 GRE_the_greek_industrial_revolution: "การปฏิวัติอุตสาหกรรมกรีก"
 GRE_the_greek_industrial_revolution_desc: "กรีซควรเปนประเทศอุตสาหกรรมมาหลายทศวรรษแลว แตนักการเมืองฉอฉลและมหาอํานาจตางชาติที่เขามาแทรกแซงทําใหเราเหลือเพียงระบบเศรษฐกิจจากยุคที่ลวงเลยไปแลว เราไมมีเวลามากพอจะคอยๆ เปลี่ยนวิถีชีวิต เราตองเริ่มตอนนี้และลงมืออยางรวดเร็ว"
 GRE_industry_bypass_tt: "ชองกอสรางไมพอสําหรับ§Yโรงงานทหาร§!หรือ§Yโรงงานพลเรือน§!"
 GRE_red_militias: "กองกําลังอาสาแดง"
 GRE_red_militias_desc: "มีหลายฝายที่พยายามขัดขวางความพยายามของเราในการปรับปรุงสังคมกรีกใหทันสมัย แตดวยการจัดตั้งกองกําลังอาสาที่อุทิศตนปกปองการปฏิวัติ พวกเขาจะยิ่งหยุดเราไดยากขึ้น"
 GRE_clearing_land_for_industrial_expansion: "ถางที่ดินเพื่อขยายอุตสาหกรรม"
 GRE_clearing_land_for_industrial_expansion_desc: "ไรมะกอก องุน และยาสูบเรียงรายอยูบนเนินเขามากมายของกรีซ เชนเดียวกับโบสถจํานวนมาก – โบราณวัตถุจากจักรวรรดิไบแซนไทน เราไมจําเปนตองมีสิ่งแรกทั้งหมด และกรีซใหมไมมีที่วางสําหรับสิ่งหลัง ขอใหเรานําที่ดินที่ยึดมานี้มาใชประโยชนดวยการสรางโรงงานเพื่อผูใชแรงงาน!"
 GRE_the_anatolian_refugees: "ผูลี้ภัยจากอนาโตเลีย"
 GRE_the_anatolian_refugees_desc: "หลังหายนะอนาโตเลีย เราถูกบังคับใหรับผูลี้ภัยชาวกรีกเกือบสองลานคนที่เคยอาศัยอยูในตุรกี เราไมไดเตรียมพรอม และสถานการณก็ยิ่งเลวรายจนแทบรับไมไหว บัดนี้ผูลี้ภัยกําลังถูกจัดตั้งทางการเมืองภายใตการนําของเกออรกิออส คอสมิดิส ผูลี้ภัยจากอนาโตเลียอีกคนหนึ่ง ขบวนการของพวกเขาใหญเกินกวาจะเพิกเฉย และทายที่สุดแลว เปาหมายของเราตางกันจริงหรือ?"
 GRE_depose_the_reactionaries: "โคนลมพวกปฏิกิริยา"
 GRE_depose_the_reactionaries_desc: "เราอดทนกับการรวมรัฐบาลกับพวกเวนิเซลิสตมานานพอแลว วาระเสรีนิยมของพวกเขาขัดตอหลักลัทธิมารกซของเรา และถึงเวลาแลวที่จะยุติความสัมพันธอันนาขันนี้ เพื่อการปฏิวัติ!"
 GRE_resurrecting_the_megali_idea: "ฟนคืนเมกาลีไอเดีย"
 GRE_resurrecting_the_megali_idea_desc: "เราไดรับสัญญาเรื่องเมกาลีไอเดียในป 1919 แตหลังสงครามกรีก-ตุรกีที่ตามมา ความฝนนั้นแทบจะดับสูญไปตลอดกาล แตตราบใดที่ชาวเติรกยังคงแปดเปอนดินแดนอันยิ่งใหญในอดีตของเราดวยการดํารงอยูของพวกเขา เราก็จะยังคงปรารถนาสิ่งที่ชอบธรรมเปนของเรา ชาวกรีกเคยจดจําสิ่งนี้ไดครั้งหนึ่ง และพวกเขาสามารถถูกทําใหจดจําไดอีกครั้ง..."
 GRE_megali_idea_conference_invites_tt: "จะมีการสงคําเชิญเขารวม§Yการประชุมเมกาลี§!เมื่อเลือกแผนยุทธศาสตรนี้"
 GRE_prepare_for_the_great_anti_fascist_war: "เตรียมพรอมสําหรับมหาสงครามตอตานฟาสซิสต"
 GRE_prepare_for_the_great_anti_fascist_war_desc: "ลัทธิฟาสซิสตคือภัยคุกคามที่ยิ่งใหญที่สุดตอหลักลัทธิมารกซ – มันคือความทาทายทางอุดมการณที่บดขยี้ไดในสนามรบเทานั้น สหภาพโซเวียตไมไดทําอะไรเพื่อยับยั้งการแพรกระจายของลัทธิฟาสซิสต ภาระนี้จึงตกเปนของเรา"
 GRE_ally_tito: "เปนพันธมิตรกับตีโต"
 GRE_ally_tito_desc: "ไมมีนักปฏิวัติคนใดอุทิศตนตอหลักลัทธิมารกซตอตานสตาลินของเรามากไปกวายอซีป บรอซ ตีโต แหงยูโกสลาเวีย เราอาจไมชอบนัก แตเราตองการเขาและเพื่อนรวมชาติของเขารวมเปนหนึ่งเดียวกับเราภายใตธงแหงความเปนพี่นอง ตอตานพวกฟาสซิสตกระหายเลือดและพวกบอลเชวิคทรยศ"
 GRE_tow_the_stalinist_line: "เดินตามแนวทางสตาลิน"
 GRE_tow_the_stalinist_line_desc: "เราเปนหนี้การปฏิวัติของเราตอปราชญผูยิ่งใหญในสหภาพโซเวียต หากไมมีคุณูปการของพวกเขา เราอาจไมมีวันยึดอํานาจในกรีซได! เรายืนหยัดเคียงขางสหายของเราในมอสโก"
 GRE_horror_and_fear: "ความสยดสยองและความหวาดกลัว"
 GRE_horror_and_fear_desc: "ไดมอสและโฟบอส – ความสยดสยองและความหวาดกลัว ทั้งสองคือบุตรแฝดของเอรีส เทพแหงสงคราม ชาวสปารตาหลั่งเลือดในสนามรบเพื่อเปนเกียรติแกบุตรแหงเอรีส เราเองแมโดดเดี่ยวและลําพัง ก็จะหลั่งเลือดในสนามรบเพื่อเปนเกียรติแกอดีตอันรุงโรจนของเราเชนกัน"
 GRE_the_gordian_knot: "ปมกอรเดียน"
 GRE_the_gordian_knot_desc: "ปมกอรเดียนเปนสวนหนึ่งของตํานานอเล็กซานเดอรมหาราช และกลายมาเปนความหมายของการแกปญหาที่ดูเหมือนเปนไปไมไดดวยการตัดสินใจอันเด็ดขาด ภารกิจที่เปนไปไมไดของเราคือการยึดดินแดนที่สูญเสียไปคืน – และการตัดสินใจอันเด็ดขาดของเราคือการใหพันธมิตรผูทรงอํานาจยึดมาใหเรา"
 GRE_megali_idea_approved: "อนุมัติ§Yเมกาลีไอเดีย§!แลว"
 GRE_megali_convention_a_failure: "การประชุมเฮราคลิออนลมเหลว"
 GRE_gordian_knot_tt: "ผูลงนามทุกรายที่ไมใช§Yอิตาลี§!จะประกาศสงครามกับ§Yตุรกี§!รวมกับ§Yกรีซ§! เพื่อปฏิบัติตามขอกําหนดของ§Yการประชุมเมกาลี§!"
 GRE_secure_the_aegean: "รักษาความมั่นคงในทะเลอีเจียน"
 GRE_secure_the_aegean_desc: "เรามุงแกปญหาอีกฟากหนึ่งของยุโรป แตกลับเพิกเฉยตอภัยคุกคามที่อยูหนาประตูบาน ชาวเติรกตามหลอกหลอนชาวกรีกในฐานะศัตรูคูอาฆาตมาหลายศตวรรษ และแมเราเคยหวังจะสรางเสนทางใหมที่สดใสกวา แตก็ชัดเจนแลววาเราไมอาจชนะอนาคตไดจนกวาจะแกไขอดีตใหถูกตอง"
 GRE_dominate_the_bulgarians: "ครอบงําบัลแกเรีย"
 GRE_dominate_the_bulgarians_desc: "ชาวบัลแกเรียคุกคามความปลอดภัยของกรีซครั้งแลวครั้งเลา พวกเขาเคยถูกเรียกวา ‘ปรัสเซียแหงบอลขาน’ – ชางนาขันเสียจริง เราจะไมยอมใหพวกเขาทําใหความปลอดภัยของกรีซตกอยูในอันตรายอีกแลว"
 GRE_stage_an_incident_in_the_bosporus: "จัดฉากเหตุการณในชองแคบบอสพอรัส"
 GRE_stage_an_incident_in_the_bosporus_desc: "โปลิตบูโรของโซเวียตไมเคยปดบังความตองการที่จะควบคุมคอนสแตนติโนเปล ดวยความชวยเหลือของเรา โซเวียตตัดสินใจเริ่มกาวแรกที่เปนรูปธรรมเพื่อเขาควบคุมชองแคบบอสพอรัส และกรีซมีบทบาทสําคัญอยางยิ่ง..."
 SOV_isolating_turkey: "สนับสนุนความทะเยอทะยานตอตุรกี"
 GRE_reviving_the_double_headed_eagle: "ฟนคืนนกอินทรีสองหัว"
 GRE_reviving_the_double_headed_eagle_desc: "พวกเวนิเซลิสตคือพวกขี้ขลาดที่ไมยอมใหกรีซฟนคืนความรุงโรจนที่แทจริงซึ่งสูญเสียไป – ความรุงโรจนแหงไบแซนเทียม! ทําไมตองหยุดแคชายฝงของตุรกี ในเมื่อเราสามารถยึดดินแดนที่สูญเสียไปทั้งหมดของจักรวรรดิคืนได? ยุคใหมแหงความรุงโรจนของกรีซไดเริ่มตนขึ้นแลว!"
 GRE_nenikikamen: "เนนิคีคาเมน"
 GRE_nenikikamen_desc: "[Root.GetNenikikamenDesc]"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_STANDARD: "เราชนะแลว! ในที่สุดเวนิเซลอสก็ไดรับการพิสูจนวาถูกตองหลังจากผานมาหลายป! เมกาลีไอเดียไดชัยเหนือผูคัดคานและผูที่พยายามขัดขวางชะตากรรมของเรา และบัดนี้เรายืนอยูบนธรณีประตูแหงยุคใหมของกรีซ - ยุคทอง!"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_BYZANTINE: "เราชนะแลว! ไบแซนเทียมไดรับการลางแคนหลังจากผานมาหลายป! การยึดเมืองหลวงจักรวรรดิเกาของเราคืนทําใหเราเขาใกลชะตากรรมไปอีกกาว! เรายืนอยูบนธรณีประตูแหงยุคใหมของกรีซ - ยุคที่ถือกําเนิดจากเลือดและไฟ! คอสมิดิสผูมีชัย!"
 GRE_attack_the_fascists: "โจมตีพวกฟาสซิสต"
 GRE_attack_the_fascists_desc: "ลัทธิฟาสซิสตคือไวรัส มันแพรกระจายจากประเทศสูประเทศในยุโรปดั่งโรคระบาด ลัทธิคอมมิวนิสตคือยารักษา และเราจะใหยานั้นแกพวกเขาดวยกําลัง!"
 GRE_revolutionaries_of_the_south: "นักปฏิวัติแหงทางใต"
 GRE_revolutionaries_of_the_south_desc: "เราจะไมมีวันเห็นพองกับสหายในมอสโกไดทุกเรื่อง แตตราบใดที่กรีซกําหนดหลักการปฏิวัติของตนเอง ที่นี่ – ทางตอนใตของยุโรป – เราจะใชชีวิตอยางเสรีในลัทธิคอมมิวนิสตที่แทจริงของเรา!"
 GRE_phoideratoi: "ฟอยเดราตอย"
 GRE_phoideratoi_desc: "บรรพบุรุษของเรามีสติปญญาพอที่จะรวมมือกับพวกอนารยชนเมื่อจําเปน และวันนี้เราก็มีความจําเปนนั้นอยางแนนอน เราตองใหสิทธิ์แกอดีตราษฎรทุกคนของจักรวรรดิที่เห็นใจการตอสูของเรากับโลกสมัยใหม ไดเขามารวมรบในกองทัพอันยิ่งใหญของเรา! เราจะรวมกันเปนหนึ่งเดียว เดินหนาสูชัยชนะ!"
 GRE_the_die_is_cast: "ลูกเตาถูกทอดแลว!"
 GRE_the_die_is_cast_desc: "ความฝนของเราเปนจริงแลว แตโลกยังคงตกอยูในอันตราย! เสนแบงไดถูกขีดไวแลว และกรีซจะมีสวนกําหนดวาความขัดแยงที่กําลังจะมาถึงจะจบลงอยางไร!"
 GRE_byzantine_themata: "ระบบธีมาแหงไบแซนไทน"
 GRE_byzantine_themata_desc: "โลกเปลี่ยนไปมากนับตั้งแตการลมสลายของคอนสแตนติโนเปล และการพิชิตดินแดนก็กลายเปนกิจการที่ซับซอนยิ่งนัก เราไมอาจคาดหวังใหประชาชนที่เพิ่งถูกพิชิตกลับคืนมาของจักรวรรดิรับใชเราเพียงเพราะเราตองการ เราตองใหพวกเขาปกครองตนเองในระดับหนึ่งและรวมมือกับฝายบริหารทองถิ่นของดินแดนที่พิชิตมาเหลานี้ เพื่อใหจักรวรรดิของเรามั่นคงอีกครั้ง นี่เปนเพียงราคาเล็กนอยที่ตองจาย"
 byz_restore_byzantine_empire_category_tt: "ปลดล็อกการตัดสินใจ§Yฟนฟูจักรวรรดิไบแซนไทน§!"
 GRE_the_kings_government: "รัฐบาลของกษัตริย"
 GRE_the_kings_government_desc: "การแทรกแซงอยางทันทวงทีของพระองคไดหยุดยั้งพวกเวนิเซลิสตจากการจัดตั้งรัฐบาลใหม และทันเวลาพอดี! ยังมีงานตองทํา! เดเมิรตซิสไดทําหนาที่ของเขาในฐานะผูไกลเกลี่ยสายกลางเสร็จสิ้นแลว แตบัดนี้กรีซตองการหัวหนารัฐบาลที่เขมแข็งกวานี้"
 GRE_the_right_to_rule: "สิทธิในการปกครอง"
 GRE_the_right_to_rule_desc: "ทําไมตองแตงตั้งเผด็จการมาทําหนาที่แทนกษัตริย ในเมื่อกษัตริยทรงสามารถปกครองไดดวยพระองคเอง! อยายึดติดกับประเพณีขณะที่กรีซกําลังทุกขยาก ถึงเวลาแลวสําหรับกษัตริยที่แทจริงผูรับใชประชาชน! ขอพระเจาทรงคุมครองพระเจาจอรจที่ 2!"
 GRE_abandon_french_italian_debt_tt: "เราจะเลิกชําระหนี้ที่มีตอ§Yฝรั่งเศส§!และ§Yอิตาลี§!\n"
 GRE_absolute_monarchy_opposition_tt: "§Rการเลือกเสนทางนี้จะนําไปสูสงครามกลางเมือง!§! \n§Yฝายเวนิเซลิสต§!จะ§Rกอกบฏ!§! \n§Yฝายคอมมิวนิสต§!จะ§Rกอกบฏ!§!"
 GRE_metaxism_focus: "ลัทธิเมทาซัส"
 GRE_metaxism_focus_desc: "กษัตริยทรงเปนประมุขแหงรัฐอยางไมมีขอโตแยง แตชาวกรีกยังคงไมสบายใจกับการจัดการเชนนี้ อาจไมใชทางที่ดีที่สุด แตมีอดีตนายทหารผูมีความสามารถและทุมเทยิ่งนักรออยูเบื้องหลังเพื่อจัดตั้งรัฐบาล..."
 GRE_metaxism_warning_tt: "\nหาก§Yกรีซ§!เขารวมฝายกอนจะอัปเกรดจิตวิญญาณแหงชาติ§Yลัทธิเมทาซัส§!จนสมบูรณ จิตวิญญาณแหงชาตินี้จะถูก§Rลบออก§!\n"
 GRE_the_hellenic_spirit: "จิตวิญญาณแหงเฮลเลนิก"
 GRE_the_hellenic_spirit_desc: "เราตอสูเพื่อรักษาเปลวไฟศักดิ์สิทธิ์ที่เคยทําใหกรีซยิ่งใหญในกาลครั้งหนึ่งใหลุกโชนตอไป เราสามารถยิ่งใหญไดอยางแทจริง เรารูดี! เราเพียงตองคนหาประกายไฟนั้นอีกครั้ง..."
 GRE_four_year_plan: "แผนสี่ป"
 GRE_four_year_plan_desc: "เมทาซัสไดวางแผนอันยอดเยี่ยมเพื่อพัฒนากรีซสูความเปนอุตสาหกรรม โดยอิงจากแบบจําลองเศรษฐกิจบรรษัทนิยมของอิตาลี เราจะพึ่งพาตนเองไดในระดับหนึ่งและเปนอิสระจากมหาอํานาจที่พันธนาการเราไว"
 GRE_petition_britain_for_aid: "[Root.GetGreekPetitionForAidName]"
 GRE_PETITION_FOR_AID_FOCUS_NAME_STANDARD: "รองขอความชวยเหลือจากอังกฤษ!"
 GRE_PETITION_FOR_AID_FOCUS_NAME_MONARCHIST: "รองขอความชวยเหลือจากอังกฤษและเยอรมนี!"
 GRE_petition_britain_for_aid_desc: "[Root.GetGreekPetitionForAidDesc]"
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_STANDARD: "พวกฝูงชนไดแสดงความไมพอใจเล็กๆ นอยๆ ตอการปกครองของกษัตริยผานการดื้อแพงและการขูวาจะกอสงครามกลางเมือง ขณะนี้ศัตรูของเราไดเปรียบ จึงไมใชเรื่องนาอายที่จะขอใหพันธมิตรอังกฤษชวยเหลือในการตอสูของเรา เมื่อมีอังกฤษอยูขางเรา ไมมีทางที่เราจะแพ"
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_MONARCHIST: "พวกฝูงชนไดแสดงความไมพอใจเล็กๆ นอยๆ ตอการปกครองของกษัตริยผานการดื้อแพงและการขูวาจะกอสงครามกลางเมือง ขณะนี้ศัตรูของเราไดเปรียบ จึงไมใชเรื่องนาอายที่จะขอใหพันธมิตรชวยเหลือในการตอสูของเรา เมื่อมีอังกฤษและเยอรมนีอยูขางเรา ไมมีทางที่เราจะแพ"
 GRE_monarchist_civil_war: "สงครามกลางเมืองเรื่องการปกครองแบบสมบูรณาญาสิทธิ์ของจอรจที่ 2 ไดเริ่มขึ้นแลว"
 GRE_the_national_youth_organisation: "องคการเยาวชนแหงชาติ"
 GRE_the_national_youth_organisation_desc: "วิธีที่เยอรมนีและอิตาลีจัดระเบียบเยาวชนของพวกเขานั้นมีบางอยางที่นาชื่นชม เราสามารถปรับใชแบบจําลองของพวกเขาเพื่อใหมั่นใจวาเยาวชนของเราจะไมประพฤติตนตอตานสังคมหรือไมเคารพผูนําผูยิ่งใหญของเรา [ROOT.GetLeader]"
 GRE_crack_down_on_the_republicans: "ปราบปรามฝายสาธารณรัฐ"
 GRE_crack_down_on_the_republicans_desc: "เราตามใจพวกเวนิเซลิสตมานานเกินไปแลว - ถึงเวลายุติละครฉากนี้ พวกเขาไมมีเกียรติหรือความเคารพแมแตนอย ไรซึ่งศีลธรรมโดยสิ้นเชิง และเราจะขับไลพวกเขาออกจากกรีซเหมือนกับสัตวชั้นตํ่าที่พวกเขาเปน!"
 GRE_use_the_military: "ใชกองทัพ"
 GRE_use_the_military_desc: "เราจะโจมตีพวกเขาดวยทุกสิ่งที่เรามี! เราจะตามลาพวกเขาบนทองถนน ในตรอกซอกซอย และไปจนสุดขอบโลก! อยาใหพวกเวนิเซลิสตคนใดคิดวาตนปลอดภัยจากการปกครองที่เฝาระวังตลอดเวลาของเรา!"
 GRE_recruit_the_fascists: "ดึงพวกฟาสซิสตมาเปนพวก"
 GRE_recruit_the_fascists_desc: "จะจับพวกหัวรุนแรงได ตองคิดแบบพวกหัวรุนแรงใหเปน พวกฟาสซิสตเปนศัตรูที่นารังเกียจของเรา แตในบรรดาศัตรูทั้งหมด เราเกลียดพวกเขานอยที่สุดอยางแนนอน พวกเขายินดีรวมมือกับเรา แลวทําไมเราจะไมใชพวกเขาเพื่อเปาหมายของเราเองละ?"
 GRE_fascists_put_in_play_tt: "§Yกลุมฟาสซิสต§!จะเริ่มเคลื่อนไหวและมีทาที§Gเปนมิตร§!ตอรัฐบาลตั้งแตแรก \nการรวมมือกับ§Yพวกฟาสซิสต§!เทากับเราใหความชอบธรรมแกขบวนการของพวกเขา"
 GRE_realign_ourselves_with_the_central_powers: "กลับไปผูกมิตรกับฝายมหาอํานาจกลาง"
 GRE_realign_ourselves_with_the_central_powers_desc: "สิ่งที่เปนไปไมไดไดเกิดขึ้นแลว! ทานผูนําหายไปและไกเซอรกลับมา! นโยบายตางประเทศของอังกฤษไดปรับเปลี่ยนตามเหตุการณเหลานี้ และไมจําเปนวาจะเปนประโยชนตอเรา บางทีเราควรเชื่อมโยงกับญาติของเราในเบอรลิน และตอสูเพื่อปกปองเทวสิทธิ์ของกษัตริยทั่วยุโรป"
 GRE_AUS_is_HUN_EMPIRE_tt: "ออสเตรียไดกอตั้ง§Y$HUN_EMPIRE_neutrality$§!แลว"
 GRE_no_central_powers_tt: "ตองมี§Yออสเตรีย-ฮังการี§!หรือ§Yไกเซอรไรช§!อยู จึงจะทําใหแผนยุทธศาสตรนี้มีผล"
 GRE_our_traditional_allies_in_the_aegean: "พันธมิตรดั้งเดิมของเราในทะเลอีเจียน"
 GRE_our_traditional_allies_in_the_aegean_desc: "ใครชวยใหเราไดรับเอกราชจากออตโตมันในป 1832? อังกฤษ ใครคอยประคับประคองเศรษฐกิจของเราดวยเงินกูและการลงทุนมาหลายปดีดัก? อังกฤษ อนาคตของกรีซอยูกับมหาอํานาจใด? อยูกับอังกฤษ!"
 GRE_metaxism_lost_tt: "หากเรายังไมไดดําเนินการปฏิรูปครั้งสุดทายของเมทาซัส เราจะสูญเสียจิตวิญญาณแหงชาติ§Yลัทธิเมทาซัส§!!"
 GRE_prepare_against_the_mediterranean_threat: "เตรียมรับมือภัยคุกคามจากเมดิเตอรเรเนียน"
 GRE_prepare_against_the_mediterranean_threat_desc: "ชาวอิตาลีคือภัยรายที่ความทะเยอทะยานสวนทางกับชะตากรรมของกรีซ เราไมไดอะไรจากการรอคอยและแสรงทําเปนวาพวกเขาไมใชภัยคุกคาม เราจะลงมือ เพื่อวาเมื่อชาวอิตาลียกพลขึ้นฝงของเราในที่สุด พวกเขาจะถูกผลักดันกลับลงทะเลที่พวกเขาโผลขึ้นมาดวยความรวมแรงรวมใจของชาวกรีกนับลาน!"
 GRE_the_metaxas_line: "ชวงแรกของ§Yแนวเมทาซัส§! - แนวปอมปราการทางบกเรียงรายตามพรมแดนที่มักถูกคุกคามของเรา - จะสรางเสร็จ\n"
 GRE_the_leonidas_line: "ชวงแรกของ§Yแนวลีโอนิดาส§! - แนวปอมปราการทางบกเรียงรายตามพรมแดนที่มักถูกคุกคามของเรา - จะสรางเสร็จ\n"
 GRE_an_orthodox_state: "รัฐออรโธดอกซ"
 GRE_an_orthodox_state_desc: "เราคือรัฐคริสตนิกายออรโธดอกซ - ซึ่งเปนสวนสําคัญยิ่งของอัตลักษณแหงชาติ ขอพระสิริจงมีแดพระองค ขาแตพระเจา ผูเปนความหวังของเรา ขอพระสิริจงมีแดพระองค"
 GRE_following_in_the_footsteps_of_giants: "เดินตามรอยยักษใหญ"
 GRE_following_in_the_footsteps_of_giants_desc: "เมทาซัสไดชวยแสดงใหเราเห็นขอดีมากมายของลัทธิฟาสซิสต แตเขาขี้ขลาดเกินกวาจะพาเราไปใหสุดทาง เราตองการลัทธิฟาสซิสตที่แทจริง: ฟาสซิสตแบบกรีก - ไมใชการลอกเลียนแบบราคาถูกจากแบบจําลองของอิตาลีหรือเยอรมนี"
 GRE_if_does_right_to_rule_effect_tt: "หากแผนยุทธศาสตร§Y$GRE_the_right_to_rule$§!สําเร็จแลว:\n"
 GRE_if_does_metaxism_effect_tt: "หากแผนยุทธศาสตร§Y$GRE_metaxism_focus$§!สําเร็จแลว:\n"
 no_fascist_metaxism_spirit_tt: "หากยังไมไดเลือกแผนยุทธศาสตร§Yปลุกจิตวิญญาณนักรบสปารตา§! จิตวิญญาณแหงชาติ§Yลัทธิเมทาซัส§!จะไมถูกเปลี่ยนเปนฟาสซิสต แตจะถูก§Rลบออก§!แทน"
 GRE_reclaiming_the_wayward_ally: "ดึงพันธมิตรที่หลงทางกลับมา"
 GRE_reclaiming_the_wayward_ally_desc: "การลมสลายของจักรวรรดิออตโตมันทําใหเราโลงใจอยางมาก แตสาธารณรัฐตุรกีกลับเปนภัยคุกคามตอกรีซยิ่งกวาออตโตมันที่มากอนเสียอีก ยุคสมัยแปลกประหลาดตองการพันธมิตรที่แปลกประหลาดยิ่งกวา เปนหนาที่ของกรีซที่จะนําออตโตมันกลับคืนมา"
 GRE_the_greater_enosis: "บรรลุเอโนซิส"
 GRE_the_greater_enosis_desc: "[Root.GetAchievingEnosisDesc]"
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_STANDARD: "ไซปรัสเปนของกรีกมาโดยตลอดและจะเปนตลอดไป บางทีเราอาจยังไมพรอมในตอนที่อังกฤษชวงชิงโอกาสในการรวมชาติไปจากเรา แตบัดนี้รัฐของเรายอมแข็งแกรงและมั่นคงพอสําหรับการรวมประชาชนของเราเปนหนึ่งเดียวแลว! ถึงเวลายุติการยึดครองไซปรัสโดยตางชาติ เพื่อใหเกาะไซปรัสไดรวมเขากับชาติกรีกที่มันควรอยู"
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_ALTERNATE: "ไซปรัสเปนของกรีกมาโดยตลอดและจะเปนตลอดไป บางทีเราอาจยังไมพรอมในตอนที่อังกฤษชวงชิงโอกาสในการรวมชาติไปจากเรา แตเมื่อไซปรัสไดรับเอกราชแลว ก็ถึงเวลาแกไขความผิดพลาดในอดีต! ความฝนที่จะปกครองตนเองเหลานี้เพอฝนจนถึงขั้นหยิ่งผยอง ชาวไซปรัสยอมตองเห็นวาพวกเขาปลอดภัยที่สุดเมื่อไดเปนสวนหนึ่งของชาติกรีก"
 GRE_securing_the_bulgarian_menace: "จัดการภัยคุกคามจากบัลแกเรีย"
 GRE_securing_the_bulgarian_menace_desc: "มีเมื่อไหรบางที่ชาวบัลแกเรียไมไดเปนภัยตอบูรณภาพแหงดินแดนของกรีซ? เราจะไวใจไดอยางไรวารัฐบาลบัลแกเรียจะไมไปตกลงกับมหาอํานาจที่ใหญกวาเพื่อสมคบคิดตอตานเรา? บางคนอาจเรียกวาหวาดระแวง แตเราเรียกวาประสบการณ เราตองดึงบัลแกเรียมาอยูฝายเราเพื่อปกปองผลประโยชนของเรา"
 GRE_third_hellenic_civilization: "อารยธรรมเฮลเลนิกที่สาม"
 GRE_third_hellenic_civilization_desc: "โลกยังคงไมเห็นเราเปนทายาทแหงมรดกไบแซนไทนและเฮลเลนิก พวกเขายกยองบรรพบุรุษของเรา แตกลับดูแคลนเราในวันนี้อยางเหยียดหยาม เราจะทําใหพวกเขาเห็น - เราไมใชจักรวรรดิไบแซนไทน และไมใชชาวกรีกในอดีตกาล เราคืออารยธรรมเฮลเลนิกที่สาม และเราจะสรางผลงานอันยิ่งใหญที่ภาคภูมิใจไดวาเปนของเราเอง!"
 GRE_the_modern_movement: "ขบวนการสมัยใหม"
 GRE_the_modern_movement_desc: "ลัทธิฟาสซิสตคือหลักความเชื่อแหงศตวรรษที่ 20 - เปนคําตอบตอขอบกพรองของทุนนิยมที่ไรการควบคุมและความฉอฉลของคอมมิวนิสต ลัทธิฟาสซิสตคือเสียงเรียกรวมพลของคนทั้งรุน คนรุนที่ทนการรังแกจากตางชาติมามากพอแลว! คนรุนที่ทนความอัปยศของชาติมามากพอแลว! คนรุนที่พรอมนํากรีซสูยุคใหมในฐานะมหาอํานาจ - พรอมตอบโตทุกภัยคุกคามและทุกการดูหมิ่น! เอรา!"
 GRE_required_fascist_faction_loyalty_tt: "§Yกลุมฟาสซิสต§!ตอง§Gจงรักภักดี§!"
 GRE_expansion_of_athens_university: "ขยายมหาวิทยาลัยเอเธนส"
 GRE_expansion_of_athens_university_desc: "วิทยาศาสตรและการศึกษาขั้นสูงเปนสวนสําคัญของขนบธรรมเนียมกรีกมาโดยตลอด และไมมีสถาบันการศึกษาใดสําคัญตอกรีซในปจจุบันมากไปกวามหาวิทยาลัยแหงชาติและคาโปดิสตริอันแหงเอเธนส ดวยการจัดสรรเงินทุนและพื้นที่เพิ่มเติมเพื่อการขยายตัว เราจะเพิ่มประโยชนของสถาบันนี้ตอรัฐไดอยางมาก"
 GRE_defending_our_kingdom: "ปกปองราชอาณาจักรของเรา"
 GRE_defending_our_kingdom_desc: "นักวิชาการบางคนกลาววา เมื่อพิจารณาพัฒนาการทางการเมืองลาสุดในยุโรป ภัยคุกคามที่ยิ่งใหญที่สุดตอรัฐอาจมาจากภายใน ไรสาระสิ้นดี! เพื่อนบานของเราตางหาก - ที่คอยวางแผนสมคบคิดตอตานเราอยูเสมอ - คือภัยคุกคามที่แทจริง! เราพายแพมามากพอแลว แตในสงครามครั้งหนา เราจําเปนอยางยิ่งที่ตองไดรับชัยชนะ"
 GRE_hellenoturkism: "ลัทธิเฮลเลโน-เติรก"
 GRE_hellenoturkism_desc: "ภายในพรรคชาติสังคมนิยมกรีกแทบทุกคนปรารถนาที่จะกระชับความสัมพันธกับตุรกีใหลึกซึ้งยิ่งขึ้น เราตอสูและหลั่งเลือดกันมาหลายศตวรรษจนไมมีใครคิดถึงสิ่งมหัศจรรยที่เราอาจทําไดรวมกัน! เราทั้งสองตองผูกตนเขากับมหาอํานาจฟาสซิสตเพื่อความมั่นคง! หวังวาชาวเติรกจะมองเหมือนเรา..."
 GRE_cement_greco_german_ties: "กระชับสัมพันธกรีซ-เยอรมนี"
 GRE_cement_greco_german_ties_desc: "ความจริงที่ฝายซายหลายคนชอบลืมคือ หากไมใชเพราะนโยบายการคลังอันเอื้อเฟอของเยอรมนีที่มีตอเรา เราคงลมสลายอีกครั้งไปหลายปแลว ไมมีสิ่งใดที่เราทําสําเร็จมาจนถึงตอนนี้จะเปนไปไดหากไมมีเยอรมนี! เราตองการพวกเขามากกวาที่พวกเขาตองการเรา แตเรายังสามารถตอรองขอตกลงที่ดีกวาจากพวกเขาไดในนามของมิตรภาพอันใกลชิดและลํ้าคาของเรา"
 schachtplan_required_tt: "ไมมี§Yแผนชาคท§!ในรูปแบบใดๆ"
 GRE_protectors_of_the_mediterranean: "[Root.GetProtectorsMediterraneanName]"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_STANDARD: "ผูพิทักษแหงเมดิเตอรเรเนียน"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_MONARCHIST: "ผูเกรียงไกรแหงเมดิเตอรเรเนียน"
 GRE_protectors_of_the_mediterranean_desc: "[Root.GetProtectorsMediterraneanDesc]"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_STANDARD: "เมดิเตอรเรเนียนคือบานของเรา และบานของผูคนอีกนับลาน เราปรารถนามาตลอดที่จะสรางสันติภาพอันยั่งยืนในมุมเล็กๆ ของโลกใบนี้ แตเปาหมายอันนาชื่นชมเหลานี้มักถูกขัดขวางโดยผูที่มีเจตนาราย เราไมอาจยอมจํานนและปลอยใหตัวเราหรือเพื่อนบานตองทุกขทรมานเพราะการกระทําของผูที่มุงรายไดอีกตอไป ถึงเวลาลุกขึ้นยืนหยัดเพื่อสิ่งที่ถูกตอง"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_MONARCHIST: "เมดิเตอรเรเนียนคือบานของเรา และบานของผูคนอีกนับลาน เราปรารถนามาตลอดที่จะสรางสันติภาพอันยั่งยืนในมุมเล็กๆ ของโลกใบนี้ แตเปาหมายอันนาชื่นชมเหลานี้มักถูกขัดขวางโดยผูที่มีเจตนาราย ก็ได ถาเอาชนะพวกเขาไมได - ก็เขารวมกับพวกเขาเสีย เราจะสรางจักรวรรดิกรีกอันเกรียงไกรขึ้นมาเอง และในที่สุดก็จะใหความเปนธรรมแกผูที่มักถูกเหยียบยํ่า"
 GRE_reviving_the_spartan_warrior_spirit: "ปลุกจิตวิญญาณนักรบสปารตา"
 GRE_reviving_the_spartan_warrior_spirit_desc: "กลาวกันวาในยุทธการที่เทอรมอพิลี ชาวสปารตาสี่พันคนสามารถสังหารชาวเปอรเซียไดสองหมื่นคนขณะสกัดกั้นไมใหเซอรซีสรุกเขากรีซตอไป วันนี้เราตองการความกลาหาญเชนนั้นมากกวาที่เคย เพื่อวาเมื่อผูที่หมายจะพิชิตคนตอไปปรากฏตัวที่ชานกรุงเอเธนสเพื่อพรากบานและชีวิตของเรา เราจะมีความกลาที่จะเผชิญหนาและกลาววา: โมลอน ลาเบ"
 GRE_subjugating_the_bulgarians: "พิชิตบัลแกเรีย"
 GRE_subjugating_the_bulgarians_desc: "ชาวบัลแกเรียคือศัตรูตลอดกาลของเรา พวกเขามีอยูเพียงเพื่อเปนมีดที่แทงขางหลังเรา อารยธรรมอันนาสมเพชของพวกเขาไมเคยมีคาอะไร พวกเขาจึงพยายามทําลายมรดกและชาติของเราทุกโอกาส พอกันที - ขอใหเราเตือนชาวบัลแกเรียวาเหตุใดเราจึงเปนหนึ่งในชนชาติที่เกาแกที่สุดที่ยังอยูรอดในยุโรป"
 GRE_greece_and_turkey_in_the_axis: "กรีซและตุรกีรวมกันในฝายอักษะ!"
 GRE_greece_and_turkey_in_the_axis_desc: "เมื่อสนธิสัญญามิตรภาพกรีซ-ตุรกีไดรับการลงนามและใหสัตยาบันแลว ในที่สุดเราก็สามารถกําหนดชะตากรรมของบอลขานใหมได โดยใชเยอรมนีนําความรุงเรืองชั่วนิรันดรที่เราสมควรไดรับมาให! เราจะลากบอลขานสวนที่เหลือไปกับเรา ตอใหพวกเขาจะดิ้นรนกรีดรองก็ตาม..."
 greek_turkish_friendship: "ลงนามสนธิสัญญามิตรภาพกรีซ-ตุรกีแลว"
 GRE_last_country_standing: "ชาติสุดทายที่ยืนหยัด"
 GRE_last_country_standing_desc: "การรวมมือกับรัฐบาลตุรกีเปนสิ่งที่พึงปรารถนา แตขอใหรูไววารัฐบาลใหมของกรีซไมกลัวที่จะลงมือเมื่อสถานการณบังคับ ขอพระเจาทรงเมตตาพวกเราทุกคน"
 GRE_moulding_the_new_world_order: "หลอหลอมระเบียบโลกใหม"
 GRE_moulding_the_new_world_order_desc: "ศพกองสูงทวมทนแลว และมันตองไมสูญเปลา เราตอสูเพื่อสรางสถานะใหมของโลก และเราจะสูตอไปจนกวาจะไมเหลือเจตจํานงที่จะสูหลงเหลืออยูในโลกนี้อีกเลย"
 GRE_reevaluating_the_drachma: "ลดคาเงินดรักมา"
 GRE_reevaluating_the_drachma_desc: "ปญหาการเงินของเราดูเหมือนไมมีวันสิ้นสุด การผิดนัดชําระหนี้และหนี้สินทําใหสถานการณเศรษฐกิจของเรายํ่าแยจนแทบไปตอไมได เราตองจงใจลดคาเงินเพื่อกระตุนการไหลเขาของทุนตางชาติ แมวาในระยะยาวอาจสงผลเสียตอหนี้บางสวนของเราก็ตาม"
 GRE_pay_back_debt_tt: "§Yการตัดสินใจ§!เหลานี้จะชวยใหเราลดระดับและกําจัดจิตวิญญาณแหงชาติ§Yหนี้ตอ I.F.C.§!ไดในที่สุด"
 GRE_lignite_liquefaction: "การแปรสภาพลิกไนตเปนของเหลว"
 GRE_lignite_liquefaction_desc: "ประเทศของเราอุดมไปดวยเหมืองลิกไนต และเรารูกระบวนการเปลี่ยนลิกไนตเปนเชื้อเพลิงอยูแลว รัฐบาลควรสนับสนุนการเปดโรงงานแปรสภาพลิกไนตเปนของเหลวใหมากขึ้น"
 GRE_force_the_farmers_into_factories: "บังคับเกษตรกรเขาโรงงาน"
 GRE_force_the_farmers_into_factories_desc: "ประชาชนทั่วไปดูเหมือนจะติดอยูในเทพนิยายวาพวกเขาจะทําไรไถนาไปไดตลอดชีวิต แลวผานพนความขัดแยงที่กําลังกอตัวไปไดอยางสบายๆ พวกเขาคิดผิด เราไมมีทางเลือกนอกจากเริ่มยึดไรนาแลวบังคับยายเกษตรกรเขาสูศูนยกลางเมือง เพื่อใหพวกเขาเริ่มทํางานที่เปนประโยชนตอรัฐไดทันทีมากกวา"
 GRE_utilize_our_strengths: "ใชจุดแข็งของเรา"
 GRE_utilize_our_strengths_desc: "กรีซเปนชาติแหงเกษตรกรและสินคาฟุมเฟอย และนี่ไมใชเรื่องนาอาย แนนอนวาเยอรมนีอาจผลิตรถถังและเครื่องบินขับไลจํานวนมหาศาล แตคุณคิดวายาสูบในไปปของแฮรมันน เกอริงมาจากไหนละ? ชาวกรีกรูจุดแข็งของตนเอง และหากเรายึดมั่นในจุดแข็งนั้น เราก็จะไปไดดี"
 GRE_extracting_more_from_our_soil: "ขุดหาทรัพยากรจากผืนดินใหมากขึ้น"
 GRE_extracting_more_from_our_soil_desc: "กรีซเปนประเทศที่อุดมดวยทรัพยากรธรรมชาติ เราเพียงตองมีความมุงมั่นที่จะขุดมันขึ้นมา เทคโนโลยีไดมอบหนทางใหเราแลว ที่เหลือก็เพียงแคหาความตั้งใจ"
 GRE_open_foreign_subsidized_factories: "เปดโรงงานที่ตางชาติอุดหนุน"
 GRE_open_foreign_subsidized_factories_desc: "เราทําไดเกินความคาดหมายในการกอสรางและจัดหาแรงงานใหโรงงาน แตไมตองสงสัยเลยวาเรายังขยายตัวชากวาเพื่อนรวมยุโรปคนอื่นๆ มีผูที่รํ่ารวยกวาเรามากซึ่งสามารถสรางความแตกตางอยางใหญหลวงในกระบวนการปรับปรุงประเทศใหทันสมัยของเรา หากเราทําใหชาติของเรานาดึงดูดพอสําหรับการลงทุน"
 GRE_open_foreign_subsidized_factories_tt: "จะไดรับ§Yโรงงานทหาร§!หนึ่งแหงและ§Yโรงงานพลเรือน§!หนึ่งแหง สําหรับแตละประเทศตอไปนี้ที่มี§Yทัศนคติ§!ตอ§Yกรีซ§!มากกวา§G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§! และ§Y[SOV.GetNameDef]§!"
 GRE_unlock_soviet_decision_tt: "ปลดล็อกการตัดสินใจ: §Yตอนรับขาราชการ[SOV.GetAdjective]ใน[ROOT.GetNameDef]§!"
 GRE_paying_back_our_debts_in_bulk: "ชําระหนี้กอนใหญ"
 GRE_paying_back_our_debts_in_bulk_desc: "ยิ่งเราปลดหนี้ไดเร็วเทาไร เราก็จะเริ่มเปลี่ยนแปลงประเทศนี้อยางแทจริงไดเร็วเทานั้น เราจะกันทุนของประเทศไวชําระหนี้มากขึ้น เพื่อจะไดหลุดพนจากเจานายทางการคลังตางชาติเร็วขึ้น"
 GRE_paid_off_most_of_debt_tt: "ตองชําระ§Yหนี้§!ของชาติไปแลวเปนสวนใหญ"
 GRE_paying_back_our_debts_in_bulk_ENG_tt: "ปลดล็อกการตัดสินใจ: §Yชําระหนี้กอนใหญแกอังกฤษ§! \n"
 GRE_paying_back_our_debts_in_bulk_FRA_tt: "ปลดล็อกการตัดสินใจ: §Yชําระหนี้กอนใหญแกฝรั่งเศส§! \n"
 GRE_paying_back_our_debts_in_bulk_ITA_tt: "ปลดล็อกการตัดสินใจ: §Yชําระหนี้กอนใหญแกอิตาลี§! \n"
 GRE_open_up_the_country: "เปดประเทศ"
 GRE_open_up_the_country_desc: "เปนความจริงที่นาเศราที่ตองยอมรับ แตเราไมสามารถพัฒนาอุตสาหกรรมไดดวยตัวเอง เราพึ่งพาทุนและขีดความสามารถทางอุตสาหกรรมของชาติที่ใหญกวามานาน และยุคนี้ก็ไมมีขอยกเวน ดังนั้นขอใหเราเชิญทุนและการลงทุนของพวกเขาเขามาในกรีซวันนี้ เพราะวันพรุงนี้เราจะไมตองการพวกเขาอีกตอไป!"
 GRE_connecting_our_prefectures: "เชื่อมโยงจังหวัดของเรา"
 GRE_connecting_our_prefectures_desc: "ไมใชแคฐานอุตสาหกรรมเทานั้นที่เรายังขาด แตโครงสรางพื้นฐานของชาติก็เชนกัน เพื่อนบานของเราไดพัฒนาประเทศสูความเปนเมืองแลว ถึงเวลาที่เราจะเริ่มทําใหประชากรของเราเปนชาวเมืองบาง"
 GRE_exporting_more_luxury_commodoties: "สงออกสินคาฟุมเฟอยใหมากขึ้น"
 GRE_exporting_more_luxury_commodoties_desc: "ยาสูบ มะกอก ชีสเฟตา องุน มะเดื่อ: เมื่อคุณตองการสิ่งที่ดีที่สุดในชีวิต คุณตองซื้อจากกรีซ! เรานาจะไมมีปญหาในการผลักดันภาพลักษณระดับนานาชาติในฐานะประเทศที่มีสินคาฟุมเฟอยดีที่สุดใหไปไกลกวาเดิม"
 GRE_greek_autarky: "การพึ่งพาตนเองของกรีซ"
 GRE_greek_autarky_desc: "การพึ่งพาทุนของประเทศที่รํ่ารวยกวามาอยางยาวนานเปนเรื่องนาอัปยศ ประเทศเหลานี้ดูแคลนเรา รังแกเรา และกดใหเรายากจนเพื่อที่พวกเขาจะไดรํ่ารวยตอไป เยอรมนี อิตาลี และโซเวียตไดแสดงใหเราเห็นวายังมีอีกหนทางหนึ่ง - เสนทางสูการพึ่งพาตนเองและเอกราชอยางสมบูรณ! แนนอนวาอาจตองใชเวลาสักพักกวาจะไปถึงจุดนั้น เพราะอยางไรเราก็ไมใชเยอรมนี..."
 GRE_fiscal_responsibility: "[Root.GetFiscalResponsibilityName]"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_STANDARD: "ความรับผิดชอบทางการคลัง"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_COMMUNIST: "กระจายความมั่งคั่งอยางทั่วถึง"
 GRE_fiscal_responsibility_desc: "ในที่สุดเราก็บรรลุดุลยภาพทางการเงิน ซึ่งอาจเปนครั้งแรกในประวัติศาสตรกรีซยุคใหม ไมตองสงสัยเลยวานี่เปนเหตุการณที่ควรคาแกการเฉลิมฉลองอยางแทจริง! เราควรปรบมือใหตัวเองสําหรับศิลปะการปกครองอันยอดเยี่ยม เราสมควรไดรับมัน"
 GRE_fiscal_responsibility_tt: "ตองชําระ§Yหนี้ตอ I.F.C§!ไปแลวบางสวนหรือทั้งหมด"
 GRE_bolster_the_schachtplan: "เสริมแผนชาคท"
 GRE_bolster_the_schachtplan_desc: "แผนชาคทเปนรากฐานสําคัญของการวางแผนจากสวนกลางของกรีซมาระยะหนึ่ง แตชัดเจนวาแผนชาคทถูกรางขึ้นเพื่อเอื้อประโยชนแกเยอรมนีอยางโจงแจง นักเศรษฐศาสตรชั้นนําของประเทศบางคนไดเสนอแผนการเจรจาแผนชาคทใหมเพื่อใหเปนประโยชนตอทั้งสองฝายมากขึ้น และเราคงโงเขลาหากไมใชประโยชนจากมัน!"
 GRE_british_docking_rights: "สิทธิ์การเทียบทาของอังกฤษ"
 GRE_british_docking_rights_desc: "กุญแจสูชัยชนะของฝายสัมพันธมิตรในแนวรบตะวันออกกลางระหวางมหาสงครามคือการเขาถึงทาเรือของกรีซ เราอยูในยุคที่ดูเหมือนวาเมดิเตอรเรเนียนจะเปนถังดินปนที่จุดไฟเผายุโรปมากขึ้นทุกที และอังกฤษยอมไดประโยชนจากการเขาถึงทาเรือของเราอีกครั้ง"
 GRE_renegotiate_debt_with_france: "เจรจาหนี้ใหมกับฝรั่งเศส"
 GRE_renegotiate_debt_with_france_desc: "ฝรั่งเศสดูเหมือนจะจัดนโยบายตางประเทศในบอลขานไมลงตัวเสียที - งั้นเราจะเสนอขอตกลงที่งายมากจนแมแตพวกเขาก็ไมอาจเขาใจผิดได ยกหนี้ใหเรา แลวเราจะผูกความมั่นคงและความอยูรอดของเราไวกับความสําเร็จของระบอบฝรั่งเศส"
 GRE_renegotiate_debt_with_france_tt: "ปลดล็อกการตัดสินใจ: §Yติดสินบนสหภาพแรงงานฝรั่งเศสใหกอกวนรัฐบาลของพวกเขา§! \nยกเลิก§Yหนี้ตอ I.F.C.§!ทั้งหมดที่ถือโดย§Y[FRA.GetNameDef]§!"
 GRE_sophistry_and_science: "วาทศิลปและวิทยาศาสตร"
 GRE_sophistry_and_science_desc: "สิ่งเหลานี้คือความเชี่ยวชาญของชาวกรีกโบราณ และบัดนี้เราตองการปญญาชนที่เฉลียวฉลาดและใฝรูมากกวาที่เคย เพื่อเปลี่ยนแปลงประเทศนี้และผลักดันเราเขาสูศตวรรษที่ยี่สิบ การมุงเนนนวัตกรรมทางเทคโนโลยีจะทําใหเราไมตองวิ่งไลตามยุโรปสวนที่เหลืออีกหาสิบปขางหนา"
 GRE_expand_our_tobacco_industry: "ขยายอุตสาหกรรมยาสูบ"
 GRE_expand_our_tobacco_industry_desc: "ไมตองสงสัยเลยวาสินคาสงออกที่ใหญและทํากําไรมากที่สุดของเราคือยาสูบ ซึ่งเราขายไปทั่วโลก ประเทศที่เรามีความสัมพันธทางการคาอยูแลวยอมชื่นชมที่เราเตรียมกิจการของเราอยางถี่ถวน จนไมวาอะไรจะเกิดขึ้น โลกก็จะไมมีวันขาดแคลนยาสูบอันเลื่องชื่อของเรา"
 GRE_increase_our_mining_operations: "เพิ่มการทําเหมือง"
 GRE_increase_our_mining_operations_desc: "การขยายการผลิตยาสูบอาจทําใหเราเปนที่ชื่นชอบของประชาคมนานาชาติมากขึ้น แตการขยายอุตสาหกรรมเหมืองแรหนักตางหากที่เปนประโยชนตอรัฐมากกวา แรธาตุและสินแรจะชนะสงคราม ไมใชยาสูบและนํ้ามันมะกอก"
 GRE_bedrock_of_balkan_financial_stability: "[Root.GetBedrockFinancialStabilityName]"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_STANDARD: "รากฐานแหงเสถียรภาพทางการเงินของบอลขาน"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_COMMUNIST: "แหลงพักพิงแหงการฉอฉลทางเศรษฐกิจของบอลขาน"
 GRE_bedrock_of_balkan_financial_stability_desc: "ใครจะไปคิดวาในบรรดาทุกประเทศ กรีซจะเปนชาติแรกในบอลขานที่จัดการสถานะทางการเงินของตนไดอยางแทจริง? เกียรติภูมิในภูมิภาคของเราพุงทะยาน และเราควรใชประโยชนจากสถานะใหมในฐานะนายธนาคารแหงยุโรปตอนใต เพื่อทําใหประเทศของเรารํ่ารวยยิ่งขึ้นไปอีก"
 GRE_bedrock_of_balkan_financial_stability_tt: "เราจะไดรับ§Yโรงงานพลเรือน§!นอกแผนที่สําหรับทุกประเทศใน§Yบอลขานตะวันตก§! §Yบอลขานตะวันออก§! และ§Yบอลขานเหนือ§! ที่มี§Yทัศนคติ§!เปนมิตรตอเราในระดับสูง ทั้งนี้รวมถึง§Y[AUS.GetNameDef]§! §Y[CZE.GetNameDef]§! และ§Y[TUR.GetNameDef]§!ดวย"
 GRE_rapprochement_with_the_italians: "ปรองดองกับอิตาลี"
 GRE_rapprochement_with_the_italians_desc: "ยามวิกฤตตองใชมาตรการเด็ดขาด เราตองทําสิ่งที่ไมอาจนึกถึง นั่นคือเขาหาอิตาลีเพื่อขอความชวยเหลือในการปรับปรุงประเทศใหทันสมัย อิตาลีจะแบล็กเมลและรีดไถเราจากขอตกลงนี้อยางไร? มีแตพระเจาเทานั้นที่รู หากจะตกลงกันไดตั้งแตแรกนะนะ..."
 GRE_appeal_to_the_soviet_union: "ขอความชวยเหลือจากสหภาพโซเวียต"
 GRE_appeal_to_the_soviet_union_desc: "เราไมไดหันไปหาสหภาพโซเวียตอยางไมไตรตรอง เรากําลังจะเดินเขาถํ้าหมาปาที่พรอมจะแทะเราจนเหลือแตกระดูกหากเราไมระวัง แตการที่เราไปหาพวกเขายอมดีกวาใหพวกเขามาหาเราแนนอน..."
 GRE_encourage_tourism: "สงเสริมการทองเที่ยว"
 GRE_encourage_tourism_desc: "แหลงมรดกของเราเปนที่อิจฉาของทั่วโลก และไมตองสงสัยเลยวาเราสามารถเปลี่ยนการทองเที่ยวใหเปนพรอันยิ่งใหญตอเศรษฐกิจได แนนอนวาเงาแหงสงครามที่ปกคลุมยุโรปทําใหทุกอยางหมองลงบาง - แตหวังวานั่นจะทําใหการหลบหนีไปยังกรีซอันแปลกใหมยิ่งนาดึงดูดใจมากขึ้น!"
 GRE_encourage_tourism_tt: "§Rเราจะสูญเสียอุตสาหกรรมการทองเที่ยวทันทีที่เขาสูภาวะสงคราม!§!"
 GRE_mobilise_our_economy: "ระดมเศรษฐกิจ"
 GRE_mobilise_our_economy_desc: "มหาอํานาจของยุโรปกําลังเรงเครื่องจักรสงคราม และเราไมอาจเสี่ยงที่จะถูกจับไดโดยไมทันตั้งตัว กระบวนการนี้จะเจ็บปวดสําหรับกรีซ - เจ็บปวดกวาประเทศสวนใหญ - แตเพื่อความอยูรอด เราตองเสียสละ"
 GRE_rejuvenating_athens: "ฟนฟูกรุงเอเธนส"
 GRE_rejuvenating_athens_desc: "เมืองหลวงอันยิ่งใหญและรุงโรจนของเราเปนหนึ่งในเมืองที่เกาแกที่สุดในยุโรป และยังเปนหนึ่งในจังหวัดที่รํ่ารวยและบริหารจัดการไดมีประสิทธิภาพที่สุดของเรา แทนที่จะพัฒนาจังหวัดที่ดอยพัฒนาจนสิ้นหวังแลว ขอใหเรามุงความพยายามไปที่เมืองหลวงที่ทันสมัยอยูแลวของเรา"
 GRE_making_use_of_our_islands: "ใชประโยชนจากหมูเกาะของเรา"
 GRE_making_use_of_our_islands_desc: "เราไดหมูเกาะจํานวนมากคืนมาจากซากของจักรวรรดิออตโตมันหลังจากที่ฝายสัมพันธมิตรชําแหละมันอยางมีประสิทธิภาพ แตเราแทบไมไดทําอะไรกับมันเลยนับตั้งแตเขาครอบครอง ครีตเปนสวนสําคัญของกรีซมานาน และเราจะเริ่มความพยายามที่นั่น แลวขยายออกไปยังเกาะอื่นๆ เพื่อทําใหหมูเกาะเหลานี้มีคุณคาทางยุทธศาสตรและทางวัตถุตอรัฐมากขึ้น"
 GRE_making_use_of_our_islands_tt: "แผนยุทธศาสตรนี้จะมีผลมากขึ้นหากควบคุม§Yไซปรัส§!และ§Yหมูเกาะโดเดคะนีส§!ดวย"
 GRE_making_use_of_our_islands_dodecanese_tt: "แผนยุทธศาสตรนี้จะมีผลมากขึ้นหากควบคุม§Yหมูเกาะโดเดคะนีส§!ดวย"
 GRE_making_use_of_our_islands_cyprus_tt: "แผนยุทธศาสตรนี้จะมีผลมากขึ้นหากควบคุม§Yไซปรัส§!ดวย"
 GRE_clear_the_slums: "รื้อถอนสลัม"
 GRE_clear_the_slums_desc: "ผูลี้ภัยชาวกรีกหลบเลี่ยงการเกณฑทหารและยึดพื้นที่อันมีคาดวยการสรางและตั้งรกรากในสลัมและชุมชนแออัดอันสกปรก การดํารงอยูของสถานที่เหลานี้สรางความอับอายแกประเทศ เชนเดียวกับผูอยูอาศัยที่บายเบี่ยงหนาที่ตอชาติ เราจะรื้อสลัมเหลานี้และนําที่ดินกับผูคนไปใชใหเกิดประโยชนมากขึ้น"
 GRE_cooperate_with_foreign_monopolies: "[Root.GetCooperateForeignMonopoliesName]"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_STANDARD: "รวมมือกับบรรษัทผูกขาดตางชาติ"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST: "โอนบรรษัทผูกขาดตางชาติเปนของรัฐ"
 GRE_cooperate_with_foreign_monopolies_desc: "ไมมีประโยชนที่จะตอสูกับผูมีอํานาจ มันคือการตอสูที่ไมมีวันชนะและจะคอยๆ ฆากรีซหากเราดึงดันทํา แทนที่จะทําตัวเปนคนโงใจรอน ขอใหเราเชิญบรรษัทผูกขาดมารวมโตะเจรจาและหาขอตกลงที่เปนมิตรสําหรับทุกฝาย"
 GRE_crack_down_on_foreign_monopolies: "ปราบปรามบรรษัทผูกขาดตางชาติ"
 GRE_crack_down_on_foreign_monopolies_desc: "เราอดทนกับผูใหกูตางชาติและบรรษัทผูกขาดทางการเงินระดับโลกมานานเกินไปแลว - ไมอีกตอไป! เราจะไมยอมถูกองคกรรายกาจเหลานี้กดขี่อีก เพราะนับจากวันนี้ กรีซจะเปนอิสระอยางแทจริง!"
 GRE_academy_of_athens: "สถาบันวิชาการแหงเอเธนส"
 GRE_academy_of_athens_desc: "สถาบันวิชาการแหงเอเธนสกอตั้งขึ้นในป 1929 ในฐานะสถาบันการศึกษาขั้นสูง แตยังใหมและตองการความชวยเหลือเพื่อเติบโต ดวยการเขามาสนับสนุนของเรา เราจะทําใหมันเปนศูนยกลางของนักวิชาการผูมุงมั่นทั้งในยุโรปและที่อื่นๆ!"
 GRE_hellenic_armed_forces: "กองทัพกรีก"
 GRE_hellenic_armed_forces_desc: "กองทัพของเราดีพอสําหรับสถานการณของชาติในปจจุบัน แตเรายังคงออนแอที่สุดทางการทหารในบรรดาสมาชิกกติกาสัญญาบอลขาน และถูกวิจารณบอยครั้งเรื่องการขาดการปรับปรุงใหทันสมัยทั่วทั้งกองทัพ ถึงเวลาที่เราตองจริงจังกับสถานการณทางทหาร โดยเฉพาะเมื่อสถานการณภายในของเรากําลังเลวรายลง..."
 GRE_the_hellenic_air_force: "กองทัพอากาศกรีก"
 GRE_the_hellenic_air_force_desc: "แมโรงเรียนนายเรืออากาศของเราจะเพิ่งกอตั้งในป 1930 แตชาวกรีกเกี่ยวของกับการบินมาตั้งแตสมัยสงครามบอลขาน! เราเขาใจความสําคัญของกองทัพอากาศที่แข็งแกรงดีอยูแลว ขอเพียงเรามีขีดความสามารถที่จะทําใหกองทัพอากาศของเราแข็งแกรงและใหญขึ้น..."
 GRE_the_hellenic_army: "กองทัพบกกรีก"
 GRE_the_hellenic_army_desc: "เล็ก ลาสมัย แตทรหด - นี่คือคําที่หลายคนใชบรรยายกองทัพกรีก และก็ไมใชคําบรรยายที่ผิด สิ่งที่เราตองทํามีเพียงปรับปรุงยุทธวิธีและยุทโธปกรณใหทันสมัย แลวเราจะกลายเปนกองกําลังที่นาเกรงขามในบอลขานอยางแทจริง"
 GRE_the_hellenic_navy: "กองทัพเรือกรีก"
 GRE_the_hellenic_navy_desc: "ชาวกรีกมีประเพณีทางทะเลอันแข็งแกรงและนาภาคภูมิใจนับตั้งแตเราไดรับเอกราชจากจักรวรรดิออตโตมันเปนครั้งแรก กองทัพเรือของเราแข็งแกรงที่สุดในบรรดาเพื่อนบาน และเราเพียงตองบมเพาะมรดกทางทะเลเพื่อใหตัวเราเปนผูเลนระดับภูมิภาคที่ทรงพลังอยางแทจริงในเมดิเตอรเรเนียน"
 GRE_destroying_our_foes: "ทําลายศัตรู"
 GRE_destroying_our_foes_desc: "อนาคตที่มั่นคงของเราขึ้นอยูกับการโจมตีศัตรูกอนที่พวกเขาจะมีโอกาสแตะตองมาตุภูมิของเรา เราตองลงทุนในยุทธศาสตรการทิ้งระเบิดทางยุทธศาสตรตอเปาหมายของศัตรู"
 GRE_protecting_our_skies: "ปกปองนานฟา"
 GRE_protecting_our_skies_desc: "เราไมเคยมีอุตสาหกรรมมากพอที่จะทั้งปกปองนานฟาและทิ้งระเบิดศัตรูไปพรอมกัน หากสถานการณบีบใหตองเลือกระหวางโจมตีศัตรูใหมากขึ้นกับปกปองคนของเราจากการโจมตีของพวกเขา เราจะเลือกปกปองเพื่อนรวมชาติทุกครั้ง"
 GRE_the_backbone_of_our_army: "กระดูกสันหลังของกองทัพ"
 GRE_the_backbone_of_our_army_desc: "กระบวนการเกณฑทหารของเราคอนขางลาหลังเมื่อเทียบกับเพื่อนบานหลายประเทศ และยุทโธปกรณของเราก็ลาสมัยอยางนาเวทนา ถึงเวลาปรับปรุงขั้นตอนการเกณฑทหารและยุทโธปกรณที่เราติดอาวุธใหทหารใหทันสมัย"
 GRE_a_legacy_of_war: "มรดกแหงสงคราม"
 GRE_a_legacy_of_war_desc: "สงครามอยูในสายเลือดของเรา - เราทําสงครามกับผูอื่นและถูกผูอื่นทําสงครามใสมาตั้งแตครั้งโบราณกาล เราไดเรียนรูกลเม็ดมากมายตลอดหลายศตวรรษ และถึงเวลาแลวที่กองทัพแหงชาติของเราจะสะทอนสิ่งที่ดีที่สุดจากอดีตอันชุมเลือดของเรา"
 GRE_abandon_the_greek_turkish_naval_treaty: "ยกเลิกสนธิสัญญานาวีกรีซ-ตุรกี"
 GRE_abandon_the_greek_turkish_naval_treaty_desc: "สนธิสัญญาที่ควรจะจํากัดขนาดเรือที่ชาวเติรกไดรับอนุญาตใหสราง กลับลากเราเขาไปติดขอจํากัดเดียวกันดวย! ชางมันเถอะ ครั้งหนึ่งกรีซเคยมีเรือหลักอันเกรียงไกรที่ครองนานนํ้าชายฝงของเรา และในยามวุนวายเชนนี้ ไมมีความมั่นคงใดดีไปกวาเรือประจัญบานขนาดยักษ!"
 GRE_abandon_the_greek_turkish_naval_treaty_tt: "การผูกมิตรทางการเมืองกับ§Yอังกฤษ§!หรือ§Yเยอรมนี§!จะชวยใหเราสราง§Yเรือรบหนัก§!ลําเกาบางลําขึ้นมาใหมได\n"
 GRE_a_modern_navy: "กองทัพเรือสมัยใหม"
 GRE_a_modern_navy_desc: "ไมสําคัญนักหรอกที่สนธิสัญญานาวีกรีซ-ตุรกีจํากัดขนาดเรือที่เราสรางได เพราะพูดตรงๆ เราไมมีอุตสาหกรรมตอเรือมากพอจะดูแลหรือขยายกองเรือหลักและเรือลาดตระเวนอยูแลว แตเรือดํานํ้านั้น... นั่นแหละคือทางออกที่เปนไปไดสําหรับปญหาทางนาวีของกรีซ"
 GRE_escorts_for_our_bombers: "เครื่องบินคุมกันสําหรับเครื่องบินทิ้งระเบิด"
 GRE_escorts_for_our_bombers_desc: "การผลิตเครื่องบินทิ้งระเบิดเพียงอยางเดียวไมพอ ตองมีเครื่องบินคุมกันเพื่อปกปองเครื่องบินทิ้งระเบิดเหลานั้นดวย! เราไมอาจพึ่งเครื่องบินขับไลทั่วไปได เราจึงจะพัฒนาเครื่องบินขับไลชั้นยอดที่สามารถคุมกันเครื่องบินทิ้งระเบิดของเราไปจนถึงชายฝงของศัตรู"
 GRE_defending_our_seas: "ปกปองนานนํ้า"
 GRE_defending_our_seas_desc: "กรีซมีชายฝงที่ยาวมากและควบคุมหมูเกาะจํานวนมาก - แมทะเลเคยเปนปราการปองกันที่ยิ่งใหญที่สุดอยางหนึ่งของเรา แตทุกวันนี้กลับแทบไมมีผลตอศัตรูที่อาจมาเยือน หากศัตรูหวังจะยึดหมูเกาะหรือยกพลขึ้นฝงของเรา พวกเขาตองรอดจากการทิ้งระเบิดของเครื่องบินทิ้งระเบิดทางทะเลของเราเสียกอน!"
 GRE_embracing_modern_warfare: "รับการสงครามสมัยใหม"
 GRE_embracing_modern_warfare_desc: "รายงานจากเยอรมนีระบุวา 'รถถัง' อาจมีประโยชนมากกวาแคการสนับสนุนกองพันทหารราบ ลองนึกดูสิ! เราอาจไมมีอุตสาหกรรมรองรับ แตก็เปนการเดิมพันที่คุมคา"
 GRE_new_weapons_old_tricks: "อาวุธใหม กลยุทธเกา"
 GRE_new_weapons_old_tricks_desc: "เรามีประสบการณไมนอยในการประจําปนใหญและการลาดตระเวนระหวางมหาสงคราม เทคโนโลยีและยุทโธปกรณอาจเปลี่ยนไป แตยุทธวิธีไมไดเปลี่ยนแนนอน ขอใหเราใชจุดแข็งของเราและแสดงใหโลกเห็นวาไมมีใครตอกรกับกรีซไดงายๆ"
 GRE_a_fleet_fit_for_the_aegean: "กองเรือที่คูควรกับทะเลอีเจียน"
 GRE_a_fleet_fit_for_the_aegean_desc: "ทุกวันเราตองจําทนมองเรือลาดตระเวนประจัญบานของอิตาลีและเรือบรรทุกเครื่องบินของอังกฤษแลนผานนานนํ้าของเรา นาอัปยศยิ่งนัก! ถึงเวลาแลวที่ใครสักคนในบอลขานจะลุกขึ้นยืนและสงกองทัพเรือที่เราทุกคนภาคภูมิใจไดออกสูทะเล"
 GRE_disrupting_the_great_powers: "กอกวนมหาอํานาจ"
 GRE_disrupting_the_great_powers_desc: "หนาที่ของเราไมใชการทาชนมหาอํานาจของโลกขณะที่พวกเขาหํ้าหั่นกันบนบกและในทะเล แตเราจะโจมตีจุดที่เจ็บที่สุดของพวกเขาแทน - เสนทางเสบียงของพวกเขา!"
 GRE_fund_the_hellenic_air_force_academy: "สนับสนุนงบประมาณโรงเรียนนายเรืออากาศกรีก"
 GRE_fund_the_hellenic_air_force_academy_desc: "นักบินของเรามีความเต็มใจ มีความสามารถ และเชี่ยวชาญ - ถึงเวลาที่เราจะใหความเคารพที่พวกเขาสมควรไดรับเสียที เราจะเริ่มดวยการจัดสรรงบประมาณใหโรงเรียนนายเรืออากาศเต็มจํานวนอีกครั้ง และเรงการผลิตเครื่องบินขับไลอยางจริงจัง เพื่อใหกองทัพอากาศของเราคูควรกับกรีซอยางแทจริง"
 GRE_hellenic_armoured_corp: "กองพลยานเกราะกรีก"
 GRE_hellenic_armoured_corp_desc: "การจัดตั้งกองพลยานเกราะของเราเองจะแสดงใหโลกเห็นวาเราทันสมัยแคไหน! คงไมมีประเทศลาหลังที่ไหนมีรถถังในกองทัพหรอก จริงไหม?"
 GRE_greek_mechanisation: "การเปลี่ยนกองทัพกรีกเปนยานยนต"
 GRE_greek_mechanisation_desc: "การปรับปรุงใหทันสมัยก็เปนกระบวนการที่เจ็บปวดพออยูแลว แตการเปลี่ยนกองทัพของเราเปนยานยนตอาจเปนการเอาเกวียนไวหนาวัวจริงๆ! ราคาของความกาวหนานั้นสูง แตเราจะไมหลีกเลี่ยง ความมั่นคงของชาติสําคัญเหนือสิ่งอื่นใด"
 GRE_the_cannon: "ปนใหญ"
 GRE_the_cannon_desc: "โลกจะไดยินเสียงคํารามของปนใหญของเราไปถึงอีกฟากหนึ่งของโลก!"
 GRE_the_torpedo: "ตอรปโด"
 GRE_the_torpedo_desc: "บางทีลูกเรือสักกลุมที่เราสงลงสูหลุมศพใตทะเลอาจพาเราไปพบแอตแลนติสในที่สุด! หรือไมก็เราอาจพอใจแคเปลี่ยนเมืองหลวงของศัตรูใหกลายเปนนครที่สาบสูญและจมหายใตทะเลแหงตอไป..."
 GRE_a_land_of_mountains: "ดินแดนแหงขุนเขา"
 GRE_a_land_of_mountains_desc: "ภูมิศาสตรตามธรรมชาติมอบปราการปองกันผูรุกรานมากมายใหแกเรา เราเพียงตองเรียนรูที่จะใชประโยชนจากภูมิประเทศของเราเอง! ในเรื่องนี้เรานาจะเรียนรูอะไรบางอยางจากชาวสวิสไดแนนอน"
 GRE_mountain_training_effect: "เปดใชงาน§Hการฝกสงครามภูเขา§!\n§Hทหารราบ\n    ภูเขา§!\n      การปองกัน: §G+5%§!\n      การเคลื่อนที่: §G+5%§!\n§Hนาวิกโยธิน\n    ภูเขา§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n§Hทหารภูเขา\n    ภูเขา§!\n      การโจมตี: §G+5%§!\n      การปองกัน: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n§Hพลรม\n    ภูเขา§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n"
 GRE_a_long_and_proud_tradition: "ประเพณีอันยาวนานและนาภาคภูมิใจ"
 GRE_a_long_and_proud_tradition_desc: "กองทัพเรือของเราเปนหนึ่งในไมกี่สิ่งที่เปนความภาคภูมิใจของกรีซมาโดยตลอด แมในยามที่มืดมนที่สุด สิ่งที่เราทําในวันนี้เปนเพียงการสืบสานประเพณีอันยาวนานและนาภาคภูมิใจ"
 GRE_the_double_headed_aquila: "อินทรีสองหัว"
 GRE_the_double_headed_aquila_desc: "เราจะชูอินทรีสองหัวไปกับเครื่องบินทุกลําที่ทะยานสูฟาและโปรยไฟลงใสศัตรู! โลกจะไดเห็นวาปกของเราแผไปไดไกลเพียงใด..."
 GRE_modern_cataphracts: "คาตาแฟรกตสมัยใหม"
 GRE_modern_cataphracts_desc: "ครั้งหนึ่งทหารมาเกราะหนักคาตาแฟรกตเคยเปนที่อิจฉาของโลกยุคกลาง! ความเร็ว เกราะ และพละกําลังของพวกเขาทําใหทุกคนตะลึง! คาตาแฟรกตในวันนี้ยอมคือรถถังอยางไมตองสงสัย และเราจะผลิตรถถังรุนที่คูควรกับมรดกของคาตาแฟรกตแหงไบแซนไทนอยางแทจริง"
 GRE_thema_nautikon: "ธีมานาวติคอน"
 GRE_thema_nautikon_desc: "ไบแซนเทียมเคยครองทองทะเล และแมในหลายศตวรรษหลังการลมสลายของไบแซนเทียม ชาวกรีกก็ไมเคยสูญเสียจิตวิญญาณนักเดินเรือ! เมื่อพูดถึงสมรภูมิ ทองทะเลก็คุนเคยสําหรับเราพอๆ กับเทือกเขาพินดัส!"

 GRE_the_macedonian_farmlands: "ผืนนาอันอุดมแหงมาซิโดเนีย"
 GRE_the_macedonian_farmlands_desc: "สินคาสงออกหลักของ[731.GetName]คือผลผลิตทางการเกษตร ภูมิภาคนี้เหมาะแกการเพาะปลูกอยางยิ่ง ตางจากดินแดนสวนอื่นๆ ของเรา และเราตองมุงเนนจุดนี้เพื่อทําใหอนาคตของประเทศยิ่งใหญที่สุดเทาที่จะเปนไปได"

 GRE_reorganize_the_royal_guard: "จัดระเบียบราชองครักษใหม"
 GRE_reorganize_the_royal_guard_desc: "ราชองครักษ หรือที่เคยรูจักกันในชื่อกองรอยองครักษประธานาธิบดี กอตั้งขึ้นตามพระราชกฤษฎีกาในป 1868 หนวยคุมกันอาเกมาประกอบดวยฝายเสนาธิการ กองรอยทหารราบเอฟโซนสองกองรอย และกองรอยทหารมาหนึ่งกองรอย เราตองจัดระเบียบหนวยเหลานี้ใหม และนํามาใชในสนามรบอีกครั้ง"

 GRE_utilize_british_capital: "ใชประโยชนจากทุนอังกฤษ"
 GRE_utilize_british_capital_desc: "เปนที่ชัดเจนวาอังกฤษยินดีอยางยิ่งที่จะชวยเหลือเรา เพราะกษัตริยของเราเปนพันธมิตรที่ภักดีตอพวกเขา เราควรใชประโยชนจากขอเท็จจริงนี้ดวยการขอใหนักลงทุนของพวกเขาชวยฟนฟูสิ่งที่สูญเสียไประหวางสงครามกลางเมือง"




 TUR_the_montreux_convention: "อนุสัญญามองโทรซ"
 TUR_the_montreux_convention_desc: "เปนเรื่องนาโมโหที่แมจะเกิดเหตุการณมากมายนับตั้งแตมหาสงคราม เราก็ยังถูกปฏิเสธสิทธิ์ในการบริหารชองแคบของเราเอง แทนที่จะใหกองทัพยึดชองแคบโดยพลการ ขอใหเราลองใชกลยุทธทางการทูตที่แยบยลกวา เพื่อใหเราหลุดพนจากวิกฤตนี้โดยไมกลายเปนตัวประหลาดคนใหมของยุโรป"
 TUR_the_montreux_convention_tt: "เราจะเรียกประชุม§Yอนุสัญญา§!เพื่อประกาศเจตนาที่จะฟนฟูกําลังทหารใน§Yชองแคบดารดะเนลส§!และ§Yชองแคบบอสพอรัส§! เราควรเตรียมรับมือกับการตอบโตที่อาจเกิดขึ้นจาก§Yสหภาพโซเวียต§!"
 TUR_fully_integrate_the_is_bank: "ผนวกรวมธนาคารอิชอยางสมบูรณ"
 TUR_fully_integrate_the_is_bank_desc: "เจลาล บายาร และกลุมเสรีนิยมผูมีแนวคิดเดียวกันและผูสนับสนุนประชาธิปไตย ไดผูกตนเขากับธนาคารอิช ซึ่งอตาเติรกกอตั้งขึ้นในป 1924 การผนวกรวมธนาคารอิชและกลุมเสรีนิยมที่ผูกพันกับธนาคารนี้ จะเปนสัญญาณแกชาติของเราและโลกภายนอกวาตุรกีพรอมแลวที่จะกาวยางอยางระมัดระวังอีกไมกี่กาวไปสูการเปนประชาธิปไตยเต็มรูปแบบ"
 TUR_sanayiciler_liberals_tt: "\nการตัดสินใจ§Yโครงการอุตสาหกรรมของซานายีจิเลร§!จะมีราคาถูกลงเนื่องจากแบบจําลองเศรษฐกิจเสรีนิยมของเรา"
 TUR_continue_the_sumerbank_industrialization_scheme: "ดําเนินโครงการอุตสาหกรรมซือแมรแบงกตอไป"
 TUR_continue_the_sumerbank_industrialization_scheme_desc: "โรงงานสิ่งทอซือแมรแบงกซึ่งกอตั้งในป 1933 เปนธนาคารของรัฐที่ใหทุนแกการกอสรางและพัฒนาอุตสาหกรรมสิ่งทอในประเทศของเรา เราควรขยายความรับผิดชอบของธนาคารตอไป และขยายอุตสาหกรรมของเราตามแผนหาป"
 TUR_continue_the_sumerbank_industrialization_scheme_tt: "หาก§Y$TUR_first_five_year_plan$§!§Gมีผลอยู§!:"
 TUR_continue_the_sumerbank_industrialization_scheme_2_tt: "หาก§Y$TUR_first_five_year_plan$§!§Rไมได§!มีผลอยู:"
 TUR_millet_mektebi_focus: "มิลเลต เม็กเตปเลรี"
 TUR_millet_mektebi_focus_desc: "แมโครงการนี้จะดําเนินมาระยะหนึ่งแลว แตการปฏิรูปตัวอักษรและภาษายังคงอยูระหวางการนําไปใชทั่วประเทศ เพื่อแกปญหาการไมรูหนังสือที่แพรหลาย เราควรใชประโยชนจากสมาคมวิจัยภาษาตุรกีและโครงการโรงเรียนของชาติ และตองจัดสรรงบประมาณเพิ่มเติมใหคณะครูเคลื่อนที่ที่เดินทางไปตามหมูบานที่ไมมีโรงเรียน เพื่อผลักดันใหอัตราการรูหนังสือสูงขึ้น"
 TUR_ratify_the_six_arrows: "รับรองหลักศรหกดอก"
 TUR_ratify_the_six_arrows_desc: "ศรหกดอกเปนสัญลักษณของเสาหลักพื้นฐานทั้งหกของลัทธิเคมาล และการบรรจุหลักการเหลานี้ลงในรัฐธรรมนูญแหงชาติของตุรกียอมชวยเราไดมากในภารกิจปลูกฝงคุณคาแบบเคมาลใหหยั่งรากทั่วทั้งตุรกี"
 TUR_privatize_the_anadolu_agency: "แปรรูปสํานักขาวอานาโดลู"
 TUR_privatize_the_anadolu_agency_desc: "เสรีภาพสื่อเปนสิ่งจําเปนในระบอบประชาธิปไตยที่แทจริง และแมเราอาจไมชอบสื่อเสรีนัก เราก็ตองเรียนรูที่จะอยูกับมัน เราสามารถกาวไปในทิศทางนี้ไดอยางมากดวยการแปรรูปสํานักขาวอานาโดลูของรัฐ ซึ่งเผยแพรขาวสารทั่วตุรกีมาตั้งแตอตาเติรกกอตั้งในป 1920"
 TUR_privatize_the_anadolu_agency_tt: "ลบการตัดสินใจ§Yบังคับใชการเซ็นเซอรสื่อ§!"
 TUR_lift_the_ban_on_other_political_parties: "ยกเลิกการหามพรรคการเมืองอื่น"
 TUR_lift_the_ban_on_other_political_parties_desc: "ทุกครั้งโดยไมมีขอยกเวน เมื่อมีการจัดตั้งพรรคการเมืองใหมขึ้นมาแขงขันกับ CHP พรรคนั้นก็จะถูกพวกคลั่งศาสนาชวงชิงไป ซึ่งพรอมจะบิดเบือนสาธารณรัฐและหลักการกอตั้งของเราเพื่อประโยชนของตน ครั้งนี้ตองตางออกไป - แตเราก็ยังตองเฝาระวังเชนเดิม"
 TUR_holding_our_first_multi_party_election: "จัดการเลือกตั้งแบบหลายพรรคครั้งแรก"
 TUR_holding_our_first_multi_party_election_desc: "ชะตากรรมของสาธารณรัฐตุรกีแขวนอยูบนการเลือกตั้งที่กําลังจะมาถึง แตเราสาบานวาจะตอสูอยางยุติธรรม และเราก็ไดทําเชนนั้นแลว เราไวใจไดวาชาวตุรกีจะตัดสินใจอยางถูกตอง"
 TUR_official_opposition_party_organised: "มีการจัดตั้งพรรคฝายคานอยางเปนทางการแลว"
 TUR_democratic_transition_focus: "[Root.GetDemocraticTransitionFocusName]"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_STANDARD: "บรรลุความฝนของอตาเติรก"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_ISLAMIST: "มิลเลติน อดามือ"
 TUR_democratic_transition_focus_desc: "[Root.GetDemocraticTransitionFocusDesc]"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_STANDARD: "มุสตาฟา เคมาล อตาเติรก ใฝฝนมานานวาสักวันหนึ่ง[ROOT.GetNameDef]จะกลายเปนประชาธิปไตยที่สมบูรณ และดูเหมือนวาเราไดทําความฝนนั้นใหเปนจริงสําเร็จแลว"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_ISLAMIST: "อัดนาน เมนเดเรส ไดกลายเปนบุรุษแหงชาติ ดวยการผลักดันนโยบายอิสลามนิยมอยางเปดเผยบนเวทีสิทธิประชาธิปไตย [ROOT.GetNameDefCap]กําลังเผชิญการปฏิวัติฝายอนุรักษนิยม และทั้งโลกทําไดเพียงเฝามองอยางหวั่นวิตก"
 TUR_expanding_our_armaments: "ขยายการสะสมอาวุธ"
 TUR_expanding_our_armaments_desc: "โลกกําลังเปลี่ยนแปลง และเราจะมีหนาที่จับอาวุธขึ้นตอสูกับผูที่คุกคามไมเพียงสาธารณรัฐตุรกี แตรวมถึงรากฐานทางอุดมการณที่สาธารณรัฐตั้งอยูดวย คงไมยากนักที่จะโนมนาวกลุมซานายีจิเลรในเรื่องนี้ และไดรับความชวยเหลือจากพวกเขาในการปกปองประเทศ"
 TUR_permit_regional_elections: "อนุญาตใหมีการเลือกตั้งระดับภูมิภาค"
 TUR_permit_regional_elections_desc: "ตุรกีเปนประเทศใหญที่มีหลากหลายศาสนา วัฒนธรรม และผลประโยชน - บางทีคงไมเปนการบิดขอบเขตของรัฐธรรมนูญมากเกินไปนัก หากเราจะใหอํานาจปกครองตนเองในระดับหนึ่งทั่วประเทศ แมแตกับผูที่ตอตานลัทธิเคมาลอยางหนักที่สุด... ทั้งหมดนี้ก็เพื่อความมั่นคงของชาติ แนนอนอยูแลว"
 TUR_unlock_reconciliation_occupation_law_tt: "ปลดล็อกกฎหมายการยึดครอง: §Yการปรองดอง§!"
 TUR_truce_with_government_called_flag: "มีการประกาศสงบศึกกับรัฐบาลแลว"
 TUR_privatize_our_infrastructure: "แปรรูปโครงสรางพื้นฐาน"
 TUR_privatize_our_infrastructure_desc: "ในฐานะเสรีนิยมผูแนวแน เราควรเรียนรูที่จะพึ่งพาภาคเอกชนมากขึ้น แทนที่จะปลอยใหรัฐเขาแทรกแซงการกอสรางทุกเรื่อง หากมีความตองการโครงสรางพื้นฐานในจังหวัดมากขึ้น ตลาดก็จะลุกขึ้นมาตอบสนองความตองการนั้นเอง!"
 TUR_democratic_capstone_focus: "[Root.GetDemocraticCapstoneFocusName]"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_STANDARD: "มองออกไปภายนอก"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_ISLAMIST: "กวาดลางนายทหาร"
 TUR_democratic_capstone_focus_desc: "[Root.GetDemocraticCapstoneFocusDesc]"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_STANDARD: "การเปนมหาอํานาจประชาธิปไตยที่มีความรับผิดชอบมีหนาที่มากกวาแคการรับประกันเสรีภาพของพลเมืองตนเอง โลกนี้อันตราย และประชาธิปไตยทั่วโลกกําลังถูกกองกําลังชั่วรายโจมตี เรามีหนาที่ตองยืนหยัดเพื่อเสรีภาพ"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_ISLAMIST: "เราไมอาจปกครองไดอยางมีประสิทธิภาพจนกวาจะกวาดลางพวกเคมาลิสตสวะออกจากทุกองคาพยพของรัฐ เราไมอาจไวใจไดดวยซํ้าวากองทัพของเราจะภักดีตอรัฐบาลที่มาจากการเลือกตั้งโดยชอบธรรม! สิ่งนี้ตองเปลี่ยนแปลง"
 TUR_civil_war_tt: "§Rการกวาดลางพวกเคมาลิสตออกจากกองทัพจะนําไปสูสงครามกลางเมือง ความไดเปรียบในตอนเริ่มตนจะขึ้นอยูกับความแข็งแกรงของฝายอิสลามนิยมในภาคกลาง และขึ้นอยูกับวาเราไดปฏิรูปกองทัพแลวหรือไม เคอรดิสถานจะแยกตัวออกไปและตอสูเพื่ออิสรภาพหากเสถียรภาพตํ่ากวา 60% เมื่อแผนยุทธศาสตรนี้สําเร็จ§!"
 TUR_the_sanayiciler: "ซานายีจิเลร"
 TUR_the_sanayiciler_desc: "อตาเติรกทํางานอยางไมรูเหน็ดเหนื่อยมาหลายปเพื่อบมเพาะชนชั้นผูประกอบการและนักอุตสาหกรรมใหชวยปรับปรุงรัฐของเราใหทันสมัย ถึงเวลาหยุดบมเพาะและเริ่มเก็บเกี่ยว - เราจะรวมมือกันทําใหตุรกีเปนมหาอํานาจระดับภูมิภาคที่แขงขันได"
 TUR_sanayiciler_tt: "ดวยการใช§Yอํานาจทางการเมือง§!และวิธีการอื่นๆ ที่เรามี เราจะสามารถสงเสริมชนชั้นอุตสาหกรรมที่กําลังเติบโตใหลงทุนทรัพยากรของพวกเขาในการสราง§Yโรงงานพลเรือน§!และ§Yโรงงานทหาร§!เพื่อการใชงานของรัฐ\n"
 TUR_cooperate_with_the_debt_council: "รวมมือกับสภาหนี้"
 TUR_cooperate_with_the_debt_council_desc: "เมื่อฝุนควันของมหาสงครามจางลง สาธารณรัฐตุรกียังคงยืนหยัดอยูไดในฐานะชาติที่เสรีและเปนเอกราช เออ ยกเวนขอเท็จจริงที่วา[TUR.GetNameDef]ไดรับมรดกหนี้มหาศาลที่จักรวรรดิออตโตมันกอไว และหนี้นั้นก็ถูกบริหารจัดการในตางแดนโดยผูที่เกือบจะพิชิตเราได มันไมใชสถานการณที่ดีนัก แตเราสามารถรวมมือกันและคิดหาแนวทางที่เปนประโยชนตอทุกฝายได"
 TUR_debt_council_nationalized_tt: "§Yสภาหนี้§!จะไมควบคุมหนี้ของ§Y[TUR.GetNameDef]§!อีกตอไป"
 TUR_utilize_foreign_capital: "ใชประโยชนจากทุนตางชาติ"
 TUR_utilize_foreign_capital_desc: "ชาติของเรายังใหมและดินแดนสวนใหญยังไรอุตสาหกรรม แตเราไมจําเปนตองทํางานนี้ลําพัง ตุรกีที่เขมแข็งเปนผลประโยชนของมหาอํานาจยุโรปหลายชาติ และหากเราไปขอความชวยเหลือ พวกเขายอมใหอยางแนนอน"
 TUR_foreign_capital_tt: "ยิ่งความสัมพันธของเรากับ§Yมหาอํานาจเกาแหงยุโรป§!และ§Yสหรัฐอเมริกา§!ดีขึ้นเทาไร เราก็จะมีทางเลือกใน§Yการลงทุน§!ที่จายไดมากขึ้นเทานั้น"
 TUR_treaty_of_saadabad: "สนธิสัญญาซาอาดาบาด"
 TUR_treaty_of_saadabad_desc: "เราไมมีอะไรจะเสียและมีแตจะไดจากการรักษาไมตรีกับเพื่อนบานทางตะวันออก แนวคิดเรื่องสนธิสัญญาที่ทําใหมิตรภาพของเราเปนทางการถูกหยิบยกขึ้นมาเปนครั้งคราว และถึงเวลาแลวที่ตุรกีจะริเริ่มและทําใหมิตรภาพนี้ถูกบัญญัติไวในสนธิสัญญา"
 TUR_assess_our_future: "ประเมินอนาคตของเรา"
 TUR_assess_our_future_desc: "เมื่อมุสตาฟา เคมาล อตาเติรก ปลดปลอยชาตินี้และประกาศเอกราช เขามีวิสัยทัศนที่ชัดเจนอยางยิ่งวารัฐ[ROOT.GetAdjective]ควรมีหนาตาเปนอยางไรในทายที่สุด ถึงเวลาแลวที่จะวิเคราะหวาวิสัยทัศนของกาซีของเรายังสอดคลองกับลําดับความสําคัญของรัฐบาลปจจุบันหรือไม"
 TUR_choices_will_decide_legacy_tt: "§Yมุสตาฟา เคมาล อตาเติรก§!สนับสนุนการเปลี่ยนผานของ§Y[ROOT.GetNameDef]§!จากรัฐเผด็จการพรรคเดียวไปสูประชาธิปไตยเสรีแบบหลายพรรคมาอยางยาวนาน การเลือกทิศทางทางอุดมการณของชาติจะสะทอนวาเราถูกมองวาดําเนินตามอุดมการณของ§Yอตาเติรก§!ไดดีเพียงใด"
 TUR_ataturk_seeking_treatment: "อตาเติรกกําลังเขารับการรักษา"
 TUR_the_hatay_issue: "ปญหาฮาทาย"
 TUR_the_hatay_issue_desc: "เราไมอาจนิ่งดูดายปลอยใหชนกลุมนอยชาวเติรกถูกกดขี่โดยพวกอาหรับผูเรียกรองดินแดนและพวกจักรวรรดินิยมฝรั่งเศสไดอีกตอไป ความคิดที่วาฮาทายไมใชสวนหนึ่งของตุรกีโดยชอบธรรมนั้นนาขัน และควรถูกปดตกทันทีในฐานะลัทธิแกประวัติศาสตร ถึงเวลาแกไขความผิดพลาดของป 1921"
 TUR_peace_in_the_world: "สันติภาพในโลก"
 TUR_peace_in_the_world_desc: "อตาเติรกเคยประกาศใหสันติภาพในโลกเปนเปาหมายสูงสุดของนโยบายตางประเทศตุรกี และเราตั้งใจจะดําเนินตามเปาหมายอันสูงสงนั้น เรามุงสูสันติภาพบนโลก ไมใชสงครามชั่วนิรันดรเพื่อแยงชิงดินแดนเล็กๆ นอยๆ"
 TUR_continue_the_policy_of_etatism: "สานตอนโยบายรัฐนิยมทางเศรษฐกิจ"
 TUR_continue_the_policy_of_etatism_desc: "อิสเมต อีเนอนู และกลุมรัฐมนตรีฝายซายดวยกัน สนับสนุนใหเปลี่ยนนโยบายเศรษฐกิจจากเสรีนิยมแบบปลอยใหทําไป ไปสูเศรษฐกิจที่รัฐบริหารจัดการในแบบเฉพาะของตุรกี รัฐนิยมทางเศรษฐกิจ เชนเดียวกับลัทธิเคมาล คือการหลอมรวมอุดมการณฝายซายและฝายขวาอยางลงตัวใหกลายเปนสิ่งที่ยิ่งใหญกวา ซึ่งรับใชชาวตุรกีไดดีที่สุด"
 TUR_sanayiciler_etatism_tt: "\nการตัดสินใจ§Yโครงการอุตสาหกรรมของซานายีจิเลร§!จะมีราคาแพงขึ้นเนื่องจากแบบจําลองเศรษฐกิจแบบรัฐนิยมของเรา"
 TUR_peace_at_home: "สันติภาพในบาน"
 TUR_peace_at_home_desc: "ศัตรูที่อาจเกิดขึ้นจะตะครุบเราทันทีที่สัมผัสไดถึงความออนแอภายใน เปนความรับผิดชอบสูงสุดของรัฐบาลตุรกีทุกชุดที่จะตองรักษาความผาสุกและเสถียรภาพภายในของรัฐ เมื่อเรามีสันติภาพในบาน เราจึงจะมุงหวังสันติภาพในโลกได"
 TUR_turkish_state_railways: "การรถไฟแหงรัฐตุรกี"
 TUR_turkish_state_railways_desc: "หากรัฐไมเขามาแทรกแซง ประเทศของเราจะเปนชาติที่แตกตางกันอยางสุดขั้วตลอดไป ระหวางเมืองที่รํ่ารวยทางตะวันตกกับชนเผาที่กระจัดกระจายทางตะวันออก ดวยการเชื่อมชาติเขาดวยกันผานโครงสรางพื้นฐาน เราจะนําตุรกีทั้งประเทศเขาสูศตวรรษที่ยี่สิบ ไมใชแคเมืองชายฝงที่มั่งคั่งริมทะเลอีเจียน"
 TUR_revive_turkish_revolutionism: "ฟนฟูลัทธิปฏิวัติแบบตุรกี"
 TUR_revive_turkish_revolutionism_desc: "การปฏิรูประบบการเมืองตุรกีพิสูจนแลววาไมเพียงพอเมื่อเผชิญกับการตอตานอยางกวางขวางของชาวตุรกี แตทางออกคือการเอาใจมวลชน หรือการทุมเทใหการปฏิรูปที่รุนแรงยิ่งขึ้น? ลัทธิเคมาลเคยเปลี่ยนแปลงในระดับแกนแทมาแลว ใครจะบอกไดวาการปรับโครงสรางองคประกอบทางอุดมการณครั้งตอไปจะพามันไปทางไหนในอนาคต?"
 TUR_reinvigorate_turkish_nationalism: "ปลุกชาตินิยมตุรกีอีกครั้ง"
 TUR_reinvigorate_turkish_nationalism_desc: "หนทางเดียวที่จะรวมประเทศใหเปนหนึ่งคือการเลียนแบบการปกครองของมุสโสลินี เราตองการผูนําฝายขวาที่เขมแข็ง ไมตอตานการปฏิรูปเศรษฐกิจแบบฝายซาย และสามารถพูดเขาถึงใจประชาชน มีเพียงชายคนเดียวที่เหมาะกับงานนี้: จอมพลเฟฟซี ชักมัก ผูทรงเกียรติ"
 TUR_the_second_five_year_plan: "แผนหาปฉบับที่สอง"
 TUR_the_second_five_year_plan_desc: "แผนหาปฉบับแรกประสบความสําเร็จอยางยิ่ง รัฐมนตรีที่เกงที่สุดของประเทศจึงมารวมตัวกันและตัดสินใจวา ในเมื่อแผนหาปฉบับแรกสําเร็จขนาดนี้ ทําไมไมทําอีกสักฉบับละ?"
 TUR_the_guardians_of_kemalism: "ผูพิทักษลัทธิเคมาล"
 TUR_the_guardians_of_kemalism_desc: "คณะนายทหารเคมาลิสตทําไดเพียงจํากัดในการเผยแพรอุดมการณเคมาลทั่วประเทศ ถึงเวลาแลวที่รัฐบาลจะใชแนวทางเชิงรุกมากขึ้นเพื่อชวยใหลัทธิเคมาลชนะใจชาวตุรกี"
 TUR_kemalist_state_targets_tt: "รัฐที่ไมฝกใฝฝายใดสองรัฐจะกลายเปน§Yเคมาลิสต§!\n"
 TUR_the_sun_language_theory: "ทฤษฎีภาษาสุริยะ"
 TUR_the_sun_language_theory_desc: "ทฤษฎีภาษาสุริยะคือทฤษฎีที่วาภาษาทั้งหมดของมนุษยสืบเชื้อสายมาจากภาษาตนตระกูลเตอรกิกภาษาเดียวกัน ทฤษฎีนี้ยอมสมเหตุสมผลอยางสมบูรณ และเปนเรื่องจําเปนที่รัฐจะตองสนับสนุนทฤษฎีนี้อยางเปนทางการและเริ่มสอนไปทั่วประเทศ"
 TUR_variant_turkish_tax_focus: "[Root.GetTurkishVariantTaxName]"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_STANDARD: "วารลึค แวรกีซี"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_SECULAR: "อีนันช แวรกีซี"
 TUR_variant_turkish_tax_focus_desc: "[Root.GetTurkishVariantTaxDesc]"
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_STANDARD: "เราจะเก็บ 'ภาษีความมั่งคั่ง' จากผูที่ไมใชมุสลิมในประเทศ เพื่อใหมีเงินทุนสนับสนุนโครงการอุตสาหกรรมไดดีขึ้น และสนับสนุนภารกิจในการทําให[ROOT.GetNameDef]เปนรัฐฆราวาส"
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_SECULAR: "สถาบันศาสนาในประเทศนี้สุขสบายเกินไปมานานเกินไปแลว ผูมีอํานาจทางศาสนาพยายามบอนทําลายรัฐบาลนี้และความพยายามของรัฐบาลครั้งแลวครั้งเลา บัดนี้เราจะปลดเปลื้องความมั่งคั่งของพวกเขา เพื่อนําไปใชใหเกิดประโยชนมากกวา"
 TUR_turk_ulusu: "เติรก อูลูซู"
 TUR_turk_ulusu_desc: "สวนหนึ่งของการเปนประเทศสมัยใหมที่มีความรับผิดชอบคือการนิยามใหมวาการเปนพลเมืองของประเทศนั้นหมายถึงอะไร เราเขมงวดเกินไปในการนิยามความเปนเติรก และเพื่อสะทอนองคประกอบของประเทศอยางเหมาะสม ถึงเวลาแลวที่เราจะขยายนิยามวาอะไรทําใหพลเมืองคนหนึ่งเปนชาวเติรก"
 TUR_loosen_the_laws_on_secularism: "ผอนคลายกฎหมายวาดวยความเปนฆราวาส"
 TUR_loosen_the_laws_on_secularism_desc: "ศาสนาเปนปจจัยที่สรางความแตกแยกใหชาติของเรามากที่สุด เราเลือกเดินบนเสนทางแหงความเปนฆราวาส แตเพื่ออะไร? เพื่อเลียนแบบชาติที่ออนแอของตะวันตกหรือ? ไมใชกิจของรัฐที่จะตัดสินวามนุษยควรสวดภาวนาตอพระเจาของตนเมื่อไร ที่ไหน และอยางไร"
 TUR_purify_the_diyanet: "ชําระลางดิยาเนต"
 TUR_purify_the_diyanet_desc: "ดิยาเนตเต็มไปดวยคนที่ไมเคยสวดภาวนาตอพระผูเปนเจาแมแตครั้งเดียวในชีวิตอันวางเปลาของพวกเขา ดิยาเนตควรเต็มไปดวยผูมีศรัทธา: ผูที่อุทิศตนรับใชรัฐและหันหาอัลลอฮเพื่อขอการชี้นําและความสงบใจ!"
 TUR_kemalist_officers_made_hostile_tt: "§Rนายทหารเคมาลิสตจะคัดคานแนวทางของรัฐบาลอยางรุนแรง§!"
 TUR_rehabilitate_the_kadro_movement: "ฟนฟูขบวนการคาดโร"
 TUR_rehabilitate_the_kadro_movement_desc: "เปนความผิดพลาดที่ปดคาดโรและสลายนักทฤษฎีของขบวนการไป พวกเขาเสนอแนวคิดใหมและปฏิวัติตอรัฐ แตเรากลับหันหลังให ชาติรูปแบบใหมตองการแนวคิดใหม และไมมีแนวคิดใดกลาหาญไปกวาที่พบในคาดโร!"
 TUR_kemalism_and_the_modern_movement: "ลัทธิเคมาลกับขบวนการสมัยใหม"
 TUR_kemalism_and_the_modern_movement_desc: "เมื่อเรเจป เปเกร กลับจากอิตาลีพรอมรายงานวาลัทธิฟาสซิสตจะเขากันไดกับลัทธิเคมาลอยางไร เขากลับถูกปลดจากตําแหนง ลัทธิฟาสซิสตคือหลักความเชื่อแหงศตวรรษที่ยี่สิบ และเราโงเขลาที่มองขามอุดมการณที่เหมาะกับตุรกีที่สุด ทั้งที่มันจองมองเราอยูตรงอีกฟากของทะเลเอเดรียติก!"
 TUR_kemalism_and_the_modern_movement_tt: "ประเทศ§Yฟาสซิสต§!ทั้งหมดใน§Yยุโรป§!จะมีทัศนคติตอ[ROOT.GetNameDef]เพิ่มขึ้น§G+25§!"
 TUR_integrate_the_fascist_council: "ผนวกรวมสภาฟาสซิสต"
 TUR_integrate_the_fascist_council_desc: "สภาฟาสซิสตที่ปรึกษาของเรเจป เปเกร ดํารงอยูที่ชายขอบของรัฐมานานพอแลว ถึงเวลาเริ่มผนวกรวมคุณคาแบบฟาสซิสตตุรกีเขาสูกรอบของลัทธิเคมาล"
 TUR_restack_the_officer_corps: "จัดคณะนายทหารใหม"
 TUR_restack_the_officer_corps_desc: "คณะนายทหารยึดถือคุณคาหลักของตุรกี แตคุณคาหลักเหลานั้น... ไดเปลี่ยนไปแลว หากเหลานายทหารไมเต็มใจสะทอนคุณคาปจจุบันของอุดมการณเคมาล เราก็จะบังคับใหพวกเขายึดถือคุณคาเหลานั้น"
 TUR_restack_the_officer_corps_tt: "§Yนายทหารเคมาลิสต§!จะถูกจัดระเบียบใหมใหคลอยตามความตองการของรัฐบาลมากขึ้น \n§Rหากประเทศมีเสถียรภาพตํ่ากวา 50% และนายทหารเคมาลิสตมีอํานาจมาก คาดไดวาพวกเขาจะกอกบฏตอรัฐบาล!§!"
 TUR_form_the_redshirts: "กอตั้งพวกเสื้อแดง"
 TUR_form_the_redshirts_desc: "ขบวนการฟาสซิสตที่ชอบธรรมทุกขบวนการทั่วโลกลวนมีกลุมเสื้อสี! อังกฤษและอิตาลีมีเสื้อดํา เยอรมนีมีเสื้อนํ้าตาล จีนมีเสื้อนํ้าเงิน - สีแดงสะทอนสาธารณรัฐตุรกีไดดีที่สุด เราจึงจะกอตั้งพวกเสื้อแดง! เมื่อผูคนไดยินคําวา 'เสื้อแดง' พวกเขาจะนึกถึงชายหญิงที่สนับสนุนขบวนการของเราทันที! เราชางเปนอัจฉริยะ!"
 TUR_fatherland_first: "มาตุภูมิมากอน!"
 TUR_fatherland_first_desc: "มีหลายภาคสวนในสังคมตุรกีที่พรอมบอนทําลายรัฐบาลและสั่นคลอนสังคมของเราดวยเหตุผลอันเห็นแกตัว สิ่งนั้นจะจบลงที่เรา: นับจากนี้ พลเมืองตุรกีทุกคนจะยึดมาตุภูมิมากอน!"
 TUR_fatherland_first_tt: "เราจะเรียกรองทั่วประเทศให£faction_tur_traditionalist §Yฝายจารีตนิยม§! £faction_tur_kurdish §Yชาวเคิรด§! และผูถูกกดขี่อื่นๆ ในชาติของเรา รวมตัวกันและสนับสนุนรัฐบาลที่เปนตัวแทนของพวกเขาทั้งหมด"
 TUR_deal_for_the_oniki_islands: "เจรจาเรื่องหมูเกาะโอนิกิ"
 TUR_deal_for_the_oniki_islands_desc: "หมูเกาะโอนิกินอกชายฝงของเราถูกฉกฉวยไปจากมือเราและสงตอใหชาวอิตาลีผูละโมบ แตกอนหนานั้นชาวกรีกผูทรยศก็ไดอางสิทธิ์ในหมูเกาะนี้ไวแลว โรดสเคยเปนของตุรกี และโรดสจะกลับมาเปนของตุรกีอีกครั้ง!"
 TUR_the_pontic_redoubt: "ที่มั่นปอนตัส"
 TUR_the_pontic_redoubt_desc: "เราทุมเทใหแนวปองกันทางตะวันตกมานานเกินไป ขณะที่เพิกเฉยตอพรมแดนที่ติดกับ[SOV.GetNameDef]ซึ่งเรียกรองดินแดนอยางเปดเผย! เราไมอาจหวังจะยันพวกเขาไวที่พรมแดนไดนาน แตดวยการสรางที่มั่นเสริมกําลังตามแนวแมนํ้า เราอาจหวังจะเอาชนะพวกเขาในสงครามบั่นทอนกําลังได เรายังมีความหวังอื่นอีกหรือ?"
 TUR_pontic_redoubt_trabzon_tt: "เพิ่ม§Yปอมปราการทางบก 7 แหง§!ตามแนวแมนํ้าโชรูหใกลพรมแดน[SOV.GetAdjective]\n"
 TUR_pontic_redoubt_van_tt: "เพิ่ม§Yปอมปราการทางบก 6 แหง§!ตามแนวลํานํ้าคารสใกลพรมแดน[SOV.GetAdjective]\n"
 TUR_pontic_redoubt_erzurum_tt: "เพิ่ม§Yปอมปราการทางบก 3 แหง§!ในเมืองแอรซูรุม\n"
 TUR_abuse_the_office_of_soil_products: "ใชสํานักงานผลิตผลทางดินในทางมิชอบ"
 TUR_abuse_the_office_of_soil_products_desc: "สํานักงานท็อปรัค มาหซุลเลรี โอฟซี กอตั้งขึ้นเพื่อกํากับการผลิตอาหารและคาจางแรงงานภาคเกษตร แต[ROOT.GetNameDef]ไมไดตองการเกษตรกร - เราตองการที่ดิน เราจะกดดันเจาของไรนาที่ผลิตไดไมดีใหขายที่ดิน เพื่อสรางอุตสาหกรรมใหมบนที่ดินเหลานั้นเพื่อประโยชนของชาติโดยรวม"
 TUR_kemalist_socialist_theory: "ทฤษฎีสังคมนิยมแบบเคมาล"
 TUR_kemalist_socialist_theory_desc: "ขบวนการคาดโรยึดถือสังคมนิยมในรูปแบบที่รักชาติโดยพื้นฐาน และมีความคลายคลึงกับฟาสซิสตสายอังกฤษและลัทธิมารกซ-เลนินในหลายดาน โดยแกนแทแลว คาดโรใหความสําคัญกับแรงงานชาวตุรกีเปนอันดับแรกในระดับพื้นฐาน โดยไมพยายามลบลางอัตลักษณแหงชาติของพวกเขา ขบวนการของเราคือขบวนการปฏิวัติอยางแทจริง และที่สําคัญกวานั้น: มันคือขบวนการของตุรกีอยางแทจริง"
 TUR_patriotism_over_internationalism: "ความรักชาติเหนือสากลนิยม"
 TUR_patriotism_over_internationalism_desc: "เราปฏิเสธสากลนิยมของลัทธิทรอตสกีและลัทธิมารกซหัวรุนแรง และเลือกสังคมนิยมในรูปแบบชาตินิยมอยางแทจริง ความทุกขยากของแรงงานสากลเปนเรื่องรองเมื่อเทียบกับการตอสูของแรงงานตุรกี และนั่นคือสิ่งที่ทําใหสังคมนิยมแบบเคมาลแตกตางจากคอมมิวนิสตสายที่หัวรุนแรงกวา"
 TUR_create_the_turkish_workers_militia: "จัดตั้งกองกําลังอาสาแรงงานตุรกี"
 TUR_create_the_turkish_workers_militia_desc: "การเมืองเปนเรื่องสกปรก และไมมีระบอบใดไดรับการรับประกันวาจะคงอยูตลอดไป เปนเรื่องสําคัญที่เราตองติดอาวุธใหแรงงาน และมอบทั้งเครื่องมือและเจตจํานงใหพวกเขาปกปองสิทธิของตนจากใครก็ตามที่จะพรากมันไป ไมวาจะเปนมหาอํานาจตางชาติ หรือขบวนการการเมืองหนาใหมภายในพรมแดนของเราเอง"
 TUR_halk_ve_devlet: "ฮัลค เว เดฟเลต"
 TUR_halk_ve_devlet_desc: "'ประชาชนและรัฐ' - นี่คือสิ่งสําคัญอันดับแรกของรัฐบาลสังคมนิยมแบบเคมาลของเรา เราตองปกปองและคุมครองประชาชน และวิธีที่ดีที่สุดคือการเสริมอํานาจของรัฐในทุกเรื่อง"
 TUR_nationalise_all_private_industry: "โอนอุตสาหกรรมเอกชนทั้งหมดเปนของรัฐ"
 TUR_nationalise_all_private_industry_desc: "เราไมไดมองขามคุณูปการของนักอุตสาหกรรมและฝายเสรีนิยมในการตอสูรวมกันเพื่อปกปองรัฐตุรกีจากมหาอํานาจตางชาติที่หมายจะขยํ้าเรา แตพวกเขากลับลําพองเกินตัว ขณะที่ปกปองเราจากนายทุนผูลาเหยื่อ พวกเขาก็กลายเปนนายทุนผูลาเหยื่อเสียเอง เราทนตอไปไมไดแลว เราตองโอนอุตสาหกรรมเปนของรัฐและปกปองแรงงานของเรา"
 TUR_georgian_manganese_extraction: "การสกัดแมงกานีสในจอรเจีย"
 TUR_georgian_manganese_extraction_desc: "ในจอรเจียยังมีแรธาตุและโลหะมากมายที่ไมไดถูกใชประโยชน ขณะที่คลังเหล็กกลาของเรายังคงตํ่าจนนาผิดหวัง เราจะสงขอเสนอไปยังฝายบริหารทองถิ่นของจอรเจีย เพื่อตอรองขอสิทธิ์สกัดโลหะใหพวกเขา แลกกับการเก็บสวนเกินบางสวนไวเอง หากพวกเขาตกลง เราจะผลิตเหล็กกลาขางๆ แหลงดําเนินการในทราบซอน"
 TUR_salt_the_scars_of_the_great_war: "โรยเกลือลงบนแผลแหงมหาสงคราม"
 TUR_salt_the_scars_of_the_great_war_desc: "ชาวตุรกีออนแอลงในชวงหลายปนับตั้งแตสงครามประกาศอิสรภาพ ไหนละความเดือดดาลที่เราตองการอยางยิ่งหากจะแผแสนยานุภาพไปทั่วโลก? เราสูญเสียไปมากในมหาสงคราม มากกวาชาติสวนใหญ และเหตุผลเดียวที่เรารอดมาไดคือเราสูยิบตาเพื่อสิทธิที่จะอยูรอด ในสงครามครั้งหนาเราก็จะสูยิบตาเชนกัน"
 TUR_intervene_in_the_spanish_civil_war: "แทรกแซงสงครามกลางเมืองสเปน"
 TUR_intervene_in_the_spanish_civil_war_desc: "สงครามกลางเมืองสเปนไดกลายเปนจานเพาะเชื้อของโลกสําหรับอุดมการณที่แขงขันกัน เราใชทะเลเมดิเตอรเรเนียนรวมกัน และนั่นทําใหเรามีสิทธิ์มากกวาใครที่จะเลือกเขาแทรกแซงเพื่อสนับสนุนฝายที่เราเลือกในสงคราม"
 TUR_a_common_destiny_for_all_of_turkey: "ชะตากรรมรวมของตุรกีทั้งมวล"
 TUR_a_common_destiny_for_all_of_turkey_desc: "เติรก กรีก เคิรด คริสเตียน มุสลิม ผูไมนับถือศาสนา - เราทุกคนอยูในเรือลําเดียวกัน เปนผลประโยชนรวมกันที่เราจะรวมตัวเปนหนึ่งเดียวและสนับสนุนรัฐบาลที่เขมแข็ง ซึ่งยึดถือแนวคิดหัวกาวหนาและทํางานเพื่อสวนรวม เราจะยืนหยัดอยางเปนปกแผน หรือไมก็พินาศเพราะแตกแยก"
 TUR_hunt_down_fifth_columnist_islamists: "ตามลาแนวรวมที่หาอิสลามนิยม"
 TUR_hunt_down_fifth_columnist_islamists_desc: "ขณะที่ยุโรปกังวลกับแนวรวมที่หาคอมมิวนิสตสากลนิยม เราตองตอสูกับแนวรวมที่หาสากลนิยมของเราเองมาตั้งแตชาติถือกําเนิด ไมมีภัยคุกคามตอการดํารงอยูของสาธารณรัฐอันยิ่งใหญของเราใดรายแรงไปกวาอิสลามหัวรุนแรงและผูสนับสนุนที่ลาหลังของมัน เราจะบดขยี้กากเดนของจักรวรรดิออตโตมันเหลานี้เหมือนแมลงที่พวกมันเปน"
 TUR_pivot_to_the_past: "หันกลับสูอดีต"
 TUR_pivot_to_the_past_desc: "สงครามประกาศอิสรภาพอาจเปนสิ่งจําเปน แตสาธารณรัฐคือความผิดพลาด อตาเติรกไมอยูแลวที่จะปกปองสาธารณรัฐฆราวาสอันลํ้าคาของเขา และประชาชนก็เรียกรองใหสุลตานแหงออตโตมันกลับคืนมา เราจะสนองความตองการนั้น หลังจากปราบพวกเคมาลิสตใหสิ้นซากเสียกอน"
 TUR_purge_the_kemalists: "กวาดลางพวกเคมาลิสต"
 TUR_purge_the_kemalists_desc: "การกําจัดภัยรายเคมาลิสตออกจากประเทศ จะเปนการหวานเมล็ดพันธุเพื่อกลับสูวิถีชีวิตและการปกครองแบบเดิมของเรา การกลับมาของสุลตานเปนสิ่งที่หลีกเลี่ยงไมได เชนเดียวกับการลมสลายของพวกนิยมสาธารณรัฐที่อยูไดเพียงชั่วคราว"
 TUR_kemalists_purged_tt: "ลบตัวปรับคารัฐ£faction_tur_kemalist §Yเคมาลิสต§!ทั้งหมด"
 TUR_restore_the_divan: "ฟนฟูดีวาน"
 TUR_restore_the_divan_desc: "รัฐสภาของหุนเชิดพลเรือนที่ศัตรูของเราเลือกตั้งขึ้นมานะหรือ? ไม เราไมเคยตั้งใจใหมันอยูนานนักหรอก ถึงเวลานําวิถีเกากลับมา: เราจะฟนฟูดีวานเพื่อใหศาสนาอยูใจกลางของรัฐ และเราจะยกเลิกตําแหนงนายกรัฐมนตรีที่หยิบยืมมาจากชาวตะวันตก ถึงเวลานํามหาอัครเสนาบดีกลับมาแลว!"
 TUR_rebuilding_our_nation: "สรางชาติขึ้นใหม"
 TUR_rebuilding_our_nation_desc: "พวกเคมาลิสตทําลายชาติของเราในความพยายามอันไรผลที่จะกดเจตจํานงของประชาชน ศัตรูจะมองวาเราออนแอ ดังนั้นเราตองสรางใหมใหเร็วที่สุดเทาที่จะทําได!"
 TUR_return_of_the_sultan: "การกลับมาของสุลตาน"
 TUR_return_of_the_sultan_desc: "ในที่สุดก็ถึงเวลาทําสิ่งที่เราใฝฝนมานาน: เราตองนําสุลตานกลับจากการลี้ภัยทันที ผูจงรักภักดีของเราไดตัวพระองคไวแลว ที่เหลือก็เพียงนําพระองคกลับบานและจัดพิธีราชาภิเษกอันยิ่งใหญ"
 TUR_reclaim_macedonia: "ทวงคืนซันจักมาเกโดนยาลือ"
 TUR_reclaim_macedonia_desc: "สุนัขไรศรัทธาทางตะวันตกของเรามีบทบาทสําคัญในการลมสลายของจักรวรรดิออตโตมันครั้งที่แลว ชาวกรีกแคนเคืองเรานับตั้งแตวินาทีที่เราแยกชิ้นสวนจักรวรรดิอันนาสมเพชและออนแอของพวกเขา - และบัดนี้พวกเขาครอบครองเทรซและมาซิโดเนียสวนใหญไปจากเรา ถึงเวลาชวยเหลือเพื่อนรวมชาติของเรา พรอมกับแกแคนเล็กๆ นอยๆ ไปในตัว..."
 TUR_join_the_central_powers: "กลับเขารวมฝายมหาอํานาจกลาง"
 TUR_join_the_central_powers_desc: "ครั้งหนึ่งเราเคยลมเหลวรวมกันในฐานะกติกาสัญญาแหงมหาอํานาจ แตครั้งนี้เราจะไมลมเหลว! โชคชะตาไดมอบโอกาสครั้งที่สองใหเราทุกคนแกไขความผิดพลาดของมหาสงคราม และเราทุกคนตองรวมกันควาโอกาสนั้นไวใหมั่น!"
 TUR_press_the_austro_hungarian_claim: "ผลักดันการอางสิทธิ์ของออสเตรีย-ฮังการี"
 TUR_press_the_austro_hungarian_claim_desc: "การหวนคืนอยางมีชัยจากเถาถานของสาธารณรัฐตุรกีเปนเหตุการณที่ยิ่งใหญจริงๆ แตเราถูกลอมรอบทุกดานดวยศัตรูที่อยากเห็นเราถูกทําลายอีกครั้ง เราตองการพันธมิตร และการยกทัพที่นําโดยออตโตมันเขาสูลุมแมนํ้าดานูบก็แทบไมใชเรื่องที่ไมเคยเกิดขึ้นมากอน"
 TUR_aligning_bulgaria: "ดึงบัลแกเรียเขาฝาย"
 TUR_aligning_bulgaria_desc: "[BUL.GetNameDef] ชาติเดียวในฝายมหาอํานาจกลางที่รอดมาไดโดยที่อธิปไตยและวิถีชีวิตยังคงอยูครบ แลวพวกเขาทําอะไรกับมันบาง? ไมมีเลย พวกเขามันขี้ขลาด! เราจะไดเห็นกันวาพวกเขาขี้ขลาดแคไหนเมื่อเราจออยูที่คอและคอยกํากับใหทําหนาที่"
 TUR_reclaiming_our_lost_empire: "ทวงคืนจักรวรรดิที่ลมสลาย"
 TUR_reclaiming_our_lost_empire_desc: "การขับพวกเคมาลิสตออกจากอํานาจและฟนฟูพระราชอํานาจของสุลตาน เปนเพียงกาวแรกของแผนการใหญของเรา เราจะเดินทัพไปทั่วโลกจนกวาจักรวรรดิของเราจะกลับมาสมบูรณอีกครั้ง!"
 TUR_expanding_the_saadabad_pact: "ขยายกติกาสัญญาซาอาดาบาด"
 TUR_expanding_the_saadabad_pact_desc: "กติกาสัญญาซาอาดาบาดเปนความริเริ่มที่นายกยองของพวกเคมาลิสต แตตอนนี้เรามีจุดรวมกับประเทศผูลงนามมากกวาที่เคยมีมาอยางแนนอน อยาเสียเวลากับมาตรการครึ่งๆ กลางๆ ถึงเวลาเขาหาสมาชิกกติกาสัญญาซาอาดาบาดเพื่อยกระดับขอตกลงนี้ใหเปนพันธมิตรอยางเปนทางการ"
 TUR_saadabad_pact_faction_tt: "เราจะเชิญผูลงนามทั้งหมดของ§Yกติกาสัญญาซาอาดาบาด§!เขารวมพันธมิตรอยางเปนทางการ"
 TUR_no_faction_members_tt: "กติกาสัญญาซาอาดาบาดไมมีผูลงนาม"
 TUR_no_faction_alliance_members_tt: "ผูลงนามกติกาสัญญาซาอาดาบาดยังไมไดใหสัตยาบันความตกลงซาอาดาบาด"
 TUR_the_damascus_diktat: "คําบัญชาแหงดามัสกัส"
 TUR_the_damascus_diktat_desc: "[677.Controller.GetNameDefCap]ออนแอ สิ่งที่เราตองทํามีเพียงขูวาอาจเกิดสงครามหากพวกเขาไมยอมยกซีเรียให แลวพวกเขาจะคุกเขารองขอสันติภาพและออนวอนใหเรารับซีเรียไปเสีย"
 TUR_supporting_the_east: "สนับสนุนภาคตะวันออก"
 TUR_supporting_the_east_desc: "รัฐทางตะวันออกของเราคือกระดูกสันหลังของฐานเสียงสนับสนุน แตคุณภาพโครงสรางพื้นฐานในรัฐเหลานี้เมื่อเทียบกับจังหวัดที่เปนเมืองทางตะวันตกนั้นแยจนนาตกใจ การสนับสนุนภาคตะวันออกคือการสนับสนุนผูติดตามของเรา และเตรียมพรอมสําหรับปฏิบัติการไปทางตะวันออกและทางเหนือไดดีขึ้นดวย"
 TUR_desert_camel_corps: "กองอูฐทะเลทราย"
 TUR_desert_camel_corps_desc: "หากเราจะเขาสูปฏิบัติการอันยากลําบากและยืดเยื้อในตะวันออกกลางและแอฟริกา ก็คงเปนเรื่องไรสาระหากไมปฏิรูปกองทหารอูฐของเรา! บนหลังอูฐ เราสามารถขี่จากไคโรไปเคปทาวนไดอยางสบายและมีสไตล!"
 TUR_unlock_camelry_effect_tt: "เพิ่มเทคโนโลยี: §Yหนวยทหารอูฐ§!"
 TUR_the_pan_national_association_of_ulemas: "สมาคมอุละมาอขามชาติ"
 TUR_the_pan_national_association_of_ulemas_desc: "ขบวนการของเราไมใชขบวนการชาตินิยม เราไมไดยืนหยัดเพียงเพื่อพระราชอํานาจของสุลตาน แตเพื่ออํานาจของมุสลิมทั่วโลก เราไมยึดถือชาตินิยม เพราะเราเชื่อในอุดมการณสากลของอิสลาม! เราจะรวมมือกับผูนําศาสนาจากทั่วโลกเพื่อหาทางเผยแผและปลดปลอยศาสนิกชนของเราดวยคมดาบใหดีที่สุด"
 TUR_reinstate_the_darulfununu_sahane: "ฟนฟูดารึลฟูนูน-อู ชาฮาเน"
 TUR_reinstate_the_darulfununu_sahane_desc: "เราไมลังเลที่จะยอมรับวาสถาบันหลายแหงของเรา... ไมไดทันสมัยนัก แตเราอยูในยุคแหงการสงครามสมัยใหม ดีแลวที่ชาติของเรามีอุตสาหกรรมและความทันสมัยอยางที่เปนอยู - ทั้งหมดตองขอบคุณการทํางานหนักของระบบราชการออตโตมัน! ดวยเหตุนี้ เราจะกอตั้งสถาบันในมหาวิทยาลัยอิสตันบูลที่สงเสริมความรวมมือทางเทคนิคและวิทยาศาสตรระหวางเรากับชาติที่มีแนวคิดเดียวกัน"
 TUR_imperial_factories: "โรงงานหลวง"
 TUR_imperial_factories_desc: "พวกเคมาลิสตมีแนวคิดที่นาสนใจเรียกวา 'รัฐนิยมทางเศรษฐกิจ' และแมเราจะไมมีวันสนับสนุนเสาหลักทางอุดมการณของเคมาลิสตอยางเปดเผย แตก็อดรูสึกไมไดวาการจัดระเบียบและควบคุมปจจัยการผลิตของรัฐจากสวนกลางอาจ... เหมาะสมกับสถานการณ อยาไดเอาไปเปรียบกับคอมมิวนิสตหรือฟาสซิสต: โรงงานทั้งหมดจะเปนของสุลตาน - เราเพียงบริหารโรงงานเหลานี้แทนพระองคเทานั้น!"
 TUR_refining_our_strategies: "ขัดเกลายุทธศาสตร"
 TUR_refining_our_strategies_desc: "เราไดเรียนรูเรื่องการสงครามมากมายนับตั้งแตความพายแพในมหาสงคราม และเราตองไมเดินหนาตามแผนบาบิ่นที่ไมมีหวังจะชนะอีกตอไป เราตองสูอยางชาญฉลาดและรอบคอบ เพื่อวาเมื่อการตอสูทั้งหมดยุติและฝุนควันจางลง เราจะเปนผูชนะที่ยังยืนหยัดอยู"
 TUR_the_red_apples_of_sevres: "แอปเปลแดงแหงแซฟวร"
 TUR_the_red_apples_of_sevres_desc: "ปารีส โรม ลอนดอน: นี่คือคึซึล เอลมาของจักรวรรดิออตโตมันที่ไดรับการฟนฟู เราจะไมหยุดยั้งจนกวาศัตรูเกาของเรา - ผูที่หมายจะแยกชิ้นสวน หยามเกียรติ และทําลายเรา - จะถูกทําใหตํ่าตอย ถูกบีบใหกมหัว และถูกทําลายเพราะแผนการอันชั่วรายที่มีตออาณาจักรของเรา เราจะโยนระเบียบโลกเกาเขากองเพลิง และสรางสถานะใหมบนซากจักรวรรดิที่ลมสลายของพวกเขา"
 TUR_realize_the_nightmare_of_meiji: "ทําใหฝนรายแหงเมจิเปนจริง"
 TUR_realize_the_nightmare_of_meiji_desc: "สุลตานอับดุลฮามิดที่ 2 เคยหวั่นเกรงวาจักรพรรดิญี่ปุนจะเขารีตอิสลามและประกาศตนเปนกาหลิบแทนกษัตริยเชื้อสายเติรก สิ่งนั้นไมเคยเกิดขึ้น แตนาเสียดาย ญี่ปุนลงนามในสนธิสัญญาแซฟวร เชนเดียวกับที่ลงนามในสนธิสัญญาโลซาน - แมเราจะชื่นชมชาวญี่ปุนมานาน แตพวกเขาก็มีความผิดไมตางจากมหาอํานาจเกาอื่นๆ เราจะทําใหพวกเขาตํ่าตอยดวยการปกครองเคดีฟแหงนิฮงโดยตรงจากคอสตันตินีเย"
 TUR_continue_to_prioritise_balkan_integrity: "ใหความสําคัญกับบูรณภาพของบอลขานตอไป"
 TUR_continue_to_prioritise_balkan_integrity_desc: "สันติภาพในบอลขานเปนผลประโยชนของเรามาโดยตลอด เราตองสารภาพวารูสึกมีความรับผิดชอบอยูบางที่จะปกปองและยกระดับเพื่อนบาน โดยเฉพาะเมื่อพิจารณาจากอดีตรวมกันที่... ไมนาอภิรมยนัก ชวงเวลานั้นผานพนไปแลว เราไมไดเขาหาในฐานะผูพิชิตอีกตอไป แตในฐานะมิตรผูแนวแนที่ตั้งใจปกปองเพื่อนบานที่ออนแอกวาจากผูพิชิตหนาใหมที่หมายรายตอพวกเขา"
 TUR_reaffirm_the_balkan_pact: "ปฏิรูปกติกาสัญญาบอลขาน"
 TUR_reaffirm_the_balkan_pact_desc: "กติกาสัญญาบอลขานกอตั้งขึ้นเพื่อยับยั้งการเรียกรองดินแดนของบัลแกเรียและฮังการี แตโลกไดอันตรายขึ้นมากนับแตนั้น กติกาสัญญาบอลขานไมเพียงพออีกตอไป เราตองปฏิรูปมันใหเปนความตกลงไตรภาคีบอลขาน!"
 TUR_balkan_defense_council: "สภาปองกันบอลขาน"
 TUR_balkan_defense_council_desc: "ทุกประเทศในความตกลงบอลขานรูจักสงครามดีราวกับเพื่อนเกา เราทุกคนรูดีวาเราไมอาจเริ่มสงครามดวยการรุก ดังนั้นเราตองประสานงานกันเพื่อสรางแนวปองกันที่ยิ่งใหญที่สุด"
 TUR_balkan_defense_council_tt: "เมื่อ§Yกติกาสัญญาบอลขาน§!ไดรับการรับรองเปนพันธมิตรแลว เราจะสามารถประสานงานกันเพื่อหาวิธีปองกันตนเองจากการรุกรานของตางชาติไดดีที่สุด"
 TUR_three_year_industrial_plan: "แผนอุตสาหกรรมสามป"
 TUR_three_year_industrial_plan_desc: "เราพรอมที่จะดําเนินการพัฒนาอุตสาหกรรมทั่วทั้งคาบสมุทร ซึ่งแมแต[ENG.GetNameDef]ก็อาจตองหวั่นใจ เราจะสนับสนุนกันและกันอยางเทาเทียม และรวมกันกาวขามความแข็งแกรงของศัตรูดวยพลังรวมของความตกลงบอลขาน!"
 TUR_united_against_imperialism: "แนวรวมตอตานจักรวรรดินิยม"
 TUR_united_against_imperialism_desc: "พวกเราทุกคนลวนตกเปนเหยื่อของการบงการจากมหาอํานาจที่ยิ่งใหญกวา เราถูกขมเหงใหลงนามในสนธิสัญญาและขอตกลงที่ทําใหเราอัปยศและออนแอบอยเกินไปแลว เราขอประกาศวาโลกไมเหมือนเดิมอีกตอไป และเราจะไมยอมจํานนตอการคุกคามของจักรวรรดินิยมอีก!"
 TUR_united_against_imperialism_tt: "การเปลี่ยนแปลงความนิยมของประชาธิปไตยหรือไมฝกใฝฝายใดสําหรับประเทศใน§Yกติกาสัญญาบอลขาน§!: §G10%§!\n"
 TUR_create_the_balkan_central_bank: "กอตั้งธนาคารกลางบอลขาน"
 TUR_create_the_balkan_central_bank_desc: "เราจะใชสกุลเงินใหมรวมกันในทุกชาติควบคูกับสกุลเงินของแตละชาติ และกอตั้งธนาคารกลางแหงใหมที่เราทุกคนสามารถแลกเปลี่ยนเงินตราที่ชอบดวยกฎหมายและทําธุรกรรมได จะมีอะไรผิดพลาดไดละ?"
 TUR_the_treaty_for_prosperity_and_trade: "สนธิสัญญาเพื่อความรุงเรืองและการคา"
 TUR_the_treaty_for_prosperity_and_trade_desc: "เราจะเปนหัวหอกในการจัดทําสนธิสัญญารวมที่สงเสริมการคาเสรีตามหลักเสรีนิยมตลาดเสรี เราไมอาจคาดหวังใหสมาชิกทุกประเทศปรับโครงสรางเศรษฐกิจใหมทั้งหมดเพื่อเปดการคาเสรี แตอยางนอยเราก็ยุติลัทธิกีดกันทางการคาในบอลขานได"
 TUR_joint_budgets_on_fortifications: "งบประมาณรวมดานปอมปราการ"
 TUR_joint_budgets_on_fortifications_desc: "แนวปอมปราการเปนองคประกอบหลักของหลักนิยมการปองกันสวนใหญมานาน และแมปจจุบันบางคนจะเสนอวายุทธศาสตรเชนนี้ลาสมัยไปแลวเพราะเทคโนโลยีสมัยใหม เราเชื่อวาปอมปราการอาจยังมีประโยชนอยู การรวมลงขันเพื่อการปองกันของกันและกัน เราจะรับประกันความปลอดภัยรวมกันของเรา"
 TUR_connecting_our_capitals: "เชื่อมโยงเมืองหลวงของเรา"
 TUR_connecting_our_capitals_desc: "เพื่อใหกองทัพของเราเคลื่อนพลจากแนวหนาหนึ่งไปยังอีกแนวหนาหนึ่งไดอยางราบรื่นที่สุด เราตองมีโครงสรางพื้นฐานที่มีประสิทธิภาพทั่วคาบสมุทรบอลขาน เราจะรวมมือกับพันธมิตรเพื่อใหแนใจที่สุดเทาที่ทําไดวาเมืองหลวงของเราเชื่อมตอกันดวยโครงสรางพื้นฐานสมัยใหม"
 TUR_connect_capitals_greece_tt: "เนื่องจาก§Yกรีซ§!ไดดําเนินโครงการโครงสรางพื้นฐานดวยตนเอง จึงจะไดรับโครงสรางพื้นฐานเพิ่มเติม"
 TUR_connect_capitals_romania_tt: "เนื่องจาก§Yโรมาเนีย§!ไดดําเนินโครงการโครงสรางพื้นฐานดวยตนเอง จึงจะไดรับโครงสรางพื้นฐานเพิ่มเติม"
 TUR_connect_capitals_yugoslavia_tt: "เนื่องจาก§Yยูโกสลาเวีย§!ไดดําเนินโครงการโครงสรางพื้นฐานดวยตนเอง จึงจะไดรับโครงสรางพื้นฐานเพิ่มเติม"
 TUR_fortifying_contentious_areas: "เสริมปอมพื้นที่พิพาท"
 TUR_fortifying_contentious_areas_desc: "บอลขานไมไดถูกเรียกวาถังดินปนแหงยุโรปโดยไมมีเหตุผล ในทุกประเทศของเรามีจุดเสี่ยงที่อาจปะทุเปนความขัดแยงกับมหาอํานาจที่ใหญกวาอยางนอยหนึ่งแหง เปนหนาที่ของเราที่จะตองทําใหจุดเสี่ยงเหลานี้ไดรับการปองกันและเสริมปอมอยางเพียงพอ"
 TUR_fortify_the_south_tt: "เพิ่ม§Yปอมปราการทางบก 2 แหง§!ที่จุดขามแตละแหงจาก§Y[164.GetName]§!\n"
 TUR_fortify_the_north_tt: "เพิ่มแนวปองกัน§Yปอมปราการทางบก§!ใน§Y[354.GetName]§!\n"
 TUR_fortify_the_east_tt: "เพิ่ม§Yปอมปราการทางบก 5 แหง§!ที่พรมแดนดานตะวันออกของ§Y[800.GetName]§!\n"
 TUR_integrated_armed_forces: "บูรณาการกองทัพ"
 TUR_integrated_armed_forces_desc: "นี่เปนโครงการที่ทะเยอทะยาน แตเราตัดสินใจแลววาคุมคาที่จะดําเนินการ เมื่อพิจารณาถึงสถานการณลําบากที่ชาติเล็กๆ อยางเราตองเผชิญเมื่อตองตอกรกับมหาอํานาจ เราจึงตัดสินใจเปนหัวหอกจัดตั้งองคกรกองทัพขามชาติของความตกลงบอลขาน เราจะจัดสรรทรัพยากรใหกันและกันตามความจําเปน เพื่อวาเมื่อเรายืนหยัดเปนหนึ่งเดียว เราจะไมถูกพวกจักรวรรดินิยมดับลงเหมือนเปลวเทียน"
 TUR_the_balkan_academy_of_science: "สถาบันวิทยาศาสตรบอลขาน"
 TUR_the_balkan_academy_of_science_desc: "เราอยูในยุคแหงวิทยาศาสตรและนวัตกรรม และเราไมอาจปลอยใหตัวเราหรือสมาชิกคนใดของความตกลงบอลขานลาหลังความสําเร็จทางเทคนิคของชาติที่ใหญกวาและเปนอุตสาหกรรมมากกวาไปไกลเกินไป"
 TUR_extend_an_olive_branch_to_bulgaria: "ยื่นกิ่งมะกอกใหบัลแกเรีย"
 TUR_extend_an_olive_branch_to_bulgaria_desc: "กติกาสัญญาบอลขานกอตั้งขึ้นเพื่อตอตานลัทธิแกแคนของบัลแกเรีย แตในชวงหลายปที่ผานมาโลกไดใหกําเนิดปศาจที่เลวรายกวานั้นมาก บัลแกเรียก็เหมือนเรา เปนเพียงหมากอีกตัวที่พวกจักรวรรดินิยมขยับไปมาเพื่อแสวงหาการครอบงํา เราควรยื่นมือชวยเหลือ - ใหพวกเขารวมกําลังกับเรา เพื่อที่เราทุกคนจะผานพนความขัดแยงนี้ไปไดโดยที่พรมแดนและศีลธรรมยังคงอยูครบ"
 TUR_preempt_bulgarian_alignment: "ชิงตัดหนาการเลือกขางของบัลแกเรีย"
 TUR_preempt_bulgarian_alignment_desc: "ปรัสเซียแหงบอลขานอาจเปนมหาอํานาจขนาดเล็กเชนเดียวกับเรา แตพวกเขามีความกระหายและความทะเยอทะยานของมหาอํานาจผูยิ่งใหญ เราจะสงสัยไดแมสักวินาทีหรือวาชาวบัลแกเรียจะไมแทงขางหลังเราทุกคนเพื่อผลประโยชนสวนตัวทันทีที่มีโอกาส? คําตอบคือไม ซึ่งเหลือทางออกเพียงทางเดียว: บัลแกเรียตองถูกทําลาย"
 TUR_peninsular_network_of_factories: "เครือขายโรงงานทั่วคาบสมุทร"
 TUR_peninsular_network_of_factories_desc: "หากอยูลําพัง ไมมีใครในหมูเราตานทานประเทศที่ใหญกวาและเปนอุตสาหกรรมมากกวาอยาง[GER.GetNameDef]และ[SOV.GetNameDef]ได แตถารวมมือกัน - ทุกคนรวมทรัพยากรเพื่อดึงศักยภาพออกมาใหไดมากที่สุดละ? นั่นจะทําใหเราเปนมหาอํานาจที่เกรียงไกรในแบบของเราเอง"
 TUR_combined_operational_strategies: "ยุทธศาสตรปฏิบัติการรวม"
 TUR_combined_operational_strategies_desc: "ดวยการรวมมือกันอยางลึกซึ้งยิ่งขึ้นในเรื่องยุทธศาสตรและการปองกัน เราสามารถรับประกันความมั่นคงของทั้งภูมิภาคได แมจะตองเผชิญศัตรูที่เหนือกวามาก"
 TUR_edirne_research_exchange: "ศูนยแลกเปลี่ยนการวิจัยเอดีรเน"
 TUR_edirne_research_exchange_desc: "เราจะยึดความริเริ่มและกอตั้งสถาบันสาธารณะที่สงเสริมการแลกเปลี่ยนแนวคิดอยางเสรีระหวางหลายชาติ เพื่อใหเรายืนอยูแถวหนาของความกาวหนาทางเทคโนโลยีและวิทยาศาสตรลาสุดทั้งหมดในกติกาสัญญาบอลขาน"
 TUR_crush_the_warmongers_in_rome: "บดขยี้พวกกระหายสงครามในโรม"
 TUR_crush_the_warmongers_in_rome_desc: "ชาว[ITA.GetAdjective]คือตนเหตุของความทุกขทั้งปวงในเมดิเตอรเรเนียน พวกเขาคือเนื้องอกรายที่เชื่อวาตนสามารถลุกลามเขาสูยุโรปตอนใตไดดั่งมะเร็งดวยสิทธิของผูมีกําลัง เราจะบุกไปสูถึงถิ่นและปอนยาของพวกเขาเองคืนใหมากจนสําลัก"
 TUR_brace_against_the_red_menace: "[GetBraceAgainstTheRedMenaceName]"
 TUR_brace_against_the_red_menace_desc: "[GetBraceAgainstTheRedMenaceDesc]"
 TUR_brace_against_the_red_menace_communism: "ตั้งรับภัยแดง"
 TUR_brace_against_the_red_menace_communism_desc: "ทางเหนือคือภัยคุกคามอันทรยศของลัทธิคอมมิวนิสตและผูอุปถัมภหลักของมันในโลก [SOV.GetNameDef]คือโรคระบาดของโลกใบนี้ และความตกลงบอลขานจะทําประโยชนใหมนุษยชาติดวยการรื้อถอนอํานาจครอบงําของ[SOV.GetAdjective]"
 TUR_brace_against_the_red_menace_generic: "ตั้งรับภัยคุกคามจาก[SOV.GetAdjective]"
 TUR_brace_against_the_red_menace_generic_desc: "ทางเหนือคือรัสเซียผูทรยศ พวกเขาพยายามแทรกแซงกิจการของบอลขานและตุรกีมาโดยตลอด ความตกลงบอลขานจะทําประโยชนใหมนุษยชาติดวยการรื้อถอนอํานาจครอบงําของ[SOV.GetAdjective]"

 TUR_reconfigure_our_foreign_policy: "ปรับนโยบายตางประเทศของตุรกีใหม"
 TUR_reconfigure_our_foreign_policy_desc: "นโยบายตางประเทศของ[TUR.GetAdjective]มุงเนนกิจการภายในและจํากัดปฏิสัมพันธดานการตางประเทศไวกับเพื่อนบานเปนสวนใหญ แตยุคสมัยเปลี่ยนไปแลว และนโยบายตางประเทศของเราตองสะทอนสิ่งนั้น ถึงเวลานานแลวที่เราควรเริ่มติดตอกับมหาอํานาจของโลกใหมากขึ้น"
 TUR_the_anglo_turkish_agreement: "ความตกลงอังกฤษ-ตุรกี"
 TUR_the_anglo_turkish_agreement_desc: "รัฐบาล[ENG.GetAdjective]กระตือรือรนที่จะลงนามขอตกลงกับเรา ขอตกลงที่โดยเนื้อแทแลวเราไมตองสัญญาอะไรเลย แตจะบังคับให[ENG.GetNameDef]ตองรีบมาชวยเราหากถูกรุกราน ทั้งหมดนี้สอถึงความสิ้นหวัง แตเราใชประโยชนจากความสิ้นหวังได"
 TUR_add_medium_tank_technology_tt: "เพิ่มเทคโนโลยี: §Yรถถังขนาดกลางพื้นฐาน§!"
 TUR_applying_british_oil_embargoes_on_iraq: "บังคับใชการควํ่าบาตรนํ้ามันอิรักของ[ENG.GetAdjective]"
 TUR_applying_british_oil_embargoes_on_iraq_desc: "ชาว[ENG.GetAdjective]มุงมั่นที่จะหยุดการขนสงนํ้ามันของ[IRQ.GetAdjective]ไมใหไปถึงศัตรูในภาคพื้นทวีป แตสวนใหญไมประสบความสําเร็จ เราสามารถสนับสนุนความริเริ่มของ[ENG.GetAdjective]ไดดวยการปดกั้นเสนทางบกที่ใหญที่สุดเสนทางหนึ่งที่ชาว[IRQ.GetAdjective]ใชผานไปคาขายในยุโรป"
 TUR_host_exiled_scientists: "ตอนรับนักวิทยาศาสตรผูลี้ภัย"
 TUR_host_exiled_scientists_desc: "หลายชาติที่ปกครองโดยพวกโงสวมรองเทาบูตพรอมจะเนรเทศปญญาชนที่เกงและฉลาดที่สุดอยางสายตาสั้น เพียงเพราะนักวิทยาศาสตรเหลานั้นไมยอมรับใชวาระของทรราช เราจะมอบบานใหผูลี้ภัยเหลานั้นที่นี่ใน[TUR.GetNameDef] เพราะเราตองการพวกเขาอยางยิ่ง"
 TUR_the_chester_concession: "สัมปทานเชสเตอร"
 TUR_the_chester_concession_desc: "เรายังคงมีสิทธิ์ในสัมปทานที่ชาวอเมริกันสัญญาไวกับเราเมื่อกวาทศวรรษกอน เราสามารถกําหนดใหการเขารวมสงครามของเราขึ้นอยูกับการที่อเมริกาชวยเหลือความผาสุกของรัฐ[TUR.GetAdjective]"
 TUR_raise_opinion_of_america_tt: "ยิ่ง§Yสหรัฐอเมริกา§!มีทัศนคติตอเราดีเทาไร สัมปทานก็ยิ่งมีโอกาสไดรับอนุมัติมากเทานั้น"
 TUR_american_motor_factories: "โรงงานยานยนตอเมริกัน"
 TUR_american_motor_factories_desc: "อุตสาหกรรมหนักสวนใหญของเราที่เกี่ยวของกับการผลิตยานยนตตองพึ่งพาความรวมมือกับชาวอเมริกัน เราไมไดเปนชาติที่ผอนปรนที่สุดในเรื่องการลงทุนจากตางชาติเสมอไป แตหากเราผอนคลายกฎระเบียบใหมิตรชาวอเมริกันของเรา... ก็นะ... ใครจะรูวาอะไรจะเกิดขึ้น?"
 TUR_bomber_schematics: "แบบแปลนเครื่องบินทิ้งระเบิด"
 TUR_bomber_schematics_desc: "การปองกันนานฟาของเราเองในยามสงครามนั้นไมพอ เราตองสามารถโจมตีใจกลางของศัตรูได เพื่อใหสงครามใดๆ ยุติลงไดอยางรวดเร็ว ฝายสัมพันธมิตรเปนปรมาจารยในการใชระเบิดเปนเครื่องมือบดขยี้ศัตรู และเรามีอะไรใหเรียนรูจากพวกเขาอีกมาก"
 TUR_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 TUR_join_the_allies_desc: "โลกไดมาถึงชวงเวลาแหงโชคชะตา และเรายืนอยูบนทางแยกของจักรวรรดิมากมายที่แขงขันกันเปลี่ยนแปลงโลกไปตลอดกาล เราตองยืนหยัดเพื่อคุณคาที่ประเทศของเรากอตั้งขึ้นมา และตอสูเคียงขางชาติตะวันตกในนามของเสรีภาพและอิสรภาพ"
 TUR_controlling_the_skies_of_europe: "ครองนานฟา"
 TUR_controlling_the_skies_of_europe_desc: "อํานาจการยิงที่เหนือกวาคือวิธีที่เราจะชนะสงคราม และเราตองมีสวนรวมอยางแข็งขันในความพยายามทางสงคราม ดวยการเพิ่มอํานาจการยิงของเราเองในการตอสูเพื่อครองนานฟา"
 TUR_expanding_our_navy: "ขยายกองทัพเรือ"
 TUR_expanding_our_navy_desc: "เราตอสูเคียงขางมหาอํานาจทางทะเลชั้นนําของโลกบางชาติ และเรามีอะไรใหเรียนรูจากพวกเขาอีกมาก เมื่อสงครามสิ้นสุด กองทัพเรือของเราจะไดรับการยกยองในหมูผูยิ่งใหญ"
 TUR_the_petra_proposal: "ขอเสนอเปตรา"
 TUR_the_petra_proposal_desc: "ที่ปรึกษาของเราไดคิดแผนที่จะทําใหเรารับผิดชอบการปกปองและบริหารรัฐในอารักขาของ[ENG.GetAdjective]ในเลแวนต ยุทธศาสตรและขอเสนอนี้สมเหตุสมผล ที่เหลือก็เพียงนําเสนอตอชาว[ENG.GetAdjective]"
 TUR_expanded_credit_on_our_debts: "ขยายเครดิตหนี้สิน"
 TUR_expanded_credit_on_our_debts_desc: "ชางโชคดีที่เราไดเปนพันธมิตรกับหลายประเทศที่เราเปนหนี้อยูมหาศาล! การเขารวมความขัดแยงครั้งนี้ยอมเปนเหตุผลเพียงพอที่จะลางหนี้สวนใหญไป แนนอนวาทั้งหมดนี้ในนามของการตอสูเพื่อเสรีภาพรวมกันของเรา"
 TUR_partnership_pact_with_bulgaria: "กติกาสัญญาหุนสวนกับบัลแกเรีย"
 TUR_partnership_pact_with_bulgaria_desc: "เปนการฉลาดที่จะไมตัดสินชาว[BUL.GetAdjective]รุนแรงเกินไป มิฉะนั้นพวกเขาอาจถูกผลักไปอยูในออมแขนของศัตรู ขอใหเรามอบทางเลือกใหพวกเขา: โอกาสที่จะยืนอยูขางเสรีภาพและความยุติธรรม แทนที่จะเปนอัตตาธิปไตยและความฉอฉล"
 TUR_seizing_the_romanian_oil_fields: "ยึดแหลงนํ้ามันโรมาเนีย"
 TUR_seizing_the_romanian_oil_fields_desc: "แหลงนํ้ามันโรมาเนียเปนพื้นที่สําคัญยิ่งตอความพยายามทางสงครามของ[GER.GetFactionName] การตัดการเขาถึงนํ้ามันของ[ROM.GetNameDef]ก็เหมือนกับการหยุดเลือดไมใหไหลไปเลี้ยงหัวใจ"
 TUR_securing_iran: "ยึดครองอิหรานใหมั่นคง"
 TUR_securing_iran_desc: "หากชาว[PER.GetAdjective]ไมยอมควบคุมการคานํ้ามันของตนไมใหไปถึงคลังสํารองของศัตรู เราก็จะบังคับบริหารทรัพยากรของพวกเขาแทนเอง"
 TUR_british_dockyards_in_turkey: "อูตอเรืออังกฤษในตุรกี"
 TUR_british_dockyards_in_turkey_desc: "ชายฝงของเรายาวไกลและทอดลอมรอบเกือบทั้งประเทศ ที่นี่มีที่ดินวางมากมายสําหรับอุตสาหกรรมตอเรือ และชาว[ENG.GetAdjective]ก็ตระหนักถึงสิ่งนี้ เราจะรับขอเสนอของพวกเขาในการเสริมอุตสาหกรรมตอเรือของเรา เพื่อใหความพยายามทางสงครามเอนเอียงมาเปนประโยชนตอฝายเรามากขึ้น"
 TUR_taking_over_defense_of_the_gulf: "รับชวงการปองกันอาวเปอรเซีย"
 TUR_taking_over_defense_of_the_gulf_desc: "เราสามารถแบงเบาภาระพันธมิตร[ENG.GetAdjective]ไดเล็กนอย ดวยการเสนอดูแลดินแดนในตะวันออกกลางของพวกเขาแทน พวกเขานาจะยอมรับขอเสนอนี้ โดยเฉพาะเมื่อพิจารณาถึงทุกสิ่งที่เราทุมเทใหความพยายามทางสงคราม... และขอเท็จจริงที่วาพวกเขาไมไดอยูในฐานะที่จะหยุดเราไมใหยึดดินแดนเหลานั้นไปเฉยๆ ได"
 TUR_we_must_not_fall: "เราตองไมลมสลาย!"
 TUR_we_must_not_fall_desc: "เราไมไดสูยิบตาในฐานะชาติในสงครามประกาศอิสรภาพ เพียงเพื่อจะถูกทําลายลางในอีกไมกี่ทศวรรษตอมา ไม เรื่องราวของ[TUR.GetNameDef]ไมไดจบลงที่นี่ - เราตองไมลมสลาย เราจะไมลมสลาย!"
 TUR_the_german_turkish_friendship_treaty: "สนธิสัญญามิตรภาพเยอรมนี-ตุรกี"
 TUR_the_german_turkish_friendship_treaty_desc: "[GER.GetNameDefCap]และ[ROOT.GetNameDef]เปนมิตรกันโดยธรรมชาติ เราไมจําเปนตองเห็นพองกันทุกเรื่อง เพราะประวัติศาสตรชวงหลังของเราไมไดแตกตางกันนัก ความพยายามของ[ENG.GetAdjective]ที่จะควบคุมนโยบายตางประเทศของเราจะสูญเปลา เราจะพิสูจนสิ่งนั้นดวยสนธิสัญญามิตรภาพฉบับใหม ที่ลงนามโดยตรงระหวาง[GER.GetLeader]และ[ROOT.GetLeader]"
 TUR_the_clodius_agreement: "ขอตกลงโคลดิอุส"
 TUR_the_clodius_agreement_desc: "ชาว[GER.GetAdjective]ไดเสนอขอตกลงที่นาพอใจแกเรา: แรโครเมียมแลกกับปจจัยในการผลิตยุทโธปกรณทางทหารของเราเองเพิ่มขึ้น การเปนแหลงแรโครเมียมหลักของ[GER.GetNameDef]จะทําใหเราไดรับการคุมครองจาก[GER.GetNameDef]ดวย ซึ่งเปนสถานะที่นาอิจฉาอยางยิ่งในทุกวันนี้"
 TUR_clodius_agreement_tt: "ทุกรัฐที่ผลิต§Yโครเมียม§!ไดตั้งแต§Y65§!หนวยขึ้นไป จะไดรับ§Yโครงสรางพื้นฐาน§!สามระดับและ§Yโรงงานทหาร§!สองแหง"
 TUR_purchase_italian_light_tanks: "ซื้อรถถังเบาจากอิตาลี"
 TUR_purchase_italian_light_tanks_desc: "คุณไมอาจมีกองทัพสมัยใหมไดหากไมมียานเกราะที่แข็งแกรงและไวใจไดคอยสนับสนุนกระดูกสันหลังของกองทัพ เราตองหามาเปนของเราเองใหได และมีขอสงสัยหรือไมวารถถังที่ดีที่สุดในโลกผลิตจาก[ITA.GetNameDef]?"
 TUR_approve_the_funkplan: "อนุมัติแผนฟุงค"
 TUR_approve_the_funkplan_desc: "เมื่อแผนชาคทถูกนํามาใชทั่วยุโรปตอนใต เราไมไดเขารวมโครงการนั้น แตสถานการณเปลี่ยนไปแลว และเราพรอมที่จะกระชับความสัมพันธทางเศรษฐกิจกับ[GER.GetNameDef] วัลเทอร ฟุงค นักเศรษฐศาสตรชาว[GER.GetAdjective] ไดรางแผนที่ออกแบบมาเฉพาะสําหรับสถานการณของเรา และเราคงโงเขลาหากไมนําแผนนี้มาใชโดยเร็วที่สุด"
 TUR_the_italo_turkish_naval_academy: "โรงเรียนนายเรืออิตาลี-ตุรกี"
 TUR_the_italo_turkish_naval_academy_desc: "ชาว[ITA.GetAdjective]คือเจาแหงทองทะเลอยางไมมีขอโตแยง เรามีอะไรใหเรียนรูจากพวกเขาอีกมาก หากพวกเขายินดีสอนเรา"
 TUR_invite_german_officers_to_izmir: "เชิญนายทหารเยอรมันมายัง[339.GetName]"
 TUR_invite_german_officers_to_izmir_desc: "ที่ปรึกษาทางทหารชาว[GER.GetAdjective]เปนที่อิจฉาของทั่วโลก เพื่อปรับปรุงกองทัพและยุทธวิธีของเราใหทันสมัย เราตองขอความชวยเหลือจากผูที่มีกองทัพทันสมัยที่สุดในยุโรป"
 TUR_the_mediterranean_entente: "ความตกลงเมดิเตอรเรเนียน"
 TUR_the_mediterranean_entente_desc: "เราตองเจรจาพันธมิตรครอบคลุมทั่วเมดิเตอรเรเนียนที่รับผิดชอบความมั่นคงของภูมิภาค โครงการใดที่มุงควบคุมเมดิเตอรเรเนียนโดยไมเริ่มตนดวยการยื่นมือเปดกวางให[ITA.GetNameDef] ยอมลมเหลวแนนอน"
 TUR_join_the_axis: "เขารวมฝายอักษะ"
 TUR_join_the_axis_desc: "อนาคตของ[ROOT.GetNameDef]อยูกับชาติที่จะเปลี่ยนชะตากรรมของโลกอยางชัดเจน ไมมีประเทศใดพรอมจะสั่นคลอนสถานะเดิมและนํายุคใหมแหงสันติภาพและความรุงเรืองมาไดเทากับ[GER.GetNameDef] เราตองชวยใหพวกเขาทําวิสัยทัศนสําหรับอนาคตใหเปนจริง"
 TUR_invite_bulgaria: "เชิญบัลแกเรีย"
 TUR_invite_bulgaria_desc: "[BUL.GetNameDefCap]นั่งดูอยูขางสนามมานานเกินไปแลว อนาคตของพวกเขากับ[GER.GetNameDef]ไมใชเรื่องที่ตองสงสัย มีเพียงคําถามวาพวกเขาจะประกาศความภักดีเมื่อไหรเทานั้น เราจะชวยใหชาว[BUL.GetAdjective]หาความกลาของพวกเขาเจอ"
 TUR_entice_the_greeks: "เกลี้ยกลอมชาวกรีก"
 TUR_entice_the_greeks_desc: "สันติภาพกับ[GRE.GetNameDef]เปนสิ่งที่รัฐบาลของเราทุมเทอยางหนักมาตั้งแตการลมสลายของจักรวรรดิออตโตมัน เราไมมีเหตุผลที่จะทิ้งความพยายามทางการทูตหลายทศวรรษไป แตหากเราพบวาตนเองอยูคนละฝายในสงครามครั้งนี้ สิ่งนั้นก็อาจเปลี่ยนไปได หวังวาพวกเขาจะฟงเสียงแหงปญญา และไมทิ้งอนาคตของตนไปอยางไรประโยชน"
 TUR_carve_up_greece: "แบงแยกกรีซ"
 TUR_carve_up_greece_desc: "นาเสียดายยิ่งนัก ดูเหมือนจะไมมีอนาคตใดที่[GRE.GetNameDef]จะผานพนยุคนี้ไปโดยยังคงเปนชาติเอกราช การตัดสินใจนี้ไมไดมาจากความเกลียดชัง เราเพียงทําสิ่งที่ตองทําเพื่อความอยูรอด สันติภาพจะกลับคืนสูทะเลอีเจียนอีกครั้ง แตไมใชในยุคที่โหดรายและไรความปรานีนี้"
 TUR_pressure_portugal_to_join: "กดดันโปรตุเกสใหเขารวม"
 TUR_pressure_portugal_to_join_desc: "ในทางเทคนิค[POR.GetNameDefCap]อาจไมไดติดกับทะเลเมดิเตอรเรเนียน แตก็มีสวนไดสวนเสียอยางมากในอนาคตของภูมิภาคนี้ เราตองการจักรวรรดิอันกวางใหญของพวกเขา และพวกเขาก็จะไดประโยชนมากจากการมีมิตรอยางเรา"
 TUR_collaborative_civil_works_programme: "โครงการโยธาธิการรวม"
 TUR_collaborative_civil_works_programme_desc: "หากทุกอยางขึ้นอยูกับ[ITA.GetNameDef]เพียงผูเดียว ทุกคนในพันธมิตรของเราคงทําแตพิชิตและกดขี่ชนชาติอื่น เราคือเสียงแหงเหตุผลในดานอื่นๆ ของการปกครอง: ไมมีใครคิดถึงอัตราการจางงานหรือเศรษฐกิจหลังสงครามบางเลยหรือ? เราควรรวมทรัพยากรและรวมมือกันสรางอนาคตที่ดีกวา ซึ่งคูควรกับการหลั่งเลือดทั้งหมดนี้"
 TUR_fortifying_the_bosporus: "เสริมปอมชองแคบบอสพอรัส"
 TUR_fortifying_the_bosporus_desc: "ชองแคบบอสพอรัสเปนประตูระหวางทะเลดํากับทะเลเมดิเตอรเรเนียน คลองสุเอซไดรับการปองกันอยางแนนหนา เชนเดียวกับทางเขาชองแคบยิบรอลตาร แลวมันสมเหตุสมผลหรือที่จะปลอยชองแคบของเราเองไวโดยไมมีการปองกันและเปดใหมหาอํานาจตางชาติเขามายํ่ายี? ไมเลย เราจะทุมเทปกปองสิ่งที่เปนของเรา"
 TUR_fortifying_the_bosporus_istanbul_tt: "เพิ่ม§Yปอมปราการทางบก 3 แหง§!ภายในเมือง\n"
 TUR_fortifying_the_bosporus_edirne_tt: "เพิ่มแนว§Yปอมปราการทางบก§!ระดับสองตามแนว§Yชองแคบตุรกี§!\n"
 TUR_mediterranean_merchant_fleet: "กองเรือพาณิชยเมดิเตอรเรเนียน"
 TUR_mediterranean_merchant_fleet_desc: "ขบวนเรือลําเลียงคือเสนเลือดหลักของฝายนี้ และเราทุกคนตองรวมแรงกันมากขึ้นเพื่อเพิ่มจํานวนขบวนเรือลําเลียงที่มีอยู แนนอนวาหากกองเรือพาณิชยใหมนี้ถูกใชเปนชองทางลับในการแบงปนขอมูลการวิจัยทางทะเลเพิ่มเติมดวย นี่อาจเปนความพยายามที่ใหผลคุมคาเปนพิเศษ"
 TUR_court_the_spanish: "เอาใจสเปน"
 TUR_court_the_spanish_desc: "ไมใชความลับวาผูนําสเปนเห็นอกเห็นใจฝายของเราและสิ่งที่เรายึดถือ ขอเสนอมิตรภาพงายๆ และคําสัญญาลอยๆ เกี่ยวกับผลประโยชนในอนาคตนาจะเพียงพอที่จะดึงพวกเขามาอยูขางเราอยางจริงจังมากขึ้น"
 TUR_cleanse_iberia_of_bolshevism: "กวาดลางบอลเชวิคออกจากไอบีเรีย"
 TUR_cleanse_iberia_of_bolshevism_desc: "ความพายแพของฝายชาตินิยมในสงครามกลางเมืองสเปนเปนเรื่องอุกอาจ! มันผิด เปนการบิดเบือนความยุติธรรม และเปนความลมเหลวอันนาเศราของอุดมการณฟาสซิสต เราตองแกไขความผิดพลาดในอดีตดวยกําลัง"
 TUR_end_the_british_hegemony: "ยุติการครองความเปนใหญของอังกฤษ"
 TUR_end_the_british_hegemony_desc: "โลกนี้จะไมมีวันพบสันติภาพจนกวาการปกครองอันทรยศและยาวนานไมสิ้นสุดของชาว[ENG.GetAdjective]จะถูกยุติลงอยางรุนแรงและเด็ดขาด นี่ไมใชสงคราม แตคือหนาที่"
 TUR_punish_french_weakness: "ลงโทษความออนแอของฝรั่งเศส"
 TUR_punish_french_weakness_desc: "ธงไตรรงค[FRA.GetAdjective]เคยโบกสะบัดเหนือครึ่งหนึ่งของยุโรปในสมัยนโปเลียน วันนี้มันไมคูควรแมแตจะโบกสะบัดเหนือปารีส ถึงเวลานานแลวที่จะยุติความอับอายระดับโลกที่เปนชาติซึ่งรูจักกันในชื่อ '[FRA.GetNameDef]'"
 TUR_victory_or_death_against_communism: "[GetVictoryOrDeathAgainstCommunismName]"
 TUR_victory_or_death_against_communism_desc: "[GetVictoryOrDeathAgainstCommunismDesc]"
 TUR_victory_or_death_against_communism_communism: "ชัยชนะหรือความตายในการตอตานคอมมิวนิสต"
 TUR_victory_or_death_against_communism_communism_desc: "การตอสูกับลัทธิคอมมิวนิสตทั่วโลกเปนการตอสูที่ชอบธรรม มันเปนมากกวาเรื่องอุดมการณ เรากําลังตอสูเพื่อวิถีชีวิตของเราเองกับยักษใหญอันนาสะพรึงกลัวที่ทําลายทุกสิ่งที่มันแตะตอง เราจะพายแพไมได"
 TUR_victory_or_death_against_communism_generic: "ชัยชนะเหนือจักรวรรดินิยมรัสเซีย"
 TUR_victory_or_death_against_communism_generic_desc: "การตอสูกับจักรวรรดินิยม[SOG.GetAdjective]ทั่วโลกเปนการตอสูที่ชอบธรรม มันเปนมากกวาขอพิพาทพรมแดน เรากําลังตอสูเพื่อวิถีชีวิตของเราเองกับจักรวรรดินักขยายดินแดนอันนาสะพรึงกลัวที่ทําลายทุกสิ่งที่มันแตะตอง เราจะพายแพไมได"
 TUR_increase_german_military_aid: "เพิ่มความชวยเหลือทางทหารจากเยอรมนี"
 TUR_increase_german_military_aid_desc: "หากชาว[GER.GetAdjective]คาดหวังใหเราตามการรุกคืบของพวกเขาในแนวหนาใหทัน พวกเขาก็ตองแบงปนเทคโนโลยีจํานวนมหาศาลที่สะสมมาหลายปบาง แนนอนวาเราอยากรบอยางเขมขนกวานี้ - แตความชวยเหลือจาก[GER.GetAdjective]สักหนอยจะชวยใหความปรารถนานั้นเปนจริงไดมาก"
 TUR_cooperative_research_centers: "ศูนยวิจัยรวม"
 TUR_cooperative_research_centers_desc: "สงครามครั้งนี้จะตัดสินดวยมหาอํานาจที่มีขีดความสามารถทางเทคโนโลยีสูงสุด ลัทธิฟาสซิสตคือหลักความเชื่อแหงอนาคต จึงสมเหตุสมผลที่เราตองการเพียงเทคโนโลยีที่ทันสมัยที่สุดในการทําสงคราม"
 TUR_the_tuz_golu_training_facility: "ศูนยฝกทุซเกอลือ"
 TUR_the_tuz_golu_training_facility_desc: "ภูมิอากาศแบบเมดิเตอรเรเนียนของประเทศเราไมเหมาะแกการฝกทหารใหปฏิบัติการในภูมิอากาศแหงแลงไดอยางเพียงพอ เราจึงเลือกสรางศูนยฝกใกลทะเลสาบนํ้าเค็มทุซเกอลือ เพื่อใหกองทหารของเราเตรียมพรอมรบในสภาพแวดลอมแหงแลงไดดีขึ้น"
 TUR_pack_for_a_long_winter: "เตรียมพรอมรับฤดูหนาวอันยาวนาน"
 TUR_pack_for_a_long_winter_desc: "การจําลองความหนาวเหน็บอันโหดรายของยูเรเชียไมใชเรื่องงาย แตเราก็ตองทําเทาที่ทําได เราจึงเลือกสรางศูนยฝกบนยอดเขาปาลันเดอเคนในแอรซูรุม พรอมศูนยขนาดเล็กอีกแหงรอบภูเขาอารารัต เพื่อใหกองทหารของเราฝกในสภาพแบบเทือกเขาสูงและธารนํ้าแข็งไดตลอดทั้งป"
 TUR_support_the_golden_square: "สนับสนุนกลุมจัตุรัสทองคํา"
 TUR_support_the_golden_square_desc: "มีกลุมหนึ่งที่มีอิทธิพลไมนอยใน[IRQ.GetNameDef] ซึ่งมีเปาหมายคลายคลึงกับเรามาก เราควรสนับสนุนบุคคลผูมีแนวคิดเดียวกันเหลานี้ เพื่อใหพวกเขาชวยเรากําจัดการปรากฏตัวของจักรวรรดินิยมในภูมิภาคนี้"
 TUR_secure_the_iraqi_oil: "ยึดนํ้ามันอิรักใหมั่นคง"
 TUR_secure_the_iraqi_oil_desc: "ทําไมตองไวใจใหคนอื่นทํางานที่คุณรูวาทําเองไดดีอยูแลว? รองเทาบูตของเราจะเหยียบแผนดินแบกแดดกอนสิ้นเดือน: รับประกันได"
 TUR_rebuke_the_treaty_of_lausanne: "ปฏิเสธสนธิสัญญาโลซาน"
 TUR_rebuke_the_treaty_of_lausanne_desc: "เราละเมิดขอกําหนดหลายขอของสนธิสัญญาที่ถูกบังคับใชกับเราหลังมหาสงครามสิ้นสุดไปแลวมากมาย ถึงเวลาสลัดแอกของศัตรูทิ้งเสียที เชนเดียวกับที่พันธมิตรของเราไดทําไปกอนหนาแลว นาเสียดาย แตเราไมอาจไวใจไดวาพรมแดนดานตะวันตกจะปลอดภัย จนกวาปญหา[GRE.GetAdjective]จะไดรับการแกไข"
 TUR_turkish_panzers: "แพนเซอรตุรกี"
 TUR_turkish_panzers_desc: "ทําไม[GER.GetNameDef]ตองเปนประเทศเดียวที่มีรถถังนาเกรงขาม? เราจะสั่งสรางยานเกราะชุดของเราเอง ซึ่งจะออกไปพิชิตโลกเคียงขางแพนเซอรของ[GER.GetAdjective]!"
 TUR_establish_the_committee_of_pan_turkism: "เผยแพรหลักลัทธิรวมชาติเติรก"
 TUR_establish_the_committee_of_pan_turkism_desc: "ทั่วยูเรเชีย พี่นองชาวเติรกิกผูถูกกดขี่ของเรากําลังรอใหเราปลดปลอยพวกเขาจากกํามือของเจานายผูชั่วราย เราตั้งใจจะทําเชนนั้น และเราจะไมหยุดจนกวาชาวเติรกิกทุกคนในโลกจะไดอยูอยางเสรีภายในพรมแดนและภายใตการคุมครองของเรา!"
 TUR_integrate_german_officers_into_the_army: "ผนวกนายทหารเยอรมันเขาสูกองทัพ"
 TUR_integrate_german_officers_into_the_army_desc: "เมื่อไมจําเปนตองปดบังบทบาทของเจาหนาที่ทหารเยอรมันในประเทศของเราอีกตอไป เราจึงผนวกพวกเขาเขาสูสายการบังคับบัญชาอยางเปนทางการ โดยไดรับความยินยอมโดยชัดแจงจาก[GER.GetLeader]"
 TUR_restoring_our_nations_pride: "ฟนฟูความภาคภูมิใจของชาติ"
 TUR_restoring_our_nations_pride_desc: "ความสําเร็จของเราในชวงไมกี่ปที่ผานมานาตื่นตะลึงอยางยิ่ง เราเปลี่ยนจากชาติที่หวาดกลัวสงครามหลังความสูญเสียมหาศาลในมหาสงคราม มาเปนผูพิชิตภาคพื้นทวีปที่สูรบไปทั่วโลก เรากําลังยืนอยูบนธรณีประตูแหงยุคทอง: ยุคทองแหงหมาปา!"
 TUR_renew_the_turkish_soviet_non_aggression_pact: "ตออายุสนธิสัญญาไมรุกรานกับโซเวียต"
 TUR_renew_the_turkish_soviet_non_aggression_pact_desc: "เราลงนามสนธิสัญญาไมรุกรานกับ[SOV.GetNameDef]ในป 1925 และเปนหนึ่งในประเทศแรกๆ ของโลกที่มีสัมพันธไมตรีกับชาว[SOV.GetAdjective] แตยุคสมัยเปลี่ยนไปแลว สิ่งสําคัญคือเราตองตออายุสนธิสัญญานี้ และทําใหแนใจวาความสัมพันธกับระบอบปจจุบันยังดีอยู"
 TUR_the_batumi_accord: "ความตกลงบาตูมี"
 TUR_the_batumi_accord_desc: "เราควรรวมมือกับรัฐบาลทองถิ่นของจอรเจียเพื่อยกระดับอุตสาหกรรมของทั้งสองชาติ ขอตกลงเชนนี้จะเปนประโยชนตอทั้งสองฝาย และไมนาจะถูกปฏิเสธได เวนแตดวยเหตุผลทางการเมืองลวนๆ"
 TUR_provide_refuge_to_the_victims_of_fascism: "ใหที่พักพิงแกเหยื่อของลัทธิฟาสซิสต"
 TUR_provide_refuge_to_the_victims_of_fascism_desc: "ลัทธิฟาสซิสตไมเลือกเหยื่อ นักปลุกระดมเหลานี้เอาใจมวลชนดวยภาพลวงแหงความยิ่งใหญดวยมือขางหนึ่ง ขณะที่ปลอยหนูออกจากทอระบายนํ้าดวยมืออีกขาง เราตองปกปองผูที่ไมมีหนทางปกปองตนเอง"
 TUR_soviet_tank_factories: "โรงงานรถถังโซเวียต"
 TUR_soviet_tank_factories_desc: "ดวยการแสดงจุดยืนตอตานฟาสซิสตในนโยบายตางประเทศอยางชัดเจนยิ่งขึ้น เราสามารถทําใหโครงการสงเสริมการผลิตยานเกราะใน[ROOT.GetNameDef]ดวยความชวยเหลือของชาว[SOV.GetAdjective]ประสบความสําเร็จได"
 TUR_dissolve_the_ODPA: "ยุบสภาหนี้"
 TUR_dissolve_the_ODPA_desc: "มหาอํานาจตะวันตกคิดวาเพียงเพราะออตโตมันเคยเปนหนี้พวกเขา เราจึงตองภักดีตอพวกเขา พวกจักรวรรดินิยมไมเคยเปลี่ยน และดูเหมือนพวกเขาจะพยายามพิสูจนอยูเสมอวาพวกเขาไมมีวันเปลี่ยน เราจะฝงสัญลักษณลาสมัยแหงอดีตนี้ใหสิ้นซาก อดีตที่เราออนแอเกินกวาจะยืนหยัดเพื่อตนเอง"
 TUR_adana_to_baku_highway: "ทางหลวงอาดานา-บากู"
 TUR_adana_to_baku_highway_desc: "เราตองการสรางความสัมพันธที่แนนแฟนยิ่งขึ้นกับคอเคซัสมานานแลว ความริเริ่มนี้จะยิ่งกระชับความสัมพันธของเรากับ[SOV.GetNameDef]"
 TUR_arctic_wolves_training_program: "โครงการฝกหมาปาอารกติก"
 TUR_arctic_wolves_training_program_desc: "ทหารของเราจะยองไปบนหิมะดุจหมาปาลาเหยื่อในปาเขตหนาว ดวยการฝกของเรา ศัตรูจะหวาดกลัวสิ่งที่ยิ่งกวาความหนาวในสายลมเยือกแข็ง"
 TUR_seize_religious_property: "ยึดทรัพยสินทางศาสนา"
 TUR_seize_religious_property_desc: "ศาสนาเปนภัยของสาธารณรัฐนี้มาตั้งแตแรกกอตั้ง เราจะโอนอาคารทางศาสนาทุกแหงในประเทศเปนของรัฐและปดลง แลวนําที่ดินไปใชใหเกิดประโยชนมากขึ้น ดวยการปลดปลอยตนเองจากพันธนาการของศาสนา ในที่สุดเราจะบรรลุศักยภาพสูงสุดของเรา"
 TUR_guarding_our_western_frontiers: "เสริมปอมพรมแดนตะวันตก"
 TUR_guarding_our_western_frontiers_desc: "ภัยคุกคามที่ยิ่งใหญที่สุดตออธิปไตยของเรามาจากตะวันตก เมื่อชาติตะวันตกบุกมาหาเรา พวกเขาจะพบวาเราพรอมผลักดันพวกเขากลับลงทะเลที่พวกเขาโผลขึ้นมา"
 TUR_anti_bolshevik_mediterranean_bloc: "กลุมเมดิเตอรเรเนียนตอตานบอลเชวิค"
 TUR_anti_bolshevik_mediterranean_bloc_desc: "เราอยากรักษาความสัมพันธอันดีกับ[SOV.GetNameDef] แตลัทธิสตาลินหางไกลจากอุดมคติแบบมารกซมากเสียจนเราคงหลอกตัวเองหากบอกวายอมรับได เราตองตัดขาดกับ[SOV.GetNameDef] และหามิตรที่มีแนวคิดเดียวกันจากที่อื่น"
 TUR_readdress_the_montreux_convention: "ทบทวนอนุสัญญามองโทรซ"
 TUR_readdress_the_montreux_convention_desc: "ตอนที่เราจัดประชุมอนุสัญญามองโทรซครั้งแรก เราอาจเขมงวดเกินไปเมื่อพิจารณาจุดยืนของ[SOV.GetAdjective] เราควรทบทวนปฏิญญาที่ลงนามไว และยอมผอนปรนตามที่[SOV.GetNameDef]รองขอในนามของมิตรภาพและความรวมมือ"
 TUR_the_international_of_proletarian_freethinkers: "สากลแหงนักคิดอิสระชนชั้นกรรมาชีพ"
 TUR_the_international_of_proletarian_freethinkers_desc: "นักคิดอิสระมาจากชนชั้นแรงงาน และในไมชาผูที่เกงและฉลาดที่สุดของชนชั้นแรงงานจะหลั่งไหลมาที่นี่เพื่อรวมสรางประโยชนสวนรวม"
 TUR_officers_of_the_revolution: "นายทหารแหงการปฏิวัติ"
 TUR_officers_of_the_revolution_desc: "เชนเดียวกับที่นายทหารเคมาลิสตเปนตัวแทนและผูพิทักษอุดมการณของตน นายทหารใหมของเราจะทําหนาที่เปนผูพิทักษลัทธิมารกซใน[TUR.GetNameDef]"
 TUR_taking_responsibility_for_the_air_war: "รับผิดชอบสงครามทางอากาศ"
 TUR_taking_responsibility_for_the_air_war_desc: "ชาว[SOV.GetAdjective]มีภาระมากพอแลวกับการครองแผนดินและทองทะเล เราควรยื่นมือชวยดวยการรับผิดชอบสงครามทางอากาศบางสวน"
 TUR_strengthening_our_navies: "เสริมกําลังกองทัพเรือ"
 TUR_strengthening_our_navies_desc: "เพื่อปกปองตนเองในเมดิเตอรเรเนียน เราตองการกองทัพเรือที่แข็งแกรงและมีขีดความสามารถ ดวยความพยายามรวมกัน เราจะไปถึงระดับขั้นตํ่าที่จําเปนในการปกปองพรมแดนจากภัยคุกคามที่รุกคืบเขามา"
 TUR_avenge_the_treaty_of_sevres: "ลางแคนสนธิสัญญาแซฟวร"
 TUR_avenge_the_treaty_of_sevres_desc: "[FRA.GetNameDefCap]คิดวาพวกเขาจะทําลายเราไดในยามที่เราออนแอที่สุด พวกเขาพยายามเอาเปรียบเรา ปลดอาวุธเรา และแบงแยกเรา เราจะทํากับพวกเขาอยางที่พวกเขาวางแผนจะทํากับเราทุกประการ"
 TUR_strike_at_the_fascist_menace: "โจมตีภัยฟาสซิสต"
 TUR_strike_at_the_fascist_menace_desc: "ลัทธิฟาสซิสตเปนอุดมการณที่อันตรายเกินกวาจะปลอยใหอาละวาดอยูหลังบานเรา อีกนานแคไหนกวาประชาชนของเราจะติดเชื้อฟาสซิสต? เราตองบดขยี้พวกฟาสซิสต และดวยการทําเชนนั้นก็จะชวงชิงความชอบธรรมทั้งหมดไปจากขบวนการของพวกเขา"
 TUR_learning_from_the_tripolitanian_war: "บทเรียนจากสงครามตริโปลี"
 TUR_learning_from_the_tripolitanian_war_desc: "ลําดับเหตุการณที่นําไปสูการลมสลายของจักรวรรดิออตโตมันเกิดขึ้นรวดเร็วจนแทบไมมีเวลาไตรตรองบทเรียนที่ไดรับเลย เราควรเรียนรูจากความผิดพลาดเมื่อครั้งที่ชาว[ITA.GetAdjective]รุกรานลิเบียของออตโตมันและยึดไปจากเรา"
 TUR_stop_the_stalinist_charade: "ยุติละครฉากสตาลิน"
 TUR_stop_the_stalinist_charade_desc: "การปฏิวัติที่แทจริงตองถูกนํากลับคืนสูตนกําเนิด ที่ไหนสักแหงระหวางทาง [SOV.GetNameDef]ไดหลงลืมเปาหมายและจิตวิญญาณของตน เราตองชวยใหพวกเขาทวงคืนอุดมคติที่สูญหายไป"
 TUR_strike_the_british_imperialists: "โจมตีพวกจักรวรรดินิยมอังกฤษ"
 TUR_strike_the_british_imperialists_desc: "โลกจะไมมีวันเปลี่ยนแปลงอยางแทจริงตราบใดที่[ENG.GetNameDef]ยังคงอยูอยางที่เปน เราตองบดขยี้พวกเขา และทําลายจักรวรรดิอันนารังเกียจของพวกเขา"
 TUR_foreign_brigades_for_the_revolution: "กองพลนอยตางชาติเพื่อการปฏิวัติ"
 TUR_foreign_brigades_for_the_revolution_desc: "ลัทธิมารกซเปนหลักความเชื่อที่เปนสากลนิยมโดยพื้นฐาน จึงเปนเรื่องธรรมดาที่นักปฏิวัติจากทั่วโลกจะหลั่งไหลมายังชาติของเราเพื่อรวมตอสูในการตอสูระดับโลกรวมกันของเรา"
 TUR_joint_caucasian_turkish_officer_school: "โรงเรียนนายทหารรวมคอเคซัส-ตุรกี"
 TUR_joint_caucasian_turkish_officer_school_desc: "คารสเปนเมืองที่มีประวัติศาสตรยาวนาน และดวยที่ตั้งใกล [SOV.GetNameDef] จึงเปนทําเลเหมาะที่สุดสําหรับกอตั้งโรงเรียนนายทหารแนวการเมืองแหงใหม นายทหารของเราจะไมเพียงเรียนรูพื้นฐานการสงคราม แตยังรวมถึงรายละเอียดอันซับซอนของหลักลัทธิมารกซดวย"
 TUR_lift_the_turkiye_komunist_partisis_exile: "ยกเลิกการเนรเทศพรรคคอมมิวนิสตตุรกี"
 TUR_lift_the_turkiye_komunist_partisis_exile_desc: "สมาชิกพรรคคอมมิวนิสตตุรกีจํานวนมากยังคงลี้ภัยอยูใน [SOV.GetNameDef] หรือซอนตัวอยูทั่วยุโรปในหนวยลับตาง ๆ เราอาจไมเห็นดวยกับทุกสิ่งที่ TKP กลาว แตเราก็ยังเปนสหายรวมการตอสูเพื่อปลดปลอยชนชั้นเดียวกัน ถึงเวลาแลวที่จะพาพวกเขากลับบาน"
 TUR_reconciling_kemalism_with_bolshevism: "ประสานลัทธิเคมาลกับลัทธิบอลเชวิค"
 TUR_reconciling_kemalism_with_bolshevism_desc: "[SOV.GetLeader] จะตองไดรับการยกยองเปนหนึ่งในบุคคลสําคัญทางอุดมการณที่นิยามอุดมการณของเรา จะเปลี่ยนแนวอุดมการณเชนนี้ใหเรียบรอยไรรอยตอไดอยางไรยังเปนปริศนา แตใครเลาจะกลาออกมาทวงเรา?"
 TUR_the_turkish_tank_project: "โครงการรถถังตุรกี"
 TUR_the_turkish_tank_project_desc: "รถถังคืออาวุธแหงอนาคต และลัทธิคอมมิวนิสตคือหลักความเชื่อแหงอนาคต ทั้งสองเขากันไดดีเหมือนชีคเคิฟเตกับราคึ!"
 TUR_scrapping_our_debts: "ลางหนี้ของเรา"
 TUR_scrapping_our_debts_desc: "การสรางชาติของเราขึ้นมาแทบจากศูนยนั้นเปนเรื่องที่สิ้นเปลืองมาก และเราจะซาบซึ้งในนํ้าใจของชาติที่รํ่ารวยกวาซึ่งชวยเหลือเราในการไตบันไดสูความกาวหนาของชาติ อยางไรก็ตาม บัดนี้เราไดแยกทางจากผูที่คิดจะควบคุมเราดวยถุงเงินมามากเสียจนไมมีทางเลือกอื่นนอกจากตัดหนี้สินทั้งหมดทิ้ง"
 TUR_collectivising_our_agriculture: "รวมการเกษตรเปนนารวม"
 TUR_collectivising_our_agriculture_desc: "การเกษตรเปนภาคสวนที่สําคัญยิ่งใน [ROOT.GetNameDef] และผูที่ทํางานบนผืนดินจะไมถูกผูที่หวังรีดผลกําไรจากพวกเขาขูดรีดอีกตอไป นับแตนี้ไป เกษตรกรจะกําหนดคาแรงของตนเองและควบคุมปจจัยการผลิตของตนเอง"
 TUR_capitalise_on_rising_kurdish_nationalism: "ฉวยประโยชนจากชาตินิยมเคิรดที่กําลังกอตัว"
 TUR_capitalise_on_rising_kurdish_nationalism_desc: "เรามีเหตุใหเชื่อวาชาวเคิรดนอกประเทศของเรากําลังสมคบคิดกอการรายอันหลงผิดภายในพรมแดนของเรา พวกเขาไมเขาใจวาคนงานชาวเคิรดไดรับการปลดปลอยแลวดวยลัทธิคอมมิวนิสต เราจะปลดปลอยชนชั้นกรรมาชีพผูหลงผิดในตางแดนดวยเชนกัน"
 TUR_issue_an_ultimatium_to_the_bulgarians: "ยื่นคําขาดตอชาวบัลแกเรีย"
 TUR_issue_an_ultimatium_to_the_bulgarians_desc: "เคยมีชาติใดที่ชั่วชายิ่งกวา [BUL.GetNameDef] บางหรือไม? พวกเขาทําลายดุลอํานาจในคาบสมุทรบอลขานครั้งแลวครั้งเลา โดยไมมีเหตุผลอื่นใดนอกจากสนองความเพอฝนแบบดินแดนนิยมอันเห็นแกตัวของพวกเขาเอง เราจะครอบงําพวกเขา และดวยเหตุนั้นเราจะปลดปลอยคนงานชาว[BUL.GetAdjective] - แมวาเขาจะไมสมควรไดรับก็ตาม"
 TUR_learning_from_the_great_war: "บทเรียนจากมหาสงคราม"
 TUR_learning_from_the_great_war_desc: "แมกองทัพของเราจะไดรับชัยชนะเหนือฝายสัมพันธมิตรและออตโตมันในสงครามปลดปลอย แตชาติของเราตองจายราคาของอิสรภาพดวยเลือด เราตองไมยอมใหหายนะรายแรงขนาดนั้นเกิดขึ้นกับประเทศของเราอีก เราตองเรียนรูจากความผิดพลาดในอดีต และศึกษาชัยชนะของเรา"
 TUR_modernising_the_army: "ปรับปรุงกองทัพใหทันสมัย"
 TUR_modernising_the_army_desc: "เราตามหลังในดานนวัตกรรมทางเทคโนโลยีการสงคราม เพื่อไมใหการนองเลือดในอดีตซํ้ารอย เราตองรีบปรับยุทธวิธีและยุทโธปกรณของเราใหทันสมัย"
 TUR_hava_okulu: "ฮาวาโอคูลู"
 TUR_hava_okulu_desc: "เราภูมิใจที่มีสถาบันเกาแกและนาเคารพซึ่งอุทิศใหแกการบินทั้งทางทหารและพลเรือน เราควรทุมเทใหกับการทําสงครามทางอากาศมากขึ้น"
 TUR_expand_the_air_bases: "ขยายฐานทัพอากาศ"
 TUR_expand_the_air_bases_desc: "ประเทศของเรากวางใหญมาก และเปนเรื่องสําคัญยิ่งที่กองทัพอากาศของเราตองครอบคลุมดินแดน[ROOT.GetAdjective]ไดทุกตารางนิ้ว"
 TUR_mechanising_our_army: "ทํากองทัพใหเปนยานยนต"
 TUR_mechanising_our_army_desc: "นี่เปนเปาหมายที่ทะเยอทะยาน แตก็เปนสิ่งที่จําเปนตองทํา ไมชาก็เร็ว กองทัพทั้งหลายจะกลายเปนกองทัพยานยนต เราเพียงตองตัดสินใจวาจะพรอมลงมือตอนนี้ หรือจะรอจนกวามันจะเปนไปไดมากขึ้นในอนาคต"
 TUR_embrace_military_tradition: "ยึดถือประเพณีทางทหาร"
 TUR_embrace_military_tradition_desc: "จักรวรรดิออตโตมันเคยเปนภัยคุกคามตอทั่วทั้งทวีปยุโรป แนนอนวามีความผิดพลาดบาง - แตหากมองยอนไปยังอดีต บางทีเราอาจมีกองทัพที่สามารถเดินทัพไปถึงประตูเมืองเวียนนาและไกลกวานั้นไดอีกครั้ง"
 TUR_the_kirikkale_tank: "รถถังเคอรึกคาเล"
 TUR_the_kirikkale_tank_desc: "เราพึ่งพาแบบยานเกราะของตางชาติมากเกินไป เราจะออกแบบรถถัง[ROOT.GetAdjective]ของเราเอง - รถถังเคอรึกคาเล!"
 TUR_superiority_of_arms: "ความเหนือกวาดานอาวุธ"
 TUR_superiority_of_arms_desc: "จะทุมคนเขาแกปญหาไปทําไม ในเมื่อกระสุนและลูกปนใหญสิ้นเปลืองไดมากกวา? เราตองพยายามมากขึ้นในการรักษาชีวิตทหารดวยการใชอํานาจการยิงที่เหนือกวาอยางทวมทน"
 TUR_utilising_our_terrain: "ใชประโยชนจากภูมิประเทศ"
 TUR_utilising_our_terrain_desc: "อานาโตเลียคือความฝนของฝายตั้งรับและฝนรายที่สุดของผูรุกราน เรารูจักประเทศของเราดี และเราควรฝกฝนการใชปราการธรรมชาติของชาติเพื่อใหการรุกรานใด ๆ กลายเปนศึกที่ตองสูกันอยางยากลําบาก"
 TUR_construct_the_cakmak_line: "สรางแนวชักมัก"
 TUR_construct_the_cakmak_line_desc: "จอมพลเฟฟซี ชักมัก เสนอใหสรางแนวปอมปราการปองกันรอบเอดีรเนและชองแคบบอสพอรัส แมจะมีความลังเลในหมูเจาหนาที่ตอโครงการนี้อยูบาง แตทายที่สุดแลวประโยชนยอมคุมคากวาตนทุน และถึงเวลาแลวที่เราจะเริ่มสรางแนวปอมนี้"
 TUR_accelerate_native_fighter_designs: "เรงพัฒนาแบบเครื่องบินขับไลของชาติ"
 TUR_accelerate_native_fighter_designs_desc: "อุตสาหกรรมการบินของเราเกาแกและไดรับความเคารพ แตมีแบบเครื่องบิน[ROOT.GetAdjective]แท ๆ เพียงไมกี่แบบที่ผานมาตรฐานการผลิต เราตองเปลี่ยนแปลงสิ่งนั้น"
 TUR_patrol_the_seas: "ลาดตระเวนทองทะเล"
 TUR_patrol_the_seas_desc: "ทะเลคือปราการธรรมชาติที่ปองกันการรุกรานของเรา และเราตองดูแลมันเชนเดียวกับพรมแดนทางบก"
 TUR_invoke_the_methods_of_mehmed_ii: "ใชวิธีของเมหเหม็ดที่ 2"
 TUR_invoke_the_methods_of_mehmed_ii_desc: "เราเรียนรูจากเมหเหม็ดที่ 2 วาเมื่อปญหาดูเหมือนจะแกไมได ปนใหญกระบอกโตมักจะเปนทางออกที่ไดผลดีทีเดียว"
 TUR_turkish_air_defense_platforms: "ฐานปองกันภัยทางอากาศของตุรกี"
 TUR_turkish_air_defense_platforms_desc: "เราตองพยายามปกปองนานฟาของเราในกรณีที่ถูกโจมตีทางอากาศจากทะเลหรือจากดินแดนของเพื่อนบาน"
 TUR_expand_the_golcuk_naval_base: "ขยายฐานทัพเรือเกิลจืค"
 TUR_expand_the_golcuk_naval_base_desc: "การขยายฐานทัพเรือเกิลจืคจะชวยใหเราสนับสนุนเปาหมายทางยุทธศาสตรในชองแคบและทะเลอีเจียนได"
 TUR_relocate_from_yildiz_palace: "ยายออกจากพระราชวังยึลดึซ"
 TUR_relocate_from_yildiz_palace_desc: "เรามุงความพยายามทางนาวีไวที่ชานักกาเลและชองแคบนานเกินไปแลว ถึงเวลาที่จะลงมือตามแผนขยายทาเรือเมอรซินเสียที"
 TUR_the_legacy_of_osmanli_donanmasi: "มรดกแหงออสมานลึ ดอนานมาซึ"
 TUR_the_legacy_of_osmanli_donanmasi_desc: "กองเรือออตโตมันนั้นนาเกรงขามอยางแทจริง และหากมีสิ่งใดจากจักรวรรดิที่ลมสลายที่ควรคาแกการไวอาลัย สิ่งนั้นก็คือกองทัพเรืออันเกรียงไกรของมัน เราสามารถยกยองมรดกนั้นไดดวยกองทัพเรือที่ทันสมัยยิ่งขึ้นในวันนี้"
 TUR_the_path_of_the_wolf: "วิถีแหงหมาปา"
 TUR_the_path_of_the_wolf_desc: "เชนเดียวกับหมาปา เราตองออกลาอยูเสมอ เราจะหมอบตํ่า และโจมตีเมื่อศัตรูคาดไมถึงที่สุด เรามีจิตใจแบบหมาปา และเรือดํานํ้าคือเครื่องมือที่สมบูรณแบบในการแสดงจิตใจนั้น"
 TUR_fortified_defensive_bases: "ฐานปองกันที่เสริมปอม"
 TUR_fortified_defensive_bases_desc: "มีคํากลาววาการรุกที่ดีที่สุดคือการตั้งรับที่ดี และจุดยืนอยางเปนทางการของเราคือเราไมไดไมเห็นดวย!"
 TUR_turk_silahli_kuvvetleri: "เติรก ซิลาหลึ คูฟเวตเลรี"
 TUR_turk_silahli_kuvvetleri_desc: "กองทัพของเราทันสมัยอยางแทจริงแลว และไมใชเงาของตนเองเหมือนหลังสงครามประกาศอิสรภาพอันเลวรายอีกตอไป ดวยสภาพปจจุบัน เราสามารถทาทายทั้งโลกได เราควรภูมิใจที่มาไกลไดถึงเพียงนี้"
 TUR_misak_i_milli: "มีซาค-อึ มิลลี"
 TUR_misak_i_milli_desc: "มีซาค-อึ มิลลี - กติกาสัญญาแหงชาติ หลังจักรวรรดิออตโตมันลมสลายและสงครามประกาศอิสรภาพสิ้นสุดลง เราไดสละดินแดนที่ยึดครองไวจํานวนมากโดยสมัครใจและเลิกอางสิทธิ์ในดินแดนเหลานั้น บัดนี้โลกเปลี่ยนไปแลว และผูคนในดินแดนเหลานั้นตางเรียกรองใหเรากลับไป เราจะทําตามความตองการของพวกเขา"
 TUR_alienate_our_allies_tt: "\n§Rการเปลี่ยนนโยบายตางประเทศอยางสุดขั้วอาจทําใหพันธมิตรเหินหางจากเรา โดยเฉพาะหากเราเริ่มเล็งเปาไปที่พวกเขา§!"
 TUR_recover_the_kardzhali_vilayet: "ทวงคืนวิลาเยตคารจาลี"
 TUR_recover_the_kardzhali_vilayet_desc: "ชาว[BUL.GetAdjective]ผูนารังเกียจเปนหนามยอกอกเรามานานเกินไปแลว พวกเขาจะปฏิเสธอยางไรก็ได แตชนชาติเติรกที่ติดอยูและถูกกดขี่ในรัฐซากเดนอันโหดรายของพวกเขาตางรํ่ารองหาการปลดปลอย เราไมตั้งใจจะใหพวกเขารอนานกวานี้อีกแลว"
 TUR_cypriot_and_oniki_ilhak: "ผนวกไซปรัสและหมูเกาะโดเดคะนีส"
 TUR_cypriot_and_oniki_ilhak_desc: "ชาว[GRE.GetAdjective]จะเรียกรองเอโนซิสอยางไรก็ตามใจ เราจะเอาชนะพวกเขาดวยเกมของพวกเขาเองผานการผนวกของเรา ไซปรัสและโรดสเปนของเราโดยชอบธรรม และเมื่อเรายึดคืนมาได เราจะไมมีวันปลอยไปอีก"
 TUR_reuniting_thrace_through_force: "รวมเทรซดวยกําลัง"
 TUR_reuniting_thrace_through_force_desc: "ยังมีประชากรชาว[ROOT.GetAdjective]จํานวนมากในเทรซ เราครองสวนใหญไวที่เอดีรเน แตชาว[GRE.GetAdjective]ยืนกรานจะใหดินแดนนี้ถูกแบงแยกตอไป บัดนี้เราตองยืนกรานในทางตรงกันขาม"
 TUR_rebuke_the_treaty_of_kars: "ปฏิเสธสนธิสัญญาคารส"
 TUR_rebuke_the_treaty_of_kars_desc: "สนธิสัญญาคารสควรจะยุติปญหาพรมแดนระหวาง [ROOT.GetNameDef] กับคอเคซัส แตสนธิสัญญาเชนนี้จะมีนํ้าหนักไดอยางไร ในเมื่อชีวิตของชาวเติรกในภูมิภาคตองสาปนั้นตกอยูในอันตราย? เราจะสูสุดกําลังเพื่อชวยเหลือพี่นองรวมเชื้อสายของเรา"
 TUR_unite_the_azeri_diaspora: "รวมชาวอาเซอรที่พลัดถิ่น"
 TUR_unite_the_azeri_diaspora_desc: "เปนหนาที่อันศักดิ์สิทธิ์ของเราที่จะรวมชนชาติเติรกทั้งปวงในโลกไวภายใตชาติเดียว และตราบใดที่เรายังไมไดปลดปลอยพี่นองชาวอาเซอรในตางแดน ภารกิจของเราก็ยังไมเสร็จสิ้น"
 TUR_konfederasyon: "สมาพันธรัฐ"
 TUR_konfederasyon_desc: "เรามีความผูกพันอันลึกซึ้งกับชาวอาเซอรไบจานมาโดยตลอด และจะเปนเกียรติอยางยิ่งที่จะมอบสถานะพลเมืองเทาเทียมแกชาวอาเซอรในการรวมตัวอันงดงามของชนชาติเติรกของเรา"
 TUR_annul_the_ankara_anlasmasi: "ยกเลิกสนธิสัญญาอังการา"
 TUR_annul_the_ankara_anlasmasi_desc: "ในป 1926 ปญหาโมซูลดูเหมือนจะไดรับการแกไข - แตเชนเดียวกับวิกฤตการณทั้งหลายในยุคนั้น ผลลัพธเปนประโยชนตอชาว[ENG.GetAdjective]และชาว[FRA.GetAdjective]อยางปฏิเสธไมได เราจะไมเพิกเฉยตอชะตากรรมของชาวเติรกใน[IRQ.GetAdjective]อีกตอไป ถึงเวลาลงมือแลว"
 TUR_liberate_the_kurdish_diaspora: "ปลดปลอยชาวเคิรดพลัดถิ่น"
 TUR_liberate_the_kurdish_diaspora_desc: "ชะตากรรมของชาวเติรกและชาวเคิรดผูกพันกันอยู และหากเราไมรวมหัวจมทายกัน ประวัติศาสตรก็จะซํ้ารอยตัวเองไปชั่วนิรันดร"
 TUR_turanist_ambition: "ความทะเยอทะยานแหงลัทธิตูราน"
 TUR_turanist_ambition_desc: "เรามีเจตจํานงที่จะสรางจักรวรรดิอันยิ่งใหญใหแกตนเอง แตก็เสี่ยงที่จะยั่วยุความโกรธของมหาอํานาจที่ยังคงยืนหยัดอยู พวกเขาจะพยายามขัดขวางเรา แตเมื่อยูเรเชียตกอยูใตการควบคุมของเรา พวกเขาจะไมอาจทําสิ่งใดหยุดยั้งเราได"
 TUR_subdue_the_magyars: "ปราบชาวมาไจาร"
 TUR_subdue_the_magyars_desc: "พวกเขาอาจคิดวาตนเองหางไกลจากรากเหงาไปมากแลวหลังจากอยูใตอุงมือออสเตรียมาหลายศตวรรษ แตเรามองเห็นชาวฮังการีในแบบที่เขาเปนจริง ๆ เขาคือชาวเติรกที่ปฏิเสธตัวตน เปนหมาปาที่คิดวาตัวเองเปนเหยี่ยว เราจะเตือนใหชาวมาไจารระลึกถึงมรดกของตน"
 TUR_cin_turkleri: "ชาวเติรกในจีน"
 TUR_cin_turkleri_desc: "ชาวเติรกในจีนจะตกเปนเหยื่อเสมอหากปราศจากความเปนปกแผนของชาวเติรกในตางแดน เปนหนาที่ของเราที่จะปลดปลอยและปกปองชาวเติรกในจีนจากผูที่ปฏิเสธมรดกของพวกเขา"
 TUR_crowning_ourselves_with_the_fin_ugor: "สวมมงกุฎดวยชาวฟนโน-อูกริก"
 TUR_crowning_ourselves_with_the_fin_ugor_desc: "ไมมีอัญมณีใดในมงกุฎแหงลัทธิตูรานที่งดงามไปกวา [FIN.GetNameDef] การพิชิตชาว[FIN.GetAdjective]คือยอดสุดแหงความทะเยอทะยาน และเราตั้งใจเต็มที่จะบรรลุความทะเยอทะยานนั้นและทําใหภราดรภาพตูรานของเราสมบูรณ"

 BUL_acquire_modern_tools: "จัดหาเครื่องมือที่ทันสมัย"
 BUL_acquire_modern_tools_desc: "อุตสาหกรรมของบัลแกเรียสวนใหญเปนการผลิตขนาดเล็กแบบลาสมัยและงานหัตถกรรม เราตองการเครื่องมือที่เหมาะสมเพื่อสรางและพัฒนารากฐานของอุตสาหกรรมสมัยใหม"
 BUL_improve_the_road_system: "ปรับปรุงระบบถนน"
 BUL_improve_the_road_system_desc: "ถนนในบัลแกเรียดอยพัฒนาอยางยิ่งเลยทีเดียว ทําใหการคมนาคมติดตอยากลําบากและลาชา การพัฒนาอุตสาหกรรมโครงสรางพื้นฐานสมัยใหมที่สามารถปรับปรุงและขยายระบบถนนในปจจุบันจะปูทางสูการแกปญหาการขนสงของเรา"
 BUL_attract_foreign_capitals: "ดึงดูดทุนตางชาติ"
 BUL_attract_foreign_capitals_desc: "เราขาดหนทางที่จะสรางอุตสาหกรรมที่แข็งแกรงและมีประสิทธิภาพไดดวยตนเอง ทางเลือกที่ดีที่สุดจึงเปนการเชิญชวนนักลงทุนตางชาติที่ตองการขยายธุรกิจมาดําเนินกิจการในบัลแกเรีย"
 BUL_attract_foreign_capitals_dynamic_modifier_tt: "ไดรับจิตวิญญาณแหงชาติ §Yอุตสาหกรรมตางชาติ§! ซึ่งใหผล (อัตราไดรับอํานาจทางการเมือง: §G+5%§!, ความเร็วการกอสราง: §R-10%§!, ผลผลิตโรงงาน: §R-2%§!, £GFX_prod_eff_cap เพดานประสิทธิภาพการผลิต: §R-5%§!, £GFX_prod_eff การเติบโตของประสิทธิภาพการผลิต: §R-5%§!)"
 BUL_invigorate_national_industry: "ฟนฟูอุตสาหกรรมแหงชาติ"
 BUL_invigorate_national_industry_desc: "เราพึ่งพาทุนตางชาติในการพัฒนาโครงสรางพื้นฐาน อุตสาหกรรม และการเกษตรมานานเกินไปแลว หากเราตองการพึ่งพาตนเองและมีอิสระในการพัฒนาประเทศในแบบของเรา เราตองเริ่มจากการลงทุนในอุตสาหกรรมแหงชาติและการสรางโรงงานแหงใหม\nมันจะไมใชงานงาย แตในระยะยาวยอมคุมคากับความพยายามอยางแนนอน"
 BUL_expand_sofia_university: "ขยายมหาวิทยาลัยโซเฟย"
 BUL_expand_sofia_university_desc: "ดวยการจัดสรรงบประมาณบางสวนเพื่อขยายสิ่งอํานวยความสะดวกของมหาวิทยาลัยโซเฟย สถาบันอุดมศึกษาที่มีชื่อเสียงที่สุดในบัลแกเรีย เราจะเพิ่มจํานวนผูมีสติปญญาเฉียบแหลม ซึ่งเราจะนํามาใชใหเกิดประโยชน"
 BUL_expand_the_tobacco_industry: "ขยายอุตสาหกรรมยาสูบ"
 BUL_expand_the_tobacco_industry_desc: "ตลอดหลายทศวรรษ สินคาสงออกหลักของเราคือผลผลิตทางการเกษตร แตเห็นไดชัดวาเรายังเพิ่มผลกําไรจากการสงออกไดอีก ดวยการเปลี่ยนจากการปลูกธัญพืชไปปลูกพืชที่มีมูลคาสูงกวา เชน ยาสูบ"
 BUL_nationalization: "การโอนกิจการเปนของรัฐ"
 BUL_nationalization_desc: "ทุนตางชาติทําใหเราพัฒนานิคมอุตสาหกรรมแหงใหมในบัลแกเรียไดในขนาดที่ไมเคยเห็นมากอนในคาบสมุทรบอลขาน แตเหลาเจาสัวที่เปนเจาของกลับดูดเลือดเศรษฐกิจของเรามากขึ้นเรื่อย ๆ ถึงเวลาแลวที่เราจะยึดปจจัยการผลิตของพวกเขาและขับไลพวกเขาออกจากประเทศ อยางไรก็ตาม เรื่องนี้จะสรางความโกรธเคืองแกรัฐบาลตางชาติ และหากการทูตลมเหลว เราอาจตองสูเพื่อมัน..."
 BUL_nationalization_dynamic_modifier_tt: "ลบจิตวิญญาณแหงชาติ §Yอุตสาหกรรมตางชาติ§!"
 BUL_nationalization_warning_tt: "§Rผลจากการโอนกิจการเปนของรัฐ ประเทศตางชาติที่ลงทุนในอุตสาหกรรมของบัลแกเรียอาจตัดสินใจควํ่าบาตรทางการคาตอประเทศของเรา ขับเราออกจากฝาย หรือแมแตประกาศสงครามกับเรา!§!"
 BUL_increase_industry_investments: "เพิ่มการลงทุนในอุตสาหกรรม"
 BUL_increase_industry_investments_desc: "เราตองพัฒนาอุตสาหกรรมหนักที่สามารถรองรับการเติบโตทางอุตสาหกรรมและการทหารอันยิ่งใหญของเรา จําเปนตองใชการลงทุนระดับชาติจํานวนมหาศาล แตสิ่งนี้จะนําเราเขาใกลความเปนอิสระทางเศรษฐกิจอยางสมบูรณ"
 BUL_utmost_optimization: "เพิ่มประสิทธิภาพขั้นสูงสุด"
 BUL_utmost_optimization_desc: "ดวยการใหความสําคัญกับการพัฒนาอุตสาหกรรมแหงชาติ เราไดเห็นการผลิตเพิ่มขึ้นอยางตอเนื่อง และอุตสาหกรรมใหมจํานวนมากก็พัฒนาอยางรวดเร็ว แมจะยังไมมีประสิทธิภาพนัก ถึงเวลาที่เราตองทุมเทครั้งสุดทาย ดวยการปรับโครงสรางอุตสาหกรรมและที่ดินครั้งใหญ ซึ่งจะทําใหเราบรรลุประสิทธิภาพสูงสุดทั้งในภาคอุตสาหกรรมและการเกษตร"
 BUL_utmost_optimization_dynamic_modifier_tt: "ปรับ §Yอุตสาหกรรมตางชาติ§! ดังนี้\nความเร็วการกอสราง: §G+5%§!\n£GFX_prod_eff_cap เพดานประสิทธิภาพการผลิต: §G+3%§!\n£GFX_prod_eff การเติบโตของประสิทธิภาพการผลิต: §G+3%§!"
 BUL_utmost_optimization_tt: "ผลจะเปลี่ยนไปหากแผนยุทธศาสตร §Yดึงดูดทุนตางชาติ§! เสร็จสิ้นแลว"
 BUL_national_railway_lines: "เสนทางรถไฟแหงชาติ"
 BUL_national_railway_lines_desc: "เราตองการวิธีที่รวดเร็วและเชื่อถือไดในการเคลื่อนยายไมเพียงแตกําลังทหาร แตรวมถึงเสบียงไปทั่วประเทศ การขยายเสนทางรถไฟจะชวยเพิ่มขีดความสามารถดานการสงกําลังบํารุงของเรา"
 BUL_all_that_glitters: "ทุกสิ่งที่เปลงประกาย"
 BUL_all_that_glitters_desc: "แหลงทองคําในเชโลเปชสามารถเกื้อหนุนเศรษฐกิจของเราไดเปนอยางดีในยามที่การลงทุนในสินทรัพยที่ไมมีตัวตนมีความเสี่ยงสูง ผลตอทุนสํารองของชาตินาจะเห็นไดชัดเจน"
 BUL_light_metal_exploitation: "การใชประโยชนจากโลหะเบา"
 BUL_light_metal_exploitation_desc: "เมื่ออุตสาหกรรมทหารของเราตองการทรัพยากรธรรมชาติจํานวนมาก เราจําเปนตองพยายามขยายการผลิตภายในประเทศ แมแหลงแรของเราจะยังมีขนาดเล็ก แตยามจําเปนเชนนี้ยอมตองนํามาใชประโยชนอยางแนนอน"
 BUL_steel_plant_in_pernik: "โรงงานเหล็กกลาในแปรนิค"
 BUL_steel_plant_in_pernik_desc: "บัลแกเรียไมใชประเทศที่รํ่ารวยทรัพยากรที่สุดในคาบสมุทรบอลขาน ดังนั้นเราจึงตองใชประโยชนสูงสุดจากขุมทรัพยที่ซอนอยูใตผืนดินของเรา เราตองปรับปรุงโรงงานเหล็กและสถานที่ขุดถานหินในแปรนิค และสรางโรงงานผลิตเหล็กกลาแหงแรกของเราที่นั่น"
 BUL_mineral_extraction_in_the_rhodopes: "การขุดแรในเทือกเขาโรโดป"
 BUL_mineral_extraction_in_the_rhodopes_desc: "เทือกเขาโรโดปอุดมไปดวยแรธาตุ เชน โครไมต แรเหล็ก สังกะสี และตะกั่ว และผูเชี่ยวชาญของเรามองในแงดีวาการสํารวจพื้นที่อยางเหมาะสมอาจนําไปสูการคนพบแหลงแรใหม"
 BUL_uranium_prospecting: "การสํารวจแรยูเรเนียม"
 BUL_uranium_prospecting_desc: "ยูเรเนียมกําลังกลายเปนทรัพยากรที่มีคายิ่งสําหรับการสรางอาวุธใหมอันทรงพลังและรายแรง และเราไดคนพบแหลงแรที่อาจอุดมสมบูรณในบูโฮโว เราตองสํารวจพื้นที่ และพิจารณาวาจะเปนประโยชนมากกวาหากเราใชทรัพยากรนี้เอง หรือมอบสิทธิ์สัมปทานแกพันธมิตรของเรา"
 BUL_uranium_prospecting_no_target_tt: "ปลดล็อกการตัดสินใจ: §Yขอตกลงสัมปทานยูเรเนียม§! ซึ่งใหโบนัสแกผูนําฝายของบัลแกเรียหรือพันธมิตรมหาอํานาจ §Rบัลแกเรียตองอยูในฝาย§!"
 BUL_uranium_prospecting_leader_target_tt: "ปลดล็อกการตัดสินใจ: §Yขอตกลงสัมปทานยูเรเนียม§! ซึ่งใหโบนัสแกผูนําฝายของบัลแกเรีย"
 BUL_uranium_prospecting_major_ally_target_tt: "ปลดล็อกการตัดสินใจ: §Yขอตกลงสัมปทานยูเรเนียม§! ซึ่งใหโบนัสแกพันธมิตรมหาอํานาจของบัลแกเรีย"
 BUL_georgi_benkovski_aircraft_repair_facilities: "ศูนยซอมอากาศยานเกออรกี เบนคอฟสกี"
 BUL_georgi_benkovski_aircraft_repair_facilities_desc: "เพื่อสรางกองทัพอากาศแหงชาติ จําเปนตองกอสรางโรงซอมโครงเครื่องบินและสถานที่ทดสอบเครื่องยนต ในเรื่องนี้ เราไดรับการเสนอโครงการที่นาสนใจในการกอตั้งโรงซอมอากาศยานเทเรม เกออรกี เบนคอฟสกี ในพลอฟดิฟ"
 BUL_pilot_training_program: "โครงการฝกนักบิน"
 BUL_pilot_training_program_desc: "หากบัลแกเรียจะครองนานฟา เราจะตองมีนักบินและลูกเรือที่มีประสบการณจํานวนมาก และเพื่อบรรลุเปาหมายนั้น เราตองพัฒนาโครงการฝกที่เหมาะสมโดยมีฐานทัพอากาศและสถานที่ฝกที่จําเปนรองรับ"
 BUL_negotiate_bulgarian_rearmament: "เจรจาการฟนฟูกําลังรบของบัลแกเรีย"
 BUL_negotiate_bulgarian_rearmament_desc: "กองทัพบัลแกเรียอยูในสภาพนาเวทนาเนื่องจากขอจํากัดของสนธิสัญญานุยยี-ซูร-แซน และเราแทบไมมีทางปองกันตนเองจากการรุกรานของประเทศเพื่อนบานใด ๆ เลย เราตองเจรจาใหยกเลิกขอจํากัดเหลานั้นโดยเร็ว มิฉะนั้นเพื่อนบานผูละโมบอาจตัดสินใจเปดฉากสงครามบอลขานอีกครั้ง"
 BUL_reorganize_the_military_industry: "ปรับโครงสรางอุตสาหกรรมทหาร"
 BUL_reorganize_the_military_industry_desc: "อุตสาหกรรมทหารของเราลาสมัยและไรประสิทธิภาพ ถูกออกแบบมาเพื่อผลิตยุทโธปกรณที่ตกยุคไปแลว เราตองดําเนินโครงการปรับปรุงใหทันสมัยกอนที่จะสายเกินไป"
 BUL_darzhavna_aeroplanna_rabotilnitsa: "ดารจาฟนา แอโรปลานนา ราโบติลนิตซา"
 BUL_darzhavna_aeroplanna_rabotilnitsa_desc: "เราไมควรพึ่งพานักออกแบบตางชาติในการจัดหาเครื่องบินที่กองทัพอากาศตองการ เราจะขยายและปรับปรุงสิ่งอํานวยความสะดวกของโรงซอมอากาศยานแหงรัฐในโบจูริชเตครั้งใหญ"
 BUL_darzhavna_samoletna_fabrika: "ดารจาฟนา ซาโมเลตนา ฟาบริกา"
 BUL_darzhavna_samoletna_fabrika_desc: "สิ่งอํานวยความสะดวกของ DAR ในโบจูริชเตกําลังผลิตเครื่องบินขับไลของบัลแกเรียปอนกองทัพอากาศของเราอยูแลว บัดนี้เราสามารถลงทุนสรางโรงงานอากาศยานแหงรัฐในโลเวช พรอมสิ่งติดตั้งทันสมัยที่จะมุงผลิตเครื่องบินเบาประเภทอื่น ๆ"
 BUL_foreign_aircraft_designers: "นักออกแบบอากาศยานตางชาติ"
 BUL_foreign_aircraft_designers_desc: "ทําไมเราตองเสียเวลาและแรงงานพัฒนาอุตสาหกรรมการบินแหงชาติ ในเมื่อเราสามารถจางนักออกแบบตางชาติที่มีประสบการณผลิตอากาศยานทางทหารมาหลายทศวรรษได?"
 BUL_kaproni_bulgarski: "คาโปรนี บุลการสกี"
 BUL_kaproni_bulgarski_desc: "บริษัทผูสรางอากาศยานของอิตาลีอยางคาโปรนีกําลังเผชิญภาวะลมละลายอยูในขณะนี้ และกําลังดิ้นรนกับการขาดแคลนทรัพยากรซึ่งถูกเบนไปใชในสายการผลิตอื่น สิ่งนี้เปดโอกาสใหเราเขาซื้อนิคมอุตสาหกรรมของบริษัทในคาซานลัก คือคาโปรนี บุลการสกี ซึ่งเราจะใชมุงผลิตเครื่องบินทิ้งระเบิดขนาดกลางและขนาดหนักได"
 BUL_darzhavna_voenna_fabrika: "ดารจาฟนา วอเอนนา ฟาบริกา"
 BUL_darzhavna_voenna_fabrika_desc: "ดวยการขยายโรงงานทหารแหงรัฐในคาซานลัก เราจะวางรากฐานสําหรับอุตสาหกรรมทหารแหงชาติที่เหมาะสม ซึ่งสามารถจัดหายุทโธปกรณคุณภาพสูงใหแกกองทัพของเรา"
 BUL_found_dvf_sopot: "กอตั้ง DVF โซโปต"
 BUL_found_dvf_sopot_desc: "การกอสรางโรงงานกระสุนในโซโปตเริ่มขึ้นในป 1935 แตยังไมแลวเสร็จ เราตองทําขอตกลงจัดซื้อเครื่องจักรและอุปกรณที่เหลือ เพื่อใหนิคมแหงนี้เริ่มดําเนินการไดโดยเร็วที่สุด"
 BUL_contract_foreign_companies: "วาจางบริษัทตางชาติ"
 BUL_contract_foreign_companies_desc: "อุตสาหกรรมทหารของเรายังหางไกลจากความพรอมที่จะดําเนินโครงการฟนฟูกําลังรบอยางเพียงพอ เราตองมองหานักออกแบบที่เหมาะสมในตางประเทศซึ่งสามารถผลิตยานพาหนะคุณภาพสูงเพื่อจัดหาใหแกกองทัพของเรา"
 BUL_rebuild_the_army: "สรางกองทัพขึ้นใหม"
 BUL_rebuild_the_army_desc: "เราถูกรายลอมดวยศัตรูที่อาจเปนภัย ดังที่ประวัติศาสตรไดสอนเราอยางโหดราย และเปนเรื่องสําคัญยิ่งที่เราตองสรางกองทัพที่ทรงพลังและพัฒนายุทธวิธีสมัยใหม หากเราจะเปนฝายชนะในความขัดแยงใด ๆ ในอนาคต"
 BUL_vasil_levsky_national_military_university: "มหาวิทยาลัยการทหารแหงชาติวาซิล เลฟสกี"
 BUL_vasil_levsky_national_military_university_desc: "มหาวิทยาลัยการทหารแหงชาติมีประวัติอันยาวนาน แตการศึกษาทางทหารถูกลดทอนลงอยางมากนับตั้งแตถูกบังคับใชสนธิสัญญานุยยี ถึงเวลาที่จะสนับสนุนงบประมาณโครงการขยายสิ่งอํานวยความสะดวก และสงเสริมการรับนักเรียนนายรอยใหม ซึ่งวันหนึ่งจะกลายเปนนายทหารที่ประสบความสําเร็จ"
 BUL_prussia_of_the_balkans: "ปรัสเซียแหงบอลขาน"
 BUL_prussia_of_the_balkans_desc: "ในชวงปแรก ๆ ราชอาณาจักรซารแหงบัลแกเรียเปนรัฐที่มีการทหารเขมแข็ง มีกองทัพขนาดใหญและติดอาวุธครบครัน ไดรับการขนานนามวาปรัสเซียแหงบอลขาน จนกระทั่งถูกพันธมิตรเกาผูทรยศหักหลัง อยางไรก็ตาม เราไดสรางประเทศขึ้นใหมหลังความพายแพอันนาอัปยศในอดีต และบัดนี้ถึงเวลาที่จะทวงคืนเกียรติภูมิในอดีตของบัลแกเรีย โลกจะตองเรียกเราวาปรัสเซียแหงบอลขานอีกครั้ง!"
 BUL_national_military_academy: "โรงเรียนนายรอยแหงชาติ"
 BUL_national_military_academy_desc: "ผูบัญชาการโรงเรียนนายรอยแหงชาติไดเสนอโครงการขยายสิ่งอํานวยความสะดวก โดยมีเปาหมายไมเพียงเพิ่มขีดความสามารถของสถาบัน แตยังใหการฝกที่ดีขึ้นแกผูบัญชาการทหารในอนาคตของเราดวย"
 BUL_war_logistics: "การสงกําลังบํารุงในสงคราม"
 BUL_war_logistics_desc: "เราแพมหาสงครามไมใชเพราะพายแพในสนามรบ แตเพราะเราไมสามารถเลี้ยงดูประชาชนและสงเสบียงใหกองทหารได เราตองปรับปรุงการสงกําลังบํารุงเพื่อไมใหเรื่องเชนนั้นเกิดขึ้นอีก"
 BUL_defensive_lines: "แนวปองกัน"
 BUL_defensive_lines_desc: "เราตองเริ่มกอสรางปอมปราการที่เพียงพอและปรับปรุงโครงสรางพื้นฐานเพื่อปกปองเสนทางคมนาคมและรับประกันการไหลเวียนของเสบียงใหกองทหาร"
 BUL_a_black_sea_fleet: "กองเรือทะเลดํา"
 BUL_a_black_sea_fleet_desc: "หากเราตองการมีกําลังทางทะเลอยูบาง เราตองรวบรวมกองเรือที่เหมาะกับทะเลดํา โดยเนนการตอเรือพิฆาต เพราะเรือพิฆาตคือกระดูกสันหลังของกองเรือสมัยใหมทุกกองเรือ"
 BUL_improve_coastal_defenses: "ปรับปรุงการปองกันชายฝง"
 BUL_improve_coastal_defenses_desc: "เราเปราะบางอยางยิ่งตอการยกพลขึ้นบกใด ๆ จากทะเลดํา จึงจําเปนอยางยิ่งที่ตองเสริมแนวปองกันตลอดชายฝงทะเลดํา ยิ่งทําเร็วก็ยิ่งดี"
 BUL_reinforce_naval_bases: "เสริมกําลังฐานทัพเรือ"
 BUL_reinforce_naval_bases_desc: "เราตองทําใหมั่นใจวาฐานทัพเรือของเราไดรับการปกปองอยางดี และมีขีดความสามารถในการดูแลกองเรือที่ปฏิบัติการในพื้นที่"
 BUL_supremacy_on_the_bosporus: "ความเปนใหญเหนือชองแคบบอสพอรัส"
 BUL_supremacy_on_the_bosporus_desc: "เมื่อเราควบคุมชองแคบบอสพอรัสไดแลว เราตองสรางปอมปราการที่เพียงพอเพื่อรับประกันความเปนใหญของบัลแกเรียเหนือภูมิภาคยุทธศาสตรสําคัญแหงนี้"
 BUL_dominance_in_the_black_sea: "ครองความเปนใหญในทะเลดํา"
 BUL_dominance_in_the_black_sea_desc: "ยามมืดมนเรียกรองมาตรการเด็ดขาด เพื่อรับประกันไมเพียงบูรณภาพของชาติบัลแกเรีย แตรวมถึงความเปนเจาของดวย ถึงเวลาแลวที่เราจะยึดครองทะเลดําใหมั่นคง กําจัดภัยคุกคามที่อาจมีทั้งหมดออกจากชายฝง"
 BUL_dominance_in_the_aegean_sea: "ครองความเปนใหญในทะเลอีเจียน"
 BUL_dominance_in_the_aegean_sea_desc: "[GetDominanceInTheAegeanDesc]"
 BUL_dominance_in_the_aegean_default: "ยามมืดมนเรียกรองมาตรการเด็ดขาด เพื่อรับประกันไมเพียงบูรณภาพของชาติบัลแกเรีย แตรวมถึงความเปนใหญในสามทะเลดวย ถึงเวลาแลวที่เราจะยึดครองทะเลอีเจียนใหมั่นคง กําจัดภัยคุกคามที่อาจมีทั้งหมดออกจากชายฝง"
 BUL_dominance_in_the_aegean_black_sea_success: "หลังความสําเร็จในการยึดครองทะเลดํา ถึงเวลาที่จะทําซํ้าในทะเลอีเจียน เราจะขับไลชาติศัตรูทุกชาติบนชายฝง และยึดดินแดนอันมีคาเหลานั้นมาเปนของปรัสเซียแหงบอลขาน"
 BUL_dominance_in_the_aegean_black_sea_failure: "ความเสียหายที่เราไดรับจากความลมเหลวในภารกิจยึดครองทะเลดําทําใหขวัญของประชาชนบัลแกเรียหมนหมอง ทางเดียวที่จะแกไขไดคือการสถาปนาความเปนใหญของบัลแกเรียในทะเลอีเจียนใหสําเร็จในครั้งนี้"
 BUL_dominance_in_the_aegean_adriatic_success: "หลังความสําเร็จในการยึดครองทะเลเอเดรียติก ขวัญกําลังใจของทหารและพลเรือนบัลแกเรียสูงกวาที่เคย เราตองฉวยโอกาสนี้ยึดครองทะเลอีเจียน เพื่อใหปรัสเซียแหงบอลขานเปนผูพิทักษสามทะเลเพียงผูเดียวโดยไมมีใครโตแยง"
 BUL_dominance_in_the_aegean_adriatic_failure: "ความลมเหลวในการยึดครองทะเลเอเดรียติกเปนการทําลายขวัญของบัลแกเรียอยางรุนแรง หากเราตองการเรียกความกลาหาญและความมั่นใจคืนมา เราตองสถาปนาความเปนใหญของบัลแกเรียในทะเลอีเจียน"
 BUL_dominance_in_the_aegean_total_failure: "ความเสียหายที่เราไดรับจากความลมเหลวในการยึดครองทั้งทะเลเอเดรียติกและทะเลดํา กอใหเกิดกระแสความทอแทและความไมไววางใจตอรัฐบาลไปทั่วประเทศ หากเราจะแกไขความผิดพลาดและนําเกียรติภูมิที่ปรัสเซียแหงบอลขานสมควรไดรับกลับคืนมา เราตองสถาปนาความเปนใหญของบัลแกเรียในทะเลอีเจียน"
 BUL_dominance_in_the_adriatic_sea: "ครองความเปนใหญในทะเลเอเดรียติก"
 BUL_dominance_in_the_adriatic_sea_desc: "[GetDominanceInTheAdriaticDesc]"
 BUL_dominance_in_the_adriatic_default: "ยามมืดมนเรียกรองมาตรการเด็ดขาด เพื่อรับประกันไมเพียงบูรณภาพของชาติบัลแกเรีย แตรวมถึงความเปนใหญในสามทะเลดวย ถึงเวลาแลวที่เราจะยึดครองทะเลเอเดรียติกใหมั่นคง กําจัดภัยคุกคามที่อาจมีทั้งหมดออกจากชายฝง"
