#Building local support in a state
 wtt_political_organisation.1.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.1.desc: "เจาหนาที่พรรคระดับทองถิ่นใน [state.GetName] รายงานวาประชาชนสวนใหญในภูมิภาคยังคงสนับสนุนเรา การทํางานอยางหนักยังสงผลใหแรงสนับสนุนในพื้นที่เพิ่มขึ้นอีกดวย"
 wtt_political_organisation.1.a: "ผูคนยอมรูวาใครคือผูชนะ"
 wtt_political_organisation.2.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.2.desc: "แหลงขาวใน [state.GetName] รายงานวา [majority_country.GetNameDef] ดูเหมือนจะทุมเทเรงเพิ่มแรงสนับสนุนทั่วทั้งภูมิภาค และประชากรสวนใหญอยางชัดเจนก็ยังคงสนับสนุนพวกเขา"
 wtt_political_organisation.2.a: "การตอสูยังคงดําเนินตอไป"
 wtt_political_organisation.3.t: "[state.GetName] สนับสนุนเรา"
 wtt_political_organisation.3.desc: "ขาวดีมาถึงจาก [state.GetName] ซึ่งเมื่อไมนานมานี้มีการกอตั้ง "สมาคมศึกษาแนวคิด[Root.GetLeader]" ขึ้น ปจจุบันกลุมนี้ไดรับแรงสนับสนุนจากประชาชนเปนจํานวนมาก และรองรอยใด ๆ ของการสนับสนุนที่เคยมีตอ [old_majority_country.GetLeader] ก็ไดหายไปสิ้น"
 wtt_political_organisation.3.a: "พวกเขายึดถือแนวคิดที่เหนือกวา"
 wtt_political_organisation.4.t: "[From.GetNameDefCap] ไดเสียงขางมากใน [state.GetName]"
 wtt_political_organisation.4.desc_not_majority: "สายลับของเราใน [state.GetName] รายงานวาแรงสนับสนุนตอ [old_majority_country.GetNameDef] ในพื้นที่ลดลงอยางมาก เมื่อไมนานมานี้ มีการเดินขบวนขนาดใหญเพื่อสนับสนุน [majority_country.GetNameDef] ไปทั่วเมืองใหญของรัฐ และภาพขนาดใหญของ [majority_country.GetLeader] ก็ปรากฏอยูทุกหมูบาน"
 wtt_political_organisation.4.desc_had_majority: "ดวยการใชทุกวิถีทางที่มี สายลับของ [majority_country.GetNameDef] ดูเหมือนจะโนมนาวประชาชนใน [state.GetName] ใหหันไปเขาขางพวกเขาไดสําเร็จ เราตองทุมเทความพยายามเปนสองเทาเพื่อชนะใจพวกเขากลับคืนมา"
 wtt_political_organisation.4.a: "ยอมรับไมได"
 wtt_political_organisation.5.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.5.desc: "แมจะทุมเทอยางหนักเพื่อโนมนาวชาวเมือง [state.GetName] แตดูเหมือนจะมีเพียงไมกี่คนที่ยอมเปลี่ยนขางอยางเปดเผย มีขาวลือวา [majority_country.GetLeader] ประกาศดวยตนเองวาตองรักษา [state.GetName] ไวใหไดไมวาจะตองแลกดวยอะไร ประชาชนจํานวนมากกลัวการแกแคนหากแสดงการสนับสนุน [Root.GetLeader] อยางเปดเผย แตตัวแทนในทองถิ่นของเรายังคงหวังวาความพยายามครั้งใหมในอนาคตอาจโนมนาวผูคนไดมากขึ้น"
 wtt_political_organisation.5.a: "เราตองลองอีกครั้ง"
 wtt_political_organisation.6.t: "แรงสนับสนุน [From.GetNameDef] เพิ่มสูงขึ้นใน [state.GetName]"
 wtt_political_organisation.6.desc_not_majority: "หนังสือพิมพใน [state.GetName] รายงานวามีฝูงชนมาฟงสุนทรพจนชุดลาสุดของ [From.GetLeader] เปนจํานวนมากเปนประวัติการณ ดูเหมือนวาประชากรสวนหนึ่งที่เพิ่มขึ้นเรื่อย ๆ ไดหันมาสนับสนุน [From.GetNameDef] แลว อยางไรก็ตาม ในขณะนี้คนสวนใหญยังคงสนับสนุน [majority_country.GetLeader]"
 wtt_political_organisation.6.desc_has_majority: "ขาวนากังวลมาถึงจาก [state.GetName] สุนทรพจนชุดหนึ่งของ [From.GetLeader] ดึงดูดฝูงชนจํานวนมาก และเจาหนาที่พรรคในทองถิ่นของเราพบวาตนถูกลอมดวยประชาชนที่โกรธแคน เรียกรองคําตอบตอปญหาที่ [state.GetName] กําลังเผชิญ ขณะนี้สถานะของเราในรัฐยังมั่นคงอยู แตสิ่งนั้นอาจเปลี่ยนแปลงไดอยางรวดเร็ว"
 wtt_political_organisation.6.a: "เราตองจับตาดูสถานการณตอไป"

#Current leader being mean and removing local support in a state
 wtt_political_organisation.7.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.7.desc: "การชุมนุมใน [state.GetName] ไดบานปลายเปนความรุนแรงเมื่อผูประทวงถูกกลุมอันธพาลสวมหนากากเขาทําราย ความรุนแรงที่ปะทุขึ้นนี้ดูเหมือนจะไดผลตามที่ตองการ เพราะแรงสนับสนุนทางการเมืองตอฝายคานแทบจะหายไปจนหมดสิ้น \n\nแมจะไมมีสิ่งใดเชื่อมโยงเรากับเหตุการณนี้โดยตรง แตสารที่ตองการสื่อก็นาจะสงถึงอยางชัดเจนแลว"
 wtt_political_organisation.7.a: "นั่นคงสอนใหพวกมันรูวาไมควรมายุง"
 wtt_political_organisation.8.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.8.desc: "การชุมนุมสนับสนุนรัฐบาลของเราใน [state.GetName] ถูกโจมตีโดยกลุมอันธพาลติดอาวุธที่ [majority_country.GetLeader] จางมา ผูสนับสนุนของเราจํานวนหนึ่งถูกสังหารในการปะทะ และแรงสนับสนุนตอรัฐบาลของเราก็ลดลงจนนาเปนหวง"
 wtt_political_organisation.8.a: "นาอัปยศ"
 wtt_political_organisation.9.t: "[state.GetName] สนับสนุนเรา"
 wtt_political_organisation.9.desc: "สายลับของเราใน [state.GetName] ไดลงมือโจมตีที่ทําการพรรคทองถิ่นของ [old_majority_country.GetLeader] หลายครั้ง สรางความเสียหายรายแรงตอองคกรทางการเมืองของพรรคเขา ประชาชนตางก็สังเกตเห็นเรื่องนี้ บัดนี้ผูสนับสนุน [old_majority_country.GetLeader] กลายเปนคนกลุมนอยอยางชัดเจน"
 wtt_political_organisation.9.a: "ในความรักและสงครามไมมีอะไรผิดกติกา และการเมืองก็เปนทั้งสองอยางอยูบาง"
 wtt_political_organisation.10.t: "[From.GetNameDefCap] ไดเสียงขางมากใน [state.GetName]"
 wtt_political_organisation.10.desc_not_majority: "แรงสนับสนุนตอ [old_majority_country.GetLeader] ใน [state.GetName] ลดลงอยางมากหลังจากที่ทําการพรรคถูกลอบวางเพลิงหลายครั้ง การโจมตีเหลานี้นาจะเปนคําสั่งของ [majority_country.GetLeader] ผูซึ่งใหคํามั่นวาจะ "ฟนฟูความสงบเรียบรอย" ใน [state.GetName] ดูเหมือนวาประชากรสวนใหญไดหันมาสนับสนุนเขาแลว"
 wtt_political_organisation.10.desc_had_majority: "หลังเกิดการกอการรายหลายครั้งใน [state.GetName] ประชาชนในทองถิ่นดูเหมือนจะสิ้นศรัทธาในความสามารถของเราที่จะปกปองพวกเขา เนื่องจากการโจมตีมุงเปาเฉพาะที่ทําการพรรคของเรา จึงเห็นไดชัดวา [majority_country.GetLeader] มีสวนเกี่ยวของกับเรื่องนี้"
 wtt_political_organisation.10.a: "ยอมรับไมได"
 wtt_political_organisation.11.t: "รายงานจาก [state.GetName]"
 wtt_political_organisation.11.desc: "การรณรงคของเราเพื่อกดแรงสนับสนุนตอ [majority_country.GetLeader] ดูจะยังหางไกลจากความสําเร็จอยางสมบูรณ แมเราจะพยายามอยางเต็มที่ ประชาชนสวนใหญใน [state.GetName] ก็ยังคงสนับสนุน [majority_country.GetLeader]"
 wtt_political_organisation.11.a: "เราอาจตองยํ้าสารใหหนักแนนกวานี้"
 wtt_political_organisation.12.t: "การกดขี่ใน [state.GetName]"
 wtt_political_organisation.12.desc_not_majority: "[state.GetName] กําลังเผชิญกับคลื่นความรุนแรงทางการเมืองที่ไมเคยเกิดขึ้นมากอน การตอสูกลางถนนระหวางผูสนับสนุน [From.GetLeader] และ [majority_country.GetLeader] เกิดขึ้นทุกวัน ในขณะนี้ ดูเหมือนวา [majority_country.GetLeader] ยังคงมีประชากรสวนใหญหนุนหลังอยู"
 wtt_political_organisation.12.desc_has_majority: "สายลับของ [From.GetLeader] ใน [state.GetName] ไดเริ่มการรณรงคขมขูและกอความหวาดกลัวทางการเมือง มีรายงานวาประชาชนที่สนับสนุนเราถูกคุกคามในที่สาธารณะและถูกตราหนาวาเปนคนทรยศ เจาหนาที่พรรคถูกทํารายรางกาย และที่ทําการของเราบางแหงถูกเผาทําลาย ถึงกระนั้น ประชาชนในทองถิ่นสวนใหญก็ยังปฏิเสธที่จะกมหัวใหความหวาดกลัว และยังคงสนับสนุนเราตอไป"
 wtt_political_organisation.12.a: "เราจะตองชนะ"

#Warlord support 
 wtt_political_warlord_support.1.t: "[From.GetNameDefCap] ขอการสนับสนุนจากเรา"
 wtt_political_warlord_support.1.desc: "ผูแทนของ [asking_for_support.GetLeader] เดินทางมาหยั่งทาทีของเราเรื่องการเปนพันธมิตรทางการเมือง [asking_for_support.GetLeader] ใหคํามั่นวาจะไมแทรกแซงกิจการภายในของเรา หากเขาเปนฝายชนะในการชวงชิงอํานาจทางการเมืองครั้งนี้ การเลือกขางในความขัดแยงนี้อาจสงผลกระทบในระยะยาว เพราะฝายอื่นที่เกี่ยวของยอมมองวาเปนการทรยศอยางไมตองสงสัย"
 wtt_political_warlord_support.1.a: "เราจะสนับสนุนพวกเขา"
 wtt_political_warlord_support.1.b: "เราควรรอขอเสนอที่ดีกวานี้"
 wtt_political_warlord_support.2.t: "[warlord_asked_for_support.GetLeader] สนับสนุนเรา"
 wtt_political_warlord_support.2.desc: "ในจดหมายสวนตัวถึง [Root.GetLeader] [warlord_asked_for_support.GetLeader] ขอบคุณเราสําหรับการสนับสนุนอยางเอื้อเฟอตอรัฐบาลของเขา จดหมายกลาวตอไปวา หลังจากไตรตรองดวยตนเองอยางถี่ถวน [warlord_asked_for_support.GetLeader] ไดขอสรุปวาผลประโยชนของจีนโดยรวมจะไดรับการตอบสนองดีที่สุดดวยการให [Root.GetLeader] มีบทบาทมากขึ้นในการกําหนดอนาคตทางการเมืองของประเทศ\n\nจดหมายปดทายวา นับจากนี้ไป [warlord_asked_for_support] จะสนับสนุนความพยายามของเราในการชวงชิงอํานาจทางการเมืองครั้งนี้"
 wtt_political_warlord_support.2.a: "คนดีจริง ๆ"
 wtt_political_warlord_support.3.t: "[warlord_asked_for_support.GetNameDefCap] ปฏิเสธ"
 wtt_political_warlord_support.3.desc: "ภารกิจของเราในการขอการสนับสนุนจาก [warlord_asked_for_support.GetLeader] ไมประสบความสําเร็จ [warlord_asked_for_support.GetLeader] มองวาการชวงชิงอํานาจทางการเมืองในปจจุบันเปนเพียงเรื่องปลีกยอยที่ทําใหเราไขวเขวจากการรับมือภัยคุกคามที่แทจริงที่จีนกําลังเผชิญ"
 wtt_political_warlord_support.3.a: "ตราบใดที่เขายังวางตัวเปนกลาง..."
 wtt_political_warlord_support.10.desc: "จนถึงตอนนี้เราเลือกที่จะอยูนอกการชวงชิงอํานาจทางการเมืองครั้งนี้ ดูเหมือนวา [From.GetLeader] จะสังเกตเห็นเรื่องนี้ เขาไดสงสารมาถามวาตองทําอยางไรเราจึงจะประกาศสนับสนุนฝายของเขา\n\nเราควรชั่งนํ้าหนักทางเลือกอยางรอบคอบ และอยาขายเอกราชของเราในราคาถูกเกินไป"
 wtt_political_warlord_support.10.a: "ขอใหแสดงการสนับสนุนตอสาธารณะ"
 wtt_political_warlord_support.10.b: "ขอใหสงปนไรเฟลมาให"
 wtt_political_warlord_support.10.c: "ขอความชวยเหลือในการปฏิรูปกองทัพของเรา"
 wtt_political_warlord_support.10.d: "เราไมใชคนที่จะซื้อไดงาย ๆ!"
 wtt_political_warlord_support.11.t: "[From.GetLeader] เรียกรองใหแสดงการสนับสนุนตอสาธารณะ"
 wtt_political_warlord_support.11.desc: "การเจรจากับ [From.GetLeader] ไดขอยุติแลว ผูนําของ [From.GetNameDef] ระบุวาประชาชนในรัฐของเขาติดตามสถานการณในจีนดวยความสนใจอยางยิ่ง และมีการคาดเดากันอยางหนาหูวา [From.GetLeader] จะเขารวมชิงอํานาจหรือจะสละที่นั่งบนโตะเจรจาเมื่อใด \n\nการประกาศมิตรภาพและความชื่นชมตอ [From.GetLeader] อยางเปดเผยจากฝายเรา จะชวยใหประชาชนของ [From.GetNameDef] มั่นใจไดมากวาผูนําของพวกเขาเปนกําลังสําคัญในการเมืองจีนและไดรับความเคารพอยางกวางขวาง"
 wtt_political_warlord_support.11.a: "ถาตองทําแบบนี้ก็ได..."
 wtt_political_warlord_support.11.b: "ยอมรับไมได"
 wtt_political_warlord_support.12.t: "[From.GetLeader] เรียกรองอาวุธปน"
 wtt_political_warlord_support.12.desc: "การเจรจากับ [From.GetLeader] ไดขอยุติแลว ผูนําของ [From.GetNameDef] ระบุวาประชาชนในรัฐของเขากังวลอยางมากเรื่องยุทโธปกรณที่ยํ่าแยของทหาร หลายหนวยไมมีปนไรเฟลครบทุกคนดวยซํ้า และทหารจํานวนหนึ่งตองใชอาวุธลาสมัย ทั้งปนคาบศิลาบรรจุปากกระบอกและดาบ \n\nเนื่องจากการเลือกขางในความขัดแยงที่กําลังดําเนินอยูอาจนําไปสูการเผชิญหนาทางทหารในภายหลัง [From.GetLeader] จึงตองการคํามั่นที่หนักแนนจากเราวาจะติดอาวุธใหกองกําลังของเขาใหม กอนที่เขาจะประกาศการสนับสนุนอยางเปดเผย"
 wtt_political_warlord_support.12.a: "หวังวาเราจะไมตองเสียใจภายหลัง..."
 wtt_political_warlord_support.13.t: "[From.GetLeader] ขอความชวยเหลือทางทหาร"
 wtt_political_warlord_support.13.desc: "การเจรจากับ [From.GetLeader] ไดขอยุติแลว ในคําตอบของเขา [From.GetLeader] ระบุวากองกําลังทหารของเขาขาดแคลนนายทหารที่มีประสบการณอยางหนักและจําเปนตองปฏิรูปอยางเรงดวน ประชาชนของ [From.GetNameDef] จะไมมีวันยอมใหเขาแสดงจุดยืนที่กลาหาญเชนนี้ในการชวงชิงอํานาจ ขณะที่กองทัพของเขายังอยูในสภาพยํ่าแย \n\nหากเราชวย [From.GetLeader] ปฏิรูปกองทัพ เขาก็ยินดีจะสนับสนุนเราอยางเปดเผย"
 wtt_political_warlord_support.13.a: "เปนการเสียสละเพียงเล็กนอย"
 wtt_political_warlord_support.21.t: "[From.GetLeader] ใหการสนับสนุน"
 wtt_political_warlord_support.21.desc: "ในการแถลงตอสื่อมวลชนทั้งในและตางประเทศเมื่อตนสัปดาหนี้ [From.GetLeader] เรียกตนเองวา "ศิษยคนแรกแหงแนวคิด[From.From.GetLeader]" โดยกลาววาบุรุษอยาง [From.From.GetLeader] นี่เองที่จะทําใหจีนลุกขึ้นจากความโกลาหลของความขัดแยงภายในได\n\nเมื่อถูกถามวาจะพิจารณาให [From.From.GetLeader] ดํารงตําแหนงในรัฐบาลของเขาหรือไม [From.GetLeader] ตอบวาเขายินดีอยางยิ่งที่จะมีผูที่มีประสบการณและสติปญญาอยาง [From.From.GetLeader] อยูเคียงขาง"
 wtt_political_warlord_support.21.a: "ชางมีนํ้าใจเสียจริง"
 wtt_political_warlord_support.22.t: "[From.GetLeader] สงยุทโธปกรณมาให"
 wtt_political_warlord_support.22.desc: "ปนไรเฟลและยุทโธปกรณทหารราบอื่น ๆ ล็อตแรกเดินทางมาถึงจาก [From.GetNameDef] แลว แมอาวุธเหลานี้จะไมใชเทคโนโลยีลํ้าสมัย แตก็ดูอยูในสภาพใชงานไดดีและสามารถแจกจายใหกองทหารไดโดยเร็วที่สุด\n\nพรอมกับสินคาที่สงมา เราไดรับสารจาก [From.GetLeader] เตือนใหเราทําตามขอตกลงในสวนของเรา"
 wtt_political_warlord_support.22.a: "ของพวกนี้จะมีประโยชนมาก"
 wtt_political_warlord_support.23.desc: "คณะนายทหารที่ [From.GetLeader] สงมาเพื่อชวยเราปฏิรูปกองทัพไดเดินทางมาถึงแลว คณะนี้ประกอบดวยผูเชี่ยวชาญหลากหลายดาน ตั้งแตผูบังคับบัญชาทหารราบที่มีประสบการณ ไปจนถึงทหารปนใหญและนายทหารฝายเสนาธิการ \n\nหัวหนาคณะไดสงมอบสารจาก [From.GetLeader] เตือนใหเราทําตามขอตกลงในสวนของเรา"
 wtt_political_warlord_support.23.a: "ยินดีตอนรับพวกเขาอยางยิ่ง"

 wtt_take_national_leadership.1.t: "[From.GetLeader] พรอมขึ้นเปนผูนําประเทศ"
 wtt_take_national_leadership.1.desc: "ทั่วทั้งจีนเกิดการชุมนุมขนาดใหญ เรียกรองให [old_leader.GetLeader] กาวลงจากตําแหนงผูนําจีนและสงมอบอํานาจให [new_leader.GetLeader] แมแตในรัฐบาลของเราเอง ก็มีหลายคนเชื่อวา [new_leader.GetLeader] มีโอกาสมากกวาที่จะรวมจีนใหเปนหนึ่งเดียวและนําพาประเทศไปสูอนาคต \n\nแรงสนับสนุนทางการเมืองตอ [new_leader.GetLeader] เติบโตจนถึงจุดที่หากปฏิเสธการถายโอนอํานาจ ก็เสี่ยงที่จะกลับไปสูการสูรบอีกครั้ง"
 wtt_take_national_leadership.1.a: "ประชาชนไดแสดงเจตจํานงของพวกเขาแลว"
 wtt_take_national_leadership.1.b: "ที่นี่ไมใชประชาธิปไตย!"
 wtt_take_national_leadership.2.t: "[old_leader.GetLeader] ยอมสละอํานาจ"
 wtt_take_national_leadership.2.desc: "ในพิธีอยางเปนทางการ [old_leader.GetLeader] ไดสงมอบตําแหนงนายกรัฐมนตรีแหงสาธารณรัฐใหแก [new_leader.GetLeader] ในสุนทรพจนตอหนาผูสนับสนุนที่มาชุมนุม [new_leader.GetLeader] กลาววา \n\n"ขนบแหงแนวคิด[old_leader.GetLeader]ไดหลอหลอมจีนใหเปนอยางที่เปนอยูในวันนี้ ไมตองสงสัยเลยวา [old_leader.GetLeader] ไดทุมเททํางานอยางหนักเพื่อใหประเทศของเราเขมแข็งขึ้น เขาเปนผูรักชาติที่แทจริงและจะถูกจดจําในฐานะผูนําผูยิ่งใหญ แตเราก็ตองใหโอกาสแนวคิดใหม ๆ ไดพิสูจนตัวเองในโลกแหงความเปนจริงดวย เราจะรวมกันสรางจีนใหมที่ดีกวาเดิม เขมแข็งและเปนหนึ่งเดียว!"\n\n[old_leader.GetLeader] ไมไดแสดงความคิดเห็นใด ๆ"
 wtt_take_national_leadership.2.a: "ไชโยแด [new_leader.GetLeader]!"
 wtt_take_national_leadership.3.t: "[From.GetLeader] ปฏิเสธ"
 wtt_take_national_leadership.3.desc: "แม [new_leader.GetLeader] จะไดรับการสนับสนุนจากประชาชนอยางทวมทน แต [From.GetLeader] ก็ปฏิเสธที่จะสละตําแหนงนายกรัฐมนตรีแหงสาธารณรัฐ โดยประกาศวาเขาจะไมมีวันยอมจํานนตอการแบล็กเมลหรือยกประเทศใหแกพวกคนทรยศและโจร [From.GetLeader] แสดงออกชัดเจนวาเขาจะไมขยับออกจากตําแหนง"
 wtt_take_national_leadership.3.a: "ถาเชนนั้นเราจะยึดมันดวยกําลัง!"

