 early_ship_hull_carrier_desc: "การดัดแปลงตัวเรือเกาชวยใหทดลองการบินนาวีไดในราคาถูก เพื่อสั่งสมประสบการณในการสรางและใชงานเรือบรรทุกเครื่องบิน เรือเหลานี้จะมีขีดความสามารถดอยกวาเรือบรรทุกเครื่องบินที่สรางขึ้นโดยเฉพาะ แตสรางไดรวดเร็วกวามาก"
 cruiser_submarines: "ตัวเรือเรือดํานํ้าลาดตระเวน"
 midget_submarines: "ตัวเรือเรือดํานํ้าขนาดจิ๋ว"
 fleet_submarines: "เรือดํานํ้าประจํากองเรือ"
 coastal_defense_ships: "เรือปองกันชายฝง"
 pre_dreadnoughts: "เรือยุคกอนเดรดนอต"
 basic_ship_hull_heavy: "ตัวเรือหนักป 1936"
 basic_ship_hull_heavy_short: "ตัวเรือหนักป 1936"
 basic_ship_hull_cruiser: "ตัวเรือลาดตระเวนป 1936"
 basic_fire_control_system: "ระบบควบคุมการยิงพื้นฐาน"
 basic_fire_control_system_desc: "การยิงทั้งหมดของปนเรือถูกควบคุมจากตําแหนงศูนยกลาง ทําใหกลุมกระสุนตกใกลกันมากขึ้นและเพิ่มความแมนยํา"
 improved_fire_control_system: "ระบบควบคุมการยิงปรับปรุง"
 improved_fire_control_system_desc: "ดวยการปอนเสนทาง ความเร็ว และระยะทางของเปาหมาย เครื่องคํานวณเชิงกลจะคาดการณไดอยางแมนยําวาเปาหมายจะอยูที่ใดเมื่อการยิงชุดตอไปพรอม"
 advanced_fire_control_system: "ระบบควบคุมการยิงขั้นสูง"
 advanced_fire_control_system_desc: "เครื่องคํานวณเชิงกลขนาดใหญและซับซอนที่ติดตามขอมูลนําเขาจํานวนมากทั้งเกี่ยวกับเปาหมาย เรือที่ทําการยิง ตลอดจนสภาพอากาศและสภาพทะเล ชวยใหคํานวณวิถีกระสุนไดแมนยํามาก"
 sonar: "โซนารแบบตั้งรับ"
 sonar_desc: "ชุดไฮโดรโฟนพื้นฐานชวยใหติดตามเปาหมายใตนํ้าไดโดยตรวจจับเสียงที่เปาหมายเหลานั้นสรางขึ้น\n\nการติดตั้งโมดูลนี้ใน§Yชองอิเล็กทรอนิกส§!บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!จะชวยใหตรวจพบ§Yเรือดํานํ้า§!ขาศึก"
 improved_sonar: "โซนารแบบเชิงรุก"
 improved_sonar_desc: "ดวยการใชคลื่นเสียงที่มอดูเลต ระบบนี้สามารถวัดทิศทางและระยะทางของเปาหมายใตนํ้าไดอยางแมนยํา\n\nการติดตั้งโมดูลนี้ใน§Yชองอิเล็กทรอนิกส§!บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!จะชวยใหตรวจพบ§Yเรือดํานํ้า§!ขาศึก"
 advanced_sonar: "โซนารขั้นสูง"
 advanced_sonar_desc: "แถวลําดับไฮโดรโฟนที่ปรับปรุงแลวและเทคนิคการสงสัญญาณโซนารเชิงรุก ชวยเพิ่มความแมนยําและระยะในการตรวจจับเรือดํานํ้าขาศึกอยางมีนัยสําคัญ \n\nการติดตั้งโมดูลนี้ใน§Yชองอิเล็กทรอนิกส§!บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!จะชวยใหตรวจพบ§Yเรือดํานํ้า§!ขาศึก"
 modern_sonar: "โซนารสมัยใหม"
 modern_sonar_desc: "ความกาวหนาดานการกรองสัญญาณและการสแกนแบบกําหนดทิศทางทําใหโซนารรุนใหมนี้มีความแมนยําหาที่เปรียบไมได ชวยใหเราลาเรือดํานํ้าขาศึกไดอยางแมนยําและรายกาจ \n\nการติดตั้งโมดูลนี้ใน§Yชองอิเล็กทรอนิกส§!บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!จะชวยใหตรวจพบ§Yเรือดํานํ้า§!ขาศึก"
 smoke_generator: "เครื่องสรางมานควัน"
 smoke_generator_desc: "การดัดแปลงเล็กนอยที่เครื่องยนตและปลองควันของเรือขนาดเบาและขนาดกลาง ทําใหสามารถปลอยควันจํานวนมากเพื่อหลบเลี่ยงหรือตัดการปะทะกับขาศึกได"
 depth_charges_advice_tt: "\nการติดตั้งโมดูล§Yระเบิดนํ้าลึก§!บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหโจมตี§Yเรือดํานํ้า§!ขาศึกได"
 sonar_advice_tt: "\nการติดตั้งโมดูล§Yโซนาร§!บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหตรวจพบ§Yเรือดํานํ้า§!ขาศึกได"
 basic_depth_charges: "ระเบิดนํ้าลึกพื้นฐาน"
 basic_depth_charges_desc: "ภาชนะบรรจุวัตถุระเบิดอยางงายพรอมชนวนไวตอแรงดัน ซึ่งจะระเบิดเมื่อถึงความลึกที่ตั้งไว \n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหโจมตี§Yเรือดํานํ้า§!ขาศึกได"
 improved_depth_charges: "เครื่องยิงระเบิดนํ้าลึก"
 improved_depth_charges_desc: "อุปกรณเชิงกลอยางงายที่ขวางระเบิดนํ้าลึกออกไปในระยะที่กําหนดจากตัวเรือ หมายความวาเรือพิฆาตไมจําเปนตองแลนผานเหนือเปาหมายโดยตรงเพื่อโจมตีอีกตอไป \n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหโจมตี§Yเรือดํานํ้า§!ขาศึกได"
 advanced_depth_charges: "ปนครกระเบิดนํ้าลึก"
 advanced_depth_charges_desc: "ปนครกบนเรือพิฆาตสามารถยิงระเบิดออกไปไดไกลกวามาก ทําใหเรือรักษาการติดตอทางโซนารกับเรือดํานํ้าไดตลอดการโจมตี และเพิ่มความแมนยําไดอยางมาก\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหโจมตี§Yเรือดํานํ้า§!ขาศึกได"
 modern_depth_charges: "ปนครกระเบิดนํ้าลึกปรับปรุง"
 modern_depth_charges_desc: "ดินขับที่มากขึ้นทําใหยิงระเบิดนํ้าลึกเต็มรูปแบบที่ตั้งความลึกไวเฉพาะไปยังเรือดํานํ้าไดจากระยะคอนขางไกล\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!จะชวยใหโจมตี§Yเรือดํานํ้า§!ขาศึกได"
 improved_seaplane_tender: "ระบบสนับสนุนเครื่องบินทะเลปรับปรุง"
 improved_seaplane_tender_desc: "ความกาวหนาดานการเติมเสบียงกลางทะเลและเทคโนโลยีปนจั่นเก็บกูชวยเพิ่มประสิทธิภาพการปฏิบัติการของเครื่องบินทะเล \n\nการติดตั้งโมดูล§Yระบบสนับสนุนเครื่องบินทะเล§!บน§Yเรือพิฆาต§!ชวยเพิ่มความสามารถในการตรวจจับเรือขาศึก"
 seaplane_tender_advice_tt: "\nการติดตั้งโมดูล§Yระบบสนับสนุนเครื่องบินทะเล§!บน§Yเรือพิฆาต§!ชวยเพิ่มความสามารถในการตรวจจับเรือขาศึก"
 improved_airplane_launcher: "เครื่องดีดสงเครื่องบินปรับปรุง"
 improved_airplane_launcher_desc: "กลไกนิวแมติกที่ปรับปรุงแลวชวยใหดีดสงเครื่องบินที่ใหญกวามากไดดวยเครื่องดีด ซึ่งเพิ่มรัศมีการคนหา \n\nการติดตั้งโมดูลนี้บน§Yเรือลาดตระเวน§! §Yเรือหนัก§! หรือ§Yเรือดํานํ้า§!แบบพิเศษ ชวยเพิ่มความสามารถในการตรวจจับเรือขาศึก"
 airplane_launcher_advice_tt: "\nการติดตั้งโมดูล§Yเครื่องดีด§!บน§Yเรือลาดตระเวน§! §Yเรือหนัก§! หรือ§Yเรือดํานํ้า§!แบบพิเศษ ชวยเพิ่มความสามารถในการตรวจจับเรือขาศึก"
 cruiser_armor_advice_tt: "\nการติดตั้งโมดูล§Yเกราะ§!ที่ดีขึ้นบน§Yเรือลาดตระเวน§!ชวยเพิ่มความสามารถในการทนความเสียหาย"
 heavy_armor_advice_tt: "\nการติดตั้งโมดูล§Yเกราะ§!ที่ดีขึ้นบน§Yเรือหนัก§!ชวยเพิ่มความสามารถในการทนความเสียหาย §Yเรือประจัญบาน§!และ§Yเรือลาดตระเวนประจัญบาน§!จําแนกตาม§Yรูปแบบเกราะ§!ที่ตางกัน โดยเรือลาดตระเวนประจัญบานมักมีเกราะที่ดอยกวา"
 basic_cruiser_armor_scheme: "รูปแบบเกราะเรือลาดตระเวนพื้นฐาน"
 basic_cruiser_armor_scheme_desc: "รูปแบบเกราะที่เลียนแบบการแบงเกราะสายพานและเกราะดาดฟาของเรือหลัก และใหการปองกันบางสวนตอสะเก็ดระเบิดและปนขนาดลํากลองเล็ก\n\nการติดตั้งโมดูลนี้บน§Yเรือลาดตระเวน§!ชวยเพิ่มความสามารถใน§Yการทนความเสียหายจากขาศึก§! แตก็§Rลด§!§Yความเร็ว§!ของเรือดวย"
 improved_cruiser_armor_scheme: "รูปแบบเกราะเรือลาดตระเวนแบบสายพานเอียง"
 improved_cruiser_armor_scheme_desc: "ดวยการวางเกราะสายพานใหเอียง เกราะที่มีนํ้าหนักและความหนาเทาเดิมจะเจาะทะลุไดยากขึ้นมาก\n\nการติดตั้งโมดูลนี้บน§Yเรือลาดตระเวน§!ชวยเพิ่มความสามารถใน§Yการทนความเสียหายจากขาศึก§! แตก็§Rลด§!§Yความเร็ว§!ของเรือดวย"
 advanced_cruiser_armor_scheme: "รูปแบบเกราะเรือลาดตระเวนแบบทั้งหมดหรือไมมีเลย"
 advanced_cruiser_armor_scheme_desc: "รูปแบบนี้มุงปกปองเฉพาะสวนที่สําคัญที่สุดของเรือ โดยละเลยสวนที่ไมสําคัญ \n\nการติดตั้งโมดูลนี้บน§Yเรือลาดตระเวน§!ชวยเพิ่มความสามารถใน§Yการทนความเสียหายจากขาศึก§! แตก็§Rลด§!§Yความเร็ว§!ของเรือดวย"
 basic_heavy_armor_scheme: "รูปแบบเกราะแบบสายพานเอียง"
 basic_heavy_armor_scheme_desc: "ดวยการวางเกราะสายพานใหเอียง เกราะที่มีนํ้าหนักและความหนาเทาเดิมจะเจาะทะลุไดยากขึ้นมาก\n\nการติดตั้งโมดูลนี้บน§Yเรือหนัก§!ชวยเพิ่มความสามารถใน§Yการทนความเสียหายจากขาศึก§! §Yเรือประจัญบาน§!และ§Yเรือลาดตระเวนประจัญบาน§!จําแนกตาม§Yรูปแบบเกราะ§!ที่ตางกัน"
 improved_heavy_armor_scheme: "รูปแบบเกราะแบบทั้งหมดหรือไมมีเลย"
 improved_heavy_armor_scheme_desc: "รูปแบบนี้มุงปกปองเฉพาะสวนที่สําคัญที่สุดของเรือ โดยละเลยสวนที่ไมสําคัญ\n\nการติดตั้งโมดูลนี้บน§Yเรือหนัก§!ชวยเพิ่มความสามารถใน§Yการทนความเสียหายจากขาศึก§! §Yเรือประจัญบาน§!และ§Yเรือลาดตระเวนประจัญบาน§!จําแนกตาม§Yรูปแบบเกราะ§!ที่ตางกัน"
 torpedo_advice_tt: "\nการติดตั้ง§Yทอยิงตอรปโด§!บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!ชวยใหสรางความเสียหายอยางมากแก§Yเรือหลัก§!ของขาศึกใน§Yแนวรบหลัก§!ได หากสามารถเอาชนะ§Yกลุมเรือคุมกัน§!ของขาศึกได"
 basic_torpedo: "ตอรปโดพื้นฐาน"
 basic_torpedo_desc: "อาวุธขับเคลื่อนดวยตนเองพรอมหัวรบระเบิด ซึ่งแลนไปตามเสนทางที่กําหนดไวลวงหนาจนกระทบเปาหมายใตแนวนํ้า\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!ชวยใหสรางความเสียหายอยางมากแก§Yเรือหลัก§!ของขาศึก"
 magnetic_detonator: "ชนวนแมเหล็ก"
 magnetic_detonator_desc: "ชนวนแบบใหมตรวจจับการเปลี่ยนแปลงของสนามแมเหล็กโลกเมื่อตอรปโดแลนผานใตเปาหมาย การระเบิดใตตัวเรือโดยตรงสรางความเสียหายมากกวามาก และมักทําใหกระดูกงูเรือของเปาหมายหัก จนจมลงทันที"
 homing_torpedo: "ตอรปโดนําวิถี"
 homing_torpedo_desc: "ดวยเครื่องตรวจจับเสียง ตอรปโดสามารถพุงเขาหาแหลงเสียงที่ใหญที่สุดขางหนา ซึ่งมักจะเปนเปาหมาย"
 electric_torpedo: "ตอรปโดไฟฟา"
 electric_torpedo_desc: "แทนที่จะทิ้งรองรอยฟองอากาศที่ตรวจพบไดงาย ตอรปโดที่ใชมอเตอรไฟฟาแทบจะมองไมเห็นจนกวาจะกระทบเปา ซึ่งหมายความวาไมมีรองรอยยอนกลับไปยังเรือดํานํ้าที่ยิงดวย"
 improved_ship_torpedo_launcher: "ทอยิงตอรปโดประจําเรือปรับปรุง"
 improved_ship_torpedo_launcher_desc: "มอเตอรที่แรงขึ้นทําใหติดตั้งทอไดมากขึ้นในแทนเดียว และหันเล็งเปาไดเร็วขึ้น\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!ชวยใหสรางความเสียหายอยางมากแก§Yเรือหลัก§!ของขาศึก"
 advanced_ship_torpedo_launcher: "ทอยิงตอรปโดประจําเรือขั้นสูง"
 advanced_ship_torpedo_launcher_desc: "ทอที่มีเสนผานศูนยกลางใหญขึ้นรองรับตอรปโดขนาดใหญขึ้นที่มีหัวรบหนักขึ้น\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!ชวยใหสรางความเสียหายอยางมากแก§Yเรือหลัก§!ของขาศึก"
 modern_ship_torpedo_launcher: "ทอยิงตอรปโดประจําเรือสมัยใหม"
 modern_ship_torpedo_launcher_desc: "ประจุอากาศอัดกําลังสูงทําใหยิงตอรปโดที่หนักขึ้นดวยความเร็วที่สูงขึ้นได\n\nการติดตั้งโมดูลนี้บน§Yเรือเบา§!หรือ§Yเรือลาดตระเวน§!ชวยใหสรางความเสียหายอยางมากแก§Yเรือหลัก§!ของขาศึก"
 snorkel_advice_tt: "\nการติดตั้ง§Yทอหายใจ§!บน§Yเรือดํานํ้า§!ชวยลด§Yการมองเห็น§!ไดอยางมาก ทําใหเรือขาศึกมองเห็นและเขาปะทะไดยากขึ้น"
 basic_submarine_snorkel: "ทอหายใจเรือดํานํ้าพื้นฐาน"
 basic_submarine_snorkel_desc: "ทออากาศอยางงายที่ตอจากหองเครื่องยนตไปยังหอบังคับการ เมื่อยืดออกจะชวยใหเรือดํานํ้าเดินเครื่องยนตและชารจแบตเตอรี่ไดขณะยังดําอยูใตนํ้า\n\nการติดตั้งโมดูลนี้บน§Yเรือดํานํ้า§!ชวยลด§Yการมองเห็น§! ทําใหตรวจจับไดยากขึ้น"
 improved_submarine_snorkel: "ทอหายใจเรือดํานํ้าปรับปรุง"
 improved_submarine_snorkel_desc: "แบบที่ปรับปรุงแลวปองกันไมใหนํ้าถูกดูดเขาเครื่องยนต และยังลดรองรอยเรดารของหัวทอหายใจดวย\n\nการติดตั้งโมดูลนี้บน§Yเรือดํานํ้า§!ชวยลด§Yการมองเห็น§! ทําใหตรวจจับไดยากขึ้น"
 light_battery_advice_tt: "\n\nการติดตั้งโมดูล§Yปนใหญเรือขนาดเบา§!บน§Yเรือเบา§!และ§Yเรือลาดตระเวน§!ชวยเพิ่ม§Yการโจมตีดวยปนเบา§! ซึ่งชวยในการทําลาย§Yเรือคุมกัน§!ของขาศึก §Yปนใหญเรือขนาดเบา§!มักทําไดไมดีนักเมื่อเจอเรือหุมเกราะอยาง§Yเรือลาดตระเวน§!และ§Yเรือหนัก§!"
 medium_battery_advice_tt: "\n\nการติดตั้งโมดูล§Yปนใหญเรือขนาดกลางเบา§!หรือ§Yปนใหญเรือขนาดกลาง§!บน§Yเรือลาดตระเวน§!ชวยเพิ่ม§Yการโจมตีดวยปนเบา§!หรือ§Yการโจมตีดวยปนหนัก§! ทําใหสามารถรบกับ§Yเรือคุมกัน§!หรือ§Yเรือหลัก§!ของขาศึกได การติดตั้ง§Yปนใหญเรือขนาดกลาง§!ใดๆ จะจัดใหเรือเปน§Yเรือลาดตระเวนหนัก§! สวนการติดตั้งเพียง§Yปนใหญเรือขนาดกลางเบา§!จะจัดใหเรือเปน§Yเรือลาดตระเวนเบา§!"
 heavy_battery_advice_tt: "\n\nการติดตั้งโมดูล§Yปนใหญเรือขนาดหนัก§!ชวยเพิ่ม§Yการโจมตีดวยปนหนัก§!ของ§Yเรือหนัก§! ทําใหสามารถเขาปะทะและทําลาย§Yเรือหลัก§!ของขาศึกได §Yปนใหญเรือขนาดหนัก§!มักทําไดไมดีนักเมื่อเจอเรือขนาดเล็กกวาอยาง§Yเรือเบา§!และ§Yเรือลาดตระเวนเบา§!"
 basic_battery: "การยิงปนเรือ"
 basic_battery_desc: "แบบพื้นฐานของกลไกการหันและการยกปนเรือ"
 basic_light_battery: "ปนใหญเรือขนาดเบาพื้นฐาน"
 basic_light_battery_desc: "แทนปนแบบเปดที่ขับเคลื่อนดวยกําลังสําหรับปนขนาดลํากลองเล็ก ใชบนเรือขนาดเล็ก\n\nการติดตั้งโมดูลนี้ชวยเพิ่ม§Yการโจมตีดวยปนเบา§! ซึ่งชวยในการเขาปะทะ§Yเรือคุมกัน§!ของขาศึก"
 improved_light_battery: "ปนใหญเรือขนาดเบาแบบปรับปรุง"
 improved_light_battery_desc: "แทนปนขนาดลํากลองเล็กแบบปดที่ขับเคลื่อนดวยกําลัง ชวยปกปองพลประจําปนจากสภาพอากาศและสะเก็ดกระสุนไดระดับหนึ่ง \n\nการติดตั้งโมดูลนี้จะเพิ่ม §Yการโจมตีดวยปนเบา§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก"
 advanced_light_battery: "ปนใหญเรือขนาดเบาขั้นสูง"
 advanced_light_battery_desc: "แทนปนแฝดขั้นสูงใหอํานาจการยิงที่มากขึ้นอยางมีนัยสําคัญภายใตการปองกันดวยเกราะ\n\nการติดตั้งโมดูลนี้จะเพิ่ม §Yการโจมตีดวยปนเบา§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก"
 basic_light_shell: "กระสุนกึ่งเจาะเกราะขนาดลํากลองเล็ก"
 basic_light_shell_desc: "กระสุนนี้เปนการประนีประนอมระหวางประสิทธิภาพการเจาะเกราะกับอํานาจระเบิด สรางความเสียหายไดมากขึ้นอยางมากหลังจากเจาะทะลุเกราะบางของเรือเบา"
 improved_light_shell: "กระสุนเจาะเกราะขนาดลํากลองเล็ก"
 improved_light_shell_desc: "กระสุนเจาะเกราะที่แทจริงสําหรับปนขนาดลํากลองเล็ก ทําใหเรือพิฆาตและเรือเบาอื่น ๆ มีโอกาสตอกรกับฝายตรงขามที่หุมเกราะได"
 basic_medium_battery: "ปนใหญเรือขนาดกลางพื้นฐาน"
 basic_medium_battery_desc: "ปอมปนขับเคลื่อนดวยกําลังที่มีปนขนาดลํากลองกลางสองหรือสามกระบอก สําหรับใชบนเรือลาดตระเวน \n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดกลางเบา§! จะเพิ่ม §Yการโจมตีดวยปนเบา§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก การติดตั้งโมดูล §Yปนใหญเรือขนาดกลาง§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ซึ่งชวยในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 improved_medium_battery: "ปนใหญเรือขนาดกลางแบบปรับปรุง"
 improved_medium_battery_desc: "การจัดวางปอมปนที่ปรับปรุงใหมชวยใหบรรจุกระสุนไดเร็วขึ้น ขณะที่เกราะที่ดีขึ้นชวยเพิ่มความอยูรอด \n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดกลางเบา§! จะเพิ่ม §Yการโจมตีดวยปนเบา§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก การติดตั้งโมดูล §Yปนใหญเรือขนาดกลาง§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ซึ่งชวยในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 advanced_medium_battery: "ปนใหญเรือขนาดกลางขั้นสูง"
 advanced_medium_battery_desc: "ดวยการผสานระบบบรรจุกระสุนดวยกําลังและระบบควบคุมการเล็งระยะไกล เรือลาดตระเวนสมัยใหมจึงสามารถทําอัตราการยิงและความแมนยําที่เคยถือวาเปนไปไมได\n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดกลางเบา§! จะเพิ่ม §Yการโจมตีดวยปนเบา§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก การติดตั้งโมดูล §Yปนใหญเรือขนาดกลาง§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ซึ่งชวยในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 basic_medium_shell: "กระสุนขนาดกลางเจาะเกราะแบบมีหมวกครอบ"
 basic_medium_shell_desc: "ดวยการติดหมวกครอบลดแรงตาน กระสุนจะมีรูปทรงตามหลักอากาศพลศาสตรมากขึ้น โดยยังคงประสิทธิภาพการเจาะเกราะไวได"
 improved_medium_shell: "กระสุนกึ่งเจาะเกราะขนาดลํากลองกลาง"
 improved_medium_shell_desc: "กระสุนนี้เปนการประนีประนอมระหวางประสิทธิภาพการเจาะเกราะกับอํานาจระเบิด สรางความเสียหายไดมากขึ้นอยางมากหลังจากเจาะทะลุเกราะบางของเรือเบา"
 basic_heavy_battery: "ปนใหญเรือขนาดหนักพื้นฐาน"
 basic_heavy_battery_desc: "ปอมปนขนาดมหึมาที่บรรจุปนขนาดใหญไวใตเกราะหนา \n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดหนัก§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ของเรือ ชวยเพิ่มประสิทธิภาพในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 improved_heavy_battery: "ปนใหญเรือขนาดหนักแบบปรับปรุง"
 improved_heavy_battery_desc: "เครื่องกระทุงกระสุนแบบใชกําลังชวยเพิ่มความเร็วในการบรรจุกระสุนของปนหนัก ขณะที่ประตูกันประกายไฟอัตโนมัติชวยเพิ่มความปลอดภัย \n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดหนัก§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ของเรือ ชวยเพิ่มประสิทธิภาพในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 advanced_heavy_battery: "ปนใหญเรือขนาดหนักขั้นสูง"
 advanced_heavy_battery_desc: "กลไกลดแรงสะทอนที่ปรับปรุงใหมและขดลวดหนวงเวลาชวยลดการรบกวนกันของกระสุนระหวางการเคลื่อนที่ และเพิ่มความแมนยําอยางมาก \n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดหนัก§! จะเพิ่ม §Yการโจมตีดวยปนหนัก§! ของเรือ ชวยเพิ่มประสิทธิภาพในการตอสูกับ §Yเรือหลัก§! ของขาศึก"
 basic_heavy_shell: "กระสุนเจาะเกราะแบบมีหมวกครอบ"
 basic_heavy_shell_desc: "ดวยการติดหมวกครอบลดแรงตาน กระสุนจะมีรูปทรงตามหลักอากาศพลศาสตรมากขึ้น โดยยังคงประสิทธิภาพการเจาะเกราะไวได"
 improved_heavy_shell: "กระสุนเจาะเกราะหนักพิเศษ"
 improved_heavy_shell_desc: "กระสุนมหึมาเหลานี้หนักกวาหนึ่งตันเปนอยางมาก พุงเขาปะทะดวยพลังที่ไมเคยมีมากอน และเปนภัยคุกคามรายแรงแมแตกับเกราะที่หนาที่สุด"
 secondary_battery_advice_tt: "\n§Yปนใหญรอง§! ชวยให §Yเรือลาดตระเวน§! และ §Yเรือหนัก§! สามารถโจมตี §Yเรือคุมกัน§! ของขาศึกเปนเปาหมายรองได ขณะที่สรางความเสียหายแกเปาหมายอื่นไปพรอมกัน"
 basic_secondary_battery: "ปนใหญรองแบบติดในปอมขางลํา"
 basic_secondary_battery_desc: "ปนขนาดเล็กเหลานี้ติดตั้งในชองเปดตามแนวลําเรือ ชวยปองกันเรือจากเรือขนาดเล็กกวาไดบาง แตมีมุมยิงที่จํากัด\n\nการติดตั้งโมดูล §Yปนใหญรอง§! จะทําให §Yเรือลาดตระเวน§!, §Yเรือบรรทุกเครื่องบิน§! หรือ §Yเรือหนัก§! ไดรับ §Yการโจมตีดวยปนเบา§! เล็กนอย และสามารถโจมตีเปาหมายที่สองได"
 improved_secondary_battery: "ปนใหญรองแบบปอมปน"
 improved_secondary_battery_desc: "ดวยการติดตั้งปนรองในปอมปนที่ขับเคลื่อนดวยกําลัง ทําใหมีมุมยิงที่กวางขึ้นมาก แลกกับนํ้าหนักที่มากขึ้นและเสถียรภาพที่ลดลงในทะเลคลื่นแรง\n\nการติดตั้งโมดูล §Yปนใหญรอง§! จะทําให §Yเรือลาดตระเวน§!, §Yเรือบรรทุกเครื่องบิน§! หรือ §Yเรือหนัก§! ไดรับ §Yการโจมตีดวยปนเบา§! เล็กนอย และสามารถโจมตีเปาหมายที่สองได"
 damage_control_1: "การฝกดับเพลิง"
 damage_control_1_desc: "ลูกเรือทุกคน ตั้งแตผูบังคับการเรือไปจนถึงพลทหารเรือธรรมดา ตองสามารถชวยควบคุมและดับไฟบนเรือได"
 damage_control_2: "ทอนํ้าดับเพลิงหลักแยกสวน"
 damage_control_2_desc: "ดวยการแยกทอนํ้าหลักรอบลําเรือ โอกาสที่การถูกยิงเพียงครั้งเดียวจะทําใหเรือไมสามารถดับไฟไดเลยจะลดลงอยางมาก"
 damage_control_3: "เครื่องสูบนํ้าฉุกเฉินพลังงานดีเซล"
 damage_control_3_desc: "เนื่องจากเครื่องสูบนํ้าขนาดใหญมักพึ่งพากําลังจากเครื่องยนตหลัก การถูกยิงเพียงครั้งเดียวที่ไมรุนแรงนักในหองเครื่องอาจทําใหเรือไมสามารถลอยลําอยูได"
 fire_control_methods_1: "การยิงครอมเปา"
 fire_control_methods_1_desc: "ในการยิงใหถูกเปา ขั้นแรกคือการยิงครอมเปาดวยการยิงปนทีละไมกี่กระบอก จนกวาจุดตกของกระสุนจะอยูทั้งสองฝงของเปาหมาย"
 fire_control_methods_2: "การยิงแบบขั้นบันได"
 fire_control_methods_2_desc: "แทนที่จะยิงขามเปาหมายและคลาดการสังเกตจุดตกที่อยูหลังเรือขาศึก จะจงใจยิงใหตกกอนถึงเปาหมาย แลววัดระยะระหวางจุดตกกับเปาหมายเพื่อหาระยะยิง"
 fire_control_methods_3: "สียอมกระสุน"
 fire_control_methods_3_desc: "การเติมถุงสีขนาดเล็กลงในกระสุนเมื่อยิงออกไปจะทําใหจุดตกรอบเปาหมายมีสี และชวยใหเรือหลายลําโจมตีเปาหมายเดียวกันไดโดยไมสับสนกับจุดตกของกันและกัน"
 fuel_silos: "การกักเก็บเชื้อเพลิง"
 fuel_silos_desc: "การกักเก็บเชื้อเพลิงปริมาณมากตองอาศัยระบบถัง ทอ และวาลวที่ซับซอน เพื่อใหมั่นใจวาเชื้อเพลิงทั้งปลอดภัยและพรอมใชงานไดทันที"
 fuel_refining: "การกลั่นเชื้อเพลิง I"
 fuel_refining_desc: "ความกาวหนาในการแตกตัวทางเคมีชวยใหไดผลผลิตเชื้อเพลิงเบาจากนํ้ามันมากขึ้น"
 fuel_refining2: "การกลั่นเชื้อเพลิง II"
 fuel_refining2_desc: "การวางผังโรงกลั่นที่ดีขึ้นชวยลดการสูญเสียเชื้อเพลิง"
 fuel_refining3: "การกลั่นเชื้อเพลิง III"
 fuel_refining3_desc: "วิธีการนํากลับมาใชใหมที่ปรับปรุงขึ้นชวยใหกลั่นเชื้อเพลิงจากผลพลอยไดได"
 fuel_refining4: "การกลั่นเชื้อเพลิง IV"
 fuel_refining4_desc: "พัฒนาการใหมดานวิศวกรรมเคมีชวยใหกลั่นเชื้อเพลิงจากแหลงใหม ๆ ได"
 fuel_refining5: "การกลั่นเชื้อเพลิง V"
 fuel_refining5_desc: "การใชวิธีการใหมและผังที่ปรับปรุงในการกอสรางโรงกลั่นชวยเพิ่มกําลังการผลิตอยางมาก พรอมทั้งลดการสูญเสีย"
 scout_plane1: "เครื่องบินลาดตระเวน I"
 scout_plane1_desc: "การรวบรวมขาวกรองเกี่ยวกับการเคลื่อนพลของขาศึกและการรายงานการวางกําลังทางเรือของขาศึก เปนภารกิจดั้งเดิมของเครื่องบินนับตั้งแตถูกนํามาใชครั้งแรกในมหาสงคราม และยังคงเปนภารกิจที่สําคัญ"
 scout_plane2: "เครื่องบินลาดตระเวน II"
 scout_plane2_desc: "ดวยการพัฒนาเครื่องบินเฉพาะทางสําหรับการตรวจการณทางอากาศและการลาดตระเวนระยะไกล เราจะมั่นใจไดวาเราจะไดและรักษาภาพที่แมนยําของเจตนาและขีดความสามารถของฝายตรงขามไวได"
 SURRENDER_REDUCTION_TOOLTIP: "ความรวมมือใน $COUNTRY|H$ จะลดระดับการยอมจํานนของพวกเขาลง $VALUE|+%.0$"
 COLLABORATION_EFFECTS_TOOLTIP: "คุณมีความรวมมือ $COLLABORATION|+%.0$ ใน $COUNTRY|H$ ซึ่งจะลดระดับการยอมจํานนของพวกเขาลง $SURRENDER|+%.0$ และจะใหการยอมรับปกครอง $COMPLIANCE|+%.0$ เมื่อขาศึกยอมจํานน ซึ่งจะใชในการปลดล็อกตัวปรับคาการยอมรับปกครองเพิ่มเติม"
 COLLABORATION_EFFECTS_OTHER_SIDE_TOOLTIP: "$OTHER_COUNTRY|H$ มีความรวมมือ $COLLABORATION|+%.0$ ใน $COUNTRY|H$ ซึ่งจะลดระดับการยอมจํานนของ $COUNTRY|H$ ลง $SURRENDER|+%.0$ และจะใหการยอมรับปกครอง $COMPLIANCE|+%.0$ เมื่อขาศึกยอมจํานน ซึ่งจะใชในการปลดล็อกตัวปรับคาการยอมรับปกครองเพิ่มเติม"
 train_tech: "รถไฟและทางรถไฟ"
