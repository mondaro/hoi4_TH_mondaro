 secret_weapons_folder_desc: "อาวุธมหัศจรรย ผลผลิตจากวิทยาศาสตรอันบาคลั่ง"
 mobile_warfare: "สงครามเคลื่อนที่"
 mobile_warfare_desc: "สงครามเคลื่อนที่มุงเนนความเร็วและการดําเนินกลยุทธเพื่อตัดขาดและทําลายการจัดระเบียบของกองกําลังขาศึก\n\n"
 delay: "การถวงเวลา"
 delay_desc: "แมในยามที่ไมอาจเอาชนะการรบได การชะลอการรุกของฝายโจมตีดวยการซุมโจมตีและยุทธวิธีถวงเวลาก็อาจเปนประโยชน"
 elastic_defence: "การปองกันแบบยืดหยุน"
 elastic_defence_desc: "แทนที่จะทุมกําลังทั้งหมดไวที่แนวหนา การปองกันแบบยืดหยุนจะสรางแนวปองกันที่ 'ลึก' กวา ทําใหฝายตั้งรับมีเวลาตอบสนองและตีโตมากขึ้น ขณะที่ฝายโจมตีกระจายกําลังและติดหลม"
 mobile_infantry: "ทหารราบเคลื่อนที่เร็ว"
 mobile_infantry_desc: "ทหารราบทั่วไปมักชาเกินกวาจะตามทัน ตอบโต หรือหลบหนีกองกําลังยานเกราะที่เคลื่อนที่รวดเร็ว ทางออกคือการมุงเนนทหารราบยานยนตหรือทหารราบยานเกราะลําเลียงพลที่สามารถตามจังหวะของสงครามสมัยใหมไดทัน\n\n"
 mass_motorization: "การปรับเปนยานยนตครั้งใหญ"
 mass_motorization_desc: "ใหความสําคัญกับกองกําลังยานยนตมากยิ่งขึ้น"
 mechanised_offensive: "การรุกดวยยานเกราะลําเลียงพล"
 mechanised_offensive_desc: "กองกําลังยานยนตนั้นดีอยูแลว แตการจะนําการรุก เราตองมีทหารราบที่สามารถเขาสูสนามรบในยานลําเลียงหุมเกราะซึ่งชวยปกปองพวกเขาและบรรทุกอาวุธหนักได"
 armored_spearhead: "หัวหอกยานเกราะ"
 armored_spearhead_desc: "เพื่อใชรถถังใหเต็มศักยภาพ จะผูกมัดพวกมันไวกับการสนับสนุนทหารราบไมได แตตองจัดเปนหนวยอิสระที่เคลื่อนที่รวดเร็วและเปนหัวหอกในการโจมตี\n\n"
 schwerpunk: "ชแวรพุงค"
 schwerpunk_desc: "ในทุกปฏิบัติการ จะตองระบุชแวรพุงค หรือจุดศูนยถวง ใหได แลวรวมกําลังสูงสุดเพื่อเอาชนะ ณ จุดนั้น"
 blitzkrieg: "บลิทซครีก"
 blitzkrieg_desc: "บลิทซครีกหมายถึงยุทธศาสตรที่กองกําลังยานเกราะซึ่งเคลื่อนที่รวดเร็ว โดยมีทหารราบเคลื่อนที่เร็วและการสนับสนุนทางอากาศคอยหนุน บุกทะลวงแนวขาศึกเพื่อทําใหขาศึกระสํ่าระสายและโอบลอมไว"
 kampfgruppe: "คัมพฟกรุพเพอ"
 kampfgruppe_desc: "คัมพฟกรุพเพอคือหนวยรบเฉพาะกิจที่จัดตั้งขึ้นชั่วคราวเพื่อปฏิบัติภารกิจเฉพาะอยาง"
 firebrigades: "หนวยดับไฟ"
 firebrigades_desc: "'หนวยดับไฟ' คือกองกําลังที่ถูกระดมรวบรวมอยางเรงดวนเพื่อรับมือกับการเจาะแนวของขาศึกหรือสถานการณวิกฤตอื่นๆ\n\n"
 backhand_blow: "การตีกลับหลังมือ"
 backhand_blow_desc: "แทนที่จะตอสูแยงชิงพื้นที่ทุกตารางนิ้ว เราจะหลีกเลี่ยงการปะทะกับการรุกเจาะของขาศึกจนกวาพวกมันจะยืดแนวออกไปมากเกินไป เมื่อถึงตอนนั้นก็สามารถตัดขาดและทําลายพวกมันดวยการตีโต"
 modern_blitzkrieg: "บลิทซครีกสมัยใหม"
 modern_blitzkrieg_desc: "จุดสูงสุดของสงครามเคลื่อนที่ บลิทซครีกสมัยใหมผสานความกาวหนาทางเทคโนโลยีลาสุดทั้งหมดเขากับบทเรียนจากหลักนิยมกอนหนา"
 volkssturm: "ฟอลคสชตวรม"
 volkssturm_desc: "ฟอลคสชตวรม หรือกองอาสาสมัครประชาชน ประกอบดวยผูชายที่แกเกินไป เด็กเกินไป หรือไมเหมาะสมกับการรับราชการทหารตามปกติดวยเหตุอื่น\n\n"
 nd_conscription: "การเกณฑทหารแบบไมเลือกหนา"
 nd_conscription_desc: "แมแตผูปวยและผูพิการก็ตองถูกเกณฑ จะไมมีสิ่งที่เรียกวาพลเรือนอีกตอไป"
 werwolf_guerillas: "กองโจรแวรวูลฟ"
 werwolf_guerillas_desc: "แวรวูลฟคือกลุมตอตานของเยอรมนีที่ถูกวางแผนไวเพื่อสูรบกับมหาอํานาจผูยึดครองตอไปเมื่อแพสงคราม"
 superior_firepower: "อํานาจการยิงเหนือกวา"
 superior_firepower_desc: "หลักนิยมนี้มุงเนนการสาดกระสุนปนใหญ ไมใชสาดคน ใสขาศึก กําลังพลของเรามีคา สวนกระสุนนั้นราคาถูก\n\n"
 sup_delay: "การถวงเวลา"
 sup_delay_desc: "แมในยามที่ไมอาจเอาชนะการรบได การชะลอการรุกของฝายโจมตีดวยการซุมโจมตีและยุทธวิธีถวงเวลาก็อาจเปนประโยชน"
 mobile_defence: "การปองกันแบบเคลื่อนที่"
 mobile_defence_desc: "กองกําลังเคลื่อนที่เร็วสามารถใชเสริมการปองกันไดทุกจุดที่ขาศึกอาจโจมตี"
 intergrated_support: "การสนับสนุนแบบบูรณาการ"
 intergrated_support_desc: "การบูรณาการกองกําลังสนับสนุนเขากับหนวยรบอยางใกลชิดทําใหไดกองพลที่แข็งแกรงยิ่งขึ้นในการโจมตี\n\n"
 regimental_combat_teams: "ทีมรบระดับกรม"
 regimental_combat_teams_desc: "ทีมรบระดับกรมคือกรมทหารราบที่บูรณาการอยางใกลชิดกับหนวยสนับสนุน เชน ปนใหญ รถถัง และหนวยลาดตระเวน จนกลายเปนหนวยขนาดเล็กที่พึ่งพาตนเองได ซึ่งชวยเพิ่มความยืดหยุนในการโจมตี"
 dispersed_support: "การสนับสนุนแบบกระจายกําลัง"
 dispersed_support_desc: "การกระจายหนวยสนับสนุนของเราทําใหครอบคลุมพื้นที่ไดกวางขึ้นขณะที่ยังอยูนอกแนวการยิง สงผลใหกองพลมีการปองกันที่ดีขึ้น\n\n"
 overwhelming_firepower: "อํานาจการยิงทวมทน"
 overwhelming_firepower_desc: "การเรียกหนวยสนับสนุนทั้งหมดที่มีมาระดมยิงอยางทวมทนสามารถบั่นทอนเปาหมายไดอยางมาก หรือดีกวานั้น คือทําใหฝายโจมตีเจอวันที่เลวรายอยางแทจริง"
 sup_mechanized_offensive: "การรุกดวยยานเกราะลําเลียงพล"
 sup_mechanized_offensive_desc: "กองกําลังยานยนตนั้นดีอยูแลว แตการจะนําการรุก เราตองมีทหารราบที่สามารถเขาสูสนามรบในยานลําเลียงหุมเกราะซึ่งชวยปกปองพวกเขาและบรรทุกอาวุธหนักได"
 concentrated_fire_plans: "แผนการยิงแบบรวมศูนย"
 concentrated_fire_plans_desc: "การรวมการยิงของกองรอยปนใหญหลายหนวยใหเปนการระดมยิงที่ประสานจังหวะกันจะสรางความเสียหายแกขาศึกไดมากกวามาก\n\n"
 combined_arms: "การรบผสมเหลา"
 combined_arms_desc: "ยานเกราะ ทหารราบ และหนวยสนับสนุนที่ทํางานรวมกันเปนทีมที่จัดระเบียบมาอยางดี มีประสิทธิภาพเหนือกวากองกําลังเดียวกันที่แยกกันปฏิบัติการอยางมาก"
 tactical_control: "การควบคุมทางยุทธวิธี"
 tactical_control_desc: "นายทหารที่คุนเคยกับปฏิบัติการผสมเหลาในที่มั่นแนวหนาสามารถควบคุมปฏิบัติการของทุกเหลาทัพไดโดยตรงแลว"
 air_land_battle: "การรบอากาศ-ภาคพื้นดิน"
 air_land_battle_desc: "เมื่อกองกําลังภาคพื้นดินปฏิบัติการในรูปขบวนผสมเหลาอยูแลว การรบอากาศ-ภาคพื้นดินจึงเนนการประสานงานอยางใกลชิดระหวางกําลังทางบกและกําลังทางอากาศ หลอมรวมสนามรบทางอากาศและทางบกใหเปนหนึ่งเดียวอยางไรรอยตอ"
 centralized_fire_control: "การควบคุมการยิงแบบรวมศูนย"
 centralized_fire_control_desc: "ระบบควบคุมการยิงแบบรวมศูนยชวยใหคําขอการสนับสนุนจากปนใหญทั้งหมดถูกประเมิน ณ จุดเดียว และหากจําเปนก็สามารถรวมอํานาจการยิงทั้งหมดของกองพลไปยังเปาหมายเดียว แทนที่หนวยหนึ่งจะขอการยิงไดเพียงจากปนใหญที่ไดรับมอบหมายใหเทานั้น\n\n"
 forward_observers: "ผูตรวจการณหนา"
 forward_observers_desc: "ผูตรวจการณหนาจะเขาประจําตําแหนงที่สามารถสังเกตความแมนยําและผลของการยิงปนใหญไดโดยตรง แลวสงผลกลับไปยังปนเพื่อปรับแกการยิง"
 advanced_firebases: "ฐานยิงสนับสนุนสวนหนา"
 advanced_firebases_desc: "สามารถตั้งคายปนใหญไวใกลแนวหนาในฐานที่มีปอมปราการ เพื่อใหการสนับสนุนกองกําลังที่กําลังรุกคืบไดมากที่สุดเทาที่จะเปนไปได"
 shock_and_awe: "ช็อกแอนดออว"
 shock_and_awe_desc: "การรวมอํานาจการยิงมหาศาลจะสรางความตื่นตระหนกและหวาดกลัวอยางทวมทนแกฝายตรงขามในทันทีหรือในเวลาที่ทันทวงทีพอ จนทําใหเจตจํานงที่จะสูตอของพวกเขาเปนอัมพาต"
 grand_battle_plan: "แผนการรบใหญ"
 grand_battle_plan_desc: "การวางแผนและการเตรียมการอยางละเอียดกอนเขาสูการรบคือกุญแจสูความสําเร็จ\n\n"
 trench_warfare: "สงครามสนามเพลาะ"
 trench_warfare_desc: "พลั่วมักเปนอาวุธที่ดีที่สุดของทหารราบ หนวยตางๆ เรียนรูคุณคาของการขุดสนามเพลาะในทุกตําแหนงที่เขายึด"
 prepared_defense: "การปองกันที่เตรียมไว"
 prepared_defense_desc: "ระบบปอมสนามที่ครอบคลุมยิ่งขึ้นชวยเพิ่มการปองกันของหนวยไดอยางมาก"
 grand_assault: "การบุกโจมตีครั้งใหญ"
 grand_assault_desc: "เมื่อสะสมกําลังไดเพียงพอและวางแผนเปาหมายไวอยางดีแลว การบุกโจมตีอันทรงพลังยอมทําลายขาศึกไดอยางแนนอน"
 grand_mechanized_offensive: "การรุกดวยยานเกราะลําเลียงพล"
 grand_mechanized_offensive_desc: "กองกําลังยานยนตนั้นดีอยูแลว แตการจะนําการรุก เราตองมีทหารราบที่สามารถเขาสูสนามรบในยานลําเลียงหุมเกราะซึ่งชวยปกปองพวกเขาและบรรทุกอาวุธหนักได\n\n"
 assault_concentration: "การรวมกําลังบุกโจมตี"
 assault_concentration_desc: "กอนการโจมตี หนวยนําจะไดรับการเตรียมพรอมอยางรอบคอบและวางกําลังไวในที่มั่นแนวหนา เพื่อใหมั่นใจวาจะใชกําลังไดสูงสุดในชวงเปดฉาก"
 branch_interoperation: "การปฏิบัติการรวมระหวางเหลาทัพ"
 branch_interoperation_desc: "การประสานงานที่เพิ่มขึ้นระหวางเหลาทัพตางๆ ของกองทัพทําใหปฏิบัติการผสมเหลาไดดียิ่งขึ้น"
 assault_breakthrough: "การบุกเจาะแนว"
 assault_breakthrough_desc: "แทนที่จะเปดการบุกโจมตีครั้งใหญตลอดทั้งแนวหนา การรวมการโจมตีไวที่จุดเดียวหรือไมกี่จุดของแนวขาศึกเพื่อเจาะแนวใหได ณ ที่นั้นอาจมีประสิทธิภาพมากกวามาก"
 central_planning: "การวางแผนจากสวนกลาง"
 central_planning_desc: "นายทหารจากทุกเหลาทัพรวมกันวางแผนปฏิบัติการแตละครั้ง เพื่อใหมั่นใจวาปฏิบัติการดําเนินไปอยางมีประสิทธิภาพสูงสุด"
 c3i_theory: "C3I"
 c3i_theory_desc: "นายทหารฝายเสนาธิการที่มีประสิทธิภาพชวยใหการบังคับบัญชา การควบคุม การสื่อสาร และขาวกรอง ไหลเวียนไดอยางราบรื่นระหวางผูบังคับบัญชากับหนวยที่อยูใตการควบคุม"
 infantry_offensive: "การรุกของทหารราบ"
 infantry_offensive_desc: "จิตวิญญาณแหงการรุกของทหารราบคือปจจัยชี้ขาดในการเอาชนะการรบ ทหารราบของเราตองเปนผูนําทาง\n\n"
 armored_operations: "ปฏิบัติการยานเกราะ"
 armored_operations_desc: "รถถังและยานเกราะอื่นๆ มีประโยชนอยางยิ่งในการลําเลียงทหารราบสูสนามรบและใหการสนับสนุนโดยตรงในการสูรบ"
 infiltration_assault: "การบุกแทรกซึม"
 infiltration_assault_desc: "ในชวงเปดฉากการโจมตี ทหารราบตองมุงเปาไปที่จุดออนในแนวขาศึกเพื่อออมผานและตัดขาดสวนที่มีการปองกันแนนหนากวา ซึ่งจากนั้นจะถูกกวาดลางโดยกองกําลังโจมตีสวนที่เหลือ"
 night_assault_tactics: "ยุทธวิธีโจมตีกลางคืน"
 night_assault_tactics_desc: "ทหารที่คุนเคยกับการเคลื่อนที่และการรบในเวลากลางคืนสามารถเขาประจําตําแหนงลวงหนาเพื่อเตรียมโจมตี หรือโจมตีกองกําลังขาศึกที่ไมทันระวังตัวไดโดยตรง"
 attritional_containment: "การปดลอมแบบบั่นทอน"
 attritional_containment_desc: "หากเราไมสามารถเปดการโจมตีเพื่อกําจัดที่มั่นของขาศึกได ก็ยังตองโจมตียอยๆ อยางตอเนื่อง ซึ่งจะสรางความสูญเสียและปองกันไมใหขาศึกเปดการโจมตีของตนเองได"
 infiltration_in_depth: "การแทรกซึมเชิงลึก"
 infiltration_in_depth_desc: "กองกําลังของเราไดรับการฝกใหออมผานและตัดขาดที่มั่นแข็งแรงของขาศึกไดลึกกวาเดิมมาก โดยหลักการแลว กองกําลังบุกของเราไมควรหยุดจนกวาจะถึงพื้นที่สวนหลังของขาศึกและกองกําลังของพวกมันถูกตัดขาดอยางสมบูรณ"
 mass_assault: "การบุกโจมตีแบบมวลชน"
 mass_assault_desc: "อาวุธที่ 'สมบูรณแบบ' นั้นถูกยกยองเกินจริง อาวุธที่ 'ดีพอใช' จํานวนมากตางหากคือเสนทางสูชัยชนะ!\n\n"
 pocket_defence: "การปองกันในวงลอม"
 pocket_defence_desc: "ในการตั้งรับ เปนไปไดที่ทหารของเราอาจติดอยูในวงลอม ในกรณีนี้พวกเขาเพียงตองยืนหยัดไวจนกวาการตีโตที่จะมาถึงอยางแนนอนจะเขามาชวยเหลือ"
 defence_in_depth: "การปองกันเชิงลึก"
 defence_in_depth_desc: "ดวยการตานทานเพียงเบาบางและยอมเสียพื้นที่ชั่วคราว เราสามารถแลกพื้นที่กับเวลา และปลอยใหฝายโจมตีหมดแรงไปเองกอนที่เราจะตีโต"
 large_front_operations: "ปฏิบัติการแนวรบกวาง"
 large_front_operations_desc: "การสูรบบนแนวรบที่กวางใหญตองประสานความพยายามของหลายหนวยในระยะทางไกล: ในระดับยุทธการ แทนที่จะเปนระดับยุทธวิธี\n\n"
 deep_operations: "ปฏิบัติการเชิงลึก"
 deep_operations_desc: "แนวคิดของปฏิบัติการเชิงลึก หรือการรบเชิงลึก คือการเจาะทะลวงแนวปองกันของขาศึกหลายจุดพรอมกัน ทําลายกองหนุนระดับยุทธการและความลึกเชิงยุทธการของขาศึก และยึดครองความลึกเชิงยุทธศาสตรของขาศึกใหไดมากที่สุด"
 operational_concentration: "การรวมกําลังระดับยุทธการ"
 operational_concentration_desc: "กุญแจของปฏิบัติการทางทหารใดๆ คือความเหนือกวาอยางทวมทนในพื้นที่ เมื่อไมอาจเหนือกวาอยางทวมทนไดตลอดทั้งแนวหนา ก็ตองลดกําลังบางสวนของแนวหนาลงเพื่อรวมทหารไวในจุดที่จําเปน แทนที่จะพยายามแข็งแกรงไปทุกที่"
 vast_offensives: "การรุกครั้งมหึมา"
 vast_offensives_desc: "หากเจาะแนวไดสําเร็จ ก็ตองขยายผลใหไดมากที่สุด: การรุกครั้งมหึมาที่ทะลวงแนวขาศึกใหลึกที่สุดจะทําใหการปองกันแนวหนาของพวกมันยากขึ้น เปนไปไมได หรือไรความหมาย"
 breakthrough_priority: "ความสําคัญสูงสุดแกการเจาะแนว"
 breakthrough_priority_desc: "ตอยอดจากการรวมกําลังระดับยุทธการ ความตองการทั้งหมดของแนวหนาจะตองอยูใตความจําเปนในการรวมกําลังเพื่อการเจาะแนว ความพายแพในพื้นที่นั้นไมสําคัญเมื่อเทียบกับการโจมตีครั้งชี้ขาด"
 mechanized_wave: "คลื่นยานเกราะลําเลียงพล"
 mechanized_wave_desc: "กองกําลังยานเกราะลําเลียงพลเหมาะอยางยิ่งสําหรับการรุกคืบอยางรวดเร็วที่จําเปนตอการขยายผลการเจาะแนว ทั้งในการสนับสนุนกองกําลังยานเกราะและการคุมกันปกของชองที่ถูกเจาะ"
 continuous_offensive: "การรุกตอเนื่อง"
 continuous_offensive_desc: "แมการเจาะแนวที่ขยายผลอยางเหมาะสมมักไดผลดีมาก แตไมชาก็เร็ว ฝายโจมตียอมออนลา และฝายตั้งรับจะสามารถจัดระเบียบใหมและตั้งแนวปองกันใหมได อยางไรก็ตาม หากมีกองหนุนเพียงพอและการจัดระเบียบที่ถูกตอง การรุกก็สามารถดําเนินตอไปไดลึกกวามาก และสรางผลลัพธอันรายแรงแกขาศึก"
 human_wave_offensive: "การรุกแบบคลื่นมนุษย"
 human_wave_offensive_desc: "การรุกแบบคลื่นมนุษยคือยุทธวิธีของทหารราบที่ฝายโจมตีบุกเขาตีดานหนาดวยรูปขบวนทหารราบที่รวมกันอยางหนาแนนใสแนวขาศึก โดยมุงหมายจะบดขยี้ฝายตั้งรับดวยการรบประชิดตัว"
 human_infantry_offensive: "การรุกของทหารราบ"
 human_infantry_offensive_desc: "จิตวิญญาณแหงการรุกของทหารราบคือปจจัยชี้ขาดในการเอาชนะการรบ ทหารราบของเราตองเปนผูนําทาง"
 large_front_offensive: "การรุกแนวรบกวาง"
 large_front_offensive_desc: "ดวยการดําเนินการ หรือขูวาจะดําเนินการ รุกแบบคลื่นมนุษยในหลายพื้นที่ของแนวหนา เราสามารถปองกันไมใหขาศึกรวมอํานาจการยิงไวตานการโจมตีครั้งใดครั้งหนึ่งได"
 peoples_army: "กองทัพประชาชน"
 peoples_army_desc: "กองทัพประชาชนเชื่อในความสําคัญของคนเหนืออาวุธ โดยใชแรงจูงใจที่เหนือกวาชดเชยเทคโนโลยีที่ดอยกวา และไดรับการสนับสนุนอยางกวางขวางจากประชาชนพลเรือน\n\n"
 guerilla_warfare: "สงครามกองโจร"
 guerilla_warfare_desc: "ขาศึกรุก เราถอย ขาศึกตั้งคาย เรารังควาน ขาศึกเหนื่อยลา เราโจมตี ขาศึกถอย เราไลตาม"
 infantry_weapons2: "ยุทโธปกรณทหารราบปรับปรุง I"
 infantry_weapons2_desc: "อาวุธประจํากายและอาวุธประจําหนวยสําหรับทหารราบ ตลอดจนเครื่องใชอื่นๆ ที่ทหารจําเปนตองมี อาวุธรุนปรับปรุงและยุทโธปกรณที่เฉพาะทางมากขึ้น"
 improved_infantry_weapons_2: "ยุทโธปกรณทหารราบปรับปรุง II"
 improved_infantry_weapons_2_desc: "อาวุธประจํากายและอาวุธประจําหนวยสําหรับทหารราบ ตลอดจนเครื่องใชอื่นๆ ที่ทหารจําเปนตองมี อาวุธรุนปรับปรุงและยุทโธปกรณที่เฉพาะทางมากขึ้น"
 advanced_infantry_weapons2: "ยุทโธปกรณทหารราบปรับปรุง III"
 advanced_infantry_weapons2_desc: "อาวุธประจํากายและอาวุธประจําหนวยสําหรับทหารราบ ตลอดจนเครื่องใชอื่นๆ ที่ทหารจําเปนตองมี ปรับใหทันสมัยยิ่งขึ้นโดยรวมปนเล็กยาวจูโจมประจํากายและจรวดตอตานรถถัง เพิ่มการจัดหาอาวุธที่เคยแจกจายในวงจํากัดใหมีมากขึ้น"
 infantry_at: "อาวุธตอตานรถถังของทหารราบ I"
 infantry_at_desc: "การติดอาวุธปนเล็กยาวตอตานรถถังใหหนวยทหารราบของเราจะทําใหพวกเขาจัดการยานเกราะเบาได โดยยังคงความคลองตัวไว"
 infantry_at2: "อาวุธตอตานรถถังของทหารราบ II"
 infantry_at2_desc: "เพื่อใหทหารราบรับมือกับหนวยยานเกราะที่หนักกวาไดอยางมีประสิทธิภาพ อาวุธตอตานรถถังแบบหัวรบระเบิดแรงสูงจะตองมีขนาดเล็กและนํ้าหนักเบาลง"
 support_weapons: "อาวุธสนับสนุน I"
 support_weapons_desc: "อาวุธอัตโนมัติพกพาไดสะดวกขึ้นเรื่อยๆ ปนกลมือไดพิสูจนประสิทธิภาพแลว และการพัฒนาอาวุธสนับสนุนแบบถือยิงตองดําเนินตอไป"
 support_weapons2: "อาวุธสนับสนุน II"
 support_weapons2_desc: "การพัฒนาอาวุธอัตโนมัติที่ผสานคุณลักษณะของปนกลเบาและปนกลหนักเขาดวยกัน ชวยใหทหารราบของเราใชยุทโธปกรณไดอยางหลากหลาย"
 support_weapons3: "อาวุธสนับสนุน III"
 support_weapons3_desc: "นอกจากการรักษาและปรับปรุงความนาเชื่อถือของปนกลแลว เรายังสามารถทดลองเพิ่มอัตราการยิงเพื่อใหกระแสกระสุนที่สาดไมขาดสายมีอานุภาพรายแรง"
 support_weapons4: "อาวุธสนับสนุน IV"
 support_weapons4_desc: "เมื่อปนเล็กยาวจูโจมถูกใชอยางแพรหลายขึ้น การพัฒนาอาวุธอัตโนมัติที่เชื่อถือไดซึ่งทหารทุกนายใชไดในทุกสภาพแวดลอมจึงเปนสิ่งสําคัญอันดับตนของกองทัพสมัยใหม"
 paratroopers: "พลรม I"
 paratroopers_desc: "การผนวกกองกําลังสงทางอากาศเขากับกองทัพของเราจะทําใหเราสามารถบุกเขาพื้นที่และวางกําลังทหารสําคัญในพื้นที่ที่เคยเขาถึงไมได เปดโอกาสทางยุทธวิธีใหมๆ"
 paratroopers2: "พลรม II"
 paratroopers2_desc: "การเปลี่ยนจากปฏิบัติการขนาดเล็กที่มีพลรมเพียงไมกี่นายไปสูกองพลสงทางอากาศขนาดใหญ ปูทางสูการยกพลลงทางอากาศครั้งมหึมา ทําใหกองกําลังเหลานี้กลายเปนสวนหนึ่งของการสงครามโดยธรรมชาติ ไมใชเพียงของแปลกใหม"
 paratroopers3: "พลรม III"
 paratroopers3_desc: "การเรียนรูที่จะปรับปฏิบัติการกระโดดรมใหเขากับสภาพอากาศ การกําหนดมาตรฐานยุทโธปกรณอยางรองเทากระโดดรม และการฝกเฉพาะทางที่เขมขนขึ้น จะชวยลดความสับสนและความเสี่ยงในภารกิจอันตรายเหลานี้"
 marines: "นาวิกโยธิน I"
 marines_desc: "ทหารที่เชี่ยวชาญการสงครามสะเทินนํ้าสะเทินบกกําลังกลายเปนสิ่งที่ขาดไมไดมากขึ้นทุกที วิธีการและยุทโธปกรณแบบชั่วคราวจะกลายเปนอดีต เมื่อทหารราบนาวิกของเราไดรับการสนับสนุนดวยเรือยกพลขึ้นบกเฉพาะทางและการฝกฝน"
 marines2: "นาวิกโยธิน II"
 marines2_desc: "การสงครามสะเทินนํ้าสะเทินบกตองอาศัยนวัตกรรมอยางตอเนื่อง การสนับสนุนดานการสงกําลังบํารุงที่ดีขึ้นและทาเรือเคลื่อนที่จะชวยใหนาวิกโยธินของเรายกพลขึ้นบกไดในที่ซึ่งไมเชนนั้นอาจเปนไปไมได"
 marines3: "นาวิกโยธิน III"
 marines3_desc: "นาวิกโยธินเปนไดมากกวาทหารราบสะเทินนํ้าสะเทินบก ในอนาคต กองนาวิกโยธินของเราจะเปนหนึ่งในหนวยรบพิเศษที่มีวินัยและการจัดระเบียบดีที่สุด"
 tech_mountaineers: "ทหารราบภูเขา I"
 tech_mountaineers_desc: "การรบในเทือกเขาทําใหทหารตองเผชิญอันตรายมากมาย แตบางครั้งก็หลีกเลี่ยงไมได เราสามารถลดความเสี่ยงเหลานี้ไดดวยการฝกเฉพาะทางสําหรับสภาพแวดลอมนี้ใหแกทหารของเรา"
 tech_mountaineers2: "ทหารราบภูเขา II"
 tech_mountaineers2_desc: "มากกวาแคการเอาตัวรอด กองกําลังของเราสามารถฝกใหใชภูเขาเปนขอไดเปรียบ ดวยยุทโธปกรณเบาและการขนสงดวยลอ พวกเขาจะดําเนินกลยุทธในภูมิประเทศนี้ไดดีกวาทหารราบอื่น"
 tech_mountaineers3: "ทหารราบภูเขา III"
 tech_mountaineers3_desc: "การเตรียมพรอมสําหรับภารกิจบนภูเขาที่ยากลําบากที่สุดในที่สูงและอุณหภูมิตํ่า จะตองอาศัยการฝกและวินัยที่ไมธรรมดาจากทหารภูเขาของเรา"
 rangers_tech: "หนวยจูโจม I"
 rangers_tech_desc: "ดวยการเชี่ยวชาญการรบในปาไม ฝกทหารราบเบาใหปรับตัวเขากับภูมิประเทศและพืชพรรณ เราจะประหยัดกําลังทหารในการปองกัน หรือแมแตบุกทะลวงแนวขาศึกในจุดที่พวกมันคาดไมถึงที่สุด"
 rangers_tech2: "หนวยจูโจม II"
 rangers_tech2_desc: "การใชผูเชี่ยวชาญการรบในปาไมเปนจํานวนมากแทนที่จะเปนเพียงหนวยลาดตระเวนขนาดเล็ก เปดโอกาสใหเราบุกโจมตีครั้งใหญตอสวนที่มีการปองกันเบาบาง"
 rangers_tech3: "หนวยจูโจม III"
 rangers_tech3_desc: "การปฏิบัติการในพื้นที่ยากลําบากตองอาศัยยุทโธปกรณพิเศษและวิธีการฝกพิเศษ เราตองทําใหแนใจวาทหารของเรามีเครื่องมือลาสุดและไดรับการฝกดวยวิธีการที่ทันสมัยที่สุด"

 tech_special_forces: "หนวยรบพิเศษ"
 tech_special_forces_desc: "การรบนอกแบบตองอาศัยการฝกเฉพาะทาง เราตองทําใหแนใจวาทหารของเราพรอมและสามารถปรับตัวเขากับสภาพที่โหดรายได"
 advanced_special_forces: "การฝกหนวยรบพิเศษขั้นสูง"
 advanced_special_forces_desc: "ดวยการฝกอยางเขมขน เราจะมั่นใจไดวาหนวยรบพิเศษของเราจะปฏิบัติงานไดเหนือกวาคนธรรมดาไปอีกขั้น"
 improved_special_forces: "ขยายโครงการหนวยรบพิเศษ"
 improved_special_forces_desc: "หนวยรบพิเศษสามารถปฏิบัติภารกิจที่ทหารธรรมดาทําไมได เราจําเปนตองขยายโครงการฝกเพื่อใหทหารของเราผานคุณสมบัติไดมากขึ้น"
 extreme_environment_training: "การฝกในสภาพแวดลอมสุดขั้ว"
 extreme_environment_training_desc: "เราตองสามารถรบไดในสภาพแวดลอมที่โหดรายที่สุด ดวยการฝกและยุทโธปกรณที่เหมาะสม ทหารของเราจะสามารถรบไดในสภาพที่สุดขั้วที่สุด"
 survival_training: "การฝกเอาตัวรอด"
 survival_training_desc: "หนวยรบพิเศษของเรามักตองรบหลังแนวขาศึกและขาดแคลนเสบียง เราตองฝกใหพวกเขาทนตอสภาพอากาศเลวรายและรบไดดวยเสบียงอันจํากัด"
 elite_forces: "กองกําลังชั้นยอด"
 elite_forces_desc: "มีเพียงยอดฝมือที่สุดเทานั้นที่จะไดเปนหนวยรบพิเศษ ทหารที่ผานการฝกมาไดจะแข็งแกรงกวา วองไวกวา และรบไดดุดันกวาใครๆ"
 jungle_warfare: "การรบในปาทึบ"
 jungle_warfare_desc: "การฝกพิเศษเพื่อใหทหารของเรามีประสิทธิภาพในปาทึบ"
 jungle_training_tech: "การฝกรบในปาทึบ"
 desert_training_tech: "การฝกรบในทะเลทราย"
 hills_training_tech: "การฝกรบในเขตเนินเขา"
 urban_training_tech: "การฝกรบในเมือง"
 HUN_light_infantry_tech: "หลักนิยมกองพลทหารราบเบา"
 HUN_light_infantry_tech_desc: "การลดจํานวนหนวยสนับสนุนในกองพลทหารราบของเราทําใหมีความยืดหยุนมากขึ้น และไดเปรียบในการรบในภูมิประเทศที่จํากัดอยางเมืองและปาไม"
 SWI_mountaineer_paratroopers_tech: "$SWI_mountaneer_paratroopers$"
 mountain_warfare: "การรบบนภูเขา"
 mountain_warfare_desc: "การฝกพิเศษเพื่อใหทหารของเรามีประสิทธิภาพในเทือกเขา"
 mountain_defensive_training: "การฝกปองกันบนภูเขา"
 mountain_defensive_training_desc: "การฝกพิเศษจะชวยใหทหารของเราปองกันในภูมิประเทศภูเขาไดดีขึ้น"
 tech_recon: "กองรอยลาดตระเวน I"
 tech_recon_desc: "การสงกลุมเล็กๆ ออกไปสอดแนมลวงหนากอนเคลื่อนกําลังหลัก ชวยใหเรารวบรวมขาวกรองไดวาขาศึกอยูที่ใดและเรากําลังเผชิญกับกําลังมากเพียงใด"
 tech_recon2: "กองรอยลาดตระเวน II"
 tech_recon2_desc: "ภารกิจลาดตระเวนมักเปนอันตรายและมีความสูญเสียสูง การเตรียมหนวยลาดตระเวนใหเคลื่อนที่และถอนตัวไดรวดเร็ว และติดอุปกรณสําหรับเคลียรสิ่งกีดขวางที่ขาศึกวางไว จะเพิ่มโอกาสที่พวกเขาจะกลับมาอยางปลอดภัย"
 tech_recon3: "กองรอยลาดตระเวน III"
 tech_recon3_desc: "ความกาวหนาของเทคโนโลยีวิทยุเปลี่ยนวิธีดําเนินภารกิจลาดตระเวน ทําใหสามารถสื่อสารขาวกรองที่รวบรวมไดอยางรวดเร็ว"
 tech_recon4: "กองรอยลาดตระเวน IV"
 tech_recon4_desc: "ปฏิบัติการลาดตระเวนเชิงลึกที่ผสมผสานการจารกรรม ปฏิบัติการกองโจร และการฝกแบบคอมมานโด จะชวยในการตัดสินใจทางยุทธวิธีของเรา และทําใหเราปรับการตัดสินใจไดอยางรวดเร็ว"
 tech_engineers: "กองรอยทหารชาง I"
 tech_engineers_desc: "การสรางปอมปราการและการทลายสิ่งกีดขวางทําใหทหารชางรบมีความสําคัญยิ่งในสนาม การใหบทบาทที่หลากหลายแกทหารชางของเราจะทําใหเราสงพวกเขาไปปฏิบัติงานในสถานการณตางๆ ที่ตองการได"
 tech_engineers2: "กองรอยทหารชาง II"
 tech_engineers2_desc: "ดวยยุทโธปกรณสมัยใหมและวัตถุระเบิดแรงสูง ทหารชางของเราจะทําไดมากกวาภารกิจดั้งเดิม และสรางความประหลาดใจแกขาศึกดวยความเฉลียวฉลาด ทั้งบนบกและในทะเล"
 tech_engineers3: "กองรอยทหารชาง III"
 tech_engineers3_desc: "โครงการวิศวกรรมทางทหารกําลังขยายขนาดใหญขึ้น การสรางโครงสรางพื้นฐานสนับสนุนขั้นสูงชวยใหดําเนินปฏิบัติการที่ตองใชเสบียงเกินกวาที่มีอยูตามปกติในสนามได"
 tech_engineers4: "กองรอยทหารชาง IV"
 tech_engineers4_desc: "ทหารชางรบแหงอนาคตจะรักษาความคลองตัวในพื้นที่ไวไดขณะสรางสิ่งที่ครั้งหนึ่งถือเปนปอมปราการและระบบเสบียงถาวร และจะทําใหมั่นใจวาไมวาทหารของเราจะถูกโจมตีที่ใด พวกเขาก็พรอมรับมือ"
 hospital_tech: "โรงพยาบาลสนาม"
 helicopter_tech: "เฮลิคอปเตอร"
 logistics_tech: "กองรอยสงกําลังบํารุง"
 recon_tech: "กองรอยลาดตระเวน"
 tech_field_hospital: "โรงพยาบาลสนาม I"
 tech_field_hospital_desc: "การบาดเจ็บไมจําเปนตองหมายถึงทหารที่เสียชีวิต การมีการรักษาพยาบาลทันทีสําหรับผูบาดเจ็บที่ถูกสงกลับมายังแนวหลังคือกาวแรกที่จะทําใหเปนเชนนั้น"
 tech_field_hospital2: "โรงพยาบาลสนาม II"
 tech_field_hospital2_desc: "ดวยการริเริ่มใชโรงพยาบาลเคลื่อนที่ นําการรักษาพยาบาลไปยังจุดที่ตองการ เราจะปองกันการเสียชีวิตและการบาดเจ็บถาวรที่ไมจําเปนไดมากมาย"
 tech_field_hospital3: "โรงพยาบาลสนาม III"
 tech_field_hospital3_desc: "การผาตัดเปนหนึ่งในหัตถการฉุกเฉินที่ตองใชบอยที่สุดในสนาม ขั้นตอนและเครื่องมือสําหรับการนี้ตองพรอมใชใกลแนวหนามากขึ้น และเราตองทําใหแนใจวามีศัลยแพทยที่ชํานาญอยูในหนวยแพทยทหาร"
 tech_field_hospital4: "โรงพยาบาลสนาม IV"
 tech_field_hospital4_desc: "แมเวชศาสตรสนามจะพัฒนาไปมาก แตความกาวหนาหลายอยางเปนการแกปญหาเฉพาะหนา และเรายังขาดหลักนิยมที่วางรากฐานไวชัดเจน ดวยประสบการณที่มากขึ้น เราจะอธิบายบทบาทของหนวยเหลานี้ไดชัดเจนขึ้น และทําใหนวัตกรรมเฉพาะหนากลายเปนแนวปฏิบัติถาวร"
 tech_logistics_company: "กองรอยสงกําลังบํารุง I"
 tech_logistics_company_desc: "การมีนายทหารสงกําลังบํารุงเฉพาะทางในกองทัพของเราจะชวยใหใชประโยชนจากเครือขายสนับสนุนเพื่อลดความสูญเปลาใหเหลือนอยที่สุด"
 tech_logistics_company2: "กองรอยสงกําลังบํารุง II"
 tech_logistics_company2_desc: "การปรับการวิเคราะหความเสี่ยงใหเขากับสถานการณใหมของสงครามจะชวยเพิ่มความปลอดภัยของการสนับสนุนดานการสงกําลังบํารุง"
 tech_logistics_company3: "กองรอยสงกําลังบํารุง III"
 tech_logistics_company3_desc: "การประเมินเชิงสถิติอยางตอเนื่องถึงความตองการเสบียงของทหารชวยใหใชทรัพยากรของเราไดคุมคาที่สุด"
 tech_logistics_company4: "กองรอยสงกําลังบํารุง IV"
 tech_logistics_company4_desc: "การพัฒนาการจําแนกประเภทเสบียงที่เปนมาตรฐานจะลดความสับสนและทําใหการวางแผนมีประสิทธิภาพยิ่งขึ้น"
 tech_military_police: "สารวัตรทหาร I"
 tech_military_police_desc: "ทหารทั่วไปอาจจัดการการยึดครองไดในระยะสั้น แตพวกเขาเปนทหารกอนอื่นใด การผนวกสารวัตรทหารเขากับกองกําลังของเราจะทําใหมั่นใจวามีกําลังคนในพื้นที่คอยรับมือการตอตานและสืบสวนการกอวินาศกรรม"
 tech_military_police2: "สารวัตรทหาร II"
 tech_military_police2_desc: "ดวยการปฏิบัติหนาที่ตํารวจตามปกติในดินแดนที่ยึดครอง เชน การควบคุมจราจรและการรักษาความสงบเรียบรอยของประชาชน สารวัตรทหารของเราจะลดความวุนวายและความสับสนที่ขบวนการพลพรรคใชเปนที่เติบโตได"
 tech_military_police3: "สารวัตรทหาร III"
 tech_military_police3_desc: "ดวยความรวมมือกับเครือขายสายลับและผูแจงขาวในทองถิ่นที่ตั้งขึ้นกอนการยึดครอง สารวัตรทหารของเราจะเตรียมการเชิงรุกในจุดที่การตอตานมีแนวโนมจะเกิดขึ้นได"
 tech_military_police4: "สารวัตรทหาร IV"
 tech_military_police4_desc: "การรักษาความสงบในดินแดนที่ยึดครองอยางปลอดภัยนั้นเกี่ยวกับการคืนสูภาวะปกติพอๆ กับการกําจัดฝายตอตานอยางไรปรานี สารวัตรทหารของเราตองทําใหกระบวนการนี้เริ่มตนแตเนิ่นๆ เพื่อความปลอดภัยของทั้งทหารและพลเรือน"
 tech_signal_company: "กองรอยทหารสื่อสาร I"
 tech_signal_company_desc: "การสรางและรักษาการสื่อสารในสนามรบตองอาศัยทักษะพิเศษมาโดยตลอด เมื่อเทคโนโลยีการสื่อสารและการตรวจจับแบบใหมถือกําเนิดขึ้นในมหาสงคราม ความเปนไปไดใหมๆ สําหรับงานนี้ก็รออยูขางหนา"
 tech_signal_company2: "กองรอยทหารสื่อสาร II"
 tech_signal_company2_desc: "กองรอยทหารสื่อสารที่มุงเนนการสื่อสารระหวางเหลาทัพตางๆ จะชวยใหกองกําลังภาคพื้นดินประสานความพยายามกับปฏิบัติการทางทะเลและทางอากาศ และวางแผนการเคลื่อนที่ไดรวดเร็วขึ้น"
 tech_signal_company3: "กองรอยทหารสื่อสาร III"
 tech_signal_company3_desc: "เทคโนโลยีการสื่อสารที่พกพาไดสะดวกขึ้นเรื่อยๆ ทําใหสามารถแบกเปนเปสะพายหลังไดจริง เราตองใชประโยชนจากความคลองตัวที่เพิ่มขึ้นของเหลาทหารสื่อสารนี้"
 tech_signal_company4: "กองรอยทหารสื่อสาร IV"
 tech_signal_company4_desc: "ในหมูผูเชี่ยวชาญดานการสื่อสารของเรา มีผูที่มีความรูจากประสบการณตรงในการใชยุทโธปกรณนี้ในสนามอยางหาใครเทียบไมได การใหพวกเขามีสวนรวมในการวิจัยเทคโนโลยีการสื่อสารใหมจะทําใหเราใชประโยชนจากความเชี่ยวชาญของพวกเขาได"
 tech_maintenance_company: "กองรอยซอมบํารุง I"
 tech_maintenance_company_desc: "การบํารุงรักษา การซอมแซม และการยกเครื่อง มีความสําคัญในการทําใหยุทโธปกรณทางทหารเชื่อถือไดและปลอดภัยตอการใชงาน การมีกองรอยที่ทุมเทใหกับงานนี้โดยเฉพาะจะทําใหมั่นใจวางานนี้ไดรับความใสใจอยางเหมาะสม"
 tech_maintenance_company2: "กองรอยซอมบํารุง II"
 tech_maintenance_company2_desc: "ขั้นตอนการบํารุงรักษาตามวงรอบระหวางปฏิบัติการชวยลดความเสี่ยงที่ยุทโธปกรณจะชํารุด และเตือนใหทหารเปลี่ยนกอนที่จะเกิดขึ้น"
 tech_maintenance_company3: "กองรอยซอมบํารุง III"
 tech_maintenance_company3_desc: "การทําใหแนใจวาทหารของเรามีวัสดุพื้นฐานในสนามสําหรับการซอมแซมทั่วไปเสมอ จะปองกันการใชยุทโธปกรณที่รูวาชํารุดตอไป"
 tech_maintenance_company4: "กองรอยซอมบํารุง IV"
 tech_maintenance_company4_desc: "ประสบการณการออกแบบระบบสํารองแบบทํางานพรอมกันในมหาสงครามสามารถนํากลับมาใชกับยุทโธปกรณที่ทันสมัยยิ่งขึ้น เพื่อใหการบํารุงรักษางายขึ้น"
 motorised_infantry: "ทหารราบยานยนต"
 motorised_infantry_desc: "ดวยการขยายการใชยานยนตในการลําเลียงทหารราบในสนาม ความคลองตัวของหนวยทหารราบที่ปกติเคลื่อนที่ชาจะเพิ่มขึ้นอยางมาก ทําใหตอบสนองไดรวดเร็วขึ้นและใชยุทธศาสตรใหมได"
 night_vision: "กลองมองกลางคืน I"
 night_vision_desc: "การมองเห็นขาศึกโดยไมถูกมองเห็นคือกุญแจของปฏิบัติการกลางคืน ดวยการประดิษฐเทคโนโลยีอินฟราเรด เราสามารถติดตั้งอุปกรณที่แมจะเทอะทะแตทําใหสิ่งนี้เปนไปไดใหแกกองทัพของเรา"
 night_vision2: "กลองมองกลางคืน II"
 night_vision2_desc: "กลองเล็งอินฟราเรดยุคแรก แมเดิมตั้งใจใหพลซุมยิงใช แตมีระยะการมองเห็นจํากัด เมื่อทั้งความสะดวกในการพกพาและการมองเห็นดีขึ้น อุปกรณเหลานี้ก็สามารถใชโดยทหารจํานวนมากขึ้นที่ปฏิบัติการในเวลากลางคืน"
 basic_machine_tools: "เครื่องมือกลพื้นฐาน"
 basic_machine_tools_desc: "เครื่องกัดที่พัฒนาขึ้นใหมหลากหลายแบบสามารถนํามาใชในการผลิตทางทหาร ตั้งแตแบบขนาดเล็กอเนกประสงคที่โรงกลึงทั่วไปหาได ไปจนถึงรุนขนาดใหญขั้นสูงที่ผลักขีดจํากัดทางเทคโนโลยี"
 improved_machine_tools: "เครื่องมือกลปรับปรุง"
 improved_machine_tools_desc: "เครื่องกลึงปอมหมุนพิสูจนแลววาขาดไมไดสําหรับการผลิตจํานวนมาก การสรางและใชเครื่องกลึงเหลานี้อยางมีประสิทธิภาพจะใหความไดเปรียบทางอุตสาหกรรมอยางมีนัยสําคัญแกเรา"
 advanced_machine_tools: "เครื่องมือกลขั้นสูง"
 advanced_machine_tools_desc: "การทําใหเครื่องมือกลทํางานอัตโนมัติดวยกลไกเซอรโวเคยถูกหารือมากอน การนําแนวคิดเหลานี้มาใชจริงทําใหเราใชประโยชนจากความกาวหนาดานระบบอัตโนมัติอื่นๆ เชน คอมพิวเตอรได"
 assembly_line_production: "การผลิตดวยสายพานการผลิต"
 assembly_line_production_desc: "สายพานการผลิตแบบใชกําลังขับซึ่งใชอยูแลวในหลายอุตสาหกรรม สามารถเปลี่ยนทิศทางของสงครามไดดวยการผลิตที่หลั่งไหลอยางไมเคยมีมากอน"
 flexible_line: "สายการผลิตยืดหยุน"
 flexible_line_desc: "แมสายพานการผลิตจะเปนเครื่องจักรที่ทํางานราบรื่นเพียงใด แตก็ยังคงมีมนุษยควบคุม ซึ่งเอื้อใหปรับเปลี่ยนไดเมื่อจําเปน เราควรใชประโยชนจากขอนี้ในการผลิตทางอุตสาหกรรมของเรา"
 streamlined_line: "สายการผลิตแบบคลองตัว"
 streamlined_line_desc: "การกําหนดมาตรฐานและโครงสรางที่เขมงวดของสายพานการผลิตคือกุญแจสูประสิทธิภาพและความปลอดภัย สิ่งเหลานี้ควรเปนแงมุมหลักที่ตองพัฒนาในการผลิตทางอุตสาหกรรมของเรา"
 improved_equipment_conversion: "หมอไอนํ้าเผาถานหินบด"
 improved_equipment_conversion_desc: "ดวยการใชถานหินบดละเอียดเปนเชื้อเพลิงใหหมอไอนํ้า เราจะไดประสิทธิภาพการเผาไหมที่สูงขึ้นมาก สงผลใหผลิตพลังงานใหแกอุตสาหกรรมไดดีขึ้น"
 advanced_equipment_conversion: "กังหันประสิทธิภาพสูง"
 advanced_equipment_conversion_desc: "การนําแบบเครื่องกําเนิดไฟฟาที่ปรับปรุงแลวมาใชจะทําใหทํางานไดที่ความดันและอุณหภูมิสูงขึ้นมาก จึงเพิ่มประสิทธิภาพดานพลังงานของโรงไฟฟาถานหินของเราอยางมหาศาล"
 concentrated_industry: "อุตสาหกรรมรวมศูนย I"
 concentrated_industry_desc: "การรวมศูนยการผลิตทางอุตสาหกรรมไวในพื้นที่สําคัญไมกี่แหงจะทําใหเราเพิ่มประสิทธิภาพไดอยางมาก\n\n"
 concentrated_industry2: "อุตสาหกรรมรวมศูนย II"
 concentrated_industry2_desc: "การรวมศูนยการผลิตมากยิ่งขึ้นจะชวยลดตนทุนลง"
 concentrated_industry3: "อุตสาหกรรมรวมศูนย III"
 concentrated_industry3_desc: "คาใชจายดานโครงสรางพื้นฐานสามารถลดลงไดดวยการปรับเครือขายใหเขากับอุตสาหกรรมที่รวมศูนยมากขึ้นของเรา"
 concentrated_industry4: "อุตสาหกรรมรวมศูนย IV"
 concentrated_industry4_desc: "การรักษาจุดสําคัญของอุตสาหกรรมใหอยูใกลกันชวยเพิ่มผลลัพธของพื้นที่รวมศูนยเหลานี้"
 concentrated_industry5: "อุตสาหกรรมรวมศูนย V"
 concentrated_industry5_desc: "นิคมอุตสาหกรรมขนาดใหญในปจจุบันรวมหลายสวนของอุตสาหกรรมเราไวดวยกัน ลดตนทุนการขนสงและแรงงานใหเหลือนอยที่สุด"
 dispersed_industry: "อุตสาหกรรมกระจายตัว I"
 dispersed_industry_desc: "การกระจายอุตสาหกรรมของเราออกไปจะทําใหขาศึกโจมตีไดยากในยามสงคราม\n\n"
 dispersed_industry2: "อุตสาหกรรมกระจายตัว II"
 dispersed_industry2_desc: "การกระจายการผลิตออกจากศูนยกลางมากขึ้นทําใหโจมตีสวนใดสวนหนึ่งโดยเฉพาะไดยากขึ้น"
 dispersed_industry3: "อุตสาหกรรมกระจายตัว III"
 dispersed_industry3_desc: "การใหโรงงานดําเนินงานโดยอําพรางเปนกิจการอื่นจะลดความเสี่ยงจากการโจมตีโดยตรง"
 dispersed_industry4: "อุตสาหกรรมกระจายตัว IV"
 dispersed_industry4_desc: "การพรางตาและกระจายโรงงานของเราสรางเครือขายที่ยากอยางยิ่งที่จะถูกทําลายจนหมดสิ้น"
 dispersed_industry5: "อุตสาหกรรมกระจายตัว V"
 dispersed_industry5_desc: "การใหไมเพียงอุตสาหกรรม แตรวมถึงโครงสรางพื้นฐานที่เชื่อมโยงอุตสาหกรรมเขาดวยกันดําเนินงานอยางลับๆ จะทําใหการทําลายดวยการโจมตีทางอากาศยากยิ่งขึ้นไปอีก"
 synth_oil_experiments: "การทดลองนํ้ามันสังเคราะห"
 synth_oil_experiments_desc: "เพื่อลดการพึ่งพานํ้ามัน เราสามารถวิจัยกระบวนการผลิตสารทดแทนจากสารและวัสดุอื่นได"
 early_refining: "การกลั่นยุคแรก"
 early_refining_desc: "นํ้ามันดิบสามารถกลั่นเปนสารและวัสดุหลายชนิดที่สําคัญยิ่งตอสงครามสมัยใหม การนําหนาในวิธีการเหลานี้จําเปนตอการสรางอุตสาหกรรมสมัยใหม"
 oil_processing: "การแปรรูปนํ้ามัน"
 oil_processing_desc: "เครือขายโรงงานสําหรับการกลั่นสังเคราะหและการกลั่นผลิตภัณฑนํ้ามันคือขั้นตอไปในการรับประกันการจัดหาเชื้อเพลิงใหแกประเทศของเรา"
 improved_oil_processing: "การแปรรูปนํ้ามันปรับปรุง"
 improved_oil_processing_desc: "การนําวิธีการกลั่นที่เคยเปนเพียงการทดลองไปใชในการดําเนินงานขนาดใหญจะชวยใหเราปรับตัวเขากับวัสดุที่มีและความตองการไดดีขึ้น"
 advanced_oil_processing: "การแปรรูปนํ้ามันขั้นสูง"
 advanced_oil_processing_desc: "เทคนิคการทําใหบริสุทธิ์แบบทดลองใหม เชน ไฮโดรทรีตติง สามารถใชในการผลิตนํ้ามันเพื่อปรับปรุงผลิตภัณฑขั้นสุดทายไดอยางมาก"
 modern_oil_processing: "การแปรรูปนํ้ามันสมัยใหม"
 modern_oil_processing_desc: "โรงกลั่นนํ้ามันของเราสามารถปรับปรุงไดอีกดวยวิธีการแปรรูปนํ้ามันขั้นสูงแบบใหม เชน ไฮโดรแคร็กกิง อัลคิเลชัน การออกซิเดชันเมอรแคปแทน และไอโซเมอไรเซชัน"
 rubber_processing: "การแปรรูปยาง"
 rubber_processing_desc: "จําเปนตองมีการแปรรูปยางสังเคราะหในระดับอุตสาหกรรมเพื่อลดการพึ่งพายางธรรมชาติ"
 improved_rubber_processing: "การแปรรูปยางปรับปรุง"
 improved_rubber_processing_desc: "การผลิตยางสังเคราะหขนาดใหญเปนไปไดดวยกระบวนการใหมที่เรงปฏิกิริยาดีไฮโดรจีเนชัน"
 advanced_rubber_processing: "การแปรรูปยางขั้นสูง"
 advanced_rubber_processing_desc: "สูตรยางสังเคราะหอเนกประสงคที่มาพรอมกระบวนการที่ปรับปรุงแลว เชน สารปรับการพอลิเมอไรเซชันโดเดซิลเมอรแคปแทน จะชวยใหเราขยายการผลิตยางสังเคราะหได"
 modern_rubber_processing: "การแปรรูปยางสมัยใหม"
 modern_rubber_processing_desc: "การเปลี่ยนไปใชกระบวนการพอลิเมอไรเซชันที่เหมาะสมยิ่งขึ้นจะทําใหตนทุนตํ่าลงและผลผลิตสูงขึ้น"
 POWERED_BUILDING: "การกอสรางดวยพลังงาน: $VAL|+=%2$"
 POWERED_DOCKYARD: "ผลผลิตอูตอเรือดวยพลังงาน: $VAL|+=%2$"
 POWERED_FACTORY: "ผลผลิตโรงงานดวยพลังงาน: $VAL|+=%2$"
 construction1: "การกอสราง I"
 construction1_desc: "วิธีการและวัสดุที่ปรับปรุงแลวชวยใหเรากอสรางอาคารทั้งพลเรือนและทหารไดรวดเร็วขึ้น"
 construction2: "การกอสราง II"
 construction2_desc: "การปรับเครื่องมือและอุปกรณใหทันสมัยจะชวยสนับสนุนความพยายามดานการกอสรางของเรายิ่งขึ้น"
 construction3: "การกอสราง III"
 construction3_desc: "การนํายานพาหนะสมัยใหมและประสบการณจากความกาวหนาดานการกอสรางมาใช จะทําใหการซอมแซมรวดเร็วขึ้นอยางมาก"
 construction4: "การกอสราง IV"
 construction4_desc: "การใชเครื่องจักรในระดับที่สูงขึ้นและขั้นตอนการทํางานที่ดีขึ้นชวยเพิ่มความเร็วการกอสรางอาคารยิ่งขึ้น"
 construction5: "การกอสราง V"
 construction5_desc: "อนาคตของการกอสรางที่มีประสิทธิภาพจะตองอาศัยการวางแผนอยางละเอียดสําหรับแตละโครงการ ตลอดจนแนวทางแกไขที่เปนมาตรฐานในทุกที่ที่ทําได"
 excavation1: "การขุดเจาะ I"
 excavation1_desc: "ความกาวหนาในเทคนิคการขุดเจาะชวยใหเราขุดทรัพยากรที่กอนหนานี้เขาถึงไมได"
 excavation2: "การขุดเจาะ II"
 excavation2_desc: "เทคนิคใหมชวยใหเราเก็บรวบรวมทรัพยากรไดอยางมีประสิทธิภาพยิ่งขึ้น เราไมทําใหทรัพยากรปนเปอนระหวางการสกัดอีกตอไป สงผลใหไดผลผลิตมากขึ้น"
 excavation3: "การขุดเจาะ III"
 excavation3_desc: "ความกาวหนาทางธรณีวิทยาชวยใหเราระบุตําแหนงของทรัพยากรได ตอนนี้เราสามารถมุงความพยายามในการสกัดไปยังพื้นที่ที่มีโอกาสพบทรัพยากรธรรมชาติปริมาณมากสูงกวา"
 excavation4: "การขุดเจาะ IV"
 excavation4_desc: "การทําใหกระบวนการสําคัญเปนระบบอัตโนมัติและความกาวหนาดานกลศาสตรทําใหแหลงทรัพยากรทั้งหมดของเรามีประสิทธิภาพมากขึ้นอยางมาก"
 excavation5: "การขุดเจาะ V"
 excavation5_desc: "ความกาวหนาในสาขาตางๆ เชน การทําเหมืองผิวดิน ชวยใหเราไดผลผลิตทรัพยากรมากขึ้นจากแหลงสกัดที่มีอยู"
 excavation_tech: "เทคโนโลยีการขุดเจาะ"
 electronic_mechanical_engineering: "วิศวกรรมเครื่องกลอิเล็กทรอนิกส"
 electronic_mechanical_engineering_desc: "เราอยูในยุคที่เครื่องจักรไฟฟาไมไดเพียงใหความอบอุนและแสงสวางแกเราอีกตอไป แตยังชวยใหเราคิดและสื่อสาร อิเล็กทรอนิกสจะเปนกุญแจสําคัญของขาวกรองทางทหารในศตวรรษที่จะมาถึง"
 radio: "วิทยุ"
 radio_desc: "การนําสิ่งประดิษฐของนักวิทยุสมัครเลนมาใชและการขยายการใชวิทยุ FM จะลดการรบกวนสัญญาณวิทยุ และชวยใหเราคนพบการใชงานใหมๆ ของเทคโนโลยีวิทยุ"
 improved_radio: "วิทยุปรับปรุง"
 improved_radio_desc: "การปรับปรุงความแรงของสัญญาณทําใหวิทยุสามารถกระจายเสียงไดไกลกวาเดิม"

 advanced_radio: "วิทยุขั้นสูง"
 advanced_radio_desc: "ความกาวหนาของเทคโนโลยีวิทยุชวยเพิ่มระยะของวิทยุ และทําใหบางเครื่องมีขนาดเล็กพอจะพกพาได บางคนเรียกมันวาวิทยุวอลกกี้ทอลกกี้"
 radio_detection: "เรดาร"
 radio_detection_sp_2_tt: "$coordination_bonus$: §G+2%§!\n$MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+20%§!"
 radio_detection_desc: "การพัฒนาเรดาร (RADAR - Radio Detection and Ranging) ชวยใหใชคลื่นวิทยุตรวจจับวัตถุทางกายภาพได การวิจัยนี้เปนความลับอยางยิ่ง เมื่อพิจารณาถึงผลกระทบที่สิ่งประดิษฐเหลานี้อาจมีตอการระบุตําแหนงหนวย"
 radio_detection_unlock_tt: "ปลดล็อกไดเมื่อการวิจัยทดลอง §Y$sp_air_radar$§! ใน §Y$land_facility$§! เสร็จสิ้น"
 cavity_magnatron: "แมกนีตรอนแบบโพรง"
 cavity_magnatron_desc: "ดวยหลอดที่สรางไมโครเวฟที่เรียกวาแมกนีตรอนแบบโพรง เราสามารถปรับปรุงความสามารถของระบบเรดารที่มีอยูในการตรวจจับวัตถุดวยการสะทอนคลื่นจากวัตถุไดอยางมาก"
 improved_cavity_magnatron: "เรดารยานเดซิเมตรปรับปรุง"
 improved_cavity_magnatron_desc: "การใชเรดารพิสูจนแลววามีความสําคัญยิ่ง แตชุดเรดารยานเดซิเมตรของเรามีนอยเกินกวาจะครอบคลุมไดดี การติดตั้งเรดารใหหนวยมากขึ้นจะชวยใหเราใชความไดเปรียบทางเทคโนโลยีไดเต็มที่"
 centimetric_radar: "เรดารยานเซนติเมตร"
 centimetric_radar_desc: "เรดารใหมที่ทํางานในยานไมโครเวฟชวยใหเราตรวจจับวัตถุที่เล็กเกินกวาเรดารรุนกอนจะจับได"
 phased_array: "เรดารแถวลําดับเฟส"
 phased_array_desc: "ตางจากเรดารแบบดั้งเดิมที่อาศัยการหมุนเชิงกล เรดารแถวลําดับเฟสใชอิเล็กทรอนิกสในการบังคับลําคลื่น ทําใหสามารถทํางานหลายอยางพรอมกันได เชน การติดตามหลายเปาหมาย"
 monopulse_radar: "เรดารโมโนพัลส"
 monopulse_radar_desc: "ดวยเรดารโมโนพัลส เราสามารถระบุทิศทางของเปาหมายไดโดยการเปรียบเทียบสัญญาณจากเสาอากาศหลายตน ชวยปรับปรุงการตรวจจับ"
 mechanical_computing: "การคํานวณเชิงกล"
 mechanical_computing_desc: "การสรางเครื่องจักรที่สามารถวิเคราะหเชิงอนุพันธขั้นสูงไดจะเปลี่ยนแปลงรูปแบบการคํานวณโดยอาศัยเครื่องจักรอยางถึงราก"
 computing_machine: "เครื่องคํานวณ"
 computing_machine_desc: "การวางรากฐานทางทฤษฎีของคอมพิวเตอรสมัยใหมและการสรางเครื่องจักรไฟฟาเครื่องกลเพื่อเริ่มนําไปใชจริง จะเปนกาวแรกสูโลกแหงความเปนไปไดนี้"
 improved_computing_machine: "เครื่องคํานวณปรับปรุง"
 improved_computing_machine_desc: "ขณะนี้สามารถสรางคอมพิวเตอรดิจิทัลอิเล็กทรอนิกสที่โปรแกรมไดแลว แมจะยังมีราคาแพงและขนาดใหญ แตเครื่องเหลานี้ชวยใหวิเคราะหขาวกรองไดเกินกวาขีดความสามารถของมนุษย"
 advanced_computing_machine: "เครื่องคํานวณขั้นสูง"
 advanced_computing_machine_desc: "การเริ่มพัฒนาคอมพิวเตอรที่สามารถเก็บโปรแกรมและใชทรานซิสเตอรได จะนําเราเขาสูเสนทางของการปฏิวัติดิจิทัล ซึ่งเครื่องจักรเหลานี้อาจถูกใชในแทบทุกสาขา"
 basic_encryption: "การเขารหัส - รหัสแทนที่หลายตัวอักษร"
 basic_encryption_desc: "วิธีการสื่อสารแบบใหมมาพรอมความเสี่ยงใหมในการถูกดักฟง เครื่องเขารหัสแบบโรเตอรสามารถใชเขารหัสที่ซับซอนไดอยางรวดเร็ว"
 improved_encryption: "การเขารหัส - การเรียงสับเปลี่ยนแบบวัฏจักร"
 improved_encryption_desc: "ขอจํากัดดานความสุมของเครื่องเขารหัสอาจถูกใชประโยชนเพื่อถอดรหัสได ดวยการเพิ่มความสุมของกลไกโรเตอร เราสามารถทําใหการวิเคราะหรหัสแบบนี้ยากขึ้น"
 advanced_encryption: "การเขารหัส - การมอดูเลตรหัสพัลส"
 advanced_encryption_desc: "ความกาวหนาทางเทคโนโลยีและประสบการณที่ไดมาอยางยากลําบากชวยใหเรานํามาตรการรักษาความปลอดภัยการไหลของขอมูลมาใชในการสื่อสารไดมากขึ้น"
 basic_decryption: "การถอดรหัส - การวิเคราะหความถี่"
 basic_decryption_desc: "การวิเคราะหรหัสกําลังกลายเปนวิทยาศาสตรคณิตศาสตรขั้นสูงมากขึ้นเรื่อยๆ ระบบอยางบัตรรายการและอุปกรณอยางไซโคลมิเตอรสามารถชวยงานที่จําเปนได"
 improved_decryption: "การถอดรหัส - การโจมตีชองทางขางเคียง"
 improved_decryption_desc: "การพัฒนาคอมพิวเตอรที่ซับซอนยิ่งขึ้นเปดโอกาสใหนําวิธีการวิเคราะหรหัส เชน การหาผลตาง มาประยุกตใชในรูปแบบใหม ซึ่งเมื่อผสานกับวิธีการถอดรหัสดวยมือแบบใหม ก็สามารถใชถอดรหัสขั้นสูงได"
 advanced_decryption: "การถอดรหัส - การอนุมานอัตโนมัติ"
 advanced_decryption_desc: "พลังการคํานวณที่เพิ่มขึ้นซึ่งชวยพัฒนาการวิเคราะหรหัสของเรามาจนถึงตอนนี้ อาจสรางรหัสที่แทบถอดไมไดในอนาคต เพื่อรักษาความไดเปรียบ เราตองเตรียมพรอมที่จะเรงหาขอมูลวงในเกี่ยวกับเทคโนโลยีนี้อยางแข็งขันยิ่งขึ้น"
 experimental_rockets: "จรวดทดลอง"
 experimental_rockets_desc: "การพัฒนาวิทยาการจรวดดวยการปรับปรุงพิสัยและความนาเชื่อถือของจรวดเชื้อเพลิงเหลว จะสอนใหเรารูจักเทคโนโลยีนี้มากพอที่จะสรางฐานยิงสําหรับรุนที่กาวหนากวาได"
 rocket_engines: "เครื่องยนตจรวด"
 rocket_engines_desc: "ความรูดานระบบขับเคลื่อนจรวดกําลังมาถึงจุดที่เราสามารถสรางระเบิดบินไดและอากาศยานขับเคลื่อนดวยจรวด ซึ่งทํางานดวยความเร็วที่ไมเคยไปถึงมากอน"
 improved_rocket_engines: "เครื่องยนตจรวดปรับปรุง"
 improved_rocket_engines_desc: "ขีปนาวุธทิ้งตัวพิสัยไกลรุนแรกสามารถสรางขึ้นและพัฒนาใหแมนยํายิ่งขึ้นเรื่อยๆ ไปถึงเมืองขาศึกที่หางไกลและแมแตออกสูอวกาศ"
 advanced_rocket_engines: "เครื่องยนตจรวดขั้นสูง"
 advanced_rocket_engines_desc: "อนาคตของวิทยาการจรวดเปดความเปนไปไดอยางขีปนาวุธขามทวีป ซึ่งพิสัยแทบไรขีดจํากัด ขณะที่หัวรบก็รายแรงยิ่งขึ้น"
 atomic_research: "การวิจัยปรมาณู"
 atomic_research_desc: "ในปฏิกิริยานิวเคลียรฟชชัน การแยกอะตอมใหพลังงานมหาศาลและอานุภาพทําลายลางอยางไรขีดจํากัด"
 rocket_interceptor: "เครื่องบินสกัดกั้นจรวด"
 rocket_interceptor_desc: "เครื่องบินสกัดกั้นขับเคลื่อนดวยจรวดที่พัฒนาจากเครื่องรอนสามารถบินไดเร็วกวาเครื่องบินอื่นใดในชวงเวลาสั้นๆ แมความไมเสถียรของเชื้อเพลิงจะทําใหเครื่องบินมีความเสี่ยง แตก็สามารถขึ้นบินและตอบโตการโจมตีไดเร็วกวาที่ขาศึกคาดไว"
 rocket_interceptor_2: "เครื่องบินสกัดกั้นจรวด II"
 rocket_interceptor_2_desc: "แมยังถือวาอันตรายอยางยิ่งในการใชงาน แตขณะนี้เครื่องบินขับไลขับเคลื่อนดวยจรวดไดรับความชวยเหลือจากระบบนํารองอัตโนมัติและการลากจูงโดยอากาศยานอื่น เพื่อใชความเร็วสุดขีดใหคุมคาที่สุดภายในชวงเวลาเชื้อเพลิงอันสั้น"
 rocket_interceptor_3: "เครื่องบินสกัดกั้นจรวด III"
 rocket_interceptor_3_desc: "เทคนิคการลงจอดแบบใหมและระบบเชื้อเพลิงที่ปลอดภัยขึ้นชวยเพิ่มโอกาสความสําเร็จและการรอดชีวิตของเครื่องบินขับไลจรวดอยางมาก ทําใหศักยภาพที่ครั้งหนึ่งเปนเพียงทฤษฎีของยานลํ้าสมัยเหลานี้กลายเปนจริง"
 nukes: "ระเบิดนิวเคลียร"
 nukes_desc: "โครงการสรางระเบิดปรมาณูจะเปนหนึ่งในภารกิจที่เปนความลับและยากที่สุดที่ประเทศหนึ่งจะดําเนินการได แตหากสําเร็จ อาจเปลี่ยนไมเพียงทิศทางของสงครามในปจจุบัน แตรวมถึงอนาคตของโลกดวย"
 interwar_artillery: "ปนใหญชวงระหวางสงคราม"
 interwar_artillery_desc: "บทเรียนที่ไดจากการพัฒนาปนใหญแบบตางๆ สามารถนําไปประยุกตใชขามกันในการออกแบบปนชนิดอื่น"
 artillery1: "ปนใหญ I"
 artillery1_desc: "ดวยวัสดุและกลไกที่ทันสมัยยิ่งขึ้น ปนใหญฮาวอิตเซอรและปนใหญสนามจากมหาสงครามสามารถดัดแปลงรังเพลิงและปรับใหทันสมัยสําหรับสงครามยุคใหม"
 artillery2: "การอัปเกรดปนใหญปรับปรุง I"
 artillery2_desc: "การอัปเกรดปนเกาพาเราไปไดเพียงเทานั้น จําเปนตองมีแบบปนฮาวอิตเซอรใหมที่ใชประโยชนจากระบบรับแรงถอยแบบไฮดรอลิกใหมและลํากลองที่ยาวขึ้น"
 artillery3: "การอัปเกรดปนใหญปรับปรุง II"
 artillery3_desc: "เพื่อใหปนที่หนักขึ้นติดตั้งบนแครที่เบาลงได สามารถเพิ่มเบรกปากลํากลองเขาไปในแบบปนฮาวอิตเซอร"
 artillery4: "ปนใหญ IV"
 artillery4_desc: "การพัฒนาปนใหญนํ้าหนักเบาที่ถอดแยกเพื่อขนสงได จะทําใหนําการสนับสนุนจากปนใหญไปยังพื้นที่ที่เคยเขาถึงไดยากได"
 artillery5: "การอัปเกรดปนใหญขั้นสูง"
 artillery5_desc: "แบบปนใหญที่มีรูปทรงเตี้ยลงจะทําใหขาศึกเล็งเปาไดยากขึ้น"
 mountain_gun: "ปนใหญภูเขา"
 mountain_gun_desc: "ภูมิประเทศภูเขานําไปสูการพัฒนาปนใหญที่ถอดแยกชิ้นสวนและบรรทุกบนหลังลอไปยังทุกที่ที่ตองการได"
 rocket_artillery2: "การอัปเกรดปนใหญจรวด I"
 rocket_artillery2_desc: "ปนใหญอัตตาจรที่ใชจรวดหลายลูกจะสามารถสรางความเสียหายวงกวางไดอยางรวดเร็ว ขณะที่ยังคงความคลองตัวเพื่อหลบการยิงตอบโต"
 rocket_artillery3: "การอัปเกรดปนใหญจรวด II"
 rocket_artillery3_desc: "ดวยการแลกพิสัยกับอานุภาพ เราสามารถติดตั้งจรวดที่หนักขึ้นบนยานพาหนะที่ใหญขึ้น เมื่อปฏิบัติการเปนทีม กองรอยปนใหญเหลานี้จะรวมมือกันบรรจุกระสุนใหมและยายตําแหนงไดอยางรวดเร็ว"
 rocket_artillery4: "ปนใหญจรวด III"
 rocket_artillery4_desc: "จรวดที่ทรงตัวดวยการหมุนสามารถเพิ่มพิสัยของกองรอยปนใหญขนาดเบาได"
 interwar_antiair: "ปนตอสูอากาศยาน"
 antiair1: "การอัปเกรดปนตอสูอากาศยาน"
 antiair1_desc: "ดวยกลไกการบรรจุกระสุนที่เร็วขึ้น ปนตอสูอากาศยานที่ใชกระสุนขนาดใหญก็ยังคงรักษาอัตราการยิงที่จําเปนไวได"
 antiair2: "ปนตอสูอากาศยาน II"
 antiair2_desc: "เพื่อเล็งเปาอากาศยานที่บินสูง ปนตอสูอากาศยานจําเปนตองมีปลอกกระสุนและลํากลองที่ยาวขึ้น"
 antiair3: "การอัปเกรดปนตอสูอากาศยานปรับปรุง I"
 antiair3_desc: "เมื่อระบบเรดารพัฒนาขึ้น การใชเรดารกําหนดทิศทางปนตอสูอากาศยานก็เปนไปไดมากขึ้น การกาวทันเทคโนโลยีนี้จะทําใหเราสรางระบบตอสูอากาศยานที่แมนยําที่สุดชนิดหนึ่งได"
 antiair4: "การอัปเกรดปนตอสูอากาศยานปรับปรุง II"
 antiair4_desc: "การผสานระบบเรดาร ระบบคอมพิวเตอร และเครื่องบรรจุกระสุนอัตโนมัติสมัยใหมเขาดวยกัน จําเปนตอการตอบโตอากาศยานที่เร็วขึ้นไดอยางรวดเร็ว"
 antiair5: "ปนตอสูอากาศยาน V"
 antiair5_desc: "ขีปนาวุธพื้นสูอากาศคืออนาคตของการสงครามตอสูอากาศยาน การพัฒนาฐานยิงเคลื่อนที่สําหรับขีปนาวุธเหลานี้ควรเปนเปาหมายตอไปของเรา"
 interwar_antitank: "ปนตอสูรถถัง"
 antitank1: "การอัปเกรดปนตอสูรถถัง"
 antitank1_desc: "ความสําคัญของอาวุธตอสูรถถังที่มีประสิทธิภาพไดรับการพิสูจนแลวในมหาสงคราม การนําอาวุธเหลานี้รุนใหมมาใชจะจําเปนตอการตอกรกับรถถังแบบสมัยใหม"
 antitank2: "ปนตอสูรถถัง II"
 antitank2_desc: "ปนตอสูรถถังสวนใหญจนถึงตอนนี้ยังคอนขางเบา จําเปนตองมีปนขนาดลํากลองใหญขึ้นเพื่อตอกรกับรถถังที่หนักขึ้นซึ่งมีเกราะลาดเอียง"
 antitank3: "การอัปเกรดปนตอสูรถถังปรับปรุง I"
 antitank3_desc: "กระสุน HEAT (หัวรบระเบิดแรงสูงตอตานรถถัง) สามารถใชกับปนใหญตอสูรถถังเพื่อชดเชยความเร็วตนที่จํากัด"
 antitank4: "การอัปเกรดปนตอสูรถถังปรับปรุง II"
 antitank4_desc: "ปนตอสูรถถังอเนกประสงคแบบใหมที่ใชกระสุนเจาะเกราะแบบสลัดปลอก สามารถเจาะเกราะของรถถังไดแทบทุกคัน"
 antitank5: "ปนตอสูรถถัง V"
 antitank5_desc: "ดวยการผสานเทคโนโลยีกระสุนแบบใหมหลากชนิดเขากับปนที่มีความเร็วตนสูงขึ้น เราจะพรอมรับมือเกราะแบบใหมใดๆ ที่ศัตรูอาจพัฒนาขึ้น"
 air_superiority: "ความเหนือกวาทางอากาศ"
 air_superiority_desc: "การครองความเหนือกวาทางอากาศจะทําใหขาศึกใชเครื่องบินทิ้งระเบิดโจมตีประเทศของเราไดยากขึ้น และเปดทางใหเครื่องบินทิ้งระเบิดของเราโจมตีศัตรูได"
 formation_flying: "การบินเปนหมู"
 formation_flying_desc: "การบินเปนหมูทําใหเครื่องบินสนับสนุนกันและกันหรือรวมมือกันโจมตีขาศึกได"
 air_offense: "การคุมกันดวยเครื่องบินขับไล"
 air_offense_desc: "เมื่อเนนการทิ้งระเบิดในเวลากลางวัน เราตองปกปองเครื่องบินทิ้งระเบิดจากเครื่องบินขับไลสกัดกั้น การฝกนักบินขับไลใหทํางานใกลชิดกับเครื่องบินทิ้งระเบิดจะเพิ่มขีดความสามารถในการรบเมื่อคุมกันเครื่องบินทิ้งระเบิดในนานฟาขาศึก"
 fighter_baiting: "การลอเหยื่อดวยเครื่องบินขับไล"
 fighter_baiting_desc: "ดวยการทําทีวาออนแอ เครื่องบินขับไลของเราสามารถลออากาศยานขาศึกเขาสูกับดักซุมโจมตีได"
 dogfighting_experience: "ประสบการณการรบประชิดทางอากาศ"
 dogfighting_experience_desc: "การติดตามตําแหนงสัมพัทธของฝายเราและฝายขาศึกทามกลางความโกลาหลของการรบประชิดทางอากาศนั้นไมงาย แตเมื่อนักบินของเรามีประสบการณมากขึ้น พวกเขาก็จะชํานาญมากขึ้น"
 fighter_ace_initiative: "โครงการยอดนักบินขับไล"
 fighter_ace_initiative_desc: "การมอบรางวัลและสถานะพิเศษแกนักบินที่ไดเปนยอดนักบินดวยการยิงขาศึกตกหาลํา ชวยกระตุนใหกลาเสี่ยงและสรางความรูสึกเปนชนชั้นยอดในหมูยอดนักบิน แมวาวิธีนี้มักทําใหนักบินที่มีประสบการณยังคงอยูในตําแหนงรบตอไป"
 multialtitude_flying: "การบินหลายระดับความสูง"
 multialtitude_flying_desc: "การรบทางอากาศเกิดขึ้นในสามมิติ แตนักบินสวนใหญติดตามเครื่องบินที่บินอยูเหนือหรือใตตนไดยากกวา เราสามารถใชประโยชนจากขอนี้ดวยการกระจายหมูบินในแนวดิ่ง"
 offensive_formations: "หมูบินเชิงรุก"
 offensive_formations_desc: "การฝกในรูปหมูบินที่เนนการรุกมากขึ้นทําใหเครื่องบินขับไลของเรามีอานุภาพรายแรงยิ่งขึ้นในการรบ"
 fighter_sweeps: "การกวาดลางดวยเครื่องบินขับไล"
 fighter_sweeps_desc: "การลาดตระเวนเชิงรุกของเครื่องบินขับไลเหนือดินแดนขาศึกอาจจับเครื่องบินขาศึกไดขณะขึ้นหรือลงจอด ซึ่งเปนชวงที่ออนแอเปนพิเศษ หรือกอกวนเที่ยวบินฝกของขาศึก"
 force_rotation: "การหมุนเวียนกําลัง"
 force_rotation_desc: "การรบหรือแมแตการจดจออยางหนักเปนเวลานานนั้นเหนื่อยลา แตดวยการสับเปลี่ยนกําลังใหมเขามาทุกครั้งที่ทําได เราจะลดความผิดพลาดที่เกิดจากความเหนื่อยลาของนักบินได"
 air_defence: "การปองกันทางอากาศ"
 air_defence_desc: "การฝกนักบินใหคอยระวังเหตุตลอดเวลา แมในยามที่ดูเหมือนไมมีอันตราย จะเพิ่มโอกาสในการสกัดกั้นเครื่องบินขาศึก"
 dispersed_fighting: "การรบแบบกระจายกําลัง"
 dispersed_fighting_desc: "การใชหมูบินแบบกระจายมากขึ้นทําใหเครื่องบินจํานวนเทาเดิมลาดตระเวนครอบคลุมพื้นที่ไดกวางขึ้น"
 forward_interception: "การสกัดกั้นสวนหนา"
 forward_interception_desc: "การปฏิบัติการใกลนานฟาขาศึกมากขึ้นทําใหเครื่องบินขับไลของเรามีโอกาสสกัดกั้นเครื่องบินขาศึกไดกอนที่จะไปถึงเปาหมาย"
 fighter_veteran_initiative: "โครงการนักบินขับไลทหารผานศึก"
 fighter_veteran_initiative_desc: "การเนนใหนักบินรอดชีวิตในระยะยาว ทั้งดวยยุทธวิธีที่รอบคอบและดวยการหมุนเวียนนักบินที่มีประสบการณไปเปนครูฝก หมายความวาพวกเขาจะถายทอดบทเรียนที่ไดเรียนรูใหแกนักบินใหมได"
 formation_fighting: "การรบเปนหมูบิน"
 formation_fighting_desc: "การบินในรูปหมูที่เหมาะสมทําใหนักบินของเราคุมกันจุดบอดของกันและกัน สงผลใหตรวจพบเครื่องบินขาศึกไดดีขึ้น"
 air_skirmish: "การปะทะประปรายทางอากาศ"
 air_skirmish_desc: "นาเสียดายที่เราไมอาจทําลายเครื่องบินขาศึกทุกลําที่พบเหนือประเทศของเราไดเสมอไป แตเราสามารถรังควานพวกมันตั้งแตวินาทีที่ถูกพบจนถึงวินาทีที่จากไป บั่นทอนพวกมันอยางตอเนื่อง"
 home_defence: "การปองกันมาตุภูมิ"
 home_defence_desc: "ผูตรวจการณภาคพื้นดิน ตลอดจนสถานีตรวจจับและดักฟง ทํางานประสานกับกองทัพอากาศของเราเพื่อติดตามและทําลายการรุกลํ้าของขาศึก"
 battlefield_destruction: "การทําลายลางในสนามรบ"
 battlefield_destruction_desc: "แมกองทัพอากาศจะโจมตีประเทศขาศึกที่อยูหางไกลได แตก็ยังมีประโยชนอยางยิ่งในการสนับสนุนกองทัพบกในการรบโดยตรง"
 dive_bombing: "การทิ้งระเบิดแบบดิ่ง"
 dive_bombing_desc: "การทิ้งระเบิดแบบดิ่งใหความแมนยําสูงกวา แตเพื่อผลลัพธที่ดีที่สุด ตองใชอากาศยานเฉพาะทางที่ทั้งชะลอการดิ่งไดและทนแรงเคนจากการดึงเครื่องขึ้นได"
 direct_ground_support: "การสนับสนุนภาคพื้นดินโดยตรง"
 direct_ground_support_desc: "การประสานงานอยางใกลชิดระหวางนักบิน CAS กับผูตรวจการณภาคพื้นดินทําใหกําหนดทิศทางอํานาจการยิงทางอากาศไดอยางแมนยําเพื่อชวยเหลือทหารในการรบไดดีที่สุด"
 bomber_veteran_initiative: "โครงการนักบินทิ้งระเบิดทหารผานศึก"
 bomber_veteran_initiative_desc: "นโยบายใหนักบินทหารผานศึกถายทอดความรูแกนักบินใหมชวยเพิ่มโอกาสรอดชีวิตของพวกเขาไดอยางมาก"
 bomber_ace_initiative: "โครงการยอดนักบินทิ้งระเบิด"
 bomber_ace_initiative_desc: "การยกยองและใหรางวัลแกยอดนักบินทิ้งระเบิดอยางเปนทางการชวยสงเสริมความกลาหาญและความริเริ่ม"
 cas_veteran_initiative: "โครงการนักบินโจมตีภาคพื้นดินทหารผานศึก"
 cas_veteran_initiative_desc: "นโยบายใหนักบินทหารผานศึกถายทอดความรูแกนักบินใหมชวยเพิ่มโอกาสรอดชีวิตของพวกเขาไดอยางมาก"
 cas_ace_initiative: "โครงการยอดนักบินโจมตีภาคพื้นดิน"
 cas_ace_initiative_desc: "การยกยองและใหรางวัลแกยอดนักบิน CAS อยางเปนทางการชวยสงเสริมความกลาหาญและความริเริ่ม"
 hunt_and_destroy: "ลาและทําลาย"
 hunt_and_destroy_desc: "นอกจากใหการยิงสนับสนุนโดยตรงแลว หนวย CAS ยังสามารถออกลาเปาหมายไดอยางอิสระ โดยมักโจมตีกองกําลังภาคพื้นดินของขาศึกอยางไมทันตั้งตัวขณะเคลื่อนตัวสูแนวหนา"
 naval_strike_torpedo_tactics: "ยุทธวิธีตอรปโดโจมตีทางทะเล"
 naval_strike_torpedo_tactics_desc: "การฝกนักบินใหโจมตีดวยตอรปโดไดแมนยําขึ้นจะทําใหการจูโจมทางอากาศตอเรือขาศึกมีประสิทธิภาพยิ่งขึ้น"
 naval_strike_torpedo_tactics_oi: "ยุทธวิธีตอรปโดโจมตีทางทะเล"
 naval_strike_torpedo_tactics_oi_desc: "การฝกนักบินใหโจมตีดวยตอรปโดไดแมนยําขึ้นจะทําใหการจูโจมทางอากาศตอเรือขาศึกมีประสิทธิภาพยิ่งขึ้น"
 naval_strike_tactics: "ยุทธวิธีโจมตีทางทะเล"
 naval_strike_tactics_desc: "การฝกนักบินใหคาดการณการเคลื่อนที่ของเรือและประสานการโจมตีจะทําใหการจูโจมทางอากาศตอเรือขาศึกมีประสิทธิภาพยิ่งขึ้น"
 low_echelon_support: "การสนับสนุนหนวยระดับลาง"
 low_echelon_support_desc: "การมอบหมายหนวย CAS ใหขึ้นตรงกับหนวยภาคพื้นดินขนาดเล็กโดยตรงทําใหหนวยเหลานั้นมีอํานาจการยิงเพิ่มเติมใหเรียกใชไดเสมอ แมอยูนอกระยะของปนใหญแบบดั้งเดิม"
 combat_unit_destruction: "การทําลายหนวยรบ"
 combat_unit_destruction_desc: "การฝกนักบิน CAS ใหโจมตีเปาหมายเดิมซํ้าจนกวาจะยืนยันไดวาถูกทําลาย ทําใหมั่นใจวาเปาหมายจะไมถูกปลอยทิ้งไวหลังจากการโจมตีที่พลาดไปเพียงเล็กนอย"
 operational_destruction: "การทําลายระดับยุทธการ"
 operational_destruction_desc: "การโจมตีเสนทางสงกําลังบํารุงของกองกําลังภาคพื้นดินขาศึกจะขัดขวางความสามารถในการเคลื่อนยายระหวางสนามรบ ซึ่งกลายเปนความไดเปรียบของกองทัพเราเมื่อปฏิบัติการในพื้นที่ที่เรามีความเหนือกวาทางอากาศ"
 infrastructure_destruction: "การทําลายโครงสรางพื้นฐาน"
 infrastructure_destruction_desc: "การฝกนักบินในวิธีที่ดีที่สุดในการโจมตีโครงสรางพื้นฐาน เชน ทางรถไฟและสะพาน ทําใหการทิ้งระเบิดทางยุทธวิธีมีประสิทธิภาพยิ่งขึ้น"
 logistical_bombing: "การทิ้งระเบิดเสนทางสงกําลังบํารุง"
 logistical_bombing_desc: "การเนนโจมตีเสนทางเสบียงของขาศึกจากทางอากาศมากขึ้น ทําใหกองกําลังภาคพื้นดินของเราในพื้นที่ไดเปรียบมากขึ้น"
 battlefield_support: "การสนับสนุนในสนามรบ"
 battlefield_support_desc: "เครื่องบินทิ้งระเบิดทางยุทธวิธีโจมตีเปาหมายใกลจุดที่กองกําลังภาคพื้นดินของเรากําลังรบไดยาก เนื่องจากการทิ้งระเบิดในแนวระดับแมนยํานอยกวาการทิ้งระเบิดแบบดิ่ง แตการฝกและการประสานงานกับผูตรวจการณภาคพื้นดินที่มากขึ้นสามารถชวยแกปญหาเหลานี้ได"
 carousel_bombing: "การทิ้งระเบิดแบบวนรอบ"
 carousel_bombing_desc: "เครื่องบินทิ้งระเบิดมักตองการทิ้งระเบิดทั้งหมดทันทีที่ถึงพื้นที่เปาหมายแลวบินกลับฐานโดยเร็วที่สุด แมวิธีนี้จะไดผลกับการทิ้งระเบิดปูพรม แตเมื่อตองโจมตีเปาหมายขนาดเล็ก การวนอยูเหนือเปาหมายและทิ้งระเบิดทีละสวนจะไดผลดีกวาเพื่อความแมนยําสูงสุด"
 keypoint_bombing: "การทิ้งระเบิดจุดสําคัญ"
 keypoint_bombing_desc: "การทิ้งระเบิดอยางแมนยําใสจุดสําคัญในสนามรบเพื่อสนับสนุนกองกําลังภาคพื้นดินของเรา จะชวยใหพวกเขาเอาชนะขาศึกไดอยางมาก"
 ground_support_integration: "การบูรณาการการสนับสนุนภาคพื้นดิน"
 ground_support_integration_desc: "การบูรณาการกําลังเครื่องบินทิ้งระเบิดทางยุทธวิธีเขากับผูตรวจการณภาคพื้นดินอยางสมบูรณ ทั้งเพิ่มความแมนยําและชวยใหสนับสนุนกองกําลังภาคพื้นดินของเราในการรบไดโดยตรง"
 strategic_destruction: "การทําลายเชิงยุทธศาสตร"
 strategic_destruction_desc: "นักบินของเราเขาถึงเปาหมายทางยุทธศาสตรไดเร็วกวากองกําลังทางเรือหรือทางบกมาก เมื่อขาศึกไมมีหนทางติดอาวุธใหทหารใหม เราจะมีจํานวนเหนือกวากองกําลังขาศึกในไมชา"
 high_level_bombing: "การทิ้งระเบิดจากเพดานบินสูง"
 high_level_bombing_desc: "จากระดับความสูงที่มากขึ้น เราสามารถหลีกเลี่ยงการปะทะทางอากาศและอาวุธตอสูอากาศยานไดบางสวน การทิ้งระเบิดจากที่สูงตองอาศัยความแมนยํามากขึ้น แตปลอดภัยกวา"
 massed_bomber_formations: "หมูบินทิ้งระเบิดขนาดใหญ"
 massed_bomber_formations_desc: "ดวยการรักษารูปหมูบิน เครื่องบินทิ้งระเบิดของเราสามารถปองกันกลุมของตนและเพิ่มโอกาสทิ้งระเบิดไดสําเร็จ"
 night_bombing: "การทิ้งระเบิดเวลากลางคืน"
 night_bombing_desc: "เมื่อการปองกันของขาศึกลดลงและเครื่องบินทิ้งระเบิดของเราไดความมืดคอยปกปด เราจะรุกไดอยางมีประสิทธิภาพตลอดวันตลอดคืน แสดงใหขาศึกเห็นวาเรามุงมั่นไมลดละเพียงใด\n\n"
 dead_reckoning_bombing: "การทิ้งระเบิดดวยการคํานวณตําแหนง"
 dead_reckoning_bombing_desc: "ดวยการวัดความเร็ว ทิศทาง และการเลื่อนลอยจากตําแหนงกอนหนา เราสามารถคํานวณการทิ้งระเบิดไดแมนยํายิ่งขึ้นแมในเวลากลางคืน"
 infiltration_bombing: "การทิ้งระเบิดแบบแทรกซึม"
 infiltration_bombing_desc: "การเขารวมหมูบินขาศึกหรือบินตามพวกมันกลับฐานอาจดูเหมือนบาบิ่น แตดวยการฝกฝนที่เพียงพอ สิ่งนี้เปนไปไดโดยสิ้นเชิง"
 pathfinder_groups: "กลุมนําทาง"
 pathfinder_groups_desc: "นักบินทหารผานศึกไดรับเครื่องมือที่ดีที่สุดในการสองสวางตําแหนงเปาหมาย ไมมีควันหรือสภาพอากาศเลวรายใดหยุดเครื่องบินทิ้งระเบิดจากการปฏิบัติภารกิจได"
 day_bombing: "การทิ้งระเบิดเวลากลางวัน"
 day_bombing_desc: "ความพยายามที่มุงเนนในเวลากลางวันสรางความเสียหายรายแรงเพราะไดเปรียบอยางมากดานทัศนวิสัย การแสดงแสนยานุภาพเปนผลพลอยไดที่นายินดี\n\n"
 escort_relay_system: "ระบบคุมกันแบบผลัดเปลี่ยน"
 escort_relay_system_desc: "เครื่องบินทิ้งระเบิดที่มีเครื่องบินขับไลคุมกันชวยเพิ่มความสามารถในการตอบโตการยิงของขาศึกไดอยางมาก"
 flying_fortress: "ปอมบินได"
 flying_fortress_desc: "ติดตั้งปนใหเครื่องบินทิ้งระเบิดหนักที่บินสูงของเราเพื่อปองกันตนเอง พรอมเกราะที่เพียงพอจะทนการโจมตีและยังกลับถึงฐานได"
 mass_destruction: "การทําลายลางครั้งใหญ"
 mass_destruction_desc: "เครื่องบินทิ้งระเบิดติดอาวุธที่รายแรงที่สุดในปริมาณมาก รับประกันผลลัพธแมจะมีนักบินของเราฝาเขาไปไดเพียงไมกี่นาย"
 fleet_in_being: "กองเรือคงกําลัง"
 fleet_in_being_desc: "เรือจะอยูในทาซึ่งปลอดภัยกวา และจะเขาปะทะขาศึกเฉพาะในจังหวะที่เหมาะสมเทานั้น การมีอยูของเรือเราจะทําใหขาศึกลังเลที่จะยึดทาเรือของเรามากขึ้น\n\n"
 battlefleet_concentration: "การรวมกําลังกองเรือรบ"
 battlefleet_concentration_desc: "เรียกเรือใกลเคียงเขามาทันทีที่พบเรือขาศึก การยิงรวมเปาที่ประสานกันจะทําใหเรือขาศึกหมดสภาพอยางรวดเร็ว ไลลาพวกมันทีละลํา"
 battlefleet_concentration_ti: "การรวมกําลังกองเรือรบ"
 battlefleet_concentration_ti_desc: "เรียกเรือใกลเคียงเขามาทันทีที่พบเรือขาศึก การยิงรวมเปาที่ประสานกันจะทําใหเรือขาศึกหมดสภาพอยางรวดเร็ว ไลลาพวกมันทีละลํา"
 subsidiary_carrier_role: "บทบาทรองของเรือบรรทุกเครื่องบิน"
 subsidiary_carrier_role_desc: "เรือบรรทุกเครื่องบินสนับสนุนเรือประจัญบาน เพิ่มความพรอมในการเปลี่ยนจากการตั้งรับเปนการรุก ประโยชนของเรือบรรทุกเครื่องบินทั้งในฐานะดวงตาบนทองฟาและกําลังโจมตีเร็วอันทรงพลังชวยเสริมเรือประจัญบานที่ชากวาไดอยางดี"
 subsidiary_carrier_role_ti: "บทบาทรองของเรือบรรทุกเครื่องบิน"
 subsidiary_carrier_role_ti_desc: "เรือบรรทุกเครื่องบินสนับสนุนเรือประจัญบาน เพิ่มความพรอมในการเปลี่ยนจากการตั้งรับเปนการรุก ประโยชนของเรือบรรทุกเครื่องบินทั้งในฐานะดวงตาบนทองฟาและกําลังโจมตีเร็วอันทรงพลังชวยเสริมเรือประจัญบานที่ชากวาไดอยางดี"
 hunter_killer_groups: "กลุมลาสังหาร"
 hunter_killer_groups_desc: "เรือพิฆาตรวมกลุมกันเพื่อไลลาเรือดํานํ้าขาศึก ความพยายามรวมกันของผูเชี่ยวชาญดานการสอดแนมและการลาทําใหเกิดทีมสังหารที่ยอดเยี่ยม"
 floating_fortress: "ปอมปราการลอยนํ้า"
 floating_fortress_desc: "เมื่อเรือประจัญบานอยูในสถานะเตรียมพรอมสูงสุด เราจะพรอมตอบโตเสมอหากขาศึกกลาคุกคามนานนํ้าของเรา กองเรือใดๆ ตองมีรากฐานที่มั่นคง และอานุภาพของเรือประจัญบานนั้นไมมีใครเทียบได"
