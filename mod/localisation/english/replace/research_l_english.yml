 submarine_offensive: "การรุกดวยเรือดํานํ้า"
 submarine_offensive_desc: "การสื่อสารระหวางเรือดํานํ้าที่ถึงขีดสุดชวยใหพวกมันเปดฉากรุกได มาทําลายขบวนเรือลําเลียงสินคาของขาศึกใหเร็วกวาที่พวกมันจะทดแทนได"
 submarine_offensive_bs: "การรุกดวยเรือดํานํ้า"
 submarine_offensive_bs_desc: "การสื่อสารระหวางเรือดํานํ้าที่ถึงขีดสุดชวยใหพวกมันเปดฉากรุกได มาทําลายขบวนเรือลําเลียงสินคาของขาศึกใหเร็วกวาที่พวกมันจะทดแทนได"
 trade_interdiction: "การสกัดกั้นการคา"
 trade_interdiction_desc: "ยิ่งเราพบเรือขาศึกเร็วเทาไร ก็ยิ่งทําลายไดเร็วเทานั้น โจมตีขบวนเรือลําเลียงสินคาของพวกมันแลวหลบหนีกอนที่จะทันตอบโต\n\n"
 unrestricted_submarine_warfare: "สงครามเรือดํานํ้าไมจํากัดขอบเขต"
 unrestricted_submarine_warfare_desc: "ปลอยใหเรือดํานํ้าของเราจมเรือทุกลําโดยไมเตือนลวงหนา ไมวาจะเปนเรือพลเรือนหรือไม แมบางคนจะมองวานี่เปนการละเมิดกฎแหงสงคราม แตก็ปฏิเสธไมไดถึงประสิทธิผลของมัน"
 wolfpacks: "ฝูงหมาปา"
 wolfpacks_desc: "เมื่อจัดเรือดํานํ้าเปนฝูง การประสานงานระหวางกันจะดีขึ้นอยางมาก เมื่อพบขาศึก เรือดํานํ้าของเราจะซุมรอจนกวาสวนที่เหลือของฝูงจะมาถึง และโจมตีเฉพาะเมื่อโอกาสเปนของเราอยางทวมทนเทานั้น"
 advanced_submarine_warfare: "สงครามเรือดํานํ้าขั้นสูง"
 advanced_submarine_warfare_desc: "การพัฒนาการสื่อสารระหวางเรือดํานํ้าอยางมหาศาลทําใหกําหนดจังหวะการโจมตีไดอยางสมบูรณแบบ เมื่อพวกมันเห็นเราในที่สุด ก็จะเปนตอนที่อยูบนเรือที่กําลังจม"
 combined_operations_raiding: "การจูโจมดวยปฏิบัติการรวม"
 combined_operations_raiding_desc: "ทุมทรัพยากรทั้งหมดเพื่อลาขบวนเรือลําเลียงสินคาของขาศึก การประสานงานระหวางกองเรือหลักกับเรือดํานํ้าทําใหกองเรือของเราตื่นตัวอยูเสมอ ไมมีเรือลําใดรอดพนสายตาในนานนํ้าของเรา"
 raider_patrols: "การลาดตระเวนจูโจม"
 raider_patrols_desc: "การลาดตระเวนของทั้งเรือความเร็วสูงและเรือติดปนหนักทําใหขบวนเรือลําเลียงสินคาของขาศึกไมมีที่ซอน \nไมใชแคเรือดํานํ้าเทานั้นที่ลาได"
 capital_ship_raiders: "การจูโจมดวยเรือหลัก"
 capital_ship_raiders_desc: "เมื่อเรือที่ทรงพลังที่สุดของเราออกลาขบวนเรือลําเลียงสินคา ขาศึกจะไมปลอดภัยดวยจํานวนอีกตอไป พวกมันเปนเพียงเปานิ่งที่ไดแตภาวนาไมใหเราพบตัว"
