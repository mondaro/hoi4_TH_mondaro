 #Non-MTG naval techs that require loc (they may be granted via effects)
 basic_heavy_cruiser: "เรือลาดตระเวนหนักพื้นฐาน (เรือลาดตระเวนหนัก II)"
 basic_ship_hull_carrier: "ตัวเรือบรรทุกเครื่องบินป 1936"
 early_carrier: "เรือบรรทุกเครื่องบินยุคแรก (เรือบรรทุกเครื่องบิน I)"
 basic_carrier: "เรือบรรทุกเครื่องบินพื้นฐาน (เรือบรรทุกเครื่องบิน II)"
 improved_destroyer: "เรือพิฆาตแบบปรับปรุง (เรือพิฆาต III)"
 basic_dp_light_battery: "ปนใหญเรืออเนกประสงคพื้นฐาน"
 basic_dp_light_battery_desc: "การรวมปนตอตานเรือและปนตอสูอากาศยานไวในแทนเดียวชวยเพิ่มความยืดหยุนและลดนํ้าหนัก\n\nการติดตั้งโมดูลนี้จะเพิ่ม §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก โมดูลเหลานี้ยังเพิ่ม §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! อีกดวย\nการติดตั้งโมดูล §Yปนใหญรอง§! จะทําให §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! หรือ §Y$ship_hull_heavy$§! ไดรับ §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! เล็กนอย และสามารถโจมตีเปาหมายที่สองได"
 improved_dp_light_battery: "ปนใหญเรืออเนกประสงคแบบปรับปรุง"
 improved_dp_light_battery_desc: "แทนปนแฝดแบบปดมิดชิดที่ขับเคลื่อนดวยกําลัง ชวยเพิ่มอํานาจการยิงและการปองกันอยางมากพรอมทั้งลดนํ้าหนัก\n\nการติดตั้งโมดูลนี้จะเพิ่ม §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก โมดูลเหลานี้ยังเพิ่ม §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! อีกดวย \nการติดตั้งโมดูล §Yปนใหญรอง§! จะทําให §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! หรือ §Y$ship_hull_heavy$§! ไดรับ §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! เล็กนอย และสามารถโจมตีเปาหมายที่สองได"
 advanced_dp_light_battery: "ปนใหญเรืออเนกประสงคขั้นสูง"
 advanced_dp_light_battery_desc: "แทนปนแบบปดยิงเร็วอัตโนมัติชวยเพิ่มอํานาจการยิงอยางมาก\n\nการติดตั้งโมดูลนี้จะเพิ่ม §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก โมดูลเหลานี้ยังเพิ่ม §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! อีกดวย \nการติดตั้งโมดูล §Yปนใหญรอง§! จะทําให §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! หรือ §Y$ship_hull_heavy$§! ไดรับ §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! เล็กนอย และสามารถโจมตีเปาหมายที่สองได"
 basic_dp_medium_battery: "ปนใหญเรืออเนกประสงคขนาดกลางขั้นสูง"
 basic_dp_medium_battery_desc: "ปนใหญเรือขนาดกลางแบบปด บรรจุกระสุนอัตโนมัติและยิงเร็ว ชวยเพิ่มอํานาจการยิงอยางมาก\n\nการติดตั้งโมดูล §Yปนใหญเรือขนาดกลางเบา§! จะเพิ่ม §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! ซึ่งชวยในการตอสูกับ §Yเรือคุมกัน§! ของขาศึก โมดูลนี้ยังเพิ่ม §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! อีกดวย"
 armored_train: "$train_equipment_3$"
 railway_gun: "$railway_gun_equipment_1$"
 basic_train: "$train_equipment_1$"
 special_forces_doctrine: "หลักนิยมกองกําลังพิเศษ"
 special_forces_doctrine_folder: "หลักนิยมกองกําลังพิเศษ"
 special_forces_doctrine_folder_desc: "วิธีการฝกกองกําลังพิเศษของเรา"
 MOUNTAINEERS_DOCTRINE_LABEL: "ทหารภูเขา"
 MARINES_DOCTRINE_LABEL: "นาวิกโยธิน"
 PARATROOPERS_DOCTRINE_LABEL: "พลรม"
 MOUNTAINEERS_DOCTRINE_DESC: "การมุงเนนทางทหารอยางจริงจังไปที่กรมทหารซึ่งคุนเคยกับภูมิประเทศที่ยากลําบาก จะทําใหเราไดเปรียบในการดําเนินกลยุทธเหนือกวาและสกัดกั้นฝายตรงขาม"
 MARINES_DOCTRINE_DESC: "กองนาวิกโยธินที่ไดรับการยกระดับจะทําใหไมมีชายฝงของขาศึกแหงใดปลอดภัย นาวิกโยธินชั้นยอดของเราเชี่ยวชาญการปฏิบัติการภายใตการระดมยิงในสถานการณที่เปนปฏิปกษที่สุด"
 PARATROOPERS_DOCTRINE_DESC: "การจูโจมทางอากาศคืออนาคตของการสงคราม การยกระดับพลรมจะทําใหเราไดการประสานกันอยางสมบูรณแบบระหวางแสนยานุภาพทางอากาศกับการโจมตีภาคพื้นดิน"
 RANGERS_DOCTRINE_LABEL: "หนวยจูโจมเรนเจอร"
 RANGERS_DOCTRINE_DESC: "ดวยความสามารถในการปฏิบัติการดวยกําลังขนาดใหญในพื้นที่ปาทึบ กองทัพของเราจะสามารถตีโอบและดําเนินกลยุทธเหนือกวากองกําลังขาศึกได"
 special_forces_mountaineers: "ยกระดับทหารภูเขา"
 special_forces_mountaineers_desc: "สภาพแวดลอมที่โหดรายและความขัดแยงอันขมขื่นดึงดูดทหารที่แกรงที่สุดมาสูกองกําลังชั้นยอดของเรา การบัญญัติความเปนเลิศของพวกเขาไวในปรัชญาหลักนิยมของเราจะทําใหเรายังคงไดรับประโยชนจากการคัดสรรผูที่ดีที่สุดตอไป"
 special_forces_paratroopers: "ยกระดับพลรม"
 special_forces_paratroopers_desc: "ไมมีสิ่งใดนาสะพรึงกลัวไปกวาทองฟาที่มืดมิดลงดวยเครื่องบินลําเลียงพลนับพันลํา ปรัชญาหลักนิยมของเราตองใชประโยชนจากความตื่นตระหนกและความหวาดหวั่นที่กองกําลังสงทางอากาศสรางขึ้น"
 special_forces_marines: "ยกระดับกองนาวิกโยธิน"
 special_forces_marines_desc: "กองนาวิกโยธินปฏิบัติหนาที่ในที่ซึ่งไมมีใครกลาไป ตั้งแตชายฝงบานเกิดจนถึงดินแดนตางแดน ผูเชี่ยวชาญเหลานี้เปนเลิศในการแทรกซึมและการรบสะเทินนํ้าสะเทินบก การเขาถึงที่กวางไกลและปรัชญาที่ยืดหยุนควรไดรับการบรรจุเปนแกนของหลักนิยมทางทหารของเรา"
 special_forces_rangers: "ยกระดับหนวยเรนเจอร"
 special_forces_rangers_desc: "ทหารราบเบาคือกุญแจสูความสําเร็จของเรา ธรรมเนียมการซุมยิงแมนและยุทธวิธีการแทรกซึมควรเปนแกนในการสรางกองกําลังชั้นยอดของเรา"
 ski_troops: "ผูเชี่ยวชาญการรบในอากาศหนาว"
 ski_troops_desc: "ผูเชี่ยวชาญการรบในอากาศหนาวมีความสําคัญยิ่งตอยุทธวิธีในสนามรบของเรา ดวยการรับรองผูเชี่ยวชาญเหลานี้อยางเปนทางการในธรรมนูญทางทหารของเรา เราจะสามารถจัดสรรทรัพยากรและการฝกเพื่อยกระดับพวกเขาใหสูงยิ่งขึ้นไปอีก"
 special_forces_recon: "ขาวกรองสนามรบ"
 special_forces_recon_desc: "กรมทหารชั้นยอดของเราไดรับประโยชนจากการตอตานขาวกรองและความตระหนักรูในสนามรบที่ไมเปนรองใคร การฝกเพิ่มเติมยอมเปนประโยชนตอเรายิ่งขึ้นไปอีก"
 gwtank: "รถถังยุคมหาสงคราม"
 basic_light_tank: "รถถังเบา I"
 armored_car1: "$gw_armored_car_equipment$"
 armored_car2: "$armored_car_equipment_1$"
 armored_car3: "$armored_car_equipment_2$"
 mountaineers_combat_1: "ยึดแนวไวใหมั่น"
 mountaineers_combat_1_desc: "กองกําลังชั้นยอดของเราตองมุงความพยายามไปที่การยึดรักษาพื้นที่ที่ตนเชี่ยวชาญ การผสมผสานยุทธวิธีซุมโจมตีกับการจัดระเบียบกรมทหารที่ดีขึ้นจะทําใหกองกําลังพิเศษของเราเปนแนวปองกันเชิงลึกที่แข็งแกรงตอกองกําลังผูรุกราน"
 mountaineers_combat_2: "ปนใหญภูเขา"
 mountaineers_combat_2_desc: "กรมทหารปนใหญภูเขาเปนกองกําลังเฉพาะทางที่ออกแบบมาเพื่อสนับสนุนกองพลชั้นยอดของเราในระยะไกลอยางรวดเร็ว โดยไดรับการฝกและปฏิบัติการในภูมิประเทศที่ยากลําบาก การมีอยูของพวกเขาชวยเสริมขีดความสามารถในการรบของกองกําลังพิเศษของเราอยางมาก"
 mountaineers_combat_3: "การฝกผสมเหลา"
 mountaineers_combat_3_desc: "แมกรมทหารชั้นยอดของเราจะปฏิบัติการอยางเปนอิสระสูง แตการเสริมหลักสูตรการฝกโดยเนนการปฏิบัติการผสมเหลาจะเพิ่มคุณคาของพวกเขาในสนามรบ"
 mountaineers_keystone_1: "กระดูกสันหลังของกองทัพ"
 mountaineers_keystone_1_desc: "ความสําเร็จของกองกําลังพิเศษชั้นยอดของเราเรียกรองใหมีการจัดปรัชญาทางทหารของเราใหมโดยมีพวกเขาเปนศูนยกลาง"
 mountaineers_keystone_2: "ครูฝกรวม"
 mountaineers_keystone_2_desc: "ดวยความรูที่กองกําลังภูเขาของเราสั่งสมมา คงเปนเรื่องโงเขลาหากไมนํามาใชใหเกิดประโยชนในเหลาอื่น ๆ ของกองกําลังพิเศษ เราจะจัดตั้งโครงการหมุนเวียนครูฝก โดยหวังวาจะยกระดับองคความรูโดยรวมของสถาบัน"
 paras_dispersed_drop: "การลาดตระเวนและการกอวินาศกรรม"
 paras_dispersed_drop_desc: "ลักษณะการปฏิบัติการของเรากําหนดใหกองกําลังสงทางอากาศของเราเชี่ยวชาญการโดดรมแบบกระจายตัวสูง ทําใหสามารถกอวินาศกรรมไดอยางมากกอนที่ขาศึกจะรูตัวดวยซํ้าวาเราอยูที่นั่น"
 paras_combat_drop: "การสงกําลังเขาสูการรบ"
 paras_combat_drop_desc: "แมจะอันตราย แตการฝกกองกําลังชั้นยอดของเราในเทคนิคการบุกเขาโดยตรงสามารถใหความไดเปรียบในการรบอยางมาก เมื่อใชรวมกับการโจมตีแบบดั้งเดิม"
 SF_PARAS_combat_effect_tt: "กองพลขาศึกในรัฐที่เรา§Hสงพลรม§!ลงไป จะถูกลด§Hการจัดระเบียบ§!ในปจจุบัน\n\n$PARA_EFFECT_TIMER$"
 SF_PARAS_sabotage_effect_tt: "รัฐที่ขาศึกควบคุมซึ่งเรา§Hสงพลรม§!ลงไป จะไดรับความเสียหายตอ§Hโรงงานทหาร§!, §Hโรงงานพลเรือน§! และ§Hโครงสรางพื้นฐาน§!\n\n$PARA_EFFECT_TIMER$"
 PARA_EFFECT_TIMER: "ผลนี้เกิดขึ้นไดหนึ่งครั้งตอรัฐทุก ๆ §H30§! วัน"
 paras_airborne_light_armor: "ยานเกราะสงทางอากาศ"
 paras_airborne_light_armor_desc: "รถถังเบาบางรุนสามารถดัดแปลงใหสงลงทางอากาศดวยเครื่องรอนขนาดหนักได วิธีการสงกําลังเขาสูการรบแบบใหมนี้อาจใชไดเฉพาะทาง แตก็เปดโอกาสใหม ๆ ใหแกเรา"
 paras_bonus_2: "กองบัญชาการขนสงทางอากาศเชิงยุทธศาสตร"
 paras_bonus_2_desc: "การจัดตั้งหนวยงานบริหารการขนสงทางอากาศโดยเฉพาะ หมายความวาเราสามารถปรับแตงเครื่องบินขนสงของเราใหเหมาะกับภารกิจสงกําลังทางอากาศไดดียิ่งขึ้น"
 paras_combat_1: "หนวยสื่อสารสงทางอากาศ"
 paras_combat_1_desc: "ไมมีสิ่งใดเทียบไดกับสายการสื่อสารที่สมบูรณแบบกับกองกําลังของเราหลังแนวขาศึก การฝกกองรอยสื่อสารสําหรับการสงลงทางอากาศจะชวยใหการสื่อสารสําคัญเหลานี้ดําเนินตอไปได แมในสภาพที่เลวรายที่สุด"
 paras_combat_2: "หนวยแพทยสงทางอากาศ"
 paras_combat_2_desc: "ขนาดของปฏิบัติการสงทางอากาศของเราเพิ่มขึ้นจนถึงระดับที่แมแตอุปกรณการแพทยที่จําเปนก็ตองเตรียมพรอมสําหรับการสงลงทางอากาศ"
 paras_bonus_1: "การฝกการนําทางขั้นสูง"
 paras_bonus_1_desc: "แมแตการโดดรมที่ดีที่สุดก็อาจผิดพลาดได เราตองมั่นใจวากองกําลังของเราไดรับการฝกการนําทางแบบเฉพาะหนาเปนอยางดี"
 paras_keystone_1: "ยอดฝมือแหงยอดฝมือ"
 paras_keystone_1_desc: "ควรพิจารณาเฉพาะทหารผานศึกที่ผานสมรภูมิมาอยางโชกโชนที่สุดเทานั้นสําหรับกองพันสงทางอากาศของเรา แมสิ่งนี้อาจทําใหกลุมผูสมัครแคบลง แตยอมใหผลตอบแทนในสนามรบอยางแนนอน"
 paras_keystone_2: "กระดูกสันหลังของกองทัพ"
 paras_keystone_2_desc: "นับจากนี้กองทัพของเราจะสรางขึ้นบนทักษะและการฝกของกองกําลังสงทางอากาศ ทองฟาจะมืดมิดเมื่อพวกเขามาถึง และขาศึกของเราจะไดรูจักความหวาดกลัว"
 rangers_jaegers_training: "ผนวกธรรมเนียมเยเกอร"
 rangers_jaegers_training_desc: "ทหารราบเบาที่ไดรับการฝกใหรบในปา ดํารงชีพดวยสิ่งที่พื้นที่นั้นมีให เชี่ยวชาญการวางกับดัก การซุมโจมตี และเปนนักแมนปนชั้นเยี่ยม"
 rangers_jungle_training: "การฝกรบในปาดงดิบของเรนเจอร"
 rangers_jungle_training_desc: "เรนเจอรเหลานี้ไมเพียงเชี่ยวชาญการเอาชีวิตรอด แตยังรบไดในปาที่ทึบที่สุดทามกลางความรอนแบบเขตรอน พวกเขาจึงเปนกุญแจสําคัญในการปฏิบัติการในพื้นที่ที่ทหารทั่วไปไมกลายางกรายเขาไป"
 rangers_guerilla_doctrine: "กองโจรปา"
 rangers_guerilla_doctrine_desc: "ความริเริ่มและการเคลื่อนที่เปนองคประกอบสําคัญของการโจมตีขาศึก เรนเจอรของเราควรเปนเลิศในการใชการพรางตัวและการจูโจมโดยไมใหรูตัว"
 rangers_recon_terrain_training: "ความเชี่ยวชาญภูมิประเทศของเรนเจอรลาดตระเวน"
 rangers_recon_terrain_training_desc: "คุณสมบัติที่จําเปนของยุทธวิธีเรนเจอรคือความสามารถในการเคลื่อนผานภูมิประเทศที่ทุรกันดารที่สุด เพื่อโจมตีขาศึกในจุดที่เขาไมคาดคิด"
 rangers_fire_support_integration: "การบูรณาการการยิงสนับสนุน"
 rangers_fire_support_integration_desc: "การผนวกผูตรวจการณหนาพรอมอุปกรณสื่อสารแบบพกพาเขากับทีมเรนเจอร หมายความวาแมแตหนวยขนาดเล็กที่โดดเดี่ยวก็ไมตองรบโดยปราศจากการยิงสนับสนุนจากปนใหญ"
 rangers_urban_combat: "ความเชี่ยวชาญการรบในเมืองของเรนเจอร"
 rangers_urban_combat_desc: "การรบในปาและในเมืองมีความคลายคลึงกันบางประการ ทั้งระยะปะทะที่สั้นและการตรวจการณที่จํากัด ทหารที่ชํานาญในสภาพแวดลอมหนึ่งสามารถฝกใหปรับตัวเขากับอีกสภาพแวดลอมหนึ่งได"
 elite_rangers_doctrine: "เรนเจอรชั้นยอด"
 elite_rangers_doctrine_desc: "เรนเจอรของเราคือความภาคภูมิใจของกองทัพ เราตองคัดเลือกเฉพาะผูที่ดีที่สุดตอไป และผลักดันพวกเขาสูความสําเร็จที่ยิ่งใหญกวาเดิม"
 rangers_backbone_doctrine: "ความชํานาญเฉพาะทางทหารราบเบา"
 rangers_backbone_doctrine_desc: "ทักษะที่ผูเชี่ยวชาญการรบในปาของเราสั่งสมมาเปนสิ่งที่กองกําลังชั้นยอดทั้งหมดของเราไดรับประโยชน เราตองนําความรูนี้ไปใชในทุกเหลาของทหารเบาและทหารชั้นยอด"
