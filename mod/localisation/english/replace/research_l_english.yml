 convoy_escorts: "การคุมกันขบวนเรือลําเลียง"
 convoy_escorts_desc: "เรือผิวนํ้าความเร็วสูงที่เปนสวนหนึ่งของขบวนเรือลําเลียงจะชวยใหเราตรวจพบเรือดํานํ้าขาศึกและตอบโตไดทันทวงที การตรวจจับคือกุญแจสูการกําจัดภัยรบกวนจากเรือดํานํ้า"
 convoy_escorts_bs: "การคุมกันขบวนเรือลําเลียง"
