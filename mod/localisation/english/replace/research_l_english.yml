 basic_fortification_tech: "ปอมปราการพื้นฐาน"
 basic_fortification_tech_desc: "ดวยการใชวัสดุที่แข็งแรงขึ้นและโครงเสริมโลหะภายในสิ่งกอสราง เราสามารถสรางปอมปราการที่ใหญขึ้นไดโดยไมตองกังวลวาจะพังทลาย"
 land_fort_tech_1: "ปอมปราการภาคพื้นดินแบบปรับปรุง"
 land_fort_tech_1_desc: "ดวยการใชประโยชนจากพื้นที่รอบปอมปราการไดดียิ่งขึ้น ประกอบกับการนําเทคโนโลยีใหมมาใช เราสามารถเสริมความแข็งแกรงใหสิ่งกอสรางที่มีอยูและขยายออกไปไดอีก"
 land_fort_tech_2: "ปอมปราการภาคพื้นดินขั้นสูง"
 land_fort_tech_2_desc: "ดวยการเรียนรูจากความผิดพลาดในอดีต และเสริมความแข็งแรงไมเพียงแคตัวสิ่งกอสราง แตรวมถึงฐานรากดวย เราจะสามารถสรางปอมปราการที่ใหญกวาเดิมมาก ซึ่งสามารถตานทานไดแมแตขาศึกที่ชํ่าชองที่สุด"
 coastal_fort_tech_1: "ปอมปราการชายฝงแบบปรับปรุง"
 coastal_fort_tech_1_desc: "ดวยการใชประโยชนจากพื้นที่รอบปอมปราการชายฝงไดดียิ่งขึ้น ประกอบกับการนําเทคโนโลยีใหมมาใช เราสามารถเสริมความแข็งแกรงใหสิ่งกอสรางที่มีอยูและขยายออกไปไดอีก"
 coastal_fort_tech_2: "ปอมปราการชายฝงขั้นสูง"
 coastal_fort_tech_2_desc: "ดวยการสรางบังเกอรและปอมปราการลึกเขาไปในหนาผาและเนินเขา เราสามารถสรางกลุมปอมที่ใหญยิ่งขึ้น ซึ่งสามารถขับไลไดแมแตกองกําลังยกพลขึ้นบกที่ยิ่งใหญที่สุด"

 sp_rockets_improved_guidance: "ระบบนําวิถีแบบปรับปรุง"
 sp_rockets_improved_guidance_desc: "ระบบนําวิถีจรวดที่ดีขึ้นจะชวยใหเราสงระเบิดบินไดไกลยิ่งขึ้น ทําใหมันเปนภัยคุกคามตอขาศึกมากยิ่งขึ้น และดวยการปรับปรุงระบบนําวิถีสําหรับจรวดขนาดเล็ก ปนใหญจรวดของเราก็จะเล็งไดแมนยําขึ้นเชนกัน"
