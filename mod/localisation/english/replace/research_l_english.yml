 naval_air_operations: "ปฏิบัติการทางอากาศนาวี"
 naval_air_operations_desc: "นักบินที่ไดรับการฝกใหปฏิบัติภารกิจจากเรือบรรทุกเครื่องบินเปดหนทางใหมใหเราครองทะเล เครื่องบินเปนวิธีที่มีประสิทธิภาพในการลดกําลังกองเรือขาศึก"
 base_strike: "การโจมตีฐานทัพ"
 base_strike_desc: "การโจมตีทาเรือของขาศึกจะทําใหความสามารถในการสรางกองเรือใหมของพวกมันเปนอัมพาต ซึ่งจะทําใหเราครองทะเลไดดวยจํานวนที่เหนือกวา\n\n"
 carrier_primacy: "ความเปนเลิศของเรือบรรทุกเครื่องบิน"
 carrier_primacy_desc: "เครื่องบินสมัยใหมมีพิสัยและความแมนยํามากกวาปนเรือทั่วไป จงบูรณาการเรือบรรทุกเครื่องบินเขากับกองเรือของเราและครองทะเลจากทองฟา"
 carrier_task_forces: "หมูเรือเฉพาะกิจเรือบรรทุกเครื่องบิน"
