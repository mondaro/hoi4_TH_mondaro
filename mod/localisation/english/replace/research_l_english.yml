 massed_strikes: "การโจมตีแบบรวมกําลัง"
 massed_strikes_desc: "นักบินที่ไดรับการฝกสําหรับภารกิจบนเรือบรรทุกเครื่องบินจะทําใหแมแตเรือบรรทุกเครื่องบินที่แออัดก็ทํางานไดอยางราบรื่น รุมโจมตีขาศึกและเพิ่มประสิทธิภาพในการรบทางทะเลอยางมหาศาล เรือบรรทุกเครื่องบินตองทํางานดุจเครื่องจักรที่หลอลื่นอยางดี ซึ่งทุกคนรูหนาที่ของตน"
 carrier_battlegroups: "กลุมเรือรบเรือบรรทุกเครื่องบิน"
 carrier_battlegroups_desc: "เรือบรรทุกเครื่องบินสามารถโจมตีขาศึกจากระยะไกลกวาปนเรือใดๆ และดวยดวงตาบนทองฟา เราจะไมมีวันถูกจูโจมโดยไมทันตั้งตัว เรือบรรทุกเครื่องบินที่รวมกําลังกันคือพลังที่ไมอาจมองขาม"
