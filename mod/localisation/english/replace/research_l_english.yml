 cat_ship_light_battery: "ปนใหญเรือขนาดเบา"
 cat_ship_medium_battery: "ปนใหญเรือขนาดกลาง"
 cat_ship_heavy_battery: "ปนใหญเรือขนาดหนัก"
 masterful_blitz: "สายฟาแลบอันเชี่ยวชาญ"
 grand_banzai_charge: "การบุกบันไซครั้งยิ่งใหญ"
 masterful_blitz_desc: "เราอาจไมไดเปนผูคิดคนสงครามสายฟาแลบ แตเราจะพัฒนาและขัดเกลายุทธศาสตรนี้ จนแมแตแนวปองกันที่แข็งแกรงที่สุดของขาศึกก็ไมอาจหยุดยั้งการรุกของกองทัพอันรุงโรจนของเราได"
 penal_infantry: "กองพันลงทัณฑ"
 penal_infantry_desc: "กองพันลงทัณฑเปดโอกาสใหทหารและนายทหารของกองทัพแดงที่ตองโทษ ไดหลั่งเลือดเพื่อมาตุภูมิและไถโทษใหแกการกระทําอันนาอับอายหรือไรเกียรติที่เคยกอไวในอดีต"
 camicie_nere_security_militias: "$ITA_camicie_nere$"
 blackshirt_assault_battalion_tech: "$blackshirt_assault_battalion$"
