 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech: "ปนใหญทําลายลางแรงปะทะสูง"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc: "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "การดัดแปลงเครื่องยนตเรือ"
 sp_armored_lc_naval_engine_conversion_tech_desc: "การใชเทคนิควิศวกรรมเรือ เชน เพลาขอเหวี่ยงเสริมความแข็งแรง ระบบสงกําลังแรงบิดสูง และระบบระบายความรอนเฉพาะทาง สามารถเพิ่มกําลังและความทนทานของเครื่องยนตเรือรบบก ทําใหรับมือกับนํ้าหนักและความเคนมหาศาลไดดีขึ้น"
 sp_armored_lc_transmission_improvements_tech: "การปรับปรุงระบบสงกําลัง"
 sp_armored_lc_transmission_improvements_tech_desc: "ปรับแตงอัตราทดเกียร กลไกคลัตช และทอรกคอนเวอรเตอร เพื่อสรางระบบสงกําลังที่มีประสิทธิภาพยิ่งขึ้น ซึ่งรองรับกําลังและนํ้าหนักมหาศาลของเรือรบบกได ชวยเพิ่มความคลองตัวโดยรวมและลดภาระทางกลไก"
 sp_armored_lc_specialized_field_manuals_tech: "คูมือภาคสนามเฉพาะทาง"
 sp_armored_lc_specialized_field_manuals_tech_desc: "พัฒนาคูมือการฝกโดยละเอียดสําหรับพลประจําเรือรบบกโดยเฉพาะ ครอบคลุมขั้นตอนการปฏิบัติการเฉพาะ ระเบียบการซอมบํารุง และยุทธวิธีในสนามรบที่ซับซอน ซึ่งจําเปนตอการบังคับบัญชาจักรกลสงครามยักษเหลานี้อยางมีประสิทธิภาพ"
 sp_armored_lc_weapon_fire_control_tech: "การควบคุมการยิงอาวุธ"
 sp_armored_lc_weapon_fire_control_tech_desc: "นํากลองเล็งเปาขั้นสูง เครื่องวัดระยะ และเครื่องรักษาการทรงตัวแบบไจโรสโคปมาใช เพื่อเพิ่มความแมนยําและการประสานการยิง ทําใหมั่นใจวาปนสามารถโจมตีเปาหมายไดอยางมีประสิทธิภาพ แมจะมีแรงสะทอนมหาศาลและความคลองตัวตํ่า"
 sp_armored_engineer_tech: "กองรอยทหารชางยานเกราะ"
 sp_armored_engineer_tech_desc: "หนวยทหารชางยานเกราะผสานความเชี่ยวชาญทางวิศวกรรมเขากับการปองกันดวยเกราะ โดยเชี่ยวชาญการเคลียรสิ่งกีดขวางและสนับสนุนการรุกของแนวหนาภายใตการระดมยิงอยางหนัก"
 sp_armored_maintenance_tech: "กองรอยซอมบํารุงยานเกราะ"
 sp_armored_maintenance_tech_desc: "การใชรถกูซอมหุมเกราะชวยใหเจาหนาที่ซอมบํารุงของเรากูและซอมแซมยุทโธปกรณไดทุกประเภท เพื่อความพรอมปฏิบัติการสูงสุดในสนามรบ"
 sp_armored_signal_tech: "กองรอยสื่อสารยานเกราะ"
 sp_armored_signal_tech_desc: "การติดตั้งรถบังคับการใหแกหนวยของเราจะชวยใหการสื่อสารและการประสานงานในสนามรบปลอดภัยและเชื่อถือไดภายใตการปองกันดวยเกราะ"
 sp_armored_motorized_military_police_tech: "สารวัตรทหารยานยนต"
 sp_armored_motorized_military_police_tech_desc: "หนวยเหลานี้ติดตั้งรถจักรยานยนตทางทหาร มีหนาที่รักษาความสงบเรียบรอยหลังแนวหนา คุมกันขบวนลําเลียง และลาดตระเวน ความเร็วและความคลองตัวของพวกเขาชวยใหตอบสนองตอความวุนวายไดอยางรวดเร็ว และหากจําเปนก็สามารถลาดตระเวนในพื้นที่การรบได"
 sp_cluster_shells: "กระสุนลูกระเบิดยอย"
 sp_cluster_shells_desc: "กระสุนลูกระเบิดยอยจะกระจายลูกระเบิดยอยจํานวนมากไปทั่วพื้นที่กวาง เพื่อสรางความเสียหายสูงสุดตอกําลังพลและยุทโธปกรณของขาศึก"
 sp_artillery_rocket_assisted_projectiles_tech: "กระสุนเสริมแรงขับดวยจรวด"
 sp_artillery_rocket_assisted_projectiles_tech_desc: "กระสุนที่ไดรับการปรับปรุงสําหรับปนใหญฮาวอิตเซอรหนักพิเศษ ออกแบบมาเพื่อเพิ่มระยะยิงและแรงปะทะดวยแรงขับจากจรวด"
 sp_artillery_purpose_built_gun_motor_carriages_tech: "รถติดตั้งปนที่สรางขึ้นเฉพาะ"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc: "ยานพาหนะเฉพาะทางที่ออกแบบมาเพื่อขนสงและสนับสนุนปนใหญฮาวอิตเซอรหนักพิเศษ ชวยใหเคลื่อนที่ไดคลองและวางกําลังในสนามรบไดงาย"
 sp_multi_product_supply_ships: "เรือสงกําลังบํารุงอเนกประสงค"
 sp_multi_product_supply_ships_desc: "ดวยการใชเรือสงกําลังบํารุงที่ผลิตขึ้นใหม เราสามารถถายโอนเชื้อเพลิง กระสุน และเสบียงไดราบรื่นยิ่งขึ้น"
 sp_standard_tenshioned_replenishment_alongside_method: "วิธีการสงกําลังบํารุงกลางทะเลแบบเทียบขางดวยสลิงตึงมาตรฐาน"
 sp_standard_tenshioned_replenishment_alongside_method_desc: "วิธีการสงกําลังบํารุงกลางทะเลแบบเทียบขางดวยสลิงตึงมาตรฐาน หรือ STREAM เปนวิวัฒนาการขั้นตอไปในการรับประกันการสงกําลังบํารุงอยางตอเนื่องใหแกปฏิบัติการทางเรือระยะไกลของเรา"
 sp_aip_engine_improved_tech: "เครื่องยนตผสม AIP-ดีเซล"
 sp_aip_engine_improved_tech_desc: "ดวยการปรับปรุงเทคโนโลยี AIP ตอไป เราเห็นการพัฒนาทั้งในดานสมรรถนะและการใชวัสดุของเครื่องยนต"
 sp_aip_engine_advanced_tech: "เครื่องยนตวัลเทอรความเร็วสูง"
 sp_aip_engine_advanced_tech_desc: "ประสบการณและความเขาใจในระบบขับเคลื่อนที่ไมพึ่งอากาศ ชวยใหเราพัฒนาเครื่องยนตที่ลํ้าสมัยที่สุดได เงียบ เร็ว และอันตรายถึงชีวิต"
 sp_refined_pykrete: "ไพเครตแบบปรับปรุง"
 sp_refined_pykrete_desc: "ดวยการปรับปรุงไพเครตตอไป ตอนนี้เราสามารถใหฉนวนและการปองกันที่ดียิ่งขึ้นแกอากาศยานบนเรือบรรทุกเครื่องบินนํ้าแข็งได"
 sp_ice_composite_runawayas: "ทางวิ่งวัสดุผสมนํ้าแข็ง"
 sp_ice_composite_runawayas_desc: "ดวยการพัฒนาวัสดุผสมนํ้าแข็งอยางตอเนื่อง เรากําลังมองหาวัสดุและเทคนิคการกอสรางที่ดีที่สุดเพื่อปกปองเรือบรรทุกเครื่องบินและอากาศยานของเรา"
 heavy_battleship2: "เรือประจัญบานหนักพิเศษ II"
 heavy_battleship2_desc: "การปรับปรุงจากแบบเรือหนักพิเศษรุนกอนของเรา ดวยอาวุธที่ทรงพลังกวาและระบบควบคุมการยิงที่ดีขึ้น"
 sp_shock_hardening_techniques: "เทคนิคเสริมความทนทานตอแรงกระแทก"
 sp_shock_hardening_techniques_desc: "ดวยการใชเทคนิคเสริมความทนทานตอแรงกระแทกหลากหลายวิธี และใชตัวปรับสมดุลความเคนสําหรับชิ้นสวน เราไดลดอัตราการระเบิดกอนกําหนด ทําใหกระสุนของเราเชื่อถือไดและมีประสิทธิภาพยิ่งขึ้น"
 sp_variable_time_fuze_shells: "กระสุนชนวนตั้งเวลาแปรผัน"
 sp_variable_time_fuze_shells_desc: "ดวยการนํากระสุนชนวนตั้งเวลาแปรผันมาใช - เราไดทําใหปนใหญสนามของเรารายกาจตอฝายตรงขาม กระสุนจะระเบิดกอนถึงพื้น จึงสรางพื้นที่สังหารที่กวางกวามาก"
 sp_helicopter_transport_pods_tech: "กองรอยเฮลิคอปเตอรขนสง"
 sp_helicopter_transport_pods_tech_desc: "เฮลิคอปเตอรที่ติดตั้งกระเปาะขนสงหรือหยอนสลิงลากสินคาไวใตลํา สามารถเคลื่อนยายเสบียงและยุทโธปกรณไดอยางรวดเร็วโดยไมตองคํานึงถึงภูมิประเทศ การติดหลมโคลนกลายเปนเรื่องในอดีตไปแลว!"
 sp_helicopter_artillery_observers_tech: "กองรอยเฮลิคอปเตอรลาดตระเวน"
 sp_helicopter_artillery_observers_tech_desc: "เฮลิคอปเตอรสามารถหาจุดสังเกตการณที่ดีในสนามรบไดไมวาภูมิประเทศจะเปนอยางไร จึงเปนหนวยสอดแนมแนวหนาชั้นเยี่ยมที่สงขอมูลปอนกลับที่แมนยําใหแกการระดมยิงของปนใหญ"
 sp_helicopter_med_evac_tech: "กองรอยเฮลิคอปเตอรสงกลับสายแพทย"
 sp_helicopter_med_evac_tech_desc: "มีผูบาดเจ็บกําลังมา! เรามีผูบาดเจ็บกําลังมา! เฮลิคอปเตอรชวยลําเลียงผูบาดเจ็บไดเร็วกวารถพยาบาลทั่วไปเสียอีก"

 sp_rockets_dual_chamber_rocket_engine_1: "เครื่องยนตจรวดสองหองเผาไหม"
 sp_rockets_dual_chamber_rocket_engine_1_desc: "ดวยการเพิ่มหองเผาไหมหองที่สองใหแกเครื่องยนต เราสามารถเพิ่มระยะเวลาบินและประสิทธิภาพของเครื่องยนตจรวดได"
 sp_rockets_dual_chamber_rocket_engine_2: "เครื่องยนตจรวดสองหองเผาไหมขั้นสูง"
 sp_rockets_dual_chamber_rocket_engine_2_desc: "การปรับปรุงเครื่องยนตสองหองเผาไหมเพิ่มเติมอาจนําไปสูการพัฒนาประสิทธิภาพของแบบที่ยิ่งใหญขึ้นไปอีก"

 sp_advance_sabot_shells: "กระสุนซาบอตขั้นสูง" 
 sp_advance_sabot_shells_desc: "ทรัพยากรเพิ่มเติมที่ทุมใหกับการวิจัยกระสุนเจาะเกราะ ทําใหเราเขาใจวิธีปรับปรุงการทรงตัวของกระสุนซาบอตในกรณีการใชงานที่หลากหลาย"
 
 reinforced_wings_mothership: "ปกเครื่องบินแมเสริมความแข็งแรง"
 reinforced_wings_mothership_desc: "หากไมมีเครื่องบินแม เครื่องบินขับไลก็เทากับติดคางอยูกลางอากาศ ซึ่งจํากัดประสิทธิภาพการปฏิบัติการอยางรุนแรง การเสริมความแข็งแรงใหปกของเครื่องบินแมจึงเปนยุทธศาสตรที่คุมคาที่สุดในการเพิ่มความอยูรอดของฝูงบินทั้งหมด"

 
 miniature_fighters: "เครื่องบินขับไลขนาดจิ๋ว"
 miniature_fighters_desc: "ดวยเครื่องบินขับไลที่เล็กลง เราจะสามารถนําพวกมันเขาสูการรบไดมากขึ้นโดยไมตองเสียอํานาจการยิงมากนัก ทั้งยังลดนํ้าหนักบรรทุกของเครื่องบินแมดวย"
 
 aerial_hangars: "โรงเก็บเครื่องบินกลางอากาศ"
 aerial_hangars_desc: "โรงเก็บเครื่องบินกลางอากาศที่ติดตั้งกับเครื่องบินแมชวยใหเราบรรทุกเครื่องบินขับไลขนาดจิ๋วไวบนหลังอากาศยานไดมากขึ้น เพิ่มอํานาจการยิงและระยะปฏิบัติการใหไกลยิ่งขึ้น"

 mothership: "อากาศยานแม"

 transport_planes_cat: "เครื่องบินลําเลียง"
 RESEARCH_SHARING_VALUE_SCIENTISTS: "$VALUE|H1%$"
 naval_minelaying_research: "การวิจัยการวางทุนระเบิด"
 naval_minelaying_research_desc: "พัฒนาการดานการตรวจจับดวยแมเหล็กและแหลงจุดระเบิดที่เสถียรสําหรับวัตถุระเบิดทางทะเล"