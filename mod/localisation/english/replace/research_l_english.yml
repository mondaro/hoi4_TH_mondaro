 submarine_operations: "ปฏิบัติการเรือดํานํ้า"
 submarine_operations_desc: "เราไมจําเปนตองปะทะกองเรือขาศึกแบบซึ่งหนาเพื่อชนะสงคราม จงโจมตีขบวนเรือลําเลียงสินคาของพวกมันกอนที่จะทันตอบโต แลวหายลับลงใตผิวนํ้าอีกครั้ง ไมมีใครสูกับสิ่งที่มองไมเห็นได"
