 undersea_blockade: "การปดลอมใตทะเล"
 undersea_blockade_desc: "เรือดํานํ้าคือเครื่องมือที่สมบูรณแบบในการตัดการไหลเขาของวัตถุดิบสําคัญของขาศึก เราจะทําใหการผลิตของขาศึกเปนอัมพาตและชนะดวยการทําใหพวกมันอดอยาก"
 undersea_blockade_bs: "การปดลอมใตทะเล"
