 escort_carriers: "เรือบรรทุกเครื่องบินคุมกัน"
 escort_carriers_desc: "พื้นที่ที่อากาศยานจากเรือบรรทุกเครื่องบินครอบคลุมไดทําใหการคุมกันขบวนเรือลําเลียงสินคางายขึ้นมาก การรักษาการไหลเวียนของทรัพยากรเปนสิ่งจําเปนยิ่ง"
 integrated_convoy_defence: "การปองกันขบวนเรือลําเลียงแบบบูรณาการ"
 integrated_convoy_defence_desc: "การประสานงานระหวางกองทัพเรือและกองทัพอากาศที่ดีขึ้นชวยใหเราโจมตีขาศึกไดจากระยะไกลหลายไมลกอนที่พวกมันจะเขาใกลขบวนเรือลําเลียงสินคาของเรา สิ่งนี้จะเพิ่มประสิทธิภาพของการเดินเรือเปนขบวนไดอยางมาก"
