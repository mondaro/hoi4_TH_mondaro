 form_andalusia: "ฟนฟูอัลอันดะลุส"
 form_andalusia_desc: "เมื่อกอรโดบา รัฐเอมิเรตกรานาดา และไอบีเรียตอนใตสวนใหญอยูภายใตการควบคุมของเรา เรามีโอกาสพิเศษที่จะฟนฟูรัฐสุลตานอัลอันดะลุสในอดีต และประกาศใหดินแดนเดิมทั้งหมดเปนสวนหนึ่งอันชอบธรรมของรัฐเรา"
 adu_restore_sultanate_of_africa: "ฟนฟูรัฐสุลตานแหงแอฟริกา"
 adu_restore_sultanate_of_africa_desc: "นานมาแลว ชาวมัวรแหงแอฟริกาเหนือเคยรวมเปนรัฐสุลตานเดียว คือรัฐสุลตานแหงแอฟริกา ซึ่งเปนสาขาสําคัญของรัฐเคาะลีฟะฮอุมัยยะฮ เมื่ออันดาลูเซียไดรับการฟนฟูและชาวมัวรทั้งปวงอยูรวมกันในรัฐของเราแลว เราจึงสามารถรวมอัตลักษณชาวมัวรใหเปนหนึ่งเดียว"
