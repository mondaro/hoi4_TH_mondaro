 adu_mediterrenean_emirates: "ฟนฟูรัฐเอมิเรตซิซิลี"
 adu_mediterrenean_emirates_desc: "ในยุคที่อิทธิพลของชาวมัวรเหนือเมดิเตอรเรเนียนรุงเรืองถึงขีดสุด หมูเกาะเหลานี้เคยเปนที่ตั้งของรัฐเอมิเรตอิสลามมากมาย เมื่อซิซิลี ครีต และไซปรัสตกอยูในมือชาวอันดาลูเซียแลว เราอาจคืนดินแดนเหลานี้สูผูปกครองชาวมัวรอันชอบธรรมไดอีกครั้ง"
 adu_restore_umayyad_caliphate: "สถาปนารัฐเคาะลีฟะฮอุมัยยะฮขึ้นใหม"
 adu_restore_umayyad_caliphate_desc: "ในที่สุด นครศักดิ์สิทธิ์แบกแดด เมกกะ และเยรูซาเลมก็ไดรวมเปนรัฐเดียวกัน เมื่อดินแดนใจกลางอาระเบียอยูในมือเราแลว เราอาจประกาศตนวาเปนมากกวาสหภาพของชาวมัวร หากแตเปนรัฐเคาะลีฟะฮที่ฟนคืนมา มาตุภูมิของประชาชาติและวัฒนธรรมอิสลามทั้งปวง"
 adu_recreate_rashid_expansion: "การขยายดินแดนแบบรอชิดีน"
