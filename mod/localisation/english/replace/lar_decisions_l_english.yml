l_english:
 SPR_the_inevitable_civil_war: "สงครามกลางเมืองที่หลีกเลี่ยงไมได"
 SPR_the_inevitable_civil_war_desc: "หลังการเลือกตั้ง สงครามกลางเมืองแทบจะกลายเปนเรื่องแนนอนแลว [Root.GetSCWsideloc] เราตองชิงความไดเปรียบและยึดการควบคุมกองรักษาการณทั่วประเทศ"
 SPR_NATIONALISTS_INSTRUCTIONS: "เราตองไมรีรอนานเกินไป มิฉะนั้นฝายสาธารณรัฐจะมีเวลาเตรียมแนวปองกัน"
 SPR_REPUBLICANS_INSTRUCTIONS: "เราตองถวงเวลาสงครามกลางเมืองใหนานที่สุด เพื่อใหเรามีเวลาเตรียมรับมือการลุกฮือของฝายชาตินิยม"
 spa_civil_war_divisions_counter_full_breakdown: "หากสงครามกลางเมืองเริ่มขึ้นตอนนี้ [SPA.GetNameDefCap]จะเริ่มตนดวย [?SPR.spa_civil_war_divisions_counter_var|+0] §Hกองพล§!\n"
 spa_civil_war_divisions_counter_icon_value: "[?SPR.spa_civil_war_divisions_counter_var|0H]"
 spr_civil_war_divisions_counter_full_breakdown: "หากสงครามกลางเมืองเริ่มขึ้นตอนนี้ สเปนฝายสาธารณรัฐจะเริ่มตนดวย [?SPR.spr_civil_war_divisions_counter_var|+0] §Hกองพล§!\n"
 spr_civil_war_divisions_counter_icon_value: "[?SPR.spr_civil_war_divisions_counter_var|0H]"
 SPR_the_inevitable_civil_war_map_category_name: "เลือกพื้นที่ที่จะจัดการอิทธิพลในกองรักษาการณ"
 SPR_opposition_civil_war_preparations: "การเตรียมสงครามกลางเมืองของฝายตรงขาม"
 SPR_opposition_civil_war_preparations_desc: "ขณะที่เราพยายามขัดขวางทุกความเคลื่อนไหวของพวกเขา ศัตรูของเราก็ไมไดอยูเฉย เราควรคํานึงถึงการกระทําของพวกเขาขณะเตรียมพรอมสําหรับความขัดแยงที่กําลังจะมาถึง"
 SPR_civil_war_offensives: "การรุกในสงครามกลางเมือง"
 SPR_civil_war_offensives_desc: "ปญหาดานความสามารถในการสงเสบียงใหทหารแนวหนาทําใหยากที่จะรุกคืบตอที่มั่นของขาศึกไดอยางมีประสิทธิภาพ เราตองวางแผนลวงหนาและขยายคลังยุทโธปกรณแนวหนาใหเพียงพอตั้งแตเนิ่น ๆ กอนเตรียมการรุกขนาดใหญใด ๆ"
 SPR_civil_war_offensives_map_category_name: "เลือกพื้นที่ที่จะเตรียมการรุก"
 SPA_military_plot_nationalists: "แผนลับทางทหาร"
 SPA_military_plot_nationalists_desc: "การเตรียมการโคนลมรัฐบาลของเรากําลังดําเนินไป แตเพื่อไมใหซํ้ารอยความลมเหลวของความพยายามรัฐประหารในป 1932 เราตองมั่นใจวามีแรงสนับสนุนจากประชาชนมากพอกอนจะลงมือรัฐประหาร จังหวะเวลาตองสมบูรณแบบ!"
 SPR_military_plot_republicans: "แผนลับทางทหาร"
 SPR_military_plot_republicans_desc: "ขาวลือเรื่องแผนรายที่จะโคนลมรัฐบาลมาถึงหูเรา และแมเราจะเพิ่งมีประสบการณกับความพยายามรัฐประหารเชนนี้ แตเรากลับไมพรอมรับมือกับอีกครั้งเลย เราตองขัดขวางแผนของพวกเขาทุกที่ที่ทําไดและถวงเวลาไวเพื่อใหเรามีเวลาเตรียมตัว"
 SPA_primo_de_rivera_speech: "สุนทรพจนของปรีโม เด ริเบรา"
 SPA_primo_de_rivera_speech_desc: "โฆเซ อันโตนิโอ ปรีโม เด ริเบรา เปนหนึ่งในผูกอตั้งฟาลังเฆเอสปญโญลา เขาเปนนักพูดในที่สาธารณะที่วิพากษวิจารณประชาธิปไตย บางทีเราควรสนับสนุนใหเขากลาวสุนทรพจนเพิ่มเติมเพื่อเพิ่มแรงสนับสนุนจากประชาชนและสั่นคลอนชาติใหมากขึ้น"
 SPA_primo_de_rivera_imprisoned: "ปรีโม เด ริเบรา ถูกจําคุกแลว"
 SPR_inevitable_civil_war_in_progress_flag: "การตัดสินใจสงครามกลางเมืองที่หลีกเลี่ยงไมไดกําลังดําเนินอยู"
 SPR_imprison_primo_de_rivera: "จําคุกปรีโม เด ริเบรา"
 SPR_imprison_primo_de_rivera_desc: "โฆเซ อันโตนิโอ ปรีโม เด ริเบรา สรางความวุนวายใหประเทศมามากพอแลวดวยสุนทรพจนปลุกปนไมหยุดหยอน เราจะจับกุมเขาและคุมตัวไวในที่ที่เราจับตาดูได เสียงของฟาลังเฆตองถูกทําใหเงียบ"
 SPR_imprison_primo_de_rivera_tt: "ปองกันไมใหปรีโม เด ริเบรา กลาวสุนทรพจนปลุกปนอีก\n"
 SPR_primo_de_rivera_first_speech: "ปรีโม เด ริเบรา กลาวสุนทรพจนครั้งแรกแลว"
 SPA_political_assassination: "การลอบสังหารทางการเมือง"
 SPA_political_assassination_desc: "คูแขงทางการเมืองของเรากลายเปนหนามยอกอก คอยดึงผูคนที่อาจถูกโนมนาวมาอยูขางเราไปอยูขางพวกเขาแทน การกําจัดคูแขงคนสําคัญคนหนึ่งอยางมีชั้นเชิงจะชวยลดแรงกดดันตอเรา และเปดโอกาสใหสารของเราเขาถึงผูคนไดมากขึ้น"
 SPR_political_arrest: "การจับกุมทางการเมือง"
 SPR_political_arrest_desc: "ศัตรูทางการเมืองของเราหันไปใชการฆาตกรรมเพื่อผลักดันสารของตน เราไมอาจยอมรับสิ่งนี้ได ผูกระทําผิดตองถูกนําตัวมาลงโทษ!"
 SPA_political_assassination_flag: "เกิดการลอบสังหารทางการเมืองขึ้นแลว"
 SPA_sway_leader_loyalty: "โนมนาวความภักดีของผูนํา"
 SPA_sway_leader_loyalty_desc: "ดวยวิธีโนมนาวที่เหมาะสม เราอาจขยายแรงสนับสนุนในหมูนายทหารชั้นนําของกองทัพสเปนได การไดรับการสนับสนุนจากพวกเขาเมื่อถึงเวลาอาจมีคาอยางประเมินไมได"
 SPA_swayed_leader_loyalty_flag: "โนมนาวความภักดีไดแลว"
 SPR_secure_leader_loyalty: "รักษาความภักดีของผูนํา"
 SPR_secure_leader_loyalty_desc: "มีขาวลือมาถึงเราวาความภักดีของผูนําทางทหารคนหนึ่งที่เคยภักดีตอเรากําลังเปนที่สงสัย เราควรทําใหแนใจวาจะไดความภักดีของเขากลับคืนมา แมแครอทที่ตองหอยลอไวตรงหนาเขาจะมีราคาแพงอยูบางก็ตาม..."
 SPR_reassign_disloyal_leader: "ยายผูนําที่ไมภักดี"
 SPR_reassign_disloyal_leader_desc: "มีขาวลือมาถึงเราวาความภักดีของผูนําทางทหารบางคนกําลังเปนที่สงสัย เราควรยายพวกเขาไปประจําตําแหนงในพื้นที่หางไกล เพื่อไมใหพวกเขาวางแผนตอไดโดยงาย"
 SPR_reassign_disloyal_leader_tt: "ฝายชาตินิยมจะไมสามารถใชไดเปนเวลาสองเดือนหลังสงครามกลางเมืองเริ่มตน\n"
 SPA_suppress_the_strikes: "ปราบปรามการนัดหยุดงาน"
 SPA_suppress_the_strikes_desc: "การนัดหยุดงานกําลังกอใหเกิดความไมสงบอยางใหญหลวงและความเสียหายทางเศรษฐกิจแกชาติของเรา เราจะสงกองกําลังอาสาเขาไปสลายการนัดหยุดงานและทําใหประชาชนกลับไปทํางาน"
 SPA_suppress_the_strikes_tt: "ไดปราบปรามการนัดหยุดงานทั่วประเทศจนสิ้นแลว"
 SPA_suppress_the_strikes_tt_NOT: "ไม: ไดปราบปรามการนัดหยุดงานทั่วประเทศจนสิ้นแลว"
 SPR_concessions_to_the_left: "ยอมผอนปรนใหฝายซาย"
 SPR_concessions_to_the_left_desc: "ผูนัดหยุดงานมีเหตุผลอันสมควรสําหรับขอกังวลของพวกเขา เราจะใหคํามั่นวาจะแกไขปญหาเหลานั้น และในระหวางนี้จะผอนปรนดวยการไมดําเนินคดีกับการบุกรุกที่ดินผิดกฎหมาย อาชญากรรมทางสังคมเล็กนอย และการลักขโมย สิ่งนี้นาจะชวยลดความไมสงบทางสังคมลงไดบาง"
 SPA_concessions_to_the_left_tt: "ไดผอนปรนใหฝายซายอยางสิ้นเชิงแลว"
 SPR_primo_de_rivera_speech_mission: "สุนทรพจนของปรีโม เด ริเบรา"
 SPR_primo_de_rivera_speech_mission_desc: "โฆเซ อันโตนิโอ ปรีโม เด ริเบรา หนึ่งในผูกอตั้งฟาลังเฆเอสปญโญลา วางแผนจะกลาวสุนทรพจนปลุกปน ดึงผูคนเขาสูธงของฝายชาตินิยมและยุยงใหเกิดความไมสงบในหมูประชาชน"
 SPA_imprison_primo_de_rivera_mission: "จําคุกปรีโม เด ริเบรา"
 SPA_imprison_primo_de_rivera_mission_desc: "ดูเหมือนรัฐบาลจะตัดสินใจแลววาปรีโม เด ริเบรา กอความไมสงบมามากพอ และไดออกหมายจับเขาแลว!"
 SPR_political_assassination_mission: "การลอบสังหารทางการเมือง"
 SPR_political_assassination_mission_desc: "วาทกรรมกระหายเลือดของศัตรูทางการเมืองเรียกรองใหกําจัดผูสนับสนุนคนสําคัญของอุดมการณเรา... เราไมควรแปลกใจหากมีใครสักคนตัดสินใจลงมือตามคําพูดเหลานั้น"
 SPA_political_arrest_mission: "การจับกุมทางการเมือง"
 SPA_political_arrest_mission_desc: "รัฐบาลกําลังแสวงหาการแกแคนจากการที่ผูสนับสนุนคนหนึ่งของพวกเขาถูกกําจัด และกําลังหาใครสักคนมาจับกุมเพื่อเชือดไกใหลิงดู"
 SPR_sway_leader_loyalty_mission: "โนมนาวความภักดีของผูนํา"
 SPR_sway_leader_loyalty_mission_desc: "ผูวางแผนฝายชาตินิยมกําลังพยายามขยายแรงสนับสนุนในหมูผูนําทางทหารของเรา และเราไดขาวมาวามีบุคคลหลายคนถูกเขาหาพรอมขอเสนอที่ยั่วยวนใจ... เราไดแตภาวนาวาพวกเขาจะโนมนาวใครไมสําเร็จ"
 SPA_reassign_disloyal_leader_mission: "ยายผูนําที่ไมภักดี"
 SPA_reassign_disloyal_leader_mission_desc: "รัฐบาลเริ่มสงสัยผูสนับสนุนบางคนของเราในกองทัพมากขึ้นเรื่อย ๆ และบัดนี้กําลังวางแผนยายผูรวมสมคบคิดคนสําคัญของเราคนหนึ่งไปประจําในพื้นที่หางไกล ซึ่งจะทําใหการวางแผนและการรวมมือของเรายากขึ้นมาก"
 SPR_suppress_the_strikes_mission: "ปราบปรามการนัดหยุดงาน"
 SPR_suppress_the_strikes_mission_desc: "กองกําลังอาสาฝายขวาและผูทําลายการนัดหยุดงานกําลังปราบปรามคนงานที่ไมพอใจของเรา บีบบังคับใหพวกเขากลับไปทํางาน เพิ่มความไมสงบทางสังคมและความผิดหวังตอความสามารถของรัฐบาลในการปกปองพลเมือง"
 SPA_concessions_to_the_left_mission: "ยอมผอนปรนใหฝายซาย"
 SPA_concessions_to_the_left_mission_desc: "รัฐบาลกําลังผอนปรนอยางกวางขวางใหแกคนงานที่นัดหยุดงาน ปลอยใหพวกเขาลอยนวลกับสิ่งที่พี่นองฝายขวาของเราถูกจําคุกเพราะทํา แมจะนารังเกียจ แตดูเหมือนมาตรการเหลานี้จะเปนที่นิยมในหมูผูนัดหยุดงาน"
 SPA_expand_influence_nationalists_trigger_tt: "ฝายชาตินิยมมีการควบคุมกองรักษาการณนอยกวาระดับ§Yเบ็ดเสร็จ§!"
 SPR_expand_influence_republicans_trigger_tt: "ฝายชาตินิยมมีการควบคุมกองรักษาการณอยางนอยระดับ§Yออน§!"
 SPA_expand_influence_nationalists_tt: "เพิ่มการควบคุมกองรักษาการณของฝายชาตินิยมขึ้นหนึ่งขั้น\n\n"
 SPR_expand_influence_republicans_tt: "ลดการควบคุมกองรักษาการณของฝายชาตินิยมลงหนึ่งขั้น\n\n"
