 SPA_carlist_uprising_mission: "การลุกฮือของฝายคารลิสตที่ใกลจะเกิดขึ้น"
 SPA_carlist_uprising_mission_desc: "กลุมคารลิสตภายในฝายของเราไมพอใจตอการนําของเราและอิทธิพลที่เพิ่มขึ้นของเรา แทนที่จะยอมเขาแถว ความไมพอใจกลับลุกลามไปทั่วหนวยเรเกเต และขาวลือเรื่องการกอกบฏก็แพรสะพัด เราควรเตรียมพรอมรับมือกับการลุกฮือของฝายคารลิสต ขณะที่ยังตองตอกรกับศัตรูฝายสาธารณรัฐไปพรอมกัน"
 SPR_anarchist_uprising_mission: "การลุกฮือของฝายอนาธิปไตยที่ใกลจะเกิดขึ้น"
 SPR_anarchist_uprising_mission_desc: "'พันธมิตร' ฝายอนาธิปไตยของเรายังคงทําตัวราวกับคาดหวังเอกราชและอํานาจปกครองตนเองอยางไมสมควร ยิ่งเราพยายามจัดระเบียบดินแดนที่พวกอนาธิปไตยยึดครองเพื่อการทําสงครามมากเทาไร พวกเขาก็ยิ่งปลุกปนผูคนใหตอตานรัฐบาลสเปนอันชอบธรรมมากเทานั้น เราควรเตรียมพรอมรับมือกับการลุกฮือเต็มรูปแบบของฝายอนาธิปไตย หากสถานการณบานปลายยิ่งขึ้น"
 SPA_fascist_crackdown_mission: "การกวาดลางของฝายฟาสซิสตที่ใกลจะเกิดขึ้น"
 SPA_fascist_crackdown_mission_desc: "นับตั้งแตสงครามกลางเมืองปะทุขึ้น เราถูกกันออกไปอยูชายขอบโดย 'พันธมิตร' ฝายฟาลังเฆ พวกเขาแสดงใหเห็นอยางชัดแจงวาวิสัยทัศนของพวกเขาตออนาคตของสเปนไมอาจไปดวยกันไดกับราชอาณาจักรคารลิสตอันชอบธรรม และพวกเขากําลังวางแผนบดขยี้อิทธิพลของเราใหสิ้นซากดวยทุกวิถีทางอยางไมตองสงสัย เราควรเตรียมพรอมปกปองอุดมการณของเราดวยกําลัง หากพวกเขาไมเหลือทางเลือกอื่นใหเรา"
 SPR_government_crackdown_mission: "การกวาดลางของรัฐบาลที่ใกลจะเกิดขึ้น"
 SPR_government_crackdown_mission_desc: "นับตั้งแตสงครามกลางเมืองปะทุขึ้น การปราบปรามขบวนการของเราโดยฝายสตาลินนิสตและฝายสาธารณรัฐก็ทวีความรุนแรงขึ้นเรื่อย ๆ เราหลั่งเลือดเพื่อหยุดยั้งรัฐประหารของฝายฟาสซิสตในชวงแรก แตอํานาจปกครองตนเองที่เรายังคงมีอยูกลับเปนหนามยอกอกของรัฐบาล และเห็นไดชัดวาพวกเขาอยากกําจัดเราทิ้งมากกวาจะไดรับความชวยเหลือจากเราตอไป เราตองเตรียมพรอมปกปองเสรีภาพของเราดวยกําลัง หากพวกเขาไมเหลือทางเลือกอื่นใหเรา"
