 IRQ_anglo_iraqi_treaty: "สนธิสัญญาแองโกล-อิรัก"
 IRQ_anglo_iraqi_treaty_desc: "แมจะไดรับการเจรจาใหมในป 1930 แตสนธิสัญญาแองโกล-อิรักยังคงเปนขอตกลงที่เอาเปรียบฝายเดียว ซึ่งทําใหอิรักเปนรัฐบริวารโดยพฤตินัยของจักรวรรดิอังกฤษ สนธิสัญญานี้ใหสิทธิพิเศษดานทรัพยากรนํ้ามันของอิรักแกอังกฤษ และอนุญาตใหอังกฤษใชสถานที่ทางทหารทั่วประเทศ สิ่งนี้ยังคงกอใหเกิดความไมพอใจอยางมหาศาลในหมูชาวอิรักที่ปรารถนาเอกราชอยางแทจริง รัฐบาลใดก็ตามที่ขึ้นสูอํานาจจะตองตัดสินใจวาจะเจรจาสนธิสัญญาใหมอีกครั้ง หรือฉีกทิ้งและเสี่ยงตอความพิโรธของกองทัพอังกฤษ"
