 IRQ_agrarian_society_desc: "อุตสาหกรรมของอิรักหมุนรอบภาคเกษตรกรรม และผูนําหัวอนุรักษนิยมในภูมิภาคก็ไมสนใจจะพัฒนาและทําใหผืนดินกลายเปนอุตสาหกรรม จําเปนตองทุมเทเวลาและความพยายามอยางเหมาะสมเพื่อแกปญหาในรัฐนี้"
