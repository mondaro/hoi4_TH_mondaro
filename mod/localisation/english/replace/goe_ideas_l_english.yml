 IRQ_golden_square: "จัตุรัสทองคํา"
 IRQ_golden_square_desc: "จัตุรัสทองคํา กลุมนายทหารอิรักระดับสูง ยังคงเปนภัยตอเสถียรภาพของชาติ พวกเขาเห็นอกเห็นใจระบอบตอตานอังกฤษในยุโรป และฝากความหวังไววาระบอบเหลานั้นจะชวยสลัดแอกอิทธิพลอังกฤษเมื่อโอกาสมาถึง"
