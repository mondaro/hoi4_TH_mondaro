l_english:
 AFG_mohammad_zahir_shah_ns: "พระเจาซาฮีร ชาห"
 AFG_mohammad_zahir_shah_ns_desc: "พระเจาซาฮีร ชาห เสด็จขึ้นครองราชยหลังการสวรรคตของพระราชบิดาในป 1933 แตดวยพระชนมายุที่ยังนอยและไมมีฐานอํานาจทางการเมืองของพระองคเอง พระปตุลาของพระองคจึงกุมอํานาจที่แทจริงในรัฐบาล ทําใหพระองคเปนเพียงประมุขในนาม พระเจาซาฮีร ชาห จะตองตัดสินพระทัยวาจะรอคอยจังหวะ หรือรีบปลดพระปตุลาออกจากตําแหนง หากพระองคจะดําเนินวาระของพระองคเอง"
 AFG_mohammad_zahir_shah_ns_upgrade_1: "$AFG_mohammad_zahir_shah_ns$"
 AFG_mohammad_zahir_shah_ns_upgrade_1_desc: "$AFG_mohammad_zahir_shah_ns_desc$"
 AFG_mohammad_zahir_shah_ns_negative: "$AFG_mohammad_zahir_shah_ns$"
 AFG_mohammad_zahir_shah_ns_negative_desc: "$AFG_mohammad_zahir_shah_ns_desc$"
 AFG_subsistence_economy_modifier: "เศรษฐกิจแบบยังชีพ"
 AFG_subsistence_economy_modifier_desc: "ประชากรสวนใหญใชชีวิตในชนบท ผลิตอาหารเพียงพอสําหรับตนเองและครอบครัวเพื่อใหผานพนฤดูหนาวอันโหดราย พวกเขาแทบไมสนใจจะเปลี่ยนวิถีชีวิตเพื่อรองรับอุตสาหกรรมแสวงกําไรที่แผขยาย และไมนาจะเปลี่ยนความคิดนั้น ไมวาใครจะเปนผูกุมอํานาจในคาบูลก็ตาม"
 AFG_pashtunwali: "ปชตุนวาลี"
 AFG_pashtunwali_desc: "ชาวปชตุนเปนกลุมประชากรที่ใหญที่สุดและมีอํานาจทางการเมืองมากที่สุด ชาวปชตุนจํานวนมากดําเนินชีวิตตามจรรยาและกฎเกณฑดั้งเดิมที่เรียกวาปชตุนวาลี ทําใหรัฐบาลยากที่จะรักษาอํานาจไวได ไมตองพูดถึงการปฏิรูป หากดูขัดแยงกับจรรยาดั้งเดิมนี้"
 AFG_concessions_pashtunwali: "ประชาธิปไตยปชตุน"
 AFG_economic_regionalism: "ภูมิภาคนิยมทางเศรษฐกิจ"
 AFG_economic_regionalism_desc: "ภูมิภาคตาง ๆ ของอัฟกานิสถานขาดความเชื่อมโยงที่แนนแฟนกับรัฐบาลหรือเศรษฐกิจของชาติ เนื่องจากขาดโครงสรางพื้นฐานที่เหมาะสม ทําใหการแบงปนภาระหรือผลประโยชนทางเศรษฐกิจนอกภูมิภาคของตนเปนเรื่องยาก และทําใหภูมิภาคเหลานี้ยังคงโดดเดี่ยวตอไป"
 AFG_turkish_military_mission: "คณะผูแทนทางทหารตุรกี"
 AFG_turkish_military_mission_desc: "ตั้งแตป 1933 บุคลากรทางทหารของตุรกีไดชวยฝกทหารอัฟกันรุนใหม บางทีเมื่อเวลาผานไป ขอตกลงนี้อาจขยายออกไปเพื่อนําชาติอันยิ่งใหญของเราใหใกลชิดกันยิ่งขึ้น"
