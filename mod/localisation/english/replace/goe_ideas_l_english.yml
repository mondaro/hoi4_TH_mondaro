 PER_anglo_iranian_oil_ns: "บริษัทนํ้ามันแองโกล-อิหราน"
 PER_anglo_iranian_oil_ns_desc: "AIOC ซึ่งเดิมชื่อบริษัทนํ้ามันแองโกล-เปอรเซีย กอตั้งโดย[ENG.GetNameDef]ในป 1909 หลังการคนพบแหลงนํ้ามันขนาดใหญที่มัสเจด โซเลยมาน หลายคนใน[PER.GetNameDefCap]รูสึกวาบริษัทนี้เอาเปรียบทรัพยากรและแรงงานของชาติเรา และไมไดทําตามคําสัญญามากมายที่ตกลงไว"
 PER_rural_feudalism_ns: "ระบบศักดินาในชนบท"
 PER_rural_feudalism_ns_desc: "ระบบศักดินาเปนระบบที่ลาสมัย ซึ่งจัดโครงสรางสังคมรอบการถือครองที่ดินเพื่อแลกกับการรับใชและแรงงาน แมจะเปนแนวคิดจากยุคกลาง แตก็ยังคงดํารงอยูในพื้นที่ชนบทหลายแหงของ[PER.GetNameDef]"
 PER_lingering_islamic_beliefs: "ความเชื่ออิสลามที่ยังหลงเหลือ"
 PER_islamic_traditions_ns: "ขนบธรรมเนียมอิสลาม"
 PER_islamic_traditions_ns_desc: "ตามขนบดั้งเดิม อิหรานนับถือศาสนาอิสลามมาหลายชั่วอายุคน อิสลามถือเปนศาสนาประจําชาติและเปนศาสนาที่ประชากรสวนใหญนับถือ มีผูคนในรัฐบาลที่ตองการแยกศาสนาออกจากรัฐ แตการทําเชนนั้นจะเปนภารกิจมหึมาและตองเจอการตอตานอยางมาก"
 PER_secularized_state_idea: "รัฐฆราวาส"
 PER_secularized_state_idea_desc: "ภายใตราชวงศปาหลาวี มีพระราชโองการวา หากจะยืนเคียงขางชาติยิ่งใหญอื่น ๆ ของโลก [PER.GetNameDef]จะตองพัฒนาใหทันสมัย ซึ่งรวมถึงการแยกศาสนาออกจากรัฐ ประชาชนยังคงนับถืออิสลามได แตศาสนาจะไมมีอิทธิพลตอการเมืองของชาติเราอีกตอไป"
 PER_secularized_state_democratic_idea: "รัฐฆราวาส"
 PER_unification_initiative_idea: "โครงการรวมชาติ"
 PER_unification_initiative_idea_desc: "ไมใชความลับวาชาติของเราแตกแยกอยูบางสวน การปกครองของเราถูกคุกคามจากการกอกบฏที่อาจเกิดขึ้นของชาวเคิรดและชาวอาเซอรไบจาน รวมทั้งจากภายในรัฐบาลของเราเอง โครงการรวมชาติจะชวยขจัดภัยคุกคามเหลานี้และรักษาความเปนใหญของเราเหนือ[PER.GetNameDef]"
 PER_azerbaijan_resistance_idea: "การตอตานของชาวอาเซอรไบจาน"
 PER_azerbaijan_resistance_idea_desc: "[PER.GetNameDefCap]ครอบคลุมดินแดนบางสวนที่ครั้งหนึ่งเคยเปนของชาวอาเซอรไบจาน จึงมีชาวอาเซอรไบจานจํานวนมากที่ไมพอใจการปกครองของเรา ในหลายปกอน รัฐบาลของเราสามารถปราบปรามการกอกบฏหลายครั้งจากภูมิภาคนี้ของ[PER.GetNameDef]ได แตความรูสึกตอตานยังคงอยู"
 PER_kurdistan_resistance_idea: "การตอตานของชาวเคิรด"
 PER_kurdistan_resistance_idea_desc: "[PER.GetNameDefCap]ครอบคลุมดินแดนบางสวนที่ครั้งหนึ่งเคยเปนของชาวเคิรด จึงมีชาวเคิรดจํานวนมากที่ไมพอใจการปกครองของเรา ในหลายปกอน รัฐบาลของเราสามารถปราบปรามการกอกบฏหลายครั้งจากภูมิภาคนี้ของ[PER.GetNameDef]ได แตความรูสึกตอตานยังคงอยู"
 
 ############################
 #### INDUSTRIAL SPIRITS ####
 ############################

 PER_modernizing_iran_idea: "โครงการพัฒนาใหทันสมัย"
 PER_modernizing_iran_idea_desc: "การพัฒนา[PER.GetNameDef]ใหทันสมัยเปนสิ่งสําคัญยิ่งหากเราจะยืนเคียงขางชาติยิ่งใหญของโลก การดําเนินโครงการนี้เปนสัญญาณวาเราทุมเทใหกับการปรับปรุงโครงสรางพื้นฐานของชาติอันยิ่งใหญ และใหคํามั่นวาจะยกระดับชีวิตของพลเมือง"
 PER_a_modern_iran_idea: "อิหรานสมัยใหม"
 PER_a_modern_iran_idea_desc: "หลังการลงทุนและความพยายามอยางมหาศาล ในที่สุดเราก็บรรลุเปาหมายในการสราง[PER.GetName]ที่ทันสมัย"
 PER_adult_literacy_idea: "การรณรงคการรูหนังสือของผูใหญ"
 PER_adult_literacy_idea_desc: "การรูหนังสือในภาษาของตนเองเปนหนทางสําคัญที่สุดอยางหนึ่งที่ทําใหผูคนรูสึกเปนอิสระและมีพลัง หลังจากใหทุนแกการรณรงคทั่วประเทศเพื่อนําผูใหญกลับเขาสูโครงการการศึกษา เรานาจะเห็นการพัฒนาของ[PER.GetNameDef]ที่เพิ่มขึ้นในชวงระยะเวลาหนึ่ง"
 PER_trans_iranian_railway_idea: "กอสรางทางรถไฟสายทรานสอิหราน"
 PER_trans_iranian_railway_idea_desc: "ทางรถไฟสายทรานสอิหรานจะเปนหนึ่งในความสําเร็จทางวิศวกรรมที่ยิ่งใหญที่สุดในประเทศของเรา การทุมเทความพยายามสรางทางรถไฟภายในประเทศสายนี้จะชวยเพิ่มขีดความสามารถในการระดมพลยามสงคราม"
 PER_feat_of_engineering_idea: "ผลงานวิศวกรรมชั้นเยี่ยม"
 PER_feat_of_engineering_idea_desc: "ในที่สุดเราก็สรางทางรถไฟสายทรานสอิหรานเสร็จสมบูรณ เราสามารถลากเสนเลือดใหญสายสําคัญนี้คดเคี้ยวผานภูมิประเทศอันทุรกันดาร เพื่อใหเมืองตาง ๆ ของเราเชื่อมตอถึงกันไดดี เราควรภาคภูมิใจในตัวอยางอันงดงามของวิศวกรรม[PER.GetAdjective]นี้"
 PER_white_revolution_idea: "เปดฉากการปฏิวัติขาว"
 PER_white_revolution_idea_desc: "จําเปนตองมีการปฏิรูปอยางเขมขนเพื่อเรงการพัฒนาประเทศใหทันสมัย การปฏิวัติขาว หรือการปฏิวัติของพระเจาชาหและประชาชน จะนํา[PER.GetNameDef]ใหทัดเทียมกับชาติยิ่งใหญทางตะวันตก"
 PER_price_stabilization_idea: "การรักษาเสถียรภาพราคา"
 PER_price_stabilization_idea_desc: "เจาของโรงงานและธุรกิจเครือขายขนาดใหญคากําไรเกินควรจากคนงานและลูกคามานานเกินไปแลว เราควรพยายามรักษาเสถียรภาพราคาทั่ว[PER.GetNameDef] เพื่อกําหนดราคาสินคาทั่วประเทศ"
 PER_food_for_all_idea: "อาหารสําหรับชาว[PER.GetAdjective]ทุกคน"
 PER_food_for_all_idea_desc: "ทุพภิกขภัยเปนปญหาในประเทศของเรามานานเกินไปแลว หลังเปดตัวโครงการใหมที่ทําใหพลเมืองทุกคนเขาถึงอาหารพื้นฐานได เราจะไมตองตกลงสูหุบเหวแหงความทุกขทรมานอันมืดมิดเชนนั้นอีก"
 PER_tehran_power_grid_idea: "ขยายโครงขายไฟฟาเตหะราน"
 PER_tehran_power_grid_idea_desc: "ดวยการสรางโรงไฟฟาชุดใหมในเตหะราน เรายังคงพัฒนาชาติใหทันสมัยตอไปผานการขยายพื้นที่ใหบริการไฟฟา"
 PER_metropolitan_iran_idea: "มหานคร[PER.GetAdjective]"
 PER_metropolitan_iran_idea_desc: "เราขยายมหานคร[PER.GetAdjective]ใหกวางไกลเกินกวาขอบเขตของเตหะรานไดสําเร็จ เมืองตาง ๆ ของเราเติบโตและรุงเรืองจากความพยายามพัฒนาใหทันสมัยอยางกวางขวาง นี่คือวันอันรุงโรจนอยางแทจริง!"
 PER_oil_baron_idea: "เจาพอนํ้ามัน[PER.GetAdjective]"
 PER_oil_baron_idea_desc: "ประเทศของเราจมอยูในทะเลนํ้ามันอยางแทจริง โดยเฉพาะหลังความพยายามขจัดอิทธิพลของ[ENG.GetAdjective]เหนือทรัพยากรของเรา แลวเราจะทําอะไรกับนํ้ามันทั้งหมดนี้ละ? ก็กักตุนไวใชเองนะสิ"

 ##########################
 #### MILITARY SPIRITS ####
 ##########################

 PER_future_of_war_idea: "อนาคตแหงสงคราม"
 PER_future_of_war_idea_desc: "ไมอาจปฏิเสธไดวารถถังเปนสัญลักษณแหงอนาคตของการสงคราม ดวยการทุมทรัพยากรเพื่อพัฒนาเทคโนโลยียานเกราะ เราไดเตรียมพรอมสําหรับการเขารวมสงครามสมัยใหมสําเร็จแลว"
 PER_military_excellency_idea: "ความเปนเลิศทางทหาร[PER.GetAdjective]"
 PER_military_excellency_idea_desc: "ทายที่สุดเราตัดสินใจมุงเนนการฝกที่เขมงวดและเปนมืออาชีพสําหรับกองทัพประจําการของเรา สุดทายแลว ทหารที่มีวินัยดีจะเปนผูชนะในการรบ คุณภาพสําคัญกวาปริมาณ!"
 PER_foreign_retraining_idea: "โครงการฝกใหมโดยตางชาติ"
 PER_foreign_retraining_idea_desc: "ดวยการเชิญนายทหารตางชาติมาฝกทหารของเรา เราไดกาวแรกที่จําเปนในการปรับปรุงกองทัพที่ปจจุบันฝกมาไมดีและไรระเบียบ"
 PER_motorization_investments_idea: "การลงทุนดานยานยนต"
 PER_motorization_investments_idea_desc: "การลงทุนที่เราทําเพื่อพัฒนาอุตสาหกรรมยานยนตทางทหารจะคุมคา เมื่อทหารของเราเคลื่อนที่ผานสนามรบดวยความเร็วและความแมนยํา"
 PER_desert_training_idea: "การฝกเฉพาะทางในทะเลทราย"
 PER_desert_training_idea_desc: "หลังการฝกซอมและการเดินทัพขามที่ราบทรายอันยาวนาน ในที่สุดเราก็สรางโครงการฝกที่มีประสิทธิภาพ ซึ่งออกแบบมาเพื่อใหทหารของเรามีโอกาสรอดชีวิตในสนามรบทะเลทรายมากขึ้น"
 PER_conscription_idea: "ชายทุกคนตองรับใชชาติ"
 PER_conscription_idea_desc: "ยามสิ้นหวังตองใชมาตรการสิ้นหวัง แมเราจะทุมเทเวลาและทรัพยากรเพื่อสรางกองทัพมืออาชีพเต็มรูปแบบไมได แตเราสามารถทําใหชายฉกรรจทุกคนพรอมจับอาวุธและสูเพื่อประเทศชาติได"
 PER_special_units_division_idea: "กองพลหนวยพิเศษ"
 PER_special_units_division_idea_desc: "บัดนี้กองทัพของเราไดรับการเสริมดวยกองพลหนวยพิเศษ เราจึงขยายกองกําลังไดในแบบที่จะนําหนวยใหมเขาสูสนามรบ รวมทั้งปูทางสูการจัดตั้งโครงการจารกรรม"
 PER_savak_idea_no_lar: "กอตั้ง SAVAK แลว"
 PER_savak_idea_no_lar_desc: "SAVAK เปนหนวยงานพิเศษและตํารวจลับที่รับใช[PER.GetNameDef] ดวยแรงบันดาลใจจากสิงโตเปอรเซียบนตราสัญลักษณ เจาหนาที่ของเราทํางานอยางไมรูเหน็ดเหนื่อยเพื่อรักษาความมั่นคงแหงชาติของประเทศอันยิ่งใหญของเรา"
 PER_savak_lar: "$PER_savak_idea_no_lar$"
 PER_savak_lar_desc: "$PER_savak_idea_no_lar_desc$"
 PER_fund_state_intelligence_idea: "ใหทุนหนวยขาวกรองแหงรัฐ"
 PER_fund_state_intellignece_idea_desc: "เพื่อยกระดับความสามารถในการเฝาติดตามความมั่นคงของรัฐ เราไดทุมทรัพยากรเพื่อสรางการควบคุมที่เขมแข็งยิ่งขึ้นเหนือโครงการขาวกรองแหงรัฐ"
 PER_transfer_officer_idea_lar: "โอนยายนายทหารสูหนวยขาวกรอง"
 PER_transfer_officer_idea_lar_desc: "เมื่อหนวยขาวกรองของเราเติบโตขึ้น เราจึงจําเปนตองโอนยายนายทหารใหมบางสวนเขาสูหนวย การทําเชนนี้ชวยเพิ่มผลิตภาพของหนวยงานและจะรับประกันความปลอดภัยของชาติ"
 PER_transfer_officer_idea_no_lar: "$PER_transfer_officer_idea_lar$"
 PER_transfer_officer_idea_no_lar_desc: "$PER_transfer_officer_idea_lar_desc$"
 PER_airforce_modifier: "กองทัพอากาศอิหราน"
 PER_airforce_modifier_desc: "กองทัพอากาศอิหรานไมเคยเปนสิ่งที่เราใหความสําคัญสูงสุด แตเราเชื่อวาถึงเวลาแลวที่จะทุมเทเวลาและทรัพยากรเพื่อพัฒนากองทัพอากาศใหสมบูรณและฝกนักบินของเรา เราจะแสดงใหโลกเห็นวาเราสามารถชวงชิงการควบคุมนานฟาไดมากเพียงใด"
 PER_coastal_fortifications_idea: "โครงการเสริมปอมปราการชายฝง"
 PER_coastal_fortifications_idea_desc: "กองทัพเรือไมเคยเปนจุดแข็งที่สุดของเรา ดังนั้นเพื่อปกปอง[PER.GetNameDef]จากการยกพลขึ้นบก เราตองดําเนินโครงการเสริมปอมปราการชายฝง เพื่อใหแนวชายฝงของเราปลอดภัยตลอดชวงความขัดแยงใด ๆ"
 PER_state_local_defensive_dynamic_modifier: "ระเบียบปฏิบัติการปองกันทองถิ่น"

 ###################################
 #### IMPERIAL NATIONAL SPIRITS ####
 ###################################

 PER_legacy_of_greatness_modifier: "มรดกแหงความยิ่งใหญ"
 PER_legacy_of_greatness_modifier_desc: "ราชวงศปาหลาวีไดสถาปนาตนอยางมั่นคงในฐานะราชวงศที่ถูกลิขิตใหนํา[PER.GetNameDef]สูความยิ่งใหญและไกลกวานั้น แมการปฏิรูปของพระองคจะไมเปนที่นิยมในหมูคนบางกลุม แตไมตองสงสัยเลยวาการเปลี่ยนแปลงอยางถึงรากที่พระองคนํามาสูประเทศจะสงผลตอมุมมองที่สวนอื่นของโลกมีตอเรานับจากนี้ไป"
 PER_state_atheism_idea: "ความเปนฆราวาสอยางสมบูรณ"
 PER_state_atheism_idea_desc: "เปาหมายสูงสุดของเราคือการเลียนแบบชาติตะวันตกและนํา[PER.GetNameDef]เขาสูยุคสมัยใหม เราไมอาจปลอยใหหลักคําสอนทางศาสนาฉุดรั้งเราไดอีกตอไป แมอาจทําใหนักบวชในชาติไมพอใจ แตการสงเสริมความไมนับถือศาสนาในหมูพลเมืองก็เพื่อประโยชนของ[PER.GetNameDef]"
 PER_venerated_islam_idea: "เทิดทูนอิสลาม"
 PER_venerated_islam_idea_desc: "แมแนวคิดแรกเริ่มของเราจะเปนการแยกรัฐออกจากศาสนา แตเราไมอาจเพิกเฉยตอเจตจํานงของประชาชนไดอีกตอไป อิสลามเปนสวนสําคัญของวัฒนธรรม[PER.GetAdjective]มาหลายป และคงเปนเรื่องโงเขลาหากเราจะละทิ้งขนบธรรมเนียมเหลานี้"
 PER_old_ways_idea: "ฟนฟูศาสนาโซโรอัสเตอร"
 PER_old_ways_idea_desc: "ศาสนาโซโรอัสเตอรเปนหนึ่งในศาสนาเอกเทวนิยมที่เกาแกที่สุดของโลก กอตั้งขึ้นในเปอรเซียโบราณเมื่อศตวรรษที่ 6 กอนคริสตกาล ดวยความสําคัญยิ่งของศาสนานี้ตอวัฒนธรรมของจักรวรรดิเปอรเซียในอดีต เราจึงฟนฟูศาสนานี้ขึ้นมาใหม ดวยความหวังวาจะชวยรักษาภาพแหงความรุงโรจนในอดีตที่เราพยายามไขวความาตลอด"
 PER_imperial_expansionism_idea: "การขยายจักรวรรดิ"
 PER_imperial_expansionism_idea_desc: "ถึงเวลาแลวที่จะแสดงใหโลกเห็นวา[PER.GetNameDef]มีความสามารถเพียงใด เราเดินเครื่องสายการผลิตในโรงงาน และปลุกระดมประชาชนแลว อีกไมนานเราจะยกทัพสูสงครามเพื่อเกียรติยศและความยิ่งใหญ!"
 PER_war_plan_darius_idea: "แผนสงครามดาไรอัส"
 PER_war_plan_darius_idea_desc: "ดาไรอัสมหาราชเปนราชาธิราชพระองคที่สามแหงจักรวรรดิอะคีเมนิด ขณะที่พระองคปกครองจักรวรรดิในยุคที่มีดินแดนกวางใหญที่สุด พระองคคือผูขยายอิทธิพลเปอรเซียไปจนถึงลุมแมนํ้าสินธุในปากีสถานปจจุบัน จงสืบทอดอุดมการณการขยายดินแดนของพระองคและรุกคืบตอศัตรูทางตะวันออก!"
 PER_paying_for_baluchistan_idea: "ชดใชคาบาลูจิสถาน"
 PER_paying_for_baluchistan_idea_desc: "นาเสียดายที่[RAJ.GetNameDef]ไมยอมยกดินแดนนี้ใหโดยไมมีคาตอบแทน เราจะตองชําระหนี้เปนเวลาหนึ่งป"
 PER_sold_baluchistan_idea: "ขายบาลูจิสถานแลว"
 PER_sold_baluchistan_idea_desc: "เมื่อ[PER.GetNameDef]มาเรียกรองดินแดนบาลูจิสถาน เราสามารถรีดเงินจากพวกเขาเปนคาเสียเวลาไดบาง เราจะไดรับเงินงวดเปนเวลาราวหนึ่งป"
 PER_war_plan_xerxes_idea: "แผนสงครามเซอรซีส"
 PER_war_plan_xerxes_idea_desc: "เซอรซีสมหาราชเปนราชาธิราชพระองคที่สี่แหงจักรวรรดิอะคีเมนิด พระองคเปนที่รูจักมากที่สุดจากการรุกรานกรีซในป 480 กอนคริสตกาล และแมครั้งนั้นจะจบลงดวยความพายแพของเปอรเซีย แตครั้งนี้เราจะเปนผูชนะ จงรุกเขาสูทะเลอีเจียนและยึดคาบสมุทรตุรกีคืนมา"
 PER_war_plan_cambyses_idea: "แผนสงครามแคมไบซีส"
 PER_war_plan_cambyses_idea_desc: "แคมไบซีสที่ 2 เปนราชาธิราชพระองคที่สองแหงจักรวรรดิอะคีเมนิด พระองคครองราชยตั้งแตป 530 กอนคริสตกาล และรัชสมัยของพระองคโดดเดนดวยการพิชิตแอฟริกาเหนือ โดยเฉพาะอียิปต ซึ่งพระองคไดเปนฟาโรห เราตองเดินตามรอยพระองค มุงสูตะวันตกและพยายามยึดดินแดนเดิมของพระองคคืนมา"
 PER_persepolis_idea: "เพอรเซโพลิสที่สรางขึ้นใหม"
 PER_persepolis_idea_desc: "เพื่อแสดงพลังอํานาจในฐานะมหาอํานาจจักรวรรดิใหม เราไดบูรณะนครหลวงพิธีการแหงจักรวรรดิอะคีเมนิดขึ้นใหมสําเร็จ เพอรเซโพลิสจะตั้งตระหงานตลอดไปในฐานะสัญลักษณแหงความเปนเลิศของ[PER.GetAdjective]"
 PER_celebration_idea: "ความเฟองฟูหลังการเฉลิมฉลอง"
 PER_celebration_idea_desc: "การเฉลิมฉลองจักรวรรดิเปอรเซียโบราณประสบความสําเร็จ สงผลใหเศรษฐกิจของประเทศเฟองฟูอยางมหาศาล ดวยการทองเที่ยวและการคาที่เพิ่มขึ้นจากมิตรภาพที่เพิ่งสรางขึ้น เรานาจะไดรับอานิสงสจากการแสดงความมั่งคั่งอลังการนี้ไปอีกหนึ่งป"
 PER_spoils_of_war_idea: "ผลประโยชนจากสงคราม"
 PER_spoils_of_war_idea_desc: "หลังชวยเหลือพันธมิตรในสงครามไดสําเร็จ เราสามารถยึดครองดินแดนของเราเองไดเปนผลโดยตรงจากความขัดแยง ถึงเวลาที่เราจะนําดินแดนเหลานี้เขามาอยูในเขตอิทธิพลที่กําลังขยายตัวของเรา"
 PER_rapid_appeasement_idea: "การเอาใจอยางเรงดวน"
 PER_rapid_appeasement_idea_desc: "เพื่อสกัดการปฏิวัติอิสลามที่อาจเกิดขึ้น เราไดเสนอคาชดเชยเพื่อเอาใจฝายคาน สิ่งนี้นาจะชวยรักษาเสถียรภาพของประเทศไวไดสักพัก แมจะทําใหการพัฒนาของเราชาลงก็ตาม"
 PER_opposition_modifier: "ฝายคานที่กําลังกอตัว"
 PER_opposition_modifier_desc: "เมื่อความรังเกียจตอระบอบปาหลาวีเพิ่มขึ้น ผูคนจํานวนมากขึ้นเรื่อย ๆ ก็รวมตัวกันตอตานรัฐบาลปจจุบัน หากยังคงคุกรุนจนลนทะลักเชนนี้ ประเทศอาจตองเผชิญอนาคตที่ไมสงบ"
 PER_technological_modifier: "การลงทุนดานเทคโนโลยี"
 PER_constitutional_shah: "เรซา ชาห ปาหลาวี"
 PER_constitutional_shah_desc: "แมจะเปนภาพลักษณของการเปลี่ยนแปลงอันยิ่งใหญใน[PER.GetNameDef] แตบัดนี้เรซา ชาห ปาหลาวี ถูกลดบทบาทลงเปนพระมหากษัตริยภายใตรัฐธรรมนูญ พระองคเปนเพียงประมุขในนามเทานั้น ขณะที่รัฐบาลใหมของเราเขาควบคุมประเทศ"
 PER_aid_communists_cw: "ความเปนปกแผนระหวางประเทศ"
 PER_aid_communists_cw_desc: "เมื่อเราสลัดพันธนาการของจักรวรรดินิยมไดแลว เราตองพรอมสงความชวยเหลือไปยังชาติอื่น ๆ ทั่วโลกที่ยังทนทุกขภายใตแอกอาณานิคม"
 PER_communist_industrialization_idea: "การพัฒนาอุตสาหกรรมอยางรวดเร็ว"
 PER_communist_industrialization_idea_desc: "รัฐบาลสังคมนิยมใหมของเราจําเปนตองพัฒนาอุตสาหกรรมอยางรวดเร็วหากจะอยูรอดผานบททดสอบของกาลเวลา ทายที่สุดแลว เรานาจะกลายเปนภัยคุกคามตอผูที่หวาดกลัวการผงาดขึ้นของชนชั้นกรรมาชีพไปแลว"
 PER_iranian_radio_idea: "วิทยุแหงชาติอิหราน"
 PER_iranian_radio_idea_desc: "ระบบกระจายเสียงวิทยุแหงชาติของเราจะชวยเผยแพรความเห็นของรัฐในเรื่องที่สาธารณชนยังไมเห็นพองกันทั้งหมด"
 PER_the_new_economy_idea: "เศรษฐกิจใหม"
 PER_the_new_economy_idea_desc: "เศรษฐกิจใหมของเราสรางขึ้นบนความตองการของประชากร แทนที่จะเดินตามกระแสตลาด ทายที่สุดแลว เราตองการหลีกเลี่ยงความเสียหายที่ทุนนิยมกอไวแกชนชั้นแรงงานของเรา"
 KUR_resistance_modifier: "การตอตานของชาวเคิรด"
 KUR_resistance_modifier_desc: "แมเราจะพยายามอยางดีที่สุด แตชาวเคิรดในประเทศของเราก็กระสับกระสายและโกรธแคนมากขึ้น ชา ๆ แตแนนอน พวกเขาเริ่มกอกบฏตอเรา"
 PER_resistance_modifier: "หนวยตอตาน"
 PER_resistance_modifier_desc: "ภูมิภาคนี้ถูกรุมเราโดยหนวยตอตานที่[PER.GetNameDef]บงการ"
 PER_promoting_resistance_here: "สงเสริมการตอตานที่นี่"
 PER_gulf_hegemony_idea: "ความเปนเจาแหงอาวเปอรเซีย"
 PER_gulf_hegemony_idea_desc: "ดวยการเดินหมากอยางรอบคอบ ในที่สุดเราก็สถาปนาตนเปนมหาอํานาจหลักในภูมิภาคอาวเปอรเซีย"
 PER_restoring_the_nation_idea: "ฟนฟูชาติ"
 PER_restoring_the_nation_idea_desc: "การปรับโครงสรางรัฐบาลไดสรางความไรเสถียรภาพและความแตกแยกในชาติ เราตองฟนฟูเสถียรภาพและเอกภาพของชาติกอนจะเดินหนาตามแผนของเราได"
 PER_fascism_sway_the_rich_idea: "โนมนาวชนชั้นนํา"
 PER_fascism_sway_the_rich_idea_desc: "เพื่อใหรัฐบาลใหมของเรารุงเรือง เราตองรักษาการควบคุมเหนือชาติ เราตองโนมนาวชนชั้นนําอิหรานใหมาอยูขางเรามากที่สุดเทาที่จะทําได เพื่อใหการกุมอํานาจเหนืออิหรานของเรายังคงมั่นคง"
 PER_invite_foreign_investors: "การลงทุนจากตางชาติ"
 PER_invite_foreign_investors_desc: "ดวยการยื่นมือไปหาประชาธิปไตยอื่น ๆ ทั่วโลก เราสามารถกระตุนและอัดฉีดทรัพยากรเขาสูเศรษฐกิจที่กําลังเติบโตของเราได"
 PER_resist_gharbzadegi_idea: "ตอตานลัทธิคลั่งตะวันตก"
 PER_resist_gharbzadegi_idea_desc: "การคลั่งตะวันตกเกินเหตุเปนโรคระบาดที่รุมเราชาติอันยิ่งใหญของเรา แทนที่จะคลอยตามความตองการของผูที่ใชเวลาหลายศตวรรษลาอาณานิคมในภูมิภาคของเรา เราควรสรางรัฐประชาธิปไตยที่ยืนไดดวยลําแขงของตนเอง"
 PER_clash_of_titans_idea: "ศึกแหงยักษใหญ"

 #####################################
 #### HISTORICAL NATIONAL SPIRITS ####
 #####################################

 PER_stand_with_giants_modifier: "ยืนเคียงยักษใหญ"
 PER_stand_with_giants_modifier_desc: "นับตั้งแตขึ้นสูอํานาจ เรซา ชาห ปาหลาวี ทรงตองการพัฒนา[PER.GetNameDef]ใหทันสมัยและไลทันชาติยิ่งใหญอื่น ๆ ของโลก นี่คือจุดเริ่มตนของการปฏิรูปทางสังคม เศรษฐกิจ และการเมืองครั้งใหมมากมายใน[PER.GetNameDef] และจะพัฒนาตอไปเมื่อเราเดินหนาในทิศทางนี้"
 PER_persian_german_trade_idea: "หอการคาเปอรเซีย-เยอรมัน"
 PER_persian_german_trade_idea_desc: "องคกรที่จัดตั้งขึ้นเพื่อสงเสริมความสัมพันธทางการคาที่ดีระหวาง[PER.GetNameDef]และ[GER.GetNameDef] รวมทั้งเพื่อใหอุตสาหกรรมของเราพัฒนาใหทันสมัยตอไปตามแบบอยางของหนึ่งในมหาอํานาจอุตสาหกรรมที่โดดเดนที่สุดของโลก"
 PER_trial_fifty_three_idea: "ดําเนินการพิจารณาคดีหาสิบสามคนแลว"
 PER_trial_fifty_three_idea_desc: "หลังจับกุมชาวอิหรานหาสิบสามคนในขอหาเกี่ยวของกับกิจกรรมการเมืองคอมมิวนิสต เราสามารถนําพวกเขาขึ้นพิจารณาคดีในขอหาตอตานรัฐบาล เราไมอาจปลอยใหการกระดางกระเดื่องเชนนี้หยั่งรากในชวงเวลาวิกฤตของชาติ"
 PER_homeland_not_fall_idea: "จิตวิญญาณนักสูของเรา"
 PER_homeland_not_fall_idea_desc: "ถึงเวลาพิสูจนความกลาและยืนหยัดอยางมั่นคงตอผูที่คุกคามบานเกิดของเรา จงรวมพลทหาร เชื่อมั่นในพี่นอง และเตรียมสูเพื่ออนาคตของประเทศ [PER.GetNameDefCap]จะไมพายแพตอพวกผูรุกรานเหลานี้! ไลพวกมันใหหางจุกตูดหนีไป!"
 PER_preemtive_strike_idea: "ชิงโจมตีกอน"
 PER_preemtive_strike_idea_desc: "เราไมมีเวลามานั่งรอใหถูกรุกราน! สิ่งสําคัญคือตองตีเหล็กตอนรอน และสรางรัฐกันชนระหวางเรากับชาติใหญที่บังอาจคุกคามอธิปไตยของเรา!"
 PER_compliant_subject_idea: "รัฐในอารักขาผูวางาย"
 PER_compliant_subject_idea_desc: "ไมมีชัยชนะใดจะไดมาจากการตอตานมหาอํานาจอยาง[ROOT.OVERLORD.GetNameDef] เราตองทําหนาที่ในฐานะรัฐในอารักขา และแสดงใหเห็นวาเราคูควรที่จะเปนรัฐบริวารที่ทรงพลัง"
 PER_anti_soviet_idea: "กระแสตอตานโซเวียต"
 PER_anti_soviet_idea_desc: "หลังจากที่พวกเขายึดดินแดนของเราไประหวางการรุกรานอิหราน ถึงเวลาที่เราจะเอาคืนพวกกระหายสงครามเหลานี้และยึดสิ่งที่เปนของเราโดยชอบธรรมกลับมา เราจะไมหยุดจนกวาดินแดนเดิมของเราจะกลับมาเปนของเราอีกครั้ง"
 PER_azadi_idea: "จิตวิญญาณแหงอาซาดี"
 PER_azadi_idea_desc: "อาซาดี หรือ 'เสรีภาพ' ในภาษาเปอรเซีย จะเปนเสียงเรียกรวมพลของเราขณะพยายามลุกขึ้นตอตานกองกําลังที่ยึดครองแผนดินของเรา เราจะไมกมหัวใหเจตจํานงของพวกเขา แตจะสูเพื่อเสรีภาพ ไมวาจะใชเวลานานเพียงใด"
 PER_offensive_tactics_modifier: "ยุทธวิธีเชิงรุก"
 PER_offensive_tactics_modifier_desc: "หนทางเดียวที่เราจะปกปอง[PER.GetNameDef]ไดคือการรุกทันที เมื่อใชยุทธวิธีใหมเหลานี้ เราจะอยูในสถานะที่ดีที่จะผลักดันศัตรูใหถอยกลับไป!"
 PER_defensive_maneuvers_modifier: "การดําเนินกลยุทธตั้งรับ"
 PER_defensive_maneuvers_modifier_desc: "แนวปองกันของเราตองมั่นคงไมสั่นคลอนดั่งเทือกเขา หากจะไมใหศัตรูคุกคามเมืองของเรา หวังวากลยุทธตั้งรับที่เพิ่งนํามาใชจะตรึงกองกําลังขาศึกไวกับที่ได!"
 PER_enemy_war_reparations_idea: "คาปฏิกรรมสงคราม"
 PER_enemy_war_reparations_idea_desc: "เนื่องจากปฏิบัติการของเราใน[PER.GetNameDef]ลมเหลว บัดนี้เราตองชดใชคาใชจายมหาศาลของการรุกราน แมจะไมใชสิ่งที่ปรารถนา แตเรานาจะชดใชคาปฏิกรรมไดครบภายในสองป"
