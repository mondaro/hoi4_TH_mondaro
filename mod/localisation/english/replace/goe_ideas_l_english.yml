 SSB_saadabad_pact: "กติกาสัญญาซาดาบาด"
 SSB_saadabad_pact_desc: "สนธิสัญญาไมรุกรานกับประเทศอื่น ๆ ในตะวันออกกลาง ซึ่งอาจนําไปสูความรวมมือที่กวางขวางและแนนแฟนยิ่งขึ้น\n\n §Rการเปดสงครามรุกรานตอสมาชิกใด ๆ ของกติกาสัญญาซาดาบาดจะทําใหคุณสูญเสียจิตวิญญาณนี้อยางถาวร§!"
 SSB_saadabad_trade_agreement: "ขอตกลงการคาซาดาบาด"
 SSB_saadabad_trade_agreement_desc: "ขอตกลงการคารวมกันระหวางภาคีดั้งเดิมของกติกาสัญญาซาดาบาด ซึ่งเอื้อตอความรวมมือที่มากขึ้นและเศรษฐกิจที่บูรณาการกันยิ่งขึ้น โดยยกเลิกภาษีศุลกากรทั้งหมดและรวมทรัพยากรเขาดวยกัน"
 