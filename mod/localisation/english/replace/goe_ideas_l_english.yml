 RAJ_a_loyal_government_desc: "แมผูเห็นตางภายใน[RAJ.GetNameDef]จะปรารถนาเอกราช แตรัฐบาลของเรายังคงเขมแข็งและมั่นคง เราจะยังคงพิทักษผลประโยชนของราชบัลลังกดวยวินัยและความแนวแนตอไป"
 RAJ_high_import_duties: "อากรขาเขาสูง"
 RAJ_high_import_duties_desc: "เราไดออกนโยบายใหมเพื่อปกปองอุตสาหกรรมทองถิ่นและรักษาผลผลิตทางเศรษฐกิจของ[RAJ.GetNameDef] ดวยอากรขาเขาที่สูงขึ้นสําหรับสินคาตางประเทศ เราจะทําให[RAJ.GetNameDef]ยืนไดดวยลําแขงของตนเองในแวดวงเศรษฐกิจโลก"
 RAJ_the_zamindari_system: "ระบบซามินดารี"
 RAJ_the_zamindari_system_desc: "ดวยการขยายระบบซามินดารี เราไดสรางประสิทธิภาพในการบริหารดวยการมอบอํานาจใหเจาที่ดินผูภักดีที่รักษาความสงบเรียบรอยในพื้นที่ชนบทของประเทศ"
 RAJ_exports_for_the_empire: "สินคาสงออกของอินเดียเพื่อจักรวรรดิ"
 RAJ_exports_for_the_empire_desc: "การคาอาณานิคมเปนกระดูกสันหลังของจักรวรรดิ[ENG.GetAdjective]มาหลายศตวรรษ และสินคาสงออกจาก[RAJ.GetNameDef]ก็ไมตางกัน ดวยการใหความสําคัญกับการเพาะปลูกพืชหลักอยางชา ฝาย และปอกระเจา เราไดสรางกระแสรายไดที่มั่นคงใหแกตนเองและจักรวรรดิ"
 RAJ_war_industry: "อุตสาหกรรมสงคราม"
 RAJ_war_industry_dec: "ดวยความมุงมั่นและความแนวแนอยางไมรูเหน็ดเหนื่อย เราตองสนับสนุนความพยายามทางสงครามดวยการเพิ่มเงินทุนใหอุตสาหกรรมอาวุธ ประชาชนของเราจะหลอมชัยชนะดวยความกลาหาญ หยาดเหงื่อ และเหล็กกลา"
