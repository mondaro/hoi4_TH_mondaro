 BBA_ethiopia_communist_events.52.t: "[ETH.GetNameDefCap] ตัดสัมพันธกับ[SOV.GetNameDef]"
 BBA_ethiopia_communist_events.52.desc: "รัฐบาล[ETH.GetAdjective]ไดวางแผนปฏิบัติการเพื่อทําลายอํานาจที่เรามีเหนือกิจการของประเทศนั้น เจาหนาที่[SOV.GetAdjective]ทั่ว[ETH.Capital.GetCapitalVictoryPointName]ถูกทหาร[ETH.GetAdjective]คุมตัวไปยังศูนยกักกันชั่วคราว กอนที่ [ETH.Getleader] จะแจงเอกอัครราชทูตของเราวา[ETH.GetLeader.GetSheHe]จะเขาควบคุมกิจการของ[ETH.GetAdjective]อยางเต็มที่นับจากนี้ หากเราลงมืออยางรวดเร็ว เราอาจกลับมาควบคุมสถานการณได แตโอกาสที่จะทําเชนนั้นกําลังหมดลงอยางรวดเร็ว"
 BBA_ethiopia_communist_events.52.a: "เรามีเรื่องสําคัญกวาตองจัดการ"
 BBA_ethiopia_communist_events.52.b: "เราจะสั่งสอนใหพวกเขารูสํานึกในความผิด"

 BBA_ethiopia_communist_events.53.t: "[SOV.GetNameDefCap] ปฏิเสธที่จะสงที่ปรึกษา"
 BBA_ethiopia_communist_events.53.desc: "ในเหตุการณที่นาผิดหวัง นักการทูต[SOV.GetAdjective]แจงเราวาพวกเขาไมสามารถแบงกําลังพลทางทหารมาใหไดในขณะนี้ โดยอางถึงขอกังวลดานความมั่นคงใกลพรมแดนของตนที่ตองใหความสําคัญกอน อยางไรก็ตาม เพื่อแสดงไมตรีจิต พวกเขาไดสงยุทโธปกรณทหารราบมาใหเราหนึ่งล็อต"
 BBA_ethiopia_communist_events.53.a: "ดีกวาไมมีอะไรเลย"

 BBA_ethiopia_communist_events.54.t: "ความชวยเหลือลับจาก[JAP.GetNameDef]"
 BBA_ethiopia_communist_events.54.desc: "ดวยอาสาสมัคร[JAP.GetAdjective]จํานวนมากที่เพิ่งหลั่งไหลมารวมการตอสูของเรา เราไดรับแจงวารัฐบาลใน[JAP.Capital.GetCapitalVictoryPointName]กําลังสงความชวยเหลือดานวัตถุในรูปของยุทโธปกรณทหารราบมาให ยุทโธปกรณที่หลั่งไหลเขามานี้จะเปนแรงหนุนครั้งใหญใหการปฏิวัติ อยางไรก็ตาม รัฐบาล[JAP.GetAdjective]ตองการใหเราปดเรื่องแหลงที่มาของยุทโธปกรณไว เพื่อหลีกเลี่ยงผลกระทบทางการทูตจากมหาอํานาจอื่นๆ"
 BBA_ethiopia_communist_events.54.a: "ขอบคุณ สหาย!"

 BBA_ethiopia_communist_events.55.t: "กลุมบอนทําลาย[JAP.GetAdjective]หลบหนีออกจากจักรวรรดิ"
 BBA_ethiopia_communist_events.55.desc: "เคมเปไตรายงานวากลุมบอนทําลายจํานวนหนึ่งไดหลบหนีออกจากเขตอํานาจของจักรวรรดิโดยลงเรือสินคามุงหนาสูแอฟริกาตะวันออก มีขาวลือวาในจํานวนนั้นมี $IA_sakutaro_iwasa$ และ $IA_sanshiro_ishikawa$ อยูดวย พวกเขานาจะตั้งใจไปเขารวมขบวนการปฏิวัติใน[ETH.GetNameDef]"
 BBA_ethiopia_communist_events.55.a: "ดีเลย ปญหาคลี่คลายไปเอง"
 BBA_ethiopia_communist_events.55.b: "ตองสงตัวพวกคนทรยศกลับมายัง[JAP.GetName]โดยทันที!"

 BBA_ethiopia_communist_events.56.t: "อาสาสมัคร[JAP.GetAdjective]มุงหนาสูแอฟริกาตะวันออก"
 BBA_ethiopia_communist_events.56.desc: "หนวยขาวกรองแจงเราวาพวกเขาไดชวยใหอาสาสมัครจํานวนหนึ่งเดินทางสูแอฟริกาตะวันออกไดอยางปลอดภัย เพื่อไปชวยเหลือขบวนการปฏิวัติที่นั่น ในบรรดาอาสาสมัครมี $IA_sakutaro_iwasa$ และ $IA_sanshiro_ishikawa$ รวมอยูดวย "
 BBA_ethiopia_communist_events.56.a: "กัมบาเระ สหาย!"
 BBA_ethiopia_communist_events.56.b: "บางทีเราอาจชวยสนับสนุนการตอสูของ[ETH.GetNameDef]ไดมากกวานี้..."

 BBA_ethiopia_communist_events.57.t: "[JAP.GetNameDefCap] เรียกรองใหสงตัว $IA_sakutaro_iwasa$ และ $IA_sanshiro_ishikawa$ ขามแดน"
 BBA_ethiopia_communist_events.57.desc: "เราไดรับคํารองอยางเปนทางการจากรัฐบาล[JAP.GetName] เรียกรองใหสงตัวพสกนิกร[JAP.GetAdjective]ทุกคนที่เดินทางเขามาในประเทศโดยมีเจตนาจะเขารวมขบวนการปฏิวัติของเรากลับไป แมจะยังไมชัดวาพวกเขาคิดจะทําอะไร แตคํารองระบุชัดวาหากไมยอมทําตามจะตองมีผลตามมา"
 BBA_ethiopia_communist_events.57.a: "เราจะไมยอมจํานนตอการขมขูของพวกปฏิกิริยา สวนเรื่องจักรพรรดิของพวกเขานั้น..."

 BBA_ethiopia_communist_events.58.t: "ความสัมพันธ[ETH.GetNameDef]–[JAP.GetName]พังทลาย"
 BBA_ethiopia_communist_events.58.desc: "อยางที่คาดไว พวกกลุมปฏิวัติเถื่อนที่ปกครอง[ETH.GetNameDef]ปฏิเสธที่จะสงตัวผูเห็นตาง[JAP.GetAdjective]ที่เดินทางเขาไปในประเทศ ดวยความไรมารยาททางการทูตอยางหยาบคายที่สุด คําตอบของพวกเขายังเต็มไปดวยคําขมขูตอองคจักรพรรดิอันรุงโรจนของเรา!"
 BBA_ethiopia_communist_events.58.a: "จะหวังอะไรไดจากพวกโงเขลาที่ทําลายมรดกของตนเอง"
 BBA_ethiopia_communist_events.58.b: "เราจะไมยอมทนตอการหมิ่นเกียรติเชนนี้!"

 BBA_ethiopia_communist_events.59.t: "การควํ่าบาตรของ[JAP.GetAdjective]"
 BBA_ethiopia_communist_events.59.desc: "ดูเหมือนวาการที่เราปฏิเสธขอเรียกรองของ[JAP.GetAdjective]เมื่อเร็วๆ นี้จะไปกระทบใจรัฐบาลของพวกเขาเขา พวกเขาประกาศวาจะควํ่าบาตรเราไปอีกนาน ดวยเหตุผลที่พวกเขาเรียกวา 'กิจกรรมทางอุดมการณที่เปนภัย' ในภูมิภาคแอฟริกาตะวันออก"
 BBA_ethiopia_communist_events.59.a: "ยังไงเราก็ไมตองพึ่งการคากับพวกเขาอยูแลว"

 BBA_ethiopia_communist_events.60.t: "[FROM.GetName]ปฏิเสธขอเสนอสันติภาพ"
 BBA_ethiopia_communist_events.60.desc: "เอกอัครราชทูตจาก[FROM.GetNameDef]ไดปฏิเสธขอเสนอสันติภาพของเรา โดยอางวาการโจมตีของเราไมมีเหตุอันควรโดยสิ้นเชิง ดังนั้นพวกเขาจะไมยอมรับสิ่งใดนอกจากการยอมจํานนโดยไมมีเงื่อนไขจากเรา ในฐานะที่เราเปนภัยตอสันติภาพของภูมิภาค"
 BBA_ethiopia_communist_events.60.a: "ชางหนาไหวหลังหลอก ความรุนแรงแบบจักรวรรดินิยมของพวกเขาหยุดไดดวยกําลังเทานั้น"

 BBA_ethiopia_communist_events.61.t: "[FROM.GetNameDefCap] เสนอสันติภาพแลกกับเอกราชของ[?ETH.ETH_disputed_colony.GetAdjective]"
 BBA_ethiopia_communist_events.61.desc: "นักการทูต[FROM.GetAdjective]ไดติดตอเราพรอมขอเสนอสันติภาพ ขอเสนอนี้ขึ้นอยูกับวาเราจะยอมสละการอางสิทธิ์เหนือดินแดน[?ETH.ETH_disputed_colony.GetAdjective]ที่เราเสียใหแก[FROM.GetNameDef]ระหวางความขัดแยงนี้หรือไม นักการทูตยังระบุวาจะมีการลงคะแนนเสียงในดินแดน[?ETH.ETH_disputed_colony.GetAdjective]ที่ถูกสละเพื่อเลือกรัฐบาลใหม สวนการเลือกตั้งนั้นจะเปนอิสระเพียงใดยังไมชัดเจน"
 BBA_ethiopia_communist_events.61.a: "เราจะไมยอมสละดินแดนของเรา"
 BBA_ethiopia_communist_events.61.b: "เราไมมีทางเลือกนอกจากตองยอมรับ"

 BBA_ethiopia_communist_events.62.t: "[FROM.GetName]ยอมรับขอเสนอสันติภาพ"
 BBA_ethiopia_communist_events.62.desc: "นักการทูตจาก[FROM.GetNameDef]แจงเราวารัฐบาลของพวกเขายินดีสละการอางสิทธิ์เหนือดินแดน[?ETH.ETH_disputed_colony.GetAdjective]ที่เราไดปลดปลอยแลว บัดนี้พวกเขากําลังถอนกําลังไปยังพรมแดนที่เพิ่งกําหนดขึ้นใหมในภูมิภาค"
 BBA_ethiopia_communist_events.62.a: "ชัยชนะอันกลาหาญเหนือลัทธิจักรวรรดินิยม!"

 BBA_african_union_events.1.t: "องคการเอกภาพแอฟริกาเสนอสถานะสมาชิก"
 BBA_african_union_events.1.desc: "องคการเอกภาพแอฟริกาไดลงมติเสนอสถานะสมาชิกใหแกเรา องคการนี้มีเปาหมายเพื่อรวมชาติตางๆ ในแอฟริกาใหมาหารือและรวมมือกันในประเด็นที่มีผลประโยชนรวมกัน หากเราเขารวม อาจนําไปสูขอตกลงปองกันรวมกันระหวางรัฐสมาชิก แตเราก็ตองปฏิบัติตามกฎขององคการดวย"
 BBA_african_union_events.1.a: "การเปนสมาชิกจะเปนประโยชนตอเรา"
 BBA_african_union_events.1.b: "เราไมสนใจชมรมของพวกเขา"
 BBA_african_union_events.2.t: "[FROM.GetNameDefCap] เขารวมองคการเอกภาพแอฟริกา"
 BBA_african_union_events.2.desc: "[FROM.GetNameDefCap]ไดตอบรับขอเสนอสถานะสมาชิกขององคการเอกภาพแอฟริกา หวังวานี่จะเปนจุดเริ่มตนของความสัมพันธที่รวมมือกันมากขึ้นระหวางชาติของเรา "
 BBA_african_union_events.2.a: "เราเขมแข็งขึ้นเมื่ออยูดวยกัน"
 BBA_african_union_events.3.t: "[FROM.GetNameDefCap] ปฏิเสธการเปนสมาชิกองคการเอกภาพแอฟริกา"
 BBA_african_union_events.3.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอสถานะสมาชิกขององคการเอกภาพแอฟริกา ยังไมชัดเจนวาเปนเพียงเพราะการเมืองภายใน หรือเปนสัญญาณวาความทะเยอทะยานดานนโยบายตางประเทศในแอฟริกาของพวกเขาไปดวยกันไมไดกับของเรา บางทีในอนาคตพวกเขาอาจยินดีเขารวม"
 BBA_african_union_events.3.a: "นาเสียดาย"
 BBA_african_union_events.4.t: "การเปนสมาชิก[ETH_GetCentralBankName]"
 BBA_african_union_events.4.desc: "องคการเอกภาพแอฟริกาไดจัดตั้ง[ETH_GetCentralBankName]ขึ้น โดยมีอํานาจหนาที่บริหารสกุลเงินขององคการที่กําลังเติบโต เปาหมายคือใหสมาชิกทุกประเทศใชสกุลเงินรวมกันและเริ่มบูรณาการเศรษฐกิจเขาดวยกัน ซึ่งหวังวาจะเกิดประโยชนทางเศรษฐกิจในอนาคต แตการเขารวมจะกอปญหามากมายในระยะสั้นขณะที่ประชาชนปรับตัวกับสกุลเงินใหม"
 BBA_african_union_events.4.a: "ความเจ็บปวดระยะสั้นจะคุมคา"
 BBA_african_union_events.4.b: "สิ่งนี้จะทําลายเศรษฐกิจของเรา"
 BBA_african_union_events.5.t: "[FROM.GetNameDefCap] ปฏิเสธการเปนสมาชิก[ETH_GetCentralBankName]"
 BBA_african_union_events.5.desc: "รัฐบาลของ[FROM.GetNameDefCap]ปฏิเสธที่จะเขารวม[ETH_GetCentralBankName] โดยเลือกที่จะควบคุมสกุลเงินและอัตราภาษีศุลกากรของตนเองตอไปในอนาคตอันใกล"
 BBA_african_union_events.5.a: "เปนการตัดสินใจที่มองการณใกล"
 BBA_african_union_events.6.t: "[FROM.GetNameDefCap] เขารวม[ETH_GetCentralBankName]"
 BBA_african_union_events.6.desc: "[FROM.GetNameDefCap]ตกลงเขารวม[ETH_GetCentralBankName] และไดเริ่มกระบวนการปรับสกุลเงินใหสอดคลองกับของเราแลว อีกไมนานการคาระหวางชาติของเราจะสะดวกขึ้นมาก"
 BBA_african_union_events.6.a: "เปนการตัดสินใจที่ชาญฉลาด"
 BBA_african_union_events.7.t: "คณะมนตรีบริหารองคการเอกภาพแอฟริกา"
 BBA_african_union_events.7.desc: "องคการเอกภาพแอฟริกาไดจัดตั้งคณะมนตรีบริหารขึ้นเพื่อดูแลกิจการทางการเมืองของสมาชิก คณะมนตรีประกอบดวยผูแทนจากรัฐสมาชิก และพยายามชี้นํานโยบายตางประเทศและนโยบายภายในใหเปนไปในทิศทางเดียวกัน การเขารวมจะเปนกาวหนึ่งสูการบูรณาการทางการเมืองและเศรษฐกิจอยางเต็มรูปแบบกับรัฐสมาชิกอื่นๆ แตแนนอนวาหากเราเขารวม เราจะตองสูญเสียความเปนอิสระทางการเมืองที่มีอยูในปจจุบัน"
 BBA_african_union_events.7.a: "เรามุงมั่นสูการบูรณาการที่ลึกซึ้งยิ่งขึ้น"
 BBA_african_union_events.7.b: "เราไมไดสมัครมาเพื่อเรื่องนี้"
 BBA_african_union_events.8.t: "[FROM.GetNameDefCap] เขารวมคณะมนตรีบริหาร"
 BBA_african_union_events.8.desc: "รัฐบาล[FROM.GetNameDef]ไดตกลงเขารวมคณะมนตรีบริหารขององคการเอกภาพแอฟริกา และกําลังอยูในขั้นตอนการลงนามสนธิสัญญาที่เกี่ยวของ ซึ่งรับรองอํานาจของคณะมนตรีในทุกเรื่องทางกฎหมาย"
 BBA_african_union_events.8.a: "อีกกาวหนึ่งสูการบูรณาการอยางสมบูรณ"
 BBA_african_union_events.9.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวมคณะมนตรีบริหาร"
 BBA_african_union_events.9.desc: "รัฐบาล[FROM.GetNameDef]ปฏิเสธที่จะเขารวมคณะมนตรีบริหารขององคการเอกภาพแอฟริกา [FROM.GetLeader] อางถึงขอกังวล[FROM.GetLeader.GetHerHis]ดานอธิปไตย และความตองการที่จะทําขอตกลงกับชาติภายนอกองคการไดโดยไมตองไดรับอนุมัติจากคณะมนตรี"
 BBA_african_union_events.9.a: "แลวพวกเขาจะเปนรัฐสมาชิกไปทําไม?"
 BBA_african_union_events.10.t: "[FROM.GetNameDefCap] สงเสริมองคการเอกภาพแอฟริกา"
 BBA_african_union_events.10.desc: "[FROM.GetNameDefCap]ไดเริ่มรณรงคโฆษณาชวนเชื่อในประเทศของเรา เพื่อพยายามปรับภาพลักษณขององคการเอกภาพแอฟริกาใหดีขึ้น ซึ่งไมตองสงสัยเลยวาเปนการกดดันใหเราบูรณาการเขากับองคการมากขึ้น"
 BBA_african_union_events.10.a: "พวกเขาไมควรมาแทรกแซงกิจการของเรา"
 BBA_african_union_events.11.t: "แรงกดดันจาก[FROM.GetAdjective]"
 BBA_african_union_events.11.desc: "[FROM.GetNameDefCap]ไดขมขูสมาชิกรัฐบาลของเราเปนการสวนตัว หากเราไมเริ่มปรับเปาหมายนโยบายใหสอดคลองกับพวกเขา ซึ่งไมตองสงสัยเลยวาเปนการกดดันใหเราบูรณาการเขากับองคการเอกภาพแอฟริกามากขึ้น"
 BBA_african_union_events.11.a: "เราจะระมัดระวังใหมากขึ้นในอนาคต"
 BBA_african_union_events.11.b: "เราจะไมยอมให [ETH.GetLeader] ขมเหง"
 BBA_african_union_events.12.t: "กระบวนการบูรณาการเต็มรูปแบบเริ่มตนขึ้น"
 BBA_african_union_events.12.desc: "สหภาพแอฟริกาไดเริ่มกระบวนการบูรณาการเราเขาสูสหภาพของพวกเขาอยางเต็มรูปแบบ หวังวานี่จะนําไปสูบทใหมทางประวัติศาสตรที่ดีขึ้นสําหรับประชาชนของเรา แตยังตองรอดูวาเปาหมายสูงสุดของสหภาพแอฟริกาจะเปนเชนไร"
 BBA_african_union_events.12.a: "เรารูอยูแลววาวันนี้จะตองมาถึง"
 BBA_african_union_events.13.t: "[FROM.GetNameDefCap] ถอนตัวจากองคการเอกภาพแอฟริกา"
 BBA_african_union_events.13.desc: "[FROM.GetLeader] ไดประกาศการถอนตัวของ[FROM.GetNameDef]จากองคการเอกภาพแอฟริกา โดยอางถึงความกังวลตอทิศทางขององคการ และกลาวหาวาเราทรยศตอคุณคาที่องคการกอตั้งขึ้นมา"
 BBA_african_union_events.13.a: "เราตกลงที่จะเห็นตางกัน"
 BBA_african_union_events.14.t: "[FROM.GetNameDefCap] ถอนตัวจากองคการเอกภาพแอฟริกา"
 BBA_african_union_events.14.desc: "[FROM.GetLeader] ไดประกาศการถอนตัวของ[FROM.GetNameDef]จากองคการเอกภาพแอฟริกา โดยอางถึงความกังวลตอทิศทางขององคการ และกลาวหาวาเราทรยศตอคุณคาที่องคการกอตั้งขึ้นมา"
 BBA_african_union_events.14.a: "เราตกลงที่จะเห็นตางกัน"
 BBA_african_union_events.14.b: "นี่มันอุกอาจเกินไป!"
 BBA_african_union_events.15.t: "ขอตกลงปองกันรวมขององคการเอกภาพแอฟริกา"
 BBA_african_union_events.15.desc: "องคการเอกภาพแอฟริกาไดเสนอขอตกลงปองกันรวมกันระหวางรัฐสมาชิก ซึ่งหมายความวาการโจมตีสมาชิกรายใดจะถือเปนการโจมตีรัฐสมาชิกทั้งหมด หวังวาขอตกลงนี้จะยับยั้งผูรุกรานตางชาติไมใหโจมตีสมาชิกขององคการ และปองกันสงครามระหวางสมาชิกดวยกันเอง"
 BBA_african_union_events.15.a: "สิ่งนี้จะปองกันความขัดแยง"
 BBA_african_union_events.15.b: "เราไมสนใจขอตกลงแบบนี้"
 BBA_african_union_events.16.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงปองกันรวม"
 BBA_african_union_events.16.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอตกลงปองกันรวมขององคการเอกภาพแอฟริกา ยังตองรอดูวานี่เปนสัญญาณของการเปลี่ยนจุดยืนระยะยาวตอองคการ หรือเปนเพียงขอเสนอที่มาผิดจังหวะเพราะการเมืองภายในประเทศ"
 BBA_african_union_events.16.a: "นาสงสัยยิ่งนัก"
 BBA_african_union_events.17.t: "[FROM.GetNameDefCap] เขารวมกติกาปองกันรวม"
 BBA_african_union_events.17.desc: "[FROM.GetNameDefCap]ไดตกลงเขารวมกติกาปองกันรวมขององคการเอกภาพแอฟริกา นับจากนี้เรามีพันธะที่จะตองปกปองกันและกันหากฝายใดฝายหนึ่งถูกโจมตี"
 BBA_african_union_events.17.a: "ขาวดีเยี่ยม"
 BBA_african_union_events.18.t: "ขอตกลงปองกันรวมขององคการเอกภาพแอฟริกาถูกบังคับใช"
 BBA_african_union_events.18.desc: "ประเทศผูลงนามในขอตกลงปองกันรวมขององคการเอกภาพแอฟริกาถูกโจมตี ในฐานะผูรวมลงนาม บัดนี้เรามีพันธะที่จะตองชวยเหลือพวกเขาทางทหาร หากเราปฏิเสธ เรายอมถูกขับออกจากขอตกลงอยางแนนอน และอาจทําลายความสัมพันธทางการทูตกับผูรวมลงนามรายอื่นๆ"
 BBA_african_union_events.18.a: "แนนอนวาเราจะปกปองพวกเขา"
 BBA_african_union_events.18.b: "บางทีการลงนามอาจเปนความผิดพลาด"
 BBA_african_union_events.19.t: "[FROM.GetNameDefCap] มาชวยปกปองเรา"
 BBA_african_union_events.19.desc: "[FROM.GetName]ไดตกลงปฏิบัติตามพันธะดานการปองกันในฐานะผูรวมลงนามในขอตกลงปองกันรวมขององคการเอกภาพแอฟริกา"
 BBA_african_union_events.19.a: "เมื่อรวมมือกัน เราจะไดรับชัยชนะ"
 BBA_african_union_events.20.t: "[FROM.GetNameDefCap] ละเมิดขอตกลงปองกันรวม"
 BBA_african_union_events.20.desc: "[FROM.GetName]ปฏิเสธที่จะปฏิบัติตามพันธะดานการปองกัน ทั้งที่เปนผูรวมลงนามในขอตกลงปองกันรวมขององคการเอกภาพแอฟริกา บัดนี้เรากําลังดําเนินการขับพวกเขาออกจากขอตกลง"
 BBA_african_union_events.20.a: "พวกเขาทรยศพวกเราทุกคน"
 BBA_african_union_events.21.t: "การเติบโตทางเศรษฐกิจของ[THIS.GetAdjective]"
 BBA_african_union_events.21.desc: "ผลผลิตทางเศรษฐกิจของเราไดรับผลกระทบเมื่อไมนานมานี้จากการปรับใชสกุลเงินใหมของ[ETH_GetCentralBankName] แตบัดนี้การผลิตและผลผลิตของเรากําลังเริ่มเพิ่มขึ้นอีกครั้ง และสูงกวาสถิติเดิมเสียอีก นักเศรษฐศาสตรระบุวาการเติบโตนี้มาจากการขจัดอุปสรรคทางการคาระหวาง[THIS.GetNameDef]กับสมาชิกอื่นๆ ที่ใชสกุลเงินรวมกัน ซึ่งเอื้อใหเศรษฐกิจของเราบูรณาการกันไดลึกซึ้งยิ่งขึ้น"
 BBA_african_union_events.21.a: "ในที่สุดก็คุมคา"
 BBA_african_union_events.22.t: "การขมขูใน[FROM.GetNameDef]ไมสําเร็จ"
 BBA_african_union_events.22.desc: "ผูนําของ[FROM.GetNameDef]ตอบโตความพยายามขมขูของเราดวยความขุนเคือง ดูเหมือนวาพวกเขาคงไมยอมรวมมือในอนาคตอันใกล"
 BBA_african_union_events.22.a: "พวกเขาฝนแบบนี้ไปตลอดไมไดหรอก"
 BBA_african_union_events.23.t: "การขมขูใน[FROM.GetNameDef]สําเร็จ"
 BBA_african_union_events.23.desc: "ผูนําของ[FROM.GetNameDef]ไดพยายามอยางเต็มที่ที่จะคลายความกังวลของเราเรื่องการปรับนโยบายใหสอดคลองกันภายในองคการเอกภาพแอฟริกา ถึงขั้นสัญญาวาจะปรึกษาเอกอัครราชทูตของเรากอนตัดสินใจเรื่องใดอยางหุนหันในอนาคต"
 BBA_african_union_events.23.a: "ยอดเยี่ยม"

####### ITALY ######

 BBA_italy_second_italo_ethiopian_war.1.t: "ขอเสนอสันติภาพจาก[FROM.GetAdjective]"
 BBA_italy_second_italo_ethiopian_war.1.desc: "เราไลตอน[FROM.GetName]จนแตกพาย! กองทัพอันเกรียงไกรของเราสรางความสูญเสียหนักหนวงจนชาว[FROM.GetAdjective]ตองคลานเขาขอสันติภาพ ประเทศของเราบอบชํ้าจากสงคราม และสันติภาพยอมเปนที่ตอนรับยิ่ง แตนี่อาจเปนโอกาสทองที่จะรุกตอเพื่อชัยชนะที่ยิ่งใหญกวา เพื่อใหแนใจวาจะไมมีชาติยุโรปโงเขลาใดกลาพยายามพิชิตเอธิโอเปยผูไมมีวันถูกพิชิตอีก!"
 BBA_italy_second_italo_ethiopian_war.1.a: "สันติภาพก็แลวกัน!"
 BBA_italy_second_italo_ethiopian_war.1.b: "ไมมีวัน รุกตอไป!"
 BBA_italy_second_italo_ethiopian_war.2.t: "[FROM.GetName]ยอมรับขอเสนอสันติภาพของ[ROOT.GetAdjective]"
 BBA_italy_second_italo_ethiopian_war.2.desc: "ชาวอะบิสซิเนียยอมรับขอเสนอสันติภาพอันเอื้อเฟอของเราแลว นี่หางไกลจากชัยชนะอันรุงโรจนที่เราวาดฝนไวตอนเริ่มสงคราม แตบางทีเราอาจปลอบใจไดวาสงครามจบลงแลว เราจะกาวขามความอัปยศครั้งนี้ไดเหมือนที่เคยทํามาหลายครั้ง และเราจะลุกขึ้นอีกครั้ง แข็งแกรงกวาที่เคย!"
 BBA_italy_second_italo_ethiopian_war.2.a: "ชางเปนเรื่องนาอับอาย..."
 BBA_italy_second_italo_ethiopian_war.3.t: "[FROM.GetName]ปฏิเสธขอเสนอสันติภาพของ[ROOT.GetAdjective]"
 BBA_italy_second_italo_ethiopian_war.3.desc: "ถาพวกมันตองการสงคราม เราก็จะจัดให! ชาวอะบิสซิเนียปฏิเสธขอเสนอสันติภาพอันเอื้อเฟอของเรา และตั้งใจจะสูตอ เราจะแสดงใหพวกโงอกตัญูนั่นเห็นวาความทรหดของชาวอิตาลีที่แทจริงเปนอยางไร! นี่เปนเพียงอุปสรรคชั่วคราว เราจะผลักพวกมันกลับขึ้นภูเขาแลวบดขยี้ใหสิ้นซาก"
 BBA_italy_second_italo_ethiopian_war.3.a: "เราจะพลิกกระแสสงคราม!"

#1st Missiolini localized at the beginning of the file along with Italo-Ethiopian War events
 BBA_italy_missiolinis.02_north.t: "แนวรบดานเหนือชะงักงัน"
 BBA_italy_missiolinis.02_north.desc: "ความสําเร็จที่คาดหวังจากการรุกโตตอบในอะบิสซิเนียตอนเหนือไมปรากฏใหเห็นเลย ดูเชสาบานวาทั้งโลกกําลังหัวเราะเยาะเขาและความลาชาของสงคราม เขาครุนคิดอยูวาจะเขาบัญชาการการรุกดานเหนือดวยตนเอง เพื่อใหแนใจวาทหารไดรับแรงจูงใจและการนําที่เหมาะสม"
 BBA_italy_missiolinis.02_north.a: "สักวันเราจะชนะ"
 BBA_italy_missiolinis.02_north.b: "เราตองเปลี่ยนผูนํา!"
 BBA_italy_missiolinis.02_north.c: "ชางเปนความลมเหลวอยางนาตกตะลึง!"
 BBA_italy_missiolinis.04_south.t: "แนวรบดานใตชะงักงัน"
 BBA_italy_missiolinis.04_south.desc: "การรุกโตตอบดานใตในอะบิสซิเนียไมบรรลุเปาหมายที่ดูเชตองการ ทําใหเขาบนพึมพําอยูหลายชั่วโมงวาถูกรายลอมดวยความไรความสามารถและความโงเขลา เขาดูมั่นใจวากองบัญชาการทหารสูงสุดกําลังทํางานตอตานเขา และบรรดานายพลตองการเห็นสงครามทั้งหมดลมเหลว"
 BBA_italy_missiolinis.04_south.a: "สักวันเราจะชนะ"
 BBA_italy_missiolinis.04_south.b: "เราตองเปลี่ยนผูนํา!"
 BBA_italy_missiolinis.04_south.c: "ชางเปนความลมเหลวอยางนาตกตะลึง!"
 BBA_italy_missiolinis.03_north.t: "ความสําเร็จในเอธิโอเปยตอนเหนือ"
 BBA_italy_missiolinis.03_north.desc: "มุสโสลินีมีแตคําชื่นชมและยกยองกองทัพในอะบิสซิเนียตอนเหนือ ที่สามารถผลักดันศัตรูผูดุดันใหถอยรนไปได แนนอนวาเขาไมเคยสงสัยในความสามารถของทหารเราเลย ตราบใดที่พวกเขาไดรับแรงจูงใจที่ถูกตองจากดูเชของพวกเขาและเครื่องมือที่จะเอาชนะ"
 BBA_italy_missiolinis.03_north.a: "ตอนนี้เราไลตอนพวกมันไดแลว!"
 BBA_italy_missiolinis.05_south.t: "ความสําเร็จในเอธิโอเปยตอนใต"
 BBA_italy_missiolinis.05_south.desc: "มุสโสลินีปลาบปลื้มกับชัยชนะลาสุดในอะบิสซิเนียตอนใต เขายกยองความกลาหาญของทหารอิตาลีและความทุมเทที่จะยุติความขัดแยงนี้ เขาไมเคยมีขอกังขาใดๆ และไววางใจเต็มที่วากองทัพของเราจะเอาชนะศัตรูในสนามรบได เมื่อไดรับการสนับสนุนที่เหมาะสมจากดูเชของพวกเขา"
 BBA_italy_missiolinis.05_south.a: "เราผลักดันศัตรูถอยรนไปแลว!"
 BBA_italy_missiolinis.11.t: "ยุติสงคราม"
 BBA_italy_missiolinis.11.desc: "บัดนี้ดูเชตองการยุติสงครามในอะบิสซิเนียโดยเร็ว เพื่อที่อิตาลีจะไดหันไปแสวงหาเกียรติยศอื่นตอไป การพิชิตดินแดนโบราณแหงอักซุมจะตอกยํ้าสถานะของอิตาลีในฐานะหนึ่งในจักรวรรดิใหญของโลก\n\nที่มั่นของอะบิสซิเนียที่เหลืออยูตองถูกจัดการใหสิ้น และดินแดนอะบิสซิเนียทั้งหมดตองตกอยูในมือของอิตาลี"
 BBA_italy_missiolinis.11.a: "ศัตรูจะตองพายแพ!"
 BBA_italy_missiolinis.12.t: "สงครามยังคงดําเนินตอไป"
 BBA_italy_missiolinis.12.desc: "การที่อะบิสซิเนียยังคงเปนอิสระและตอตานการยึดครองทําใหดูเชเดือดดาลอยูหลายชั่วโมง เขาเรียกมันวาความอับอาย ไมใชแคสําหรับตัวเขาเอง แตสําหรับอิตาลีและประชาชนดวย เขาบนกับทุกคนรอบตัววาหากเขาไดควบคุมสงครามชวงสุดทายดวยตนเอง ปานนี้ทุกอยางคงจบไปแลว"
 BBA_italy_missiolinis.12.a: "ชาวอะบิสซิเนียตอสูอยางดุเดือด"
 BBA_italy_missiolinis.13.t: "การพิชิตเอธิโอเปย"
 BBA_italy_missiolinis.13.desc: "มุสโสลินีดีใจจนเนื้อเตน และโออวดชัยชนะครั้งลาสุดของเราไปทั่วกับทุกคน ไมวาจะอยากฟงหรือไม เขาไมเคยสงสัยเลยวาอิตาลีจะไดรับชัยชนะในอะบิสซิเนีย แมจะเจออุปสรรคตางๆ มากมาย ในที่สุดเราก็แกแคนความลมเหลวในสงครามอิตาลี-อะบิสซิเนียครั้งแรกไดแลว!\n\nดูเชยกยองการพิชิตครั้งนี้วาเปนชัยชนะของระบอบฟาสซิสตและรัฐบาลของเขา และกลาววาประชาชนอิตาลีแข็งแกรงและเปนหนึ่งเดียวกันยิ่งกวาที่เคย"
 BBA_italy_missiolinis.13.a: "มีเพียงเลือดเทานั้นที่ขับเคลื่อนวงลอประวัติศาสตร"
 BBA_italy_missiolinis.21.t: "สรางความสงบในเอธิโอเปย"
 BBA_italy_missiolinis.21.desc: "ดูเชประกาศตอสาธารณะวาชาวอะบิสซิเนียถูกบดขยี้และแตกพาย เจตจํานงของพวกเขาแหลกสลายหลังความพายแพ แตในที่ลับ เขากลับสาปแชงชาวอะบิสซิเนียที่ทรหดและไมยอมออนขอตอการปกครองของอิตาลี ดูเชสั่งใหปราบปรามฝายตอตานในทองถิ่นดวยกําลังอยางโหดเหี้ยม และออกกฎหมายเพื่อควบคุมประชากร เขาตองการใหทั้งประเทศสงบราบคาบและถูกผนวกเขาในออมอกของอิตาลีโดยเร็วที่สุด"
 BBA_italy_missiolinis.21.a: "เราจะนําสันติภาพและเสถียรภาพมา"
 BBA_italy_missiolinis.22.t: "เอธิโอเปยยังคงตอตาน"
 BBA_italy_missiolinis.22.desc: "อะบิสซิเนียยังหางไกลจากความสงบนัก และการตอตานการยึดครองของอิตาลียังคงแข็งขัน ดูเชไมมีคําพูดดีๆ ใหทั้งชาวอะบิสซิเนียและความพยายามปราบปรามฝายตอตาน และเรียกปฏิบัติการนี้วาความอับอายของชาติ เขาบนวาชาวอาณานิคมอิตาลีดูหยาบกระดางและกิริยาไมงาม ซึ่งไมชวยใหประชาชนทองถิ่นเกิดความเคารพเลย"
 BBA_italy_missiolinis.22.a: "ชาวอะบิสซิเนียแกรงกวาที่คาดไว"
 BBA_italy_missiolinis.23.t: "การสรางความสงบในเอธิโอเปย"
 BBA_italy_missiolinis.23.desc: "ในที่สุดเราก็ปราบการตอตานในอะบิสซิเนียไดสําเร็จ จากยอดเขาสูงจนถึงที่ราบทะเลทราย ประชาชนกําลังหาที่ทางของตนภายในออมอกของอิตาลี มุสโสลินีประกาศดวยความยินดีวาในที่สุดเขาก็หันไปสนใจเรื่องอื่นไดเสียที เพื่อใหอิตาลีเจริญรุงเรืองและทวงคืนสิ่งที่เปนของตนโดยชอบธรรม"
 BBA_italy_missiolinis.23.a: "อิตาลีเปนใหญเหนือใคร"
 BBA_italy_missiolinis.31.t: "โครงการพัฒนาอุตสาหกรรม"
 BBA_italy_missiolinis.31.desc: "เพื่อใหอิตาลีรุงเรืองอยางแทจริง ดูเชมีแผนขยายขีดความสามารถในการผลิตของเรา การจะบรรลุวิสัยทัศนของชาติที่มั่งคั่งนี้ได เราตองมีโรงงานมากขึ้นเพื่อรองรับการเติบโตของจักรวรรดิที่คึกคักของเรา"
 BBA_italy_missiolinis.31.a: "ขยายอุตสาหกรรม"
 BBA_italy_missiolinis.32.t: "การพัฒนาอุตสาหกรรมลาชา"
 BBA_italy_missiolinis.32.desc: "ดูเชเห็นวาความลาชาในการสรางขีดความสามารถทางอุตสาหกรรมของชาติเปนเรื่องนากังวล เขาครํ่าครวญถึงขอจํากัดที่ถูกยัดเยียดใหเขา ซึ่งไมใชความผิดของเขาเลย และทําใหวิสัยทัศนของอิตาลีที่รุงเรืองยากจะเปนจริงยิ่งขึ้น"
 BBA_italy_missiolinis.32.a: "เราตองพยายามใหมากกวานี้"
 BBA_italy_missiolinis.33.t: "โครงการพัฒนาอุตสาหกรรมประสบความสําเร็จ"
 BBA_italy_missiolinis.33.desc: "มุสโสลินียกยองโรงงานที่สรางขึ้นใหมวาเปนกาวแรกของการปรับปรุงอุตสาหกรรมอิตาลีใหทันสมัย ดูเชพอใจอยางยิ่งที่สิ่งนี้เพิ่มขีดความสามารถในการผลิตของประเทศ และจะชวยใหเขาผลักดันวิสัยทัศนของอิตาลีที่ยิ่งใหญตอไปได"
 BBA_italy_missiolinis.33.a: "กาวแรกสูความยิ่งใหญ"
 BBA_italy_missiolinis.41.t: "เสริมสรางกองทัพ"
 BBA_italy_missiolinis.41.desc: "เชนเดียวกับจักรวรรดิโรมันในอดีต จักรวรรดิที่กําลังรุงเรืองของเราแผขยายไปไกลและกวาง และตองการกองทัพที่แข็งแกรงเพื่อปกปองจากฝูงชนปาเถื่อนที่อยูเลยพรมแดนออกไป ดูเชมั่นใจวาหากอิตาลีจะแขงขันกับมหาอํานาจอื่นๆ ได เราตองมีกําลังหนุนหลังคําพูดของเรา ไมเชนนั้นจะไมมีใครเห็นเราเปนเรื่องจริงจัง!"
 BBA_italy_missiolinis.41.a: "เพื่ออิตาลี!"
 BBA_italy_missiolinis.42.t: "การขยายกองทัพลมเหลว"
 BBA_italy_missiolinis.42.desc: "การขาดแคลนทหารอิตาลีเปนความกังวลที่วนกลับมาเสมอของดูเช ผูมองวาพรมแดนอันยาวเหยียดที่ติดกับคูแขงเปนจุดออน ดูเชรูสึกถูกขัดขวางหลังความพยายามเพิ่มจํานวนทหารที่ลมเหลวเมื่อไมนานนี้ และเริ่มตั้งคําถามถึงความทุมเทของประชาชนตออุดมการณฟนฟูความยิ่งใหญของอิตาลี"
 BBA_italy_missiolinis.42.a: "อิตาลีจะไดรับการปกปอง ไมทางใดก็ทางหนึ่ง"
 BBA_italy_missiolinis.43.t: "กองทัพอิตาลีที่ขยายใหญขึ้น"
 BBA_italy_missiolinis.43.desc: "มุสโสลินีไดตรวจทหารที่เพิ่งประจําการบางสวนดวยตนเอง ทหารเหลานี้จะปกปองพรมแดนของเรา และขยายพรมแดนออกไปหากดูเชเห็นสมควร เขาพอใจอยางยิ่งกับจํานวนกองพลที่เพิ่มขึ้น และคุยโววาดวยวิสัยทัศนของเขาเพียงผูเดียว อิตาลีจึงมีกองทัพที่นานับถือ ซึ่งแมแตศัตรูก็ปฏิเสธความแข็งแกรงไมได"
 BBA_italy_missiolinis.43.a: "อิตาลีมั่นคงปลอดภัย"
 BBA_italy_missiolinis.51.t: "ขยายกองยานบรรทุกเสบียง"
 BBA_italy_missiolinis.51.desc: "ความขัดแยงครั้งหลังๆ ไดเผยใหเห็นจุดบกพรองบางประการในการสงกําลังบํารุงใหกองทัพ กองบัญชาการทหารสูงสุดของอิตาลีโนมนาวใหดูเชสั่งซื้อกองรถบรรทุกเสบียงชุดใหม เดิมทีเขาตองการรถบรรทุกอิตาลีใหมเอี่ยม 5000 คัน แตถูกเกลี้ยกลอมใหยอมรับจํานวนที่นอยลง หลังไดรับการยืนยันวาเพียงพอแลว"
 BBA_italy_missiolinis.51.a: "อยางนอยก็ไมใช 5000 คัน"
 BBA_italy_missiolinis.52.t: "รถบรรทุกสนับสนุนนอยเกินไป"
 BBA_italy_missiolinis.52.desc: "การสงมอบรถบรรทุกใหมใหกองทัพที่ลมเหลวทําใหดูเชวิจารณภาคอุตสาหกรรมที่รับผิดชอบงานนี้ และบนถึงการขาดวิสัยทัศน เขาเชื่อมั่นวาไมมีใครนอกจากเขาที่มองเห็นศักยภาพอันยิ่งใหญของอิตาลีและประชาชนอยางแทจริง"
 BBA_italy_missiolinis.52.a: "กองทัพของเราตองอยูใหไดโดยไมมีมัน"
 BBA_italy_missiolinis.53.t: "กองรถบรรทุกสนับสนุนไดรับการเสริมกําลัง"
 BBA_italy_missiolinis.53.desc: "มุสโสลินีแสดงความยินดีดวยตนเองกับโรงงานที่ผลิตรถบรรทุกใหมใหกองทัพ โดยเรียกคนงานวาเปนกระดูกสันหลังของอิตาลี บัดนี้เขาคาดหวังกองกําลังทหารที่คลองตัวยิ่งขึ้น ซึ่งเคลื่อนที่ไดรวดเร็วผานพื้นที่กวางใหญโดยไมถูกจํากัดดวยการสงกําลังบํารุงที่ลาชา"
 BBA_italy_missiolinis.53.a: "แนนอนวาสิ่งนี้จะทําใหกองทัพของเราไรเทียมทาน"
 BBA_italy_missiolinis.61.t: "โครงการสํารองเชื้อเพลิง"
 BBA_italy_missiolinis.61.desc: "กองทัพสมัยใหมไมไดเดินทัพดวยทองเพียงอยางเดียว แตยังตองอาศัยเชื้อเพลิงดวย และหากไมมีเชื้อเพลิง เครื่องจักรสงครามทั้งหมดก็จะหยุดชะงัก ในที่สุดกองบัญชาการทหารสูงสุดของอิตาลีก็โนมนาวดูเชไดวากองทัพสมัยใหมจะตองหยุดนิ่งอยูกับที่หากขาดเชื้อเพลิง ทุกเหลาทัพตองการมัน และเราตองจัดหานํ้ามันไดในปริมาณมากหากจะประสบความสําเร็จในสนามรบ"
 BBA_italy_missiolinis.61.a: "เราตองกักตุนเชื้อเพลิง"
 BBA_italy_missiolinis.62.t: "เชื้อเพลิงสํารองไมเพียงพอ"
 BBA_italy_missiolinis.62.desc: "การขาดแคลนเชื้อเพลิงสํารองเปนความกังวลไมรูจบของกองบัญชาการทหารสูงสุด ซึ่งหวั่นวาเครื่องบินจะตองจอดนิ่งอยูบนพื้น เรือประจัญบานตองทอดสมอ และกองทัพตองหยุดอยูกับที่ ดูเชมั่นใจวาอิตาลีจะฝาฟนไปไดเหมือนเคย แตก็เดือดดาลที่คําสั่งอันชัดเจนของเขายังไมไดรับการปฏิบัติ"
 BBA_italy_missiolinis.62.a: "เราตองหาทางจัดการ"
 BBA_italy_missiolinis.63.t: "การขยายเชื้อเพลิงสํารองประสบความสําเร็จ"
 BBA_italy_missiolinis.63.desc: "มุสโสลินีมั่นใจเต็มที่วาบัดนี้กองทัพอิตาลีพรอมทําสงครามเต็มรูปแบบโดยไมตองขาดเชื้อเพลิงในทันที กองบัญชาการทหารสูงสุดอาจไมมั่นใจขนาดนั้น แตก็โลงใจกับปริมาณสํารองที่สะสมไดจนถึงตอนนี้"
 BBA_italy_missiolinis.63.a: "เชื้อเพลิงสํารองของเราจะตองมีประโยชนแน"
 BBA_italy_missiolinis.71.t: "ขยายกองทัพอากาศ"
 BBA_italy_missiolinis.71.desc: "นับตั้งแตดูเชกอตั้งเรเจีย แอโรเนาติกาขึ้นเปนครั้งแรก มันไดกลายเปนสัญลักษณแหงความภาคภูมิใจของชาติและเปนหนึ่งในกองทัพอากาศที่ยิ่งใหญที่สุดในโลก ปญหาเดียวคือมันเล็กเกินไป และบัดนี้ดูเชถูกโนมนาวใหผลิตเครื่องบินเพิ่มเติมเพื่อเสริมกําลังแอโรเนาติกา"
 BBA_italy_missiolinis.71.a: "แอโรเนาติกาคือความภาคภูมิใจของเรา"
 BBA_italy_missiolinis.72.t: "กองทัพอากาศที่ออนแอ"
 BBA_italy_missiolinis.72.desc: "การผลิตเครื่องบินใหมถูกวางแผนใหเปนผลงานโฆษณาชวนเชื่อชิ้นใหญของดูเช ซึ่งบัดนี้ตองลดเปาหมายเดิมลง การที่ไมมีเครื่องบินใหมจํานวนมากทําใหดูเชโกรธจัด และกําลังหาคนมารับผิดชอบความลมเหลวครั้งนี้"
 BBA_italy_missiolinis.72.a: "นาเสียดาย"
 BBA_italy_missiolinis.73.t: "เสริมกําลังกองทัพอากาศไดสําเร็จ"
 BBA_italy_missiolinis.73.desc: "มุสโสลินีใหความสนใจเปนการสวนตัวในการเสริมกําลังกองทัพอากาศ และใชการผลิตเครื่องบินใหมเปนโอกาสอวดศักยภาพทางอุตสาหกรรมของอิตาลี โดยมีเรเจีย แอโรเนาติกาเปนศูนยกลาง สื่อโฆษณาชวนเชื่อหลายชิ้นไดถูกสรางขึ้นเพื่อเฉลิมฉลองการบินและวิศวกรรมของอิตาลี"
 BBA_italy_missiolinis.73.a: "แอโรเนาติกาจะไดรับชัยชนะ!"
 BBA_italy_missiolinis.81.t: "นวัตกรรมทางเทคโนโลยี"
 BBA_italy_missiolinis.81.desc: "ดูเชตัดสินใจแสดงใหเห็นถึงความเหนือกวาของระบอบฟาสซิสต และความสามารถในการทุมทรัพยากรและความพยายามไดอยางมีประสิทธิภาพกวา เขาตั้งใจจะแสดงใหชาวอิตาลีและทั่วโลกเห็นวาลัทธิฟาสซิสตสามารถกาวกระโดดทางเทคโนโลยีไดรวดเร็วเพียงใด เขายังหวังวาสิ่งนี้จะปลุกระดมและรวมชาวอิตาลีที่แตกแยกมาตลอดประวัติศาสตรใหเปนหนึ่งเดียวภายใตลัทธิฟาสซิสต"
 BBA_italy_missiolinis.81.a: "ทั่วโลกจะไดเห็น"
 BBA_italy_missiolinis.82.t: "ความกาวหนาทางเทคโนโลยีที่ไมนาพอใจ"
 BBA_italy_missiolinis.82.desc: "ความพยายามแสดงจุดแข็งของระบอบฟาสซิสตกลับยอนมาทํารายดูเช ผูซึ่งสาปแชงทุกคนที่อยูในระยะไดยิน แทนที่ผูคนจะรวมตัวกันสนับสนุนลัทธิฟาสซิสต พวกเขากลับยิ่งสงสัยและซุบซิบกันวามุสโสลินีชางโงเขลา หรืออยางนอยดูเชก็เชื่อเชนนั้น"
 BBA_italy_missiolinis.82.a: "เปนเพียงอุปสรรคเล็กนอย"
 BBA_italy_missiolinis.83.t: "นวัตกรรมทางเทคโนโลยีอันยิ่งใหญ"
 BBA_italy_missiolinis.83.desc: "การกาวกระโดดทางเทคโนโลยีที่ระบอบฟาสซิสตปาวประกาศไวไดผลแลว และมุสโสลินีไมรีรอที่จะอวดนวัตกรรมที่เกิดขึ้นภายใตการนําของเขา สารนี้เปนเรื่องของลัทธิฟาสซิสตพอๆ กับเรื่องของมุสโสลินีและวิสัยทัศนที่เขามีตออิตาลี สวนจะปลุกระดมและรวมชาวอิตาลีไดอยางที่ดูเชหวังไวหรือไมนั้นยังตองรอดู"
 BBA_italy_missiolinis.83.a: "เพื่อดูเชและมาตุภูมิ!"
 BBA_italy_missiolinis.91.t: "การขยายหนวยขาวกรอง"
 BBA_italy_missiolinis.91.desc: "ดูเชถูกโนมนาวใหทุมทรัพยากรเพิ่มเติมใหหนวยขาวกรองของเรา พรอมคําสัญญาวาจะกลายเปนหนึ่งในหนวยที่ดีที่สุดในโลก สงผลใหเขาคุยโวตอสาธารณะวาสายลับของเราไดแทรกซึมเขาไปในทุกแงมุมของสังคมอิตาลี เพื่อลากพวกคอมมิวนิสต อาชญากร และองคประกอบอันตรายอื่นๆ ออกมาสูที่แจงและนําตัวมาลงโทษ ทําใหอิตาลีปลอดภัยยิ่งขึ้น"
 BBA_italy_missiolinis.91.a: "ขยายหนวยขาวกรอง"
 BBA_italy_missiolinis.92.t: "หนวยขาวกรองลมเหลวอยางยับเยิน"
 BBA_italy_missiolinis.92.desc: "แทนที่จะเสริมความแข็งแกรงของหนวยขาวกรอง เอกสารลับหลายฉบับกลับรั่วไหลออกไป สรางภาพลักษณที่ยํ่าแยใหสายลับของเรา แมเอกสารจะไมมีความลับที่สําคัญมากนัก แตก็เปนความอับอายของดูเชที่เพิ่งคุยโวถึงกลไกขาวกรองของเราไปไมนาน เรื่องนี้ไมเพียงทําใหดูเชโกรธ แตยังทําใหประชาชนอิตาลีและศัตรูของเราสงสัยในขีดความสามารถของเราดวย"
 BBA_italy_missiolinis.92.a: "ชางนาอับอายจริงๆ"
 BBA_italy_missiolinis.93.t: "ผลงานอันยอดเยี่ยมของหนวยขาวกรอง"
 BBA_italy_missiolinis.93.desc: "ความสามารถของหนวยขาวกรองของเราไดรับการพิสูจนอยางไมตองสงสัย หลังจับกุมพลเมืองผูเห็นตางหลายคนที่วางแผนบอนทําลายรัฐบาลฟาสซิสตของอิตาลีโดยไดรับความชวยเหลือจากตางชาติ มุสโสลินีใชความสําเร็จนี้แสดงใหเห็นวาดวยการนําของเขาเทานั้น อิตาลีจึงจะชนะและฝาฟนความยากลําบากใดๆ ในอนาคตได"
 BBA_italy_missiolinis.93.a: "ชางเปนผลงานที่นายกยองจริงๆ"
 BBA_italy_missiolinis.101.t: "ยึดครองแอลเบเนีย"
 BBA_italy_missiolinis.101.desc: "ความสัมพันธอันแนนแฟนระหวางอิตาลีกับแอลเบเนียยอนกลับไปนับพันปถึงสมัยจักรวรรดิโรมัน สองชาติของเรามีความเชื่อมโยงทางประวัติศาสตรอยางลึกซึ้ง ซึ่งดูเชตั้งใจจะทําใหแนนแฟนยิ่งขึ้น เขาตองการผนวกแอลเบเนียเขากับอิตาลี และสั่งใหยึดครองประเทศนี้โดยเร็ว เพื่อใหเราควบคุมทางเขาทะเลเอเดรียติกไดอยางสมบูรณ เขายืนยันวาสิ่งนี้จะนําเกียรติยศและศักดิ์ศรีมาสูอิตาลี ซึ่งถูกชาติอื่นๆ มองวาเปนมหาอํานาจชั้นรองมานานเกินไปแลว"
 BBA_italy_missiolinis.101.a: "ขอเกียรติยศจงมีแดอิตาลี!"
 BBA_italy_missiolinis.102.t: "ความลมเหลวในแอลเบเนีย"
 BBA_italy_missiolinis.102.desc: "การที่ทหารของเราแทบรุกคืบในแอลเบเนียไมไดเลยทําใหดูเชงุนงง และเรียกมันวาความอับอายของชาติ ในที่ลับเขาพึมพําอยางเดือดดาลวานี่ควรเปนชวงเวลาอันรุงโรจนของอิตาลีและของตัวเขาเอง และควรเปนการลบลางการถอนตัวอยางอัปยศของเราจากที่นั่นเมื่อเกือบ 20 ปกอน แตเขากลับบอกวาเราถูกทรยศดวยความไรความสามารถและความขลาดเขลา"
 BBA_italy_missiolinis.102.a: "นาอัปยศ"
 BBA_italy_missiolinis.103.t: "การยึดครองแอลเบเนีย"
 BBA_italy_missiolinis.103.desc: "มุสโสลินีประกาศอยางยินดีตอฝูงชนที่กระตือรือรนวาทหารของเราไดรับชัยชนะในแอลเบเนีย เขากลาวตอวาบัดนี้ทั้งประเทศอยูในกํามือของเรา และสิ่งนี้จะนําอิตาลีไปสูความยิ่งใหญและเกียรติยศยิ่งขึ้น เขาประกาศวาวันเวลาของจักรวรรดิเกากําลังจะหมดลง และวันเวลาของอิตาลียังมาไมถึง"
 BBA_italy_missiolinis.103.a: "เพื่อเกียรติยศที่กําลังจะมาถึง!"
 BBA_italy_missiolinis.111.t: "พิชิตดัลเมเชีย"
 BBA_italy_missiolinis.111.desc: "แมเราจะเปนหนึ่งในฝายชนะในมหาสงคราม และไดรับสัญญาวาจะไดดัลเมเชียตามสนธิสัญญาลอนดอน แตเรากลับถูกสิ่งที่เรียกวาพันธมิตรทรยศ ดูเชยืนยันวาเราไมเคยไดรับสิ่งที่สัญญาไว ดังนั้นบัดนี้เราตองยึดมาดวยกําลัง เขายังกลาวอีกวาเปนชะตากรรมของอิตาลีที่จะตองเอาสิ่งที่เปนของเราโดยชอบธรรมกลับคืนมา ไมวามหาอํานาจเกาจะวาอยางไร"
 BBA_italy_missiolinis.111.a: "ดัลเมเชียเปนของเราโดยชอบธรรม"
 BBA_italy_missiolinis.112.t: "การบุกดัลเมเชียที่ชะงักงัน"
 BBA_italy_missiolinis.112.desc: "สิ่งที่ควรเปนการบุกชายฝงเอเดรียติกอยางรวดเร็วกลับกลายเปนการรบที่ยืดเยื้อ ทหารของเราติดหลมอยูในดัลเมเชีย และไมสามารถมอบการพิชิตอันยิ่งใหญที่สัญญาไวกับประชาชนอิตาลีได มีหลายครั้งที่พบดูเชอยูในสภาพแทบนิ่งคาง พึมพําวาดัลเมเชียเปนของเราโดยชอบธรรม นี่ไมใชการแสดงแสนยานุภาพที่ดูเชหวังไวเลย"
 BBA_italy_missiolinis.112.a: "สิ่งนี้ยิ่งตอกยํ้าความอยุติธรรมที่เราไดรับ"
 BBA_italy_missiolinis.113.t: "การพิชิตดัลเมเชีย"
 BBA_italy_missiolinis.113.desc: "ในที่สุดความอยุติธรรมอันใหญหลวงก็ไดรับการแกไข! ชายฝงดัลเมเชียเปนของเราแลว มุสโสลินีปลื้มปติ เรียกชัยชนะครั้งนี้วาเปนชวงเวลาอันยิ่งใหญของอิตาลีและประชาชน เขาประกาศวาความคับแคนอันยิ่งใหญไดรับการชดใชแลวในที่สุด ผูคนพากันออกมาเฉลิมฉลองบนทองถนนในวาระสําคัญนี้"
 BBA_italy_missiolinis.113.a: "ความอยุติธรรมถูกลบลาง"
 BBA_italy_missiolinis.121.t: "ปราบกรีซ"
 BBA_italy_missiolinis.121.desc: "ในสุนทรพจนเมื่อไมนานนี้ ดูเชไดวางวิสัยทัศนของอิตาลีที่ยิ่งใหญ ซึ่งหนึ่งในประเด็นคือเราตองทําลายพันธนาการที่มหาอํานาจอื่นๆ กําหนดไวกับเรา เขาประกาศวากรีซเปนจุดสําคัญยิ่งตออิตาลีและการขยายตัวของอิตาลี เปนอุปสรรคที่ตองกาวขามเพื่อใหเราขยายตัวออกไปพนพันธนาการที่รัดตรึงเราไว"
 BBA_italy_missiolinis.121.a: "“ทําลายพันธนาการ"
 BBA_italy_missiolinis.122.t: "ความอับอายในกรีซ"
 BBA_italy_missiolinis.122.desc: "ภูมิประเทศที่เปนภูเขาของกรีซกลายเปนอุปสรรคที่ทหารของเราไมอาจกาวขามได พวกเขาถูกขัดขวางและถูกตรึงไวกับที่ ดูเชยังเชื่อมั่นวาชัยชนะจะเปนของเรา และตองเปนของเรา และปฏิเสธที่จะยอมรับความถดถอยใดๆ เขายืนกรานอยางแข็งขันวาความเหนือกวาของเราจะชนะในที่สุด"
 BBA_italy_missiolinis.122.a: "การตอตานนั้นดุเดือดยิ่งนัก"
 BBA_italy_missiolinis.123.t: "การพิชิตกรีซ"
 BBA_italy_missiolinis.123.desc: "เชนเดียวกับกองทหารโรมันกอนหนาเรา บัดนี้เราไดพิชิตกองทหารศัตรูและยึดครองกรีซทั้งหมดไดแลว มุสโสลินีกลาวสุนทรพจนอันเราใจภายใตเงาของวิหารพารเธนอน ประกาศวาชาวอิตาลีและชาวกรีกเปนพี่นองกันที่มีประวัติศาสตรรวมกันมาหลายศตวรรษ และบัดนี้พวกเขามีอิสระที่จะกําหนดเสนทางของตนเองในประวัติศาสตร"
 BBA_italy_missiolinis.123.a: "“เพื่อเกียรติยศในอดีตและอนาคต"
 BBA_italy_missiolinis.131.t: "ปลดปลอยตีชีโน"
 BBA_italy_missiolinis.131.desc: "นับตั้งแตฮันนิบาลขามเทือกเขาแอลปพรอมฝูงชาง ภูเขาเหลานี้ก็เปนทางดวนใหพวกปาเถื่อนบุกตรงเขาสูใจกลางของอิตาลี ดูเชตองการยึดชองเขาทางเหนือใหมั่นคงมานานแลว และตองการใชโอกาสนี้ผนวกผูพูดภาษาอิตาลีในตีชีโนกลับคืนสูมาตุภูมิ รวมชาวอิตาลีเปนหนึ่งเดียวไมวาพวกเขาจะอยูที่ใด"
 BBA_italy_missiolinis.131.a: "ชวยเหลือชาวอิตาลีในตีชีโน!"
 BBA_italy_missiolinis.132.t: "การปลดปลอยตีชีโนลมเหลว"
 BBA_italy_missiolinis.132.desc: "ดูเชรูดีวาชาวสวิสจะตอสูอยางดุเดือดเพื่อตีชีโน แตความลาชานี้ทําใหเขาเซไปทั้งตัว ไมนานหลังการรุกของเราชะงักงัน ดูเชก็เริ่มเขาไปยุมยามกับแผนของนายพลและตั้งคําถามถึงความสามารถของพวกเขา ซึ่งประชาชนอิตาลีก็ไมไดมองขามไป"
 BBA_italy_missiolinis.132.a: "ความลาชานี้นากังวล"
 BBA_italy_missiolinis.133.t: "การปลดปลอยตีชีโนประสบความสําเร็จ"
 BBA_italy_missiolinis.133.desc: "มุสโสลินีเดินทางไปยังตีชีโนดวยตนเองเพื่อตอนรับผูพูดภาษาอิตาลีที่นั่นเขาสูประชาคมอิตาลีที่กวางใหญขึ้น และใหคํามั่นวาอนาคตอันสดใสรอพวกเขาและอิตาลีทั้งมวลอยู เขายังกลาววาพรมแดนทางเหนือมั่นคงแลว และอิตาลีสามารถตานทานพวกปาเถื่อนที่พยายามขามเทือกเขาแอลปได"
 BBA_italy_missiolinis.133.a: "ชัยชนะอันกึกกอง"
 BBA_italy_missiolinis.201.t: "เสริมความแข็งแกรงคณะรัฐมนตรี"
 BBA_italy_missiolinis.201.desc: "การหาคนที่ใชมาไวในตําแหนงที่ใชเปนเรื่องยากเสมอ โดยเฉพาะเมื่อขาดแคลนคนที่ใช ดูเชเชื่อมั่นวาเพื่อใหอิตาลีและลัทธิฟาสซิสตประสบความสําเร็จ เขาตองหาผูมีความสามารถและคุณสมบัติเหมาะสมมาเติมเต็มคณะรัฐมนตรี และจะแตงตั้งคนใหออกคนหาคนเหลานี้ไปทั่วทุกสารทิศ"
 BBA_italy_missiolinis.201.a: "จะไมมีที่ใดถูกมองขาม"
 BBA_italy_missiolinis.202.t: "คณะรัฐมนตรีที่ทํางานลมเหลว"
 BBA_italy_missiolinis.202.desc: "ความลมเหลวในการขยายคณะรัฐมนตรีใหเพียงพอทําใหดูเชโกรธจัด และเรียกคณะรัฐมนตรีวาทํางานลมเหลว เขากลาวหาทุกคนที่เขาใกลวาโงเขลาและชั่วรายที่ทํางานตอตานเขาและความยิ่งใหญที่เขาพยายามนํามาสูอิตาลี"
 BBA_italy_missiolinis.202.a: "ยากเหลือเกินที่ตองอยูทามกลางคนไรความสามารถ"
 BBA_italy_missiolinis.203.t: "คณะรัฐมนตรีที่ประสบความสําเร็จ"
 BBA_italy_missiolinis.203.desc: "ในสุนทรพจนตอคณะรัฐมนตรีเมื่อไมนานนี้ มุสโสลินีกลาววามีเพียงผูมีสติปญญาเปนเลิศที่สุดของอิตาลีเทานั้นที่เหมาะจะรับใชที่นี่ จากนั้นเขาก็คุยโววาเขาคนหาคนที่ใชมาเสริมคณะรัฐมนตรีอยางไมละเวนที่ใดเลย และความมุงมั่นของเขาจะเปนประโยชนตออิตาลีในระยะยาว"
 BBA_italy_missiolinis.203.a: "มีแตคนฉลาดและเกงที่สุดเทานั้น"
 BBA_italy_missiolinis.211.t: "เสริมความแข็งแกรงกองบัญชาการทหารสูงสุด"
 BBA_italy_missiolinis.211.desc: "ความดอยดานความสามารถและประสบการณที่รับรูกันในกองบัญชาการทหารสูงสุดเปนสิ่งที่ดูเชชอบชี้ใหเห็นมาตลอดนับตั้งแตสงครามอิตาลี-อะบิสซิเนีย เขาตองการแกไขเรื่องนี้ดวยการเลื่อนตําแหนงผูสมควรขึ้นสูตําแหนงสูงสุดในกองทัพ เพื่อเสริมความแข็งแกรงดานการวางแผนทางยุทธศาสตรและยุทธวิธีในความขัดแยงที่จะมาถึง"
 BBA_italy_missiolinis.211.a: "ตองเปลี่ยนแปลงเรื่องนี้"
 BBA_italy_missiolinis.212.t: "การขาดความสามารถทางทหาร"
 BBA_italy_missiolinis.212.desc: "ดวยความกังวลวาความสนใจของเขาจะกระจายบางเกินไปหากตองบัญชาการปฏิบัติการทางทหารดวยตนเอง ดูเชจึงไมลังเลที่จะบนถึงการขาดแคลนบุคลากรที่มีความสามารถในกองทัพ เขามั่นใจวาปญหานี้จะนําไปสูความลมสลายของอิตาลีหากสถานการณเลวรายลง"
 BBA_italy_missiolinis.212.a: "สมัยนี้หาคนเกงยากเหลือเกิน"
 BBA_italy_missiolinis.213.t: "กองบัญชาการทหารสูงสุดที่มีประสิทธิภาพ"
 BBA_italy_missiolinis.213.desc: "ดูเชกลาวในสุนทรพจนหลายครั้งวาดวยการเลื่อนตําแหนงในกองบัญชาการทหารสูงสุดเมื่อไมนานนี้ มุสโสลินีมั่นใจในขีดความสามารถทางทหารของอิตาลียิ่งกวาที่เคย เมื่อกลาวตอเหลาทัพตางๆ เขายกยองความกลาหาญและความสามารถของพวกเขา และบอกทหารวาเขามั่นใจในความสําเร็จในอนาคตของพวกเขา"
 BBA_italy_missiolinis.213.a: "การนําที่มีความสามารถคือกุญแจสูความสําเร็จ"
 BBA_italy_missiolinis.council: "สภาใหญฟาสซิสตมีเรื่องเรงดวนกวานี้..."
 ITA_missiolinis_reroll_tt: "สภาใหญแหงลัทธิฟาสซิสตจะทําใหมุสโสลินีเปลี่ยนใจและออกคําสั่งใหมในไมชา"

 BBA_italy_local_rulers.1.t: "$ETH_haile_selassie_gugsa$ ติดตอเจาหนาที่อิตาลี"
 BBA_italy_local_rulers.1.desc: "ไฮเล เซลาสซี กุกซา ผูบัญชาการกองทัพอะบิสซิเนียและสมาชิกราชวงศจักรพรรดิ ไดติดตอเราดวยหวังจะทําขอตกลง นี่เปนชวงเวลาอันยิ่งใหญสําหรับเรา และเปนความอัปยศของชาวอะบิสซิเนีย แมเราจะควาโอกาสนี้มาใชประโยชนได แตเราควรระลึกไววาในสายตาชาวอะบิสซิเนียจํานวนมาก ชายผูนี้คือคนทรยศ การสนับสนุนเขาจึงมาพรอมเงื่อนไขบางประการ"
 BBA_italy_local_rulers.1.a: "การยอมผอนปรนบางอยางอาจทําใหคนทองถิ่นพอใจ"
 BBA_italy_local_rulers.1.b: "แตงตั้ง $ETH_haile_selassie_gugsa$ เปนผูวาการภูมิภาค"
 BBA_italy_local_rulers.1.c: "ตองปราบ $ETH_haile_selassie_gugsa$ และผูติดตามใหสิ้น"
 BBA_italy_local_rulers.1.d: "จะไมมีการเจรจากับผูปกครองทองถิ่นใดๆ ทั้งสิ้น"
 BBA_italy_local_rulers.2.t: "$ETH_abba_jofir$ ติดตอเจาหนาที่อิตาลี"
 BBA_italy_local_rulers.2.desc: "ระหวางการพิชิตแอดดิสอาบาบา เราไดปลอยตัวอับบา โจฟร อดีตกษัตริยแหงจิมมา ผูเคยรวมมือกับเรากอนสงครามปะทุ บัดนี้เขามาหาเราเพื่อขอการสนับสนุนในการฟนฟูอํานาจบางสวนที่เคยมี สิ่งนี้อาจเปนประโยชนตอเราเพราะเขายังมีอิทธิพลอยูบาง แตเนื่องจากเขาถูกจับไดวาสมคบกับเรา หลายคนจึงมองวาเขาเปนคนทรยศเชนกัน"
 BBA_italy_local_rulers.2.a: "การยอมผอนปรนบางอยางอาจทําใหคนทองถิ่นพอใจ"
 BBA_italy_local_rulers.2.b: "แตงตั้ง $ETH_abba_jofir$ เปนผูวาการภูมิภาค"
 BBA_italy_local_rulers.2.c: "ตองปราบ $ETH_abba_jofir$ และผูติดตามใหสิ้น"
 BBA_italy_local_rulers.2.d: "จะไมมีการเจรจากับผูปกครองทองถิ่นใดๆ ทั้งสิ้น"
 BBA_italy_local_rulers.3.t: "$ETH_hailu_tekle_haymanot$ ติดตอเจาหนาที่อิตาลี"
 BBA_italy_local_rulers.3.desc: "ไฮลู เตกเล ไฮมาโนต ขุนนางอะบิสซิเนียที่ถูกปลดจากอํานาจ ไดติดตอเรามาโดยอางวาเราสามารถเปนประโยชนตอกันได เขาเสนอรับใชเราเพื่อแลกกับตําแหนงในรัฐบาลของเราในอะบิสซิเนีย การที่เขาเคยเปนผูปกครองอาจตอบสนองจุดประสงคของเราได แตการที่เขาเปนแคอดีตผูปกครองก็จะสงผลตอประชาชนทองถิ่นดวย ซึ่งพวกเขาอาจตอตานการปกครองของเขา"
 BBA_italy_local_rulers.3.a: "การยอมผอนปรนบางอยางอาจทําใหคนทองถิ่นพอใจ"
 BBA_italy_local_rulers.3.b: "แตงตั้ง $ETH_hailu_tekle_haymanot$ เปนผูวาการภูมิภาค"
 BBA_italy_local_rulers.3.c: "ตองปราบ $ETH_hailu_tekle_haymanot$ และผูติดตามใหสิ้น"
 BBA_italy_local_rulers.3.d: "จะไมมีการเจรจากับผูปกครองทองถิ่นใดๆ ทั้งสิ้น"
 BBA_italy_local_rulers.4.t: "$ETH_seyoum_mengesha$ ติดตอเจาหนาที่อิตาลี"
 BBA_italy_local_rulers.4.desc: "ในชัยชนะอันนาตื่นตะลึงเหนือชาวอะบิสซิเนีย เราจับตัวผูบัญชาการกองทัพคนสําคัญและสมาชิกราชวงศจักรพรรดิไดคนหนึ่ง นั่นคือเซยุม เมงเงชา เราไดรับแจงวาจักรพรรดิไฮเล เซลาสซีแหงอะบิสซิเนียทรงใหความสําคัญกับชายผูนี้อยางยิ่ง เราสามารถใชนักโทษผูนี้ทําใหองคจักรพรรดิอับอายยิ่งขึ้น และอาจไดมาซึ่งความภักดีของประชาชน แนนอนวาเขาจะไมมีอํานาจที่แทจริง แตตองทําตามที่ถูกสั่ง"
 BBA_italy_local_rulers.4.a: "การยอมผอนปรนบางอยางอาจทําใหคนทองถิ่นพอใจ"
 BBA_italy_local_rulers.4.b: "แตงตั้ง $ETH_seyoum_mengesha$ เปนผูวาการภูมิภาค"
 BBA_italy_local_rulers.4.c: "ตองปราบ $ETH_seyoum_mengesha$ และผูติดตามใหสิ้น"
 BBA_italy_local_rulers.4.d: "จะไมมีการเจรจากับผูปกครองทองถิ่นใดๆ ทั้งสิ้น"

 ITA_ends_event_chain_tt: "§Rสิ้นสุดลําดับเหตุการณ§!"

 BBA_italy_air_accident.01.t: "การเสียชีวิตอันนาเศราของ $ITA_italo_balbo$"
 BBA_italy_air_accident.01.desc: "จอมพลอิตาโล บัลโบ ถูกยิงตกโดยฝายเดียวกันเหนือนานฟาลิเบีย การระบุตัวผิดพลาดทําใหปนตอสูอากาศยานเปดฉากยิงและสอยเครื่องบินของเขารวงลงมาจากฟากฟา นายพลจูเซปเป เตลเลรา ซึ่งเดินทางดวยเครื่องบินอีกลํา รอดชีวิตจากเหตุการณ แตก็ขวัญเสียจากประสบการณครั้งนี้"
 BBA_italy_air_accident.01.a: "ความสูญเสียอันใหญหลวง..."
 BBA_italy_air_accident.02.t: "การเสียชีวิตอันนาเศราของ $ITA_giuseppe_tellera$"
 BBA_italy_air_accident.02.desc: "หลังการระบุตัวผิดพลาด เครื่องบินของจอมพลอิตาโล บัลโบ ถูกปนตอสูอากาศยานฝายเดียวกันยิงใสเหนือนานฟาลิเบีย โชคดีที่เขารอดมาไดโดยไมบาดเจ็บ แตเสนาธิการของเขา นายพลจูเซปเป เตลเลรา ไมโชคดีเชนนั้น และถูกยิงตกเสียชีวิต บัลโบโกรธจัดและลงโทษทั้งกองรอยรวมถึงนายทหารอยางคอนขางรุนแรง"
 BBA_italy_air_accident.02.a: "นาเศรา..."
 BBA_italy_air_accident.03.t: "หลีกเลี่ยงโศกนาฏกรรมจากการยิงพวกเดียวกันได"
 BBA_italy_air_accident.03.desc: "จอมพลอิตาโล บัลโบ ถูกปนตอสูอากาศยานฝายเดียวกันยิงใสหลังการระบุตัวผิดพลาดเหนือนานฟาลิเบีย บัลโบสามารถติดตอทหารภาคพื้นดินและหลบหางจากหากระสุนได เขาโนมนาวใหพลปนตอสูอากาศยานหยุดยิง และนําเครื่องบินลงจอดไดสําเร็จ ทานจอมพลไดรับการยกยองในความกลาหาญและความใจเย็นในสถานการณคับขัน"
 BBA_italy_air_accident.03.a: "ความกลาหาญของบัลโบชวยกอบกูสถานการณไว!"
 BBA_italy_air_accident.11.t: "อุบัติเหตุเครื่องบินตกอันนาเศรา"
 BBA_italy_air_accident.11.desc: "ระหวางเดินทางไปตรวจชายแดนฝรั่งเศส เครื่องบินของอัลโด เปลเลกรีนี ผูบัญชาการกองทัพอากาศ และนายพลปเอโตร ปนตอร ประสบปญหาเครื่องยนต เครื่องบินตกและไมมีผูใดบนเครื่องรอดชีวิต"
 BBA_italy_air_accident.11.a: "[ROOT.GetNameDefCap]สูญเสียนายทหารฝมือดีไปสองนาย"
 BBA_italy_air_accident.12.t: "เครื่องบินตก"
 BBA_italy_air_accident.12.desc: "ระหวางบินไปยังชายแดนฝรั่งเศส เครื่องบินของอัลโด เปลเลกรีนี ผูบัญชาการกองทัพอากาศ และนายพลปเอโตร ปนตอร ประสบปญหาเครื่องยนตและเริ่มสูญเสียระดับความสูงอยางรวดเร็ว เมื่อเผชิญความตายที่แทบหลีกเลี่ยงไมได เปลเลกรีนีเขาควบคุมเครื่องเองและนําเครื่องลงจอดฉุกเฉินได ดวยความคุนเคยกับเครื่องบินของซาวอยา-มารเก็ตตี ทุกคนบนเครื่องรอดชีวิต แมจะฟกชํ้ากันบาง "
 BBA_italy_air_accident.12.a: "โชคเขาขางพวกเขา!"
 ITA_pellegrini_promotion_tt: "\nคุณลักษณะ $air_chief$ พัฒนาจาก §Yผูชํานาญเฉพาะดาน§! เปน §Yผูเชี่ยวชาญ§!"

 BBA_italy_naval_cooperation_programs.01.t: "โครงการความรวมมือทางนาวีของอิตาลี"
 BBA_italy_naval_cooperation_programs.01.desc: "เราไดรับขอเสนอจาก[From.GetName]ใหเขารวมโครงการความรวมมือทางนาวีกับพวกเขา โครงการเชนนี้อาจเปนประโยชนตอเราไมนอย แตก็จะเปนประโยชนตอกองทัพเรือ[FROM.GetAdjective]พอๆ กัน"
 BBA_italy_naval_cooperation_programs.01.a: "ขอตกลงที่เปนประโยชน!"
 BBA_italy_naval_cooperation_programs.01.b: "ชาวอิตาลีไมมีอะไรจะเสนอใหเรา"
 BBA_italy_naval_cooperation_programs.02.t: "[FROM.GetNameDefCap] เขารวม$ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.02.desc: "ดูเหมือนวา[From.GetName]จะตัดสินใจอยางมีเหตุผลและเขารวมโครงการความรวมมือทางนาวีของเรา สิ่งนี้จะเปนประโยชนตอทั้งสองฝายและเสริมขีดความสามารถของเราอยางแนนอน!"
 BBA_italy_naval_cooperation_programs.02.a: "ใหผูเชี่ยวชาญเริ่มงานกันเลย!"
 BBA_italy_naval_cooperation_programs.03.t: "[FROM.GetNameDefCap] ปฏิเสธ$ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.03.desc: "[FROM.GetName]ปฏิเสธที่จะเขารวมโครงการความรวมมือทางนาวีของเราอยางโงเขลา เขาใจผิดวาการอยูลําพังคือความแข็งแกรง ทั้งที่ผูมีปญญารูดีวาความแข็งแกรงอยูที่การรวมพลัง"
 BBA_italy_naval_cooperation_programs.03.a: "ชางเปนทางเลือกที่โงอยางไมนาเชื่อ"
 BBA_italy_naval_cooperation_programs.04.t: "การซอมรบรวมกับกองทัพเรือ[FROM.GetAdjective]"
 BBA_italy_naval_cooperation_programs.04.desc: "ชาว[FROM.GetAdjective]เสนอใหเราเขารวมการฝกซอมทางทะเลรวมกัน โดยกลาววามีเพียงการเตรียมพรอมสําหรับสงครามเทานั้น เราจึงจะพรอมรับมือศัตรูหากพวกมันบุกมา"
 BBA_italy_naval_cooperation_programs.04.a: "อาวานตี!"
 BBA_italy_naval_cooperation_programs.04.b: "ชาวอิตาลีไมมีอะไรจะเสนอใหเรา"
 BBA_italy_naval_cooperation_programs.05.t: "การซอมรบ[ROOT.GetAdjective]-[FROM.GetAdjective]กําลังดําเนินอยู"
 BBA_italy_naval_cooperation_programs.05.desc: "[FROM.GetName]ไดตอบรับขอเสนอการซอมรบทางทะเลรวมกันของเรา โดยตระหนักถึงความจําเปนที่ตองเตรียมพรอมหากศัตรูบุกเขามา"
 BBA_italy_naval_cooperation_programs.05.a: "ยอดเยี่ยม!"
 BBA_italy_naval_cooperation_programs.06.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 BBA_italy_naval_cooperation_programs.06.desc: "ความสายตาสั้นของ[FROM.GetName]ชางนาตกตะลึง! การปฏิเสธขอเสนอการฝกซอมทางทะเลรวมกันเพื่อเตรียมกองเรือของเราใหพรอมยิ่งขึ้น แสดงใหเห็นแตความหยิ่งผยองของพวกเขา"
 BBA_italy_naval_cooperation_programs.06.a: "[FROM.GetLeader] คงไมไดคิดเรื่องนี้ใหรอบคอบ..."
 BBA_italy_naval_cooperation_programs.07.t: "การซอมรบ[ROOT.GetAdjective]-[FROM.GetAdjective]"
 BBA_italy_naval_cooperation_programs.07.desc: "เหลาพลเรือเอกของเรายินดีรายงานวาการฝกซอมทางทะเลครั้งลาสุดประสบความสําเร็จอยางงดงาม! เราไดรับความรูใหมมากมายและพรอมยิ่งขึ้นสําหรับปฏิบัติการในทะเลหลวงในอนาคต"
 BBA_italy_naval_cooperation_programs.07.a: "ถึงเวลานําสิ่งที่เรียนรูมาใชจริงแลว!"
 ITA_joint_maneuvers_with_country_remove_effect_tt: "ผลหลังเสร็จสิ้นโครงการซอมรบรวม ในอีก §Y[?ITA.ITA_joint_maneuvers_with_country_days]§! วัน:"
 BBA_italy_naval_cooperation_programs.08.t: "ขอเสนอขายเรือคุมกันจาก[FROM.GetAdjective]"
 BBA_italy_naval_cooperation_programs.08.desc: "ชาว[FROM.GetAdjective]ไดติดตอเราพรอมขอเสนอขายเรือคุมกันบางสวนของพวกเขา เรือบางลําคอนขางเกาและลาสมัย แตบางทีเราอาจยังหาประโยชนจากมันในกองทัพเรือของเราได"
 BBA_italy_naval_cooperation_programs.08.a: "สิ่งนี้จะเสริมกําลังกองเรือ[ROOT.GetAdjective]!"
 BBA_italy_naval_cooperation_programs.08.b: "เราไมตองการเศษเหล็กของ[ITA.GetAdjective]"
 BBA_italy_naval_cooperation_programs.09.t: "[FROM.GetNameDefCap] ตกลงซื้อเรือคุมกันของเรา"
 BBA_italy_naval_cooperation_programs.09.desc: "[FROM.GetName]ตกลงซื้อเรือคุมกันเกาและลาสมัยบางสวนของเรา พวกเขาคงสิ้นหวังจริงๆ ถึงไดยอมรับเรือที่ตกยุคเหลานี้ ถึงกระนั้น การขายและปลดเรือเหลานี้ออกจากประจําการจะเสริมขีดความสามารถโดยรวมของกองเรือเรา ทําใหรวดเร็วและคลองตัวยิ่งขึ้น"
 BBA_italy_naval_cooperation_programs.09.a: "ขอตกลงที่ดี!"
 BBA_italy_naval_cooperation_programs.10.t: "[FROM.GetNameDefCap] ปฏิเสธเรือคุมกันของเรา"
 BBA_italy_naval_cooperation_programs.10.desc: "[FROM.GetName]ไมไดถูกโนมนาวใหซื้อเรือคุมกันเกาและลาสมัยของเราไดงายอยางที่เราหวัง เราตองหันไปหาทางอื่นเพื่อกําจัดเรือที่ตกยุคเหลานี้"
 BBA_italy_naval_cooperation_programs.10.a: "เราจะหาผูซื้อรายอื่น"
 ITA_cooperation_programs_deal_others_tt: "([ROOT.GetEscortShipsSender]): โอน §Yเรือพิฆาตชั้นคูรตาโตเน 2 ลํา§! และ §Yเรือพิฆาตชั้นมาเอสตราเล 2 ลํา§! ใหแก [ROOT.GetEscortShipsReceiver]"
 ITA_cooperation_programs_deal_root_tt: "[ROOT.GetFlag]§Y[ROOT.GetName]§!"
 ITA_cooperation_programs_deal_from_tt: "[FROM.GetFlag]§Y[FROM.GetName]§!"
 BBA_italy_naval_cooperation_programs.11.t: "[ITA.GetNameDefCap] เสนอเรือพิฆาต"
 BBA_italy_naval_cooperation_programs.11.desc: "ชาว[FROM.GetAdjective]ไดเสนอเรือพิฆาตรุนเกาสองลําใหแกเรา โดยไมคิดมูลคา แมเรือเหลานี้อาจคอนขางลาสมัย แตก็ยังรับใชกองทัพเรือของเราไดดี นี่เปนทาทีที่เอื้อเฟออยางแทจริง "
 BBA_italy_naval_cooperation_programs.11.a: "เราซาบซึ้งในนํ้าใจนี้!"
 BBA_italy_naval_cooperation_programs.12.t: "เรือพิฆาตชั้นอากวีลาของเราเดินทางถึงสเปน"
 BBA_italy_naval_cooperation_programs.12.desc: "กองทัพเรือ[FROM.GetAdjective]ไดรับเรือพิฆาตที่เรามอบใหอยางเอื้อเฟอแลว โดยไมคิดมูลคา หวังวาพวกเขาจะนําไปใชใหเกิดประโยชน"
 BBA_italy_naval_cooperation_programs.12.a: "อารริเวเดอรชี!"
 BBA_italy_naval_cooperation_programs.13.t: "[FROM.GetNameDefCap] ปฏิเสธเรือพิฆาตของเรา"
 BBA_italy_naval_cooperation_programs.13.desc: "[FROM.GetAdjective]ไดปฏิเสธของขวัญเรือพิฆาตสองลําของเราอยางคอนขางหยิ่งผยอง ทั้งที่ไมคิดมูลคา กองเรือของพวกเขาคงยิ่งใหญนักถึงไดปฏิเสธขอเสนอเชนนี้!"
 ITA_cede_aquila_class_destroyers_tt: "([ROOT.GetEscortShipsSender]): โอน §Yเรือพิฆาตชั้นอากวีลา 2 ลํา§! ใหแก [ROOT.GetEscortShipsReceiver]"
 BBA_italy_naval_cooperation_programs.14.t: "[ITA.GetName]สงออกเรือดํานํ้าขนาดเล็ก"
 BBA_italy_naval_cooperation_programs.14.desc: "ชาว[FROM.GetAdjective]สอบถามวาเราสนใจซื้อเรือดํานํ้าขนาดเล็กหาลําหรือไม แมจะมีประโยชนใชสอยจํากัด แตก็อาจตอบสนองความตองการและขยายขีดความสามารถทางนาวีของเราได"
 BBA_italy_naval_cooperation_programs.14.a: "มันอาจเปนประโยชนตอกองทัพเรือของเรา"
 BBA_italy_naval_cooperation_programs.14.b: "ไมสนใจ ไปตอ"
 BBA_italy_naval_cooperation_programs.15.t: "[FROM.GetName]ซื้อเรือดํานํ้าขนาดเล็กของเรา"
 BBA_italy_naval_cooperation_programs.15.desc: "กองทัพเรือ[FROM.GetAdjective]เห็นขอดีบางประการของเรือดํานํ้าขนาดเล็กของเรา และตัดสินใจซื้อไป นี่เปนชวงเวลาอันยิ่งใหญทั้งสําหรับวิศวกรของประเทศเราและกองทัพเรือของเราเอง"
 BBA_italy_naval_cooperation_programs.15.a: "ยอดเยี่ยม!"
 BBA_italy_naval_cooperation_programs.16.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
 BBA_italy_naval_cooperation_programs.16.desc: "กองทัพเรือ [FROM.GetAdjective]ไมเห็นประโยชนในการซื้อเรือดํานํ้าขนาดเล็กของเรา นั่นเปนเพราะพวกเขาใจแคบและพูดตรงๆ ก็คือหัวทึบ เพราะเรือดํานํ้าของเรามีคุณภาพสูงสุด"
 BBA_italy_naval_cooperation_programs.17.t: "เรือดํานํ้าขนาดเล็กของ[ITA.GetAdjective]เดินทางถึง[ROOT.GetName]"
 BBA_italy_naval_cooperation_programs.17.desc: "เรือดํานํ้าขนาดเล็กของ[FROM.GetAdjective]มาถึงแลวในที่สุด เพื่อเสริมขีดความสามารถทางนาวีของเรา! สิ่งเหลานี้จะเปนสวนเสริมที่ยอดเยี่ยมของกองเรือ และเราจะใชมันใหเกิดประโยชน"
 BBA_italy_naval_cooperation_programs.17.a: "ใหมันเริ่มทํางานกันเลย!"
 BBA_italy_human_torpedo_raid.1.t: "การจูโจม[?ITA.ITA_raided_state_var.GetName]"
 BBA_italy_human_torpedo_raid.1.desc: "ชาวอิตาลีหลบเลี่ยงแนวปองกันทาเรือของเราใน[?ITA.ITA_raided_state_var.GetName]ได และแทรกซึมเขาฐานทัพเรือที่นั่นดวยเรือขนาดเล็กมาก เพื่อจูโจมเรือของเราที่จอดอยู แมการจูโจมจะไมไดจมเรือลําใด แตก็สรางความเสียหายซึ่งตองใชเวลาซอมแซมพอสมควร"
 BBA_italy_human_torpedo_raid.1.a: "โชครายยิ่งนัก"
 ITA_human_torpedo_raid_tt: "การจูโจมนี้ทําไดเพียงครั้งเดียว"
 ITA_human_torpedo_effect_tt: "จะสรางความเสียหายแกหนวยทางเรือของศัตรูที่จอดอยูในรัฐนี้"
 ITA_human_torpedo_target_effect_tt: "สรางความเสียหายแกหนวยทางเรือที่จอดอยูใน[?ITA.ITA_raided_state_var.GetName]"

 BBA_italy_colonial_management.1.t: "ตํารวจอาณานิคม"
 BBA_italy_colonial_management.1.desc: "ดินแดนอาณานิคมของเราขยายตัวขึ้นอยางมากนับตั้งแตกอตั้งชาติเมื่อไมถึงศตวรรษกอน แตการขยายตัวนี้เริ่มทําใหกําลังพลของเราตึงตัว ทวามีหนทางบรรเทาขอจํากัดเหลานี้ได โดยใชกองกําลังตํารวจทองถิ่น เชน เมฮาริสตี ซาวารี สปาฮี และอื่นๆ การเกณฑกลุมเหลานี้จะเปนภาระตอกองกําลังของเรานอยกวา และยังมีขอไดเปรียบจากการเปนคนพื้นถิ่น พรอมทุกสิ่งที่ตามมาดวย"
 BBA_italy_colonial_management.1.a: "เกณฑพวกเขา!"
 BBA_italy_colonial_management.1.b: "เรามีแผนอื่น"
 BBA_italy_colonial_management.1_do_not_apply_tt: "กฎหมายการยึดครอง §Y$colonial_police$§! จะใชไดใน[GetAfricanStates][GetAndOrNothing][GetAlbanianStates]ที่อยูในการควบคุม"
 BBA_italy_colonial_management_african_states: "รัฐในแอฟริกา"
 BBA_italy_colonial_management_albanian_states: "รัฐในแอลเบเนีย"
 BBA_italy_colonial_management_and: " และ "

 BBA_italy_bop.1.t: "การลมสลายของ[?ITA.ITA_lost_core.GetName]"
 BBA_italy_bop.1.desc: "เราเสีย[?ITA.ITA_lost_core.GetName]ใหแกศัตรู! สิ่งนี้ยอมสั่นคลอนศรัทธาของชาวอิตาลีตอความพยายามในสงครามของเรา ถึงขั้นมีเสียงเรียกรองใหเจรจาสันติภาพ เหตุการณครั้งนี้ทําใหหลายคนไมพอใจอยางยิ่ง และผูคนกําลังหาใครสักคนมารับผิด เราตองชิงความไดเปรียบกลับคืนมาและผลักดันกองกําลังศัตรูออกจากอิตาลี!"
 BBA_italy_bop.1.a: "นี่คือหายนะ!"
 ITA_losing_cores_tt: "ผลจะเกิดขึ้นทุกครั้งที่[ROOT.GetName]เสียการควบคุม§Yรัฐดินแดนหลัก§!ใหแกศัตรู"
 BBA_italy_bop.2.t: "การลมสลายของ[?ITA.ITA_lost_colony.GetName]"
 BBA_italy_bop.2.desc: "กองกําลังศัตรูไดยึดครอง[?ITA.ITA_lost_colony.GetName] สรางความตกตะลึงใหชาวอิตาลีทั่วทุกแหง! ประชาชนเคยเขาใจวากระแสสงครามเปนใจใหเรา หรืออยางนอยก็กําลังจะเปนเชนนั้นในไมชา แมนี่จะเปนความถดถอยอยางแนนอน แตดวยการวางแผนที่ดีและความเขมแข็ง เราจะทวงคืน[?ITA.ITA_lost_colony.GetName]ไดอยางแนนอน!"
 BBA_italy_bop.2.a: "เราจะลุกขึ้นอีกครั้ง!"
 ITA_losing_colonies_tt: "ผลจะเกิดขึ้นทุกครั้งที่[ROOT.GetName]เสียการควบคุม§Yรัฐที่ไมใชดินแดนหลัก§!ใหแกศัตรู ตราบใดที่คายังตํ่ากวา §Y30%§! ไปทาง §Y$ITA_grand_council_side$§!"
 BBA_italy_bop.3.t: "เรายึด[?ITA.ITA_reclaimed_core.GetName]คืนมาไดแลว"
 BBA_italy_bop.3.desc: "กองกําลังผูมีชัยของเราไดทวงคืน[?ITA.ITA_reclaimed_core.GetName] ปลุกขวัญกําลังใจของชาวอิตาลีทั่วทุกแหง! นี่อาจเปนชวงเวลาที่เราพลิกกระแสสงครามและผลักดันศัตรูออกจาก[ITA.GetNameDef]อันเปนที่รักของเรา"
 BBA_italy_bop.3.a: "กระแสกําลังพลิกมาเขาทางเรา!"
 ITA_reclaiming_cores_tt: "ผลจะเกิดขึ้นทุกครั้งที่[ROOT.GetName]ทวงคืน§Yรัฐดินแดนหลัก§!จากศัตรู"

 BBA_italy_council_deposes_duce.1.t: "การโคนลม[?ITA.ITA_var_deposed_leader.GetName]"
 BBA_italy_council_deposes_duce.1.desc: "เพื่อกอบกูอิตาลีจากความพินาศ และเพื่อรักษาระบอบฟาสซิสตไว เราตองทําสิ่งที่ไมมีใครคาดคิด นั่นคือปลด[?ITA.ITA_var_deposed_leader.GetName]ออกจากอํานาจ! ความไรความสามารถและความบกพรองของเขาถวงรั้งประเทศและความกาวหนาของเรามานานแลว เปนหนาที่ของเราที่จะปกปองประชาชน[FROM.GetAdjective]และอนาคตของพวกเขา!"
 BBA_italy_council_deposes_duce.1.a: "เพื่อประโยชนสวนรวม"

  BBA_italy_council_deposes_duce.2.t: "สภาใหญพิจารณาการแทรกแซงโดยตรง"
  BBA_italy_council_deposes_duce.2.desc: "เนื่องจากความทุกขยากลําบากที่ [ROOT.GetLeader] เผชิญเมื่อไมนานนี้ สภาใหญจึงเริ่มวางแผนแยงชิงอํานาจมาเปนของตน ซึ่งเปนการเคลื่อนไหวที่ไมเปนที่นิยมและอาจนําไปสูสงครามกลางเมืองภายในชาติของเราในทายที่สุด เราตองทําทุกวิถีทางเพื่อลดความเสี่ยงที่สิ่งนี้จะเกิดขึ้น"
  BBA_italy_council_deposes_duce.2.a: "เราตองใชมาตรการเด็ดขาดเพื่อไมใหสิ่งนี้เกิดขึ้น!"
  ITA_grand_council_considers_intervention_tt: "หากอํานาจไหลไปอยูในมือของ§Yสภาใหญ§!มากขึ้นอีก พวกเขาอาจ§Rยึดอํานาจ§!ไปจาก§Y[ROOT.GetLeader]!§!โดยสมบูรณ"

 BBA_italy_civil_war.1.t: "สงครามกลางเมืองอิตาลี"
 BBA_italy_civil_war.1.desc: "อิตาลีอันเปนที่รักของเราไดแตกแยกภายใตแรงกดดันของสงคราม! บัดนี้ฝายตางๆ กําลังกอตัวขึ้นเพื่อแยงชิงสิ่งที่เหลืออยูของชาติ และตอสูกันวาอิตาลีจะยึดถืออุดมการณใดตอไป ทางเลือกอันยากลําบากรอเราทุกคนอยู แตเราตองอดทนและฝาฟนไป เพื่อที่เราจะไดกลับมาเบงบานอีกครั้ง "
 BBA_italy_civil_war.1.a: "เราตองการมือที่มั่นคง!"
 BBA_italy_civil_war.1.b: "เราตองการเสถียรภาพและขนบธรรมเนียม!"
 BBA_italy_civil_war.1.c: "นอมรับการปฏิวัติของประชาชน!"
 BBA_italy_civil_war.1.d: "ใหเสรีภาพครองอํานาจ!"
 BBA_italy_civil_war.2.t: "$ITA_fronte_militare_clandestino$"
 BBA_italy_civil_war.2.desc: "ดูเหมือนวากลุมตอตานที่เพิ่งกอตั้งขึ้นใหมกําลังสรางความเสียหายอยูหลังแนวหนาของเรา จากขอมูลอันนอยนิดที่เรามีเกี่ยวกับกลุมนี้ ดูเหมือนวาสวนใหญจะเปนอดีตนายทหารบกที่แปรพักตร กําลังมีความพยายามลอพวกมันออกมา แตตอนนี้เรามีขาวกรองนอยเกินกวาจะคาดการณการเคลื่อนไหวครั้งตอไปของพวกมันได"
 BBA_italy_civil_war.2.a: "พวกมันซอนตัวไปตลอดไมไดหรอก"
 BBA_italy_civil_war.3.t: "$ITA_gappisti$"
 BBA_italy_civil_war.3.desc: "เราไดรับขาวกรองวากองโจรคอมมิวนิสตกลุมเล็กๆ หลายกลุมที่เรียกตัวเองวากัปปสตี ไดปฏิบัติการตีแลวหนีในดินแดนของเราสําเร็จหลายครั้ง พวกเขาไดรับการฝกและติดอาวุธมาอยางดี ทําใหเราสงสัยวาไดรับทุนสนับสนุนจาก[FROM.GetName]"
 BBA_italy_civil_war.3.a: "พวกคอมมิวนิสตทรยศ!"
 BBA_italy_civil_war.4.t: "มาตรการปราบปรามกองโจรใน[FROM.GetName]"
 BBA_italy_civil_war.4.desc: "กลุมตอตานและกองโจรใน[FROM.GetName]ที่ทํางานอยางไมรูเหน็ดเหนื่อยเพื่อปลดปลอยสวนที่เหลือของอิตาลีไดประสบความสําเร็จ! ถึงขนาดที่ระบอบอันชั่วรายซึ่งยังกุมอํานาจอยูที่นั่นถูกบีบใหเริ่มใชมาตรการปราบปรามกองโจรชุดใหมอยางรุนแรง สิ่งนี้จะทําใหสายลับของเราปฏิบัติการใน[FROM.GetName]ไดยากขึ้น แตการตอสูเพื่ออิตาลีที่เสรียังคงดําเนินตอไป!"
 BBA_italy_civil_war.4.a: "มอรโต แปร ลา ลิแบรตา!"
 BBA_italy_civil_war.5.t: "[FROM.GetAdjective]เรียกรองเอกราช"
 BBA_italy_civil_war.5.desc: "พันธมิตรและรัฐในอารักขาชาวอิตาลีของเราไดขอใหปลดพวกเขาจากการปกครองของเราและมอบเอกราชอยางสมบูรณ เราเขาควบคุม[FROM.GetName]ในตอนแรกเพื่อใหแนใจวาแนวรบอิตาลีจะไมลมสลายโดยสิ้นเชิง แตบางทีอาจถึงเวลาแลวที่จะมอบอิสรภาพใหพวกเขา"
 BBA_italy_civil_war.5.a: "มอบเอกราชใหพวกเขา"
 BBA_italy_civil_war.5.b: "ปฏิเสธคําวิงวอนขออิสรภาพของพวกเขา"
 BBA_italy_civil_war.6.t: "เอกราชของ[ROOT.GetNameDef]"
 BBA_italy_civil_war.6.desc: "พันธมิตรและผูปกครองชั่วคราวของเรา [FROM.GetName] ไดรับฟงเสียงเรียกรองอิสรภาพของเราและตกลงคืนเอกราชใหแกเรา! นี่เปนวาระสําคัญยิ่งสําหรับประเทศที่บอบชํ้าจากสงครามของเรา บัดนี้เราสามารถเริ่มฟนฟูอยางจริงจัง และเสนทางสูการรวมชาติก็เริ่มตนได"
 BBA_italy_civil_war.6.a: "เปนนายแหงชะตากรรมของตนเองอีกครั้ง"
 BBA_italy_civil_war.7.t: "[FROM.GetName]ปฏิเสธขอเรียกรองเอกราชของเรา"
 BBA_italy_civil_war.7.desc: "ผูปกครองชาว[FROM.Adjective]ผูกดขี่ไดปฏิเสธคําขอเอกราชอยางสุจริตของเรา! แมพวกเขาจะมีประโยชนในการชนะสงครามกลางเมือง แตพวกเขาไมมีสิทธิ์กําหนดชะตากรรมหรือแทรกแซงการเมืองของเราอีกตอไป เมื่อถึงเวลาที่เหมาะสม เปนหนาที่ของเราที่จะขับไลพวกเขาออกจากแผนดินและควาอิสรภาพมาดวยตัวเราเอง!"
 BBA_italy_civil_war.7.a: "พวกเขาจะตองเสียใจ!"
 BBA_italy_civil_war.7.b: "เราจะพอใจเทานี้..."
 ITA_we_will_transfer_the_following_states_tt: "รัฐตอไปนี้จะถูกโอนใหแก §Y[RDS.GetFlag][RDS.GetNameDef]§!:"
 ITA_we_keep_our_occupied_states_tt: "เราจะยังคงควบคุมรัฐที่เรายึดครองอยูในปจจุบัน"
 BBA_italy_civil_war_fascist_tt: "เราจะยังคงควบคุม §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! โดย §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! จะกลายเปน §Y$RSI_DEF$§! [GetRsiOverlord]"
 BBA_italy_civil_war_monarchist_tt: "เราจะกลายเปน §Y$RDS_DEF$§! ฝายกบฏในสงครามกลางเมืองที่มีอุดมการณ §Y$neutrality$§! [GetRdsOverlord]"
 BBA_italy_civil_war_communist_tt: "เราจะกลายเปน §Y$RDS_DEF$§! ฝายกบฏในสงครามกลางเมืองที่มีอุดมการณ §Y$communism$§! [GetRdsOverlord]"
 BBA_italy_civil_war_democratic_tt: "เราจะกลายเปน §Y$RDS_DEF$§! ฝายกบฏในสงครามกลางเมืองที่มีอุดมการณ §Y$democratic$§! [GetRdsOverlord]"
 ITA_rsi_overlord_tt: "เราจะกลายเปนรัฐในอารักขาของ §Y[?ITA_rsi_overlord.GetFlag][?ITA_rsi_overlord.GetNameDef]§!"
 ITA_rds_overlord_tt: "เราจะกลายเปนรัฐในอารักขาของ §Y[?ITA_rds_overlord.GetFlag][?ITA_rds_overlord.GetNameDef]§!"
 BBA_italy_civil_war.100.t: "ดินแดนอิตาลีที่ถูกยึดครอง"
 BBA_italy_civil_war.100.desc: "เราพบวาตนเองควบคุมดินแดนของอิตาลีอยู ขณะที่สูรบเคียงขางพันธมิตรชาวอิตาลี เราสามารถปลดกําลังสวนหนึ่งไปใชที่อื่นไดดวยการสงมอบดินแดนเหลานี้ใหแก[RDS.GetName]"
 BBA_italy_civil_war.100.a: "โอนดินแดน"
 BBA_italy_civil_war.100.b: "คงการยึดครองดินแดนไว"
 BBA_italy_civil_war.101.t: "[FROM.GetName]สงมอบดินแดนอิตาลี"
 BBA_italy_civil_war.101.desc: "[FROM.GetLeader] ผูนําผูปราดเปรื่องของ[FROM.GetName] ไดคืนการควบคุมดินแดนอิตาลีใหแกเราอยางเอื้อเฟอ! สิ่งนี้ไมเพียงปลุกขวัญกําลังใจของทหารอยางมาก แตยังเสริมขีดความสามารถและความพยายามของเราในการปลดปลอยอิตาลีทั้งหมดดวย"
 BBA_italy_civil_war.101.a: "อาวานตี!"

 BBA_italy_civil_war.300.desc: "ความพยายามของเราในการรวมประชาชน[FROM.Adjective]ใหตอตานลัทธิฟาสซิสตมาถึงจุดแตกหักแลว! เราไมอาจนั่งดูประเทศอันงดงามของเราเลือดไหลจนแหงเหือดไดอีกตอไป ดวยพลังที่รวบรวมมา บัดนี้เรามีหนทางที่จะโคนลมระบอบฟาสซิสตใหสิ้นซาก และปลดปลอยอิตาลีทั้งหมดจากการกดขี่!"

 BBA_italy_interaction_events.1.t: "[ITA.GetLeader] เรียกรอง[846.GetName]"
 BBA_italy_interaction_events.1.desc: "ในการเคลื่อนไหวที่ไมคาดคิดและอุกอาจอยางยิ่ง [ITA.GetLeader] ผูนําอิตาลีไดยํ่ายีความเปนกลางที่เรายึดถือมายาวนาน ดวยการยื่นคําขาดมายังเรา ภายในสองสัปดาห เราตองสงมอบภูมิภาค[846.GetName]ใหแกอิตาลี มิฉะนั้นจะเกิดสงคราม เราควรตอบสนองอยางไร?"
 BBA_italy_interaction_events.1.a: "จุดออนที่ตองปองกันลดลงไปหนึ่งจุด"
 BBA_italy_interaction_events.1.b: "อยากเห็นพวกมันลองดูนัก!"

 BBA_italy_interaction_events.2.t: "[SWI.GetName]ผูขลาดเขลายอมถอย"
 BBA_italy_interaction_events.2.desc: "ประธานาธิบดีแหง[SWI.GetNameDef]ไดประกาศในวันนี้ถึงการสิ้นสุดยุคสมัยหนึ่งของประเทศ พวกเขาจะยกพื้นที่อิตาลีของ[846.GetName]ใหแกเรา และสละการอางสิทธิ์เหนือเมืองที่พูดภาษาอิตาลีทั้งหมดในภูมิภาค วันนี้เปนวันที่[SWI.GetName]สูญเสียทั้งขนาดและคุณคาแหงความหลากหลายทางชาติพันธุ เพราะพวกเขายังยกเลิกภาษาอิตาลีจากการเปนภาษาราชการตามมาดวย"
 BBA_italy_interaction_events.2.a: "แปรเฟตโต!"

 BBA_italy_interaction_events.3.t: "[SWI.GetNameDef]ยืนหยัดทาทาย!"
 BBA_italy_interaction_events.3.desc: "ชาติ[SWI.GetName]ไดประกาศในวันนี้วาจะละทิ้งความเปนกลาง ดวยการขัดขืนขอเรียกรองของเราที่ใหคืน[846.GetName]สูโลกอิตาลี เนื่องจากทางเลือกอันโงเขลานี้ เราจึงไมมีทางเลือกอื่นนอกจากทําลายระบบรัฐแคนทอนของสวิสใหราบคาบ"
 BBA_italy_interaction_events.3.a: "ระดมกองพลอัลปนี!"

 BBA_italy_interaction_events.4.t: "ขอเรียกรองใหสวมมงกุฎเจาชายอิตาลี"
 BBA_italy_interaction_events.4.desc: "เราไดรับขอเรียกรองจาก [ITA.GetLeader] ใหสวมมงกุฎเจาชายอิตาลีที่รูจักกันในนามเจาชายไอโมเน เปนกษัตริยโตมิสลาฟที่ 2 แหงโครเอเชียอยางเปนทางการ หากเรายอมรับขอเรียกรองนี้ เรายอมสูญเสียเอกราชไปบางสวนอยางแนนอน แตอาจคุมคาเพื่อปองกันการรุกรานจากอิตาลีในอนาคตอันใกล"
 BBA_italy_interaction_events.4.a: "และพระองคจะเปนกษัตริยโตมิสลาฟ!"
 BBA_italy_interaction_events.4.b: "ชาวอิตาลีจะพบจุดจบบนชายฝงดัลเมเชีย"

 BBA_italy_interaction_events.5.t: "พิธีบรมราชาภิเษกของเจาชายไอโมเน"
 BBA_italy_interaction_events.5.desc: "ระฆังดังกังวานทั่วซาเกร็บในวันนี้ ขณะที่ชาวอิตาลีซึ่งเคยเปนที่รูจักในนามเจาชายไอโมเนไดรับการสวมมงกุฎเปนโตมิสลาฟที่ 2 แหงโครเอเชีย อิทธิพลของเราจะแผขยายลึกเขาไปในคาบสมุทรบอลขาน ขณะที่วันเวลาแหงเกียรติยศของเราใกลเขามา"
 BBA_italy_interaction_events.5.a: "เบลลิสซีโม!"

 BBA_italy_interaction_events.6.t: "ไอโมเนถูกสกัดที่ชายแดนโครเอเชีย"
 BBA_italy_interaction_events.6.desc: "เจาชายไอโมเนเสด็จกลับมาหาเรา และรายงานวาพระองคถูกสกัดและปฏิเสธไมใหผานชายแดนโครเอเชียระหวางทางไปพิธีบรมราชาภิเษกที่ซาเกร็บ เปนที่ชัดเจนวาชาวโครแอตไมมีอะไรจะเสนอใหเรา และการยึดครองทางทหารคือทางเลือกเดียวสําหรับพวกเขาในอนาคต"
 BBA_italy_interaction_events.6.a: "ก็ตองรบกัน!"

 BBA_italy_interaction_events.7.t: "ประธานคณะกรรมการแหงชาติคนใหม"
 BBA_italy_interaction_events.7.desc: "อิตาลีไดแตงตั้ง [MNT.GetLeader] เปนประธานคณะกรรมการแหงชาติคนใหม ซึ่งจะเสริมความแข็งแกรงใหระบอบของเราอยางแนนอน"
 BBA_italy_interaction_events.7.a: "แนนอน"

 BBA_italy_interaction_events.8.t: "[ITA.GetName]เรียกรองการยึดครองดัลเมเชีย"
 BBA_italy_interaction_events.8.desc: "วันนี้ [ITA.GetLeader] แหง[ITA.GetNameDef]ไดสงคําขาดมายังเรา เรียกรองใหยอมให[ITA.GetName]ยึดครองภูมิภาคดัลเมเชีย หากเราไมปฏิบัติตามขอเรียกรองของ [ITA.GetLeader] เราก็นาจะตองเผชิญความขัดแยงทางทหาร"
 BBA_italy_interaction_events.8.a: "ยกใหพวกเขาไป"
 BBA_italy_interaction_events.8.b: "พวกเขาคิดวาตัวเองเปนใครกัน?"

 BBA_italy_interaction_events.9.t: "[FROM.GetName]ยอมรับขอเรียกรองของเรา"
 BBA_italy_interaction_events.9.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef]ไดยอมรับขอเรียกรองใหยึดครองดัลเมเชียของเราอยางนอบนอม และยกดินแดนใหแกเราในเวลาตอมา พวกเขาเลือกที่จะเอาใจเรามากกวายืนหยัดตอตาน ซึ่งจะยิ่งชวยผลักดันเปาหมายของอิตาลีในคาบสมุทรบอลขาน"
 BBA_italy_interaction_events.9.a: "ทุกอยางเปนไปตามแผน"

 BBA_italy_interaction_events.10.t: "[FROM.GetLeader] ผูโงเขลาปฏิเสธคําขาดของเรา"
 BBA_italy_interaction_events.10.desc: "[FROM.GetLeader] ผูโงเขลาแหง[FROM.GetNameDef]ไดปฏิเสธสิ่งที่เปนของเราโดยชอบธรรม และบัดนี้ถึงเวลาที่จะโคน[FROM.GetName]ลงดวยการโจมตีอันรวดเร็วเพียงครั้งเดียว สิ่งนี้จะรับประกันการอางสิทธิ์เหนือดัลเมเชียของเราในอนาคตอันใกลอยางแนนอน"
 BBA_italy_interaction_events.10.a: "ถาอยางนั้นก็ตองใชกําลัง"

 BBA_italy_interaction_events.11.t: "[ITA.GetName]อางสิทธิ์ในราชบัลลังกมอนเตเนโกร"
 BBA_italy_interaction_events.11.desc: "[ITA.GetLeader] ไดเรียกรองใหสงมอบราชบัลลังกมอนเตเนโกรใหแกรัฐอิตาลี และใหรวมมงกุฎทั้งสองไวใตธงเดียวกัน เห็นไดชัดวานี่คอนขางเพอฝน แตก็ไมไกลจากความจริงนัก เพราะพระราชินีแหงอิตาลีทรงเปนชาวมอนเตเนโกร เราควรตอบอยางไร?"
 BBA_italy_interaction_events.11.a: "ยกใหพวกเขาไป"
 BBA_italy_interaction_events.11.b: "อะไรทําใหพวกเขาคิดวามีสิทธิ์?"

 BBA_italy_interaction_events.12.t: "[FROM.GetName]มอบมงกุฎมอนเตเนโกรใหแกเรา"
 BBA_italy_interaction_events.12.desc: "[FROM.GetLeader] ไดประกาศวาพวกเขาไมมีเหตุผลที่จะขัดขืนเจตจํานงของเรา และดินแดนมอนเตเนโกรจะถูกโอนใหแกเราทันที วันนี้เปนวันยิ่งใหญของชาติอิตาลี!"
 BBA_italy_interaction_events.12.a: "แปรเฟตโต!"

 BBA_italy_interaction_events.13.t: "[FROM.GetName]ปฏิเสธที่จะสงมอบมอนเตเนโกร"
 BBA_italy_interaction_events.13.desc: "[FROM.GetLeader] ไดประกาศวาพวกเขาจะไมมีความสัมพันธทางการทูตกับเราอีกตอไป และเราตองเพิกถอนการอางสิทธิ์ในราชบัลลังกมอนเตเนโกรโดยทันที ใหอภัยไมได ยอมรับไมได!"
 BBA_italy_interaction_events.13.a: "นารังเกียจ!"

 BBA_italy_interaction_events.14.t: "[ITA.GetName]เรียกรองใหปลอดทหารในอานาโตเลียตะวันตกโดยสมบูรณ"
 BBA_italy_interaction_events.14.desc: "[ITA.GetLeader] ไดเรียกรองหลักประกันความมั่นคงระหวางสองชาติของเรา ซึ่งก็สมเหตุสมผลดี แตสวนที่อุกอาจกวาคือ [ITA.GetLeader] ยังตองการใหเราทําใหทั้ง[342.GetName]และ[339.GetName]ปลอดทหารโดยสมบูรณ ซึ่งอาจเปนอันตรายตอความมั่นคงของเรา เพราะหมายความวาเราจะตั้งแนวปองกันเบื้องตนไมไดหากถูก[ITA.GetName]หรือพันธมิตรของนางโจมตี"
 BBA_italy_interaction_events.14.a: "ยังไงเราก็ไมจําเปนตองตั้งกองทหารไวที่นั่นอยูแลว"
 BBA_italy_interaction_events.14.b: "นี่หมายความวาเราจะปองกันตัวเองไมได!"

 BBA_italy_interaction_events.15.t: "[FROM.GetName]ยอมทําตามขอเรียกรองของเรา"
 BBA_italy_interaction_events.15.desc: "[FROM.GetName]ไดยอมรับขอเรียกรองของเรา และเลือกที่จะทําใหอานาโตเลียตะวันตกปลอดทหารโดยสมบูรณ หมายความวาพวกเขาจะออนแอลงมาก และไมมีทางตานทานในเบื้องตนไดหากเราโจมตี"
 BBA_italy_interaction_events.15.a: "พวกเขาไมมีทางรูตัวแน"

 BBA_italy_interaction_events.16.t: "[FROM.GetName]ปฏิเสธสิทธิ์ที่เราจะรูสึกปลอดภัย!"
 BBA_italy_interaction_events.16.desc: "[FROM.GetName]ไดปฏิเสธคําขอหลักประกันความมั่นคงอยางเปนมิตรของเรา และไมยอมทําให[342.GetName]และ[339.GetName]ปลอดทหาร นี่อุกอาจเกินกวาจะรับได และตองจัดการดวยวิธีของมันเอง"
 BBA_italy_interaction_events.16.a: "พวกเขาไมเหลือทางเลือกใหเรา"

 BBA_italy_interaction_events.17.t: "[ITA.GetName]สงมอบ[45.GetName]ใหแก[HUN.GetName]"
 BBA_italy_interaction_events.17.desc: "วันนี้[ITA.GetName] ผูปกครองของเรา ไดตัดสินใจสงมอบดินแดน[45.GetName]ซึ่งเราควบคุมอยูใหแกชาวฮังการี เพื่อกระชับความสัมพันธระหวางรัฐอิตาลีและฮังการี และเราแทบทําอะไรไมได อยางไรก็ตาม เราจะยื่นหนังสือประทวงทางการทูตเล็กๆ แมผูมีอํานาจระดับสูงจะไมแมแตจะอานมันก็ตาม"
 BBA_italy_interaction_events.17.a: "เราทําอะไรไมไดมากนัก..."

 BBA_italy_interaction_events.18.t: "อิตาลียื่นขอเสนอใหเรา"
 BBA_italy_interaction_events.18.desc: "[ITA.GetNameDef]ไดยื่นขอเสนออันนาดึงดูดใจมายังเรา โดยเสนอกรรมสิทธิ์เหนือโรดสและหมูเกาะโดเดคะนีสแลกกับการเปนพันธมิตรกับพวกเขา ขอเสนอนี้แทบดูดีเกินจริง แตมันจริง เราจะทําอยางไรดี?"
 BBA_italy_interaction_events.18.a: "เราเขาใกลการรวมชาติกรีกไปอีกกาวหนึ่ง!"
 BBA_italy_interaction_events.18.b: "เราจะไมกมหัวใหชาวอิตาลี ไมวาจะมีเงื่อนไขใดก็ตาม!"

 BBA_italy_interaction_events.19.t: "[GRE.GetNameDef]ตอบรับขอเสนอของเรา"
 BBA_italy_interaction_events.19.desc: "รัฐบาลกรีซไดประกาศในวันนี้วาไดตอบรับขอเสนอของเรา และจะเริ่มความรวมมือทางทหารโดยเร็วที่สุด เพื่อแลกกับกรรมสิทธิ์เหนือหมูเกาะโดเดคะนีส เราจะไดเห็นกันวาสิ่งนี้จะนําเราไปสูจุดใด"
 BBA_italy_interaction_events.19.a: "และเราจะไดพันธมิตร"

 BBA_italy_interaction_events.20.t: "[GRE.GetNameDef]ปฏิเสธขอเสนอของเราอยางอกตัญู"
 BBA_italy_interaction_events.20.desc: "พวกกรีกผูทรยศไดปฏิเสธขอเสนอของเราที่จะขายหมูเกาะใหแลกกับการเปนพันธมิตร สิ่งนี้แสดงใหเห็นเพียงความไรความสามารถและความออนแอของรัฐบาลพวกเขา"
 BBA_italy_interaction_events.20.a: "ไมมีพวกเขาเราก็อยูไดดีกวา"

 BBA_italy_interaction_events.21.t: "อิตาลียื่นขอเสนอใหเรา"
 BBA_italy_interaction_events.21.desc: "[ITA.GetNameDef]ไดยื่นขอเสนออันนาดึงดูดใจมายังเรา โดยเสนอกรรมสิทธิ์เหนือโรดสและหมูเกาะโดเดคะนีสแลกกับการเปนพันธมิตรกับพวกเขา ขอเสนอนี้แทบดูดีเกินจริง แตมันจริง เราจะทําอยางไรดี?"
 BBA_italy_interaction_events.21.a: "เอาไปเลย กรีซ! เราไดกอน!"
 BBA_italy_interaction_events.21.b: "เราจะไมกมหัวใหชาวอิตาลี ไมวาจะมีเงื่อนไขใดก็ตาม!"

 BBA_italy_interaction_events.22.t: "[TUR.GetNameDef]ตอบรับขอเสนอของเรา"
 BBA_italy_interaction_events.22.desc: "รัฐบาลตุรกีไดประกาศในวันนี้วาไดตอบรับขอเสนอของเรา และจะเริ่มความรวมมือทางทหารโดยเร็วที่สุด เพื่อแลกกับกรรมสิทธิ์เหนือหมูเกาะโดเดคะนีส เราจะไดเห็นกันวาสิ่งนี้จะนําเราไปสูจุดใด"
 BBA_italy_interaction_events.22.a: "และเราจะไดพันธมิตร"

 BBA_italy_interaction_events.23.t: "[TUR.GetNameDef]ปฏิเสธขอเสนอของเราอยางอกตัญู"
 BBA_italy_interaction_events.23.desc: "พวกตุรกีผูทรยศไดปฏิเสธขอเสนอของเราที่จะขายหมูเกาะใหแลกกับการเปนพันธมิตร สิ่งนี้แสดงใหเห็นเพียงความไรความสามารถและความออนแอของรัฐบาลพวกเขา"
 BBA_italy_interaction_events.23.a: "ไมมีพวกเขาเราก็อยูไดดีกวา"

 BBA_italy_interaction_events.24.t: "เยอรมนีพยายามผนวกออสเตรีย"
 BBA_italy_interaction_events.24.desc: "รัฐเยอรมันอันชั่วรายกําลังพยายามแทรกแซงการเมืองออสเตรียและกลืนประเทศนี้เขาเปนสวนหนึ่งของตน เราเคยใหการรับประกันแกออสเตรียไว ประชาชนของเราจึงคาดหวังใหเรายืนหยัดตอตานเยอรมันเพื่อพวกเขา เราอาจขอความชวยเหลือจากอังกฤษและฝรั่งเศสไดดวย เราควรทําอยางไร?"
 BBA_italy_interaction_events.24.a: "เราจัดการพวกมันไดเองลําพัง!"
 BBA_italy_interaction_events.24.b: "ขอความชวยเหลือก็นาจะดี"
 BBA_italy_interaction_events.24.c: "เราทําอะไรไมได ถอนการรับประกันเสีย!"

 BBA_italy_interaction_events.25.t: "ชาวอิตาลียืนหยัดตอตานเรา"
 BBA_italy_interaction_events.25.desc: "กระทรวงกลาโหมอิตาลีไดออกคําเตือนถึงเราเกี่ยวกับความพยายามผนวกชาวออสเตรียเขากับประเทศของเรา โดยระบุวาหากเราเคลื่อนไหวตอออสเตรีย เราจะตองเผชิญมาตรการตอบโตอยางรุนแรงจากกองทัพอิตาลี เราควรตอบสนองตอการยั่วยุอยางโจงแจงนี้อยางไร?"
 BBA_italy_interaction_events.25.a: "พวกมันชักจะหลงตัวเองเกินไปแลว"
 BBA_italy_interaction_events.25.b: "เรารับมือการเผชิญหนาแบบนี้ไมไหว"

 BBA_italy_interaction_events_news.1.t: "เยอรมนียอมถอย"
 BBA_italy_interaction_events_news.1.desc: "สํานักขาวทั่วโลกไดรับรายงานผานกระทรวงกลาโหมอิตาลีวาเยอรมนีเลือกที่จะถอยหลังจากผลักดันการอางสิทธิ์เหนือดินแดนออสเตรีย นี่คือวันประวัติศาสตรของยุโรป และมีแตกาลเวลาเทานั้นที่จะบอกไดวารัฐเยอรมันที่แตกสลายจะเปนเชนไร"
 BBA_italy_interaction_events_news.1.a: "นาเสียดายที่ไมมีทางเลือกอื่น"
 BBA_italy_interaction_events_news.1.b: "นี่พิสูจนความออนแอที่ฝงอยูในระบบของเยอรมัน"

 BBA_italy_interaction_events.26.t: "[ITA.GetNameDef]ยอมถอย"
 BBA_italy_interaction_events.26.desc: "อิตาลีประกาศวาจะไมยืนหยัดตอตานเรา หลังจากไดรับการพิสูจนแลววาหากไมถอย เรื่องจะตองจบดวยกําลัง วันนี้เปนวันอันรุงโรจนของปตุภูมิ!"
 BBA_italy_interaction_events.26.a: "สิ่งนี้นาจะกระตุนใหชาว[AUS.GetAdjective]ทบทวนใหม"

 BBA_italy_interaction_events.27.t: "อิตาลีขอใหเราชวยปดลอมเยอรมนี"
 BBA_italy_interaction_events.27.desc: "[GetItalyAsksEngland]"
 BBA_italy_interaction_events.27.desc_hosting_ethiopia: "อิตาลีขอใหเราชวยปดลอมอํานาจขยายดินแดนของเยอรมนี และตองการใหเรารับประกันเอกราชของออสเตรียเพื่อชวยปกปองประเทศนั้น แมเราเคยตอสูเคียงบาเคียงไหลกันมากอน แตตอนนี้เรากําลังใหที่พักพิงแกรัฐบาลพลัดถิ่นของเอธิโอเปยซึ่งถูกชาวอิตาลีขับไลออกมา หาก[ITA.GetNameDef]ตองการความชวยเหลือจากเราในสงครามที่กําลังจะมาถึง พวกเขาตองยอมทําสันติภาพเสียกอน"
 BBA_italy_interaction_events.27.desc_standard: "เคยเกิดขึ้นมาแลวครั้งหนึ่งในมหาสงคราม แตบัดนี้อิตาลีกลับมาขอใหเราชวยปดลอมอํานาจขยายดินแดนของเยอรมนีอีกครั้ง พวกเขาตองการใหเรารับประกันเอกราชของออสเตรียเพื่อชวยปกปองประเทศนั้น เราจะดําเนินการอยางไร?"
 BBA_italy_interaction_events.27.a: "เอาละพวกเรา ลุยกันอีกรอบ"
 BBA_italy_interaction_events.27.b: "หากพวกเขาทําสันติภาพกับ[ETH.GetNameDef]"
 BBA_italy_interaction_events.27.c: "ไมมีทางหรอก ทําไมเราตองไปสนใจภาคพื้นทวีปดวย?"

 ITA_if_Italy_accepts_tt: "หาก §Y[ITA.GetName]§! ยอมรับ:"

 BBA_italy_interaction_events_news.2.t: "สหราชอาณาจักรรับประกันเอกราชของออสเตรีย"
 BBA_italy_interaction_events_news.2.desc: "รัฐบาลอังกฤษไดประกาศในวันนี้วาจะสนับสนุนเอกราชของออสเตรีย และยืนหยัดเคียงขางอิตาลีตอตานภัยคุกคามใดๆ ตออธิปไตยของประเทศนั้น"
 BBA_italy_interaction_events_news.2.a: "ยอดเยี่ยม"

 BBA_italy_interaction_events.28.t: "อิตาลีขอใหเราชวยปดลอมเยอรมนี"
 BBA_italy_interaction_events.28.desc: "เพื่อนบานทางตะวันออกเฉียงใตของเราไดขอใหเราชวยตานการโจมตีที่อาจเกิดขึ้นจากเยอรมนีตอรัฐออสเตรีย ซึ่งพวกเขากําลังรับประกันเอกราชอยู และขอใหเราทําเชนเดียวกัน เราจะตอบสนองอยางไร?"
 BBA_italy_interaction_events.28.a: "อุย เพื่อเสรีภาพ!"
 BBA_italy_interaction_events.28.b: "หากพวกเขาทําสันติภาพกับ[ETH.GetNameDefCap]"

 BBA_italy_interaction_events_news.3.t: "รัฐฝรั่งเศสรับประกันเอกราชของออสเตรีย"
 BBA_italy_interaction_events_news.3.desc: "ฝรั่งเศสไดตัดสินใจตามคําขอของอิตาลีที่จะสนับสนุนชาวออสเตรียในการตอสูเพื่อเอกราช และสัญญาวาจะโจมตีผูรุกรานใดๆ ที่อาจพยายามแทรกแซงอธิปไตยของประเทศนั้น"
 BBA_italy_interaction_events_news.3.a: "ไมคอยสมเปนฝรั่งเศสเลย..."

 BBA_italy_interaction_events.29.t: "อิตาลีกําลังพราก[802.GetName]ไปจากเรา!"
 BBA_italy_interaction_events.29.desc: "อิตาลีกําลังพยายามพราก[802.GetName]ไปจากเรา โดยผนวกเขากับราชอาณาจักรแอลเบเนียของตน หากเราไมทําอะไรเลย การอางสิทธิ์ของเราเหนือภูมิภาคนี้จะสูญไปตลอดกาล "
 BBA_italy_interaction_events.29.a: "เราทําอะไรเพื่อหยุดพวกเขาไมได"
 BBA_italy_interaction_events.29.b: "เราตองออกหางจากพวกเขา"

 BBA_italy_interaction_events.30.t: "อิตาลีเสนอ[45.GetName]แลกกับการรับประกันซึ่งกันและกัน"
 BBA_italy_interaction_events.30.desc: "[ITA.GetName]เสนอที่จะสนับสนุนการอางสิทธิ์ของเราเหนือ[45.GetName] แลกกับการรับประกันซึ่งกันและกันและสนธิสัญญาความรวมมือ ดูเหมือนเปนขอตกลงที่ดีสําหรับเรา เราควรตอบรับไหม?"
 BBA_italy_interaction_events.30.a: "ฟงดูดีมาก!"
 BBA_italy_interaction_events.30.b: "แลวทําไมเราตองไวใจคนอิตาลีดวย?"

 BBA_italy_interaction_events.31.t: "[NegotiatingItalianClaimsTitle]"
 BBA_italy_interaction_events.31.t_negotiate_claims: "[ITA.GetNameDefCap]ตองการเจรจาการอางสิทธิ์เหนือโซมาเลีย"
 BBA_italy_interaction_events.31.t_refused_peace: "[ETH.GetNameDefCap]ปฏิเสธการเจรจาสันติภาพ"
 BBA_italy_interaction_events.31.desc: "[GetRatifyStresaFrontEventDesc]"
 BBA_italy_interaction_events.31.desc_no_war: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม การจะลงนามนี้ พวกเขาเรียกรองใหยกดินแดน ซึ่งขณะนี้คือ[269.GetName]และ[903.GetName] เราควรตอบสนองอยางไร? อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.31.desc_peace_signed: "[ITA.GetNameDefCap]และ[ETH.GetNameDefCap]ไดวางความขัดแยงลงและลงนามในสนธิสัญญาสันติภาพ ซึ่งสวนสําคัญมาจากการทูตอันชาญฉลาดของเรา รัฐบาลอิตาลีไดเตือนเราถึงขอตกลงที่ทําไววาพวกเขาจะไดรับ[269.GetName]และ[903.GetName]เพื่อแลกกับการใหสัตยาบันแนวรวมสเตรซา"
 BBA_italy_interaction_events.31.desc_no_peace_deal: "แมเราจะยืนกรานในเรื่องนี้ แต [ETH.GetLeader] ผูอกตัญูกลับปฏิเสธที่จะเขารวมการเจรจาสันติภาพกับรัฐบาล[ITA.GetAdjective] โดยคิดวาตนไดเปรียบในสงคราม เราจึงไมมีทางเลือกนอกจากขับไลผูนําเอธิโอเปยออกจากประเทศของเรา เพื่อใหเรามุงความสนใจไปที่ขอเสนอของอิตาลี ซึ่งสอดคลองกับผลประโยชนของชาติเรามากกวา"
 BBA_italy_interaction_events.31.a: "ได ยกใหพวกเขาไป"
 BBA_italy_interaction_events.31.b: "ไมมีทางเด็ดขาด"

 BBA_italy_interaction_events.32.t: "[ITA.GetName]ตองการเจรจาการอางสิทธิ์เหนือจิบูตี"
 BBA_italy_interaction_events.32.desc: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม การจะลงนามนี้ พวกเขาเรียกรองใหยกดินแดน ไดแก[268.GetName] เราควรตอบสนองอยางไร? อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.32.a: "เพื่อสันติภาพ"
 BBA_italy_interaction_events.32.b: "ไม!"

 BBA_italy_interaction_events.33.t: "[ITA.GetName]ตองการเจรจาการอางสิทธิ์เหนือ[906.GetName]"
 BBA_italy_interaction_events.33.desc: "[GetItalyWantsSocotra]"
 BBA_italy_interaction_events.33.desc_first_negotiation: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม การจะลงนามนี้ พวกเขาเรียกรองใหยกดินแดน ไดแก[906.GetName] เราควรตอบสนองอยางไร? อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.33.desc_continued_negotiation: "ชาวอิตาลีกลับมาพรอมขอเรียกรองอีกขอ คราวนี้พวกเขาตองการกรรมสิทธิ์เหนือเกาะ[906.GetName] โดยระบุวาเพื่อใหควบคุมการไหลเวียนของสินคานําเขาและสงออกในแอฟริกาตะวันออกของอิตาลีไดงายขึ้น และควบคุมทางเขาทะเลแดงทางหนึ่ง ขณะที่เราควบคุมอีกทางหนึ่ง พวกเขาระบุวาหากเรายกให พวกเขาจะจายเงินตอบแทนใหเราชั่วคราว"
 BBA_italy_interaction_events.33.a: "ราคาเพียงเล็กนอยเพื่อแลกกับสันติภาพ"
 BBA_italy_interaction_events.33.b: "แลวทําไมพวกเขาถึงควรไดมันไปละ?"

 BBA_italy_interaction_events.34.t: "[ITA.GetName]ตองการเจรจาการอางสิทธิ์เหนือตูนิเซีย"
 BBA_italy_interaction_events.34.desc: "[GetItalyWantsTunisia]"
 BBA_italy_interaction_events.34.desc_first_negotiation: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม การจะลงนามนี้ พวกเขาเรียกรองใหยกดินแดน ไดแก[458.GetName]และ[665.GetName] เราควรตอบสนองอยางไร? อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.34.desc_continued_negotiation: "ชาวอิตาลีกลับมาพรอมขอเรียกรองอีกขอ คราวนี้พวกเขาตองการกรรมสิทธิ์เหนือ[458.GetName]และ[665.GetName] โดยระบุวาเพื่อใหไดสวนแบงในแอฟริกาเหนือที่ยุติธรรมขึ้นเมื่อเทียบกับเราและอังกฤษ พวกเขาระบุวาหากเรายกให พวกเขาจะจายเงินตอบแทนใหเราชั่วคราว"
 BBA_italy_interaction_events.34.a: "ตกลง"
 BBA_italy_interaction_events.34.b: "อุกอาจสิ้นดี"

 BBA_italy_interaction_events.35.t: "[ITA.GetName]ตองการเจรจาการอางสิทธิ์เหนือมอลตา"
 BBA_italy_interaction_events.35.desc: "[GetItalyWantsMalta]"
 BBA_italy_interaction_events.35.desc_first_negotiation: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม การจะลงนามนี้ พวกเขาเรียกรองใหยกดินแดน ไดแก[116.GetName] เราควรตอบสนองอยางไร? อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.35.desc_continued_negotiation: "ชาวอิตาลีกลับมาพรอมขอเรียกรองอีกขอ คราวนี้พวกเขาตองการกรรมสิทธิ์เหนือเกาะ[116.GetName] โดยระบุวาเพื่อใหควบคุมทะเลเมดิเตอรเรเนียนไดงายขึ้น พวกเขาระบุวาหากเรายกให พวกเขาจะจายเงินตอบแทนใหเราชั่วคราว"
 BBA_italy_interaction_events.35.a: "พวกเขาใชประโยชนจากมันไดดีกวา"
 BBA_italy_interaction_events.35.b: "ไรสาระสิ้นดี"

 BBA_italy_interaction_events.36.t: "[ITA.GetName]ตองการเจรจาการอางสิทธิ์เหนือคาบสมุทรบอลขาน"
 BBA_italy_interaction_events.36.desc: "[GetItalyClaimsBalkan]"
 BBA_italy_interaction_events.36.desc_first_negotiation: "วันนี้รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป พวกเขาตองการใหเรารับรองการอางสิทธิ์ของพวกเขาเหนือคาบสมุทรบอลขาน ซึ่งไมไดอยูในเขตผลประโยชนของเราจริงๆ รัฐบาลของเราจึงไมคอยอยากปฏิเสธนัก"
 BBA_italy_interaction_events.36.desc_continued_negotiation: "บัดนี้[ITA.GetName]มีคําขอสุดทายเพียงขอเดียวกอนจะลงนามกติกาได พวกเขาตองการใหเรารับรองการอางสิทธิ์ของพวกเขาเหนือคาบสมุทรบอลขาน ซึ่งไมไดอยูในเขตผลประโยชนของเราจริงๆ รัฐบาลของเราจึงไมคอยอยากปฏิเสธนัก"
 BBA_italy_interaction_events.36.a: "เถียงไปก็ไมมีประโยชน"

 BBA_italy_interaction_events.37.t: "การเจรจาดินแดนเสร็จสิ้น"
 BBA_italy_interaction_events.37.desc: "นักการทูตของเราทํางานอยางหนักในฝรั่งเศสและอังกฤษตลอดหลายสัปดาหที่ผานมา เพื่อรับประกันดินแดนที่อิตาลีจะไดรับในอนาคตอันใกล บัดนี้การเจรจาสิ้นสุดลงแลว และเอกสารก็ไดรับการลงนามเรียบรอย"
 BBA_italy_interaction_events.37.a: "ไมไดทุกอยางที่ตองการ แตเราจะรับไว"
 BBA_italy_interaction_events.37.b: "สเปลนดีโด!"

 BBA_italy_interaction_events.38.t: "การขึ้นสูอํานาจของพระสันตะปาปา"
 BBA_italy_interaction_events.38.desc: "เมื่ออํานาจของสันตะสํานักเหนือกวาสถาบันกษัตริยอิตาลี ผูสนับสนุนศาสนจักรคาทอลิกที่แรงกลาจํานวนมากไดออกมาเรียกรองในวันนี้ใหพระสันตะปาปาขึ้นเปนผูนําประเทศ พระองคไดทรงรับบทบาทที่ประชาชนมอบใหแลว และประกาศวาสิ่งที่เกิดขึ้นในวันนี้คือพระประสงคของพระเจาโดยแท สถาบันกษัตริยแทบไมอาจทําอะไรเพื่อหยุดยั้งพระองคไดอีกแลว"
 BBA_italy_interaction_events.38.a: "พระเจาทรงประสงคเชนนั้น!"

 BBA_italy_interaction_events.39.t: "การชําระเงินสําหรับอาณานิคมแอฟริกา"
 BBA_italy_interaction_events.39.desc: "ในที่สุดเราก็ชําระเงินงวดสุดทายสําหรับดินแดนใหมในแอฟริกาแลว ขอตกลงนี้ไดขยายดินแดนอาณานิคมของเรา รวมเปนหนึ่งและทําใหมั่นคง พรอมเสริมสถานะของเราที่นั่น โดยรวมแลว นี่เปนขอตกลงที่เปนประโยชนอยางยิ่งตอทุกฝาย"
 BBA_italy_interaction_events.39.a: "ยุคใหมเริ่มตนขึ้นแลว!"

 BBA_italy_interaction_events.40.t: "การใหสัตยาบันแนวรวมสเตรซา"
 BBA_italy_interaction_events.40.desc: "บัดนี้เมื่อการยกดินแดนไดรับการตัดสินแลว [ITA.GetName]ไดเริ่มกระบวนการที่จะนําอิตาลีและฝรั่งเศสเขาสูพันธมิตรทางทหารที่เรียกวาแนวรวมสเตรซา ตอนนี้ไมใชเวลานั่งดูเฉยๆ เพราะฝรั่งเศสตองทําเพื่อผลประโยชนสูงสุดของตนและเขารวมกับอิตาลีตอตานภัยคุกคามจากเยอรมนี"
 BBA_italy_interaction_events.40.a: "เงื่อนไขเปนที่ยอมรับได"
 BBA_italy_interaction_events.40.b: "ฝรั่งเศสจะไมมีวันยืนเคียงขางอิตาลี"
 stresa_front_ita: "แนวรวมสเตรซา"

 BBA_italy_interaction_events.41.t: "[FROM.GetName]เสนอใหความคุมครองแกเรา"
 BBA_italy_interaction_events.41.desc: "[FROM.GetLeader] ไดติดตอเราพรอมขอเสนอที่จะรับเราไวใตปก เพื่อปกปองเราจากมหาอํานาจตางชาติและภาวะแหงแลงทางเศรษฐกิจ อยางไรก็ตาม [FROM.GetName]ดูจะคอนขางเปนปฏิปกษ และนาจะบุกเราหากเราปฏิเสธขอเรียกรอง"
 BBA_italy_interaction_events.41.a: "ขอเสนอที่ดีเกินกวาจะปฏิเสธ"
 BBA_italy_interaction_events.41.b: "ประชาชนตองการเอกราช!"

 BBA_italy_interaction_events.42.t: "[FROM.GetName]ตอบรับขอเสนอของเรา"
 BBA_italy_interaction_events.42.desc: "ประเทศ[FROM.GetName]ไดตอบรับขอเสนอความคุมครองของเราอยางนอบนอม และกมหัวใหผูปกครองโดยชอบธรรมแหงทะเลเมดิเตอรเรเนียน วันนี้แสงสวางใหมสองลงบนไอบีเรียและ[ITA.GetNameDef]"
 BBA_italy_interaction_events.42.a: "ยอดเยี่ยม"

 BBA_italy_interaction_events.43.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
 BBA_italy_interaction_events.43.desc: "ประเทศ[FROM.GetName]ไดปฏิเสธขอเสนอความคุมครองของเราอยางหยาบคาย และเราจะแสดงใหพวกเขาเห็นวาการขัดขืนเรามีความหมายอยางไรอยางแทจริง พวกเขาจะตองกมหัวใหเรา!"
 BBA_italy_interaction_events.43.a: "พวกเขาจะตองเสียใจกับวันนี้!"

 BBA_italy_interaction_events.44.t: "[FROM.GetName]เชิญเราเขารวมพันธมิตร"
 BBA_italy_interaction_events.44.desc: "[FROM.GetLeader] ไดริเริ่มที่จะเปนพันธมิตรกับชาติตางๆ ในอเมริกาใต และรวมวัฒนธรรมละตินไวภายใตอํานาจเดียว ดูเหมือนเปนโอกาสดีที่จะไดรับการปกปองจาก[USA.GetNameDef] เราควรตอบสนองอยางไร?"
 BBA_italy_interaction_events.44.a: "ฟงดูดีสําหรับฉัน"
 BBA_italy_interaction_events.44.b: "ทําไมเราตองไปรวมกับพวกจักรวรรดินิยม?"

 BBA_italy_interaction_events.45.t: "[FROM.GetName]ตอบรับขอเสนอของเรา"
 BBA_italy_interaction_events.45.desc: "ประเทศ[FROM.GetName]ไดตอบรับขอเสนอเปนพันธมิตรของเราอยางนอบนอม และรวมกับเราตอสูกับศัตรูรวมกันเปนหนึ่งเดียว วันนี้แสงสวางใหมสองลงบนอเมริกาใตและ[ITA.GetNameDef]"
 BBA_italy_interaction_events.45.a: "เยี่ยม"

 BBA_italy_interaction_events.46.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
 BBA_italy_interaction_events.46.desc: "ประเทศ[FROM.GetName]ไดปฏิเสธขอเสนอเปนพันธมิตรของเราอยางหยาบคาย เราจึงตองอยูโดยไมมีพวกเขา พวกเขาจะตองโดดเดี่ยวอยูบนทวีปของตน"
 BBA_italy_interaction_events.46.a: "เราแทบเปลี่ยนใจพวกเขาไมได..."

 BBA_italy_interaction_events.50.t: "ขอเสนอจากอิตาลี"
 BBA_italy_interaction_events.50.desc: "รัฐบาลอิตาลีไดติดตอเรามาพรอมขอเสนอที่นาสนใจ พวกเขาบอกวาตองการใหสัตยาบันแนวรวมสเตรซา เพื่อรับประกันการสนับสนุนฝายเราหากเกิดสงครามขึ้นในยุโรป อยางไรก็ตาม พวกเขาเรียกรองใหยกดินแดน ซึ่งขณะนี้คือ[269.GetName]และ[903.GetName] และพวกเขากําลังทําสงครามกับ[ETH.GetName] ซึ่งรัฐบาลของประเทศนั้นเรากําลังใหที่พักพิงอยู อยางนอยพวกเขาจะจายเงินใหเราชั่วคราวหากเราตอบรับ"
 BBA_italy_interaction_events.50.a: "พวกเขาตองลงนามสนธิสัญญาสันติภาพกอน!"
 BBA_italy_interaction_events.50.b: "จะไมมีขอตกลงใดๆ กับพวกอาชญากรเหลานี้!"

 BBA_italy_interaction_events.51.t: "อังกฤษปฏิเสธการเจรจา"
 BBA_italy_interaction_events.51.desc: "ขอเสนออันสมเหตุสมผลของเราที่จะใหสัตยาบันแนวรวมสเตรซาแลกกับดินแดนอาณานิคมเล็กนอยจากอังกฤษ ไดรับการตอบโตดวยความดูแคลนอยางสิ้นเชิง พวกเขาคงรูสึกแข็งแกรงและมั่นใจจริงๆ ถึงกลาปฏิเสธแสนยานุภาพอันมหาศาลของเรา"
 BBA_italy_interaction_events.51.a: "พวกเขาจะตองเสียใจ!"

 BBA_italy_interaction_events.60.t: "[ITA.GetName]ลงนามสนธิสัญญาสันติภาพ"
 BBA_italy_interaction_events.60.desc: "อิตาลีไดลงนามสนธิสัญญาสันติภาพกับเอธิโอเปย โดยคืนดินแดนบางสวนที่ยึดมาได บัดนี้รัฐบาลอิตาลีกําลังขอใหเราปฏิบัติตามขอตกลงในสวนของเรา และรับประกันเอกราชของออสเตรียเมื่อเผชิญกับการขยายดินแดนของเยอรมนี"

 BBA_italy_interaction_events.70.t: "รอคําตอบ"
 BBA_italy_interaction_events.70.desc: "เราไดสงทูตไปพบผูนําของชาว[GetAdjective] เพื่อสอบถามวาพวกเขายินดีวางความขัดแยงลงและจัดตั้งรัฐบาลใหมภายใตการกํากับดูแลของอิตาลีหรือไม"
 BBA_italy_interaction_events.70.a: "เราจะรอ"
 BBA_italy_interaction_events.71.t: "ขอเสนอจากอิตาลี"
 BBA_italy_interaction_events.71.desc: "ทูตจาก[ITA.GetNameDef]ไดมาพบเรา สอบถามวาเรายินดีวางความขัดแยงลงและจัดตั้งรัฐบาลใหมภายใตการกํากับดูแลของอิตาลีหรือไม ทูตแจงเราวาพวกเขาจะดําเนินการจัดตั้งฝายบริหารชุดใหมในมาตุภูมิของเรา ไมวาเราจะรวมมือหรือไมก็ตาม หากเราปฏิเสธขอเสนอนี้ สวนอื่นของโลกจะมองขามเราและหันไปยอมรับฝายบริหารชุดใหมนี้แทน"
 BBA_italy_interaction_events.71.a: "เราทําอะไรไดไมมากนัก"
 ITA_create_puppet_tt: "§Y[ROOT.GetNameWithFlag]§! จะไดรับ§Yผังยุทธศาสตร§!ใหม"
 BBA_italy_interaction_events.71.b: "เรายังมีศักดิ์ศรี!"
 BBA_italy_interaction_events.72.t: "ชาว[FROM.GetAdjective]จากไป"
 BBA_italy_interaction_events.72.desc: "[FROM.GetLeader] ผูนําชาว[FROM.GetAdjective]พลัดถิ่น ไดแวะมาเยือนที่พํานักสวนตัวของ  [ROOT.GetLeader] อยางลับๆ เมื่อคืนนี้ เพื่อแจงอยางเงียบๆ ถึงการตัดสินใจรับขอเสนอของอิตาลีที่จะจัดตั้งรัฐบาลใหมภายใตระบอบของพวกเขา เขาขอบคุณในความเอื้อเฟอของเราในชวงเวลาอันยากลําบากนี้ แตบอกวาเขาตองคํานึงถึงสิ่งที่ดีที่สุดสําหรับประชาชนของเขา"
 BBA_italy_interaction_events.72.a: "พวกเขาตอตานมานานแลว"

 BBA_italy_interaction_events.666.t: "[454.GetName]หรือสงคราม"
 BBA_italy_interaction_events.666.desc: "สมเด็จพระสันตะปาปา [From.GetLeader] ทรงเรียกรองใหเราสงมอบรัฐ[454.GetName] ผูแทนของพระองคอางวาสถานศักดิ์สิทธิ์เชนนี้ควรอยูภายใตการปกครองของสันตะสํานักเทานั้น และการปฏิเสธขอเรียกรองนี้ถือเปนการนอกรีต การยอมทําตามจะชวยกระชับความสัมพันธกับ[FROM.GetName]อยางมาก แต[454.GetName]ตั้งอยู ณ ทางแยกระหวางยุโรป เอเชีย และแอฟริกา ทําใหเปนจุดยุทธศาสตรที่สําคัญยิ่งทั้งในปจจุบันและตลอดประวัติศาสตร"
 BBA_italy_interaction_events.666.a: "เราตองทําตามขอเรียกรองของสมเด็จพระสันตะปาปา..."
 BBA_italy_interaction_events.666.b: "ตาแกนั่นไปลงนรกไดเลย!"

 BBA_italy_interaction_events.667.t: "[FROM.GetName]สงมอบ[454.GetName]"
 BBA_italy_interaction_events.667.desc: "วันนี้ไมเพียงเปนวันยิ่งใหญของสันตะสํานัก แตยังเปนวันยิ่งใหญของคริสตศาสนจักรทั้งมวล! [FROM.GetLeader] ผูนํา[FROM.GetAdjective] ไดรับฟงคําขอของเราอยางชาญฉลาดและตกลงโอน[454.GetName]มาอยูใตการปกครองของเรา สิ่งนี้จะนําเสถียรภาพและความรุงเรืองมาสูภูมิภาค และอนาคตอันสดใสใหมสําหรับ[ROOT.GetName]"
 BBA_italy_interaction_events.667.a: "ขอพระเจาอวยพรผูนํา[FROM.GetAdjective]!"

 BBA_italy_interaction_events.668.t: "[FROM.GetName]ปฏิเสธขอเสนอของสมเด็จพระสันตะปาปา"
 BBA_italy_interaction_events.668.desc: "[FROM.GetLeader] หยิ่งยโสพอๆ กับที่โงเขลา! เขาปฏิเสธที่จะเห็นความสมเหตุสมผลในการสงมอบ[454.GetName]ใหแกเรา การทําตามขอเรียกรองของเราจะนําความมั่นคงและเสถียรภาพมาสูภูมิภาค แตการกระทําของเขาจะนําไปสูสงครามและความทุกขยากเทานั้น!"
 BBA_italy_interaction_events.668.a: "ชางเปนการลบหลูพระเจา!"

 BBA_italy_purge_the_party.1.t: "กวาดลางพรรคฟาสซิสตแหงชาติ"
 BBA_italy_purge_the_party.1.desc: "ยังมีพันธมิตรผูทรงอิทธิพลของมุสโสลินีที่ยังมีอํานาจ และพยายามโนมนาวผูคนใหคืนอํานาจแกดูเชคนเกา หากเราจะรักษาการควบคุมรัฐบาลไวได เราตองทําใหเปนเยี่ยงอยางและปลดพวกโงเหลานี้ออกจากตําแหนง"
 BBA_italy_purge_the_party.1.a: "กวาดลางที่ปรึกษา"
 BBA_italy_purge_the_party.1.b: "กวาดลางนายพล"
 BBA_italy_purge_the_party.1.c: "ไวชีวิตทุกคน"
 BBA_italy_purge_the_party.1.d: "กวาดลางทุกคน"
 ITA_characters_will_be_spared_tt: "§Yบุคคลตอไปนี้จะรอดพนจากการกวาดลาง:§!"
 
 BBA_italy_decide_the_fate_of_mussolini.1.t: "ชะตากรรมของมุสโสลินี"
 BBA_italy_decide_the_fate_of_mussolini.1.desc: "เมื่อจัดการการแยงชิงอํานาจภายในและกุมพรรคฟาสซิสตแหงชาติไดมั่นคงแลว ในที่สุดเราก็หันมาสนใจดูเชคนเกา มุสโสลินี ไดเสียที การดํารงอยูที่คอยคุกคามอยูตลอดเวลาของเขากําลังบอนทําลายสถานะของเรา และตองไดรับการจัดการ"
 BBA_italy_decide_the_fate_of_mussolini.1.a: "ใหเขาขึ้นศาล"
 BBA_italy_decide_the_fate_of_mussolini.1.b: "ประหารชีวิตเขา"
 BBA_italy_decide_the_fate_of_mussolini.1.c: "ลอบสังหารเขา"
 BBA_italy_decide_the_fate_of_mussolini.2.t: "การพิจารณาคดีมุสโสลินี"
 BBA_italy_decide_the_fate_of_mussolini.2.desc: "การพิจารณาคดีแหงศตวรรษกําลังจะเริ่มขึ้น โดยเบนิโต มุสโสลินีถูกกลาวหาหลายขอหา ทั้งการทุจริตและการกบฏ รวมถึงขอหาอื่นๆ การพิจารณาคดีเปนเพียงละครใหสาธารณชนดูเพื่อเคลือบความชอบธรรม แตในความเปนจริง ผลลัพธอยูในกํามือของเรา"
 BBA_italy_decide_the_fate_of_mussolini.2.a: "ตัดสินใหพนผิด"
 BBA_italy_decide_the_fate_of_mussolini.2.b: "ปลอยใหเขาเนาในคุก"
 BBA_italy_decide_the_fate_of_mussolini.3.t: "การเสียชีวิตของมุสโสลินี"
 BBA_italy_decide_the_fate_of_mussolini.3.desc: "แผนลอบสังหารอดีตดูเชกําลังดําเนินไป แตเราตองพิจารณาอยางรอบคอบวาประชาชนอิตาลีจะตอบสนองอยางไร คําถามคือเราจะบิดเรื่องนี้อยางไร?"
 BBA_italy_decide_the_fate_of_mussolini.3.a: "โยนความผิดใหคอมมิวนิสต!"
 BBA_italy_decide_the_fate_of_mussolini.3.b: "กุเรื่องปกปด"
 ITA_mussolini_stands_trial_tt: "ใหศาลยุติธรรมตัดสินชะตากรรมของเขา ตราบใดที่เราควบคุมศาลยุติธรรม"
 ITA_mussolini_is_assassinated_tt: "เราสามารถบิดเรื่องการตายของเขาใหเปนประโยชนตอเราได"
 ITA_mussolini_walks_free_tt: "มุสโสลินีพนผิดและใชชีวิตเปนพลเมืองอิสระได"

 BBA_italy_research_agreement.1.t: "[FROM.GetNameDefCap] เสนอโครงการความรวมมือทางทหาร"
 BBA_italy_research_agreement.1.desc: "ชาว[FROM.GetAdjective]เสนอโครงการวิจัยรวมเพื่อเสริมไมเพียงขีดความสามารถทางทหารของเรา แตยังกระชับสายสัมพันธระหวางประเทศของเราดวย สิ่งนี้จะทําใหเราแบงปนเทคโนโลยีและการวิจัยระหวางกันไดงายขึ้น และนําประเทศของเราใหใกลชิดกันยิ่งขึ้น"
 BBA_italy_research_agreement.1.a: "สิ่งนี้อาจเปนประโยชนตอเรา"
 BBA_italy_research_agreement.1.b: "เราไมตองการโครงการเชนนี้"
 BBA_italy_research_agreement.2.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอทางทหารของเรา"
 BBA_italy_research_agreement.2.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอความรวมมือทางทหารของเราอยางไมฉลาด โครงการรวมนี้จะเสริมขีดความสามารถทางทหารของทั้งสองชาติ แตดูเหมือนวาชาว[FROM.GetAdjective]จะไมสนใจขอตกลงเชนนี้ โชคดีที่เราไมตองการความชวยเหลือของพวกเขาเพื่อบรรลุเปาหมาย!"
 BBA_italy_research_agreement.2.a: "การตัดสินใจที่แย"

 BBA_italy_pact.1.t: "[FROM.GetNameDefCap] เสนอสนธิสัญญาไมรุกราน"
 BBA_italy_pact.1.desc: "ชาว[FROM.GetAdjective]พรอมจะเสนอปฏิญญารวมวาดวยมิตรภาพและความรวมมือระหวางประเทศของเรา สนธิสัญญาไมรุกรานกับพวกเขาจะทําใหพรมแดนของเรามั่นคงและปลดทรัพยากรไปใชที่อื่นได แมเราอาจไมไดไววางใจพวกเขานัก แตสิ่งนี้จะทําใหเรามีเวลาสะสมกําลัง"
 BBA_italy_pact.1.a: "สิ่งนี้เหมาะกับเราดี"
 BBA_italy_pact.1.b: "เราไวใจพวกเขาไมได!"
 BBA_italy_pact.2.t: "[FROM.GetNameDefCap] ปดตกกิ่งมะกอกของเรา"
 BBA_italy_pact.2.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอสนธิสัญญาไมรุกรานของเรา โดยเรียกขอตกลงนี้วาไมสุจริตและเอื้อประโยชนฝายเดียว เห็นไดชัดวาพวกเขาหลงผิดและไมเขาใจวาอะไรดีที่สุดสําหรับตนเอง"
 BBA_italy_pact.2.a: "พวกโง!"

 BBA_italy_recognize_the_empire.1.t: "รับรองจักรวรรดิอิตาลี"
 BBA_italy_recognize_the_empire.1.desc: "[FROM.GetLeader] ไดประกาศรุงอรุณแหงจักรวรรดิอิตาลี! แมเอกอัครราชทูตของเราประจํากรุงโรมจะแนะนําใหเราเพียงรับรองขอเท็จจริงนี้และปลอยใหชาว[FROM.GetAdjective]ฝนถึงความยิ่งใหญไป แตบางคนก็กังวลกับเหตุการณครั้งนี้ พวกเขาแยงวาการเอาใจชาว[FROM.GetAdjective]จะนําไปสูการยอมออนขอมากขึ้นเทานั้น และเราควรยับยั้งความฝนอันตรายถึงจักรวรรดิเชนนี้"
 BBA_italy_recognize_the_empire.1.a: "รับรองจักรวรรดิอิตาลี"
 BBA_italy_recognize_the_empire.1.b: "เพิกเฉยตอคําประกาศ"
 BBA_italy_recognize_the_empire.2.t: "การรับรองจักรวรรดิ"
 BBA_italy_recognize_the_empire.2.desc: "[FROM.GetNameDefCap]รับรองความทะเยอทะยานดานจักรวรรดิของเราอยางชาญฉลาด และมองเราเปนผูที่เทาเทียมกับพวกเขา อยางที่ควรจะเปน! เกียรติภูมิและความรุงโรจนของเรายังคงเติบโตตอไป"
 BBA_italy_recognize_the_empire.2.a: "แสนยานุภาพของเรากําลังเติบโต!"
 BBA_italy_recognize_the_empire.3.t: "การปฏิเสธจักรวรรดิ"
 BBA_italy_recognize_the_empire.3.desc: "[FROM.GetNameDefCap]เยยหยันความทะเยอทะยานดานจักรวรรดิของเราอยางโงเขลา โดยกลาววาความฝนและความเพอฝนเพียงอยางเดียวไมอาจสรางจักรวรรดิได พวกเขาตองชดใชความอวดดีเชนนี้! เราจะรอจังหวะไปกอนในตอนนี้ แตเราพรอมจะแสดงใหพวกหัวทึบเหลานั้นเห็นแสนยานุภาพที่แทจริงของจักรวรรดิอิตาลี"
 BBA_italy_recognize_the_empire.3.a: "พวกเขาจะตองเสียใจไปตลอดชีวิต...."

 BBA_italy_sends_military_support.1.t: "[FROM.GetNameDefCap] สงความชวยเหลือทางทหาร"
 BBA_italy_sends_military_support.1.desc: "ชาว[FROM.GetAdjective]ตองการสนับสนุนความพยายามในสงครามของเรา และไดสงยุทโธปกรณมาใหจํานวนหนึ่ง แมจะเปนการสงมาเพียงเล็กนอย แตความชวยเหลือใดๆ ก็เปนที่ยินดีรับ"
 BBA_italy_sends_military_support.1.a: "สิ่งนี้จะมีประโยชนแนนอน"

 BBA_italy_communist_events.01.t: "การนําของสาธารณรัฐ"
 BBA_italy_communist_events.01.desc: "เมื่อสาธารณรัฐที่เพิ่งกอตั้งของเราพนจากเงื้อมมือของพวกฟาสซิสตแลว ในที่สุดเราก็กําหนดเสนทางใหมใหประเทศได! สิ่งที่เราตองการตอนนี้คือผูนําที่มั่นคง ฉลาดหลักแหลมพอๆ กับที่ทุมเทใหแกอุดมการณของเรา ผูที่จะนําพาเราฝาชวงเวลาอันยากลําบากขางหนาโดยไมสั่นคลอนในศรัทธาตออนาคตที่สดใสกวา"
 BBA_italy_communist_events.01.a: "อันโตนิโอ กรัมชี คือผูนําโดยชอบธรรม"
 BBA_italy_communist_events.01.b: "เราควรเดินตามปลมีโร ตอลยัตตี"
 BBA_italy_communist_events.01.c: "ซันโดร แปรตีนี จะนําเรากาวไปขางหนา"
 BBA_italy_communist_events.02.t: "[FROM.GetAdjective]รองขอความชวยเหลือ"
 BBA_italy_communist_events.02.desc: "สหายของเราใน[FROM.GetName]ที่เพิ่งกอตั้งขึ้นไดรองขอความชวยเหลือจากเรา ประชาชน[FROM.GetAdjective]แตกแยกในสงครามกลางเมืองเพื่อสถาปนาการปกครองแบบคอมมิวนิสต และบัดนี้กําลังหันไปพึ่งรัฐบาลที่มีแนวคิดเดียวกัน เพื่อฟนฟูและปกปองสาธารณรัฐใหม"
 BBA_italy_communist_events.02.a: "เราจะสนับสนุนพวกเขา!"
 BBA_italy_communist_events.02.b: "ไมใชเรื่องที่ประชาชน[ROOT.GetAdjective]ตองกังวล"
 BBA_italy_communist_events.03.t: "การสนับสนุนจากนานาชาติแก[ROOT.GetNameDef]"
 BBA_italy_communist_events.03.desc: "รัฐบาลใน[FROM.GetName]ไดรับฟงเสียงเรียกรองการสนับสนุนจากสหายคอมมิวนิสตของเรา และตัดสินใจชวยเหลือเรา! สิ่งนี้จะไมเพียงกระชับสายสัมพันธกับพวกเขา แตยังเสริมขีดความสามารถในการปองกันของเรา เพื่อใหเราปกปองสาธารณรัฐอันเปนที่รักได"
 BBA_italy_communist_events.03.a: "เมื่อสามัคคีกัน เราจะไมมีวันพายแพ!"
 BBA_italy_communist_events.04.t: "ไมไดรับการสนับสนุนจากนานาชาติ"
 BBA_italy_communist_events.04.desc: "ไมมีใครตอบรับเสียงเรียกรองความชวยเหลือเลย! ดูเหมือนวาคอมมิวนิสตทั่วโลกไดทอดทิ้งเรา และไมคอยกระตือรือรนที่จะชวยสหายของตนเอง เราพึ่งไดแตตัวเองในโลกอันโหดรายนี้ แตการปฏิวัติของเราจะไดรับชัยชนะ!"
 BBA_italy_communist_events.04.a: "[ROOT.GetNameDefCap]จะไดรับชัยชนะไมวาอยางไร!"
 ITA_country_supports_new_italian_government_tt: "[FROM.GetNameDefCap]จะไดรับการสนับสนุนจากเราในรูปของ§Yยุทโธปกรณ§! และโบนัส§Yสินคาอุปโภคบริโภค§!ชั่วคราวเล็กนอย"
 ITA_international_support_arrives_tt: "เราจะไดรับประโยชนตอไปนี้จากสหายของเราในตางแดน: "
 ITA_international_support_consumer_goods_tt: "ไดรับ '§Y$ITA_international_aid$§!' ซึ่งให ($MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ITA_consumer_goods_from_leftist_aid|%]§!) เปนเวลา §Y730§! วัน"
 BBA_italy_communist_events.05.t: "ความรวมมือทางทหารกับกองทัพ[FROM.GetAdjective]"
 BBA_italy_communist_events.05.desc: "เราเพิ่งเสร็จสิ้นการฝกซอมรวมกับกองทัพ[FROM.GetAdjective] เหลานายพลและพลเรือเอกของเรายินดีรายงานวาประสบความสําเร็จอยางงดงาม และกองทัพของเราปฏิบัติการไดดีเยี่ยม สิ่งนี้จะกระชับสายสัมพันธกับ[FROM.GetName]และเสริมขีดความสามารถของเราเอง"
 BBA_italy_communist_events.05.a: "สิ่งนี้เสริมความแข็งแกรงให[ROOT.GetFactionName]!"
 BBA_italy_communist_events.06.t: "ขอเสนอความรวมมือจาก[FROM.GetAdjective]"
 BBA_italy_communist_events.06.desc: "สหายรวมรบของเราจาก[FROM.GetName]ไดเสนอใหจัดตั้งคณะกรรมาธิการใหญที่มีสมาชิกจากสเปนและประเทศอื่นๆ เพื่อขยายความรวมมือระหวางกัน พวกเขาแยงวาเราตองรวมกันตอตานทุนนิยมและฟาสซิสต เพื่อสักวันหนึ่งจะโคนลมพวกมันลงได"
 BBA_italy_communist_events.06.a: "เราจะยืนหยัดรวมกัน!"
 BBA_italy_communist_events.06.b: "กิจการของ[FROM.GetAdjective]ไมเกี่ยวกับเรา"
 BBA_italy_communist_events.07.t: "[FROM.GetName]ตอบรับขอเสนอของเรา"
 BBA_italy_communist_events.07.desc: "สหายของเราใน[FROM.GetName]ไดตกลงผนึกกําลังกับเราและจัดตั้งคณะกรรมาธิการใหญวาดวยความรวมมือ! เมื่อรวมมือกัน เราจะตานทานการโหมโจมตีของทุนนิยมและฟาสซิสตได และพลิกกระแสเพื่อนําการปฏิวัติอันรุงโรจนของเราไปสูทุกมุมโลก!"
 BBA_italy_communist_events.08.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
 BBA_italy_communist_events.08.desc: "ชาว[FROM.GetAdjective]ผูโงเขลาสายตาสั้นเกินกวาจะเห็นวาอะไรดีที่สุดสําหรับตนเอง! หากรวมมือกัน การตานทุนนิยมและฟาสซิสตคงงายกวานี้ แตเราจะประสบความสําเร็จอยูดี!"
 BBA_italy_communist_events.08.a: "พวกเขาไมไดคิดใหรอบคอบ..."
 BBA_italy_communist_events.09.t: "อันโตนิโอ กรัมชี หายปวยแลว"
 BBA_italy_communist_events.09.desc: "ในที่สุดอันโตนิโอ กรัมชี ก็หายจากอาการปวยหนักที่เขาไดรับระหวางถูกจองจําอยางไมเปนธรรม เขาพรอมจะชวยเหลืออุดมการณของเราในทุกทางที่ทําได ดวยความเชื่อมั่นและความแรงกลายิ่งกวาที่เคย!"
 BBA_italy_communist_events.09.a: "ฟนคืนดวยการมองโลกในแงดีแหงเจตจํานงของเขา"

 BBA_italy_democratic_events.01.t: "$BBA_italy_communist_events.01.t$"
 BBA_italy_democratic_events.01.desc: "เมื่อการตอสูดิ้นรนที่ผานมาอยูเบื้องหลังแลว ถึงเวลาที่จะรวมใจเปนหนึ่ง เยียวยาบาดแผล และเริ่มตนการเดินทางอันยาวไกลสูการฟนฟู ประชาธิปไตยของเรายังออนเยาวและเปราะบาง เราจึงตองการมือที่ทั้งแข็งแกรงและออนโยนเพื่อนําทางเราไปขางหนา"
 BBA_italy_democratic_events.01.a: "แฟรรุชโช ปารรี คือผูนําที่มีความสามารถที่สุด"
 BBA_italy_democratic_events.01.b: "ประสบการณของอีวาโนเอ โบโนมี มีคาเกินประมาณ"
 BBA_italy_democratic_events.02.t: "โครงการความรวมมือทางวิทยาศาสตรของอิตาลี"
 BBA_italy_democratic_events.02.desc: "[FROM.GetName]ไดเชิญเราเขารวมโครงการริเริ่มแบงปนการวิจัยใหมกับพวกเขา ซึ่งจะขยายและกระชับสายสัมพันธและความรวมมือระหวางประเทศของเรา"
 BBA_italy_democratic_events.02.a: "เปนการริเริ่มที่ยอดเยี่ยม!"
 BBA_italy_democratic_events.03.t: "มาเฟยอิตาลีกลับมาผงาดอีกครั้ง"
 BBA_italy_democratic_events.03.desc: "สงครามกลางเมืองกอใหเกิดการนองเลือดและความโศกเศรามากมาย และสั่นคลอนรากฐานของ[FROM.GetName] ความโกลาหลยังทิ้งสุญญากาศทางอํานาจไว ซึ่งบัดนี้กําลังถูกเติมเต็มโดยมาเฟยที่ฟนคืนชีพใน[?ROOT.ITA_mafia_epicenter_state.GetName] การปราบปรามมาเฟยอาจเปนสิ่งดีเพียงอยางเดียวที่พวกฟาสซิสตทําได"
 BBA_italy_democratic_events.03.a: "อีกปญหาที่ตองจัดการ"
 BBA_italy_democratic_events.05.t: "มาเฟยอิตาลีกําลังรุงเรือง"
 BBA_italy_democratic_events.05.desc: "โรคระบาดที่ชื่อมาเฟยกําลังลุกลาม! ความโกลาหลใน[FROM.GetName]เมื่อไมนานนี้เปนแหลงเพาะพันธุอาชญากรและพวกพอง และเมื่อขาดการปกครองทองถิ่นที่เขมแข็ง บุคคลไมพึงประสงคเหลานี้ก็เพิ่มจํานวนขึ้น พวกเขาฉวยโอกาสจากสุญญากาศทางอํานาจที่สงครามกลางเมืองทิ้งไว และกลับมาแผอํานาจไปทั่ว[FROM.GetName]อีกครั้ง"
 BBA_italy_democratic_events.05.a: "พวกมันคือสวะ!"
 generic_states_affected_tt: "\nรัฐที่ไดรับผลกระทบ:\n"
 generic_states_affected_no_prev_line_tt: "รัฐที่ไดรับผลกระทบ:\n"


 BBA_italy_anti_colonialism_events.01.t: "$ITA_the_ethiopian_question$"
 BBA_italy_anti_colonialism_events.01.desc: "เมื่อกิจการภายในของเราเรียบรอยแลว เราก็หันมามองภายนอกไดอีกครั้ง เราไดรับมรดกปญหามากมายจากพวกฟาสซิสต ซึ่งบัดนี้เราตองแกไข หนึ่งในคําถามสําคัญที่สุดคือเรื่องเอธิโอเปย มันเปนสงครามที่อยุติธรรมและโหดราย ซึ่งเริ่มโดยมุสโสลินีผูกระหายเกียรติภูมิไมรูจบ และเมื่อเขาจากไปแลว ก็ขึ้นอยูกับเราที่จะตัดสินชะตากรรมของเอธิโอเปย"
 BBA_italy_anti_colonialism_events.01.a: "เราตองยุติละครฉากนี้เสียที!"
 BBA_italy_anti_colonialism_events.01.b: "เราจะปลดปลอยกรรมกรแหงเอธิโอเปย!"
 BBA_italy_anti_colonialism_events.01.c: "เราตองผนวกรวมดินแดนเอธิโอเปย"
 BBA_italy_anti_colonialism_events.01.d: "เราควรลงทุนในเอธิโอเปยและประชาชนชาวเอธิโอเปย"
 BBA_italy_anti_colonialism_events.01.e: "เราจะคงสถานะเดิมไว"
