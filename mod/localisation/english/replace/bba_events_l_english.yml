 BBA_italy_anti_colonialism_events.100.t: "เจาหนาที่ [FROM.GetAdjective] ยื่นมือมาหาเรา"
 BBA_italy_anti_colonialism_events.100.desc: "เราไดรับคณะผูแทนจาก [FROM.GetName] ที่ตองการกระชับความสัมพันธกับเรา พวกเขาพูดถึงประวัติศาสตรรวมกันของเราอยางยืดยาว และวาเราจะแข็งแกรงขึ้นเพียงใดหากรวมกําลังกัน ไมตองสงสัยเลยวาพวกเขามองตนเองเปนผูนําของขอตกลงที่อาจเกิดขึ้นนี้ แมขอตกลงเชนนี้จะเปนประโยชนในบางดาน แตเราจะสูญเสียอํานาจปกครองตนเองทั้งหมด"
 BBA_italy_anti_colonialism_events.100.a: "ชาวแอลเบเนียและชาวอิตาลีจงรวมเปนหนึ่ง!"
 BBA_italy_anti_colonialism_events.100.b: "เราจะเดินตามรัฐบาลอิตาลีชุดใหม!"
 BBA_italy_anti_colonialism_events.100.c: "ไรสาระ!"
 BBA_italy_anti_colonialism_events.101.t: "[FROM.GetNameDefCap] ถูกผนวกรวมเขากับ [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.101.desc: "[FROM.GetLeader] ผูยิ่งใหญและปรีชาแหงประชาชนชาว [FROM.GetAdjective] ไดตกลงเขารวมกับเราและรวมเปนประเทศเดียวกัน! นี่คือวันสําคัญยิ่งสําหรับทั้ง [ROOT.GetName] และ [FROM.GetName]!"
 BBA_italy_anti_colonialism_events.101.a: "วิเศษไปเลย! (Meraviglioso!)"
 BBA_italy_anti_colonialism_events.102.t: "รัฐบาล [FROM.GetAdjective] แสวงหาความรวมมือ"
 BBA_italy_anti_colonialism_events.102.desc: "รัฐบาล [FROM.GetAdjective] เลือกอยางชาญฉลาดที่จะเขารวมกับเรา แมจะไมไดรวมเปนประเทศเดียวกัน แตก็ยอมรับการนําและการชี้แนะของ [ROOT.GetAdjective] แมจะไมใชผลลัพธที่เราหวังไว แตก็จะเสริมสถานะของเราในเมดิเตอรเรเนียนโดยไมตองหลั่งเลือด"
 BBA_italy_anti_colonialism_events.102.a: "อีกหนึ่งชัยชนะของชนชั้นกรรมาชีพ!"
 BBA_italy_anti_colonialism_events.103.t: "[FROM.GetLeader] ปฏิเสธเจาหนาที่ของเรา"
 BBA_italy_anti_colonialism_events.103.desc: "เห็นไดชัดวาประชาชนชาว [FROM.GetAdjective] ถูกปกครองโดยผูนําที่ไรปญญาและเห็นแกตัว [FROM.GetLeader] ไมยอมฟงเหตุผลและไมยอมรวมมือกับเรา ซึ่งจะเสริมความแข็งแกรงใหทั้งสองประเทศและรับประกันสันติภาพอันยั่งยืนระหวางประชาชนของเรา"
 BBA_italy_anti_colonialism_events.103.a: "ประชาชนชาว [FROM.GetAdjective] จะยอมรับเรื่องนี้หรือ?"
 BBA_italy_anti_colonialism_events.103.b: "วันเวลาของ [FROM.GetLeader] อาจใกลถึงจุดจบแลว"

 bba_news.107.t: "การสิ้นพระชนมของสมเด็จพระสันตะปาปา"
 bba_news.107.desc: "สมเด็จพระสันตะปาปาปอุสที่ 11 สิ้นพระชนมแลว หลังทรงนําคริสตจักรคาทอลิกมาเกือบ 20 ป ในสมัยที่ทรงดํารงตําแหนงพระสันตะปาปา ปอุสที่ 11 ทรงยุติความบาดหมางอันยาวนานระหวางสันตะสํานักกับรัฐบาลอิตาลี และทรงมีบทบาทสําคัญในการสถาปนานครรัฐวาติกันใหเปนรัฐเอกราชอีกครั้ง"
 bba_news.107.a: "จะตองมีการเลือกพระสันตะปาปาองคใหม"
 bba_news.107.b: "พระเจาทรงมีวิถีอันลึกลับ"
 ITA_pope_dies_tt: "§Y$ITA_papa_pio_xii$§! ขึ้นเปนพระสันตะปาปาองคใหม"

 bba_news.108.d: "นักการทูตจากรัฐบาลที่เพิ่งกอตั้งใหมในอิตาลีถูกสงไปเจรจากับกษัตริยซ็อก ผูปกครองแอลเบเนีย เพื่อกระชับความสัมพันธระหวางสองประเทศ และพยายามกดดันใหซ็อกใชนโยบายแบบสังคมนิยมในแอลเบเนียมากขึ้น \n\nไมวาจะเพราะรูสึกวาวันเวลาของราชวงศแอลเบเนียใกลถึงจุดจบ หรือเพียงเพราะความรังเกียจลัทธิสังคมนิยมลวน ๆ กษัตริยซ็อกปฏิเสธที่จะพูดคุยกับเจาหนาที่อิตาลี และเรียกรองใหประชาชนชาวแอลเบเนียตอตานแรงกดดันจาก [ITA.GetNameDef] \n\nอยางไรก็ดี ผูเชี่ยวชาญดานการทหารตางชาติเห็นพองกันวา [ALB.GetNameDef] แทบไมมีโอกาสตานทานการรุกรานได หากรัฐบาลอิตาลีลงมือ"
 bba_news.108.b: "ระบอบกษัตริยลาสมัยแลว!"

 bba_news.109.t: "[?ITA.ITA_var_deposed_leader.GetName] ถูกโคนอํานาจ"
 bba_news.109.desc: "ในการเคลื่อนไหวที่ไมเคยมีมากอน สภาใหญแหงฟาสซิสตของ [FROM.GetName] ไดยึดอํานาจ โคน [?ITA.ITA_var_deposed_leader.GetName] ลงจากตําแหนงและกักบริเวณเขาไวในบาน การกระทํานี้มีแรงจูงใจจากความพยายามกอบกูประเทศจากความลมเหลวทางทหารและความไรความสามารถของดูเช ซึ่งกอใหเกิดความตึงเครียดภายใน [FROM.GetName] และบางคนเกรงวาอาจนําไปสูสงครามกลางเมือง หากไมมีการดําเนินการเพื่อคลี่คลายสถานการณ"
 bba_news.109.a: "นาเปนหวง!"
 bba_news.109.b: "ยอดเยี่ยม!"

 bba_news.110.t: "[FROM.GetName] แตกแยกเขาสูสงครามกลางเมือง!"
 bba_news.110.desc: "[FROM.GetLeader] ผูนําคนใหมของ [FROM.GetName] ไมสามารถจัดการกับความตึงเครียดที่เพิ่มสูงขึ้นซึ่งแบงแยกชาว [FROM.GetAdjective] ในชวงที่ผานมาได จนนําไปสูการปะทุของสงครามกลางเมืองที่ฉีกประเทศออกเปนเสี่ยง ๆ จากภายใน กลุมตาง ๆ ตั้งแตคอมมิวนิสต ฝายนิยมเจา ไปจนถึงฝายประชาธิปไตย ตางแยงชิงอํานาจและสรางพันธมิตรที่เปลี่ยนแปลงไปมา ขณะที่ฝายฟาสซิสตก็มุงมั่นจะรักษาอํานาจของตนไว \n\nแมผลของสงครามกลางเมืองยังไมแนนอน แตความชวยเหลือจากภายนอกจะมีบทบาทสําคัญตอชัยชนะในอนาคตอยางแนนอน "
 bba_news.110.a: "ขาวรายจริง ๆ"
 bba_news.110.b: "เราตองทําใหสถานการณมีเสถียรภาพ!"
 bba_news.110.c: "นี่คือโอกาสของเรา!"

 bba_news.111.t: "การประกาศสถาปนาสมาพันธอนาธิปไตย"
 bba_news.111.desc: "[GetAnarchistConfederationEventDesc]"
 bba_news.111.desc_joint_proclamation: "[From.GetName] และ [SPC.GetName] ไดรวมกันประกาศสถาปนาสมาพันธอนาธิปไตย โดยใหคํามั่นวาจะชวยเหลือกันและเขาชวยเหลืออีกฝายหากถูกมหาอํานาจตางชาติโจมตี การประกาศรวมนี้ทําใหนักอนาธิปไตยหลายพันคนหลั่งไหลเขาสูอิตาลีเพื่อสนับสนุนการประกาศครั้งนี้"
 bba_news.111.desc_single_proclamation: "นักอนาธิปไตยนับพันนับหมื่นจากทั่วโลกกําลังหลั่งไหลเขาสู [FROM.GetName] หลังรัฐบาลประกาศสถาปนาสมาพันธอนาธิปไตย ในคําประกาศนั้น พวกเขาไดกลาวอยางกวางขวางถึงการบดขยี้ทุนนิยมและการกําจัดฟาสซิสตในทุกที่ที่ความชั่วรายเหลานี้ปรากฏ"
 bba_news.111.a: "คอยดูกันวาจะอยูไดนานแคไหน"

 bba_news.666.t: "สมเด็จพระสันตะปาปาขึ้นครองอํานาจ"
 bba_news.666.desc: "สมเด็จพระสันตะปาปา [FROM.GetLeader] สรางความตกตะลึงแกผูนําทั่วโลกดวยการโคนกษัตริย [?ITA.ITA_var_deposed_leader.GetName] แหง [FROM.GetName] และขึ้นครองอํานาจเสียเอง โดยอางวาเปนพระประสงคของพระเจา แมชาวอิตาลีจํานวนมากจะตกตะลึงเชนกัน แตสันตะสํานักไดรับการสนับสนุนอยางกวางขวางในประเทศ และบางคนก็ยกยองการเปลี่ยนแปลงรัฐบาลอยางกะทันหันนี้วาเปนจุดเริ่มตนของยุคใหมอันรุงโรจนของ [FROM.GetNameDefCap]"
 bba_news.666.a: "ไมคาดคิดเลยจริง ๆ"

 bba_news.200.t: "ฮิตเลอรเสียชีวิต"
 bba_news.200.desc: "วิทยุ [GER.GetAdjective] ไดออกอากาศขาววาทานผูนํา อดอลฟ ฮิตเลอร ไดเสียชีวิตแลว ขาวนี้มีขึ้นหลังการสูรบอยางหนักใน [GER.Capital.GetCapitalVictoryPointName] และการรุกคืบเขาสูใจกลางดินแดน [GER.GetAdjective] ของกองกําลังสัมพันธมิตรและ [SOV.GetAdjective] ขาวนี้ประกาศโดย [GER.GetLeader] ซึ่งวากันวาเปนผูสืบทอดที่ทานผูนําเลือกไว เขาแสดงความโศกเศราของชาติตอการสูญเสียฮิตเลอร และเลารายละเอียดการเสียชีวิตของฮิตเลอรที่กองบัญชาการซึ่งเขากําลังบัญชาการปองกันประเทศอยู ทั้งการเสียชีวิตของฮิตเลอรและลักษณะการเสียชีวิตที่อางถึงไมสามารถพิสูจนได อยางไรก็ตาม ประกาศนี้ยอมสงผลตอขวัญกําลังใจของประชาชนชาว [GER.GetAdjective] อยางแนนอน "
 bba_news.200.a: "ชาว [GER.GetAdjective] จะยังสูตอไปหรือไม?"
 bba_news.200.b: "ไอสารเลวนั่นตายแลวหรือ? นาเสียดายที่เราจับตัวเปน ๆ ไมได!"
 bba_news.200.c: "เราแนใจไดหรือวาเขาตายจริง?"
 bba_news.200.d: "สิ่งนี้ไมเปลี่ยนแปลงอะไร เราจะสูจนคนสุดทาย"

 bba_news.201.t: "รัฐบาล [POL.GetAdjective] ฝกใฝ [SOV.GetNameDef]"
 bba_news.201.desc: "แมจะมีรัฐบาล [POL.GetAdjective] พลัดถิ่นที่ดําเนินงานจากลอนดอนระหวางสงคราม แตฝายสัมพันธมิตรกลับเลือกรับรองกลุมคอมมิวนิสตที่ [SOV.GetAdjective] ปนขึ้นใหเปนรัฐบาลอันชอบธรรมของ [POL.GetName] แหลงขาวทางการทูตระบุวามีการตกลงกันระหวางฝายสัมพันธมิตรกับ [SOV.GetName] เรื่องการแบงยุโรปหลังสงครามออกเปนเขตอิทธิพล นาเสียดายสําหรับรัฐบาล [POL.GetAdjective] ในลอนดอน อุปสรรคสําคัญตอการบรรลุขอตกลงกับ [SOV.GetAdjective] ก็คือความตองการของ [SOV.GetLeader] ที่จะใหโปแลนดอยูในเขตอิทธิพลของ [SOV.GetAdjective]\n\nแมหลายคนจะมองวานี่คือการทรยศตอ [POL.GetName] แตบางคนก็แยงวาในเมื่อกองกําลัง [SOV.GetAdjective] ยึดครองประเทศอยูแลว ก็แทบไมมีเหตุผลที่จะปฏิเสธคําขาดของพวกเขาและเสี่ยงตอเสถียรภาพในอนาคตของยุโรป"
 bba_news.201.a: "การเสียสละอันนาเสียดายเพื่อสันติภาพในอนาคต"
 bba_news.201.b: "ไวใจฝายสัมพันธมิตรไมได"
 bba_news.201.c: "เราจะไมยอมปลอยใหตนเองตกอยูในภาวะเปราะบางตอการรุกรานของฟาสซิสตจากยุโรปอีกตอไป"

 ###ITALYS NEWS EVENTS####
 #PURGE THE PARTY
 bba_news.100.t: "[GetPurgeEventTitles]"
 bba_news.100.a: "[GetPurgeEventOptions]"
 bba_news.100.t_some_purged: "การกวาดลางพรรคชาติฟาสซิสต (Partito Nazionale Fascista)"
 bba_news.100.desc_some_purged: "ผูสนับสนุนใกลชิดที่สุดบางคนของมุสโสลินีถูกขับออกจากพรรคฟาสซิสต ขณะที่ [ROOT.GetLeader] กระชับอํานาจเหนือพรรค การกวาดลางไมรุนแรงอยางที่บางคนเกรงกลัว แตทําให [ROOT.GetLeader] อยูในสถานะที่แข็งแกรงขึ้นในการผลักดันวาระของตนเองสําหรับอิตาลี"
 bba_news.100.a_some_purged: "ไปเสียไดก็ดี"
 bba_news.100.t_many_purged: "การกวาดลางครั้งใหญในพรรคชาติฟาสซิสต (Partito Nazionale Fascista)"
 bba_news.100.desc_many_purged: "สมาชิกระดับสูงหลายคนของพรรคฟาสซิสตถูกปลดออกจากอํานาจเมื่อเร็ว ๆ นี้ ขณะที่ [Root.GetLeader] กาวขึ้นเปนผูนําเบ็ดเสร็จของ [ROOT.GetNameDefCap] การกวาดลางครั้งนี้กําจัดพันธมิตรที่อาจมีของอดีตดูเช เบนิโต มุสโสลินี และความหวังใด ๆ ที่เขาจะกลับมาเปนผูนําอิตาลีอีกครั้ง"
 bba_news.100.a_many_purged: "การแสดงแสนยานุภาพ"
 bba_news.100.t_none_purged: "การกวาดลางที่ไมเคยเกิดขึ้น"
 bba_news.100.desc_none_purged: "ชวงนี้มีขาวลือหนาหูเรื่องการกวาดลางครั้งใหญเพื่อขับสมาชิกที่ภักดีตอมุสโสลินีออกจากพรรคชาติฟาสซิสต (Partito Nazionale Fascista) แตดูเหมือนจะมีการนิรโทษกรรมทั่วทั้งพรรคแทน สิ่งนี้อาจทําใหพรรคแข็งแกรงขึ้น แตก็ทําใหสถานะผูนําพรรคของ [ROOT.GetLeader] ออนแอลง"
 bba_news.100.a_none_purged: "[ROOT.GetLeader] ผูเปยมเมตตา... ฟงดูไพเราะดีนะ"
 #FATE OF MUSSOLINI
 bba_news.101.t: "เบนิโต มุสโสลินี อดีตผูนําอิตาลีถูกประหารชีวิต"
 bba_news.101.desc: "หลังถูกโคนจากอํานาจในอิตาลี เบนิโต มุสโสลินี ถูกกักบริเวณในบานในขอหาไรความสามารถอยางรายแรงและกบฏโดยการละเวน รอคอยชะตากรรมซึ่งในที่สุดก็มาถึง เชาตรูวันนี้ อดีตผูนําอิตาลีถูกยิงเปาตอหนาผูแทนรัฐบาลกลุมเล็ก ๆ และถูกฝงในวันเดียวกันในพิธีสวนตัวที่มีเพียงครอบครัวใกลชิดเขารวม"
 bba_news.101.a: "และนี่คือจุดจบของชีวิตมุสโสลินี"
 bba_news.102.t: "[GetTrialOfMussoliniTitles]"
 bba_news.102.t_innocent: "มุสโสลินีพนผิดทุกขอกลาวหา"
 bba_news.102.t_guilty: "มุสโสลินีถูกตัดสินจําคุก"
 bba_news.102.desc: "[GetTrialOfMussoliniDesc]"
 bba_news.102.desc_innocent: "สรางความประหลาดใจแกทุกคน อดีตดูเชถูกตัดสินวาบริสุทธิ์ในทุกขอกลาวหาและพนผิดทั้งหมด บัดนี้มุสโสลินีมีอิสระที่จะใชชีวิตที่เหลือในฐานะพลเมืองเสรีของ [ROOT.GetNameDefCap] แมเขายังไมเปดเผยแผนการใด ๆ แตก็ไมอาจมองขามอิทธิพลที่อดีตดูเชยังมีตอจิตใจของผูคนจํานวนมากได"
 bba_news.102.desc_guilty: "อาจไมมีใครแปลกใจนัก อดีตผูนําอิตาลีถูกตัดสินวามีความผิดทุกขอกลาวหา อดีตดูเชใหการปฏิเสธ แตถูกพิพากษาจําคุกตลอดชีวิต เดาไดวาระบอบใหมคงมีอิทธิพลตอการพิจารณาคดีและคงพอใจกับผลลัพธไมนอย"
 bba_news.102.a: "การพิจารณาคดีจอมปลอม"
 bba_news.103.t: "[GetAssassinationOfMussoliniTitles]"
 bba_news.103.t_communists: "มุสโสลินีถูกคอมมิวนิสตสังหาร!"
 bba_news.103.t_coverstory: "มุสโสลินีถูกสังหารระหวางพยายามหลบหนี!"
 bba_news.103.desc: "[GetAssassinationOfMussoliniDesc]"
 bba_news.103.desc_communists: "เบนิโต มุสโสลินี อดีตผูนําของ [FROM.GetNameDefCap] ถูกพบเปนศพ ดูเหมือนจะถูกคอมมิวนิสตประหาร ระบอบใหมภายใต [FROM.GetLeader] ลงมืออยางรวดเร็วโดยกวาดจับผูเห็นใจคอมมิวนิสตหลายราย ขณะที่บรรยากาศอันคุกรุนปกคลุมทั่วประเทศ ผูคนจํานวนมากเรียกรองความยุติธรรมและการแกแคนตอผูที่ถูกมองวาเปนศัตรู"
 bba_news.103.desc_coverstory: "เบนิโต มุสโสลินี อดีตผูนําของ [FROM.GetNameDefCap] พยายามหลบหนีจากการกักบริเวณในบานซึ่งเขาถูกควบคุมตัวไวหลังถูกโคนจากอํานาจ ชายติดอาวุธกลุมหนึ่งบุกเขาไปในที่พักของมุสโสลินีและเกิดการยิงตอสูขึ้น ทามกลางความชุลมุน มุสโสลินีถูกยิงและเสียชีวิตจากบาดแผล"
 bba_news.103.a: "เละเทะนองเลือดจริง ๆ"

 bba_news.104.t: "ประกาศโครงการทางทหารใหม"
 bba_news.104.desc: "[ROOT.GetNameDefCap] ลงนามโครงการความรวมมือกับ [FROM.GetNameDefCap] เพื่อเสริมขีดความสามารถทางทหารของทั้งสองชาติ ขอตกลงนี้จะชวยใหทั้งสองประเทศแบงปนเทคโนโลยีและการวิจัยไดงายขึ้น และจะกระชับสายสัมพันธระหวางกันอยางแนนอน"
 bba_news.104.a: "ทุกอยางเปนไปตามแผน"
 bba_news.105.t: "ลงนามสนธิสัญญาไมรุกรานฉบับใหม"
 bba_news.105.desc: "[ROOT.GetNameDefCap] และ [FROM.GetNameDefCap] ไดลงนามในสนธิสัญญาไมรุกราน รับประกันสันติภาพระหวางสองชาติ ซึ่งจะทําใหทั้งคูมีอิสระที่จะมุงความสนใจไปที่อื่น แตทุกคนตางสงสัยวาสนธิสัญญาอันเปราะบางนี้จะอยูไดนานเพียงใด"
 bba_news.105.a: "การตัดสินใจที่ชาญฉลาด"

 bba_news.106.t: "[GetVittorioDiesEventTitles]"
 bba_news.106.t_king: "กษัตริยแหงอิตาลีสวรรคต"
 bba_news.106.t_emperor: "จักรพรรดิแหงอิตาลีสวรรคต"
 bba_news.106.desc: "[GetVittorioDiesEventDesc]"
 bba_news.106.desc_king: "พระเจาวิตตอรีโอ เอมานูเอเลที่ 3 กษัตริยชราแหง [FROM.GetName] สวรรคตแลว พระองคทรงนําอิตาลีผานสงครามโลกสองครั้ง และทรงเปนสัญลักษณแหงเสถียรภาพและศูนยรวมใจของชาว [FROM.GetAdjective] ในยามยากลําบาก ประชาชนผูโศกเศราพากันออกมาตามทองถนนเพื่อแสดงความซาบซึ้งและความภักดีตอกษัตริยผูลวงลับ \n\n ชาติหวังวาเจาชายอุมแบรโต รัชทายาทและผูสืบราชสมบัติเพียงพระองคเดียวของกษัตริยชรา จะทรงเปนหลักยึดที่มั่นคงสําหรับประชาชนชาว [FROM.GetAdjective] เชนเดียวกัน อีกไมนานเจาชายจะทรงไดรับการราชาภิเษกเปนพระเจาอุมแบรโตที่ 2 - ขอพระองคทรงพระเจริญยิ่งยืนนาน!"
 bba_news.106.desc_emperor: "พระเจาวิตตอรีโอ เอมานูเอเลที่ 3 จักรพรรดิชราแหง [FROM.GetName] สวรรคตแลว พระองคทรงนําอิตาลีผานสงครามโลกสองครั้ง และทรงเปนสัญลักษณแหงเสถียรภาพและศูนยรวมใจของชาว [FROM.GetAdjective] ในยามยากลําบาก ประชาชนผูโศกเศราพากันออกมาตามทองถนนเพื่อแสดงความซาบซึ้งและความภักดีตอจักรพรรดิผูลวงลับ \n\n ชาติหวังวาเจาชายอุมแบรโต รัชทายาทและผูสืบราชสมบัติเพียงพระองคเดียวของจักรพรรดิชรา จะทรงเปนหลักยึดที่มั่นคงสําหรับประชาชนชาว [FROM.GetAdjective] เชนเดียวกัน อีกไมนานเจาชายจะทรงไดรับการราชาภิเษกเปนจักรพรรดิอุมแบรโตที่ 1 แหง [FROM.GetName] - ขอพระองคทรงพระเจริญยิ่งยืนนาน!"
 bba_news.106.a: "สิ้นสุดยุคสมัย"

 bba_italian_formables_news.1.t: "อิตาเลียอิรเรเดนตาบรรลุผลแลว"
 bba_italian_formables_news.1.desc: "วันนี้ [ITA.GetLeader] ผูนําอิตาลีไดประกาศเริ่มกระบวนการผนวกดินแดนที่ฝายอิรเรเดนติสตชาวอิตาลีอางสิทธิ์เขาเปนสวนหนึ่งของรัฐอิตาลี เขาประกาศวาสิ่งนี้จะเสริมสถานะของอิตาลีในฐานะมหาอํานาจโลก และรวมชาวอิตาลีไวใตธงผืนเดียวในที่สุด หลายคนตั้งคําถามวาชาติที่กวางใหญถึงเพียงนี้จะรวมกันอยูไดจริงหรือ และมีเพียงกาลเวลาเทานั้นที่รูวาอนาคตของอิตาลีจะเปนอยางไร"
 bba_italian_formables_news.1.a: "เราคือเจาแหงยุโรปคนใหม!"
 bba_italian_formables_news.1.b: "ชาติเชนนี้ยอมลมสลายในที่สุด"



##########################################################################
###############       Switzerland       ##################################
##########################################################################

 #Triggered by focus "Swiss Guiding Principles" 
 BBA_switzerland.1.t: "หลักการชี้นําของ[ROOT.GetAdjective]"
 BBA_switzerland.1.desc: "สถานการณทางการเมืองทั้งภายในและรอบ ๆ [ROOT.GetNameDefCap] กําลังทรุดลงอยางรวดเร็ว มีกระแสเคลื่อนไหวที่เติบโตขึ้นเรื่อย ๆ ซึ่งเรียกรองหลักการชี้นําเพื่อนําพานาวาไปในทิศทางที่ถูกตองทามกลางพายุที่กําลังจะมาถึง แตคําถามคือ หลักการใด?. \n\n เราไมรูวาเพื่อนบานจะทําอะไร แตเราตองตัดสินใจเดี๋ยวนี้วาแนวทางใดจะทําให [ROOT.GetName] อยูรอดได"
 BBA_switzerland.1.a: "เราตองปกปองคุณคาแหงประชาธิปไตยและความเปนกลางของเรา"
 BBA_switzerland.1.b: "บางทีเราควรปกปองประชาธิปไตยของเราอยางแข็งขันกวานี้"
 BBA_switzerland.1.c: "ความเปนกลางไมอาจดํารงอยูไดในสถานการณเชนนี้"
 

### David Frankfurter Case ###

#Assassination 
 BBA_switzerland.2.t: "ผูแทนพรรคนาซีในสวิตเซอรแลนดถูกลอบสังหาร"
 BBA_switzerland.2.desc: "ดาวิด ฟรังคฟวรเทอร ชาวโครแอตเชื้อสายยิวที่อาศัยอยูในเบิรน ไดเขามอบตัวตอตํารวจเกราบึนเดินและสารภาพวาเปนผูลอบสังหารวิลเฮลม กุสทลอฟฟ ผูนําองคการตางประเทศของพรรคนาซีในสวิตเซอรแลนด \n\nเขาอางถึงความเชื่ออันเปนภัยของพรรคนาซีตอชาวยิว และบทบาทของกุสทลอฟฟในการเผยแพรความเชื่อนั้นใน [SWI.GetName] วาเปนเหตุผลของการยิงครั้งนี้ \n\nวิธีที่เราเลือกจัดการกับปญหาที่อาจยืดเยื้อนี้ จะถูก [GER.GetNameDef] และชาวโลกใชเปนมาตรวัดความยึดมั่นในความเปนกลางและหลักนิติธรรมของเรา"
 BBA_switzerland.2.a: "เขาจะไดรับการพิจารณาคดีอยางเปนธรรม"
 BBA_switzerland.2.b: "ปกปดทุกอยาง แลวเกณฑเขามาเปนสายลับ!"
 BBA_switzerland.2.c: "เขาสารภาพแลว ก็ควรไดรับโทษสูงสุดทันที"

#Trial Approaches
 BBA_switzerland.3.t: "การพิจารณาคดีดาวิด ฟรังคฟวรเทอรใกลเขามา"
 BBA_switzerland.3.desc: "การพิจารณาคดีของดาวิด ฟรังคฟวรเทอร ผูลอบสังหารผูแทนพรรคนาซีในดาโวสเมื่อเดือนกุมภาพันธ ใกลเขามาแลว เราไดสัญญาวาเขาจะไดรับการพิจารณาคดีที่เปนธรรมและเปนกลาง แตก็ยังมีทางเลือกอื่นอยูแนนอน \n\nเราอาจแอบปลอยตัวเขาและเกณฑเขาเขารวมปฏิบัติการขาวกรอง หรือเราอาจพยายามเอาใจ [?SWI.SWI_fascist_germany.GetNameDef] ดวยการยกเลิกการพิจารณาคดีและพิพากษาเขาทันที \n\nไมวาเราจะทําอยางไร การทําใหทุกฝายพอใจอาจเกินกําลังของเรา"
 BBA_switzerland.3.a: "การพิจารณาคดีจะดําเนินตอไปตามแผน"
 BBA_switzerland.3.b: "เขาจะเปนกําลังสําคัญในงานขาวกรองของเรา"
 BBA_switzerland.3.c: "คิดอีกที เขาผิดชัด ๆ"

#Germany thanks Switzerland for swift action
 BBA_switzerland.4.t: "[?SWI.SWI_fascist_germany.GetLeader] พอใจกับการตัดสินใจของ [SWI.GetName]"
 BBA_switzerland.4.desc: "[?SWI.SWI_fascist_germany.Getleader] ผูนําของ [?SWI.SWI_fascist_germany.GetNameDef] ไดแสดงความขอบคุณของ [?SWI.SWI_fascist_germany.Getleader.GetHerHis] ตอ [SWI.GetNameDef] ที่จัดการกับฆาตกรผูสังหารวิลเฮลม กุสทลอฟฟอยางรวดเร็ว จึงไมมีขอสงสัยวา [SWI.GetName] ยืนอยูฝายใดในเรื่องเชนนี้ การละเลยสิทธิมนุษยชนและคุณคาประชาธิปไตยเชนนี้ยอมทําใหทาทีของ [?SWI.SWI_fascist_germany.GetName] ตอเราดีขึ้นอยางแนนอน \n\nแม [?SWI.SWI_fascist_germany.Getleader.GetHerHis] จะกลาวในเชิงบวก แตก็ชัดเจนวาผลลัพธในอุดมคติของพรรคนาซีคือการสงตัวผูรายขามแดนไปยัง [?SWI.SWI_fascist_germany.GetNameDef] แมวาในตอนนี้ เรื่องนั้นจะเปนไปไมไดสําหรับ [SWI.GetNameDef] ก็ตาม"
 BBA_switzerland.4.a: "เรื่องจบไปแลว"

 #Germany is notified Switzerland decides to continue with the trial. 
 BBA_switzerland.5.t: "[SWI.GetName] ตัดสินใจเดินหนาพิจารณาคดีฆาตกรผูสังหารกุสทลอฟฟ"
 BBA_switzerland.5.desc: "ทางการ [SWI.GetName] ประกาศวาดาวิด ฟรังคฟวรเทอร ผูสารภาพวาสังหารผูนําองคการตางประเทศของพรรคนาซีในดาโวส จะไดรับการพิจารณาคดีอยางเปนธรรมและสมดุลภายใตกฎหมายของเกราบึนเดิน เชนเดียวกับคดีฆาตกรรมทั่วไป\n\nเมื่อพิจารณาวากุสทลอฟฟเปนเจาหนาที่ของพรรคนาซี ประกอบกับอิทธิพลที่เรามีตอเพื่อนบานผูไรทางสูรายนี้ เราอาจสงทนายความไปเปนตัวแทนของภรรยามายของกุสทลอฟฟและผลักดันผลลัพธที่เราตองการ ดวยวิธีนี้ เราจะมั่นใจไดวาเขาจะไดรับโทษที่สาสมกับความผิด \n\nหากพูดกันตามความเปนจริง สิ่งนี้ยังอาจบีบให [SWI.GetNameDef] ตองเลือกขาง และทลายฉากหนาความเปนกลางอันเปราะบางที่พวกเขาชอบโออวดนักหนาลงเสียที"
 BBA_switzerland.5.a: "เธอสมควรไดรับความยุติธรรมจากอาชญากรรมอันชั่วชานี้!"
 BBA_switzerland.5.b: "ไมจําเปนตองแทรกแซงกิจการของ [SWI.GetAdjective]"

 #Germany INSISTS on harsher trial  
 BBA_switzerland.6.t: "[GER.GetAdjective] กดดันใหลงโทษดาวิด ฟรังคฟวรเทอรอยางหนัก"
 BBA_switzerland.6.desc: "ผูแทนทางกฎหมายของภรรยามายของกุสทลอฟฟ ซึ่งไมตองสงสัยเลยวาถูกสงมาโดย [?SWI.SWI_fascist_germany.GetNameDef] กําลังพยายามผลักดันใหสภาสหพันธโนมนาวศาลไปสูการลงโทษดาวิด ฟรังคฟวรเทอรอยางหนัก นี่เปนคําขอที่ผิดปกติอยางยิ่ง และเปนความพยายามของ [?SWI.SWI_fascist_germany.GetNameDef] ที่จะแสดงอํานาจเหนือเราอยางไมตองสงสัย \n\nการยอมรับอาจสงผลตอชื่อเสียงในระดับนานาชาติของเรา แตหากเราตัดสินใจปฏิเสธ ก็ควรแนใจวาเรารับผลที่ตามมาได"
 BBA_switzerland.6.a: "นี่เปนเรื่องของศาล"
 BBA_switzerland.6.b: "เราจะพิจารณาดู"

#Frankfurter "dies" under mysterious circumstances
 BBA_switzerland.7.t: "ฟรังคฟวรเทอรถูกสังหารในเรือนจําอยางลึกลับ"
 BBA_switzerland.7.desc: "ทางการเกราบึนเดินรายงานวาดาวิด ฟรังคฟวรเทอร ซึ่งถูกคุมขังหลังสารภาพวาสังหารวิลเฮลม กุสทลอฟฟ ผูแทนพรรคนาซี ถูกพบเปนศพในหองขังเมื่อเชานี้ ขณะนี้ยังไมทราบวาเปนการทํารายตนเอง หรือเปนฝมือของผูเห็นใจนาซีที่โกรธแคนภายในเรือนจํา แตตํารวจสหพันธสัญญาวาจะหาคําตอบใหได\n\nเราไมมีหลักฐานการกระทําผิดใด ๆ แตสถานการณนี้ลึกลับอยางยิ่ง และบางคนก็สงสัยรัฐบาล [SWI.GetAdjective] อยางมากที่ไมยอมใหผูแทน [?SWI.SWI_fascist_germany.GetAdjective] ตรวจสอบศพหรือที่เกิดเหตุ"
 BBA_switzerland.7.a: "ชางเถอะ"

#Frankfurter Trial 
 BBA_switzerland.8.t: "การพิจารณาคดีดาวิด ฟรังคฟวรเทอร"
 BBA_switzerland.8.desc: "ทั่วทั้ง [SWI.GetName] และเพื่อนบานตางจับตาการพิจารณาคดีดาวิด ฟรังคฟวรเทอร ผลของคดีนี้จะไมเพียงชี้ชะตาของผูที่ประกาศตนวามีความผิดเทานั้น แตยังชี้ชะตาของ [SWI.GetNameDef] ทั้งประเทศ และเผยวาประเทศพรอมจะประนีประนอมสถาบันและขนบธรรมเนียมของตนไปไดมากเพียงใด \n\nทุกสัญญาณจากศาลชี้ไปที่โทษจําคุกอยางเปนธรรม แตอิทธิพลจากสภาอาจเปลี่ยนผลการพิจารณาคดี และบางทีอาจเปลี่ยนแกนแทของประเทศเลยทีเดียว"
 BBA_switzerland.8.a: "ปลอยใหศาลตัดสิน"
 BBA_switzerland.8.b: "เขาไดรับใชประชาธิปไตย ควรไดรับอภัยโทษ!"
 BBA_switzerland.8.c: "เราเสี่ยงทําให [?SWI.SWI_fascist_germany.GetNameDef] ขุนเคืองไมได เขาตองไดรับโทษสูงสุด"

#To SWI: Germany is angry
 BBA_switzerland.9.t: "[SWI.GetName] กําลังยั่วโทสะของเรา!"
 BBA_switzerland.9.desc_default: "แมเราจะเรียกรองความยุติธรรม และแมพวกเขาจะอางตนวาเปนกลางและยึดหลักนิติธรรม แต [SWI.GetNameDefCap] กลับอภัยโทษใหดาวิด ฟรังคฟวรเทอร ผูซึ่งไมเพียงสังหารสมาชิกพรรคนาซี แตยังยอมรับอยางเต็มใจดวย!\n\nนี่พิสูจนวาพวกเขาไดเลือกขางแลว และจะเปนเปาที่ชอบธรรมในสงครามที่อาจเกิดขึ้น เราจะปลอยใหการดูหมิ่น [?SWI.SWI_fascist_germany.GetNameDef] นี้ผานไปไมได"
 BBA_switzerland.9.desc_alt: "สายลับของเราใน [SWI.GetName] รายงานวา แมจะอางตนวาเปนกลางและยึดหลักนิติธรรม แต [SWI.GetNameDef] ไดแอบพาดาวิด ฟรังคฟวรเทอร ผูประกาศตนวาเปนฆาตกรของวิลเฮลม กุสทลอฟฟ หนีออกจากคุกโดยจัดฉากการตายของเขา และเกณฑเขาเปนเจาหนาที่ขาวกรอง\n\nนี่พิสูจนวาพวกเขาไวใจไมได และตองถูกกําจัดเมื่อเรามีโอกาส เราจะปลอยใหการดูหมิ่น [?SWI.SWI_fascist_germany.GetNameDef] อยางโจงแจงนี้ผานไปไมได"
 BBA_switzerland.9.a: "พวกเขาตองชดใช!"

#To SWI: Germany is pleased
 BBA_switzerland.10.t: "[?SWI.SWI_fascist_germany.GetNameDefCap] พอใจกับการตัดสินใจของ [SWI.GetNameDef]"
 BBA_switzerland.10.desc: "ผูแทนจาก [?SWI.SWI_fascist_germany.GetNameDef] และภรรยามายของกุสทลอฟฟไดแสดงความขอบคุณตอ [SWI.GetNameDef] สําหรับการลงโทษฟรังคฟวรเทอรอยางเด็ดขาด จึงไมมีขอสงสัยวา [SWI.GetNameDef] ยืนอยูฝายใดในเรื่องเชนนี้ สิ่งนี้ยอมทําใหทาทีของ [?SWI.SWI_fascist_germany.GetName] ตอ [SWI.GetName] ดีขึ้นอยางแนนอน \n\nแม [?SWI.SWI_fascist_germany.Getleader.GetHerHis] จะกลาวในเชิงบวก แตก็ชัดเจนวาผลลัพธในอุดมคติของพรรคนาซีคือการสงตัวผูรายขามแดนไปยัง [?SWI.SWI_fascist_germany.GetNameDef]"
 BBA_switzerland.10.a: "บางทีสิ่งนี้อาจรับประกันความปลอดภัยของเรา"

#Trial Verdict 
 BBA_switzerland.11.t: "ดาวิด ฟรังคฟวรเทอรถูกตัดสินจําคุก"
 BBA_switzerland.11.desc_SWI: "เมื่อสภาตัดสินใจไมยุงเกี่ยวกับคดีและปลอยใหเปนเรื่องของศาลและกฎหมายของกรีซอนส ดาวิด ฟรังคฟวรเทอร ผูจงใจลอบสังหารวิลเฮลม กุสทลอฟฟ ก็ถูกตัดสินจําคุก 18 ป \n\nเรารูวา [?SWI.SWI_fascist_germany.GetNameDef] ตองการโทษที่หนักกวานี้มาก นักการทูตของเราจึงมีงานหนักรออยูในการเอาใจพวกเขา แตเราไมอาจเสี่ยงใหดูเหมือนเลือกขางในยามเชนนี้ ความเปนกลางของเราอาจเปนสิ่งที่ปกปองประชาชนชาว [SWI.GetAdjective] ใหปลอดภัยทามกลางพายุที่อาจมาถึง"
 BBA_switzerland.11.desc_GER: "[SWI.GetNameDefCap] บังอาจลงโทษฆาตกรผูสังหารกุสทลอฟฟเพียง 18 ปอยางนาขัน! นาเสียดาย แตเราไมอาจกดดันใหลงโทษหนักกวานี้ไดมากนัก เพราะเสี่ยงจะโหมกระแสเรียกรองใหควํ่าบาตรกีฬาโอลิมปก \n\nสําหรับตอนนี้ อยางนอยเราก็ยกยองกุสทลอฟฟเปนผูพลีชีพแหง [?SWI.SWI_fascist_germany.GetNameDef] และใชการฆาตกรรมนี้ในการโฆษณาชวนเชื่อได บางทีในการรุกรานครั้งหนา เราอาจจับตัวฟรังคฟวรเทอรไดและไดรับความยุติธรรมของเรา"
 BBA_switzerland.11.a: "นี่คือดีที่สุดที่เราทําไดในตอนนี้"
 BBA_switzerland.11.b: "เราจะไมลืมเรื่องนี้!" #THE GALLLLL!!!!

#After the war
 BBA_switzerland.12.t: "ดาวิด ฟรังคฟวรเทอรขออภัยโทษ"
 BBA_switzerland.12.desc: "เมื่อสงครามสิ้นสุดลงและ $GER_fascism_DEF$ ไมมีอยูอีกตอไป ดาวิด ฟรังคฟวรเทอร ดวยความชวยเหลือของทนายความ ฌอรฌ บรุนชวิก ไดยื่นขออภัยโทษในคดีสังหารวิลเฮลม กุสทลอฟฟเมื่อป 1936\n\nเนื่องจากเราไมไดถูกลอมรอบดวยระบอบฟาสซิสตอีกตอไป และความผิดของฟรังคฟวรเทอรถูกมองในบริบทใหมหลังการคนพบความโหดรายของนาซีตลอดสงคราม การผอนผันโทษใหเขาจึงแทบไมมีความเสี่ยง และเรายังอาจหามเขากลับเขา [ROOT.GetName] เผื่อไวดวย"
 BBA_switzerland.12.a: "เขาจะไดรับอภัยโทษ"
 BBA_switzerland.12.b: "เขาจะตองรับโทษจนครบ"

 BBA_switzerland.13.t: "[SWI.GetNameDefCap] ยอมรับคําขอของเรา"
 BBA_switzerland.13.desc: "ผูแทนที่เราสงไปใหคําปรึกษาแกภรรยามายของกุสทลอฟฟกลับมาพรอมขาวดียิ่ง คําพิพากษาของผูพิพากษาใน [SWI.GetName] ลงโทษดาวิด ฟรังคฟวรเทอรอยางหนัก ใกลเคียงกับที่เรารองขอ"
 BBA_switzerland.13.a: "บางทีเราอาจไมตองรุกรานก็ได"
 
 SWI_frankfurter_trial_will_continue_TT: "§Yดาวิด ฟรังคฟวรเทอร§! จะถูกพิจารณาคดี และเหตุการณจะคลี่คลายไปตามเวลา"
 SWI_frankfurter_immediate_harsh_sentence_TT: "§Yดาวิด ฟรังคฟวรเทอร§! จะไดรับโทษสูงสุดโดยไมมีการพิจารณาคดี"
 SWI_frankfurter_german_expectations_TT: "§Y[GER.GetNameDefCap]§! จะคาดหวังโทษที่หนักขึ้นสําหรับ §Yดาวิด ฟรังคฟวรเทอร§!"

 #### Other Events ####

 BBA_switzerland.14.t: "ฎีกาของ 200 คน"
 BBA_switzerland.14.desc: "สภาสหพันธไดรับฎีกาที่ลงชื่อโดยสมาชิก 200 คนจากกลุมฝายขวาหลายกลุม ซึ่งหวังจะผลักดันให [ROOT.GetNameDef] มีความสัมพันธที่เปนมิตรมากขึ้นกับ [SWI_get_fascist_neighbor] ขณะที่ยังคงความเปนกลางในระดับหนึ่ง พวกเขาตองการบรรลุเปาหมายนี้ดวยการเซ็นเซอรอยางเขมงวดตอขาวเชิงลบใด ๆ เกี่ยวกับประเทศนั้น เพื่อไมใหเกิดความขุนเคือง"
 BBA_switzerland.14.a: "เราควรปลอบใจพวกเขาแตเพิกเฉยตอคําขอ"
 BBA_switzerland.14.b: "พวกเขามีประเด็นที่ดีอยูบาง"
 BBA_switzerland.14.c: "พวกนี้เปนศัตรูของสวิตเซอรแลนด จับกุมพวกเขา!"
  
 #Espionage stuff 
 BBA_switzerland.15.t: "[FROM.GetName] เสนอใหเรายืมตัวสายลับ"
 BBA_switzerland.15.desc: "แมจะมีจุดยืนเปนกลาง แต [FROM.GetNameDef] ก็แอบเสนอโอกาสใหเราใชสายลับคนหนึ่งของพวกเขาในภารกิจขาวกรองของเรา \n\nสิ่งนี้เปนประโยชนตอเราเปนพิเศษ เพราะประชากรของ [SWI.GetNonIdeologyName] ใชภาษาเดียวกับ [GER.GetNonIdeologyName], [FRA.GetNonIdeologyName] และ [ITA.GetNonIdeologyName] จึงไดเปรียบในการแทรกซึมเขาประเทศเหลานั้น"
 BBA_switzerland.15.a: "เราใชสายลับ [GER.GetAdjective] ได"
 BBA_switzerland.15.b: "สายลับ [ITA.GetAdjective] นาจะมีประโยชน"
 BBA_switzerland.15.c: "บางทีอาจเปนสายลับ [FRA.GetAdjective]"
 BBA_switzerland_fra.15.tt: "จะไดรับสายลับทองถิ่นสัญชาติ §Y[FRA.GetAdjectiveCap]§! และ §Y[SWI.GetAdjectiveCap]§!"
 BBA_switzerland_ita.15.tt: "จะไดรับสายลับทองถิ่นสัญชาติ §Y[ITA.GetAdjectiveCap]§! และ §Y[SWI.GetAdjectiveCap]§!"
 BBA_switzerland_ger.15.tt: "จะไดรับสายลับทองถิ่นสัญชาติ §Y[GER.GetAdjectiveCap]§! และ §Y[SWI.GetAdjectiveCap]§!"

 BBA_switzerland.16.t: "[FROM.GetNameDefCap] แสวงหาสนธิสัญญาลับ"
 BBA_switzerland.16.desc: "สายลับคนหนึ่งของเราที่ประจําอยูใน [FROM.capital.GetCapitalVictoryPointName] ไดรับการทาบทามพรอมขอเสนอจากรัฐบาล [FROM.GetAdjective] นั่นคือสนธิสัญญาลับระหวางฝายของเรากับ [FROM.GetNameDef] ซึ่งหมายความวาพวกเขาจะชวยเราบอนทําลายศัตรูในยุโรป ขณะที่ยังรักษาภาพลักษณความเปนกลาง และถึงขั้นละทิ้งความเปนกลางเพื่อเราเมื่อถึงเวลา\n\nนอกจากนี้ยังหมายความวาเราจะตองเขาปกปองพวกเขาหากพวกเขาเสี่ยงจะถูกรุกราน"
 BBA_switzerland.16.a: "พวกเขาจะเปนกําลังสําคัญ"
 BBA_switzerland.16.b: "เราไมตองการความชวยเหลือจากพวกเขา"
  
 BBA_switzerland.17.t: "[FROM.GetNameDefCap] ยอมรับสนธิสัญญาลับของเรา"
 BBA_switzerland.17.desc: "ผานชองทางลับของเรากับ [FROM.GetNameDef] เราไดรับการยืนยันวาพวกเขาตกลงเขารวมพันธมิตรลับที่เราเสนอแลว นับจากนี้ พวกเขาจะไดรับการสนับสนุนจากเราในการตอตานศัตรู และจะปกปองเราหากเราตกอยูในภาวะใกลถูกรุกราน อยางไรก็ตาม นี่ไมไดหมายความวาเราปลอดภัย ศัตรูอาจเปดโปงการกระทําของเราและมองวาเปนภัยคุกคาม เราจึงตองระมัดระวังเชนที่ผานมาตอไป ขณะเตรียมพรอมลงมือ"
 BBA_switzerland.17.a: "ทั้งหมดนี้เพื่อประชาธิปไตยของเรา!"
 
 BBA_switzerland.18.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา!"
 BBA_switzerland.18.desc: "ขาวรายจากผูติดตอของเราใน [FROM.GetCapitalVictoryPointName] ดูเหมือนรัฐบาล [FROM.GetAdjective] จะปฏิเสธขอเสนอสนธิสัญญาลับของเรา ทําใหเราเสี่ยงตอการถูกเพื่อนบานรุกราน บัดนี้เราตองเตรียมปองกันตนเอง หรือหาหนทางอื่นในการรักษาเอกราชและประชาธิปไตยของเรา"
 BBA_switzerland.18.a: "เราตองยืนหยัดตอสูศัตรูเพียงลําพัง"
 
 ### Diplomatic Events ### 

 BBA_switzerland.19.t: "[FROM.GetNameDefCap] เชิญเราเขารวมภาคีของพวกเขา"
 BBA_switzerland.19.desc: "ในอดีต [FROM.GetName] เปนกลางอยางแนวแนมาตลอด แตดูเหมือนพวกเขาตัดสินใจละทิ้งความเปนกลางเพื่อตอบสนองตอสถานการณโลกในปจจุบัน และดูเหมือนจะชักชวนประเทศเปนกลางอื่น ๆ ใหทําเชนเดียวกัน หากการเขารวมฝายของพวกเขาเปนกาวที่ใหญเกินไปจากการเปนกลาง เราก็อาจรับประกันเอกราชของกันและกันแทนได"
 BBA_switzerland.19.a: "ยามผิดปกติยอมตองใชมาตรการผิดปกติ"
 BBA_switzerland.19.b: "การรับประกันก็นาจะเพียงพอ"
 BBA_switzerland.19.c: "ความเปนกลางอาจเปนเกราะปองกันเพียงอยางเดียวของเรา"

 BBA_switzerland.20.t: "[FROM.GetName] ไมเขารวมภาคีของเราแตเสนอการรับประกัน"
 BBA_switzerland.20.desc: "หลังเราเชิญใหเขารวม [ROOT.GetFactionName] [FROM.GetNameDef] แจงเราวา แมจะปฏิเสธขอเสนอ แตพวกเขาจะรับประกันเอกราชของเรา ตราบที่เรารับประกันเอกราชของพวกเขา เปนการประนีประนอมเพื่อใหพวกเขารักษาความเปนกลางไวได"
 BBA_switzerland.20.a: "ก็คงตองเปนเชนนั้น"
 
 BBA_switzerland.21.t: "[FROM.GetName] ผูสิ้นหวังขอการรับประกันจากเรา"
 BBA_switzerland.21.desc: "ขณะที่ [?FROM.SWI_angriest_country.GetNameDef] ขูจะทําสงครามกับ [FROM.GetName] เพราะสิ่งที่พวกเขามองวาเปนการละเมิดความเปนกลางที่เพิ่มขึ้นเรื่อย ๆ [From.GetNameDef] จึงขอใหเราสัญญาวาจะปกปองพวกเขาจากผูกระหายสงครามดวยการรับประกันเอกราชของ [FROM.GetAdjective]"
 BBA_switzerland.21.a: "พวกเขาตองการความคุมครองจากเรา"
 BBA_switzerland.21.b: "เราเสี่ยงขัดแยงกับ [?FROM.SWI_angriest_country.GetName] ไมได"

 BBA_switzerland.22.t: "[FROM.GetNameDefCap] สัญญาจะปกปองเรา!"
 BBA_switzerland.22.desc: "โทรเลขทางการทูตจาก [FROM.GetName] มาถึงพรอมขาวดียิ่ง พวกเขาตกลงจะรับประกันเอกราชของเรา และสัญญาวาจะปกปองเราหากใครโจมตี รวมถึง [?SWI.SWI_angriest_country.GetName] ดวย"
 BBA_switzerland.22.a: "เรารอดแลว... มั้ง"

 BBA_switzerland.23.t: "[FROM.GetNameDefCap] ปฏิเสธพันธะใด ๆ ตอเรา!"
 BBA_switzerland.23.desc: "นาเสียดายที่ [FROM.GetName] ตัดสินใจเมินเฉยตอชะตากรรมของเราในการเผชิญหนากับ [?SWI.SWI_angriest_country.GetNameDef] พวกเขาจะไมยืนเคียงขางเราเพื่อตานการคุกคามนั้น"
 BBA_switzerland.23.a: "เราพึ่งไดเพียงตนเอง"

 BBA_switzerland.24.t: "[?SWI.SWI_angriest_country.GetNameDefCap] มองวาเราละเมิดความเปนกลาง"
 BBA_switzerland.24.desc: "ความเปนกลางของเราไมไดดํารงอยูเพียงเพราะทาทีที่เทาเทียมของเราตอทุกประเทศเทานั้น แตยังขึ้นกับการรับรูของประเทศเหลานั้นดวย [?SWI.SWI_angriest_country.GetNameDef] เห็นวาเราผิดสัญญาเรื่องความเปนกลางและเขาขางศัตรูของพวกเขา พวกเขาแจงมาวาหากไมไดรับการเอาใจในเร็ววัน พวกเขาจะไมถือวาเราเปนชาติเปนกลางอีกตอไป และอาจถึงขั้นประกาศสงครามกับเรา"
 BBA_switzerland.24.a: "นากังวล!"
 
 BBA_switzerland.25.t: "[?SWI.SWI_angriest_country.GetNameDefCap] ไมถือวาเราเปนกลางอีกตอไป"
 BBA_switzerland.25.desc: "ขาวรายมาถึง เมื่อ [?SWI.SWI_angriest_country.GetName] ประกาศความรังเกียจตอ [ROOT.GetNameDef] และประกาศวาเราเปนเปาหมายที่ชอบธรรมสําหรับการชิงไหวชิงพริบทางการเมือง หรือแมแตการพิชิต"
 BBA_switzerland.25.a: "เรากําลังอยูในนานนํ้าที่ไมมีใครเคยสํารวจ!"

 ### [REDACTED] Events ###

 BBA_switzerland.97.t: "ทหารผานศึกกองทัพเรือออสเตรียเสนอตัวรับใช"
 BBA_switzerland.97.desc: "ภายใตขออางการออกทัวรยุโรปกับครอบครัวผูมีพรสวรรคทางดนตรี อดีตผูบังคับการเรือดํานํ้าผูชํ่าชองไดขามพรมแดนจากออสเตรียเขามา และเสนอตัวรับใช [ROOT.GetNameDef] เพื่อแลกกับการลี้ภัย\n\nเกออรก ฟอน ทรัพพ มีผลงานโดดเดนในกองทัพเรือออสเตรีย-ฮังการี แตนับตั้งแตสิ้นสุดมหาสงคราม การลมสลายของจักรวรรดิ และการสูญเสียทรัพยสมบัติ เขาก็ออกแสดงรวมกับครอบครัวนักรองนักดนตรีของเขา นับตั้งแต [GER.GetNameDef] ผนวกออสเตรีย เขาถูกบีบใหรับใชพวกเขา เขาจึงหลบหนีออกมา\n\nแนนอนวาพรสวรรคทางดนตรีของครอบครัวเขาจะเปนที่ชื่นชมไมแพประสบการณทางทะเลของเขา โดยเฉพาะเมื่อเรามีชายฝงแตไมมีเจาหนาที่ปองกัน"
 BBA_switzerland.97.a: "ทองทะเลจะมีชีวิตชีวาดวยเสียงตอรปโดของเรา"
 BBA_switzerland.97.b: "เขาและครอบครัวพํานักในสวิตเซอรแลนดและแสดงดนตรีตอไปไดไมวาอยางไร"

 #### Election Stuff ###

 BBA_SWI_annual_election.1.t: "การเลือกตั้งประธานาธิบดีแหงสมาพันธรัฐสวิส"
 BBA_SWI_annual_election.1.desc: "ทุกป สภาสหพันธสวิสจะเลือกสมาชิกสภาบริหารคนหนึ่งขึ้นเปนประธานาธิบดีแหงสมาพันธรัฐสวิส ในฐานะผูเปนที่หนึ่งในหมูผูเทาเทียม [?ROOT.SWI_confederation_president.GetSheHe] จะใชอํานาจอันจํากัดของ [?ROOT.SWI_confederation_president.GetHerHis] เปนตัวแทนสภาและชี้ขาดเมื่อคะแนนเสียงในสภาเทากัน เพื่อคอย ๆ นําพาสภาไปสูความปลอดภัยหรือความรุงโรจน\n\n[SWI_get_extra_election_paragraph]ปนี้สภาควรเลือกใครเปนหนาตาของสมาพันธรัฐสวิส?"
 BBA_SWI_annual_election.1.a: "เลือก [SWI_GetCouncilor1name]"
 BBA_SWI_annual_election.1.b: "เลือก [SWI_GetCouncilor2name]"
 BBA_SWI_annual_election.1.c: "เลือก [SWI_GetCouncilor3name]"
 SWI_first_election_text: "เมื่อสมาชิกสภาบริหารไดเปนประธานาธิบดีแหงสมาพันธรัฐแลว จะไมสามารถแตงตั้งเปนที่ปรึกษาทางการเมืองไดอีก แตจะมีการตัดสินใจอันทรงพลังใหใช หากตําแหนงที่ปรึกษาทางการเมืองวางนานเกินไป คุณจะไดรับบทลงโทษ จึงควรแตงตั้งใหเต็มโดยเร็ว\n\n"

 BBA_SWI_annual_election.2.t: "การลงมติฉุกเฉินเลือกประธานาธิบดีแหงสมาพันธรัฐ!"
 BBA_SWI_annual_election.2.desc: "หลังการขับ [?SWI_ousted_president.GetName] ออกจากตําแหนงอยางไมเคยมีมากอน และชวงเวลาแหงความไรเสถียรภาพทางการเมืองในสภาบริหารสหพันธ ถึงเวลาเลือกประธานาธิบดีแหงสมาพันธรัฐคนใหมแลว ขอใหผูนั้นแกไขทิศทางของ [SWI.GetNameDef] ได และไมใชคนสุดทายที่ไดดํารงตําแหนงนี้"
 BBA_SWI_annual_election.2.a: "เลือก [SWI_GetCouncilor1name]"
 BBA_SWI_annual_election.2.b: "เลือก [SWI_GetCouncilor2name]"
 BBA_SWI_annual_election.2.c: "เลือก [SWI_GetCouncilor3name]"

 ######## TRADE #######

 BBA_switzerland_trade.1.t: "[FROM.GetNameDefCap] ตองการทําขอตกลงการคากับ [ROOT.GetName]"
 BBA_switzerland_trade.1.desc: "แมจะเปนกลางมาตลอดในประวัติศาสตร แต [FROM.GetNameDefCap] กําลังพยายามทําขอตกลงการคากับชาติของเรา ไมวาพวกเขาจะตองการเขาขางเรา หรือสิ้นหวังกวาที่เราคิด \n\nไมวาอยางไร เราจะไดประโยชนจากการใชกําลังการผลิตทางอุตสาหกรรมและที่ตั้งอันสะดวกของพวกเขา โดยไมตองลําบากรุกรานประเทศที่มีปอมปราการแนนหนา ในทางกลับกัน สิ่งนี้อาจเสริมสถานะของพวกเขาในกรณีที่ [ROOT.GetNameDef] รุกรานในอนาคต"
 BBA_switzerland_trade.1.a: "โรงงานของพวกเขาจะหลอเลี้ยงจักรกลสงครามของเรา"
 BBA_switzerland_trade.1.b: "เศรษฐกิจพลเรือนของเราจะชวยเหลือกันและกัน"
 BBA_switzerland_trade.1.c: "เราไมตองการความชวยเหลือจากประเทศเปนกลางที่ไรกระดูกสันหลัง"
 BBA_switzerland_trade.1.d: "เราไวใจ [FROM.GetName] ไมได"
 
 BBA_switzerland_trade.2.t: "[FROM.GetName] ยกเลิกขอตกลงการคากับเรากอนกําหนด"
 BBA_switzerland_trade.2.desc: "ดูเหมือน [FROM.GetName] จะปฏิเสธที่จะดําเนินขอตกลงการคาที่ทํากับเราตอไป แมจะเปนประโยชนอยางมากตอทั้งสองฝาย \n\nตอนนี้เราทําอะไรไดไมมากนัก แต [ROOT.GetNameDef] จะจดจําความไมมีพันธะนี้ไวอยางแนนอน"
 BBA_switzerland_trade.2.a: "นาเสียดาย"
 BBA_switzerland_trade.2.b: "เราจะไมยอมใหพวกเขาหลอกอีก"

 BBA_switzerland_trade.3.t: "ขอตกลงการคาที่ดําเนินอยูกับ [FROM.GetName]"
 BBA_switzerland_trade.3.desc: "ขอตกลงการคาที่เรามีกับ [FROM.GetNameDef] ตลอดปที่ผานมาใหผลดียิ่งแก [ROOT.GetName] และบัดนี้ถึงเวลาตัดสินใจวาจะตออายุหรือไม \n\n แมขอตกลงทวิภาคีเชนนี้จะมีประโยชน และชาติอยางเราตองการมันมากเพียงใด เราก็ควรตระหนักวาบางประเทศอาจมองวาเปนการละเมิดความเปนกลางเพิ่มขึ้นอีก เราควรแนใจวาการทําใหพวกเขาขุนเคืองนั้นทั้งจัดการไดและคุมคา"
 BBA_switzerland_trade.3.a: "ใช เราตองการเสบียงเหลานี้เพื่อความอยูรอด"
 BBA_switzerland_trade.3.b: "ไม เสี่ยงเกินไป"
 
 BBA_switzerland_trade.4.t: "[FROM.GetName] ตองการตออายุขอตกลงการคากับเรา"
 BBA_switzerland_trade.4.desc: "ดูเหมือนขอตกลงการคากับเราจะเปนประโยชนอยางยิ่งตอ [FROM.GetName] เห็นไดจากที่พวกเขายอมเสี่ยงละเมิดความเปนกลางอีกครั้งเพื่อจัดหาเสบียงจากเรา \n\n ขอตกลงนี้แทบไมมีขอเสียสําหรับเรา เวนแตวาเรากําลังมอบเครื่องมือใหพวกเขาใชปองกันตนเองจากการที่เราอาจรุกราน [FROM.GetName]"
 BBA_switzerland_trade.4.a: "ตออายุขอตกลง"
 BBA_switzerland_trade.4.b: "เปลี่ยนไปเนนการผลิตภาคพลเรือน"
 BBA_switzerland_trade.4.c: "เปลี่ยนไปเนนการผลิตทางทหาร"
 BBA_switzerland_trade.4.d: "ไมคุมที่จะยุงยากอีกตอไป"

 BBA_switzerland_trade.5.t: "[FROM.GetName] ปลอยใหขอตกลงการคากับเราหมดอายุ"
 BBA_switzerland_trade.5.desc: "แมเราจะใหเงื่อนไขอันเอื้อเฟอแก [FROM.GetName] ในขอตกลงการคารวมกัน แตพวกเขาก็ตัดสินใจไมตออายุ และเลือกที่จะไปตอเพียงลําพัง \n\n เราไมเขาใจเลยวาทําไมพวกเขาจึงตัดสินใจเชนนั้น แตบางทีอาจดีที่สุดแลว"
 BBA_switzerland_trade.5.a: "พวกเขาเสียเอง!"

 BBA_switzerland_trade.6.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอขอตกลงการคาของเรา!"
 BBA_switzerland_trade.6.desc: "คณะผูแทนของเรากลับจาก [FROM.GetName] พรอมขาวดี ขอตกลงการคานี้จะชวยใหเราจัดหาเสบียงที่จําเปนตอการขับเคลื่อนอุตสาหกรรมและเลี้ยงดูประชากรได \n\n ประเทศอื่นอาจมองวานี่เปนการละเมิดความเปนกลาง แตสําหรับ [ROOT.GetName] นี่เปนเพียงราคาที่ตองจายเพื่อรักษาเอกราชในยามที่ไมแนนอนเชนนี้"
 BBA_switzerland_trade.6.a: "ยอดเยี่ยม!"
 
 BBA_switzerland_trade.7.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอขอตกลงการคาของเรา"
 BBA_switzerland_trade.7.desc: "แมเราจะพยายามอยางดีที่สุด แตรัฐบาล [FROM.GetAdjective] ก็ตัดสินใจปฏิเสธขอเสนอขอตกลงการคาที่เปนประโยชนรวมกันของเรา \n\n สิ่งนี้อาจทําให [ROOt.GetName] ตกอยูในสถานะลอแหลม เพราะสถานการณในยุโรปทําใหการจัดหาแหลงเสบียงพลเรือนและทางทหารที่มั่นคง ซึ่งจําเปนตอการปกปองและเลี้ยงดูประเทศของเรา ยากขึ้นเรื่อย ๆ"
 BBA_switzerland_trade.7.a: "เราจะหาทางอื่น!"

 BBA_switzerland_trade.8.t: "[FROM.GetNameDefCap] อาจชวยเราซื้อขายทองคําได"
 BBA_switzerland_trade.8.desc: "เมื่อความตึงเครียดระหวางประเทศทั่วโลกเพิ่มสูงขึ้น การคาก็ยากขึ้น และหากเราเขาสูสงคราม ทางเลือกในการซื้อขายทองคําจะยิ่งจํากัดลงอีก หากเราไวใจพวกเขามากพอ ความเปนกลางของ [FROM.GetName] อาจเปนโอกาสใหเราเก็บทุนสํารองและคาขายไดอยางเสรี ซึ่งเปนประโยชนตอเศรษฐกิจ และทายที่สุดตอจักรกลสงครามของเรา"
 BBA_switzerland_trade.8.a: "ความคิดที่ดี"
 BBA_switzerland_trade.8.b: "เราไมอาจรูไดวาพวกเขายืนอยูฝายใดจริง ๆ"

 BBA_switzerland_trade.9.t: "[FROM.GetNameDefCap] จะซื้อขายทองคําผานเรา"
 BBA_switzerland_trade.9.desc: "นี่หมายความวาพวกเขาจะฝากทุนสํารองทองคําไวกับเรา ทําใหซื้อขายทองคําไดอยางเสรีโดยไมตองกังวลเรื่องการควํ่าบาตร พวกเขาไมใชฝายเดียวที่ไดประโยชน เพราะเงินที่หลั่งไหลเขามาจะชวยเศรษฐกิจที่กําลังยํ่าแยของเรา และอาจใชเปนไพตอรองในอนาคตไดดวย"
 BBA_switzerland_trade.9.a: "สิ่งนี้จะมีประโยชน"

 BBA_switzerland_trade.10.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะใชระบบธนาคารของเรา"
 BBA_switzerland_trade.10.desc: "แมจะเห็นไดชัดวาเปนประโยชนรวมกัน แตดูเหมือน [FROM.GetName] จะไมสนใจเพิ่มการซื้อขายทองคํากับสวนอื่นของโลก"
 BBA_switzerland_trade.10.a: "ชางเถอะ"
 
 BBA_switzerland_trade.11.t: "เราอาจซื้อขายทองคําผานตลาด [FROM.GetAdjective] เพิ่มขึ้น"
 BBA_switzerland_trade.11.desc: "เราใชตลาดใน [FROM.GetName] เพื่อเลี่ยงกําแพงการคาที่เกิดจากสถานการณการเมืองโลกอยูแลว การเพิ่มทุนสํารองที่นั่นอาจเปนประโยชนตอเศรษฐกิจของเรายิ่งขึ้น แมจะเปนประโยชนตอเศรษฐกิจของพวกเขาดวยก็ตาม"
 BBA_switzerland_trade.11.a: "พวกเขาพิสูจนแลววาไวใจได"
 BBA_switzerland_trade.11.b: "เราเสี่ยงใหการทรยศเลวรายลงกวานี้ไมได"

 BBA_switzerland_trade.12.t: "[FROM.GetNameDefCap] ยึดทุนสํารองทองคําของเรา!"
 BBA_switzerland_trade.12.desc: "เรานาจะคาดการณเรื่องนี้ไวแตแรก พวกเขาใชหนากากแหงความเปนกลางแทงขางหลังเรา สิ่งนี้จะสงผลรายแรงตอเศรษฐกิจของเรา เราตองตอบโต"
 BBA_switzerland_trade.12.a: "พวกเขาตองชดใช"

 BBA_switzerland_trade.13.t: "[FROM.GetName] ตองการใหเราลงทุนในประเทศของพวกเขา"
 BBA_switzerland_trade.13.desc: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเราเพื่อตานทานมหาอํานาจฟาสซิสตที่มาเคาะประตูบาน เราสามารถลงทุนในเศรษฐกิจของพวกเขาเพื่อใหพวกเขาเตรียมพรอมรับมือสถานการณเลวรายที่สุด หรือแมแตชวยตอสูกับฟาสซิสตโดยตรง หากพวกเขาเลือกหรือถูกบีบใหละทิ้งความเปนกลางที่ยึดถือมายาวนาน"
 BBA_switzerland_trade.13.a: "เราตองชวยพวกเขาตานฟาสซิสต"
 BBA_switzerland_trade.13.b: "สิ่งนี้ไมเปนประโยชนตอเราเลย"

 BBA_switzerland_trade.14.t: "[FROM.GetNameDefCap] จะลงทุนใน [ROOT.GetName]"
 BBA_switzerland_trade.14.desc: "การลงทุนเหลานี้จะชวยปรับปรุงเศรษฐกิจของเรา และชวยใหเราตานทานความยากลําบากใด ๆ ที่ฟาสซิสตอาจกอแก [ROOT.GetName] ได นอกจากนี้ยังจะทําใหชาติของเราใกลชิดกันมากขึ้น บางทีอาจถึงขั้นรวมกันตอตานฟาสซิสตโดยตรงในที่สุด"
 BBA_switzerland_trade.14.a: "ขาวดีจริง ๆ!"

 BBA_switzerland_trade.15.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะลงทุน"
 BBA_switzerland_trade.15.desc: "นาเสียดายที่เราไดรับแจงวา [FROM.GetName] จะไมลงทุนในเศรษฐกิจ [ROOT.GetAdjective] เราจึงโดดเดี่ยวกวาที่ตองการ เมื่อคํานึงถึงภัยฟาสซิสตที่ใกลเขามา"
 BBA_switzerland_trade.15.a: "นี่เปนปญหา"

 ####### FASCIST EVENTS ###########

 BBA_switzerland_fascist.1.t: "[FROM.GetNameDefCap] ตองการความคุมครองจากเรา"
 BBA_switzerland_fascist.1.desc: "ชาติเล็กจอยอยาง [FROM.GetName] ซึ่งเคยเปนรัฐชีสอาชญากร ตองการผูกตนเองไวกับ [ROOT.GetNameDef] ดวยการเปนรัฐหุนเชิดของเรา นี่อาจถือเปนการยอมรับความออนแอ หรือการประกาศความภักดีตอ [ROOT.GetRulingParty]\n\n ขีดความสามารถในการปองกันอันแข็งแกรงและประชากรพลเรือนที่ไดรับการฝกมาอยางดีของพวกเขาอาจเปนประโยชนตอแผนการในอนาคตของเรา"
 BBA_switzerland_fascist.1.a: "ใหพวกเขาเขามาอยูใตปกของเรา"
 BBA_switzerland_fascist.1.b: "เราไมตองการพวกเขา!"
 
 BBA_switzerland_fascist.2.t: "[FROM.GetNameDefCap] ปฏิเสธเรา"
 BBA_switzerland_fascist.2.desc: "แมเราจะทาบทาม [FROM.GetName] แตพวกเขาก็ปฏิเสธขอเสนอใหเรายอมอยูใตระบอบ [FROM.GetAdjective] \n\n สิ่งนี้ทําใหเราอยูในสถานการณลอแหลม เพราะเราสูญเสียภาพลักษณความเปนกลางไปแลวอยางชัดเจน และบัดนี้อาจตองเอาตัวรอดจากสิ่งที่กําลังจะมาถึงเพียงลําพัง"
 BBA_switzerland_fascist.2.a: "เมฆดําตั้งเคาที่ขอบฟา"


 BBA_switzerland_fascist.3.t: "[SWI.GetName] ขอควบคุม [848.GetName]"
 BBA_switzerland_fascist.3.desc: "[FROM.GetNameDef] อางวาตนมีสิทธิ์เหนือ [848.GetName] หลังการลงคะแนนในป 1919 ซึ่งเสียงสวนใหญของภูมิภาคเลือกเขารวมกับสิ่งที่ตอนนั้นคือสมาพันธรัฐสวิส แมพวกเขาจะละทิ้งประชาธิปไตยไปแลว และการลงคะแนนก็เกิดขึ้นเมื่อหลายสิบปกอน แตการมอบความรับผิดชอบรัฐนี้ใหพวกเขาอาจชวยลดทรัพยากรที่เราใชยึดครองดินแดนนี้ และอาจใชเปนบททดสอบขีดความสามารถ และที่สําคัญกวานั้นคือความภักดีของ [FROM.GetName]"
 BBA_switzerland_fascist.3.a: "มันเปนของพวกเขาโดยชอบธรรม"
 BBA_switzerland_fascist.3.b: "ไวใจใหพวกเขาดูแลไมได"

 BBA_switzerland_fascist.4.t: "[FROM.GetNameDefCap] ปฏิเสธคําขอขยายดินแดนของเรา"
 BBA_switzerland_fascist.4.desc: "แมเราจะแสดงความภักดีและขีดความสามารถอยางชัดเจน แต [FROM.GetNameDef] ก็เลือกปฏิเสธคําขอของเรา การขยายดินแดนของ [ROOT.GetNameDef] เขาสู [?SWI.SWI_requested_territory.GetName] คงตองรอไปกอน บางทีอาจจนกวาเราจะตัดสินใจวาการยอมอยูใต [FROM.GetName] ตอไปไมคุมคาอีกแลว"
 BBA_switzerland_fascist.4.a: "มันเปนของพวกเขาโดยชอบธรรม"

 BBA_switzerland_fascist.5.t: "[FROM.GetNameDefCap] ยอมรับคําขอควบคุม [?SWI.SWI_requested_territory.GetName] ของเรา"
 BBA_switzerland_fascist.5.desc: "อาจตองแลกดวยราคาแพง แตการยอมอยูใตอํานาจและเกียรติที่เรามอบแก [FROM.GetNameDef] ก็ไดผลตอบแทนแลว นับแตบัดนี้ [ROOT.GetNameDef] จะควบคุม [?SWI.SWI_requested_territory.GetName] ในนามของพวกเขา และดินแดนนี้จะถูกรวมเขากับดินแดนของเรา"
 BBA_switzerland_fascist.5.a: "ยอดเยี่ยม"
 BBA_switzerland_fascist.5.b: "คําสาบานของเรายังคงอยู"


 BBA_switzerland_fascist.6.t: "[SWI.GetName] ขอขยายดินแดน"
 BBA_switzerland_fascist.6.desc: "หลังความสําเร็จอยางเห็นไดชัดของการยึดครอง [848.GetName] โดย [FROM.GetAdjective] [FROM.GetNameDef] เสนอที่จะปองกันดินแดน [SWI_requested_territory.GetAdjective] ของเราแทนเรา \n\n แนนอนวานี่หมายถึงการสละอํานาจควบคุมพื้นที่ใหพวกเขาดวย เราจึงควรประเมินความภักดีของพวกเขาอยางระมัดระวัง"
 BBA_switzerland_fascist.6.a: "พวกเขาพิสูจนตัวเองแลว"
 BBA_switzerland_fascist.6.b: "$BBA_switzerland_fascist.3.b$"

 BBA_switzerland_fascist.7.t: "[FROM.GetNameDefCap] ตอนรับเราเขาสูใตปกของพวกเขา"
 BBA_switzerland_fascist.7.desc: "ในการชุมนุมที่ [ROOT.GetCapitalVictoryPointName] [ROOT.GetLeader] ไดประกาศคํามั่นของ [FROM.GetName] วาจะรวมมือกับประเทศของเราอยางแนนแฟน และจะปกปอง [ROOT.GetName] จากศัตรูของเราและของพวกเขา \n\nขณะนี้ นายทหารและเจาหนาที่ผูเปนมิตรจาก [FROM.GetNameDef] สหายของเรา กําลังหลั่งไหลเขาสูประเทศเพื่อชวยพัฒนากําลังทหารของเรา และเตรียมพรอมนํากําลังนั้นไปรับใชพวกเขา"
 BBA_switzerland_fascist.7.a: "มีประโยชน!"

 ##########  SWISS EXPANSION EVENTS #######

 BBA_swiss_expansion.1.t: "เรามีอิทธิพลตอ [SWI_influenced_state] ไมมากพอ"
 BBA_swiss_expansion.1.desc: "แมนักโฆษณาชวนเชื่อของเราจะพยายามอยางดีที่สุด แตประชาธิปไตยไมไดแพรหลายในแคนตันตาง ๆ ของ [?SWI.SWI_influence_target_state.GetName] มากอยางที่คาด นาเสียดายที่เราไมคิดวาการลงประชามติเพื่อเขารวมกับเราจะประสบความสําเร็จ\n\nนี่ไมไดหมายความวาเราควรลมเลิก เราไดหวานเมล็ดพันธุที่สามารถบมเพาะตอไปได ทําใหมีโอกาสสําเร็จมากขึ้นในครั้งหนา"
 BBA_swiss_expansion.1.a: "เราจะไมละทิ้งภารกิจของเรา"
 
 BBA_swiss_expansion.2.t: "ดวยอิทธิพลของเรา [SWI_influenced_state] ตองการเขารวมกับเรา"
 BBA_swiss_expansion.2.desc: "หลังการรณรงคโฆษณาชวนเชื่ออยางกวางขวาง ประชาชนใน [?SWI.SWI_influence_target_state.GetName] สนับสนุนการเขารวมกับ [ROOT.GetNameDef] อยางทวมทน\n\nนี่หมายความวาหาก  [?SWI.SWI_influence_target_state.GetName] เปนประชาธิปไตยเชนเดียวกับเรา พวกเขาก็คงเปนสวนหนึ่งของประเทศเราไปแลว นาเสียดายที่ไมเปนเชนนั้น พวกเขาจึงตองการความชวยเหลือจากเราเพื่อเปนแคนตันใหมลาสุดของ [SWI.GetName]\n\nบัดนี้เราสามารถผลักดันใหมีการลงประชามติในรัฐนั้นเพื่อตัดสินการเปนสมาชิกของ [ROOT.GetNameDef] ไดแลว"
 BBA_swiss_expansion.2.a: "เราตองนําประชาธิปไตยที่แทจริงไปสูพวกเขา"
 
 BBA_swiss_expansion.3.t: "[FROM.GetNameDefCap] กดดันเพื่อเอา [SWI_pressed_state]"
 BBA_swiss_expansion.3.desc: "พวกนอกคอกที่อางวาเปนกลางใน [FROM.GetName] บังอาจอางสิทธิ์วา [?SWI.SWI_state_being_claimed.GetName] เปนของพวกเขา โดยอางวาเสียงสนับสนุนการเขารวมกับ [FROM.GetNameDef] สูงพอที่การลงประชามติในเรื่องนี้จะออกมาเปนฝายพวกเขา ทําใหรัฐนี้เปนของพวกเขาโดยชอบธรรม\n\nเราอาจปลอยให [?SWI.SWI_state_being_claimed.GetName] จัดการลงประชามติ ซึ่งเราจะแพอยางแนนอน หรือเสี่ยงทําสงครามกับพวกเขาหากเราปฏิเสธ"
 BBA_swiss_expansion.3.a: "เราจะไมยอมใหใครขมเหง!"
 BBA_swiss_expansion.3.b: "ถาเชนนั้นก็ลงประชามติ"

 BBA_swiss_expansion.4.t: "[FROM.GetName] ยอมรับการลงประชามติ!"
 BBA_swiss_expansion.4.desc: "หลังการลงประชามติอยางสันติทั่วทั้ง [?SWI.SWI_state_being_claimed.GetName] ซึ่งออกมาเปนฝายเราอยางทวมทน [FROM.GetNameDef] ไดยอมโอนอํานาจควบคุมรัฐนี้ใหแกเรา เราจะเปลี่ยนดินแดนภายใน [?SWI.SWI_state_being_claimed.GetName] เปนแคนตันทันที และพวกเขาจะไดสัมผัสประชาธิปไตยในแบบของเราเสียที"
 BBA_swiss_expansion.4.a: "สมาพันธรัฐของเราขยายตัว!"

 BBA_swiss_expansion.5.t: "[FROM.GetNameDef] เพิกเฉยตอเสียงเรียกรองใหลงประชามติ!"
 BBA_swiss_expansion.5.desc: "แมประชาชนจะสนับสนุนประชาธิปไตยและ [ROOT.GetNameDef] แต [FROM.GetName] ก็ตัดสินใจเพิกเฉยตอประชาชนใน [?SWI.SWI_state_being_claimed.GetName] ที่เรียกรองใหลงประชามติเรื่องการเปนสมาชิกสมาพันธรัฐ\n\nนี่เปนเสียงเรียกรองอยางชัดเจนใหเราจับอาวุธปกปองแคนตันที่ถูกยึดครองของเราจากการกดขี่ของ [FROM.GetNameDef]"
 BBA_swiss_expansion.5.a: "คําสาบานของเราเรียกรองเชนนั้น!"

 BBA_swiss_expansion.6.t: "[FROM.GetNameDefCap] ตองการให [848.GetName] เปนแคนตัน"
 BBA_swiss_expansion.6.desc: "ดูเหมือน [FROM.GetName] จะเรียกรองใหรัฐ [848.GetName] เขารวมสมาพันธรัฐของพวกเขา โดยอางถึงการลงประชามติในป 1919 ซึ่งรัฐนี้ลงคะแนนอยางทวมทนใหเขารวมเปนแคนตันของ [FROM.GetNameDef] แตถูกชาว [FROM.GetAdjective] เองปฏิเสธ ดูเหมือนตอนนี้พวกเขาจะเปลี่ยนใจแลว\n\nไมวาเราจะยอมรับหรือไม ก็เห็นไดชัดวาพวกเขาจองจะขยายดินแดน เราจึงควรเดินอยางระมัดระวัง และพรอมปกปองดินแดนของเราแมจะยอมรับขอเรียกรองของพวกเขาก็ตาม"
 BBA_swiss_expansion.6.a: "ไมคุมที่จะเสี่ยงเพื่อรัฐเล็ก ๆ แคนี้"
 BBA_swiss_expansion.6.b: "[ROOT.GetNameDefCap] จะไมยกดินแดนใด ๆ ใหใครเด็ดขาด!"
 BBA_swiss_expansion.6.c: "เราจะไมยอมใหสิวบนใบหนาของยุโรปมาขมเหง"
 BBA_swiss_expansion.6.d: "ไปเสียไดก็ดี"

 BBA_swiss_expansion.7.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเราให [848.GetName] เขารวมกับ [ROOT.GetName]"
 BBA_swiss_expansion.7.desc: "รัฐบาล [FROM.GetAdjective] ปฏิเสธคําขอของเราอยางเด็ดขาด แมเราจะมีขออางสิทธิ์ที่หนักแนนและเจตจํานงอันเปนประชาธิปไตยของประชาชนใน [848.GetName]\n\nเราไมควรปลอยใหการดูแคลนนี้ผานไป"
 BBA_swiss_expansion.7.a: "สักวันหนึ่ง [848.GetName] จะไดรับอิสรภาพ!"

 BBA_swiss_expansion.8.t: "รัฐบาล [FROM.GetAdjective] ยอมรับคําขอของเราเพื่ออิสรภาพของ [848.GetName]"
 BBA_swiss_expansion.8.desc: "[FROM.GetNameDefCap] ตาสวางแลว และเห็นพองกับเราวาที่ของ [848.GetName] คือการอยูกับ [ROOT.GetNameDef] ในฐานะแคนตันใหมลาสุด\n\nนี่เปนเพียงกาวแรกบนเสนทางของ [ROOT.GetName] สูยุโรปที่เปนประชาธิปไตยยิ่งขึ้น!"
 BBA_swiss_expansion.8.a: "เพื่อประชาธิปไตย!"

 BBA_swiss_expansion.9.t: "[FROM.GetName] เสนอใหความคุมครอง"
 BBA_swiss_expansion.9.desc: "หลังเรียกรองใหเรายก [848.GetName] ใหดวยขออางที่คอนขางออน [FROM.GetNameDef] กําลังเสนอที่จะยึดดินแดนของเราไป โดยอางวาเพื่อปกปองเราจาก [GER.GetNameDef] ซึ่งพวกเขาอางวานาจะพยายามผนวก [ROOT.GetNameDef] ในเร็ว ๆ นี้\n\nแมขออางนี้จะฟงดูนาเชื่อพอสมควร และหากรวมกันเราก็จะมีโอกาสตานการรุกรานไดดีกวา แตการแลกดวยอธิปไตยของเราอาจเปนราคาที่แพงเกินไป\n\nแนนอนวาเราคาดไดวาพวกเขาจะโจมตีเราหากเราปฏิเสธ"
 BBA_swiss_expansion.9.a: "นี่อาจเปนโอกาสรอดเพียงหนึ่งเดียวของเรา"
 BBA_swiss_expansion.9.b: "นั่นเปนราคาที่เราไมยอมจาย!"

 BBA_swiss_expansion.10.t: "[FROM.GetNameDefCap] จะเขารวมกับสวิตเซอรแลนด!"
 BBA_swiss_expansion.10.desc: "เมืองตาง ๆ ทั่วเทือกเขาแอลปจะเฉลิมฉลองการรวมกันของสองชาติแหงเทือกเขาแอลป! เราจะปองกันตนเองจากมหาอํานาจที่รายลอมไดดีขึ้น"
 BBA_swiss_expansion.10.a: "ในที่สุด!"
 
 BBA_swiss_expansion.11.t: "[FROM.GetNameDefCap] ปฏิเสธเรา!"
 BBA_swiss_expansion.11.desc: "แมเราจะพยายามสรางชาติใหมที่สามารถปองกันตนเองจากมหาอํานาจที่ใหญที่สุดของยุโรป แต [FROM.GetLeader] กลับแสดงความรังเกียจของ [FROM.GetLeader.GetHerHis] ตอขอเสนอของเรา"
 BBA_swiss_expansion.11.a: "เราเหลือทางเลือกเพียงทางเดียว"
 
 BBA_swiss_expansion.12.t: "[FROM.GetName] อางสิทธิ์เหนือดินแดนแอลปของเรา"
 BBA_swiss_expansion.12.desc: "ในเหตุการณที่พลิกผันอยางไมคาดคิด [FROM.GetNameDef] ไดอางสิทธิ์เหนือเทือกเขาแอลปของ [ROOT.GetAdjective] ขออางของพวกเขาออนเต็มที แตพวกเขาไดระดมประชากรสวนใหญและพรอมจะรุกรานหากเราปฏิเสธ ประกอบกับภูมิประเทศที่เอื้อตอพวกเขาอยางมาก หากเราตอบปฏิเสธ สงครามจะยืดเยื้อและสิ้นเปลือง เราจึงตองชั่งนํ้าหนักทางเลือกใหดี"
 BBA_swiss_expansion.12.desc_FRA: "[FROM.GetNameDef] สาธารณรัฐพี่นองของเรา ตองการนําเทือกเขาแอลปทั้งหมดมาไวใตปกของตน และไดอางสิทธิ์เหนือดินแดนเหลานั้น\n\nเทือกเขาแอลปของ [ROOT.GetAdjective] เปนสวนหนึ่งของชาติเรามาชานาน แตการมอบใหเปนดินแดนของ [FROM.GetAdjective] จะเปนรางวัลตอบแทนความภักดีและความมุงมั่นของพวกเขา ทําใหพวกเขากลายเปนพันธมิตรที่ทรงพลังยิ่งขึ้น"
 BBA_swiss_expansion.12.a: "ยกเทือกเขาแอลปใหพวกเขา"
 BBA_swiss_expansion.12.b: "ไรสาระสิ้นดี!"

 BBA_swiss_expansion.13.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองของเรา!"
 BBA_swiss_expansion.13.desc: "รัฐบาล [FROM.GetAdjective] ตัดสินใจถูกตองและยอมรับวาดินแดนแอลปของพวกเขาเปนของเราโดยชอบธรรม สิ่งนี้จะรับประกันความปลอดภัยของเราจากผูรุกรานยิ่งขึ้น"
 BBA_swiss_expansion.13.a: "ขอตอนรับแคนตันใหมเหลานี้!"

 BBA_swiss_expansion.14.t: "[FROM.GetName] ปฏิเสธการอางสิทธิ์เหนือเทือกเขาแอลปของเรา"
 BBA_swiss_expansion.14.desc: "แมเราจะเรียกรองเทือกเขาแอลปของ [FROM.GetAdjective] อยางหนักแนน แต [FROM.GetNameDef] ก็ปดตกการอางสิทธิ์ของเรา เรายังมีวิธีอื่นในการยึดดินแดนนี้ หากเราเลือกที่จะเดินหนา"
 BBA_swiss_expansion.14.a: "ไมทางใดก็ทางหนึ่ง เราจะไดมันมา"

 BBA_swiss_expansion.15.t: "[FROM.GetName] พยายามปลุกปน [AUS.GetName] ใหตอตานเรา!"
 BBA_swiss_expansion.15.desc: "ความพยายามของเราในการรวม [AUS.GetNonIdeologyName] เขากับ [ROOT.GetNonIdeologyName] กําลังถูกขัดขวางโดย [FROM.GetName] พวกเขากําลังรณรงคสนับสนุนระบอบการปกครองอันนาอัปยศของตนและตอตานเรา\n\nการผลักดันอันชลุสสในขณะที่สงครามใสรายปายสีนี้ยังดําเนินอยูเปนไปไมได เราจึงตองรอเพื่อบรรลุชะตากรรมอันรุงโรจนของเรา!"
 BBA_swiss_expansion.15.a: "พวกเขาแคถวงเวลาสิ่งที่หลีกเลี่ยงไมได!"

 BBA_swiss_expansion.16.t: "[FROM.GetNonIdeologyName] เรียกรองเอกราช"
 BBA_swiss_expansion.16.desc: "แมเราจะใหความคุมครองและการสนับสนุน แต [FROM.GetName] รัฐในอารักขาของเรากลับเรียกรองใหเราปลดปลอยพวกเขาจากสิทธิพิเศษและหนาที่ที่มีตอเรา เพื่อกลับไปเปนชาติของตนเองอีกครั้ง\n\n[GetDemandingAlpsParagraph]"
 BBA_swiss_expansion.16.a: "[SWI_only_independence_response]"
 BBA_swiss_expansion.16.b: "ใหพวกเขาเปนประเทศเอกราช พรอมกับรัฐแอลปของเรา"
 BBA_swiss_expansion.16.c: "พวกเขาตองสูเพื่อมันเอง!"
 SWI_independence_demand_alps_paragraph: "นอกจากเอกราชแลว พวกเขายังบังอาจเรียกรองใหเรามอบดินแดนเทือกเขาแอลปสวนของเราใหดวย โดยอางวาเพื่อกอตั้งประเทศที่ครอบคลุมเทือกเขาแอลปทั้งหมด\n\n"
 SWI_no_alps_independence: "ใหพวกเขากลับไปเปนเอกราช"
 SWI_have_alps_but_only_independence: "เราจะยอมใหเอกราช แตไมมากกวานั้น"
 
 BBA_swiss_expansion.17.t_alps: "[FROM.GetName] ใหเอกราชแกเราแตไมยอมยกดินแดนแอลปของพวกเขา"
 BBA_swiss_expansion.17.t_no_alps: "[ROOT.GetName] ไดรับเอกราชอีกครั้ง!"
 BBA_swiss_expansion.17.desc_alps: "นี่คือวันสําคัญยิ่ง แมเราจะยังไมบรรลุเปาหมายทั้งหมด [FROM.GetNameDefCap] ยอมใหเราแยกทางอยางไมเต็มใจนัก และมอบเอกราชที่เราใฝฝนให แตในขณะเดียวกัน พวกเขาก็ประกาศอยางนาอัปยศวาไมยอมสละดินแดนแอลปของตน\n\nเราจะตองหาวิธีอื่นในการรวมเทือกเขาแอลปไวใตธงของเรา"
 BBA_swiss_expansion.17.desc_no_alps: "วันแหงความปติยินดีของ [ROOT.GetNonIdeologyName] [FROM.GetNameDef] ยอมรับคําขอเอกราชของเราแลว นั่นหมายความวาเรามีอิสระที่จะกําหนดวาระของตนเองอีกครั้งและเลือกจุดยืนนโยบายตางประเทศไดเอง ในทางกลับกัน เราก็ตองพึ่งพาตนเองดวย"
 BBA_swiss_expansion.17.a: "อะไรรออยูขางหนาสําหรับ [ROOT.GetNonIdeologyName]?"

 BBA_swiss_expansion.18.t: "[FROM.GetNameDefCap] มอบเอกราชใหเราพรอมเทือกเขาแอลป"
 BBA_swiss_expansion.18.desc: "แผนการของเราสําเร็จลุลวงในที่สุด [ROOT.GetNonIdeologyName] ไดเอกราชคืนมาเสียที พรอมกับดินแดนที่เคยรูจักในชื่อเทือกเขาแอลปของ [FROM.GetAdjective]\n\nแมเราจะไมไดรับความคุมครองจากเจาเหนือหัวเกาอีกตอไป แตดินแดนที่เพิ่งไดมาจะทําใหการอยูรอดของเรามั่นคงยิ่งขึ้น"
 BBA_swiss_expansion.18.a: "[ROOT.GetNameDefCap] ผงาดขึ้น!"

 BBA_swiss_expansion.19.t: "[FROM.GetName] ไมยอมให [ROOT.GetNonIdeologyName] เปนเอกราช!"
 BBA_swiss_expansion.19.desc: "การประกาศเอกราชของเราไมเปนที่พอใจของ [FROM.GetNameDef] อดีตเจาเหนือหัวของเรา พวกเขาประกาศสงครามกับเราหวังจะยึดประเทศของเราดวยกําลัง จงจับอาวุธและแสดงใหพวกเขาเห็นวา [ROOT.GetName] จะไมยอมถูกกดขี่งาย ๆ"
 BBA_swiss_expansion.19.a: "จับอาวุธ!"

 SWI_delayed_anschluss_TT: "§Y[GER.GetNameDefCap]§! จะ§Rไมสามารถผลักดันอันชลุสสได§! จนกวาจิตวิญญาณแหงชาติ §Y$SWI_swiss_democratic_propaganda$§! จะถูกนําออกจาก §Y[AUS.GetName]§! ในอีกสามเดือน"
 SWI_expantion_state_loc: "[?SWI.SWI_influence_target_state.GetName]"
 SWI_expansion_no_state: "รัฐนี้"
 SWI_claiming_state_loc: "[?SWI_state_being_claimed.GetName]"
 SWI_claiming_no_state_loc: "หนึ่งในรัฐของเรา"
 SWI_press_for_future_canton_TT: "ปลดล็อกการตัดสินใจ: §Yกดดันประเทศเพื่อแคนตันในอนาคตที่ไดรับอิทธิพล§!"


