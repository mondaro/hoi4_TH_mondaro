 BBA_italy_anti_colonialism_events.02.c: "สายไปแลว พวกเขาตองคุกเขาศิโรราบ!"
 BBA_italy_anti_colonialism_events.03.t: "สิ้นสุดสงครามอิตาลี-เอธิโอเปย"
 BBA_italy_anti_colonialism_events.03.desc: "[FROM.GetLeader] แหง [FROM.GetName] ตกลงรับขอเสนอหยุดยิงของเราและพรอมจะใหโอกาสแกสันติภาพ ในที่สุดเราก็สามารถทิ้งหนึ่งในความโหดรายครั้งใหญที่สุดของมุสโสลินีไวเบื้องหลังและเริ่มตนใหมไดเสียที"
 BBA_italy_anti_colonialism_events.03.a: "สันติภาพก็สันติภาพ!"
 BBA_italy_anti_colonialism_events.04.t: "[FROM.GetLeader] ปฏิเสธขอเสนอของเรา"
 BBA_italy_anti_colonialism_events.04.desc: "ดูเหมือน [FROM.GetLeader] ผูกระหายเลือดจะไดกลิ่นเลือดหลังสงครามกลางเมืองของเรา และคิดวาเราออนแอ [FROM.GetSheHeCap] ปฏิเสธขอเสนอสันติภาพอันใจกวางของเราและตั้งใจจะรบตอไป เราจะแสดงให [FROM.GetHerHim] เห็นวาเราไมไดออนแอเลยแมแตนอย!"
 BBA_italy_anti_colonialism_events.04.a: "[FROM.GetLeader] จะตองเสียใจ!"
 BBA_italy_anti_colonialism_events.05.t: "[FROM.GetAdjective] เรียกรองใหผนวกรวม[ROOT.GetAdjective]"
 BBA_italy_anti_colonialism_events.05.desc: "รัฐบาลใน [FROM.GetName] กําลังพยายามเขาควบคุมดินแดนของเราโดยตรง และผนวกเราเขากับการปกครองของ [FROM.GetAdjective] ที่ใหญกวา ยังไมมีใครรูวาสิ่งนี้จะสงผลตอประชาชน วัฒนธรรม และประเพณีของเราอยางไร"
 BBA_italy_anti_colonialism_events.05.a: "เรายินดียอมรับ"
 BBA_italy_anti_colonialism_events.05.b: "เราจะไมยอมสละอํานาจปกครองตนเองอันนอยนิดของเรา!"
 BBA_italy_anti_colonialism_events.06.t: "การผนวกรวม[FROM.GetAdjective]เขากับ [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.06.desc: "รัฐบาล [FROM.GetAdjective] ตระหนักแลววาการผนวกรวมเขากับการปกครองของ [ROOT.GetAdjective] ที่กวางขวางกวาจะเปนประโยชนและเสริมความแข็งแกรงใหแกพวกเราทุกคน"
 BBA_italy_anti_colonialism_events.06.a: "ยอดเยี่ยม! (Favoloso!)"
 BBA_italy_anti_colonialism_events.07.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 BBA_italy_anti_colonialism_events.07.desc: "ดูเหมือนชาว [FROM.GetAdjective] จะคิดวาตนเหมาะที่จะปกครองตนเองมากกวา และไดปฏิเสธขอเสนอใหเขาเปนสวนหนึ่งของการปกครองที่กวางขวางของเรา"
 BBA_italy_anti_colonialism_events.07.a: "คงเรียกรองมากเกินไป..."
 BBA_italy_anti_colonialism_events.08.t: "[FROM.GetAdjective] ลงทุนพัฒนา[ROOT.GetAdjective]"
 BBA_italy_anti_colonialism_events.08.desc: "ดูเหมือนรัฐบาลใหมใน [FROM.GetName] ตองการแกไขการปฏิบัติอันหยาบกระดางที่รัฐบาลชุดกอนมีตอประชาชนชาว [ROOT.GetAdjective] และตัดสินใจหันมาลงทุนในประเทศของเราบาง"
 BBA_italy_anti_colonialism_events.08.a: "[ROOT.GetCapitalVictoryPointName] เจริญรุงเรือง!"
 BBA_italy_anti_colonialism_events.09.t: "รัฐบาล [FROM.GetAdjective] กดดัน [ROOT.GetName]"
 BBA_italy_anti_colonialism_events.09.desc: "ความกระหายการขยายดินแดนของ [FROM.GetAdjective] ดูเหมือนจะไรขีดจํากัด! เราไดรับคณะผูแทนจาก [FROM.GetName] ที่เสนอใหเรายอมอยูใตอํานาจ พวกเขาอางวาแทบไมมีอะไรเปลี่ยนแปลง เรายังคงปกครองดินแดนของเราไดตามที่เห็นสมควร เพียงแตจะไดรับการคุมครองเพิ่มเติมจากชาว [FROM.GetAdjective] และตองปฏิบัติตามบางเปนครั้งคราว"
 BBA_italy_anti_colonialism_events.09.a: "เราจะเดินตามสหายชาวอิตาลี!"
 BBA_italy_anti_colonialism_events.09.b: "เราตองเปลี่ยนรัฐบาล!"
 BBA_italy_anti_colonialism_events.09.c: "ชาวยุโรปพวกนี้ชางอวดดีเสียจริง!"
 BBA_italy_anti_colonialism_events.10.t: "กรรมกร[FROM.GetAdjective]ชื่นชมยินดี!"
 BBA_italy_anti_colonialism_events.10.desc: "รัฐบาล [FROMGetAdjective] ตัดสินใจอยางชาญฉลาดที่จะรับขอเสนอใหรวมมือกันและรับการคุมครองจากเรา สิ่งนี้จะเสริมความแข็งแกรงและเปนประโยชนตอทั้งสองประเทศอยางไมตองสงสัย!"
 BBA_italy_anti_colonialism_events.11.t: "กรรมกร[FROM.GetAdjective]ยึดอํานาจ"
 BBA_italy_anti_colonialism_events.11.desc: "แมผูนํา [FROM.GetAdjective] จะไมรับขอเสนอดานการคุมครองและความรวมมือของเรา แตพวกเขาก็ยอมพบกันครึ่งทาง โดยเปลี่ยนรัฐบาลเปนชุดที่คลายคลึงกับของเรามากขึ้นและเปนมิตรตอเรามากขึ้น"
 BBA_italy_anti_colonialism_events.11.a: "อนาคตอันสดใสรอคอยประชาชนชาว [FROM.GetAdjective] อยู!"
 BBA_italy_anti_colonialism_events.12.desc: "[FROM.GetLeader] ผูนําของ [FROM.GetName] คัดคานขอเสนอดานการคุมครองและความรวมมือของเราอยางแข็งกราว และไลคณะผูแทนของเราใหกลับบานโดยเร็วที่สุดดวยถอยคําที่ไมไยดีเลย"
 BBA_italy_anti_colonialism_events.12.a: "เวลาจะสอนใหพวกเขารูวาคิดผิดเพียงใด"
 BBA_italy_anti_colonialism_events.12.b: "นั่นคือคําสั่ง ไมใชขอเสนอ"
 BBA_italy_anti_colonialism_events.13.t: "[FROM.GetName] ตองการกระชับความสัมพันธ"
 BBA_italy_anti_colonialism_events.13.desc: "ดูเหมือนชาว [FROM.GetAdjective] จะเคารพกองกําลังและขีดความสามารถของเราอยางมากระหวางที่ทําสงครามกับเรา มากถึงขนาดที่พวกเขาตองการเสนอขอตกลงไมรุกรานซึ่งกันและกันและการรับประกันรวมกันเมื่อเผชิญสงคราม"
 BBA_italy_anti_colonialism_events.13.a: "ฟงดูดี!"
 BBA_italy_anti_colonialism_events.13.b: "ไมมีวันเสียหรอก!"
 BBA_italy_anti_colonialism_events.14.desc: "[FROM.GetLeader] ตกลงอยางชาญฉลาดที่จะลงนามในสนธิสัญญาไมรุกรานซึ่งกันและกันระหวาง [FROM.GetName] และ [ROOT.GetName] ตามที่เราเสนอ พรอมทั้งการรับประกันรวมกัน หากฝายใดฝายหนึ่งตองเผชิญผูรุกราน"
 BBA_italy_anti_colonialism_events.15.desc: "[FROM.GetLeader] ปฏิเสธขอตกลงปองกันรวมระหวาง [FROM.GetName] และ [ROOT.GetName] ที่เราเสนออยางไมฉลาดนัก หลักประกันนี้จะนําเสถียรภาพและความปลอดภัยมาสูทั้งสองประเทศ แตบัดนี้เราตองเผชิญโลกเพียงลําพัง"
 BBA_italy_anti_colonialism_events.15.a: "พวกเขาเสียเอง!"
 BBA_italy_anti_colonialism_events.15.b: "ถาไมอยูขางเรา ก็คือศัตรูของเรา!"
 BBA_italy_anti_colonialism_events_war_will_continue_tt: "สงครามจะดําเนินตอไป"

 BBA_italy_anti_colonialism_events.20.t: "[FROM.GetNameDefCap] ประณามลัทธิอาณานิคม"
 BBA_italy_anti_colonialism_events.20.desc: "ดูเหมือน [FROM.GetName] ที่เพิ่งกอตั้งขึ้นจะมีสํานึกในคุณธรรมและเปาหมายใหม และรับหนาที่รื้อถอนจักรวรรดิอาณานิคมของคนอื่นทั้งหมด คณะผูแทนชาวอิตาลีไดขอใหเราละทิ้งวิถีจักรวรรดินิยม และโอบรับอนาคตแหงความรวมมือและเสรีภาพแทนการกดขี่และการบังคับใหอยูใตอํานาจ"
 BBA_italy_anti_colonialism_events.20.a: "ถึงเวลาแกไขสิ่งที่ผิดใหถูกตองแลว!"
 BBA_italy_anti_colonialism_events.20.b: "ชาว [FROM.GetAdjective] เสียสติไปแลวหรือ?!"
 BBA_italy_anti_colonialism_events.21.t: "การปลดปลอยอาณานิคมในแอฟริกา"
 BBA_italy_anti_colonialism_events.21.desc: "[GetDecolonizationEventDesc]"
 BBA_italy_anti_colonialism_events.21.desc_accepted: "เมื่อเราเริ่มประณามและรื้อถอนจักรวรรดิอาณานิคมในแอฟริกา เราไมแนใจวาการกระทําเชนนี้จะไดรับการตอบรับอยางไร เมื่อพิจารณาวาประเทศตาง ๆ ยึดติดกับสิ่งที่ตนเห็นวาเปนของตนอยางดื้อรั้นเพียงใด เราตองถือวาความพยายามของเราประสบความสําเร็จ แมเพียงการปลดปลอยชาติเดียวก็นับเปนความสําเร็จอันยิ่งใหญ!"
 BBA_italy_anti_colonialism_events.21.desc_rejected: "ดูเหมือนความพยายามของเราที่จะปลดปลอยทวีปแอฟริกาจากอาณานิคมและนําเสรีภาพมาสูประชาชนที่ถูกกดขี่ จะถูกปดตกในทุกชองทาง เห็นไดชัดวามหาอํานาจอาณานิคมเกาไมยอมรับความจริงวาตนปฏิบัติตอผูอยูใตปกครองอยางไร และไมยอมฟงเหตุผล พวกเขาตองรับผิดชอบ!"
 BBA_italy_anti_colonialism_events.21.a: "ภารกิจของเราที่นี่เสร็จสิ้นแลว"
 BBA_italy_anti_colonialism_events.21.b: "ถาเชนนั้นก็ตองใชไมแข็ง!"

 BBA_italy_anti_colonialism_events.52.t: "แอฟริกาเหนือลงมติเขารวมกับ [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.52.desc: "ประชาชนในแอฟริกาเหนือไดเห็นแลววาเราปกครองดินแดนของพวกเขาดวยความเมตตาและมีประสิทธิภาพเพียงใด และไดลงมติเขารวมการปกครองของเรา! ดูเหมือนการลงทุนและการดูแลจังหวัดของพวกเขาจะไดผลตอบแทนแลว สิ่งนี้จะเปนประโยชนตอพวกเราทุกคนอยางแนนอน"
 BBA_italy_anti_colonialism_events.52.a: "ยินดีตอนรับพี่นองทั้งหลาย!"
 BBA_italy_anti_colonialism_events.53.t: "แอฟริกาเหนือลงมติแยกตัวจาก [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.53.desc: "แมอาจไมใชเรื่องนาประหลาดใจนัก แตนาเสียดายที่เราไดรับแจงวาประชาชนในแอฟริกาเหนือปฏิเสธที่จะอยูใตการปกครองของเราอีกตอไป พวกเขารูสึกถูกละเลยและถูกเอารัดเอาเปรียบมาเปนเวลานาน จึงลงมติแยกตัวออกจากการปกครองของเรา"
 BBA_italy_anti_colonialism_events.53.a: "เราขออําลาพวกเขา"
 BBA_italy_anti_colonialism_events.54.t: "แอฟริกาตะวันออกลงมติเขารวมกับ [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.54.desc: "ประชาชนในแอฟริกาตะวันออกไดเห็นแลววาเราปกครองดินแดนของพวกเขาดวยความเมตตาและมีประสิทธิภาพเพียงใด และไดลงมติเขารวมการปกครองของเรา! ดูเหมือนการลงทุนและการดูแลจังหวัดของพวกเขาจะไดผลตอบแทนแลว สิ่งนี้จะเปนประโยชนตอพวกเราทุกคนอยางแนนอน"
 BBA_italy_anti_colonialism_events.55.t: "แอฟริกาตะวันออกลงมติแยกตัวจาก [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.55.desc: "แมอาจไมใชเรื่องนาประหลาดใจนัก แตนาเสียดายที่เราไดรับแจงวาประชาชนในแอฟริกาตะวันออกปฏิเสธที่จะอยูใตการปกครองของเราอีกตอไป พวกเขารูสึกถูกละเลยและถูกเอารัดเอาเปรียบมาเปนเวลานาน จึงลงมติแยกตัวออกจากการปกครองของเรา"
 BBA_italy_anti_colonialism_events.56.t: "แอฟริกาตะวันตกลงมติเขารวมกับ [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.56.desc: "ประชาชนในแอฟริกาตะวันตกไดเห็นแลววาเราปกครองดินแดนของพวกเขาดวยความเมตตาและมีประสิทธิภาพเพียงใด และไดลงมติเขารวมการปกครองของเรา! ดูเหมือนการลงทุนและการดูแลจังหวัดของพวกเขาจะไดผลตอบแทนแลว สิ่งนี้จะเปนประโยชนตอพวกเราทุกคนอยางแนนอน"
