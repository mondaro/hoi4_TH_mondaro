 bba_africa_news.1.t: "การกอตั้งสหพันธรัฐแอฟริกาตะวันออก"
 bba_africa_news.1.desc: "ในทศวรรษ 1920 ลีโอ เอเมอรี รัฐมนตรีวาการกระทรวงอาณานิคม พยายามสรางดินแดนในปกครองแอฟริกาตะวันออกที่คนผิวขาวปกครอง ประกอบดวยเคนยา ยูกันดา และแทนกันยีกา แตถูกคัดคานและไมสําเร็จในที่สุด อยางไรก็ตาม ชนพื้นเมืองแหงแอฟริกาตะวันออกไดใชแนวคิดนี้เปนพื้นฐานในการกอตั้งชาติของตนเอง ซึ่งบัดนี้ทําใหพวกเขาแข็งแกรงกวาที่เคย พวกเขาประกาศวายุคแหงแอฟริกาที่ถูกยุโรปครอบงํากําลังจะสิ้นสุดลง!"
 bba_africa_news.1.a: "ในที่สุด เราก็รวมเปนหนึ่ง!"
 bba_africa_news.1.b: "นี่คือจุดจบของยุคอาณานิคมหรือ?"

 bba_africa_news.2.t: "จะงอยแอฟริการวมเปนหนึ่งแลว"
 bba_africa_news.2.desc: "หลังการแบงแยกและการสูรบมานานหลายศตวรรษ ประชาชนแหงจะงอยแอฟริกาไดรวมเปนรัฐเดียวกันแลว เรื่องนี้เกือบเกิดขึ้นมากอน แตความทะเยอทะยานของนักชาตินิยมที่คิดถึงแตตนเองเปนอุปสรรคที่ฉีกความสัมพันธระหวางผูคนออกจากกันเสมอมา อยางไรก็ตาม บัดนี้ [ROOT.GetLeader] ผูปกครองภูมิภาคไดประกาศวารัฐนี้จะไมเอื้อประโยชนแกกลุมใดกลุมหนึ่ง แตจะเปนปจจัยหลอมรวมทุกคนที่อาศัยอยูที่นั่น เขาประกาศวาครั้งนี้ ภูมิภาคจะสงบสุขและรุงเรือง และจะรวมเปนหนึ่งเดียวไปจนสิ้นยุคของมนุษยชาติ"
 bba_africa_news.2.a: "ขอใหมีสันติภาพและความรุงเรือง"
 bba_africa_news.2.b: "สิ่งนี้จะมีความหมายอยางไรตอภูมิภาค?"

 bba_africa_news.3.t: "กอตั้งองคการเอกภาพแอฟริกา"
 bba_africa_news.3.desc: "ชาติตาง ๆ ในแอฟริกาเริ่มรวมมือกันผานการกอตั้งองคการระหวางรัฐบาล องคการเอกภาพแอฟริกาที่ตั้งขึ้นใหมนี้สัญญาวาจะสงเสริมความมั่นคงและการพัฒนาเศรษฐกิจของรัฐสมาชิก พวกเขาจะยึดมั่นในอุดมคติอันสูงสงเหลานี้ไดหรือไม ยังตองรอดูกันตอไป"
 bba_africa_news.3.a: "ความริเริ่มที่ยอดเยี่ยม!"
 bba_africa_news.3.b: "ชางเปนแนวคิดที่ออนแอ"

 bba_africa_news.4.t: "การกอตั้งสหภาพแอฟริกา"
 bba_africa_news.4.desc: "หลายคนเคยสงสัยในความสามารถขององคการเอกภาพแอฟริกาที่จะรักษาคํามั่นที่ประกาศไว อยางไรก็ตาม สมาชิกขององคการไดแสดงความปรารถนาที่จะบูรณาการใหลึกซึ้งยิ่งขึ้นดวยการกอตั้งสหพันธของรัฐภายในสหภาพแอฟริกาที่ใหญกวา แมจะยังมีงานอีกมากที่ตองทําเพื่อบูรณาการระบบการเมืองของรัฐสมาชิกแตละรัฐอยางสมบูรณ แตดูเหมือนมหาอํานาจโลกรายใหมกําลังกอตัวขึ้นในแอฟริกา"
 bba_africa_news.4.a: "สามัคคีคือพลัง แตกแยกคือหายนะ!"
 bba_africa_news.4.b: "สิ่งนี้จะไมมีความหมายอะไร"