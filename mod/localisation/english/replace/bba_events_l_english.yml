 BBA_italy_anti_colonialism_events.01.g: "เราจะกระชับสัมพันธกับประชาชนชาวเอธิโอเปย"
 BBA_italy_anti_colonialism_events.02.t: "ขอเสนอหยุดยิงจาก [FROM.GetName]"
 BBA_italy_anti_colonialism_events.02.desc: "รัฐบาลใหมของ [FROM.GetName] ไดมาหาเราเพื่อขอหยุดยิงยุติการสูรบ ดูเหมือนวาหลังผานสงครามกลางเมืองมา พวกเขาก็เบื่อหนายการนองเลือดและการรบราเต็มทีแลว"
 BBA_italy_anti_colonialism_events.02.a: "ฟงดูมีเหตุผล"
