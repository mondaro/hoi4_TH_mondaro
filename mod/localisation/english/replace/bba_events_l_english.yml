l_english:
 # News events 
 bba_news.0.t: "จุดจบของสันนิบาตชาติ"
 bba_news.0.desc: "เมื่อ[?global.LoN_attacker_country.GetNameDef]ประกาศสงครามกับ[?global.LoN_defender_country.GetNameDef] สันนิบาตชาติก็ลมเหลวในความพยายามรักษาสันติภาพ [?global.LoN_attacker_country.GetLeader]เยยหยันความไรนํ้ายาของสันนิบาตอยางเปดเผย และนําประเทศของ[?global.LoN_attacker_country.GetHerHis]ถอนตัวออกจากสันนิบาต เมื่อผูนําโลกคนอื่นๆ ตางก็ตั้งคําถามวาสันนิบาตชาติจะมีไวทําไมหากไมสามารถปองกันความขัดแยงได ยุคสมัยของสันนิบาตก็ถือวาสิ้นสุดลงโดยพฤตินัย \nแมคณะมนตรีจะยังคงประชุมกันตอไป แตก็ไมมีใครคาดหวังวาจะบรรลุผลอะไรไดอีกแลว อํานาจใดๆ ที่คณะมนตรีเคยมีไดสูญสิ้นไปนานแลว"
 bba_news.0.a: "ไมไดเกินความคาดหมายนัก"

 # Italo-Ethiopian War events 
 BBA_italo_ethiopian_war_events.01.t: "ยุติการรุกชวงคริสตมาส"
 BBA_italo_ethiopian_war_events.01.desc: "กองทหารของเราชะงักงันในสงครามกับอะบิสซิเนีย และยังถูกผลักถอยรนในบางพื้นที่ “การรุกชวงคริสตมาส” นี้ทําใหมุสโสลินีตําหนิกองบัญชาการทหารสูงสุดเปนการสวนตัวถึงความไรความสามารถ ทานดูเชตองการผลลัพธ เดี๋ยวนี้ \n\n ดวยเหตุนี้ทานจึงอนุมัติใหใชทุกวิถีทางที่จําเปนเพื่อขับไลชาวอะบิสซิเนียและยุติสงครามนี้โดยเร็ว ไมวาจะตองแลกดวยอะไรก็ตาม"
 BBA_italo_ethiopian_war_events.01.a: "ดวยทุกวิถีทางที่จําเปน"
 BBA_italo_ethiopian_war_events.01.b: "เราตองดําเนินการอยางเปนระบบและรอบคอบ"

 BBA_italo_ethiopian_war_events.02.t: "การรุกใหญของอิตาลี"
 BBA_italo_ethiopian_war_events.02.desc: "ชาวอิตาลีกําลังพยายามชวงชิงความริเริ่มในสงครามกลับคืน พวกเขาเปดฉากการรุกครั้งใหญเพื่อทลายแนวของเราและบดขยี้จักรวรรดิ[ROOT.GetAdjective]ในการโจมตีครั้งเดียว\nกองกําลังของเราตองยืนหยัด เปนเรื่องสําคัญยิ่งที่กองกําลังของเราตองตานทานการทิ้งระเบิดอยางหนักและการบุกดวยรถถังและปนใหญไดนานพอ เพื่อใหเรามีเวลาโนมนาวประชาคมระหวางประเทศใหลงมือชวยเหลือเรา"
 BBA_italo_ethiopian_war_events.02.a: "ทําลายผูรุกราน!"

 BBA_italo_ethiopian_war_events.03.t: "อิตาลีเสริมกําลัง"
 BBA_italo_ethiopian_war_events.03.desc: "การรุกของเราผลักดันชาวอิตาลีใหถอยกลับไปได แตก็ไมบรรลุเปาหมาย กองทหารของเราหมดแรงสง ขณะที่ชาวอิตาลีกําลังฟนตัวจากความตกตะลึงจากการโจมตีของเรา\nรายงานขาวกรองชี้วาพวกเขากําลังเตรียมการรุกครั้งใหมซึ่งเตรียมพรอมดีกวาครั้งกอน กองกําลังของเราตองยืนหยัด ยิ่งเรากันพวกเขาไวหางจากประเทศของเราไดนานเทาไร พวกเขาก็ยิ่งตองทุมกําลังมากขึ้น และยิ่งงายขึ้นที่จะโนมนาวสันนิบาตชาติวานี่ไมใช "การปะทะเล็กๆ ในอาณานิคม" แตเปนการรุกรานอยางโหดเหี้ยมของประเทศสมาชิกหนึ่งตออีกประเทศหนึ่ง"
 BBA_italo_ethiopian_war_events.03.a: "เดิมพันกําลังสูงขึ้น"

 BBA_italo_ethiopian_war_events.10.t: "มติควํ่าบาตรของสันนิบาตชาติ"
 BBA_italo_ethiopian_war_events.10.desc: "คณะมนตรีสันนิบาตชาติไดตัดสินใจควํ่าบาตรการคากับ[ITA.GetNameDef]อยางเต็มรูปแบบ เพื่อตอบโตการรุกราน[ETH.GetNameDef]อยางผิดกฎหมายของประเทศนั้น การควํ่าบาตรครอบคลุมทรัพยากรทุกชนิดที่สามารถใชผลิตยุทโธปกรณสงครามได โดยมีผลทันทีและจะคงอยูจนกวาประเทศนั้นจะยุติการสูรบกับ[ETH.GetNameDef]"
 BBA_italo_ethiopian_war_events.10.a: "นี่คือสิ่งที่ถูกตอง"
 BBA_italo_ethiopian_war_events.10.b: "เราเสี่ยงกับเศรษฐกิจของเราไมได"
 BBA_italo_ethiopian_war_events.10.c: "ไม [ITA.GetName]คือมิตรของเรา"
 leave_the_league_of_nations_tt: "§Y[ROOT.GetName]§! ออกจากสันนิบาตชาติ"
 BBA_italo_ethiopian_war_events.11.t: "สันนิบาตชาติเรียกรองใหปดคลองสุเอซ"
 BBA_italo_ethiopian_war_events.11.desc: "ผูแทนจาก[ETH.GetName]ในสันนิบาตชาติไดรองขอใหปดคลองสุเอซตอ[ITA.GetName] เพื่อเพิ่มการลงโทษตอ[ITA.GetNameDef] หลังการอภิปรายอยางยาวนาน คณะมนตรีก็ตัดสินใจทําตามคํารองขอ ดังนั้น[ROOT.GetNameDef]จึงไดรับมอบหมายภารกิจใหปดกั้นการสัญจรของ[ITA.GetAdjective]ผานคลอง"
 BBA_italo_ethiopian_war_events.11.a: "นี่นาจะบั่นทอนความพยายามทําสงครามของพวกเขา"
 BBA_italo_ethiopian_war_events.11.b: "เราจะไมทําเชนนั้น"
 suez_blocked_sanctions_tt: "§Y[ITA.GetName]§! จะถูกหามใชคลองสุเอซ"
 BBA_italo_ethiopian_war_events.12.t: "[FROM.GetName]ปฏิเสธที่จะปดคลองสุเอซ"
 BBA_italo_ethiopian_war_events.12.desc: "[FROM.GetLeader]แจงตอคณะมนตรีสันนิบาตชาติวา[FROM.GetNameDef]จะไมปดคลองสุเอซตอ[ITA.GetName] นี่เปนการละเมิดขอตกลงระหวางประเทศอยางชัดแจง และเมื่อถูกเรงใหปฏิบัติตาม [FROM.GetName]ก็เพียงประกาศวาจะถอนตัวออกจากสันนิบาตชาติ"
 BBA_italo_ethiopian_war_events.12.a: "ไวใจใครไมไดจริงๆ สินะ?"
 BBA_italo_ethiopian_war_events.13.t: "[FROM.GetName]ปดคลองสุเอซตอ[ITA.GetName]"
 BBA_italo_ethiopian_war_events.13.desc: "หลังมติของสันนิบาตชาติ [FROM.GetLeader]ไดประกาศตอสาธารณะวาการเดินเรือของ[ITA.GetAdjective]ผานคลองสุเอซไมไดรับอนุญาตอีกตอไป เรือของ[ITA.GetAdjective]ลําใดที่พยายามผานคลองจะถูกยึดพรอมริบสินคา จนกวา[ITA.GetName]จะยุติการรุกราน[ETH.GetNameDef]"
 BBA_italo_ethiopian_war_events.13.a: "นี่เปนการโจมตีที่หนักหนวงตอพวกเขา!"
 BBA_italo_ethiopian_war_events.14.t: "มติสันนิบาตชาติใหสนับสนุน[ETH.GetName]"
 BBA_italo_ethiopian_war_events.14.desc: "คณะมนตรีสันนิบาตชาติไดอภิปรายคํารองขอของ[ETH.GetName]ใหมีการแทรกแซงทางทหารในสงครามกับอิตาลี ทายที่สุดคณะมนตรีไมไดไปไกลถึงขั้นเรียกรองใหแทรกแซงเต็มรูปแบบ แตไดออกแถลงการณแนะนําใหประเทศสมาชิกสนับสนุน[ETH.GetName]ในทุกทางที่ทําได รวมถึงอาจอนุญาตใหอาสาสมัครเขารวมรบฝาย[ETH.GetName]ในความขัดแยงนี้"
 BBA_italo_ethiopian_war_events.14.a: "เราควรจัดการเรื่องนี้อยางเปนระบบ"
 BBA_italo_ethiopian_war_events.14.b: "ถาผูคนอยากไปก็..."
 BBA_italo_ethiopian_war_events.14.c: "ไมมีประโยชนที่จะสงพลเมืองของเราไปตายในตางแดน"
 BBA_italo_ethiopian_war_events.14.d: "เรามีสงครามของเราเองที่ตองสู"
 ETH_volunteers_leave_3000: "นอกเหนือจากคณะเดินทางที่จัดตั้งอยางเปนทางการ พลเมือง[ROOT.GetAdjective] 3000 คนไดออกเดินทางไปรวมกับกองกําลัง[ETH.GetAdjective]"
 ETH_volunteers_leave_2000: "พลเมือง[ROOT.GetAdjective] 2000 คนไดออกเดินทางไปรวมกับกองกําลัง[ETH.GetAdjective]"
 ETH_volunteers_leave_200: "แมจะขัดกับจุดยืนอยางเปนทางการ พลเมือง[ROOT.GetAdjective]ราว 200 คนไดออกเดินทางไปรวมกับกองกําลัง[ETH.GetAdjective]"
 BBA_italo_ethiopian_war_events.15.t: "คํารองขอความชวยเหลือระหวางประเทศของเรา"
 BBA_italo_ethiopian_war_events.15.desc_a: "ผลจากมติของสันนิบาตชาติที่อนุญาตใหสนับสนุน[ROOT.GetName] อาสาสมัครจากทั่วโลกไดเดินทางมาถึง และกําลังจัดตั้งเปนกองพลนอยนานาชาติ หวังวาขีดความสามารถในการรบของพวกเขาจะเทียบเทากับความกระตือรือรน"
 BBA_italo_ethiopian_war_events.15.desc_b: "แมสันนิบาตชาติจะมีมติอนุญาตใหสนับสนุน[ROOT.GetName]แลว แตนาเสียดายที่อาสาสมัครที่มาชวยเหลือความพยายามทําสงครามของเรามีจํานวนนอยมาก หวังวาขีดความสามารถในการรบของนักสูเพื่อเสรีภาพผูกลาเหลานี้จะเทียบเทากับความกระตือรือรนของพวกเขา"
 BA_italo_ethiopian_war_events.15.desc_b: "นาเสียดายที่สันนิบาตชาติไมยอมสงกองกําลังทหารมาชวยเรา แตเพียงสนับสนุนใหประเทศสมาชิกชวยเหลือเรา ซึ่งทายที่สุดก็ไมไดกอใหเกิดการสนับสนุนที่สําคัญใดๆ เลย มีอาสาสมัครใหมมาถึงเพียงหยิบมือเดียว"
 BBA_italo_ethiopian_war_events.15.a: "ดี"
 BBA_italo_ethiopian_war_events.15.b: "นาเสียดาย"
 BBA_italo_ethiopian_war_events.16.t: "ความชวยเหลือกําลังมา?"
 BBA_italo_ethiopian_war_events.16.desc: "สันนิบาตชาติไมไดไปไกลถึงขั้นพยายามจัดตั้งกองกําลังทหารเพื่อขับไล[ITA.GetName]ออกจาก[ROOT.GetName] อยางไรก็ตาม สันนิบาตไดสนับสนุนใหประเทศสมาชิกสงกองกําลังมาชวยฟนฟูสถานะเดิม มีสัญญาณวาหลายชาติกําลังจัดเตรียมกองกําลังเดินทาง รวมถึงประเทศอยาง[FROM.GetName] ยังตองรอดูวานี่เปนเพียงคําพูด หรือพวกเขาจะมาชวยเราจริงๆ"
 BBA_italo_ethiopian_war_events.16.a: "เราคงตองรอดูกันตอไป"

 BBA_italo_ethiopian_war_events.20.t: "[ETH.GetLeader]ปฏิเสธที่จะยอมแพ"
 BBA_italo_ethiopian_war_events.20.desc: "แมกองกําลัง[ETH.GetAdjective]จะยอมจํานนแลว แต[ETH.GetLeader]ก็ปฏิเสธที่จะยอมแพ มีขาวลือวา[ETH.GetLeader.GetSheHe]ไดรับอนุญาตใหจัดตั้งรัฐบาลพลัดถิ่นใน[?ETH.host_nation.GetNameDef] เราไดยื่นหนังสือประทวงอยางเปนทางการตอรัฐบาล[?ETH.host_nation.GetAdjective]แลว"
 BBA_italo_ethiopian_war_events.20.a: "การตอสูยังคงดําเนินตอไป"
 ITA_occupation_tt: "ในทางเทคนิค [ITA.GetName]จะยังคงอยูในภาวะสงครามกับรัฐบาลพลัดถิ่นของ[ETH.GetName] จนกวา[ETH.GetName]จะไมมีรัฐใดในครอบครองอีก"

 BBA_italo_ethiopian_war_events.100.t: "คํารองขอจาก[FROM.GetNameDef]"
 BBA_italo_ethiopian_war_events.100.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดเขาพบรัฐบาลพรอมคํารองขออยางเปนทางการจาก[FROM.GetLeader] เพื่อขออนุญาตจัดตั้งรัฐบาลพลัดถิ่นชั่วคราวที่นี่ใน[ROOT.GetName] หากสงครามกับ[ITA.GetName]ดําเนินไปอยางเลวราย การตอบรับยอมทําใหการรักษาความสัมพันธอันดีกับ[ITA.GetName]ยากขึ้นอยางแนนอน"
 BBA_italo_ethiopian_war_events.100.a: "ยินดีตอนรับพวกเขาที่นี่"
 BBA_italo_ethiopian_war_events.100.b: "เราไมอาจอนุญาตเรื่องนี้ได"

 BBA_italo_ethiopian_war_events.101.t: "[FROM.GetNameDefCap]ตอบรับคํารองขอใหเปนที่ตั้งรัฐบาล"
 BBA_italo_ethiopian_war_events.101.desc: "รัฐบาล[FROM.GetAdjective]ไดตอบรับคํารองขอใหเปนประเทศเจาบานสําหรับ[ROOT.GetLeader]หากมีความจําเปน"
 BBA_italo_ethiopian_war_events.101.a: "เรื่องที่ตองกังวลลดลงไปหนึ่งเรื่อง"
 change_focus_to_from_tt: "เพิ่มแผนยุทธศาสตรใหมให§Y[ROOT.GetNameDef]§!ซึ่งใชไดระหวางลี้ภัยอยูใน§Y[FROM.GetNameDef]§!"
 BBA_italo_ethiopian_war_events.102.t: "[FROM.GetNameDefCap]ปฏิเสธคํารองขอของ[ROOT.GetAdjective]"
 BBA_italo_ethiopian_war_events.102.desc: "นาเสียดายที่รัฐบาล[FROM.GetAdjective]ไมกลาทําให[ITA.GetLeader]ขุนเคือง พวกเขาปฏิเสธคํารองขอของเราที่จะจัดตั้งรัฐบาลชั่วคราวที่นั่นหาก[ETH.GetName]ลมสลาย"
 BBA_italo_ethiopian_war_events.102.a: "ถาเชนนั้นเราควรลองที่อื่น"
 BBA_italo_ethiopian_war_events.110.t: "สันนิบาตชาติเรียกรองสันติภาพ"
 BBA_italo_ethiopian_war_events.110.desc: "สันนิบาตชาติไดเรียกรองใหยุติการสูรบระหวาง[ROOT.GetName]และ[FROM.GetName]ในทันที มติของคณะมนตรีใหสิทธิ์แกรัฐสมาชิกในการประกาศสงครามกับ[ROOT.GetDameDef]หากเราปฏิเสธที่จะปฏิบัติตาม"
 BBA_italo_ethiopian_war_events.110.a: "เราตองยอมรับไปกอน"
 BBA_italo_ethiopian_war_events.110.b: "พวกเขาไมกลาทําอะไรหรอก"
 BBA_italo_ethiopian_war_events.111.t: "[FROM.GetLeader]ยอมรับสันติภาพ"
 BBA_italo_ethiopian_war_events.111.desc: "หลังมติของคณะมนตรีสันนิบาตชาติ รัฐบาล[FROM.GetAdjective]ภายใตการนําของ[FROM.GetLeader]ก็ไดสติในที่สุด สนธิสัญญาสันติภาพที่สันนิบาตชาติรางขึ้นไดคืนพรมแดนกอนสงคราม แตนาเสียดายที่ไมมีการชดเชยใดๆ ให[ROOT.GetName]สําหรับความเสียหายทั้งหมด ถึงกระนั้นก็จะทําใหเรามีเวลาเริ่มฟนฟูประเทศ"
 BBA_italo_ethiopian_war_events.111.a: "ชัยชนะในระดับหนึ่ง"
 BBA_italo_ethiopian_war_events.112.t: "[FROM.GetName]ทาทายสันนิบาตชาติ"
 BBA_italo_ethiopian_war_events.112.desc: "แมจะถูกสมาชิกคณะมนตรีสันนิบาตชาติขูวาจะทําสงคราม [FRON.GetLeader]ยังคงมุงมั่นที่จะทําลาย[ROOT.GetName] คณะมนตรีไดสั่งใหยุติการสูรบทันที แต[FROM.GetName]ปฏิเสธที่จะปฏิบัติตามอยางโจงแจง"
 BBA_italo_ethiopian_war_events_wargoal_tt: "มหาอํานาจในสันนิบาตชาติสามารถไดเปาหมายสงครามตอ[ROOT.GetName]"
 BBA_italo_ethiopian_war_events.112.a: "เราจะตองสูใหหนักยิ่งกวาเดิม"
 BBA_italo_ethiopian_war_events.113.t: "[FROM.GetName]ปฏิเสธที่จะปฏิบัติตามมติสันนิบาตชาติ"
 BBA_italo_ethiopian_war_events.113.desc: "สันนิบาตชาติไดเรียกรองให[FROM.GetNameDef]ยุติการรุกราน[ETH.GetName]ในทันที อยางไรก็ตาม [FROM.GetLeader]ยังคงแข็งขอและปฏิเสธที่จะปฏิบัติตาม นี่เปนการละเมิดกฎระหวางประเทศอยางโจงแจง และคณะมนตรีไดเรียกรองใหนานาชาติดําเนินการตอ[FROM.GetNameDef]"
 BBA_italo_ethiopian_war_events.113.a: "หากกําลังคือภาษาเดียวที่พวกเขาเขาใจ"
 BBA_italo_ethiopian_war_events.113.b: "เราไมอาจปลอยใหสันนิบาตชาติกําหนดนโยบายตางประเทศของเรา"

 BBA_italo_ethiopian_war_events.120.t: "ความพายแพยับเยินใน[FROM.GetName]"
 BBA_italo_ethiopian_war_events.120.desc: "สงครามใน[FROM.GetName]ไมเปนไปตามที่คาดหวัง ชาติอันภาคภูมิของเรากําลังกลายเปนตัวตลกของยุโรปอยางรวดเร็ว และฝูงชนใน[ROOT.GetCapitalVictoryPointName]ก็เริ่มกระสับกระสาย การปฏิวัติอาจอยูแคเอื้อม บัดนี้[FROM.GetLeader]ไดยื่นขอเสนอสันติภาพมาใหเรา"
 BBA_italo_ethiopian_war_events.120.a: "เราควรมุงไปที่เรื่องที่งายกวานี้"
 ETH_peace_treaty_tt: "\n§Yเงื่อนไขสนธิสัญญาสันติภาพ§!: \n"
 ETH_peace_treaty_part_2_tt: "[ETH.GetFlag][ETH.GetName]:"
 BBA_italo_ethiopian_war_events.120.b: "เรายังชนะได!"
 BBA_italo_ethiopian_war_events.121.t: "ชัยชนะ!"
 BBA_italo_ethiopian_war_events.121.desc: "การตอสูอันยาวนานและขมขื่นไดสิ้นสุดลงในที่สุด [FROM.GetLeader]ไดยอมรับขอเรียกรองของเราและยุติการรุกราน[ROOT.GetName] [ROOT.GetLeader]กลายเปนวีรบุรุษแหงวันนี้ [ROOT.GetLeader.GetSheHeCap]ไดนําพา[ROOT.GetNameDef]ผานชวงเวลาอันยากลําบากนี้อยางมั่นคง และขับไลมหาอํานาจอาณานิคมยุโรปไดสําเร็จ"
 BBA_italo_ethiopian_war_events.121.a: "นี่คือสัญญาณแหงการเริ่มตนใหมของแอฟริกา"
 ETH_gets_the_following_states_tt: "[ETH.GetNameDefCap]จะไดรับรัฐตอไปนี้:"
 BBA_italo_ethiopian_war_events.122.t: "[FROM.GetLeader]ดื้อดึงปฏิเสธ"
 BBA_italo_ethiopian_war_events.122.desc: "แม[ROOT.GetAdjective]จะประสบความสําเร็จในสงคราม แตผูนํา[FROM.GetAdjective]ก็ปฏิเสธที่จะยอมรับความพายแพ [ROOT.GetLeader]ไดแสดงใหโลกเห็นวาชาติแอฟริกันสามารถยืนหยัดตอสูกับผูรุกรานชาวยุโรปได และนั่นก็เปนชัยชนะในตัวมันเองแลว บัดนี้เราตองทําใหพวกเขาคุกเขาลง"
 BBA_italo_ethiopian_war_events.122.a: "สงครามเขาสูชวงใหม"
 ethiopia_recognized_flag: "เอธิโอเปยสามารถเรียกพันธมิตรเขารวมสงครามได"

 BBA_italo_ethiopian_war_events.200.t: "ชื่อเสียงในระดับนานาชาติเพิ่มขึ้น"
 BBA_italo_ethiopian_war_events.200.desc: "ความเห็นอกเห็นใจของสาธารณชนตออุดมการณของ[ROOT.GetName]แข็งแกรงมาตลอด อยางไรก็ตาม ไมมีใครคาดคิดวาประเทศนี้จะตานทานไดนานเกินหนึ่งเดือนหรือราวนั้น การตอตานผูรุกราน[ITA.GetAdjective]อยางไมลดละของเรากําลังชนะใจผูคนทั่วโลก และผูนําประเทศตางๆ เริ่มใหความสําคัญกับ[ROOT.GetName]อยางจริงจังมากขึ้น"
 BBA_italo_ethiopian_war_events.200.a: "หากพวกเขาทําไดมากกวาแคพูดก็คงดี"
 BBA_italo_ethiopian_war_events.201.t: "ขวัญกําลังใจกองทัพพุงสูง"
 BBA_italo_ethiopian_war_events.201.desc: "ดวยการตานทานมาไดนานขนาดนี้ทามกลางอุปสรรคเชนนี้ ขวัญกําลังใจของพลทหารเริ่มกลับมาดีขึ้นอีกครั้ง เมื่อความกระตือรือรนในตอนแรกจางหายไป หลายคนเริ่มคิดวาความพายแพเปนเรื่องที่หลีกเลี่ยงไมได แตตอนนี้เริ่มมีการพูดถึงชัยชนะที่อาจเกิดขึ้นอีกครั้ง และยังมีสัญญาณชัดเจนวาหนวยตางๆ กําลังปรับตัวเขากับรูปแบบการรบแบบใหม"
 BBA_italo_ethiopian_war_events.201.a: "เราตองตอยอดจากจุดนี้เพื่อผลักดันศัตรูออกจาก[ROOT.GetName]"
 ETH_morale_boost_tt: "ปรับ§Y[GetEthiopianArmySpiritName]§!ดังนี้:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§! \n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!"

 BBA_italo_ethiopian_war_events.202.t: "ศัตรูหนีทัพ"
 BBA_italo_ethiopian_war_events.202.desc: "ในตอนแรกเริ่มจากเพียงไมกี่คน หนวยทหารนอกแบบบางหนวยของศัตรูเริ่มสิ้นศรัทธา และบางสวนก็เปลี่ยนขางมาสูเพื่อเรา บัดนี้ทหารกําลังหนีทัพกันเปนจํานวนมาก และไมใชแคทหารนอกแบบเทานั้น ผูหนีทัพบางคนถึงกับนํายุทโธปกรณหนักติดตัวมาดวย"
 BBA_italo_ethiopian_war_events.202.a: "กระแสกําลังพลิกผัน"
 
 BBA_italo_ethiopian_war_events.203.t: "อยูรอดทามกลางอุปสรรคทั้งปวง"
 BBA_italo_ethiopian_war_events.203.desc: "บรรดาผูที่เรียกตัวเองวาผูเชี่ยวชาญใหเวลาเราไมถึงเดือนตั้งแตสงครามเริ่ม แตเราตานทานกองทัพที่ไดชื่อวาทันสมัยมาไดนานกวานั้นมาก เรารูวาพวกเขารบอยางไร และเราไดปรับตัวรับมือแลว ศรัทธาของประชาชนกําลังกลับคืนมา ทหารใหมหลั่งไหลมาสมทบใตธงของเราจากทั้งใกลและไกล"
 BBA_italo_ethiopian_war_events.203.a: "เราจะขับไลผูรุกรานลงทะเล"
 ETH_for_the_duration_of_the_war_tt: "ตลอดระยะเวลาของสงคราม:"

 BBA_italo_ethiopian_war_events.204.t: "สงครามประชาชน"
 BBA_italo_ethiopian_war_events.204.desc: "ทุกหนแหง ประชาชนกําลังลุกฮือตอตานผูรุกราน ทั้งเด็กและผูใหญตางเขารวมขบวนการตอตาน บีบให[ITA.GetName]ตองทุมเทหนักยิ่งขึ้นสําหรับทุกความคืบหนาที่ไดมา ชาวบานที่สูรบไมไดก็ชวยผลิตอาวุธและยุทโธปกรณใหกองทัพ"
 BBA_italo_ethiopian_war_events.204.a: "ชัยชนะใกลเขามาแลว"

 BBA_italo_ethiopian_war_events.300.t: "ประชาชนอิตาลีเริ่มกังวล"
 BBA_italo_ethiopian_war_events.300.desc: "กองทัพของเราดิ้นรนที่จะรุกคืบใน[ETH.GetName] และการไรความคืบหนานี้ก็รับรูไดแมแตใน[ITA.GetName] ประชาชน[ITA.GetAdjective]เริ่มสิ้นศรัทธาในสงคราม และแมแตในความสามารถของผูนําที่จะควาชัยชนะไดในทายที่สุด"
 BBA_italo_ethiopian_war_events.300.a: "พวกเขาชางไรศรัทธาเสียจริง!"

 BBA_italo_ethiopian_war_events.301.t: "กองทัพแหงแอฟริกาหมดกําลังใจ"
 BBA_italo_ethiopian_war_events.301.desc: "กองทัพของเราใน[ETH.GetName]แทบไมมีความคืบหนาและสูญเสียอยางหนัก การตอตานดุเดือดและเราตองสูอยางหนักเพื่อทุกตารางนิ้วที่ไดมา ขวัญกําลังใจทั่วทั้งกองทัพตกตํ่าที่สุดเปนประวัติการณ และเรายังไดรับรายงานวาบางกองรอยปฏิเสธที่จะปฏิบัติตามคําสั่งโดยตรง"
 BBA_italo_ethiopian_war_events.301.a: "เราตองพลิกสถานการณสงคราม!"

 BBA_italo_ethiopian_war_events.302.t: "ความไมสงบในอาณานิคม"
 BBA_italo_ethiopian_war_events.302.desc: "การดิ้นรนของเราใน[ETH.GetName]เริ่มสงผลกระทบเปนลูกโซไปยังที่อื่น เราไดรับรายงานจากอาณานิคมวาผูอยูใตปกครองของเราเริ่มขัดขืนเจาหนาที่ทองถิ่นทั้งในเรื่องเล็กและเรื่องใหญ ดูเหมือนพวกเขาจะมองวาการไรความคืบหนาในสงครามคือความออนแอ และกําลังทดสอบความแข็งแกรงของเรา"
 BBA_italo_ethiopian_war_events.302.a: "ขาวที่นากังวล!"
 ITA_colonial_unrest_tt: "ความไมสงบในอาณานิคม: §R+15%§!"

 BBA_italo_ethiopian_war_events.303.t: "ประชาชนอิตาลีตั้งคําถามตอความพยายามทําสงคราม"
 BBA_italo_ethiopian_war_events.303.desc: "ความลมเหลวใน[ETH.GetAdjevtive]ทําใหชาว[ITA.GetAdjective]หันมาตอตานสงคราม ผูคนวิพากษวิจารณรัฐบาลและผูนําของเราอยางเปดเผยมากขึ้นเรื่อยๆ และแมแตเสียงกระซิบถึงทางเลือกอื่นก็ไมใชเรื่องแปลกอีกตอไป"
 BBA_italo_ethiopian_war_events.303.a: "พวกทรยศ!"

 BBA_italo_ethiopian_war_events.304.t: "การหนีทัพครั้งใหญ"
 BBA_italo_ethiopian_war_events.304.desc: "สถานการณใน[ETH.GetName]เลวรายขณะที่ขวัญกําลังใจของทหารยังคงดิ่งลง! กองทัพติดหลมอยูหลายจุดและเผชิญการหนีทัพครั้งใหญ ทําใหกําลังของเราลดนอยลงแมไมตองอาศัยฝมือของชาว[ETH.GetAdjective]! เรายังไดรับรายงานวามีนายทหารคนหนึ่งถูกรถบรรทุกทับ เราบันทึกไววาเปนอุบัติเหตุ"
 BBA_italo_ethiopian_war_events.304.a: "ขี้ขลาดกันทั้งนั้น!"
 ITA_desertions_east_africa_tt: "กองทัพในแอฟริกาตะวันออกประสบปญหาการหนีทัพ"

 BBA_italo_ethiopian_war_events.305.t: "ความวุนวายในอาณานิคม"
 BBA_italo_ethiopian_war_events.305.desc: "สิ่งที่เริ่มจากการดื้อแพงในอาณานิคมไดลุกลามจนเกือบกลายเปนการกบฏเต็มรูปแบบ! ความลมเหลวของเราในการจัดการกับการดิ้นรนตอเนื่องใน[ETH.GetName]ทําใหผูอยูใตปกครองของเราเชื่อวาเราออนแอ และพวกเขาจะดีกวาหากปราศจากการปกครองของเรา"
 BBA_italo_ethiopian_war_events.305.a: "ชางอวดดีนัก!"
 ITA_colonial_uproar_tt: "ความไมสงบในอาณานิคมครั้งใหญ: §R+80%§!"

 BBA_italo_ethiopian_war_events.400.t: "ถึงเวลาจัดการกับ[AFA.GetNameDef]"
 BBA_italo_ethiopian_war_events.400.desc: "[AFA.GetLeader] สุลตานแหง[AFA.GetNameDef] อยูภายใตอิทธิพลอันแข็งแกรงของ[ROOT.GetAdjective]มาชานาน เชนเดียวกับในสงครามครั้งกอน เขายังคงวางตัวเปนกลาง แมในทางการจะเปนสวนหนึ่งของจักรวรรดิ[ETH.GetAdjective] อันที่จริง เหตุผลเดียวที่สุลตานยังคงมีอํานาจอยูก็เพราะความเมตตาของ[ROOT.GetAdjective] ประเทศนี้อาจขายแนวชายฝงให[ROOT.GetName]ไปแลว แตก็ยังเปนอุปสรรคตอการพิชิตของเรา การยึด[?ITA.ITA_capture_state.GetName]ไดอาจเพียงพอที่จะโนมนาวใหสุลตานยอมยกดินแดนที่เหลือของเขา"
 BBA_italo_ethiopian_war_events.400.a: "สงคําขาด เรียกรองใหยอมอยูใตปกครองโดยสมบูรณ"
 BBA_italo_ethiopian_war_events.400.b: "เราจัดการกับ[AFA.GetNameDef]ทีหลังได ตอนนี้ยังไมใชเวลา"
 BBA_italo_ethiopian_war_events.401.t: "คําขาดจาก[FROM.GetName]"
 BBA_italo_ethiopian_war_events.401.desc: "ชาวอิตาลีเรียกรองใหเรามอบรัฐทั้งหมดใหอยูใตการควบคุมของพวกเขา เพื่อใชเปนพื้นที่ระดมพลในสงครามกับ[ETH.GetName] การยอมรับเทากับเปนการสิ้นสุดเอกราชของ[ROOT.GetNAme] แตการปฏิเสธยอมหมายถึงการถูกรุกรานอยางแนนอน"
 BBA_italo_ethiopian_war_events.401.a: "ไมมีประโยชนที่จะตอตาน"
 BBA_italo_ethiopian_war_events.401.b: "หากพวกเขาตองการดินแดนของเรา ก็ตองยึดเอาดวยกําลัง"
 BBA_italo_ethiopian_war_events.402.t: "[FROM.GetLeader]ยอมถอย"
 BBA_italo_ethiopian_war_events.402.desc: "[FROM.GetNameDefCap]ยอมรับขอเรียกรองของเราใหใชดินแดน[FROM.GetAdjective]เปนฐานปฏิบัติการตอ[ETH.GetName] ซึ่งเทากับเปนการสิ้นสุดเอกราชของ[FROM.GetName]"
 BBA_italo_ethiopian_war_events.402.a: "ดี เคลื่อนพลเขาไปยึดครองดินแดนกันเถอะ"
 BBA_italo_ethiopian_war_events.403.t: "[FROM.GetNameDefCap]ยังคงแข็งขอ"
 BBA_italo_ethiopian_war_events.403.desc: "นาเสียดายที่แรงกดดันทางการทูตไมเพียงพอที่จะทําใหอิตาลีไดอํานาจเหนือ[FROM.GetNameDef] [FROM.GetLeader]ยังคงยืนกรานวาประเทศของเขาสามารถตานทานแสนยานุภาพทางทหารของ[ROOT.GetName]ได"
 BBA_italo_ethiopian_war_events.403.a: "เราคงตองใชวิธีที่ยากลําบาก"

 BBA_italo_ethiopian_war_events.500.t: "ขอเรียกรองใหทําสันติภาพ"
 BBA_italo_ethiopian_war_events.500.desc: "[GetItaloEthiopianPeaceDemands]"
 BBA_italo_ethiopian_war_events.500.desc_guarantees: "ฝาย[FROM.GetAdjective]เรียกรองใหเราเจรจาสันติภาพกับ[ETH.GetName]หากตองการความชวยเหลือจากพวกเขาในการตอตานเยอรมัน หากเราลงนามสนธิสัญญากับชาวเอธิโอเปย เราตองยอมสละดินแดนบางสวนที่พิชิตมา ขณะที่เก็บสวนอื่นไว สันติภาพเชนนี้ยอมเปนยาขมสําหรับทั้งสองประเทศ แตอาจคุมคาเมื่อตองเผชิญหนากับเยอรมัน"
 BBA_italo_ethiopian_war_events.500.desc_territories: "อังกฤษตองการใหเรายุติสงครามกับชาวเอธิโอเปยเพื่อแลกกับการมอบดินแดนอาณานิคมบางสวนของพวกเขาใหเรา หากเราลงนามสนธิสัญญากับพวกเขา เราตองยอมสละดินแดนบางสวนที่พิชิตมา ขณะที่เก็บสวนอื่นไว สันติภาพเชนนี้ยอมเปนยาขมสําหรับทั้งสองประเทศ เมื่อคํานึงถึงเลือด หยาดเหงื่อ และนํ้าตาทั้งหมดที่เราสูญเสียไป"
 BBA_italo_ethiopian_war_events.500.a: "สันติภาพอันขมขื่นก็ได"
 BBA_italo_ethiopian_war_events.500.b: "เราตองการการสนับสนุนจากพวกเขา"
 BBA_italo_ethiopian_war_events.500.c: "เราสูมาหนักเกินไปแลว!"
 BBA_italo_ethiopian_war_events.500_tt: "สงครามยังดําเนินตอไป"

 BBA_italo_ethiopian_war_events.501.t: "ถูกบีบใหเขาสูโตะเจรจาสันติภาพ"
 BBA_italo_ethiopian_war_events.501.desc: "ประเทศเจาบานผูเอื้อเฟอที่รับเราไวหลังจากชาติของเราถูก[ITA.GetNameDefCap]ยึดครอง ดูเหมือนจะเริ่มเบื่อหนายเราแลว พวกเขากําลังวางแผนลับหลังเพื่อบีบใหเราลงนามสนธิสัญญาสันติภาพกับผูรุกรานชาวอิตาลีอันชั่วราย นาเศราที่เราแทบทําอะไรไมได"
 BBA_italo_ethiopian_war_events.501.a: "เราไมมีทางเลือก"
 BBA_italo_ethiopian_war_events.501.b: "เราจะสูตอไป!"
 BBA_ethiopia_is_expelled_tt: "รัฐบาลของ§Y[ETH.GetNameWithFlag]§!ถูกขับออกจาก§Y[ENG.GetNameWithFlag]§! และสามารถไปจัดตั้งรัฐบาลพลัดถิ่นที่อื่นได"

 BBA_italo_ethiopian_war_events.502.t: "ไมมีสนธิสัญญาสันติภาพ"
 BBA_italo_ethiopian_war_events.502.desc: "[GetItalyRefusesPeaceTalks]"
 BBA_italo_ethiopian_war_events.502.desc_guarantees: "รัฐบาลอิตาลีปฏิเสธขอเรียกรองของเราใหทําสันติภาพกับ[ETH.GetNameDefCap]เพื่อแลกกับความชวยเหลือจากเราในการตอตานเยอรมัน พวกเขาจะตองเผชิญการโจมตีครั้งนี้ดวยตนเอง"
 BBA_italo_ethiopian_war_events.502.desc_territories: "รัฐบาลอิตาลีปฏิเสธขอเรียกรองของเราใหทําสันติภาพกับ[ETH.GetNameDefCap]เพื่อแลกกับดินแดนอาณานิคมบางสวนของเรา นี่ยิ่งแสดงใหเห็นวาเราไมอาจทําขอตกลงใดๆ กับพวกอาชญากรเชนนี้ได!"
 BBA_italo_ethiopian_war_events.502.a: "นาเสียดายจริงๆ"

 BBA_italo_ethiopian_war_events.503.t: "[ETH.GetNameDefCap]ปฏิเสธการเจรจาสันติภาพ"
 BBA_italo_ethiopian_war_events.503.desc: "รัฐบาลเอธิโอเปยปฏิเสธขอเรียกรองของอังกฤษใหลงนามขอตกลงสันติภาพกับเรา สงผลให[ENG.GetLeader]ขับไลชาวเอธิโอเปยออกจาก[ENG.GetNameDef] ซึ่งเปนสัญญาณชัดเจนตอทุกฝายวาพวกเขาใหคุณคากับความรวมมือของประเทศใดมากกวา สิ่งนี้เปดโอกาสใหเราเสริมความแข็งแกรงใหดินแดนในแอฟริกาของเรายิ่งขึ้น!"
 BBA_italo_ethiopian_war_events.503.a: "เราจะปราบพวกเขาใหราบคาบ"

 BBA_italo_ethiopian_war_events.510.t: "[ITA.GetNameDef]บอนทําลายอํานาจของเอธิโอเปย"
 BBA_italo_ethiopian_war_events.510.desc: "เราไดรับรายงานวาชาวอิตาลีไดเปดฉากปฏิบัติการปลอยขาวเท็จเพื่อบอนทําลายการปกครองและความชอบธรรมของเราในบานเกิด คําโกหกอันชั่วชาเหลานี้อาจโนมนาวผูอยูใตปกครองบางสวนใหเขาขาง[ITA.GetNameDef] และบั่นทอนสิทธิ์ในราชบัลลังกของเรา เราตองฟนฟูการปกครองเหนือเอธิโอเปยกอนที่พวกเขาจะสรางความเสียหายมากกวานี้!"
 BBA_italo_ethiopian_war_events.510.a: "พวกเขาจะตองชดใชกับคําโกหก!"

#Ethiopia - Balance of Power
 BBA_ethiopia_balance_of_power_events.01.t: "การปกครองถูกทาทาย"
 BBA_ethiopia_balance_of_power_events.01.desc_fascism: "การกระจายอํานาจที่เพิ่มขึ้นของ[THIS.GetName] ประกอบกับการขาดแรงสนับสนุนในวงกวางตอคณะผูปกครองและความไมมั่นคงในภูมิภาค ไดลุกลามกลายเปนการกบฏอยางเปดเผยตอรัฐบาลกลาง ผูสนับสนุน$haile_selassie_gugsa$ไดจับอาวุธขึ้นโดยมุงหมายจะยกเขาขึ้นสูราชบัลลังก[THIS.GetAdjective]"
 BBA_ethiopia_balance_of_power_events.01.desc_neutrality: "การกระจายอํานาจที่เพิ่มขึ้นของ[THIS.GetName] ประกอบกับการขาดแรงสนับสนุนในวงกวางตอคณะผูปกครองและความไมมั่นคงในภูมิภาค ไดลุกลามกลายเปนการกบฏอยางเปดเผยตอรัฐบาลกลาง"
 BBA_ethiopia_balance_of_power_events.01.desc_communism: "การรวมศูนยอํานาจที่เพิ่มขึ้นของ[THIS.GetName] ประกอบกับการขาดแรงสนับสนุนในวงกวางตอคณะผูปกครองและความไมมั่นคงในภูมิภาค ไดลุกลามกลายเปนการกบฏอยางเปดเผยตอรัฐบาลกลาง พวกอนาธิปไตยประกาศวาจะปลดปลอยชาติจากการปกครองของเรา"
 BBA_ethiopia_balance_of_power_events.01.a: "เราจะเอาชนะพวกเขา"
 BBA_ethiopia_balance_of_power_events.01.b: "ทําลายผูอางสิทธิ์"
 BBA_ethiopia_balance_of_power_events.01.c: "ทําลายพวกทรยศตอชนชั้น"
 ETH_alternate_fascist_party: "ผูสนับสนุนไฮมาโนต"
 ETH_alternate_fascist_party_long: "ผูสนับสนุน$ETH_hailu_tekle_haymanot$"
 ETH_alternate_neutrality_party: "ผูสนับสนุนเซลาสซี"
 ETH_alternate_neutrality_party_long: "ผูสนับสนุน$ETH_haile_selassie$"

 BBA_ethiopia_balance_of_power_events.10.t: "[ROOT.GetName]แตกสลาย"
 BBA_ethiopia_balance_of_power_events.10.desc: "การกระจายอํานาจอยางคอยเปนคอยไปของ[THIS.GetNameDef]ยอมทําใหรัฐบาลกลางสูญเสียอํานาจไปมากอยางไมนาแปลกใจ บัดนี้ภูมิภาคตางๆ ถึงขั้นประกาศเอกราชจาก[THIS.GetNameDef] เราตองรีบลงมือหากตองการควบคุมภูมิภาคเหลานี้กลับคืนมา"
 BBA_ethiopia_balance_of_power_events.10.a: "คงทําอะไรไมไดแลวละ"
 BBA_ethiopia_balance_of_power_events.10.b: "ทําลายพวกมัน"
 ETH_breakup_tt: "§Rไดรับเอกราชจาก[ROOT.GetName]§!"
 ETH_breakup_fight_tt: "§Rไดรับเอกราชจาก[ROOT.GetName] และ[ROOT.GetName]ประกาศสงครามกับพวกเขา§!"

#BBA_ethiopia_balance_of_power_events.20.t: "Education Reforms" 
#BBA_ethiopia_balance_of_power_events.20.desc: "As we begin to reform [ETH.GetNameDefCap], the issue of the education system has come to the forefront. Making sure the next generation are able to join the workforce is of course our priority. However, we have an opportunity to nudge that generation in a more acceptable moral direction."
#BBA_ethiopia_balance_of_power_events.20.a: "Implementing [ETH.GetLeader]’s plans are their only concern."
#BBA_ethiopia_balance_of_power_events.20.b: "Religion is the opiate of the masses."
#
#BBA_ethiopia_balance_of_power_events.21.t: "[ETH.GetAdjective] Road Improvements"
#BBA_ethiopia_balance_of_power_events.21.desc: "[ETH.GetNameDefCap]’s road network remains limited and hinders the economic development of the country. We now have the budget to implement improvements to the road network, but there is a split over whether we should prioritize expanding the existing network to the benefit of people in their local area, or create highways around the capital to concentrate economic development."
#BBA_ethiopia_balance_of_power_events.21.a: "Prioritize local road expansion in the regions."
#BBA_ethiopia_balance_of_power_events.21.b: "We need to concentrate economic development."

 BBA_ethiopia_balance_of_power_events.22.t: "ปฏิรูปนายทหาร"
 BBA_ethiopia_balance_of_power_events.22.desc: "ประสบการณที่ผานมาแสดงใหเห็นวานายทหารจํานวนมากของเราไมพรอมรับมือกับสงครามสมัยใหม สาเหตุที่นาจะเปนที่สุดของขอบกพรองนี้คือธรรมเนียมเดิมของเราที่มอบยศทหารตามบรรดาศักดิ์ที่สืบทอดทางสายเลือดหรือทางการเมือง แทนที่จะพิจารณาจากความสามารถของบุคคลนั้น ดวยกระแสการปฏิรูปลาสุดทั่ว[ETH.GetNameDef] ถึงเวลาแลวที่จะตัดสินใจเรื่องอนาคตของลําดับชั้นในกองทัพ"
 BBA_ethiopia_balance_of_power_events.22.a: "พวกชาวนาไพรสามัญไมมีความสามารถในการเปนผูนํา"
 BBA_ethiopia_balance_of_power_events.22.b: "ระบบคุณธรรมในกองทัพเปนสิ่งจําเปน"

 BBA_ethiopia_balance_of_power_events.23.t: "การปฏิรูปการศึกษาแบบมาตรฐาน"
 BBA_ethiopia_balance_of_power_events.23.desc: "การปฏิรูปการศึกษาระลอกลาสุดของเราพิสูจนแลววาประสบความสําเร็จ ไมเพียงแตคนหนุมสาวจะจงรักภักดีตอ[ETH.GetLeader]มากขึ้นเรื่อยๆ เทานั้น แตพวกเขายังดูเหมือนจะกดดันพอแมใหปฏิบัติตามแนวทางดวย"
 BBA_ethiopia_balance_of_power_events.23.a: "ระบอบมั่นคงขึ้นทุกวัน"

 BBA_ethiopia_balance_of_power_events.24.t: "การปฏิรูปการศึกษา"
 BBA_ethiopia_balance_of_power_events.24.desc: "การปฏิรูปการศึกษาระลอกลาสุดของเราพิสูจนแลววาประสบความสําเร็จ ลําดับชั้นทางสังคมอันเกาแกของ[ETH.GetNameDef]ถูกตั้งคําถามมากขึ้นเรื่อยๆ เมื่อคนหนุมสาวเรียกรองใหพวกเขาพิสูจนความชอบธรรม แมสิ่งนี้จะกอใหเกิดความตึงเครียดระหวางคนรุนใหมกับคนรุนเกา แตดูเหมือนวาทัศนคติจะเปลี่ยนมาเปนผลดีตอเราในทายที่สุด"
 BBA_ethiopia_balance_of_power_events.24.a: "เวลาอยูขางเรา"

 BBA_ethiopia_balance_of_power_events.25.t: "นายทหารการเมือง"
 BBA_ethiopia_balance_of_power_events.25.desc: "ขณะที่เรารวมศูนยการควบคุมทางการเมืองและเศรษฐกิจของ[ETH.GetName]มากขึ้นเรื่อยๆ ก็ยังคงมีความกังวลอยางมากเกี่ยวกับกองทัพ หากพวกเขาหันมาตอตานเรา เราแทบไมมีโอกาสตานทานขอเรียกรองของพวกเขาได ดวยเหตุนี้เราจึงเริ่มสงนายทหารการเมืองเขาไปในกองทัพ เพื่อใหแนใจวาทหารจะไมมีความคิดที่ไมไดรับอนุมัติ"
 BBA_ethiopia_balance_of_power_events.25.a: "ก็เพื่อประโยชนของพวกเขาเอง"

 BBA_ethiopia_balance_of_power_events.26.t: "ระบบคุณธรรมในกองทัพ"
 BBA_ethiopia_balance_of_power_events.26.desc: "ประสบการณที่ผานมาแสดงใหเห็นวานายทหารจํานวนมากของเราไมพรอมรับมือกับสงครามสมัยใหม สาเหตุที่นาจะเปนที่สุดของขอบกพรองนี้คือธรรมเนียมเดิมของเราที่มอบยศทหารตามบรรดาศักดิ์ที่สืบทอดทางสายเลือดหรือทางการเมือง แทนที่จะพิจารณาจากความสามารถของบุคคลนั้น ดวยกระแสการปฏิรูปลาสุดทั่ว[ETH.GetName] จึงสมควรแลวที่เราจะทําใหความสามารถเปนปจจัยชี้ขาดในการเปนผูนําทางทหาร"
 BBA_ethiopia_balance_of_power_events.26.a: "ระบบคุณธรรมในกองทัพเปนสิ่งจําเปน"

 BBA_ethiopia_balance_of_power_events.30.t: "$ETH_balcho_safo$ กลับมาแลว"
 BBA_ethiopia_balance_of_power_events.30.desc: "อดีตชุมแหงซีดาโม และอดีตเดจัซมัชแหงกองทัพ[FROM.GetAdjective] ไดตอบรับการเรียกรองจาก[FROM.GetLeader]ใหจับอาวุธเพื่อประเทศอีกครั้ง วีรบุรุษแหงอัดวานําทหารใหมจากดินแดนสวนตัวของเขามาดวย หวังวาสิ่งนี้จะชวยขับไลการรุกรานของ[ITA.GetAdjective]ใหถอยกลับไปได"
 BBA_ethiopia_balance_of_power_events.30.a: "การกลับมาของวีรบุรุษตัวจริง"

 BBA_ethiopia_balance_of_power_events.51.t: "เจาที่ดินทองถิ่นเสนอจัดตั้งหนวยทหารรับจาง"
 BBA_ethiopia_balance_of_power_events.51.desc: "เจาที่ดินทองถิ่นใน[?ROOT.ETH_bop_state.GetName]ไดเสนอจะจัดตั้งหนวยทหารและสงเขารวมกองทัพหลวง ทหารเหลานี้จะคัดเลือกจากโจรทองถิ่นและอาสาสมัครตางชาติ จึงจะมาพรอมยุทโธปกรณครบครันและพรอมรบ การสูญเสียอํานาจในตอนนี้ยอมเปนความเสี่ยง แตการไดกําลังพลเพิ่มยอมเพิ่มโอกาสชนะสงครามอยางแนนอน"
 BBA_ethiopia_balance_of_power_events.51.a: "ประเทศตองการความชวยเหลือทุกทางที่หาได"
 BBA_ethiopia_balance_of_power_events.51.b: "เราตองลดจํานวนกองทัพสวนตัว ไมใชเพิ่ม"

 BBA_ethiopia_balance_of_power_events.52.t: "เจาที่ดินทองถิ่นตองการขยายอาณาเขต"
 BBA_ethiopia_balance_of_power_events.52.desc: "เจาที่ดินทองถิ่นใน[?ROOT.ETH_bop_state.GetName]กําลังวางแผนขยายฐานอํานาจและอาณาเขตของตน ในระดับหนึ่งสิ่งนี้จะเปนประโยชนตอประเทศโดยรวม เพราะเขาลงทุนอยางหนักในขีดความสามารถการผลิตในทองถิ่น แตในขณะเดียวกัน การไมหยุดยั้งเรื่องนี้จะทําใหรัฐบาลกลางควบคุม[?ROOT.ETH_bop_state.GetName]ไดหลวมลง"
 BBA_ethiopia_balance_of_power_events.52.a: "ทั้งหมดนี้ดีแลว"
 BBA_ethiopia_balance_of_power_events.52.b: "เรื่องนี้ตองถูกหยุดยั้ง"

 BBA_ethiopia_balance_of_power_events.53.t: "ผูปกครองภูมิภาคตองการผลิตอาวุธ"
 BBA_ethiopia_balance_of_power_events.53.desc: "เจาที่ดินคนหนึ่งใน[?ROOT.ETH_bop_state.GetName]ตองการการสนับสนุนในการตั้งโรงผลิตปนไรเฟลและกระสุนในทองถิ่นที่[?ROOT.ETH_bop_state.GetName] ซึ่งอาจชวยใหกองทัพของเราไดยุทโธปกรณที่ดีขึ้นและเพิ่มขีดความสามารถในการรบของกองทัพ[ROOT.GetAdjective]"
 BBA_ethiopia_balance_of_power_events.53.a: "ตอนนี้การไดปนไรเฟลเพิ่มสําคัญกวาการควบคุม"
 BBA_ethiopia_balance_of_power_events.53.b: "การผลิตอาวุธในมือเอกชนฟงดูอันตรายเกินไป"

 BBA_ethiopia_balance_of_power_events.54.t: "การขาดแคลนเสบียงใน[?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_balance_of_power_events.54.desc: "ประชาชนใน[?ROOT.ETH_bop_state.GetName]หวังพึ่งความชวยเหลือจากรัฐบาลกลาง เหตุการณที่ผานมาทําใหเกิดการขาดแคลนเสบียง และภูมิภาคนี้ตองการการลงทุนเพื่อแกไขสถานการณอยางยิ่ง"
 BBA_ethiopia_balance_of_power_events.54.a: "เราตองทําอะไรสักอยาง"
 ETH_investments_in_state_tt: "\nปรับ§Y$ETH_state_development_dynamic_modifier$§!ดังนี้: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+5%§!"
 BBA_ethiopia_balance_of_power_events.54.b: "นาเสียดายที่ตอนนี้เราทําอะไรไดไมมากนัก"
 ETH_decline_in_state_tt: "\nปรับ§Y$ETH_state_development_dynamic_modifier$§!ดังนี้: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R-5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §R-5%§!"
 BBA_ethiopia_balance_of_power_events.54.c: "เจาหนาที่ทองถิ่นใน[?ROOT.ETH_bop_state.GetName]จะตองจัดการปญหาเอง"

 BBA_ethiopia_balance_of_power_events.55.t: "ชาวบานรองเรียนวาถูกกดขี่"
 BBA_ethiopia_balance_of_power_events.55.desc: "มีการรองเรียนผูปกครองทองถิ่นของ[?ROOT.ETH_bop_state.GetName]หลายกรณี ประชาชนรูสึกวาถูกชนชั้นสูงปฏิบัติอยางไมเปนธรรม การสอบสวนเบื้องตนพบวาขอรองเรียนของพวกเขามีมูลอยูบาง อยางไรก็ตาม การแทรกแซงของรัฐบาลกลางจะไมเปนที่พอใจของขุนนางคนอื่นๆ"
 BBA_ethiopia_balance_of_power_events.55.a: "เราตองเชือดไกใหลิงดู"
 BBA_ethiopia_balance_of_power_events.55.b: "รัฐบาลกลางไมควรเขาไปแทรกแซงเรื่องในทองถิ่น"

 BBA_ethiopia_balance_of_power_events.56.t: "เศรษฐกิจเฟองฟูใน[?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_balance_of_power_events.56.desc: "ความพยายามของรัฐบาลกลางในการปรับปรุงการบริหารของ[ROOT.GetName]และผนวกรวมภูมิภาคตางๆ ไดนําไปสูความเฟองฟูทางเศรษฐกิจใน[?ROOT.ETH_bop_state.GetName] ภูมิภาคนี้ดึงดูดผูคนจากสวนอื่นของประเทศใหยายเขามา และอุตสาหกรรมก็กําลังขยายตัว"
 BBA_ethiopia_balance_of_power_events.56.a: "เราควรใชโอกาสนี้ผลักดันกระบวนการรวมศูนยอํานาจใหไปไกลยิ่งขึ้น"
 BBA_ethiopia_balance_of_power_events.56.b: "เราควรมุงลงทุนกลับไปในภูมิภาคเพื่อใหรุงเรืองยิ่งขึ้น"


#Imperial Ethiopia
 BBA_ethiopia_exile_events.01.t: "[FROM.GetLeader]พรอมยึด[FROM.GetName]คืน"
 BBA_ethiopia_exile_events.01.desc: "ผูนํา[FROM.GetAdjective]พลัดถิ่น [FROM.GetLeader] พรอมอยางยิ่งที่จะเปดการทัพครั้งใหญเพื่อยึดประเทศของ[FROM.GetLeader.GetHerHis]คืน ประชาชนสนับสนุนความพยายามนี้อยางแข็งขัน ตอนนี้จึงอาจเปนเวลาที่เหมาะสม"
 BBA_ethiopia_exile_events.01.a: "อุดมการณของ[FROM.GetName]คืออุดมการณของเรา"
 ETH_can_call_allies_tt: "§Y[ETH.GetNameWithFlag]§! สามารถเรียกพันธมิตรเขารวมสงครามได"
 BBA_ethiopia_exile_events.02.t: "การตอตานเพิ่มขึ้นทางตอนเหนือของ[ETH.GetName]"
 BBA_ethiopia_exile_events.02.desc: "[ETH.GetLeader]หนีออกนอกประเทศไปแลว แตยังคงปลุกระดมผูสนับสนุนใหโจมตีกองทัพ[ROOT.GetAdjective]ผูไดรับชัยชนะ สุนทรพจนเหลานี้ทําใหกิจกรรมการตอตานเพิ่มขึ้นในภาคเหนือและภาคกลางของ[ETH.GetName]"
 BBA_ethiopia_exile_events.02.a: "เราตองระวังตัว"

 BBA_ethiopia_exile_events.03.t: "กองโจรคอมมิวนิสตทางใตของ[ETH.GetName]"
 BBA_ethiopia_exile_events.03.desc: "มีรายงานหลายฉบับเกี่ยวกับการโจมตีกองกําลัง[ROOT.GetAdjective]ทางใตของ[ETH.GetName] เชื่อกันวาองคกรที่เรียกตัวเองวาสิงหดําอยูเบื้องหลังการโจมตีเหลานี้"
 BBA_ethiopia_exile_events.03.a: "พวกกบฏเหลานั้น"

 BBA_ethiopia_exile_events.04.t: "$RAJ_orde_wingate$ ถูกเรียกตัวกลับ"
 BBA_ethiopia_exile_events.04.desc: "[ENG.GetNameDefCap]ตัดสินใจเรียกตัว$RAJ_orde_wingate$กลับ โดยอางวาเขาไดรับมอบหมายใหจัดตั้งกองกําลังใหมเพื่อชวย[ETH.GetLeader]ในสงครามที่[ETH.GetName] มีสัญญาณวาการประจําการครั้งนี้จะมีระยะเวลาจํากัด และ$RAJ_orde_wingate$จะไดรับอนุญาตใหกลับมาเมื่อปฏิบัติการเสร็จสิ้น"
 BBA_ethiopia_exile_events.04.a: "หวังวาจะเร็วๆ นะ"

 BBA_ethiopia_exile_events.05.t: "$RAJ_orde_wingate$ ถูกยายไปพมา"
 BBA_ethiopia_exile_events.05.desc: "รัฐบาล[ENG.GetAdjective]แจงเราวา$RAJ_orde_wingate$จะถูกยายไปพมาโดยมีผลทันที ซึ่งเขาจะไดรับมอบหมายใหจัดตั้งกองกําลังใหมที่นั่น"
 BBA_ethiopia_exile_events.05.a: "นาเสียดาย"

 BBA_ethiopia_exile_events.06.t: "[FROM.GetName]ขออํานาจเหนือ[550.GetName]"
 BBA_ethiopia_exile_events.06.desc: "[FROM.GetLeader]ขออํานาจเหนือ[550.GetName] หากเราสามารถยึดดินแดนนี้มาจาก[550.Owner.GetNameDef]ได ภูมิภาคนี้เคยอยูใตการควบคุมของ[ETH.GetAdjective] จึงมีบรรทัดฐานทางประวัติศาสตรรองรับการอางสิทธิ์ [FROM.GetLeader]ยังใหเหตุผลวาชาวฮาเบชาทั้งหมดควรรวมเปนหนึ่งภายใตผูปกครองคนเดียว และยกขอเท็จจริงวานับตั้งแตชาว[ITA.GetAdjective]ยึดครอง[550.GetName] [FROM.GetNameDef]ก็ไมมีทางออกสูทะเลอีกเลย"
 BBA_ethiopia_exile_events.06.a: "ฟงดูมีเหตุผล"
 BBA_ethiopia_exile_events.06.b: "เราไมอาจสัญญาเรื่องดินแดนในตอนนี้"

 BBA_ethiopia_exile_events.07.t: "[FROM.GetNameDefCap]ยอมรับคํารองขอของเรา"
 BBA_ethiopia_exile_events.07.desc: "รัฐบาล[FROM.GetAdjective]เห็นวาการอางสิทธิ์ของเราในดินแดนฮาเบชาทั้งหมดชอบธรรม และยอมรับคํารองขออํานาจเหนือ[550.GetName]ของเรา"
 BBA_ethiopia_exile_events.07.a: "ขาวดี"

 BBA_ethiopia_exile_events.08.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธ"
 BBA_ethiopia_exile_events.08.desc: "แมเราจะมีสิทธิ์อันชอบธรรมในภูมิภาค[550.GetName] แตรัฐบาล[FROM.GetAdjective]ปฏิเสธที่จะใหคํามั่นหรือแถลงการณใดๆ ที่ชัดเจนเพื่อสนับสนุนการอางสิทธิ์ของ[ROOT.GetAdjective] มีเพียงเวลาเทานั้นที่จะบอกไดวาในที่สุดพวกเขาจะยอมใหเราควบคุมแนวชายฝงหรือไม"
 BBA_ethiopia_exile_events.08.a: "ชนะสงครามกอนแลวคอยวากัน"

 BBA_ethiopia_exile_events.10.t: "[FROM.GetName]ขออํานาจเหนือดินแดนโซมาลีทั้งหมด"
 BBA_ethiopia_exile_events.10.desc: "ระหวางการพบปะกับรัฐมนตรีวาการกระทรวงการตางประเทศ[ROOT.GetAdjective]ที่ที่พํานักชั่วคราวของ[FROM.GetLeader] [FROM.GetLeader]ไดขอให[FROM.GetName]ไดรับอํานาจเหนือดินแดนโซมาลีทั้งหมด เนื่องจากมีประชากรชาวโซมาลีจํานวนมากในเอธิโอเปยอยูแลว และขอพิพาทชายแดนก็เปนหนึ่งในขออางที่ใชเปดฉากความขัดแยง ตามที่[FROM.GetLeader]กลาว การมอบดินแดนเหลานี้ทั้งหมดให[FROM.GetNameDef]จะขจัดสาเหตุของความขัดแยงในอนาคต"
 BBA_ethiopia_exile_events.10.a: "นั่นจะทําใหเรามีพันธมิตรที่แข็งแกรงจริงๆ"
 BBA_ethiopia_exile_events.10.b: "พวกเขาเอารัฐของศัตรูไปได"
 BBA_ethiopia_exile_events.10.c: "ขอเรียกรองเหลานี้เกินเลยไป"

 BBA_ethiopia_exile_events.11.t: "โซมาเลียเปนของเรา!"
 BBA_ethiopia_exile_events.11.desc: "ฝาย[FROM.GetAdjective]ตกลงมอบการควบคุมดินแดนโซมาลีทั้งหมดใหเรา นั่นหมายความวา[ROOT.GetName]นาจะไดควบคุมจะงอยแอฟริกาสวนใหญเมื่อสงครามสิ้นสุดลง"
 BBA_ethiopia_exile_events.11.a: "นี่เปนขาวดีมาก!"


 BBA_ethiopia_exile_events.12.t: "ประสบความสําเร็จบางสวน"
 BBA_ethiopia_exile_events.12.desc: "ชาว[FROM.GetAdjective]บอกวาเราจะไดดินแดนโซมาลีบางสวน ซึ่งก็คือสวนที่พวกเขาหรือเรายึดมาจากศัตรูได แตพวกเขาปฏิเสธที่จะมอบสวนใดก็ตามที่ปจจุบันถือเปนสวนหนึ่งของจักรวรรดิของพวกเขา"
 BBA_ethiopia_exile_events.12.a: "คงงายกวาที่จะยกรัฐของคนอื่นให"

 BBA_ethiopia_exile_events.13.t: "ไมสําเร็จ"
 BBA_ethiopia_exile_events.13.desc: "คํารองขอกรรมสิทธิ์ในดินแดนโซมาลีทั้งหมดในอนาคตของเราถูก[FROM.GetNameDef]ปฏิเสธ นาเสียดายที่พวกเขาไมยอมแมแตจะสัญญาวาจะใหควบคุมดินแดนที่ยึดมาจากศัตรู"
 BBA_ethiopia_exile_events.13.a: "ชวนใหสงสัยนะ"

 BBA_ethiopia_exile_events.14.t: "[FROM.GetLeader]ขอควบคุม[454.GetName]"
 BBA_ethiopia_exile_events.14.desc: "ในการพบปะครั้งลาสุดที่ดาวนิงสตรีท [FROM.GetLeader]ไดหารือกับนายกรัฐมนตรี[ROOT.GetAdjective]เกี่ยวกับ[454.GetName] [FROM.GetLeader]กลาววา[FROM.GetLeader.GetSheHe]ไดรับการตอนรับอยางอบอุนยิ่งเมื่อผานที่นั่นระหวางทางของ[FROM.GetLeader.GetHerHis]มายัง[ROOT.GetNameDef] บทสนทนาคอยๆ เปลี่ยนไปเปนคํารองขอจาก[FROM.GetLeader]ใหใช[454.GetName]เปนฐานในการยึด[ETH.GetNameDef]คืน โดยใชการอางวาสืบเชื้อสายโดยตรงจากกษัตริยโซโลมอนเปนขอตอรอง ซึ่งโดยพฤตินัยก็คือการขอใหนายกรัฐมนตรียก[454.GetName]ใหแก[ETH.GetNameDef]"
 BBA_ethiopia_exile_events.14.a: "บางทีเราอาจใชประโยชนจากเรื่องนี้ได"
 BBA_ethiopia_exile_events.14.b: "ไมมีทาง!"

 BBA_ethiopia_exile_events.15.t: "[FROM.GetNameDefCap]ตกลง"
 BBA_ethiopia_exile_events.15.desc: "อาจคอนขางเหนือความคาดหมาย ฝาย[FROM.GetAdjective]ตกลงใหเราใช[454.GetName]เปนฐาน เราควรรีบจัดตั้งการบริหารของเราที่นั่น สักวันหนึ่งเราจะสรางวิหารแหงโซโลมอนขึ้นใหม"
 BBA_ethiopia_exile_events.15.a: "นี่คือจุดเริ่มตนของยุคใหม"

 BBA_ethiopia_exile_events.16.t: "[FROM.GetNameDefCap]ปฏิเสธ"
 BBA_ethiopia_exile_events.16.desc: "นาเสียดายที่รัฐบาล[FROM.GetAdjective]ปฏิเสธคํารองขอของเราที่จะใช[454.GetName]เปนฐาน และยังตั้งคําถามถึงความชอบธรรมของการอางสิทธิ์ของเราในภูมิภาคนี้"
 BBA_ethiopia_exile_events.16.a: "ชางดูหมิ่นกันเหลือเกิน"

 BBA_ethiopia_exile_events.17.t: "[ROOT.GetLeader]สัญญาจะมอบเรือให[FROM.GetLeader]"
 BBA_ethiopia_exile_events.17.desc: "ระหวางการพบปะเปนการสวนตัวระหวาง[ROOT.GetLeader]และ[FROM.GetLeader] [ROOT.GetLeader]ไดสัญญาวา[ROOT.GetNameDef]จะสนับสนุน[FROM.getNameDef]ดวยเรือ อาจเปนคําพูดที่ไมยั้งคิด แตก็ยังเปนสิ่งที่กองทัพเรือ[ROOT.GetAdjective]ควรใหเกียรติ"
 BBA_ethiopia_exile_events.17.a: "เราคงแบงเรือพิฆาตใหไดสักสองสามลํา"
 ETH_destroyers_tt: "[ETH.GetName]ไดรับเรือพิฆาต 5 ลําจาก[JAP.GetName]"
 BBA_ethiopia_exile_events.17.b: "มอบเรือลาดตระเวนพรอมเรือคุมกันใหพวกเขา"
 ETH_cruiser_tt: "[ETH.GetName]ไดรับเรือลาดตระเวนหนัก 1 ลําและเรือพิฆาต 3 ลําจาก[JAP.GetName]"
 BBA_ethiopia_exile_events.17.c: "[FROM.GetLeader]ตองการเรือธงที่นาประทับใจ"
 ETH_battleship_tt: "[ETH.GetName]ไดรับเรือประจัญบาน[JAP.GetAdjective] 1 ลํา"
 BBA_ethiopia_exile_events.17.d: "เราแบงเรือใหไมได แตอยางนอยก็ใหความรูความชํานาญได"

 BBA_ethiopia_exile_events.18.t: "เรือพิฆาต[FROM.GetAdjective]"
 BBA_ethiopia_exile_events.18.desc: "กองทัพเรือ[FROM.GetAdjective]ไดกรุณามอบหนวยเรือพิฆาตใหเรา ตามที่[FROM.GetLeader]สัญญาวาจะจัดหากองทัพเรือให[ROOT.GetName]"
 BBA_ethiopia_exile_events.18.a: "อยางนอยก็ยังดี"
 BBA_ethiopia_exile_events.19.t: "จุดเริ่มตนของกองทัพเรือ[ROOT.GetAdjective]"
 BBA_ethiopia_exile_events.19.desc: "ตามที่[FROM.GetLeader]สัญญาวาจะจัดหาเรือให[ROOT.GetName] ฝาย[FROM.GetAdjective]ไดโอนเรือลาดตระเวน 1 ลําและเรือพิฆาตอีกจํานวนหนึ่งใหอยูใตการควบคุมของ[ROOT.GetAdjective] อาจไมใชกองเรือขนาดใหญ แตก็เปนกองเรือ นี่คือจุดเริ่มตนของยุคใหมสําหรับ[ROOT.GetName]"
 BBA_ethiopia_exile_events.19.a: "นี่เปนเพียงจุดเริ่มตนเทานั้น"

 BBA_ethiopia_exile_events.20.t: "เรือประจัญบาน[ROOT.GetAdjective]"
 BBA_ethiopia_exile_events.20.desc: "หลังการเยือน[FROM.GetLeader]ของ[ROOT.GetLeader] [FROM.GetName]ไดสั่งใหโอนเรือประจัญบาน 1 ลําแก[ROOT.GetName] ดังนั้น[ROOT.GetNavy]จึงมีเรือธงลําใหมเอี่ยม เราตองสรางเรือคุมกันเพิ่ม แตดวยความชวยเหลือของ[FROM.GetAdjective] ภารกิจนี้นาจะทําได"
 BBA_ethiopia_exile_events.20.a: "ขาวดีมาก"

 BBA_ethiopia_exile_events.21.t: "ไมมีเรือ"
 BBA_ethiopia_exile_events.21.desc: "แม[FROM.GetLeader]จะสัญญากับ[ROOT.GetLeader]วาจะใหเรือ แตสภาพของกองทัพเรือ[FROM.GetAdjective]ทําให[FROM.GetName]ไมสามารถสละเรือลําใดไดในขณะนี้ เพื่อเปนการชดเชย กองบัญชาการทหารเรือ[FROM.GetAdjective]จึงอนุญาตให[ROOT.GetName]ศึกษาแบบเรือและวิธีการผลิตของ[FROM.GetAdjective] เพื่อถายทอดความรูดานการตอเรือให[ROOT.GetName]"
 BBA_ethiopia_exile_events.21.a: "อยางไรก็ดีกวาไมมีอะไรเลย"
 BBA_ethiopia_exile_events.22.t: "[ROOT.GetLeader]สัญญาจะมอบเกาะให[FROM.GetLeader]"
 BBA_ethiopia_exile_events.22.desc: "ดูเหมือนวา[ROOT.GetLeader]ไดสัญญาจะมอบเกาะแหงหนึ่งของ[ROOT.GetName]ให[FROM.GetLeader]ใชเปนที่ตั้งรัฐบาลและเปนฐานเริ่มตนการยึด[FROM.GetName]คืน นี่เปนการรับรอง[FROM.GetLeader]อยางเปนทางการในฐานะผูปกครอง[FROM.GetNameDef] และ[ITA.getName]จะถือวาเปนการประกาศสงคราม อยางไรก็ตาม นี่ก็เปนโอกาสที่จะขยายอิทธิพลของ[ROOT.GetNameDef]ดวย"
 BBA_ethiopia_exile_events.22.a: "[647.GetName]เปนอยางไร?"
 BBA_ethiopia_exile_events.22.b: "[524.GetName]จะเปนฐานที่ยอดเยี่ยม"
 BBA_ethiopia_exile_events.22.c: "[543.GetName]ก็เปนเกาะนี่นะ?"
 BBA_ethiopia_exile_events.22.d: "พวกเขาเอา[?ETH.japanese_island.GetName]ไปได"
 BBA_ethiopia_exile_events.22.e: "พวกเขาเอาเกาะของ[ENG.GetAdjective]ไปสักเกาะได"

 BBA_ethiopia_exile_events.23.t: "เกาะของเอธิโอเปย"
 BBA_ethiopia_exile_events.23.desc: "เพื่อแสดงไมตรีจิตและเพื่อรับรอง[ROOT.GetLeader]ในฐานะผูปกครองอันชอบธรรมของ[ROOT.GetNameDef] [FROM.GetLeader]ไดมอบเกาะ[?ETH.japanese_island.GetName]ให[ROOT.GetLeader]เปนพื้นที่ระดมพลเพื่อทวงคืน[ROOT.GetName]\n\n [FROM.GetNameDef]จะชวย[ROOT.GetName]ยึดดินแดนที่สูญเสียไปคืน เพื่อตอบแทนความชวยเหลือเหลานี้ [ROOT.GetLeader]ไดปฏิญาณความภักดีตอ[FROM.GetLeader] ผูกสองประเทศใหใกลชิดกันยิ่งขึ้นในการตอสูกับจักรวรรดินิยมยุโรป"
 BBA_ethiopia_exile_events.23.a: "[?ETH.japanese_island.GetName]เปนของเรา"

 BBA_ethiopia_exile_events.24.t: "ฐานปฏิบัติการสําหรับเอธิโอเปย"
 BBA_ethiopia_exile_events.24.desc: "ในขอตกลงลับระหวางประมุขแหงรัฐของ[ROOT.GetNameDef]และ[FROM.GetNameDef] รัฐจํานวนหนึ่งบนคาบสมุทรอาหรับไดรับสัญญาวาจะมอบให[FROM.GetNameDef]หากตกอยูในมือของรัฐบาล[ROOT.GetAdjective] ดินแดนจะถูกสงมอบเมื่อถึงเวลาอันเหมาะสม แตแนนอนวาตองยึดใหไดเสียกอน"
 BBA_ethiopia_exile_events.24.a: "นี่จะทําใหพวกเขาเปนพันธมิตรที่แข็งแกรงขึ้น"
 ETH_transfer_states_tt: "จะถูกโอนให§Y[ETH.GetNameWithFlag]§!เมื่อ§Y[ROOT.GetNameWithFlag]§!เปนเจาของ"

 BBA_ethiopia_exile_events.30.t: "ยื่นสมัครเขารวมฝายรวมกัน"
 BBA_ethiopia_exile_events.30.desc: "[FROM.GetNameDefCap]เสนอใหเรายื่นใบสมัครเขารวมฝายที่ตอตาน[ITA.GetNameDef]รวมกัน สิ่งนี้ขัดกับนโยบายดั้งเดิมของเรา แตการยอมใหผูนํา[FROM.GetAdjective]พํานักอยูใน[ROOT.GetName]ก็ถือวาละเมิดนโยบายนั้นไปแลวในทางหนึ่ง"
 BBA_ethiopia_exile_events.30.a: "นี่เปนการยกระดับที่เปนธรรมชาติ"
 BBA_ethiopia_exile_events.30.b: "ไม นี่จะเปนการกาวไกลเกินไป"
 BBA_ethiopia_exile_events.31.t: "[FROM.GetName]ปฏิเสธขอเสนอของเรา"
 BBA_ethiopia_exile_events.31.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอใหยื่นสมัครเขารวมฝายรวมกันของเรา นาเสียดายที่นั่นหมายความวาเราจะตองสูในฐานะประเทศเดี่ยวๆ แทนที่จะไดรับการหนุนหลังจากพันธมิตรที่ใหญกวา"
 BBA_ethiopia_exile_events.31.a: "อยางนอยเราก็ไดพยายาม"

 BBA_ethiopia_exile_events.32.t: "ใบสมัครเขารวมรวมกันจาก[FROM.GetName]และ[FROM.FROM.GetName]"
 BBA_ethiopia_exile_events.32.desc: "[FROM.GetLeader]และ[FROM.FROM.GetLeader]ไดยื่นคํารองขอเขารวม[ROOT.GetFactionName] ซึ่งจะทําใหกองกําลังของทั้ง[FROM.GetNameDef]และ[FROM.FROM.GetNameDef]อยูในการบังคับบัญชาของ[ROOT.GetFactionName]ในสงครามกับ[ITA.GetName]"
 BBA_ethiopia_exile_events.32.a: "ฟงดูเปนความคิดที่ดี"
 BBA_ethiopia_exile_events.32.b: "ไมมีพวกเขาเราจะดีกวา"

 BBA_ethiopia_exile_events.33.t: "[FROM.GetName]ปฏิเสธ"
 BBA_ethiopia_exile_events.33.desc: "นาเสียดายที่[FROM.GetName]ปฏิเสธคํารองขอรวมของ[SWE.GetAdjective]-[ETH.GetAdjective]ที่จะเขารวม[FROM.GetFactionName] ดวยเหตุผลแปลกๆ บางประการ พวกเขาไมยอมเห็นประโยชนของการรวมกําลังตอตาน[ITA.GetLeader]"
 BBA_ethiopia_exile_events.33.a: "นารําคาญ"

 BBA_ethiopia_exile_events.34.t: "[FROM.GetNameDefCap]ตกลง"
 BBA_ethiopia_exile_events.34.desc: "[FROM.GetNameDefCap]ยอมใหเราเขารวม[FROM.GetFactionName] ตอนนี้เรามีโอกาสเอาชนะ[ITA.GetName]มากขึ้นอยางมาก"
 BBA_ethiopia_exile_events.34.a: "ขาวดีมาก"

 BBA_ethiopia_exile_events.40.t: "[FROM.GetName]ขอใหไกลเกลี่ย"
 BBA_ethiopia_exile_events.40.desc: "[FROM.GetLeader] จักรพรรดิพลัดถิ่นแหง[FROM.GetName] ไดขอให[ROOT.GetAdjective]ไกลเกลี่ยในสงครามอิตาลี-เอธิโอเปย [GetGermanCountryLeaderTitle]แสดงความสนใจเปนการสวนตัวที่จะยุติความขัดแยงนี้ซึ่งสันนิบาตชาติลมเหลวในการแกไข หากทําสําเร็จจะยกระดับสถานะของ[ROOT.GetName]บนเวทีโลก"
 BBA_ethiopia_exile_events.40.a: "[ITA.GetName]ตองถอนตัวออกจาก[FROM.GetName]"
 BBA_ethiopia_exile_events.40.b: "ตองเสนออะไรบางอยางให[ITA.GetLeader]"
 BBA_ethiopia_exile_events.40.c: "เราควรขีดเสนพรมแดนใหมที่มั่นคงกวา"

 BBA_ethiopia_exile_events.41.t: "การไกลเกลี่ยของ[FROM.GetAdjective]"
 BBA_ethiopia_exile_events.41.desc_back_off: "[FROM.GetLeader]เขาขางศัตรูของเราอยางชัดเจน [?global.ETH_peace_country.GetLeader]ไดรับอนุญาตใหพํานักและทําทีเปนวายังมีอํานาจอยูใน[FROM.GetNameDef]มาระยะหนึ่งแลว คําโกหกของอดีตผูนําแหง[?global.ETH_peace_country.GetNameDef]เห็นไดชัดวาไดชักจูง[FROM.GetLeader]และทําใหความเห็นของ[FROM.GetLeader.GetHerHis]ที่มีตอ[ROOT.GetNameDef]แยลง บัดนี้[FROM.GetNameDef]เรียกรองใหเราถอนตัวออกจาก[?global.ETH_peace_country.GetName]เสียเฉยๆ และวางความขัดแยงไวกอน"
 BBA_ethiopia_exile_events.41.desc_offered_compensation: "ผลที่ตามมาโดยธรรมชาติจากการยอมใหผูนําพลัดถิ่นของศัตรูเรา [?global.ETH_peace_country.GetLeader] พํานักอยูใน[FROM.GetNameDef] คือตอนนี้[FROM.GetLeader]ตองการไกลเกลี่ยความขัดแยงระหวาง[ROOT.GetName]และ[?global.ETH_peace_country.GetName] [FROM.GetLeader]ระบุวา[FROM.GetLeader.GetSheHe]สามารถโนมนาว[?global.ETH_peace_country.GetLeader]ใหยอมออนขอเล็กนอยตอ[ROOT.GetName]เพื่อแลกกับสันติภาพและความรวมมือที่อาจเกิดขึ้นในอนาคต"
 BBA_ethiopia_exile_events.41.desc_redraw_map: "ผูนํา[FROM.GetAdjective] [FROM.GetLeader] ไดเสนอทางออกสําหรับสงครามอิตาลี-เอธิโอเปย โดย[ROOT.GetName]จะไดรับดินแดน[?global.ETH_peace_country.GetAdjective]สวนใหญเพื่อแลกกับสันติภาพและความรวมมือในอนาคตเพื่อตอตานศัตรูภายนอก หาก[ROOT.GetName]ยอมรับขอเสนอนี้ [?global.ETH_peace_country.GetName]จะไดรับ[550.GetName]เปนการชดเชย เพื่อใหพวกเขาไดประโยชนบางอยางดวย สิ่งนี้จะทําใหดินแดนของ[ROOT.GetAdjective]ในแอฟริกามั่นคงขึ้น ขณะเดียวกันก็ให[?global.ETH_peace_country.GetName]มีทางออกสูทะเล"
 BBA_ethiopia_exile_events.41.a: "คงเปนทางที่ดีที่สุด"
 BBA_ethiopia_exile_events.41.b: "เปนจุดเริ่มตนที่ดี แตประชาชน[ROOT.GetAdjective]ตองการผลตอบแทนที่คุมคากับความพยายามมากกวานี้"
 BBA_ethiopia_exile_events.41.c: "[FROM.GetLeader.GetSheHe]คิดวา[FROM.GetLeader.GetSheHe]เปนใครกัน?"

 BBA_ethiopia_exile_events.42.t: "[FROM.GetLeader]ตองการมากกวานี้"
 BBA_ethiopia_exile_events.42.desc: "ขอเสนอสันติภาพของ[GetGermanCountryLeaderTitle]ไมไดถูก[FROM.GetLeader]ปฏิเสธโดยสิ้นเชิง อยางไรก็ตาม รัฐบาล[FROM.GetAdjective]รูสึกวาตองการผลงานมากกวานี้เพื่อสยบการตอตานระบอบของสาธารณชน จึงขอใหเราพิจารณาใหมอีกสักหนอย"
 BBA_ethiopia_exile_events.42.a: "เขาใจได"
 BBA_ethiopia_exile_events.42.b: "พวกเขากลาตั้งคําถามกับคําสั่งของเราไดอยางไร?"

 BBA_ethiopia_exile_events.43.t: "[FROM.GetName]ยอมรับคํารองขอของเรา"
 BBA_ethiopia_exile_events.43.desc: "[FROM.GetLeader]เขาใจถึงความจําเปนที่[ETH.GetName]ตองยอมยกดินแดนเพื่อยุติความขัดแยงในแบบที่ทําใหเรารักษาหนาตอสาธารณชนได อีกไมนานเราจะทิ้งการรุกรานอันยุงเหยิงนี้ไวเบื้องหลังไดอยางเชิดหนาชูตา"
 BBA_ethiopia_exile_events.43.a: "ดี"

 BBA_ethiopia_exile_events.44.t: "[FROM.GetLeader]โกรธเคืองคํารองขอของเรา"
 BBA_ethiopia_exile_events.44.desc: "ขอโตแยงที่[ROOT.GetLeader]เสนอไมมีใครฟง [FROM.GetLeader]พูดจาโผงผางยืดยาว อางวาขอเสนอที่ใหไปเปนประโยชนสูงสุดตอทุกฝาย และ[ROOT.GetLeader]เปนผูลมเหลวเพราะ[ROOT.GetLeader.GetHerHis]ไมสามารถเอาชนะในแอฟริกาได [FROM.GetLeader]ยังกลาวตอวาฝาย[FROM.GetAdjective]จะบดขยี้กองทัพ[ROOT.GetAdjective]ไดภายในไมกี่สัปดาหอยางแนนอน"
 BBA_ethiopia_exile_events.44.a: "ก็ไมใชวาพวกเขาจะประกาศสงครามหรืออะไรหรอก..."

 BBA_ethiopia_exile_events.45.t: "การไกลเกลี่ยสําเร็จ"
 BBA_ethiopia_exile_events.45.desc_white_peace: "การไกลเกลี่ยของ[FROM.GetAdjective]พิสูจนแลววาประสบความสําเร็จ [FROM.FROM.GetLeader]ไดรับคําสั่งจาก[FROM.GetLeader]ใหถอนกองทัพของ[FROM.FROM.GetLeader.GetHerHis]ออกจากดินแดน[ROOT.GetAdjective] \nสนธิสัญญาไมไดใหการชดเชยใดๆ แก[ROOT.GetName] แตหวังวาเราจะใชพันธมิตรใหมนําพาประเทศเขาสูยุคสมัยใหมได [GetGermanCountryLeaderTitle]แหง[FROM.GetAdjective] [FROM.GetLeader] ไดใหคํามั่นอยางคลุมเครือวาจะฟนฟูความรุงโรจนของจักรวรรดิ[ROOT.GetAdjective]"
 BBA_ethiopia_exile_events.45.desc_redraw_map: "[FROM.GetLeader]ไดเปนตัวกลางทําสันติภาพกับ[FROM.FROM.GetNameDef] [ROOT.GetNameDefCap]ตองยกดินแดนทางใตทั้งหมดให[FROM.FROM.GetName] เพื่อเปนการชดเชย [550.GetName]จะถูกมอบให[ROOT.GetName] เพื่อให[ROOT.GetName]มีทางออกสูทะเล ตามที่[FROM.GetLeader]กลาว การนี้ยังแบงพื้นที่ออกเปนหนวยเดี่ยวๆ ซึ่ง[FROM.GetLeader]เชื่อวาจะลดความเสี่ยงของความขัดแยงระหวางสองชาติในอนาคต"
 BBA_ethiopia_exile_events.45.desc_cede_territory: "[FROM.GetLeader]ไดเปนตัวกลางทําสันติภาพกับ[FROM.FROM.GetNameDef] นาเสียดายที่ผูนําทั้งสองตัดสินใจขามหัวเราวา[FROM.FROM.GetName]จะไดดินแดนบางสวนของ[ROOT.GetName] เราแทบทําอะไรไมไดเลย"
 BBA_ethiopia_exile_events.45.a: "อยางนอยก็ไดสันติภาพมาบาง"

 BBA_ethiopia_exile_events.46.t: "การไกลเกลี่ยลมเหลว"
 BBA_ethiopia_exile_events.46.desc: "นาเสียดายที่ความพยายามของ[FROM.GetLeader]ในการเปนตัวกลางทําขอตกลงสันติภาพกับ[FROM.FROM.GetNameDef]ไรผล [FROM.FROM.GetLeader]ไมยอมฟงเหตุผล ความหวังของเราตอนนี้คือการดึง[FROM.GetNameDef]ใหเขารวมสงครามกับเราแทน"
 BBA_ethiopia_exile_events.46.a: "เราคาดหวังไวสูงกวานี้"

 BBA_ethiopia_exile_events.47.t: "[FROM.GetLeader]ปฏิเสธที่จะรวมมือ"
 BBA_ethiopia_exile_events.47.desc: "คําตอบของ[FROM.GetAdjective]หางไกลจากความพอใจ [FROM.GetLeader]ไมยอมออนขอ [FROM.GetName]จะไมหยุดสงครามจนกวาจะชนะ หรือถูกทําลายไปในความพยายามนั้น"
 BBA_ethiopia_exile_events.47.a: "เราตองสั่งสอน[FROM.GetLeader.GetHerHim]เสียบาง"

 BBA_ethiopia_exile_events.48.t: "[FROM.GetLeader]ยอมรับการไกลเกลี่ยของเรา"
 BBA_ethiopia_exile_events.48.desc: "ตามคาด [ROOT.GetNameDef]ประสบความสําเร็จในที่ที่คนอื่นลมเหลว [FROM.GetLeader]ยอมรับเงื่อนไขที่[ROOT.GetLeader]รางขึ้น จะมีสันติภาพระหวาง[FROM.GetNameDefCap]และ[?global.ETH_peace_country.GetNameDef] บัดนี้เราทุกคนสามารถหันไปจัดการเรื่องที่สําคัญกวารวมกันไดแลว"
 BBA_ethiopia_exile_events.48.a: "[ROOT.GetLeader]คือผูคํ้าประกันสันติภาพในยุคของเรา"

 BBA_ethiopia_exile_events.50.t: "เหตุการณปะทะที่ชายแดน"
 BBA_ethiopia_exile_events.50.desc: "ปอมชายแดน[ROOT.GetAdjective]ถูกยิงจากฝง[ITA.GetAdjective] ฝาย[ROOT.GetAdjective]ยิงตอบโตพลซุมยิง[ITA.GetAdjective] และเกิดการยิงตอสูอยางยืดเยื้อ ทหารทั้งสองฝายไดรับบาดเจ็บ มีการยื่นหนังสือประทวงอยางเปนทางการตอรัฐบาล[ITA.GetAdjective]แลว แตพวกเขาอางวาบริสุทธิ์ และกลับกลาวหาวาทหารของเราเปนผูเริ่มเหตุการณ"
 BBA_ethiopia_exile_events.50.a: "พฤติกรรมเชนนี้ยอมรับไมไดเลย"

 BBA_ethiopia_exile_events.51.t: "เหตุปะทะชายแดนที่นาสงสัย"
 BBA_ethiopia_exile_events.51.desc: "รัฐบาล[GER.GetAdjective]ไดยื่นหนังสือประทวงดวยถอยคําเกรี้ยวกราดหลังเกิดเหตุบนชายแดนอิตาลี-เยอรมนี มีใครบางคนเปดฉากยิง รายงานขัดแยงกันอยางมาก บางฉบับระบุวาการยิงเริ่มจากฝงอิตาลี ขณะที่ไมมีทหารรักษาชายแดนที่รอดชีวิตคนใดยอมรับวายิงกอนที่ฝายเยอรมันจะระดมยิงใส ขอเท็จจริงที่วาทหารอิตาลีไมไดอยูหลังที่กําบังใดๆ เลยยิ่งเสริมนํ้าหนักใหคําใหการเหลานี้"
 BBA_ethiopia_exile_events.51.a: "นี่เปนแผนการของ[GER.GetAdjective]อยางชัดเจน"

 BBA_ethiopia_exile_events.52.t: "การทูตหลังฉาก"
 BBA_ethiopia_exile_events.52.desc: "งานเลี้ยงที่จัดขึ้นเมื่อเร็วๆ นี้ ณ ที่ประทับของสมเด็จพระจักรพรรดิ[ETH.GetLeader]ประสบความสําเร็จอยางยิ่ง ขณะที่แขกเหรื่อสังสรรคและลิ้มรสอาหารเลิศรสที่นําเขาจากทั่วโลก นักการเมือง[?ETH.host_nation.GetAdjective]ก็ไดฟงผูลี้ภัย[ETH.GetAdjective]เลาถึงการยึดครองบานเกิดอยางโหดรายของ[ITA.GetAdjective] หลายคนถูกโนมนาวใหสนับสนุนการทุมทรัพยากรของ[?ETH.host_nation.GetAdjective]มากขึ้นเพื่อชวยเราปลดปลอย[ETH.GetNameDef]ในสักวันหนึ่ง"
 BBA_ethiopia_exile_events.52.a: "ใกลบานเขาไปอีกกาว"

 BBA_ethiopia_exile_events.53.t: "การล็อบบี้ประสบความสําเร็จ"
 BBA_ethiopia_exile_events.53.desc: "ไมกี่เดือนที่ผานมามีความพยายามหลายครั้งในการล็อบบี้เจาบานของเราใหสนับสนุนการปลดปลอย[ETH.GetNameDef] สมเด็จพระจักรพรรดิทรงพระราชนิพนธจดหมายถึงสมาชิกรัฐบาลและกองทัพเพื่อสงเสริมอุดมการณของเรา ขณะเดียวกันผูลี้ภัยคนอื่นๆ ก็ตระเวนใหสัมภาษณและเขียนบทความลงหนังสือพิมพมากมายเพื่อระดมแรงสนับสนุนจากสาธารณชน[?ETH.host_nation.GetAdjective] แมจะยากลําบาก แตดูเหมือนวาบรรยากาศในชาติกําลังเคลื่อนไปสูการสนับสนุนทางทหารโดยตรงเพื่อปลดปลอย[ETH.GetNameDef]"
 BBA_ethiopia_exile_events.53.a: "คุมคากับความพยายามจริงๆ!"

 BBA_ethiopia_exile_events.54.t: "การระดมทุน"
 BBA_ethiopia_exile_events.54.desc: "การระดมทุนครั้งลาสุดของเราไดผลตอบแทนงดงาม ทองพระคลังไดรับเงินไหลเขาจํานวนมากจากผูบริจาคทั่วโลก ดูเหมือนจะมีหลายคนที่รวมขุนเคืองกับการยึดครอง[ETH.GetNameDef]เชนเดียวกับเรา"
 BBA_ethiopia_exile_events.54.a: "เราจะไมลืมการสนับสนุนของพวกเขาตออุดมการณนี้"

 BBA_ethiopia_exile_events.55.t: "การจางทหารรับจาง[?ETH.host_nation.GetAdjective]"
 BBA_ethiopia_exile_events.55.desc: "ความพยายามสงเสริมอุดมการณของเราเมื่อเร็วๆ นี้ทําใหมีทหารรับจาง[?ETH.host_nation.GetAdjective]หลั่งไหลมาเสนอตัวรับใชเราในการรบที่จะมาถึงอยางตอเนื่อง แนนอนวาตองมีคาตอบแทน"
 BBA_ethiopia_exile_events.55.a: "กองกําลังของเราแข็งแกรงขึ้นทุกวัน"

 BBA_ethiopia_exile_events.56.t: "นักบิน[?ETH.host_nation.GetAdjective]ตอบรับการเรียกรอง"
 BBA_ethiopia_exile_events.56.desc: "มีนักบิน[?ETH.host_nation.GetAdjective]จํานวนหนึ่งตอบรับการเรียกรองใหชวยเราในการปลดปลอยบานเกิดที่กําลังจะมาถึง พวกเขานําประสบการณมากมายมาดวย และกําลังถายทอดใหแกวาที่นักบินของเราเอง"
 BBA_ethiopia_exile_events.56.a: "เราจะรับความชวยเหลือทุกอยางที่หาได"

 BBA_ethiopia_exile_events.57.t: "กองเรือสมทบของ[ETH.GetName]"
 BBA_ethiopia_exile_events.57.desc: "การเรียกรองหากะลาสีและเรือ[?ETH.host_nation.GetAdjective]ที่กลาฝานานนํ้าที่ศัตรูชุกชุมเมื่อเร็วๆ นี้ไดรับการตอบรับจากอาสาสมัครจํานวนหนึ่ง ทั้งทหารเรือปลดเกษียณ กะลาสีพลเรือน และหนุมสาวอาสาสมัครที่แคแสวงหาการผจญภัย ตางกาวออกมาเปนลูกเรือใหกองเรือสินคาหลากสภาพที่เรารวบรวมมาจากอูแยกชิ้นสวนเรือของ[?ETH.host_nation.GetNameDef]"
 BBA_ethiopia_exile_events.57.a: "หวังวาเรือพวกนี้จะยังออกทะเลไดนะ..."

 BBA_ethiopia_exile_events.58.t: "สงมอบปนไรเฟลแลว"
 BBA_ethiopia_exile_events.58.desc: "ปนไรเฟลที่ซื้อจากผูผลิต[?ETH.host_nation.GetAdjective]ไดสงมอบถึงกองทหารของเราที่ประจําอยูใน[?ETH.host_nation.GetName]แลว ยุทโธปกรณใหมกําลังถูกทดสอบในสนามยิงปนและการฝกซอม"
 BBA_ethiopia_exile_events.58.a: "เงินที่ใชไปคุมคา"

 BBA_ethiopia_exile_events.59.t: "สงมอบยุทโธปกรณสนับสนุนแลว"
 BBA_ethiopia_exile_events.59.desc: "ยุทโธปกรณสนับสนุนที่เราซื้อใหกองทหารเมื่อเร็วๆ นี้ไดสงมอบแลว แมอาจไมใชยุทโธปกรณที่ลํ้าสมัยที่สุดในโลก แตก็ยังเปนประโยชนอยางยิ่งในแนวหนา"
 BBA_ethiopia_exile_events.59.a: "ทุกอยางชวยไดทั้งนั้น"

 BBA_ethiopia_exile_events.60.t: "สงมอบรถถังแลว"
 BBA_ethiopia_exile_events.60.desc: "รถถังที่ซื้อจากยุทโธปกรณสวนเกินของกองทัพ[?ETH.host_nation.GetAdjective]ไดโอนมาสูกองทัพของเราแลว รถถังเหลานี้เปนรุนเกาที่ถูกเก็บเขาคลังในชวงไมกี่ปที่ผานมา แตยังคงใชงานไดเต็มที่ และขณะนี้กําลังใชฝกพลประจํารถใหพรอมสงไปแนวหนา"
 BBA_ethiopia_exile_events.60.a: "มีรถถังยังไงก็ดีกวาไมมี"

#Imperial Events, non-exile stuff
 BBA_ethiopia_imperial_events.1.t: "[FROM.GetName]ตองการซื้อจิบูตี"
 BBA_ethiopia_imperial_events.1.desc: "[FROM.GetLeader]ตองการซื้ออาณานิคม[268.GetName]ของ[ROOT.GetAdjective] การซื้อนี้จะทําให[FROM.GetNameDef]มีทางออกสูทะเลผานทาเรือจิบูตี ซึ่งมีทางรถไฟเชื่อมจากแอดดิสอาบาบาอยูแลว พวกเขาเสนอเงินจํานวนไมนอยสําหรับอาณานิคมที่ไมสําคัญเชนนี้"
 BBA_ethiopia_imperial_events.1.a: "เราเอาเงินไปใชประโยชนได"
 BBA_ethiopia_imperial_events.1.b: "ที่นี่เปนของ[ROOT.GetAdjective] และจะเปนเชนนั้นตลอดไป!"

 BBA_ethiopia_imperial_events.2.t: "[FROM.GetNameDefCap]ตกลงขายจิบูตี"
 BBA_ethiopia_imperial_events.2.desc: "การเจรจากับรัฐบาล[FROM.GetAdjective]เรื่องการซื้ออาณานิคม[268.GetName]สิ้นสุดลงดวยความสําเร็จ [FROM.GetNameDefCap]ตกลงสงมอบทาเรือจิบูตีและพื้นที่โดยรอบให[ROOT.GetName]โดยมีผลทันที ทําใหเรามีทั้งทาเรือและไดรวมชาวอะฟารไวภายใตผูปกครองคนเดียว"
 BBA_ethiopia_imperial_events.2.a: "ขาวดีมาก"

 BBA_ethiopia_imperial_events.3.t: "[FROM.GetName]ปฏิเสธที่จะขายจิบูตี"
 BBA_ethiopia_imperial_events.3.desc: "นาเสียดายที่รัฐบาล[FROM.GetAdjective]ปฏิเสธคําขอซื้อทาเรือจิบูตีของเรา แทนที่จะมองเห็นผลประโยชนรวมกัน พวกเขากลับยึดติดกับอาณานิคมอยางสิ้นหวัง และไมยอมสละแมแตตารางนิ้วเดียวของดินแดนที่ฉกฉวยมา"
 BBA_ethiopia_imperial_events.3.a: "เราคงตองพิจารณาวิธีอื่น"

 BBA_ethiopia_imperial_events.4.t: "[FROM.GetNameDefCap]ขอ[689.GetName]"
 BBA_ethiopia_imperial_events.4.desc: "ขบวนการราสตาฟาเรียนใน[689.GetName]อางวา$ETH_haile_selassie$คือพระเมสสิยาหหรือจาห ซึ่งเปนชื่อที่พวกเขาเรียกพระเจา กลับชาติมาเกิด คอนขางเหนือความคาดหมายที่$ETH_haile_selassie$ยอมรับชื่อเสียงนี้ และรัฐบาล[FROM.GetAdjective]ไดขอใหผนวกดินแดนบานเกิดของขบวนการ ซึ่งก็คือ[689.GetName] เขาเปนสวนหนึ่งของจักรวรรดิ[FROM.GetAdjective]"
 BBA_ethiopia_imperial_events.4.a: "ชางเปนคําขอที่แปลก แตทําไมจะไมไดละ?"
 BBA_ethiopia_imperial_events.4.b: "เราจะเปนสวนหนึ่งของจักรวรรดิแหงไซออน"
 BBA_ethiopia_imperial_events.4.c: "ไมมีทาง!"

 BBA_ethiopia_imperial_events.5.t: "[FROM.GetNameDefCap]ยอมรับคํารองขอของเรา"
 BBA_ethiopia_imperial_events.5.desc: "คํารองขออันนอบนอมของเราใหโอนการควบคุม[689.GetName]ไดรับการตอบรับจาก[FROM.GetNameDef]แลว นี่คือจุดเริ่มตนของยุคใหม ขอความรุงโรจนจงมีแด$ETH_haile_selassie$ หวังวานี่จะชวยใหเราดึงดูดผูศรัทธาจากทั่วทวีปอเมริกาได"
 BBA_ethiopia_imperial_events.5.a: "พวกเขาไดเห็นแสงสวางแลว"

 BBA_ethiopia_imperial_events.6.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะสงมอบ[689.GetName]"
 BBA_ethiopia_imperial_events.6.desc: "แมเราจะพยายามอยางเต็มที่ แตก็ไมสามารถโนมนาวรัฐบาล[FROM.GetAdjective]ไดวา[689.GetName]เปนสวนหนึ่งของ[ROOT.GetAdjective] พวกเขาหัวเราะเยาะคํารองขอของเรา ถึงขั้นตั้งขอสงสัยในความศักดิ์สิทธิ์ของผูนําผูยิ่งใหญของเรา"
 BBA_ethiopia_imperial_events.6.a: "พวกเขากลาดียังไง!"

 BBA_ethiopia_imperial_events.7.t: "[FROM.GetLeader]เรียกรองใหยอมสวามิภักดิ์"
 BBA_ethiopia_imperial_events.7.desc: "ขบวนการราสตาฟาเรียนใน[689.GetName]อางวา$ETH_haile_selassie$คือพระเมสสิยาหหรือจาห ซึ่งเปนชื่อที่พวกเขาเรียกพระเจา กลับชาติมาเกิด คอนขางเหนือความคาดหมายที่$ETH_haile_selassie$ยอมรับชื่อเสียงนี้ ผลที่ตามมาคือตอนนี้[FROM.GetLeader.GetSheHe]เรียกรองให[ROOT.GetNameDef]เขารวมกับ[FROM.GetAdjective]อยางเปนทางการ และสรางฐานอํานาจใหมในแคริบเบียน เพื่อแผขยายอิทธิพลไปยังสวนอื่นของโลก"
 BBA_ethiopia_imperial_events.7.a: "ฟงดูเปนความคิดที่ดี"
 BBA_ethiopia_imperial_events.7.b: "พวกเขาเสียสติไปแลว"
 BBA_ethiopia_imperial_events.8.t: "[FROM.GetNameDefCap]ยอมสวามิภักดิ์"
 BBA_ethiopia_imperial_events.8.desc: "[FROM.GetLeader]ตัดสินใจอยางชาญฉลาดที่จะยอมรับอํานาจเหนือของเรา [FROM.GetName]จะเปนรัฐในอารักขาที่ภักดีตอ[ROOT.GetLeader]"
 BBA_ethiopia_imperial_events.8.a: "ขอความรุงโรจนจงมีแด[ROOT.GetLeader]"
 BBA_ethiopia_imperial_events.9.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะสวามิภักดิ์"
 BBA_ethiopia_imperial_events.9.desc: "นาเสียดายที่[FROM.GetNameDef]ปฏิเสธขอเสนออันเอื้อเฟอที่จะเปนรัฐในอารักขาของ[ROOT.GetLeader] แมเราจะพยายามอยางเต็มที่ แตก็ไมสามารถโนมนาวรัฐบาลของ[FROM.getName]ไดวาสิ่งนี้เปนประโยชนตอทั้งสองฝายจริงๆ"
 BBA_ethiopia_imperial_events.9.a: "ไมมีใครชนะไดทุกครั้ง"

 BBA_ethiopia_imperial_events.10.t: "[FROM.GetNameDefCap]สงคําขาด"
 BBA_ethiopia_imperial_events.10.desc: "[FROM.GetNameDefCap]เรียกรองใหเรายอมอยูใตปกครองและผนวกรวมเขากับชาติของพวกเขา หากเรายอมทําตาม แนนอนวายอมเปนจุดจบของ[THIS.GetName]ในฐานะชาติเอกราช ไมชัดเจนวา[FROM.GetLeader]พรอมจะไปไกลแคไหนเพื่อใหการผนวกรวมสําเร็จ แตยังไมอาจตัดความเปนไปไดของความขัดแยงดวยอาวุธออกไปได"
 BBA_ethiopia_imperial_events.10.a: "เราไมมีทางเลือก..."
 BBA_ethiopia_imperial_events.10.b: "เราจะไมยอมถูกขมขู"

 BBA_ethiopia_imperial_events.11.t: "[FROM.GetNameDefCap]ปฏิเสธคําขาด"
 BBA_ethiopia_imperial_events.11.desc: "[FROM.GetNameDefCap]ปฏิเสธที่จะยอมรับขอเรียกรองใหกลับมารวมกับเรา [FROM.GetName]พรอมทรยศเราครั้งแลวครั้งเลาเพื่อปกปองตนเอง เราไมอาจปลอยใหเรื่องเชนนั้นเกิดขึ้นอีก"
 BBA_ethiopia_imperial_events.11.a: "เราจะยุติเรื่องนี้เสียที"
 BBA_ethiopia_imperial_events.11.b: "เรามีเรื่องสําคัญกวาที่ตองจัดการ"

 BBA_ethiopia_imperial_events.12.t: "[FROM.GetNameDefCap]ยอมรับขอเรียกรอง"
 BBA_ethiopia_imperial_events.12.desc: "[FROM.GetNameDefCap]ยอมรับความจําเปนที่จะกลับมารวมกับ[THIS.GetName] บัดนี้[FROM.GetLeader]ไดปฏิญาณความภักดีตอสมเด็จพระจักรพรรดิ[THIS.GetLeader]แลว"
 BBA_ethiopia_imperial_events.12.a: "เรื่องที่ตองกังวลลดลงไปหนึ่งเรื่อง"
 
 BBA_ethiopia_imperial_events.20.t: "รัฐประหารโดยไมเสียเลือดเนื้อโดย$ETH_ras_imru_haile_selassie$"
 BBA_ethiopia_imperial_events.20.desc: "หลังจากไดรับแรงสนับสนุนจากชนชั้นกลางและชาวนาใน[ETH.GetName] ราส$ETH_ras_imru_haile_selassie$ไดประกาศถอด$ETH_haile_selassie$ออกจากราชบัลลังกอยางเปนทางการ และใหมีการเลือกตั้งทั่วไปใน[ETH.GetNameDef] ดวยการที่ประชาชน และที่สําคัญยิ่งกวาในกรณีนี้คือกองทัพ[ETH.GetAdjective] ตางยกยองเขาเปนวีรบุรุษตัวจริงในสงครามอิตาลี-เอธิโอเปยครั้งที่สอง เขาจึงสามารถรักษาความภักดีของกองทัพไวได ขณะที่แรงสนับสนุนตอจักรพรรดิผูไมอยูก็ไมเกิดขึ้นเลย"
 BBA_ethiopia_imperial_events.20.a: "ราสแดงควรปกครอง[ETH.GetNameDef]"
 BBA_ethiopia_imperial_events.20.b: "การสถาปนามกุฎราชกุมารเปนกษัตริยภายใตรัฐธรรมนูญปลอดภัยกวา"

 BBA_ethiopia_imperial_events.21.t: "การตอตานใน[ETH.GetName]"
 BBA_ethiopia_imperial_events.21.desc: "กองทหารของเรายังคงบุกทะลวงกองกําลัง[ETH.GetAdjective] เปดทางใหการปกครองอันเหนือกวาของเรา อยางไรก็ตาม เรากําลังเห็นกิจกรรมการตอตานเพิ่มขึ้นทั่วดินแดนใหมของเรา ดูเหมือนวาขาวที่อดีตผูปกครอง $ETH_haile_selassie$ ไปกลาวตอสันนิบาตชาติ ไดปลุกเราผูอยูใตปกครองใหมของเราจํานวนมากใหคลุมคลั่ง ดูเหมือนวาตราบใดที่จักรพรรดิของพวกเขายังมีชีวิตอยู การตอตานจะยังคงเปนหนามยอกอกของการบริหารอาณานิคมของเรา"
 BBA_ethiopia_imperial_events.21.a: "พวกเขาจะตองยอมอยูใตการปกครองของเรา ไมทางใดก็ทางหนึ่ง"
 ETH_imperial_event_21_tt: "รัฐ§Y[ETH.GetFlag][ETH.GetAdjective]§!ทั้งหมดที่ควบคุมอยูจะไดรับ:\nการยอมรับปกครอง: §R-10%§!"

# Military and technology events 
 BBA_ethiopia_military_and_tech_events.1.t: "นักเรียนรุนแรกของ[GetEthiopianMilitaryAcademyName]"
 BBA_ethiopia_military_and_tech_events.1_war.desc: "นักเรียนรุนแรกที่จบจาก[GetEthiopianMilitaryAcademyName]จะตองออกจากโรงเรียนไปสูสงครามทันที การสรางโรงเรียนแหงนี้และสําเร็จการศึกษาของนักเรียนนายรอยรุนแรกไดในขณะที่ยังตองทําสงครามไปดวย นับเปนความสําเร็จครั้งใหญอยางแทจริง \nนี่คือจุดเริ่มตนของยุคใหมสําหรับกองทัพ[ROOT.GetAdjective]!"
 BBA_ethiopia_military_and_tech_events.1_peace.desc: "เมื่อสงครามผานพนไป บัดนี้เรามีโอกาสสรางโรงเรียนนายรอยของเราใหเสร็จสมบูรณ นักเรียนนายรอยรุนแรกจะชวยใหชาติของเราชนะสงครามในอนาคต และทําใหเราใชประสบการณจากการรบกับชาวอิตาลีไดอยางเต็มที่"

 BBA_ethiopia_military_and_tech_events.1.a: "โรงเรียนจะคงจุดเนนดานการรุกของเราไว"
 ETH_ecole_attack_tt: "ปรับ§Y[GetEthiopianArmySpiritName]§!ดังนี้:\n$modifier_army_sub_unit_infantry_attack_factor$: §G+10%§!\n$modifier_army_sub_unit_irregular_infantry_attack_factor$: §G+10%§!"
 BBA_ethiopia_military_and_tech_events.1.b: "โรงเรียนจะชวยใหเราปรับเปลี่ยนไปสูแนวคิดเชิงรับมากขึ้น"
 ETH_ecole_defense_tt: "ปรับ§Y[GetEthiopianArmySpiritName]§!ดังนี้:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 BBA_ethiopia_military_and_tech_events.1.c: "โรงเรียนจะทําใหเราไมมีวันไมพรอมรบ"
 ETH_ecole_learn_tt: "ปรับ§Y[GetEthiopianArmySpiritName]§!ดังนี้:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!"

# Anti colonialism 
 BBA_ethiopia_anti_colonialism_events.2.t: "[?global.african_supporting_country.GetNameDef]ขอใหรับรอง[?global.african_revolt_country.GetNameDef]"
 BBA_ethiopia_anti_colonialism_events.2.desc: "[?global.african_supporting_country.GetLeader] ผูนําแหง[?global.african_supporting_country.GetNameDef] ไดเรียกรองใหยุติสงครามกับกบฏ[?global.african_revolt_country.GetAdjective]ในทันที นักการทูต[?global.african_supporting_country.GetAdjective]สนับสนุนให[ROOT.GetName]รับรองเอกราชของ[?global.african_revolt_country.GetNameDef] พวกเขาไมไดระบุอยางชัดแจงวา[?global.african_supporting_country.GetNameDef]จะทําสงครามหากเราปฏิเสธ แตก็บอกใบถึงความเปนไปไดนั้นอยางชัดเจน"
 BBA_ethiopia_anti_colonialism_events.2.a: "พวกเขาพูดถูก เราควรยุติความขัดแยงในอาณานิคมนี้เสียที"
 BBA_ethiopia_anti_colonialism_events.2.b: "สงครามจะจบลงเมื่อ[?global.african_revolt_country.GetNameDef]พายแพ"

 BBA_ethiopia_anti_colonialism_events.3.t: "การไกลเกลี่ยของ[?global.african_supporting_country.GetAdjective]สําเร็จ!"
 BBA_ethiopia_anti_colonialism_events.3.desc: "[?global.african_supporting_country.GetLeader] ผูนําแหง[?global.african_supporting_country.GetNameDef] ไดเจรจากับ[?global.african_colonial_country.GetLeader]แทนเราจนสําเร็จ [?global.african_colonial_country.GetLeader]ตกลงรับรองเอกราชของ[ROOT.GetAdjective]และสั่งใหยุติการสูรบระหวาง[?global.african_colonial_country.GetNameDef]และ[ROOT.GetNameDef] [ROOT.GetNameDefCap]จะเปนหนี้บุญคุณ[?global.african_supporting_country.GetNameDef]ตลอดไปสําหรับความชวยเหลือในการตอสูของเรา"
 BBA_ethiopia_anti_colonialism_events.3.a: "ในที่สุดก็ไดรับอิสรภาพ"

 BBA_ethiopia_anti_colonialism_events.4.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะรับรองเอกราชของ[?global.african_revolt_country.GetAdjective]"
 BBA_ethiopia_anti_colonialism_events.4.desc: "แมเราจะกดดัน แตรัฐบาล[?global.african_colonial_country.GetAdjective]ก็ปฏิเสธที่จะรับรอง[?global.african_revolt_country.GetNameDef]และยุติการสูรบ ฝาย[?global.african_colonial_country.GetAdjective]ดูเหมือนจะมุงมั่นทําลายขบวนการเรียกรองเอกราช นี่นาจะเปนขีดสุดที่เราทําไดดวยการทูตเพียงอยางเดียว"
 BBA_ethiopia_anti_colonialism_events.4.a: "อยางนอยเราก็ไดพยายาม"
 BBA_ethiopia_anti_colonialism_events.4.b: "ถาเชนนั้นเราตองบังคับพวกเขา"

 BBA_ethiopia_anti_colonialism_events.5.t: "[FROM.GetName]เขารวมสงครามตอตาน[?global.african_colonial_country.GetName]"
 BBA_ethiopia_anti_colonialism_events.5.desc: "หลังจากพยายามไกลเกลี่ยในสงครามระหวางเรากับ[?global.african_colonial_country.GetNameDef]แตลมเหลว [?global.african_supporting_country.GetNameDef]ไดตัดสินใจเริ่มสนับสนุนการตอสูของ[ROOT.GetAdjective]อยางแข็งขัน เอกอัครราชทูต[?global.african_colonial_country.GetAdjective]ประจํา[?global.african_supporting_country.GetName]ไดรับแจงวา[?global.african_supporting_country.GetNameDef]ถือวาตนอยูในภาวะสงครามกับ[?global.african_colonial_country.GetName]นับแตนี้ไป จนกวา[?global.african_colonial_country.GetNameDef]จะละทิ้งความทะเยอทะยานแบบจักรวรรดินิยมและอาณานิคมในแอฟริกาและที่อื่นๆ"
 BBA_ethiopia_anti_colonialism_events.5.a: "กองกําลังของ[ROOT.GetName]และ[?global.african_supporting_country.GetName]ผนึกกําลังกัน!"

 BBA_ethiopia_anti_colonialism_events.6.t: "อิสรภาพแด[FROM.GetNameDef]"
 BBA_ethiopia_anti_colonialism_events.6.desc: "หลังแรงกดดันทางการทูตอยางหนักจาก[ROOT.GetName] รวมถึงการพบปะโดยตรงระหวาง[ROOT.GetLeader]และ[?global.african_colonial_country.GetLeader] รัฐบาล[?global.african_colonial_country.GetAdjective]ก็ตัดสินใจยอมถอย และรับรองเอกราชของ[?global.african_revolt_country.GetAdjective] \nดวยการแทรกแซงโดยตรงของ[ROOT.GetAdjective] สงครามเพื่อเอกราชของ[?global.african_revolt_country.GetAdjective]ก็สิ้นสุดลงในที่สุด [?global.african_revolt_country.GetNameDefCap]เปนประเทศเสรี และ[ROOT.GetLeader]จะเปนวีรบุรุษใน[?global.african_revolt_country.GetNameDef]ตลอดไปอยางแนนอน"
 BBA_ethiopia_anti_colonialism_events.6.a: "อีกหนึ่งประเทศที่ไดรับการปลดปลอยจากพวกจักรวรรดินิยม"

# Industrial and Financial Events
 BBA_ethiopia_industrial_financial_events.2.t: "[FROM.GetNameDefCap]เรียกรองการผนวกรวม"
 BBA_ethiopia_industrial_financial_events.2.desc: "โดยอางขอเท็จจริงที่วาเศรษฐกิจของ[ROOT.GetName]และ[FROM.GetName]เชื่อมโยงกันอยางแนบแนน และอุตสาหกรรมสวนใหญใน[ROOT.GetName]ก็ถูก[FROM.GetName]ควบคุมอยูแลว [FROM.GetLeader]จึงเรียกรองใหรื้อถอนดานพรมแดนระหวางสองประเทศ การควบคุมนโยบายตางประเทศทั้งหมดจะอยูภายใตการควบคุมของ[FROM.Getname] เพื่อใหเกิดการคุมครอง การประสานงาน และประสิทธิภาพสูงสุด ซึ่งโดยผลก็คือจุดจบของเอกราช[ROOT.GetAdjective]\n [FROM.GetLeader]ยืนยันวาทั้งหมดนี้จะทําโดยคํานึงถึงประโยชนสูงสุดของทั้งสองประเทศ"
 BBA_ethiopia_industrial_financial_events.2.a: "พวกเขาไมมีสิทธิ์ทําเชนนี้!"
 BBA_ethiopia_industrial_financial_events.2.b: "ตราบใดที่เรายังคงอํานาจปกครองตนเองไวไดบาง"
 BBA_ethiopia_industrial_financial_events.2.c: "นี่เปนสิ่งที่ดีที่สุดสําหรับทั้งสองประเทศจริงๆ"

 BBA_ethiopia_industrial_financial_events.3.t: "[FROM.GetName]ปฏิเสธที่จะรวมมือ"
 BBA_ethiopia_industrial_financial_events.3.desc: "แมเราจะพยายามอธิบายสถานการณอยางเต็มที่ [FROM.GetLeader]ก็ปฏิเสธที่จะทําตามขอเรียกรองของเราที่จะยกระดับการรวมเศรษฐกิจขึ้นอีกขั้น [FROM.GetLeader]อางวาเอกราชของ[FROM.GetName]ตองไมถูกทําใหมัวหมอง และไมอาจนํามาเปนสวนหนึ่งของการเจรจาใดๆ ไดเลย"
 BBA_ethiopia_industrial_financial_events.3.a: "เราอาจตองใชกําลังเพื่อปกปองผลประโยชนของเรา"

 BBA_ethiopia_industrial_financial_events.4.t: "[FROM.GetName]ตองการคงการควบคุมบางสวนไว"
 BBA_ethiopia_industrial_financial_events.4.desc: "[FROM.GetLeader]เห็นความจําเปนที่จะตองกระชับความรวมมือและประสานนโยบายตางประเทศและการเงินใหมากกวาปจจุบัน อยางไรก็ตาม [FROM.GetLeader.GetSheHe]ตองการให[FROM.GetNAme]คงอํานาจปกครองตนเองไวในระดับหนึ่งภายในสหพันธรัฐใหม"
 BBA_ethiopia_industrial_financial_events.4.a: "เรื่องนี้รองรับไดแนนอน"

 BBA_ethiopia_industrial_financial_events.5.t: "[FROM.GetLeader]ตกลง"
 BBA_ethiopia_industrial_financial_events.5.desc: "[FROM.GetLeader]ไดลงนามในเอกสารที่รวม[ROOT.GetName]และ[FROM.GetName]เขาดวยกัน นโยบายเศรษฐกิจจะถูกปรับใหสอดคลองกัน กระทรวงการตางประเทศจะถูกรวมเปนหนึ่งเดียว ระบบยุติธรรมจะถูกควบรวมเพื่อใหรวมมือกันไดอยางเต็มที่งายขึ้น\nนับแตวันนี้ [FROM.GetNameDefCap]จะเปนสวนหนึ่งที่แยกไมออกของ[ROOT.GetName]"
 BBA_ethiopia_industrial_financial_events.5.a: "นี่เปนประโยชนตอทุกคน"

#Fascist Ethiopia
 BBA_ethiopia_fascist_events.01.t: "โอกาสแหงการเปลี่ยนแปลง"
 BBA_ethiopia_fascist_events.01.desc: "แนวทางเผชิญหนากับชาวอิตาลีของ$ETH_haile_selassie$ ประกอบกับความไววางใจในสันนิบาตชาติของเขา ไมไดนําไปสูสิ่งใดเลย เปนที่ประจักษแกทุกคนวาสิ่งนี้จะเปนหายนะของ[ROOT.GetName]\n\n สงครามคือโอกาสแหงการเปลี่ยนแปลง และแนนอนวามันทําใหการเปลี่ยนแปลงกลายเปนความจําเปนดวยซํ้า สิ่งแรกที่ตองทําคือสงทูตไปเจรจาขอตกลงสันติภาพที่ชาวอิตาลียอมรับได"
 BBA_ethiopia_fascist_events.01.a: "$ETH_haile_selassie_gugsa$ คือตัวเลือกที่ชัดเจน"
 ETH_start_civil_war: "§Y$ETH_haile_selassie_gugsa$§! จะเริ่ม§Yสงครามกลางเมือง§!ตอตาน§Y$ETH_haile_selassie$§! เมื่อแผนยุทธศาสตร§Y$ETH_declare_for_italy$§!เสร็จสิ้น"
 ETH_cede_states_tt: "\nเมื่อสงครามสิ้นสุด §Y[ITA.GetNameWithFlag]§! จะไดรับรัฐตอไปนี้:"
 ETH_cede_south_tt: "§Y [835.GetName]\n [836.GetName]\n [837.GetName]§!"
 ETH_ethiopia_italian_puppet_tt: "\n§Y[ETH.GetNameDef]§! จะกลายเปนรัฐในอารักขาของ§Y[ITA.GetNameDef]§!"
 ETH_italy_refuse_cooperation: "แผนยุทธศาสตร§Y$ETH_reach_out_to_the_italians$§!จะถูกยกเลิก และแผนยุทธศาสตร§Y$ETH_rally_around_the_emperor$§!จะเสร็จสิ้นโดยอัตโนมัติ"

 BBA_ethiopia_fascist_events.01.b: "สง$ETH_hailu_tekle_haymanot$แหง$gojjam$"
 ETH_start_civil_war_gojjam: "§Y$ETH_hailu_tekle_haymanot$§!แหง$gojjam$จะเริ่ม§Yสงครามกลางเมือง§!ตอตาน§Y$ETH_haile_selassie$§! เมื่อแผนยุทธศาสตร§Y$ETH_declare_for_italy$§!เสร็จสิ้น"
 ETH_gojjam_italian_puppet_tt: "\n§Y$gojjam$§! จะกลายเปนรัฐในอารักขาของ§Y[ITA.GetNameWithFlag]§!"
 ETH_cede_south_west_tt: "§Y [838.GetName]\n [836.GetName]\n [837.GetName]§!"
 BBA_ethiopia_fascist_events.01.c: "บางที$ETH_abba_jofir$อาจมีโอกาสสําเร็จมากที่สุด"
 ETH_start_civil_war_jimma: "§Y$ETH_abba_jofir$§!แหง$jimma$จะเริ่ม§Yสงครามกลางเมือง§!ตอตาน§Y$ETH_haile_selassie$§! เมื่อแผนยุทธศาสตร§Y$ETH_declare_for_italy$§!เสร็จสิ้น"
 ETH_cede_north_tt: "§Y [841.GetName]\n [842.GetName]\n [843.GetName]§!"
 ETH_jimma_italian_puppet_tt: "\n§Y$jimma$§! จะกลายเปนรัฐในอารักขาของ§Y[ITA.GetNameWithFlag]§!"

 BBA_ethiopia_fascist_events.02.t: "ผูอางสิทธิ์แสวงหาสันติภาพ"
 BBA_ethiopia_fascist_events.02.desc: "ขุนนาง[ETH.GetAdjective]ผูหนึ่งนาม$ETH_haile_selassie_gugsa$ ซึ่งมีสิทธิ์ในราชบัลลังกเชนกัน ไดเขาหากองบัญชาการระดับสูงของ[ROOT.GetAdjective]ใน[ETH.GetName] ขุนนางผูนี้เสนอความชวยเหลือตอตาน[ETH.GetLeader]เพื่อแลกกับการควบคุมบางสวนของประเทศหลังสงคราม แนนอนวา$ETH_haile_selassie_gugsa$จะปฏิญาณความภักดีตอ$ITA_vittorio_emanuele_iii$ และปกครอง[ETH.GetName]แทนพระองค"
 BBA_ethiopia_fascist_events.02.a: "ที่จริงแลวนี่เปนประโยชนมากทีเดียว"
 BBA_ethiopia_fascist_events.02.b: "ไม เราไมตองการความชวยเหลือใดๆ ขอบคุณ"

 BBA_ethiopia_fascist_events.03.t: "$gojjam$ปกครองตนเอง?"
 BBA_ethiopia_fascist_events.03.desc: "ผูแทนของผูอางสิทธิ์แหง$gojjam$ที่ถูกคุมขังอยู $ETH_hailu_tekle_haymanot$ เสนอที่จะสนับสนุน[ROOT.GetName]ในการพิชิต[ETH.GetName] เพื่อแลกกับการคืนตําแหนงให$ETH_hailu_tekle_haymanot$เปนผูนําของ$gojjam$ที่ปกครองตนเองกึ่งอิสระ การลุกฮือดวยอาวุธทางเหนือยอมทําใหกองกําลัง[ETH.GetAdjective]เปนอัมพาตและนํามาซึ่งชัยชนะอยางรวดเร็ว"
 BBA_ethiopia_fascist_events.03.a: "ที่จริงแลวนี่เปนประโยชนมากทีเดียว"
 BBA_ethiopia_fascist_events.03.b: "ไม เราไมตองการความชวยเหลือใดๆ ขอบคุณ"

 BBA_ethiopia_fascist_events.04.t: "ผูนําที่ถูกโคนแหง$jimma$เสนอความชวยเหลือ"
 BBA_ethiopia_fascist_events.04.desc: "$ETH_abba_jofir$ บุตรของสุลตานองคสุดทายแหง$jimma$ เสนอที่จะรวมมือกับ[ROOT.getName]เพื่อแลกกับการที่[ROOT.GetAdjective]รับรองสถานะของ$ETH_abba_jofir$ในฐานะผูปกครอง$jimma$ หาก[ROOT.getName]ยอมรับขอเสนอ $jimma$ยอมเปนสวนหนึ่งของจักรวรรดิ[ROOT.GetAdjective] และ$ETH_abba_jofir$จะปฏิญาณความภักดีตอราชบัลลังก[ROOT.GetAdjective]"
 BBA_ethiopia_fascist_events.04.a: "สุลตานหุนเชิดอาจเปนประโยชนตอเราไดดี"
 BBA_ethiopia_fascist_events.04.b: "ไม เราไมตองการความชวยเหลือใดๆ ขอบคุณ"

 BBA_ethiopia_fascist_events.05.t: "[FROM.GetName]ยอมรับขอเสนอของเรา"
 BBA_ethiopia_fascist_events.05.desc: "ภารกิจไปยังกองบัญชาการ[FROM.GetAdjective]ประสบความสําเร็จอยางงดงาม [ITA.GetLeader]อนุมัติแผนการลุกฮือและยอมรับใหรัฐกึ่งปกครองตนเองคงอยูตอไปหลังสงคราม เราตองรีบเริ่มการกอกบฏกอนที่พวกเขาจะเปลี่ยนใจ"
 BBA_ethiopia_fascist_events.05.a: "จุดเริ่มตนของยุคใหม"

 BBA_ethiopia_fascist_events.06.t: "ชาวอิตาลีปฏิเสธที่จะรวมมือ"
 BBA_ethiopia_fascist_events.06.desc: "นาเสียดายที่[FROM.GetLeader]ดูเหมือนจะมุงมั่นอยางแรงกลาที่จะพิชิตเอธิโอเปยทั้งหมด [FROM.GetNameDefCap]ปฏิเสธที่จะหารือสนธิสัญญาสันติภาพใดๆ โดยสิ้นเชิง ซึ่งเทากับปดทางทุกความพยายามที่จะหาทางออกอยางสันติ ความหวังเดียวของเราตอนนี้คือการรวมพลังเบื้องหลังจักรพรรดิและพยายามควาชัยชนะทางทหาร"
 BBA_ethiopia_fascist_events.06.a: "โชครายยิ่งนัก"

 BBA_ethiopia_fascist_events.07.t: "สงครามกลางเมืองเอธิโอเปย"
 BBA_ethiopia_fascist_events.07.desc: "[ROOT.GetEthiopianCollaboratorName]ประกาศเขาขางชาวอิตาลีอยางเปดเผยเพื่อตอตานจักรพรรดิ โดยระบุวานี่คือการถือกําเนิดของ[ROOT.GetName]ใหม อยางไรก็ตาม แมจะอยูในสถานการณสิ้นหวัง $ETH_haile_selassie$ก็ปฏิเสธที่จะยอมรับความพายแพ การสูรบไดเริ่มขึ้นแลว และแมวาขุนนางรุนเกาสวนใหญยังคงอยูขางจักรพรรดิ แตการตอสูครั้งนี้นาจะจบไดเพียงทางเดียว"
 BBA_ethiopia_fascist_events.07.a: "มุงหนาสูชัยชนะ"

 BBA_ethiopia_fascist_events.50.t: "กองกําลัง[ETH.GetAdjective]ยึดครองโซมาลีแลนดของ[ROOT.GetAdjective]"
 BBA_ethiopia_fascist_events.50.desc: "ขณะที่เรามุงความสนใจไปที่กิจการใกลบาน รัฐบาล[ETH.GetAdjective]ไดฉวยโอกาสอางสิทธิ์ในโซมาลีแลนดของ[ROOT.GetAdjective]เปนของตน เมื่อถูกตัดขาดและแทบไมมีหวังจะตานทาน เจาหนาที่[Root.GetAdjective]ในพื้นที่จึงยอมสงมอบดินแดนไปโดยงาย เราตองตัดสินใจวาจะยอมรับความอัปยศนี้อยางเปนทางการ หรือจะมุงมั่นยึดดินแดนอันชอบธรรมของเราคืน"
 BBA_ethiopia_fascist_events.50.a: "เราตองกัดฟนยอมรับความสูญเสีย"
 BBA_ethiopia_fascist_events.50.b: "เราจะไมทนตอความอัปยศเชนนี้!"
 BBA_ethiopia_fascist_events.51.t: "[FROM.GetName]ยอมรับการควบคุมโซมาลีแลนดของ[ETH.GetAdjective]"
 BBA_ethiopia_fascist_events.51.desc: "รัฐที่เหลืออยูของ[FROM.GetName]ไดยอมรับการควบคุมของเราเหนืออดีตดินแดนโซมาลีแลนดของ[FROM.GetAdjective]อยางเปนทางการ ดวยความที่แทบไมมีทางยึดดินแดนคืนได ดูเหมือนพวกเขาจะเลือกมุงความสนใจไปที่กิจการใกลบาน มากกวาจะติดหลมอยูในความขัดแยงกับกองทัพผูกลาหาญของเรา"
 BBA_ethiopia_fascist_events.51.a: "[ETH.GetName]แข็งแกรงขึ้น!"
 BBA_ethiopia_fascist_events.52.t: "[FROM.GetName]ปฏิเสธการควบคุมโซมาลีแลนดของ[ETH.GetAdjective]"
 BBA_ethiopia_fascist_events.52.desc: "ในความพลิกผันที่นาประหลาดใจ รัฐที่เหลืออยูของ[FROM.GetName]ไดปฏิเสธการอางกรรมสิทธิ์ของเราเหนืออดีตดินแดนโซมาลีแลนดของ[FROM.GetAdjective] แมจะแทบไมมีทางยึดดินแดนคืนได แตดูเหมือนพวกเขามุงมั่นจะสงทหารที่เหลืออยูมาตายตอหนากองทัพผูกลาหาญของเรา"
 BBA_ethiopia_fascist_events.52.a: "พวกเขาเพิ่งแพสงครามไปครั้งหนึ่ง และกําลังจะแพอีกครั้ง"

 BBA_ethiopia_fascist_events.53.t: "ขอยุทโธปกรณจาก[ITA.GetAdjective]"
 BBA_ethiopia_fascist_events.53.desc: "แมเราจะกาวหนาอยางมากในการปฏิรูปเศรษฐกิจและเสริมสรางกองทัพ แตเราก็ยังไดประโยชนจากการสนับสนุนในภารกิจเหลานี้ ดวยความสัมพันธที่ลึกซึ้งยิ่งขึ้นกับชาว[ITA.GetAdjective] พวกเขาอาจยินดีสงยุทโธปกรณสวนเกินบางสวนมาใหเรา เราเพียงตองตัดสินใจวาจะขออะไร"
 BBA_ethiopia_fascist_events.53.a: "ทหารทุกคนตองมีปนไรเฟล"
 BBA_ethiopia_fascist_events.53.b: "ปนใหญจะยับยั้งศัตรูของเรา"

 BBA_ethiopia_fascist_events.54.t: "[FROM.GetName]ขอยุทโธปกรณทางทหาร"
 BBA_ethiopia_fascist_events.54.desc: "เราไดรับคํารองขอยุทโธปกรณทางทหารจาก[FROM.GetName] ซึ่งจะชวยกองทัพ[FROM.GetAdjective]ในการปรับปรุงใหทันสมัยไดอยางมาก และยังชวยใหเราระบายยุทโธปกรณสวนเกินรุนเกาออกไปบาง"
 BBA_ethiopia_fascist_events.54.a: "เราคงแบงยุทโธปกรณเกาใหไดบาง"
 BBA_ethiopia_fascist_events.54.b: "ไม เราไมตองการให[FROM.GetName]แข็งแกรงขึ้น"

 BBA_ethiopia_fascist_events.55.t: "[ITA.GetName]ปฏิเสธที่จะสงยุทโธปกรณทางทหาร"
 BBA_ethiopia_fascist_events.55.desc: "รัฐบาล[ITA.GetAdjective]ปฏิเสธคํารองขอยุทโธปกรณทางทหารของเราดวยคําตอบที่หวนเกินจําเปน ยังไมชัดเจนวาเหตุผลเบื้องหลังการตัดสินใจนี้คืออะไร เราคงตองพึ่งพาอุตสาหกรรมของเราเองเพื่อดําเนินแผนปรับปรุงใหทันสมัยตอไป"
 BBA_ethiopia_fascist_events.55.a: "เรารูอยูแลววาพวกเขาไวใจไมได"

 BBA_ethiopia_fascist_events.56.t: "[ITA.GetName]ตกลงสงยุทโธปกรณทางทหาร"
 BBA_ethiopia_fascist_events.56.desc: "รัฐบาล[ITA.GetAdjective]อนุมัติคํารองขอยุทโธปกรณทางทหารของเรา แมจะไมใชยุทโธปกรณที่ดีที่สุดของพวกเขาอยางแนนอน แตก็จะเรงแผนปรับปรุงใหทันสมัยของเราไดแน"
 BBA_ethiopia_fascist_events.56.a: "เราไมเคยสงสัยในตัวพวกเขาเลย"

 BBA_ethiopia_fascist_events.10.t: "จับตัวศัตรูได"
 BBA_ethiopia_fascist_events.10.desc: "เมื่อกองกําลังศัตรูยอมจํานน นายทหารระดับสูงหลายคนก็ตกอยูในมือเรา พวกเขาจะถูกคุมขังไวกอน แตหวังวาในภายหลังเราอาจโนมนาวบางคนใหเขารวมอุดมการณของเราได"
 BBA_ethiopia_fascist_events.10.a: "ดี"
 captured_ethiopian_commanders_tt: "$ETH_seyoum_mengesha$, $ETH_ayalew_birru$ และ $ETH_ras_kassa$ จะถูกคุมขัง"
 captured_ethiopian_commanders_jimma_tt: "$ETH_seyoum_mengesha$, $ETH_ayalew_birru$, $ETH_balcho_safo$, $ETH_tadesse_birru$ และ $ETH_ras_kassa$ จะถูกคุมขัง"

 BBA_ethiopia_fascist_events.20.t: "[FROM.GetNameDefCap]ประกาศเอกราช"
 BBA_ethiopia_fascist_events.20.desc: "[FROM.GetLeader]ประกาศวา[FROM.GetNameDef]จะไมยอมรับอํานาจเหนือของ[ROOT.GetAdjective]อีกตอไป [FROM.GetNameDefCap]ปรารถนาจะรักษาความสัมพันธอันดีกับ[ROOT.GetNameDef]หากเปนไปได แต[FROM.GetLeader]ระบุวาพวกเขาพรอมจะจับอาวุธตอสูเพื่อเอกราชหากจําเปน"
 BBA_ethiopia_fascist_events.20.a: "พวกเขาตองไดรับบทเรียน"
 BBA_ethiopia_fascist_events.20.b: "เรามีเรื่องสําคัญกวาใหคิด"

 BBA_ethiopia_fascist_events.21.t: "เกียรติยศของ[ETH.GetAdjective]ไดรับการฟนฟู"
 BBA_ethiopia_fascist_events.21.desc: "ในความพลิกผันที่คอนขางนาประหลาดใจ [FROM.GetLeader]ยอมรับคําประกาศเอกราชของ[ROOT.GetAdjective] นับจากนี้ไป [FROM.GetNameDef]จะไมมีอิทธิพลใดๆ เหนือการเมืองของ[ROOT.GetAdjective] ทั้งภายในและภายนอก ฝูงชนมหาศาลไดมารวมตัวกันที่จัตุรัสใหญของ[ROOT.Capital.GetCapitalVictoryPointName]เพื่อเฉลิมฉลองการนําของ[ROOT.GetLeader]"
 BBA_ethiopia_fascist_events.21.a: "แอกไดถูกปลดออกแลว"

 BBA_ethiopia_fascist_events.22.t: "การตอสูเริ่มขึ้นอีกครั้ง"
 BBA_ethiopia_fascist_events.22.desc: "ตามคาด [FROM.getLeader]ปฏิเสธคํารองขอเอกราชอยางเปนทางการจาก[ROOT.GetLeader] เนื่องจากเปนสถานการณที่คาดการณไวแลว กองทัพ[ROOT.GetAdjective]จึงกําลังยึดจุดสําคัญตางๆ ในประเทศอยูแลว ครั้งนี้ชาติของเราเตรียมพรอมดีกวามาก"
 BBA_ethiopia_fascist_events.22.a: "เราจะชนะและไดอิสรภาพของเรา"

 BBA_ethiopia_fascist_events.23.t: "นักรบฝายตอตาน"
 BBA_ethiopia_fascist_events.23.desc: "กลุมนักรบฝายตอตานที่จัดตั้งอยางเปนระบบไดลุกฮือขึ้นหลังแนวขาศึก ทหารนอกแบบเหลานี้สูเคียงขางเราเพื่อตอตานผูกดขี่ชาว[ITA.GetAdjective] คุณคาในการรบของพวกเขาอาจไมสูงที่สุด แตพวกเขาจะสรางความสับสนและความปนปวนใหแกกองทัพขาศึกไดอยางแนนอน"
 BBA_ethiopia_fascist_events.23.a: "ความชวยเหลือที่นายินดียิ่ง"

 BBA_ethiopia_fascist_events.57.t: "[FROM.GetName]ขอทําขอตกลงจางผลิตอาวุธ"
 BBA_ethiopia_fascist_events.57.desc: "[FROM.GetName]ขอทําขอตกลงจางผลิตอาวุธ โดยใหบริษัท[ITA.GetAdjective]ไปตั้งโรงงานในประเทศของพวกเขาเพื่อผลิตยุทโธปกรณทางทหาร ผูบริหารของบริษัทที่ไดรับเลือกยอมยินดีกับโอกาสขยายกิจการนี้อยางไมตองสงสัย อยางไรก็ตาม หาก[FROM.GetName]กอกบฏขึ้นมา เราจะตองสูกับศัตรูที่รูจุดออนของเรามากมาย"
 BBA_ethiopia_fascist_events.57.a: "การเสริมความแข็งแกรงให[FROM.GetName]จะชวยใหเรายายกําลังในพื้นที่ไปใชที่อื่นได"
 BBA_ethiopia_fascist_events.57.b: "เราไมอาจเสี่ยงใหแบบของเราตกไปอยูในมือศัตรู"

 BBA_ethiopia_fascist_events.58.t: "[ITA.GetName]ยอมรับขอตกลงจางผลิต"
 BBA_ethiopia_fascist_events.58.desc: "ดวยความสามารถของนักการทูตของเรา [ITA.GetLeader]ไดอนุญาตใหบริษัท[ITA.GetAdjective]มาตั้งโรงงานในประเทศของเรา สิ่งนี้จะเรงขีดความสามารถของเราในการวิจัยและผลิตยุทโธปกรณทางทหารของเราเองไดอยางรวดเร็ว"
 BBA_ethiopia_fascist_events.58.a: "วันอันยิ่งใหญของ[ETH.GetName]"

 BBA_ethiopia_fascist_events.59.t: "[ITA.GetName]ปฏิเสธขอตกลงจางผลิต"
 BBA_ethiopia_fascist_events.59.desc: "นักการทูตไรฝมือของเราลมเหลวในการโนมนาว[ITA.GetLeader]ถึงความจําเปนของขอตกลงจางผลิตอาวุธ นี่เปนการโจมตีอยางรุนแรงตอการพัฒนาทางทหารและอุตสาหกรรมของเรา"
 BBA_ethiopia_fascist_events.59.a: "โอกาสที่หลุดลอยไป"

 BBA_ethiopia_fascist_events.60.t: "จางผลิตอาวุธ"
 BBA_ethiopia_fascist_events.60.desc: "ชาว[ITA.GetAdjective]จะไมยอมเปดเผยความลับทางอุตสาหกรรมทั้งหมดกับเรา เพราะกลัววาจะตกไปอยูในมือศัตรู ดังนั้นเราตองคิดใหรอบคอบวากองทัพดานใดจะไดประโยชนสูงสุดจากการจางนักออกแบบ[ITA.GetAdjective]ผลิต"
 BBA_ethiopia_fascist_events.60.a: "กองทัพบกตองการการปรับปรุงใหทันสมัยเหนือสิ่งอื่นใด"
 BBA_ethiopia_fascist_events.60.b: "กองทัพอากาศจะสําคัญยิ่งขึ้นในสงครามอนาคต"

 BBA_ethiopia_fascist_events.61.t: "[FROM.GetName]ขออาวุธเพื่อโคนลมการปกครองของ[ITA.GetAdjective]"
 BBA_ethiopia_fascist_events.61.desc: "นักการทูต[ETH.GetAdjective]มาพบเราพรอมคํารองขอลับใหจัดหาอาวุธ ดูเหมือนสถานการณในดินแดนที่[ITA.GetName]เพิ่งไดมาจะไมคอยดีนัก และฝายบริหารทองถิ่นกําลังแสวงหาความชวยเหลือจากตางชาติเพื่อโคนลมเจาเหนือหัวของพวกเขา แมการกบฏจะลมเหลว แตก็ยอมทําใหกองทัพ[ITA.GetAdjective]เสียสมาธิและออนแอลงอยางไมตองสงสัย อยางไรก็ตาม อาจมีผลกระทบตามมาหากมีการคนพบวาเรามีสวนสนับสนุนการกบฏ"
 BBA_ethiopia_fascist_events.61.a: "นี่นาจะทําใหชาว[ITA.GetAdjective]วุนไปพักใหญ"
 BBA_ethiopia_fascist_events.61.b: "เราจะไมชวยศัตรูในอนาคต"

 BBA_ethiopia_fascist_events.62.t: "[FROM.GetName]ตกลงตามคํารองขออาวุธ"
 BBA_ethiopia_fascist_events.62.desc: "นักการทูต[FROM.GetAdjective]สงสัญญาณวาพวกเขายินดีเริ่มสงอาวุธมาใหเราขณะที่เราเตรียมโคนลมกองกําลัง[ITA.GetAdjective] แนนอนวาเราไดรับคําสั่งใหปฏิเสธการมีสวนเกี่ยวของของพวกเขาโดยสิ้นเชิง หากกองกําลัง[ITA.GetAdjective]คนพบอาวุธเหลานี้"
 BBA_ethiopia_fascist_events.62.a: "ชัยชนะอยูแคขอบฟา"

 BBA_ethiopia_fascist_events.63.t: "[FROM.GetName]ปฏิเสธคํารองขออาวุธ"
 BBA_ethiopia_fascist_events.63.desc: "นักการทูต[FROM.GetAdjective]ปฏิเสธความพยายามของเราที่จะจัดหาอาวุธอยางลับๆ ดูเหมือนพวกเขาจะไมแนใจวาเรานาไววางใจเพียงใดขณะที่ยังอยูใตอิทธิพลของ[ITA.GetAdjective] พวกเขาอาจลังเลที่จะเสี่ยงยั่วยุระบอบ[ITA.GetAdjective]ในชวงเวลาอันปนปวนนี้ดวย"
 BBA_ethiopia_fascist_events.63.a: "ชางสายตาสั้นเสียจริง"

 BBA_ethiopia_fascist_events.64.t: "[FROM.GetName]ขอควบคุม[550.GetName]"
 BBA_ethiopia_fascist_events.64.desc: "[ETH.GetLeader]ขอควบคุม[550.GetName]เปนรางวัล หรือเปนคาชดเชยแลวแตมุมมอง สําหรับความภักดีอยางตอเนื่องของเขาตอ[ITA.GetName] [ETH.GetLeader]มีบทบาทสําคัญในการทลายภาวะชะงักงันเมื่อบุกเอธิโอเปย และการนี้จะชวยรักษาความสัมพันธอันดีไดมาก อยางไรก็ตาม ประชาชน[ITA.GetAdjective]อาจไมเขาใจนักวาทําไมเราจึงยกดินแดนใหคนอื่น"
 BBA_ethiopia_fascist_events.64.a: "เราจะตอบแทนความภักดีของพวกเขา"
 BBA_ethiopia_fascist_events.64.b: "พวกเขาไมอยูในฐานะที่จะเรียกรองอะไรได"

 BBA_ethiopia_fascist_events.65.t: "[FROM.GetName]ขอควบคุม[559.GetName]และ[844.GetName]"
 BBA_ethiopia_fascist_events.65.desc: "[ETH.GetLeader]ขอควบคุม[559.GetName]และ[844.GetName]เปนรางวัล หรือเปนคาชดเชยแลวแตมุมมอง สําหรับความภักดีอยางตอเนื่องของเขาตอ[ITA.GetName] [ETH.GetLeader]มีบทบาทสําคัญในการทลายภาวะชะงักงันเมื่อบุกเอธิโอเปย และการนี้จะชวยรักษาความสัมพันธอันดีไดมาก อยางไรก็ตาม ประชาชน[ITA.GetAdjective]อาจไมเขาใจนักวาทําไมเราจึงยกดินแดนใหคนอื่น"
 BBA_ethiopia_fascist_events.65.a: "เราจะตอบแทนความภักดีของพวกเขา"
 BBA_ethiopia_fascist_events.65.b: "พวกเขาไมอยูในฐานะที่จะเรียกรองอะไรได"

 BBA_ethiopia_fascist_events.66.t: "[ITA.GetName]ตกลงชดเชยดินแดน"
 BBA_ethiopia_fascist_events.66.desc: "[ITA.GetName]ไดกรุณายอมรับคํารองขอของเราใหควบคุมดินแดนตามที่ขอ นี่คือจุดเริ่มตนของบทใหมในความสัมพันธอิตาลี-[ETH.GetAdjective]"
 BBA_ethiopia_fascist_events.66.a: "อนาคตเปนของประชาชน[ETH.GetAdjective]"

 BBA_ethiopia_fascist_events.67.t: "[ITA.GetName]ปฏิเสธการชดเชยดินแดน"
 BBA_ethiopia_fascist_events.67.desc: "นักการทูต[ITA.GetAdjective]ตอบกลับคํารองขอคาชดเชยดินแดนของเราดวยความขุนเคือง พวกเขาโตแยงวาประชาชน[ITA.GetAdjective]คงรับไมไดที่จะยกดินแดนซึ่งแลกมาดวยเลือดเนื้อของพวกเขาใหใครก็ตาม ไมตองพูดถึงการยกใหอดีตศัตรู"
 BBA_ethiopia_fascist_events.67.a: "พวกเขากําลังทดสอบความภักดีของเรา..."

 BBA_ethiopia_fascist_events.68.t: " คลังอาวุธของ[ITA.GetAdjective]ถูกปลน"
 BBA_ethiopia_fascist_events.68.desc: "เมื่อคืนนี้ คลังอาวุธของ[ITA.GetAdjective]แหงหนึ่งถูกบุกปลนและขนอาวุธไปจนหมดสิ้น เจาหนาที่อิตาลีกลาวหาฝายบริหารของเราอยางเดือดดาลวาเปนผูบงการเหตุการณนี้ ทั้งที่มีหลักฐานนอยมาก แตพวกเขาอาจเริ่มสงสัยเมื่อเห็นทหารของเราถือปนไรเฟล[ITA.GetAdjective]ใหมเอี่ยมเปนประกาย..."
 BBA_ethiopia_fascist_events.68.a: "ชางเปนขอกลาวหาที่อุกอาจ"

 BBA_ethiopia_fascist_events.69.t: "[FROM.GetName]ขอที่ปรึกษาทางทหาร"
 BBA_ethiopia_fascist_events.69.desc: "ผูนําของ[ETH.GetName]ยอมรับถึงความออนแอของกองทัพตน จึงขอการสนับสนุนจากเรา พวกเขาอยากรูวาเราจะยอมใหนายทหารของเราบางสวนเขารวมคณะเสนาธิการของพวกเขา และใหคําแนะนําวาจะใชเครื่องมือของสงครามสมัยใหมอยางไรใหดีที่สุดหรือไม"
 BBA_ethiopia_fascist_events.69.a: "[FROM.GetName]ที่แข็งแกรงขึ้นจะชวยใหเรามุงความสนใจไปที่ภูมิภาคใกลบานได"
 BBA_ethiopia_fascist_events.69.b: "นายทหารของเราจําเปนตองใชที่อื่น"
 ETH_send_ita_generals_tt: "\n§Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! และ §Y$ITA_alessandro_pirzio_biroli$§! จะถูกยายไปเอธิโอเปย"

 BBA_ethiopia_fascist_events.70.t: "[FROM.GetName]ตกลงสงนายทหาร"
 BBA_ethiopia_fascist_events.70.desc: "[FROM.GetName]ตกลงใหนายทหารบางสวนของพวกเขาเขารวมคณะเสนาธิการของเราไปอีกระยะหนึ่ง หวังวาเราจะไดเรียนรูวิธีใชยุทโธปกรณใหมในสนามรบสมัยใหมใหไดผลดีที่สุด"
 BBA_ethiopia_fascist_events.70.a: "ยอดเยี่ยม"

 BBA_ethiopia_fascist_events.71.t: "[FROM.GetName]ปฏิเสธที่จะสงนายทหาร"
 BBA_ethiopia_fascist_events.71.desc: "[FROM.GetName]ปฏิเสธที่จะใหนายทหารของพวกเขาเขารวมคณะเสนาธิการของเรา เราไดรับแจงวาพวกเขาจําเปนตองใชที่อื่นในขณะนี้ อยางไรก็ตาม พวกเขาไดสงยุทโธปกรณทหารราบเพิ่มเติมมาใหเราเพื่อแสดงการสนับสนุน"
 BBA_ethiopia_fascist_events.71.a: "ก็ยังดีกวาไมมีอะไรเลย"



#Communist Ethiopia
 BBA_ethiopia_communist_events.01.t: "คอมมิวนิสต[ETH.GetAdjective]ขอความชวยเหลือ"
 BBA_ethiopia_communist_events.01.desc: "คณะผูนําคอมมิวนิสตแหง[ETH.GetName]ไดติดตอขอความชวยเหลือจากเราในการตอสูกับพวกฟาสซิสตอิตาลี ระบอบใหมใน[ETH.Capital.GetCapitalVictoryPointName]ยังคงอยูระหวางรวบรวมอํานาจ และอาจยินดีปรับตัวใหสอดคลองกับความทะเยอทะยานดานนโยบายตางประเทศของเราหากเรายื่นมือสนับสนุน อยางไรก็ตาม เราเสี่ยงที่จะทําใหสงครามบานปลาย และจะทําให[ITA.GetName]โกรธเคืองอยางแนนอน"
 BBA_ethiopia_communist_events.01.a: "เราจะสนับสนุนสหายคอมมิวนิสตในการตอสูของพวกเขา"
 BBA_ethiopia_communist_events.01.b: "เราไมสนใจพัวพันกับเรื่องอาณานิคมในแอฟริกาเหลานี้"
 BBA_ethiopia_communist_events.02.t: "[SOV.GetName]ปฏิเสธคํารองขอความชวยเหลือ"
 BBA_ethiopia_communist_events.02.desc: "แมเราจะรองขอความชวยเหลืออยางสิ้นหวัง แต[SOV.GetNameDef]ก็หันหลังใหเรา แมนี่จะเปนอุปสรรค แตเราจะยังคงตอตานกองกําลังฟาสซิสตตอไป บัดนี้เราควรหันไปแสวงหาการสนับสนุนจากเครือขายตอตานฟาสซิสตที่กวางขวางกวาทั่วโลก"
 BBA_ethiopia_communist_events.02.a: "นี่นะหรือความสมานฉันททางชนชั้น"
 BBA_ethiopia_communist_events.03.t: "[SOV.GetName]สงความชวยเหลือให[ETH.GetName]"
 BBA_ethiopia_communist_events.03.desc: "ในชวงไมกี่วันที่ผานมามีรายงานที่นากังวลวาทหาร[ETH.GetAdjective]พูดภาษารัสเซียและใชอาวุธของ[SOV.GetAdjective] เราไดแตสันนิษฐานวา[SOV.GetName]กําลังสง 'อาสาสมัคร' มารบให[ETH.GetLeader] โดยหวังจะไดอิทธิพลในแอฟริกาและบั่นทอนแรงสนับสนุนตอรัฐบาลของ[ITA.GetLeader]ใน[ITA.GetName]"
 BBA_ethiopia_communist_events.03.a: "พวกเขาจะตองชดใชกับการรุกรานครั้งนี้"
 BBA_ethiopia_communist_events.04.t: "[SOV.GetName]ตกลงชวยเหลือเรา"
 BBA_ethiopia_communist_events.04.desc: "[SOV.GetName]ตกลงสงความชวยเหลือดานยุทโธปกรณมาใหเราในอีกไมกี่เดือนขางหนา รวมถึงอนุญาตให 'อาสาสมัคร' จากกองทัพ[SOV.GetAdjective]มารบเคียงขางเราในการตอสูกับ[ITA.GetName] สิ่งนี้จะพลิกดุลอํานาจมาเปนของเราอยางแนนอน อยางไรก็ตาม ยังไมชัดเจนวาชาว[ITA.GetAdjective]จะตอบสนองอยางไรตอการที่ทหาร[SOV.GetAdjective]มารบกับพวกเขา"
 BBA_ethiopia_communist_events.04.a: "เราจะรวมกันพิชิตลัทธิฟาสซิสตในแอฟริกา"
 BBA_ethiopia_communist_events.05.t: "รัฐประหารตอ[ROOT.GetLeader]"
 BBA_ethiopia_communist_events.05.desc: "วันนี้ สมาชิกกองทัพและองคกรตอตานฟาสซิสตที่รูจักกันในชื่อสิงหดําไดรวมกันกอรัฐประหารตอรัฐบาลของ[ROOT.GetLeader] ขณะที่จักรพรรดิมีกําหนดตรวจพลทหาร กลุมทหารที่ไมพอใจไดหันมาจับกุมพระองคและนายทหารของพวกเขา \n\nขณะเดียวกันใน[ROOT.Capital.GetCapitalVictoryPointName] สิงหดําไดยึดโครงสรางพื้นฐานสําคัญของเมือง รวมถึงที่ประทับของจักรพรรดิ ผูจงรักภักดีจํานวนมากจากกองทัพและตํารวจถูกสังหารในการปะทะยอย แตสวนที่เหลือของ[ETH.GetName]ตอนนี้อยูภายใตการควบคุมของรัฐบาลชั่วคราวแลว ประชาชนสวนใหญซึ่งเหนื่อยลาจากสงครามกับ[ITA.GetName]ตางยอมรับอํานาจของรัฐบาลใหมโดยงาย บัดนี้การตัดสินใจแรกของคณะบริหารชุดใหมคือการกําหนดชะตากรรมของ[ROOT.GetLeader]"
 BBA_ethiopia_communist_events.05.a: "เราเสี่ยงเสียแรงสนับสนุนจากประชาชนไมได เนรเทศเขาเสีย"
 BBA_ethiopia_communist_events.05.b: "ศัตรูของประชาชนทุกคนตองรับผิดชอบตออาชญากรรมของตน จับเขาขังคุก"
 BBA_ethiopia_communist_events.06.t: "รัฐบาลชั่วคราวถูกยุบ"
 BBA_ethiopia_communist_events.06.desc: "นายทหารที่มี[SOV.GetName]หนุนหลังไดยุบรัฐบาลชั่วคราว[ETH.GetAdjective] นายทหารเหลานี้อางวาไดรับหลักฐานจากหนวยขาวกรอง[SOV.GetAdjective]ซึ่งพิสูจนวารัฐบาลภายใตการนําของ[ROOT.GetLeader]ไดทรยศประชาชน ตามหลักฐานดังกลาว สมาชิกรัฐบาลไดเจรจาเพื่อยอมใหทหาร[ITA.GetAdjective]ยึดครองประเทศทั้งหมดเพื่อแลกกับทรัพยสินสวนตัวมหาศาล หลังการยิงปะทะกับสิงหดํา เชื่อกันวาอดีตสมาชิกรัฐบาลชั่วคราวเสียชีวิตหรือถูกจับกุมแลว \n\nบัดนี้กองทัพไดเขายึดอํานาจการนําประเทศเพื่อฟนฟูความสงบเรียบรอยและกวาดลางผูสมคบคิดของ[ROOT.GetLeader] ยังไมชัดเจนวาสภาบริหารทหารที่เพิ่งตั้งขึ้นใหมนี้จะอยูถาวรเพียงใด"
 BBA_ethiopia_communist_events.06.indy_desc: "นายทหารไดยุบรัฐบาลชั่วคราว[ETH.GetAdjective] นายทหารเหลานี้อางวาไดรับหลักฐานจากหนวยขาวกรองซึ่งพิสูจนวารัฐบาลภายใตการนําของ[ROOT.GetLeader]ไดทรยศประชาชน ตามหลักฐานดังกลาว สมาชิกรัฐบาลไดเจรจาเพื่อยอมใหทหาร[ITA.GetAdjective]ยึดครองประเทศทั้งหมดเพื่อแลกกับทรัพยสินสวนตัวมหาศาล หลังการยิงปะทะกับสิงหดํา เชื่อกันวาอดีตสมาชิกรัฐบาลชั่วคราวเสียชีวิตหรือถูกจับกุมแลว \n\nบัดนี้กองทัพไดเขายึดอํานาจการนําประเทศเพื่อฟนฟูความสงบเรียบรอยและกวาดลางผูสมคบคิดของ[ROOT.GetLeader]"
 BBA_ethiopia_communist_events.06.a: "พวกทรยศไดรับสิ่งที่สมควรไดแลว"
 BBA_ethiopia_communist_events.07.t: "[SOV.GetNameDefCap]เรียกรองใหยุติสงครามกับ[ETH.GetName]"
 BBA_ethiopia_communist_events.07.desc: "[SOV.GetNameDefCap]เรียกรองใหยุติการสูรบระหวางเรากับชาว[ETH.GetAdjective] ชาว[SOV.GetAdjective]มีสวนอยางมากในการสนับสนุนระบอบคอมมิวนิสตใน[ETH.Capital.GetCapitalVictoryPointName] และบัดนี้มองวาที่นั่นเปนสวนหนึ่งของเขตอิทธิพลของตน โซเวียตขูวาจะไปไกลถึงขั้นเขาแทรกแซงความขัดแยงทางทหาร  หากเรายอมตามขอเรียกรองของโซเวียต เราเสี่ยงที่จะอับอายภายในประเทศ แตหากเราปฏิเสธ เราเสี่ยงตอความขัดแยงที่กวางขวางกวามาก"
 BBA_ethiopia_communist_events.07.a: "เราจะไมเจรจากับพวกคอมมิวนิสต"
 BBA_ethiopia_communist_events.07.b: "ตอนนี้เราเสี่ยงตอความขัดแยงที่ขยายวงกวางไมได"
 BBA_ethiopia_communist_events.08.t: "[ETH.GetName]ขอยุทโธปกรณทหารราบ"
 BBA_ethiopia_communist_events.08.desc: "[ETH.GetName]ขอยุทโธปกรณทหารราบเพื่อชวยในความขัดแยงกับอิตาลี หากไมมียุทโธปกรณพื้นฐานหลั่งไหลเขาไป กองทัพ[ETH.GetAdjective]คงไมสามารถติดอาวุธใหทหารไดอยางเพียงพอ อยางไรก็ตาม หากเราเลือกจัดหายุทโธปกรณใหพวกเขา ยอมทําใหความสัมพันธของเรากับ[ITA.GetName]เสียหายยิ่งขึ้นอยางแนนอน"
 BBA_ethiopia_communist_events.08.a: "เราไมมียุทโธปกรณเหลือพอจะแบงให"
 BBA_ethiopia_communist_events.08.b: "แนนอนวาเราจะชวยพวกเขา"
 BBA_ethiopia_communist_events.09.t: "[SOV.GetNameDefCap]สงยุทโธปกรณทหารราบ"
 BBA_ethiopia_communist_events.09.desc: "[SOV.GetName]ไดสงยุทโธปกรณทหารราบตามที่ขอมาใหเราเพื่อชวยในการตอสูกับ[ITA.GetName] สิ่งนี้จะชวยใหเราไดชัยชนะเหนือพวกฟาสซิสตอยางแนนอน"
 BBA_ethiopia_communist_events.09.a: "สงครามกําลังพลิกกลับมาเปนผลดีตอเรา"
 BBA_ethiopia_communist_events.10.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะสงยุทโธปกรณ"
 BBA_ethiopia_communist_events.10.desc: "[SOV.GetName]ปฏิเสธที่จะสงยุทโธปกรณทหารราบใหเรา แมคณะผูแทนของเราที่ไป[SOV.capital.GetCapitalVictoryPointName]จะพยายามอยางเต็มที่ ดูเหมือนพวกเขาจะวุนอยูกับปญหาของตนเองจนไมมีอะไรเหลือใหเรา"
 BBA_ethiopia_communist_events.10.a: "พวกเขาทรยศเรา"
 BBA_ethiopia_communist_events.11.t: "[ETH.GetName]ขอที่ปรึกษาทางทหาร"
 BBA_ethiopia_communist_events.11.desc: "คณะผูนําชุดใหมของ[ETH.GetNameDefCap]ยอมรับถึงความออนแอของกองทัพตนในการรับมือกับสงครามสมัยใหม จึงขอการสนับสนุนจากเราในการจัดระเบียบกองทัพใหม นี่จะเปนโอกาสอันดีที่นายทหารของเราจะไดประสบการณในสภาพแวดลอมที่แตกตาง และยังเปนโอกาสที่เราจะมีอิทธิพลตอดุลอํานาจภายใน[ETH.GetName]ดวย"
 BBA_ethiopia_communist_events.11.a: "นี่เปนโอกาสที่เราพลาดไมได"
 BBA_ethiopia_communist_events.11.b: "เราเสี่ยงใหมหาอํานาจตางชาติรูยุทธวิธีของเราไมได"
 BBA_ethiopia_communist_events.12.t: "ยุทโธปกรณจาก[SOV.GetAdjective]มาถึงแลว"
 BBA_ethiopia_communist_events.12.desc: "ยุทโธปกรณที่[SOV.GetName]สัญญาไวไดมาถึงคลังยุทโธปกรณทางทหารของเราแลว และกําลังแจกจายใหกองกําลังของเรา"
 BBA_ethiopia_communist_events.12.a: "ยอดเยี่ยม!"
 BBA_ethiopia_communist_events.14.t: "[ETH.GetNameDefCap]ขอความชวยเหลือในการสรางกองทัพอากาศ"
 BBA_ethiopia_communist_events.14.desc: "[ETH.GetNameDefCap]ขอการสนับสนุนจากเราในการพัฒนากองทัพอากาศของพวกเขาเอง ขอเสนอของพวกเขารวมถึงการสงอาสาสมัครมาฝกรวมกับนักบินของเราดวยเครื่องบินสวนเกินรุนเกา นี่จะเปนโอกาสอันยอดเยี่ยมที่นักบินของเราจะไดประสบการณเพิ่ม และไดทดสอบยุทโธปกรณของเรากับชาว[ITA.GetAdjective]"
 BBA_ethiopia_communist_events.14.a: "ขอเสนอที่ยอดเยี่ยม"
 BBA_ethiopia_communist_events.14.b: "เราตองรักษาคลังเครื่องบินของเราไว"
 BBA_ethiopia_communist_events.15.t: "[SOV.GetNameDefCap]สงที่ปรึกษาทางทหาร"
 BBA_ethiopia_communist_events.15.desc: "นายพลจาก[SOV.GetNameDef]เดินทางถึง[ROOT.Capital.GetCapitalVictoryPointName]แลววันนี้ ที่ปรึกษาเหลานี้กําลังไดรับขอมูลภาพรวมเกี่ยวกับโครงสรางปจจุบันของกองทัพเราและสถานการณสงครามกับ[ITA.GetName] หวังวาพวกเขาจะชวยปรับปรุงกองกําลังของเราใหทันสมัยได"
 BBA_ethiopia_communist_events.15.a: "เรื่องนี้ควรเกิดขึ้นนานแลว"
 BBA_ethiopia_communist_events_15_tt: "§Y$SOV_semyon_budyonny$§! และ §Y$SOV_vasily_kuznetsov$§! จะพรอมเปนนายพลใหใชงาน"
 BBA_ethiopia_communist_events.16.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะสงที่ปรึกษาทางทหาร"
 BBA_ethiopia_communist_events.16.desc: "สิ่งที่เรียกวามิตรของเราใน[SOV.Capital.GetCapitalVictoryPointName]ปฏิเสธที่จะสงที่ปรึกษาทางทหารมาชวยเราปรับปรุงกองทัพใหทันสมัย แมจะเปนอุปสรรค แตเราจะเอาชนะพวกฟาสซิสตและปรับปรุงกองทัพใหทันสมัยตอไปดวยตนเอง"
 BBA_ethiopia_communist_events.16.a: "พึ่งพาชาว[SOV.GetAdjective]ไมได"
 BBA_ethiopia_communist_events.17.t: "[ETH.GetNameDefCap]ขอการสนับสนุนเพื่อตอตานยานเกราะของ[ITA.GetAdjective]"
 BBA_ethiopia_communist_events.17.desc: "คณะผูแทนจาก[ETH.GetNameDef]ไดเรงเรารัฐมนตรีและกองทัพของเราใหสงยานเกราะสวนเกินไปชวยพวกเขาในสงครามกับ[ITA.GetName] ชาว[ETH.GetAdjective]เสียเปรียบอยางเห็นไดชัดเมื่อตองปะทะกับยานเกราะของ[ITA.GetAdjective] หากเราสงยุทโธปกรณไป ยอมชวยใหพวกเขาผลักดันชาว[ITA.GetAdjective]ถอยกลับไดอยางแนนอน แตก็จะเพิ่มความตึงเครียดระหวาง[SOV.GetNameDef]และ[ITA.GetName]ดวย"
 BBA_ethiopia_communist_events.17.a: "โอกาสอันยอดเยี่ยมในการทดสอบยุทโธปกรณของเรา"
 BBA_ethiopia_communist_events.17.b: "เราจะไมเสี่ยงใหสถานการณบานปลายยิ่งขึ้น"
 BBA_ethiopia_communist_events.18.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะสงยานเกราะ"
 BBA_ethiopia_communist_events.18.desc: "[SOV.GetNameDefCap]ปฏิเสธที่จะสงยานเกราะมาใหเราเพื่อตอกรกับชาว[ITA.GetAdjective] ดูเหมือนวาชาว[SOV.GetAdjective]กังวลวาจะเพิ่มความตึงเครียดระหวางตนเองกับชาว[ITA.GetAdjective]"
 BBA_ethiopia_communist_events.18.a: "เราตองหาทางอื่น"
 BBA_ethiopia_communist_events.19.t: "[SOV.GetNameDefCap]สงยานเกราะมาให"
 BBA_ethiopia_communist_events.19.desc: "[SOV.GetNameDefCap]ไดสงยานเกราะมาชวยเราในการตอสูกับชาว[ITA.GetAdjective] แมจะไมใชแบบลาสุดของพวกเขา แตยานเกราะเหลานี้จะพิสูจนคุณคาในแนวหนาไดอยางไมตองสงสัย แมจะเพียงเพื่อเพิ่มขวัญกําลังใจก็ตาม"
 BBA_ethiopia_communist_events.19.a: "ยอดเยี่ยม!"
 BBA_ethiopia_communist_events.20.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะฝกนักบิน"
 BBA_ethiopia_communist_events.20.desc: "[SOV.GetNameDefCap]ปฏิเสธขอเสนอใหฝกนักบินของเรา เราหวังวาสิ่งนี้จะเรงการขยายกองทัพอากาศของเรา แตดูเหมือนโซเวียตจะมีเรื่องสําคัญกวาในตอนนี้ อยางไรก็ตาม เราไดรับแบบสําหรับผลิตเครื่องบินของเราเอง"
 BBA_ethiopia_communist_events.20.a: "เราคงหาทางทําเองได"
 BBA_ethiopia_communist_events.21.t: "[SOV.GetNameDefCap]ตกลงฝกนักบิน"
 BBA_ethiopia_communist_events.21.desc: "สหายของเราใน[SOV.GetName]ตกลงชวยฝกนักบินใหเรา พวกเขายังใจกวางจัดหาเครื่องบินจํานวนหนึ่งใหเราใชดวย สิ่งนี้จะเรงแผนการสรางกองทัพอากาศที่สามารถตอกรกับชาว[ITA.GetAdjective]ไดอยางรวดเร็ว"
 BBA_ethiopia_communist_events.21.a: "เราขอบคุณสหาย[SOV.GetAdjective]ของเรา!"
 BBA_ethiopia_communist_events.22.t: "[ITA.GetNameDefCap]ปฏิเสธที่จะยุติสงครามกับ[ETH.GetNameDefCap]"
 BBA_ethiopia_communist_events.22.desc: "ชาว[ITA.GetAdjective]เพิกเฉยตอขอเรียกรองของเราใหยุติสงครามกับ[ETH.GetName]มาโดยตลอด เปนที่ชัดเจนแลววาภาษาเดียวที่พวกเขาเขาใจคือกําลังอันโหดเหี้ยม หากเรายังคงเดินหนาในแนวทางปจจุบัน สงครามระหวาง[SOV.GetName]และ[ITA.GetName]จะเปนสิ่งที่หลีกเลี่ยงไมได หากเราถอยตอนนี้ ในที่สุดเราจะสูญเสียทุกสิ่งที่ไดมาจากการสนับสนุน[ETH.GetName] และนํ้าหนักทางการทูตของเราบนเวทีโลกจะลดลงอยางมาก"
 BBA_ethiopia_communist_events.22.a: "พวกเขาจะตองเสียใจ"
 BBA_ethiopia_communist_events.22.b: "เรายังไมพรอมทําสงคราม"
 BBA_ethiopia_communist_events.23.t: "[SOV.GetNameDefCap]ยอมถอย"
 BBA_ethiopia_communist_events.23.desc: "สหภาพโซเวียตไดถอยจากวาทกรรมสงครามเมื่อเร็วๆ นี้ และหันกลับไปคัดคานการกระทําของเราในเอธิโอเปยดวยถอยคํารุนแรงเชนเดิม ดูเหมือนการขูทําสงครามของพวกเขาเปนเพียงการขูลมๆ แลงๆ"
 BBA_ethiopia_communist_events.23.a: "ชัยชนะของ[ITA.GetName]!"
 BBA_ethiopia_communist_events.24.t: "[SOV.GetNameDefCap]เขาควบคุมนโยบายตางประเทศ"
 BBA_ethiopia_communist_events.24.desc: "การเผชิญหนาทางการทูตระหวาง[ITA.GetName]และ[SOV.GetNameDef]ไดปะทุเปนความขัดแยงอยางเปดเผยแลว ชาว[SOV.GetAdjective]ไดรับประกันเอกราชของเราและจะชวยเราในสนามรบเพื่อขับไลชาว[ITA.GetAdjective] อยางไรก็ตาม ดูเหมือนวาสิ่งนี้ตองแลกมาดวยเอกราชของเรา นับจากนี้ไป เราตองทําใหนโยบายตางประเทศของเราสอดคลองกับ[SOV.Capital.GetCapitalVictoryPointName]อยางเต็มที่"
 BBA_ethiopia_communist_events.24.a: "มันจําเปน สําหรับตอนนี้"
 BBA_ethiopia_communist_events.25.t: "[ETH.GetNameDefCap]ขอใหไกลเกลี่ย"
 BBA_ethiopia_communist_events.25.desc: "[ETH.GetNameDefCap]ติดตอเรามาดวยความหวังวาเราจะไกลเกลี่ยระหวางพวกเขากับชาว[ITA.GetAdjective]ได ชาว[ITA.GetAdjective]ไมสะทกสะทานตอการคัดคานดวยถอยคํารุนแรงของสันนิบาตชาติ ดังนั้นการไกลเกลี่ยใดๆ จากเรานาจะตองอาศัยการขูใชกําลัง เราตองคิดใหรอบคอบวาเราพรอมจะเสี่ยงมากเพียงใดเพื่อ[ETH.GetNameDef]"
 BBA_ethiopia_communist_events.25.a: "เราจะชวยพวกเขายุติสงครามนี้"
 BBA_ethiopia_communist_events.25.b: "เราจะชวยพวกเขา แตตองมีคาตอบแทน"
 BBA_ethiopia_communist_events.25.c: "เรื่องนี้เสี่ยงเกินไป"
 BBA_ethiopia_communist_events.26.t: "[SOV.GetNameDefCap] ปฏิเสธที่จะไกลเกลี่ยความขัดแยง"
 BBA_ethiopia_communist_events.26.desc: "[SOV.GetNameDefCap] ไดตัดความเปนไปไดในการไกลเกลี่ยระหวางเรากับชาว[ITA.GetAdjective]ออกไปแลว โดยอางวา[ITA.GetName]ไมยอมรับฟงสันนิบาตชาติ และพวกเขาจึงจําเปนตองขูวาจะใชกําลัง [SOV.GetLeader] ตัดสินวาความเสี่ยงที่สถานการณจะบานปลายเปนสงครามระหวางสองประเทศนั้นอันตรายเกินไป"
 BBA_ethiopia_communist_events.26.a: "พวกเขากําลังใชเราเพื่อบั่นทอนกําลังชาว[ITA.GetAdjective]"
 BBA_ethiopia_communist_events.27.t: "[SOV.GetNameDefCap] ลมเหลวในการหยุดยั้งการรุกรานของ[ITA.GetAdjective]"
 BBA_ethiopia_communist_events.27.desc: "[SOV.GetNameDefCap] ไดถอยจากคํามั่นที่จะยุติสงครามรุกรานของ[ITA.GetName] ดูเหมือนวาความพรอมที่จะทําสงครามของพวกเขาเปนเพียงการขูเทานั้น บัดนี้เราตองเผชิญภารกิจอันยากลําบากในการยุติสงครามนี้ดวยตัวเราเอง"
 BBA_ethiopia_communist_events.27.a: "พวกเขาทรยศเรา"
 BBA_ethiopia_communist_events.28.t: "[SOV.GetNameDefCap] เรียกรองใหดําเนินนโยบายตางประเทศตามแนวทางของตน"
 BBA_ethiopia_communist_events.28.desc: "การเผชิญหนาทางการทูตระหวาง[ITA.GetName]และ[SOV.GetNameDef]ไดคลี่คลายลงแลว โดยชาว[ITA.GetAdjective]ยอมยุติสงครามที่มีตอเรา ชาว[SOV.GetAdjective]ไดรับประกันเอกราชของเรา และแสดงชัดเจนวาพวกเขาถือวาการโจมตีเราเทากับการโจมตีพวกเขา อยางไรก็ตาม ดูเหมือนวาราคาของความชวยเหลือในการยุติสงครามครั้งนี้ก็คือเอกราชของเรา นับจากนี้ไป เราตองทําใหแนใจวานโยบายตางประเทศของเราสอดคลองกับ[SOV.Capital.GetCapitalVictoryPointName]อยางสมบูรณ"
 BBA_ethiopia_communist_events.28.a: "เราตองยอม ในตอนนี้"
 BBA_ethiopia_communist_events.29.t: "[SOV.GetNameDefCap] ไกลเกลี่ยความขัดแยงไดสําเร็จ"
 BBA_ethiopia_communist_events.29.desc: "การเผชิญหนาทางการทูตระหวาง[ITA.GetName]และ[SOV.GetNameDef]ไดคลี่คลายลงแลว โดยชาว[ITA.GetAdjective]ยอมยุติสงครามที่มีตอเรา นี่คือชัยชนะครั้งใหญเหนือลัทธิฟาสซิสต แตก็คงไมใชจุดสิ้นสุดของการตอสู หวังวาเราจะยังคงรวมมือกับมิตรของเราใน[SOV.Capital.GetCapitalVictoryPointName]ตอไปได"
 BBA_ethiopia_communist_events.29.a: "เราจะสํานึกในบุญคุณตลอดไป"
 bba_news.1.t: "[SOV.GetName] เรียกรองใหยุติสงครามอิตาลี-เอธิโอเปย"
 bba_news.1.desc: "ภัยคุกคามที่สงครามใหญจะปะทุขึ้นไดทําใหผูนําทั่วโลกตื่นตระหนกในวันนี้ [SOV.GetLeader] ผูนําโซเวียตเรียกรองให [ITA.GetLeader] ยุติสงครามอันผิดกฎหมายของ[ITA.GetName]ตอ[ETH.GetNameDef] [SOV.GetLeader] แสดงชัดเจนวาหาก[ITA.GetName]ไมปฏิบัติตามขอเรียกรองนี้ [SOV.GetLeader.GetSheHe]พรอมจะใชกําลังบังคับ ในชวงหลายเดือนที่ผานมา ชาว[SOV.GetAdjective]กระตือรือรนที่จะชวยเหลือ[ETH.GetNameDef]ทั้งดานยุทโธปกรณและคําแนะนํา และเห็นไดชัดขึ้นเรื่อยๆ วาบัดนี้พวกเขาถือวาประเทศนี้เปนสวนหนึ่งในเขตอิทธิพลของตน"
 bba_news.1.a: "พวกเขาคงแคขูเทานั้นใชไหม?"
 bba_news.2.t: "[ITA.GetName]ยอมรับขอตกลงสันติภาพกับ[ETH.GetNameDefCap]"
 bba_news.2.desc: "\nในเหตุการณที่พลิกผันอยางนาทึ่ง [ITA.GetName]ไดตกลงหยุดยิงกับ[ETH.GetName] กองทหาร[ITA.GetAdjective]ยังเริ่มถอนกําลังกลับสูพรมแดนเดิมกับ[ETH.GetNameDef] และสละดินแดนทั้งหมดที่ยึดได ความพรอมที่จะทําสงครามเพื่อเอธิโอเปยของ[SOV.GetNameDefCap]ยอมมีสวนในการตัดสินใจถอนทัพของ [ITA.GetLeader] อยางไมตองสงสัย ยังตองรอดูวาประชาชน[ITA.GetAdjective]จะตอบสนองตอความอัปยศครั้งนี้อยางไร"
 bba_news.2.a: "[ITA.GetLeader] จะรอดจากเรื่องนี้ไหม?"
 bba_news.3.t: "ขอตกลงหยุดยิงอิตาลี-[ETH.GetAdjective]"
 bba_news.3.desc: "เมื่อสงครามใน[ETH.GetName]กลายเปนสงครามบั่นทอนกําลัง ชาว[ITA.GetAdjective]ก็ถูกบีบใหเขาสูการเจรจาหยุดยิง หลายฝายคาดวากองทัพ[ETH.GetAdjective]จะแตกสลายไปหลังการลุกฮือของคอมมิวนิสตในประเทศเมื่อไมนานมานี้ แต [ETH.GetLeader] กลับพลิกสถานการณสงครามได และชวยใหดินแดนสวนใหญของชาติรอดพนจากการยึดครองของ[ITA.GetAdjective] ถึงกระนั้น ดวยแอฟริกาตะวันออกสวนใหญยังอยูใตการปกครองของ[ITA.GetAdjective] จึงยังไมแนชัดวาสันติภาพอันเปราะบางนี้จะคงอยูไดนานเพียงใด "
 bba_news.3.a: "มันไมมีทางยั่งยืน "
 bba_news.4.t: "รัฐประหารคอมมิวนิสตในเอธิโอเปย"
 bba_news.4.desc: "สมาชิกกองทัพและองคกรตอตานฟาสซิสตที่รูจักกันในชื่อสิงหดําไดรวมกันกอรัฐประหารตอรัฐบาลจักรวรรดิของ $ETH_haile_selassie$ องคจักรพรรดิมีกําหนดเสด็จตรวจพลทหาร แตกลับถูกทหารเหลานั้นซุมโจมตีและควบคุมตัวไว\n\nในขณะเดียวกันที่[ROOT.Capital.GetCapitalVictoryPointName] กลุมสิงหดําไดยึดโครงสรางพื้นฐานสําคัญของเมือง รวมถึงที่ประทับขององคจักรพรรดิ ฝายจงรักภักดีจํานวนมากจากกองทัพและตํารวจถูกสังหารในการปะทะยอยๆ แตสิ่งที่เหลืออยูของชาติบัดนี้อยูภายใตการควบคุมของรัฐบาลเฉพาะกาลที่โนมเอียงไปทางคอมมิวนิสต\n\nประชาชนสวนใหญซึ่งออนลาจากสงครามกับ[ITA.GetName] ตางยอมรับอํานาจของรัฐบาลใหมโดยดี "
 bba_news.4.a: "การปฏิวัติกําลังลุกลาม!"
 bba_news.4.b: "ภัยคอมมิวนิสตกําลังรุกคืบ"
 bba_news.5.t: "สถาปนาจักรวรรดิโซโลมอน"
 bba_news.5.desc_owns_454: "[ETH.GetLeader] ประกาศวาดวยสายพระโลหิตที่กลาวกันวาสืบยอนไปถึงกษัตริยโซโลมอนในคัมภีรไบเบิล พระองคจึงเปนผูปกครองโดยชอบธรรมของ[454.GetName] และยังประกาศการกําเนิดใหมของเอธิโอเปยในฐานะจักรวรรดิโซโลมอน เมื่อไดแยงชิงการควบคุม[454.GetName]มาจากมหาอํานาจแลว [ETH.GetLeader] ตั้งพระทัยจะยายเมืองหลวงของจักรวรรดิมายังภูมิภาคนี้ ยังตองรอดูวาการปรับโครงสรางแบบโซโลมอนของเอธิโอเปยจะสงผลกระทบทางภูมิรัฐศาสตรหรือไม "
 bba_news.5.desc_does_not_own_454: "[ETH.GetLeader] ประกาศวาดวยสายพระโลหิตที่กลาวกันวาสืบยอนไปถึงกษัตริยโซโลมอนในคัมภีรไบเบิล พระองคจึงเปนผูปกครองโดยชอบธรรมของ[454.GetName] เงาของขอพิพาทดินแดนอีกครั้งยอมจุดชนวนความหวาดกลัวในเมืองหลวงตางๆ ของภูมิภาคอยางไมตองสงสัย แตยังตองรอดูวาการปรับโครงสรางแบบโซโลมอนของเอธิโอเปยจะสงผลกระทบทางภูมิรัฐศาสตรหรือไม "
 bba_news.5.a: "ขอพระเกียรติจงมีแดทายาทที่แทจริงเพียงหนึ่งเดียวของโซโลมอน!"
 bba_news.5.b: "นี่มันบาไปแลว"
 bba_news.6.t: "สถาปนาจักรวรรดิไซออน"
 bba_news.6.desc: "ในเหตุการณที่พลิกผันอยางประหลาดยิ่ง [ETH.GetLeader] จักรพรรดิแหงเอธิโอเปย ไดทรงรับขบวนการทางศาสนานอกกระแสในแคริบเบียนที่รูจักกันในชื่อ 'ราสตาฟารี' ดูเหมือนวาการเปนเพียงจักรพรรดิจะยังไมพอ บัดนี้ [ETH.GetLeader] ไดรับการบูชาจากชาวราสตาฟารีในฐานะรางอวตารของพระเจา หรือที่เจาะจงคือ 'จาห' เอธิโอเปยเองก็ไดรับการจัดระเบียบใหมเปน 'จักรวรรดิไซออน' ยังตองรอดูวาความปนปวนทางศาสนาครั้งนี้จะนําไปสูการเปลี่ยนแปลงนโยบายตางประเทศของเอธิโอเปย หรือความไมมั่นคงทางภูมิรัฐศาสตรหรือไม"
 bba_news.6.a: "ขอพระเกียรติจงมีแดจาห!"
 bba_news.6.b: "นี่มันบาไปแลว"
 bba_news.7.t: "[ITA.GetName]เคลื่อนไหวเพื่อผนวก[AFA.GetNameDef]"
 bba_news.7.desc: "มีขาวลือหนาหูวากองกําลัง[ITA.GetAdjective]อาจผนวก[AFA.GetNameDef]ในไมชา มีผูพบเห็นกองทหาร[ITA.GetAdjective]รวมพลอยูที่ชายแดนของชาติที่โดดเดี่ยวแหงนี้ และแหลงขาวระบุวามีการกดดันทางการทูตใน[AFA.Capital.GetCapitalVictoryPointName] เพื่อบีบใหยอมจํานนโดยไมตองนองเลือด ยังตองรอดูวา [AFA.GetLeader] จะตานทานแรงกดดันของ[ITA.GetAdjective]ไดหรือไม แตสถานการณดูไมสูดีนัก "
 bba_news.7.a: "นาสยดสยองนัก"
 bba_news.7.b: "เราควรเตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 bba_news.7.c: "เรื่องนี้หลีกเลี่ยงไมไดอยูแลว"
 bba_news.8.t: "[AFA.GetName]ยอมจํานนตอขอเรียกรองของ[ITA.GetAdjective]"
 bba_news.8.desc: "อาจไมนาแปลกใจสําหรับหลายคน [AFA.GetNameDef]ไดยอมรับขอเรียกรองของ[ITA.GetAdjective]ใหตกอยูใตอํานาจ แมรัฐบาล[AFA.GetAdjective]จะยังหวังวาจะเลี่ยงการถูกยึดครองได แตก็ชัดเจนขึ้นเรื่อยๆ วามหาอํานาจอาณานิคมในภูมิภาคจะไมมาชวยเหลือ และ[ETH.GetName]ซึ่งเปนเพื่อนบานก็ไมอาจแบงกําลังทหารมาสนับสนุนได เมื่อสถานการณมืดมนถึงเพียงนี้ รัฐบาลจึงยอมโอนออนตอแรงกดดันของ[ITA.GetAdjective] เพื่อไมใหประชาชนตองตกเปนเหยื่อของการนองเลือดโดยไมจําเปน\n\nบัดนี้กองกําลัง[ITA.GetAdjective]กําลังเคลื่อนเขาสูชาติเล็กๆ แหงนี้เพื่อตั้งที่มั่นใหมบนชายแดนติดกับ[ETH.GetNameDef] ยังไมแนชัดวาการยึดครองจะเปนการถาวรหรือไม หรือจะสงผลตอความขัดแยงในวงกวางระหวาง[ITA.GetAdjective]กับ[ETH.GetName]อยางไร "
 bba_news.8.a: "นาเสียดาย แตก็ไมนาแปลกใจ"
 bba_news.8.b: "สิ่งนี้จะยิ่งทําใหกําลังของเราตึงตัวมากขึ้น"
 bba_news.8.c: "พวกเขาเลือกไดอยางชาญฉลาด"
 BBA_ethiopia_communist_events.30.t: "[ETH.GetNameDefCap] ขอหยุดยิง"
 BBA_ethiopia_communist_events.30.desc: "ผูแทนจาก[ETH.GetNameDefCap]ไดขอใหหยุดยิงในความขัดแยงที่เรามีกับพวกเขาอยูในขณะนี้ สงครามไมไดจบลงอยางรวดเร็วอยางที่เราหวัง และการหยุดยิงนี้จะเปดโอกาสใหเราเสริมสถานะในภูมิภาค หรือจัดการกับปญหาเรงดวนอื่นๆ"
 BBA_ethiopia_communist_events.30.a: "เราจะหยุดการสูรบ ในตอนนี้ "
 BBA_ethiopia_communist_events.30.b: "ชัยชนะอยูในกํามือแลว เราจะไมหยุดตอนนี้"
 BBA_ethiopia_communist_events.31.t: "[ITA.GetNameDefCap] ยอมรับการหยุดยิง"
 BBA_ethiopia_communist_events.31.desc: "ชาว[ITA.GetAdjective]ไดตกลงหยุดยิงในความขัดแยงปจจุบันของเรา หวังวานี่จะเปดโอกาสใหเราสรางสันติภาพที่ยั่งยืนระหวางสองชาติ อยางไรก็ตาม เราควรระมัดระวังตอไป เพราะความขัดแยงอาจปะทุขึ้นอีกไดทุกเมื่อ"
 BBA_ethiopia_communist_events.31.a: "ในที่สุด การนองเลือดก็สิ้นสุดลง"
 BBA_ethiopia_communist_events.32.t: "[ITA.GetNameDefCap] ปฏิเสธขอเสนอหยุดยิง"
 BBA_ethiopia_communist_events.32.desc: "ชาว[ITA.GetAdjective]ปฏิเสธที่จะหยุดยิง ดูเหมือนพวกเขาตั้งใจจะทําลาย[ETH.GetNameDefCap]ใหสิ้นซาก บัดนี้ประชาชนจะไดรูวาพวกฟาสซิสตไมอาจเจรจาดวยเหตุผลได และอิสรภาพของเราขึ้นอยูกับการที่ทุกคนทุมเทความพยายามเปนสองเทา"
 BBA_ethiopia_communist_events.32.a: "เราจะทําใหพวกมันทุกขทรมานตอไป"
 BBA_ethiopia_communist_events.33.t: "เอกราชของเอริเทรีย"
 BBA_ethiopia_communist_events.33.desc: "ระหวางความขัดแยงกับชาว[ITA.GetAdjective] เราสามารถปลดปลอยเอริเทรียจากพวกฟาสซิสตได บัดนี้เรามีโอกาสมอบเอกราชใหแกประชาชนในภูมิภาคนี้ อยางไรก็ตาม ชาว[ITA.GetAdjective]ยอมไมพอใจกับการกระทํานี้ และอาจสั่นคลอนสันติภาพอันเปราะบางที่เรามีกับพวกเขา"
 BBA_ethiopia_communist_events.33.a: "อิสรภาพสําหรับทุกคน!"
 BBA_ethiopia_communist_events.33.b: "เรื่องนี้เสี่ยงเกินไป"
 BBA_ethiopia_communist_events.34.t: "เอกราชของโซมาเลีย"
 BBA_ethiopia_communist_events.34.desc: "ระหวางความขัดแยงกับชาว[ITA.GetAdjective] เราสามารถปลดปลอยโซมาเลียจากพวกฟาสซิสตได บัดนี้เรามีโอกาสมอบเอกราชใหแกประชาชนในภูมิภาคนี้ อยางไรก็ตาม ชาว[ITA.GetAdjective]ยอมไมพอใจกับการกระทํานี้ และอาจสั่นคลอนสันติภาพอันเปราะบางที่เรามีกับพวกเขา"
 BBA_ethiopia_communist_events.34.a: "อิสรภาพสําหรับทุกคน!"
 BBA_ethiopia_communist_events.34.b: "เรื่องนี้เสี่ยงเกินไป"
 BBA_ethiopia_communist_events.35.t: "[ETH.GetNameDefCap] ขอใหถอนตัวจากแอฟริกา"
 BBA_ethiopia_communist_events.35.desc: "หลังจากที่ไดชวยเหลือเราในสงครามกลางเมือง ผูแทนจาก[ETH.GetNameDef]ไดขอใหเราเริ่มกระบวนการปลดปลอยอาณานิคม พวกเขาระบุวาหากเรายึดมั่นในคุณคาที่เราตอสูมาในสงครามกลางเมืองอยางแทจริง เราตองสนับสนุนสิทธิในการกําหนดชะตากรรมของตนเองของประชาชนในแอฟริกา [ETH.GetLeader] เสนอใหรวมมือกันสถาปนาสาธารณรัฐริฟที่เปนเอกราชในโมร็อกโกตอนเหนือ"
 BBA_ethiopia_communist_events.35.a: "เรายืนเคียงขางประชาชนแหงแอฟริกา"
 BBA_ethiopia_communist_events.35.b: "พวกเขาไมมีสิทธิ์มาสั่งสอนเรา"
 BBA_ethiopia_communist_events.36.t: "[SPC.GetNameDefCap] ตกลงปลดปลอยริฟ"
 BBA_ethiopia_communist_events.36.desc: "[SPC.GetNameDefCap]ตกลงตามขอเสนอของเราที่จะสถาปนาสาธารณรัฐริฟที่เปนเอกราชในโมร็อกโกตอนเหนือ นี่เปนกาวที่ดีในการตอสูเพื่อเอกราชทั่วแอฟริกาและทั่วโลก"
 BBA_ethiopia_communist_events.36.a: "การสนับสนุนพวกเขาใหผลคุมคา "
 BBA_ethiopia_communist_events.37.t: "[SPC.GetNameDefCap] ปฏิเสธขอเสนอการปลดปลอยอาณานิคม"
 BBA_ethiopia_communist_events.37.desc: "[SPC.GetNameDefCap]ตอบโตอยางขุนเคืองตอขอเสนอของเราที่วาพวกเขาควรสละดินแดนในแอฟริกา พวกเขาไดแสดงใหเห็นแลววาไมไดดีไปกวาพวกฟาสซิสตหรือพวกจักรวรรดินิยมที่พวกเขาอางวาตอตานเลย"
 BBA_ethiopia_communist_events.37.a: "ถาเชนนั้น เราจะปลดปลอยพวกเขาดวยกําลัง"
 BBA_ethiopia_communist_events.37.b: "เราไมควรบีบบังคับในเรื่องนี้"
 BBA_ethiopia_communist_events.38.t: "[ETH.GetNameDefCap] เสนอการสนับสนุน"
 BBA_ethiopia_communist_events.38.desc: "หลังจากเพิ่งตอสูกับลัทธิฟาสซิสตในบานเกิดของตน อาสาสมัครจาก[ETH.GetNameDef]ไดเดินทางมาถึงสเปนเพื่อชวยเหลือเราในการตอสู [ETH.GetLeader] ไดใหคํามั่นสนับสนุนอุดมการณของเราในนาม[ETH.GetLeader.GetHerHis] และสัญญาวาจะสงความชวยเหลือดานวัตถุมาใหในอีกไมกี่เดือนขางหนา"
 BBA_ethiopia_communist_events.38.a: "ขอบคุณ สหาย"
 BBA_ethiopia_communist_events.39.t: "ริฟไดรับการปลดปลอยแลว"
 BBA_ethiopia_communist_events.39.desc: "เมื่อภูมิภาคริฟไดรับการปลดปลอยจาก[SPC.GetNameDef]แลว เรามีโอกาสบีบใหพวกเขาเขาสูการเจรจาสันติภาพ หรือเนื่องจากพวกเขาทรยศความไววางใจของเราในเรื่องการปลดปลอยอาณานิคม เราอาจเลือกทําสงครามตอเขาไปใน[SPC.GetNameDef]เองก็ได"
 BBA_ethiopia_communist_events.39.a: "เราบรรลุเปาหมายแลว"
 BBA_ethiopia_communist_events.39.b: "เราจะทําใหแนใจวาพวกเขาจะไมเปนภัยคุกคามอีกตอไป"
 BBA_ethiopia_communist_events.40.t: "[ETH.GetNameDefCap] ขอใหยุติการสูรบ"
 BBA_ethiopia_communist_events.40.desc: "เราลมเหลวในการรักษาการควบคุมดินแดนของเราในแอฟริกา รัฐบาล[ETH.GetName]ซึ่งบรรลุเปาหมายแลว ไดติดตอมาหาเราดวยความหวังที่จะเจรจาสันติภาพระหวางกัน"
 BBA_ethiopia_communist_events.40.a: "เราไมมีทางเลือก"
 BBA_ethiopia_communist_events.41.t: "[ETH.GetNameDefCap] เรียกรองใหถอนที่ปรึกษา"
 BBA_ethiopia_communist_events.41.desc: "[ETH.GetNameDefCap]แจงเราวาที่ปรึกษาทางทหารทั้งหมดของเราตองออกจากประเทศทันที ดูเหมือนวา [ETH.GetLeader] ตั้งใจจะนําประเทศไปในทิศทางที่เปนอิสระมากขึ้น หากเราไมรีบลงมือ เราอาจสูญเสียการควบคุมระบอบการปกครองใน[ETH.Capital.GetCapitalVictoryPointName]"
 BBA_ethiopia_communist_events.41.a: "หลังจากทุกสิ่งที่เราทําใหพวกเขา"

#SUD Peace
 BBA_ethiopia_communist_events.46.t: "[ETH.GetNameDefCap] เสนอสันติภาพ"
 BBA_ethiopia_communist_events.46.desc: "นักการทูต[ETH.GetAdjective]ไดติดตอเราพรอมขอเสนอสันติภาพ ขอเสนอนี้ขึ้นอยูกับวาเราจะยอมสละการอางสิทธิ์เหนือดินแดน[SUD.GetAdjective]ที่เราเสียใหแก[ETH.GetNameDef]ระหวางความขัดแยงนี้หรือไม นักการทูตยังระบุวาจะมีการจัดตั้งรัฐบาล[SUD.GetAdjective]ขึ้นในภูมิภาคนี้ สวนรัฐบาลนั้นจะเปนอิสระจริงหรือไมยังตองรอดูตอไป "
 BBA_ethiopia_communist_events.46.a: "เราจะไมยอมสละดินแดนของเรา"
 BBA_ethiopia_communist_events.46.b: "เราไมมีทางเลือกนอกจากตองยอมรับ"
