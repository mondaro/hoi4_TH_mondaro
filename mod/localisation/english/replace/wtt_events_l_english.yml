 #Ask soviet for support
 wtt_warlord_vs_prc.1.t: "[warlord.GetLeader] วิงวอนขอการสนับสนุน"
 wtt_warlord_vs_prc.1.desc: "คณะผูแทนจาก [warlord.GetLeader] ไดเดินทางมาถึงมอสโกเพื่อหยั่งทาทีของเราเกี่ยวกับการสนับสนุนในการแยงชิงอํานาจภายในพรรค พวกเขาอางวา [communist_china.GetLeader] ไมไดทุมเทตออุดมการณคอมมิวนิสตอยางเพียงพอ และที่จริงอาจมีความคิดปฏิกิริยาและทรยศตอการปฏิวัติในชวงวิกฤตที่สุด\n\n[warlord.GetLeader] จึงเสนอใหเราหนุนหลังเขาแทน พรอมใหคํามั่นวาจะภักดีตออุดมการณคอมมิวนิสตโดยรวม และตอ [SOU.GetLeader] โดยเฉพาะ อยางนิรันดรและไมเสื่อมคลาย"
 wtt_warlord_vs_prc.1.a: "หุนเชิดที่ภักดีอาจเปนประโยชน"
 wtt_warlord_vs_prc.1.a_tooltip: "สิ่งนี้จะนําไปสูสงครามกับ §H[communist_china.GetNameDef]§! หากพวกเขาปฏิเสธ\n"
 wtt_warlord_vs_prc.1.b: "เราไมตองการลัทธิฉวยโอกาสอยางโจงแจงเชนนี้"
 #soviet support new warlord and tells communist_china that they are done.
 wtt_warlord_vs_prc.2.t: "สารจาก [soviet.GetLeader]"
 wtt_warlord_vs_prc.2.desc: "ผูแทนรัฐบาล[SOV.GetAdjective]ไดแจงเราวา [SOV.GetLeader] มีขอสงสัยอยางรายแรงตอความถูกตองในการตีความทฤษฎีมารกซิสตของ [communist_china.GetLeader] ในชวงวิกฤตของการตอสูทางชนชั้นในจีนนี้ เราตองไมหันเหออกจากการประยุกตใชคําสอนมารกซ-เลนินอยางถูกตอง ดูเหมือนมอสโกจะเชื่อวา [warlord.GetLeader] เขาใจไดดีกวาวาตองทําอะไรเพื่อผลักดันอุดมการณคอมมิวนิสตในจีน ในมุมมองของมอสโก พรรคควรยอมรับ [warlord.GetLeader] เปนประธานคนใหม มิฉะนั้นจะตองเผชิญความไมพอใจของ [SOV.GetLeader]"
 wtt_warlord_vs_prc.2.a: "สง [communist_china.GetLeader] ไปมอสโกเพื่อชี้แจงเรื่องนี้"
 wtt_warlord_vs_prc.2.b: "เราจะไมมีวันกมหัวใหคนทรยศ!"
 #soviet tells Warlord no support
 wtt_warlord_vs_prc.3.t: "[SOV.GetLeader] ปฏิเสธ"
 wtt_warlord_vs_prc.3.desc: "มีรายงานวา [SOV.GetLeader] ยังไมเชื่อมั่นในความภักดีหรือความสามารถในการนําของเรา รัฐบาล[SOV.GetAdjective]ยังคงสนับสนุน [communist_china.GetLeader] ในฐานะประธานพรรคคอมมิวนิสตจีนตอไป"
 wtt_warlord_vs_prc.3.a: "เก็บเรื่องนี้ไวระหวางเราก็พอ"
 #Warlord is told they are now the new communist_china.
 wtt_warlord_vs_prc.4.t: "[communist_china.GetNameDefCap] ยอมสยบ"
 wtt_warlord_vs_prc.4.desc: "การวิงวอนอยางสิ้นหวังของ [communist_china.GetLeader] ตอ [SOV.GetLeader] แทบไมชวยโนมนาวโซเวียตใหมาอยูขางเขาเลย เมื่อตระหนักวาแพแนแลว [communist_china.GetLeader] จึงยอมรับความผิดพลาดของตนตอสาธารณะ และสัญญาวาจะทํางานรวมกับเราเพื่อใหการปฏิวัติไดรับชัยชนะ"
 wtt_warlord_vs_prc.4.a: "ดี"
 ##Neighboring warlord told to join or die
 wtt_warlord_vs_prc.10.t: "เขารวมหรือตาย"
 wtt_warlord_vs_prc.10.desc: "เมื่อตองเลือกระหวางสละอํานาจหรือทาทายวาโซเวียตแคขู [communist_china.GetLeader] เลือกอยางหลัง นาเสียดายที่ดูเหมือน [SOV.GetLeader] ไมไดขู และการสูรบไดเริ่มขึ้นแลว ดวยสถานะที่ลอแหลมของเรา เราถูกกดดันอยางหนักจากทั้งสองฝาย โดยโซเวียตเรียกรองใหเราชวยโคนคนทรยศ\n\nพวกเขาบอกวาการปฏิเสธจะเทากับการเลือกอยูขาง [communist_china.GetLeader]"
 wtt_warlord_vs_prc.10.a: "ไมคุมที่จะตายเพื่อ [communist_china.GetLeader]"
 wtt_warlord_vs_prc.10.b: "เราจะไมมีสวนรวมในเรื่องนี้"
 #Soviet asks WTT_communist_china for more stuff after having supported them
 wtt_warlord_vs_prc.21.t: "[From.GetLeader] เรียกรองการสนับสนุนจากเรา"
 wtt_warlord_vs_prc.21.desc: "สารจาก [From.GetLeader] มาถึงแลว เรียกรองใหเราเรงสงความชวยเหลือทางเศรษฐกิจที่ตกลงกันไวกอนหนานี้"
 wtt_warlord_vs_prc.21.a: "นี่คือราคาที่เราตองจาย"
 wtt_warlord_vs_prc.21.b: "นี่มันปลนกันชัด ๆ!"
 wtt_warlord_vs_prc.22.t: "[From.GetNameDefCap] ยอมรับ"
 wtt_warlord_vs_prc.22.desc: "แม [From.GetLeader] จะประทวงตามเคย แตเขาก็ตกลงเรงการชําระเงินตามที่เรารองขอ"
 wtt_warlord_vs_prc.22.a: "เขาควรภาวนาใหเราไมเปลี่ยนขอตกลงไปมากกวานี้"
 wtt_warlord_vs_prc.23.t: "[From.GetNameDefCap] ปฏิเสธ"
 wtt_warlord_vs_prc.23.desc: "[From.GetLeader] ตอบคําขอการสนับสนุนเพิ่มเติมของเราดวยการปฏิเสธอยางสิ้นเชิง โดยอางวาประเทศของเขาไมมีความสามารถเลยที่จะจายเงินอัน "ไรเหตุผล" ตามที่เราเรียกรอง"
 wtt_warlord_vs_prc.23.a: "เขาสัญญาไวแลว และเราจะตองไดสิ่งที่เปนของเรา!"
 wtt_warlord_vs_prc.23.b: "ปลอยผานไปสักครั้ง"
 #Soviet asks WTT_communist_china to become puppet
 wtt_warlord_vs_prc.31.t: "[From.GetLeader] เรียกรองความรวมมือที่ใกลชิดยิ่งขึ้น"
 wtt_warlord_vs_prc.31.desc: "สาสนจาก [From.GetLeader] มาถึงแลว ระบุวาการตอสูเชิงปฏิวัติของเราอยูในขั้นที่เปราะบางเปนพิเศษ และอาจตกเปนเหยื่อของฝายตอตานการปฏิวัติไดโดยงาย ผูแทนพิเศษของเขาไดรับคําสั่งใหเฝาจับตาความเคลื่อนไหวในประเทศของเราอยางใกลชิด และใหคําแนะนําแกเราถึงวิธีเอาชนะในการตอสูทางชนชั้น\n\nสาสนยังระบุตอไปอีกวา การเบี่ยงเบนใด ๆ จาก 'ขอเสนอแนะ' ของเขาจะถือเปนสัญญาณวากลุมปฏิกิริยาไดเขายึดกุมรัฐบาลของเราแลว และจะมีการดําเนินมาตรการที่จําเปนตอไป"
 wtt_warlord_vs_prc.31.a: "เรายินดีตอนรับโอกาสที่จะไดเรียนรู"
 wtt_warlord_vs_prc.31.b: "เราไมตองการใหใครมาสั่งวาตองทําอะไร"
 wtt_warlord_vs_prc.32.t: "[From.GetNameDefCap] ยอมรับ"
 wtt_warlord_vs_prc.32.desc: "[From.GetLeader] ไดตอนรับผูแทนพิเศษของเรา และแตงตั้งใหเปนที่ปรึกษาสวนตัว บัดนี้เราสามารถควบคุมนโยบายภายในและภายนอกของพวกเขาไดเปนอยางดี"
 wtt_warlord_vs_prc.32.a: "เขาเขาใจเหตุผล"
 wtt_warlord_vs_prc.33.t: "[From.GetNameDefCap] ปฏิเสธ"
 wtt_warlord_vs_prc.33.desc: "แมจะเปดรับแนวคิดนี้ แต [From.GetLeader] ไดปฏิเสธขอเรียกรองของเราที่จะขอมีอิทธิพลตอนโยบายของพวกเขาโดยตรงมากขึ้นอยางสุภาพแตหนักแนน ดูเหมือนวาเรา 'ไมคุนเคย' กับสภาพการณจริงในพื้นที่ และควรปลอยใหผูเชี่ยวชาญทองถิ่นเปนผูนําคําสอนของมารกซไปปฏิบัติ"
 wtt_warlord_vs_prc.33.a: "บางทีเราอาจตองยํ้าอีกครั้งใหหนักแนนกวาเดิม"
 wtt_warlord_vs_prc.34.t: "[From.GetNameDefCap] ปฏิเสธที่จะจาย"
 wtt_warlord_vs_prc.34.desc: "[From.GetLeader] เพิกเฉยตอขอเรียกรองที่หนักแนนขึ้นเรื่อย ๆ ใหเขาโอนเงินตามที่เราตกลงกันไวกอนหนานี้ แมแตคําขอใหเขามามอสโกเพื่อชี้แจงก็ไมไดรับการตอบกลับ"
 wtt_warlord_vs_prc.34.a: "เขาอยากลองดีกับเราหรือ?"
 # PRC informed a warlord wants to create a faction
 wtt_warlord_vs_prc.35.t: "พันธมิตร[From.GetAdjective]"
 wtt_warlord_vs_prc.35.desc: "[From.GetNameDefCap] ไดขอใหคอมมิวนิสตจีนรวมกันเปนฝายเดียว คือแนวรวมประชาชน เพื่อเอาชนะพวกชาตินิยม พวกปฏิกิริยา และผูรุกรานตางชาติภายใตธงผืนเดียวกัน"
 wtt_warlord_vs_prc.35.a: "บัดนี้ประชาชนคือวีรบุรุษ!"
 wtt_warlord_vs_prc.35.b: "สิ่งนี้ขัดตอผลประโยชนของ[Root.GetAdjective]"
 # If a human PRC rejects the faction, the warlord can dismantle it altogether
 wtt_warlord_vs_prc.36.t: "[From.GetLeader] ปฏิเสธการเปนพันธมิตร"
 wtt_warlord_vs_prc.36.desc: "[From.GetNameDefCap] ไดปฏิเสธหนทางอันไดเปรียบอยางเห็นไดชัดของแนวรวมประชาชนที่รวมกันตอตานพวกชาตินิยม พวกปฏิกิริยา และผูรุกรานตางชาติ โดยกลาวแทนวาการเปนพันธมิตรกับเราจะ 'ขัดตอผลประโยชนของ[From.GetAdjective]'"
 wtt_warlord_vs_prc.36.a: "เราคงตองเดินหนาไปเพียงลําพัง"
 wtt_warlord_vs_prc.36.b: "ถาอยางนั้นก็ยุบแนวรวมไปเสียทั้งหมดเลยดีกวา"
 wtt_manchukou.1.t: "[From.GetNameDefCap] เรียกรองใหสยบยอม"
 wtt_manchukou.1.desc: "ดูเหมือนวา [From.GetLeader] ไดตัดสินใจขยายอํานาจของตนไปยังดินแดนหางไกลของจีนในที่สุด ผูแทนจากรัฐบาล[From.GetAdjective]เดินทางมาถึง พรอมเรียกรองใหเรากมหัวใหแกจักรพรรดิที่แทจริงเพียงหนึ่งเดียวของจีน โอรสแหงสวรรค [From.GetLeader] เขากลาวตอวาหากปฏิเสธ จะถูกลงโทษในฐานะกบฏขั้นรายแรงที่สุด"
 wtt_manchukou.1.a: "เรื่องสาธารณรัฐนี่ยังไงก็ไมมีวันไปรอดอยูแลว"
 wtt_manchukou.1.b: "ใหเขาลองดู"
 wtt_manchukou.2.t: "[From.GetLeader] ยอมสยบ"
 wtt_manchukou.2.desc: "[From.GetLeader] ไดสงผูถือสาสนกลับมาพรอมจดหมายสวนตัว ใหคํามั่นวาจะเชื่อฟงอยางเครงครัด และยินดีรับ [MAN.GetLeader] เปนผูนําที่แทจริงของจีน"
 wtt_manchukou.2.a: "เขารูที่ทางของตัวเอง"
 wtt_manchukou.3.t: "[From.GetLeader] ปฏิเสธ"
 wtt_manchukou.3.desc: "[From.GetLeader] ตอบขอเสนออันใจกวางของเราดวยคําดาทอและคําสาปแชงมากมาย กลาวถึงบรรพบุรุษและนิสัยสวนตัวของจักรพรรดิ [MAN.GetLeader] ดวยถอยคําที่ทั้งไมถูกตองและหยาบคายอยางยิ่ง"
 wtt_manchukou.3.a: "เราจะสอนมารยาทใหเขาเอง"
 wtt_manchukou.11.t: "แผนหาป"
 wtt_manchukou.11.desc: "แผนหาปฉบับใหมซึ่งระบุวารัฐบาลของเราคาดวาจะพัฒนาเศรษฐกิจอยางไรในอีกหลายปขางหนากําลังคอย ๆ เปนรูปเปนราง แตยังคงมีความเห็นที่แตกตางกันอยางมากระหวางหนวยงานตาง ๆ วาควรเนนหนักไปที่ดานใด \n\nแมจะมีฉันทามติวาเปาหมายควรเปนการขยายอุตสาหกรรมหนัก แตโรงงานใหมเหลานี้ควรผลิตอะไรนั้นยังอยูระหวางการหารือ \n\nจําเปนตองมีการตัดสินใจเพื่อยุติทางตันนี้"
 wtt_manchukou.11.a: "สรางอุตสาหกรรมการบินของเรา"
 wtt_manchukou.11.b: "ลงทุนในอุตสาหกรรมยานยนต"
 wtt_manchukou.11.c: "โครงการอุตสาหกรรมทั่วไป"
 wtt_manchukou_bandit_sabotage.21.t: "โรงงานอาวุธถูกกอวินาศกรรม"
 wtt_manchukou_bandit_sabotage.21.desc: "มีรายงานจากโรงงานแหงหนึ่งของเราใน [FROM.GetName] วาเกิดเพลิงไหมครั้งใหญเมื่อคืนนี้ นักดับเพลิงทองถิ่นยังคงตอสูกับเปลวไฟ แตมั่นใจวาจะควบคุมเพลิงไดภายในสิ้นวัน ความเสียหายตอโรงงานดูเหมือนจะรุนแรง เนื่องจากไฟนาจะเริ่มตนที่บริเวณจัดเก็บสารเคมีไวไฟสูง\n\nหนวยขาวกรองทหารไดเริ่มการสอบสวนอยางละเอียดเพื่อหาวาไฟลุกไหมขึ้นไดอยางไรทั้งที่มีมาตรการความปลอดภัยเขมงวดที่สุด เบาะแสแรกบงชี้วามีความเปนไปไดสูงที่จะเปนการลอบวางเพลิง"
 wtt_manchukou_bandit_sabotage.21.a: "ตองตามลาผูกอการรายพวกนี้ใหได!"
 wtt_manchukou_bandit_sabotage.22.t: "โรงงานพลเรือนถูกกอวินาศกรรม"
 wtt_manchukou_bandit_sabotage.23.t: "สะพานถูกระเบิด"
 wtt_manchukou_bandit_sabotage.23.desc: "ในชวงเวลาหนึ่งเมื่อคืนนี้ สะพานรถไฟสําคัญแหงหนึ่งใน [FROM.GetName] พังถลมลงภายใตนํ้าหนักของขบวนรถไฟขนกระสุนที่แลนผาน การกูภัยและกูซากเปนไปอยางยากลําบากเพราะการระเบิดตอเนื่องจากกระสุน ลูกเรือของขบวนรถไฟยังคงสูญหายและคาดวาเสียชีวิตแลว\n\nหนวยขาวกรองทหารไดสงทีมไปตรวจสอบพื้นที่ทันทีที่ปลอดภัย เพื่อหาวาสะพานที่แข็งแรงพังถลมลงมาไดอยางไรโดยไมมีสัญญาณเตือนใด ๆ\n\nพยานในทองถิ่นรายงานวาเห็นคนกลุมเล็ก ๆ อยูในหุบเขาใตสะพานในวันกอนสะพานถลม ขณะนี้ยังไมทราบวาคนกลุมนั้นอยูที่ใด"
 generic.11.t: "สงครามกลางเมืองยุติ"
 generic.11.d: "สงครามที่ฉีกประเทศของเราออกเปนเสี่ยง ๆ ไดยุติลงในที่สุด บัดนี้เราสามารถเริ่มภารกิจในการรวมใจประชาชนและฟนฟูความเสียหายไดแลว"
 generic.11.a: "เราจะรวมกันสรางอนาคตที่ดีกวา!"
 generic.12.t: "[From.GetAdjective]พยายามกอวินาศกรรมคลองสุเอซ"
 generic.12.d: "หนวยขาวกรองทหารบงชี้วา[From.GetAdjective]ตั้งใจจะใชการระเบิดทําลายขนาดใหญและเรือจมขวางเพื่อกอวินาศกรรมคลองสุเอซ หากเราตองการหยุดยั้งพวกเขา เราไมมีเวลามากนัก"
 generic.12.a: "เราไมอาจปลอยใหเกิดขึ้นได!"
 generic.13.t: "[From.GetAdjective]พยายามกอวินาศกรรมคลองปานามา"
 generic.13.d: "หนวยขาวกรองทหารบงชี้วา[From.GetAdjective]ตั้งใจจะใชการระเบิดทําลายขนาดใหญและเรือจมขวางเพื่อกอวินาศกรรมคลองปานามา หากเราตองการหยุดยั้งพวกเขา เราไมมีเวลามากนัก"
 generic.14.t: "[From.GetName] ยื่นประทวงทางการทูต"
 generic.14.d: "ทูต[From.GetAdjective]ไดยื่นประทวงทางการทูตอยางรุนแรงตอรัฐบาลของเรา เกี่ยวกับการที่ผูชวยทูตทหารของเราประจําอยูในประเทศที่พวกเขากําลังทําสงครามดวย พวกเขาเรียกรองใหเราเรียกตัวคณะผูแทนทางทหารกลับทันที"
 generic.14.a: "เปนคําขอที่สมเหตุสมผล"
 generic.14.b: "ผูชวยทูตทหารของเราจะถูกสงไปที่ใดก็ไดตามที่เราตองการ"
 attache_political_power_tt: "เนื่องจากกําลังโดยเปรียบเทียบของเราและ§Yความคิดเห็น§!ที่เรามีตอพวกเขา สิ่งนี้จะมีผลดังตอไปนี้:\n"
 attache_fascism_tt: "เนื่องจากระดับการสนับสนุน§Yฟาสซิสต§!ในประเทศของเรา สิ่งนี้จะมีผลดังตอไปนี้:\n"
 attache_communism_tt: "เนื่องจากระดับการสนับสนุน§Yคอมมิวนิสต§!ในประเทศของเรา สิ่งนี้จะมีผลดังตอไปนี้:\n"
 attache_democratic_tt: "เนื่องจากระดับการสนับสนุน§Yประชาธิปไตย§!ในประเทศของเรา สิ่งนี้จะมีผลดังตอไปนี้:\n"
 attache_neutrality_tt: "เนื่องจากระดับการสนับสนุน§Yไมฝกใฝฝายใด§!ในประเทศของเรา สิ่งนี้จะมีผลดังตอไปนี้:\n"
 generic.15.t: "[From.GetName] เรียกผูชวยทูตทหารกลับ"
 generic.15.d: "เพื่อตอบสนองขอเรียกรองของเรา [From.GetNameDef] ไดถอนคณะผูแทนทางทหารออกจากศัตรูของเราแลว"
 generic.16.t: "[From.GetName] คงผูชวยทูตทหารไว"
 generic.16.d: "แมเราจะเรียกรอง แต [From.GetNameDef] ปฏิเสธที่จะถอนคณะผูแทนทางทหารออกจากศัตรูของเรา โดยกลาววา "พวกเราไมมีสิทธิ์กาวกายกิจการภายในของ[From.GetAdjective]""
 generic.16.a: "แลวคอยดูกัน"
 canals_tt: "ยึดครองตลิ่งทั้งสองฝงของคลองใหไดภายในเดือนหนาเพื่อขัดขวางแผนของศัตรู"
 japan_border_conflict.1.t: "การยั่วยุของญี่ปุนที่ชายแดนของเรา"
 japan_border_conflict.1.desc: "ในการดูแลรักษาเสนแบงเขตบนพรมแดนระหวางเรากับ [JAP.GetNameDef] เราไดสงคณะทํางานออกไปตรวจสอบหลักหมุดแบงเขตใกลทะเลสาบคาซาน เมื่อเขาใกลชายแดน คณะทํางานก็ถูกยิงใสจากดานหนาของญี่ปุนในพื้นที่ \n\n เราไดยื่นประทวงทางการทูตอยางเปนทางการแลว แตเอกอัครราชทูตญี่ปุนยืนกรานวาคณะทํางานถูกสงไปเพื่อยายหลักหมุด เพื่อใหเราอางสิทธิ์ดินแดนไดมากขึ้น\n\nญี่ปุนไดใหคํามั่นวาจะเคารพพรมแดน แตจะไมยอมใหมีการ "แทรกแซง" แนวแบงเขตในปจจุบัน และจะตอบโตดวยกําลังหากเราพยายามทําเชนนั้น\n\n นั่นหมายความวาเราไมสามารถเคลื่อนไหวไดอยางเสรีในดินแดนของเราในพื้นที่นั้นอีกตอไป"
 japan_border_conflict.1.a: "ยอมรับไมได"
 japan_border_conflict.2.t: "ญี่ปุนไดชัยที่ทะเลสาบคาซาน"
 japan_border_conflict.2.desc: "หลังการปะทะระหวางกองกําลัง[SOV.GetAdjective]และญี่ปุนในพื้นที่ชายแดนรอบทะเลสาบคาซาน มีรายงานวากองกําลัง[SOV.GetAdjective]กําลังลาถอยอยางเต็มรูปแบบ หนวยทหารญี่ปุนไดยึดเนินเขายุทธศาสตรหลายแหงรอบพื้นที่และเริ่มเสริมที่มั่นของตน\n\nระหวางการรบ ญี่ปุนยึดรถถัง[SOV.GetAdjective]ไดจํานวนหนึ่ง ซึ่งถูกสงไปยังโตเกียวเพื่อประเมินผล"
 japan_border_conflict.2.a: "เราไดยุติเรื่องนี้อยางมีเกียรติแลว"
 japan_border_conflict.2.b: "เราตองเตรียมการตอบโตอยางเหมาะสม"
 japan_border_conflict.3.t: "ญี่ปุนพายแพที่ทะเลสาบคาซาน"
 japan_border_conflict.3.desc: "หลังการปะทะระหวางกองกําลัง[SOV.GetAdjective]และญี่ปุนในพื้นที่ชายแดนรอบทะเลสาบคาซาน เอกอัครราชทูตญี่ปุนประจํามอสโกไดขอหยุดยิง \n\n การบุกโจมตีที่มั่น[SOV.GetAdjective]ของญี่ปุนหลายครั้งลมเหลวพรอมความสูญเสียอยางหนักระหวางการรบ ทําใหเกิดความกังวลในกองทัพญี่ปุนเกี่ยวกับขีดความสามารถของกองกําลังตน"
 japan_border_conflict.3.a: "ลมเหลวอยางมีเกียรติยังดีกวาไมเคยลองเลย"
 japan_border_conflict.3.b: "กองกําลังของเราปฏิบัติหนาที่ไดอยางดีเยี่ยม"
 japan_border_conflict.4.t: "ภาวะชะงักงันที่ทะเลสาบคาซาน"
 japan_border_conflict.4.desc: "การสูรบระหวางกองกําลังญี่ปุนและ[SOV.GetAdjective]รอบทะเลสาบคาซานไดสงบลง หลังจากทั้งสองฝายถอนตัวออกจากพื้นที่พิพาทเพื่อจัดกําลังใหมและเติมเสบียง เมื่อตระหนักวาการรุกตอไปไรประโยชน กองทัพญี่ปุนจึงขอหยุดยิงและเจรจากําหนดพรมแดน"
 japan_border_conflict.4.a: "เราไดรับประสบการณอันมีคา"
 japan_border_conflict.5.t: "การสูรบทวีความรุนแรงที่ทะเลสาบคาซาน"
 japan_border_conflict.5.desc: "การสูรบระหวางกองกําลังญี่ปุนและ[SOV.GetAdjective]รอบทะเลสาบคาซานยังคงดําเนินตอไป เพื่อพยายามทําลายทางตัน กองกําลังญี่ปุนในพื้นที่อื่นก็เริ่มเขาปะทะกับกองกําลัง[SOV.GetAdjective]ในเขตนั้นดวย ขาวกรองบงชี้วาญี่ปุนอาจเสริมกําลังการโจมตีดวยกองทหารชุดใหมที่โยกยายมาจากสวนอื่นของจักรวรรดิในไมชา"
 japan_border_conflict.5.a: "เราตองรักษาแนวไวใหได"
 japan_border_conflict.6.t: "การสูรบทวีความรุนแรงที่ทะเลสาบคาซาน"
 japan_border_conflict.6.desc: "การสูรบระหวางกองกําลัง[FROM.GetAdjective]และ[JAP.GetAdjective]รอบทะเลสาบคาซานยังคงดําเนินตอไป เพื่อพยายามทําลายทางตัน กองกําลัง[FROM.GetAdjective]ในพื้นที่อื่นก็เริ่มเขาปะทะกับกองกําลัง[JAP.GetAdjective]ในเขตนั้นดวย ขาวกรองบงชี้วา [FROM.GetNameDef] อาจเสริมกําลังการโจมตีดวยกองทหารชุดใหมที่โยกยายมาจากสวนอื่นของประเทศในไมชา"
 japan_border_conflict.6.a: "เราตองเตรียมพรอมโจมตี!"
 JAP_kalkin_gol: "ทดสอบโซเวียต"
 wtt_prc.30.t: "การยั่วยุสําเร็จ"
 wtt_prc.30.desc: "สหายของเราใน [JAP.GetManchuriaPuppet] ไดกอวินาศกรรมโรงงานของญี่ปุนภายใตความมืดของรัตติกาล รายละเอียดความเสียหายยังมีไมมากนัก เนื่องจากพวกจักรวรรดินิยมไดประกาศใหทั้งพื้นที่เปนเขตหวงหาม\n\nเพียงขอเท็จจริงนี้ก็บอกเราไดแลววาเราโจมตีไดตรงเปา ยังตองรอดูวาสิ่งนี้จะกระตุนใหญี่ปุนลงมือหรือไม"
 wtt_prc.30.a: "เราแหยรังแตนเขาแลว"
 wtt_prc.31.desc: "สหายของเราใน [JAP.GetManchuriaPuppet] ไดกอวินาศกรรมสะพานสําคัญแหงหนึ่งภายใตความมืดของรัตติกาล หนวยคอมมานโดขนาดเล็กรายงานวาสะพานถูกทําลายจนสิ้นซาก และยังพาขบวนรถไฟขนกระสุนพังลงไปดวยขณะถลม \n\n\tพวกเขาจงใจใหชาวบานในพื้นที่เห็นตัว เพื่อใหชัดเจนวานี่คือการกอวินาศกรรม ยังตองรอดูวาสิ่งนี้จะกระตุนใหญี่ปุนลงมือหรือไม"
 wtt_prc.32.desc: "เราซุมโจมตีและทําลายหนวยลาดตระเวนญี่ปุนใน [JAP.GetManchuriaPuppet] ไดอยางราบคาบ ศพของพวกเขาถูกทิ้งไวในที่เกิดเหตุเพื่อใหแนใจวาพวกจักรวรรดินิยมจะไดรับสารอยางถูกตอง \n\nเวลาจะเปนเครื่องพิสูจนวาพวกเขาจะถือวาการกระทํานี้เปนเหตุผลเพียงพอที่จะทําสงครามหรือไม"
 wtt_prc.20.c: "เราควรถอนตัวออกจากแผนดินใหญไปเสียทั้งหมด"
 wtt_germany.1006.t: "ไกเซอรกําลังเตรียมกอรัฐประหาร!"
 wtt_germany.1006.desc: "หนวยขาวกรองทหาร (Servizio Informazione Militare) รายงานถึงความเคลื่อนไหวนาสงสัยในวงในของฝายนิยมกษัตริย ดูเหมือนวาผูที่จงรักภักดีตอกษัตริยเพียงผูเดียวบางคนไดติดตอกับสายลับตางชาติเมื่อไมนานมานี้ และเปนสายลับเยอรมันเสียดวย ดูเหมือนฝายนิยมกษัตริยกําลังถูกเกณฑและรวมพลเพื่อตอตานผูนําผูยิ่งใหญของเรา แตใชวาทุกอยางจะสูญสิ้น เราสามารถสงแกงอันธพาลเขาไปจัดการพวกมัน และตีโตพวกมันกลับไปขณะที่ยังมีโอกาส เราควรดําเนินการอยางไร?"
 wtt_germany.1006.a: "บันดา การิตา จัดการพวกมันได"
 britain.25.t: "[ENG.GetNameDefCap] เรียกรองใหยอมจํานน"
 britain.25.desc: "รัฐบาล[ENG.GetAdjective]ซึ่งดูจะตื่นตระหนกหลังการลมสลายของ [DEN.GetNameDef] ประกอบกับการปรากฏตัวของนักการทูต[GER.GetAdjective]ใน [ICE.GetNameDef] ไดเชิญเราเขารวมฝายสัมพันธมิตรในฐานะผูรวมทําสงคราม พวกเขาอางความกังวลดานความมั่นคงของชาติวา [GER.GetNameDef] อาจใชฐานทัพในไอซแลนดเปนจุดปลอยตัวสําหรับการจูโจมขบวนเรือลําเลียงหรือเมืองตาง ๆ ของอังกฤษ\nคําขูของพวกเขาแทบไมไดปดบัง โดยอางถึงสถานการณโลกในปจจุบันวา การกลาวอาง “ความเปนกลางที่วากันวามี” ใด ๆ จากฝายเรา ลวนถูกบดบังดวยความปลอดภัยของพลเมืองอังกฤษและสงครามตอตานฟาสซิสต"
 britain.25.a: "เราไมมีทางเลือกนอกจากเขารวม [ENG.GetFactionName]"
 britain.25.b: "ชางหัว[ENG.GetAdjective]ปะไร"
 britain.25.c: "เราตองยึดมั่นในความเปนกลาง แมจะหมายถึงการถูกรุกรานก็ตาม"
 britain.26.t: "[ICE.GetNameDefCap] ขอความคุมครองจากเราใหพนจาก [ENG.GetNameDef]"
 britain.26.desc: "นักการทูตของเราที่ประจําอยูใน [ICE.GetNameDef] ไดสงสาสนมาหลายฉบับวารัฐบาล[ICE.GetAdjective]ที่เพิ่งกอตั้งถูกขูวาจะถูกกองกําลังอังกฤษยึดครองหากไมยอมจํานน เมื่อไมมีทางเลือกอื่นที่เปนไปได [ICE.GetLeader.GetName] จึงขอความคุมครองจากเราใหพนจากภัยคุกคามของอังกฤษ บางทีฐานทัพที่อยูใกลแผนดินใหญของอังกฤษถึงเพียงนี้อาจเปนประโยชนตอเราก็ได?"
 britain.26.a: "ประชาชนแหง [ICE.GetNameDef] ตองไดรับการปกปอง"
 britain.26.b: "เราไมมีทรัพยากรเหลือพอ"
 britain.27.t: "[ICE.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 britain.27.desc: "รัฐบาล[ICE.GetAdjective]ไดปฏิเสธคําขาดของเราที่ใหยอมทําตาม โดยอางถึงความเชื่อมั่นในความเปนกลาง และการตอตานอยางแข็งขันที่จะถูกลากเขาสูสงครามซึ่งพวกเขาไมมีสวนเกี่ยวของ\nพวกเขากลาวหาวาคําสั่งนี้เปนการลวงละเมิดเอกราชของพวกเขาอยางโจงแจง นาเสียดายที่นี่คือสงครามสมัยใหม และในสงครามสมัยใหมไมอาจมีฝายที่เปนกลางได แมเราจะเสียใจกับแนวทางนี้ แตเราตองทําในสิ่งที่จําเปนตองทํา"
 britain.27.a: "หนทางที่นาเสียดายแตจําเปน"
