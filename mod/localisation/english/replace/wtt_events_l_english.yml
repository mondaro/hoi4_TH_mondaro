l_english:
 generic.8.t: "เจาแหงปรมาณู"
 generic.8.d: "เราไดใชอาวุธนิวเคลียรลูกแรกของโลก ทําใหเราขึ้นนําในการแขงขันสะสมอาวุธอยางมั่นคง ความพยายามมหาศาลของเราไดรับผลตอบแทนแลว และในตอนนี้โลกไมมีทางเลือกอื่นนอกจากตะลึงในพลังของเรา สักวันพวกเขาอาจตามทัน แตเราไดทําใหแนใจแลววาพวกเขาจะไมมีวันแซงหนาเรา"
 generic.8.a: "บดขยี้ศัตรูใหเปนผุยผง!"
 generic.9.t: "ใตเงาของผูอื่น"
 generic.9.d: "ผูอื่นไดใชอาวุธนิวเคลียรลูกแรกของโลก ทําใหพวกเขาขึ้นนําในการแขงขันสะสมอาวุธอยางมั่นคง แมเราจะพยายามอยางเต็มที่ แตเราก็ไรทั้งการปองกันและหนทางตอบโต เมื่อถูกทิ้งหางอยางสิ้นเชิง เราไมมีทางเลือกอื่นนอกจากเรงความพยายามเปนเทาตัวและปดชองวางกอนที่พวกเขาจะปลดปลอยหายนะเชนนี้ออกมาอีก"
 generic.9.a: "โครงการตองไดทุกอยางที่เราเจียดใหได"
 generic.10.t: "มิตรผูทรงพลัง"
 generic.10.d: "พันธมิตรของเราไดใชอาวุธนิวเคลียรลูกแรกของโลก ทําใหพันธมิตรของเราขึ้นนําในการแขงขันสะสมอาวุธอยางมั่นคง แมเราเองจะถูกทิ้งหาง แตอาวุธนี้อยูในมือพันธมิตรของเรา ซึ่งรับประกันวาเราจะตอบโตไดหากศัตรูรายใดครอบครองพลังปรมาณูเชนกัน"
 generic.10.a: "เปนผลลัพธที่ยอมรับได"
 wtt_denmark.1.t: "เอกราชของไอซแลนด"
 wtt_denmark.1.d: "เมื่อการติดตอถูกตัดขาดหลังการรุกราน รัฐสภาไอซแลนดจึงเขาควบคุมกิจการตางประเทศของชาติเอง ซึ่งเขาใจกันวาเปนมาตรการชั่วคราวจนกวาการยึดครองจะสิ้นสุดลง"
 wtt_denmark.1.a: "ขอใหพวกเขาโชคดี"
 news.331.t: "ไอซแลนดเขาควบคุมกิจการตางประเทศ"
 news.331.desc: "เมื่อเดนมารกซึ่งเปนหุนสวนในสหภาพยอมจํานน รัฐสภาไอซแลนดจึงเขาควบคุมกิจการตางประเทศของตนเอง และดวยเหตุนี้จึงกลายเปนชาติเอกราชโดยสมบูรณ ผูวาการชั่วคราวที่เพิ่งไดรับเลือกไดประกาศความเปนกลางของไอซแลนดในความขัดแยงครั้งนี้แลว แมประเทศแมจะถูกรุกรานก็ตาม"
 news.331.a: "ความเปนกลางไมไดชวยเดนมารกไว"
 wtt_britain.24.t: "ขอเสนอแมกโดนัลด"
 wtt_britain.24.d: "เมื่อสงครามครั้งนี้กดดันขบวนเรือลําเลียงของอังกฤษอยางหนัก เพื่อนบานทางตะวันออกของเราก็รอนใจมากขึ้นทุกทีที่จะขอใชฐานทัพอากาศและฐานทัพเรือของเรา เพื่อขยายการคุมกันเสนทางขบวนเรือลําเลียงของตน บัดนี้ทูตอังกฤษนามมัลคอลม แมกโดนัลดไดเดินทางมาถึงเพื่อเสนอคืนไอรแลนดเหนือใหอยูใตอธิปไตยของไอรแลนด แลกกับการที่เราเขารวมสงครามฝายสหราชอาณาจักรในทันที"
 wtt_britain.24.a: "ความคิดที่ยอดเยี่ยม"
 wtt_britain.24.b: "รางวัลไมคุมกับราคาที่ตองจาย"
 wtt_britain.25.t: "อังกฤษเรียกรองกองเรือฝรั่งเศส"
 wtt_britain.25.d: "กองเรืออังกฤษปรากฏตัวนอกทาเรือหลักของกองเรือเรา และเราไดรับคําขาดเรียกรองใหกองทัพเรือของเรายอมจํานนทันที หากเราไมแลนเรือไปยังทาเรืออังกฤษโดยทันที พลเรือเอกอังกฤษขูวาจะเปดฉากยิง"
 wtt_britain.25.a: "เราไมมีทางเลือกอื่น..."
 wtt_britain.25.b: "เราจะไมมีวันยอมใหชาติใดยึดกองเรือของเรา!"
 wtt_britain.26.t: "ฝรั่งเศสยอมมอบกองเรือ"
 wtt_britain.26.d: "ฝรั่งเศสตัดสินใจอยางชาญฉลาดที่จะแลนเรือมายังทาเรือของเรา บัดนี้เราควบคุมกองเรือฝรั่งเศสไดอยางสมบูรณ"
 wtt_britain.26.a: "อยางนอยเราก็กันมันไวไมใหตกไปอยูในมือเยอรมัน"
 wtt_britain.27.t: "ฝรั่งเศสปฏิเสธคําขาด"
 wtt_britain.27.d: "ฝรั่งเศสปฏิเสธขอเรียกรองของเรา บัดนี้เราเหลือทางเลือกที่ไมมีใครอยากได คือถอยหรือหันไปเลนงานอดีตพันธมิตรของเรา..."
 wtt_britain.27.a: "เราไมอาจปลอยใหกองเรือฝรั่งเศสรับใชผลประโยชนของเยอรมัน!"
 wtt_britain.27.b: "นี่มันเกินจะรับได เราตองถอย"
 news.332.t: "ฝรั่งเศสยอมมอบกองเรือ"
 news.332.desc: "เมื่อวานนี้ หนวยเรือของอังกฤษปดลอมเรือฝรั่งเศสในฐานทัพเรือสําคัญในแอฟริกาเหนือ และยื่นคําขาดใหฝรั่งเศสแลนเรือไปยังทาเรืออังกฤษทันทีและยอมมอบการควบคุมกองเรือ มิฉะนั้นอังกฤษจะเปดฉากยิงใสอดีตพันธมิตร เมื่อเผชิญกับอํานาจการยิงที่เหนือกวา ฝรั่งเศสจึงยอมรับคําขาด และบัดนี้กองเรือของพวกเขาอยูภายใตการควบคุมของอังกฤษ"
 news.332.a: "การตัดสินใจที่ชาญฉลาด"
 news.332.b: "โชคดีที่หลีกเลี่ยงการนองเลือดได"
 news.332.c: "พวกมันกลาดีอยางไร?!"
 news.332.d: "เราไมมีทางเลือก"
 news.332.e: "พวกเขาจะสูตอภายใตอังกฤษ"
 news.333.t: "อังกฤษโจมตีที่แมร-เอล-เกบีร"
 news.333.desc: "เมื่อวานนี้ หนวยเรือของอังกฤษปดลอมเรือฝรั่งเศสในฐานทัพเรือสําคัญในแอฟริกาเหนือ และยื่นคําขาดใหฝรั่งเศสแลนเรือไปยังทาเรืออังกฤษทันทีและยอมมอบการควบคุมกองเรือ มิฉะนั้นอังกฤษจะเปดฉากยิงใสอดีตพันธมิตร เมื่อฝรั่งเศสปฏิเสธขอเรียกรองของอังกฤษ การยิงตอสูก็เกิดขึ้น ทําใหเรือประจัญบานฝรั่งเศสจมอยางนอยหนึ่งลํา และกองเรือฝรั่งเศสสวนใหญเสียหายอยางหนัก"
 news.333.a: "เราทําในสิ่งที่ตองทํา"
 news.333.b: "นี่มันอุกอาจที่สุด!"
 news.333.c: "เราอาจประเมินพวกเขาตํ่าไป"
 news.333.d: "เราจะไมลืมการทรยศครั้งนี้ไปงาย ๆ!"
 news.333.e: "พวกเขาไดพิสูจนความแนวแนแลว"
 wtt_britain.28.t: "ไอรแลนดยอมรับขอเสนอแมกโดนัลด"
 wtt_britain.28.d: "รัฐบาลไอรแลนดยอมรับขอเสนอของเรา และเขารวมฝายเราเพื่อแลกกับไอรแลนดเหนือ"
 wtt_britain.29.t: "ไอรแลนดปฏิเสธขอเสนอแมกโดนัลด"
 wtt_britain.29.d: "รัฐบาลไอรแลนดปฏิเสธขอเสนอของเรา ไมยอมเขารวมการตอสูเพื่อประชาธิปไตยของเรา"
 wtt_britain.29.a: "ใครจะชวยพวกเขาเมื่อเยอรมันบุกมา?"
 wtt_britain.30.t: "การสงมอบอาวุธฉุกเฉินจากอเมริกา"
 wtt_britain.30.d: "รัฐบาลอเมริกัน ดวยการสนับสนุนอยางมีนํ้าใจจากคณะกรรมการอเมริกันเพื่อการปกปองบานเรือนชาวอังกฤษ ไดสงปนไรเฟลเกา ยุทโธปกรณ และปนใหญจํานวนหนึ่งมาใหเราเปนการเรงดวน ของเหลานี้หลากหลายเกินกวาจะใชประโยชนไดจริงในกองทัพ แตยอมชวยไดมากในการเรงติดอาวุธใหกองรักษาการณของกองกําลังรักษาดินแดน"
 wtt_britain.30.a: "พวกเขาชวยเราไวจากการรุกราน!"
 wtt_germany.1.t: "นายทหารแวรมัคททาทายฮิตเลอร"
 wtt_germany.1.d: "ความไมพอใจที่คุกรุนตอการปกครองของฮิตเลอรปะทุขึ้นในวิกฤตครั้งนี้ ซึ่งเกิดจากการที่รัฐบาลเคลื่อนกําลังเขาไรนแลนดอีกครั้ง นายพลแวรมัคทจํานวนหนึ่งรวมตัวกันสนับสนุนจอมพลเอากุสท ฟอน มัคเคนเซินผูมีชื่อเสียง ซึ่งไดเริ่มดําเนินแผนโคนฮิตเลอรและขจัดพรรคนาซีออกจากเยอรมนี\n\nเมื่อความแตกแยกในกองบัญชาการสูงสุดของเยอรมนีปรากฏชัดแมแตในตางแดน มหาอํานาจตางชาติจึงเลือกไมประทวงการนํากําลังทหารเขาไรนแลนด เพราะกังวลกับความไรเสถียรภาพภายในเยอรมนีที่ทวีขึ้นมากกวา จอมพลผูชราเคลื่อนไหวอยางรวดเร็ว จัดตั้งรัฐบาลชั่วคราวขึ้นแลว และผูคนจํานวนมากตางหลั่งไหลเขารวมเพื่อตอตานรัฐบาลนาซี\n\nรัฐประหารโดยทหารกําลังดําเนินไปอยางเต็มกําลัง"
 wtt_germany.1.a: "กวาดลางพวกนาซีสวะออกจากแผนดินของเรา!"
 wtt_germany.2.t: "ชาวเยอรมันพลัดถิ่นเขารวมอุดมการณ"
 wtt_germany.2.d: "หลังถูกปฏิบัติอยางโหดรายและถูกบังคับใหออกนอกประเทศบานเกิดเมื่อไมนานมานี้ สหายชาวเยอรมันผูพลัดถิ่นจํานวนมากไดหลั่งไหลมายังพื้นที่ของเรา ดวยการนําที่ดี เราไดจัดตั้งกองพลหลายกองพลจากทหารใหมผูกระตือรือรนเหลานี้ และบัดนี้พวกเขาพรอมสูกับศัตรูของเราแลว!"
 wtt_germany.3.t: "เยอรมนียกเลิกการเนรเทศวิลเฮลมที่ 2"
 wtt_germany.3.d: "เยอรมนีไดเชิญวิลเฮลมที่ 2 กลับสูปตุภูมิในฐานะไกเซอร ดวยเหตุการณอันวุนวายเมื่อไมนานมานี้ สิ่งนี้อาจชวยใหเยอรมนีสรางสันติภาพและเสถียรภาพแกชาติได แตสายตาของโลกกําลังจับจองเราอยู เพราะหลายคนยังไมลืมความขัดแยงอันนาสะพรึงที่ไกเซอรองคเกาเคยพาเราดิ่งลงไปเมื่อเพียงสองทศวรรษกอน"
 wtt_germany.3.a: "เราตองยอมใหพระองคกลับไปนําประชาชนของพระองค"
 wtt_germany.3.b: "เราตองหยุดพระองค - เราไมอาจเสี่ยงใหเกิดมหาสงครามอีกครั้ง"
 wtt_germany.4.t: "ไกเซอรเสด็จกลับเยอรมนี"
 wtt_germany.4.d: "ทามกลางการเฉลิมฉลองอยางปติยินดี วิลเฮลมที่ 2 ไดเสด็จกลับมาเปนไกเซอรแหงจักรวรรดิเยอรมัน! เราติดหนี้บุญคุณเนเธอรแลนดที่ใหที่ลี้ภัยอันปลอดภัยแกพระองคตลอดหลายทศวรรษที่ผานมา และปฏิเสธการสงตัวพระองคใหอดีตศัตรูของเราหลายครั้ง แมชาติจะทุกขยากอยางมากในสงครามกลางเมืองที่เพิ่งผานมา แตก็หวังวาการเสด็จกลับของไกเซอรจะนํามาซึ่งเสถียรภาพและเอกภาพยิ่งขึ้น"
 wtt_germany.4.a: "พระองคจะทรงนําชาติไดดีอยางไมตองสงสัย"
 wtt_germany.5.t: "เนเธอรแลนดขัดขวางการเสด็จกลับของไกเซอร"
 wtt_germany.5.d: "เนเธอรแลนดผูชั่วชา ที่เคยใหที่ลี้ภัยแกวิลเฮลมที่ 2 อยางมีเกียรติมาชานาน บัดนี้กลับขัดขวางไมใหไกเซอรขามพรมแดนไปยังเยอรมนี และคุมกันพระองคกลับไปยังที่ประทับ ฮาวสดอรน ชาวดัตชอางความกังวลตอเสถียรภาพของภาคพื้นทวีปเปนเหตุผลในการปฏิเสธไมใหไกเซอรกลับสูราชบัลลังกเยอรมัน"
 wtt_germany.5.a: "เราจะใหพวกเขามีเรื่องที่ตองกังวลเรงดวนกวานี้!"
 wtt_germany.5.b: "บางทีพวกเขาอาจมีเหตุผล... เรายังมีผูสมัครคนอื่น"
 wtt_germany.5_tt: "ไกเซอรองคเกาอาจชวยพระโอรสในการปกครองไดเปนอยางดี\n"
 wtt_germany.6.t: "วิลเฮลมที่ 2 ไดรับการปลดปลอย"
 wtt_germany.6.d: "หลังจากกวาดลางกองกําลังดัตชรอบฮาวสดอรนแลว กองกําลังของเราพบไกเซอรในสภาพพระพลานามัยแข็งแรง และนําพระองคกลับเยอรมนีดวยขบวนยานยนต วิลเฮลมที่ 2 เสด็จขามพรมแดนอยางผูมีชัยเมื่อไมกี่ชั่วโมงกอน และทรงรับหนาที่ไกเซอรแหงจักรวรรดิเยอรมันอยางสงางามเมื่อเสด็จถึงเบอรลิน"
 wtt_germany.6.a: "ไมมีใครหยุดเราได"
 GER_fascism_civil_war_tt: "ฝายสนับสนุนฟาสซิสตเริ่มสงครามกลางเมือง\n"
 wtt_germany.7.t: "การพึ่งพาเศรษฐกิจของ[From.GetName]อยางไรการควบคุม"
 wtt_germany.7.d: "ดวยการคอย ๆ ถลําลึกเขาสูเขตอิทธิพลของ[From.GetNameDef] เศรษฐกิจของเราจึงพึ่งพาเศรษฐกิจของพันธมิตรมากขึ้นเรื่อย ๆ เมื่อวันนี้เยอรมันเคลื่อนไหวเขาควบคุมเศรษฐกิจของเรามากขึ้นในที่สุด เราก็ไมมีกําลังจะหยุดยั้งได ผลก็คือการควบคุมนโยบายตางประเทศของเราโดยเยอรมันไดมาถึงระดับที่ไมเคยมีมากอน"
 wtt_germany.7.a: "เราตองจํายอมตอสถานการณ... ไปกอน"
 wtt_germany.8.t: "เยอรมนีเสนอสนับสนุนรัฐประหารฝายนิยมกษัตริย"
 wtt_germany.8.d: "[From.GetNameDefCap]ไดติดตอกลุมที่นิยมกษัตริยและตอตานฟาสซิสตในรัฐบาลอิตาลีและขบวนการใตดิน พรอมแผนลอบสังหารมุสโสลินีและสถาปนาวิตโตรีโอ เอมานูเอเลที่ 3 เปนผูนําชาติ เยอรมันใหคํามั่นวาจะจัดการการลอบสังหารเอง สิ่งที่เราตองทํามีเพียงยืนยันความพรอมที่จะตั้งรัฐบาลใหม และใหคํามั่นวาจะสนับสนุนการทหารแกภารกิจของเยอรมันในอนาคต"
 wtt_germany.8.a: "เราตองพึ่งพาสถาบันกษัตริยในเวลาขางหนา"
 wtt_germany.8.b: "ไรสาระ! เราจะไมมีวันละทิ้งแนวทางของเรา!"
 wtt_germany.9.t: "อิตาลียอมรับขอเสนอรัฐประหาร"
 wtt_germany.9.d: "กลุมตาง ๆ ในรัฐบาลอิตาลีและขบวนการใตดินยอมรับขอเสนอรัฐประหารของเราแลว พวกเขากําลังเตรียมยึดอํานาจถวายกษัตริยอยางรวดเร็วทันทีที่การลอบสังหารเกิดขึ้น"
 wtt_germany.9.a: "เราเริ่มดําเนินแผนไดแลว"
 wtt_germany.10.t: "อิตาลีปฏิเสธขอเสนอรัฐประหาร"
 wtt_germany.10.d: "กลุมในรัฐบาลอิตาลีและขบวนการใตดินที่เราติดตอไปไดบอกเราดวยถอยคําไมสูนุมนวลนักวาพวกเขาไมสนใจขอเสนอรัฐประหารของเรา และขูวาจะเปดโปงแผนของเราตอรัฐบาลอิตาลีหากเรากลาเสนอแบบเดิมอีก"
 wtt_germany.10.a: "นาเสียดายจริง"
 wtt_germany.11.t: "เยอรมนีลอบสังหารมุสโสลินี"
 wtt_germany.11.d: "แผนของเยอรมันถูกนํามาปฏิบัติ และมุสโสลินีถูกยิงในรถยนตกลางถนนในกรุงโรมเมื่อวันนี้ พระเจาวิตโตรีโอ เอมานูเอเลที่ 3 ทรงรับการบริหารชาติ และทรงใหคํามั่นวาจะเขารวมฝายมหาอํานาจกลางเคียงขาง[From.GetNameDef]"
 wtt_germany.11.a: "เราตองแสดงความขอบคุณ"
 wtt_germany.12.t: "การลอบสังหารมุสโสลินีสําเร็จ"
 wtt_germany.12.d: "แผนของเราดําเนินไปอยางไรที่ติ และวิตโตรีโอ เอมานูเอเลที่ 3 ไดทรงรับภาระการนําชาติ พระราชกรณียกิจแรกคือการลงพระนามในสนธิสัญญาที่รับรองการเขารวมพันธมิตรมหาอํานาจกลางของอิตาลี"
 wtt_germany.12.a: "ราชาธิปไตยจะผงาดขึ้นอีกครั้ง!"
 wtt_germany.13.t: "การรวมชาติออสเตรีย-ฮังการี"
 wtt_germany.13.d: "ดวยการสนับสนุนของเรา [From.GetOldName]ไดเปนผูนําในการรวมจักรวรรดิออสเตรีย-ฮังการีขึ้นใหม สนธิสัญญาระหวางฝายที่เกี่ยวของไดลงนามเมื่อเชานี้ ลบลางกระแสแบงแยกดินแดนที่มีมาสองทศวรรษ รัฐบาลที่รวมเปนหนึ่งเดียวชุดใหมใหคํามั่นสนับสนุนทางทหารแกเราทันที และเขาเปนสมาชิกฝายมหาอํานาจกลาง"
 wtt_germany.13.a: "พันธมิตรเกาของเรากลับมาอยูเคียงขางเราแลว"
 wtt_germany.14.t: "เยอรมนีเสนอรับประกันดินแดน"
 wtt_germany.14.d: "[From.GetNameDefCap]ไดติดตอเราพรอมขอเสนอที่พวกเขาบอกวาจะเปนประโยชนตอทั้งสองฝาย ดวยสถานการณการเมืองปจจุบันและภัยคุกคามที่พรมแดนตะวันออก เยอรมันเสนอจะใหการรับประกันวาจะชวยเหลือเราทางทหารหากเราเกิดสงครามกับ[SOV.GetNameDef] แลกกับการขอเพียงดินแดนที่พวกเขาเสียไป คือดานซิกและพอซนาน"
 wtt_germany.14.a: "กําลังทหารของพวกเขามีประโยชนตอเรามากกวาผืนดิน"
 wtt_germany.14.b: "เราจะไมมีวันยอมสละดินแดนของเรา!"
 wtt_germany.15.t: "โปแลนดยอมรับขอเสนอ"
 wtt_germany.15.d: "ชาวโปลตัดสินใจยอมรับขอเสนอของเรา และไดเตรียมการโอนจังหวัดชายแดนใหเรา พวกเขาฝากความเชื่อมั่นไวกับเรา และเรงเราใหเราเตรียมพรอมรับมือการรุกรานของ[SOV.GetAdjective].."
 wtt_germany.15.a: "ในที่สุดรอยดางแหงแวรซายก็ถูกลบลาง!"
 wtt_germany.16.t: "โปแลนดปฏิเสธขอเสนอ"
 wtt_germany.16.d: "ชาวโปลตัดสินใจปฏิเสธขอเสนอของเรา ดวยถอยคําอันหนักแนน พวกเขาแสดงชัดวาจะไมมีวันยอมสละดินแดนโดยสมัครใจ และยอมเผชิญศัตรูใดก็ตามเพียงลําพังเสียดีกวาหากนี่คือราคาของความชวยเหลือ"
 wtt_germany.16.a: "เราจะไมมีวันสละการอางสิทธิ์ของเรา!"
 wtt_germany.16.b: "บางทีเราคงตองทําใจยอมรับ"
 wtt_germany.17.t: "คอมมิวนิสตเยอรมันลี้ภัยมายังฝรั่งเศส"
 wtt_germany.17.d: "รัฐบาลเยอรมันปราบปรามลัทธิคอมมิวนิสตและเนรเทศพวกเขาออกนอกประเทศ ผลก็คือขณะนี้เรากําลังรับนักอุดมการณคอมมิวนิสตจํานวนมากที่หลั่งไหลมาจากเพื่อนบาน..."
 wtt_germany.17.a: "ขอเพียงอยาใหเรื่องนี้ทําใหประเทศไรเสถียรภาพมากเกินไป..."
 wtt_germany.17.b: "เพิ่มงบประมาณตํารวจและจํากัดอิทธิพลของพวกเขาตอการเมืองของเรา!"
 wtt_germany.18.t: "จับกุมผูนํานาซีไดแลว"
 wtt_germany.18.d: "ในที่สุดเราก็ปลดปลอยประเทศจากเงื้อมมือศัตรู และพลเมืองผูภักดีที่ลุกขึ้นสนับสนุนอุดมการณของเราก็ไดกลับบานเสียที ในฐานะชาติ เราสามารถเริ่มกระบวนการอันยาวนานและยากลําบากในการฟนฟูประเทศ สวนผูนําประเทศก็มีอิสระที่จะมองไปขางหนาวาอนาคตจะเปนเชนไร ประชาธิปไตย หรือการกลับสูราชาธิปไตยแบบเกา\n\nแตยังเหลืออีกเรื่องหนึ่งที่ตองจัดการ เมื่อสงครามกลางเมืองสิ้นสุด ทหารของเราจับกุมผูนํานาซีไดกลุมใหญ บัดนี้เหลือเพียงการตัดสินใจวาจะทําอยางไรกับสวนอันนารังเกียจนี้ของประวัติศาสตรที่เพิ่งผานมา"
 wtt_germany.18.a: "แขวนคอพวกมัน!"
 wtt_germany.18.b: "จําคุกตลอดชีวิต พวกเขาอาจมีประโยชนในอนาคต"
 wtt_germany.19.t: "[GER.GetName]ออกมาโจมตี[SOV.GetName]"
 wtt_germany.19.d: "วาทกรรมของเยอรมันที่โจมตีเราเมื่อไมนานมานี้ทําลายชื่อเสียงของเราในยุโรปมากขึ้นเรื่อย ๆ ขอกลาวหาใสรายเรื่อง 'การรุกราน' ที่เราถูกกลาวหา เริ่มทําใหเกิดความหวาดกลัวและความเขาใจผิดตอเจตนาของเรา"
 wtt_germany.19.a: "จัดการซอมรบขนาดใหญหลายครั้งเพื่อขมขวัญพวกมันทั้งหมด!"
 GER_soviet_military_exercises: "การซอมรบ"
 wtt_germany.19.b: "เราตองกอบกูชื่อเสียงและปรับความสัมพันธใหราบรื่น"
 GER_soviet_smoothes_relationships: "ความสัมพันธที่ราบรื่นขึ้น"
 wtt_germany.19.c: "พวกเขาคิดวาเราสนใจหรือวาพวกเขาพูดถึงเราอยางไร?"
 wtt_germany.20.t: "เยอรมนีกอตั้งพันธมิตรยุโรปกลาง"
 wtt_germany.20.d: "เยอรมันยังคงเดินหนารณรงคใสรายเรา และบัดนี้ไดประกาศกอตั้งพันธมิตรใหม แทบไมตองสงสัยเลยวามันมุงเปามาที่เรา และพวกเขาตั้งใจจะแทรกแซงเขตอิทธิพลของเรา"
 wtt_germany.20.a: "พวกมันอยาไดยางกรายเขามาในเขตอิทธิพลของเรา!"
 GER_soviet_reiterated_claims: "ยํ้าการอางสิทธิ์"
 wtt_germany.20.b: "เราตองไมใหขออางใด ๆ แกพวกเขาในการยกระดับความขัดแยง"
 wtt_germany.21.t: "เยอรมันเชิญรัฐบอลติก"
 wtt_germany.22.t: "เยอรมันเชิญโปแลนด"
 wtt_germany.23.t: "เยอรมันเชิญฟนแลนด"
 wtt_germany.21.d: "เยอรมันไดเสนอสมาชิกภาพแกชาติที่อยูในเขตอิทธิพลโดยตรงของเรา ภัยคุกคามตอมาตุภูมิชัดเจนแลว!"
 wtt_germany.21.a: "เราตองโจมตีเพื่อยึดสวนที่เหลือไวใหได!"
 GER_soviet_securing_sphere: "รักษาเขตอิทธิพล"
 wtt_germany.21.b: "เราไมอาจเปนปฏิปกษกับตะวันตกได"
 wtt_germany.24.t: "มหันตภัย[GER.GetGreatRedMenaceName]"
 wtt_germany.24.d: "ทั้งผานชองทางทางการและไมเปนทางการ เยอรมันไดแสดงใหเห็นชัดวา[GER.GetGreatRedMenaceEventDesc1] พวกเขาเรงเราใหเราระลึกวาเราไมไดเผชิญ[GER.GetGreatRedMenaceEventDesc2]อยูเพียงลําพัง และหากภาคพื้นทวีปรวมใจกันได เราก็จะลมหมีลงได"
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_COMMUNIST: "[SOV.GetNameDef]เปนภัยคุกคามที่ใหญที่สุดตอเสถียรภาพของยุโรปมาโดยตลอดนับตั้งแตกอตั้งเมื่อสองทศวรรษกอน"
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_EXILES: "จักรวรรดินิยม[SOV.GetAdjective]เปนภัยคุกคามสําคัญตอเสถียรภาพของยุโรปมาโดยตลอดในประวัติศาสตรยุคใกล"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_COMMUNIST: "ภัยคุกคามจากลัทธิคอมมิวนิสต"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_EXILES: "ภัยคุกคามจากตะวันออกนี้"
 wtt_germany.24.a: "หวังวาพวกเขาจะพูดถูก"
 wtt_germany.24.b: "อยาไดไวใจพวก[GER.GetAdjective]!"
 wtt_germany.25.t: "สหภาพโซเวียตปรับความสัมพันธใหราบรื่น"
 wtt_germany.25.d: "สหภาพโซเวียตไดพยายามอยางจริงจังที่จะคลายความกังวลของชาติยุโรป ดวยการประกาศตอสาธารณะวาพวกเขาไมมีเจตนาเปนปฏิปกษ และหวังวาการตอบโตอยางอดกลั้นตอวาทกรรมกาวราวของเยอรมันจะเปนเครื่องพิสูจน"
 wtt_germany.25.a: "ตองรอดูกันตอไป"
 wtt_germany.26.t: "วิลเฮลมที่ 2 สวรรคต"
 wtt_germany.26.d: "เมื่อคืนนี้ วิลเฮลมที่ 2 ไกเซอรอันเปนที่รักของเรา ไดสวรรคตอยางสงบในขณะบรรทม แมจะตองลี้ภัยอยูนาน แตโชคชะตาก็เมตตาใหพระองคไดเสด็จกลับสูปตุภูมิกอนสวรรคตเปนเวลานาน และนับแตเสด็จกลับ พระองคก็ทรงนําชาติของเราไดเปนอยางดี บัดนี้พระโอรส ฟรีดริช วิลเฮลม ไดทรงรับการบริหารชาติ และหลังพิธีราชาภิเษกจะทรงพระนามวาวิลเฮลมที่ 3"
 wtt_germany.26.a: "ไกเซอรจงเจริญ!"
 wtt_germany.27.t: "เอากุสท ฟอน มัคเคนเซิน ถึงแกอสัญกรรม"
 wtt_germany.27.d: "เมื่อคืนนี้ เอากุสท ฟอน มัคเคนเซิน จอมพลผูไดรับความเคารพสูงสุดของเรา ไดถึงแกอสัญกรรมอยางสงบในขณะหลับ วีรกรรมอันเลื่องชื่อของเขาในมหาสงครามและในการขับไลผูกดขี่ฟาสซิสตออกจากมาตุภูมิจะเปนที่จดจําไปอีกนาน พระโอรสของไกเซอรผูลี้ภัย ฟรีดริช วิลเฮลม ไดเขามาเติมเต็มสุญญากาศทางอํานาจของชาติ และหลังพิธีราชาภิเษกจะทรงพระนามวาวิลเฮลมที่ 3 ทรงปกครองจักรวรรดิในฐานะไกเซอรองคแรกนับตั้งแตพระราชบิดาสละราชสมบัติในป 1918"
 wtt_germany.28.t: "เยอรมนียกเลิกการเนรเทศวิลเฮลมที่ 2"
 wtt_germany.28.d: "จักรวรรดิเยอรมันไดยกเลิกการเนรเทศวิลเฮลมที่ 2 และไดติดตอเนเธอรแลนดเพื่อขอใหสงไกเซอรองคเกากลับ ดูเหมือนวาแมจะมีการยื่นคํารองขอสงตัวผูรายขามแดนตอรัฐบาลดัตชหลายครั้งเพื่อใหพระองครับผิดชอบตอการกอมหาสงคราม แตผูกระหายสงครามรายนี้ก็จะกลับมากุมบังเหียนจักรวรรดิเยอรมัน"
 wtt_germany.28.d.2: "จักรวรรดิเยอรมันไดยกเลิกการเนรเทศวิลเฮลมที่ 2 และไดติดตอเนเธอรแลนดเพื่อขอใหสงไกเซอรองคเกากลับ เมื่อดัตชปฏิเสธไมยอมใหพระองคกลับ พวกเขาก็ไดยกระดับเรื่องนี้เปนความขัดแยงทางทหาร!"
 germany.60.c: "พวกเขาจะไมตองสูเพียงลําพัง! ปลุกระดมชาวอังกฤษเขาสูสงคราม!"
 wtt_germany.29.d: "จักรวรรดิเยอรมันไดยกเลิกการเนรเทศวิลเฮลมที่ 2 และไดติดตอเนเธอรแลนดเพื่อขอใหสงไกเซอรองคเกากลับ ดูเหมือนวาแมจะมีการยื่นคํารองขอสงตัวผูรายขามแดนตอรัฐบาลดัตชหลายครั้งเพื่อใหพระองครับผิดชอบตอการกอมหาสงคราม แตผูกระหายสงครามรายนี้ก็จะกลับมากุมบังเหียนจักรวรรดิเยอรมัน\n\nฝรั่งเศสไดตัดสินแลววาเรื่องนี้ยอมรับไมได และดูเหมือนตั้งใจจะยื่นคําขาดที่มีกําลังทหารหนุนหลัง มติมหาชนในอังกฤษไมเห็นดวยกับสงคราม แตหากเราปฏิเสธที่จะยืนเคียงขางฝรั่งเศส พันธมิตรของเรากับพวกเขาจะถูกยุบ"
 wtt_germany.29.d.2: "จักรวรรดิเยอรมันไดยกเลิกการเนรเทศวิลเฮลมที่ 2 และไดติดตอเนเธอรแลนดเพื่อขอใหสงไกเซอรองคเกากลับ เมื่อดัตชปฏิเสธไมยอมใหพระองคกลับ พวกเขาก็ไดยกระดับเรื่องนี้เปนความขัดแยงทางทหาร!\n\nฝรั่งเศสไดตัดสินแลววาเรื่องนี้ยอมรับไมได และดูเหมือนตั้งใจจะยื่นคําขาดที่มีกําลังทหารหนุนหลัง มติมหาชนในอังกฤษไมเห็นดวยกับสงคราม แตหากเราปฏิเสธที่จะยืนเคียงขางฝรั่งเศส พันธมิตรของเรากับพวกเขาจะถูกยุบ"
 germany.61.c: "เราตองไปชวยดัตช!"
 wtt_germany.30.d: "จักรวรรดิเยอรมันไดยกเลิกการเนรเทศวิลเฮลมที่ 2 และไดติดตอเนเธอรแลนดเพื่อขอใหสงไกเซอรองคเกากลับ ดูเหมือนวาแมจะมีการยื่นคํารองขอสงตัวผูรายขามแดนตอรัฐบาลดัตชหลายครั้งเพื่อใหพระองครับผิดชอบตอการกอมหาสงคราม แตผูกระหายสงครามรายนี้ก็จะกลับมากุมบังเหียนจักรวรรดิเยอรมัน\n\nฝรั่งเศสดูเหมือนพอใจที่จะตอบโตเรื่องอุกอาจนี้เพียงดวยการคัดคานทางการทูต และมติมหาชนในอังกฤษก็ตอตานสงครามอยางแข็งขัน"
 wtt_germany.31.d: "อังกฤษปฏิเสธที่จะสนับสนุนเราในการตอตานเยอรมนี โดยอางวาเรื่องสถาบันกษัตริยเยอรมันเปนเรื่องภายใน หากเราทําสงครามกับเยอรมัน ดูเหมือนเราจะตองสูเพียงลําพัง\n\nมติมหาชนในฝรั่งเศสไมเห็นดวยกับสงคราม แตเยอรมนีจะยิ่งแข็งแกรงขึ้น และการเสด็จกลับของไกเซอรอาจปลุกกระแสจักรวรรดินิยมขึ้นอีกครั้ง การยื่นคําขาดจะดูไมนาเกรงขามนักหากไมมีอังกฤษอยูขางเรา เราควรเดินหนาตอตานพวกเขาเพียงลําพังหรือไม?"
 wtt_germany.32.d: "แมในอังกฤษจะขาดแรงสนับสนุนจากมหาชนตอสงคราม แตรัฐบาลอังกฤษก็ตระหนักถึงภัยคุกคามจากเยอรมันและเสนอใหการสนับสนุนเราอยางเต็มที่ เราจะยื่นคําขาดครั้งสุดทายตอเยอรมนีเพื่อปองกันไมใหไกเซอรผูกระหายสงครามกลับมา หากพวกเขาปฏิเสธ ก็ถึงเวลาที่กองกําลังของเราจะบุกลึกเขาไปในเยอรมนีและยุติระบอบทรราชของพวกเขา!"
 wtt_germany.33.d: "อังกฤษและฝรั่งเศสปฏิเสธที่จะยอมรับการเสด็จกลับของไกเซอรของเรา โดยเรียกวาเปน 'เรื่องอุกอาจ' ที่ผูที่ถูกกลาวหาวากอมหาสงครามไดรับอนุญาตใหกลับสูราชบัลลังก พวกเขากําลังระดมกําลังตอตานเรา และยื่นคําขาดใหกองกําลังของเราถอยทันทีและสงไกเซอรกลับไปลี้ภัย มิฉะนั้นชาติของเราจะอยูในภาวะสงคราม"
 wtt_germany.33.a: "เราถอยไมได! ไกเซอรจงเจริญ!"
 wtt_germany.34.d: "อังกฤษใชเหตุผลและยอมรับการเสด็จกลับของไกเซอรแลว แตฝรั่งเศสผูบาคลั่งกลับไมยอมถอย! โดยอางวาเหตุการณนี้เปนภัยคุกคามโดยตรงตอความมั่นคงของชาติตน พวกเขากําลังระดมกําลังและอาจบุกขามพรมแดนมาไดทุกเมื่อ! เราอยูในภาวะสงครามแลว!"
 wtt_germany.35.d: "แมเราจะชี้แจงแลววาการกลับสูราชบัลลังกเยอรมันของวิลเฮลมที่ 2 จะถือเปนการประกาศสงคราม แตเยอรมนีก็ไมยอมถอยและไมสงไกเซอรกลับไปลี้ภัย โดยเพิกเฉยตอคําเตือนของเรา นั่นหมายความวาแมเราจะพยายามอยางดีที่สุดเพื่อรักษาสันติภาพ สงครามก็ไดปะทุขึ้นในยุโรปอีกครั้ง"
 wtt_germany.38.t: "ชาว[FROM.GetAdjective]เรียกรองใหคืนชิงเตา"
 wtt_germany.38.desc: "ชวงหลังมานี้[FROM.GetNameDefCap]พนวาทกรรมเรียกรองใหกลับสูลัทธิอาณานิคมมากขึ้นเรื่อย ๆ บัดนี้พวกเขาไดยื่นคําขอผานชองทางการทูตอยางเปนทางการใหเริ่มสัญญาเชาดินแดนเดิมของพวกเขาในชิงเตาอีกครั้ง ดวยหวังจะกอบกูจักรวรรดิที่สูญเสียไปนาน แมนี่อาจเปนสนธิสัญญาไมเปนธรรมอีกฉบับในยุคแหงความอัปยศของเรา แตบางทีเราอาจใชเรื่องนี้หาขอตกลงที่ใหผลประโยชนงดงามได..."
 wtt_germany.38.a: "เรียกรองใหฟอน ฟลเคินเฮาเซินสนับสนุนเราตอไปเปนการตอบแทน"
 wtt_germany.38.b: "บางทีการมีพวกเขาอยูในพื้นที่อาจเปนประโยชน"
 wtt_germany.38.c: "เราจะไมมีวันยอมสละดินแดนอธิปไตยของเราอีก!"
 wtt_germany.39.t: "จีนเสนอแลกเปลี่ยนชิงเตา"
 wtt_germany.39.desc: "เจาหนาที่จีนไดติดตอเราพรอมขอเสนอแลกเปลี่ยน ซึ่งพวกเขาบอกวาจะเปนที่พอใจของทั้งสองฝาย พวกเขาเสนอคืนชิงเตาสูมือเยอรมันผูเปนเจาของโดยชอบ แลกกับการรับประกันวาเราจะไมเรียกคณะผูแทนของฟอน ฟลเคินเฮาเซินกลับ"
 wtt_germany.39.a: "เราตกลงได"
 wtt_germany.39.b: "ไม เราตองเปดทางเลือกไว"
 wtt_germany.40.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองชิงเตา"
 wtt_germany.40.desc: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองใหคืนชิงเตาของเราอยางสิ้นเชิง เราไมมีทางเลือกนอกจากตองหาทางเอาคืนในภายหลัง"
 wtt_germany.40.a: "เราอดทนรอได"
 wtt_germany.41.t: "เยอรมนียอมรับการแลกเปลี่ยนชิงเตา"
 wtt_germany.41.desc: "จักรวรรดิเยอรมันยอมรับขอเสนอแลกเปลี่ยนชิงเตาของเราแลว และรับประกันวาฟอน ฟลเคินเฮาเซินจะสนับสนุนเราตอไป"
 wtt_germany.42.t: "เยอรมนีปฏิเสธการแลกเปลี่ยนชิงเตา"
 wtt_germany.42.desc: "จักรวรรดิเยอรมันปฏิเสธขอเสนอแลกเปลี่ยนชิงเตาของเรา คงไมไดอยากไดดินแดนนั้นคืนมากนัก"
 wtt_germany.43.t: "เยอรมันเรียกรองใหคืนชิงเตา"
 wtt_germany.43.desc: "ชวงหลังมานี้จักรวรรดิเยอรมันพนวาทกรรมเรียกรองใหกลับสูลัทธิอาณานิคมมากขึ้นเรื่อย ๆ แมพวกเขาจะเสียชิงเตาไปเพราะเรายึดมาในป 1914 แตบัดนี้เยอรมันตัดสินใจเปดการเจรจาทางการทูต ขอใหคืนดินแดนเดิมของพวกเขาในชิงเตา บางทีเราอาจใชเรื่องนี้หาขอตกลงที่ใหผลประโยชนงดงามได..."
 wtt_germany.43.a: "เรียกรองใหเยอรมันถอนฟอน ฟลเคินเฮาเซินออกไปเปนการตอบแทน"
 wtt_germany.43.b: "พวกมันจะไมมีวันไดยางเทาเขาสูตะวันออกไกลอีก!"
 wtt_germany.44.t: "ญี่ปุนเสนอแลกเปลี่ยนชิงเตา"
 wtt_germany.44.desc: "เจาหนาที่ญี่ปุนไดติดตอเราพรอมขอเสนอแลกเปลี่ยน ซึ่งพวกเขาบอกวาจะเปนที่พอใจของทั้งสองฝาย พวกเขาเสนอคืนชิงเตาสูมือเยอรมันผูเปนเจาของโดยชอบ แลกกับการถอนคณะผูแทนของฟอน ฟลเคินเฮาเซินออกจากจีนทันที"
 wtt_germany.46.desc: "จักรวรรดิเยอรมันยอมรับขอเสนอแลกเปลี่ยนชิงเตาของเราแลว และไดถอนคณะผูแทนของฟอน ฟลเคินเฮาเซินออกจากจีนทันที"
 wtt_germany.48.t: "[From.GetNameDefCap]ยอมรับขอเรียกรอง"
 wtt_germany.48.desc: "[From.GetNameDefCap]ยอมรับขอเรียกรองของเรา และจัดการคืนชิงเตาสูมือเยอรมันทันที!"
 wtt_germany.49.t: "การขับไลนาซีสรางความเสียหายหนักแก [nazi_state_withdrawn.GetName]"
 wtt_germany.49.desc: "ในที่สุดเราก็ยึดครอง [nazi_state_withdrawn.GetName] ได แตการสูรบรุนแรงยิ่งนัก พวกนาซียิ่งคลั่งและสิ้นหวังมากขึ้นทุกทีที่เรารุกคืบ มักสูจนพื้นที่โดยรอบพังพินาศ ยังมีรายงานถึงยุทธวิธีผลาญภพตาม 'คําสั่งเนโร' ของฮิตเลอรดวย\n\nเราคาดไดเลยวาการทําลายลางในระดับนี้จะเกิดขึ้นอีกจนกวาเราจะยุติสงครามนี้"
 wtt_germany.49.a: "ราคาเพียงเล็กนอยเพื่อขจัดพวกมันออกจากปตุภูมิ"
 wtt_germany.50.t: "พบฮิตเลอรเสียชีวิต"
 wtt_germany.50.desc: "เมื่อยึดเบอรลินได ทหารของเราพบศพของฮิตเลอรในบังเกอรแหงหนึ่งในเมือง ผูนําผูนี้เลือกความตายแทนที่จะเห็นฝายตอตานฟาสซิสตยึดประเทศ จึงเห็นไดชัดวาเขาปลิดชีพตนเองแทนที่จะเสี่ยงถูกจับ\n\nบัดนี้ไฮนริช ฮิมมเลอรไดกาวขึ้นนําพวกนาซีแทน และยืนยันแลววารัฐบาลจะไมลดละการตอสูกับ 'การทรยศตอเยอรมนี'"
 wtt_germany.50.a: "นี่คือจุดเริ่มตนแหงจุดจบของพวกนาซี"
 wtt_germany.51.t: "คืนตําแหนงใหผูนํานาซีที่ถูกจับกุม?"
 wtt_germany.51.desc: "สงครามยืดเยื้อและทําลายลางจนบัดนี้ชาวเยอรมันวัยผูใหญทุกคนถูกเรียกตัวไปรับใช แมจะไมเขากับมุมมองทางอุดมการณของเรา แตผูนํานาซีที่ถูกจับกุมก็มีทักษะที่อาจเปนประโยชนตอเราในยามจําเปนนี้\n\nเราอาจเสนอใหพวกเขาไดอิสรภาพคืนหลังสงคราม แลกกับการใหพวกเขาใชทักษะชวยอุดมการณของเราในตอนนี้"
 wtt_germany.51.a: "ใช คืนตําแหนงใหผูนํานาซีบางสวน"
 reinstate_nazi_leadership_TT: "ที่ปรึกษาเฉพาะฝายฟาสซิสตกลับมามีสิทธิ์รับราชการไดอีกครั้ง\n"
 wtt_germany.51.b: "ไม ใหพวกเขาอยูที่เดิมนั่นแหละ"
 wtt_germany.51.c: "เราไมอาจปลอยใหพวกมันไดอิสรภาพคืนหากสงครามไปไดไมดี... แขวนคอพวกมัน!"
 wtt_germany.52.t: "สงครามกลางเมืองฝายประชาธิปไตยใน [From.From.GetName]"
 wtt_germany.52.desc: "กลุมประชาธิปไตยใน [From.From.GetName] ไดกอสงครามกลางเมืองเพื่อฟนฟูการเลือกตั้งเสรีและคืนอํานาจใหประชาชน พวกเขาอาจตองการความชวยเหลือจากเรา และความสําเร็จของพวกเขาจะทําใหเรามีพันธมิตรในอนาคต"
 wtt_germany.52.a: "เราจะยืนหยัดเคียงขางประชาธิปไตย!"
 wtt_germany.52.b: "พวกเขาตองแกปญหาของตนเอง"
 wtt_germany.53.t: "กระแสนิยมเยอรมันในออสเตรียพุงสูง"
 wtt_germany.53.desc: "กระแสนิยมเยอรมันในออสเตรีย เพื่อนบานทางใตของเรา เพิ่มขึ้นอยางนาทึ่งหลังจากเราเปนพันธมิตรกันมาระยะหนึ่ง ไมใชเรื่องเกินความเปนไปไดที่การลงประชามติเรียกรองใหรวมกับเยอรมนีจะไดรับความเห็นชอบจากชาวออสเตรีย เราควรเรงเราใหรัฐบาลออสเตรียจัดลงประชามติหรือไม?"
 wtt_germany.53.a: "ใช แนวทางเยอรมันนอยเปนความผิดพลาด"
 wtt_germany.53.b: "ไม แนวทางมหาเยอรมันจะเปนความผิดพลาด"
 wtt_germany.54.t: "รัฐบาลเยอรมันเรงเราใหลงประชามติรวมชาติ"
 wtt_germany.54.desc: "รัฐบาลเยอรมันไดติดตอเราพรอมขอเสนอใหรวมชาติ หากชาวออสเตรียปรารถนา พวกเขาเรงเราใหเราจัดลงประชามติเพื่อหาคําตอบ"
 wtt_germany.54.a: "รณรงคสนับสนุนการรวมชาติ"
 wtt_germany.54.b: "รณรงคคัดคานการรวมชาติ"
 wtt_germany.55.t: "ชาวออสเตรียลงมติสนับสนุนการรวมชาติ"
 wtt_germany.55.desc: "ชาวออสเตรียลงมติสนับสนุนการรวมกับพี่นองทางเหนือ การผนวกรวมรัฐออสเตรียและกองทัพของพวกเขาจะเริ่มขึ้นทันที"
 wtt_germany.55.a: "วันอันยิ่งใหญสําหรับปญหาเยอรมัน!"
 wtt_germany.56.t: "ดินแดนเยอรมัน"
 wtt_germany.56.desc: "สงครามกับสหภาพโซเวียตของเราดําเนินไปไมดีนัก และเราเสี่ยงที่จะสูญเสียทุกสิ่ง ทางตะวันตกของเรา เยอรมนีเปลี่ยนแปลงอยางรวดเร็วในไมกี่ปที่ผานมา แตบัดนี้เปนผูพิทักษคุณคาประชาธิปไตยอยางแข็งขัน การจัดการคืนดินแดนเยอรมันเดิมอยางดานซิกและพอซนานอยางรวดเร็วจะชวยผูคนนับลานใหรอดพนจากการกดขี่ใตรองเทาบูทโซเวียตไดอยางแนนอน"
 wtt_germany.56.a: "ยกใหเยอรมนียังดีกวาโซเวียต!"
 wtt_germany.56.b: "ไมมีวัน! สิ่งใดเปนของโปแลนด ตองเปนของโปแลนด!"
 wtt_germany.57.t: "โปแลนดเสนอคืนดินแดนเยอรมัน"
 wtt_germany.57.desc: "เมื่อสงครามระหวางโปแลนดกับสหภาพโซเวียตไปไดไมดี รัฐบาลของพวกเขาจึงติดตอเราผานชองทางลับ เสนอคืนดินแดนเกาของเราอยางดานซิกและพอซนานอยางรวดเร็ว พวกเขาใหเหตุผลวาประชาชนของพวกเขายอมอยูดีกวาภายใตการปกครองประชาธิปไตยของเยอรมัน มากกวาใตรองเทาบูทอันกดขี่ของโซเวียต"
 wtt_germany.57.a: "ชางเจาเลหนัก! เราจะคุมครองพวกเขาใหปลอดภัย"
 wtt_germany.57.b: "ไม เราเสี่ยงตอการตอบโตของโซเวียตไมได"
 wtt_germany.58.t: "ประชาชนออสเตรียปฏิเสธการรวมชาติ"
 wtt_germany.58.desc: "ประชาชนออสเตรียปฏิเสธการเรียกรองใหรวมชาติของเรา โดยเลือกที่จะรักษาเอกราชของออสเตรียตอไปอยางนอยอีกสักระยะหนึ่ง"
 wtt_germany.58.a: "เราตองเคารพความปรารถนาของพวกเขา"
 wtt_germany.59.t: "เยอรมนียอมรับดานซิกและพอซนาน"
 wtt_germany.59.desc: "รัฐบาลเยอรมนีตัดสินใจรับดินแดนเดิมของตนกลับคืน และไดใหคํามั่นอยางเครงขรึมวาจะปกปองพลเมืองชาวโปแลนดในภูมิภาคนี้"
 wtt_germany.59.a: "อยางนอยพวกเขาก็จะปลอดภัย"
 wtt_germany.60.t: "เยอรมนีปฏิเสธดานซิกและพอซนาน"
 wtt_germany.60.desc: "รัฐบาลเยอรมนีแจงเราวาไมสามารถรับขอเสนอของเราได พวกเขาเกรงการตอบโตจากโซเวียต จึงรูสึกวาไมอาจเสี่ยงได"
 wtt_germany.60.a: "ใครจะชวยพวกเขาเมื่อทุกคนตกอยูใตเงื้อมมือพวกแดงไปหมดแลว?"
 wtt_germany.62.t: "บริษัทตาง ๆ เรียกรองการชําระเงินตั๋ว MEFO"
 wtt_germany.62.desc: "เมื่อสงครามครั้งลาสุดสิ้นสุดลง บริษัทที่เราออกตั๋ว MEFO ใหตางกดดันใหเราชําระเงิน พวกเขาอางวาไมมีความจําเปนตองระงับการชําระเงิน 'เพื่อประโยชนของมาตุภูมิ' อีกตอไปแลว"
 wtt_germany.62.a: "ก็ได"
 wtt_germany.63.t: "[GER.GetName] ผนวกอาลซัส-ลอรแรนกลับคืน"
 wtt_germany.63.desc: "รัฐบาล[GER.GetAdjective]ไดออกกฎหมายกําหนดใหผนวกอาลซัส-ลอรแรนและลักเซมเบิรกกลับเขาเปนสวนหนึ่งของ [GER.GetName] การเกณฑทหารจากประชากรของเราครั้งใหญไดเริ่มขึ้นแลว..."
 wtt_germany.63.a: "ไอพวกสารเลว! เรื่องนี้ยังไมจบ!"
 wtt_germany.64.t: "[GER.GetName] ผนวกลักเซมเบิรกกลับคืน"
 wtt_germany.64.a: "เราจะทําอะไรได?"
 wtt_germany.65.t: "[From.GetName] ขอใหเขารวมสงคราม"
 wtt_germany.65.desc: "[From.GetNameDefCap] แจงเราวาพวกเขาตองการใชดินแดนของเราเพื่อเคลื่อนกําลังไปยังศัตรูโซเวียต พวกเขายํ้าเตือนวาเราอยูภายใตการคุมครองของพวกเขาจากพวกคอมมิวนิสต ดังนั้นเราจึงติดคางความชวยเหลือแกพวกเขาในสงครามครั้งนี้"
 wtt_germany.65.a: "พวกเขาพูดถูก - เราจะเขารวมสงครามของพวกเขา"
 wtt_germany.65.b: "คิดวาตัวเองเปนใคร?! ไมมีวัน!"
 wtt_germany.66.t: "[From.GetName] ยอมรับขอเรียกรอง"
 wtt_germany.66.desc: "[From.GetNameDefCap] ตัดสินใจเขารวมกับเราในสงครามตอตาน [SOV.GetNameDef] ซึ่งยังมีประโยชนเพิ่มเติมคือกองกําลังของเราสามารถผานประเทศของพวกเขาได"
 wtt_germany.67.t: "[From.GetName] ปฏิเสธขอเรียกรอง"
 wtt_germany.67.desc: "[From.GetNameDefCap] ปดตกขอเรียกรองใหเขารวมสงครามของเรา และยังคงปดพรมแดนไมใหกองทหารของเราผาน หากชาวโปแลนดไมยินยอมใหกองกําลังของเราผานแดน เราก็จําเปนตองบุกผานพวกเขาไปเสียเลย"
 wtt_germany.67.a: "พวกเขาหาเรื่องใสตัวเอง"
 wtt_germany.68.t: "[From.GetName] เสนอการรวมจักรวรรดิกลับคืน"
 wtt_germany.68.desc: "รัฐบาล[From.GetAdjective]ไดติดตอเราพรอมขอเสนอใหรวมจักรวรรดิออสเตรีย-ฮังการีเดิมกลับคืน เนื่องจากกระแสนิยมจักรวรรดิในประเทศของทั้งสองฝายคอนขางสูง พวกเขาจึงอางวาการรวมชาติของเราเขาดวยกันจะเปนประโยชนสูงสุดตอทุกฝาย"
 wtt_germany.68.a: "ความคิดที่ยอดเยี่ยม! เราจะยอมรับ"
 wtt_germany.68.b: "เขารวมกับพวกเขาโดยสมัครใจหรือ? ไมมีวัน!"
 wtt_germany.69.t: "[From.GetName] ยอมรับการรวมชาติ"
 wtt_germany.69.desc: "รัฐบาล[From.GetAdjective]ไดตอบรับขอเสนอของเราเรื่องการรวมจักรวรรดิออสเตรีย-ฮังการีเดิมกลับคืน พวกเขายอมรับถึงประโยชนของการเคลื่อนไหวครั้งนี้ และแถลงวายินดีรวมประเทศของตนเขากับของเรา หากทุกฝายยอมรับ"
 wtt_germany.70.t: "[From.GetName] ปฏิเสธการรวมชาติ"
 wtt_germany.70.desc: "รัฐบาล[From.GetAdjective]ไดตอบกลับขอเสนอของเราเรื่องการรวมจักรวรรดิออสเตรีย-ฮังการีเดิมกลับคืน พวกเขาแสดงออกอยางชัดแจงวาจะไมมีวันยอมรับการนําของเราในการดําเนินการเชนนี้โดยสมัครใจ"
 wtt_germany.71.t: "การฟนฟูจักรวรรดิออสเตรีย-ฮังการี"
 wtt_germany.71.desc: "รัฐผูสืบทอดออสเตรีย-ฮังการีที่เปนเพื่อนบานของเราทั้งสองไดยอมรับขอเสนอใหรวมดินแดนของตนเขากับประเทศของเรา และฟนฟูขึ้นเปนจักรวรรดิออสเตรีย-ฮังการีอีกครั้ง การลงนามในสนธิสัญญารวมชาติไดรับการตอนรับจากฝูงชนที่ปลาบปลื้มยินดีบนทองถนน และรัฐบาล[GER.GetAdjective]ก็ไดตอนรับเรากลับสูพันธมิตรของพวกเขาอยางกระตือรือรน"
 wtt_germany.71.a: "รุงอรุณแหงยุคใหมของออสเตรีย-ฮังการี"
 wtt_germany.72.t: "[From.GetName] เสนอการรวมเศรษฐกิจ"
 wtt_germany.72.desc: "เนื่องจากเราเปนพันธมิตรใกลชิดกันอยูแลว [From.GetNameDef] จึงยื่นขอเสนอชวยเหลือเราในการขยายเศรษฐกิจการทหาร โดยการรวมเศรษฐกิจของเราเขาดวยกันอยางเต็มที่ยิ่งขึ้น สิ่งนี้จะชวยการเติบโตทางทหารของเราไดอยางมาก แตก็จะทําใหเราตองอยูใตอํานาจพวกเขาในเรื่องนโยบายตางประเทศดวย"
 wtt_germany.72.a: "ความคิดที่ยอดเยี่ยม - ชะตากรรมของเราผูกพันกันอยูแลว"
 wtt_germany.72_tt: "§Rเราจะสูญเสียการควบคุมรัฐในอารักขาทั้งหมดที่เรามีอยู§!\n"
 wtt_germany.72.b: "เราไมคิดเชนนั้น อธิปไตยของเรามีคาเกินไป"
 wtt_germany.73.t: "[From.GetName] ยอมรับการรวมเศรษฐกิจ"
 wtt_germany.73.desc: "รัฐบาล[From.GetAdjective]แจงเราวายอมรับขอเสนอใหรวมเศรษฐกิจสงครามของเราเขาดวยกัน พวกเขารอคอยคําชี้แนะจากเราอยางกระตือรือรน เพื่อที่จะไดจัดกองทัพของตนตามแบบอยางความสําเร็จของเรา"
 wtt_germany.73.a: "ภายใตการชี้นําของเรา กองทัพของพวกเขาจะเติบใหญ"
 wtt_germany.74.t: "[From.GetName] ปฏิเสธการรวมเศรษฐกิจ"
 wtt_germany.74.desc: "รัฐบาล[From.GetAdjective]แจงเราวาปฏิเสธขอเสนอใหรวมเศรษฐกิจสงครามของเราเขาดวยกัน พวกเขาใหคุณคากับอธิปไตยมากกวาประโยชนของกองทัพตน..."
 wtt_germany.74.a: "พวกเขาปฏิเสธความยิ่งใหญโดยแท!"
 wtt_germany.999.t: "[From.GetLeader] ขอใหคืนฐานันดรศักดิ์ราชวงศ"
 wtt_germany.999.desc: "ในนามของไกเซอร [From.GetLeader] รัฐบาล[From.GetAdjective]ไดรองขอใหเรายกเลิกการเพิกถอนบรรดาศักดิ์ขุนนางและฐานันดรศักดิ์ราชวงศอังกฤษจากราชวงศและตระกูลเจาชายเยอรมัน ซึ่งกระทําตามพระราชบัญญัติเพิกถอนบรรดาศักดิ์ ค.ศ. 1917 พวกเขาใหเหตุผลวาการนี้จะแสดงใหโลกเห็นวาราชวงศและตระกูลเจาชายของอังกฤษและเยอรมนีไดกลับมามีสัมพันธไมตรีอันดีเชนกอนสงครามแลว และจะเปนสัญลักษณแหงมิตรภาพอังกฤษ-เยอรมนีในอนาคต"
 wtt_germany.999.a: "ความคิดที่ยอดเยี่ยม!"
 wtt_germany.999.b: "เราไมคิดเชนนั้น"
 wtt_germany.1000.t: "รัฐบาล[From.GetAdjective]ยอมรับคํารองขอ"
 wtt_germany.1000.desc: "รัฐบาล[From.GetAdjective]ตัดสินใจสนับสนุนคํารองขอของเราใหคืนบรรดาศักดิ์ขุนนางและฐานันดรศักดิ์ราชวงศอังกฤษแกราชวงศและตระกูลเจาชายเยอรมัน พวกเขาเสนอใหจัด 'พระราชพิธีแหงศตวรรษ' อยางยิ่งใหญ โดยเชิญเชื้อพระวงศเยอรมันทั้งหมดมารับฐานันดรศักดิ์ที่ถูกริบไปอยางไมเปนธรรมเมื่อสองทศวรรษกอนคืนดวยพระองคเอง\n\nที่ปรึกษาราชสํานักเสนอใหพระราชวงศทั้งหมดเสด็จมาอยางยิ่งใหญดวยสุดยอดเทคโนโลยีของเยอรมนี เรือเหาะฮินเดนบูรกอันลํ้าสมัยยอมเหมาะสมกับโอกาสนี้อยางยิ่ง"
 wtt_germany.1000.a: "ความคิดที่ยอดเยี่ยม! เราจะสงผูประสานงานไป"
 wtt_germany.1000.a_tt: "เจาหญิงวิกตอเรีย ลูอีเซอไดรับมอบหมายใหเสด็จลวงหนาไปชวยเตรียมพระราชพิธีอันยิ่งใหญนี้ ซึ่งจะสิ้นเปลืองทรัพยากรของรัฐบาลเราอยูบาง หวังวาพระราชวงศที่เหลือจะเสด็จถึง [ENG.GetNameDef] อยางปลอดภัย...\n"
 wtt_germany.1000.b: "ความคิดที่ยอดเยี่ยม! เราจะเดินทางไปพรอมกันทั้งหมด"
 wtt_germany.1000.b_tt: "พระราชวงศทั้งหมดจะเสด็จโดยเรือเหาะฮินเดนบูรกไปยังพระราชพิธี สิ่งนี้จะเพิ่มพูนพระเกียรติของราชวงศในสายตาพันธมิตรและประชาชนของเรา และเสริมสรางสถานะของรัฐบาลใหมั่นคงยิ่งขึ้น\n"
 wtt_germany.1001.t: "ฮินเดนบูรกลุกเปนไฟในลอนดอน"
 wtt_germany.1001.desc: "ในโศกนาฏกรรมอันนาสลดใจ เรือเหาะฮินเดนบูรกถูกทําลายในวันนี้ขณะพยายามเทียบทาในลอนดอน ดวยสาเหตุที่ยังไมอาจระบุได เรือเหาะถูกเปลวไฟลุกทวมและตกกระแทกพื้น คราชีวิตผูโดยสารและลูกเรือทั้งหมดบนเรือ - รวมถึงพระราชวงศจักรวรรดิเยอรมันเกือบทั้งหมด\n\nผูรอดชีวิตเพียงพระองคเดียวคือเจาหญิงวิกตอเรีย ลูอีเซอ ซึ่งเสด็จลวงหนาไปชวยเตรียมพระราชพิธี เจาหญิงพระองคนี้ทรงเปนพระองคที่สามที่ไดรับพระนาม 'วิกตอเรีย' ตามพระอัยยิกา จักรพรรดินีวิกตอเรียแหงเยอรมนี และพระปยยิกา สมเด็จพระราชินีนาถวิกตอเรีย จึงทรงกลายเปนรัชทายาทเพียงพระองคเดียวที่เหลืออยู แมจะยังทรงสะเทือนพระทัยจากการสูญเสียพระราชวงศ แตบัดนี้พระองคก็ไดเสด็จขึ้นครองราชยเปนจักรพรรดินีวิกตอเรียที่ 1 แหงจักรวรรดิเยอรมันแลว"
 wtt_germany.1001.a: "ไกเซอรสวรรคตแลว... ขอจักรพรรดินีทรงพระเจริญ!"
 wtt_germany.1002.desc: "ในโศกนาฏกรรมอันนาสลดใจ เรือเหาะฮินเดนบูรกถูกทําลายในวันนี้ขณะพยายามเทียบทาในลอนดอน ดวยสาเหตุที่ยังไมอาจระบุได เรือเหาะถูกเปลวไฟลุกทวมและตกกระแทกพื้น คราชีวิตผูโดยสารและลูกเรือทั้งหมดบนเรือ - รวมถึงพระราชวงศจักรวรรดิเยอรมันทั้งหมด\n\nเมื่อพระราชวงศถูกกวาดลางจนสิ้น รัฐบาลจึงเขาควบคุมอํานาจโดยตรง แตดูเหมือนวาประชาธิปไตยจะไมหวนคืนมาในระยะสั้น"
 wtt_germany.1002.a: "ชางเปนโศกนาฏกรรม!"
 wtt_germany.1003.t: "รัฐบาล[From.GetAdjective]ปฏิเสธคํารองขอ"
 wtt_germany.1003.desc: "หลังการประชุมรัฐสภาที่ยืดเยื้อ รัฐบาล[From.GetAdjective]ตัดสินใจปฏิเสธคํารองขอของเราใหคืนบรรดาศักดิ์ขุนนางและฐานันดรศักดิ์ราชวงศอังกฤษแกราชวงศและตระกูลเจาชายเยอรมัน"
 wtt_germany.1003.a: "นาเสียดายยิ่งนัก..."
 wtt_news.1000.desc: "ในโศกนาฏกรรมอันนาสลดใจ เรือเหาะฮินเดนบูรกถูกทําลายในวันนี้ขณะพยายามเทียบทาในลอนดอน ดวยสาเหตุที่ยังไมอาจระบุได เรือเหาะถูกเปลวไฟลุกทวมและตกกระแทกพื้น คราชีวิตผูโดยสารและลูกเรือทั้งหมดบนเรือ - รวมถึงพระราชวงศจักรวรรดิเยอรมันเกือบทั้งหมด\n\nผูรอดชีวิตเพียงพระองคเดียวคือเจาหญิงวิกตอเรีย ลูอีเซอ ซึ่งเสด็จลวงหนาไปชวยเตรียมพระราชพิธี เจาหญิงทรงเปนเชื้อพระวงศพระองคที่สามที่ไดรับพระนาม 'วิกตอเรีย' ตามพระอัยยิกา จักรพรรดินีวิกตอเรียแหงเยอรมนี และพระปยยิกา สมเด็จพระราชินีนาถวิกตอเรีย จึงทรงกลายเปนรัชทายาทเพียงพระองคเดียวที่เหลืออยู แมจะยังทรงสะเทือนพระทัยจากการสูญเสียพระราชวงศ แตบัดนี้พระองคก็ไดเสด็จขึ้นครองราชยเปนจักรพรรดินีวิกตอเรียที่ 1 แหงจักรวรรดิเยอรมันแลว"
 wtt_news.1000.a: "โศกนาฏกรรมอันนาสลด... ที่ใหผลอันไมคาดคิด"
 wtt_news.1001.desc: "ในโศกนาฏกรรมอันนาสลดใจ เรือเหาะฮินเดนบูรกถูกทําลายในวันนี้ขณะพยายามเทียบทาในลอนดอน ดวยสาเหตุที่ยังไมอาจระบุได เรือเหาะถูกเปลวไฟลุกทวมและตกกระแทกพื้น คราชีวิตผูโดยสารและลูกเรือทั้งหมดบนเรือ - รวมถึงพระราชวงศจักรวรรดิเยอรมันทั้งหมด\n\nเมื่อพระราชวงศถูกลางจนแทบสิ้น รัฐบาลจึงเขาควบคุมอํานาจโดยตรง แตดูเหมือนวาประชาธิปไตยจะไมหวนคืนมาในระยะสั้น"
 wtt_news.1001.a: "ชางเปนโศกนาฏกรรมอันนาสลด!"
 wtt_news.1.t: "เยอรมนีจมอยูในสงครามกลางเมือง"
 wtt_news.1.desc: "รัฐประหารอยางฉับพลันโดยกองทัพแวรมัคท ภายใตการนําของจอมพลเอากุสท ฟอน มัคเคนเซินผูมีชื่อเสียง ไดจุดชนวนสงครามกลางเมืองในเยอรมนีเมื่อเชาตรูวันนี้ ฝายฟาสซิสต ฝายนิยมกษัตริย และฝายประชาธิปไตยตางจับอาวุธขึ้นสูกับเพื่อนรวมชาติเดิมของตน และหนวยทหารไดถูกถอนออกจากพรมแดนเพื่อรับมือภัยคุกคามภายใน\n\nฝายฟาสซิสตภายใตคําสั่งของฮิตเลอรไดประกาศแลววาจะทําลายชาติเสียดีกวาปลอยใหตกอยูในมือ 'พวกเยอรมันทรยศ'"
 wtt_news.1.a: "ไมมีทางถอยกลับแลว"
 wtt_news.1.b: "ถูกกองทัพทรยศ! เราจะไมยอมใหเกิดแบบเดียวกัน"
 wtt_news.1.c: "หวังวาสันติภาพจะกลับคืนสูยุโรปในเร็ววัน..."
 wtt_news.2.t: "[From.GetNameDefCap] ขัดขวางการกลับมาของวิลเฮลมที่ 2"
 wtt_news.2.desc: "ไมนานหลังจากจักรวรรดิเยอรมันประกาศยกเลิกการเนรเทศวิลเฮลมที่ 2 อยางไมคาดคิดเมื่อเชาวานนี้ ทางการดัตชไดสกัดขบวนรถของอดีตไกเซอรกอนจะขามพรมแดนเยอรมนี และบังคับใหกลับไปยังที่ประทับที่ฮาวสดอรน\n\nแถลงการณอยางเปนทางการของเนเธอรแลนดอางถึงความกังวลวาภาคพื้นทวีปจะเสียเสถียรภาพหากปลอยใหวิลเฮลมที่ 2 ขึ้นครองบัลลังกเยอรมันอีกครั้ง รัฐบาลดัตชจึงรับหนาที่กักบริเวณอดีตไกเซอรไวในที่ประทับ\n\nเยอรมนียังไมไดตอบสนองตอวิกฤตการณนี้ แตเสียงโหรองของสาธารณชนรวมถึงการเรียกรองใหใชกําลังทหารเพื่อนําไกเซอรกลับมา\n"
 wtt_news.2.a: "พวกเขากลาดีอยางไร?!"
 wtt_news.2.b: "หวังวาพวกเขาจะรูวากําลังทําอะไรอยู..."
 wtt_news.2.c: "ตองมีใครสักคนลุกขึ้นยืนหยัด"
 wtt_news.3.t: "วิลเฮลมที่ 2 เสด็จกลับสูจักรวรรดิเยอรมัน"
 wtt_news.3.desc: "ในการประกาศอยางไมคาดคิดเมื่อเชาวานนี้ รัฐบาลเยอรมนีไดยกเลิกการเนรเทศวิลเฮลมที่ 2 อยางเปนทางการ ตอมาในวันเดียวกัน ขบวนรถของอดีตไกเซอรไดขามพรมแดนดัตช-เยอรมนี และเมื่อเสด็จกลับถึงเบอรลิน พระองคก็ไดรับการสถาปนากลับเปนไกเซอรแหงจักรวรรดิเยอรมันอยางสมพระเกียรติ\n\nไกเซอรไดทรงประกาศแลววาจะนําเยอรมนีกลับสูความยิ่งใหญดังเดิม แตยังตองรอดูวาประเทศจะดําเนินการทูตไปในทิศทางใด"
 wtt_news.3.a: "ขอไกเซอรทรงพระเจริญ!"
 wtt_news.3.b: "ยอนกลับไปสูตนศตวรรษหรือ?"
 wtt_news.3.c: "เราไดทําหนาที่ของเราในการคุมครองพระองคแลว"
 wtt_news.3.d: "เรานาจะกดดันดัตชใหสงตัวพระองคมากกวานี้!"
 wtt_news.4.t: "วิลเฮลมที่ 2 พนจากการกักบริเวณของดัตช"
 wtt_news.4.desc: "แมดัตชจะพยายามตานทานการรุกของเยอรมนีอยางไรผล รัฐบาลก็ไมมีทางเลือกอื่นนอกจากยอมจํานนตอกําลังอันเหนือกวาของเยอรมนี กองทหารเยอรมันไดปลดปลอยอดีตไกเซอรจากการกักบริเวณที่ฮาวสดอรน และนับแตเสด็จกลับถึงเบอรลิน พระองคก็ไดรับการสถาปนากลับเปนไกเซอรแหงจักรวรรดิเยอรมันอยางสมพระเกียรติ\n\nไกเซอรไดทรงประกาศแลววาจะนําเยอรมนีกลับสูความยิ่งใหญดังเดิม แตยังตองรอดูวาประเทศจะดําเนินการทูตไปในทิศทางใด"
 wtt_news.4.a: "ไมมีผูใดหยุดยั้งจักรวรรดิเยอรมันได!"
 wtt_news.4.b: "เปนการกระทําที่โงเขลาของดัตช"
 wtt_news.4.c: "บางทีนี่อาจไมใชความคิดที่ดีนัก..."
 wtt_news.5.t: "มุสโสลินีถูกลอบสังหาร"
 wtt_news.5.desc: "รายงานจากโรมระบุวาอิลดูเชถูกยิงเสียชีวิตกลางวันแสก ๆ บนทองถนนของเมืองเมื่อชวงตนวันนี้ ในเวลาเดียวกัน กลุมหนึ่งในรัฐบาลไดเคลื่อนไหวยึดอํานาจจากฟาสซิสตอิตาลี มีการจับกุมระลอกใหญ และหนวยทหารไดปดลอมอาคารรัฐบาลและทองถนน พรอมประกาศเคอรฟว\n\nโฆษกรัฐบาลคณะรัฐประหารประกาศความจงรักภักดีตอวิตโตรีโอ เอมานูเอเลที่ 3 และในฐานะพระราชกรณียกิจแรกในฐานะผูนําอิตาลี พระมหากษัตริยไดทรงลงพระนามในสนธิสัญญาพันธมิตรกับจักรวรรดิเยอรมัน"
 wtt_news.5.a: "ทุกอยางเปนไปอยางสมบูรณแบบ"
 wtt_news.5.b: "ขอพระมหากษัตริยทรงพระเจริญ!"
 wtt_news.5.c: "พวกเยอรมันตองมีเอี่ยวในเรื่องนี้แน..."
 wtt_news.6.t: "การฟนฟูออสเตรีย-ฮังการี"
 wtt_news.6.desc: "รัฐผูสืบทอดจักรวรรดิออสเตรีย-ฮังการีในลุมแมนํ้าดานูบเพิ่งเกิดกระแสนิยมจักรวรรดิระลอกใหญ และภายใตการนําของ [From.GetOldNameDef] บัดนี้ไดเลือกที่จะรวมประเทศของตนเขาเปนออสเตรีย-ฮังการีอีกครั้ง\n\nรัฐบาลออสเตรีย-ฮังการีชุดใหมไดดําเนินการลงนามในสนธิสัญญาพันธมิตรอยางเปนทางการกับจักรวรรดิเยอรมันทันที โดยประกาศสนับสนุนนโยบายตางประเทศตอตานอังกฤษและฝรั่งเศสของเยอรมนีอยางเปดเผย"
 wtt_news.6.a: "และเราไมตองยิงกระสุนแมแตนัดเดียว"
 wtt_news.6.b: "รวมเปนหนึ่งอีกครั้ง!"
 wtt_news.6.c: "กลุมอํานาจใหมในยุโรปหรือ? นากังวล"
 wtt_news.7.t: "โปแลนดคืนดานซิก"
 wtt_news.7.desc: "รัฐบาลโปแลนดยอมรับขอเสนอของเยอรมนีใหคืนดานซิกเพื่อแลกกับการคํ้าประกันทางทหาร มีการรางสนธิสัญญารับรองกับชาวโปแลนดวาเยอรมนีจะเขาชวยเหลือหากมีการกระทําอันเปนปรปกษใด ๆ ตอพวกเขา\n\nแมตองจายราคาสูง ดวยการที่โปแลนดถูกตัดขาดจากทะเลโดยสิ้นเชิงอีกครั้ง แตเมื่อพิจารณาภัยคุกคามคอมมิวนิสตทางตะวันออกแลว ก็อาจคุมคาก็เปนได"
 wtt_news.7.a: "'ดานซิกหรือสงคราม' งั้นหรือ? ฮา! การทูตชนะอีกครั้ง"
 wtt_news.7.b: "หวังวาราคาที่จายไปจะคุมคา"
 wtt_news.7.c: "พวกเยอรมันเขามายุงในเขตอิทธิพลของเรา..."
 wtt_news.7.d: "ขอตกลงที่เปนประโยชนตอทั้งสองฝายหรือ? คอยดูกันไป"
 wtt_news.8.t: "สงครามกลางเมืองเยอรมนียุติลง"
 wtt_news.8.desc: "สงครามกลางเมืองที่ฉีกเยอรมนีเปนเสี่ยง ๆ ไดยุติลงแลว การสูรบรุนแรงเปนพิเศษ การตอตานอยางบาคลั่งของพวกนาซีกอความพินาศในระดับที่ชวนใหนึกถึงมหาสงคราม\n\nดูเหมือนวาฮิตเลอรเสียชีวิตแลว และแกนนํานาซีถูกจําคุกหรือประหารชีวิต รัฐบาลเฉพาะกาลประกาศวาจําเปนตองกุมอํานาจรัฐใหมั่นคงและฟนฟูเสถียรภาพของชาติเสียกอน จึงจะคิดถึงการเริ่มกระบวนการปฏิรูปรัฐธรรมนูญได"
 wtt_news.8.a: "เริ่มการฟนฟูกันเถอะ"
 wtt_news.8.b: "หวังวาระบอบใหมจะผอนปรนมากกวาเดิม..."
 wtt_news.9.t: "โซเวียตประกาศการซอมรบขนาดใหญ"
 wtt_news.9.desc: "เพื่อตอบโตสิ่งที่พวกเขาเรียกวา 'วาทกรรมเยอรมันที่เปนปรปกษมากขึ้นเรื่อย ๆ' กองทัพโซเวียตไดประกาศการซอมรบขนาดใหญหลายครั้งที่จะจัดขึ้นในปนี้\n\nโฆษกรัฐบาลโซเวียตระบุวา หวังวาการยกระดับความพรอมรบจะทําใหเยอรมนีเลิก 'พนวาทกรรมใสรายตอไป'"
 wtt_news.9.a: "พวกเขาเดินเขากับดักของเราพอดี!"
 wtt_news.9.b: "เทานี้คงทําใหพวกเขาตองคิดหนักแน"
 wtt_news.9.c: "หวังวาเยอรมนีจะไมทําใหเราผิดหวัง..."
 wtt_news.9.d: "พวกเขาไมไดชวยคลี่คลายสถานการณเลย..."
 wtt_news.10.t: "โซเวียตเรงเสริมกําลังทหาร"
 wtt_news.10.desc: "เพื่อตอบโตการประกาศของเยอรมนีเมื่อเร็ว ๆ นี้ที่จะตั้งพันธมิตรยุโรปกลางเพื่อตอตานการรุกรานของโซเวียต รัฐบาลโซเวียตไดผานมาตรการเรงการผลิตทางทหารอยางรุนแรง\n\nโฆษกของเครมลินกลาวอยางชัดแจงวาสหภาพโซเวียตไมอาจนั่งดูภัยคุกคามนี้กอตัวขึ้นที่ชายแดนของตนได มาตรการรับมือจําเปนตองดําเนินการ และไดดําเนินการไปแลวในทันที"
 wtt_news.10.a: "พวกเขายังคงชวยเปาหมายของเราโดยไมรูตัว!"
 wtt_news.10.b: "พวกเขาคงไมกลาทําอะไรที่โงเขลาไปกวานี้แน!"
 wtt_news.10.c: "อยางนอยก็ไดตั้งพันธมิตรขึ้นแลว"
 wtt_news.10.d: "สถานการณยกระดับอยางรวดเร็ว..."
 wtt_news.11.t: "โซเวียตเคลื่อนไหวเพื่อรักษาเขตอิทธิพล"
 wtt_news.11.desc: "เมื่อรัฐชายแดนแหงหนึ่งของพวกเขาไดรับเชิญเขารวม [GER.GetFactionName] รัฐบาลโซเวียตไดเตือนอยางชัดแจงไมใหแทรกแซงกิจการใน 'เขตอิทธิพลของพวกเขา' อีกตอไป\n\nรายงานที่ยังไมไดรับการยืนยันระบุวามีการระดมกองกําลังทหารโซเวียต ซึ่งอาจเปนการเตรียมทําสงคราม"
 wtt_news.11.a: "ในที่สุดเราก็กดดันพวกเขาไดมากพอแลวหรือ?"
 wtt_news.11.b: "เราตองรักษาพรมแดนของเราใหมั่นคง!"
 wtt_news.11.c: "เมื่อรวมกัน เราจะยืนหยัดตอตานพวกเขาได!"
 wtt_news.11.d: "นี่คือประกายไฟหรือ?"
 wtt_news.11.e: "เราตองเตรียมพรอมทําสงคราม!"
 wtt_news.12.t: "การประทวงไกเซอรนําไปสูสงคราม"
 wtt_news.12.desc: "เพื่อตอบโตการตัดสินใจของ[GER.GetAdjective]ที่อนุญาตใหวิลเฮลมที่ 2 เสด็จกลับ [FRA.GetNameDef] และ [ENG.GetNameDef] ไดประกาศสงครามกับ [GER.GetNameDef] ฝาย[FRA.GetAdjective]และ[ENG.GetAdjective]อางวา 'ความดื้อรั้นอยางโจงแจงของ[GER.GetAdjective]' ที่ยอมให 'อาชญากรสงครามที่รูกันทั่ว' กลับมาเปนประมุขแหงรัฐอีกครั้ง คือตนเหตุของการยกระดับครั้งนี้\n\nโฆษกของรัฐบาลทั้งสองชี้วาการปลอยให 'ตัวการสําคัญ' แหงมหาสงครามขึ้นครองราชบัลลังก[GER.GetAdjective]อีกครั้งเปนเรื่องผิดศีลธรรมอยางรายแรง และรัฐบาล[GER.GetAdjective]ไดเพิกเฉยตอคําเตือนทั้งหมด 'เราไมมีทางเลือกอื่น'"
 wtt_news.12.a: "พวกเขาบังอาจมาบอกวาใครจะเปนผูนําของเราไดหรือ?!"
 wtt_news.12.b: "พวกเขาบีบบังคับเราเอง!"
 wtt_news.12.c: "แลวเราก็ยอนกลับไปสูป 1914"
 wtt_news.13.t: "การประนีประนอมวิลเฮลมที่ 3"
 wtt_news.13.desc: "เพื่อตอบสนองตอการคัดคานอยางรุนแรงของอังกฤษและฝรั่งเศสตอการกลับมาเปนไกเซอรของวิลเฮลมที่ 2 รัฐบาลเยอรมนีไดเสนอการประนีประนอม โดยวิลเฮลมที่ 2 จะยังคงประทับลี้ภัยตอไป แตพระราชโอรสจะขึ้นครองราชบัลลังกเยอรมันในพระนามวิลเฮลมที่ 3\n\nเมื่อไดรับการยอมรับจาก [ENG.GetNameDef] และ [FRA.GetNameDef] แลว หวังวาสิ่งนี้จะนําไปสูสันติภาพอันยั่งยืนระหวางมหาอํานาจยุโรป"
 wtt_news.13.a: "เราไมมีทางเลือกอื่น"
 wtt_news.13.b: "โชคดีที่เยอรมนียังมีเหตุผล"
 wtt_news.13.c: "สันติภาพยังคงดํารงอยู..."
 wtt_news.14.desc: "เพื่อตอบโตการตัดสินใจของเยอรมนีที่อนุญาตใหวิลเฮลมที่ 2 เสด็จกลับ และแมจะไมมีการสนับสนุนจากอังกฤษ [FRA.GetNameDef] ไดประกาศสงครามกับ [GER.GetNameDef] ฝรั่งเศสอางวา 'ความดื้อรั้นอยางโจงแจงของเยอรมนี' ที่ยอมให 'อาชญากรสงครามที่รูกันทั่ว' กลับมาเปนประมุขแหงรัฐอีกครั้ง คือตนเหตุของการยกระดับครั้งนี้\n\nโฆษกรัฐบาลฝรั่งเศสชี้วาการปลอยให 'ตัวการสําคัญ' แหงมหาสงครามขึ้นครองราชบัลลังกเยอรมันอีกครั้งเปนเรื่องผิดศีลธรรมอยางรายแรง และรัฐบาลเยอรมนีไดเพิกเฉยตอคําเตือนทั้งหมด 'เราไมมีทางเลือกอื่น'"
 wtt_news.14.c: "พวกฝรั่งเศสหัวรั้นโงเขลา!"
 wtt_news.14.d: "แตอังกฤษจะทําอยางไร?"
 wtt_news.15.desc: "เพื่อตอบสนองตอการคัดคานอยางรุนแรงของฝรั่งเศสตอการกลับมาเปนไกเซอรของวิลเฮลมที่ 2 รัฐบาลเยอรมนีไดเสนอการประนีประนอม โดยวิลเฮลมที่ 2 จะยังคงประทับลี้ภัยตอไป แตพระราชโอรสจะขึ้นครองราชบัลลังกเยอรมันในพระนามวิลเฮลมที่ 3\n\nเมื่อไดรับการยอมรับจาก [FRA.GetNameDef] แลว หวังวาสิ่งนี้จะนําไปสูสันติภาพอันยั่งยืนระหวางมหาอํานาจภาคพื้นทวีปยุโรป"
 wtt_news.15.c: "โชคดีที่เยอรมนีมีเหตุผลกวาฝรั่งเศส..."
 wtt_news.16.t: "จีนคืนการปกครองชิงเตาใหเยอรมนี"
 wtt_news.16.desc: "รัฐบาลจีนตัดสินใจยอมตามขอเรียกรองลาสุดของเยอรมนีใหคืนดินแดนเชาเดิมของพวกเขาที่ชิงเตา\n\nมีผลทันที การปกครองของเยอรมนีไดรับการฟนฟูภายในเขตเมือง และรัฐบาลเยอรมนีไดเปลี่ยนชื่อเมืองกลับเปนชื่อเยอรมันเดิมวาซิงเทา"
 wtt_news.16.a: "เราจะไดเห็นการหวนคืนสูความรุงโรจนแหงอาณานิคมแนนอน"
 wtt_news.16.b: "เปนเพียงราคาเล็กนอยที่ตองจาย"
 wtt_news.16.c: "เราเคยยึดมาจากพวกเขาครั้งหนึ่งแลว เราทําไดอีก!"
 wtt_news.16.d: "ลัทธิอาณานิคมเยอรมันกลับมาอีกครั้งหรือ?"
 wtt_news.17.t: "ญี่ปุนคืนการปกครองชิงเตาใหเยอรมนี"
 wtt_news.17.desc: "รัฐบาลญี่ปุนตัดสินใจยอมตามขอเรียกรองลาสุดของเยอรมนีใหคืนดินแดนเชาเดิมของพวกเขาที่ชิงเตา\n\nมีผลทันที การปกครองของเยอรมนีไดรับการฟนฟูภายในเขตเมือง และรัฐบาลเยอรมนีไดเปลี่ยนชื่อเมืองกลับเปนชื่อเยอรมันเดิมวาซิงเทา"
 wtt_news.17.b: "พวกเขากลายกดินแดน -ของเรา- ใหคนอื่นไดอยางไร?!"
 wtt_news.17.c: "ถือวาเราหายกันแลวสําหรับเรื่องป 1914"
 wtt_news.18.t: "ออสเตรียลงมติเขารวมกับเยอรมนี"
 wtt_news.18.desc: "นับตั้งแต [AUS.GetNameDef] และ [GER.GetNameDef] เริ่มรวมมือกันอยางใกลชิดในฐานะพันธมิตร กระแสสนับสนุนการรวมชาติในออสเตรียก็เพิ่มสูงขึ้นอยางมาก การลงประชามติเมื่อวานนี้ ประชาชนออสเตรียลงคะแนนอยางทวมทนสนับสนุนการรวมชาติกับเพื่อนบานทางเหนือ\n\nการผนวกรวมรัฐออสเตรียไดรับการผลักดันทันที และรัฐเดิมไดถูกยุบไปเมื่อเชานี้"
 wtt_news.18.a: "เพื่อมหาเยอรมนี"
 wtt_news.18.b: "มันคือสิ่งที่พวกเขาปรารถนา"
 wtt_news.19.t: "โปแลนดคืนดานซิกและพอซนาน"
 wtt_news.19.desc: "เมื่อเผชิญกับการโจมตีอยางตอเนื่องของโซเวียต รัฐบาลโปแลนดไดประกาศเมื่อเชานี้ใหคืนดินแดนเยอรมันเดิมคือดานซิกและพอซนานแก [GER.GetNameDef] ทันที\n\nแมรัฐบาลโปแลนดและเยอรมนีจะเงียบสนิทถึงเหตุผล แตผูเชี่ยวชาญเห็นพองวานาจะเปนความพยายามกันดินแดนเหลานี้ไมใหตกอยูในมือโซเวียต เมื่อกองทัพโปแลนดใกลจะลมสลาย"
 wtt_news.19.a: "เราจะปกปองพวกเขาดวยชีวิต"
 wtt_news.19.b: "มันคือทางเลือกที่ดีที่สุดแลว..."
 wtt_news.19.c: "การเลนลูกไมทางการทูตอันแยบยลและสกปรก!"
 wtt_news.19.d: "ขอตกลงทางการทูตที่ชาญฉลาดอยางนาทึ่ง..."
 wtt_news.20.t: "เยอรมนีประกาศกติกาตอตานโซเวียต"
 wtt_news.20.desc: "เมื่อการรุกรานของโซเวียตดูเหมือนจะเพิ่มขึ้น [GER.GetName] ไดเสนอโอกาสให "รัฐที่อยูภายใตภัยคุกคามเฉพาะหนาจากคอมมิวนิสต" จัดตั้งพันธมิตรตอตาน [SOU.GetName] ประเทศใดก็ตามในพันธมิตรจะตองผูกพันเขาทําสงครามกับ [SOU.GetName] หากถึงเวลาที่สมาชิกรายใดถูกโจมตี"
 wtt_news.21.t: "[From.GetNameDefCap] กลาวตอตาน [SOV.GetNameDef]"
 wtt_news.21.desc: "\n รัฐบาล[FROM.GetAdjective]ไดยกระดับวาทกรรมตอตาน [SOV.GetNameDef] โดยเตือนวาเพื่อนบานทางตะวันออกของยุโรปคือ "มหันตภัยแหงตะวันออก" ที่คุกคามอยูเหนือภาคพื้นทวีป ไมวานี่จะเปนการปลุกปนความกลัวหรือมีมูลความจริงก็ยังเปนที่ถกเถียง แตดูเหมือนชาว[FROM.GetAdjective]มุงจะรวมภาคพื้นทวีปเขาตอตานตะวันออกอยางแนนอน"
 wtt_news.21.a: "โลกตองรูถึงภัยคุกคามของ[SOV.GetAdjective]!"
 wtt_news.21.b: "พวกเขากลาใสรายเราเชนนั้นไดอยางไร?!"
 wtt_news.21.d: "มาดูกันวาโซเวียตจะรับเรื่องนี้อยางไร"
 wtt_news.22.t: "[From.GetName] ประกาศพันธมิตรยุโรปกลาง"
 wtt_news.22.desc: "เยอรมนียังคงใชวาทกรรมตอตานโซเวียตตอไป และบัดนี้ไดวางแผนอยางเปนรูปธรรมเพื่อจํากัดอิทธิพลของโซเวียตในสวนที่เหลือของภาคพื้นทวีป พันธมิตรใหมที่ชื่อพันธมิตรยุโรปกลางไดถูกจัดตั้งขึ้น และเมื่อเวลาผานไปหวังวาจะสามารถคุมครองสมาชิกจากสิ่งที่เยอรมนีเรียกวา "การรุกรานอยางไรขีดจํากัดของโซเวียต" ได"
 wtt_news.22.a: "เราจะนํายุโรปเสรีตอตานภัยคุกคามของคอมมิวนิสต!"
 wtt_news.22.b: "พวกเขาคุกคามสถานะของเรามากขึ้นเรื่อย ๆ..."
 wtt_news.22.c: "ในที่สุด เยอรมนีก็ลงมือ"
 wtt_news.22.d: "โซเวียตคงไมยอมนิ่งเฉยแน..."
 wtt_news.23.t: "ผนวกฝรั่งเศสวิชี"
 wtt_news.23.desc: "ปฏิบัติการของเยอรมนีเพื่อผนวกฝรั่งเศสวิชีที่เริ่มขึ้นเมื่อตนสัปดาหไดเสร็จสิ้นลงอยางสําเร็จ กองกําลังเยอรมันสามารถยึดฐานทัพเรือที่ตูลงไดกอนที่คําสั่งใหจมกองเรือฝรั่งเศสจะถูกสงออกไป ดวยเหตุนี้ กองเรือฝรั่งเศสทั้งหมดจึงตกอยูในมือเยอรมนีโดยสมบูรณ"
 wtt_news.23.a: "ความสําเร็จอันยิ่งใหญ!"
 wtt_news.23.b: "พวกเขาลมเหลวในหนาที่..."
 wtt_news.23.c: "พวกเยอรมันชางโหดเหี้ยม"
 wtt_news.24.t: "ฝรั่งเศสจมกองเรือตนเอง"
 wtt_news.24.desc: "ปฏิบัติการของเยอรมนีเพื่อผนวกฝรั่งเศสวิชีที่เริ่มขึ้นเมื่อตนสัปดาหไดเสร็จสิ้นลงอยางสําเร็จ อยางไรก็ตาม กองกําลังเยอรมันไมสามารถยึดฐานทัพเรือที่ตูลงไดกอนที่คําสั่งใหจมกองเรือฝรั่งเศสจะถูกสงออกไป ดวยเหตุนี้ กองเรือฝรั่งเศสทั้งหมดจึงถูกจมลงเพื่อไมใหตกอยูในมือเยอรมนี"
 wtt_news.24.a: "นาผิดหวัง แตก็ไมสําคัญอะไร"
 wtt_news.24.b: "พวกเขารักษาคําพูดจนถึงที่สุด"
 wtt_news.24.c: "การขัดขืนครั้งสุดทายของฝรั่งเศส"
 wtt_burma_road.1.t: "ถนนพมาถูกปด"
 wtt_burma_road.1.desc: "กองกําลัง[occupying_country.GetAdjective]ที่บุกเขาสู [state_occupied.GetName] ไดมาถึงถนนพมาและตัดเสนทางในหลายจุด เสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_burma_road.1.a: "เรื่องนี้จะไมทําใหอะไรงายขึ้นเลย"
 wtt_burma_road.2.desc: "รัฐบาล[From.GetAdjective]ตัดสินใจไมอนุญาตใหมีการสัญจรผานถนนพมาอีกตอไป ขบวนลําเลียงทั้งหมดบนถนนถูกสั่งหยุดและใหเดินทางกลับ เสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_burma_road.2.desc_war_with_from: "กองกําลัง[From.GetAdjective]รุกขึ้นไปตามถนนพมาอยางรวดเร็วและยึดสะพานและจุดขามที่สําคัญหลายแหง ขณะนี้ถนนปดการสัญจรทั้งหมด และเสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_burma_road.3.t: "[From.GetNameDefCap] เปดถนนพมาบางสวนอีกครั้ง"
 wtt_burma_road.3.desc: "หลังจากยึดถนนพมาสวนใหญกลับคืนมาไดสําเร็จ ทางการ[From.GetAdjective]ไดอนุญาตใหกลับมาสัญจรตามเสนทางไดอีกครั้ง แมกองกําลังขาศึกที่หลงเหลือจะทําใหการเดินทางอันตรายยิ่งกวาเดิม แตเสบียงก็กลับมาไหลเวียนอีกครั้ง"
 wtt_burma_road.3.a: "กาวแรกที่ดี"
 wtt_burma_road.4.t: "[From.GetNameDefCap] เปดถนนพมาอีกครั้ง"
 wtt_burma_road.4.desc: "ขบวนลําเลียงเสบียงชุดแรกที่ผานถนนพมาที่เปดใหมไดมาถึงยูนนานแลววันนี้ แมจะตองใชเวลากวาการสัญจรจะคลองตัวอีกครั้ง แตเสบียงก็กลับมาถึงมือเราแลว"
 wtt_burma_road.4.a: "ความโลงใจที่รอคอยมานาน"
 wtt_ledo_road.1.t: "ถนนเลโดถูกปด"
 wtt_ledo_road.1.desc: "กองกําลัง[occupying_country.GetAdjective]ที่บุกเขาสู [state_occupied.GetName] ไดมาถึงถนนเลโดและตัดเสนทางในหลายจุด เสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_ledo_road.2.desc: "รัฐบาล[From.GetAdjective]ตัดสินใจไมอนุญาตใหมีการสัญจรผานถนนเลโดอีกตอไป ขบวนลําเลียงทั้งหมดบนถนนถูกสั่งหยุดและใหเดินทางกลับ เสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_ledo_road.2.desc_war_with_from: "กองกําลัง[From.GetAdjective]รุกขึ้นไปตามถนนเลโดอยางรวดเร็วและยึดสะพานและจุดขามที่สําคัญหลายแหง ขณะนี้ถนนปดการสัญจรทั้งหมด และเสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_ledo_road.3.t: "[From.GetNameDefCap] เปดถนนเลโดบางสวนอีกครั้ง"
 wtt_ledo_road.3.desc: "หลังจากยึดถนนเลโดสวนใหญกลับคืนมาไดสําเร็จ ทางการ[From.GetAdjective]ไดอนุญาตใหกลับมาสัญจรตามเสนทางไดอีกครั้ง แมกองกําลังขาศึกที่หลงเหลือจะทําใหการเดินทางอันตรายยิ่งกวาเดิม แตเสบียงก็กลับมาไหลเวียนอีกครั้ง"
 wtt_ledo_road.3.a: "กาวแรกที่ดี"
 wtt_ledo_road.4.t: "[From.GetNameDefCap] เปดถนนเลโดอีกครั้ง"
 wtt_ledo_road.4.desc: "ขบวนลําเลียงเสบียงชุดแรกที่ผานถนนเลโดที่เปดใหมไดมาถึงยูนนานแลววันนี้ แมจะตองใชเวลากวาการสัญจรจะคลองตัวอีกครั้ง แตเสบียงก็กลับมาถึงมือเราแลว"
 wtt_ledo_road.4.a: "ขาวดี!"
 wtt_the_hump.1.t: "ระงับการขนสงทางอากาศขามเดอะฮัมป"
 wtt_the_hump.1.desc: "กองกําลัง[occupying_country.GetAdjective]ไดยึดสนามบินหลายแหงใน [state_occupied.GetName] ทําใหกองบินขนสงในพื้นที่ที่บินเสนทางหิมาลัยตองอพยพ เมื่อภัยคุกคามจากเครื่องบินขับไลขาศึกเพิ่มขึ้น และระยะทางที่ไกลขึ้นทําใหไมสามารถบินถึงเปาหมายไดดวยเชื้อเพลิงเพียงถังเดียว การขนสงทางอากาศจึงถูกระงับ เสบียงไมสามารถสงถึงเราผานเสนทางนี้ไดอีกตอไป"
 wtt_the_hump.2.desc: "รัฐบาล[From.GetAdjective]สั่งใหยุติเที่ยวบินทั้งหมดที่บินขามเทือกเขาหิมาลัย มีผลทันที แมจะมีการประทวงในทันที พวกเขาก็ไมแสดงทาทีวาจะทบทวนแนวทางของตน"
 wtt_the_hump.2.desc_war_with_from: "กองทหาร[From.GetAdjective]ไดยึดสนามบินที่ใชในการขนสงทางอากาศขามเดอะฮัมป ทําใหไมสามารถสงเสบียงใหเราทางอากาศได ไมอาจคาดหวังเสบียงจากเสนทางนี้ไดอีก"
 wtt_the_hump.3.t: "[From.GetNameDefCap] เริ่มการขนสงทางอากาศขามเดอะฮัมปอีกครั้ง"
 wtt_the_hump.3.desc: "เครื่องบิน[From.GetAdjective]ชุดแรกเริ่มเดินทางมาถึง พรอมขนเสบียงสําคัญขามเทือกเขาหิมาลัย แมปฏิบัติการของขาศึกยังคงเปนภัยตอเครื่องบิน แตเสบียงก็เริ่มไหลเวียนอีกครั้ง"
 wtt_the_hump.3.a: "กาวแรกที่ดี"
 wtt_the_hump.4.t: "[From.GetNameDefCap] เริ่มการขนสงทางอากาศขามเดอะฮัมปอีกครั้ง"
 wtt_the_hump.4.desc: "การขนสงทางอากาศขามเทือกเขาหิมาลัยกลับมาดําเนินการเต็มกําลังอีกครั้ง ดวยตารางเที่ยวบินรายวันที่ควบคุมอยางเขมงวด นําเสบียงที่ตองการอยางยิ่งยวดมาเปนจํานวนมาก"
 wtt_the_hump.4.a: "ของขวัญจากฟากฟา!"
 wtt_hanoi_route.1.t: "เสนทางฮานอยถูกปด"
 wtt_hanoi_route.1.desc: "เรือสินคาที่บรรทุกเสบียงสําหรับกองทัพของเราถูกปฏิเสธไมใหเขาทาเรือฮานอย เนื่องจากเสนทางขึ้นเหนือสูชายแดนจีนถูกปดโดย[GetVietnamOwner] \n\nเสบียงไมสามารถเคลื่อนผานเสนทางนี้ไดอีกตอไป"
 wtt_hanoi_route.2.desc: "ทางการ[From.GetAdjective]ในทองถิ่นไดรับคําสั่งใหขัดขวางการขนถายยุทโธปกรณในฮานอยเพื่อลําเลียงไปยังชายแดนจีนอีกตอไป มีการวางยามติดอาวุธไวที่ทาเรือเพื่อปองกันไมใหลูกเรือใดฝาการปดลอม หนวยยามฝง[From.GetAdjective]กําลังผลักดันเรือที่ยังอยูกลางทะเลใหกลับไป \n\nไมอาจคาดหวังเสบียงผานชองทางนี้ไดอีก"
 wtt_hanoi_route.2.desc_war_with_from: "กองกําลัง[From.GetAdjective]ที่ยึดครองฮานอยไดยึดเรือสินคาหลายลําที่บรรทุกเสบียงใหเรา เรือที่ยังอยูกลางทะเลไดหันหัวกลับและหนีไปยังทาเรือของประเทศเปนกลาง\n\nไมอาจคาดหวังเสบียงผานเสนทางนี้ไดอีก"
 CHI_vietnam_JAP: "กองทัพญี่ปุน"
 CHI_vietnam_FRA: "ทางการฝรั่งเศส"
 wtt_china.1.t: "[FROM.GetNameDefCap] เรียกรองใหยอมสยบ"
 wtt_china.1.desc: "ดูเหมือนวา [From.GetLeader] ไดตัดสินใจขยายอํานาจไปยังดินแดนหางไกลของจีนในที่สุด ผูแทนจากรัฐบาลกลางไดมาถึง พรอมเรียกรองใหเราปฏิบัติตามคําสั่งของ [From.GetLeader] มิฉะนั้นจะถูกแทนที่ดวยรัฐบาลที่วานอนสอนงายกวา"
 wtt_china.1.a: "เรายืนหยัดรวมกัน!"
 wtt_china.1.b: "ใหพวกเขาลองดู"
 wtt_china.2.t: "[From.GetLeader] ยอมสยบ"
 wtt_china.2.desc: "[From.GetLeader] ไดสงผูถือสารกลับมาพรอมบันทึกสวนตัว ใหคํามั่นวาจะปฏิบัติตามคําสั่งของเราอยางเครงครัดและประสานงานกับรัฐบาลของเรา"
 wtt_china.2.a: "ดีมาก"
 wtt_china.3.t: "[From.GetLeader] ปฏิเสธ"
 wtt_china.3.desc: "[From.GetLeader] สงบันทึกของเรากลับมา โดยอางวารัฐบาลกลางไมมีอํานาจตามกฎหมายที่จะแทนที่ผูวาการมณฑล พรอมแนบรายงานโดยละเอียดถึงความพรอมรบของกองทหารของเขามาดวย"
 wtt_china.3.a: "คอยดูกันไป"
 wtt_china.10.t: "[FROM.GetName] เรียกรองใหยอมสยบ"
 wtt_china.10.desc: "รัฐบาลของ [From.GetLeader] ไดสงสารอันดุเดือดมา โดยระบุถึงการตัดสินใจเชิงนโยบายหลายประการที่เราทําไปในชวงไมกี่เดือนที่ผานมา ซึ่งพวกเขาเห็นวาขัดตอผลประโยชนของชาติ [From.GetNameDef] หากเราไมปรับนโยบายใหสอดคลองกับรัฐบาล[From.GetAdjective]มากขึ้น พวกเขาจะใช "มาตรการตามที่เห็นสมควร""
 wtt_china.10.a: "เราไมมีทางเลือก"
 wtt_china.10.b: "เราจะสู!"
 wtt_china.11.t: "[From.GetNameDefCap] ยอมสยบ"
 wtt_china.11.desc: "รัฐบาล[From.GetAdjective]ไดตอบบันทึกของเราและสัญญาวาจะปรึกษาเราในการตัดสินใจทุกเรื่องตอจากนี้ เอกอัครราชทูตของเราประจํา [From.GetNameDef] ไดรับการเลื่อนตําแหนงเปนผูแทนพิเศษ และไดรับมอบหมายใหดูแลไมใหฝาย[From.GetAdjective]ออกนอกลูนอกทางมากนัก"
 wtt_china.11.a: "ยอดเยี่ยม!"
 wtt_china.12.t: "[From.GetNameDefCap] แข็งขอ"
 wtt_china.12.desc: "บันทึกทางการทูตของเราถึง [From.GetNameDef] ดูเหมือนจะรั่วไหลไปถึงสื่อ ซึ่งตอนนี้กําลังโกลาหล แมแตหนังสือพิมพตางประเทศยังเขียนบทบรรณาธิการในแงลบอยางมาก โดยเรียกคําขอใหปรึกษาหารืออันสมเหตุสมผลของเราวา "การแทรกแซงกิจการภายใน" "แบบอยางที่อันตราย" หรือแมแต "จักรวรรดินิยมอยางโจงแจง" \n\nไมตองพูดก็รูวารัฐบาล[From.GetAdjective]ปฏิเสธที่จะหารือเรื่องนี้อีกตอไป และระบุวาหากยกเรื่องนี้ขึ้นมาอีกจะนําไปสูการระงับการติดตอทางการทูตโดยสิ้นเชิง"
 wtt_china.12.a: "จําเปนตองใชมาตรการบางอยาง"
 wtt_infiltration.1.t: "การกวาดลางตอตานการแทรกซึม"
 wtt_infiltration.2.t: "พบหนวยคอมมิวนิสตใน [infiltrated_state.GetName]"
 wtt_infiltration.2.desc: "การสืบสวนของทางการไดเปดโปงพื้นที่ฐานที่มั่นของคอมมิวนิสตใน [infiltrated_state.GetName] เราควรทุมกําลังทหารทั้งหมดเขากวาดลางโจรเหลานี้โดยเร็วที่สุด ความลาชาใด ๆ อาจทําใหพวกเขาขยายฐานปฏิบัติการและถอนรากถอนโคนไดยากขึ้นมาก"
 wtt_infiltration.2.a: "สงทหารเขาไป"
 wtt_infiltration.3.t: "ควบคุมคอมมิวนิสตไดแลว"
 wtt_infiltration.3.desc: "ระหวางการบุกคนแหลงซองสุมของคอมมิวนิสตที่รูจักครั้งลาสุด เจาหนาที่ของเรากลับมามือเปลา เรารูวาผูแทรกซึมคอมมิวนิสตยังเคลื่อนไหวอยูในประเทศ แตดูเหมือนจะไมมีหนวยใดปฏิบัติการอยูโดยที่เราไมรูมากอน"
 wtt_infiltration.3.a: "กําจัดพวกที่เราพบใหสิ้นซาก!"
 wtt_infiltration.4.t: "ปราบการแทรกซึมของคอมมิวนิสตไดแลว?"
 wtt_infiltration.4.desc: "รายงานเรื่องการแทรกซึมของคอมมิวนิสตอยางกวางขวางดูเหมือนจะเกินจริงไปมาก การบุกคนแหลงซองสุมที่รูจักและนักเคลื่อนไหวคอมมิวนิสตหลายรายไมพบอะไรเลย นี่อาจหมายความวาคอมมิวนิสตไมสามารถจัดตั้งหนวยใดได หรือเราไดบดขยี้หนวยที่พวกเขาตั้งขึ้นไปแลว อยางไรก็ตาม เราตองเฝาระวังตอไป เพราะพวกเขายอมพยายามทําใหเราตายใจกอนจะเริ่มเคลื่อนไหวใหมอยางไมตองสงสัย"
 wtt_infiltration.4.a: "หวังวาเราจะกําจัดพวกมันไดหมดแลว"
 wtt_infiltration.5.t: "พบพื้นที่ฐานที่มั่น [infiltrated_state.GetName]"
 wtt_infiltration.5.desc: "หนวยลาดตระเวนฝายชาตินิยมไดปดลอมเขามาใกลพื้นที่ฐานที่มั่นของเราใน [infiltrated_state.GetName] หากพวกเขายอมทุมทรัพยากร ก็อาจบดขยี้ฐานนี้ไดดวยปฏิบัติการทางทหารแบบประสานกําลัง"
 wtt_infiltration.5.a: "หวังวาจะไมถึงขั้นนั้น"
 wtt_infiltration.6.t: "พื้นที่ฐานที่มั่น [infiltrated_state.GetName] ถูกโจมตี"
 wtt_infiltration.6.desc: "กองกําลังขาศึกไดเริ่มโจมตีพื้นที่ฐานที่มั่นของเราใน [infiltrated_state.GetName] แลว เราไมไดรับขาวสารจากสหายในรัฐนั้นเลย แตสื่อของขาศึกรายงานถึงการสิ้นสุดของ "ยุทธการโอบลอมและกวาดลาง [infiltrated_state.GetName]" เราตองเตรียมใจรับสิ่งเลวรายที่สุด"
 wtt_infiltration.6.a: "การปฏิวัติประสบความถดถอย"
 wtt_infiltration.10.t: "การลุกฮือของคอมมิวนิสต"
 wtt_infiltration.10.desc: "มีความเคลื่อนไหวบางอยางในพรรคคอมมิวนิสต หนวยขาวกรองของเราไดสกัดจับผูสงสารหลายรายที่เดินทางระหวางพื้นที่ฐานที่มั่น ซึ่งพกคําสั่งลับที่กลาวถึง "การตีโตแหงการปฏิวัติ" ที่กําลังเตรียมการอยูในฐานลับทั่วประเทศ มีการรวบรวมทหารและเสบียงสําหรับปฏิบัติการใหญ - บางทีอาจถึงขั้นลุกฮือทั่วประเทศ เราตองเตรียมการทันที"
 wtt_infiltration.10.a: "เตรียมสูเพื่อจีน!"
 wtt_infiltration.21.t: "พบหนวยคอมมิวนิสตใน [infiltrated_state.GetName]"
 wtt_infiltration.21.desc: "จากขอมูลที่หนวยขาวกรองรวบรวมได หนวยลาดตระเวนของเราไดพบพื้นที่ฐานที่มั่นสําคัญของคอมมิวนิสต เราควรโจมตีทันที กอนที่พวกเขาจะจัดระเบียบไดมากขึ้นและตอตานความพยายามกําจัดของเรา"
 wtt_infiltration.21.a: "ความรวดเร็วคือหัวใจสําคัญ"
 wtt_infiltration.23.t: "ภัยคอมมิวนิสตกําลังลดลง?"
 wtt_infiltration.23.desc: "การบุกคนแหลงซองสุมของคอมมิวนิสตที่รูจักหลายครั้งพบขอมูลใหมนอยมากเกี่ยวกับขอบเขตการแทรกซึมของคอมมิวนิสต การสอบสวนอยางละเอียดตอคอมมิวนิสตที่ถูกจับกุมก็ไมไดเผยสิ่งใดที่เราไมเคยรูมากอน \n\nดูเหมือนวาหนวยขาวกรองของเราจะควบคุมสถานการณไดคอนขางดี"
 wtt_infiltration.23.a: "เราควรกวาดลางหนวยไมกี่หนวยที่เรารูจัก"
 wtt_infiltration.24.a: "หวังวาเราจะกําจัดพวกมันไดหมดแลว"
 wtt_infiltration.24.t: "ปราบภัยคอมมิวนิสตไดแลว"
 wtt_infiltration.24.desc: "ดูเหมือนวาคอมมิวนิสตไดรับความเสียหายและความถดถอยอยางหนักในชวงไมกี่เดือนที่ผานมา เจาหนาที่ของเราสกัดจับขาวสารจากกองบัญชาการพรรคคอมมิวนิสตไดมากขึ้นเรื่อย ๆ ซึ่งสอบถามสถานะของผูนําทองถิ่น - บอยครั้งหลังจากที่เราจับกุมผูนําเหลานั้นแลวซุมรอผูสงสาร ในขณะนี้ ดูเหมือนวาคอมมิวนิสตกําลังเสียเปรียบ องคกรระดับรัฐของพวกเขาถูกทําลายจนแทบไรประสิทธิภาพ \n\nอยางไรก็ตาม เราตองเฝาระวังตอไป เพราะตราบใดที่พรรคคอมมิวนิสตยังดํารงอยูในรูปแบบใดก็ตาม พวกเขาก็อาจตัดสินใจเคลื่อนไหวใหมได"
 CHI_xian_warlords_upset: "เรื่องนี้จะทําใหขุนศึกไมพอใจ พวกเขาอาจตัดสินใจ§Rออกจากฝายของคุณ§! ปฏิเสธความพยายามควบคุมของคุณ และจะจดจําการดูหมิ่นครั้งนี้ไปในอนาคต"
 wtt_xian_incident.1.t: "คําเชิญจาก [From.GetLeader]"
 wtt_xian_incident.1.desc: "[From.GetLeader] ไดสงคําเชิญอยางเปนทางการถึง [CHI.GetLeader] ใหมาพบกันที่ซีอานเพื่อหารือถึงสถานการณปจจุบันและขั้นตอนตอไปในการตอสูกับคอมมิวนิสต\n\nการปฏิเสธคําเชิญนี้จะถูกมองวาเปนการดูหมิ่นสวนตัวโดย [From.GetLeader] และขุนศึกคนอื่น ๆ ยอมสังเกตเห็นอยางไมตองสงสัย"
 wtt_xian_incident.1.a: "ไป"
 wtt_xian_incident.1.b: "ไมไป"
 wtt_xian_incident.2.t: "[From.GetLeader] เดินทางถึงซีอาน"
 wtt_xian_incident.2.desc: "[From.GetLeader] เดินทางมาซีอานพรอมผูคุมกันเพียงไมกี่คนเพื่อหารือสถานการณกับเรา เขายอมคาดหวังใหเรายืนยันพันธะในการตอสูกับคอมมิวนิสตเพื่อกวาดลางพวกเขาใหสิ้น แตเมื่อกองทัพญี่ปุนมาประชิดหนาประตูบานแลว เราตองทําใหเขาเขาใจอยางชัดเจน"
 wtt_xian_incident.2.a: "ขอใหเขารวมเปนพันธมิตรกับคอมมิวนิสต"
 wtt_xian_incident.3.t: "[From.GetLeader] ปฏิเสธการพบปะ"
 wtt_xian_incident.3.desc: "[CHI.GetLeader] อางวาเปนหวัดหนัก จึง 'จําใจ' ปฏิเสธคําเชิญของเรา ยังตองรอดูวานี่หมายความวาเขาวางแผนจะเขาควบคุมดินแดนของเราโดยตรงมากขึ้นในเร็ว ๆ นี้ หรือมีใครแอบปลอยแผนการของเราใหเขารู"
 wtt_xian_incident.3.a: "บางทีเขาอาจเปนหวัดจริง ๆ ก็ได?"
 wtt_xian_incident.4.t: "[From.GetLeader] เสนอใหรวมเปนพันธมิตรกับคอมมิวนิสต"
 wtt_xian_incident.4.desc: "ในการประชุมที่ซีอาน [From.GetLeader] ไดยื่นขอเสนอที่นาประหลาดใจ: เขาเชื่อวาเราควรสรางพันธมิตรกับคอมมิวนิสต เพื่อเผชิญภัยคุกคามจากญี่ปุนในฐานะแนวรวมที่เปนเอกภาพ"
 wtt_xian_incident.4.a: "บางทีเขาอาจพูดถูก"
 wtt_xian_incident.4.b: "เรายังจําไดวาครั้งที่แลวจบลงอยางไร"
 wtt_xian_incident.5.t: "[CHI.GetLeader] เสนอการเปนพันธมิตร"
 wtt_xian_incident.5.desc: "ดูเหมือนวาฝายชาตินิยมจะเหนื่อยหนายกับการพยายามลบเราออกจากแผนที่ในที่สุด ในการประชุมที่ซีอาน [CHI.GetLeader] ดูเหมือนจะตกลงที่จะพิจารณาความเปนไปไดในการเปนพันธมิตรกับเราเพื่อตอตานญี่ปุน\n\nเราควรชั่งนํ้าหนักทางเลือกอยางรอบคอบ"
 wtt_xian_incident.5.a: "ญี่ปุนเปนภัยคุกคามที่ใหญกวา"
 wtt_xian_incident.5.b: "ไมมีการตกลงกับฝายชาตินิยม!"
 reject_second_united_front_tt: "§Rการเลือกตัวเลือกนี้หมายความวาแนวรวมครั้งที่สองจะไมเกิดขึ้น§!" 
 wtt_xian_incident.6.t: "[From.GetLeader] ปฏิเสธการเปนพันธมิตรกับคอมมิวนิสต"
 wtt_xian_incident.6.desc: "แมเราจะโตแยงและเรียกรองใหหยุดสงครามที่ไรประโยชนนี้ [From.GetLeader] ก็ปฏิเสธที่จะพิจารณาแนวคิดเรื่องแนวรวมกับคอมมิวนิสต ชัดเจนวาจําเปนตองใชมาตรการที่เด็ดขาดกวานี้ เราควรจับกุมเขาและสงตัวใหคอมมิวนิสตหรือไม?"
 wtt_xian_incident.6.a: "นี่คือทางเลือกเดียวของเรา"
 wtt_xian_incident.6.b: "นั่นอาจบานปลายจนควบคุมไมได"
 wtt_xian_incident.7.t: "[CHI.GetLeader] ถูกจับกุมใน [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.7.desc_a: "[CHI_xian_instigator.GetLeader] ไดสงสารมาวาเขาไดจับกุม [CHI.GetLeader] แลว และยินดีสงตัวใหเรา \n\nนี่อาจเปนโอกาสที่ดีที่สุดเทาที่เราจะมีในการประหารศัตรูของประชาชนผูนี้!"
 wtt_xian_incident.7.desc_b: "[From.GetLeader] ปฏิเสธขอเสนอของเราที่จะประหาร [CHI.GetLeader] แตเราตองรวมเปนพันธมิตรกับฝายชาตินิยมแทน เพราะดูเหมือนวาเรายังไมพรอมจะนําการปฏิวัติและปองกันตนเองจากญี่ปุนไปพรอมกัน"
 wtt_xian_incident.7.a: "ขอความเห็นชอบจากโซเวียต"
 wtt_xian_incident.7.b: "ตัดหัวมัน!"
 wtt_xian_incident.7.c: "เราควรรวมเปนพันธมิตรกับเขาเพื่อตอตานญี่ปุน"
 wtt_xian_incident.7.d: "ปฏิเสธแนวคิดเรื่องแนวรวมครั้งที่สอง"
 wtt_xian_incident.7.e: "ทั้ง $PRC_mao_zedong$ และ $PRC_zhang_guotao$ ตางเห็นพองวา [CHI.GetLeader] ไวใจไมได"
 wtt_xian_incident.8.t: "[From.GetLeader] จับกุม [CHI.GetLeader]!"
 wtt_xian_incident.8.desc: "เราสกัดจับสารจาก [From.GetLeader] ได ซึ่งระบุวาเขาควบคุมตัว [CHI.GetLeader] ไวและตองการสงตัวใหคอมมิวนิสต เมื่อพิจารณาถึงความเกลียดชังที่พวกเขามีตอเขาแลว เขาคงรอดชีวิตไดไมนาน \n\nหากเราไมตองการเห็น [CHI.GetLeader] ถูก [PRC.GetLeader] นําขึ้นศาลเพื่อการแสดงและประหารชีวิต เราตองลงมืออยางรวดเร็วและเด็ดขาด!"
 wtt_xian_incident.8.a: "สงทหารเขาไป!"
 wtt_xian_incident.8.b: "พวกเขาคงไมทํารายเขา รอดูกอน"
 wtt_xian_incident.9.t: "[CHI.GetLeader] ถูกจับกุมใน [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.9.desc: "[PRC.GetLeader] ไดสงสารมาวาคอมมิวนิสตมีโอกาสพิเศษที่จะนํา [CHI.GetLeader] ขึ้นศาลในขอหากออาชญากรรมตอประชาชนและการปฏิวัติ การประหารเขาจะเปนชัยชนะครั้งใหญของพรรคคอมมิวนิสตในการชวงชิงการนําในจีน \n\nอยางไรก็ตาม การทําเชนนั้นจะบั่นทอนฝายชาตินิยมในชวงเวลาวิกฤต และอาจเปดทางใหญี่ปุนรุกคืบในจีนไดมากขึ้น"
 wtt_xian_incident.9.a: "ศัตรูกระฎมพีอีกรายพบจุดจบ"
 wtt_xian_incident.9.b: "เรายังตองการเขาอยู"
 wtt_xian_incident.10.t: "[PRC.GetLeader] เสนอการเปนพันธมิตร"
 wtt_xian_incident.10.desc: "แทนที่จะเปนการพิจารณาคดีเพื่อการแสดงและการประหารชีวิตตามที่คาดไว คอมมิวนิสตกลับสงสัญญาณวาพวกเขาตองการเปนพันธมิตรอยางเปนทางการเพื่อตอตานญี่ปุน \n\nเห็นไดชัดวาพวกเขากําลังถวงเวลา เพราะรูวาหากถูกรุกหนักอีกครั้งพวกเขาจะถูกกวาดลางสิ้น หากพวกเขาตองการให [CHI.GetLeader] ตายจริง ๆ เขาคงถูกประหารไปแลว\n\nอยางไรก็ตาม บางคนในรัฐบาลของเราสงสัยวาทําไมคอมมิวนิสตจึงผลักดันการเปนพันธมิตรในตอนนี้ - บางทีพวกเขาอาจรูอะไรบางอยางที่เราไมรู?"
 wtt_xian_incident.10.a: "ตราบใดที่พวกเขาทําตามคําสั่งของเรา"
 wtt_xian_incident.10.b: "ไมมีการตกลงกับคอมมิวนิสต!"
 wtt_china_shared.1.t: "[From.GetNameDefCap] เสนอการสนับสนุน"
 wtt_china_shared.1.desc: "[From.GetLeader] เดินทางมาถึงเมืองหลวงของเราเพื่อหารือถึงสถานการณของเรา ในการพบปะกับนักเคลื่อนไหวเพื่อเอกราชและรัฐบาล เขากลาววาเอกราชของเราเปนผลประโยชนสําคัญของชาติ [From.GetNameDef] และพวกเขายินดีสนับสนุนความพยายามใด ๆ ที่จะกาวไปสูความเปนอิสระที่มากขึ้น"
 wtt_china_shared.1.a: "ยินดีรับความชวยเหลือของพวกเขาอยางยิ่ง"
 wtt_china_shared.1.b: "เราพอใจกับสถานการณปจจุบันของเราดีอยูแลว"
 wtt_china_shared.2.t: "[From.GetNameDefCap] ยอมรับการสนับสนุนของเรา"
 wtt_china_shared.2.desc: "ในการสนทนาสวนตัว เจาหนาที่รัฐบาลจาก [From.GetNameDef] แสดงความสนใจอยางมากวาเราจะชวยสนับสนุนรัฐเอกราชไดอยางไรบาง มีการจัดสรรเงินทุนใหกลุมที่เรียกรองความเปนอิสระมากขึ้น และเราไดเริ่มจัดตั้ง "รัฐบาลพลัดถิ่นเฉพาะกาลแหง[From.GetAdjective]เสรี""
 wtt_china_shared.2.a: "การตอสูของพวกเขาคือการตอสูของเรา"
 wtt_china_shared.3.t: "[From.GetNameDefCap] ปฏิเสธการสนับสนุนของเรา"
 wtt_china_shared.3.desc: "[From.GetLeader] แจงเราผานบันทึกอันเขมงวดวารัฐบาลของเขาจะไมยอมใหมีการแทรกแซงกิจการภายในของ[From.GetAdjective] พิธีการทางการทูตไมอนุญาตใหประกาศให [From.From.GetLeader] เปนบุคคลที่ไมพึงปรารถนาและหามเขาประเทศ แตในทางปฏิบัติ คณะผูแทนของเราแทบทั้งหมดกลับถูกหามไมใหกลับเขา [From.GetNameDef] อีก"
 wtt_china_shared.3.a: "นาเสียดาย"
 wtt_china_shared.4.t: "ขบวนการเอกราชใน [From.GetNameDef] เขมแข็งขึ้น"
 wtt_china_shared.4.desc: "ดูเหมือนวาการเยือน [From.GetNameDef] ของ [From.From.GetLeader] เมื่อเร็ว ๆ นี้ไมใชแคการจิบชาแลกเปลี่ยนไมตรี เมื่อไมนานมานี้ ขบวนการเอกราชในประเทศที่เคยแยกกันและแตกเปนเสี่ยง ๆ ไดเริ่มประสานงานกันไดดีขึ้นมาก แทบจะดูเหมือนมีใครบางคนชวยจัดระเบียบพวกเขาจากตางประเทศ"
 wtt_china_shared.4.a: "นากังวลใจ"
 wtt_china_shared.10.t: "ฝูงบินเสือบิน"
 wtt_china_shared.10.desc_a: "ซง เหมยหลิง ภริยาของเจียง ไคเชกและหนึ่งในที่ปรึกษาที่เขาไววางใจที่สุด ไดเดินทางไปวอชิงตันเพื่อวิ่งเตนขอการสนับสนุนจีนเพิ่มเติมในการตอสูกับญี่ปุน กองทัพอากาศจีนตองการเครื่องบินสมัยใหมและนักบินฝมือดีอยางยิ่งยวด\n\nคําวิงวอนของซงไดรับเสียงตอบรับจากสาธารณชน และนักบินของเราจํานวนหนึ่งไดลาออกจากราชการเพื่อไปสมัครกับบริษัทจีนแหงหนึ่งในการให "การฝกอบรมและการสอน" แกนักบินจีน\n\nเมื่อเรื่องนักบินคลี่คลายแลว ซง เหมยหลิงไดติดตอเราเพื่อขออนุญาตโอนเครื่องบินขับไลที่ทันสมัยที่สุดของเราราว 150 ลํา เพื่อติดอาวุธใหมใหกองทัพอากาศจีน"
 wtt_china_shared.10.desc_b: "สงครามในจีนไดสรางความสูญเสียแกกองทัพอากาศจีนอยางหนัก แมจะมีจํานวนและอาวุธนอยกวาฝายตรงขาม พวกเขาก็สูอยางกลาหาญเพื่อชวงชิงนานฟาเหนือจีน \n\nแมนักบินจะกลาหาญ แตกองทัพอากาศ[From.GetAdjective]ก็กําลังแสวงหาเครื่องบินและนักบินใหมมาทดแทนความสูญเสียอยางสิ้นหวัง คณะผูแทนที่ [From.GetLeader] สงมาไดเดินทางถึงวอชิงตันเพื่อเจรจาการโอนเครื่องบินขับไลสมัยใหมราว 150 ลํา และอนุญาตใหนักบินจํานวนใกลเคียงกันเดินทางไปจีนเพื่อบินเครื่องบินเหลานั้น"
 wtt_china_shared.10.a: "เราตองสนับสนุนพวกเขาทุกวิถีทาง"
 wtt_china_shared.10.b: "เราตองไมปลอยใหตัวเองถูกดึงเขาไปในความขัดแยงนี้"
 wtt_china_shared.11.t: "กลุมอาสาสมัครโซเวียต"
 wtt_china_shared.11.desc_a: "การสูรบอยางตอเนื่องในจีนทําใหจําเปนตองใหการสนับสนุนทางอากาศแกสหายของเราในกองทัพแดง[From.GetAdjective] [From.GetLeader] ไดติดตอเราเรื่องการสงกลุมอาสาสมัครนักบินและเครื่องบิน เขาขอเครื่องบินทิ้งระเบิดราว 50 ลํา และเครื่องบินขับไล 100 ลําเพื่อคุมกัน \n\nสิ่งนี้อาจใหประสบการณอันมีประโยชนแกนักบินของเรา และทําใหเราไดทดสอบแบบเครื่องบินใหมลาสุดในการรบจริง"
 wtt_china_shared.11.desc_b: "ขณะที่สงครามในจีนยังดําเนินตอไป กองทัพอากาศ[From.GetAdjective]ตองกระจายกําลังจนบางเบาในการพยายามปองกันนานฟาเหนือ [From.GetNameDef] และใหการสนับสนุนทางอากาศแกกองทหารที่สูรบ [From.GetLeader] ไดรองขอเปนการสวนตัวตอ [SOV.GetLeader] ใหสงความชวยเหลือในรูปของกองกําลังผสมที่มีเครื่องบินทิ้งระเบิดขนาดกลางราว 50 ลํา และเครื่องบินขับไล 100 ลํา\n\nนี่อาจเปนโอกาสอันมีประโยชนในการทดสอบยุทโธปกรณที่ทันสมัยที่สุดของเราในสภาพการรบจริง"
 wtt_china_shared.11.a: "เราตองสนับสนุนพวกเขาทุกวิถีทาง"
 wtt_china_shared.11.b: "พวกเขาตองใชเทาที่มีไปกอน"
 wtt_china_shared.12.t: "นายพลคนใหมสําหรับ [From.GetNameDef]"
 wtt_china_shared.12.desc: "[From.GetLeader] ไดสงจดหมายถึง [USA.GetLeader] เสนอใหเราสงนายพลคนหนึ่งไปทําหนาที่เสนาธิการใหกองทัพ[From.GetAdjective] \n\nการทําเชนนั้นจะทําใหเราไดรับความซาบซึ้งเปนการสวนตัวจาก [From.GetLeader] และอาจใหประสบการณอันมีคาแกนายพลของเรา อีกทั้งชวยใหกองกําลังของ [From.GetLeader] ชนะสงคราม\n\nเราควรสงนายพลคนใดไป?"
 wtt_china_shared.12.a: "สงโจเซฟ สติลเวลล"
 wtt_china_shared.12.b: "พวกเขาตองชวยเหลือตัวเอง"
 wtt_china_shared.12.c: "สงดักลาส แมกอาเธอร"
 wtt_china_shared.12.d: "สงดไวต ไอเซนฮาวร"
 wtt_china_shared.13.t: "[CHI_USA_General.GetName] เดินทางมาจีน"
 wtt_china_shared.13.desc: "[From.GetLeader] ไดตอบรับคําขอความชวยเหลือของเรา และสั่งให [CHI_USA_General.GetName] มารายงานตัวปฏิบัติหนาที่ที่จีนโดยเร็วที่สุด\n\nนายพลผูนี้ไมไดเปนเพียงที่ปรึกษาของ [Root.GetLeader] เทานั้น แตยังจะบัญชาการกองทหารในสนามรบดวย ซึ่งจะทําใหเขาไดประสบการณตรงในการรบในสงครามสมัยใหม"
 wtt_china_shared.13.a: "กําลังเสริมอันมีคา"
 wtt_china_shared.14.t: "ไมมีความชวยเหลือจาก [From.GetNameDef]"
 wtt_china_shared.14.desc: "คําขอของเราถึง [From.GetLeader] ไมไดรับความสนใจ แมนายทหารระดับสูงหลายนายในกองทัพบกสหรัฐฯ จะแสดงความเต็มใจรับภารกิจนี้ แตรัฐมนตรีวาการกระทรวงกลาโหมและประธานาธิบดี [From.GetLeader] ตางใชสิทธิ์ยับยั้งแนวคิดนี้วาไมสามารถทําไดจริงและไมเปนประโยชนตอชาติ"
 wtt_china_shared.14.a: "พวกเขาขี้ขลาด โงเขลา หรือทั้งสองอยาง?"
 wtt_prc.1.t: "[From.GetLeader] เสนอการเปนพันธมิตร"
 wtt_prc.1.desc: "หลังจากความขัดแยงอันไรผลมาหลายป และดวยภัยคุกคามจากญี่ปุนที่ปรากฏอยูเบื้องหลัง คอมมิวนิสตไดติดตอเราพรอมขอเสนอใหจัดตั้งรัฐบาลรวม กองทัพของเราจะสูเคียงบาเคียงไหลกัน และเราจะประสานนโยบายรวมกัน\n\nแรงจูงใจเบื้องหลังการเปลี่ยนใจกะทันหันของคอมมิวนิสตยังไมชัดเจนนัก และบางคนในรัฐบาลเชื่อวานี่เปนเพียงขั้นแรกของแผนการยึดครองประเทศ"
 wtt_prc.1.a: "เราตองรวมกันตอตานศัตรู"
 wtt_prc.1.b: "เราจะไมหลงกลลูกไมราคาถูกนี้"
 wtt_prc.2.t: "[From.GetLeader] ปฏิเสธการเปนพันธมิตร"
 wtt_prc.2.desc: "หลังจากไตรตรองอยูนาน [From.GetLeader] ไดตัดสินใจไมรับคณะผูแทนของเรา แหลงขาวของเราในรัฐบาลรายงานวาเขามองเห็นแผนสมคบคิดของคอมมิวนิสตไปทุกหนแหง และเชื่อวาเรากําลังพยายามยึดรัฐบาลและแยงชิงประเทศไปจากเขา"
 wtt_prc.2.a: "ชางหวาดระแวงเสียจริง"
 wtt_prc.10.t: "[From.GetNameDefCap] เรียกรองความรวมมือจากเรา"
 wtt_prc.10.desc: "หลังการจัดตั้งรัฐบาลปองกันประเทศ [From.GetNameDef] ไดแสดงใหเห็นชัดวาจะไมยอมใหมี "ความเปนอิสระเกินควรและการไมเชื่อฟง" ใด ๆ เมื่อสงครามกับญี่ปุนมีแนวโนมจะเกิดขึ้นมากขึ้นเรื่อย ๆ ใครก็ตามที่ไมยืนขางรัฐบาลปองกันประเทศจะถูกมองวาเปนศัตรูที่อาจเกิดขึ้น และ [From.GetLeader] ไดกลาวอยางเปดเผยวาจะไมรอจนสงครามปะทุขึ้นกอนจะเคลื่อนไหวตอขุนศึกที่ไมยอมสยบ"
 wtt_prc.10.a: "เราขอเสี่ยงอยูขางรัฐบาล"
 wtt_prc.10.b: "เจาโงขี้โวนั่นเห็นไดชัดวากําลังขูลม ๆ แลง ๆ"
 wtt_prc.11.t: "[From.GetNameDefCap] เขารวมรัฐบาลปองกันประเทศ"
 wtt_prc.11.desc: "[From.GetLeader] ไดเห็นแกเหตุผลและตัดสินใจเขารวมพันธมิตรของเรา บัดนี้กองกําลังของเขาจะสนับสนุนเราในการรบที่จะมาถึง"
 wtt_prc.12.t: "[From.GetNameDefCap] ปฏิเสธ"
 wtt_prc.12.desc: "ดวยเหตุผลที่เหลือจะเขาใจ [From.GetLeader] ปฏิเสธที่จะรวมมือกับเราแมในเรื่องพื้นฐานที่สุด เขาอางวาเราเปนแคกลุมโจรที่จะถูกกําจัดในไมชา และไดเรียกรองใหขุนศึกคนอื่น ๆ รวมตอตานกับเขา"
 wtt_prc.12.a: "เขาจะตองถูกปราบใหสยบ"
 PRC_provoke_japan_korea: "เกาหลี"
 PRC_provoke_japan_manchuria: "แมนจูเรีย"
 wtt_prc.20.t: "การยั่วยุของจีน"
 wtt_prc.20.desc: "มีรายละเอียดใหมเกี่ยวกับการโจมตีครั้งลาสุดบนแผนดินของเรา แมจะยังจับกุมผูกอเหตุไมไดแมแตคนเดียว แตหลักฐานชี้ชัดวาเปนการยั่วยุโดยเจตนาของจีน \n\nรัฐบาลจีนประณามการโจมตีลาชาอยางนาสงสัย และหนังสือพิมพจีนยังยกยองวาเปนการกระทําอันกลาหาญในการตอตาน "จักรวรรดินิยมญี่ปุน"\n\nคณะรัฐมนตรีไดประชุมเพื่อหารือและเสนอมาตรการรับมือกับการจูโจมอยางโจงแจงนี้"
 wtt_prc.20.a: "เรียกรองคําขอโทษ"
 wtt_prc.20.b: "ระดมทหารและเตรียมทําสงคราม"
 wtt_prc.21.t: "โรงงานผลิตอาวุธถูกกอวินาศกรรม"
 wtt_prc.21.desc: "มีรายงานจากโรงงานแหงหนึ่งของเราใน [JAP.GetManchuriaPuppet] วาเกิดเพลิงไหมครั้งใหญเมื่อคืนนี้ นักดับเพลิงในพื้นที่ยังคงตอสูกับเปลวไฟ แตมั่นใจวาจะควบคุมเพลิงไดภายในวันนี้ ความเสียหายตอโรงงานดูเหมือนจะมีนัยสําคัญ เนื่องจากไฟดูเหมือนจะเริ่มตนในพื้นที่จัดเก็บสารเคมีไวไฟสูง\n\nหนวยขาวกรองทางทหารไดเริ่มสืบสวนอยางละเอียดเพื่อหาวาไฟลุกขึ้นไดอยางไรทั้งที่มีมาตรการความปลอดภัยเขมงวดที่สุด เบาะแสแรกชี้วามีความเปนไปไดสูงที่จะเปนการลอบวางเพลิง"
 wtt_prc.21.a: "ใครกันจะทําเรื่องเชนนี้?"
 wtt_prc.22.t: "โรงงานพลเรือนถูกกอวินาศกรรม"
 wtt_prc.23.t: "สะพานถูกระเบิด"
 wtt_prc.23.desc: "ชวงใดชวงหนึ่งเมื่อคืนนี้ สะพานรถไฟสําคัญแหงหนึ่งใน [JAP.GetManchuriaPuppet] พังถลมลงภายใตนํ้าหนักของขบวนรถไฟบรรทุกกระสุนที่แลนผาน การกูภัยและเก็บกูเปนไปอยางยากลําบากเนื่องจากกระสุนระเบิดตอเนื่อง ลูกเรือของขบวนรถไฟยังคงสูญหายและคาดวาเสียชีวิตแลว\n\nหนวยขาวกรองทางทหารไดสงทีมไปสืบสวนที่เกิดเหตุทันทีที่ปลอดภัย เพื่อหาวาสะพานที่แข็งแรงพังลงไดอยางไรโดยไมมีสัญญาณเตือน\n\nพยานในทองถิ่นรายงานวาเห็นกลุมคนเล็ก ๆ ในหุบเขาใตสะพานในวันกอนสะพานถลม ขณะนี้ยังไมทราบที่อยูของพวกเขา"
 wtt_prc.24.t: "หนวยลาดตระเวนถูกซุมโจมตี"
 wtt_prc.24.desc: "หนวยลาดตระเวนหนวยหนึ่งของเราใน [JAP.GetManchuriaPuppet] ขาดการรายงานตัว คณะคนหาที่ติดตามไปตามเสนทางลาดตระเวนพบสมรภูมิซึ่งมีรองรอยวาหนวยลาดตระเวนถูกจูโจมโดยไมทันตั้งตัวและถูกกวาดลางในการตอสูประชิดตัวอยางโหดเหี้ยม\n\nยังไมทราบวาฝายโจมตีสูญเสียหรือไม แตศพที่พบลวนเปนทหารกองทัพญี่ปุนทั้งสิ้น\n\nดูราวกับวาศพเหลานี้ถูกทิ้งไวโดยเจตนา บางทีอาจเพื่อสงสาร"
 wtt_japan.1.t: "[From.GetNameDefCap] ตองการเปนเจาเหนือหัวอาณานิคมของเรา"
 wtt_japan.1.desc: "ฝาย[From.GetAdjective]ฉวยโอกาสจากความออนแอของเรา เสนอที่จะ 'ชวย' เรา 'รักษาความสงบเรียบรอย' ในอาณานิคม พวกเขาใหเหตุผลวาเมื่อแผนดินแมของเราลมสลายแลว เราก็ไมมีทางรักษาการควบคุมไวได\n\nเห็นไดชัดวานี่เปนกลอุบายเพื่อชวงชิงการควบคุมอาณานิคมไปจากเรา แตเรามีทางเลือกอะไร?"
 wtt_japan.1.a: "ถึงเวลายอมรับความเปนใหญของญี่ปุนในโลกตะวันออกแลว"
 wtt_japan.1.b: "พวกเขาตองใชกําลังยึดเอาเอง!"
 wtt_japan.2.t: "[From.GetNameDefCap] มอบสิทธิ์เปนเจาเหนือหัวอาณานิคม"
 wtt_japan.2.desc: "[From.GetNameDefCap] ไดพิจารณาขอเสนอของเราที่จะ 'รักษาความสงบเรียบรอย' ในอาณานิคมของพวกเขาอยางรอบคอบ และตัดสินใจยอมรับ พวกเขาไดโอนการควบคุมทั้งหมดมาใหเราโดยปริยาย"
 wtt_japan.2.a: "การตัดสินใจที่ชาญฉลาด"
 wtt_japan.3.t: "[From.GetNameDefCap] ปฏิเสธการใหเปนเจาเหนือหัวอาณานิคม"
 wtt_japan.3.desc: "[From.GetNameDefCap] ไดพิจารณาขอเสนอของเราที่จะ 'รักษาความสงบเรียบรอย' ในอาณานิคมของพวกเขาอยางรอบคอบ และตัดสินใจปฏิเสธ"
 wtt_japan.3.a: "คอยดูวาผลจะออกมาอยางไรสําหรับพวกเขา"
 wtt_japan.11.t: "สนธิสัญญาไมรุกรานกับ [From.GetNameDef]"
 wtt_japan.11.desc: "แมความตึงเครียดระหวาง[From.GetAdjective]กับ [Root.GetNameDef] จะเพิ่มขึ้นจนกระทั่งไมนานมานี้ แตบัดนี้ฝาย[From.GetAdjective]ไดเปดการเจรจาสนธิสัญญาไมรุกราน ขอดีตอเรานั้นชัดเจน แตสิ่งที่ควรกังวลคือขอไดเปรียบที่มันจะมอบใหฝาย[From.GetAdjective] และเราจะตองมาเสียใจกับการตัดสินใจนี้ภายหลังหรือไม"
 wtt_japan.11.a: "เราตองมีสันติภาพ... ในตอนนี้"
 wtt_japan.11.b: "การไมใหพวกเขาไดเปรียบสําคัญกวา!"
 wtt_japan.12.t: "[From.GetNameDefCap] ยอมรับสนธิสัญญาไมรุกราน"
 wtt_japan.12.desc: "[From.GetNameDefCap] ไดตอบรับขอเสนอสนธิสัญญาไมรุกรานของเราอยางเปนทางการ"
 wtt_japan.12.a: "พวกเขาเดินเขากับดักของเราพอดี"
 wtt_japan.13.t: "[From.GetNameDefCap] ปฏิเสธสนธิสัญญาไมรุกราน"
 wtt_japan.13.desc: "ดวยเหตุผลบางประการ [From.GetNameDef] ไดปฏิเสธขอเสนอสนธิสัญญาไมรุกรานของเรา"
 wtt_japan.13.a: "พวกเขากําลังวางแผนเลนงานเราหรือ?"
 wtt_japan.21.t: "การแลกเปลี่ยนนายพล[From.GetAdjective]"
 wtt_japan.21.desc: "ฝาย[From.GetAdjective]ตัดสินใจเรียกตัวขาราชการและนายพลฝายซายของตนกลับ และสงนายพลกับขาราชการฝายขวามาใหเราแทนในฐานะผูลี้ภัยอยางไมเปนทางการ"
 wtt_japan.21.a: "ดูเหมือนจะมีอะไรบางอยางเกิดขึ้นใน [From.GetNameDef]..."
 wtt_japan.22.t: "แลกเปลี่ยนนายพล[Root.GetAdjective]แลว"
 wtt_japan.22.desc: "กระบวนการแลกเปลี่ยนนายพลและขาราชการฝายขวาของเรากับฝายซายที่เราเคยสงไปลี้ภัยอยางไมเปนทางการใน [From.GetNameDef] ไดเสร็จสิ้นลงแลว"
 wtt_japan.22.a: "สิ่งนี้จะเสริมความมั่นคงในการกุมอํานาจเหนือ [Root.GetNameDef] ของเรา"
 wtt_japan.31.t: "ชะตากรรมของราชวงศจักรพรรดิ"
 wtt_japan.31.desc: "ถึงเวลาแลวที่จะตัดสินชะตากรรมของสมเด็จพระจักรพรรดิและพระราชวงศ สถานะทางสังคมโดยกําเนิดไมมีที่ยืนในญี่ปุนที่เรากําลังสรางขึ้น พวกเขาควรจะเปนอยางไร?"
 wtt_japan.31.a: "เนรเทศพวกเขา!"
 wtt_japan.31.b: "ตัดหัวพวกเขา!"
 wtt_japan.32.t: "ราชวงศจักรพรรดิพลัดถิ่น"
 wtt_japan.32.desc: "[From.GetNameDefCap] ไดเนรเทศราชวงศจักรพรรดิ ซึ่งนับเปนคุณูปการอันใหญหลวงแกเรา! บัดนี้พระองคเสด็จถึง [Root.GetNameDef] แลว และแมจะถูกเนรเทศ พระองคก็ยังทรงมีอิทธิพลตอประชาชนและกองทหารอยางมาก"
 wtt_japan.32.a: "เราตองคูควรที่จะเปนที่ประทับของพระองค!"
 wtt_japan.101.t: "การรวมแมนจูเรียกลับคืน"
 wtt_japan.101.desc: "ดวยชัยชนะเมื่อเร็ว ๆ นี้เหนือ [MAN.GetName] รัฐบาลญี่ปุนไดยอมรับความผูกพันของจีนกับภูมิภาคนี้ และไดโอนการควบคุมทั้งหมดใหเรามีผลทันที พรอมกับไมตรีนี้ พวกเขาเสนอเปนพันธมิตรกับเรา"
 wtt_japan.101.a: "บางทีเราอาจเจรจากับญี่ปุนไดจริง ๆ"
 wtt_japan.101.b: "เราจะรับแมนจูเรีย แตไมรับนํ้าใจของพวกเขา"
 wtt_japan.102.desc: "[From.GetNameDefCap] ขอบคุณเราที่คืนแมนจูเรีย และยอมรับขอเสนอเปนพันธมิตรของเรา"
 wtt_japan.103.desc: "[From.GetNameDefCap] ขอบคุณเราที่คืนแมนจูเรีย แตปฏิเสธขอเสนอเปนพันธมิตรของเรา"
 wtt_japan.104.t: "อธิปไตยของฟลิปปนส"
 wtt_japan.104.desc: "[From.GetNameDefCap] ไดแถลงอยางเปดเผยตอสาธารณะวาพวกเขา 'ไมอาจนั่งดูไดอีกตอไป' ขณะที่ชาติหนึ่งในเขตผลประโยชนของพวกเขายังคงอยูใตรองเทาบูตของตะวันตก บัดนี้พวกเขาเรียกรองใหเราเรงกําหนดเวลาการปลดปลอยอาณานิคม และมอบอธิปไตยเต็มรูปแบบแกฟลิปปนสทันที"
 wtt_japan.104.a: "พวกเขาพูดถูก ฟลิปปนสสมควรไดรับอิสรภาพ"
 wtt_japan.104.b: "ฟลิปปนสจะยังคงเปนของอเมริกา!"
 wtt_japan.105.desc: "[From.GetNameDefCap] ไดตอบสนองตอขอเรียกรองของเราเรื่องเอกราชเต็มรูปแบบของฟลิปปนส และบัดนี้รัฐบาลอเมริกันไดจัดการโดยทันทีเพื่อมอบอธิปไตยเต็มรูปแบบแกรัฐในอารักขาในแปซิฟกของตน"
 wtt_japan.105.a: "อยางนอยพวกเขาก็มีเหตุผล"
 wtt_japan.106.desc: "[From.GetNameDefCap] ไดตอบสนองตอขอเรียกรองของเราเรื่องเอกราชเต็มรูปแบบของฟลิปปนส โดยยํ้าถึง 'ผลประโยชนสําคัญของอเมริกา' ที่ฟลิปปนสมีในภูมิภาคนี้"
 wtt_japan.106.a: "แลวยังเรียกตัวเองวา 'ผูพิทักษเสรีภาพ' อีกหรือ?"
 wtt_japan.107.desc: "[From.GetNameDefCap] ไดตอบสนองตอขอเรียกรองของญี่ปุนเรื่องเอกราชเต็มรูปแบบของเรา และบัดนี้รัฐบาลอเมริกันไดจัดการโดยทันทีเพื่อมอบอธิปไตยเต็มรูปแบบแกเรา!"
 wtt_japan.107.a: "สรรเสริญญี่ปุน!"
 wtt_japan.108.t: "รัฐประหารของนายทหารหนุม"
 wtt_japan.108.desc: "กลุมนายทหารหนุมไดลอบสังหารเจาหนาที่รัฐบาลหลายคนรวมถึงนายกรัฐมนตรีสําเร็จ พวกเขายึดครองนครโตเกียวและควบคุมพระราชวังหลวงไวได พรอมประกาศเจตนาที่จะกวาดลาง 'เจาหนาที่ฉอฉล' และ 'ภัยคุกคามทางอุดมการณ' ออกจากรัฐบาล และฟนฟูใหสมเด็จพระจักรพรรดิเปนผูปกครองแตเพียงพระองคเดียวของชาติ\n\nการกระทําของพวกเขาไดรับการสนับสนุนในกองทัพมากเกินคาด ปฏิบัติการตอบโตที่วางไวถูกสกัดลวงหนาดวยการจับกุมและลอบสังหารกลุมที่ภักดีตอรัฐบาลเดิมเปนจํานวนมาก เมื่อเผชิญกับเหตุการณที่เกิดขึ้นอยางฉับพลันและรุนแรง ประกอบกับฝายกบฏควบคุมพระราชวังไวได สมเด็จพระจักรพรรดิจึงไมไดทรงประณามฝายกบฏแตอยางใด\n\nการตอตานอยางเปนระบบของรัฐบาลดูเหมือนจะพังทลายลงแลว และคาดวาฝายกบฏจะประกาศสถาปนาการควบคุมเบ็ดเสร็จขององคจักรพรรดิเหนือนโยบายภายในประเทศ การตางประเทศ และการทหารทุกดานไดทุกเมื่อ"
 wtt_japan.108.a: "เทนโนเฮกะ บันไซ!"
 wtt_japan.109.t: "ญี่ปุนเสนอกติกาสัญญาไตรภาคี"
 wtt_japan.109.desc: "[From.GetNameDefCap] ไดหยั่งเสียงความสนใจของเราตอกติกาสัญญาสามมหาอํานาจระหวางเรา ฝาย[JAP_initiator.GetAdjective] และฝาย[ITA_fascism.GetAdjective] ฝาย[JAP_initiator.GetAdjective]ใหเหตุผลวาเราจําเปนตองสนับสนุนกันและกัน เมื่อความคิดเห็นของโลกเปนปรปกษตอความพยายามของเรามากขึ้นเรื่อย ๆ"
 wtt_japan.109.a: "ความคิดที่ยอดเยี่ยม เราจะลงนามในกติกาสัญญา"
 wtt_japan.109.b: "ไม เราตองไมเสี่ยงสรางความเปนปรปกษกับทั้งโลก"
 wtt_japan.110.desc: "[JAP_initiator.GetNameDefCap] ไดหยั่งเสียงความสนใจของเราตอกติกาสัญญาสามมหาอํานาจระหวางเรา ฝาย[JAP_initiator.GetAdjective] และฝาย[GER_fascism.GetAdjective] ฝาย[JAP_initiator.GetAdjective]ใหเหตุผลวาเราจําเปนตองสนับสนุนกันและกัน เมื่อความคิดเห็นของโลกเปนปรปกษตอความพยายามของเรามากขึ้นเรื่อย ๆ ฝาย[GER_fascism.GetAdjective]ไดยืนยันการสนับสนุนแนวคิดนี้แลว"
 wtt_japan.111.t: "ลงนามกติกาสัญญาไตรภาคีแลว"
 wtt_japan.111.desc: "รัฐบาล[GER_fascism.GetAdjective]และ[ITA_fascism.GetAdjective]ตกลงลงนามในกติกาสัญญาไตรภาคีที่เสนอ โดยใหคํามั่นวาจะยืนเคียงขางเราในกรณีเกิดสงคราม"
 wtt_japan.112.t: "[From.GetNameDefCap] ปฏิเสธกติกาสัญญาไตรภาคี"
 wtt_japan.112.desc: "รัฐบาล[From.GetAdjective]ปฏิเสธกติกาสัญญาไตรภาคีที่เสนอ โดยเลือกที่จะเดินหนาตอไปเพียงลําพัง"
 wtt_japan.113.t: "[From.GetNameDefCap] ลงนามกติกาสัญญาไตรภาคี"
 wtt_japan.113.desc: "รัฐบาล[ITA_fascism.GetAdjective]ตกลงลงนามในกติกาสัญญาไตรภาคีที่เสนอ โดยใหคํามั่นวาจะยืนเคียงขางเราในกรณีเกิดสงคราม"
 wtt_japan.114.t: "ฝายประชาธิปไตยกอรัฐประหาร"
 wtt_japan.114.desc: "กลุมฝายประชาธิปไตยในรัฐบาลไดกอการยึดอํานาจประเทศอยางไมทันตั้งตัว หลังจากกองทัพขูวาจะจํากัดสิทธิประชาธิปไตยที่ประชาชนไดมาอยางยากลําบากอีกครั้ง กองทัพสวนสําคัญไดจับอาวุธขึ้นปกปองประชาชนและสิทธิเสรีภาพของพวกเขาอยางรวดเร็วจนนาประหลาดใจ\n\nความแตกแยกในกองทัพนี้เปดทางใหผูแทนของประชาชนยึดอํานาจในฝายนิติบัญญัติและฝายบริหาร แมการสูรบเพิ่งเริ่มตนขึ้น แตก็ไมนาจะโคนรัฐบาลปจจุบันไดโดยงาย"
 wtt_japan.114.a: "กองทัพจะไมมีวันปกครองเราอีก!"
 wtt_japan.115.t: "[From.GetName] โจมตีสหภาพโซเวียต"
 wtt_japan.115.desc: "[From.GetNameDefCap] ไดโจมตีสหภาพโซเวียตโดยพลการ ทั้งที่เรามีสนธิสัญญาไมรุกรานกับโซเวียต เราไมมีทางเลือกอื่นนอกจากจะรักษาพันธมิตรและสนับสนุนการโจมตีของ[From.GetAdjective] หรือรักษาสนธิสัญญาไมรุกรานกับโซเวียตและประณามการโจมตีนี้"
 wtt_japan.115.a: "เราจะเขารวมกับพันธมิตร!"
 wtt_japan.115.b: "ขอตกลงของเราละเมิดไมได... ในตอนนี้"
 wtt_japan.116.t: "[From.GetName] เขารวมสงคราม"
 wtt_japan.116.desc: "[From.GetNameDefCap] ตัดสินใจเขารวมสงครามของเราตอตานโซเวียต แมจะเคยมีสนธิสัญญาไมรุกรานกับโซเวียตมากอน"
 wtt_japan.116.a: "ก็สมควรอยูแลว"
 wtt_japan.117.t: "[From.GetName] ประณามสงครามของเรา"
 wtt_japan.117.desc: "[From.GetNameDefCap] ตัดสินใจรักษาสนธิสัญญาไมรุกรานกับโซเวียต แมจะมีพันธะตอเราในฐานะพันธมิตร พวกเขาประณามการรุกรานของเรา ดูเหมือนเปนความพยายามกอบกูสถานการณทางการทูตกับคูสนธิสัญญาของตน"
 wtt_japan.117.a: "นาเสียดายยิ่งนัก"
 wtt_japan.118.t: "[From.GetName] ขอความชวยเหลือ"
 wtt_japan.118.desc: "[From.GetNameDefCap] กําลังจมอยูในสงครามกลางเมืองอันพินาศ และมีปญหาในการตอกรกับกําลังทหารของศัตรู รัฐบาลชวงเปลี่ยนผานของพวกเขาไดติดตอผูแทนของเราพรอมขอเสนอแลกคาบสมุทรซาฮาลินใตกับความชวยเหลือทางทหารที่พวกเขาตองการอยางยิ่ง\n\nนี่อาจเปนวิธีไดดินแดนมางาย ๆ เพื่อแลกกับกองพลอาสาสมัครเพียงไมกี่กองพล"
 wtt_japan.118.a: "ความคิดที่ยอดเยี่ยม!"
 wtt_japan_118_TT: "อาสาสมัครเหลานี้จะกลับคืนสูกําลังพลสํารองหาก §Y[From.GetName]§! ชนะสงครามกลางเมือง"
 wtt_japan.118.b: "นี่ไมใชการแลกเปลี่ยนที่ดีสําหรับเรา"
 wtt_japan.119.t: "[From.GetName] ยอมรับการแลกเปลี่ยน"
 wtt_japan.119.desc: "[From.GetNameDefCap] ยอมรับขอเสนอของเราที่จะแลกคาบสมุทรซาฮาลินใตกับการสนับสนุนทางทหาร พวกเขาไดสง 'อาสาสมัคร' จํานวนหลายกองพลมาชวยเราในการตอสู!"
 wtt_japan.119.a: "พวกเขาจะมีประโยชนอยางมาก!"
 wtt_japan.119.TT: "ไดรับ 8 หนวย ซึ่งมีกองพัน§Yทหารราบ 12§! กองพัน และกองพัน§Yสนับสนุน 3§! กองพัน"
 wtt_japan.120.t: "[From.GetName] ปฏิเสธการแลกเปลี่ยน"
 wtt_japan.120.desc: "[From.GetNameDefCap] แจงเราวาไดปฏิเสธขอเสนอที่จะแลกคาบสมุทรซาฮาลินใตกับการสนับสนุนทางทหาร"
 wtt_japan.120.a: "เราตองสูตามลําพัง..."
 wtt_japan.121.t: "[From.GetName] ยึดโตเกียว"
 wtt_japan.121.desc: "[From.GetNameDefCap] ไดยึดเมืองหลวงของญี่ปุน และรัฐบาลฟาสซิสต[From.From.GetAdjective]ไดลมสลายแลว หากเราตองการลงมือ ตองทําทันที เราจําเปนตองเคลื่อนไหวอยางรวดเร็วเพื่อยึดครองหมูเกาะรอบนอกของญี่ปุนและเขาบัญชาการกลุมฟาสซิสตที่เหลืออยู หากเราตองการสกัดกั้นภัยคุกคามจากคอมมิวนิสต"
 wtt_japan.121.a: "ดําเนินแผนนี้"
 wtt_japan.121.b: "เรื่องนี้ไมอยูในความสนใจของเราในตอนนี้"
 wtt_japan.122.t: "ฟาสซิสตหนีไปแมนจูเรีย"
 wtt_japan.122.desc: "เมื่อโตเกียวถูกยึด รัฐบาลฟาสซิสตก็ลมสลาย ผูสนับสนุนและหนวยทหารที่เหลืออยูไดหนีไปยัง [MAN.GetName] ซึ่งไดเขาควบคุมหมูเกาะรอบนอกและดินแดนในเกาหลีและจีน\n\nสงครามกลางเมืองยุติลงโดยพฤตินัย แตการสงบศึกยังเปราะบางอยางยิ่ง เนื่องจากฝายฟาสซิสตยังไมพายแพอยางเด็ดขาด"
 wtt_japan.122.a: "เราจะจัดการพวกมันทีหลัง"
 wtt_japan.123.t: "การตอตานของฟาสซิสตพังทลาย"
 wtt_japan.123.desc: "เมื่อโตเกียวถูกยึด รัฐบาลฟาสซิสตก็ลมสลายโดยสิ้นเชิง ผูสนับสนุนและหนวยทหารที่เหลืออยูไมมีจุดรวมพล และเริ่มแตกกระจาย ทําใหยึดดินแดนที่เหลือและดินแดนรอบนอกไดโดยงาย"
 wtt_japan.123.a: "เราชนะสงครามแลว"
 wtt_japan.124.t: "อาสาสมัครกลับบาน"
 wtt_japan.124.desc: "เมื่อคอมมิวนิสตไดรับชัยชนะในญี่ปุน อาสาสมัครของเราที่รอดชีวิตก็ไดกลับบานแลว"
 wtt_japan.125.t: "โซเวียตคืนแมนจูเรีย"
 wtt_japan.125.desc: "หลังจากปลดปลอยแมนจูเรียจากญี่ปุนและกําจัดอดีตจักรพรรดิราชวงศชิงที่ถูกปลดออกไปแลว [From.GetNameDef] ไดเสนอคืนแมนจูเรียใหเรา โดยอางวาแมนจูเรียควรกลับคืนสูมือของ[Root.GetAdjective]อันชอบธรรม"
 wtt_japan.126.t: "[From.GetName] เสนอสันติภาพ"
 wtt_japan.126.desc: "เจาหนาที่[From.GetAdjective]ไดติดตอเราพรอมขอเสนอสันติภาพ พวกเขาจะถอนออกจากภาคพื้นทวีปทั้งหมด เพื่อแลกกับการยุติการสูรบทันที"
 wtt_japan.126.a: "เราชนะสงครามแลว"
 wtt_japan.126.b: "เราจะพอใจกับชัยชนะเบ็ดเสร็จเทานั้น!"
 wtt_japan.127.t: "[From.GetName] ยอมรับสันติภาพ"
 wtt_japan.127.desc: "[From.GetNameDef] ไดยอมรับขอเสนอสันติภาพของเรา และยุติการสูรบเพื่อแลกกับดินแดนบนภาคพื้นทวีปของเรา"
 wtt_japan.127.a: "พวกเขาเอาชนะเราได... ในตอนนี้"
 wtt_japan.128.t: "[From.GetName] ปฏิเสธสันติภาพ"
 wtt_japan.128.desc: "[From.GetNameDef] ไดปฏิเสธขอเสนอสันติภาพของเรา และประกาศวาจะทําสงครามตอไปจนกวาจะไดรับการยอมจํานนโดยไมมีเงื่อนไข"
 wtt_japan.128.a: "ถาเชนนั้นเราจะสูจนถึงที่สุด!"
 wtt_japan.40.t: "[From.GetLeader] เรียกรองแมนจูเรีย"
 wtt_japan.40.desc: "เมื่อไมกี่วันกอน รัฐบาล [From.GetNameDef] ไดเริ่มความพยายามอยางเปนระบบในการกดดันเรา บทความนําในหนังสือพิมพเรียกรองใหเราคืนแมนจูเรียสูการควบคุมของ[From.GetAdjective] นี่ไมใชเพียงการโฆษณาชวนเชื่อเพื่อบริโภคภายในประเทศ เพราะผูแทนของ [From.GetLeader] ไดหยั่งทาทีเราผานชองทางการทูตลับเพื่อใหไดขอตกลงเกี่ยวกับอนาคตของดินแดนแมนจูเรีย\n\nวันนี้ [From.GetLeader] ไดออกมาแสดงความเห็นดวยตนเอง เรียกรองใหคืนแมนจูเรียทั้งหมดแก [From.GetNameDef] โดยเร็วที่สุด มิฉะนั้นรัฐบาลของเขาจะตองทบทวนความรวมมือของเราในปจจุบัน"
 wtt_japan.40.a: "มันเปนของพวกเขา"
 wtt_japan.40.b: "พวกเขายังไมพรอมที่จะปกครองตนเอง"
 wtt_japan.41.t: "ความชวยเหลือทางทหารจาก [From.GetNameDef]"
 wtt_japan.41.desc: "กองบัญชาการใหญจักรวรรดิญี่ปุนไดตัดสินใจเปลี่ยนมุมมองทางยุทธศาสตรขั้นพื้นฐาน ในการประชุมตอหนาสมเด็จพระจักรพรรดิ รัฐมนตรีวาการกระทรวงทหารบกไดเสนอแผนใหมที่คาดวาสงครามกับสหภาพโซเวียตจะปะทุขึ้นในอนาคตอันใกล เพื่อเตรียมพรอมสําหรับสงครามนี้ กองทัพบกจักรวรรดิญี่ปุนจึงตัดสินใจวากองทัพของเราตองสามารถปองกันแนวรบบางสวนได ดวยเหตุนี้จึงไดจัดสรรยุทโธปกรณที่ลาสมัยเพียงเล็กนอยจํานวนมากใหแกเรา"
 wtt_japan.41.a: "ชางมีนํ้าใจเสียจริง"
 wtt_news.25.t: "[JAP.GetNameDefCap] เขาควบคุมอาณานิคม[From.GetAdjective]"
 wtt_news.25.desc: "เมื่อพิจารณาถึงความออนแอในปจจุบันของ [From.GetNameDef] ก็คงไมนาแปลกใจที่ฝาย[JAP.GetAdjective]จะเพิ่มแรงกดดันเพื่อควบคุมดินแดนในเอเชียตะวันออกของ[From.GetAdjective] อยางไรก็ตาม เชานี้เจาหนาที่รัฐบาล[From.GetAdjective]ไดประกาศอยางไมคาดคิดวาการควบคุมอาณานิคม[From.GetAdjective]จะถูกโอนให [JAP.GetNameDef] มีผลทันที"
 wtt_news.25.a: "เอเชียเพื่อชาวเอเชีย!"
 wtt_news.25.b: "วันอันนาเศราของยุโรป..."
 wtt_news.25.c: "นี่คือจุดจบของลัทธิอาณานิคมหรือ?"
 wtt_news.26.t: "เอกราชของฟลิปปนส"
 wtt_news.26.desc: "ผลจากแรงกดดันของ[JAP.GetAdjective] รัฐบาล[From.GetAdjective]ไดประกาศยุติการปกครองอาณานิคมของ[From.GetAdjective]เหนือหมูเกาะนี้ทันที นับแตวันนี้ [PHI.GetNameDef] ไดรับอธิปไตยเต็มรูปแบบแลว"
 wtt_news.26.b: "ยังไงเราก็จะปลดปลอยอาณานิคมอยูแลว"
 wtt_news.26.c: "วันแหงความปติยินดี!"
 wtt_news.27.t: "รัฐประหารของนายทหารหนุมญี่ปุน"
 wtt_news.27.desc: "กลุมนายทหารหนุมไดโคนลมรัฐบาลสําเร็จ และฟนฟูใหสมเด็จพระจักรพรรดิเปนผูปกครองสูงสุดของชาติญี่ปุน ดูเหมือนวานี่เปนปฏิกิริยาตอสิ่งที่มองวาเปนภัยคุกคามจากการฉอราษฎรบังหลวงที่แพรหลายในรัฐบาลและผูยึดถืออุดมการณที่เปนปรปกษ\n\nนายทหารเหลานี้ซึ่งเรียกขานประเทศดวยถอยคําแบบจักรวรรดิอยางสมํ่าเสมอยิ่งขึ้นแลว ไดประกาศวาการกวาดลางจะดําเนินตอไปจนกวา 'ปจจัยไมพึงประสงคทั้งหมดจะถูกขจัดออกจากกองทัพและรัฐบาล' สมเด็จพระจักรพรรดิฮิโระฮิโตะเองไดทรงออกแถลงการณสั้น ๆ รับการนําที่ฝายกบฏถวาย และทรงแสดงทาทีชัดเจนที่จะคืนดีกับจีนและมหาอํานาจอาณานิคมตะวันตกในแปซิฟก"
 wtt_news.27.a: "บันไซ!"
 wtt_news.27.b: "ขาวที่นากังวล... พวกเขาไมไดแสดงทาทีเชนนั้นกับเราเลย..."
 wtt_news.27.c: "นี่รับประกันสันติภาพในแปซิฟกไดหรือ?"
 wtt_news.27.d: "เหตุการณพลิกผันอยางกะทันหัน"
 wtt_news.30.t: "เจียง ไคเชกถูกประหาร"
 wtt_news.30.desc: "หลังจากถูก [CHI_xian_instigator.GetLeader] จับกุม มีรายงานวาเจียง ไคเชกถูกหนวยยิงเปาของคอมมิวนิสตสังหารเมื่อเชานี้ หลังการพิจารณาคดีอยางรวบรัดในขอหากออาชญากรรมตอประชาชนและพรรค [PRC.GetLeader] ไดตัดสินประหารชีวิตเจียง ไคเชก แมแตการแทรกแซงโดยตรงของผูแทนรัฐบาลโซเวียตก็ไมอาจชวยชีวิตเขาไวได\n\nมีรายงานวา [SOV.GetLeader] โกรธเกรี้ยวอยางยิ่งตอ "การทรยศ" ของ [PRC.GetLeader] และไดสั่งจับกุมคณะผูแทนจีนประจําโคมินเทิรน\n\n[CHI.GetLeader] ผูนําฝายชาตินิยมคนใหมไดประกาศวาจะแกแคนใหกับการตายของเจียง และจะ "กวาดลาง" คอมมิวนิสตใหสิ้นซาก"
 wtt_news.30.a: "เขาไดรับสิ่งที่สมควรแลว"
 wtt_news.30.b: "พวกเขากอฆาตกรรมแลวเรียกมันวาความยุติธรรม!"
 wtt_news.30.c: "เรื่องนี้จะมีผลตามมา"
 wtt_news.30.d: "จีนจะยิ่งไรเสถียรภาพหนักขึ้นไปอีก"
 wtt_news.31.t: "เจียง ไคเชกถูกประหาร"
 wtt_news.31.desc: "หลังจากถูก [CHI_xian_instigator.GetLeader] จับกุม มีรายงานวาเจียง ไคเชกถูกหนวยยิงเปาของคอมมิวนิสตสังหารเมื่อเชานี้ หลังการพิจารณาคดีอยางรวบรัดในขอหากออาชญากรรมตอประชาชนและพรรค กบฏตอแผนดิน และกิจกรรมตอตานการปฏิวัติ [PRC.GetLeader] ไดตัดสินประหารชีวิตเจียง ไคเชก ผูแทนโซเวียตทําหนาที่เปนอัยการในการพิจารณาคดี ซึ่งยิ่งโหมกระแสคาดเดาวา [SOV.GetLeader] เห็นชอบการตัดสินใจนี้อยางลับ ๆ \n[CHI.GetLeader] ผูนําฝายชาตินิยมคนใหมไดประกาศวาจะแกแคนใหกับการตายของเจียง และจะ "กวาดลาง" คอมมิวนิสตใหสิ้นซาก"
 wtt_news.31.c: "เราตัดสินใจถูกแลว"
 wtt_news.32.t: "เจียง ไคเชกไดรับการปลอยตัวจากการกักบริเวณ"
 wtt_news.32.desc: "หลังจากถูก [CHI_xian_instigator.GetLeader] จับกุมและสงตัวใหคอมมิวนิสต มีรายงานวา [CHI.GetLeader] ไดกลับบานแลวหลังการเจรจาอยางยืดเยื้อ รายงานยังไมชัดเจนนัก แตหลักฐานชี้วา [PRC.GetLeader] ไดเสนอเปนพันธมิตรตอตานญี่ปุน ทั้งสองฝายปฏิเสธขาวลือดังกลาว โดย [PRC.GetLeader] กลาววายอมเห็นประเทศถูกเผาเปนเถาถานดีกวารวมมือกับฝายชาตินิยม ซึ่ง [CHI.GetLeader] ก็ตอบโตดวยความรูสึกเดียวกันในทันที"
 wtt_news.32.a: "พวกเขามีแผนอะไรกับเรา?"
 wtt_news.32.c: "เหมือนเด็กทะเลาะกัน..."
 wtt_news.32.d: "ญี่ปุนจะใชเรื่องนี้ใหเปนประโยชน"
 wtt_news.32.e: "เราอาจใชเรื่องนี้ใหเปนประโยชนได"
 wtt_news.33.t: "[PRC.GetLeader] ประณามการทรยศของฝายชาตินิยม"
 wtt_news.33.desc: "\nหลังการพบปะระหวาง [CHI.GetLeader] และ [PRC.GetLeader] ฝายหลังไดประณามสิ่งที่เขาเรียกวา "ความพยายามอันโจงแจงและเห็นไดชัดในการดึงกองทัพแดงไปใชเพื่อเปาหมายของฝายชาตินิยมและการตอตานการปฏิวัติ" [CHI.GetLeader] ปฏิเสธที่จะแสดงความเห็นในเรื่องนี้ กลาวเพียงวากองทัพฝายชาตินิยมพรอมปกปองจีนจากผูรุกรานทุกราย \n\nมีรายงานวาผูนําทั้งสองไดหารือถึงความเปนไปไดในการจัดตั้งแนวรวมตอตานญี่ปุน\n\nยังตองรอดูวาการเจรจาที่ลมเหลวนี้จะนําไปสูความขัดแยงระลอกใหมระหวางสองพรรคหรือไม"
 wtt_news.33.b: "ทําไมเราถึงเคยคิดวาพวกเขาจะเปลี่ยนไปได?"
 wtt_news.34.t: "จัดตั้งฝูงบินเสือบินแลว"
 wtt_news.34.desc: "หลังจากจีนรองขอใหนักบินและชางเครื่องชาวอเมริกันเขารวมหนวยอาสาสมัคร ประธานาธิบดีสหรัฐฯ [USA.GetLeader] ไดอนุมัติอยางเปนทางการใหโอนเครื่องบินขับไลสมัยใหมกวารอยลําแกกองทัพอากาศจีน นักบินในกองทัพบก กองทัพเรือ หรือนาวิกโยธินสหรัฐฯ ยังไดรับอนุญาตใหลาไปเขารวมหนวยนี้ดวย\n\nเรือลําแรกที่บรรทุกเครื่องบินขับไลใหมมีกําหนดออกเดินทางทันทีที่รวบรวมยุทโธปกรณที่จําเปนครบ ผูนําในสภาคองเกรสแสดงความกังวลวาการเลี่ยงกฎหมายระหวางประเทศแบบเฉียดฉิวเชนนี้จะนํามาซึ่งผลกระทบ"
 wtt_news.34.a: "ขอใหลาเหยื่อไดมาก!"
 wtt_news.34.b: "ยินดีตอนรับพวกเขาอยางยิ่ง"
 wtt_news.34.c: "อาสาสมัครหรือ? ทหารรับจางชัด ๆ!"
 wtt_news.34.d: "จุดจบของนโยบายโดดเดี่ยวของสหรัฐฯ หรือ?"
 wtt_news.35.t: "กรณีเซี่ยงไฮ"
 wtt_news.35.desc: "ความตึงเครียดระหวางจีนและญี่ปุนพุงสูงขึ้นอยางรวดเร็วหลังการปะทะในเซี่ยงไฮเมื่อคืนนี้ \n\nรายงานจากผูสังเกตการณชาวตะวันตกระบุวาเกิดการวิวาทระหวางตํารวจจีนกับกลุมกะลาสีญี่ปุน ซึ่งทั้งสองฝายไดรับบาดเจ็บบาง เมื่อหนวยลาดตระเวนญี่ปุนมาถึงเพื่อตรวจสอบ หนวยทหารจีนไดปดกั้นทางเขาที่เกิดเหตุทั้งหมดและจับกุมกะลาสีญี่ปุนไวแลว โดยจะตั้งขอหาพยายามฆา\n\nรัฐบาลญี่ปุนไดออกคําเตือนอยางรุนแรงวาหากไมปลอยตัวกะลาสีทันที จะมีการใชมาตรการเพื่อใหพวกเขาไดรับอิสรภาพ"
 wtt_news.35.a: "อุกอาจที่สุด!"
 wtt_news.35.b: "ทุกอยางเปนไปตามแผน"
 wtt_news.35.c: "กลิ่นอายสงครามอบอวลไปทั่ว"
 wtt_news.35.d: "ดูเหมือนจะเปนการวางแผนไวลวงหนา"
 wtt_news.36.t: "เจียง ไคเชกเสียชีวิตจากเครื่องบินตก"
 wtt_news.36.desc: "โศกนาฏกรรมเกิดขึ้นกับ [CHI.GetNameDef] เมื่อชวงตนวันนี้ เมื่อเครื่องบินที่เจียง ไคเชกโดยสารระเบิดกลางอากาศเพียงไมกี่อึดใจหลังขึ้นบิน หนวยกูภัยยังคงคนหาในซากเครื่องบิน แตแทบไมมีใครหวังวาจะพบผูรอดชีวิตในหมูลูกเรือและผูโดยสาร\n\nคาดวาทั้งจอมทัพและภริยาเสียชีวิตแลว\n\n[CHI.GetLeader] ผูนําจีนคนใหมไดใหคํามั่นวาจะสอบสวนสาเหตุของหายนะนี้อยางถี่ถวน มีขาวลือหนาหูถึงแผนสังหารจอมทัพ ซึ่งหลายคนมองวาเปนอุปสรรคตอการรวมกลุมตาง ๆ ในจีนใหเปนหนึ่งเดียว"
 wtt_news.36.a: "ปญหาที่ตองกังวลลดลงไปหนึ่งเรื่อง"
 wtt_news.36.b: "นี่ไมใชอุบัติเหตุ"
 wtt_news.36.d: "นาสลดใจ"
 wtt_news.37.t: "ประกาศสถาปนาสาธารณรัฐประชาชนจีน"
 wtt_news.37.desc: "ในสุนทรพจนแหงชัยชนะ [PRC.GetLeader] ประกาศวา "ประชาชนจีนไดลุกขึ้นยืนแลว" และนําคอมมิวนิสตสูชัยชนะในสงครามกลางเมืองจีน เมื่อฝายชาตินิยมลาถอยอยางสิ้นเชิง พรรคคอมมิวนิสตก็ไดรับชัยชนะในที่สุดหลังการตอสูนานหลายทศวรรษ นับแตนี้ไป สิ่งที่เคยเปนกลุมกบฏเล็ก ๆ ที่ซอนตัวอยูในหมูบานบนภูเขาหางไกลจะกลายเปนรัฐบาลเต็มรูปแบบของสาธารณรัฐประชาชนจีน"
 wtt_news.37.a: "วันอันยิ่งใหญ"
 wtt_news.37.b: "เปนเพียงพิธีการ"
 wtt_news.37.d: "พวกเขาจะไมมีวันเปนอะไรได"
 wtt_news.38.t: "[PRC.GetLeader] ชนะการแยงชิงอํานาจภายใน"
 wtt_news.38.desc: "การตอสูระหวางกลุมตาง ๆ ภายในพรรคคอมมิวนิสตจีนดูเหมือนจะสงบลงแลว โดย [PRC.GetLeader] กาวขึ้นเปนผูนําสูงสุด เหมา เจอตงและกลุมสายกลางสูญเสียอิทธิพลไปมาก เนื่องจาก [PRC.GetLeader] ซึ่งโซเวียตหนุนหลังสามารถเอาชนะทั้งสองฝายได บทบาทของ [SOV.GetLeader] ในเหตุการณนี้ หากมี เปนประเด็นที่ถูกคาดเดากันอยางมาก"
 wtt_news.38.a: "ขอใหเขานําเราสูชัยชนะ!"
 wtt_news.38.b: "ไมสําคัญ"
 wtt_news.38.c: "พันธมิตรที่มีประโยชน"
 wtt_news.38.d: "เขารับชวงสถานการณที่ยากลําบาก"
 wtt_news.39.t: "ยุทธการสรางความสงบในจีน"
 wtt_news.39.desc: "หลังเหตุการณหลายครั้งที่ถูกอธิบายวาเปน "การยั่วยุอยางโจงแจง" รัฐบาลญี่ปุนไดประกาศวาขณะนี้มีภาวะ "ความขัดแยงดวยอาวุธ" ในจีน พวกเขาอางวารัฐบาลกลางของ [CHI.GetLeader] แสดงใหเห็นถึงความไมเต็มใจหรือไมสามารถดําเนินคดีกับผูรับผิดชอบไดอยางเหมาะสม ดวยเหตุนี้ พวกเขาจึงประกาศสงกองกําลัง "รักษาสันติภาพ" ของทหารญี่ปุนเขาไปในประเทศเพื่อฟนฟูความสงบเรียบรอยและปองกันการโจมตีเพิ่มเติม"
 wtt_news.39.a: "ตามแผน"
 wtt_news.39.b: "ใครทําเรื่องนี้?"
 wtt_news.39.c: "เราทําอะไรผิด!?"
 wtt_news.39.d: "ขออางที่เห็นไดชัด"
 wtt_news.39.e: "พวกเขาจะไดเรียนรูความผิดพลาดของตน"
 wtt_warlord.1.t: "[From.GetNameDefCap] เสนอยอมสยบ"
 wtt_warlord.1.desc: "เมื่อรัฐบาลกลางของจีนไมสามารถคุมครองความปลอดภัยของประชาชนจากโจรและคอมมิวนิสตไดเลย [From.GetLeader] จึงเขาใจสถานะของตนในที่สุด และติดตอเราเพื่อรักษาตําแหนงของตน เขาจะรวมมือกับเราอยางเต็มที่และอนุญาตใหกองทหารของเราผานไดอยางเสรี เพื่อแลกเปลี่ยน เขาขอเพียงใหเราประจําการทหารบางสวนเพื่อปกปองดินแดนของเขา และจดจําคุณูปการของเขาเมื่อเราจัดระเบียบจีนใหมเสร็จสิ้น"
 wtt_warlord.1.a: "ในที่สุดก็มีคนที่มีเหตุผล!"
 wtt_warlord.1.b: "ไมมีที่สําหรับพวกเขาในแผนการของเรา"
 wtt_warlord.2.t: "[From.GetNameDefCap] ยอมรับ"
 wtt_warlord.2.desc: "รัฐบาล[From.GetAdjective]ไดยอมรับขอเสนอของเรา เพื่อแลกกับการคุมครอง เราตอง "พิจารณาอยางจริงจัง" ตอคําแนะนําที่ไดรับเกี่ยวกับการดําเนินการของเรา เจาหนาที่รัฐบาล[From.GetAdjective]ไดเดินทางมาถึงเพื่อประสานนโยบายของเรา"
 wtt_warlord.2.a: "ราคาเพียงเล็กนอยเพื่อความอยูรอดของเรา"
 wtt_warlord.3.t: "[From.GetNameDefCap] ปฏิเสธ"
 wtt_warlord.3.desc: "รัฐบาล[From.GetAdjective]ไดสงบันทึกของเรากลับมาพรอมการปฏิเสธที่จะหารือโดยสิ้นเชิง โดยกลาววาเราไมมีอํานาจที่จะเจรจากับรัฐบาลแหงชาติที่ชอบธรรม"
 wtt_warlord.3.a: "เราจะเขมแข็งขึ้นและแสดงใหพวกเขาเห็น"
 wtt_britain_lease_azores.1.t: "[From.GetNameDefCap] ขอเชาหมูเกาะอะโซรส"
 wtt_britain_lease_azores.1.desc: "ฝาย[From.GetAdjective]ไดติดตอเราเพื่อขอเชาหมูเกาะอะโซรสตลอดชวงสงคราม ที่ตั้งทางยุทธศาสตรของหมูเกาะทําใหเปนฐานสําคัญในการปกปองเสนทางเดินเรือขามแอตแลนติก หมูเกาะจะถูกสงคืนหลังสิ้นสุดการสูรบ"
 wtt_britain_lease_azores.1.a: "ยังดีกวาถูกลากเขาสงคราม..."
 wtt_britain_lease_azores.1.b: "เราไดประโยชนอะไร?"
 wtt_britain_lease_azores.2.t: "[From.GetNameDefCap] ยอมรับ"
 wtt_britain_lease_azores.2.desc: "รัฐบาล[From.GetAdjective]ไดอนุมัติคําขอของเรา และมอบการควบคุมหมูเกาะอะโซรสทั้งหมดใหเรา โดยเขาใจวาบัดนี้เรามีหนาที่ปกปองหมูเกาะจากการโจมตีใด ๆ คณะลวงหนากลุมเล็ก ๆ ไดมาถึงหมูเกาะแลวเพื่อจัดตั้งฐานปฏิบัติการ"
 wtt_britain_lease_azores.2.a: "สิ่งนี้จะเปนประโยชน"
 wtt_britain_lease_azores.3.t: "[From.GetNameDefCap] ปฏิเสธ"
 wtt_britain_lease_azores.3.desc: "รัฐบาลของ [From.GetLeader] ไดปฏิเสธคําขอสิทธิ์ตั้งฐานทัพในหมูเกาะอะโซรสของเรา โดยอางจุดยืนความเปนกลางที่ประกาศไวและกฎแหงการสงคราม หากเราไมหาทางดึงพวกเขาเขาสงครามขางเรา หมูเกาะเหลานี้ก็จะยังปดกั้นสําหรับเรา"
 wtt_britain_lease_azores.3.a: "เราจะจดจําเรื่องนี้"
 wtt_britain_lease_azores.4.t: "สิ้นสุดการเชาหมูเกาะอะโซรส"
 wtt_britain_lease_azores.4.desc: "เมื่อการสูรบในยุโรปสิ้นสุดลง รัฐบาล[POR.GetAdjective]ไดเตือนเราวาการเชาหมูเกาะอะโซรสมีขึ้นเฉพาะชวงสงครามเทานั้น ถึงเวลาแลวที่จะคืนการควบคุมหมูเกาะใหพวกเขา"
 wtt_britain_lease_azores.4.a: "อังกฤษชดใชหนี้เสมอ"
 wtt_britain_lease_azores.5.t: "อังกฤษถอนตัวจากหมูเกาะอะโซรส"
 wtt_britain_lease_azores.5.desc: "เมื่อสงครามในยุโรปสิ้นสุดลง [From.GetNameDef] ไดรักษาขอตกลงและคืนหมูเกาะอะโซรสใหเรา เราไดสงคณะผูบริหารไปรับการควบคุมกลับคืนแลว"
 wtt_britain_lease_azores.5.a: "ผลลัพธที่ดีที่สุดเทาที่เปนไปได"
 wtt_soviet_hold_city_t_success: "[soviet_city.GetName] ยืนหยัด"
 wtt_soviet_hold_city_d_success: "แมจะถูกขาศึกโหมโจมตี ผูพิทักษ [soviet_city.GetName] ก็ยืนหยัดอยางมั่นคงและตานขาศึกไวได ผูรุกรานตองเสียเลือดเนื้ออยางหนักตอแนวปองกัน ตองจายราคาแพงลิบกับพื้นดินทุกเซนติเมตรที่ยึดได เรื่องราวของวีรชนแหง [state.GetName] จะถูกจดจําไปอีกหลายชั่วอายุคน!"
 wtt_soviet_hold_city_o_success: "[soviet_city.GetName] จะยังเปนของเรา!"
 wtt_soviet_hold_city_t_fail: "[soviet_city.GetName] แตก"
 wtt_soviet_hold_city_d_fail: "ผูรุกราน[controller.GetAdjective]ระดมกําลังทั้งหมดที่มีบดขยี้แนวปองกันของเรานอกเมือง [soviet_city.GetName] กองกําลัง[controller.GetAdjective]ไดบุกเขาเมืองแลว ขณะที่ผูพิทักษของเรากําลังสูรบกับขาศึกในการรบตามทองถนนอยางดุเดือด คาดวาเมืองจะแตกภายในไมกี่วัน"
 decisions.1.t: "ความภักดีของผูบังคับบัญชากองทัพระดับลาง"
 decisions.1.desc: "นายทหารบางนายในระดับลางของกองทัพไดแสดงทัศนะ 'ทางเลือก' ตอผูนําประเทศ เพื่อลดความสงสัย เราควรจํากัดความพยายามไวที่การติดตอผูสนับสนุนที่มีศักยภาพเพียงคนเดียว และไมควรเสียดายทรัพยากรใด ๆ ในการซื้อความภักดีของพวกเขา"
 decisions.1.a: "ใครก็ได เราแคตองการใครสักคนมานํากองทัพ"
 decisions.1.b: "เราตองการใครสักคนที่อยางนอยก็รูวาตัวเองกําลังทําอะไร"
 decisions.1.c: "คุณภาพสําคัญที่สุด เราไมควรประหยัดเรื่องคาใชจาย"
 decisions.1.d: "ตองเปนคนที่ดีที่สุดเทานั้น"
 decisions.2.t: "ความภักดีของผูบังคับบัญชากองทัพระดับสูง"
 decisions.2.desc: "นายทหารบางนายในระดับสูงของกองทัพไดแสดงทัศนะ 'ทางเลือก' ตอผูนําประเทศ เพื่อลดความสงสัย เราควรจํากัดความพยายามไวที่การติดตอผูสนับสนุนที่มีศักยภาพเพียงคนเดียว และไมควรเสียดายทรัพยากรใด ๆ ในการซื้อความภักดีของพวกเขา"
 wtt_soviet_hold_city_o_fail: "ความถดถอยเล็กนอย"
 wtt_news.40.t: "คลองสุเอซถูกระเบิด"
 wtt_news.40.desc_eng: "เมื่อกองกําลังศัตรูเขาประชิดคลองสุเอซ และเสี่ยงตอการเสียเสนเลือดใหญทางการคาใหขาศึก [From.GetNameDef] จึงเลือกระเบิดคลองเพื่อไมใหขาศึกใชประโยชนได ดวยการผสมผสานทั้งเรือปดกั้นรองนํ้า การทําลาย และการวางทุนระเบิด ความเสียหายจึงเกิดขึ้นอยางสิ้นเชิง และคงตองใชความพยายามทางอุตสาหกรรมอยางมหาศาลนานหลายเดือนในการซอมแซม"
