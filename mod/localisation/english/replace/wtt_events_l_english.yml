 wtt_news.42.t: "ซอมแซมคลองสุเอซแลว"
 wtt_news.42.desc: "ดวยความพยายามทางอุตสาหกรรมอันมหาศาล [From.GetNameDef] สามารถซอมแซมคลองสุเอซไดสําเร็จ เชานี้เสนเลือดใหญทางการคาสูทะเลเมดิเตอรเรเนียนไดเปดใชอีกครั้ง หลังการซอมแซมอยางเขมขนนานกวาครึ่งป"
 wtt_news.42.a: "เราฟนฟูเสนทางเชื่อมสูจักรวรรดิของเราไดแลว"
 wtt_news.42.b: "การลงทุนที่จําเปนสําหรับชาติของเรา"
 wtt_news.42.c: "สิ่งนี้จะชวยความพยายามของเราไดอยางมาก"
 wtt_news.42.d: "พวกเขากูสถานการณคืนมาไดแลว..."
 wtt_news.42.e: "ทุกฝายจะไดรับผลกระทบ"
 wtt_news.43.t: "ซอมแซมคลองปานามาแลว"
 wtt_news.43.desc: "ดวยความพยายามทางอุตสาหกรรมอันมหาศาล [From.GetNameDef] สามารถซอมแซมคลองปานามาไดสําเร็จ เชานี้เสนทางเชื่อมทางทหารที่สําคัญระหวางแอตแลนติกและแปซิฟกไดเปดใชอีกครั้ง หลังการซอมแซมอยางเขมขนนานกวาหนึ่งป"
 wtt_news.43.a: "เราฟนฟูเสนทางเชื่อมสําคัญระหวางมหาสมุทรของเราไดแลว"
 wtt_news.43.b: "เราเคลื่อนจากแปซิฟกสูแอตแลนติกไดอีกครั้ง"
 wtt_news.43.c: "สิ่งนี้จะชวยความพยายามของเราไดอยางมาก"
 wtt_news.43.d: "พวกเขากูสถานการณคืนมาไดแลว..."
 wtt_news.43.e: "ทุกฝายจะไดรับผลกระทบ"
 wtt_news.44.t: "[MAN.GetLeader] อางอาณัติแหงสวรรค"
 wtt_news.44.desc: "ในฉลองพระองคประดับประดาอยางหรูหราสมพระเกียรติจักรพรรดิแหงจีน [MAN.GetLeader] โอรสแหงสวรรค เจาแหงหมื่นป จักรพรรดิแหงราชวงศตาชิง ไดเสด็จขึ้นประทับบัลลังกมังกรในพระราชพิธีราชาภิเษกครั้งที่สองอันไมธรรมดา และบัดนี้ประทับอยูในพระราชวังตองหามเชนเดียวกับบรรพบุรุษ [MAN.GetLeader] อางอิงขนบธรรมเนียมโบราณวาชัยชนะของกองกําลังของพระองคในสงครามกลางเมืองจีนพิสูจนวาพระองคไดรับอาณัติจากสวรรคใหปกครองจีน\n\nยังตองรอดูวาพระองคตั้งพระทัยจะขยายอํานาจการปกครองใหครอบคลุม 'ทั่วใตหลา' ดังที่จักรพรรดิองคกอน ๆ เคยอางหรือไม"
 wtt_news.44.a: "โอรสแหงสวรรคหวนคืน"
 wtt_news.44.b: "ความผิดไดรับการแกไขแลว"
 wtt_news.44.c: "คิดวาตัวเองเปนใคร?"
 wtt_news.44.d: "เปนการกลับมาที่นาทึ่ง"
 wtt_news.44.e: "ไรสาระสิ้นดี!"
 wtt_news.45.t: "[new_leader.GetLeader] ขึ้นเปนผูนําประเทศจีน"
 wtt_news.45.desc: "หลังการแยงชิงอํานาจอยางยืดเยื้อระหวาง [old_leader.GetLeader] และ [new_leader.GetLeader] ฝายแรกไดยอมรับความพายแพในที่สุด และไปพบ [new_leader.GetLeader] ที่บานพัก หลังการเจรจาเพียงสองชั่วโมง เห็นไดชัดวา [old_leader.GetLeader] ไดยอมรับขอเสนอใหถายโอนอํานาจแก [new_leader.GetLeader] และลงจากตําแหนงนายกรัฐมนตรีแหงสาธารณรัฐ \n\nกลุมผูสนับสนุนของผูนําทั้งสองไดมาชุมนุมกันนอกบานกอนหนานั้น ทําใหเกิดความกลัววาจะมีการปะทะรุนแรงระหวางสองฝายขึ้นอยูกับผลลัพธ\n\nอยางไรก็ตาม ไมมีรายงานความรุนแรงใด ๆ และดูเหมือนวาการถายโอนอํานาจเปนไปอยางคอนขางราบรื่น"
 wtt_news.45.a: "การเมือง... การเมืองไมเคยเปลี่ยน"
 wtt_news.45.b: "ความสําเร็จอันนาทึ่ง"
 wtt_news.45.c: "ยังดีกวาใชความรุนแรง"
 wtt_news.45.d: "พวกเขาอาจเพิ่งหลีกเลี่ยงสงครามกลางเมืองได"
 wtt_news.46.t: "[From.GetLeader] ประกาศนโยบายจีนเดียว"
 wtt_news.46.desc: "[From.GetLeader] กลาวตอหนากลุมผูสนับสนุนวันนี้ ประกาศการเปลี่ยนแปลงครั้งใหญในรัฐบาลของเขา กอนหนานี้ [From.GetLeader] ยินยอมอดทนตอการที่บางสวนของจีนเปนอิสระอยางมาก แตบัดนี้สิ้นสุดลงแลว นับแตวันนี้ [From.GetNameDef] จะถือวาจีนทั้งหมดอยูในความรับผิดชอบของตนในฐานะรัฐบาลเดียวของจีน ผูใดที่ปฏิเสธคําสั่งของรัฐบาลจีนอันชอบธรรมเพียงหนึ่งเดียวจะถูกถือเปนกบฏหรือผูทรยศ และจะถูกจัดการตามนั้น \n\nอยางไรก็ตาม ยังตองรอดูวารัฐบาล [From.GetLeader] จะทําตามคําขูไดจริงหรือจะเปนเพียงการโฆษณาชวนเชื่อเพื่อเรียกการสนับสนุนจากประชาชน"
 wtt_news.46.a: "การคุกคามโดยตรง"
 wtt_news.46.b: "เราจะรวมจีนทั้งหมดเปนหนึ่งเดียว!"
 wtt_news.46.d: "คนที่เกงกวานี้ยังลมเหลวมาแลว"
 wtt_news.47.t: "[From.GetNameDefCap] อางสิทธิ์อินโดจีน"
 wtt_news.47.desc: "รัฐบาลของ [From.GetLeader] ไดประกาศวาสถานการณปจจุบันในอินโดจีนเปนภัยอันชัดเจนและเกิดขึ้นจริงตอความมั่นคงของ[From.GetAdjective] แถลงการณอยางเปนทางการระบุวาไมมีรัฐบาลใดในโลกจะยอมใหมีกริชเล็งตรงมาที่จุดออนของตนเชนนี้ หากภูมิภาคนี้ไมสงบลง หรือทางการ[671.Controller.GetAdjective]ไมถูกแทนที่ดวยผูวาการที่เต็มใจทํางานรวมกับ [From.GetNameDef] มากกวานี้ ภัยคุกคามตอผลประโยชนของ[From.GetAdjective]ก็จะยังคงอยู\n\nแมโฆษกของ [From.GetLeader] จะยํ้าวารัฐบาล[From.GetAdjective]จะพยายามหาทางออกอยางสันติ แตก็ไมไดตัดทางเลือกทางทหารออกไป"
 wtt_news.47.a: "ตองมีใครสักคนทํา"
 wtt_news.47.b: "มาเอาไปสิ!"
 wtt_news.47.c: "คงไมมีอะไรเลวรายเกิดขึ้นจากเรื่องนี้หรอก"
 wtt_news.47.d: "อยาใหเราตองไปถึงที่นั่น!"
 wtt_news.48.t: "สงครามประกาศเอกราชแมนจูเรีย"
 wtt_news.48.desc: "หลังชวงเวลาแหงการแยงชิงอํานาจภายในระหวางผูบริหารชาวญี่ปุนกับรัฐบาลของ [MAN.GetLeader] การตอสูเพื่อความเปนใหญในแมนจูเรียก็ถึงจุดเดือดในที่สุด \n\nมีรายงานวาการเผชิญหนาครั้งนี้เกิดจากเหตุการณในราชสํานัก ซึ่งนายพลญี่ปุนนายหนึ่งไดลบหลูจักรพรรดิแหงแมนจูกัวดวยการเรียกรองใหพระองคโคงคํานับ\n\n[MAN.GetLeader] กริ้วอยางยิ่ง ตรัสตอบวา "โอรสแหงสวรรคไมโคงคํานับผูใด" แลวทรงฟาดนายพลดวยไมเทา กอนมีรับสั่งใหกองทัพขับไลทหารญี่ปุนทั้งหมดออกจากแผนดินจีนทันที"
 wtt_news.48.a: "ลูกหมาคํารามงั้นหรือ?"
 wtt_news.48.b: "เราจะควาชะตากรรมของเรา!"
 wtt_news.48.c: "ไอคนทรยศตัวเล็กนั่น!"
 wtt_news.48.d: "มังกรจูโจม... ดวงอาทิตย?"
 wtt_news.50.t: "ฮิตเลอรถูกลอบสังหาร"
 wtt_news.50.desc: "วิทยุเยอรมันประกาศวันนี้วากลุมทรยศในกองทัพไดพยายามกอรัฐประหาร หลังเกิดระเบิดที่กองบัญชาการผูนําซึ่งคราชีวิตฮิตเลอรและทําใหอีกหลายคนบาดเจ็บ หนวยทหารบกไดโจมตีสํานักงานและหนวยตาง ๆ ของ SS \n\nแม [GER.GetLeader] จะอางวาควบคุมประเทศและกองทัพไดอยางเบ็ดเสร็จ แตยังคงมีรายงานการยิงตอสูระหวางฝายภักดีและกองกําลังกบฏทั่วประเทศ\n\nมีขาวลือวาสมาชิกระดับนําคนอื่น ๆ ของพรรคนาซีกําลังวางแผนฉวยอํานาจเองทามกลางความโกลาหล"
 wtt_news.50.a: "การทรยศอันชั่วชา!"
 wtt_news.50.b: "สถานการณไมไดดีขึ้นเลย"
 wtt_news.50.c: "ไปไดก็ดี!"
 wtt_news.50.d: "เขาบีบพวกเขามากเกินไป"
 wtt_news.51.t: "ความพยายามลอบสังหาร [GER.GetLeader]"
 wtt_news.51.desc: "วิทยุเยอรมันประกาศวันนี้วากลุมทรยศในกองทัพไดพยายามกอรัฐประหาร หลังเกิดระเบิดที่กองบัญชาการผูนําซึ่งนาอัศจรรยที่ฮิตเลอรบาดเจ็บเพียงเล็กนอย และอีกหลายคนไดรับบาดเจ็บ หนวยทหารบกไดพยายามยึดสํานักงานรัฐบาลหลายแหงในเบอรลิน \n\nขาวการรอดชีวิตของ [GER.GetLeader] แพรไปอยางรวดเร็ว และหนวยสวนใหญภายใตการควบคุมของฝายกอการไดกลับเขากรมกองแลว\n\nนายทหารเยอรมันระดับสูงหลายนายฆาตัวตายหลังความพยายามลมเหลว แทนที่จะเผชิญความอัปยศจากการพิจารณาคดีตอหนา "ศาลประชาชน" อันฉาวโฉ"
 wtt_news.51.c: "จุดเริ่มตนของจุดจบหรือ?"
 wtt_news.52.desc: "วิทยุเยอรมันประกาศวันนี้วา [GER.GetLeader] ไดเขายึดอํานาจรัฐบาล หลังการยิงตอสูในบังเกอรผูนํา ซึ่งทานผูนําไดรับบาดเจ็บสาหัสถึงชีวิต หนวย SS ไดเคลื่อนกําลังอยางรวดเร็วเพื่อยึดถนนสายหลักและชุมทางรถไฟทุกแหงที่ออกจากเบอรลิน ขณะเดียวกันมีรายงานวาหนวยของลุฟทวัฟเฟอและกองทัพบกไดรับคําสั่งใหมุงหนาเขาสูเบอรลินเพื่อฟนฟูความสงบเรียบรอย"

