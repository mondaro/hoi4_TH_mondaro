 wtt_news.53.t: "การรวมสแกนดิเนเวีย"
 wtt_news.53.desc: "ดวยกําลังอาวุธ [From.GetOldName] ไดรวมชาวสแกนดิเนเวียเขาอยูใตการปกครองของตน และรัฐบาลกําลังผนวกรวมดินแดนที่เพิ่งพิชิตได เพื่อพยายามรวมใจประชาชนใหอยูเบื้องหลังรัฐ จึงมีการเพิ่มการโฆษณาชวนเชื่อแบบชาตินิยมรวมชาติโดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\nผลพลอยไดคือ ผูสนับสนุนการรวมสแกนดิเนเวียไดเริ่มยกเหตุการณคูขนานทางประวัติศาสตร และชี้วาสถานการณปจจุบันอาจมองไดวาเปนเพียงความตอเนื่องตามธรรมชาติของความพยายามรวมภูมิภาคในอดีต รัฐบาล[From.GetOldAdjective]ไดกระโจนเขารวมกระแสความคิดนี้อยางกระตือรือรน และบัดนี้ไดประกาศอยางเปนทางการถึง 'การฟนฟูสหภาพคาลมาร' พรอมเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]'"
 wtt_news.53.a: "วันอันรุงโรจนของชาวสแกนดิเนเวียทุกคน!"
 wtt_news.53.b: "สแกนดิเนเวียเขมแข็งกวาเมื่ออยูรวมกัน"
 wtt_news.53.c: "มันอยูไดไมนานหรอก!"
 wtt_news.54.t: "การรวมกลุมประเทศนอรดิก"
 wtt_news.54.desc: "เมื่อพิชิตทุกชาติในภูมิภาคนอรดิกไดแลว รัฐบาล[From.GetOldAdjective]ไดเริ่มเคลื่อนไหวมากขึ้นเพื่อผนวกรวมดินแดนที่เพิ่งพิชิตได ดวยเหตุนี้ เพื่อพยายามรวมใจประชาชนใหอยูเบื้องหลังรัฐ จึงมีการเพิ่มการโฆษณาชวนเชื่อแบบชาตินิยมรวมชาติโดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\nเจาหนาที่[From.GetOldAdjective]รายหนึ่งกลาววา "ประเทศนอรดิกรูสึกผูกพันกันอยางแนนแฟนมาโดยตลอด จึงเปนเรื่องธรรมดาที่พวกเขาควรรวมเปนหนึ่ง และประชาชนของเราควรอยูรวมกันเคียงบาเคียงไหลในฐานะหนึ่งเดียว" ดูเหมือนรัฐบาลจะตั้งใจใชความผูกพันนี้เปนเครื่องมือรวมประชาชน และบัดนี้ไดประกาศ "เอกภาพนอรดิกที่แทจริง" พรอมเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]'"
 wtt_news.54.a: "ดินแดนเหนือที่เปนหนึ่งเดียวจะยืนหยัดอยางเขมแข็ง!"
 wtt_news.54.b: "ดินแดนเหนืออาจกลายเปนปญหาสําหรับเพื่อนบาน..."
 wtt_news.55.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.55.desc: "เมื่อยึดดินแดนทั้งหมดของกรันโคลอมเบียเดิมกลับคืนมาไดแลว รัฐบาล[From.GetOldAdjective]ไดเริ่มเคลื่อนไหวมากขึ้นเพื่อผนวกรวมดินแดนที่เพิ่งพิชิตได ดวยเหตุนี้ เพื่อพยายามรวมใจประชาชนใหอยูเบื้องหลังรัฐ จึงมีการเพิ่มการโฆษณาชวนเชื่อแบบชาตินิยมรวมชาติโดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\nเจาหนาที่[From.GetOldAdjective]ไดแสดงความเชื่อซํ้าแลวซํ้าเลาวาอเมริกาใตตอนเหนือทั้งหมดควรมองยอนไปยังประวัติศาสตรรวมกันและใชความผูกพันนั้นเปนรากฐานของรัฐที่เปนหนึ่งเดียว บัดนี้ รัฐบาล[From.GetOldAdjective]ไดกาวไปอีกขั้นดวยการประกาศ "การฟนคืนมรดกของโบลีวาร" พรอมเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]'"
 wtt_news.55.a: "ความฝนแหงละตินอเมริกาที่เปนหนึ่งเดียวรออยู!"
 wtt_news.55.b: "การกําเนิดของมหาอํานาจใหมแหงทวีปอเมริกาหรือ?"
 wtt_news.56.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.56.desc: "เมื่อยึดครองดินแดนจักรวรรดิออสเตรีย-ฮังการีไดทั้งหมดแลว รัฐบาล[From.GetOldAdjective]ในฐานะผูแทนของรัฐผูสืบทอดแหงสุดทายที่เหลืออยู ไดเริ่มผนวกรวมดินแดนเหลานี้กลับคืน การโฆษณาชวนเชื่อที่รัฐบาลชี้นําไดลุกโชนขึ้น เชิดชู "ยุครุงเรืองของจักรวรรดิ" อยางเห็นไดชัดเพื่อรวมใจประชาชนใหสนับสนุนการปฏิรูปประเทศครั้งใหญและการหวนคืนสูบรรทัดฐานแบบจักรวรรดิ\n\nสวนหนึ่งของการนี้ รัฐบาล[From.GetOldAdjective]ไดประกาศฟนฟู [From.GetNameDef] และเปลี่ยนชื่ออยางเปนทางการของประเทศใหสอดคลองกัน"
 wtt_news.56.a: "Indivisibiliter ac inseparabiliter! (แบงแยกมิไดและพรากจากกันมิได!)"
 wtt_news.56.b: "ราชาธิปไตยคูผงาดขึ้นอีกครั้ง"
 wtt_news.57.t: "การกําเนิดใหมของ [From.GetNameDefCap]"
 wtt_news.57.desc: "เมื่อโปแลนดและลิทัวเนียถูกปกครองโดยรัฐเดียวกันอีกครั้ง รัฐบาล[From.GetOldAdjective]ไดเริ่มอาศัยประวัติศาสตรในการโฆษณาชวนเชื่อเพื่อรวมใจประชาชนใหสนับสนุนนโยบายของตน 'ผูเชี่ยวชาญทางประวัติศาสตร' โหมปอนประชาชนดวยวิธีตาง ๆ ที่โปแลนดและลิทัวเนียที่รวมกันจะยืนหยัดตอภัยคุกคามที่ชายแดนได พรอมเลาเรื่องราวจากยุครุงเรืองสูงสุดของเครือจักรภพโปแลนด-ลิทัวเนีย วิธีนี้ดูเหมือนจะไดผลในการเบี่ยงเบนความโกรธแคนของประชาชน และทําใหพวกเขาจดจออยูกับยุครุงเรืองในอดีต\n\nวันนี้ รัฐบาล[From.GetOldAdjective]ไดกาวไปอีกขั้นดวยการประกาศฟนฟูเครือจักรภพ พรอมเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]'"
 wtt_news.57.a: "หากพระเจาอยูขางเรา ใครเลาจะตอตานเรา?"
 wtt_news.57.b: "ครั้งนี้จะรอดพนการแบงแยกไดหรือไม?"
 wtt_news.58.t: "การรวมกลุมประเทศตํ่ากลับคืน"
 wtt_news.58.desc: "เมื่อ[From.GetOldAdjective]พิชิตกลุมประเทศตํ่าอื่น ๆ ได รัฐบาลของพวกเขาไดออกมาปกปองการกระทําของตนอยางแข็งขัน บัดนี้พวกเขาอางวาเปนผูสืบทอดโดยตรงและชอบธรรมของสหราชอาณาจักรเนเธอรแลนด และไดปฏิเสธสนธิสัญญาลอนดอน ค.ศ. 1839 โดยอางวาในเวลานั้นถูกกองกําลังภายนอกบังคับยัดเยียดใหรัฐบาลของตนอยางผิดกฎหมาย ดังนั้น เมื่อชาติไมเคยสิ้นสภาพไป [From.GetOldNameDef] จึงเพียงแคยืนยันการควบคุมเหนือดินแดนที่เปนของตนอยูแลว\n\nรัฐบาล[From.GetOldAdjective]ไดทําตามคําพูดดวยการเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]' และการโฆษณาชวนเชื่อครั้งใหญไดเริ่มขึ้นแลวเพื่อพยายามรวมใจประชาชน โดยใชวิกฤตการณโลกในปจจุบันเปนภัยคุกคามภายนอกใหรวมกันตอตาน"
 wtt_news.58.a: "รวมกันอีกครั้งตามเจตนาเมื่อป 1815..."
 wtt_news.58.b: "ใช... ทั้งหมดนี้ดูเหมือนจะเปนเรื่องภายใน..."
 wtt_news.59.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.59.desc: "เมื่อ[From.GetOldAdjective]พิชิตรัฐอเมริกากลางอื่น ๆ ได รัฐบาลของพวกเขาไดออกมาปกปองการกระทําของตนบนเวทีระหวางประเทศอยางแข็งขัน โดยถือวาตนเปนผูสืบทอดอันชอบธรรมของสาธารณรัฐสหพันธอเมริกากลาง พวกเขาตีตราชาติที่แยกตัวออกไปในชวงปลายทศวรรษ 1830 วาเปนรัฐบาลแบงแยกดินแดนที่ผิดกฎหมาย และเรียกการสูรบเมื่อไมนานมานี้อยางสมํ่าเสมอวาเปนความพยายามอันชอบธรรมในการ 'ยืนยันการควบคุม' เหนือดินแดนเหลานี้\n\nรัฐบาล[From.GetOldAdjective]ไดทําตามคําพูดดวยการเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]' และการโฆษณาชวนเชื่อครั้งใหญไดเริ่มขึ้นแลวเพื่อพยายามรวมใจประชาชน โดยใชวิกฤตการณโลกในปจจุบันเปนภัยคุกคามภายนอกใหรวมกันตอตาน"
 wtt_news.59.a: "กาวแรกที่จําเปนสูการผงาดบนเวทีโลก"
 wtt_news.59.b: "สหรัฐแหงทวีปอเมริกาอีกแหงถือกําเนิดขึ้น"
 wtt_news.60.t: "การรวมบอลติก"
 wtt_news.60.desc: "เมื่อพิชิตดินแดนทั้งหมดของรัฐบอลติกไดแลว รัฐบาล[From.GetOldAdjective]ไดเริ่มเคลื่อนไหวมากขึ้นเพื่อผนวกรวมดินแดนที่เพิ่งพิชิตได ดวยเหตุนี้ เพื่อพยายามรวมใจประชาชนใหอยูเบื้องหลังรัฐ จึงมีการเพิ่มการโฆษณาชวนเชื่อแบบชาตินิยมรวมชาติโดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\nเจาหนาที่[From.GetOldAdjective]รายหนึ่งกลาววา "ประเทศบอลติกรูสึกผูกพันกันอยางแนนแฟนมาโดยตลอด จึงเปนเรื่องธรรมดาที่พวกเขาควรรวมเปนหนึ่ง โดยเฉพาะเมื่อมีภัยคุกคามที่ชายแดนของเรา มีเพียงการยืนหยัดรวมกันเทานั้นที่ประชาชนของเราจะคงความเปนเอกราชและเสรี" พวกเขาจึงไดประกาศ "เอกภาพบอลติกที่แทจริง" พรอมเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]'"
 wtt_news.60.a: "สิ่งนี้จําเปนตอความอยูรอดของเรา"
 wtt_news.60.b: "แตรัฐใหมจะเขมแข็งพอหรือไม?"
 wtt_news.61.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.61.desc: "เมื่อยึดครองดินแดนออตโตมันกอนสงครามไดทั้งหมดแลว รัฐบาล[From.GetOldAdjective]ในฐานะผูแทนของรัฐผูสืบทอดออตโตมัน ไดเริ่มผนวกรวมดินแดนเหลานี้กลับคืน การโฆษณาชวนเชื่อที่รัฐบาลชี้นําไดลุกโชนขึ้น ประณามการแบงแยกดินแดนโดยฝายสัมพันธมิตรในมหาสงคราม และเชิดชู "ยุครุงเรืองของจักรวรรดิ" อยางเห็นไดชัดเพื่อรวมใจประชาชนในดินแดนที่เพิ่งพิชิตใหสนับสนุนการปฏิรูปประเทศครั้งใหญและการหวนคืนสูบรรทัดฐานแบบจักรวรรดิ\n\nสวนหนึ่งของการนี้ รัฐบาล[From.GetOldAdjective]ไดประกาศฟนฟู [From.GetNameDef] และเปลี่ยนชื่ออยางเปนทางการของประเทศใหสอดคลองกัน"
 wtt_news.61.a: "ในที่สุดเราก็ลบลางการแบงแยกไดแลว!"
 wtt_news.61.b: "รัฐอมตะผงาดขึ้นอีกครั้ง..."
 wtt_news.62.t: "การรวมยุโรป"
 wtt_news.62.desc: "มหาอํานาจหลักแหงภาคพื้นทวีปยุโรปถูกพิชิตอยูแทบเทา [From.GetOldNameDef] และเปนครั้งแรกที่ความฝนเรื่องยุโรปที่เปนหนึ่งเดียวดูจะเปนจริงได 'ผูเชี่ยวชาญ' หลายคน ซึ่งคาดวารับเงินเดือนจากรัฐบาล ไดเริ่มยกสถานการณการเมืองปจจุบันซํ้าแลวซํ้าเลาวาเปนหนทางเดียวที่จะ "ปองกันความขัดแยงในยุโรปในอนาคต"\n\nในความพยายามเพิ่มเติมที่จะสรางภาพภายนอกของ "ชาติสําหรับชาวยุโรปทุกคน" การปฏิรูประดับชาติและระดับทองถิ่นไดรับการผลักดันอยางรวดเร็วนาทึ่ง และในสวนหนึ่งของการนั้น วันนี้มีการประกาศวานับแตนี้ไปประเทศจะเปนที่รูจักในชื่อ '[From.GetNameDef]' เพื่อให "ชาวยุโรปทุกคนรูสึกไดรับการตอนรับ""
 wtt_news.62.a: "นี่คือจุดจบของสงครามในยุโรปทั้งปวงหรือ?"
 wtt_news.62.b: "มาดูกันวาพวกเขาจะทําสําเร็จหรือไม"
 wtt_news.63.t: "การผงาดของ [From.GetNameDef]"
 wtt_news.63.desc: "ขณะที่ชาติ[From.GetOldAdjective]ขยายเขาไปในดินแดนเพื่อนบาน ความพยายามของรัฐบาลในการสรางความตอเนื่องทางประวัติศาสตรก็ปรากฏชัดขึ้นเรื่อย ๆ เห็นไดชัดวาเพื่อรวมใจประชาชน ความสําเร็จของจักรวรรดิเกรตซิมบับเวถูกเสริมแตงใหงดงามเกินจริง แตการโฆษณาชวนเชื่ออยางไมหยุดหยอนดูเหมือนจะสงผลตอความคิดเห็นของสาธารณชน\n\nวันนี้ รัฐบาล[From.GetOldAdjective]ไดกาวไปอีกขั้นดวยการเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]' ซึ่งไดรับการตอนรับจากฝูงชนที่ปติยินดีบนทองถนนในเมืองใหญ"
 wtt_news.63.a: "แอฟริกาเพื่อชาวแอฟริกัน!"
 wtt_news.63.b: "นี่คือจุดจบของแอฟริกาอาณานิคมหรือ?"
 wtt_news.64.t: "การผงาดของ [From.GetNameDef]"
 wtt_news.64.desc: "การรุกทางทหารของ[From.GetOldAdjective]ดูเหมือนจะไมมีใครหยุดยั้งไดเลย และแนวคิดที่หลายคนเคยเยาะเยยในชวงไมกี่ปที่ผานมา - การสรางจักรวรรดิโรมันขึ้นใหม - บัดนี้ดูจะอยูในเงื้อมมือของชาวอิตาลีแลวโดยสมบูรณ มหาอํานาจภาคพื้นทวีปยุโรปสวนใหญที่อาจตอตานพวกเขาถูกกําจัดไปแทบสิ้น ทําใหชาวอิตาลีมีอิสระที่จะบังคับใชเจตจํานงของตนตอผูคนที่ถูกพิชิต\n\nนอกจากเริ่มผนวกรวมสิ่งที่พวกเขาเรียกวา "ดินแดนโรมันที่ยึดคืนมา" แลว รัฐบาลอิตาลียังไดประกาศการกําเนิดใหมของจักรวรรดิโรมัน พรอมเปลี่ยนชื่อชาติเปน '[From.GetNameDef]'"
 wtt_news.64.a: "Roma Invicta! (โรมไมมีวันพาย!)"
 wtt_news.64.b: "พวกเขาคงไมไดพูดจริงหรอก!"
 wtt_news.65.t: "การผงาดของ [From.GetNameDef]"
 wtt_news.65.desc: "ขณะที่การรุกของ[From.GetOldAdjective]ดําเนินตอไป ผูที่เชี่ยวชาญประวัติศาสตรเปอรเซียยอมสังเกตเห็นเหตุการณคูขนานทางประวัติศาสตร บุคคลสาธารณะที่มีชื่อเสียงไดเริ่มเปรียบเทียบการขยายดินแดนครั้งนี้กับยุคของพระเจาไซรัสมหาราช และความภาคภูมิใจแบบชาตินิยมก็เพิ่มสูงขึ้นทั่วสังคม[From.GetOldAdjective]\n\nขณะที่รัฐบาลขยายการควบคุมเหนือดินแดนที่ไดมาใหม และโตคลื่นการสนับสนุนจากสาธารณชนอยางลนหลามนี้ เจาหนาที่ไดยืนยันแลววาประเทศจะเปลี่ยนชื่ออยางเปนทางการเปน '[From.GetNameDef]'"
 wtt_news.65.a: "ความแข็งแกรงของเรายังคงเติบโต!"
 wtt_news.65.b: "สิ่งนี้จะนําสันติภาพและเสถียรภาพมาสูภูมิภาคหรือไม?"
 wtt_news.66.t: "การผงาดของ [From.GetNameDef]"
 wtt_news.66.desc: "การผงาดขึ้นของ[From.GetOldAdjectiveCap]ทําใหผูเชี่ยวชาญทางทหารทั่วโลกงุนงง แตผลลัพธก็พิสูจนตัวเอง ภายในเวลาเพียงไมกี่ป ชาวกรีกไดครอบงําคาบสมุทรบอลขานโดยสิ้นเชิง ยึดอิสตันบูลกลับคืน และบดขยี้การตอตานอยางเปนระบบของตุรกีในอานาโตเลีย ดูเหมือนวาความขัดแยงกรีก-ตุรกีที่ยาวนานกวาหาศตวรรษไดมาถึงบทสรุปสุดทายแลว\n\nเพื่อเสริมความภาคภูมิใจของชาติ รัฐบาล[From.GetOldAdjectiveCap]ไดใชความตอเนื่องทางประวัติศาสตร โดยเรียกความสําเร็จทางทหารของตนวาเปน 'การยึดคืนของไบแซนไทนจากผูรุกรานเติรก' ในฐานะสวนหนึ่งของการโฆษณาชวนเชื่อนี้ และทามกลางขบวนพาเหรดพิธีการอันหรูหราในกรุงคอนสแตนติโนเปลที่เพิ่งเปลี่ยนชื่อ ไดมีการประกาศวา [From.GetOldNameDef] ไดเปลี่ยนชื่ออยางเปนทางการเปน '[From.GetNameDef]'"
 wtt_news.66.a: "เริ่มการยึดคืนกันเถอะ"
 wtt_news.66.b: "ชะตาพลิกผันอยางปาฏิหาริย..."
 wtt_news.67.t: "การรวมอาระเบีย"
 wtt_news.67.desc: "เมื่อ[From.GetOldAdjective]พิชิตคาบสมุทรอาหรับไดเกือบทั้งหมด รัฐบาลไดฉวยกระแสลัทธิรวมอาหรับระลอกใหมที่แผไปทั่วภูมิภาค เมื่อความขัดแยงระหวางประเทศถูก 'แกไข' ดวยการกําจัดรัฐบาลตางชาติที่ดื้อรั้นออกไปดวยกําลังทหาร การรวมชาติอาหรับก็ดูจะอยูแคเอื้อม และรัฐบาล[From.GetOldAdjective]ก็ไดแสดงความเต็มใจที่จะไลตามเปาหมายนี้แลว\n\nไมวาจะเพียงเพื่อ 'โตคลื่น' ความนิยมของสาธารณชนนี้ เพื่อดึงดูดใหเปนบานของชาวอาหรับทุกคน หรือเพียงเพื่อใหการผนวกรวมภูมิภาคงายขึ้น เจาหนาที่[From.GetOldAdjective]ไดยืนยันแลววาชื่ออยางเปนทางการของชาติจะเปลี่ยนเปน '[From.GetNameDef]'"
 wtt_news.67.a: "ความฝนของไซดานเปนจริงแลว"
 wtt_news.67.b: "สิ่งนี้จะนําไปสูสันติภาพอันยั่งยืนในภูมิภาคหรือไม?"
 wtt_news.68.t: "การผงาดของ [From.GetNameDef]"
 wtt_news.68.desc: "ขณะที่ชาติ[From.GetOldAdjective]ขยายเขาไปในดินแดนเพื่อนบาน ความพยายามของรัฐบาลในการสรางความตอเนื่องทางประวัติศาสตรก็ปรากฏชัดขึ้นเรื่อย ๆ เห็นไดชัดวาเพื่อรวมใจประชาชน ความสําเร็จของจักรวรรดิมัชปาหิตและอาณาจักรอื่น ๆ ถูกเสริมแตงใหงดงามเกินจริง แตการโฆษณาชวนเชื่ออยางไมหยุดหยอนดูเหมือนจะสงผลตอความคิดเห็นของสาธารณชน\n\nวันนี้ รัฐบาล[From.GetOldAdjective]ไดกาวไปอีกขั้นดวยการเปลี่ยนชื่อประเทศเปน '[From.GetNameDef]' เพื่อเปนการแสดงความเคารพตอประวัติศาสตรของภูมิภาค โดยหวังวาทุกคนในภูมิภาคจะรูสึกเชื่อมโยงได"
 wtt_news.68.a: "นี่คือจุดจบของลัทธิอาณานิคมในเอเชีย!"
 wtt_news.68.b: "พวกเขาไดกําหนดชะตากรรมของตนเองแลว"
 wtt_news.69.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.69.desc: "ขณะที่ชาติ[From.GetOldAdjective]ขยายเขาไปในดินแดนเพื่อนบาน รัฐบาลไดทบทวนการละทิ้งชื่อรัตนโกสินทรเสียใหม เมื่อพรมแดนในปจจุบันยิ่งคลายคลึงกับพรมแดนในยุครุงเรืองสูงสุดทางประวัติศาสตรของราชอาณาจักร ความสําเร็จของราชอาณาจักรรัตนโกสินทรก็ถูกนํามาใชโนมนาวความคิดเห็นของสาธารณชนมากขึ้นเรื่อย ๆ\n\nวันนี้ รัฐบาล[From.GetOldAdjective]ไดกาวไปอีกขั้นดวยการเปลี่ยนชื่อประเทศอยางเปนทางการเปน '[From.GetNameDef]' เพื่อแสวงหาความชอบธรรมจากประวัติศาสตร"
 wtt_news.69.a: "เราไดยืนยันความเปนใหญของเราอีกครั้ง"
 wtt_news.69.b: "จักรวรรดิอาณานิคมกําลังพังทลายหรือ?"
 wtt_news.70.t: "การกําเนิดใหมของ [From.GetNameDef]"
 wtt_news.70.desc: "ภายใตการปกครองของ [FROM.GetLeader] [From.GetOldNameDef] ไดขยายพรมแดนออกไปอยางมาก จนเกินกวาพรมแดนของจักรวรรดิโรมันอันศักดิ์สิทธิ์เดิมเสียอีก ศัตรูบนภาคพื้นทวีปทั้งหมดที่อาจทาทายการปกครองของเธอถูกจักรกลสงคราม[From.GetOldAdjective]บดขยี้จนคุกเขา ทําใหเธอไรผูตอตานในการดําเนินนโยบายตอไป\n\nบัดนี้ [FROM.GetLeader.GetSheHe] ไดมีบัญชาใหควาโอกาสในปจจุบัน และใหชาติกลายเปนผูสืบทอดทางจิตวิญญาณของจักรวรรดิโรมันอันศักดิ์สิทธิ์ เพื่อแสดงถึงสิ่งนี้ ชาติไดเปลี่ยนชื่ออยางเปนทางการแลว และดวยเหตุนี้ เธอจึงบรรลุการรวมภูมิภาคทางการเมืองที่บรรดาจักรพรรดิไมอาจทําไดมานานหลายศตวรรษในที่สุด"
 wtt_news.70.a: "Aquila Elegit Iovis Omnia Vincit! (อินทรีแหงจูปเตอรผูถูกเลือก พิชิตทุกสิ่ง!)"
 wtt_news.70.b: "ความงดงามและความรุงโรจนของเธอไมอาจปฏิเสธได!"

 
