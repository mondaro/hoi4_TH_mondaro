 SWE_mythologize_swedish_history_desc: "เราไดยึดกลไกรัฐไวแลว แตยังมีอีกมากที่ตองทําเพื่อกุมอํานาจใหมั่นคง เราจึงจะดําเนินการปฏิรูปเปนระลอกเพื่อเอาใจผูสนับสนุนทางการเมือง พรอมกับถอนรากถอนโคนผูที่ยังขัดขืนอํานาจของเรา"
 SWE_mythologize_swedish_history_tt: "ปลดล็อกการตัดสินใจและเปดใชภารกิจเพื่อทําตามพันธะที่มีตอกลุมที่สนับสนุนพวกชาตินิยมระหวางการขึ้นสูอํานาจ §Rเสถียรภาพจะไดรับผลกระทบอยางรุนแรงหากไมทําตามพันธะ!§!"
 SWE_crisis_affecting_variables: "พวกเขาจะมีแนวโนมยอมรับมากขึ้นหาก:\n -พวกเขามี§Yความเห็นตอเราสูง§!\n -เรามี§Yกองทัพบก§!ที่แข็งแกรงกวาพวกเขา\n -พวกเขามี§Yการสนับสนุนสงครามตํ่ากวา 40%§!\n -พวกเขาไมไดอยูในฝายใด"
 SWE_narvik_crisis: "วิกฤตนารวิก"
 SWE_narvik_crisis_desc: "นารวิกมีความสําคัญทางยุทธศาสตรในฐานะเสนทางสงออกแรเหล็กหลักของเราในชวงฤดูหนาว เพื่อความมั่นคงของชาติเราในยามวุนวายเชนนี้ ภูมิภาคนี้ควรอยูใตอํานาจของเรา และหาก[NOR.GetName]ออนแอลงในกระบวนการนี้ ก็ยิ่งดี"
 SWE_bornholm_crisis: "วิกฤตบอรนโฮลม"
 SWE_bornholm_crisis_desc: "เราเสียเกาะบอรนโฮลมไปเมื่อเกาะนี้กอกบฏเมื่อหลายศตวรรษกอน ทั้งที่ไมเคยถูกยกให[Den.GetName]อยางถูกกฎหมาย เกาะนี้มีความสําคัญทางยุทธศาสตรเพราะควบคุมทะเลบอลติกตอนลาง และเห็นไดชัดวา[Den.GetName]ไมสามารถปกปองมันได เราทําไดและเราตองยึดมันกลับคืนมาเพื่อความปลอดภัยของเรา"
 SWE_the_aland_issue: "ปญหาโอลันด"
 SWE_the_aland_issue_desc: "ชาวโอลันดพูดภาษาสวีเดน ถือวาตนเปนชาวสวีเดน และคงจะเปนชาวสวีเดนไปแลวหากไมใชเพราะการแทรกแซงของสันนิบาตชาติ แลวจะมีใครสรุปไดอยางไรวาพวกเขาไมใชชาวสวีเดน? ถึงเวลาแลวที่จะแกไขความอยุติธรรมทางประวัติศาสตรนี้"
 SWE_join_the_anti_soviet_pact: "เขารวมสนธิสัญญาตอตานโซเวียต"
 SWE_join_the_anti_soviet_pact_desc: "ชาติสวนใหญหวาดกลัวการผงาดขึ้นของ[SOV.GetNameDef] แตแทบไมมีเจตนาจะทําอะไรเพื่อสกัดกั้นอิทธิพลที่แผขยาย ยกเวนประเทศที่ลงนามในสนธิสัญญาตอตานโคมินเทิรน เราควรแสดงเจตนาใหชัดเจนดวยการเขารวมสนธิสัญญานี้ดวย"
 SWE_join_the_anti_soviet_pact_tt: "เราจะกําหนดเขตอิทธิพลรวมกับ[GER.GetName] ซึ่งจะทําใหพวกเขาแทบไมมีโอกาสโจมตี §Y[DEN.GetName]§! และ §Y[NOR.GetName]§! เปนเวลา §Y2 ป§!"
 SWE_demand_atlantic_resource_rights: "เรียกรองสิทธิ์ในทรัพยากรแอตแลนติก"
 SWE_demand_atlantic_resource_rights_desc: "เราบั่นทอนอธิปไตยของ[DEN.GetAdjective]ไดสําเร็จแลว บัดนี้เราตองกาวตอไปดวยการริบดินแดนในมหาสมุทรแอตแลนติกของพวกเขา ภายใตขออางวาจะปกปองพวกเขาจากผูที่หมายจะรุกรานในภูมิภาค"
 SWE_demand_demilitarization_of_finnish_border: "การปลอดทหารในฟนแลนด"
 SWE_demand_demilitarization_of_finnish_border_desc: "ในฐานะสวนหนึ่งของแผนผนวกรวม[FIN.GetName]กลับคืน เราตองบั่นทอนอธิปไตยของพวกเขาตอไป ขณะเดียวกันก็ปลอยใหพวกเขารักษาการปองกันที่นาเชื่อถือไวตอชาว[SOV.GetAdjective]ทางตะวันออก เราจึงควรผลักดันใหปลอดทหารตามพรมแดนที่ติดกับเรา เพื่อใหพวกเขาตั้งรับไดยากขึ้นหากเราจําเปนตองแทรกแซงกิจการของพวกเขาดวยกําลัง"
 SWE_united_kingdoms_of_sweden_and_norway: "สหราชอาณาจักรสวีเดนและนอรเวย"
 SWE_united_kingdoms_of_sweden_and_norway_desc: "หลังวิกฤตนารวิกและสิ่งที่เราไดมาตามมา [NOR.GetName]ก็ออนแอและหมดกําลังใจ บัดนี้เราตองปดฉากเอกราชของ[NOR.GetAdjective]และบังคับใหชาติทั้งสองกลับมารวมกันภายใตผูปกครองเพียงหนึ่งเดียว"
 SWE_swedish_finnish_defense_agreement: "ขอตกลงปองกันรวมสวีเดน-ฟนแลนด"
 SWE_swedish_finnish_defense_agreement_desc: "ตราบใดที่ยังไมไดจัดการภัยคุกคามจาก[SOV.GetNameDef] การรวมมือทางทหารกับชาว[FIN.GetAdjective]ก็เปนประโยชนตอเรา สักวันหนึ่งเราจะนําพวกเขากลับมาอยูใตการปกครองของเรา แตตอนนี้เรามีปญหาที่ใหญกวาใหจัดการ"
 SWE_swedish_finnish_defense_agreement_faction: "ขอตกลงปองกันรวมสวีเดน-ฟนแลนด"
 SWE_danish_alignment: "ดึงเดนมารกมาเปนพวก"
 SWE_danish_alignment_desc: "[DEN.GetName]ตั้งอยูในจุดยุทธศาสตรและออนแอกวาเพื่อนบานอยางมาก จึงแทบหลีกเลี่ยงไมไดที่ชาติใดชาติหนึ่งจะพยายามริบเอกราชของชาว[DEN.GetAdjective] ดังนั้น เราควรลงมือกอนที่จะเสียโอกาสไป"
 SWE_finnish_integration: "ครึ่งตะวันออกของราชอาณาจักร"
 SWE_finnish_integration_desc: "เราบั่นทอนอธิปไตยของ[FIN.GetAdjective]ไดสําเร็จในชวงหลายปที่ผานมา บัดนี้เราตองผลักดันครั้งสุดทายและเรียกรองใหพวกเขากลับมาเปนขาแผนดินโดยชอบธรรมของเราอีกครั้ง หากพวกเขาไมยินยอมโดยดี เราจะบังคับใหพวกเขาเห็นเหตุผลเอง"
 SWE_crusade_against_bolshevism: "[AAT_crusade_against_sov]"
 SWE_crusade_against_bol: "สงครามครูเสดตอตานบอลเชวิค"
 SWE_crusade_against_rus: "สงครามครูเสดตอตานจักรวรรดินิยมรัสเซีย"
 SWE_crusade_against_bolshevism_desc: "[SOV.GetNameDefCap]คือภัยคุกคามที่ใหญที่สุดตอคานิยมดั้งเดิมของยุโรปในรอบหลายศตวรรษ แคการปดลอมมันไวไมเพียงพออีกตอไป เราตองทําสงครามครูเสดครั้งใหมตอตานบอลเชวิคและทําลายมันเสีย"
 SWE_crusade_against_bolshevism_tt: "\nหาก §Y$SWE_crusade_against_the_eastern_threat$§! มีผลอยู ขณะที่ §Y[SWE.GetName]§! หรือสมาชิกฝายใดยึดรัฐใดรัฐหนึ่งตอไปนี้ได:\n§Y[195.GetName]§!,§Y[206.GetName]§!,§Y[202.GetName]§!,§Y[242.GetName]§!,§Y[219.GetName]§!,§Y[137.GetName]§!,§Y[218.GetName]§!,§Y[217.GetName]§!,§Y[252.GetName]§!,§Y[249.GetName]§!,§Y[229.GetName]§!,§Y[247.GetName]§!,§Y[408.GetName]§!,§Y[214.GetName]§! ระยะเวลาจะถูกรีเซ็ตกลับเปน 365 วันเต็ม"
 SWE_reclaiming_the_rus: "ทวงคืนดินแดนรุส"
 SWE_reclaiming_the_rus_desc: "บรรพบุรุษของเราเคยสัญจรไปมาตามแมนํ้าทางตะวันตกของรัสเซียและยูเครน และตั้งถิ่นฐานตามริมฝง ถึงเวลาแลวที่เราจะผนวกภูมิภาคเหลานี้เขามาในอาณาเขตของเรา และสานตอสิ่งที่พวกเขาเริ่มไวดวยการตั้งอาณานิคมใหสําเร็จ"
 SWE_greater_nordic_reich: "มหาอาณาจักรนอรดิก"
 SWE_greater_nordic_reich_desc: "ดวยกําลังเพียงอยางเดียว เราไดพิสูจนแลววาเราเปนเจาแหงสแกนดิเนเวียอยางไมมีใครโตแยง แตนี่เปนเพียงจุดเริ่มตนของประชาชนเรา เมื่อเรารวมเปนอาณาจักรหนึ่งเดียว โลกจงเตรียมรับสิ่งที่กําลังจะมาถึง"
 SWE_greater_nordic_reich_tt: "อนุญาตใหทําใหรัฐในอารักขา§Yนอรดิก§!เปนดินแดนหลักและผนวกได"
 SWE_the_cross_we_bear: "กางเขนที่เราแบกไว"
 SWE_the_cross_we_bear_desc: "เราทุกคนลวนเปนพี่นองชาวนอรดิก รัฐ[SWE.GetAdjective]ไมอาจนั่งดูเฉยอยางสบายใจได ขณะที่พี่นองนอรดิกของเราทนทุกขอยูใตการยึดครอง เปนหนาที่ของเราที่จะปลดพันธนาการของพวกเขา เพื่อใหเราทุกคนไดอยูและตายในดินแดนเหนือ อยางเปนอิสระจากสงครามและทรราช"
 SWE_the_cross_we_bear_tt_1: "สําหรับทุกประเทศ§Yนอรดิก§!ที่ถูกยึดครอง:"
 SWE_the_cross_we_bear_tt_2: "สําหรับทุกประเทศ§Yนอรดิก§!ที่ไดรับการปลดปลอย:"
 SWE_the_cross_we_bear_tt_3: "เพิ่มความแข็งแกรงของ §Y$SWE_the_cross_we_bear$§! โดย:"
 SWE_scandinavian_defense_union: "สหภาพปองกันสแกนดิเนเวีย"
 SWE_scandinavian_defense_union_desc: "ความขัดแยงที่ผานมาแสดงใหเห็นวาการยึดติดกับความเปนกลางแบบโดดเดี่ยวอยางดื้อรั้นนั้นอันตรายอยางยิ่ง หากเราตองการหลีกเลี่ยงการถูกศัตรูลอมรอบในอนาคต เราควรทําขอตกลงกับเพื่อนบานนอรดิกวาจะปกปองกันและกันหากชาติใดชาติหนึ่งถูกโจมตี"
 SWE_the_threat_of_the_iron_curtain: "ภัยคุกคามจากมานเหล็ก"
 SWE_the_threat_of_the_iron_curtain_desc: "แมความขัดแยงที่เพิ่งกลืนกินโลกสวนใหญจะเพิ่งผานไป แตความตึงเครียดระหวางมหาอํานาจผูชนะก็กําลังกอตัว หากเราตองการหลีกเลี่ยงการถูกศัตรูเด็ดทิ้งทีละรายขณะที่พวกมันแยงชิงการควบคุมบอลติก เราควรยับยั้งพวกมันดวยการเปนสวนหนึ่งของพันธมิตรของชาติที่มีแนวคิดเดียวกัน"
 SWE_special_forces: "ลงทุนในหนวยรบพิเศษ"
 SWE_special_forces_desc: "สงครามสมัยใหมบางครั้งตองการกองกําลังเฉพาะทางกลุมเล็ก ๆ ที่สามารถปฏิบัติภารกิจในภูมิประเทศอันโหดรายหรือปฏิบัติการหลังแนวขาศึกโดยไมตองรอกําลังเสริม เราจึงควรจัดตั้งเหลาหนวยรบพิเศษที่สามารถเปนทัพหนาของกองทัพ[SWE.GetAdjective]เมื่อจําเปน"
 SWE_acquire_ww2_tanks_and_wrecks: "เก็บซากรถถังจากสนามรบ"
 SWE_acquire_ww2_tanks_and_wrecks_desc: "เมื่อฝุนควันทั่วยุโรปจางลง มีรถถังที่ถูกทิ้งไวนับไมถวนในสนามรบ ซึ่งเราสามารถนํามาวิจัยและพัฒนาเพื่อปรับปรุงแบบของเราเอง บางทีถึงเวลาแลวที่เราจะใชประโยชนจากสถานการณนี้กอนที่ผูอื่นจะชิงของรางวัลจากสงครามเหลานี้ไป"
 SWE_extend_the_time_of_preparedness: "ขยายชวงเวลาเตรียมพรอม"
 SWE_extend_the_time_of_preparedness_desc: "แมบางคนอยากเห็นทุกอยางใน[ROOT.GetName]กลับสูภาวะปกติในทันที แตยังมีภัยคุกคามอีกมากรออยูที่ขอบฟา เพื่อรักษาความสามารถในการปกปองชาติ เราตองคงสถานะความพรอมในปจจุบันและความมุงมั่นตอการปองกันประเทศแบบเบ็ดเสร็จตอไป"
 SWE_increase_intelligence_funding: "เพิ่มงบประมาณขาวกรอง"
 SWE_increase_intelligence_funding_desc: "[SWE.capital.GetCapitalVictoryPointName]กลายเปนศูนยกลางกิจกรรมจารกรรมในชวงหลายปที่ผานมา เราควรเพิ่มงบประมาณใหหนวยขาวกรอง เพื่อใหพวกเขาพัฒนาเทคโนโลยีใหมและมีบทบาทเชิงรุกมากขึ้นในการเฝาติดตามกิจกรรมดังกลาวกอนที่มันจะคุกคามผลประโยชนของเรา"
 SWE_karnvapenprogram: "โครงการอาวุธนิวเคลียร"
 SWE_karnvapenprogram_bonus: "โบนัสโครงการอาวุธนิวเคลียร"
 SWE_karnvapenprogram_nuclear_bonus: "โบนัสดานนิวเคลียรของโครงการอาวุธนิวเคลียร"
 SWE_karnvapenprogram_air_bonus: "โบนัสดานอากาศของโครงการอาวุธนิวเคลียร"
 SWE_ger_swe_nuclear_bonus: "โบนัสโครงการยูเรเนียมเยอรมัน-สวีเดน"
 SWE_karnvapenprogram_desc: "ดวยการพัฒนาอาวุธปรมาณู หนทางเดียวที่จะรับประกันความมั่นคงของชาติไดอยางแทจริงคือการพัฒนาอาวุธเชนนั้นของเราเองพรอมระบบนําสงที่เหมาะสม การใชการพัฒนาพลังงานนิวเคลียรและอาวุธตามแบบเปนฉากบังหนา จะทําใหเราทําไดโดยไมทําใหมหาอํานาจตื่นตระหนก"
 SWE_specialized_equipment: "ยุทโธปกรณทางทหารเฉพาะทาง"
 SWE_specialized_equipment_desc: "การฝกหนวยรบพิเศษใหมเปนไปไดดวยดี อยางไรก็ตาม เริ่มเห็นไดชัดวาพวกเขาจะมีประสิทธิภาพมากขึ้นหากมียุทโธปกรณและยานพาหนะเฉพาะทางสําหรับภารกิจของตน"
 SWE_specialized_equipment_tt: "ปลดล็อกยุทโธปกรณเฉพาะทางตามหนวยรบพิเศษที่เลือกไวกอนหนา (เรนเจอร พลรม หรือนาวิกโยธิน)"
 SWE_something_something_neutrality_butt_really: "ความเปนกลางอะไรสักอยาง แตจริงจังนะ"
 SWE_something_something_neutrality_butt_really_desc: "รอดําเนินการ"
 SWE_the_lion_of_the_north_rises: "สิงหแหงเหนือผงาด"
 SWE_the_lion_of_the_north_rises_desc: "สวีเดนนั่งดูอยูขางสนามของการชวงชิงอํานาจระดับโลกมานานเกินไปแลว เพราะเหตุนั้น เราจึงถูกมหาอํานาจยื่นขอเรียกรองอันอุกอาจและปดลอม วันเวลาเหลานั้นสิ้นสุดลงแลว สิงหแหงเหนือจะผงาดขึ้นอีกครั้งและเขารับตําแหนงผูนําของภูมิภาค"
 SWE_preemptive_strike: "การโจมตีชิงลงมือกอน"
 SWE_preemptive_strike_desc: "แมหลายคนอยากทิ้งความขัดแยงไวเบื้องหลัง แตเราไมอาจทําผิดพลาดซํ้าเดิมได เราตองโจมตีศัตรูกอนที่พวกมันจะแข็งแกรงเกินไป หรือที่แยกวานั้นคือพัฒนาอาวุธปรมาณูของตนเองได หากเราโจมตีอยางรวดเร็วและรุนแรง เราจะจูโจมพวกมันไดโดยไมทันตั้งตัว"
 SWE_war_games: "การซอมรบ"
 SWE_war_games_desc: "ไมมีการเสแสรงใด ๆ ระหวางเรากับศัตรูอีกตอไปวาเรายืนอยูตรงไหนทางภูมิรัฐศาสตร ดังนั้น เราจึงไมมีอะไรตองเสียหากจะใหกองทัพเขารวมการซอมรบที่คาดการณความขัดแยงกับศัตรูเหลานั้น"
 SWE_scramble_for_the_baltic: "ชวงชิงบอลติก"
 SWE_scramble_for_the_baltic_desc: "ดินแดนที่รัฐบอลติกครอบครองอยูในปจจุบัน ครั้งหนึ่งเคยเปนอาณาเขตของจักรวรรดิสวีเดนในหลายศตวรรษกอน หากเราจะฟนฟูความเปนใหญเหนือทะเลบอลติกทั้งหมด เราตองรีบลงมือทวงดินแดนเหลานี้คืนกอนที่ชาว[GER.GetAdjective]หรือชาว[SOV.GetAdjective]จะชิงตัดหนาไป"
 SWE_economic_integration: "ผนวกรวมเศรษฐกิจกับ[GER.GetNameDef]"
 SWE_economic_integration_desc: "หลังการขึ้นสูอํานาจอันนองเลือดของเรา ชาติก็ตกอยูในซากปรักหักพังและตองการการฟนฟูอยางเรงดวน เมื่ออุตสาหกรรมของเรายอยยับ เราควรพยายามผนวกรวมอุตสาหกรรมเขากับเศรษฐกิจ[GER.GetAdjective]ในวงกวาง เพื่อใชประโยชนจากแสนยานุภาพทางเศรษฐกิจของพวกเขา"
 SWE_economic_independence: "รักษาเอกราชทางเศรษฐกิจ"
 SWE_economic_independence_desc: "แมเราจะซาบซึ้งในการสนับสนุนของ[GER.GetAdjective]ตอการปฏิวัติอันรุงโรจนของเรา แตเราไมมีเจตนาจะกลายเปนอีกมณฑลหนึ่งของพวกเขา ในการฟนฟูเศรษฐกิจ เราตองวางโครงสรางใหสงเสริมความเปนอิสระทางเศรษฐกิจเหนือสิ่งอื่นใด" 
 SWE_military_integration: "ผนวกรวมกองทัพกับ[GER.GetNameDef]"
 SWE_military_integration_desc: "ชาวสวีเดนลืมไปแลววาทําสงครามอยางไร แตเรามีโอกาสฟนฟูความรูนั้นดวยการตอยอดความสัมพันธกับ[GER.GetNameDef] การผนวกรวมกองทัพของเรากับของพวกเขาจะทําใหเรามีสวนรวมในการปลดปลอยยุโรปจากบอลเชวิค และทําใหชาว[SWE.GetAdjective]แกรงขึ้นไปพรอมกัน"
 SWE_military_independence: "รักษากองทัพที่เปนอิสระ"
 SWE_military_independence_desc: "ทําไมทหาร[SWE.GetAdjective]ตองไปตายเพื่อ[GER.GetNameDef]ในเทือกเขาแอลปหรือแอฟริกาเหนือ ในเมื่อมีเรื่องเรงดวนกวาใกลบาน? เราตองรักษาความเปนอิสระทางทหารและรวบรวมกําลังไวรับมือภัยคุกคามที่ชายแดน"
 SWE_germanify_sweden: "โอบรับวัฒนธรรมเจอรแมนิก"
 SWE_germanify_sweden_desc: "แมหลายคนจะโตแยงวาเราเปนคนละชนชาติกัน แตประสบการณที่ผานมาแสดงใหเห็นวาสวีเดนเปนสวนหนึ่งของภราดรภาพเจอรแมนิกที่ผูกพันกันดวยสายเลือด ถึงเวลาแลวที่เราจะกําจัดรองรอยอิทธิพลตางชาติทั้งหมด และโอบรับรากเหงาเจอรแมนิกของเราอีกครั้ง"
 SWE_promote_nordic_identity: "สงเสริมอัตลักษณนอรดิก"
 SWE_promote_nordic_identity_desc: "วัฒนธรรมนอรดิกและ[GER.GetAdjective]อาจมีความคลายคลึงกันอยูบาง แตเราไมใชชาว[GER.GetAdjective] ผูคนแหงสแกนดิเนเวียและฟนแลนดมีวัฒนธรรมและประเพณีของตนเองที่สืบยอนไปนับยุคสมัย ซึ่งตองไดรับการเชิดชูและปกปองจากผูอื่นทั้งปวง"
 SWE_finland_claims: "การรับรองการอางสิทธิ์ในฟนแลนดของเรา"
 SWE_finland_claims_desc: "ดินแดนของ[FIN.GetNameDef]เปนอาณาเขตของเราโดยชอบธรรม และดวยพลังที่เพิ่งไดมา เราสามารถยืนยันการควบคุมเหนือดินแดนนั้นอีกครั้ง อยางไรก็ตาม ความขัดแยงในภูมิภาคที่ผานมาทําใหสถานการณทางภูมิรัฐศาสตรซับซอนขึ้น เราจึงตองการการสนับสนุนจาก[GER.GetNameDef]เพื่อใหการอางสิทธิ์ของเรามีนํ้าหนัก"
 SWE_establish_nordland: "รัฐในอารักขาไรชนอรดลันด"
 SWE_establish_nordland_desc: "เราไดลุกขึ้นจากเถาถานภายใตการชี้นําของ[GER.GetNameDef] แข็งแกรงกวาที่เคยเปนมา บัดนี้เราจะไดรับรางวัลสําหรับความภักดีตออุดมการณ ดวยการขยายอาณาเขตลึกเขาไปในดินแดนตะวันออก"
 SWE_establish_nordland_tt: "§Y[SWE.GetNameDef]§! จะเปนที่รูจักในนาม §Y$SWE_establish_nordland$§!"
 SWE_uranium_project: "โครงการยูเรเนียม[GER.GetAdjective]-[SWE.GetAdjective]"
 SWE_uranium_project_desc: "นักวิทยาศาสตร[GER.GetAdjective]ทําการวิจัยนิวเคลียรมาหลายปแลว พวกเขาเชื่อวาพลังงานของอะตอมสามารถปลดปลอยออกมาไดในการระเบิดมหึมาเพียงครั้งเดียว ดวยการเขาถึงนํ้ามวลหนักสําหรับการทดลองและความเชี่ยวชาญทางวิทยาศาสตรรวมกัน เราอาจชวยพวกเขาสรางอาวุธมหัศจรรยเชนนั้นได"
 SWE_betray_germany_plan: "สูอาณาจักรสวีเดน"
 SWE_betray_germany_plan_desc: "[GER.GetNameDefCap]ขยายกําลังเกินตัวและถูกลิขิตใหลมสลาย เราจึงควรวางแผนรักษาอนาคตของเราเองดวยการเรงความพินาศของพวกเขา แตจะเปนไปไดก็ตอเมื่อศัตรูของ[GER.GetNameDef]ยินดีทําสันติภาพแยกกับเรา…"
 SWE_undermine_the_fascists: "บอนทําลายพวกฟาสซิสต"
 SWE_undermine_the_fascists_desc: "พวกฟาสซิสตที่แยงชิงอํานาจเปนแคฝูงชนอันธพาลที่โกรธแคน หากไดโอกาส พวกมันจะนําชาติไปสูหายนะ เราตองบอนทําลายแรงสนับสนุนของพวกมัน และทําใหผูรักชาติที่แทจริงทุกคนยังคงจงรักภักดีตอพระมหากษัตริย"
 SWE_revoke_anti_militia_laws: "ยกเลิกกฎหมายหามกองกําลังติดอาวุธ"
 SWE_revoke_anti_militia_laws_desc: "นักการเมืองสายตาสั้นในรัฐสภาริกสดักไดสั่งหามการจัดตั้งกลุมกึ่งทหารในป 1934 หลังการเปดโปงกองกําลังมุงก (Munckska kåren) เมื่อมีพวกสังคมนิยมและคนทรยศอื่น ๆ อยูทามกลางเรามากมาย เราตองยกเลิกคําสั่งหามนั้นและจัดตั้งกองกําลังสตอรมทรุปเปอรใหมเพื่อรักษาความปลอดภัยของชาติ"
 SWE_revoke_anti_militia_laws_tt: "สรางแมแบบกองพลทหารบาน§Yสตอรมทรุปเปอร§!ใหม และปลดล็อก§Yการเกณฑทหารบานสตอรมทรุปเปอร§! หลังจาก[SWE.GetFascistParty]ขึ้นสูอํานาจ"
 SWE_unify_the_national_socialist_movement: "รวมขบวนการชาติสังคมนิยมเปนหนึ่ง"
 SWE_unify_the_national_socialist_movement_desc: "ขบวนการชาติสังคมนิยมแตกออกเปนกลุมยอยมากมาย ที่เอาแตเขียนบทบรรณาธิการไรสาระโจมตีกันเอง หรือไมก็ตะลุมบอนกันกลางถนน หากพวกเขาจะมีโอกาสจัดตั้งรัฐบาล ก็ตองรวมตัวกันภายใตผูนําและสารเพียงหนึ่งเดียว"
 SWE_unify_the_national_socialist_movement_tt_1: "สามารถเลือกไดหนึ่งในตัวเลือกตอไปนี้จากเหตุการณ:"
 SWE_unify_the_national_socialist_movement_tt_2: "หรือ:"
 SWE_unify_the_national_socialist_movement_tt_3: "ปลดล็อกการตัดสินใจเพื่อเพิ่มแรงสนับสนุนฟาสซิสตผานการเดินขบวนในรัฐที่มีการเกณฑสตอรมทรุปเปอรแลว"
 SWE_meet_with_the_king: "เขาเฝาพระมหากษัตริย"
 SWE_meet_with_the_king_desc: "กระแสชาตินิยมที่พุงสูงใน[SWE.GetName]ไดดึงความสนใจของพระมหากษัตริย พระองคทรงขอใหบุคคลชั้นนําที่ปลุกระดมแรงสนับสนุนนี้เขาเฝาที่พระราชวังเพื่อหารือถึงเจตนาของพวกเขา"
 SWE_meet_with_the_king_tt: "ปลดล็อกการตัดสินใจเพื่อเพิ่มแรงสนับสนุนขบวนการนิยมกษัตริยผานการเสด็จประพาส[SWE.GetName]"
 SWE_attack_Landsorganisationen: "โจมตีสมาพันธแรงงาน (Landsorganisationen)"
 SWE_attack_Landsorganisationen_desc: "พวกสังคมประชาธิปไตยเปนอุปสรรคสําคัญที่ตองกาวขามหากเราจะชวยชาติใหพนจากบอลเชวิค แทนที่จะสูกับพวกเขาตรง ๆ ในการเลือกตั้งอันไรสาระ เราจะใชทรัพยากรของเราปลุกปนใหประชาชนตอตานสหภาพแรงงานที่เปนแหลงทุนของพรรค"
 SWE_appeal_for_support: "รองขอการสนับสนุน"
 SWE_appeal_for_support_desc: "ชนชั้นสูงแหง[SWE.GetName]ไดเห็นอํานาจและอิทธิพลของตนถูกกัดกรอนมาหลายทศวรรษ แตก็ยังไมไดมอดดับไป ดวยการรวบรวมการสนับสนุนและทรัพยากรของพวกเขา เราจะนําชาติกลับสูรูปแบบการปกครองที่เปนธรรมชาติยิ่งขึ้น"
 SWE_appeal_for_support_tt: "ปลดล็อก§Yการตัดสินใจ 'รองขอการสนับสนุน'§! เพื่อรับแรงสนับสนุนทางการเมืองใหแกขบวนการชาตินิยม"

 SWE_align_more_closely_with_the_landsorganisationen: "ใกลชิดสมาพันธแรงงานยิ่งขึ้น"
 SWE_align_more_closely_with_the_landsorganisationen_desc: "สหภาพแรงงานที่เขมแข็งและการคุมครองแรงงานเปนสิ่งจําเปนสําหรับแรงงานสมัยใหมทุกกลุม เราจะสรางสายสัมพันธอันแนนแฟนกับสหภาพเหลานี้เพื่อประโยชนของกรรมกรทุกคน"
 SWE_align_more_closely_with_the_landsorganisationen_tt: "ปลดล็อกที่ปรึกษา:\n"
 SWE_socialist_reforms: "การปฏิรูปแบบสังคมนิยม"
 SWE_socialist_reforms_desc: "เมื่อเราไดอํานาจในรัฐสภาริกสดักมากพอแลว เราจึงเริ่มวางรากฐานสําหรับสาธารณรัฐสังคมนิยมที่แทจริงได เพื่อรักษาสถานะของเรา เราตองรีบปฏิรูปเพื่อจํากัดอิทธิพลของชนชั้นกระฎมพีและไดรับการสนับสนุนจากชนชั้นกรรมาชีพ"
 SWE_socialist_reforms_tt: "§Yบานของประชาชน (Folkhemmet)§! ตอนนี้ใหโบนัส§Yการวิจัย§!เทียบเทา 25% ของ §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!\n§Yบานของประชาชน (Folkhemmet)§! ตอนนี้ใหโบนัส §Y$BONUS_PRODUCTION_EFFICIENCY_CAP_FACTOR$§! เทียบเทา 50% ของ §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 SWE_ture_nerman_tt: "$SWE_ture_nerman$"
 SWE_fredrik_strom_tt: "$SWE_fredrik_strom$"
 SWE_zeth_hoglund_tt: "$SWE_zeth_hoglund$"
 SWE_police_reforms: "ปองกันการตอตานการปฏิวัติ"
 SWE_police_reforms_desc: "ไมนาแปลกใจที่นโยบายของเราทําใหเรามีศัตรูทรงอิทธิพลในหมูชนชั้นกระฎมพีและชนชั้นสูง หากเราจะปองกันไมใหพวกเขากอการตอตานการปฏิวัติ เราตองรีบลงมือถอนรากถอนโคนพวกเขา พรอมกับผูที่หมายจะทรยศตอชนชั้นในหมูชนชั้นกรรมาชีพทั้งหมด"
 SWE_refuge_from_war: "ที่หลบภัยจากสงคราม"
 SWE_refuge_from_war_desc: "สงครามยอมนําไปสูการอพยพของผูที่หวาดกลัวตอชีวิตภายใตระบอบใหม ผูลี้ภัยหลายคนมีทักษะที่เปนประโยชนตอเรา ดังนั้น เรายอมหาขอตกลงที่เปนประโยชนตอทั้งสองฝายไดแนนอน"
 SWE_refuge_from_war_tt: "ไดรับกําลังพลจากทุกประเทศที่ไมไดเปนคอมมิวนิสตในขณะนี้ ตามสัดสวนแรงสนับสนุนคอมมิวนิสตของประเทศนั้น §Yประเทศนอรดิก§!และ§Yมหาอํานาจ§!ใหสวนแบงกําลังพลไดมากกวา สวน§Yประเทศเล็ก§!ใหสวนแบงนอยกวา รวมกําลังพลที่อาจไดรับสูงสุด: §G+80000§!\nกําลังพลรวมที่ไดรับตามสถานการณโลกปจจุบัน: §G+[?SWE_refugee_from_war_total_manpower_gained]§!\nประเทศที่ใหกําลังพลนอยที่สุด: §Y[?SWE_refugee_min_manpower_country.GetName]§!: §G+[?SWE_refugee_min_manpower_gained]§!\nประเทศที่ใหกําลังพลมากที่สุด: §Y[?SWE_refugee_max_manpower_country.GetName]§!: §G+[?SWE_refugee_max_manpower_gained]§!\nกําลังพลเฉลี่ยที่ไดรับตอประเทศ: §G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
 SWE_refuge_for_revolutionaries: "ที่พักพิงของนักปฏิวัติ"
 SWE_refuge_for_revolutionaries_desc: "แมสังคมนิยมจะเปนสิ่งที่หลีกเลี่ยงไมได แตยังมีนักปฏิวัติที่พบวาตนอยูฝายแพในความขัดแยง หรือติดอยูในรัฐที่ทรยศชนชั้นกรรมาชีพ เราจะประกาศใหชัดเจนวานักปฏิวัติเหลานั้นทุกคนจะพบเปาหมายและความปลอดภัยใน[SWE.GetName]"
 SWE_refuge_for_revolutionaries_tt: "ที่ปรึกษาคอมมิวนิสตจากประเทศอื่นจะยายมายัง[SWE.GetName]ตามสถานการณทางการเมืองของประเทศบานเกิด ปจจุบันที่ปรึกษาเหลานี้จะยายมายัง[SWE.GetName]:"
 SWE_liquidate_the_monarchy: "ลมลางสถาบันกษัตริย"
 SWE_liquidate_the_monarchy_desc: "ถึงเวลาแลวที่จะยุบสถาบันกษัตริยอันเปนกาฝากใน[SWE.GetName]ใหสิ้นซาก ราชวงศและชนชั้นสูงทั้งหมดจะถูกถอดบรรดาศักดิ์ และความมั่งคั่งของพวกเขาจะถูกแจกจายใหมใหแกประชาชน"
 SWE_establish_politburo: "จัดตั้งโปลิตบูโร"  
 SWE_establish_politburo_desc: "เมื่ออํานาจถูกริบไป ชนชั้นกระฎมพีและชนชั้นสูงก็ไมมีอีกตอไป ดังนั้น เราจะยุบรองรอยสุดทายของอิทธิพลพวกเขา นั่นคือรัฐสภาริกสดัก และจัดตั้งรัฐบาลกรรมกรชุดใหมขึ้นแทน"
 SWE_five_year_plan: "คณะกรรมการวางแผนแหงรัฐ"
 SWE_five_year_plan_desc: "ดวยการจัดตั้งโปลิตบูโรและการโอนอุตสาหกรรมทั้งหมดเปนของรัฐ บัดนี้เราตองการหนวยงานที่สามารถติดตามกิจการทางเศรษฐกิจและเสนอแนะการตัดสินใจเชิงนโยบายตอคณะกรรมการกลางของโปลิตบูโร"
 SWE_peoples_commissar_for_defense: "ผูบังคับการประชาชนฝายกลาโหม"
 SWE_peoples_commissar_for_defense_desc: "สักวันหนึ่ง พรมแดนทั้งปวงจะถูกสลายไปเมื่อกรรมกรทั่วโลกรวมตัวกัน จนกวาจะถึงวันนั้น เราตองคอยระวังและเตรียมพรอมรับการรุกลํ้าดินแดนใด ๆ เพื่อดูแลการปองกันของเรา เราตองจัดตั้งกระทรวงกลาโหมใหมที่ปลอดจากอิทธิพลของอดีตชนชั้นสูง"
 SWE_starve_the_fascists_of_iron: "ตัดเหล็กจากศัตรู"
 SWE_starve_the_fascists_of_iron_desc: "เราจะไมทําผิดซํ้ารอยชาติอื่นที่เอาใจศัตรูในอนาคต เพียงเพื่อใหพวกมันใชทรัพยากรของเรามาทําสงครามกับเรา นับจากวันนี้ เราจะหามสงออกทรัพยากรทั้งหมดใหพวกมัน รวมถึงแรเหล็กอันเปนที่หมายปองของเรา"
 SWE_finnish_buffer_state: "รัฐกันชนฟนแลนด"
 SWE_finnish_buffer_state_desc: "ไมตองสงสัยเลยวา[SOV.GetNameDef]อยากเห็นผูที่สอดคลองกับผลประโยชนของพวกเขามากกวาเขามาควบคุมกิจการของ[SWE.GetAdjective] เพื่อปองกันไมใหความขัดแยงปะทุขึ้นระหวางเรา สิ่งสําคัญคือ[FIN.GetName]ตองกลายเปนรัฐกันชนที่สอดคลองกับผลประโยชนของเรา"
 SWE_support_norwegian_communists: "สนับสนุนคอมมิวนิสตนอรเวย"
 SWE_support_norwegian_communists_desc: "เราจะไมมีวันปลอดภัยอยางสมบูรณจนกวา[NOR.GetName]จะเปนอิสระจากการปกครองของกระฎมพี อยางไรก็ตาม พวกเขาจะไมมีวันยอมรับรัฐบาลสังคมนิยมที่เราบังคับยัดเยียดให เราจึงตองสนับสนุนคอมมิวนิสต[NOR.GetAdjective]ในการตอสูเพื่อโคนลมระเบียบเดิม"
 SWE_support_danish_communists: "สนับสนุนคอมมิวนิสตเดนมารก"
 SWE_support_danish_communists_desc: "ที่ตั้งเชิงยุทธศาสตรของ[DEN.GetName]ระหวางทะเลบอลติกและทะเลเหนือทําใหมีอํานาจควบคุมความมั่นคงของชาติเรามากเกินกวาจะยอมรับได หนทางเดียวที่จะทําใหมั่นใจวาพวกเขาจะไมทรยศเราคือการสนับสนุนขบวนการคอมมิวนิสต[DEN.GetAdjective]และสถาปนาระบอบที่เปนมิตรขึ้นที่นั่น"
 SWE_sami_reconcilliation: "การปรองดองกับชาวซามี"
 SWE_sami_reconcilliation_desc: "ชาวซามีทนทุกขมานานหลายศตวรรษ ขณะที่ชาติตาง ๆ ขโมยดินแดนดั้งเดิมของพวกเขาและจํากัดสิทธิของพวกเขา เราจะทําทุกอยางที่ทําไดเพื่อชดเชยและเริ่มกระบวนการปรองดองกับชาวซามี"
 SWE_deep_mining_complexes: "เหมืองแรใตดินลึก"
 SWE_deep_mining_complexes_desc: "[SWE.GetName]มีทรัพยากรธรรมชาติอุดมสมบูรณซอนอยูใตดิน เราควรเพิ่มการลงทุนในภาคเหมืองแรเพื่อใชทรัพยากรเหลานั้นใหดียิ่งขึ้น นอกจากนี้ เรายังสามารถยับยั้งการโจมตีดวยการทําลายเหมือง เพื่อไมใหศัตรูไดสิ่งที่พวกมันนาจะตองการมากที่สุด"
 SWE_affordable_housing: "ที่อยูอาศัยราคาจับตองได"
 SWE_affordable_housing_desc: "แมมาตรฐานที่อยูอาศัยในเมืองจะเริ่มดีขึ้น แตยังมีผูคนอีกมากที่ติดอยูในความยากจนเพราะคาเชาที่แพงเกินเอื้อม เราตองทําใหทุกคนเขาถึงที่อยูอาศัยราคาจับตองไดเพื่อแกไขสถานการณนี้"
 SWE_continue_the_second_industrial_revolution: "เดินหนาการปฏิวัติอุตสาหกรรมครั้งที่สอง"
 SWE_continue_the_second_industrial_revolution_desc: "การพัฒนาอุตสาหกรรมอยางตอเนื่องคือกุญแจสูความมั่งคั่งและความปลอดภัยที่เพิ่มขึ้นของประชาชน ดังนั้น เราตองใชพลังของเทคโนโลยีใหมและเรงพัฒนาอุตสาหกรรมใหเร็วยิ่งขึ้นทั่ว[SWE.GetName]"
 SWE_paid_holidays: "วันหยุดพักผอนที่รัฐจายให"
 SWE_paid_holidays_desc: "ตนเหตุของความตึงเครียดมากมายระหวางกรรมกรกับภาคธุรกิจคือเรื่องวันหยุดพักผอน ภาคเอกชนจะทําเพียงขั้นตํ่าสุดในการชวยเหลือกรรมกรโดยไมทําผิดกฎหมาย ขณะที่ทํากําไรใหไดมากที่สุด ถึงเวลาแลวที่รัฐจะเขามากํากับดูแลวันหยุดเพื่อประโยชนของกรรมกรบาง"
 SWE_paid_holidays_policy_tt: "§G+3%§! §Yเสถียรภาพ§! และ §G+5%§! §Yความเร็วการกอสราง§! ตลอดชวงเวลาสวนใหญของป\n§Y+20% สินคาอุปโภคบริโภค§! เปนเวลา 30 วันตอป"
 SWE_privately_managed_holidays: "วันหยุดพักผอนที่เอกชนจัดการ"
 SWE_privately_managed_holidays_desc: "รัฐไมมีสิทธิ์เขาไปแทรกแซงวิธีดําเนินธุรกิจของภาคเอกชน ดังนั้น เราจะปลอยใหภาคเอกชนกําหนดนโยบายวันหยุดของตนเอง หากกรรมกรไมพอใจ ก็ไปหางานที่อื่นได"
 SWE_kockums: "ค็อกคุมส"
 SWE_kockums_desc: "ค็อกคุมสพิสูจนแลววามีความสามารถในการตอเรือและเรือดํานํ้าใหกองทัพเรือ เราควรขยายกิจการของพวกเขาและเพิ่มจํานวนเรือที่พวกเขาผลิตได"
 SWE_gotaverken: "เยอตาแวรเคิน"
 SWE_gotaverken_desc: "เพื่อปรับปรุงกองทัพเรือใหทันสมัย เราตองขยายอูตอเรือที่เยอตาแวรเคินและลงทุนในเทคโนโลยีการผลิตใหมสําหรับการตอเรือรบ"
 SWE_refit_gotaverken_for_rapid_repairs: "ปรับเยอตาแวรเคินเพื่อการซอมบํารุงเรงดวน"
 SWE_refit_gotaverken_for_rapid_repairs_desc: "การทุมอูตอเรือใหกับงานซอมอาจลดความเร็วในการตอเรือลง แตจะชวยเพิ่มความสามารถในการรักษากองเรือใหพรอมรบไดอยางมาก"
 SWE_retool_dockyards: "ปรับเครื่องมืออูตอเรือใหม"
 SWE_retool_dockyards_desc: "การทุมความพยายามไปที่เรือขนาดเล็กและเรือดํานํ้าจะใชจุดแข็งของเรา แทนที่จะพยายามแขงขันกับมหาอํานาจ"
 SWE_archapeligo_harrasment: "การกอกวนในหมูเกาะ"
 SWE_archapeligo_harrasment_desc: "ชายฝงของเราเปนอุปสรรคตอผูรุกรานทุกราย แตเราสามารถใชความคุนเคยกับหมูเกาะใหเปนประโยชนมากขึ้นในการกอกวนเรือศัตรูในพื้นที่ หากเรามอบทรัพยากรที่จําเปนใหกองทัพเรือ"
 SWE_unrestricted_submarine_warfare: "สงครามเรือดํานํ้าแบบไมจํากัดขอบเขต"
 SWE_unrestricted_submarine_warfare_desc: "เรือดํานํ้ามีความสามารถในการกอกวนการเดินเรือและเรือรบของศัตรูที่มีตนทุนทดแทนสูงกวามาก เราควรใชมันเพื่อลดชองวางทางอาวุธระหวางกองทัพเรือของเรากับของศัตรู"
 SWE_lindholmens_varv: "อูตอเรือลินดโฮลเมน"
 SWE_lindholmens_varv_desc: "อูตอเรือลินดโฮลเมนมุงเนนการตอเรือพลเรือนในชวงหลายปที่ผานมา ดวยการดัดแปลงเล็กนอย อูตอเรือของพวกเขาสามารถปรับมาสนับสนุนการขยายและการปรับปรุงกองทัพเรือใหทันสมัยได"
 SWE_italian_destroyers: "ซื้อเรือพิฆาตอิตาลี"
 SWE_italian_destroyers_desc: "การตอเรือตั้งแตศูนยมีราคาแพง อยางไรก็ตาม หลายชาติอาจยินดีขายเรือเกาบางสวนของตน ตัวอยางเชน [ITA.GetNameDefCap]ไดแสดงความสนใจที่จะขายเรือพิฆาตจํานวนหนึ่งใหเราในราคาที่สมเหตุสมผลมาก"
 SWE_italian_ships_tt: "จะนําไปสู [ROOT.GetFlag][ROOT.GetName]: \n"
 SWE_italian_ships_tt_2: "\n§R[ENG.GetNameDefCap]อาจพยายามสกัดกั้นการสงมอบเรือ!§!"
 SWE_rule_the_baltic: "ครองทะเลบอลติก"
 SWE_rule_the_baltic_desc: "[SWE.GetName]จะไมปลอดภัยจนกวาทะเลบอลติกจะอยูใตการควบคุมของเราอยางมั่นคง เพื่อการนั้น เราตองสรางความเชี่ยวชาญในการตอเรือขนาดใหญที่สามารถรับมือกับแบบเรือที่ดีที่สุดของเพื่อนบานได"
 SWE_defense_act: "พระราชบัญญัติกลาโหม"
 SWE_defense_act_tt: "§Yเราจะสามารถปรับเปลี่ยนผูนําทางการเมืองในการเลือกตั้งที่กําลังจะมาถึง§!"
 SWE_defense_act_desc: "สงครามกําลังตั้งเคาเหนือยุโรปอีกครั้ง และมีทางเลือกยาก ๆ ที่ตองตัดสินในรัฐสภาริกสดัก ไมมีเรื่องใดเรงดวนไปกวาการผานพระราชบัญญัติกลาโหม ซึ่งอาจฉีกรัฐบาลผสมใหแตกออกเปนเสี่ยง"
 SWE_strike_the_capitalist_beast_down: "โคนอสูรรายทุนนิยม"
 SWE_strike_the_capitalist_beast_down_desc: "ชนชั้นแรงงานแหงสวีเดนทนทุกขอยูใตแอกของกระฎมพีมานานเกินไปแลว ขณะที่พวกสังคมประชาธิปไตยเชื่อวาพวกเขาสามารถผอนความโหดรายของทุนนิยมได มีเพียงพวกสังคมนิยมเทานั้นที่บอกความจริงแกผูมีสิทธิ์เลือกตั้ง นั่นคือทุนนิยมไมอาจแกไขได ทุนนิยมตองถูกลมลาง"
 SWE_social_democracy: "สังคมประชาธิปไตย"
 SWE_social_democracy_desc: "พวกสังคมประชาธิปไตยมีวิสัยทัศนตอสวีเดนที่ไมไดตั้งอยูบนความกลัวหรือความโกรธ แตตั้งอยูบนความหวัง ความหวังวาการชวยเหลือผูที่ตองการมากที่สุดในสังคมจะนํามาซึ่งเสถียรภาพและความสุขสําหรับทุกคน ดวยความรวมมือและความเมตตาของเรา ในที่สุดเราจะสรางบานของประชาชนขึ้นได"
 SWE_as_the_barometer_falls: "ยามเมื่อบารอมิเตอรลดตํ่า"
 SWE_as_the_barometer_falls_desc: "เราไมอาจปลอยใหตัวเองถูกจูโจมโดยไมทันตั้งตัวจากการรุกลํ้าดินแดน ไมวาจะดวยสาเหตุใด ดังนั้น เราตองทําใหกองทัพมีแผนสํารองและการฝกที่เพียงพอเพื่อรับมือสถานการณเชนนั้นทุกรูปแบบ"
 SWE_the_old_enemy_stirs: "ศัตรูเกาเริ่มขยับ"
 SWE_the_old_enemy_stirs_desc: "หลังสงครามกลางเมืองอันนองเลือดและการพัฒนาอุตสาหกรรมขนานใหญตลอดทศวรรษ [SOV.GetNameDef]กําลังมุงจะกลับมาควบคุมดินแดนของอดีตจักรวรรดิรัสเซียและไกลกวานั้น หากเราตองการหลีกเลี่ยงการติดอยูในเขตอิทธิพลของ[SOV.GetName] เราตองรีบลงมือและเตรียมพรอมทําสงคราม"
 SWE_license_skf_ball_bearings: "ตลับลูกปน SKF"
 SWE_license_skf_ball_bearings_desc: "SKF กลายเปนผูนําระดับโลกในการผลิตตลับลูกปน ซึ่งบังเอิญเปนสิ่งสําคัญตอการผลิตยานพาหนะทางทหารสมัยใหมหลายชนิด เราควรใชสิ่งนี้ใหเปนประโยชนในการเจรจาการคากับชาติคูสงคราม"
 SWE_en_svensk_tiger: "เสือสวีเดน"
 SWE_en_svensk_tiger_desc: "ขอมูลใด ๆ ที่ศัตรูรวบรวมเกี่ยวกับเราไดอาจถูกใชบอนทําลายความมั่นคงของชาติ เพื่อปองกันสิ่งนี้ ความแข็งแกรงและเงียบขรึมดุจเสือผูทรงพลังตองกลายเปนสวนหนึ่งของอุปนิสัยชาว[SWE.GetAdjective]"
 SWE_swedes_not_sweden_to_finlands_aid_post_fin_war: "ชาวสวีเดน ไมใชสวีเดน ไปชวยฟนแลนด"
 SWE_swedes_not_sweden_to_finlands_aid_pre_fin_war: "กองอาสาสมัครสวีเดน"
 SWE_swedes_not_sweden_to_finlands_aid: "[SWE_FinnishVolunteerFocusLoc]"
 SWE_swedes_not_sweden_to_finlands_aid_desc: "แมรัฐบาลจะไมสามารถชวยเหลือ[FIN.GetName]ทางทหารอยางแข็งขันไดโดยไมละเมิดความเปนกลางของชาติ แตก็มีพลเมือง[SWE.GetAdjective]นับพันที่พรอมสละชีพเพื่อปกปองเพื่อนบานนอรดิกของเราในฐานะอาสาสมัคร"
 SWE_swedes_not_sweden_to_finlands_aid_tt: "\nจะถูกอัปเกรดโดยอัตโนมัติเปน:"
 SWE_swedes_not_sweden_to_finlands_aid_tt_2: "เมื่อ[FIN.GetName]อยูในสงครามกับประเทศมหาอํานาจ"
 SWE_finlands_cause_is_ours: "อุดมการณของฟนแลนดคืออุดมการณของเรา"
 SWE_finlands_cause_is_ours_desc: "การรุกรานของ[SOV.GetAdjective]ที่มุงเปาไปยัง[FIN.GetName]ยอมหันมาหาเราสักวันหนึ่งอยางหลีกเลี่ยงไมได แทนที่จะวางตัวหางเหินจากความขัดแยงในปจจุบัน เราตองรวมกับชาว[FIN.GetAdjective]ผลักดันภัยรายเกาแกนี้กลับไป"
 SWE_coalition_war_cabinet: "คณะรัฐมนตรีสงครามประชาธิปไตย"
 SWE_coalition_war_cabinet_desc: "เหตุการณทั่วโลกเมื่อไมนานมานี้ไดสั่นคลอนชาติและปลุกความกลัววาความขัดแยงจะลุกลามมาถึง[SWE.GetName] เพื่อสงเสริมความรูสึกเปนหนึ่งเดียวในยามยากลําบากนี้ เราจะจัดตั้งคณะรัฐมนตรีสงครามผสมที่ประกอบดวยสมาชิกชั้นนําของพรรคใหญในรัฐสภาริกสดัก"
 SWE_coalition_war_cabinet_tt: "§Yปลดล็อกการตัดสินใจเพื่อเพิ่มคุณลักษณะใหผูนําคนปจจุบันของเรา§!"
 SWE_the_aland_question: "ปญหา[145.GetName]"
 SWE_the_aland_question_desc: "ขณะที่[SOV.GetNameDef]พยายามกลับมาควบคุม[FIN.GetName] เราไมอาจปลอยใหพวกเขาควบคุมดินแดนยุทธศาสตรอยาง[145.GetName]ได หมูเกาะนี้อยูใกลชายฝงของเรา จึงอาจถูกใชแผอํานาจทางอากาศและทางทะเลของ[SOV.GetAdjective]ลึกเขามาในดินแดน[SWE.GetAdjective]"
 SWE_the_aland_question_tt: "§Y[FIN.GetName]§! มีแนวโนมจะยอมมอบอํานาจควบคุม §Yโอลันด§! ในกรณีนี้มากกวาใน §Y§Y$SWE_the_aland_issue$§!§! เวนแต §Y[SWE.GetName]§! จะมีกองทัพใหญกวา §Y[FIN.GetName]§! อยางมาก"
 SWE_the_nordic_defense_council: "สภาปองกันนอรดิก"
 SWE_the_nordic_defense_council_desc: "หากตางคนตางอยู ชาตินอรดิกแตละชาติยอมเปนเหยื่ออันงายดายของเพื่อนบานที่กระหายการขยายดินแดน แตหากเรารวมตัวกันแบงเบาภาระการปองกันรวม เราจะสรางพลังยับยั้งที่แทจริงตอผูรุกรานในอนาคตได กอนอื่น เราตองใหสัตยาบันสนธิสัญญาปองกันรวมกันระหวางประเทศที่อาจเปนสมาชิกขององคกรเชนนี้"
 SWE_nordic_defense_fleet: "กองเรือปองกันนอรดิก"
 SWE_nordic_defense_fleet_desc: "เมื่อสนธิสัญญาปองกันนอรดิกไดรับสัตยาบันแลว เราสามารถเริ่มกระบวนการรวมกําลังทางเรือของเราไวภายใตระบบบัญชาการรวม "
 SWE_nordic_defense_fleet_tt: "รัฐในอารักขาที่เปน §Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ:\nโอนกองเรือให §Y[SWE.GetName]§!"
 SWE_nordljus: "สรางเรือนอรดลีอุส"
 SWE_nordljus_desc: "กองทัพเรือของเราไมอาจแขงขันกับมหาอํานาจอื่นในทะเลบอลติกได และจําเปนตองมีเรือธงลําใหมไวตอกรกับศัตรูที่ทรงพลังที่สุด โครงการขนาดใหญเชนนี้จะสงผลเสียตอเศรษฐกิจของชาตินอรดิก แตบางครั้งเรื่องก็งายเพียงนี้:\n\nความแข็งแกรงตองเผชิญดวยความแข็งแกรง"
 SWE_nordljus_tt: "§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศไดรับ: "
 SWE_nordljus_tt_2: "สายการผลิตจะเริ่มตนที่ความคืบหนา §Y60%§!"
 SWE_centralized_military_aid: "รวมศูนยอุตสาหกรรมทหาร"
 SWE_centralized_military_aid_desc: "เราจําเปนตองพัฒนาขีดความสามารถทางทหารของทั้งเราและรัฐสมาชิก การลงทุนในการผลิตอาวุธจะมอบเครื่องมือใหกองทัพของเราใชปกปองพรมแดน "
 SWE_centralized_military_aid_tt: "§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศไดรับ:\n   เพิ่มชองสิ่งกอสราง §G1§! ชอง\n   เพิ่ม §Yโรงงานทหาร§! §G1§! แหง"
 SWE_merge_army_complexes: "รวมศูนยฐานทัพบก"
 SWE_merge_army_complexes_desc: "การรวมศูนยฐานการทหารของเราจะมีประสิทธิภาพมากกวา หากปลอยไวในรัฐสมาชิกก็เสี่ยงจะสูญเสียไปเมื่อถูกรุกราน"
 SWE_merge_army_complexes_tt: "§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ: §Yโรงงานทหาร§! §R-1§!\n(§Y[SWE.GetName]§!) §Yโรงงานทหาร§! §G+1§! ตอ §Yสมาชิกสภาปองกันนอรดิก§! แตละประเทศ"
 SWE_nordic_centralized_air_command: "กองบัญชาการทางอากาศนอรดิกรวมศูนย"
 SWE_nordic_research_exchange: "แลกเปลี่ยนการวิจัยนอรดิก"
 SWE_nordic_research_exchange_desc: "ชาตินอรดิกลวนกาวหนาทางเทคโนโลยี คงนาเสียดายหากเราไมแบงปนความกาวหนาแกกัน"
 SWE_nordic_protection_complex: "ศูนยอุตสาหกรรมปองกันนอรดิก"
 SWE_nordic_protection_complex_desc: "พวกเราชาวนอรดิกลวนปรารถนาสันติภาพ สิ่งเดียวที่เราตองการอยางแทจริงคือสิทธิขั้นพื้นฐานที่จะไดใชชีวิตในแดนเหนือ แกเฒาในแดนเหนือ และถูกฝงในแดนเหนือ หากผูใดคิดพรากสิ่งนั้นไปจากเรา พวกเขาก็จะถูกฝงอยูที่นี่เชนกัน"
 SWE_nordic_protection_complex_tt: "§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศไดรับ:\n   เพิ่มชองสิ่งกอสราง §G1§! ชอง\n   เพิ่ม §Yโรงงานพลเรือน§! §G1§! แหง"
 SWE_decentralized_nordic_volunteer_group: "กลุมอาสาสมัครนอรดิก"
 SWE_decentralized_nordic_volunteer_group_tt: "ไดรับกําลังพล §G+5000§! ตอ §Yสมาชิกสภาปองกันนอรดิก§! แตละประเทศ\n§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ: กําลังพล §G+5000§! ตอ §Yสมาชิกสภาปองกันนอรดิก§! แตละประเทศ"
 SWE_decentralized_nordic_volunteer_group_desc: "ทั่วดินแดนนอรดิกมีชายฉกรรจมากมาย ทั้งนายพราน นักแมนปน และคนอื่น ๆ ที่สามารถรับใชในกองทัพได เราตองตามหาพวกเขาและเกณฑเขาประจําการ"
 SWE_nordic_centralized_air_command_desc: "การปองกันภัยทางอากาศไดกลายเปนแนวรบสําคัญในสงครามสมัยใหม แตการตามใหทันความกาวหนาทางเทคโนโลยีนั้นมีราคาแพง เพื่อลดตนทุนพรอมกับรักษาการปองกันที่แข็งแกรง เราควรจัดตั้งกองบัญชาการทางอากาศนอรดิกรวม"
 SWE_nordic_centralized_air_command_tt: "รัฐในอารักขาที่เปน §Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ:\nโอนกองทัพอากาศให §Y[SWE.GetName]§!"
 SWE_train_the_sheltered: "ฝกผูลี้ภัย"
 SWE_train_the_sheltered_desc: "ความขัดแยงในภูมิภาคทําใหเพื่อนบานนอรดิกจํานวนมากมาลี้ภัยอยูที่ [SWE.GetName] หลายคนอยูในวัยที่สูรบได และอาจถูกเรียกมาชวยปกปองประเทศ"
 SWE_the_narvik_solution: "ทางออกนารวิก"
 SWE_the_narvik_solution_desc: "นารวิกมีความสําคัญยิ่งตอการขนสงแรเหล็กของเรา จึงตกเปนเปาหมายของชาติคูสงครามที่หวังจะยึดครองหรือขัดขวางการขนสงนั้น เพื่อรักษาความเปนกลางและการสงออกของเรา เราควรลดความตึงเครียดในภูมิภาคดวยการเขาควบคุมนารวิกในนามของ [NOR.GetName]"
 SWE_icelandic_independence: "เอกราชของไอซแลนด"
 SWE_icelandic_independence_desc: "ยังไมเสร็จ (TODO)"
 SWE_cement_control_of_the_baltic: "ตอกยํ้าการควบคุมทะเลบอลติก"
 SWE_cement_control_of_the_baltic_desc: "หากเราเสริมสรางและแผขยายแสนยานุภาพทางเรือไปทั่วทะเลบอลติก เราจะมั่นใจไดวาสงครามจะไมมีวันมาถึงชายฝงของชาตินอรดิกใด"
 SWE_seek_foreign_guarantees: "แสวงหาการรับประกันจากตางชาติ"
 SWE_seek_foreign_guarantees_desc: "ยังไมเสร็จ (TODO)"
 SWE_ga_pa_tactics: "ยุทธวิธีจูโจมโกโป"
 SWE_ga_pa_tactics_desc: "[SWE.GetName] เคยบุกเบิกการใชกําลังรบที่เคลื่อนที่เร็วในสนามรบมากอนยุคของรถถังนานแลว ถึงเวลาที่เราจะจุดประกายจิตวิญญาณแหงนวัตกรรมนั้นอีกครั้ง และพัฒนาสงครามสายฟาแลบในแบบของเราเอง"
 SWE_winter_drill: "การฝกฤดูหนาว"
 SWE_winter_drill_tt: "คาใชจาย §Yการยืนหยัดครั้งสุดทาย§! §G-25%§!\n"
 SWE_winter_drill_desc: "ดวยการฝกทหารของเราอยางทั่วถึงใหเขาใจภูมิประเทศ[SWE.GetAdjective]และรูวิธีใชสภาพอากาศใหเปนประโยชน พวกเขาจะไดเปรียบเหนือกองกําลังศัตรูที่ใหญกวาตนอยางมาก "
 SWE_research_slot_1: "[AAT_Sweden_royal_institute_name]"
 SWE_research_slot_1_desc: "การขยายความเชี่ยวชาญดานวิทยาศาสตรและวิศวกรรมของชาติเปนสิ่งสําคัญยิ่งตอการรักษากองทัพที่ทันสมัยและมีขีดความสามารถ เพื่อการนั้น เราจะลงทุนขยาย [AAT_Sweden_royal_institute_name] "
 SWE_RIT_communist: "สถาบันเทคโนโลยี"
 SWE_RIT_historical: "สถาบันเทคโนโลยีหลวง"
 SWE_infrastructure: "ลงทุนโครงสรางพื้นฐาน"
 SWE_infrastructure_desc: "พื้นที่สวนใหญของ [SWE.GetName] ยังเปนชนบทและดอยพัฒนาอยางนาเวทนา เราควรแกไขเรื่องนี้เพื่อใชประโยชนจากทรัพยากรธรรมชาติไดดียิ่งขึ้น"
 SWE_varnplikt: "แวรนพลิคท (การเกณฑทหาร)"
 SWE_varnplikt_desc: "การพึ่งพากองทัพอาชีพขนาดเล็กไมเพียงพอที่จะปกปองอธิปไตยของเราจากเพื่อนบานที่กาวราวกวา เราจึงจะนําระบบการรับราชการทหารมาใช เพื่อใหมั่นใจวาชายทุกคนในวัยที่สูรบไดจะไดรับการฝกทางทหารอยางนอยบาง"
 SWE_per_albin_bus: "รถบัสของ [SWE.GetLeader]"
 SWE_per_albin_bus_desc: "เมื่อศัตรูมีอํานาจการยิงมหาศาลอยูในมือ รัฐบาลอาจถูกตัดหัวดวยการโจมตีทางอากาศหรือการรุกราน เพื่อปองกันสถานการณเชนนั้น เราตองมีกองบัญชาการรัฐบาลเคลื่อนที่ที่สามารถติดตอกับกองทัพและประชาชนไดในยามวิกฤต"
 SWE_per_albin_bus_tt: "สรางหนวยกองบัญชาการเคลื่อนที่ที่ชวยใหผูนําของเราอพยพได อยางไรก็ตาม หากรถบัสถูกทําลาย ยอมไมเปนผลดีตอนายกรัฐมนตรีของเรา"
 SWE_land_air_warfare: "สงครามภาคพื้นดิน-อากาศ"
 SWE_land_air_warfare_desc: "แมกองทัพแตละเหลาจะตองการการฝกและยุทโธปกรณเฉพาะทางของตนเอง แตจะมีประสิทธิภาพสูงสุดในสนามรบเมื่อรวมมือกันบดขยี้ศัตรูทั้งภาคพื้นดินและจากทางอากาศไปพรอมกัน"
 SWE_totalforsvar: "ทูทาลเฟอรสวาร (การปองกันเบ็ดเสร็จ)"
 SWE_totalforsvar_desc: "ดังที่เราคาดไว ความขัดแยงในชวงหลังกําลังกลายเปนสงครามเบ็ดเสร็จอยางหลีกเลี่ยงไมได เราจึงตองเปลี่ยนเศรษฐกิจไปสูการผลิตเพื่อสงคราม เพื่อสงยุทโธปกรณที่ทหารของเราจําเปนตองใชปกปองประเทศ"
 SWE_totalforsvar_tt: "ปดภารกิจปลดระดมเศรษฐกิจ"
 SWE_jagartrupper: "เยการทรุปเปอร (หนวยพราน)"
 SWE_jagartrupper_tt: "สามารถสงหนวยพรานชั้นยอดไปกอวินาศกรรมทาเรือและศูนยเสบียงของศัตรูในรัฐที่อยูติดกับรัฐที่เราควบคุม โดยตองใช §Yกําลังพล§!\nผูนํากองทัพที่ยังไมมีคุณลักษณะดานภูมิประเทศจะไดรับคุณลักษณะ §Yพราน§!"
 SWE_jagartrupper_desc: "เมื่อเผชิญกับกองกําลังที่มีจํานวนเหนือกวา เราจําเปนตองลดความไดเปรียบนั้นดวยการจํากัดการเคลื่อนที่หรือการเขาถึงเสบียงของพวกเขา ดวยหนวยคอมมานโดขนาดเล็ก เราสามารถแทรกซึมผานแนวขาศึกและกอวินาศกรรมโครงสรางพื้นฐานของพวกเขา ณ จุดสําคัญได"
 SWE_hedgehog_defense: "การปองกันแบบเมน"
 SWE_hedgehog_defense_desc: "เราสามารถเพิ่มประสิทธิภาพของการปองกันเชิงลึกไดโดยใชยุทธวิธี 'เมน' ซึ่งประกอบดวยกลุมทหารขนาดเล็กในที่มั่นที่ปองกันไดดีซึ่งศัตรูอาจผานเลยไป อยางไรก็ตาม การปดลอมกลุมเหลานี้จะบั่นทอนแรงสงของศัตรู และทําใหพวกเขาเปราะบางตอการตีโต"
 SWE_a_plea_of_desperation: "คําวิงวอนแหงความสิ้นหวัง"
 SWE_a_plea_of_desperation_desc: "เมื่อถูกลอมรอบหลายดานดวยศัตรูที่ปรารถนาจะเห็นอธิปไตยของเราดับสูญ เราแทบไมมีทางเลือกนอกจากยื่นมือไปหาพันธมิตรที่เปนไปได หากเราจะรอดพนการโจมตีอันหนักหนวงที่กําลังจะมาถึง"
 SWE_rapid_response_force: "กองกําลังตอบโตเร็ว"
 SWE_rapid_response_force_desc: "ดวยการคงกองกําลังตอบโตเร็วของยานเกราะที่สามารถเคลื่อนยายไปตามแนวหนาไดอยางรวดเร็วเมื่อจําเปน เราจะไดประโยชนจากรถถังโดยไมตองดูแลรถถังจํานวนมหาศาล"
 SWE_hemvarnet: "เฮมแวรเน็ต (กองรักษาดินแดน)"
 SWE_hemvarnet_tt: "สามารถจัดตั้งหนวยกองรักษาดินแดนที่จะเรียกใชเปนหนวยฉุกเฉินไดในยามสงคราม"
 SWE_hemvarnet_desc: "มีอาสาสมัครที่เต็มใจนับพันคนซึ่งสามารถติดอาวุธดวยยุทโธปกรณทางทหารรุนเกาเพื่อปกปองจุดยุทธศาสตรในทองถิ่นของตน เรื่องนี้จะชวยไดมากในการปองกันไมใหกองทัพตองกระจายกําลังจนเกินตัวในการพยายามปกปองทั้งประเทศพรอมกัน "
 SWE_lottakaren: "ลอตตาโกเรน"
 SWE_lottakaren_desc: "สตรีแหง [SWE.GetName] พรอมปกปองประเทศไมแพบุรุษ ดวยการสนับสนุนงบประมาณแกองคกรที่รับสมัครและฝกสตรีสําหรับงานนอกแนวหนา เราจะเสริมกําลังกองทัพและเพิ่มขีดความสามารถในการปองกันได"
 SWE_rapid_mobilization: "ระดมพลอยางรวดเร็ว"
 SWE_rapid_mobilization_desc: "ทั้งประเทศกําลังกลั้นหายใจดวยความหวาดกลัวการรุกราน จากเหตุการณที่เกิดขึ้นในตางแดนเมื่อไมนานนี้ จะลังเลอีกไมไดแลว เราตองระดมกองทัพอยางเต็มที่เพื่อปกปองอธิปไตยของเรา"
 SWE_rapid_mobilization_tt: "สามารถเพิ่มกฎหมายการเกณฑทหารไดถึงระดับ §Yเกณฑตามความจําเปน§! แมจะเปนประชาธิปไตย"
 SWE_secret_mobilization: "ระดมพลอยางลับ ๆ"
 SWE_secret_mobilization_desc: "หากเราระดมกําลังเร็วเกินไป อาจทําใหศัตรูไหวตัวและจุดชนวนการรุกรานที่เราพยายามปองกันเสียเอง ดังนั้นเราตองดําเนินการอยางระมัดระวังเพื่อไมใหเกิดความสงสัย"
 SWE_tank_development: "พัฒนารถถัง"
 SWE_tank_development_desc: "แมเราจะไมอาจสงยานเกราะออกรบไดในปริมาณมหาศาลเหมือนชาติอื่น แตเราสามารถออกแบบและผลิตไดอยางมีประสิทธิภาพกวา"
 SWE_per_albin_line: "แนว [SWE.GetLeader]"
 SWE_per_albin_line_tt: "เพิ่มปอมปราการในพื้นที่ปองกันสําคัญรอบมัลเมอและชองแคบ ลึกเขาไปในแผนดินตามจุดคอขวดรอบทะเลสาบเวเนิรนและเวทเทิรน รวมถึงที่ก็อตลันดและสตอกโฮลม"
 SWE_per_albin_line_desc: "ชายฝงของ [SWE.GetName] กวางใหญและแทบไมมีการปองกัน เพื่อปองกันไมใหศัตรูยกกําลังรุกรานขึ้นฝงของเรา เราตองสรางแนวที่มั่นเสริมปอมตลอดชายฝงที่สามารถตีศัตรูใหถอยกลับลงทะเลบอลติก"
 SWE_swedish_shooting_movement: "ขบวนการยิงปนสวีเดน"
 SWE_swedish_shooting_movement_desc: "เปนเวลาเกือบศตวรรษที่ขบวนการยิงปน[SWE.GetAdjective]ไดจัดสนามยิงปนและการแขงขันเพื่อเพิ่มความชํานาญในการยิงปนของพลเรือน รวมถึงความมุงมั่นที่จะสูหากจําเปน ดวยสถานการณอันปนปวนที่เราเผชิญอยูในวันนี้ บางทีเราควรลงทุนในองคกรนี้"
 SWE_swedish_shooting_movement_tt: "กําลังพล: §G+400§! ตอทุกระดับของเฮมแวรเน็ต\n§Y+100§! หนวยของ $SWE_infantry_equipment_0$ จะถูกเพิ่มเขาคลังแหงชาติตอทุกระดับของเฮมแวรเน็ต\nเพิ่มประสบการณเริ่มตนของกองพลเฮมแวรนที่สงออกประจําการเปน §Y30%§! จาก §Y10%§!\nเพิ่มสัดสวนยุทโธปกรณเริ่มตนของกองพลเฮมแวรนที่สงออกประจําการเปน §Y90%§! จาก §Y60%§!\nเพิ่มสัดสวนกําลังพลเริ่มตนของกองพลเฮมแวรนที่สงออกประจําการเปน §Y90%§! จาก §Y70%§!"
 SWE_mobilization_of_society: "การระดมสังคม"
 SWE_mobilization_of_society_desc: "ทุกคนตั้งแตคนงานโรงงานไปจนถึงรัฐมนตรีตองพรอมเสียสละเพื่อการปองกันประเทศ ไมวาจะหมายถึงการจัดสรรทรัพยากรใหมใหการผลิตเพื่อสงคราม หรือการจับอาวุธขึ้นสู เราจะทําทุกอยางเพื่อให [SWE.GetName] อยูรอด"
 SWE_end_the_fubkrieg: "ยุทธวิธีสมัยใหม สงครามสมัยใหม"
 SWE_end_the_fubkrieg_desc: "สงครามเปลี่ยนแปลงไปอยางรวดเร็วในชวงไมกี่ปที่ผานมา และเราไมอาจปลอยใหความพยายามทั้งหมดสูญเปลาเพราะกองทัพเตรียมพรอมสําหรับความขัดแยงของวันวาน การทําใหมั่นใจวากองทัพใชยุทธวิธีที่ทันสมัยที่สุดจะเปนหัวใจสําคัญในการปกปองประเทศ"
 SWE_let_fly_all_guns: "ยิงพรอมกันทุกกระบอก"
 SWE_let_fly_all_guns_desc: "แมเราจะไมมีอุตสาหกรรมมหาศาลเหมือนชาติอื่น แตเรามีผูผลิตอาวุธที่เชี่ยวชาญที่สุดบางรายของโลก ดวยการลงทุนเพิ่มเติม เราจะใชความสามารถของพวกเขาไดอยางเต็มที่ เพื่อใหกองกําลังของเราไดเปรียบทางเทคโนโลยีในสนามรบ"
 SWE_operation_save_denmark: "ปฏิบัติการ: กอบกูเดนมารก"
 SWE_operation_save_denmark_desc: "เราอาจมีความขัดแยงกับ [DEN.GetName] มาหลายศตวรรษ แตวันนี้เรายืนหยัดเคียงขางประชาชนของเธอ และพรอมจะปลดปลอยพวกเขาจากทรราช"
 SWE_operation_save_norway: "ปฏิบัติการ: กอบกูนอรเวย"
 SWE_operation_save_norway_desc: "[NOR.GetName] และ [SWE.GetName] มีประวัติศาสตรที่เกี่ยวพันกันมาหลายศตวรรษ การเห็นประชาชนของเธอติดอยูใตรองเทาบูตของมหาอํานาจตางชาติเปนสิ่งที่ยอมรับไมได และเราตองวางแผนปลดปลอยพวกเขาเมื่อโอกาสมาถึง "
 SWE_nordic_liberation_movement: "ขบวนการปลดปลอยนอรดิก"
 SWE_nordic_liberation_movement_desc: "ยังไมเสร็จ (TODO)"
 SWE_central_nordic_army_command: "กองบัญชาการกองทัพบกนอรดิกรวมศูนย"
 SWE_central_nordic_army_command_desc: "ดวยการรวมศูนยกองทัพของสมาชิกสภาปองกันนอรดิก เราจะใชกําลังของเราไดอยางมีประสิทธิภาพยิ่งขึ้นในฐานะหนวยที่เปนเอกภาพ"
 SWE_central_nordic_army_command_tt: "\nโอนกองทัพและนายพลของ §Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศให [SWE.GetName]\n§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ ยกเวน §Y[SWE.GetName]§! ไดรับ:"
 SWE_central_nordic_army_command_tt_2: "พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก:\n -พวกเขามี §Yความเห็นตอเราในระดับสูง§!\n -เรามี §Yกองทัพ§! ที่แข็งแกรงกวาพวกเขา\n -เรามี §Yรูปแบบการปกครอง§! เดียวกับพวกเขา\n -เรา §Yรับประกันเอกราช§! ใหพวกเขา"
 SWE_decentralized_nordic_army_command: "กองบัญชาการกองทัพบกนอรดิกแบบกระจายอํานาจ"
 SWE_decentralized_nordic_army_command_desc: "การรวมศูนยกองบัญชาการกองทัพของสภาปองกันนอรดิกจะกอใหเกิดผลประโยชนทับซอนแกนายทหารผูบังคับบัญชามากเกินไป หลักประกันเดียวสําหรับความมั่นคงแหงชาติของรัฐสมาชิกแตละรัฐคือการคงอํานาจควบคุมกองกําลังของตนเอง"
 SWE_decentralized_nordic_army_command_tt: "\n§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศไดรับ: §Yการเกณฑทหารอยางกวางขวาง§!\n§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศไดรับ:"
 SWE_decentralized_nordic_army_command_tt_2: "§Yสมาชิกสภาปองกันนอรดิก§! ทุกประเทศ: "
 SWE_neither_death_nor_dishonor: "ไมตายก็ไมยอมเสื่อมเกียรติ"
 SWE_neither_death_nor_dishonor_tt: "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+4%§! \n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+4%§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+4%§! ตอประเทศนอรดิกแตละประเทศที่อยูในฝายเดียวกับ §Y[SWE.GetName]§! หรือตอ §Y$autonomy_aat_defense_council_member$§! แตละประเทศ"
 SWE_neither_death_nor_dishonor_desc: "ชาตินอรดิกกําลังยืนอยูบนปากเหว หมาปาเยอรมันกําลังหอนอยูทางตะวันตก สวนทางตะวันออก พวกบอลเชวิคก็รอจังหวะ พรอมจะแทงกริชสีแดงลึกเขาสูใจกลางแผนดินของเรา ปากกาของเราตองกลายเปนดาบ ไหวพริบของเราตองกลายเปนเกราะ \nเราจะไมเลือกระหวางความชั่วรายสองทาง จะไมมีทั้งความตายและความอัปยศ"
 SWE_prevent_a_red_dictatorship: "ปองกันเผด็จการแดง"
 SWE_prevent_a_red_dictatorship_desc: "พรรคสังคมประชาธิปไตยไมตางอะไรกับมาโทรจันของพวกคอมมิวนิสต หากเราจะปองกันไมใหสวีเดนตกอยูในเขตอิทธิพลของโซเวียต เราตองทําใหมั่นใจวาผูมีสิทธิเลือกตั้งจะมอบอํานาจควบคุมรัฐสภาริกสดักใหแกพรรคชาตินิยม ดวยวิธีการใดก็ตามที่จําเปน "
 SWE_defense_in_depth: "การปองกันเชิงลึก"
 SWE_defense_in_depth_desc: "ไมมีกองกําลังศัตรูใดที่มีแรงสงไมสิ้นสุด สวนใหญเพราะขอจํากัดของเสนทางเสบียง และขีดจํากัดทางรางกายและจิตใจของทหาร ดังนั้น รูปแบบการปองกันที่แข็งแกรงกวาจึงไมไดอยูที่แนวหนาแข็งทื่อที่พังทลายเมื่อถูกเจาะ แตอยูที่แนวปองกันหลายชั้นที่คอย ๆ ริบแรงสงของศัตรูไป"
 SWE_beneath_sticks_and_stones: "ใตกิ่งไมและกอนหิน"
 SWE_beneath_sticks_and_stones_desc: "เครื่องบินขาศึกจะสูญเสียประสิทธิภาพไปมากหากมองไมเห็นเปาหมายในสนามรบ ดวยการฝกกองกําลังของเราใหใชเทคนิคการพรางตัว เราจะริบความไดเปรียบสําคัญนี้ไปจากศัตรู"
 SWE_norma_projektilfabrik: "นอรมาโปรเยกทิลฟาบริก"
 SWE_norma_projektilfabrik_desc: "นอรมาโปรเยกทิลฟาบริกผลิตกระสุนใน [SWE.GetName] และ [NOR.GetName] มาตั้งแตศตวรรษที่แลว การขยายขีดความสามารถการผลิตของพวกเขาจะชวยไดมากในการรักษาการสงกระสุนใหกองทัพของเราอยางสมํ่าเสมอ "
 SWE_norma_projektilfabrik_tt: "เพิ่ม §Yโรงงานทหาร§! อีก §G1§! แหง หากสําเร็จในขณะที่ §Y[NOR.GetNameDef]§!:\nอยูในภาวะสงครามกับประเทศมหาอํานาจ\nมีความคืบหนาการยอมจํานนมากกวา 0%\n§Y[SWE.GetNameDef]§!: ไมไดอยูในภาวะสงครามกับ §Yนอรเวย§!"
 SWE_government_weapons_contract: "สัญญาจัดซื้ออาวุธของรัฐบาล"
 SWE_allow_landsverk_to_operate: "ปลอยใหลันดสแวรกดําเนินการอยางอิสระ"
 SWE_allow_landsverk_to_operate_tt: "§Rการทําสงครามกับ [GER.GetNameDef] จะทําใหคนงาน[GER.GetAdjective]ที่ลันดสแวรกสามารถสรางความเสียหายชั่วคราวแกโรงงานลันดสแวรกทั้ง 2 แหงในสวีเดนได§!"
 SWE_government_weapons_contract_desc: "มีบริษัทมากมายทั่ว [SWE.GetName] ที่เชี่ยวชาญในการสรางอาวุธ หากเราจะเตรียมพรอมสําหรับสงครามเบ็ดเสร็จ เราตองกระตุนการขยายตัวของบริษัทเหลานี้ผานสัญญาจัดซื้อยุทโธปกรณทางทหาร"
 SWE_bofors_fly_swatter: "ไมตีแมลงวันโบฟอรส"
 SWE_bofors_fly_swatter_desc: "โบฟอรสมีศักยภาพที่จะสรางมาตรฐานใหมใหเทคโนโลยีตอตานอากาศยาน เราควรมอบทรัพยากรใหพวกเขาทําเชนนั้น และทําใหมั่นใจวาทองฟาสวีเดนจะปลอดจากเครื่องบินขาศึก"
 SWE_husqvarna_vapenfabrik: "โรงงานอาวุธฮุสควารนา"
 SWE_husqvarna_vapenfabrik_desc: "ฮุสควารนามีประวัติยาวนานในการผลิตอาวุธเล็กใหกองทัพ[SWE.GetAdjective] ถึงเวลาที่เราจะขยายฐานอุตสาหกรรมของพวกเขา และใชความเชี่ยวชาญนั้นปรับปรุงกองทัพใหทันสมัย"
 SWE_work_projects_for_the_unemployed: "โครงการจางงานผูวางงาน"
 SWE_work_projects_for_the_unemployed_desc: "คนที่ทํางานไดแตหางานทําไมไดคือแรงผลักดันเบื้องหลังลัทธิสุดโตง หากเราจะปองกันไมใหประชาชนหันมาตอตานรัฐบาล เราตองสรางโครงการจางงานใหแกผูวางงาน "
 SWE_bofors_anti_tank_gun: "ปนตอสูรถถังโบฟอรส"
 SWE_bofors_anti_tank_gun_tt: "เปดใช §Hปนตอสูรถถังโบฟอรส§!\nการโจมตีเปาแข็งของตอสูรถถังสนับสนุน: §G+10%§!\nการเจาะเกราะของตอสูรถถังสนับสนุน: §G+10%§!\nการโจมตีเปาแข็งของตอสูรถถัง: §G+10%§!\nการเจาะเกราะของตอสูรถถัง: §G+10%§!\nการโจมตีเปาแข็งของตอสูรถถังยานยนต: §G+10%§!\nการเจาะเกราะของตอสูรถถังยานยนต: §G+10%§!\nการโจมตีเปาแข็งของรถถังพิฆาตเบา: §G+10%§!\nการเจาะเกราะของรถถังพิฆาตเบา: §G+10%§!\nการโจมตีเปาแข็งของรถถังพิฆาตกลาง: §G+10%§!\nการเจาะเกราะของรถถังพิฆาตกลาง: §G+10%§!\nการโจมตีเปาแข็งของรถถังพิฆาตหนัก: §G+10%§!\nการเจาะเกราะของรถถังพิฆาตหนัก: §G+10%§!\nการโจมตีเปาแข็งของรถถังพิฆาตหนักพิเศษ: §G+10%§!\nการเจาะเกราะของรถถังพิฆาตหนักพิเศษ: §G+10%§!\nการโจมตีเปาแข็งของรถถังพิฆาตสมัยใหม: §G+10%§!\nการเจาะเกราะของรถถังพิฆาตสมัยใหม: §G+10%§!"
 SWE_bofors_anti_tank_gun_desc: "ความเชี่ยวชาญดานการสรางอาวุธของโบฟอรสไดพิสูจนแลววาขาดไมได ดวยการลงทุนเพียงเล็กนอย พวกเขาจะสรางปนตอสูรถถังรุนใหมที่รับมือกับยานเกราะที่หุมเกราะหนาที่สุดซึ่งศัตรูอาจสงมาโจมตีเราได"
 SWE_landverk_l_62: "Landsverk L-62"
 SWE_landverk_l_62_desc: "ดวยการตอยอดความสําเร็จของการออกแบบรถถังของลันดสแวรกและปนตอสูอากาศยานของโบฟอรส เราสามารถสรางแพลตฟอรมตอสูอากาศยานเคลื่อนที่ระดับโลกที่ตามทันแมการดําเนินกลยุทธที่รวดเร็วที่สุด"
 SWE_form_saab: "กอตั้ง SAAB"
 SWE_form_saab_desc: "มีผูผลิตอากาศยานจํานวนหนึ่งใน [SWE.GetName] ที่แขงขันกันชิงสัญญาอันมีกําไรงามจากรัฐบาล ดวยการควบรวมพวกเขาเขาดวยกัน เราจะใชความเชี่ยวชาญรวมของทุกบริษัทไดอยางคุมคา"
 SWE_domestic_designs: "การออกแบบอากาศยานภายในประเทศ"
 SWE_domestic_designs_desc: "เมื่อการกอตั้ง SAAB เสร็จสมบูรณ เราควรใชความเชี่ยวชาญดานการออกแบบและวิศวกรรมของพวกเขาสรางอากาศยานที่ตรงตามความตองการเฉพาะของกองทัพอากาศ[SWE.GetAdjective]"
 SWE_foreign_designs: "ศึกษาแบบอากาศยานตางชาติ"
 SWE_foreign_designs_desc: "เราไมควรเสียเวลาประดิษฐสิ่งที่ชาติอื่นมีอยูแลวขึ้นมาใหม ความเชี่ยวชาญของ SAAB จะใชไดดีกวาในการดัดแปลงและผลิตแบบที่ไดรับสิทธิบัตรจากตางประเทศ"
 SWE_foreign_designs_tt: "ไดรับโบนัสการวิจัย §G35%§! §Y1x§! สําหรับ §Yอากาศยาน§! ตอประเทศมหาอํานาจแตละประเทศที่มีอุดมการณตรงกับเราและไมไดทําสงครามกับเรา"
 SWE_formation_flying: "การบินเปนรูปขบวน"
 SWE_formation_flying_desc: "การรักษาการปองกันภัยทางอากาศที่แข็งแกรงตองอาศัยกลุมเครื่องบินขับไลที่จัดระเบียบดีและสามารถตอบสนองตอภัยคุกคามไดอยางรวดเร็ว"
 SWE_marauder_bombers: "เครื่องบินทิ้งระเบิดจูโจม"
 SWE_marauder_bombers_desc: "ประสบการณในชวงหลังแสดงใหเห็นวาความสามารถในการทําลายเปาหมายภาคพื้นดินจากทางอากาศมักเปนปจจัยชี้ขาดในการรบ และอาจพิสูจนไดวาเปนหนทางยุติสงครามไดโดยสิ้นเชิง"
 SWE_airforce_modernization: "ปรับปรุงกองทัพอากาศใหทันสมัย"
 SWE_airforce_modernization_desc: "การทําใหกองทัพอากาศมียุทโธปกรณทันสมัยที่สุดยอมไรความหมายหากพวกเขาไมสามารถใชงานไดอยางเต็มที่ เราควรทําใหมั่นใจวาประสบการณลาสุดของนักบินจะถูกนํามาบรรจุไวในหลักนิยมทางอากาศของเรา"
 SWE_the_barrel: "เดอะบารเรล"
 SWE_the_barrel_desc: "ความขัดแยงในชวงหลังไดเรงพัฒนาการทางเทคโนโลยีดานการบิน เราจึงตองกาวใหทันศัตรูที่อาจเกิดขึ้น และพัฒนาอากาศยานไอพนของเราเองเพื่อปกปองนานฟา"
 SWE_rockets: "ราเก็ทดริฟท (ระบบจรวด)"
 SWE_rockets_desc: "แมอากาศยานไอพนจะนาประทับใจ แตเทคโนโลยีจรวดทําใหเราสรางอาวุธแบบใชครั้งเดียวที่มีความเร็วและพิสัยไกลกวามาก โดยไมตองเสียคาใชจายสูงในการฝกนักบิน"
 SWE_radiojanst: "ราดิโอแชนสต"
 SWE_radiojanst_desc: "ราดิโอแชนสตไดรับความนิยมจากประชาชน ดวยการกระจายเสียงงานวัฒนธรรมและขาวสารเปนประจําทุกวัน การขยายสถานีจะชวยเพิ่มประเภทรายการที่ผลิต พรอมกับทําใหประชาชนไดรับขาวสารอยางดี"
 SWE_urbanization: "การขยายตัวของเมือง"
 SWE_urbanization_tt: "ปลดล็อกการตัดสินใจที่ใช §Yอํานาจทางการเมือง§! เพื่อรับ §Yโรงงานพลเรือน§! และ §Yอูตอเรือ§!"
 SWE_urbanization_desc: "การทําใหเปนอุตสาหกรรมและการขยายตัวของเมืองยอมควบคูกันไป เมื่อหางานในเมืองไดมากขึ้น ผูคนจากชนบทก็ยายเขาเมืองมากขึ้น หากเราจะไมใหเมืองกลายเปนสลัมแออัด เราตองลงทุนในโครงสรางพื้นฐานและเตรียมรับการเติบโตของประชากรที่จะตามมา"
 SWE_hygenic_housing: "ที่อยูอาศัยถูกสุขลักษณะ"
 SWE_hygenic_housing_tt: "§Yนโยบายที่อยูอาศัยถูกสุขลักษณะจะเริ่มแผขยายออกจากเซอเดอรมันลันดตามเวลาที่ผานไป โดยจะมีรัฐดินแดนหลักใหมหนึ่งรัฐไดรับตัวปรับคาทุกสองเดือน§!"
 SWE_hygenic_housing_desc: "ยังมีผูคนอีกมากที่อาศัยอยูในสลัมแออัดซึ่งไมเหมาะกับการอยูอาศัยของมนุษย เราตองลางกระดานเริ่มใหม และทําใหมั่นใจวาทุกคนจะเขาถึงที่อยูอาศัยที่ถูกสุขลักษณะและใชงานไดจริง"
 SWE_vasa_ii: "[SWE_vasa_ii_loc]"
 SWE_vasa_ii_desc: "ถึงเวลาที่เราจะสรางผูสืบทอดของเรือวาซาในตํานาน หวังวาคราวนี้มันจะมีโอกาสพิสูจนตัวเองในการรบ"
 SWE_vasa_ii_communist: "พายุสีแดง"
 SWE_vasa_ii_default: "วาซา II"
 SWE_coastal_support: "การสนับสนุนชายฝง"
 SWE_coastal_support_desc: "กองทัพเรือของเราควรไดรับการฝกการใชปนเรืออยางทั่วถึง เพื่อสนับสนุนการยกพลขึ้นบกบนชายฝงของชาติศัตรู"
 SWE_all_cards_on_deck: "ทุมหมดหนาตัก"
 SWE_all_cards_on_deck_desc: "การปะทะยืดเยื้อกลางทะเลแทบไมเปลี่ยนแปลงทิศทางของสงคราม เมื่อกองทัพเรือของเราออกเดินทาง ก็จะมีเปาหมายเพื่อบดขยี้ศัตรูในการโจมตีครั้งเดียวอยางเด็ดขาด"
 SWE_decisive_battle_tactics: "ยุทธวิธีการรบชี้ขาด"
 SWE_seize_landsverk: "ยึดลันดสแวรก"
 SWE_kp_bill: "KP Bil ยานเกราะลําเลียงพล"
 SWE_kp_bill_desc: "พัฒนาการลาสุดในสนามรบแสดงใหเห็นถึงความจําเปนในการเคลื่อนยายกําลังพลไปยังจุดที่ตองการไดอยางรวดเร็ว จนถึงตอนนี้เราใชรถบรรทุกพลเรือนดัดแปลงทําหนาที่นี้ แตยานลําเลียงหุมเกราะที่สรางขึ้นโดยเฉพาะจะมีประสิทธิภาพในการรบมากกวามาก"
 SWE_lynx_winter_armored_cars: "รถหุมเกราะลิงซ"
 SWE_lynx_winter_armored_cars_desc: "หากสงครามมาถึง [SWE.GetName] ความคลองตัวจะเปนหัวใจของการปองกันของเรา การพัฒนารถหุมเกราะทันสมัยที่สรางขึ้นโดยเฉพาะจะมอบเครื่องมือสําคัญแกทหารของเราสําหรับการลาดตระเวนและโจมตีเปาออนในสนามรบ"
