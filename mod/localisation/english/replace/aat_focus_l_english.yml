 SWE_standardize_equipment: "มาตรฐานยุทโธปกรณ"
 SWE_standardize_equipment_desc: "กองทัพของเราใชอาวุธเล็กหลากหลายชนิดมานานเกินไป บางชนิดเกาแกตั้งแตศตวรรษที่แลว ทําใหการสงกระสุนใหทหารยากลําบากอยางยิ่งและเสี่ยงตอการถูกขัดขวาง เราตองแกไขดวยการทําใหอาวุธและกระสุนเปนมาตรฐานเดียวกัน"
 SWE_standardize_equipment_trigger_tt: "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y13000§!"
 SWE_individual_liberty_and_prosperity_for_all: "ลดความยากจน"
 SWE_individual_liberty_and_prosperity_for_all_desc: "เปนที่ชัดเจนวาเราตองทํามากกวานี้เพื่อยกระดับผูคนใหพนจากความยากจน อยางไรก็ตาม เราตองรักษาสมดุลระหวางการชวยเหลือกับความจําเปนในการคงไวซึ่งการปองกันประเทศที่ใชการได"
 SWE_defense_above_all: "การปองกันเหนือสิ่งอื่นใด"
 SWE_defense_above_all_desc: "เราตองยอมรับความจริงวาโลกเดินตามตารางเวลาที่ตางจากเรา และเราไมอาจเสี่ยงกับอนาคตของรัฐโดยไรขีดความสามารถในการปองกันใด ๆ อีกตอไป"
 SWE_volvo: "วอลโว"
 SWE_volvo_desc: "วอลโวสรางชื่อเสียงในการผลิตชิ้นสวนและยานพาหนะที่ทนทานและเชื่อถือได เราควรตอยอดความสําเร็จของพวกเขาดวยการดัดแปลงแบบรถบรรทุกและเครื่องยนตพลเรือนไปใชทางทหาร"
 SWE_allow_landsverk_to_operate_desc: "ลันดสแวรกเปนชองโหวใหกองทัพ[GER.GetAdjective]ใชหลบเลี่ยงขอจํากัดของสนธิสัญญาแวรซายเรื่องการพัฒนายานเกราะมานานแลว เราควรปลอยใหพวกเขาดําเนินการตอไป เพื่อรักษาความสัมพันธใกลชิดกับ [GER.GetName] และใชประโยชนจากพัฒนาการทางเทคโนโลยีของพวกเขา"
 SWE_sieze_landsverk: "ยึดลันดสแวรก"
 SWE_sieze_landsverk_desc: "ลันดสแวรกเปนชองโหวใหกองทัพ[GER.GetAdjective]ใชหลบเลี่ยงขอจํากัดของสนธิสัญญาแวรซายเรื่องการพัฒนายานเกราะมานานแลว บางคนในรัฐบาลโตแยงวาเราตองยึดบริษัทนี้ เพื่อตีตัวออกหางจากเครื่องจักรสงคราม[GER.GetAdjective]"
 SWE_saltsjobaden_agreement: "ยอมรับขอตกลงซอลตเชอบาเดน"
 SWE_saltsjobaden_agreement_desc: "ความขัดแยงระหวางแรงงานและนายจางกําลังลุกลามจนควบคุมไมได และเสี่ยงจะทําใหประเทศลมสลาย เราตองสามัคคีกันหากจะเอาชนะภัยคุกคามที่ชายแดน ดังนั้นเราตองจัดทําขอตกลงเพื่อลดความปนปวนจากขอพิพาทแรงงาน"
 SWE_reject_saltsjobaden: "ปฏิเสธขอตกลงซอลตเชอบาเดน"
 SWE_reject_saltsjobaden_desc: "ขอตกลงนี้ตองถูกปฏิเสธ เพราะจะริบสิทธิของนายจางในการบริหารธุรกิจตามที่เห็นสมควร และจะจํากัดอํานาจของแรงงานในการนัดหยุดงานเมื่อรูสึกวาถูกเอาเปรียบ ไมมีใครไดประโยชนจากขอตกลงนี้"
 SWE_ring_a_ding_ding: "มิลิแทรซีเกล (จักรยานทหาร)"
 SWE_ring_a_ding_ding_desc: "จักรยานอาจดูไมนาเกรงขามเทารถหุมเกราะหรือรถถัง แตใหความคลองตัวที่เพิ่มขึ้นดวยตนทุนเพียงเศษเสี้ยว"
 SWE_aquire_modern_panzers: "จัดหารถถังสมัยใหม"
 SWE_aquire_modern_panzers_desc: "ความชะงักงันทางเทคโนโลยีไดพิสูจนแลววาทําใหชาติที่ดูทรงพลังที่สุดลมสลายในยามสงคราม การจัดหายานเกราะสมัยใหมใหกองทัพจึงเปนเรื่องเรงดวน หากเราจะหลีกเลี่ยงชะตากรรมเชนนั้น"
 SWE_military_academy: "โรงเรียนนายรอย"
 SWE_military_academy_desc: "ทุกเหลาทัพไดสั่งสมประสบการณมากมายในชวงไมกี่ปที่ผานมา ดวยการจัดตั้งระบบโรงเรียนทหาร เราจะมั่นใจไดวาความรูของพวกเขาจะถูกสงตอไปยังคนรุนหลัง"
 SWE_surface_raiders: "เรือจูโจมผิวนํ้า"
 SWE_surface_raiders_desc: "ดวยเรือขนาดเล็กจํานวนหนึ่งที่สรางไดอยางรวดเร็ว เราสามารถสรางความเสียหายรายแรงตอความพยายามทําสงครามของศัตรู ดวยการขัดขวางการเดินเรือและการเคลื่อนยายกําลังพลของพวกเขา "
 SWE_rationing: "การปนสวน"
 SWE_rationing_desc: "เรายังจําไดดีถึงความยากลําบากทางเศรษฐกิจที่มหาสงครามไดกอแกประชาชนผูบริสุทธิ์แหง [SWE.GetName] เราตองหลีกเลี่ยงหายนะเชนนั้นอีกดวยการจัดตั้งระบบปนสวนอาหาร เชื้อเพลิง และสิ่งจําเปนอื่น ๆ"
 SWE_rationing_tt: "ปลดล็อกการตัดสินใจเพื่อบังคับใชนโยบายปนสวน โดยแลกกับ §Yการสนับสนุนสงคราม§!, §Yเสถียรภาพ§! หรือ §Yสินคาอุปโภคบริโภค§! เล็กนอย นโยบายที่สามารถบังคับใชไดแก:\n"
 SWE_folkhemmet_modification_tt: "ปรับ §Yโฟลคเฮมเม็ต§! ดังนี้:"
 SWE_education_reform: "สตัดสบารน"
 SWE_research_slot_2: "ขยายมหาวิทยาลัยอุปซอลา"
 SWE_research_slot_2_desc: "มหาวิทยาลัยอุปซอลาเปนมหาวิทยาลัยที่เกาแกที่สุดในภูมิภาคนอรดิก เคยเปนที่พํานักของบุคคลสําคัญอยางอันเดอรส เซลเซียส คารล ลินเนียส และยาคอบ แบรเซลิอุส ขณะที่โลกหมุนวนและปนปวน เปนที่ชัดเจนวาวิทยาศาสตรคืออาวุธที่ยิ่งใหญที่สุดในโลกที่ไมแนนอน และการลงทุนในมหาวิทยาลัยอันทรงเกียรติเชนนี้ยอมประสบความสําเร็จแนนอน"
 SWE_education_reform_desc: "หนังสือ 'สตัดสบารน' ของอัลวา เมอรดาลกําลังสรางกระแสในหมูนักการศึกษาเกี่ยวกับบทบาทของรัฐในพัฒนาการวัยเด็ก อัลวาและกุนนารผูเปนสามียังจุดประเด็นถกเถียงเรื่องนโยบายสังคมในหนังสือเลมลาสุด 'วิกฤตประชากร' บางทีเราควรดึงคูสามีภรรยาผูมีผลงานมากมายนี้เขาสูคณะรัฐมนตรี เพื่อใหพวกเขาเปลี่ยนทฤษฎีเปนการปฏิบัติ"
 SWE_economic_deregulation: "ผอนคลายกฎระเบียบทางเศรษฐกิจ"
 SWE_economic_deregulation_desc: "เราไมอาจแบกรับการใชจายดานสวัสดิการอันฟุมเฟอยนี้ได ในขณะที่ชาติกําลังเผชิญภัยคุกคามตอการดํารงอยู เราจึงตองตัดสินใจดานงบประมาณอยางเด็ดขาด และยกเลิกกฎระเบียบที่เปนภาระ เพื่อใหภาคเอกชนเขามาเติมชองวางที่รัฐทิ้งไว"
 SWE_economic_deregulation_tt: "ลบ §Yโฟลคเฮมเม็ต§!"
 SWE_approach_the_allies: "เขาหาฝายสัมพันธมิตร"
 SWE_approach_the_allies_desc: "[ENG.GetNameDefCap] และพันธมิตรจะเปนผูชนะในทายที่สุดของความขัดแยงใด ๆ ในยุโรป จึงเปนการรอบคอบที่เราจะแสดงใหชัดเจนวาเราไมมีเจตนาจะเปนศัตรูของพวกเขา"
 SWE_join_allies_for_colonies: "แลกเปลี่ยนดินแดน"
 SWE_join_allies_for_colonies_desc: "เมื่อความสัมพันธระหวางเรากับฝายสัมพันธมิตรแนนแฟนขึ้น เรามีโอกาสไดดินแดนอาณานิคมเดิมทั่วโลกคืนมา เพื่อแลกกับการเขารวมแนวรวมทางทหารของพวกเขา"
 SWE_universal_basic_income: "รายไดพื้นฐานถวนหนา"
 SWE_universal_basic_income_desc: "ชายหญิงทุกคนควรไดรับหลักประกันวาจะดํารงชีพไดอยางนอยในระดับขั้นตํ่าที่สุด และเปนหนาที่ของรัฐที่จะดูแลพลเมือง รายไดพื้นฐานถวนหนาแกปญหาทั้งสองได"
 SWE_universal_basic_income_tt: "รัฐที่เพิ่งพิชิตไดจะเริ่มตนดวยการยอมรับปกครอง §G+25%§! และการตอตาน §Y0%§!"

