#Communist Path
 NOR_a_resurgent_labor_movement: "การฟนคืนของขบวนการแรงงาน"
 NOR_a_resurgent_labor_movement_desc: "ประชาชนแหง [NOR.GetName] ไมยอมรับผาปดตาของทุนนิยมอีกตอไป ในที่สุดพวกเขาก็เห็นความจริงวาพวกเขาคอย ๆ จมลงในความยากจนที่นายเหนือหัวสรางขึ้น บัดนี้พวกเขากําลังชูศีรษะขึ้นเหนือนํ้า และมองเห็นการปฏิวัติอยูที่ขอบฟา!"
 NOR_compromise_with_the_nkp: "ประนีประนอมกับ NKP"
 NOR_compromise_with_the_nkp_desc: "ในเมื่อความปลอดภัยของชาติดูจะแขวนอยูบนปากเหว บางทีการประนีประนอมกับพรรคคอมมิวนิสตนอรเวย (Norges Kommunistiske Parti) ซึ่งมีความผูกพันอยางลึกซึ้งกับลัทธิสตาลิน อาจชวยใหเราไดรับความชวยเหลือจาก [SOU.GetNameDef] ซึ่งยอมดีกวาอนาคตที่ตองตกเปนขาของพวกฟาสซิสตหรือนายทุน"
 NOR_prosecute_the_nkp: "ดําเนินคดี NKP"
 NOR_prosecute_the_nkp_desc: "พรรคแรงงานแยกตัวจาก NKP เมื่อเห็นชัดวาพวกเขาภักดีตอสตาลินมากกวาตอแรงงานแหง [NOR.GetName] เราปลอยใหซากศพเนาเฟะนี้เนาเปอยมานานเกินไปแลว เราตองบดขยี้คนทรยศเหลานี้อยางเต็มกําลังกอนที่พวกเขาจะขายเราให [SOU.GetName]" 
 NOR_the_seeds_of_the_revolution: "เมล็ดพันธุแหงการปฏิวัติ"
 NOR_the_seeds_of_the_revolution_desc: "ทุนนิยมไดสรางเครื่องมือแหงการทําลายตัวเองขึ้นมา และนั่นคือบทบาทของเรา บัดนี้เปนหนาที่ของเราที่จะหวานเมล็ดพันธุแหงอนาคตที่สดใสกวาลงในหมูประชาชนแหง [NOR.GetName] จากนั้นเราจะรอเวลาจนกวาจะเก็บเกี่ยวผลแหงแรงงานของเราเอง" 
 NOR_the_voice_of_the_people: "เสียงของประชาชน"
 NOR_the_voice_of_the_people_desc: "เราตองรับฟงประชาชน และสรางเครื่องมือขยายเสียงนั้น พรอมเผยแพรสัจธรรมของมารกซ เมื่อนั้นการปฏิวัติของเราจึงจะสําเร็จจากลางขึ้นบน ใหประชาชนตะโกนเรียกรองอิสรภาพจากการกดขี่ของทุน"
 NOR_organize_partisan_militias: "จัดตั้งกองกําลังพลพรรค"
 NOR_organize_partisan_militias_desc: "เปนที่ชัดเจนวาทุนนิยมจะไมยอมคลายกํามือที่บีบรัดแรงงานแหง [NOR.GetName] โดยไมตอสู ใหเราติดอาวุธและฝกผูที่เต็มใจ เพื่อที่เมื่อถึงเวลา พวกเขาจะลุกขึ้นเปดทางใหการปฏิวัติทําลายพันธนาการของทุน"
 NOR_consolidate_power: "รวบอํานาจ"
 NOR_consolidate_power_desc: "เมื่อเรามีอํานาจที่จะสรางอนาคตที่เราแสวงหาแลว ถึงเวลาที่จะทําใหมั่นใจวาเราจะรักษามันไวได ดวยการกวาดลางและการแตงตั้งใหม เราจะตัดแตงรัฐนี้ใหอยูในรูปทรงที่จะทําใหเราประสบความสําเร็จและรุงเรือง"
 NOR_demand_nationalizations: "เรียกรองการโอนกิจการเปนของรัฐ"
 NOR_demand_nationalizations_desc: "รัฐบาลกระฎมพีนี้ยังไมรูจักพลังของการเปนเจาของปจจัยการผลิตรวมกัน เราตองเรียกรองใหโอนโรงงานสําคัญทั่วประเทศเปนของรัฐ เพื่อใหการปฏิวัติเดินหนาไดแมกอนที่จะเริ่มตน ที่สําคัญกวานั้น ยิ่งมีโรงงานมาก ก็ยิ่งมีแรงงานและพันธมิตรแหงอุดมการณของเรามาก"
 NOR_squash_dissent: "ปราบปรามผูเห็นตาง"
 NOR_squash_dissent_desc: "เราไมอาจปลอยใหผลแหงความพยายามของเราถูกพวกสวะขโมยไป จําเปนอยางยิ่งที่เราตองคนหาและลบลางผูเห็นตางใหสิ้นซาก อยางไรเสีย ใครก็ตามที่สงสัยในรัฐบาลของเราก็คือศัตรูของเรา"
 NOR_denounce_the_german_reich: "ประณาม [GetNorwegianThreateningFascist]"
 NOR_denounce_the_german_reich_desc: "เราไมอาจปลอยให [GetNorwegianThreateningFascist] เหยียบยํ่าประชาชนทั่วโลก เราตองประกาศใหทุกคนในโลกรูวาเรายืนหยัดเพื่ออะไร เพื่อใหพวกเขามารวมฝายเราตอตานฟาสซิสต"
 NOR_moscows_education_centers: "ศูนยการศึกษาคอมมิวนิสต"
 NOR_moscows_education_centers_desc: "หลายปที่โคมินเทิรนสอนสหายจากทั่วสแกนดิเนเวียถึงทักษะที่จําเปนในการขับเคลื่อนการปฏิวัติใตดิน บัดนี้เราสามารถเปดสอนพวกเขาอยางเปดเผย เพื่อสอนวิธีดําเนินการปฏิวัติตอไปอยางไมสิ้นสุด"
 NOR_workers_and_farmers_rise: "กรรมกรและชาวนาลุกฮือ"
 NOR_workers_and_farmers_rise_desc: "พื้นดินไดเตรียมไวแลว เมล็ดพันธุไดหวานลงแลว และไฟแหงการปฏิวัติกําลังจะถูกจุดขึ้น ใหกรรมกรและชาวนาแหง [NOR.GetNonIdeologyName] ลุกขึ้นยึดปจจัยการผลิตจากมือเปอนเลือดของนายทุนและเจาที่ดิน"
 NOR_war_in_finland: "สงครามในฟนแลนด"
 NOR_war_in_finland_desc: "ประชาชนฟนแลนดทนทุกขมานานพอแลว เราตองผนึกกําลังกับ [SOU.GetName] ปลดปลอยพวกเขาจากทุนนิยม นี่จะเปนเพียงกาวแรกในการปลดปลอยประชาชนนอรดิกทั้งปวง"
 NOR_defend_finland: "ปกปองฟนแลนด"
 NOR_defend_finland_desc: "เราไมอาจปลอยให [SOU.GetName] อันนารังเกียจเอาเปรียบชาติผูภาคภูมิอยาง [FIN.GetName] ได เราตองจับอาวุธตอตานความกดขี่ของระบอบที่แสรงวาทําเพื่อประชาชนแตกลับเหยียบยํ่าพวกเขา ฟนแลนดตองคงเอกราช"
 NOR_send_the_king_back_to_denmark: "สงกษัตริยกลับเดนมารก"
 NOR_send_the_king_back_to_denmark_desc: "เราไมอาจเรียกตัวเองวาคอมมิวนิสตไดหากยังคงราชวงศไว เมื่อเรายึดกลไกแหงอํานาจและปจจัยการผลิตแลว ระบอบกษัตริยจะกลายเปนศูนยรวมของการปฏิวัติซอนและผูเห็นตาง เราตองจัดการกับราชวงศโดยเร็ว"
 NOR_worker_armies: "กองทัพแรงงาน"
 NOR_worker_armies_desc: "มีงานอีกมากที่ตองทํา แตประชากรไมพอจะทําทุกอยางพรอมกัน ดวยการจัดลําดับชั้นแรงงานเหมือนเปนกองรอยและกองพลทหาร เราจะเริ่มยืนหยัดไดอีกครั้งทีละโครงการ "
 NOR_nationalize_the_hydro_plants: "โอนโรงไฟฟาพลังนํ้าเปนของรัฐ"
 NOR_nationalize_the_hydro_plants_desc: "พลังงานไฟฟาพลังนํ้าเปนหนึ่งในเสาหลักของอุตสาหกรรม[ROOT.GetAdjective] แตตอนนี้กลับอยูในมือที่ผิด มือของนายทุน! มายึดปจจัยการผลิตพลังงานเพื่อขับเคลื่อนการปฏิวัติขั้นตอไปกันเถอะ"
 NOR_expand_military_industry: "ขยายอุตสาหกรรมทหาร"
 NOR_expand_military_industry_desc: "อุตสาหกรรมทหารที่เพิ่งตั้งไขของเราไมเพียงพอจะโคนทุนนิยมโลก ตองขยายใหทันความตองการของกองทัพที่ขยายตัวไมหยุดของเรา"
 NOR_a_new_norway: "นอรเวยใหม"
 NOR_a_new_norway_desc: "ในที่สุดประชาชนนอรเวยก็เปนอิสระจากแอกของทุน และความจริงขอนี้ตองปรากฏขณะที่ประเทศใหมของเราเปนรูปเปนราง คณาธิปไตยและเจาสัวจะไมกําหนดทิศทางของประเทศอีกตอไป นับจากนี้ประชาชนนอรเวยจะเปนผูกําหนดอนาคตของตนเอง เพื่อนอรเวยใหมและยิ่งกวานั้น!"
 NOR_norwegian_engineering: "วิศวกรรมนอรเวย"
 NOR_norwegian_engineering_desc: "หากเราตองการใหการปฏิวัติถาวรเกิดขึ้นจริง เราตองเลิกพึ่งพาเครื่องมือสงครามที่สรางจากพี่นองผูถูกขูดรีด เราตองพัฒนาแบบของเราเองและผลิตยุทโธปกรณเอง หากตองการเรียกการปฏิวัตินี้วาเปนของเราอยางแทจริง"
 NOR_reawaken_the_permanent_revolution: "ปลุกการปฏิวัติถาวรอีกครั้ง"
 NOR_reawaken_the_permanent_revolution_desc: "ทรอตสกีสอนเราวาการปฏิวัติจะไมหยุด และแทจริงแลวไมอาจหยุดได จนกวาชนชั้นกรรมาชีพจะไดนั่งที่คนขับของประวัติศาสตร ใหเรายกชูชนชั้นกรรมาชีพแหงสแกนดิเนเวียและดินแดนที่ไกลออกไป!"
 NOR_crush_stalin: "[GetCrushStalinName]"
 NOR_crush_stalin_desc: "หลายปที่โยซิฟ สตาลินบิดเบือนถอยคําของมารกซและเลนินเพื่อประโยชนสวนตน ตัดสินลงโทษศัตรูอยางไมเปนธรรมในศาลเตี้ย และสังเวยชีวิตนับไมถวนเพื่ออัตตาของตน เราตองหยุดเขากอนที่เขาจะทําลายอนาคตของชนชั้นกรรมาชีพ"
 NOR_crush_stalin_canonical: "บดขยี้สตาลิน"
 NOR_crush_stalin_generic: "บดขยี้หมีแดง"
 NOR_crush_big_communist: "บดขยี้ [?GLOBAL.platonic_big_communist.GetNameDef]"
 


 NOR_crush_hitler: "บดขยี้ฮิตเลอร"
 NOR_crush_hitler_desc: "มีไมกี่คนที่กออาชญากรรมตอมนุษยชาติมากเทาอดอลฟ ฮิตเลอร เขาทําลายชีวิตผูคนนับไมถวน และความชั่วรายของเขาดูไรขีดจํากัด เปาหมายสุดทายของเขาคือการทําลายทุกสิ่งที่เรารัก นั่นคือเหตุที่เราตองยุติแผนการของเขากอนที่เขาจะยุติเรา"
 NOR_prepare_for_war: "เตรียมพรอมทําสงคราม"
 NOR_prepare_for_war_desc: "ดูเหมือนจะหลีกเลี่ยงไมไดแลว แลวจะหลอกตัวเองไปทําไมวาสันติภาพจะคงอยูตลอดไป สงครามอาจยองเขาหาชาติอยางเราไดทุกเมื่อ เราจึงตองพรอมรับทุกสิ่ง"
 NOR_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 NOR_join_the_allies_desc: "เมื่อเรื่องเลวรายที่สุดเกิดขึ้นในที่สุด การมีพันธมิตรที่แข็งแกรงและไวใจไดจะเปนตัวตัดสินระหวางการตกเปนขากับอิสรภาพ [FRA.GetName] และ [ENG.GetName] ชนะเยอรมนีในมหาสงคราม และเราเชื่อวาพวกเขาทําไดอีก"
 NOR_proactive_defense: "การปองกันเชิงรุก"
 NOR_proactive_defense_desc: "ศัตรูโจมตีเราไมไดหากเราทําลายพวกเขาไปแลว ใหเรานําสงครามไปสูดินแดนของพวกเขากอนที่มันจะมาแตะดินแดนของเรา แสดงใหพวกเขาเห็นวาประชาชนแหง [NOR.GetName] ทําอะไรไดบางเมื่อถูกคุกคาม"
 NOR_secure_the_swedish_iron_ore: "ยึดแรเหล็กสวีเดน"
 NOR_secure_the_swedish_iron_ore_desc: "[SWE.GetName] มีแรเหล็กคุณภาพสูงจํานวนมหาศาลอยูใตผืนดิน ซึ่งถูกสงผานนารวิกในฤดูหนาวเมื่อทาเรือทางเหนือของพวกเขาเปนนํ้าแข็ง การปลอยแหลงแรนี้ไวอยางเปดเผยและพรอมใหทรราชตางชาติคนใดก็ไดเขามาฉวยนั้นเปนสิ่งที่ยอมรับไมได เราตองยึดมันกอนที่ศัตรูจะคิดทําเชนเดียวกัน"
 NOR_secure_denmark: "ยึดเดนมารก"
 NOR_secure_denmark_desc: "มหาอํานาจทางใตของ [NOR.GetName] ถูกกันไวมาชานานโดยอดีตเจาเหนือหัวของเรา [DEN.GetName] หากกองทัพอันออนแอของพวกเขายอมจํานน ประตูสู [NOR.GetName] ก็จะเปดกวาง เราตองปองกันเรื่องนี้ดวยการเฝาประตูนี้เอง"
 NOR_invite_secret_army: "ดึงกองทัพลับมาเปนพวก"
 NOR_invite_secret_army_desc: "ในอดีต ผูนําแหง [NOR.GetNonIdeologyName] ไดสรางกองทัพลับไวปกปองประเทศในกรณีเกิดการปฏิวัติคอมมิวนิสต แตไมจําเปนตองดําเนินคดีพวกเขาในเมื่อจุดประสงคนั้นหมดความหมายไปแลว เราสามารถประนีประนอมและเชิญผูที่ตองการปกปองประเทศใหมารวมกับเราแทนที่จะตอตานเรา"
 NOR_revive_pomor_trade: "ฟนการคาโปโมร"
 NOR_revive_pomor_trade_desc: "หลายศตวรรษที่ประชาชนของเราทางเหนือคาขายกับภูมิภาคโปโมรริมทะเลขาว ทําใหทั้งสองฝายรุงเรือง แตมหาอํานาจจักรวรรดินิยมและทุนนิยมไดทําใหมันยุติลง มาฟนการคากับพี่นองของเราที่คบหากันมายาวนานกันเถอะ"
 NOR_join_the_comintern: "เขารวมโคมินเทิรน"
 NOR_join_the_comintern_desc: "องคการคอมมิวนิสตสากลคือรมใหญที่แทจริงซึ่งตอสูเพื่อการปฏิวัติของชนชั้นกรรมาชีพทั่วโลก หากเราหวังจะเอาชนะทุนนิยมและฟาสซิสต นี่คือหนทางที่ดีที่สุดและหนทางเดียว"
 NOR_soviet_industrial_cooperation: "ความรวมมือทางอุตสาหกรรมกับโซเวียต"
 NOR_soviet_industrial_cooperation_desc: "ไมใชเรื่องนาอายที่จะขอความชวยเหลือจากประเทศที่ใหญและพัฒนากวา ในสงครามเพื่อปกปองการปฏิวัติ กรรมกร ชาวนา และวิศวกรทุกคนคือสหายของเรา และเรายินดีรับความชวยเหลือในการพัฒนาอุตสาหกรรม เชนเดียวกับที่เราจะชวยหากบทบาทกลับกัน"
 NOR_field_hospitals: "โรงพยาบาลสนาม"
 NOR_field_hospitals_desc: "ประชากรของ [NOR.GetName] ไมไดมีไมจํากัดเหมือนประเทศอื่น ยุทธปจจัยทดแทนได แตสหายที่สูญเสียไปคือหนึ่งดวงวิญญาณที่ขาดหายไปจากการตอสูสากลกับทุนนิยม เราตองมุงชวยชีวิตทหารที่บาดเจ็บทุกคน เพื่อสงกลับแนวหนาโดยเร็วที่สุด มิฉะนั้นเราอาจเสียทั้งคนและแผนดิน"
 NOR_expanded_conscription_drive: "ขยายการรณรงคเกณฑทหาร"
 NOR_expanded_conscription_drive_desc: "จนกวาการตอสูจะสิ้นสุด เราจะตองการทหารใหมปอนสูสนามรบที่จะหลอหลอมประวัติศาสตรตามอุดมการณของเรา ชายหญิงทุกคนที่สูรบไดตองเขารวมกับเรา มิฉะนั้นมาตุภูมิของเราจะถูกบุกยึด"
 NOR_invite_soviet_designers: "เชิญนักออกแบบโซเวียต"
 NOR_invite_soviet_designers_desc: "ความรูทางเทคนิคของพันธมิตรคอมมิวนิสตลํ้าหนาเราไปหลายสิบป หากพวกเขาใหยืมความเชี่ยวชาญ เราจะกาวกระโดดแซงศัตรูและหลีกเลี่ยงการนองเลือดที่ไมจําเปนดวยอาวุธและยานพาหนะที่เหนือกวา"

#Allied
 NOR_vote_of_no_confidence: "การลงมติไมไววางใจ"
 NOR_vote_of_no_confidence_desc: "เราจะไวใจนีกอรดสโวลและพรรคแรงงานของเขาใหกันพวกบอลเชวิคและนาซีไวไดหรือ? การลดอาวุธของเขาดูเหมือนชาวกรีกเปดประตูเมืองทรอยมากกวานายกรัฐมนตรีที่พรอมปกปองแผนดินจากคอมมิวนิสต เราไมอาจปลอยใหพวกเขายกชาติที่เพิ่งตั้งไขของเราให [SOU.GetNameDef]"
 NOR_liberal_conservative_alliance: "พันธมิตรเสรีนิยม-อนุรักษนิยม"
 NOR_liberal_conservative_alliance_desc: "แมฮอยเรและเวนสเตรอจะหมายถึงขวาและซายตามลําดับ แตสองพรรคของเรามีผลประโยชนรวมกันมากพอที่จะจัดตั้งรัฐบาลผสม และสกัดการโจมตีจากพรรคแรงงานจอมปวนนั่น เราจะรวมกันหลอหลอม [ROOT.GetName] ใหเปนชาติที่เปนมิตรตอทุนและพรอมทําสงครามทั้งในและนอกประเทศ"
 NOR_sabotage_unions: "บอนทําลายสหภาพแรงงาน"
 NOR_sabotage_unions_desc: "สิ่งที่แรงงานเรียกวาสิทธิมนุษยชน สําหรับเราคืออุปสรรคตอการเติบโตทางอุตสาหกรรม เราสามารถบีบขบวนการสหภาพแรงงานทั้งจากภายในและภายนอก เพื่อขจัดอุปสรรคใด ๆ ตอความพรอมทางทหารไดอยางงายดาย"
 NOR_invite_foreign_investment: "เชิญการลงทุนจากตางชาติ"
 NOR_invite_foreign_investment_desc: "อุตสาหกรรมของเราถูกละเลยมาหลายสิบป เราจึงขาดทุนที่จําเปนในการพัฒนาอุตสาหกรรมใหทัดเทียมชาติอื่นในยุโรป โชคดีที่มีนักลงทุนหิวกระหายในตางแดนมากมายที่พรอมลงทุนในอนาคตของเรา โดยมีคาตอบแทน "
 NOR_invite_transnational_manufacturers: "เชิญผูผลิตขามชาติ"
 NOR_invite_transnational_manufacturers_desc: "เรามุงเนนการคามากเสียจนไมไดใชศักยภาพดานการผลิตในประเทศอยางเต็มที่ เมื่อเราจัดการสหภาพแรงงานไดแลว บริษัทตางชาติจะแหกันมายังประเทศของเราเพราะเขาถึงตลาดแรงงานไดอยางไรอุปสรรค"
 NOR_contain_the_labor_movement: "สกัดขบวนการแรงงาน"
 NOR_contain_the_labor_movement_desc: "ตราบใดที่ยังมีขบวนการที่อุทิศตนเพื่อผลประโยชนของชนชั้นแรงงาน เราจะไมมีวันควบคุมเงินทุนที่ไหลเขาสู [NOR.GetName] และกลไกที่ทําใหมันไหลตอเนื่องไดอยางสมบูรณ"
 NOR_uproot_secret_army: "ถอนรากกองทัพลับ"
 NOR_uproot_secret_army_desc: "กองทัพลับที่รัฐบาลชุดกอนจัดตั้งขึ้นในป 1918 ไดซุมอยูในเงามืด รอคอยรัฐประหารคอมมิวนิสตที่ไมเคยเกิดขึ้น และในระหวางนั้นหลายคนก็กลายเปนฟาสซิสตหัวรุนแรง คนเหลานี้คือระเบิดเวลาที่อาจระเบิดใสหนาเราเมื่อใดก็ได ตองจัดการกับพวกเขา"
 NOR_support_finland_in_winter_war: "สนับสนุนฟนแลนดในสงครามฤดูหนาว"
 NOR_support_finland_in_winter_war_desc: "พวกบอลเชวิคกําลังมาเอาฟนแลนด และเราไมมีเหตุผลจะเชื่อวาพวกเขาจะหยุดแคนั้น เราตองสนับสนุนพี่นองชาวฟนแลนดตอตานหมีแดงทางตะวันออกกอนที่มันจะกลืนกินเราทั้งหมด"
 NOR_arrest_quisling: "จับกุมควิสลิง"
 NOR_arrest_quisling_desc: "ทุกครั้งที่มีการรวบรวมรายชื่อบุคคลอันตรายใน [NOR.GetName] อดีตรัฐมนตรีกลาโหมวิดคุน ควิสลิงแทบไมเคยปรากฏชื่อ พรรคของเขารอยหรอ เพื่อนของเขามีนอย และเหนือสิ่งอื่นใด การบูชาอดอลฟ ฮิตเลอรอยางมืดบอดของเขา ซึ่งหากเปนคนอื่นคงเปนภัยตอประเทศใดก็ตาม กลับทําใหเขาดูนาสมเพชยิ่งขึ้น แตถึงเขาจะไมสําคัญเพียงใด กันไวก็ดีกวาแก"
 NOR_protect_finnmark_from_the_bolsheviks: "ปกปองฟนนมารกจากพวกบอลเชวิค"
 NOR_protect_finnmark_from_the_bolsheviks_desc: "ในฐานะภูมิภาคเหนือสุดและตะวันออกสุดของเรา ฟนนมารกยอมเปนประตูทางเขาอันชัดเจน หาก [SOV.GetNameDef] ตัดสินใจวาการรังแก [FIN.GetNonIdeologyName] ยังไมพอ"
 NOR_replace_laake: "แทนที่ลาเคอ"
 NOR_replace_laake_desc: "คริสเตียน ลาเคอเปนเครื่องมือของพรรคเสรีนิยมมาตั้งแตไดรับแตงตั้ง เขาผลักดันการลดขีดความสามารถของกองทัพหลายครั้ง และดูเหมือนจะไมมีทั้งทักษะหรือความตั้งใจที่จะนํานอรเวยสูชัยชนะ เราตองการคนที่พรอมจะนํากองทัพมาไวแถวหนาของชีวิตใน [NOR.GetName]"
 NOR_fde_intelligence_agency: "หนวยขาวกรองกองทัพ (Forsvarets)"
 NOR_fde_intelligence_agency_desc: "ทหารและนายทหารของเราไมอาจเดินเขาสูแนวหนาอยางมืดบอด พวกเขาตองรูวาจะตองเผชิญกับอะไร และสามารถใชการลวงในแผนการของตน นี่คือเหตุที่เราจะจัดตั้งหนวยขาวกรองของกองทัพ เพื่อใหพวกเขาลงมือทํางานสกปรกแทนทหารของเรา"
 NOR_reform_the_army: "ปฏิรูปกองทัพ"
 NOR_reform_the_army_desc: "หลายปแหงการละเลยภายใตคริสเตียน ลาเคอและพรรคเสรีนิยมไดทิ้งใหกองทัพอยูในสภาพที่เรียกไดวาพังยับเยิน เราตองสรางลําดับชั้นการบังคับบัญชา การสงกําลังบํารุง ยุทธศาสตร และระเบียบปฏิบัติขึ้นใหม ใหทัดเทียมกองทัพสมัยใหมที่เรานาจะตองเผชิญ"
 NOR_improved_training: "ปรับปรุงการฝก"
 NOR_improved_training_desc: "หากเราสงทหารไปแนวหนาโดยไมไดฝกอยางเหมาะสม เราก็อาจขามคําสั่งระดมพลแลวออกใบมรณบัตรแทนเสียเลย\nโครงการฝกทหารใหมที่ผุพังตองไดรับการยกเครื่อง เพื่อใหเรามีกองกําลังรบที่ดีขึ้น และสงพวกเขาออกไปไดเร็วที่สุด"
 NOR_officers_academy: "โรงเรียนนายทหาร"
 NOR_officers_academy_desc: "นายทหารที่ดีจะทวีประสิทธิภาพของกองกําลังรบ และดวยประชากรอันนอยนิดของเรา สิ่งนี้จะสําคัญยิ่ง โดยเฉพาะหากเรายังหวังจะรอดพนการโจมตีอันหนักหนวงจากตางชาติ"
 NOR_offensive_doctrines: "หลักนิยมเชิงรุก"
 NOR_offensive_doctrines_desc: "หลักนิยมเดิมของเราถูกออกแบบภายใตสมมติฐานวาเราจะเพียงปองกันจนกวาศัตรูจะเหนื่อย นั่นคือความคาดหวังของบรรพบุรุษและศัตรูในอนาคตของเรา และนั่นยิ่งเปนเหตุผลที่เราตองรุกตั้งแตเริ่มตน"

#Historical 
 NOR_continue_nygaardsvold_government: "สานตอรัฐบาลนีกอรดสโวล"
 NOR_continue_nygaardsvold_government_desc: "รัฐบาลพรรคแรงงานที่นําโดยโยฮัน นีกอรดสโวลรับใชเรามาเปนอยางดี ดวยเหตุนี้ ไมวาเพื่อนบานทางใตจะมีความตึงเครียดทางการเมืองเพียงใด เราควรมุงความพยายามตอไปในการนําเศรษฐกิจนอรเวยออกจากวิกฤตเศรษฐกิจที่เรากําลังเผชิญ"
 NOR_weathering_the_storm_to_come: "ฝาพายุที่กําลังมา"
 NOR_weathering_the_storm_to_come_desc: "แมเราจะพยายามยกระดับสวัสดิการของประชาชนมากอน แตบัดนี้เราตองเผชิญความจริงของภัยคุกคามที่เพิ่มขึ้นรอบดาน เราตองเริ่มเตรียมรับพายุที่กําลังกอตัวทั่วยุโรป ทุกสิ่งที่เราสรางมาจะสูญเปลาหากเราปกปองมันไมได"
 NOR_broken_gun_policies: "นโยบายปนหัก"
 NOR_broken_gun_policies_desc: "เพื่อหลีกเลี่ยงความขัดแยงในอนาคต เราตองพิสูจนวาเราแสวงหาเพียงความเปนกลาง และไมไดเตรียมรุกรานประเทศใด เมื่อนั้นมหาอํานาจจึงจะไมมองเราเปนภัยคุกคามและปลอยประเทศของเราไว เราเชื่อวาสิ่งนี้ทําไดดวยการลดกําลังทหารอยางกวางขวางเทานั้น ไมวาชาว[SWI.GetAdjective]และหลักนิยมความเปนกลางติดอาวุธอันโงเขลาของพวกเขาจะคิดอยางไร"
 NOR_leaving_the_hard_thirties_behind: "ทิ้งทศวรรษ 30 อันยากลําบากไวเบื้องหลัง"
 NOR_leaving_the_hard_thirties_behind_desc: "หลายปที่เราตองทนกับผลกระทบสืบเนื่องจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ และหากไมมีเครื่องมือและฐานอุตสาหกรรมที่จําเปน ก็แทบไมมีโอกาสที่ชาติอันเยาววัยของเราจะยืนไดอยางมั่นคง ถึงเวลาเริ่มสรางฐานที่ [ROOT.GetName] จะเติบโตและรุงเรืองได"
 NOR_cut_military_budget: "ตัดงบประมาณทหาร"
 NOR_cut_military_budget_desc: "โลกอาจดูเหมือนกําลังลุกเปนไฟ แตไมไดหมายความวาเราตองมีกองทัพ เรามีนโยบายความเปนกลางที่ชัดเจน จึงสามารถดึงทรัพยากรที่เคยผูกไวกับอาวุธและการปองกัน มาใชสราง [ROOT.GetName] ที่เปนธรรมและรุงเรืองยิ่งขึ้น" 
 NOR_bail_out_towns: "อุมเมืองเล็ก"
 NOR_bail_out_towns_desc: "วิกฤตเศรษฐกิจกระทบเมืองเล็กหลายแหงทั่ว [ROOT.GetName] พวกเขาแบกภาระหนี้มหาศาลที่ไมมีทางจัดการไดเอง เรามีทั้งวิธีการและความตั้งใจที่จะชวยชุมชนเหลานี้และนําพวกเขาสูเสนทางแหงความรุงเรือง มาใชมันกันเถอะ"
 NOR_restore_public_trust_in_the_storting: "ฟนความเชื่อมั่นของประชาชนตอสตูรติง"
 NOR_restore_public_trust_in_the_storting_desc: "หลังหลายทศวรรษแหงความไมมั่นคงและการนิ่งเฉย เปนเรื่องเขาใจไดที่ประชาชนทั่วไปไมเชื่อมั่นในรัฐสภาสตูรติงของเรา หากปราศจากความเชื่อมั่นของประชาชน เราจะผลักดันมาตรการที่จําเปนเพื่อนําประเทศสูเสถียรภาพไมได"
 NOR_the_neutrality_guard: "หนวยพิทักษความเปนกลาง"
 NOR_the_neutrality_guard_desc: "ชาติอื่นอาจฉวยใชสถานะเปนกลางของเราเพื่อไดเปรียบเหนือศัตรู และลากเราเขาสูสงครามเมื่อเราปองกันพรมแดนไมได หนวยพิทักษความเปนกลางโดยเฉพาะจะรับประกันไดวาไมมีคูสงครามตางชาติใดละเมิดความไววางใจของเรา"
 NOR_rearm_for_defense: "ติดอาวุธใหมเพื่อการปองกัน"
 NOR_rearm_for_defense_desc: "เราอาจประเมินอันตรายขางหนาผิดไป ชายฝงของเราไมอาจปกปองเราจากศัตรูที่มุงมั่นได และเราไมอาจพึ่งพาเพื่อนบานนอรดิกเปนกันชนไปตลอดอยางมืดบอด บัดนี้เราตองชดเชยเวลาที่เสียไปและติดอาวุธให [NOR.GetName] อีกครั้งใหพรอมปกปองตนเอง "
 NOR_patrol_our_coast: "ลาดตระเวนชายฝง"
 NOR_patrol_our_coast_desc: "ชายฝงของเราเผชิญกับผืนทะเลกวางใหญ ซึ่งลวนเปนเสนทางที่อาจใชรุกลํ้าดินแดน[NOR.GetAdjective] กองเรือปจจุบันของเรากระจายกําลังบางเฉียบบนนานนํ้าเหลานี้ เราตองขยายกองทัพเรือเพื่อใหปองกันพื้นที่อันกวางใหญนี้ไดสําเร็จ"
 NOR_social_incrementalism: "การปฏิรูปสังคมทีละขั้น"
 NOR_social_incrementalism_desc: "เมื่อทศวรรษ 30 อันยากลําบากกลายเปนเพียงความทรงจําของประชาชน[NOR.GetAdjective] เราตองแสวงหาความกาวหนาทางสังคม แมจะตองคอยเปนคอยไป เพื่อไมไปแหยรังแตนของฝายอนุรักษนิยม"
 NOR_print_more_money: "พิมพเงินเพิ่ม"
 NOR_print_more_money_desc: "ระบบการเงินที่เพิ่งตั้งไขของเรายังไมฟนตัวเต็มที่จากมาตรการรัดเข็มขัดในทศวรรษ 30 อันยากลําบาก เราตองใชทุกเครื่องมือที่มีเพื่อปองกันไมใหสถานการณเลวรายลง รวมถึงการพิมพเงินเพิ่มใหหมุนเวียนในประเทศ"
 NOR_restart_public_investment: "เริ่มการลงทุนภาครัฐใหม"
 NOR_restart_public_investment_desc: "นี่ไมใชเวลาที่จะปลอยใหโครงสรางพื้นฐานและเศรษฐกิจทรุดโทรมเพราะการละเลย รัฐบาลพรรคแรงงานตองลงทุนในอนาคตของประเทศอีกครั้ง ไมวาจะเปนการผลิตพลเรือน หรือการเตรียมพรอมสําหรับสงครามที่อาจมาถึงเร็วกวาที่เราหวัง"
 NOR_coastal_defense: "การปองกันชายฝง"
 NOR_coastal_defense_desc: "[NOR.GetName] มีแนวชายฝงยาวที่สุดแหงหนึ่งของโลก การเสริมปอมจึงเปนงานที่หนักหนา แตตองทําหากเราจะรักษาเอกราชที่เพิ่งไดมา"
 NOR_fortify_norway: "เสริมปอมนอรเวย"
 NOR_fortify_norway_desc: "ปอมปราการของเราถูกละเลยมานานพอแลว เราตองระดมทีมกอสรางเพื่อปรับปรุงใหทันสมัยอยางรวดเร็ว หรือแมแตสรางปอมเดิมขึ้นใหม และสรางปอมใหมในจุดที่จําเปน"
 NOR_prepare_a_mobile_government: "เตรียมรัฐบาลเคลื่อนที่"
 NOR_prepare_a_mobile_government_desc: "เมื่อสงครามเริ่มขึ้นแลว รัฐบาลของเราก็ตกเปนเปา ศัตรูจะทําทุกวิถีทางเพื่อกําจัดผูนําของเราและกดขี่ประชาชนแหง [NOR.GetName] เปนเรื่องสําคัญที่เราตองพรอมยายภารกิจที่สําคัญที่สุดของรัฐบาลออกใหพนภัย"
 NOR_the_kings_no: "คําปฏิเสธของกษัตริย"
 NOR_the_kings_no_desc: "กษัตริยของเรา ฮากุนที่ 7 ทรงปฏิเสธขอเรียกรองใหยอมสยบของศัตรู [NOR.GetName] ไมใชผืนแผนดิน แตคือประชาชน และประชาชน[NOR.GetAdjective]จะสูตอไปแมแผนดินทั้งหมดจะถูกยึดไปแลว"
 NOR_prince_olavs_inspiration: "แรงบันดาลใจจากเจาชายโอลาฟ"
 NOR_prince_olavs_inspiration_desc: "แมสถานการณปจจุบันจะเปนเชนนี้ ประชาชน[NOR.GetAdjective]ยังคงศรัทธาในเจาชายของตน แมพระองคจะไมไดรวมรบ แตการสนับสนุนจากตางแดนของพระองคมีคาอยางยิ่งตอความชอบธรรมของรัฐบาลเรา"
 NOR_establish_milorg: "จัดตั้งมิลอรก"
 NOR_establish_milorg_desc: "การตอตานการยึดครองใน [NOR.GetName] ยังคงดุเดือด แตขาดการจัดระเบียบและวินัย การตอตานทางทหารที่ประสานงานกันดีและบริหารจากตางแดน จะวางรากฐานใหรัฐบาลของเรากลับคืนสูแผนดิน[NOR.GetAdjective]ได"
 NOR_approach_the_coordinating_committee: "เขาหาคณะกรรมการประสานงาน"
 NOR_approach_the_coordinating_committee_desc: "ขณะที่แผนดินของเรายังอยูในมือศัตรู จําเปนตองมีองคกรที่ทํางานในเงามืด และจัดระเบียบกลุมพลเรือนขนาดเล็กใหตอตานการยึดครองอยางลับ ๆ เราเชื่อวาผูเชี่ยวชาญหลากหลายสาขาของคูรดินาสโยนสโกมิเตน (Koordinasjonskomiteen) จะทํางานนี้สําเร็จ"
 NOR_approach_kretsen: "เขาหาเครตเซน"
 NOR_approach_kretsen_desc: "มีชาว[NOR.GetAdjective]ผูมีชื่อเสียงที่อาศัยอยูในดินแดนที่ถูกยึดครอง ซึ่งกอนสงครามเคยตอตานรัฐบาลนีกอรดสโวล แตบัดนี้มีศัตรูรวมกับเรา ผูพิพากษา ผูบริหาร ผูจัดการ และนักธุรกิจเหลานี้ที่แอบประชุมกันที่ฟารมกรีเมอลุนด อาจมีบทบาทสําคัญในการตอตานของเราหากพวกเขามอบอิทธิพลใหเรา "
 NOR_use_xu: "ใช XU"
 NOR_use_xu_desc: "มีขอมูลอันมีคาอยูใน [NOR.GetName] ที่ถูกยึดครอง เราตองการองคกรที่สามารถจัดหาขาวกรองใหนักรบฝายตอตาน พันธมิตร และความพยายามทําสงครามของเราเองในตางแดน"
 NOR_recruit_norwegian_refugees: "เกณฑผูลี้ภัยนอรเวย"
 NOR_recruit_norwegian_refugees_desc: "ชาว[NOR.GetAdjective]นับรอยหรืออาจนับพันกําลังหนีจากการยึดครองเพื่อหลีกเลี่ยงการกดขี่ของศัตรู หลายคนเคยเปนสวนหนึ่งของกองกําลังที่สูปกปองประเทศแตหลบหนีไมทัน บางคนไดเรียนรูการตอสูกับฝายตอตาน และบางคนไมเคยสูรบเลยแตสามารถฝกได เราตองใชทุกคนที่ทําไดเพื่อเอาชีวิตรอดจากสงครามนี้"
 NOR_empower_sivorg: "เสริมอํานาจซีวอรก"
 NOR_empower_sivorg_desc: "เมื่อเครตเซนและคณะกรรมการประสานงานเขารวมความพยายามของเราแลว ถึงเวลาที่จะใหพวกเขาทํางานรวมกันภายใตรมเดียวกัน ซีวอรกจะเปนองคกรที่รวมพลเรือนทุกประเภท เพื่อจัดระเบียบการตอตานภาคพลเรือนใน [NOR.GetName]"
 NOR_preparing_the_return_to_norway: "เตรียมการกลับสูนอรเวย"
 NOR_preparing_the_return_to_norway_desc: "เวทีพรอมแลว เรามีกองกําลังตอตานสรางความปนปวนหลังแนวขาศึก ความรวมมือจากผูบริหารคนสําคัญในดินแดนยึดครอง ทหารที่ฝกมาอยางดีในตางแดน และการสนับสนุนทางทหารจากพันธมิตร ถึงเวลานําการตอสูกลับไปหาศัตรูและยึด [NOR.GetNonIdeologyName] คืน!"
 NOR_quislings_coup_happened: "ควิสลิงไดเริ่มรัฐประหารของเขาแลว"

#Fascist 
 NOR_the_stumbling_storting: "สตูรติงที่ลมลุกคลุกคลาน"
 NOR_the_stumbling_storting_desc: "เราเคยเห็นแสงที่ปลายอุโมงคแหงความไมมั่นคงทางการเมือง แตบัดนี้มันกําลังริบหรี่สูความโกลาหลยิ่งขึ้น แมโยฮัน นีกอรดสโวลจะพยายามอยางดีที่สุด แตความขัดแยงภายในสตูรติงกําลังพามันเขาใกลความโกลาหลมากขึ้นทุกที"
 NOR_lurk_in_the_shadows: "ซุมอยูในเงามืด"
 NOR_lurk_in_the_shadows_desc: "ขณะที่สตูรติงกําลังกัดกินตัวเอง เราจะใชสิ่งนี้ใหเปนประโยชน ความลมเหลวตอเนื่องของรัฐสภาคือจุดรวมพลที่เราตองการ เพื่อดึงประชาชน[NOR.GetAdjective]เขาสูนัสโยนัลซัมลิงและเขาสูกรงเล็บของฟาสซิสต"
 NOR_fascist_invasion_of_norway: "การรุกรานนอรเวยของฟาสซิสต"
 NOR_fascist_invasion_of_norway_desc: "สิ่งที่ไมนาเชื่อไดเกิดขึ้นแลว ภัยฟาสซิสตที่เราคิดวาอยูหางไกลไดมาปรากฏที่หนาประตูบานและพังมันเขามา เราไดแตหวังวาจะยื้อไดนานพอใหความชวยเหลือมาถึง"
 NOR_ask_for_foreign_support: "ขอการสนับสนุนจากตางชาติ"
 NOR_ask_for_foreign_support_desc: "เนื่องจากราชอาณาจักรของเราไมเคยมีฐานผูสนับสนุนฟาสซิสตขนาดใหญ เราจึงตองการการสนับสนุนจากพี่นองฟาสซิสตในตางแดน ดวยความชวยเหลือของพวกเขา เราจะชี้ทางให [NOR.GetName] สูจักรวรรดิฟาสซิสตแพนเจอรแมนิก"
 NOR_approach_the_fatherland_league: "เขาหาสันนิบาตปตุภูมิ"
 NOR_approach_the_fatherland_league_desc: "หลายปมาแลวที่สันนิบาตปตุภูมิผลักดันวาระอนุรักษนิยมในนอรเวย แตพวกเขาขาดแรงขับและความเด็ดเดี่ยวอยางเรา เราสามารถแสดงใหพวกเขาเห็นวาเราสอดคลองกันเพียงใด และเราจะผนึกกําลังกันเพื่อบรรลุเปาหมายรวมในการตอตานคอมมิวนิสตไดอยางไร"
 NOR_cultivate_the_conservative_parties: "บมเพาะพรรคอนุรักษนิยม"
 NOR_cultivate_the_conservative_parties_desc: "แมการสนับสนุนฟาสซิสตใน [NOR.GetName] จะตํ่า แตมีกลุมอนุรักษนิยมมากมายวนเวียนอยูรอบสตูรติง เราสามารถบมเพาะพวกเขาเพื่อหวานเมล็ดพันธุแหงฟาสซิสต แลวนําพวกเขามาหาเราเพื่อตอกยํ้าอํานาจของเราในการเมือง[NOR.GetAdjective]"
 NOR_get_industrialist_support: "หาการสนับสนุนจากนักอุตสาหกรรม"
 NOR_get_industrialist_support_desc: "แมระดับการพัฒนาอุตสาหกรรมของเราจะตํ่า แตธุรกิจขนาดใหญมีอิทธิพลมหาศาลตอกลไกแหงอํานาจ และดวยความชวยเหลือของเรา พวกเขาจะมีอิทธิพลยิ่งขึ้น ตราบเทาที่พวกเขาสนับสนุนเรา\n\nอยางไรเสีย อุดมการณเดียวของทุนก็คือการขยายตัวของทุน และตราบใดที่เราจัดหาเครื่องมือเพื่อการนั้นได พวกเขาก็จะอยูขางเรา"
 NOR_nasjonal_samling: "นัสโยนัลซัมลิง"
 NOR_nasjonal_samling_desc: "หลายปมาแลวที่พรรคฟาสซิสตชั้นนําใน [NOR.GetName] ถูกพรรคสายกลางและฝายซายกระแสหลักกันไวขางสนาม แตนั่นจะจบลงแลว เราตองรวมพลังเบื้องหลังผูนําพรรค วิดคุน ควิสลิง ผูนําผูมีความสามารถและบารมีของเรา เพื่อสถาปนาระบอบฟาสซิสต[NOR.GetAdjective]อยางแทจริง"
 NOR_the_secret_army: "กองทัพลับ"
 NOR_the_secret_army_desc: "ตั้งแตป 1918 กองกําลังอิสระที่ไดชื่อวาเฮมเมลิเกแฮเริน (Hemmelige Hæren) ถูกฝงตัวและซอนอยูทั่ว [NOR.GetName] เพื่อพรอมลงมือหากมีความเสี่ยงที่คอมมิวนิสตจะยึดอํานาจ คําปฏิญาณตอตานคอมมิวนิสตของพวกเขาสามารถพลิกเปนการสนับสนุนฟาสซิสต และที่สําคัญกวานั้น เปนการสนับสนุนการยึดอํานาจของเราเอง"
 NOR_empower_hirden: "เสริมอํานาจฮีรเดิน"
 NOR_empower_hirden_desc: "ฮีรเดิน องคกรกึ่งทหารของเราเอง เปนกระดูกสันหลังของแผนการของนัสโยนัลซัมลิงสําหรับอนาคตของ [NOR.GetName] การมุงเนนที่องคกรนี้จะสําคัญยิ่งตอการยึดรัฐบาลและการสูรบหากจําเปน"
 NOR_quislings_coup: "รัฐประหารของควิสลิง"
 NOR_quislings_coup_desc: "สถานการณสุกงอมแลวสําหรับการกาวขึ้นสูอํานาจอยางหลีกเลี่ยงไมไดของนัสโยนัลซัมลิง ภายใตการนําอยางเหมาะสมของฟอเรอรวิดคุน ควิสลิง นี่คือกาวแรกสูการควบคุมดินแดน[NOR.GetAdjective]อยางเบ็ดเสร็จ และการขยายอํานาจไปทั่วสแกนดิเนเวียในที่สุด"
 NOR_required_prep_fascist_TT: "§Yการสนับสนุนรัฐประหารฟาสซิสตทั้งหมด§! สูงกวา $RIGHT|0Y$ (การสนับสนุนปจจุบัน: $LEFT|0Y$)"
 NOR_quislings_regime: "ระบอบควิสลิง"
 NOR_quislings_regime_desc: "อัจฉริยภาพอันมั่นคงของฟอเรอรแหงนัสโยนัลซัมลิงเปนที่ประจักษ และแมหลายคนจะปฏิเสธเขาทั้งในทางการเมืองและสวนตัว แมแตในคณะรัฐมนตรีของเขาเอง แตก็ปฏิเสธไมไดวาความดื้อรั้นและความมั่นใจของเขาไดใหผลลัพธ เขาสามารถรักษาระบอบใหดําเนินไปไดอยางแนนอน แตจะนานเทาใด? นั่นยังตองรอดู"
 NOR_get_rid_of_quisling: "กําจัดควิสลิง"
 NOR_get_rid_of_quisling_desc: "รัฐประหารของควิสลิงไมเคยถูกออกแบบมาใหยั่งยืน มันเปนเพียงมาตรการชั่วคราวในกรณีที่พันธมิตรฟาสซิสตของเราตองการใครสักคนมาทําใหการรุกรานดูมีความชอบธรรม เมื่อชัดเจนแลววาเราไมตองการตัวตลกผูมั่นใจเกินเหตุคนนี้ เราตองทิ้งเขาโดยเร็วที่สุด"
 NOR_elevate_hirden: "ยกระดับฮีรเดิน"
 NOR_elevate_hirden_desc: "ฮีรเดินรับใชเรามาอยางดีในฐานะฝายกึ่งทหารของนัสโยนัลซัมลิง แตเมื่อเรามีระบอบฟาสซิสตที่กําลังเติบโต เราควรพิจารณาเสริมสถานะของมันในโครงสรางอํานาจของรัฐบาล[NOR.GetAdjective]"
 NOR_military_police: "สารวัตรทหาร"
 NOR_military_police_desc: "ขณะที่การตอตานระบอบของเราเพิ่มขึ้น เราตองมีเครื่องมือตัดไฟแตตนลมกอนที่มันจะลุกลาม สารวัตรทหารที่กาวหนากวาอาจเปนหนทางเดียวที่จะปกปองอํานาจของเรา จนกวาประชาชนแหง [NOR.GetName] จะเรียนรูที่จะยอมรับระเบียบใหม"
 NOR_extensive_recruitment: "การเกณฑทหารอยางกวางขวาง"
 NOR_extensive_recruitment_desc: "หากเราตองการขยายจักรวรรดิ เราตองตระเวนทั่วแผนดิน[NOR.GetAdjective]เพื่อคนหาทหารที่มีจิตวิญญาณของบรรพบุรุษชาวนอรส การประมงและการเกษตรเปนเรื่องรองจากการขยายจักรวรรดิ ชายทุกคนที่มีความสามารถจึงตองพรอมจับอาวุธตอสูศัตรูของเรา"
 NOR_the_weapons_of_conquest: "อาวุธแหงการพิชิต"
 NOR_the_weapons_of_conquest_desc: "การพิชิตศัตรูตองการมากกวาแคกําลังคนและความมุงมั่นที่จะสู หลายคนจะตองตาย แตการสรางเครื่องมือที่เพิ่มโอกาสรอดของพวกเขาหมายความวาเราจะขยายพรมแดนไปไดไกลยิ่งขึ้น"
 NOR_lynrytter: "ลีนรึตเตอร (อัศวินสายฟา)"
 NOR_lynrytter_desc: "เมื่อสงครามสายฟาแลบไดพิสูจนแลววาเปนยุทธศาสตรที่เหนือกวา เราตองยอมรับมันและขับรถถังบุกทะลวงแนวหนาของศัตรู โอดินเองจะอยูขางเราเมื่อยานเกราะของเรานําชัยชนะอันรวดเร็วมาสู [NOR.GetNameDef]"
 NOR_ulfhedhnar_wolf_coats: "อุลฟเฮดนาร"
 NOR_ulfhedhnar_wolf_coats_desc: "เชนเดียวกับนักรบหนังหมาปาในอดีต ซึ่งเปนกองกําลังเบอรเซิรกเกอรที่ปกปองกษัตริยฮาราลดผมงาม อุลฟเฮดนารรุนใหมนี้จะเปนวรรณะนักรบชั้นยอดที่เปนหัวหอกของกองกําลังเราในการปกปองและขยายดินแดน"
 NOR_crackdown_on_civilian_life: "ควบคุมชีวิตพลเรือนอยางเขมงวด"
 NOR_crackdown_on_civilian_life_desc: "ไมมีเวลาสําหรับการพักผอนหยอนใจ สงครามมาถึงแลว และในยุคใหมนี้หมายความวาสงครามตองเปนสงครามเบ็ดเสร็จเทานั้น มิฉะนั้นจะจบลงดวยความตายและความอัปยศของระบอบเรา ชีวิตพลเรือนตองถูกจํากัดเพื่อการรับใชปตุภูมิ"
 NOR_the_administrative_council: "สภาบริหาร"
 NOR_the_administrative_council_desc: "ตองยอมรับวาการยึดครอง[NOR.GetAdjective]นาจะไปไดดีกวานี้ บางทีการเปลี่ยนแนวทางอาจชวยได แทนที่จะปกครองโดยตรง เราสามารถแตงตั้งสภาผูรวมมือทองถิ่นเพื่อใหประชาชนรูสึกเหมือนมีอํานาจปกครองตนเองอยูบาง "
 NOR_abandoning_nynorsk: "ละทิ้งนือนอสก"
 NOR_abandoning_nynorsk_desc: "แมจะดูมีจุดประสงคเชิงชาตินิยม แตนือนอสกเปนเพียงภาษาผสมที่ประกอบดวยเศษเสี้ยวจากถิ่นชนบทหางไกลและภาษาถิ่นในเมือง เราควรมุงเนนภาษาที่ชาว[NOR.GetAdjective]สวนใหญใชอานเขียนอยูแลวจะดีกวา ผูพูดภาษาชนกลุมนอยก็แคตองปรับตัวตามระเบียบของเรา"
 NOR_pan_germanic_cooperation: "ความรวมมือแพนเจอรแมนิก"
 NOR_pan_germanic_cooperation_desc: "ในทางวัฒนธรรม [NOR.GetNonIdeologyName] เปนสวนหนึ่งของโลกเจอรแมนิกที่กวางใหญ จึงสมเหตุสมผลที่จะแสวงหาความรวมมือที่ใกลชิดยิ่งขึ้น ใหเรายื่นมือออกไปและสรางจักรวรรดิไปดวยกัน"
 NOR_secret_police: "ตํารวจลับ"
 NOR_secret_police_desc: "ถึงเวลาที่เราตองกระชับการควบคุมประชาชน[NOR.GetAdjective] เราสังเกตเห็นการปลุกปนเปนหยอม ๆ มันอาจดูไมสําคัญ แตอาจรวมกันเปนแนวรวมเดียวกอนที่เราจะมีเวลาพัฒนายุทธวิธีสกัดกั้น อยางไรเสีย วิธีที่ดีที่สุดในการรักษาความคมของดาบก็คือการใชมันบอย ๆ"
 NOR_fascist_military_collaboration: "ความรวมมือทางทหารกับฟาสซิสต"
 NOR_fascist_military_collaboration_desc: "ฟาสซิสตจากตางแดนชวยใหเราไดระบอบปจจุบันมา และโชคดีที่บัดนี้เราอยูในฐานะที่จะรวมมือทางทหารอยางใกลชิดยิ่งขึ้น เกือบจะในฐานะที่เทาเทียมกัน"
 NOR_frontkjempere: "ฟรอนตเชมเปอเร (นักรบแนวหนา)"
 NOR_frontkjempere_desc: "ชาว[NOR.GetAdjective]จํานวนมากปรารถนาจะไปแนวหนา เพื่อชวยผูปลดปลอยของเราพิชิตดินแดนตางแดน หลายคนจะตองตาย แตนั่นคือราคาที่เราตองจายเพื่อเปนสวนหนึ่งของขบวนการชาตินิยมระดับโลก ใครจะรู บางที [NOR.GetName] อาจเปนที่โปรดปรานมากพอที่จะไดรับความไววางใจใหบริหารการยึดครองของตนเอง"
 NOR_fascist_industrial_investments: "การลงทุนทางอุตสาหกรรมจากฟาสซิสต"
 NOR_fascist_industrial_investments_desc: "มิตรสหายฟาสซิสตของเรามีทั้งความเชี่ยวชาญและเงินทุนที่จําเปนสําหรับอุตสาหกรรมขั้นสูงที่ประเทศสมัยใหมตองมีเพื่อการแขงขัน เราสามารถใชสิ่งนี้เปนหนทางสูการเปนพันธมิตรที่มีประโยชนยิ่งขึ้น"
 NOR_norwegian_reichsprotectorate: "รัฐในอารักขาไรชนอรเวย" 
 NOR_norwegian_reichsprotectorate_desc: "ดวยความสําเร็จมากมายของเรา [GetNorwegianFascistOverlord] จึงตัดสินใจวา [NOR.GetName] พรอมแลวที่จะผนวกชาติของเราเขาสูจักรวรรดิของพวกเขาอยางสมบูรณ นี่คือภาพสะทอนของพลังของพวกเขา และความนอบนอมของเราตอพลังนั้น เราจะทําทุกอยางเพื่อสนองความกระหายอํานาจและดินแดนที่ไมรูจักพอของพวกเขา"
 NOR_jonas_lie_coup: "รัฐประหารของโยนัส ลี"
 NOR_jonas_lie_coup_desc: "ความไรความสามารถของควิสลิงดูจะไมมีขีดจํากัด เขาเปนตัวถวงของระบอบเรามาตั้งแตกอนเริ่มตนดวยซํ้า และเขาคือจุดออนในสายการบังคับบัญชาของเรา ในทางกลับกัน เรามีโยนัส ลี ผูสนับสนุนการยึดครอง [ROOT.GetName] ของ [GetNorwegianFascistOverlord] อยางแข็งขันมาตั้งแตตน และเปนผูรักษาระเบียบอยางไมลดละเมื่อจําเปน เขาควรเปนผูนําประชาชนของเขาในการไลตามเปาหมายของพันธมิตรเรา"
 NOR_bring_back_quisling: "นําควิสลิงกลับมา"
 NOR_bring_back_quisling_desc: "หลายคนมองวาเขาเปนตัวตลกที่ไมรูอะไร แตการกาวขึ้นสูอํานาจของควิสลิงบงบอกถึงแผนการอันแยบยลเบื้องหลังความลมเหลวที่ดูเหมือนจะเกิดขึ้น นี่คือคนแบบที่ตองอยูที่หางเสือ เพื่อนํา [NOR.GetName] สูดินแดนใหมอันอุดมสมบูรณ เหมือนชาวไวกิ้งในอดีต"
 NOR_a_valuable_partner_to_germany: "หุนสวนอันมีคาของ [GetNorwegianFascistOverlord]"
 NOR_a_valuable_partner_to_germany_desc: "ความสําเร็จของชาตินี้ผูกพันอยางแนบแนนกับความสําเร็จของ [GetNorwegianFascistOverlord] ยิ่งเราชวยพวกเขาไดมากเทาใด พวกเขาก็จะตอบแทนเราดวยของปลนจากสงครามมากเทานั้น เราตองมุงสูเสนทางที่จะเปลี่ยน [NOR.GetNAme] ใหเปนหุนสวนที่ขาดไมได"
 NOR_invite_german_engineers: "เชิญวิศวกรฟาสซิสต"
 NOR_invite_german_engineers_desc: "[NOR.GetName] ไมเคยเปนขุมพลังทางอุตสาหกรรม บรรพบุรุษของเรามุงเนนการคามากกวาการผลิตสินคาของเราเอง นั่นคือเหตุที่เราตองการความชวยเหลือจาก [GetNorwegianFascistOverlord] เพื่อใหไดความรูที่จําเปนในการไลตามพันธมิตร และที่สําคัญกวานั้น ไลตามศัตรูของเรา"
 NOR_the_kings_abdication: "การสละราชสมบัติของกษัตริย"
 NOR_the_kings_abdication_desc: "เมื่อกษัตริยและสมุหราชมนเทียรของพระองคตระหนักถึงอํานาจอันนาเกรงขามของผูรุกราน ก็ไมเหลือสิ่งใดจะมอบใหหรือเอาไปจากประชาชนอีกแลว พระเจาฮากุนที่ 7 ซึ่งปรากฏพระองคตอสาธารณะอยางหาไดยาก ไดประกาศวาพลเมือง[NOR.GetAdjective]ทุกคนควรกมหัวใหแกฟาสซิสตที่หลั่งไหลเขามาในแผนดินของเรา"
 NOR_reviving_the_norgesveldet: "ฟนฟูนอรเกสเวลเดต"
 NOR_reviving_the_norgesveldet_desc: "บรรพบุรุษของเราเปนที่หวาดกลัวของทุกคน ปลนสะดมและพิชิตทุกที่ที่มองเห็นและแลนเรือไปถึง เราตองหันกลับไปมองอดีตและนําจิตวิญญาณนั้นกลับมา เราจะเปนภัยไวกิ้งรุนใหมที่ทําใหเด็ก ๆ นอนไมหลับ"
 NOR_old_vinland: "วินแลนดเกา"
 NOR_old_vinland_desc: "นักสํารวจชาวนอรสโบราณมุงหนาไปทางตะวันตกไกลกวาใคร จนในที่สุดก็ไปถึงดินแดนอันอุดมสมบูรณแหงวินแลนด หรือที่ปจจุบันเรียกวานิวฟนดแลนดและแลบราดอร ใหเรามุงหนาตะวันตกอีกครั้งและพิชิตสิ่งที่ควรเปนของเรามาตั้งแตแรก"
 NOR_claims_on_scotland: "อางสิทธิ์เหนือสกอตแลนด"
 NOR_claims_on_scotland_desc: "กอนจะเปนสวนหนึ่งของสหราชอาณาจักร สกอตแลนดเปนเพียงสวนหลังบานของบรรพบุรุษเรา ใหเรายึดคืนจากมือที่ออนแอซึ่งแทบจะเก็บรากเหงาไวกิ้งของมันไวไมอยู และทองไปตามชายฝงและขุนเขาแหงบริเตนตอนเหนืออีกครั้ง"
 NOR_claims_on_ireland: "อางสิทธิ์เหนือไอรแลนด"
 NOR_claims_on_ireland_desc: "ที่แหงนี้เคยเปนเพียงบึงนํ้าดําที่บรรพบุรุษชาวนอรสของเราตั้งถิ่นฐานและเรียกวาดูฟลิน (Duibhlinn) จากสถานที่ที่ดูไมสําคัญแหงนี้ ชาวไวกิ้งมากมายไดเจริญรุงเรือง ปลนสะดม และผสมกลมกลืนกับชนเผาเกล พวกเขาคงไมวาอะไรหากเราจะยึดคืน ไมวาดวยคําพูดหรือดวยกําลัง"
 
## Monarchist Path
 NOR_the_chamberlains_overture: "ขอเสนอของสมุหราชมนเทียร"
 NOR_the_chamberlains_overture_desc: "ขณะที่สตูรติงกะเผลกไปสูความไรความหมาย บุคคลตนแบบแหงคุณคาของชนชั้นสูง บารอนเพเดอร อังเคอร เวเดล-ยารลสแบรก ผูมีสิทธิ์ลําดับที่สองในเคานตีศักดินายารลสแบรก และสมุหราชมนเทียรของพระเจาฮากุนที่ 7 ผูถอมพระองคของเรา เสนอวาเราควรมองอดีตเพื่อหาทางออกใหอนาคต กลาวคือ บางทีกลไกแหงราชสํานักอาจเขาควบคุมรัฐบาลทั้งหมด"
 NOR_send_the_storting_home: "สงสตูรติงกลับบาน"
 NOR_send_the_storting_home_desc: "รัฐสภาแหงชาติของเราหายใจเฮือกสุดทายไปนานแลว การยื้อชีวิตไวมีแตจะยืดความทุกขทรมานของมัน และพูดตรง ๆ ก็ของเราดวย ใหนักการเมืองกลับบานไปใชเวลากับครอบครัว คนของกษัตริยจะจัดการเรื่องตาง ๆ เอง"
 NOR_assure_the_population: "สรางความมั่นใจแกประชาชน"
 NOR_assure_the_population_desc: "[ROOT.GetName] อาจดูเหมือนกําลังดิ่งลงสูหายนะ แตสมุหราชมนเทียรในนามของพระเจาฮากุนที่ 7 ตองการใหประชาชนรูวาสถาบันกษัตริยจะประคองไวอยางมั่นคงเพื่อนําแผนดินกลับสูเสถียรภาพ"
 NOR_demand_king_haakons_rise_to_power: "เรียกรองใหพระเจาฮากุนขึ้นกุมอํานาจ"
 NOR_demand_king_haakons_rise_to_power_desc: "ดวยสุนทรพจนอันปลุกใจของบารอนเวเดล-ยารลสแบรก ประชาชนแหง [NOR.GetName] ตางเรียกรองใหสถาบันกษัตริยที่เด็ดเดี่ยวเขากุมบังเหียนรัฐบาล ปญหาเดียวคือพระเจาฮากุนที่ 7 เองยังคงทรงยํ้าวาประเทศควรปกครองโดยผูแทนของประชาชน ดูเหมือนกษัตริยจะตองไดรับการโนมนาวบาง"
 NOR_the_crowns_executive_powers: "พระราชอํานาจบริหารของราชบัลลังก"
 NOR_the_crowns_executive_powers_desc: "ในเมื่อกษัตริยยังคงทรงปฏิเสธทุกเสียงเรียกรองใหทรงใชอํานาจเบ็ดเสร็จ เราจึงไมมีทางเลือกนอกจากถวายอํานาจบริหารแดพระองค เมื่อพระองคตื่นจากการหลับใหลทางการเมือง พระองคจะมีเครื่องมือนํา [ROOT.GetNonIdeologyName] สูความรุงโรจน!"
 NOR_a_warden_king: "กษัตริยผูพิทักษ"
 NOR_a_warden_king_desc: "เปนหนาที่ของกษัตริย ไมสิ เปนพระราชอภิสิทธิ์ของพระองค ที่จะปกปองแผนดินที่อํานาจเบื้องบนประทานแกพระองค ใหกองทัพเปนดาบแหงพระราชอํานาจเบ็ดเสร็จ ซึ่งหลับใหลอยูจนกวากษัตริยจะทรงเลือกลุกขึ้นและทรงใชมัน"
 NOR_the_kingdom_of_norway: "ราชอาณาจักรนอรเวย"
 NOR_the_kingdom_of_norway_desc: "ถึงเวลาแลว ไมวาพระเจาฮากุนจะทรงรูหรือไม ใหเราลอกคราบการเสแสรงวาเปนประชาธิปไตยและการปกครองโดยประชาชนออกไป และใหถุงมือเหล็กแหงสถาบันกษัตริยทุบศัตรูของเราจนแหลกละเอียด กษัตริยจะไมมีทางเลือกนอกจากเสด็จเขารวมพิธีบรมราชาภิเษกครั้งใหมของพระองคเอง"
 NOR_appoint_prince_olav_to_army_staff: "แตงตั้งเจาชายโอลาฟเขาสูเสนาธิการกองทัพบก"
 NOR_appoint_prince_olav_to_army_staff_desc: "เมื่อราชวงศเห็นดวยกับโครงการของเราแลว เราตองใชประโยชนจากความสามารถของพระองค และมอบหมายภารกิจปกปองราชอาณาจักรแกทุกพระองค หากเราแตงตั้งเจาชายโอลาฟใหนํากองทัพบก เราจะมั่นใจไดวาพระองคจะทรงใชการฝกและประสบการณอยางเต็มที่ในการรับมือศัตรูบนบก"
 NOR_prince_olav_to_navy_staff: "เจาชายโอลาฟสูเสนาธิการกองทัพเรือ"
 NOR_prince_olav_to_navy_staff_desc: "แมจะยังทรงตอตานโครงการของเรา แตเจาชายโอลาฟทรงเปดรับแนวคิดที่จะบัญชาการกองกําลังทางเรือของราชอาณาจักร อยางไรเสีย พระองคทรงควาเหรียญทองกีฬาเรือใบในโอลิมปกป 1928 เราจึงรูวาพระองคทรงเปนหนึ่งเดียวกับคลื่น เมื่อพระองคทรงมุงนํากองกําลังทางเรือ เรารูวาศัตรูจะกลายเปนอาหารของปลาแซลมอนที่ราษฎรของเราจับ"
 NOR_promote_civilian_donations: "สงเสริมการบริจาคของพลเรือน"
 NOR_promote_civilian_donations_desc: "เชนเดียวกับระบบศักดินาในอดีต ขาราชบริพารทุกคนตองจายสวยแกเจานายของตน แนนอนวาวันเวลาอันปาเถื่อนเหลานั้นผานไปแลว ระบอบกษัตริยอันถอมตนของเราเจริญกวานั้น ดังนั้นบรรณาการนี้จึงเปนไปโดยสมัครใจเปนสวนใหญ"
 NOR_research_funding: "ทุนวิจัย"
 NOR_research_funding_desc: "ผูปกครอง[ROOT.GetAdjective]ผูสูงศักดิ์ของเราอุทิศตนเพื่อความรูแจง จึงยินดีเปนผูอุปถัมภความกาวหนาทางวิทยาศาสตรที่จําเปนตอการขยายอาณาจักรของเรา ดวยความรุนแรงกอน และทายที่สุดดวยเมตตาธรรมเพียงอยางเดียว"
 NOR_invite_cadillac_to_norway: "เชิญคาดิลแลคมายังนอรเวย"
 NOR_invite_cadillac_to_norway_desc: "หลายปกอน เจาชายโอลาฟที่รักของเรา ซึ่งตอนนั้นยังเปนทารกที่ราเริง ไดรับรถคาดิลแลคจําลองเปนของขวัญ พระองคคงทรงยินดีแนหากเราเชิญคาดิลแลคเขามายัง [NOR.GetNameDef] เพื่อชวยพัฒนาและผลิตยานพาหนะที่จะแบกธงของเราขามศพศัตรู ขอใหมันนําความทรงจําอันแสนสุขในวัยเยาวกลับมาสูเจาชาย"
 NOR_enhance_coastal_defense: "เสริมการปองกันชายฝง"
 NOR_enhance_coastal_defense_desc: "แนวชายฝงอันกวางใหญของเราเปนดาบสองคม ดานหนึ่งทําใหประชาชนของเราเจริญรุงเรืองจากทองทะเล แตอีกดานหนึ่งหมายความวาศัตรูมีชองทางกวางขวางสําหรับการยกพลขึ้นบก"
 NOR_rule_the_northern_sea: "ครองทะเลเหนือ"
 NOR_rule_the_northern_sea_desc: "ใหอาณาจักรของเราขยายสูทะเลเหนือ! เรือของเราจะเปนแขนที่ยื่นราชอาณาจักรออกไปถึงขอบฟา เพื่อการนั้น เราตองมีฐานทัพเรือที่จําเปนตอการรักษาความเปนใหญเชนนี้ รวมถึงแนวปฏิบัติและเทคนิคที่จะพาเราไปไดไกลยิ่งขึ้น"
 NOR_ramp_up_naval_production: "เรงการผลิตเรือรบ"
 NOR_ramp_up_naval_production_desc: "แมเราจะมีประเพณีทางทะเลอันเลื่องลือ แตกําลังทางเรือปจจุบันไมสมกับความทะเยอทะยานของเรา เราตองไมยอทอในกาวแรก คือการสรางอูตอเรือที่จะหลอเลี้ยงกองทัพเรือของเจาชายและกษัตริยในอนาคตของเรา โอลาฟ"
 NOR_power_to_the_royal_guard: "อํานาจแกราชองครักษ"
 NOR_power_to_the_royal_guard_desc: "ฮันส มาเยสเตต คองเงนส การเด ราชองครักษของกษัตริยผูเปนที่รักของเรา เปนกองกําลังรบที่ไดรับการฝกดีที่สุดและเด็ดเดี่ยวที่สุดในราชอาณาจักรมาโดยตลอด แรงบันดาลใจที่พวกเขาไดรับจากกษัตริยและผูสําเร็จราชการนั้นจับตองได พวกเขาจึงตองนําการบุกของกองทัพ และเปนปลายหอกที่จะบดขยี้ศัตรูของเรา"
 NOR_encourage_recruitment: "สงเสริมการรับสมัครทหาร"
 NOR_encourage_recruitment_desc: "ดังที่สมุหราชมนเทียรผูเปนที่รักของเรามักกลาวไว พระเจาฮากุนทรงสถิตอยูในใจเรา ดังนั้นใครก็สูและตายเพื่อพระองคได! ใหพระวิญญาณของพระองคปลุกราษฎรทุกคนใน [ROOT.GetNameDef] ใหสมัครเขาสูเพื่อเจาเหนือหัวของตน"
 NOR_for_the_king_and_prince: "เพื่อกษัตริยและเจาชาย"
 NOR_for_the_king_and_prince_desc: "พระเจาฮากุนของเราและพระราชโอรส เจาชายโอลาฟ คือแรงบันดาลใจของชาว[NOR.GetAdjective]ทุกคน เราตองเตือนทหารของเราวาทุกกาวที่รุกไปขางหนา ทุกศัตรูที่สังหาร และเลือดทุกลิตรที่หลั่งไหล ลวนไมสูญเปลา ทั้งหมดนี้เพื่อราชวงศ ขุนนางแหง [NOR.GetName] และสิ่งที่พวกเขาเปนตัวแทน"
 NOR_the_kings_line: "แนวปองกันของกษัตริย"
 NOR_the_kings_line_desc: "บังเกอรและปอมปนที่ทอดตัวรอบพรมแดนราชอาณาจักรคือการแสดงออกทางกายภาพของความเขมแข็งและพระราชประสงคของกษัตริย ใหทหารของเราหลั่งเลือดเพื่อใหแนวของกษัตริยยืนหยัดและราชอาณาจักรของพระองคคงอยูครบถวน"
 NOR_the_glucksburg_sea_wall: "กําแพงทะเลกลึคสบวรก"
 NOR_the_glucksburg_sea_wall_desc: "เคานตแหงยารลสแบรกไดเริ่มกอสรางกําแพงทะเลในนามของราชวงศที่พระเจาฮากุนที่ 7 ผูยิ่งใหญของเราสังกัดอยู คือราชวงศกลึคสบวรก มันจะยืนหยัดเปนตัวแทนแหงพระราชอํานาจของราชวงศ เพื่อสกัดศัตรูและปกปองฟยอรดและขุนเขาของเราจากภยันตราย"
 NOR_shield_of_the_north: "โลแหงแดนเหนือ"
 NOR_shield_of_the_north_desc: "ดาบจะมีประโยชนอะไรหากไมใชมัน? โลจะมีคาอะไรหากไมปกปองราษฎรที่อยูใตมัน? ราชวงศของเราตองปกปองไมเพียงแค [NOR.GetNameDef] แตรวมถึงราชอาณาจักรและดินแดนที่เปนของพระองคตามหนาที่ดวย แมไมจําเปนตองเปนของพระองคโดยนิตินัยก็ตาม"
 NOR_our_royal_claims: "การอางสิทธิ์ของราชวงศ"
 NOR_our_royal_claims_desc: "[NOR_GetOurRoyalClaimsDesc]"
 NOR_our_royal_claims_desc_king: "เราโชคดีที่มีกษัตริยผูถอมพระองค ผูทรงปฏิเสธการอางสิทธิ์ใด ๆ เหนือดินแดนนอกเขตอํานาจปจจุบันของพระองค และเราโชคดียิ่งกวาที่มีเคานตเพเดอร อังเคอร เวเดล-ยารลสแบรกผูเปนที่รัก ผูพรอมทําทุกอยางเพื่อผลักดันการอางสิทธิ์เหลานี้และนําดินแดนเขาสูราชอาณาจักรของเรา ใหเราสูเพื่อแผนดินของกษัตริย!"
 NOR_our_royal_claims_desc_queen: "นาเสียดายที่พระเจาฮากุนที่ 7 ไมไดอยูกับเราอีกตอไป แตเราตองระลึกถึงมรดกที่พระองคทรงทิ้งไว ซึ่งรวมถึงการอางสิทธิ์มากมายทั่วยุโรป และเราโชคดียิ่งกวาที่มีสมเด็จพระราชินีมาทิลเดอที่ 1 ผูเปนที่รัก ผูไมเพียงมีการอางสิทธิ์ของพระองคเอง แตยังพรอมทําทุกอยางเพื่อผลักดันการอางสิทธิ์เหลานี้และนําดินแดนเขาสูราชอาณาจักรของเรา ใหเราสูเพื่อแผนดินของราชบัลลังก!"

 NOR_swedish_claims: "อางสิทธิ์เหนือสวีเดน"
 NOR_swedish_claims_desc: "[NOR_GetSwedishClaimsDesc]"
 NOR_swedish_claims_desc_mon: "ประวัติศาสตรและราชวงศของเราผูกพันกับ [SWE.GetNonIdeologyName] อยางไมเต็มใจ ระหวางการผลัดกันไดเสียที่ยาวนานหลายศตวรรษ ชาว[SWE.GetAdjective]ไดขโมยผืนแผนดินกวางใหญไป ไดแก เยมตลันด แฮรเยดาเลน และบูฮุสแลน ไมสําคัญวาราชวงศแบรนาด็อต วาซา โอลเดนบวรก หรือใครอื่นจะเปนผูผิด เราจะแกแคนและเอาดินแดนของเราคืน"
 NOR_swedish_claims_desc_fas: "ประวัติศาสตรของสถาบันกษัตริยในสแกนดิเนเวียยาวนานและยุงเหยิงสับสน แตเราสามารถใชมันใหเปนประโยชนได สวีเดนไดขโมยทั้งภูมิภาคที่เคยเปนของชาติเราไป เราสามารถใชการแกแคนเปนขออางในการรุกราน[SWE.GetAdjective] และขยายจักรวรรดิของเราใหเปนการรวมดินแดน[NOR.GetAdjective]ในประวัติศาสตร"
 NOR_claims_on_faroe_islands: "อางสิทธิ์เหนือหมูเกาะแฟโร"
 NOR_claims_on_faroe_islands_desc: "[NOR_GetFaroeClaimsDesc]"
 NOR_claims_on_faroe_islands_desc_PAWJ: "ผลจากการลวงละเมิดในอดีตของสถาบันกษัตริยแหง [DEN.GetNonIdeologyName] และ [SWE.GetNonIdeologyName] ทําใหเราถูกพรากหมูเกาะแฟโรไป นั่นจะจบลงแลว สมุหราชมนเทียรผูสูงศักดิ์ของเราจะจายคาเลือดเพื่อใหมั่นใจวาหมูเกาะนี้จะกลับคืนสูเรา"
 NOR_claims_on_faroe_islands_desc_ALT: "ผลจากการลวงละเมิดในอดีตของสถาบันกษัตริยแหง [DEN.GetNonIdeologyName] และ [SWE.GetNonIdeologyName] ทําใหเราถูกพรากหมูเกาะแฟโรไป นั่นจะจบลงแลว สมเด็จพระราชินีมาทิลเดอที่ 1 ผูทรงคุณธรรมของเรา จะทรงจายคาเลือดเพื่อใหมั่นใจวาหมูเกาะนี้จะกลับคืนสูเรา"
 NOR_eirik_raudes_land: "ดินแดนแอริกผูแดง"
 NOR_eirik_raudes_land_desc: "คําตัดสินอันไรสาระของกรุงเฮกในป 1933 ตองถูกพลิกกลับ พวกเขากลาดีอยางไรที่ยกดินแดนที่แอริกผูแดง ชาวนอรเวย คนพบเมื่อพันปกอนให [DEN.GetName] เมื่อไมกี่ปกอนเรายังเปนเจาของชายฝงตะวันออกของกรีนแลนดบางสวน แตอีกไมนานเราจะยึดสวนนั้นและมากกวานั้น มรดกของแอริกผูแดงจะสืบตอไปเมื่อเรายึดสิ่งที่เปนของเราคืน"
 NOR_iceland: "ไอซแลนด"
 NOR_iceland_desc: "[NOR_GetIcelandClaimDesc]"
 NOR_iceland_desc_PAWJ: "หลังการสลายตัวของสหภาพคาลมาร ไอซแลนดถูกพรากไปจากเราอยางไมเปนธรรม แมจะผานมาหลายศตวรรษแลว แตเราไมเคยลืม สมุหราชมนเทียร กษัตริย และเจาชายของเราจะไมหลับใหลจนกวาเรื่องนี้จะไดรับการแกไข และไอซแลนดกลับมาเปนสวนหนึ่งของราชอาณาจักรนอรเวยอีกครั้ง"
 NOR_iceland_desc_ALT: "หลังการสลายตัวของสหภาพคาลมาร ไอซแลนดถูกพรากไปจากเราอยางไมเปนธรรม แมจะผานมาหลายศตวรรษแลว แตเราไมเคยลืม สมเด็จพระราชินี เจาชาย และประชาชนที่ทั้งสองพระองคปกครองจะไมหลับใหลจนกวาเรื่องนี้จะไดรับการแกไข และไอซแลนดกลับมาเปนสวนหนึ่งของราชอาณาจักรนอรเวยอีกครั้ง"
 NOR_bjarmeland: "บยารเมลันด"
 NOR_bjarmeland_desc: "นักสํารวจ[ROOT.GetAdjective]ไดขยายขอบเขตของสิ่งที่เปนไปไดและไปถึงไดมาหลายศตวรรษ หนึ่งในนั้นคือบยารเมลันด ซึ่งชาว[NOR.GetAdjective]เปนผูสํารวจเปนกลุมแรก แตบัดนี้หลุดพนจากเงื้อมมือเราไป เราตองยื่นมือออกไปควาดินแดนนี้มาเปนของเราอีกครั้ง"
 NOR_claims_on_denmark: "อางสิทธิ์เหนือเดนมารก"
 NOR_claims_on_denmark_desc: "[NOR_GetDanishClaimsDesc]"
 NOR_claims_on_denmark_desc_mon: "เดนมารกอาจเปนดินแดนที่กษัตริยผูเปนที่รักของเราเคยเรียกวาบาน แตเรารูวาบานที่แทจริงของพระองคคือ [NOR.GetNonIdeologyName] เสมอมา แมกระทั่งกอนที่พระองคจะไดรับเลือกขึ้นครองราชย อยางไรก็ตาม เราตองนําประเทศเดิมของพระองคเขาสูราชอาณาจักรของพระองค บางทีนั่นอาจกระตุนใหพระองคทรงมีบทบาทในรัฐบาลแหงสถาบันกษัตริยของเรามากขึ้น"
 NOR_claims_on_denmark_desc_fasc: "กษัตริยแหง [DEN.GetNonIdeologyName] เคยเปนเจานายของเรา แตจะไมมีอีกแลว บัดนี้พวกเขาออนแอและไรความสําคัญ แผนดินนั้นจึงรอใหเราเขายึด ดวยพลังใหมของเรา กองทัพของพวกเขาจะรวนแตกเหมือนขนมคุกกี้เนยในมือเด็ก!"
 NOR_consolidate_kingdom: "รวมราชอาณาจักรใหมั่นคง"
 NOR_consolidate_kingdom_desc: "[GetConsolidateKingdomDesc]"
 NOR_consolidate_kingdom_desc_PAWJ: "เมื่อมารควิสเพเดอร อังเคอร เวเดล-ยารลสแบรกผูมีพระคุณ สมุหราชมนเทียรและมือขวาของพระเจาฮากุนที่ 7 ผูเปนที่รักของเรา ไดขยายดินแดนของราชบัลลังกแลว เราตองหันมามองภายในเพื่อรวบรวมสิ่งที่ไดมาใหมั่นคง และปกครองราษฎรดวยมือที่ปดทองและมั่นคง แมจะเขมงวดอยูบาง"
 NOR_consolidate_kingdom_desc_alt: "เมื่อสมเด็จพระราชินีมาทิลเดอที่ 1 ผูทรงชอบธรรมของเรา ทรงดูแลดินแดนอันกวางใหญของราชบัลลังกอยางทุมเท เราตองหันมามองภายในเพื่อรวบรวมสิ่งที่ไดมาใหมั่นคง และปกครองราษฎรดวยถุงมือกํามะหยี่และมือที่มั่นคง"
 
## The Rest 
 NOR_start_rearmament: "เริ่มการติดอาวุธใหม"
 NOR_start_rearmament_desc: "บางทีการลดอาวุธทั้งหมดอาจไมใชหนทางที่แนนอนในการหลีกเลี่ยงสงครามอยางที่เราหวัง เราควรเริ่มเตรียมพรอมรับการโจมตีที่อาจเกิดขึ้นตอแผนดินของเรา"
 NOR_kickstart_military_industry: "ปลุกอุตสาหกรรมทหาร"
 NOR_kickstart_military_industry_desc: "[ROOT.GetName] ตกเปนรัฐในอารักขาของชาติอื่นมาเปนเวลานาน จึงไมเคยพัฒนาอุตสาหกรรมทหารภายในประเทศ เพื่อปกปองอิสรภาพของเรา เราตองเลิกพึ่งพาประเทศอื่นในการผลิตเพื่อการปองกัน และเริ่มสรางเครื่องจักรสงครามของเราเอง"
 NOR_build_supplies_network: "สรางเครือขายเสบียง"
 NOR_build_supplies_network_desc: "ขุนเขา ทะเลสาบ และฟยอรดอันงดงามจับใจของเราเปนที่อิจฉาของทั่วโลก แตก็ทําใหการขนสงเสบียงยากลําบาก เราตองทุมเทความพยายามอยางจริงจังเพื่อใหเสบียงไปถึงแนวหนาไดเร็วขึ้น"
 NOR_drobak_coastal_fort: "ปอมชายฝงเดรอบัก"
 NOR_drobak_coastal_fort_desc: "เดรอบัก หรือใหเจาะจงคือชองแคบเดรอบัก อาจเปนกุญแจสําคัญในการปกปองเมืองหลวงของเรา ไมมีใครรูวาเมื่อใดที่ตอรปโดซึ่งวางตําแหนงไวดีจะถวงเวลาการรุกรานไดนานพอใหเราเตรียมการตอบโต"
 NOR_modernize_fortifications: "ปรับปรุงปอมปราการใหทันสมัย"
 NOR_modernize_fortifications_desc: "บางคนเรียกปอมปราการของเราวา 'ยุคนโปเลียน' ซึ่งในบริบทนี้ไมใชคําชมเลยแมแตนอย บังเกอรของเราอาจเกาแก แตอาวุธของศัตรูไมใช ความพยายามและทรัพยากรที่ใชยกระดับปอมของเราใหทัดเทียมจะคุมคาในอนาคตแนนอน" 
 NOR_artillery_development: "พัฒนาปนใหญ"
 NOR_artillery_development_desc: "มหาสงครามไดพิสูจนความสําคัญของปนใหญ เราไมอาจปลอยใหตัวเองลาหลังไปมากกวาที่เปนอยู มิฉะนั้นเราอาจไรพลังตอกระสุนปนใหญของศัตรู"
 NOR_anti_air_support: "การสนับสนุนตอสูอากาศยาน"
 NOR_anti_air_support_desc: "ไมวาผูรุกรานจะมาจากที่ใด สิ่งหนึ่งที่แนนอนคือพวกเขาจะพยายามใชเครื่องบินครองนานฟาและทิ้งระเบิดเมืองและทหารของเรา เวนแตเราจะตั้งระบบปองกันภัยทางอากาศเพื่อทําลายความพยายามใด ๆ จากทางอากาศ"
 NOR_rikstanken: "ริกสทังเคิน (รถถังแหงชาติ)"
 NOR_rikstanken_desc: "ความจริงอันนาเศราคือ [ROOT.GetName] ไมเคยมีรถถังมากอน หากเราหวังจะมีโอกาสชนะ ยานเกราะเปนสิ่งที่ตองมี คําถามคือ เราควรใชแนวทางใด? รถถังจํานวนมากอาจเปนขอเสนอที่แพงเกินไปสําหรับประเทศในสถานการณอยางเรา บางทีเราอาจลองหยั่งเชิงดวยรถถังคันเดียว? หรือบางที เราอาจเสียสละสิ่งอื่นนอกเหนือจากเงินเพื่อรถถังของชาติ"
 NOR_tank_procurement: "จัดหารถถัง"
 NOR_tank_procurement_desc: "โครงการรถถังภายในประเทศของเราไมเพียงพอสําหรับสงครามยานเกราะแหงศตวรรษที่ 20 อยางเห็นไดชัด ขอดีคือหลายประเทศที่มีความเชี่ยวชาญและปริมาณการผลิตที่จําเปนอาจเปดขายยานเกราะของตน ซึ่งจะเปนทางลัดชั้นยอดในการนํากองทัพ[ROOT.GetAdjective]เขาสูศตวรรษนี้"
 NOR_norges_rikstanksfabrikk: "โรงงานรถถังแหงชาตินอรเวย"
 NOR_norges_rikstanksfabrikk_desc: "เมื่อเราเรียนรูพื้นฐานของสงครามยานเกราะแลว เราพรอมที่จะพัฒนาโครงการผลิตรถถังแหงชาติของเราเอง หรือริกสทังกสฟาบริกก นี่คือหนทางเดียวที่จะรับประกันการสงยานเกราะอยางไมขาดสาย"
 NOR_improve_production_lines: "ปรับปรุงสายการผลิต"
 NOR_improve_production_lines_desc: "ความกลาหาญในการปกปองประเทศไรความหมาย หากเราไมสามารถจัดหาอาวุธและยุทโธปกรณใหสูตอไปได สงครามสมัยใหมคือเรื่องของการมีกระสุนไวตอบโต ใหเรามั่นใจวาเราผลิตมันไดเร็วเทาที่เรายิงออกไป"
 NOR_the_royal_guards_battalion: "กองพันราชองครักษ"
 NOR_the_royal_guards_battalion_desc: "ระยะหนึ่งแลวที่ราชองครักษเปนกองกําลังรบชั้นยอดที่สุดของเรา เราสามารถขยายโครงการนี้และพัฒนาการฝกของพวกเขา เพื่อใหเปนกองหนาของกองทัพเรา"
 NOR_expand_Haeren: "ขยายกองทัพบก (แฮเริน)"
 NOR_expand_Haeren_desc: "กําลังภาคพื้นดินปจจุบันของเราดอยกวากองทัพอื่นในทวีปอยางเทียบไมติด [ROOT.GetName] ไมเคยเปนชาติที่นิยมทหารเลย ขณะที่ภัยสงครามโลกเพิ่มขึ้น เราตองมั่นใจวาประชาชนพรอมปกปองชาติอันเยาววัยของเรา"
 NOR_improved_weapons: "ปรับปรุงอาวุธ"
 NOR_improved_weapons_desc: "ยุทโธปกรณที่กําลังภาคพื้นดินของเราใชอยูในสภาพนาเวทนา นี่คือความประมาทเลินเลอที่ยอมรับไมไดและอาจทําใหเราเสียเอกราช เราตองเรงพลิกแนวโนมนี้ในขณะที่ยังทําได"
 NOR_building_an_independent_norway: "สรางนอรเวยที่เปนเอกราช"
 NOR_building_an_independent_norway_desc: "ชาติ[ROOT.GetAdjective]ในรูปแบบเอกราชปจจุบันเพิ่งดํารงอยูตั้งแตป 1905 จึงยังมีงานสรางชาติอีกมากที่ตองทํา โดยเฉพาะดานอุตสาหกรรม ซึ่งจะสําคัญยิ่งตอเอกราชของเรา"
 NOR_independent_norway_removal_tt: "§Y$NOR_independent_norway_dmod$§! §Rจะถูกลบออกหาก [ROOT.GetNonIdeologyName] กลายเปนรัฐในอารักขาของชาติอื่น!§!"
 NOR_norwegian_school_of_economics: "วิทยาลัยเศรษฐศาสตรนอรเวย "
 NOR_norwegian_school_of_economics_desc: "หากเราหวังจะตั้งหลักในเศรษฐกิจโลก จําเปนตองมีความเชี่ยวชาญ และสิ่งนั้นตองใชเวลาสราง การกอตั้งนอรเกส ฮันเดลสเฮยสโกเลเปนวิทยาลัยเศรษฐศาสตรแหงชาติคือกาวแรกที่จะทําใหอุตสาหกรรมพลเรือน และตอมาอุตสาหกรรมทหาร เจริญรุงเรือง"
 NOR_hurtigruten: "ฮูรทิกรูเทิน"
 NOR_hurtigruten_desc: "ปฏิเสธไมไดวา [ROOT.GetNonIdeologyName] ไมเพียงเปนประเทศที่ยาวผิดปกติ แตยังมีภูมิประเทศที่ยากลําบากรอบดาน สิ่งนี้หลอหลอมอัตลักษณของชาติเราอยางแนนอน แตก็ทําใหไมอาจสรางโครงสรางพื้นฐานและทางรถไฟไดอยางเหมาะสม เราตองจัดตั้งฮูรทิกรูเทินเปนทางแก ซึ่งเปนเครือขายเรือเฟอรรีขนสงผูคนและสินคาไปตลอดแนวชายฝง[ROOT.GetAdjective]"
 NOR_norges_tekniske_hogskole: "สถาบันเทคโนโลยีนอรเวย"
 NOR_norges_tekniske_hogskole_desc: "กวาสองทศวรรษที่สถาบันเทคโนโลยีนอรเวยในทรอนดเฮมเปนแนวหนาดานวิศวกรรมของประเทศ แตหากเราหวังจะแขงขันกับเพื่อนบานและอาจรวมถึงศัตรู จําเปนตองเพิ่มเงินทุนใหการศึกษาดานเทคนิค เราไมอาจปลอยใหอุตสาหกรรมของเราขาดความเชี่ยวชาญที่จําเปน"
 NOR_empower_large_industrial_groups: "เสริมอํานาจกลุมอุตสาหกรรมขนาดใหญ "
 NOR_empower_large_industrial_groups_desc: "วิสาหกิจอุตสาหกรรมขนาดใหญมีผลงานที่พิสูจนแลวในการสรางและดูแลโรงงาน ผลิตสิ่งจําเปนในชีวิตประจําวันของพลเมือง[ROOT.GetAdjective]ทั่วไป การไววางใจพวกเขายอมเปนหนทางที่ถูกตองสูเสนทางความเปนอิสระทางอุตสาหกรรมของ [ROOT.GetNonIdeologyName]"
 NOR_fund_local_construction: "สนับสนุนการกอสรางทองถิ่น"
 NOR_fund_local_construction_desc: "เราไมอาจปลอยใหการพัฒนาอุตสาหกรรมกระจุกอยูในเมืองหลวงและเมืองใหญไมกี่แหง ความกาวหนาควรครอบคลุมทั่วทั้ง [ROOT.GetName] ใหสมํ่าเสมอที่สุดเทาที่ทําได ดังนั้นใหเราลงทุนในเมืองเล็กและเมืองขนาดยอมเพื่อกระตุนการกอสรางทองถิ่น เพื่อฐานอุตสาหกรรมที่หลากหลายและเศรษฐกิจที่แข็งแกรงยิ่งขึ้น"
 NOR_aluminum_production: "การผลิตอะลูมิเนียม"
 NOR_aluminum_production_desc: "การผลิตอะลูมิเนียมเปนกระบวนการที่ใชพลังงานสูงมาก และแมเราจะไมมีแหลงแรบอกไซต แตภูมิประเทศ[ROOT.GetAdjective]เหมาะอยางยิ่งตอการผลิตไฟฟาพลังนํ้า เราจึงสามารถนําเขาบอกไซตและแปรรูปเปนทรัพยากรอันมีคาสําหรับอุตสาหกรรมทหารที่เพิ่งตั้งไขของเราไดอยางงายดาย"
 NOR_build_the_northern_rail: "สรางทางรถไฟสายเหนือ"
 NOR_build_the_northern_rail_desc: "ภาคเหนือของประเทศเราถูกละเลยมานานเกินไป แมภูมิประเทศจะทําใหการสรางโครงสรางพื้นฐานเปนงานที่ซับซอน แตเราแนใจวาความพยายามนี้จะใหผลตอบแทนในอนาคต"
 NOR_complete_the_sourthern_railway_network: "สรางเครือขายทางรถไฟภาคใตใหสมบูรณ"
 NOR_complete_the_sourthern_railway_network_desc: "แมภาคใตของ [ROOT.GetNonIdeologyName] จะพัฒนากวาภาคเหนือหลายเทา แตหากเริ่มเปรียบเทียบโครงสรางพื้นฐานกับของประเทศอื่น แมแตประเทศเพื่อนบาน ก็เห็นไดชัดวายังมีอีกมากที่ตองทํา"
 NOR_increase_research_funding: "เพิ่มเงินทุนวิจัย"
 NOR_increase_research_funding_desc: "[ROOT.GetName] ยังไมเคยเปนขุมพลังทางเทคโนโลยี เราตองลงทุนในการวิจัยใหม ๆ หากหวังจะตามสวนอื่นของยุโรปใหทัน มิฉะนั้นเราอาจตองพึ่งพาศัตรูในอนาคต"
 NOR_expand_norges_tekniske_hogskole: "ขยายสถาบันเทคโนโลยีนอรเวย"
 NOR_expand_norges_tekniske_hogskole_desc: "ดวยความขัดแยงขนาดใหญที่ดูเหมือนจะกอตัวอยูที่ขอบฟา เราจะตองขยายขนาดสถาบันเทคนิคของเราเพื่อรองรับความตองการของสงครามที่ซับซอนขึ้นเรื่อย ๆ"
 NOR_revamp_hydroelectric_capacity: "ปรับปรุงกําลังผลิตไฟฟาพลังนํ้า"
 NOR_revamp_hydroelectric_capacity_desc: "อะลูมิเนียมมีความสําคัญยิ่งตอการสรางเครื่องบินและเครื่องมือสงครามอื่น ๆ แตพลังงานที่ตองใชในการแปรรูปบอกไซตเปนอะลูมิเนียมทําใหกระบวนการนี้มีตนทุนสูง โชคดีที่ [NOR.GetName] มีภูมิประเทศสมบูรณแบบสําหรับเปลี่ยนทะเลสาบและแมนํ้ามากมายเปนเขื่อนไฟฟาพลังนํ้า เราจึงผลิตอะลูมิเนียมที่ตองการไดแมไมมีแหลงบอกไซตขนาดใหญ"
 NOR_haerens_flyvevaaben: "แฮเรนส ฟลีเวเวาเบิน (กองบินทหารบก)"
 NOR_haerens_flyvevaaben_desc: "พรมแดนใหมของสงครามอยูบนทองฟา หากเราปลอยใหศัตรูควบคุมนานฟาของเราไดทั้งหมด กําลังภาคพื้นดินของเราจะปฏิบัติการไดไมมีประสิทธิภาพ เราตองพัฒนากองทัพอากาศที่ปฏิบัติการเพื่อสนับสนุนทหารภาคพื้นดินได"
 NOR_norwegian_planes: "เครื่องบินนอรเวย "
 NOR_norwegian_planes_desc: "เราไดเห็นแลววาพันธมิตรวันนี้อาจเปนผูรุกรานในวันพรุง ดวยเหตุนี้เราจึงไมอาจพึ่งพามหาอํานาจตางชาติสําหรับเครื่องบินของเรา ความสําคัญของมันในสนามรบสมัยใหมนั้นมากเกินไป"
 NOR_foreign_plane_designs: "แบบเครื่องบินตางชาติ"
 NOR_foreign_plane_designs_desc: "ในฐานะชาติอันเยาววัยที่ถูกละเลยมานาน [ROOT.GetName] ไมมีโครงสรางพื้นฐาน ความรู หรือเครื่องมือในการออกแบบและผลิตแสนยานุภาพทางอากาศที่การรบสมัยใหมตองการ เราตองหันไปพึ่งตลาดอาวุธนานาชาติเพื่อจัดหากําลังทางอากาศให [NOR.GetName]"
 NOR_anti_air_artillery_research: "วิจัยปนตอสูอากาศยาน"
 NOR_anti_air_artillery_research_desc: "ขณะที่เทคโนโลยีใหม ๆ ถูกนํามาใชบนทองฟาเหนือเรา อาวุธที่ใชปองกันนานฟาจากภาคพื้นดินก็ตองตามใหทัน เพื่อไมใหเราพายแพตอความเปนเจาเวหาของศัตรู"
 NOR_anti_air_construction: "กอสรางระบบตอสูอากาศยาน"
 NOR_anti_air_construction_desc: "ภูมิประเทศอันขรุขระทําให [NOR.GetName] เปนเปาหมายที่ยากตอการรุกรานของศัตรู แตทองฟาของเรากลับเปดโลงตอเครื่องบินขาศึก ซึ่งกลายเปนความไดเปรียบสําหรับการรุกรานจากตางชาติ เราตองสรางฐานปนตอสูอากาศยานที่จําเปนเพื่อปองกันเรื่องนี้"
 NOR_invest_in_airfields: "ลงทุนในสนามบิน "
 NOR_invest_in_airfields_desc: "ไมมีประโยชนที่จะมีเครื่องบินหากเราไมมีโครงสรางพื้นฐานที่จําเปนในการสงมันขึ้นบิน เราขาดแคลนโครงสรางพื้นฐานที่จําเปนตอความตองการของกองทัพอากาศที่กําลังขยายตัวอยางหนัก"
 NOR_stavanger_airfield: "สนามบินสตาวังเงร"
 NOR_stavanger_airfield_desc: "ทาอากาศยานสตาวังเงรใกลจะสรางเสร็จแลว และทําเลนี้เหมาะอยางยิ่งสําหรับสนามบินทหาร เราสามารถปรับปรุงที่จําเปนเพื่อใชทาอากาศยานพลเรือนแหงนี้เปนฐานทัพอากาศ"
 NOR_increase_air_production: "เพิ่มการผลิตอากาศยาน "
 NOR_increase_air_production_desc: "[NOR.GetName] ตองการเครื่องบิน และตองการเดี๋ยวนี้! หากเราทุมความพยายามไปที่การผลิตเครื่องบิน เราก็อาจปองกันตนเองและฝาแนวปองกันของศัตรูไปได"
 NOR_buy_aa_from_sweden: "ซื้อปนตอสูอากาศยานจากสวีเดน "
 NOR_buy_aa_from_sweden_desc: "เพื่อนบานทางตะวันออกของเรา [SWE.GetName] เปนเลิศในการผลิตปนตอสูอากาศยานมานาน เหนือกวาสิ่งใดที่เราผลิตไดมาก เราอาจติดตอขอซื้อปนโบฟอรสเหลานี้เพื่อปกปองนานฟาของเราระหวางการรุกรานที่ใกลเขามา"
 NOR_luftforsvaret: "$NOR_royal_air_force_dmod$"
 NOR_luftforsvaret_desc: "ถึงเวลาที่กองทัพอากาศของเราจะเลิกเปนเพียงหนวยสนับสนุนกองทัพภาคพื้นดิน และพัฒนาเปนเหลาทัพของตนเอง ที่มีทรัพยากรจําเปนในการดําเนินปฏิบัติการทั้งหมดที่การรบสมัยใหมตองการไดอยางมีประสิทธิภาพ"
 NOR_radar_research: "วิจัยเรดาร"
 NOR_radar_research_desc: "ในฐานะประเทศที่มีแนวชายฝงกวางใหญ การเฝาระวังอยางมีประสิทธิภาพจึงเปนสิ่งสําคัญยิ่ง ดวยปาฏิหาริยทางเทคโนโลยีอยางเรดาร เราจะรูถึงเรือและเครื่องบินที่กําลังเขามาไดจากระยะไกลขึ้น"
 NOR_repurpose_lighthouses: "ดัดแปลงประภาคาร"
 NOR_repurpose_lighthouses_desc: "สภาพอากาศและธรณีวิทยาทําใหประภาคารตลอดชายฝง[ROOT.GetAdjective]เปนสิ่งจําเปน และกลายเปนสัญลักษณของชาติเรา เราสามารถเปลี่ยนมันใหเปนประภาคารแหงความหวัง ดวยการใชติดตั้งอุปกรณเรดารและชวยเราขับไลผูรุกราน"
 NOR_pilot_training: "ฝกนักบิน "
 NOR_pilot_training_desc: "แมกองทัพอากาศที่เพิ่งตั้งไขของเราจะเล็กและดอยพัฒนา แตเราสามารถดึงประเพณีของนักบินและนักสํารวจมาสรางแรงบันดาลใจแกนักบิน[NOR.GetAdjective]รุนใหม ผูจะรักษาเอกราชของเราใหคงอยูตอไป"
 NOR_the_royal_norwegian_navy: "$NOR_royal_navy_dmod$"
 NOR_the_royal_norwegian_navy_desc: "การมีแนวชายฝงยาวที่สุดแหงหนึ่งของโลกมีขอไดเปรียบ แตก็หมายความวาตองทุมเทความพยายามมากขึ้นในการปกปอง กองทัพเรือของเราจะเปนแนวปองกันดานแรกของชาติ "
 NOR_expand_the_dockyards: "ขยายอูตอเรือ"
 NOR_expand_the_dockyards_desc: "แมเราจะมีกองเรือพาณิชยใหญที่สุดแหงหนึ่งของโลก แตกําลังการผลิตของอูตอเรือยังขยายไดอีกแนนอน และปรับใหเหมาะกับการผลิตเรือรบไดดีขึ้น แทนที่จะผลิตเพียงเรือสินคาและเรือบรรทุกนํ้ามัน"
 NOR_battleship_focus: "มุงเนนเรือประจัญบาน "
 NOR_battleship_focus_desc: "มีเพียงเรือหุมเกราะมหึมาเทานั้นที่จะรับประกันไดวาเราครองทองทะเลอยางแทจริง ภัยคุกคามจากการเห็นเรือประจัญบานของเราที่ชายฝงของตนจะยับยั้งผูรุกรานที่อาจเกิดขึ้นได"
 NOR_kystvakten: "ชีสตวักเทิน (หนวยยามฝง)"
 NOR_kystvakten_desc: "เพื่อปกปองชายฝงอันกวางใหญของเรา จําเปนตองมีจํานวนมากพอที่จะมองเห็นไดทุกตารางนิ้วของขอบฟา ใหเราสรางเครือขายเรือที่จะคุมกันแผนดินของเราจากเรือขาศึก"
 NOR_convert_merchant_ships: "ดัดแปลงเรือสินคา"
 NOR_convert_merchant_ships_desc: "กองเรือพาณิชยคือความภาคภูมิใจของเศรษฐกิจเรา แตจะไมมีประโยชนอะไรหากผูรุกรานทําลายแผนดินของเรา เจาสัวการเดินเรือจะตองเสียสละเพื่อ [ROOT.GetName] และใหเราดัดแปลงเรือเหลานี้ใหพรอมรบ"
 NOR_expand_merchant_marine: "ขยายกองเรือพาณิชย"
 NOR_expand_merchant_marine_desc: "สงครามสมัยใหมตองการทรัพยากรและยุทโธปกรณ สองสิ่งที่ [ROOT.GetName] ขาดแคลนอยางหนัก ขณะที่สงครามใกลเขามา เราตองมั่นใจวามีเรือมากพอจะขนทุกสิ่งที่จําเปนตอการอยูรอด ใช เรามีเรือพลเรือนมากกวาชาติสวนใหญอยูแลว แตเราคาดวาจะสูญเสียไปมากระหวางทาง และเราไมอาจปลอยใหขาดแคลนได"
 NOR_expand_naval_academy: "ขยายโรงเรียนนายเรือ"
 NOR_expand_naval_academy_desc: "เรือที่มากขึ้นหมายความวาเราตองการนายทหารมากขึ้นเพื่อนําเรือเขาสูการรบ โรงเรียนนายเรือของเราเพียงพอมาหลายป แตเมื่อกองทัพเรือขยายตัว การผลิตนายทหารและกะลาสีก็ตองขยายตามดวย"
 NOR_norwegian_carriers: "เรือบรรทุกเครื่องบินนอรเวย"
 NOR_norwegian_carriers_desc: "เราไดเห็นครั้งแลวครั้งเลาวาอนาคตของสงครามขึ้นอยูกับการควบคุมนานฟาอยางมาก แมแตในทะเล เรือบรรทุกเครื่องบินจะชวยใหเราครองทองฟาเหนือเรือขาศึกและเอาชนะพวกมันไดอยางรวดเร็ว"
 NOR_mine_laying_effort: "ภารกิจวางทุนระเบิด"
 NOR_mine_laying_effort_desc: "เรือของเราไมอาจอยูทุกที่พรอมกันได แตทุนระเบิดชวยใหเราครอบคลุมนานนํ้าไดมากขึ้นและทําใหผูบังคับการเรือของศัตรูไมอาจมั่นใจในความปลอดภัย เราตองการทุนระเบิดที่ดีกวาเพื่อเอาชนะเทคนิคลาสุดในการหลบหลีกและปลดชนวนทุนระเบิด"
 NOR_submarine_fleet: "กองเรือดํานํ้า"
 NOR_submarine_fleet_desc: "ดวยประสิทธิภาพและการลองหน เรือดํานํ้าสามารถพลิกกระแสสงครามทางทะเลไดทีละตอรปโด เราตองสรางเรือดํานํ้าใหมากขึ้นและดีขึ้นหากหวังจะเพิ่มโอกาสใหสูงสุด"
 NOR_naval_air_force: "กองบินนาวี"
 NOR_naval_air_force_desc: "เครื่องบินของเราอาจเปนตัวตัดสินระหวางกองเรือที่สนับสนุนการรุกราน [ROOT.GetName] กับนานนํ้าอันสงบนอกชายฝงของเรา หากเราครองทองฟาเหนือทะเลได เราก็จะครองทองทะเลไดอีกครั้ง"
 NOR_convoy_defense: "การปองกันขบวนเรือลําเลียง"
 NOR_convoy_defense_desc: "อัญมณีแหงชาติของเราคือกองเรือพาณิชยขนาดมหึมา นี่คือเหตุที่เราไมอาจปลอยใหมันสูญเปลา เราตองปรับปรุงการปองกันเพื่อใหมันคงอยูและสงผลตอสงครามไดมากขึ้น"
 NOR_nortraship: "นอรทราชิป"
 NOR_nortraship_desc: "เมื่อสงครามทําใหเราตองลี้ภัยจากประเทศของตนเอง เราตองรวมการเดินเรือไวภายใตธงเดียว นอรทราชิปจะชวยใหเราสนับสนุนการทําสงครามจากแดนไกล และชวยใหพันธมิตรอยูรอดนานพอที่จะชวยเรากลับคืนสู [ROOT.GetName]"
 NOR_convoy_bombing: "ทิ้งระเบิดขบวนเรือลําเลียง"
 NOR_convoy_bombing_desc: "ยิ่งกองเรือพาณิชยของศัตรูเล็กลงเทาใด กองเรือมหึมาของเราก็ยิ่งสงผลมากขึ้นเทานั้น หากเราบอนทําลายการเดินเรือของพวกเขาได เราก็พลิกกระแสสงครามได"
 NOR_rebuild_the_royal_navy: "สรางราชนาวีขึ้นใหม"
 NOR_rebuild_the_royal_navy_desc: "เราอยูหางไกลจากประเทศของเรา การกลับไปอีกครั้งจึงนาจะตองเปนทางทะเล การสรางราชนาวีขึ้นใหมจึงเทากับการสรางชาติของเราขึ้นใหม"

 NOR_pan_germanic_entent: "ความตกลงแพนเจอรแมนิก"

 NOR_emergency_conversions: "ดัดแปลงเรือสินคา"
 NOR_emergency_conversions_desc: "เรามีกองเรือพาณิชยขนาดมหึมา แตพวกเขาตองเสี่ยงอยางยิ่งในการแลนผานทะเลอันตราย เราควรดัดแปลงเรือขนาดเล็กจํานวนหนึ่ง ติดอาวุธเบา และใหคุมกันการเดินเรือที่เปราะบางของเรา เราสามารถปรับปรุงเรือเหลานี้สําหรับภารกิจเฉพาะทางเพิ่มเติมในภายหลังไดเสมอหากจําเปน"
 NOR_emergency_conversions_tt: "ปลดล็อก §Yการตัดสินใจ§! เพื่อแปลง §Yขบวนเรือลําเลียง§! เปน §Yเรือพิฆาต§!"

