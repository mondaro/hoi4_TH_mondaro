 NORDIC_nordic_industry: "[NORDIC_get_nordic_industry_name]"
 NORDIC_nordic_industry_desc: "[NORDIC_get_nordic_industry_desc]"
 NORDIC_nordic_industry_desc_dem: "ไมวาจะมีสงครามหรือไม ชาติของเราตองสรางโครงสรางพื้นฐานและทุนที่จําเปนเพื่อรองรับประชากรพลเรือนและยกระดับคุณภาพชีวิต และแนนอนวาเมื่อยามสงครามมาถึง สิ่งนี้จะเปนรากฐานสําคัญของเศรษฐกิจสงครามของเรา"
 NORDIC_nordic_industry_desc_com: "แรงงานคือเลือดเนื้อของ [NORDIC_get_alliance_name] และคือเหตุผลแหงการดํารงอยู ดวย [NORDIC_get_nordic_industry_name] เราจะรับประกันการมีสวนรวมในปจจัยการผลิตสินคาเพื่อชีวิตประจําวัน และในยามสงครามก็สนับสนุนเครื่องจักรสงครามของเรา"
 NORDIC_nordic_industry_desc_mon: "หลักการ Noblesse Oblige (ความรับผิดชอบของผูสูงศักดิ์) กําหนดใหเราตองดูแลราษฎร และสรางโครงสรางพื้นฐานที่ไมเพียงไดรับความนิยมจากพวกเขา แตในยามสงครามจะเปนรากฐานของเศรษฐกิจสงครามของเรา [NORDIC_get_nordic_industry_name] จะทําหนาที่นี้จนกวาจะไมจําเปนอีกตอไป"

