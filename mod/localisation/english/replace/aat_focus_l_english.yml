 ICE_expand_the_fishing_industry: "ขยายอุตสาหกรรมประมง"
 ICE_expand_the_fishing_industry_desc: "การประมงเปนสวนสําคัญของวิถีชีวิตชาวไอซแลนดมาโดยตลอด มันคือทรัพยากรธรรมชาติหลักที่เรามีอยางอุดมสมบูรณ เราจึงตองทุมความพยายามไปที่จุดนี้ จงแข็งแกรงขึ้นในดานที่มีศักยภาพอยางแทจริง"
 ICE_mineral_prospecting: "สํารวจแร"
 ICE_mineral_prospecting_desc: "ตามทฤษฎีแลว อาจมีทรัพยากรธรรมชาติซอนอยูในหุบเขา หากเราคนพบมันได ก็จะเปนทางเลือกใหมแทนการประมงและเกษตรกรรมในฐานะอุตสาหกรรมหลักของไอซแลนด"
 ICE_international_trade: "การคาระหวางประเทศ"
 ICE_international_trade_desc: "ไอซแลนดตองมีบทบาทบนเวทีการเงินโลกมากขึ้น ดวยการเปดรับการคาเสรีและเปดประเทศใหกับการลงทุนจากตางชาติ เราจะสรางโอกาสทางการคาไดมากขึ้น และกระตุนเศรษฐกิจใหเติบโตยิ่งขึ้นไปอีก"
 ICE_hydroelectric_power: "พลังงานไฟฟาพลังนํ้า"
 ICE_hydroelectric_power_desc: "หากประเทศนี้มีทรัพยากรอื่นอีกอยาง ก็คือนํ้า ทั้งแมนํ้าและนํ้าพุรอน การขยายการใชประโยชนจากสิ่งเหลานี้จะเปนพลังขับเคลื่อนการสรางอุตสาหกรรมของชาติ"
 ICE_banking_on_the_future: "ฝากอนาคตไวกับธนาคาร"
 ICE_banking_on_the_future_desc: "ภาคการธนาคารเปนภาคสวนที่ไมตองใชทรัพยากรมหาศาล สิ่งที่เราตองทําคือดึงดูดทุนจากตางชาติ ดวยการอุดหนุนภาคการธนาคารและทําทุกวิถีทางใหธนาคารไอซแลนดนาดึงดูดสําหรับนักลงทุน เราจะสถาปนาเกาะแหงนี้เปนศูนยกลางทางการเงินที่จะเก็บเกี่ยวผลประโยชนไปอีกหลายป"
 ICE_infiltration: "การแทรกซึม"
 ICE_infiltration_desc: "การแผขยายเครือขายและผสานเศรษฐกิจของเราเขากับประเทศอื่นยังเปดโอกาสดานอื่นดวย ดวยการสรางสายสัมพันธกับบุคคลและบริษัทสําคัญทั่วโลก ไอซแลนดจะอยูในตําแหนงที่เหมาะจะลวงขอมูลไดทุกรูปแบบ"
 ICE_develop_icelandic_shipping: "พัฒนาการเดินเรือไอซแลนด"
 ICE_develop_icelandic_shipping_desc: "เราคือเกาะ เกาะกลางมหาสมุทร การมุงเนนตอเรือจึงเปนทางเลือกที่ชัดเจนที่สุดเทาที่จะเปนไปได"
 ICE_heavy_industry: "อุตสาหกรรมหนัก"
 ICE_heavy_industry_desc: "เกษตรกรรม การประมง และการเดินเรือเปนเรื่องของอดีต เพื่อผลักดันชาติไปสูอนาคต เราตองมุงเนนอุตสาหกรรมหนัก ดวยการขยายอุตสาหกรรม ไอซแลนดจะมีอนาคตที่สดใส แมจะเต็มไปดวยหมอกควันก็ตาม"
 ICE_advanced_technology: "เทคโนโลยีขั้นสูง"
 ICE_advanced_technology_desc: "เกาะนี้เล็กนัก ไมมีทางแขงขันอยางเทาเทียมกับชาติอุตสาหกรรมขนาดใหญได เราตองหาชองทางเฉพาะของเราแลวเจริญรุงเรืองในนั้น สิ่งที่คอนขางใหม ซึ่งเราไมไดเริ่มตนตามหลังคูแขง เทคโนโลยีขั้นสูงและอิเล็กทรอนิกสคือดานที่เราจะเจริญกาวหนาได"
 ICE_reykjavik_dockyards: "อูตอเรือเรคยาวิก"
 ICE_reykjavik_dockyards_desc: "สิ่งแรกในการสรางกองเรือคืออูเรือที่ทันสมัยและมีจํานวนมากขึ้น งบประมาณของรัฐควรทุมไปที่การขยายขีดความสามารถในการตอเรือกอนสิ่งอื่นใด"
 ICE_expand_the_harbour: "ขยายทาเรือ"
 ICE_expand_the_harbour_desc: "เรือที่มากขึ้นและใหญขึ้นที่เดินทางเขาออกเกาะ หมายความวาเราตองมีทาเรือที่ใหญขึ้น รัฐควรใหทุนขยายทาเรือเรคยาวิก เพื่อใหเราขยายเศรษฐกิจตอไปได"
 ICE_local_arms_industry: "อุตสาหกรรมอาวุธในประเทศ"
 ICE_local_arms_industry_desc: "การผลิตอาวุธยุทธภัณฑในประเทศทําใหเราทั้งสงใหกองกําลังของเราเองและขายในตลาดตางประเทศได ซึ่งหมายความวาเราจะเสริมทั้งขีดความสามารถในการปองกันและเศรษฐกิจไปพรอมกัน อุตสาหกรรมอาวุธของไอซแลนดจึงตองเปนเปาหมายหลักของการลงทุน"
 ICE_infrastructure_development: "พัฒนาโครงสรางพื้นฐาน"
 ICE_infrastructure_development_desc: "การปรับปรุงโครงสรางพื้นฐานใหทันสมัยและสรางระบบขนสงที่ดี จะเปนทางหลวงที่นําประเทศนี้ไปสูความมั่งคั่ง"
 ICE_iceland_air: "ไอซแลนดแอร"
 ICE_iceland_air_desc: "ทุกวันนี้ การเปนเกาะไมไดหมายความวาถูกตัดขาดจากโลกอีกตอไป ดวยอากาศยานสมัยใหม เราจะใกลชิดทั้งทวีปยุโรปและทวีปอเมริกามากขึ้น ทองฟาคือเสนทางเดินเรือแหงวันพรุงนี้"
 ICE_allied_weapons_seller_trigger: "ประเทศที่เปน§Yพันธมิตร§!หรือ§Yเปนกลาง§!"
 ICE_expand_the_civilian_fleet: "ขยายกองเรือพาณิชย"
 ICE_expand_the_civilian_fleet_desc: "กองเรือพาณิชยที่แข็งแกรงใหประโยชนสองตอ ทั้งสืบสานประเพณีการเดินเรือและเกื้อหนุนเศรษฐกิจของเรา ยามสงบเรือสินคาจะแบกรับเศรษฐกิจ และยามสงครามจะผลิตกะลาสีที่มีประสบการณซึ่งกองทัพเรือของเราตองการ"
 ICE_industrial_research_school: "โรงเรียนวิจัยอุตสาหกรรม"
 ICE_industrial_research_school_desc: "มหาวิทยาลัยประสบความสําเร็จอยางยิ่ง ประเทศตองตอยอดความสําเร็จนี้ดวยการสรางการศึกษาระดับสูงที่มุงเนนการพัฒนาอุตสาหกรรมดวย วิธีนี้จะทําใหเรามั่นใจวาจะไดวิศวกรตามที่ตองการ"
 ICE_hrafninn_flygur: "Hrafninn Flýgur"
 ICE_hrafninn_flygur_desc: "ดั่งเชนอีกา เราจะครองนานฟา ไอซแลนดจะเปนที่รูจักทั่วโลกในฐานะผูนําดานอุตสาหกรรมอากาศยานและเทคโนโลยีการบิน"
 ICE_agricultural_expansion: "ขยายการเกษตร"
 ICE_agricultural_expansion_desc: "การเกษตรของไอซแลนดยังปรับปรุงใหทันสมัยไดอีกมาก ดวยการใชประโยชนจากเทคโนโลยีสมัยใหมและความรอนจากนํ้าพุรอนธรรมชาติที่เขาถึงไดงาย เราจะเพิ่มผลผลิตทางการเกษตร และปลดปลอยที่ดินกับแรงงานไปใชดานอื่นได"
 ICE_off_shore_oil_drilling: "ขุดเจาะนํ้ามันนอกชายฝง"
 ICE_off_shore_oil_drilling_desc: "นํ้ามันกลายเปนทรัพยากรที่สําคัญยิ่งขึ้นเรื่อยๆ กองทัพเรือในปจจุบันใชนํ้ามันในปริมาณมหาศาล มีเหตุผลใหเชื่อวาอาจมีนํ้ามันอยูใตกนทะเลรอบเกาะ นี่เปนทางเลือกที่เสี่ยงสูงแตผลตอบแทนก็สูง แตก็อาจคุมคาที่จะสํารวจวามีนํ้ามันอยูจริงและนําขึ้นมาไดหรือไม"
 off_shore_drilling_tt: "ปลดล็อกการตัดสินใจ§Yขุดเจาะนํ้ามัน§!รอบ§Yไอซแลนด§!"




 ICE_the_kingdom_of_iceland: "ราชอาณาจักรไอซแลนด"
 ICE_the_kingdom_of_iceland_desc: "ประเทศนี้เดินทางมาไกลบนเสนทางสูเอกราช การสถาปนาราชอาณาจักรถือเปนกาวสุดทายสูอิสรภาพ บัดนี้เราใชพระมหากษัตริยและนโยบายตางประเทศรวมกับเดนมารกเทานั้น และสายสัมพันธนี้จะคอยๆ ลดเหลือเพียงพิธีการ"
 ICE_united_we_stand: "รวมกันเราอยู"
 ICE_united_we_stand_desc: "ในมหาสงคราม เราถูกโดดเดี่ยว เดนมารกวางตัวเปนกลาง และไอซแลนดตองทุกขยากจากการสูญเสียการเขาถึงตลาดทั้งหมด บัดนี้เดนมารกกําลังติดอาวุธใหม และเราควรเตรียมพรอมชวยเหลือพวกเขาหากจําเปน ครั้งนี้ไอซแลนดจะฝากรอยไวบนเวทีโลก"
 ICE_declare_absolute_neutrality: "ประกาศความเปนกลางโดยสมบูรณ"
 ICE_declare_absolute_neutrality_desc: "ไมวาจะเกิดอะไรขึ้นกับเดนมารก ไอซแลนดตองทําทุกวิถีทางเพื่ออยูนอกสงครามในยุโรป ดวยการประกาศความเปนกลางโดยสมบูรณ เราแสดงใหทุกคนเห็นชัดวาเราจะไมยอมใหเกาะของเราถูกลากเขาไปพัวพันกับสิ่งใด"
 ICE_declare_absolute_neutrality_tt: "§Y[ROOT.GetNameDef]§! จะไดรับเอกราชหาก §Y[ROOT.OVERLORD.GetNameDef]§! ถูกประกาศสงครามใส"
 ICE_joint_shipbuilding_programme: "โครงการตอเรือรวม"
 ICE_joint_shipbuilding_programme_desc: "ทางที่ดีที่สุดในการชวยเหลือเดนมารกคือทางทะเล เราจะรวมกันปกปองทะเลเหนือ ซึ่งตองอาศัยเรือ ความรวมมือในการสรางกองเรือจึงเปนกาวที่เปนธรรมชาติในการสรางยุทธศาสตรความรวมมือทางทหารของเรา"
 ICE_research_cooperation_tt: "โครงการวิจัยรวม"
 ICE_overlord_research_cooperation_tt: "โครงการวิจัยรวมของไอซแลนด"
 ICE_royal_marines: "นาวิกโยธินหลวง"
 ICE_royal_marines_desc: "กองทัพไอซแลนดจะไมมีวันใหญโต แตเราสามารถมุงความชํานาญเฉพาะทางได และนาวิกโยธินคือทางเลือกที่ชัดเจนสําหรับประเทศที่เปนเกาะ ดวยการจัดตั้งและฝกกองนาวิกโยธิน เราจะไดกองกําลังที่ยืดหยุนซึ่งสงไปไดทุกที่ที่ตองการ"
 ICE_the_icelandic_police_force: "กองกําลังตํารวจไอซแลนด"
 ICE_the_icelandic_police_force_desc: "กองทัพไอซแลนดจะไมมีวันใหญโตนัก แตทางเลือกหนึ่งคือขยายหนาที่ของตํารวจแหงชาติใหครอบคลุมการปองกันการรุกรานดวย วิธีนี้จะทําใหเราใชกําลังพลที่มีจํากัดไดอยางมีประสิทธิภาพยิ่งขึ้น และเตรียมการปองกันเกาะไดดียิ่งขึ้น"

 ICE_infrastructure_projects: "โครงการโครงสรางพื้นฐาน"
 ICE_infrastructure_projects_desc: "หากประเทศนี้จะแข็งแกรงได สิ่งแรกที่ตองทําคือสรางโครงสรางพื้นฐาน โครงสรางพื้นฐานที่ดีคือรากฐานของการขยายตัวทางอุตสาหกรรมทุกรูปแบบ"
 ICE_engineering_projects: "โครงการวิศวกรรม"
 ICE_engineering_projects_desc: "เกาะแหงนี้ตองไดรับการพัฒนาหากจะแข็งแกรงขึ้น โครงการวิศวกรรมขนาดใหญจะสรางโอกาสการจางงาน และวางรากฐานใหกับการเติบโตทางอุตสาหกรรมของไอซแลนด"
 ICE_patrolling_the_atlantic: "ลาดตระเวนแอตแลนติก"
 ICE_patrolling_the_atlantic_desc: "เพื่อปกปองกองเรือพาณิชยของเรา เราตองมีเรือคุมกันที่ออกทะเลลึกได เราควรรวมมือกับเดนมารกออกแบบเรือรุนใหม"
 ICE_joint_military_training: "การฝกทหารรวม"
 ICE_joint_military_training_desc: "บนเกาะเรามีประสบการณไมพอที่จะฝกกองทัพใหพรอมรบในสงครามสมัยใหมไดอยางเหมาะสม ดังนั้นการรวมมือกับเดนมารกจึงเปนแนวทางที่ดีที่สุดสําหรับเกาะเล็กๆ อยางเรา"
 ICE_industrial_cooperation: "ความรวมมือทางอุตสาหกรรม"
 ICE_industrial_cooperation_desc: "การเชิญนักอุตสาหกรรมชาวเดนมารกมาตั้งบริษัทสาขาในไอซแลนด โดยแลกกับการยกเวนภาษีและสิทธิประโยชนอื่นๆ จะสรางโอกาสการจางงานที่นี่ และยังชวยผลักดันการพัฒนาอุตสาหกรรมของเกาะนี้ซึ่งจําเปนอยางยิ่ง ดวยความชวยเหลือจากเดนมารก เราจะพาประเทศนี้กาวไปขางหนาได"
 ICE_gardhur_airfield: "สนามบินการดูร"
 ICE_gardhur_airfield_desc: "อากาศยานกําลังกลายเปนสวนสําคัญของโครงสรางพื้นฐานสมัยใหม ไอซแลนดตองไมลาหลัง สนามบินใกลเมืองหลวงจะเปนกุญแจสําคัญที่สงไอซแลนดพุงทะยานสูอนาคต"
 ICE_the_merchant_fleet: "กองเรือพาณิชย"
 ICE_the_merchant_fleet_desc: "ครั้งหนึ่งเรือเคยเปนหัวใจในการสรางชาตินี้ และเรือก็จะเปนสวนหนึ่งของอนาคตดวย กองเรือพาณิชยที่แข็งแกรงจะเปนแกนหลักของเศรษฐกิจไอซแลนดในอนาคต"
 ICE_not_standing_idly_by: "ไมนิ่งดูดาย"
 ICE_not_standing_idly_by_desc: "สงครามกําลังจะมาถึง ไมวาเราจะชอบหรือไม เราตองติดอาวุธใหชาติหากหวังจะมีโอกาสปองกันเกาะนี้ไวได ไมสูก็ตาย นั่นเปนสิ่งที่แนนอน"
 ICE_expand_industrial_complexes: "ขยายนิคมอุตสาหกรรม"
 ICE_expand_industrial_complexes_desc: "อุตสาหกรรมทหารของเราลาหลังมหาอํานาจอื่นในยุโรปอยางมาก เพราะยังดอยพัฒนาและถูกใชงานไมเต็มที่ หากเราไมลงทุนอยางมหาศาลในการขยายและอุดหนุนองคกรอุตสาหกรรมทหาร อุตสาหกรรมของเราอาจไมมีวันไลตามทัน"
 ICE_political_unity: "เอกภาพทางการเมือง"
 ICE_political_unity_desc: "ในยามอันตราย การที่ชาติยึดเหนี่ยวกันไวเปนเรื่องสําคัญยิ่ง เราตองวางความขัดแยงทางการเมืองไวขางหนึ่ง และทําทุกวิถีทางให [ROOT.GetName] พนจากสงคราม"
 ICE_anglo_icelandic_relations: "ความสัมพันธอังกฤษ-ไอซแลนด"
 ICE_anglo_icelandic_relations_desc: "[ENG.GetNameDefCap] นาจะเปนคูคาในอนาคตที่ดีที่สุดของเรา ไมวาอยางไร การเปนปรปกษกับชาว[ENG.GetAdjective]จะสงผลเสียรายแรงตอประเทศของเรา และอาจถึงขั้นเปนอันตรายโดยตรง ดังนั้นเราตองพยายามอยางดีที่สุดเพื่อรักษาความสัมพันธอันดีกับเพื่อนบานโพนทะเลของเรา"
 ICE_anglo_icelandic_relations_tt: "หากคุณทําแผนยุทธศาสตร§Yขยายอุตสาหกรรมประมง§!สําเร็จแลว:"
 ICE_american_protection: "การคุมครองจากอเมริกา"
 ICE_american_protection_desc: "[GetAmericanProtectionText]"
 ICE_american_protection_desc_standard: "สงครามกําลังกอตัว และเราเล็กเกินกวาจะยืนหยัดตามลําพัง [USA.GetNameDefCap] สามารถคุมครองเราได เราควรติดตอรัฐบาล[USA.GetAdjective]และเสนอใหพวกเขาสงทหารมาประจําการที่นี่เพื่อคุมครองไอซแลนด นี่จะเปนการถอยหลังหนึ่งกาวบนเสนทางสูเอกราช แตก็เปนเพียงอุปสรรคชั่วคราว การถูกรุกรานยอมเลวรายกวา"
 ICE_american_protection_desc_british_subject: "[ENG.GetNameDefCap] กําลังตึงมืออยางหนักในสงครามครั้งนี้ พวกเขาอาจไมสามารถปกปองเราจากกองกําลังศัตรูไดหากศัตรูตัดสินใจบุก เราควรติดตอรัฐบาล[USA.GetAdjective]และเสนอใหพวกเขารับหนาที่ปกปองไอซแลนดแทน"
 ICE_american_protection_tt: "§Y[ROOT.GetName]§! กลายเปนรัฐหุนเชิดของ §Y[USA.GetNameDef]§!"
 ICE_fighting_as_equals: "สูเคียงบาอยางเทาเทียม"
 ICE_fighting_as_equals_desc: "เรากําลังสูรบในสงครามรวมกัน และไอซแลนดทําหนาที่ไดมากกวาสวนของตน ถึงเวลาที่เดนมารกตองยอมรับวาไอซแลนดไมใชผูอยูใตบังคับอีกตอไป แตเปนหุนสวนที่เทาเทียมในพันธมิตรนี้ ถึงเวลาประกาศอยางเปนทางการวาไอซแลนดเปนชาติเอกราช"
 ICE_fighting_as_equals_tt: "§Y[ROOT.getName]§! ประกาศเอกราช"
 ICE_expanding_the_university_of_reykjavik: "ขยายมหาวิทยาลัยเรคยาวิก"
 ICE_expanding_the_university_of_reykjavik_desc: "ความรูคือกุญแจ หากประเทศนี้จะกาวนําโลก เราตองทุมความพยายามอยางมีจุดหมาย การเพิ่มงบประมาณใหมหาวิทยาลัยเรคยาวิกจะสรางฐานสําหรับการเติบโตในอนาคต"
 ICE_trade_relations: "ความสัมพันธทางการคา"
 ICE_trade_relations_desc: "ชาติเล็กๆ ไมอาจหวังจะผลิตทุกสิ่งที่ตองการไดเอง แตดวยการรักษาความสัมพันธอันดีกับประเทศตางๆ ทั่วโลก และใชที่ตั้งเชิงยุทธศาสตรซึ่งอยูกึ่งกลางระหวางยุโรปกับอเมริกาเหนือ ไอซแลนดอยูในตําแหนงที่เหมาะจะเปนศูนยกลางทางการเงินและการคา การใชสายสัมพันธเหลานี้ใหเกิดประโยชนสูงสุดจะชวยใหจัดหายุทโธปกรณที่ประเทศตองการอยางยิ่งไดงายขึ้น"
 ICE_keflavik_airbase: "ฐานทัพอากาศเคปลาวิก"
 ICE_keflavik_airbase_desc: "ชาวอเมริกันตองการสรางฐานทัพอากาศที่ใหญขึ้นเพื่อลาดตระเวนมหาสมุทรแอตแลนติกไดดีขึ้น เราควรอนุมัติ เพราะมันจะทําใหประเทศนี้แข็งแกรงขึ้นเทานั้น"
 ICE_modernizing_the_island: "ปรับเกาะใหทันสมัย"
 ICE_modernizing_the_island_desc: "ทฤษฎีใหมๆ ตองนํามาปฏิบัติจริง เศรษฐกิจตองไดรับการปฏิรูป บัดนี้คือเวลาผลักดันการเปลี่ยนแปลงเหลานี้"
 ICE_compensation: "การชดเชย"
 ICE_compensation_desc: "เราไดพิสูจนใหเดนมารกและโลกเห็นแลววาเราเปนชาติที่ไมอาจมองขาม เราไดเสียสละมามาก ทั้งในชวงหลังและตลอดหลายศตวรรษ ดวยที่ตั้งกลางมหาสมุทรแอตแลนติก ไอซแลนดอยูในตําแหนงที่เหมาะจะปกปองหมูเกาะของราชบัลลังกเดนมารก หากมอบหนาที่ปกปองหมูเกาะเหลานั้นใหเรา เดนมารกจะไดหุนสวนที่แข็งแกรงขึ้น และมุงปกปองดินแดนหลักของตนไดดีขึ้น"
 ICE_republicanism: "ลัทธิสาธารณรัฐ"
 ICE_republicanism_desc: "ไอซแลนดไมตองการกษัตริย ชวงเวลาผูสําเร็จราชการไดพิสูจนแลววาเราอยูไดดีโดยไมมีกษัตริย ถึงเวลาที่เหมาะสมจะยกเลิกสถาบันยุคกลางนี้และเตรียมพรอมสูการเปนสาธารณรัฐ"
 ICE_american_investments: "การลงทุนจากอเมริกา"
 ICE_american_investments_desc: "การมีชาวอเมริกันนับพันประจําการบนเกาะก็เปนผลดีตอเศรษฐกิจอยูแลว แตยังหมายความวาบริษัทอเมริกันจะสนใจตั้งบริษัทสาขาและลงทุนในบริษัทไอซแลนดมากขึ้นดวย โดยรวมแลว สถานการณนี้อาจเปนประโยชนอยางมากตอเรา หากเราเดินเกมไดถูกตอง"
 ICE_american_soldiers: "ตอนรับทหารอเมริกัน"
 ICE_american_soldiers_desc: "สหรัฐอเมริกากระตือรือรนที่จะแผขยายอิทธิพลไปทั่วทุกแหง เพื่อปกปองคุณคาที่พวกเขายึดถือ เราอาจอนุญาตใหทหารของพวกเขาประจําการในดินแดนของเราไดอยางอิสระ และบางสวนก็อาจอยูที่นี่เพื่อเสริมกําลังใหกองกําลังของเราเอง"
 ICE_iceland_defense_force: "กองกําลังปองกันไอซแลนด"
 ICE_iceland_defense_force_desc: "ดวยความชวยเหลือจากอเมริกา ไอซแลนดจะสรางกองทัพสมัยใหมได พวกเขามีความรู ประสบการณ และกําลังคนที่จะฝกทหารของเรา การสรางกองกําลังรวมกับพวกเขามีศักยภาพที่จะทําใหหนวยของเรากลายเปนกองกําลังชั้นยอดอยางแทจริง"
 ICE_state_owned_enterprises: "รัฐวิสาหกิจ"
 ICE_state_owned_enterprises_desc: "บัดนี้เกาะของเราพึ่งพาตนเองไดดีขึ้นแลว ถึงเวลาเริ่มคิดถึงการกอตั้งอุตสาหกรรมที่จะดึงดูดแรงงานและพัฒนาเศรษฐกิจ รวมทั้งเพิ่มประสิทธิภาพของกลไกรัฐ"
 
 ICE_not_our_king: "ไมใชกษัตริยของเรา"
 ICE_not_our_king_desc: "ราชอาณาจักรไอซแลนด - ชางไรสาระ ไอซแลนดไมตองการกษัตริย และไมใชกษัตริยเดนมารกอยางแนนอน ถึงเวลาเริ่มสรางแรงสนับสนุนในหมูชาวไอซแลนดเพื่อตัดขาดจากอดีตโดยสิ้นเชิง ขณะที่เรากาวยาวสูอนาคต"
 ICE_expand_the_industrial_base: "ขยายฐานอุตสาหกรรม"
 ICE_expand_the_industrial_base_desc: "ดวยการเลิกพึ่งพาสินคาอุตสาหกรรมจากเจาอาณานิคมของเรา เราจะไดอุตสาหกรรมที่แข็งแกรงขึ้น และชนชั้นแรงงานที่แข็งแกรงขึ้นดวย การปฏิวัติจะเกิดขึ้นไมไดหากไมมีเครื่องมือที่เหมาะสม และดวยการเลิกพึ่งพาเจาอาณานิคม ประเทศนี้จะไดสิ่งที่ตองการ ทั้งอาวุธที่ผลิตเองเพื่อขับเคลื่อนการปฏิวัติ และปญญาชนหัวกาวหนารุนใหม"
 ICE_anti_capitalist_propaganda: "โฆษณาชวนเชื่อตอตานทุนนิยม"
 ICE_anti_capitalist_propaganda_desc: "ทุนนิยมเคยทําอะไรใหเราบาง? ใช มันอาจนําความมั่งคั่งเล็กนอยมาสูชาติ แตมันก็พาเราเขาสูวิกฤตที่ประเทศนี้กําลังเผชิญอยู ดวยการพึ่งพาประชาธิปไตยเสรีนิยมมากเกินไป และการที่เจาอาณานิคมยอมใหเราแคเศษเดน ก็ควรชัดเจนแลววาอนาคตตองอยูที่อื่น"
 ICE_international_relations: "ความสัมพันธระหวางประเทศ"
 ICE_international_relations_desc: "เสนทางขางหนาจะยากลําบาก นั่นเปนสิ่งที่แนนอน และหากเราตองเดินตามลําพังก็จะยิ่งยากขึ้นไปอีก ดังนั้นเราตองแสวงหาพันธมิตรใหม องคการคอมมิวนิสตสากลเปนที่หนึ่งที่เราจะลองหาพันธมิตรใหมได แตก็ยังมีทางเลือกอื่นดวย สิ่งสําคัญคือการบุกเบิกเสนทางใหมอยางจริงจัง ซึ่งเราตองเริ่มทันที"
 ICE_rally_the_workers_of_reykjavik: "ปลุกระดมแรงงานแหงเรคยาวิก"
 ICE_rally_the_workers_of_reykjavik_desc: "ไอซแลนดไมมีกองทัพที่เปนชิ้นเปนอัน แตแรงงานในเมืองหลวงยอมกลายเปนพลังที่ไมอาจมองขามได หากแรงงานลุกฮือตอตานระบบ ก็คงไมมีอะไรหยุดพวกเขาไดมากนัก การดึงพวกเขามาเปนแนวรวมจึงสําคัญที่สุด"
 ICE_completion_break_with_the_crown_tt: "เมื่อทําแผนยุทธศาสตร §Y$ICE_break_with_the_crown$§! สําเร็จ:"
 ICE_prepare_for_the_revolution: "เตรียมการปฏิวัติ"
 ICE_prepare_for_the_revolution_desc: "การปฏิวัติที่สําเร็จไมไดเกิดขึ้นเอง มันตองเตรียมการอยางพิถีพิถัน ตองหวานเมล็ดพันธุและรดนํ้า ประชาชนตองรูวาเมื่อใดควรลุกฮือ และนักปฏิวัติตองนําทางพวกเขาเมื่อถึงเวลา ตองพิมพโปสเตอร ตองสรรหาและฝกนักปฏิวัติอาชีพ ตองซุกซอนอาวุธไวอยางดี และผูนําตองพรอมเขายึดอํานาจ" 
 ICE_state_visits: "การเยือนระดับรัฐ"
 ICE_state_visits_desc: "ปฏิเสธไมไดวาประเทศที่นําโดยฟาสซิสตคือผูขับเคลื่อนการเปลี่ยนแปลงของโลกในขณะนี้ หากไอซแลนดจะเปลี่ยนแปลง บางทีอาจมีสิ่งที่เรียนรูไดจากพวกเขา ควรสถาปนาความสัมพันธอยางเปนทางการโดยเร็วที่สุด และตองสํารวจโอกาสความรวมมือทุกดานทันที"
 ICE_general_strike: "การนัดหยุดงานทั่วไป"
 ICE_general_strike_desc: "มาแสดงใหโลก และโดยเฉพาะกษัตริยเดนมารกผูชั่วชาของเรา ไดเห็นวาแรงงานแหงไอซแลนดยืนหยัดอยางแข็งแกรงและเปนหนึ่งเดียว การนัดหยุดงานครั้งใหญที่หยุดงานอุตสาหกรรมทั้งหมดรวมถึงการเดินเรือเขาออกเกาะทั้งหมด จะสรางความเจ็บปวดใหรัฐบาลหุนเชิดอยางแทจริง และแสดงใหประชาชนเห็นวาอํานาจที่แทจริงอยูที่ใด"
 ICE_general_strike_tt: "\nเมื่อ§Yการนัดหยุดงานทั่วไป§!สิ้นสุดลง:"
 ICE_organize_a_march: "จัดขบวนเดินขบวน"
 ICE_organize_a_march_desc: "ประชาชนถูกเจาอาณานิคมตางชาติกดขี่มานานเกินไปแลว การเดินขบวนชาตินิยมสูเมืองหลวง ดั่งการเดินขบวนสูโรม จะเปนเครื่องเตือนใจถึงอดีตอันเกรียงไกรของชาวไวกิ้ง หากเราทําใหชาวไอซแลนดผูรักอิสรภาพทุกคนเขารวมได เราจะแสดงใหรัฐบาลเห็นวาชาวไอซแลนดแข็งแกรง มีจํานวนมาก และเปนหนึ่งเดียว! รวมกัน เราจะสรางอนาคตที่ยิ่งใหญกวา!"
 ICE_break_with_the_crown: "ตัดขาดจากราชบัลลังก"
 ICE_break_with_the_crown_desc: "ถึงเวลาที่เหมาะสมจะตัดขาดอยางเปนทางการจากราชบัลลังกเดนมารก เราควรประณามกษัตริยและคณะรัฐมนตรีที่เสื่อมทรามของพระองคในเดนมารก และประกาศใหไอซแลนดเปนชาติเอกราชอีกครั้ง เปนอิสระที่จะเดินตามเสนทางของตนเองสูความฝนและความปรารถนา"
 ICE_break_with_the_crown_tt: "[ROOT.GetNameDefCap] ไดรับเอกราช"
 ICE_break_with_the_crown_workers_tt: "เมื่อทําแผนยุทธศาสตร §Y$ICE_rally_the_workers_of_reykjavik$§! สําเร็จ:"
 ICE_break_with_the_crown_revolution_tt: "เมื่อทําแผนยุทธศาสตร §Y$ICE_prepare_for_the_revolution$§! สําเร็จ:"
 ICE_embrace_the_workers_revolution: "ยอมรับการปฏิวัติของแรงงาน"
 ICE_embrace_the_workers_revolution_desc: "แรงสนับสนุนจากแรงงานทําใหการเปลี่ยนแปลงนี้เปนไปได จึงเปนเรื่องธรรมดาที่สหภาพ แรงงาน และสหภาพแรงงานควรไดรับบทบาทนําในรัฐใหม ผูนําการปฏิวัติของแรงงานจะนําประเทศไปสูจุดสูงสุดใหม และนําความกาวหนามาใหเรามากกวาที่กษัตริยองคใดเคยทําได"
 ICE_remove_dissent_in_the_working_class_tt: "จะลบ §Y$ICE_dissent_in_the_working_class$§!"
 ICE_state_corporatism: "บรรษัทนิยมแหงรัฐ"
 ICE_state_corporatism_desc: "บัดนี้เราไดสลัดเศษซากสุดทายของแอกเดนมารกอันออนแอทิ้งไปแลว ถึงเวลาสถาปนารัฐใหม วิธีที่ดีที่สุดในการรับประกันความปลอดภัยของชาติคือการรวมใจกันอยูเบื้องหลังผูนําที่เขมแข็ง โดยมีผูนําสหภาพ เจาสัวอุตสาหกรรม และพรรครวมมือกันเพื่อประโยชนสวนรวมของชาวไอซแลนดทุกคน รัฐจะสนับสนุนนักอุตสาหกรรม และพวกเขาก็จะสนับสนุนรัฐเปนการตอบแทน"
 ICE_international_brigades: "กองพลนอยนานาชาติ"
 ICE_international_brigades_desc: "การตอสูกับการกดขี่ตองดําเนินตอไป แมจะไดชัยชนะที่นี่แลวก็ตาม มิฉะนั้นชัยชนะของเราอาจเปนเพียงชั่วคราว บุตรชายและบุตรสาวแหง [ROOT.GetName] ตองพรอมใหความชวยเหลือทุกที่ที่จําเปน และรัฐตองสนับสนุนอยางสุดความสามารถ ดวยการออกกฎหมายใหมที่จําเปน และจัดหาอาวุธและยุทโธปกรณที่ตองการ"
 ICE_state_owned_industry: "อุตสาหกรรมของรัฐ"
 ICE_state_owned_industry_desc: "ประเทศเล็กๆ อยาง [ROOT.GetNameDef] ไมอาจพึ่งพานายทุนใหผลิตสินคาที่จําเปนได เพื่อเพิ่มประสิทธิภาพสูงสุดและรับประกันวาสินคาที่จําเปนที่สุดจะถูกผลิต รัฐตองเขามาควบคุมอุตสาหกรรม ประเทศจะไมตองพึ่งพาการลงทุนจากตางชาติเพื่อความอยูรอดอีกตอไป รัฐไอซแลนดจะดูแลพลเมืองและกองทัพของตน"
 ICE_organize_the_greyshirts: "จัดตั้งกลุมเสื้อเทา"
 ICE_organize_the_greyshirts_desc: "กองกําลังอาสาที่มีอาวุธพรอมและไดรับการฝกตั้งแตเยาววัย เปนเครื่องมือที่มีประโยชนในการบมเพาะเยาวชนและหลอหลอมพวกเขาใหเขากับโลกใหมของเรา นอกจากนี้ การฝกกึ่งทหารยังหมายถึงการเสริมขีดความสามารถของกองทัพ ซึ่งอาจเปนประโยชนเมื่อทวงคืนสิ่งที่เปนของเราโดยชอบธรรม"
 ICE_research_cooperation: "ความรวมมือดานการวิจัย"
 ICE_research_cooperation_desc: "ดวยความรวมมือกับมหาอํานาจที่อยูฝายเดียวกับเรา เราจะพัฒนาเทคโนโลยีที่ใหความไดเปรียบดานอาวุธในอนาคตไดดียิ่งขึ้น เราจะเรียนรูจากหุนสวนอันมีคา พรอมกับเสนอพื้นที่ทดสอบอันเหมาะสมและเงียบสงบ หางไกลจากสายตาสอดรูสอดเห็น"
 ICE_infiltrating_the_british_isles: "แทรกซึมหมูเกาะอังกฤษ"
 ICE_infiltrating_the_british_isles_desc: "เปลวไฟแหงการปฏิวัติตองแผขยายออกไป มิฉะนั้นจะถูกบีบใหมอดดับ เปาหมายแหงการปลดปลอยที่ชัดเจนคือแรงงานผูถูกกดขี่แหงหมูเกาะอังกฤษ[ROOT.GetNameDefCap] จะชวยเหลือแรงงานในภูมิภาคที่ถูกกดขี่ใหลุกฮือตอตานเจานายจักรวรรดินิยมและนายทุน รวมกัน เราจะทําใหอุดมการณปฏิวัติกลายเปนความจริงของแรงงานสามัญ"
 ICE_infiltrating_the_british_isles_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อปลุกการลุกฮือของคอมมิวนิสตในเวลส สกอตแลนด และไอรแลนดเหนือ"
 ICE_transformation_of_nature: "การเปลี่ยนแปลงธรรมชาติ"
 ICE_transformation_of_nature_desc: "ไฟฟาคือกุญแจสูการเปนอุตสาหกรรม ธรรมชาติของไอซแลนดตองรับใชรัฐ เชนเดียวกับพลเมือง แมนํ้าและนํ้าตกจะกลายเปนเขื่อน หินจะถูกขุดขึ้นมา และนํ้าพุรอนจะถูกใชทําความรอน ไมมีสิ่งใดจะหยุดยั้งการเดินหนาสูความกาวหนาของเราได"
 ICE_the_viking_spirit: "จิตวิญญาณไวกิ้ง"
 ICE_the_viking_spirit_desc: "ไรความกลัวและอันตรายถึงชีวิต คือคําที่ใชกลาวถึงชาวไวกิ้งในอดีต พวกเขาขามมหาสมุทรโดยไมรูวามีอะไรรออยูเบื้องหนา และมีเพียงผูแข็งแกรงเทานั้นที่ประสบความสําเร็จ วันนี้ชาวไอซแลนดตองไรความกลัวและกลาหาญ เพราะดวยความกลาบาบิ่นและความหาวหาญเทานั้น ประเทศจึงจะกาวขามความยิ่งใหญในอดีต และครองทะเลเหนืออีกครั้ง"
 ICE_viking_spirit_tt: "ปลดล็อกการตัดสินใจ§Yเสริมสรางจิตวิญญาณไวกิ้ง§!"
 ICE_recruiting_international_workers: "สรรหาแรงงานนานาชาติ"
 ICE_recruiting_international_workers_desc: "ดวยการเปลี่ยนชาติของเราใหเปนสังคมตนแบบสําหรับทั้งคอมมิวนิสตและสังคมนิยม และรักษาเปลวไฟแหงการปฏิวัติใหลุกโชนเชนเคย เราจะดึงดูดนักปฏิวัติจากนานาชาติได เหมือนยุคแรกเริ่มของรัฐโซเวียต เราตองแสดงใหแรงงานและทหารปฏิวัติ ไมวาจะมาจากที่ใด เห็นวา [ROOT.GetName] คือผูถือคบเพลิง และเปนที่ที่พวกเขาควรอยู"
 ICE_international_research_community: "ประชาคมวิจัยนานาชาติ"
 ICE_international_research_community_desc: "ยังมีอีกมากที่เรียนรูไดจากผูอื่น ทั้งผานองคการคอมมิวนิสตสากลและโครงการความรวมมืออื่นๆ กับประเทศทั่วโลก ดวยการมีสวนรวมกับประชาคมนานาชาติ [ROOT.GetName] จะไปถึงความยิ่งใหญระดับใหม ลัทธิรวมหมูคือหนทางเดียวสูความกาวหนาที่แทจริง!"
 ICE_international_research_community_tt: "ทุกประเทศคอมมิวนิสตที่ไมไดอยูในฝายใด หรืออยูในฝายเดียวกับ [ROOT.GetName]:"
 ICE_reclaiming_the_empire: "ทวงคืนจักรวรรดิ"
 ICE_reclaiming_the_empire_desc: "ครั้งหนึ่งกรีนแลนดเคยถูกตั้งถิ่นฐานโดยชาวไวกิ้งที่มาจากไอซแลนด นับแตนั้นนอรเวยและเดนมารกก็ทะเลาะแยงชิงกันมา ทั้งที่ไมมีสิทธิ์ที่แทจริงเหนือเกาะนี้เลย ถึงเวลาแลวที่เราจะเรียกรองใหคืนกรีนแลนดแกเจาของโดยชอบธรรม หากพวกเขาเห็นคุณคาของมรดกและประวัติศาสตร ก็จะยกมันใหเราโดยไมมีเงื่อนไข มาเดินหนาสูความรุงโรจนกันตอ!"
 ICE_securing_the_north_sea_passage: "ยึดชองทางทะเลเหนือ"
 ICE_securing_the_north_sea_passage_desc: "ถึงเวลาทวงคืนสิ่งที่ควรเปนดินแดนของไอซแลนด หมูเกาะเชตแลนดและหมูเกาะแฟโรในทะเลเหนือคือกุญแจสําคัญในการควบคุมเสนทางเขาออก [ROOT.GetNameDef]"
 ICE_vinland: "วินแลนด"
 ICE_vinland_desc: "แนวคิดเรื่องจักรวรรดิแอตแลนติกเหนือถือกําเนิดขึ้นพรอมการคนพบทวีปอเมริกาโดยไมใชใครอื่นนอกจากเลฟูร เอริกสสัน ผูมีเชื้อสายไอซแลนด นาเสียดายที่อาณานิคมไวกิ้งแหงวินแลนดลมสลายไป แตบัดนี้ถึงเวลาเปลี่ยนความฝนที่สูญหายมานานใหเปนจริง เพื่อโอดิน!"

 ICE_the_armed_forces_of_iceland: "กองทัพแหงไอซแลนด"
 ICE_the_armed_forces_of_iceland_desc: "หากสงครามมาถึงไอซแลนด ไอซแลนดตองปองกันตนเองได เราตองเริ่มสรางกองกําลังที่สามารถเอาชนะผูคิดจะรุกรานทุกราย แมจะเปนเกาะเล็กที่มีประชากรนอย แตที่ตั้งและขนาดก็อาจเปนจุดแข็งในตัวเอง เพราะไมมีศัตรูรายใดจะทุมกําลังขนาดใหญมายึดได"
 ICE_an_airbase_in_the_sea: "ฐานทัพอากาศกลางทะเล"
 ICE_an_airbase_in_the_sea_desc: "ดวยการครองนานฟาเหนือเกาะและทะเลโดยรอบ เราจะมั่นใจไดวาไมมีศัตรูใดยกพลขึ้นบกที่นี่ดวยกําลังมหาศาลได และแมพวกเขาจะทําได กองทัพอากาศก็จะทําใหศัตรูขาดแคลนเสบียงที่จําเปนอยูเสมอ ดังนั้นแนวทางที่เปนธรรมชาติในการสรางกองทัพไอซแลนดคือการสรางกองทัพอากาศสมัยใหม"
 ICE_a_naval_hub_in_the_atlantic: "ศูนยกลางทางทะเลในแอตแลนติก"
 ICE_a_naval_hub_in_the_atlantic_desc: "ไอซแลนดเปนเกาะ การมีกองเรือเปนเหลาทัพหลักจึงสมเหตุสมผลอยางยิ่ง มันหยุดยั้งศัตรูไมใหมาถึงชายฝงของเราได สนับสนุนพันธมิตรในการครองทะเลได และลําเลียงกองกําลังนอกประเทศไปไดทุกที่ที่ตองการ การสรางกองทัพเรือที่แข็งแกรงจึงเปนทางเลือกที่ชัดเจนสําหรับไอซแลนด"
 ICE_mine_iceland: "วางทุนระเบิดรอบไอซแลนด"
 ICE_mine_iceland_desc: "ในแงของเสนทางเดินเรือ ไอซแลนดเปดโลงอยางอันตรายในทุกทิศทางยกเวนทางเหนือ เพื่อรับประกันความปลอดภัยของประชาชนบนเกาะ เราตองเตรียมพรอมวางทุนระเบิดอยางกวางขวางในนานนํ้าไอซแลนดหากเกิดความขัดแยงเปดเผย"
 ICE_flying_boats: "เรือบิน"
 ICE_flying_boats_desc: "หากเราไมอาจสูศัตรูในนานนํ้าได เราก็จะหันไปพึ่งสิ่งที่ดีรองลงมา นั่นคือทองฟา เพราะหากเราครองนานฟา เรือของศัตรูก็จะไรประโยชน เพราะจะถูกจมไดทุกเมื่อ"
 ICE_modernizing_the_coast_guard: "ปรับหนวยยามฝงใหทันสมัย"
 ICE_modernizing_the_coast_guard_desc: "หนวยยามฝงไอซแลนดเปนกองกําลังหลักของเรามานานทั้งดานความมั่นคงภายในและภายนอก ดังนั้นเราควรทําใหแนใจวาพวกเขาจะกาวทันความทันสมัยและความกาวหนาทางเทคโนโลยีที่เกิดขึ้นอยางรวดเร็ว"
 ICE_low_cost_aircrafts: "อากาศยานตนทุนตํ่า"
 ICE_low_cost_aircrafts_desc: "สิ่งที่เราไมมีคืออุตสาหกรรมขนาดใหญ แตสิ่งที่เรามีคือบุคคลจํานวนหนึ่งที่รูวิธีสรางเครื่องบินอยางคุมคาที่สุด เราควรใชความสามารถของพวกเขา เพื่อใหแมเศรษฐกิจของเราจะออนแออยางยอมรับได เราก็ยังตามทันการแขงขันสะสมอาวุธทางอากาศ"
 ICE_support_equipment: "ยุทโธปกรณสนับสนุน"
 ICE_support_equipment_desc: "ทุกหนวยของกองทัพ รวมถึงตํารวจปราบจลาจล ลวนตองการอาวุธหนักขึ้น ชุดปฐมพยาบาลที่เหมาะสม และอาวุธกดดันขาศึก ดังนั้นเราควรลงทุนในดานนี้โดยเร็วที่สุด"
 ICE_emergency_conversions: "การดัดแปลงฉุกเฉิน"
 ICE_emergency_conversions_desc: "แมชาติของเราอาจไมมีศักยภาพในการสรางเรือขนาดใหญ แตเรามีเรือประมงขนาดใหญ เรือสินคา และเรือของเอกชนอยูมากมาย ในยามฉุกเฉิน เราสามารถติดตั้งปนกลหรือปนใหญเบาบนเรือเหลานี้ และสรางกําลังทางเรือขนาดใหญพอจะสูกับคูแขงสวนใหญไดอยางรวดเร็วและมีประสิทธิภาพ"
 ICE_emergency_conversions_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อดัดแปลง§Yขบวนเรือลําเลียง§!เปน§Yเรือพิฆาต§!หรือ§Yเรือลาดตระเวน§!"
 ICE_enact_conscription: "Herþjónustu"
 ICE_enact_conscription_desc: "ขณะที่อนาคตของชาติยิ่งไมแนนอน การปองกันประเทศก็กลายเปนเรื่องสําคัญเรงดวน เพื่อแกไขขอเท็จจริงที่วากองทัพของเราแทบไมมีอยูจริง เราควรบังคับใชการเกณฑทหารภาคบังคับกับคนหนุมสาวทุกคน"
 ICE_a_profesional_army: "ทํากองทัพใหเปนมืออาชีพ"
 ICE_a_profesional_army_desc: "ขณะนี้กองทัพออนแอเกินกวาจะปองกันเกาะของเราไดอยางเหมาะสม และทางเดียวที่จะแกปญหานี้คือทําใหกองทัพประกอบดวยคนที่ดีที่สุดเทานั้น ผูพรอมจะสูจนถึงที่สุด"
 ICE_thungur_hnifur: "Þungur Hnífur"
 ICE_thungur_hnifur_desc: "กองทัพไอซแลนดจะไมมีวันใหญโต เพื่อชดเชยสิ่งนั้น เราตองฝกทหารใหดีที่สุดเทาที่ทําได และมุงเนนจุดแข็งของเรา เพื่อวาเมื่อเราโจมตี การโจมตีนั้นจะหนักหนวง"
 ICE_thungur_hnifur_idea: "หนวยรบพิเศษชั้นยอด"
 ICE_civilian_war_duty: "การปองกันภัยฝายพลเรือน"
 ICE_civilian_war_duty_desc: "สิ่งสําคัญคือพลเมืองของเราตองรูแนชัดวาจะปฏิบัติตัวอยางไรหากสงครามหรือวิกฤตมาถึงบาน และพลเรือนทุกคนตองพรอมทําหนาที่ของตน เชน ชวยเหลือดานการสงกําลังบํารุง การดับเพลิง และการแจกจาย เมื่อถึงเวลา"
 ICE_doctrinal_studies: "ศึกษาหลักนิยม"
 ICE_doctrinal_studies_desc: "ศิลปะแหงสงครามไมใชเรื่องงาย ยิ่งไมใชสิ่งที่ทุกชาติจะเชี่ยวชาญได เราตองศึกษามหาอํานาจของโลก และเรียนรูจากวิธีที่พวกเขาทําสงคราม"
 ICE_death_from_above: "ความตายจากเบื้องบน"
 ICE_death_from_above_desc: "หากเราชนะสงครามทางอากาศ เราก็ชนะสงคราม และชนะอยางรวดเร็ว จะยิ่งเร็วขึ้นอีกหากเราเพิ่มความรวมมือระหวางเหลาทัพอากาศกับกองทัพบก และฝกกรมทหารพลรมพิเศษที่พรอมตัดเสนทางเสบียงของศัตรูทุกที่ที่ทําได"
 ICE_we_shall_defend_our_island: "เราจะปกปองเกาะของเรา"
 ICE_we_shall_defend_our_island_desc: "เกาะนี้คือบานของเรา และไมมีใครรูจักมันดีเทาเรา ดวยการทําใหกองทัพเชี่ยวชาญการรบบนภูเขา เราสามารถถอนตัวจากชายฝง แลวทําลายศัตรูทันทีที่พวกเขายกพลขึ้นบกและเริ่มรูสึกมั่นใจและชะลาใจ"
 ICE_taking_the_fight_to_our_enemies: "นําศึกไปสูศัตรู"
 ICE_taking_the_fight_to_our_enemies_desc: "ทะเลลอมรอบเรา และหลายศตวรรษมาแลวที่ทองทะเลอันกวางใหญหลอหลอมผูคนของเราและตัวตนของเรา ดวยการใชความรูที่ไดมาจากสิ่งนี้ เราจะนําศึกไปสูศัตรูในจุดที่พวกเขาคาดไมถึงที่สุด"


#### DENMARK ####
#Economical/Industrial Branch
 DEN_kanslergadeforliget: "สานตอขอตกลงคันสเลอรกาเด"
 DEN_kanslergadeforliget_desc: "[ROOT.GetName] ยังคงไดรับผลกระทบจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ ทั้งอัตราการวางงานที่พุงสูงและภาคเกษตรกรรมที่กําลังลมสลาย เราตองจับมือขามพรรคและบรรลุขอตกลงรวมกันวาจะรับมือกับวิกฤตที่เรากําลังเผชิญอยางไร"
 DEN_devalue_the_krone: "ลดคาเงินโครเนอ"
 DEN_devalue_the_krone_desc: "การลดคาเงินโครเนอจะทําใหผลผลิตทางการเกษตรของเราแขงขันไดดีขึ้นในตลาดโลกและเพิ่มโอกาสในการสงออก ซึ่งจะชวยบรรเทาความยากลําบากของเกษตรกร"
 DEN_remove_economic_crisis_in_730_days_tt: "§Y$DEN_economic_crisis_dynamic_modifier$§! จะถูกลบออกภายใน 730 วัน"
 war_will_cancel_deal_tt: "§Yสงครามระหวางประเทศของเราจะทําใหขอตกลงนี้สิ้นสุดลง§!"
 DEN_effects_after_fortify_our_borders_tt: "ทําแผนยุทธศาสตร §Y$DEN_fortify_our_borders$§! สําเร็จแลว:"
 DEN_trade_with_britain: "คาขายกับอังกฤษ"
 DEN_trade_with_britain_desc: "ในประวัติศาสตร [ENG.GetNameDefCap] เปนตลาดสงออกผลผลิตทางการเกษตรที่ใหญที่สุดของเรา แตหลังภาวะเศรษฐกิจตกตํ่าครั้งใหญ การคานี้แทบหยุดชะงักลง เมื่อคาเงินโครเนอถูกลดลงแลว ก็ถึงเวลาติดตอชาวอังกฤษเพื่อพยายามฟนฟูสายสัมพันธทางการคาในอดีต"
 DEN_trade_with_germany: "คาขายกับเยอรมนี"
 DEN_trade_with_germany_desc: "ในประวัติศาสตร [GER.GetNameDefCap] นําเขาผลผลิตทางการเกษตรของเราในปริมาณมาก และแมแตมหาสงครามก็ไมอาจหยุดยั้งได แตในชวงไมกี่ปที่ผานมา การคาระหวางสองประเทศลดลง บางทีบัดนี้อาจถึงเวลาพยายามพลิกแนวโนมนี้!"
 DEN_agricultural_subsidies: "เงินอุดหนุนภาคเกษตร"
 DEN_agricultural_subsidies_desc: "เกษตรกรของเราตองดิ้นรนกับวิกฤตหนี้สินและการถูกยึดทรัพย ความรูสึกสิ้นหวังและความโกรธคุกรุนอยูในหมูพวกเขามาระยะหนึ่งแลว และเสี่ยงจะลุกลามเปนสิ่งที่อันตรายยิ่งขึ้นหากปลอยไว เราตองจัดการสถานการณนี้และชวยเหลือภาคเกษตรกรรมใหดีที่สุดเทาที่ทําได"
 DEN_industrial_investments: "การลงทุนภาคอุตสาหกรรม"
 DEN_industrial_investments_desc: "ศูนยกลางเมืองก็ไมรอดพนจากความปนปวนในชวงไมกี่ปที่ผานมา อัตราการวางงานพุงสูงลิ่ว ทําใหธุรกิจเจียนจะลมละลายหรือถึงขั้นลมเหลวไปเลย เราอาจเขาไปชวยดวยมาตรการชวยเหลือที่ตรงเปาสําหรับภาคอุตสาหกรรมเพื่อรักษาเสถียรภาพของสถานการณ"
 DEN_support_schleswigian_farmers: "สนับสนุนเกษตรกรชเลสวิก"
 DEN_support_schleswigian_farmers_desc: "ขบวนการชายขอบในจัตแลนดใตกําลังเติบโต โดยมีแรงผลักดันจากสภาพเศรษฐกิจที่ตึงเครียดและความขัดแยงเรื่องอัตลักษณรวมของพวกเขา วาพวกเขาเปนชาวเยอรมันหรือชาวเดนมารกกันแน เราอาจบรรเทาความไมพอใจบางสวนไดดวยการเพิ่มการกระตุนเศรษฐกิจในภูมิภาคนี้"
 DEN_public_works: "โครงการสาธารณูปโภค"
 DEN_public_works_desc: "ดวยการออกโครงการสาธารณูปโภค เราไมเพียงปรับปรุงโครงสรางพื้นฐานของชาติดวยการสรางสะพานเชื่อมหมูเกาะเทานั้น แตยังริเริ่มการกอสรางโครงการที่อยูอาศัยใหมและลดอัตราการวางงานที่ยังสูงอยูไดดวย"
 DEN_fortify_our_borders: "เสริมปอมปราการชายแดน"
 DEN_fortify_our_borders_desc: "ความตึงเครียดกําลังเพิ่มขึ้นทั่วยุโรปอีกครั้ง แมเราจะผานมหาสงครามมาไดโดยไมบอบชํ้า แตก็ไมมีอะไรรับประกันวาจะเปนเชนนั้นอีก เราตองเตรียมรับสิ่งเลวรายที่สุดพรอมกับหวังสิ่งที่ดีที่สุด การปกปองชายแดนและเอกราชของเราคือสิ่งสําคัญอันดับแรก!"
 DEN_build_a_modern_dannevirke: "สรางดานเนอวีรเกสมัยใหม"
 DEN_build_a_modern_dannevirke_desc: "ชาวเดนมารกสรางปอมปราการแข็งแรงหันหนาสูภาคพื้นทวีปยุโรปมาหลายศตวรรษ ที่มีชื่อเสียงที่สุดคือดานเนอวีรเก ขณะที่ [GER.GetNameDef] กําลังติดอาวุธใหมอีกครั้งและปลุกปนมหาอํานาจรอบตัวเรา เราตองสรางดานเนอวีรเกสมัยใหมเพื่อปกปองชายแดน"
 DEN_unlocks_fortification_efforts: "ปลดล็อกการตัดสินใจ: §Yความพยายามสรางปอมปราการ§!\n\n"
 DEN_refortify_tunestillingen: "เสริมปอมทูเนสทิลลิงเงนอีกครั้ง"
 DEN_refortify_tunestillingen_desc: "ครั้งลาสุดที่ยุโรปจมอยูในสงคราม เราเตรียมการปองกันดวยการสรางทูเนสทิลลิงเงน ซึ่งเปนแนวปอมปราการเพื่อปกปองโคเปนเฮเกน นับแตนั้นปอมเหลานี้ก็ทรุดโทรมลง แตดวยการสรางใหมและปรับใหทันสมัย เราจะรักษาความปลอดภัยของเมืองหลวงได"
 DEN_secure_our_supply_lines: "รักษาเสนทางเสบียง"
 DEN_secure_our_supply_lines_desc: "กองทัพเดินดวยทอง - นี่ยังจริงในวันนี้เหมือนเมื่อหลายพันปกอน โชคดีที่เราเปนผูผลิตอาหารรายใหญ และดวยการปรับปรุงการสงกําลังบํารุงเพียงเล็กนอย เราจะรักษาการสงเสบียงใหทหารไดอยางตอเนื่อง"
 DEN_fortify_the_islands: "เสริมปอมปราการหมูเกาะ"
 DEN_fortify_the_islands_desc: "เดนมารกตะวันออกทั้งหมดตั้งอยูบนเกาะนับรอย และกองทัพเรือของเราก็ไมใหญพอจะปกปองทุกเกาะจากกองเรือขนาดใหญกวามากของเพื่อนบาน ดวยการสรางปอมปราการชายฝงในจุดสําคัญ เราอาจขับไลผูรุกรานได"
 DEN_unlocks_coastal_fortification_efforts: "ปลดล็อกการตัดสินใจ: §Yความพยายามสรางปอมปราการชายฝง§!\n\n"
 DEN_connect_the_islands: "เชื่อมหมูเกาะ"
 DEN_connect_the_islands_desc: "[ROOT.GetNameDefCap] ประกอบดวยเกาะจํานวนมาก โดยจุดเดียวที่เชื่อมเรากับแผนดินใหญอยูที่จัตแลนดตอนใต เพื่อใหการเดินทางทั่วประเทศสะดวกขึ้น โดยเฉพาะระหวางเกาะตางๆ เราตองสรางสะพานที่ผูกเราไวใกลชิดกันยิ่งขึ้น"
 DEN_expand_institut_for_teoretisk_fysik: "ขยายสถาบันฟสิกสทฤษฎี"
 DEN_expand_institut_for_teoretisk_fysik_desc: "สถาบันฟสิกสทฤษฎีเปนผูนําดานฟสิกสระดับโลก กอตั้งโดยนักฟสิกสทฤษฎี นีลส บอร ดวยการใหทุนสถาบันและขยายสิ่งอํานวยความสะดวก เราจะไดเก็บเกี่ยวผลประโยชน และอาจถึงขั้นดึงตัวนีลส บอร มารวมอุดมการณของเราได..."
 DEN_aalborg_portland_cement_plant: "โรงงานปูนซีเมนตอาลบอรกพอรตแลนด"
 DEN_aalborg_portland_cement_plant_desc: "แผนดินใหญของเดนมารกยากจนทรัพยากรธรรมชาติ แตการผลิตปูนซีเมนตคือสินทรัพยหนึ่งที่เรามี ดวยการขยายโรงงานปูนซีเมนตอาลบอรกพอรตแลนด เราจะรักษาขีดความสามารถในการกอสรางภายในประเทศไวได"
 DEN_improve_aalborg_portland_tt: "สิ่งนี้จะปรับปรุงบริษัทอุตสาหกรรม §Y$DEN_aalborg_portland$§! ดวย \n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.00%§!\n\n"
 DEN_expand_the_industries: "ขยายอุตสาหกรรมของเรา"
 DEN_expand_the_industries_desc: "เดนมารกพึ่งพาเกษตรกรรมมาแตเดิม ซึ่งยังคงเปนสินคาสงออกที่ใหญที่สุดของเรา หากเรากระจายและขยายอุตสาหกรรมอื่นๆ เราจะเสริมความแข็งแกรงใหเศรษฐกิจโดยรวม และทําใหสังคมเดนมารกรับมือกับการเปลี่ยนแปลงฉับพลันไดดีขึ้น"
 DEN_develop_remote_islands: "ปลดล็อกการตัดสินใจ: §Yพัฒนาหมูเกาะ§!\n\n"
 DEN_support_the_faroes_industries: "สนับสนุนอุตสาหกรรมแฟโร"
 DEN_support_the_faroes_industries_desc: "ในหวงเวลาอันไมแนนอนเชนนี้ การสนับสนุนอุตสาหกรรมไมกี่แหงที่มีอยูบนหมูเกาะแฟโรอาจเปนการตัดสินใจที่ชาญฉลาด ซึ่งจะทําใหการอางสิทธิ์ของเราเหนือหมูเกาะที่ตั้งอยูในทําเลยุทธศาสตรนี้เปนที่ปฏิเสธไมได"
 DEN_support_bornholms_industries: "สนับสนุนอุตสาหกรรมบอรนโฮลม"
 DEN_support_bornholms_industries_desc: "แมบอรนโฮลมจะไมมีทรัพยากรธรรมชาติที่สําคัญ แตการลงทุนในอุตสาหกรรมไมกี่แหงของเกาะนี้ก็อาจเปนความคิดที่ดี และพรอมกันนั้นก็เปนการยํ้าเตือนเพื่อนบานทุกรายวาเกาะนี้เปนของใคร"
 DEN_develop_greenland: "พัฒนากรีนแลนด"
 DEN_develop_greenland_desc: "แผนดินใหญของเดนมารกมีทรัพยากรธรรมชาตินอยที่เราจะพัฒนาและใชในการผลิตภายในประเทศได ในทางกลับกัน กรีนแลนดซึ่งเปนดินแดนของเรากลับอุดมไปดวยทรัพยากรเหลานี้มากกวามาก หากเราลงทุนและพัฒนากรีนแลนด เราจะไดเก็บเกี่ยวผลประโยชน"
 DEN_expand_the_ivittuut_mine: "ขยายเหมืองอิวิตตุต"
 DEN_expand_the_ivittuut_mine_desc: "เหมืองที่อิวิตตุตเปนแหลงอะลูมิเนียมเพียงแหงเดียวของเรา ซึ่งเปนสวนประกอบสําคัญในการผลิตเครื่องบินสมัยใหม ดวยการขยายเหมืองนี้ เราสามารถเรงการผลิตเครื่องบินภายในประเทศ หรือสงออกอะลูมิเนียมไปยังประเทศอื่นได"
 DEN_prospecting_new_sites: "สํารวจแหลงใหม"
 DEN_prospecting_new_sites_desc: "เหมืองเกาที่กาอารซัวรซุกถูกขุดจนหมดแลว แตยังมีแหลงแรอื่นในภูมิภาคคุลลิสซัต การเปดเหมืองใหมที่นี่จะเปนประโยชนอยางยิ่ง ไมเพียงตออุตสาหกรรมในกรีนแลนด แตยังตอบสนองความตองการภายในประเทศของเราดวย"
 DEN_protect_greenland: "ปกปองกรีนแลนด"
 DEN_protect_greenland_desc: "กรีนแลนดเปนสวนหนึ่งของราชอาณาจักรเรามายาวนาน โดยการอางสิทธิ์เหนือเกาะนี้ยอนกลับไปถึงยุคไวกิ้ง การสูญเสียเกาะนี้จะเปนหายนะของชาติและเปนการเสียเกียรติภูมิอยางใหญหลวง เพื่อยับยั้งการโจมตีใดๆ ที่อาจเกิดขึ้นตอเกาะนี้ เราตองเสริมการปองกันใหแข็งแกรง"
 DEN_danske_stalvalsevaerket: "Danske Stålvalseværket"
 DEN_danske_stalvalsevaerket_desc: "ตัวแทนหลายคนจากภาคอุตสาหกรรมไดรณรงคใหเพิ่มการผลิตเหล็กกลา หากเรากอตั้งโรงรีดเหล็กแหงใหม ก็จะชวยกระตุนเศรษฐกิจและทําใหเราพึ่งพาตนเองดานการผลิตเหล็กกลาไดมากขึ้น"
 DEN_reorient_production_lines: "ปรับทิศทางสายการผลิต"
 DEN_reorient_production_lines_desc: "เราตกอยูในสถานการณลอแหลมที่อาจตองการยุทโธปกรณทางทหารเพิ่มเติมในไมชา เพื่อรองรับความตองการอาวุธที่เพิ่มขึ้นนี้ เราตองเปลี่ยนโรงงานพลเรือนมาผลิตอาวุธ"
 DEN_strengthen_military_industries: "เสริมความแข็งแกรงอุตสาหกรรมทหาร"
 DEN_strengthen_military_industries_desc: "การลงทุนในอุตสาหกรรมอาวุธที่แข็งแกรงอาจมีความสําคัญยิ่งในวันขางหนา เราตองมั่นใจวาเราเตรียมพรอมอยางดี หากถึงคราวตองจับอาวุธขึ้นปกปองประชาชนของเรา"
 DEN_protect_the_faroe_islands: "ปกปองหมูเกาะแฟโร"
 DEN_protect_the_faroe_islands_desc: "เมื่อความตึงเครียดของโลกเพิ่มสูงขึ้น ทะเลเหนืออาจกลายเปนสมรภูมิดุเดือดในไมชา หมูเกาะแฟโรเปนจุดเชื่อมสําคัญในการควบคุมกรีนแลนดและทรัพยากรมากมายของมัน การสูญเสียหมูเกาะนี้อาจเปนหายนะสําหรับเรา ดังนั้นการรักษาการปองกันของหมูเกาะนี้จึงสําคัญที่สุด"
 DEN_protect_bornholm: "ปกปองบอรนโฮลม"
 DEN_protect_bornholm_desc: "บอรนโฮลมตั้งอยูในทําเลอันตรายทางใตของ [SWE.GetNameDef] และทางเหนือของ [GER.GetNameDef] ใกลทั้งสองประเทศมากกวาสวนอื่นของเดนมารก เราตองเสริมความแข็งแกรงใหเกาะที่ตั้งอยูในทําเลยุทธศาสตรแหงทะเลบอลติกนี้และรักษาการควบคุมไว"
#Historical Branch
 DEN_declare_neutrality: "ยืนยันความเปนกลางอีกครั้ง"
 DEN_declare_neutrality_desc: "การไมผูกมัดตนเองในสงครามครั้งกอนเปนผลดีตอเราและชวยใหเราพนจากความโหดรายของสงคราม การประกาศความเปนกลางอาจชวยเราไดอีกครั้ง"
 DEN_political_unity: "เอกภาพทางการเมือง"
 DEN_political_unity_desc: "เราจะหวังรักษาความปลอดภัยของชาติไดก็ดวยการรวมมือขามพรรคเทานั้น การวางความขัดแยงทางการเมืองไวขางหนึ่งไมเคยสําคัญเทานี้มากอน และดวยการยึดหลักปฏิบัตินิยมเทานั้นที่เราจะปกปองเดนมารกได"
 DEN_policy_of_disarmament: "นโยบายลดอาวุธ"
 DEN_policy_of_disarmament_desc: "เราดําเนินนโยบายลดอาวุธมาหลายทศวรรษแลว ซึ่งเปนเหตุผลหนึ่งที่ทําใหเรารอดพนจากความโหดรายของมหาสงคราม การไมแสดงทาทีคุกคามตอเพื่อนบานรายใดอาจชวยใหเรารอดพนในครั้งนี้ดวย"
 DEN_import_machinery_and_material: "นําเขาเครื่องจักรและวัสดุ"
 DEN_import_machinery_and_material_desc: "หากเราหวังจะแขงขันกับพลังอุตสาหกรรมของเพื่อนบาน เราตองทําอยางชาญฉลาด การนําเขาเครื่องมือและวัสดุสมัยใหมจากประเทศที่เปนอุตสาหกรรมมากกวาจะชวยเพิ่มขีดความสามารถของเราและพัฒนาใหกาวหนายิ่งขึ้น"
 DEN_modernize_agricultural_machinery: "ปรับเครื่องจักรการเกษตรใหทันสมัย"
 DEN_modernize_agricultural_machinery_desc: "การปรับเครื่องจักรและเทคโนโลยีการเกษตรใหทันสมัยจะใหผลผลิตอุดมสมบูรณอยางมีประสิทธิภาพยิ่งขึ้น และเพิ่มการผลิตได"
 DEN_develop_jutland_states_tt: "ปลดล็อกการตัดสินใจ: §Yพัฒนาภูมิภาคจัตแลนด§!\n\n"
 DEN_agricultural_reinvestments: "ลงทุนซํ้าในภาคเกษตร"
 DEN_agricultural_reinvestments_desc: "เกษตรกรรมมีประสิทธิภาพมากขึ้นดวยการใชเครื่องจักรและการนําเครื่องจักรใหมที่เรานําเขามาใชงาน การนํารายไดภาษีที่เพิ่มขึ้นจากภาคนี้กลับไปลงทุนซํ้าจะเพิ่มประสิทธิภาพไดอีก"
 DEN_industrial_reinvestments: "ลงทุนซํ้าในภาคอุตสาหกรรม"
 DEN_industrial_reinvestments_desc: "การปรับเกษตรกรรมใหทันสมัยไดปลดปลอยผูคนจากงานในไรนา การลงทุนซํ้าในศูนยกลางอุตสาหกรรมในเมืองจะเปดโอกาสงานใหมใหคนเหลานี้ และเพิ่มผลผลิตทางอุตสาหกรรมของเราไปพรอมกัน"
 DEN_increase_produce_production: "เพิ่มการผลิตอาหาร"
 DEN_increase_produce_production_desc: "การลงทุนซํ้าของเราใหผลตอบแทนแลว ทุกคนตั้งแตฟารมเล็กๆ ไปจนถึงสหกรณขนาดใหญตางเจริญรุงเรือง ตอนนี้เราพรอมจะเพิ่มการผลิตอาหารใหมากยิ่งขึ้น"
 DEN_modernize_industrial_machinery: "ปรับเครื่องจักรอุตสาหกรรมใหทันสมัย"
 DEN_modernize_industrial_machinery_desc: "เดนมารกเปนเศรษฐกิจเกษตรกรรมมาแตเดิม โดยพึ่งพาการสงออกอาหาร แตอุตสาหกรรมในเมืองก็มีความสําคัญเพิ่มขึ้นตลอดหลายทศวรรษ ดวยการลงทุนในเครื่องจักรสมัยใหม อุตสาหกรรมจะเติบโตไดยิ่งขึ้น"
 DEN_develop_island_states_tt: "ปลดล็อกการตัดสินใจ: §Yพัฒนาภูมิภาคเกรตเบลต§!\n\n"
 DEN_increase_industrial_production: "เพิ่มการผลิตทางอุตสาหกรรม"
 DEN_increase_industrial_production_desc: "อุตสาหกรรมในเมืองมีความสําคัญเพิ่มขึ้นในระยะหลัง เนื่องจากชวยเพิ่มทั้งการจางงานและผลผลิตทางเศรษฐกิจ แมอุตสาหกรรมของเราจะเพิ่มขีดความสามารถแลว แตก็ยังมีประสิทธิภาพเพิ่มขึ้นไดอีก"
 DEN_research_and_development: "ลงทุนในการวิจัยและพัฒนา"
 DEN_research_and_development_desc: "นํ้ามันและเครื่องจักรคือสิ่งที่ขับเคลื่อนสังคมสมัยใหม และเราตามหลังเกือบทุกดาน เราตองทําใหแนใจวาจะไมตามหลังไปมากกวานี้"
 DEN_north_sea_oil_drilling: "ขุดเจาะนํ้ามันในทะเลเหนือ"
 DEN_north_sea_oil_drilling_desc: "นักสํารวจคนพบแหลงนํ้ามันนอกชายฝงเนอรเรยึลลันด หากเราสกัดนํ้ามันสํารองเหลานี้ได เราจะพึ่งพาตลาดการคาที่ผันผวนนอยลงและพึ่งพาตนเองไดมากขึ้น"
 DEN_potential_refinery_tt: "เมื่อวิจัย §Y$synth_oil_experiments$§! แลว จะเพิ่มชองอาคาร §G1§! ชอง และ §Y$synthetic_refinery$§! §G1§! แหงใน §Y$STATE_99$§!"
 DEN_increase_maritime_trade: "เพิ่มการคาทางทะเล"
 DEN_increase_maritime_trade_desc: "อนาคตอยูบนทองทะเลกวาง และอยูที่กองเรือพาณิชยซึ่งจะสงออกสินคาของเราไปทั่วทุกแหง เราอาจเปนชาติเล็กทั้งในดานประชากรและอิทธิพลทางการเมือง แตเราจะกลายเปนมหาอํานาจทางการคาได"
 DEN_full_employment: "การจางงานเต็มที่"
 DEN_full_employment_desc: "หลังจากทุมลงทุนในอุตสาหกรรมและเกษตรกรรมอยางไมเสียดาย บัดนี้เราไดเก็บเกี่ยวผลประโยชนแลว เราทิ้งปแหงวิกฤตเศรษฐกิจและการวางงานสูงไวเบื้องหลัง ชาติทํางานเต็มกําลังการผลิต และถึงขั้นขาดแคลนคนใหจางงาน ความมั่งคั่งรออยูเบื้องหนา"
#Shared Political Branch
 DEN_social_stability: "เสถียรภาพทางสังคม"
 DEN_social_stability_desc: "เพื่อหลีกเลี่ยงความไรเสถียรภาพทางสังคมที่สั่นคลอนชาติอื่นๆ เราตองดําเนินมาตรการปองกันลวงหนา! กอนจะปฏิรูปอุตสาหกรรมและเศรษฐกิจโดยรวมอยางกวางขวาง เราตองมีจุดยืนที่มั่นคงและมีเสถียรภาพ"
 DEN_welcome_foreign_scientists: "ตอนรับนักวิทยาศาสตรตางชาติ"
 DEN_welcome_foreign_scientists_desc: "ปญหากําลังกอตัวในยุโรปอีกครั้ง และผูคนกําลังหลบหนีจากระบอบที่ตองการกดขี่พวกเขา ดวยการตอนรับคนเหลานี้บางสวนดวยออมแขนที่เปดกวาง เราจะไดรับความรูและความเชี่ยวชาญมากมาย"
 DEN_build_motorveje: "สรางทางหลวงแผนดิน"
 DEN_build_motorveje_desc: "ชวงนี้มีการพูดคุยกันมาก และถึงขั้นวางแผนบางแลว เกี่ยวกับทางหลวงแผนดิน การสรางเครือขายทางหลวงจะชวยใหเดินทางทั่วประเทศไดเร็วขึ้น และผูกประเทศใหแนนแฟนยิ่งขึ้น"
 DEN_heavy_market_regulations: "กฎระเบียบควบคุมอุตสาหกรรมเขมงวด"
 DEN_heavy_market_regulations_desc: "บริษัทอุตสาหกรรมเติบโตจนใหญโตและมั่งคั่งตลอดหลายปที่ผานมา อิทธิพลเหนือเศรษฐกิจของพวกเขาทําใหหลายคนกังวล เราตองควบคุมพวกเขาและอยูภายใตการกํากับดูแลอยางเขมงวด เพื่อใหมั่นใจวาพวกเขาจะไมเอาความตองการของบริษัทมาไวเหนือความตองการของชาติ"
 DEN_limited_market_regulations: "กฎระเบียบควบคุมอุตสาหกรรมแบบจํากัด"
 DEN_limited_market_regulations_desc: "ภาคอุตสาหกรรมมีความสําคัญเพิ่มขึ้นในเศรษฐกิจของชาติตลอดหลายป และถึงขั้นเฟองฟู เราตองควบคุมพวกเขาใหพอดี ไมใหทําลายการเติบโต แตก็มากพอที่จะไมกลายเปนความเสี่ยงตอความมั่นคงของชาติ"
 DEN_no_market_regulations: "ยกเลิกกฎระเบียบควบคุมอุตสาหกรรมทั้งหมด"
 DEN_no_market_regulations_desc: "อุตสาหกรรมเติบโตและเจริญรุงเรืองแมจะมีกฎระเบียบควบคุมตลาด - ไมใชเพราะกฎระเบียบเหลานั้น หากเราตองการใหอุตสาหกรรมของเราแขงขันกับสวนอื่นของโลกไดอยางแทจริง เราตองยกเลิกกฎระเบียบทุกขอที่มีตอพวกเขา"
 DEN_industrial_research_bonus_tt: "โบนัสการวิจัยดานอุตสาหกรรม: §G+5.00%§!"
 DEN_side_with_unions: "เขาขางสหภาพแรงงาน"
 DEN_side_with_unions_desc: "เราจะแกปญหาที่รุมเราตลาดแรงงานไดก็ดวยการปรับปรุงสภาพความเปนอยูของทุกคนใน [Den.GetNameDef] เทานั้น และจะทําไดก็ดวยการเสริมความเขมแข็งใหสหภาพแรงงานเทานั้น"
 DEN_side_with_industry: "เขาขางภาคอุตสาหกรรม"
 DEN_side_with_industry_desc: "เพื่อแกปญหาที่ภาคธุรกิจเผชิญ เราตองลดคาจางและเก็บภาษีสินคานําเขาใหสูงขึ้น มิฉะนั้นนายจางจะดิ้นรนอยูรอดไดยาก"
 DEN_five_year_plan: "ประกาศใชแผนหาป"
 DEN_five_year_plan_desc: "เพื่อรักษาอนาคตของประชาชน เราตองจัดตั้งคณะกรรมการที่สามารถสรางและดําเนินการตามแบบจําลองเศรษฐกิจใหมอันกลาหาญสําหรับ [DEN.GetNameDef] แผนหาปใหมนี้จะทําใหเราเบงบานและเจริญรุงเรืองอยางแทจริง!"
 DEN_limited_social_mobilization: "การระดมพลทางสังคมแบบจํากัด"
 DEN_limited_social_mobilization_desc: "สงครามกําลังคุกคามยุโรป - แตเราตองไมถูกจูโจมโดยไมทันตั้งตัวอีก!  เราตองดําเนินการเตรียมพรอมที่จําเปน แมจะยากลําบากเพียงใด เพื่อรักษาอธิปไตยของเรา"
 #Rearmament Branch
 DEN_start_the_rearmament: "เริ่มการติดอาวุธใหม"
 DEN_start_the_rearmament_desc: "[DEN.GetNameDef] ละเลยกองทัพมานานเกินไป และฝากอธิปไตยของเราไวในมือเพื่อนบาน ดวยความวุนวายที่แผไปทั่วยุโรป เราจะยอมใหเปนเชนนี้ตอไปไมได! เราตองสรางขีดความสามารถทางทหารขึ้นมาอีกครั้ง และทําใหแนใจวาชะตากรรมของเราอยูในมือของเราเอง"
 DEN_national_unity: "เอกภาพแหงชาติ"
 DEN_national_unity_desc: "การติดอาวุธใหมและเสริมสรางกองทัพอยางกะทันหันเชนนี้ตองไดรับการสนับสนุนจากชาวเดนมารกทั้งมวล เราตองพยายามรวมใจประชาชนและกาวไปขางหนาอยางแนวแนเปนหนึ่งเดียว"
 DEN_industrial_preparations: "การเตรียมพรอมดานอุตสาหกรรม"
 DEN_industrial_preparations_desc: "เราตองเตรียมทุกดานของสังคมใหพรอมรับสงคราม - เราจะเสี่ยงถูกจูโจมโดยไมทันตั้งตัวไมได อุตสาหกรรมตองไดรับการเตรียมพรอมกอนเพื่อใหเราพึ่งพาตนเองไดมากขึ้น ซึ่งจะเสริมความสามารถของเราในการตานผูรุกรานไวไดนานพอจนกวาความชวยเหลือจะมาถึง"
 DEN_military_preparations: "การเตรียมพรอมดานการทหาร"
 DEN_military_preparations_desc: "การเตรียมอุตสาหกรรมรับการโจมตีจะไรประโยชนหากกองทัพของเราขับไลศัตรูไมได เราตองเสริมการปองกันและทําใหแนใจวาทหารของเรามีวินัยและความกลาหาญที่จําเปนในการตรึงแนวรบไว"
 DEN_civilian_preparations: "การเตรียมพรอมดานพลเรือน"
 DEN_civilian_preparations_desc: "ไมวากองทัพและภาคอุตสาหกรรมจะเตรียมพรอมเพียงใด ทุกอยางจะสูญเปลาหากความมุงมั่นของพลเรือนพังทลาย และประชาชนเกิดหวั่นไหวในการปองกันประเทศแลวแสวงหาสันติภาพ เราตองหลอหลอมความแนวแนในหัวใจชาวเดนมารกทุกคน และเสริมความเชื่อมั่นในตนเองของพวกเขา"
 DEN_full_social_mobilization: "การระดมพลทางสังคมเต็มรูปแบบ"
 DEN_full_social_mobilization_desc: "สงครามมาถึงหนาประตูบานแลว และเพื่อรักษาอิสรภาพ เราตองระดมทุกภาคสวนของสังคม ชาย หญิง และเด็กทุกคนตองรูหนาที่และพันธะของตน มันจะสรางความบอบชํ้า แตขีดความสามารถทางอุตสาหกรรมทั้งหมดของเราตองมุงไปที่การสนับสนุนการติดอาวุธใหมและความมั่นคงของชาวเดนมารก"
 DEN_seek_protection: "แสวงหาการคุมครอง"
 DEN_seek_protection_desc: "แมเราจะเตรียมพรอมไดมากเทาที่ตองการ แตเราถูกลอมรอบดวยเพื่อนบานที่ใหญและแข็งแกรงกวา ซึ่งเราไมอาจมั่นใจในเจตนาของพวกเขาไดอยางแทจริง ดังนั้นการแสวงหาการคุมครองจากที่อื่นเพื่อรักษาเอกราชของเราจึงเปนความคิดที่ดี"
 DEN_sign_non_aggression_deal: "ลงนามสนธิสัญญาไมรุกราน"
 DEN_sign_non_aggression_deal_desc: "เราจะไดประโยชนอยางมากหากสามารถผูกมิตรกับชาติที่แข็งแกรงกวาและลงนามสนธิสัญญาไมรุกรานกับพวกเขา มันอาจไมเปลี่ยนสถานการณลอแหลมของเราในอนาคตอันใกล แตในระยะยาว ความสัมพันธที่ใกลชิดขึ้นอาจเปนประโยชนตอเราดวยการเปดชองทางขอตกลงการคาตางๆ และเพิ่มความรวมมือ"
 DEN_sign_a_trade_deal: "เจรจาขอตกลงการคา"
 DEN_sign_a_trade_deal_desc: "เรามุงมั่นจะติดอาวุธใหมใหกองทัพ แตสิ่งเหลานี้ตองใชเวลา - เวลาที่เราอาจไมมี เราตองจัดหายุทโธปกรณใหไดมากขึ้นและเร็วขึ้น เราตองหันไปหาชาติที่เปนมิตรและจัดซื้อสิ่งที่ตองการ เนื่องจากขีดความสามารถในการผลิตของเรามีจํากัด"
 DEN_science_pact: "เขารวมโครงการวิจัยและหุนสวน"
 DEN_science_pact_desc: "แมเราจะกาวหนาอยางมากดานวิทยาศาสตรและเทคโนโลยีขณะที่ชาติของเราใหความสําคัญกับอุตสาหกรรมมากขึ้น แตเราก็ยังตามหลังบางชาติอยู หากหันไปหาประเทศที่เปนมิตร เราจะเขารวมโครงการวิจัยและหุนสวนที่เปนประโยชนรวมกันได ซึ่งจะเพิ่มความกาวหนาของเรายิ่งขึ้นไปอีก"
 DEN_territory_for_protection: "แลกดินแดนกับการคุมครอง"
 DEN_territory_for_protection_desc: "โครงการติดอาวุธใหมดําเนินไปตามแผน แตในกองทัพก็ยังมีขอสงสัยวาจะเพียงพอหรือไม เราอาจขายดินแดนบางสวนเพื่อแลกกับการรับประกันการคุมครองที่เปนรูปธรรมยิ่งกวาแคสนธิสัญญาไมรุกราน ขอตกลงเชนนี้อาจเปนประโยชนตอเศรษฐกิจของเราดวยซํ้า"
 DEN_strength_in_numbers: "พลังแหงความเปนปกแผน"
 DEN_strength_in_numbers_desc: "หากเราหวังจะมีโอกาสตอสูกับศัตรูที่แข็งแกรงกวามาก เราตองแสวงหาพันธมิตร - ชางหัวความเปนกลาง! ถึงเวลาทิ้งความไรเดียงสานี้ไวเบื้องหลังและปรับตัวใหเขากับความเปนจริงของโลก"
 DEN_military_cooperation_program: "โครงการความรวมมือทางทหาร"
 DEN_military_cooperation_program_desc: "เมื่อไดพันธมิตรมาแลว ทั้งสองประเทศจะไดเรียนรูจากกันและกันผานโครงการความรวมมือทางทหาร และเพื่อใหขอตกลงนาสนใจยิ่งขึ้น พวกเขาตกลงจะอุดหนุนยุทโธปกรณทางทหารที่เราซื้อจากพันธมิตรใหม เพื่อเสริมความพยายามติดอาวุธใหมของเรา"
 DEN_joint_military_drills: "การซอมรบรวม"
 DEN_joint_military_drills_desc: "ดวยความเปนกลางมาตั้งแตป 1864 กองทัพเดนมารกไมไดเผชิญการรบจริงมานานพอสมควร หากเราติดตอพันธมิตรใหม เราจะเรียนรูจากพวกเขาไดมาก และดวยการซอมรบรวมกัน ทั้งสองชาติจะไดรับประสบการณจากกันและกัน"
 DEN_nordic_security: "ความมั่นคงนอรดิก"
 DEN_nordic_security_desc: "เมื่อรักษาเอกราชของเราไวไดดวยพันธมิตรใหมแลว ในที่สุดเราก็หันความสนใจไปยังประเทศนอรดิกอื่นๆ ได เราตองโนมนาวใหพวกเขาเขารวมฝายของเรา เพื่อที่เราทุกคนจะปกปองกันและกันได และหากพวกเขาไมยอมฟงเหตุผล เราก็จําเปนตองปกปองพวกเขาจากตัวพวกเขาเอง"
#Monarchist Branch
 DEN_unify_the_right: "รวมฝายขวา"
 DEN_unify_the_right_desc: "[DEN.GetNameDefCap] ถูกบริหารอยางไรความรับผิดชอบมานานเกินไปแลว! เปนเพราะความอดทนและความมุมานะของชาวเดนมารกลวนๆ ที่เรายังดํารงอยูในฐานะประเทศได ถึงเวลาที่พรรคการเมืองฝายขวาจะรวมตัวกันในอุดมการณรวมเพื่อตอตานภัยคุกคามฝายซาย!"
 DEN_conservatives_support: "ไดรับการสนับสนุนจากฝายอนุรักษนิยม"
 DEN_conservatives_support_desc: "แมสมาชิกสวนใหญของพรรคอนุรักษนิยมจะไมมีวันคิดรวมมือกับพวกพรรคชาวนาหรือ DNSAP แตก็ยังมีผูที่มองเห็นวา [DEN.GetNameDef] ไรการปองกันและไมพรอมรับพายุที่กําลังจะมาถึงเพียงใด เราตองโนมนาวพวกเขาใหมารวมอุดมการณของเรา!"
 DEN_conspire_with_the_officer_corps: "สมคบคิดกับกลุมนายทหาร"
 DEN_conspire_with_the_officer_corps_desc: "ดวยแนวรวมฝายขวาที่เปนเอกภาพ มีอาณัติทางการเมืองที่กวางขวางขึ้นมาก และมีวาระที่ชัดเจนยิ่งขึ้น บัดนี้เราสามารถติดตอกลุมนายทหารเพื่อโนมนาวใหอยางนอยบางสวนยืนอยูเบื้องหลังเรา"
 DEN_encourage_paramilitary: "สงเสริมองคกรกึ่งทหาร"
 DEN_encourage_paramilitary_desc: "การสงเสริมองคกรกึ่งทหารในทองถิ่นไมเพียงเสริมความมั่นคงของชาติในยามสงคราม แตยังเสริมสรางสํานึกความเปนชุมชนและความสามัคคีในหมูพลเมืองดวย"
 DEN_overthrow_the_government: "โคนลมรัฐบาล"
 DEN_overthrow_the_government_desc: "ประเทศของเราถูกปกครองโดยคนโลภที่เห็นแกตัวมานานเกินไปแลว - เพิกเฉยตออันตรายทั้งปวงที่คุกคามชาวเดนมารก ถึงเวลาสถาปนาระเบียบใหมและนํายุคใหมมาสู [DEN.GetNameDef]!"
 DEN_strengthen_the_officer_corp: "เสริมความแข็งแกรงกลุมนายทหาร"
 DEN_strengthen_the_officer_corp_desc: "นายทหารมีบทบาทสําคัญตอความสําเร็จของปฏิบัติการทางทหาร และเพื่อใหกองทัพมีประสิทธิภาพ เราตองใหความสําคัญกับการเสริมความแข็งแกรงของกลุมนายทหารอีกครั้ง เราตองบมเพาะผูนํารุนใหมที่มีทักษะและทุมเท"
 DEN_king_assumes_power: "พระมหากษัตริยทรงรับอํานาจ"
 DEN_king_assumes_power_desc: "เราตองการมือที่มั่นคงนําเราไปขางหนาในยามไมแนนอนนี้ เราตองการเสถียรภาพและขนบธรรมเนียม บางทีอาจทูลโนมนาวใหพระมหากษัตริยทรงรับอํานาจเต็มเหนือรัฐบาลในยามยุงยากนี้ได"
 DEN_konge_og_faedreland: "เพื่อ Konge og Fædreland"
 DEN_konge_og_faedreland_desc: "ขอใหความทุมเทและเกียรติอันมั่นคงของพระเจาคริสเตียนที่ 10 เปนประภาคารแหงความหวังของมวลชนในยามแหงการทดสอบนี้ เราตองยืนหยัดเปนหนึ่งเดียวในฐานะประชาชาติเพื่อปกปองมาตุภูมิ!"
 DEN_align_industries: "ปรับอุตสาหกรรมใหสอดคลองกับผลประโยชนของชาติ"
 DEN_align_industries_desc: "ความจําเปนในการจัดสรรทรัพยากรอยางมีประสิทธิภาพและผลผลิตทางอุตสาหกรรมที่มุงเปาไดกลายเปนเรื่องสําคัญที่สุด ดวยการประสานความพยายามและปรับการผลิตใหคลองตัว เราจะทําใหทุกโรงงาน ทุกแรงงาน และทุกทรัพยากรถูกใชอยางเต็มศักยภาพเพื่อรับใช [DEN.GetNameDef]"
 DEN_the_royal_guard: "ขยายกองทหารรักษาพระองค"
 DEN_the_royal_guard_desc: "กองทหารรักษาพระองคไดรับมอบหมายใหถวายความปลอดภัยแดพระมหากษัตริยและพระราชวงศมาเกือบ 300 ปแลว และไดพิสูจนตนเองครั้งแลวครั้งเลาวาทุมเทและมั่นคงในหนาที่ ดวยการเพิ่มกําลังพลและวินัยของพวกเขา เราจะเสริมความแข็งแกรงใหกองทัพไดยิ่งขึ้นไปอีก"
 DEN_economic_mobilization_strategy: "ยุทธศาสตรระดมพลทางเศรษฐกิจ"
 DEN_economic_mobilization_strategy_desc: "เราตองเตรียมเศรษฐกิจและมวลชนใหพรอมรับสงครามที่กําลังจะมาถึง เราจะตองใชยุทธศาสตรเศรษฐกิจใหมเพื่อใหอุตสาหกรรมดําเนินไปอยางมีประสิทธิภาพที่สุด พรอมกับโนมนาวชาวเดนมารกใหทําหนาที่เพื่อพระมหากษัตริยและประเทศชาติ"
 DEN_expand_kobenhavns_university: "ขยายมหาวิทยาลัยโคเปนเฮเกน"
 DEN_expand_kobenhavns_university_desc: "เราจะเสี่ยงให [DEN.GetNameDef] กลายเปนดินแดนลาหลังทางเทคโนโลยีไมได การลงทุนในความกาวหนาทางวิทยาศาสตรและการพัฒนาเทคโนโลยีที่มหาวิทยาลัยโคเปนเฮเกนจะทําใหเราไมตามหลังคูแขงในดานใดเลย"
 DEN_scandinavian_security: "ความมั่นคงสแกนดิเนเวีย"
 DEN_scandinavian_security_desc: "สแกนดิเนเวียและทะเลบอลติกเปนจุดสนใจทางภูมิรัฐศาสตรหลักของ [DEN.GetNameDef] มาหลายศตวรรษ กอนจะหันไปสนใจมหาอํานาจยุโรปบนภาคพื้นทวีป เราตองปราบปรามและสยบปกดานเหนือของเราใหไดเสียกอน"
 DEN_reintegrate_iceland: "ผนวกไอซแลนดกลับคืน"
 DEN_reintegrate_iceland_desc: "เมื่อไมนานมานี้ [ICE.GetNameDef] ยังเปนสวนหนึ่งของชาติเรา - และเปนเชนนั้นมาหลายศตวรรษ ถึงเวลาแลวที่เราจะโนมนาวชาว[ICE.GetAdjective]ใหเขารวมราชอาณาจักรของเราและกลับมาเปนชาติเดียวกันอีกครั้ง"
 DEN_develop_iceland: "พัฒนาไอซแลนด"
 DEN_develop_iceland_desc: "ที่ตั้งของไอซแลนดในแอตแลนติกเหนือทําใหเปนจุดที่เหมาะอยางยิ่งในการสงกองเรือออกไปควบคุมทะเลหลวง ดวยการทุมทรัพยากรและเงินทุนไปยังภูมิภาคนี้ เราจะผนวกรวมมันเขากับราชอาณาจักรไดแนบแนนยิ่งขึ้น และใชประโยชนจากที่ตั้งเชิงยุทธศาสตรไดดียิ่งขึ้น"
 DEN_sway_the_nordics: "โนมนาวชาตินอรดิก"
 DEN_sway_the_nordics_desc: "สุภาษิตโบราณที่วา 'ปากกาทรงพลังกวาดาบ' มีความจริงอยูไมนอย การพยายามโนมนาวชาติอื่นมารวมอุดมการณของเราดวยวิถีทางการทูตแทนการใชกําลังดิบเถื่อนอาจเปนทางที่รอบคอบ"
 DEN_offer_protection: "เสนอการคุมครอง"
 DEN_offer_protection_desc: "เพื่อเพิ่มอิทธิพลและอํานาจของเราในภูมิภาคนอรดิกและรอบทะเลบอลติก เราควรสถาปนาความเปนเจาของเดนมารกดวยการเสนอการคุมครองที่เหมาะสมแกผูที่ตองการ การปกปองพี่นองชาวนอรดิกและบอลติกจะเสริมความมั่นคงทั่วทั้งภูมิภาคและเปนประโยชนตอเราทุกคน"
 DEN_secure_swedish_steel: "ยึดเหล็กกลาสวีเดน"
 DEN_secure_swedish_steel_desc: "[DEN.GetNameDefCap] เปนประเทศที่ยากจนทรัพยากร ขาดวัตถุดิบสวนใหญที่จําเปนตอการขับเคลื่อนกองทัพสมัยใหม ในทางกลับกัน สวีเดนมีทรัพยากรธรรมชาติมากมาย - และเคยอยูใตการปกครองของเดนมารก ถึงเวลาแลวที่จะนํา [SWE.GetNameDef] กลับมาอยูใตการปกครองของเราอีกครั้ง"
 DEN_swedish_steel_production: "การผลิตเหล็กกลาสวีเดน"
 DEN_swedish_steel_production_desc: "เมื่อความมั่งคั่งทางแรธาตุของ [SWE.GetNameDef] ตอนเหนืออยูใตอํานาจของเราแลว เราอยูในตําแหนงที่ยอดเยี่ยมในการใชประโยชนจากเหมืองทั้งหมดเพื่อเพิ่มขีดความสามารถในการสกัดแรของเรา และยังสงออกความมั่งคั่งบางสวนไปตางประเทศเพื่อแลกกับการรับประกันความปลอดภัยดวย"
 DEN_finish_off_finland: "รักษาแนวรบดานตะวันออก"
 DEN_finish_off_finland_desc: "ผลประโยชนของเราในสแกนดิเนเวียตอนเหนือจะถูกคุกคามอยูเสมอ หากเราไมรักษาปกดานตะวันออกไวใหมั่นคง เราตองดําเนินมาตรการปองกันลวงหนาเพื่อปกปองดินแดนฟนแลนด!"
 DEN_reclaim_norway: "ทวงคืนนอรเวย"
 DEN_reclaim_norway_desc: "ราชบัลลังกเดนมารกปกครอง [NOR.GetNameDef] มาหลายรอยป กอนที่ชาวสวีเดนจะชิงไปจากเราในป 1814 พระอนุชาของพระมหากษัตริย พระเจาฮากอนแหง  [NOR.GetNameDef] ทรงแสดงใหเห็นวาไมเต็มพระทัยจะทรงควบคุมโดยตรงและตัดสินพระทัยในสิ่งที่จําเปนเพื่อปกปองราษฎรของพระองค ถึงเวลารวมสองประเทศไวใตการปกครองของเดนมารกอีกครั้ง"
 DEN_train_mountain_infantry: "การฝกรบบนภูเขา"
 DEN_train_mountain_infantry_desc: "ภาคตะวันตกและภาคเหนือของสแกนดิเนเวียเปนภูมิประเทศภูเขา - สิ่งที่แผนดินใหญของเดนมารกไมมี เราตองจัดการซอมรบในภูเขาเหลานี้เพื่อเพิ่มขีดความสามารถในการรบและปกปองราชอาณาจักรของเราไดดียิ่งขึ้น"
 DEN_pan_scandinavianism: "ลัทธิรวมสแกนดิเนเวีย"
 DEN_pan_scandinavianism_desc: "สแกนดิเนเวีย และในระดับที่นอยกวาคือภูมิภาคนอรดิกทั้งหมด ผูกพันกันอยางใกลชิดมาหลายพันปดวยประวัติศาสตรรวมอันยาวนาน ดวยการใชสายสัมพันธอันใกลชิดที่มีอยูแลวระหวางประชาชนของเรา เราจะกาวไปสูการรวมชาติได"
#Fascist Branch
 DEN_march_on_the_capital: "เดินขบวนสูเมืองหลวง"
 DEN_march_on_the_capital_desc: "ในที่สุด ถึงเวลาที่พรรคของเราจะลุกขึ้นและกุมอนาคตของ [DEN.GetNameDef] เราตองเดินขบวนสู [ROOT.capital.GetCapitalVictoryPointName] และทําใหเสียงของเราดังกอง! นี่จะเปนจุดเริ่มตนของยุคที่แข็งแกรงและมั่นคงในประวัติศาสตร[DEN.GetAdjective]!"
 DEN_seize_power: "ยึดอํานาจ"
 DEN_seize_power_desc: "ในที่สุด [DEN.GetNameDefCap] ก็พรอมยอมรับรัฐบาลฟาสซิสตชุดใหม เราจะยุบรัฐสภาริกสดัก และฝากอนาคตของชาติอันยิ่งใหญไวในมือของ $DEN_cay_lembcke$ แทน แตหากมีการตอตานแมเพียงเล็กนอย เราตองพรอมบดขยี้มันใหสิ้นซาก"
 DEN_ask_for_support: "ขอการสนับสนุน"
 DEN_ask_for_support_desc: "ชาว[GER.GetAdjective]เปนแบบอยางชั้นเลิศของประเทศที่เราตองการสราง ดวยเหตุนี้ จึงไมมีใครเหมาะไปกวาพวกเขาที่เราจะติดตอขอการสนับสนุนในชวงเวลาอันปนปวนของรัฐบาลนี้ เราควรสงคณะผูแทนไปยัง [GER.capital.GetCapitalVictoryPointName] โดยเร็วที่สุด!"
 DEN_denmark_first: "เดนมารกตองมากอน"
 DEN_denmark_first_desc: "เรามาไกลถึงขนาดนี้ดวยความสามารถของเราเอง แลวทําไมตองไปขอการสนับสนุนจากมหาอํานาจใด? [DEN.GetNameDef]  จะยืนหยัดไดดวยลําแขงตนเอง และเติบโตจนมีความสําคัญไมแพฝายหลักอื่นๆ ในโลก Længe leve Danmark!"
 DEN_rally_the_nation: "ปลุกระดมชาติ"
 DEN_rally_the_nation_desc: "เมื่อเรายึดอํานาจประเทศไดแลว สิ่งสําคัญที่สุดคือการไดรับการสนับสนุนจากประชาชน แมพวกเขาอาจทําอะไรตอตานเราไดไมมากนัก แตการมีประชาชนอยูเคียงขางและพรอมสูเพื่อชาติยอมดีกวาการมีประชาชนที่พรอมแทงขางหลังเรามาก มาฟนฟูความภาคภูมิใจของชาว[DEN.GetAdjective] และปลุกระดมประชาชนใหสูเพื่อประเทศของตน!"
 DEN_dano_german_military_cooperation: "ความรวมมือทางทหารเดนมารก-เยอรมัน"
 DEN_dano_german_military_cooperation_desc: "เพื่อพัฒนากองทัพของเราจนถึงจุดที่บรรลุเปาหมายได อาจเปนเรื่องสําคัญที่เราจะติดตอรัฐบาลรวมอุดมการณใน [GER.GetNameDef] และขอความรวมมือทางทหารและเทคโนโลยี ดวยขอเสนอนี้ อนาคตที่เราวาดฝนไวสําหรับ [DEN.GetNameDef] จะใกลความเปนจริงยิ่งขึ้น"
 DEN_institute_corporatism: "สถาปนาบรรษัทนิยม" 
 DEN_institute_corporatism_desc: "ดวยแรงบันดาลใจจากแบบอยางของอิตาลี แรงงานและนายทุนจากภาคเศรษฐกิจตางๆ ตองมีสวนรวมในการกําหนดนโยบายระดับชาติ เพื่อใหเราไกลเกลี่ยระหวางกลุมเหลานี้และดําเนินการปฏิรูปที่เปนประโยชนสูงสุดตอเศรษฐกิจของชาติ สิ่งนี้จะชวยใหเราวางรากฐานอนาคตทางการเมืองที่มั่นคงให [DEN.GetNameDef]"
 DEN_experimental_technology: "เทคโนโลยีทดลอง" 
 DEN_experimental_technology_desc: "ขณะที่เราพัฒนาเครื่องจักรสงคราม เราก็ควรทําใหแนใจวาภาคการวิจัยและพัฒนายังคงเดินหนาการทดลองตอไป จําเปนอยางยิ่งที่เราตองจัดสรรเงินทุนที่มหาวิทยาลัยและหองปฏิบัติการตองการ เพื่อผลักดันการพัฒนาของเราใหกาวไกลยิ่งขึ้น"
 DEN_assault_troops: "Storm Afdeling"
 DEN_assault_troops_desc: "แมกองทัพจะตรึงแนวรบและผลักดันศัตรูกลับไปไดทีละนอย แตพลังของกองกําลังชั้นยอดตางหากที่จะใหอํานาจที่จําเปนในการทําลายภัยคุกคามใดๆ ที่เราเผชิญ เราควรใหความสําคัญกับการฝกของพวกเขา และทําใหแนใจวาเรามีหนวยรบพิเศษที่เชื่อฟงและมีวินัยพรอมรออยูในกองหนุน"
 DEN_prioritize_navy: "ใหความสําคัญกับกองทัพเรือ"
 DEN_prioritize_navy_desc: "ดินแดนบานเกิดของเราเปนเพียงคาบสมุทรเล็กๆ ดังนั้นจึงสําคัญอยางยิ่งที่เราตองใหความสําคัญกับการพัฒนากองเรือที่รอคอยอยู กองทัพเรือ[DEN.GetAdjective]อาจทัดเทียมกองทัพเรือ[ENG.GetAdjective]หรือ[JAP.GetAdjective]ไดสักวัน แตก็ตอเมื่อเราทุมเวลาและเงินทุนพัฒนามัน"
 DEN_prioritize_army: "ใหความสําคัญกับกองทัพบก"
 DEN_prioritize_army_desc: "กระดูกสันหลังของกองทัพใดๆ คือกองทัพบก หากเราทุมทรัพยากรไปที่การฝกทหารและการผลิตเครื่องจักรสงครามและยุทโธปกรณ เราจะพรอมเกินพอที่จะเผชิญหนากับใครก็ตามที่กลาคุกคาม [DEN.GetNameDef]"
 DEN_total_war: "Total Krig"
 DEN_total_war_desc: "ความสูญเสียของเราในสงครามครั้งนี้เปนสิ่งที่ยอมรับไมได แตนี่ยังไมใชจุดจบ เราตองรวบรวมกําลังทหารและเตรียมพรอมสําหรับสงครามเบ็ดเสร็จ หากเราผลักดันศัตรูกลับไปและทุมทุกสิ่งที่มีใสพวกเขาได เราก็อาจมีโอกาสฝาพายุนี้ไปได ปลุกระดมประชาชน ระดมอุตสาหกรรมที่เหลืออยูทั้งหมด เราตองยืนหยัดไว!"
 DEN_military_might: "การฟนคืนของแสนยานุภาพทางทหาร"
 DEN_military_might_desc: "แสนยานุภาพทางทหารของ [DEN.GetNameDef] แข็งแกรงขึ้นทุกวัน แตก็ยังมีชองวางใหปรับปรุงเสมอ มาทุมงบประมาณไปที่กองทัพบกและกองทัพอากาศ เพื่อปรับปรุงการฝกและประสิทธิภาพในสนามรบ"
#End Focuses
 DEN_avenging_1864: "ลางแคน 1864"
 DEN_avenging_1864_desc: "ความพายแพอันนาอัปยศในป 1864 ทิ้งบาดแผลไวใหชาติเรามากวาครึ่งศตวรรษ ถึงเวลาแลวที่เราจะรักษาชายแดนดานใตใหมั่นคงอยางถาวร และทําใหแนใจวาไมมีศัตรูใดจะมาบงการเงื่อนไขที่เราตองยอมทําตามไดอีก"
 DEN_dominium_maris_baltici: "Dominium Maris Baltici"
 DEN_dominium_maris_baltici_desc: "ครั้งหนึ่ง [ROOT.GetNameDefCap] เคยเปนชาติที่ทรงอํานาจที่สุดรอบทะเลบอลติก เราไดตอสูกับชาวบอลต ชาวโปแลนด ชาวรัสเซีย และเหนือสิ่งอื่นใดคือชาวสวีเดน เพื่อชิงความเปนใหญเหนือทะเลนี้ บัดนี้เราพรอมแลวที่จะนําทั้งภูมิภาคมาอยูใตการควบคุมของเราอยางเด็ดขาด"
 DEN_establish_the_danelaw: "เดนลอว"
 DEN_establish_the_danelaw_desc: "ครั้งหนึ่งอํานาจของเราแผไปทั่วทะเลเหนือ และชาวอังกฤษตองเชื่อฟงกฎหมายของเรา ถึงเวลาผงาดขึ้นอีกครั้งและรักษาอนาคตของประชาชนดวยการครองทองทะเล เราจะฟนฟูเดนลอวและบังคับใหประเทศอื่นทั้งหมดตองเชื่อฟงเรา!"
#Occupation Branch
 DEN_collaboration_government: "Samarbejdsregering"
 DEN_collaboration_government_desc: "การลงนามสนธิสัญญาสันติภาพและรวมมือกับ [?DEN.DEN_overlord_nation.GetNameDef] เปนหนทางเดียวที่จะชวยประชาชนของเราใหพนจากการถูกทําลายลางและความพินาศ ดวยการจัดตั้งรัฐบาลรวมมือที่ทํางานใกลชิดกับกองกําลังยึดครอง[?DEN.DEN_overlord_nation.GetAdjective] เราจะไดรับเอกราชและอธิปไตยมากกวาชาติอื่นสวนใหญที่อยูในสถานการณคลายกัน"
 DEN_seek_independence: "แสวงหาเอกราช"
 DEN_seek_independence_desc: "เอกราชของเดนมารกไมใชสิ่งที่รับประกันไดอีกตอไป แมเราจะรวมมือกับ [?DEN.DEN_overlord_nation.GetNameDef] ก็ตาม เราตองรักษาอิสรภาพดวยการตอตานกองกําลังยึดครอง และโจมตีเมื่อถึงเวลาที่เหมาะสม"
 DEN_sanction_sabotages: "อนุมัติการกอวินาศกรรม"
 DEN_sanction_sabotages_desc: "แมเราจะรวมมือกับ [?DEN.DEN_overlord_nation.GetNameDef] แตก็ไมไดหมายความวาเราจะตอตานการยึดครองอยางสันติไมได อาจกลาวไดวาการตอตานโดยไมทําใหประชาชนตกอยูในอันตรายเปนหนาที่ของเราดวยซํ้า"
 DEN_form_the_danish_freedom_council: "สภาอิสรภาพเดนมารก"
 DEN_form_the_danish_freedom_council_desc: "เราตองรวบรวมแนวรวมสนับสนุนที่กวางขวางจากทุกพรรคการเมืองที่ตอตานการยึดครองของ [?DEN.DEN_overlord_nation.GetNameDef] เพื่อจัดตั้งสภาขึ้น สภาอิสรภาพนี้จะประสานงานขบวนการตอตานตางๆ ที่ลุกขึ้นหลังการรุกรานไดอยางมีประสิทธิภาพยิ่งขึ้น และยังประสานงานสงครามประกาศเอกราชที่อาจเกิดขึ้นไดดวย"
 DEN_arm_the_resistance: "ติดอาวุธใหขบวนการตอตาน"
 DEN_arm_the_resistance_desc: "ขบวนการตอตานมากมายเกิดขึ้นนับตั้งแตการยึดครองเริ่มตน หากเราหวังจะสลัดแอกการกดขี่ของ[?DEN.DEN_overlord_nation.GetAdjective]ได เราตองติดอาวุธใหกลุมเหลานี้ และใหพวกเขาพรอมสําหรับวันที่เราประกาศเอกราชอีกครั้ง"
 DEN_escalate_the_sabotages: "ยกระดับการกอวินาศกรรม"
 DEN_escalate_the_sabotages_desc: "ชัดเจนขึ้นเรื่อยๆ วาเราจะตองสูเพื่อทวงคืนอิสรภาพอีกครั้ง เราตองเพิ่มความรุนแรงของการกอวินาศกรรมตอการยึดครองของ[?DEN.DEN_overlord_nation.GetAdjective]"
 DEN_expand_the_resistance: "ขยายขบวนการตอตาน"
 DEN_expand_the_resistance_desc: "แมจะมีกลุมตอตานมากมายจากทุกสาขาอาชีพเกิดขึ้นนับตั้งแตการยึดครองเริ่มตน แตเราตองรวบรวมผูคนเขารวมกลุมเหลานี้ใหมากยิ่งขึ้น หากหวังจะขับไลกองกําลัง[?DEN.DEN_overlord_nation.GetAdjective]ออกจากแผนดินของเรา"
 DEN_declare_independence: "ประกาศเอกราชเดนมารก"
 DEN_declare_independence_desc: "ถึงเวลาประกาศเอกราชของเราอีกครั้ง และหากจําเปนก็จะสูเพื่อมัน!"
 DEN_secure_danish_freedom: "รักษาอิสรภาพของเดนมารก"
 DEN_secure_danish_freedom_desc: "การขับไลกองกําลัง[?DEN.DEN_overlord_nation.GetAdjective]ออกจากแผนดินของเรายังไมพอที่จะรักษาอิสรภาพของเดนมารกไดอยางแทจริง เราตองทําใหแนใจวา [?DEN.DEN_overlord_nation.GetNameDef] จะไมมีวันกลับมาเปนภัยคุกคามไดอีก"
 DEN_create_danforce: "จัดตั้งกองกําลังเดนมารก"
 DEN_create_danforce_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap] หามเรามีกองทัพที่ใหญพอจะคุกคามความเปนใหญของพวกเขาไดอยางแทจริง เราจึงตองมองหาชาติเสรีที่เปนมิตรจากที่อื่นมาฝกและจัดหายุทโธปกรณใหกองกําลังที่จะรวมปลดปลอย [DEN.GetNameDef] จากการกดขี่"
 DEN_buy_foreign_aircraft: "จัดหาอากาศยานตางชาติ"
 DEN_buy_foreign_aircraft_desc: "เราตองเสริมความแข็งแกรงใหกองพลนอยเดนมารกดวยการจัดหาเครื่องบินเพื่อชิงความเหนือกวากับ [?DEN.DEN_overlord_nation.GetNameDef] ในนานฟาเหนือ [DEN.GetNameDef]"
 DEN_rigid_training: "การฝกอยางเขมงวด"
 DEN_rigid_training_desc: "จํานวนอยางเดียวไมไดทําใหเราครองความเหนือกวาบนทองฟา เราตองใหนักบินผานการฝกอยางเขมขน เพื่อใหพวกเขารักษานานฟาใหปลอดจากเครื่องบิน[?DEN.DEN_overlord_nation.GetAdjective]ได"
 DEN_strengthen_the_danish_brigades: "เสริมความแข็งแกรงกองพลนอยเดนมารก"
 DEN_strengthen_the_danish_brigades_desc: "เราไมมีทางสะสมอํานาจการยิงไดเทากับ [?DEN.DEN_overlord_nation.GetNameDef] ดังนั้นเราตองสูอยางชาญฉลาดและเอาชนะพวกเขาดวยไหวพริบแทน เราตองศึกษาศัตรูและหาจุดออนของพวกเขาเพื่อใชประโยชนในสนามรบ"
 DEN_support_battalions: "กองพันสนับสนุน"
 DEN_support_battalions_desc: "หากกองพลนอยเดนมารกจะเปนกองกําลังที่ใชการไดและมีโอกาสปลดปลอย [ROOT.GetNameDef] พวกเขาตองมียุทโธปกรณที่เพียงพอ ปนเล็กยาวและปนกลก็ดีอยู แตการสนับสนุนจากปนใหญและปนตอสูอากาศยานเปนสิ่งจําเปนในยุคสมัยนี้"
 DEN_expand_the_brigades: "ขยายกองพลนอย"
 DEN_expand_the_brigades_desc: "เพื่อเพิ่มโอกาสใหกองพลนอยเดนมารกปลดปลอย [ROOT.GetNameDef] ได เราตองเพิ่มกําลังพลใหกองพลของพวกเขา"
 DEN_establish_danske_flotille: "จัดตั้งกองเรือเล็กเดนมารก"
 DEN_establish_danske_flotille_desc: "ดวยการจัดตั้งกองเรือเล็กพลัดถิ่น เราจะฝกกําลังพลและจัดการซอมรบทางเรือเพื่อลับคมทักษะของพวกเขาในการชวยปลดปลอยแผนดินของเรา กองเรือของเราจะเผชิญการตอตานอยางหนักจากกองทัพเรือ[?DEN.DEN_overlord_nation.GetAdjective] และเราตองชิงความไดเปรียบดวยทุกวิถีทาง"
 DEN_buy_foreign_ships: "จัดหาเรือพิฆาต"
 DEN_buy_foreign_ships_desc: "เพื่อรักษาแนวชายฝงและหมูเกาะมากมายของ [DEN.GetNameDef] เราตองมีกองเรือที่มีขีดความสามารถในการปกปองเสนทางเดินเรือของเราเสียกอน ดวยการติดตออยางเงียบๆ กับประเทศที่อาจเห็นใจในชะตากรรมของเรา เราอาจจัดหาเรือพิฆาตเกาจากพวกเขามาเสริมกองทัพเรือของเราได"
 DEN_align_with_foreign_powers: "เขาขางมหาอํานาจตางชาติ"
 DEN_align_with_foreign_powers_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap] จะไมยอมสละผืนดินที่ยึดมาแมแตนิ้วเดียวโดยไมสู และเราไมมีทางตอกรกับแสนยานุภาพทางทหารของพวกเขาไดตามลําพัง หากเราตองการสลัดพันธนาการแหงการถูกกดขี่และทวงคืนอิสรภาพ เราตองแสวงหาพันธมิตรที่จะชวยเราในยามยากนี้"
 DEN_seek_foreign_support_tt: "ปลดล็อกการตัดสินใจ: §Yแสวงหาการสนับสนุนจากมหาอํานาจตางชาติ§!"
 DEN_intel_sharing: "แบงปนขาวกรอง"
 DEN_intel_sharing_desc: "การกระชับความรวมมือกับพันธมิตรของเราในการตอตาน [?DEN.DEN_overlord_nation.GetNameDef] ดวยการแบงปนขาวกรองระหวางประเทศจะเสริมสายสัมพันธและความสามารถของเราในการโคนลมการกดขี่ของ[?DEN.DEN_overlord_nation.GetAdjective]ในที่สุด"
 DEN_ask_for_weapons: "ขอรับการสงอาวุธ"
 DEN_ask_for_weapons_desc: "เจานาย[?DEN.DEN_overlord_nation.GetAdjective]ของเราคอยดึงคลังอาวุธและกระสุนของเราไปจนรอยหรอ บั่นทอนความสามารถของเราในการตอบโตเมื่อถึงวันที่เราประกาศเอกราชอีกครั้ง เราอาจขอใหพันธมิตรทิ้งเสบียงที่จําเปนทางอากาศเพื่อเติมเต็มคลังที่วางเปลาของเรา"
 DEN_buy_allied_weapons: "จัดหาอาวุธจากพันธมิตร"
 DEN_buy_allied_weapons_desc: "ในฐานะชาติเล็ก ความสามารถในการผลิตอาวุธยุทธภัณฑของเรามีจํากัด - และเพื่อรักษาเอกราช เราตองจัดหายุทโธปกรณที่ดีที่สุดเทาที่มีอยู บางทีเราอาจโนมนาวพันธมิตรใหจัดหาอาวุธที่จําเปนใหเราผานขอตกลงแบบอุดหนุนราคาได"
 DEN_align_with_overlord: "เขาขาง [?DEN.DEN_overlord_nation.GetNameDef]"
 DEN_align_with_overlord_desc: "แมเราจะรักษาเอกราชไวไดในระดับสูงในขอตกลงสันติภาพกับ [?DEN.DEN_overlord_nation.GetNameDef] แตเราก็ยังเปนเพียงรัฐหุนเชิด อยางไรก็ตาม สิ่งนี้เปดโอกาสอันนาสนใจใหเรา บางที หากเราเขาขาง [?DEN.DEN_overlord_nation.GetNameDef] เราอาจใชประโยชนจากเจาเหนือหัวที่แข็งแกรงกวา และพลิกความพายแพนี้เปนชัยชนะได..."
 DEN_seek_industrial_investments: "แสวงหาการลงทุนทางอุตสาหกรรม"
 DEN_seek_industrial_investments_desc: "เมื่อเขาขาง [?DEN.DEN_overlord_nation.GetNameDef] และไดรับความไววางใจและความโปรดปรานจากพวกเขาบางแลว เราอยูในสถานการณอันเหมาะเจาะที่จะขอใหเจาเหนือหัวลงทุนในอุตสาหกรรมของเราและเสริมขีดความสามารถในการผลิต"
 DEN_pledge_allegiance: "ปฏิญาณความภักดี"
 DEN_pledge_allegiance_desc: "เพื่อใชประโยชนจากความสัมพันธกับ [?DEN.DEN_overlord_nation.GetNameDef] ไดอยางเต็มที่ เราตองปฏิญาณความภักดีตอพวกเขา - ไมใหพวกเขามีขอสงสัยในความจริงใจของเราตอความมุงหมายที่จะสรางหุนสวนแบบพึ่งพาอาศัยกัน ซึ่งทั้งสองชาติจะเติบโตและไดประโยชนรวมกัน"
 DEN_seek_military_investments: "แสวงหาการลงทุนทางทหาร"
 DEN_seek_military_investments_desc: "เมื่อปฏิญาณความภักดีและกระชับความสัมพันธกับ [?DEN.DEN_overlord_nation.GetNameDef] แลว บัดนี้เราไดรับความโปรดปรานจาก [?DEN.DEN_overlord_nation.GetLeader] ซึ่งทําใหเราหันไปหาเขาโดยตรงเพื่อขอการลงทุนจาก[?DEN.DEN_overlord_nation.GetAdjective]ในการผลิตทางทหารของเราได"
 DEN_petition_for_independence: "ยื่นคํารองขอเอกราช"
 DEN_petition_for_independence_desc: "เราไดทําหนาที่ของเราและชวยเหลือนาย[?DEN.DEN_overlord_nation.GetAdjective]ของเราในทุกภารกิจ เราไดแสดงใหเห็นวาเรานาไววางใจและพึ่งพาได จึงถึงเวลาที่เราจะยื่นคํารองขอเอกราช โดยยังคงเปนพันธมิตรที่ภักดีตอ [?DEN.DEN_overlord_nation.GetNameDef]"
 DEN_seize_the_production: "ยึดปจจัยการผลิต"
 DEN_seize_the_production_desc: "ยามวิกฤตพิเศษตองใชมาตรการพิเศษ เพื่อใหบรรลุศักยภาพทางอุตสาหกรรมเต็มที่ เราตองยึดปจจัยการผลิต สิ่งนี้จะทําใหมั่นใจวาอุตสาหกรรมรับใชความตองการของชาติและดําเนินไปอยางมีประสิทธิภาพที่สุด"
 DEN_adjust_industrial_prioritize: "ปรับลําดับความสําคัญทางอุตสาหกรรม"
 DEN_adjust_industrial_prioritize_desc: "สงครามมาถึงแลว และเราตองปฏิบัติใหสอดคลอง ดวยการปรับอุตสาหกรรมใหผลิตและสนับสนุนความพยายามในสงคราม ชายหญิงทุกคนตองเขาใจและปฏิบัติหนาที่ของตนโดยไมปริปากบนเพื่อรับใชความตองการของประเทศ"
 DEN_increase_cooperation: "เพิ่มความรวมมือ"
 DEN_increase_cooperation_desc: "แมเราอาจไมอยากยอมรับ แตเราไมมีทางตานทานการรุกรานของ[?DEN.DEN_overlord_nation.GetAdjective]ได - และดวยการยอมจํานน เราไดรักษาอํานาจปกครองตนเองระดับหนึ่งซึ่งไมมีประเทศอื่นใดภายใต[?DEN.DEN_overlord_nation.GetAdjective]ไดรับ ดังนั้นเราควรพยายามทํางานใกลชิดกับเจาเหนือหัวมากขึ้นเพื่อรักษาเอกราชนี้และเก็บเกี่ยวผลประโยชนจากความสัมพันธนี้"
 DEN_acquire_military_equipment: "จัดหายุทโธปกรณทางทหาร"
 DEN_acquire_military_equipment_desc: "ในฐานะชาติเล็ก ความสามารถในการผลิตอาวุธยุทธภัณฑของเรามีจํากัด - แตเพื่อสนับสนุนความพยายามในสงครามของ [?DEN.DEN_overlord_nation.GetFactionName] อยางแทจริง เราตองจัดหายุทโธปกรณที่ดีที่สุดเทาที่มีอยู บางทีเราอาจโนมนาวพันธมิตรใหจัดหาอาวุธที่จําเปนใหเราผานขอตกลงแบบอุดหนุนราคาได"
 DEN_contribute_to_the_war: "รวมสนับสนุนความพยายามในสงคราม"
 DEN_contribute_to_the_war_desc: "แมเราจะแสดงจุดยืนและเจตนาตอเจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]อยางชัดเจนแลว แตพวกเขาก็จะไมยอมใหเราพัฒนากองทัพไปมากกวานี้ มีเพียงการเขารวม [?DEN.DEN_overlord_nation.GetFactionName] และปฏิญาณวาจะสนับสนุนความพยายามในสงครามเทานั้น เราจึงจะไดรับอนุญาตใหพัฒนากองทัพบก กองทัพเรือ และกองทัพอากาศ และดวยการหนุนหลังจาก [?DEN.DEN_overlord_nation.GetNameDef] เราอาจหันไปมองประเทศนอรดิกที่เหลือได..."
 DEN_secure_the_norwegian_coast: "ยึดครองชายฝงนอรเวย"
 DEN_secure_the_norwegian_coast_desc: "เดนมารกและนอรเวยเคยรวมเปนหนึ่งเดียวมาหลายศตวรรษ และหากเราตองการควบคุมทะเลเหนือหรือแผขยายไปไกลกวานั้น เราตองรวมสองประเทศเขาดวยกันอีกครั้ง ชายฝงนอรเวยคือฐานสําคัญหากเราตองการครองมหาสมุทรแอตแลนติก"
 DEN_reclaim_atlantic_islands: "ทวงคืนดินแดนในแอตแลนติก"
 DEN_reclaim_atlantic_islands_desc: "หมูเกาะแฟโรและไอซแลนดอาจไมมีทรัพยากรธรรมชาติที่เปนชิ้นเปนอัน แตก็ยังเปนสวนหนึ่งของราชอาณาจักรเรา และมีความสําคัญเชิงยุทธศาสตรอยางยิ่ง เพราะหมูเกาะเหลานี้เปนฐานในการครองแอตแลนติกเหนือ\n\nกรีนแลนดเปนดินแดนเดียวของเราที่มีทรัพยากรธรรมชาติที่จําเปนตอการขับเคลื่อนกองทัพสมัยใหมที่มีประสิทธิภาพ จึงเปนเปาหมายสําคัญสูงสุดของเรา"
 DEN_claim_sweden: "อางสิทธิ์เหนือสวีเดน"
 DEN_claim_sweden_desc: "ครั้งหนึ่งชาวสวีเดนเคยเปนคูปรับที่ดุเดือดที่สุดของเรา และอยูใตอํานาจของเราเปนชวงๆ มาหลายศตวรรษ และตางจากเดนมารก สวีเดนมีทรัพยากรธรรมชาติอุดมสมบูรณที่จําเปนตอการขับเคลื่อนกองทัพสมัยใหม บางทีอาจถึงเวลาผนวกสวีเดนเขาสูเขตอิทธิพลของเราอีกครั้ง เพื่อเปดทรัพยากรทั้งหมดใหเรา..."
 DEN_safeguard_the_eastern_front: "ปกปองแนวรบดานตะวันออก"
 DEN_safeguard_the_eastern_front_desc: "ในทางประวัติศาสตร ฟนแลนดอยูนอกเอื้อมของเรามาโดยตลอด แตดวยอํานาจที่ฟนคืนของเรา เรามีความสามารถเกินพอที่จะนํามันมาอยูใตความเปนเจาของเรา การยึดฟนแลนดหมายถึงการรักษาแนวรบดานตะวันออกและเสริมการควบคุมทะเลบอลติกของเรา"
#Military Branch
 DEN_sign_forsvarsforliget: "ลงนามขอตกลงการปองกันประเทศ"
 DEN_sign_forsvarsforliget_desc: "เมื่อความตึงเครียดในยุโรปเพิ่มสูงขึ้นอีกครั้ง เราตองยอมรับวาขีดความสามารถในการปองกันประเทศของเราขาดแคลนอยางหนัก การลงนามขอตกลงการปองกันประเทศฉบับใหมเพื่อเพิ่มงบประมาณใหกองทัพบก กองทัพเรือ และกองทัพอากาศ จะเสริมขีดความสามารถทางทหารและรักษาบูรณภาพของชาติเราไวได"
 DEN_stockpile_oil: "สํารองนํ้ามัน"
 DEN_stockpile_oil_desc: "เราตองพรอมรับสิ่งเลวรายที่สุดและเริ่มเตรียมพรอมสําหรับสงคราม แมเราจะไมไดเขารวมรบเลย ความขัดแยงใหญในละแวกใกลเคียงก็จะสงผลกระทบตอเรา เพื่อลดผลกระทบนี้ เราตองสะสมทรัพยากรยุทธศาสตรสํารองไวในปริมาณมาก"
 DEN_potential_fuel_silos_tt: "เมื่อวิจัย§Yคลังเก็บเชื้อเพลิง§!แลว จะเพิ่มชองอาคาร §G1§! ชอง และ§Yไซโลเชื้อเพลิง§! §G1§! แหง ใน §Y2§! รัฐ"
 DEN_sikkerhedspolitiet: "Sikkerhedspolitiet"
 DEN_sikkerhedspolitiet_desc: "การจัดตั้งหนวยขาวกรองจะชวยเพิ่มความระแวดระวังของเรา ขณะที่ความตึงเครียดในยุโรปเพิ่มขึ้นและความขัดแยงคุกคามที่จะบอนทําลายอธิปไตยของเรา"
 DEN_expand_vaernepligten: "ขยายการเกณฑทหาร"
 DEN_expand_vaernepligten_desc: "กองทัพแทบเปนเพียงกองกําลังเชิงสัญลักษณ ไมมีความสามารถใดเลยที่จะยับยั้งผูคิดจะรุกราน หากจะใหกองทัพปองกันชาติไดจริง เราตองขยายการเกณฑทหารอยางรวดเร็ว"
 DEN_haeren_reorganization: "ปรับโครงสรางกองทัพบก"
 DEN_haeren_reorganization_desc: "กองทัพบกเดนมารกมีขนาดเล็กและไมพรอมเลยที่จะปองกันชายแดนของเรา ตองปรับโครงสรางใหเปนกองกําลังรบที่มีประสิทธิภาพ พรอมกองบัญชาการกลางที่มีประสิทธิผล เพื่อรักษาเอกราชและยับยั้งศัตรูที่อาจเกิดขึ้น"
 DEN_expand_haerens_tekniske_korps: "ขยายกองวิทยาการกองทัพบก"
 DEN_expand_haerens_tekniske_korps_desc: "กองวิทยาการกองทัพบกดูแลคลังแสงอาวุธและโรงงานปนเล็กยาวของกองทัพบก ซึ่งผลิตทั้งอาวุธและกระสุน การขยายสิ่งอํานวยความสะดวกเหลานี้จะเพิ่มการผลิตปนเล็กยาวและปนใหญ ซึ่งยอมเสริมขีดความสามารถทางทหารของเรา"
 DEN_hjemmevaernet: "Hjemmeværnet"
 DEN_hjemmevaernet_desc: "มีผูคนมากมายที่พรอมลุกขึ้นปกปองเดนมารกจากผูรุกรานทุกราย เราควรใชจิตวิญญาณนักสูของคนเหลานี้ดวยการจัดตั้งกองกําลังรักษาดินแดน - เผื่อวาจะมีใครโงพอที่จะรุกรานเรา"
 DEN_expand_dansk_industri_syndikat: "ขยาย Dansk Industri Syndikat"
 DEN_expand_dansk_industri_syndikat_desc: "Dansk Industri Syndikat หรือที่รูจักกันทั่วไปวา Riffelsyndikatet เปนผูผลิตอาวุธรายใหญที่สุดของประเทศ และผลิตปนเล็กยาวแมดเซนใหกองทัพบกของเรา การลงทุนและขยายโรงงานของพวกเขาเปนผลประโยชนดานความมั่นคงของชาติที่สําคัญสูงสุด"
 DEN_new_artillery_tactics: "ยุทธวิธีปนใหญแบบใหม"
 DEN_new_artillery_tactics_desc: "ปจจุบันกองวิทยาการกองทัพบกผลิตปน ปนใหญ และกระสุน แตหากจัดตั้งแผนกทดลองขึ้นภายในกองวิทยาการกองทัพบก เราอาจออกแบบและผลิตปนใหญของเราเองได ซึ่งจะเปนประโยชนอยางยิ่งตอกองทัพบก"
 DEN_convert_automobile_production: "ดัดแปลงการผลิตรถยนต"
 DEN_convert_automobile_production_desc: "ถึงเวลาสั่งใหผูผลิตรถยนตของเดนมารกเปลี่ยนสายการผลิตพลเรือนมาสนับสนุนความพยายามในสงครามและขีดความสามารถในการปองกันของเรา การผลิตรถบรรทุกไดเองและการเพิ่มระดับยานยนตในกองทัพบกจะทําใหกองทัพคลองตัวและยืดหยุนยิ่งขึ้น"
 DEN_slaedepatruljen_sirius: "Slædepatruljen Sirius"
 DEN_slaedepatruljen_sirius_desc: "แผนดินใหญของเดนมารกมีหิมะนอยมากในฤดูหนาว และแทบไมเคยคางอยูนาน แตเรามีกรีนแลนด ที่ซึ่งหิมะหนาเปนกิโลเมตรตลอดทั้งป เราสามารถใชประโยชนจากสิ่งนี้และฝกทหารที่นั่นเพื่อใหพวกเขาปรับตัวเขากับความหนาวเย็น"
 DEN_generalkommandoen: "Generalkommandoen"
 DEN_generalkommandoen_desc: "นายทหารที่ไดรับการฝกมาอยางดี มีวินัยดี และทํางานไดดี คือรากฐานของกองทัพที่ประสบความสําเร็จ เราควรตั้งเปาสรางนายทหารที่มีประสิทธิภาพและความสามารถสูงสุดในโลก และบรรจุพวกเขาเขาสูกองเสนาธิการของเรา"
 DEN_establish_domestic_tank_manufacturing: "กอตั้งการผลิตรถถังในประเทศ"
 DEN_establish_domestic_tank_manufacturing_desc: "การทําสงครามเปลี่ยนแปลงไปอยางมากในศตวรรษที่ 20 - และเราตองเปลี่ยนตามไปดวย กองทัพที่เคลื่อนที่เร็วและโจมตีหนักหนวงคือกุญแจสูชัยชนะในการรบยุคนี้ การมีรถถังที่ผลิตเองจะรับประกันความสําเร็จในสนามรบสมัยใหม"
 DEN_expand_ubadsvabnet: "ขยายกองเรือดํานํ้า"
 DEN_expand_ubadsvabnet_desc: "การปองกันที่ดีที่สุดสําหรับแนวชายฝงและหมูเกาะมากมายของเรา คือการปองกันที่ศัตรูมองไมเห็น การมีกองเรือดํานํ้าขนาดใหญจะทําใหเราโจมตีไดโดยไมถูกสังเกต และถอนกําลังไดโดยไมสูญเสีย"
 DEN_add_basic_submarine_tech_tt: "เพิ่มเทคโนโลยี: §Yเรือชั้นฮาฟมานเดน§!"
 DEN_refit_civilian_ships: "ปรับปรุงเรือเกา"
 DEN_refit_civilian_ships_desc: "เราถูกลอมรอบดวยชาติที่มีกองทัพเรือใหญกวาเรามาก เราตองเพิ่มจํานวนเรือหากตองการตามใหทันขีดความสามารถของพวกเขา ดวยเรือที่มากพอ เราจะตานทานกองทัพเรือสวนใหญได"
 DEN_refit_civilian_ships_decision_tt: "ปลดล็อกการตัดสินใจเพื่อปรับปรุงขบวนเรือลําเลียงใหใชในทางทหาร"
 DEN_modernize_the_navy: "ปรับกองทัพเรือใหทันสมัย"
 DEN_modernize_the_navy_desc: "หากเราตองการปะทะซึ่งหนากับกองทัพเรือชั้นนําในปจจุบัน เราตองมุงเนนคุณภาพมากกวาปริมาณ จํานวนจะไมชวยอะไรหากเราถูกเรือที่ทันสมัยกวาเหนือกวาทั้งดานอํานาจการยิงและความคลองตัว"
 DEN_sovaernets_operative_kommando: "Søværnets Operative Kommando"
 DEN_sovaernets_operative_kommando_desc: "เราตองการโครงสรางกองบัญชาการกลางที่มีความสามารถในการประสานกองทัพเรือของเราอยางมีประสิทธิภาพ เฉพาะนายทหารที่เกงกาจและเฉลียวฉลาดที่สุดเทานั้นที่ควรไดรับความไววางใจใหทําหนาที่นี้"
 DEN_appropriate_odense_staalskibsvaerft: "ยึดอูตอเรือเหล็กโอเดนเซ"
 DEN_appropriate_odense_staalskibsvaerft_desc: "เพื่อขยายขนาดกองทัพเรืออยางแทจริง เราตองการขีดความสามารถในการผลิตเพิ่มเติม การยึดอูตอเรือของ A.P. Møller-Mærsk ในโอเดนเซจะเรงปจจัยการผลิตของเราไดอยางมาก"
 DEN_restructuring_sovaernet: "ปรับโครงสรางกองทัพเรือ"
 DEN_restructuring_sovaernet_desc: "ดวยความสงบสุขมาหลายทศวรรษ ขอบกพรองหลายประการในโครงสรางการบังคับบัญชาทางเรือของเราจึงไมมีใครสังเกตเห็น วิธีเดียวที่จะจัดการกับมันในตอนนี้คือการปรับโครงสรางกองทัพเรือทั้งหมด"
 DEN_baltic_sea_domination: "ครองทะเลบอลติก"
 DEN_baltic_sea_domination_desc: "กอนการผงาดขึ้นของจักรวรรดิรัสเซีย และแมกระทั่งกอนจักรวรรดิสวีเดนอันมีอายุสั้น เดนมารกเคยมุงครองทะเลบอลติก เพื่อรักษาเอกราชและปกปองมาตุภูมิอยางแทจริง เราตองตั้งเปาควบคุมทะเลบอลติกทั้งหมดอีกครั้งดวยความเหนือกวาทางทะเล"
 DEN_north_sea_ambitions: "ความทะเยอทะยานในทะเลเหนือ"
 DEN_north_sea_ambitions_desc: "ชาติของเราแผกวางไกล จากชายฝงยุโรปไปจนถึงทองทะเลแอตแลนติกเหนือ เพื่อปกปองราชอาณาจักรอันกวางใหญนี้และรักษาดินแดนโพนทะเล เราตองเริ่มแผนการอันกลาหาญและทะเยอทะยาน การสรางกองเรือทะเลเหนือที่สามารถชิงนานนํ้าเหลานี้กับมหาอํานาจใดก็ตามที่ตอตานเราตองเปนเปาหมายเดียวของเรา"
 DEN_with_refit_old_ships_completed_tt: "เมื่อทํา §Y$DEN_refit_civilian_ships$§! สําเร็จ:"
 DEN_with_modernize_the_navy_completed_tt: "\nเมื่อทํา §Y$DEN_modernize_the_navy$§! สําเร็จ:"
 DEN_naval_power_projection: "การแผขยายอํานาจทางทะเล"
 DEN_naval_power_projection_desc: "กองทัพเรือที่ใหญและทรงพลังจะไรความหมายหากไมอาจแผเจตจํานงของเราไปทุกมุมของราชอาณาจักร การเชื่อมดินแดนของเราดวยเครือขายฐานทัพเรือจะตรึงความเปนใหญของเราไวทั่วนานนํ้า"
 DEN_baltic_sea_domination_completed_tt: "ทําแผนยุทธศาสตร §Y$DEN_baltic_sea_domination$§! สําเร็จแลว และ [DEN.GetNameDef] เปนเจาของ"
 DEN_north_sea_ambitions_completed_tt: "ทําแผนยุทธศาสตร §Y$DEN_north_sea_ambitions$§! สําเร็จแลว และ [DEN.GetNameDefCap] เปนเจาของ"
 DEN_fromandskorpset: "Frømandskorpset"
 DEN_fromandskorpset_desc: "การปรับปรุงลาสุดทั้งในกองทัพบกและกองทัพเรือไดเสริมความแข็งแกรงทางทหารของเราอยางมาก เรามีความสามารถเกินพอที่จะแผอํานาจไปทั่วทุกแหง ขามนานนํ้าไปถึงชายฝงตางแดน - หากเราตองการ"
 DEN_domestic_designs: "แบบในประเทศ"
 DEN_domestic_designs_desc: "กองทัพอากาศของเราขาดขีดความสามารถอยางรุนแรง สวนใหญมาจากการที่เราไมไดผลิตอากาศยานเอง จึงมีจํานวนไมพอจะสูหากสถานการณเลวรายที่สุด เราตองสรางสายการผลิตเครื่องบินของเราเองภายในประเทศ"
 DEN_foreign_designs: "แบบจากตางประเทศ"
 DEN_foreign_designs_desc: "เหลาทัพอากาศทั้งสองของเราไมมีขีดความสามารถในการออกแบบและสรางเครื่องบินขับไลหรือเครื่องบินทิ้งระเบิดที่ใชงานได เราควรมองหาแหลงอื่นเพื่อซื้ออากาศยาน หากพอใจในแบบ เราก็อาจพิจารณาขอใบอนุญาตการผลิต"
 DEN_unify_flyvevabnet: "รวมกองทัพอากาศ"
 DEN_unify_flyvevabnet_desc: "ในขณะนี้ เรามีกองทัพอากาศสองหนวยที่แยกจากกันโดยสิ้นเชิง คือ Hærens Flyvertropper ของกองทัพบก และ Marinens Flyvevæsen ของกองทัพเรือ ทั้งสองเหลามักขัดแยงกันอยูเสมอ การรวมเปนกองทัพอากาศหนวยเดียวจะสรางยุทธศาสตรที่เปนเอกภาพ และสถาปนาเหลาทัพใหมของกองทัพ"
 DEN_flyvertaktisk_kommando: "Flyvertaktisk Kommando"
 DEN_flyvertaktisk_kommando_desc: "การรวมสองเหลาของกองทัพอากาศเปนหนวยเดียวยังไมพอ เพื่อใหเหลาทัพใหมนี้มีประสิทธิภาพและเปนเอกภาพมากที่สุด เราตองสรางโครงสรางกองบัญชาการกลางที่ประสานงานกองทัพอากาศไดอยางเหมาะสม"
 DEN_air_force_power_projection: "การแผขยายอํานาจทางอากาศ"
 DEN_air_force_power_projection_desc: "บัดนี้เราไดรวมกองทัพอากาศเปนเหลาทัพหลักที่สามของกองทัพแลว เราสามารถมุงรักษานานฟาของราชอาณาจักรอันกวางใหญได กองทัพอากาศที่ใหญและประสบความสําเร็จยังคงตองพึ่งพาฐานทัพอากาศที่ใชขึ้นลงได"
 DEN_flyveskolen: "Flyveskolen"
 DEN_flyveskolen_desc: "เมื่อรวบรวมทักษะและความรูดานกองทัพอากาศทั้งหมดไวในกองทัพอากาศแลว เราควรถายทอดความเชี่ยวชาญนั้นไปยังนักเรียนนายรอยผูมุงมั่น ดวยการจัดตั้งโรงเรียนฝกรวม"
 DEN_torpedofly: "Torpedofly"
 DEN_torpedofly_desc: "หนทางเดียวที่เราจะรักษาดินแดนโพนทะเลไวไดคือความสามารถในการแผอํานาจและเจตจํานงขามนานนํ้า ซึ่งตองอาศัยการประสานงานและยุทธศาสตรทางเรือและทางอากาศขนาดใหญ"
 DEN_jagerfly: "Jagerfly"
 DEN_jagerfly_desc: "เพื่อปกปองเมืองของเราจากการทิ้งระเบิดอันรุนแรงจากทองฟา เราตองทุมทรัพยากรดานการบินไปที่การสรางเครื่องบินขับไลที่ดีที่สุดเทาที่ทําได"
 DEN_luftstotte: "Luftstøtte"
 DEN_luftstotte_desc: "การใชกองทัพอากาศใหเกิดประโยชนสูงสุดคือการสนับสนุนกองกําลังภาคพื้นดินใหดีที่สุด การบินมีความสําคัญอยางยิ่งในสงครามยุคปจจุบัน แตสงครามก็ยังตัดสินชัยชนะกันบนพื้นดิน"
 DEN_bombefly: "Bombefly"
 DEN_bombefly_desc: "หนทางเดียวที่จะรักษา [DEN.GetNameDef] ใหปลอดภัยอยางสมบูรณ คือความสามารถในการทิ้งระเบิดและทําลายขีดความสามารถทางอุตสาหกรรมของศัตรู"
 DEN_advanced_flight: "การบินขั้นสูง"
 DEN_advanced_flight_desc: "การบินมีความกาวหนาอยางรวดเร็วเพียงไมกี่ปที่ผานมา แตยังมีนวัตกรรมและการพัฒนาอีกมากรอเราอยู เพื่อครองนานฟาอยางแทจริง เราตองเปนผูนําความกาวหนาทางเทคโนโลยี!"

