l_english:
 #Opinion modifiers


 #FINLAND
 FIN_suomalainen_sosialismi: "สังคมนิยมแบบฟนแลนด"
 FIN_suomalainen_sosialismi_desc: "ความทุกขยากแสนสาหัสของระบอบทุนนิยมยังคงแผซานไปทั่วสังคมของเรา อันเปนผลจากความหายนะของฝายตอตานการปฏิวัติที่มานเนอรเฮมและพันธมิตรของเขากอขึ้นในสงครามกลางเมือง เราจะปลอยใหเปนเชนนี้ตอไปไมได เราตองหาทางปลดปลอยชนชั้นแรงงาน"
 FIN_towards_a_red_government: "สูรัฐบาลแดง"
 FIN_towards_a_red_government_desc: "เมื่อกระแสการปฏิวัติของกรรมกรโหมกระหนํ่าทั่วประเทศในป 1918 ชนชั้นกรรมาชีพกลับถูกทรยศโดยกองกําลังปฏิกิริยาของมานเนอรเฮมและพันธมิตรชาวเยอรมันของเขา ถึงเวลาแลวที่จะลางแคนใหสหายที่ลวงลับ และสรางสาธารณรัฐของกรรมกรที่เราควรจะมีมาตั้งแตแรกในที่สุด"
 FIN_the_second_finnish_civil_war: "สงครามกลางเมืองฟนแลนดครั้งที่สอง"
 FIN_the_second_finnish_civil_war_desc: "ดวยจิตสํานึกทางชนชั้นที่แผขยายในหมูชนชั้นกรรมาชีพที่เติบโตขึ้น และทักษะการจัดองคกรของผูนํา ในที่สุดเราก็รวบรวมทรัพยากรไดมากพอที่จะโคนลมนายทุนกระฎมพีของเราใหสิ้นซากไปเสียที"
 FIN_the_peoples_democratic_league: "สันนิบาตประชาธิปไตยประชาชน"
 FIN_the_peoples_democratic_league_desc: "สันนิบาตประชาธิปไตยประชาชนเปนหัวหอกในการประสานงานกลุมฝายซายตาง ๆ ใน[FIN.GetNameDef] พวกเขาไดวางรากฐานของพันธมิตรกรรมกรที่แทจริง ซึ่งจะรับประกันไดวาเจตจํานงของชนชั้นกรรมาชีพจะไดรับการปฏิบัติ"
 FIN_cooperate_with_social_democrats: "รวมมือกับพวกสังคมประชาธิปไตย"
 FIN_cooperate_with_social_democrats_desc: "แมพวกเขาจะหลงผิดอยางชัดเจนที่ยอมประนีประนอมกับพวกนายทุน แตเราก็ปฏิเสธไมไดวาพวกสังคมประชาธิปไตยไดรับการสนับสนุนอยางมากจากชนชั้นกรรมาชีพ และผูนําของพวกเขาหลายคนก็เปนผูเชี่ยวชาญในสาขาของตน เราควรรวมมือกับพวกเขามากขึ้นในการสรางสาธารณรัฐของกรรมกร"
 FIN_the_workers_state: "รัฐกรรมกร"
 FIN_the_workers_state_desc: "เมื่อเผด็จการของชนชั้นกรรมาชีพไดรับการสถาปนาอยางมั่นคงแลว บัดนี้เราสามารถเริ่มสรางชาติขึ้นใหมในแบบที่ใหผลประโยชนของชนชั้นกรรมาชีพเปนหัวใจหลักของการเมืองอยางแทจริง ทุกสิ่งตั้งแตวิธีที่เราใหการศึกษาแกลูกหลาน ไปจนถึงวิธีที่เราจัดการโรงงาน จะไดรับการปฏิรูปใหมทั้งหมด"
 FIN_the_red_watch: "หนวยพิทักษแดง"
 FIN_the_red_watch_desc: "ยังมีผูที่หมายจะบอนทําลายทุกสิ่งที่เราสรางขึ้นนับแตสงครามกลางเมือง เพื่อฟนฟูทรราชยแหงทุนนิยมกลับมา ดวยการจัดตั้งกองกําลังพิทักษแดง เราจะมั่นใจไดวากิจกรรมทรยศเชนนั้นจะถูกถอนรากถอนโคนกอนที่จะลุกลามไปทั่วสาธารณรัฐของเรา"
 FIN_approach_the_soviets: "ทาบทามโซเวียต"
 FIN_approach_the_soviets_desc: "สหายของเราใน[SOU.GetNameDef]อยูแถวหนาของการตอสูของชนชั้นกรรมาชีพเพื่อตอตานจักรวรรดินิยมกระฎมพี เราควรติดตอผูนําของพวกเขาและพยายามขอการสนับสนุนในการตอสูกับพวกกระฎมพีใน[FIN.GetNameDef]"
 FIN_antagonize_the_soviets: "เปนปฏิปกษกับโซเวียต"
 FIN_antagonize_the_soviets_desc: "[SOU.GetNameDefCap]อาจหอหุมตนเองดวยวาทกรรมสังคมนิยม แตที่นั่นไมใชสวรรคของกรรมกรเลย เราจะหาหนทางของเราเองในการยกระดับชีวิตของชนชั้นแรงงาน และจะไมรวมมือกับภัยคุกคาม[SOV.GetAdjective]"
 FIN_finno_soviet_pact: "สนธิสัญญาฟนแลนด-โซเวียต"
 FIN_finno_soviet_pact_desc: "ชางหัวความบาดหมางในประวัติศาสตร ชาว[SOU.GetAdjective]ไดพิสูจนแลววาเปนพันธมิตรที่คุมคาในการตอสูเพื่อสังคมนิยม ถึงเวลาแลวที่เราจะทําขอตกลงระหวางรัฐบาลของเราอยางเปนทางการ เพื่อเตรียมรับมือการโจมตีที่หลีกเลี่ยงไมไดจากยุโรปฝายปฏิกิริยา"
 FIN_subsidized_national_industrialization: "การพัฒนาอุตสาหกรรมแหงชาติโดยไดรับเงินอุดหนุน"
 FIN_subsidized_national_industrialization_desc: "[SOU.GetNameDef]กาวหนาไปอยางมากในการระดมพลังการผลิตของชาติขนานใหญผานการพัฒนาอุตสาหกรรม บางทีเราควรขอความชวยเหลือจากผูเชี่ยวชาญของพวกเขาในการเริ่มโครงการลักษณะเดียวกันในฟนแลนด"
 FIN_finnish_learned_societies: "สมาคมวิชาการฟนแลนด"
 FIN_finnish_learned_societies_desc: "แมปญญาชนจํานวนมากของชาติจะหนีไปตางประเทศ แตก็ยังมีอีกไมนอยที่มีวิจารณญาณพอจะยอมรับแนวคิดสังคมนิยม เราควรยกยองปญญาชนเหลานี้ดวยการลงทุนในงานวิจัยของพวกเขา"
 FIN_finnish_federation_of_trade_unions: "สหพันธสหภาพแรงงานฟนแลนด"
 FIN_finnish_federation_of_trade_unions_desc: "สหภาพแรงงานเปนตัวแทนของเจาของที่แทจริงของอุตสาหกรรม นั่นคือกรรมกร การรวมมือกับสหพันธสหภาพแรงงานจะทําใหเราปรับโครงสรางเศรษฐกิจทั้งหมดเพื่อประโยชนของชนชั้นแรงงานได"
 FIN_defensive_preparations: "การเตรียมการปองกัน"
 FIN_defensive_preparations_desc: "ไมวาจะยึดอุดมการณใด ดูเหมือนเราถูกลิขิตใหตองขัดแยงกับเพื่อนบานทางตะวันออก เราตองเตรียมพรอมรับสิ่งที่หลีกเลี่ยงไมไดและขยายแนวปองกันอยางรวดเร็ว หากลมเหลว ชาติของเราอาจถูกศัตรูกลืนกินอีกครั้ง"
 FIN_trade_agreements: "ขอตกลงการคา"
 FIN_trade_agreements_desc: "แมจะไมไดสนับสนุนนโยบายภายในประเทศของเราเสมอไป แตก็มีหลายชาติที่ยินดีทําขอตกลงการคาเพื่อสนับสนุนการปรับปรุงกองทัพของเราใหทันสมัย สวนใหญก็เพื่อใหเราชวยบั่นทอนความมั่นคงของเพื่อนบานที่ไมคอยนาคบหาของพวกเขา"
 FIN_finno_estonian_union: "สหภาพฟนแลนด-เอสโตเนีย"
 FIN_finno_estonian_union_desc: "เรามีประวัติศาสตรรวมกันมายาวนานกับชาวเอสโตเนีย จึงเจ็บปวดที่เห็นพวกเขาติดอยูระหวางมหาอํานาจ รอวันที่บานเกิดของตนจะกลายเปนสมรภูมิอีกแหงในการตอสูระหวางประเทศ บางทีการรวมเปนสหภาพอาจชวยพวกเขาใหพนจากชะตากรรมเชนนั้นได"
 FIN_social_democracy: "สังคมประชาธิปไตย"
 FIN_social_democracy_desc: "เราไดเห็นความลมเหลวและความโหดรายที่เกิดขึ้นเมื่อการปฏิวัติแบบบอลเชวิคถูกปลอยใหลุกลามในชาติใดชาติหนึ่ง หากเราจะสรางสังคมที่ยั่งยืนและเปนประโยชนตอชนชั้นแรงงาน ก็ตองทําผานวิถีทางประชาธิปไตยและสันติวิธีใหมากที่สุดเทาที่จะทําได"
 FIN_pragmatic_socialism: "สังคมนิยมแบบปฏิบัตินิยม"
 FIN_pragmatic_socialism_desc: "แมเราจะรังเกียจวิธีการของพวกบอลเชวิคและพวกพอง แตเราก็ไมปฏิเสธวาตองทําอะไรมากกวานี้เพื่อปลดปลอยชนชั้นแรงงานจากความโหดรายของทุนนิยมสมัยใหม ดวยการนําสังคมนิยมแบบประชาธิปไตยและปฏิบัตินิยมมาใชอยางรอบคอบ เราจะบรรลุเปาหมายนั้นได"
 FIN_sosialistinen_eduskuntaryhma: "กลุมสังคมนิยมในรัฐสภา"
 FIN_sosialistinen_eduskuntaryhma_desc: "กลุมสังคมนิยมในรัฐสภาสนับสนุนการปรองดองกับ[SOU.GetNameDef]แทนการเปนปฏิปกษ ขอเสนอของพวกเขาอาจเปนความหวังที่ดีที่สุดในการรักษาสังคมนิยมในรูปแบบของเราเอง โดยไมถูกแทรกแซงจากชาว[SOU.GetAdjective]"
 FIN_social_democratic_womens_union: "สหภาพสตรีสังคมประชาธิปไตย"
 FIN_social_democratic_womens_union_desc: "ความทุกขยากของสตรีในสังคมถูกละเลยมาตั้งแตครั้งโบราณ การดึงสหภาพสตรีสังคมประชาธิปไตยเขามาสูใจกลางของรัฐบาลมากขึ้นจะทําใหเราแกไขขอกังวลของพวกเธอไดในที่สุด และสรางสังคมที่เทาเทียมยิ่งขึ้นสําหรับทุกคน"
 FIN_mineral_wealth: "ความมั่งคั่งทางแรธาตุ"
 FIN_mineral_wealth_desc: "[ROOT.GetNameDefCap]มีทรัพยากรธรรมชาติอุดมสมบูรณที่ยังไมไดนํามาใช หากเราจะรักษากองกําลังทหารที่นาเกรงขามไว เราควรใชประโยชนจากทรัพยากรเหลานี้และเพิ่มการพึ่งพาตนเองทางเศรษฐกิจ"
 FIN_funds_from_kalevala_koru_oy: "เงินทุนจาก Kalevala Koru Oy"
 FIN_funds_from_kalevala_koru_oy_desc: "Kalevala Koru Oy ผูผลิตเครื่องประดับชั้นดีที่กอตั้งโดยสมาชิกสหภาพสตรีสังคมประชาธิปไตย ประสบความสําเร็จอยางงดงาม การใชความเชี่ยวชาญของพวกเขาจะชวยกระตุนเศรษฐกิจของเรา และนําความมั่งคั่งไปเปนทุนสําหรับโครงการอื่น ๆ ได"
 FIN_join_the_comintern: "เขารวม[GetSovietFactionForFinland]"
 FIN_join_the_comintern_desc: "เราตองละทิ้งแนวคิดชาตินิยมอันลาสมัยและความบาดหมางที่มาพรอมกับมัน แลวรวมมือกับ[SOU.GetNameDef] เราจะรวมกันพลิกสถานการณตอกองกําลังปฏิกิริยาแหงยุโรป พรอมกับรักษาอนาคตของเราเองไวได"
 FIN_finnish_influence_in_the_baltic: "อิทธิพลของฟนแลนดในบอลติก"
 FIN_finnish_influence_in_the_baltic_desc: "ความมั่นคงรวมของภูมิภาคบอลติกขึ้นอยูกับการที่ชาติซึ่งมีแนวคิดเดียวกันรวมมือกัน และทําใหทุกฝายมีการปองกันที่นาเชื่อถือตอกองกําลังผูรุกราน ดังนั้น เราควรทําใหเพื่อนบานทุกชาติมุงไปในทิศทางเดียวกัน"
 FIN_approach_major_democracies: "ทาบทามชาติประชาธิปไตยหลัก"
 FIN_approach_major_democracies_desc: "เรามีผลประโยชนรวมกับชาติเสรีประชาธิปไตยของโลกที่ตองการจํากัดอิทธิพลที่ขยายตัวของผูเลนที่กาวราวในภูมิรัฐศาสตร บางทีเราอาจรวมมือกันเพื่อเปาหมายรวมนี้ได"
 FIN_finnish_autonomy: "อํานาจปกครองตนเองของฟนแลนด"
 FIN_finnish_autonomy_desc: "แมแตคอมมิวนิสตที่ทุมเทที่สุดบางคนในหมูพวกเราก็ยังกังวลวาการรวมมือกับ[SOU.GetNameDef]จะนําไปสูการที่รัสเซียครอบงําการเมืองของเราโดยพฤตินัย แตดวยการทูตอยางรอบคอบ เราไดบรรลุความเขาใจกับพันธมิตรของเราที่รับประกันอํานาจปกครองตนเองของเรา"
 FIN_integrate_kola_and_karelia: "ผนวกรวมโคลาและคาเรเลีย"
 FIN_integrate_kola_and_karelia_desc: "แมเราจะสรางความสัมพันธความรวมมืออันแนนแฟนกับสหาย[SOU.GetAdjective]ของเราแลว แตขอพิพาทเรื่องพรมแดนยังคงลอยอยูเหนือความสัมพันธนี้ราวกับเมฆฝนที่พรอมจะตกลงมา บางทีเราควรเคลียรบรรยากาศและจัดการปญหาเหลานี้ในฐานะพันธมิตรแทนที่จะเปนศัตรูเสียที"
 FIN_keepers_of_the_baltic_countries: "ผูพิทักษประเทศบอลติก"
 FIN_keepers_of_the_baltic_countries_desc: "ชาวบอลติกแทบไมสนใจจะถูกกลืนเขาไปเปนสวนหนึ่งของ[GER.GetNameDef]หรือ[SOU.GetNameDef] มีเพียงเราเทานั้นที่มีประวัติศาสตรและมุมมองรวมกัน ที่สามารถนําชาติเหลานี้อยางสันติในแบบที่ไมทําลายพวกเขา"
 FIN_british_threat: "ภัยคุกคามจากอังกฤษ"
 FIN_british_threat_desc: "[ENG.GetNameDefCap]คือหัวใจของเศรษฐกิจกระฎมพีโลกและหนวดปลาหมึกแหงจักรวรรดินิยมของมัน เราตองแทงกริชทะลุหัวใจนั้นอยางแรง เพื่อใหโลกเปนอิสระจากการกดขี่ของมันเสียที"
 FIN_red_finland: "ฟนแลนดแดง"
 FIN_red_finland_desc: "เราไดลางแคนใหสหายที่สละชีพในความหวาดกลัวขาวดวยการสรางสาธารณรัฐของกรรมกรที่แทจริงแลว ตอนนี้สิ่งที่เหลืออยูคือการปกปองสิ่งที่เราไดมาจากผูคนนอกพรมแดนที่ตองการทําลายมัน"
 FIN_united_under_the_north_star: "รวมกันใตดาวเหนือ"
 FIN_united_under_the_north_star_desc: "มิตรสหายชาวนอรดิกของเราตกอยูใตความเมตตาของมหาอํานาจจักรวรรดินิยมที่ไมสนใจผลประโยชนของภูมิภาคเรา แตหากรวมมือกัน เราจะรักษาสันติภาพใหประชาชนไดดวยการสรางพันธมิตรที่ทําใหแมแตจักรวรรดิที่ทรงอํานาจที่สุดยังตองยั้งมือ"
 FIN_preserve_sapmi: "ปกปองซาปมี"
 FIN_preserve_sapmi_desc: "ชาวซามีทนทุกขจากการกดขี่ของจักรวรรดินิยมมาเนิ่นนาน ทั้งภายในพรมแดนของเราและนอกพรมแดน เราควรชดเชยใหแกพวกเขาและชวยปลดปลอยพวกเขาจากความทุกขที่เพื่อนบานของเรายังคงกอขึ้น"
 #FIN_confederated_finno_russian_republics: "Confederated Finno-Russian Republics"
 FIN_confederated_finno_russian_republics_desc: "ผูคนหลากหลายกลุมบัดนี้อยูภายใตการปกครองของเรา เพื่อปองกันไมใหเกิดลําดับชั้นระหวางกลุมชนในรัฐของเรา เราจะปรับโครงสรางรัฐบาลเปนสมาพันธแหงสาธารณรัฐ ซึ่งจะทําใหทุกคนมีสิทธิ์มีเสียงอยางเปนธรรมในการปกครองตนเอง"
 FIN_secure_the_baltic_sea: "ยึดครองทะเลบอลติกใหมั่นคง"
 FIN_secure_the_baltic_sea_desc: "แมเรามักจะใหความสําคัญกับพรมแดนทางบกและวิธีปองกันใหดีที่สุด แตเราจะปลอยใหความพยายามสูญเปลาดวยการละเลยจุดออนของแนวชายฝงไมได เราจึงตองลงทุนในโครงการปองกันชายฝงขนาดใหญเพื่อปกปองปกดานนี้"
 FIN_german_threat: "ภัยคุกคามจากเยอรมนี"
 FIN_german_threat_desc: "ลัทธิทหารนิยมปรัสเซียไดผงาดหัวอันนาเกลียดขึ้นอีกครั้งที่[GER.Capital.GetCapitalVictoryPointName] ขณะที่ชาติอื่นพอใจจะเห็นเมืองหลวงทั่วยุโรปอยูใตรองเทาบูตของ[GER.GetLeader] แตเราไมยอม ถึงเวลาแลวที่ภัยตอสันติภาพนี้จะถูกจัดการใหสิ้นซาก"
 FIN_socialist_welfare: "รัฐสวัสดิการสังคมนิยม"
 FIN_socialist_welfare_desc: "ดวยการบริหารเศรษฐกิจและการปองกันประเทศอยางรอบคอบ บัดนี้เรามีทรัพยากรพอที่จะตอบแทนผูใชแรงงานดวยการสถาปนารัฐสวัสดิการที่แทจริง เราจะทําใหประชาชนมีชีวิตที่ยืนยาวและมีความสุข"
 FIN_aid_for_entrepreneurs: "ชวยเหลือผูประกอบการ"
 FIN_aid_for_entrepreneurs_desc: "แมเราจะตองจํากัดดานที่เลวรายที่สุดของทุนนิยม แตเศรษฐกิจของเราอาจไดประโยชนมากจากกิจกรรมการประกอบการที่เพิ่มขึ้น การจัดตั้งทุนสนับสนุนการลงทุนและเงินกูใหแกอุตสาหกรรมสําคัญจะชวยกระตุนกิจกรรมดังกลาวได"
 FIN_soviet_threat: "ภัยคุกคามจากโซเวียต"
 FIN_soviet_threat_desc: "[SOU.GetNameDefCap]คือภัยคุกคามตอชีวิตของชนชั้นแรงงานทั่วโลก เพราะจะไมลังเลเลยที่จะผลักพวกเขาเขาสูสงครามพิชิต กอนที่มันจะสะสมกําลังมากเกินไป เราตองยุติภัยคุกคามนี้เสียตั้งแตตอนนี้"
 FIN_proclaim_greater_finland: "ประกาศสถาปนามหาสหพันธรัฐฟนแลนด"
 FIN_proclaim_greater_finland_desc: "บัดนี้พรมแดนของเราขยายกวางเกินกวาที่เคยจินตนาการไวเมื่อไมกี่ปกอน ดวยดินแดนใหมจํานวนมาก จึงจําเปนตองปรับโครงสรางรัฐบาลใหสะทอนความหลากหลายของภูมิภาคที่ปกครองไดดียิ่งขึ้น"
 FIN_control_the_flux_of_iron_ore: "ควบคุมการไหลเวียนของแรเหล็ก"
 FIN_control_the_flux_of_iron_ore_desc: "แรเหล็กของสวีเดนและการขนสงผานนอรเวยยังคงเปนกลไกที่ใชทําสงครามทั่วทวีปและไกลออกไป เราตองยึดกุมกระแสทรัพยากรสําคัญนี้ไวกอนที่มันจะตกไปอยูในมือศัตรู"

 FIN_finnish_neutrality: "ความเปนกลางของฟนแลนด"
 FIN_finnish_neutrality_desc: "ความแข็งแกรงและความมุงมั่นของประชาชนเราที่จะตอสูเพื่ออิสรภาพนั้นไมอาจลบเลือนได อยางไรก็ตาม เราควรดําเนินนโยบายเปนกลาง เพื่อไมใหเพื่อนบานมีเหตุผลที่จะดับเอกราชที่เราไดมาอยางยากลําบาก"
 FIN_the_finnish_swedish_peoples_party: "พรรคประชาชนสวีเดนแหงฟนแลนด"
 FIN_the_finnish_swedish_peoples_party_desc: "ผูมีเชื้อสายสวีเดนเปนชนกลุมนอยจํานวนมากในฟนแลนด การรวมมือกับพรรคที่เปนตัวแทนผลประโยชนของพวกเขาอยางแข็งขันที่สุดอาจทําใหนโยบายของเราไดรับการสนับสนุนอยางมาก และไดรับความเอ็นดูจากสวีเดนเองดวย"
 FIN_align_the_agrarian_league: "ดึงสันนิบาตเกษตรกรมาเปนพวก"
 FIN_align_the_agrarian_league_desc: "[ROOT.GetNameDefCap]ผานการพัฒนาอุตสาหกรรมอยางนาทึ่งในศตวรรษที่ผานมา แตเราไมอาจเพิกเฉยตอความทุกขยากของผูคนนับลานที่เลี้ยงปากทองคนทั้งชาติดวยแรงงานเกษตร การรวมมือกับสันนิบาตเกษตรกรจะทําใหขอกังวลของพวกเขาไดรับการแกไขไมแพคนในเมือง"
 FIN_political_unity: "เอกภาพทางการเมือง"
 FIN_political_unity_desc: "ไมวาจะมีอุดมการณทางการเมืองแบบใด เราทุกคนลวนตองการสิ่งที่ดีที่สุดใหประชาชน ในยามวิกฤตเชนนี้ เราตองวางความขัดแยงทางการเมืองเล็ก ๆ นอย ๆ ลงและรวมมือกัน"
 FIN_collaboration_with_the_left: "รวมมือกับฝายซาย"
 FIN_collaboration_with_the_left_desc: "การผลักไสพรรคฝายซายแทบไมไดชวยใหรัฐบาลของเราเขมแข็งขึ้น แตหากเราหาทางรวมมือกับพวกเขาได เราอาจดึงประชาชนมาสนับสนุนเปาหมายของเราไดมากขึ้น"
 FIN_railways_and_infrastructure: "ทางรถไฟและโครงสรางพื้นฐาน"
 FIN_railways_and_infrastructure_desc: "มหาสงครามไดแสดงใหเห็นความจําเปนของเครือขายทางรถไฟและถนนที่แข็งแรง ซึ่งชวยใหอุตสาหกรรมและกองทัพขนสงทรัพยากรหรือผูคนไปยังที่ที่ตองการ หลังการยึดครองและการนองเลือดนานหลายทศวรรษ เครือขายการสงกําลังบํารุงของเราตองการการลงทุนอยางเรงดวน"
 FIN_repurpose_small_industries: "ปรับใชอุตสาหกรรมขนาดเล็ก"
 FIN_repurpose_small_industries_desc: "แมเราจะไมมีอุตสาหกรรมขนาดมหึมาเหมือนมหาอํานาจ แตเราก็มีโรงงานขนาดเล็กจํานวนมากที่ดําเนินการอยู แทนที่จะเริ่มตนจากศูนย เราควรปรับสถานประกอบการขนาดเล็กเหลานี้มาใชผลิตเพื่อการสงคราม"
 FIN_expand_state_military_factories: "ขยายโรงงานทหารของรัฐ"
 FIN_expand_state_military_factories_desc: "โรงงานที่รัฐดําเนินการกําลังดิ้นรนเพื่อตอบสนองความตองการของกองทัพในยามวิกฤตนี้ หากเราตองการรักษาเสนทางเสบียงไว เราตองขยายโรงงานผลิต"
 FIN_a_new_course_for_kokoomus: "เสนทางใหมของพรรคโคโคโอมุส"
 FIN_a_new_course_for_kokoomus_desc: "เหตุการณที่ผานมาทําใหพรรคโคโคโอมุสไดรับการสนับสนุนพุงสูงขึ้น เมื่อประชาชนมองหาผูนําที่เขมแข็งและมีเหตุผล รวมถึงการกลับคืนสูคานิยมดั้งเดิม เราควรใชโอกาสนี้ผลักดันวาระอนุรักษนิยมของพรรค"
 FIN_the_finnish_throne: "ราชบัลลังกฟนแลนด"
 FIN_the_finnish_throne_desc: "พรรคโคโคโอมุสสนับสนุนการมีพระมหากษัตริยฟนแลนดมานาน ดวยการสนับสนุนที่เพิ่มขึ้นและการกุมอํานาจที่แนนหนาขึ้น บัดนี้พวกเขาจึงมีหนทางที่จะยุบระบอบปจจุบันและสถาปนาราชอาณาจักรขึ้นแทน"
 FIN_strengthen_military_administration: "เสริมความเขมแข็งการบริหารของกองทัพ"
 FIN_strengthen_military_administration_desc: "มานเนอรเฮมนําชาติของเราผานชวงเวลาอันวุนวายนี้อยางกลาหาญ ฝาหลักการทางการเมืองดวยความแมนยําแบบทหาร เพื่อความอยูรอดของชาติ เราตองมอบอํานาจใหเขาและกองทัพปกครองตามที่เห็นสมควร"
 FIN_dreams_of_expansionism: "ความฝนแหงการขยายดินแดน"
 FIN_dreams_of_expansionism_desc: "ริสโต ริวตียอมรับอยางถูกตองวาเราจะไมมีวันมีสันติภาพที่ยั่งยืน จนกวาเราจะควบคุมดินแดนคาเรเลียทางตะวันออกได เมื่อดินแดนนั้นมั่นคงแลว เราจะมีพรมแดนที่ปองกันไดงายขึ้นมากกับเพื่อนบาน"
 FIN_reach_out_to_scandinavia: "ทาบทามสแกนดิเนเวีย"
 FIN_reach_out_to_scandinavia_desc: "เพื่อนบานสแกนดิเนเวียสวนใหญมีความรูสึกเชนเดียวกับเรา และไมตองการถูกลากเขาสูความขัดแยงของมหาอํานาจ การรักษาความสัมพันธอันแนนแฟนกับพวกเขาอาจชวยวางรากฐานการปองกันรวมของเราได"
 FIN_moderate_politics: "การเมืองสายกลาง"
 FIN_moderate_politics_desc: "ขณะที่ความตึงเครียดระหวางมหาอํานาจกําลังคุกรุน เราตองทําใหแนใจวารัฐบาลของเราไมถูกมองวาผอนปรนตออุดมการณของฝายใดมากเกินไป ดังนั้น เราตองดําเนินนโยบายสายกลางภายในประเทศ"
 FIN_join_the_allies: "เขารวม[GetAlliesFactionForFinland]"
 FIN_join_the_allies_desc: "ความเปนกลางกําลังกลายเปนนโยบายลาสมัยอยางรวดเร็ว ซึ่งรังแตจะนําไปสูการตกเปนเมืองขึ้นของมหาอํานาจ แมจะเปนความเสี่ยงเมื่อพิจารณาจากที่ตั้งทางภูมิรัฐศาสตรของเรา แตการเขารวมฝายสัมพันธมิตรอาจชวยใหเรารักษาอธิปไตยไวไดในระยะยาว"
 FIN_northern_defense_front: "แนวปองกันฝายเหนือ"
 FIN_northern_defense_front_desc: "เพื่อนบานของเราทั่วสแกนดิเนเวียและบอลติกเปนเหยื่อที่งายดายของมหาอํานาจ แตหากเรารวมทรัพยากรและรวมมือกันทางทหาร เราอาจทําใหแมแตศัตรูที่ยิ่งใหญที่สุดไมกลาโจมตีเราได"
 FIN_the_lone_wolf: "หมาปาเดียวดาย"
 FIN_the_lone_wolf_desc: "ไมมีใครใสใจผลประโยชนของชาว[ROOT.GetAdjective]มากไปกวาชาว[ROOT.GetAdjective]เอง ประวัติศาสตรไดแสดงใหเห็นแลววาแทนที่จะรอใหผูอื่นมาชวย เราตองพึ่งพาตนเอง"
 FIN_military_aid: "ความชวยเหลือทางทหาร"
 FIN_military_aid_desc: "ฝายสัมพันธมิตรมีผูผลิตอาวุธมากมาย เราควรใชประโยชนจากพวกเขาเพื่อปรับปรุงกองทัพของเราใหทันสมัยอยางรวดเร็ว"
 FIN_mineral_wealth_development: "พัฒนาความมั่งคั่งทางแรธาตุ"
 FIN_mineral_wealth_development_desc: "ดวยภูมิศาสตรและเพื่อนบานของเรา มีความเปนไปไดที่เราจะถูกตัดขาดจากพันธมิตรหรือคูคาทางเศรษฐกิจ เราจึงควรใชทรัพยากรที่ยังไมไดใชของชาติเพื่อใหมั่นใจวาเราจะสูตอไปไดแมถูกโดดเดี่ยว"
 FIN_industrialize_the_region: "พัฒนาอุตสาหกรรมในภูมิภาค"
 FIN_industrialize_the_region_desc: "แมแสนยานุภาพรวมของแนวปองกันฝายเหนือจะมีมาก แตเราตองทํามากกวานี้เพื่อใหเศรษฐกิจของเราคํ้าจุนมันไดในสงครามยืดเยื้อ เพื่อการนั้น เราตองลงทุนฟนฟูอุตสาหกรรมของเรา"
 FIN_increase_military_investment: "เพิ่มการลงทุนทางทหาร"
 FIN_increase_military_investment_desc: "ดานเศรษฐกิจและการสงกําลังบํารุงของความขัดแยงมีความสําคัญตอการอยูรอดของเราไมแพการรบในแนวหนา ดังนั้น เราควรลงทุนในอุตสาหกรรมอาวุธเพื่อใหมั่นใจวาจะสงยุทโธปกรณทุกอยางที่กองกําลังของเราตองการไดอยางตอเนื่อง"
 FIN_cooperation_with_germany: "รวมมือกับเยอรมนี"
 FIN_cooperation_with_germany_desc: "เราพึ่งพาความเปนจริงทางภูมิรัฐศาสตรไดวา[GER.GetNameDef]และ[SOU.GetNameDef]จะตองปะทะกันในที่สุด หากเรารวมมือกับชาว[GER.GetAdjective] เราอาจลางแคนความสูญเสียในสงครามครั้งกอนกับชาว[SOU.GetAdjective]ได และเปดโอกาสใหม ๆ ใหตัวเราเอง"
 FIN_wartsila_engine_production: "การผลิตเครื่องยนตของแวรตซิลา"
 FIN_wartsila_engine_production_desc: "การมีทักษะและขีดความสามารถในการผลิตเครื่องยนตของเราเองสําหรับกองทัพจะชวยเพิ่มความมั่นคงของชาติ การรวมมือกับพันธมิตรและบริษัทในประเทศอยางแวรตซิลาจะทําใหเราบรรลุความมั่นคงระดับนั้นได"
 FIN_german_military_advisors: "ที่ปรึกษาทางทหารชาวเยอรมัน"
 FIN_german_military_advisors_desc: "การสงครามกําลังเปลี่ยนแปลงอยางรวดเร็วจากการใชยุทโธปกรณยานยนตและอากาศยาน บางทีถึงเวลาแลวที่เราจะเรียนรูจากสหายรวมรบชาว[GER.GetAdjective]ถึงวิธีใชทรัพยากรใหมเหลานี้ใหเปนประโยชนที่สุด"
 FIN_finnish_march_of_conquest: "การเดินทัพพิชิตของฟนแลนด"
 FIN_finnish_march_of_conquest_desc: "เราตกเปนฝายตั้งรับตอ[SOU.GetNameDef]และรัฐกอนหนามานานเกินไปแลว บัดนี้ถึงเวลาพลิกสถานการณและผลักดันพรมแดนออกไป ปลดปลอยชาวคาเรเลียจากการกดขี่ของ[SOU.GetAdjective]ดวยทุกวิถีทางที่จําเปน"
 FIN_joint_scientific_program: "โครงการวิทยาศาสตรรวม"
 FIN_joint_scientific_program_desc: "การพัฒนาความไดเปรียบทางเทคโนโลยีเหนือศัตรูอาจเปนปจจัยชี้ขาดวาชาติใดจะไดชัยในความขัดแยง การรวมความรูทางวิทยาศาสตรกับพันธมิตรจะทําใหมั่นใจไดวาความไดเปรียบทางเทคโนโลยีจะเปนของเรา"
 FIN_modernize_the_industry: "ปรับปรุงอุตสาหกรรมใหทันสมัย"
 FIN_modernize_the_industry_desc: "ผลจากความพยายามทางเทคโนโลยีของเราใชไดมากกวาในสนามรบ หลายอยางสามารถใชทําใหอุตสาหกรรมของเรามีประสิทธิภาพยิ่งขึ้น ดวยการลงทุนเพียงเล็กนอย เราก็สามารถเริ่มโครงการปรับปรุงอุตสาหกรรมขนานใหญดวยความรูที่เพิ่งไดมา"
 FIN_modernize_the_army: "ปรับปรุงกองทัพบกใหทันสมัย"
 FIN_modernize_the_army_desc: "หนาที่สําคัญที่สุดของรัฐบาลใด ๆ คือการปกปองและรักษาความปลอดภัยของประชาชน เมื่อกองทัพของเราพิสูจนแลววายังบกพรอง เราจึงมีหนาที่ตองลงทุนปรับปรุงใหทันสมัยจนสามารถทําหนาที่หลักไดอีกครั้ง"
 FIN_weapon_caches: "คลังอาวุธลับ"
 FIN_weapon_caches_desc: "ในกรณีที่กองทัพของเราถูกบดขยี้และรัฐบาลลมสลาย เราตองมีแผนสํารองเพื่อใหยึดชาติคืนได ขอเสนอหนึ่งคือการซอนคลังอาวุธไวอยางลับ ๆ ใหกองกําลังตอตานในอนาคตไดใช"
 FIN_national_unity: "เอกภาพแหงชาติ"
 FIN_national_unity_desc: "ขณะที่สงครามใกลเขามาทุกที เราจะปลุกระดมประชาชนแหงชาติอันยิ่งใหญของเรา และแสดงใหโลกเห็นอีกครั้งวาการเปนชาวฟนแลนดนั้นหมายถึงอะไร"
 FIN_viron_kansa: "ประชาชนเอสโตเนีย"
 FIN_viron_kansa_desc: "แมจะถูกทะเลบอลติกแบงกั้น แตประชาชนของ[ROOT.GetName]และ[EST.GetName]ก็มีประวัติศาสตรรวมกันมายาวนาน ยิ่งไปกวานั้น เรายังเผชิญความทาทายแบบเดียวกันในการดิ้นรนรักษาเอกราช บางทีการรวมชาติอยางสันติอาจชวยประชาชนของเราใหพนจากสงครามได"
 FIN_ambitions_in_the_south: "ความทะเยอทะยานทางใต"
 FIN_ambitions_in_the_south_desc: "ชาติเล็ก ๆ แหงบอลติกกําลังถูกเพื่อนบานจองมองอยางอิจฉา หากพวกเขาจะตองถูกพิชิต ก็ขอใหเปนประโยชนแกเราดีกวาตกไปเปนของศัตรูที่อาจเกิดขึ้น"
 FIN_union_of_finnish_brothers_in_arms: "สหภาพสหายรวมรบฟนแลนด"
 FIN_union_of_finnish_brothers_in_arms_desc: "สหภาพสหายรวมรบฟนแลนดอยูแถวหนาของขบวนการชาติสังคมนิยม และไดรับการสนับสนุนเพิ่มขึ้นเรื่อย ๆ ขณะที่ชาติของเราถูกคุกคามจากภายนอก หากเรารวมมือกับพวกเขา เราจะไดรับการสนับสนุนอยางมากในการปองกันประเทศ"
 FIN_arm_the_lotta_svard: "ติดอาวุธใหลอตตา สแวรด"
 FIN_arm_the_lotta_svard_desc: "ลอตตา สแวรดพิสูจนตัวเองแลววาเปนกําลังสําคัญในบทบาทกองกําลังเสริม ดวยความเชี่ยวชาญของพวกเธอและสถานการณอันเลวรายของเรา บางทีถึงเวลาแลวที่เราจะติดอาวุธใหองคกรนี้ดียิ่งขึ้นและผนวกรวมเขากับกองทัพอยางมีประสิทธิภาพมากขึ้น"
 FIN_parmis_devils: "ปศาจของแพรมี"
 FIN_parmis_devils_desc: "กองพันนักโทษของนิกเก แพรมีพิสูจนแลววาเปนการใชกําลังพลอยางมีประสิทธิภาพ ซึ่งมิฉะนั้นก็คงตองจมอยูหลังลูกกรง เราควรตอยอดงานของเขาดวยการจัดตั้งกองพลนักโทษที่เต็มใจจะสูเพื่อประเทศ"
 FIN_militarized_society: "สังคมทหารนิยม"
 FIN_militarized_society_desc: "หากชาติของเราจะรอดพนจากการโจมตีอันหนักหนวงที่เผชิญอยู เราตองทิ้งฉากหนาทางการเมืองและยอมรับการทําใหสังคมเปนทหารโดยสมบูรณ มีเพียงมาตรการสุดขั้วเชนนี้เทานั้นที่จะทําใหเราพิชิตศัตรูได"
 FIN_a_cry_for_help: "เสียงรองขอความชวยเหลือ"
 FIN_a_cry_for_help_desc: "สันนิบาตชาติลมเหลวในหนาที่ปกปองรัฐสมาชิกจากความขัดแยง แตยังมีบางชาติในตางแดนที่อาจไดยินเสียงรองขอความชวยเหลือของเราและมาชวยเหลือ หรืออยางนอยเราก็หวังเชนนั้น"
 FIN_greater_finland: "มหาฟนแลนด"
 FIN_greater_finland_desc: "เราจะไมตกเปนเหยื่อของเพื่อนบานอันโหดเหี้ยมที่โลภอยากไดดินแดนของเราอีกตอไป แตเราจะกลายเปนผูลา และขยายพรมแดนไปจนถึงเขตแดนตามธรรมชาติ ไกลเกินกวาดินแดนคาเรเลีย"

 FIN_right_wing_policies: "นโยบายฝายขวา"
 FIN_right_wing_policies_desc: "ฝายซายเปนแคสายลับของมหาอํานาจตางชาติ พวกเขาพรอมจะขายบานเกิดในพริบตาหากไดรับความโปรดปรานจาก[SOU.Capital.GetCapitalVictoryPointName] หากชาติของเราจะรุงเรืองและอยูรอด เราตองหันไปหาพรรคและองคกรฝายขวา"
 FIN_discredit_the_democratic_system: "ทําลายความนาเชื่อถือของระบอบประชาธิปไตย"
 FIN_discredit_the_democratic_system_desc: "ระบอบประชาธิปไตยของเราเพียงแตโซเซจากวิกฤตหนึ่งไปสูอีกวิกฤตหนึ่งโดยไมมีการกระทําที่เด็ดขาดและมีความหมาย ในสถานการณอันตรายที่เราเผชิญอยู เราไมอาจทนตอความออนแอเชนนี้ไดอีก และตองใหความรูแกมวลชนถึงความลมเหลวของระบอบการเมืองนี้"
 FIN_prepare_a_military_coup: "เตรียมการรัฐประหารโดยทหาร"
 FIN_prepare_a_military_coup_desc: "[FIN.GetNameDef]ตองการผูนําที่เขมแข็งและเด็ดขาด ซึ่งสามารถตัดสินใจเรื่องยาก ๆ ในยามวิกฤตได คนกลุมเดียวที่ทําไดในตอนนี้คือทหาร แทนที่จะรอใหชาติพังทลายภายใตพวกประชาธิปไตยและสังคมนิยม เราจะวางรากฐานสําหรับการรัฐประหารโดยทหาร"
 FIN_a_fascist_regime: "ระบอบฟาสซิสต"
 FIN_a_fascist_regime_desc: "เมื่อรัฐสภาแหงชาติอยูใตอิทธิพลของกองทัพแลว บัดนี้เราสามารถสรางระบอบที่ตั้งอยูบนความแข็งแกรง เกียรติยศ และความภักดีตอ[FIN.GetName]"
 FIN_seek_german_protection: "แสวงหาการคุมครองจากเยอรมนี"
 FIN_seek_german_protection_desc: "สันนิบาตชาติลมเหลวอยางสิ้นเชิงในการธํารงกฎหมายระหวางประเทศ เราตองยอมรับวาแสนยานุภาพของกองทัพเปนปจจัยชี้ขาดเพียงอยางเดียวในความสัมพันธระหวางประเทศ เพื่อใหชาติของเราอยูรอด เราจึงตองมองหาความชวยเหลือจากเพื่อนบานที่แข็งแกรงกวาอยาง[GER.GetNameDef]"
 FIN_join_axis: "เขารวม[GetFascistFactionForFinland]"
 FIN_join_axis_desc: "มีไมกี่ชาติที่จะยืนหยัดตอแสนยานุภาพของฝายอักษะได แทนที่จะยืนดูอยูขางสนาม เราควรเขารวมพันธมิตรของพวกเขาและใชมันเพื่อบรรลุเปาหมายนโยบายตางประเทศของเราเอง"
 FIN_finnish_supremacy_in_the_north: "ความเปนใหญของฟนแลนดในดินแดนเหนือ"
 FIN_finnish_supremacy_in_the_north_desc: "ขณะที่ชาติอื่นในภูมิภาคทะเลาะเบาะแวงและตอรองการยอมสยบตอมหาอํานาจ มีเพียงเราที่เสนอทางเลือกอื่นได ภายใตการนําของเรา เราจะนําประชาชนของเราสูชัยชนะเหนือศัตรูทุกรายที่อาจคุกคามเรา"
 FIN_finnish_legion_of_honor: "กองทหารเกียรติยศฟนแลนด"
 FIN_finnish_legion_of_honor_desc: "ทหารของเราคือโลที่ตานทานฝูงชนคอมมิวนิสตที่ชายแดน เราควรเชิดชูความกลาหาญของพวกเขาใหมากขึ้นดวยการจัดตั้งกองทหารเกียรติยศชั้นยอด ที่ผูกลาหาญที่สุดในหมูพวกเขาใฝฝนจะไดเขารวม"
 FIN_tactical_wargaming_department: "แผนกจําลองยุทธทางยุทธวิธี"
 FIN_tactical_wargaming_department_desc: "ความตองการของสงครามสมัยใหมขยายตัวขึ้นทุกวัน หากกองบัญชาการสูงสุดของเราจะตามใหทัน เราตองขยายดวยแผนกใหม ๆ ที่พวกเขาสามารถทดลองวิธีการใหมผานการจําลองยุทธทางยุทธวิธี"
 FIN_advanced_jaeger_training_program: "โครงการฝกเยเกอรขั้นสูง"
 FIN_advanced_jaeger_training_program_desc: "หนวยเยเกอรของเราไดรับการยกยองวาเปนหนวยชั้นยอดของกองทัพมานาน โดยมีตนกําเนิดยอนไปถึงมหาสงครามเมื่อรุนแรกไดรับการฝกในเยอรมนี บางทีถึงเวลาแลวที่จะฟนพลังใหหนวยเหลานี้ดวยการปรับปรุงใหทันสมัย ซึ่งจะชวยปลุกขวัญกําลังใจของทั้งกองทัพดวย"
 FIN_industrial_cooperation: "ความรวมมือทางอุตสาหกรรม"
 FIN_industrial_cooperation_desc: "สมาชิกฝายอักษะมีความรูและทรัพยากรมากมายอยูในมือ ถึงเวลาแลวที่เราจะรวมมือกันทางอุตสาหกรรม เพื่อใชทรัพยสินที่ยังไมไดใชเหลานี้ใหเกิดประโยชนตอชาติของแตละฝายไดดียิ่งขึ้น"
 FIN_bring_foreign_armor_experts: "นําผูเชี่ยวชาญยานเกราะตางชาติเขามา"
 FIN_bring_foreign_armor_experts_desc: "รถถังเปนองคประกอบสําคัญของกองทัพสมัยใหมทุกกองทัพ แตประสบการณของเรายังมีจํากัด บางทีเราอาจขยายขีดความสามารถดานนี้ไดดวยการเชิญผูเชี่ยวชาญตางชาติในสาขานี้มาชวยเหลือ"
 FIN_military_research: "การวิจัยทางทหาร"
 FIN_military_research_desc: "การสงครามถูกคิดคนใหมอยูเสมอจากการถือกําเนิดของเทคโนโลยีใหมและยุทธวิธีที่ใชมัน เพื่อรักษาความแข็งแกรงและความพรอมของกองทัพไว สมาชิกพันธมิตรของเราควรรวมความรูและเทคโนโลยีเขาดวยกัน"
 FIN_patriotic_peoples_movement: "ขบวนการประชาชนผูรักชาติ"
 FIN_patriotic_peoples_movement_desc: "แมจะถูกตอตานจากระบอบกอน แตขบวนการประชาชนผูรักชาติก็ทํางานไดยอดเยี่ยมในการใหความรูแกมวลชนถึงความจําเปนของความภาคภูมิใจในชาติและการปกปองชาติจากคอมมิวนิสต หากเราดึงพวกเขามาเปนคนสนิท เราจะไดฐานการสนับสนุนระบอบของเราที่กวางขึ้นมาก"
 FIN_academic_karelian_society: "สมาคมคาเรเลียแหงมหาวิทยาลัย"
 FIN_academic_karelian_society_desc: "นานกวาทศวรรษที่องคกรของปญญาชนและนักศึกษาแหงมหาวิทยาลัยเฮลซิงกิทวีอิทธิพลมากขึ้นเรื่อย ๆ เปาหมายหลักของพวกเขาสอดคลองกับของเราเปนอยางดี นั่นคือการพัฒนาฟนแลนดใหสอดคลองกับประวัติศาสตรของเรา บางทีเราอาจหาทางรวมมือกันได"
 FIN_mustapaidat: "มุสตาไปดัต"
 FIN_mustapaidat_desc: "การทําใหสังคมเปนทหารอยางตอเนื่องจะทําใหประชาชนของเราแข็งแกรงที่สุดเทาที่จะเปนได ดวยการรวมกองกําลังกึ่งทหารเขามา เราจะสงเสริมคานิยมทางทหารไปทุกชั้นของสังคม ตั้งแตผูที่ยังเด็กเกินกวาจะเขากองทัพไปจนถึงผูที่อาจแกเกินไปแลว"
 FIN_take_over_the_suojeluskunta: "ยึดอํานาจซูโอเยลุสกุนตา"
 FIN_take_over_the_suojeluskunta_desc: "ซูโอเยลุสกุนตาทําหนาที่เปนกองกําลังเสริมของทหารกองหนุนที่สามารถเรียกระดมมาชวยปองกันชาติในยามวิกฤต หากเรานําองคกรนี้มาอยูใตการควบคุม เราจะใชมันปลูกฝงคนนับพันใหเขารวมอุดมการณของเราได"
 FIN_maan_turva: "มาอัน ตูรวา"
 FIN_maan_turva_desc: "มีเพียงการเฝาติดตามประชาชนอยางรอบคอบเทานั้นที่จะทําใหมั่นใจไดวาไมมีการทรยศหรือบอนทําลายเกิดขึ้น ซึ่งจะชวยปกปองระบอบและทําใหชาติไมถูกทําลายจากภายใน"
 FIN_finnish_irredentism: "ลัทธิเรียกรองดินแดนของฟนแลนด"
 FIN_finnish_irredentism_desc: "แมจะไดรับเอกราชจากอดีตจักรวรรดิรัสเซียแลว แตยังมีดินแดนและผูคนที่ควรอยูใตการปกครองของเราโดยชอบธรรม ซึ่งยังคงติดอยูใตแอกการกดขี่ของศัตรู เราตองปลุกระดมประชาชนเพื่อปลดปลอยดินแดนเหลานี้"
 FIN_keepers_of_the_north: "ผูพิทักษแหงดินแดนเหนือ"
 FIN_keepers_of_the_north_desc: "เราเปนระบอบเดียวในดินแดนเหนือที่มีความแข็งแกรงทางเจตจํานงพอจะปกครองและปกปองภูมิภาคนี้จากศัตรูภายนอก ตราบใดที่ประชาชนทุกกลุมในภูมิภาคยังไมรวมเปนหนึ่งภายใตการปกครองของเรา เราจะไมมีวันมีสันติภาพที่ยั่งยืน"
 FIN_sotilaalliset_kappalaiset: "อนุศาสนาจารยทหาร"
 FIN_sotilaalliset_kappalaiset_desc: "การเขาถึงอนุศาสนาจารยเปนบริการสําคัญที่ทหารของเราพึ่งพา อนุศาสนาจารยหลายทานก็กังวลถึงอนาคตของชาติเราอยางมีเหตุผลเชนกัน หากเรารวมมือกับพวกเขา เราจะไมเพียงไดหูตาในแนวหนา แตยังมั่นใจไดดวยวาสารที่ถูกตองจะสงไปถึงทหาร"
 FIN_national_fanatism: "ความคลั่งชาติ"
 FIN_national_fanatism_desc: "สังคมตองเปยมไปดวยความคลั่งไคลและการอุทิศตนตออุดมการณความเหนือกวาของ[FIN.GetAdjective]อยางสมบูรณ เราพิสูจนมาครั้งแลวครั้งเลาวาไมมีใครหยุดเราได และเมื่อเรารวมมือกัน ก็ไมมีสิ่งใดหยุดยั้งการผงาดสูความยิ่งใหญของชาติเราได"
 FIN_military_promotions: "การเลื่อนยศทางทหาร"
 FIN_military_promotions_desc: "นายทหารของเรารับใชชาติดวยเกียรติและการอุทิศตนอยางยิ่งใหญ ถึงเวลาแลวที่จะตอบแทนผูที่ดีที่สุดในหมูพวกเขาสําหรับบทบาทในการชวยเราใหพนจากการตกเปนเบี้ยลางของศัตรูในประวัติศาสตร"
 FIN_indoctrinate_the_workers: "ปลูกฝงลัทธิแกกรรมกร"
 FIN_indoctrinate_the_workers_desc: "ดวยการเฝาติดตามประชาชนที่เขมขนขึ้น เราจึงเขาใจลึกซึ้งยิ่งขึ้นวาอะไรทําใหวิธีการโฆษณาชวนเชื่อไดผล เราควรใชความรูนี้ปลูกฝงลัทธิแกประชาชน เพื่อใหพวกเขาภักดีตอรัฐบาลและ[FIN.GetNameDef]อยางสมบูรณ"
 FIN_intellectual_elite: "ชนชั้นนําทางปญญา"
 FIN_intellectual_elite_desc: "ดวยความรวมมืออยางรอบคอบระหวางกองทัพและสมาชิกผูรูแจงในหมูปญญาชน เราไดชวยชาติใหพนจากเงื้อมมือของสังคมนิยมและความเสื่อมทราม ถึงเวลาแลวที่จะตอบแทนผูที่สนับสนุนเราดวยการลงทุนในงานวิชาการของพวกเขา"


 FIN_enhance_southern_infrastructure: "ยกระดับโครงสรางพื้นฐานทางใต"
 FIN_enhance_southern_infrastructure_desc: "ขณะที่ชาติ[ROOT.GetAdjective]มุงหวังจะสรางที่ยืนของตนในโลก ก็ตองมุงเนนการสรางและพัฒนาศักยภาพทางอุตสาหกรรม ขั้นแรกสูเปาหมายนี้คือการปรับปรุงโครงสรางพื้นฐานในภูมิภาคทางใต เพื่อใหพรอมรับมือความตองการของอุตสาหกรรมเบาและอุตสาหกรรมหนักไดดียิ่งขึ้นในระยะสั้น"
 FIN_industrial_development: "การพัฒนาอุตสาหกรรม"
 FIN_industrial_development_desc: "ขณะที่โลกพัฒนาเปนอุตสาหกรรมมากขึ้นเรื่อย ๆ [ROOT.GetName]ตองกาวใหทันหากจะเปนผูเลนสําคัญบนเวทีโลก การลงทุนในอุตสาหกรรมหนักของเราจะไมเพียงสรางงานและกระตุนเศรษฐกิจ แตยังใหทรัพยากรที่จําเปนตอการรับมือความทาทายในอนาคตดวย"
 FIN_bank_of_aland: "ธนาคารแหงโอลันด"
 FIN_bank_of_aland_desc: "ธนาคารแหงโอลันดเปนรากฐานสําคัญของเศรษฐกิจ[ROOT.GetName] ที่มอบเสถียรภาพและการสนับสนุนที่จําเปนตอการขับเคลื่อนการเติบโตและความมั่งคั่ง \nการลงทุนในธนาคารแหงโอลันดคือการที่[ROOT.GetName]ลงทุนในอนาคตของตนเอง เปนการวางรากฐานสูชาติที่แข็งแกรงและมั่งคั่งยิ่งขึ้น"
 FIN_suomen_akatemia: "สถาบันวิทยาศาสตรแหงฟนแลนด"
 FIN_suomen_akatemia_desc: "ปญญาชนชาว[ROOT.GetAdjective]หลายคน นําโดยเลโอ ซาริโอ นักคณิตศาสตรผูมีชื่อเสียง กําลังผลักดันการกอตั้งสถาบันวิทยาศาสตรแหงฟนแลนด (Suomen Akatemia) ซึ่งจะกลายเปนสถาบันวิชาการชั้นนําของชาติ ขับเคลื่อนนวัตกรรมทางวิทยาศาสตร และชวยให[ROOT.GetName]อยูแถวหนาของการพัฒนาเทคโนโลยี"
 FIN_janiskoski_power_plant: "โรงไฟฟาแยนิสโกสกี"
 FIN_janiskoski_power_plant_desc: "เราจะสรางโรงไฟฟาที่แยนิสโกสกีเพื่อจายพลังงานที่เชื่อถือไดใหแกเตาถลุงไฟฟาของเหมืองนิกเกิลโกโลสโยกิ และหลอเลี้ยงการเติบโตของพื้นที่[722.GetName] ซึ่งจะกระตุนการพัฒนาเศรษฐกิจในภาคเหนือของ[ROOT.GetName]ตอไป"
 FIN_found_pohjolan_voima: "กอตั้งโปหโยลัน วอยมา"
 FIN_found_pohjolan_voima_desc: "การขยายตัวของอุตสาหกรรมปาไมและอุตสาหกรรมหนักเมื่อไมนานนี้ทําใหตองการพลังงานมากขึ้น เราจะรวมศูนยการผลิตพลังงานและนําศักยภาพไรขีดจํากัดของพลังนํ้ามาใชขับเคลื่อนการเติบโตทางอุตสาหกรรมของ[ROOT.GetName]"
 FIN_expand_imatra_hydropower_plant: "ขยายโรงไฟฟาพลังนํ้าอิมาตรา"
 FIN_expand_imatra_hydropower_plant_desc: "โรงไฟฟาพลังนํ้าอิมาตราซึ่งกอตั้งในป 1922 พิสูจนแลววาเปนแหลงพลังงานที่เชื่อถือไดสําหรับอุตสาหกรรมที่กําลังเติบโตของ[ROOT.GetName] เมื่อขยายเครื่องกําเนิดไฟฟาเครื่องที่หาและหก กําลังการผลิตของโรงไฟฟาก็จะเพิ่มขึ้น สงผลใหอุตสาหกรรมในภูมิภาค[928.GetName]เติบโตตอไปได"
 FIN_makola_mine: "เหมืองมาโกลา"
 FIN_makola_mine_desc: "มีการคนพบแหลงแรนิกเกิลและทองแดงอุดมสมบูรณที่มาโกลาและฮิตูรา ผูเชี่ยวชาญของเราเห็นวาแหลงแรเหลานี้มีศักยภาพสูงตอการเติบโตทางเศรษฐกิจและอุตสาหกรรมทหารที่ขยายตัวอยางรวดเร็วของชาติ และแนะนําใหเริ่มกอสรางเหมืองมาโกลาโดยเร็วที่สุดเพื่อใหมีแหลงแรมีคาที่มั่นคง"
 FIN_power_from_the_dams: "พลังงานจากเขื่อน"
 FIN_power_from_the_dams_desc: "มีการเสนอใหขยายโครงสรางพื้นฐานพลังนํ้าอยางมีนัยสําคัญ โดยอาศัยทรัพยากรธรรมชาติจากแมนํ้ามากมายของ[ROOT.GetName] ผูเชี่ยวชาญของเราเห็นวาการลงทุนสรางโรงไฟฟาพลังนํ้าแหงใหมจะเปนหนทางขยายศักยภาพทางอุตสาหกรรมอยางมหาศาลและขับเคลื่อนการเติบโตของชาติ"
 FIN_tire_factory_at_nokia: "โรงงานยางรถยนตที่โนเกีย"
 FIN_tire_factory_at_nokia_desc: "ในยามขัดแยง [ROOT.GetName]ตองมีแหลงยางรถยนตสําหรับกองทัพ ดังนั้นการจัดหาแหลงที่เชื่อถือไดเพื่อรักษาความคลองตัวและความพรอมของกองทัพจึงควรเปนสิ่งสําคัญอันดับตน \nเรามีแผนขยายโรงงานยางรถยนตของ Suomen Gummitehdas ที่โนเกีย และยกระดับสายการผลิตใหใชยางสังเคราะหและวัสดุรีไซเคิล เพื่อรับมือการขาดแคลนที่อาจเกิดขึ้น"
 FIN_vaisala_radiosonde_tests: "การทดสอบเรดิโอซอนดของไวซาลา"
 FIN_vaisala_radiosonde_tests_desc: "ภายใตการชี้นําของศาสตราจารยวิลโฮ ไวซาลา ความพยายามบุกเบิกดานเทคโนโลยีเรดิโอซอนดไดปูทางสูการผลิตเชิงพาณิชยที่ประสบความสําเร็จ ตอยอดจากความสําเร็จในการปลอยเรดิโอซอนดครั้งแรกของฟนแลนดในป 1931 การวิจัยและพัฒนาอยางตอเนื่องไดนําไปสูความกาวหนาทางเทคโนโลยีอยางมีนัยสําคัญ"
 FIN_oy_alkoholiliike: "Oy Alkoholiliike"
 FIN_oy_alkoholiliike_desc: "ยามคับขันตองใชมาตรการเด็ดขาด และบัดนี้ถึงเวลาที่ Oy Alkoholiliike บริษัทสุราแหงชาติ จะสนับสนุนกองทัพฟนแลนดดวยการจัดหาสวนประกอบสําคัญสําหรับอาวุธ \nดวยการผลิตและกลั่นอยางพิถีพิถัน พวกเขาจะเชี่ยวชาญในการผลิตระเบิดเพลิงขวดที่มีประสิทธิภาพสูง มอบความไดเปรียบที่ทหารราบตองการในการจัดการยานเกราะเบาของศัตรู"
 FIN_integrate_oy_tikkakoski: "ผนวกรวม Oy Tikkakoski"
 FIN_integrate_oy_tikkakoski_desc: "เพื่อเสริมความแข็งแกรงใหอุตสาหกรรมอาวุธของ[ROOT.GetAdjective] Oy Tikkakoski จะถูกรวมเขากับโรงงานผลิตอาวุธทหารของรัฐ การเคลื่อนไหวนี้จะเพิ่มการผลิตปนและสงเสริมการพัฒนาอาวุธปนใหมสําหรับกองทัพ[ROOT.GetAdjective]"
 FIN_national_firepower: "อํานาจการยิงแหงชาติ"
 FIN_national_firepower_desc: "ดวยภัยคุกคามจากภายนอกที่กดดันชาติของเรา เราตองทุมลงทุนครั้งใหญในโรงงานทหารแหงใหม โรงงานเหลานี้จะผลิตปนใหญรุนลาสุดสําหรับกองกําลังภาคพื้นดินและปอมปนใหญชายฝงโดยเฉพาะ เพื่อให[ROOT.GetNameDef]มีอํานาจการยิงที่จําเปนในการปกปองพรมแดน"
 FIN_contract_with_yhteissisu: "ทําสัญญากับ Yhteissisu"
 FIN_contract_with_yhteissisu_desc: "เราจะรวมกับบริษัทชั้นนําของ[ROOT.GetAdjective]กอตั้งบริษัท Yhteissisu Oy โดยมีเปาหมายเพื่อจัดหาการขนสงที่เชื่อถือไดและมีประสิทธิภาพใหแกกองกําลังปองกันประเทศ[ROOT.GetAdjective] \nการโอนการผลิตรถบรรทุก Sisu S-21 ไปยัง Yhteissisu จะชวยเพิ่มการผลิตรถบรรทุกและรถโดยสารเพื่อการทหาร ทําใหกองกําลังของเรามีทรัพยากรที่จําเปนพรอมสําหรับทุกสถานการณ"
 FIN_outokumpu_for_defence_industry: "เอาโตกุมปูเพื่ออุตสาหกรรมกลาโหม"
 FIN_outokumpu_for_defence_industry_desc: "การลงทุนในบริษัทอุตสาหกรรมโลหะแหงชาติ Outokumpu Oy จะชวยเพิ่มความพรอมดานการปองกันประเทศของ[ROOT.GetName] \nการจัดตั้งโรงงานโลหะในประเทศที่โปรี และโรงงานแยกทองแดงดวยไฟฟาเพื่อถลุงทองแดงดิบ จะทําให[ROOT.GetName]พึ่งพาตนเองไดในการผลิตทองแดงและทองเหลือง"
 FIN_industrial_upgrade_in_harjavalta: "ยกระดับอุตสาหกรรมที่ฮารยาวัลตา"
 FIN_industrial_upgrade_in_harjavalta_desc: "ที่ฮารยาวัลตากําลังมีความพยายามปรับปรุงอุตสาหกรรมนิกเกิลและทองแดงใหทันสมัยและคลองตัวยิ่งขึ้น ดวยเทคโนโลยีลํ้าสมัยและวิธีการผลิตที่ดีขึ้น เปาหมายคือเพิ่มผลผลิตใหสูงสุดและเสริมสถานะของ[ROOT.GetName]ในฐานะผูผลิตแรสําคัญเหลานี้ชั้นนํา"
 FIN_expand_mining_prospection: "ขยายการสํารวจแร"
 FIN_expand_mining_prospection_desc: "การลงทุนในเครื่องมือทําเหมืองสมัยใหมและขยายโครงสรางพื้นฐานเหมืองจะวางรากฐานใหอุตสาหกรรมสกัดแรที่แข็งแกรง ผลผลิตที่เพิ่มขึ้นจะตอบสนองความตองการดานการปองกันประเทศ และเสริมความพรอมของประเทศในการรับมือความขัดแยง"
 FIN_elijarvi_mine: "เหมืองเอลิแยรวี"
 FIN_elijarvi_mine_desc: "เราไดรับตัวอยางที่พบระหวางงานขุดใกลเอลิแยรวี ซึ่งบงชี้วามีแรโครไมตที่อาจมีโครเมียมอุดมสมบูรณมาก เราตองเริ่มเปดเหมืองแหงใหมในพื้นที่และจัดหาแหลงโครเมียมที่เชื่อถือไดสําหรับอุตสาหกรรมทหาร"
 FIN_tornio_steel_factory: "โรงงานเหล็กกลาทอรนิโอ"
 FIN_tornio_steel_factory_desc: "การจัดตั้งโรงงานเหล็กกลาที่ทอรนิโอใกลเหมืองเกมิจะปฏิวัติอุตสาหกรรมโลหะของฟนแลนด ดวยการเขาถึงแรโครเมียมและนิกเกิลที่บัดนี้มีอยางเหลือเฟอของเอาโตกุมปู โรงงานแหงใหมจะผลิตเหล็กกลาคุณภาพสูงสุด และอุดชองวางดานศักยภาพทางอุตสาหกรรมของฟนแลนด"
 FIN_increase_military_budget: "เพิ่มงบประมาณทหาร"
 FIN_increase_military_budget_desc: "ความมั่นคงของชาติสําคัญที่สุด การเพิ่มงบประมาณทางทหารจะทําใหกองกําลังปองกันประเทศมียุทโธปกรณครบครันและพรอมรับมือภัยคุกคามใด ๆ ที่อาจเกิดขึ้นไดดียิ่งขึ้น"
 FIN_suomen_maavoimat: "กองทัพบกฟนแลนด"
 FIN_suomen_maavoimat_desc: "เราตองยกระดับขีดความสามารถของกองกําลังปองกันประเทศฟนแลนดดวยการลงทุนวิจัยยุทโธปกรณทางทหารใหมและปรับปรุงสถานที่ฝกใหทันสมัย เพื่อใหพรอมเผชิญภัยคุกคามใด ๆ ที่อาจเกิดขึ้น"
 FIN_operation_kilpapurjehdus: "ปฏิบัติการคิลปาปูรเยฮดุส"
 FIN_operation_kilpapurjehdus_desc: "ตามมติของสันนิบาตชาติ โอลันดถูกปลอดทหารมาตั้งแตป 1921 หมายความวาไมมีทหารหรือเสบียงทางทหารประจําการในพื้นที่ อยางไรก็ตาม ความตึงเครียดในยุโรปกําลังเพิ่มขึ้น และเมื่อเผชิญภัยคุกคามรายแรงที่ศัตรูอาจยกพลขึ้นบกบนหมูเกาะ กองบัญชาการสูงสุดของเราจึงวางแผนติดอาวุธและเสริมปอมปราการใหโอลันด \nการเตรียมการเสร็จสิ้นแลว และทหารของเราพรอมปฏิบัติการ!"
 FIN_extra_refresher_exercises: "การฝกทบทวนเพิ่มเติม"
 FIN_extra_refresher_exercises_desc: "ความตึงเครียดในยุโรปเพิ่มขึ้นไมหยุด และหากจะรักษาเอกราชของ[ROOT.GetAdjective]ไว เราตองเสริมการปองกันฟนแลนดผานการฝกซอมอยางเขมขน เตรียมพรอมรับความขัดแยงที่อาจปะทุขึ้น และแสดงใหเห็นถึงความมุงมั่นและความพรอมของชาวฟนแลนดในการปกปองอธิปไตยของชาติหากจําเปน"
 FIN_the_cold_front: "แนวหนาเยือกแข็ง"
 FIN_the_cold_front_desc: "สภาพฤดูหนาวอันโหดรายของแนวรบฟนแลนดตองการการเตรียมพรอมอยางเหมาะสม เสนทางเสบียงตองไดรับการรักษาใหมั่นคง และยุทธวิธีพรางตัวตองไดรับการปรับปรุง เพื่อใหกองกําลังปองกันประเทศทนทานตอความทาทายของฤดูหนาว"
 FIN_jaeger_movement: "ขบวนการเยเกอร"
 FIN_jaeger_movement_desc: "กองบัญชาการสูงสุดของ[ROOT.GetAdjective]ไดเสนอใหฟนพลังกองกําลังปองกันประเทศดวยการเลื่อนยศนายทหารที่เคยผานการฝกเยเกอร นายทหารเหลานี้เชี่ยวชาญการรบแบบกองโจรและปฏิบัติการกอวินาศกรรมหลังแนวขาศึก จึงเหมาะอยางยิ่งที่จะขัดเกลาทักษะการรบนอกแบบใหหนวยใหมและนําพวกเขาเขาสูสนามรบ"
 FIN_salvaged_and_retooled: "กูคืนและดัดแปลง"
 FIN_salvaged_and_retooled_desc: "หากกองทัพของเราจะชนะสงคราม เราตองมุงใชทรัพยากรยามสงครามใหคุมคาที่สุด การใชประโยชนจากยุทโธปกรณที่ยึดไดจากศัตรู กูยุทธภัณฑที่เสียหายและดัดแปลงเมื่อจําเปนใหสอดคลองกับหลักนิยมทางยุทธวิธีของฟนแลนด จะทําใหเราตอบสนองความตองการเสบียงของกองทัพและเพิ่มขีดความสามารถทางทหารไดอยางมาก"
 FIN_winter_warfare: "การรบในฤดูหนาว"
 FIN_winter_warfare_desc: "เตรียมรับสิ่งเลวรายที่สุด สูใหเหมือนยอดนักรบ เราตองเสริมเสนทางเสบียงใหรับสภาพฤดูหนาวอันโหดราย และฝกทหารใหทนความหนาวเย็นและสูตอไปในแนวหนา"
 FIN_motti_tactics: "ยุทธวิธีมอตติ"
 FIN_motti_tactics_desc: "ยุทธศาสตรมอตติคือการโอบลอมและโดดเดี่ยวหนวยขาศึก โดยมีเปาหมายเพื่อทําลายเสนทางการสงกําลังบํารุงและการสื่อสารของพวกมัน การนําแนวทางนี้มาใชตองอาศัยการวางแผนและการฝกกองกําลังปองกันประเทศอยางรอบคอบเพื่อใหไดผลในสนามรบ ดวยการใชและพัฒนาการรบแบบมอตติใหสมบูรณแบบ เราจะสามารถเหนือกวาศัตรูในการดําเนินกลยุทธและโจมตีในจุดที่พวกมันคาดไมถึง"
 FIN_foreign_armor: "ยานเกราะตางชาติ"
 FIN_foreign_armor_desc: "ขณะที่กองทัพบก[ROOT.GetAdjective]พยายามเสริมขีดความสามารถดานยานเกราะในชวงสงคราม เราตองมองหาทางออกนอกพรมแดนของเรา การจัดหายานเกราะตางชาติอยาง Landsverk L-62 II ของสวีเดนจะชวยเพิ่มเติมคลังอาวุธของ[ROOT.GetAdjective]ไดเปนอยางดี และแสดงใหเห็นถึงความชางคิดและการปรับตัวของประเทศเมื่อเผชิญความยากลําบาก"
 FIN_utilize_the_sami: "ใชประโยชนจากชาวซามี"
 FIN_utilize_the_sami_desc: "เราตองตระหนักถึงทักษะเฉพาะตัวของชาวซามี ผูเชี่ยวชาญการนําทางในภูมิประเทศอารกติกอันโหดราย การใชความรูเรื่องพื้นที่ของพวกเขาจะชวยเพิ่มขีดความสามารถดานการลาดตระเวน และการจางพวกเขาเปนคนเลี้ยงกวางเรนเดียรจะชวยปรับปรุงเสนทางเสบียงในพื้นที่หางไกล ชาวซามีมีบทบาทสําคัญในยุทธศาสตรการปองกันของเราได และเราตองใชความเชี่ยวชาญของพวกเขาใหเต็มที่"
 FIN_long_range_patrols: "หนวยลาดตระเวนระยะไกล"
 FIN_long_range_patrols_desc: "หนวยลาดตระเวนระยะไกลจะกลายเปนองคประกอบสําคัญในภารกิจลาดตระเวนและกอวินาศกรรมของกองทัพ[ROOT.GetAdjective] ในเมื่อตอนนี้ตองเผชิญความทาทายของสงครามสมัยใหม หนวยที่ผานการฝกมาอยางดีเหลานี้เชี่ยวชาญการแทรกซึมแนวขาศึก รวบรวมขาวกรอง และโจมตีจูโจมอยางรุนแรง จึงเปนกําลังสําคัญในความพยายามทําสงคราม"
 FIN_finnish_radio_intelligence: "ขาวกรองทางวิทยุของฟนแลนด"
 FIN_finnish_radio_intelligence_desc: "เมื่อสงครามทวีความรุนแรง กองทัพฟนแลนดไดตระหนักถึงความสําคัญของการรวบรวมขาวกรองที่เชื่อถือได ภายใตการนําของไรโน ฮัลลามา กลุมพนักงานวิทยุผูมีความสามารถไดถูกรวบรวมขึ้นเพื่อดักฟงและถอดรหัสการสื่อสารของศัตรู ดวยทักษะและความรูของพวกเขา พนักงานวิทยุเหลานี้จะใหขอมูลอันมีคาแกกองทัพฟนแลนด ชวยพลิกสถานการณของสงคราม"
 FIN_sissi: "ซิสซี"
 FIN_sissi_desc: "ขณะที่ความขัดแยงยังดําเนินไปอยางดุเดือด ทหารราบเบาซิสซีของเรากลายเปนกําลังลํ้าคาของกองทัพบกฟนแลนด โดยใชความเชี่ยวชาญดานการลาดตระเวนระยะไกลและการซุมโจมตีเพื่อโจมตีเปาหมายของศัตรู ดวยความรูเรื่องภูมิประเทศที่เหนือกวาและความสามารถในการเคลื่อนที่อยางรวดเร็วและเงียบเชียบ พวกเขาจึงเปนหนามยอกอกของศัตรูและเปนความภาคภูมิใจของชาวฟนแลนด"
 FIN_national_armor_focus: "มุงเนนยานเกราะแหงชาติ"
 FIN_national_armor_focus_desc: "เมื่อความพยายามทําสงครามทวีความเขมขน [ROOT.GetName]ตองหันมาใสใจอุตสาหกรรมทหารของตนเอง ดวยการมุงพัฒนาขีดความสามารถในการผลิตรถถังภายในประเทศ เรามุงเสริมกําลังยานเกราะและสรางยานพาหนะที่ออกแบบใหเหมาะกับความตองการเฉพาะในสนามรบ"
 FIN_underground_resistance_cells: "เซลลตอตานใตดิน"
 FIN_underground_resistance_cells_desc: "ขณะที่ศัตรูรุกคืบ ชาวฟนแลนดบางสวนไมยอมสยบ เซลลตอตานขนาดเล็กที่คลองตัวจับอาวุธขึ้นสู ทําการซุมโจมตี จูโจม และกอวินาศกรรม ความรูเรื่องภูมิประเทศและความทุมเทตออุดมการณทําใหพวกเขาเปนภัยนาเกรงขามตอผูรุกรานทุกราย ไมวาจะทรงพลังเพียงใด"
 FIN_mannerheim_line: "แนวมานเนอรเฮม"
 FIN_mannerheim_line_desc: "เพื่อเสริมความแข็งแกรงใหการปองกัน เราตองหันมาใสใจแนวมานเนอรเฮม เครือขายปอมปราการปองกันอันซับซอนที่ทอดยาวตามพรมแดนดานตะวันออกของประเทศ ซึ่งตองไดรับการรักษาไวจากการรุกลํ้าของศัตรู ดวยเหตุนี้ กองทัพจึงกําลังปรับปรุงทั้งตัวปอมปราการและเสนทางเสบียงที่ทําใหปอมมีเสบียงพรอมและใชงานได"
 FIN_defense_in_depth: "การปองกันเชิงลึก"
 FIN_defense_in_depth_desc: "เมื่อศัตรูแข็งแกรงและมุงมั่นยิ่งขึ้น ก็เห็นไดชัดวาแนวหนาแบบตั้งรับเพียงแนวเดียวอาจไมพอจะตานทานพวกมัน เราตองสรางปอมปราการใหมและแนวปองกันขนาดเล็กหลังแนวหนาหลัก เพื่อสรางการปองกันหลายชั้นและใหกองกําลังของเรามีความยืดหยุนในการตีโตตามความจําเปน เราจะทําใหศัตรูตองชดใชทุกตารางนิ้วของผืนแผนดิน[ROOT.GetAdjective]ที่พวกมันพยายามยึด"
 FIN_helsinki_air_defense: "การปองกันภัยทางอากาศเฮลซิงกิ"
 FIN_helsinki_air_defense_desc: "ขณะที่สงครามตั้งเคาเหนือ[ROOT.GetName] เฮลซิงกิตองไดรับการเสริมปอมปราการ เมืองและแนวชายฝงของมันเสี่ยงตอการถูกโจมตี และเปนหนาที่ของกองทัพ[ROOT.GetAdjective]ที่จะปกปอง การปรับปรุงระบบปองกันภัยทางอากาศและปอมปราการชายฝงจะไมเพียงปกปองเมือง แตยังเสริมความมุงมั่นของชาติที่จะตานทานการโจมตีทุกรูปแบบ"
 FIN_suomen_ilmavoimat: "กองทัพอากาศฟนแลนด"
 FIN_suomen_ilmavoimat_desc: "เราตองมุงเนนการเพิ่มประสิทธิภาพของกองทัพอากาศ[ROOT.GetAdjective]ผานการลงทุนดานการวิจัยและการฝก \nเปาหมายคือการสรางเหลาทัพอากาศที่ทันสมัยและยืดหยุน สามารถรับมือความทาทายของสงครามสมัยใหม และใหการสนับสนุนที่สําคัญแกทหารภาคพื้นดินระหวางปฏิบัติการรบ"
 FIN_expand_air_bases: "ขยายฐานทัพอากาศ"
 FIN_expand_air_bases_desc: "ขณะที่ความตึงเครียดรอบ[ROOT.GetName]เพิ่มขึ้น เราตองทําใหกองกําลังปองกันประเทศมีวิธีปฏิบัติการไดอยางเพียงพอ \nเราจะสนับสนุนกองทัพอากาศในความมุงมั่นที่จะขยายจํานวนฐานทัพอากาศทั่วประเทศ เพื่อใหนักบินสามารถวางกําลังไดอยางรวดเร็วในยามขัดแยง"
 FIN_pilot_training: "การฝกนักบิน"
 FIN_pilot_training_desc: "ดวยความตองการกําลังทางอากาศที่เพิ่มขึ้นในสงครามสมัยใหม นักบินของเราจําเปนตองไดรับการฝกที่กาวหนาและเฉพาะทางยิ่งขึ้น การลงทุนในวิธีการฝกและอุปกรณใหมจะทําใหกองทัพอากาศ[ROOT.GetAdjective]มั่นใจไดวานักบินของตนจะอยูในกลุมที่เกงที่สุดในโลก"
 FIN_naval_airforce: "กองบินนาวี"
 FIN_naval_airforce_desc: "เมื่อกําลังทางเรือของ[ROOT.GetName]เติบโตขึ้น ขีดความสามารถดานการบินก็ตองเติบโตตามไปดวย การจัดตั้งกองบินนาวีโดยเฉพาะจะทําใหกองทัพเรือฟนแลนดไดรับการสนับสนุนที่จําเปนในการครองทะเลบอลติก โดยประสานกําลังทางอากาศกับกองเรือผิวนํ้าเพื่อขับไลภัยคุกคามทุกรูปแบบ"
 FIN_national_aircraft_production: "การผลิตอากาศยานแหงชาติ"
 FIN_national_aircraft_production_desc: "ขณะที่[ROOT.GetName]เผชิญภัยคุกคามจากสงคราม ก็ชัดเจนยิ่งขึ้นวากองทัพอากาศที่ทันสมัยเปนสิ่งจําเปนตอการปองกันประเทศ ดวยเหตุนี้จึงไดริเริ่มโครงการผลิตอากาศยานแหงชาติ โดยมุงจัดหาทรัพยากรและการสนับสนุนที่จําเปนใหแกผูออกแบบและผูผลิตอากาศยานชาว[ROOT.GetAdjective] เพื่อให[ROOT.GetName]แขงขันกับมหาอํานาจแหงยุโรปได"
 FIN_expand_air_force_academy: "ขยายโรงเรียนนายเรืออากาศ"
 FIN_expand_air_force_academy_desc: "ในฐานะสวนหนึ่งของความพยายามระดับชาติในการพัฒนากองทัพอากาศ เราจะเริ่มขยายโรงเรียนนายเรืออากาศครั้งใหญ การขยายนี้ไมเพียงรวมถึงสิ่งอํานวยความสะดวกใหม แตยังยกระดับการฝกนักบิน ดวยการสรางสนามบินใหมที่เกาฮาวาและติกกาโกสกี"
 FIN_foreign_aircraft: "อากาศยานตางชาติ"
 FIN_foreign_aircraft_desc: "กองทัพอากาศ[ROOT.GetAdjective]ตองขยายขีดความสามารถเพื่อปกปองอธิปไตยของชาติและความปลอดภัยของมาตุภูมิ เราจะแสวงหาแบบอากาศยานและความเชี่ยวชาญจากตางชาติเพื่อพัฒนาขีดความสามารถและการพัฒนาอากาศยานของเราเอง"
 FIN_support_for_ground_forces: "สนับสนุนกองกําลังภาคพื้นดิน"
 FIN_support_for_ground_forces_desc: "ขณะที่สงครามยังดําเนินไปอยางดุเดือด ก็เห็นไดชัดวากองกําลังภาคพื้นดินตองการการสนับสนุนทางอากาศมากขึ้น ดวยเหตุนี้ เราจะลงทุนพัฒนาและผลิตเครื่องบินสนับสนุนทางอากาศโดยใกลชิด เพื่อใหการคุมกันทางอากาศที่สําคัญแกทหารภาคพื้นดิน ซึ่งจะชวยใหพวกเขารักษาที่มั่นและผลักดันศัตรูกลับไปได"
 FIN_dominate_the_skies: "ครองนานฟา"
 FIN_dominate_the_skies_desc: "นานฟา[ROOT.GetAdjective]จะเปนของเรา! การผลิตเครื่องบินขับไลใหมและการลงทุนวิจัยพัฒนาเทคโนโลยีการรบทางอากาศสมัยใหมจะทําใหเราไดความเหนือกวาทางอากาศและปกปองมาตุภูมิได นักบินฝมือดีของเราจะครองนานฟาและบุกไปถึงตัวศัตรู"
 FIN_expand_production_lines: "ขยายสายการผลิต"
 FIN_expand_production_lines_desc: "กองทัพอากาศ[ROOT.GetAdjective]ตองขยายกําลังการผลิตเพื่อตอบสนองความตองการที่เพิ่มขึ้นของการทําสงคราม การสรางสายการผลิตใหมจะเพิ่มผลผลิตเครื่องบินใหมและทําใหกองทัพอากาศของเรายังคงเปนกําลังทรงพลังในการตอสูกับศัตรู"
 FIN_modernize_production_lines: "ปรับปรุงสายการผลิตใหทันสมัย"
 FIN_modernize_production_lines_desc: "เพื่อสรางอุตสาหกรรมการบินระดับโลกที่สามารถผลิตอากาศยานทางทหารที่กาวหนาที่สุด รัฐบาล[ROOT.GetAdjective]จะลงทุนยกระดับโรงงานแหงชาติที่รับผิดชอบการผลิตยุทโธปกรณทางอากาศ เพื่อใหกองทัพอากาศของ[ROOT.GetName]เขาถึงเทคโนโลยีอากาศยานลาสุดและเชื่อถือไดมากที่สุด"
 FIN_suomen_merivoimat: "กองทัพเรือฟนแลนด"
 FIN_suomen_merivoimat_desc: "กองกําลังทางเรือของ[ROOT.GetName]ตองพรอมปกปองมาตุภูมิจากภัยคุกคามทุกรูปแบบ ดวยการเนนวิจัยยุทโธปกรณทางเรือสมัยใหมและพัฒนาโครงการฝกที่ดีขึ้น กองทัพเรือ[ROOT.GetAdjective]จะกลายเปนกําลังทรงพลังที่สามารถปกปองผลประโยชนของเราบนผืนนํ้า"
 FIN_the_merchant_fleet: "กองเรือพาณิชย"
 FIN_the_merchant_fleet_desc: "ในฐานะสวนหนึ่งของการทําสงคราม กองเรือพาณิชยของ[ROOT.GetName]ตองกาวใหทันเพื่อขนสงเสบียงสําคัญไปยังที่ที่ตองการ การลงทุนตอเรือใหมจะชวยเสริมความสามารถในการพึ่งพาตนเองและรักษาสถานะของเราในความขัดแยงใด ๆ"
 FIN_conversion_of_civilian_vessels: "ดัดแปลงเรือพลเรือน"
 FIN_conversion_of_civilian_vessels_desc: "ขณะที่สงครามยังดําเนินไปอยางดุเดือด เราตองใชทรัพยากรทั้งหมดที่มีอยู การดัดแปลงเรือพลเรือนจะทําให[ROOT.GetName]เสริมขีดความสามารถทางเรือไดอยางรวดเร็วและปกปองชายฝงจากภัยคุกคามของศัตรู เรือตัดนํ้าแข็งขนาดใหญสามารถดัดแปลงเปนเรือปองกันชายฝง สวนเรือขนาดเล็กกวาใชเปนเรือพิฆาตหรือเรือตรวจการณได สรางเครือขายปองกันอันนาเกรงขามตลอดชายฝง[ROOT.GetAdjective]"
 FIN_coastal_defense: "การปองกันชายฝง"
 FIN_coastal_defense_desc: "เมื่อเผชิญการรุกรานจากตางชาติ สิ่งสําคัญที่สุดคือการทําใหแนวชายฝงฟนแลนดไดรับการปกปองอยางดี การปรับปรุงโครงสรางพื้นฐานการปองกันชายฝงจะทําใหเราพรอมรับภัยคุกคามจากทะเลไดดียิ่งขึ้น"
 FIN_marine_jaeger_divisions: "กองพลนาวิกโยธินเยเกอร"
 FIN_marine_jaeger_divisions_desc: "นาวิกโยธินเยเกอรฟนแลนด (Rannikkojääkärit) กอตั้งขึ้นเมื่อปลายป 1934 ในฐานะเหลาทหารราบนาวิกโยธินชั้นยอดของกองทัพเรือฟนแลนด ทหารที่ผานการฝกมาอยางดีและปรับตัวไดเกงเหลานี้พรอมปฏิบัติภารกิจหลากหลาย ตั้งแตการปองกันชายฝงไปจนถึงการโจมตียกพลขึ้นบก และจะเปนกําลังสําคัญในการปะทะใด ๆ ตามชายฝงบอลติก"
 FIN_rapid_raiders: "นักจูโจมความเร็วสูง"
 FIN_rapid_raiders_desc: "เมื่อโลกกาวหนา กองทัพเรือของเราก็ตองกาวหนาตาม การลงทุนวิจัยและผลิตเรือพิฆาตสมัยใหมที่ติดตั้งเทคโนโลยีตอรปโดลาสุดจะทําใหเราโจมตีศัตรูไดอยางรวดเร็วและรายกาจ"
 FIN_deep_sea_raiders: "นักจูโจมใตทะเลลึก"
 FIN_deep_sea_raiders_desc: "เมื่อการทําสงครามเปนเดิมพัน กองทัพเรือ[ROOT.GetAdjective]ตองเรงผลิตเรือดํานํ้าสมัยใหมเพื่อตัดเสนทางเสบียงของศัตรูและปกปองเสนทางการคาของเราเอง เรือที่ปราดเปรียวและรายกาจเหลานี้จะสรางความหวาดกลัวในใจกะลาสีศัตรู และชวยให[ROOT.GetName]มีที่ยืนในฐานะมหาอํานาจทางทะเล"
 FIN_sea_mines_strategy: "ยุทธศาสตรทุนระเบิดทางทะเล"
 FIN_sea_mines_strategy_desc: "ดวยการวางทุนระเบิดในจุดยุทธศาสตร กองทัพเรือ[ROOT.GetAdjective]มุงทําใหนานนํ้ารอบชายฝงเปนอันตรายตอกองเรือศัตรู ทําใหพวกมันเขาใกลชายฝง[ROOT.GetAdjective]ไดยาก และรับประกันความปลอดภัยของการคาทางทะเลของเรา"
 FIN_expansion_towards_the_atlantic: "ขยายสูมหาสมุทรแอตแลนติก"
 FIN_expansion_towards_the_atlantic_desc: "การตอเรือของ[ROOT.GetAdjective]จะออกเดินทางสูมหาสมุทรแอตแลนติก ขยายขีดความสามารถทางเรือและสรางเรือขนาดใหญขึ้นเพื่อแผอํานาจขามมหาสมุทร ดวยเรือประจัญบานและเรือบรรทุกเครื่องบินที่เพิ่มเขามา กองทัพเรือของ[ROOT.GetName]จะกลายเปนกําลังที่ตองเกรงขามบนเวทีโลก"
 FIN_strengthen_the_naval_bases: "เสริมความแข็งแกรงฐานทัพเรือ"
 FIN_strengthen_the_naval_bases_desc: "ขณะที่[ROOT.GetName]เตรียมพรอมทําสงคราม สิ่งสําคัญคือฐานทัพเรือตองมีอุปกรณพรอมและไดรับการปกปองอยางดี การปรับปรุงโครงสรางพื้นฐานและการปองกันของฐานทัพเรือจะทําใหกองเรือของเราปลอดภัยและพรอมเขาปะทะศัตรู"
 FIN_expand_ship_building_industry: "ขยายอุตสาหกรรมตอเรือ"
 FIN_expand_ship_building_industry_desc: "เมื่อความตองการเรือรบเพิ่มขึ้น ความตองการอูตอเรือที่สามารถผลิตเรือเหลานั้นก็เพิ่มขึ้นดวย ดวยอุตสาหกรรมตอเรือที่ขยายตัว [ROOT.GetName]จะพรอมยิ่งขึ้นในการจัดหาเรือที่กองทัพตองการเพื่อแผอํานาจและปกปองชายฝง"
 FIN_acquire_andros_dockyards: "ซื้อกิจการอูตอเรืออันดรอส"
 FIN_acquire_andros_dockyards_desc: "การซื้อกิจการอูตอเรืออันดรอสในตุรกุจะชวยเพิ่มขีดความสามารถในการผลิตของผูออกแบบเรือชั้นนําของเรา $FIN_crichton_vulcan_organization$ อยางมาก ดวยสวนเพิ่มใหมนี้ กองทัพเรือ[ROOT.GetAdjective]จะผลิตเรือไดมากขึ้นและดีขึ้น เพิ่มอํานาจและอิทธิพลในภูมิภาค"
 FIN_innovative_designs: "การออกแบบเชิงนวัตกรรม"
 FIN_innovative_designs_desc: "ในการกาวกระโดดทางนวัตกรรมอันกลาหาญ วิศวกรของเราเปดตัวโครงการ "Hyökkäysvaunu" อันทะเยอทะยาน ขอเสนอรถถังหนักพิเศษที่ทาทายขอบเขตของการรบดวยยานเกราะ แมอาจดูแหวกแนว แตความพยายามอันอาจหาญนี้สะทอนความมุงมั่นของ[ROOT.GetNameDef]ที่จะสํารวจการออกแบบที่บุกเบิกและผลักดันขีดจํากัดของสิ่งที่เปนไปไดในสนามรบ"

 FIN_found_pohjolan_voima_factories_tt: "\nเพิ่มชองสิ่งกอสราง §G2§! ชองและ §Y1 $industrial_complex$§! ในรัฐดินแดนหลักที่ควบคุมเต็มที่ไดสูงสุด §Y5 รัฐ§! ที่มี$infrastructure$อยางนอย 3 ระดับ"
 FIN_tire_factory_at_nokia_tech_tt: "\nเมื่อวิจัยเทคโนโลยี §Y$synth_oil_experiments$§! แลว:"
 FIN_tire_factory_at_nokia_add_synthetic_refineries_tt: "เพิ่ม §G2§! §Y$synthetic_refinery$§!"
 FIN_expand_mining_prospection_tt: "เพิ่มการผลิต §Y2£resources_strip|5 §!ในทุกรัฐดินแดนหลักที่ผลิต §Y£resources_strip|5 $state_resource_steel$§! อยูแลว \nผลปจจุบัน:"

