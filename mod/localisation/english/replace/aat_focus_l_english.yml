### JOINT FOCUS TREE ### 

 NORDIC_form_joint_alliance: "กอตั้ง [NORDIC_get_alliance_name]"
 NORDIC_form_joint_alliance_desc: "ความฝนแพนสแกนดิเนเวียไดรับความเสียหายอยางหนักจากความลมเหลวในการยืนหยัดรวมกันเมื่อป 1864 [NORDIC_GetFormAllianceSecondParagraph]"
 NORDIC_form_joint_alliance_desc_dem: "อยางไรก็ตาม การกอตั้งพันธมิตรใหมบนพื้นฐานคานิยมประชาธิปไตยที่เรามีรวมกันอาจกลายเปนประภาคารแกประชาธิปไตยทั่วโลก พรอมกับปกปองตนเองและนําชัยชนะอันรวดเร็วมาสูการตอสูกับศัตรูแหงเสรีภาพ"
 NORDIC_form_joint_alliance_desc_com: "อยางไรก็ตาม ดวยแรงผลักดันของการปฏิวัติชนชั้นกรรมาชีพ เราสามารถรวมประชาชนของเราเขาดวยกันและมุงสูการตอสูกับทุนนิยม ดวยการรวมชาติของเราเปนพันธมิตรของประชาชนแดนเหนือ"
 NORDIC_form_joint_alliance_desc_mon: "อยางไรก็ตาม มรดกแหงราชวงศที่หยั่งรากในประเพณีอันยาวนานที่เรามีรวมกัน ทําใหเรามองเห็นภาพที่ใหญกวาและรวมมือกันเปนหนึ่งเดียว เพื่อธํารงไวซึ่งกษัตริยและราชินีอันเปนที่รักของเรา"
 NORDIC_political_cooperation: "ความรวมมือทางการเมือง"
 NORDIC_political_cooperation_desc: "ลมปากอยางเดียวไมพอสําหรับการรวมมือกันอยางแทจริง หากเราตองการเปนกําลังที่ใครก็ตองเกรงขาม ระบบทั้งหมดของเราตองเปนฟนเฟองของเครื่องจักรที่ใหญกวาและเดินเครื่องอยางราบรื่น"
 NORDIC_consolidating_institutions: "รวมสถาบันใหเปนหนึ่ง"
 NORDIC_consolidating_institutions_desc: "ยังไมเสร็จ (TODO_NORDIC)"
 NORDIC_economic_union: "สหภาพเศรษฐกิจ"
 NORDIC_economic_union_desc: "เราตองรวมทรัพยากรเขาดวยกัน เราทุกคนตางมีสิ่งที่เพื่อนบานตองการ ดวยการทลายกําแพงที่แยกเศรษฐกิจของเราออกจากกันมานาน เราจะมีประสิทธิภาพสูงขึ้น ทรัพยากรตองไหลเวียนระหวางเราเพื่อใหชวยเหลือกันไดดียิ่งขึ้น"
 NORDIC_procurement_fund: "กองทุนจัดซื้อ"
 NORDIC_procurement_fund_desc: "มหาอํานาจทางเศรษฐกิจและการทหารมีขีดความสามารถในการผลิตเครื่องมือเพื่อการปองกันและการพิชิต และแมเราจะมีอุตสาหกรรมทหารภายในประเทศ แตก็เทียบไมติด เราอาจยังไมสามารถเทียบพลังอุตสาหกรรมนี้ได แตเราสามารถรวมเงินทุนเพื่อจัดซื้ออาวุธและยานพาหนะจํานวนมากที่จําเปนตอการปองกันของเรา"
 NORDIC_shared_intelligence: "แบงปนขาวกรอง"
 NORDIC_shared_intelligence_desc: "โครงการ [NORDIC_get_alliance_name] ทั้งหมดหมุนรอบการแบงปนอํานาจ และหากความรูคืออํานาจจริง ก็ใหเราแบงปนสิ่งที่เรารูเกี่ยวกับศัตรู และสิ่งที่เรารูวาศัตรูรูเกี่ยวกับเรา และแมแตสิ่งที่พวกเขาคิดวารูเกี่ยวกับเรา"
 NORDIC_northern_command: "กองบัญชาการแดนเหนือ"
 NORDIC_northern_command_desc: "กองบัญชาการทหารรวมเปนสิ่งจําเปนเพื่อใหประสานการปฏิบัติไดดียิ่งขึ้น กองทัพตองปฏิบัติการรวมกันอยางราบรื่น และการตัดสินใจตองทําอยางรวดเร็วโดยคํานึงถึงผลประโยชนของทุกฝาย เราควรจัดตั้งกองบัญชาการเชนนี้ขึ้น เพื่อวางแผนสําหรับกองทัพรวมของเราตอไป"

 NORDIC_democratic_institution_1: "คณะกรรมาธิการรัฐมนตรีนอรดิก"
 NORDIC_communist_institution_1: "สหพันธรัฐแดนเหนือ"
 NORDIC_monarchist_institution_1: "ขุนนางแหงนอรเดน"
 NORDIC_first_joint_institution: "[NORDIC_get_institution_1_name]"
 NORDIC_first_joint_institution_desc: "ขณะที่เรากาวแรกสูการบูรณาการและความรวมมืออยางแทจริง [NORDIC_get_alliance_name] ตองการสถาบันใหม [NORDIC_get_institution_1_desc]"
 NORDIC_first_joint_institution_desc_dem: "ซึ่งเปนที่ที่คณะรัฐมนตรีจากประเทศตาง ๆ ในองคกรเหนือรัฐของเราจะหารือกันวาจะผสานความพยายามอยางไรใหดีขึ้น เพื่อนําประชาชนผานความตึงเครียดที่กําลังทวีขึ้นในยุโรป"
 NORDIC_first_joint_institution_desc_com: "ซึ่งสามารถรวมประชาชนของเราเปนหนึ่งและรับประกันความเปนเจาของปจจัยการผลิตของพวกเขา พรอมกับมอบสิทธิในการกําหนดตนเอง"
 NORDIC_first_joint_institution_desc_mon: "ซึ่งสามารถคลายใยแมงมุมแหงความเชื่อมโยงทางอภิชนาธิปไตยของเรา และจัดวางใหเปนกลุมดาวที่เปนเอกภาพของเหลาขุนนาง ซึ่งแตละคนมีบทบาทที่ตองทําในโครงสรางอํานาจ"
 
 NORDIC_democratic_institution_2: "รัฐสภาสูงสุดนอรดิก"
 NORDIC_communist_institution_2: "โปลิตบูโรแดนเหนือ"
 NORDIC_monarchist_institution_2: "สภาสิงหแหงแดนเหนือ"

 NORDIC_second_institution: "[NORDIC_get_institution_2_name]"
 NORDIC_second_institution_desc: "พันธมิตรของเราใกลชิดและเกี่ยวพันกันมากกวาที่เคย แตนั่นก็หมายความวาเมื่อรวมเปนหนวยเดียวก็เทอะทะและเชื่องชา ดวยการจัดตั้ง [NORDIC_get_institution_2_name] [NORDIC_get_institution_2_desc] " 
 NORDIC_second_institution_desc_dem: "เราจะมีองคกรนิติบัญญัติที่เปนตัวแทนของผูมีสิทธิเลือกตั้งในชาติของเรา และมีอํานาจบริหารเพื่อดําเนินการอยางรวดเร็วเมื่อเผชิญสงคราม"
 NORDIC_second_institution_desc_com: "เราจะมั่นใจไดวาเจตจํานงของแรงงานจะไดรับการเปนตัวแทน คนไมกี่คนที่เปนตัวแทนของคนจํานวนมากยอมจะทําเพื่อผลประโยชนสูงสุดของชนชั้นกรรมาชีพอยางแนนอน"
 NORDIC_second_institution_desc_mon: "เราจะรวบรวมเหลาลอรดและเลดี้ผูทรงอํานาจที่สุดแหงอาณาจักรที่รวมเปนหนึ่งของเรา เพื่อใหพวกเขากลาหาญและเด็ดเดี่ยวในการประนีประนอมอันยากลําบาก ซึ่งเปนภาระของชนชั้นสูง"

 NORDIC_nordic_army_democratic: "กรมปฏิบัติการภาคพื้นดิน"
 NORDIC_nordic_army_communist: "กองทัพประชาชนแดนเหนือ"
 NORDIC_nordic_army_monarchist: "สิงหเดินทัพ"

 NORDIC_nordic_army: "[NORDIC_get_nordic_army_name]"
 NORDIC_nordic_army_desc: "[NORDIC_get_nordic_army_desc]"
 NORDIC_nordic_army_desc_dem: "บทบาทของ [NORDIC_get_nordic_army_name] คือการกําหนดกรอบใหกําลังภาคพื้นดินตาง ๆ ในประเทศประชาธิปไตยของเราปฏิบัติการอยางเสริมกัน เพื่อใหจุดแข็งของฝายหนึ่งชดเชยจุดออนของฝายอื่น โดยมีเปาหมายเพื่อกําจัดการกดขี่ทั่วทั้งทวีป ทีละจังหวัด "
 NORDIC_nordic_army_desc_com: "ไมวาจะมาจากชาติใด ทหารทุกคนใน [NORDIC_get_nordic_army_name] ลวนเปนสวนหนึ่งของ [NORDIC_get_alliance_name] และจะเดินทัพจนกวาทุนนิยมจะถูกถอนรากถอนโคน ดวยพลังที่รวมกันและเจตจํานงอันไมลดละของเรา "
 NORDIC_nordic_army_desc_mon: "กองกําลังของ [NORDIC_get_alliance_name] ไมใชแคกองทัพธรรมดา แตเปนมากกวานั้น [NORDIC_get_nordic_army_name] จะสูอยางกลาหาญภายใตธงเดียว เพื่อเจาเหนือหัวและแผนดินที่พวกเขาเปนตัวแทน"

 NORDIC_nordic_navy_democratic: "กองบัญชาการประสานงานทางเรือ"
 NORDIC_nordic_navy_communist: "คณะกรรมาธิการนาวีแดนเหนือ"
 NORDIC_nordic_navy_monarchist: "ราชนาวีอารมาดา"
 
 NORDIC_nordic_navy: "[NORDIC_get_nordic_navy_name]"
 NORDIC_nordic_navy_desc: "[NORDIC_get_nordic_navy_desc]"
 NORDIC_nordic_navy_desc_dem: "ความกวางใหญของทองทะเลจะทําใหแตละประเทศของเราดูเล็กจอย แตหากเราผนึกกําลังกัน เราจะประสานปฏิบัติการและใชทรัพยากรที่มีจํากัดไดอยางมีประสิทธิภาพยิ่งขึ้นเพื่อชกเกินนํ้าหนักตัว นั่นจะเปนภารกิจของผูแทนใน [NORDIC_get_nordic_navy_name] เปนงานที่หนักหนาแนนอน แตพวกเขาจะมีทรัพยากรและการสนับสนุนทั้งหมดของ [NORDIC_get_alliance_name] อยูเบื้องหลัง"
 NORDIC_nordic_navy_desc_com: "ทองทะเลเปนของประชาชน และ [NORDIC_get_alliance_name] มุงมั่นที่จะปลดปลอยและยึดคืนมันเพื่อประชาชนแดนเหนือ [NORDIC_get_nordic_navy_name] จะทําใหมั่นใจวาสิ่งสุดทายที่ศัตรูไดเห็นคือเรือของเราที่ผุดขึ้นเหนือขอบฟาสีแดง"
 NORDIC_nordic_navy_desc_mon: "กองทัพเรือผสมของ [NORDIC_get_alliance_name] จะครองทองทะเลทั่วอาณาจักรของเรา [NORDIC_get_nordic_navy_name] จะเปนกระแสคลื่นที่โถมใสศัตรูจนเหลือเพียงซากเรือแตก"
 
 NORDIC_nordic_airforce_democratic: "โครงการปองกันภัยทางอากาศนอรดิก"
 NORDIC_nordic_airforce_communist: "คณะกรรมาธิการทางอากาศประชาชนแดนเหนือ"
 NORDIC_nordic_airforce_monarchist: "กองทัพอากาศหลวงผสม"

 NORDIC_nordic_airforce: "[NORDIC_get_nordic_airforce_name]"
 NORDIC_nordic_airforce_desc: "ทองฟาคือพรมแดนใหมของพันธมิตรเรา [NORDIC_get_nordic_airforce_desc]"
 NORDIC_nordic_airforce_desc_dem: "นั่นคือเหตุที่ [NORDIC_get_nordic_airforce_name] จะบริหารทรัพยากรที่จําเปนในการปกปองพลเมืองของแตละชาติใน [NORDIC_get_alliance_name] และจะทําใหมั่นใจวากองทัพอากาศของเรารวมมือกันและทํางานรวมกันไดอยางราบรื่น"
 NORDIC_nordic_airforce_desc_com: "เราไมอาจปลอยใหกองกําลังแหงทุนนิยมยึดแบบอยางแหงเสรีภาพที่เราทุกคนตองแบงปนอยางเทาเทียม กองทัพอากาศของเราจะรุมกลุมทองฟาของศัตรูและโปรยผืนไฟนรกลงใสพวกเขา"
 NORDIC_nordic_airforce_desc_mon: "หากเราพัฒนาขีดความสามารถทางอากาศ เราจะกําหนดทิศทางพลังของเราไดดียิ่งขึ้น เราจะทําใหศัตรูกมหัวตอหนาแสนยานุภาพของกองทัพอากาศผสมของเรา"

 NORDIC_nordic_research_democratic: "สภาวิจัยนอรดิก"
 NORDIC_nordic_research_communist: "มหาวิทยาลัยประชาชนแหงแดนเหนือ"
 NORDIC_nordic_research_monarchist: "ราชบัณฑิตยสถานรวม"

 NORDIC_nordic_research: "[NORDIC_get_nordic_research_name]"
 NORDIC_nordic_research_desc: "พลังเพียงอยางเดียวไมอาจชนะสงคราม ความกาวหนาทางเทคโนโลยีคือสิ่งที่ทําใหชาติในศตวรรษที่ 20 ไดเปรียบในการรบสมัยใหม [NORDIC_get_nordic_research_desc]"
 NORDIC_nordic_research_desc_dem: "[NORDIC_get_nordic_industry_name] จะนําเงินทุนและทรัพยากรไปสูมือที่ถูกตอง เพื่อใหทหารและนายพลของเรามีเครื่องมือที่ดีที่สุดรับมือกับความทาทายของสงคราม เทคโนโลยีขั้นสูงจะปกปองเราจากการหลั่งเลือดของพลเมืองอยางสูญเปลา"
 NORDIC_nordic_research_desc_com: "[NORDIC_get_nordic_industry_name] จะเปนสถาบันที่พัฒนาเครื่องมือทําลายลางลาสุด และผลิตเครื่องมือที่ดีที่สุดที่เราทําไดเปนจํานวนมาก เพื่อใหมันเปนกิโยตินเหนือศีรษะของฟาสซิสตและทุนนิยมเมื่ออยูในมือประชาชนของเรา"
 NORDIC_nordic_research_desc_mon: "ราชอาณาจักรทางเหนือเปดพื้นที่ใหวิทยาศาสตรกาวหนามาเสมอ และ [NORDIC_get_nordic_industry_name] จะสืบสานประเพณีนี้ โดยรวมอัจฉริยะที่ดีที่สุดของอาณาจักรเราไวในอาคารเดียว พวกเขาจะรับใชลอรดทุกทานดวยการชวยเหลือซึ่งกันและกัน"

 NORDIC_nordic_military_industry_democratic: "การจัดหายุทธปจจัยนอรดิก"
 NORDIC_nordic_military_industry_communist: "การผลิตอาวุธประชาชนแดนเหนือ"
 NORDIC_nordic_military_industry_monarchist: "โรงงานอาวุธหลวง"
 
 NORDIC_nordic_military_industry: "[NORDIC_get_nordic_military_industry_name]"
 NORDIC_nordic_military_industry_desc: "[NORDIC_get_nordic_military_industry_desc] หากเราตองสูจนคนสุดทาย คนเหลานั้นก็จะมีพลังโจมตีมากขึ้นดวยเครื่องมือที่เหมาะสม"
 NORDIC_nordic_military_industry_desc_dem: "โครงการ [NORDIC_get_nordic_industry_name] จะถูกจัดตั้งขึ้นเพื่อใหมั่นใจวาเครื่องจักรสงครามของเราไดรับฟนเฟองที่จําเปนตอการทํางานเสมอ และเพื่อปกปองชาติของเราจากความหวาดกลัวและทรราช"
 NORDIC_nordic_military_industry_desc_com: "การปฏิวัติจะไมปกปองตัวเอง และในทํานองเดียวกันจะไมแพรขยายหากปราศจากแรงผลักดันอันแข็งแกรงจากแรงงานที่ไดรับการปลดปลอยแลวของ [NORDIC_get_alliance_name]"
 NORDIC_nordic_military_industry_desc_mon: "ในยุคสมัยใหมของเรา ราชอาณาจักรตางลมสลายไปทั่ว และจิตวิญญาณของราชวงศเพียงอยางเดียวไมอาจชวยใหรอดพนจากการถูกลืมเลือน เราตองทําใหมั่นใจวาอาณาจักรของเรามีอาวุธที่จําเปนในการตอสูกับการสูญสิ้น"

 NORDIC_nordic_industry_democratic: "กองทุนพัฒนาอุตสาหกรรมนอรดิก"
 NORDIC_nordic_industry_communist: "แรงงานกาวพรอมกัน"
