 NORDIC_air_production: "การผลิตอากาศยาน"
 NORDIC_air_production_desc: "หากเราหวังจะสถาปนาความเปนใหญทั่วซีกโลกเหนือและไกลกวานั้น เราตองไลตามคลังสะสมหลายปที่มหาอํานาจมีเหนือเราใหทัน โชคดีที่เราสามารถแบงปนแนวปฏิบัติ ความรู และยุทโธปกรณที่ใชผลิตใหไดมากกวาศัตรูและปดชองวางนั้น"
 NORDIC_naval_aircraft: "อากาศยานนาวี"
 NORDIC_naval_aircraft_desc: "อนาคตของสงครามทางทะเลอยูบนทองฟา เครื่องบินทิ้งระเบิดทางทะเลของเราจะสงเรือของศัตรูลงสูกนทะเล และจากเรือบรรทุกเครื่องบินของเรา ฝูงเครื่องบินขับไลจะปกคลุมทองฟาดวยควันจากอากาศยานของศัตรู"
 NORDIC_air_exercises: "การฝกซอมทางอากาศ"
 NORDIC_air_exercises_desc: "เชนเดียวกับที่การรบทางอากาศไดนํามาซึ่งยุคใหมของสงคราม ยุคใหมแหงความรวมมือระหวางชาติของเราก็ตองมาพรอมปฏิบัติการทางอากาศรวมที่ดําเนินการอยางรัดกุม เพื่อการนั้น กองกําลังของเราตองฝกซอมรวมกันจนบินไดเปนหนึ่งเดียว"
 NORDIC_bomber_command: "กองบัญชาการทิ้งระเบิด"
 NORDIC_bomber_command_desc: "การจัดตั้งกองบัญชาการทิ้งระเบิดรวมจะชวยใหเราประสานการสนับสนุนภาคพื้นดินในสนามรบ และการบุกทิ้งระเบิดหลังแนวขาศึกไดดียิ่งขึ้น นี่คือหนทางเดียวที่ชาติแดนเหนือของเราจะรวมกันระดมความพยายามตอตานศัตรูได"
 NORDIC_fighter_command: "กองบัญชาการเครื่องบินขับไล"
 NORDIC_fighter_command_desc: "เชนเดียวกับที่เรามีอุดมการณและพันธกิจรวมกัน เราก็มีทองฟาเหนือศีรษะรวมกัน เราตองบินดวยกันเพื่อปกปองนานฟาของกันและกัน และครองความเปนเจาเวหาเหนือสนามรบ เพื่อไมใหสายสัมพันธของเราถูกทําลายดวยการสนับสนุนภาคพื้นดินของศัตรู"
 NORDIC_carrier_effort: "ทุมเทใหเรือบรรทุกเครื่องบิน"
 NORDIC_carrier_effort_desc: "พรมแดนใหมของการรบทางเรือคือทองฟาเหนือทองทะเล เราตองรวมทรัพยากรเพื่อสรางเรือบรรทุกเครื่องบินที่ดีที่สุด และอากาศยานประจําเรือบรรทุกเครื่องบินที่ดีที่สุดเทาที่เปนไปได ดวยวิธีนี้เราจะครองทองทะเล และสรางความมั่นคงที่ประเทศของเราตองการ"
 NORDIC_ground_operations: "ปฏิบัติการภาคพื้นดิน"
 NORDIC_ground_operations_desc: "การสรางฐานทัพมากขึ้นทําใหเรามีความยืดหยุนในปฏิบัติการทางอากาศรวมมากขึ้น และการสรางฐานปนตอสูอากาศยานเพิ่มจะชวยใหเราปกปองแผนดินและแบงเบาภาระจากบาของนักบิน นี่คือวิธีที่เราสรางระบบสนับสนุนภาคพื้นดินที่เชื่อมโยงกันเพื่อเพิ่มประสิทธิภาพของปฏิบัติการทางอากาศใหสูงสุด"
 
 NORDIC_naval_exercises: "การฝกซอมทางเรือ"
 NORDIC_naval_exercises_desc: "ทุกชาติของเรามีมรดกทางทะเลที่ยอนกลับไปหลายศตวรรษ ทะเลบอลติกและแอตแลนติกเหนือไดหลอหลอมวัฒนธรรมและวิถีชีวิตของเรา แตดังที่ชาตินักเดินเรือทุกชาติรู ทะเลเปนไดทั้งคูเมืองและทางหลวงในเวลาเดียวกัน ใหเราเรียนรูวิธีปองกันและโจมตีจากทะเล"
 NORDIC_defend_the_danish_belt: "ปกปองชองแคบเดนมารก"
 NORDIC_defend_the_danish_belt_desc: "ชองแคบเดนมารกคือประตูสูทะเลบอลติก หากพวกเขาไปถึงทะเลบอลติกจากแอตแลนติกเหนือไมได ชาติของเราจะปลอดภัยจากการยกพลขึ้นบกมากขึ้นมาก ใหเรามุงความพยายามเปลี่ยนมันเปนกําแพง เพื่อใหเราทองทะเลบอลติกไดอยางไรอุปสรรค"
 NORDIC_control_the_northern_sea: "ควบคุมทะเลทางเหนือ"
 NORDIC_control_the_northern_sea_desc: "ทะเลนอรเวยและทะเลเหนือคือประตูสูมหาสมุทรแอตแลนติก การมุงความพยายามที่นั่นจะชวยใหเรารับมือกับชาติบนชายฝงทางเหนือของยุโรป และแมแตไปถึงอเมริกาเหนือไดหากเราตองการ"
 NORDIC_baltic_sea_dominance: "ความเปนใหญในทะเลบอลติก"
 NORDIC_baltic_sea_dominance_desc: "ทะเลบอลติกเปนสวนหลังบานของเรามาชานาน เราจะไมมีโอกาสเลยหากปลอยใหชาติอื่นเปนใหญเหนือคลื่นของมันอยางเสรี ใหเราเสริมกําลังชายฝงเพื่อครองผืนนํ้าอันหนาวเย็นและเปลาเปลี่ยวนี้"
 NORDIC_naval_research_institute: "สถาบันวิจัยนาวี"
 NORDIC_naval_research_institute_desc: "การไลตามศัตรูใหทันยังไมเพียงพอ เราตองอยูแถวหนาของเทคโนโลยีทางเรือเหมือนที่เคยเปนมา ใหเราโอบรับมรดกแหงการสํารวจและความเปนใหญทางทะเลของภูมิภาคเรา"
 NORDIC_submarine_cooperation: "ความรวมมือดานเรือดํานํ้า"
 NORDIC_submarine_cooperation_desc: "ดวยการตัดความสามารถของศัตรูในการขนสงทหารและเสบียงทางทะเล เราก็ชนะสงครามไปครึ่งหนึ่งแลว วิธีที่ดีที่สุดที่จะทําใหมั่นใจในเรื่องนี้คือการรวมกันผลิตเรือดํานํ้าที่ลํ้าสมัยที่สุด"
 NORDIC_naval_officer_academy: "โรงเรียนนายทหารเรือ"
 NORDIC_naval_officer_academy_desc: "นายทหารที่ดีมีความสําคัญในสงครามทางเรือมากกวาการรบรูปแบบอื่นเกือบทั้งหมด กะลาสีคนเดียวทําอะไรไดไมมากหากไมมีการประสานงานจากลําดับชั้นนายทหารที่ประจําเรือและหมูเรือเฉพาะกิจของกองทัพเรือเรา การลงทุนฝกคนเหลานี้ใหตัดสินใจเรื่องยากและทํางานรวมกันจึงสําคัญอยางยิ่ง"
 NORDIC_amphibious_forces: "กองกําลังสะเทินนํ้าสะเทินบก"
 NORDIC_amphibious_forces_desc: "ดวยการทําใหมั่นใจวาเราโจมตีศัตรูไดทุกที่ทุกเวลา เราจะลดขีดความสามารถในการรุกของพวกเขา หากพวกเขาตองหวาดกลัวการยกพลขึ้นบกตลอดแนวชายฝงอยูเสมอ พวกเขาก็สงหนวยไปแนวหนาไดไมมากนัก ดังนั้นเราตองมุงเนนปฏิบัติการสะเทินนํ้าสะเทินบกและนาวิกโยธิน"
 
 NORDIC_joint_military_exercises: "การฝกซอมทางทหารรวม"
 NORDIC_joint_military_exercises_desc: "ทหารและนายทหารของเราไมเคยพบพันธมิตรแบบที่เราอยูในตอนนี้ พวกเขาตองฝกซอมเปนหนึ่งเดียวจนการทํางานรวมกันกลายเปนธรรมชาติที่สอง เมื่อนั้นกองกําลังของ [NORDIC_get_alliance_name] จะไมมีใครหยุดยั้งได"
 NORDIC_unified_recruitment: "การรับสมัครทหารแบบรวม"
 NORDIC_unified_recruitment_desc: "เราตองหาวิธีทําใหการรับสมัครทหารเปนมาตรฐานเดียวกัน และปรับกระบวนการใหคลองตัว เพื่อใหชายจํานวนมากขึ้นไปจากสํานักงานรับสมัครถึงแนวหนาไดเร็วที่สุด"
 NORDIC_mechanized_army: "กองทัพยานเกราะลําเลียงพล"
 NORDIC_mechanized_army_desc: "หากเรามุงฝกทหารใหสูทั้งภายในและเคียงขางยานพาหนะมหึมาที่หุมดวยเหล็กกลาและปนใหญ เราจะมีพลังโจมตีมากขึ้นดวยกําลังคนที่นอยลง แนนอนวาตราบเทาที่เราผลิตยานมหึมาเหลานั้นไดมากพอ"
 NORDIC_infantry_first: "ทหารราบมากอน"
 NORDIC_infantry_first_desc: "หลายชั่วอายุคนที่ทหารของเราออกสูสนามรบดวยเพียงอาวุธและเสื้อผาบนตัว เพื่อสูยิบตาแยงชิงทุกตารางนิ้วกับอีกดวงวิญญาณผูนาสงสารที่อยูตรงหนา หากทหารของเราไดเห็นดวงตาของศัตรูตรงหนา พวกเขาจะเห็นภัยคุกคามที่ศัตรูนํามา และสูจนตัวตายเพื่อชาติของตน"
 NORDIC_expedited_training: "เรงรัดการฝก"
 NORDIC_mountaineers: "ผูเชี่ยวชาญการรบบนภูเขา"
 NORDIC_mountaineers_desc: "ภูมิภาคนอรดิกเหมาะอยางยิ่งสําหรับการฝกและใชงานทหารภูเขา ดวยแกนกลางผูเชี่ยวชาญการรบบนภูเขาที่แข็งแกรง เราจะปองกันภูมิภาคนี้ไดงายขึ้นมาก และพรอมตีโตกลับทุกครั้งที่มีโอกาส แมดินแดนบางสวนของเราจะตกอยูในมือศัตรู เราก็จะไมมีวันยอมจํานน"

 NORDIC_nordic_construction_developments: "การพัฒนาการกอสรางนอรดิก"
 NORDIC_nordic_construction_developments_desc: "ยังมีงานอีกมากที่ตองทําใน [NORDIC_get_alliance_name] แตเวลากอนถึงชั่วโมงแหงหายนะเหลือนอยเต็มที กลุมชาติของเราตองรวมมือกันหาแนวทางปรับปรุงที่จําเปนเพื่อเรงการพัฒนาใหทันการณ"
 NORDIC_materiel_design: "การออกแบบยุทโธปกรณ"
 NORDIC_materiel_design_desc: "สงครามเปลี่ยนแปลงไปหลายดานในแตละยุคสมัย แตหลายศตวรรษมาแลวที่แกนของมันมักเหลือเพียงทหารหนึ่งคนกับปนเล็กยาวหนึ่งกระบอก ในสงครามยุคใหมนี้ เราจะละเลยอาวุธของทหารแหง [NORDIC_get_alliance_name] ไมได อาวุธที่ดีกวาจะสรางทหารที่ดีกวา"
 NORDIC_nordic_electronics: "อิเล็กทรอนิกสนอรดิก"
 NORDIC_nordic_electronics_desc: "ยุคแหงอิเล็กทรอนิกสมาถึงแลว และมันอาจกลายเปนปจจัยชี้ขาดของสงครามในอนาคต เราจะปลอยใหศัตรูชิงตัดหนาในการแขงขันดานอิเล็กทรอนิกสไมได มารวมกันพัฒนาเทคโนโลยีนี้ เพื่อใหพลังใหมนี้อยูขางเรา"
 NORDIC_research_investments: "การลงทุนวิจัยรวม"
 NORDIC_research_investments_desc: "พันธมิตรใหมของเราแนนแฟนกวาใคร จึงไมมีเหตุผลที่จะเก็บความกาวหนาทางเทคโนโลยีไวแตเพียงผูเดียว มาแบงปนการวิจัยกัน เพื่อใหเครื่องมือสงครามของเรามีความเหนือกวาที่จําเปนในการโคนศัตรู"
 NORDIC_civilian_contributions: "การมีสวนรวมของพลเรือน"
 NORDIC_civilian_contributions_desc: "บัดนี้ประชาชนทั่วไปมีสํานึกในอัตลักษณรวมกับสมาชิกอื่นของพันธมิตรแลว เรามั่นใจวาพวกเขาพรอมจะทุมเทและเสียสละเพื่อขับเคลื่อนเครื่องจักรสงครามที่จะนําความปลอดภัยและความรุงโรจนมาสู [NORDIC_get_alliance_name]"
 NORDIC_nuclear_research: "การวิจัยนิวเคลียร"
 NORDIC_nuclear_research_desc: "เหลานักวิทยาศาสตรตางพูดกันไมหยุดถึงโลกใหมที่จะมาถึงเมื่อการแยกอะตอมถูกนํามาใชเปนอาวุธ แลวทําไมเราตองถูกกีดกันจากปาฏิหาริยทางเทคโนโลยีที่อาจยุติสงครามไดในพริบตาเดียวดวยเลา"
 NORDIC_nordic_rocketry: "จรวดนอรดิก"
 NORDIC_nordic_rocketry_desc: "จะเปนอยางไรหากเราสงระเบิดไปถึงเปาหมายไดโดยไมตองใชเครื่องบิน? อาวุธขับเคลื่อนดวยตัวเองคืออนาคต เราจะทําลายลางศัตรูไดจากความสะดวกสบายภายใน [NORDIC_get_alliance_name] หากเราตองการ"
 NORDIC_standarized_parts: "ชิ้นสวนมาตรฐาน"
 NORDIC_standarized_parts_desc: "บัดนี้เมื่อเรายืนหยัดเปนหนึ่งเดียว เราจะไดประโยชนจากการใชมาตรฐานรวมกัน เพื่อใหโรงงานของเราเรงการผลิตไดเร็วที่สุด ยุทโธปกรณและชิ้นสวนจะใชแทนกันได ทําใหการผลิตของเราคลองตัวขึ้นอยางมาก"
 NORDIC_fill_the_infrastructure_gaps: "อุดชองวางโครงสรางพื้นฐาน"
 NORDIC_fill_the_infrastructure_gaps_desc: "กอนจะรวมตัวกัน ประเทศของเราพัฒนาในระดับที่แตกตางกัน และแมแตบางภูมิภาคในประเทศที่พัฒนาที่สุดใน [NORDIC_get_alliance_name] ก็ยังตองการโครงสรางพื้นฐานที่ดีกวานี้ เราตองรวมแรงกันยกระดับทุกฝายไปพรอมกัน"
 NORDIC_develop_resources: "พัฒนาทรัพยากร"
 NORDIC_develop_resources_desc: "หากคนหาอยางจริงจัง ใครจะรูวาจะเจออะไรบาง หากเราทุมความพยายาม เราอาจขุดพบแหลงทรัพยากรที่สําคัญตอสงครามซึ่งยังไมมีใครคนพบ และอาจคิดคนวิธีใหมในการสกัดทรัพยากรจากแหลงที่มีอยูแลวไดมากขึ้น"
 NORDIC_military_industry_hub: "ศูนยกลางอุตสาหกรรมทหาร"
 NORDIC_military_industry_hub_desc: "ดวยการรวมศูนยอุตสาหกรรมทหารอยางมีประสิทธิภาพ เราจะใชความใกลชิดและความชํานาญเฉพาะทางยกระดับเครื่องจักรสงครามของเราขึ้นไปอีกขั้น เราจะผลิตไดมากกวาศัตรู ตราบใดที่โรงงานของเรายังอยูครบ"
 NORDIC_ad_hoc_military_industry: "อุตสาหกรรมทหารเฉพาะกิจ"
 NORDIC_ad_hoc_military_industry_desc: "ไมมีเวลาวางแผนและสรางนิคมโรงงานขนาดมหึมา หรือผืนคอนกรีตกับควันไฟสุดลูกหูลูกตา เราตองสรางอุตสาหกรรมใหเร็วที่สุดเทาที่ทําได ในทุกที่ที่เปนไปได ดวยโรงงานขนาดเล็กที่กระจายอยูทั่ว [NORDIC_get_alliance_name] เพื่อไมใหเสี่ยงสูญเสียทุกอยางในการรบครั้งเดียว"
 NORDIC_railway_expansion: "ขยายเสนทางรถไฟ"
 NORDIC_railway_expansion_desc: "ทางรถไฟคือเสนเลือดใหญของชาติเรา และยามนี้เราตองการเสนทางคมนาคมเหลานี้ใหแผกวางที่สุดยิ่งกวาครั้งใด เมื่อเรามีเปาหมายรวมกันแลว เราก็ตองเชื่อมถึงกันทางกายภาพดวยเหล็กกลาและความเร็วของหัวรถจักร"
 NORDIC_naval_construction: "การตอเรือรบ"
 NORDIC_naval_construction_desc: "การมีประเพณีการเดินเรืออันยาวนานและกะลาสีระดับโลกเปนเรื่องดี แตจะไรความหมายหากเราไมมีเรือใหพวกเขาใชสูกับศัตรู มารวมกันสรางกองเรืออันยิ่งใหญ และใชมันบดขยี้ทุกประเทศที่คุกคามเรา"
 NORDIC_nuclear_production: "การผลิตนิวเคลียร"
 NORDIC_nuclear_production_desc: "เมื่อเรามีความรูในการแยกอะตอมแลว ก็ควรนํามาใชใหเกิดประโยชน แตกอนอื่น เราตองผลิตวัตถุดิบและสรางโครงสรางพื้นฐานที่จําเปน เพื่อผลิตใหไดมากพอจะพลิกกระแสสงครามใหเปนคุณแกเรา"
 NORDIC_jet_engines: "สูยุคไอพน"
 NORDIC_jet_engines_desc: "ความกาวหนาใหมของเครื่องยนตไอพนทําใหเครื่องบินใบพัดชั้นยอดดูไมตางจากวาวกระดาษที่ลอยไปอยางไรทิศทาง ยุคใหมของการรบทางอากาศมาถึงแลว และเครื่องยนตไอพนจะครองความเปนใหญ หากเรารวมกันลงทุนในดานนี้ เราจะกาวขามศัตรูและผลิตเครื่องบินที่อยูบนสุดของหวงโซอาหารได"
 NORDIC_machine_tools_research: "การวิจัยเครื่องมือกล"
 NORDIC_machine_tools_research_desc: "กําลังพลเปนเพียงสวนหนึ่งของสมการ เราตองผลิตใหมากกวาศัตรูเพื่อทดแทนความสูญเสียที่พวกเขาทดแทนไมได นี่คือเหตุผลที่เราจะไมจํากัดตัวเองอยูแคการพัฒนาเครื่องจักรสงครามใหม แตตองใสใจกับเครื่องจักรที่ใหกําเนิดพวกมันดวย"
 NORDIC_equipment_conversion_focus: "แผนยุทธศาสตรการดัดแปลงยุทโธปกรณ"
 NORDIC_equipment_conversion_focus_desc: "เรามีโกดังมหึมาที่เต็มไปดวยอาวุธและยานพาหนะเกา ทั้งที่เก็บไวไมไดใชงานและที่ยึดมาจากศัตรูที่พายแพ ยุทโธปกรณเกาเหลานี้สามารถนํามาปรับปรุงใหเปนอาวุธใหมลาสุดและรายกาจที่สุดที่เครื่องจักรสงครามของเรามีให"
 
