 POR_unreliable_army: "กองทัพที่ไวใจไมได"
 POR_unreliable_army_desc: "ดวยการรัฐประหารและการรัฐประหารซอนอยางตอเนื่องนับตั้งแตการสถาปนาสาธารณรัฐในป 1910 นายทหารในกองทัพจึงหมกมุนกับการเมืองมากกวาการรักษาวินัยและการสงเสริมการฝกในกองทัพ ทหารชั้นผูนอยขวัญเสีย ขาดแคลนยุทโธปกรณ และไดรับการฝกอยางยํ่าแย"
 POR_unstable_republic: "สาธารณรัฐที่ไรเสถียรภาพ"
 POR_unstable_republic_desc: "ยุคสาธารณรัฐที่สถาปนาขึ้นในป 1910 ถูกบรรยายวาเปนยุคแหง "อนาธิปไตยตอเนื่อง การทุจริตในรัฐบาล การจลาจลและการปลนสะดม การลอบสังหาร การจําคุกตามอําเภอใจ และการกดขี่ทางศาสนา" ยุคนี้มีการเขารับตําแหนงของประธานาธิบดีเกาคน การปรับคณะรัฐมนตรี 44 ครั้ง และการปฏิวัติ 21 ครั้ง แมหลังรัฐประหารของทหารในป 1926 ก็ยังมีความพยายามปฏิวัติที่ลมเหลวอีกหลายครั้ง"
