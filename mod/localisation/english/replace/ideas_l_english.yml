 RAJ_risk_of_famine_instant_desc: "§Rทุพภิกขภัย§!จะเกิดขึ้นหากขอใดขอหนึ่งตอไปนี้เปนจริง:\n -เราสูญเสียรัฐเริ่มตนของอินเดียและไมสามารถยึดคืนไดภายใน §Y30 วัน§! (ไมรวมเอเดน)\n-ผูควบคุมรายใหมไมใชรัฐที่ปลดปลอยไดซึ่งเรายึดครองอยูตั้งแตเริ่มเกม\n-ผูควบคุมรายใหมไมใชรัฐในอารักขาของเรา"
