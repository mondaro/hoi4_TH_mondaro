l_english:
 fascist_influence: "อิทธิพลฟาสซิสต"
 fascist_influence_desc: "แรงกดดันของฟาสซิสตทําใหลัทธิฟาสซิสตไดรับความนิยมอยางมาก และประเทศนี้มีแนวโนมจะเขาขางฟาสซิสตชาติอื่น"
 communist_influence: "อิทธิพลคอมมิวนิสต"
 communist_influence_desc: "แรงกดดันของคอมมิวนิสตทําใหลัทธิคอมมิวนิสตไดรับความนิยมอยางมาก และประเทศนี้มีแนวโนมจะเขาขางคอมมิวนิสตชาติอื่น"
 democratic_influence: "อิทธิพลประชาธิปไตย"
 democratic_influence_desc: "แรงกดดันของฝายประชาธิปไตยทําใหประชาธิปไตยไดรับความนิยมอยางมาก และประเทศนี้มีแนวโนมจะเขาขางฝายประชาธิปไตยชาติอื่น"
 neutrality_influence: "อิทธิพลอํานาจนิยม"
 neutrality_influence_desc: "แรงกดดันของฝายอํานาจนิยมนําไปสูความเคารพครั้งใหมตอผูที่มีรัฐบาลเขมแข็งและราชวงศอันสูงศักดิ์ และประเทศนี้มีแนวโนมจะเขาขางรัฐบาลอํานาจนิยมอื่นๆ"
 soviet_german_friendship: "มิตรภาพโซเวียต-เยอรมัน"
 soviet_german_friendship_desc: "ไรชเยอรมันและสหภาพโซเวียตไดผนึกกําลังเปนมิตรเพื่อตอตานตะวันตกที่เสื่อมทราม"
 sour_loser: "ผูแพที่ขมขื่น"
 sour_loser_desc: "ความขมขื่นจากความพายแพในมหาสงครามครอบงําการเมืองของชาตินี้"
 received_attache: "ไดรับผูชวยทูตทหาร"
 received_attache_desc: "ผูชวยทูตทหารตางชาติที่ประจําอยูในประเทศของเรา"
 ATTACHE_LIST: "เราไดรับผูชวยทูตทหารจาก $LIST$ และพวกเขามอบผลดังตอไปนี้ใหแกเรา:"
 porsche: "ปอรเช"
 porsche_desc: "ปอรเชนิยมรถถังที่มีเกราะหนา"
 henschel: "เฮนเชล"
 henschel_desc: "เฮนเชลเปนผูรับผิดชอบรถถังไทเกอรทุกรุนที่ผลิตเปนจํานวนมาก ซึ่งหลังจากแกไขปญหาความนาเชื่อถือในชวงแรกไดแลว ก็มีประสิทธิภาพยอดเยี่ยม"
 GER_MAN: "มาน (MAN)"
 GER_MAN_desc: "MAN เปนที่รูจักมากที่สุดจากรถถังพันเทอร และยังมีสวนรวมในการออกแบบและผลิตรถถังพันเซอรรุนกอนหนาดวย"
 rheinmetall: "ไรนเมทัล"
 rheinmetall_desc: "ไรนเมทัลออกแบบและสรางปนใหญและอาวุธปนขนาดใหญทุกประเภท"
 mauser: "เมาเซอร"
 mauser_desc: "เมาเซอรออกแบบและสรางอาวุธเบาทุกประเภท"
 ig_faben: "ไอจี ฟารเบิน"
 ig_faben_desc: "ไอจี ฟารเบินมีความสนใจอยางยิ่งในการวิจัยดานอุตสาหกรรม"
 messerschmitt: "เมสเซอรชมิตต"
 messerschmitt_desc: "เมสเซอรชมิตตมุงเนนการออกแบบอากาศยานเบา เชน เครื่องบินขับไล"
 focke_wulf: "ฟอคเคอ-วุลฟ"
 focke_wulf_desc: "ฟอคเคอ-วุลฟมีความสนใจเปนพิเศษในการออกแบบอากาศยานขนาดกลาง เชน เครื่องบินขับไลหนัก"
 junkers: "ยุงเคอรส"
 junkers_desc: "ยุงเคอรสมีชื่อเสียงที่สุดจากการพัฒนาเครื่องบินทิ้งระเบิดแบบดิ่งสตูกา"
 todt: "ฟริทซ ทอดท"
 todt_desc: "ฟริทซ ทอดท วิศวกรชาวเยอรมัน เปนผูกอตั้งองคการทอดท เขาจะเพิ่มความเร็วในการสรางโครงการอุตสาหกรรมพลเรือน"
 speer: "อัลแบรท ชเปยร"
 speer_desc: "อัลแบรท ชเปยร เปนสถาปนิกชาวเยอรมันผูดํารงตําแหนงรัฐมนตรีกระทรวงอาวุธยุทโธปกรณและการผลิตเพื่อสงครามตั้งแตป 1942 ถึง 1945 มักไดรับการยกยองวาเปนผูสราง 'ปาฏิหาริยดานอาวุธยุทโธปกรณ' การแตงตั้งเขาจะเพิ่มประสิทธิภาพทางอุตสาหกรรม"
 raeder: "เอริช เรเดอร"
 raeder_desc: "เอริช เรเดอร เปนพลเรือเอกชาวเยอรมันผูนิยมใชเรือผิวนํ้าแบบดั้งเดิมและหลักนิยมกองเรือที่ดํารงอยู"
 donitz: "คารล เดอนิทซ"
 donitz_desc: "คารล เดอนิทซ เปนพลเรือเอกชาวเยอรมันผูชื่นชอบเรือดํานํ้าและหลักนิยมการสกัดกั้นการคา"
 goering: "แฮรมันน เกอริง"
 goering_desc: "แฮรมันน เกอริง เปนนักบินขับไลมือฉมังในมหาสงครามผูกลายมาเปนหนึ่งในผูสนับสนุนคนสําคัญของฮิตเลอร แมจะไมใชคนที่ดีที่สุดสําหรับงานนี้ แตเขาก็ภักดีอยางสุดใจ"
 walther_wever: "วัลเทอร เวเฟอร"
 walther_wever_desc: "วัลเทอร เวเฟอร เปนผูสนับสนุนทฤษฎีการทิ้งระเบิดทางยุทธศาสตรในยุคแรก"
 ritter_von_greim: "ริทเทอร ฟอน ไกรม"
 ritter_von_greim_desc: "ริทเทอร ฟอน ไกรม เปนผูสนับสนุนการสกัดกั้นทางยุทธวิธี"
 ernst_udet: "แอนสท อูเดท"
 ernst_udet_desc: "แอนสท อูเดท มีอิทธิพลตอการนําเทคนิคการทิ้งระเบิดแบบดิ่งและเครื่องบินทิ้งระเบิดแบบดิ่งสตูกามาใช"
 werner_von_fritsch: "แวรเนอร ฟอน ฟริทช"
 werner_von_fritsch_desc: "แวรเนอร ฟอน ฟริทช นายพลหัวเกา นิยมมุงเนนทหารราบ"
 ludwig_beck: "ลุดวิช เบ็ค"
 ludwig_beck_desc: "ลุดวิช เบ็ค ใหความสําคัญเปนพิเศษกับเสบียง"
 franz_halder: "ฟรันซ ฮัลเดอร"
 franz_halder_desc: "ฟรันซ ฮัลเดอร เชื่อมั่นในพลังโจมตีของปนใหญในการรุก"
 heinz_guderian: "ไฮนทซ กูเดรีอัน"
 wilhelm_keitel: "วิลเฮลม ไคเทล"
 wilhelm_keitel_desc: "วิลเฮลม ไคเทล นายพลหัวเกา นิยมทหารราบ สิ่งที่เขาขาดในดานฝมือ เขาชดเชยดวยความภักดี"
 ferdinand_schorner: "แฟรดีนันท เชอรเนอร"
 ferdinand_schorner_desc: "แฟรดีนันท เชอรเนอร เชี่ยวชาญดานการปองกันและการรบในสภาพอากาศหนาวเย็น"
 general_staff: "เสนาธิการทหาร"
 general_staff_desc: "เสนาธิการทหารเยอรมันรับผิดชอบการศึกษาทุกแงมุมของสงครามอยางตอเนื่อง รวมถึงการรางและทบทวนแผนการระดมพลหรือการรณรงค ซึ่งชวยใหกองทัพมีการจัดระเบียบในระดับที่สูงขึ้น"
 v_weapons: "อาวุธแกแคน"
 v_weapons_desc: "จรวดโจมตีพิสัยไกลจะเปนอาวุธแกแคนที่เหมาะสมยิ่งตอศัตรูของเรา"
 hermann_gortz: "แฮรมันน เกิรทซ"
 hermann_gortz_desc: "§Hแฮรมันน เกิรทซ§! เปนสายลับชาวเยอรมันผูมีฝมือ"
 elyesa_bazna: "เอลเยซา บัซนา"
 elyesa_bazna_desc: "§Hเอลเยซา บัซนา§! เปนที่รูจักอยางกวางขวางในชื่อรหัสวาซิเซโร"
 marina_lee: "มารีนา ลี"
 marina_lee_desc: "§Hมารีนา ลี§! คือนักบัลเลตผูเชี่ยวชาญการขโมยแผนการรบ"
 german_advisors: "ที่ปรึกษาทางทหารชาวเยอรมัน"
 german_advisors_desc: "คณะผูแทนทางทหารของเยอรมนีซึ่งนําโดยอเล็กซานเดอร ฟอน ฟลเคินเฮาเซิน ประจําอยูในจีน และเหลาที่ปรึกษาของคณะนี้กําลังชวยยกระดับกองทัพของเราใหทัดเทียมมาตรฐานตะวันตก"
