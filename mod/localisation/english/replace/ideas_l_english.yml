 RAJ_agrarian_society_desc: "ผูบริหารทองถิ่นเชื่อวาวิถีชีวิตเกษตรกรรมทําใหประชากรอินเดียสวนใหญไมเหมาะกับการรับราชการทหารหรือการทําสงครามในรูปแบบใดๆ เลย พวกเขายืนกรานวาเราควรเกณฑคนจาก "ชนเผานักรบ" เทานั้น ความเชื่อนี้แพรหลายและฝงรากลึกจนตองใชเวลาอยางนอยหนึ่งชั่วอายุคน หรือการลงทุนในชนบทอยางมาก จึงจะเอาชนะได"
