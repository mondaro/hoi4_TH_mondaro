 state_shintoism_desc: "นับตั้งแตการปฏิรูปเมจิ เราไดใชการบูชาที่ศาลเจาชินโตเพื่อสงเสริมความจงรักภักดีตอจักรพรรดิและชวยในการสรางชาติ สิ่งนี้ทําใหเราสรางประเทศที่พรอมจะเสียสละอยางมากในนามของรัฐ "
 vittoria_mutilata: "ชัยชนะอันพิกลพิการ"
 vittoria_mutilata_desc: "§Lพันธมิตรของเราทรยศอิตาลีและแทงขางหลังเราเมื่อพวกเขาละเมิดสนธิสัญญาลอนดอน เราสละเลือดเนื้อมากมายที่อิซอนโซเพื่อชัยชนะของพวกเขา แตพวกเขากลับปฏิเสธสิ่งที่ควรเปนของเราโดยชอบธรรม บัดนี้อิตาลีจะกําหนดชะตากรรมของตนเองและทําใหความยุติธรรมบังเกิด§!"
 stiff_upper_lip: "ความอดทนแบบบริติช"
 stiff_upper_lip_desc: "หากเจายังคงสติไวได ยามที่ทุกคนรอบกาย\nพากันเสียสติและโทษวาเปนความผิดของเจา\nหากเจาเผชิญไดทั้งชัยชนะและหายนะ\nและปฏิบัติตอผูแอบอางทั้งสองนั้นเชนเดียวกัน\nโลกและทุกสิ่งในนั้นจะเปนของเจา\nและยิ่งกวานั้น ลูกเอย เจาจะเปนลูกผูชาย "
 trotskyite_plot: "แผนสมคบคิดของพวกทรอตสกี?"
 trotskyite_plot_desc: "ความหวาดระแวงและความไมไววางใจอยางผิดปกติที่เกิดจากการแยงชิงอํานาจในอดีตสงผลกระทบตอผูนําของชาตินี้"
 trotskyite_plot_purged: "กวาดลางแผนสมคบคิดของพวกทรอตสกีแลว?"
