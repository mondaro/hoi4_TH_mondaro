 RAJ_famine_desc: "ความไรความสามารถ ความเฉยเมย และการทุจริตอยางโจงแจงในรัฐบาลอาณานิคมและการรถไฟอินเดีย ไดเปลี่ยนสถานการณที่ยากลําบากใหกลายเปนหายนะเต็มรูปแบบ ประเทศจะตองทนทุกขจากเรื่องนี้ไปอีกหลายเดือน"
