BEL_anti_tank_guns_tt: "เปดใช§Hปนตอสูรถถังชั้นเยี่ยม§!\nการโจมตีเปาแข็งของตอสูรถถังสนับสนุน: §G+10%§!\nการเจาะเกราะของตอสูรถถังสนับสนุน: §G+10%§!\nการโจมตีเปาแข็งของตอสูรถถังแนวหนา: §G+10%§!\nการเจาะเกราะของตอสูรถถังแนวหนา: §G+10%§!\nการโจมตีเปาแข็งของตอสูรถถังยานยนต: §G+10%§!\nการเจาะเกราะของตอสูรถถังยานยนต: §G+10%§!\nการโจมตีเปาแข็งของยานพิฆาตรถถัง: §G+10%§!\nการเจาะเกราะของยานพิฆาตรถถัง: §G+10%§!\n"
