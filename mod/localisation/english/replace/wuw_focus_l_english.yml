 ### CONGO SHARED FOCUS TREE ###


 CONGO_belgian_congo: "เบลเยียมคองโก"
 CONGO_belgian_congo_desc: "อาณานิคมนี้กอตั้งขึ้นในป 1908 หลังจากรัฐเสรีคองโกถูกผนวกเขากับรัฐบาลเบลเยียม พนจากการขูดรีดโดยราชบัลลังกเบลเยียม เบลเยียมคองโกยังคงเปนอัญมณีที่อยูใจกลางนโยบายอาณานิคมของเบลเยียม"
 
 CONGO_expand_villages: "ขยายหมูบาน"
 CONGO_expand_villages_desc: "คองโกมีศักยภาพมหาศาล แตจะบรรลุไดก็ตอเมื่อมีแรงงานจํานวนมากและกระตือรือรน เราควรตั้งหมูบานใหมในพื้นที่ที่ตองการพัฒนาเพื่อสงเสริมการเติบโตนี้"
 
 CONGO_free_enterprise_fund: "กองทุนวิสาหกิจเสรี"
 CONGO_free_enterprise_fund_desc: "ฝายบริหารอาณานิคมเบลเยียมตระหนักดีวาตองลงทุนเพื่อดึงประโยชนสูงสุดจากคองโก ดวยเหตุนี้จึงเสนอเงินชวยเหลือแกธุรกิจขนาดเล็กเพื่อชวยใหเริ่มตนได"
 
 CONGO_secure_international_funding: "จัดหาเงินทุนระหวางประเทศ"
 CONGO_secure_international_funding_desc: "ทางการอาณานิคมเบลเยียมไมใชมหาอํานาจเดียวที่ตระหนักถึงศักยภาพของคองโก เราควรมองหาหุนสวนระหวางประเทศเพื่อการลงทุน ซึ่งเราสามารถทําธุรกิจดวยได ไมวาจะมีหรือไมมี[BEL.GetName]"
 CONGO_secure_international_funding_tt: "ปลดล็อกการตัดสินใจ§Yนําเงินทุนระหวางประเทศมาลงทุนในโครงสรางพื้นฐานและอุตสาหกรรมของคองโก§!"
 
 CONGO_weapon_repair_workshops: "โรงซอมอาวุธ"
 CONGO_weapon_repair_workshops_desc: "แมการผลิตทางทหารสวนใหญจะดําเนินการในเบลเยียม แตยังมีโรงงานขนาดเล็กจํานวนหนึ่งที่สามารถซอมแซมและดัดแปลงยุทโธปกรณทางทหารเกาได เราควรทําใหแนใจวาพวกเขามีสิ่งที่จําเปน เผื่อเราตองเรียกใชยุทโธปกรณนี้ในอนาคต"
 
 CONGO_rawji_group: "กลุม Rawji"
 CONGO_rawji_group_desc: "จากจุดเริ่มตนอันตํ่าตอย ธุรกิจของ Rawji ไดขยายตัวครอบคลุมอุตสาหกรรมและกิจการหลากหลายทั่วคองโก"
 
 CONGO_the_heart_of_africa: "หัวใจแหงแอฟริกา"
 CONGO_the_heart_of_africa_desc: "ดินแดนอันกวางใหญของคองโกตั้งอยูกลางแอฟริกา และแมจะคอนขางยากจนและดอยพัฒนา แตดินแดนตอนในซอนความมั่งคั่งดานทรัพยากรและความเปนไปไดมหาศาลไว สิ่งที่เราตองทําคือออกไปคนหามัน"
 
 CONGO_establish_university_of_louvain: "กอตั้งมหาวิทยาลัยโลวาเนียม"
 CONGO_establish_university_of_louvain_desc: "เดิมกอตั้งเปนวิทยาลัยแพทยเพื่อศึกษาเวชศาสตรเขตรอน เรามีโอกาสขยายสถาบันดวยภาควิชาวิทยาศาสตรการเกษตร และเมื่อเรายกฐานะเปนมหาวิทยาลัยอยางเต็มตัวแลว มันจะเปนที่อิจฉาของทั้งแอฟริกาอยางแนนอน"
 
 CONGO_congo_investments: "การลงทุนในคองโก"
 CONGO_congo_investments_desc: "รัฐบาลกลางเบลเยียมตระหนักดีถึงความมั่งคั่งของคองโก ดังนั้นเราจึงสามารถใชความมั่งคั่งนั้นเพื่อฟนฟูเศรษฐกิจเบลเยียมตอไป สิ่งที่ตองมีคือการลงทุนเริ่มแรกเพียงเล็กนอย"
 
 CONGO_societe_generale_de_belgique: "Societe Generale de Belgique"
 CONGO_societe_generale_de_belgique_desc: "บริษัทยักษใหญที่อยูใจกลางเศรษฐกิจเบลเยียมสวนใหญ หากเราตองการพลังดานการจัดการและการเงินที่จําเปนตอการพัฒนาทั้งประเทศ ก็ไมมีใครดีไปกวานี้ที่จะชวยเสริมผลประโยชนของเราในคองโก"
 
 CONGO_ccci: "CCCI"
 CONGO_ccci_desc: "Compagnie du Congo pour le Commerce et l'Industrie เปนกลุมบริษัทเหมืองแรรายใหญที่ดําเนินกิจการในคองโก แมพวกเขาจะควบคุมผลประโยชนดานแรจํานวนมาก แตสิ่งที่เราตองการชวยพัฒนาเปนหลักคือทรัพยากรดานโลหะวิทยาของพวกเขา"
 
 CONGO_forminiere: "Forminière"
 CONGO_forminiere_desc: "Société internationale forestière et minière du Congo เปนองคกรที่สนใจดานปาไมและการสกัดแรในคองโกเปนหลัก แมประสบการณดานปาไมของพวกเขาจะมีคา แตไมมีอะไรเทียบไดกับผลกําไรมหาศาลจากการผูกขาดเพชรในกาไซ เราตองเสริมและขยายสิ่งนี้!"
 
 CONGO_ruanda_urundi: "รวันดา-อุรุนดี"
 CONGO_ruanda_urundi_desc: "เดิมเปนสวนหนึ่งของแอฟริกาตะวันออกของเยอรมนี สันนิบาตชาติไดมอบให[BEL.GetName]ดูแลในฐานะดินแดนในภาวะทรัสตีหลังมหาสงคราม ภูมิภาคนี้เขาถึงทรัพยากรที่มีคาบางอยาง เชน ฝาย กาแฟ และทังสเตน"
 COG_approached_ruanda_urundi_governor_flag: "ไดติดตอผูวาการรวันดา-อุรุนดีแลว"
 
 CONGO_jungle_industry: "อุตสาหกรรมในปาดิบ"
 CONGO_jungle_industry_desc: "นักลงทุนมักงุนงงกับคุณคาของปาดิบอันกวางใหญ แตเพียงแคตองรูวาจะมองหาที่ไหน เราตองหาผูเชี่ยวชาญนั้นและมอบเครื่องมือใหพวกเขาไขความมั่งคั่งที่ซอนอยู"
 CONGO_jungle_industry_available_tt: "ควบคุม§Yรัฐปาดิบ§!ใดก็ไดใน§Yลุมนํ้าคองโกใหญ§!"
 
 CONGO_belgian_devaluation: "การลดคาเงินของเบลเยียม"
 CONGO_belgian_devaluation_desc: "รัฐบาล[BEL.GetAdjective]ไดดําเนินนโยบายลดคาเงิน ซึ่งทําใหขาหลวงใหญสามารถลดภาษีนําเขาและเพิ่มภาษีสงออกได สิ่งนี้นาจะชวยปรับปรุงงบประมาณของอาณานิคมไดอยางมาก"
 
 CONGO_french_congo: "คองโกของฝรั่งเศส"
 CONGO_french_congo_desc: "ฝรั่งเศสไดแบงเอาสวนหนึ่งของลุมนํ้าคองโกไป และแยกประชาชนของเราออกจากเรา ตอนนี้เปนโอกาสเหมาะที่จะแกไขความอยุติธรรมทางประวัติศาสตรนี้ ตองมีเพียงหนึ่งเดียว!"
 
 CONGO_force_publique: "ฟอรซปูบลิก"
 CONGO_force_publique_desc: "เดิมทีตั้งใจใหเปนกองกําลังตํารวจอาณานิคม แตถูกเปลี่ยนเปนกองกําลังทหารในชวงมหาสงคราม และตอสูกับแอฟริกาของเยอรมนีจนไดรับการยกยองอยางมาก มาเสริมกําลังตอไป และยกระดับกองกําลังอาณานิคมนี้สูมาตรฐานที่ทันสมัยยิ่งขึ้นกันเถอะ"
 COG_force_publique_reformed_flag: " Force Publique ไดรับการปฏิรูปเปน Armée Nationale Congolaise แลว"
 COG_comitted_to_our_overlords_war_flag: "เราเลือกที่จะทุมเทเต็มกําลังใหกับสงครามของเจาเหนือหัว"
 
 CONGO_symbiotic_industrialization: "อุตสาหกรรมพึ่งพาซึ่งกันและกัน"
 CONGO_symbiotic_industrialization_desc: "สิ่งหนึ่งหลอเลี้ยงอีกสิ่งหนึ่ง ยิ่งเราพัฒนาอุตสาหกรรมของเบลเยียม ความตองการทรัพยากรก็ยิ่งสูงขึ้น ทรัพยากรเหลานี้เรานําเขาไดจากคองโก เพื่อขับเคลื่อนการพัฒนาอุตสาหกรรมใหรวดเร็วยิ่งขึ้น และนั่นก็ทําใหตองการทรัพยากรมากขึ้นไปอีก ความรุงเรืองของทั้งสองดินแดนผูกพันกันอยางแนบแนน"
 
 CONGO_prince_leopold_mine: "เหมืองเจาชายเลโอโปลด"
 CONGO_prince_leopold_mine_desc: "ภูมิภาคคีปูชีทําเหมืองทองแดงมาหลายศตวรรษ และแมเราจะดําเนินงานที่นี่มาระยะหนึ่งแลว แตคาดวามูลคาของทองแดงจะพุงสูงขึ้นตามความตึงเครียดของโลก เราควรเตรียมพรอมรับความตองการนั้นเมื่อมันมาถึง"
 
 CONGO_bakwanga_mine: "เหมืองบักวังกา"
 CONGO_bakwanga_mine_desc: "มีการคนพบวาภูมิภาคบักวังกาอุดมไปดวยเพชรเปนพิเศษ แมจะไมใชอัญมณีเม็ดใหญอยางที่พบในแอฟริกาใตและอินเดีย แตนี่คือแหลงสะสมแรที่แข็งที่สุดในโลกขนาดใหญเปนพิเศษ และสามารถนํามาใชในงานอุตสาหกรรมไดหลากหลาย"
 
 CONGO_expand_tungsten_mines: "ขยายเหมืองทังสเตน"
 CONGO_expand_tungsten_mines_desc: "ดวยความสนใจในกระสุนแกนทังสเตนที่เพิ่มขึ้น เราจําเปนตองมีแหลงโลหะสําคัญชนิดนี้เปนของตนเอง โชคดีที่พบแหลงแรในดินแดนในอาณัติของเราที่รวันดา-อูรุนดี"
 
 CONGO_rubber_plantations: "สวนยางพารา"
 CONGO_rubber_plantations_desc: "เบลเยียมมีประวัติอันเลวรายเปนพิเศษในเรื่องการเก็บเกี่ยวยางในคองโก ถึงกระนั้นเราก็ยังตองพัฒนาการผลิตวัตถุดิบนี้ โดยตระหนักดีวาประชาคมระหวางประเทศกําลังจับตามองเราอยู"
 
 CONGO_interfaith_school_subsidies: "เงินอุดหนุนโรงเรียนตางศาสนา"
 CONGO_interfaith_school_subsidies_desc: "ทั่วประเทศมีโรงเรียนของมิชชันนารีคาทอลิกอยูจํานวนหนึ่งแลว แตหากเราตองการยกระดับการศึกษาของประชากรดวยตนทุนตํ่าอยางแทจริง เราตองสนับสนุนใหองคกรอื่น ๆ เขามาในดินแดนของเรามากขึ้น"
 
 CONGO_colonial_ambitions: "ความทะเยอทะยานดานอาณานิคม"
 CONGO_colonial_ambitions_desc: "คองโกเปนดินแดนที่นาประทับใจ แตทวีปนี้กวางใหญนัก เราควรแสดงใหชาติเจาอาณานิคมอื่น ๆ เห็นวาการแยงชิงแอฟริกายังไมจบลงอยางแทจริง"
 
 CONGO_congo_army: "กองทัพแหงคองโก"
 CONGO_congo_army_desc: "เห็นไดชัดขึ้นเรื่อย ๆ วามีมหาอํานาจตางชาติที่หมายตาจะยึดคองโก เราจึงควรลงทุนดานการทหารใหมากขึ้น เพื่อใหคองโกปองกันตนเองไดอยางมีประสิทธิภาพ และอาจชวย [BEL.GetName] แผอิทธิพลไปยังตางแดนไดดวย"
 
 CONGO_modernize_force_publique: "ปรับปรุง Force Publique ใหทันสมัย"
 CONGO_modernize_force_publique_desc: "แม Force Publique จะปฏิบัติหนาที่ไดอยางนาชื่นชม แตก็ไมใชความลับวาตองปรับปรุงใหทันสมัยอยางเรงดวน นี่ดูจะเปนชวงเวลาที่เหมาะที่สุดในการกันงบลงทุนไวเพื่อการนี้"
 
 CONGO_cheap_labor: "แรงงานราคาถูก"
 CONGO_cheap_labor_desc: "มีเทคนิคการควบคุมแรงงานหลายวิธีที่ใชรีดประสิทธิภาพจากแรงงานไดสูงสุด เชน ทําใหมีการคุมครองแรงงานนอยที่สุดเทาที่ทําได เพื่อใหความเสี่ยงที่จะถูกไลออกคํ้าคออยูตลอดเวลา และทําใหพวกเขายังตองพึ่งพาบริษัทในการยังชีพ"
 
 CONGO_societe_miniere_de_bakwanga: "Societé Minière de Bécéka"
 CONGO_societe_miniere_de_bakwanga_desc: "แมตลาดอัญมณีเพชรจะทํากําไรไดมหาศาล แตในยุคแหงการพัฒนาอุตสาหกรรมครั้งใหญนี้ ยังมีการใชประโยชนใหม ๆ จากวัสดุแข็งชนิดนี้อีกมาก เชน ใบเลื่อยและหัวสวาน"
 
 CONGO_kasai_secessionist_state: "รัฐแบงแยกดินแดนกาไซ"
 CONGO_kasai_secessionist_state_desc: "ภูมิภาคกาไซอยูภายใตการควบคุมของกองกําลัง[BEL.GetAdjective]อยางหลวม ๆ มาโดยตลอด หากมีเสนสายที่เหมาะสม เราจะสามารถสรางฐานที่มั่นไวได หากคองโกมุงไปสูเอกราช"
 
 CONGO_regional_specialization: "ความชํานาญเฉพาะภูมิภาค"
 CONGO_regional_specialization_desc: "คองโกเปนชาติขนาดใหญที่มีภูมิศาสตรหลากหลาย ครอบคลุมระบบนิเวศหลายแบบ เราควรจัดสรรทรัพยากร ความเชี่ยวชาญ และเครื่องมือใหถูกสงไปยังพื้นที่ที่ใชประโยชนไดดีที่สุด"
 
 CONGO_expanded_rubber_plantations: "ขยายสวนยางพารา"
 CONGO_expanded_rubber_plantations_desc: "ความตองการยางสูงมากจนการขยายสวนยางอยางมีนัยสําคัญกลายเปนเรื่องคุมคาทางการเงินแลว เราสามารถสรางฟารมเฉพาะทางและนําเขาเครื่องจักรสมัยใหมเพื่อเรงการผลิตอยางจริงจัง"
 
 CONGO_separate_corporations_from_politics: "แยกบรรษัทออกจากการเมือง"
 CONGO_separate_corporations_from_politics_desc: "ยอนไปตั้งแตสมัยรัฐเสรีคองโก คองโกตกอยูในกํามือของบรรษัทใหญมาตลอด ผลก็คือผลประโยชนของบรรษัทไดแทรกซึมเขาสูระดับการเมือง เราตองดําเนินการเพื่อแยกกลุมเหลานี้ออกจากอํานาจ"
 
 CONGO_belgian_officer_corps: "คณะนายทหารเบลเยียม"
 CONGO_belgian_officer_corps_desc: "ปจจุบัน Force Publique นําโดยคณะนายทหารชาวเบลเยียม แตเมื่อกองกําลังขยายขนาดขึ้น คณะนายทหารกลับไมไดเพิ่มตามไปดวย เราควรขอบุคลากร[BEL.GetAdjective]เพิ่มเติมเพื่อใหทหารใหมทั้งหมดไดรับการบังคับบัญชาอยางเหมาะสม"
 
 CONGO_appoint_van_overstraeten: "แตงตั้งฟน โอเฟอรสตราเทิน"
 CONGO_appoint_van_overstraeten_desc: "ราอูล ฟน โอเฟอรสตราเทิน นาจะเปนหนึ่งในบุคคลที่มีความสามารถที่สุดในกองทัพ[BEL.GetAdjective] ปญหาคือตัวเขาเองก็รูดี บุคลิกของเขาทําใหไมเปนที่ชื่นชอบในประเทศแม แตเขาเคยรับราชการในคองโกชวงมหาสงคราม เราสามารถอาศัยความหลังนั้นดึงนายทหารผูมากความสามารถผูนี้กลับมาได"
 
 CONGO_fuel_for_belgium: "เชื้อเพลิงเพื่อเบลเยียม"
 CONGO_fuel_for_belgium_desc: "ความพยายามขยายการขุดทรัพยากรในคองโกประสบความสําเร็จอยางมาก จนบริษัท[BEL.GetAdjective]ใชวัตถุดิบราคาถูกเหลานี้ปอนโรงงานของตนในเบลเยียมอยางไมอายใคร... และทํากําไรไดมหาศาลไปพรอมกัน"
 
 CONGO_antwerp_diamond_district: "ยานเพชรแอนตเวิรป"
 CONGO_antwerp_diamond_district_desc: "ผลพลอยไดอันนายินดีจากการเปนหนึ่งในผูผลิตเพชรชั้นนํา คือการที่แอนตเวิรปกลายเปนศูนยกลางหลักในการกระจายและซื้อขายแรชนิดนี้ ซึ่งก็สรางรายไดที่จับตองไดอยางชัดเจนใหแกเรา"
 
 CONGO_shinkolobwe_mine: "เหมืองชินโคโลบเว"
 CONGO_shinkolobwe_mine_desc: "เหมืองชินโคโลบเวเปนหนึ่งในแหลงยูเรเนียมเกรดสูงเพียงไมกี่แหงในโลกที่เปนที่รูจัก นาเสียดายที่ชั้นลางของเหมืองถูกนํ้าทวมหนักจนตองปดตัวลง การเปดเหมืองใหมและกลับมาผลิตอีกครั้งตองใชทั้งเงินลงทุนและความพยายามอยางมาก"
 
 CONGO_chefs_coutumiers: "Chefs Coutumiers"
 CONGO_chefs_coutumiers_desc: "Chefs Coutumiers คือชนชั้นหัวหนาเผาที่ฝายบริหาร[BEL.GetAdjective]มอบหมายใหดูแลการปกครองทองถิ่น ดวยการลงทุนในภูมิภาคที่เพิ่มขึ้นในระยะหลัง เราตองดูแลใหพันธมิตรชนเผาของเราไดรับแรงจูงใจและการสนับสนุนที่เหมาะสมเพื่อทําหนาที่สําคัญนี้ตอไป"
 COG_evolue_in_politics: "§YÉvolué§! ไดกาวเขาสูการเมือง§Y[COG.GetAdjective]§!แลว"
 CONGO_chefs_coutumiers_tt: "ชนชั้นกลาง§YÉvolué§!จะเริ่มกอตัวขึ้น"
 
 CONGO_humanitarian_aid: "ความชวยเหลือดานมนุษยธรรม"
 CONGO_humanitarian_aid_desc: "หลายพื้นที่ในคองโกตกอยูในความยากจนและอดอยาก เรามีเสนสายกับองคกรมนุษยธรรมอยูหลายแหง จึงควรเปดทางใหพวกเขาเขามาชวยบรรเทาความทุกขยากบางสวน"
 
 CONGO_purchasing_commission: "คณะกรรมการจัดซื้อ"
 CONGO_purchasing_commission_desc: "เมื่อคองโกพึ่งพายุทโธปกรณและเครื่องจักรสมัยใหมมากขึ้นเรื่อย ๆ ก็ชัดเจนวาเราตองตั้งหนวยงานขึ้นมาดูแลการนําเขาสินคาเหลานี้"
 
 CONGO_expand_force_publique_recruitment: "ขยายการรับสมัคร Force Publique"
 CONGO_expand_force_publique_recruitment_desc: "ภาระของ Force Publique เพิ่มขึ้นไมหยุด ความตองการทหารใหมจึงสูงขึ้นตามไปดวย เราควรเพิ่มแรงจูงใจเพื่อดึงคนในทองถิ่นใหมาสมัครมากขึ้น"
 
 CONGO_jungle_fighting: "การรบในปา"
 CONGO_jungle_fighting_desc: "พื้นที่กวางใหญของคองโกปกคลุมดวยปาทึบที่ดูเหมือนไมอาจฝาเขาไปได แตก็ยังมีผูคนที่อาศัยอยูและเจริญรุงเรืองในปาเหลานั้น เราควรรับคนเหลานี้มาเปนผูนําทางและครูฝก เพื่อเตรียมกองทัพใหพรอมสําหรับการรบในภูมิประเทศเชนนี้"
 CONGO_jungle_figthing_random_generals_tt: "ผูนํากองทัพ§Yสอง§!คนที่ถูกสุมเลือกจะไดรับ§Yหนูปา§!"
 
 CONGO_requisition_funds: "เกณฑเงินทุน"
 CONGO_requisition_funds_desc: "แมอาจไมใชการกระทําที่ไดรับความนิยมนัก แตคองโกยังมีความมั่งคั่งที่ยังไมถูกนํามาใช สําหรับผูที่รูวิธีดึงมันออกมา"
 
 CONGO_gold_and_diamonds: "ทองคําและเพชร"
 CONGO_gold_and_diamonds_desc: "เราอยูในฐานะที่คอนขางโชคดีที่ควบคุมแหลงทองคําและเพชรจํานวนมาก เราควรใชทรัพยากรเหลานี้ซื้อเสบียง ความเชี่ยวชาญ และเครื่องมือ ไปยังที่ที่ตองการมากที่สุด"
 
 CONGO_uranium_development_trust: "กองทุนพัฒนายูเรเนียม"
 CONGO_uranium_development_trust_desc: "เมื่อยูเรเนียมมีความสําคัญมากขึ้นตอหลายฝายที่สนใจ เราควรรวมมือกับหุนสวนระหวางประเทศและสนับสนุนการกอตั้งกองทุนพัฒนายูเรเนียม ซึ่งจะเปนองคกรที่รับผิดชอบการใชประโยชนและจัดสรรทรัพยากรนี้อยางเหมาะสม"
 
 CONGO_smuggle_uranium: "ลักลอบขายยูเรเนียม"
 CONGO_smuggle_uranium_desc: "เรามีของมีคาที่หลายคนตองการอยางยิ่ง แตเราไมสามารถเสนอขายอยางเปดเผยไดเสมอไป เราควรติดตอเสนสายลับหลังฉาก แลวดูวาจะตกลงขอเสนออะไรในเงามืดไดบาง"
 
 CONGO_develop_infrastructure: "พัฒนาโครงสรางพื้นฐาน"
 CONGO_develop_infrastructure_desc: "เราเผชิญความจริงมานานวาคองโกนั้นใหญเกินไปและทุรกันดารเกินกวาจะมีโครงสรางพื้นฐานที่เชื่อมตอไดดี แตนั่นไมไดหมายความวาเราไมควรพยายาม"
 
 CONGO_new_vegetable_produce_markets: "ตลาดผลผลิตผักแหงใหม"
 CONGO_new_vegetable_produce_markets_desc: "แมเศรษฐกิจคองโกจะเนนการขุดแรและพืชเศรษฐกิจเปนหลัก แตเราก็ยังมีภาคเกษตรที่แข็งแรงและสมบูรณ เมื่อการขาดแคลนอาหารทั่วโลกรุนแรงขึ้นเรื่อย ๆ ความตองการอาหารพื้นฐานจึงสูงอยางไมเคยมีมากอน"
 
 CONGO_congolese_generals: "นายพลชาวคองโก"
 CONGO_congolese_generals_desc: "Force Publique เติบโตจนเราไมอาจพึ่งพาผูนําที่นําเขาจากเจาอาณานิคมไดอีกตอไป ชาวแอฟริกันมีความสามารถเกินพอที่จะนําทัพเอง เราจึงควรยกเลิกนโยบายกีดกันที่จํากัดพวกเขา และเปดใหคนทองถิ่นที่มีพรสวรรคโดดเดนเขาสูคณะนายทหาร"
 
 CONGO_even_a_hospital_can_do_better: "ขนาดโรงพยาบาลยังทําไดดีกวา"
 CONGO_even_a_hospital_can_do_better_desc: "หนวยทหารคองโกขนาดเล็กหลายหนวยไดไปรบในสมรภูมิตาง ๆ ทั่วโลก โดยเฉพาะผลงานของหนวยแพทยทหารไดกลายเปนตํานาน แมแตในแนวหนาที่ตองเผชิญศัตรูที่เหนือกวาอยางทวมทน จนมีผูไดยินผูบังคับบัญชาทองถิ่นคนหนึ่งตวาดใสลูกนองวา "ขนาดโรงพยาบาลยังทําไดดีกวา!""
 
 CONGO_expand_metallurgical_industry: "ขยายอุตสาหกรรมโลหการ"
 CONGO_expand_metallurgical_industry_desc: "เบลเยียมเปนที่รูจักมานานในดานอุตสาหกรรมโลหการชั้นเยี่ยม แตก็ไมไดมีวัตถุดิบเพียงพอที่จะเติบโตไดเต็มที่เสมอไป บัดนี้ดวยทรัพยากรที่นําเขาจากคองโก พวกเขาจึงมีหนทางสูความรุงเรือง"
 
 CONGO_smuggle_diamonds: "ลักลอบขายเพชร"
 CONGO_smuggle_diamonds_desc: "เพชรเปนสกุลเงินที่มีคาและแทบติดตามไมได จึงเปนที่ตองการอยางยิ่งในบางแวดวง เราควรปลอยเพชรของเราเขาสูตลาดใตดินนี้บาง แลวเก็บเกี่ยวผลประโยชน"
 CONGO_smuggle_diamonds_tt: "ปลดล็อกการตัดสินใจเพื่อลด§Yอํานาจปกครองตนเอง§!ของเราแลกกับ§Yอํานาจทางการเมือง§!"
 
 CONGO_office_des_transports_coloniaux: "สํานักงานขนสงอาณานิคม (Office des Transports Coloniaux)"
 CONGO_office_des_transports_coloniaux_desc: "หนวยงานที่รับผิดชอบการขนสงและการสงกําลังบํารุงในอาณานิคมแบกรับภาระจนแทบลมมานานแลว ติดอยูระหวางระยะทางอันไกลโพนกับภูมิประเทศอันเลวรายที่ตองรับมือ ใหเราโยกงบประมาณที่จําเปนไปใหพวกเขา และทําใหคองโกเชื่อมถึงกันมากขึ้น"
 
 CONGO_improved_employment_contracts: "ปรับปรุงสัญญาจางงาน"
 CONGO_improved_employment_contracts_desc: "ความตองการวัตถุดิบสูงถึงขั้นที่เราไมอาจควบคุมตลาดแรงงานแบบที่เคยทําไดอีกตอไป คนงานเหมืองกลายเปนสินทรัพยมีคา และพวกเขาก็รูตัวดี เพื่อรักษาผลิตภาพของพวกเขาไว เราตองเสนอเงื่อนไขการจางงานที่ดีขึ้น"
 
 CONGO_compagnie_belge_maritime_du_congo: "Compagnie Belge Maritime du Congo"
 CONGO_compagnie_belge_maritime_du_congo_desc: "Compagnie Belge Maritime du Congo คือบริษัทที่รับผิดชอบการขนสงวัตถุดิบระหวางคองโกกับ[BEL.GetNameDef] เราควรใหเงินอุดหนุนแกพวกเขา เพื่อใหเสนทางการคาอันเปนเสนเลือดใหญของเรายังคงเปดอยู"
 
 CONGO_heat_resistant_cobalt: "โคบอลตทนความรอน"
 CONGO_heat_resistant_cobalt_desc: "เราขุดโคบอลตในคองโกมานานแลว แตแรที่พบที่นี่มีคุณภาพสูงเปนพิเศษและมีคุณสมบัติทนความรอน ซึ่งสําคัญยิ่งตอการพัฒนาเครื่องยนตไอพนรุนใหม"
 
 CONGO_copper_cartridges: "ปลอกกระสุนทองแดง"
 CONGO_copper_cartridges_desc: "ปลอกกระสุน สงครามสมัยใหมไมมีทางสูรบไดหากขาดมัน และบังเอิญวาทองแดงคือวัสดุที่ดีที่สุดในการผลิต ทองแดงทนการกัดกรอนและออนพอจะขึ้นรูปไดงาย ชางโชคดีเหลือเกินที่เรานั่งอยูบนภูเขาทองแดงดี ๆ นี่เอง!"
 
 CONGO_research_grants: "ทุนวิจัย"
 CONGO_research_grants_desc: "ทรัพยากรไมใชสิ่งเดียวที่คองโกอุดมสมบูรณ แตยังรวมถึงมันสมองดวย ทรัพยากรอันลํ้าคาที่สุดนี้ยังไมถูกนํามาใชอยางเหมาะสม เราควรมอบทุนวิจัยเพื่อสงเสริมการพัฒนาอุตสาหกรรมทางปญญา"
 
 CONGO_congos_place_in_the_world: "ที่ยืนของคองโกในโลก"
 CONGO_congos_place_in_the_world_desc: "เสนทางที่ผานมาเต็มไปดวยความผันผวนพลิกผัน แตถึงเวลาแลวที่คองโกจะยืนหยัดบนเวทีโลก อดีตจะสงผลตออนาคตของเรามากเพียงใด? บัดนี้คือเวลาตัดสินใจ"
 
 CONGO_legacy_of_lake_tanganyika: "มรดกแหงทะเลสาบแทนกันยีกา"
 CONGO_legacy_of_lake_tanganyika_desc: "หนึ่งในวีรกรรมอันนาทึ่งที่สุดของ Force Publique เกิดขึ้นในชวงมหาสงคราม เมื่อเรือหลายลําถูกถอดชิ้นสวน ขนผานปาดงดิบ แลวนําไปประกอบใชงานอีกครั้งในทะเลสาบใจกลางแอฟริกา กอนจะเอาชนะเรือเยอรมันที่ประจําการอยูที่นั่น"
 
 CONGO_soviet_interest: "ความสนใจของโซเวียต"
 CONGO_soviet_interest_desc: "มีมหาอํานาจหลายชาติที่แขงกันแผอิทธิพลในคองโก และไมมีใครกระตือรือรนไปกวา[SOV.GetNameDef] อยางนอยเราก็ควรฟงวาพวกเขามีอะไรจะเสนอ!"
 
 CONGO_whispers_of_independence: "เสียงกระซิบแหงเอกราช"
 CONGO_whispers_of_independence_desc: "เราไดยินมาระยะหนึ่งแลว เสียงพึมพําของผูไมพอใจที่แพรสะพัด กลิ่นอายของการกบฏที่ลอยอยูในอากาศ ความตื่นเตนเบา ๆ ตออนาคตที่แตกตาง เราควรเงี่ยหูฟง และดูวากระแสความไมพอใจที่ซอนอยูนี้จะนําเราไปสูที่ใด"
 
 CONGO_congo_free_state: "รัฐเสรีคองโก"
 CONGO_congo_free_state_desc: "ฝายบริหารอาณานิคมสกัดกั้นทุกความฝนถึงอิสรภาพไดอยางมีประสิทธิภาพ จนอนาคตของคองโกแทบถูกกําหนดไวแลว อนาคตที่ถูกบดขยี้อีกครั้งใตอุงมือแหงการปกครองเบ็ดเสร็จจากบรัสเซลส"
 
 CONGO_overseas_department_of_belgium: "จังหวัดโพนทะเลของเบลเยียม"
 CONGO_overseas_department_of_belgium_desc: "การทดลองอาณานิคมตนแบบเติบโตไดดีเกินกวาที่คาดหวังไว คองโกไดกลายเปนแบบอยางแหงประสิทธิภาพและความกาวหนา จนสมควรไดรับสถานะที่เปนทางการยิ่งขึ้น"
 
 CONGO_dominion_of_congo: "ดินแดนปกครองตนเองคองโก"
 CONGO_dominion_of_congo_desc: "เราดํารงฐานะอาณานิคมตนแบบมาไดอยางดี และชาติก็เติบโตขึ้นผานความยากลําบากที่คองโกและ[BEL.GetName]ฝาฟนมาดวยกัน ดวยเหตุนี้ เราจึงไดรับความเทาเทียมในระดับหนึ่งแลว"
 
 CONGO_republic_of_congo: "สาธารณรัฐคองโก"
 CONGO_republic_of_congo_desc: "บรรยากาศอันเปยมดวยอิสรภาพแผซานไปทั่วสาธารณรัฐใหม ไมวาอนาคตจะเคียงขางเบลเยียม หรือยืนตรงขามกับอดีตเจาอาณานิคม มีเพียงสิ่งเดียวที่แนนอน อนาคตนี้เปนของคองโกที่จะตัดสินใจเพียงผูเดียว"
 
 CONGO_african_union: "สหภาพแอฟริกา"
 CONGO_african_union_desc: "แนวคิดลัทธิรวมแอฟริกาแผขยายไปทั่วทวีป และชาวแอฟริกันที่เปนอิสระจํานวนมากปรารถนาจะยืนหยัดรวมกันเพื่อเปาหมายเดียวกัน เราควรสงเสริมสิ่งนี้ และกอตั้งองคกรที่จะดึงชาติตาง ๆ ของเราใหใกลชิดกันยิ่งขึ้น"
 
 CONGO_great_war_of_africa: "มหาสงครามแหงแอฟริกา"
 CONGO_great_war_of_africa_desc: "ถึงเวลาแลวที่ประชาชนทั้งปวงแหงลุมนํ้าคองโกใหญจะรวมกันภายใตธงผืนเดียว เราตองลบลางพรมแดนตามอําเภอใจที่มหาอํานาจยุโรปขีดไว และยึดคืนสิ่งที่เปนของเรา"

 CONGO_aviation_militaire_de_la_force_publique: "กองบินแหง Force Publique (Aviation Militaire)"
 CONGO_aviation_militaire_de_la_force_publique_desc: "ไมใชความลับวาขนาดอันมหึมาของคองโกทําใหการทหารและการรักษาความสงบในดินแดนเปนความทาทายอยางยิ่ง แตมียานพาหนะรูปแบบหนึ่งที่เอาชนะระยะทางไดอยางงายดาย นั่นคือเครื่องบิน เราควรลงทุนในดานนี้ และรักษาการควบคุมนานฟาไวใหได"

 CONGO_expand_matadi_seaport: "ขยายทาเรือมาตาดี"
 CONGO_expand_matadi_seaport_desc: "มาตาดีเปนทาเรือหลักที่ใหบริการเลโอโปลดวิล และเปนประตูสูภายในทวีปผานแมนํ้าหลายสาย เราควรขยายสิ่งอํานวยความสะดวกทางทะเลที่นี่ใหสอดคลองกับความสําคัญที่เพิ่มขึ้น"

 CONGO_expand_ndolo_and_elisabethville_airports: "ขยายทาอากาศยานเอ็นโดโลและเอลีซาเบ็ทวิล"
 CONGO_expand_ndolo_and_elisabethville_airports_desc: "ขอดีประการหนึ่งของการที่คองโกเปนหัวใจของแอฟริกา คือศักยภาพที่จะกลายเปนศูนยกลางการขนสงทางอากาศสําคัญสําหรับผูที่ตองการขามผืนแผนดินอันกวางใหญของแอฟริกา"

 CONGO_establish_cometro: "กอตั้ง Cométro"
 CONGO_establish_cometro_desc: "Force Publique มีบทบาทสําคัญในการปกปองผลประโยชน[BEL.GetAdjective]ในคองโก แตก็ไมใชกองกําลังทหารอาชีพที่ไดมาตรฐานเขมงวดเชนกองทัพยุโรป ถึงเวลาที่กองทัพตัวจริงจะเขามาแลว"

 COG_congolese_bussinessowners: "เจาของกิจการชาวคองโก"
 COG_congolese_bussinessowners_desc: "เพื่อใหสังคมของเราฟนตัวจากการกดขี่เชิงสถาบันมานานหลายป และกาวไปสูสังคมที่เปนธรรมยิ่งขึ้น เราตองเริ่มสงเสริมใหพลเมืองคองโกเริ่มตนธุรกิจของตนเอง โดยหวังวาพวกเขาจะตั้งตัวในตลาดได"

 COG_desgregate_the_universites: "ยกเลิกการแบงแยกในมหาวิทยาลัย"
 COG_desgregate_the_universites_desc: "ชาติของเรามีคนหัวดีมากมายที่ถูกกดทับและเหยียบยํ่าดวยนโยบายของมหาวิทยาลัยที่ไมยอมใหคนบางกลุมกาวขามการศึกษาระดับหนึ่งไปได เราตองยุติสิ่งนี้ทันที เพราะมีคนมากมายที่อยากชวยชาติแตทําไมได"

 COG_shatter_the_roof: "ทลายเพดาน"
 COG_shatter_the_roof_desc: "ในที่สุดก็ถึงเวลาทลายเพดานลองหนที่กดทับอยูเหนือศีรษะของประชาชนเรามากมายมาตลอด และใหพวกเขาไดสัมผัสอิสรภาพในการเลือกวิถีชีวิตของตนเองเสียที!"

 COG_establish_the_anc: "กอตั้งกองทัพแหงชาติคองโก (Armée Nationale Congolaise)"
 COG_establish_the_anc_desc: "เราเรียกรองมามากมาย แตเพิ่งจะมาถึงวันนี้ที่ขอเรียกรองไดรับการตอบสนองในที่สุด วันนี้คือวันที่เราจะไดจัดตั้งกองทัพคองโกที่แทจริง กองทัพที่ยืนหยัดตอกรกับศัตรูใด ๆ ที่เราอาจพบในอนาคตไดอยางสงางาม"

 COG_marine_nationale: "กองทัพเรือแหงชาติ (Marine Nationale)"
 COG_marine_nationale_desc: "แมจะไมใชสิ่งที่เราเคยลงทุนอยางหนักมากอน แตกองทัพเรือก็เปนสิ่งจําเปนสําหรับชาติสมัยใหมสวนใหญ คําถามเดียวคือเราจะสรางกองเรือเพื่อออกสูมหาสมุทรแอตแลนติก หรือจะจัดโครงสรางใหปฏิบัติการในแมนํ้ามากมายของลุมนํ้าคองโกไดดีกวา"

 COG_expand_shipping_industry: "ขยายอุตสาหกรรมการเดินเรือ"
 COG_expand_shipping_industry_desc: "หลายพื้นที่ในประเทศของเราเขาถึงไดยากหากไมใชเสนทางอากาศหรือแมนํ้า อีกสิ่งสําคัญคือการเชื่อมตอกับตางประเทศขามทะเล ดังนั้นเราจึงตองขยายอุตสาหกรรมการเดินเรือเพื่อตอบสนองความตองการของชาติที่กําลังพัฒนาสูความทันสมัย"

 COG_south_atlantic_navy: "กองทัพเรือแอตแลนติกใต"
 COG_south_atlantic_navy_desc: "หากเราตองการรักษาเอกราชไวอยางมั่นคง เราตองทําใหแนใจวามหาอํานาจเจาอาณานิคมจะไมมีวันขึ้นฝงของเราไดอีก"

 COG_brown_water_navy: "กองทัพเรือลํานํ้า"
 COG_brown_water_navy_desc: "ทะเลไมใชเรื่องที่เรากังวลนัก แตแมนํ้าและทะเลสาบอันกวางใหญของเราตองไดรับการลาดตระเวนอยางเหมาะสม หากเราตองการรักษาความมั่นคงของชาติไว"

 COG_coastal_defence_fleet: "พัฒนากองเรือปองกันชายฝง"
 COG_coastal_defence_fleet_desc: "โบมาและมาตาดีตองไดรับการปกปองอยางเหมาะสม ซึ่งทําไดดวยการสรางเรือรบทรงพลังที่มีภารกิจหลักคือประจําการใกลชายฝงของเราเทานั้น"

 COG_supply_line_disruption_tactics: "ยุทธวิธีตัดเสนทางเสบียง"
 COG_supply_line_disruption_tactics_desc: "เสนทางเสบียงของศัตรูสามารถถูกตัดขาดไดดวยการโจมตีแมนยําเพียงครั้งเดียว ภารกิจนี้จะดําเนินการโดยเรือดํานํ้าของเรา และจะเปนสวนสําคัญในสงครามใด ๆ ที่เราจะเขารวมในอนาคต"

 COG_command_post_matadi: "กองบัญชาการมาตาดี"
 COG_command_post_matadi_desc: "เราตองตั้งกองบัญชาการที่มาตาดีเพื่อลาดตระเวนแมนํ้าทางตะวันตกไดดียิ่งขึ้น"

 COG_command_post_albertville: "กองบัญชาการอัลแบรวิล"
 COG_command_post_albertville_desc: "เราตองตั้งกองบัญชาการที่อัลแบรวิลเพื่อลาดตระเวนแมนํ้าทางตะวันออกเฉียงใตไดดียิ่งขึ้น"

 COG_command_post_goma: "กองบัญชาการโกมา"
 COG_command_post_goma_desc: "เราตองตั้งกองบัญชาการที่โกมาเพื่อลาดตระเวนแมนํ้าทางตะวันออกเฉียงเหนือไดดียิ่งขึ้น"

 COG_force_arienne_congolaise: "กองทัพอากาศคองโก (Force Aérienne Congolaise)"
 COG_force_arienne_congolaise_desc: "เพื่อใหตามทันศัตรู เราตองจัดระเบียบกองบินใหมและกอตั้งเหลาทัพอากาศที่แทจริงในกองทัพที่เพิ่งกอตั้งของเรา"

 COG_procure_foriegn_equipment: "จัดหายุทโธปกรณจากตางประเทศ"
 COG_procure_foriegn_equipment_desc: "เมื่อเราไมมีทั้งความรูทางเทคนิคและอุตสาหกรรมที่จะรองรับการพัฒนาและผลิตเครื่องบินเอง การหันไปยืมแบบและซื้อเครื่องบินจากพันธมิตรจึงเปนทางเลือกที่ชาญฉลาดกวา"

 COG_aeronautical_research_department: "ฝายวิจัยการบิน"
 COG_aeronautical_research_department_desc: "แมอาจไมใชสิ่งที่เราเคยลงทุนหนักมากอน แตตองไมลืมวาเราไมอาจพึ่งพาตางชาติมากเกินไป เราตองพยายามพัฒนาและผลิตเครื่องบินของเราเอง ไมวาจะตองแลกดวยตนทุนเทาใด"

 COG_scouting_the_terrain: "ลาดตระเวนภูมิประเทศ"
 COG_scouting_the_terrain_desc: "ปาดงดิบอันกวางใหญทําใหการเดินทางในดินแดนของเราเปนเรื่องยาก ยิ่งไปกวานั้น การมองเห็นศัตรูกอนที่พวกมันจะเขาใกลเมืองสําคัญก็ทําไดยาก กองทัพอากาศจึงตองมีบทบาทสําคัญในการลาดตระเวนทางอากาศ"

 COG_expand_production_facilities: "ขยายสถานที่ผลิต"
 COG_expand_production_facilities_desc: "เราตองเพิ่มการผลิตยุทโธปกรณทางทหาร และหนทางเดียวคือการสรางสถานที่ผลิตแหงใหมที่มีขีดความสามารถพอ"

 COG_forces_terrestres: "กองกําลังภาคพื้นดิน (Forces Terrestres)"
 COG_forces_terrestres_desc: "สวนที่สําคัญที่สุดของกองทัพใด ๆ คือกําลังรบภาคพื้นดิน และของเรายังขาดตกบกพรองอีกมาก เราตองลงทุนในสวนนี้เพื่อใหยืนหยัดตอกรกับศัตรูได"

 COG_from_a_gendarmerie_to_a_fighting_force: "จากตํารวจภูธรสูกองกําลังรบ"
 COG_from_a_gendarmerie_to_a_fighting_force_desc: "ถึงเวลานานแลวที่เราจะทิ้งรากเหงาของ Force Publique ไวเบื้องหลัง และปรับโครงสรางกองทัพใหไมเหมือนตํารวจภูธรอยางที่เคยเปน แตเปนกองกําลังรบที่แทจริง"

 COG_academie_militaire_de_kananga: "โรงเรียนนายรอยกานังกา (Académie Militaire de Kananga)"
 COG_academie_militaire_de_kananga_desc: "ไมใชแคพลทหารทั่วไปที่ตองไดรับการฝก แตรวมถึงนายทหารและนายพลดวย เราตองลงทุนใน Académie Militaire de Kananga เพื่อใหกองทัพไดรับการศึกษาที่ดีขึ้นสําหรับภารกิจที่รออยู"

 COG_standardize_military_production: "จัดมาตรฐานการผลิตทางทหาร"
 COG_standardize_military_production_desc: "ดวยยุทโธปกรณที่ปนเปกันทั้งของตางชาติและที่ผลิตเองในปจจุบัน อุตสาหกรรมของเราจึงไมอาจผลิตอะไหลทดแทนที่จําเปนไดเร็วพอ เราจึงตองทําใหยุทโธปกรณที่กองทัพใชเปนมาตรฐานเดียวกัน"

 COG_societe_africaine_dexplosifs_congo: "Société Africaine d'Explosifs Congo"
 COG_societe_africaine_dexplosifs_congo_desc: "อีกสิ่งที่จําเปนในการจัดหาอาวุธของเราเองคือรัฐวิสาหกิจที่ตั้งอยูในพรมแดนของเราซึ่งตอบสนองความตองการของเราได ดวยเหตุนี้เราควรกอตั้ง Société Africaine d'Explosifs Congo เพื่อผลิตกระสุนใหเราแตเพียงผูเดียว"

 COG_triga_i_project: "โครงการ TRIGA I"
 COG_triga_i_project_desc: "อนาคตของพลังงานอยูที่พลังงานนิวเคลียร นักวิทยาศาสตรของเราจึงทุมเททํางานสรางโรงไฟฟานิวเคลียรแหงแรกของแอฟริกา TRIGA I เมื่อสําเร็จแลว เรานาจะนําพลังงานของมันมาปรับใชทางการทหารไดหากเห็นวาจําเปน"

 COG_military_service_for_citizenship: "รับราชการทหารแลกสัญชาติ"
 COG_military_service_for_citizenship_desc: "มีคนจํานวนมากในชาติของเราที่ไมมีสัญชาติหรือหนังสือเดินทาง เราจึงควรทําอยางที่ชาวโรมันเคยทํา คือมอบสัญชาติใหแกผูที่รับใชในกองทัพครบระยะเวลาที่กําหนด ซึ่งหวังวาจะดึงดูดทหารใหมได"

 COG_guerilla_tactics_drills: "ฝกยุทธวิธีกองโจร"
 COG_guerilla_tactics_drills_desc: "ภูมิประเทศของเราเหมาะอยางยิ่งกับยุทธวิธีตีแลวหนี เราจึงควรฝกทหารใหใชเทคนิคเหลานี้ใหเกิดประโยชนสูงสุด และมั่นใจวาเราจะผลักดันผูรุกรานใด ๆ กลับไปได"

 COG_french_as_martial_language: "ภาษาฝรั่งเศสเปนภาษาทางทหาร"
 COG_french_as_martial_language_desc: "ตามธรรมเนียมแลว Force Publique ใชภาษาฝรั่งเศสเปนภาษาหลักในกองทัพ ซึ่งพิสูจนแลววาไดผลดี และไมมีเหตุผลที่เราจะเปลี่ยนในเร็ว ๆ นี้"

 COG_adopt_lingala_and_swahili_as_martial_languages: "ภาษาลิงกาลาและสวาฮีลีเปนภาษาทางทหาร"
 COG_adopt_lingala_and_swahili_as_martial_languages_desc: "แม Force Publique จะใชภาษาฝรั่งเศสเปนภาษาหลัก แตเพื่อตีตัวออกหางจากอดีตเจาเหนือหัว เราตองพยายามนําภาษาพื้นเมืองคองโกเขามาใชในกองทัพ หนวยหลักจะใชภาษาลิงกาลาและสวาฮีลี เนื่องจากเปนสองภาษาที่มีผูใชมากที่สุดในขณะนี้"

 COG_31e_brigade_parachutiste: "กองพลนอยพลรมที่ 31"
 COG_31e_brigade_parachutiste_desc: "เราควรพยายามจัดตั้งหนวยพลรมชั้นยอดที่สามารถยึดชุมชนและทําลายขาศึกภายในไดอยางรวดเร็ว และทําหนาที่เปนองครักษชั้นยอดของผูนําประเทศหากตกอยูในอันตราย"

 COG_peacekeeping_forces: "กองกําลังรักษาสันติภาพ"
 COG_peacekeeping_forces_desc: "แมขณะนี้คองโกอาจไมมีสงคราม แตสงครามยังคงลุกโชนอยูทั่วทุกมุมโลก เราตองตอสูเพื่ออนาคตที่ดีกวา แมจะหมายถึงการสงทหารไปรบเพื่อมหาอํานาจตางชาติในดินแดนอันไกลโพนก็ตาม"

 COG_governor_general_pierre_ryckmans: "ขาหลวงใหญปแยร ริคมันส"
 COG_governor_general_pierre_ryckmans_desc: "แมบรรดารัฐมนตรีใน[BEL.GetNameDef]จะมีแผนมากมายสําหรับรัฐของเรา แตพวกเขาไมใชกลุมเดียว ปแยร ริคมันสเองก็มีวิสัยทัศนอันยิ่งใหญของตน และการใชความรูดานการบริหารของเขาเพื่อพัฒนาสภาพของชาติก็นาจะเปนทางเลือกที่ชาญฉลาด"

 COG_invest_in_urban_centers: "ลงทุนในศูนยกลางเมือง"
 COG_invest_in_urban_centers_desc: "ชาติของเรากวางใหญ และประชาชนก็มีมาก แตเงินไมพอจะกระจายไปทั่ว หากเราจะลงทุนที่ใด ชนบทก็จะถูกละเลย อยางไรก็ตาม นั่นจะไมหยุดเราจากการลงทุนในสองเมืองใหญที่สุด คือเลโอโปลดวิลและเอลีซาเบ็ทวิล"

 COG_uplift_the_apostolic_vicar_of_leopoldville: "ยกฐานะผูแทนพระสันตะปาปาแหงเลโอโปลดวิล"
 COG_uplift_the_apostolic_vicar_of_leopoldville_desc: "เขตมิสซังของผูแทนพระสันตะปาปาแหงเบลเจียนคองโกกอตั้งโดยสมเด็จพระสันตะปาปาลีโอที่ 13 ในป 1888 และเปนสถาบันคาทอลิกหลักในรัฐของเรา โดยมีผูนําคือผูแทนพระสันตะปาปาแหงเลโอโปลดวิล โยริส ซิกส ซึ่งควรมีที่นั่งในรัฐบาลหากเราตองการไดรับการสนับสนุนจากศาสนจักร"

 COG_promote_marcel_maquet_to_provincial_commisioner: "เลื่อนตําแหนงมาเกตเปนขาหลวงมณฑล"
 COG_promote_marcel_maquet_to_provincial_commisioner_desc: "มารแซล มาเกตรับใชเราไดดีในฐานะผูบริหารอาณานิคมระดับตนและขาหลวงประจําเขต จึงเปนการดีที่จะขยายบทบาทของเขาใหครอบคลุมพื้นที่กวางขึ้น ดวยการเลื่อนเขาเปนขาหลวงมณฑล"

 COG_cooperate_with_the_comite_special_du_katanga: "คณะกรรมการพิเศษแหงกาตังกา"
 COG_cooperate_with_the_comite_special_du_katanga_desc: "โอกุสต ทิลเคนส อดีตขาหลวงใหญแหงเบลเจียนคองโก ปจจุบันเปนหัวหนา Comité Spécial du Katanga องคกรกึ่งรัฐที่กอตั้งขึ้นในป 1900 เพื่อบริหารและใชประโยชนจากทรัพยากรของมณฑลกาตังกา การใชองคกรนี้อยางเต็มศักยภาพจึงเปนทางเลือกที่ชาญฉลาด"

 COG_lecho_du_katanga: "หนังสือพิมพ L'Écho du Katanga"
 COG_lecho_du_katanga_desc: "เสียงสะทอนแหงกาตังกาเปนหนังสือพิมพที่ตีพิมพในเอลีซาเบ็ทวิล โดยมีฌ็อง เดอกอสแตร ผูกอตั้งสายสังคมอาณานิคม และอัลแบร เดอกอสแตร บรรณาธิการ ทั้งสองรวมกันสงเสริมการตั้งถิ่นฐานของชาวยุโรปในคองโก ซึ่งอาจเปนสิ่งที่ควรยึดไวเพื่อเรงพัฒนาชาติที่กําลังเติบโตของเรา"

 COG_strengthen_the_banque_du_congo_belge: "เสริมความแข็งแกรงให Banque du Congo Belge"
 COG_strengthen_the_banque_du_congo_belge_desc: "ไมมีประเทศใดดําเนินไปไดอยางมีประสิทธิภาพหากปราศจากธนาคารที่ดี และเราก็ไมตางกัน เพื่อใหกุมสถานการณการเงินในประเทศไดมั่นคงยิ่งขึ้น เราควรเสริมความแข็งแกรงให Banque du Congo Belge ธนาคารของรัฐเบลเยียม"

 COG_contract_the_empain_group: "ทําสัญญากับกลุมอ็องแปง"
 COG_contract_the_empain_group_desc: "กลุมอ็องแปงกอตั้งโดยเอดัวร อ็องแปง ในป 1881 และเปนหนึ่งในบรรษัทที่ใหญที่สุดในยุคของเรา รับผิดชอบงานรถราง ทางรถไฟ การผลิตไฟฟา การกอสราง และเหมืองแร เปนตน ดําเนินกิจการในเบลเยียม ฝรั่งเศส รัสเซีย อียิปต และจีน และมีบทบาทสําคัญในการพัฒนาภาคตะวันออกของเบลเจียนคองโกแลว เราตองการบริการของพวกเขาอยางยิ่ง!"

 COG_invest_in_geomines: "ลงทุนใน Géomines"
 COG_invest_in_geomines_desc: "Compagnie Géologique et Minière des Ingénieurs et Industriels Belges มีบทบาทสําคัญในการขุดและใชประโยชนจากแหลงแรโลหะขนาดมหึมาทางตะวันออกเฉียงใตของประเทศ และเปนหนึ่งในผูผลิตดีบุกรายใหญที่สุดของโลก หากเราลงทุนกับพวกเขาตอนนี้ พวกเขาจะชวยเศรษฐกิจของเราไดในระยะยาวอยางแนนอน"

 COG_attempt_to_centralize_the_state: "พยายามรวมศูนยอํานาจรัฐ"
 COG_attempt_to_centralize_the_state_desc: "ชาติอันกวางใหญของเราไมมีทางควบคุมไดจากศูนยกลางแหงเดียว อยางนอยก็จนกวาเราจะคิดคนเทคโนโลยีการสื่อสารและการขนสงที่ดีกวานี้ได ถึงกระนั้น เราก็ควรทําเทาที่ทําไดในตอนนี้เพื่อรวมศูนยอํานาจรัฐไวที่เมืองหลวงใหมากขึ้น"

 COG_allow_local_autonomy: "ใหอํานาจปกครองตนเองแกทองถิ่น"
 COG_allow_local_autonomy_desc: "เมื่อการรวมศูนยอํานาจอยางแทจริงแทบเปนไปไมได เราจึงควรมอบอํานาจปกครองตนเองใหแกภูมิภาคตาง ๆ แทน เพื่อรักษาการสนับสนุนจากประชาชนหลากหลายกลุมในชาติไว แมเราจะควบคุมพวกเขาไดไมมากนักก็ตาม"

 COG_closer_cooperation_with_eugene_jungers: "รวมมือใกลชิดกับเออแฌน ยุงเงอรส"
 COG_closer_cooperation_with_eugene_jungers_desc: "เออแฌน ยุงเงอรส คือขาหลวงคนปจจุบันของอาณานิคมรวันดา-อูรุนดี หากเราไดรับความโปรดปรานจากเขา เราอาจรวมงานกันใกลชิดขึ้น และในที่สุดก็นําทรัพยากรในอาณานิคมนั้นมาใชใหเปนประโยชนแกเรา"

 COG_found_the_congolese_national_movement: "กอตั้งขบวนการแหงชาติคองโก"
 COG_found_the_congolese_national_movement_desc: "เพื่อใหคองโกรวมมือกันไดแมจะมีความขัดแยงระหวางชาติพันธุและศาสนา เราตองสรางองคกรแนวรวมที่อุทิศตนเพื่อทําใหคองโกดีที่สุดเทาที่จะเปนได ดวยเหตุนี้ ปาทริส ลูมุมบา จึงเสนอใหกอตั้ง Mouvement national Congolais"

 COG_formally_recognize_the_kimbanguist_church: "รับรองโบสถคิมบังกูอยางเปนทางการ"
 COG_formally_recognize_the_kimbanguist_church_desc: "ซีมง คิมบังกู ผูประกาศตนเปนทูตพิเศษของพระเยซูคริสต เปนหนามยอกอกฝายบริหารของเรามาหลายป แตดวยแรงสนับสนุนจากประชาชนทองถิ่นที่ขบวนการของเขาไดรับ อาจถึงเวลาแลวที่จะรับรองโบสถของพระเยซูคริสตบนโลกโดยทูตพิเศษซีมง คิมบังกู ใหเปนกลุมศาสนาที่ถูกตองตามกฎหมายในชาติของเรา"

 COG_found_the_parti_solidaire_africain: "กอตั้งพรรคสามัคคีแอฟริกัน (Parti Solidaire Africain)"
 COG_found_the_parti_solidaire_africain_desc: "ขบวนการลัทธิรวมแอฟริกาเขมแข็งขึ้นทุกวัน และในฐานะหนึ่งในรัฐที่ใหญที่สุดของแอฟริกา เราจะปลอยใหตนเองตามหลังพัฒนาการเหลานี้ไมได เราจึงตองกอตั้งพรรคสามัคคีแอฟริกัน โดยมีเปาหมายสงเสริมความรวมมือระหวางรัฐสังคมนิยมและประชาธิปไตยในทวีปของเรา"

 COG_the_intore_lion_dancers: "นักเตนสิงโตอินโตเร"
 COG_the_intore_lion_dancers_desc: "นักเตนสิงโตอินโตเรคือราชองครักษชั้นยอดของมวามีแหงรวันดา มักถูกเรียกวา ผูถูกเลือก ในกองทัพรวันดาแบบดั้งเดิม จะเปนการดีที่สุดหากกองกําลังติดอาวุธนี้อยูภายใตการบังคับบัญชาของรัฐบาลกลาง"

 COG_improve_colonial_lawmaking: "ปรับปรุงการออกกฎหมายอาณานิคม"
 COG_improve_colonial_lawmaking_desc: "กฎหมายของเรามีมากมาย และสวนใหญลาสมัยอยางหนัก ยังคงใชมาตั้งแตสมัยรัฐเสรี จะเปนการดีที่สุดหากวาจางโรแบร เดอ มูเลอแนร นักกฎหมายอาณานิคมผูมีชื่อเสียง มาชวยเขียนกฎหมายที่ลาสมัยของชาติเราขึ้นใหม"

 COG_establish_new_sabena_air_routes: "เปดเสนทางบินใหมของ SABENA"
 COG_establish_new_sabena_air_routes_desc: "Societé Anonyme Belge d'Exploitation de la Navigation Aérienne เปนประโยชนตอเรามานานดวยการใหบริการขนสงทางอากาศระหวางศูนยกลางประชากรหลักของชาติอันกวางใหญ บางทีเราอาจลองเปดเสนทางใหมไปยังภูมิภาคหางไกลบางแหงของรัฐ เพื่อใหการขนสงและการสื่อสารจัดการไดงายขึ้นมาก"

 COG_congo_and_the_war_in_europe: "คองโกกับสงครามในยุโรป"
 COG_congo_and_the_war_in_europe_desc: "เจาเหนือหัวของเราถูกมหาอํานาจตางชาติโจมตี และสงครามอาจลุกลามมาถึงพรมแดนของเราในที่สุด ถึงเวลาที่เราตองเตรียมพรอมรบ และยืนยันวาแมพวกเขาจะยอมแพ แตเราจะไมมีวันยอมจํานน!"

 COG_emergency_powers_for_pierre_ryckmans: "อํานาจฉุกเฉินแกขาหลวงอาณานิคม"
 COG_emergency_powers_for_pierre_ryckmans_desc: "ฝายบริหารของเราหยุดชะงักโดยสิ้นเชิงนับตั้งแตการติดตอกับรัฐบาลในเบลเยียมถูกตัดขาด เราจึงตองมอบอํานาจฉุกเฉินแกริคมันสและฟเลสเคาเวอร เพื่อใหเราดําเนินการไดอยางมีอํานาจมากขึ้น"

 COG_an_independent_colonial_cabinet: "คณะรัฐมนตรีอาณานิคมอิสระ"
 COG_an_independent_colonial_cabinet_desc: "เพื่อบริหารประเทศอยางเหมาะสม เราตองตั้งคณะรัฐมนตรีชั่วคราวและรัฐสภาของเราเองที่เลโอโปลดวิล ระหวางนี้ ฟเลสเคาเวอรจะเยือนพันธมิตรตาง ๆ อยางเปนทางการ โดยหวังจะไดขอตกลงการคาที่เปนประโยชน"

 COG_acquire_american_investments: "ดึงการลงทุนจากอเมริกา"
 COG_acquire_american_investments_desc: "ชาวอเมริกันสนใจอยางยิ่งที่จะใชชาติอันกวางใหญของเราเปนศูนยกลางการขนสงเสบียงและอาวุธ เนื่องจากเราตั้งอยูใจกลางแอฟริกาในเชิงยุทธศาสตร และยังอยูไมไกลจากทวีปอเมริกา เราควรใชขอไดเปรียบนี้ดึงดูดนักลงทุนชาวอเมริกัน"

 COG_make_use_of_the_british_proposal: "ใชประโยชนจากขอเสนอของอังกฤษ"
 COG_make_use_of_the_british_proposal_desc: "อังกฤษเสนอวา เมื่อเห็นความออนแอของรัฐบาลในเบลเยียม พวกเขายินยอมใหรัฐคองโกที่เปนอิสระเขารวมพันธมิตรของพวกเขา โดยแลกกับการที่เรามอบสิทธิ์ในเหมืองและสวนยางหลายแหง เปนขอเสนอที่ควรรับไวอยางยิ่ง!"

 COG_prepare_for_offensive_action: "เตรียมปฏิบัติการรุก"
 COG_prepare_for_offensive_action_desc: "นักการเมืองที่บานเกิดยังลังเลเรื่องบทบาทของเราในสงครามนี้ แตเราตองไมลืมวาเราสามารถเปนผูกอบกูพวกเขาได และดวยวีรกรรม เราจะไดเอกราชผานสงครามครั้งนี้ ทุกคนสูแนวหนา!"

 COG_utilize_sabena_for_military_purposes: "ใช SABENA เพื่อการทหาร"
 COG_utilize_sabena_for_military_purposes_desc: "กอนหนานี้ SABENA ใชเพื่อการขนสงพลเรือนเทานั้น แตเมื่อสงครามประชิดถึงหลังบาน เราตองใชพวกเขาฝกนักบินและดัดแปลงเครื่องบินเพื่อการรบทางอากาศ"

 COG_raf_and_saaf_cooperation: "ความรวมมือกับ RAF และ SAAF"
 COG_raf_and_saaf_cooperation_desc: "นักบินของเราจํานวนมากออกไปเขารวมกองทัพอากาศอังกฤษ แมจะเจ็บปวดที่ตองรวมมือกับเครือจักรภพอังกฤษมากขึ้น แตการเรียนรูความเชี่ยวชาญและสัมผัสยุทธวิธีของพวกเขาในสนามรบจะชวยเราไดมาก"

 COG_enter_the_sterling_area: "เขารวมเขตเงินปอนดสเตอรลิง"
 COG_enter_the_sterling_area_desc: "อังกฤษเรียกรองใหเราเขารวมเขตเงินปอนดสเตอรลิง จายเงินอุดหนุนแกพวกเขา และปฏิบัติตามราคาตลาดอาณานิคมของพวกเขา แลกกับการที่เรายังคงเปนอิสระจากพวกเขาไดขณะที่เจาเหนือหัวของเราถูกตางชาติยึดครอง แมจะไมดีนักตอเศรษฐกิจของเรา แตก็เปนราคาที่เราตองจาย"

 COG_safeguard_cabinda: "ปกปองคองโกของโปรตุเกส"
 COG_safeguard_cabinda_desc: "จังหวัดกาบินดาเคยเปนสวนหนึ่งของราชอาณาจักรคองโก และขณะที่สงครามลุกโชนไปทั่วโลก ถึงเวลาแลวที่เราจะกาวเขาไปปกปองพี่นองผูบริสุทธิ์ของเราจากอันตรายใด ๆ ผูยึดครองในปจจุบันอาจไมพอใจการกระทํานี้ แตมันจําเปนตอการปกปองอนาคตของแอฟริกา"

 COG_central_bank_of_congo_ruanda_urundi: "ธนาคารกลางแหงคองโกและรวันดา-อูรุนดี"
 COG_central_bank_of_congo_ruanda_urundi_desc: "ถึงเวลาแลวที่เราจะกอตั้งธนาคารของเราเอง ธนาคารที่ไมถูกควบคุมโดยมหาอํานาจตางชาติหรือตั้งอยูโพนทะเล!"

 COG_national_committee_for_liberation: "คณะกรรมการแหงชาติเพื่อการปลดปลอย"
 COG_national_committee_for_liberation_desc: "พวกสายกลางผูออนแอในขบวนการแหงชาติคองโกดูพอใจกับการประนีประนอมเพื่อเอกราชที่อาจไมมีวันมาถึง ถึงขั้นยอมรับแผนสามสิบปเพื่อการปลดปลอยแอฟริกาของเบลเยียมของเจฟ ฟน บิลเซิน บางสวน เราตองโจมตีเจาหนาที่อาณานิคมกอนที่พวกเขาจะมีโอกาสดับไฟของเรา!"

 COG_alliance_de_bakongo: "พันธมิตรบาคองโก"
 COG_alliance_de_bakongo_desc: "พันธมิตรบาคองโกนําโดยโฌแซ็ฟ กาซา-วูบู นักคิดผูยิ่งใหญ ผูที่จะเปนแสงนําทางใหคองโกที่เปนอิสระอยางแนนอน เราควรดูแลให ABAKO ดําเนินงานไดโดยไมถูกรัฐบาลแทรกแซง"

 COG_progressive_congolese_students: "นักศึกษาคองโกหัวกาวหนา"
 COG_progressive_congolese_students_desc: "เมื่อคนในประเทศของเราเริ่มเชื่อในวาทกรรมสังคมนิยมมากขึ้น การกอตั้งองคกรเยาวชนที่ซึ่งแนวคิดเหลานี้จะแพรกระจายและพัฒนาตอไปอาจเปนทางเลือกที่ชาญฉลาด เยาวชนคืออนาคต จึงตองไดรับการสั่งสอนสิ่งที่จําเปนตอการนําพาเราเมื่อถึงเวลาของพวกเขา"

 COG_manifeste_convience_africaine: "แถลงการณจิตสํานึกแอฟริกัน (Le Manifeste de Conscience Africaine)"
 COG_manifeste_convience_africaine_desc: "จิตสํานึกแหงชาติคองโกเริ่มกอตัวขึ้น และกลุม évolué เริ่มผิดหวังกับแผนสามสิบปของเจฟ ฟน บิลเซิน ถึงเวลาแลวที่ปญญาชนคองโกจะสงเสียงใหไดยิน และแสดงใหโลกเห็นวาคองโกกําลังมุงหนาไปทางใด!"

 COG_endorse_force_publique_mutinies: "หนุนการกอกบฏใน Force Publique"
 COG_endorse_force_publique_mutinies_desc: "แม Force Publique จะเปนเครื่องมือของเจาหนาที่อาณานิคม แตก็มีหลายคนในองคกรที่มองเห็นธาตุแทของ ภารกิจสรางความศิวิไลซ เราควรโนมนาวพวกเขาวาทางที่ดีที่สุดคือการกอกบฏ และมีเพียงวิธีนี้เทานั้นที่เราจะไดเอกราชโดยสมบูรณ"

 COG_encourage_unionism: "สงเสริมสหภาพแรงงาน"
 COG_encourage_unionism_desc: "มีคนจํานวนมากในคองโกที่ไดคาจางไมใกลเคียงกับผูที่ควรเทาเทียมกันในทางทฤษฎีเลย เพื่อแกปญหานี้ เราตองสงเสริมใหประชาชนรวมตัวเปนสหภาพ เพราะมีเพียงการรวมมือกันเทานั้นที่จะนํามาซึ่งอนาคตที่ดีกวา!"

 COG_make_contact_with_irving_brown: "ติดตอเออรวิง บราวน"
 COG_make_contact_with_irving_brown_desc: "เออรวิง บราวน นักสหภาพแรงงานชาวอเมริกันและผูนําในสหพันธแรงงานอเมริกัน มีความสัมพันธกับซีรีล อาดูลา มานาน และในฐานะรอยโทแหงกองทัพบกสหรัฐฯ การดึงเขามาเปนพวกอาจคุมคาทีเดียว ดวยการใชเขาเปนผูประสานงาน เรานาจะไดรับการลงทุนจากชาวอเมริกันที่มีสายสัมพันธกับสหภาพแรงงาน"

 COG_invite_the_general_labour_federation_of_belgium: "สหพันธแรงงานทั่วไปแหงเบลเยียม"
 COG_invite_the_general_labour_federation_of_belgium_desc: "สหพันธแรงงานทั่วไปแหงเบลเยียมกอตั้งขึ้นแทนคณะกรรมาธิการสหภาพแรงงาน และกําลังมองหาทางขยายอิทธิพลออกไปนอกแผนดินใหญเบลเยียม ดวยเสนสายของเรา เราสามารถทําใหพวกเขาลงหลักปกฐานในคองโก เปนองคกรที่รวมประชาชนของเราใหเขารวมได"

 COG_union_nationale_des_travailleurs_du_congo: "สหภาพแรงงานแหงชาติคองโก (Union Nationale des Travailleurs du Congo)"
 COG_union_nationale_des_travailleurs_du_congo_desc: "เราตองกอตั้งสหภาพแรงงานที่มีศูนยกลางในคองโก ซึ่งแยกเปนอิสระทั้งจากรัฐบาลของเราและของชาติอื่นใด"

 COG_approach_the_disfavored_mwami: "เขาหามวามีผูตกอับ"
 COG_approach_the_disfavored_mwami_desc: "มีคนจํานวนมากที่เคียดแคนผูยึดครองชาวเบลเยียม หนึ่งในนั้นคือยูฮีที่ 5 มูซิงกา อดีตมวามีแหงรวันดา เราอาจไดรับความโปรดปรานจากเขา และทําใหเขากับผูติดตามเขารวมการลุกฮือของเราเมื่อถึงเวลาอันเหมาะสม"

 COG_the_simba_movement: "ขบวนการซิมบา"
 COG_the_simba_movement_desc: "วิธีที่ดีที่สุดในการขับไลเจาอาณานิคมคือการติดดินและไดรับการสนับสนุนจากประชาชนทั่วไป ดวยเหตุนี้ คริสตอฟ กเบนเย จึงจัดตั้งกลุมที่เรียกวาซิมบา ซึ่งหมายถึงความดุรายของสิงโตตัวใหญที่พวกเขาใชโคนลมศัตรู พวกเขาคือความหวังที่ดีที่สุดของเราในการไดมาซึ่งเอกราช!"

 COG_attempt_to_sway_moise_thsombe: "พยายามโนมนาวมอยซ ช็อมเบ"
 COG_attempt_to_sway_moise_thsombe_desc: "มณฑลกาตังกาดูไมคอยเห็นดวยกับแนวคิดแยกตัวของเรา และนาจะแยกตัวออกไปเองหากเราเริ่มกอการกบฏ เราจึงตองไดรับการสนับสนุนจากนักการเมืองคนสําคัญที่สุดคนหนึ่งของพวกเขา มอยซ ช็อมเบ และใหเขาโนมนาวพวกเขาใหรวมอุดมการณเดียวกับเรา"

 COG_secure_soviet_aid: "ขอความชวยเหลือจากโซเวียต"
 COG_secure_soviet_aid_desc: "มีมหาอํานาจหลายชาติที่อยากเห็นเราเปนอิสระ หรืออยางนอยก็อยากเห็นเจาเหนือหัวชาวเบลเยียมของเราออนแอลง สหภาพโซเวียตอาจเปนทางเลือกที่ดีที่สุด หากเราตองการพันธมิตรที่พึ่งพาไดแมหลังสงครามจบลง"

 COG_secure_german_aid: "ขอความชวยเหลือจากเยอรมนี"
 COG_secure_german_aid_desc: "มีมหาอํานาจหลายชาติที่อยากเห็นเราเปนอิสระ หรืออยางนอยก็อยากเห็นเจาเหนือหัวชาวเบลเยียมของเราออนแอลง แมเยอรมนีจะแทบไมสนใจเอกราชของเราเลย แตพวกเขาไมตองการอะไรมากไปกวาการเห็นเบลเยียมออนแอ ดังนั้นพวกเขาจะเปนพันธมิตรที่แข็งแกรง อยางนอยก็ในชวงสงคราม"

 COG_approach_the_barotse_litunga: "เขาหาลิตุงกาแหงบาโรตเซ"
 COG_approach_the_barotse_litunga_desc: "เยตาที่ 2 ลิตุงกาของชาวบาโรตเซทางใตของเรา มีเปาหมายตอตานจักรวรรดินิยมหลายอยางรวมกับเรา บางทีการไดรับความไววางใจจากเขา และใหนักรบของเขาชวยในการปลดปลอยของเรา อาจเปนทางเลือกที่ชาญฉลาด?"

 COG_slander_the_colonial_authorities: "ใสรายเจาหนาที่อาณานิคม"
 COG_slander_the_colonial_authorities_desc: "สิ่งที่เราตองทําตอนนี้คือเริ่มการรณรงคโฆษณาชวนเชื่อขนาดใหญตอตานเจาหนาที่อาณานิคม และเปดโปงทุกสิ่งที่พวกเขาเคยทําและยังคงทําตอเราใหสาธารณชนไดรู มีเพียงวิธีนี้เทานั้นที่เราจะไดรับการสนับสนุนจากประชาชนอยางแทจริง"

 COG_strike_while_the_rion_is_hot: "ตีเหล็กเมื่อรอน"
 COG_strike_while_the_rion_is_hot_desc: "ถึงเวลาแลว ตอนนี้หรือไมมีวัน เราจะโจมตีศัตรูอยางดุเดือด เพื่อใหประเทศของเราเปนอิสระจากการกดขี่ของลัทธิอาณานิคมตลอดกาล!"

 COG_the_lion_roars: "สิงโตคําราม"
 COG_the_lion_roars_desc: "ประชาชนแหงแอฟริกาโหยหาการปลดปลอยจากผูกดขี่ เชนเดียวกับที่เราเคยเปน กลุมซิมบาไดรับความนิยมอยางลนหลามในระยะหลัง และ ณ จุดนี้ ไมมีสิ่งใดหยุดยั้งพวกเขาจากการขึ้นเปนผูนําประเทศไดอีกแลว"

 COG_proclaim_the_peoples_republic: "ประกาศสถาปนาสาธารณรัฐประชาชนคองโก"
 COG_proclaim_the_peoples_republic_desc: "หากถามประชาชนของเราเมื่อหลายปกอนวาคิดวาจะมาถึงวันนี้ไดหรือไม พวกเขาคงตอบวาไม แตเราทําสําเร็จแลว วันนี้คือวันที่เราประกาศสถาปนาสาธารณรัฐประชาชนที่เราใฝฝนมานาน ประธานจงเจริญ รัฐจงเจริญ!"

 COG_the_arme_populaire_de_liberation: "กองทัพปลดแอกประชาชน (Armée Populaire de Libération)"
 COG_the_arme_populaire_de_liberation_desc: "กองกําลังปฏิวัติตองเขาถึงทุกคน และแข็งแกรงพอจะปกปองพลเมืองของเรา ดวยเหตุนี้ เราจึงตองกอตั้งกองทัพปลดแอกประชาชนของเราเอง เพื่อใหประชาชนไมตองหวาดกลัวตอความปลอดภัยของตนอีกตอไป!"

 COG_nationalization_of_foreign_industrial_assets: "โอนสินทรัพยอุตสาหกรรมตางชาติเปนของรัฐ"
 COG_nationalization_of_foreign_industrial_assets_desc: "ตลอดประวัติศาสตรของเรา บริษัทและบรรษัทตางชาติจํานวนมากเขามาในชาติเพื่อขูดรีดทรัพยากรและประชาชนของเรา เราตองโอนอุตสาหกรรมเหลานี้เปนของรัฐ และนํามาเปนของเราเอง"

 COG_form_the_gecamines: "กอตั้ง Gécamines"
 COG_form_the_gecamines_desc: "ขั้นตอไปคือการโอน Géomines เปนของรัฐ โดยควบรวมเขากับรัฐวิสาหกิจที่เราเพิ่งกอตั้ง La Générale des Carrières et des Mines เมื่อทําเชนนี้ ทรัพยากรของชาติจะเปนของเราอยางแทจริงในที่สุด"

 COG_societe_nationale_chemins_du_congo: "การรถไฟแหงชาติคองโก (Société Nationale des Chemins de fer du Congo)"
 COG_societe_nationale_chemins_du_congo_desc: "ดวยความกวางใหญของประเทศ การจัดตั้งหนวยงานแหงชาติเพื่อดูแลทางรถไฟจํานวนมากของเรา ซึ่งสวนใหญอยูในสภาพทรุดโทรม จึงเปนเรื่องสําคัญ เพื่อใหประเทศของเราเชื่อมถึงกันมากกวาที่เคยเปนมา"

 COG_cooperate_with_the_congolese_churches: "รวมมือกับศาสนจักรในคองโก"
 COG_cooperate_with_the_congolese_churches_desc: "แมศาสนจักรจะมีแนวคิดอนุรักษนิยม แตก็ไมไดตอตานเรา และไมไดเปนภัยใหญตอการปกครองของเรา ทางที่ดีที่สุดจึงเปนการผูกมิตรกับพวกเขา และใหพวกเขาเปนสวนหนึ่งของกลไกแหงชาติแทน"

 COG_strict_anti_clericalism: "ตอตานศาสนจักรอยางเขมงวด"
 COG_strict_anti_clericalism_desc: "นักบวชของศาสนจักรคาทอลิกและคิมบังกูเปนพวกโลภมากที่สนใจแตตัวเอง เราตองพยายามตัดอิทธิพลของพวกเขาออกจากสังคม หากประชาชนของเราจะเจริญรุงเรืองได"

 COG_invite_kwame_to_the_capital: "เชิญควาเม เอ็นครูมาหมาเยือนเมืองหลวง"
 COG_invite_kwame_to_the_capital_desc: "ควาเม เอ็นครูมาห เปนนักการเมืองชาวกานาผูยึดถือลัทธิรวมแอฟริกาที่ทรงอิทธิพลและเปนที่นิยม เราควรเชิญเขามาเยือนเมืองหลวงเพื่อสรางความสัมพันธอันดีกับขบวนการนี้ และบางทีเขาอาจเปนประโยชนตอเราไดหลายทาง"

 COG_liberation_by_force: "ปลดปลอยดวยกําลัง"
 COG_liberation_by_force_desc: "ประชาชนแหงแอฟริกาไมมีกําลังพอจะปลดปลอยตนเอง เราจึงตองพยายามปลดปลอยพวกเขาจากผูกดขี่ เพื่อใหพวกเขาไดสัมผัสอิสรภาพอีกครั้ง ดังที่เคยมีเมื่อนานมาแลว"

 COG_hold_the_pan_african_congress: "จัดการประชุมสมัชชาพานแอฟริกัน"
 COG_hold_the_pan_african_congress_desc: "นักการเมืองแอฟริกันผูทรงอิทธิพลทั้งหมดตองมารวมตัวกันและรวมกําหนดอนาคตของทวีป วาระการประชุมตองรวมถึงการลุกฮือตอตานรัฐเจาอาณานิคม และการปลดปลอยประชาชนชาวแอฟริกัน"

 COG_establish_the_west_african_national_secretariat: "สํานักเลขาธิการแหงชาติแอฟริกัน"
 COG_establish_the_west_african_national_secretariat_desc: "ถึงเวลาแลวที่จะดําเนินการตามที่ตกลงกันในการประชุมสมัชชาพานแอฟริกัน เราตองสงอาวุธใหนักปฏิวัติ และชวยเหลือการตอสูตอตานลัทธิอาณานิคมทั่วโลก เพื่อใหยุคมืดนี้จบสิ้นลงตลอดกาล!"

 COG_socialist_education_reforms: "ปฏิรูปการศึกษาแบบสังคมนิยม"
 COG_socialist_education_reforms_desc: "ประชาชนตองไดรับการศึกษาที่เหมาะสมเพื่อใหคิดเองเปน โดยไมหวนกลับไปติดกับดักของลัทธิชนเผาและความปาเถื่อน เราจึงตองพยายามวางระบบการศึกษาและหลักสูตรใหสอดคลองกับมุมมองที่เราตองการ"

 COG_foster_a_personality_cult: "สรางลัทธิบูชาตัวบุคคล"
 COG_foster_a_personality_cult_desc: "ไมมีผูใดนอกจาก [ROOT.GetLeader] ที่จะนําความรุงเรืองมาสูประชาชนแหงแอฟริกาได เขาคือผูนําผูยิ่งใหญที่เปนรากฐานแหงเอกราชของเรา และตองไดรับการยกยองอยางสมฐานะ"

 COG_join_the_comitern: "เขารวมโคมินเทิรน"
 COG_join_the_comitern_desc: "เรามีพันธมิตรทางอุดมการณในสหภาพโซเวียต ผูไมปรารถนาสิ่งใดมากไปกวาการยุติยุคแหงลัทธิอาณานิคม เราจึงควรกระชับความสัมพันธทางการทูตกับพวกเขา และอาจถึงขั้นแสวงหาการเปนพันธมิตร"

 COG_african_research_and_development_department: "ฝายวิจัยและพัฒนาเทคโนโลยีแอฟริกัน"
 COG_african_research_and_development_department_desc: "เพื่อกาวหนา เราตองจัดตั้งหนวยวิจัยและพัฒนาเทคโนโลยีรวมของแอฟริกา ซึ่งจะรวบรวมความรูทางเทคนิคของรัฐแอฟริกันตาง ๆ เขาดวยกัน"

 COG_organization_of_african_unity: "องคการเอกภาพแอฟริกา"
 COG_organization_of_african_unity_desc: "ที่ผานมา การหลุดพนจากการเปนอาณานิคมของยุโรปถูกมองวาเปนเพียงเรื่องของการไดเอกราช แตดูเหมือนวาเราทุกคนยังคงเปนเปาหมายที่อาจถูกพิชิตในสายตาของผูนําหลายคนนอกแอฟริกา มีเพียงการยืนหยัดรวมกันและรวมมือกันเทานั้น ที่ประชาชนแหงแอฟริกาจะหวังตานทานไมใหกลับไปเปนรัฐในอารักขาอีกครั้งได"

 COG_mutual_defense: "การปองกันรวมกัน"
 COG_mutual_defense_desc: "ประชาชนแหงแอฟริกาจะไมมีวันมีสันติภาพที่ยั่งยืน จนกวาชาติตาง ๆ ในโลกจะตระหนักวาราคาของการพยายามยึดเราเปนอาณานิคมนั้นสูงเกินไป เพื่อบรรลุเปาหมายนี้ สมาชิกขององคการเอกภาพแอฟริกาควรทําขอตกลงปองกันรวมกัน โดยสัญญาวาจะปกปองกันและกันหากผูใดถูกโจมตี"

 COG_central_african_bank: "ธนาคารกลางแอฟริกา"
 COG_central_african_bank_desc: "ดวยการกอตั้ง[ETH_GetCentralBankName] เราสามารถเริ่มกระบวนการบูรณาการเศรษฐกิจภายในองคการเอกภาพแอฟริกาได ซึ่งจะชวยใหเราใชทรัพยากรและโครงสรางพื้นฐานไดอยางมีประสิทธิภาพยิ่งขึ้น เพื่อประโยชนของรัฐสมาชิกทั้งหมด"

 COG_the_executive_council: "คณะมนตรีบริหาร"
 COG_the_executive_council_desc: "เราควรผลักดันความรวมมือที่มากขึ้นในองคการเอกภาพแอฟริกา ดวยการจัดตั้งองคกรบริหารที่ดําเนินการตามเจตจํานงของประชาชน และตอบสนองตอภัยคุกคามตอเสถียรภาพในภูมิภาคไดอยางรวดเร็ว"

 COG_the_african_union: "สหภาพแอฟริกา"
 COG_the_african_union_desc: "ถึงเวลาแลวที่ประชาชนแหงแอฟริกาจะรวมกันเปนหนึ่งในสหภาพแอฟริกา เราจะไมถูกคุกคามโดยพวกจักรวรรดินิยมหรือฟาสซิสตอีกตอไป ขณะที่เรามุงมั่นสูการเปนมหาอํานาจแหงแรกของแอฟริกา"

 COG_kasa_vubus_first_cabinet: "คณะรัฐมนตรีชุดแรกของกาซา-วูบู"
 COG_kasa_vubus_first_cabinet_desc: "การเลือกตั้งเสรีครั้งแรกสิ้นสุดลงแลว และโฌแซ็ฟ กาซา-วูบู ไดรับชัยชนะ ขณะนี้เขากําลังทํางานอยางหนักเพื่อจัดตั้งคณะรัฐมนตรีชุดแรกของคองโก ดวยความนิยมอยางลนหลามทั่วประเทศและความสามารถอันยอดเยี่ยมในหนาที่ เขาจะไดรับการจดจําในฐานะประธานาธิบดีผูยิ่งใหญไปอีกหลายชั่วอายุคนอยางแนนอน"

 COG_national_insitute_of_agronomic_study: "สถาบันศึกษาเกษตรศาสตรแหงชาติ"
 COG_national_insitute_of_agronomic_study_desc: "เราตองจัดตั้งองคกรที่มุงวิเคราะหและปรับปรุงวิธีการเกษตรและที่ดินทํากินของเรา ดวยวิธีนี้ เราจะทําใหชาติเจริญรุงเรืองไดอยางแทจริง"

 COG_the_ten_year_plan: "แผนสิบป"
 COG_the_ten_year_plan_desc: "เพื่อใหอุตสาหกรรมของเรากลับมาเดินเครื่องไดอีกครั้ง เราควรริเริ่มแผนสิบปเพื่อการพัฒนาเศรษฐกิจและสังคมของคองโก"

 COG_expanded_peasantry_program: "ขยายโครงการเพื่อชาวนา"
 COG_expanded_peasantry_program_desc: "ภาคเกษตรเปนภาคที่ใหญที่สุดในประเทศของเรา และตองไดรับการลงทุนอยางหนักเพื่อใหทันสมัย ซึ่งนั่นคือสิ่งที่เราจะทํา"

 COG_declaration_of_congolese_unity: "ปฏิญญาเอกภาพคองโก"
 COG_declaration_of_congolese_unity_desc: "ปจจุบันชาวบาคองโกอาศัยอยูอยางแตกแยกดวยพรมแดนระหวางประเทศ เราตองพยายามรวมประชาชนของเราใหเร็วที่สุด และทําใหชาวบาคองโกเจริญรุงเรืองไปอีกหลายศตวรรษ"

 COG_improve_the_civil_administration: "ปรับปรุงการบริหารราชการพลเรือน"
 COG_improve_the_civil_administration_desc: "การบริหารในภูมิภาคหางไกลหลายแหงของเรายังบกพรองอยูมาก เราตองพยายามปรับปรุง หากประเทศของเราจะดําเนินไปอยางราบรื่นไรรอยตออยางที่เราปรารถนา"

 COG_mend_the_linguistic_divides: "สมานรอยราวทางภาษา"
 COG_mend_the_linguistic_divides_desc: "ชาติของเรามีความแตกแยกอยางมาก หนึ่งในความแตกแยกที่ใหญที่สุดคือดานภาษา ระหวางภาษาหลักอยางคีคองโก ลิงกาลา สวาฮีลี ชีลูบา และฝรั่งเศส รวมถึงภาษาเล็ก ๆ อีกหลายรอยภาษาในประเทศ เราตองใหสถานะทางการแกภาษาเหลานี้จํานวนมาก หากตองการบรรลุความเทาเทียมอยางแทจริง"

 COG_women_in_the_military: "อนุญาตใหสตรีเขารับราชการทหาร"
 COG_women_in_the_military_desc: "ปจจุบันสตรีในชาติของเราไมไดรับอนุญาตใหรับราชการทหาร แมจะมีสตรีผูรักชาติจํานวนมากที่ปรารถนาจะทําเชนนั้น เราตองแกกฎหมายเพื่อเปดทางใหพวกเธอ เพื่อใหมีทหารที่มีความสามารถเขารวมกองทัพไดมากที่สุดเทาที่จะเปนไปได"

 COG_assemble_a_regency_council: "จัดตั้งคณะผูสําเร็จราชการ"
 COG_assemble_a_regency_council_desc: "ยังมองไมเห็นทางออกของความขัดแยงทางการเมือง ไมมีพรรคหรือนักการเมืองคนใดไดรับการสนับสนุนจากประชาชนมากพอที่จะขึ้นเปนผูนําประเทศ และสถานการณเชนนี้ปลอยใหยืดเยื้อตอไปไมได เราตองจัดตั้งคณะที่จะพยายามเสนอตําแหนงผูนําแกหัวหนาเผาและกษัตริยบางพระองค เพื่อรวบรวมความชอบธรรมใหรัฐบาลใหมของเรามากที่สุด"

 COG_the_kingdom_of_kongo_focus: "ราชวงศอากวาโรซาดา"
 COG_the_kingdom_of_kongo_focus_desc: "ราชวงศอากวาโรซาดาเปนราชวงศสุดทายที่ปกครองราชอาณาจักรคองโกในชวงศตวรรษที่ 19 และ 20 และยังเปนหนึ่งในฝายหลักในสงครามกลางเมืองคองโก บัดนี้ ดง เปดรูที่ 7 ผูอางสิทธิ์คนปจจุบัน ไดรับการสวมมงกุฎเปนกษัตริยแหงคองโกอีกครั้ง"

 COG_the_nyim_of_kuba_focus: "เญ็มแหงคูบา"
 COG_the_nyim_of_kuba_focus_desc: "ราชอาณาจักรคูบาดํารงอยูมาตั้งแตป 1625 และในป 1884 ถูกเปลี่ยนเปนแควนของหัวหนาเผาภายใตสมาคมนานาชาติแหงคองโก ผูปกครองของพวกเขาคือเญ็ม ซึ่งปจจุบันคือ Mbóp Mábíínc maMbéky และเขาจะฟนฟูชาติของเราสูความรุงเรืองดังเดิมได!"

 COG_the_ma_loango_focus: "มาโลอังโก"
 COG_the_ma_loango_focus_desc: "มาโลอังโกคือผูปกครองตามประเพณีของราชอาณาจักรโลอังโก เมื่อเรารับตําแหนงนี้แลว เราควรมุงรวมดินแดนเกาที่ราชอาณาจักรเคยครอบครองกลับคืนมา"

 COG_the_mwami_of_burundi_focus: "มวามีแหงบุรุนดี"
 COG_the_mwami_of_burundi_focus_desc: "เมื่อมวัมบุตซาที่ 4 บังกีรีเซงเงขึ้นครองบัลลังกของเรา เราจึงอางพระอิสริยยศแหงราชอาณาจักรบุรุนดีได ดวยวิธีนี้ เราจะทําใหการอางสิทธิ์เหนือราชอาณาจักรเล็ก ๆ ทางตะวันออกมีความชอบธรรม และบางทีเราอาจไปไดไกลกวานั้น"

 COG_the_umwami_of_rwanda_focus: "อุมวามีแหงรวันดา"
 COG_the_umwami_of_rwanda_focus_desc: "เมื่อมุตาราที่ 3 รูดาฮิกวาขึ้นครองบัลลังกของเรา เราจึงอางพระอิสริยยศแหงราชอาณาจักรรวันดาได ดวยวิธีนี้ เราจะทําใหการอางสิทธิ์เหนือราชอาณาจักรเล็ก ๆ ทางตะวันออกมีความชอบธรรม และบางทีเราอาจไปไดไกลกวานั้น"

 COG_the_pro_german_mwami_focus: "มวามีฝกใฝเยอรมนี"
 COG_the_pro_german_mwami_focus_desc: "ยูฮีที่ 5 มูซิงกาแหงรวันดา ผูรวมมือกับเยอรมนี ไดขึ้นปกครองประเทศหลังไดรับเลือกจากคณะผูสําเร็จราชการของเรา แตในเหตุการณที่ไมคาดคิด เขากลับประกาศใหคองโกเปนความตอเนื่องของจักรวรรดิอาณานิคมเยอรมัน และประกาศวาตนคือผูปกครองราชอาณาจักรมิทเทิลอาฟริกา!"

 COG_uniao_dos_povos_do_norte_de_angola: "สหภาพประชาชนแหงแองโกลาเหนือ (União dos Povos do Norte de Angola)"
 COG_uniao_dos_povos_do_norte_de_angola_desc: "União dos Povos do Norte de Angola เปนขบวนการกองโจรที่ปฏิบัติการอยูในแองโกลาตอนเหนือ โดยมีเปาหมายนําดินแดนเดิมของเรากลับคืนสูราชอาณาจักรคองโก การใหทุนสนับสนุนกลุมนี้จึงเปนทางเลือกที่ชาญฉลาด"

 COG_bundu_dia_kongo: "บุนดู เดีย คองโก"
 COG_bundu_dia_kongo_desc: "เพื่อใหรัฐของเรากลับไปเปนอยางที่เคยเปนอยางแทจริง เราตองสลัดพันธนาการแหงคริสตศาสนาที่ชาวโปรตุเกสนําเขามาเมื่อหลายปกอนทิ้งไป ถึงเวลาที่จะกลับมาโอบรับบูคองโกอีกครั้ง!"

 COG_devout_catholic_kingdom: "ราชอาณาจักรคาทอลิกผูเครงศรัทธา"
 COG_devout_catholic_kingdom_desc: "ในฐานะหนึ่งในราชอาณาจักรคาทอลิกแหงแรก ๆ ในแอฟริกา เรารูถึงความสําคัญของศาสนาและความชอบธรรมของพระสันตะปาปา หากเราจะฟนตัวจากความขัดแยงหลายศตวรรษที่ผานมา เราตองยึดมั่นในอุดมคติแบบคริสเตียน"

 COG_reestablish_the_royal_council: "ฟนฟูสภาราชสํานัก"
 COG_reestablish_the_royal_council_desc: "สภาราชสํานักแหงราชอาณาจักรคองโก ที่มักเรียกกันวายอดแหงยอด เคยเปนองคกรปกครองของขุนนางและเจาหนาที่ในอดีต เราควรฟนฟูสภานี้ขึ้นมาอีกครั้ง เพราะไมมีกษัตริยองคใดปกครองเพียงลําพังไดอยางแทจริง"

 COG_bakongo_military_might: "แสนยานุภาพแหงบาคองโก"
 COG_bakongo_military_might_desc: "เมื่อเราทําใหสถานการณในราชอาณาจักรมีเสถียรภาพอีกครั้งแลว ถึงเวลาที่จะอางสิทธิ์และพิชิตทุกสิ่งที่เปนของเรา และนําแอฟริกามาอยูใตอํานาจของเรา!"

 COG_royal_university_of_higher_education: "มหาวิทยาลัยหลวงเพื่อการอุดมศึกษา"
 COG_royal_university_of_higher_education_desc: "เพื่อใหชาติกาวหนาได เราตองใหการศึกษาแกประชาชนในแบบที่ทําใหพวกเขาสรางความกาวหนาทางวิทยาศาสตรได ดวยเหตุนี้ เราควรกอตั้งมหาวิทยาลัยเพื่อการอุดมศึกษา"

 COG_invest_in_the_textile_industry: "ลงทุนในอุตสาหกรรมสิ่งทอ"
 COG_invest_in_the_textile_industry_desc: "เพื่อใหชาติเจริญรุงเรือง เราตองลงทุนในการผลิตสิ่งทอแบบดั้งเดิมของคูบา และนําไปขายในตลาดระหวางประเทศ"

 COG_traditional_masks_and_armor: "หนากากและเกราะแบบดั้งเดิม"
 COG_traditional_masks_and_armor_desc: "เพื่อปลุกขวัญกําลังใจของทหาร เราควรติดตั้งเกราะแบบดั้งเดิมของคูบาใหพวกเขา และเรายังขมขวัญศัตรูไดดวยหนากากแบบดั้งเดิมของเรา"

 COG_children_of_woot: "บุตรแหงโวต"
 COG_children_of_woot_desc: "โวตเปนสิ่งมีชีวิตเหนือธรรมชาติผูตั้งชื่อใหสัตวและสิ่งมีชีวิตอื่น ๆ และยังเปนมนุษยคนแรกผูนําอารยธรรมมาให เราคือบุตรของพระองค และตองประพฤติตนใหสมกับความคาดหวังของพระองค"

 COG_spirit_of_loko_yima: "วิญญาณแหงโลโก ยีมา"
 COG_spirit_of_loko_yima_desc: "[ROOT.GetLeader] มีวิญญาณของโลโก ยีมาผูขาวบริสุทธิ์สถิตอยูภายใน เทพบนพื้นพิภพผูถูกบิดาแหงทองฟาบุมบาสํารอกออกมาในคราวสรางโลก ดังนั้นทุกคนตองปฏิบัติตามเจตจํานงของ [ROOT.GetLeader]"

 COG_a_society_of_trade: "สังคมที่สรางบนการคา"
 COG_a_society_of_trade_desc: "สังคมของเราดําเนินตอไปไดมายาวนานดวยเสนทางการคาที่ผานคองโก เราตองรักษาสิ่งนี้ไวหากตองการรากฐานทางเศรษฐกิจที่แข็งแกรงยิ่งขึ้น"

 COG_a_multiethnic_conglomeration: "การรวมตัวของหลากชาติพันธุ"
 COG_a_multiethnic_conglomeration_desc: "สังคมของเราประกอบดวยกลุมชาติพันธุและภาษาหลากหลายมาโดยตลอด และนั่นทําใหเราดีขึ้น เราควรสงเสริมสิ่งนี้ใหมากขึ้น และเปลี่ยนความสัมพันธระหวางผูพิชิตกับผูถูกพิชิต"

 COG_reclaim_loango: "ยึดโลอังโกคืน"
 COG_reclaim_loango_desc: "แมปจจุบันจะยังไมเปนเชนนั้น แตเมืองหลวงที่แทจริงของเรา โลอังโก ตั้งอยูใน [772.GetName] และตองไดรับการสรางใหมใหเปนนครอันยิ่งใหญที่โลกไมเคยเห็นมากอน แตขั้นแรกคือตองยึดมันใหไดเสียกอน"

 COG_the_kings_divine_power: "เทวสิทธิ์แหงกษัตริย"
 COG_the_kings_divine_power_desc: "กษัตริยทรงมีเทวสิทธิ์ในการปกครอง และตองไดรับอนุญาตใหทรงปกครองเชนนั้น พระองคทรงรูดีที่สุดวาอะไรดีสําหรับราษฎรผูจงรักภักดี และจะทรงปกครองดวยกําปนเหล็ก"

 COG_appoint_a_royal_council: "แตงตั้งสภาราชสํานัก"
 COG_appoint_a_royal_council_desc: "กษัตริยอาจทรงรูมาก แตไมใชทุกสิ่ง พระองคจึงตองมีสภาที่ปรึกษาในราชสํานักที่ชวยถวายคําแนะนําในการปกครองราชอาณาจักร"

 COG_occupy_cabinda: "ยึดครองกาบินดา"
 COG_occupy_cabinda_desc: "จังหวัดกาบินดาตั้งอยูระหวางจังหวัดโลอังโกและโบมาของเรา และขณะที่สงครามลุกโชนไปทั่วโลก ถึงเวลาแลวที่เราจะกาวเขาไปปกปองพี่นองผูบริสุทธิ์ของเราจากอันตรายใด ๆ ผูยึดครองในปจจุบันอาจไมพอใจการกระทํานี้ แตมันจําเปนตอการปกปองอนาคตของแอฟริกา"

 COG_reestablish_the_bouvandji: "ฟนฟูบูวันจี"
 COG_reestablish_the_bouvandji_desc: "ในศตวรรษที่ 11 บูวันจีเปนภราดรภาพของชางตีเหล็กจากชาววอโย พวกเขาเชี่ยวชาญการใชไฟและเหล็ก และนํารัฐเงาโยขึ้นครอบงําเหนือเรา แตดวยชัยชนะของเราในชวงไมกี่ปที่ผานมา อาจถึงเวลาที่เราจะใชประโยชนจากพวกเขาแทน"

 COG_invest_in_rubber_plantations: "ลงทุนในสวนยางพารา"
 COG_invest_in_rubber_plantations_desc: "ยางคือเชื้อเพลิงแหงเศรษฐกิจของเรา และชวยใหเราทําขอตกลงการคาที่เปนประโยชนกับมหาอํานาจตางชาติได จึงเปนภาคสวนที่เราตองลงทุนอยางหนัก"

 COG_friendship_with_france: "สนธิสัญญาไมตรีกับ[FRA.GetName]"
 COG_friendship_with_france_desc: "[FRA.GetNameDefCap]อาจเคยยึดเราเปนอาณานิคม แตพวกเขาก็ยอมใหเรามีเอกราชในนาม และเราซาบซึ้งในเรื่องนั้น เราควรพยายามแกไขความผิดพลาดในอดีต และสรางพันธมิตรกับพวกเขา"

 COG_attempt_to_ally_the_portuguese: "พยายามเปนพันธมิตรกับชาว[POR.GetAdjective]"
 COG_attempt_to_ally_the_portuguese_desc: "ความสัมพันธของเรากับ[POR.GetNameDef]และนักสํารวจของพวกเขามีขึ้นมีลง แตถึงเวลาแลวที่เราจะเยียวยาอดีตและมองไปขางหนา เราจึงควรแสวงหาการเปนพันธมิตรกับพวกเขา"

 COG_reclaim_bujumbura: "ยึดบูจุมบูราคืน"
 COG_reclaim_bujumbura_desc: "เราไมมีทางอางตนเปนราชอาณาจักรบุรุนดีใหมได หากเราไมไดควบคุมเมืองหลวงเกาของเรา เราตองทําทุกวิถีทางเพื่อยึดภูมิภาคนี้คืนมา!"

 COG_the_embodiment_of_god: "รางแหงพระเจา"
 COG_the_embodiment_of_god_desc: "[ROOT.GetLeader] คือรางแหงพระเจาเอง และมีเทวสิทธิ์อันเปนเอกลักษณในการปกครองดินแดนทั้งปวงรอบเกรตเลกส ขอพระองคทรงพระเจริญ!"

 COG_claim_the_great_lakes: "อางสิทธิ์เหนือราชอาณาจักรเกรตเลกส"
 COG_claim_the_great_lakes_desc: "ราชอาณาจักรตาง ๆ แถบเกรตเลกส ซึ่งเราเคยเปนหนึ่งในนั้น บัดนี้ลวนถูกมหาอํานาจตางชาติปราบปรามจนสยบ ในฐานะหนึ่งในราชอาณาจักรเกาแกเหลานี้ เรามีสิทธิ์อันชอบธรรมเหนือพื้นที่นี้มากกวามหาอํานาจจักรวรรดินิยมใด ๆ จึงตองยึดมาเปนของเราโดยเร็วที่สุด"

 COG_new_empire_of_kitara: "จักรวรรดิคิตาราใหม"
 COG_new_empire_of_kitara_desc: "ผูคนจํานวนมากในภูมิภาคตะวันออกของเราเลาขานถึงจักรวรรดิคิตาราอันยิ่งใหญและเกาแก ดวยการสืบทอดฐานะของรัฐในตํานานอันลึกลับนี้ เราจะทําใหการอางสิทธิ์เหนือราชอาณาจักรเกรตเลกสมีความชอบธรรมอยางสมบูรณ"

 COG_south_to_lake_malawi: "ลงใตสูทะเลสาบมาลาวี"
 COG_south_to_lake_malawi_desc: "ตองรุกครั้งสุดทายไปยังทะเลสาบใหญอีกแหง ซึ่งไมไดอยูในแผนที่ของจักรวรรดิคิตาราเกา นั่นคือทะเลสาบมาลาวี และมันจะถูกอางสิทธิ์เปนของเรา เชนเดียวกับทะเลสาบใหญอื่น ๆ ทั้งหมดในภูมิภาค"

 COG_reclaim_kigali: "ยึดคิกาลีคืน"
 COG_reclaim_kigali_desc: "เราไมมีทางอางตนเปนราชอาณาจักรรวันดาใหมได หากเราไมไดควบคุมเมืองหลวงเกาของเรา เราตองทําทุกวิถีทางเพื่อยึดภูมิภาคนี้คืนมา!"

 COG_centralize_military_structure: "รวมศูนยโครงสรางทางทหาร"
 COG_centralize_military_structure_desc: "เพื่อประสานงานกองทัพไดดียิ่งขึ้น เราตองจัดตั้งโครงสรางทางทหารแบบรวมศูนย ซึ่งเปนสิ่งเดียวกับที่ในอดีตทําใหเราพิชิตราชอาณาจักรเพื่อนบานทั้งหมดไดอยางงายดาย"

 COG_an_expansionist_state: "รัฐนักขยายดินแดน"
 COG_an_expansionist_state_desc: "ทุกรัฐตองเติบโตอยางตอเนื่องหากตองการตอบสนองความตองการของประชากร และเราก็ไมตางกัน เราตองขยายพรมแดนอยางรวดเร็วเพื่อตอบสนองผูที่โหยหามากขึ้นอยูเสมอ"

 COG_great_military_chiefs: "หัวหนาทัพผูยิ่งใหญ"
 COG_great_military_chiefs_desc: "สิ่งที่ทําใหเราโดดเดนในอดีตคือผูบัญชาการทหารผูยิ่งใหญ เราควรบังคับใชระเบียบการฝกที่เขมงวด เพื่อใหผูบัญชาการในปจจุบันเทียบเคียงกับคนในอดีตได"

 COG_great_cattle_chiefs: "หัวหนาปศุสัตวผูยิ่งใหญ"
 COG_great_cattle_chiefs_desc: "สิ่งที่ทําใหเราโดดเดนในอดีตคือหัวหนาผูยิ่งใหญที่มีพรสวรรคดานการจัดการและการบริหาร พวกเขาทําใหภาคเกษตรของเราแข็งแกรงกวาผูใด และนั่นคือสิ่งที่เราตองนํากลับมาอยางเรงดวน"

 COG_expand_banana_plantations: "ขยายสวนกลวย"
 COG_expand_banana_plantations_desc: "กลวยคือเสนเลือดใหญของเศรษฐกิจที่แข็งแรงทุกแหง เราควรเพิ่มผลผลิตกลวยใหไดสิบเทา เพื่อใหทั้งประชาชนและเศรษฐกิจของเราพึงพอใจ"

 COG_tutsi_warrior_training: "การฝกนักรบทุตซี"
 COG_tutsi_warrior_training_desc: "นักรบทุตซีผูยิ่งใหญของเราเคยชวยเราพิชิตราชอาณาจักรเพื่อนบานเมื่อหลายปกอน เราควรเขมงวดการเกณฑทหารใหมากขึ้น เพื่อใหมีเพียงชายที่แข็งแรงที่สุดและไดรับการฝกดีที่สุดเทานั้นที่เขารวมกองทัพได"

 COG_unify_east_africa: "รวมแอฟริกาตะวันออก"
 COG_unify_east_africa_desc: "บัดนี้ ในที่สุดเราก็สามารถทําความฝนของกษัตริยรวันดาในอดีตใหเปนจริงได ดวยการพยายามรวมแอฟริกาตะวันออกเปนหนึ่ง นี่คือความสําเร็จอันยิ่งใหญ และจะนําเกียรติยศอันยิ่งใหญมาสูเรา!"

 COG_a_german_protectorate: "รัฐในอารักขาของเยอรมนี"
 COG_a_german_protectorate_desc: "เพื่อสรางความชอบธรรมใหรัฐใหมของเรา และปกปองจากแรงหิวโหยอยางอังกฤษและฝรั่งเศส เราควรพยายามเปนรัฐในอารักขาของมิตรเกาของเรา [GER.GetNameDef]"

 COG_invite_german_kasierist_exiles: "เชิญกลุมนิยมกษัตริยชาวเยอรมัน"
 COG_invite_german_kasierist_exiles_desc: "ดูเหมือนชาวเยอรมันจะทิ้งไกเซอรผูรุงโรจนของพวกเขาและยอมรับความธรรมดาสามัญอยางแทจริง เราควรเชิญกลุมนิยมกษัตริยชาวเยอรมันผูจงรักภักดีมายังชาติของเรา และพยายามสถาปนามิทเทิลอาฟริกาที่แทจริง!"

 COG_colonial_administration: "การบริหารอาณานิคม"
 COG_colonial_administration_desc: "เราควรนําสิ่งที่เราเรียนรูจากการบริหารอาณานิคมของเยอรมันเหนือชาติเราในอดีต มาใชบริหารแอฟริกาดวยตัวเราเองใหดียิ่งขึ้น"

 COG_prussia_of_africa: "ปรัสเซียแหงแอฟริกา"
 COG_prussia_of_africa_desc: "เรา มิทเทิลอาฟริกา คือผูพิชิตที่แทจริง ผูจะนําแอฟริกาทั้งหมดมาอยูใตอํานาจของเรา กองทัพของเราไดรับอิทธิพลแบบปรัสเซียอยางเขมขน และไมใชเรื่องแปลกที่จะไดยินผูคนเรียกเราวาปรัสเซียแหงแอฟริกา"

 COG_german_west_africa: "แอฟริกาตะวันตกของเยอรมนี"
 COG_german_west_africa_desc: "เราตองรุกไปยังดินแดนเกาของแอฟริกาตะวันตกของเยอรมนี เพื่อนําพวกมันกลับคืนสูออมอกอีกครั้ง!"

 COG_german_east_africa: "แอฟริกาตะวันออกของเยอรมนี"
 COG_german_east_africa_desc: "เราตองรุกไปยังดินแดนเกาของแอฟริกาตะวันออกของเยอรมนี เพื่อนําพวกมันกลับคืนสูออมอกอีกครั้ง!"

 COG_german_south_west_africa: "แอฟริกาตะวันตกเฉียงใตของเยอรมนี"
 COG_german_south_west_africa_desc: "เราตองรุกไปยังดินแดนเกาของแอฟริกาตะวันตกเฉียงใตของเยอรมนี เพื่อนําพวกมันกลับคืนสูออมอกอีกครั้ง!"


