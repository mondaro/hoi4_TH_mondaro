 GER_support_finland_desc: "ชาว[FIN.GetAdjective]มีขอพิพาทกับชาว[SOV.GetAdjective]เรื่อง[146.GetName]มานานแลว เมื่อความตึงเครียดในพื้นที่กําลังเพิ่มขึ้น การสนับสนุนพวกเขาจึงเปนประโยชนสูงสุดตอเรา และยังดึงพวกเขาใหใกลชิดกับเรามากขึ้นดวย"
