 GER_expand_kriegsmarinewerft_democratic: "อูตอเรือกองทัพเรือ" 
 GER_expand_kriegsmarinewerft_communism: "อูตอเรือกองทัพเรือประชาชน" 
 GER_expand_kriegsmarinewerft_desc: "เราตองทุมความพยายามเปนทวีคูณในการสรางกองทัพเรือใหทัดเทียมศัตรู ดวยการใชเทคโนโลยีการตอเรือแถวหนาและสรางเรือรบลํ้าสมัย เราจะแยงชิงการควบคุมทองทะเลหลวงมาจากศัตรูไดอยางแนนอน" 
 GER_construct_aircraft_carriers: "สรางเรือบรรทุกเครื่องบิน"
 GER_construct_aircraft_carriers_desc: "กองทัพเรือที่ยิ่งใหญและทันสมัยสมชื่อตองมีเรือบรรทุกเครื่องบินในกองเรือ เรือเหลานี้จะสําคัญยิ่งขึ้นเรื่อย ๆ ในการครองทองทะเล เพื่อไมใหตามหลังศัตรู เราตองเปดโครงการสรางเรือบรรทุกเครื่องบินอันทะเยอทะยาน"
 GER_carrier_variants_tt: "สราง§Yรุนยอย§!และ§Yสายการผลิต§!เรือบรรทุกเครื่องบิน ตามเทคโนโลยี §Y$early_ship_hull_carrier$§!, §Y$basic_ship_hull_carrier$§! หรือ §Y$ship_hull_carrier_2$§! ผลปจจุบัน:\n"
 GER_grosskampfschiff_construction: "การสรางเรือรบขนาดใหญ (Grosskampfschiff)"
 GER_grosskampfschiff_construction_desc: "$GER_pride_of_the_modern_germany_desc$" #old loc
 GER_high_seas_fleet: "กองเรือทะเลหลวง"
 GER_high_seas_fleet_desc: "เปาหมายอันทะเยอทะยานของเราตองไมนอยไปกวาการทําให[ROOT.GetNameDef]เปนมหาอํานาจระดับโลกอยางแทจริง เพื่อการนั้น เราตองฟนฟู Hochseeflotte หรือกองเรือทะเลหลวง ซึ่งครั้งหนึ่งเกือบทัดเทียมความเปนเจาสมุทรของราชนาวีอังกฤษ"
 GER_unlock_trade_interdiction_tt: "ปลดล็อกแผนยุทธศาสตร §Y$GER_trade_interdiction$§!"
 GER_re_establish_the_seekriegsleitung: "ฟนฟู Seekriegsleitung"
 GER_re_establish_the_seekriegsleitung_desc: "การฟนฟู Seekriegsleitung หรือกองบัญชาการสงครามทางทะเล จะทําใหการวางแผนและการปฏิบัติตามคําสั่งทางเรือ รวมถึงการวางกําลังโดยตรงมีประสิทธิภาพยิ่งขึ้น"
 GER_marinestosstrupp: "จัดตั้ง Marine Stosstrupp"
 GER_marinestosstrupp_desc: "เราตองจัดตั้งหนวยทหารราบนาวิก หรือที่เรียกวาหนวยจูโจมนาวิก ซึ่งสามารถยกพลขึ้นบกอยางกลาหาญและเจาะแนวปองกันชายฝงของศัตรู หากเราตองการแผอํานาจไปโพนทะเล"
 GER_atlantic_naval_bases: "ฐานทัพเรือแอตแลนติก"
 GER_atlantic_naval_bases_desc: "ดวยการตระหนักถึงความสําคัญทางยุทธศาสตรของภูมิภาคชายฝงแอตแลนติก และเปนสวนหนึ่งของความพยายามที่จะครองมหาสมุทรแอตแลนติก เราตองใหความสําคัญกับการขยายและปรับปรุงฐานทัพเรือใหทันสมัย เพื่อมุงสูความเหนือกวาทางทะเล"
 GER_naval_bases_along_atlantic_coast_tt: "ทุกรัฐที่§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมซึ่งมี§Y$naval_base$§!ตาม§Yชายฝงแอตแลนติกของยุโรป§!: เพิ่ม §Y$naval_base$§! §G1§! เพิ่ม §Y$coastal_bunker$§! §G1§! ผลปจจุบัน:"
 GER_atlantic_naval_dominance: "ครองมหาสมุทรแอตแลนติก"
 GER_atlantic_naval_dominance_desc: "เพื่อรักษาความเปนใหญในมหาสมุทรแอตแลนติก เราตองขยายพิสัยปฏิบัติการใหไกลยิ่งขึ้น และขยายการมีอยูทางทะเลจากชายฝงสูชายฝง"
 GER_controls_an_atantic_island_tt: "§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมเกาะในมหาสมุทรแอตแลนติกเหนือไดทั้งหมด"
 GER_naval_bases_on_atlantic_islands_tt: "ทุกเกาะที่§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมซึ่งมี§Y$naval_base$§!ใน§Yมหาสมุทรแอตแลนติกเหนือ§!: เพิ่ม §Y$naval_base$§! §G1§! เพิ่ม §Y$coastal_bunker$§! §G1§! ผลปจจุบัน:"
 GER_trade_interdiction: "การสกัดกั้นการคา"
 GER_trade_interdiction_desc: "เพื่อตัดเสนทางเสบียงและบั่นทอนความพยายามในสงครามของศัตรู เราตองใชยุทธศาสตรสกัดกั้นการคาเพื่อทําลายขีดความสามารถในการทําสงครามของพวกเขา ดวยการสงกองเรือผิวนํ้าและเรืออูไปทั่วทองทะเล เราจะขัดขวางการขนสงทรัพยากรสําคัญและเรือสินคา บีบใหศัตรูตองยอมสยบ"
 GER_cruiser_warfare: "สงครามเรือลาดตระเวน"
 GER_cruiser_warfare_desc: "เรือลาดตระเวนเบาของเรามีประโยชนมากกวาแคทําหนาที่คุมกัน เราตองสงพวกมันออกสูทะเลเปดเพื่อขัดขวางขบวนเรือลําเลียงของศัตรูและทําลายขีดความสามารถทางอุตสาหกรรมของพวกเขา"
 GER_panzerschiff_raiders: "เรือจูโจม Panzerschiff"
 GER_panzerschiff_raiders_desc: "เราควรใชเรือขนาดหนักในยุทธศาสตรสกัดกั้นการคา เรือเหลานี้โจมตีไดหนักหนวงและถอนตัวไดกอนที่กองเรือรบหลักของศัตรูจะมีโอกาสออกจากทาดวยซํ้า"
 GER_wolfpack_tactics: "ยุทธวิธีฝูงหมาปา"
 GER_wolfpack_tactics_desc: "แนวคิดการโจมตีขบวนเรือลําเลียงดวยเรือดํานํ้าไมใชเรื่องใหมและเคยใชในมหาสงคราม แตมีการเสนอยุทธวิธีใหมขึ้นมา แนวทางใหมนี้จะใหเรืออูของเรารวมมือกันเปน Rudel หรือฝูง เพื่อคนหาและจมเรือสินคา นี่อาจเปนกุญแจสําคัญในการตัดวัตถุดิบและความสามารถของศัตรูที่จะทําสงครามตอไป"
 GER_u_boat_efforts: "ทุมเทใหเรืออู"
 GER_u_boat_efforts_desc: "ความสําเร็จของยุทธวิธีฝูงหมาปาทําใหกองบัญชาการทหารเรือสูงสุดเชื่อมั่นที่จะทุมเทใหแนวทางนี้มากขึ้น และมุงสรางเรืออูใหมากขึ้นและดีขึ้น เพื่อชัยชนะบนทองทะเลหลวง"
 GER_unrestricted_convoy_raiding: "การโจมตีขบวนเรือลําเลียงแบบไมจํากัด"
 GER_unrestricted_convoy_raiding_desc: "เราตองเพิ่มประสิทธิภาพการโจมตีขบวนเรือลําเลียงเปนสองเทา และทุมเทการวางแผนเปนสามเทา เพื่อนําทองทะเลมาอยูใตการควบคุมของเราโดยสมบูรณ!"
 GER_unlock_plan_z_tt: "ปลดล็อกแผนยุทธศาสตร §Y$GER_plan_z$§!"
 GER_with_panzerschiff_completed_tt: "เมื่อทํา §Y$GER_panzerschiff_raiders$§! สําเร็จแลว:"
 GER_with_u_boat_efforts_completed_tt: "เมื่อทํา §Y$GER_u_boat_efforts$§! สําเร็จแลว:"
 GER_seeherrschaft: "ความเปนเจาสมุทร (Seeherrschaft)"
 GER_seeherrschaft_desc: "เรากําลังกาวไปสูการเปนเจาแหงมหาสมุทรที่ไมมีใครโตแยงได และทําใหวิสัยทัศนแหง Seeherrschaft หรือความเปนเจาสมุทรเปนจริง บัดนี้[ROOT.GetNameDef]ครองทองทะเลแลว!"

 GER_remilitarize_the_rhineland: "นํากําลังทหารกลับเขาไรนลันท"
 GER_remilitarize_the_rhineland_desc: "$GER_rhineland_desc$"
 GER_legion_condor: "กองพันคอนดอร (Legion Condor)"
 GER_legion_condor_desc: "ขณะที่สงครามกลางเมืองลุกโชนบนคาบสมุทรไอบีเรีย โอกาสอันยิ่งใหญก็มาถึงเรา ดวยการสงอาสาสมัครไปใหมากที่สุดเทาที่ทําได เราไมเพียงทําใหฝายที่ถูกตองไดรับชัยชนะ แตยังใหทหารของเราไดประสบการณในสนามรบ และผูกชาว[SPR.GetAdjective]ที่มีอุดมการณเดียวกับเราใหใกลชิดยิ่งขึ้น"
 GER_reorganize_secret_services: "ปรับโครงสรางหนวยสืบราชการลับ"
 GER_reorganize_secret_services_desc: "$GER_wilhelm_canaris$ พิสูจนแลววาไรประสิทธิภาพ หรือถึงขั้นไมจงรักภักดีตอรัฐบาลปจจุบันอยางเปดเผย หากขาวลือเปนความจริง เราตองปลดเขาออกและปรับโครงสราง Abwehr ใหเปนสถาบันที่มีความสามารถมากขึ้น"
 GER_fuhrerprinzip: "หลักการผูนํา (Führerprinzip)"
 GER_fuhrerprinzip_desc: "ฟอเรอรคาดหวังความจงรักภักดีอยางเต็มที่จากผูใกลชิด แตผูที่อยูในวงไววางใจไมกี่คนตองจําไววาไมมีใครมีคามากไปกวากอนหินที่ตนยืนอยู การกาวพลาดเพียงกาวเดียวหรือการไมทําตามความประสงคของฟอเรอรอาจนํามาซึ่งผลรายแรง ฟอเรอรเพียงผูเดียวจะกําหนดทิศทางของเรา"
 GER_party_chancellor_hess: "เฮสสเปนหัวหนาสํานักงานพรรค"
 GER_party_chancellor_hess_desc: "รูด็อลฟ เฮสส เปนสมาชิกที่แข็งขันของพรรคมาเปนเวลานาน เขาไดรับความไววางใจจากสมาชิกระดับสูงหลายคนในชนชั้นนําทางการเมือง รวมถึงฟอเรอรเอง จึงสมควรแลวที่เขาจะไดรับตําแหนงหัวหนาสํานักงานพรรค"
 GER_party_chancellor_bormann: "บอรมันนเปนหัวหนาสํานักงานพรรค"
 GER_party_chancellor_bormann_desc: "มารทีน บอรมันน พิสูจนแลววามีความสามารถอยางยิ่งในตําแหนงเลขานุการสวนตัวของรองฟอเรอร และยังมีความรูดานการเงินกวางขวางจากการเคยเปนหัวหนา Hilfskasse der NSDAP กองทุนชวยเหลือของพรรค NSDAP เขาจึงเหมาะอยางยิ่งที่จะเปนหัวหนาสํานักงานพรรค"
 GER_mega_reichskommissariats: "ขาหลวงไรชขนาดมหึมา"
 GER_mega_reichskommissariats_desc: "เมื่อเขตขาหลวงไรชพิสูจนแลววาเปนประโยชนอยางยิ่ง จึงไมนาแปลกใจที่ผูนําของเรา [ROOT.GetLeader] ใชเวลามากมายพิจารณาการปรับปรุงเพิ่มเติม ปญหาหนึ่งของเขตขาหลวงไรชคือจํานวนที่เพิ่มขึ้น และงานบริหารที่ตองใชในการปกครองซึ่งเพิ่มตามไปดวย แนนอนวาบางเขตนาจะควบรวมกันได..."
 GER_optimize_reich_labour_service: "ปรับปรุงหนวยบริการไรชใหเหมาะสม"
 GER_optimize_reich_labour_service_desc: "หนวยบริการแรงงานไรชมีประโยชนอยางมากในการทําใหประชากรของเรามีงานทํา แตเราคิดวามันใชทําอะไรไดมากกวานั้น เราสามารถปรับการใช RAD ใหไดประโยชนสูงสุดในทุกดาน ทั้งแรงงาน การโฆษณาชวนเชื่อ และการเตรียมพรอมทําสงคราม"
 GER_ascension_of_himmler: "$GER_inner_circle_member_title$ ฮิมมเลอร"
 GER_ascension_of_himmler_desc: "ภายใตการจัดระเบียบและการนําของไฮนริช ฮิมมเลอร หนวย SS เติบโตจากจุดเริ่มตนเล็ก ๆ จนกลายเปนกองกําลังที่โดดเดนในประเทศของเรา การเลื่อนตําแหนงเขาจะทําใหเราใชประโยชนจากทักษะของเขาไดมากขึ้น และใช SS ในปจจุบันไดดียิ่งขึ้น"
 GER_expand_ss_recruitment: "ขยายการรับสมัคร SS"
 GER_expand_ss_recruitment_desc: "เกณฑการเขารวม SS นั้นสูงลิ่ว และกระบวนการถูกเปรียบวาเหมือนการลอดรูเข็ม แมเกณฑตองคงไวในระดับสูงเพื่อใหไดกองกําลังคุณภาพเยี่ยม แตการรับสมัครก็ขยายไดดวยวิธีอื่นที่ไมตองลดมาตรฐานของเรา"
 GER_create_four_militia_units_tt: "สรางหนวย§Yกองกําลังอาสาเยอรมัน 4 หนวย§!"
 GER_create_two_motorized_units_tt: "สรางหนวย§Yยานยนตเยอรมัน 2 หนวย§!"
 GER_SS_recruitment_tt: "ปลดล็อกการตัดสินใจ: §Y$SS_recruitment$§!"
 GER_strengthen_the_waffen_ss: "เสริมความแข็งแกรงให Waffen-SS"
 GER_strengthen_the_waffen_ss_desc: "Waffen-SS เหลารบของ SS พิสูจนแลววาเปนทรัพยากรอันมีคาในการรบ แมในทางเทคนิคจะเปนหนวยกึ่งทหาร แตเราเชื่อมั่นวาหากไดรับทรัพยากรมากขึ้น พวกเขาจะปฏิบัติการไดมีประสิทธิภาพไมแพกองทัพประจําการ"
 GER_create_two_militia_units_tt: "สรางหนวย§Yกองกําลังอาสาเยอรมัน 2 หนวย§!"
 GER_create_one_motorized_units_tt: "สรางหนวย§Yยานยนตเยอรมัน 1 หนวย§!"
 GER_create_two_light_panzer_units_tt: "สรางหนวย§Yยานเกราะเบาเยอรมัน 2 หนวย§!"
 GER_create_two_medium_panzer_units_tt: "สรางหนวย§Yยานเกราะกลางเยอรมัน 2 หนวย§!"
 GER_expand_ss_security_duties: "ขยายหนาที่รักษาความมั่นคงของ SS"
 GER_expand_ss_security_duties_desc: "เมื่อ SS เติบโตอยางตอเนื่องภายใตการชี้นําของไฮนริช ฮิมมเลอร ถึงเวลาที่พวกเขาจะรับผิดชอบดานความมั่นคงของเรามากขึ้น ดวยการขยายหนาที่ของพวกเขา เราจะปลดทรัพยากรไปใชในดานอื่นได"
 GER_hegemony_of_the_ss: "อํานาจครอบงําของ SS"
 GER_hegemony_of_the_ss_desc: "ดวยการรับสมัครที่เพิ่มขึ้นและยุทโธปกรณที่ดีขึ้น บัดนี้ SS เปนกองกําลังที่นาเกรงขามในสนามรบ ภายใตการนําของฮิมมเลอร กลุมนี้เติบโตจนเปนหนึ่งในทรัพยากรที่โดดเดนที่สุดของเรา สามารถทําสิ่งตาง ๆ ไดเกินความคาดหมาย การมอบอํานาจที่พวกเขามีอยูตอนนี้เปนการตัดสินใจที่ชาญฉลาด และตอจากนี้เราตองจัดหาสิ่งจําเปนเพื่อความสําเร็จใหพวกเขาตอไป"
 GER_expand_gestapo: "ขยายเกสตาโป"
 GER_expand_gestapo_desc: "เกสตาโปพิสูจนแลววาเชี่ยวชาญอยางยิ่งในการจัดการฝายคานทางการเมืองและผูกอความวุนวายอื่น ๆ การขยายเกสตาโปจะทําใหประชากรของเราปฏิบัติตามกฎหมายและความคาดหวังในปจจุบัน"
 GER_absorb_the_abwehr: "ผนวก Abwehr"
 GER_absorb_the_abwehr_desc: "การแยก Abwehr ออกจากกองบัญชาการกองทัพบกเปนการตัดสินใจที่สมเหตุสมผลในเวลานั้น แตดวยสถานการณปจจุบัน ดูเหมือนสิ่งตรงขามอาจเปนจริงแลว เราควรพิจารณาผนวก Abwehr"
 GER_innovative_warfare: "สงครามเชิงนวัตกรรม"
 GER_innovative_warfare_desc: "วิธีการทําสงครามของเราตองพัฒนาอยูเสมอ มิฉะนั้นเราเสี่ยงที่จะหยุดนิ่ง มีเพียงการพัฒนาและเปลี่ยนแปลงอยางตอเนื่องเทานั้นที่จะทําใหศัตรูตามยุทธวิธีและเทคโนโลยีของเราไมทัน"
 GER_form_organization_todt: "จัดตั้งองคการโทดท"
 GER_form_organization_todt_desc: "แมจะมีโครงการกอสรางขนาดใหญหลายโครงการที่ฟอเรอรอยากเห็นสําเร็จ แตสวนใหญตองรอไปกอน สิ่งเรงดวนที่สุดคือ[ROOT.GetNameDef]ตองการอุตสาหกรรมทางทหารเพิ่มขึ้นอยางยิ่ง เมื่อการวางแผนอยูในมือของฟริทซ โทดท เรามั่นใจวาผลลัพธจะออกมาดี"
 GER_employ_philipp_holzmann: "วาจางฟลิพพ โฮลทซมันน"
 GER_employ_philipp_holzmann_desc: "อัลแบรท ชเปยร เสนอแนวคิดใหวาจาง Philipp Holzmann AG สําหรับโครงการกอสรางขนาดใหญหลายโครงการที่ฟอเรอรตองการดําเนินการ บริษัทนี้มีชื่อเสียงดีและประวัติยาวนาน เคยสรางผลงานสถาปตยกรรมชิ้นเอกอยางศาลาวาการนครฮัมบูรก และอาคารไรชสทากดั้งเดิม พวกเขาเหมาะกับความตองการของเราอยางยิ่ง!"
 GER_prioritize_the_four_year_plan: "ใหความสําคัญกับแผนสี่ป"
 GER_prioritize_the_four_year_plan_desc: "เรารูตั้งแตแรกวาแผนสี่ปของ [ROOT.GetLeader] จะเปนขั้นตอนที่จําเปนในการเตรียมชาติสูสงคราม เนื่องจากฟอเรอรเองเปนผูที่งานยุงมาก จึงตองมีใครสักคนมาดูแลและประสานมาตรการที่จําเปน"
 GER_plenipotentiary_of_the_four_year_plan: "ผูมีอํานาจเต็มแหงแผนสี่ป"
 GER_plenipotentiary_of_the_four_year_plan_desc: "ชัดเจนแลววางานกํากับดูแลและทําใหการดําเนินแผนสี่ปมีประสิทธิภาพเปนภารกิจที่กวางขวางกวาที่คิดไวแตแรก การแตงตั้งแฮรมันน เกอริง เปนผูมีอํานาจเต็มแหงไรช คือการมอบอํานาจมหาศาลใหคนคนเดียว แตดวยผลงานอันยอดเยี่ยมของเขา ฟอเรอรจึงมั่นใจ แฮรมันน เกอริง มีประโยชนเกินกวาที่เราจะไมมอบสิทธิ์ทางการทูตเต็มที่ใหเขาในเรื่องนี้"
 GER_autonomous_organization_todt: "องคการโทดทอิสระ"
 GER_autonomous_organization_todt_desc: "องคการโทดท ที่ริเริ่มโดยฟริทซ โทดท พิสูจนแลววามีประสิทธิภาพอยางยิ่ง โครงการกอสรางเสร็จสิ้นอยางรวดเร็วจนแมแตฟอเรอรเองยังพอใจ หากไดรับสถานะผูมีอํานาจเต็มแหงไรชดานสรรพาวุธและการผลิตเพื่อสงคราม โทดทจะเปนทรัพยากรอันแทจริงของประเทศเรา"
 GER_plenipotentiary_of_armaments: "ผูมีอํานาจเต็มดานสรรพาวุธ"
 GER_plenipotentiary_of_armaments_desc: "ชัดเจนขึ้นเรื่อย ๆ วาตองมีใครสักคนรับผิดชอบภาพรวมในการจัดหาสิ่งที่แวรมัคทตองการ อัลแบรท ชเปยร แสดงผลงานที่นาพอใจที่สุดในการจัดหาใหแวรมัคท หากไดรับสถานะผูมีอํานาจเต็มแหงไรชดานสรรพาวุธและการผลิตเพื่อสงคราม ชายผูนี้อาจสรางผลงานอันนาอัศจรรยได!"
 GER_integration_of_puppet_economies: "ผนวกเศรษฐกิจรัฐหุนเชิด"
 GER_integration_of_puppet_economies_desc: "เมื่อเรามองดูสภาพของรัฐในอารักขา ก็เห็นไดชัดวาพวกเขาบริหารเศรษฐกิจไดแยเพียงใด แมแนนอนวาสิ่งนี้สงผลตอพวกเขาเปนหลัก แตก็ยังฉุดเศรษฐกิจของเราลงดวย ฟอเรอรเรียกรองใหจัดการกับปญหานี้!"
 GER_ministry_of_public_enlightenment: "กระทรวงเผยแพรความรูแกประชาชน"
 GER_ministry_of_public_enlightenment_desc: "กระทรวงโฆษณาชวนเชื่อรับใชเราไดดีเยี่ยมในระยะหลัง การเปลี่ยนชื่อกระทรวงโฆษณาชวนเชื่อเปนกระทรวงเผยแพรความรูแกประชาชน จะทําใหเราขยายหนาที่ของกระทรวง และเพิ่มงบประมาณไดโดยไมกอใหเกิดความกังวล"
 GER_fund_the_film_department: "ใหทุนแผนกภาพยนตร"
 GER_fund_the_film_department_desc: "ภาพยนตรพิสูจนแลววาเปนเครื่องมืออันทรงพลังในการปลุกใจและนําประชาชน ดวยการผลิตและสงเสริมภาพยนตรรักชาติ เราจะกระตุนใหชาติทุมเทตนเองอยางเต็มที่ใหแก[ROOT.GetName]อันรุงโรจนของเรา!"
 GER_the_triumphant_will: "ชัยชนะแหงเจตจํานง"
 GER_the_triumphant_will_desc: "$GER_improve_national_spirit_desc$"
 GER_propaganda_master: "ปรมาจารยแหงการโฆษณาชวนเชื่อ"
 GER_propaganda_master_desc: "เราไมมีขอสงสัยเลยเมื่อแตงตั้งโยเซ็ฟ เกิบเบิลส เปนรัฐมนตรีโฆษณาชวนเชื่อ เขาเปนนักพูดและนักเขียนที่เชี่ยวชาญอยูแลว บัดนี้เมื่อเขาเสนอแนวคิดในการปรับปรุงองคกรขาวกรองของเรา เราเชื่อมั่นเต็มที่วาการดําเนินตามแนวคิดเหลานี้เปนประโยชนสูงสุดตอเรา"
 GER_bribe_senior_officers: "ติดสินบนนายทหารระดับสูง"
 GER_bribe_senior_officers_desc: "เพื่อใหนายทหารระดับสูงจงรักภักดีตอฟอเรอร เราควรพิจารณาใหรางวัลแกความภักดีและการเชื่อฟง ดวยการเสนอเงิน ที่ดิน และการยกเวนภาษี เราจะมั่นใจไดวาพวกเขาไมเพียงจะภักดีตอไป แตยังจะอยูในขอบเขตของตน และไมตั้งคําถามตอฟอเรอร"
 GER_army_indoctrination: "ปลูกฝงลัทธิในกองทัพ"
 GER_army_indoctrination_desc: "การติดสินบนและแรงจูงใจทางการเงินไดผลดีกับนายทหารระดับสูงและบุคคลที่คัดเลือกในแวรมัคท แตสําหรับพลทหารทั่วไป เราไมอาจพึ่งการติดสินบนได มิฉะนั้นเศรษฐกิจของเราจะพังพินาศ การปลูกฝงใหพวกเขาเห็นดวยกับการตัดสินใจของเราอยางเต็มที่ผานการโฆษณาชวนเชื่อ อาจเปนแนวทางที่สมเหตุสมผลกวา"
 GER_autonomy_in_the_kriegsschulen: "ความเปนอิสระของโรงเรียนสงคราม (Kriegsschulen)"
 GER_autonomy_in_the_kriegsschulen_desc: "โรงเรียนสงคราม หรือ Kriegsschulen มีธรรมเนียมอันยาวนานในประเทศของเรา แมจะนาเยายวนที่จะควบคุมและปรับแตงการศึกษาทุกสวนในโรงเรียนเหลานี้ แตการปลอยและเสริมอํานาจใหโรงเรียนจัดการฝกที่ดีที่สุดแกนายทหารในอนาคตดวยตนเองอาจเปนผลดีกวา"
 GER_strafbataillon: "กองพันลงทัณฑ (Strafbataillon)"
 GER_strafbataillon_desc: "เมื่อไดใชมาตรการปลูกฝงลัทธิในกองทัพแลว บัดนี้เราสามารถใชมันไดหลายทางมากกวาแคทําใหทหารภักดีตอเรา ดวยการสงกองพันลงทัณฑออกไป เราจะปลูกฝงความรูสึกชาตินิยมที่ตองการใหแกบุคคลเหลานี้ ทั้งผานการปลูกฝงลัทธิและการใหพวกเขารับใชมาตุภูมิ!"
 GER_expand_the_truppenschulen: "ขยาย Truppenschulen"
 GER_expand_the_truppenschulen_desc: "เพื่อตอบสนองความตองการนายทหารเฉพาะทางที่เพิ่มขึ้น โรงเรียนเหลาทัพของเราตองขยายอยางมาก การใหการฝกที่ดีที่สุดแกนักเรียนนายทหารจะรับประกันความสําเร็จของเราในสนามรบ"
 GER_demonstration_of_military_achievements: "แสดงผลงานทางทหาร"
 GER_demonstration_of_military_achievements_desc: "ประวัติศาสตรของเราเต็มไปดวยผลงานทางทหารอันยิ่งใหญ ดวยการยกยองวาสิ่งที่ทหารของเราทําไดในตอนนี้จะเปนอีกหนึ่งผลงานทางทหารอันยิ่งใหญ เราจะปลุกขวัญกําลังใจและเพิ่มความภักดีของพวกเขาตอเรา"
 GER_demonstration_of_military_achievements_trigger: "ตองเปนจริงอยางใดอยางหนึ่งตอไปนี้:\n   มีรัฐในอารักขามากกวา§Y 2§! ชาติ\n   ยึดครองรัฐใน§Yยุโรป§!มากกวา§Y 19§! รัฐ" #TODO_Danne make these numbers into a variable!
 GER_country_leader_change_blocks_progress_demonstration_military_achievement_tt: "§Rการเปลี่ยนผูนําประเทศหลังทํา §Y$GER_demonstration_of_military_achievements$§! สําเร็จ จะทําใหไมสามารถทํา §Y$GER_an_invincible_army$§! และ §Y$GER_the_supreme_leader$§! ใหสําเร็จได§!"
 GER_an_invincible_army: "กองทัพเยอรมันผูไรพาย"
 GER_an_invincible_army_desc: "ดวยความสําเร็จและชัยชนะมากมายที่กองทัพของเราไดมาในสนามรบ เราไดพิสูจนใหโลกเห็นวา ไมวานักปลุกระดมฝายศัตรูจะพูดอยางไร กองทัพ[ROOT.GetAdjective]นั้นไรพายอยางแทจริง!"
 GER_country_leader_change_blocks_progress_invincible_army_tt: "§Rการเปลี่ยนผูนําประเทศหลังทํา §Y$GER_an_invincible_army$§! สําเร็จ จะทําใหไมสามารถทํา §Y$GER_the_supreme_leader$§! ใหสําเร็จได§!"
 GER_an_invincible_army_trigger: "ตองเปนจริงอยางใดอยางหนึ่งตอไปนี้:\n   มีรัฐในอารักขามากกวา§Y 5§! ชาติ\n   ยึดครองรัฐใน§Yยุโรป§!มากกวา§Y 49§! รัฐ"
 GER_the_supreme_leader_trigger: "[ROOT.GetNameDefCap]ทําใหประเทศ§Yมหาอํานาจ 2§! ประเทศขึ้นไป§Yยอมจํานน§!แลว"
 GER_the_supreme_leader: "ผูนําสูงสุด"
 GER_the_supreme_leader_desc: "ดวยการปฏิรูปที่มุงเปาและโครงการพลิกฟน ความภักดีของแวรมัคทตอ [ROOT.GetLeader] และอุดมการณของเขาไดขึ้นสูจุดสูงสุดใหม แนวโนมแหงการสนับสนุนผูนําและมาตุภูมิอยางเต็มที่นี้ตองดําเนินตอไป"
 GER_a_strong_successor: "ผูสืบทอดผูแข็งแกรง"
 GER_a_strong_successor_desc: "การผลัดเปลี่ยนอํานาจมาถึงแลว และฟอเรอรคนใหมตองขึ้นสูตําแหนง เรามีโอกาสแตงตั้งผูนําคนใหมที่สะทอนความปรารถนาของเราตอ[ROOT.GetNameDef] การเปลี่ยนแปลงนี้จะปลุกพลังใหความพยายามของเราในการนําอนาคตที่สดใสกวามาสูชาวเยอรมัน"
 GER_loyalty_to_the_fuhrer: "ภักดีตอฟอเรอร"
 GER_loyalty_to_the_fuhrer_desc: "จากการลงประชามติในป 1934 เมื่อตําแหนงประธานาธิบดีและนายกรัฐมนตรีถูกรวมเขาดวยกัน เราตระหนักดีถึงการสนับสนุนมหาศาลที่ฮิตเลอรไดรับจากประชาชน เราไมเห็นสัญญาณใดวาภูมิทัศนทางการเมืองเปลี่ยนไป ดังนั้นเราจะสนับสนุนฟอเรอรตอไป"
 GER_heed_von_neuraths_concerns: "รับฟงขอกังวลของฟอน นอยรัท"
 GER_heed_von_neuraths_concerns_desc: "สมาชิกระดับสูงหลายคนในกองทัพ ซึ่งนําโดยคอนสตันทีน ฟอน นอยรัท ไดแสดงความกังวลเกี่ยวกับยุทธวิธีและนโยบายทางทหารในปจจุบัน ตามความเห็นของพวกเขา แผนการทางทหารที่คอนขางกาวราวของฟอเรอรจะไมยั่งยืน และหากตองเผชิญความเสี่ยงของสงครามเต็มรูปแบบที่อาจตามมาหากเราเดินหนาตามแผนนั้น กองทัพของเรายังไมแข็งแกรงพอ"
 GER_reorganize_the_wehrmacht: "ปฏิรูปกองทัพแวรมัคท"
 GER_reorganize_the_wehrmacht_desc: "หากเราจะดําเนินแผนการอันทะเยอทะยานของทานผูนําใหสําเร็จ กองทัพแวรมัคทจําเปนตองไดรับการปฏิรูปครั้งใหญ ผูนําในปจจุบันจํานวนมากเกินไปมัวแตใชเวลาแสดงความกังวลอันไรสาระและไรมูลเหตุ แทนที่จะปฏิบัติตามคําสั่งของทานผูนํา มีเพียงการกําจัดบุคคลเหลานี้ออกไปเทานั้นที่จะทําใหเปาหมายของเราบรรลุผล!"
 GER_anschluss: "อันชลุสส"
 GER_anschluss_desc: "แมนักการเมือง[AUS.GetAdjective]จะพูดเชนไร แตก็ชัดเจนวาประชากรของ[AUS.GetNameDef]ซึ่งสวนใหญพูดภาษา[GER.GetAdjective] ตางโหยหาการกลับมารวมกับปตุภูมิ เราควรกดดันใหผูนําฉอฉลอยาง [AUS.GetLeader] ลาออก และปลอยใหเจตจํานงของประชาชนไดรับการสนองตอบ"
 GER_anschluss_army_trigger_tt: "กองทัพ§Y[ROOT.GetAdjective]§!มีขนาดใหญกวากองทัพ§Y[AUS.GetAdjective]§!อยางนอย §Y[?global.deployed_manpower_ratio_needed_for_anschluss]§! เทา เมื่อนับเฉพาะหนวยที่มียุทโธปกรณครบถวน\n\nเราประเมินวาเรา[GetAnschlussProgress]เปาหมายนี้"
 GER_antischluss_progress_minimal: "มีความคืบหนา§Rเพียงเล็กนอย§!สู"
 GER_antischluss_progress_moderate: "มีความคืบหนา§Oปานกลาง§!สู"
 GER_antischluss_progress_significant: "มีความคืบหนา§Yอยางมาก§!สู"
 GER_antischluss_progress_complete: "§Gบรรลุแลว§!"
 GER_austrian_army_does_not_exist: "ขณะนี้ §Y[AUS.GetnameDef]§! ไมมีกองทัพประจําการเลย"
 GER_befriend_czechoslovakia: "$GER_czech_friend$"
 GER_befriend_czechoslovakia_desc: "$GER_czech_friend_desc$"
 GER_war_preparations: "เตรียมพรอมสูสงคราม"
 GER_war_preparations_desc: "เพื่อใหชาติพรอมอยางเต็มที่สําหรับสงครามที่กําลังจะมาถึง เราตองแนใจวาการเตรียมการไมไดเกิดขึ้นเฉพาะในกองทัพแวรมัคท แตยังรวมถึงภาคอุตสาหกรรมและโครงสรางพื้นฐานดวย"
 GER_prepare_for_the_next_blockade_ww: "เตรียมรับการปดลอมครั้งตอไป"
 GER_prepare_for_the_next_blockade_ww_desc: "เมื่อชาติอื่นตระหนักถึงขอบเขตการเตรียมการของเรา ยอมหลีกเลี่ยงไมไดที่บางชาติจะคัดคาน เราเคยถูกปดลอมมากอนและรูวิธีรับมือ ดวยการเตรียมการอยางเหมาะสม การปดลอมของพวกเขาแทบจะไมสงผลใดๆ ตอเราเลย"
 GER_subversive_infiltrators: "นักแทรกซึมบอนทําลาย"
 GER_subversive_infiltrators_desc: "ขาวกรองและขอมูลเกี่ยวกับศัตรูเปนสิ่งสําคัญยิ่งตอการรุกรานที่ประสบความสําเร็จ เมื่อเราเพิ่มงบประมาณในหลายดาน ก็สมเหตุสมผลที่เราจะลงทุนพัฒนาการรวบรวมขาวกรองของเราดวย"
 GER_integrate_czechoslovakia: "ผนวกรวมเชโกสโลวาเกีย"
 GER_integrate_czechoslovakia_desc: "ยิ่งเราเขาใจวิธีการปกครอง[CZE.GetNameDef]มากขึ้นเทาใด ก็ยิ่งชัดเจนขึ้นเรื่อยๆ วาประชาชนโหยหาการเปลี่ยนแปลง การผนวกรวมเขากับ[GER.GetNameDef]จะมอบการเปลี่ยนแปลงที่จําเปนนี้ให เราควรสงคณะผูแทนไปพรอมคําขาด"
 GER_fate_of_czechoslovakia: "$GER_end_of_czechoslovakia$"
 GER_fate_of_czechoslovakia_desc: "$GER_end_of_czechoslovakia_desc$"
 GER_support_a_coup_in_liechtenstein: "สนับสนุนรัฐประหารในลิกเตนสไตน"
 GER_support_a_coup_in_liechtenstein_desc: "เราไดรับขาววากลุมบุคคลที่มีแนวคิดเดียวกับเราในลิกเตนสไตนกําลังวางแผนโคนลมผูสําเร็จราชการของประเทศเล็กจิ๋วแหงนี้ ชายผูหนึ่งชื่ออัลฟอนส โกป ไดมาขอการสนับสนุนจากเรา และยืนยันวาเราเองก็จะไดรับประโยชนจากเรื่องนี้เชนกัน"
 GER_reassert_eastern_claims: "$GER_demand_memel$"
 GER_reassert_eastern_claims_desc: "$GER_demand_memel_desc$"
 GER_expand_claims_in_baltic: "ขยายการอางสิทธิ์ในบอลติก"
 GER_expand_claims_in_baltic_desc: "ในอดีตมีชาว[ROOT.GetAdjective]พลัดถิ่นจํานวนมากอาศัยอยูในแถบบอลติก การนําพวกเขากลับบานสู[ROOT.GetNameDef]เปนประโยชนสูงสุดตอพวกเขา เชนเดียวกับที่เปนประโยชนตอเรา!" 
 GER_influence_the_baltics: "แผอิทธิพลสูบอลติก"
 GER_influence_the_baltics_desc: "รัฐบอลติกตั้งอยูอยางลอแหลมระหวางเรากับ[SOV.GetNameDef] ดวยความพยายามทางการทูตและขอเสนอที่เปนประโยชนรวมกัน เรานาจะดึงพวกเขาใหใกลชิดกับเรามากขึ้นไดโดยไมตองใชกําลัง"
 GER_danzig_for_slovakia: "$GER_danzig_vs_slovakia$"
 GER_danzig_for_slovakia_desc: "$GER_danzig_vs_slovakia_desc$"
 GER_befriend_poland: "$GER_poland_friend$"
 GER_befriend_poland_desc: "$GER_poland_friend_desc$"
 GER_subjugate_romanian_economy: "ครอบงําเศรษฐกิจโรมาเนีย"
 GER_subjugate_romanian_economy_desc: "[ROM.GetNameDefCap]กลายเปนคูคาสําคัญของเรา นํ้ามันดิบปริมาณมหาศาลที่ขุดไดในประเทศไดกระตุนเศรษฐกิจของพวกเขา และตอนนี้พวกเขาเริ่มขึ้นราคา แนนอนวาเรานาจะกดดันไดบางเพื่อใหไดราคาดีที่สุดสําหรับลูกคาเกาประจําอยางเรา?"
 GER_influence_the_benelux: "แผอิทธิพลสูเบเนลักซ"
 GER_influence_the_benelux_desc: "ดินแดนเบเนลักซมีความสําคัญตอความพยายามในการทําสงครามของเรา ทั้งในดานขีดความสามารถทางอุตสาหกรรมและที่ตั้งทางภูมิศาสตร แมเราอาจบุกยึดพวกเขาไดอยางงายดาย แตทําไมไมโนมนาวพวกเขาใหมาอยูฝายเราแทนเลา?"
 GER_operation_weserubung: "$GER_weserubung$"
 GER_operation_weserubung_desc: "$GER_weserubung_desc$"
 GER_utilize_the_nordliche_gesellschaft: "ใชประโยชนจากนอรดิเชอ เกเซลชาฟท" # was Befriend Scandinavia
 GER_utilize_the_nordliche_gesellschaft_desc: "สแกนดิเนเวียวางตัวเปนกลางมาโดยตลอด ไมมีประโยชนที่จะเปดแนวรบใหมเพื่อยึดทรัพยากรของพวกเขา หากเราไดมันมาดวยวิธีทางการทูต ดังนั้นเราควรใชสมาคมนอรดิกของอัลเฟรด โรเซินแบรค ซึ่งเปนองคกรเพื่อกระชับความรวมมือทางวัฒนธรรมและการเมืองระหวางเยอรมนีกับกลุมประเทศนอรดิก เพื่อสรางภาพลักษณที่ดีตอชาตินอรดิก"
 GER_form_rome_berlin_axis: "กอตั้งอักษะโรม-เบอรลิน"
 GER_form_rome_berlin_axis_desc: "$GER_italy_ally_desc$"
 GER_invade_italy: "ปฏิบัติการอาลาริก"
 GER_invade_italy_desc: "แมแวบแรก[ITA.GetNameDef]อาจดูเหมือนเปนพันธมิตรที่ดี แตเรารูธาตุแทของพวกเขา เมื่อเริ่มมหาสงคราม พวกเขาปฏิเสธที่จะรบเคียงขางเรา และในป 1915 ยังหันมาเปนศัตรูกับเรา ทั้งที่เคยเปนพันธมิตรกันมากอน เราไดรับบทเรียนแลว ความผิดพลาดในการไวใจพวกเขาจะไมเกิดขึ้นอีก"
 GER_alliance_with_spain: "$GER_nationalist_spain_ally$"
 GER_alliance_with_spain_desc: "$GER_nationalist_spain_ally_desc$"
 GER_operation_felix: "ปฏิบัติการเฟลิกซ"
 GER_operation_felix_desc: "เมื่อสงครามกลางเมืองสเปนสิ้นสุดลงในที่สุด ก็ถึงเวลาที่เราจะงัด[118.GetName]ออกจากมือชาว[ENG.GetAdjective] แตเนื่องจากเราไมอาจโจมตีจากทางทะเลได เราตองทําใหชาว[SPR.GetAdjective]ภักดีตอเรากอน เพื่อใหเราผานดินแดนของพวกเขาได เมื่อพิจารณาจากอุดมการณของเราแลว การทําใหพวกเขายอมสยบไมนาจะยาก"
 GER_secure_spain_desc: "[SPR.GetNameDef]พิสูจนแลววาเปนประเทศที่ผันผวนที่สุด ในขณะที่พวกเขาดิ้นรนกับการบริหารประเทศ บางทีเราควรยื่นมือเขาชวย? ถึงตอนนี้ การเปนรัฐหุนเชิดของเรายอมดีกวาความโกลาหลที่พวกเขาคุนเคยเปนแน?"
 GER_alliance_with_portugal: "เปนพันธมิตรกับโปรตุเกส"
 GER_alliance_with_portugal_desc: "ในอดีตเรามีความสัมพันธที่ไมคอยดีนักกับ[POR.GetNameDef] แมเราจะเปนศัตรูกันอยางขมขื่นในมหาสงคราม แตดูเหมือนพวกเขาจะเปลี่ยนใจแลว เมื่อพวกเขาสนับสนุนฝายชาตินิยมในสเปน เราเชื่อวาอาจมีความคลายคลึงทางอุดมการณ และเราอาจบรรลุขอตกลงกับชาว[POR.GetAdjective]ได"
 GER_operation_isabella: "ปฏิบัติการอิซาเบลลา"
 GER_operation_isabella_desc: "เมื่อเหลือเพียง[POR.GetNameDef]ที่ขวางระหวางเรากับการควบคุมคาบสมุทรไอบีเรียทั้งหมด กาวตอไปของเราคือตองทําใหพวกเขายอมสยบ การคงรัฐบาลทองถิ่นไวแตทําใหแนใจวาพวกเขาภักดีตอเรา จะทําใหเราไดทุกสิ่งที่ตองการทั้งดินแดน โครงสรางพื้นฐาน และสิ่งปลูกสรางทางทหาร"
 GER_secure_portugal_desc: "ยอนไปในมหาสงคราม ชาว[POR.GetAdjective]หลงเชื่อโฆษณาชวนเชื่อของฝายตรงขามและหันมาเปนศัตรูกับเรา เรือเกาของเราบางลํายังคงจอดอยูในทาเรือของพวกเขา และไมมีใครเอยถึงการคืนเรือเลยแมแตคําเดียว แมตอนนี้พวกเขาจะดูเปนมิตร แตเราไวใจพวกเขาไมได และควรบอกใหชัดวาหากไมตองการสงคราม ก็ถึงเวลาที่จะยอมอยูใตการปกครองของเรา"
 GER_operation_sea_lion: "ปฏิบัติการสิงโตทะเล"
 GER_operation_sea_lion_desc: "ที่ตั้งทางภูมิศาสตรของ[ENG.GetNameDef]เปนปจจัยที่สรางความยุงยากตอความพยายามในการทําสงครามของเรา การเปดปฏิบัติการรุกเต็มรูปแบบทั้งทางอากาศและทางทะเลดูจะเปนแนวทางที่ดีที่สุดในการบดขยี้ชาว[ENG.GetAdjective]ใหสิ้นซาก!"
 GER_operation_green: "ปฏิบัติการสีเขียว"
 GER_operation_green_desc: "เพื่อสนับสนุนปฏิบัติการสิงโตทะเล กองบัญชาการปฏิบัติการปกตะวันตกของเราควรวางแผนปฏิบัติการเต็มรูปแบบตอไอรแลนด และเตรียมยึดครองเกาะแหงนี้ เพื่อใหหมูเกาะบริติชตกอยูใตการควบคุมของเราโดยสมบูรณ ดวยเหตุนี้กองบัญชาการสูงสุดของเราจึงรางแผนฟลล กรึน ขึ้นเปนแผนปฏิบัติการโดยละเอียด"
 GER_challenge_the_monroe_doctrine: "ทาทายหลักการมอนโร"
 GER_challenge_the_monroe_doctrine_desc: "แมจะอยูหางไกล แตบางประเทศในอเมริกากลางและอเมริกาใตมีอุดมการณใกลเคียงกับเราอยางมาก การสรางและรักษาความสัมพันธอันดีกับพวกเขาจะเปนประโยชนอยางยิ่งตอทั้งสองฝาย ยิ่งไปกวานั้น การสรางฐานที่มั่นบนอีกทวีปหนึ่งอาจมีคุณคายิ่งในอนาคต"
 GER_shatter_usas_hegemony: "ทลายความเปนเจาโลกของ[USA.GetAdjective]"
 GER_shatter_usas_hegemony_desc: "ชาว[USA.GetAdjective]ไดรับอํานาจบนเวทีนานาชาติมากเกินไปมานานแลว เมื่อเราแข็งแกรงขึ้น ก็ถึงเวลาที่พวกเขาตองหลีกทาง"
 GER_challenge_the_monroe_doctrine_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yบอนทําลายหลักการมอนโร§!\n\nแจงเตือน §Y[USA.GetNameDef]§! และเปดโอกาสใหพวกเขาพยายาม§Rเขาแทรกแซง§!"
 GER_challenge_the_monroe_doctrine_tt_2: "มีอยางนอย 7 ประเทศที่ยังคงใช§Yหลักการมอนโร§!อยู"
 GER_establish_protectorates_in_america: "สถาปนารัฐในอารักขาในทวีปอเมริกา"
 GER_establish_protectorates_in_america_desc: "ประเทศตางๆ ในทวีปอเมริกาถูกปกครองดวยวิธีที่ไมสอดคลองกับอุดมคติของเรามานานเกินไป จําเปนตองมีการจัดระเบียบใหมเต็มรูปแบบเพื่อปรับปรุงดินแดนเหลานี้หลังจากถูกบริหารอยางยํ่าแยมาเปนเวลานาน"
 GER_demands_to_sweden: "ยื่นขอเรียกรองตอสวีเดน"
 GER_demands_to_sweden_desc: "เหมืองแรเหล็กทางตอนเหนือของ[SWE.GetNameDef]เปนทรัพยสินสําคัญยิ่งตออุตสาหกรรมการทหารของเรา เราไมอาจปลอยใหเปนเรื่องของโชคชะตาวาจะยังคาขายกับชาว[SWE.GetAdjective]ไดหรือไม เสนทางการคานี้ตองไดรับการรักษาใหมั่นคงโดยเร็วที่สุด"
 GER_the_swiss_gold: "ทองคําสวิส"
 GER_the_swiss_gold_desc: "เมื่อชาว[SWI.GetAdjective]ตัดสินใจอยูนอกความขัดแยงระดับโลกในตอนนี้ พวกเขาจึงเปนโอกาสอันดีเยี่ยมสําหรับการคาและการจารกรรม เราควรสงสายลับไปประจําในประเทศของพวกเขา และใชประโยชนจากพวกเขาอยางเต็มที่ในการเก็บรักษาทองคําที่เราไดมา"
 GER_secure_finland: "ยึดครองฟนแลนดไวใหมั่น"
 GER_secure_finland_desc: "[FIN.GetNameDefCap]มีพรมแดนทางบกยาวติดกับ[SOV.GetNameDef] การเขาถึงพรมแดนนี้จะเปดแนวรบอีกดานหนึ่งตอภัยแดงทางตะวันออกใหแกเรา และอาจมีคุณคายิ่งหากเราตองรบกับชาว[SOV.GetAdjective]"
 GER_befriend_china: "$GER_china_friend$"
 GER_befriend_china_desc: "$GER_china_friend_desc$"
 GER_befriend_japan: "$GER_japan_friend$"
 GER_befriend_japan_desc: "$GER_japan_friend_desc$"
 GER_reclaim_former_african_colonies: "ทวงคืนอาณานิคมเดิมในแอฟริกา"
 GER_reclaim_former_african_colonies_desc: "เอเชียไมใชที่เดียวที่เราเคยมีดินแดนแลวสูญเสียไป ดินแดนของเราในแอฟริกายังคงอยูในความสนใจ และเราควรพยายามอยางสุดกําลังเพื่อทวงคืนและผนวกรวมดินแดนเหลานั้นอีกครั้ง"
 GER_mittelafrika: "มิทเทิลอัฟริกา"
 GER_mittelafrika_desc: "ในแอฟริกามีดินแดนที่เราสนใจมากกวาที่เราเคยครอบครอง ดวยความมั่งคั่งทางธรรมชาติอันมหาศาล ภูมิภาคที่เราเรียกวามิทเทิลอัฟริกาจะเปนประโยชนอยางยิ่งตอ[ROOT.GetNameDef]"
 GER_mittelafrika_revive_the_schutztruppe_tt: "ปลดล็อกกองกําลังอาสาอาณานิคม§Yชุทซทรุพเพอ§! และการตัดสินใจเพื่อ§Yเกณฑ§!และ§Yพัฒนา§!พวกเขาใน§Yแอฟริกา§!"
 GER_asia_revive_the_schutztruppe_tt: "ปลดล็อกกองกําลังอาสาอาณานิคม§Yชุทซทรุพเพอ§! และการตัดสินใจเพื่อ§Yเกณฑ§!และ§Yพัฒนา§!พวกเขาใน§Yเอเชีย§!"
 GER_re_establish_german_control_over_qingdao: "ฟนการควบคุมชิงเตาของเยอรมนี"
 GER_re_establish_german_control_over_qingdao_desc: "ในป 1898 เราไดเจรจาเชาชิงเตา สัญญาเชานั้นถูกตัดจบลงในป 1914 จากการยึดครองของ[JAP.GetAdjective]ไมนานหลังเริ่มมหาสงคราม เมื่อพื้นที่นี้ไมไดอยูใตการยึดครองอีกตอไป บางทีถึงเวลาที่เราจะเตือนใหพวกเขานึกถึงขอตกลงนั้น"
 GER_claim_old_colonies_in_the_east: "อางสิทธิ์อาณานิคมเดิมในตะวันออก"
 GER_claim_old_colonies_in_the_east_desc: "สนธิสัญญาแวรซายริบอาณานิคมของเราไปและแบงใหชาติฝายสัมพันธมิตร ประชาชนของเราแสดงใหเห็นชัดวาพวกเขาคิดเชนเดียวกับเราวานี่เปนสิ่งที่ไมชอบธรรม ในการสรางความสัมพันธทางการทูตในตะวันออก เราควรพิจารณาพยายามทวงอาณานิคมของเราคืนดวย"
 GER_ally_chiang_kai_shek: "เปนพันธมิตรกับเจียง ไคเช็ก"
 GER_ally_chiang_kai_shek_desc: "กิจการของเราในเอเชียตะวันออกอาจเปนประโยชนไมใชแคกับเราเทานั้น การเปนพันธมิตรกับ [CHI.GetLeader] แหง[CHI.GetNameDef] และดึงเขามาอยูฝายเรา จะขยายเขตอิทธิพลของเราและเอื้อตอการเติบโตของอาณานิคมในภูมิภาคนี้"
 GER_japanese_naval_cooperation: "ความรวมมือทางนาวีกับญี่ปุน"
 GER_japanese_naval_cooperation_desc: "เรามีอะไรอีกมากที่ตองเรียนรูจากชาว[JAP.GetAdjective] โดยเฉพาะในเรื่องการทัพเรือ การรวมมือพัฒนาเทคโนโลยีจะทําใหเราใชความรูของกันและกันไดอยางคุมคาที่สุด และลดเวลาที่เสียไปกับการคิดคนสิ่งที่เราในฐานะกองกําลังรวมมีอยูแลวซํ้าอีก"
 GER_negotiate_old_colonies_in_the_east: "เจรจาอาณานิคมเดิมในตะวันออก"
 GER_negotiate_old_colonies_in_the_east_desc: "อาณานิคมหลายแหงของเราในเอเชียตะวันออกถูกชาว[JAP.GetAdjective]ยึดไปในชวงมหาสงคราม เมื่อขณะนี้เรากําลังปรับปรุงความสัมพันธทางการทูตอยางจริงจัง เราอาจทวงคืนอาณานิคมเหลานี้บางสวนไดดวยวิธีทางการทูต"
 GER_claim_old_colonies_in_the_east_tt: "สงเหตุการณถึง§Yสมาชิกฝาย§!และ§Y[CHI.GetNameWithFlag]§! เพื่อขอควบคุมอาณานิคม[GER.GetAdjective]เดิมใน§Yเอเชียตะวันออกเฉียงใต§! หากพวกเขาปฏิเสธ หรือดินแดนนั้นถูกควบคุมโดยประเทศที่เราไมถือวาเปนพันธมิตร จะไดรับ§Yการอางสิทธิ์§!ในรัฐที่มีขอพิพาท"
 GER_negotiate_old_colonies_in_the_east_tt: "รัฐตอไปนี้ที่พวกเขาควบคุมอยูจะถูกโอนมาใหเรา:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[1070.GetName]§!"
 GER_sentinels_of_the_pacific: "ผูพิทักษแหงแปซิฟก"
 GER_sentinels_of_the_pacific_desc: "ฐานที่มั่นของเราในแปซิฟกโดยรวมยังดอยพัฒนาและไมเหมาะที่จะใชงานทั้งสําหรับครีกสมารีเนอของเราเองหรือของพันธมิตร ตองทุมเทความพยายามอยางมากเพื่อสรางโครงสรางพื้นฐานทางนาวีที่เหมาะสมในพื้นที่สําคัญของแปซิฟก"
 GER_sentinels_of_the_pacific_tt: "ควบคุมทุกรัฐตอไปนี้: §Y\n[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
 GER_create_asian_reichskommissariat: "จัดตั้งไรชสคอมมิสซารีอาทในเอเชีย"
 GER_create_asian_reichskommissariat_desc: "อาณานิคมธรรมดามีประโยชนมากมาย แตทานผูนําของเรามีแผนการที่ยิ่งใหญกวานั้นสําหรับอาณานิคมของเราในเอเชีย การบังคับใชกฎหมายอาณานิคมของทานจะเปนประโยชนตอทุกฝายที่เกี่ยวของ!"
 GER_south_east_asian_natural_wealth: "ความมั่งคั่งทางธรรมชาติแหงเอเชียตะวันออกเฉียงใต"
 GER_south_east_asian_natural_wealth_desc: "ภูมิภาคเอเชียตะวันออกเฉียงใตอุดมไปดวยทรัพยากรธรรมชาติที่จะเปนประโยชนตอเราอยางมาก เจาของในปจจุบันไมไดพัฒนาดินแดนเหลานี้อยางเหมาะสม และแมดินแดนเหลานี้ไมเคยเปนของเรา แตความคิดเชนนั้นก็ไมไดหยุดสิ่งที่เรียกวาประชาธิปไตยจากการขโมยอาณานิคมที่ชอบธรรมของเรา และมันก็จะไมหยุดเราเชนกัน!"
 GER_south_east_asian_natural_wealth_tt: "ปลดล็อก§Yการตัดสินใจบนแผนที่§!เพื่อพัฒนาดินแดนเอเชียตะวันออกเฉียงใตของเรา"
 GER_the_proud_eagle_and_the_resurgent_dragon: "อินทรีผูทระนงและมังกรผูผงาด"
 GER_the_proud_eagle_and_the_resurgent_dragon_desc: "ภัยคุกคามจากการรุกรานของ[JAP.GetAdjective]ตอมิตรของเราใน[CHI.GetNameDef]แขวนอยูเหนือหัวเรามาตลอด การรอใหพวกเขาโจมตีอยางเฉยเมยไมมีประโยชนอันใด เราตองเตรียมทําสงครามกับนักรบแหง[JAP.GetNameDef] ไมวาจะบนดินแดนของเราหรือของพวกเขา"
 GER_blitzkrieg_across_the_pacific: "สายฟาแลบขามแปซิฟก"
 GER_blitzkrieg_across_the_pacific_desc: "การทําสงครามในแปซิฟกแตกตางจากสิ่งที่ทหารของเราไดรับการฝกมาเปนสวนใหญ อีกทั้งยุทธวิธีของเราอาจตองปรับแตงบาง เราไมเชื่อวานี่คือจุดออน แตกลับคิดวามันทําใหเราแข็งแกรงขึ้น แนวปองกันของศัตรูสรางขึ้นจากสิ่งที่พวกเขารู และดวยการคิดคนวิธีทําสงครามแบบใหมในแปซิฟก เราจะจูโจมพวกเขาไดอยางไมทันตั้งตัว"
