 GER_befriend_turkey: "$GER_turkey_friend$"
 GER_befriend_turkey_desc: "$GER_turkey_friend_desc$"
 GER_influence_the_middle_east: "แผอิทธิพลสูตะวันออกกลาง"
 GER_influence_the_middle_east_desc: "แมในอดีตเราจะมีความเกี่ยวของกับตะวันออกกลางเพียงเล็กนอย แตไมมีใครปฏิเสธไดวาภูมิภาคนี้อยูในความสนใจของเรา เราควรแผอิทธิพลในภูมิภาคนี้เพื่อใหแนใจวาเรามีนํ้าหนักทางการทูตอยูบาง หากมีความจําเปน"
 GER_the_final_blow_to_communism: "การโจมตีครั้งสุดทายตอคอมมิวนิสต"
 GER_the_final_blow_to_communism_desc: "การจัดการกับ[SOV.GetNameDef]ไมอาจเปนจุดจบของสงครามครูเสดตอตานคอมมิวนิสตในยุโรปของเรา ตราบใดที่ยังมีชาติคอมมิวนิสตอยูใกลเรา เราตองสูตอไป เราจะไมหยุดพักจนกวาภัยแดงจะถูกถอนรากถอนโคนจนสิ้น!"
 GER_war_against_communism_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yคอมมิวนิสต§!ใดก็ไดในโลก เปาหมายปจจุบัน:"
 GER_war_against_european_communism_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yคอมมิวนิสต§!ใดก็ไดใน§Yยุโรป§! เปาหมายปจจุบัน:"
 GER_crossing_the_atlantic_dockyards_tt: "เพิ่ม §Y$dockyard$ 2 แหง§! ในรัฐชายฝงยุโรปที่ [ROOT.GetNameWithFlag] ควบคุมอยางสมบูรณ โดยลด §Y$arms_factory$ 1 แหง§! ตออูตอเรือที่สรางแตละแหง \n(ผลจะมีตอรัฐไมเกิน [?crossing_the_atlantic_max_states_for_dockyards|Y0] รัฐ โดยใหความสําคัญกับรัฐชายฝงที่มี $arms_factory$ อยางนอยหนึ่งแหง)"

 #INNER CIRCLE
 GER_inner_circle_member_title: "ไรชสไลเทอร"
 GER_ascension_of_todt: "$GER_inner_circle_member_title$ ท็อดท"
 GER_ascension_of_todt_desc: "ในฐานะวิศวกรผูเชี่ยวชาญที่มีประสบการณทางทหาร ฟริทซ ท็อดทไดพิสูจนแลววาเปนที่ปรึกษาที่มีความสามารถของทานผูนํา หากไดรับอิสระในการทํางานพอสมควร เราเชื่อวาเขาจะเปนประโยชนอยางมากตอ[ROOT.GetNameDef]"
 GER_ascension_of_speer: "$GER_inner_circle_member_title$ ชเปยร"
 GER_ascension_of_speer_desc: "ในฐานะสถาปนิกที่ผานการฝกฝน อัลแบรท ชเปยรมีทักษะที่มีคายิ่งตอความเจริญรุงเรืองของประเทศ การใหอิสระในการทํางานแกเขาพอสมควรจะทําใหเราไดประโยชนทั้งจากทักษะของเขาและจากสายสัมพันธที่เขามีกับผูเลนรายใหญในอุตสาหกรรมกอสรางของ[ROOT.GetAdjective]"
 GER_ascension_of_goring: "$GER_inner_circle_member_title$ เกอริง"
 GER_ascension_of_goring_desc: "ผูบัญชาการที่มีความสามารถยอมมีที่ทางในวงในของทานผูนํา และเนื่องจากแฮรมันน เกอริงไมเพียงเปนผูบัญชาการที่เกงกาจ แตยังเปนผูรวมงานของทานผูนํามายาวนาน การใหอิสระในการทํางานแกเขาพอสมควรจึงนาจะมีความเสี่ยงนอยแตไดผลตอบแทนมาก"
 GER_ascension_of_goebbels: "$GER_inner_circle_member_title$ เกิบเบลส"
 GER_ascension_of_goebbels_desc: "ทานผูนํามีที่วางในวงในสุดเสมอสําหรับผูที่ชวยรักษาการสนับสนุนจากประชาชนได ในฐานะผูติดตามใกลชิดและนักพูดตอสาธารณะที่มีฝมือ การใหอิสระในการทํางานแกโยเซฟ เกิบเบลสพอสมควรนาจะเปนประโยชนตอเราอยางยิ่ง"
 GER_rally_the_industrialists: "รวบรวมนักอุตสาหกรรม"
 GER_rally_the_industrialists_desc: "นักอุตสาหกรรมมีอํานาจอยางมากในประเทศของเรา การดึงพวกเขามาอยูฝายเราตองลงทุนเวลา แตรูดอลฟ เฮสสรับรองกับเราวามันคุมคา"
 GER_glorify_party_rallies: "เชิดชูการชุมนุมของพรรค"
 GER_glorify_party_rallies_desc: "หากปราศจากแกนกลางทางการเมือง ประเทศจะสั่นคลอน มารทีน บอรมันนไดชี้ใหเห็นวาการชุมนุมของพรรคสามารถปรับปรุงเพื่อเรียกการสนับสนุนจากสาธารณชนไดมากขึ้น ซึ่งจะทําใหเรามีอิสระมากขึ้นในการจัดองคประกอบของรัฐบาล"
 GER_total_control_over_domestic_affairs: "ควบคุมกิจการภายในโดยสมบูรณ"
 GER_total_control_over_domestic_affairs_desc: "การปลอยมือจากกิจการภายในทั้งหมดใหหัวหนาสํานักงานพรรคดูแลอาจดูเปนการตัดสินใจที่กลาหาญ แตทานผูนํามั่นใจ หนาที่ที่หัวหนาสํานักงานพรรคปฏิบัติมาจนถึงตอนนี้ลวนเกินความคาดหมาย และ [ROOT.GetLeader] ก็วางใจที่จะมอบเรื่องนี้ใหเขา เพื่อมุงไปที่เรื่องสําคัญกวา"
 GER_fuhrerprinzip_inner_circle_tt: "เปดใชงานระบบ§Yวงใน§!\n\n"
 GER_rally_the_industrialists_hess_tt: "จะปองกันไมใหชุดเหตุการณ §Y$germany.107.t$§! เกิดขึ้น"
 GER_wunderwaffe_dornberger_trait_tt: "§Y$GER_walter_dornberger$§! ($high_command$): \nแทนที่คุณลักษณะ §Y$GER_head_of_the_missile_department$§! ดวย §Y$GER_head_of_experimental_weapons$§! \nการเปลี่ยนแปลงที่มีผล: \nการใชเสบียงของสถานที่: §G-10.00§! \n$specialization_naval_speed_factor$: §G+10%§! \n$specialization_nuclear_speed_factor$: §G+10%§!"
