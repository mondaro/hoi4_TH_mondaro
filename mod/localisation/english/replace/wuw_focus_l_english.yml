 GER_a_strong_successor_trigger_tt: "ที่ปรึกษาผูกาวขึ้นสูอํานาจทั้ง §Y3§! คนใน§Yวงใน§!ไดทําแผนยุทธศาสตรสุดทายของตนสําเร็จแลว"
