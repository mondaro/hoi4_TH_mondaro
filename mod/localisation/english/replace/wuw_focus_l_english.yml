l_english:

 ### AUSTRO-HUNGARIAN JOINT FOCUS TREE ###

 HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt: "เปน§Y[AUS.GetNameDef]§!หรือ§Y[HUN.GetNameDef]§! และมี§Yรัฐรวมออสเตรีย-ฮังการี§!ใดก็ไดเปนรัฐในอารักขา หรือเปนรัฐในอารักขาของหนึ่งในสองประเทศนั้น หรือเปนผูนําฝายในฐานะ§Y[AUS.GetNameDef]§!หรือ§Y[HUN.GetNameDef]§! หรืออยูในฝายเดียวกับพวกเขาในฐานะ§Yรัฐรวมออสเตรีย-ฮังการี§!ใดก็ได"

 HABSBURG_is_originator_country: "§Y[ROOT.GetName]§! เปน§Yประเทศผูริเริ่ม§!"
 
 HABSBURG_part_of_something_bigger: "ไมอาจแบงแยก ไมอาจพรากจาก"
 HABSBURG_part_of_something_bigger_desc: "ทุกคนรูดีวาตองปกปองบานของตนเอง แตสหพันธที่เพิ่งกอตั้งของเราจะลมสลายแนนอน หากพวกเขาไมตระหนักถึงความสําคัญของความรวมมือขามพรมแดน และการชวยกันปกปองสิ่งที่มีคาตอเพื่อนบานดวยเชนกัน"

 HABSBURG_economic_cooperation_policy: "นโยบายความรวมมือทางเศรษฐกิจ"
 HABSBURG_economic_cooperation_policy_desc: "ขณะนี้สมาชิกสหพันธของเราบริหารเศรษฐกิจของตนเองโดยสมบูรณ แมสิ่งนี้จะใหอิสระแกทุกฝายมากที่สุดเทาที่จะเปนไปได แตก็เปนอุปสรรคตอพลังทางเศรษฐกิจของสหพันธดวย การวางนโยบายความรวมมือจะชวยใหมั่นใจวาสมาชิกจะทํางานรวมกันเมื่อเผชิญปญหาเศรษฐกิจที่ใหญกวา"

 HABSBURG_joint_consumer_goods_endeavors: "ธนาคารกลางแหงดานูบ"
 HABSBURG_joint_consumer_goods_endeavors_desc: "ศักยภาพทางเศรษฐกิจของแตละรัฐในสหพันธแตกตางกันอยางมาก ธนาคารกลางของเราก็มีพลังทางเศรษฐกิจแตกตางกันมากเชนกัน และแมทุกประเทศควรไดรับอนุญาตใหคงธนาคารกลางของตนไว การจัดตั้งธนาคารกลางสําหรับสหพันธจะชวยใหเรามีหนวยงานที่ดูแลสถานะทางเศรษฐกิจโดยรวมของสหพันธเปนหลัก"

 HABSBURG_technology_sharing: "ความรวมมือทางวิทยาศาสตร"
 HABSBURG_technology_sharing_desc: "มีนักคิดหัวกะทิมากมายในสหพันธของเรา เราตองรวมพวกเขาเขาดวยกันเพื่อพัฒนาภูมิภาคของเรา และนําสหพันธกาวสูอนาคตที่สมควรไดรับ"

 HABSBURG_increase_scientific_cooperation: "จัดตั้งสถาบันวิจัยรวม"
 HABSBURG_increase_scientific_cooperation_desc: "ถึงเวลาแลวที่จะรวมกันใหทุนหองปฏิบัติการใหมและสถาบันวิจัยลับ ที่ซึ่งนักวิทยาศาสตรของเราจะรวมมือกันไดใกลชิดยิ่งขึ้น เพิ่มความเร็วการวิจัย และนําเราไปสูขอบฟาใหม"

 HABSBURG_simplify_economic_lawmaking: "ปรับกระบวนการออกกฎหมายเศรษฐกิจใหเรียบงาย"
 HABSBURG_simplify_economic_lawmaking_desc: "ขณะนี้สมาชิกของเรามีกฎหมายดานการคาและเศรษฐกิจที่แตกตางกันอยางสุดขั้ว แมจะไมจําเปนตองควบคุมจากสวนกลางใหกฎหมายเหมือนกันในทุกประเทศสมาชิก แตกระบวนการปรับเปลี่ยนกฎหมายอยางยืดหยุนตามความจําเปนของสถานการณก็จะไดประโยชนหากทําใหคลองตัวขึ้น"

 HABSBURG_securing_the_consumer_rights: "ความรุงเรืองเพื่อประชาชน"
 HABSBURG_securing_the_consumer_rights_desc: "แมผูสนับสนุนสงครามจะมีอยูทุกหนแหง แตเราตองจําไววาใครที่ทําใหสหพันธนี้เกิดขึ้นได นั่นคือประชาชน และดวยเหตุนี้เราตองดูแลใหพวกเขาพึงพอใจกับสถานการณที่เปนอยูเสมอ"

 HABSBURG_discounted_licenses: "ทําสัญญาอาวุธที่เปนประโยชน"
 HABSBURG_discounted_licenses_desc: "เราอาจไมมีอาวุธที่ทันสมัยที่สุด แตนั่นไมใชปญหา เพราะนักการเมืองของเรามีเสนสายกับผูคนที่ชวยใหเราเขาถึงเทคโนโลยีตางชาติไดดีขึ้นเพื่อนํามาผลิตในโรงงานของเราเอง ดวยการใชเครือขายกวางขวางนี้ เราจะไดสิทธิ์การผลิตยุทโธปกรณที่ดีที่สุด และดวยการใชประโยชนจากอุตสาหกรรมอันกวางใหญของเรา กองทหารของเราจะไดยุทโธปกรณที่เหนือกวา"

 HABSBURG_reform_gemeinsame_armee: "ปฏิรูปกองทัพรวม"
 HABSBURG_reform_gemeinsame_armee_desc: "ในอดีต จักรวรรดิออสเตรีย-ฮังการีมีกองทัพรวมขนาดใหญ ซึ่งทุกประเทศตางมีสวนรวมเพื่ออุดมการณรวมกันของเรา ไมวาความแตกตางและความคลายคลึงทางอุดมการณในปจจุบันจะเปนอยางไร ความรวมมือทางทหารจะมีแตทําใหเราแข็งแกรงขึ้น"

 HABSBURG_motorizing_the_armies: "ปรับกองทัพเปนยานยนต"
 HABSBURG_motorizing_the_armies_desc: "สงครามสมัยใหมอาจยังเปนเรื่องของการรุกของทหารราบ แตถึงจะเปนเชนนั้น เราก็ควรทําใหทหารราบเคลื่อนที่จากจุดหนึ่งของสหพันธไปยังอีกจุดหนึ่งไดรวดเร็วและมีประสิทธิภาพที่สุด การริเริ่มปรับเปนยานยนตเพื่อขนสงทหารดวยรถบรรทุกมากขึ้น จะทําใหมั่นใจวากองทหารของเราจะไปถึงที่ที่ตองการไดทันเวลาเสมอ"

 HABSBURG_mechanized_initiative: "โครงการยานเกราะลําเลียงพล"
 HABSBURG_mechanized_initiative_desc: "มีนักวิทยาศาสตรที่เริ่มหารือถึงทางเลือกของรถกึ่งสายพาน ซึ่งสามารถลําเลียงทหารและติดเกราะไดหนากวา ทางเลือกนี้นาจะถูกกวารถถัง แตแข็งแรงกวารถบรรทุก และรับมือกับภูมิประเทศที่ยากลําบากไดดีกวา บางทีเราควรใหทุนสนับสนุนโครงการนี้"

 HABSBURG_armor_initiative: "โครงการยานเกราะ"
 HABSBURG_armor_initiative_desc: "อนาคตของสงครามจะถูกตัดสินดวยยานเกราะ เชนเดียวกับตอนจบของมหาสงครามที่ผูมากอนเราพายแพ เราตองชดเชยความผิดพลาดเหลานั้น และทุมเทใหกับเรื่องนี้ มิฉะนั้นเราจะลมสลายอีกครั้ง"

 HABSBURG_effectivizing_the_motorized_troops: "ใชเชื้อเพลิงอยางมีประสิทธิภาพ"
 HABSBURG_effectivizing_the_motorized_troops_desc: "การใชเชื้อเพลิงของเราพุงสูงขึ้นอยางมากเมื่อเรานําหนวยยานยนต ยานเกราะลําเลียงพล และยานเกราะเขามาในกองทัพมากขึ้น เชื้อเพลิงกลายเปนคอขวดที่นากังวลที่สุด ซึ่งบั่นทอนศักยภาพทางทหารของเรา เราควรหาทางปรับปรุงการใชเชื้อเพลิง ซึ่งจะเปนประโยชนตอเราทั้งดานการทหารและเศรษฐกิจ"

 HABSBURG_the_strength_of_the_common_man: "พลังของสามัญชน"
 HABSBURG_the_strength_of_the_common_man_desc: "แมแตองคกรที่ใหญที่สุดก็ยังตองพึ่งพาชิ้นสวนที่เล็กที่สุด สําหรับเรา และโดยเฉพาะกองทัพของเรา นั่นหมายถึงการพึ่งพาสามัญชน ซึ่งก็คือทหารของเรา เราตองทําใหทหารทุกนายในองคกรทางทหารของเราเขาใจทั้งภาระที่อยูบนบาของเขา และเขาใจวาเขามีพละกําลังที่จะแบกรับมัน และนั่นคือหนาที่ของเขา"

 HABSBURG_joint_training_initiative: "กระทรวงการสงครามแหงจักรวรรดิและราชอาณาจักร"
 HABSBURG_joint_training_initiative_desc: "ในอดีต กองทัพรวมถูกบริหารโดยกระทรวงที่กําหนดไวโดยเฉพาะ เมื่อมองยอนกลับไป กระทรวงนั้นบริหารงานไดแยและไมรูวาเกิดอะไรขึ้นในสนามรบ อยางไรก็ตาม แนวคิดนั้นถูกตอง หากเราจะปฏิบัติการรวมกัน การวางแผนและการจัดระเบียบของเราก็ตองบริหารรวมกันดวย"

 HABSBURG_organizational_exercises: "การฝกจัดระเบียบรวม"
 HABSBURG_organizational_exercises_desc: "การดําเนินกลยุทธจะเปนตัวตัดสินสงครามในอนาคต เมื่อสงครามดําเนินไปดวยความเร็วที่สูงขึ้นเรื่อย ๆ ความตองการความเร็วสูงและการจัดระเบียบที่ไรที่ติก็เพิ่มขึ้น อํานาจการยิงมากเพียงใดก็ชวยเราไมได หากกองทหารของเราไมรูวิธีเคลื่อนที่อยางรวดเร็วโดยไมหลงเปาหมาย เมื่อกองทัพของเราขยายตัวจนรวมผูคนหลายเชื้อชาติ จึงตองพยายามประสานงานและจัดระเบียบกองทหารของเรา"

 HABSBURG_meeting_the_logistical_challenge: "รับมือความทาทายดานการสงกําลังบํารุง"
 HABSBURG_meeting_the_logistical_challenge_desc: "ความทาทายดานการสงกําลังบํารุงเพิ่มขึ้นไปพรอมกับการขยายตัวของสหพันธ เสบียงใชเวลานานขึ้นกวาจะถึงกองทหาร และเรากังวลวาหากปลอยไว เรื่องนี้อาจกลายเปนปญหาในอนาคต กองทหารของเราตองไดรับการฝกใหทําไดมากขึ้นดวยทรัพยากรที่นอยลง และตองปรับปรุงการแจกจายเสบียงใหกองทหาร"

 HABSBURG_bring_back_royal_and_imperial_hussars: "ฟนฟูทหารมาฮุสซารแหงราชอาณาจักรและจักรวรรดิ"
 HABSBURG_bring_back_royal_and_imperial_hussars_desc: "ในอดีต จักรวรรดิออสเตรีย-ฮังการีมีทหารมาฮุสซารแหงราชอาณาจักรและจักรวรรดิ จิตวิญญาณของฮุสซารยังคงอยูจนถึงทุกวันนี้ แมหนวยฮุสซารสวนใหญจะถูกยุบไปนานแลวก็ตาม หนวยที่ไดรับความเคารพทั้งจากประชาชนของเราและจากศัตรูเชนนี้ จะเปนประโยชนอยางยิ่งตอเราแมในยุคปจจุบัน"

 HABSBURG_defensive_hussars: "ยึดแบบฮุสซารฮังการี"
 HABSBURG_defensive_hussars_desc: "กองกําลังฮุสซารที่ฟนคืนชีพของเราตองผานการปรับเปลี่ยนบางอยางเพื่อใหเขากับกองทัพที่ทันสมัยขึ้นไดอยางราบรื่น ทหารมาเบาฮังการีในปจจุบัน ซึ่งเปนรูปแบบฮุสซารสมัยใหมของพวกเขา ควรเปนตนแบบในการสรางกองทัพฮุสซารใหมของเรา ดวยการใชประสบการณของพวกเขา และมุงมั่นใหไดความคลองตัวและความเร็วแบบเดียวกัน เราจะสรางกองกําลังที่ใครก็ตองเกรงขามได"

 HABSBURG_offensive_hussars: "ยึดแบบฮุสซารโปแลนด"
 HABSBURG_offensive_hussars_desc: "กองกําลังฮุสซารที่ฟนคืนชีพของเราตองผานการปรับเปลี่ยนบางอยางเพื่อใหเขากับกองทัพที่ทันสมัยขึ้นไดอยางราบรื่น ทหารมาหนักโปแลนดในปจจุบัน หรือฮุสซารมีปกของพวกเขา ไดสรางทั้งความหวาดกลัวและความเคารพในใจของศัตรู เมื่อคํานึงถึงสิ่งเหลานี้ ก็ชัดเจนยิ่งวาฮุสซารของเราควรปฏิบัติการตามแบบเดียวกัน"

 HABSBURG_the_modern_hussar: "ฮุสซารสมัยใหม"
 HABSBURG_the_modern_hussar_desc: "กาลเวลาไมรอใคร แมแตฮุสซารผูกลาหาญของเรา แมชายผูกลาเหลานี้จะยังคงเปนกําลังสําคัญของกองทัพรวม แตเราตองปรับนิยามของฮุสซารใหทันสมัย อนาคตของฮุสซารอันเปนที่เคารพของเราอาจไมไดอยูบนหลังมาเสมอไป แตนั่นไมสําคัญ สิ่งสําคัญคือจิตวิญญาณของฮุสซารยังคงอยู!"

 HABSBURG_for_the_glory_of_the_empire: "เพื่อเกียรติยศแหงอาณาจักร"
 HABSBURG_for_the_glory_of_the_empire_desc: "เมื่อกองทัพของเราถือวากลับมาอยูในระดับที่นาพอใจแลว ก็ถึงเวลาปลูกฝงสํานึกในหนาที่ตอชาติใหแกพลเมือง เพื่อใหพวกเขาตระหนักวาพวกเขาคือผูปกปองบานของทุกคนจากศัตรู"

 HABSBURG_joint_industry_spirit: "การวางแผนอุตสาหกรรมรวม"
 HABSBURG_joint_industry_spirit_desc: "ทุกประเทศในสหพันธของเราตองทําหนาที่ของตนในดานอุตสาหกรรม แตขณะนี้เราตางดําเนินงานตามแผนที่แตกตางกัน ซึ่งกอใหเกิดความยุงยากเมื่อความรวมมือที่กวางขวางขึ้นกําลังกอตัว การวางแผนงานอุตสาหกรรมรวมกันจะชวยใหเราไดประสิทธิภาพสูงสุด"

 HABSBURG_supplying_the_federation: "สงกําลังบํารุงใหสหพันธ"
 HABSBURG_supplying_the_federation_desc: "เมื่อสหพันธของเราขยายตัว เครือขายเสบียงและทางรถไฟก็ตองขยายตามไปดวย เราตองลงมือ มิฉะนั้นเราเสี่ยงที่จะเติบโตเกินกวาโครงสรางพื้นฐานของตนเอง และตองประสบความลมสลายที่ทั้งเจ็บปวดและนาอับอาย"

 HABSBURG_optimizing_the_land_usage: "ใชที่ดินอยางเหมาะสมที่สุด"
 HABSBURG_optimizing_the_land_usage_desc: "เมื่อมีหลายประเทศดําเนินงานรวมกันในสหพันธ ก็ไมนาแปลกใจที่การใชที่ดินของเราจะยังไมสมบูรณแบบเลย ดวยการรวบรวมความรูวาจะใชประโยชนจากพื้นที่อุตสาหกรรมใหดีที่สุดไดอยางไร เรานาจะปรับปรุงวิธีสรางโรงงานใหเหมาะสมที่สุดได"

 HABSBURG_joint_ventures_in_resource_extraction: "รวมทุนในการขุดทรัพยากร"
 HABSBURG_joint_ventures_in_resource_extraction_desc: "เปนเรื่องหลีกเลี่ยงไมไดที่ทรัพยากรบางสวนจะถูกมองขามหรือไมไดถูกขุดขึ้นมาดวยเหตุผลอื่น ซึ่งมักเกี่ยวกับเศรษฐกิจหรือเวลา หรือทั้งสองอยาง แตบัดนี้เมื่อทรัพยากรทั้งหมดรวมอยูภายใตสหพันธแลว เราจึงใชประโยชนจากเศรษฐกิจที่ใหญขึ้นและความรูที่กวางขวางขึ้นวาจะขุดทรัพยากรเหลานี้อยางไรใหดีที่สุดได!"

 HABSBURG_industrializing_our_capitals: "พัฒนาอุตสาหกรรมในเมืองหลวง"
 HABSBURG_industrializing_our_capitals_desc: "เมืองหลวงสวนใหญในสหพันธของเราเปนเมืองเกาแกทางประวัติศาสตร แมนี่จะเปนเรื่องดีและบงบอกถึงประวัติศาสตรอันยาวนานและแข็งแกรงของสมาชิก แตในดานอุตสาหกรรมก็ยังทําใหเราตองการมากกวานี้ การรวมกันพัฒนาอุตสาหกรรมในเมืองเหลานี้ใหมากขึ้นอาจเปนประโยชนอยางยิ่ง"

 HABSBURG_specializing_in_civilian_logistics: "มุงเนนการสงกําลังบํารุงพลเรือน"
 HABSBURG_specializing_in_civilian_logistics_desc: "การหมุนเวียนเครื่องมือและอุปกรณทั่วสหพันธไดรับผลกระทบจากโครงสรางพื้นฐานที่ยํ่าแยและเจาของโรงงานที่ทุจริต เราตองใหความสําคัญกับภาคสวนนี้อยางมากและปรับปรุงใหเร็วที่สุด"

 HABSBURG_specializing_in_the_arms_industry: "มุงเนนอุตสาหกรรมอาวุธ"
 HABSBURG_specializing_in_the_arms_industry_desc: "หากเราตองการแขงขันกับยักษใหญอยาง[GER.GetAdjective], [SOV.GetAdjective], [ENG.GetAdjective] หรือ[FRA.GetAdjective] เราตองขยายอุตสาหกรรมทางทหารอยางมหาศาล!"

 HABSBURG_industrial_effectivization: "เพิ่มประสิทธิภาพอุตสาหกรรม"
 HABSBURG_industrial_effectivization_desc: "โรงงานของเราตองทํางานไดไมเพียงแคในยามสงคราม แตแนนอนวาตองทํางานในยามสงบดวย ในโลกที่สมบูรณแบบ อยางหลังจะสําคัญกวาอยางแรกมาก แตนาเสียดายที่โลกนี้ไมสมบูรณแบบ อยางไรก็ตาม เราก็ยังละเลยงานอุตสาหกรรมในยามสงบไมได"

 HABSBURG_reinforced_industry: "เสริมความแข็งแกรงใหอุตสาหกรรม"
 HABSBURG_reinforced_industry_desc: "แมการที่โรงงานของเราดําเนินงานไดในยามสงบจะเปนเรื่องสําคัญ แตตอนนี้ไมใชเวลาจัดการเรื่องนั้น ภาคอุตสาหกรรมของเราตองทนทานตอสงครามที่เกิดขึ้นบนแผนดินของเราเองได และกอนที่จะทําไดสําเร็จ เราไมมีเวลาไปคิดถึงการดําเนินงานในยามสงบ"

 HABSBURG_improved_production_methods: "ปรับปรุงวิธีการผลิต"
 HABSBURG_improved_production_methods_desc: "เมื่ออุตสาหกรรมของเรารวมมือกันอยางมีประสิทธิภาพแลว เราจึงมุงปรับปรุงวิธีการผลิต เพื่อดึงพลังและศักยภาพที่แทจริงของประชาชนและความวิริยะของพวกเขาออกมาใช"

 HABSBURG_call_the_imperial_diet: "เรียกประชุมสภาจักรวรรดิ"
 HABSBURG_call_the_imperial_diet_desc: "ในที่สุดก็ถึงเวลาเรียกประชุมสภาจักรวรรดิอีกครั้ง สําหรับเราในฐานะผูนําของสหพันธนี้ วิสัยทัศนของสหพันธนั้นชัดเจนมาโดยตลอด ความทะเยอทะยานคือการรวมจักรวรรดิกลับคืนมาเสมอ และถึงเวลาแลวที่เราจะไลตามมัน"

 HABSBURG_united_in_the_face_of_danger: "สามัคคีเมื่อเผชิญภัย"
 HABSBURG_united_in_the_face_of_danger_desc: "ความตายหรือความอัปยศ ประชาชนของเรารูเรื่องนี้ดี เราจะยืนหยัดเปนหนึ่งเดียวอยางสมบูรณตอภัยคุกคามใด ๆ ที่อาจลุกขึ้นตอตานเรา!"

 HABSBURG_an_empire_not_just_in_name: "สหพันธพันป"
 HABSBURG_an_empire_not_just_in_name_desc: "สหพันธของเราจะยืนหยัดอยูไดนับพันปอยางแทจริง และไมมีสิ่งใดขวางเรากับอนาคตของเราไดอีกแลว จงรูไววาภูมิภาคดานูบคือดินแดนที่มั่งคั่งและนาเกรงขามที่สุดในโลก!"
 HABSBURG_an_empire_not_just_in_name_no_puppets_tt: "รัฐในอารักขาทั้งหมดที่มี§Yผังยุทธศาสตรรวม§!นี้จะไดรับ:"

 HABSBURG_joint_ft_unlock_tt: "ปลดล็อก§Yผังยุทธศาสตรรวม§!ออสเตรีย-ฮังการี"

