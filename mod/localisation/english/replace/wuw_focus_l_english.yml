 wuw_HUN_economic_intervention: "การแทรกแซงทางเศรษฐกิจ"
 wuw_HUN_economic_intervention_desc: "เราตองทุมทรัพยากรทางการเมืองอยางเพียงพอเพื่อกํากับเศรษฐกิจของเรา แมมันจะอยูในระดับที่พอใชได แตเรายังทําใหแข็งแกรงและมีประสิทธิภาพมากกวานี้ได"

 wuw_HUN_avoid_interventionalist_destablilization: "หลีกเลี่ยงความไรเสถียรภาพจากการแทรกแซง"
 wuw_HUN_avoid_interventionalist_destablilization_desc: "เราตองใชทรัพยากรที่มีอยูใหเกิดประโยชนสูงสุด งบประมาณที่วางแผนอยางดีและสมดุลคือกุญแจสูความสําเร็จของรัฐบาลเรา"

 wuw_HUN_secret_rearmament: "การเสริมกําลังอาวุธอยางลับ ๆ"
 wuw_HUN_secret_rearmament_desc: "ขอจํากัดที่สนธิสัญญาทรียานงบังคับใชกับเราหามไมใหเราขยายขนาดกองทัพ ถึงกระนั้น บรรยากาศทางการเมืองของโลกกําลังปนปวนยิ่งขึ้นทุกที และความขัดแยงก็ใกลเขามาทุกขณะ เราจะปลอยตัวเองใหไรการปองกันไมได และตองเริ่มเสริมกําลังอาวุธ แมจะหมายถึงการละเมิดขอกําหนดของสนธิสัญญาสันติภาพที่ถูกบังคับใชกับเราหลังมหาสงครามอยางลับ ๆ ก็ตาม"

 wuw_HUN_forcefully_revitalize_the_industries: "ฟนฟูอุตสาหกรรมอยางเรงรัด"
 wuw_HUN_forcefully_revitalize_the_industries_desc: "เราตองกระตุนอุตสาหกรรมของชาติอยางแรง ปลุกใหตื่นขึ้นเพื่อฟนตัวจากภาวะเศรษฐกิจตกตํ่า สิ่งนี้อาจกระทบเศรษฐกิจของเราในระหวางนี้ แตจะเปนการลงทุนที่คุมคาเพื่ออนาคตของชาติอยางแนนอน"

 wuw_HUN_reintigrate_the_imperial_railroads: "รวมเครือขายทางรถไฟจักรวรรดิกลับคืน"
 wuw_HUN_reintigrate_the_imperial_railroads_desc: "เครือขายทางรถไฟที่ครอบคลุมจักรวรรดิออสเตรีย-ฮังการีเดิมไดแตกออกเปนสวน ๆ นับตั้งแตจักรวรรดิลมสลายเปนชาติเอกราชตาง ๆ เราควรติดตอรัฐองคประกอบเดิมอื่น ๆ และเสนอใหรวมเครือขายทางรถไฟกลับคืน เพื่อปรับปรุงโครงสรางพื้นฐานโดยรวม"

 wuw_HUN_promote_increased_urbanization: "สงเสริมการขยายตัวของเมือง"
 wuw_HUN_promote_increased_urbanization_desc: "ผูคนจํานวนมากขึ้นเรื่อย ๆ ละทิ้งหมูบานและเมืองเล็ก ๆ เพื่อยายเขาสูศูนยกลางเมืองใหญ มองหางานในโรงงานแหงใหม แมเราจะยังไมอาจเสนองานใหพวกเขาไดทันที แตเราก็สรางยานเมืองใหมเพื่อเตรียมทางสําหรับการขยายตัวในภายหลังได"

 wuw_HUN_expand_the_ganz_muvek: "ขยายกานซ มือเว็ก"
 wuw_HUN_expand_the_ganz_muvek_desc: "โรงหลอมเหล็กและโรงงานเครื่องจักรกานซแอนดพารทเนอรควรไดรับการขยาย และดูดซับอุตสาหกรรมขนาดเล็กตาง ๆ เขามา เพื่อรวมศูนยขีดความสามารถทางอุตสาหกรรมของเราใหดีขึ้น และจัดสรรเงินทุนเพื่อพัฒนาอุตสาหกรรมในอนาคตไดดียิ่งขึ้น"

 wuw_HUN_devalue_the_pengo: "ปรับคาเงินเปงเง"
 wuw_HUN_devalue_the_pengo_desc: "ขณะนี้เงินเปงเงอยูในสภาพยํ่าแยอยางยิ่ง เปนหนึ่งในกรณีภาวะเงินเฟอรุนแรงที่เลวรายที่สุดในประวัติศาสตร เราตองใชมาตรการเด็ดขาดเพื่อปรับคาและเสริมความแข็งแกรงใหสกุลเงิน แมมาตรการเหลานั้นจะไมเปนที่นิยมเลยก็ตาม"

 wuw_HUN_announce_the_gyor_program: "ประกาศโครงการเจอร"
 wuw_HUN_announce_the_gyor_program_desc: "กองทัพของเราออนแออยางนาอันตราย และจําเปนอยางยิ่งที่เราตองเพิ่มขนาดและขีดความสามารถในการรบ เพื่อการนี้ เราตองเสริมอุตสาหกรรมอยางมาก เพื่อใหทันกับความตองการยุทโธปกรณที่เพิ่มขึ้น โครงการเจอรระยะหาปจะเพิ่มการใชจายของรัฐบาลไมเพียงแคในกองทัพ แตยังรวมถึงภาคสวนสนับสนุน เชน อุตสาหกรรม เกษตรกรรม โครงสรางพื้นฐาน และการศึกษา"

 wuw_HUN_enlarge_the_ganz_danubius_division: "ขยายแผนกกานซ ดานูบิอุส"
 wuw_HUN_enlarge_the_ganz_danubius_division_desc: "แผนกกานซ ดานูบิอุสของโรงงานกานซในบูดาเปสตทําหนาที่สรางและซอมเรือพลเรือนและเรือรบลํานํ้า เราควรขยายหนาที่ของพวกเขา และสรางโรงงานแหงใหมใหพวกเขาบนแนวชายฝงที่เราเพิ่งไดมา"

 wuw_HUN_support_for_our_finnish_brothers: "สนับสนุนพี่นองชาวฟนแลนด"
 wuw_HUN_support_for_our_finnish_brothers_desc: "เพิ่งราวรอยกวาปที่ผานมานี้เองที่เปนที่ยอมรับกันทั่วไปวาบรรพบุรุษของเรามีความเกี่ยวพันกับชาวฟนแลนด แตบัดนี้หลายคนในประเทศของเรามองพวกเขาเปนพี่นองรวมสายเลือด เมื่อพวกเขากําลังอยูในภาวะสงคราม เราตองสงอาสาสมัครและยุทโธปกรณไปชวยพวกเขาในการตอสู"
 wuw_HUN_support_for_our_finnish_brothers_tt: "ฟนแลนดตองมีรัฐบาลที่เปนมิตรกับเรา"

 wuw_HUN_undercover_air_maneuvers: "การฝกซอมทางอากาศอยางลับ ๆ"
 wuw_HUN_undercover_air_maneuvers_desc: "เราตองทุมทรัพยากรอยางเพียงพอเพื่อคิดคนทฤษฎีใหมเกี่ยวกับสงครามทางอากาศ หากเราตองเขาสูสงคราม ทฤษฎีที่อาจพัฒนาขึ้นจะมีคาอยางประเมินไมได และการฝกอยางลับ ๆ จะทําใหนักบินของเรารบไดดีขึ้น"

 wuw_HUN_hold_war_games: "จัดการซอมรบ"
 wuw_HUN_hold_war_games_desc: "ดวยการจัดการซอมรบขนาดเล็ก เราจะคนพบจุดบกพรองในโครงสรางทางทหารปจจุบัน และใชประสบการณที่ไดรับเพื่อแกไขขอบกพรอง"

 wuw_HUN_negotiate_the_restrictions: "เจรจาเรื่องขอจํากัด"
 wuw_HUN_negotiate_the_restrictions_desc: "การเสริมกําลังอาวุธอยางลับ ๆ ในขนาดเล็กจะไมเพียงพอ เราตองติดตอเพื่อนบานและขอใหแกไขสนธิสัญญาที่ถูกบังคับใชกับเราหลังมหาสงคราม ฮังการีมีสิทธิ์ในการติดอาวุธเทาเทียมกับชาติอื่น"

 wuw_HUN_reinstate_the_navy: "ฟนฟูกองทัพเรือฮังการี"
 wuw_HUN_reinstate_the_navy_desc: "หลังจากไดแนวชายฝงคืนมา เราตองทุมเทความพยายามในการสรางกองเรือที่คูควรกับมหาอํานาจขึ้นใหม"

 wuw_HUN_make_the_magyar_legiero_known: "เปดเผยกองทัพอากาศมัจยาร"
 wuw_HUN_make_the_magyar_legiero_known_desc: "มอดยอร เลเจียรเรอ คือเหลาทัพอากาศของกองทัพเรา เราเคยถูกหามไมใหมีอากาศยานทางทหาร อยางไรก็ตาม กองบินลับไดคอย ๆ กอตั้งขึ้นภายใตการอําพรางของสโมสรการบินพลเรือน บัดนี้เมื่อมีสนธิสัญญาฉบับใหม เราสามารถประกาศการมีอยูของมันใหโลกรูไดแลว"

 wuw_HUN_initiate_army_maneuvers: "เริ่มการซอมรบของกองทัพ"
 wuw_HUN_initiate_army_maneuvers_desc: "กองทัพของเราตองกลับมาอยูในสภาพพรอมรบสําหรับความขัดแยงดวยอาวุธที่อาจเกิดขึ้นในอนาคต เราจะสงพวกเขาไปซอมรบเพื่อพัฒนายุทธวิธีและยุทธศาสตรใหม"

 wuw_HUN_invest_in_ludovica_academy: "ลงทุนในสถาบันลุดโดวิกา"
 wuw_HUN_invest_in_ludovica_academy_desc: "สถาบันปองกันประเทศลุดโดวิกาแหงราชอาณาจักรฮังการีเปนสถาบันฝกนักเรียนนายรอยของเรา ควรไดรับการขยายเพื่อใหนายพลของเราทุกคนไดรับการศึกษาที่ดีขึ้น"

 wuw_HUN_expand_the_diosgyor_machinery_factory: "ขยายโรงงานเครื่องจักรดิโอชเจอร"
 wuw_HUN_expand_the_diosgyor_machinery_factory_desc: "โรงงานเครื่องจักรดิโอชเจอรควรไดรับการขยายไปสูภาคสวนอื่น ๆ มากขึ้น เพื่อใหผลิตวัสดุและเครื่องมืออุตสาหกรรม เครื่องยนต และรถจักรยานยนต ตลอดจนสิ่งอื่น ๆ อีกมากมายไดเร็วขึ้น"

 wuw_HUN_manred_weiss_steel_and_metal_works: "โรงงานเหล็กกลาและโลหะมันเฟรด ไวส"
 wuw_HUN_manred_weiss_steel_and_metal_works_desc: "โรงงานเหล็กกลาและโลหะมันเฟรด ไวส หรือที่มักเรียกกันวาเชเปล มือเว็ก มีศักยภาพสูงและตองไดรับการขยายอยางกวางขวางที่สุดเทาที่จะทําได เพื่อสนับสนุนการพัฒนาชาติของเราตอไป"

 wuw_HUN_expand_the_hungarian_academy_of_sciences: "ขยายบัณฑิตยสถานวิทยาศาสตรฮังการี"
 wuw_HUN_expand_the_hungarian_academy_of_sciences_desc: "บัณฑิตยสถานวิทยาศาสตรฮังการีเปนสมาคมวิชาการที่สําคัญและทรงเกียรติที่สุดของ[ROOT.GetName] หนาที่หลักคือการสงเสริมวิทยาศาสตร เผยแพรการคนพบทางวิทยาศาสตร สนับสนุนการวิจัยและพัฒนา และเปนตัวแทนวิทยาศาสตรของ[ROOT.GetAdjective]ทั้งในประเทศและทั่วโลก"

 wuw_HUN_expand_the_lignite_industry: "ขยายอุตสาหกรรมลิกไนต"
 wuw_HUN_expand_the_lignite_industry_desc: "อุตสาหกรรมถานหินลิกไนตของเรามีขนาดใหญ แตยังดอยพัฒนาอยูคอนขางมาก เราควรเปดเหมืองและโรงงานใหม เพื่อไมใหทรัพยากรธรรมชาติของเราสูญเปลา"

 wuw_HUN_tap_newfound_oil_deposits: "ขุดแหลงนํ้ามันที่เพิ่งคนพบ"
 wuw_HUN_tap_newfound_oil_deposits_desc: "มีการคนพบบอนํ้ามันขนาดเล็กจํานวนมากทั่วประเทศของเรา เชน โดยบริษัทมอดยอร-อเมริไก โอลอยิปอรี หรือที่รูจักกันในชื่อ MAORT แหลงที่โดดเดนแหงหนึ่งคือแหลงนํ้ามันที่คนพบที่บูดาฟาปุสตา ซึ่งควรนํามาใชประโยชนใหเร็วที่สุดเทาที่จะทําได"

 wuw_HUN_hungarian_autarky: "การพึ่งพาตนเองของ[ROOT.GetAdjective]"
 wuw_HUN_hungarian_autarky_desc: "เราพึ่งพาแหลงนํ้ามันจากตางประเทศมากเกินไป เราควรเลียนแบบความพยายามของเยอรมนีในการพัฒนานํ้ามันสังเคราะห และเสริมความแข็งแกรงใหเศรษฐกิจเพื่อใหเรายืนไดดวยขาของตัวเอง"

 wuw_HUN_invite_foreign_investors: "เชิญนักลงทุนตางชาติ"
 wuw_HUN_invite_foreign_investors_desc: "[ROOT.GetNameDefCap] ตั้งอยูใจกลางยุโรปตะวันออก และเราสามารถใชทําเลศูนยกลางนี้ดึงดูดนักลงทุนตางชาติที่สนใจพัฒนาโครงสรางพื้นฐานและอุตสาหกรรมของเราได"

 wuw_HUN_hungarian_tradition: "ประเพณี[ROOT.GetAdjective]"
 wuw_HUN_hungarian_tradition_desc: "ประเพณี[ROOT.GetAdjective]หยั่งรากลึกในเกษตรกรรมบนทุงหญาแพนโนเนีย และเราตองพยายามรักษาประเพณีเหลานี้ไวพรอมกับเพิ่มผลผลิต เพื่อพัฒนาตอไป"

 wuw_HUN_magyar_allamvasutak: "การรถไฟแหงรัฐฮังการี"
 wuw_HUN_magyar_allamvasutak_desc: "บริษัทการรถไฟแหงรัฐของเรา หรือ MÁV ควรไดรับการขยายหนาที่ใหดูแลการเดินรถไฟทุกขบวนในประเทศ สิ่งนี้จะทําใหเราควบคุมเสนทางรถไฟไดมากขึ้น และใชประโยชนจากเครือขายทางรถไฟไดอยางมีประสิทธิภาพยิ่งขึ้น"

 wuw_HUN_expand_the_aluminum_industry: "ขยายอุตสาหกรรมอะลูมิเนียม"
 wuw_HUN_expand_the_aluminum_industry_desc: "เราตองการทรัพยากรทั้งหมดที่มี ทั้งเพื่อการสงออกและใชในประเทศ อุตสาหกรรมอะลูมิเนียมของเราแมจะกวางขวางอยูแลว แตยังมีชองทางใหปรับปรุงไดอีก และเราควรจัดสรรทรัพยากรเพื่อการนี้ทันที"

 wuw_HUN_budapest_university_of_technology_and_economics: "ขยายมหาวิทยาลัยเทคนิคบูดาเปสต"
 wuw_HUN_budapest_university_of_technology_and_economics_desc: "เราตองการนักคิดหัวกะทิมากขึ้นเพื่อสรางการคนพบครั้งสําคัญที่จะชวยเราในความขัดแยงขางหนา ดวยการขยายมหาวิทยาลัยในเมืองหลวง เราจะเพิ่มจํานวนวิศวกรและนักวิทยาศาสตรที่มีทักษะสําหรับอุตสาหกรรมทางทหารของเราได"

 wuw_HUN_the_matyasfold_fighter_factory: "โรงงานเครื่องบินขับไลมาตยาชเฟลด"
 wuw_HUN_the_matyasfold_fighter_factory_desc: "บริษัท Weiss Manfréd Acél- és Fémművek ควรเปดโรงงานผลิตอากาศยานแหงใหมที่มาตยาชเฟลด บูดาเปสต โดยเนนการผลิตเครื่องบินขับไลรุนที่พวกเขาพัฒนาขึ้นเอง"

 wuw_HUN_expand_on_the_weiss_wm_16: "ตอยอด Weiss WM-16"
 wuw_HUN_expand_on_the_weiss_wm_16_desc: "เราควรตอยอดเครื่องบินรุน Weiss WM-16 Budapest เพื่อพยายามสรางความกาวหนาทางเทคโนโลยีครั้งใหมสําหรับการผลิตเครื่องบินทิ้งระเบิดของเรา"

 wuw_HUN_develop_the_weiss_wm_21_solyom: "พัฒนา Weiss WM-21 Sólyom"
 wuw_HUN_develop_the_weiss_wm_21_solyom_desc: "เราควรนําบทเรียนจากความลมเหลวในการพัฒนาเครื่องบินครั้งกอนมาสรางเครื่องบินทิ้งระเบิดเบา Weiss WM-21 Sólyom เหยี่ยวตัวนี้จะสามารถโจมตีศัตรูของเราจากฟากฟาได ไมวาพวกเขาจะอยูที่ใด"

 wuw_HUN_weiss_manfred_wm_23_ezust_nyil: "Weiss Manfréd WM-23 Ezüst Nyíl"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc: "เราตองพัฒนาเครื่องบินขับไลรุนใหมโดยเร็วที่สุด และนักวิทยาศาสตรของเราที่ Weiss Manfréd Acél- és Fémművek ไดพัฒนาพิมพเขียวของสิ่งที่เรียกวา Ezüst Nyíl หรือลูกศรเงิน และกําลังรอการอนุมัติเพื่อเริ่มการผลิต"

 wuw_HUN_establish_the_mavag_aircraft_factory: "จัดตั้งโรงงานอากาศยาน MÁVAG"
 wuw_HUN_establish_the_mavag_aircraft_factory_desc: "อิชตวาน ฮอรทีจะรวมมือกับ MÁVAG จัดตั้งโรงงานแหงใหมสําหรับการผลิตอากาศยานโดยเฉพาะ และจะเริ่มสงมอบเทคโนโลยีใหมใหแกกองทัพอากาศมัจยารโดยทันที"

 wuw_HUN_the_mavag_heja: "MÁVAG Héja"
 wuw_HUN_the_mavag_heja_desc: "แผนกอากาศยานของ MÁVAG ไดพัฒนาตนแบบรุนใหมที่ตั้งชื่อวาเหยี่ยว โดยอิงจากเครื่องบินรุน Reggiane Re.2000 ของอิตาลี บัดนี้เราควรสนับสนุนใหพวกเขาผลิตเครื่องบินรุนใหมนี้ใหไดมากที่สุดเทาที่จะทําได"

 wuw_HUN_repulo_muszaki_intezet: "สถาบันเทคโนโลยีการบิน (Repülö Muszaki Intézet)"
 wuw_HUN_repulo_muszaki_intezet_desc: "อากาศไดกลายเปนมิติใหมของการสงคราม และหลายฝายยังประเมินความสําคัญของมันตํ่าเกินไป เราตองเรียนรูที่จะครองมิติใหมนี้ และจัดสรรทรัพยากรเพื่อพัฒนาหลักนิยมและยุทโธปกรณใหมที่จะทําใหเราทําเชนนั้นได"

 wuw_HUN_develop_laszlo_vargas_design: "พัฒนาแบบของลาสโล วอรกอ"
 wuw_HUN_develop_laszlo_vargas_design_desc: "ลาสโล วอรกอ นักวิทยาศาสตรการบินผูยิ่งใหญของเรา ไดคิดคนแบบอากาศยานในประเทศใหกองทัพของเรามากมาย หนึ่งในนั้นคือตนแบบ Varga RMI-1 X/H เราควรสนับสนุนทุนแกงานของเขาตอไป เพื่อใหการพัฒนาและความกาวหนาของเราไมหยุดอยูเพียงเทานี้"

 wuw_HUN_the_szekesfehervar_sosto_plant: "โรงงานแชเกชแฟเฮรวาร-โชชโต"
 wuw_HUN_the_szekesfehervar_sosto_plant_desc: "เราควรเปดโรงงานผลิตอากาศยานแหงใหมภายใตการควบคุมของสถาบันเทคโนโลยีการบิน ซึ่งสามารถผลิตเครื่องบินที่สถาบันออกแบบ และทดสอบเพื่อใหแนใจวาใชงานไดอยางถูกตอง"

 wuw_HUN_joint_air_development: "การพัฒนาอากาศยานรวม"
 wuw_HUN_joint_air_development_desc: "วิธีที่ดีที่สุดในการพัฒนาอากาศยานรุนใหมคือการรวมมือกับพันธมิตรของเรา การรวบรวมผูมีมันสมองปราดเปรื่องที่สุดจากทุกชาติของเราเขาดวยกันจะทําใหเราไดผลลัพธที่ดีที่สุด"

 wuw_HUN_the_arado_ar_96: "Arado Ar 96"
 wuw_HUN_the_arado_ar_96_desc: "เราควรขอสิทธิบัตรการผลิตจากบริษัทผูผลิตอากาศยาน[GER.GetAdjective] Arado Flugzeugwerke และในทางกลับกันก็เบนจุดเนนของการผลิตและการใชงานเครื่องบินไปสูการลาดตระเวนทางอากาศ"

 wuw_HUN_extensive_licensing_programs: "โครงการซื้อสิทธิบัตรขนานใหญ"
 wuw_HUN_extensive_licensing_programs_desc: "กองทัพอากาศตางชาติไดแสดงใหเห็นแลววาพวกเขามีแบบอากาศยานคุณภาพสูงที่ผานการพิสูจนมาแลว แทนที่จะเสี่ยงโชคพึ่งพาความเชี่ยวชาญดานการบินที่ยังออนหัดของเรา เราควรขออนุญาตผลิตอากาศยานตางชาติเหลานี้ภายใตสิทธิบัตร"

 wuw_HUN_allied_manufacturing_programs: "โครงการผลิตรวมกับพันธมิตร"
 wuw_HUN_allied_manufacturing_programs_desc: "อุตสาหกรรมของเราอาจแข็งแกรงในตัวเอง แตก็ไมอาจแขงขันกับมหาอํานาจโลกรายใดได ดังนั้นเราควรผลิตเครื่องบินใหมในโรงงานของพันธมิตร โดยชําระคาตอบแทนใหพวกเขาเปนเงินเปงเกอ"

 wuw_HUN_danuvia_submachine_guns: "ปนกลมือดานูเวีย"
 wuw_HUN_danuvia_submachine_guns_desc: "ทหารราบของเราตองการอาวุธที่ดีเพื่อเพิ่มประสิทธิภาพในการรบ ตนแบบ Danuvia 43M รุนแรกทําผลงานไดดีในการทดสอบ และหากเพิ่มงบประมาณการพัฒนา เราอาจเริ่มผลิตอาวุธนี้เปนจํานวนมากไดในไมชา"

 wuw_HUN_form_the_gyorshadtest: "จัดตั้งเจอรชฮอดเติชต"
 wuw_HUN_form_the_gyorshadtest_desc: "เราควรมุงจัดตั้งกองทัพนอยเคลื่อนที่เร็ว ซึ่งเปนหนวยยานเกราะลําเลียงพลที่ทันสมัยและมียุทโธปกรณพรอมสรรพ สามารถเหนือกวากองพันของขาศึกในการรบ ดวยเหตุนี้จะมีการจัดตั้งกองพลเจอรชฮอดเติชตสองกองพล กองพลหนึ่งอยูภายใตพลตรีเยเนอ มอยอร และอีกกองพลหนึ่งอยูภายใตพลตรีแฟแร็นตส บีซอ"

 wuw_HUN_establish_the_mavag_army_division: "จัดตั้งกองพลกองทัพ MÁVAG"
 wuw_HUN_establish_the_mavag_army_division_desc: "โรงงานเหล็ก เหล็กกลา และเครื่องจักรแหงรัฐหลวงฮังการี หรือที่รูจักกันในชื่อยอ MÁVAG ทําหนาที่หลากหลายและจัดสงยุทโธปกรณนานาชนิดใหกองทัพของเรา เราควรขอใหขยายโรงงานของพวกเขาเพิ่มเติม เพื่อใหพวกเขาเริ่มชวยผลิตปนจูโจมอัตตาจรและรถถังตอสูอากาศยานได"

 wuw_HUN_doctrinal_studies: "การศึกษาหลักนิยม"
 wuw_HUN_doctrinal_studies_desc: "เราไดเรียนรูมากมายจากการแลกเปลี่ยนนายทหารและการประชุมดานยุทธศาสตรกับพันธมิตร รวมถึงจากหนวยขาวกรองทางทหารของเรา การผสานมุมมองที่แตกตางกันเหลานี้ทําใหเราใกลจะเกิดการกาวกระโดดทางหลักนิยมแลว"

 wuw_HUN_award_military_promotions: "มอบการเลื่อนยศทางทหาร"
 wuw_HUN_award_military_promotions_desc: "กองทัพ[ROOT.GetAdjective]มีบุรุษผูยิ่งใหญอยูมากมาย แตหลายคนยังไมไดดํารงตําแหนงที่สมกับยศที่ควรไดรับ เราจึงควรดําเนินการเลื่อนยศผูที่เราเห็นสมควร และทําใหกองทัพของเราแข็งแกรงยิ่งกวาทุกวันนี้"

 wuw_HUN_magyar_kiralyi_csendorseg: "ตํารวจภูธรหลวงฮังการี (Magyar Királyi Csendörség)"
 wuw_HUN_magyar_kiralyi_csendorseg_desc: "เราควรพยายามขยายกองตํารวจภูธร[ROOT.GetAdjective] มอบอํานาจปกครองตนเองใหมากขึ้น และใหอิสระแกพวกเขามากขึ้นในการเลือกวิธีปฏิบัติเมื่อปราบปรามการกบฏและตอสูกับหนวยรบยอยของขาศึก"

 wuw_HUN_legacy_of_the_black_legion: "มรดกแหงกองทัพดํา"
 wuw_HUN_legacy_of_the_black_legion_desc: "เพื่อใหทหารมาและสารวัตรทหารของเราปฏิบัติงานไดดีขึ้น เราควรจัดรูปแบบตามกองทัพดําของพระเจามาทิอัส คอรวินุส กษัตริยในตํานานของเรา ซึ่งไดรับแรงบันดาลใจมาจากกองทหารลีเจียนอันยิ่งใหญของจูเลียส ซีซาร แมทัพและจักรพรรดิแหงโรมันอีกทอดหนึ่ง"

 wuw_HUN_light_infantry_divisions_doctrine: "หลักนิยมกองพลทหารราบเบา"
 wuw_HUN_light_infantry_divisions_doctrine_desc: "เราตองทํางานใหไดดวยกําลังพลที่มีอยูอยางจํากัด หากเราตองการกองพลมากขึ้น กองพลเหลานั้นก็จําเปนตองเล็กลง กองพลทหารราบเบาใหสวนผสมที่ลงตัวระหวางอํานาจการโจมตีและขนาด และเราจะทําใหมันเปนกระดูกสันหลังของกองทัพเรา"

 wuw_HUN_szent_laszlo_infantry_division: "กองพลทหารราบนักบุญลาสโล"
 wuw_HUN_szent_laszlo_infantry_division_desc: "เราควรพยายามจัดตั้งหนวยทหารราบใหมเพื่อปกปองมาตุภูมิจากภัยคุกคามที่กําลังคืบคลานเขามาอยางเหมาะสม เราสามารถตั้งชื่อกองพลทหารราบใหมนี้ตามนักบุญลาดิสเลาส กษัตริยแหงฮังการีระหวางป 1077 ถึง 1095 และนักบุญองคอุปถัมภของเหลาทหารและผูลี้ภัย"

 wuw_HUN_quantity_over_quality: "คุณภาพเหนือปริมาณ"
 wuw_HUN_quantity_over_quality_desc: "แมกองทัพของเราอาจไมใหญนัก แตก็ยังแข็งแกรงและชดเชยขอนี้ได วิธีการคือเพิ่มความเหนือกวาทางเทคโนโลยีเหนือศัตรู และใชหนวยรบลํ้าสมัยที่สามารถเอาชนะหนวยขาศึกที่มีจํานวนมากกวาหลายเทา"

 wuw_HUN_expand_the_army: "ขยายกองทัพฮอนเวด"
 wuw_HUN_expand_the_army_desc: "กองทัพประจําการปจจุบันของเรา ฮอนเวด มีขนาดเล็กเกินกวาจะมีโอกาสตอกรกับเพื่อนบานไดอยางแทจริง เราจึงตองพยายามขยายขนาดกองทัพใหรวดเร็วที่สุดเทาที่จะทําได"

 wuw_HUN_the_botond: "โบตอนด"
 wuw_HUN_the_botond_desc: "เพื่อตอบสนองความตองการดานเสบียงและการขนสงอยางเพียงพอ เราจําเปนตองมีรถบรรทุกแบบใหม แบบ Rába 38M Botond รุนแรกประสบความสําเร็จในการทดลอง และหากมีทรัพยากรที่เหมาะสม เราจะสามารถปรับแบบใหสมบูรณและเริ่มการผลิตได"

 wuw_HUN_the_turan: "ตูราน"
 wuw_HUN_the_turan_desc: "ดวยการใชตนแบบรถถังกลาง Škoda T-21 เปนพื้นฐาน เราสามารถสรางรถถังกลางของเราเอง ที่สามารถเจาะทะลวงแมแตแนวขาศึกที่มีปอมปราการแนนหนาที่สุด เราจะตั้งชื่อโครงการใหมนี้เพื่อสงเสริมลัทธิตูรานของฮังการี และเผยแพรไปทั่วโลก"

 wuw_HUN_assault_gun_focus: "มุงเนนปนจูโจม"
 wuw_HUN_assault_gun_focus_desc: "แทนที่จะมุงเนนรถถังเต็มรูปแบบ เราจะพึ่งพาปนจูโจมเพื่อชวยทหารราบของเราในการเจาะแนว ในฐานะทางเลือกที่คุมคากวา"

 wuw_HUN_the_toldi: "โทลดี"
 wuw_HUN_the_toldi_desc: "ดวยการใช Landsverk L-60 ของสวีเดนเปนพื้นฐาน เราสามารถสรางรถถังเบาของเราเอง ที่สามารถโอบลอมขาศึกจํานวนมากไดอยางรวดเร็ว เราจะตั้งชื่อรถถังใหมนี้ตามมิโคลช โทลดี อัศวินฮังการีแหงศตวรรษที่ 14"

 wuw_HUN_invest_in_the_special_forces: "ลงทุนในหนวยรบพิเศษ"
 wuw_HUN_invest_in_the_special_forces_desc: "ขณะนี้กองทัพของเรามีกําลังคนเพียงพอที่จะสูรบไดอยางสมศักดิ์ศรีแลว แตจะเปนประโยชนอยางยิ่งหากเราฝกทหารใหมใหแข็งแกรงที่สุดเทาที่จะเปนไปได โดยลงทุนในโครงการหนวยรบพิเศษใหมๆ"

 wuw_HUN_construct_the_arpad_line: "สรางแนวอารปาด"
 wuw_HUN_construct_the_arpad_line_desc: "เพื่อปกปองประชาชนของเราจากภัยคุกคามทางตะวันออก เราตองสรางแนวปอมปราการขนาดใหญในเทือกเขาทรานซิลเวเนีย โดยจะตั้งชื่อตามเจาชายใหญอารปาดผูยิ่งใหญ ผูนําสหพันธชนเผามาจารในชวงรอยตอศตวรรษที่ 9 และ 10"

 wuw_HUN_transylvanian_mountaineers: "ทหารภูเขาทรานซิลเวเนีย"
 wuw_HUN_transylvanian_mountaineers_desc: "เทือกเขาทรานซิลเวเนียเปนหนึ่งในเทือกเขาที่สูงที่สุดในภูมิภาคของเรา และเปนสถานที่ที่สมบูรณแบบสําหรับฝกทหารภูเขาของเรา"

 wuw_HUN_expand_the_arpad_line: "ขยายแนวอารปาด"
 wuw_HUN_expand_the_arpad_line_available_tt: "สามารถสราง§Yปอมภาคพื้นดิน§!อยางนอย 2 แหงตามแนวชายแดนดานเหนือและดานตะวันออกของ §Y[73.GetName]§! และ §Y[76.GetName]§!"
 wuw_HUN_expand_the_arpad_line_desc: "แนวอารปาดไดพิสูจนประสิทธิภาพมาแลว แตหากเราจะตานทานกระแสการบุกไดอยางแทจริง เราตองขยายแนวนี้ ไมใชเพียงดานขนาด แตตองขยายระยะดวย"

 wuw_HUN_construct_the_szeretfalva_deda_railway_line: "ทางรถไฟแซแร็ตฟอลวอ-เดดอ"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc: "เพื่อสงเสบียงใหทหารชายแดนที่ประจําแนวอารปาดในเทือกเขาทรานซิลเวเนียไดดียิ่งขึ้น เราตองสรางทางรถไฟสายใหมและศูนยเสบียง เพื่อใหทหารของเราปกปองประชาชนไดดีกวาเดิม"

 wuw_HUN_the_szekel_command: "กองบัญชาการเซเคลี"
 wuw_HUN_the_szekel_command_desc: "ดวยการยึดคืน [76.GetName] และดินแดนเซเคลีไดเมื่อไมนานมานี้ เราจึงสามารถใหประชากรชาวเซเคลี ชาวฮังการีผูเชี่ยวชาญการเดินทางและการรบในภูเขา มาทําหนาที่เปนทหารชั้นยอดในกองทัพของเรา"

 wuw_HUN_renew_the_shipping_industry: "ฟนฟูอุตสาหกรรมการเดินเรือ"
 wuw_HUN_renew_the_shipping_industry_desc: "เมื่อเรามุงมั่นแนวแนที่จะฟนฟูพรมแดนของเรา เราตองเริ่มภารกิจพัฒนากองเรือเมดิเตอรเรเนียนใหทัดเทียมความรุงโรจนในอดีต"

 wuw_HUN_embrace_navy_traditions: "ยึดมั่นในขนบธรรมเนียมทางเรือ"
 wuw_HUN_embrace_navy_traditions_desc: "เราไมอาจเสียเวลาไปกับการทดลองเทคโนโลยีใหมที่ยังไมผานการพิสูจน เราจะยึดแบบเรือที่ผานการทดสอบมาแลวตั้งแตสมัยจักรวรรดิเกา"

 wuw_HUN_a_reformed_navy: "กองทัพเรือที่ปฏิรูปใหม"
 wuw_HUN_a_reformed_navy_desc: "การสรางกองทัพเรือบนแนวคิดที่ลาสมัยนั้นไมมีเหตุผลนัก เราไดรับโอกาสสรางกองทัพเรือใหมตั้งแตศูนย โดยไมมีภาระจากอดีต เราควรใชโอกาสนี้สรางกองทัพเรือที่ทันสมัยและมีขีดความสามารถสูงที่สุดเทาที่จะทําได"

 wuw_HUN_invest_in_destroyer_models: "ลงทุนในแบบเรือพิฆาต"
 wuw_HUN_invest_in_destroyer_models_desc: "เรือพิฆาตเปนสวนสําคัญของกองเรือที่มักถูกมองขาม เมื่อรวมกับตนทุนที่ตํ่า จึงเปนจุดเริ่มตนที่ดีสําหรับโครงการขยายกําลังทางเรือใดๆ"

 wuw_HUN_cruiser_investments: "การลงทุนในเรือลาดตระเวน"
 wuw_HUN_cruiser_investments_desc: "แมแตกองกําลังที่ทรงอานุภาพที่สุดก็ไรประโยชนหากไมสามารถคนหาขาศึกหรือปองกันตนเองจากอากาศยานได การออกแบบเรือลาดตระเวนเบาและหนักแบบใหมจะชวยเปลี่ยนเรือที่รวมกันอยูใหกลายเปนกองเรืออยางแทจริง"

 wuw_HUN_wolfs_of_the_sea: "หมาปาแหงทองทะเล"
 wuw_HUN_wolfs_of_the_sea_desc: "ในสงครามครั้งที่แลว เรือดํานํ้าเกือบเอาชนะกองทัพเรือที่ทรงพลังที่สุดในโลกได เราจะไมไดรับการยอมรับในฐานะกองทัพเรือสมัยใหมหากเราไมมีเรือดํานํ้าเปนของตนเอง"

 wuw_HUN_bringing_the_air_battle_to_the_seas: "นําการรบทางอากาศสูทองทะเล"
 wuw_HUN_bringing_the_air_battle_to_the_seas_desc: "เรือประจัญบานคือซากของยุคสมัยที่ผานพนไปนานแลว อนาคตของการรบทางทะเลคือเรือบรรทุกเครื่องบินและอากาศยาน เราจะอยูแถวหนาของพัฒนาการนี้"

 wuw_HUN_capital_ship_efforts: "ทุมเทใหเรือหลัก"
 wuw_HUN_capital_ship_efforts_desc: "หัวใจของกองทัพเรือคือเรือประจัญบาน เราตองชดเชยเวลาที่เสียไปและเริ่มสรางเรือลําใหมใหเร็วที่สุดเทาที่จะเปนไปได"

 wuw_HUN_a_new_pride_of_the_fleet: "ความภาคภูมิใจแหงกองเรือลําใหม"
 wuw_HUN_a_new_pride_of_the_fleet_desc: "ประวัติศาสตรอันยาวนานของขนบธรรมเนียมทางเรือของเราเต็มไปดวยการทดสอบ ความยากลําบาก และการทรยศ เพื่อฟนฟูความภาคภูมิใจในมรดกของเรา เหลาพลเรือเอกจึงเสนอใหสรางเรือธงลําใหมเพื่อปลุกใจคนทั้งชาติ"

 wuw_HUN_degauss_ship_hulls: "ลบสนามแมเหล็กตัวเรือ"
 wuw_HUN_degauss_ship_hulls_desc: "เราจะเริ่มลบสนามแมเหล็กของตัวเรือ เพื่อลดรองรอยทางแมเหล็ก ซึ่งจะปกปองเรือจากทุนระเบิดแมเหล็กและลดรองรอยทางอิเล็กทรอนิกสของเรือ"

 wuw_HUN_continue_the_regency: "สืบตอการสําเร็จราชการ"
 wuw_HUN_continue_the_regency_desc: "นับตั้งแตพลเรือเอกฮอรตีเขากุมอํานาจในชวงสงครามกลางเมืองที่เกิดขึ้นในประเทศของเราชวงตนทศวรรษ 20 [HUN.GetNameDef] ก็กลับเขาสูเสนทางที่ถูกตอง แมจะไดรับผลกระทบจากวิกฤตตลาดหุนวอลลสตรีทก็ตาม การสําเร็จราชการตองดําเนินตอไปหากเราตองการความรุงเรืองตอเนื่อง"

 wuw_HUN_strengthen_horthys_reign: "เสริมอํานาจการปกครองของฮอรตี"
 wuw_HUN_strengthen_horthys_reign_desc: "แมนายกรัฐมนตรีฟาสซิสตของเราอาจมีความคิดอื่น แตวิธีที่ดีที่สุดในการรักษาสันติภาพในประเทศและฟนฟู[ROOT.GetNameDef]สูความรุงโรจนดังเดิม คือใหผูสําเร็จราชการกระชับอํานาจ และดูแลดวยตนเองใหเจตจํานงของเขาไดรับการปฏิบัติ"

 wuw_HUN_pass_statute_xix: "ผานบัญญัติที่ 19"
 wuw_HUN_pass_statute_xix_desc: "เนื่องจาก [ROOT.GetLeader] กําลังเจ็บปวย การผานบัญญัติที่ 19 วาดวยการจัดตั้งสภาแหงชาติเมื่อตําแหนงผูสําเร็จราชการวางลงจึงเปนประโยชน ซึ่งจะทําใหเราจัดตั้งออรซากทาแนช (Országtanács) ขึ้นเพื่อเลือกผูสําเร็จราชการคนใหมเมื่อคนปจจุบันถึงแกกรรม บางคนอาจมองวานี่คือความพยายามกอตั้งราชวงศ แตเราก็ไมติดใจอะไร"

 wuw_HUN_restrict_voting_rights: "จํากัดสิทธิในการออกเสียงเลือกตั้ง"
 wuw_HUN_restrict_voting_rights_desc: "เพื่อหยุดยั้งอิทธิพลของคอมมิวนิสตและฝายซายประชาธิปไตยที่กําลังเติบโตอยางไดผล จําเปนตองจํากัดสิทธิในการออกเสียงเลือกตั้ง โดยเพิ่มความเขมงวดของคุณสมบัติ และทําใหมั่นใจวามีเพียงผูที่คํานึงถึงประโยชนสูงสุดของประเทศเทานั้นที่จะไดมีสวนรวมในการเลือกตั้ง"

 wuw_HUN_renounce_the_treaty_of_trianon: "ปฏิเสธสนธิสัญญาทรียานง"
 wuw_HUN_renounce_the_treaty_of_trianon_desc: "ความอยุติธรรมที่บีบบังคับชาติของเราเมื่อมหาสงครามสิ้นสุดลง ซึ่งพรากดินแดนและประชากรถึงสองในสามของชาติที่เคยยิ่งใหญไป เทียบไดกับความอัปยศที่เยอรมนีไดรับจากสนธิสัญญาแวรซาย และมันจะตองถูกลบลาง"

 wuw_HUN_renew_the_rome_protocols: "ตออายุพิธีสารโรม"
 wuw_HUN_renew_the_rome_protocols_desc: "ดวยนโยบายแกไขพรมแดนที่ดําเนินตอเนื่องของ[GER.GetNameDef] เราตองตออายุพิธีสารโรมที่รางและลงนามในป 1934 ขอตกลงนี้ไมเพียงชวยโดดเดี่ยวภัยคุกคามจาก[GER.GetAdjective]และ[YUG.GetAdjective]มากขึ้น แตยังอาจเปนจุดเริ่มตนของพันธมิตรที่แทจริงดวย"

 wuw_HUN_join_the_axis: "เขารวมฝายอักษะ"
 wuw_HUN_join_the_axis_desc: "เนื่องจากเศรษฐกิจของเราพึ่งพาชาวเยอรมันอยูมากแลว จึงสมเหตุสมผลที่เราจะติดตามพวกเขาเขาสูสงคราม เราจะสงคําขอเขารวมพันธมิตรฝายอักษะอยางเปนทางการไปยังพวกเขา"
 HUN_can_not_trust_germany_again_flag: "เยอรมนีหาประโยชนจากเราเพื่อผลประโยชนสวนตัวของพวกเขา"

 wuw_HUN_an_alliance_with_italy: "ผูกพันธมิตรกับ[ITA.GetNameDef]"
 wuw_HUN_an_alliance_with_italy_desc: "การทาบทามเบื้องตนเพื่อเปนพันธมิตรที่เกิดขึ้นในพิธีสารโรมสามารถตอยอดไดแลว เราจะสงคณะผูแทนไปยังอิตาลีเพื่อหารือขอตกลงที่มีผลผูกพันวาดวยความรวมมือทางทหารอยางกวางขวาง ทั้งในเชิงรับและเชิงรุก"

 wuw_HUN_joint_aluminum_mining_company: "บริษัทเหมืองอะลูมิเนียมรวม"
 wuw_HUN_joint_aluminum_mining_company_desc: "เนื่องจากอะลูมิเนียมเปนสวนสําคัญของอุตสาหกรรมสงครามสมัยใหม เราจึงสามารถไดรับการสนับสนุนจาก[GER.GetAdjective]ไดโดยงายในการขยายเหมืองทางตอนเหนือของประเทศ"

 wuw_HUN_reestablish_the_rongyos_garda: "ฟนฟูหนวยรอนโยชการดอ"
 wuw_HUN_reestablish_the_rongyos_garda_desc: "หนวยกึ่งทหารกองพิทักษผาขี้ริ้วกอตั้งขึ้นครั้งแรกในป 1921 เพื่อตอตานสนธิสัญญาทรียานง ชวยเรารบกับชาวออสเตรียในลอยตาบานแชก รวมถึงรบเคียงขางกองทัพแหงชาติของฮอรตีในชวงสงครามกลางเมือง ผูบังคับหนวยของพวกเขา ปาล โปรนอย พรอมจะชวยเหลือเราอีกครั้ง ดังนั้นเราจะไดประโยชนจากการฟนฟูกลุมนี้ขึ้นมาใหม"

 wuw_HUN_the_hungarian_life_and_renewal_party: "พรรคแหงชีวิตและการฟนฟูฮังการี" 
 wuw_HUN_the_hungarian_life_and_renewal_party_desc: "เพื่อควบคุมสังคมไดแนนหนายิ่งขึ้น เราควรใหนายกรัฐมนตรีจัดตั้งพรรคการเมืองใหมเพื่อเปนหัวหอกตอตานฝายซายหัวรุนแรง" 

 wuw_HUN_act_of_defense: "พระราชบัญญัติการปองกันประเทศ"
 wuw_HUN_act_of_defense_desc: "ขณะที่โลกกําลังรอนระอุและความขัดแยงกําลังกอตัว เราตองเตรียมรับมือพายุที่กําลังจะมาถึง ถึงเวลาแลวที่เราตองตรากฎหมายใหมที่จะชวยเราปกปองประเทศ จนถึงคนสุดทายหากจําเปน!"

 wuw_HUN_seek_german_contracts: "แสวงหาสัญญากับ[GER.GetAdjective]"
 wuw_HUN_seek_german_contracts_desc: "อุตสาหกรรมของเรากําลังเติบโตอีกครั้ง แตหากเราจะผลิตยุทโธปกรณทั้งหมดที่ตองการได การวาจางสถาปนิกและบริษัทกอสราง[GER.GetAdjective]ใหสรางโรงงานใหมจะเปนประโยชนอยางยิ่ง"

 wuw_HUN_license_fiat_tankettes: "รถถังขนาดเล็กเฟยต"
 wuw_HUN_license_fiat_tankettes_desc: "เพื่อเสริมความแข็งแกรงใหอุตสาหกรรมทหารและขยายกองพันลาดตระเวนของเรา การรวมมือกับบริษัทยานยนต[ITA.GetAdjective]อยางเฟยตเพื่อผลิตรถถังเบาและรถถังขนาดเล็กสําหรับกลุมยานเกราะลําเลียงพลใหมของเราจะเปนการตัดสินใจที่ชาญฉลาด"

 wuw_HUN_strenghten_the_order_of_vitez: "เสริมกําลังภาคีวีเตซ"
 wuw_HUN_strenghten_the_order_of_vitez_desc: "ภาคีเกียรติยศที่กอตั้งในป 1920 หรือวีเตซีเรนด (Vitézi Rend) ปจจุบันนําโดยฯพณฯ มิโคลช ฮอรตี เขาจึงสามารถจัดสรรเงินทุนและกําลังคนใหแกผูบัญชาการที่เปนสมาชิกของภาคีมากขึ้น เพื่อเสริมความแข็งแกรงใหพวกเขาใหไดมากที่สุด"

 wuw_HUN_absolute_rule_of_the_national_unity_party: "ใชประโยชนจากพรรคเอกภาพแหงชาติ"
 wuw_HUN_absolute_rule_of_the_national_unity_party_desc: "ดวยการใชประโยชนจากพรรคการเมืองปจจุบันของนายกรัฐมนตรี คือพรรคเอกภาพ (Egységes Párt) [ROOT.GetLeader] จะสามารถคงการควบคุมการเมือง[ROOT.GetAdjective]ไดอยางแนนหนา ผูกขาดสถานการณไดอยางมีประสิทธิภาพโดยไมตองหามการเลือกตั้งโดยสิ้นเชิง"

 wuw_HUN_spur_on_the_trianon_trauma: "ปลุกบาดแผลแหงทรียานง"
 wuw_HUN_spur_on_the_trianon_trauma_desc: "ใครๆ ก็รูวา[ROOT.GetNameDef]ในอดีตดีกวาปจจุบัน ในสนธิสัญญาทรียานงอันนาสาปแชงนั้น เราสูญเสียดินแดนอันชอบธรรมไปถึงสองในสามใหแกเพื่อนบานที่ฉวยโอกาสจากจุดออนของเรา พวกเขาทั้งหมดจะไดรูจักความกลัว ในวันที่กองทัพ[ROOT.GetAdjective]เดินทัพมาทวงคืนทุกสิ่ง!"

 wuw_HUN_outlaw_the_party_of_national_will: "ประกาศใหพรรคเจตจํานงแหงชาติผิดกฎหมาย"
 wuw_HUN_outlaw_the_party_of_national_will_desc: "พรรคเจตจํานงแหงชาติแนวชาติสังคมนิยมที่นําโดยแฟแร็นตส ซาลาชี เปนภัยคุกคามตอการปกครองปจจุบันของเรา เนื่องจากพวกเขาไดรับความนิยมจากนาซี[GER.GetAdjective]มากกวา และไมพอใจการปกครองที่แทบจะเบ็ดเสร็จของผูนําเรา"

 wuw_HUN_carrying_on_arpads_legacy: "สืบสานมรดกของอารปาด"
 wuw_HUN_carrying_on_arpads_legacy_desc: "อารปาดผูยิ่งใหญ ผูนําสหพันธชนเผามาจารในชวงรอยตอศตวรรษที่ 9 และ 10 เปนแรงบันดาลใจสําคัญของ [ROOT.GetLeader] และราชวงศของเขาสืบทอดอํานาจมายาวนาน ทําให[ROOT.GetnameDef]รุงเรืองถึงขีดสุด เราควรเรียนรูจากเขาและเดินตามรอยเขา"

 wuw_HUN_the_turul_association: "สมาคมตูรุล"
 wuw_HUN_the_turul_association_desc: "สมาคมตูรุลกอตั้งขึ้นเปนขบวนการนักศึกษาในป 1919 ที่บูดาเปสต พวกเขายืนหยัดเคียงขางมิโคลช ฮอรตีอยางมั่นคงในชวงสงครามกลางเมือง และในยุทธการที่บูดาเออรชเมื่อฤดูใบไมรวงป 1921 ดวยสมาชิกราว 40000 คน เราสามารถใชพวกเขาควบคุมการศึกษาของประเทศได"

 wuw_HUN_demand_transylvania: "เรียกรองทรานซิลเวเนีย"
 wuw_HUN_demand_transylvania_desc: "หากเราสามารถทวงคืนดินแดนที่สูญเสียไปหลังมหาสงครามไดโดยไมตองหลั่งเลือด ก็ยิ่งดี ผูยึดครองพี่นองชาวเซเคลีของเราอยางไมชอบธรรมจะไดรับคําขาดเรียกรองใหโอนดินแดนอันชอบธรรมของเราคืนมา"

 wuw_HUN_strengthen_the_turani_vadaszok: "เสริมกําลังตูรานีวอดาโซก"
 wuw_HUN_strengthen_the_turani_vadaszok_desc: "ในป 1927 ดยูลอ เกิมเบิช ไดกอตั้งกองกําลังกึ่งทหารฟาสซิสตในชื่อสมาคมนักลาตูราน แมจะเปนฟาสซิสต แตพวกเขาตอตานแนวคิดชาติสังคมนิยมของเยอรมัน และยึดถืออุดมการณลัทธิฮังการีนิยมและลัทธิตูรานของฮังการี เราจึงสามารถใชพวกเขาใหเปนประโยชนแกเราไดหากตองการ"

 wuw_HUN_demand_southern_slovakia: "เรียกรอง [664.GetName]"
 wuw_HUN_demand_southern_slovakia_desc: "ชนกลุมนอย[ROOT.GetAdjective]ใน [664.GetName] กําลังถูกรัฐบาลผูยึดครองปฏิบัติอยางเลวรายและเอารัดเอาเปรียบ ดังนั้นเราตองทําใหแนใจวาชาว[ROOT.GetAdjective]และภูมิภาคที่พวกเขาอาศัยอยูจะกลับมาอยูใตการควบคุมของเราอีกครั้ง"
 
 wuw_HUN_claim_overlordship_over_slovakia: "อางสิทธิ์ความเปนเจาเหนือ[SLO.GetNameDef]"
 wuw_HUN_claim_overlordship_over_slovakia_desc: "สโลวาเกียสวนที่เหลือตองถูกผนวกกลับเขาสูรัฐฮังการีดวย ไมวาจะโดยตรงหรือในฐานะดินแดนในปกครอง เราจะสงคําขาดอีกฉบับ"

 wuw_HUN_invite_german_investors: "เชิญนักลงทุน[GER.GetAdjective]"
 wuw_HUN_invite_german_investors_desc: "ดังที่กําหนดไวแลวในขอตกลงการคากอนหนานี้ ขณะนี้มีเพียงชาว[GER.GetAdjective]และชาว[ROOT.GetAdjective]เทานั้นที่ไดรับอนุญาตใหสํารวจแรในประเทศของเรา ดังนั้นอยางนอยที่สุด การใชประโยชนจากขอนี้และเชิญนักลงทุนเขามาในประเทศก็เปนการกระทําที่ชาญฉลาด"

 wuw_HUN_protect_austria: "ปกปอง[AUS.GetNameDef]"
 wuw_HUN_protect_austria_desc: "เพื่อยืนหยัดตอตาน[GER.GetNameDef]ตอไป เราตองตานทานความทะเยอทะยานอยางเปดเผยของพวกเขาที่จะรวมชาติกับ[AUS.GetNameDef] เราสามารถมอบการรับประกันใหพวกเขา เพื่อใหรัฐบาลปจจุบันมีกําลังทางการเมืองที่จําเปนในการตอกรกับกลุมที่นิยม[GER.GetAdjective] โดยมีเงื่อนไขวาพวกเขาตองคืนบูรเกนลันดใหเรา"

 wuw_HUN_proclaim_greater_hungary: "ประกาศมหาฮังการี"
 wuw_HUN_proclaim_greater_hungary_desc: "เมื่อไดดินแดนที่ควรเปนของเราคืนมาแลว ประเทศของเราก็ขยายออกจนถึงพรมแดนทางประวัติศาสตร บัดนี้เราสามารถประกาศการกอตั้งมหาฮังการีตอชาวโลกไดอยางเต็มภาคภูมิ และมุงสูเปาหมายใหม"

 wuw_HUN_demand_the_return_of_slovakia: "เรียกรองการผนวกรวม[SLO.GetAdjective]"
 wuw_HUN_demand_the_return_of_slovakia_desc: "เปนเวลายาวนานที่[SLO.GetNameDef]เคยเปนสวนหนึ่งของมหาฮังการี และบัดนี้เมื่อเรากลับมาแสวงหาที่ยืนในโลกอีกครั้ง เราควรยืนยันความเปนเจาของเหนือภูมิภาคนี้"

 wuw_HUN_promote_hungarianism: "สงเสริมลัทธิฮังการีนิยม"
 wuw_HUN_promote_hungarianism_desc: "เพื่อทวงคืนความรุงโรจนในอดีตอีกครั้ง เราตองสนับสนุนผูที่ปรารถนาเพียงสิ่งนั้น ไมวาพวกเขาจะหัวรุนแรงเพียงใด ดังนั้นเราควรสงเสริมแนวคิดลัทธิฮังการีนิยมที่กําลังกอตัว ซึ่งพัฒนาขึ้นบนพื้นฐานคําสอนของบิชอปคาทอลิกโอตโตการ โปรฮาสกอ และแนวคิดของเขาที่ใหยืนหยัดเพื่อผลประโยชนของฮังการีไมวาจะตองแลกดวยสิ่งใด"

 wuw_HUN_demand_the_vojvodina: "เรียกรองวอยวอดีนา"
 wuw_HUN_demand_the_vojvodina_desc: "ภูมิภาคบาชกอเปนสวนสําคัญของชาติเรามาชานาน แตกลับถูกรัฐบาล[YUG.GetAdjective]พรากไปหลังมหาสงครามสิ้นสุด เราตองแกไขความอยุติธรรมทางประวัติศาสตรนี้ และทวงคืนสิ่งที่เปนของเรา!"

 wuw_HUN_demand_carpathian_ruthenia: "เรียกรองรูทีเนียคารเพเทียน"
 wuw_HUN_demand_carpathian_ruthenia_desc: "ชาว[ROOT.GetAdjective]ในภูมิภาครูทีเนียคารเพเทียนถูกกดขี่ภายใตระบอบตางชาติมานานเกินไปแลว นับตั้งแตสาธารณรัฐฮุตซุลผูทรยศประกาศเอกราชจากเราในป 1919 เราตองทวงคืนดินแดนนี้เพื่อประชาชนของเรา!"

 wuw_HUN_demand_burgenland: "เรียกรองบูรเกนลันด"
 wuw_HUN_demand_burgenland_desc: "หนวยรอนโยชการดออันกลาหาญเคยสถาปนาลอยตาบานแชกเมื่อมหาสงครามสิ้นสุด เพื่อพยายามยึดครองและฟนฟูการปกครองของ[HUN.GetAdjective]เหนือดินแดนนั้น แตสุดทายกลับถูกพรากไปและผนวกเขากับออสเตรีย เราตองทวงคืนภูมิภาคนี้ หากเราจะไดศักดิ์ศรีกลับคืนมา"

 wuw_HUN_reaffirm_territorial_claims: "ยืนยันการอางสิทธิ์ดินแดน"
 wuw_HUN_reaffirm_territorial_claims_desc: "เมื่อปฏิเสธสนธิสัญญาทรียานงแลว บัดนี้เราตองดําเนินการยืนยันการอางสิทธิ์เหนือดินแดนที่ถูกขโมยไปจากเรา"

 wuw_HUN_end_the_regency: "ยุติการสําเร็จราชการ"
 wuw_HUN_end_the_regency_desc: "ฮอรตีทําหนาที่ผูสําเร็จราชการไดดีมาตลอด แตในที่สุดก็ถึงเวลาที่จะตองมองหากษัตริยผูเต็มใจขึ้นครองบัลลังก[ROOT.GetAdjective]อีกครั้ง ไมวาจะเปนราชวงศฮาพสบวรค หรือผูที่สอดคลองกับความตองการของความตกลงไตรภาคีนอยมากกวา เราตองการพระมหากษัตริยองคใหม"

 wuw_HUN_crack_down_on_radicals: "กวาดลางพวกหัวรุนแรง"
 wuw_HUN_crack_down_on_radicals_desc: "ในประเทศมีกองกําลังติดอาวุธและองคกรการเมืองมากมายที่ตอตานการฟนฟูระบอบกษัตริย เราตองจํากัดอิทธิพลของพวกเขาและยุบกลุมกึ่งทหารทั้งหมด มิฉะนั้นพวกเขาอาจกลายเปนปญหาใหเราในภายหลัง"

 wuw_HUN_reach_out_to_candidates: "ติดตอผูมีสิทธิ์ขึ้นครองราชย"
 wuw_HUN_reach_out_to_candidates_desc: "เราตองจัดตั้งคณะกรรมการเพื่อคนหาผูที่เหมาะสมจะขึ้นครองราชย ผูที่เห็นไดชัดที่สุดคืออ็อทโท รัชทายาทปจจุบันแหงราชวงศฮาพสบวรค และโยเซฟ เอากุสท กษัตริยองคลาสุดของเรา ซึ่งเปนราชวงศฮาพสบวรคเชนกัน อยางไรก็ตาม ความตกลงไตรภาคีนอยไดหามไมใหเรามีกษัตริยเชื้อสายฮาพสบวรค เราจึงอาจตองมองหาทางเลือกอื่น"

 wuw_HUN_subvert_gombos_troops: "บอนทําลายกองกําลังของเกิมเบิช"
 wuw_HUN_subvert_gombos_troops_desc: "ดยูลอ เกิมเบิช นายกรัฐมนตรีฟาสซิสตหัวรุนแรง ควบคุมกองกําลังกึ่งทหารหลายกลุม ที่ใหญที่สุดคือสมาคมปองกันประเทศฮังการี เราตองกําจัดกลุมเหลานี้กอนที่พวกเขาจะเปนภัยตอราชอาณาจักรใหมของเรา"

 wuw_HUN_reinstate_the_pragmatic_sanction: "ฟนฟูพระราชกฤษฎีกาปฏิบัตินิยมป 1713"
 wuw_HUN_reinstate_the_pragmatic_sanction_desc: "พระราชกฤษฎีกาปฏิบัตินิยมป 1713 ออกโดยจักรพรรดิชารลสที่ 6 แหงจักรวรรดิโรมันอันศักดิ์สิทธิ์ เพื่อใหพระราชธิดาสามารถสืบทอดราชบัลลังกฮาพสบวรคไดอยางไมแบงแยก ซึ่งโดยพื้นฐานแลวกําหนดใหชาติของเราเปนดินแดนของราชวงศฮาพสบวรคสืบไปในอนาคต หลังความพยายามรัฐประหารที่ลมเหลวของพระเจาชารลสที่ 4 พระราชกฤษฎีกานี้ถูกเพิกถอน เพื่อฟนฟูการปกครองดังกลาว เราตองพยายามนํากลับมาใชอีกครั้ง แมจะขัดตอความตองการของความตกลงไตรภาคีนอยก็ตาม"

 wuw_HUN_aid_the_carlist_struggle: "ชวยเหลือการตอสูของฝายคารลิสต"
 wuw_HUN_aid_the_carlist_struggle_desc: "ฝายคารลิสตของสเปนกําลังตอสูอยางสูงสงเพื่อฟนฟูคุณคาดั้งเดิมของชาติและนําพระมหากษัตริยที่ชอบธรรมกลับขึ้นครองบัลลังกอีกครั้ง หากเราตองการพันธมิตรที่เปนไปไดในภูมิภาคนี้ในอนาคต การชวยเหลือฝายที่มีแนวทางใกลเคียงกับเราในการตอสูเพื่อชัยชนะในสงครามกลางเมืองสเปนก็เปนการกระทําที่ชาญฉลาด"

 wuw_HUN_invite_otto_to_the_throne: "เชิญอ็อทโทขึ้นครองราชย"
 wuw_HUN_invite_otto_to_the_throne_desc: "ราชวงศฮาพสบวรคปกครองฮังการีมาชานาน และภายใตการปกครองของพวกเขา ประเทศนี้เคยเปนสวนหนึ่งของจักรวรรดิที่ยิ่งใหญที่สุดแหงหนึ่งของยุโรป การนําราชวงศฮาพสบวรคผูตั้งใจฟนฟูออสเตรีย-ฮังการีกลับมาเปนผูนํายอมพาเราไปสูความยิ่งใหญอีกครั้งอยางแนนอน ในฐานะรัชทายาทโดยชอบธรรมของทั้งจักรวรรดิ พระองคจะเปนกุญแจสําคัญในการฟนฟูออสเตรีย-ฮังการี"

 wuw_HUN_attempt_economic_independence: "พยายามสรางความเปนอิสระทางเศรษฐกิจ"
 wuw_HUN_attempt_economic_independence_desc: "หากเราจะทวงคืนความรุงโรจนในอดีต เราไมอาจพึ่งพามหาอํานาจตางชาติใหพัฒนาและบริหารเศรษฐกิจของเราได ประเทศของเราตองกลับมารุงเรืองอีกครั้งดวยมือของเราเทานั้น!"

 wuw_HUN_the_lands_of_the_crown_of_saint_stephen: "ดินแดนแหงมงกุฎนักบุญสตีเฟน"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc: "ในฐานะสวนหนึ่งของจักรวรรดิออสเตรีย-ฮังการี เราเคยเปนที่รูจักในนามดินแดนแหงมงกุฎนักบุญสตีเฟน หรือเรียกสั้นๆ วาทรานสไลทาเนีย ในฐานะกาวแรกของการทวงคืนจักรวรรดิ เราควรพยายามกลับมาใชชื่อนี้อีกครั้ง ซึ่งจะแสดงใหโลกเห็นถึงเจตนาที่แทจริงของเรา"

 wuw_HUN_the_old_habsburg_king: "กษัตริยฮาพสบวรคองคเกา"
 wuw_HUN_the_old_habsburg_king_desc: "อารชดยุกโยเซฟ เอากุสทแหงออสเตรีย เปนพาลาไทนแหงฮังการีองคสุดทาย และเปนผูสําเร็จราชการแทนพระเจาชารลส จนกระทั่งฝายสัมพันธมิตรเรียกรองใหสละตําแหนง เนื่องจากไมยอมรับกษัตริยราชวงศฮาพสบวรค บัดนี้พระองคพรอมจะกลับขึ้นครองบัลลังกอีกครั้ง และปกครองฮังการีในฐานะกษัตริยศักดิ์สิทธิ์ ในฐานะอดีตจอมพล ความรูดานการสงครามของพระองคยอมเปนประโยชนอยางแนนอน"
 HUN_feldmarchall_augusts_expertise: "ความเชี่ยวชาญของจอมพลโยเซฟ เอากุสท"

 wuw_HUN_secure_army_loyalty: "สรางความจงรักภักดีของกองทัพ"
 wuw_HUN_secure_army_loyalty_desc: "เพื่อใหมั่นใจวากองทัพอยูขางเรา และเราลงทุนในกองทัพไดอยางปลอดภัย เราตองกําจัดผูบัญชาการทุกคนที่ความจงรักภักดีตอราชบัลลังกยังนาสงสัยแมเพียงเล็กนอย"

 wuw_HUN_royal_hussars: "ทหารมาฮุสซารหลวง"
 wuw_HUN_royal_hussars_desc: "ประชาชนของเรามีประเพณีการใชทหารมาอันยาวนานและนาภาคภูมิใจ และวันนี้ก็ไมตางกัน ตองจัดตั้งกองทหารมาชั้นยอดขึ้นเพื่อทําหนาที่ราชองครักษ ถวายความปลอดภัยแดองคพระมหากษัตริย"

 wuw_HUN_abide_by_the_little_ententes_stipulations: "ปฏิบัติตามขอกําหนดของความตกลงไตรภาคีนอย"
 wuw_HUN_abide_by_the_little_ententes_stipulations_desc: "นับตั้งแตมหาสงครามสิ้นสุด ความตกลงไตรภาคีนอยซึ่งประกอบดวยโรมาเนีย เชโกสโลวาเกีย และยูโกสลาเวีย ไดกําหนดวาเราจะมีกษัตริยราชวงศฮาพสบวรคอีกไมได ตามตรงแลวเราก็ไมติดขัดอะไร เพราะเรามีผูที่เหมาะสมจะขึ้นครองราชยอีกคนอยูในใจแลว"

 wuw_HUN_elect_a_democratic_king: "เลือกกษัตริยผูยึดมั่นประชาธิปไตย"
 wuw_HUN_elect_a_democratic_king_desc: "เราตองแสวงหากษัตริยผูจะธํารงหลักการประชาธิปไตยของชาติและสิทธิของประชาชน และเพื่อการนี้ เราตองหันไปมองระบอบราชาธิปไตยภายใตรัฐธรรมนูญแบบสังคมประชาธิปไตยในยุโรปเหนือ และดูวาพวกเขามีผูที่เหมาะสมที่เราจะถวายราชบัลลังกใหหรือไม"

 wuw_HUN_honor_the_great_war_veterans: "เชิดชูทหารผานศึกมหาสงคราม"
 wuw_HUN_honor_the_great_war_veterans_desc: "แมผูบัญชาการรุนใหมที่ปราดเปรื่องจะกุมอนาคตไวในมือ แตเราไมอาจลืมหนี้บุญคุณที่มีตอทหารผานศึกมหาสงคราม ผูตอสูเพื่อปกปองมาตุภูมิของประชาชนเรา เราควรมอบเครื่องราชอิสริยาภรณแกพวกเขา และทําใหมั่นใจวาในอนาคตจะมีผูเต็มใจเปนอยางที่พวกเขาเปนในวันนี้มากขึ้น"

 wuw_HUN_the_legacy_of_the_isonzo_front: "มรดกแหงแนวรบอีซอนโซ"
 wuw_HUN_the_legacy_of_the_isonzo_front_desc: "พระองคโยเซฟ เอากุสททรงรับใชออสเตรีย-ฮังการีและทรงนําทัพในการรบหลายครั้งทั้งในแนวรบรัสเซีย เซอรเบีย และอิตาลี แตที่โดดเดนที่สุดคือ พระองคทรงพบวายุทธวิธีที่ใชในการรบหลายครั้งที่อีซอนโซนั้นสรางแรงบันดาลใจ และทรงมุงนํายุทธศาสตรทางทหารที่คิดคนขึ้นในแนวรบนั้นมาใช"

 wuw_HUN_the_bastion_of_catholicism: "ปอมปราการแหงคาทอลิก"
 wuw_HUN_the_bastion_of_catholicism_desc: "ประชากรสวนใหญของชาติเรานับถือคาทอลิก พระมหากษัตริยก็เชนกัน ถึงเวลาแลวที่ราชอาณาจักรอัครสาวกแหงฮังการีจะรับบทผูพิทักษคริสตศาสนา และขับไลพวกคอมมิวนิสตไรพระเจาออกจากทวีปของเรา"

 wuw_HUN_enact_agrarian_reform: "ดําเนินการปฏิรูปเกษตรกรรม"
 wuw_HUN_enact_agrarian_reform_desc: "ภาคเกษตรกรรมของเรายังมีชองวางใหปรับปรุงอีกมาก การทําใหกระชับและเพิ่มประสิทธิภาพจะชวยปลดปลอยแรงงานไปทํางานในภาคอื่นๆ เชน การกอสรางและการผลิตอาวุธ"

 wuw_HUN_demand_austrian_restoration: "เรียกรองการฟนฟูออสเตรีย"
 wuw_HUN_demand_austrian_restoration_desc: "ออสเตรีย หรือที่ในอดีตรูจักกันในนามซิสไลทาเนีย เคยเปนสวนสําคัญของจักรวรรดิสหพันธของเรา บัดนี้สําคัญยิ่งกวาเคยที่จะทําใหราชวงศฮาพสบวรคกลับมาปกครองชาติของพวกเขาอีกครั้ง และรวมราชอาณาจักรของเราไวภายใตสหพันธเดียว"

 wuw_HUN_seek_an_alliance_with_the_kaiser: "แสวงหาพันธมิตรกับไกเซอร"
 wuw_HUN_seek_an_alliance_with_the_kaiser_desc: "เมื่อจักรวรรดิ[GER.GetAdjective]เกาไดรับการฟนฟูอีกครั้ง การฟนสายสัมพันธเกากับ [GER.GetLeader] ยอมเปนการกระทําที่ชาญฉลาด เพื่อพยายามลบลางการกระทําอันเลวรายที่เราทั้งสองไดรับเมื่อมหาสงครามสิ้นสุด"

 wuw_HUN_a_grand_habsburg_alliance: "พันธมิตรฮาพสบวรค"
 wuw_HUN_a_grand_habsburg_alliance_desc: "ไมมีใครไวใจไดมากไปกวาญาติพี่นองของตนเอง และประวัติศาสตรสอนเราวาทุกคนลวนตอตานราชวงศฮาพสบวรคอันยิ่งใหญ ดังนั้นเราควรรักษาพันธมิตรไวภายในครอบครัว และจัดตั้งฝายที่ประกอบดวยรัฐที่ปกครองโดยราชวงศฮาพสบวรคเทานั้น"

 wuw_HUN_the_old_grand_alliance: "ฟนฟูมหาพันธมิตร"
 wuw_HUN_the_old_grand_alliance_desc: "ยอนไปในป 1689 เราไดลงนามในสนธิสัญญารวมกับพระเจาวิลเลียมที่ 3 ในนามสาธารณรัฐดัตชและอังกฤษ โดยมีเปาหมายเพื่อจัดตั้งพันธมิตรหยุดยั้งนโยบายขยายอํานาจของฝรั่งเศส บัดนี้โลกกําลังลุกเปนไฟอีกครั้ง และเราตองรักษาความมั่นคงของทวีปดวยการฟนฟูสันนิบาตเกานี้อีกครั้ง"

 wuw_HUN_demand_wiedist_restoration: "เรียกรองการฟนฟูราชวงศวีด"
 wuw_HUN_demand_wiedist_restoration_desc: "เจาชายวิลเฮลมแหงวีดเคยปกครองราชรัฐแอลเบเนียในฐานะพันธมิตรของฝายมหาอํานาจกลาง แตเมื่อมหาสงครามสิ้นสุด พระองคถูกถอดจากราชบัลลังกอยางไมเปนธรรม และหลายปตอมา อาหเมต โซกู ผูอางสิทธิ์อันนารังเกียจก็ไดชวงชิงราชบัลลังกแอลเบเนียไป เราตองแกไขความผิดพลาดนี้โดยทันที!"

 wuw_HUN_a_habsburg_poland: "โปแลนดแหงฮาพสบวรค"
 wuw_HUN_a_habsburg_poland_desc: "ดินแดนโปแลนดครั้งหนึ่งเคยมีโอกาสเปนอาณาจักรของราชวงศฮาพสบวรค และบัดนี้ถึงเวลาอีกครั้งที่จะขยายดินแดนภายใตการควบคุมของราชวงศฮาพสบวรค เราควรติดตอรัฐบาลโปแลนดและเรียกรองใหฟนฟูราชอาณาจักร โดยใหคารล อัลเบรชทขึ้นครองราชบัลลังก"

 wuw_HUN_habsburg_ascension_in_spain: "ราชวงศฮาพสบวรคขึ้นครองสเปน"
 wuw_HUN_habsburg_ascension_in_spain_desc: "ราชวงศฮาพสบวรคเคยปกครองชาวสเปนมาเปนเวลายาวนาน เราควรพยายามฟนฟูระบอบกษัตริยในสเปน และใชสเปนขยายพันธมิตรฮาพสบวรคและโอบปกศัตรูของเราในยุโรปตะวันตก"

 wuw_HUN_reenlist_the_sich_riflemen: "ระดมกองทหารไรเฟลซิชยูเครนอีกครั้ง"
 wuw_HUN_reenlist_the_sich_riflemen_desc: "กองทหารไรเฟลซิชยูเครนเคยรบเพื่อเราในมหาสงคราม และตอมาไดรบเพื่อรัฐยูเครนเสรีในสงครามกลางเมืองรัสเซีย เราควรจัดตั้งหนวยทหารนี้ขึ้นใหม ภายใตผูบัญชาการเกาผูเปนที่นิยมของพวกเขา อารชดยุกวิลเฮลม ฟรันซแหงออสเตรีย แหงราชวงศฮาพสบวรค ซึ่งพวกเขารูจักในชื่อวาซึล วึชวานึย"

 wuw_HUN_the_kingdom_of_ukraine: "ราชอาณาจักรยูเครน"
 wuw_HUN_the_kingdom_of_ukraine_desc: "หลังมหาสงคราม เราพยายามกอตั้งรัฐยูเครนใหมดวยความชวยเหลือของจักรวรรดิเยอรมัน แตถูกพวกบอลเชวิกบดขยี้ บัดนี้เราไดควบคุมมาตุภูมิของยูเครนอีกครั้ง และสามารถพยายามสถาปนาราชอาณาจักรยูเครนใหมที่นําโดยราชวงศฮาพสบวรคได"

 wuw_HUN_restore_the_georgian_monarchy: "ฟนฟูระบอบกษัตริยจอรเจีย"
 wuw_HUN_restore_the_georgian_monarchy_desc: "ผูประสานงานของเราไดติดตอเจาชายจอรจ บากราตีออนแหงมุคราณีที่ลี้ภัยอยู ผูเปนรัชทายาทโดยชอบธรรมแหงราชบัลลังกจอรเจีย พระองคทรงใหคํามั่นจะสนับสนุนอุดมการณของเราตลอดไป หากเราสัญญาวาจะปลดปลอยมาตุภูมิของพระองคและฟนฟูระบอบกษัตริยที่นั่น บัดนี้ทุกอยางขึ้นอยูกับเรา"

 wuw_HUN_protect_czechoslovakia: "ปกปองเชโกสโลวาเกีย"
 wuw_HUN_protect_czechoslovakia_desc: "[CZE.GetNameDefCap]เติบโตจนทรงพลังและอุตสาหกรรมกาวหนานับตั้งแตไดรับเอกราช แตดินแดนของพวกเขากําลังถูกเพื่อนบานจองมองอยางละโมบ เราจะเสนอการคุมครองแกพวกเขาจากภัยคุกคามเหลานี้ ไมวาจะดวยการตอนรับพวกเขากลับมาเปนสวนสําคัญของจักรวรรดิอีกครั้ง หรือดวยการมอบสถานะรัฐภาคี"

 wuw_HUN_reclaim_transylvania: "ทวงคืนทรานซิลเวเนีย"
 wuw_HUN_reclaim_transylvania_desc: "เมื่อมหาสงครามสิ้นสุด ชาว[ROM.GetAdjective]ไดยึดครองทรานซิลเวเนีย ซึ่งเราปกครองมาหลายศตวรรษ เหตุการณนั้นผานมาไมนานนัก และประชาชนของเรายังจดจําไดดี ถึงเวลาแลวที่จะยึดดินแดนเหลานี้กลับคืนมา"

 wuw_HUN_a_hungarian_galicia: "กาลิเซียแหง[ROOT.GetAdjective]"
 wuw_HUN_a_hungarian_galicia_desc: "ในอดีต กาลิเซียและบูโควีนาอยูภายใตการปกครองของซิสไลทาเนีย แตเมื่อบัดนี้เราเปนหุนสวนหลักในจักรวรรดิ ก็สมเหตุสมผลที่เราจะเปนผูปกปองและบริหารดินแดนเหลานี้"

 wuw_HUN_reintigrate_slovakia: "ผนวกรวมสโลวาเกียกลับคืน"
 wuw_HUN_reintigrate_slovakia_desc: "สโลวาเกียเปนสวนสําคัญของอาณาจักร[ROOT.GetAdjective]มาหลายศตวรรษ แตดวยสนธิสัญญาทรียานงอันนารังเกียจ ดินแดนเหลานี้จึงถูกพรากไปจากเรา ถึงเวลาแลวที่เราจะรวมภูมิภาคทางเหนือของเราและนํากลับคืนสูออมอก"

 wuw_HUN_press_maximilians_and_the_iturbides_claims: "ผลักดันการอางสิทธิ์ของมักซีมีเลียนและราชวงศอิตูรบิเด"
 wuw_HUN_press_maximilians_and_the_iturbides_claims_desc: "เม็กซิโกไดรับการประกาศเปนจักรวรรดิครั้งแรกภายใตราชวงศอิตูรบิเด และตอมาในสมัยจักรวรรดิที่สองก็ถูกปกครองโดยมักซีมีเลียน ฟอน ฮาพสบวรค จนกระทั่งพระองคถูกประหารอยางไมเปนธรรม รัชทายาทปจจุบันของราชบัลลังกจักรวรรดิคือมาริอา โฮเซฟา โซเฟย เด อิตูรบิเด ซึ่งพระองคเคยรับเปนบุตรบุญธรรม และเราจะทําใหแนใจวาเธอจะไดทวงคืนมงกุฎอีกครั้ง!"

 wuw_HUN_the_triple_kingdom: "ราชาธิปไตยสามมงกุฎ"
 wuw_HUN_the_triple_kingdom_desc: "เมื่อมหาสงครามสิ้นสุดลงและแมกระทั่งกอนหนานั้น มีผูเสนอใหยกเลิกระบอบราชาธิปไตยคูและเปลี่ยนเปนระบอบที่มีสามมงกุฎ หนึ่งในนั้นคือมงกุฎแหงโครเอเชีย-สลาโวเนีย เราควรพยายามทําตามคําสัญญาเหลานี้ในตอนนี้ เพื่อไมใหจักรวรรดิของเราลมสลายอีกในอนาคต"

 wuw_HUN_restore_the_lombardo_venetian_kingdom: "ฟนฟูราชอาณาจักรลอมบารเดีย–เวเนเชีย"
 wuw_HUN_restore_the_lombardo_venetian_kingdom_desc: "ราชอาณาจักรลอมบารเดีย–เวเนเชียเปนดินแดนองคประกอบของจักรวรรดิเราตั้งแตป 1815 ถึง 1866 และถูกราชอาณาจักรอิตาลีที่เพิ่งกอตั้งยึดไปในสงครามประกาศเอกราชอิตาลีครั้งที่สาม ถึงเวลาแลวที่เราจะกลับสูคาบสมุทรนี้ และพยายามนําราชวงศฮาพสบวรคกลับขึ้นครองบัลลังกในดินแดนมงกุฎเกาเหลานี้"

 wuw_HUN_restore_the_duchy_of_teschen: "ฟนฟูดัชชีเทเชิน"
 wuw_HUN_restore_the_duchy_of_teschen_desc: "ดินแดนไซลีเซียเคยอยูภายใตการปกครองของโบฮีเมียมาชานาน และตอมาถูกผนวกเขากับจักรวรรดิพรอมกัน แตหลังสงครามสืบราชบัลลังกออสเตรีย ปรัสเซียก็ขโมยไปจากเรา ซึ่งเปนความสูญเสียที่เราไมเคยลืม เราตองเอาคืนพวกเขา และทวงดินแดนเหลานี้กลับมาเปนของเราอีกครั้ง!"

 wuw_HUN_reclaim_the_holy_city: "ทวงคืนนครศักดิ์สิทธิ์"
 wuw_HUN_reclaim_the_holy_city_desc: "ราชอาณาจักรเยรูซาเลมถูกลมลางเมื่อถูกมัมลุกแหงอียิปตพิชิตในป 1291 แตจักรพรรดิของเรายังทรงดํารงพระอิสริยยศกษัตริยแหงเยรูซาเลมผานพระเจาเลโอโปลดที่ 1 แหงราชวงศลอแรน ถึงเวลาแลวที่เรา ผูพิทักษศรัทธาคาทอลิก จะทวงคืนนครศักดิ์สิทธิ์เยรูซาเลม และทําในสิ่งที่เหลานักรบครูเสดทําไมสําเร็จ"

 wuw_HUN_a_holy_empire: "จักรวรรดิศักดิ์สิทธิ์"
 wuw_HUN_a_holy_empire_desc: "บัดนี้เมื่อดินแดนศักดิ์สิทธิ์อยูใตการควบคุมของกษัตริยแหงเยรูซาเลมที่แทจริงแลว เราสามารถเขาหาพระสันตะปาปาเพื่อขอพร เนื่องจากราชอาณาจักรเยรูซาเลมไดรับการฟนฟูในที่สุด สิ่งนี้จะทําใหประชาชนในจักรวรรดิของเราเขาใจบทบาทของพระมหากษัตริยในชาติของเรา และเขาใจวาพวกทานไดรับเลือกจากพระเจาอยางแทจริง"
 wuw_HUN_a_holy_empire_tt: "§Yอ็อทโท ฟอน ฮาพสบวรค§! และรัฐบริวารของพระองคจะไดรับพรจากพระสันตะปาปา"

 wuw_HUN_a_multi_ethnic_empire: "จักรวรรดิพหุชาติพันธุ"
 wuw_HUN_a_multi_ethnic_empire_desc: "จักรวรรดิของเราครอบคลุมผูคนและวัฒนธรรมที่หลากหลาย และเปนสิ่งที่เราตองยอมรับอยางเต็มที่ โดยมอบอํานาจปกครองตนเองอยางกวางขวางแกทองถิ่นตางๆ ในอาณาจักร เพื่อใหประชาชนตองการอยูรวมกับเราตอไปในอีกหลายปขางหนา"

 wuw_HUN_reverse_the_risorgimento: "พลิกกลับริซอรจีเมนโต"
 wuw_HUN_reverse_the_risorgimento_desc: "การรวมชาติอิตาลีเปนความผิดพลาดที่เกิดขึ้นกับโลกจากการตัดสินใจอันไรความรับผิดชอบหลายครั้งของผูปกครอง และเปนโศกนาฏกรรมของจักรวรรดิออสเตรีย-ฮังการี ความผิดพลาดนี้ตองถูกแกไข หากโลกจะฟนตัวจากมันได!"
 wuw_HUN_reverse_the_risorgimento_tt: "§Y[ROOT.GetNameDefCap]§! จะปลดปลอยรัฐ§Yยุคกอนริซอรจีเมนโต§!ใน§Yคาบสมุทรอิตาลี§!ในฐานะ§Yรัฐในอารักขา§! และเสริมกําลังใหพวกเขา"

 wuw_HUN_integrate_bohemian_and_austrian_industries: "ผนวกรวมอุตสาหกรรมโบฮีเมียและออสเตรีย"
 wuw_HUN_integrate_bohemian_and_austrian_industries_desc: "รัฐองคประกอบอื่นๆ ของจักรวรรดิเรามีอุตสาหกรรมที่ทรงพลังเปนของตนเอง การผนวกรวมอุตสาหกรรมเหลานี้เขากับเราเปนการกระทําที่ชาญฉลาด เมื่อบัดนี้พวกเขาไดกลับคืนสูออมอกอีกครั้งแลว"

 wuw_HUN_renovato_imperii: "เรโนวาติโออิมเปรีอี"
 wuw_HUN_renovato_imperii_desc: "Renovatio imperii Romanorum หรือ "การฟนฟูจักรวรรดิแหงชาวโรมัน" เปนสูตรวาทะที่ประกาศเจตนาจะฟนฟูหรือคืนชีพจักรวรรดิโรมัน และถูกใชหลายครั้งนับตั้งแตมีการบัญญัติขึ้น เราควรทําเชนเดียวกัน และประกาศเจตนาอยางเปนทางการที่จะฟนฟูจักรวรรดิออสเตรีย-ฮังการี และนําไปสูความยิ่งใหญ!"
 wuw_HUN_renovato_imperii_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมรัฐในอารักขาของจักรวรรดิ§!กลับคืนสูอาณาจักร รวมถึงความสามารถในการ§Yทําใหดินแดนออสเตรีย-ฮังการีเกาเปนดินแดนหลัก§!"

 wuw_HUN_revenge_for_the_brusilov_offensive: "แกแคนใหการรุกของบรูซีลอฟ"
 wuw_HUN_revenge_for_the_brusilov_offensive_desc: "ชาวรัสเซียทําใหเราอับอายในชวงตนของมหาสงคราม โดยเฉพาะในการรุกของบรูซีลอฟที่ประสบความสําเร็จอยางสูง เราตองทําใหการแกแคนผูที่ทําผิดตอเรา โดยเฉพาะชาวรัสเซีย เปนจิตวิญญาณแหงชาติหนึ่งเดียว และในการนี้ เรายังสามารถพยายามสถาปนายูเครนแหงฮาพสบวรคขึ้นใหมไดดวย"

 wuw_HUN_purchase_burgenland: "ซื้อบูรเกนลันด"
 wuw_HUN_purchase_burgenland_desc: "ภูมิภาคที่ชาว[AUS.GetAdjective]เรียกวาบูรเกนลันดเคยเปนสวนหนึ่งของอาณาจักร[ROOT.GetAdjective]มาหลายศตวรรษ กอนจะถูกขโมยไปจากเราดวยสนธิสัญญาทรียานง เราควรยื่นขอเสนอตอรัฐบาลของพวกเขา โดยเสนอจายเงินกอนใหญแลกกับภูมิภาคนี้ เนื่องจากเศรษฐกิจของพวกเขากําลังยํ่าแย"

 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias: "มรดกแหงอารปาด อันดราช และมาทิอัส"
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc: "อารปาด พระเจาอันดราชที่ 3 ชาวเวนิส และมาทิอัส คอรวินุส เปนสามผูปกครองวีรบุรุษที่ยิ่งใหญที่สุดของชาติเราในอดีต หากโยเซฟ เอากุสทจะทรงยิ่งใหญไดสมกับตํานานของพวกทาน พระองคตองทวงคืนสิ่งที่เคยเปนของพวกทาน และสืบทอดจิตวิญญาณของพวกทานอยางเต็มที่สูอนาคต"

 wuw_HUN_a_declaration_of_intentions: "ประกาศเจตนารมณ"
 wuw_HUN_a_declaration_of_intentions_desc: "ถึงเวลาแลวที่เราจะประกาศเจตนารมณใหชัดเจนตอทั้งโลก และแสดงใหเห็นวาชาว[ROOT.GetAdjective]ทําจากสิ่งใดอยางแทจริง"

 wuw_HUN_undoing_the_yugoslav_mistake: "แกไขความผิดพลาดของยูโกสลาเวีย"
 wuw_HUN_undoing_the_yugoslav_mistake_desc: "การกอตั้งยูโกสลาเวียเปนหนึ่งในความผิดพลาดครั้งใหญที่สุดในประวัติศาสตรมนุษยชาติ และเราตองทําทุกวิถีทางเพื่อยึดคืนดินแดนเกาของรัฐสโลวีน โครแอต และเซิรบ ฮังการีจะผงาดขึ้นอีกครั้ง!"
 wuw_HUN_undoing_the_yugoslav_mistake_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมดินแดนฮังการีเกา§!ที่อยูภายในรัฐสโลวีน โครแอต และเซิรบเดิม"

 wuw_HUN_reclaim_the_slovak_possessions: "ทวงคืนดินแดนสโลวาเกีย"
 wuw_HUN_reclaim_the_slovak_possessions_desc: "สโลวาเกียเปนสวนหนึ่งของชาติเรามาชานาน และเกือบจะไดกลับมารวมกับเราอยางสมบูรณในสงครามหลังสนธิสัญญาทรียานง เราควรกลับไปเหยียบภูมิภาคนั้นอีกครั้ง และอางสิทธิ์ใหเปนของเราอีกครั้ง!"
 wuw_HUN_reclaim_the_slovak_possessions_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมดินแดนฮังการีเกา§!ที่อยูภายในสโลวาเกีย"

 wuw_HUN_revenge_for_1919: "แกแคนใหป 1919"
 wuw_HUN_revenge_for_1919_desc: "ในป 1919 ชาว[ROM.GetAdjective]ทําใหเราอับอายในความขัดแยงเหนือดินแดนทรานซิลเวเนียอันชอบธรรมของเรา และไมเพียงยึดครองทั้งภูมิภาค แตยังยึดบูดาเปสตและเดินขบวนแหไปทั่วเมืองหลวงของเรา ความอัปยศนี้ไมอาจปลอยไวได หากชาติ[ROOT.GetAdjective]จะผงาดสูความรุงโรจนอีกครั้ง"
 wuw_HUN_revenge_for_1919_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมดินแดนฮังการีเกา§!ที่อยูภายในทรานซิลเวเนีย"

 wuw_HUN_a_bulwark_against_communism: "ปราการตานคอมมิวนิสต"
 wuw_HUN_a_bulwark_against_communism_desc: "ภัยคุกคามจากบอลเชวิกแพรกระจายไปไกลเกินไปแลว และคุกคามจะลามตอไปอีกหากไมมีใครยอมหยุดยั้ง เราตองรับบทผูพิทักษโลก และปกปองโลกจากโรครายนี้!"

 wuw_HUN_on_a_high_horse: "บนหลังมาสูง"
 wuw_HUN_on_a_high_horse_desc: "ชาว[ROOT.GetAdjective]คือนายแหงโลกนี้อยางแทจริง ดังที่พัฒนาการลาสุดไดพิสูจนใหเราเห็น ถึงเวลาแลวที่เราจะเขายืนในตําแหนงที่ชอบธรรมใตดวงตะวัน และอาบแสงแหงความรุงโรจนขณะที่เราครองความเปนใหญเหนือโลก! ราชอาณาจักรอัครสาวกจะปกครองเหนือบุตรของพระเจา"

 wuw_HUN_cancel_the_german_trade_deal: "ยกเลิกขอตกลงการคากับ[GER.GetAdjective]"
 wuw_HUN_cancel_the_german_trade_deal_desc: "ดยูลอ เกิมเบิช นายกรัฐมนตรีคนกอนผูเปนฟาสซิสต ไดทําสัญญากับปศาจเมื่อเขาจัดทําสนธิสัญญาการคากับชาว[GER.GetAdjective] มันผูกมัดเราไวกับพวกเขา และคอยๆ ทําลายจิตวิญญาณของชาติเราอยางแนนอน เราตองยุติขอตกลงนี้ใหเร็วที่สุด"

 wuw_HUN_establishing_a_royal_guard: "จัดตั้งราชองครักษ"
 wuw_HUN_establishing_a_royal_guard_desc: "เปนที่รูกันทั่วไปวากษัตริยทุกพระองคตองมีองครักษสวนพระองค และฮอรตีก็ไมตางกัน ถึงเวลาแลวที่เราจะทําใหสิ่งนี้เปนจริง เมื่อชาติของเรามีกษัตริยประทับบนบัลลังกอีกครั้ง"

 wuw_HUN_magyar_cserkeszszovetseg: "สมาคมลูกเสือฮังการี (Magyar Cserkészszövetség)"
 wuw_HUN_magyar_cserkeszszovetseg_desc: "สมาคมลูกเสือฮังการีซึ่งกอตั้งในป 1912 ไดฝกฝนเยาวชน[ROOT.GetAdjective]ผูมีพรสวรรคมากมายใหดูแลตนเองได และชวยเหลือในปฏิบัติการกึ่งทหาร ถึงเวลาแลวที่เราจะผนวกพวกเขาเขากับราชองครักษอยางเปนทางการ โดยมอบบรรดาศักดิ์ขุนนางแกผูนําขององคกร"
 wuw_HUN_magyar_cserkeszszovetseg_tt: "ปรับ§Yราชองครักษ§!ดังนี้ \nสัดสวนประชากรที่เกณฑได §G+10%§! \nการปองกันการเปลี่ยนแปลงทางอุดมการณ §G+15%§! \n§Y$category_support_battalions$:§! การจัดระเบียบ: §G+10§!, HP: §G+5§!"

 wuw_HUN_dissolve_the_volksbund: "ยุบโฟลคสบุนด"
 wuw_HUN_dissolve_the_volksbund_desc: "โฟลคสบุนดเปนองคกรที่เกี่ยวของกับ DNSAP ของชาว[GER.GetAdjective]เชื้อสายในชาติของเรา พวกเขาไดรับเงินทุนจาก[GER.GetNameDef] และทํางานรับใชภายในประเทศของเรา เราตองยุบพวกเขากอนที่จะสรางความเสียหายตอเสถียรภาพของชาติ"

 wuw_HUN_an_airforce_to_be_reckoned_with: "กองทัพอากาศแหงอนาคต"
 wuw_HUN_an_airforce_to_be_reckoned_with_desc: "กองทัพอากาศของเราจําเปนตองไดรับการปรับปรุงใหทันสมัยและเสริมความแข็งแกรงเพื่อใหแขงขันกับศัตรูไดดียิ่งขึ้น การรบรวมเหลาทัพคือหนทางแหงอนาคต และเปนขอเท็จจริงที่เราตองยอมรับ"

 wuw_HUN_a_mobile_army: "กองทัพเคลื่อนที่เร็ว"
 wuw_HUN_a_mobile_army_desc: "เนื่องจากกองทัพของเราไมอาจเอาชนะมหาอํานาจโลกใดไดดวยจํานวนทหาร เราจึงควรมุงเนนความเหนือกวาทางเทคโนโลยี ยานเกราะและยานพาหนะภาคพื้นดินอื่นๆ ที่สามารถเจาะทะลวงและโอบลอมหนวยขาศึกคืออนาคตของการสงคราม และเราตองยอมรับขอเท็จจริงนี้"

 wuw_HUN_royalist_education_initiative: "โครงการการศึกษาแนวกษัตริยนิยม"
 wuw_HUN_royalist_education_initiative_desc: "ประชาชนไมเพียงตองไดรับการสอนใหรูจักวางตัว แตยังตองไดเรียนรูสิ่งสําคัญที่สุดเพื่อเตรียมพรอมสูอนาคตอันรุงโรจนที่เราปรารถนา และในระหวางนั้นก็บมเพาะนักวิทยาศาสตร[ROOT.GetAdjective]รุนใหมผูปราดเปรื่องจํานวนมาก"

 wuw_HUN_a_unifying_heritage: "มรดกแหงเอกภาพ"
 wuw_HUN_a_unifying_heritage_desc: "ชาว[ROOT.GetAdjective]อาจกระจัดกระจายอยูในหลายชาติ แตนั่นไมไดขัดขวางเราจากความรูสึกเปนนํ้าหนึ่งใจเดียวกัน เราควรยึดมั่นในลัทธิรวมชาติฮังการี และมุงรวมชาว[ROOT.GetAdjective]ทั้งหมดไวใตธงผืนเดียวโดยเร็วที่สุด"

 wuw_HUN_stage_an_uprising_in_leitha: "กอการลุกฮือในไลทา"
 wuw_HUN_stage_an_uprising_in_leitha_desc: "การลุกฮือตอตานชาวออสเตรียในลอยตาบานแชกเมื่อป 1921 พิสูจนแลววาประชาชนใน [975.GetName] ปรารถนาจะเปนสวนหนึ่งของชาติอันยิ่งใหญของเรา เราควรสงสายลับเขาไปพยายามกอการเชนนี้เปนครั้งที่สอง พรอมเสนอการคุมครองแกพวกเขาทันทีและเคลื่อนกําลังเขายึดครองภูมิภาคนี้"
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§Rสิ่งนี้อาจนําไปสูสงครามกับเจาของ [975.GetName]!§!"

 wuw_HUN_anglo_hungarian_alliance: "พันธมิตรอังกฤษ-ฮังการี"
 wuw_HUN_anglo_hungarian_alliance_desc: "ตระกูลฮอรตีมีความสัมพันธใกลชิดกับชาวอังกฤษมาโดยตลอด และเมื่อความตึงเครียดรอบตัวเราเพิ่มสูงขึ้น ก็ถึงเวลาแลวที่ประเทศของเราจะแสวงหาพันธมิตร ชาวอังกฤษยอมเปนหุนสวนความรวมมือโดยธรรมชาติ เพราะความชวยเหลือของพวกเขาจะทําใหเรามุงเนนกิจการของเราเองบนภาคพื้นทวีปได ขณะที่พวกเขามุงเนนที่อื่น"

 wuw_HUN_establishing_a_new_dynasty: "สถาปนาราชวงศใหม"
 wuw_HUN_establishing_a_new_dynasty_desc: "เนื่องจากราชวงศฮาพสบวรคไมไดรับอนุญาตใหกลับขึ้นครองบัลลังก จึงไมมีผูใดมีสิทธิ์เหนือราชอาณาจักรของเราอยางชัดเจน ทางเลือกหนึ่งคือสวมมงกุฎใหผูสําเร็จราชการของเราเปนกษัตริย แมจะไมเปนที่นิยม หรือเลือกทางที่ปลอดภัยกวาดวยการสวมมงกุฎใหบุตรชายของเขา อิชตวาน ฮอรตี ผูเปนที่นิยมและเปนที่รักใคร ขึ้นเปนกษัตริยองคใหมแหงฮังการี"
 wuw_HUN_establishing_a_new_dynasty_tt: "เราจะสามารถเลือกสวมมงกุฎให §Yมิโคลช ฮอรตี§! หรือบุตรชายของเขา §Yอิชตวาน ฮอรตี§! เปน§Yกษัตริยแหงฮังการี§!"
 HUN_fascist_uprising_mission_activation_tt: "§Rพวกฟาสซิสตฮังการีจะเริ่มเตรียมการรัฐประหาร!§!"

 wuw_HUN_elect_a_fascist_king: "เลือกกษัตริยฟาสซิสต"
 wuw_HUN_elect_a_fascist_king_desc: "ชาติของเราตองการผูนําที่ทรงพลังเพื่อนําพาฝาชวงปแหงความปนปวนที่กําลังจะมาถึง ผูปกครองของเราตองเปนผูที่ประชาชนเคารพยกยอง และศัตรูเกรงกลัว"

 wuw_HUN_guarantee_religious_liberties: "รับประกันเสรีภาพทางศาสนา"
 wuw_HUN_guarantee_religious_liberties_desc: "ผูคนมากมายหลบหนีออกจากประเทศเมื่อประเทศหันไปกดขี่ผูที่ไมไดนับถือคาทอลิก เพื่อพลิกกลับภาวะสมองไหลนี้ เราตองแกไขกฎหมายเหลานี้ และมุงสูรัฐฆราวาส ซึ่งจะชวยใหผูมีมันสมองปราดเปรื่องจํานวนมากที่หนีออกไปกลับคืนสูเรา"

 wuw_HUN_joint_oil_exploitation_company: "บริษัทขุดเจาะนํ้ามันรวม"
 wuw_HUN_joint_oil_exploitation_company_desc: "ดวยโอกาสที่อาจพบแหลงนํ้ามันในดินแดนของเรา เราจึงดึงดูดความสนใจจากตางชาติ มหาอํานาจที่เปนมิตรตางกระตือรือรนจะสนับสนุนอุตสาหกรรมนํ้ามันของเราดวยความรูทางเทคนิค และนี่คือโอกาสอันคุมคาที่จะเรียนรูจากความกาวหนาของพวกเขา"

 wuw_HUN_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 wuw_HUN_join_the_allies_desc: "อนาคตของฮังการีและคุณคาประชาธิปไตยของเราอยูกับประเทศประชาธิปไตยใหญในตะวันตกและพันธมิตรของพวกเขา ในฐานะสมาชิกของพันธมิตรนี้ เราสามารถเสริมกําลังใหพวกเขา และพึ่งพาการสนับสนุนจากพวกเขาไดเชนกัน"

 wuw_HUN_a_responsible_government: "รัฐบาลที่รับผิดชอบตอประชาชน"
 wuw_HUN_a_responsible_government_desc: "ตามธรรมเนียมแลว รัฐบาลตองรับผิดชอบตอกษัตริยในทายที่สุด ทําใหรัฐบาลเพิกเฉยตอเจตจํานงของประชาชนได เราจะแกไขรัฐธรรมนูญเพื่อใหประชาชน ไมใชผูปกครอง เปนผูใหรัฐบาลตองรับผิดชอบ"

 wuw_HUN_the_balkan_pact: "กติกาสัญญาบอลขาน"
 wuw_HUN_the_balkan_pact_desc: "ประเทศประชาธิปไตยในตะวันตกอยูไกลเกินกวาจะชวยเหลือเราได เราจึงตองแสวงหาพันธมิตรที่ใกลบานกวา ในฐานะผูนํากติกาสัญญาบอลขาน เราจะเสนอการคุมครองแกพวกเขาและนําพวกเขาสูชัยชนะ!"
 wuw_HUN_the_balkan_pact_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเชิญประเทศในคาบสมุทรบอลขาน§!เขารวมฝายของเรา"
 wuw_HUN_the_balkan_pact_invitation_tt: "[ROM.GetNameDef] จะไดรับเหตุการณ: §Y[ROOT.GetNameDefCap]เชิญ[ROM.GetNameDef]เขารวมกติกาสัญญาบอลขาน§!"

 wuw_HUN_end_the_white_terror: "ยุติความหวาดกลัวขาว"
 wuw_HUN_end_the_white_terror_desc: "แมคนสวนใหญในประเทศนี้จะอางวาความหวาดกลัวขาวสิ้นสุดลงแลว แตเรารูความจริง... มิโคลช ฮอรตีและพวกอันธพาลกึ่งทหารของเขายังคงไลลาผูที่ฝนถึงวันพรุงนี้ที่ดีกวา และเราตองยุติการปกครองของเขาดวยการปฏิวัติอยางรุนแรง หากการถูกขมเหงของเราจะสิ้นสุดลง"

 wuw_HUN_parade_istvan_bethlens_platform: "ฝายคานใหมของอิชตวาน เบทเลิน"
 wuw_HUN_parade_istvan_bethlens_platform_desc: "ดวยความไมพอใจตอสถานการณปจจุบัน และความระแวงที่เพิ่มขึ้นตอวาทกรรมเผด็จการที่เขมขนขึ้นของนายกรัฐมนตรีดยูลอ เกิมเบิช อดีตนายกรัฐมนตรีอิชตวาน เบทเลินไดจัดตั้งฝายคานใหมขึ้น เราตองใชโอกาสนี้บอนทําลายทานพลเรือเอกและสมุนฟาสซิสตของเขาใหมากยิ่งขึ้น"

 wuw_HUN_politicize_the_levente_associations: "ทําใหสมาคมเลเวนเตเปนเครื่องมือทางการเมือง"
 wuw_HUN_politicize_the_levente_associations_desc: "สมาคมเยาวชนกึ่งทหารเลเวนเตชวยจัดระเบียบเยาวชน[ROOT.GetAdjective]และฝกใหรับมือความขัดแยงเมื่อมันมาถึงชาติของเราอยางหลีกเลี่ยงไมได เราควรพยายามแทรกซึมกลุมเหลานี้ และทําใหสมาชิกรูวาพวกเขาควรจงรักภักดีตอใคร"
 wuw_HUN_politicize_the_levente_associations_tt: "เมื่อ§Yสงครามกลางเมือง[ROOT.GetAdjective]§!เริ่มขึ้น §Yสมาคมเลเวนเต§!จะจงรักภักดีตอฝายเรา และเราจะไดรับกําลังพลเพิ่มอีก §G+8000§!"

 wuw_HUN_salami_slicing_tactics: "ยุทธวิธีหั่นซาลามี"
 wuw_HUN_salami_slicing_tactics_desc: "ดวยการดําเนินการตอตานฮอรตีเล็กๆ หลายครั้งตอเนื่องกัน เพื่อใหเกิดผลลัพธที่ใหญกวามาก ซึ่งจะยากหรือแมแตผิดกฎหมายหากทําทั้งหมดในคราวเดียว เราอาจบอนทําลายการปกครองจนแทบไมมีทหารคนใดเต็มใจปกปองนโยบายของเขา"
 wuw_HUN_salami_slicing_tactics_tt: "เมื่อ§Yสงครามกลางเมือง[ROOT.GetAdjective]§!เริ่มขึ้น §Yกองทัพ§!สวนที่ใหญขึ้นเล็กนอยจะจงรักภักดีตอเรา"

 wuw_HUN_undermine_the_volksbund: "บอนทําลายกองกําลังกึ่งทหารฟาสซิสต"
 wuw_HUN_undermine_the_volksbund_desc: "กลุมกึ่งทหารฟาสซิสตจํานวนมาก เชน องคกรเยอรมัน-ฮังการีที่ชื่อโฟลคสบุนด ซึ่งมีความสัมพันธใกลชิดกับฟาสซิสตเยอรมัน มีแนวโนมจะจับอาวุธตอตานเราหากเราพยายามกอการปฏิวัติ เราตองพยายามทําลายพวกเขาทั้งหมด ไมวาจากภายในหรือภายนอก กอนที่จะสายเกินไป"
 wuw_HUN_undermine_the_volksbund_tt: "เมื่อ§Yสงครามกลางเมือง[ROOT.GetAdjective]§!เริ่มขึ้น ฝายตรงขามจะไมไดรับหนวย§Yโฟลคสบุนด§!เพิ่มเติม และเราจะไดรับการสนับสนุนสงครามเพิ่มอีก §G+15%§! และอํานาจทางการเมือง §G+75§!"

 wuw_HUN_reviving_the_spirit_of_1848: "ปลุกจิตวิญญาณแหงป 1848"
 wuw_HUN_reviving_the_spirit_of_1848_desc: "การปฏิวัติและสงครามประกาศเอกราชฮังการีป 1848–1849 เปนหนึ่งในการปฏิวัติยุโรปหลายครั้งในป 1848 และแมจะลมเหลวในการมอบเอกราชที่เราปรารถนา แตก็ปูทางสูจิตวิญญาณและอุดมการณที่เราทุกคนยึดถือในวันนี้ เราควรจุดเปลวไฟแหงการปฏิวัติขึ้นอีกครั้ง และโคนลมทรราชที่ขวางทางเสรีภาพของเรา!"
 wuw_HUN_reviving_the_spirit_of_1848_tt: "กลุมกษัตริยนิยมและฟาสซิสตตางๆ ในประเทศจะติดตาม §Yมิโคลช ฮอรตี§! ใน§Rสงครามกลางเมือง§!ตอตานเรา!"
 wuw_HUN_reviving_the_spirit_of_1848_requirements_tt: "การสนับสนุน§Yคอมมิวนิสต§!หรือ§Yประชาธิปไตย§!มากกวาการสนับสนุน§YNEP§!และ§YMNSP§!"

 wuw_HUN_officialize_the_rakosi_battalion: "ทําใหกองพันรากอชีเปนทางการ"
 wuw_HUN_officialize_the_rakosi_battalion_desc: "บุรุษ[ROOT.GetAdjective]ผูกลาหาญมุงมั่นเพื่อวันพรุงนี้ที่ดีกวาเสมอ แมจะอยูตางแดน นี่คือเหตุผลที่เราตองพยายามสนับสนุนบุรุษเชนนี้อยางเปนทางการ และนําการปฏิวัติไปสูผูที่ตองการ"

 wuw_HUN_elections_in_the_revolutionary_council: "การเลือกตั้งในสภาปฏิวัติ"
 wuw_HUN_elections_in_the_revolutionary_council_desc: "เมื่อสงครามกลางเมืองสิ้นสุดลงแลว ก็ถือวาปลอดภัยที่จะจัดการเลือกตั้งภายในสภาปฏิวัติที่จัดตั้งขึ้นเพื่อกํากับดูแลการเปลี่ยนผานของประเทศสูสาธารณรัฐ ขณะนี้ดูเหมือนผูสมัครฝายคอมมิวนิสตจะไดเปรียบ แตบางทีประชาธิปไตยก็ยังเปนทางเลือกได?"

 wuw_HUN_join_the_comintern: "เขารวมโคมินเทิรน"
 wuw_HUN_join_the_comintern_desc: "หนทางขางหนาของการปฏิวัติอยูกับโคมินเทิรน ดวยการยืนหยัดเคียงขางสหายของเรา เราจะกวาดลางความอยุติธรรมของทุนนิยมและภัยคุกคามฟาสซิสตที่กอตัวอยูทางตะวันตก"

 wuw_HUN_restore_the_socialist_federative_republic: "ฟนฟูสาธารณรัฐสหพันธสังคมนิยม"
 wuw_HUN_restore_the_socialist_federative_republic_desc: "โคมินเทิรนไดละทิ้งการตอสูกับจักรวรรดินิยม และเลือกที่จะยอมอยูรวมกันแทน หากแรงงานทั่วโลกจะเปนอิสระ เราตองถือคบเพลิงของมารกซและเลนินตอไป - แมจะตองตอตานสหภาพโซเวียตก็ตามหากจําเปน"

 wuw_HUN_restore_the_hungarian_red_army: "ฟนฟูกองทัพแดงฮังการี"
 wuw_HUN_restore_the_hungarian_red_army_desc: "ผูรักชาติทุกคนที่รักมาตุภูมิตองทําหนาที่ปกปองบานเกิดของตน เราจะจัดตั้งกองทัพแดงฮังการี ตามแบบอยางของโซเวียตทางตะวันออก ซึ่งจะปกปองการปฏิวัติที่เพิ่งตั้งไขของเรา"

 wuw_HUN_instate_a_socialist_economy: "สถาปนาเศรษฐกิจสังคมนิยม"
 wuw_HUN_instate_a_socialist_economy_desc: "เพื่อเปลี่ยนแปลงสังคมใหดีขึ้นอยางแทจริง เราตองเปลี่ยนวิธีการไหลเวียนของเงิน และปลดหัวหนาบริษัทที่ไดตําแหนงมาดวยระบบเสนสายเทานั้น ชนชั้นแรงงานจะไดมีเสียงในประเทศของตนอีกครั้ง และชาว[ROOT.GetAdjective]ทุกคนจะเทาเทียมกัน!"

 wuw_HUN_nationalize_key_industries: "โอนอุตสาหกรรมหลักเปนของรัฐ"
 wuw_HUN_nationalize_key_industries_desc: "ยังคงมีโรงงานและกิจการมากมายในประเทศของเราที่ดําเนินการโดยบริษัทและนักธุรกิจตางชาติ แมเราจะพยายามทําใหเศรษฐกิจเปนสังคมนิยมแลว กาวตอไปสูสังคมนิยมจึงเปนการโอนทรัพยสินของตางชาติเปนของรัฐ"

 wuw_HUN_invest_in_universal_education: "ลงทุนในการศึกษาถวนหนา"
 wuw_HUN_invest_in_universal_education_desc: "ประชาชนคือผูปกครองประเทศนี้ และหากพวกเขาไมไดรับการศึกษาใหรูวาอะไรดีที่สุดสําหรับตนเอง พวกเขายอมนําประเทศไปสูความพินาศ เราจึงตองลงทุนในการศึกษาถวนหนาโดยไมเสียคาใชจายสําหรับทุกคน เพื่อใหชาว[ROOT.GetAdjective]ทุกคนไดรับการศึกษาและตัดสินไดวาอะไรดีที่สุดเมื่อลงคะแนนเสียง"

 wuw_HUN_kadars_hussars: "ทหารฮุสซารของกาดาร"
 wuw_HUN_kadars_hussars_desc: "ปุฟอยกาช หรือกรมทหารอํานาจปฏิวัติของเรา คือหนวยสารวัตรทหารของกองทัพแดง จัดตั้งโดยกระทรวงกลาโหม มีภารกิจหลักคือปราบปรามกิจกรรมของผูเห็นตาง เราควรลงทุนในหนวยเหลานี้เพิ่มเติม เพื่อใหมั่นใจในความปลอดภัยอยางสมบูรณของประชาชนและรัฐ"

 wuw_HUN_reinstate_the_lenin_boys: "ฟนฟูหนวยเด็กหนุมเลนิน"
 wuw_HUN_reinstate_the_lenin_boys_desc: "หนวยเด็กหนุมเลนินเปนกองกําลังกึ่งทหารของพรรคคอมมิวนิสตที่ปฏิบัติการในสาธารณรัฐโซเวียตป 1919 และถูกใชในการถอนรากถอนโคนและปราบปรามผูเห็นตางฝายตอตานการปฏิวัติภายในประเทศ เราควรนําองคกรกึ่งทหารนี้กลับมา และผนวกเขากับกองทัพของเรา"
 HUN_lenin_boys_militia_recruitment: "ไดรับหนวย§Yกองกําลังอาสา§! เลนิน-ฟอูก สองหนวย"

 wuw_HUN_promote_revanchist_sentiment: "สงเสริมกระแสทวงคืนดินแดน"
 wuw_HUN_promote_revanchist_sentiment_desc: "สิ่งนาขยะแขยงที่เรียกวาสนธิสัญญาทรียานงไดพรากประชากรของเราไปกวาครึ่ง และทําใหชาว[ROOT.GetAdjective]นับพันไรที่อยูและตองพลัดถิ่น เราตองแกไขความอยุติธรรมทางประวัติศาสตรครั้งใหญนี้ใหจบสิ้น และปลูกฝงความรูสึกทวงคืนดินแดนอันยิ่งใหญใหแกประชาชนของเรา"

 wuw_HUN_denounce_marxism_leninism: "ประณามลัทธิมารกซ-เลนิน"
 wuw_HUN_denounce_marxism_leninism_desc: "อิโอซิฟ สตาลินผูชั่วรายไดเหยียบยํ่าอุดมการณของเราและฉวยเอาถอยคําของเราไปใชมานานเกินไปแลว นโยบายฟาสซิสตและเผด็จการของเขาพิสูจนใหเราเห็นวาเขาเปนเพียงคนโกหกและผูทรยศการปฏิวัติ ถึงเวลาแลวที่เราจะยุติละครอันนาสมเพชของเขา"

 wuw_HUN_proclaim_greater_hungary_core_states_requirement: "รัฐฮังการีตั้งตนทั้งหมดอยูภายใตการควบคุมโดยสมบูรณ"
 wuw_HUN_a_revolutionary_greater_hungary_tt: "เราจะเปนที่รูจักในนาม§Yสหภาพสาธารณรัฐสังคมนิยมแพนโนเนีย§!"

 wuw_HUN_a_revolutionary_greater_hungary: "สหภาพสังคมนิยมแพนโนเนีย"
 wuw_HUN_a_revolutionary_greater_hungary_desc: "เมื่อพรมแดนของเราไดรับการฟนฟูอีกครั้ง ก็ถึงเวลามุงสูเปาหมายที่แทจริง เราตองควาโอกาสนี้ประกาศสหภาพสาธารณรัฐสังคมนิยมแพนโนเนีย ใหเปนรัฐของประชาชนทุกคนไมวาจะมาจากชาติใด ซึ่งจะทําใหเราหันความสนใจสูเปาหมายที่ยิ่งใหญกวา นั่นคือการเผยแพรการปฏิวัติโลก"

 HUN_hero_of_the_revolution: "วีรบุรุษแหงการปฏิวัติ"
 HUN_hero_of_the_revolution_desc: "ดวยการทวงคืนดินแดนเกาและการประกาศสหภาพสาธารณรัฐสังคมนิยมแพนโนเนีย เปนที่ประจักษแลววาเบลอ คุน คือวีรบุรุษแหงการปฏิวัติสากล"

 HUN_balkan_ambitions: "ความทะเยอทะยานในบอลขาน"
 HUN_balkan_ambitions_desc: "แรงงานในบอลขานอยูใตรองเทาบูตของพวกทุนนิยม กษัตริยนิยม และฟาสซิสต ซึ่งลวนเปนศัตรูอยางเปดเผยของการปฏิวัติโลก เราตองปลดปลอยพวกเขาหากเราตองการสันติภาพในบอลขาน"

 wuw_HUN_revenge_for_the_romanian_humiliations: "แกแคนความอัปยศจากโรมาเนีย"
 wuw_HUN_revenge_for_the_romanian_humiliations_desc: "ในสงครามฮังการี–โรมาเนียป 1918-1919 เราถูกทําใหอับอายและดินแดนทรานซิลเวเนียของเราถูกขโมยไป เพื่อกอบกูเกียรติยศ เราตองทวงคืนดินแดนเหลานี้ ซึ่งเปนของเราโดยชอบธรรม"

 wuw_HUN_the_second_northern_campaign: "การทัพภาคเหนือครั้งที่สอง"
 wuw_HUN_the_second_northern_campaign_desc: "การทัพภาคเหนือครั้งแรกของเราในป 1919 นาเสียดายที่ลมเหลว และชาวสโลวักตกอยูในมือของชาวเช็ก เราตองรีบลงมือ เพื่อปลดปลอยไมเพียงชาวฮังการี แตรวมถึงชาวสโลวักในดินแดนที่สูญเสียไปในสนธิสัญญาทรียานงดวย"

 wuw_HUN_march_south: "เดินทัพลงใต"
 wuw_HUN_march_south_desc: "เราไมเพียงเคยสูญเสียดินแดนทางเหนือ ตะวันออก และตะวันตก แตยังรวมถึงทางใต ซึ่งสวนใหญเกิดจากการกอตั้งยูโกสลาเวีย เราตองแกไขความอยุติธรรมที่เกิดกับประชาชนของเราในวอยวอดีนาและบานัตโดยเร็วที่สุด"

 wuw_HUN_soviet_hungarian_military_academy: "โรงเรียนนายรอยโซเวียต-ฮังการี"
 wuw_HUN_soviet_hungarian_military_academy_desc: "กองทัพของเราไมมีความหมายหากไรผูนํา โซเวียตมีประสบการณดานการทหารมากกวาเรามาก การรวมมือกับพวกเขาในการฝกนายทหารหัวกะทิของเราจึงอาจเปนประโยชน ดวยเหตุนี้เราจะจัดตั้งสถาบันการทหารพรอมครูฝกที่เชี่ยวชาญที่สุดจากทั้งสองชาติ"

 wuw_HUN_goulash_communism: "คอมมิวนิสตกูลาช"
 wuw_HUN_goulash_communism_desc: "ดวยการขาดแคลนบุคลากรที่มีทักษะหลังสงครามกลางเมืองอันนองเลือด คนหนุมสาวผูมีพรสวรรคมากมายจึงเลื่อนตําแหนงอยางรวดเร็ว หนึ่งในนั้นคือยาโนช กาดาร และเขาไดนําแนวคิด "คอมมิวนิสตกูลาช" มาดวย ซึ่งเปนระบบที่มุงรับประกันมาตรฐานความเปนอยูที่สูง และในทางกลับกันก็รวมประชาชนใหเปนหนึ่งเดียวภายใตรัฐบาลของเรา ในฮังการี พลเมืองทุกคนจะตองมีกูลาชอรอยๆ กินสักชาม!"

 wuw_HUN_joint_hungarian_soviet_research_effort: "ความรวมมือดานการวิจัยโซเวียต-ฮังการี"
 wuw_HUN_joint_hungarian_soviet_research_effort_desc: "เพื่อเสริมความแข็งแกรงใหสถาบันวิทยาศาสตรแหงชาติของเรา เราควรเชิญนักคิดและวิศวกรโซเวียต และใชความชวยเหลือของพวกเขาพัฒนาแนวคิดและเทคโนโลยีใหมที่ชาติของเราจะนําไปใชได"

 wuw_HUN_soviet_hungarian_war_indsutry: "อุตสาหกรรมสงครามโซเวียต-ฮังการี"
 wuw_HUN_soviet_hungarian_war_indsutry_desc: "เพื่อกระชับความรวมมือใหแนนแฟนยิ่งขึ้น เราควรขอใหโซเวียตลงทุนในอุตสาหกรรมทหารของเรา เพื่อใหเราปฏิบัติตามพันธกรณีและปกปองพันธมิตรคอมมิวนิสตของเราจากผูใดก็ตามที่กลาคุกคามพวกเขา"

 wuw_HUN_state_protection_authority: "สํานักงานคุมครองรัฐ"
 wuw_HUN_state_protection_authority_desc: "เพื่อรับประกันความปลอดภัยของพลเมืองผูภาคภูมิของเรา และทําใหแนใจวากลุมตอตานการปฏิวัติจะไมกลับมาผุดขึ้นอีก เราตองจัดตั้งตํารวจลับที่มีอํานาจเต็มในการถอนรากถอนโคนบุคคลใดก็ตามที่พวกเขาเห็นวากระทําการตอตานรัฐบาลของเรา"

 wuw_HUN_central_military_planning_committee: "คณะกรรมการวางแผนการทหารกลาง"
 wuw_HUN_central_military_planning_committee_desc: "หากการปฏิวัติโลกโดยรวมจะประสบความสําเร็จ เราตองจัดตั้งคณะกรรมาธิการเพื่อความรวมมือทางยุทธศาสตรและการทหารที่มากขึ้นระหวางเรากับพันธมิตร รวมถึงทําใหมั่นใจวากองทัพของเราปฏิบัติการไดอยางเต็มประสิทธิภาพ พรอมโจมตีศัตรูไดทุกเมื่อ"

 wuw_HUN_a_cult_of_personality: "ลัทธิบูชาตัวบุคคล"
 wuw_HUN_a_cult_of_personality_desc: "ลูกหลานแหง[ROOT.GetNameDef]ตองการบุคคลที่พวกเขายกยองได จิตวิญญาณแหงการปฏิวัติที่พวกเขาจะมอบความเคารพสูงสุดให ดังนั้นเราตองรวมศูนยอํานาจไวที่มาทยาช ราโกชี และสรางลัทธิบูชาตัวบุคคลที่จะสงผานเจตจํานงของเขาไปสูจิตใจของประชาชน และสอนพวกเขาถึงคุณคาที่แทจริงที่ตองยึดถือ"

 wuw_HUN_pressure_romania: "กดดัน[ROM.GetNameDef]"
 wuw_HUN_pressure_romania_desc: "ขณะที่เรามุงความสนใจไปยังภัยฟาสซิสตทางตะวันตก เราไมอาจปลอยใหภัยคุกคามที่อาจเกิดขึ้นคงอยูดานหลังของเรา โดยเฉพาะเมื่อมันตั้งอยูระหวางเรากับพันธมิตรทางตะวันออก โรมาเนียตองกลายเปนรัฐคอมมิวนิสตรวมอุดมการณ มิฉะนั้นตองยอมมอบเสนทางบกสําคัญสูพันธมิตรของเรา เพื่อใหเราไดรับการสนับสนุนจากพวกเขา"

 wuw_HUN_intervene_in_czechoslovakia: "แทรกแซง[CZE.GetNameDef]"
 wuw_HUN_intervene_in_czechoslovakia_desc: "ชาวเชโกสโลวักไดรับดินแดนบางสวนที่ถูกพรากไปจากเราในสนธิสัญญาทรียานง ขณะเดียวกัน เราก็รูถึงแผนการของเยอรมันตอดินแดนของพวกเขา บางทีเราอาจตกลงแลกเปลี่ยนกันได ดินแดนอันชอบธรรมของเราแลกกับการรับประกันการสนับสนุนทางทหารจากโซเวียตในกรณีที่เยอรมนีรุกราน"

 wuw_HUN_the_bulwark_against_the_west: "ปราการตานตะวันตก"
 wuw_HUN_the_bulwark_against_the_west_desc: "ในฐานะสมาชิกผูภาคภูมิของขบวนการคอมมิวนิสตสากล เราตองพรอมทุกเมื่อที่จะปกปองวิถีชีวิตของเรา และภัยคุกคามที่ใหญที่สุดในขณะนี้คือพวกฟาสซิสตและทุนนิยมแหงตะวันตก เราตองยืนหยัดเปนปราการ เปนสิ่งที่ไมอาจเคลื่อนยายและไมมีวันสั่นคลอน หากเราตองการยืนหยัดอยางแข็งแกรงตอไป"

 wuw_HUN_establish_the_second_republic: "สถาปนาสาธารณรัฐที่สอง"
 wuw_HUN_establish_the_second_republic_desc: "ตองไมลืมวาสาธารณรัฐฮังการีที่หนึ่งซึ่งดํารงอยูเปนชวงๆ ระหวางป 1918 ถึง 1920 ถูกบดขยี้ดวยความรวมมือกันของพวกคอมมิวนิสตและพวกชาตินิยม ฝายหนึ่งตองการสถาปนาสาธารณรัฐโซเวียต อีกฝายตองการฟนฟูราชอาณาจักร และฝายหลังประสบความสําเร็จมากกวา เราตองลงมือรักษาประชาธิปไตยของเราเสียแตบัดนี้ มิฉะนั้นมันจะถูกพรากไปจากเราตลอดกาลอีกครั้ง!"

 wuw_HUN_reverse_the_brain_drain: "พลิกกลับภาวะสมองไหล"
 wuw_HUN_reverse_the_brain_drain_desc: "นักวิทยาศาสตรชั้นนํามากมายออกจากประเทศเมื่อประเทศเริ่มออกกฎหมายที่บีบคั้นและเลือกปฏิบัติเพื่อพยายามควบคุมสังคมใหมากขึ้น ผลที่ตามมาคือปญญาชนของเราไดรับความเสียหายอยางหนัก เราตองพยายามนําคนเหลานี้กลับมา และรวมพลังวิทยาศาสตร[ROOT.GetAdjective]ใหกาวหนายิ่งขึ้น!"

 wuw_HUN_the_spirit_of_the_aster_revolution: "จิตวิญญาณแหงการปฏิวัติดอกแอสเตอร"
 wuw_HUN_the_spirit_of_the_aster_revolution_desc: "เมื่อมหาสงครามสิ้นสุด มิฮาย กาโรยีและประชาชนฮังการีไดแสวงหาประชาธิปไตยและเอกราช แมสาธารณรัฐจะสิ้นสุดลง แตเราควรปลุกจิตวิญญาณและความเปนนํ้าหนึ่งใจเดียวที่ประชาชนของเรารูสึกในชวงการปฏิวัติดอกเบญจมาศนี้ และมุงสูอนาคตไปดวยกัน"

 wuw_HUN_promote_entrepreneurship: "สงเสริมการเปนผูประกอบการ"
 wuw_HUN_promote_entrepreneurship_desc: "สิ่งสําคัญที่สุดอยางหนึ่งที่สังคมซึ่งกําลังเติบโตและพัฒนาไมหยุดยั้งตองการ คือผูประกอบการที่พรอมและเต็มใจรับความเสี่ยงเพื่อพัฒนาชาติที่ตนอาศัยอยู และจะนําทุนกลับมาลงทุนในแผนดิน เราควรสงเสริมพฤติกรรมเชนนี้เพื่อทําใหบานเกิดของเรามั่งคั่งที่สุดเทาที่จะเปนไปได"

 wuw_HUN_uplift_the_dragon_movement: "ยกระดับขบวนการมังกร"
 wuw_HUN_uplift_the_dragon_movement_desc: "ขบวนการมังกร หรือที่รูจักในนามสหภาพชาวฮังการีพื้นเมือง เปนกลุมที่เปนตัวแทนผลประโยชนของชนชั้นกลางเปนหลัก ดวยคําขวัญ 'ฮังการีเปนของชาวฮังการี!' พวกเขาเรียกรองใหชาวฮังการีปกครองแวดวงปญญาชน และนโยบายลุมแมนํ้าดานูบที่มุงเนนฮังการี เพื่อมหาฮังการีที่ยึดถือคุณคาดั้งเดิม เราควรสนับสนุนพวกเขา เพราะแนวคิดของพวกเขาสอดคลองกับของเราอยางมาก"

 wuw_HUN_a_danubian_federation: "สหพันธดานูบ"
 wuw_HUN_a_danubian_federation_desc: "ดวยที่ตั้งอันเปนเอกลักษณใจกลางยุโรป เรามีศักยภาพทุกประการที่จะมีอิทธิพลอยางมากโดยไมจําเปนตองไดดินแดนเพิ่มอยางชัดแจง อํานาจของถอยคําและการดําเนินการทางการทูตของเรานั้นสําคัญไมแพอํานาจของกองทัพ ดวยการกอตั้งประชาคมรอบแมนํ้าดานูบ เราจะมีอํานาจและการเขาถึงทางการทูตที่ไกลเกินพรมแดนของเราเองมาก"

 AUS_otto_von_habsburg_has_joined_austria_flag: "อ็อทโท ฟอน ฮาพสบวรคไดเสด็จกลับสูออสเตรียแลว"

 wuw_HUN_ward_against_extremism: "ปดปองลัทธิสุดโตง"
 wuw_HUN_ward_against_extremism_desc: "ขณะที่ลัทธิสุดโตงคืบใกลเขามาทุกที ชาติลุมแมนํ้าดานูบตองยืนหยัดอยางภาคภูมิในฐานะปอมปราการแหงเสรีภาพและประชาธิปไตย ปดปองศัตรูของเสรีภาพทุกราย เราตองรวมกันปกปองประชาธิปไตย!"
 wuw_HUN_ward_against_extremism_tt: "สมาชิกฝายทุกประเทศจะไดรับจิตวิญญาณแหงชาตินี้ดวย"

 wuw_HUN_bringing_down_the_giants: "โคนลมยักษใหญ"
 wuw_HUN_bringing_down_the_giants_desc: "มีสิ่งที่เรียกวามหาอํานาจมากมายที่จะทาทายเรา และพยายามยุติเสรีภาพของเรา เราจะไมยอมใหพวกเขาทําเชนนั้น และเพื่อรักษาความปลอดภัยของประชาชน เราตองชิงโจมตีชาติเหลานี้กอน เพื่อใหเราไดใชชีวิตโดยปราศจากภัยคุกคามแหงการถูกทําลายลางที่แขวนอยูเหนือหัวตลอดไป"
 HUN_bringing_down_the_giants_tt: "ไดรับเปาหมายสงคราม §Y[GetWargoalBasedOnGovernment]§! ตอชาติมหาอํานาจที่ไมใชประชาธิปไตยในยุโรป:"

 wuw_HUN_the_cult_of_arpad: "ลัทธิบูชาอารปาด"
 wuw_HUN_the_cult_of_arpad_desc: "อารปาดผูยิ่งใหญ ผูนําสหพันธชนเผามาจารในชวงรอยตอศตวรรษที่ 9 และ 10 เปนแรงบันดาลใจสําคัญของชาวฮังการี และราชวงศของเขาสืบทอดอํานาจมายาวนาน ทําให[ROOT.GetnameDef]รุงเรืองถึงขีดสุด เราควรเรียนรูจากเขาและเดินตามรอยเขา พรอมยกยองเขาขึ้นเปนวีรบุรุษในตํานาน"

 wuw_HUN_demand_szekely_autonomy: "เรียกรองอํานาจปกครองตนเองของเซเคลี"
 wuw_HUN_demand_szekely_autonomy_desc: "ชาวเซเคลีที่อาศัยอยูในทรานซิลเวเนียปรารถนาจะกลับมารวมกับพี่นองชาวฮังการีไมแพใคร และเราตองทําใหดินแดนเซเคลีไดรับเอกราช โดยมีเงื่อนไขแนนอนวาตองอยูภายใตการดูแลของเรา"

 wuw_HUN_approach_the_diasporas: "เขาหาชาวฮังการีพลัดถิ่น"
 wuw_HUN_approach_the_diasporas_desc: "นับตั้งแตสนธิสัญญาทรียานง ชาวฮังการีพลัดถิ่นกระจายอยูนอกประเทศของเราแทบทุกทิศทาง เราตองกลับไปเขาหาคนเหลานี้และปลูกฝงความภาคภูมิใจในชาติและความรักชาติตอรัฐฮังการีใหแกพวกเขาอยางยิ่งใหญ เพื่อเตรียมพวกเขาใหพรอมสําหรับการปลดปลอยจากผูกดขี่ทรราชในที่สุด"

 wuw_HUN_revive_the_tribal_consolidation: "ฟนฟูชาติฮังการี"
 wuw_HUN_revive_the_tribal_consolidation_desc: "ผูคนมากมายอาจลืมความยิ่งใหญในอดีตของชาติฮังการีไปแลว แตขบวนการมังกรไมลืม ถึงเวลาแลวที่เราจะทวงคืนสิ่งที่เปนของเรา และปฏิรูปสังคมใหเขากับแมแบบที่ขบวนการมังกรไดวางแผนไว"

 wuw_HUN_reclaim_the_pannonian_steppe: "ทวงคืนทุงหญาสเตปปแพนโนเนีย"
 wuw_HUN_reclaim_the_pannonian_steppe_desc: "นานมาแลว ชาวมาจารมาถึงแองแพนโนเนียแหงนี้และอางสิทธิ์ใหเปนของตน กอตั้งสหพันธชนเผาฮังการีขึ้น บัดนี้ผูรุกรานตางชาติไดยึดครองดินแดนบรรพบุรุษของเรา ซึ่งเปนการละเมิดสิทธิดั้งเดิมของเราอยางชัดเจน เราตองโจมตีอยางรวดเร็ว และยึดแพนโนเนียคืนจากศัตรู"

 wuw_HUN_undermine_the_admiral: "บอนทําลายทานพลเรือเอก"
 wuw_HUN_undermine_the_admiral_desc: "พลเรือตรีมิโคลช ฮอรตีไดนั่งอยูบนบัลลังกวางของ[ROOT.GetAdjective]อยางสบายใจมานานเกินไปแลว และอาจเริ่มสรางราชวงศ เราตองยุติการปกครองของเขา และใหผูที่ฉลาดกวา เชน ดยูลอ เกิมเบิช เขารับตําแหนงผูสําเร็จราชการ MOVE สามารถชวยใหสิ่งนี้เปนจริงได"

 wuw_HUN_integrate_the_volksbund: "ผนวกรวมโฟลคสบุนด"
 wuw_HUN_integrate_the_volksbund_desc: "เพื่อโคนลมฮอรตี เราตองการกําลังคนจํานวนมาก ซึ่งเราสามารถหาไดจากขบวนการชาติสังคมนิยม Volksbund der Deutschen in Ungarn แมพวกเขาจะไมมีความสําคัญนัก หากเราโนมนาวพวกเขามาอยูขางเราได เราจะใชพวกเขาไดไมเพียงในการยึดอํานาจ แตยังเปนกองกําลังกึ่งทหารในภายหลังดวย"

 wuw_HUN_volksbund_der_deutschen_in_ungarn: "สหพันธชาวเยอรมันในฮังการี (Volksbund der Deutschen in Ungarn)"
 wuw_HUN_volksbund_der_deutschen_in_ungarn_desc: "ขบวนการชาติสังคมนิยมที่ไดรับการสนับสนุนจาก DNSAP อยาง Volksbund der Deutschen in Ungarn จะเปนองคกรที่เหมาะสมอยางยิ่งสําหรับองครักษและกองกําลังอาสาที่ภักดีตอพระมหากษัตริยเยอรมันพระองคใหมของเรา เราควรติดตอพวกเขา และสงเสริมความรวมมือกับผูนําของพวกเขา"
 franz_and_henrik_available_tt: "§Yฟรันซ อันโทน บัช§! และ §Yเฮนริก แวรท§! จะพรอมใชงานในฐานะ§Yนายพล§!ระดับ 2 และ§Yจอมพล§!ระดับ 3 ตามลําดับ"
 HUN_volksbund_militia_recruitment_tt: "ไดรับหนวย§Yกองกําลังอาสา§!โฟลคสบุนดสี่หนวย"

 wuw_HUN_empower_the_greenshirts: "เสริมอํานาจพวกเสื้อเขียว"
 wuw_HUN_empower_the_greenshirts_desc: "พรรคชาติสังคมนิยมฮังการีและผูติดตาม แมจะมีความแตกตางทางอุดมการณกับเกิมเบิช แตก็เปนพันธมิตรที่ดีเพราะไมไดภักดีตอฮอรตี แมจะเสี่ยง แตการลักลอบสงอาวุธใหพรรคของพวกเขาอาจเปนประโยชน เพื่อใหพวกเขาชวยเราแทนที่ผูสําเร็จราชการ"

 wuw_HUN_the_march_on_budapest: "เดินขบวนสูบูดาเปสต"
 wuw_HUN_the_march_on_budapest_desc: "เมื่อพวกฟาสซิสตไดรับการจัดระเบียบและติดอาวุธแลว เราสามารถใหพวกเขาเดินขบวนสูเมืองหลวง เรียกรองใหผูสําเร็จราชการมิโคลช ฮอรตีลาออก ดวยวิธีนี้ เกิมเบิชจะไดขึ้นดํารงตําแหนงผูปกครองประเทศอันชอบธรรม และฟนฟูความสงบเรียบรอยโดยทันที พรอมประกาศตนเปนประธานาธิบดีแหงฮังการี"

 wuw_HUN_government_of_national_unity: "รัฐบาลเอกภาพแหงชาติ"
 wuw_HUN_government_of_national_unity_desc: "เกิมเบิชไดเสริมกําลังและติดอาวุธใหพรรคเจตจํานงแหงชาติและกลุมอื่นๆ เพื่อชวงชิงตําแหนงผูสําเร็จราชการจากฮอรตี แตสิ่งที่เขาไมไดตระหนักคือ บัดนี้พวกเขาตางหากที่กุมอํานาจที่แทจริง และไมมีใครขวางทางแฟแร็นตส ซาลาชี ผูนําของพวกเขา จากการขึ้นสูอํานาจไดอีกแลว"

 wuw_HUN_institute_corporatism: "สถาปนาระบบบรรษัทนิยม"
 wuw_HUN_institute_corporatism_desc: "เพื่อใหประเทศกลับมายืนหยัดไดอยางแทจริงหลังความหายนะและความอัปยศจากมหาสงครามและสนธิสัญญาทรียานง เราตองนําแบบจําลองเศรษฐกิจของมุสโสลินีมาใช และยอมรับการปฏิรูปแบบบรรษัทนิยมหลายประการ"

 wuw_HUN_a_roman_catholic_state: "รัฐโรมันคาทอลิก"
 wuw_HUN_a_roman_catholic_state_desc: "ประเทศของเรานับถือคริสตศาสนามาชานาน โดยชาวฮังการีกลุมแรกๆ ที่เขารีตคือหัวหนาเผา ฮอรกอ บุลชู และดยูลอ เกวลอ ราวป 950 จนถึงทุกวันนี้เรายังคงเปนคาทอลิกผูเครงศรัทธา และจะไมหลงทางไมวาจะเผชิญความยากลําบากเพียงใด"

 wuw_HUN_incorporate_the_hungarian_life_movement: "ขบวนการชีวิตฮังการี"
 wuw_HUN_incorporate_the_hungarian_life_movement_desc: "เราควรมุงผนวกนักการเมืองฝายขวาเบลอ อิมเรดี และขบวนการชีวิตฮังการีของเขาเขากับองคกรของเรา โดยใหเขามีที่ยืนในรัฐบาลของเรา"

 wuw_HUN_wherever_the_cross_points: "ทุกทิศที่กากบาทชี้ไป"
 wuw_HUN_wherever_the_cross_points_desc: "ตามสัญลักษณของขบวนการเรา กากบาทลูกศร ฮังการีตองทวงคืนสิทธิโดยกําเนิด และขยายไปทุกทิศทางที่ลูกศรชี้ไป ถึงเวลาแลวที่จะทวงคืนสิ่งที่เปนของเราโดยชอบธรรม!"

 wuw_HUN_the_war_on_atheism: "สงครามตอตานลัทธิไมมีพระเจา"
 wuw_HUN_the_war_on_atheism_desc: "ในยุคหลังๆ มานี้ ผูคนเริ่มลืมพระเจา ภัยรายของลัทธิไมมีพระเจาที่เติบโตไมหยุดจะแพรกระจายตอไป เวนแตเราจะโจมตีที่แกนของมัน เราตองโคนพวกคอมมิวนิสตเสียแตบัดนี้ มิฉะนั้นความนอกรีตนี้จะดํารงอยูตลอดไป"

 wuw_HUN_heirs_of_the_huns: "ทายาทแหงชาวฮั่น"
 wuw_HUN_heirs_of_the_huns_desc: "มีแนวคิดมากมายเกี่ยวกับที่มาของชนชาติเรา รวมถึงการเปนชาวฟนโน-อูกริก หรือชาวเติรก แมแนวคิดใดก็อาจจริงอยูบาง แตตองยํ้าวาเราคือทายาทที่แทจริงของชาวฮั่น และเราจะนําความพินาศมาสูผูใดก็ตามที่ตอตานเรา"

 wuw_HUN_sway_the_count: "โนมนาวทานเคานต"
 wuw_HUN_sway_the_count_desc: "เคานตฟเดล ปาลฟ อับ แอรเดอด เปนขุนนางและผูสนับสนุนลัทธินาซีแบบเยอรมันตัวยงในประเทศของเรา ดูเหมือนเขาจะเปนที่โปรดปรานอยางมากของผูติดตอจาก NSDAP และอาจเปนประโยชนอยางยิ่งหากมีเขาอยูขางเราเมื่อพยายามดําเนินการทางการทูตกับรัฐที่มีแนวคิดเดียวกัน"
 HUN_hire_fidel_palffy_tt: "แตงตั้ง§Yเคานตฟเดล ปาลฟ§!เปนที่ปรึกษา"

 wuw_HUN_our_ancestral_lands: "ดินแดนบรรพบุรุษของเรา"
 wuw_HUN_our_ancestral_lands_desc: "ดวยการเสริมการอางสิทธิ์ไมเพียงตอดินแดนฟนโน-อูกริกโบราณ แตยังรวมถึงดินแดนเติรกเกาดวย จากมรดกตูรานที่เราอางถึง เราจะสามารถอางสิทธิ์เหนือดินแดนเกาทั้งหมดของเรา และยึดคืนสิ่งที่เปนของเราโดยชอบธรรม"

 wuw_HUN_demand_croatian_reintigration: "เรียกรองการผนวกรวมโครเอเชียกลับคืน"
 wuw_HUN_demand_croatian_reintigration_desc: "เมื่อความปลอดภัยและเสนทางของเรามั่นคงดวยพันธมิตรใหมแลว เราสามารถมุงเนนเรื่องที่สําคัญกวาได พื้นที่สวนใหญของสิ่งที่ปจจุบันคือโครเอเชียเคยเปนสวนหนึ่งของราชอาณาจักรเราจนกระทั่งมหาสงครามสิ้นสุด และบัดนี้เราตองบังคับใชการอางสิทธิ์เหนือภูมิภาคนี้"

 wuw_HUN_increase_economic_cooperation: "เพิ่มความรวมมือทางเศรษฐกิจ"
 wuw_HUN_increase_economic_cooperation_desc: "เมื่อรัฐบาลของเราเปดกวางตอความรวมมือกับเพื่อนบานและผูเลนระหวางประเทศมากขึ้น เราควรมุงทําขอตกลงการคาและกติกาทางเศรษฐกิจใหมกับพันธมิตรใหมของเรา"
 HUN_increase_economic_cooperation_tt: "เราจะไดรับ§Yโรงงานพลเรือน§!นอกแผนที่หนึ่งแหงตอทุกประเทศตั้งตนใน§Yบอลขานตะวันตก§! §Yบอลขานตะวันออก§! และ§Yบอลขานเหนือ§! ที่มี§Yทัศนคติ§!ตอเราสูงกวา §G85§! ซึ่งรวมถึง §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, §Y[TRA.GetNameDef]§! และ §Y[SLO.GetNameDef]§! ดวย"

 wuw_HUN_hold_territorial_referendums: "จัดการลงประชามติดินแดน"
 wuw_HUN_hold_territorial_referendums_desc: "หลังมหาสงคราม ดินแดนหลายแหงที่มีชาวฮังการีอาศัยอยูจํานวนมากถูกพรากไปจากเราโดยไมมีกระบวนการประชาธิปไตยภายใตการกํากับของผูสังเกตการณระหวางประเทศ ตางจากกรณีของภูมิภาคในไซลีเซียและชเลสวิก เราควรเขาหาเพื่อนบานทางการทูต และขอใหจัดการลงประชามติเชนนั้น เพื่อใหประชาชนไดตัดสินใจวาตองการอาศัยอยูในชาติใด"
 wuw_HUN_hold_territorial_referendums_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yจัดการลงประชามติในดินแดนที่สูญเสีย§! เพื่อพยายามทวงคืนอีกครั้ง"

 wuw_HUN_sailing_the_danube: "ลองแมนํ้าดานูบ"
 wuw_HUN_sailing_the_danube_desc: "แมนํ้าดานูบอันยิ่งใหญเปนเสนเลือดใหญของชาติเรามาชานาน และเรามีประเพณีอันยาวนานและนาภาคภูมิในการลองไปตามสายนํ้า ไมวาเพื่อขนสงสินคาหรือเคลื่อนยายกองทัพ เราจึงควรลงทุนในกองเรือลํานํ้า และทําใหมั่นใจวาการเดินเรือบนแมนํ้าจะดําเนินไปอยางราบรื่นที่สุด"








 ### AUSTRIAN FOCUS TREE ###

 AUS_totalitarian_safety: "ความปลอดภัยแบบเบ็ดเสร็จ"
 AUS_totalitarian_safety_desc: "ในป 1933 เอ็งเงิลแบรท ดอลฟูส ไดนํา[AUS.GetNameDef]มาสูสภาพทางการเมืองในปจจุบัน เพื่อความปลอดภัยของชาติเรา การตัดสินใจยุบรัฐสภาโดยสิ้นเชิงนี้เปนที่ถกเถียงในหมูประชาชน แตเราเชื่อวามันจําเปนเพื่อรักษาความปลอดภัยของเรา แมดอลฟูสจะไมอยูกับเราแลว แตเราควรเดินบนเสนทางนี้ตอไป เพื่อความปลอดภัยของเราเอง"

 AUS_clamp_down_on_dnsap: "ปราบปราม DNSAP"
 AUS_clamp_down_on_dnsap_desc: "พรรคการเมืองอื่นนอกเหนือจากแนวรวมปตุภูมิของเราถูกสั่งหามในประเทศมานานแลว ถึงกระนั้นบางพรรคก็ยังคงหลงเหลืออยู และที่นากังวลที่สุดคือสิ่งที่เรียกวา DNSAP พวกเขาอางอยางผิดๆ วาเปนตัวแทนของลัทธิฟาสซิสตออสเตรียที่แทจริง และโตแยงวาเราควรสละอธิปไตยและรวมเขากับ[GER.GetNameDef] เราควรจัดการกับพวกเขาโดยทันที!"
 AUS_clamp_down_on_dnsap_tt: "§Y$AUS_kurt_schuschnigg$§! จะกลายเปนผูนําของ §Y$AUS_fascism_vaterlandische_front_long$§! และพรรครัฐบาลจะเปลี่ยนเปน§Yฟาสซิสต§!"

 AUS_supporting_italy_in_ethiopia_focus: "สนับสนุน[ITA.GetNameDef]ใน[ETH.GetNameDef]"
 AUS_supporting_italy_in_ethiopia_focus_desc: "[ITA.GetNameDef]อยูขางเรามาเปนเวลานาน ในฐานะหนึ่งในผูคํ้าประกันเอกราชของเรา จึงสําคัญอยางยิ่งที่เราตองรักษาความสัมพันธอันดีกับพวกเขา และไมปลอยใหพวกเขาถูกโนมนาวโดยความพยายามของ[GER.GetAdjective] การชวยเหลือชาว[ITA.GetAdjective]ใน[ETH.GetNameDef]จะสรางความไววางใจระหวางสองประเทศ และเพิ่มโอกาสที่พวกเขาจะมาชวยเราเมื่อจําเปน"
 AUS_supporting_italy_in_ethiopia_focus_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yสนับสนุน[ITA.GetNameDef]ในสงครามอิตาลี-เอธิโอเปย§!"

 AUS_reach_out_to_italy: "ติดตออิตาลี"
 AUS_reach_out_to_italy_desc: "แมเราจะมีความขัดแยงกันอยูบาง แตอิตาลียังคงเปนพันธมิตรที่ไวใจไดมากที่สุดที่เรามีในสถานการณปจจุบัน เมื่อความไมสงบและความตึงเครียดรอบตัวเราเพิ่มขึ้น การติดตอขอการสนับสนุนจากพวกเขาดูจะเปนประโยชน"

 AUS_approach_democratic_guarantors: "เขาหาผูคํ้าประกันฝายประชาธิปไตย"
 AUS_approach_democratic_guarantors_desc: "หลังการลงนามสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล เราพบวาตนเองมีกองทัพที่เล็กเกินกวาจะปองกันตนเองได หากเราจะอยูรอดในสถานการณที่อันตรายขึ้นเรื่อยๆ เราจะตองการการสนับสนุน แมสวนใหญเราจะมองตางกับประเทศอื่นที่ลงนามในสนธิสัญญา แตเราควรติดตอพวกเขาและขอการสนับสนุนในกรณีที่ความขัดแยงเย็นรอบตัวเราปะทุขึ้น"
 AUS_approach_democratic_guarantors_tt: "§Yผลตอแตละประเทศหากพวกเขายอมรับ:§!"

 AUS_refine_vaterlandische_front: "ขัดเกลาแนวรวมปตุภูมิ"
 AUS_refine_vaterlandische_front_desc: "เปนเวลานานที่แนวรวมปตุภูมิเปนการรวมตัวของพรรคการเมืองที่ถูกหลอมรวมเปนหนึ่งเดียวจากการยุบตัวเองของรัฐสภา อุดมการณเริ่มแรกของลัทธิฟาสซิสตออสเตรียคอยๆ เปลี่ยนแปลงไปตามกาลเวลาในทางที่ไมคอยเปนผลดีตอเรา ถึงเวลาแลวที่เราจะนําตนเองกลับสูเสนทางที่ถูกตอง"

 AUS_seek_agreement_for_rearmament: "แสวงหาขอตกลงเพื่อการติดอาวุธใหม"
 AUS_seek_agreement_for_rearmament_desc: "เมื่อการเมืองภายในอยูในการควบคุมมากขึ้นแลว ก็ถึงเวลาหันมองออกไปภายนอก เรายังคงถูกผูกมัดดวยสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลอันไมเปนธรรม ซึ่งขัดขวางการเติบโตทางทหารและความสามารถในการปองกันตนเองของเรา เนื่องจากเราตองพึ่งพาประเทศอื่นที่ลงนามในการรักษาความปลอดภัยอยูบาง จึงควรแจงพวกเขาถึงเจตนาจะติดอาวุธใหม และขอความเห็นชอบจากพวกเขา"
 AUS_seek_agreement_for_rearmament_tt: "เหตุการณจะถูกสงไปยัง §Y[ITA.GetFlag][ITA.GetName], [ENG.GetFlag][ENG.GetName] [FRA.GetFlag][FRA.GetName],§! และ §Y[USA.GetFlag][USA.GetName]§! เพื่อใหพวกเขาอนุมัติหรือปฏิเสธคําขอ ไมวาคําตอบจะเปนอยางไร เราก็ยังเลือกติดอาวุธใหมได"
 AUS_rearmament_and_guarantees_tt: "§Rการขัดตอความตองการของผูคํ้าประกันอาจนําไปสูผลกระทบทางการทูต ตั้งแตทัศนคติที่ลดลงไปจนถึงการถอนการรับประกัน!§!"

 AUS_disregard_the_treaties: "เพิกเฉยตอสนธิสัญญา"
 AUS_disregard_the_treaties_desc: "แมเราจะเคารพความตองการของประเทศที่ลงนามที่จะผูกมัดเราไวดวยสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล แตสถานการณโลกในปจจุบันไมเอื้อใหเราปฏิบัติตามขอกําหนดของสนธิสัญญาไดอีกตอไป เปนไปไดมากวาการกระทํานี้จะทําใหคูสนธิสัญญาของเราโกรธเคือง และเราอาจตองรับผลที่ตามมา แตเราไมอาจปลอยใหตนเองถูกผูกมัดไดอีกแลว"

 AUS_rapid_rearmament: "ติดอาวุธใหมอยางรวดเร็ว"
 AUS_rapid_rearmament_desc: "ในที่สุดเราก็หลุดพนจากพันธนาการของสนธิสัญญา บัดนี้เราตองติดอาวุธใหมโดยทันที กองทัพบกและกองทัพอากาศของเราถูกละเลยอยางหนักตลอดทศวรรษที่ผานมา และตองใชความพยายามอยางมากเพื่อนํากลับสูระดับที่ยอมรับไดอีกครั้ง"

 AUS_spanish_intervention: "แทรกแซงในสเปน"
 AUS_spanish_intervention_desc: "คาบสมุทรไอบีเรียถูกเปลวไฟแหงสงครามกลางเมืองแผดเผา กองกําลังภายนอกมากมายตางเขาแทรกแซงขณะที่ฝายชาตินิยมและฝายสาธารณรัฐปะทะกันอยางรุนแรง และเราไมเห็นเหตุผลที่จะไมเขาแทรกแซงดวย การแทรกแซงจะทําใหทหารของเราไดประสบการณกับการสงครามสมัยใหมมากขึ้น และไดมาตรวัดวาทหารของเรารับมือกับมาตรฐานในปจจุบันไดดีเพียงใด"

 AUS_demand_part_of_spanish_winnings: "ขอสวนแบงจากชัยชนะในสเปน"
 AUS_demand_part_of_spanish_winnings_desc: "ขณะที่เปลวไฟแหงความขัดแยงบนคาบสมุทรไอบีเรียคอยๆ มอดลง และมิตรของเราใน[SPA.GetNameDef]ไดรับชัยชนะ ก็ถึงเวลาที่เราจะพิจารณาวาเราไดอะไรจากความพยายามนี้ ความชวยเหลือของเราตอชาว[SPA.GetAdjective]นาจะทําใหเราไดรับความเมตตาจากพวกเขา และดูจะสมควรแลวที่เราจะขอคาตอบแทนสําหรับความชวยเหลือของเรา"
 AUS_volunteer_effort_SPA_flag: "ไดสงอาสาสมัครไปยัง [SPA.GetFlag]§Y[SPA.GetNameDef]§!"

 AUS_invite_spanish_refugees: "เชิญฝายชาตินิยมสเปน"
 AUS_invite_spanish_refugees_desc: "แมเราจะพยายามอยางเต็มที่ในสงครามกลางเมือง แตก็ไมอาจชวยพี่นองชาว[SPA.GetAdjective]ใหไดรับชัยชนะ แมจะเปนผลลัพธที่นาผิดหวังอยางยิ่ง แตเราอาจยังชวยใหทั้งพวกเขาและเราฟนตัวได ดวยการเชิญผูที่ตอสูเพื่ออุดมการณเดียวกันมาอยูกับเรา และผนวกพวกเขาเขากับสังคมและกองทัพ[AUS.GetAdjective]"

 AUS_integrate_dnsap_remnants: "ผนวกรวมเศษซากของ DNSAP"
 AUS_integrate_dnsap_remnants_desc: "ยังคงมีเศษซากของ DNSAP หลงเหลืออยูใน[AUS.GetNameDef] แมจะมีการหามที่เขมงวดขึ้น แมสวนใหญจะไปรวมตัวสนับสนุนพรรคประชาชนมหาเยอรมัน (Grossdeutsche Volkspartei) แตบางสวนยังคงอยูในสุญญากาศทางการเมือง เราควรพยายามดึงพวกเขาเขาสูแนวรวมปตุภูมิเพื่อปองกันการลุกฮือจากพวกเขาอีก"

 AUS_heimwehr_support: "ไดรับการสนับสนุนจากไฮมแวร"
 AUS_heimwehr_support_desc: "ตลอดหลายปที่อยูภายใตสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล [AUS.GetNameDef]ไดเห็นองคกรกึ่งทหารเพิ่มจํานวนขึ้นอยางรวดเร็ว องคกรเหลานี้โดยทั่วไปถูกสั่งหาม และสวนใหญมีวาระทางการเมืองที่ตองการผลักดัน อุดมการณของไฮมแวรไมเคยหางไกลจากของเรานัก การไดรับการสนับสนุนจากพวกเขาจะชวยใหเราโนมนาวพวกเขาใหสูรบเคียงขางบุนเดสแฮรของเราได"

 AUS_frontmiliz_focus: "กองกําลังอาสาแนวรวม (Frontmiliz)"
 AUS_frontmiliz_focus_desc: "เมื่อเราไดรับความไววางใจจาก [GetMilitiaName] แลว เราตองผนวกพวกเขาเขากับบุนเดสแฮรอยางรวดเร็ว แมพวกเขาจะยังคงเปนหนวยงานแยกตางหาก แตเราตองทําใหทั้งสองฝายทํางานรวมกันไดอยางไรรอยตอ ซึ่งจะรับประกันความสําเร็จของเราทั้งในสนามรบและบนทองถนนของประเทศ"

 AUS_fit_for_fight: "พรอมโจมตี"
 AUS_fit_for_fight_desc: "เราเดินทางมาไกลในการฟนฟูชาติจากสภาพอันนาเวทนาที่เคยเปน แตเราไมอาจหยุดอยูแคนี้ ขณะที่ผลจากความพยายามติดอาวุธใหมและฟนฟูประเทศกําลังปรากฏ เราตองเตรียมระบบยุติธรรมของเราเพื่อไมใหกฎหมายขัดขวางความพยายามของเรา"

 AUS_form_nachrichtenabteilun: "จัดตั้งแผนกขาวกรอง (Nachrichtenabteilung)"
 AUS_form_nachrichtenabteilun_desc: "เราถูกปลดอาวุธมาเปนเวลานาน และแมจะสงผลเลวราย แตก็มีขอดีอยูเชนกัน โลกมองเราเปนเพียงประเทศเล็กๆ หนาใหมที่มุงเนนแตกองทัพ การมุงเนนขาวกรองและการจารกรรมในเวลานี้จะทําใหเราใชสมมติฐานของพวกเขาที่มีตอเราใหเปนประโยชนได"
 nachrichtenabteilung_bonus: "โบนัสแผนกขาวกรอง (Nachrichtenabteilung)"

 AUS_wienfilm_propaganda_effort: "โฆษณาชวนเชื่อของวีนฟลม"
 AUS_wienfilm_propaganda_effort_desc: "เมื่อสงครามโหมกระหนํ่าในโลก จําเปนอยางยิ่งที่เราตองควบคุมชาติของเราใหอยูในระเบียบ ระยะหลังเราไดเห็นหลายประเทศใชอุตสาหกรรมภาพยนตรปลุกขวัญกําลังใจของประชาชน เมื่อเรามีวีนฟลม (Wien-Film) เปนของเราเอง เราจึงควรพิจารณาทําเชนเดียวกัน"

 AUS_consolidate_industries: "รัฐบรรษัทนิยม (Der Ständestaat)"
 AUS_consolidate_industries_desc: "ภาคอุตสาหกรรมของเราเติบโตอยางมากในเวลาอันสั้น และผลดีตอเศรษฐกิจและกองทัพก็เห็นไดชัด เพื่อเสริมความแข็งแกรงยิ่งขึ้น เราควรวางแผนรวมศูนย และทําใหมั่นใจวาเราจะไดประสิทธิภาพและผลผลิตที่ดีที่สุดจากอุตสาหกรรมเหลานี้"

 AUS_universitat_graz: "มหาวิทยาลัยกราซ"
 AUS_universitat_graz_desc: "มหาวิทยาลัยในกราซไดมอบผูมีมันสมองปราดเปรื่องมากมายและผูไดรับรางวัลโนเบลหลายคนแกเรา ความรวมมือที่ใกลชิดขึ้นกับมหาวิทยาลัยจะชวยเรงการวิจัยของเราไดอยางมาก"

 AUS_recruiting_the_graduates: "สรรหาบุคลากรจากมหาวิทยาลัย"
 AUS_recruiting_the_graduates_desc: "เพื่อรักษาความพยายามทางวิทยาศาสตรในระยะยาว เราตองไดคนเกงใหมๆ มาอยางตอเนื่อง การรวมมือกับมหาวิทยาลัยในกราซจะชวยใหเราดึงดูดนักศึกษา ศิษยเกา และศาสตราจารยมารวมโครงการของเรา"


 AUS_heritage_of_an_empire: "มรดกแหงจักรวรรดิ"
 AUS_heritage_of_an_empire_desc: "เราไมไดลืมวาเราเคยเปนอะไรเมื่อไมกี่ทศวรรษกอน ในใจลึกๆ [AUS.GetNameDef]ยังคงเปนจักรวรรดิ และดวยความทุมเท อีกไมนานเราจะกลับไปเปนเชนนั้นอีกครั้ง ถึงเวลาแลวที่เราจะเตรียมประชาชนใหพรอมสําหรับการเปลี่ยนผานนี้"

 AUS_second_brothers_war: "สงครามพี่นองครั้งที่สอง"
 AUS_second_brothers_war_desc: "ในป 1866 สงครามไดปะทุขึ้นระหวางเรากับรัฐกอนหนาของ[GER.GetNameDef] ตอนนั้นเปนเพียงการทะเลาะเล็กๆ เรื่องชเลสวิก-ฮ็อลชไตน แตบัดนี้กาลเวลาไดเปลี่ยนไปแลว ชาว[GER.GetAdjective]ยังคงเปนภัยคุกคามที่ชายแดนทางเหนือของเรา ถึงเวลาแลวที่จะยุติการแขงขันระหวางพี่นองนี้ใหจบสิ้น"
 AUS_unlocks_reichstag_raid: "ปลดล็อก§Yการจูโจม§!:\nการจูโจมทิ้งระเบิดไรชสทาคตอ §Y[GER.GetNameWithFlag]§!"
 
 AUS_an_improved_german_state: "รัฐเยอรมันที่ดีกวา"
 AUS_an_improved_german_state_desc: "เรามองตนเองเปนประเทศเยอรมันที่ดีกวามาโดยตลอด และเหตุการณในระยะหลังก็พิสูจนวาเราถูกตอง เราจะไมยอมให[GER.GetNameDef]ทําใหชื่อเสียงของชนชาติเยอรมันทั้งมวลมัวหมองอีกตอไป ถึงเวลาแลวที่จะผนวกพวกเขาเขากับประเทศอันรุงโรจนของเรา และใชพลังของพวกเขาเพื่อตัวเราเอง!"

 AUS_restoring_our_rightful_flag: "ทวงคืนสิทธิในธงของเรา"
 AUS_restoring_our_rightful_flag_desc: "เมื่อเราเขารวมโอลิมปกป 1936 เราพบวาธงของเราเหมือนกับธงของ[HAI.GetNameDef] เราจําใจเปลี่ยนธงใหแตกตางจากของพวกเขา แตขอเท็จจริงยังคงอยูวาธงนี้เปนของเรา และเมื่อชาว[HAI.GetAdjective]ไมยอมสละในตอนนั้น เราก็ตองจัดการดวยวิธีอื่น"

 AUS_seek_to_purchase_alaska: "ซื้อ [463.GetName]"
 AUS_seek_to_purchase_alaska_desc: "ในป 1867 พระเจาซารอเล็กซานเดอรที่ 2 แหงรัสเซียเคยเสนอขาย [463.GetName] ใหเรา ตอนนั้นเราปฏิเสธขอเสนอเพราะรัฐนั้นไมมีอะไรจะมอบใหเรา แตกาลเวลาไดเปลี่ยนไปแลว และเราควรพิจารณาติดตอเจาของ [463.GetName] เพื่อพยายามเจรจาตกลง"


 AUS_bring_hungary_back_into_the_fold: "นําฮังการีกลับคืนสูออมอก"
 AUS_bring_hungary_back_into_the_fold_desc: "เมื่อไมนานมานี้เองที่เราและชาว[HUN.GetAdjective]เคยเปนสวนหนึ่งของชาติอันยิ่งใหญเดียวกัน เราถูกบังคับแยกจากกันหลังมหาสงคราม และทั้งคูตางออนแอลงอยางหนักจากสนธิสัญญาอันไมเปนธรรมที่ถูกยัดเยียดให เพื่อปองกันไมใหเหตุการณเชนนี้เกิดขึ้นอีก เราควรเสนอใหผนวกรวมพวกเขาเขากับ[ROOT.GetNameDef]อยางสมบูรณ!"
 AUS_bring_hungary_back_into_the_fold_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกดินแดนเกา§! และการตัดสินใจแยกตางหากเพื่อ§Yเพิ่มโอกาสในการผนวกทางการทูต§!"
 target_hun_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[HUN.GetNameWithFlag]§!"
 target_cze_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[CZE.GetNameWithFlag]§!"
 target_yug_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[YUG.GetNameWithFlag]§! หรือ§Yประเทศใดก็ตาม§!ที่ครอบครอง §Y[102.GetName]§!, §Y[109.GetName]§! และ §Y[853.GetName]§! อยูในขณะนี้"
 target_pol_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[POL.GetNameWithFlag]§!"
 target_rom_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[ROM.GetNameWithFlag]§!"
 target_alb_tt: "การตัดสินใจจะมีเปาหมายที่ §Y[ALB.GetNameWithFlag]§!"
 more_likely_to_accept_if_military_inferior_tt: "การ§Yเพิ่มความแข็งแกรงของกองทัพ§!จะเพิ่มโอกาสที่พวกเขาจะยอมรับ§Gการผนวกโดยสันติ§!!"

 AUS_the_czechoslovakian_lands: "ดินแดนเชโกสโลวาเกีย"
 AUS_the_czechoslovakian_lands_desc: "ดินแดนทางเหนือของเราใน[CZE.GetNameDef]เคยเปนสวนหนึ่งของจักรวรรดิอันยิ่งใหญของเรากอนที่ทุกอยางจะพังทลาย จนถึงทุกวันนี้ยังมีกลุมคนที่พูดภาษา[GER.GetAdjective]อาศัยอยูในภูมิภาคเหลานี้มากมาย และดวยเหตุนี้จึงสมควรแลวที่พวกเขาจะไดกลับมาเปนสวนหนึ่งของจักรวรรดิที่เกิดใหมของเราอีกครั้ง สวนพวกเขาจะยอมเขารวมโดยสันติหรือไมก็ขึ้นอยูกับพวกเขาเอง"

 AUS_reclaiming_yugoslavian_territories: "ทวงคืนดินแดนบอลขาน"
 AUS_reclaiming_yugoslavian_territories_desc: "จักรวรรดิอันยิ่งใหญของเราเคยแผขยายไปจนถึงทะเลเอเดรียติก ดินแดนเหลานี้ก็ถูกขโมยไปจากเราเมื่อมหาสงครามสิ้นสุดเชนกัน การทวงคืนดินแดนเหลานี้จะทําใหเราไดแนวชายฝงที่มีความสําคัญทางยุทธวิธีกลับคืนมาดวย เราควรเสนอแนะเจาของรัฐเหลานี้ใหมอบคืนแกเราโดยสันติ หรือเสี่ยงรับผลที่ตามมา"
 AUS_reclaiming_yugoslavian_territories_tt: "เจาของ §Y[102.GetName]§!, §Y[103.GetName]§! และ §Y[853.GetName]§! จะไดรับเหตุการณ '§Yคําขาดจาก[AUS.GetNameDef]§!'"

 AUS_take_albania: "ยึดแอลเบเนีย"
 AUS_take_albania_desc: "[ALB.GetNameDefCap]อาจไมใชสวนที่สําคัญที่สุดของดินแดนเรา อันที่จริง มันไมเคยเปนของเราจริงๆ แมจะมีแผนการทําใหเปนเชนนั้นก็ตาม แตบัดนี้เมื่อเราปกหลักแสดงตัวในบอลขานอีกครั้ง ก็ไมมีเหตุผลที่เราจะไมอางสิทธิ์เหนือมันอีกครั้ง"

 AUS_take_back_galicia: "ทวงคืนกาลิเซีย"
 AUS_take_back_galicia_desc: "ขณะที่จักรวรรดิของเราเริ่มเติบโตอีกครั้ง เราไมอาจหลีกเลี่ยงการเรียกรองดินแดนอันชอบธรรมคืน แมจากประเทศที่ใหญกวา [POL.GetNameDefCap]อาจดูใหญกวาเราอยูบาง แตกาลิเซียยังคงควรเปนของเรา และหากพวกเขาไมยอมมอบใหโดยดี เราอาจตองใชกําลัง"

 AUS_demand_romanian_lands: "เรียกรองทรานซิลเวเนียและบูโควีนา"
 AUS_demand_romanian_lands_desc: "เมื่อไดดินแดนบางสวนในพื้นที่ใกลเคียงแลว บัดนี้เราสามารถเริ่มมองไปยังดินแดนที่ไกลออกไป ดินแดนที่เราเคยครอบครองใน[ROM.GetNameDef]เปนทรัพยสินอันมีคาของเรา และเราควรทวงคืนโดยเร็วที่สุด ไมสําคัญวาผูนํา[ROM.GetAdjective]จะคิดอยางไร หากพวกเขาไมยอมจํานนโดยดี เราอาจตองพิจารณาทางเลือกอื่น"

 AUS_integrate_northwest: "ผนวกรวมโบฮีเมีย"
 AUS_integrate_northwest_desc: "เพื่อใชประโยชนจากดินแดนที่เราทวงคืนมาไดอยางดียิ่งขึ้น เราตองทําใหชาติคงความเปนเอกภาพ รัฐที่เต็มใจและมีประโยชนที่สุดตองถูกผนวกเขาเปนสวนหนึ่งของจักรวรรดิโดยตรงโดยเร็วที่สุด ดินแดนที่เราอางสิทธิ์จาก[CZE.GetNameDef]พิสูจนแลววามีอนาคตสดใสที่สุด เราควรเริ่มดําเนินการผนวกรวมโดยทันที!"

 AUS_integrate_hungary: "ผนวกรวมฮังการี"
 AUS_integrate_hungary_desc: "เพื่อใชประโยชนจากดินแดนที่เราทวงคืนมาไดอยางดียิ่งขึ้น เราตองทําใหชาติคงความเปนเอกภาพ รัฐที่เต็มใจและมีประโยชนที่สุดตองถูกผนวกเขาเปนสวนหนึ่งของจักรวรรดิโดยตรงโดยเร็วที่สุด ดินแดนที่เราอางสิทธิ์จาก[HUN.GetNameDef]พิสูจนแลววามีอนาคตสดใสที่สุด เราควรเริ่มดําเนินการผนวกรวมโดยทันที!"

 AUS_proclaim_austrian_empire: "ประกาศจักรวรรดิออสเตรีย"
 AUS_proclaim_austrian_empire_desc: "ความพยายามในการฟนฟูและสถาปนาจักรวรรดิของเราขึ้นใหมไดผลในที่สุด เราไดพิชิตดินแดนเกาทั้งหมดของเรา และสามารถเรียกตนเองวาจักรวรรดิไดอยางชอบธรรมอีกครั้ง!"

 AUS_beyond_our_old_lands: "เหนือดินแดนเกาของเรา"
 AUS_beyond_our_old_lands_desc: "เมื่อเราเติบโตกลับมาเปนมหาอํานาจอีกครั้ง คําถามก็ปรากฏขึ้น เราควบคุมดินแดนเกาทั้งหมดแลว แตทําไมตองหยุดแคนี้? ดวยอํานาจที่เรามีอยูในตอนนี้ การขยายตอไปไมนาจะเปนปญหา"

 AUS_join_the_axis: "พลังแหงจํานวน"
 AUS_join_the_axis_desc: "แมเราจะแข็งแกรงดวยตัวเอง แตปฏิเสธไมไดวาการเปนสวนหนึ่งของพันธมิตรทางทหารในรูปแบบใดรูปแบบหนึ่งจะเปนประโยชนทั้งตอเราและตอพันธมิตรที่เราจะขอเขารวม เราควรพิจารณาเขาหาฝายที่มีแนวทางใกลเคียงกับเรามากที่สุดและขออนุญาตเขารวม"
 AUS_join_the_axis_tt: "§R[GER.GetNameWithFlag] ไมนาจะยอมรับเราเปนสมาชิกของ [GER.GetFactionName] แมความสัมพันธจะดีเยี่ยม พวกเขาก็อาจยังปฏิเสธ!§!"

 AUS_reforming_the_central_powers: "ฟนฟูฝายมหาอํานาจกลาง"
 AUS_reforming_the_central_powers_desc: "แมเราจะเห็นดวยวาการเปนสวนหนึ่งของพันธมิตรทางทหารจะชวยเสริมความแข็งแกรงของเรา แตเมื่อพิจารณาทางเลือกที่มีอยู เรารูสึกวาไมมีทางเลือกใดไดมาตรฐานของเราอยางสมบูรณ ในมหาสงคราม เราเคยเปนสวนหนึ่งของฝายมหาอํานาจกลางอันเกรียงไกร เมื่อไมมีทางเลือกที่ดีกวา เราควรพิจารณาฟนฟูฝายนี้ขึ้นมาใหม"
 AUS_reforming_the_central_powers_tt: "เชิญ §Y[GER.GetNameWithFlag]§!, §Y[TUR.GetNameWithFlag]§! และ §Y[BUL.GetNameWithFlag]§! เขารวม§Yฝายมหาอํานาจกลาง§! หากพวกเขาเปน§Yฟาสซิสต§!หรือ§Yไมฝกใฝฝายใด§! และไมไดอยูในฝายใดในขณะนี้"

 AUS_for_a_better_future: "อนาคตของ[AUS.GetAdjective]"
 AUS_for_a_better_future_desc: "เมื่อมองยอนกลับไป เปาหมายของเราเกี่ยวของกับการฟนฟูสิ่งที่สูญเสียไปมาโดยตลอด บัดนี้เมื่อบรรลุเปาหมายนั้นแลว เราตองเริ่มมองไปขางหนาสูอนาคตของเรา"


 AUS_war_against_bolshevism: "สงครามตอตานลัทธิบอลเชวิก"
 AUS_war_against_bolshevism_desc: "พวกบอลเชวิก[SOV.GetAdjective]ทางตะวันออกของเราเปนหนามยอกอกมาตลอด เพื่อไมใหถูกโจมตีโดยไมทันตั้งตัว เราควรทําใหแนใจวาเราจะเปนฝายลงมือกอน"

 AUS_crusade_on_communism: "สงครามครูเสดตอคอมมิวนิสต"
 AUS_crusade_on_communism_desc: "ตราบใดที่ยังมีคอมมิวนิสตบนทวีปยุโรป ประเทศและประชาชนของเราก็ไมปลอดภัย เราตองยุติภัยแดงนี้กอนที่มันจะกลายเปนตนตอของปญหาอยางแทจริง"
 AUS_crusade_on_communism_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yคอมมิวนิสต§!ทั้งหมดใน§Yยุโรป§!"
 AUS_crusade_on_communism_d_tt: "ไดรับเปาหมายสงคราม§Yโคนลมรัฐบาล§!ตอชาติ§Yคอมมิวนิสต§!ทั้งหมดใน§Yยุโรป§!"

 AUS_repeal_the_may_constitution: "ยกเลิกรัฐธรรมนูญเดือนพฤษภาคม"
 AUS_repeal_the_may_constitution_desc: "สิ่งที่เรียกวารัฐธรรมนูญเดือนพฤษภาคมซึ่งเอ็งเงิลแบรท ดอลฟูส ประกาศใชในป 1934 ไดขัดขวางการเมืองของ[AUS.GetNameDef]มาตลอดไมกี่ปที่ผานมา พรรคการเมืองถูกสั่งหาม ทําใหชาติสูญเสียโอกาสทั้งหมดที่จะเปลี่ยนแปลงไปในทางที่ดีขึ้น เราตองยกเลิกรัฐธรรมนูญอันไมเปนธรรมนี้ หากประเทศของเราจะรุงเรืองอีกครั้ง"

 AUS_austria_against_fascism: "สหพันธชาวออสเตรีย (Reichsbund der Österreicher)"
 AUS_austria_against_fascism_desc: "ขณะที่ชาติของเราฟนตัวจากการโดดเดี่ยวทางการเมืองที่ตองทนมา ก็ไมนาแปลกใจที่จะเห็นกลุมการเมืองผุดขึ้น เมื่อผูคนกลาแสดงความคิดเห็นในที่สุด กลุมนิยมเจา Reichsbund Der Österreich ก็เปนหนึ่งในนั้น และโชคดีที่วาระทางการเมืองของพวกเขาสอดคลองกับสิ่งที่เราวางแผนไวสําหรับชาติ เราควรใชประโยชนจากความรวมมือนี้ใหมากที่สุด"

 AUS_reinstate_the_imperial_council: "ฟนฟูสภาขุนนาง"
 AUS_reinstate_the_imperial_council_desc: "ดังที่เราคาดไว ประชาชนของเรากําลังแสดงความปรารถนาจะกลับไปสูวันเกาๆ เราไมตองการระบบที่มีขอบกพรองอยางชัดเจนซึ่งอาจถูกใชในทางมิชอบ ดังที่พวกฟาสซิสตทําในการยุบตัวเองของรัฐสภาในป 1934 อีกตอไป การปกครองโดยบุคคลเดียวเปนระบบที่ปลอดภัยและไดรับการยอมรับอยางดีเสมอในสมัยราชาธิปไตยคู ถึงเวลาแลวที่จะนํามันกลับมา"

 AUS_legacy_of_the_empire: "มรดกแหงจักรวรรดิ"
 AUS_legacy_of_the_empire_desc: "แมปจจุบันเราจะเปนเพียงเงาของจักรวรรดิอันเกรียงไกรในอดีต แตไมมีอะไรบอกวาเราไมอาจมุงหวังที่จะฟนฟูสิ่งที่เราเคยเปน การปลุกกระแสนิยมเจาในชาติจะเตรียมพรอมใหชาติกลับมาเปนราชาธิปไตยที่ทรงพลังอีกครั้ง"
 AUS_imperilalist_sentiments: "กระแสจักรวรรดินิยม"

 AUS_bring_back_the_habsburg_rule: "สวมมงกุฎ"
 AUS_bring_back_the_habsburg_rule_desc: "เพื่อใหเราไดชื่อวาเปนราชอาณาจักรที่แทจริง เราตองสวมมงกุฎใหกษัตริยเพื่อนําประเทศ ผูสําเร็จราชการคนปจจุบันของเราจะเปนกษัตริยที่ดีอยางแนนอน และเราควรเตรียมพิธีราชาภิเษกโดยทันที"
 AUS_bring_back_the_habsburg_rule_tt: "หากผูสําเร็จราชการคนปจจุบันของคุณคือ §Yอ็อทโท ฟอน ฮาพสบวรค§! หรือ §Yแอรนสท รือดีเกอร ชตารเฮมแบรค§! จะไดรับการสวมมงกุฎเปนอารชดยุกแหงออสเตรียและไดรับคุณลักษณะ:\n\n §Yอารชดยุกแหงออสเตรีย§!:\n  - อํานาจทางการเมืองที่ไดรับ: §G+10%§!\n  - ประชากรที่เกณฑได: §Y0.50%§!\n  - เสถียรภาพ: §G+5%§!\n  - การสนับสนุนสงคราม: §G+5%§!\n  - การสนับสนุนฝายไมฝกใฝฝายใดรายวัน: §G+0.03§!"

 AUS_repeal_the_habsburgergesetz: "ยกเลิกกฎหมายฮาพสบวรค"
 AUS_repeal_the_habsburgergesetz_desc: "กฎหมายฮาพสบวรค (Habsburgergesetz) ถูกตราขึ้นในป 1919 หลังมหาสงคราม และจํากัดสิทธิและอํานาจของราชวงศฮาพสบวรคอยางรุนแรง ไมวาใครจะปกครองประเทศเราในตอนนี้ กฎหมายนี้คือมลทินตอชื่อเสียงของ[AUS.GetNameDef]ในฐานะราชาธิปไตย และตองถูกยกเลิกโดยทันที"

 AUS_rebellious_rearmament: "การติดอาวุธใหมแบบขบถ"
 AUS_rebellious_rearmament_desc: "[AUS.GetNameDef]ถูกผูกมัดดวยสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลอันไมเปนธรรมอยางยิ่งและสรางปญหาอยางหนักมานานเกินไปโดยไมมีทางออก การฟนฟูระบอบกษัตริยก็เปนการละเมิดสนธิสัญญาอยูบางแลว จึงไมมีเหตุผลที่เราจะตองปฏิบัติตามขออื่นๆ ที่เหลือดวย ถึงเวลาแลวที่จะยกเลิกสนธิสัญญาอันหายนะนี้!"

 AUS_strengthen_legitimistische_corps: "เสริมกําลังกองพลนิยมเจา (Legitimistische Corps)"
 AUS_strengthen_legitimistische_corps_desc: "กองพลนิยมเจาเริ่มตนจากองคกรนักศึกษาสําหรับขุนนาง[AUS.GetAdjective]ที่ศึกษาในระดับอุดมศึกษาในประเทศของเรา ในชวงแรกพวกเขาเปนเพียงการรวมตัวของนักศึกษาที่มีความสนใจคลายกัน แตเมื่อบรรยากาศทางการเมืองรุนแรงขึ้น พวกเขาก็มีลักษณะทางทหารมากขึ้นเรื่อยๆ เราควรพิจารณาสรรหาคนจากพวกเขาเพื่อเรงระยะเวลาการวางกําลัง"

 AUS_legitimistische_studentenverbindung: "สมาคมนักศึกษานิยมเจา (Legitimistische Studentenverbindung)"
 AUS_legitimistische_studentenverbindung_desc: "องคกรนักศึกษา Legitimistische Studentenverbindung ดูแลนักศึกษาผูจงรักภักดีในการศึกษาทุกระดับ พวกเขามีลักษณะทางทหารนอยกวากองพล และนิยมการสนทนาและการอภิปราย รวมถึงวิทยาศาสตรมากกวา ความสนใจและความจงรักภักดีอยางแนวแนตอราชบัลลังกของพวกเขาอาจเปนประโยชนอยางยิ่งตอเรา!"

 AUS_legitimistische_jugend: "ยุวชนนิยมเจา (Legitimistische Jugend)"
 AUS_legitimistische_jugend_desc: "เราไดเห็นแลววาการใหเด็กและวัยรุนไดรูจักระบอบกษัตริยและคุณคาหลักทั้งหมดตั้งแตเนิ่นๆ ทําใหพวกเขาเติบโตเปนพลเมืองที่ภักดีและมีความสุข ทั้งทํางานและหากจําเปนก็พรอมรบเพื่อชาติ มีผูปลุกปนความกลัววานี่คือทางลาดลื่นสูสิ่งที่เลวรายกวามาก แตเรามั่นใจวาการศึกษานี้จะเปนประโยชนตอพวกเขาโดยแท"

 AUS_repeal_the_adelsaufhebungsgesetz: "ยกเลิกกฎหมายยกเลิกฐานันดรขุนนาง"
 AUS_repeal_the_adelsaufhebungsgesetz_desc: "กฎหมายยกเลิกฐานันดรขุนนาง (Adelsaufhebungsgesetz) มีผลบังคับใชพรอมกับกฎหมายฮาพสบวรค และยกเลิกการดํารงอยูของขุนนาง[AUS.GetAdjective]อยางสิ้นเชิง บรรดาศักดิ์ เอกสิทธิ์เกียรติยศ และอํานาจถูกพรากไปจากตระกูลเหลานี้ในพริบตา กฎหมายนี้ไมชอบธรรมอยางเห็นไดชัด และการฟนฟูขุนนางและความภาคภูมิใจของวงศตระกูลจะทําใหเรามั่นใจในความภักดีของพวกเขาในอนาคต"

 AUS_the_evidenzburo: "สํานักงานขาวกรอง (Evidenzbureau)"
 AUS_the_evidenzburo_desc: "เชนเดียวกับระบบอื่นๆ อีกมากมายที่เราสรางขึ้นอยางพิถีพิถัน สํานักงานขาวกรองถูกรื้อถอนเมื่อมหาสงครามสิ้นสุด เมื่อเราไมถูกผูกมัดดวยสนธิสัญญานี้อีกตอไป ก็ไมมีเหตุผลที่เราจะตองปฏิบัติตามขอกําหนดอันโงเขลาที่หามไมใหเรามีหนวยขาวกรองอีกตอไป"
 AUS_the_evidenzburo_bonus: "สํานักงานขาวกรอง (Evidenzbureau)"

 AUS_a_royal_alliance: "พันธมิตรแหงราชวงศ"
 AUS_a_royal_alliance_desc: "การอยูบนจุดสูงสุดนั้นเดียวดาย และในฐานะหนึ่งในราชาธิปไตยไมกี่แหงที่ยังคงอยูในปจจุบัน ก็ดูสมควรแลวที่เราจะรวมมือกับผูที่ยังเห็นคุณคาของการมีพระมหากษัตริยที่เขมแข็งปกครองประเทศ เราตองติดตอผูที่มีแนวคิดเดียวกับเรา และเสนอใหผูกพันธมิตรกันตอตานความชั่วรายที่ยิ่งใหญกวา"
 AUS_a_royal_alliance_tt1: "เชิญ §Y[ENG.GetNameWithFlag]§! เขารวม §Y$AUS_a_royal_alliance$§!"
 AUS_a_royal_alliance_tt2: "เชิญ §Y[FRA.GetNameWithFlag]§! เขารวม §Y$AUS_a_royal_alliance$§!"

 AUS_sturmscharen_support: "ไดรับการสนับสนุนจากชตวรมชาเริน"
 AUS_sturmscharen_support_desc: "ชตวรมชาเรินทําหนาที่เปนทางสายกลางระหวางชุทซบุนดฝายสังคมประชาธิปไตยและไฮมแวรฝายชาตินิยมมาโดยตลอด แมในประวัติศาสตรจะนําโดยคูแขงของเราอยางคูรท ชุชนิก แตเราเชื่อวาดวยแนวทางการเมืองที่ทับซอนกันและคุณคาดั้งเดิมของเรา เราจะไดรับการสนับสนุนจากออสทแมรคิเชอชตวรมชาเริน และใหพวกเขาทํางานใหเราแทนได"

 AUS_eiserne_legion: "จัดตั้งกองพันเหล็ก (Eiserne Legion)"
 AUS_eiserne_legion_desc: "เมื่อการนําของเราไดรับการปรับปรุงใหมและองคกรกึ่งทหารไดรับอนุญาตอีกครั้ง ความเปนไปไดในการจัดตั้งองครักษชั้นยอดสําหรับ [ROOT.GetLeader] โดยเฉพาะก็ปรากฏขึ้น เจาหนาที่กลุมเล็กๆ ที่เคยฝกใฝฟาสซิสตไดอาสาจัดตั้งองครักษชั้นยอดเพื่อปราบปรามฝายคานและควบคุมมวลชน นี่คือโอกาสอันยอดเยี่ยมสําหรับเรา!"

 AUS_the_royals_of_liechtenstein: "เชิญราชวงศลิกเตนสไตน"
 AUS_the_royals_of_liechtenstein_desc: "ในประวัติศาสตรเรามีความสัมพันธใกลชิดกับลิกเตนสไตน เจาชายองคหนึ่งในไมนานมานี้ของพวกเขา ฟรันซ โยเซฟที่ 1 ถึงกับอภิเษกสมรสกับสตรีชาว[AUS.GetAdjective] เมื่อแฟรดีนันทไมมีบุตร มงกุฎจึงควรตกแกอาลอยสหรือโยฮันเนสแหงลิกเตนสไตน แตทั้งสองพระองคไดสละสิทธิ์ในราชบัลลังกแลว บัดนี้เจาชายทั้งสองเสนอความชวยเหลือแกเรา เราควรใชขอเสนอนี้ใหเปนประโยชน!"

 AUS_osterreichische_akademie: "สถาบันออสเตรีย (Österreichische Akademie)"
 AUS_osterreichische_akademie_desc: "สถาบันวิทยาศาสตรแหงออสเตรีย (Österreichische Akademie der Wissenschaften) กอตั้งขึ้นในป 1846 ตามพระราชหัตถเลขาของจักรพรรดิแฟรดีนันทที่ 1 นับแตนั้นสถาบันไดเติบโตจากสมาคมวิทยาศาสตรเล็กๆ สูสถาบันที่นานับถือ และบมเพาะผูไดรับรางวัลโนเบล สถาบันประสบความยากลําบากในชวงวิกฤตการเงินของเรา แตการลงทุนจากเราจะนําสถาบันกลับสูเสนทางอยางแนนอน และนําผลประโยชนมหาศาลมาสูเราในอนาคต"

 AUS_royal_scientific_grants: "ทุนวิทยาศาสตรหลวง"
 AUS_royal_scientific_grants_desc: "การลงทุนของเราในสถาบันวิทยาศาสตรแหงออสเตรียเปนประโยชนอยางยิ่งทั้งตอเราและสถาบัน และบัดนี้เรากําลังพิจารณายกระดับความรวมมือนี้ไปอีกขั้น นักวิทยาศาสตรผูมีพรสวรรคมากมายทํางานใหสถาบันอยูในขณะนี้ และดวยการโนมนาวเล็กนอย เรานาจะใหพวกเขาทํางานในโครงการของเราไดดวย"

 AUS_demand_hungarian_submission: "เรียกรองให[HUN.GetAdjective]ยอมสยบ"
 AUS_demand_hungarian_submission_desc: "เปนเวลายาวนานที่เรารุงเรืองในฐานะราชาธิปไตยคูรวมกับ[HUN.GetNameDef] แมการจัดการนี้จะไดผลในตอนนั้น แตพวกเขาพิสูจนแลววามีความสามารถในการปกครองนอยกวาเรา และสิ่งเล็กนอยที่พวกเขาทําเพื่อชาติเรานั้นยังหางไกลจากที่หวัง การทําใหพวกเขาเปนรัฐหุนเชิดของเราจะทําใหเราไดสวนที่ดีที่สุดของราชาธิปไตยคู โดยหลีกเลี่ยงสวนที่แยที่สุด"
 AUS_demand_hungarian_submission_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yทําให[HUN.GetNameDef]อยูใตอํานาจ§! และการตัดสินใจแยกตางหากเพื่อ§Yเพิ่มโอกาสในการทําใหอยูใตอํานาจทางการทูต§!"

 AUS_subjugate_lands_of_old: "ปราบดินแดนเกาใหอยูใตอํานาจ"
 AUS_subjugate_lands_of_old_desc: "เมื่อจัดการปญหาเฉพาะหนาแลว เราตองเริ่มขยายกลับสูพรมแดนเดิม แมเราจะเชื่อมั่นในนักการทูตของเราอยางเต็มที่ และในกองทัพหากถึงคราวจําเปน แตจะเปนการดีหากเราวางแผนการขยายนี้เปนขั้นตอน แทนที่จะเปดการรุกเต็มรูปแบบในทุกแนวรบ"
 AUS_subjugate_lands_of_old_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yทําใหดินแดนเกาอยูใตอํานาจ§! และการตัดสินใจแยกตางหากเพื่อ§Yเพิ่มโอกาสในการทําใหอยูใตอํานาจทางการทูต§!"

 AUS_the_silesian_question: "ปญหาไซลีเซีย"
 AUS_the_silesian_question_desc: "ดินแดนไซลีเซียเคยเปนสวนหนึ่งของจักรวรรดิอันกวางใหญของเรามาชานาน แมจะไมเชื่อมตอกับดินแดนใจกลางของเรา แตรัฐเหลานี้ยังมีคุณคามหาศาลตอเรา เราควรขอรัฐเหลานี้คืน"

 AUS_reclaim_habsburg: "ทวงคืนฮาพสบวรค"
 AUS_reclaim_habsburg_desc: "มาตุภูมิของเราเองยังไมอยูในการควบคุมของเรา ราชวงศฮาพสบวรคไมเคยลืมจุดเริ่มตนอันตํ่าตอยในหมูบานฮาพสบวรค แมตระกูลจะเปนขุนนาง แตก็ถูกมองวาเปนขุนนางชั้นตํ่า บัดนี้สิ่งตางๆ ไดเปลี่ยนไปแลว ถึงเวลาทวงคืนมาตุภูมิ"
 AUS_reclaim_habsburg_tt: "พวกเขามีแนวโนมจะยอมรับมากขึ้นหากเรา§Gแข็งแกรงกวา§!พวกเขา\n\nปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมรัฐสวิสกลับคืน§!"

 AUS_war_against_guarantors: "สงครามตอตานผูคํ้าประกัน"
 AUS_war_against_guarantors_desc: "ขอความในสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลอันนารังเกียจนั้นชัดเจน หากเราตองการความชวยเหลือในการปกปองเอกราช เราจะไดรับความชวยเหลือนั้น แตมันกลับเปนเพียงคําพูดลมๆ แลงๆ เพื่อกักขังเราไว บัดนี้เมื่อเราคอยๆ กลับมามีอํานาจ ก็ถึงเวลาแกแคนอยางสาสม เราจะสอนพวกเขาวาอยาไดริมาหาเรื่องกับ[ROOT.GetNameDef]อีก!"

 AUS_tighten_control_of_subjects: "ควบคุมรัฐในอารักขา"
 AUS_tighten_control_of_subjects_desc: "เราไดสถาปนาตนเปนเจาเหนือดินแดนเกาบางสวนของเราแลว และแมสิ่งนี้จะยอดเยี่ยม แตเราไมอาจหยุดแคนี้ รัฐหุนเชิดเหลานี้ของเราสมควรไดรับการนําโดยผูนําที่ยิ่งใหญเชนเดียวกับเรา และโชคดีที่เรารูจักคนที่เหมาะสมพอดี!"
 AUS_tighten_control_of_subjects_tt: "หาก §Yอ็อทโท ฟอน ฮาพสบวรค§! เปนผูปกครองปจจุบันของ §Y[ROOT.GetNameWithFlag]§! จะปลดล็อกการตัดสินใจเพื่อ§Yแตงตั้งพระมหากษัตริยราชวงศฮาพสบวรค§!ใน §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! และ §Y[POL.GetNameWithFlag]§! เมื่อเราทําใหพวกเขาอยูใตอํานาจแลว"
 AUS_tighten_control_of_subjects_tt2: "ปลดล็อกการตัดสินใจเพื่อ§Yแตงตั้งพระมหากษัตริยราชวงศฮาพสบวรค§!ใน §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! และ §Y[POL.GetNameWithFlag]§! เมื่อเราทําใหพวกเขาอยูใตอํานาจแลว"

 AUS_renew_claims_in_italy: "รื้อฟนการอางสิทธิ์ใน[ITA.GetNameDef]"
 AUS_renew_claims_in_italy_desc: "ยอนไปเมื่อดินแดนถูกแบงหลังมหาสงคราม ชาว[ITA.GetAdjective]ไดเอาอัลโตอาดีเจและเตรนตีโนไปจากเรา ทั้งที่ไมไดตองการจริงๆ เมื่ออํานาจของเราไดรับการฟนฟูกลับมาเปนสวนใหญแลว เรายอมมีสิทธิ์เต็มที่ที่จะเรียกรองใหพวกเขาคืนดินแดนอันชอบธรรมแกเรา"

 AUS_extend_italian_claims: "ขยายการอางสิทธิ์เหนือ[ITA.GetAdjective]"
 AUS_extend_italian_claims_desc: "เราไดกําหนดแนวทางวาจะจัดการกับรัฐที่[ITA.GetNameDef]ขโมยไปจากเราเมื่อมหาสงครามสิ้นสุดอยางไร เราไมเคยครอบครอง [160.GetName] และ [159.GetName] แตรัฐเหลานี้เปนที่สนใจของเราอยางมากมาโดยตลอด เมื่อเราอางสิทธิ์ในสิ่งที่เคยเปนของเราแลว ทําไมไมกาวไปอีกขั้นและเอาสิ่งที่เราเคยตองการและยังคงตองการมาดวยเลา?"
 AUS_extend_italian_claims_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมดินแดนอางสิทธิ์ในอิตาลีกลับคืน§!"

 AUS_strike_deal_with_italy: "ทําขอตกลงกับ[ITA.GetNameDef]"
 AUS_strike_deal_with_italy_desc: "เราปรารถนาจะครอบครองเตรนตีโนและอัลโตอาดีเจทางตอนเหนือของอิตาลีนับตั้งแตดินแดนเหลานี้ถูกพรากไปจากเราเมื่อมหาสงครามสิ้นสุด ชาว[ITA.GetAdjective]ในตอนนั้นแสดงออกวาพวกเขาไมไดตองการใหดินแดนเหลานี้ถูกยัดเยียดให เพียงเพื่อกันไมใหตกเปนของเรา ดวยความพยายามทางการทูตอีกเล็กนอย เรานาจะทําขอตกลงกับพวกเขาเกี่ยวกับดินแดนเหลานี้ได"



 AUS_the_danubian_federation: "สหพันธดานูบ"
 AUS_the_danubian_federation_desc: "ดวยที่ตั้งอันเปนเอกลักษณใจกลางยุโรป เรามีศักยภาพทุกประการที่จะมีอิทธิพลอยางมากโดยไมจําเปนตองไดดินแดนเพิ่มอยางชัดแจง อํานาจของถอยคําและการดําเนินการทางการทูตของเรานั้นสําคัญไมแพอํานาจของกองทัพ ดวยการกอตั้งประชาคมรอบแมนํ้าดานูบ เราจะมีอํานาจและการเขาถึงทางการทูตที่ไกลเกินพรมแดนของเราเองมาก"

 AUS_invite_danubian_countries: "เชิญประเทศลุมแมนํ้าดานูบ"
 AUS_invite_danubian_countries_desc: "เมื่อเราประกาศเจตนารมณอยางเปดเผยใหทุกคนไดเห็นแลว ก็ถึงเวลาขยายสหพันธนี้ใหดีที่สุดเทาที่จะเปนไปได กาวแรกของเรายอมตองเปนการเชิญชาติลุมแมนํ้าดานูบอื่นๆ ที่ยังยืนอยูโดดเดี่ยวใหมารวมกับเรา"
 AUS_invite_danubian_countries_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเชิญประเทศลุมแมนํ้าดานูบเขารวมสหพันธดานูบ§!"

 AUS_danubian_unity: "เอกภาพแหงดานูบ"
 AUS_danubian_unity_desc: "ขณะที่สหพันธของเราเติบโตอยางตอเนื่อง เราตองไมลืมประเทศและการเมืองภายในของเราเองดวย ประชาชนของเราตองรูถึงความยิ่งใหญที่ฝายของเราจะนํามาใหพวกเขา!"

 AUS_inviting_the_observers: "เชิญผูสังเกตการณ"
 AUS_inviting_the_observers_desc: "ขณะที่ฝายของเราเติบโตขึ้น ก็ยิ่งชัดเจนวาเราสามารถเปนกําลังที่นาเกรงขามในยุโรปได แมนํ้าดานูบมีบทบาทสําคัญไมเพียงตอประเทศที่แมนํ้าไหลผาน แตยังรวมถึงประเทศที่พึ่งพาแมนํ้าในการขนสงสินคาดวย เราควรพิจารณาเชิญประเทศเหลานี้เขารวม [ROOT.GetFactionName]"
 AUS_inviting_the_observers_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเชิญชาติอื่นๆ เพิ่มเติมเขารวมสหพันธดานูบ§!"

 AUS_unexpected_alliances: "พันธมิตรที่ไมคาดคิด"
 AUS_unexpected_alliances_desc: "เราตองเปดใจรับชาติลุมแมนํ้าดานูบทุกชาติที่อาจตองการเขารวมฝายของเรา ไมวาความแตกตางในอดีตจะเปนอยางไร เราตองยื่นมือออกไปและเชิญพวกเขามายืนเคียงขางเราเพื่อเอกภาพแหงดานูบ"

 AUS_diplomatic_effort: "การทูตแหงดานูบ"
 AUS_diplomatic_effort_desc: "เพื่อคงความเปนผูนําที่เขมแข็งสมกับที่สหพันธของเราสมควรไดรับ เราตองทําใหสมาชิกทุกประเทศชื่นชอบเรา เราควรเพิ่มความพยายามทางการทูตเพื่อบํารุงและกระชับความสัมพันธภายในสหพันธ"
 AUS_diplomatic_effort_tt: "เมื่อเรา§Yขยายสหพันธ§!แลว เราจะใชความพยายามทางการทูตเพื่อ§Yปรับปรุงความสัมพันธกับสมาชิกอื่นๆ§!"
 AUS_danubian_leader: "ผูพิทักษผลประโยชนแหงดานูบ"

 AUS_protector_of_the_danube: "ผูพิทักษแหงดานูบ"
 AUS_protector_of_the_danube_desc: "ดวยสถานการณที่เลวรายลงอยางตอเนื่องในดินแดนเพื่อนบานใกลเคียง จําเปนตองดําเนินมาตรการเพื่อรับประกันความยั่งยืนและความมั่นคงของสมาชิกทุกประเทศ ในฐานะผูนําของ [ROOT.GetFactionName] ความรับผิดชอบนี้ยอมตกอยูกับเรา"
 AUS_protector_of_the_danube_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสนอใหรวมเปนรัฐสหพันธ§! และ§Yโนมนาวสมาชิกมาอยูฝายเรา§!\n\n§Rมหาอํานาจแทบไมมีทางยอมรับสิ่งนี้ เวนแตพวกเขาจะออนแอลงอยางมาก หรือ[AUS.GetNameDef]เปนมหาอํานาจที่ยิ่งใหญกวา!§!"

 AUS_via_danube_to_europe: "ผานดานูบสูยุโรป"
 AUS_via_danube_to_europe_desc: "เราไดรวบรวมฝายที่นานับถือไวรอบตัวเราแลว และแมเราจะหยุดแคนี้ได แตเราก็มองไกลเกินแมนํ้าดานูบไดเชนกัน ฝายระดับทั่วยุโรปที่มุงเนนความรวมมือและประชาคมภายในยุโรปอาจเปนภารกิจที่คุมคาอยางยิ่ง"
 AUS_via_danube_to_europe_tt: "แทนที่การตัดสินใจ §Y$AUS_the_danubian_federation_category$§! ดวยการตัดสินใจ §Y$BEL_closer_european_union_cat$§! ซึ่งชวยใหเชิญประเทศเพิ่มเติมและผลักดัน§Yการรวมเปนสหพันธแบบจํากัด§!ได\n\n§Rสิ่งนี้จะล็อกแผนยุทธศาสตรรวม§! ''§Y$HABSBURG_an_empire_not_just_in_name$§!'' §Rซึ่งหากเปน§Yไมฝกใฝฝายใด§! จะมอบ§Yจิตวิญญาณแหงชาติ§!ใหรัฐในอารักขาทั้งหมดที่ใช§Yผังยุทธศาสตรรวม§! ลดอํานาจปกครองตนเอง ทําใหผนวกรวมรัฐในอารักขาไดงายขึ้น§!"


 AUS_the_right_to_rearm: "สิทธิในการติดอาวุธใหม"
 AUS_the_right_to_rearm_desc: "นับตั้งแตมหาสงคราม เราถูกผูกมัดดวยสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลใหจํากัดขนาดกองทัพประจําการไวไมเกิน 30000 นาย ดวยพัฒนาการรอบตัวเรา เราเชื่อวาสิ่งนี้ไมอาจดํารงตอไปได และเราตองไดรับสิทธิในการติดอาวุธใหม"
 AUS_the_right_to_rearm_dem_tt: "ในฐานะประเทศ§Yประชาธิปไตย§! ใหแสวงหาขอตกลงเพื่อการติดอาวุธใหม"
 AUS_the_right_to_rearm_dem_instead_tt: "หาก[ROOT.GetNameDef]เปนประเทศ§Yประชาธิปไตย§! ผลที่ไดจะเปนการแสวงหาขอตกลงเพื่อการติดอาวุธใหมแทน"
 AUS_the_right_to_rearm_fed_tt: "ในฐานะประเทศ§Yไมฝกใฝฝายใด§! ใหติดอาวุธใหมโดยไมสนผลที่ตามมา"
 AUS_the_right_to_rearm_fed_instead_tt: "หาก[ROOT.GetNameDef]เปนประเทศ§Yไมฝกใฝฝายใด§! ผลที่ไดจะเปนการติดอาวุธใหมโดยไมสนผลที่ตามมาแทน"

 AUS_defence_of_the_homeland: "ปกปองมาตุภูมิ"
 AUS_defence_of_the_homeland_desc: "เมื่อในที่สุดเราสามารถฟนฟูกองทัพไดแลว เราตองพิจารณาวาจะใหกองทัพเชี่ยวชาญดานใด ที่ตั้งทางภูมิศาสตรของเราคอนขางเปราะบางในสภาพปจจุบัน การทําใหกองทัพของเราเปนผูเชี่ยวชาญดานการปองกัน และสอนใหพวกเขาใชภูมิประเทศอันเปนเอกลักษณของเราใหเปนประโยชนจะเปนผลดี"

 AUS_the_political_front: "พิทักษแนวรบทางการเมือง"
 AUS_the_political_front_desc: "สงครามไมไดชนะกันแคที่แนวหนาและสนามรบ แตยังชนะกันในโรงงานและบนทองถนนไมแพกัน การเสริมความแข็งแกรงใหระบบการเมืองจะทําใหเรามั่นใจไดวาแมสิ่งเลวรายที่สุดจะเกิดขึ้น เราก็ยังคงควบคุมสถานการณได"

 AUS_austrian_aggression: "ความกาวราวของออสเตรีย"
 AUS_austrian_aggression_desc: "แมการปองกันอาจดูเปนทางเลือกที่ชัดเจนในยุคนี้ แตนั่นหมายถึงเพียงการรอคอยใหถูกโจมตี หากเราเสริมกําลังและทําใหกองทัพพรอมโจมตีไดทุกเมื่อแทน เราจะสามารถยับยั้งผูที่คิดจะโจมตีไดอยางมีประสิทธิภาพ อยางไรเสียการรุกก็คือการปองกันที่ดีที่สุด"

 AUS_at_the_ready: "พรอมเสมอ"
 AUS_at_the_ready_desc: "ไมใชเพียงกองทัพที่ตองไดรับการฝกจนเปนเลิศและพรอมอยูเสมอ ผูที่สนับสนุนยุทโธปกรณใหกองทัพก็ตองตระหนักถึงความรับผิดชอบตอประเทศ การทําใหแรงงานพรอมสนับสนุนกองทัพอยูเสมอจะปูทางสูความสําเร็จของเรา"

 AUS_form_evidenzburo: "ปฏิรูปสํานักงานขาวกรอง (Evidenzbureau)"
 AUS_form_evidenzburo_desc: "ไมวาจุดยืนของเราจะเปนเชิงรุกหรือเชิงรับ การไดขาวกรองเกี่ยวกับศัตรูที่อาจเกิดขึ้นถือเปนสิ่งสําคัญยิ่ง เราไมอาจปลอยใหตนเองถูกความแข็งแกรง ความเร็ว หรือการประสานงานของศัตรูเลนงานโดยไมทันตั้งตัว และไมอาจปลอยใหพวกเขาไดขอมูลเกี่ยวกับเรา ถึงเวลาแลวที่จะปฏิรูปสํานักงานขาวกรองเกาใหเหมาะกับความตองการในปจจุบัน"
 AUS_form_evidenzburo_tt: "การอัปเกรดที่หนวยงานไดรับจะขึ้นอยูกับการเลือกของ[ROOT.GetNameDef]ระหวาง§Yปกปองมาตุภูมิ§!หรือ§Yความกาวราวของออสเตรีย§!"


 AUS_release_imprisoned_leaders: "ทําใหฝายคานทางการเมืองถูกกฎหมาย"
 AUS_release_imprisoned_leaders_desc: "ขณะที่ชาติของเราคอยๆ กลายเปนเผด็จการมากขึ้น ผูที่กลาตอตานก็ถูกจับขังอยางรวดเร็ว การจับขังเหลานี้ไมเปนธรรมโดยสิ้นเชิงและมีเหตุผลทางการเมืองลวนๆ เราควรปลอยตัวผูถูกคุมขังและทําใหฝายคานทางการเมืองถูกกฎหมายอีกครั้ง"

 AUS_hold_elections: "จัดการเลือกตั้ง"
 AUS_hold_elections_desc: "ดวยการเลือกตั้งครั้งลาสุดที่จัดขึ้นเมื่อวันที่ 9 พฤศจิกายน 1930 กอน 'การยุบตัวเองของรัฐสภา' ในป 1934 ประชาชนของเราแทบหมดศรัทธาในประชาธิปไตย[ROOT.GetAdjective]แลว สิ่งที่เราตองใหความสําคัญเปนอันดับแรกคือฟนฟูศรัทธาและใหประชาชนไดมีเสียง!"

 AUS_rebuild_democratic_systems: "สรางระบบประชาธิปไตยขึ้นใหม"
 AUS_rebuild_democratic_systems_desc: "ระบบประชาธิปไตยเปนสิ่งที่เปราะบางอยางยิ่ง รื้อทําลายไดงาย แตสรางหรือฟนฟูไดยาก แตเพื่อประชาชน นี่คือสิ่งที่ตองทําโดยทันที พรรคที่สงเสริมเผด็จการตองถูกสั่งหาม เพื่อประโยชนของชาติ"
 AUS_rebuild_democratic_systems_tt: "พรรค§Yฟาสซิสต§!ปจจุบัน §YDNSAP§! จะถูกสั่งหาม และ:"

 AUS_a_new_constitution: "รัฐธรรมนูญฉบับใหม"
 AUS_a_new_constitution_desc: "การแกไขรัฐธรรมนูญครั้งลาสุดของเราจบลงดวยหายนะ ดวยรัฐธรรมนูญเดือนพฤษภาคมและระบอบเผด็จการที่กระชับอํานาจเหนือประเทศ เราตองทําใหมั่นใจวาสิ่งเชนนี้จะไมเกิดขึ้นอีก ดวยการสถาปนารัฐธรรมนูญที่เปนประชาธิปไตยอยางเครงครัดขึ้นใหม"

 AUS_seek_support_from_guarantors: "ขอการสนับสนุนจากผูคํ้าประกัน"
 AUS_seek_support_from_guarantors_desc: "สนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลมีขอจํากัดมากมายตอเรา แตก็มีขอดีอยูบาง เนื่องจากเราไมไดรับอนุญาตใหมีกองทัพที่นานับถือในรูปแบบใด สิ่งที่เรียกวาผูคํ้าประกันจึงตองปกปองเรา เราควรติดตอพวกเขาและขอการสนับสนุนนี้"
 AUS_seek_support_from_guarantors_tt: "พวกเขามีแนวโนมจะตอบรับในทางบวกมากขึ้นหากมีทัศนคติตอเรา§Gสูง§!"

 AUS_stabilize_the_political_climate: "ทําใหบรรยากาศทางการเมืองมีเสถียรภาพ"
 AUS_stabilize_the_political_climate_desc: "บางทีอาจเปนผลตกคางจากสมัยที่พรรคการเมืองถูกสั่งหาม ฝายคานในปจจุบันของเราจึงหัวรุนแรงและสุดโตง เราตองทําใหแนใจวาพวกเขาปฏิบัติตามกฎหมายปจจุบัน และพวกเขาจะไมเสี่ยงถูกสั่งหาม ทาทีผอนปรนนี้นาจะทําใหเราไดรับการสนับสนุนจากผูติดตามที่หัวรุนแรงนอยกวาของพวกเขาดวย"

 AUS_outlaw_the_radicals: "ประกาศใหพวกหัวรุนแรงผิดกฎหมาย"
 AUS_outlaw_the_radicals_desc: "เราอยูในสถานการณทางการเมืองที่ละเอียดออนที่สุด ตอนนี้ไมใชเวลาสําหรับการตอสูกันเองระหวางพรรคหัวรุนแรงที่อยูคนละขั้วของการเมือง จนกวาชวงเวลาที่เลวรายที่สุดจะผานพนไป เราไมอาจปลอยใหพวกเขาพนโฆษณาชวนเชื่ออันชั่วรายได!"

 AUS_strengthen_the_cabinet: "เสริมความแข็งแกรงใหคณะรัฐมนตรี"
 AUS_strengthen_the_cabinet_desc: "แมกระแสประชาธิปไตยจะแพรกระจายไปทั่ว[ROOT.GetNameDef]อยางรวดเร็วพอสมควร แตคณะรัฐมนตรีของเรายังคงคอนขางออนแอ อํานาจยอมควรเปนของประชาชน และโดยสวนขยายจึงเปนของรัฐสภาและคณะรัฐมนตรี กระนั้น เพื่อใหการปกครองมีประสิทธิภาพ คณะรัฐมนตรีตองไดรับความสําคัญเปนอันดับแรก"

 AUS_pardon_political_exiles: "นิรโทษกรรมผูลี้ภัยทางการเมือง"
 AUS_pardon_political_exiles_desc: "ในชวงเวลาของสิ่งที่เรียกวารัฐบรรษัทนิยมภายใตการปกครองของลัทธิฟาสซิสตออสเตรีย นักการเมืองผูปราดเปรื่องมากมายไดหนีออกจากประเทศ เราควรเสนอใหพวกเขากลับมา ไมวาจุดยืนทางการเมืองของพวกเขาจะเปนอยางไร"

 AUS_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 AUS_join_the_allies_desc: "ตามธรรมเนียมแลว เรามองวาตนเองแข็งแกรงที่สุดเมื่อยืนดวยตัวเองมาโดยตลอด แตขณะที่สถานการณรอบตัวเราเลวรายลงเรื่อยๆ เราถูกบีบใหเผชิญความจริงวาสิ่งนี้อาจไมจริง การอยูตัวคนเดียวไมใชทางเลือกที่ดีที่สุดเสมอไป เราควรแสวงหาการเขารวมฝายประชาธิปไตยที่แข็งแกรง"
 AUS_join_the_allies_tt: "โอกาสที่จะไดรับการยอมรับเปนสมาชิกขึ้นอยูกับการเปนประชาธิปไตยและทัศนคติของคุณกับผูนําฝาย\n\nหากเราถูกปฏิเสธ เราจะสามารถกอตั้งฝายของเราเองแทนได"

 AUS_industrial_exchange: "แลกเปลี่ยนความรู"
 AUS_industrial_exchange_desc: "เรามีอะไรมากมายที่ตองเรียนรูจากพันธมิตรใหม โดยเฉพาะในเรื่องการกอสราง และไมแพกันในดานยุทธศาสตรทางทหาร เมื่อพันธมิตรเต็มใจแบงปนขอมูลนี้กับเรา เราควรใชประโยชนใหมากที่สุด"

 AUS_alpine_federation_focus: "สหพันธแอลป"
 AUS_alpine_federation_focus_desc: "เราไมรูสึกอีกตอไปวาการยืนดวยตัวเองเปนทางเลือกที่ดีที่สุดสําหรับ[ROOT.GetNameDef] แตก็ไมมีฝายอื่นใดที่ดูเปนทางเลือกที่เปนไปได นี่จึงเปนโอกาสอันยอดเยี่ยมที่เราจะยื่นขอเสนอตอภูมิภาคแอลปสวนที่เหลือ"
 AUS_alpine_federation_focus_tt: "เชิญ §Y[SWI.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§! และ §Y[ITA.GetNameWithFlag]§! เขารวมฝายของคุณ ตราบใดที่พวกเขาเปน§Yประชาธิปไตย§!หรือ§Yไมฝกใฝฝายใด§! และไมไดอยูในฝายใดในขณะนี้"

 AUS_invite_the_entente: "เชิญความตกลงไตรภาคีนอย"
 AUS_invite_the_entente_desc: "ฝายของเราจะไดประโยชนจากสมาชิกในภูมิภาคที่มากขึ้น แมจะหมายถึงการขยายเกินรากเหงาแหงเทือกเขาแอลปของเราก็ตาม ความตกลงไตรภาคีนอยกอตั้งขึ้นเพื่อปองกันการกลับมาของราชวงศฮาพสบวรค และเมื่อตอนนี้เราอยูฝายเดียวกันแลว ทําไมไมเชิญพวกเขาเลา?"
 AUS_invite_the_entente_tt: "เชิญ §Y[YUG.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! และ §Y[CZE.GetNameWithFlag]§! เขารวมฝายของคุณ ตราบใดที่พวกเขาเปน§Yประชาธิปไตย§!หรือ§Yไมฝกใฝฝายใด§! และไมไดอยูในฝายใดในขณะนี้"

 AUS_offensive_on_the_fascists: "การรุกตอตานฟาสซิสต"
 AUS_offensive_on_the_fascists_desc: "เราไมอาจเพิกเฉยตอขอเท็จจริงที่วาเพื่อนบานทางใตของเราคือตนตอของปญหามากมายไดอีกตอไป แมการทูตจะเปนวิธีที่เราเลือกใชเสมอ แตบางครั้งก็จําเปนตองแทรกแซงอยางเด็ดขาดกวานั้น"

 AUS_lawmaking_leniency: "ผอนปรนกระบวนการนิติบัญญัติ"
 AUS_lawmaking_leniency_desc: "ระบบการผานกฎหมายใหมของเราลาสมัยและจําเปนตองไดรับการทบทวนอยางเรงดวน ในยามเชนนี้ เราตองสามารถผานกฎหมายใหมไดอยางรวดเร็วเนื่องจากสถานการณเปลี่ยนแปลงทุกวัน เราควรพิจารณาผลักดันใหกระบวนการออกกฎหมายกระชับยิ่งขึ้น"

 AUS_empowering_the_chancellor: "เสริมอํานาจนายกรัฐมนตรี"
 AUS_empowering_the_chancellor_desc: "บทบาทของนายกรัฐมนตรีแหงประเทศเรานั้นไมใชภาระที่แบกรับไดงาย [ROOT.GetNameDefCap]คงไมมาถึงจุดนี้หากไมใชเพราะ [ROOT.GetLeader] และแมเราจะตองไมกลายเปนลัทธิบูชาตัวบุคคล แตเราอาจตองการแสดงความซาบซึ้งตอนายกรัฐมนตรีของเราใหเปนที่รับรู"

 AUS_join_the_research_program: "โครงการวิจัยรวม"
 AUS_join_the_research_program_desc: "บัดนี้เราไดอยูในฝายเดียวกับประเทศที่มีแนวคิดคลายกันแลว เราควรพยายามใชประโยชนจากสิ่งนี้ใหมากที่สุด การจัดตั้งกลุมแบงปนเทคโนโลยีระหวางเราและพันธมิตรจะชวยเสริมความแข็งแกรงใหทั้งฝายดวยความเปนเลิศทางเทคโนโลยี"
 AUS_join_the_research_program_tt: "§Y[ROOT.GetNameDef]§! และทุกประเทศที่อยูในฝายเดียวกับเรา จะเขารวม§Yกลุมแบงปนเทคโนโลยี§!"

 AUS_the_right_to_self_determination: "สิทธิในการกําหนดชะตากรรมตนเองของเรา"
 AUS_the_right_to_self_determination_desc: "ครั้งหนึ่งเราเคยพึ่งพาสิทธิในการกําหนดชะตากรรมตนเองและการคุมครองของมัน บัดนี้เรายืนอยูอีกฟากหนึ่ง และเราตองกลายเปนผูปกปองชาติเหลานั้นที่กําลังตอสูเพื่อความอยูรอดเมื่อเผชิญกับการกดขี่อยางรุนแรง!"

 AUS_our_brothers_in_the_east: "พี่นองของเราทางตะวันออก"
 AUS_our_brothers_in_the_east_desc: "แมในที่สุดเราจะกลับมาเปนประชาธิปไตยไดอีกครั้ง แตยังมีผูอื่นที่ทนทุกขอยูใตเงาของเผด็จการ แมเราจะไมปรารถนาจะรวมชาติกับพี่นองชาว[HUN.GetAdjective]มากนัก แตเราก็ยังเชื่อวาพวกเขาควรไดเลือกทางเดินของตนเองเชนกัน ประชาธิปไตยตองเกิดขึ้นสําหรับพวกเขาดวย!"
 
 AUS_deal_with_the_german_threat: "จัดการภัยคุกคามจากเยอรมนี"
 AUS_deal_with_the_german_threat_desc: "[GER.GetNameDefCap]เปนภัยคุกคามที่ชายแดนตะวันตกเฉียงเหนือของเรามาหลายทศวรรษแลว นโยบายของพวกเขาแข็งกราว และบอยครั้งที่พวกเขาขมขูถึงการดํารงอยูของเรา ถึงเวลาแลวที่เราจะยุติภัยคุกคามนี้ใหสิ้นซาก"

 AUS_end_european_fascism: "จุดจบของฟาสซิสตในยุโรป"
 AUS_end_european_fascism_desc: "ไมมีใครปลอดภัย จนกวาเราทุกคนจะปลอดภัย ลัทธิฟาสซิสตยังคงแพรหลายในยุโรปและจะกอปญหาเพิ่มขึ้นในอนาคตอยางไมตองสงสัย เราควรลงมือปองกันไมใหอุดมการณนี้แพรกระจาย"
 AUS_end_european_fascism_tt: "ไดรับเปาหมายสงคราม§Yรัฐหุนเชิด§!ตอทุกประเทศ§Yฟาสซิสต§!ใน§Yยุโรป§!"
 AUS_end_european_fascism_d_tt: "ไดรับเปาหมายสงคราม§Yโคนลมรัฐบาล§!ตอทุกประเทศ§Yฟาสซิสต§!ใน§Yยุโรป§!"

 AUS_austromarxism_focus: "ลัทธิมารกซออสเตรีย"
 AUS_austromarxism_focus_desc: "แนวคิดลัทธิมารกซออสเตรียซึ่งริเริ่มโดยกลุมของวิกเตอร อัดเลอร, ออทโท เบาเออร, คารล เรนเนอร, มักซ อัดเลอร และรูดอลฟ ฮิลเฟอรดิง ไดชี้นําเรามาชานาน จากมุมมองที่แตกตางกันของพวกเขาแตมุงแสวงหาความเขาใจรวมกัน จึงเกิดทางสายกลางระหวางสังคมประชาธิปไตยกับคอมมิวนิสตขึ้น ซึ่งทําใหไดรับการสนับสนุนจากประชาชนกวางขวางกวาที่แนวทางใดแนวทางหนึ่งจะทําไดโดยลําพัง"

 AUS_rally_the_people: "รวมพลังประชาชน"
 AUS_rally_the_people_desc: "ในประวัติศาสตรของเรา มีความพยายามกอรัฐประหารหลายครั้งโดยผูที่มีอุดมการณเดียวกับเรา ดวยความหวังวาจะไมตองหันไปใชวิธีการเชนนั้นอีก เราตองรวบรวมประชาชนใหมาอยูขางเราและผลักดันการปฏิรูป"

 AUS_ban_dnsap: "กวาดลางพวกชาตินิยม"
 AUS_ban_dnsap_desc: "ปจจุบันมีพรรคการเมืองที่เปนภัยคุกคามตอสังคมอยางแทจริงอยูในประเทศของเรา แมเราจะอยากเห็นฝายคานทางการเมือง แตเราตองมั่นใจวามันจะไมเปนภัยตอความปลอดภัยของเรา DNSAP ตองถูกสั่งหามอยางเด็ดขาด และแนวรวมปตุภูมิ (Vaterländische Front) ตองถูกมองใหเห็นธาตุแท!"

 AUS_renounce_the_treaties: "ยกเลิกสนธิสัญญา"
 AUS_renounce_the_treaties_desc: "แมโดยทั่วไปรัฐบาลของเราจะนิยมการเจรจาและการทูตมากกวาความขัดแยงและการกระทําที่บุมบาม แตในเรื่องสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล เราไมมีเหตุผลที่จะตองรีรอ เมื่อประเทศของเรามีเสถียรภาพและเราไดอํานาจควบคุมคืนมา ก็ไมมีเหตุผลที่เราจะตองถูกผูกมัดดวยกฎเกณฑที่เขมงวดเชนนี้ เราจะยกเลิกสนธิสัญญานี้ทันที"

 AUS_emergency_measaures: "มาตรการฉุกเฉิน"
 AUS_emergency_measaures_desc: "แมเราจะไมเคยสนับสนุนการปฏิวัติ แตก็ชัดเจนขึ้นเรื่อย ๆ วาเราไมอาจพึ่งพาพวกสังคมประชาธิปไตยใหนําความเปลี่ยนแปลงที่จําเปนมาสูประเทศของเราเพื่อใหกลับมารุงเรืองอีกครั้งได เราตองเตรียมพรอมตอสูเพื่อแรงงานแหง[ROOT.GetNameDef]!"

 AUS_schutzbund_support: "ไดรับการสนับสนุนจากชุทซบุนด"
 AUS_schutzbund_support_desc: "กลุมกึ่งทหาร[ROOT.GetAdjective]สวนใหญมีวาระทางการเมืองแบบชาตินิยม นิยมราชวงศ หรือแมแตฟาสซิสต และพวกเขาก็มีสวนตองรับผิดชอบไมนอยตอความขัดแยงดวยอาวุธหลายครั้งในประเทศของเรา แมชุทซบุนดแหงสาธารณรัฐ (Republikanischer Schutzbund) จะกอปญหาไวไมนอย แตความจริงก็คือในทางการเมืองเราคลายกันมาก เราควรดึงพวกเขามารวมอุดมการณของเรา"
 AUS_schutzbund_support_tt: "หนวย§Yกองพลชุทซบุนด§! §Y3§! หนวยจะปรากฏใน§Y[4.GetName]§!เมื่อเริ่มสงครามกลางเมือง§Yคอมมิวนิสต§!\n\nฝายตรงขามจะไดหนวย§Yกองพลไฮมแวร§! §Y1§! หนวยแทนที่จะเปน §R2§! หนวยใน§Y[152.GetName]§!"

 AUS_intervention_in_spain: "แทรกแซงในสเปน"
 AUS_intervention_in_spain_desc: "ชาว[SPR.GetAdjective]กําลังติดอยูในสงครามกลางเมืองอันรุนแรงที่ลุกลามไปทั่วคาบสมุทรไอบีเรีย แมสถานการณของเราเองจะลอแหลม เราก็ควรพยายามชวยเหลือพวกเขา เพราะทายที่สุดแลวพวกเขากําลังตอสูในศึกที่มีคุณคาตอตานพวกชาตินิยม"

 AUS_invite_spanish_exiles: "เชิญผูลี้ภัยจากสเปน"
 AUS_invite_spanish_exiles_desc: "เราหวังใหสงครามกลางเมืองสเปนจบลงอีกแบบหนึ่ง เชนเดียวกับที่เราเคยยื่นมือชวยในสนามรบ บัดนี้เราตองยื่นความชวยเหลือในดานอื่น และรับผูที่หลบหนีจากการปกครองของพวกชาตินิยม"
 AUS_volunteer_effort_SPR_flag: "สงอาสาสมัครไปสเปนแลว"

 AUS_celebrate_spanish_victory: "เฉลิมฉลองชัยชนะในสเปน"
 AUS_celebrate_spanish_victory_desc: "เมื่อการปะทะอันรุนแรงบนคาบสมุทรไอบีเรียคอย ๆ สงบลง ก็เปนที่ชัดเจนวาฝายสาธารณรัฐยังคงควบคุมประเทศของตนไวได ความชวยเหลือของเรานาจะมีสวนในชัยชนะครั้งนี้ดวย และเปนการสมควรแลวที่เราจะสอบถามถึงความเปนไปไดในการไดรับคาตอบแทนสําหรับความพยายามของเรา"

 AUS_revolution: "ทวงคืนเวียนนาแดง"
 AUS_revolution_desc: "ถึงเวลาแลวที่เราไมอาจทําหนาที่เปนเพียงฝายคานของพรรครัฐบาลไดอีกตอไป ประชาชนของเราสมควรไดรับสิ่งที่ดีกวาที่ผูนําปจจุบันจะมอบใหได และความนิยมที่เพิ่มขึ้นของเราก็พิสูจนแลววาตอนนี้คือเวลาที่ตองลงมือ!"
 AUS_revolution_tt: "การมีจิตวิญญาณแหงชาติ§Yการสนับสนุนจากกองกําลังอาสา§! จะทําใหมีหนวย§Yกองพลชุทซบุนด§! 3 หนวยปรากฏขึ้นเมื่อเริ่มสงครามกลางเมือง"
 AUS_revolution_tt_2: "จํานวนทหารที่แตละฝายไดรับขึ้นอยูกับความนิยมของ§Yคอมมิวนิสต§!\n\nหาก§Yการสนับสนุนคอมมิวนิสต§!สูงกวา §Y60%§! จะหลีกเลี่ยงสงครามกลางเมืองไดทั้งหมด"

 AUS_seek_soviet_support: "แสวงหาการสนับสนุนจากโซเวียต"
 AUS_seek_soviet_support_desc: "หากเราจะทั้งตานทานภัยคุกคามจาก[GER.GetAdjective]ทางเหนือ และเปลี่ยนประเทศใหเปนสังคมคอมมิวนิสตที่ประชาชนสมควรไดรับ เราจําเปนตองไดรับการสนับสนุนจากภายนอก เราเคยมีความเห็นตางทางอุดมการณเล็กนอยกับ[SOV.GetNameDef] แตโดยแกนแทแลว เรายังคงมีความคลายคลึงกันมาก"
 AUS_seek_soviet_support_tt: "§Rการพึ่งพาการสนับสนุนจาก[SOV.GetAdjective]ในตอนนี้จะทําใหเราไมสามารถโจมตีพวกเขาไดในภายหลัง!§!"

 AUS_politicized_general_staff: "เสนาธิการที่มีสํานึกทางการเมือง"
 AUS_politicized_general_staff_desc: "แมกอนหนานี้เราจะไดเห็นแลววากลุมกึ่งทหารที่มีวาระทางการเมืองสามารถกลายเปนปญหาใหญได แตไมใชกับกองทัพประจําการของเรา กองทัพที่เขาใจการเมืองของเราอยางลึกซึ้งและมีวิสัยทัศนรวมกับเรา จะเต็มใจและมีความสามารถในการตอสูเพื่อความปลอดภัยของเรามากกวามาก!"

 AUS_promote_the_worthy: "เลื่อนยศผูคูควร"
 AUS_promote_the_worthy_desc: "นายพลบางคนของเราแสดงใหเห็นถึงศักยภาพและความภักดีอยางยิ่งตอทั้งอุดมการณและประเทศของเรา การยกพวกเขาเปนแบบอยางและตอบแทนดวยการเลื่อนยศ เราหวังวาจะกระตุนใหเจาหนาที่คนอื่น ๆ ประพฤติเชนนี้มากขึ้น!"

 AUS_align_with_ussr: "เขาแนวเดียวกับชาว[SOU.GetAdjective]"
 AUS_align_with_ussr_desc: "ยิ่งชัดเจนขึ้นแกเราวาเหตุใด[SOV.GetNameDef]จึงถูกบริหารในแบบที่เปนอยู แมในตอนแรกเราจะมีขอกังขาเกี่ยวกับระบบแบบ[SOV.GetAdjective] แตเราไดตระหนักวามันอาจเปนวิธีที่ดีที่สุดในการปกครองประเทศ การยึดถือหลักนิยมของ[SOV.GetLeader] จะทําใหเราไดทั้งประเทศที่มีเสถียรภาพมากขึ้น และนาจะไดรับความเมตตาจากพวกเขาดวย"
 AUS_align_with_ussr_tt: "ผูนําปจจุบันของ§YKPÖ§!จะไดรับคุณลักษณะที่ทําใหยึดถือหลักนิยมของ  §Y[SOV.GetFlag][SOV.GetLeader]§! ตราบใดที่§Y[SOV.GetFlag][SOV.GetNameDef]§!ยังคงเปน§Yคอมมิวนิสต§!"

 AUS_raid_military_storages: "บุกคลังยุทโธปกรณเกา"
 AUS_raid_military_storages_desc: "มียุทโธปกรณทางทหารจํานวนมากถูกเก็บไวในคลังเกาทั่วประเทศ ดวยสถานการณปจจุบัน เราเชื่อวาสิ่งเหลานี้จะมีประโยชนมากกวาเมื่ออยูในมือของประชาชนแทนที่จะถูกปดตายไว ถึงเวลาแลวที่จะใชทรัพยากรเหลานี้ใหเกิดประโยชนสูงสุด"

 AUS_properly_trained_militias: "กองกําลังอาสาที่ไดรับการฝกอยางเหมาะสม"
 AUS_properly_trained_militias_desc: "กองกําลังอาสาของเรากลายเปนสวนสําคัญของการปองกันประเทศ แต ณ ตอนนี้พวกเขายังไมไดรับการฝกอยางเปนทางการ แมโดยธรรมชาติของกองกําลังอาสาแลว การควบคุมทั้งหมดและการฝกอยางเต็มรูปแบบจะเปนไปไมได แตการฝกอบรมก็จะเปนประโยชนตอพวกเราทุกคน"

 AUS_the_peoples_army: "กองทัพประชาชน"
 AUS_the_peoples_army_desc: "ความทุมเทของเราในการทําใหประชาชนมีอาวุธอยางเหมาะสมในสถานการณนี้ ไดกอใหเกิดผลพลอยไดที่ไมคาดคิดแตนายินดียิ่ง ผูคนจํานวนมากขึ้นเรื่อย ๆ ตองการเขารวมกองทัพ"

 AUS_a_safe_harbor_for_dissidents: "ที่พักพิงอันปลอดภัยสําหรับผูเห็นตาง"
 AUS_a_safe_harbor_for_dissidents_desc: "ผูลี้ภัยทางการเมืองกลายเปนภาพที่พบเห็นไดทั่วไปในโลกยุคหลังนี้ บางคนมีความรูสึกทางการเมืองคลายกับเรา การดึงผูลี้ภัยเหลานี้มาอยูฝายเรา จะทําใหเราไดประโยชนอยางมากจากทักษะของพวกเขา"
 AUS_a_safe_harbor_for_dissidents_tt: "§Yออลกา ตาราตูตา§! ซึ่งใหผล (การสนับสนุนสงคราม §G+5%§!, เสถียรภาพ §R-10%§!, ปจจัยประชากรที่เกณฑได §G+10%§!, การสนับสนุนคอมมิวนิสตรายวัน §G+0.03§!)"

 AUS_establish_rote_hilfe: "ฟนฟูโรเทอฮิลเฟอ"
 AUS_establish_rote_hilfe_desc: "องคกรโรเทอฮิลเฟอแหงออสเตรีย (Österreichische Rote Hilfe) กอตั้งและนําโดยมัลเคอ ชอร ในป 1925 นับแตนั้นจนกระทั่งถูกรัฐออสโตรฟาสซิสตอันฉอฉลสั่งหาม องคกรนี้ไดชวยเหลือผูลี้ภัยทางการเมืองและผูขอลี้ภัยนับไมถวนใน[ROOT.GetNameDef] บัดนี้เมื่อระบอบเกาของเราสิ้นสุดลงแลว ก็ถึงเวลาที่เราจะใหพวกเขาดําเนินงานไดอยางเสรีอีกครั้ง"
 AUS_a_new_beginning: "จุดเริ่มตนใหม"
 AUS_a_new_beginning_desc: ""เมื่อเถาถานและฝุนผงจางลง และรัฐบาลใหมของเราไดเขารับตําแหนงอันชอบธรรม เราตองหันมองสูอนาคต นี่เปนเพียงจุดเริ่มตนของ[ROOT.GetNameDef] และเราจะเติบโตไปดวยกัน!""

 AUS_join_comintern: "เขารวมโคมินเทิรน"
 AUS_join_comintern_desc: "เมื่อไดเขาแนวเดียวกับสหภาพโซเวียตแลว เสนทางของเราก็ถูกปูไวอยางชัดเจน เราตองเขารวมกับสหายของเราในโคมินเทิรน นี่คือสิ่งที่ประชาชนของเราตองการและสมควรไดรับ!"

 AUS_danubian_socialist_communes: "จัดตั้งกลุมดานูบ"
 AUS_danubian_socialist_communes_desc: "จนถึงตอนนี้[ROOT.GetNameDef]ยืนหยัดตอสูศัตรูเพียงลําพัง เราไมปรารถนาใหเปนเชนนี้ในอนาคต แตขณะนี้ยังไมมีพันธมิตรใดที่สอดคลองกับอุดมการณของประเทศเรา การสรางฝายของเราเองจึงเปนทางเลือกที่ดีที่สุดอยางชัดเจน!"

 AUS_womens_education_initiative: "โครงการการศึกษาเพื่อสตรี"
 AUS_womens_education_initiative_desc: "ตั้งแตตนทศวรรษ 1900 สตรีไดรับอนุญาตใหศึกษาในมหาวิทยาลัย แตเฉพาะในบางคณะเทานั้น การผลักดันใหมหาวิทยาลัยเปดกวางสําหรับทุกคนนาจะเปนผลดีตอประเทศของเรา"

 AUS_universitat_wien: "มหาวิทยาลัยเวียนนา"
 AUS_universitat_wien_desc: "เชนเดียวกับมหาวิทยาลัยสวนใหญของเรา มหาวิทยาลัยในเวียนนาตองทนทุกขภายใตการปกครองของพวกฟาสซิสต แนวคิดฟาสซิสตแพรกระจายอยางเสรี สวนใหญโดยนักศึกษา การเขมงวดกฎระเบียบและทําใหแนใจวาสิ่งนี้จะไมเกิดขึ้นอีก จะชวยใหการศึกษามีคุณภาพสูงขึ้น"

 AUS_scientific_grants: "ทุนวิจัยทางวิทยาศาสตร"
 AUS_scientific_grants_desc: "เมื่อเราเพิ่มงบประมาณดานวิทยาศาสตรและการวิจัย ศักยภาพในการประยุกตใชความรูใหมนี้ก็ปรากฏชัดขึ้น การมอบทุนชุดหนึ่งออกไปนาจะชวยเสริมผลดีของสิ่งนี้ใหมากยิ่งขึ้น"
 available_scientist_tt: "§Gพรอมใชงาน§!ในฐานะ§Yนักวิทยาศาสตร§!:"

 AUS_centralize_the_industrial_sector: "รวมศูนยภาคอุตสาหกรรม"
 AUS_centralize_the_industrial_sector_desc: "เมื่อเวลาผานไปและแนวคิดคอมมิวนิสตหยั่งรากในประเทศ บัดนี้เราสามารถใชมาตรการที่เด็ดขาดยิ่งขึ้นได เมื่อไมกี่ปกอน แคความคิดเรื่องการรวมศูนยอุตสาหกรรมก็ถูกประชาชนตําหนิแลว แตตอนนี้มันดูเหมือนเปนกาวตอไปตามธรรมชาติ"

 AUS_cut_ties_with_the_church: "ตัดสัมพันธกับศาสนจักร"
 AUS_cut_ties_with_the_church_desc: "ความเชื่อมโยงระหวางรัฐบาลกับศาสนจักรเปนเพียงเศษซากของสิ่งที่เรียกวาฟาสซิสตแบบนักบวช ลัทธิฟาสซิสตถูกกําจัดไปแลว ถึงเวลาที่เราจะขจัดนักบวชออกจากอํานาจทางการเมืองดวย"
 generic_remove_as_political_advisor_tt: "§Rถอดออก§!จากตําแหนง§Yที่ปรึกษาการเมือง§!:"

 AUS_spur_the_communist_resistance: "สงเสริมแนวคิดคอมมิวนิสต"
 AUS_spur_the_communist_resistance_desc: "โลกรอบตัวเราเปนปฏิปกษตอทั้งสามัญชนและแรงงานมากขึ้นอยางมาก แมโชคดีที่เราเองรอดพนจากสิ่งเลวรายที่สุด แตเราไมอาจเพิกเฉยตอความทุกขทรมานของพี่นองรอบตัวเราได"
 AUS_danubian_communism_bypass_tt: "ทุกประเทศ§Yดานูบ§!และประเทศที่มี§Yผลประโยชนทางประวัติศาสตร§!ใน§Yภูมิภาคดานูบ§!:\nพรรครัฐบาลปจจุบันเปน§Yคอมมิวนิสต§!"
 AUS_danubian_communism_bypass_has_rejected_tt: "ไดปฏิเสธความพยายามของ[ROOT.GetAdjective]ในการสงเสริม§Yคอมมิวนิสต§!"
 AUS_spur_the_communist_resistance_tt: "ปลดล็อกการตัดสินใจ§Yสงเสริมแนวคิดคอมมิวนิสต§!ใน:"

 AUS_rapid_revolutions: "การปฏิวัติฉับพลัน"
 AUS_rapid_revolutions_desc: "แมสถานการณของเราจะทรุดลงจากการกระทําเพื่อปลดปลอยแรงงานตางชาติและยึดปจจัยการผลิตใหพวกเขา แตก็ไมมีเวลาพัก เราตองปลดปลอยสหายของเราจากพันธนาการของทุนนิยมโดยเร็วที่สุด แมวาจะทําใหสวัสดิภาพของประชาชนเราตองไดรับผลกระทบเล็กนอยและชั่วคราวก็ตาม"
 
 AUS_meticulous_preparations: "การเตรียมการอยางพิถีพิถัน"
 AUS_meticulous_preparations_desc: "มีแรงลอใจอยางแทจริงที่จะรีบปลดปลอยแรงงานรอบตัวเรา แตนั่นเสี่ยงตอการทิ้งแนวหลังใหวางเปลา ปฏิบัติการของเราในตางประเทศไดกอความวุนวายขึ้นใน[ROOT.GetNameDef] เราควรจัดการเรื่องนั้นกอนจะทุมเทชวยเหลือผูอื่น"

 AUS_demand_liberation_of_workers: "เรียกรองการปลดปลอยแรงงาน"
 AUS_demand_liberation_of_workers_desc: "ถึงเวลาที่เราตองลงมือแลว ดวยการเสริมสรางจิตวิญญาณคอมมิวนิสตตลอดลุมนํ้าดานูบ บัดนี้เราตองปลดปลอยผูที่เห็นพองกับเรา!"
 AUS_demand_liberation_of_workers_tt: "ปลดล็อกการตัดสินใจ§Yเรียกรองการปลดปลอยแรงงาน§!ในประเทศที่เราเคยเสริมสรางแนวคิดคอมมิวนิสตไดสําเร็จ"


 AUS_union_of_danubian_socialist_republics: "สหภาพนักสังคมนิยมดานูบ"
 AUS_union_of_danubian_socialist_republics_desc: "อิทธิพลของเราแผขยายไปทั่วยุโรปขณะที่แรงงานรอบตัวเราไดรับการปลดปลอย ชื่อเดิมของเราไมอาจสะทอนสิ่งที่เราเปนอยางแทจริงไดอีกตอไป เราควรพิจารณาวาเราตองการใหผูคนรูจักเราในนามใด"

 AUS_the_correct_communism: "รูปแบบคอมมิวนิสตที่ถูกตอง"
 AUS_the_correct_communism_desc: "มีหลายวิธีในการปฏิบัติตามแนวทางคอมมิวนิสต และสวนใหญไมถูกใจเรา [SOV.GetNameDefCap]กําลังลากชื่อของอุดมการณเราลงไปในโคลนตมดวยวิธีการปกครองของพวกเขา เราจะปลอยใหพวกเขาทําเชนนี้ตอไปไมได"

 AUS_seize_galicia: "ยึดดินแดนกาลิเซีย"
 AUS_seize_galicia_desc: "เมื่อหลายปผานไป เราไดตระหนักวาเราโหยหาดินแดนสวนหนึ่งของจักรวรรดิเกาของเราอยางยิ่ง การไดเห็นกาลิเซียถูกฉีกและโยนไปมาระหวางประเทศตาง ๆ ในชวงหลายปที่ผานมา ยิ่งทําใหเรามุงมั่นที่จะยึดมันกลับคืนมาอีกครั้ง"
 AUS_seize_galicia_tt: "ไดรับดินแดนหลักใน§Y[88.GetName]§!,§Y[89.GetName]§! และ§Y[91.GetName]§!\n\nไดรับ§Yเปาหมายสงคราม§!เพื่อยึดดินแดนหลักใน§Yกาลิเซีย§!คืน"



 AUS_regulate_austrian_finance_sector: "ควบคุมภาคการเงิน"
 AUS_regulate_austrian_finance_sector_desc: "เศรษฐกิจ[AUS.GetAdjective]ยังคงยํ่าแยแมเราจะพยายามอยางดีที่สุดเพื่อปรับสมดุล หากไมทําอะไรเลย เราเกรงวาวิกฤตเศรษฐกิจเต็มรูปแบบพรอมภาวะเงินเฟอรุนแรงอาจมาเยือนอีกในไมชา ถึงเวลาแลวที่เราจะยึดอํานาจควบคุมภาคการเงินของเราคืนมา"
 AUS_regulate_austrian_finance_sector_tt: "ปลดล็อกและกําหนดความเชี่ยวชาญของธนาคาร§Yกลุมธุรกิจอุตสาหกรรม§! ใหเพิ่ม§Yประสิทธิภาพการผลิตเริ่มตน§! หรือลดความตองการ§Yสินคาอุปโภคบริโภค§! อีกทางหนึ่ง ธนาคารอาจสงผลตอ§Yทั้งสองอยาง§!ในระดับที่นอยกวา"

 AUS_seek_papal_support: "แสวงหาการสนับสนุนจากพระสันตะปาปา"
 AUS_seek_papal_support_desc: "ในฐานะประเทศคาทอลิก เราใหความสําคัญอยางยิ่งตอคําของนักบวชมาโดยตลอด การไดรับการสนับสนุนจากองคสมเด็จพระสันตะปาปา นาจะเพิ่มความศรัทธาที่ประชาชนมีตอเราได"
 AUS_seek_papal_support_tt: "การเปลี่ยนแปลงความนิยมของพรรครัฐบาลปจจุบัน: §G5%§!"


 AUS_saved_creditanstalt_flag: "จัดลําดับความสําคัญของเงินทุนใหมไปยัง Österreichische Creditanstalt"
 AUS_saved_bankverein_flag: "จัดลําดับความสําคัญของเงินทุนใหมไปยัง Wiener Bankverein"
 AUS_kept_creditanstalt_bankverein_flag: "คงการควบรวม Creditanstalt-Bankverein ไว"

 AUS_invest_in_erzberg_steel_mines: "ลงทุนในเหมืองเหล็กแอรซแบรก"
 AUS_invest_in_erzberg_steel_mines_desc: "[AUS.GetNameDefCap]มีเหมืองเหล็กคอนขางอุดมสมบูรณมาโดยตลอด เหมืองที่แอรซแบรกดูจะใหผลตอบแทนดีเปนพิเศษ เราควรพิจารณาลงทุนเพิ่มเติมเพื่อใชประโยชนจากมันใหมากที่สุด"

 AUS_courting_the_princess_of_industry: "เกี้ยวพาเจาหญิงแหงอุตสาหกรรม"
 AUS_courting_the_princess_of_industry_desc: "มีเจาพออุตสาหกรรมหลายคนในประเทศของเราที่นาจะชวยเหลือเราได เอลีซาเบท ฟอน กุทมันน ธิดาของผูกอตั้ง Gebrüder Gutmann ซึ่งเคยครองการคาในออสเตรีย ดูจะมีแววที่สุด เราควรติดตอเธอและขอความชวยเหลือ"

 AUS_expand_stpoltner_steelworks: "ขยายโรงงานเหล็กซังคทเพิลเทิน"
 AUS_expand_stpoltner_steelworks_desc: "โรงงานเหล็กในซังคทเพิลเทินแสดงผลลัพธที่นาพอใจยิ่ง หากเราลงมือเร็ว เรานาจะปรับโรงงานใหเปนไปตามที่เราตองการเพื่อใหไดประโยชนสูงสุด"

 AUS_invest_in_semperit_synthetics: "ลงทุนใน Semperit Synthetics"
 AUS_invest_in_semperit_synthetics_desc: "เมื่อจัดการเรื่องการจัดหาเหล็กกลาเรียบรอยแลว เราตองพิจารณาทรัพยากรอื่นที่อาจจําเปนตอการพัฒนาในอนาคต เนื่องจากขาดแหลงยางและนํ้ามันที่ดีและใหญพอ เราจึงตองหาวิธีอื่นในการจัดหาทรัพยากรเหลานี้ภายในประเทศ"
 AUS_invest_in_semperit_synthetics_bonus: "การลงทุนใน Semperit"

 AUS_pulverfabrik_skodawerke: "ลงทุนใน Pulverfabrik Skodawerke"
 AUS_pulverfabrik_skodawerke_desc: "โรงงานเคมี Pulverfabrik Skodawerke ในนีเดอรเออสเตอรไรชเคยถูกใชงานหลายอยางในอดีต ทั้งดินปน ไดนาไมต และสารเคมีสําหรับโรงงานเหล็ก ขณะนี้การใชความเชี่ยวชาญของพวกเขาใหดีที่สุดนาจะเปนการชี้นําไปสูทรัพยากรสังเคราะห"
 AUS_pulverfabrik_skodawerke_tt: "โบนัสการวิจัย §G25%§! §Y3x§! สําหรับเทคโนโลยี: §Yการเก็บเชื้อเพลิง§! และ§Yการกลั่นเชื้อเพลิง§!"
 AUS_pulverfabrik_skodawerke_bonus: "การลงทุนใน Skodawerke"

 AUS_the_matzen_oil_fields: "ใชประโยชนจากแหลงนํ้ามันมัทเซิน"
 AUS_the_matzen_oil_fields_desc: "เมื่อไมนานมานี้เราโชคดี มีการคนพบนํ้ามันในพื้นที่รอบมัทเซินทางตะวันออกของ[AUS.GetNameDef] นี่คือโอกาสที่เราจะสกัดทรัพยากรนี้และสรางความไดเปรียบทางอุตสาหกรรมใหแกตนเอง!"

 AUS_autobahn_west: "ขยายเอาโทบานสายตะวันตก"
 AUS_autobahn_west_desc: "โครงสรางพื้นฐานของเราจําเปนตองปรับปรุง แมเราจะอยากเสริมโครงสรางพื้นฐานทั่วประเทศ แตความเปนจริงทางเศรษฐกิจและสถานการณอุตสาหกรรมของเราไมเอื้ออํานวย การสรางไปทางตะวันตกและเชื่อมเอาโทบานของเรากับ[GER.GetNameDef]เปนทางเลือกที่ดีที่สุดในสถานการณปจจุบัน"

 AUS_autobahn_south: "ขยายเอาโทบานสายใต"
 AUS_autobahn_south_desc: "โครงสรางพื้นฐานของเราจําเปนตองปรับปรุง แมเราจะอยากเสริมโครงสรางพื้นฐานทั่วประเทศ แตความเปนจริงทางเศรษฐกิจและสถานการณอุตสาหกรรมของเราไมเอื้ออํานวย การสรางไปทางใตและเชื่อมเอาโทบานของเรากับ[ITA.GetNameDef]เปนทางเลือกที่ดีที่สุดในสถานการณปจจุบัน"

 AUS_autobahn_east: "ขยายเอาโทบานสายตะวันออก"
 AUS_autobahn_east_desc: "เราไดเชื่อมเอาโทบานของเรากับหุนสวนแลว ซึ่งพิสูจนแลววาเปนประโยชนอยางยิ่งตอทั้งสองฝาย เมื่อมองไปทางตะวันออก เราพบพันธมิตรเกาในราชาธิปไตยคู [HUN.GetNameDef] หากเราเชื่อมโครงสรางพื้นฐานเขาดวยกัน เราก็นาจะสรางความสัมพันธที่ดีขึ้นกับพวกเขาไดเชนกัน"

 AUS_bbo_focus: "ลงทุนในการรถไฟแหงชาติออสเตรีย"
 AUS_bbo_focus_desc: "จนถึงขณะนี้ ทางรถไฟของเราถูกละเลย และ BBÖ บริษัทรถไฟของเราก็ถูกตัดงบประมาณ แตการบริหารประเทศใหประสบความสําเร็จ ไมวาจะใหญหรือเล็ก เราตองมีเครือขายทางรถไฟที่ครอบคลุมทั่วประเทศ เราควรเริ่มลงทุนใน BBÖ และทางรถไฟของเรา"
 AUS_bbo_focus_tt: "§Gเพิ่ม§!ประสิทธิผลของ§Yกลุมธุรกิจอุตสาหกรรม§!ที่มีอยู:"

 AUS_architechtual_advancements: "ความกาวหนาทางสถาปตยกรรม"
 AUS_architechtual_advancements_desc: "เมื่อไมนานมานี้เราไดรับแจงวามีสถาปนิกฝมือดีเยี่ยมคนหนึ่งในมหาวิทยาลัยแหงหนึ่งของเรา อาคารของเขามีทั้งความแข็งแรงทางโครงสรางและความสงางามที่ประเทศอยางเราสมควรไดรับ เราควรพิจารณาดึงตัวบุคคลนี้มารวมงาน"

 AUS_economic_resuscitation: "การฟนคืนชีพทางเศรษฐกิจ"
 AUS_economic_resuscitation_desc: "เศรษฐกิจของเรามีเสถียรภาพแลว แตหยุดนิ่งอยูในระดับที่ตํ่ามาก แมบางคนจะแยงวานี่เปนเรื่องดีเพราะเราไมไดดิ่งลงเหมือนกอนหินอีกตอไป แตเรารูวาเราทําไดดีกวานี้ ยังมีความพยายามที่ตองทํา และครั้งนี้เราจะทําใหแนใจวามันไดผลไมใชแคในระยะสั้น"
 AUS_economic_resuscitation_tt: "มอบจิตวิญญาณแหงชาติ§Yฟนตัวจากภาวะเศรษฐกิจตกตํ่า§!ใหออสเตรียอีกครั้ง หากเศรษฐกิจของประเทศพังทลายลงไปอีก"

 AUS_devalue_the_schilling: "ลดคาเงินชิลลิง"
 AUS_devalue_the_schilling_desc: "สวนหนึ่งของเหตุผลที่เศรษฐกิจของเรายํ่าแยและซบเซาคือคาเงินที่ออนแอ แมจะยังหางไกลจากอัตราเงินเฟอ 2877% ที่เราเคยเผชิญในป 1929 แตเงินเฟอของเราก็ยังสูงเกินไป แมอาจไมใชการตัดสินใจที่ประชาชนชื่นชอบที่สุด แตเราควรพิจารณาลดคาเงินของเรา"
 AUS_devaluing_the_schilling_tt: "เมื่อจิตวิญญาณแหงชาติ§Y$AUS_devalued_the_schilling$§!ถูกถอดออก แผนยุทธศาสตร§Y$AUS_bring_phonix_insurance_from_the_ashes$§! และ§Y$AUS_great_austrian_economic_push$§! จะพรอมใชงาน"

 AUS_bring_phonix_insurance_from_the_ashes: "ฟนฟูประกันภัยเฟนิกซจากเถาถาน"
 AUS_bring_phonix_insurance_from_the_ashes_desc: "เศรษฐกิจของเรากําลังฟนตัวจนกระทั่งเกิดเรื่องอื้อฉาวเฟนิกซเมื่อตนป 1936 ประกันภัยสําหรับผูเขารวมสงครามของพวกเขาทําใหเรามีชายฉกรรจใหเกณฑเขากองทัพ และทําใหประชาชนพอใจแมตองเผชิญสงคราม การฟนฟูเฟนิกซขึ้นจากเถาถานอาจเปนการกระทําที่ชาญฉลาด"
 AUS_bring_phonix_insurance_from_the_ashes_tt1: "แทนที่§Yการปกปดเรื่องประกันภัยเฟนิกซ§!ดวย§Yประกันภัยเฟนิกซ§!"

 AUS_great_austrian_economic_push: "การผลักดันเศรษฐกิจครั้งใหญของออสเตรีย"
 AUS_great_austrian_economic_push_desc: "ความพยายามอยางไมลดละของเรากําลังคอย ๆ ผลิดอกออกผล และเศรษฐกิจของเรากลับมาเติบโตอีกครั้ง เราอาจพอใจแคนี้ได แตตลอดกระบวนการฟนฟูเศรษฐกิจ เราไดเห็นศักยภาพที่ยังไมไดใช ทําไมตองพอใจกับสิ่งที่นอยกวาในเมื่อเราสามารถขยายภาคการเงินใหใหญยิ่งขึ้นได?"
 AUS_great_austrian_economic_push_tt: "เสริมเศรษฐกิจและผลผลิตของโรงงานใน[ROOT.GetNameDef]ยิ่งขึ้น โดยแทนที่§Yฟนตัวจากภาวะเศรษฐกิจตกตํ่า§!ดวย§Yเศรษฐกิจเฟองฟู§!"

 AUS_volkschule: "โรงเรียนประชาบาล"
 AUS_volkschule_desc: "ในชวงวิกฤตเศรษฐกิจ เปนเรื่องปกติที่เด็ก ๆ จะไมไดไปโรงเรียน แตตองทํางานหรือชวยงานบานแทน เมื่อวิกฤตที่เลวรายที่สุดผานพนไปแลว เราตองจัดการกับหนี้ความรูนี้ มิฉะนั้นเราจะลาหลังทั้งทางเทคโนโลยีและวิทยาศาสตร"

 AUS_industrialization_effort: "ความพยายามดานอุตสาหกรรมาภิวัตน"
 AUS_industrialization_effort_desc: "ภาคอุตสาหกรรม[AUS.GetAdjective]ฝาฟนสถานการณยากลําบากของเรามาไดดีอยางนาประหลาดใจ ดวยอัตราการวางงานที่สูง นี่อาจเปนโอกาสดวย การขยายอุตสาหกรรมจะชวยใหเราแกปญหาสองอยางไดในคราวเดียว ทั้งเพิ่มขีดความสามารถทางอุตสาหกรรมและลดการวางงาน"

 AUS_invest_in_alpen_elektrowerke: "Alpen-Elektrowerke"
 AUS_invest_in_alpen_elektrowerke_desc: "เพื่อใหแขงขันไดในตลาดสากล เราตองคิดคนนวัตกรรมและหาทางออกใหม ๆ อยูเสมอ การลงทุนในบริษัทอยาง Alpen-Elektrowerke ที่เชี่ยวชาญดานการพัฒนาอิเล็กทรอนิกสอยางมาก อาจใหความไดเปรียบที่เราตองการ"

 AUS_invest_in_kapsch: "Telefon- und Telegrafen-Fabrik"
 AUS_invest_in_kapsch_desc: "เพื่อใหแขงขันไดในตลาดสากล เราตองคิดคนนวัตกรรมและหาทางออกใหม ๆ อยูเสมอ การลงทุนในบริษัทอยาง Telefon- und Telegrafen-Fabriks-Aktiengesellschaft ที่ดูแลทั้งอิเล็กทรอนิกสและเรดาร อาจทําใหเรามีความรูที่กวางขวางซึ่งคูแขงนอยรายจะเทียบได"

 AUS_construction_guilds: "จัดตั้งสมาคมชางกอสราง"
 AUS_construction_guilds_desc: "เมื่อ[AUS.GetNameDef]ดึงดูดภาคอุตสาหกรรมมากขึ้นเรื่อย ๆ เราไดตระหนักวาเราสรางโรงงานใหมไดไมเร็วพออีกตอไป การจัดตั้งสมาคมชางกอสรางจะชวยเรงการกอสรางภายในประเทศ"

 AUS_apprentice_programmes: "เริ่มโครงการฝกงาน"
 AUS_apprentice_programmes_desc: "หลังจากชวงเวลาอันยาวนานของภาวะเศรษฐกิจถดถอยและการวางงาน ผูคนจํานวนมากขาดทักษะและประสบการณที่จําเปนสําหรับงานในโรงงานที่ตอนนี้มีพรอมแลว การจัดโครงการฝกงานจะเปนขอตกลงที่เปนประโยชนตอทั้งโรงงานและแรงงาน"




 AUS_osterreichische_luftstreitkrafte: "กองทัพอากาศออสเตรีย"
 AUS_osterreichische_luftstreitkrafte_desc: "กองทัพอากาศของเราไดรับผลกระทบในทางลบอยางรุนแรงจากสนธิสัญญาที่ถูกบังคับใชกับเราเพราะการกระทําของบรรพบุรุษ เพื่อใหมีโอกาสอยูรอดในโลกใหมที่โหดรายกวาเดิมมาก เราตองพิจารณาฟนฟูกองทัพอากาศใหไดมาตรฐานของยุคปจจุบัน"

 AUS_preparing_the_industry: "การผลิตอากาศยานที่ Lohner-Werke"
 AUS_preparing_the_industry_desc: "ผูผลิตเครื่องบินที่สําคัญและมีคุณคาที่สุดรายหนึ่งของเราไดหยุดผลิตอากาศยานใหมโดยสิ้นเชิงนับตั้งแตสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลมีผลบังคับใช บัดนี้เมื่อเรากําลังฟนฟูกองทัพอากาศ เราก็ตองฟนฟูผูผลิตของเราดวย"

 AUS_purchase_foreign_designs: "จัดซื้ออากาศยานตางประเทศ"
 AUS_purchase_foreign_designs_desc: "เพื่อใหแขงขันไดอยางแทจริงในนานฟา เราตองศึกษาวาประเทศอื่นออกแบบอากาศยานอยางไร แมการผลิตในประเทศจะมีขอดี แตการทดลองและจัดซื้อจากหลากหลายประเทศจะทําใหเราไดอากาศยานที่ดีที่สุดตามความตองการ โดยไมตองลงทุนกอนใหญในตอนแรก"

 AUS_seek_international_partners: "แสวงหาหุนสวนนานาชาติ"
 AUS_seek_international_partners_desc: "หากเราตองการแขงขันไดในนานฟา เราตองเรียนรูจากผูอื่นรอบตัววาจะบริหารกองทัพอากาศอยางไรใหดีที่สุด การเรียนรูจากมหาอํานาจ และประเทศที่เคยเผชิญความยากลําบากคลายเรา จะทําใหเราไปไดไกลยิ่งกวาเดิม"
 AUS_seek_international_partners_tt: "§Yผลสําหรับประเทศใดก็ตามที่ตอบรับ!§!:"
 AUS_seek_international_partners_tt2: "§Y[ROOT.GetNameWithFlag]§! จะไดรับ§Yประสบการณกองทัพอากาศ§! 50 สําหรับทุกประเทศที่ตอบรับ!"
 AUS_seek_international_partners_tt3: "§Y[ROOT.GetNameWithFlag]§! จะไดรับ§Yการเขาถึงตลาด§!ของทุกประเทศที่ตอบรับ!"


 AUS_air_research_boost: "กองทัพอากาศแหงนวัตกรรม"
 AUS_air_research_boost_desc: "[GetAirPartners]"
 AUS_has_no_air_partners: "แมจะพยายามอยางดีที่สุด เราก็ลมเหลวในการหาหุนสวนสําหรับความพยายามดานกองทัพอากาศ เราไมมีทางเลือกอื่นนอกจากลงทุนในการวิจัยของเราเอง"
 AUS_has_air_partners: "เมื่อไดทดสอบและบินอากาศยานหลากหลายแบบแลว เราอยูในตําแหนงพิเศษที่สามารถคัดเลือกคุณสมบัติที่เราชอบและไมชอบสําหรับอากาศยานของเราได เราอาจพิจารณาใชความรูใหมนี้ใหเปนประโยชน และวิศวกรรมยอนกลับคุณลักษณะที่นาปรารถนาที่สุดจากอากาศยานที่เราไดทดลองมา"
 AUS_innovative_airforce_bonus: "กองทัพอากาศแหงนวัตกรรม"

 AUS_focus_on_domestic_production: "การผลิตอากาศยานในประเทศ"
 AUS_focus_on_domestic_production_desc: "การสรางและบํารุงรักษากองทัพอากาศดวยตนเองทั้งหมดเปนงานมหึมา แตในสถานการณที่ไมแนนอนเชนนี้ เราไมอาจปลอยใหตัวเองตองพึ่งพาผูอื่นในสวนสําคัญของกองทัพ ไมวาตนทุนเริ่มแรกจะสูงเพียงใด เราตองพึ่งพาตนเองไดในดานกองทัพอากาศ"

 AUS_revitalize_austrian_air_industry: "ฟนฟูอุตสาหกรรมการบิน"
 AUS_revitalize_austrian_air_industry_desc: "เราเคยมีผูผลิตอากาศยานอยูไมกี่รายใน[AUS.GetNameDef]กอนและระหวางมหาสงคราม แตนับตั้งแตสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลถูกบังคับใชกับเรา สิ่งนั้นก็เปนไปไมได บัดนี้เมื่อสนธิสัญญาถูกยกเลิกแลว เราควรรีบฟนฟูอุตสาหกรรมของเราขึ้นใหมเผื่อในกรณีที่เราตองการมัน"

 AUS_light_specialization: "โครงการ Jagdfliegerkompanie"
 AUS_light_specialization_desc: "เราไมอาจแขงขันกับประเทศที่ใหญกวาไดอยางแทจริงในเรื่องอากาศยานขนาดใหญ แตดวยเครื่องบินขับไลและ CAS ที่เหนือกวา เราสามารถทําใหแนใจไดวาศัตรูจะไปไมถึงดินแดนของเราเลย ทายที่สุดแลว การรบทางอากาศชนะหรือแพกันที่การตอสูระยะประชิดกลางอากาศ"
 AUS_light_specialization_bonus: "โครงการ Jagdfliegerkompanie"

 AUS_medium_specialization: "โครงการ Schlachtfliegerkompanie"
 AUS_medium_specialization_desc: "กองทัพอากาศของเราตองสามารถทําหนาที่ไดหลายบทบาท เราไมมีทรัพยากรพอที่จะสรางทุกดานของกองทัพอากาศ ดังนั้นการหาจุดประนีประนอมที่ดีจึงสําคัญยิ่ง เครื่องบินสองเครื่องยนตใชไดทั้งเปนเครื่องบินทิ้งระเบิดและเครื่องบินขับไล และดูจะเปนการประนีประนอมที่สมบูรณแบบสําหรับเรา"
 AUS_medium_specialization_bonus: "โครงการ Schlachtfliegerkompanie"

 AUS_heavy_specialization: "โครงการ Grossflugzeugkompanie"
 AUS_heavy_specialization_desc: "เราพอจะคาดไดวาคนอื่นจะคาดหวังใหเรามีกองทัพอากาศที่ประกอบดวยอากาศยานขนาดเล็กเปนหลัก กองทัพอากาศหนักอาจดูเปนไปไมไดหรือไมสะดวก แตดวยการลงทุนที่ถูกตอง เราสามารถบดขยี้ศัตรูสวนใหญไดดวยกําลังอันทวมทน"
 AUS_heavy_specialization_bonus: "โครงการ Grossflugzeugkompanie"

 AUS_air_base_intiative: "โครงการกอสรางฐานทัพอากาศ"
 AUS_air_base_intiative_desc: "แมจะมีฐานทัพอากาศใน[AUS.GetNameDef] แตก็ไมเพียงพอที่จะรองรับกองทัพอากาศของเราซึ่งเพิ่งขยายใหญขึ้นอยางมากอีกตอไป เพื่อใหใชกองทัพอากาศไดอยางเต็มประสิทธิภาพ เราควรพิจารณาสรางโครงสรางพื้นฐานที่จําเปนเพื่อใหเครื่องบินของเราอยูบนทองฟาได"

 AUS_wien_anti_air_effort: "หอตอสูอากาศยานแหงเวียนนา"
 AUS_wien_anti_air_effort_desc: "แมเราจะไววางใจเต็มที่วากองทัพอากาศของเราจะปกปองประเทศจากการโจมตีทางอากาศได แตสิ่งปลูกสรางตอสูอากาศยานก็สามารถเพิ่มการปองกันอีกชั้นที่นายินดีในพื้นที่ที่มีประชากรหนาแนน เราควรพิจารณาสรางสิ่งปลูกสรางตอสูอากาศยานในพื้นที่เวียนนา"

 AUS_radar_effort: "โครงการระบบโกลดเฮาเบอ"
 AUS_radar_effort_desc: "กองทัพอากาศสมัยใหมไมไดพึ่งพาเพียงเครื่องบิน แตยังตองพึ่งพาเทคโนโลยีที่ดีในการนําทางดวย เมื่อมีการคนพบเรดาร เราไมอาจปลอยใหตัวเองลาหลังทางเทคโนโลยีได!"

 AUS_flight_schools: "โรงเรียนการบินออสเตรีย"
 AUS_flight_schools_desc: "การที่เราจะประสบความสําเร็จในนานฟา ไมใชแคเครื่องบินของเราเทานั้นที่ตองเหนือกวา เพื่อยืนยันความเปนใหญในนานฟา เราตองมอบการฝกที่ดีที่สุดใหนักบินเพื่อเตรียมพรอมสําหรับทุกสถานการณที่อาจเผชิญ เชนเดียวกับที่เราฝกกองพลภาคพื้นดิน เราตองจัดตั้งหลักสูตรการฝกสําหรับนักบินของเรา"

 AUS_neustadter_flugzeugwerke: "Neustädter Flugzeugwerke"
 AUS_neustadter_flugzeugwerke_desc: "เมื่อไมนานมานี้ ผูผลิตอากาศยานรายใหมไดซื้อโรงงาน Oesterreichische Flugzeugfabrik ที่ปลดระวางแลว บริษัทใหม Neustädter Flugzeugwerke ตั้งใจจะสรางเครื่องบินกีฬาขนาดเบา แตเนื่องจากบริษัทกอตั้งโดยอดีตนักบินขับไลสองคน เราจึงอาจโนมนาวใหพวกเขาผลิตใหเราแทนได"

 AUS_aerial_strategies: "ยุทธศาสตรทางอากาศ"
 AUS_aerial_strategies_desc: "การเรียนรูจากประสบการณเปนคุณธรรมในการรบทุกรูปแบบ การพัฒนาและยกระดับยุทธศาสตรทางอากาศอยางตอเนื่อง จะทําใหเรานําหนาศัตรูอยูหนึ่งกาวเสมอ"


 AUS_secret_rearmament: "การติดอาวุธใหมอยางลับ ๆ"
 AUS_secret_rearmament_desc: "เปนเวลานานมากที่ขอจํากัดการติดอาวุธใหมทําใหเราไมสามารถสรางกองทัพในรูปแบบใดไดเลย แมสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลจะยังมีผลอยู แตเราพบชองโหวบางประการที่สามารถใชอางความชอบธรรมในการติดอาวุธใหมอยางลับ ๆ ได"

 AUS_militarization_effort: "Grazer Maschinen-und Waggonbau"
 AUS_militarization_effort_desc: "หนึ่งในบริษัทที่กองทัพอันเคยเกรียงไกรของเราพึ่งพาอยางมากคือ Grazer Maschinen- und Waggonbau-Aktiengesellschaft พวกเขาไมเพียงสรางยานพาหนะ แตยังผลิตเพลาสําหรับปนครกและปนเล็กยาวดวย และเคยเปนเสาหลักของขีดความสามารถทางทหารของเรา เราควรทําใหพวกเขากลับมาเปนเชนนั้นอีกครั้ง"

 AUS_osterreichische_bundesheer: "[GetArmyName]"
 AUS_army_is_bundesheer: "กองทัพสหพันธออสเตรีย"
 AUS_army_is_landwehr: " ลันดเวรแหงออสเตรีย"
 AUS_osterreichische_bundesheer_desc: "เมื่อสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลไมเปนอุปสรรคอีกตอไป ก็ถึงเวลาที่เราจะเริ่มฟนฟูกองทัพอยางจริงจัง [ROOT.GetNameDefCap]จะถูกจูโจมโดยไมทันตั้งตัวไมได และเราก็ไมอาจนั่งรอเฉย ๆ ทามกลางโลกที่คุกคามมากขึ้นเรื่อย ๆ"
 

 AUS_standardized_army_training: "การฝกกองทัพแบบมาตรฐาน"
 AUS_standardized_army_training_desc: "หลายปที่ไมสามารถฝกทหารใหมไดทิ้งรองรอยไวบนระบบการฝกของกองพลเรา หากเราตองการมอบการฝกที่ดีที่สุดใหกองทัพ เราควรพิจารณาปรับปรุงขั้นตอนการฝกทหารใหม"

 AUS_osterreichische_fallschirmsjager: "พลรมออสเตรีย"
 AUS_osterreichische_fallschirmsjager_desc: "เมื่อไดฟนฟูทั้งกองทัพบกและกองทัพอากาศแลว ก็ถึงเวลาที่เราจะหาวิธีผสานสองสิ่งนี้เขาดวยกันเพื่อประโยชนสูงสุด"

 AUS_osterreichische_gebirgsjager: "ทหารภูเขาออสเตรีย"
 AUS_osterreichische_gebirgsjager_desc: "ในฐานะประเทศที่เต็มไปดวยภูเขา จึงเปนประโยชนสูงสุดของเราที่จะทําใหทหารไดรับการฝกอยางเพียงพอสําหรับการรบในสภาพและภูมิประเทศเชนนี้"
 AUS_osterreichische_gebirgsjager_tt: "เปดใช§Hการฝกปองกันในภูเขา§!\n§Hทหารราบ\n    ภูเขา§!\n      การปองกัน: §G+5%§!\n      การเคลื่อนที่: §G+5%§!\n§Hทหารภูเขา\n    ภูเขา§!\n      การปองกัน: §G+5%§!\n      การเคลื่อนที่: §G+10%§!\n"

 AUS_osterreichische_seebataillon: "กองพันนาวิกออสเตรีย"
 AUS_osterreichische_seebataillon_desc: "เราผานอะไรมามากมายเพื่อยึดที่มั่นบนแนวชายฝง เพียงเพื่อจะพบวากองทัพของเราไมพรอมเลยสําหรับการสูรบจริงในสภาพเชนนี้ เราตองหาสิ่งที่จะชวยใหทหารเหลานี้ตอสูไดอยางมีประสิทธิภาพมากขึ้น"

 AUS_steyr_arms_investment: "ลงทุนใน Steyr Arms"
 AUS_steyr_arms_investment_desc: "ผูผลิตอาวุธปนชั้นนําในอดีตของเราไดรับความเสียหายอยางหนักจากการถูกผูกมัดดวยสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล เพื่อกระตุนความสามารถในการผลิตใหไดปริมาณที่เราตองการ เราควรพิจารณาลงทุน"
 AUS_steyr_arms_investment_tt: "ปลดล็อก§YSteyr Arms§!เปนผูออกแบบ"

 AUS_improve_army_logistics: "ปรับปรุงการสงกําลังบํารุงของกองทัพ"
 AUS_improve_army_logistics_desc: "ประเทศของเราอุดมไปดวยทัศนียภาพอันงดงาม แตนาเสียดายที่นั่นหมายถึงการมีภูมิประเทศที่ผานยากและความทาทายดานการสงกําลังบํารุงมากมายดวย หากเราไมรับมือกับสิ่งเหลานี้ ความพยายามในยามสงครามของเราอาจออกมาแยกวาที่ควร"

 AUS_reinforcing_the_supply_network: "เสริมเครือขายเสบียง"
 AUS_reinforcing_the_supply_network_desc: "เราไดตระหนักวาความพยายามปรับปรุงสถานการณเสบียงดวยการเพิ่มความอดทนของกองทัพตอการขาดเสบียงนั้นยังไมเพียงพอ เพื่อแกปญหาใหจบสิ้น เราตองปรับปรุงตัวเครือขายเสบียงเองอยางแทจริง"

 AUS_supporting_the_troops: "สนับสนุนกําลังพล"
 AUS_supporting_the_troops_desc: "เพื่อยกระดับประสิทธิภาพของทหารในสนามรบ เราตองใหการสนับสนุนพวกเขาใหมากที่สุด กองรอยสนับสนุนที่มีโรงพยาบาลสนาม หนวยลาดตระเวน และปนใหญสนับสนุน จะเปนประโยชนอยางยิ่ง"

 AUS_bring_generals_out_of_retirement: "เรียกนายพลเกษียณกลับมารับราชการ"
 AUS_bring_generals_out_of_retirement_desc: "ประเทศของเรามีประวัติศาสตรการทําสงคราม และแมจะมีขอเสีย แตก็หมายความวาเรามีผูบัญชาการที่มีความสามารถมากมาย บางคนเกษียณไปแลว แตดวยการเกลี้ยกลอมสักหนอย เรานาจะดึงพวกเขากลับมาได"

 AUS_follow_the_jansa_plan: "ดําเนินตามแผนอัลเฟรด ยันซา"
 AUS_follow_the_jansa_plan_desc: "จอมพลอัลเฟรด ยันซา ผูมากประสบการณ ไดวางแผนปองกัน[AUS.GetNameDef]ในกรณีที่ถูก[GER.GetAdjective]โจมตีมานานแลว ดวยสถานการณโลกในปจจุบัน ดูเหมือนวาเราอาจจําเปนตองใชแผนนั้นอยางนาเสียดาย"
 AUS_follow_the_jansa_plan_tt: "§Rจะถอดฟรันซ เบอเมอ ออกจากการเปนผูบัญชาการทหารบกที่เปนไปไดอยางถาวร!§!"
 AUS_follow_the_jansa_plan_tt2: "พรอมใชงานในฐานะ§Yผูบัญชาการทหารบก§!:"

 AUS_fortify_the_traun_line: "สรางปอมปราการแนวเทราน"
 AUS_fortify_the_traun_line_available_tt: "อยางนอยหนึ่งจังหวัดใน§Y[152.GetName]§!หรือ§Y[4.GetName]§!ที่ติดกับ§Y[GER.GetNameWithFlag]§! มีพื้นที่สราง§Yปอมภาคพื้นดิน§! §Y3§! ระดับขึ้นไป"
 AUS_fortify_the_traun_line_bypass_tt: "ไมมีจังหวัดใดใน§Y[152.GetName]§!หรือ§Y[4.GetName]§!ที่ติดกับ§Y[GER.GetNameWithFlag]§! มีพื้นที่สราง§Yปอมภาคพื้นดิน§! §Y3§! ระดับขึ้นไป"
 AUS_fortify_the_traun_line_desc: "ขั้นแรกของแผนที่ยันซาวางไวคือการสรางปอมตามแนวแมนํ้าเทราน แตตามสถานการณปจจุบัน ไดมีการตัดสินใจผลักแนวปอมขึ้นไปจนชิดชายแดน[GER.GetAdjective] เราควรเริ่มโครงการนี้กอนที่มันจะไรประโยชน"
 AUS_fortify_the_traun_line_tt: "สราง§Yปอมภาคพื้นดิน§!ระดับ 3 ตามแนวชายแดน[GER.GetAdjective]จากลินซถึงซาลซบูรกในจังหวัดที่มีพื้นที่เพียงพอ"

 AUS_extend_the_traun_line: "ขยายแนวเทราน"
 AUS_extend_the_traun_line_desc: "แมปอมปราการปจจุบันจะรักษาชายแดนตะวันตกเฉียงเหนือไวได แตเรายังมีชองเขาใกลอินสบรุคที่ไมมีการปองกัน การขยายแนวปอมปราการจะทําใหมั่นใจไดวาไมมีศัตรูลอบเขามาทางดานหลังแนวปอมของเรา"
 AUS_extend_the_traun_line_available_tt: "อยางนอยหนึ่งจังหวัดใน§Y[153.GetName]§!ที่ติดกับ§Y[GER.GetNameWithFlag]§! มีพื้นที่สราง§Yปอมภาคพื้นดิน§! §Y3§! ระดับขึ้นไป"
 AUS_extend_the_traun_line_bypass_tt: "ไมมีจังหวัดใดใน§Y[153.GetName]§!ที่ติดกับ§Y[GER.GetNameWithFlag]§! มีพื้นที่สราง§Yปอมภาคพื้นดิน§! §Y3§! ระดับขึ้นไป"
 AUS_extend_the_traun_line_tt: "สราง§Yปอมภาคพื้นดิน§!ระดับ 3 ตามแนวชายแดน[GER.GetAdjective]จากซาลซบูรกถึงอินสบรุคในจังหวัดที่มีพื้นที่เพียงพอ"

 AUS_the_homeland_front: "แนวรบมาตุภูมิ"
 AUS_the_homeland_front_desc: "ในกรณีที่เราถูกรุกรานครั้งใหญ ชาวออสเตรียทุกคนตองทําหนาที่ตอมาตุภูมิ เราควรฝกทหารโดยเฉพาะสําหรับสถานการณนี้ คือการตอสูเพื่อมาตุภูมิ เพื่อใหมั่นใจวาหากมันเกิดขึ้นจริง เราจะพรอม"

 AUS_establish_bohme_plan: "วางแผนฟรันซ เบอเมอ"
 AUS_establish_bohme_plan_desc: "ฟรันซ เบอเมอ หนึ่งในจอมพลของเรา ไดศึกษาแผนการรบเชิงรุกสําหรับกรณีที่เราตองการโจมตีออกนอกพรมแดน ดวยความทะเยอทะยานในปจจุบันของเรา แผนนี้อาจเปนประโยชน"
 AUS_establish_bohme_plan_tt: "§Rจะถอดอัลเฟรด ยันซา ออกจากการเปนผูบัญชาการทหารบกที่เปนไปไดอยางถาวร!§!"

 AUS_intensify_training_efforts: "เขมขนการฝก"
 AUS_intensify_training_efforts_desc: "แมความพยายามในการฝกของเราจะไดผล แตเราเชื่อวายังปรับปรุงไดอีก การเพิ่มประสิทธิภาพการฝกขั้นพื้นฐานจะชวยลดเวลาที่ตองใชในการฝกทหารลงไดอีก"

 AUS_heeding_the_call_of_duty: "ขานรับเสียงเรียกแหงหนาที่"
 AUS_heeding_the_call_of_duty_desc: "ประชาชนชาวออสเตรียตองยอมรับสถานการณของประเทศ แมไมมีใครปรารถนาใหเกิดสงคราม แตก็ไมมีหลักประกันวามันจะไมเกิดขึ้น การทําใหประชาชนไววางใจในวิจารณญาณของเรา และพรอมจะตอสูหากจําเปน จะเพิ่มความพรอมของเราอยางมาก"

 AUS_strengthen_the_arms_industry: "Leopold Gasser Waffenfabrik"
 AUS_strengthen_the_arms_industry_desc: "ผูผลิตเกาบางรายของเรายังคงผลิตสินคาพลเรือนอยู แมตอนนี้เราจะตองการอาวุธอยางชัดเจนแลวก็ตาม ดวยแรงจูงใจทางการเงิน เรานาจะทําให Leopold Gasser Waffenfabrik กลับมาดําเนินกิจการและผลิตอาวุธปนที่จําเปนได"

 AUS_improved_warfare_strategies: "ยุทธศาสตรการสงครามที่ปรับปรุงแลว"
 AUS_improved_warfare_strategies_desc: "หลังจากอยูภายใตสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลมาหลายป ยุทธศาสตรและหลักนิยมของเราลาสมัยไปมาก แมเราจะผานพนมาไดจนถึงตอนนี้ แตหากไมปรับปรุง เราก็กําลังเตรียมตัวไปสูความลมเหลว"
 AUS_improved_warfare_strategies_bonus: "ยุทธศาสตรการสงครามที่ปรับปรุงแลว"

 AUS_hirtenberger_artillery: "ลงทุนในปนใหญ Hirtenberger"
 AUS_hirtenberger_artillery_desc: "เปนเวลานานที่ Hirtenberger คือชื่อแรกที่เรานึกถึงเมื่อตองการปนใหญและกระสุน บัดนี้พวกเขาก็เหมือนกับอุตสาหกรรมทหารสวนที่เหลือของเรา ที่ขาดแคลนเงินทุนระหวางที่เราอยูภายใตสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล เราควรลงทุนเพื่อใหพวกเขากลับมาเขาที่เขาทาง" 
 AUS_hirtenberger_artillery_tt: "ปลดล็อก§YHirtenberger Defence Systems§!เปนผูออกแบบ"

 AUS_saurerwerke: "Österreichische Saurerwerke"
 AUS_saurerwerke_desc: "Österreichische Saurerwerke ผลิตรถบรรทุกสําหรับการใชงานหลากหลายมาเปนเวลานาน แตในยามเชนนี้ เราตองการใหพวกเขามุงเนนเฉพาะสิ่งที่ทําไดดีที่สุด นั่นคือการผลิตรถบรรทุกสําหรับกองทัพ"

 AUS_graf_und_stift_focus: "Gräf & Stift"
 AUS_graf_und_stift_focus_desc: "แม Gräf & Stift แทบไมเคยผลิตรถบรรทุกสําหรับกองทัพเลย แตพวกเขามีชื่อเสียงอยางมากในการผลิตรถยนตและรถบรรทุกที่รวดเร็ว แมจะเปนแนวทางที่ไมธรรมดา แตก็อาจพิสูจนไดวามีประโยชนในสนามรบ"

 AUS_invite_foreign_tank_designers: "เชิญนักออกแบบรถถังตางชาติ"
 AUS_invite_foreign_tank_designers_desc: "[AUS.GetNameDefCap]ยังขาดนักออกแบบรถถังที่เชื่อถือได จนถึงตอนนี้เราใชรถถังหลากหลายแบบ แตถึงเวลาแลวที่เราจะเริ่มผลิตรถถังของเราเอง การเชิญ Ansaldo มาดําเนินงานที่นี่เปนกาวแรกที่ยอดเยี่ยม"
 AUS_invite_foreign_tank_designers_tt: "ปลดล็อก§YAnsaldo§!เปนผูออกแบบ"

 AUS_basic_tanks: "โครงการยานเกราะ"
 AUS_basic_tanks_desc: "รถถังสวนใหญของเราคอนขางลาสมัยและตองปรับปรุง เมื่อเรามีผูสรางรถถังแลว การลงทุนวิจัยเพื่อหาวิธีปรับปรุงรถถังใหดีที่สุดอาจเปนประโยชน"
 AUS_panzer_effort_bonus: "โครงการยานเกราะ"

 AUS_advanced_tanks: "โครงการยานเกราะขั้นสูง"
 AUS_advanced_tanks_desc: "เมื่อพิจารณารถถังของเรา เราตระหนักวาพวกมันไมหุมเกราะหนักและเชื่องชา ก็เบาและคลองตัวแตไมทนทาน การเลือกสิ่งที่ดีที่สุดจากแนวคิดการออกแบบทั้งสองแบบ จะทําใหเราผลิตรถถังที่ทั้งทนทานและคลองตัว หุมเกราะหนักแตรวดเร็วได"

 AUS_reestablish_austrian_navy: "สถาปนากองทัพเรือขึ้นใหม"
 AUS_reestablish_austrian_navy_desc: "การสูญเสียแนวชายฝงเมื่อสิ้นสุดมหาสงคราม ทําใหเราไมมีโอกาสตอเรือใหมอีก เราจําใจมอบกองเรือที่เหลืออยูใหแกรัฐที่แยกตัวออกไปอยาง[YUG.GetNameDef] ซึ่งตอมาก็ยกมันใหผูอื่นไปภายในเวลาไมถึงสองสัปดาห บัดนี้เมื่อเรามีโอกาสพัฒนากองทัพเรืออีกครั้ง เราตองทําใหแนใจวาความผิดพลาดนี้จะไมเกิดซํ้าอีก"
 AUS_build_dockyards_if_coastal: "จะสราง§Yอูตอเรือ§!ทันทีในรัฐชายฝงแบบสุมที่ออสเตรียควบคุม ใชไดเฉพาะเมื่อควบคุมรัฐชายฝงอยางนอยหนึ่งรัฐ"

 AUS_rebuild_the_armada: "ฟนฟูกองเรือรบใหญ"
 AUS_rebuild_the_armada_desc: "เรามีประวัติในการผลิตเรือประจัญบานทรงพลังและครองทองทะเล วันเหลานั้นดูหางไกลไปแลว แตความรูยังไมสูญหาย ถึงเวลาที่เราจะทวงคืนทองทะเล และจะมีวิธีใดดีไปกวาการสรางกองเรือขนาดใหญ พรอมเรือประจัญบานขนาดมหึมาเพื่อยับยั้งผูโจมตีทุกราย"

 AUS_revive_stt: "ฟนฟู STT"
 AUS_revive_stt_desc: "Stabilimento Tecnico Triestino เคยเปนอูตอเรือหลักสําหรับเรือขนาดใหญของเรา เรือที่พวกเขาผลิตมีคุณภาพเปนเลิศและรับใชเราเปนอยางดีในอดีต เมื่ออูตอเรือบางแหงกลับมาอยูใตการควบคุมของเราอีกครั้ง เราควรนําพวกเขากลับมาดําเนินงานอีก"
 AUS_rebuild_the_armada_bonus: "ฟนฟูกองเรือรบใหญ"

 AUS_streamline_production: "ปรับปรุงสายการผลิตเรือใหคลองตัว"
 AUS_streamline_production_desc: "เรือขนาดใหญมีขอดีมากมาย เชน เปนเครื่องยับยั้งการโจมตี และสามารถสรางความเสียหายรายแรงตอฝายตรงขาม แตก็มีขอเสียสําคัญ คือตนทุนทั้งดานเวลาและวัสดุที่สูง ชางตอเรือของเรามีแนวคิดวาจะเรงการผลิตไดอยางไร"

 AUS_continue_old_production: "สานตอสายการผลิตเดิม"
 AUS_continue_old_production_desc: "กอนที่เราจะเสียการควบคุมแนวชายฝง เราไดเริ่มสรางเรือประจัญบานอันรุงโรจนสองลํา  ตัวเรือยังอยูในมือเรา และแมตอนนี้จะลาสมัยไปบาง แตก็ยังอาจเปนทรัพยสินอันยอดเยี่ยมในความพยายามทางนาวีครั้งใหมของเรา"
 AUS_continue_old_production_tt: "หากยังไมไดปลดล็อกเทคโนโลยีสําหรับสราง§Yเรือประจัญบาน§! จะปลดล็อกเทคโนโลยีดังกลาว"

 AUS_reclaim_dockyards: "ทวงคืนอูตอเรือเกา"
 AUS_reclaim_dockyards_desc: "เมื่อธรรมชาติของการรบทางทะเลเปลี่ยนไป ความตองการของกองทัพเรือก็เปลี่ยนตาม วันที่นําเรือเพียงไมกี่ลําแตทรงพลังเขาสูสนามรบไดผานพนไปนานแลว การรบทางทะเลสมัยใหมตองการใหเรามีขีดความสามารถที่สูงกวามากทั้งในการตอเรือใหมและซอมเรือของเราเอง เราควรเพิ่มจํานวนอูตอเรือ"

 AUS_promote_admirals: "เลื่อนยศพลเรือเอก"
 AUS_promote_admirals_desc: "เมื่อไมมีกองทัพเรือมานาน จึงเปนธรรมดาที่เราไมมีพลเรือเอกมากเทาที่เคยมี แมกลุมผูที่จะเปนพลเรือเอกไดจะไมไดใหญนัก แตเราก็ยังมีบางคนที่มีประสบการณอยูบางซึ่งอาจนํากองเรือของเราไปสูชัยชนะได"
 AUS_promote_admirals_tt: "ปลดล็อก§Yโยฮันเนสแหงลิกเตนสไตน§! (ทักษะ 3) และ§Yคารล ไฮนซ บีรนบาเคอร§! (ทักษะ 2) เปนพลเรือเอก"
 AUS_promote_admirals_fasc_com_tt: "ปลดล็อก§Yคารล ไฮนซ บีรนบาเคอร§! (ทักษะ 2) เปนพลเรือเอก"

 AUS_defending_the_coast: "ปองกันชายฝง"
 AUS_defending_the_coast_desc: "แมการฟนฟูกองทัพเรือเกาใหรุงโรจนดังเดิมจะดึงดูดใจเรา แตเราตองยอมรับความจริง การผลิตเรือหลักขนาดใหญไมไดอยูในแผนของเราในเร็ว ๆ นี้ อันที่จริง หากเราไมใชประโยชนจากที่มั่นชายฝงเล็ก ๆ นี้ในทันที เราก็มีแนวโนมจะเสียมันไปมากกวาที่จะชนะการรบทางทะเลไดอีก เรือใหญตองรอไปกอน ตอนนี้สิ่งที่เราตองการคือกองเรือที่สามารถปกปองชายฝงของเรา"
 AUS_defending_the_coast_bonus: "ปองกันชายฝง"

 AUS_elin: "ELIN"
 AUS_elin_desc: "แรงบันดาลใจอาจมาจากที่ที่แปลกที่สุด ELIN ผูผลิตที่เนนอิเล็กทรอนิกสเปนหลัก เพิ่งหันมาสรางเรือดํานํ้าทดลอง และเรือดํานํ้าเหลานั้นดีอยางนาประหลาดใจ เราควรพิจารณาติดตอพวกเขาใหสรางเรือดํานํ้าใหเราในอนาคต"

 AUS_light_ship_bonus: "ฝูงเรือปองกัน"
 AUS_light_ship_bonus_desc: "ชางตอเรือของเราใชเวลาไมนานในการคิดคนวิธีเรงการผลิตเรือขนาดเล็กและเรือดํานํ้า การกําหนดมาตรฐานวิธีเหลานี้จะทําใหเราสรางกองเรือขนาดใหญเพื่อรักษาความปลอดภัยแนวชายฝงได"

 AUS_coastal_defence_forts: "ตั้งกองรักษาการณชายฝง"
 AUS_coastal_defence_forts_desc: "สิ่งที่เราทําในทะเลเปนเพียงสวนหนึ่งที่กําหนดโอกาสสําเร็จของเรา อีกสวนหนึ่งคือแนวชายฝงและความแข็งแกรงของปอมปราการที่นั่น ทายที่สุดแลว ปอมชายฝงไมกี่แหงที่วางตําแหนงอยางดีก็สามารถขัดขวางแมแตการรุกรานที่วางแผนมาอยางรอบคอบที่สุด"

 AUS_naval_efficiency: "ประสิทธิภาพทางนาวีของ[ROOT.GetAdjective]"
 AUS_naval_efficiency_desc: "ดวยความทุมเทและการทํางานหนัก เราไดสรางกําลังทางนาวีขนาดใหญขึ้นใหมไดแมจะมีอุปสรรคมากมาย ความสําเร็จของเราไดปลุกใจทั้งลูกเรือและผูที่ทํางานในอูตอเรือ เราควรใชประโยชนจากสิ่งนี้เพื่อผลักดันครั้งสุดทายสูความเปนเลิศ!"


 ### BELGIAN FOCUS TREE ###


BEL_perpetual_neutrality: "ความเปนกลางถาวร"
BEL_perpetual_neutrality_desc: "เนื่องจากเราเปนสมรภูมิหลัก ประเทศของเราจึงกลายเปนซากปรักหักพังหลังสงครามโลกครั้งที่หนึ่ง สิ่งนี้ตองไมเกิดขึ้นซํ้าอีก ดังนั้นเราจะประกาศวา[BEL.GetNameDef]จะเปนรัฐเอกราชที่เปนกลางตลอดไป และจะรักษาความเปนกลางเชนเดียวกันตอรัฐอื่นทั้งปวง"

BEL_independent_neutral_and_loyal: "เอกราช เปนกลาง และจงรักภักดี"
BEL_independent_neutral_and_loyal_desc: "ในสงครามครั้งที่แลว เราพึ่งพาพันธมิตร และผลที่ตามมาคือประเทศของเรากลายเปนสมรภูมิ ดังนั้นเพื่อกันสงครามใหหางจาก[BEL.GetNameDef] ผูปกครองของเราจึงประกาศใหเรา "เปนเอกราช เปนกลาง และจงรักภักดี" \n \n สิ่งนี้จะรวมชนชั้นการเมืองใหเปนหนึ่งเดียวกันในความจําเปนที่ตองจัดการการปองกันของเราเอง และพัฒนากําลังทหารเพื่อการยับยั้งของเราเอง"

BEL_defensive_neutrality: "ความเปนกลางเชิงปองกัน"
BEL_defensive_neutrality_desc: "เมื่อเราประกาศจุดยืนความเปนกลางอยางชัดเจนแลว ก็ถึงเวลาที่จะเริ่มทํางานเพื่อบังคับใชมัน เราจะทําใหตัวเองยากเกินกวาจะพิชิตได จนการรุกรานไมคุมคา"

BEL_national_redoubt_at_antwerp: "ที่มั่นสุดทายแหงชาติที่แอนตเวิรป"
BEL_national_redoubt_at_antwerp_available_tt: "ตองเปนจริงอยางใดอยางหนึ่งตอไปนี้:\n สามารถสราง§Y$bunker$§! 1 แหงในเมืองบรัสเซลส\n สามารถสราง§Y$bunker$§! 2 แหงในเมืองแอนตเวิรป"
BEL_national_redoubt_at_antwerp_bypass_tt: "ตองเปนจริงทั้งหมดตอไปนี้:\n ไมสามารถสราง§Y$bunker$§! 1 แหงในเมืองบรัสเซลส\n ไมสามารถสราง§Y$bunker$§! 2 แหงในเมืองแอนตเวิรป"
BEL_national_redoubt_at_antwerp_desc: "แอนตเวิรปเปนศิลาหลักทางประวัติศาสตรของการปองกันประเทศเรามาโดยตลอด เราจะยกระดับปอมปราการที่นั่น และใชเปนจุดศูนยกลางในการเสริมกําลังสวนอื่นของประเทศ"

BEL_belgian_gates: "ประตูเบลเยียม"
BEL_belgian_gates_desc: "หรือที่รูจักกันในชื่อ Cointet-elements สิ่งกอสรางเหล็กขนาดใหญเหลานี้ไดรับการออกแบบมาเพื่อสกัดกั้นไมใหรถถังผานไปไดโดยเฉพาะ"

BEL_fortify_liege: "สรางปอมปราการที่ลีแย็ฌ"
BEL_fortify_liege_available_tt: "อยางนอยหนึ่งจังหวัดใน§Y[34.GetName]§!ที่ติดกับแมนํ้าเมิซ มีพื้นที่สราง§Y$bunker$§! 1 ระดับ"
BEL_fortify_liege_bypass_tt: "ไมมีจังหวัดใดใน§Y[34.GetName]§!ที่ติดกับแมนํ้าเมิซ มีพื้นที่สราง§Y$bunker$§! 1 ระดับ"
BEL_fortify_liege_tt: "สราง§Y$bunker$§!ระดับ 1 ใน§Y[34.GetName]§!ตามแนวแมนํ้าเมิซในจังหวัดที่มีพื้นที่เพียงพอ"
BEL_fortify_liege_desc: "ในสงครามโลกครั้งที่หนึ่ง ที่มั่นปอมปราการแหงลีแย็ฌมีบทบาทสําคัญในการถวงกองกําลังเยอรมัน ทําใหการปองกันประสบความสําเร็จ ถึงกระนั้น ก็เผยใหเห็นขอบกพรองรายแรงในการออกแบบปอม เราไดเรียนรูบทเรียนแลว และถึงเวลาที่จะยกระดับปอมปราการอีกครั้ง"

BEL_iron_wall: "กําแพงเหล็ก"
BEL_iron_wall_desc: "ประตูเบลเยียมของเราพิสูจนแลวในการทดสอบวาเปนอุปสรรคสําคัญตอการดําเนินกลยุทธของศัตรู ดังนั้นเราควรติดตั้งพวกมันจํานวนมากทั่วประเทศเพื่อหยุดยั้งผูที่จะรุกรานเรา"

BEL_eben_emael_fortress: "ปอมเอเบิน-เอมาเอล"
BEL_eben_emael_fortress_available_tt: "สามารถสราง§Y$bunker$§!อยางนอย 2 แหงใน§Yลีแย็ฌ§!"
BEL_eben_emael_fortress_bypass_tt: "ไมสามารถสราง§Y$bunker$§!อยางนอย 2 แหงใน§Yลีแย็ฌ§!"
BEL_eben_emael_fortress_desc: "ปอมปราการที่ใหญและยิ่งใหญที่สุดในแนวของเรา ตั้งอยูบนจุดสูงที่มองลงไปยังคลองอัลแบร เอเบิน-เอมาเอลจะเปนฐานตั้งรับและใหการสนับสนุนปนใหญแกกองกําลังโดยรอบ และจะเปนอุปสรรคที่ไมอาจตีแตกสําหรับผูที่บังอาจละเมิดพรมแดนของเรา"

BEL_our_southern_neighbour: "เพื่อนบานทางใตของเรา"
BEL_our_southern_neighbour_desc: "จากประสบการณในสงครามครั้งที่แลว การปองกันสวนใหญของเรามุงไปที่เพื่อนบานทางตะวันออก แตพวกเขาไมใชมหาอํานาจเพียงรายเดียวที่มีพรมแดนติดกับเรา เราควรสรางปอมปราการทางใตใหแข็งแกรงในระดับเดียวกัน"

BEL_koningshooikt_wavre_line: "แนวโกนิงสโฮยคท-วาฟร"
BEL_koningshooikt_wavre_line_desc: "แนวโกนิงสโฮยคท–วาฟร หรือเรียกสั้น ๆ วาแนว KW เปนแนวปองกันที่สองระหวางโกนิงสโฮยคทและวาฟร ที่มั่นเหลานี้เตรียมไวสําหรับใหกองกําลังของเราและพันธมิตรเขาประจําการโดยเฉพาะแทนที่จะเปนกองรักษาการณ ประกอบดวยสนามเพลาะ บังเกอรปนกล และประตูเบลเยียม นี่เปนแนวปองกันที่แข็งแกรงมากและควรเปนจุดตานทานหลักของเรา"

BEL_mobilize_the_nation: "ระดมพลทั้งชาติ"
BEL_mobilize_the_nation_desc: "ปอมปราการไมใชสิ่งเดียวที่เราควรเตรียม ประชาชนเองก็สามารถเปนทรัพยสินที่ยิ่งใหญที่สุดของเรา ในสงครามครั้งที่แลวพวกเขาตอสูกับผูรุกรานอยางกลาหาญ ใหเราใชความมุงมั่นเดียวกันนั้นและรวบรวมประชาชนเพื่อการปองกัน"

BEL_flooded_tank_barriers: "เครื่องกีดขวางรถถังใตนํ้า"
BEL_flooded_tank_barriers_desc: "เราเชื่อวารถถังจะมีบทบาทสําคัญยิ่งในสงครามอนาคต และการปองกันของเราควรสะทอนสิ่งนี้ เราสามารถเตรียมประตูเบลเยียมและจมไวในนํ้าเพื่อเพิ่มประสิทธิผลเปนสองเทา"

BEL_protect_against_france: "ปองกันฝรั่งเศส"
BEL_protect_against_france_desc: "การเตรียมการทางใตกอนหนานี้เปนเพียงการเตรียมรับมือการโอบลอม แตความจริงคืออาจมีการรุกรานเต็มรูปแบบจากฝรั่งเศส และเราควรเตรียมปอมและปอมปราการใหสอดคลองกัน!"
BEL_protect_against_france_available_tt: "สามารถสราง§Yปอมภาคพื้นดิน 1 แหง§!ใน§Yชารเลอรัว§!, §Yคอรไตรค§! หรือ§Yจังหวัดชายฝงทางตะวันตกเฉียงเหนือของคอรไตรค§!"

BEL_dam_the_consequences: "เขื่อนกั้นผลที่ตามมา"
BEL_dam_the_consequences_desc: "เขื่อนชีแลปขนาดมหึมาจายนํ้าและไฟฟาใหภูมิภาคตะวันออกของเรา และยังเปนโอกาสอันดีเยี่ยมในการปลอยนํ้าทวมพื้นที่นั้นหากเราเกรงวาศัตรูอาจเจาะแนวได"

BEL_defensive_reorganization: "การจัดระเบียบการปองกันใหม"
BEL_defensive_reorganization_desc: "เราไดทําทุกอยางที่ทําไดเพื่อเตรียมรับการรุกรานแลว สิ่งเดียวที่เหลือคือการหาความเปลี่ยนแปลงเชิงหลักนิยมระดับยุทธศาสตรและระดับสูงตามแนวคิดการปองกันที่ทันสมัยที่สุด"

BEL_defense_bill: "รางกฎหมายกลาโหม"
BEL_defense_bill_desc: "การประกาศความเปนกลางถาวรของเราไมไดรับการตอบรับดีนักในเวทีระหวางประเทศ แตความจริงคือสิ่งนี้จําเปนตองทําเพื่อรวมแรงสนับสนุนทางการเมืองไปสูโครงการติดอาวุธใหมครั้งใหญ"

BEL_royal_military_academy: "โรงเรียนนายรอยหลวง"
BEL_royal_military_academy_desc: "โรงเรียนนายรอยหลวงเปนสถาบันการศึกษาทางทหารแหงเดียวของ[ROOT.GetNameDef] แตเมื่อสถานการณโลกไมแนนอนมากขึ้น เราตองเตรียมนายทหารแหงอนาคตดวยทฤษฎีการทหารที่ดีที่สุด และนั่นจําเปนตองขยายโรงเรียนนายรอย"

BEL_multi_language_courses: "หลักสูตรหลายภาษา"
BEL_multi_language_courses_desc: "ปญหาใหญประการหนึ่งที่กองทัพของเราเผชิญคือการที่ประชากรใชสองภาษา มาเปลี่ยนสิ่งนี้ใหเปนความไดเปรียบกันเถอะ! เราสามารถสอนนายทหารทั้งภาษาฝรั่งเศสและดัตช และใชประโยชนจากคณะนายทหารที่พูดไดสองภาษา"

BEL_department_of_telecommunications: "ภาควิชาโทรคมนาคม"
BEL_department_of_telecommunications_desc: "การสื่อสารสําคัญยิ่งสําหรับกองทัพ ดังนั้นเราตองมุงการศึกษาไปสูการใชเทคโนโลยีใหมอยางวิทยุ ควบคูไปกับวิธีเกาที่พิสูจนแลว เชน นกพิราบสื่อสาร"

BEL_department_of_ballistic_metrology: "ภาควิชามาตรวิทยาขีปนวิถี"
BEL_department_of_ballistic_metrology_desc: "ภาควิชามาตรวิทยาขีปนวิถีเชี่ยวชาญดานการวัดและขีปนวิทยา ทําใหคํานวณวิถีกระสุนไดอยางแมนยํา"

BEL_resist_and_bite: "ตานทานและขยํ้า"
BEL_resist_and_bite_desc: "Chasseurs Ardennais เปนหนวยรบชั้นยอดของกองกําลัง[ROOT.GetAdjective] ประกอบดวยผูที่อาศัยอยูในจังหวัดลักเซมเบิรกเปนหลัก ซึ่งคุนเคยกับปาทึบของภูมิภาคนั้น คําขวัญของพวกเขาคือ "ตานทานและขยํ้า!""

BEL_center_for_advanced_military_studies: "ศูนยการศึกษาการทหารขั้นสูง"
BEL_center_for_advanced_military_studies_desc: "เมื่อกองทัพใหญขึ้น ความตองการดานการบังคับบัญชาก็ยิ่งเขมงวดขึ้น เราตองกาวนําหนาอยูเสมอ และฝกกองบัญชาการระดับสูงดวยหลักยุทธศาสตรลาสุด พรอมพัฒนาความถนัดในดานตาง ๆ เชน การสงกําลังบํารุง การบังคับบัญชาและการควบคุม และการบูรณาการเหลาทัพผสม โดยอาจคํานึงถึงกองกําลังพันธมิตรดวย"

BEL_anti_tank_guns: "ปนตอสูรถถังชั้นเยี่ยม"
BEL_anti_tank_guns_desc: "คุณภาพอันยอดเยี่ยมของโลหะวิทยา[ROOT.GetAdjective]ทําใหชางกลของเราสรางปนชั้นเลิศได และเราควรใชความสามารถนี้สรางอสูรกายความเร็วสูงตัวจริง! เรายังไปไดอีกขั้น ดวยการติดตั้งปนเหลานี้ในรถถังทุกคันที่เรามี"

BEL_junior_officer_training: "การฝกนายทหารชั้นผูนอย"
BEL_junior_officer_training_desc: "นายทหารที่พอใชไดจะปลุกใจทหารใหสูตอแมเสียเปรียบ แตอาจมองไมเห็นสถานการณที่สิ้นหวัง ผูนําที่ดีจะมองออกอยางถูกตองวาสถานการณเลวราย แตจะทําใหดีที่สุดเทาที่ทําได ผูนําที่ยอดเยี่ยมจะมีแผนพรอมถอนตัวจากสถานการณนั้นและโจมตีอีกครั้งจากตําแหนงที่ดีกวา เราจะคัดเลือกและฝกนายทหารใหเปนผูที่ดีที่สุดเทาที่จะเปนได"

BEL_belgian_special_forces: "หนวยรบพิเศษ[ROOT.GetAdjective]"
BEL_belgian_special_forces_desc: "ทหาร[ROOT.GetAdjective]มีความทรหดและทุมเทมาโดยตลอด แตเราตองลองนึกดูวาพวกเขาจะทําอะไรไดบางหากไดรับการนําโดยผูที่มีความสามารถอยางเอ็ดดี บลงเดล แลวเราจะคาดเดาไดวากองกําลังเหลานี้จะพิเศษเพียงใด"

BEL_senior_officer_training: "การฝกนายทหารชั้นผูใหญ"
BEL_senior_officer_training_desc: "กลาวกันวานายทหารมีคุณลักษณะสองในสี่ประการนี้: ความเกียจคราน ความโงเขลา ความขยัน และความฉลาด นายทหารฝายเสนาธิการควรขยันและฉลาด นายทหารชั้นผูใหญควรเกียจครานและฉลาด แมแตคนโงและเกียจครานก็ยังมีประโยชน เหนือสิ่งอื่นใด เราตองคัดแยกคนโงที่ขยันออกมา เพราะพวกเขาคือผูตัดสินใจที่นําไปสูหายนะ และยังมีทั้งความตั้งใจและพลังที่จะทํามันใหสําเร็จ"

BEL_fonderie_royale_de_canons_liege: "โรงหลอปนใหญหลวงแหงลีแย็ฌ"
BEL_fonderie_royale_de_canons_liege_desc: "โรงหลอปนใหญหลวงแหงลีแย็ฌกอตั้งโดยนโปเลียน โบนาปารต ในป 1803 สมัยที่ลีแย็ฌยังเปนสวนหนึ่งของฝรั่งเศส และเปนผูพัฒนาอาวุธหนักหลักในเบลเยียม ดวยประโยชนอยางมากจากคุณภาพงานโลหะในภูมิภาค อาวุธลํากลองใหญของที่นี่จึงมีชื่อเสียงอยูบาง และสิ่งอํานวยความสะดวกเหลานี้ก็รอการลงทุนเพิ่มเติมเพื่อขยายขีดความสามารถของเราใหมากขึ้น"

BEL_interpreters: "ลาม"
BEL_interpreters_desc: "อุปสรรคใหญประการหนึ่งที่กองทัพของเราตองเอาชนะ คือความจําเปนที่คณะนายทหารตองพูดไดสองภาษาเพื่อบังคับบัญชาทหารเฟลมิชและวัลลูน บัดนี้มันกลายเปนจุดแข็งที่ยิ่งใหญที่สุดประการหนึ่ง เพราะเราสามารถปฏิบัติการในดินแดนเพื่อนบานไดแทบจะอยางอิสระโดยไมมีอุปสรรคดานภาษา"
BEL_interpreters_tt: "§Yจิตวิญญาณแหงชาติ§!นี้จะถูกเพิ่มใหทั้งสมาชิกฝายปจจุบันและสมาชิกฝายในอนาคต"

BEL_center_of_nuclear_chemistry: "ศูนยเคมีนิวเคลียร"
BEL_center_of_nuclear_chemistry_desc: "เราติดตามทฤษฎีของออปเพนไฮเมอร ไฮเซนแบรก และโปรอยางใกลชิด และตัดสินใจวาเราควรพิจารณานําวิทยาศาสตรนี้มาประยุกตใชเอง อยางไรเสีย เราก็เปนหนึ่งในไมกี่ชาติที่เขาถึงยูเรเนียมจากคองโกไดโดยงาย"

BEL_strategic_doctrine_development: "พัฒนาหลักนิยมทางยุทธศาสตร"
BEL_strategic_doctrine_development_desc: "การคิดทีละการรบนั้นไมเพียงพอ เราตองเขาใจระดับยุทธศาสตรอยางถองแท และจัดกองทัพตามหลักนิยมเฉพาะ เพื่อใหกองกําลังทั้งหมดมุงไปสูเปาหมายเดียวกัน นั่นคือชัยชนะ"

BEL_belgian_tank_development: "การพัฒนารถถัง[ROOT.GetAdjective]"
BEL_belgian_tank_development_desc: "แมจะมีอุตสาหกรรมยานยนตที่แข็งแกรง แตเราไมเคยสนใจการพัฒนาสงครามยานเกราะเปนพิเศษ เมื่อพิจารณาความกาวหนาทางการทหารลาสุดแลว ชัดเจนวาถึงเวลาที่เราตองลงทุนในโครงการพัฒนารถถังของเราเอง"

BEL_doctrinal_innovations: "นวัตกรรมเชิงหลักนิยม"
BEL_doctrinal_innovations_desc: "หลักนิยมชวยชี้ทางใหกองทัพและทําใหทุกคนเดินไปในจังหวะเดียวกัน แตบางครั้งการจะกาวนําหนาจริง ๆ ตองคิดนอกกรอบ เราตองการไปไกลกวานั้น ทุบกรอบทิ้ง แหกแบบแผน และทําในแบบของเราเอง ศัตรูของเราจะไมมีวันคาดถึง"

BEL_modernized_army: "กองทัพสมัยใหม"
BEL_modernized_army_desc: "บอยครั้งที่ความแตกตางระหวางผูชนะและผูแพในสงคราม คือใครเรียนรูบทเรียนจากประสบการณไดดีที่สุด ถึงเวลาที่เราจะทบทวนทุกสิ่งที่เราไดและเสียไป แลวปฏิรูปกองทัพใหไดมาตรฐานใหมที่ทันสมัย"

BEL_increased_length_of_service: "ขยายระยะเวลารับราชการ"
BEL_increased_length_of_service_desc: "เมื่อความตึงเครียดทั่วโลกเพิ่มสูงขึ้น และดวยตําแหนงทางยุทธศาสตรของเราที่อยูระหวางยักษใหญทางทหาร เราตองแสดงความพรอมที่จะปกปองตนเองและรักษาอธิปไตยเหนือดินแดน ดังนั้นเราจะยกระดับการเตรียมพรอมของกําลังสํารอง และขยายระยะเวลารับราชการของผูที่ประจําการอยูในปจจุบัน"

BEL_fn_herstal: "FN Herstal"
BEL_fn_herstal_desc: "[ROOT.GetNameDefCap]โชคดีที่มีอุตสาหกรรมอาวุธที่มีชื่อเสียงระดับโลก โดย Fabrique Nationale de Herstal หรือ FN Herstal โดดเดนที่สุด ผูผลิตอาวุธรายนี้ผลิตอาวุธคุณภาพยอดเยี่ยมที่ออกแบบโดยผูเชี่ยวชาญชั้นนําของวงการ ความรวมมืออยางใกลชิดกับ Browning Arms Company ยิ่งตอกยํ้าการเขาถึงระดับโลกอยางแทจริงของบริษัทเรา"

BEL_legacy_of_the_great_war: "มรดกแหงมหาสงคราม"
BEL_legacy_of_the_great_war_desc: "เราเดินทางมาไกลนับจากความสยดสยองของสงคราม "ครั้งใหญ" และแมบาดแผลของเราจะยังไมหายสนิท เราก็แบกรับรอยแผลเปนดวยความภาคภูมิใจ เราเคยตานทานผูรุกรานมาแลวครั้งหนึ่ง เราทําได ไมสิ เราจะตานทานพวกมันอีกครั้ง"

BEL_poudreries_reunies_de_belgique: "Poudreries Réunies de Belgique"
BEL_poudreries_reunies_de_belgique_desc: "Poudreries บริษัทอาวุธที่เกาแกเปนอันดับสองในเบลเยียม เชี่ยวชาญดานกระสุน ดังนั้นการปรับบทบาทของพวกเขาในเครือขายการสงกําลังบํารุงใหคลองตัวจะใหผลลัพธที่ระเบิดระเบอจริง ๆ"

BEL_minerva_imperia: "Minerva-Imperia"
BEL_minerva_imperia_desc: "เบลเยียมไมเพียงเปนผูนําในการใชรถหุมเกราะในสงครามโลกครั้งที่หนึ่ง แตยังครองตําแหนงสําคัญในอุตสาหกรรมยานยนตตลอดชวงระหวางสงคราม ผูผลิตรายใหญที่สุดสองรายของเรา Minerva และ Imperia เพิ่งควบรวมกิจการ และจะเปนเรื่องนาเสียดายอยางยิ่งหากเราไมใชประโยชนจากตําแหนงแถวหนาของพวกเขาเพื่อผลประโยชนรวมกัน"

BEL_repudiate_treaty_with_france: "บอกเลิกสนธิสัญญากับฝรั่งเศส"
BEL_repudiate_treaty_with_france_desc: "การที่[FRA.GetNameDefCap]ปฏิเสธที่จะขยายแนวมายิโนตมาตามพรมแดนของเรา โดยสาระแลวเทากับเปดประตูกวางใหศัตรูตองบุกผาน การบอกเลิกสนธิสัญญากับพวกเขาจะทําใหเราพนจากพันธะทางทหารที่ตองชวยเหลือพวกเขา แตพวกเขาก็ยังจําเปนตองเขาแทรกแซงหากเราถูกโจมตี มิฉะนั้นก็เสี่ยงที่ศัตรูจะบุกตอเขาไปในดินแดนที่ไมมีการปองกันของพวกเขา"

BEL_german_non_aggression: "ไมรุกรานกับเยอรมนี"
BEL_german_non_aggression_desc: "[GER.GetName]ชื่นชมการประกาศความเปนกลางของเรา และแสดงความสนใจตอสาธารณะที่จะทําสนธิสัญญาไมรุกรานรวมกันเพื่อเสริมจุดยืนนี้ และรักษาความมั่นคงของพรมแดนพวกเขา"

BEL_dyle_plan: "แผนดิล"
BEL_dyle_plan_desc: "แมเราจะประกาศตอสาธารณะถึงความเปนกลางและการไมแทรกแซงทางทหาร แตเบื้องหลังเรายังคงทํางานรวมกับหุนสวนทางยุทธศาสตร และวางแผนรวมถึงแผนสํารองในกรณีที่ถูกรุกราน แนวคิดหลักคือเราจะยึดแนวแมนํ้าดิลไวใหนานที่สุดจนกวากองกําลังสํารวจจะมาเสริมการปองกันของเรา"
BEL_dyle_plan_tt: "ในกรณีที่สงครามปะทุขึ้น §Y[ENG.GetNameWithFlag]§! และ§Y[FRA.GetNameWithFlag]§! จะมีแนวโนมมาชวยเหลือเรามากขึ้น!"

BEL_british_guarantee: "การรับประกันจากอังกฤษ"
BEL_british_guarantee_desc: "ความสัมพันธอันดีของเรากับ[ENG.GetNameDef]ไมเคยเปนความลับ ดังนั้นมาทําใหความสัมพันธนี้เปนทางการ และใหการรับประกันทางทหารตอกัน"

BEL_government_resigns: "รัฐบาลลาออก"
BEL_government_resigns_desc: "แรงกดดันตอรัฐบาลเพิ่มขึ้นเรื่อย ๆ จากขอกลาวหาเรื่องการทุจริตที่แพรหลายโดยองคกรเร็กซิสตฝายฟาสซิสต นําไปสูการลมสลายของรัฐบาล และการเริ่มเตรียมการเลือกตั้งครั้งใหม"
BEL_auto_complete_government_resigns_tt: "แผนยุทธศาสตรนี้จะสําเร็จโดยอัตโนมัติตามผลของเหตุการณ§Yรัฐบาลลาออก§!"

BEL_government_of_national_unity: "รัฐบาลเอกภาพแหงชาติ"
BEL_government_of_national_unity_desc: "แมจะมีการตอตานที่เพิ่มขึ้นจากขบวนการฟาสซิสต แตพรรคเสรีนิยม สังคมนิยม และคาทอลิกฝายประชาธิปไตยก็รวมตัวกันภายใตปอล ฟาน เซลันดอีกครั้ง และจัดตั้งรัฐบาลเอกภาพแหงชาติชุดใหม"

BEL_investigate_bribery_charges: "สอบสวนขอกลาวหาการรับสินบน"
BEL_investigate_bribery_charges_desc: "ขอกลาวหาเรื่องการทุจริตไมเคยหายไปจากรัฐบาล และเสียงเรียกรองใหสอบสวนก็ดังขึ้นเรื่อย ๆ เลอง เดอเกรล ผูนําเร็กซิสตฝายฟาสซิสต ถึงกับพาดพิงปอล ฟาน เซลันดโดยตรง กลาวหาวาเขารับสินบน"

BEL_royal_intervention: "การแทรกแซงของพระมหากษัตริย"
BEL_royal_intervention_desc: "รัฐบาลลมสลายอีกครั้ง และถึงเวลาที่พระมหากษัตริยจะตองทรงเขามาดําเนินการ มีผูทาชิงตําแหนงนายกรัฐมนตรีสองคน คือปอล-เอมีล ฌองซง ผูมั่นคง หรือเลอง เดอเกรล ผูนําการรองเรียนตอการทุจริตของรัฐบาลชุดกอน"
BEL_auto_complete_royal_intervention_tt: "แผนยุทธศาสตรนี้จะสําเร็จโดยอัตโนมัติตามผลของเหตุการณ§Yการแตงตั้งโดยพระราชโองการ§!"

BEL_paul_emile_janson: "ปอล-เอมีล ฌองซง"
BEL_paul_emile_janson_desc: "ปอล-เอมีล ฌองซง ตัวเลือกฝายเสรีนิยมสําหรับตําแหนงนายกรัฐมนตรี ไดรับเลือกจากพระมหากษัตริยใหเปนผูมั่นคงที่จะนํารัฐบาลกลับสูเสถียรภาพในยามที่ความไมมั่นคงเพิ่มขึ้นเรื่อย ๆ"

BEL_plan_de_man: "แผนเดอ มัน"
BEL_plan_de_man_desc: "แมจะตองแลกดวยตนทุนทางการเมืองมหาศาล แตนายกรัฐมนตรีก็ทํางานอยางหนักเพื่อสานตอการปฏิรูปของอ็องรี เดอ มัน และดําเนินมาตรการแกปญหาการวางงานเพิ่มเติม โดยมุงลดอัตราการวางงานจากจุดสูงสุด 23.5% ในป 1932 ลงมาเหลือ 15%"

BEL_economic_recovery: "การฟนตัวทางเศรษฐกิจ"
BEL_economic_recovery_desc: "ผลงานของรัฐบาลเรา แมตองเผชิญอุปสรรคมากมาย ไดนําไปสูการเติบโตและการฟนตัวอยางรวดเร็วของเศรษฐกิจ แตถึงกระนั้นก็เริ่มมีเสียงบนแลววาแคนี้ยังไมเพียงพอ"

BEL_adriaan_martens_crisis: "วิกฤตอาเดรียน มารเตินส"
BEL_adriaan_martens_crisis_desc: "สิ่งที่ดูเหมือนเปนเพียงการแตงตั้งธรรมดา คือการแตงตั้งอาเดรียน มารเตินสเขาสูราชบัณฑิตยสถานการแพทย ไดบานปลายกลายเปนวิกฤตการเมืองเต็มรูปแบบ เพราะปรากฏวามารเตินสเคยเปนผูรวมมือกับศัตรูในสงครามครั้งที่แลว และแสดงทัศนะฟาสซิสตอยางเปดเผย เรื่องนี้อาจนําไปสูการลมสลายของรัฐบาลสปาก"

BEL_benelux_union: "สหภาพเบเนลักซ"
BEL_benelux_union_desc: "นายกรัฐมนตรีสปากไดเสนอใหรวมชาติเบเนลักซ ไดแก[BEL.GetNameDef], [HOL.GetNameDef] และ[LUX.GetNameDef] เขาเปนสหภาพศุลกากรเดียว โดยมีเปาหมายสูงสุดคือการรวมเปนรัฐสหภาพใหญหนึ่งเดียวอยางสมบูรณ นี่อาจเปนพิมพเขียวสูสหภาพยุโรปในอนาคตดวยซํ้า"
BEL_benelux_union_tt: "หากเปนประชาธิปไตยหรือไมฝกใฝฝายใด §Y[HOL.GetNameWithFlag]§! และ§Y[LUX.GetNameWithFlag]§! จะไดรับเชิญเขารวม§Y$BEL_benelux_union_faction$§!"

BEL_tripartite_government: "รัฐบาลไตรภาคี"
BEL_tripartite_government_desc: "เชนเดียวกับรัฐบาลเอกภาพแหงชาติชุดกอน ๆ นายกรัฐมนตรีปแยรโลสามารถรวมพรรคฝายประชาธิปไตยหลายพรรคเขาดวยกัน แสดงถึงความเปนนํ้าหนึ่งใจเดียวของชาวเบลเยียม ดวยแนวรวมทางการเมืองที่เปนเอกภาพนี้ ในที่สุดเขาก็มีอํานาจพอจะผลักดันกฎหมายที่กาวหนายิ่งขึ้น"

BEL_the_council_of_europe: "สภายุโรป"
BEL_the_council_of_europe_desc: "ยิ่งชัดเจนขึ้นเรื่อย ๆ วาความเปนกลางไมอาจปกปองเราจากการขยายอํานาจทางทหารของเพื่อนบานที่กาวราวได ดังนั้นหนทางเดียวที่จะประกันสันติภาพในยุโรปคือความเปนเอกภาพ เราควรนํานักการทูตและประมุขแหงรัฐมารวมโตะเดียวกัน และกอตั้งสภายุโรปขึ้น"
BEL_the_council_of_europe_tt: "ปลดล็อกการตัดสินใจ§Yเชิญประเทศอื่นเขารวม $BEL_european_union$§!"

BEL_broken_neutrality: "ความเปนกลางที่สิ้นสุดลง"
BEL_broken_neutrality_desc: "การประกาศความเปนกลางไดรับใชประเทศของเราเปนอยางดี และทําใหเราเติบโตจนมีความแข็งแกรง บัดนี้เราสามารถสลัดพันธนาการเหลานี้ทิ้ง และนํา[BEL.GetNameDef]เขาสูยุคใหม"

BEL_degrelle: "เดอเกรล"
BEL_degrelle_desc: "เลอง เดอเกรล ผูนําพรรคเร็กซและหนึ่งในนักฟาสซิสตแถวหนาของ[BEL.GetName] ไดปลุกปนตอตานผูนําปจจุบันมาระยะหนึ่ง และประสบความสําเร็จในการเปดโปงการทุจริตของพวกเขาตอสาธารณชน หลังรัฐบาลฟาน เซลันดลมสลาย พระมหากษัตริยทรงเขามาแทรกแซงและแตงตั้งเดอเกรลเปนนายกรัฐมนตรีคนใหม"

BEL_support_the_rexists: "สนับสนุนพวกเร็กซิสต"
BEL_support_the_rexists_desc: "บัดนี้เมื่อเดอเกรลไดขึ้นเปนนายกรัฐมนตรีแลว ก็ถึงเวลาที่พรรคซึ่งสนับสนุนใหเขาขึ้นสูตําแหนงนี้จะไดรับการตอบแทน และสมาชิกอาวุโสจะไดรับการเลื่อนขึ้นสูตําแหนงในคณะรัฐมนตรี"

BEL_dissolve_political_parties: "ยุบพรรคการเมือง"
BEL_dissolve_political_parties_desc: "ความออนแอของประชาธิปไตยประจักษชัดแลววามันไมใชอะไรมากไปกวาแหลงเพาะพันธุการทุจริตและความโลภ ประชาชนไมตองการทางเลือก พวกเขาตองการการนํา และมีเพียง[ROOT.GetRulingPartyLong]เทานั้นที่ทําสิ่งนี้ได"

BEL_the_flemish_question: "ปญหาเฟลมิช"
BEL_the_flemish_question_desc: "ความแตกแยกที่ดําเนินอยูภายใน[BEL.GetName]ยังคงสรางรอยราวระหวางประชาชนของเรา เราควรยุติปญหานี้ใหจบสิ้น และตัดสินใจเองวามาตรฐานทางภาษาที่ถูกตองควรเปนอยางไร ประชาชนจะทําตามที่ไดรับคําสั่ง อยางไรเสียเราทุกคนก็เปนชาว[BEL.GetAdjective] และสิ่งนี้อยูเหนือขอขัดแยงเล็กนอยอยางเรื่องภาษา"

BEL_christian_corporatism: "บรรษัทนิยมแบบคริสเตียน"
BEL_christian_corporatism_desc: "เราศึกษาบรรษัทนิยมแบบอิตาลีดวยความสนใจ ซึ่งเปนแนวคิดเรื่ององคกรแรงงานแบบรวมหมูที่รัฐเปนผูนํา โดยทั้งหมดมุงสูเปาหมายทางเศรษฐกิจเดียวกัน เราตั้งใจจะเดินตามแบบจําลองนั้น แตนําจริยธรรมและอุดมคติแบบคริสเตียนมาใชเพื่อสรางสิ่งที่เปนแบบเบลเยียมโดยเฉพาะ"

BEL_legacy_of_the_soldier_king: "มรดกแหงกษัตริยทหาร"
BEL_legacy_of_the_soldier_king_desc: "พระเจาอัลแบร กษัตริยทหาร วีรบุรุษสงคราม และผูกอบกูเบลเยียม มีสิ่งมากมายที่เราเรียนรูไดจากบุรุษผูยิ่งใหญพระองคนี้ และแบบอยางของพระองคคือสิ่งที่ทุกคนในกองทัพ ไมสิ ทุกคนในประเทศสามารถเรียนรูได เราจะตานทานและตอสูกับผูรุกรานทุกรายจนถึงที่สุด"

BEL_the_lost_tribe: "ชนเผาที่สาบสูญ"
BEL_the_lost_tribe_desc: "มลทินที่[BEL.GetName]ตองแบกรับคือการถูกเหมารวมกับชนชาติกอลที่ถูกพิชิตและตกเปนทาส เราคือชนเผาเจอรแมนิกที่สาบสูญของเราเอง เราคือผูที่ตานทาน เราคือผูที่ตอสู เราคือผูพิชิต"

BEL_invite_german_tank_organization: "เชิญนักพัฒนารถถัง[GER.GetAdjective]"
BEL_invite_german_tank_organization_desc: "เมื่อผูติดตอดานยานเกราะเดิมของเราสวนใหญปดประตูใสเราแลว เราจําเปนตองหาหุนสวนใหมเพื่อรวมมือกันนํารถถังมาสูประชาชน"

BEL_the_walloon_legion: "กองทหารวัลลูน"
BEL_the_walloon_legion_desc: "เมื่อเชื้อสายที่แทจริงของเราไดรับการยืนยันและกระจางชัดแลว ถึงเวลาที่เราจะยึดถือขนบอันรุงโรจนนี้ และแสดงใหโลกเห็นวาเราทําอะไรไดจริง ๆ"

BEL_the_new_ruhr: "รูรแหงใหม"
BEL_the_new_ruhr_desc: "ภูมิภาครูรในเยอรมนีมีชื่อเสียงดานผลผลิตอุตสาหกรรมมหาศาล จนเปนที่อิจฉาของมหาอํานาจอื่น ๆ เบลเยียมเองก็มีความยิ่งใหญทางอุตสาหกรรม และมีศักยภาพที่จะแซงหนาเพื่อนบานไปไดไกล เรามีโอกาส เรามีทรัพยากร เรามีแรงขับเคลื่อน และที่สําคัญที่สุด เรามีประชาชน"

BEL_traditional_family_values: "คานิยมครอบครัวแบบดั้งเดิม"
BEL_traditional_family_values_desc: "ศาสนจักรคาทอลิกไดชี้นําเราอยางดีมาโดยตลอดในเรื่องจริยธรรมครอบครัวที่ถูกตอง และเราควรยึดมั่นในคําสอนเหลานี้ตอไป นี่เปนหนทางเดียวที่จะประกันเสถียรภาพและการเติบโตที่จําเปนตอการขยายตัวและความรุงเรืองในอนาคต"

BEL_the_french_horse_and_the_red_rider: "มาฝรั่งเศสกับอัศวินแดง"
BEL_the_french_horse_and_the_red_rider_desc: "เบลเยียมถูกเหยียบยํ่าอยูใตกีบเทาของฝรั่งเศสมานานเกินไป อสูรกายที่ถูกบังคับโดยผูขี่ฝายคอมมิวนิสต เราตองลุกขึ้นยืนหยัดตอตานการรุกรานอันแยบยลนี้ ดวยการแสดงความมั่นใจและความแข็งแกรงเทานั้น ที่สัตวรายตัวนี้จะถอยหนีและหวาดกลัว"

BEL_nationalize_the_banks: "โอนธนาคารเปนของรัฐ"
BEL_nationalize_the_banks_desc: "ธนาคารถูกบริหารโดยคนเล็ก ๆ ที่ละโมบซึ่งสนใจแตผลกําไรมานานเกินไป ธนาคารเปนสถาบันที่รับใชทุกคน ดังนั้นจึงยุติธรรมแลวที่เราจะยึดอํานาจควบคุม และชี้นําเครื่องมือทางการเงินอยางเหมาะสมเพื่อประโยชนรวมกันของเรา"

BEL_abandon_neutrality: "ละทิ้งความเปนกลาง"
BEL_abandon_neutrality_desc: "เสียงเรียกรองความเปนกลางคือถอยคําของผูออนแอ ในโลกนี้ การทูตเพียงอยางเดียวที่มีความหมายคือการแสดงออกดวยความแข็งแกรง"

BEL_international_stipend: "เงินอุดหนุนระหวางประเทศ"
BEL_international_stipend_desc: "ชาติฟาสซิสตดวยกันไดเสนอเงินอุดหนุนใหเรา เพื่อซื้อความเปนกลางของเราในกิจการของพวกเขาตอไป หากนี่คือราคาของการไมแทรกแซง ก็เปนราคาที่เรายอมรับได อยางไรเสีย พวกเขาก็ดูเหมือนจะลืมระบุวันสิ้นสุดไว"

BEL_civil_service_purge: "กวาดลางขาราชการ"
BEL_civil_service_purge_desc: "มลทินแหงการทุจริตไมไดรับการเยียวยามานานเกินไป และไดแทรกซึมไปทั่วทุกระดับของรัฐบาล โรครายแรงตองใชยาแรง และในกรณีนี้ ยานั้นคือการกวาดลางทุกคนที่เราสงสัยวามีพฤติกรรมทุจริตอยางสิ้นเชิง"

BEL_royal_commander_in_chief: "จอมทัพแหงราชวงศ"
BEL_royal_commander_in_chief_desc: "พระเจาเลโอโปลดที่ 3 ทรงสืบเชื้อสายนักรบที่ดี พระเจาอัลแบรทรงเปนวีรบุรุษสงคราม ทรงอยูเคียงขางประเทศในยามมืดมิดที่สุดและนําเราสูชัยชนะอันรุงโรจน สิ่งที่เลโอโปลดตองการคือพิสูจนพระองคเองและกาวออกจากเงาของพระราชบิดา เราเพียงแคตองใหโอกาสแกพระองค"

BEL_the_european_crusade: "สงครามครูเสดแหงยุโรป"
BEL_the_european_crusade_desc: "มีแรงวนเวียนอยูตามขอบของยุโรป อุดมการณปาเถื่อนของพวกมันกําลังมองหาจุดออนของชาติที่มีอารยธรรมภายในทวีป เปนภารกิจของเราที่จะยืนหยัดเปนปอมปราการแหงระเบียบและความกาวหนา ประเทศของเราไดพิสูจนความมุงมั่นที่ไมมีใครเทียบได จึงสมควรยืนหยัดเปนผูนําในการตอสูนี้"

BEL_belgian_renaissance: "ยุคฟนฟูแหงเบลเยียม"
BEL_belgian_renaissance_desc: "เราถูกทุบตี เราถูกพิชิต แตไมเคยถูกหักโคน สิ่งนี้เปนไปไดก็ดวยแบบอยางอันโดดเดนของ[ROOT.GetRulingPartyLong]เทานั้น และมีเพียงการนําอยางตอเนื่องของเราเทานั้นที่จะทําใหยุคฟนฟูแหงเบลเยียมนี้ดําเนินตอไป บนเสนทางสูยุคทองอีกครั้ง"

BEL_support_the_vnv: "สนับสนุน VNV"
BEL_support_the_vnv_desc: "ในการเลือกตั้งครั้งลาสุด Vlaamsch Nationaal Verbond หรือสหภาพแหงชาติเฟลมิช ไดเปนพันธมิตรกับพรรคเร็กซดวยความตั้งใจจะสรางรัฐบรรษัทนิยม บัดนี้เมื่อเดอเกรลขึ้นสูอํานาจแลว ก็ถึงเวลาที่เขาจะตอบแทนพันธมิตรและเริ่มกาวไปสูรัฐฟาสซิสตที่ขยายอํานาจมากขึ้น โดยมุงมั่นที่จะรวมชาติกับเนเธอรแลนด"
BEL_vnv_dominant_tt: "§Y[BEL.GetName]§! จะเปนที่รูจักในนาม§Yฟลานเดอรส§!"

BEL_revitalize_nederlands: "ฟนฟูภาษาดัตช"
BEL_revitalize_nederlands_desc: "ภาษาของเราแทบจะหายไปแลว! แมแตศาลก็ยังพิพากษาเปนภาษาฝรั่งเศส และจดจํากันไดเพียงภาษาถิ่นเทานั้น กาวแรกสูการฟนฟูความยิ่งใหญของเฟลมิช คือการทําใหรัฐบาลและประชาชนของเราพูดภาษาที่ถูกตอง ภาษาดัตช!"

BEL_flanders_ascendant: "ฟลานเดอรสผงาด"
BEL_flanders_ascendant_desc: "บัดนี้เมื่อความภาคภูมิใจในขนบธรรมเนียมและประวัติศาสตรเฟลมิชกําลังเพิ่มสูงขึ้น ก็ถึงเวลาที่เราจะใชความรูสึกชาตินิยมที่เพิ่งจุดประกายขึ้นใหมนี้ นําประเทศไปสูชะตากรรมของตน นั่นคือการรวมชาติกับเนเธอรแลนด"

BEL_dietsland: "ดีทสลันด"
BEL_dietsland_desc: "ความพยายามของเราในการยึดดินแดนที่พูดภาษาดัตชที่เหลือในยุโรปประสบความสําเร็จ แตดูเหมือนพี่นองของเราไมไดปรับตัวเขากับอนาคตใหมนี้ไดดีอยางที่เราคาดไวทุกคน เราควรเตือนใหพวกเขาระลึกถึงวัฒนธรรมและภาษาที่เรามีรวมกัน"
BEL_dietsland_tt: "§Y[BEL.GetName]§! จะเปนที่รูจักในนาม§Yดีทสลันด§!"

BEL_demand_calais: "เรียกรองกาเล"
BEL_demand_calais_desc: "แมโครงการรวมชาติของเราใกลจะสมบูรณแลว แตยังมีสวนสําคัญของฟลานเดอรสที่อยูในมือตางชาติ นั่นคือกาเล (Kales) เดิมทีมันเปนสวนหนึ่งของเคานตีฟลานเดอรสเมื่อพันปกอน ดังนั้นจึงเปนการสมควรแลวที่จะตองคืนมันใหแกเรา"
treaty_of_calais: "ไดลงนามสนธิสัญญากาเลแลว"
BEL_demand_calais_tt: "ทางเลือกของเรามีตั้งแตพยายาม§Yซื้อกาเล§! §Yแลกสวนหนึ่งของคองโกกับกาเล§! การยื่น§Yขอเรียกรอง§! ไปจนถึง§Yการตอสูเพื่อมัน§! หากจําเปนตองทําเชนนั้น"

BEL_belgian_east_indies: "หมูเกาะอินเดียตะวันออกของเบลเยียม"
BEL_belgian_east_indies_desc: "ชาวดัตชมีอาณานิคมสําคัญในตางแดน โดยเฉพาะหมูเกาะอินเดียตะวันออก ความทะเยอทะยานดานจักรวรรดิของเราไมเคยหายไป และยังมีที่วางเสมอสําหรับเพิ่มอัญมณีอีกสองสามเม็ดบนมงกุฎของเรา"

BEL_burgundy_rising: "เบอรกันดีผงาด"
BEL_burgundy_rising_desc: "ยุคทองแหงอํานาจและอิทธิพลของเฟลมิชคือยุคที่เราครอบงําดัชชีเบอรกันดี หากเราปรารถนาจะฟนฟูเกียรติภูมิระดับโลก เราตองยึดมั่นในขนบทางการทหารและการเงินของบรรพบุรุษ กาวแรกในการบรรลุสิ่งนี้ยอมเปนการทวงคืนดินแดนเหลานั้น"
BEL_burgundy_tt: "§Y[BEL.GetName]§! จะเปนที่รูจักในนาม§Yเบอรกันดี§!"

BEL_join_axis: "เขารวมฝายอักษะ"
BEL_join_axis_desc: "เราถูกโดดเดี่ยวมานานเกินไป ถึงเวลาที่เราจะรวมมือกับพี่นองเจอรแมนิกและสรางพันธมิตรระหวางกัน เพื่อปกปองและขยายความทะเยอทะยานรวมของเรา"

BEL_strength_and_brotherhood: "ความแข็งแกรงและภราดรภาพ"
BEL_strength_and_brotherhood_desc: "เราจะแสวงหาผูที่มีอุดมคติแหงความแข็งแกรงและภราดรภาพตรงกับเรา และรวมฝูงของเราเองเหมือนดั่งสิงโต ดวยวิธีนี้ เราจะสืบสานสิ่งที่ทําใหเราทรงพลัง และฉีกทึ้งผูที่ออนแอทั้งจิตใจและวิญญาณราวกับเหยื่อที่พวกเขาเปน"

BEL_demand_further_gallic_concessions: "เรียกรองสัมปทานจากกอลเพิ่มเติม"
BEL_demand_further_gallic_concessions_desc: "ถึงเวลาที่เราจะสลัดเสื้อคลุมแหงเลหกลทิ้ง และเปดเผยเจตนาที่แทจริงของเรา รอยราวระหวางเราไมเคยเปนความลับ แตเราตองแสดงความเหนือกวาใหประจักษชัดครั้งเดียวจบ ถึงเวลาควาชะตากรรมของเราแลว ไมวาอะไรจะเกิดขึ้น"
BEL_demand_further_gallic_concessions_tt: "ปลดล็อกการตัดสินใจ§Yรับดินแดนหลักในดินแดนอางสิทธิ์ของกอล§! หลังจากเราเขาควบคุมดินแดนเหลานั้นแลว"

BEL_belgica: "เบลจิกา"
BEL_belgica_desc: "เบลจิกาเปนหนึ่งในดินแดนเหนือสุดของจักรวรรดิโรมัน ไดชื่อนี้มาจากกลุมชนที่ทรงอิทธิพลที่สุดที่อาศัยอยูในพื้นที่นั้น เห็นไดชัดวาหากชาวโรมันมองเห็นพลังของชาวเบลเยียมได ก็สมควรแลวที่เราจะเดินตามแบบอยางนั้นและไปใหไกลกวาที่ชาวโรมันเคยฝนไว"
BEL_belgica_tt: "§Y[BEL.GetName]§! จะเปนที่รูจักในนาม§Yเบลจิกา§!"

BEL_constitutional_crisis: "วิกฤตรัฐธรรมนูญ"
BEL_constitutional_crisis_desc: "อูแบร ปแยรโล ผูวิพากษวิจารณลัทธิฟาสซิสตและเลอง เดอเกรลอยางเปดเผย ไดคัดคานอยางหนักตอพระราชวินิจฉัยของพระมหากษัตริยที่แตงตั้งเดอเกรลเปนนายกรัฐมนตรี เขาไดระดมเสียงสนับสนุนในรัฐสภาและผลักดันรางกฎหมายฉุกเฉินที่ประกาศวาพระมหากษัตริยไมสามารถทรงครองราชยไดชั่วคราว และประกาศใหการแตงตั้งเปนโมฆะกอนจะไดรับพระบรมราชานุมัติ"

BEL_kings_abdication: "การสละราชสมบัติของพระมหากษัตริย"
BEL_kings_abdication_desc: "หลังจากความสัมพันธระหวางรัฐสภากับพระมหากษัตริยแตกหักตอหนาสาธารณชน ไดมีแรงกดดันใหพระเจาเลโอโปลดทรงสละราชสมบัติ โดยหวังวาพระองคจะทรงยอมโดยสงบ"
BEL_kings_abdication_tt: "§Gเมื่อพระเจาเลโอโปลดไมอยูแลว เบลเยียมจะตานทานการรุกรานไดดียิ่งขึ้นมาก§!"

BEL_snap_election: "การเลือกตั้งกะทันหัน"
BEL_snap_election_desc: "เมื่อวิกฤตรัฐธรรมนูญถูกควบคุมไวไดชั่วคราว ก็ถึงเวลาที่จะทําใหรัฐบาลกลับมามีความชอบธรรมอีกครั้ง มิฉะนั้นก็ไมตางอะไรกับผูที่เพิ่งถูกโคนลมไป ขณะนี้ปอล-อ็องรี สปาก จากพรรคสังคมนิยม และอูแบร ปแยรโล จากพรรคคาทอลิก เปนตัวเต็ง"
BEL_auto_complete_snap_election_tt: "แผนยุทธศาสตรนี้จะสําเร็จโดยอัตโนมัติตามผลของเหตุการณ§Yการเลือกตั้งกะทันหัน§!"

BEL_liberal_victory: "ชัยชนะของฝายเสรีนิยม"
BEL_liberal_victory_desc: "พรรคคาทอลิกที่มีแนวคิดเสรีนิยมทางเศรษฐกิจไดอันดับหนึ่งในการเลือกตั้งครั้งลาสุด และอูแบร ปแยรโล จะนํา[BEL.GetName] โดยใหคํามั่นวาจะปกปองประเทศและชาวเบลเยียมจนถึงที่สุด"

BEL_socialist_victory: "ชัยชนะของฝายสังคมนิยม"
BEL_socialist_victory_desc: "ปอล-อ็องรี สปาก นําพรรคแรงงานสูชัยชนะในการเลือกตั้งกะทันหัน และไดใหคําสัตยวาจะทําทุกอยางในอํานาจเพื่อรักษาบูรณภาพแหงพรมแดนเบลเยียม ไมวาจะตองเขาขางฝายคอมมิวนิสตหรือฝายประชาธิปไตยก็ตาม"

BEL_expression_of_belgian_unity: "การแสดงออกถึงเอกภาพของเบลเยียม"
BEL_expression_of_belgian_unity_desc: "วัฒนธรรมที่ประกอบกันเปนอัตลักษณ[BEL.GetAdjective]คือจุดแข็งที่ยิ่งใหญที่สุดของเรา เพราะจากอุดมคติ มุมมอง และแมแตภาษาที่แตกตาง เราจึงพบความเขาใจที่แทจริง สิ่งที่แบงแยกเรา คือสิ่งที่รวมเราไว"

BEL_anti_corruption_taskforce: "หนวยเฉพาะกิจตอตานการทุจริต"
BEL_anti_corruption_taskforce_desc: "การทุจริตแพรระบาดในรัฐมานานเกินไป บัดนี้เมื่อเรากําจัดความเนาเฟะที่ระดับบนสุดไดแลว ก็ถึงเวลาที่จะปราบปรามสวนที่เหลือ เราจะสั่งตั้งหนวยเฉพาะกิจสอบสวนพิเศษที่มีอํานาจกวางขวาง เพื่อเปดโปงและขับไลผูที่รํ่ารวยขึ้นโดยใชเงินของผูเสียภาษี"

BEL_diplomatic_rapprochment: "การกลับมาสานสัมพันธทางการทูต"
BEL_diplomatic_rapprochment_desc: "การแสดงออกถึงความเปนกลางของเราจําเปนตอความเปนจริงทางการเมืองและการทูตในเวลานั้น แตบัดนี้สิ่งตาง ๆ เปลี่ยนไปแลว เราไมเคยหยุดพูดคุยกับมิตรในชาติอื่น แตตอนนี้เราควรเปดเผยและเปนทางการมากขึ้นในเรื่องนี้"

BEL_belgian_maginot: "มายิโนตเบลเยียม"
BEL_belgian_maginot_desc: "เบลเยียมเปนรัฐกันชนระหวางสองชาติมหาอํานาจทางทหาร และตลอดประวัติศาสตรถูกคุกคามจากทั้งสองฝาย ดวยเหตุนี้ เราจึงกลายเปนปรมาจารยแหงสงครามตั้งรับ แนวมายิโนตของฝรั่งเศสมาถึงพรมแดนของเรา และเราตองตอมันใหยาวขึ้นเพื่อปกปองประเทศของเราเอง หากเราทําใหตัวเองไมอาจพิชิตได เราก็จะไมมีวันถูกโจมตีเลย"
BEL_belgian_maginot_available_tt: "ควบคุมและสามารถสราง§Yปอมภาคพื้นดิน 3 ระดับ§!ขึ้นไปในจังหวัดหนึ่งใน§Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! หรือ§Y[977.GetName]§! บนพรมแดน§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!"
BEL_belgian_maginot_bypass_tt: "§Rไมได§!ควบคุม หรือไมสามารถสราง§Yปอมภาคพื้นดิน 3 ระดับ§!ขึ้นไปในจังหวัดหนึ่งใน§Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! หรือ§Y[977.GetName]§! บนพรมแดน§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!"
BEL_belgian_maginot_tt: "เพิ่ม§Yปอมภาคพื้นดิน§!ตามแนวพรมแดน§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!"

BEL_soviet_guarantee: "การรับประกันจากโซเวียต"
BEL_soviet_guarantee_desc: "แมเราจะโนมเอียงไปทางประชาธิปไตยมากกวา แตเราไดโอบรับแนวทางสังคมนิยม และมีอะไรมากมายที่จะมอบให[SOV.GetNameDef] ตราบใดที่เราพูดในสิ่งที่ถูกหู และปฏิบัติตามแนวทางการทูตกวาง ๆ ของพวกเขา เราก็อาจไดหมีรัสเซียมาเปนมิตร"
BEL_soviet_guarantee_tt: "พวกเขาจะมีแนวโนม§Gตอบรับ§!มากขึ้น หากเราดําเนินแผน§Y$BEL_raise_the_red_flag$§!สําเร็จแลว"

BEL_expedite_fort_construction: "เรงการกอสรางปอม"
BEL_expedite_fort_construction_desc: "นี่คือโลกอันตรายที่รายลอมดวยมหาอํานาจที่เปนศัตรู เราตองทําใหแนใจวาเราพรอม และลงทุนมากขึ้นในภาคปอมปราการและวิศวกรรม เพื่อใหมีการเตรียมการพรอมกอนที่จะจําเปนตองใช"

BEL_democratization_of_education: "การศึกษาเพื่อทุกคน"
BEL_democratization_of_education_desc: "สังคมของเรามีธรรมเนียมแหงการเอื้ออาทรตอกัน ซึ่งเห็นไดชัดที่สุดจากสัญญาประชาคมระหวางแรงงานและบรรษัท ในทํานองเดียวกัน รัฐควรมุงมอบความเทาเทียมทางโอกาสใหทุกคน และเนนยํ้าความสําคัญของการศึกษาที่ดี"

BEL_invite_soviet_tank_makers: "เชิญนักพัฒนารถถัง[SOV.GetAdjective]"
BEL_invite_soviet_tank_makers_desc: "กอนหนานี้เราพึ่งพาพันธมิตรสําหรับหนวยยานเกราะมาตลอด และแมมิตรของเราจะเปลี่ยนไป แตนโยบายนี้ยังคงเหมือนเดิม ดวยความสัมพันธฉันมิตรกับสหภาพโซเวียต เราอาจโนมนาวใหพวกเขาสนับสนุนเราดวยความรูเชิงลึกบางประการได"

BEL_join_allies: "เขารวมฝายสัมพันธมิตร"
BEL_join_allies_desc: "ในมหาสงคราม เราเคยยืนหยัดเคียงขางกันในฐานะพันธมิตร และรวมกันผานบททดสอบของการรุกรานมาได เราจะยืนหยัดรวมกันอีกครั้ง ตอตานทุกผูที่คิดรายตอเรา"

BEL_unity_makes_strength: "สามัคคีคือพลัง"
BEL_unity_makes_strength_desc: "เดิมเปนคําขวัญของสาธารณรัฐดัตช ในสมัยที่ปกครองทั้งเนเธอรแลนดและเบลเยียม รัฐเบลเยียมรับมาใชอยางเปนทางการหลังการปฏิวัติป 1830 ซึ่งนําไปสูเอกราชของเรา คําขวัญนี้ไดรับการยึดถืออยางแทจริงจากความเปนเอกภาพของฝายกาวหนาเสรีนิยมและฝายอนุรักษนิยมคาทอลิก ซึ่งยืนอยู ณ ใจกลางการเมืองเบลเยียม และเปนตัวแทนของอุดมคติแบบเบลเยียมนับแตนั้นมา"

BEL_join_comintern: "เขารวมโคมินเทิรน"
BEL_join_comintern_desc: "โคมินเทิรนมีประวัติการชวยเหลือผูที่ยืนหยัดในแนวทางสังคมนิยม และเมื่อเราถูกรุมลอมทุกดานโดยผูที่ตองการบดขยี้การปลดปลอยแรงงานที่กําลังเบงบานของเรา เราตองมองไปทางตะวันออกเพื่อหามิตรใหม"

BEL_better_than_maginot: "ดีกวามายิโนต"
BEL_better_than_maginot_desc: "ปอมปราการของเราตองกาวจากระดับแนวหนาของโลก สูระดับที่ไมมีใครในโลกเทียบได เราไมมีทางรูวาการโจมตีครั้งตอไปจะมาจากทางไหน ดังนั้นเราตองพรอมรับทุกสิ่ง เราตองสรางสนามเพลาะที่มีสนามเพลาะคอยหนุน บังเกอรซอนบังเกอร และที่สําคัญที่สุด เราตองการปนเพิ่ม ปนอีกมาก ๆ กระบอกใหญ ๆ"

BEL_vandervelde_minority: "รัฐบาลเสียงขางนอยของฟนเดอรเฟลเดอ"
BEL_vandervelde_minority_desc: "เอมีล ฟนเดอรเฟลเดอ ควาชัยในการเลือกตั้ง แตพรรคแรงงานของเขาชนะไดเพียงเสียงขางนอย หลังการเจรจาจัดตั้งรัฐบาลผสมลมเหลว เขาจึงเลือกที่จะเดินหนาเพียงลําพัง แมเสนทางการเมืองขางหนาจะยากลําบาก"

BEL_problem_of_language: "ปญหาเรื่องภาษา"
BEL_problem_of_language_desc: "เบลเยียมถูกแบงแยกดวยภาษามานานเกินไป และหากพรรคแรงงานหวังจะรวมประเทศใหอยูภายใตการปกครองของตน จุดยืนที่ชัดเจนที่สุดคือการแสดงทาทีเรื่องภาษาหลักใหชัด หรือแมแตเปนผูนําผลักดันการใชสองภาษาอยางเปนทางการดังที่ปฏิบัติกันในบรัสเซลส"

BEL_trade_union_support: "การสนับสนุนจากสหภาพแรงงาน"
BEL_trade_union_support_desc: "พันธมิตรโดยธรรมชาติของเราในการตอสูทางการเมืองคือสหภาพแรงงาน แตจนถึงตอนนี้การสนับสนุนขบวนการของเรายังคอนขางจืดจาง เราสามารถเพิ่มคํามั่นสัญญาตอพวกเขา และในทางกลับกันพวกเขาก็จะระดมสมาชิกมาสนับสนุนเรา"

BEL_cooperative_cooperation: "ความรวมมือกับสหกรณ"
BEL_cooperative_cooperation_desc: "สหกรณเปนสวนหนึ่งของสังคมเบลเยียมมาระยะหนึ่งแลว และรูปแบบธุรกิจของพวกเขาก็เขากันไดดีกับอุดมคติทางเศรษฐกิจที่เรายึดถือ เราควรรวมมือกับสหกรณที่ตั้งมั่นอยูแลว และใชความเชี่ยวชาญของพวกเขาฝกธุรกิจรุนใหมที่ตระหนักถึงสังคม"

BEL_aid_for_spain: "ความชวยเหลือแกสเปน"
BEL_aid_for_spain_desc: "ฝายสาธารณรัฐสเปนกําลังตอสูเพื่ออุดมคติประชาธิปไตยตอตานพวกหัวรุนแรงฟาสซิสตและอนาธิปไตยที่อันตราย เราควรใหการสนับสนุนพวกเขาอยางเงียบ ๆ ในการตอสู แตตองระวังรักษาภาพลักษณความเปนกลางของเราไว"

BEL_the_grand_place: "กร็อง-ปลัส"
BEL_the_grand_place_desc: "จัตุรัสใหญใจกลางบรัสเซลสเปนแหลงบมเพาะแนวคิดสังคมนิยมมาชานาน ที่โดงดังที่สุดคือคารล มารกซไดเขียนแถลงการณพรรคคอมมิวนิสตที่นี่ ตอมาสถานที่เดียวกันนี้ยังเปนที่จัดสมัชชาครั้งที่ 3 ขององคการสากลที่หนึ่ง และในที่สุดก็เปนสถานที่กอตั้งพรรคสังคมนิยมพรรคแรก คือพรรคแรงงานเบลเยียม"

BEL_la_belgique_et_le_congo: "เบลเยียมและคองโก"
BEL_la_belgique_et_le_congo_desc: "บทบาทของเบลเยียมในคองโกเปนบทบาทของการขูดรีดและการกดขี่มาชานาน ทั้งที่ควรเปนบทบาทของการสงเสริมความเทาเทียมและโอกาส ดวยการใหความสําคัญกับอุดมคติสังคมนิยมภายในประเทศอีกครั้ง ถึงเวลาแลวที่เราจะเริ่มใหการศึกษาแกพี่นองในอาณานิคมเกี่ยวกับปรัชญานี้ และเริ่มลงทุนในอนาคตแบบสังคมนิยมของพวกเขา"

BEL_spanish_intervention: "การแทรกแซงในสเปน"
BEL_spanish_intervention_desc: "สถานการณของฝายสาธารณรัฐในสเปนงอนแงน และชัดเจนวาหากประชาธิปไตยจะชนะ ผูที่หวงแหนมันตองเพิ่มการสนับสนุนแกผูที่ตอสูเพื่อมัน"
BEL_spanish_intervention_tt: "ปลดล็อกการตัดสินใจเพิ่มเติมสําหรับ§Y$BEL_intervention_in_spain_cat$§!\n\nเราจะสามารถสงยุทโธปกรณ สงเสริมการอพยพเพื่อชวยความพยายามของพวกเขา และสนับสนุนพวกเขาทางการเมือง"

BEL_contradictions_in_socialism: "ความขัดแยงในสังคมนิยม"
BEL_contradictions_in_socialism_desc: "ความสําเร็จลาสุดของเราในการขยายอุดมคติสังคมนิยมในคองโกไดผลิดอกออกผลอยางชัดเจน เพราะประชาชนที่นั่นมั่งคั่งกวาที่เคยเปนมา ดังนั้นจึงชัดเจนยิ่งวาเราตองขยาย "ภารกิจทําใหเปนสังคมนิยม" ของเรานี้ไปทั่วแอฟริกา!" 
BEL_contradictions_in_socialism_tt: "ไดรับเปาหมายสงคราม§Yยึดรัฐที่อางสิทธิ์§!ตอประเทศที่ครองดินแดนซึ่งไดรับการอางสิทธิ์จากแผนยุทธศาสตรนี้ในปจจุบัน"

BEL_growing_threat_of_fascism: "ภัยคุกคามที่เพิ่มขึ้นของลัทธิฟาสซิสต"
BEL_growing_threat_of_fascism_desc: "การเพิ่มขึ้นของแรงสนับสนุนฟาสซิสตหัวรุนแรงทั่วยุโรป และแทจริงแลวทั่วโลก ไดกลายเปนแนวโนมที่นากังวลอยางยิ่ง และเราควรเตรียมพรอมทําสิ่งที่จําเปนเพื่อปองกันการแพรกระจาย แมวาการกระทํานั้นจะตองเปนการชิงลงมือกอนก็ตาม"

BEL_peacekeeping_missions: "ภารกิจรักษาสันติภาพ"
BEL_peacekeeping_missions_desc: "ความขัดแยงที่ดําเนินอยูทั่วโลกยังคงสรางความกังวลใหเรา แตเพื่อรักษาภาพลักษณภายนอกของความเปนกลาง เราจึงสงทหารไปตางประเทศไดเฉพาะในภารกิจรักษาสันติภาพที่ไดรับอนุมัติเทานั้น"

BEL_international_socialist_bureau: "สํานักงานสังคมนิยมสากล"
BEL_international_socialist_bureau_desc: "องคการสากลที่สองมีสํานักเลขาธิการถาวรตั้งอยูในบรัสเซลส และแมองคกรนั้นจะถูกยุบไปในป 1916 แตการตอสูของสังคมนิยมยังคงดําเนินตอไป บัดนี้เมื่อเรากลับมายืนหยัดบนเวทีระหวางประเทศไดอีกครั้ง เราควรสถาปนาสถาบันนี้ขึ้นใหมและรับบทบาทผูนําในสังคมนิยมสากลอีกครั้ง"

BEL_raise_the_red_flag: "ชูธงแดง"
BEL_raise_the_red_flag_desc: "จนถึงปจจุบัน ความพยายามสวนใหญของเราสอดคลองกับอุดมคติสังคมนิยมสายกลาง แตเพื่อใหเราใกลชิดกับกลุมโซเวียตมากขึ้น เราอาจตองเพิ่มการสนับสนุนพรรคคอมมิวนิสต กาวแรกคือการรับรอง "Le Drapeau Rouge" (ธงแดง) หนังสือพิมพคอมมิวนิสตในเบลเยียม"
BEL_raise_the_red_flag_tt: "ปลดล็อกการตัดสินใจ§Y$BEL_rekindle_the_red_flame_cat$§! และเปลี่ยน[BEL.GetNameDef]ใหเปน§Yคอมมิวนิสต§!"

BEL_support_the_european_project: "สนับสนุนโครงการยุโรป"
BEL_support_the_european_project_desc: "ในโลกที่ถูกครอบงําดวยสงครามและความขัดแยง เปนที่ประจักษชัดยิ่งแกเราวาความเปนกลางไมใชหลักประกันสันติภาพ ดังนั้นเราควรยื่นมือไปยังรัฐยุโรปดวยกัน และสรางองคกรที่มุงมั่นตอความมั่นคงรวมกันและเสถียรภาพทางเศรษฐกิจ เพื่อที่เราจะรุงเรืองไปดวยกัน"

BEL_european_community: "ประชาคมยุโรป"
BEL_european_community_desc: "ชวงแรกของโครงการยุโรปดําเนินไปไดดี ดังนั้นเราควรพิจารณาขยายสมาชิกภาพ และใหสัตยาบันสนธิสัญญาชุดหนึ่งที่กําหนดอนาคตของประชาคม เราอาจพิจารณากาวไปสูรูปแบบสหพันธมากขึ้นดวยซํ้า โดยมีเบลเยียมเปนผูนําอยู ณ ใจกลาง"
BEL_european_community_tt: "ปลดล็อกการตัดสินใจเพื่อดําเนินการ§Y$BEL_closer_european_union_cat$§!"

BEL_the_king_surrenders: "พระมหากษัตริยทรงยอมจํานน"
BEL_the_king_surrenders_desc: "ในความเคลื่อนไหวที่ไมมีใครคาดคิด พระเจาเลโอโปลดที่ 3 ทรงใชพระราชอํานาจในฐานะจอมทัพเสนอการยอมจํานนโดยไมมีเงื่อนไขของหนวยทหารเบลเยียมทั้งหมดตอศัตรู ภายนอกดูเหมือนเปนไปเพื่อรักษาชีวิตใหไดมากที่สุด แตมีเสียงกระซิบถึงแรงจูงใจที่มืดมนกวานั้น"

BEL_unfit_to_reign: "ไมเหมาะสมที่จะครองราชย"
BEL_unfit_to_reign_desc: "เมื่อพิจารณาการยอมจํานนโดยไมมีเงื่อนไขที่พระเจาเลโอโปลดที่ 3 ทรงเสนอโดยไมไดรับความเห็นชอบจากรัฐสภา รัฐบาลพลเรือนจึงประกาศวาพระองคไมเหมาะสมที่จะปกครอง และใหคํามั่นวาจะทําสงครามตอจากตางแดน"

BEL_prisoner_king: "กษัตริยผูถูกจองจํา"
BEL_prisoner_king_desc: "พระเจาเลโอโปลดที่ 3 ทรงปรารถนาจะรับโทษเคียงขางประชาชน จึงทรงเลือกประทับอยูใน[BEL.GetNameDef]ในฐานะเชลย บัดนี้ไดรับขนานนามวา 'กษัตริยผูถูกจองจํา' ประชาชนของพระองคตางเห็นชอบกับการกระทํานี้ และเริ่มรวมใจกันตามแบบอยางของพระองคในยามยากลําบากนี้"

BEL_government_in_exile: "รัฐบาลพลัดถิ่น"
BEL_government_in_exile_desc: "ชนชั้นนําทางการเมือง[BEL.GetAdjective]ที่รอดชีวิตไดเดินทางมาถึงเมืองหลวงของประเทศเจาบานแลว ในจํานวนนั้นมีรัฐมนตรีคนสําคัญหลายคน ไดแก อูแบร ปแยรโล, ปอล-อ็องรี สปาก, กามีย กุทท และอัลแบร ฟาน ฟลีสเฮาเวอร พวกเขารวมกันจัดตั้ง "รัฐบาลสี่คน" และใหคํามั่นวาจะสูสงครามจนถึงชัยชนะ"

BEL_la_dame_blanche: "ลาดามบล็องช"
BEL_la_dame_blanche_desc: "ดามบล็องช หรือสตรีชุดขาว เปนองคกรตอตานใตดินในชวงมหาสงคราม วาลแตร เดอเว ผูนําขบวนการในสมัยนั้น ไดเตรียมการอยางเงียบ ๆ สําหรับกรณีที่เบลเยียมถูกยึดครองอีกครั้ง และบัดนี้ถึงเวลาที่เราจะปลดปลอยขีดความสามารถขององคกรนี้เปนครั้งที่สอง"
BEL_government_in_exile_tt: "ปลดล็อก§Y$BEL_government_in_exile_cat$§! เพื่อเสริมความชอบธรรมและการตอตานของ[ROOT.GetName]"

BEL_moi_dabord: "Moi d'abord"
BEL_moi_dabord_desc: "Moi d'abord! ผมกอน! เสียงรองอันโดงดังของสปากเมื่อเอกอัครราชทูตฝายศัตรูมาพรอมคําประกาศสงคราม สปากซึ่งโกรธจัดอยูแลวกับการปะทุของสงคราม ตองการใหการโจมตีแบบไมทันตั้งตัวถูกบันทึกไวในเอกสารระหวางประเทศกอนที่คําประกาศสงครามจะถูกยื่น นับแตนั้นมันจึงกลายเปนเสียงปลุกใจของผูสนับสนุนรัฐบาลพลัดถิ่น"

BEL_v_for_victory: "V เพื่อชัยชนะ"
BEL_v_for_victory_desc: "Victoire! Vryheid! สองคํา คือชัยชนะและเสรีภาพ ที่พบในภาษาของเบลเยียมและขึ้นตนดวยอักษรเดียวกัน นิ้วชี้และนิ้วกลางที่ชูขึ้นไดกลายเปนสัญลักษณแหงการขัดขืนและความมุงมั่นในหมูชาวเบลเยียม กอนจะแพรไปยังตางแดน และถึงขั้นถูกนําไปใชโดยผูนําชาติที่ขัดขืนในทํานองเดียวกัน"

BEL_democratic_homecoming: "การกลับบานของประชาธิปไตย"
BEL_democratic_homecoming_desc: "ไมใชราชวงศที่ทวงคืนมาตุภูมิใหเรา แตเปนสถาบันประชาธิปไตยของเรา และกระบวนการยกพลเมืองที่มีความสามารถที่สุดขึ้นมานําเรา เราควรยอมรับคุณูปการอันมีคาของพวกเขาตอชวงเวลานี้ และจารึกความสําเร็จของพวกเขาไวใหคนรุนหลัง"

BEL_charles_count_of_flanders: "ชารล เคานตแหงฟลานเดอรส"
BEL_charles_count_of_flanders_desc: "ชัดเจนวาเราไมอาจไววางใจใหเลโอโปลดกลับขึ้นครองราชยได เพราะพระองคทรงละทิ้งความรับผิดชอบทันทีที่ทรงยอมจํานนประเทศ โชคดีที่พระองคมีพระอนุชา คือเจาชายชารล เคานตแหงฟลานเดอรส ซึ่งจะเปนผูสําเร็จราชการที่ยอดเยี่ยมจนกวาเราจะตัดสินอยางเปนทางการวาจะทําอยางไรกับ 'กษัตริย'"

BEL_leopolds_return: "การเสด็จกลับของเลโอโปลด"
BEL_leopolds_return_desc: "พระเจาเลโอโปลดที่ 3 ทรงเปนผูปกครองโดยชอบธรรมของ[BEL.GetNameDef] และพระองคควรกลับขึ้นครองราชยเมื่อเบลเยียมไดคืนสูเราแลว"

BEL_secretaries_general: "ปลัดกระทรวง"
BEL_secretaries_general_desc: "แมเราจะทําทุกวิถีทางเพื่อปกปองประเทศ แตเราตองมองตามความเปนจริงเมื่อเทียบกับเพื่อนบานที่ใหญกวามาก และตัดสินใจอยางยากลําบากในการออกกฎหมายรองรับกรณีที่เรายอมจํานน ดวยเหตุนี้ เราจึงตั้งคณะปลัดกระทรวงขึ้น ซึ่งเปนขาราชการที่ไดรับอนุญาตตามกฎหมายใหรวมมือกับผูยึดครองใดก็ได เพื่อใหการปกครองทองถิ่นดําเนินตอไปได"

BEL_the_secret_army: "กองทัพลับ"
BEL_the_secret_army_desc: "บัดนี้เมื่อประเทศของเราถูกยึดครอง เราตองเริ่มสรางขบวนการตอตานเพื่อกอวินาศกรรมและสรางความปนปวน กองทัพลับคือชองทางของเรา กอตั้งโดยนายทหารจํานวนหนึ่งจากกองทัพที่พายแพ พวกเขามีทักษะดานการจัดองคกรและการสงกําลังบํารุงที่จําเปนเพื่อเริ่มตนสิ่งนี้ สิ่งเดียวที่เราตองทําคือออกคําสั่ง"

BEL_the_belgian_legion: "กองทหารเบลเยียม"
BEL_the_belgian_legion_desc: "กองทหารเบลเยียมเปนกลุมผูจงรักภักดีฝายอนุรักษนิยมและนิยมกษัตริย ที่พรอมและกระตือรือรนจะจับอาวุธในพระนามของกษัตริย เราควรลักลอบนําผูที่ทําไดออกนอกประเทศ และใชพวกเขาใหเกิดประโยชน"

BEL_develop_home_support: "พัฒนาการสนับสนุนในประเทศ"
BEL_develop_home_support_desc: "แมความพยายามดานสงครามสวนใหญจะประสานงานจากที่พลัดถิ่น แตเรายังไดรับการสนับสนุนอยางกวางขวางในประเทศ ซึ่งสวนใหญตองขอบคุณงานของคณะปลัดกระทรวง ที่พิสูจนแลววาสามารถจัดระเบียบความพยายามของพลเมืองไดดีโดยไมยั่วยุผูยึดครองเกินควร"

BEL_military_service_for_all_in_exile: "การรับราชการทหารสําหรับทุกคนในตางแดน"
BEL_military_service_for_all_in_exile_desc: "มีชาว[BEL.GetAdjective]จํานวนมากอาศัยอยูทั่วโลก เราควรออกกฤษฎีกาใหทุกคนตองเขารับราชการทันทีเพื่อปลดปลอยมาตุภูมิ ความรักชาติกําลังพลุงพลาน และเราคาดหวังไดวาจะมีแรงสนับสนุนหลั่งไหลเขามามาก"

BEL_consolidate_resistance_groups: "รวมกลุมตอตาน"
BEL_consolidate_resistance_groups_desc: "มีองคกรตอตานจํานวนมากใน[BEL.GetNameDef] ทุกกลุมกระตือรือรนที่จะสนับสนุนการปลดปลอยของเรา แตถูกแบงแยกดวยอุดมการณ ความคิดเห็น อุดมคติ กลุมผลประโยชน และผูสนับสนุนที่หลากหลาย ในฐานะรัฐบาลพลัดถิ่น เรามีอํานาจที่จะเปนศูนยกลางในการจัดระเบียบ เพื่อนําทุกกลุมไปสูเปาหมายรวมกัน"

BEL_free_belgian_forces: "กองกําลังเบลเยียมเสรี"
BEL_free_belgian_forces_desc: "บัดนี้กําลังของเราในตางแดนเติบโตมากพอที่จะเริ่มปฏิบัติการทางทหารอยางจริงจังตอผูยึดครองแลว แมการรบอาจไมไดเกิดขึ้นเพื่อเบลเยียมโดยตรงในทันที แตอยางนอยในที่สุดเราก็นําการตอสูไปหาศัตรูได และมีสวนในความพยายามดานสงครามโดยตรงมากขึ้นดวยเลือดและเหล็กกลาของชาว[BEL.GetAdjective]"
BEL_free_belgian_forces_tt: "§YDivision d'Infanterie§! 2 กองพลจะปรากฏในรัฐแบบสุมในมาตุภูมิของประเทศเจาบานที่ใหลี้ภัย"

BEL_king_law_freedom: "กษัตริย กฎหมาย เสรีภาพ"
BEL_king_law_freedom_desc: "ชาวเบลเยียมที่ดีตอสูเพื่อกษัตริย กฎหมาย และเสรีภาพ เราควรสังเกตวากษัตริยมากอนสิ่งอื่นใด เชนเดียวกับที่เลโอโปลดที่ 3 ควรเปนในฐานะกษัตริยของเรา เพราะกฎหมายของพระองคคือสิ่งที่เรายึดถือ และเสรีภาพของพระองคคือสิ่งที่เราตอสูเพื่อมัน"

BEL_king_of_the_belgians: "กษัตริยแหงชาวเบลเยียม"
BEL_king_of_the_belgians_desc: "'ขาพเจาขอปฏิญาณวาจะปฏิบัติตามรัฐธรรมนูญและกฎหมายของประชาชนชาวเบลเยียม จะธํารงไวซึ่งเอกราชของชาติและบูรณภาพแหงดินแดน' นี่คือถอยคําที่ทําใหบุรุษคนหนึ่งเปนกษัตริย โดยกลาวเปนสามภาษา คือฝรั่งเศส ดัตช และเยอรมัน"

BEL_rally_to_the_king: "รวมใจถวายแดกษัตริย"
BEL_rally_to_the_king_desc: "พระมหากษัตริยทรงเปนมากกวาเชลย พระองคไดกลายเปนสัญลักษณของประเทศที่กําลังดิ้นรน เรามั่นใจวาดวยการนํา ความสามารถ พระปรีชา และความมุงมั่นของพระองค เราจะผานพนวันอันมืดมนนี้ และกาวออกมาเปนชาติที่แข็งแกรงและรุงเรืองยิ่งขึ้น"

BEL_van_overstraeten_on_the_home_front: "ฟาน โอเฟอรสตราเทินในแนวหลัง"
BEL_van_overstraeten_on_the_home_front_desc: "เขาฉลาดที่สุดในบรรดาบุคลากรทางทหารทั้งปวงอยางไมตองสงสัย ขอเสียคือเขารูตัวดี ฟาน โอเฟอรสตราเทินทําหนาที่ที่ปรึกษาทางทหารของพระมหากษัตริยไดอยางดีเยี่ยมกอนสงครามปะทุ และแมนิสัยของเขาจะทําใหการทํางานดวยเปนเรื่องทาทาย แตสถานการณบีบใหเราตองขอใหเขาลงสนาม และนําประเทศไปสูชัยชนะ"

BEL_expand_the_belgian_legion: "ขยายกองทหารเบลเยียม"
BEL_expand_the_belgian_legion_desc: "ผูคนหลั่งไหลมาอยูใตธงของกษัตริยมากขึ้นเรื่อย ๆ พรอมทุมเททุกสิ่งเพื่อรับใชราชบัลลังก เราเพียงแคออกคําสั่ง แลวพวกเขาจะเดินทัพไปทุกที่ที่เราสั่ง"
BEL_expand_the_belgian_legion_tt: "§YDivision d'Infanterie§! 3 กองพลจะปรากฏในรัฐแบบสุมในมาตุภูมิของประเทศเจาบานที่ใหลี้ภัย"

BEL_the_price_to_pay: "ราคาที่ตองจาย"
BEL_the_price_to_pay_desc: "พระมหากษัตริยทรงหารือกับผูยึดครองมาระยะหนึ่งแลว และพระอุปนิสัยของพระองคทําใหไดรับความไววางใจจากพวกเขา ดวยเหตุนี้ จึงเปนไปไดที่ดินแดนที่สูญเสียไปในเบลเยียมจะไดรับคืนมา ราคาที่พวกเขาเรียกรองเปนการตอบแทนนั้นเรียบงาย คุกเขา"

BEL_monetary_reconstruction: "การฟนฟูระบบการเงิน"
BEL_monetary_reconstruction_desc: "หลังสงครามโลกครั้งที่หนึ่ง เศรษฐกิจเบลเยียมยอยยับ เพื่อเอื้อตอการฟนฟูและชําระหนี้มหาศาล กระทรวงการคลังเบลเยียมจึงเริ่มพิมพเงิน พิมพออกมามากมาย แมจะชวยไดในตอนนั้น แตเราก็เสี่ยงตอภาวะเงินเฟอรุนแรง และตองควบคุมสิ่งนี้ใหไดกอนจะปฏิรูปดานอื่นใด"

BEL_rebuild_wallonian_industry: "ฟนฟูอุตสาหกรรมวัลโลเนีย"
BEL_rebuild_wallonian_industry_desc: "วัลโลเนียเปนพื้นที่ที่ไดรับความเสียหายหนักที่สุดระหวางการยึดครองของเยอรมนีในสงครามโลกครั้งที่หนึ่ง อุตสาหกรรมและทรัพยากรสวนใหญถูกผูยึดครองปลนสะดม การฟนฟูดําเนินไปอยางรวดเร็วในระหวางนั้น แตก็ยังตองการการลงทุนเพิ่มเพื่อใหบรรลุศักยภาพที่แทจริงในฐานะศูนยกลางอุตสาหกรรม[ROOT.GetAdjective]"

BEL_gold_reserves: "ทองคําสํารอง"
BEL_gold_reserves_desc: "โชคดีที่รัฐ[ROOT.GetAdjective]มีทองคําสํารองจํานวนมาก ปจจุบันมันเปนรากฐานที่มั่นคงสําหรับการกูยืมและการใหกูภายในประเทศ แมเราจะเลือกขายทองคําเพื่อเรงการพัฒนาและการกอสรางชั่วคราวก็ได"

BEL_social_partners: "หุนสวนทางสังคม"
BEL_social_partners_desc: "รัฐบาลของเราไดจัดการประชุมแรงงานแหงชาติเพื่อนําตัวแทนสหภาพแรงงานและบริษัทมาพบกัน ผลที่ไดคือการนําคาแรงขั้นตํ่าและวันหยุดพักผอนที่ไดรับคาจางหกวันตอปมาใช"

BEL_revive_coal_mining: "ฟนฟูการทําเหมืองถานหิน"
BEL_revive_coal_mining_desc: "เสาหลักของอุตสาหกรรมวัลโลเนียคือเหล็กกลามาโดยตลอด และเพื่อผลิตวัสดุสําคัญนี้ไดดียิ่งขึ้น เราตองขยายเหมืองถานหินในภูมิภาคนั้นอยางแข็งขัน"

BEL_40_hour_workweek: "สัปดาหทํางาน 40 ชั่วโมง"
BEL_40_hour_workweek_desc: "ผลอีกประการของการประชุมแรงงานแหงชาติคือการนําสัปดาหทํางาน 40 ชั่วโมงมาใชอยางกาวหนา แมในตอนแรกจะมีความกังขา แตเราไดเห็นผลิตภาพและความสุขของแรงงานที่เพิ่มขึ้น"

BEL_cockerill: "Cockerill"
BEL_cockerill_desc: "Cockerill เปนผูผลิตเหล็กกลาชั้นนําใน[ROOT.GetNameDef] มีโรงงานขนาดใหญที่ผลิตไดทุกอยางตั้งแตเครื่องยนตจนถึงปนใหญ เมื่อความตองการผลิตภัณฑเหลานั้นเพิ่มขึ้น เราอยูในตําแหนงที่เหมาะเจาะที่จะสงเสริมการขยายตัวของพวกเขาตอไป"
BEL_cockerill_tt: "§Gลด§!ตนทุนการแตงตั้ง§Y$BEL_cockerill_industrial$§!เปนกลุมธุรกิจอุตสาหกรรม"

BEL_railway_expansion: "ขยายทางรถไฟ"
BEL_railway_expansion_desc: "เสนเลือดใหญที่หลอเลี้ยงการคาและอุตสาหกรรม[ROOT.GetAdjective]คือทางรถไฟ เมื่อเศรษฐกิจของเราฟนตัวและกลับมาเติบโต เราตองทําใหโครงสรางพื้นฐานที่มีอยูกาวทันกัน"

BEL_corporate_social_responsibility: "ความรับผิดชอบตอสังคมของบรรษัท"
BEL_corporate_social_responsibility_desc: "แม[ROOT.GetNameDef]จะมีความเปนอุตสาหกรรมและความเปนเมืองสูง แตนาประหลาดใจที่สหภาพแรงงานไมเคยมีอํานาจมากอยางที่คาดไว ทั้งนี้เพราะมีธรรมเนียมทางวัฒนธรรมที่บรรษัทตองมีความรับผิดชอบตอสังคมตอแรงงานของตน แตการเตือนพวกเขาเรื่องนี้เปนครั้งคราวก็ไมเสียหายอะไร"

BEL_val_benoit_institutes: "สถาบันวาล-เบอนัว"
BEL_val_benoit_institutes_desc: "เราควรจัดตั้งสถาบันวาล-เบอนัวที่มหาวิทยาลัยลีแย็ฌ โดยตั้งภาควิชาวิทยาศาสตรใหมหลายแหงบนซากอารามวาล-เบอนัวเกา"

BEL_stk: "จัดตั้ง STK"
BEL_stk_desc: "เรามุงจัดตั้ง Studiecentrum voor de Toepassingen van de Kernenergie (ศูนยวิจัยการประยุกตใชพลังงานนิวเคลียร) หรือ STK เปนองคกรเฉพาะเพื่อศึกษาความเปนไปไดทางวิทยาศาสตรเบื้องหลังพลังงานปรมาณู"

BEL_embrace_export_economy: "โอบรับเศรษฐกิจการสงออก"
BEL_embrace_export_economy_desc: "แมจะไมเคยโดงดังเรื่องนี้เทาเพื่อนบานทางเหนือ แต[ROOT.GetNameDef]มีธรรมเนียมการคาอันนาภาคภูมิใจที่มีศูนยกลางอยูที่เมืองแอนตเวิรป มาใชประโยชนจากศักยภาพในการทํากําไรนี้ใหมากขึ้นกันเถอะ อยางไรเสีย มันก็เปนแคธุรกิจที่ดี"

BEL_engine_of_the_economy: "เครื่องจักรแหงเศรษฐกิจ"
BEL_engine_of_the_economy_desc: "รถไฟมีที่พิเศษในหัวใจชาว[ROOT.GetAdjective] มันจุดประกายนวัตกรรมใหม ทําใหการผลิตเดินหนาตามราง และเปนเชื้อเพลิงแหงการเติบโต แตเหนือสิ่งอื่นใด มันคือเครื่องจักรแหงเศรษฐกิจ"

BEL_belgian_miracle: "ปาฏิหาริยเบลเยียม"
BEL_belgian_miracle_desc: "ยากจะจินตนาการวาเมื่อสองทศวรรษกอน เบลเยียมเปนเพียงซากปรักหักพัง ถูกหลายคนมองวาเปนเพียงสมรภูมิยุโรปอีกแหง เมื่อเทียบกับตอนนี้ที่เราเปนประภาคารแหงผลิตภาพและนวัตกรรม ทั้งหมดนี้ตองขอบคุณความกลาหาญของทหาร ความทรหดของแรงงาน และความภักดีของพันธมิตรและมิตรสหายของเรา"

BEL_belgian_air_force: "กองทัพอากาศ[ROOT.GetAdjective]"
BEL_belgian_air_force_desc: "[ROOT.GetNameDef]เปนผูบุกเบิกดานกําลังทางอากาศ โดยพัฒนากองกําลังในสงครามครั้งที่แลวซึ่งแสดงผลงานไดดีเยี่ยม แตนาเสียดายที่ขอจํากัดดานงบประมาณไดฉุดรั้งนวัตกรรมไวนับแตนั้น เมื่อความตึงเครียดเพิ่มขึ้น เราตองทําใหกําลังยับยั้งทางอากาศของเรายังคงแข็งแกรง"

BEL_develop_belgian_air_industry: "พัฒนาอุตสาหกรรมการบินเบลเยียม"
BEL_develop_belgian_air_industry_desc: "เราไมมีประสบการณมากนักในการพัฒนาอากาศยานของเราเอง เพราะอุตสาหกรรมเครื่องบินดอยพัฒนาอยางนาเศรานับตั้งแตสงครามครั้งที่แลว มีนักออกแบบรุนใหมที่มีนวัตกรรมสูงและบริษัทเกิดใหมจํานวนหนึ่งที่เราสามารถใหเงินอุดหนุนและชวยพัฒนาได"

BEL_renard_constructions_aeronautiques: "Renard Constructions Aéronautiques"
BEL_renard_constructions_aeronautiques_desc: "หนึ่งในนักออกแบบที่มีแววที่สุดในระยะหลังคืออัลเฟรด เรอนาร เขามีแบบที่ลํ้าสมัยหลายแบบ และเราควรสนับสนุนความพยายามเหลานี้รวมถึงบริษัทของเขา"

BEL_stampe_et_vertrongen: "Stampe et Vertrongen"
BEL_stampe_et_vertrongen_desc: "แม Stampe et Vertrongen จะเชี่ยวชาญดานเครื่องบินฝก แตเราควรลงทุนในบริษัทสัญชาติเดียวกับเรานี้ และดัดแปลงแบบของพวกเขาสําหรับภารกิจแนวหนาเพิ่มเติม"

BEL_relocate_air_production: "ยายฐานการผลิตอากาศยาน"
BEL_relocate_air_production_desc: "การผลิตอากาศยานตองใชชิ้นสวนเฉพาะทางจํานวนมาก และตองพึ่งพาวิศวกรการบินที่หาทดแทนไดยาก แตเมื่อผลิตแลว อากาศยานสามารถนําไปประจําการไดแทบทุกที่ เราควรทําสัญญากับบริษัทตางชาติใหผลิตอากาศยานของเราในตางประเทศ เพื่อปกปองสายการผลิตของเรา"

BEL_pressurized_cabin_development: "การพัฒนาหองโดยสารปรับความดัน"
BEL_pressurized_cabin_development_desc: "เพื่อปรับปรุงคุณภาพการเดินทางทางอากาศระหวางเบลเยียมกับคองโก เราไดพัฒนาหองโดยสารปรับความดันที่ทําใหบินไดสูงกวาปกติมาก การนําเทคโนโลยีเดียวกันนี้มาปรับใชกับอากาศยานยามสงครามจะเพิ่มขีดความสามารถของมันอยางมาก"

BEL_foreign_plane_purchases: "จัดซื้อเครื่องบินตางประเทศ"
BEL_foreign_plane_purchases_desc: "นาเสียดายที่ดวยสภาพของอุตสาหกรรมการบิน[ROOT.GetAdjective] เราจําตองมองหาการจัดซื้ออากาศยานจากตางประเทศ มาประกาศการแขงขันและใหชาติอื่นยื่นประมูลสัญญากันเถอะ"

BEL_aviation_school: "โรงเรียนการบิน"
BEL_aviation_school_desc: "นักบินของเราตองการสถานที่เรียนรูวิชาชีพ เราควรพัฒนาสิ่งอํานวยความสะดวกในการฝกใหเหมาะสม"

BEL_polish_licences: "ใบอนุญาตจากโปแลนด"
BEL_polish_licences_desc: "[POL.GetNameDef]ไดติดตอมาเพื่อเสนอแบบอากาศยานบางแบบภายใตใบอนุญาต และสามารถใหเราใชไดในราคาตํ่ากวาราคาตลาดมาก"

BEL_early_helicopters: "เฮลิคอปเตอรยุคแรก"
BEL_early_helicopters_desc: "นิโกลา ฟลอรีน เลือกอพยพมายัง[ROOT.GetNameDef]หลังสงครามกลางเมืองรัสเซีย และแสดงความสนใจในรูปแบบการบินใหมสุดลํ้าที่ใชใบพัดหมุนเร็ว เราควรใหทุนการพัฒนานี้ และดูวาวิทยาการการบินแขนงใหมนี้จะพาเราไปไดไกลแคไหน!"

BEL_air_doctrine: "หลักนิยมทางอากาศ"
BEL_air_doctrine_desc: "การสงครามสมัยใหมเปลี่ยนแปลงและพัฒนาอยูตลอดเวลา เราควรใหทุนศึกษาหลักนิยมที่มหาอํานาจทางทหารอื่นใชอยูในปจจุบัน และดูวามีบทเรียนใดที่เรียนรูและนํามาใชกับกองทัพอากาศของเราได"

BEL_legacy_of_the_belgian_airforce: "มรดกแหงกองทัพอากาศเบลเยียม"
BEL_legacy_of_the_belgian_airforce_desc: "นักบินของเราไดรับการยกยองวาเปนหนึ่งในผูกลาหาญที่สุดที่ตอสูเหนือสมรภูมิของมหาสงคราม และขนบอันนาภาคภูมิใจนี้ยังคงไดรับการสืบสานมาจนถึงทุกวันนี้"

BEL_re_establish_belgian_navy: "สถาปนากองทัพเรือเบลเยียมขึ้นใหม"
BEL_re_establish_belgian_navy_desc: "แมจะไดเรือหลายลําจากเยอรมนีตามสนธิสัญญาแวรซาย แตหลังสงครามโลกครั้งที่หนึ่ง เบลเยียมไดยุบกองทัพเรือในป 1927 เนื่องจากขอจํากัดดานงบประมาณ ดวยภัยคุกคามที่กอตัวในตางแดน และความจําเปนที่ตองรักษาการติดตอสื่อสารทางยุทธศาสตรและการคา โดยเฉพาะกับคองโก เราตองสถาปนากองเรือของเราขึ้นใหม"

BEL_re_build_the_fleet: "สรางกองเรือขึ้นใหม"
BEL_re_build_the_fleet_desc: "กาวแรกในการฟนฟูกําลังทางนาวีคือการสรางกองทัพเรือใหมจริง ๆ ซึ่งตองลงทุนอยางมากในอูตอเรือใหมและขีดความสามารถในการตอเรือ"

BEL_allied_donations: "การบริจาคจากพันธมิตร"
BEL_allied_donations_desc: "สถานการณที่ทําใหเราตองเพิ่มกําลังทางทะเลเรงดวนขึ้นเรื่อย ๆ ดังนั้นเราควรติดตอพันธมิตรและดูวาพวกเขาสามารถชวยเหลือเราในการพัฒนาขีดความสามารถทางนาวีขึ้นใหมไดหรือไม"

BEL_port_of_antwerp: "ทาเรือแอนตเวิรป"
BEL_port_of_antwerp_desc: "แอนตเวิรปเปนเมืองที่มีชื่อเสียงจากอดีตดานการพาณิชย และทาเรือแหงนี้ยังคงมีความสําคัญมาจนถึงทุกวันนี้ มาใชชื่อเสียงนี้เพื่อสรางขอตกลงทางการคาที่เปนประโยชนกันเถอะ"

BEL_corvette_fleet: "กองเรือคอรเวต"
BEL_corvette_fleet_desc: "การตอเรือใชเวลานาน โดยเฉพาะเรือหลักขนาดใหญ ดวยความจําเปนเรงดวนในการขยายกองทัพเรือ เราจึงควรมุงเนนเรือขนาดเล็กที่ผลิตงายแทน โดยเชี่ยวชาญในสิ่งที่เราตองการมากที่สุด นั่นคือการปกปองผลประโยชนทางการคาของเรา"

BEL_boelwerf: "Boelwerf"
BEL_boelwerf_desc: "Boelwerf เปนหนึ่งในอูตอเรือที่ใหญที่สุดในแอนตเวิรป เราควรใชขีดความสามารถของพวกเขาและลงทุนมากขึ้นในการขยายอู เพื่อใหเสริมกําลังทางนาวีไดงายขึ้น"

BEL_cockerill_shipyards: "อูตอเรือ Cockerill"
BEL_cockerill_shipyards_desc: "อูตอเรือ Cockerill บริษัทในเครือของกลุมบริษัท Cockerill คือรูปแบบความเชื่อมโยงทางอุตสาหกรรมที่เราควรตอยอดอยางแทจริง เรือรบในยุคนี้สรางจากเหล็กกลา และไมมีใครทํางานเหล็กไดดีกวา Cockerill"

BEL_antwerp_maritime_academy: "วิทยาลัยการเดินเรือแอนตเวิรป"
BEL_antwerp_maritime_academy_desc: "แมจะมุงเนนการเดินเรือพลเรือนและพาณิชยมากกวา แตเรายังใชความเชี่ยวชาญของครูที่นี่ในการฝกและพัฒนากําลังทางทะเลได พวกเขาจะมีประโยชนอยางยิ่งในการสอนนายทหารของเราวาจะทํางานรวมกับเรือพาณิชยที่ทําใหการคาของเราไหลเวียนไดอยางไรใหดีที่สุด"

BEL_naval_doctrine: "หลักนิยมทางนาวี"
BEL_naval_doctrine_desc: "ครูฝกพลเรือนของเราสอนเราไดเพียงเทานั้น หากตองการขยายความเขาใจดานกิจการทางทะเลอยางแทจริง เราตองวาจางผูมีความสามารถจากตางชาติ เพื่อเสริมความรูและความสามารถในการฝกของเรา"

BEL_convoy_protection_duties: "เรือพาณิชยติดอาวุธปองกันตนเอง"
BEL_convoy_protection_duties_desc: "ในยามอันตรายและจําเปนอยางยิ่ง การติดอาวุธใหเรือพาณิชยเปนสิ่งที่ยอมรับได โดยติดตั้งปนและหนวยนาวิกเพื่อใหปกปองตนเองได ดวยวิธีนี้ ผูที่ลาเรือพาณิชยของเราจะพบวาเหยื่อมีเขี้ยวเล็บขึ้นมาอยางกะทันหัน"

BEL_maritime_phoenix: "ฟนิกซแหงทองทะเล"
BEL_maritime_phoenix_desc: "จากความวางเปลา กองเรือของเราไดเบงบาน อูตอเรือสวางไสวดวยไฟแหงอุตสาหกรรม ขณะที่เรือลําใหมออกจากลานตอเรือในอัตราที่เพิ่มขึ้นเรื่อย ๆ และผลประโยชนทางยุทธศาสตรในตางแดนก็ไดรับการดูแลโดยกองเรือที่ชักธงนาวี[ROOT.GetAdjective]"

