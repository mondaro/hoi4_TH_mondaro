 GER_establish_the_reichswerke_desc: "$GER_hermann_goring_werke_desc$" #old loc
 GER_unlock_reichswerke_tt: "ปลดล็อกกลุมบริษัทอุตสาหกรรม §Y$GER_reichswerke$§!"
 GER_seize_foreign_industries: "ยึดอุตสาหกรรมตางชาติ"
 GER_seize_foreign_industries_desc: "ดวยการผนวกอุตสาหกรรมตางชาติเขากับเศรษฐกิจของเรา เราจะไดทรัพยากรสําคัญที่หนุนความพยายามในสงครามและการผลิตของเรา"
 GER_coal_liquefaction: "การแปรถานหินเปนของเหลว"
 GER_coal_liquefaction_desc: "$GER_coal_liquidization_desc$" #old loc
 GER_subsidize_hoesch_benzin: "อุดหนุน Hoesch-Benzin"
 GER_subsidize_hoesch_benzin_desc: "เคยมีคํากลาววากองทัพเดินดวยทอง แตกองทัพสมัยใหมวิ่งดวยเชื้อเพลิง เพื่อรักษาขีดความสามารถทางทหาร เราตองเรงความพยายามในการผลิตเชื้อเพลิงสังเคราะห"
 GER_establish_buna_werke: "กอตั้ง Buna-Werke"
 GER_establish_buna_werke_desc: "การเปลี่ยนเปนยานยนตและการบินในวงกวางตองใชยางจํานวนมาก ซึ่งในแผนดินเยอรมนีเองไมมีแหลงยางเลย เพื่อลดการพึ่งพาการคากับตางชาติ เราตองสรางโรงงานผลิตยางสังเคราะห"
 GER_autarky_achieved: "บรรลุการพึ่งพาตนเอง"
 GER_autarky_achieved_desc: "ในที่สุดเราก็บรรลุเปาหมายอันทะเยอทะยานในการพึ่งพาตนเองไดอยางสมบูรณ! ชาติของเราอุดมสมบูรณดวยทรัพยากรธรรมชาติ ซึ่งจะยิ่งทําใหเราแข็งแกรงขึ้น จนไมมีผูใดหยุดยั้งเราได!"
 GER_improve_autarkic_economy_tt: "ปรับปรุง §Y$autarkic_economy$§!"
 GER_accelerate_the_rearmament_program: "เรงโครงการเสริมสรางกําลังทหาร" 
 GER_accelerate_the_rearmament_program_desc: "เราตองทลายพันธนาการแหงสนธิสัญญาแวรซาย และใหทั่งแหงอุตสาหกรรมหลอมโชคชะตาอันรุงโรจนให[ROOT.GetNameDef] รถถังทุกคันที่ผลิต เครื่องบินทุกลําที่ประกอบ จะเปนประจักษพยานแหงเจตจํานงอันไมยอมงอของชาวเยอรมัน"
 GER_concentrated_armament_program: "โครงการสะสมอาวุธแบบเขมขน"
 GER_concentrated_armament_program_desc: "อุตสาหกรรมของเราตองรองรับความตองการทางทหารเพื่อติดอาวุธใหชาติอีกครั้ง ตองเปดโครงการเสริมสรางกําลังทหารอยางครอบคลุมเพื่อปรับปรุงกองทัพใหทันสมัยและขยายกําลังอยางรวดเร็ว!"
 GER_establish_production_targets: "กําหนดเปาหมายการผลิต"
 GER_establish_production_targets_desc: "กอนที่เราจะเปดฉากการทัพใด ๆ เราตองปรับปรุงกองทัพใหทันสมัยและติดอาวุธใหพรอมเสียกอน เพื่อเรงผลผลิต เราตองกําหนดโควตาและเปาหมายการผลิตที่ทะเยอทะยาน"
 GER_prioritize_the_army: "ใหความสําคัญกับกองทัพบก"
 GER_prioritize_the_army_desc: "เยอรมนี และปรัสเซียกอนหนานั้น เปนมหาอํานาจทางบกมาโดยตลอด และพึ่งพากองทัพบกในการปกปองอธิปไตยและความมั่นคง เราตองเบนความพยายามทางอุตสาหกรรมเพื่อใหกองทัพบกมียุทโธปกรณพรอมและสามารถปราบศัตรูใด ๆ ได"
 GER_prioritize_the_navy: "ใหความสําคัญกับกองทัพเรือ"
 GER_prioritize_the_navy_desc: "การควบคุมทองทะเลจะสําคัญยิ่งหากเราตองการแผอํานาจไปไกลกวาพรมแดนปจจุบัน เราตองใหความสําคัญกับกองทัพเรือ เพื่อใหทัดเทียมกองเรือศัตรูใด ๆ ทั้งในดานขนาดและแสนยานุภาพ"
 GER_extra_funds_to_waffenamt: "เพิ่มงบประมาณให Waffenamt"
 GER_extra_funds_to_waffenamt_desc: "Waffenamt หรือกรมสรรพาวุธ กํากับดูแลการออกแบบและพัฒนายุทโธปกรณทางทหาร โดยรวมมือกับผูผลิตอาวุธและสถาบันวิจัย การเพิ่มงบประมาณใหอาจชวยเรงความกาวหนาได"
 GER_zentrale_planung: "จัดตั้ง Zentrale Planung"
 GER_zentrale_planung_desc: "สงครามไดเปดโปงขอบกพรองในความพยายามดานอาวุธยุทโธปกรณของเรา ขอบกพรองที่เราตองแกไข! ดวยการจัดตั้งคณะกรรมการวางแผนกลางที่มีสมาชิกจากรัฐบาล ภาคอุตสาหกรรม และกองทัพ เราจะประสานนโยบายเศรษฐกิจและจัดสรรทรัพยากรไดอยางมีประสิทธิภาพ เพื่อหนุนการผลิตอาวุธ และสนับสนุนเปาหมายแหงชาติและความเปนเลิศทางทหารของเรา"
 GER_criteria_for_economy_laws_tt: "หากใช §Y$partial_economic_mobilisation$§! อยู กฎหมายเศรษฐกิจจะเปลี่ยนเปน §Y$war_economy$§! หากใชได"
 GER_create_rustungsstab: "จัดตั้ง Rüstungsstab"
 GER_create_rustungsstab_desc: "ความพยายามปรับปรุงการผลิตอาวุธใหคลองตัวประสบความสําเร็จ แตยังตองพัฒนาตอไป! การจัดตั้งคณะเสนาธิการสรรพาวุธจะชวยใหเราวางกลยุทธจัดสรรทรัพยากรและจัดลําดับความสําคัญของโครงการเพื่อเพิ่มการผลิตอาวุธ"
 GER_armament_rationalization: "การปรับระบบการผลิตอาวุธ"
 GER_armament_rationalization_desc: "สายการผลิตของเราแทบตามความตองการของกองทัพไมทัน เราตองใชมาตรการปรับระบบการผลิตอาวุธเพื่อเพิ่มประสิทธิภาพและประสิทธิผลของจักรกลสงครามทางอุตสาหกรรม"
 GER_totaler_krieg: "สงครามเบ็ดเสร็จ (Totaler Krieg)"
 GER_totaler_krieg_desc: "เพื่อชัยชนะเบ็ดเสร็จ เราตองระดมสังคมทั้งหมด และนําสงครามเบ็ดเสร็จไปถึงหนาประตูบานศัตรู ถึงเวลาที่[ROOT.GetNameDef]จะลุกขึ้น และปลอยใหพายุโหมกระหนํ่า!"
 GER_gain_totaler_krieg_remove_total_mob_tt: "§Rลบ§! §Y$tot_economic_mobilisation$§! ไดรับ §Y$totaler_krieg_economy$§!"
 #ARMY
 GER_develop_modern_maneuver_warfare: "พัฒนาสงครามดําเนินกลยุทธสมัยใหม"
 GER_develop_modern_maneuver_warfare_desc: "เราตองตระหนักถึงธรรมชาติที่เปลี่ยนแปลงไปของสงครามสมัยใหม และพัฒนาหลักนิยมใหมที่เนนการผสานทหารราบเขากับเทคโนโลยีใหม เพื่อเพิ่มประสิทธิภาพทางทหารในสนามรบใหสูงสุด"
 GER_fortify_the_vaterland: "เสริมปอมปราการแหงมาตุภูมิ"
 GER_fortify_the_vaterland_desc: "เพื่อความมั่นคงของ[GER.GetNameDef] เราตองสรางปอมปราการในทุกที่ที่จําเปน การเสริมแนวปองกันจะทําใหเรารักษาพรมแดนไดดวยกําลังพลที่นอยลง และปลดกองพลไปรวมการรุกในที่อื่นได"
 GER_fortify_the_vaterland_unlock_decision_tt: "ปลดล็อกการตัดสินใจ: §Y$GER_fortify_the_vaterland_cat$§!"
 GER_all_terrain_military_motorcycle: "รถจักรยานยนตทหารทุกภูมิประเทศ"
 GER_all_terrain_military_motorcycle_desc: "ความสําคัญของการลาดตระเวนอยางรวดเร็วนั้นไมอาจประเมินสูงเกินไปได การลงทุนในหนวยรถจักรยานยนตจะใหขาวกรองสนามรบที่สําคัญ ชวยการตัดสินใจเชิงยุทธศาสตร และเพิ่มประสิทธิภาพการปฏิบัติการ"
 GER_salvage_captured_equipment: "กูยุทโธปกรณที่ยึดได"
 GER_salvage_captured_equipment_desc: "ดวยการตั้งศูนยกูและดัดแปลงยุทโธปกรณของศัตรูที่ยึดไดมาใชในกองทัพ เราสามารถซอมแซมและนําอาวุธ ยานพาหนะ และเครื่องจักรที่ยึดไดมาเสริมกําลังกองทัพของเรา"
 GER_salvage_captured_equipment_custom_tt: "นายพล[ROOT.GetAdjective]สองคนที่ถูกสุมเลือกจะไดรับคุณลักษณะ§Yนักเก็บกู§!"
 GER_unlock_operational_planning_blitzkrieg_tt: "ปลดล็อกการตัดสินใจ: §Y$GER_operational_planning_category$§! ซึ่งเมื่อเปดใชจะใหผลเปนเวลา§Y 45 วัน§!:"
 GER_unlock_operational_planning_bewegungskrieg_tt: "ปลดล็อกการตัดสินใจ: §Y$GER_operational_planning_category$§! ซึ่งเมื่อเปดใชจะใหผลเปนเวลา§Y 90 วัน§!:"
 GER_the_prussian_legacy: "มรดกแหงปรัสเซีย"
 GER_the_prussian_legacy_desc: "'ในขณะที่บางรัฐมีกองทัพ กองทัพปรัสเซียกลับมีรัฐ' วอลแตรเคยกลาวไว เราจะทําใหคํากลาวนี้เปนจริงดวยการพัฒนาหลักนิยมเยอรมันดั้งเดิมอยาง Bewegungskrieg หรือสงครามดําเนินกลยุทธ เพื่อชัยชนะอันรวดเร็วและทวมทนในสนามรบ"
 GER_improve_motorized_troops: "ปรับปรุงกองทหารยานยนต"
 GER_improve_motorized_troops_desc: "สงครามสมัยใหมหมุนรอบความเร็วและขีดความสามารถในการรุกอยางรวดเร็ว เราตองทําให Schnelltruppen หรือหนวยยานยนตของเรา พรอมและสามารถนําการบุกเพื่อชัยชนะที่รวดเร็วและเด็ดขาด"
 GER_lessons_of_the_great_war: "บทเรียนจากมหาสงคราม"
 GER_lessons_of_the_great_war_desc: "ความลมเหลวของเราในมหาสงครามใหขอคิดอันลํ้าคาที่สําคัญยิ่งตอความขัดแยงในอนาคต เราไดศึกษาอดีตอยางละเอียด และบัดนี้เราตองนําบทเรียนที่ประวัติศาสตรสอนมาปฏิบัติ"
 GER_stormtroopers: "หนวยจูโจม"
 GER_stormtroopers_desc: "Stosstruppen ในมหาสงครามคือหนวยจูโจมชั้นยอดที่นําการโจมตีสนามเพลาะศัตรูและสรางการเจาะแนวใหทหารราบหลักฉวยโอกาส เราควรฟนแนวคิดนี้และฝกหนวยจูโจมชั้นยอดชุดใหม ที่จะเปนตัวแทนแหงความเร็ว ความคลองแคลว และประสิทธิภาพอันเหี้ยมโหดในสนามรบ"
 GER_sturmtruppe_battalion_tt: "ปลดล็อกกองพันสนับสนุน §Y$sturmtruppe_battalion$§!"
 GER_artillery_bombardment: "การระดมยิงปนใหญ"
 GER_artillery_bombardment_desc: "ทหารราบคือกระดูกสันหลังของกองทัพ และเพื่อใหพวกเขาโดดเดน พวกเขาตองไดรับการสนับสนุนที่เหมาะสม เราตองลงทุนอยางหนักในปนใหญ เพื่อใหทหารราบรุกคืบในทุกโอกาสและพิชิตศัตรูใด ๆ ที่ขวางหนา"
 GER_instill_auftragstaktik: "ปลูกฝง Auftragstaktik"
 GER_instill_auftragstaktik_desc: "กองทัพของเราใช auftragstaktik หรือการบังคับบัญชาตามภารกิจมานาน ซึ่งเนนการบังคับบัญชาแบบกระจายอํานาจและความริเริ่มของแตละบุคคล สิ่งนี้นํามาซึ่งความยืดหยุนและความเปนอิสระ ชวยใหเราปรับตัวและประสบความสําเร็จในสถานการณที่ไมคาดคิด จึงสําคัญยิ่งที่เราจะรักษาแนวปฏิบัตินี้ไวเพื่อใหกองทัพมีชัยตลอดไป!"
 GER_establish_the_afrikakorps: "กอตั้งกองทัพนอยแอฟริกา (Afrikakorps)"
 GER_establish_the_afrikakorps_desc: "เพื่อตัดเสนทางเสบียงของศัตรู และยึดทรัพยากรสําคัญกับจุดยุทธศาสตร เราตองนําสงครามออกจากยุโรปไปสูดินแดนโพนทะเล!"
 GER_unlock_operational_planning_in_africa_tt: "ปลดล็อกการตัดสินใจ: §Yการวางแผนปฏิบัติการในแอฟริกา§!"
 GER_revive_the_schutztruppe: "ฟนฟู Schutztruppe"
 GER_revive_the_schutztruppe_desc: "Schutztruppen คือกองทหารอาณานิคมที่เราใชในดินแดนแอฟริกาของจักรวรรดิอาณานิคม พวกเขารับใชเราไดดีในการทัพแอฟริกาตะวันออกชวงมหาสงคราม รวมถึงความขัดแยงขนาดเล็กกอนหนานั้น เมื่อสายตาของเราหันไปยังแอฟริกาและเอเชียอีกครั้ง อาจถึงเวลาที่จะฟนฟูสํานักงานอาณานิคมและพิจารณาจัดตั้งกองทหาร Schutztruppe ชุดใหมที่ดีกวาเดิม"
 GER_revive_the_schutztruppe_tt: "ปลดล็อกกองกําลังอาสาอาณานิคม §YSchutztruppe§! และการตัดสินใจเพื่อ§Yเกณฑ§!และ§Yปรับปรุง§!พวกเขา"
 GER_establish_the_skijager: "กอตั้ง Skijäger"
 GER_establish_the_skijager_desc: "เพื่อใหกองทัพของเรายังคงประสิทธิภาพและความสามารถในการปรับตัวไดในทุกสภาพอากาศ เราตองเชี่ยวชาญศิลปะแหงสงครามฤดูหนาว ดวยเหตุนี้ เราจะฝกและติดอาวุธใหทหารภูเขาเฉพาะทาง ที่เรียกวา Skijäger เพื่อปฏิบัติการอยางมีประสิทธิภาพในภูมิประเทศหิมะและภูเขา"
 GER_panzergrenadier: "ทหารราบยานเกราะ (Panzergrenadier)"
 GER_panzergrenadier_desc: "หลักนิยมทางทหารของเราตั้งอยูบนความคลองตัว และจะขึ้นอยูกับวากองทหารยานยนตของเราทํางานไดดีเพียงใด ทั้งกองพลทหารราบและกองพลยานเกราะจะรุกคืบไมสําเร็จหากขาดการสนับสนุนที่เหมาะสม การผสานทหารราบยานเกราะลําเลียงพลเขากับหัวหอกการรุก จะทําใหกองกําลังของเรารักษาความเหนือกวาในปฏิบัติการรุกไวได"
 GER_modify_bewegungskrieg_or_blitzkrieg_tt: "ปรับ §Y$GER_blitzkrieg_modifier$§! หรือ §Y$GER_bewegungskrieg_modifier$§! ดังนี้:"
 GER_heavy_armored_car_recon_company_tt: "\n§Y$armored_car_recon$§!:\n§Yยานเกราะ§!: §G+5%§!\n§Yปา§!:\n ผลตอการเคลื่อนที่: §G+5%§!\n§Yทะเลทราย§!:\n  ผลตอการเคลื่อนที่: §G+10%§!\n§Yที่ราบ§!:\n ผลตอการเคลื่อนที่: §G+10%§!\n"
 GER_nationalize_ford_factories: "โอนโรงงานฟอรดเปนของรัฐ"
 GER_nationalize_ford_factories_desc: "การยึดโรงงานของฟอรดใน[51.GetName]มาอยูใตการควบคุมของรัฐจะเสริมกําลังการผลิตทางอุตสาหกรรมของเรา และรับประกันการจัดหายุทโธปกรณและยานพาหนะสําคัญอยางตอเนื่อง เพื่อสนับสนุนกองทัพและการสงกําลังบํารุง"
 GER_kriegslokomotiven: "หัวรถจักรสงคราม (Kriegslokomotiven)"
 GER_kriegslokomotiven_desc: "ความทาทายดานการสงกําลังบํารุงในสงครามทําใหจําเปนตองผลิต kriegslokomotiven หรือหัวรถจักรสงคราม รถไฟเหลานี้จะออกแบบใหเหมาะกับสภาพเศรษฐกิจของเรา และความตองการผลิตจํานวนมากอยางรวดเร็วดวยตนทุนตํ่า"
 GER_improve_the_logistics_system: "ปรับปรุงระบบการสงกําลังบํารุง"
 GER_improve_the_logistics_system_desc: "นายพลหลายคนในกองบัญชาการสูงสุดมีทัศนคติดูแคลนการสงกําลังบํารุงและหวงโซเสบียง เพราะขาดความเขาใจในปญหาของระบบปจจุบัน พวกเขาตองตระหนักถึงความสําคัญสูงสุดของการสงกําลังบํารุงที่มีประสิทธิภาพในสงครามสมัยใหม ขณะที่เราเริ่มโครงการครอบคลุมเพื่อยกระดับระบบการสงกําลังบํารุง"
 GER_defend_the_vaterland: "ปกปองมาตุภูมิ"
 GER_defend_the_vaterland_desc: "เมื่อภัยคุกคามประชิดพรมแดน เราตองยืนหยัดปกปองมาตุภูมิ! เพื่อพิทักษชาวเยอรมัน เราตองเสริมที่มั่นและรวมพลทหาร [ROOT.GetNameDef]จะอดทนและไดรับชัยชนะ!"
 GER_uranverein: "สโมสรยูเรเนียม (Uranverein)"
 GER_uranverein_desc: "ชาติของเราตองบุกเบิกการวิจัยพลังงานปรมาณูและนําศักยภาพของมันมาใชเพื่อตัวเราเอง เรามีมันสมองที่เฉียบคมที่สุดบางสวนในโลกที่จะทําสิ่งนี้ และกลายเปนผูทําลายลางโลก"
 GER_adopt_new_panzer_doctrine: "ใชหลักนิยมยานเกราะใหม"
 GER_adopt_new_panzer_doctrine_desc: "$GER_army_innovation_desc$" #old loc
 GER_panzer_troops_school: "โรงเรียนกองทหารยานเกราะ"
 GER_panzer_troops_school_desc: "กองพลยานเกราะจะมีบทบาทสําคัญยิ่งในความขัดแยงสมัยใหมใด ๆ และเราตองทําใหกองกําลังยานเกราะของเราอยูแถวหนาของนวัตกรรมทางทหาร ดวยการฝกที่เขมงวดและครูฝกผูเชี่ยวชาญ เราจะสรางหนวยยานเกราะชั้นยอดที่จําเปนตอชัยชนะ"
 GER_advanced_panzer_research: "การวิจัยยานเกราะขั้นสูง"
 GER_advanced_panzer_research_desc: "การจัดสรรทรัพยากรเพื่อวิจัยและพัฒนาเทคโนโลยีรถถังลํ้าสมัยจะใหความรูใหมและผลลัพธที่กาวกระโดด ซึ่งจะยกระดับขีดความสามารถในการรบ ทําใหยานเกราะของเรารายกาจยิ่งขึ้น"
 GER_expand_kummersdorfs_capacity: "ขยายขีดความสามารถของคุมเมอรสดอรฟ"
 GER_expand_kummersdorfs_capacity_desc: "เราตองเปนผูนําในการพัฒนายานเกราะและเปนหัวหอกแหงนวัตกรรม เพื่อรักษาความเหนือกวาในสนามรบ ดวยการศึกษาแบบรถถังของศัตรูที่ศูนยในคุมเมอรสดอรฟ และใชเทคโนโลยีลํ้าสมัย เราจะบุกเบิกความกาวหนาที่เหนือกวาคูแขงทั้งหมด"
 GER_combined_arms: "เหลาผสม"
 GER_combined_arms_desc: "ความกาวหนาอยางรวดเร็วของเทคโนโลยีไดเปลี่ยนวิธีการทําสงคราม ซึ่งเปนสิ่งที่เราควรใชประโยชน ดวยการยึดหลักเหลาผสมและวางยุทธศาสตรที่ครอบคลุมเพื่อประสานทหารราบ ยานเกราะ และการสนับสนุนทางอากาศ เราจะสรางกองกําลังรบที่นาเกรงขามและรับประกันความเหนือกวาของพวกเขา"
 #LUFTWAFFE
 GER_expanding_the_luftwaffe: "ขยายลุฟทวัฟเฟอ"
 GER_expanding_the_luftwaffe_desc: "$air_innovation_desc$" #old loc
 GER_aeronautical_research_institute: "สถาบันวิจัยการบิน"
 GER_aeronautical_research_institute_desc: "สงครามทางอากาศมีความสําคัญและซับซอนขึ้นนับตั้งแตมหาสงคราม และเนื่องจากสนธิสัญญาแวรซายหามเรามีกองทัพอากาศ เราจึงลาหลังในการพัฒนาอากาศยาน เพื่อแกไขเรื่องนี้ เราตองสราง Luftfahrtforschungsanstalt หรือสถาบันวิจัยการบิน เพื่อพัฒนาโครงสรางอากาศยาน เครื่องยนต และอาวุธแบบใหม เพื่อครองความเหนือกวาทางอากาศ"
 GER_dive_bombers: "เครื่องบินทิ้งระเบิดแบบดิ่ง"
 GER_dive_bombers_desc: "$GER_tactical_air_effort_desc$" #old loc
 GER_tactical_bombers: "เครื่องบินทิ้งระเบิดทางยุทธวิธี"
 GER_tactical_bombers_desc: "$GER_strategic_air_effort_desc$ การทําลายโรงงานทุกแหงนอกพรมแดนของเราใหราบเปนหนากลอง จะรับประกันวามีเพียงเราเทานั้นที่มีกองทัพที่มีประสิทธิภาพ" #Old and new loc
 GER_uralbomber_program: "โครงการเครื่องบินทิ้งระเบิดอูรัล"
 GER_uralbomber_program_desc: "ชัยชนะจะเกิดขึ้นเมื่อเราไปถึงศัตรูไดไมวาพวกมันจะอยูที่ใด การพัฒนาอากาศยานที่บินไปถึงเทือกเขาอูรัลไดจะทําใหศัตรูแทบทุกรายอยูในระยะของเรา" 
 GER_aerodynamic_research_institute: "สถาบันวิจัยอากาศพลศาสตร"
 GER_aerodynamic_research_institute_desc: "[ROOT.GetNameDefCap]เพิ่งกลายเปนชื่อที่เปนตัวแทนของนวัตกรรมการบิน เนื่องจากเราลงทุนอยางหนักในกองทัพอากาศ เราตองทุมทรัพยากรในดานนี้ตอไปเพื่อนําหนาคูแขง การใหทุนแกสถาบันวิจัยอากาศพลศาสตรและการพัฒนาเทคนิคขับเคลื่อนแบบใหม จะใหนวัตกรรมใหมในการไลตามเปาหมายสูการเปนเจาแหงทองฟาอยางแนนอน"
 GER_aerodynamic_research_institute_tt: "ปลดล็อกคุณลักษณะ MIO §Y$GER_mio_trait_aerodynamic_research_insitute$§! สําหรับ§Yผูออกแบบเครื่องบิน§!ทั้งหมด §Rแตสามารถใชไดกับเพียงรายเดียวเทานั้น§!"
 GER_fallschirmjager: "พลรม (Fallschirmjäger)"
 GER_fallschirmjager_desc: "เราไมไดมองขามความสําคัญทางยุทธศาสตรของกองทหารสงทางอากาศ หรือ Fallschirmjäger การฝกพลรมชั้นยอดเหลานี้ใหสงกําลังหลังแนวขาศึกไดอยางรวดเร็ว จะเพิ่มความอเนกประสงคและความสามารถในการรบของพวกเขา และหนุนขีดความสามารถในการรุกโดยรวมของเรา"
 GER_unlocks_eben_emael_raid_tt: "ปลดล็อก§Yการจูโจมดวยพลรม§!ที่§Yเอเบิน-เอมาเอล§!"
 GER_form_the_jagdwaffe: "จัดตั้ง Jagdwaffe"
 GER_form_the_jagdwaffe_desc: "เราควรจัดตั้ง Jagdwaffe กองกําลังเครื่องบินขับไลโดยเฉพาะ เพื่อครองความเหนือกวาทางอากาศ ดวยการผสานการฝกที่เขมงวด ยุทธวิธีขั้นสูง และเทคโนโลยีลํ้าสมัย เราจะครองทองฟา และเปดทางใหกําลังภาคพื้นดินรุกผานสนามรบ สั่นสะเทือนผืนดินดั่งฟาคําราม"
 GER_reorganize_the_luftwaffe: "ปรับโครงสรางลุฟทวัฟเฟอ"
 GER_reorganize_the_luftwaffe_desc: "แมกองทัพอากาศของเราเพิ่งกอตั้งไดไมกี่ป แตก็กลายเปนเครื่องมือแหงอํานาจของชาติที่นาเกรงขาม อยางไรก็ตาม การกอตั้งอยางเรงรีบและการขยายตัวอยางรวดเร็วไดทิ้งขอบกพรองเชิงโครงสรางไวหลายจุด การกระจายความรับผิดชอบมากขึ้น และลดการแขงขันกับการแยงชิงอํานาจภายใน จะชวยใหกองทัพอากาศมีประสิทธิภาพและประสิทธิผลในการปฏิบัติการมากขึ้น"
 GER_solve_the_logistical_bottlenecks: "แกปญหาคอขวดดานการสงกําลังบํารุง"
 GER_solve_the_logistical_bottlenecks_desc: "เมื่อปรับโครงสรางกองทัพอากาศเสร็จแลว เราสามารถหันมาจัดการระบบการสงกําลังบํารุงและหวงโซเสบียงที่ไรประสิทธิภาพ การแกปญหาเหลานี้จะปลดคนไปทํางานอื่นไดมากขึ้น และชวยใหซอมอากาศยานไดเร็วขึ้น"
 GER_experimental_rotorcrafts: "อากาศยานปกหมุนทดลอง"
 GER_experimental_rotorcrafts_desc: "ดวยการลงทุนในแบบลํ้าสมัยและพัฒนาเทคโนโลยีใหม เรามุงพัฒนาตนแบบรุนแรกที่จะปฏิวัติความคลองตัวทางอากาศในสนามรบ เราปรารถนาจะพลิกโฉมขีดความสามารถในการขึ้นลงทางดิ่งอยางมีประสิทธิภาพดวยสิ่งที่เรียกวาเฮลิคอปเตอร"
 GER_develop_the_knickebein: "พัฒนาระบบคนิคเคอไบน"
 GER_develop_the_knickebein_desc: "ดวยระบบนําทางวิทยุอันซับซอน เราไดพบวิธีนําทางอากาศยานใหทิ้งระเบิดไดแมนยํายิ่งขึ้น ดวยเทคโนโลยีใหมนี้ เราอาจทําลายโรงงานของศัตรูใหราบเปนหนากลองไดอยางมีประสิทธิภาพยิ่งขึ้น แมแตในเวลากลางคืน"
 GER_defense_of_the_reich: "ปกปอง[GetDefenseofGermanyName]"
 GER_defense_of_the_reich_fascism: "ไรช"
 GER_defense_of_the_reich_neutral: "จักรวรรดิ"
 GER_defense_of_the_reich_democratic: "[GER.GetName]"
 GER_defense_of_the_reich_communism: "การปฏิวัติของชนชั้นกรรมาชีพ"
 GER_defense_of_the_reich_desc: "เราตองพิทักษมาตุภูมิจากการโจมตีทางอากาศของศัตรู การยึดครองนานฟาเหนือ[ROOT.GetNameDef]และปกปองอุตสาหกรรมบนภาคพื้นดินตองมากอนสิ่งอื่นใด!"
 GER_construct_the_kammhuber_line: "สรางแนวคัมฮูเบอร"
 GER_construct_the_kammhuber_line_desc: "เราไมอาจปลอยใหเครื่องบินทิ้งระเบิดและเครื่องบินขับไลของศัตรูทองไปอยางเสรีในนานฟาเหนือ[ROOT.GetNameDef]ได เราตองสรางแนวปองกันตามชายฝงฝรั่งเศสเพื่อสกัดกั้นพวกมันกอนถึงใจกลางดินแดนของเรา"
 GER_controls_atlantic_coast_brittany_finnmark_tt: "§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมรัฐที่ไมใชของเยอรมนีตาม§Yชายฝงแอตแลนติก§!ตั้งแต§Y[14.GetName]§!ถึง§Y[925.GetName]§!ไดทั้งหมด"
 GER_controls_atlantic_coast_brittany_finnmark_effects_tt: "ทุกรัฐที่ควบคุมตาม§Yชายฝงแอตแลนติกของยุโรป§!: เพิ่ม §Y$anti_air_building$§! §G1§! ผลปจจุบัน:"
 GER_establish_night_fighter_squadrons: "จัดตั้งฝูงบินขับไลกลางคืน"
 GER_establish_night_fighter_squadrons_desc: "ในขั้นตอไปของการปกปองมาตุภูมิ เราควรจัดตั้ง Nachtjagdgeschwader หรือฝูงบินขับไลกลางคืน การใชเรดารอากาศจะทําใหพวกเขามีประสิทธิภาพทั้งกลางวันและกลางคืน ในการรักษาทองฟาของเราใหปลอดจากศัตรู"
 GER_torpedobomber: "เครื่องบินทิ้งตอรปโด"
 GER_torpedobomber_desc: "$naval_air_effort_desc$" #old loc
 GER_establish_carrier_groups: "จัดตั้งกองเรือบรรทุกเครื่องบิน"
 GER_establish_carrier_groups_desc: "ดวยความมุงมั่นที่จะสรางกองเรือบรรทุกเครื่องบินที่ไรคูแขง เราตองฝกนักบินใหปฏิบัติการจากดาดฟาเหลานี้ เครื่องบินของเราจะครองทองฟาทั้งเหนือทะเลและแผนดิน!"
 GER_rocketry_innovations: "นวัตกรรมจรวด"
 GER_rocketry_innovations_desc: "กาวกระโดดครั้งใหญถัดไปในการพัฒนาการบินอยูใกลแคเอื้อม! วิศวกรของเราทํางานไมหยุดหยอนเพื่อพัฒนาระบบขับเคลื่อนดวยจรวดใหสมบูรณ ซึ่งอาจมีผลกระทบและประโยชนใหญหลวงในการไลตามเปาหมายสูการเปนเจาแหงทองฟา"
 GER_amerikabomber: "เครื่องบินทิ้งระเบิดอเมริกา (Amerikabomber)"
 GER_amerikabomber_desc: "เราตองทุมเทเต็มที่ใหกับเปาหมายอันทะเยอทะยานในการเปนเจาแหงทองฟา และสรางอากาศยานพิสัยไกลที่สามารถสรางความตื่นตระหนกใหศัตรูดวยการโจมตีเปาหมายลึกเขาไปในดินแดนของพวกเขา หรือบินขามมหาสมุทรแอตแลนติกเพื่อแสดงใหทุกคนเห็นวาไมมีใครปลอดภัยจากระยะของเรา"
 GER_war_with_american_country_tt: "อยูในภาวะสงครามกับประเทศใน§Yทวีปอเมริกา§!"
