 GER_oppose_hitler_ww: "รวมพลังกองทัพแวรมัคท"
 GER_oppose_hitler_ww_desc: "การปกครองของฮิตเลอรตองสิ้นสุดลง เขาตั้งใจยั่วยุมหาอํานาจตะวันตกดวยการสงทหารกลับเขาไรนลันท แตการกระทํานั้นจะใหขออางที่เราตองการเพื่อยึดอํานาจดวยความชวยเหลือของกลุมผูภักดีในกองทัพแวรมัคท และปลุกระดมชาวเยอรมันใหลุกขึ้นตอตานเขา"
 GER_rally_the_nation: "ปลุกพลังชาติ"
 GER_rally_the_nation_desc: "มีคนจํานวนมากในชาติของเราที่พรอมลุกขึ้นตอตานนาซีเมื่อโอกาสมาถึงแลว เราควรปลุกระดมประชาชน และอาจติดตอกับองคกรกึ่งทหารที่มีประสบการณตอสูกับนาซีมาตั้งแตสมัยสาธารณรัฐไวมาร"
 GER_rally_the_nation_tt: "เราจะสามารถเลือกจิตวิญญาณแหงชาติหนึ่งอยาง ซึ่งจะตองถูก§Yเปลี่ยนแปลง§!หรือ§Rนําออก§!เมื่อสงครามกลางเมืองสิ้นสุดลง"
 GER_denazification_campaigns: "รณรงคกําจัดลัทธินาซี"
 GER_denazification_campaigns_desc: "เพื่อขจัดโรครายนาซีที่กัดกินหัวใจของ[GER.GetNameDef]อยางแทจริง เราตองทุมเทความพยายามอยางมากในการกําจัดลัทธินาซี และจับกุมพวกนาซีหรือผูใหที่ซอนแกพวกเขาทันทีที่พบตัว"
 GER_rebuild_the_nation_ww: "ฟนฟูชาติ"
 GER_rebuild_the_nation_ww_desc: "เราตองทุมเทความพยายามทั้งหมดไปที่การบูรณะอยางรวดเร็ว หากตองการฟนตัวจากการขับไลภัยรายนาซี ระหวางนี้ประชาชนตองอยูอยางประหยัดและทํางานหนัก แตพวกเขายอมยินดีทําเชนนั้นดวยคํามั่นถึงวันพรุงนี้ที่ดีกวา"
 GER_revitalize_the_nation: "ปลุกชีวิตชีวาใหชาติ"
 GER_revitalize_the_nation_desc: "หลังความเสียหายจากสงครามกลางเมือง เราตองมุงฟนฟูชาติของเรา เราจะขอใหประชาชนสละความสะดวกสบายสวนตัวไวชั่วคราว เพื่อใหเราทุมทรัพยากรทั้งหมดไปสูเปาหมายนี้ได"
 GER_rebuild_the_nation_ww_tt: "ปลดล็อกการตัดสินใจ: §Y$GER_public_works_modifier$§!"
 GER_tend_to_the_future_of_germany: "ดูแลอนาคตของเยอรมนี"
 GER_tend_to_the_future_of_germany_desc: "บัดนี้เยอรมนีไดรับการชวยเหลือใหพนจากนาซีแลว เราตองมองไปขางหนาสูขอบฟาใหม และกําหนดทิศทางในอนาคตของชาติเรา เพื่อเอกภาพ  ความยุติธรรม และเสรีภาพ!"
 GER_tend_to_the_future_of_germany_tt: "ความพยายามใดๆ ในการ§Yกอกบฏแบงแยกดินแดน§!จะถูกสกัดไดสําเร็จ"

 #COMMUNISM
 GER_start_the_proletarian_revolution: "เริ่มการปฏิวัติของชนชั้นกรรมาชีพ"
 GER_start_the_proletarian_revolution_desc: "เราเคยหวังวาหลังสงครามกลางเมืองครั้งแรก เสียงของคนงานจะไดรับการรับฟงมากขึ้น แตดูเหมือนจะไมเปนเชนนั้น ชนชั้นกรรมาชีพสมควรไดรับสิ่งที่ดีกวานี้ และการปลอยใหพวกเขาลุกฮือขึ้น อาจทําใหเราสามารถมอบอํานาจใหแกผูที่เขาขางชนชั้นกรรมาชีพไดอยางถาวรในที่สุด"
 GER_start_the_proletarian_revolution_civil_war_tt: "จะนําไปสู§Rสงครามกลางเมือง§!หากภารกิจหมดเวลา!"
 GER_states_with_proletarian_uprising_joins_cw_tt: "รัฐที่มีตัวปรับคา §Y$GER_proletariat_uprising_modifier$§! จะเขารวมฝาย§Yคอมมิวนิสต§!หากเกิดสงครามกลางเมือง"
 GER_the_proletarian_revolution_flag: "การปฏิวัติของชนชั้นกรรมาชีพกําลังดําเนินอยู"
 GER_formalize_the_intelligence_wing: "จัดตั้งฝายขาวกรองอยางเปนทางการ"
 GER_formalize_the_intelligence_wing_desc: "ประเทศตองทนทุกขอยางหนักภายใตผูปกครองที่ไมไดคํานึงถึงผลประโยชนของประชาชน เพื่อใหแนใจวาเราจะฟนฟูชาติได เราตองรูกอนวาเรามีอะไรอยูในมือบาง ฝายขาวกรองที่ใชงานไดจริงจะเปนจุดเริ่มตนที่ดี!"
 GER_propaganda: "โฆษณาชวนเชื่อทั่วประเทศ"
 GER_propaganda_desc: "เราเคยเห็นพลังของการโฆษณาชวนเชื่อมาแลวและปฏิเสธประสิทธิภาพของมันไมได ดวยการจัดสรรทรัพยากรเพื่อเสริมการสนับสนุนผูนําอันรุงโรจนของเรา เราจะทําใหประชาชนอยูในจุดที่เราตองการพอดี"
 GER_form_the_stasi: "จัดตั้งชตาซี"
 GER_form_the_stasi_desc: "ฝายขาวกรองประสบความสําเร็จอยางงดงาม และตอนนี้เราเริ่มพิจารณาความเปนไปไดในการจัดตั้งกระทรวงที่ดูแลความมั่นคงของรัฐ อาจไมใชการตัดสินใจที่ไดรับความนิยมที่สุดในหมูประชาชน แตเปนสิ่งที่จําเปน"
 GER_effective_operations: "ปฏิบัติการที่มีประสิทธิภาพ"
 GER_effective_operations_desc: "เมื่อชตาซีเติบโตขึ้นเรื่อยๆ เราตองขยายขอบเขตการปฏิบัติการของมัน ภารกิจที่ดําเนินการนอกพรมแดน[ROOT.GetAdjective]มีความสําคัญตอความมั่นคงของรัฐเราไมแพภารกิจภายในประเทศ"
 GER_assemble_red_orchestra: "รวบรวมวงออรเคสตราแดง"
 GER_assemble_red_orchestra_desc: "วงออรเคสตราแดงไมเคยเปนกลุมที่เปนปกแผน เปนเพียงกลุมคนจํานวนหนึ่งที่รวมตัวกันรอบบุคคลผูมีไหวพริบไมกี่คน อยางไรก็ตาม สมาชิกบางคนขององคกรที่เรียกกันเชนนี้มีฝมือยิ่งนัก และเราควรพิจารณาเกณฑพวกเขามารวมงาน"
 GER_ressurect_the_red_front_fighters_league: "ฟนคืนสันนิบาตนักรบแนวรวมแดง"
 GER_ressurect_the_red_front_fighters_league_desc: "สันนิบาตนักรบแนวรวมแดงเปนองคกรกึ่งทหารที่สังกัดขบวนการในสมัยสาธารณรัฐไวมาร ภายใตระบอบฟาสซิสต พวกเขาตอสูอยางกลาหาญกับทั้งตํารวจและผูกดขี่อื่นๆ และดวยวิธีการที่ระบอบเกาของเราใชเปนประจํา นักรบแนวรวมแดงจึงถูกสั่งหามเพราะเรื่องนี้ ถึงเวลาแลวที่เราจะนําพวกเขากลับมา!"
 GER_spawn_more_communist_militias_in_civil_war_tt: "หาก§Yสงครามกลางเมือง§!ปะทุขึ้นอีกครั้ง จะสรางหนวย§Yเยอรมัน 2§! หนวยในรัฐดินแดนหลักสามรัฐที่ไดรับผลจาก §Y$GER_proletariat_uprising_modifier$§!"
 GER_ressurect_the_red_front_fighters_league_tt: "จะเกิด§Yหนวยกองกําลังอาสา 2 หนวย§!ใน§Yสามรัฐแบบสุม§!ที่ขณะนี้ไดรับผลจาก §Y$GER_proletariat_uprising_modifier$§! หรือถูกควบคุมโดย§Yฝายคอมมิวนิสต[ROOT.GetAdjective]§!"
 GER_reorganize_nationale_volksarmee: "ปฏิรูปกองทัพประชาชนแหงชาติ"
 GER_reorganize_nationale_volksarmee_desc: "การทุจริตและแนวคิดฟาสซิสตยังฝงรากลึกในกองทัพของเรา เพื่อปองกันความแตกแยกและการกบฏ เราตองกําจัดผูที่ประสงครายตอเราออกไป สิ่งนี้จะทิ้งชองโหวขนาดใหญไวในกองทัพ ดังนั้นเพื่อความปลอดภัยของประชาชน เราตองแตงตั้งนายพลใหมที่ภักดีเพื่อนําทหารผูกลาของเราเขาสูสนามรบหากจําเปน"
 GER_cannot_join_oppossing_civil_war_side_tt: "บุคคลเหลานี้จะไมสามารถเขารวมฝายตรงขามไดหากเกิด§Yสงครามกลางเมือง§!:"
 GER_ensure_army_loyalty: "สรางความภักดีในกองทัพ"
 GER_ensure_army_loyalty_desc: "ยังมีบางคนในกองทัพที่สามารถโนมนาวใหหันมาสนับสนุนอุดมการณของเรา แทนความโงเขลาที่พวกเขาถูกบังคับใหยึดถือ อาจตองใชความพยายามบาง แตดวยการปลูกฝงจิตวิญญาณสวนรวมที่ดีในหมูทหาร เราจะรักษาความภักดีของพวกเขาไวไดอีกหลายป"
 GER_political_commissars: "ผูตรวจการการเมือง"
 GER_political_commissars_desc: "ยังมีบางคนในกองทัพที่สามารถโนมนาวใหหันมาสนับสนุนอุดมการณของเรา แทนความโงเขลาที่พวกเขาถูกบังคับใหยึดถือ เราตองแตงตั้งนายทหารที่มีหนาที่ใหความรูแกพลทหารทั่วไปถึงขอดีของคอมมิวนิสต และจัดระเบียบพวกเขาเพื่อสรางความภักดี"
 GER_rapid_army_expansion: "ขยายกองทัพอยางรวดเร็ว"
 GER_rapid_army_expansion_desc: "หลังการเปลี่ยนแปลงที่จําเปนของเรา กองทัพไมไดเติบโตในอัตราเดียวกับแตกอน เรายังตองการกองทัพขนาดใหญเพื่อปกปองประชาชนในโลกที่เปนปรปกษมากขึ้นทุกที การระดมพลและเรงฝกทหารครั้งใหญนาจะแกปญหานี้ได"
 GER_the_peoples_victory: "ชัยชนะของประชาชน"
 GER_the_peoples_victory_desc: "ประชาชนไดสงเสียงแลว และเสียงของพวกเขาไดรับการรับฟง รัฐบาลเกาที่ฉอฉลของเราแสดงสัญญาณความออนแอ และเราตองฉวยโอกาสนี้เรียกรองใหพวกเขาลาออก แลวยึดอํานาจมาเปนของเราในนามของประชาชน!"
 GER_legacy_of_the_spartacus_league: "มรดกแหงสันนิบาตสปารตาคัส"
 GER_legacy_of_the_spartacus_league_desc: "สันนิบาตสปารตาคัสสิ้นสภาพไปในป 1919 เมื่อมีการกอตั้งพรรคคอมมิวนิสตแหงเยอรมนี แตแนวคิดบางอยางของพวกเขาก็ควรคาแกการนํากลับมา สันนิบาตนี้มีวิสัยทัศนที่จะสรางสาธารณรัฐสังคมนิยมบนพื้นฐานของการเลือกตั้งตามระบอบประชาธิปไตยและเจตจํานงของประชาชน แตก็ยอมรับกลุมปฏิวัติหากจําเปน ถึงเวลาแลวที่เราจะมุงสูเปาหมายนี้อีกครั้ง"
 GER_social_ownership: "กรรมสิทธิ์ของสังคม"
 GER_social_ownership_desc: "เราไดเห็นแลววาจะเกิดอะไรขึ้นเมื่อปลอยใหบริการสําคัญของรัฐดําเนินการโดยผูที่มีเปาหมายไมสอดคลองกับสิ่งที่ดีที่สุดสําหรับประชาชน เพื่อปองกันไมใหเรื่องนี้เกิดขึ้นอีก เราควรโอนอุตสาหกรรมของเราใหเปนกรรมสิทธิ์ของสาธารณะ"
 GER_civil_liberties: "เสรีภาพของพลเมือง"
 GER_civil_liberties_desc: "สหายของเราบางคนมีความเขาใจผิดวา เพื่อใหรัฐทํางานไดอยางมีประสิทธิภาพและมั่นคง จะตองบังคับใหทุกคนปฏิบัติตามแบบแผนเดียวกัน แตนั่นขัดกับเปาหมายของสังคมนิยม มีเพียงการคุมครองเสรีภาพของพลเมืองเทานั้นที่จะทําใหประชาชนภักดีตอรัฐอยางแทจริง"
 GER_embrace_democratic_institutions: "ยอมรับสถาบันประชาธิปไตย"
 GER_embrace_democratic_institutions_desc: "ประชาธิปไตยเสรีนิยมเปนเพียงฉากหนาของชนชั้นกลางนายทุน ประชาธิปไตยที่แทจริงตองอาศัยความเทาเทียมทั้งทางเศรษฐกิจและสังคม ดังนั้นมีเพียงเราเทานั้นที่อยูในฐานะจะนําเจตจํานงของประชาชนเขาสูกระบวนการปกครองประเทศไดอยางเต็มที่"
 GER_establish_volkskommissariats: "จัดตั้งฟอลคสคอมมิสซารีอาท"
 GER_establish_volkskommissariats_desc: "การยึดครองโดยตางชาติเปนสิ่งที่ยอมรับไมได แตเพื่อสถาปนารัฐบาลที่ชอบธรรมซึ่งนําโดยกรรมกรในหมูเพื่อนบานที่เพิ่งไดรับการปลดปลอย เราจะรับภาระอันยากลําบากในการดูแลและนําทางพวกเขาสูอุดมคติสังคมนิยม"
 GER_establish_volkskommissariats_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yจัดตั้งฟอลคสคอมมิสซารีอาท§!ใน§Yรัฐในอารักขาที่เปนเพื่อนบาน§!ทั้งในปจจุบันและอนาคตที่มีอุดมการณเดียวกับเรา"
 GER_industrialize_volkskommissariats: "ทําใหฟอลคสคอมมิสซารีอาทเปนอุตสาหกรรม"
 GER_industrialize_volkskommissariats_desc: "การใชแรงงานอยางไรประสิทธิภาพเพราะขาดอุปกรณ ทําใหอุตสาหกรรมของฟอลคสคอมมิสซารีอาทตามหลังอุตสาหกรรม[ROOT.GetAdjective] เราตองลงทุนในโครงการพัฒนาอุตสาหกรรมเพื่อแกไขความไมสมดุลนี้"
 GER_industrialize_volkskommissariats_tt: "ปลดล็อกการตัดสินใจเพื่อดําเนิน§Yความพยายามพัฒนาอุตสาหกรรม§!ใน§Yฟอลคสคอมมิสซารีอาท§!"
 GER_protect_the_revolution: "ปกปองการปฏิวัติ"
 GER_protect_the_revolution_desc: "แมบางคนจะมองวาการแทรกแซงในตางแดนของเราเปนอุบายเพื่อแสวงหาอิทธิพล แตเรารูวาภารกิจของเราคือการปกปองชนชั้นกรรมาชีพแมอยูนอกพรมแดนของเรา เพื่อการนั้น เราตองมีความสามารถที่จะดําเนินการนอกขอบเขตปกติที่นานาชาติยอมรับ"
 GER_protect_the_revolution_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเรียกรองใหยอมอยูใตอํานาจ§!ตอ§Yประเทศเพื่อนบาน§!ที่เกิดสงครามกลางเมืองจากการกระทําของ[ROOT.GetNameDef]"
 GER_instill_german_discipline: "ปลูกฝงวินัยแบบเยอรมัน"
 GER_instill_german_discipline_desc: "เมื่อมองดูกองทัพของฟอลคสคอมมิสซารีอาทแลว เห็นไดชัดอยางนาเจ็บปวดวาพวกเขาขาดมาตรฐานดานวินัยและประสิทธิภาพแบบ[ROOT.GetAdjective] เราตองใหความรูแกพวกเขาในเรื่องเหลานี้ เพื่อใหพวกเขาปองกันตนจากศัตรูไดดีขึ้น"
 GER_integrate_subjects_economies: "ผนวกรวมเศรษฐกิจของรัฐในอารักขา"
 GER_integrate_subjects_economies_desc: "เศรษฐกิจของฟอลคสคอมมิสซารีอาทกาวหนาไปอยางมากภายใตการดูแลของเรา เพื่อเพิ่มประสิทธิภาพใหสูงสุดยิ่งขึ้น เราจะผนวกรวมอุตสาหกรรมของเราเขาดวยกันเปนกลุมเศรษฐกิจเดียว"
 GER_current_future_volkskommisariats_tt: "§Yฟอลคสคอมมิสซารีอาท§!ทั้งหมดในปจจุบันและอนาคต:"
 GER_integrate_volkskommissariats: "ผนวกรวมฟอลคสคอมมิสซารีอาท"
 GER_integrate_volkskommissariats_desc: "ฟอลคสคอมมิสซารีอาทถูกตั้งขึ้นเพื่อนําทางประชาชนที่ไดรับการปลดปลอยในยุโรปสูสังคมนิยม แตเมื่อเศรษฐกิจและวัฒนธรรมของเราผสานเขาดวยกัน อัตลักษณใหมก็ไดถือกําเนิดขึ้น ซึ่งสนับสนุนการขยายความหมายของการเปนชาว[ROOT.GetAdjective] นับจากนี้ไป เราคือประชาชนเดียวกัน ประเทศเดียวกัน"
 GER_integrate_volkskommissariats_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yผนวกรวมฟอลคสคอมมิสซารีอาท§! เมื่อ §Y[ROOT.GetNameWithFlag]§! ผนวกรวม§Yฟอลคสคอมมิสซารีอาท§!แหงแรก ประเทศจะไดชื่อวา §Y$GER_german_socialist_union_communism$§!"
 GER_expand_social_welfare: "ขยายสวัสดิการสังคม"
 GER_expand_social_welfare_desc: "หลังมหาสงคราม เราเริ่มพัฒนาระบบสวัสดิการเพื่อประโยชนของประชาชน แตระบบนี้ถูกจํากัดลงหลังภาวะเศรษฐกิจตกตํ่าครั้งใหญ เราควรทุมทรัพยากรเพื่อฟนฟูสถาบันนี้ และทําใหมันเปนเครื่องหมายแหงเกียรติของชาวเยอรมันทุกคน เพื่อพิสูจนใหโลกเห็นถึงความเหนือกวาของคอมมิวนิสต"
 GER_liberate_austria: "ปลดปลอยออสเตรีย"
 GER_liberate_austria_desc: "เพื่อนบานทางใตของเราตองอยูในสภาพที่เลวรายมานาน แมพวกเขาจะเรียกอีกประเทศหนึ่งวาบาน แตเรามีความคลายคลึงกันมาก และยังใชภาษาเดียวกันดวย เพื่อประโยชนสูงสุดของชาว[AUS.GetAdjective] เราจะยื่นขอเรียกรอง ไมสิ ขอเสนอใหพวกเขามารวมกับเรา!"
 GER_spark_the_flame_of_revolution: "จุดประกายไฟแหงการปฏิวัติ"
 GER_spark_the_flame_of_revolution_desc: "สถานการณของคนงานในประเทศเพื่อนบานไมไดดีอยางที่เราหวัง ในระยะยาว การปฏิวัติดวยอาวุธในประเทศเหลานี้คงหลีกเลี่ยงไมได แตสําหรับตอนนี้ อยางนอยเราควรพยายามเผยแพรแนวคิดคอมมิวนิสตในประเทศเหลานี้"
 GER_spark_the_flame_of_revolution_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมกระแสคอมมิวนิสต§!ใน§Yประเทศเพื่อนบานขนาดเล็ก§! เมื่อคอมมิวนิสตไดรับการสนับสนุนเสียงขางมากในประเทศที่ถูกแผอิทธิพล จะเกิด§Yสงครามกลางเมือง§!เพื่อเปลี่ยนประเทศนั้นใหเปน§Yคอมมิวนิสต§!"
 GER_proletarian_international_alliance: "สากลกรรมาชีพ"
 GER_support_the_proletarian_uprising: "สนับสนุนการลุกฮือของชนชั้นกรรมาชีพ"
 GER_support_the_proletarian_uprising_desc: "เมื่อเราคาดการณวาสงครามกลางเมืองในบริเวณใกลเคียงจะเพิ่มขึ้นอยางรวดเร็ว เราตองปรับจุดยืนวาจะสนับสนุนคนงานที่ลุกฮืออยางไรใหดีที่สุด คนงานเหลานี้อาจไมพรอมสําหรับภารกิจเชนนี้ และดวยการทําใหแนใจวาอยางนอยพวกเขามีอาวุธพรอม เราจะทําใหคลื่นสีแดงซัดไปทั่วยุโรปสวนของเรา"
 GER_support_the_proletarian_uprising_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อสง§Yยุทโธปกรณทหารราบ§!ไปยังประเทศที่กําลังจมอยูในสงครามกลางเมืองอันเปนผลจากการที่§Y[ROOT.GetAdjective]§!เสริมกระแส§Yคอมมิวนิสต§!"
 GER_the_proletarian_legion: "กองทหารกรรมาชีพ"
 GER_the_proletarian_legion_desc: "เราตองรับผิดชอบตอการลุกฮือที่เราเปนผูจุดชนวน ชนชั้นกรรมาชีพในประเทศที่ถูกสงครามกลางเมืองยํ่ายีเหลานี้ตองการความชวยเหลือจากเราเพื่อยุติระบอบฉอฉลของพวกเขาโดยเร็วที่สุด เราตองพิจารณาสงทหารไปชวยเหลือ!"
 GER_the_proletarian_legion_tt: "เมื่อ§Yประเทศใดก็ตาม§!ที่ §Y[ROOT.GetNameWithFlag]§! ไดกระตุน§Yคอมมิวนิสต§!เขาสู§Yสงครามกลางเมือง§!:"
 GER_strengthen_the_proletarian_international: "เสริมความแข็งแกรงใหสากลกรรมาชีพ"
 GER_strengthen_the_proletarian_international_desc: "ขณะที่คนงานในประเทศเพื่อนบานกําลังลุกขึ้นเรียกรองสิทธิ เราเห็นโอกาสมากมายที่จะเสริมฐานะของเราในฐานะพันธมิตรที่พึ่งพาได การเชิญรัฐคอมมิวนิสตที่เพิ่งกอตั้งเหลานี้เขาสูสากลกรรมาชีพ จะทําใหเราทุกคนแข็งแกรงขึ้น"
 GER_strengthen_the_proletarian_international_tt: "ทุกประเทศใน§Yยุโรป§!ที่ §Y[GER.GetNameWithFlag]§! ไดแผอิทธิพลไปสู§Yคอมมิวนิสต§! จะไดรับเชิญเขาสู§Yสากลกรรมาชีพ§! ผลนี้จะมีตอประเทศที่ถูกแผอิทธิพลไปสูคอมมิวนิสต§Yหลังจากเลือกแผนยุทธศาสตรนี้แลว§!ดวย"
 GER_proletarian_solidarity: "ความเปนปกแผนของชนชั้นกรรมาชีพ"
 GER_proletarian_solidarity_desc: "เราทุมเทเวลาและทรัพยากรอยางมากในความพยายามนํายุโรปเขาสูเสนทางคอมมิวนิสต ไมยุติธรรมหรอกหรือที่ตอนนี้เราจะไดเก็บเกี่ยวผลจากแรงงานของเรา?"
 GER_proletarian_solidarity_decision_tt: "ปลดล็อกการตัดสินใจ: §Yสงเสริมความเปนปกแผนของชนชั้นกรรมาชีพ§! เพื่อเพิ่มการคาทรัพยากรกับประเทศที่[GER.GetName]ชวยเปลี่ยนใหเปนคอมมิวนิสต"
 GER_liberate_italy: "ปลดปลอยอิตาลี"
 GER_liberate_italy_desc: "ชาว[ITA.GetAdjective]ทนทุกขภายใตการปกครองของ [ITA.GetLeader] มานาน ครั้งหนึ่งพวกเขาเคยเปนพันธมิตรของรัฐบาลเกาของเรา และเมื่อตอนนี้เราเปลี่ยนแปลงไปในทางที่ดีขึ้นแลว ก็เปนหนาที่ของเราที่จะพาพวกเขาไปดวยกัน!"
 GER_the_end_to_fascist_europe: "จุดจบของยุโรปฟาสซิสต"
 GER_the_end_to_fascist_europe_desc: "แมในเวลานี้ ยังมีประเทศในยุโรปที่อยูใตการปกครองแบบฟาสซิสต เมื่อเราตระหนักดีถึงความทุกขที่สิ่งนี้สรางแกประชาชน เราตองทําใหประเทศเหลานี้ไดรับการปลดปลอยโดยทันที!"
 GER_bypass_end_to_fascist_europe_tt: "ไมใช: ประเทศอื่นใด:\n   รัฐเมืองหลวง: อยูใน§Yยุโรป§!\n   พรรครัฐบาลปจจุบันเปน§Yฟาสซิสต§!" #The indentations are there so the tt looks correct
 GER_war_against_fascism_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yฟาสซิสต§!ใดก็ไดใน§Yยุโรป§!ที่[GER.GetNameDef]ยังไมมีเปาหมายสงครามตอ ผลปจจุบัน:"
 GER_red_europe: "ยุโรปสีแดง"
 GER_red_europe_desc: "เราไมอาจจํากัดความพยายามในการปลุกใหคนงานจับอาวุธและชูธงแดงไวเพียงในประเทศเพื่อนบานใกลชิดเทานั้น เราตองเผยแพรการปฏิวัติของชนชั้นกรรมาชีพไปทั่วยุโรป!"
 GER_spark_the_flame_of_revolution_red_europe_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมกระแสคอมมิวนิสต§!ใน§Yประเทศยุโรปขนาดเล็ก§! เมื่อคอมมิวนิสตไดรับการสนับสนุนเสียงขางมากในประเทศที่ถูกแผอิทธิพล จะเกิด§Yสงครามกลางเมือง§!เพื่อเปลี่ยนประเทศนั้นใหเปน§Yคอมมิวนิสต§!"
 GER_root_out_imperialism: "ถอนรากจักรวรรดินิยม"
 GER_root_out_imperialism_desc: "รากของจักรวรรดินิยมหยั่งลึกในผืนดินแอฟริกาและเอเชีย พันธนาการคนงานที่นั่นไว ผูคนเหลานี้ทนทุกขภายใตลัทธิอาณานิคมมานานเกินไปแลว เราตองยุติการกดขี่ขูดรีด และมอบหนทางใหมวลชนผูถูกกดขี่ลุกขึ้น กําหนดชะตากรรมของตนเอง และดึงความสนใจของศัตรูเรา"
 GER_root_out_imperialism_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเพิ่มการตอตานและการเพิ่มอํานาจปกครองตนเองในประเทศ§Yแอฟริกา§!และ§Yเอเชีย§!"
 GER_strengthen_the_proletarian_international_internationally_tt: "ทุกประเทศ§Yนอกยุโรป§!ที่ §Y[GER.GetNameWithFlag]§! ไดแผอิทธิพลไปสู§Yคอมมิวนิสต§! จะไดรับเชิญเขาสู§Yสากลกรรมาชีพ§! ผลนี้จะมีตอประเทศที่ถูกแผอิทธิพลไปสูคอมมิวนิสต§Yหลังจากเลือกแผนยุทธศาสตรนี้แลว§!ดวย"
 GER_hegemony_over_europe: "ความเปนเจาเหนือยุโรป"
 GER_hegemony_over_europe_desc: "ยุโรปเกาแบบจักรวรรดิกําลังพังทลาย เราจะสถาปนาระเบียบสังคมนิยมใหมขึ้นแทนที่ โดยมีคนงานทั่วยุโรปหวังใหเรานําพวกเขาตอตานทรราชยของชนชั้นนายทุน ชัยชนะของชนชั้นกรรมาชีพจะสถาปนาความเปนเจาของเราทั่วทั้งทวีป"
 GER_war_against_major_countries_in_europe_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yมหาอํานาจ§!ทั้งหมดที่ควบคุมรัฐอยางนอยหนึ่งรัฐใน§Yยุโรป§! ผลปจจุบัน:"
 GER_align_south_america: "ดึงอเมริกาใตมาเปนพวก"
 GER_align_south_america_desc: "คนงานในอเมริกาใตทนทุกขใตแอกทุนนิยมมานานพอแลว การโนมนาวพวกเขาใหมาสนับสนุนอุดมการณของเรา ยอมนํามาซึ่งพันธมิตรที่เหนียวแนนทั่วทั้งทวีป"
 GER_communist_propaganda_south_america_decision_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมกระแสคอมมิวนิสต§!ใน§Yประเทศขนาดเล็กในอเมริกาใต§! เมื่อคอมมิวนิสตไดรับการสนับสนุนเสียงขางมากในประเทศที่ถูกแผอิทธิพล จะเกิด§Yสงครามกลางเมือง§!เพื่อเปลี่ยนประเทศนั้นใหเปน§Yคอมมิวนิสต§!"
 GER_wage_war_on_capitalism: "ทําสงครามกับทุนนิยม"
 GER_wage_war_on_capitalism_desc: "ทุนนิยมคือศัตรูโดยธรรมชาติของคอมมิวนิสต และตองถูกรื้อทําลายดวยกําลังหากจําเปน เราจะนําการบุกครั้งนี้ตอ[USA.GetNameDef] ซึ่งเปนสัญลักษณของทุนนิยมโดยแท เพื่อปูทางสูยุคสังคมนิยมใหม"
 GER_instigate_middle_eastern_revolutions: "ปลุกปนการปฏิวัติในตะวันออกกลาง"
 GER_instigate_middle_eastern_revolutions_desc: "ตะวันออกกลางถูกมหาอํานาจตางชาติกดขี่มานาน และสุกงอมสําหรับการปฏิวัติสังคมนิยม เราควรปลุกความปรารถนาที่ยังคุกรุนของประชาชนที่จะหลุดพนจากการขูดรีดในที่สุด และชูธงแดงแหงสังคมนิยมขึ้น"
 GER_communist_propaganda_middle_east_decision_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมกระแสคอมมิวนิสต§!ใน§Yประเทศขนาดเล็กในตะวันออกกลาง§! เมื่อคอมมิวนิสตไดรับการสนับสนุนเสียงขางมากในประเทศที่ถูกแผอิทธิพล จะเกิด§Yสงครามกลางเมือง§!เพื่อเปลี่ยนประเทศนั้นใหเปน§Yคอมมิวนิสต§!"
 GER_intervene_in_spain: "แทรกแซงในสเปน"
 GER_intervene_in_spain_desc: "เปนหนาที่ของเราที่จะชวยสหายในสเปนตอสูกับกองกําลังฟาสซิสตทุกวิถีทางที่ทําได การสงทหารที่ผานศึกมาอยางโชกโชนยอมเปนที่ซาบซึ้งแนนอน"
 GER_assist_our_eastern_comrades: "ชวยเหลือสหายทางตะวันออก"
 GER_assist_our_eastern_comrades_desc: "การตอสูของสหายในตะวันออกไกลทําใหพวกเขาบอบชํ้า เราควรบรรเทาภาระของพวกเขาเทาที่ทําได การสงทหารที่ผานศึกมาอยางโชกโชนอาจพลิกชะตาใหพวกเขาได"
 GER_strike_at_the_rising_sun: "โจมตีอาทิตยอุทัย"
 GER_strike_at_the_rising_sun_desc: "[JAP.GetNameDefCap]ยังคงเปนปอมปราการของจักรวรรดินิยม กดขี่ผูใดก็ตามที่ปรารถนาความเทาเทียมและสังคมนิยม ถึงเวลาแลวที่ชาวญี่ปุนจะตองถูกปราบใหสยบและยอมรับระเบียบโลกใหมของชนชั้นกรรมาชีพ"
 GER_nationalize_industries: "โอนอุตสาหกรรมเปนของรัฐ"
 GER_nationalize_industries_desc: "เมื่อไดเห็นผลลัพธที่ดีจากการรวมศูนยเศรษฐกิจไวที่รัฐ เราอาจพิจารณาทําเชนเดียวกันกับอุตสาหกรรม ในขณะนี้ อุตสาหกรรมถูกแบงอยูใตเจาของเอกชนหลายราย ซึ่งใชกระบวนการและวิธีการผลิตสินคาที่แตกตางกัน การโอนอุตสาหกรรมเปนของรัฐจะทําใหเราควบคุมผลผลิตและประสิทธิภาพการผลิตไดมากขึ้นมาก"
 GER_form_agricultural_cooperatives: "จัดตั้งสหกรณการเกษตร"
 GER_form_agricultural_cooperatives_desc: "ภาคเกษตรกรรมมีความสําคัญยิ่งตอเรา อุตสาหกรรมหลายประเภทพึ่งพาแรงงานเกษตรกรและผลงานของพวกเขา การปลอยใหพวกเขาดิ้นรนเองยอมไมใชการกระทําที่รับผิดชอบ การจัดตั้งสหกรณจะทําใหภาคเกษตรกรรมทํางานรวมกันเปนหนึ่งเดียว มีประสิทธิภาพสูงสุดและสูญเสียนอยที่สุด"
 GER_effectivize_the_volkswerke: "ยกระดับประสิทธิภาพโฟลคสแวรเคอ"
 GER_effectivize_the_volkswerke_desc: "สิ่งที่เรียกวาโฟลคสแวรเคอเปนหนึ่งในแนวคิดไมกี่อยางที่บรรพชนของเราคิดไว ในฐานะกลุมบริษัทอุตสาหกรรมที่รัฐควบคุมเพื่อดูแลการเติบโตและการผลิตในอุตสาหกรรมเหมืองแรและเหล็กกลา โฟลคสแวรเคอสมควรไดรับการปรับปรุงทุกอยางที่เราทําได"
 GER_womens_rights_and_equality: "สิทธิและความเทาเทียมของสตรี"
 GER_womens_rights_and_equality_desc: "เพศเปนปจจัยกําหนดมานานวาบุคคลจะถูกคาดหวังใหรับใชชาติที่ใด ไมวาจะเปนแนวหนา ในโรงงาน หรือที่บาน การแบงภาระอยางเทาเทียมยิ่งขึ้นจะทําใหเรามีแรงงานมากขึ้น และมีกองทัพที่ใหญขึ้นหากจําเปน"
 GER_locks_women_in_workforce_decision_tt: "การตัดสินใจ §Y$women_in_the_workforce$§! จะ§Yใชงานไมได§!"
 GER_labor_rights_and_union_stuff: "จัดตั้งสหภาพแรงงาน"
 GER_labor_rights_and_union_stuff_desc: "การใหคนงานรวมตัวเปนสหภาพเพื่อรวมกันสงเสียงถึงขอกังวลและกําหนดสภาพการทํางานของตน ถูกละเลยมานานในประเทศของเรา ถึงเวลาแลวที่รัฐจะไมเพียงอนุญาต แตยังสงเสริมการจัดตั้งสหภาพแรงงาน!"
 GER_proletarian_dictatorship: "เผด็จการของชนชั้นกรรมาชีพ"
 GER_proletarian_dictatorship_desc: "เพื่อมอบโอกาสและมาตรฐานความเปนอยูที่ดีที่สุดแกประชาชน เราตองมีผูนําที่มั่นคงและเขาใจประชาชนกับความตองการของพวกเขาอยางลึกซึ้ง ในฐานะนักสูเพื่อชนชั้นกรรมาชีพมาอยางยาวนาน [ROOT.GetLeader] มีคุณสมบัติครบถวน และพิสูจนแลววาคิดถึงแตประโยชนสูงสุดของคนงาน"
 GER_state_controlled_economy: "เศรษฐกิจที่รัฐควบคุม"
 GER_state_controlled_economy_desc: "เศรษฐกิจของเราเปราะบางเกินกวาจะปลอยใหอยูในมือของผูที่ไมรูวิธีบริหารจัดการใหดีที่สุด เพื่อหลีกเลี่ยงวิกฤตเศรษฐกิจที่จะสงผลระยะยาวตอประชาชน รัฐตองเขาควบคุมเศรษฐกิจของเรา"
 GER_central_planning: "การวางแผนจากสวนกลาง"
 GER_central_planning_desc: "เมื่อเศรษฐกิจของเราอยูในมือของรัฐแลว การวางแผนเศรษฐกิจก็ควรรวมศูนยดวยเชนกัน ทายที่สุดแลว มีเพียงผูที่มองเห็นภาพรวมของเศรษฐกิจประเทศเทานั้นที่จะตัดสินใจไดดีที่สุดวาควรลงทุนที่ใด และควรกระจายทรัพยากรอยางไร"
 GER_the_german_stakhanovite_movement: "ขบวนการสตาฮานอฟแหงเยอรมนี"
 GER_the_german_stakhanovite_movement_desc: "ขบวนการสตาฮานอฟถือกําเนิดใน[SOV.GetName]ภายใตการปกครองของคอมมิวนิสต เมื่อคนงานเริ่มภาคภูมิใจที่ไดทํางานหนักขึ้นและผลิตไดมากกวาที่คาดหวังจากพวกเขาจริงๆ ขบวนการนี้ทําใหการผลิตพุงทะยานและมอบเปาหมายที่หนักแนนยิ่งขึ้นใหแกคนงาน เราควรพิจารณาสงเสริมความรูสึกเชนเดียวกันที่นี่ใน[ROOT.GetNameDef]"
 GER_the_german_stakhanovite_movement_tt: "เมื่อทํา §Y$GER_establish_the_reichswerke$§! หรือ §Y$GER_invest_in_vereinigte_stahlwerke$§! สําเร็จ แผนยุทธศาสตรนี้จะปรับปริมาณทรัพยากรที่ไดรับ §G5%§!"
 GER_spheres_of_influence: "เขตอิทธิพล"
 GER_spheres_of_influence_desc: "เมื่อมีสองประเทศที่มีแนวคิดคลายกันอยูใกลชิดกันเชนนี้ เราตองกําหนดสนามที่เทาเทียมสําหรับเราและ[SOV.GetAdjective] การกําหนดเขตอิทธิพลของเราและแบงเขตหนึ่งใหสหายทางตะวันออก จะชวยจํากัดความเสี่ยงของความขัดแยงดวยอาวุธ"
 GER_spheres_of_influence_tt: "เราและ §Y[SOV.GetNameWithFlag]§! จะกําหนดเขตอิทธิพลของแตละฝายใน§Yยุโรป§!\n\n§Yเขตอิทธิพล§!ของเราจะประกอบดวย:\n§Y[SWE.GetNameWithFlag]\n[NOR.GetNameWithFlag]\n[DEN.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (ตะวันตก)\n§Y[CZE.GetNameWithFlag]§! (ตะวันตก)\n§Y[HUN.GetNameWithFlag]§!\n\n§Yเขตอิทธิพลของพวกเขาจะประกอบดวย§!:\n§Y[FIN.GetNameWithFlag]\n[EST.GetNameWithFlag]\n[LAT.GetNameWithFlag]\n[LIT.GetNameWithFlag]\n[SLO.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (ตะวันออก)\n§Y[ROM.GetNameWithFlag]\n[BUL.GetNameWithFlag]\n[YUG.GetNameWithFlag]§!"
 GER_czechoslovakia: "ปลดปลอยคนงานใน[CZE.GetName]"
 GER_czechoslovakia_desc: "ถัดจากพรมแดนลงไปทางใต ใน[CZE.GetNameDef] ยังมีคนงานที่ตองไดรับการปลดปลอยจากพันธนาการของทุนนิยม พวกเขายังไมไดเห็นแสงสวางของคอมมิวนิสตในรูปแบบที่ถูกตองอยางเต็มที่ และเราตองนํามันไปสูพวกเขาไมวาจะดวยวิธีใด นี่คือหนาที่ของเราในฐานะสหายที่ดี"
 GER_poland: "ปกปองชนชั้นกรรมาชีพ[POL.GetAdjective]"
 GER_poland_desc: "ชนชั้นกรรมาชีพใน[POL.GetNameDef]ยังไมไดรับสิทธิเชนเดียวกับคนงาน[ROOT.GetAdjective]ของเรา เมื่อพวกเขาไมอาจเจริญรุงเรืองภายใตผูนําในปจจุบัน บางทีถึงเวลาที่เราจะกาวเขาไปปลดปลอยและปกปองพวกเขา"
 GER_hungary: "ยุติการกดขี่คนงาน[HUN.GetAdjective]"
 GER_hungary_desc: "คนงานใน[HUN.GetNameDef]ยังคงดิ้นรนเพื่อสิทธิที่ควรเปนพื้นฐาน รัฐบาลของประเทศนั้นมองไมเห็นความตองการของพวกเขาอยางชัดเจน ดังนั้นเราตองเขาไปเพื่อใหแนใจวาชนชั้นกรรมาชีพทั่วทั้ง[HUN.GetName]ไดรับการปฏิบัติอยางยุติธรรมและไดรับความเคารพที่สมควรไดรับ"
 GER_the_northern_shield: "โลแหงแดนเหนือ"
 GER_the_northern_shield_desc: "กลุมประเทศนอรดิกอุดมดวยทรัพยากร แตแมจะพยายามรวมคนงานเปนสหภาพ ชนชั้นกรรมาชีพก็ยังทนทุกขใตผลประโยชนของนายทุน เราเชื่อวาไมเพียงคนงานสมควรไดรับสิ่งที่ดีกวา แตเรายังสามารถใชทรัพยากรเหลานี้ไดดีกวามาก การขูดรีดคนงานนอรดิกตองยุติลง!"
 GER_sign_the_second_treaty_of_berlin: "ลงนามสนธิสัญญาเบอรลินฉบับที่สอง"
 GER_sign_the_second_treaty_of_berlin_desc: "เรารูดีวากองทัพของเรามีขนาดใหญ แตเราก็รูดีเชนกันวา[SOV.GetNameDef]มีกองทัพที่เราไมตองการปะทะดวย การยื่นมือออกไปและทําความเขาใจรวมกันเพื่อหลีกเลี่ยงการสูรบ จะสรางอนาคตที่ดีกวาใหแกคนงานทุกคนในประเทศของเราทั้งสอง"
 GER_defense_treaty_with_the_soviet: "สนธิสัญญาปองกันรวมกับโซเวียต"
 GER_defense_treaty_with_the_soviet_desc: "เมื่อเราตกลงกับชาว[SOV.GetAdjective]แลววาจะไมสูรบกัน เราควรพิจารณายกระดับความสัมพันธทางการทูตขึ้นอีกขั้น เราเห็นวาพวกเขาสมควรไดรับการปกปองจากเรา และเราเชื่อวาพวกเขาก็คงรูสึกเชนเดียวกัน และสนธิสัญญาปองกันรวมกันจะเปนประโยชนตอพวกเขาเทากับที่เปนประโยชนตอเรา"
 GER_industrial_cooperation: "ความรวมมือทางอุตสาหกรรม"
 GER_industrial_cooperation_desc: "ความรวมมือของเรากับชาว[SOV.GetAdjective]จนถึงตอนนี้จํากัดอยูแคเรื่องทางทหาร เมื่อ[SOV.GetNameDef]เปนพันธมิตรของเรา ก็สมเหตุสมผลที่จะรวมมือกันในดานอื่นดวย ปรัชญาทางอุตสาหกรรมของเราคลายคลึงกันมากพออยูแลว ความรวมมือในภาคอุตสาหกรรมจึงไมนาจะยาก"
 GER_tech_sharing: "แบงปนเทคโนโลยีอุตสาหกรรม"
 GER_tech_sharing_desc: "การแบงปนเทคโนโลยีระหวางเรากับประเทศที่มีแนวคิดเดียวกันควรเปนสิ่งที่เรามุงมั่น การติดตอชาว[SOV.GetAdjective]เพื่อการนี้ดูจะเปนแนวทางที่สมเหตุสมผลที่สุด"
 GER_resource_trade: "การคาทรัพยากร"
 GER_resource_trade_desc: "แมเราจะมุงพึ่งพาตนเองใหไดมากที่สุด แตเราตองยอมคาขายกับประเทศที่มีอุดมการณเดียวกับเรา ดวยการเสนอคาตอบแทนบางสวนแก[SOV.GetNameDef]ในรูปของกําลังการผลิตทางอุตสาหกรรม เรานาจะไดขอตกลงที่เปนประโยชนอยางยิ่งกับพวกเขา"
 GER_factories_for_resources: "โรงงานแลกทรัพยากร"
 GER_factories_for_resources_desc: "เรามีอุตสาหกรรมพลเรือนอยางลนเหลือใน[ROOT.GetNameDef]ที่สามารถนําไปใชใหเกิดประโยชนมากขึ้น เรารูวา[SOV.GetNameDef]คอนขางดอยพัฒนาในบางภูมิภาค และบังเอิญวาภูมิภาคเหลานั้นมักอุดมดวยทรัพยากรลํ้าคา ขอเสนอใหยายอุตสาหกรรมบางสวนไปแลกกับทรัพยากรเหลานี้อาจเปนโอกาสที่ทํากําไรใหเรา"
 GER_factories_for_resources_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อยายอุตสาหกรรมไปยัง §Y[SOV.GetNameWithFlag]§! เพื่อแลกกับทรัพยากร"

 #NON-ALIGNED/DEMOCRATIC
 GER_monarchist_sentiment: "กระแสนิยมกษัตริย"
 GER_monarchist_sentiment_desc: "ประชาชนตองการระบอบกษัตริย และนั่นคือสิ่งที่พวกเขาจะไดรับ แมรูปแบบการปกครองที่แนชัดจะยังไมไดขอยุติ แตก็ชัดเจนวาชาวเยอรมันตองการไกเซอรของพวกเขากลับคืนมา"
 GER_the_monarchy_compromise_ww: "$GER_the_monarchy_compromise$"
 GER_the_monarchy_compromise_ww_desc: "$GER_the_monarchy_compromise_desc$"
 GER_re_establish_free_elections_ww: "$GER_reestablish_free_elections$"
 GER_re_establish_free_elections_ww_desc: "$GER_reestablish_free_elections_desc$"
 GER_re_ratify_the_locarno_treaty: "ใหสัตยาบันสนธิสัญญาโลคารโนอีกครั้ง"
 GER_re_ratify_the_locarno_treaty_desc: "สนธิสัญญาโลคารโนลงนามในป 1925 โดยฝายไตรภาคีพยายามฟนฟูความสัมพันธกับเราใหเปนปกติ พรอมกับรักษาบูรณภาพแหงดินแดนในยุโรป แมสนธิสัญญานี้จะถูกมองวากดขี่เรา แตก็ชัดเจนวาการแกไขความผิดพลาดของฮิตเลอรที่ตอตานมันเปนสิ่งที่ดีที่สุด"
 GER_re_ratify_the_locarno_treaty_tt: "§Y[FRA.GetNameDefCap]§! มีแนวโนมจะยอมรับการดําเนินการทางการทูตใดๆ ของเรามากขึ้น"
 GER_franco_germanic_pact: "กติกาสัญญาฝรั่งเศส-เยอรมนี"
 GER_franco_germanic_pact_desc: "เมื่อเราเพิ่งฟนฟูความสัมพันธกับชาว[FRA.GetAdjective]ใหเปนปกติ ก็เปนการฉลาดที่จะกระชับความสัมพันธใหลึกซึ้งยิ่งขึ้น และทํากติกาสัญญามิตรภาพและความชวยเหลือซึ่งกันและกันอยางเปนทางการ เพื่อใหเรายืนหยัดรวมกันตอตานชาว[SOV.GetAdjective]ทางตะวันออก"
 GER_request_the_return_of_french_held_colonies: "ขอคืนอาณานิคมที่ฝรั่งเศสครอบครอง"
 GER_request_the_return_of_french_held_colonies_desc: "เมื่อสิ้นมหาสงคราม เราถูกริบดินแดนอาณานิคมไป เมื่อสมาคมอาณานิคมเยอรมันกลับมาไดรับความนิยมภายใตอาเดนาวเออร อาจถึงเวลาที่จะขออาณานิคมเกาอยางคาเมรูนและโตโกลันดคืน ยิ่งความสัมพันธของเรากับฝรั่งเศสดีเทาใด ก็ยิ่งมีโอกาสที่พวกเขาจะยอมใหเราไดดินแดนคืนมากขึ้นเทานั้น"
 GER_offer_trade_proposal: "ยื่นขอเสนอทางการคา"
 GER_offer_trade_proposal_desc: "มีหลายรัฐที่อุดมดวยทรัพยากรธรรมชาติ ซึ่งการคาขายดวยจะทํากําไรไดอยางมาก ดินแดนอินโดนีเซียและคองโกอุดมไปดวยยางและโลหะหายาก การทําขอตกลงการคากับ[BEL.GetNameDEF]และ[HOL.GetNameDef]จะทําใหเราไดทรัพยากรอันอุดมสมบูรณจากอาณานิคมของพวกเขามาปอนอุตสาหกรรมของเรา"
 GER_reverse_the_brain_drain_ww: "$GER_reverse_the_brain_drain$"
 GER_reverse_the_brain_drain_ww_desc: "$GER_reverse_the_brain_drain_desc$"
 GER_shared_rd_programs_ww: "$GER_shared_rd_programs$"
 GER_shared_rd_programs_ww_desc: "$GER_shared_rd_programs_desc$"
 GER_shared_rd_programs_ww_tt: "โบนัสความเร็วการวิจัยจาก §Y$GER_rnd_programs_modifier$§! จะเพิ่มขึ้น §G+1.00%§! ตอสมาชิกฝายใหมแตละราย สูงสุด §G+10.00%§!"
 GER_shared_rd_programs_2_tt: "§Yทุกชาติ§!ใน§Yฝาย§!ของเราจะเขารวมกลุมแบงปน§Yการวิจัยยุโรปกลาง§!ดวย"
 GER_pool_technical_know_how_ww: "$GER_pool_technical_know_how$"
 GER_pool_technical_know_how_ww_desc: "$GER_pool_technical_know_how_desc$"
 GER_the_mannheim_project_ww: "โครงการมันไฮม"
 GER_the_mannheim_project_ww_desc: "เราควรเรงความพยายามเปนสองเทาในการไขความลับของอะตอม และศึกษาการนํามันมาใชเปนอาวุธตอชาว[SOV.GetAdjective] ซึ่งจะงายขึ้นดวยพันธมิตรใหมของเรา ที่อาจยินดีแบงปนขอมูลใดๆ ที่มีในเรื่องนี้"
 GER_ban_political_uniforms: "หามเครื่องแบบทางการเมือง"
 GER_ban_political_uniforms_desc: "ยุคไวมารเต็มไปดวยองคกรกึ่งทหารและกลุมการเมืองที่นําการตอสูของตนมาสูทองถนน เพื่อสรางเสถียรภาพในอนาคต เราควรหามการแสดงออกถึงความฝกใฝทางการเมืองอยางเปดเผยเชนนี้"
 GER_embrace_liberal_leanings: "นอมรับแนวทางเสรีนิยม"
 GER_embrace_liberal_leanings_desc: "แนวคิดอนุรักษนิยมไดพิสูจนแลววาลาสมัย เมื่อไกเซอรของเราไมอาจทําสิ่งที่นักการเมืองของเราทําไดเมื่อสิ้นสงคราม เราควรมองไปขางหนาเสมอ และมุงสูวันพรุงนี้ที่ดีกวา!"
 GER_strive_for_conservative_values: "มุงสูคุณคาแบบอนุรักษนิยม"
 GER_strive_for_conservative_values_desc: "แนวคิดเสรีนิยมแพรระบาดในชาติของเรามานานเกินไป ทําใหจิตใจของผูคนออนแอ และทําใหนักการเมืองของเราฉอฉล เราตองหวนคืนสูคุณคาแบบดั้งเดิมอันดีงาม เพื่อไมใหความโกลาหลแหงสาธารณรัฐไวมารหวนกลับมาอีก"
 GER_strengthen_the_welfare_state: "เสริมความแข็งแกรงใหรัฐสวัสดิการ"
 GER_strengthen_the_welfare_state_desc: "ชาติของเรามีประวัติศาสตรยาวนานในฐานะรัฐสวัสดิการ และเราไมมีเจตนาจะเปลี่ยนแปลงสิ่งนี้ในตอนนี้ เราตองยึดมั่นในหลักการ และทําใหประชาชนมีชีวิตที่ดีที่สุดเทาที่เราจะมอบใหได"
 GER_democratic_shield: "โลแหงประชาธิปไตย"
 GER_democratic_shield_desc: "ประชาธิปไตยกําลังตกอยูในอันตรายทั่วโลก เชนเดียวกับที่ครั้งหนึ่งเคยเกิดในชาติของเรา เรารูถึงความนาสะพรึงกลัวของนักประชานิยมแบบอํานาจนิยมและเผด็จการเบ็ดเสร็จ และตองทําใหประชาชนของชาติอื่นไมตองเผชิญสิ่งที่เราเคยเผชิญ"
 GER_send_military_support_democratic_shield_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yสงยุทโธปกรณทางทหาร§!ใหประเทศ§Yประชาธิปไตย§!ที่อยูในภาวะสงคราม"
 GER_revive_the_kaiserreich_ww: "$GER_revive_the_kaiserreich$"
 GER_revive_the_kaiserreich_ww_desc: "$GER_revive_the_kaiserreich_desc$"
 GER_return_of_the_kaiser_ww: "การกลับมาของไกเซอร"
 GER_return_of_the_kaiser_ww_desc: "ไกเซอรไรชตองการไกเซอร และวิลเฮลมที่ 2 ยังมีพระชนมชีพอยู ประทับลี้ภัยในเนเธอรแลนด เราจะยกเลิกการเนรเทศพระองค และเชิญเสด็จกลับมาขึ้นครองราชย ไมวาประชาธิปไตยตะวันตกจะคิดเชนไร"
 GER_military_dictatorship: "เผด็จการทหาร"
 GER_military_dictatorship_desc: "มหาสงครามพิสูจนใหเราเห็นวาไกเซอรเพียงพระองคเดียวไมเพียงพอที่จะนําชาติไปในทิศทางที่ดีที่สุด เชนเดียวกับที่ทําในครั้งนั้น กองบัญชาการทหารสูงสุดแหงใหมตองรับอํานาจเผด็จการอีกครั้ง และเปนอํานาจทางการเมืองเพียงหนึ่งเดียวในจักรวรรดิ"
 GER_military_dictatorship_tt: "§Yจักรวรรดิเยอรมัน§!จะไดชื่อวา§Yไกเซอรไรชเยอรมัน§!\n"
 GER_invite_scientists_back: "โครงการริเริ่มวิทยาศาสตรแหงจักรวรรดิ"
 GER_invite_scientists_back_desc: "ผูมีปญญาเฉียบแหลมจํานวนมากหนีออกนอกประเทศเมื่อนาซียึดอํานาจ และก็ดวยเหตุผลที่ดี แตบัดนี้เมื่อจักรวรรดิอันรุงโรจนของเราไดรับการฟนฟู หลายคนอาจยินดีกลับมาหาเราอีกครั้ง"
 GER_glorious_mechanical_machinations: "กลไกจักรกลอันรุงโรจน"
 GER_glorious_mechanical_machinations_desc: "ไกเซอรของเราทรงหลงใหลเครื่องจักรขนาดมหึมามานาน และทรงสั่งใหนักวิทยาศาสตรของเราใหความสําคัญกับการวิจัยสิ่งประดิษฐที่เคยเห็นแตในความฝน เชน ปนใหญรถไฟขนาดยักษ เครื่องบินที่บินขามมหาสมุทรแอตแลนติกได และเรือที่เงาของมันบดบังขอบฟา"
 GER_prussian_artillery: "หลักนิยมปนใหญแบบปรัสเซีย"
 GER_prussian_artillery_desc: "ในอดีต เราชนะศึกครั้งแลวครั้งเลาดวยหลักนิยมที่เหนือกวา คุณภาพและอํานาจการยิงเปนสวนสําคัญที่ทําใหยุทธวิธีนี้ประสบความสําเร็จ และเปนสิ่งที่เราตองพยายามเลียนแบบอีกครั้ง!"
 GER_fan_prussian_militarism: "$GER_fan_the_prussian_militarism$"
 GER_fan_prussian_militarism_desc: "$GER_fan_the_prussian_militarism_desc$"
 GER_fan_prussian_militarism_tt: "ปลดล็อก §Yรุพเพรชท ฟอน วิทเทิลสบัค§! เปนจอมพลระดับ 4"
 GER_re_form_the_freikorps: "ฟนฟูไฟรคอรปส"
 GER_re_form_the_freikorps_desc: "ไฟรคอรปสไดชวยเราตอสูกับฝายตรงขามทางอุดมการณมาเปนเวลานาน ชวยเราปราบสาธารณรัฐโซเวียตบาวาเรีย รวมถึงความพยายามปฏิวัติอื่นๆ ตลอดยุคไวมาร เราควรพยายามฟนฟูกองกําลังกึ่งทหารเชนนี้ เพื่อไมใหทั้งคอมมิวนิสตและนาซีกลับมามีฐานที่มั่นในชาติของเราไดอีก"
 GER_freikrops_militia_recruitment_tt: "ไดรับหนวย§Yกองกําลังอาสา§!ไฟรคอรปสหาหนวย"
 GER_re_form_the_freikorps_generals_tt: "§Yฟรันซ ริทเทอร ฟอน เอ็พพ§! และ §Yแฮรมันน แอรฮารท§! พรอมใหแตงตั้งเปนนายพล"
 GER_re_establish_the_landwehr: "ฟนฟูลันเดสแวร"
 GER_re_establish_the_landwehr_desc: "ลันทแวรเปนเครื่องมือปองกันตนเองที่มีประโยชนมาตั้งแตป 1813 และมีประโยชนอยางยิ่งตอสาธารณรัฐไวมาร เราควรพยายามทําใหชายในชาติของเราเปนประโยชน และจัดตั้งกองพันลันทแวรและลันเดสชึทเซินของเราเอง"
 GER_all_for_the_front: "ทุกสิ่งเพื่อแนวหนา!"
 GER_all_for_the_front_desc: "ชายทุกคนตองอุทิศหัวใจ เลือดเนื้อ และจิตวิญญาณแกชาติเยอรมัน หากปรารถนาใหปตุภูมิกลับคืนสูความรุงโรจนดังเดิม ทุกสิ่งที่เราผลิตควรเปนไปเพื่อแนวหนา และนี่คือความจริงที่ประชาชนของเราจะตองเขาใจเมื่อเวลาผานไป"
 GER_expatriate_the_communists_ww: "$GER_expatriate_the_communists$"
 GER_expatriate_the_communists_ww_desc: "$GER_expatriate_the_communists_desc$"
 GER_demand_the_return_of_southern_jutland: "เรียกรองจัตแลนดใตคืน"
 GER_demand_the_return_of_southern_jutland_desc: "กรรมสิทธิ์เหนือดัชชีชเลสวิชเปนประเด็นพิพาทระหวางเรากับชาวเดนมารกมานาน เมื่อสิ้นมหาสงคราม ฝายไตรภาคียกชเลสวิชเหนือใหพวกเขา ทั้งที่พวกเขาไมไดเขารวมสงครามดวยซํ้า เราตองแกไขความอยุติธรรมทางประวัติศาสตรนี้ และเรียกรองใหรัฐบาลเดนมารกคืนดินแดนนั้นแกเรา"
 GER_glory_to_the_imperial_army: "เกียรติยศแดกองทัพจักรวรรดิ"
 GER_glory_to_the_imperial_army_desc: "กองทัพจักรวรรดิชนะศึกครั้งแลวครั้งเลา และทําใหปรัสเซียกับเยอรมนีไดที่ยืนในยุโรป แมนักการเมืองจะทรยศเมื่อสิ้นสงครามโลก แตกองทัพจะสามารถกอบกูความยิ่งใหญที่สูญเสียไปกลับคืนมาได"
 GER_glory_to_the_imperial_army_tt: "ปลดล็อก §Yเจาชายไอเทล ฟรีดริช§! เปนนายพลระดับ 2"
 GER_restore_the_holy_roman_empire: "ฟนฟูจักรวรรดิโรมันอันศักดิ์สิทธิ์"
 GER_restore_the_holy_roman_empire_desc: "หลายคนสงสัยวาวันเชนนี้จะมาถึงหรือไม แตเราก็มาถึงจุดนี้แลว เมื่อทวงคืนพรมแดนเกาของจักรวรรดิได เราอาจสามารถสวมมงกุฎใหจักรพรรดิแหงจักรวรรดิโรมันอันศักดิ์สิทธิ์ไดอีกครั้ง แตคราวนี้ในรูปแบบของชาติที่เปนเอกภาพ เกียรติยศแดจักรวรรดิ!"
 GER_weltpolitik: "เวลทโพลิทิค"
 GER_weltpolitik_desc: "เราจะไมไดรับการยอมรับอยางจริงจังในฐานะมหาอํานาจ จนกวาจะฟนฟูจักรวรรดิระดับโลกของเรา หรือสรางจักรวรรดิใหมขึ้นแทน ดังนั้นเราตองเริ่มมองออกไปขางนอก และไมจับจองอยูแตทวีปยุโรปอีกตอไป"
 GER_prepare_for_the_next_naval_blockade: "เตรียมรับการปดลอมทางทะเลครั้งตอไป"
 GER_prepare_for_the_next_naval_blockade_desc: "เรารูวาเกิดอะไรขึ้นครั้งลาสุดที่เราสูกับศัตรูที่มีกองเรือใหญกวา ดวยความรูที่เรามีในตอนนี้ เราสามารถพยายามหลีกเลี่ยงปญหามากมายที่เคยเผชิญ ดวยการเตรียมการอยางรอบคอบกอนที่สงครามจะมาถึง"
 GER_accept_british_naval_dominance_ww: "$GER_accept_british_naval_dominance$"
 GER_accept_british_naval_dominance_ww_desc: "$GER_accept_british_naval_dominance_desc$"
 GER_carve_up_congo: "แบงดินแดนคองโก"
 GER_carve_up_congo_desc: "คองโกสุกงอมสําหรับการลาอาณานิคม และอุดมดวยทรัพยากรธรรมชาติ บางทีเราอาจตกลงกับพวกอังกฤษผูยอมออนขอเพื่อแบงดินแดนกวางใหญนี้กัน ซึ่งจะเปนกาวสําคัญในการปฏิรูปจักรวรรดิอาณานิคมของเรา"
 GER_anglo_germanic_defense_pact: "กติกาสัญญาปองกันอังกฤษ-เยอรมนี"
 GER_anglo_germanic_defense_pact_desc: "อังกฤษเปนศัตรูของเรามานาน แตดวยพัฒนาการลาสุด เราอาจทําขอตกลงปองกันรวมกับพวกเขาได ซึ่งระบุวาหากผูใดโจมตีฝายหนึ่ง ก็เทากับโจมตีทั้งสองฝาย นี่จะเปนกาวสําคัญในการฟนฟูความสัมพันธกับรัฐของพวกเขาใหเปนปกติ"
 GER_signed_the_anglo_german_defence_pact_opm: "ลงนามกติกาสัญญาปองกันอังกฤษ-เยอรมนีแลว"
 GER_anglo_germanic_cooperation_program: "โครงการความรวมมืออังกฤษ-เยอรมนี"
 GER_anglo_germanic_cooperation_program_desc: "ราชนาวีอังกฤษมีความรูมากมายเรื่องการตอเรือและการรบทางทะเล ดวยความรวมมืออยางใกลชิด เราอาจไดรับและใชประโยชนจากความรูที่อังกฤษเคยปกปดไวเปนความลับอยางแนนหนา"
 GER_carte_blanche_for_alsace_and_french_colonies_ww: "$GER_carte_blanche_for_alsace_and_french_colonies$"
 GER_carte_blanche_for_alsace_and_french_colonies_ww_desc: "$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
 GER_petition_for_the_return_of_old_colonies: "ยื่นคํารองขอคืนอาณานิคมเกา"
 GER_petition_for_the_return_of_old_colonies_desc: "มิตรชาวอังกฤษคนใหมของเราอาจเปดใจหารือเรื่องการคืนอาณานิคมที่พวกเขายึดไปเมื่อสิ้นมหาสงคราม พวกเขาอาจเรียกรองคาตอบแทนบางอยาง แตเปนสิ่งที่เรายินดีทําหากหมายถึงการไดสิทธิ์เดิมของเราคืนมา"
 GER_unify_west_africa: "รวมแอฟริกาตะวันตกเฉียงใต"
 GER_unify_west_africa_desc: "ความฝนถึงมิทเทิลอัฟริกาของเราถูกขัดขวางโดยดินแดนแองโกลา เพื่อเชื่อมดินแดนของเราในแอฟริกาตะวันตกเฉียงใตเขากับดินแดนในคองโก เราตองสงคําขาดเรียกรองใหรับรองการปกครองของเราเหนือดินแดนนั้นโดยทันที"
 GER_expand_pacific_holdings: "ขยายดินแดนในแปซิฟก"
 GER_expand_pacific_holdings_desc: "ดวยความกระหายที่จะมีจักรวรรดิในมหาสมุทรแปซิฟก นักการเมืองของเราสนับสนุนใหขยายอํานาจไปทั่วภูมิภาค โดยมีเปาหมายเพื่อสถาปนาความเปนเจาของ[ROOT.GetAdjective]ในตะวันออกไกล เราควรสนับสนุนการริเริ่มนี้และเปนฝายรุก"
 GER_closer_sino_germanic_relations: "กระชับความสัมพันธจีน-เยอรมนี"
 GER_closer_sino_germanic_relations_desc: "ชาว[CHI.GetAdjective]เปนพันธมิตรของเรามายาวนาน หลายคนเคยมองวามีแนวโนมที่รัฐบาล[CHI.GetAdjective]จะเขารวมมหาสงครามฝายเราในเวลานั้น เราควรใหคุณคากับความสัมพันธนี้ และพยายามกระชับสายสัมพันธระหวางสองชาติใหแนนแฟนยิ่งขึ้น"
 CHI_has_accepted_german_overtures: "จีนยอมรับการทาบทามของ[ROOt.GetAdjective]แลว"
 GER_industrial_investments: "การลงทุนดานอุตสาหกรรม"
 GER_industrial_investments_desc: "[CHI.GetNameDefCap]ดอยพัฒนาอยางมากและขาดการพัฒนาอุตสาหกรรมที่จําเปนตอการยืนหยัดบนเวทีโลกในฐานะมหาอํานาจ เราควรสงวิศวกรไปชวยพัฒนาอุตสาหกรรม รวมทั้งใหทุนแกบริษัท[CHI.GetAdjective]ที่กําลังเติบโต เพื่อชวยการเติบโตทางอุตสาหกรรมของพวกเขา"
 GER_launch_sino_germanic_joint_research_program: "เปดโครงการวิจัยรวมจีน-เยอรมนี"
 GER_launch_sino_germanic_joint_research_program_desc: "ชาว[CHI.GetAdjective]มีความรูที่มีคานาเรียนรู และเราก็รูหลายอยางที่จะเปนประโยชนแกพวกเขาเชนกัน ดังนั้นเราควรพยายามจัดตั้งทีมวิจัยและพัฒนารวมกันที่จะชวยใหทั้งสองชาติกาวหนาไปดวยกัน"
 GER_send_military_aid: "สงความชวยเหลือทางทหาร"
 GER_send_military_aid_desc: "มิตรของเราใน[CHI.GetNameDef]ถูกลอมรอบดวยศัตรู ซึ่งหลายรายหมายจะคุกคามการดํารงอยูของรัฐพวกเขา เราตองสงกระสุนและยุทโธปกรณไปให เพื่อใหพวกเขารักษาพรมแดนไวได และเปนประโยชนตอเราในอีกหลายปขางหนา"
 GER_send_volunteers: "กองทหารตะวันออกไกล"
 GER_send_volunteers_desc: "ชาว[ROOT.GetAdjective]จํานวนมากโหยหาการผจญภัย และอยากไปรบเพื่ออุดมการณที่ดี ดังนั้นเราควรจัดตั้งกองทหาร 'อาสาสมัคร' ที่จะไปชวยมิตรชาว[CHI.GetAdjective]ในสงครามของพวกเขา"
 GER_request_the_return_of_qingdao: "ขอชิงเตาคืน"
 GER_request_the_return_of_qingdao_desc: "ชิงเตาเปนหนึ่งในเมืองทาตามสนธิสัญญามากมายที่ไดมาจากจีนในชวงศตวรรษแหงความอัปยศของพวกเขา แมเราจะเสียเมืองนี้ซึ่งถูกยกใหเรามานานหลายปไปเมื่อสิ้นมหาสงคราม แตตอนนี้เราอาจมีโอกาสขอคืนจาก[CHI.GetNameDef] หากเราเตรียมคาตอบแทนที่เหมาะสมไวพรอม"
 GER_the_sino_germanic_pact: "กติกาสัญญาจีน-เยอรมนี"
 GER_the_sino_germanic_pact_desc: "ในที่สุดก็ถึงเวลาที่จะรับรองรัฐบาล[CHI.GetAdjective]เปนพันธมิตรอยางเปนทางการ เราควรทําพันธมิตรนี้ใหเปนทางการโดยทันที เพื่อใหเรายืนหยัดรวมกันตอตานทุกผูที่คิดจะกดขี่เรา!"
 GER_divide_and_conquer: "แบงแยกแลวพิชิต"
 GER_divide_and_conquer_desc: "เราและชาว[CHI.GetAdjective]ตางมีเขตอิทธิพลที่ตองการในตะวันออกไกล และสักวันหนึ่งจะตองมีการขีดเสนพรมแดนและเคารพกัน ดังนั้นเราควรทําเชนนั้นโดยเร็วที่สุด เพื่อใหความฝนแหงจักรวรรดิของทั้งสองฝายไดรับการยอมรับ"
 GER_asian_spheres_of_influence_tt: "เราและ §Y[CHI.GetNameWithFlag]§! จะกําหนดเขตอิทธิพลของแตละฝายใน§Yเอเชีย§! โดยปรับคาใชจายในการยึดรัฐที่อยูในและนอกเขตอิทธิพลของแตละฝาย\n\n§Yเขตอิทธิพล§!ของเราจะประกอบดวย:\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§!\n§Yหมูเกาะแปซิฟกใต§!ทั้งหมด\n\n§Yเขตอิทธิพล§!ของพวกเขาจะประกอบดวย:\n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
 GER_the_second_naval_race: "การแขงขันทางนาวีครั้งที่สอง"
 GER_the_second_naval_race_desc: "เราถูกอังกฤษและฝรั่งเศสเหยียดหยามมานานเกินไปแลว! ถึงเวลาแลวที่เราจะฟนฟูกองเรือ และประกาศอยางเปนทางการวาเราไมมีเจตนาจะกมหัวใหพวกเขาอีกตอไป อีกไมนานพวกเขาจะไดรูวาทองทะเลเปนของเรา และไมใชของผูอื่น"
 GER_rebuild_the_high_seas_fleet_ww: "$GER_rebuild_the_high_seas_fleet$"
 GER_rebuild_the_high_seas_fleet_ww_desc: "$GER_rebuild_the_high_seas_fleet_desc$"
 GER_break_anglo_french_colonial_hegemony_ww: "$GER_break_the_anglo_french_colonial_hegemony$"
 GER_break_anglo_french_colonial_hegemony_ww_desc: "$GER_break_the_anglo_french_colonial_hegemony_desc$"
 GER_break_anglo_french_colonial_hegemony_ww_tt: "หากเราไดลงนามสนธิสัญญาความรวมมือซึ่งกันและกันกับ§Yฝรั่งเศส§!แลว เราจะไมไดรับเปาหมายสงครามตอพวกเขา"
 GER_asian_allies: "พันธมิตรในเอเชีย"
 GER_asian_allies_desc: "มีชาติเล็กๆ มากมายในเอเชียที่ยังไมตกอยูใตการควบคุมของศัตรูเรา บางทีดวยคํามั่นถึงอนาคตที่มั่นคงและดินแดนที่จะไดรับ พวกเขาอาจยินดีชวยเราในความขัดแยงระดับโลก"
 GER_our_place_in_the_sun_ww: "ที่ยืนของเราใตดวงตะวัน"
 GER_our_place_in_the_sun_ww_desc: "ใหทุกคนไดรูวา[ROOT.GetNameDef]ยืนยันสิทธิ์ของตนอีกครั้งที่จะมีที่ยืนใตดวงตะวัน! ประชาชนของเราจะไมถูกเหยียดหยามอยูในเงามืดใตอุงมือของจักรวรรดิที่ดวงอาทิตยไมเคยตกดินอีกตอไป!"
 GER_realize_mittelafrika: "ทํามิทเทิลอัฟริกาใหเปนจริง"
 GER_realize_mittelafrika_desc: "จักรวรรดิอาณานิคมของเราจะแผไพศาล และความมั่งคั่งของแอฟริกากลางก็ยั่วยวนใจเสมอมา เราควรทําความฝนถึงมิทเทิลอัฟริกาของเยอรมนีใหเปนจริงโดยเร็วที่สุด เพื่อใหเราใชประโยชนจากหัวใจของแอฟริกาได"
 GER_realize_mittelafrika_tt: "ไดรับการอางสิทธิ์ในทุกรัฐของ§Yคองโก§! §Yเคนยา§! §Yแองโกลา§! และ§Yโมซัมบิก§!"
 GER_african_allies: "พันธมิตรในแอฟริกา"
 GER_african_allies_desc: "ประชาชนในแอฟริกาโหยหาการปลดปลอยจากชาวยุโรป บางทีเราอาจลอพวกเขามาอยูฝายเราดวยคํามั่นเรื่องอํานาจปกครองตนเองหากเขารวมกับเรา"
 GER_african_allies_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yสนับสนุนเอกราช§!ของประเทศใน§Yแอฟริกา§!"
 GER_asian_allies_faction_tt: "ชาติเล็กที่เปนเอกราชในเอเชียซึ่งยังไมอยูในฝายใดจะไดรับเหตุการณตอไปนี้:"
 GER_african_allies_faction_tt: "ชาติเล็กที่เปนเอกราชในแอฟริกาซึ่งยังไมอยูในฝายใดจะไดรับเหตุการณตอไปนี้:"
 GER_asian_allies_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yสนับสนุนเอกราช§!ของประเทศใน§Yเอเชีย§!"
 GER_expand_african_reach: "ขยายอํานาจในแอฟริกา"
 GER_expand_african_reach_desc: "มีภูมิภาคในแอฟริกาที่เราอางสิทธิ์ซึ่งไมไดอยูใตการควบคุมของศัตรูในปจจุบัน เราควรทําใหการอางสิทธิ์ของเราชัดเจน และเรียกรองดินแดนเหลานี้จากพวกเขาโดยทันที"

 GER_realpolitik: "เรอัลโพลิทิค"
 GER_realpolitik_desc: "ถึงเวลาแลวที่เราจะมองออกไปยังสวนอื่นของยุโรป และดูวาลมกําลังพัดไปทางใด หากมีโอกาสสําหรับการเปนพันธมิตรหรือการพิชิต เราตองความันไวทันที"

 GER_restore_the_brest_litovsk_borders: "ฟนฟูพรมแดนเบรสต-ลีตอฟสค"
 GER_restore_the_brest_litovsk_borders_desc: "พรมแดนที่กําหนดในสนธิสัญญาเบรสต-ลีตอฟสคถูกเพิกถอนอยางไมชอบธรรมโดยสนธิสัญญาแวรซายมานานแลว ทั้งที่รัสเซียแพมหาสงครามและยกดินแดนเหลานั้นใหเรา เราตองพยายามทวงคืนดินแดนตะวันออกที่สูญเสียไป แมอาจนําไปสูสงครามในอนาคต"
 GER_demand_further_polish_concessions: "เรียกรองสัมปทานเพิ่มเติมจากโปแลนด"
 GER_demand_further_polish_concessions_desc: "เราทําใหชาวโปแลนดยกดินแดนสําคัญของจักรวรรดิเกาคืนใหเราไดแลว แตเราจะไมหยุดเพียงเทานั้น พรมแดนเบรสต-ลีตอฟสคยังไมไดรับการฟนฟู และโปแลนดยังคงขวางทางความฝนของเรา"
 GER_restore_eastern_imperial_possessions: "ฟนฟูดินแดนตะวันออกของจักรวรรดิ"
 GER_restore_eastern_imperial_possessions_desc: "ดินแดนที่เปนสวนสําคัญของจักรวรรดิเรายังถูกมหาอํานาจตางชาติยึดไว เพื่อทําใหพรมแดนเบรสต-ลีตอฟสคเปนจริง เราตองมุงไปที่โพซนาน ปรัสเซียตะวันตก และไซลีเซียกอน"
 GER_incorporate_the_polish_rump_state: "ผนวกรวมรัฐโปแลนดที่เหลืออยู"
 GER_incorporate_the_polish_rump_state_desc: "แมแตดินแดนสวนสุดทายที่เหลือของโปแลนดก็เปนของจักรวรรดิ ดังที่ระบุไวในสนธิสัญญาเบรสต-ลีตอฟสค เราตองทวงคืนดินแดนเหลานี้ ดวยกําลังหากจําเปน"

 GER_memel_ultimatum: "คําขาดเมเมล"
 GER_memel_ultimatum_desc: "หากเราไดเรียนรูสิ่งใดจากมหาสงคราม นั่นคือเราตองเตรียมรับการโจมตีตอดินแดนรอบนอกทางตะวันออก ดินแดนเหลานี้ตองไดรับการฟนฟูและเสริมปอมปราการรับการรุกราน แตจะทําเชนนั้นไมไดหากไมไดควบคุมเมเมลลันดซึ่งมีความสําคัญทางยุทธศาสตร ซึ่งเราตองทวงคืนมา"
 GER_demand_lithuanian_integration: "เรียกรองใหผนวกรวมลิทัวเนีย"
 GER_demand_lithuanian_integration_desc: "ครั้งหนึ่งราชอาณาจักรลิทัวเนียเคยถูกวางแผนใหเปนสวนกึ่งปกครองตนเองของชาติเรา และก็จะเปนเชนนั้น เราตองผนวกดินแดนลิทัวเนีย และสวมมงกุฎใหมินเดากัสเปนดยุกแหงดินแดนเหลานั้น"

 GER_establish_eastern_grand_duchies: "[GetEasternDuchiesName]"
 GER_establish_eastern_grand_duchies_desc: "เราไมอาจถือครองดินแดนทั้งหมดที่ระบุในสนธิสัญญาไวโดยตรงได แตเรามีแผนจะตั้งราชรัฐและราชอาณาจักรบริวารทางตะวันออก ซึ่งจะถือครองดินแดนเหลานี้ไวแทนเรา"
 GER_eastern_duchies_name_democratic: "รัฐปกครองตนเองทางตะวันออก"
 GER_eastern_duchies_name_neutrality: "จัดตั้งแกรนดดัชชีทางตะวันออก"

 GER_subduing_the_baltic_states: "ปราบรัฐบอลติก"
 GER_subduing_the_baltic_states_desc: "รัฐบอลติกเปนรัฐที่ไมชอบธรรม ซึ่งอางสิทธิ์ในดินแดนของดัชชีบอลติกรวมของเรา เราตองปราบพวกเขาใหสยบ และมอบดินแดนใหแกชนชั้นสูงเชื้อสายเยอรมันบอลติก"
 GER_subduing_the_baltic_states_tt: "ไดรับหนวย§Yทหารราบ§!บัลทิเชอ ลันเดสแวรสามหนวย\nหาก§Yโปแลนด§!ยังไมได§Yฟนฟูกลุมแบรมอนท§! §Yรือดิเกอร ฟอน แดร กอลทซ§! จะเขารวมกับเราในฐานะจอมพลระดับ 3"

 GER_strike_eastward: "บุกโจมตีทางตะวันออก"
 GER_strike_eastward_desc: "เมื่อพรมแดนมั่นคงแลว ถึงเวลาที่เราจะโคนคูแขงรายใหญที่สุด ผูที่ฉีกสนธิสัญญาเบรสต-ลีตอฟสค และผูที่คุกคามเสถียรภาพของยุโรปตะวันออก นั่นคือ[SOV.GetNameDef] ถึงเวลายึดมอสโก และทําใหยักษใหญ[SOV.GetAdjective]คุกเขาอยางแทจริง"
 GER_unlocks_kremlin_raid_tt: "ปลดล็อก§Yการโจมตีทางอากาศ§!ตอ§Yเครมลิน§! เมื่ออยูในภาวะสงครามกับ §Y[SOV.GetNameWithFlag]§!"

 GER_end_european_communism: "ยุติคอมมิวนิสตในยุโรป"
 GER_end_european_communism_desc: "บัดนี้เมื่อภัยคุกคามที่ใหญที่สุดตอชาติเราถูกทําลายแลว ก็ถึงเวลาเก็บกวาดความยุงเหยิงที่พวกเขาทิ้งไวในยุโรป คอมมิวนิสตเปนภัยคุกคามขั้นพื้นฐานตอคุณคาของเรา และตองถูกดับสูญไปตลอดกาล"
 GER_strike_eastward_eq_trigger_tt: "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y100.000§!"
 GER_second_vienna_award_eq_trigger_tt: "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y60.000§!"
 GER_sea_lion_eq_trigger_tt: "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y90.000§!"
 GER_puppet_finland: "สรางความภักดีของ[FIN.GetAdjective]"
 GER_puppet_finland_desc: "[GetFinlandpuppetDescription]"
 GER_finland_puppet_description_democratic: "ชาว[FIN.GetAdjective]อาจเปนพี่นองรวมรบของเรา แตเราไมอาจมั่นใจไดเลยวาจะไมมีวันที่พวกเขาทรยศและเปลี่ยนขาง เราตองทําใหวันนั้นไมมีวันมาถึง ไมวาจะตองแลกดวยอะไรก็ตาม!"
 GER_finland_puppet_description_neutrality: "ชาว[FIN.GetAdjective]เคยปฏิเสธขอเสนอของเราที่จะตั้งกษัตริยในอดีต แตเราจะไมยอมใหพวกเขาทําเชนนั้นอีก ถึงเวลาที่เจาชายว็อลฟกัง แหงเฮสเซินจะขึ้นครองบัลลังกของพวกเขา ไมวาพวกเขาจะชอบหรือไมก็ตาม"
 GER_see_to_the_eastern_front_ww: "ดูแลแนวรบดานตะวันออก"
 GER_see_to_the_eastern_front_ww_desc: "การกระทําของเราในสงครามครั้งกอนยังคงอยูในความทรงจําของคนจํานวนมาก เราตองหันเหความกลัวของทวีปไปยังภัยที่แทจริง นั่นคือ[GER.GetGreatRedMenaceDesc]อันยิ่งใหญที่ทะมึนอยูทางตะวันออก เราจะเริ่มการรณรงคโฆษณาชวนเชื่อครั้งใหญเพื่อเปดตาของทั้งทวีป"
 GER_the_eastern_threat: "ภัยคุกคามจากตะวันออก"
 guardian_against_the_eastern_threat: "ผูพิทักษตอภัยคุกคามจากตะวันออก"
 existential_threat: "ภัยคุกคามตอการดํารงอยู"
 GER_seeks_to_restore_brest_litovsk: "มุงฟนฟูเบรสต-ลีตอฟสค"
 GER_seeks_to_restore_brest_litovsk_worse: "$GER_seeks_to_restore_brest_litovsk$"
 GER_safeguard_the_baltic_ww: "$GER_safeguard_the_baltic$"
 GER_safeguard_the_baltic_ww_desc: "$GER_safeguard_the_baltic_desc$"
 GER_tributes_for_guarantees: "บรรณาการแลกการรับประกัน"
 GER_tributes_for_guarantees_desc: "เราควรปกปองรัฐบอลติกจากหมีทางตะวันออก แตเราจะไมทําใหฟรีๆ เมื่อชาติเหลานี้อยูในสถานะที่เปราะบางเชนนี้ การเรียกรองคาตอบแทนสําหรับการคุมครองยอมทําไดงาย"
 tributes_from_lithuania_tt: "หาก §Y[LIT.GetNameWithFlag]§! ยอมรับ:"
 tributes_from_latvia_or_estonia_tt: "หาก §Y[LAT.GetNameWithFlag]§! หรือ §Y[EST.GetNameWithFlag]§! ยอมรับ:"
 GER_will_also_recieve_trade_and_civs_tt: "เราจะไดรับทรัพยากรและอุตสาหกรรมพลเรือนสวนหนึ่งของพวกเขาดวย \n ปริมาณ §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! จะขึ้นอยูกับจํานวนชาติที่ยอมรับขอเรียกรองของเรา"
 GER_support_the_finns_ww: "$GER_support_the_finns$"
 GER_support_the_finns_ww_desc: "ชาวฟนนตกอยูในแนวกระสุนของ[GER.GetRussiansDemonym] เราจะเสนอการรับประกันตอภัยคุกคามจากตะวันออกใหพวกเขา และมอบความชวยเหลือทางอุตสาหกรรมเล็กนอย"
 GER_danzig_for_guarantees_ww: "$GER_danzig_for_guarantees$"
 GER_danzig_for_guarantees_ww_desc: "$GER_danzig_for_guarantees_desc$"
 GER_safeguard_poland: "คุมครองโปแลนด"
 GER_safeguard_poland_desc: "ชาวโปแลนดเปราะบางตอการโจมตีจากตะวันออก เราตองปกปองพวกเขาไมวาจะตองแลกดวยอะไร เพื่อรักษารัฐกันชนระหวางเรากับชาว[SOV.GetAdjective]ไว"
 GER_safeguard_poland_tt: "หาก§Yโปแลนด§!อยูในฝายของเราหรือไดรับการรับประกันจากเรา เมื่อทํา§Yจัดการซอมรบรวม§!สําเร็จ เราจะไดรับ§Yประสบการณกองทัพบก§!เพิ่ม §G25§! และ§Yประสบการณกองทัพอากาศ§! §G15§!"
 GER_offer_military_production_support: "เสนอการสนับสนุนการผลิตทางทหาร"
 GER_offer_military_production_support_desc: "รัฐกันชนทางตะวันออกขาดฐานอํานาจทางอุตสาหกรรมที่แข็งแกรงอยางที่เรามี เราควรเสนอความชวยเหลือในการผลิตอาวุธและกระสุน เพื่อหวังวาพวกเขาจะตานทานไดระยะหนึ่งหากถูก[SOV.GetNameDef]โจมตี"
 GER_offer_military_production_support_tt: "รัฐยุโรปตะวันออกทั้งหมดที่อยูใตการคุมครองของเราจะไดรับการเสริม§Yการผลิตทางทหาร§!ดังตอไปนี้เปนเวลา §Y730§! วัน:"
 GER_liberate_oppressed_people: "ปลดปลอยประชาชนผูถูกกดขี่"
 GER_liberate_oppressed_people_desc: "มีผูคนจํานวนมากใน[SOV.GetNameDef]ที่เปนมิตรกับเรา และปรารถนาการปลดปลอยมากกวาสิ่งใด บางทีเราควรปลดปลอยพวกเขาจากผูกดขี่ และใหพวกเขากลายเปนพันธมิตรใหมของเราทางตะวันออก"
 GER_liberate_oppressed_people_tt: "การปลดปลอยรัฐองคประกอบของ §Y[SOV.GetNameDef]§! จะถูกลง §G40%§! และการทําใหเปนรัฐหุนเชิดจะถูกลง §G20%§!"
 GER_liberate_oppressed_people_cossacks_tt: "เปดใหฟนฟู§Yสาธารณรัฐคอสแซค§!แหงรัสเซียใตได"
 GER_build_the_eastern_bulwark: "สรางปราการตะวันออก"
 GER_build_the_eastern_bulwark_desc: "ประเทศทางตะวันออกของเรามีแนวปองกันออนแอเกินกวาจะตานทานภัยคุกคามจาก[SOV.GetAdjective]ไดอยางเหมาะสม เราตองลงทุนสรางปอมปราการในประเทศของพวกเขา เพื่อใหการพยายามยึดครองพวกเขามีราคาแพงที่สุดสําหรับศัตรู"
 GER_build_the_eastern_bulwark_tt: "สราง§Yปอมปราการทางบก§!ระดับ 2 ในทุกรัฐที่ §Y[ROOT.GetNameDef]§! เปนเจาของ หรือประเทศใดๆ ที่ไดรับการรับประกันจากหรืออยูในฝายเดียวกับ §Y[ROOT.GetNameDef]§! ที่อยูบนพรมแดนติดกับ §Y[SOV.GetNameDef]§!"
 GER_build_the_eastern_bulwark_ns_tt: "เมื่อเขาสูสงครามกับ §Y[SOV.GetNameDef]§! เราจะไดรับ:"
 GER_ally_white_russian_forces: "เปนพันธมิตรกับขบวนการรัสเซียขาว"
 GER_ally_white_russian_forces_desc: "มีชาวรัสเซียจํานวนมากที่หนีออกนอกประเทศหลังฝายแดงชนะสงครามกลางเมืองรัสเซีย เราควรติดตอพวกเขา และดูวาพวกเขายินดีรวมมือในการยึดบานเกิดคืนหรือไม โดยแลกกับการสละการอางสิทธิ์ทั้งหมดในดินแดนที่ยกใหเราหรือพันธมิตรของเราตามสนธิสัญญาเบรสต-ลีตอฟสค"
 GER_hold_joint_military_drills: "จัดการซอมรบรวม"
 GER_hold_joint_military_drills_desc: "พันธมิตรทางตะวันออกของเราเคยรบกับชาว[SOV.GetAdjective]มาหมาดๆ กวาเรา และอาจมีความรูอันมีคาวาจะเอาชนะพวกเขาไดอยางไร เราควรจัดการซอมรบรวมกัน เพื่อใหความรูนั้นแพรหลาย"
 GER_hold_joint_military_drills_tt: "เราและประเทศยุโรปตะวันออกใดๆ ที่เรารับประกันหรืออยูในฝายของเรา จะไดรับจิตวิญญาณแหงชาติตอไปนี้:"
 GER_extend_mitteleuropas_bounderies: "ขยายเขตแดนมิทเทิลยูโรปาไปทางตะวันออก"
 GER_extend_mitteleuropas_bounderies_desc: "ชาติทางตะวันออกของเราเปนมากกวารัฐกันชน เราควรเชิญพวกเขาเขาสูมิทเทิลยูโรปา และทําใหพวกเขาชวยเสริมพันธมิตรและสหภาพศุลกากรของเราใหแข็งแกรงยิ่งขึ้น"
 GER_extend_mitteleuropas_bounderies_tt: "เชิญรัฐยุโรปตะวันออกที่ไดรับการรับประกันเขาสู§Yมิทเทิลยูโรปา§!"
 GER_reach_out_to_scandinavia: "ยื่นมือสูสแกนดิเนเวีย"
 GER_reach_out_to_scandinavia_desc: "ภูเขาและความหนาวเย็นไมอาจปกปองจากภัย[GER.GetGreatRedMenaceName] ได และชาวสแกนดิเนเวียตองรูขอนี้ เราจะเสนอสมาชิกภาพและการคุมครองจากภัยคุกคามของชาว[SOV.GetAdjective]ใหแกพวกเขา"
 GER_mitteleuropa: "มิทเทิลยูโรปา"
 GER_mitteleuropa_desc: "พื้นที่ผลประโยชนหลักของชาวเยอรมันอยูในยุโรปกลาง ซึ่งแตเดิมชาวปรัสเซียวาดภาพไวเปนจักรวรรดิที่มีรัฐเปนศูนยกลางตามแนวคิดลัทธิรวมชาติเยอรมัน แนวคิดเหลานี้อาจตองขัดเกลาบาง แตก็เปนรากฐานที่ดีสําหรับสรางระเบียบใหมในยุโรป"
 GER_mitteleuropa_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yโนมนาวมติมหาชนในออสเตรียใหเขาขางเรา§! ซึ่งทําใหพวกเขายินดียอมรับทั้งการเปนพันธมิตรและการอยูใตอํานาจมากขึ้น"
 GER_mitteleuropa_alliance: "มิทเทิลยูโรปา"
 GER_brothers_in_arms: "พี่นองรวมรบ"
 GER_brothers_in_arms_desc: "พี่นองชาวออสเตรียของเราตอสูอยางหนักเคียงขางเราในฐานะสวนหนึ่งของฝายมหาอํานาจกลาง เราควรยื่นขอเสนอที่พวกเขาปฏิเสธไมได เพื่อใหเราไดกลับมารบเคียงบาเคียงไหลกันอีกครั้ง"
 GER_carve_up_czechoslovakia: "แบงดินแดนเชโกสโลวาเกีย"
 GER_carve_up_czechoslovakia_desc: "รัฐ[CZE.GetAdjective]ขวางทางไมเพียงความทะเยอทะยานของเรา แตยังรวมถึงของพันธมิตรทางใตของเราดวย เราควรแบงดินแดนของพวกเขากันเอง เพื่อใหมิทเทิลยูโรปาเปนจริง"
 GER_rekindle_imperial_sentiment_ww: "$GER_rekindle_imperial_sentiment$"
 GER_rekindle_imperial_sentiment_ww_desc: "$GER_rekindle_imperial_sentiment_desc$"
 GER_the_first_berlin_award: "คําชี้ขาดเบอรลินครั้งที่หนึ่ง"
 GER_the_first_berlin_award_desc: "ชาวโปแลนดยึดครองไมเพียงดินแดนของเรา แตยังรวมถึงดินแดนของออสเตรีย-ฮังการีดวย เราควรพยายามขมขูใหพวกเขาคืนภูมิภาคเหลานั้นแกมิทเทิลยูโรปา มิฉะนั้นพวกเขาจะตองเผชิญความพิโรธของกองทัพเยอรมัน"
 GER_the_first_berlin_award_hun_tt: "หากเราอยูในฝายเดียวกับ §Y[HUN.GetNameDef]§!:"
 GER_the_first_berlin_award_aus_tt: "หากเราอยูในฝายเดียวกับ §Y[AUS.GetNameDef]§!:"
 GER_the_second_berlin_award: "คําชี้ขาดเบอรลินครั้งที่สอง"
 GER_the_second_berlin_award_desc: "ชาวโรมาเนียและชาวสลาฟก็ยึดครองดินแดนที่ชอบธรรมของออสเตรีย-ฮังการีอยูเชนกัน เราตองเรียกรองใหพวกเขาคืนดินแดนเหลานั้นโดยทันที!"
 GER_trade_agreements: "ขอตกลงทางการคา"
 GER_trade_agreements_desc: "มิทเทิลยูโรปาไมไดเปนเพียงพันธมิตรทางกําลัง แตยังเปนสหภาพที่ชวยสรางความสัมพันธทางการคาและความรวมมือทางเศรษฐกิจที่ดีขึ้น เราควรเนนยํ้าบทบาทนี้ และใชมันเพื่อติดตอกับชาติที่อุดมดวยทรัพยากรธรรมชาติ"
 GER_trade_agreements_tt: "พันธมิตรทั้งหมดจะไดรับ§Yจิตวิญญาณแหงชาติ§!:"
 GER_mitteleuropa_cooperation_sphere: "วงความรวมมือมิทเทิลยูโรปา"
 GER_mitteleuropa_cooperation_sphere_desc: "ยุโรปกลางมีผูมีปญญาเฉียบแหลมมากมาย แตพวกเขากลับไมอาจรวมมือกันได เพราะรัฐบาลแตละแหงตองการเก็บความรูไวกับตัวเอง เราตองสงเสริมความรวมมือทางวิทยาศาสตรที่ใกลชิดยิ่งขึ้นกับพันธมิตรของเรา"
 GER_conquer_italy: "พิชิตอิตาลี"
 GER_conquer_italy_desc: "ชาวอิตาลีทรยศเราในมหาสงครามเมื่อพวกเขาโจมตีออสเตรีย-ฮังการีและเขาขางฝายไตรภาคี เราจะไมมีวันลืม และไมมีวันใหอภัย ถึงเวลาแลวที่เราจะสอนใหพวกเขารูวาการคดโกงและการทรยศนําไปสูสิ่งใดในที่สุด"
 GER_align_italy: "ดึงอิตาลีมาเปนพวก"
 GER_align_italy_desc: "อิตาลีอาจทรยศเราในมหาสงคราม แตเราตองไมลืมวาพวกเขามีกองทัพเรือที่นาเกรงขาม ซึ่งอาจตอกรกับศัตรูของเราไดอยางสูสี ดังนั้นเราควรพยายามฟนฟูพันธมิตรเกากับพวกเขา"
 GER_the_austrian_question: "ปญหาออสเตรีย"
 GER_the_austrian_question_desc: "แนวทางเยอรมันนอยเปนความผิดพลาดที่เราตองแกไขโดยทันที เราควรบีบบังคับใหชาวออสเตรียเขารวมกับชาติเรา และอาจถือโอกาสเสนอบูรเกนลันดเพื่อแลกกับการเปนพันธมิตรกับ[HUN.GetNameDef]"
 GER_the_austrian_question_more_likely_to_accept_tt: "พวกเขามีแนวโนมจะยอมรับ§Rนอยลง§!หากขณะนี้พวกเขาเปนผูนําฝาย"
 GER_align_czechoslovakia: "ดึงเชโกสโลวาเกียมาเปนพวก"
 GER_align_czechoslovakia_desc: "รัฐเชโกสโลวักอุดมดวยขีดความสามารถทางอุตสาหกรรมและทรัพยากรธรรมชาติ ดวยเคยเปนหนึ่งในดินแดนหัวใจของการพัฒนาอุตสาหกรรมในออสเตรีย-ฮังการี เราควรใหพวกเขาเขารวมมิทเทิลยูโรปา เพื่อใหเราใชประโยชนจากความมั่งคั่งของพวกเขาได"
 GER_sway_the_balkans: "โนมนาวคาบสมุทรบอลขาน"
 GER_sway_the_balkans_desc: "มีหลายชาติในคาบสมุทรบอลขานที่รูสึกถูกคุกคามจากมหาอํานาจตางชาติ เราควรเสนอที่ทางในมิทเทิลยูโรปาใหพวกเขา เพื่อใหสหภาพของเราแข็งแกรงยิ่งขึ้นเรื่อยๆ"
 GER_sway_the_balkans_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมอุดมการณ[ROOT.GetRulingIdeology]§!ในชาติ§Yบอลขาน§! และเพื่อ§Yนําพวกเขาเขาสูมิทเทิลยูโรปา§!"
 GER_establish_a_customs_union: "จัดตั้งสหภาพศุลกากร"
 GER_establish_a_customs_union_desc: "ตามแผนในโครงการเดือนกันยายนแตเกากอน บัดนี้เราควรจัดตั้งสหภาพศุลกากรมิทเทิลยูโรปา และคอยๆ รวมเศรษฐกิจของยุโรปเขาเปนพลังอันทรงอํานาจที่สุดหนึ่งเดียวอยางมั่นคง"
 GER_integrated_economies: "เศรษฐกิจที่ผนวกรวม"
 GER_integrated_economies_desc: "การผนวกรวมเศรษฐกิจของพันธมิตรเขากับของเรา และการจัดตั้งธนาคารกลางเยอรมันที่สามารถติดตามและชวยเหลือสถานการณเศรษฐกิจของรัฐอื่น จะเปนประโยชนอยางยิ่งตอเราในระยะยาว ไมเพียงทําใหเราแข็งแกรงขึ้น แตยังเพิ่มการพึ่งพาเราของพวกเขา จนในที่สุดเราจะควบคุมกิจการตางประเทศของพวกเขาได"
 GER_integrated_economies_tt: "§Yสมาชิกฝาย§!ทุกรายจะไดรับ§Yเหตุการณ:§! [GER.GetNameDefCap]ปรารถนาจะผนวกรวมเศรษฐกิจของเราเพิ่มเติม"
 GER_european_confederation: "สมาพันธรัฐยุโรป"
 GER_european_confederation_desc: "เมื่อพันธมิตรของเราพึ่งพาเราอยางมากแลว ก็ถึงเวลาเริ่มพยายามผนวกรวมพวกเขาใหมากขึ้น ดวยความฝนที่จะสถาปนาสมาพันธรัฐยุโรป"
 GER_bring_turkey_into_the_fold: "นํา[TUR.GetNameDef]กลับคืนสูออมอก"
 GER_bring_turkey_into_the_fold_desc: "ชาวเติรกมีการอางสิทธิ์นอกพรมแดนปจจุบันของตน และจะถูกโนมนาวใหเขารวมฝายของเราไดงาย ถึงเวลาแลวที่เราจะนําพวกเขากลับคืนสูออมอกอีกครั้ง"
 GER_german_hegemony_in_the_middle_east: "ความเปนเจาของเยอรมนีในตะวันออกกลาง"
 GER_german_hegemony_in_the_middle_east_desc: "ตะวันออกกลางสุกงอมสําหรับการพิชิต และหลายรัฐอาจยินดีเขาขางเราดวยหวังวาเราจะตอตานจักรวรรดิอังกฤษหรือฝรั่งเศส ถึงเวลาแลวที่เราจะสถาปนาความเปนเจาของเราในตะวันออกกลาง"
 GER_sway_the_middle_east_decisions_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเสริมอุดมการณ[ROOT.GetRulingIdeology]§!ในชาติ§Yตะวันออกกลาง§! และเพื่อ§Yนําพวกเขาเขาสูมิทเทิลยูโรปา§!"
 GER_reject_the_locarno_treaty: "ปฏิเสธสนธิสัญญาโลคารโน"
 GER_reject_the_locarno_treaty_desc: "สนธิสัญญาโลคารโนถูกตั้งขึ้นอยางชัดเจนเพื่อขัดขวางไมใหเราทวงคืนดินแดนที่ถูกริบไปอยางไมเปนธรรม เราควรปฏิเสธสนธิสัญญานี้โดยสิ้นเชิง และเตรียมยึดรัฐเกาของเราคืน"
 GER_backdoor_negotiations: "การเจรจาลับหลัง"
 GER_backdoor_negotiations_desc: "เราอาจหลบเลี่ยงการแทรกแซงของตะวันตกในดินแดนตํ่าได ดวยการไมโจมตีทุกประเทศ แตยุใหประเทศหนึ่งโจมตีอีกประเทศหนึ่ง แลวเขาขางฝายใดฝายหนึ่ง ซึ่งจะสรางความแตกแยกระหวางชาติเกาแกในภูมิภาคเนเธอรแลนดใหญไดอยางไดผล"
 GER_backdoor_negotiations_tt: "การตัดสินใจเหลานี้ทําใหเราเพิ่มชาติเปาหมายหนึ่งเขาฝายของเรา ขณะที่โจมตีอีกชาติหนึ่ง"
 GER_schlieffen_once_more_ww: "$GER_schlieffen_once_more$"
 GER_schlieffen_once_more_ww_desc: "$GER_schlieffen_once_more_desc$"
 GER_bypass_maginot_in_the_south_ww: "$GER_bypass_maginot_in_the_south$"
 GER_bypass_maginot_in_the_south_ww_desc: "$GER_bypass_maginot_in_the_south_desc$"
 GER_reinstate_imperial_possessions_ww: "$GER_reinstate_imperial_possessions$"
 GER_reinstate_imperial_possessions_ww_desc: "$GER_reinstate_imperial_possessions_desc$"
 GER_establish_western_grand_duchies: "[GetWesternDuchiesName]"
 GER_western_duchies_name_democratic: "รัฐปกครองตนเองทางตะวันตก"
 GER_western_duchies_name_neutrality: "จัดตั้งแกรนดดัชชีทางตะวันตก"
 GER_establish_western_grand_duchies_desc: "ตามแผนในโครงการเดือนกันยายน เราควรพยายามสถาปนาการควบคุมภูมิภาคตะวันตกดวยการสรางรัฐบริวารของเราเอง และขีดเสนพรมแดนตามที่เราเห็นสมควร"
 GER_integrate_western_german_speakers: "ผนวกรวมผูพูดภาษาเยอรมันทางตะวันตก"
 GER_integrate_western_german_speakers_desc: "โครงการเดือนกันยายนวาดภาพใหพื้นที่ลักเซมเบิรกใหญผนวกรวมเขากับรัฐเยอรมัน ทั้งภูมิภาคนั้นและสวิตเซอรแลนดเคยเปนสวนหนึ่งของจักรวรรดิโรมันอันศักดิ์สิทธิ์ ซึ่งเราเปนผูสืบทอดที่ชอบธรรมเพียงหนึ่งเดียว ดินแดนเจอรแมนิกเหลานี้ตองถูกผนวกกลับเขาสูอาณาจักรของเราโดยเร็วที่สุด"
 GER_core_ardennes_tt: "หาก [ROOT.GetnameDef] §Yไมไดอยูในฝายเดียวกับ§! [BEL.GetNameDef] และ§Yควบคุมอยางสมบูรณ§! [980.GetName]:"
 GER_core_german_switzerland_tt: "หาก [ROOT.GetnameDef] §Yไมไดอยูในฝายเดียวกับ§! [SWI.GetNameDef] และ§Yควบคุมอยางสมบูรณ§! [3.GetName], [847.GetName] และ [151.GetName]:"
 GER_core_alto_adige_tt: "หาก [ROOT.GetnameDef] §Yไมไดอยูในฝายเดียวกับ§! [ITA.GetNameDef] และ§Yควบคุมอยางสมบูรณ§! [39.GetName]:"
 GER_assassinate_mussolini_ww: "ลอบสังหารมุสโสลินี"
