 GER_kdf_wagen_factories_economic_growth_text: "เมื่อสราง[GetAutobahnName]ใหมเสร็จแลว เราตองเติมถนนเหลานี้ดวยรถยนต เพื่อเปนเศรษฐกิจที่รุงเรืองและทันสมัยอยางแทจริง เราตองสรางโรงงานผลิตรถยนตเหลานี้ ซึ่งจะสรางงานและการจางงานไปพรอมกัน"
 GER_expand_the_reichsautobahn_south: "ขยาย[GetAutobahnName]ลงใต"
 GER_expand_the_reichsautobahn_south_desc: "การขยายเครือขายเอาโทบาหนลงทางใตจะกระตุนการเติบโตทางเศรษฐกิจและการพัฒนาในภูมิภาค และยังเสริมขีดความสามารถทางทหารของเรา ดวยการลําเลียงทหารสูเทือกเขาแอลปไดอยางรวดเร็ว"
 GER_expand_the_reichsautobahn_south_tt: "เพิ่ม§Y$infrastructure$§! §G1§! ใน§Y[53.GetName]§! §Y[52.GetName]§! §Y[152.GetName]§! §Y[4.GetName]§! และทางรถไฟระดับ§Y1§!จาก§Y[53.GetName]§!ไปยัง§Y[4.GetName]§! หาก§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมรัฐเหลานั้น ผลปจจุบัน:"
 GER_expand_the_reichsautobahn_east: "ขยาย[GetAutobahnName]ไปทางตะวันออก"
 GER_expand_the_reichsautobahn_east_desc: "การขยายเครือขายเอาโทบาหนไปยังปรัสเซียตะวันออกจะแสดงใหเห็นถึงความมุงมั่นของชาติเราในการเชื่อมตอและรวมดินแดนตะวันออกสุดเขากับสวนอื่นของ[ROOT.GetNameDef]อีกครั้ง และยังทําใหเราโจมตีไปทางตะวันออกไดหนักและเร็วขึ้นหากจําเปน"
 GER_expand_the_reichsautobahn_east_tt: "เพิ่ม§Y$infrastructure$§! §G1§! ใน§Y[68.GetName]§! §Y[63.GetName]§! §Y[807.GetName]§! §Y[85.GetName]§! และทางรถไฟระดับ§Y1§!จาก§Y[63.GetName]§!ไปยัง§Y[85.GetName]§! หาก§Y[ROOT.GetName]§!หรือรัฐในอารักขาของเยอรมนีควบคุมรัฐเหลานั้น ผลปจจุบัน:"
 GER_develop_heraeus_facilities: "พัฒนาศูนยวิจัยเฮเรอุส"
 GER_develop_heraeus_facilities_desc: "การลงทุนในศูนยแหงใหมจะชวยใหเราตอบสนองความตองการโลหะมีคาที่เพิ่มขึ้นซึ่งกองทัพสมัยใหมตองใช วัสดุเฉพาะทางเหลานี้มีความสําคัญยิ่งตออุปกรณอิเล็กทรอนิกสและอาวุธคุณภาพสูง"
 GER_build_the_rur_dam: "สรางเขื่อนรูร"
 GER_build_the_rur_dam_desc: "การสรางเขื่อนรูรเปนมากกวาความสําเร็จทางวิศวกรรม แตคือการลงทุนเพื่ออนาคต เขื่อนนี้ไมเพียงหนุนการพัฒนาเศรษฐกิจในภูมิภาค แตยังชวยขับเคลื่อนความพยายามทางอุตสาหกรรมและผลผลิตของเราดวย"
 GER_trade_deal_with_sweden: "ขอตกลงการคากับสวีเดน"
 GER_trade_deal_with_sweden_desc: "$GER_swedish_trade_agreement_desc$" #old loc
 GER_the_four_year_plan: "แผนสี่ป"
 GER_the_four_year_plan_desc: "$GER_four_year_plan_desc$" #old loc
 GER_autarky_efforts: "มุงสูการพึ่งพาตนเอง"
 GER_autarky_efforts_desc: "$GER_autarky_desc$" #old loc
 GER_gain_autarkic_economy_lock_free_trade_tt: "§Rล็อก§! §Y$free_trade$§! และ §Y$export_focus$§! ไดรับ §Y$autarkic_economy$§!"
 GER_improve_trade_relations_tt: "เพิ่ม§Yอิทธิพลทางการคา§!กับ§Yสมาชิกฝาย§!ทั้งในปจจุบันและอนาคต"
 GER_institute_price_controls: "ควบคุมราคา"
 GER_institute_price_controls_desc: "เราตองใชมาตรการตาง ๆ เพื่อกระชับการควบคุมการเงิน ไมใหพังทลายภายใตเปาหมายอันทะเยอทะยานในการพึ่งพาตนเอง เราตองสามารถกํากับราคาสินคานําเขา สินคาจําเปน และคาจางแรงงาน เพื่อสกัดเงินเฟอและรักษาเสถียรภาพทางเศรษฐกิจ"
 GER_unlock_price_controls_decision_tt: "ปลดล็อกการตัดสินใจ: §Y$GER_price_controls_cat$§! ซึ่งสามารถลด §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 GER_industrial_consumer_goods_factor_limit_tt: "§Y[GetIndustrialModifier]§! มี $MODIFIER_CONSUMER_GOODS_FACTOR$ §Rนอยกวา§! §Y90%§!"
