 ### GERMAN FOCUS TREE ###
 FOCUS_ICON_SET_HISTORICAL_KEY_FOCUS: "แผนยุทธศาสตรสําคัญทางประวัติศาสตร"

 GER_prioritize_economic_growth: "ใหความสําคัญกับการเติบโตทางเศรษฐกิจ"
 GER_prioritize_economic_growth_desc: "นโยบายการคลังที่ละเลยมาหลายปเกือบทําลายเศรษฐกิจของเรา เราตองสรางรถแทรกเตอรแทนรถถัง แจกพลั่วแทนปนไรเฟล และใหความสําคัญกับการเติบโตทางเศรษฐกิจแทนการขยายอุตสาหกรรมอาวุธ!"
 GER_currency_reforms: "ปฏิรูปเงินตรา"
 GER_currency_reforms_desc: "กาวแรกของการฟนฟูและพลิกฟนเศรษฐกิจคือการปฏิรูปเงินตราครั้งใหญ"
 GER_lower_taxes: "ลดภาษี"
 GER_lower_taxes_desc: "ภาระภาษีของประชาชนหนักขึ้นเรื่อย ๆ เพื่อนําไปใชจายในโครงการเสริมสรางกําลังทหาร การลดภาระนี้อาจทําใหรัฐสูญเสียรายไดในระยะสั้น แตในระยะยาวประชาชนจะสามารถใชจายเงินที่หามาอยางยากลําบากไดมากขึ้น"
 GER_workers_rights: "สิทธิแรงงาน" 
 GER_workers_rights_desc: "สหภาพแรงงานเปลี่ยนแปลงไปอยางถึงรากในชวงไมกี่ปที่ผานมา จนจําสภาพเดิมไมได ดวยการปฏิรูปสหภาพ เราจะรวมพลังแรงงานและเก็บเกี่ยวผลประโยชนได"
 GER_abolish_price_controls: "ยกเลิกการควบคุมราคา"
 GER_abolish_price_controls_desc: "มาตรการควบคุมราคาที่ใชเพื่อหนุนการเสริมสรางกําลังทหารกําลังบีบรัดเศรษฐกิจ การยกเลิกมาตรการเหลานี้อาจลดเงินทุนของรัฐ แตจะเปดทางใหประชาชนเริ่มธุรกิจใหมและกระตุนเศรษฐกิจใหเดินหนา"
 GER_increased_trade: "เพิ่มการคา"
 GER_increased_trade_desc: "หากชาวเยอรมันจะเจริญรุงเรือง เราตองนําเขาสิ่งที่เราขุดหรือสรางเองภายในพรมแดนไมได เราตองมองออกไปภายนอกและลงนามขอตกลงการคาใหมกับชาติอื่น ๆ ขอตกลงที่เปนประโยชนตอเราแนนอน"
 GER_housing_developments: "โครงการพัฒนาที่อยูอาศัย"
 GER_housing_developments_desc: "เราสามารถพลิกฟนเศรษฐกิจไดดวยการเปดโครงการพัฒนาที่อยูอาศัย มุงปรับปรุงและสรางบานสมัยใหม พรอมยกระดับมาตรฐานการครองชีพใหม"
 GER_invest_in_vereinigte_stahlwerke: "ลงทุนใน Vereinigte Stahlwerke"
 GER_invest_in_vereinigte_stahlwerke_desc: "Vereinigte Stahlwerke เปนหนึ่งในผูผลิตเหล็กกลารายใหญและสําคัญที่สุดของเรา การลงทุนทรัพยากรในบริษัทนี้จะเพิ่มผลิตภาพไดอยางแนนอน และพลิกโฉมอุตสาหกรรมเหล็กกลาของเยอรมนี"
 GER_industrial_expansion: "ขยายภาคอุตสาหกรรม"
 GER_industrial_expansion_desc: "การมีอุตสาหกรรมที่แข็งแกรง แขงขันไดในระดับนานาชาติ และบุกเบิกเทคโนโลยีใหม จะเปนหัวใจสําคัญตอการเติบโตอยางตอเนื่องของเรา [ROOT.GetNameDefCap]จะกลายเปนชื่อที่เปนตัวแทนของคุณภาพ"
 GER_agricultural_reforms: "ปฏิรูปการเกษตร"
 GER_agricultural_reforms_desc: "ภาคเกษตรของเราสวนใหญเปนฟารมครอบครัวขนาดเล็กที่ใชแรงงานคนเปนหลัก เราสามารถปฏิรูปภาคเกษตรทั้งหมดไดดวยการนําเครื่องจักรสมัยใหมเขามาใชและเพิ่มผลผลิตของฟารมแตละแหง ทั้งชาติจะไดรับประโยชน!"
 GER_urbanization: "การขยายตัวของเมือง"
 GER_urbanization_desc: "การนําเครื่องจักรสมัยใหมมาใชในการเกษตรทําใหมีแรงงานวางจํานวนมาก ซึ่งตอนนี้แหกันเขาเมืองเพื่อหางานใหม คนเหลานี้สามารถทําประโยชนในโรงงานของเรา และชวยใหเศรษฐกิจของเราเปนหนึ่งในเศรษฐกิจที่แข็งแกรงที่สุดในโลกตอไป"
 GER_wirtschaftswunder: "ปาฏิหาริยทางเศรษฐกิจ (Wirtschaftswunder)"
 GER_wirtschaftswunder_desc: "โครงการและการริเริ่มทั้งหมดเพื่อพลิกฟนเศรษฐกิจของเราไดผลในที่สุด! ผูคนทั่วโลกตางทึ่งในการฟนตัวทางการเงินและอุตสาหกรรมของเรา และเรียกมันวา ‘Wirtschaftswunder’ หรือปาฏิหาริยทางเศรษฐกิจ"
 GER_mass_production: "การผลิตจํานวนมาก"
 GER_mass_production_desc: "ดวยความกาวหนาทางอุตสาหกรรมทั้งหมดที่เราทําไดในระยะหลัง เราไดเรียนรูมากมายเกี่ยวกับปจจัยการผลิต เราควรนําความรูและความเขาใจใหมทั้งหมดนี้มาปรับสายการประกอบใหคลองตัว และผลิตยุทโธปกรณในระดับที่ไมเคยมีมากอน"
 GER_build_defense_industry: "สรางอุตสาหกรรมปองกันประเทศ"
 GER_build_defense_industry_desc: "เมื่อในที่สุดเราสามารถทําใหเศรษฐกิจมีเสถียรภาพ และยังแข็งแกรงขึ้นหลายเทา บัดนี้เราสามารถหันมาใหความสําคัญกับการรักษาอธิปไตยของชาติ และสรางอุตสาหกรรมปองกันประเทศที่แทจริง เพื่อปกปองความขยันขันแข็งและแรงผลักดันสูความกาวหนาและความเปนเลิศของชาวเยอรมัน"
 GER_war_production: "การผลิตเพื่อสงคราม"
 GER_war_production_desc: "สงครามไดกลืนกินเราอีกครั้ง แตเราจะไมยอทอและจะไมลมลง! เราจะระดมแสนยานุภาพทางอุตสาหกรรมและผลิตใหเหนือกวาศัตรูใดก็ตามที่โงเขลาพอจะคิดวาบดขยี้เจตจํานงอันไมยอมงอของชาวเยอรมันได!"
