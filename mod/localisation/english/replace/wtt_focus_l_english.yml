l_english:
 CHI_secure_internal_politics: "รักษาเสถียรภาพการเมืองภายใน"
 CHI_secure_internal_politics_desc: "หากรัฐบาลของเราจะอยูรอดทามกลางความยุงเหยิงอันสับสนของการเมืองจีน เราตองไมถูกเบี่ยงเบนความสนใจดวยการทะเลาะเบาะแวงภายใน ฝายคานภายในทั้งหมดตองถูกถอนรากถอนโคน"
 CHI_strenghten_warlord_authority: "เสริมอํานาจขุนศึก"
 CHI_strenghten_warlord_authority_desc: "เพื่อรักษาเขตอํานาจของเราและไมใหถูกบอนทําลายโดยกกมินตั๋ง คอมมิวนิสต และญี่ปุน เราตองเสริมสรางอํานาจของ [ROOT.GetLeader]"
 CHI_uplift_the_cavalry_regiments: "ยกระดับกรมทหารมา"
 CHI_uplift_the_cavalry_regiments_desc: "ภูมิภาคของเรามีประเพณีอันยาวนานและนาภาคภูมิใจดานการขี่มาและการทรงมา เราควรเชิดชูประเพณีเหลานี้ ใหทหารมาของเราไดรับการยกยองสูงสุด และอยูแถวหนาของกองทัพ"
 CHI_uplift_the_mountain_brigades: "ยกระดับกองพลนอยภูเขา"
 CHI_uplift_the_mountain_brigades_desc: "ดินแดนตอนในของจีนนั้นทุรกันดารและเดินทางผานไดยาก ดังนั้นเราจึงตองฝกกองพลนอยพิเศษเพื่อรบในภูมิประเทศเนินเขาและภูเขา เพื่อใหเราปกปองดินแดนของเราไดอยางเหมาะสม"
 CHI_cooperation_with_the_nationalists: "รวมมือกับฝายชาตินิยม"
 CHI_cooperation_with_the_nationalists_desc: "ฝายชาตินิยมเปนโอกาสดีที่สุดในการรวมประเทศและเอาชนะญี่ปุน เราควรทําใหแนใจวาพวกเขาไมมองเราเปนภัยคุกคาม"
 CHI_cooperation_with_the_nationalists_effect_tooltip: "[WTT_communist_china.GetNameDefCap] และขุนศึกที่เขาขางคอมมิวนิสตอาจเริ่ม§Hความขัดแยงตามแนวชายแดน§!กับเราเพื่อตอบโตสิ่งนี้"
 CHI_technological_cooperation: "ความรวมมือทางเทคโนโลยี"
 CHI_technological_cooperation_desc: "ความรวมมือกับรัฐบาลกลางจะทําใหเราเขาถึงเทคโนโลยีใหม ๆ ที่พวกเขาพัฒนาได"
 CHI_new_model_province: "มณฑลตนแบบแหงใหม"
 CHI_new_model_province_desc: "ขณะที่รัฐบาลกลางดิ้นรนลากประเทศเขาสูยุคสมัยใหม เราจะดําเนินการปฏิรูปในขอบเขตที่เล็กกวามาก และจะไดรับการยกยองวาเปนประภาคารแหงความกาวหนา ตัดกับความลาหลังของสวนอื่นในประเทศ"
 CHI_root_out_corruption: "ถอนรากการทุจริต"
 CHI_root_out_corruption_desc: "ตลอดหลายทศวรรษ เจาหนาที่รัฐใชตําแหนงในทางมิชอบเพื่อหาประโยชนใสกระเปาตัวเองและกดขี่ประชาชน ทั้งยังเมินเฉยตออาชญากรที่ยัดเงินใสกระเปาพวกเขา เรื่องนี้ตองจบลงเดี๋ยวนี้"
 CHI_embrace_the_opium_trade: "เปดรับการคาฝน"
 CHI_embrace_the_opium_trade_desc: "ประเทศตองมีเงินจึงจะดําเนินไปได ในสถานการณปจจุบัน เราเลือกแหลงที่มาของเงินมากนักไมได"
 CHI_land_reform: "ปฏิรูปที่ดิน"
 CHI_land_reform_desc: "คอมมิวนิสตกําลังดําเนินโครงการจัดสรรที่ดินใหมอยางดุดัน ทําใหไดผูสนับสนุนมากมายในหมูชาวนา เราควรดําเนินโครงการที่ไมสุดโตงเทาเพื่อดึงประชาชนมาอยูฝายเรา"
 CHI_reform_the_administration: "ปฏิรูปการบริหาร"
 CHI_reform_the_administration_desc: "ความพยายามทั้งหมดของเราในระดับรัฐบาลจะสูญเปลาหากไมไดนําไปปฏิบัติในระดับทองถิ่น เราตองทําใหแนใจวาเจาหนาที่ในพื้นที่มีทั้งความสามารถและความเต็มใจที่จะปฏิบัติตามคําสั่งของเรา"
 CHI_join_the_republican_government: "เขารวมรัฐบาลสาธารณรัฐ"
 CHI_join_the_republican_government_desc: "เมื่อดินแดนของเราเขมแข็งและรัฐบาลไดรับการปฏิรูปแลว ถึงเวลาที่จะเขาหารัฐบาลกลางและเรียกรองที่นั่งบนโตะเจรจา เมื่อเราเปนฝายที่ไดรับการยอมรับในรัฐบาลแลว เราจะใชความชอบธรรมที่เพิ่งไดมานี้สรางแรงสนับสนุนในรัฐอื่น ๆ เพื่อขยายฐานอํานาจของเรา"
 CHI_power_struggle: "การชวงชิงอํานาจ"
 CHI_power_struggle_desc: "อิทธิพลทางการเมืองของเราตอกิจการของรัฐเพิ่มขึ้นอยางมาก บัดนี้เราสามารถเขาหาประเทศอื่น ๆ ในฐานะที่เทาเทียมกันไดแลว"
 china_nationalist_focus: "ผังยุทธศาสตรของจีนคณะชาติ"
 china_communist_focus: "ผังยุทธศาสตรของจีนคอมมิวนิสต"
 CHI_cooperation_with_the_communists: "รวมมือกับฝายคอมมิวนิสต"
 CHI_cooperation_with_the_communists_desc: "กกมินตั๋งพยายามสรางชาติสมัยใหมแตลมเหลว ประเทศแตกแยกกวาที่เคยเปนมา ชาวนาอยูอยางหวาดกลัวรัฐบาล การทุจริตแพรระบาดในรัฐบาลทุกระดับ และพวกจักรวรรดินิยมญี่ปุนก็จออยูหลังพรมแดน บางทีคอมมิวนิสตอาจเปนวิสัยทัศนที่ดีกวาสําหรับอนาคต"
 CHI_cooperation_with_the_communists_effect_tooltip: "ขุนศึกที่เขาขางฝายชาตินิยมอาจเริ่ม§Hความขัดแยงตามแนวชายแดน§!กับเราเพื่อตอบโตสิ่งนี้\n"
 CHI_land_redistribution: "จัดสรรที่ดินใหม"
 CHI_land_redistribution_desc: "ชาวนาถูกเจาที่ดินขูดรีดอยางโหดราย ทั้งที่พวกเขาเปนรากฐานของเศรษฐกิจของเรา การทําใหผูที่ทํานาบนผืนดินเปนผูที่ไดเปนเจาของผืนดินนั้นจริง ๆ จะนําไปสูสังคมที่เปนธรรมและมีผลิตภาพมากขึ้น"
 CHI_ideological_education: "การศึกษาเชิงอุดมการณ"
 CHI_ideological_education_desc: "รากฐานแหงความสําเร็จในอนาคตของเราถูกสรางขึ้นในวันนี้ คนรุนตอไปตองไดรับการสั่งสอนถึงสัจธรรมพื้นฐานที่วาประวัติศาสตรทั้งปวงคือประวัติศาสตรของการตอสูทางชนชั้น และบทบาทของพวกเขาในนั้น"
 CHI_land_value_tax: "ภาษีมูลคาที่ดิน"
 CHI_land_value_tax_desc: "การเก็บภาษีจากที่ดินโดยตรงทําใหเรามีระบบภาษีที่มั่นคงและเปนธรรมกวามาก โดยเก็บเงินจากผูที่มีเหลือมากที่สุด"
 CHI_judiciary_reforms: "ปฏิรูปตุลาการ"
 CHI_judiciary_reforms_desc: "หากการบริหารของเราจะสรางความเปลี่ยนแปลงได เราตองทําใหแนใจวาผูพิพากษาทุกคนไดรับการศึกษาเพียงพอที่จะใชกฎหมายของเราไดอยางถูกตอง"
 CHI_communist_administrators: "ผูบริหารคอมมิวนิสต"
 CHI_communist_administrators_desc: "ผูบริหารหัวเกายึดติดกับแนวคิดเดิมเกินกวาจะโนมนาวใหคิดแบบเราได เราควรแทนที่พวกเขาทั้งหมดดวยผูบริหารรุนใหมที่อายุนอยกวาและมีแนวคิดกาวหนากวา"
 CHI_join_the_chinese_soviet: "เขารวมโซเวียตจีน"
 CHI_join_the_chinese_soviet_desc: "การปฏิวัติจะสําเร็จไดก็ตอเมื่อคอมมิวนิสตยืนหยัดรวมกัน แนนอนวาเราตองทําใหแนใจวาไมมีกลุมตอตานการปฏิวัติภายในพรรคพยายามทําใหการปฏิวัติตกราง กอนที่มันจะเริ่มตนเสียดวยซํ้า"
 CHI_the_yanan_incident: "อุบัติการณเหยียนอาน"
 CHI_the_yanan_incident_effect_tt: "ขอการสนับสนุนจาก §H[SOU.GetNameDef]§! เพื่อแทนที่ §H[WTT_communist_china.GetNameDef]§! ในฐานะผูนําคอมมิวนิสต\nสิ่งนี้จะนําไปสูสงครามกับ §H[WTT_communist_china.GetNameDef]§! หากพวกเขาปฏิเสธ\nขอตกลงกับ §H[SOU.GetNameDef]§! นี้จะทําใหเราตองเผชิญขอเรียกรองจาก [SOU.GetLeader]\n"
 CHI_the_yanan_incident_desc: "ผูนําพรรคคนปจจุบันไดหันหลังใหพี่นองสังคมนิยมในสหภาพโซเวียต เราควรเขาหาโซเวียตเพื่อขอการสนับสนุนในการนําการปฏิวัติไปทั่วทั้งจีน"
 CHI_opposition: "ฝายตอตาน"
 CHI_opposition_effect_tooltip: "§H[WTT_current_china_leader.GetNameDef]§! อาจเริ่มสงครามชายแดนกับเราเพื่อตอบโตสิ่งนี้"
 CHI_opposition_desc: "รัฐบาลกลางทั้งฉอฉลและออนแอ สวนคอมมิวนิสตก็ตองการทําลายประวัติศาสตรจีน 5000 ป สถานการณเชนนี้ตองการผูนําผูยิ่งใหญ ผูที่พรอมจะตัดสินใจเรื่องยากและรวมประเทศใหเปนหนึ่ง ไมวาจะตองใชวิธีการใดก็ตาม"
 CHI_public_works: "โครงการสาธารณะ"
 CHI_public_works_desc: "ประชาชนตองไดเห็นวาเราทํางานเพื่อประโยชนของพวกเขา โครงการที่โดดเดนไมกี่โครงการจะเปนเครื่องมือโฆษณาชวนเชื่อที่มีประโยชน และทําใหพวกเขาไดลิ้มรสวาจีนทั้งประเทศจะเปนอยางไรหากพวกเขาสนับสนุนเรามากขึ้น"
 CHI_labor_reform: "ปฏิรูปแรงงาน"
 CHI_labor_reform_desc: "วิธีการและธรรมเนียมการทํางานในจีนพัฒนามานับพันป ถึงเวลาที่จะนํามันเขาสูยุคสมัยใหมแลว"
 CHI_rural_militias: "กองอาสารักษาดินแดนชนบท"
 CHI_rural_militias_desc: "ในชนบทอันกวางใหญ การสนับสนุนทางทหารมักใชเวลานานกวาจะไปถึงจุดที่ถูกรุกลํ้า การจัดตั้งกองอาสาทองถิ่นจะทําใหผูรุกรานใด ๆ เคลื่อนผานชนบทของเราไดยาก"
 CHI_war_taxes: "ภาษีสงคราม"
 CHI_war_taxes_desc: "ยามคับขันตองใชมาตรการเด็ดขาด ขณะที่สงครามยังดําเนินอยู เราตองระดมทรัพยากรทางเศรษฐกิจของประชาชนใหไดมากที่สุดเทาที่จะทําได"
 CHI_seek_japanese_support: "แสวงหาการสนับสนุนจากญี่ปุน"
 CHI_seek_japanese_support_desc: "ทั้งรัฐบาลกลางและคอมมิวนิสตตางมีพันธมิตรที่ทรงพลัง หากเราตองการเปนผูยิ่งใหญเหนือใครเมื่อทุกอยางจบลง เราก็ตองหาผูคุมครองของเราเองเชนกัน"
 CHI_personal_leadership: "การนําโดยตัวผูนําเอง"
 CHI_personal_leadership_desc: "การแบงอํานาจบัญชาการกองทัพเสี่ยงตอการที่นายทหารผูทะเยอทะยานเกินฐานะจะพยายามแยงชิงอํานาจ เราตองทําใหแนใจวาทหารของเราจงรักภักดีตอรัฐบาลเสมอ"
 CHI_personal_leadership_tt: "§Yเฉิน จี้ถัง§! พรอมเปนจอมพลระดับ §Y3§!"
 CHI_personal_leadership_custom_tt: "[ROOT.GetLeader] ไดรับคุณลักษณะหนึ่งตอไปนี้แบบสุม: §Y$brilliant_strategist$§!, §Y$career_officer$§!, §Y$cavalry_officer$§!, §Y$infantry_officer$§!, §Y$old_guard$§!, §Y$politically_connected$§!, §Y$war_hero$§!"
 CHI_cult_of_personality: "ลัทธิบูชาตัวบุคคล"
 CHI_cult_of_personality_desc: "ประชาชนตองรูวาใครคือผูนําพาพวกเขาผานวันเวลาอันมืดมนนี้ไปสูอนาคตอันสดใส รวมถึงคุณสมบัติอันโดดเดนมากมายของบุรุษผูนั้น"
 CHI_provoke_border_clashes: "ปะทะชายแดนกับฝายชาตินิยม"
 CHI_provoke_border_clashes_desc: "เรายังไมอาจเสี่ยงทําสงครามเต็มรูปแบบไดในตอนนี้ ความขัดแยงขนาดเล็กที่จํากัดขอบเขตจะชวยใหเราไดดินแดนอันมีคาโดยไมถูกบดขยี้ไปเสียกอน ทางที่ดีที่สุดคือเราจะโจมตีในจังหวะที่ศัตรูทุมกําลังไปที่อื่น"
 CHI_defensive_posture: "ทาทีตั้งรับ"
 CHI_defensive_posture_desc: "ความขัดแยงนี้คือการวิ่งมาราธอน ไมใชการวิ่งระยะสั้น การทาทายฝายอื่นเร็วเกินไปจะนํามาซึ่งหายนะ ในตอนนี้เราจะคงอยูในทาทีตั้งรับ"
 CHI_rapid_mobilization: "ระดมพลอยางรวดเร็ว"
 CHI_rapid_mobilization_desc: "เพื่อเปนผูทาชิงที่มีศักยภาพในการเปนผูนําจีน เราตองขยายขนาดกองทัพ เราจะพัฒนาวิธีการใหมเพื่อทําใหการฝกมีประสิทธิภาพ และสรางกองทัพที่รับมือกับทุกความทาทายได"
 CHI_proclaim_rival_government: "ประกาศรัฐบาลคูแขง"
 CHI_proclaim_rival_government_desc: "ถึงเวลาที่จะประกาศความทะเยอทะยานของเราอยางเปนทางการ เราตองการการควบคุมจีนอยางสมบูรณ ไมนอยไปกวานั้น และเราจะเจรจากับสวนอื่นของโลกอยางเทาเทียม"
 CHI_industrial_investment: "การลงทุนทางอุตสาหกรรม"
 CHI_industrial_investment_desc: "แมทรัพยากรของเราอาจมีจํากัด เราก็ควรทุมทุนเทาที่มีไปกับการพัฒนาเศรษฐกิจ"
 CHI_public_education_reform: "ปฏิรูปการศึกษาสาธารณะ"
 CHI_public_education_reform_desc: "รากฐานของชาติสมัยใหมคือความรูและวิทยาศาสตร เราตองพัฒนาและเสริมสรางรากฐานนั้นเปนอันดับแรก"
 CHI_local_arms_production: "การผลิตอาวุธในทองถิ่น"
 CHI_local_arms_production_desc: "ตราบใดที่เรายังถูกมองวาเปนเพียงกลุมยอยที่ไมสําคัญในสงคราม เราก็ไมอาจพึ่งพาการสงอาวุธจากภายนอกได เราจะตองพัฒนาคลังแสงของเราเองเพื่อสรางอาวุธ"
 CHI_long_term_economic_planning: "การวางแผนเศรษฐกิจระยะยาว"
 CHI_long_term_economic_planning_desc: "กลไกระบบราชการของเราไมไดใหญเทาของรัฐบาลกลาง ทําใหเราตัดขั้นตอนยุงยากที่ขัดขวางการพัฒนาเศรษฐกิจไดมาก และทุมความพยายามอันเล็กนอยของเราเพื่อใหไดผลตอบแทนสูงสุดเทาที่เปนไปได"
 CHI_local_arms_development: "การพัฒนาอาวุธในทองถิ่น"
 CHI_local_arms_development_desc: "การผลิตปนตางชาติแบบลอกเลียนหยาบ ๆ นั้นไมเพียงพอ หากเราตองการตามจีนสวนอื่นใหทัน เราตองพัฒนาอาวุธใหม"
 90_days_tt: "จะใชเวลาดําเนินการประมาณ 90 วัน\n"
 CHI_heavy_weapons_development: "การพัฒนาอาวุธหนัก"
 CHI_heavy_weapons_development_desc: "เมื่อทรัพยากรขาดแคลน เราตองใชอํานาจการยิงหนักอันนอยนิดที่มีอยูใหเกิดประโยชนสูงสุด เราควรสั่งใหพัฒนาปนใหญรุนใหม"
 CHI_anti_opposition_campaigns: "การรณรงคตอตานฝายตรงขาม"
 CHI_anti_opposition_campaigns_desc: "ศัตรูของเรากําลังรวมตัวกันอยูถัดจากพรมแดนของเรา เราไมอาจปลอยใหพวกมันอยูตรงนั้นโดยไมมีการควบคุมได การรุกขนาดเล็กหลายครั้งจะผลักพวกมันกลับไปและใหพื้นที่แกเรามากขึ้น"
 CHI_anti_opposition_campaigns_effect_tooltip: "ปลดล็อก £decision_icon_small §Hการตัดสินใจ§! เพื่อเริ่ม§Hความขัดแยงตามแนวชายแดน§!กับขุนศึกที่ไมไดรวมมือกับฝายเดียวกับเรา\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_communists: "§Rยังไมมีขุนศึกคนใดเขาขางคอมมิวนิสต§!\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_nationalists: "§Rยังไมมีขุนศึกคนใดเขาขางฝายชาตินิยม§!\n"
 CHI_institute_cross_border_raids: "จัดการจูโจมขามพรมแดน"
 CHI_institute_cross_border_raids_desc: "เราจะไมไดรับการยอมรับในฐานะผูทาชิงอิสระในการชวงชิงความเปนผูนําของจีน เวนแตเราจะแสดงใหโลกเห็นวาเราสามารถและพรอมจะสูเพื่อดินแดนของเรา การรุกลํ้าเล็ก ๆ นอย ๆ จะแสดงถึงความมุงมั่นของเรา และอาจทําใหเรายึดดินแดนที่ไมมีการปองกันไดบาง"
 CHI_institute_cross_border_raids_effect_tooltip: "ปลดล็อก £decision_icon_small §Hการตัดสินใจ§! เพื่อเริ่ม§Hความขัดแยงตามแนวชายแดน§!กับขุนศึกและ [WTT_communist_china.GetNameDef]\n"
 CHI_provoke_border_clashes_effect_tooltip: "ปลดล็อก £decision_icon_small §Hการตัดสินใจ§! เพื่อเริ่ม§Hความขัดแยงตามแนวชายแดน§!กับ [WTT_current_china_leader.GetNameDef]\n"
 CHI_inflation_up_tt: "§Rเพิ่ม§!ภาวะเงินเฟอ\n"
 CHI_inflation_down_tt: "§Gลด§!ภาวะเงินเฟอ\n"
 CHI_invite_foreign_investors: "เชิญนักลงทุนตางชาติ"
 CHI_invite_foreign_investors_desc: "แมจะนาอัปยศเพียงใด แตวิธีที่ดีที่สุดในการพัฒนาอุตสาหกรรมของชาติก็คือการเขาหาคนกลุมเดียวกับที่เคยขูดรีดเรามา"
 CHI_mission_to_germany: "คณะผูแทนสูเยอรมนี"
 CHI_mission_to_germany_desc: "ชาติที่ถูกรังเกียจแหงยุโรปไดกาวหนาอยางมากในการปฏิรูปประเทศและฟนคืนความรุงเรืองในอดีต เราสามารถเรียนรูจากพวกเขาไดมาก"
 CHI_give_falkenhausen_citizenship: "มอบสัญชาติใหฟลเคินเฮาเซิน"
 CHI_give_falkenhausen_citizenship_desc: "ที่ปรึกษาชาวเยอรมันไดทํางานอยางยอดเยี่ยมในการฟนฟูและปรับปรุงกองทัพของเราใหทันสมัย เราควรทําใหแนใจวาพวกเขาจะอยูที่นี่ได ไมวาสถานการณทางการเมืองจะเปลี่ยนไปอยางไร"
 falkenhausen_tt: "มีประเทศอื่นเสนอสัญชาติใหฟอน ฟลเคินเฮาเซินไปแลว"
 CHI_chinese_general_staff: "เสนาธิการทหารจีน"
 CHI_chinese_general_staff_desc: "กองเสนาธิการที่จัดระเบียบอยางดีคือกุญแจสําคัญในการวางแผนปฏิบัติการที่ซับซอน เราควรเรียนรูจากแบบอยางของเยอรมนีและจัดตั้งองคกรที่คลายกัน"
 CHI_wargaming_division: "แผนกจําลองยุทธ"
 CHI_wargaming_division_desc: "เราควรจัดตั้งแผนกพิเศษในกองเสนาธิการที่มุงเนนการคาดการณสงครามในอนาคต และพัฒนายุทธวิธีและยุทธศาสตรใหม ๆ เพื่อเอาชนะศัตรู พวกเขาอาจใชอุปกรณคํานวณบางอยางเพื่อจําลองสงครามโลกก็ได..."
 CHI_closer_ties_with_germany: "กระชับความสัมพันธกับเยอรมนี"
 CHI_closer_ties_with_germany_desc: "คณะผูแทนของเราที่ไปเยอรมนีไดเปดโอกาสใหเกิดความรวมมือที่มากยิ่งขึ้น รวมถึงเงินกูเพื่อเปนทุนในการพัฒนาอุตสาหกรรมตอไป"
 CHI_purchase_tanks: "จัดซื้อรถถัง"
 CHI_purchase_tanks_desc: "ยานเกราะจะเปนหัวหอกของการสงครามสมัยใหม เราควรจัดซื้อรถถังจํานวนไมมากเพื่อเตรียมจัดตั้งหนวยยานเกราะชุดแรกของกองทัพจีน"
 CHI_chinese_panzers: "แพนเซอรจีน"
 CHI_chinese_panzers_desc: "รถถังเยอรมันเปนรถถังที่ดีที่สุดในโลกอยางไมตองสงสัย เราควรเรียนรูจากแบบอยางของพวกเขาและพัฒนารถถังของเราเองตามแบบนั้น"
 CHI_tank_plant: "โรงงานรถถัง"
 CHI_tank_plant_desc: "เมื่อการวิจัยรถถังรุนใหมคืบหนาไป บัดนี้เราสามารถลงทุนสรางโรงงานเฉพาะเพื่อผลิตรถถังไดแลว"
 CHI_experimental_mechanised_unit: "หนวยยานยนตทดลอง"
 CHI_experimental_mechanised_unit_effect: "ไดรับกองพลที่มีกองพัน§Yรถถังเบา§! 2 กองพันและ§Yยานยนต§! 4 กองพัน\n"
 CHI_experimental_mechanised_unit_desc: "นักทฤษฎีในยุโรปถกเถียงกันมานานถึงวิธีใชรถถังที่ดีที่สุด ดูเหมือนวาหนวยที่ผสมผสานทหารราบเคลื่อนที่เร็วเขากับรถถังที่วองไวจะเปนแนวทางที่ดีที่สุด เราจะจัดตั้งหนวยเชนนี้ขึ้น"
 CHI_combined_arms_warfare: "การรบแบบผสมเหลา"
 CHI_combined_arms_warfare_desc: "แมรถบรรทุกจะดีพอสําหรับการทดลองขั้นตนในการสงครามยานยนตสมัยใหม แตสมรรถนะการเคลื่อนที่ในภูมิประเทศที่ยํ่าแยและการไรเกราะทําใหไมเหมาะกับการปฏิบัติการในแนวหนา"
 CHI_hire_soviet_designer: "จางนักออกแบบโซเวียต"
 CHI_hire_soviet_designer_desc: "โซเวียตทดลองกับรถถังมาเปนเวลานาน และมีนักออกแบบรถถังที่ดีที่สุดคนหนึ่งของโลก เราอาจจางหนึ่งในนั้นมาออกแบบยานรบหุมเกราะใหเรา"
 CHI_joint_tank_development: "พัฒนารถถังรวมกัน"
 CHI_joint_tank_development_desc: "หลังจากไดประสบการณจากการทํางานกับนักออกแบบโซเวียต เราควรจัดตั้งทีมออกแบบรวมเพื่อประสานงานไดดีขึ้นและเรียนรูจากกันและกัน"
 CHI_mission_to_the_soviet_union: "คณะผูแทนสูสหภาพโซเวียต"
 CHI_mission_to_the_soviet_union_desc: "สหภาพโซเวียตแสดงความสนใจในจีน โดยมีจุดประสงคหลักเพื่อสรางดุลถวงตอการขยายอํานาจของญี่ปุน เราควรสงคณะผูแทนไปมอสโกเพื่อดูวาเปาหมายของเราสอดคลองกันหรือไม"
 CHI_rapprochement_with_soviet_union: "ฟนสัมพันธกับสหภาพโซเวียต"
 CHI_rapprochement_with_soviet_union_desc: "แมเราอาจมีความแตกตางทางอุดมการณกับสหภาพโซเวียตอยูบาง แตก็ชัดเจนวาพวกเขามีผลประโยชนเดียวกับเรา เราควรทําใหความสัมพันธใหมนี้เปนทางการและลงนามในสนธิสัญญาไมรุกรานซึ่งกันและกัน เพื่อแสดงใหโลกเห็นวาเรายืนหยัดเคียงขางกัน"
 CHI_invite_soviet_advisers: "เชิญที่ปรึกษาโซเวียต"
 CHI_invite_soviet_advisers_desc: "โซเวียตเสนอที่จะสงคณะผูแทนทางทหารมาชวยเราฟนฟูกองทัพ"
 soviet_advisers_tt: "โซเวียตไดสงคณะผูแทนทางทหารไปยังกลุมหนึ่งในจีนแลว"
 CHI_the_soviet_volunteer_group_focus: "กองอาสาสมัครโซเวียต"
 CHI_the_soviet_volunteer_group_focus_desc: "กองทัพอากาศของเรายังคงมีกําลังนอยอยางนาเวทนาเมื่อเทียบกับมหาอํานาจอื่นในภูมิภาค โซเวียตดูเหมือนจะเปดรับความเปนไปไดในการสงกองอาสาสมัครมาให"
 CHI_reach_out_to_france: "ยื่นมือสูฝรั่งเศส"
 CHI_reach_out_to_france_desc: "แมฝรั่งเศสจะเคยทําใหเราอับอายหลายครั้งและบังคับใหเรายอมสัมปทานใหม ๆ แตในสถานการณปจจุบัน เราอาจจําเปนตองพึ่งความชวยเหลือจากพวกเขาก็ได"
 CHI_small_arms_expertise: "ความเชี่ยวชาญดานอาวุธเบา"
 CHI_small_arms_expertise_desc: "ปนเล็กยาวประจําตัวยังคงเปนอาวุธชี้ขาดในกองทัพของเรา เราควรทุมทรัพยากรอันนอยนิดเพื่อใหทันสมัยที่สุดเทาที่ทําไดในดานนี้"
 CHI_elite_mountaineers: "ทหารภูเขาชั้นยอด"
 CHI_elite_mountaineers_desc: "การรบในเทือกเขาสูงนั้นแตกตางจากการรบบนที่ราบอยางสิ้นเชิง เราควรฝกกองพลเฉพาะทางในศาสตรนี้เพื่อใชประโยชนจากภูมิประเทศของเราใหดีที่สุด"
 CHI_free_mountain_template_tt: "ไดรับแมแบบที่มีกองพัน§Yทหารภูเขา 7§! กองพันและ§Yปนใหญ 2§! กองพัน\n"
 CHI_heavy_weapons: "อาวุธหนัก"
 CHI_heavy_weapons_desc: "กองทัพที่ไมมีปนใหญสนับสนุนจะไมสามารถตานทานการโจมตีที่จริงจังใด ๆ ได เราตองทําใหแนใจวากองทัพของเรามียุทโธปกรณดานนี้อยางเพียงพอ"
 CHI_guarantee_the_hanoi_route: "คํ้าประกันเสนทางฮานอย"
 CHI_guarantee_the_hanoi_route_desc: "เสนทางผานฮานอยขึ้นเหนือมายังพรมแดนของเราใหการสนับสนุนจากโลกภายนอกไดมากที่สุดเทาที่เปนไปได หากเกิดสงครามกับญี่ปุน"
 CHI_construction_battalions: "กองพันกอสราง"
 CHI_construction_battalions_desc: "หากมีสิ่งหนึ่งที่ประเทศเรามีอยางลนเหลือ สิ่งนั้นก็คือผูคน เราสามารถจัดตั้งหนวยพิเศษที่ตองการเพียงพลั่วในการทํางานวิศวกรรมทหารที่จําเปน"
 CHI_french_military_mission: "คณะผูแทนทางทหารฝรั่งเศส"
 CHI_french_military_mission_desc: "กองทัพฝรั่งเศสเปนกองทัพที่ไดรับการฝกดีที่สุดแหงหนึ่งในยุโรป เราสามารถเรียนรูจากพวกเขาไดมาก"
 CHI_french_drill: "การฝกแบบฝรั่งเศส"
 CHI_french_drill_desc: "ประสบการณของฝรั่งเศสในมหาสงครามไดสรางกองทัพที่เปนเลิศดานการตั้งรับ การนําวิธีการและมาตรฐานการฝกของพวกเขามาใชจะชวยพัฒนาขีดความสามารถในการปองกันของเราเอง"
 CHI_modern_logistics: "การสงกําลังบํารุงสมัยใหม"
 CHI_modern_logistics_desc: "หากไมมีระบบการสงกําลังบํารุงที่ใชการได เราจะไมสามารถรักษากองทัพไวในสนามรบได"
 CHI_renegotiate_the_unequal_treaties: "เจรจาสนธิสัญญาไมเปนธรรมใหม"
 CHI_renegotiate_the_unequal_treaties_desc: "ชาวตะวันตกกําหนดวาเราควรทําธุรกิจภายในพรมแดนของเราเองอยางไรมานานเกินไปแลว พลเมืองของพวกเขาไดรับการคุมครองจากกฎหมายของเรา และเราไมมีสิทธิ์มีเสียงวาพวกเขาจะทําธุรกิจในเมืองของเราอยางไร เรื่องนี้ตองจบลง เราจะยืนหยัดอยางเทาเทียมกับพวกเขาอีกครั้ง"
 CHI_one_china_policy: "นโยบายจีนเดียว"
 CHI_one_china_policy_desc: "ในความวุนวายหลังการปฏิวัติ หลายพื้นที่แยกตัวออกไปและพยายามตั้งรัฐของตนเอง บางแหงเพียงแคเลิกฟงรัฐบาลกลาง บางแหงก็ทําราวกับวาตนเปนรัฐอธิปไตยอีกครั้ง บัดนี้เมื่อเราเขมแข็งแลว เราจะประกาศตอสาธารณะวาเราอางสิทธิ์เหนือพรมแดนจีนดั้งเดิมที่มีมานานหลายศตวรรษ"
 CHI_integrate_tibet: "ผนวกรวมทิเบต"
 CHI_integrate_tibet_desc: "การทดลองเอกราชของทิเบตสิ้นสุดลงแลว การรุกรานทางทหารก็เปนทางเลือกหนึ่ง แตเราควรพยายามนําพวกเขากลับคืนมาดวยสันติวิธี"
 CHI_conquer_tibet: "พิชิตทิเบต"
 CHI_conquer_tibet_desc: "ทิเบตตั้งอยูบนภูมิประเทศที่สําคัญยิ่งทางยุทธศาสตรระหวางเรากับอินเดีย พวกเขาออนแอเกินกวาจะปองกันตนเองได เราตองเขาแทรกแซงเพื่อปกปองปกดานใตของเรา"
 CHI_renounce_the_mcmahon_line: "ไมยอมรับเสนแม็กมาฮอน"
 CHI_renounce_the_mcmahon_line_desc: "พรมแดนเกาที่ขีดขึ้นระหวางรัฐบาลจักรวรรดิกับอังกฤษไมเคยถูกตอง แมในตอนที่อังกฤษแสรงวาเคารพมันก็ตาม หลายทศวรรษที่ผานมาเราออนแอเกินกวาจะโตแยง แตจะไมเปนเชนนั้นอีกตอไป"
 CHI_demand_mongolia: "เรียกรองมองโกเลีย"
 CHI_demand_mongolia_desc: "มองโกเลียซึ่งติดอยูระหวางเรากับรัสเซียอาจตกเปนของรัสเซียไดทุกเมื่อ เราตองลงมือกอน"
 CHI_anti_imperialism: "ตอตานจักรวรรดินิยม"
 CHI_lessons_of_war_completed: "ดําเนินการทุกขั้นตอนของ§Yการปฏิรูปกองทัพ§!และ§Yบทเรียนจากสงคราม§!สําเร็จแลว\n"
 CHI_anti_imperialism_desc: "วันนี้เรายืนหยัดเปนหนึ่งในชาติแรก ๆ ที่สลัดพันธนาการของลัทธิลาอาณานิคมได เปนหนาที่อันศักดิ์สิทธิ์ของเราที่จะทําใหแนใจวาประชาชาติอื่น ๆ ในเอเชียจะกําหนดชะตากรรมของตนเองไดเชนกัน"
 CHI_guidance_and_support: "การชี้นําและการสนับสนุน"
 CHI_guidance_and_support_desc: "ประชาชาติแหงอินโดจีนยังคงตองการความชวยเหลือในการสรางชาติของตน เราจะทําใหแนใจวาพวกเขาจะไมตกอยูภายใตแรงกดดันจากภายนอกอีก"
 CHI_indian_cooperation: "ความรวมมือกับอินเดีย"
 CHI_indian_cooperation_desc: "ประชาชนแหงอินเดียกําลังดิ้นรนเพื่อสลัดพันธนาการสุดทายของการกดขี่แบบอาณานิคม เราควรยื่นมือไปหาพวกเขา สนับสนุนการตอสูของพวกเขา และรวมมือกันเพื่ออนาคตที่สดใสกวาของทั้งสองชาติ"
 CHI_commit_to_korean_independence: "มุงมั่นตอเอกราชเกาหลี"
 CHI_commit_to_korean_independence_desc: "ชาวเกาหลีคือเหยื่อรายแรกของการยึดครองของญี่ปุน พวกเขาจะไดยืนหยัดเปนประชาชนเสรีทามกลางนานาชาติอีกครั้ง"
 CHI_influence_mongolia: "แผอิทธิพลสูมองโกเลีย"
 CHI_influence_mongolia_desc: "การมีมองโกเลียเปนรัฐกันชนระหวางเรากับรัสเซียจะทําใหปกดานเหนือของเราปลอดภัย เราเพียงตองทําใหแนใจวาพวกเขาดูแลตัวเองได"
 CHI_imperial_legacy: "มรดกแหงจักรวรรดิ"
 CHI_imperial_legacy_desc: "จีนยืนหยัดเปนกําลังที่ครอบงําโลกตะวันออกมานับพันป เปนหลักประกันสันติภาพและเสถียรภาพในภูมิภาค ถึงเวลาแลวที่เราจะทวงคืนสถานะเดิมของเรา"
 CHI_overlordship_over_indochina: "อํานาจเหนืออินโดจีน"
 CHI_overlordship_over_indochina_desc: "อินโดจีนพึ่งพาการคุมครองของจีนมาตั้งแตสมัยโบราณ การที่ดินแดนนี้ตกเปนของฝรั่งเศสแสดงใหเห็นวาพวกเขาไมสามารถปกปองตนเองได"
 CHI_dominate_japan: "ครอบงําญี่ปุน"
 CHI_dominate_japan_desc: "หลายทศวรรษที่ผานมา ญี่ปุนเปนภัยคุกคามที่ใหญที่สุดตอเอกราชของเรา พวกเขาเคยรวมมือกับมหาอํานาจตะวันตกเพื่อกดขี่เรามากอน เราไมอาจปลอยใหพวกเขาพยายามอีกครั้งได เราตองลงมือกอน"
 CHI_secure_the_peninsula: "ยึดคาบสมุทรใหมั่นคง"
 CHI_secure_the_peninsula_desc: "เปนประโยชนสูงสุดของเราที่จะทําใหแนใจวาคาบสมุทรเกาหลีจะไมถูกมหาอํานาจที่เปนปฏิปกษยึดครองอีก"
 CHI_british_cooperation: "ความรวมมือกับอังกฤษ"
 CHI_british_cooperation_desc: "แมพวกเขาอาจเปนจักรวรรดินิยมตัวฉกาจ แตการรวมมือกับอังกฤษเปนโอกาสที่ดีที่สุดในการปรับปรุงกองทัพอากาศใหทันสมัยและรับประกันการไหลเวียนของเสบียงอยางสมํ่าเสมอ"
 CHI_burma_road: "ถนนพมา"
 CHI_burma_road_desc: "ถนนพมาคือเสนชีวิตที่เชื่อมเรากับโลกตะวันตก ตองปกปองไวใหไดไมวาจะตองแลกดวยอะไร และขยายเพื่อใหเสบียงไหลเวียนอยางราบรื่น"
 CHI_ledo_road: "ถนนเลโด"
 CHI_ledo_road_desc: "ถนนพมาเพียงเสนเดียวไมอาจคํ้าจุนเราได เราตองหาชองทางใหมในการนําเสบียงเขามาเพื่อใหเรายังสูตอไปได"
 CHI_fighter_purchases: "จัดซื้อเครื่องบินขับไล"
 CHI_fighter_purchases_desc: "กองทัพอากาศของเราตองการเครื่องบินขับไลที่ทันสมัยเพื่อรับมือกับภัยคุกคามจากตางชาติ อุตสาหกรรมของเรายังผลิตเองไมได เราจึงตองซื้อจากตางประเทศ"
 CHI_camco: "CAMCO"
 CHI_camco_desc: "หากเราตองการสรางอุตสาหกรรมการบินที่เปนอิสระ เราตองเรียนรูเทคนิคและวิธีการประกอบและซอมบํารุงเครื่องบินที่เรามีอยูกอน"
 CHI_local_fighter_production: "ผลิตเครื่องบินขับไลในประเทศ"
 CHI_local_fighter_production_desc: "เมื่อแรงงานคุนเคยกับงานซอมบํารุงขั้นพื้นฐานแลว เราสามารถเดินหนาผลิตชิ้นสวนทั้งหมดของเครื่องบินขับไลสมัยใหมได"
 CHI_local_bomber_production: "ผลิตเครื่องบินทิ้งระเบิดในประเทศ"
 CHI_local_bomber_production_desc: "หลังจากเชี่ยวชาญเทคโนโลยีการผลิตเครื่องบินเครื่องยนตเดียวแลว เราสามารถพยายามพัฒนาและผลิตรุนหลายเครื่องยนตที่หนักกวาเพื่อสนับสนุนภาคพื้นดินได"
 CHI_the_hump: "เสนทางบินขามหิมาลัย"
 CHI_the_hump_desc: "ปฏิบัติการขนสงทางอากาศขามเทือกเขาหิมาลัยเปนเพียงสิ่งทดแทนที่ดอยกวาเสนทางขนสงอื่น ๆ แตก็ถูกตัดขาดไดยากกวามาก"
 CHI_chinese_expeditionary_force: "กองกําลังรบนอกประเทศของจีน"
 CHI_chinese_expeditionary_force_desc: "เพื่อประสานงานกับพันธมิตรไดดีขึ้น สหรัฐอเมริกาไดสงนายพลคนหนึ่งมาบัญชาการกองกําลังผสม"
 CHI_the_chu_x_po: "Chu X-PO"
 CHI_the_chu_x_po_desc: "Chu X-PO คือจุดสูงสุดของการพัฒนาในจีน เครื่องบินขับไลลําแรกที่พัฒนาและผลิตในประเทศ ซึ่งสามารถตอกรกับศัตรูใดก็ได"
 CHI_mission_to_the_us: "คณะผูแทนสูสหรัฐอเมริกา"
 CHI_mission_to_the_us_soong_us_decision: "ตราบใดที่ §Yซง เหมยหลิง§! ยังเปน§Yที่ปรึกษาทางการเมือง§! สหรัฐอเมริกาจะสามารถสนับสนุนสงครามของเราตอ§Yญี่ปุน§!ได\n"
 CHI_mission_to_the_us_desc: "จีนมีพันธมิตรที่แข็งแกรงในสหรัฐอเมริกามานาน พวกเขาคือโอกาสที่ดีที่สุดในการไดรับการสนับสนุนที่เราตองการ"
 CHI_hire_chennault: "จางเชนโนลต"
 CHI_hire_chennault_desc: "แคลร เชนโนลต เปนนักทฤษฎีการสงครามทางอากาศชาวอเมริกันที่แสดงความสนใจจะทํางานใหเรา เราควรจางเขามาฟนฟูกองทัพอากาศของเรา"
 CHI_invite_the_flying_tigers: "เชิญเสือบิน"
 CHI_invite_the_flying_tigers_desc: "มิตรของเราในอเมริกาไดจัดตั้งกลุมอาสาสมัครนักบินและซื้อเครื่องบินทันสมัยจํานวนหนึ่งเพื่อสนับสนุนเรา เราเพียงแคตองตอบตกลง"
 CHI_sino_american_cooperative_organization: "องคการความรวมมือจีน-อเมริกัน"
 CHI_sino_american_cooperative_organization_desc: "หนวยขาวกรองอเมริกันยินดีทํางานรวมกับเราในการจัดปฏิบัติการพิเศษหลังแนวขาศึก สิ่งนี้จะชวยใหเราพัฒนาขีดความสามารถของตนเองในดานนี้ได"
 CHI_light_cruiser_project: "โครงการเรือลาดตระเวนเบา"
 CHI_light_cruiser_project_desc: "กาวแรกในการสรางกองทัพเรือนํ้าลึกที่นาเกรงขามคือการปรับปรุงกองเรือลาดตระเวนใหทันสมัย โครงการแรกของเราไมควรทะเยอทะยานเกินไป"
 CHI_heavy_cruiser_project: "โครงการเรือลาดตระเวนหนัก"
 CHI_heavy_cruiser_project_desc: "ดวยความสําเร็จของแบบเรือลาดตระเวนกอนหนา เราสามารถขยายขนาดและปรับปรุงสมรรถนะ สรางเรือที่มีขีดความสามารถสูงขึ้นเพื่อปกปองกองเรือของเรา"
 CHI_naval_aviation: "การบินนาวี"
 CHI_naval_aviation_desc: "อนาคตของการสงครามทางทะเลคือเรือบรรทุกเครื่องบิน เราจะไมมีวันไดรับการยอมรับวาเปนมหาอํานาจทางทะเลที่แทจริง หากไมมีเรือบรรทุกเครื่องบินของเราเอง"
 CHI_carrier_air_wing: "กองบินประจําเรือบรรทุกเครื่องบิน"
 CHI_carrier_air_wing_desc: "เรือบรรทุกเครื่องบินจะดีไดก็ตอเมื่อเครื่องบินที่บินขึ้นจากมันดีดวย เราตองทําใหแนใจวาเครื่องบินเหลานั้นเปนแบบที่มีขีดความสามารถสูงสุดและทันสมัยที่สุดที่มีอยู"
 CHI_investment_into_shipbuilding: "ลงทุนในการตอเรือ"
 CHI_investment_into_shipbuilding_desc: "กองเรือขนาดใหญตองการฐานอุตสาหกรรมขนาดใหญมาคํ้าจุน เราควรเชิญนักลงทุนตางชาติมาชวยเราสรางอูตอเรือ"
 CHI_order_destroyers: "สั่งตอเรือพิฆาต"
 CHI_order_destroyers_desc: "ในขั้นแรกของการฟนฟูกําลังรบทางเรือ ควรผลิตเรือพิฆาตกลุมเล็ก ๆ"
 CHI_train_marines: "ฝกนาวิกโยธิน"
 CHI_train_marines_desc: "แนวชายฝงอันยาวไกลของเราเสี่ยงตอการยกพลขึ้นบกของขาศึก แตก็เปดโอกาสใหเราโจมตีจากทิศทางที่ไมคาดคิดหากขาศึกบุกเขามาทางบก"
 CHI_collaboration_with_the_japanese: "รวมมือกับญี่ปุน"
 CHI_collaboration_with_the_japanese_desc: "ไมวาญี่ปุนจะมีแผนการตอจีนอยางไร พวกเขาก็แสดงใหเห็นชัดวายินดีทํางานรวมกับเราหากเราแสดงความเคารพเพียงพอ"
 CHI_modern_submarines: "เรือดํานํ้าสมัยใหม"
 CHI_modern_submarines_desc: "ญี่ปุนไมเต็มใจใหความรูทางเทคนิคที่จะทําใหเราทาทายกองเรือของพวกเขาในการรบซึ่งหนาได แตพวกเขามองวาการสงครามเรือดํานํ้าเปนเพียงกําลังรบเสริม แนนอนวาเราไมจําเปนตองเห็นดวยกับความคิดนั้น"
 CHI_coastal_patrol_planes: "เครื่องบินลาดตระเวนชายฝง"
 CHI_coastal_patrol_planes_desc: "แนวชายฝงอันยาวไกลของเราจะลาดตระเวนไดอยางมีประสิทธิภาพก็จากทางอากาศเทานั้น เครื่องบินทิ้งระเบิดทางทะเลสมัยใหมจะชวยใหเราปองกันชายฝงไดโดยไมตองสิ้นเปลืองทรัพยากรมากเกินไป"
 CHI_three_principles_of_the_people: "ลัทธิไตรราษฎร"
 CHI_three_principles_of_the_people_desc: "ผูกอตั้งสาธารณรัฐ ดร.ซุน ยัตเซ็น ไดวางหลักการพื้นฐานสามประการที่ควรเปนแนวทางของสาธารณรัฐ ไดแก หมินจู หมินเฉวียน และหมินเซิง หรือชาตินิยม ประชาธิปไตย และสวัสดิการสังคม"
 CHI_welfare: "สวัสดิการ"
 CHI_welfare_desc: "รัฐสมัยใหมยอมดูแลพลเมืองของตน เพื่อที่ในยามจําเปน พลเมืองจะสามารถและเต็มใจปกปองรัฐ"
 CHI_refugee_relief_agency: "หนวยงานบรรเทาทุกขผูลี้ภัย"
 CHI_refugee_relief_agency_desc: "ความปนปวนจากสงครามทําใหผูคนนับลานไรที่อยูอาศัย เราจะจัดตั้งหนวยงานเพื่อชวยเหลือพวกเขาในการหาที่พักพิงแหงใหม"
 CHI_land_tax_reform: "ปฏิรูปภาษีที่ดิน"
 CHI_land_tax_reform_desc: "การเงินของเราจําเปนตองไดรับการปฏิรูปอยางเรงดวน สวนหนึ่งคือความจําเปนที่ตองขยายฐานภาษี"
 CHI_refugee_resettlement: "ตั้งถิ่นฐานผูลี้ภัยใหม"
 CHI_refugee_resettlement_desc: "ผูลี้ภัยผูสิ้นหวังและไรบานนับลานที่เกิดจากสงครามจําเปนตองไดรับการตั้งถิ่นฐานที่ใดที่หนึ่ง การใหที่พักพิงพวกเขาในดินแดนของเราหมายความวาเราจะมีพวกเขาเปนแหลงกําลังคนสําหรับกองทัพและเศรษฐกิจ"
 CHI_new_life_movement: "ขบวนการชีวิตใหม"
 CHI_new_life_movement_desc: "คุณธรรมสี่ประการ ไดแก ศีลธรรม ความซื่อสัตย ความยุติธรรม และความจงรักภักดี จะนําทางพลเมืองของเราไปสูชีวิตที่ดีกวาและมีผลิตภาพมากขึ้นนับจากนี้"
 CHI_unemployment_assistance: "ความชวยเหลือผูวางงาน"
 CHI_unemployment_assistance_desc: "การวางงานไมควรทําใหพลเมืองตกอยูในความยากจนขนแคน ความหิวโหยคือพันธมิตรที่ดีที่สุดของคอมมิวนิสต"
 CHI_free_hospitals: "โรงพยาบาลฟรี"
 CHI_free_hospitals_desc: "ชาติที่ยิ่งใหญจะไมทอดทิ้งพลเมืองใหโดดเดี่ยวยามเจ็บปวย การสรางระบบสาธารณสุขที่ครอบคลุมจะชวยใหสุขภาพโดยรวมของประชาชนดีขึ้น และพวกเขาจะพรอมใจกันปกปองมัน"
 CHI_rural_schooling: "การศึกษาในชนบท"
 CHI_rural_schooling_desc: "ประชาชนที่ไดรับการศึกษาดีคือกุญแจสูการพัฒนาชาติใหทันสมัย เราไมอาจพึ่งพาผูบริหารที่มีการศึกษาเพียงหยิบมือได แตตองนําจิตวิญญาณแหงความรูและวิทยาศาสตรไปสูทุกหมูบาน"
 CHI_democracy: "ประชาธิปไตย"
 CHI_democracy_desc: "การเดินทางที่ ดร.ซุน ยัตเซ็น เริ่มตนไวจะตองนําไปสูสาธารณรัฐในที่สุด ไมตองสงสัยวาจะเปนการเดินทางอันยาวไกล แตเราจะกาวไปทีละกาว"
 CHI_constitutional_reform: "ปฏิรูปรัฐธรรมนูญ"
 CHI_constitutional_reform_desc: "ปญหาที่เราเผชิญอยูในวันนี้สวนหนึ่งเกิดจากการไมมีรัฐธรรมนูญที่สะทอนความเปนจริงในจีน เราตองแกไขเรื่องนี้"
 CHI_republicanism: "สาธารณรัฐนิยม"
 CHI_republicanism_desc: "หลายคนในโลกตะวันตกสงสัยวาเราจริงใจที่จะเปนสาธารณรัฐตามแบบตะวันตกหรือไม เราควรประกาศเจตนารมณของเราตอสาธารณะ"
 CHI_inter_party_coordination_council: "สภาประสานงานระหวางพรรค"
 CHI_inter_party_coordination_council_desc: "กาวแรกสูการเปลี่ยนประเทศใหเปนประชาธิปไตยแบบหลายพรรคที่ใชการได และยุติการปกครองแบบชี้นําประชาชนที่จําเปนในชวงนี้ คือการมีองคกรที่เปดใหพรรคอื่น ๆ ที่สนใจไดมีสวนรวมแสดงความเห็นในการกําหนดนโยบาย"
 CHI_judicial_yuan: "สภาตุลาการ"
 CHI_judicial_yuan_desc: "ดร.ซุน ยัตเซ็น วาดภาพสาธารณรัฐสมัยใหมที่มีการแบงแยกอํานาจ ฝายตุลาการของเราตองเปนอิสระจากอิทธิพลภายนอก และตัดสินคดีโดยยึดกฎหมาย และกฎหมายเทานั้น"
 CHI_control_yuan: "สภาตรวจสอบ"
 CHI_control_yuan_desc: "การทุจริตเปนสิ่งที่หลีกเลี่ยงไมไดในรัฐบาลใด ๆ รัฐบาลที่มีประสิทธิภาพตองพยายามควบคุมมันไว เราจะสรางอํานาจอธิปไตยอีกฝายหนึ่งแยกตางหาก ซึ่งเทาเทียมกับฝายนิติบัญญัติ ฝายบริหาร และฝายตุลาการ"
 CHI_examination_yuan: "สภาสอบคัดเลือก"
 CHI_examination_yuan_desc: "นับพันปที่ขาราชการจีนไดรับการคัดเลือกผานการสอบอันเขมงวด แมตําราที่จําเปนอาจเปลี่ยนไป แตหลักการยังคงเหมือนเดิม"
 CHI_executive_yuan: "สภาบริหาร"
 CHI_executive_yuan_desc: "แกนของรัฐบาลคือฝายบริหาร ซึ่งเปนผูบังคับใชกฎหมาย จึงสมเหตุสมผลที่การสรางฝายบริหารจะเปนกาวแรกในการสรางรัฐบาลสาธารณรัฐที่ใชการได"
 CHI_legislative_yuan: "สภานิติบัญญัติ"
 CHI_legislative_yuan_desc: "ความสามารถของประชาชนในการเลือกตั้งองคกรเพื่อออกกฎหมายที่ใชปกครองตนเองคือหัวใจของสาธารณรัฐสมัยใหม ชาติของเราตองไมบกพรองในเรื่องนี้"
 CHI_nationalism: "ชาตินิยม"
 CHI_nationalism_desc: "แนวคิดเรื่องการเปนสวนหนึ่งของชาติ แทนที่จะเปนของชนเผาหรือศาสนา คือสิ่งที่เปลี่ยนกลุมคนใหกลายเปนรัฐ"
 CHI_foreign_threats: "ภัยคุกคามจากตางชาติ"
 CHI_foreign_threats_desc: "เมื่อไมกี่ปกอน ญี่ปุนไดฉกชิงแมนจูเรียไปจากเราและตั้งรัฐหุนเชิดขึ้น พวกเขาจะไมหยุดจนกวาจะกดขี่จีนไดทั้งหมด เราตองพรอมเผชิญหนากับพวกเขา แมจะหมายถึงการตองทําขอตกลงกับผูมีอิทธิพลทองถิ่นก็ตาม"
 CHI_prioritize_the_interior: "ใหความสําคัญกับดินแดนภายใน"
 CHI_prioritize_the_interior_desc: "กอนที่เราจะคิดถึงการทวงคืนดินแดนที่ญี่ปุนขโมยไป เราตองทําใหดินแดนภายในมั่นคงเสียกอน หากยังแบงแยกเปนภูมิภาคตาง ๆ ที่สูรบกันเอง เราจะไมมีโอกาสเลย"
 CHI_united_front: "แนวรวม"
 CHI_united_front_desc: "เมื่อญี่ปุนจอคอหอยเราอยู เราตองพรอมรับความชวยเหลือจากทุกที่ที่หาได แมแตจากคอมมิวนิสต"
 CHI_pick_a_fight_with_japan: "หาเรื่องญี่ปุน"
 CHI_pick_a_fight_with_japan_desc: "หลายปที่ผานมา ญี่ปุนยื่นขอเรียกรองตอเราไมหยุดหยอน วันเวลาเหลานั้นสิ้นสุดลงแลว ครั้งหนาหากพวกเขาเรียกรองอะไรจากเราแมเพียงเล็กนอย เราจะไมยอมถอยแมแตนิ้วเดียว"
 CHI_anti_communism: "ตอตานคอมมิวนิสต"
 CHI_anti_communism_desc: "คอมมิวนิสตคือภัยคุกคามที่ยิ่งใหญที่สุดตอชาติของเรา ตองกวาดลางใหสิ้นซากอยางไมลดละ"
 CHI_subjugate_the_warlords: "ปราบขุนศึก"
 CHI_subjugate_the_warlords_desc: "ในชวงที่เราออนแอ ผูนําทหารทองถิ่นไดยึดอํานาจเหนือพื้นที่กวางใหญของประเทศ ถึงเวลาเตือนพวกเขาแลววาตองขึ้นตรงตอเรา ไมทางใดก็ทางหนึ่ง"
 CHI_war_of_resistance: "สงครามตอตาน"
 CHI_war_of_resistance_desc: "เรายังไมแข็งแกรงพอที่จะรุกไลญี่ปุน เราตองตานทานผูรุกรานไวจนกวาจะถึงเวลาที่เราสามารถกลับมาเปนฝายรุกไดอีกครั้ง"
 CHI_industrial_evacuations: "อพยพอุตสาหกรรม"
 CHI_industrial_evacuations_desc: "สงครามสมัยใหมชนะกันในโรงงาน กองทัพที่ไมมีปนก็เปนเพียงกลุมคนสวมหมวกตลก ๆ"
 CHI_war_of_national_liberation: "สงครามปลดปลอยชาติ"
 CHI_war_of_national_liberation_desc: "เมื่อการบุกของญี่ปุนพายแพแลว เราก็สามารถเปนฝายรุกและปลดปลอยดินแดนทั้งหมดของเราได"
 CHI_scorched_earth_tactics: "ยุทธวิธีผลาญภพ"
 CHI_scorched_earth_tactics_desc: "ในการตอสูเพื่อความอยูรอดของชาติ ไมมีสิ่งใดที่คิดไมถึง และตองพิจารณาทุกทางเลือก"
 CHI_war_of_anti_imperialism: "สงครามตอตานจักรวรรดินิยม"
 CHI_war_of_anti_imperialism_desc: "เมื่อดินแดนของเราปลอดจากการกดขี่แลว บัดนี้เราสามารถหันไปมองแนวรบของศัตรู เพื่อทําใหแนใจวาจะไมมีการรุกรานใดเกิดขึ้นจากที่นั่นไดอีก"
 CHI_forced_conscription: "บังคับเกณฑทหาร"
 CHI_forced_conscription_desc: "วิธีการรับสมัครทหารในปจจุบันไมสามารถผลิตทหารไดเพียงพอตอความตองการ ความพายแพในสงครามนี้หมายถึงการถูกทําลายลาง เราจึงตองขอจากประชาชนใหมากขึ้นอีก"
 CHI_dare_to_die_corps: "หนวยกลาตาย"
 CHI_50_cheaper_force_attack: "§G-50%§! คาใชจายสําหรับ§Yการบังคับโจมตี§!\n"
 CHI_dare_to_die_corps_desc: "การตอสูเพื่อสาธารณรัฐไดสรางผูพลีชีพมามากมายแลว และจะมีอีกมากกอนที่มันจะจบลง การเสียสละของพวกเขาจะเปนที่จดจําไปอีกหลายชั่วอายุคน"
 CHI_military_affairs_commission: "คณะกรรมาธิการกิจการทหาร"
 CHI_military_affairs_commission_desc: "กองทัพของเราแสดงใหเห็นถึงความไรความสามารถอยางนาตกใจ การปฏิรูปกองบัญชาการระดับสูงเปนเพียงกาวแรกในการแกไขปญหา"
 CHI_fortify_shanghai: "เสริมปอมเซี่ยงไฮ"
 CHI_fortify_shanghai_desc: "หากญี่ปุนโจมตี การโจมตีครั้งแรกจะตกอยูที่เซี่ยงไฮ เราตองเตรียมพรอม"
 CHI_army_reform: "ปฏิรูปกองทัพ"
 CHI_army_reform_desc: "การทุจริต ความไรความสามารถ และความขี้ขลาดแพรระบาดในทุกระดับการบังคับบัญชาของกองทัพเรา การแกไขเรื่องนี้จะเปนกระบวนการที่ยาวนาน"
 CHI_bureau_of_investigation_and_statistics: "สํานักงานสืบสวนและสถิติ"
 CHI_bureau_of_investigation_and_statistics_desc: "เราไมอาจปลอยใหคนทรยศและสายลับเพนพานไปทั่วประเทศขณะที่เรากําลังทําสงครามเพื่ออนาคตของชาติ วิธีการที่หนวยงานใหมนี้ใชอาจดูไมนาอภิรมย แตงานนี้ก็ยังตองมีคนทํา"
 CHI_the_chinese_hindenburg_line: "แนวฮินเดนบวรกแหงจีน"
 CHI_the_chinese_hindenburg_line_desc: "ที่ปรึกษาชาวเยอรมันของเราไดใหคําแนะนําที่เปนประโยชนมากมายเกี่ยวกับการสรางปอมปราการ ซึ่งไดเรียนรูมาจากมหาสงคราม ความพยายามใด ๆ ของขาศึกที่จะตีฝาออกจากเซี่ยงไฮจะแตกพายตอหนาปอมปราการเหลานี้"
 CHI_60_divisions_plan: "แผน 60 กองพล"
 CHI_60_divisions_plan_desc: "แทนที่จะพึ่งพาจํานวนคนมหาศาลในการแกปญหา ที่ปรึกษาตางชาติของเราไดเสนอแผนใหมที่แตกตางอยางสิ้นเชิง นั่นคือกองกําลังขนาดเล็กลงที่ประกอบดวยกองพลที่ไดรับการฝกอยางดีเพื่อตอกรกับขาศึก โครงการนํารองไดเริ่มตนขึ้นแลว"
 CHI_whampoa_military_academy: "โรงเรียนนายรอยหวงผู"
 CHI_whampoa_military_academy_desc: "กองทัพไรประโยชนหากไมมีการนําที่เหมาะสม หากเราตองการเปลี่ยนกองทัพใหเปนกําลังชั้นแนวหนา เราตองมีนายทหารที่ไดรับการฝกมาอยางดีเพื่อนําทัพ"
 CHI_unified_industrial_planning: "การวางแผนอุตสาหกรรมแบบรวมศูนย"
 CHI_unified_industrial_planning_desc: "โครงการพัฒนาอุตสาหกรรมอันเขมขนของเราตองไมลาชา"
 CHI_expand_the_academica_sinica: "ขยายบัณฑิตยสภาจีน"
 CHI_expand_the_academica_sinica_desc: "นับพันปที่จีนเปนผูนําโลกในการพัฒนาศิลปะและวิทยาศาสตร การเพิ่มงบประมาณแกมหาวิทยาลัยเปนเพียงกาวแรกในการทวงคืนสถานะนั้น"
 CHI_chemical_research_institute: "สถาบันวิจัยเคมี"
 CHI_chemical_research_institute_desc: "แมเราจะไมมีวันเปนฝายแรกที่ใชอาวุธเคมี แตเราก็ยังตองพรอมปองกันอาวุธเหลานั้นในกรณีที่ถูกโจมตี เราควรใหทุนสถาบันวิจัยแหงใหมเพื่อพัฒนาวิธีการและเทคโนโลยีที่จําเปน"
 CHI_rural_reconstruction_movement: "ขบวนการฟนฟูชนบท"
 CHI_rural_reconstruction_movement_desc: "แมเราจะกาวหนาอยางมากในการยกระดับชีวิตประชากรในเมือง แตหางออกไปเพียงไมกี่กิโลเมตร ชาวนายังคงใชชีวิตในสภาพแบบยุคกลาง เราจะทําใหแนใจวาพลเมืองทุกคนไดลิ้มรสผลแหงความเหนื่อยยากของเรา"
 CHI_mining_commission: "คณะกรรมาธิการเหมืองแร"
 CHI_mining_commission_desc: "ทรัพยากรมีความสําคัญยิ่งตอความพยายามในการทําสงคราม เราตองเขาควบคุมอุตสาหกรรมเหมืองแรเพื่อใหมันผลิตสิ่งที่เราตองการ"
 CHI_taiyuan_arsenal: "คลังแสงไทหยวน"
 CHI_taiyuan_arsenal_desc: "คลังแสงไทหยวนเปนหนึ่งในไมกี่แหงในจีนที่สามารถผลิตอาวุธหนักได เราควรขยายคลังแสงเพื่อสงปนใหญและอาวุธอื่น ๆ ใหกองทหารของเรา"
 CHI_develop_the_hanyan_arsenal: "พัฒนาคลังแสงฮั่นหยาง"
 CHI_develop_the_hanyan_arsenal_desc: "คลังแสงฮั่นหยางสงปนใหกองทัพจีนมาเปนเวลานาน การขยายคลังแสงจะทําใหแนใจวาจะยังเปนเชนนั้นตอไปในอนาคต"
 CHI_financial_policy: "นโยบายการเงิน"
 CHI_financial_policy_desc: "การเงินของรัฐไมไดมั่นคงนัก และโครงการอันทะเยอทะยานของรัฐบาลก็สรางความหวาดกลัวตอภาวะเงินเฟอรุนแรงที่ควบคุมไมได การปฏิรูปการเงินตองเปนหนึ่งในสิ่งที่เราใหความสําคัญเปนอันดับแรก"
 CHI_price_controls: "ควบคุมราคา"
 CHI_price_controls_desc: "กาวแรกในการควบคุมเงินเฟอคือการทําใหสินคาสําคัญขายในราคาคงที่ ซึ่งจะไมเปนที่ชื่นชอบของชนชั้นพอคา"
 CHI_grain_tax: "ภาษีขาว"
 CHI_grain_tax_desc: "ธนบัตรที่รัฐบาลออกมีอํานาจซื้อนอยลงเรื่อย ๆ อีกไมนานเราจะไมสามารถเลี้ยงกองทัพไดอีกตอไป เราอาจออกกฎหมายใหมใหชาวนาจายภาษีเปนขาว เพื่อเลี่ยงกลไกตลาด พวกเขาจะไมชอบใจ และมีความเสี่ยงที่จะนําไปสูทุพภิกขภัยเต็มรูปแบบ"
 CHI_reform_the_national_bank: "ปฏิรูปธนาคารแหงชาติ"
 CHI_reform_the_national_bank_desc: "ธนาคารแหงชาติแหงใหมจะประสานกิจกรรมทางการเงินทั้งหมดของรัฐบาลและจัดหาเงินทุนที่จําเปน"
 CHI_forced_loans: "การบังคับกูยืม"
 CHI_forced_loans_desc: "พอคาและนักอุตสาหกรรมไดสะสมความมั่งคั่งมหาศาลในชวงที่คอนขางสงบ ยอมไมใชการขอมากเกินไปที่จะใหพวกเขานําความมั่งคั่งสวนหนึ่งมาใหรัฐบาลใชในยามคับขันเชนนี้ พรอมคํามั่นวาจะชําระคืนโดยเร็วทันทีที่สถานการณเอื้ออํานวย"
 CHI_purchase_tanks_tt: "เราจะไดรับรถถังเบารุนเกา 100 คันจากผูสนับสนุนของเรา"
 CHI_purchase_fighters_tt: "เราจะไดรับเครื่องบินขับไลรุนเกา 50 ลําจากผูสนับสนุนของเรา การไดรับการสนับสนุนจากทั้งสหราชอาณาจักรและสหรัฐอเมริกาจะทําใหไดซื้อเครื่องบินขับไลจากทั้งสองประเทศ"
 PRC_strengthen_the_central_secretariat: "เสริมความแข็งแกรงของสํานักเลขาธิการกลาง"
 PRC_strengthen_the_central_secretariat_desc: "หลังการเดินทัพทางไกล เราตองปรับโครงสรางองคกรทางการเมืองใหม เพื่อสรางรัฐที่สามารถแขงขันกับฝายชาตินิยมได"
 PRC_marxist_orthodoxy: "มารกซิสตดั้งเดิม"
 PRC_marxist_orthodoxy_desc: "กุญแจสูการบรรลุคอมมิวนิสตที่แทจริงคือการนําคําสอนของมารกซไปปฏิบัติใหมากที่สุดเทาที่จะทําได"
 PRC_soviet_leadership: "การนําของโซเวียต"
 PRC_soviet_leadership_desc: "สหภาพโซเวียตยืนหยัดเปนประเทศชั้นนําบนเสนทางสูคอมมิวนิสตอยางสมบูรณ เราควรยอมรับขอนี้และเรียนรูจากแบบอยางของพวกเขา"
 PRC_soviet_economic_aid: "ความชวยเหลือทางเศรษฐกิจจากโซเวียต"
 PRC_soviet_economic_aid_desc: "ความเสียหายจากการเดินทัพทางไกลจะตองใชเวลาหลายชั่วอายุคนในการฟนตัวหากไมมีความชวยเหลือจากภายนอก เราควรเขาหาโซเวียตเพื่อขอความชวยเหลือทางเศรษฐกิจ"
 PRC_internationalism: "สากลนิยม"
 PRC_internationalism_desc: "กรรมกรและชาวนาทั่วโลกตองรวมพลังกันเพื่อสลัดพันธนาการ เราจะเคียงบาเคียงไหลกันสรางอนาคตที่ดีกวา"
 PRC_agrarian_socialism: "สังคมนิยมเกษตรกรรม"
 PRC_agrarian_socialism_desc: "จีนไมเหมือนชาติอุตสาหกรรมทั้งหลายในโลก การคาดหวังการปฏิวัติคอมมิวนิสตตามที่มารกซจินตนาการไว เทากับเขาใจผิดถึงสภาพที่ประเทศของเราเปนอยู"
 PRC_rectification_campaign: "ขบวนการปรับปรุงแนวทาง"
 PRC_rectification_campaign_desc: "มีความเขาใจผิดหลายประการเกี่ยวกับแนวทางที่การตอสูของเราควรดําเนินไป เราควรใหโอกาสแกสหายที่หลงผิดไดยอมรับความผิดพลาดของตน"
 PRC_maoism: "ลัทธิเหมา"
 PRC_maoism_desc: "ทานประธานผูยิ่งใหญใชเวลาหลายเดือนพัฒนาทฤษฎีทางการเมืองของทานใหเปนอุดมการณที่สอดคลองเปนระบบ ซึ่งจะนําพาประเทศของเรากาวไปขางหนา"
 PRC_socialism_with_chinese_characteristics: "ลัทธิมารกซแบบอัตลักษณจีน"
 PRC_socialism_with_chinese_characteristics_desc: "แมมารกซจะปราดเปรื่องอยางไมตองสงสัย แตเขาเขียนจากมุมมองแบบยุโรปโดยเฉพาะ สภาพการณเฉพาะของจีนจะสะทอนอยูในการดําเนินนโยบายสังคมนิยมของเรา"
 PRC_proclaim_the_peoples_republic: "ประกาศสาธารณรัฐประชาชน"
 PRC_proclaim_the_peoples_republic_desc: "ดวยชัยชนะเหนือฝายชาตินิยม ถึงเวลาที่เราจะขึ้นสูที่อันชอบธรรมในฐานะรัฐบาลที่ถูกตองตามกฎหมายของจีน ยังมีงานอีกมากที่ตองทํา แตอนาคตดูสดใสกวาที่เคย"
 PRC_socialist_market_economy: "เศรษฐกิจแบบตลาดสังคมนิยม"
 PRC_socialist_market_economy_desc: "เสนทางสูสังคมนิยมและคอมมิวนิสตตองผานทุนนิยมตามนิยาม จีนไมเคยพัฒนาเศรษฐกิจตลาดแบบทุนนิยมอยางแทจริง ทําใหการกาวไปสูสังคมนิยมแทบเปนไปไมได เราตองพัฒนารูปแบบการผลิตแบบทุนนิยมกอนจึงจะกาวหนาตอไปได"
 PRC_social_democracy_focus: "สังคมประชาธิปไตย"
 PRC_social_democracy_focus_desc: "นโยบายสุดโตงของพรรคทําใหสถานการณเลวรายลง ไมไดดีขึ้น ฝายชาตินิยม แมจะมีขอบกพรองมากมาย ก็คือพันธมิตรของเราในการตอสูเพื่อสรางอนาคตที่ดีกวา เราตองขยับเขาหาพวกเขาในทางการเมือง"
 PRC_coalition_government: "รัฐบาลผสม"
 PRC_coalition_government_desc: "แมการรวมประเทศจะยังหางไกล แตการจัดตั้งรัฐบาลรวมกับฝายชาตินิยมจะชวยปูทางใหราบรื่น"
 PRC_purge_the_radicals: "กวาดลางพวกหัวรุนแรง"
 PRC_purge_the_radicals_desc: "บางกลุมในพรรคของเรายังคงเชื่อในหลักการตอสูทางชนชั้นและการตอตานสิ่งที่เรียกวาชนชั้นขูดรีด พวกเขาตองออกไป"
 PRC_strengthen_the_left_wing_of_the_kmt: "เสริมกําลังฝายซายของกกมินตั๋ง"
 PRC_strengthen_the_left_wing_of_the_kmt_desc: "ฝายชาตินิยมเองก็มีปญหากับกลุมภายในที่พยายามบอนทําลายความพยายามในการบรรลุขอตกลงระหวางระบอบของเรา เราควรทําทุกอยางที่ทําไดเพื่อใหพันธมิตรของเราในกกมินตั๋งชนะการชวงชิงอํานาจครั้งนี้"
 PRC_remove_chiang_kai_shek: "โคนเจียง ไคเชก"
 PRC_remove_chiang_kai_shek_desc: "แมเราจะพยายามแลว แตทานจอมทัพยังคงมองวาเราเปนคอมมิวนิสตอยูในใจ การตอตานอยางรุนแรงของเขากลายเปนปญหา จําเปนตองดําเนินมาตรการบางอยาง"
 PRC_national_leadership: "การนําระดับชาติ"
 PRC_national_leadership_desc: "เมื่อไคเชกพนไปแลว อุปสรรคสุดทายตอการรวมชาติก็หมดไป จึงสมควรแลวที่เราจะเปนผูนําในรัฐบาลผสมนี้"
 PRC_land_redistribution: "จัดสรรที่ดินใหม"
 PRC_land_redistribution_desc: "หลายศตวรรษที่ผูทํากินบนผืนดินถูกบังคับใหจายคาเชาแกผูเปนเจาของที่ดินตัวจริง เราจะเปลี่ยนแปลงสิ่งนี้"
 PRC_the_yanan_base_area: "ฐานที่มั่นเหยียนอาน"
 PRC_the_yanan_base_area_desc: "รากฐานแหงการปฏิวัติของเราคือพื้นที่เหยียนอาน หากเราตองการชนะในการตอสูที่กําลังจะมาถึง ตองขยายและพัฒนาพื้นที่นี้"
 PRC_prepare_for_war_with_japan: "เตรียมทําสงครามกับญี่ปุน"
 PRC_prepare_for_war_with_japan_desc: "พวกลัทธิทหารญี่ปุนเปนภัยคุกคามที่ยิ่งใหญที่สุดตอชาติของเรา พวกเขาตองการแบงแยกและขูดรีดประเทศของเราในแบบที่ไมมีรัฐบาลจีนใดจะจินตนาการได การตอสูกับฝายชาตินิยมนั้นเทียบไมไดเลย"
 PRC_government_of_national_defense: "รัฐบาลปองกันชาติ"
 PRC_government_of_national_defense_desc: "ประเทศที่แตกแยกคือประเทศที่เชื้อเชิญความพายแพ เราตองรวมมือกับฝายชาตินิยมเพื่อประสานการปองกันประเทศ"
 PRC_confrontation_with_the_warlords: "เผชิญหนากับขุนศึก"
 PRC_confrontation_with_the_warlords_desc: "บางกลุมในจีนเพิกเฉยตอรัฐบาลกลาง และปฏิเสธที่จะเลือกขางในการตอสู บางคนอาจถึงขั้นแอบมีแผนยึดครองประเทศหรือรวมมือกับญี่ปุน พวกเขาตองถูกจัดการใหอยูในแถว"
 PRC_anti_japanese_expedition: "กองสํารวจตอตานญี่ปุน"
 PRC_anti_japanese_expedition_desc: "การเผชิญหนากับญี่ปุนในการรบซึ่งหนาดวยสถานะปจจุบันของเราจะเปนความโงเขลามากกวาความกลาหาญ เราควรเตรียมพื้นที่กอนดวยการสงกลุมเล็ก ๆ เขาไปในดินแดนขาศึกเพื่อสรางฐานที่มั่น เมื่อถึงเวลาที่เหมาะสม เราจะปลุกการลุกฮือ"
 PRC_revolutionary_military_commission: "คณะกรรมาธิการทหารปฏิวัติ"
 PRC_revolutionary_military_commission_desc: "การตอสูเชิงปฏิวัติกับศัตรูของเราตองไดรับการประสานงานผานองคกรที่จัดตั้งขึ้นเปนพิเศษ"
 PRC_provoke_japan: "ยั่วยุญี่ปุน"
 PRC_provoke_japan_desc: "ตลอดสามชั่วอายุคน เราอยูภายใตเงาของภัยคุกคามจากญี่ปุน การตอตานการขยายอํานาจของญี่ปุนจะทําใหเราเปนวีรบุรุษในสายตาของประชาชนจีน และหากญี่ปุนไมยอมใหสงครามที่เราตองการ เราก็จะบีบใหพวกเขาทํา"
 PRC_protracted_warfare: "สงครามยืดเยื้อ"
 PRC_protracted_warfare_desc: "เราตองทําสงครามตามเงื่อนไขของเรา จีนมีทั้งผูคนและเวลามากมาย การเผชิญหนากับขาศึกในการรบซึ่งหนาเทากับการฆาตัวตาย"
 PRC_mobile_warfare: "สงครามเคลื่อนที่"
 PRC_mobile_warfare_desc: "เราไมอาจซอนตัวอยูในภูเขาและปาไปตลอดกาล ถึงเวลาแลวที่จะนําการตอสูไปหาขาศึก และแสดงใหโลกเห็นวาเราไมกลัวที่จะสูกับพวกเขาอยางเปดเผย"
 PRC_peoples_war: "สงครามประชาชน"
 PRC_peoples_war_desc: "ประเทศอื่นอาจเชื่อวาเทคโนโลยีและอํานาจการยิงคือสิ่งที่ชนะสงคราม แตเรารูดีกวานั้น ไมมีเทคโนโลยีใดตานทานประชาชนผูมุงมั่นที่พรอมจะเสียสละได"
 PRC_100_regiments_campaign: "การรณรงครอยกรมทหาร"
 PRC_100_regiments_campaign_desc: "จนถึงตอนนี้เรามุงเนนที่การรบเล็ก ๆ และการปะทะประปราย ศัตรูของเราคิดวาเราออนแอและเปนเพียงตัวสรางความรําคาญ เมื่อถูกกลอมใหรูสึกปลอดภัย พวกเขาจะไมทันไดเตรียมรับการรุกครั้งใหญ"
 PRC_central_military_commission: "คณะกรรมาธิการทหารกลาง"
 PRC_central_military_commission_desc: "เมื่อสถานะของเรามั่นคงขึ้น เราสามารถกาวจากการตอสูเชิงปฏิวัติเพื่อความอยูรอด ไปสูการตอสูเพื่อความเปนผูนําของชาติ"
 PRC_peoples_liberation_army: "กองทัพปลดแอกประชาชน"
 PRC_peoples_liberation_army_desc: "กองทัพแดงจีนไดสรางวีรกรรมอันยิ่งใหญ ในอนาคตจะไดรับเกียรติที่ยิ่งใหญกวานี้อีกเมื่อเราสูเพื่อปลดปลอยประชาชนของเรา"
 PRC_peoples_volunteer_army: "กองทัพอาสาสมัครประชาชน"
 PRC_peoples_volunteer_army_desc: "การตอสูเพื่อปลดปลอยกรรมกรและชาวนาทั่วโลกเกิดขึ้นในหลายประเทศ การเขาแทรกแซงความขัดแยงเหลานี้โดยตรงไมใชเรื่องฉลาดเสมอไป บางครั้งกองกําลังขนาดเล็กก็เพียงพอที่จะพลิกดุลอํานาจได"
 PRC_military_intelligence_department: "กรมขาวกรองทหาร"
 PRC_military_intelligence_department_desc: "เรามีมิตรมากมายในหมูประชาชนทั่วไปที่คอยใหขอมูลอันมีคาแกเรา แตเราก็มีศัตรูมากกวานั้นอีก เราตองสรางองคกรเพื่อแยกแยะทั้งสองฝายออกจากกัน"
 PRC_central_security_bureau: "สํานักงานความมั่นคงกลาง"
 PRC_central_security_bureau_desc: "เราไมอาจปลอยใหฝายตอตานการปฏิวัติฝงรากได แมในหมูบานที่เล็กที่สุด เปาหมายของเราตองเปนการคนหาคนทรยศทุกคนกอนที่พวกเขาจะสรางความเสียหายใด ๆ ได"
 PRC_focus_on_china: "มุงเนนที่จีน"
 PRC_focus_on_china_desc: "เราไมอาจหวังจะตานทานญี่ปุนไดขณะที่ยังตองสูกับฝายชาตินิยมและขุนศึก เราตองเอาชนะพวกเขากอน แลวจึงจะรับมือกับญี่ปุนได"
 PRC_exploit_the_weak_neighbours: "ฉวยประโยชนจากเพื่อนบานที่ออนแอ"
 PRC_exploit_the_weak_neighbours_desc: "เพื่อนบานของเราออนแอลงจากการทุจริตและการตอสูภายใน นี่คือโอกาสเหมาะที่จะขยายดินแดนของเรา"
 PRC_infiltration: "การแทรกซึม"
 PRC_infiltration_desc: "ฝายชาตินิยมอยากใหเราสูกับพวกเขาอยางเปดเผย เราตองไมหลงกล เราจะสงทหารกลุมเล็ก ๆ เขาไปในดินแดนศัตรูเพื่อสรางฐานที่มั่น เมื่อถึงเวลาที่เหมาะสม เราจะจุดชนวนการลุกฮือและเลนงานฝายชาตินิยมแบบไมทันตั้งตัว"
 PRC_enforce_the_three_rules: "บังคับใชกฎสามขอ"
 PRC_enforce_the_three_rules_desc: "1: ปฏิบัติตามคําสั่ง\n 2: หามขโมยของจากชาวนา\n 3: สงมอบทุกสิ่งที่ยึดไดจากขาศึก\n ดวยกฎงาย ๆ เหลานี้ เราจะแสดงใหประชาชนเห็นวาเราอยูขางพวกเขา"
 PRC_permit_opium_trade: "อนุญาตการคาฝน"
 PRC_permit_opium_trade_desc: "แมจะมีผลขางเคียงที่นาเสียดาย แตการอนุญาตใหชาวนาปลูกฝนจะทําใหเรามีเงินสดที่จําเปนในการสงเสบียงใหกองทัพ"
 PRC_ban_the_opium_trade: "หามการคาฝน"
 PRC_ban_the_opium_trade_desc: "ฝนคือเครื่องมือที่มหาอํานาจตะวันตกใชบีบใหเราคุกเขา เราไมอาจปลอยใหความชั่วรายนี้แพรกระจายได"
 PRC_abolish_the_land_rent: "ยกเลิกคาเชาที่ดิน"
 PRC_abolish_the_land_rent_desc: "การถือครองที่ดินโดยเอกชนเปนแนวคิดที่ไรสาระ ที่ดินเปนของผูที่ทํากินบนมัน การปลอยใหชาวนารวมตัวจัดตั้งกันเองจะทําใหเราไดรับการสนับสนุนจากพวกเขา"
 PRC_literacy_programs: "โครงการรูหนังสือ"
 PRC_literacy_programs_desc: "กาวแรกในการสรางสังคมสมัยใหมคือการทําใหพลเมืองทุกคนเขาใจปญหาที่เผชิญอยูและชวยกันแกไขได"
 PRC_china_medical_university: "มหาวิทยาลัยการแพทยจีน"
 PRC_china_medical_university_desc: "สุขอนามัยและการรักษาพยาบาลจะทําใหกองทัพของเรายังคงอยูในสนามรบได และชวยใหเรายกระดับชีวิตความเปนอยูของพลเมือง เราจะพัฒนาวิธีการใหม ๆ ในดานเหลานี้และสอนใหแกประชาชน"
 PRC_form_the_academy_of_sciences: "จัดตั้งสถาบันวิทยาศาสตร"
 PRC_form_the_academy_of_sciences_desc: "เราจะรวมสถานวิจัยและมหาวิทยาลัยตาง ๆ ทั้งหมดเขาดวยกัน และสรางองคกรใหมเพื่อบริหารจัดการอยางมีประสิทธิภาพมากขึ้น"
 JAP_the_unthinkable_option: "ทางเลือกที่ไมอาจนึกถึง"
 JAP_the_unthinkable_option_desc: "อนาคตของชาติเราตองการหนทางที่ผูนําของเราไมเคยคิดถึงมากอน บัดนี้ตองพิจารณาทางเลือกนี้อยางจริงจัง"
 JAP_approach_the_young_officers: "เขาหานายทหารหนุม"
 JAP_approach_the_young_officers_desc: "คนรุนเกายึดติดกับวิถีเดิมเกินกวาจะโนมนาวใหคิดแบบใหมไดงาย ๆ เราจะเริ่มจากคนรุนใหมแทน"
 JAP_approach_the_young_officers_tt: "ไดรับนายพลคอมมิวนิสต §G3§! คน\n"
 JAP_exchange_the_exiles: "แลกเปลี่ยนผูถูกเนรเทศ"
 JAP_if_man_accepts: "หาก §Hแมนจูกัว§! ยอมรับ จะเกิดสิ่งตอไปนี้:\n"
 JAP_exchange_the_exiles_desc: "กอนหนานี้เราสงนายทหารและขาราชการที่เอียงซายไปลี้ภัยอยางไมเปนทางการในแมนจูเรีย บัดนี้เราจะแลกพวกเขากลับมา โดยสงพวกที่เอียงขวาไปแทน"
 JAP_open_up_the_universities: "เปดมหาวิทยาลัยใหทุกคน"
 JAP_open_up_the_universities_desc: "ทุกคนตองไดรับอนุญาตใหศึกษา ไมวาจะมีชาติกําเนิดหรือสถานะทางสังคมอยางไร"
 JAP_cast_the_die: "ทอดลูกเตา"
 JAP_cast_the_die_desc: "ฐานทางการเมืองและการทหารของเรามั่นคงเพียงพอแลว ถึงเวลาที่จะควาชะตากรรมของเรา!"
 cast_the_die_TT: "§Rการยึดโตเกียวไดจะยุติสงครามกลางเมืองอยางรวดเร็ว§!\n"
 JAP_the_fate_of_the_imperial_family: "ชะตากรรมของราชวงศ"
 JAP_the_fate_of_the_imperial_family_desc: "ถึงเวลาจัดการกับรองรอยสุดทายของการปกครองแบบสืบสันตติวงศในญี่ปุนแลว เราตองตัดสินวาองคจักรพรรดิและพระราชวงศจะมีชะตากรรมเชนไร"
 JAP_rebuild_the_civil_service: "ฟนฟูระบบราชการพลเรือน"
 JAP_rebuild_the_civil_service_desc: "เพื่อบริหารชาติอยางเหมาะสม เราจะฟนฟูระบบราชการพลเรือนดวยบุคลากรที่มีความสามารถสูงสุด"
 JAP_reeducation_campaign: "การรณรงคปรับทัศนคติ"
 JAP_reeducation_campaign_desc: "ความไมสงบแพรระบาดหลังการปฏิวัติอันยิ่งใหญของเรา เราตองอบรมสั่งสอนประชาชนใหมเพื่อเสริมสรางพฤติกรรมที่เราเห็นวาเหมาะสมที่สุด"
 JAP_cleaning_up_our_own_mess: "สานตอสิ่งที่เราเริ่มไว"
 JAP_finish_the_fight: "ปดฉากการตอสู"
 JAP_finish_the_fight_desc: "เราตองนําการตอสูไปยังอดีตอาณานิคมของเรา และกําจัดที่มั่นสุดทายของศัตรูทางอุดมการณชาวญี่ปุน"
 JAP_join_comintern: "เขารวมโคมินเทิรน"
 JAP_join_comintern_desc: "เราไมอาจยืนหยัดตอสูกับทั้งโลกเพียงลําพัง เราตองยืนเคียงขางแผนดินกําเนิดของคอมมิวนิสตเพื่อปกปองการปฏิวัติ!"
 JAP_red_brigades: "กองพลแดง"
 JAP_red_brigades_desc: "ชายหญิงทุกคนตองทําหนาที่ปกปองรัฐ เราจะทําใหแนใจวาพวกเขามีโอกาสไดทําเชนนั้น"
 JAP_communist_volunteers: "อาสาสมัครคอมมิวนิสต"
 JAP_communist_volunteers_desc: "การตอสูของเราไมไดจบลงที่นี่ เราตองชวยยกระดับชาติอื่น ๆ ดวย ผูที่ดีที่สุดและเกงที่สุดของเราจะถูกสงออกไปเปนผูนําอุดมการณของเราในชาติที่โอบรับการปฏิวัติ!"
 JAP_asian_communist_solidarity: "ความสามัคคีคอมมิวนิสตแหงเอเชีย"
 JAP_asian_communist_solidarity_tt: "เชิญ §H[WTT_communist_china.GetNameWithFlag]§! เขารวมฝายของเรา"
 JAP_asian_communist_solidarity_desc: "เราตองยืนเคียงขางพี่นองชาวเอเชีย คอมมิวนิสตแบบตะวันตกไมมีที่ยืนที่นี่ แตเมื่อรวมมือกับเพื่อนบาน เราจะเผยแพรคอมมิวนิสตในรูปแบบที่เหมาะกับความตองการของเอเชียได"
 JAP_nationalize_the_zaibatsus: "โอนไซบัตสึเปนของรัฐ"
 JAP_nationalize_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนเปนเวลานาน มันจะจบลงที่นี่ อํานาจควบคุมของรัฐจะไมถูกทาทาย"
 JAP_people_owned_mines: "เหมืองที่ประชาชนเปนเจาของ"
 JAP_people_owned_mines_desc: "ประชาชนจะไดรับอนุญาตใหถือหุนในเหมืองที่ตนทํางาน ชวยเพิ่มแรงจูงใจและประสิทธิภาพของคนงาน"
 JAP_public_works: "โครงการสาธารณะ"
 JAP_public_works_desc: "โครงการสาธารณะชุดใหมจะทําใหทุกคนมีงานทํา พรอมทั้งพัฒนาโครงสรางพื้นฐานทั่วประเทศ"
 JAP_tokyo_aluminum_plant: "โรงงานอะลูมิเนียมโตเกียว"
 JAP_tokyo_aluminum_plant_desc: "เราจะใชพลังของกรรมกรเพื่อเพิ่มความสามารถในการพึ่งพาตนเองของชาติ"
 JAP_purge_the_kodoha_faction: "กวาดลางกลุมโคโดฮะ"
 JAP_purge_the_kodoha_faction_desc: "กลุมใหมไดปรากฏขึ้น มุงหมายจะยึดอํานาจรัฐบาลและบุกขึ้นเหนือเขาสูสหภาพโซเวียต เราตองกําจัดพวกเขากอนที่จะสรางความเสียหายมากเกินไป"
 JAP_liaison_conference: "การประชุมประสานงาน"
 JAP_liaison_conference_desc: "การสงผูประสานงานจากทุกฝายของรัฐบาลและกองทัพไปยังการประชุมกลาง จะชวยใหเราตัดสินใจไดรวดเร็วขึ้นอยางมาก"
 JAP_greater_east_asian_co_prosperity_sphere: "วงไพบูลยรวมแหงมหาเอเชียบูรพา"
 JAP_greater_east_asian_co_prosperity_sphere_desc: "ยุคของจักรวรรดินิยมตะวันตกไดสิ้นสุดลงแลว ประชาชาติแหงเอเชียตองรวมตัวกันและยืนหยัดเปนทวีปที่เขมแข็งและเปนหนึ่งเดียวภายใตการนําของเรา เอเชียเพื่อชาวเอเชีย!"
 JAP_intervene_in_china: "อุบัติการณสะพานมารโคโปโล"
 JAP_intervene_in_china_desc: "[Root.GetNameDefCap] ขาดแคลนทรัพยากร แตเพื่อนบานของเราไม เราตองยึดเอาสิ่งที่เราขาดจากพวกเขา และตองการเพียงขออางเพื่อเริ่มลงมือ ขออางเชนนั้นอาจไดมาจากทหารผูกลาไดกลาเสียไมกี่นาย หลังจากนั้นองคจักรพรรดิจะไมมีทางเลือกนอกจากยินยอมใหทําสงคราม ไมวาจะเตรียมพรอมนอยเพียงใด..."
 JAP_secure_china: "ยึดจีนใหมั่นคง"
 JAP_secure_china_desc: "การตอตานของจีนดื้อรั้นและไมหยุดหยอน เราตองเพิ่มความพยายามเปนทวีคูณเพื่อสยบแผนดินใหญโดยเร็วที่สุด"
 JAP_develop_chinese_resources: "พัฒนาทรัพยากรจีน"
 JAP_develop_chinese_resources_desc: "เราตองพัฒนาทรัพยากรอันอุดมสมบูรณของจีนที่ตกอยูในมือเรา เพื่อใหเปนประโยชนในสงครามครั้งตอไป"
 JAP_strike_south_doctrine: "หลักนิยมรุกลงใต"
 JAP_strike_south_doctrine_desc: "แมจีนจะอุดมสมบูรณ แตก็ไมมีทรัพยากรทุกอยางที่เราตองการ ทวาไมไกลลงไปทางใตคือหมูเกาะอินดีสตะวันออกของดัตช และอาณานิคมมลายูกับบอรเนียวของอังกฤษ เพื่อการพึ่งพาตนเองอยางแทจริง เราตองแยงชิงการควบคุมดินแดนเหลานี้มาจากจักรวรรดินิยมยุโรป"
 JAP_non_aggression_pact_with_the_soviet_union: "สนธิสัญญาไมรุกรานกับ [SOV.GetNameDef]"
 JAP_non_aggression_pact_with_the_soviet_union_desc: "พรมแดนทางเหนือของเราตองมั่นคงหากเราจะมีอิสระในการรุกลงใต เราจะเริ่มการเจรจากับ [SOV.GetNameDef] ทันที"
 JAP_bypass_the_philippines: "ขามฟลิปปนส"
 JAP_bypass_the_philippines_desc: "ฟลิปปนสเปนสิ่งรบกวนที่ไมพึงประสงคบนเสนทางสูเปาหมายที่แทจริงของเรา เราจะเพิกเฉยไปกอนในตอนนี้"
 JAP_secure_the_philippines: "ยึดฟลิปปนสใหมั่นคง"
 JAP_secure_the_philippines_desc: "ฟลิปปนสเปนฐานที่จําเปนบนเสนทางสูเปาหมายที่แทจริงของเรา เราตองยึดไวใหมั่นคงสําหรับปฏิบัติการทางทหารในอนาคต"
 JAP_strike_on_the_southern_resource_area: "โจมตีเขตทรัพยากรทางใต"
 JAP_strike_on_the_southern_resource_area_desc: "ถึงเวลาเริ่มดําเนินแผนของเราแลว เราจะรุกลงใตและยึดอาณานิคมตะวันตกที่อุดมดวยทรัพยากรมาเปนของเรา"
 JAP_alliance_with_siam: "พันธมิตรกับสยาม"
 JAP_alliance_with_siam_desc: "สยามตั้งอยูในทําเลชั้นยอดที่จะชวยเราในสงครามที่กําลังจะมาถึงกับมหาอํานาจตะวันตก การดึงสยามมาอยูฝายเราจะชวยใหการบุกมลายูที่หลีกเลี่ยงไมได และตอเนื่องไปถึงหมูเกาะอินเดียตะวันออก เปนไปไดงายขึ้นอยางมาก"
 JAP_exploit_the_southern_resource_area: "แสวงประโยชนจากเขตทรัพยากรทางใต"
 JAP_exploit_the_southern_resource_area_desc: "เราตองขยายการแสวงประโยชนจากทรัพยากรอันอุดมสมบูรณของหมูเกาะอินดีสตะวันออกอยางมาก เพื่อหลอเลี้ยงกองกําลังของเราในสงคราม"
 JAP_sign_tripartite_pact: "ลงนามกติกาสัญญาไตรภาคี"
 JAP_sign_tripartite_pact_bypass_tt: "เยอรมนีหรืออิตาลีไมมีรัฐบาลฟาสซิสต หรือเรากําลังทําสงครามกับประเทศใดประเทศหนึ่งในนั้น"
 JAP_sign_tripartite_pact_desc: "ภารกิจที่รออยูขางหนาอาจเปนความทาทายตอขีดความสามารถของเรา เราควรยื่นมือไปหารัฐบาลอื่นที่มีเปาหมายคลายกัน เพื่อจะไดรวมมือกันในระดับหนึ่ง"
 JAP_guide_the_zaibatsus: "ชี้นําไซบัตสึ"
 JAP_guide_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนเปนเวลานาน ดวยชั้นเชิงเล็กนอย เราอาจชี้นําความพยายามของพวกเขาใหเปนประโยชนแกเราได"
 JAP_nationalize_war_industry: "โอนอุตสาหกรรมสงครามเปนของรัฐ"
 JAP_nationalize_war_industry_desc: "การเพิ่มการควบคุมของรัฐเหนืออุตสาหกรรมสงครามจะชวยเพิ่มประสิทธิภาพและผลผลิตไดอยางมาก"
 JAP_coal_liquification: "การแปลงถานหินเปนของเหลว"
 JAP_coal_liquification_desc: "[JAP.GetNameDefCap] ขาดแคลนนํ้ามัน ดังนั้นเราตองเพิ่มความพยายามเปนทวีคูณในดานนํ้ามันสังเคราะห"
 JAP_national_mobilization_law: "กฎหมายระดมพลแหงชาติ"
 JAP_national_mobilization_law_desc: "กฎหมายใหมจะทําใหการรับราชการทหารแพรหลายยิ่งขึ้น ปลูกฝงสํานึกในหนาที่ใหแกประชาชน และทําใหพวกเขาเขาใจถึงความจําเปนของสงคราม"
 JAP_national_research_policy: "นโยบายวิจัยแหงชาติ"
 JAP_national_research_policy_desc: "การสนับสนุนและการควบคุมสถาบันวิจัยโดยรัฐบาลจะชวยใหโครงการวิจัยและพัฒนาของเรามีความยืดหยุนและผลิตภาพมากขึ้น"
 JAP_imperial_arsenals: "คลังแสงจักรวรรดิ"
 JAP_imperial_arsenals_desc: "การเพิ่มการควบคุมของจักรวรรดิเหนืออุตสาหกรรมสงครามจะชวยเพิ่มประสิทธิภาพและผลผลิตไดอยางมาก"
 JAP_national_defense_state: "รัฐปองกันชาติ"
 JAP_national_defense_state_desc: "พลเมืองทุกคนตองตระหนักถึงความเรงดวนในการเปลี่ยนชาติของเราใหเปนปอมปราการที่สามารถตานทานการโจมตีใด ๆ ได"
 JAP_spiritual_mobilization: "การระดมพลทางจิตวิญญาณ"
 JAP_spiritual_mobilization_desc: "การบมเพาะหลักคําสอนของชินโตที่ปลุกสํานึกในหนาที่ทางทหารของประชาชน จะชวยเพิ่มจํานวนทหารใหมได"
 JAP_warrior_spirit: "จิตวิญญาณนักรบ"
 JAP_warrior_spirit_desc: "ลัทธิชินโตแหงรัฐชวยใหเราปลูกฝงประชาชนถึงความจําเปนในการเสียสละตนเองเพื่อรัฐและราชวงศ"
 JAP_strengthen_the_divine_wind: "เสริมพลังลมศักดิ์สิทธิ์"
 JAP_strengthen_the_divine_wind_effect: "เปดใหผลิต §HYokosuka MXY7 Ohka§!"
 JAP_strengthen_the_divine_wind_effect_bba: "เปดใชงานโมดูล§Hดินระเบิดติดตั้งตายตัว§!"
 JAP_strengthen_the_divine_wind_desc: "คามิกาเซ ยุทธวิธีของหนวยจูโจมพิเศษ ไดเปลี่ยนการโจมตีแบบพลีชีพจากมาตรการสุดทายที่ทําแบบเฉพาะหนา ใหกลายเปนหลักนิยมที่วางไวอยางเปนระบบ ดวยเครื่องบินแบบใหมซึ่งโดยแกนแทคือขีปนาวุธที่มีคนบังคับ การโจมตีเหลานี้จะไมมีใครหยุดยั้งได"
 JAP_support_the_kodoha_faction: "สนับสนุนกลุมโคโดฮะ"
 JAP_support_the_kodoha_faction_desc: "กลุมใหมไดปรากฏขึ้น มุงหมายจะยึดอํานาจรัฐบาลและบุกขึ้นเหนือเขาสูสหภาพโซเวียต เพื่อองคจักรพรรดิและอนาคตของจักรวรรดิ เราตองทําใหกลุมนี้มีชัย!"
 JAP_challenge_the_zaibatsus: "ทาทายไซบัตสึ"
 JAP_challenge_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนเปนเวลานาน เราตองเตือนพวกเขาวาพวกเขายังคงตองอยูใตพระประสงคขององคจักรพรรดิ"
 JAP_showa_restoration: "การฟนฟูโชวะ"
 JAP_showa_restoration_desc: "ยุคของประมุขที่เปนเพียงสัญลักษณไดผานพนไปนานแลว องคจักรพรรดิตองทรงเขาควบคุมรัฐโดยตรงดวยพระองคเอง เมื่อนั้นจักรวรรดิของเราจึงจะสามารถยืนหยัดตอกรกับจักรวรรดินิยมตะวันตกได"
 JAP_modern_shogunate: "รัฐบาลโชกุนสมัยใหม"
 JAP_modern_shogunate_desc: "องคจักรพรรดิตองทรงอยูในบทบาทเชิงพิธีการมากขึ้น โดยมีผูแทนที่เขมแข็งคอยดําเนินการในพระนามของพระองค ซึ่งจะทําใหพระดํารัสขององคจักรพรรดิแผขยายไปไดไกลและกวางขึ้นอยางแนนอน"
 JAP_prepare_for_war_with_the_soviet_union: "เตรียมทําสงครามกับ [SOV.GetNameDef]"
 JAP_prepare_for_war_with_the_soviet_union_desc: "ภัยคุกคาม[SOV.GetSovietThreatName]ตอพรมแดนทางเหนือของเราตองไดรับการจัดการ เราตองเริ่มเตรียมการทําสงครามกับ [SOV.GetNameDef]"
 SOV_communist_threat: "คอมมิวนิสต"
 SOV_fascist_threat: "ฟาสซิสต"
 SOV_country_threat: "[SOV.GetAdjective]"
 SOV_communist_threatAlt: "บอลเชวิค"
 SOV_fascist_threatAlt: "จักรวรรดินิยม"
 JAP_join_the_london_naval_treaty: "เขารวมสนธิสัญญานาวิกลอนดอน"
 JAP_join_the_london_naval_treaty_desc: "เราตองปกปองปกของเราหากจะตอกรกับหมี หากการลงนามในกระดาษแผนเดียวที่ควบคุมการเสริมกําลังทางเรือของเรานํามาซึ่งสันติภาพ ก็ใหเปนเชนนั้น"
 JAP_build_up_the_manchurian_army: "เสริมกําลังกองทัพแมนจู"
 JAP_build_up_the_manchurian_army_desc: "[MAN.GetNameDefCap] จะอยูแนวหนาของสงครามทางเหนือใด ๆ เราตองทําใหแนใจวาพวกเขาแข็งแกรงพอจะรับมือการโจมตีจากศัตรูที่อาจเกิดขึ้นได"
 JAP_non_aggression_pact_with_china: "สนธิสัญญาไมรุกรานกับจีน"
 JAP_non_aggression_pact_with_china_desc: "แมในอดีตความสัมพันธของเรากับจีนจะตึงเครียด ซึ่งยังพูดนอยไปดวยซํ้า แตบัดนี้เราจําเปนตองมีสนธิสัญญาไมรุกรานกับพวกเขา เพื่อปลดกําลังทหารไปใชในการรุกขึ้นเหนือ"
 JAP_create_a_manchurian_imperial_air_force: "จัดตั้งกองทัพอากาศจักรวรรดิแมนจู"
 JAP_create_a_manchurian_imperial_air_force_desc: "ความเหนือกวาทางอากาศจะเปนกุญแจสูชัยชนะในสงคราม หาก [MAN.GetNameDef] มีกองทัพอากาศของตนเอง ก็จะชวยปรับปรุงสถานการณทางอากาศของเราไดมาก"
 JAP_technological_exchange: "การแลกเปลี่ยนเทคโนโลยี"
 JAP_technological_exchange_desc: "เราตองการพันธมิตรเพื่อตอกรกับหมี เยอรมนีไมเพียงเปนตัวเลือกที่ดี แตยังมีความกาวหนาทางเทคโนโลยีมากมายที่อาจแบงปนใหเราเพื่อชวยในการตอสู"
 JAP_preemptive_war: "สงครามชิงลงมือกอน"
 JAP_preemptive_war_desc: "ดวยการกุรายงานวา[SOV.GetAdjective]เพิ่มความกาวราวที่พรมแดนทางเหนือของเรา เราจะมีขออางวาจําเปนตองชิงโจมตีกอนเพื่อกําจัดภัยคุกคามจากทางเหนือ"
 JAP_establish_the_northern_resource_area: "จัดตั้งเขตทรัพยากรทางเหนือ"
 JAP_establish_the_northern_resource_area_desc: "ดินแดนรกรางอันอุดมสมบูรณของไซบีเรียตองถูกนํามาใชประโยชนเพื่อเครื่องจักรสงครามที่เติบโตไมหยุดยั้งของเรา"
 JAP_german_rocketry: "วิทยาการจรวดเยอรมัน"
 JAP_german_rocketry_desc: "ความกาวหนาทางเทคโนโลยีเพิ่มเติมของเยอรมนีจะเปนประโยชนอยางยิ่งตอความพยายามในการทําสงครามของเรา เราตองไดแบบแปลนเหลานี้มาใหได ไมวาจะตองแลกดวยอะไร"
 JAP_strengthen_civilian_government: "เสริมความแข็งแกรงรัฐบาลพลเรือน"
 JAP_tora_tora_tora_idea: "โทระ! โทระ! โทระ!"
 JAP_tora_tora_tora_idea_desc: "หลังการโจมตีครั้งแรก ญี่ปุนกําลังเปดฉากการรบสายฟาแลบอยางดุดันดวยกองกําลังเรือบรรทุกเครื่องบิน"
 JAP_strengthen_civilian_government_desc: "คุณคาของเสรีนิยมและประชาธิปไตยที่เพิ่มขึ้นเรื่อย ๆ ไมไดเปนภัยคุกคามตอชาติของเรา แตอาจเปนจุดแข็งที่ยิ่งใหญที่สุด เราตองทําใหรัฐบาลของเราเขมแข็งเพื่อที่จะปกปองอุดมการณเหลานี้ได"
 JAP_ally_with_the_zaibatsus: "เปนพันธมิตรกับไซบัตสึ"
 JAP_ally_with_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนเปนเวลานาน พวกเขาเปนประจักษพยานถึงโอกาสทั้งปวงที่เสรีภาพและความเปนปจเจกมอบให และเราตองพยายามรวมมือกับพวกเขาเพื่อประโยชนของชาติ"
 JAP_research_spending: "งบประมาณการวิจัย"
 JAP_research_spending_desc: "ตองจัดสรรงบประมาณจํานวนมากอยางเหมาะสมใหแกการวิจัยและพัฒนา หากเราจะใชประโยชนจากผูที่ดีที่สุดและเกงที่สุดของชาติไดอยางเต็มที่"
 JAP_pre_emptive_coup: "รัฐประหารชิงลงมือกอน"
 JAP_pre_emptive_coup_desc: "เราตองลงมือกอนและรักษาอนาคตของชาติไวใหลูกหลาน มิฉะนั้นอุดมการณของเราจะถูกรัฐบาลเผด็จการเหยียบยํ่าจนสิ้น"
 JAP_purge_the_militarists: "กวาดลางพวกลัทธิทหาร"
 JAP_purge_the_militarists_desc: "ผูที่เชื่อวากําลังทหารคือคําตอบของทุกสิ่งตองถูกกวาดลางออกจากหมูเกาะของเรา หากเราจะเปดทางใหแนวคิดที่สุขุมมากขึ้น พวกเขาไปหาทางของตัวเองนอกพรมแดนของเราได"
 JAP_the_showa_constitution: "รัฐธรรมนูญโชวะ"
 JAP_the_showa_constitution_desc: "เรายอมรับและเคารพประวัติศาสตรแหงจักรวรรดิของชาติเรา อยางไรก็ตาม ระบอบเผด็จการไมมีที่ยืนในญี่ปุนที่เราตองการสราง เราจะคงองคจักรพรรดิไวเปนประมุขในเชิงสัญลักษณ แตจะจํากัดพระราชอํานาจไวในรัฐธรรมนูญ เชนเดียวกับในหลายประเทศตะวันตก"
 JAP_west_pacific_treaty_organization: "องคการสนธิสัญญาแปซิฟกตะวันตก"
 JAP_west_pacific_treaty_organization_desc: "พันธมิตรของเราเองรวมกับชาติเอเชียอื่น ๆ จะชวยใหเรายืนหยัดอยางมั่นคงตอภัยคุกคามใด ๆ ที่อาจเกิดขึ้นกับวิถีชีวิตใหมของเรา"
 JAP_rekindle_the_old_alliance: "ปลุกพันธมิตรเกา"
 JAP_rekindle_the_old_alliance_desc: "โอกาสที่ดีที่สุดของเราอยูที่พันธมิตรเกาในมหาสงคราม เราจะฟนพันธมิตรเดิมและยืนเคียงขาง [ENG.GetNameDef] ในการปกปองประชาธิปไตย"
 JAP_pacific_guardian: "ผูพิทักษแปซิฟก"
 JAP_pacific_guardian_desc: "เราจะรับบทผูพิทักษรัฐเอเชียทั้งหมดในและรอบมหาสมุทรแปซิฟก เมื่อพนจากจักรวรรดินิยมตะวันตกแลว พวกเขาจะตองการมือที่คอยชี้นําเพื่อยกระดับเปนประชาธิปไตยอยางสมบูรณ"
 JAP_anti_communist_bulwark: "ปราการตอตานคอมมิวนิสต"
 JAP_anti_communist_bulwark_desc: "หลักการของประชาธิปไตยไปดวยกันไมไดกับคอมมิวนิสต เราตองยืนหยัดตอตานอุดมการณนี้อยางมั่นคง และดวยเหตุนี้จึงปกปองทั้งตัวเราเองและผูที่พึ่งพาเรา"
 JAP_anti_communist_volunteers: "อาสาสมัครตอตานคอมมิวนิสต"
 JAP_anti_communist_volunteers_desc: "เราตองตอสูกับคอมมิวนิสตทุกที่ที่พบ แมเราจะไมไดเขารวมความขัดแยงอยางเปนทางการก็ตาม ในกรณีเชนนั้น เราจะสงอาสาสมัครไปเปนผูนําอุดมการณของเราแทน"
 JAP_the_korean_question: "ปญหาเกาหลี"
 JAP_the_korean_question_desc: "เราควบคุมคาบสมุทรเกาหลีมาระยะหนึ่งแลว แตประเด็นการกําหนดชะตากรรมของตนเองของเกาหลีก็เรงดวนขึ้นเรื่อย ๆ เราจะอางไดจริงหรือวายึดมั่นในอุดมการณประชาธิปไตย ในเมื่อเราปฏิเสธสิทธิ์ของเพื่อนบานที่จะปกครองตนเอง?"
 JAP_liberate_manchuria: "ปลดปลอยแมนจูเรีย"
 JAP_liberate_manchuria_desc: "แมนจูเรียยังคงอยูภายใตการปกครองแบบเผด็จการ ซึ่งเปนซากอันนาเกลียดของการปกครองแบบอาณานิคมของเรา เราตองแกไขสถานการณนี้และคืนภูมิภาคนี้สูการควบคุมอันชอบธรรมของจีน"
 JAP_liberate_manchuria_tt: "สามารถดําเนินการตัดสินใจไดหลังพิชิตแมนจูเรีย\n"
 JAP_ultimate_deterrence: "การปองปรามขั้นสูงสุด"
 JAP_ultimate_deterrence_desc: "วิธีที่ดีที่สุดในการปกปองพลเมืองคือการทําใหแนใจวาพวกเขาไมตองสูรบในสงครามเลย การพัฒนาอาวุธใหมที่มีพลังทําลายลางอันนาสะพรึงกลัวอาจทําใหพวกเขาไมตองสูรบอีกเลย"
 JAP_full_sovereignty_for_the_philippines: "อธิปไตยเต็มรูปแบบแกฟลิปปนส"
 JAP_full_sovereignty_for_the_philippines_desc: "การกําหนดชะตากรรมของตนเองตองแผขยายไปทั่วเอเชียใหมากขึ้น [USA.GetNameDefCap] ยังคงควบคุมฟลิปปนส และตองถูกกดดันใหเคารพสิทธิทางประชาธิปไตยของชาวฟลิปปนส"
 JAP_the_manchurian_project: "โครงการแมนจูเรีย"
 JAP_the_manchurian_project_desc: "แมหมูเกาะของเราจะขาดแคลนพื้นที่ที่ใชประโยชนได แตดินแดนในแผนดินใหญของเราไมขาดแคลน สิ่งที่เราสรางเองไมได เราก็ไปสรางบนแผนดินใหญแทนได เราจะเริ่มโครงการพัฒนาอุตสาหกรรมขนาดใหญสําหรับ [MAN.GetNameDef]"
 JAP_expand_the_showa_steel_works: "ขยายโรงงานเหล็กโชวะ"
 JAP_expand_the_showa_steel_works_desc: "เราตองขยายโรงงานเหล็กโชวะเพื่อเพิ่มการผลิตอยางมหาศาล ซึ่งเปนเงื่อนไขสําคัญสําหรับการพัฒนาอุตสาหกรรมขนาดใหญ"
 JAP_develop_aluminum_sources: "พัฒนาแหลงอะลูมิเนียม"
 JAP_develop_aluminum_sources_desc: "โครงการดานการบินของเราตองใชอะลูมิเนียมจํานวนมาก ดังนั้นตองพัฒนาทรัพยากรของแมนจูเรียอยางกวางขวาง"
 JAP_expand_manchurian_railways: "ขยายทางรถไฟแมนจูเรีย"
 JAP_expand_manchurian_railways_desc: "โครงสรางพื้นฐานของแมนจูเรียตองขยายอยางมากเพื่อรองรับภาระจากการพัฒนาอุตสาหกรรมที่เพิ่มขึ้น"
 JAP_light_industry_development: "พัฒนาอุตสาหกรรมเบา"
 JAP_light_industry_development_desc: "อุตสาหกรรมทหารเบามีความสําคัญยิ่งตอความตองการพื้นฐานของกองทัพ จึงตองไดรับการขยาย"
 JAP_heavy_industry_development: "พัฒนาอุตสาหกรรมหนัก"
 JAP_heavy_industry_development_desc: "อุตสาหกรรมทหารหนักมีความสําคัญยิ่งตอความตองการขั้นสูงของกองทัพ จึงตองไดรับการขยาย"
 JAP_japanese_settlement: "การตั้งถิ่นฐานของชาวญี่ปุน"
 JAP_japanese_settlement_desc: "การนําคนของเราไปตั้งถิ่นฐานในแมนจูเรียจะชวยเพิ่มแรงงาน และสรางทําเลที่เหมาะสําหรับโรงงานไดมากขึ้น"
 JAP_fortify_the_border: "เสริมปอมพรมแดน"
 JAP_fortify_the_border_desc: "พรมแดนทางเหนือแทบไมมีการปองกัน เราตองเตรียมแนวปองกันทางเหนือเพื่อรับมือการโจมตีที่อาจมาจากทิศทางนี้"
 JAP_army_expansion_law: "กฎหมายขยายกองทัพ"
 JAP_army_expansion_law_desc: "รัฐบาลของเราตองยึดการเพิ่มกําลังทหารอยางฉับพลันและมหาศาลเปนหนึ่งในหลักการสําคัญ"
 JAP_small_arms_modernization: "ปรับปรุงอาวุธเบาใหทันสมัย"
 JAP_small_arms_modernization_desc: "กองกําลังทหารของเราตองการอาวุธที่ทันสมัยเพื่อใหแขงขันกับศัตรูที่อาจเกิดขึ้นได"
 JAP_supremacy_of_technology: "ความเปนเลิศทางเทคโนโลยี"
 JAP_supremacy_of_technology_desc: "เทคโนโลยีคือสิ่งที่จะนําชัยชนะมาใหเรา ความพยายามทั้งหมดตองมุงไปที่การเหนือกวาศัตรูในดานอาวุธและยุทโธปกรณ"
 JAP_modern_artillery: "ปนใหญสมัยใหม"
 JAP_modern_artillery_desc: "แมทหารของเราจะกลาหาญและดุดัน แตพวกเขาก็ตองการปนใหญที่เหนือกวาเพื่อชวยในการรุกคืบ"
 JAP_armored_divisions: "กองพลยานเกราะ"
 JAP_armored_divisions_desc: "ชาติอื่นไดเรียนรูถึงพลังของกองพลยานเกราะแลว เราตองไมลาหลัง และตองพัฒนายานเกราะรุนที่กาวหนาและทรงพลังกวา เพื่อใหเราโจมตีขาศึกไดทั้งหนักหนวงและรวดเร็ว"
 JAP_bicycle_battalions: "กองพันจักรยาน"
 JAP_bicycle_battalions_desc: "ความคลองตัวคือกุญแจสําคัญ กองกําลังของเราจะไดรับจักรยาน ซึ่งจะเพิ่มความสามารถในการดําเนินกลยุทธของกองพลอยางมาก"
 JAP_army_expansion: "ขยายกองทัพ"
 JAP_army_expansion_desc: "เพื่อบรรลุเปาหมายในการขยายกองทัพ เราตองใชทักษะของนายทหารที่พิสูจนแลววาสามารถฝกฝนทหารในศิลปะแหงการสงครามได"
 JAP_supremacy_of_will: "ความเปนเลิศแหงเจตจํานง"
 JAP_supremacy_of_will_desc: "ยุทโธปกรณที่กาวหนาที่สุดก็ไรประโยชนหากไมมีนักรบผูดุดันมาใชงาน และความดุดันสามารถเปลี่ยนกอนหินธรรมดาที่สุดใหกลายเปนอาวุธที่รายกาจที่สุดได"
 JAP_fighter_modernization: "ปรับปรุงเครื่องบินขับไลใหทันสมัย"
 JAP_fighter_modernization_desc: "เราตองรักษาความเหนือกวาศัตรูในทุกดาน รวมถึงการสงครามทางอากาศ เครื่องบินขับไลที่ทันสมัยเปนสิ่งจําเปนในการบรรลุเปาหมายนี้"
 JAP_range_focus: "มุงเนนพิสัยบิน"
 JAP_range_focus_desc: "ระยะทางในการทําสงครามในเขตยุทธบริเวณแปซิฟกนั้นกวางไกล เราจึงตองการเครื่องบินรุนที่บินขามระยะทางเหลานั้นได"
 JAP_agility_focus: "มุงเนนความคลองแคลว"
 JAP_agility_focus_desc: "พิสัยบินเพียงอยางเดียวจะไมมีประโยชน หากเครื่องบินของเราสูศัตรูไมไดเมื่อไปถึง เราตองผลิตอากาศยานที่มีความคลองแคลวเหนือกวา เพื่อไมใหถูกขาศึกเอาชนะดวยการหลบหลีกได"
 JAP_the_zero: "ซีโร"
 JAP_the_zero_desc: "แบบใหมของมิตซูบิชิอาจพิสูจนไดวาเปนเครื่องบินขับไลประจําเรือบรรทุกเครื่องบินที่มีขีดความสามารถสูงสุดเทาที่เคยออกแบบมา ความคลองตัวที่ไมมีใครเทียบ ประกอบกับพิสัยบินที่ดี หมายความวาแบบนี้นาจะใชงานไดนานหลายป เราควรเริ่มสรางตนแบบและผลิตทันที"
 JAP_the_zero_tt: "เปดใหผลิต §HMitsubishi A6M Zero-sen§!"
 JAP_bomber_modernization: "ปรับปรุงเครื่องบินทิ้งระเบิดใหทันสมัย"
 JAP_bomber_modernization_desc: "กองกําลังเครื่องบินทิ้งระเบิดทางยุทธวิธีที่ทันสมัยเปนกุญแจสําคัญในการสนับสนุนกองทัพในสนามรบ"
 JAP_strategic_bomber_effort: "ความพยายามดานเครื่องบินทิ้งระเบิดทางยุทธศาสตร"
 JAP_strategic_bomber_effort_desc: "แมเราจะตองการเพียงใด แตสงครามก็ไมอาจชนะไดงาย ๆ ดวยการเผชิญหนาทางทหารโดยตรงเพียงอยางเดียว ขีดความสามารถทางอุตสาหกรรมมีอิทธิพลอยางมากตอผลของสงคราม เราจึงตองลงทุนในเครื่องบินทิ้งระเบิดทางยุทธศาสตรรุนใหมที่สามารถทําลายอุตสาหกรรมของขาศึกหลังแนวรบได"
 JAP_unified_fighter_development: "พัฒนาเครื่องบินขับไลแบบรวมศูนย"
 JAP_unified_fighter_development_desc: "เราถูกรุมเราดวยการแยกกันพัฒนาการบินระหวางกองทัพบกและกองทัพเรือมานานเกินไป เราตองรวมโครงการเหลานี้เขาดวยกันเพื่อใหอาวุธเปนมาตรฐานเดียวกันและใชทรัพยากรการวิจัยอันจํากัดไดดีขึ้น"
 JAP_jet_prototypes: "ตนแบบเครื่องบินไอพน"
 JAP_jet_prototypes_desc: "อนาคตของการบินไมไดอยูที่ใบพัด เราตองมองไปที่เครื่องยนตไอพนเพื่อเพิ่มขีดความสามารถของอากาศยาน"
 JAP_new_naval_estimates: "ประมาณการกําลังทางเรือใหม"
 JAP_new_naval_estimates_desc: "เราตองออกประมาณการใหมสําหรับขนาดการขยายกองทัพเรือ และดวยเหตุนี้ รวมถึงอูตอเรือที่จําเปนตอการขยายดังกลาว"
 JAP_carrier_warfare_experiments: "ทดลองการสงครามเรือบรรทุกเครื่องบิน"
 JAP_carrier_warfare_experiments_desc: "เรือประจัญบานคือซากของยุคที่ผานพนไปแลว เราตองมองไปสูอนาคต และอนาคตคือการบิน เรือบรรทุกเครื่องบินจะชวยใหเราแผแสนยานุภาพทางอากาศไปทั่วแปซิฟก"
 JAP_expand_the_snlf: "ขยายหนวยนาวิกโยธินพิเศษ"
 JAP_expand_the_snlf_desc: "สงครามในแปซิฟกจะเกี่ยวของกับการยกพลขึ้นบกเปนอยางมาก หนวยยกพลขึ้นบกพิเศษของกองทัพเรือจําเปนตองขยายหากจะรับมือภารกิจนี้ได"
 JAP_first_air_fleet: "กองเรืออากาศที่ 1"
 JAP_first_air_fleet_desc: "เพื่อเพิ่มพลังโจมตีเชิงรุกใหสูงสุด เราจะรวมเรือบรรทุกเครื่องบินที่มากที่สุดเทาที่โลกเคยเห็นเขาเปนกลุมรบเดียว ดวยการพัฒนาหลักนิยมที่จําเปนสําหรับปฏิบัติการรุกอยางประสานกันในรูปแบบนี้ ศัตรูของเราจะไมมีทางสูความเหนือกวาดานการบินนาวีของเราได"
 JAP_modern_escorts: "เรือคุมกันสมัยใหม"
 JAP_modern_escorts_desc: "กองเรือของเราตองการเรือคุมกันที่ทันสมัยที่สุดเพื่อปฏิบัติการไดโดยไมถูกขัดขวางจากเรือดํานํ้าและเรือตอรปโดของขาศึก"
 JAP_supremacy_of_the_battlefleet: "ความเปนเลิศของกองเรือประจัญบาน"
 JAP_supremacy_of_the_battlefleet_desc: "ดวยแบบเรือประจัญบานที่เหนือกวา เราตองการการรบชี้ขาดเพียงครั้งเดียวเพื่อตัดสินสงครามทางทะเล เราตองปรับกองเรือประจัญบานใหเหมาะสมที่สุดเพื่อใหสามารถบีบใหเกิดการรบเชนนั้นและเอาชนะได"
 JAP_the_ultimate_battleship: "เรือประจัญบานขั้นสุดยอด"
 JAP_the_ultimate_battleship_desc: "เนื่องจากเราไมไดมีทรัพยากรมากมาย เราตองใชมันใหเกิดประโยชนสูงสุด เราจะสรางเรือประจัญบานที่ทรงพลังที่สุดเทาที่เคยลอยอยูบนผิวโลก สามารถเอาชนะศัตรูใดก็ไดในการรบแบบประจันหนา"
 JAP_cruiser_modernization: "ปรับปรุงเรือลาดตระเวนใหทันสมัย"
 JAP_cruiser_modernization_desc: "เรือลาดตระเวนจะเปนกําลังหลักของหมูเรือเฉพาะกิจของเราทั่วแปซิฟก เราจึงตองการเรือที่ดีที่สุดที่เราสรางได"
 JAP_long_lance_torpedoes: "ตอรปโดลองแลนซ"
 JAP_long_lance_torpedoes_desc: "ความโหดรายของการกระจายทรัพยากรโลกทําใหกองทัพเรือของเรามีจํานวนนอยกวาขาศึก ดังนั้นเราจะพัฒนาตอรปโดที่กาวหนาที่สุดในโลกเทาที่เคยมีมา เปนอาวุธพิสัยไกลมากและทรงพลัง ขับเคลื่อนดวยออกซิเจนอัดแทนอากาศอัด ซึ่งจะชวยใหเรือผิวนํ้าขนาดเล็กของเราโจมตีไดรุนแรงเกินตัว"
 JAP_torpedo_cruisers: "เรือลาดตระเวนตอรปโด"
 JAP_torpedo_cruisers_desc: "เราจะทุมเรือทั้งชั้นใหบรรทุกตอรปโดแบบใหมของเราจํานวนมหาศาล เพื่อใหพวกมันสรางความหายนะแกกองเรือขาศึก"
 JAP_yamato_tt: "เพิ่มสายการผลิตเรือประจัญบานหนักพิเศษ§Yชั้นยามาโตะ§! สองสาย ซึ่งเสร็จแลว 75% และ 50% ตามลําดับ"
 cost_reduced_last_stand: "อนุญาตใหใชความสามารถบัญชาการ§Yยืนหยัดครั้งสุดทาย§!ดวยคาใชจายที่ลดลงอยางมาก\n"
 MAN_pacify_the_countryside: "สงบชนบท"
 MAN_pacify_the_countryside_desc: "นับตั้งแตเราขึ้นสูอํานาจ พวกนอกกฎหมายและกบฏพยายามทาทายการปกครองของเราในพื้นที่หางไกลของประเทศ หากเราตองการใหผูคนยอมรับในฐานะรัฐบาล เราตองถอนรากผูกอการรายเหลานี้และแสดงใหประชาชนเห็นวาเราบังคับใชอํานาจปกครองได"
 MAN_pacify_the_countryside_effect_tooltip: "ประจําการทหารไวในบางรัฐเพื่อกําจัดโจรในชนบท\n"
 MAN_army_modernization: "ปรับปรุงกองทัพใหทันสมัย"
 MAN_army_modernization_desc: "กองทัพของเราทั้งเล็กและลาสมัย เมื่อพิจารณาจากทรัพยากรที่เรามี นี่เปนสิ่งที่ยอมรับไมได เราตองแบกรับภาระของเราได"
 MAN_mukden_military_academy: "โรงเรียนนายรอยมุกเดน"
 MAN_mukden_military_academy_desc: "กองทัพของเราตองการนายทหารที่ดีและจงรักภักดีมาเปนผูนํา หากเราตองการพึ่งพาสิ่งอื่นนอกเหนือจากจํานวนคนเพื่อบรรลุเปาหมาย"
 MAN_invite_japanese_settlers: "เชิญผูตั้งถิ่นฐานชาวญี่ปุน"
 MAN_invite_japanese_settlers_desc: "เรามีพื้นที่มากกวาผูคนมาก หลายพื้นที่ของประเทศยังคงเปนปารกราง เราควรนําผูคนไปตั้งถิ่นฐานในพื้นที่เหลานี้เพื่อสรางชุมชนใหมและเปดทางใหพัฒนาเศรษฐกิจไดมากขึ้น"
 MAN_collective_farms: "นารวม"
 MAN_collective_farms_desc: "ระบบไรนารายยอยที่ครอบครัวเดียวเปนเจาของและดําเนินการนั้นทั้งลาหลังและไรประสิทธิภาพ การรวมกําลังพลและที่ดินทั้งหมดของหมูบานเขาเปนหนวยเดียวจะชวยใหการพัฒนามีประสิทธิภาพมากขึ้นอยางมาก"
 MAN_law_university: "มหาวิทยาลัยนิติศาสตร"
 MAN_law_university_desc: "ประเทศของเรายังเยาววัย เรามีโอกาสอยางแทจริงที่จะสรางระบบกฎหมายใหมทั้งหมด โดยอิงจากความเขาใจเรื่องการปกครองที่ทันสมัยที่สุด เพื่อการนี้ เราควรสรางสถาบันเฉพาะทางเพื่อรวบรวมผูมีปญญาเฉียบแหลมที่สุดบางสวนของเอเชียเขาไวดวยกัน"
 MAN_research_and_education_department: "กรมวิจัยและการศึกษา"
 MAN_research_and_education_department_desc: "เมื่อชาติของเราเติบโต เราตองทําใหแนใจวาสถานศึกษาและสถานวิจัยเติบโตตามไปดวย ตองพยายามมากขึ้นเพื่อใหการวิจัยของเรามุงไปยังจุดที่จําเปนที่สุด"
 MAN_trade_delegation: "คณะผูแทนการคา"
 MAN_trade_delegation_desc: "โลกภายนอกกาวหนากวาเราในดานวิธีการทางอุตสาหกรรม เราควรสงคณะผูแทนออกไปศึกษาเทคนิคของพวกเขาเพื่อหาทางปรับปรุงของเราเอง"
 MAN_expand_the_textile_industry: "ขยายอุตสาหกรรมสิ่งทอ"
 MAN_expand_the_textile_industry_desc: "โรงงานสิ่งทอเปนกําลังหลักของอุตสาหกรรมเรามานาน และจะเปนวิธีที่งายที่สุดในการไดมาซึ่งทุนตางชาติเพิ่มเติมเพื่อขยายฐานอุตสาหกรรมของเรา"
 MAN_obedience: "การเชื่อฟง"
 MAN_obedience_desc: "บางคนเรียกเราวาเปนเพียงหุนเชิดของญี่ปุน แตพวกเขาเขาใจผิดโดยพื้นฐานถึงความสัมพันธอันใกลชิดและเทาเทียมของเรา การตอตานผูมีพระคุณของเราก็ไมตางจากเด็กที่ตอตานพอแมของตน"
 MAN_hoankyoku: "โฮอังเคียวกุ"
 MAN_hoankyoku_desc: "รัฐบาลของเราคือความหวังที่ดีที่สุดของจีนสําหรับอนาคตอันสดใส แนนอนวามีหลายคนที่ตองการทําลายมัน เราตองมีองคกรที่จะตามลาคนเหลานี้และปกปองรัฐของเรา"
 MAN_first_five_year_plan: "แผนหาปฉบับที่ 1"
 MAN_first_five_year_plan_desc: "แมจะมีมลทินจากความเกี่ยวของกับคอมมิวนิสต แตแผนหาปก็เปนเครื่องมือที่มีคาในการวางแผนพัฒนาเศรษฐกิจของประเทศ เราควรนําแผนเชนนี้มาใชเพื่อกําหนดทิศทางการขยายอุตสาหกรรมของเรา"
 MAN_invite_japanese_investors: "เชิญนักลงทุนญี่ปุน"
 MAN_invite_japanese_investors_desc: "การพัฒนาประเทศของเราตองอาศัยความชวยเหลือจากภายนอก บริษัทหลายแหงในญี่ปุนไดแสดงความประสงคที่จะลงทุนในประเทศของเรา"
 MAN_expand_the_railways: "ขยายทางรถไฟ"
 MAN_expand_the_railways_desc: "ระบบรถไฟสมัยใหมคือกุญแจสําคัญในการเชื่อมทุกสวนของประเทศ และรวมเขาดวยกันภายใตชายคาเดียว"
 MAN_develop_aluminum_sources: "พัฒนาแหลงอะลูมิเนียม"
 MAN_develop_aluminum_sources_desc: "เรามีแหลงแรบอกไซตขนาดใหญในเหลียวหนิงที่พรอมใหใชประโยชน ซึ่งจะชวยหนุนอุตสาหกรรมการบินของเราอยางสําคัญ"
 MAN_expand_showa_steel_works: "ขยายโรงงานเหล็กโชวะ"
 MAN_expand_showa_steel_works_desc: "โรงงานเหล็กโชวะเปนกระดูกสันหลังของอุตสาหกรรมหนักของเรา การลงทุนในโรงงานนี้จะทําใหเราไดเก็บเกี่ยวผลประโยชนในภายหลัง"
 MAN_social_research_unit: "หนวยวิจัยสังคม"
 MAN_social_research_unit_desc: "เราควรจัดตั้งหนวยพิเศษเพื่อศึกษาวิถีชีวิตและขนบธรรมเนียมของประชาชน เพื่อที่เราจะชี้นําพวกเขาใหเปนพลเมืองที่สรางประโยชนแกชาติไดดีขึ้น"
 MAN_second_five_year_plan: "แผนหาปฉบับที่ 2"
 MAN_second_five_year_plan_desc: "ดวยความสําเร็จของแผนหาปฉบับที่ 1 จึงสมเหตุสมผลที่เราจะทําซํ้าดวยแผนพัฒนาเศรษฐกิจอีกฉบับ"
 MAN_national_defense_state: "รัฐปองกันชาติ"
 MAN_national_defense_state_desc: "จนกวาจะชนะสงครามและเรากลับมาปกครองจีนทั้งหมด เราตองทุมเทความพยายามทุกอยาง พรอมยอมเสียสละทุกสิ่ง และใชทรัพยากรทุกอยางที่มีเพื่อทําสงคราม"
 MAN_mukden_arsenal: "คลังแสงมุกเดน"
 MAN_mukden_arsenal_desc: "คลังแสงหลวงเกาจะเปนแกนกลางของกลุมอุตสาหกรรมทางทหารแหงใหม ที่จะสงอาวุธสมัยใหมใหกองทัพของเรา"
 MAN_mamc: "MAMC"
 MAN_mamc_desc: "การจัดตั้งบริษัทผลิตอากาศยานแมนจูเรียจะทําใหเรามีหนทางสรางกองทัพอากาศสมัยใหมที่ตอกรกับใครก็ได"
 MAN_alliance_with_the_kwantung_army: "เปนพันธมิตรกับกองทัพคันโต"
 MAN_alliance_with_the_kwantung_army_desc: "กองกําลังญี่ปุนในประเทศมักขัดแยงกับแนวคิดของเรา เราควรสรางความสัมพันธที่ใกลชิดกับพวกเขามากขึ้นเพื่อใหทํางานรวมกันโดยมีความขัดแยงนอยที่สุด"
 MAN_chinese_leadership: "การนําโดยชาวจีน"
 MAN_chinese_leadership_desc: "ประชาชนจีนตองการผูนําที่เปนชาวจีน เราควรประกาศตอสาธารณะวาเรามุงหมายสิ่งใดไมนอยไปกวาการฟนฟูการปกครองแหงจักรวรรดิเหนือจีนทั้งหมดอยางสมบูรณ"
 MAN_vassalize_mengukuo: "ทําใหเหมิงเจียงเปนรัฐบริวาร"
 MAN_vassalize_mengukuo_desc: "เจาชายแหงเหมิงเจียงไมเหมาะสมที่จะยืนเคียงขางจักรพรรดิแหงแมนจูกัว ถึงเวลายุติการทดลองไรสาระนี้และจัดใหเขาอยูในที่ทางที่เหมาะสม"
 MAN_national_cooperation_government: "รัฐบาลความรวมมือแหงชาติ"
 MAN_national_cooperation_government_desc: "เราไดรับขาวลืออันนากังวลวาญี่ปุนกําลังพิจารณานักการเมืองจีนคนอื่น ซึ่งเปนสามัญชน ใหจัดตั้งรัฐบาลรวมมือ นี่เปนสิ่งที่ยอมรับไมได เราตองทําใหแนใจวาดินแดนจีนใดก็ตามที่กองกําลังผสมของเรายึดได จะอยูภายใตการบริหารของเรา"
 MAN_the_two_emperors: "สองจักรพรรดิ"
 MAN_the_two_emperors_desc: "ถึงเวลาแลวที่จะเลิกความคิดอันไรสาระที่วาเราเปนอะไรอื่นนอกจากหุนสวนที่เทาเทียมกันอยางสมบูรณของญี่ปุน จักรพรรดิทั้งสองของเราเปรียบดั่งพี่นอง!"
 MAN_assertiveness: "ความแข็งกราว"
 MAN_assertiveness_desc: "ญี่ปุนยังคงปกครองเหนือเราดวยความเยอหยิ่งอันนาขุนเคือง เราควรเตือนพวกเขาวาเราเองก็เปนจักรวรรดิที่ควรคาแกการเคารพเชนกัน"
 MAN_request_control_of_the_railways: "ขอควบคุมทางรถไฟ"
 MAN_request_control_of_the_railways_desc: "ในประเทศที่ใหญโตอยางของเรา การควบคุมทางรถไฟหมายถึงการควบคุมประเทศ \n\nและญี่ปุนคือผูควบคุมทางรถไฟ\n\n สิ่งนี้ตองเปลี่ยนแปลง"
 MAN_staff_the_court_with_manchus: "บรรจุชาวแมนจูเขาราชสํานัก"
 MAN_staff_the_court_with_manchus_desc: "ราชวงศชิงปกครองจีนมาหลายศตวรรษ หากเราตองการทวงคืนความรุงโรจนในอดีต เราตองดําเนินตามแบบอยางของพวกเขาใหใกลเคียงที่สุดเทาที่จะทําได"
 MAN_expand_the_imperial_guards: "ขยายกองราชองครักษ"
 MAN_expand_the_imperial_guards_tt: "ไดรับ 4 หนวยที่มีกองพัน§Yทหารราบ 7§! กองพันและ§Yปนใหญ 2§! กองพัน\n"
 MAN_expand_the_imperial_guards_desc: "กองราชองครักษจะเปนหนวยชั้นยอดของกองทัพใหม และเปนแบบอยางที่ทหารทุกนายใฝฝนจะเปน"
 MAN_local_arms_procurement: "จัดหาอาวุธในทองถิ่น"
 MAN_local_arms_procurement_desc: "เราไมอาจพึ่งพาใหญี่ปุนจัดสงปนใหเราตลอดไป หากเราตองการยืนไดดวยตนเอง เราตองมีแหลงอาวุธที่เราควบคุมเอง"
 MAN_bolster_nationalism: "ปลุกกระแสชาตินิยม"
 MAN_bolster_nationalism_desc: "ผูคนมองวาแมนจูกัวเปนสิ่งประดิษฐที่ญี่ปุนสรางขึ้นมานานเกินไปแลว แตทุกชาติลวนเคยเปนเพียงแนวคิดมากอน เราตองสรางสํานึกในอัตลักษณแมนจูใหเกิดในหมูประชาชน และเปลี่ยนแนวคิดใหกลายเปนความจริง"
 MAN_five_equal_peoples: "หาชนชาติเสมอภาค"
 MAN_five_equal_peoples_desc: "วันเวลาที่ชนชาติหนึ่งปกครองเหนือชนชาติอื่นทั้งหมดไดผานพนไปแลว แมนจูกัวจะเปนชาติรูปแบบใหม ที่หาชนชาติ ไดแก รัสเซีย ญี่ปุน มองโกล เกาหลี และแมนจู จะอยูรวมกันอยางกลมเกลียว"
 MAN_white_russian_advisers: "ที่ปรึกษารัสเซียขาว"
 MAN_white_russian_advisers_desc: "หลังสงครามกลางเมืองรัสเซีย ชาวรัสเซียจํานวนหนึ่งเลือกลี้ภัยแทนที่จะเผชิญชะตากรรมใดก็ตามที่โซเวียตวางไวใหศัตรูผูพายแพ เราสามารถใชคนเหลานี้ฟนฟูและฝกฝนกองทัพของเรา"
 MAN_empower_the_legislative_council: "เสริมอํานาจสภานิติบัญญัติ"
 MAN_empower_the_legislative_council_desc: "ปจจุบันสภานิติบัญญัติเปนเพียงองคกรเชิงพิธีการที่เห็นชอบทุกสิ่งที่เจาเหนือหัวชาวญี่ปุนเสนอมา หากเราตองการเปนชาติอธิปไตยที่แทจริง เราตองมีอํานาจปกครองตนเองอยางเต็มที่ในเรื่องนิติบัญญัติเสียกอน"
 MAN_five_people_armies: "กองทัพหาชนชาติ"
 MAN_five_people_armies_desc: "หากพลเมืองทุกคนเทาเทียมกัน พลเมืองทุกคนก็ตองพรอมและเต็มใจปกปองชาติจากผูกดขี่ตางชาติอยางเทาเทียมกัน"
 MAN_five_people_armies_tt: "ไดรับ 7 หนวยที่มีกองพัน§Yทหารราบ 3§! กองพัน\n"
 MAN_purge_the_general_affairs_council: "กวาดลางสภากิจการทั่วไป"
 MAN_purge_the_general_affairs_council_desc: "สภากิจการทั่วไปถูกตั้งขึ้นโดยญี่ปุนเพื่อใหพวกเขาควบคุมรัฐบาลของเราไดอยางสมบูรณ สิ่งนี้จะดําเนินตอไปไมได เราตองกําจัดทุกคนที่ความจงรักภักดีตอรัฐบาลของเรานาสงสัยแมเพียงเล็กนอย"
 MAN_reform_the_civil_service: "ปฏิรูประบบราชการพลเรือน"
 MAN_reform_the_civil_service_desc: "สภากิจการทั่วไปเปนเพียงยอดภูเขานํ้าแข็ง ญี่ปุนบริหารระบบราชการพลเรือนสวนใหญโดยอยูนอกการควบคุมของเราอยางสิ้นเชิง เราตองแตงตั้งผูบริหารของเราเอง"
 MAN_independence_war: "สงครามประกาศเอกราช"
 MAN_independence_war_desc: "ถึงเวลาแลวที่จะสลัดพันธนาการแหงการกดขี่และสูเพื่ออิสรภาพอันเกาแกของเรา แมนจูกัวจะเปนสวนแรกของจีนที่ไดหายใจอยางเสรีจากการกดขี่ของตางชาติทั้งปวง"
 MAN_imperial_divinity: "ความศักดิ์สิทธิ์แหงองคจักรพรรดิ"
 MAN_imperial_divinity_desc: "ในอดีต จักรพรรดิจีนไดรับการเคารพบูชาดั่งเทพเจาที่มีชีวิต เราตองเชื่อมโยงองคจักรพรรดิองคปจจุบันเขากับประเพณีโบราณนี้อีกครั้ง"
 MAN_imperial_university: "มหาวิทยาลัยหลวง"
 MAN_imperial_university_desc: "จักรวรรดิตองการคนที่ปราดเปรื่องเพื่อสานตออุดมการณ เราควรสรางสถานที่ซึ่งผูที่ดีที่สุดและเกงที่สุดของเรามารวมตัวกันเพื่อสอนและเรียนรูจากกันและกัน"
 MAN_move_capitals: "ยายเมืองหลวง"
 MAN_move_capitals_desc: "เมืองหลวงเกาแกของจีนทั้งปวงคือปกกิ่งมาโดยตลอด บัดนี้เมื่อยึดคืนมาไดแลว เราสามารถนําองคจักรพรรดิเสด็จกลับสูที่ประทับเดิมอยางผูมีชัย"
 MAN_claim_the_mandate_of_heaven: "อางอาณัติแหงสวรรค"
 MAN_claim_the_mandate_of_heaven_desc: "ชัยชนะของเราในสงครามแสดงใหเห็นชัดวาสวรรคเองไดตัดสินแลววาองคจักรพรรดิทรงธรรมและคูควรกับบัลลังกสวรรค ขอสงสัยใด ๆ ที่วาพระองคไมใชผูปกครองอันชอบธรรมของจีนทั้งปวงตองมลายไปตอหนาหลักฐานอันทวมทนเชนนี้"
 MAN_reclaim_the_empire: "ทวงคืนจักรวรรดิ"
 MAN_reclaim_the_empire_desc: "บัดนี้เมื่อเราไดรับอิสรภาพแลว ถึงเวลาที่จะทําสงครามตอไปกับพวกทรยศและกบฏในสวนอื่นของจีน เราจะปกครองประเทศนี้ หรือไมก็พินาศไปในความพยายามนั้น"
 MAN_assert_our_authority: "ประกาศอํานาจของเรา"
 MAN_assert_our_authority_desc: "สวนอื่นของประเทศแตกแยกกันภายใน ไมมีผูแยงชิงอํานาจหรือโจรคนใดที่เรียกตัวเองวาขุนศึกหรือประธานที่เหมาะสมจะปกครอง พวกเขาจะถูกปราบใหสยบ และการปกครองอันรูแจงของเราจะแผขยายไปทั่วจีน"
 MAN_offer_vassalization: "เสนอใหเปนรัฐบริวาร"
 MAN_offer_vassalization_desc: "สงครามไดฉีกประเทศออกเปนเสี่ยง ๆ เราสามารถยุติมันได หากเรามอบที่ยืนในราชสํานักใหแกผูที่ยังไมยอมเลือกขาง"