 POL_defend_in_east_state_desc: "ภาคตะวันออกหางไกลและดอยพัฒนา ธรรมชาติครอบงําดินแดนนี้ไมนอยกวาที่เราปกครอง เราตองฝกทหารใหใชภูมิประเทศรอบตัวใหเปนประโยชน และทําใหรัสเซียที่บุกเขามากระจัดกระจายและสับสน"
 POL_defend_in_west_state: "แผนการปองกัน [From.GetName]"
 POL_defend_in_west_state_desc: "ภาคตะวันตกคือที่ตั้งของอุตสาหกรรมสวนใหญของเรา และจําเปนยิ่งที่ตองปกปองไวจากเยอรมัน เราตองวางยุทธศาสตรการปองกันเฉพาะพื้นที่ในภาคตะวันตก หากจะตานทานกําลังพลมหาศาลที่ชายแดนของเราได"
 POL_four_year_plan_mission: "เตรียมพรอมสําหรับแผนสี่ปถัดไป"
 POL_four_year_plan_mission_desc: "แผนสี่ปกําลังดําเนินอยู เราตองทําตามคํามั่นในการปฏิรูปและสรางอุตสาหกรรมใหประเทศใหสําเร็จ หากจะเตรียมตัวใหพรอมอยางเพียงพอสําหรับสี่ปขางหนา"
 
