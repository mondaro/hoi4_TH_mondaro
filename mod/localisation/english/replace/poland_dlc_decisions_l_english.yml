l_english:
 POL_danzig_decisions: "นคร 'เสรี' ดานซิก"
 POL_danzig_decisions_desc: "ดานซิกเปนหนามยอกอกเศรษฐกิจโปแลนดมานานเกินไปแลว! ถึงเวลาที่เราจะเขาควบคุมนครแหงนี้ แตสิ่งนี้จะสําเร็จไดก็ตอเมื่อไดรับความรวมมือจากคนทองถิ่นในระดับหนึ่ง…"
 POL_unification_propaganda: "โฆษณาชวนเชื่อเพื่อการรวมชาติ"
 POL_unification_propaganda_desc: "ดานซิกเปนนครที่มีความหลากหลายทางวัฒนธรรม ทั้งชาวโปล ชาวเยอรมัน และชนกลุมนอยอีกนับไมถวน และพรรคนาซีพยายามทําลายความรวมมือระหวางวัฒนธรรมนี้ โฆษณาชวนเชื่อที่ไดผลจะดึงชนกลุมนอยของนครมาอยูฝายเรา ดวยคํามั่นถึงความเทาเทียมที่พวกนาซียอมตายเสียดีกวาจะมอบให"
 POL_military_appeasement: "การผอนปรนทางทหาร"
 POL_military_appeasement_desc: "นครเสรีดานซิกไมอาจผนวกรวมไดดวยกําลังอยางเดียว การผอนปรนบางสวนอาจทําใหกองกําลังอาสาดานซิกเห็นพองกับวิสัยทัศนของโปแลนดที่มีตอนครแหงนี้มากขึ้น"
 POL_raid_nazi_resistance: "กวาดลางกลุมตอตานนาซี"
 POL_raid_nazi_resistance_desc: "ในนครมีผูที่พรอมจะมอบกุญแจแหงเสรีภาพของตนใหพวกนาซี และทําใหนครตกอยูใตอํานาจเบอรลิน กลุมคนเหลานี้ตองถูกกําจัดออกจากนครไมวาจะตองแลกดวยอะไร แมวาปฏิบัติการทางทหารที่รุนแรงอาจสงผลเสียตอภาพลักษณของเราในสายตาคนทองถิ่น"
 POL_tighten_control: "กระชับการควบคุม"
 POL_tighten_control_desc: "เราไดรับการยอมรับปกครองในนครมากพอที่จะกระชับการควบคุมโดยไมกอความไมสงบ ดวยวิธีนี้ เราจะเขาถึงทรัพยากรของดานซิกไดมากขึ้นและเขาใกลการรวมนครเปนหนึ่งเดียวยิ่งขึ้น"
 POL_sanation_decisions: "รัฐบาลซานัตซยาแหงโปแลนด"
 POL_sanation_decisions_desc: "กลุมซานัตซยาแตกออกเปนคายซายและขวา ซึ่งตางพยายามบอนทําลายการปกครองของเรา เราตองเอาใจและกันแตละฝายออกไปอยางเหมาะสม เพื่อสรางรัฐบาลที่มั่นคงสําหรับอนาคตของโปแลนด!"
 POL_sanation_left_irritation: "ความไมพอใจของซานัตซยาฝายซาย"
 POL_sanation_left_irritation_desc: "ซานัตซยาฝายซายเบื่อหนายกับการถูกกีดกันและผลักไสภายใตระบอบของมอชชิตสกี จึงพยายามฟนฟูรัฐบาลของอดีตนายกรัฐมนตรี วาเลรี สวาเวก"
 POL_sanation_right_irritation: "ความไมพอใจของซานัตซยาฝายขวา"
 POL_sanation_right_irritation_desc: "ดวยกองทัพสวนใหญอยูขางตน ซานัตซยาฝายขวาพยายามบอนทําลายระบอบเผด็จการและตั้งคณะรัฐประหารทหารภายใตการนําของเอดวารด รึตส-ชมิกวือ ดวยสายสัมพันธทั้งกับกองทัพและกองกําลังกึ่งทหารฟาลังกิสต ซานัตซยาฝายขวาจึงเปนกลุมการเมืองที่อันตราย"
 POL_sideline_the_left: "กันฝายซายออกไป"
 POL_sideline_the_left_desc: "ดวยความชวยเหลือจากฝายขวา เราอาจกันฝายซายออกไปและผลักพวกเขาใหไปอยูชายขอบทางการเมืองของสังคมเรายิ่งขึ้น"
 POL_sideline_the_right: "กันฝายขวาออกไป"
 POL_sideline_the_right_desc: "แมฝายขวาจะทรงอิทธิพล แตก็อาจถูกผลักใหหมดความสําคัญทางการเมืองไดดวยการรวมมือกันโจมตีของฝายซายและกลุมปราสาท"
 POL_peasant_strike_category: "การนัดหยุดงานของชาวนา"
 POL_peasant_strike_category_desc: ""
 POL_looming_peasants_strike_mission: "การนัดหยุดงานของชาวนาที่ใกลจะเกิดขึ้น"
 POL_looming_peasants_strike_mission_desc: "ชาวนาไมพอใจ เรียกรองคาแรงที่สูงขึ้นและราคาอาหารที่ลดลงอยางมาก เสนทางรถไฟที่ยํ่าแยทางตะวันออกของโปแลนดทําใหการสงอาหารและยุทโธปกรณไปยังภูมิภาคนั้นมีคาใชจายสูง แตหากลงทุนดานรถไฟเพิ่มเติม เราอาจตอบสนองขอเรียกรองของชาวนาได"
 POL_peasants_strike: "การนัดหยุดงานของชาวนา!"
 POL_peasants_strike_desc: "ความตึงเครียดทางตะวันออกปะทุขึ้นแลว หากเราไมคลี่คลายวิกฤตนี้โดยเร็วที่สุด เราอาจตองเผชิญสงครามกลางเมือง การนัดหยุดงานที่นําโดยสตานิสวัฟ มิโควายชิก ผูนําพรรคชาวนา ไดกอตั้งแนวรวมของฝายประชาธิปไตย สังคมนิยม และคอมมิวนิสต เพื่อตอตานรัฐบาลโปแลนด และหากเพิกเฉยจะลุกลามเปนกบฏ"
 POL_invite_foreign_motor_decisions: "เชิญบริษัทยานยนตตางชาติ"
 POL_invite_foreign_motor_decisions_desc: ""
 POL_invite_ford: "เชิญฟอรดมอเตอร"
 POL_invite_ford_desc: "ราคาถูก มีประสิทธิภาพ และเปนอเมริกัน ฟอรดมอเตอรสามารถผลิตยุทโธปกรณยานยนตจํานวนมากไดในอัตราที่ไมมีใครเทียบ"
 POL_invite_vauxhall: "เชิญวอกซฮอลล"
 POL_invite_vauxhall_desc: "ชาวอังกฤษไดพิสูจนแลววายุทโธปกรณยานยนตของพวกเขาเร็วกวาและมีคุณภาพบนทองถนนสูงกวาที่ใดในโลก"
 POL_invite_somua: "เชิญโซมัว"
 POL_invite_somua_desc: "ยานยนตและยานเกราะของฝรั่งเศสทนทานกวายานของชาติใด และสามารถรับกระสุนจากยานขาศึกไดโดยแทบไมไดรับความเสียหาย นี่คือยานพาหนะแบบที่เราตองการเพื่อเอาตัวรอดในสงคราม"
 POL_miedzymorze_decisions: "มีนดือมอเชอ"
 POL_miedzymorze_decisions_desc: ""
 POL_diplomatic_mission_to_FIN: "คณะทูตไปยัง [FIN.GetNameDef]"
 POL_diplomatic_mission_to_FIN_desc: "หากเราจะโนมนาวชาติอื่นใหเขารวมอินเตอรมาเรียม เราตองทําใหพวกเขาเชื่อวาเปนประโยชนสูงสุดตอตนเอง การสงยูเซฟ เบ็ก ไปปฏิบัติภารกิจทางการทูตจะเพิ่มโอกาสอยางมากที่เราจะสรางพันธมิตรเชิงปองกันตามที่ใฝฝนไว"
