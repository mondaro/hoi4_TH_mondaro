l_english:
 treaty_org.1.t: "สนธิสัญญาบรัสเซลส"
 treaty_org.1.desc: "เมื่อภัยคุกคามระดับโลกที่เรงดวนถูกจัดการแลว ความตกลงอันเปราะบางระหวาง[SOV.GetNameDef]กับพันธมิตรตะวันตกก็เริ่มเสื่อมถอยลง\n\nดวยความหวั่นเกรงวาการติดตอสื่อสารจะพังทลายจนไมอาจกูคืน ประกอบกับความทะเยอทะยานที่ขัดแยงกันในยุโรป ดังที่เห็นไดจากพัฒนาการลาสุดในเยอรมนีตะวันออก [FROM.GetNameDef]จึงไดเสนอสนธิสัญญาชวยเหลือซึ่งกันและกันในการประชุมเรงดวนที่บรัสเซลส"
 treaty_org.1.a: "ภัยคุกคามจากตะวันออกตองถูกสกัดกั้น"
 treaty_org.1.b: "เราไมตองการสงครามอีกแลว..."
 join_brussels_treaty_tt: "เราจะลงนามในสนธิสัญญาบรัสเซลส"
 SOV_chose_NATO_neutrality: "เลือกความเปนกลาง"
 SOV_joined_NATO: "ลงนามสนธิสัญญาบรัสเซลสแลว"
 NATO_brussels_treaty: "สนธิสัญญาบรัสเซลส"
 NATO_brussels_treaty_desc: "เมื่อภัยคุกคามระดับโลกที่เรงดวนถูกจัดการแลว ความตกลงอันเปราะบางระหวาง[SOV.GetNameDef]กับพันธมิตรตะวันตกก็เริ่มเสื่อมถอยลง"
 nato_decisions: "องคการสนธิสัญญา"
 brussels_to_has_already_happened: "ยังไมมีการเปดประชุมที่บรัสเซลส"
 TO_will_be_invited_to_join_or_leave: "จะเลือกลงนามในสนธิสัญญา หรือจะออกจาก[ROOT.GetFactionName]\n"
 TO_chose_neutrality: "ความเปนกลางดวยความจําเปน"
 TO_chose_neutrality_desc: "ขณะที่พายุกําลังกอตัวระหวางตะวันออกกับตะวันตก สถานะของเราจําเปนตองใชแนวทางที่รอบคอบ"
 TO_left_faction: "ออกจาก[FROM.GetFactionName]แลว"
 TO_signed_brussels: "ลงนามสนธิสัญญาบรัสเซลสแลว"
 treaty_org.2.t: "ลงนามสนธิสัญญาบรัสเซลสแลว"
 treaty_org.2.desc: "ในความเคลื่อนไหวที่ยํ้าเตือนโลกวาสิ่งเลวรายที่สุดยังไมผานพนไป อดีตชาติมหาอํานาจฝายสัมพันธมิตรหลายชาติไดประกาศลงนามในสนธิสัญญาฉบับใหมที่บรัสเซลสในวันนี้\n\nแมโดยเปลือกนอกจะเปนสนธิสัญญาความรวมมือซึ่งกันและกันทั้งดานพลเรือนและการทหาร แตแทบไมมีใครสงสัยเลยวาสิ่งนี้สงสารอะไรถึงผูนําและพันธมิตรของ[SOV.GetNameDef]\n\nหลายรัฐที่ติดอยูทามกลางความตึงเครียดทางภูมิรัฐศาสตรนี้ไดถือโอกาสประกาศหลักการความเปนกลางอยางเปนทางการ"
 treaty_org.2.a: "พัฒนาการที่นากังวล"
 treaty_org.2.b: "การยั่วยุอยางเลือดเย็น"
 NATO_form_nato_properly: "ใหสัตยาบันองคการสนธิสัญญาแอตแลนติกเหนือ"
 NATO_suggest_nato: "โครงการสนธิสัญญาแอตแลนติกเหนือ"
 NATO_suggest_nato_desc: "การขยายสนธิสัญญาบรัสเซลสคือกาวตอไปที่สมเหตุสมผลสําหรับพันธมิตรของเรา"
 treaty_org.3.t: "องคการสนธิสัญญาแอตแลนติกเหนือ"
 treaty_org.3.desc: "รัฐบาลของ[USA.GetNameDef]และ[FROM.GetNameDef] ไดประกาศจัดตั้งองคการสนธิสัญญาแอตแลนติกเหนือเมื่อคืนนี้ ในการเดินหมากทางการทูตที่คาดการณกันมานาน ดวยคํามั่นถึงยุคแหงความรวมมือดานพลเรือน การทหาร และขาวกรองอันรุงโรจน การตัดสินใจนี้ไดรับการตอบรับอยางไมดีนักจากผูนําระดับสูงของ[SOV.GetNameDef]\n\nดูเหมือนวาสันติภาพอาจเปนเพียงสิ่งชั่วคราว"
 treaty_org.3.a: "นาสนใจ"
 treaty_org.3.b: "นารังเกียจ"
 treaty_org.4.desc: "รัฐบาลของ[FROM.GetNameDef] ไดประกาศจัดตั้งองคการสนธิสัญญาแอตแลนติกเหนือเมื่อคืนนี้ ในการเดินหมากทางการทูตที่คาดการณกันมานานแตคอนขางไรนํ้ายา ดวยคํามั่นถึงยุคแหงความรวมมือดานพลเรือน การทหาร และขาวกรองอันรุงโรจน การตัดสินใจนี้ไดรับการตอบรับอยางไมดีนักจากผูนําระดับสูงของ[SOV.GetNameDef]\n\nดูเหมือนวาสันติภาพอาจเปนเพียงสิ่งชั่วคราว"
 treaty_org.4.a: "นาสนใจ"
 treaty_org.4.b: "ดูไมคอยจะเปนแอตแลนติกเหนือเทาไรนะ"
 TO_nato_ratified: "สนธิสัญญาแอตแลนติกเหนือ"
 TO_nato_ratified_desc: "สนธิสัญญาที่ชาติของเราจะไดรวมทรัพยากรและขาวกรองเขาดวยกัน ดวยเหตุผลบางประการ"
 nato_not_suggested_yet: "ยังไมมีการเสนอนาโต"
 north_atlantic_treaty_org: "นาโต"
 warsaw_pact: "กติกาสัญญาวอรซอ"
 NATO_have_warsaw_pact: "เสนอกติกาสัญญาวอรซอ"
 NATO_have_warsaw_pact_desc: "การตอบโตสนธิสัญญาบรัสเซลสที่ถูกตองเพียงทางเดียวคือการจัดตั้งกลุมของเราเอง"
 treaty_org.5.d: "ดวยความหวั่นเกรงวาจะติดอยูกลางความขัดแยงครั้งใหมระหวางตะวันออกกับตะวันตก [FROM.GetNameDef]ไดประกาศเจตนาที่จะออกจาก[ROOT.GetFactionName]ในทันที ถาอยูในฐานะเดียวกัน ใครจะกลาวโทษพวกเขาไดเลา?"
 treaty_org.5.t: "[FROM.GetName]เลือกความเปนกลาง"
 treaty_org.5.a: "รับทราบ"
