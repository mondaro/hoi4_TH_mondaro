 branch_defense: "การปองกัน"
 branch_operation: "ปฏิบัติการ"
 branch_operative: "การฝกสายลับ"
 branch_crypto: "แผนกวิทยาการรหัสลับ"
 upgrade_economy_civilian: "เศรษฐกิจ/พลเรือน"
 upgrade_economy_civilian_desc: "§Lสายลับของเราจะไดรับการฝกใหแฝงตัวเปนพลเรือนในดินแดนศัตรู และปฏิบัติงานในภาคอุตสาหกรรมและภาคพลเรือนของพวกเขา เพื่อรวบรวมขาวกรองเกี่ยวกับอุตสาหกรรมและเศรษฐกิจของศัตรู§!"
 upgrade_army_department: "แผนกกองทัพบก"
 upgrade_army_department_desc: "§Lขาวกรองเกี่ยวกับกองทัพศัตรูมีความสําคัญยิ่ง และจําเปนตองจัดตั้งแผนกขาวกรองทางทหาร สายลับของเราจะไดรับการฝกใหแทรกซึมเขาไปในกองทัพศัตรู ทําหนาที่เปนทั้งทหารและนายพล แลวรายงานความลับที่พบหลังแนวขาศึกกลับมายังเรา§!"
 upgrade_naval_department: "แผนกกองทัพเรือ"
 upgrade_naval_department_desc: "§Lการรบในทองทะเลเปนสวนสําคัญในการควาชัยชนะ และดวยความกาวหนาของเทคโนโลยีทางเรือ จึงเปนเรื่องจําเปนยิ่งที่เราตองจัดตั้งแผนกขาวกรองทางเรือ§!"
 upgrade_airforce_department: "แผนกกองทัพอากาศ"
 upgrade_airforce_department_desc: "§Lแผนกขาวกรองทางอากาศจะเปนสาขาที่มีประโยชนของหนวยงานเรา มีหนาที่แทรกซึมกองทัพอากาศของศัตรูและรวบรวมขาวกรองเกี่ยวกับความเคลื่อนไหวของอากาศยานศัตรู§!"
 upgrade_passive_defense: "การปองกันเชิงรับ"
 upgrade_passive_defense_desc: "§Lกองกําลังรักษาดินแดนมีศักยภาพที่จะเปนเครื่องมือสําคัญของงานขาวกรองของเรา ดวยการฝกกองกําลังรักษาดินแดนและกองรักษาการณใหรูจักวิธีการจารกรรมและการตอตานขาวกรอง เราจะมั่นใจไดวามีกําลังปองกันอยูในประเทศเสมอ แมในยามที่ผูเชี่ยวชาญของเราติดภารกิจอื่น§!"
 upgrade_anti_partisan: "การปราบปรามกองโจร"
 upgrade_anti_partisan_desc: "§Lการโฆษณาชวนเชื่อเปนเครื่องมืออันทรงพลังในการสรางความภักดีของพลเมืองเราเอง แตการสรางการยอมรับปกครองในดินแดนศัตรูนั้นซับซอนกวามาก ดวยการฝกสายลับใหแทรกซึมเขาไปในขบวนการตอตานของศัตรู เราอาจเริ่มจับกุมไดอยางไดผลและยุติกิจกรรมกอกวนของพวกเขา เมื่อนั้นกองโจรตางชาติยอมหมดหวังที่จะไดกลับคืนสูระบอบเดิมของตน§!"
 upgrade_blueprint_stealing: "การขโมยพิมพเขียว"
 upgrade_blueprint_stealing_desc: "§Lเรารูวาศัตรูมีโครงการลับเพื่อพัฒนาอาวุธและยานพาหนะทดลอง แตสิ่งที่เราไมรูคือโครงการเหลานั้นคืออะไรและพวกเขากําลังสรางอะไร ดวยการแทรกซึมเขาไปในแผนกอาวุธทดลองของศัตรู เราไมเพียงไดรูแนชัดวาพวกเขาวางแผนจะใชสิ่งใดกับเรา แตยังไดโอกาสพิเศษที่จะใชขอมูลนี้พัฒนาแผนกอาวุธของเราเองใหกาวหนา§!"
 upgrade_portable_radios: "วิทยุพกพา"
 upgrade_portable_radios_desc: "§Lอุปกรณสื่อสารวิทยุแบบดั้งเดิมมีขนาดใหญและเคลื่อนยายยากเกินกวาจะใชในงานลับได แตดวยการสรางเทคโนโลยีนี้ในรูปแบบกะทัดรัดและอําพรางใหดูเหมือนขาวของในบานทั่วไปอยางกระเปาเอกสาร สายลับของเราจะสามารถติดตอสื่อสารไดตลอดเวลาโดยไมทําใหใครสงสัยหรือตื่นตระหนก§!"
 upgrade_invisible_ink: "หมึกลองหน"
 upgrade_invisible_ink_desc: "§Lจดหมายที่เขียนดวยหมึกลองหนเปนเพียงกระดาษเปลาเมื่อมองดวยตาเปลา แตหากใชแสงอัลตราไวโอเลตหรือสารเคมีอยางแอมโมเนีย เนื้อความในจดหมายจะปรากฏขึ้น ดวยการกําหนดใหสายลับทุกคนใชหมึกลองหนเปนมาตรฐาน ขอมูลของเราจะยังคงเปนความลับแมถูกศัตรูดักจับได§!"
 upgrade_plastic_explosives: "วัตถุระเบิดพลาสติก"
 upgrade_plastic_explosives_desc: "§Lเนื้อสัมผัสคลายดินนํ้ามันของวัตถุระเบิดพลาสติกทําใหมันเหมาะอยางยิ่งสําหรับการกอวินาศกรรมการผลิตของศัตรู จึงเปนเรื่องธรรมดาที่เราจะติดอาวุธนี้ใหกองโจรตางชาติ ระเบิดสามารถซุกซอนไวในจุดเปราะบางของโรงงานศัตรูไดงาย และคุณสมบัติที่ปนไดของมันยังทําใหเปนอาวุธในอุดมคติสําหรับการลอบสังหารทางการเมืองที่สะทานโลก...§!"
 upgrade_suicide_pills: "ยาพิษปลิดชีพ"
 upgrade_suicide_pills_desc: "§Lแมไมมีใครปรารถนา แตหลีกเลี่ยงไมไดที่สายลับจํานวนหนึ่งจะถูกศัตรูจับตัวไป เราตองมอบหนทางใหสายลับหลีกหนีความนาสยดสยองที่รอพวกเขาอยูในหองสอบสวน และเม็ดยาไซยาไนดที่ฝงแทนฟนซี่หนึ่งจะเปนทางหนีนั้นใหแกพวกเขา หากถึงคราวจําเปน§!"
 upgrade_training_centers: "ศูนยฝกอบรมประจําทองถิ่น"
 upgrade_training_centers_desc: "§Lแมสายลับของเราจะปรับตัวเขากับทุกสภาพแวดลอมได แตบรรทัดฐานทางวัฒนธรรมและภาษาของดินแดนตางชาติยอมเปนธรรมชาติกวาสําหรับผูที่เกิดและเติบโตในวัฒนธรรมนั้น หากเราจะสรางเครือขายสายลับทั่วโลก เราตองขยายศูนยรับสมัครและฝกอบรมไปทั่วโลก และรับสมัครสายลับจากทุกวัฒนธรรมและภูมิหลัง§!"
 upgrade_commando_training: "การฝกคอมมานโด"
 upgrade_commando_training_desc: "§Lแมแผนกของเรามักจัดการกับแงมุมที่แนบเนียนของสงคราม แตบอยครั้งสิ่งที่จําเปนตอความสําเร็จของปฏิบัติการคือทีมทหารขนาดเล็กที่มีอาวุธหนัก ดวยการฝกสายลับทุกคนใหรูจักวิธีการรบแบบคอมมานโด พวกเขาจะกอวินาศกรรมไดมีประสิทธิภาพยิ่งขึ้น ถูกหนวยตอตานขาวกรองของศัตรูตรวจพบไดยากขึ้น และยึดอุปกรณรหัสลับของศัตรูไดเกงขึ้น§!"
 upgrade_interrogation_techniques: "เทคนิคการสอบสวน"
 upgrade_interrogation_techniques_desc: "§Lบอยครั้งการทําลายจิตใจของสายลับศัตรูไดผลกวาการทําลายรางกาย การใชกําลังทางกายนั้นเชื่อถือไมไดและมักไดขอมูลเท็จ ผูสอบสวนที่มีฝมืออยางแทจริงสามารถทําลายเจตจํานงของศัตรูไดโดยไมตองใชความรุนแรง แตหากถึงคราวจําเปน เราก็มีวิธีทําใหพวกเขาเปดปาก...§!"
 upgrade_diplo_training: "การฝกดานการทูต"
 upgrade_diplo_training_desc: "§Lการฝกสายลับของเราใหรูจักติดสินบนนักลงทุนและนักการทูตตางชาติบางคน อาจโนมนาวใหพวกเขาเชื่อในความดีงามของอุดมการณเรา และหันเหผลประโยชนของพวกเขาออกหางจากศัตรูของรัฐ§!"
 upgrade_psycho_warfare: "สงครามจิตวิทยา"
 upgrade_psycho_warfare_desc: "§Lการโฆษณาชวนเชื่อเปนเครื่องมือที่ไดผลในการรักษาผลประโยชนทางอุดมการณภายในรัฐของเราเอง แตไมมีเครื่องมือใดไดผลเทากับการปลุกความหวาดกลัวตอระบอบศัตรูและสิ่งที่พวกเขาอาจนํามาสูประเทศ ดวยการใหสายลับของเรารวมมือกับขบวนการตอตานอุดมการณในตางชาติ เราจะเผยแพรอุดมการณของเราไปทั่วโลกไดอยางมีประสิทธิภาพยิ่งขึ้น...§!"
 upgrade_form_department: "จัดตั้งแผนก"
 upgrade_form_department_desc: "§Lวิทยาการรหัสลับคือวิธีการสรางรหัสและการเขารหัสเพื่อรักษาการสื่อสารใหเปนความลับ หากไมมีรหัสที่จําเปน ขอความที่เขียนดวยการเขารหัสแทบจะไมสามารถเขาใจได การเขารหัสขอมูลของเราสําคัญพอ ๆ กับการถอดรหัสขอมูลของศัตรู§!"
 upgrade_decryption_boost: "กลุมดักฟงวิทยุ"
 upgrade_decryption_boost_desc: "§Lคลื่นวิทยุทําใหสามารถสื่อสารทางไกลขามระยะทางไกลได และสัญญาณมักถูกเขารหัสโดยเปลี่ยนความถี่การออกอากาศอยูตลอดในอัตราที่ไมสมํ่าเสมอ หากเราจะดักฟงการสื่อสารของศัตรู เราตองจัดตั้งกลุมดักฟงที่ทุมเทใหกับการถอดรหัสวิทยุของศัตรู§!"
 upgrade_decryption_boost_2: "การถอดรหัสดวยเครื่องจักร"
 upgrade_decryption_boost_2_desc: "§Lเครื่องจักรไดพิสูจนแลววามีประโยชนในการเขารหัสขอมูล โดยสัญญาณที่เขารหัสดวยเครื่องจักรนั้นถอดรหัสไดยากที่สุด เครื่องวิเคราะหรหัสจึงจําเปนอยางยิ่งในการเจาะขอความที่เรายังไมรูรหัส และจะเปนทรัพยสินอันมีคาของทีมถอดรหัสของเรา§!"
