 BECOME_SPY_MASTER_BUTTON: "เปนหัวหนาสายลับ"
 BECOME_SPY_MASTER_ALREADY_MASTER: "§Rคุณเปน $HEADOF$ อยูแลว§!"
 BECOME_SPY_MASTER_FACTION_NEEDED: "§Rคุณตองอยูในฝายจึงจะเปน $HEADOF$ ได§!"
 BECOME_SPY_MASTER_UPGRADES_NEEDED: "§Rคุณตองมีหนวยขาวกรองที่มีการยกระดับสาขาตางกัน $NUMBER$ รายการ จึงจะเปน $HEADOF$ ได§!"
 BECOME_SPY_MASTER_NO_SUBJECT: "§Rรัฐในอารักขาไมสามารถเปนหัวหนาสายลับได§!"
 BECOME_SPY_MASTER_COOLDOWN: "§Rอีกประเทศหนึ่งเพิ่งเขารับตําแหนงนี้ในฝายของเรามาไมถึง $COOLDOWN|H$ วัน เราตองรอจนถึง $DATE|H$ จึงจะสามารถรับตําแหนง $HEADOF$ ได§!"
 BECOME_SPY_MASTER_COST: "จะมีคาใชจาย £pol_power $VALUE$ ในการเปน $HEADOF|H$"
 BECOME_SPY_MASTER_COST_FI: "จะมีคาใชจาย £faction_initiative_texticon£ $VALUE$ ในการเปน $HEADOF|H$"
 BECOME_SPY_MASTER_DESC: "ในฐานะ§Hหัวหนาสายลับ§! คุณสามารถควบคุมสายลับไดมากขึ้น โดยจํานวนขึ้นอยูกับขนาดของฝายของคุณ\nแตละฝายมี§Hหัวหนาสายลับ§!ไดเพียงหนึ่งเดียว และหากฝายของคุณมี§Hหัวหนาสายลับ§!อยูแลว ผูนั้นตองยินยอมใหคุณรับตําแหนงแทน"
