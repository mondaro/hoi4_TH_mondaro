 AGENCY_UPGRADE_CURRENT_EFFECT: "§Hผลปจจุบัน:§!\n"
 AGENCY_UPGRADE_NEXT_LEVEL: "§Hระดับถัดไป:§!\n"
 AGENCY_UPGRADE_RESEARCHED: "§Gวิจัยการยกระดับแลว§!"
 AGENCY_UPGRADE_IN_PROGRESS: "§Hกําลังยกระดับ§!"
 AGENCY_UPGRADE_AVAILABLE: "§H§Gคลิก§! เพื่อเริ่มการยกระดับนี้§!"
 AGENCY_UPGRADE_ALREADY_PROGRESS: "§Rมีการยกระดับอื่นกําลังดําเนินการอยู§!"
 AGENCY_CREATED_TITLE: "กอตั้งหนวยขาวกรองแลว!"
