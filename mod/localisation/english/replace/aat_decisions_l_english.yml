 DEN_bop_defend_our_chosen_path_neutrality_desc: "ไมวาจะดีหรือราย เราไดเริ่มเดินบนเสนทางที่ไมฉลาดเลยหากจะเบี่ยงออกในตอนนี้ เราตองเชื่อมั่นในการตัดสินใจที่นําเรามาถึงจุดนี้ และหวังวาเสนทางที่เลือกนี้จะถูกตอง"
 DEN_bop_ban_all_political_uniforms: "£BoP_left_texticon สั่งหามเครื่องแบบทางการเมืองทั้งหมด"
 DEN_bop_ban_all_political_uniforms_desc: "ทั่วทั้งยุโรป เราเห็นเครื่องแบบทางการเมืองเดินแถวราวกับขบวนสวนสนามทางทหาร และทั่วทั้งยุโรป เราเห็นความไมสงบและความไรเสถียรภาพทางการเมืองรุกคืบ ลากทวีปเขาสูความโกลาหล เราตองปองกันไมใหสิ่งนี้ลุกลามมาถึง [ROOT.GetNameDef] กอนจะสายเกินไป"
