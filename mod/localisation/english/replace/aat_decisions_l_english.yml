 FIN_prioritize_light_industry: "ใหความสําคัญกับอุตสาหกรรมเบา"
 FIN_prioritize_light_industry_desc: "แนวทางอุตสาหกรรมของเราผิดพลาดไปหมด และเราตองทบทวนใหมทันที"
