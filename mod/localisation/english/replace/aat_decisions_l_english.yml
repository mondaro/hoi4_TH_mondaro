 NOR_alt_dem_integrate_militias_desc: "$NOR_dem_his_integrate_militias_desc$"
 NOR_prepare_exile: "เตรียมการลี้ภัย"
 NOR_prepare_exile_desc: "ความจริงไมอาจปฏิเสธได ชาติของเราไมอาจตานทานศัตรูไปไดตลอดกาล แตเราสามารถปองกันไดนานพอที่จะนําสิ่งตาง ๆ ออกนอกประเทศใหไดมากที่สุด เพื่อกลับมาสูใหมในวันหนา"
 NOR_focus_on_training: "มุงเนนการฝก"
 NOR_focus_on_training_desc: "เราตองทุมเททุกความพยายามเพื่อเปลี่ยนกําลังสํารองและทหารเกณฑใหเปนทหารและสงเขาสูแนวรบใหเร็วที่สุด เพราะแนวรบอาจอยูไดอีกไมนาน"
 NOR_alt_dem_focus_on_training: "$NOR_focus_on_training$"
 NOR_alt_dem_focus_on_training_desc: "$NOR_focus_on_training_desc$"
 NOR_modernize_armed_forces_decision: "ปรับปรุงกองทัพใหทันสมัย"
 NOR_modernize_armed_forces_decision_desc: "กองทัพ[ROOT.GetAdjective]ถูกละเลยมานานเสียจนกองกําลังของเราดูเหมาะจะอยูในพิพิธภัณฑมากกวาในสนามรบ"
 NOR_move_government_headquarters_decision: "ยายรัฐบาลไปยัง [FROM.GetName]"
 NOR_move_government_headquarters_decision_desc: "หากรัฐบาลของเราตกอยูในเงื้อมมือศัตรู นั่นยอมหมายถึงจุดจบของเรา รวมถึงพระมหากษัตริยและเจาชายของเรา ทางเลือกเดียวคือเคลื่อนยายไปเรื่อย ๆ และหลีกเลี่ยงสิ่งที่หลีกเลี่ยงไมไดใหนานที่สุด"
 NOR_expedite_training: "เรงการฝก"
 NOR_expedite_training_desc: "การฝกทหารใหดีที่สุดเทาที่ทําไดเปนสิ่งสําคัญตอการอยูรอด แตจะสูญเปลาหากพวกเขาฝกเสร็จแลวกลับไมเหลือ [NOR.GetName] ใหปกปอง เราตองเรงรุดหนาใหเร็วที่สุดกอนที่จะถูกผลักออกจากแผนดินของเรา"
 NOR_public_investment_drive: "โครงการลงทุนภาครัฐ"
 NOR_public_investment_drive_desc: "ยังมีงานอีกมากที่ตองทําใน [ROOT.GetName] และดูเหมือนวาจะไมมีวันสําเร็จหากปราศจากการลงทุนโดยตรงของภาครัฐ จงทุมโครงการโครงสรางพื้นฐานและการกอสรางไปทั่วประเทศ"
 NOR_alt_dem_public_investment_drive: "$NOR_public_investment_drive$"
 NOR_alt_dem_public_investment_drive_desc: "$NOR_public_investment_drive_desc$"
 NOR_naval_expanion: "การขยายกองทัพเรือ"
 NOR_naval_expanion_desc: "หากเราจะอยูรอด เราตองปองกันแนวชายฝง และเราจําเปนตองมีเรือเพื่อการนั้น เราตองเปลี่ยนทุกฟยอรดใหเปนอูตอเรือ"
 NOR_prepare_state_fascist: "สรางการสนับสนุนใน [FROM.GetName]"
 NOR_deploy_state_preparation_fascist: "[get_deploy_prep_decision_name_fascist]"
 NOR_invite_fascist_to_invade: "เชิญ [GER.GetNameDef] ใหรุกราน [NOR.GetNonIdeologyName]"
 NOR_decision_take_over_state_title: "ยึดอํานาจใน [FROM.GetName]"
 NOR_decision_industrial_takeover_title: "ยึดอุตสาหกรรมใน [FROM.GetName]"
 NOR_decision_military_takeover_title: "ยึดอํานาจทางทหารใน [FROM.GetName]"
 NOR_prepare_state_communist: "ปลุกชนชั้นกรรมาชีพใน [FROM.GetName]"
 NOR_prepare_state_communist_desc: "ประชาชนแหง [FROM.GetName] ถูกขูดรีดขณะหลับใหลมานานเกินไปแลว จงหวานเมล็ดพันธุแหงการปฏิวัติเพื่อปลุกพวกเขาใหตื่น"
 NOR_communist_propaganda_campaign: "การรณรงคโฆษณาชวนเชื่อคอมมิวนิสต"
 NOR_prepare_state_monarchist: "การชุมนุมของฝายนิยมกษัตริยใน [FROM.GetName]"
 NOR_prepare_state_monarchist_desc: "ประชาชนแหง [FROM.GetName] จําเปนตองไดรับการเตือนถึงการลงประชามติป 1905 และเหตุผลที่พวกเขาเลือกพระมหากษัตริยขึ้นครองราชยอยางทวมทน ไมนานพวกเขาจะเรียกรองใหพระมหากษัตริยทรงเขาแทรกแซงโดยตรง"
 NOR_prop_up_the_economy: "พยุงเศรษฐกิจ"
 NOR_prop_up_the_economy_desc: "เราจะไมสามารถบรรลุเปาหมายทางการเมืองไดหากประชาชนหิวโหย เราตองหยุดการรณรงคเพื่อสถาบันกษัตริยไวกอน เพื่อดูแลราษฎรและความตองการของพวกเขา"
 NOR_make_assurances_to_the_people: "ใหคํามั่นแกประชาชนแหง [NOR.GetNonIdeologyName]"
 NOR_make_assurances_to_the_people_desc: "นี่เปนชวงเวลาที่นาหวาดหวั่นใน [NOR.GetName] อยางแนนอน เราจึงตองใหความมั่นใจผานสื่อวาเราจะผานพนไปได และเมื่อผานไปแลว พระมหากษัตริยผูทรงพระกรุณาของเราจะทรงนําการตอสูเพื่อความอยูรอดของเรา"
 NOR_promote_the_armed_defense_of_the_country: "สงเสริมการปองกันดวยอาวุธของ [NOR.GetName]"
 NOR_promote_the_armed_defense_of_the_country_desc: "ประชาชนแหง [NOR.GetName] ตองไดรับการเตือนวาจะเกิดอะไรขึ้นหากพวกเขาไมปกปองประเทศ ทุกคนตองทําหนาที่ของตนในความขัดแยงที่กําลังจะมาถึง"
 NOR_exile_decisions_category: "การลี้ภัยของรัฐบาล[ROOT.GetName]"
 NOR_exile_decisions_category_desc: "เราตกอยูในสถานการณเลวรายที่สุด หลังจากสูญเสียแผนดินใหแกศัตรู เราไมมีทางเลือกอื่นนอกจากใชชีวิตลี้ภัย อยางนอยเราก็ยังรูสึกขอบคุณเจาบานผูมีนํ้าใจ และหวังวาวันหนึ่งดวยความชวยเหลือของพวกเขา เราจะไดกลับสู [NOR.GetNonIdeologyName] อันเปนที่รักอีกครั้ง"
 NOR_request_reinstatement: "ขอให [FROM.GetNameDef] คืนอํานาจใหเรา"
 NOR_request_reinstatement_desc: "ศัตรูของเรากําลังเสียพื้นที่ใน [NOR.GetName] และเราคิดวาถึงเวลาแลวที่รัฐบาลของเราจะไดกลับคืนสูที่อันชอบธรรมอีกครั้ง"
 NOR_lobby_for_parliamentary_support: "วิ่งเตนขอการสนับสนุนในรัฐบาล[FROM.GetAdjective]"
 NOR_lobby_for_parliamentary_support_desc: "เจาบานของเรามีนํ้าใจอยางมากมาโดยตลอด แตบางทีพวกเขาอาจตองไดรับการเตือนถึงสิ่งที่ประชาชนของเรากําลังเผชิญ เพื่อที่พวกเขาจะไมลืมวาเรามีอะไรเปนเดิมพัน"
 NOR_bring_soldiers_from_norway: "นําทหารจาก [NOR.GetNonIdeologyName] มา"
 NOR_bring_soldiers_from_norway_desc: "หลายคนที่สูรบเพื่อปกปองประเทศยังคงติดอยูในมาตุภูมิ เราสามารถพยายามนําพวกเขาบางสวนมา รวมถึงคนอื่น ๆ ที่อาจยังไมเคยสูรบแตยังตองการยึดประเทศคืนจากที่ที่เราอยู"
 NOR_weapons_for_the_resistance: "จัดหาและแจกจายอาวุธ"
 NOR_weapons_for_the_resistance_desc: "เราสามารถใชกองเรือพาณิชยอันใหญโตของเราจัดหาอาวุธ ทั้งเพื่อความพยายามของเราที่นี่และเพื่อนักรบฝายตอตานในมาตุภูมิ อาวุธที่นั่นจะบั่นทอนการกุมอํานาจของศัตรูเหนือ [NOR.GetNonIdeologyName] และอาวุธที่นี่จะปดฉากความเปนทรราชของพวกเขา"
 NOR_unity_parade: "ขบวนพาเหรดแหงเอกภาพใน [FROM.Capital.GetCapitalVictoryPointName]"
 NOR_unity_parade_desc: "จงใหถนนใน [FROM.Capital.GetCapitalVictoryPointName] เต็มไปดวยเสียงของเรา เพื่อเตือนผูคนในมหานครแหงนั้นวาการตอสูของเราและของพวกเขาคือสิ่งเดียวกัน"
 NOR_joint_training_exercise: "การฝกซอมรวมกับ [FROM.GetNameDef]"
 NOR_joint_training_exercise_desc: "หากเราหวังจะไดชัยชนะ กองกําลังของเราตองเปนหนึ่งเดียวกับกองกําลังของ [FROM.GetNameDef] ซึ่งทําไดดวยการฝกและความรวมมืออยางลึกซึ้งกับพันธมิตรเทานั้น"
 NOR_expand_industrial_capacity: "ลงทุนในกําลังการผลิตทางอุตสาหกรรม"
 NOR_expand_industrial_capacity_desc: "เราอาจถูกเนรเทศ แตไมไดหมายความวาเราไรทางสู เรามีกองเรือพาณิชยที่ใหญที่สุดแหงหนึ่งของโลกอยูในมือ และเราสามารถใชมันจัดหากําลังการผลิตทางอุตสาหกรรมที่จําเปนเพื่อหลอเลี้ยงความพยายามในการยึดมาตุภูมิคืน"
 NOR_foment_resistance_in_state: "ปลุกปนการตอตานใน [FROM.GetName]"
 NOR_foment_resistance_in_state_desc: "ประชาชนแหง [FROM.GetName] มีจิตวิญญาณแหงการตอตานอยูในตัว และพวกเขากําลังตอบโตศัตรูของเรา! พวกเขาตองการเพียงแรงผลักอีกนิดเพื่อใหมันชี้ขาดได"
 NOR_support_rebellion: "สนับสนุนการกอกบฏใน [FROM.GetName]"
 NOR_support_rebellion_desc: "ความพยายามสรางการตอตานใน [FROM.GetName] ของเราไดผลแลว ประชาชนที่นั่นพรอมจะลงมือตอตานผูกดขี่ ใหพวกเขาเริ่มการตอสู และทันทีที่พวกเขาเริ่ม เราจะพรอมกลับบานไปสูรบ"


