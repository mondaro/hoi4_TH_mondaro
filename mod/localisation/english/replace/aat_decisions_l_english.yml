 FIN_crack_down_on_the_military: "ปราบปรามฝายทหาร"
 FIN_crack_down_on_the_military_desc: "ฝายทหารมีพฤติกรรมนาสงสัยในระยะหลัง และตองไดรับการจัดการกอนที่จะกลายเปนปญหา"
 FIN_crack_down_on_the_military_character_tt: "นายพลและที่ปรึกษาทางทหารบางคนจะถูกจําคุก และฝายศัตรูจะไมสามารถใชงานไดในสงครามกลางเมือง:"
 FIN_crack_down_on_the_military_divs_tt: "กองพล§Yทหารราบ§!ฟาสซิสตบางสวนจะถูกยุบ"
 effects_applied_to_the_enemy_side_in_cw_tt: "§Yผลที่เกิดกับฝายศัตรูในสงครามกลางเมือง:§!"
 FIN_prepare_construction_workers_actions: "เตรียมปฏิบัติการของคนงานกอสราง"
 FIN_prepare_construction_workers_actions_desc: "คนงานกอสรางสามารถทําใหเศรษฐกิจเปนอัมพาตไดภายในวันเดียวดวยความรวมมือกัน และถึงเวลาแลวที่เราจะใชคนเหลานี้ใหเต็มศักยภาพ"
 FIN_prepare_construction_workers_actions_dec_tt: "ฝายของเราจะไดรับ §G+5%§! ของดินแดนและหนวยทหารทั้งหมด \nกองพล§Yทหารอาสาสมัคร§!คอมมิวนิสตเพิ่มเติมจะปรากฏขึ้น"
 FIN_prepare_construction_workers_actions_enemy_side_dec_tt: "โรงงานพลเรือนและโครงสรางพื้นฐานจํานวนหนึ่งจะถูกกอวินาศกรรมและเสียหาย"
 FIN_align_the_trade_unions: "ดึงสหภาพแรงงานมาเปนพวก"
 FIN_align_the_trade_unions_desc: "การสนับสนุนของสหภาพแรงงานอาจจําเปนอยางยิ่งตอรัฐบาลของเรา เราตองยอมผอนปรนเพื่อใหพวกเขาอยูฝายเรา"
 FIN_align_the_trade_unions_enemy_side_dec_tt: "โรงงานทหารและอูตอเรือจํานวนหนึ่งจะถูกกอวินาศกรรมและเสียหาย"
 FIN_purchase_soviet_equipment: "ซื้อยุทโธปกรณโซเวียต"
 FIN_purchase_soviet_equipment_desc: "โซเวียตมียุทโธปกรณมากมายวางทิ้งไว ซึ่งเราสามารถนําไปใชในเรื่องที่ดีกวาและสําคัญกวาได"
 FIN_infiltrate_soviet_commandos: "สงหนวยคอมมานโดโซเวียตแทรกซึมเขาฟนแลนด"
 FIN_infiltrate_soviet_commandos_desc: "หนวยคอมมานโดโซเวียตเปนหนึ่งในทหารที่เกงกาจที่สุด และอาจเปนประโยชนตอการปฏิวัติของเรา"
 FIN_infiltrate_soviet_commandos_dec_tt: "§G3 กองพล§! ซึ่งประกอบดวยกองพัน§Yทหารราบ§! 6 กองพัน §Yกองพลนอยปนใหญ§! 2 กองพลนอย และ§Yกองพันสนับสนุน§! 4 กองพัน จะปรากฏขึ้นที่เมืองหลวงของเรา"
 FIN_call_to_union_activism: "เรียกรองการเคลื่อนไหวของสหภาพแรงงาน"
 FIN_call_to_union_activism_desc: "สหภาพแรงงานมีอํานาจกดดันรัฐบาลใหใชนโยบายที่เปนประโยชนตอชนชั้นแรงงานมากขึ้น บัดนี้เราตองใหพวกเขาลงมือ"
 FIN_push_for_cabinet_participation: "ผลักดันการเขารวมคณะรัฐมนตรี"
 FIN_push_for_cabinet_participation_desc: "พวกสังคมนิยมถูกกีดกันออกจากคณะรัฐมนตรีมาตั้งแตป 1929 ถึงเวลาแลวที่เราจะกดดัน [ROOT.GetLeader] ใหเคารพหลักการระบบรัฐสภาเสียที"
 FIN_gather_funds_for_womens_shelters: "ระดมทุนเพื่อบานพักพิงสตรี"
 FIN_gather_funds_for_womens_shelters_desc: "$FIN_miina_sillanpaa$ ทํางานอยางหนักตลอดทศวรรษที่ผานมา รณรงคเพื่อสิทธิของสตรีวัยทํางานและสตรีโสด และกอตั้งบานพักพิงสตรี เธอจะสามารถสรางผลงานที่ดียิ่งขึ้นหากรัฐบาลสนับสนุนกิจกรรมของเธอ"

 FIN_appoint_yrjo_leino_as_president: "แตงตั้งยือรเยอ เลโนเปนประธานาธิบดี"
 FIN_appoint_yrjo_leino_as_president_desc: "ยือรเยอ เลโนคือผูที่สามารถนําประชาชนของเราไปสูความรุงเรืองไดอยางแทจริง และควรพิจารณาแตงตั้งเขาเปนประธานาธิบดีโดยเร็วที่สุด"
 FIN_request_extradition_of_kullervo_manner: "ขอสงตัวคุลเลรโว มันเนรกลับ"
