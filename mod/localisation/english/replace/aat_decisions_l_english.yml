 FIN_pressure_government_cd_tt: "\nเราสามารถกดดันรัฐบาลของประเทศหนึ่งไดเพียงครั้งเดียวทุก §Y[?FIN_pressure_government_cd]§! วัน"
 FIN_coup_preparations: "การเตรียมการรัฐประหาร"
 FIN_coup_preparations_desc: "รัฐประหารจะไมสําเร็จหากเราไมทําทุกวิถีทางเพื่อใหมันสําเร็จเสียกอน การเตรียมพรอมคือสวนผสมสําคัญของความสําเร็จ"
 FIN_appeal_to_the_middle_class: "ดึงดูดชนชั้นกลาง"
 FIN_appeal_to_the_middle_class_desc: "การสนับสนุนหลักขององคกรฝายขวาในฟนแลนดมาจากชนชั้นกลาง เราตองดึงดูดชาวนาผูมั่งคั่ง ชนชั้นกระฎมพีผูมีการศึกษา ขาราชการ นักบวช และนักศึกษามหาวิทยาลัยใหเขารวมขบวนการของเรา และเผยแพรหลักการและอุดมการณของเราในหมูประชาชน"
 FIN_appeal_to_the_middle_class_dec_tt: "ฝายของเราจะไดรับ §G+10%§! ของดินแดนและหนวยทหารทั้งหมด"
 FIN_secure_the_military: "ดึงฝายทหารมาเปนพวก"
 FIN_secure_the_military_desc: "ฝายทหารเปนพันธมิตรที่มีประโยชนเสมอสําหรับผูกอรัฐประหารหนาใหม ดังที่ประวัติศาสตรไดพิสูจนแลว จึงจําเปนอยางยิ่งที่ตองไดรับการสนับสนุนจากพวกเขากอนที่เราจะลงมือกอรัฐประหาร"
 FIN_secure_the_military_dec_tt: "ฝายของเราจะไดรับ §G+10%§! ของดินแดนและหนวยทหารทั้งหมด และจะไดผูนําทางทหารทั้งหมดไว"
 FIN_purchase_german_equipment: "ซื้อยุทโธปกรณเยอรมัน"
 FIN_purchase_german_equipment_desc: "เยอรมนีมียุทโธปกรณจํานวนมากที่ถูกทิ้งไวเปลา ๆ ในคลัง เราควรขอใหพวกเขาแบงใหเราบาง เพราะเราอาจเปนมิตรที่มีประโยชนตอพวกเขาได"
 FIN_the_last_kinship_war: "สงครามเครือญาติครั้งสุดทาย"
 FIN_the_last_kinship_war_desc: "เมื่อไดฟนจิตวิญญาณแหงไฮโมโซดัตขึ้นมาแลว บัดนี้เราสามารถเริ่มเตรียมการปลดปลอยพี่นองรวมเชื้อสายจากเงื้อมมือการกดขี่ของตางชาติได"
 FIN_stir_anti_soviet_sentiment_in_karelia: "ปลุกกระแสตอตานโซเวียตในคาเรเลีย"
 FIN_stir_anti_soviet_sentiment_in_karelia_desc: "มีคนจํานวนมากในคาเรเลียที่ไมเห็นดวยกับนโยบายของรัฐบาลโซเวียต และเราสามารถใชสิ่งนั้นกอความวุนวายในภูมิภาคได"
 FIN_instigate_a_new_karelian_uprising: "ยุยงใหเกิดการลุกฮือครั้งใหมในคาเรเลีย"
 FIN_instigate_a_new_karelian_uprising_desc: "ดวยการฟนจิตวิญญาณแหงไฮโมโซดัต เราควรพยายามกอใหเกิดการลุกฮือครั้งใหมในคาเรเลีย และปลอยใหชาวคาเรเลียแสวงหาเอกราชที่พวกเขาปรารถนา"
 FIN_finno_soviet_kinship_war: "สงครามเครือญาติฟนโน-[ROOT.GetAdjective]"
 FIN_finno_soviet_kinship_war_desc: "ในชวงสงครามกลางเมืองรัสเซีย ชาวฟนแลนดไดทําสงครามเครือญาติ ซึ่งพวกเขาบุกรุกดินแดนเพื่อแยงชิงแผนดินไปจากเรา และบัดนี้พวกเขาเริ่มทําแบบเดิมอีกครั้งแลว"
 FIN_crush_the_karelian_insurrection: "บดขยี้การกอการกําเริบในคาเรเลีย"
 FIN_crush_the_karelian_insurrection_desc: "บัดนี้เราไดรวบรวมอาวุธและทหารมากพอที่จะบดขยี้การกอการกําเริบของกลุมนิยมภูมิภาคในคาเรเลียแลว เริ่มปฏิบัติการได!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp: "£infantry_equipment_text_icon  §Y1500§! £command_power  §Y30§! £pol_power  §Y70§!"
