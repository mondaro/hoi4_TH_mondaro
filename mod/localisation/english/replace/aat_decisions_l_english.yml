 FIN_set_up_weapon_caches_in_state_desc: "ในฐานะสวนหนึ่งของปฏิบัติการทางทหารลับ อาวุธและยุทโธปกรณของกองทัพ[ROOT.GetAdjective]จํานวนมากจะถูกซอนไวในคลังลับที่กระจายอยูทั่ว [FROM.GetName] เพื่อใหกลุมตอตาน[ROOT.GetAdjective]สามารถสูรบกับผูรุกรานตอไปได"
