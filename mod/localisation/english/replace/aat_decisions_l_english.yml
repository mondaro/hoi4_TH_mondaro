 FIN_surrender_to_the_soviet_union: "ยอมจํานนตอ [SOV.GetNameDef]"
 FIN_surrender_to_the_soviet_union_desc: "เปนที่ชัดเจนวาแมทหารของเราจะพยายามอยางกลาหาญที่สุด เราก็ไมอาจตานทานชาว[SOV.GetAdjective]ไดตลอดไป ถึงเวลาแลวที่เราจะขอสันติภาพแบบจํากัดกับศัตรู"
 FIN_reached_out_to_soviets_to_surrender_flag: "ไดพยายามเริ่มการเจรจาสันติภาพกับ [SOV.GetNameDef] แลว"
 FIN_demand_peace_negotiations: "เรียกรองการเจรจาสันติภาพกับ [SOV.GetName]"
 FIN_demand_peace_negotiations_desc: "เมื่อเรากลับมาไดเปรียบเหนือชาว[SOV.GetAdjective]ในที่สุด เราก็สามารถพยายามบังคับใหเกิดสันติภาพได"
 FIN_can_demand_territory_if_occupying_tt: "\n\nเราจะสามารถเรียกรองการยกดินแดนจาก [SOV.GetNameDef] ได หากเราควบคุมรัฐ §Y[213.GetName]§!, §Y[215.GetName]§! หรือ §Y[216.GetName]§!"
 FIN_can_demand_peace_negotiations_flag: "ทําภารกิจ §Y$FIN_hold_leningrad_mission$§! สําเร็จแลว (ควบคุม §Y[195.GetName]§! อยางนอย §Y30 วัน§!) และกําลังควบคุม §Y[195.GetName]§! อยู"
 FIN_winter_war_ongoing_flag: "[ROOT.GetFlag]§Y[ROOT.GetNameDef]§! กําลังทําสงครามฤดูหนาวกับ §Y[SOV.GetNameDef]§! ในฐานะฝายปองกัน"

 FIN_hold_leningrad_mission: "ยึดรักษา [195.GetName]"
 FIN_hold_leningrad_mission_desc: "กองกําลังของเราอาจยึด [195.GetName] ไดแลว แตเพื่อบังคับใชขอเรียกรองของเรา เราตองยึดรักษาภูมิภาคนี้ไวจนกวากองกําลัง[SOV.GetAdjective]จะเสียขวัญอยางสิ้นเชิง"
 FIN_retake_leningrad_mission: "ยึด [195.GetName] คืน"
 FIN_retake_leningrad_mission_desc: "กองกําลัง[FIN.GetAdjective]ยึด [195.GetName] ไปจากเราแลว และหากเราไมสามารถยึดคืนไดโดยเร็ว พวกเขาจะสามารถบังคับใชขอเรียกรองใด ๆ ก็ได"
 FIN_finland_can_send_peace_demands_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! สามารถเรียกรองการเจรจาสันติภาพ รวมถึงการยกดินแดน[ROOT.GetAdjective]ได หากควบคุม §Y[213.GetName]§!, §Y[215.GetName]§! หรือ §Y[216.GetName]§!"


 FIN_finnish_resistance_category: "ขบวนการตอตาน[FIN.GetAdjective]"
 FIN_finnish_resistance_category_desc: "ในฐานะสวนหนึ่งของปฏิบัติการทางทหารลับ อาวุธและยุทโธปกรณของกองทัพ[ROOT.GetAdjective]จํานวนมากถูกซอนไวในคลังลับที่กระจายอยูทั่วฟนแลนด โดยมุงชวยใหกลุมตอตาน[ROOT.GetAdjective]สูรบกับทหารของเราตอไป"
 FIN_search_for_weapon_caches_in_state: "คนหาคลังอาวุธลับใน [FROM.GetName]"
 FIN_search_for_weapon_caches_in_state_desc: "ทหารของเราจะดําเนินการสืบสวนกรณีคลังอาวุธลับของฟนแลนดใน [FROM.GetName] อยางละเอียด เพื่อคนหาและยึดคลังอาวุธทั้งหมดในรัฐนี้"
 FIN_search_for_weapon_caches_decision_cost_cp: "£command_power  §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_search_for_weapon_caches_decision_cost_cp_blocked: "£command_power  §R[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_search_for_weapon_caches_decision_cost_cp_tooltip: "ตองใช £command_power  §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§! ในการตัดสินใจนี้"
 FIN_motion_of_no_confidence_against_leader: "ญัตติไมไววางใจ [ROOT.GetLeader]"
 FIN_motion_of_no_confidence_against_leader_desc: "[ROOT.GetLeader] ยังทําไมมากพอที่จะแกปญหาที่ประเทศของเรากําลังเผชิญ และเปนที่ชัดเจนวาขอเท็จจริงนี้จะไมเปลี่ยนแปลง ถึงเวลาแลวที่จะลงมติไมไววางใจเพื่อขับไลผูนําที่ไรความสามารถคนนี้"
 FIN_resignation_of_kallio: "การลาออกของ $FIN_kyosti_kallio$"
 FIN_resignation_of_kallio_desc: "$FIN_kyosti_kallio$ ไมใชรัฐบุรุษที่ยอดเยี่ยมนัก และความลมเหลวของเขาในระยะหลังทําใหเห็นชัดวาเขาไมสามารถนําประเทศไปในทิศทางที่ถูกตองได บัดนี้ เมื่อความตึงเครียดของโลกพุงสูงและสุขภาพของเขาไมเอื้อใหรับมือกับปญหารายแรงที่ผุดขึ้นไมหยุด ทางที่ดีที่สุดคือใหเขาลาออก"
 FIN_form_a_military_government: "จัดตั้งรัฐบาลทหาร"
 FIN_form_a_military_government_desc: "รัฐบาลพลเรือนชุดปจจุบันแสดงความออนแอเมื่อเผชิญกับความเปนปฏิปกษและความยากลําบาก $FIN_carl_mannerheim$ เคยรับใชประเทศมาอยางดี และจะทําเชนนั้นอีกอยางแนนอน เขาตองจัดตั้งรัฐบาลทหารเพื่อตานทานศัตรูทุกราย"
 FIN_resignation_of_mannerheim: "การลาออกของ $FIN_carl_mannerheim$"
 FIN_resignation_of_mannerheim_desc: "$FIN_carl_mannerheim$ ไมมีความจําเปนหรือความปรารถนาที่จะปกครองประเทศไปอยางไมมีกําหนด จึงประสงคจะประกาศลาออกจากตําแหนงประธานาธิบดี โดยระบุวาไมมีความจําเปนตองมีเขาอีกตอไป เนื่องจากเขาไดทําหนาที่ตามที่สัญญาไวเมื่อเขารับตําแหนงครบถวนแลว"
 FIN_organize_the_opposition: "จัดระเบียบฝายคาน"
 FIN_organize_the_opposition_desc: "รัฐบาลลมเหลวในการทําตามสัญญาและตองไดรับการจัดการอยางเหมาะสม ถึงเวลาแลวที่จะรวมฝายคานใหเปนหนึ่งและจัดกิจกรรมเพื่อรวบรวมการสนับสนุนและทําลายความนาเชื่อถือของ [ROOT.GetLeader]"
 FIN_appeal_to_the_finnish_spirit: "ปลุกจิตวิญญาณฟนแลนด"
 FIN_appeal_to_the_finnish_spirit_desc: "เราตองปลุกความมุงมั่น ความยืดหยุน และความทรหดอันเปนเลิศของชาวฟนแลนดเมื่อเผชิญความยากลําบาก ประชาชนฟนแลนดตองรวมมือกันเพื่อเอาชนะทุกอุปสรรค ซีซูของเราทําใหเราแข็งแกรง!"
 FIN_entice_the_masses: "ดึงดูดมวลชน"
 FIN_entice_the_masses_desc: "มวลชนถูกโนมนาวไดงาย ดวยการใหสัญญาวาจะแกปญหาเล็ก ๆ ที่ใกลตัว รัฐบาลของเราจะเปนที่นาดึงดูดและเปนที่ชื่นชอบของชาวฟนแลนดทั่วไปไดงายขึ้น"
 FIN_organize_the_opposition_cost_increase_tt: "\nคาใชจายของการตัดสินใจ §Y$FIN_organize_the_opposition$§! จะถูก§Rคูณ§!ดวย §Y[?FIN_bop_decision_cost_multiplier]§!\n"
 FIN_appeal_to_the_finnish_spirit_cost_increase_tt: "\nคาใชจายของการตัดสินใจ §Y$FIN_appeal_to_the_finnish_spirit$§! จะถูก§Rคูณ§!ดวย §Y[?FIN_bop_decision_cost_multiplier]§!\n"
 FIN_entice_the_masses_cost_increase_tt: "\nคาใชจายของการตัดสินใจ §Y$FIN_entice_the_masses$§! จะถูก§Rคูณ§!ดวย §Y[?FIN_bop_decision_cost_multiplier]§!\n"

 FIN_the_path_to_socialism: "เสนทางสูสังคมนิยม"
 FIN_the_path_to_socialism_desc: "ในอีกไมกี่ป ดวยความพยายามรวมกันของประชาชน เราจะไปถึงสังคมนิยมที่แทจริง แมหนทางไปสูจุดนั้นอาจเต็มไปดวยขวากหนามและความยากลําบาก แตเราตองกาวเดินตอไปไมวาจะตองแลกดวยอะไร"
 FIN_gather_popular_support: "รวบรวมการสนับสนุนจากประชาชน"
 FIN_gather_popular_support_desc: "ประชาชนมีความสําคัญยิ่งตอการปฏิวัติหรือรัฐบาลใด ๆ และเราควรพยายามอยางเต็มที่เพื่อรวบรวมการสนับสนุนจากพวกเขาใหไดมากที่สุด"
 FIN_gather_popular_support_dec_tt: "ฝายของเราจะไดรับ §G+10%§! ของดินแดนและหนวยทหารทั้งหมด \nกองพล§Yทหารอาสาสมัคร§!คอมมิวนิสตเพิ่มเติมจะปรากฏขึ้น"
