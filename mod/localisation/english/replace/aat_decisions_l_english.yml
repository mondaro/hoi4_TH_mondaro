l_english:

  #### ICELAND ####
 ICE_drilling_for_oil_off_shore: "ขุดเจาะนํ้ามันและกาซนอกชายฝง"
 ICE_drilling_for_oil_off_shore_repeat_tt: "สามารถใชการตัดสินใจนี้ไดอีกครั้งหลังจาก §Y180§! วัน"
 no_more_oil_tt: "§Rไมสามารถคนพบนํ้ามันไดอีกแลว§!"
 no_more_oil_flag: "แหลงนํ้ามันเหือดแหงแลว"

 ICE_improve_the_viking_spirit: "สักการะบรรพบุรุษของเรา"
 ICE_already_improving_the_viking_spirit_flag: "กําลังเสริมสรางจิตวิญญาณไวกิงอยูแลว"

 ICE_a_new_yggdrasill: "อิกดราซิลยุคใหม"
 ICE_a_new_yggdrasill_desc: "เมื่อประชาชนไดรูถึงบรรพบุรุษอันยิ่งใหญของตนแลว เราควรมุงกอสรางโครงการขนาดใหญและพัฒนาเกาะไอซแลนด ใหสมกับมิดการดและอิกดราซิลในตํานาน!"
 ICE_has_best_spirit_idea: "เราไดสักการะบรรพบุรุษของเราอยางสมบูรณแลว"

 ICE_the_wisdom_of_odin: "ปญญาแหงโอดิน"
 ICE_the_wisdom_of_odin_desc: "โอดินเปนเทพที่เกี่ยวของกับทุกสิ่ง ตั้งแตปญญา การรักษา ความตาย ราชบัลลังก ตะแลงแกง ความรู สงคราม การตอสู ชัยชนะ เวทมนตร กวีนิพนธ และความคลุมคลั่ง ไปจนถึงอักษรรูน พระองคไดรับปญญาอันยิ่งใหญเมื่อยอมสละดวงตาขางหนึ่งเพื่อดื่มนํ้าจากบอมีมีร ซึ่งมอบความรูอันไรขอบเขตทั้งในปจจุบัน อนาคต และอดีต เราควรพยายามเปนดั่งจิตวิญญาณของพระองค และสืบทอดมรดกของพระองคสูอนาคต!"

 ICE_the_might_of_thor: "พลังแหงธอร"
 ICE_the_might_of_thor_desc: "ธอรคือเทพแหงสายฟา พละกําลัง และผูปกปองมวลมนุษย พระองคทรงใชคอนมยอลเนียรฟาดเมฆใหเกิดพายุ และกองทัพของเราจะฟาดสายฟาและความหวาดกลัวแบบเดียวกันนั้นใสศัตรู!"

 ICE_the_guidance_of_aegir_and_ran: "การนําทางของเอกีรและราน"
 ICE_the_guidance_of_aegir_and_ran_desc: "ภายใตการนําทางของรานและเอกีร ผูเปนบุคลาธิษฐานแหงทะเลและสามียักษโยตุนของนาง เรือของเราจะครองความเปนเจาเหนือทะเลทางเหนือ"

 ICE_the_ferocity_of_the_fenrir: "ความดุรายของเฟนรีร"
 ICE_the_ferocity_of_the_fenrir_desc: "เฟนรีรเปนบุตรของโลกิกับนางยักษอังกรบอดา เชนเดียวกับเฮลและอสรพิษโลก ในวันแร็กนาร็อก มันถูกลิขิตใหสังหารโอดิน แตกลับลมเหลว แมจะมีพละกําลังและความดุรายมหาศาล ทหารของเราตองเปนดั่งแกนแทของมันในสนามรบ เพื่อเอาชนะศัตรูทั้งในสนามรบและในจิตใจ"

 ICE_the_fertility_of_freya: "ความอุดมสมบูรณแหงเฟรยา"
 ICE_the_fertility_of_freya_desc: "เฟรยาเปนเทพีแหงความรัก ความงาม และความอุดมสมบูรณ รวมถึงสิ่งอื่น ๆ อีกมาก เราควรเอยนามของนางเพื่อใหประชาชนของเรามีลูกหลานที่วันหนึ่งจะเติบโตเปนนักรบผูยิ่งใหญ"

 ICE_a_monument_to_leif: "สรางอนุสาวรียแดเลฟูร เอยริกสซอน"
 ICE_a_monument_to_leif_desc: "แมชาวใตจะเผยแพรความเชื่อผิด ๆ วาคริสโตเฟอร โคลัมบัสเปนชาวยุโรปคนแรกที่คนพบทวีปอเมริกา แตบรรพบุรุษผูยิ่งใหญของเรา เลฟูร เอยริกสซอน คือผูที่คนพบเปนคนแรกอยางไมตองสงสัย เพื่อเปนเกียรติแกเขา เราควรสรางอนุสาวรียอุทิศแดเขาในวินแลนด ขณะที่เรายึดครองดินแดนเหลานั้นเปนของเรา"

 ICE_infiltrate_the_british_isles_category: "แทรกซึมหมูเกาะบริติช"
 ICE_infiltrate_the_british_isles_category_desc: "การปฏิวัติของกรรมกรตองแผขยายออกไป จุดเริ่มตนที่สมบูรณแบบคือกรรมกรผูถูกกดขี่ในหมูเกาะบริติช กระแสตอตานจักรวรรดินิยมและทุนนิยมสามารถและควรถูกนํามาใชใหเกิดประโยชนสูงสุด"

 ICE_incite_communist_uprising_scotland: "ปลุกระดมการลุกฮือในสกอตแลนด"
 ICE_incite_communist_uprising_scotland_desc: "ดวยการผลักดันอีกเล็กนอย เรานาจะทําใหกรรมกรชาวสกอตลุกฮือขึ้นใน [121.GetCapitalVictoryPointName] และประกาศเอกราชจากรัฐบาลใน [121.owner.capital.GetCapitalVictoryPointName] ได" 
 ICE_uprising_scotland_tt: "§Y[121.owner.GetName]§!: การสนับสนุน [121.owner.GetCommunistParty] มากกวา [?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_scotland_tt: "§Y[SCO.GetName]§! เริ่มสงครามประกาศเอกราชตอ §Y[121.owner.GetName]§! ใน [121.GetName]"

 ICE_incite_communist_uprising_wales: "ปลุกระดมการลุกฮือในเวลส"
 ICE_incite_communist_uprising_wales_desc: "ดวยการผลักดันอีกเล็กนอย เรานาจะทําใหกรรมกรชาวเวลสลุกฮือขึ้นใน [122.GetCapitalVictoryPointName] และประกาศเอกราชจากรัฐบาลใน [122.owner.capital.GetCapitalVictoryPointName] ได" 
 ICE_uprising_wales_tt: "§Y[122.owner.GetName]§!: การสนับสนุน [122.owner.GetCommunistParty] มากกวา [?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_wales_tt: "§Y[WLS.GetName]§! เริ่มสงครามประกาศเอกราชตอ §Y[122.owner.GetName]§! ใน [122.GetName]"

 ICE_incite_communist_uprising_ni: "ปลุกระดมการลุกฮือในไอรแลนดเหนือ"
 ICE_incite_communist_uprising_ni_desc: "ดวยการผลักดันอีกเล็กนอย เรานาจะทําใหกรรมกรในไอรแลนดเหนือลุกฮือขึ้นใน [119.GetCapitalVictoryPointName] และประกาศเอกราชจากรัฐบาลใน [119.owner.capital.GetCapitalVictoryPointName] ได" 
 ICE_uprising_ni_tt: "§Y[119.owner.GetName]§!: การสนับสนุน [119.owner.GetCommunistParty] มากกวา [?ICE.communism_support_needed|%Y0]"
 ICE_incite_communist_uprising_ni_tt: "§Y[WLS.GetName]§! เริ่มสงครามประกาศเอกราชตอ §Y[119.owner.GetName]§! ใน [119.GetName]"
   
  # NORWAY
 NOR_democratic_preparation_decisions_category: "สรางชาติของเรา"
 NOR_democratic_preparation_decisions_category_desc: "ชาติที่ยังเยาวของเรายังตองไลตามอีกมากหากตองการแขงขันกับนานาประเทศ การถูกละเลยมานานหลายทศวรรษและหลายปในภาวะเศรษฐกิจตกตํ่าครั้งใหญ ทําใหอุตสาหกรรมของเราอยูในสภาพยํ่าแย ซึ่งตองอาศัยความพยายามรวมกันอยางจริงจังเพื่อฟนฟู\n\nนาเสียดายที่สิ่งนี้จะแลกมาดวยความพรอมทางทหารและขีดความสามารถในการปองกันประเทศ แตเราเชื่อมั่นวานโยบายความเปนกลางโดยสมบูรณและปราศจากอาวุธจะแสดงถึงเจตนาดีของเรา และทําใหศัตรูใด ๆ มองขามดินแดนของเราไป \n\n\nการพัฒนาโดยรวมของ[NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_historical_deploy_prep_decisions_category: "เตรียมรับมือพายุ"
 NOR_historical_deploy_prep_decisions_category_desc: "แมเราจะพยายามอยางดีที่สุด สงครามก็มาถึงชายฝงของเราแลว ที่ผานมาเราทุมเทพลังไปกับการพัฒนาอุตสาหกรรม เศรษฐกิจ และโครงสรางพื้นฐานของแผนดิน แตบัดนี้จําเปนอยางยิ่งที่เราตองหาทางใชสิ่งเหลานี้เพื่อปองกัน [NOR.GetNameDef]\n\n\nความพรอมที่เปนไปไดของ[NOR.GetName]: [?NOR.NOR_country_preparedness]/30" 
 NOR_allied_democratic_preparation_decisions_category: "เตรียมนอรเวยสูสงคราม"
 NOR_allied_democratic_preparation_decisions_category_desc: "รัฐบาลนี้มั่นใจวาศัตรูจะโจมตีไดทุกเมื่อ เราตองแนวแนในการติดอาวุธใหประชาชนของ [NOR.GetName] เพื่อปองกันการรุกราน แมจะหมายถึงการโจมตีกอนก็ตาม ดังนั้นจงรวมพลังทั้งประเทศ และยึดอํานาจที่เราตองการเพื่อเอาชนะศัตรูอยางเด็ดขาด\n\nความพรอมของชาติ: [?NOR.NOR_country_preparedness]/30" 
 NOR_allied_democratic_deploy_prep_decisions_category: "นําการเตรียมพรอมสงครามมาใช"
 NOR_allied_democratic_deploy_prep_decisions_category_desc: "สงครามมาถึงเราในที่สุดดังที่คาดไว แตไมมีอะไรตองกลัว หลายปที่ผานมาเราทุมเททุกความพยายามเพื่อเตรียม [ROOT.GetName] ใหพรอมรับทุกสิ่งที่ศัตรูจะโหมใส มาแสดงใหพวกเขาเห็นวาเราแข็งแกรงเพียงใด\n\nความพรอมของชาติ: [?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_alt_dem: "เตรียม [FROM.GetName] สูสงคราม"
 NOR_prepare_state_alt_dem_desc: "เราไมพรอมเลยสําหรับสิ่งที่กําลังจะมาถึง เราตองดําเนินมาตรการที่เหมาะสม เพื่อวาเมื่อสงครามปะทุ [FROM.GetName] จะสามารถมีสวนรวมในความพยายามทางสงครามได บางคนอาจไมเขาใจ แตเราไดตัดสินใจแลว และไมมีทางยอนกลับ"
 NOR_alt_dem_naval_expansion: "การขยายกองทัพเรือ"
 NOR_alt_dem_naval_expansion_desc: "การพัฒนากองทัพเรือเปนสิ่งสําคัญยิ่ง ไมเพียงเพราะมันหมายถึงการปองกันแนวชายฝงอันยาวเหยียดของเราจากผูรุกราน แตยังเพราะมันสามารถใชเปนฐานยิงเพื่อนําการตอสูไปถึงแผนดินของพวกเขาได"
 NOR_alt_dem_military_industry_expansion: "ขยายอุตสาหกรรมทหาร"
 NOR_alt_dem_military_industry_expansion_desc: "เราไมอาจพึ่งพาประเทศอื่นในการจัดหายุทโธปกรณ เพราะพอคาสงครามในวันนี้อาจกลายเปนศัตรูในสงครามของวันพรุงนี้ เราตองขยายกําลังการผลิตทางอุตสาหกรรมเพื่อผลิตยุทธปจจัยที่จําเปนตอการสูรบ"
 NOR_alt_dem_economic_relief_measures: "มาตรการบรรเทาทุกขทางเศรษฐกิจ"
 NOR_alt_dem_economic_relief_measures_desc: "ประชาชนเริ่มเหนื่อยหนายกับการเสริมสรางกําลังทหารของเรา พวกเขาอาจมองไมเห็นสิ่งที่เราเห็น และอาจไมรูวาการเสียสละของพวกเขาจําเปน เพราะเครื่องจักรสงครามของเราตองเดินหนาตอไปเพื่อควาชัยชนะ ไมเปนไร ตอนนี้เราจะตอบสนองความตองการของพวกเขาไปกอน"
 NOR_alt_dem_expedite_training: "เรงการฝก"
 NOR_alt_dem_expedite_training_desc: "เรากําลังตกอยูในสถานการณคับขัน หากเราไมฝกทหารใหมโดยเร็ว เราทุกคนอาจถึงคราวพินาศ"
 NOR_alt_dem_prioritize_production: "ใหความสําคัญกับการผลิต"
 NOR_alt_dem_prioritize_production_desc: "เครื่องจักรสงครามของเราตองการยุทโธปกรณ และตองการเดี๋ยวนี้! ใหโรงงานเดินเครื่องไมหยุดหยอน เพื่อใหทหารผูกลาของเรามีเครื่องมือเอาชนะศัตรู ไมวาจะตองแลกดวยอะไรก็ตาม"
 NOR_alt_dem_offensive_push: "การรุกผลักดัน"
 NOR_alt_dem_offensive_push_desc: "ชางหัวเรื่องอื่นทั้งหมด ถึงเวลาโจมตีแลว จงรุกไปขางหนาและบดขยี้ศัตรูกอนที่พวกเขาจะรูตัววาโดนอะไรเขา"
 NOR_alt_dem_focus_on_defense: "มุงเนนการปองกัน"
 NOR_alt_dem_focus_on_defense_desc: "จนกระทั่งเมื่อไมนานมานี้ [NOR.GetName] ยังเปนชาติที่สงบสุขและปลอดอาวุธ เราจึงกระจายกําลังจนบางเฉียบ ในตอนนี้เราตองมุงปองกันสิ่งที่เรามีอยู"
 NOR_alt_dem_modernize_armed_forces_decision: "$NOR_modernize_armed_forces_decision$"
 NOR_alt_dem_modernize_armed_forces_decision_desc: "$NOR_modernize_armed_forces_decision_desc$"
 NOR_fascist_preparation_decisions_category: "ซุมอยูในเงามืด"
 NOR_fascist_preparation_decisions_category_desc: "พรรคนาสโยนัล ซัมลิงในอดีตไดรับการสนับสนุนที่จํากัดมากในสังคม[NOR.GetAdjective] นี่จึงเปนเหตุผลวาทําไมการเผยแพรแนวคิดไปทั่วประเทศและสรางฐานสนับสนุนจึงสําคัญ\n\nดวยการหวานเมล็ดพันธุแหงลัทธิฟาสซิสต เมื่อโอกาสที่เหมาะสมมาถึง เราจะสามารถเก็บเกี่ยวผลจากการวางแผนและยึดครอง [ROOT.GetName] ได\n\n\nการสนับสนุนนาสโยนัล ซัมลิงทั้งหมดใน[NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_fascist_deploy_prep_decisions_category: "ผงาดจากเงามืด"
 NOR_fascist_deploy_prep_decisions_category_desc: "เวลาแหงการซอนตัวสิ้นสุดลงแลว เราไดรวบรวมการสนับสนุนมากพอที่จะเริ่มยึดอํานาจใน [NOR.GetName] บัดนี้เราตองนําการเตรียมการไปใชในแตละดินแดนของปตุภูมิ\n\nเราไดสรางฐานสนับสนุนขึ้นมาจากรากหญา และวางเซลลที่พรอมจะยึดดินแดนของตนตามคําสั่งของฟอเรอรผูยิ่งใหญ เพื่อตอตานกองกําลังขี้ขลาดของระบอบประชาธิปไตย"
 NOR_communist_preparation_decisions_category: "ปลุกชนชั้นกรรมาชีพ"
 NOR_communist_preparation_decisions_category_desc: "[GetRousingProletariatDesc]"
 NOR_communist_preparation_decisions_category_desc_stalinist: "ประชาชนของ [ROOT.GetName] หลับตามานานเกินไปแลว ถึงเวลาที่พวกเขาจะตองรับฟงเสียงเรียกของพี่นองชายหญิงใน [SOU.GetNameDef] เสียที\n\nจงใชพวกเขาเปนแบบอยางวา [ROOT.GetName] จะบรรลุอะไรไดบาง เมื่อยึดปจจัยการผลิตและรวมกันภายใตธงผืนเดียวและผูนําคนเดียว ผูจะนําพวกเขาตอสูกับทรราชแหงออสโล$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_trostkyist: "ถึงเวลาที่ประชาชนแหง [NOR.GetName] จะรับฟงคําสอนของมารกซและทรอตสกี และเตรียมพรอมสําหรับการปะทะที่หลีกเลี่ยงไมได ซึ่งจะเปลี่ยนชาติของเราใหเปนหัวหอกของลัทธิคอมมิวนิสตในสแกนดิเนเวีย\n\nจงโอบรับไฟกัลปแหงการปฏิวัติถาวร และรวมประเทศใหเปนหนึ่งเพื่อตอตานกองกําลังทุนนิยมที่ตั้งอยูในออสโล$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_other: "การปฏิวัติตองเริ่มจากลางขึ้นบน จากมวลชนที่ตรากตรําทํางานทั้งชีวิตใหเจาที่ดินหรือนายทุนอุตสาหกรรม\n\nพี่นองชนชั้นกรรมาชีพของเราจํานวนมากไมรูถึงพลังที่ตนมีอยู เราจึงตองออกไปปลุกชนชั้นกรรมาชีพใหรวมตัวกันตอตานออสโล เพื่อทําลายพันธนาการของทุนนิยมทีละรัฐ$NOR_revolution_support_counter$"
 NOR_revolution_support_counter: "\n\n\nการสนับสนุนการปฏิวัติของเราทั้งหมด: [?NOR.NOR_country_preparedness]/[?NOR.NOR_comm_prep_max_preparedness]"
 NOR_monarchist_preparation_decisions_category: "แสดงใหพระเจาฮากอนเห็นถึงการสนับสนุนรัชสมัยของพระองค"
 NOR_monarchist_preparation_decisions_category_desc: "ตั้งแตกอนเสด็จขึ้นครองราชย พระเจาฮากอนที่ 7 ผูทรงถอมพระองคของเราไดทรงมอบพระราชอํานาจใหแกสภาสตอรติงและผูแทนราษฎร ซึ่งในเวลานั้นก็นับวาดีแลว แตเราตองแสดงใหพระองคเห็นวาเราสนับสนุนใหพระองคทรงเขาควบคุม [ROOT.GetName] โดยตรง กอนที่จะไมเหลืออะไรใหควบคุม\n\n\nการสนับสนุนสถาบันกษัตริยทั้งหมด: [?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_historical: "พัฒนา [?FROM.GetName]"
 NOR_prepare_state_historical_desc: "ฐานอุตสาหกรรมของเราพังทลาย แตเราพรอมจะทุมเทความพยายามที่จําเปนเพื่อปรับปรุงสถานการณใหประชาชนของ [ROOT.GetName] และเพิ่มโอกาสรอดของเราหากเกิดเรื่องเลวรายที่สุด"
 NOR_prepare_historical_unlock_TT: "ปลดล็อกการตัดสินใจ §Yพัฒนารัฐ§! ซึ่งชวยเรง§Gการกอสรางของพลเรือน§! แตมีบทลงโทษตอ§Rการกอสรางทางทหารและการปองกัน§!"
 NOR_prepare_fascist_unlock_TT: "ปลดล็อกการตัดสินใจ §Yสรางการสนับสนุนในรัฐ§! ซึ่ง§Gเพิ่มการสนับสนุนฟาสซิสต§! และมอบ§Gดินแดนและผลประโยชน§!เมื่อสงครามกลางเมืองเริ่มขึ้น แตมีบทลงโทษตอ§Rอุตสาหกรรมพลเรือน§!"
 NOR_prepare_communist_unlock_TT: "ปลดล็อก §Yปลุกชนชั้นกรรมาชีพในรัฐ§! ซึ่งมอบ§Gดินแดนและกําลังทหาร§!เมื่อการปฏิวัติคอมมิวนิสตเริ่มขึ้น แตจะ§Rสรางความเสียหายแกสิ่งปลูกสราง§!ในรัฐนั้น"
