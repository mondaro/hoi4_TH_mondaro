 FIN_prioritize_heavy_industry_desc: "แนวทางอุตสาหกรรมของเราผิดพลาดไปหมด และเราตองทบทวนใหมทันที"
 FIN_rebalance_industrial_focus: "ปรับสมดุลแนวทางอุตสาหกรรม"
