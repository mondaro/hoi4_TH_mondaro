 NOR_dem_his_integrate_militias: "ผนวกรวมกองกําลังอาสาสมัคร"
 NOR_dem_his_integrate_militias_desc: "เมื่อชายผูประกอบเปนกองกําลังอาสาสมัครของเราไดพิสูจนความกลาหาญแลว เราสามารถผนวกรวมพวกเขาเขากับกองทัพไดดียิ่งขึ้น ในฐานะกองพันและกองพลประจําการ"
