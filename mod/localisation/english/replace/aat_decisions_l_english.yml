 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp_tooltip: "ตองใช £infantry_equipment_text_icon  §Y1500§! £command_power  §Y30§!  £pol_power  §Y70§! ในการตัดสินใจนี้"
 FIN_crush_the_karelian_insurrection_tt: "\n[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! §Gจะไมสามารถยุยงใหเกิดการลุกฮือในคาเรเลียไดอีก§!\n"

 FIN_confederated_finno_russian_republics_category: "สหพันธสาธารณรัฐฟนโน-รัสเซีย"
 FIN_confederated_finno_russian_republics_category_desc: "มีชนชาติฟนนิกจํานวนมากที่อาศัยอยูในดินแดนที่เปนหรือเคยเปนสาธารณรัฐและดินแดนของรัสเซีย เชน ชาวฟนแลนด ชาวเอสโตเนีย ชาวคาเรเลีย ชาวเวปส ชาวอีโจรา ชาวโวต ชาวเซโต ชาวโวโร และชาวอินเกรีย เราควรจัดตั้งสหพันธรัฐที่ตอบสนองตอทุกชนชาติเหลานั้นและมากกวานั้น"
 FIN_integrate_karelia_puppet: "ผนวกรวม [FROM.GetName] ในฐานะสาธารณรัฐ"
 FIN_integrate_karelia_puppet_desc: "ถึงเวลาแลวที่เราจะสถาปนาคาเรเลียเปนสาธารณรัฐใหมภายใตการดูแลของเรา"
 FIN_integrate_karelia_states: "ผนวกรวม [FROM.GetName] เปนสวนหนึ่งของสาธารณรัฐคาเรเลีย"
 FIN_integrate_karelia_states_desc: "สาธารณรัฐคาเรเลียยังไมครอบคลุมดินแดนทั้งหมดที่ชาวคาเรเลียอาศัยอยู และดวยการผนวก [FROM.GetName] เขาไป เราจะพยายามแกไขสถานการณนี้ได"
 FIN_integrate_karelia_additional_states: "เพิ่ม [FROM.GetName] เขาในสาธารณรัฐคาเรเลีย"
