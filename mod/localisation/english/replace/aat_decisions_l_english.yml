 DEN_bop_unban_oppositions_uniforms_desc: "เราไมอาจหามพรรคอื่นใชเครื่องแบบทางการเมือง ขณะที่ผูสนับสนุนของเราเดินขบวนบนทองถนนราวกับผูรวมขบวนสวนสนามทางทหาร เราตองยกเลิกการเซ็นเซอรนี้"
 DEN_bop_defend_the_policy_of_neutrality: "£BoP_left_texticon ปกปองนโยบายความเปนกลาง"
 DEN_bop_defend_the_policy_of_neutrality_desc: "ความเปนกลางรับใชเรามาอยางดี โดยเฉพาะในชวงมหาสงครามที่การสูรบลุกลามไปทั่วยุโรป แตไมใชที่นี่ ไมใชในเดนมารก เรารอดมาได เราไดรับการละเวน ความเปนกลางรับใชเรามาอยางดีจริง ๆ"
 DEN_bop_speak_out_in_favor_of_disarmament: "£BoP_left_texticon สนับสนุนการลดอาวุธ"
 DEN_bop_speak_out_in_favor_of_disarmament_desc: "ในฐานะชาติเล็กที่ถูกลอมรอบดวยมหาอํานาจ เราไมมีหวังจะตานทานกองกําลังรุกรานได แลวจะใชเงินไปกับการปองกันที่ไมมีวันชวยเรา แตอาจทําใหเพื่อนบานที่ใหญกวามากโกรธเคืองไปทําไม?"
 DEN_bop_speak_out_against_warfare: "£BoP_left_texticon คัดคานการฟนฟูกําลังอาวุธ"
 DEN_bop_speak_out_against_warfare_desc: "การฟนฟูกําลังอาวุธในตอนนี้จะเปนอันตรายรายแรงตอประเทศ เพราะอาจถูกมหาอํานาจใกลเคียงมองวาเปนการกระทําที่เปนปฏิปกษไดงาย เราไมอาจเสี่ยงทําใหเพื่อนบานที่ใหญกวาโกรธเคืองในตอนนี้ เพราะเราไมมีทางปองกันตนเองจากกองทัพที่แข็งแกรงกวามาก"
 DEN_bop_expand_the_welfare: "£BoP_left_texticon ขยายระบบสวัสดิการ"
 DEN_bop_expand_the_welfare_desc: "แทนที่จะปลุกปนสงครามและสิ้นเปลืองเงินไปกับการปองกันที่ไมมีหวังจะตานการโจมตีของมหาอํานาจใด ๆ ในละแวกนี้ เราควรเพิ่มงบประมาณใหระบบสวัสดิการที่กําลังเติบโตของเรา!"
 DEN_bop_unban_all_political_uniforms: "£BoP_right_texticon อนุญาตเครื่องแบบทางการเมืองทั้งหมด"
 DEN_bop_unban_all_political_uniforms_desc: "เราไมอาจปลอยใหการหามเครื่องแบบทางการเมืองคงอยูได เพราะมันลิดรอนสิทธิของประชาชน!"
 DEN_bop_ban_oppositions_uniforms: "£BoP_right_texticon สั่งหามเครื่องแบบทางการเมืองของฝายคาน"
 DEN_bop_ban_oppositions_uniforms_desc: "เราไมอาจปลอยใหคูแขงทางการเมืองเดินอวดเครื่องแบบไปทั่ว สิ่งนี้มีแตจะแพรความไมพอใจและความแตกแยก เราควรหามเครื่องแบบทางการเมืองทั้งหมด - ยกเวนของผูที่กุมอํานาจอยู แนนอน"
 DEN_bop_defend_our_chosen_path_rearmament: "£BoP_right_texticon ปกปองเสนทางที่เราเลือก"
 DEN_bop_defend_our_chosen_path_rearmament_desc: "$DEN_bop_defend_our_chosen_path_neutrality_desc$"
 DEN_bop_criticize_our_preparedness: "£BoP_right_texticon วิจารณความพรอมของเรา"
 DEN_bop_criticize_our_preparedness_desc: "เมฆดํากําลังกอตัวเหนือยุโรปอีกครั้ง และเรายังไมพรอมเลยสําหรับพายุที่กําลังจะมาถึง! เราตองเริ่มเตรียมการโดยเร็วที่สุดหากจะฝาพายุนี้ไปใหได"
 DEN_bop_question_our_defenses: "£BoP_right_texticon ตั้งคําถามตอการปองกันของเรา"
 DEN_bop_question_our_defenses_desc: "นโยบายความเปนกลางที่ยึดถือมายาวนานไดทําใหเดนมารกไรการปองกันใด ๆ โดยสิ้นเชิง! หากเราถูกมหาอํานาจตางชาติโจมตี ก็ไมมีอะไรหยุดยั้งพวกเขาไมใหเดินทัพตรงเขาโคเปนเฮเกนไดในตอนนี้ เราตองดูแลการปองกันของเราหากจะอยูรอดในฐานะประเทศ!"
 DEN_bop_speak_out_against_welfare: "£BoP_right_texticon คัดคานระบบสวัสดิการ"
 DEN_bop_speak_out_against_welfare_desc: "เราตองดูแลการปองกันเพื่อรักษาเอกราชกอน จึงจะใชเงินไปกับสิ่งอื่นได เปนเรื่องสมเหตุสมผลวาหากไมมีชาติเดนมารก ก็ไมมีชาวเดนมารกใหใชเงินนั้นดวย"
 DEN_bop_speak_out_in_favor_of_rearmament: "£BoP_right_texticon สนับสนุนการฟนฟูกําลังอาวุธ"
 DEN_bop_speak_out_in_favor_of_rearmament_desc: "เราไมอาจนิ่งดูดายขณะที่สวนอื่นของยุโรปกําลังแขงขันสะสมอาวุธ และอนาคตยังไมแนนอน เราตองเตรียมการปองกันและเริ่มฟนฟูกําลังอาวุธโดยเร็วที่สุด ถาเปนไปไดก็ตั้งแตเมื่อวาน!"
 DEN_bop_landstorm: "£BoP_right_texticon จัดตั้งลันดสตอรมขึ้นใหม"
 DEN_bop_landstorm_desc: "ดวยความวุนวายที่กอตัวอยูรอบตัวเรา ถึงเวลาแลวที่จะฟนลันดสตอรมขึ้นมาเพื่อปกปองดินแดน แมคุณภาพจะไมดีที่สุด แตทหารเหลานี้อาจเปนแนวปองกันดานสุดทาย"
 DEN_bop_hold_a_military_parade: "£BoP_right_texticon จัดขบวนสวนสนามทางทหาร"
 DEN_bop_hold_a_military_parade_desc: "การจัดขบวนสวนสนามทางทหารจะเพิ่มความเชื่อมั่นของประชาชนในความสามารถของเราที่จะปกปอง [ROOT.GetNameDef] การไดเห็นความฮึกเหิมของทหารยอมเสริมขวัญกําลังใจและความมุงมั่นของพวกเขาอยางแนนอน"
 #OCCUPATION BOP
 DEN_bop_occupation_criticize_collaboration: "£BoP_right_texticon วิจารณนโยบายความรวมมือ"
 DEN_bop_occupation_criticize_collaboration_desc: "การยอมจํานนอันไรเกียรติและความรวมมืออันชั่วรายระหวาง [ROOT.GetNameDef] กับ [?DEN.DEN_overlord_nation.GetNameDef] ไมมีคาแมแตกระดาษที่ใชเขียน!"
 DEN_bop_occupation_strikes: "£BoP_right_texticon ประสานการนัดหยุดงานอยางลับ ๆ"
 DEN_bop_occupation_strikes_decs: "สิ่งที่ดีที่สุดที่เราทําไดในตอนนี้คือการประทวงการยึดครองของ[?DEN.DEN_overlord_nation.GetAdjective]อยางสันติดวยการประสานการนัดหยุดงานทั่วประเทศ"
 DEN_bop_occupation_resistance_coordination: "£BoP_right_texticon ประสานขบวนการตอตาน"
 DEN_bop_occupation_resistance_coordination_desc: "หากเราตองการกอบกูเสรีภาพคืน เราตองรวมตัวกันเปนขบวนการตอตานเดียวกันและตอสูเพื่อเปาหมายเดียวกัน นั่นคือการปลดปลอย [ROOT.GetNameDef]"
 DEN_bop_occupation_underground_factories: "£BoP_right_texticon โรงงานอาวุธใตดิน"
 DEN_bop_occupation_underground_factories_desc: "เพื่อเพิ่มโอกาสในการกอบกูอธิปไตยคืน เราตองมีคลังอาวุธที่เพียงพอ เราตองสรางโรงงานอาวุธลับเพื่อติดอาวุธใหประชาชนเมื่อวันที่เราตองสูเพื่อเสรีภาพมาถึง"
 DEN_bop_occupation_raid_depots: "£BoP_right_texticon จูโจมคลังอาวุธ"
 DEN_bop_occupation_raid_depots_desc: "โรงงานอาวุธในประเทศของเราผลิตและสงอาวุธให [?DEN.DEN_overlord_nation.GetNameDef] อาวุธที่ถูกใชในสงครามของพวกเขา การจูโจมคลังอาวุธจะลดการสงอาวุธ พรอมกับเสริมกําลังขบวนการตอตานของเราไปในเวลาเดียวกัน"
 DEN_bop_occupation_sabotage_civ_industry: "£BoP_right_texticon กอวินาศกรรมอุตสาหกรรมพลเรือน"
 DEN_bop_occupation_sabotage_civ_industry_desc: "โรงงานและอุตสาหกรรมในประเทศของเราถูกบังคับใหผลิตและสงวัสดุตาง ๆ ให [?DEN.DEN_overlord_nation.GetNameDef] วัสดุที่ถูกใชในสงครามของพวกเขา การกอวินาศกรรมโรงงานเหลานี้จะลดการสงวัสดุ ซึ่งจะบั่นทอนความพยายามทางสงครามของเยอรมัน"
 DEN_bop_occupation_sabotage_mil_industry: "£BoP_right_texticon กอวินาศกรรมอุตสาหกรรมทหาร"
 DEN_bop_occupation_sabotage_mil_industry_desc: "โรงงานอาวุธในประเทศของเราผลิตและสงอาวุธให [?DEN.DEN_overlord_nation.GetNameDef] อาวุธที่ถูกใชในสงครามของพวกเขา การกอวินาศกรรมโรงงานเหลานี้จะลดการสงอาวุธ บั่นทอนความพยายามทางสงครามของเยอรมัน และชวยเหลือพันธมิตรที่อาจเปนไปไดของเรา"
 DEN_bop_occupation_funnel_resources_danish_brigade: "£BoP_right_texticon สงทรัพยากรใหกองพลนอยเดนมารก"
 DEN_bop_occupation_funnel_resources_danish_brigade_desc: "[?DEN.hosts_danish_brigades.GetNameDefCap] ยินดีรับและฝกทหารเดนมารกที่จะชวยปลดปลอย [ROOT.GetNameDef] เมื่อถึงเวลา แตเพื่อใหทหารเหลานี้มีโอกาสดีที่สุดในภารกิจปลดปลอยประเทศของเรา เราตองชวยเหลือดวยเงินและวัสดุ"
 DEN_bop_occupation_switch_ideology: "รับเอา[?DEN.DEN_overlord_nation.GetRulingIdeologyNoun]มาใช"
 DEN_bop_occupation_switch_ideology_desc: "หากเราตองการเขาขาง [?DEN.DEN_overlord_nation.GetNameDef] อยางแทจริงและไดรับการสนับสนุนจากพวกเขา เราตองรับเอาอุดมการณและความเชื่อของพวกเขามาใช"
 DEN_bop_occupation_ban_elections: "£BoP_left_texticon สั่งหามการเลือกตั้ง"
 DEN_bop_occupation_ban_elections_desc: "เราตองเอาใจเจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]ดวยการหามการเลือกตั้งเสรี"
 DEN_bop_occupation_defend_collaboration: "£BoP_left_texticon ปกปองนโยบายความรวมมือ"
 DEN_bop_occupation_defend_collaboration_desc: "การยอมจํานนและรวมมือกับ [?DEN.DEN_overlord_nation.GetNameDef] เปนทางเลือกเดียวที่ถูกตอง! มันชวยใหเรารอดพนจากความสยดสยองและความพินาศที่เราไมอาจจินตนาการได"
 DEN_bop_occupation_censor_the_media: "£BoP_left_texticon เซ็นเซอรสื่อ"
 DEN_bop_occupation_censor_the_media_desc: "เราไมอาจปลอยใหสื่อวิจารณกองกําลังยึดครอง[?DEN.DEN_overlord_nation.GetAdjective]อยางเปดเผยในสถานการณลอแหลมเชนนี้ เราตองจํากัดสิ่งที่พวกเขาเผยแพรได เพื่อไมใหเสี่ยงตอเสรีภาพอันนอยนิดที่เรายังมีอยู"
 DEN_bop_occupation_remove_political_agitator: "£BoP_left_texticon ปลดนักการเมืองหัวรุนแรง"
 DEN_bop_occupation_remove_political_agitator_desc: "นักการเมืองที่มีชื่อเสียงบางคนไมลังเลที่จะวิจารณเจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]ของเรา ซึ่งทําใหความตึงเครียดระหวางสองประเทศเพิ่มขึ้น เราตองปลดตัวปวนเหลานี้ออกจากตําแหนงทางการเมืองกอนที่ [?DEN.DEN_overlord_nation.GetNameDef] จะบังคับใหเราทํา"
 DEN_bop_occupation_ban_communism: "£BoP_left_texticon สั่งหามลัทธิคอมมิวนิสต"
 DEN_bop_occupation_ban_communism_desc: "เจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]ของเรามองวาตนกําลังทําสงครามกับอุดมการณคอมมิวนิสตโดยตรง และจะเห็นคุณคาในความรวมมือของเรามากขึ้นหากเราสั่งหามองคกรคอมมิวนิสตทั้งหมดในประเทศ"
 DEN_bop_occupation_allow_communism: "£BoP_left_texticon อนุญาตลัทธิคอมมิวนิสต"
 DEN_bop_occupation_allow_communism_desc: "เจาเหนือหัวคอมมิวนิสตของเราไมพอใจนักที่เราสั่งหามอุดมการณของพวกเขาใน [ROOT.GetNameDef] จะเปนประโยชนสูงสุดตอเราหากอนุญาตลัทธิคอมมิวนิสตอีกครั้ง"
 DEN_bop_occupation_ban_fascism: "£BoP_left_texticon สั่งหามลัทธิฟาสซิสต"
 DEN_bop_occupation_ban_fascism_desc: "เจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]ของเรามองวาตนกําลังทําสงครามกับอุดมการณฟาสซิสตโดยตรง และจะเห็นคุณคาในความรวมมือของเรามากขึ้นหากเราสั่งหามองคกรฟาสซิสตทั้งหมดในประเทศ"
 DEN_bop_occupation_allow_fascism: "£BoP_left_texticon อนุญาตลัทธิฟาสซิสต"
