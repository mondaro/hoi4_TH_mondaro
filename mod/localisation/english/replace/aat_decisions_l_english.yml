 FIN_crack_down_on_fascists: "ปราบปรามพวกฟาสซิสต"
 FIN_crack_down_on_fascists_desc: "พวกฟาสซิสตคือศัตรูที่แทจริงของประชาชน[FIN.GetAdjective] และตองถูกจัดการโดยเร็วที่สุด"
 FIN_crack_down_on_fascists_character_tt: "บุคคลทางการเมืองฝายฟาสซิสตจะถูกจําคุก และฝายศัตรูจะไมสามารถใชงานไดในสงครามกลางเมือง:"
