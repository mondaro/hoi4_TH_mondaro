 SMB_mountain_guns: "ลงทุนในปนใหญภูเขา"
 SMB_mountain_guns_desc: "กองทัพของเราสังเกตวาแมจะแข็งแกรงมาก แตปนใหญในตอนนี้แทบใชการไมไดในภูมิประเทศภูเขาของชิลี พวกเขาจึงสั่งซื้อปนใหญภูเขาที่ออกแบบมาใหใชงานบนภูเขาไดงายขึ้น เพื่อใหเรายังใชอาวุธรายแรงนี้ไดตอไป"

 SMB_tierra_del_fuego_training: "ฝกที่เตียรราเดลฟวยโก"
 SMB_tierra_del_fuego_training_desc: "ทหารของเราตองไดรับการฝกอยางเหมาะสม หากตองการใหรบไดอยางมีประสิทธิภาพในดินแดนทางใตอันหนาวเย็นและบนภูเขา ดังนั้นเราตองตั้งคายฝกใหกองทหารที่เตียรราเดลฟวยโก เพื่อใหปรับตัวเขากับความหนาวไดดีขึ้น"

 SMB_atacama_training: "ฝกในทะเลทรายอาตากามา"
 SMB_atacama_training_desc: "ทหารของเราตองไดรับการฝกอยางเหมาะสม หากตองการใหรบไดอยางมีประสิทธิภาพในความรอนของเขตรอนและทะเลทราย วิธีที่ดีที่สุดในการแกปญหานี้คือตั้งคายฝกในทะเลทรายอาตากามา ที่ซึ่งพวกเขาจะปรับตัวเขากับความรอนไดดีขึ้น"

 SMB_a_land_of_mountains: "ดินแดนแหงขุนเขา"
 SMB_a_land_of_mountains_desc: "[ROOT.GetName] มีธรรมเนียมอันเขมแข็งมายาวนานในการใชภูมิประเทศภูเขาใหเปนประโยชนในการรบ และอนาคตก็จะไมตางไปจากนี้ เราเปนผูคนที่คุนเคยกับการใชชีวิตบนภูเขา และเราจะใชความเชี่ยวชาญนี้เอาชนะศัตรูผูยิ่งใหญไมวารายใดที่เราตองเผชิญ"

 SMB_navy_desc: "[SMB_navy_desc_key]"
 SMB_navy_desc_default: "กองทัพเรือของเราซบเซามาตั้งแตมหาสงครามจนเรือหลายลําไมเหมาะกับการใชงานอีกตอไป ถึงเวลาแลวที่เราตองลงทุนในกองเรือและเริ่มโครงการปรับปรุงใหทันสมัยครั้งใหญ"
 SMB_CHL_navy_desc: "แมกองเรือของเราจะมีธรรมเนียมอันยาวนานและนาภาคภูมิใจ แตเกียรติภูมิของกองทัพเรือไดรับความเสียหายอยางหนักจากการกบฏทหารเรือในป 1931 การลงทุนใน Armada de Chile จะชวยฟนความเชื่อมั่นของประชาชนที่มีตอกองทัพเรือของเรา"
 SMB_naval_academy_desc: "[SMB_naval_academy_desc_key]" 
 SMB_naval_academy_default_desc: "การผลิตและบํารุงรักษาเรือเพียงอยางเดียวไมเพียงพอที่จะเปนกองทัพเรือ เราตองการนายทหารและผูเชี่ยวชาญที่ไดรับการฝกมาอยางดีในการใชทรัพยากรทางเรือในการรบ ดังนั้นเราจะจัดตั้งโรงเรียนนายเรือ[ROOT.GetAdjective]ขึ้นเพื่อฝกนายทหารเรือรุนตอไป"
 SMB_naval_academy_CHL_desc: "Escuela Naval ของเรามีประวัติอันยาวนานในการฝกนายทหารเรือที่มีฝมือ แตการลงทุนอยางตอเนื่องเปนสิ่งจําเปนเพื่อใหพลเรือเอกและผูบังคับการเรือของเราพรอมสําหรับสงครามทางทะเลสมัยใหม"
 SMB_construct_naval_bases_desc: "สิ่งอํานวยความสะดวกทางเรือของเราลาสมัยและจําเปนตองปรับปรุงอยางเรงดวน การลงทุนในสิ่งเหลานี้จะทําใหเราสามารถสรางและสนับสนุนกําลังทางเรือที่มีขีดความสามารถสูงขึ้นมาก"
 SMB_naval_foreign_advisors_desc: "นายทหารเรือของเรามีโอกาสนอยมากที่จะไดทดสอบความสามารถในการรบเมื่อไมนานมานี้ ดังนั้นเราจะไดประโยชนจากการเชิญนายทหารจากกองทัพเรือตางชาติมาฝกนายทหารของเราในยุทธวิธีทางเรือสมัยใหม"
 SMB_reescalate_the_naval_arms_race_desc: "แมเราจะไมมีขอตกลงอยางเปนทางการกับเพื่อนบานเรื่องขนาดของกองทัพเรือ แตเราก็งดเวนการขยายกองทัพเรือมากเกินไปนับตั้งแตมหาสงคราม อยางไรก็ตาม สงครามกําลังจะมาถึงอีกครั้ง และจะเปนการดีกวาหากเราเริ่มเสริมสรางอาวุธกอนเพื่อนบาน"
 SMB_blue_water_fleet_desc: "การแผขยายอํานาจทางทะเลเปนสิ่งสําคัญยิ่งสําหรับชาติใดก็ตามที่ปรารถนาจะกาวขึ้นสูชั้นมหาอํานาจ หรือตองการรักษาการปองปรามที่เขมแข็งตอศัตรูที่อาจเกิดขึ้น ดังนั้นเราควรทําใหกองทัพเรือของเรามียุทโธปกรณและการฝกที่เหมาะสมเพื่อปฏิบัติการไดอยางมีประสิทธิภาพแมอยูหางไกลจากทาเรือบานเกิด"
 SMB_coastal_fleet_desc: "เราแทบไมมีความทะเยอทะยานที่จะไปรบทั่วโลก ดังนั้นภารกิจหลักของกองเรือเราควรเปนการปกปองชายฝงและปองกันไมใหศัตรูใดยกพลขึ้นบกบนชายฝงของเรา"
 SMB_purchase_cruisers_and_dreadnoughts_desc: "แมกําลังทางอุตสาหกรรมของเราจะเติบโตอยางตอเนื่อง แตเวลาไมไดอยูขางเรา เพื่อเสริมความแข็งแกรงใหกองทัพเรืออยางเพียงพอ เราตองการเรือหลักเพิ่มขึ้นโดยเร็วที่สุด ดังนั้นเราจะติดตอมหาอํานาจเพื่อดูวาพวกเขายินดีจะขายเรือเดรดนอตและเรือลาดตระเวนที่ปลดประจําการแลวหรือไม"
 SMB_minelaying_desc: "การรักษาจํานวนเรือใหเพียงพอตอการปกปองแนวชายฝงอันกวางใหญของเราตลอดเวลานั้นมีคาใชจายสูงเกินไป ทุนระเบิดเปนทางเลือกที่ถูกกวาซึ่งชวยปองปรามหรือชะลอกองกําลังศัตรูไดจนกวากองเรือจะมาถึง"
 SMB_escort_fleet_desc: "ยุคของกองเรือประจัญบานขนาดใหญไดสิ้นสุดลงแลว สงครามทางทะเลสมัยใหมตองการกองเรือขนาดเล็กในรูปขบวนคุมกันควบคูกับเรือหลักจํานวนจํากัด กองทัพเรือจึงตองปรับแผนเพื่อรองรับยุทธวิธีเชนนี้"
 SMB_raiding_fleet_desc: "เสนทางสงกําลังบํารุงทางทะเลมีความสําคัญยิ่งตอการดําเนินไปของเศรษฐกิจสวนใหญ การใชกําลังทางเรือของเราตัดเสนทางเหลานั้นอาจเปนหนทางที่ทําใหแมแตชาติที่ทรงอํานาจที่สุดตองคุกเขา"
 SMB_degaussing_desc: "เราจะเริ่มลดสนามแมเหล็กของตัวเรือ เพื่อลดรองรอยแมเหล็กของเรือ ซึ่งจะชวยปองกันเรือจากทุนระเบิดแมเหล็กและลดรองรอยทางอิเล็กทรอนิกสของเรือ"
 SMB_naval_invasion_desc: "การจัดการกับชาติศัตรูมักตองอาศัยทหารยกพลขึ้นบกบนชายฝงของพวกเขา เพื่อเพิ่มขีดความสามารถในการปฏิบัติการเชนนั้นใหมากที่สุด เราจะเริ่มฝกกองทัพบกและกองทัพเรือในการฝกรวม"
 SMB_cruiser_subs_desc: "มหาสมุทรแอตแลนติกและแปซิฟกกวางใหญและตองการเรือดํานํ้าที่ปฏิบัติการไดอยางมีประสิทธิภาพดวยตนเองเปนเวลานาน ดังนั้นเราตองลงทุนพัฒนาเรือดํานํ้าลาดตระเวนของเราเอง"
 SMB_midget_subs_desc: "การใชเรือดํานํ้าที่ตองพึ่งพาตนเองในมหาสมุทรอันกวางใหญคงเปนความพยายามที่สูญเปลา เราสามารถใชทรัพยากรไดดีกวาดวยการสรางเรือขนาดเล็กที่ปฏิบัติการในนานนํ้าตื้นตามแนวชายฝงของเรา"
 SMB_expand_repair_yards_desc: "แมแตเรือที่แข็งแกรงที่สุดพรอมลูกเรือที่มีประสิทธิภาพที่สุด สุดทายก็ตองไดรับการซอมแซมกอนกลับเขาประจําการ เราควรลงทุนในอูซอมเรือเพื่อใหกระบวนการนี้รวดเร็วที่สุดเทาที่จะทําได"
 SMB_enlarge_naval_facilities_desc: "พัฒนาการตาง ๆ ทั่วโลกเมื่อไมนานมานี้แสดงใหเห็นชัดวากองทัพเรือของเราตองขยายตัวหากเราตองการรักษากองเรือที่เพียงพอ กาวแรกคือการขยายสิ่งอํานวยความสะดวกทางเรือที่มีอยู"
 SMB_merchant_marine_desc: "การขนสงทรัพยากรทางทะเลมีความสําคัญยิ่งตอความมั่นคงของชาติหลายชาติ และชาติของเราก็ไมมีขอยกเวน ดังนั้นเราควรจัดตั้งกองเรือพาณิชยที่เปนมืออาชีพซึ่งสามารถสนับสนุนกองทัพในยามวิกฤต"
 SMB_aircraft_carriers_desc: "เพื่อไมใหถูกศัตรูทิ้งหาง เราตองนําอากาศยานเขามาในกองทัพเรือ และเพื่อการนั้นเราตองผลิตเรือบรรทุกเครื่องบินของเราเอง การใชตัวเรือของเรือขนาดใหญที่ลาสมัยอาจเปนหนทางเรงการผลิตได"
 SMB_fortification_effort_desc: "แมกองทัพเรือและกองทัพอากาศจะเปนเครื่องมือหลักในการปองกันไมใหกองกําลังศัตรูมาถึงชายฝงของเรา แตเราก็ยังควรรักษาแนวปอมปราการชายฝงที่แข็งแกรงไวเปนแนวปองกันสุดทายตอผูรุกรานทุกราย"

