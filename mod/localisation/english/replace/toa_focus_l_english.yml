 CHL_use_the_fascist_movement_tt: "การกอการกําเริบของพวกนาซิสตาจะนําไปสู§Rสงครามกลางเมือง!§!ขนาดยอม"
 CHL_suppress_the_nacistas_tt: "การกอการกําเริบของพวกนาซิสตาจะ§Gออนกําลังลง§!"

 CHL_endorse_the_constitution: "รับรองรัฐธรรมนูญป 1925"
 CHL_endorse_the_constitution_desc: "ในทศวรรษ 1920 เราประสบวิกฤตทางสังคมและเศรษฐกิจอยางรุนแรง ซึ่งทําใหชนชั้นปกครองเกาเสื่อมเกียรติ และนําไปสูการขึ้นมาของรัฐบาลที่นําโดยอารตูโร อเลสซันดรี ในป 1924 เขาถูกโคนลมดวยรัฐประหาร แตถูกเรียกตัวกลับมาในป 1925 หลังจากนั้นเขาใชตําแหนงประธานาธิบดีรางรัฐธรรมนูญฉบับใหมแทนรัฐธรรมนูญป 1833 เราควรพยายามดําเนินตามแนวทางของเขา ในฐานะบิดาผูกอตั้งชิลียุคใหม"

 CHL_cooperation_with_the_falange: "รวมมือกับพรรคฟาลังเงแหงชาติ"
 CHL_cooperation_with_the_falange_desc: "พรรคฟาลังเงแหงชาติเปนพรรคคริสเตียนประชาธิปไตยที่กอตั้งในป 1935 สมาชิกสวนใหญเปนชาวคาทอลิกหัวกาวหนาและนักปฏิรูป เนื่องจากนโยบายหลายอยางของพวกเขาคลายคลึงกับของเรามาก การเชิญพวกเขาเขารวมรัฐบาลจึงไมนาจะยากนัก"

 CHL_denounce_the_anarchy: "ประณามสภาพเกือบอนาธิปไตย"
 CHL_denounce_the_anarchy_desc: "ความจริงที่วาภาวะอนาธิปไตยซึ่งเริ่มขึ้นหลังวิกฤตตลาดหุนวอลลสตรีทยังคงไมไดรับการแกไข เปนเครื่องชี้ชัดถึงความออนแอโดยเนื้อแทของรัฐบาลปจจุบันและอุดมการณเสรีนิยมแบบเฉื่อยชาของมัน เราตองออกมาคัดคานพวกเขาอยางเปดเผย และใหคํามั่นแกประชาชนวาอนาคตเปนของพวกเขา หากพวกเขามารวมยืนหยัดเคียงขางเรา"

 CHL_look_to_tradition: "หวนสูขนบประเพณี"
 CHL_look_to_tradition_desc: "อารตูโร อเลสซันดรี ไดมีชวงเวลาโดดเดนของตนแลว แตก็ยังไมสามารถแกไขปญหารายแรงใด ๆ ที่ยังคงคางคาประเทศอยูได เราจึงตองถอยหางจากเสรีนิยม และหันกลับไปหาคุณคาแบบดั้งเดิมอันดีงามที่เราเคยยึดถือ"

 CHL_impose_new_taxes: "เรียกเก็บภาษีใหม"
 CHL_impose_new_taxes_desc: "ทองพระคลังของเรารอยหรอลงหลังจากความพยายามมากมายในการฟนฟูประเทศใหกลับสูสภาพเดิม เพื่อบรรเทาปญหานี้ แผนที่ดีคือการเรียกเก็บภาษีเงินไดใหมจากประชาชน พวกเขาอาจไมพอใจในตอนแรก แตใหเวลาสักพัก พวกเขาก็จะเงียบไปเอง และเราจะมีเงินใชจายมากขึ้นอีกมาก"

 CHL_1938_chilean_presidential_election: "การเลือกตั้งประธานาธิบดีชิลีป 1938"
 CHL_1938_chilean_presidential_election_desc: "การเลือกตั้งประธานาธิบดีป 1938 มาถึงแลว และประเทศตองเลือกผูนําจากผูสมัครหลักสี่คน ฝายซายมีเปโดร อากีรเร เซรดา กับแนวรวมประชาชน ฝายขวามีการโลส อีบาเญซ เดล กัมโป กับพันธมิตรเสรีภาพประชาชน สายกลางมีกุสตาโว รอสส กับพวกเสรีนิยม และซายสุดขั้วยิ่งกวานั้นมีเอลิอัส ลาเฟรเต กาบีโญ กับพวกคอมมิวนิสต ใครจะเปนผูชนะ?"
 CHL_1938_chilean_presidential_election_tt: "เมื่อ§Yการเลือกตั้งประธานาธิบดี§!เกิดขึ้นในชวงปลาย§Yเดือนตุลาคม 1938§! แผนยุทธศาสตรนี้จะสําเร็จโดยอัตโนมัติ"

 CHL_construct_new_hydroelectric_stations: "สรางโรงไฟฟาพลังนํ้าแหงใหม"
 CHL_construct_new_hydroelectric_stations_desc: "แมอาจเปนการกระทําที่ไมเปนที่นิยมในหมูชาวมาปูเชพื้นเมือง แตภูมิภาคอาเรากาเนียอุดมไปดวยทรัพยากรธรรมชาติทุกรูปแบบ หนึ่งในนั้นคือทะเลสาบและนํ้าตก เราสามารถใชประโยชนจากสิ่งเหลานี้สรางโรงไฟฟาพลังนํ้า แมอาจทําใหผูอยูอาศัยในภูมิภาคไมพอใจก็ตาม"

 CHL_policies_of_arturo_alessandri: "นโยบายของอารตูโร อเลสซันดรี"
 CHL_policies_of_arturo_alessandri_desc: "นโยบายของอเลสซันดรีมีมากมาย และวาระสุดทายของเขายังไมสิ้นสุดเสียดวยซํ้า เขาไดชวยเหลือประเทศชาติอยางมหาศาล และยังมีอํานาจที่จะชวยไดอีกมาก เขาคือบิดาแหงชิลีโฉมใหมอยางแทจริง"

 CHL_suppress_the_nacistas: "ปราบปรามพวกนาซิสตา"
 CHL_suppress_the_nacistas_desc: "Movimiento Nacional-Socialista เคลื่อนไหวคึกคักในระยะหลัง และเห็นไดชัดวาพวกเขาจะลงมือทําอะไรบางอยางในอนาคตอันใกล เราตองเฝาระวังอยูเสมอ และปราบปรามผูเห็นตางทุกที่ที่ปรากฏ"

 CHL_use_the_fascist_movement: "ใชประโยชนจากขบวนการฟาสซิสต"
 CHL_use_the_fascist_movement_desc: "แมจะเห็นไดชัดวาพวกฟาสซิสตกําลังวางแผนบางอยาง แตก็ควรพิจารณาวาพวกเขามีสมาชิกระดับสูงจํานวนมากที่อาจเปนประโยชนตอรัฐบาลของเรา เราจึงควรเขาหาบางคนอยางลับ ๆ และหวังจะใชประโยชนจากจุดแข็งของพวกเขา อยางนอยก็จนกวาพวกเขาจะลงมือทําอะไรบางอยาง"

 CHL_reestablish_the_republican_guard: "ฟนฟูกองรักษาการณสาธารณรัฐ"
 CHL_reestablish_the_republican_guard_desc: "บัดนี้เราถูกโจมตีอีกครั้ง กองรักษาการณสาธารณรัฐตองถูกรวบรวมขึ้นใหมเพื่อตอกรกับภัยคุกคามระดับสูงที่หมายจะตามลาเรา จับอาวุธขึ้นเถิดเหลาทหาร สูเพื่อสาธารณรัฐของพวกทาน!"

 CHL_volunteers_to_the_republicans: "อาสาสมัครเพื่อฝายสาธารณรัฐ"
 CHL_volunteers_to_the_republicans_desc: "พี่นองของเราในสเปนกําลังตอสูกับฝายทหารที่ตองการโคนลมสาธารณรัฐประชาธิปไตยของพวกเขา แมความคิดที่จะเขาแทรกแซงอาจไมไดเปนที่นิยมนักในชิลี แตก็อาจเปนการแสดงใหเห็นถึงความแข็งแกรงและความพรอมของเราในการปกปองประชาธิปไตย"
 CHL_volunteers_to_the_republicans_tt: "@SPR สเปนฝายสาธารณรัฐยังคงอยู"
 CHL_volunteers_to_the_republicans_tt_2: "@SPR สเปนฝายสาธารณรัฐยังไมไดทํา §Y$SPR_regional_defense_council_of_aragon$§! สําเร็จ"

 CHL_prop_up_gustavo_ross: "หนุนกุสตาโว รอสส"
 CHL_prop_up_gustavo_ross_desc: "กุสตาโว รอสส คือศิษยเอกของอารตูโร อเลสซันดรี และเปนตัวเต็งที่เขาเลือกใหชนะการเลือกตั้งประธานาธิบดีที่กําลังจะมาถึง อเลสซันดรีจึงควรทําใหสาธารณชนรับรูเรื่องนี้ และพยายามสรางภาพใหรอสสเปนผูสืบทอดทางจิตวิญญาณของเขาดวยการโฆษณาชวนเชื่ออยางมหาศาล"

 CHL_inflation_control_by_the_central_bank: "ควบคุมเงินเฟอโดย Banco Central de Chile"
 #CHL_inflation_control_by_the_central_bank_desc: "The Banco Central de Chile was founded by president Arturo Alessandri in 1925. We should task them with making sure that inflation stays on a level that is currently desired, so that the budget can be distributed as desired, and the populace be kept as happy as possible."
 CHL_inflation_control_by_the_central_bank_desc: "Banco Central de Chile กอตั้งโดยประธานาธิบดีอารตูโร อเลสซันดรี ในป 1925 เราควรมอบหมายใหพวกเขาควบคุมเงินเฟอเพื่อสนับสนุนการพัฒนาเศรษฐกิจระยะยาวของชิลี และปองกันไมใหราคาสินคาพุงทะยานจนสรางความเสียหายทางเศรษฐกิจและการเมือง"

 CHL_construct_the_estadio_nacional: "สราง Estadio Nacional"
 CHL_construct_the_estadio_nacional_desc: "ความพยายามครั้งใหญที่สุดของอเลสซันดรีในการฟนฟูเศรษฐกิจและความเชื่อมั่นของประชาชนคือโครงการสาธารณูปโภค และผลงานชิ้นเอกของเขาคือ Estadio Nacional สนามกีฬาแหงชาติอันยิ่งใหญ ซึ่งเปนเครื่องพิสูจนความสามารถในการนําประเทศของเขาไดเปนอยางดี"

 CHL_establish_corfo: "กอตั้ง CORFO"
 CHL_establish_corfo_desc: "เราควรพยายามกอตั้งองคกรที่รับผิดชอบการพัฒนาอุตสาหกรรม การกระจายทรัพยากร และการฟนฟูบูรณะ โดยอาจใชชื่อวา Corporación de Fomento de la Producción de Chile"

 CHL_work_towards_laissex_faire: "มุงสูระบบเสรีนิยมไมแทรกแซง"
 CHL_work_towards_laissex_faire_desc: "เปาหมายสูงสุดของรัฐบาลเสรีนิยมคือการบรรลุเศรษฐกิจแบบปลอยใหเปนไปตามกลไกตลาด ดังนั้นเราตองทําทุกอยางที่ทําไดเพื่อบรรลุเปาหมายนี้"

 CHL_align_the_marxists: "ดึงพวกมารกซิสตมาเปนพวก"
 CHL_align_the_marxists_desc: "มีคนจํานวนมากในประเทศของเราที่มองวาโครงสรางรัฐบาลปจจุบันออนแอ แตหลายคนในนั้นสามารถถูกโนมนาวใหสนับสนุนรัฐบาลไดไมยาก หากประธานาธิบดีที่มีแนวคิดเอียงซายยื่นมือเขาหาพวกเขา"

 CHL_low_cost_housing: "ที่อยูอาศัยราคาประหยัด"
 CHL_low_cost_housing_desc: "มีคนจํานวนมากในประเทศของเราที่ไรที่อยูหรือยากจน และเราควรทําทุกวิถีทางเพื่อชวยเหลือผูโชครายเหลานี้ ซึ่งยังคงเปนประชาชนของชาติเรา ดังนั้นเราควรจัดตั้งองคกรที่อยูอาศัยแหงชาติ และกําหนดเปนนโยบายของรัฐบาลในการสรางตาขายรองรับทางสังคมที่จะโอบรับผูโชครายที่ตกตํ่าลง"

 CHL_align_the_police: "ดึงตํารวจสืบสวนมาเปนพวก"
 CHL_align_the_police_desc: "$CHL_expand_the_investigations_police_desc$"

 CHL_privatize_national_industries: "แปรรูปอุตสาหกรรมของรัฐ"
 CHL_privatize_national_industries_desc: "อุตสาหกรรมของรัฐในขณะนี้ออนแอและไรประสิทธิภาพ เราควรพยายามโอนไปอยูในมือของกลุมเอกชนที่สามารถบริหารจัดการนิคมอุตสาหกรรมทองถิ่นแตละแหงไดดีกวา"

 CHL_strengthen_instituto_nacional: "เสริมความแข็งแกรงให Instituto Nacional"
 CHL_strengthen_instituto_nacional_desc: "แมจะกอตั้งขึ้นตั้งแตสมัยปาเตรียบิเอฆา แต Instituto Nacional ควรไดรับการขยายและเสริมความแข็งแกรง เพื่อใหประชาชนของเราอานออกเขียนไดตามที่จําเปน และเพื่อใหเรากาวหนาไดในอัตราที่เปนประโยชนตอเรา"

 CHL_enact_universal_suffrage: "ประกาศใชสิทธิเลือกตั้งทั่วไป"
 CHL_enact_universal_suffrage_desc: "สิทธิในการออกเสียงเลือกตั้งคือรากฐานของสังคมประชาธิปไตยทุกสังคม และเปนเรื่องนาละอายอยางยิ่งที่ไมใชทุกคนในประเทศของเราจะลงคะแนนไดดวยสิทธิที่เทาเทียมกัน เราควรมุงสูความเสมอภาค และมอบโอกาสใหสตรีชาวชิลีไดออกเสียงเลือกตั้งโดยเร็วที่สุด"

 CHL_host_spanish_refugees: "รับผูลี้ภัยชาวสเปน"
 CHL_host_spanish_refugees_desc: "พี่นองของเราในสเปนตองตอสูกับมิตรสหายและครอบครัวของตนเอง จนจิตใจแตกสลาย บัดนี้เมื่อสงครามกลางเมืองของพวกเขาสิ้นสุดลง หลายคนตองการหนีจากระบอบปจจุบัน และในฐานะพี่นองรวมเชื้อสายสเปน เราคือตัวเลือกอันดับตน ๆ ในการรับผูลี้ภัย"

 CHL_expand_the_investigations_police: "ตํารวจสืบสวนแหงชิลี"
 CHL_expand_the_investigations_police_desc: "ตํารวจสืบสวนแหงชิลีกอตั้งขึ้นในป 1933 และเปนหนึ่งในสองหนวยงานตํารวจของชิลี ควบคูกับตํารวจรักษากฎหมาย คือ Carabineros de Chile ตํารวจสืบสวนแบงขอบเขตการสืบสวนตามประเภทอาชญากรรม โดยมีหนวยสืบสวนเฉพาะทางหลายหนวยซึ่งประกอบดวยนักสืบผูเชี่ยวชาญ"

 CHL_increase_presidential_powers: "เพิ่มอํานาจประธานาธิบดี"
 CHL_increase_presidential_powers_desc: "ประธานาธิบดีคือคนเดียวที่จําเปนตอการนําประเทศ เพราะผูนําที่เขมแข็งยอมดีกวารัฐสภาที่แตกแยกและออนแอ ประธานาธิบดีคือรัฐสภา และไมมีความจําเปนที่พวกเขาจะตองมีสวนรวมทางการเมือง"

 CHL_reapproach_america: "ฟนสัมพันธกับอเมริกา"
 CHL_reapproach_america_desc: "สหรัฐอเมริกาตัดความสัมพันธหลายดานกับเราเมื่อภาวะเศรษฐกิจตกตํ่าครั้งใหญเริ่มขึ้น และความสัมพันธของเรายังไมไดรับการแกไขอยางสมบูรณ ประธานาธิบดีและรัฐสภาจึงควรรวมมือกันฟนฟูความสัมพันธกับพวกเขาโดยเร็ว"

 CHL_return_to_the_parliamentary_era: "หวนคืนสูยุครัฐสภา"
 CHL_return_to_the_parliamentary_era_desc: "มีความจริงสากลเพียงขอเดียว นั่นคืออํานาจทําใหคนฉอฉล และอํานาจเบ็ดเสร็จยอมทําใหฉอฉลอยางเบ็ดเสร็จ เราจึงตองทําใหรัฐสภามีสิทธิ์มีเสียงมากที่สุดเทาที่จะเปนไปได เพื่อไมใหประธานาธิบดีที่วิปลาสสามารถกําหนดอนาคตทั้งหมดของชาติเราได"

 CHL_development_inwards: "พัฒนาจากภายใน"
 CHL_development_inwards_desc: "นโยบายของเราควรเปนการอยูหางจากกิจการโลกและพัฒนาประเทศจากภายใน โดยไมกลับไปพึ่งพาการสงออกมากเกินไปอีกครั้ง"

 CHL_kickstart_the_arsenal_of_democracy: "เริ่มตนคลังแสงแหงประชาธิปไตย"
 CHL_kickstart_the_arsenal_of_democracy_desc: "ดูเหมือนวาเราอาจถูกดึงเขาสูความขัดแยงครั้งใหญในอนาคตอันใกล และเพื่อไมใหเราถูกบดขยี้ในสถานการณเชนนั้น เราควรขยายองคกรอุตสาหกรรมทางทหารอยางรวดเร็ว"

 CHL_chilean_anti_communist_action: "Acción Chilena Anticomunista"
 CHL_chilean_anti_communist_action_desc: "พวกคอมมิวนิสตเปนภัยคุกคามตอชาติของเราไมนอยไปกวาภัยอื่นใด และเราตองทําทุกวิถีทางเพื่อไมใหพวกเขามีโอกาสกอการปฏิวัติที่พวกเขาปรารถนานักหนา"

 CHL_chilean_anti_communist_action_dem_version: "ปฏิบัติการตอตานคอมมิวนิสตแหงชิลี"
 CHL_chilean_anti_communist_action_dem_version_desc: "$CHL_chilean_anti_communist_action_desc$"

 CHL_organize_patriotic_leagues: "จัดตั้งสันนิบาตผูรักชาติ"
 CHL_organize_patriotic_leagues_desc: "สันนิบาตผูรักชาติเคยเปนกลุมมาเฟยฟาสซิสตที่เคยเพนพานอยูบนทองถนนในซานเตียโกและบัวโนสไอเรส เราควรพยายามฟนฟูพวกเขาขึ้นมาใหม พรอมทั้งทําใหแนใจวาพวกเขาจะภักดีตอรัฐบาลของเรา แทนที่จะทําการอยางอิสระเหมือนที่เคยเปน"

 CHL_preemtively_strike_foreign_revolutionaries: "โจมตีนักปฏิวัติตางชาติกอน"
 CHL_preemtively_strike_foreign_revolutionaries_desc: "เราอาจปกปองชาติจากภัยคุกคามคอมมิวนิสตภายในไดแลว แตภัยจากภายนอกยังคงมีอยู เราตองชิงโจมตีพวกเขากอนที่พวกเขาจะนําการปฏิวัติมาสูเรา"
 CHL_preemtively_strike_foreign_revolutionaries_tt: "ไดรับ§Yเปาหมายสงคราม§!ตั้งรัฐหุนเชิดตอชาติ§Yคอมมิวนิสต§!ทั้งหมดในอเมริกาใต"

 CHL_law_of_permanent_defense_of_democracy: "กฎหมายพิทักษประชาธิปไตยถาวร"
 CHL_law_of_permanent_defense_of_democracy_desc: "ภัยคุกคามคอมมิวนิสตไมไดแผเงาปกคลุมเพียงเรา แตปกคลุมไปทั่วโลก หากเราจะอยูรอดในสงครามเย็นที่จะเกิดขึ้นอยางแนนอน เราตองทําใหแนใจวาพวกคอมมิวนิสตไมมีทางโคนลมระบอบของเราและคุกคามประชาชนของเราได"

 CHL_law_of_permanent_defense: "การพิทักษถาวร"
 CHL_law_of_permanent_defense_desc: "$CHL_law_of_permanent_defense_of_democracy_desc$"

 CHL_promote_immigration_to_chile: "$BRA_promote_immigration_to_brazil$"
 CHL_promote_immigration_to_chile_desc: "[CHL.GetName] เปนชาติที่หลากหลาย มีผูคนซึ่งบรรพบุรุษมาจากทั่วทุกมุมโลก เมื่อเศรษฐกิจของเรากลับมาเติบโตอีกครั้งและมีทรัพยากรมากมายรอการนํามาใช ถึงเวลาแลวที่เราจะสงเสริมใหผูคนยายมาที่นี่และเรียกตนเองวาชาว[CHL.GetAdjective]ดวยเชนกัน"

 CHL_socialist_youth: "องคกรเยาวชนสังคมนิยม"
 CHL_socialist_youth_desc: "เยาวชนจํานวนมากถูกปลุกปนใหหัวรุนแรงไปทางซายและขวา โดยเฉพาะฝายสังคมนิยมที่สงเสียงดังและมีความมุงมั่นในการปกปองคุณคาของตน พวกเขาจึงพรอมที่จะตอสูกับทุกผูที่คุกคามรัฐอันยิ่งใหญของเรา"

 CHL_counter_operation_bolivar: "ตอตานปฏิบัติการโบลิวาร"
 CHL_counter_operation_bolivar_desc: "เยอรมนีกําลังพยายามแผอิทธิพลเหนือชาติตาง ๆ ในอเมริกาใตดวยการจารกรรมและการกอวินาศกรรมในปฏิบัติการโบลิวารอันชั่วราย เราควรทําทุกวิถีทางเพื่อตอบโตความพยายามของพวกเขา"

 CHL_strike_down_south_american_fascism: "ปราบปรามฟาสซิสตในอเมริกาใต"
 CHL_strike_down_south_american_fascism_desc: "มีผูคนมากมายในอเมริกาใตที่หลงใหลในลัทธิฟาสซิสต และเราตองทําใหแนใจวาไมมีใครในภูมิภาคนี้คุกคามความมั่นคงของเรา ซึ่งทําใหการอยูรวมกับพวกเขาเปนเรื่องยาก เราจึงตองปราบพวกเขากอนที่พวกเขาจะคิดทํารายเราดวยซํ้า"

 CHL_land_reforms: "การปฏิรูปที่ดิน"
 CHL_land_reforms_desc: "ระบบ Hacienda - Inquilinaje ลาสมัยอยางยิ่ง และกอใหเกิดความแตกแยกอยางรุนแรงระหวางชนชั้นในสังคมของเรา เราตองมุงมั่นกระจายที่ดินของพวก Hacendado และยุติระบบทาสติดที่ดินอันโหดรายนี้ใหสิ้นซาก!"

 CHL_support_the_democracies: "สนับสนุนชาติประชาธิปไตย"
 CHL_support_the_democracies_desc: "ชาติประชาธิปไตยในยุโรปและอเมริกากําลังประสบปญหา และเปนหนาที่ของเราในฐานะชาติประชาธิปไตยดวยกันที่จะชวยเหลือพวกเขาดวยทุกวิถีทาง เราจึงตองสงชาวชิลีไปปกปองผลประโยชนของมิตรประชาธิปไตยของเรา"

 CHL_mapuche_reconcilliation_campaigns: "การรณรงคสรางความปรองดองกับชาวมาปูเช"
 CHL_mapuche_reconcilliation_campaigns_desc: "ชาวมาปูเชถูกรัฐบาลของเราปฏิบัติอยางไมเปนธรรมมาโดยตลอดนับตั้งแตการพิชิตอาราอูกาเนียในศตวรรษที่ 19 เราตองกาวหนาอยางมากในการปรับปรุงสถานการณของพวกเขา และทําใหพวกเขาอยูอยางสันติรวมกับพลเมืองชิลีคนอื่น ๆ"

 CHL_an_attempt_to_maintain_our_neutrality: "ความพยายามรักษาความเปนกลาง"
 CHL_an_attempt_to_maintain_our_neutrality_desc: "ชาติตาง ๆ มากมายที่เขารวมความขัดแยงระดับโลกตองการดึงเราเขาสูสงครามที่เกิดจากการทะเลาะเบาะแวงอันไรสาระของพวกเขา เราตองทําทุกวิถีทางเพื่ออยูหางจากความขัดแยงนี้ และไมยื่นจมูกเขาไปยุงในความขัดแยงที่เราไมควรมีสวนรวม"

 CHL_embargo_strategies: "ยุทธศาสตรการควํ่าบาตร"
 CHL_embargo_strategies_desc: "การสนับสนุนมิตรประชาธิปไตยของเรามีหลายวิธีมากกวาแคการสงทหารไปรบ และกาลเวลาไดพิสูจนแลววามาตรการทางเศรษฐกิจก็ทรงพลังไมแพกัน นั่นคือเหตุผลที่เราควรควํ่าบาตรศัตรูของมิตรเรา เพื่อตัดพวกเขาจากทองแดงและดินประสิวที่พวกเขาตองใชในการทําสงคราม"
 CHL_embargo_strategies_tt: "เราจะ§Yควํ่าบาตร§!ทุกชาติที่ทําสงครามกับชาติ§Yประชาธิปไตย§!ที่เปนมหาอํานาจของโลก"

 CHL_enact_stricter_labor_laws: "ตรากฎหมายแรงงานที่เขมงวดขึ้น"
 CHL_enact_stricter_labor_laws_desc: "กฎหมายแรงงานในปจจุบันหละหลวมเกินไปสําหรับสังคมประชาธิปไตยที่ดี และเราควรทําใหแนใจวาบรรษัทและนายทุนไมสามารถเอารัดเอาเปรียบชนชั้นแรงงานผูยากไรของชิลีได เพื่ออนาคตที่เทาเทียมยิ่งขึ้น!"

 CHL_found_national_steelworks: "กอตั้งโรงถลุงเหล็กแหงชาติ"
 CHL_found_national_steelworks_desc: "ประเทศกําลังตองการเหล็กกลาอยางยิ่ง และนักสํารวจของเราพบวาภูมิภาคอาราอูกาเนียอันอุดมสมบูรณมีสิ่งนั้นอยู เราจึงควรพยายามกอตั้งโรงถลุงเหล็กแหงใหมเพื่อใชประโยชนจากทรัพยากรของชาติที่เรามีอยู"

 CHL_found_the_contraloria_general_de_la_republica: "กอตั้ง Contraloría General de la República"
 CHL_found_the_contraloria_general_de_la_republica_desc: "สํานักงานผูควบคุมบัญชีแผนดินแหงชิลีจะเปนองคกรอิสระตามรัฐธรรมนูญของรัฐบาลชิลี มีหนาที่ควบคุมดานกฎหมาย การบริหาร การตรวจสอบกอนและหลังการดําเนินงานของกิจกรรมทั้งหมดของราชการพลเรือนทั้งสวนกลางและสวนภูมิภาค ไมวาจะมีรูปแบบองคกรเชนใด รวมถึงอํานาจอื่น ๆ ที่กฎหมายกําหนด"

 CHL_establish_the_ministry_of_mining: "จัดตั้งกระทรวงเหมืองแร"
 CHL_establish_the_ministry_of_mining_desc: "เราควรกอตั้งกระทรวงระดับชาติที่รับผิดชอบการทําเหมืองของประเทศดวย เพื่อใหเราควบคุมไดจากสวนกลางวาจะเปดเหมืองที่ใดและบริหารอยางไร"

 CHL_the_nationalization_of_copper: "การโอนกิจการทองแดงเปนของรัฐ"
 CHL_the_nationalization_of_copper_desc: "แหลงทองแดงอันกวางใหญในประเทศของเราปจจุบันอยูในการควบคุมของบริษัทเหมืองแรเอกชน และเราควรทําใหแหลงแรเหลานี้ตกอยูในมือที่มีเหตุผลกวา นั่นคือรัฐบาลและกระทรวงเหมืองแรของเรา"

 CHL_enforce_stricter_secularism: "บังคับใชหลักฆราวาสนิยมอยางเขมงวดขึ้น"
 CHL_enforce_stricter_secularism_desc: "เราไดวางหลักฆราวาสนิยมไวในรัฐธรรมนูญเสรีนิยมแลว แตศาสนจักรยังคงมีอํานาจอยางมากเหนือทั้งประชาชนและนักการเมืองบางคน เราจึงควรเรียกรองใหทุกคนที่ตองการมีสวนรวมทางการเมืองแยกตัวออกจากศาสนาเมื่ออยูในเวทีการเมือง"

 CHL_repeal_the_separation_of_church_an_state: "ยกเลิกการแยกศาสนจักรออกจากรัฐ"
 CHL_repeal_the_separation_of_church_an_state_desc: "การแยกศาสนจักรออกจากรัฐเปนความผิดพลาดรายแรง และตองถูกแกไขโดยเร็วที่สุด ศาสนจักรเปนพันธมิตรของเรา ดังที่เราทุกคนรูดี"

 CHL_a_joint_application_to_the_allies: "รวมยื่นสมัครเขาฝายสัมพันธมิตร"
 CHL_a_joint_application_to_the_allies_desc: "เราและอารเจนตินามีความสัมพันธที่ดีพอกับฝายสัมพันธมิตรมาแตเกากอน และในที่สุดก็ถึงเวลาที่จะเขารวมกับพวกเขาและรวมมือกันเพื่ออนาคตที่สดใสกวา"

 CHL_dispute_over_tierra_del_fuego: "ขอพิพาทเหนือเตียรราเดลฟวยโก"
 CHL_dispute_over_tierra_del_fuego_desc: "รัฐบาลอารเจนตินายังคงอางสิทธิ์ในครึ่งตะวันออกของเตียรราเดลฟวยโกวาเปนของตน ทั้งที่ไมมีแผนดินเชื่อมตอ และเรามีการอางสิทธิ์ที่เกาแกและชอบธรรมกวาอยางชัดเจน เราตองเคลื่อนไหวเพื่อยึดครองดินแดนนี้ทันที"

 CHL_protect_the_easter_island: "ปกปองเกาะอีสเตอร"
 CHL_protect_the_easter_island_desc: "เกาะอีสเตอร ซึ่งคนทองถิ่นเรียกวาราปานูอี ถูกพวกฟาสซิสตทางตะวันตกคุกคามอยูเสมอ เราตองไมเพียงเสริมปอมปราการบนเกาะและพัฒนาทาเรือ แตยังตองชิงโจมตีทุกผูที่อางสิทธิ์ในมหาสมุทรแปซิฟกกอนดวย"

 form_country_south_america_required_states_tt: "§Y[ROOT.GetName]§! ควบคุม§Yรัฐบนแผนดินใหญ§!ทั้งหมดใน§Yอเมริกาใต§!"
 CHL_joint_research_initiatives_tt: "§Yชิลี§! และทุกประเทศที่อยูในฝายเดียวกับเรา จะเขารวม§Yกลุมแบงปนเทคโนโลยี§!"

 CHL_the_future_of_Chile: "อนาคตของ [CHL.GetName]"
 CHL_the_future_of_Chile_desc: "พรรคคอมมิวนิสตตองประชุมกันเพื่อตัดสินเสนทางที่จะเดินในปตอ ๆ ไป เนื่องจากแนวรวมขนาดใหญในปจจุบันไมสามารถเห็นพองกันไดในทุกประเด็น ขณะนี้ตัวเลือกอยูระหวางเอเลียส ลาเฟรเต กาบีโน ผูเปนมารกซิสต มารมาดุก โกรฟ บาเยโค ผูเปนสังคมนิยม การโลส คอนเตรราส ลาบารกา ผูเปนสตาลินนิสต และมานูเอล อิดัลโก ปลาซา ผูเปนทรอตสกีสต"

 CHL_support_for_the_international_revolution: "สนับสนุนการปฏิวัติสากล"
 CHL_support_for_the_international_revolution_desc: "มีผูคนมากมายที่ตองตอสูไมเพียงกับชาติตางชาติที่รุกรานบานเกิดของพวกเขา แตยังตองตอสูกับรัฐบาลและอุตสาหกรรมที่ฉอฉลซึ่งพรากการทํามาหากินของพวกเขาไป เราตองทําทุกอยางเทาที่ทําไดเพื่อใหผูคนทั่วโลกรูสึกปลอดภัยและไดรับการปกปองจากความชั่วราย"

 CHL_sponsor_american_revolutions: "อุปถัมภนักปฏิวัติในทวีปอเมริกา"
 CHL_sponsor_american_revolutions_desc: "มีผูคนมากมายที่มีศักยภาพจะทําการปฏิวัติสําเร็จหากไดลองทํา แตขาดทุนทรัพยหรืออาวุธที่จะทําใหบรรลุเปาหมาย เราจึงควรอุปถัมภนักปฏิวัติเหลานี้ และขับไลทุนนิยมออกไปจากอเมริกาใต"
 CHL_sponsor_american_revolutions_tt: "ปลดล็อกการตัดสินใจ §Yอุปถัมภการชุมนุมทางอุดมการณ§! ในประเทศอื่น ๆ ใน§Yอเมริกาใตและอเมริกาเหนือ§!"

 CHL_union_of_hispanic_republics: "สหภาพสาธารณรัฐฮิสแปนิก"
 CHL_union_of_hispanic_republics_desc: "บัดนี้เมื่อชาวฮิสแปนิกทั้งหมดรวมเปนหนึ่งภายใตธงผืนเดียว ถึงเวลาแลวที่เราจะแสดงใหโลกเห็นวาเราทําอะไรไดบาง และเราตั้งใจจะปลดปลอยประชาชนของเราที่ยังตกอยูใตการปกครองของจักรวรรดินิยมตางชาติ"

 CHL_propose_closer_cooperation: "เสนอความรวมมือที่ใกลชิดขึ้น"
 CHL_propose_closer_cooperation_desc: "รัฐคอมมิวนิสตรอบตัวเราอาจมีอุดมการณเดียวกับเรา แตพวกเขากระจัดกระจายในเชิงยุทธศาสตรและไมมีการประสานงาน เราควรนําพวกเขามาอยูใตปกของเราและชวยชี้นําพวกเขาใหดีขึ้น"

 CHL_nationalize_foreign_industries: "โอนอุตสาหกรรมตางชาติเปนของรัฐ"
 CHL_nationalize_foreign_industries_desc: "พวกนายทุนที่ยังเหลืออยูในประเทศของเราคงกําลังเหงื่อตก เมื่อตระหนักวากาวตอไปของเราคืออะไร เราตองยึดทรัพยสินทุกอยางที่พวกเขาครอบครอง และกระจายคืนสูประชาชน"

 CHL_align_with_the_russian_soviet: "ผูกมิตรกับ[SOU.GetNameDef]"
 CHL_align_with_the_russian_soviet_desc: "[SOU.GetNameDefCap]เปนสหายทางอุดมการณที่ใกลชิด เราควรเขาหาพวกเขาพรอมขอเสนอความชวยเหลือซึ่งกันและกันเพื่อแลกกับการเขารวม [SOU.GetFactionName]"

 CHL_hub_of_the_world_revolution: "ศูนยกลางการปฏิวัติโลก"
 CHL_hub_of_the_world_revolution_desc: "มีนักปฏิวัติมากมายที่ไมพอใจกับสภาพของโลกในปจจุบัน และที่สําคัญกวานั้น อาจผิดหวังกับสภาพของสหภาพโซเวียต เราควรมุงมั่นสรางโลกที่ยิ่งใหญกวา ไปดวยกัน!"
 CHL_hub_of_the_world_revolution_tt: "ที่ปรึกษาคอมมิวนิสตจากประเทศอื่นจะยายมาสังกัด [CHL.GetName] ตามสถานการณทางการเมืองของประเทศบานเกิด ขณะนี้ที่ปรึกษาตอไปนี้จะยายมาสังกัด [CHL.GetName]:"

 CHL_joint_development_programs: "โครงการพัฒนารวม"
 CHL_joint_development_programs_desc: "บัดนี้เมื่อเราเปนพันธมิตรกันแลว เราควรรวมกันสรางโรงงานใหมเพื่อพัฒนาประเทศของแตละฝายใหดียิ่งขึ้น"

 CHL_joint_research_initiatives: "โครงการวิจัยรวม"
 CHL_joint_research_initiatives_desc: "บัดนี้เมื่อเราเปนพันธมิตรกันแลว เราควรรวมกันจัดตั้งหองปฏิบัติการและโครงการความรวมมือดานการวิจัย เพื่อพัฒนาอาวุธใหลํ้าหนากวาที่พวกนายทุนและจักรวรรดินิยมของโลกจะทําได"

 CHL_one_more_fascist_focus_done_tt: "§Gลด§!ผลเสียจากรัฐประหารลง\n การสนับสนุนสงคราม: §G+5%§!\n เสถียรภาพ: §G+5%§!"
 CHL_commence_the_counter_revolution_negative_tt: "สูญเสียการสนับสนุนสงครามและเสถียรภาพตามจํานวน§Yแผนยุทธศาสตรการเตรียมการ§!ที่ดําเนินการไปกอนหนานี้"
 CHL_propose_closer_cooperation_tt: "สงเหตุการณไปยัง§Yชาติคอมมิวนิสต§!ทั้งหมดใน§Yอเมริกาใตและอเมริกากลาง§! เพื่อเรียกรองใหยอมสยบตอเรา"
 CHL_sway_ariosto_hererra_tt: "§Yอาริโอสโต เอรเรรา§! และคนของเขาจะเขารวมรัฐประหารกับเรา"
 CHL_proliferate_national_populism_tt: "เมื่อดําเนินแผนยุทธศาสตร §Yเริ่มการตอตานการปฏิวัติ§! เสร็จสิ้น:\nอํานาจทางการเมือง §G+75§!"
 CHL_more_funds_or_the_propaganda_department_tt: "เมื่อดําเนินแผนยุทธศาสตร §Yเริ่มการตอตานการปฏิวัติ§! เสร็จสิ้น:\nกําลังพล §G+5000§!"
 CHL_recruit_young_officers_tt: "นายทหารหนุมบางคนจะไดรับการเลื่อนยศเปน§Yนายพล§!"
 CHL_enforce_the_chilean_identity_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$CHL_ancestral_mapuche_resistance$§! ถูกลบออก จะไดดินแดนหลักใน [950.GetName] คืน"
 CHL_expand_the_department_of_provinces_change_tt: "ปรับเปลี่ยน§Yจิตวิญญาณแหงชาติ§!ที่ไดรับกอนหนานี้ โดยมีผลแตกตางกันเล็กนอยขึ้นอยูกับวา§Yกรม§!ใดไดรับการเสริมความแข็งแกรงไปกอนหนานี้"
 CHL_expand_the_department_of_provinces_coring_tt: "ปลดล็อกการตัดสินใจ §Yผนวกรวมรัฐ§! ที่ถูกอางสิทธิ์โดยกลุมชาตินิยมทวงดินแดนชิลี"
 CHL_abide_by_the_francoist_model_tt: "เราจะ§Rไมสามารถเขารวมฝายไดอีกตอไป§!"
 CHL_hipanic_alliance_faction: "พันธมิตรฮิสแปนิก"
 CHL_undo_colonialist_occupations_tt: "ปลดล็อกการตัดสินใจ §Yยึดครองเบลีซและคลองปานามา§!"
 CHL_press_our_demands_tt: "สงขอเรียกรองไปยังผูยึดครองกายอานาอยางผิดกฎหมาย เพื่อ§Yบังคับใชกรรมสิทธิ์ของเรา§!เหนือรัฐเหลานั้น"
 CHL_the_latin_american_alliance_tt: "เชิญชาติ§Yละตินอเมริกาที่ไมใชฮิสแปนิก§!เขารวมฝายของเรา"
 CHL_sponsor_anti_colonialist_rebellions_tt: "ปลดล็อกการตัดสินใจเพื่อเพิ่มการตอตานในรัฐอาณานิคมใน§Yอเมริกาใตและอเมริกากลาง§!"

 CHL_empower_the_preparation_department: "เสริมอํานาจกรมเตรียมการ"
 CHL_empower_the_preparation_department_desc: "เพื่อใหรัฐประหารของเราดําเนินไปอยางราบรื่นที่สุด เราไมเพียงตองไดรับการสนับสนุนจากประชาชนทั่วไป แตยังตองเตรียมคน แผนการ และการสงกําลังบํารุงใหพรอมสําหรับวันที่จะมาถึงในที่สุด"

 CHL_sway_ariosto_hererra: "โนมนาวอาริโอสโต เอรเรรา"
 CHL_sway_ariosto_hererra_desc: "นายพลอาริโอสโต เอรเรรา แสดงใหเห็นวามีความรูสึกตอตานสังคมนิยมอยางแรงกลา แตเขาไมไดภักดีตอเราเสมอไป จะเปนการดีหากเราไดรับการสนับสนุนจากเขาและคนที่ภักดีที่สุดของเขา เพราะเรายอมใชประโยชนจากคนอยางเขาในหมูพวกเราไดอยางแนนอน"

 CHL_inflitrate_the_carabinieros: "แทรกซึม Carabineros"
 CHL_inflitrate_the_carabinieros_desc: "Carabineros de Chile มีหนาที่ปกปองประเทศจากผูกอการกําเริบทุกกลุม ซึ่งรวมถึงพวกเราดวย หากเราตอตานพวกเขา ยอมกลายเปนการนองเลือดอยางแนนอน แตหากเราไดรับความภักดีจากพวกเขา พวกเขาจะกลายเปนเบี้ยที่มีประโยชนอยางยิ่ง"

 CHL_unify_the_fascist_movements: "รวมขบวนการฟาสซิสตเปนหนึ่ง"
 CHL_unify_the_fascist_movements_desc: "แมฆอรเฆ กอนซาเลซ ฟอน มาเรส จะควบคุม Movimiento Nacional-Socialista de Chile ไดอยางมั่นคง แตยังมีกลุมอื่นที่มีแนวคิดคลายกันซึ่งไมไดติดตามเขา ควรเรงเราใหเขานําขบวนการแนวหนาที่รวมกลุมฟาสซิสตชิลีทั้งหมดไวดวยกัน เพื่อใหรัฐประหารประสบความสําเร็จ"

 CHL_proliferate_national_populism: "เผยแพรลัทธิประชานิยมชาตินิยม"
 CHL_proliferate_national_populism_desc: "ประชาชนพลเรือนมีความสําคัญไมแพสิ่งใด โดยเฉพาะหากเราตองการสรางเสถียรภาพใหรัฐหลังรัฐประหาร เราตองไดรับการสนับสนุนจากพวกเขา แมจะตองใชวิธีลับ ๆ ลอ ๆ ก็ตาม!"

 CHL_more_funds_or_the_propaganda_department: "เพิ่มงบประมาณใหกรมโฆษณาชวนเชื่อ"
 CHL_more_funds_or_the_propaganda_department_desc: "กรมโฆษณาชวนเชื่อของเราทํางานหนักเกินเวลาเพื่อโนมนาวประชาชนวาเราคือผูกอบกูของพวกเขา แตพวกเขาจะรักษาประสิทธิภาพไวไมไดหากเราไมใหเงินทุน เราตองฟอกเงินผานนักการเมืองที่ฉอฉลเพื่อเตรียมการรัฐประหาร"

 CHL_request_foreign_support: "ขอการสนับสนุนจากตางชาติ"
 CHL_request_foreign_support_desc: "มีหลายประเทศที่ถูกควบคุมโดยผูมีแนวคิดทางอุดมการณคลายกับเราอยูแลว และการผูกมิตรกับพวกเขาอาจเปนทางเลือกที่ชาญฉลาด ดวยวิธีนี้ เราสามารถขออาวุธและทหารจากพวกเขาเพื่อชวยเรากอรัฐประหาร"

 CHL_the_popular_freedom_alliance: "พันธมิตรเสรีภาพประชาชน"
 CHL_the_popular_freedom_alliance_desc: "มีบางคนในประเทศที่มีอุดมการณเดียวกับเรา แตไมกลาออกมาพูดอยางเปดเผย เราจึงควรโนมนาวนายพลการโลส อิบาเญซ เดล กัมโป ใหนําแนวรวมใหม คือ Alianza Popular Libertadora ซึ่งดึงดูดผูยึดถือคุณคาแบบอนุรักษนิยม แตแอบหนุนหลังเราอยางลับ ๆ"

 CHL_rally_the_people: "ปลุกระดมประชาชน"
 CHL_rally_the_people_desc: "รัฐประหารไดรับการเตรียมการพรอมแลว สิ่งเดียวที่ตองทําตอนนี้คือปลุกเราประชาชน และประกาศใหรัฐบาลเสรีนิยมรูวาเวลาของพวกเขาใกลหมดลงแลว ถึงเวลาที่เราจะยุติรัฐอันนาสมเพชนี้!"

 CHL_commence_the_counter_revolution: "เริ่มการตอตานการปฏิวัติ"
 CHL_commence_the_counter_revolution_desc: "ทหารของเรายืนพรอมและรอคําสั่งอยางกระตือรือรน พรอมเขายึดตําแหนงสําคัญทุกแหงในซานเตียโก รวมถึงศาลาวาการในเมืองอื่น ๆ สิ่งเดียวที่ตองทําตอนนี้คือดําเนินแผน แลวรอดูวาเมื่อทุกอยางจบลง เราไดรับการสนับสนุนจากประชาชนจริง ๆ มากเพียงใด"

 CHL_promote_broad_anti_americansim: "สงเสริมกระแสตอตานอเมริกาในวงกวาง"
 CHL_promote_broad_anti_americansim_desc: "พวกอเมริกันมันเลวทั้งนั้น พวกมันสูบเลือดเราจนซีดขาว พวกมันเอาทุกอยางที่เรามีไปราวกับเปนสิทธิ์ของมัน และเราไมไดอะไรตอบแทนเลยแมพวกมันจะโวยวายมากมายแคไหน พวกอเมริกันเคยทําอะไรใหเราบาง? ขอถามอีกครั้ง พวกอเมริกันเคยทําอะไรใหเราบาง!?"

 CHL_ban_liberalism: "สั่งหามลัทธิเสรีนิยม"
 CHL_ban_liberalism_desc: "แมเราจะขับไลพวกเสรีนิยมออกจากรัฐบาลแลว แตพวกเขายังคงอยู เหมือนเม็ดทรายที่นับไมถวน เราตองปราบปรามกลุมของพวกเขา และทําใหแนใจวาพวกเขาจะไมมีวันมีอํานาจมากพอจะคุกคามการปกครองของเรา"

 CHL_recruit_young_officers: "รับสมัครนายทหารหนุม"
 CHL_recruit_young_officers_desc: "นายพลจํานวนมากที่ดํารงตําแหนงสูงในประเทศของเรามีแนวคิดเอียงซาย และเกือบทั้งหมดไดยื่นใบลาออกแลวหลังจากที่เราเขายึดอํานาจ เราควรเลื่อนตําแหนงนายทหารหนุมผูรักชาติและคลั่งอุดมการณบางคนขึ้นมาจากในกองทัพ ใหมาแทนที่ผูบังคับบัญชาเกาที่เสื่อมทราม"

 CHL_enforce_the_chilean_identity: "หลอมสรางอัตลักษณชิลีใหม"
 CHL_enforce_the_chilean_identity_desc: "ในสภาพปจจุบัน ชาวชิลีแตกแยกกัน และเราตองทําบางอยางเพื่อรวมพวกเขาไวใตธงของเรา สเปน มาปูเช ชิลี พวกเขาไมตางกัน เพราะทุกคนลวนเปนพลเมืองของเรา และเปนหนึ่งเดียวกัน บางคนอาจปฏิเสธสารของเรา แตโดยรวมแลวอัตลักษณชิลีใหมนาจะเปนที่พอใจของคนสวนใหญ"

 CHL_cooperate_with_operation_bolivar: "รวมมือกับปฏิบัติการโบลิวาร"
 CHL_cooperate_with_operation_bolivar_desc: "อยางไรก็ตาม ชาวเยอรมันไดทําหลายสิ่งเพื่อเรา ในยามที่เราตองการมากที่สุด ผูตั้งถิ่นฐานชาวเยอรมันไดยายมาบุกเบิกอาราอูกาเนีย และบัดนี้พวกเขาตองการความชวยเหลือในการรับมือกับพวกอเมริกัน เปนหนาที่ของเราที่จะชวยเหลือพวกเขา และตอบแทนบุญคุณที่เราติดคางอยู"

 CHL_abide_by_the_francoist_model: "ยึดตามแบบอยางของฟรังโก"
 CHL_abide_by_the_francoist_model_desc: "แมชาวเยอรมันอาจมีอิทธิพลอยางมาก แตสิ่งที่ขบวนการของเราตองพิจารณาจริง ๆ คือแนวคิดของนักคิดแถบเมดิเตอรเรเนียนอยางมุสโสลินีและฟรังโก แบบอยางของพวกเขาคือสิ่งที่เราควรเดินตาม และอุดมการณของพวกเขาคือสิ่งที่เราควรรับมาเปนของเรา"

 CHL_host_german_intelligence: "ตอนรับหนวยขาวกรองเยอรมัน"
 CHL_host_german_intelligence_desc: "ในปฏิบัติการโบลิวาร ชาวเยอรมันพยายามสอดแนมพวกอเมริกันจากทางใต และเราอาจใหขอมูลที่นาสนใจแกพวกเขาไดมากมาย ตราบใดที่พวกเขาสงสายลับมาประจําการและให Abwehr ทํางานใกลชิดกับรัฐบาลของเรามากขึ้น"

 CHL_militarize_the_state: "ทําใหรัฐเปนรัฐทหาร"
 CHL_militarize_the_state_desc: "แมเราจะเคยชนะสงครามใหญมาแลว แตประเทศของเราในปจจุบันยังไมพรอมสําหรับความขัดแยงขนาดใหญอีกครั้ง เราจึงตองเสริมสรางรัฐใหเปนรัฐทหารกอน หากเราตองการใหกองกําลังของเรากลับมาพรอมรบอีกครั้ง"

 CHL_the_spirit_of_the_war_of_the_pacific: "จิตวิญญาณแหงสงครามแปซิฟก"
 CHL_the_spirit_of_the_war_of_the_pacific_desc: "หากเราตองการปลุกขวัญทหารของเรา เราควรเตือนใหพวกเขาระลึกถึงความสําเร็จอันยิ่งใหญในสงครามแปซิฟกที่รบกับเปรูและโบลิเวีย เรายังสามารถใชโอกาสนี้ยืนยันการอางสิทธิ์ในพื้นที่บางแหงที่พันธมิตรเยอรมันของเราอาจยินดีมอบให"

 CHL_syndicalize_the_production_sector: "จัดภาคการผลิตเปนระบบสหการ"
 CHL_syndicalize_the_production_sector_desc: "ภาคการผลิตในปจจุบันเต็มไปดวยความไรประสิทธิภาพและพวก Hacendado ใจโหดที่คิดถึงแตผลกําไรของตน เราควรจัดอุตสาหกรรมเปนระบบสหการ และนํารูปแบบอุตสาหกรรมบรรษัทนิยมแบบฟาลังเฮที่แทจริงมาใช"

 CHL_expand_the_mountain_regiments: "ขยายกรมทหารภูเขา"
 CHL_expand_the_mountain_regiments_desc: "กองกําลังชั้นยอดที่สุดของเราคือกรมทหารภูเขาเฉพาะทาง ซึ่งพรอมสําหรับการรบอันโหดรายในทุกที่ทั่วประเทศ เราควรบังคับใหนายพลของเราหมุนเวียนมาฝกกับทหารเหลานี้ และจัดหายุทโธปกรณพิเศษใด ๆ ที่พวกเขาอาจตองการ"

 CHL_departemento_de_las_tropas_nacistas_de_asalto: "Departamento de las Tropas de Asalto"
 CHL_departemento_de_las_tropas_nacistas_de_asalto_desc: "กรมทหารจูโจมนาซิสตาของเราควรไดรับการปลุกขวัญและเสริมความแข็งแกรง เราควรทําใหพวกเขาดํารงไวซึ่งจิตวิญญาณของทหารจูโจมแหงมหาสงคราม และติดอาวุธใหเหมาะสม"

 CHL_departamento_de_la_juventad_nacista: "Departamento de la Juventud Nacista"
 CHL_departamento_de_la_juventad_nacista_desc: "ประเทศอื่นอยางเยอรมนีประสบความสําเร็จในการทําใหเยาวชนเปนทหาร และเราก็ควรทําเชนเดียวกัน เพราะเราตองการกําลังคนในสนามรบมากขึ้น และตองการตอนนี้"

 CHL_expand_the_department_of_provinces: "ขยายกรมการจังหวัด"
 CHL_expand_the_department_of_provinces_desc: "กรมการจังหวัดทํางานหนักเกินเวลาเพื่อควบคุมทุกภูมิภาคของชิลีใหอยูในระเบียบ แตหากเราสนับสนุนและขยายกรมนี้อยางเต็มที่ เราจะใชมันบริหารแมแตดินแดนตางชาติไดอยางมีประสิทธิภาพยิ่งขึ้น"

 CHL_revoke_the_treaty_of_lima: "เพิกถอนสนธิสัญญาลิมา"
 CHL_revoke_the_treaty_of_lima_desc: "สนธิสัญญาลิมาป 1929 ที่คืนภูมิภาคตักนาใหเปรูนั้นไรความชอบธรรม และไมมีคําอธิบายอื่นใดนอกจากวาเราถูกบีบบังคับในเรื่องนี้ ถึงเวลาที่เราจะทําสิ่งที่ถูกตอง และเรียกรองดินแดนนั้นคืน"

 CHL_demand_the_fireland: "ทวงดินแดนแหงไฟ"
 CHL_demand_the_fireland_desc: "เตียรราเดลฟวยโกเปนของเราโดยชอบธรรม และอารเจนตินาไมมีความชอบธรรมใดในการครอบครอง เพราะพวกเขาไมไดมีแผนดินเชื่อมตอดวยซํ้า เราควรใหความมั่นใจกับประชาชนวาเราไมมีเจตนาราย และฉีกภูมิภาคนี้ออกจากเงื้อมมือของอารเจนตินา"

 CHL_escalate_the_laguna_del_desierto_issue: "ยกระดับปญหาลากูนาเดลเดซิเอรโต"
 CHL_escalate_the_laguna_del_desierto_issue_desc: "การปกปนเขตแดนรอบลากูนาเดลเดซิเอรโตไมชัดเจนอยางยิ่ง และยังเขาขางชาวอารเจนตินาดวย เราควรเคลื่อนไหวเขายึดครองสวนของภูมิภาคที่เปนของเราโดยชอบธรรม และอาจรุกไปไกลกวานั้นอีกสักหนอย"

 CHL_demand_demilitarization_of_patagonia: "การปลอดทหารในปาตาโกเนีย"
 CHL_demand_demilitarization_of_patagonia_desc: "ชาวอารเจนตินายังคงคุกคามประชาชนของเราดวยการคงกําลังทหารในปาตาโกเนียอยางตอเนื่อง ถึงเวลาแลวที่เราจะขอใหพวกเขาปลอยเราไวตามลําพัง และสัญญาวาจะไมสงทหารเขามาในภูมิภาคนี้"

 CHL_enter_patagonia: "บุกเขาปาตาโกเนีย"
 CHL_enter_patagonia_desc: "หากชาวอารเจนตินาเชื่อเราแมเพียงชั่ววินาที ก็เปนขอพิสูจนวาเราหลอกพวกเขาไดและทําใหพวกเขาหวาดหวั่น ถึงเวลาที่ทหารของเราจะบุกเขาปาตาโกเนีย และโจมตีอยางหนักกอนที่พวกเขาจะรูตัววาโดนอะไรเขา"

 CHL_controlled_education: "การศึกษาภายใตการควบคุมเขมงวด"
 CHL_controlled_education_desc: "หากเด็ก ๆ จะเติบโตขึ้นอยางถูกตองและคิดในแบบที่เราตองการ เราตองทําใหการศึกษาของพวกเขาเปนไปตามมาตรฐานและระเบียบที่เราวางไวเพื่อหลอหลอมพวกเขาใหเปนพลเมืองตนแบบ"

 CHL_promote_pan_hispanic_rhetoric: "สงเสริมวาทกรรมลัทธิรวมฮิสแปนิก"
 CHL_promote_pan_hispanic_rhetoric_desc: "เราทุกคนตางเปนปจเจกบุคคล แตถึงกระนั้น เราก็เปนหนึ่งเดียวกันทั้งในจิตวิญญาณและสายเลือดในฐานะชาวฮิสแปนิก ถึงเวลาแลวที่เราจะทวงสิทธิ์โดยกําเนิดของเรา และโคนลมจักรวรรดินิยมทุกรายที่พยายามแบงแยกประชาชนของเรา"

 CHL_military_excercises: "การซอมรบ"
 CHL_military_excercises_desc: "กองทัพยังไมพรอมรบอยางเต็มที่ และตองไดรับการฝกอยางหนักกอนจึงจะมีประโยชนเมื่อวันแหงการรวมชาติฮิสแปนิกมาถึง"

 CHL_cultivate_fanaticism: "ปลูกฝงความคลั่งอุดมการณ"
 CHL_cultivate_fanaticism_desc: "หากปราศจากการรวมชาติ ผูคนในอเมริกาใตและอเมริกากลางก็ไรอนาคต และทุกคนตองรับรูเรื่องนี้ หากเราไมลุกขึ้นตอตานพวกอเมริกันในตอนนี้ เราจะตกอยูในเงื้อมมือแหงการบงการและจักรวรรดินิยมของพวกเขาอยางแนนอน เกียรติคือสิ่งที่ทําใหเปนชาวฮิสแปนิก และความดุดันคือสิ่งที่ทุกผูที่ตอตานเราจะไดลิ้มรส"

 CHL_the_path_to_conquest: "รวมชาติดวยการพิชิต"
 CHL_the_path_to_conquest_desc: "การพิชิตอันรุงโรจน ดั่งเหลาคอนกิสตาดอรในอดีต คือสิ่งที่จะรวมประชาชนของเราเขาดวยกัน เพราะพวกเขาอยูใตการควบคุมของรัฐบาลชาตินิยมที่เห็นแกตัวและคับแคบ ซึ่งมองไมเห็นภาพใหญที่ตนเปนสวนหนึ่ง เราตองปลดปลอยชาวฮิสแปนิกดวยกําลัง!"
 CHL_hispanic_supremacy_pact_faction: "สันนิบาตความเปนใหญแหงฮิสแปนิก"

 CHL_the_hispanic_alliance: "พันธมิตรฮิสแปนิก"
 CHL_the_hispanic_alliance_desc: "ประชาชนของเราควรเปนหนึ่งเดียวกัน ไมใชในฐานะรัฐเดียว แตในมิตรภาพและความรวมมือ และมีเพียงผานพันธมิตรเทานั้นที่สหภาพรวมฮิสแปนิกจะดํารงอยูได เราควรติดตอทุกผูที่มีอุดมการณเดียวกับเรา และไดรับความภักดีของพวกเขาตออุดมการณนี้"

 CHL_the_latin_american_alliance: "พันธมิตรละตินอเมริกา"
 CHL_the_latin_american_alliance_desc: "แมลัทธิรวมฮิสแปนิกจะเปนสิ่งที่เรามุงมั่นไขวควา แตยังมีผูคนในทวีปของเราที่ตองการรวมกับเราตอสูกับการกดขี่ของจักรวรรดินิยม แมจะเปนเพียงชาวละติน เราควรเชิญพวกเขา เพราะชาวละตินที่รวมกันยอมแข็งแกรง"

 CHL_sponsor_anti_colonialist_rebellions: "อุปถัมภการกบฏตอตานลัทธิอาณานิคม"
 CHL_sponsor_anti_colonialist_rebellions_desc: "มีผูคนที่คิดเหมือนเรา แตไมมีสิทธิกําหนดชะตากรรมของตนเองในการควบคุมและนําทางอนาคตของตน เราตองปลดปลอยพวกเขาจากเงื้อมมือของมหาอํานาจอาณานิคม"

 CHL_joint_development_and_research: "การพัฒนาและวิจัยรวม"
 CHL_joint_development_and_research_desc: "บัดนี้เมื่อเราทํางานใกลชิดกันมากขึ้น เราสามารถลงทุนในกันและกัน และจัดตั้งหองปฏิบัติการที่รับนักวิจัยจากทุกรัฐสมาชิกมาทํางานรวมกันไดดียิ่งขึ้น"

 CHL_push_past_the_darien_gap: "ขามชองวางดาริเอน"
 CHL_push_past_the_darien_gap_desc: "ชองวางดาริเอนระหวางโคลอมเบียและปานามาอาจขามไดยาก แตเปนสิ่งจําเปนหากเราตองการไปถึงพรมแดนของอเมริกา และปลดปลอยพี่นองของเราที่นั่นในทายที่สุด"

 CHL_the_might_to_defend_our_homes: "พลังในการปกปองบานเกิด"
 CHL_the_might_to_defend_our_homes_desc: "ชีวิตของเราถูกคุกคามจากมหาอํานาจของโลกอยูตลอดเวลา และไมอาจกลาวเกินจริงไดเลยถึงความสําคัญที่ประชาชนจะรูสึกไดรับการปกปองจากรัฐบาล เราควรเสริมกําลังกองทัพ เพื่อไมใหสงครามมาถึงหนาประตูบานของเราได"

 CHL_undo_colonialist_occupations: "ยุติการยึดครองของลัทธิอาณานิคม"
 CHL_undo_colonialist_occupations_desc: "มหาอํานาจอาณานิคมยึดครองบางสวนของอเมริกาฮิสแปนิกมานานเกินไปแลว ถึงเวลาที่จะแสดงใหพวกเขาเห็นวาเราไมใชคนที่ใครจะมาลอเลนดวยได สงกองทัพเขาไป!"

 CHL_unite_hispanic_america: "รวมอเมริกาฮิสแปนิกเปนหนึ่ง"
 CHL_unite_hispanic_america_desc: "เวลานั้นมาถึงแลวในที่สุด! วันนี้เรากําลังเปนประจักษพยานแหงประวัติศาสตร เมื่อชาวอเมริกาฮิสแปนิกสวนใหญไดกลับมารวมกันอีกครั้ง แตภายใตรัฐบาลของเราเองแทนที่จะเปนจักรวรรดิสเปน จงชื่นชมยินดี เพราะนี่คือการมาถึงของยุคใหมแหงทวีป!"

 CHL_the_true_enemy: "ศัตรูที่แทจริง"
 CHL_the_true_enemy_desc: "อเมริกาคือศัตรูที่แทจริงเพียงหนึ่งเดียวของประชาชนเรา และไดกดขี่ชาวฮิสแปนิกทางใตของพวกเขามานานเกินไปแลว บัดนี้เมื่อเราพรอมสําหรับการรุกครั้งสุดทาย สิ่งเดียวที่ตองทําคือกาวสุดทายนั้น"

 CHL_demand_the_guayanas: "ทวงกายอานา"
 CHL_demand_the_guayanas_desc: "กายอานาถูกกองกําลังอื่นยึดครองมานานเกินไปแลว ภูมิภาคที่ครั้งหนึ่งเคยถูกกลาวขานวาเปนที่ตั้งของเอลโดราโดอาจไมมีมันอยูจริง แตก็มีความมั่งคั่งอื่นอีกมากมาย ความมั่งคั่งที่เราปรารถนาจะไดมาเปนของเราอยางยิ่ง"

 CHL_liberate_the_caribbean: "ปลดปลอยแคริบเบียน"
 CHL_liberate_the_caribbean_desc: "แคริบเบียนอาจไมไดเปนฮิสแปนิกทั้งหมด หรือแมแตเปนละตินอเมริกา แตก็ควรตกอยูในเขตอิทธิพลของเรา และเราตองใชทุกมาตรการเพื่อยึดหมูเกาะเหลานี้มาเปนของเรา"

 CHL_press_our_demands: "ผลักดันขอเรียกรองของเรา"
 CHL_press_our_demands_desc: "บัดนี้เมื่อเราครอบครองกายอานาทั้งหมดแลว เราสามารถบังคับใชขอเรียกรองและฉีกดินแดนเหลานี้ออกจากเงื้อมมือของจักรวรรดินิยม และพยายามแสวงหาสันติภาพกับอดีตผูยึดครองภูมิภาคนี้"

 CHL_defense_of_the_hemisphere: "การปองกันซีกโลก"
 CHL_defense_of_the_hemisphere_desc: "มีหลายชาติในซีกโลกของเราที่จะไดประโยชนอยางมากจากการไดรับการปกปองจากสหรัฐอเมริกา และนั่นคือสิ่งที่เราและชาวเยอรมันสามารถมอบใหพวกเขาได"

 CHL_support_the_colonial_plan: "สนับสนุนแผนอาณานิคม"
 CHL_support_the_colonial_plan_desc: "สํานักงานอาณานิคมเยอรมันเคยรางแผนเขายึดกลไกรัฐในอุรุกวัยอยางรวดเร็ว และตั้งรัฐบาลหุนเชิดอาณานิคม บัดนี้เรามีอํานาจที่จะพยายามทําใหแผนนี้เปนจริง และควรเรียกรองใหอุรุกวัยยอมเขารวมพันธมิตรของเรา และเลือกยืนขางที่ถูกตองของประวัติศาสตร"

 CHL_unite_with_our_brothers_in_hispania: "กลับมารวมกับพี่นองในฮิสปาเนีย"
 CHL_unite_with_our_brothers_in_hispania_desc: "พี่นองที่พลัดพรากกันมานานของเราในฮิสปาเนียเกามีอุดมการณสอดคลองกับเรา แตยังลังเลที่จะเขาขางเยอรมนีในสงครามใด ๆ เราอาจเปนแรงผลักที่พวกเขาตองการเพื่อเขารวมเปนสวนหนึ่งของฝายเยอรมันในที่สุด"

 CHL_restore_the_old_kingdom: "ฟนฟูราชอาณาจักรเกา"
 CHL_restore_the_old_kingdom_desc: "บัดนี้เมื่อเราควบคุมดินแดนทั้งหมดของภูมิภาคราชอาณาจักรชิลีที่กลุมชาตินิยมทวงดินแดนอางสิทธิ์ ซึ่งครั้งหนึ่งเคยเปนสวนหนึ่งของอุปราชแหงเปรู เราสามารถพยายามผนวกรวมดินแดนเหลานี้เขากับเรา และอาจรุกไปไกลกวาพรมแดนที่อางสิทธิ์ทางประวัติศาสตรเหลานี้อีกสักหนอย"

 CHL_an_empire_on_the_pacific: "จักรวรรดิในแปซิฟก"
 CHL_an_empire_on_the_pacific_desc: "บัดนี้เมื่อยุคทองของเราไดเริ่มตนขึ้นอยางแทจริง ถึงเวลาที่จะขยายขอบฟาและมองไปทางตะวันตก เราจะสถาปนาจักรวรรดิอันยิ่งใหญที่แผไพศาลทั่วมหาสมุทรแปซิฟก!"

 CHL_modern_conquistadors: "Conquistadores de Pedro de Valdivia"
 CHL_modern_conquistadors_desc: "บัดนี้เมื่อราชอาณาจักรชิลีเกาไดรับการฟนฟูในที่สุด ถึงเวลาที่จะเชิดชูบรรพบุรุษของเราอยางแทจริง และรับสืบทอดตําแหนงของผูสําเร็จราชการคนแรกของเรา คอนกิสตาดอรเปโดร เด บัลดิเบีย เดินหนาสูดินแดนที่ไมมีใครรูจัก!"

 CHL_no_more_advisors_tt: "§Yที่ปรึกษา§!สวนใหญที่มีอยูในปจจุบันจะ§Rไมสามารถใชงานได§!"
 CHL_indigenous_union: "สหภาพชนพื้นเมืองแหงทวีปอเมริกา"
 CHL_carabineros_secured_by_opposition: "Carabineros ถูกฝายคานควบคุมไวแลว"
 CHL_annex_and_core_all_american_subjects: "§Yผนวก§!และไดรับ§Yดินแดนหลัก§!ในทุก§Yรัฐในอารักขาของชาวอเมริกันอินเดียนและโพลินีเซีย§!"
 CHL_unified_in_spirit_tt: "ทุก§Yรัฐในอารักขาของชาวอเมริกันอินเดียนและโพลินีเซีย§!จะไดรับจิตวิญญาณแหงชาตินี้ดวย"
 CHL_avenge_the_pacification_tt: "กลุมตอตานชาวมาปูเชตาง ๆ ในประเทศจะติดตาม§Yการโลส อิบาเญซ เดล กัมโป§!ใน§Rสงครามกลางเมือง§!ตอตานเรา!"
 CHL_undermine_the_carabineros_de_chile_tt: "ปองกันไมใหฝายของอิบาเญซไดรับกองพล§Yคาราบิเนโรสแหงชิลีเพิ่มเติม§!เมื่อ§Yสงครามกลางเมือง§!เริ่มขึ้น"
 CHL_crusade_against_imperialism_tt: "ปลดล็อกการตัดสินใจ§Yปลดปลอยรัฐของชาวอเมริกันอินเดียน§!และ§Yรัฐโพลินีเซีย§!จากการกดขี่ของจักรวรรดินิยม"
 CHL_undermine_the_carabineros_de_chile_bonuses_tt: "§Yเมื่อสงครามประกาศเอกราชมาปูเช§!เริ่มขึ้น:\nประสบการณกองทัพบก: §G+25§!\nไดรับการสนับสนุนสงครามพื้นฐาน: §G+5.00%§!"

 CHL_ibanezs_coup: "รัฐประหารของอิบาเญซ"
 CHL_ibanezs_coup_desc: "อดีตประธานาธิบดีและนายพลการโลส อิบาเญซ เดล กัมโป ปรารถนาจะไดตําแหนงประธานาธิบดีที่สูญเสียไปกลับคืนมา และยินดีทําขอตกลงลับ ๆ หากจําเปนเพื่อใหไดมา เขาจึงยินดีสนับสนุนรัฐประหารรวมระหวางฝายอนุรักษนิยมและฟาสซิสต ตราบใดที่พวกเขาสัญญาวาจะใหเขาเปนผูนําประเทศ"

 CHL_address_the_mapuche_conflict: "จัดการความขัดแยงมาปูเช"
 CHL_address_the_mapuche_conflict_desc: "ประเทศขาดเสถียรภาพ แตสถานการณของชาวมาปูเชก็จะไมดีขึ้นภายใตอิบาเญซ เราจึงตองลงมือโดยเร็ว มานูเอล มันกิเลฟ นักเคลื่อนไหวและนักการเมืองชนพื้นเมือง ไดเริ่มรวบรวมและรวมองคกรมาปูเชที่แตกแยกกันเขาดวยกัน เพื่อโคนลมรัฐชิลีใหสิ้นซาก"

 CHL_undermine_the_carabineros_de_chile: "บอนทําลาย Carabineros de Chile"
 CHL_undermine_the_carabineros_de_chile_desc: "Carabineros de Chile กอตั้งขึ้นโดยประธานาธิบดีการโลส อิบาเญซ เดล กัมโป และยังคงภักดีตอเขาอยางยิ่ง หากเราพยายามสรางรัฐที่นําโดยเรา พวกเขาจะเขาขางเขาและขวางทางเราอยางแนนอน เราจึงตองทําทุกวิถีทางเพื่อใหพวกเขามีอํานาจนอยที่สุดเทาที่จะเปนไปไดนับจากนี้"

 CHL_la_corporacion_araucania: "La Corporación Araucana"
 CHL_la_corporacion_araucania_desc: "บรรษัทอาราอูกาโน ซึ่งนําโดยเบนันซิโอ โกูเอปน อวนชวล ผูเปนนักอนุรักษนิยมและนักบรรษัทนิยม หลานชายของหัวหนานักรบอาบาฆีโนผูมีชื่อเสียง อาจเปนพันธมิตรที่มีประโยชนในการรวมพลังตอตานรัฐชิลี"

 CHL_la_federacion_araucania: "La Federación Araucana"
 CHL_la_federacion_araucania_desc: "สหพันธอาราอูกาโน ซึ่งนําโดยมานูเอล อาบูรโต ปงกิเลฟ ผูยึดถือขนบธรรมเนียมมาปูเช ตอตานการรวมมือกับสังคมชิลีสมัยใหมอยางรุนแรง และนาจะผนวกเขากับขบวนการเอกราชของเราไดงาย"

 CHL_sociedad_caupolican_defensora_de_la_araucania: "Sociedad Caupolicán de la Araucanía"
 CHL_sociedad_caupolican_defensora_de_la_araucania_desc: "สมาคมเกาโปลิกันผูพิทักษอาราอูกาเนีย ซึ่งนําโดยมานูเอล มันกิเลฟ เปนหนึ่งในองคกรมาปูเชที่ใหญที่สุดในขณะนี้ และเปนรากฐานของการปฏิวัติที่ประสบความสําเร็จ การไดรับการสนับสนุนจากสมาชิกของกลุมนี้ควรเปนความสําคัญอันดับแรก"

 CHL_union_araucana: "Unión Araucana"
 CHL_union_araucana_desc: "Unión Araucana เปนหนึ่งในองคกรมาปูเชที่เกาแกที่สุดในชิลี ดวยความสัมพันธใกลชิดกับคณะบาทหลวงกาปูชินในอาราอูกาเนีย พวกเขาไดสงเสริมวาระการเผยแผศาสนาคาทอลิกและการผสมกลมกลืนเขากับสังคมชิลี แตก็อาจสนับสนุนแนวทางของเราหากไดรับการโนมนาวอยางเหมาะสม"

 CHL_la_moderna_araucania: "La Moderna Araucanía"
 CHL_la_moderna_araucania_desc: "La Moderna Araucanía เปนหนึ่งในองคกรมาปูเชแหงแรก ๆ ที่กอตั้งในชิลี โดยเนนดานการศึกษาและความกาวหนา เราควรพยายามผนวกพวกเขาเขากับขบวนการของเรา และใชความเชี่ยวชาญของพวกเขาใหเกิดประโยชนสูงสุด"

 CHL_electing_a_toqui: "เลือกตั้งโตกี"
 CHL_electing_a_toqui_desc: "ตามประเพณีมาปูเช โตกีจะไดรับเลือกเปนผูนําในยามสงครามโดยที่ประชุมของเหลาลองโกผูนําเรวเวและไอยาเรวเวตาง ๆ โตกีเหลานี้ดํารงบทบาทสูงสุดในสังคมมาปูเชและนํานักรบและลองโกในยามสงคราม และถึงเวลาแลวที่จะเลือกโตกีคนใหม ผูที่สามารถนําสงครามครูเสดตอตานจักรวรรดินิยมของเรา!"
 CHL_electing_a_toqui_tt: "เราจะสามารถเลือกผูนําที่มีคุณลักษณะเฉพาะได"

 CHL_convene_the_araucanian_congress: "เรียกประชุมสภาอาราอูกาเนีย"
 CHL_convene_the_araucanian_congress_desc: "เวลาแหงการเริ่มสงครามประกาศเอกราชใกลเขามาแลว แตองคกรของเรามีความแตกแยกภายใน บางคนอางวาพวกคอมมิวนิสตจะเปนพันธมิตรที่มีประโยชนเพราะมีเปาหมายคลายกับเรา ขณะที่บางคนอางวาพวกเขาจะกอแตความแตกแยกและหักหลังเราในชวงเวลาชี้ขาด เราควรไวใจใคร?"

 CHL_avenge_the_pacification_of_araucania: "ลางแคนการปราบปรามอาราอูกาเนีย"
 CHL_avenge_the_pacification_of_araucania_desc: "การยึดครองอาราอูกาเนียของชิลีระหวางป 1861 ถึง 1883 เปนชวงเวลามืดมนในประวัติศาสตรมาปูเช และถึงเวลาแลวที่เราจะแกแคนความอยุติธรรมและสงครามที่ชาวชิลีนํามาสูเรา จับอาวุธขึ้น เหลานักรบผูกลา! ทวงคืนสิ่งที่เคยเปนและจะกลับมาเปนของพวกทานอีกครั้ง! เชิดชูมรดกของกีลาปนและเกาโปลิกัน!"

 CHL_revise_the_social_classes: "ปรับปรุงชนชั้นทางสังคม"
 CHL_revise_the_social_classes_desc: "บัดนี้เมื่อเรามีสังคมของเราเองอีกครั้ง ถึงเวลาแลวที่จะปรับโครงสรางชนชั้นทางสังคมใหเขากับทัศนะและอุดมการณของเรามากขึ้น ยุคของชาวยุโรปกําลังจะสิ้นสุดลงในไมชา!"

 CHL_adopt_mapundungun: "ใชภาษามาปูดุงกุน"
 CHL_adopt_mapundungun_desc: "กาวสําคัญสูการฟนฟูรัฐมาปูเชที่แทจริงคือการรับภาษามาปูดุงกุนเปนภาษาราชการ อยางนอยก็ใหใชในราชสํานัก หากไมใชที่อื่น เรายังตองเริ่มใหการศึกษาแกประชาชนในรัฐของเรา เพื่อใหพวกเขาไดเรียนรูภาษาของเรา"

 CHL_embrace_indigenous_corporatism: "ยอมรับบรรษัทนิยมแบบชนพื้นเมือง"
 CHL_embrace_indigenous_corporatism_desc: "แนวคิดบรรษัทนิยมของเบนันซิโอ โกูเอปน อวนชวล ซึ่งตั้งอยูบนวิถีดั้งเดิมของงานหัตถกรรมและการกอสรางของชนพื้นเมืองชิลี ควรไดรับการยอมรับและกําหนดเปนนโยบายรัฐอยางเปนทางการสําหรับอุตสาหกรรมในประเทศของเรา"

 CHL_expand_the_agricultural_field: "ขยายภาคเกษตรกรรม"
 CHL_expand_the_agricultural_field_desc: "แมเบนันซิโอ โกูเอปน อวนชวล จะมีแนวคิดสมัยใหม แตก็มีหลายคนที่ตองการกลับสูวิถีเกาของสังคมเกษตรกรรม เพียงแตครั้งนี้รัฐจะเขามามีบทบาทมากขึ้นสําหรับผูที่ไมสามารถเลี้ยงตนเองได เราตองทําตามสิ่งที่ประชาชนตองการ เพื่อเพิ่มเสถียรภาพของชาติ"

 CHL_focus_on_cattle_and_wool: "มุงเนนปศุสัตวและขนแกะ"
 CHL_focus_on_cattle_and_wool_desc: "ปศุสัตวสองประเภทที่แพรหลายที่สุดในประเทศทุกวันนี้คือวัวและแกะ และการพยายามเปลี่ยนแปลงเรื่องนี้คงไมฉลาดนัก เราควรสงเสริมใหเกษตรกรทั่วประเทศซื้อสัตวเหลานี้แทน"

 CHL_enlarge_the_textile_industries: "ขยายอุตสาหกรรมสิ่งทอ"
 CHL_enlarge_the_textile_industries_desc: "สิ่งทอเปนสินคาที่ผลิตกันอยางแพรหลายทั่วประเทศมาโดยตลอด และทุกวันนี้ก็ไมควรตางออกไป รัฐควรอุดหนุนการเปดอุตสาหกรรมสิ่งทอใหม และพยายามสรางเสนทางการคากับชาติที่มีแนวคิดเดียวกัน"

 CHL_silverworking: "งานชางเงิน"
 CHL_silverworking_desc: "งานชางเงินเปนหนึ่งในหัตถกรรมดั้งเดิมอันโดดเดนของชาวมาปูเชมาโดยตลอด และการสงออกเครื่องประดับเงินชั้นสูงราคาแพงก็ทําไดงาย เพราะเรายังมีแหลงแรเงินธรรมชาติขนาดใหญ โดยเฉพาะเมื่อเราทวงคืนปวยลมาปูจากชาวอารเจนตินาได"

 CHL_incorporate_machi_into_the_army: "นํามาชีเขาสูกองทัพ"
 CHL_incorporate_machi_into_the_army_desc: "มาชีคือหมอพื้นบานและผูนําทางศาสนาในศาสนาของเรา และเปนที่รูจักในดานศาสตรการแพทยดั้งเดิม เราควรทําใหทุกกองพลมีมาชีอยางนอยหนึ่งคน เพื่อดูแลสุขภาพของทหารในการรบ"

 CHL_the_patagonian_giants: "ยักษแหงปาตาโกเนีย"
 CHL_the_patagonian_giants_desc: "ปาตาโกเนสหรือยักษแหงปาตาโกเนีย เปนเผาพันธุมนุษยยักษที่ลือกันวาอาศัยอยูในปาตาโกเนียและถูกบรรยายไวในบันทึกยุคแรกของชาวยุโรป กลาวกันวาพวกเขาสูงอยางนอยสองเทาของมนุษยทั่วไป แมขาวลือเหลานี้จะไมเปนความจริง แตเราควรพยายามใหกองทัพของเราสมกับภาพลักษณของยักษเหลานี้ และสรางความหวาดกลัวในสายตาศัตรู"

 CHL_taking_back_patagonia: "[CHL_taking_back_patagonia_key]"
 CHL_taking_back_patagonia_desc: "[CHL_taking_back_patagonia_desc_key]"

 CHL_honor_the_legacy_of_caupolican: "เชิดชูมรดกของเกาโปลิกัน"
 CHL_honor_the_legacy_of_caupolican_desc: "เกาโปลิกันเปนโตกีผูนําการตอตานของประชาชนตอคอนกิสตาดอรชาวสเปนที่รุกรานดินแดนมาปูเชในศตวรรษที่สิบหก เราควรพยายามใหสมกับนามอยางเกาโปลิกันและเลาตาโร หากเราตองการกําจัดจักรวรรดินิยมยุโรปออกไปจากทวีปของเรา"

 CHL_union_of_american_indigenous_peoples: "สหภาพชนพื้นเมืองแหงทวีปอเมริกา"
 CHL_union_of_american_indigenous_peoples_desc: "มีชนชาติมากมายทั่วโลกที่ถูกบังคับใหอยูใตและถูกทรมานโดยจักรวรรดินิยมยุโรป ถึงเวลาแลวที่เราจะพยายามรวมชาวอเมริกันอินเดียน อินูอิต และโพลินีเซียไวใตธงผืนเดียว เพื่อตอสูขับไลผูรุกรานที่ไรศีลธรรมเหลานี้!"
 CHL_union_of_american_indigenous_peoples_tt: "ปลดล็อก§Yกินติน ลาเม§!เปน§Yนายพล§!"

 CHL_crusade_against_imperialism: "สงครามครูเสดตอตานจักรวรรดินิยม"
 CHL_crusade_against_imperialism_desc: "ในที่สุดเวลาก็มาถึงที่เราพรอมจะเผชิญหนากับโลกกวางในนามของความยุติธรรม! ถึงเวลาที่จะแสดงใหชาวยุโรปผูเสื่อมทรามเห็นวาเราจะไมยอมกมหัวใหพวกเขาอีกตอไป จับอาวุธขึ้น ทหารทั้งหลาย เพราะครั้งนี้ เราจะนําสงครามไปถึงพวกเขา!"

 CHL_unified_by_will: "รวมเปนหนึ่งดวยเจตจํานง"
 CHL_unified_by_will_desc: "ชาวอเมริกันอินเดียนและโพลินีเซียไดรวมกันแลวดวยความพยายามตอตานจักรวรรดินิยมของเรา แตยังไมเพียงพอ หากเราตองการตานทานการรุกรานของชาวยุโรปไปอีกหลายศตวรรษ เราตองรวมตัวกันและกอตั้งชาติเดียวเพื่อประชาชนทั้งหมดของเรา รวมเปนหนึ่งดวยเจตจํานงที่จะมีรัฐซึ่งไมถูกปกครองโดยชาวยุโรป"

 CHL_unified_in_spirit: "รวมเปนหนึ่งดวยจิตวิญญาณ"
 CHL_unified_in_spirit_desc: "เนื่องจากเราทุกคนมีเปาหมายรวมกัน เราจึงทํางานรวมกันไดดี ราวกับเฟองที่หลอลื่นอยางดี ดังนั้นควรกลาววา แมเราจะไมรวมชาติของเราเปนหนึ่งเดียว แตก็ยังควรมุงสูการรวมกองทัพและการประสานงานที่มากขึ้น ประชาชนแหงอเมริกาและแปซิฟกเปนหนึ่งเดียวกันในจิตวิญญาณ และจะยืนเคียงขางกันเสมอ!"

 CHL_taking_back_patagonia_kingdom: "รวมราชอาณาจักรอีกครั้ง"
 CHL_taking_back_patagonia_kingdom_desc: "แมเราจะประกาศตนเปนราชอาณาจักรอาราอูกาเนียและปาตาโกเนียใหมแลว แตในความเปนจริงเรายังขาดดินแดนสวนใหญของราชอาณาจักร นั่นคือปาตาโกเนีย เราควรพยายามรวมอาณาจักรอีกครั้งโดยเร็วที่สุด มิฉะนั้นเราจะสูญเสียความชอบธรรมอันนอยนิดที่มีอยู"

 CHL_taking_back_patagonia_mapuche: "ทวงคืนปวยลมาปู"
 CHL_taking_back_patagonia_mapuche_desc: "ภูมิภาคปวยลมาปูของมาปูเชในอดีต ซึ่งเปนสวนใหญของปาตาโกเนียอารเจนตินาในปจจุบัน ยังคงอยูภายใตการกดขี่ของตางชาติ และเราไมสามารถปลดปลอยชนพื้นเมืองอเมริกันอื่นใดไดจนกวาเราจะปลดปลอยประชาชนของเราเองสําเร็จกอน ดังนั้น เมื่อไมมีทางอื่นใด เราก็ตองทําสงคราม...."

 CHL_ibanez_as_prime_minister_tt: "จาง§Yการโลส อิบาเญซ เดล กัมโป§!เปนที่ปรึกษา"
 CHL_return_to_the_parliamentary_era_tt: "จาง§Yมิเกล ครูชากา โตกอรนัล§!เปนที่ปรึกษา"
 CHL_je_suis_le_deluge_tt: "§Yอ็องตวนที่ 3§! ไดรับคุณลักษณะ§Yจักรพรรดิที่แทจริงแหงฝรั่งเศสและทวีปอเมริกา§!"
 CHL_the_straight_line_tt: "Línea Recta จะทํารัฐประหารโคน§Yอ็องตวนที่ 3§! และมอบราชอาณาจักรให§Yการโลส อิบาเญซ เดล กัมโป§!"
 CHL_satellite_kingdoms_tt: "ปลดล็อกการตัดสินใจ§Yจัดตั้งราชอาณาจักรบริวาร§! ซึ่งจะมีตัวเลือกใหตั้ง§Y[INC.GetNameDef]§!, §Y[SUR.GetName]§! หรือ§Y[HAI.GetName]§!เปนรัฐหุนเชิด หากเราควบคุมดินแดนทางประวัติศาสตรของพวกเขา"

 CHL_rule_by_decree: "ปกครองดวยพระราชกฤษฎีกา"
 CHL_rule_by_decree_desc: "ในสมัยดํารงตําแหนงประธานาธิบดีครั้งแรกระหวางป 1927 ถึง 1931 อิบาเญซปกครองดวยกฤษฎีกาและใชอํานาจเผด็จการ บัดนี้เขาตองทําเชนนั้นอีกครั้งเพื่อนําประเทศไปในทิศทางที่ถูกตอง"

 CHL_strengthen_the_carabinieros: "เสริมความแข็งแกรงให Carabineros de Chile"
 CHL_strengthen_the_carabinieros_desc: "Carabineros de Chile กอตั้งขึ้นครั้งแรกในป 1927 โดยไมใชใครอื่นนอกจากอิบาเญซเอง และองคกรสวนใหญยังคงภักดีตอเขาอยางยิ่ง จึงอาจคุมคาที่จะทําใหผูที่ภักดีเปนผูมีอํานาจในองคกร"

 CHL_seek_foreign_investments: "แสวงหาการลงทุนจากตางชาติ"
 CHL_seek_foreign_investments_desc: "การชวยฟนฟูอุตสาหกรรมของชาติดวยเงินกูจากตางชาติเปนวิธีที่อิบาเญซใชไดผลมาแลว และครั้งนี้ก็ไมตางกัน"

 CHL_increase_spending_on_public_works: "เพิ่มงบประมาณงานสาธารณะ"
 CHL_increase_spending_on_public_works_desc: "หากมีสิ่งหนึ่งที่อาเลสซานดรีพิสูจนไดในสมัยดํารงตําแหนงประธานาธิบดี นั่นคืองานสาธารณะเปนวิธีที่ยอดเยี่ยมในการฟนฟูเศรษฐกิจ"

 CHL_alianza_popular_libertadora_as_a_vanguard: "Alianza Popular Libertadora"
 CHL_alianza_popular_libertadora_as_a_vanguard_desc: "เนื่องจากการปกครองเพียงลําพังเปนเรื่องยาก การจัดตั้งรัฐบาลผสมพรอมที่ปรึกษาจากพรรคการเมืองฝายขวาตาง ๆ เพื่อนําความเห็นของพวกเขามารวมพิจารณาจึงเปนทางเลือกที่ชาญฉลาด"

 CHL_utilize_national_populism: "ใชลัทธิประชานิยมชาตินิยม"
 CHL_utilize_national_populism_desc: "ประชาชนหลงเชื่องาย และอะไรก็ตามที่สัญญาวาจะใหที่ดิน ความมั่งคั่ง หรือเกียรติยศแกพวกเขา ไมวาจะวางเปลาเพียงใด ก็จะทําใหพวกเขามาอยูขางคุณ แมการสนับสนุนนั้นจะไมแนนอนก็ตาม"

 CHL_outlaw_socialism: "ประกาศใหสังคมนิยมผิดกฎหมาย"
 CHL_outlaw_socialism_desc: "มีหลายคนที่ตอตานเผด็จการของอิบาเญซ แตไมมีใครแข็งกราวเทาพวกสังคมนิยม เราจึงตองกําจัดพวกเขาออกจากประเทศ ยิ่งเร็วยิ่งดี"

 CHL_sell_arica_to_peru: "ขายอาริกาใหเปรู"
 CHL_sell_arica_to_peru_desc: "วิธีที่ยอดเยี่ยมในการไดเงินทุนกอนใหญมาชวยแกปญหาเศรษฐกิจคือการขายดินแดนบางสวนที่ยึดมาจากชาวเปรูและโบลิเวียในสงครามแปซิฟกคืนใหพวกเขา"
 CHL_sell_arica_to_peru_civil_war_tt: "§Rการดําเนินแผนยุทธศาสตรนี้รวมกับ $CHL_outlaw_socialism$ หรือ $CHL_utilize_national_populism$ อยางใดอยางหนึ่งจนเสร็จสิ้น จะนําไปสูสงครามกลางเมือง§!"
 CHL_sell_arica_to_peru_civil_war_tt_2: "§Rการดําเนินแผนยุทธศาสตรนี้และ $CHL_sell_arica_to_peru$ จนเสร็จสิ้น จะนําไปสูสงครามกลางเมือง§!"

 
 CHL_crown_antoine_as_sovereign_king: "สถาปนาอ็องตวนเปนกษัตริยผูทรงอธิปไตย"
 CHL_crown_antoine_as_sovereign_king_desc: "ฌัก อ็องตวน แบรนาร ไดเดินทางกลับมาจากฝรั่งเศสพรอมความชวยเหลือแกรัฐบาลของเราในชวงสงครามกลางเมือง แลกกับการที่เราตองมอบอํานาจและพระราชทานตําแหนงกษัตริยผูทรงอธิปไตยแหงอาราอูกาเนียและปาตาโกเนียใหแกเขา จะมีอะไรผิดพลาดไดเลา?"

 CHL_strike_a_deal_with_the_mapuche: "ทําขอตกลงกับชาวมาปูเช"
 CHL_strike_a_deal_with_the_mapuche_desc: "ครั้งหนึ่งชาวมาปูเชเคยยอมใหโอเรลี-อ็องตวนที่ 1 ขึ้นเปนกษัตริยองคแรกแหงอาราอูกาเนียและปาตาโกเนีย และดวยความสัมพันธของเรากับพวกเขา เราจะดึงองคกรมาปูเชใหม ๆ มาอยูขางเราได"

 CHL_request_assistance_in_the_war: "ขอความชวยเหลือในสงคราม"
 CHL_request_assistance_in_the_war_desc: "มีหลายประเทศในโลกที่จะไดประโยชนจากการมีรัฐบาลที่เปนมิตรกับยุโรปอีกรัฐบาลหนึ่ง เราควรขอการสนับสนุนจากพวกเขาเพื่อเอาชนะศัตรูของรัฐบาลเรา"
 CHL_request_assistance_in_the_war_tt: "หากไดรับการตอบรับ ประเทศนั้นจะสามารถสงอาสาสมัครมาชวยเราในชวงสงครามกลางเมือง และมีแนวโนมที่จะทําเชนนั้นมากขึ้น"

 CHL_mobilize_the_veteran_legionaries: "ระดมพลทหารผานศึกกองทหารตางดาว"
 CHL_mobilize_the_veteran_legionaries_desc: "ทหารกองทหารตางดาวฝรั่งเศสที่พระเจาอ็องตวนที่ 3 นํามาฝกและชวยระดมทหารใหม บัดนี้เปนที่ตองการอยางยิ่งในแนวหนา และควรพิจารณาอยางจริงจังที่จะรับพวกเขาเขาสูกองทัพปกติ"

 CHL_establish_a_royal_guard: "จัดตั้งราชองครักษ"
 CHL_establish_a_royal_guard_desc: "ไมมีกษัตริยองคใดจะสมบูรณไดหากปราศจากขาราชบริพารและองครักษมากมายอยูเคียงขาง และนาเสียดายสําหรับอ็องตวนที่ 3 ที่พระองคขาดสิ่งนั้น จึงควรถือเปนความสําคัญสูงสุดที่จะจัดตั้งหนวยราชองครักษโดยเร็วที่สุด"

 CHL_attract_additional_french_investments: "ดึงดูดการลงทุนจากฝรั่งเศสเพิ่มเติม"
 CHL_attract_additional_french_investments_desc: "นักธุรกิจและนักอุตสาหกรรมชาวฝรั่งเศสที่แตเดิมไดกลิ่นโอกาสอันยิ่งใหญจากการเดินทางของอ็องตวนมายังชิลี บัดนี้ประทับใจในความสําเร็จอันยิ่งใหญของพระองค และถูกโนมนาวไดงายใหมอบความชวยเหลือเพิ่มเติมแลกกับคําสัญญาเรื่องที่ดินในอนาคต"

 CHL_invite_french_aristocracy: "เชิญชนชั้นสูงฝรั่งเศส"
 CHL_invite_french_aristocracy_desc: "เพื่อแกปญหาภายในประเทศเกี่ยวกับระบบ Hacienda และ Inquilinaje เราควรนําชนชั้นสูงฝรั่งเศสกลุมใหมเขามา และปรับปรุงวิธีการทํางานของชนชั้นขุนนางในประเทศ"

 CHL_ibanez_as_prime_minister: "อิบาเญซเปนนายกรัฐมนตรี"
 CHL_ibanez_as_prime_minister_desc: "ไมตองสงสัยเลยวาอ็องตวนที่ 3 ไมสามารถปกครองเพียงลําพังไดทั้งหมด เพราะพระองคขาดความเปนรัฐบุรุษและความรูอยางที่อิบาเญซมี ดังนั้นระบอบกษัตริยจะตองเปนแบบภายใตรัฐธรรมนูญ"
 CHL_no_deluges_tt: "สิ่งนี้จะ§Rปดกั้น§!ไมใหคุณดําเนินแผนยุทธศาสตร §YJe Suis Le Deluge§! ในภายหลังของผัง"

 CHL_an_absolute_monarchy: "ระบอบสมบูรณาญาสิทธิราชย"
 CHL_an_absolute_monarchy_desc: "มีงานตองทําอีกมาก และผูเดียวที่สามารถยึดกุมอํานาจและนําทางประเทศไดคือกษัตริย นั่นคือเหตุผลที่สําคัญยิ่งที่ตองแจงคณะรัฐมนตรีวาพวกเขากลับบานไดทุกคน เพราะไมมีความจําเปนอีกตอไป"
 CHL_an_absolute_monarchy_tt: "สิ่งนี้จะ§Rปดกั้น§!ไมใหคุณดําเนินแผนยุทธศาสตร §Yเดินบนเสนตรง§! ในภายหลังของผัง"

 CHL_approach_the_moderates: "เขาหาฝายสายกลาง"
 CHL_approach_the_moderates_desc: "แมจะไมชอบระบอบกษัตริย แตก็มีหลายคนในประเทศที่อยางนอยจะติดตามอิบาเญซหากเขาบอกใหทํา และนั่นคือสิ่งที่เขาจะตองทํา"

 CHL_introduce_the_franc: "นําเงินฟรังกมาใช"
 CHL_introduce_the_franc_desc: "เงินเปโซชิลีออนแอและกําลังลมสลาย อีกทั้งยังเกี่ยวโยงกับรัฐชิลีเกา เราควรพยายามนําเงินฟรังกมาใชแทนสกุลเงินนี้ เพื่อประโยชนของชาติ"

 CHL_strengthen_control: "เสริมการควบคุม"
 CHL_strengthen_control_desc: "เราตองยึดอํานาจควบคุมจังหวัดตาง ๆ คืนจากพวกกบฏใจออนแอที่มองไมเห็นความเปนจริง และดิ้นรนตอตานระบอบอันยิ่งใหญของอ็องตวน"

 CHL_invite_carlist_refugees: "เชิญผูลี้ภัยฝายคารลิสต"
 CHL_invite_carlist_refugees_desc: "ฝายคารลิสตในสเปนใกลชิดกับเรา ในฐานะผูนิยมระบอบกษัตริยดวยกัน เมื่อพวกเขาถูกขับไลออกจากบานเกิด เราอาจไดรับความโปรดปรานจากพวกเขาดวยการเสนอที่ลี้ภัยใหที่นี่"

 CHL_expand_the_officer_corps: "ขยายเหลานายทหาร"
 CHL_expand_the_officer_corps_desc: "มีนายทหารจํานวนมากที่ภักดีตอฝายฟาสซิสตหรือสังคมนิยม และไดออกจากราชการของเราไปในเวลาตอมา เราควรขยายเหลานายทหารและสรางนายทหารหนุมขึ้นมาเพื่อรับมือกับการขาดแคลนครั้งใหมนี้"

 CHL_the_scouts_monarchist_youth_organization: "ลูกเสือหลวง"
 CHL_the_scouts_monarchist_youth_organization_desc: "เราควรกอตั้งองคกรกึ่งทหารที่สามารถสอนเยาวชนใหปฏิบัติหนาที่ในยามสงครามหากจําเปน และสอนประชาชนของเราถึงวิธีเอาตัวรอดและการทําสงคราม"

 CHL_state_catholicism: "คาทอลิกเปนศาสนาประจํารัฐ"
 CHL_state_catholicism_desc: "รัฐบาลเสรีนิยมเกาไดแยกศาสนจักรคาทอลิกออกจากรัฐ ซึ่งบัดนี้เราถือวาเปนบาปอันรายแรง เราตองแกไขความผิดพลาดครั้งใหญนี้ทันที!"

 CHL_invite_french_academia: "เชิญนักวิชาการฝรั่งเศส"
 CHL_invite_french_academia_desc: "เพื่อใหประชาชนของประเทศไดเรียนรูและบรรลุสิ่งยิ่งใหญ และเพื่อใหประเทศของเรากาวหนาจนแขงขันบนเวทีโลกได เราตองเชิญนักวิชาการฝรั่งเศสจากแผนดินแมมาชวยใหการศึกษาและจัดระบบ"

 CHL_a_new_araucanian_noble_class: "ชนชั้นขุนนางอาราอูกาเนียใหม"
 CHL_a_new_araucanian_noble_class_desc: "แมตอนนี้เราจะมีชนชั้นสูงจํานวนมากแลว แตเราควรสรางโครงการใหผูคนไดเปนขุนนางของประเทศเพื่อแลกกับการลงทุนในรัฐ หรือการรับใชในนามของกษัตริย"

 CHL_establish_the_royal_mountaineers: "จัดตั้งทหารภูเขาหลวง"
 CHL_establish_the_royal_mountaineers_desc: "เทือกเขาแอนดีสตอนใตเปนลักษณะเดนของประเทศ และทหารภูเขาของรัฐเราเปนกองกําลังชั้นยอดที่เปนรากฐานของประเทศ เราควรขยายองคกรนี้ และทําใหแนใจวาพวกเขาไดรับยุทโธปกรณทั้งหมดที่อาจตองใช"

 CHL_an_imperial_capital: "เมืองหลวงแหงจักรวรรดิ"
 CHL_an_imperial_capital_desc: "ในปจจุบัน เมืองหลวงของเราคือซานเตียโก ซึ่งเปนเมืองเดียวกับเมืองหลวงของรัฐชิลีเกา อยางนอยก็ควรพิจารณาวาการยายเมืองหลวงไปยังที่อื่นจะดีที่สุดหรือไม"
 CHL_an_imperial_capital_tt: "เราจะไดรับตัวเลือกใหคง§Yซานเตียโก§!เปนเมืองหลวงและเพิ่มชองสิ่งกอสราง §G2§! ชอง หรือยายไปยัง§Yเตมูโก§!และเพิ่มชองสิ่งกอสราง §G4§! ชอง"

 CHL_satellite_kingdoms: "ราชอาณาจักรบริวาร"
 CHL_satellite_kingdoms_desc: "นโปเลียนมหาราชเปนแรงบันดาลใจสําคัญของอ็องตวน และหลักการของพระองคก็เปนเชนนั้นสําหรับรัฐบุรุษทั่วโลก เราควรทําอยางที่พระองคทํา คือสรางรัฐกันชนขนาดเล็กที่ทําใหประชาชนทองถิ่นไมตองคิดถึงผูปกครองใหมของตนมากเกินไป"

 CHL_secure_the_brazilian_border: "รักษาพรมแดนบราซิล"
 CHL_secure_the_brazilian_border_desc: "บราซิลเปนหนึ่งในไมกี่ประเทศในทวีปที่สามารถตอกรกับเราได เราควรรักษาพรมแดนที่ติดกับพวกเขาใหมั่นคง เพื่อใหรุกรานไดงายที่สุดเมื่อถึงเวลาที่เหมาะสม"

 CHL_a_new_empire_of_brazil: "จักรวรรดิบราซิลใหม"
 CHL_a_new_empire_of_brazil_desc: "เราจะนําบราซิลมาอยูใตอํานาจของเรา และสรางจักรวรรดิบราซิลใหม ปกครองโดยกษัตริยองคใหมที่ไมไดมีเชื้อสายโปรตุเกส!"

 CHL_ruler_of_the_inca: "ผูปกครองแหงอินคา"
 CHL_ruler_of_the_inca_desc: "จักรวรรดิอินคาในอดีตยิ่งใหญและแผไพศาลครอบคลุมพื้นที่สวนใหญของเทือกเขาแอนดีส เราควรสรางรัฐนี้ขึ้นใหม แตภายใตการบริหารใหม การบริหารของเรา"

 CHL_a_french_alliance: "รวมชาติผูใชภาษาฝรั่งเศส"
 CHL_a_french_alliance_desc: "เมื่อมิตรผูนิยมกษัตริยของเราในฝรั่งเศสไดยึดอํานาจแลว การแสวงหาพันธมิตรกับพวกเขาจึงเปนทางเลือกที่ชาญฉลาด เพราะพวกเขามีเจตนาและเปาหมายเดียวกับเรา รวมถึงมีมรดกและภาษาเดียวกัน หากรวมกัน เราจะไมมีใครหยุดยั้งได"

 CHL_return_to_the_continent: "กลับสูภาคพื้นทวีป"
 CHL_return_to_the_continent_desc: "ระบบของฝรั่งเศสในปจจุบันมีความออนแอแฝงอยู และเราอยูที่นี่เพื่อฉวยประโยชนจากมัน ถึงเวลาที่จะกลับสูภาคพื้นทวีปอีกครั้ง และทวงสิทธิ์โดยกําเนิดของเราคืน!"

 CHL_joint_invasion_of_mexico: "การรุกรานเม็กซิโกรวมกัน"
 CHL_joint_invasion_of_mexico_desc: "บัดนี้เมื่อเราไดเปนพันธมิตรกับจักรวรรดิฝรั่งเศสใหมแลว ถึงเวลาที่จะทําสิ่งที่เราเคยลมเหลวมาแลวอีกครั้ง จักรวรรดิเม็กซิโกตองผงาดขึ้นอีกครั้ง มิฉะนั้นเราทุกคนจะลมสลายตอหนาแสนยานุภาพของพวกอเมริกัน!"

 CHL_claim_the_mexican_throne: "อางสิทธิ์ในราชบัลลังกเม็กซิโก"
 CHL_claim_the_mexican_throne_desc: "ราชบัลลังกเม็กซิโกเคยเปนของจักรพรรดิฝรั่งเศส แมจะเปนเพียงชวงสั้น ๆ เราควรใชขอเท็จจริงนี้ใหเปนประโยชนและอางวาเราคือผูสืบเชื้อสายของพวกเขา พรอมที่จะยึดประเทศคืนไดทุกเมื่อ"

 CHL_the_straight_line: "เดินบนเสนตรง"
 CHL_the_straight_line_desc: "อ็องตวนที่ 3 ผูวิกลจริตไดมีเวลาอยูในแสงไฟมามากพอแลว ถึงเวลาที่ฝายเสนตรงจะฟนฟูระเบียบในมาตุภูมิ และสวมมงกุฎใหอิบาเญซเปนกษัตริยองคใหมแหงรัฐชิลีอันยิ่งใหญ"

 CHL_je_suis_le_deluge: "Je Suis Le Deluge"
 CHL_je_suis_le_deluge_desc: "กาลครั้งหนึ่ง มีผูกลาววาวันหนึ่งนํ้าทวมใหญจะมาถึง และวันนั้นก็คือวันนี้ เราคือนํ้าทวมนั้น ผูที่จะทําลายระเบียบโลกอันเสื่อมทราม และนํามาซึ่งยุคใหม!"

 CHL_offer_to_protect_pitcairn: "เสนอปกปองเกาะพิตแครน"
 CHL_offer_to_protect_pitcairn_desc: "การปองกัน [270.GetName] ในปจจุบันออนแอกวาที่เราหวังไว ซึ่งเปดโอกาสใหศัตรูยึดและใชเปนฐานเตรียมการรุกรานเกาะอีสเตอรและทายที่สุดก็ถึงดินแดนใจกลางของเรา เราควรเสนอรับหนาที่ปกปองเกาะนี้ เพื่อความปลอดภัยของเราเอง"

 CHL_a_grand_armada: "กองเรืออารมาดาอันยิ่งใหญ"
 CHL_a_grand_armada_desc: "เชนเดียวกับจักรวรรดิสเปนอันยิ่งใหญในอดีตที่ใหกําเนิดเรา การโลส อิบาเญซ เดล กัมโป ปรารถนากองเรืออารมาดาอันยิ่งใหญที่ทรงพลังพอจะทาทายราชนาวีอังกฤษ พวกอเมริกัน และกองเรือทะเลหลวงเยอรมันพรอมกันได และขอใหเปนเชนนั้น!"

 CHL_reclaiming_quebec: "ทวงคืนควิเบก"
 CHL_reclaiming_quebec_desc: "พี่นองผูใชภาษาฝรั่งเศสของเราในควิเบกตองไดรับการปลดปลอยจากเงื้อมมือของการกดขี่และการยึดครองของตางชาติ และควรไดรับการทะนุถนอมในฐานะสหายรวมรบตอตานความเปนเจาโลกของผูใชภาษาอังกฤษ เราตองปลดปลอยพวกเขาเดี๋ยวนี้!"
 CHL_reclaiming_quebec_tt: "ปลดล็อกการตัดสินใจ: §Yผนวกรวมควิเบก§!"

 CHL_work_on_the_pan_american_highway: "ดําเนินงานทางหลวงแพน-อเมริกัน"
 CHL_work_on_the_pan_american_highway_desc: "ในการประชุมแพน-อเมริกันหลายครั้งที่จัดขึ้นในชวงไมกี่ปที่ผานมา เราไดตกลงรวมมือกับพี่นองในอเมริกาเหนือและอเมริกาใตเพื่อชวยเชื่อมสองทวีปอเมริกาเขาดวยกันและทําใหโครงการทางหลวงแพน-อเมริกันนี้สําเร็จ"
 working_on_the_pan_american_highway: "กําลังดําเนินงานทางหลวงแพน-อเมริกัน"


 #### Brazil ####

 BRA_defense_spending: "เพิ่มงบประมาณกลาโหม"
 BRA_defense_spending_desc: "โลกลุกเปนไฟแลว และไมมีประเทศใดจะถือวาตนปลอดภัยไดอีกตอไป ดังนั้นเราควรเพิ่มงบประมาณปองกันประเทศ ไมวาจะเปนโรงงานผลิตอาวุธหรือการกอสรางปอมปราการใหม เราจะรักษาอธิปไตยของบราซิลไวแมจะเปนสิ่งสุดทายที่เราทํา!"
 BRA_natal_naval_base: "สรางทาอากาศยานปารนามีริง"
 BRA_natal_naval_base_desc: "ดวยความรวมมือครั้งใหมกับสหรัฐอเมริกา พวกเขาเสนอจะสรางฐานทัพอากาศในประเทศเราโดยใชเงินทุนของพวกเขาเปนสวนใหญ แลกกับการที่เราอนุญาตใหกองทัพเรือสหรัฐฯ กองทัพบกสหรัฐฯ และ RAF ใชทาอากาศยานนี้ในการบินระหวางอเมริกาใตและแอฟริกาตะวันตก"
 natal_airbase_modifier: "อนุญาตใหเราใชทาอากาศยานปารนามีริง"
 BRA_no_fascism_in_south_america: "ไมมีฟาสซิสตในอเมริกาใต"
 BRA_no_fascism_in_south_america_desc: "เมื่อเราประกาศจุดยืนตอตานฟาสซิสตอยางเปดเผยแลว ถึงเวลาที่จะลงมือจัดการกับภัยอันตรายในปจจุบัน และปกปองทวีปของเราจากอุดมการณอันชั่วรายนี้ ไม [BRA.GetNameDef] ไมใชอาณานิคมของพวกเจา!"
 BRA_no_fascism_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอชาติ§Yฟาสซิสต§!ทั้งหมดใน§Yอเมริกาใต§!"
 BRA_no_communism_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอชาติ§Yคอมมิวนิสต§!ทั้งหมดใน§Yอเมริกาใต§!"
 BRA_anti_democracy_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอชาติ§Yประชาธิปไตยและไมฝกใฝฝายใด§!ทั้งหมดใน§Yอเมริกาใต§!"
 BRA_tribunal_de_seguranca_nacional: "Tribunal de Segurança Nacional"
 BRA_tribunal_de_seguranca_nacional_desc: "แมพันธมิตรปลดปลอยแหงชาติจะลมเหลวในการโคนลมรัฐบาลของเรา แตสมาชิกของพวกเขายังคงเดินอยูบนทองถนน วางแผนและรับสมัครพรรคพวกเพื่อรอโอกาสบอนทําลายรัฐอีกครั้ง อาชญากรเหลานี้จะถูกพิจารณาคดีและพิพากษาไดอยางมีประสิทธิภาพยิ่งขึ้นดวยการจัดตั้งศาลทหารตลอดชวงภาวะฉุกเฉิน"
 BRA_ensure_continued_military_support: "รับประกันการสนับสนุนจากกองทัพ"
 BRA_ensure_continued_military_support_desc: "การรักษาการสนับสนุนจากกองทัพเปนสิ่งสําคัญยิ่งตอความยั่งยืนของระบอบเรา ดวยคําสัญญาเล็กนอยระหวางรัฐกับนายทหารชั้นนํา พวกเขายอมถูกดึงมาเขาขางเราไดอยางแนนอน"
 BRA_work_with_the_integralists: "รวมมือกับฝายอินเทกรัลลิสต"
 BRA_work_with_the_integralists_desc: "เปาหมายของขบวนการอินเทกรัลลิสตสวนใหญสอดคลองกับของเรา จึงอาจเปนการรอบคอบที่จะไดรับการสนับสนุนจากพวกเขาเพื่อเสริมระบอบของเราตอการลุกฮือของคอมมิวนิสตครั้งตอ ๆ ไป ดวยกองกําลังกึ่งทหารและลัทธิชาตินิยมที่ฝงรากลึก พวกเขาจะเปนแนวหนาของการตอตานการปฏิวัติ"
 BRA_estado_moderno: "Estado Moderno"
 BRA_estado_novo_desc: "หลังจากหลายปที่ยืนอยูบนปากเหวของสงครามกลางเมือง ในที่สุดเราก็สามารถทลายภาวะชะงักงันทางการเมืองที่ยาวนานหลายป และสรางรัฐใหมบนพื้นฐานของสันติภาพ ความยุติธรรม และการทํางาน ในระหวางนี้ เราจะยังคงกวาดลางผูที่ตอตานระเบียบใหมกอนที่พวกเขาจะหวานความแตกแยกมากขึ้น"
 BRA_estado_moderno_tt: "§Y$BRA_getulio_vargas$§! ขึ้นเปนผูนําของ §Y$BRA_fascism_party_long$§!"
 BRA_estado_moderno_tt_desc: ""
 BRA_estado_novo: "Estado Novo"
 BRA_estado_moderno_desc: "เมื่อศัตรูภายในประเทศของเราแตกกระจายและพายแพ ถึงเวลาแลวที่จะกวาดลางระเบียบการเมืองเกาและประกาศรัฐสมัยใหม รัฐที่สามารถรับประกันสันติภาพและเสถียรภาพในระยะยาวใหแกประชาชนของ [BRA.GetName]"
 BRA_cohen_plan: "แผนโคเฮน"
 BRA_cohen_plan_desc: "เมื่อการเลือกตั้งใกลเขามาและการสนับสนุนจากผูมีสิทธิเลือกตั้งลดลง เราตองรับประกันความตอเนื่องของระบอบเราดวยวิธีอื่น ดวยการปลอมแผนรัฐประหารของคอมมิวนิสตอีกครั้ง เราสามารถปลุกการสนับสนุนตอเราขึ้นมาใหม พรอมกับระงับการเลือกตั้งในนามของความมั่นคงแหงชาติ"
 BRA_cohen_plan_tt: "ปลดล็อกภารกิจ §Y$BRA_execute_the_cohen_plan$§! ซึ่งตองทําใหสําเร็จภายใน 100 วันหลังจากดําเนินแผนยุทธศาสตรนี้เสร็จสิ้น การทําภารกิจใหสําเร็จตองดําเนินแผนยุทธศาสตร §Y$BRA_estado_novo$§! หรือ §Y$BRA_estado_moderno$§! ใหเสร็จสิ้น §Rหากทําภารกิจไมสําเร็จจะนําไปสูรัฐประหาร!§!"
 BRA_the_polaca: "โปลากา"
 BRA_the_polaca_desc: "แมจะเหลือผูที่มีศักยภาพจะกอภัยคุกคามรายแรงตอระบอบของเราเพียงไมกี่คน แตการรางรัฐธรรมนูญฉบับใหมที่กําหนดอํานาจของประธานาธิบดีก็จะเพิ่มความชอบธรรมใหเรา บางทีเราอาจหาแรงบันดาลใจจากรัฐธรรมนูญโปแลนดที่เพิ่งประกาศใช"
 BRA_anaue: "Anauê!"
 BRA_anaue_desc: "ขบวนการของเราไดนําวลีของชาวตูป 'Anauê' มาใชเปนเสียงรองรบ วลีนี้ไดกลายเปนสัญลักษณแหงภราดรภาพของสมาชิกและความภักดีอันไมยอทอในการปกปองชาติของเรา Anauê!"
 BRA_anaue_tt: "ปลดล็อกการตัดสินใจรับสมัครกองพลกองกําลังอาสาอินเทกรัลลิสตในรัฐตาง ๆ หลังจากจัดการชุมนุมที่นั่นเสร็จสิ้น \nรับสมัครนายพลคนใหมที่มีคุณลักษณะ §Y$militias_officer$§!: \n การปองกันของกองกําลังอาสา §G+5%§! \n ความเร็วของกองกําลังอาสา §G+5%§! \n การจัดระเบียบของกองกําลังอาสา §G+5%§!"
 BRA_autarky: "อัตตาธิปไตยทางเศรษฐกิจของบราซิล"
 BRA_autarky_desc: "ความปนปวนทางเศรษฐกิจหลังวิกฤตวอลลสตรีทไดแผลามไปทั่วโลกและทําลายเศรษฐกิจของเรา ตั้งแตการบริโภคกาแฟไปจนถึงการผลิตเหล็กกลา เราตองพึ่งพาตนเองไดในทุกสิ่ง และปกปองตนเองจากวิกฤตของตางชาติในอนาคต"
 BRA_corporatism: "ยอมรับลัทธิบรรษัทนิยม"
 BRA_corporatism_desc: "ขอพิพาทระหวางแรงงานกับนายทุนไดบอนทําลายเศรษฐกิจ[BRA.GetAdjective]มานานเกินไปแลว เพื่อแกไขปญหานี้ เราจะนําเสนอรูปแบบเศรษฐกิจใหมที่ตั้งอยูบนนโยบายบรรษัทนิยมซึ่งพบเห็นในชาติยุโรปที่ประสบความสําเร็จหลายชาติในชวงไมกี่ปที่ผานมา"
 BRA_departamendo_de_propaganda: "Departamento de Propaganda"
 BRA_departamendo_de_propaganda_desc: "ทศวรรษแหงความปนปวนทางการเมืองที่ผานมาแสดงใหเห็นชัดเจนวาจะเกิดอะไรขึ้นเมื่อรัฐบาลและประชาชนมีความเห็นไมตรงกัน เพื่อปองกันความวุนวายเพิ่มเติม เราจะจัดตั้งกรมโฆษณาชวนเชื่อเพื่อชักจูงใหประชาชนเห็นพองกับนโยบายของเรา"
 BRA_departamento_de_ordem_politica_e_social: "Departamento de Ordem Política e Social"
 BRA_departamento_de_ordem_politica_e_social_desc: "การโฆษณาชวนเชื่อและการบีบบังคับไมเพียงพอที่จะยับยั้งพวกหัวรุนแรงที่ทุมเทที่สุดหรือสายลับตางชาติไมใหทํากิจกรรมที่เปนภัยตอรัฐ เราจึงตองการตํารวจลับหนวยใหมเพื่อสืบสวนภัยคุกคามเหลานี้"
 BRA_collective_bargaining: "การเจรจาตอรองรวม"
 BRA_collective_bargaining_desc: ""
 BRA_cooperation_in_the_americas: "นโยบายเพื่อนบานที่ดี"
 BRA_cooperation_in_the_americas_desc: "‘นโยบายเพื่อนบานที่ดี’ ของแฟรงกลิน รูสเวลต ยังคงมีอิทธิพลในซีกโลกตะวันตก เราควรรับนโยบายนี้และมุงรวมมือกับชาติตาง ๆ ในทวีปอเมริกา แทนที่จะแทรกแซงกิจการของกันและกัน"
 BRA_tech_slot_1: "มหาวิทยาลัยเซาเปาลู"
 BRA_tech_slot_1_desc: "มหาวิทยาลัยเซาเปาลูเพิ่งกอตั้งขึ้นไมนาน แตประโยชนของมันก็เริ่มเห็นผลทั่วทั้งเศรษฐกิจ[BRA.GetAdjective]แลว เราควรใชโอกาสนี้ดวยการลงทุนในสถาบันที่กําลังเติบโตแหงนี้มากขึ้น"
 BRA_reject_cosmopolitanism: "ปฏิเสธลัทธิสากลนิยม"
 BRA_reject_cosmopolitanism_desc: "กระแสสากลนิยมเมื่อไมนานมานี้ไมใชอะไรอื่นนอกจากมาโทรจันสําหรับการแทรกแซงของคอมมิวนิสตในชาติอันยิ่งใหญของเรา เราคือชาว[BRA.GetAdjective] และเราตองปกปองวัฒนธรรมและอุดมการณของเรากอนที่มันจะถูกทําลาย"
 BRA_ban_political_parties: "สั่งหามพรรคการเมือง"
 BRA_ban_political_parties_desc: "พรรคการเมืองไดพิสูจนแลววาไมใชอะไรอื่นนอกจากเครื่องมือสรางความแตกแยกและความวุนวาย ดวยการสั่งหามและกําจัดพวกมัน เราจะจํากัดความสามารถของพวกหัวรุนแรงในการรวมตัวตอตานเรา"
 BRA_decree_no_37: "กฤษฎีกาฉบับที่ 37"
 BRA_decree_no_37_desc: "ระบอบกอนหนาเต็มไปดวยการฉอราษฎรบังหลวงและการทะเลาะเบาะแวงภายใน เนื่องจากบางรัฐมีอิทธิพลตอการเมืองระดับชาติมากเกินสัดสวน เราจึงควรปราบปรามการแสดงออกทางลัทธิภูมิภาคนิยมทุกรูปแบบและรวมศูนยอํานาจไวที่รัฐบาลแหงชาติ"
 BRA_establish_psad: "จัดตั้ง DASP"
 BRA_establish_psad_desc: "กลไกรัฐที่ทําใหนโยบายของรัฐบาลเราถูกนําไปปฏิบัตินั้นลาสมัยและเฉื่อยชา เราจะจัดตั้ง Departamento Administrativo do Serviço Público (DASP) เพื่อชวยใหเราปกครองประเทศไดอยางมีประสิทธิภาพยิ่งขึ้นและรักษาประสิทธิภาพทางเศรษฐกิจ"
 BRA_federal_employment_plan: "แผนการจางงานแหงสหพันธ"
 BRA_federal_employment_plan_desc: "การวางงานจํานวนมากจะนําไปสูลัทธิหัวรุนแรงและความรุนแรงอยางตอเนื่อง เพื่อปองกันเรื่องนี้ เราจะขยายโอกาสการจางงานดวยการสรางอุตสาหกรรมที่รัฐดําเนินการและโครงการโครงสรางพื้นฐานใหม"
 BRA_secure_our_borders: "รักษาพรมแดนของเรา"
 BRA_secure_our_borders_desc: "เราถูกลอมรอบดวยศัตรูนอกพรมแดนที่ตองการโดดเดี่ยวและทําลายชาติอันยิ่งใหญของเรา เมื่อสถานการณภายในอยูภายใตการควบคุมแลว ถึงเวลาที่เราจะหันความสนใจไปยังกิจการตางประเทศและเริ่มเคลื่อนไหวเพื่อรับประกันความมั่นคงของชาติ"
 BRA_ethical_internationalism: "สากลนิยมเชิงจริยธรรม"
 BRA_ethical_internationalism_desc: "แมแตชาติที่ยิ่งใหญที่สุดก็ไมอาจสรางและจัดหาทุกสิ่งใหประชาชนของตนได เพื่อรับประกันสันติภาพและความเจริญรุงเรืองแกประชาชนของเรา เราควรสรางนโยบายตางประเทศบนความเปนหุนสวนทางเศรษฐกิจที่เปนประโยชนรวมกันกับชาติที่มีแนวคิดเดียวกัน"
 BRA_brazil_integral: "บราซิลบูรณาการ"
 BRA_brazil_integral_desc: "ตองใชเวลาหลายปกวาจะมาถึงชวงเวลานี้ แตในที่สุดเราก็กุมอํานาจเหนือประเทศไดอยางมั่นคง และกําจัดรองรอยสุดทายของวิถีสาธารณรัฐเกาอันเสื่อมโทรมไปได"
 BRA_in_vargas_we_trust: "เราเชื่อมั่นในวารกัส"
 BRA_in_vargas_we_trust_desc: "$BRA_getulio_vargas$ ไดพิสูจนตนเองวาเปนนักการเมืองที่มีความสามารถซึ่งฝาพายุแหงการเปนผูนํามาได ยิ่งกวานั้น เขายังพิสูจนวาเปนผูนําที่ชาญฉลาดดวยการรับนโยบายของพรรคเรามาใช หลายคนในพรรคเชื่อแลววาเขาถูกลิขิตมาใหนําชาติไปสูจุดสูงสุดยิ่งกวาเดิม"
 BRA_departamento_feminino: "Departamento Feminino"
 BRA_departamento_feminino_desc: "มีผูหญิงนับไมถวนที่รักชาติและซื่อสัตยไมแพสามีและบิดาของพวกเธอ เราควรใหโอกาสพวกเธอไดมีสวนรวมในขบวนการของเราและทํางานรวมกันเพื่อฟนฟูความยิ่งใหญของ[BRA.GetAdjective]"
 BRA_integrity_of_the_fatherland: "เพื่อมาตุภูมิ"
 BRA_integrity_of_the_fatherland_desc: "$BRA_getulio_vargas$ เปนพันธมิตรทางการเมืองที่มีประโยชน แตเขาสนใจเพียงอํานาจและไมใชอินเทกรัลลิสตที่แทจริง ดวยการสนับสนุนอยางกวางขวางทั่วประเทศ เราควรเคลื่อนไหวขับไลประธานาธิบดีและแตงตั้งผูศรัทธาที่แทจริงอยาง $BRA_plinio_salgado$ ขึ้นดํารงตําแหนง"
 BRA_no_communism_in_south_america: "ไมมีคอมมิวนิสตในอเมริกาใต"
 BRA_no_communism_in_south_america_desc: "พวกคอมมิวนิสตไวใจไมได ดังที่เราเห็นจากความพยายามปฏิวัติในป 1935 ซึ่งเราปราบลงไดอยางชอบธรรม เพื่อรับประกันอนาคตของชาติ เราตองจัดการกับพวกบอนทําลายตางชาติที่อยูใกลเคียง ยิ่งเร็วยิ่งดี!"
 BRA_defense_of_the_fatherland: "การปองกันมาตุภูมิ"
 BRA_defense_of_the_fatherland_desc: "ความทะเยอทะยานของเราไปไกลเกินกวาพรมแดนในปจจุบันมาก แตถึงอยางนั้น เราตองทําใหแนใจอยางที่สุดวาไมมีใครสามารถคุกคามดินแดนบานเกิดของเราได Viva o Brasil!"
 BRA_german_subs: "โครงการพัฒนาเรือดํานํ้าเยอรมัน"
 BRA_german_subs_desc: "การเขาขางชาวเยอรมันทําใหเราสามารถใชเทคโนโลยีของพวกเขาในดานที่เราเคยประสบปญหาในการปรับปรุงใหทันสมัย และหนึ่งในนั้นคือดานการสงครามเรือดํานํ้า เราจะใชประโยชนจากพันธมิตรใหมของเรา และควบคุมที่ราบเคปเวิรด!"
 BRA_german_sub_initiative: "การแลกเปลี่ยนขอมูลเรือดํานํ้าเยอรมัน"
 BRA_german_tanks: "จัดหารถถังเยอรมัน"
 BRA_german_tanks_desc: "ดวยการเขาขางชาวเยอรมัน บัดนี้เราไมเพียงไดรับพิมพเขียวและรายละเอียดสําหรับการวิจัยและผลิตรถถังที่คลายกับแพนเซอรของเยอรมนีไดงายขึ้นเทานั้น แตยังสามารถซื้อยานพาหนะเหลานี้จากพวกเขาไดโดยงายอีกดวย งูเหาสูบไปปจะสรางความหวาดกลัวในใจศัตรูของเรา!"
 BRA_german_tanks_tt: "ไดรับ §Y200§! §YPanzer IV Ausf. A - รถถังกลาง§! [GER.GetAdjective]"
 BRA_German_tank_exchange: "การแลกเปลี่ยนขอมูลรถถังเยอรมัน"
 BRA_italian_trucks: "การพัฒนายานยนตรวมกับอิตาลี"
 BRA_italian_trucks_desc: "เราควรพยายามไมเพียงไดรับความเชี่ยวชาญของอิตาลีดานการพัฒนาและผลิตยานยนตลํ้าสมัยเทานั้น แตยังควรสั่งซื้อและขอใหจัดสงรถบรรทุกอิตาลีโดยทันทีดวย"
 BRA_italian_trucks_mio_tt: "ปลดล็อกองคกรอุตสาหกรรมทางทหาร §Y$ITA_fiat_organization$§!"
 BRA_italian_air_mio_tt: "ปลดล็อกองคกรอุตสาหกรรมทางทหาร §Y$ITA_fiat_aviazione_organization$§!"
 BRA_ford_mio_tt: "ปลดล็อกองคกรอุตสาหกรรมทางทหาร §Y$USA_ford_motor_company_organization$§!"
 BRA_italian_truck_exchange: "การแลกเปลี่ยนขอมูลยานยนตอิตาลี"
 BRA_italian_aircraft: "โครงการพัฒนาอากาศยานอิตาลี"
 BRA_italian_aircraft_desc: "การเขาขางชาวอิตาลีทําใหเราสามารถใชเทคโนโลยีของพวกเขาในดานที่เราเคยประสบปญหาในการปรับปรุงใหทันสมัย และหนึ่งในนั้นคือดานอากาศยาน ดวยเทคโนโลยีอิตาลี เราจะครองนานฟาอเมริกาใต!"
 BRA_Italian_plane_exchange: "การแลกเปลี่ยนขอมูลเครื่องบินอิตาลี"
 BRA_support_rural_folk: "บิดาแหงคนยากไร" 
 BRA_support_rural_folk_desc: "ชาว[BRA.GetAdjective]ที่อาศัยอยูในชนบทของประเทศถูกนักการเมืองหลายทศวรรษลืมเลือน ดวยการลงทุนในพื้นที่เหลานี้ เราจะเพิ่มการจางงานและโครงสรางพื้นฐาน พรอมกับไดรับการสนับสนุนจากประชากรกลุมใหญนี้"
 BRA_support_the_landowners: "สนับสนุนเจาพอนํ้าตาล"
 BRA_support_the_landowners_desc: "ความตองการนํ้าตาลทั่วโลกเพิ่มขึ้นอยางตอเนื่องมาหลายทศวรรษ ทําใหเกิดชนชั้นเจาของที่ดินผูมั่งคั่งใน [ROOT.GetNonIdeologyName] ที่ปลูกพืชชนิดนี้จนเปนที่รูจักในนาม ‘เจาพอนํ้าตาล’ เราควรพยายามดึงพวกเขามาเปนพวกดวยการปดกั้นเสียงเรียกรองการปฏิรูปที่ดินในหมูชาวนา"
 BRA_washington_accords: "ขอตกลง [USA.Capital.GetCapitalVictoryPointName]"
 BRA_washington_accords_desc: "เพื่อแลกกับการรับประกันทางทหารจากอเมริกา เราจะปรับเศรษฐกิจของเราไปสูการผลิตยุทโธปกรณสงครามเพื่อสนับสนุนพวกเขาในการปกปองคุณคาที่เรามีรวมกัน"
 BRA_washington_accords_tt: "หาก [USA.GetNameDef] ยอมรับขอตกลง:"
 BRA_disrupt_operation_bolivar: "ขัดขวางปฏิบัติการโบลิวาร"
 BRA_disrupt_operation_bolivar_desc: "ชาติตาง ๆ ในโลกเกาไดแทรกแซงกิจการของอเมริกาใตมานาน จากที่ครั้งหนึ่งเคยสงทหารและเรือปน บัดนี้พวกเขาสงสายลับขาวกรองมาแทน เราไมอาจทําเปนมองไมเห็นกิจกรรมเหลานี้ไดอีกตอไป และตองตามลาสายลับเหลานี้ทุกคนภายในพรมแดนของเรา"
 BRA_potenji_river_conference: "การประชุมแมนํ้าโปเตงจี"
 BRA_potenji_river_conference_desc: "ตองใชความพยายามอยางมากในการเตรียมเศรษฐกิจของเราใหพรอมสําหรับสงคราม แตถึงเวลาแลวที่เราจะรวมกับพันธมิตร[USA.GetAdjective]และทุมเทเต็มที่ในการปกปองซีกโลกตะวันตก แมจะตองรับมือกับภัยคุกคามทั่วโลกก็ตาม"
 BRA_potenji_river_conference_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap] จะเขารวมฝายเดียวกับ [USA.GetFlag][USA.GetNameDef]§! §R\nสิ่งนี้จะทําใหเราประกาศสงครามกับศัตรูทั้งหมดในปจจุบันของ [USA.Getflag][USA.GetAdjective] ดวย!§!"
 BRA_smoking_cobras: "Cobras Fumantes"
 BRA_smoking_cobras_desc: "หลายคนกลาววางูจะสูบไปปไดกอนที่กองกําลังของเราจะไปถึงแนวหนาจริง ๆ เสียอีก บัดนี้ศัตรูของเราหวาดกลัวความเหนียวแนนและความเชี่ยวชาญของทหารที่รับเอาฉายานี้มาเปนเครื่องหมายแหงเกียรติยศ"
 BRA_senta_a_pua: "Senta a Púa!"
 BRA_senta_a_pua_desc: "ดูเหมือนนักบินของเราจะคิดเสียงรองรบขึ้นมาเมื่อไมนานมานี้ ทําใหพวกเขาสามารถรวมความดุดันที่ไมมีใครเทียบและความทุมเทเพื่อชัยชนะไวในวลีเดียว Senta a Púa!"
 BRA_reach_out_to_our_neighbors: "ยื่นมือสูเพื่อนบาน"
 BRA_org_american_states_faction: "องคการรัฐอเมริกัน"
 BRA_reach_out_to_our_neighbors_desc: "เราถูกโดดเดี่ยวจากเพื่อนบานมานานเพราะเปนชาติเดียวในทวีปที่ใชภาษาโปรตุเกส บางทีถึงเวลาแลวที่เราจะยื่นมือออกไปและพยายามสรางความสัมพันธที่ดีขึ้นกับพวกเขา แทนที่จะปฏิบัติตอพวกเขาดวยความหวาดระแวง"
 BRA_rio_conference: "พิธีสารริโอ"
 BRA_rio_conference_desc: "ความขัดแยงเมื่อไมนานมานี้ไดทําใหขอพิพาทพรมแดนที่ยืดเยื้อมานานในภูมิภาคของเราเลวรายลง กอนที่ขอพิพาทเหลานี้จะลุกลามมากขึ้น ชาติตาง ๆ ในอเมริกาใตควรรวมกันแกไขดวยวิธีทางการทูต"
 BRA_organization_of_american_unity: "องคการรัฐอเมริกัน"
 BRA_organization_of_american_unity_desc: "นโยบายภายในประเทศของเราประสบความสําเร็จในชวงไมกี่ปที่ผานมา บัดนี้ถึงเวลาที่จะหันความสนใจไปยังกิจการตางประเทศและสงเสริมความรวมมือทั่วซีกโลกผานองคการเอกภาพอเมริกัน"
 BRA_organization_of_american_unity_tt: "ปลดล็อกการตัดสินใจ §Yเชิญเขารวมองคการรัฐอเมริกัน§! เพื่อเชิญชาติอื่นเขารวมองคการเหนือชาตินี้"
 BRA_org_american_unity_warning_tt: "§Rรัฐสมาชิกขององคการจะถูกเรียกรองใหปกปองสมาชิกอื่นที่ถูกโจมตี การไมปกปองสมาชิกที่ตองการความชวยเหลือ หรือการประกาศสงครามกับสมาชิกดวยกัน จะสงผลใหถูกขับออกจากองคการ!§!"
 BRA_financial_stimulation_tt: "การตัดสินใจชวยเพิ่ม§Yความเร็วการกอสรางในพื้นที่§! §Yจํานวนโรงงานสูงสุด§! และ§Yทรัพยากรที่มีในพื้นที่§!ในรัฐชนบทได §G20%§!"
 BRA_coffee_crisis_aftermath: "ผลพวงจากวิกฤตกาแฟ"
 BRA_coffee_crisis_aftermath_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญไดทําลายเศรษฐกิจบราซิลเพราะการพึ่งพาการสงออกมากเกินไป โดยเฉพาะกาแฟ แมจะมีความพยายามฟนฟูเศรษฐกิจแลว แตเปนหนาที่ของเราที่จะทํางานนี้ใหสําเร็จ เราจะฟนฟูอุตสาหกรรมของเราและกลายเปนขุมพลังทางเศรษฐกิจของทวีป"
 BRA_radio_nacional: "Radio Nacional"
 BRA_radio_nacional_desc: "หลายชาติเริ่มจัดตั้งสถาบันกระจายเสียงแหงชาติเพื่อนําเสนอขอเท็จจริงและความบันเทิงแกมวลชนผานคลื่นวิทยุ เราจะไมยอมถูกทิ้งไวขางหลังในเรื่องนี้ดวยการกอตั้ง Radio Nacional ของเราเอง"
 BRA_desenvolvimentismo: "Desenvolvimento"
 BRA_desenvolvimentismo_desc: "หากเราตองการใหผูคนกลับมาทํางานและใหการสงออกของเรากลับมาไหลเวียนอีกครั้ง เราตองกระตุนการเติบโตทางเศรษฐกิจ เราจะทําเชนนั้นดวยการสรางอุตสาหกรรมใหมและทําใหผูคนเขาถึงบริการทางการเงินไดงายขึ้น"
 BRA_promote_resource_extraction: "สงเสริมการสกัดทรัพยากร"
 BRA_promote_resource_extraction_desc: "ชาติของเราไดรับพรดวยทรัพยากรธรรมชาติอันอุดมสมบูรณ เพื่อสงเสริมการเติบโตทางเศรษฐกิจและการพึ่งพาตนเองที่มากขึ้น เราจะลงทุนในอุปกรณสกัดทรัพยากรสมัยใหมสําหรับอุตสาหกรรมของเรา"
 BRA_companhia_siderurgica_nacional: "Companhia Siderúrgica Nacional"
 BRA_companhia_siderurgica_nacional_desc: "เหล็กกลาไดกลายเปนทรัพยากรสําคัญในอุตสาหกรรมมากมาย แตการผลิตภายในประเทศของเราไมเพียงพอตอความตองการ เราจึงจะจัดตั้งบริษัทเหล็กกลาแหงชาติที่รัฐเปนเจาของพรอมเครื่องจักรลํ้าสมัย แทนที่จะนําเขาจากตางประเทศ"
 BRA_stimulate_the_civilian_economy: "กระตุนเศรษฐกิจ"
 BRA_stimulate_the_civilian_economy_desc: "การผลิตสินคาภายในประเทศยังคงไมเพียงพอ ทําใหเงินไหลออกนอกประเทศเพื่อซื้อสินคานําเขา เราตองลดปญหานี้ดวยการขยายอุตสาหกรรมของเราเอง"
 BRA_domestic_arms_industry: "อุตสาหกรรมอาวุธในประเทศ"
 BRA_domestic_arms_industry_desc: "สถานการณระหวางประเทศดูตึงเครียดมากขึ้นเรื่อย ๆ สงผลใหชาติผูผลิตอาวุธรายใหญของโลกจํากัดการสงออกยุทโธปกรณ เราตองพัฒนาอุตสาหกรรมอาวุธของเราเองอยางรวดเร็ว หากตองการรักษากองทัพใหมีกําลังเต็มที่"
 BRA_war_production: "การผลิตเพื่อสงคราม"
 BRA_war_production_desc: "ไฟสงครามกําลังลุกลามอยางรวดเร็วทั่วโลก หากมันมาถึงดินแดนของเรา เราตองสามารถเปลี่ยนอุตสาหกรรมจากการผลิตรถยนตและเครื่องปงขนมปงไปเปนรถถังและระเบิดไดอยางรวดเร็ว"
 BRA_deal_with_the_cangaceiro: "จัดการกับพวกกังกาโซ"
 BRA_establish_trade_relationships: "$CHL_establish_trade_relationships$"
 BRA_establish_trade_relationships_desc: "$CHL_establish_trade_relationships_desc$"
 BRA_reach_out_to_the_great_powers: "$ARG_reach_out_to_the_great_powers$"
 BRA_reach_out_to_the_great_powers_desc: "$ARG_reach_out_to_the_great_powers_desc$"
 BRA_deal_with_the_cangaceiro_desc: "พวกกังกาโซไมใชอะไรอื่นนอกจากโจรที่เปนหนามยอกอกเรามานานเกินไปแลว ถึงเวลาที่เราจะถอนหนามนี้ออกจากภาคเหนือใหสิ้นซาก"
 BRA_deal_with_the_cangaceiro_tt: "ปลดล็อกการตัดสินใจ §Y$BRA_deal_with_the_cangaceiro$§! เพื่อกําจัดพวกกังกาโซในรัฐที่ไดรับผลกระทบ"
 BRA_consolidation_of_labor_laws: "รวบรวมกฎหมายแรงงาน"
 BRA_consolidation_of_labor_laws_desc: "กฎหมายแรงงานของเราใหความคุมครองแกคนงานนอยมาก ซึ่งนําไปสูความขัดแยงกับเจาของกิจการและการนัดหยุดงานในที่สุดอยางหลีกเลี่ยงไมได ในชวงเวลาอันตรายเชนนี้ เราไมอาจปลอยใหเกิดการนัดหยุดงานหรือเสี่ยงตอการแทรกซึมของบอลเชวิค เราจึงจะรวบรวมกฎหมายและหาจุดสมดุลระหวางคนงานกับนายทุน"
 BRA_consolidation_of_labor_laws_fallback_tt: "ขึ้นอยูกับแผนยุทธศาสตรที่เลือกไวกอนหนา จะปรับเปลี่ยนจิตวิญญาณแหงชาติ §Y$BRA_estado_novo_modifier$§! หรือ §Y$BRA_estado_moderno_modifier$§! ดังนี้:"
 BRA_promote_immigration_to_brazil: "สงเสริมการอพยพเขาเมือง"
 BRA_promote_immigration_to_brazil_desc: "[BRA.GetName] เปนชาติที่หลากหลาย มีผูคนซึ่งบรรพบุรุษมาจากทั่วทุกมุมโลก เมื่อเศรษฐกิจของเรากลับมาเติบโตอีกครั้งและมีทรัพยากรมากมายรอการนํามาใช ถึงเวลาแลวที่เราจะสงเสริมใหผูคนยายมาที่นี่และเรียกตนเองวาชาว[BRA.GetAdjective]ดวยเชนกัน"
 BRA_promote_immigration_to_brazil_tt: "ปลดล็อกการตัดสินใจ §Y$JUNO_promote_immigration_cat$§! เพื่อพัฒนารัฐตาง ๆ"
 BRA_pact_of_silence: "สนธิสัญญาแหงความเงียบ"
 BRA_pact_of_silence_desc: "ชาติตาง ๆ ผงาดขึ้นและลมสลาย และเมื่อหลายชาติลมสลายลงในระยะหลัง ก็มีผูเชี่ยวชาญลนหลามในทุกสาขาที่กําลังมองหาฝงที่ปลอดภัยกวาเพื่อเปนบานใหม บางทีเราอาจทําเปนมองขามภูมิหลังของพวกเขา ตราบใดที่เราไดเก็บเกี่ยวผลจากความเชี่ยวชาญของพวกเขา"
 BRA_national_petroleum_council: "สภาปโตรเลียมแหงชาติ"
 BRA_national_petroleum_council_desc: "ตั้งแตรถแทรกเตอรในไรนาไปจนถึงเรือประจัญบานที่ปกปองชายฝงของเรา นํ้ามันไดกลายเปนเสนเลือดใหญของเครื่องจักรสมัยใหม การตองพึ่งพาทรัพยากรสําคัญเชนนี้เปนภัยตอความมั่นคงของชาติ เพื่อลดความเสี่ยงนี้ เราจะจัดตั้งสภาปโตรเลียมแหงชาติเพื่อกํากับดูแลการสํารวจและขุดเจาะนํ้ามันภายในประเทศ"
 BRA_batalha_do_borracha: "Batalha da Borracha"
 BRA_batalha_do_borracha_desc: "[BRA.GetNameDefCap]เคยครองตลาดยางของโลก จนกระทั่งชาว[ENG.GetAdjective]สรางไรยางขนาดใหญของตนเองทั่วจักรวรรดิ เมื่อเสนทางลําเลียงของพวกเขาถูกคุกคาม โลกจึงหันมาพึ่งเราอีกครั้งเพื่อจัดหาทรัพยากรอันลํ้าคานี้"
 BRA_establish_companhia_vale_do_rio_doce: "Companhia Vale do Rio Doce"
 BRA_establish_companhia_vale_do_rio_doce_desc: "มีการคนพบสายแรเหล็กขนาดใหญและแหลงแรอุดมสมบูรณอื่น ๆ อีกมากในมีนัสเชไรส โดยเฉพาะในภูมิภาคอิตาบีรา เราตองทําใหรัฐสามารถใชประโยชนจากทรัพยากรเหลานี้และพัฒนาแหลงแรได ดวยการจัดตั้งบริษัทใหมที่มีเปาหมายหลักในเรื่องนี้"
 BRA_invest_in_road_infrastructure: "ลงทุนในโครงสรางพื้นฐานถนน"
 BRA_invest_in_road_infrastructure_desc: "รถยนตและรถบรรทุกมีความสําคัญตอการพัฒนาเศรษฐกิจมากขึ้นเรื่อย ๆ อยางไรก็ตาม โครงขายถนนของเรายังพัฒนาไมเพียงพอที่จะรองรับการใชยานพาหนะจํานวนมากในระดับประเทศ เราจึงตองลงทุนในโครงการกอสรางทางหลวงขนาดใหญกอนที่เศรษฐกิจของเราจะถูกบีบรัด"
 BRA_invest_in_railways: "ลงทุนในทางรถไฟ"
 BRA_invest_in_railways_desc: "รถไฟยังคงเปนวิธีที่ประหยัดที่สุดในการขนสงผูคนและสินคาจํานวนมากในระยะทางไกล เราจึงควรลงทุนขยายและปรับปรุงโครงขายทางรถไฟใหทันสมัย รวมถึงพัฒนารถไฟของเราเอง"
 BRA_invest_in_ports: "ลงทุนในทาเรือ"
 BRA_invest_in_ports_desc: "เราไดกาวหนาอยางมากในการตอบสนองความตองการของเศรษฐกิจดวยการผลิตภายในประเทศ จนถึงขั้นที่เราหันกลับไปมองการสงออกเปนวิธีสงเสริมการเติบโตทางเศรษฐกิจไดอีกครั้ง และเพื่อการนั้น เราตองลงทุนในทาเรือสําคัญของประเทศ"
 BRA_fabrica_nacional_de_motores: "Fábrica Nacional de Motores"
 BRA_fabrica_nacional_de_motores_desc: "ยานยนตเปนเครื่องจักรที่ซับซอน จึงมีตนทุนการนําเขาสูงมาก ซึ่งอาจฉุดรั้งการเติบโตทางเศรษฐกิจของเราในระยะยาว วิธีที่ดีที่สุดในการปองกันปญหานี้คือการพัฒนายานยนตที่ผลิตภายในประเทศของเราเอง"
 BRA_expand_fordlandia: "ขยายฟอรดแลนเดีย"
 BRA_expand_fordlandia_desc: "บริษัทฟอรดมอเตอรไดลงทุนจัดตั้งนิคมในแอมะซอนที่จะเปนฐานอุตสาหกรรมสําหรับการผลิตยาง โครงการนี้สะดุดลงในชวงไมกี่ปที่ผานมาเนื่องจากความปนปวนทางเศรษฐกิจ แตบางทีตอนนี้อาจเปนเวลาที่จะเริ่มโครงการใหม"
 BRA_fordlandia_name: "ฟอรดแลนเดีย"
 BRA_banco_do_brasil: "Banco do Brasil"
 BRA_banco_do_brasil_desc: "ประโยชนของการมีธนาคารกลางที่ออกและควบคุมปริมาณเงินในระบบเศรษฐกิจไดปรากฏชัดเจนอยางยิ่งนับตั้งแตภาวะเศรษฐกิจตกตํ่าครั้งใหญ Banco do Brazil ไดทําหนาที่เชนนั้นมานาน แตถึงเวลาแลวที่เราจะทําใหการจัดการนี้เปนทางการ"
 BRA_federal_development: "[BRA_federal_development_key]"
 BRA_imperial_development_key: "การพัฒนาแหงจักรวรรดิ"
 BRA_wealth_redistribution_key: "การกระจายความมั่งคั่ง"
 BRA_land_reform_key: "การปฏิรูปที่ดิน"
 BRA_federal_development_key: "การพัฒนาแหงสหพันธ"
 BRA_federal_development_desc: "การพัฒนาเศรษฐกิจตองกระจายไปทั่วประเทศเพื่อใหทุกคนไดเก็บเกี่ยวผลจากการทํางานหนักของตน เราจึงตองกระจายความหลากหลายไมเพียงแตสินคาของอุตสาหกรรมเทานั้น แตรวมถึงที่ตั้งของอุตสาหกรรมดวย"
 BRA_centralize_development: "สถาปนาเมืองหลวงใหม"
 BRA_centralize_development_desc: "เมืองหลวงในปจจุบันของเราอยูหางไกลจากภูมิภาคหางไกลของประเทศเกินไป ซึ่งนําไปสูความไมพอใจและการแบงแยกดินแดน เพื่อใหไดประโยชนทั้งสองทาง เราจะสถาปนาเมืองหลวงใหมใจกลางประเทศ ที่ทุกคนเขาถึงไดงายกวา"
 BRA_new_capital: "บราซีเลีย"
 BRA_centralize_development_tt: "เมืองหลวงใหมจะไดชื่อวา §Y'$BRA_new_capital$'§!"
 BRA_financial_stimulation: "การกระตุนทางการเงิน"
 BRA_financial_stimulation_desc: "เราไดวางรากฐานของเศรษฐกิจที่แข็งแกรงในชวงไมกี่ปที่ผานมาดวยการกอตั้งอุตสาหกรรมใหมและโครงการโครงสรางพื้นฐาน เพื่อรักษาการเติบโต เราเพียงตองดึงคันโยกของธนาคารกลางและอุตสาหกรรมแหงชาติ"
 BRA_resource_extraction_bonus: "โบนัสการสกัดทรัพยากร"
 BRA_oil_industry_bonus: "โบนัสอุตสาหกรรมนํ้ามัน"
 BRA_industry_bonus: "โบนัสกระตุนเศรษฐกิจ"
 BRA_electronics_bonus: "โบนัสอิเล็กทรอนิกส"
 BRA_invest_in_railways_bonus: "โบนัสทางรถไฟ"
 BRA_nacional_de_motores_bonus: "โบนัส Nacional de Motores"
 BRA_boost_integralist_support_tt: "ปลดล็อกการตัดสินใจ §Yการชุมนุมอินเทกรัลลิสต§! เพื่อเพิ่มการสนับสนุนฟาสซิสตในเมืองใหญและนครตาง ๆ ของประเทศ"
 BRA_domination_of_the_americas: "ครอบงําทวีปอเมริกา"
 BRA_domination_of_the_americas_desc: "เราจะไมมีวันปลอดภัยอยางสมบูรณตราบที่ยังมีศัตรูมากมายอยูหนาประตูบาน หนทางเดียวสูความรอดของ[BRA.GetAdjective]คือการที่เราตองกลายเปนมหาอํานาจที่ไมมีใครโตแยงไดในภูมิภาค"
 BRA_berlin_accords: "จัดทําขอตกลงเบอรลิน"
 BRA_berlin_accords_desc: "[USA.GetNameDefCap]ไดแทรกแซงกิจการของชาติอื่นในทวีปอเมริกามานาน ดวยการผูกมิตรกับ[GER.GetNameDef] เราอาจไดรับการปองปรามเชิงยุทธศาสตรตอการแทรกแซงของ[USA.GetAdjective]ในกิจการของเราในอนาคต"
 BRA_accords_tt: "หากพวกเขาตกลงรวมมือ:"
 faction_name_bra_ger: "กติกาสัญญาเบอรลิน-รีโอ"
 faction_name_bra_ita: "กติกาสัญญาโรม-รีโอ"
 BRA_expand_operation_bolivar: "ขยายปฏิบัติการโบลิวาร"
 BRA_expand_operation_bolivar_desc: "ชาว[GER.GetAdjective]ไดดําเนินปฏิบัติการขาวกรองขนาดใหญในอเมริกาใต เพื่อเฝาติดตามทั้งกิจกรรมทางเศรษฐกิจและการเมือง เราไดรับการขอรองใหชวยพวกเขาขยายปฏิบัติการนี้เพื่อแลกกับความรวมมือดานขาวกรองที่มากขึ้น"
 BRA_guyana_crisis: "วิกฤตกายอานา"
 BRA_guyana_crisis_desc: "ขณะที่มหาอํานาจยุโรปหันความสนใจไปยังที่อื่นในโลก เรามีโอกาสบีบบังคับใหพวกเขาโอนดินแดนในกายอานามาใหเรา มิฉะนั้นก็ตองเผชิญแนวรบอีกดานในสงครามของพวกเขา"
 BRA_provoke_argentina: "ยั่วยุอารเจนตินา"
 BRA_provoke_argentina_desc: "เปนที่ชัดเจนวา [ARG.GetName] ตองการโดดเดี่ยวและทําลายเรา แตหากเราลงมือปองกันอยางเรงรีบเกินไป เราอาจตองเผชิญความพิโรธของ [USA.GetName] เราจะยั่วยุชาว[ARG.GetAdjective]ใหเปดฉากยิงกอนแทน แลวในที่สุดเราก็จะไดแกแคนสงครามซิสแพลทีน!"
 BRA_form_mercosul: "กอตั้ง Mercosul"
 BRA_faction_mercosul_name: "Mercosul"
 BRA_form_mercosul_desc: "อเมริกาใตอยูภายใตอิทธิพลของมหาอํานาจภายนอกอยาง [USA.GetName] หรือจักรวรรดิยุโรปมานาน แตหากชาติตาง ๆ ในทวีปรวมตัวกันเปนกลุมเศรษฐกิจและการเมืองเดียว ก็จะไมมีใครกลาแทรกแซงทวีปของเราอีก"
 BRA_form_mercosul_focus_tt: "ปลดล็อกการตัดสินใจเชิญชาติอเมริกาใตอื่น ๆ เขารวม Mercosul"
 BRA_uruguay_ultimatum: "คําขาดตออุรุกวัย"
 BRA_uruguay_ultimatum_desc: "[URG.GetNameDefCap]ควรถูกรวมเขากับ [BRA.GetName] ตั้งนานแลว แตบรรพบุรุษของเราทําไมสําเร็จ ถึงเวลาที่เราจะแกไขความผิดพลาดทางประวัติศาสตรนี้และรวมประชาชนของเราภายใตเปาหมายรวมกัน"
 BRA_paraguay_intervention: "แทรกแซงปารากวัย"
 BRA_paraguay_intervention_desc: "[PAR.GetNameDefCap]ไรเสถียรภาพและคาดเดาไมไดมากเกินไปแลว เพื่อความมั่นคงของชาติเราเอง เราตองแทรกแซงกิจการของพวกเขาและสรางเสถียรภาพใหรัฐบาลของพวกเขา"
 BRA_rome_accords: "จัดทําขอตกลงโรม"
 BRA_rome_accords_desc: "เรามีความสัมพันธแนนแฟนกับ [ITA.GetName] มานาน เนื่องจากการอพยพทางประวัติศาสตรจากที่นั่นมายัง [BRA.GetName] ขณะที่โลกเริ่มเปลี่ยนแปลงและรัฐบาลของเรามีแนวทางสอดคลองกันมากขึ้น การทําใหความเปนหุนสวนระหวางสองชาติเปนทางการจึงสมเหตุสมผล"
 BRA_italian_car_industry: "ความรวมมือกับอุตสาหกรรมรถยนตอิตาลี"
 BRA_italian_car_industry_desc: "อุตสาหกรรมยานยนตของเรายังอยูในชวงเริ่มตน ขณะที่มิตรของเราใน [ITA.GetName] มีอุตสาหกรรมยานยนตขนาดใหญที่ประสบความสําเร็จ บางทีถึงเวลาแลวที่เราจะเขาหาพวกเขาเพื่อขอคําแนะนําในการพัฒนาบริษัทที่เพิ่งตั้งไขของเรา"
 BRA_penal_battalions: "Batalhões de Presos"
 BRA_penal_battalions_desc: "ทหารจํานวนมากในกองทัพไมกระตือรือรนที่จะตองรบเพื่อระบอบกษัตริยที่ลี้ภัยมาหลายทศวรรษ อยางไรก็ตาม นับตั้งแตใชกฎหมายความมั่นคงแหงชาติ เราก็มีนักโทษลนหลามที่สามารถนํามาใชในกองพันนักโทษ เพื่อเสริมกําลังกองกําลังตามแบบที่ขวัญเสียของเรา"
 BRA_penal_battalions_tt: "สรางแมแบบกองพลชื่อ §YBatalhões de Presos§! ซึ่งใชกองพันนักโทษ และยังเกณฑ §Y6 หนวย§! ใน §Y[ROOT.Capital.GetCapitalVictoryPointName]§!"
 BRA_end_the_state_of_emergency: "ยุติภาวะฉุกเฉิน"
 BRA_end_the_state_of_emergency_desc: "[BRA.GetLeader] ผูเคยเปนวีรบุรุษ บัดนี้กลายเปนภัยคุกคามที่ใหญที่สุดตอประชาธิปไตย[BRA.GetAdjective] ความกระหายอํานาจและนิสัยฉวยโอกาสของเขาทําใหเขาแทบจะระงับสิทธิที่เราตอสูมาเพื่อใหไดมาทั้งหมด ทุกคนที่ใหคุณคากับเสรีภาพตองตอตานภาวะฉุกเฉินอันอันตรายนี้"
 BRA_repeal_the_national_security_law: "ยกเลิกกฎหมายความมั่นคงแหงชาติ"
 BRA_repeal_the_national_security_law_desc: "ภัยคุกคามจากประธานาธิบดีฉวยโอกาสคนอื่นที่จะบอนทําลายประชาธิปไตยของเราจะยังคงอยูตลอดไป เวนแตเราจะยกเลิกกฎหมายความมั่นคงแหงชาติที่ $BRA_getulio_vargas$ ใชในชวงภาวะฉุกเฉิน"
 BRA_greater_federalism: "สหพันธรัฐนิยมที่มากขึ้น"
 BRA_greater_federalism_desc: "การรวมศูนยอํานาจทางการเมืองไมสอดคลองกับคุณคาประชาธิปไตยของเรา เราตองทลายการกุมอํานาจของชนชั้นนําทางการเมืองใน [ROOT.Capital.GetCapitalVictoryPointName] และคืนอํานาจใหแกรัฐตาง ๆ ของสาธารณรัฐ"
 BRA_democratic_socialism: "สังคมนิยมประชาธิปไตย"
 BRA_democratic_socialism_desc: "ความลมเหลวของ Intentona Comunista ป 1935 และภาวะฉุกเฉินที่ตามมาไดบีบใหนักการเมืองและนักเคลื่อนไหวฝายซายจํานวนมากตองหนีออกนอกประเทศหรือหลบลงใตดิน ไมวาพวกเขาจะสนับสนุนการปฏิวัติดวยความรุนแรงหรือไมก็ตาม เมื่อประชาธิปไตยตั้งมั่นแลว นักสังคมนิยมประชาธิปไตยก็มีโอกาสไดกลับบานในที่สุด"
 BRA_continue_centralization: "สงเสริมการรวมศูนยอํานาจ"
 BRA_continue_centralization_desc: "[ROOT.GetNameDefCap]เปนชาติที่มีหลายวัฒนธรรมกระจายอยูทั่วดินแดนอันกวางใหญ หากเราไมทํามากกวานี้เพื่อรวมรัฐที่หลากหลายของชาติเขาดวยกัน เราเสี่ยงตอการแตกแยกหรือแมแตการรุกลํ้าทางทหารจากเพื่อนบาน มีเพียงรัฐบาลกลางที่เขมแข็งเทานั้นที่จะปกปองประชาชนและประชาธิปไตยของเราได"
 BRA_court_the_military: "เขาหากลุมอํานาจทางทหาร"
 BRA_court_the_military_desc: "เปนอุดมคติเกินไปที่จะดําเนินนโยบายที่ทําใหกลุมอํานาจทางทหารไมพอใจหรือออนแอลง ความหวังเดียวของเราคือการหาจุดรวมและรวมมือกับพวกเขาเพื่อประโยชนสูงสุดของชาติ หากเราลมเหลว สิทธิที่เรามีอยูก็จะถูกดับลงอีกครั้ง"
 BRA_implement_a_national_guard: "จัดตั้งกองกําลังพิทักษแหงชาติ"
 BRA_implement_a_national_guard_tt: "สรางแมแบบกองพลชื่อ §YGuarda Nacional§! และเกณฑ §Y6 หนวย§! ใน §Y[ROOT.Capital.GetCapitalVictoryPointName]§!"
 BRA_implement_a_national_guard_desc: "กองทัพยังคงทอดเงาปกคลุมการเมืองของชาติ และพรอมจะยุติประชาธิปไตยหากไมเปนที่พอใจ เพื่อถวงดุลอิทธิพลของพวกเขา เราจะจัดตั้งกองกําลังพิทักษแหงชาติใหมที่ภักดีตอรัฐสภาแหงชาติ"
 BRA_nationalize_the_banks: "โอนธนาคารเปนของรัฐ"
 BRA_nationalize_the_banks_desc: "เศรษฐกิจของเรายังไมฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ ทําใหพลเมืองจํานวนมากยังยากจน ถึงเวลาที่เราจะยายภาระการฟนฟูเศรษฐกิจจากเหยื่อของภาวะตกตํ่า ไปสูผูกอเหตุที่ดําเนินกิจการธนาคาร"
 BRA_establish_the_brazilian_investment_bank: "การจัดเก็บภาษีที่เอื้อตอธุรกิจ"
 BRA_establish_the_brazilian_investment_bank_desc: "มีบรรษัทขามชาติมากมายที่จะไดประโยชนจากการเสียภาษีนอยกวาที่เปนอยู ดวยการกําหนดนโยบายภาษีที่เอื้อตอบริษัทเหลานี้ เราจะจูงใจใหพวกเขายายมายัง [ROOT.GetNameDef] ซึ่งเปนประโยชนตอเศรษฐกิจของเรา"
 BRA_church: "รวมมือกับศาสนจักร"
 BRA_church_desc: "ศาสนจักรคาทอลิกยังคงมีอิทธิพลอยางกวางขวางตอการเมืองของเรา แมจะมีการแยกศาสนจักรออกจากรัฐมาหลายทศวรรษ ทั้งนี้เปนเพราะชาวคาทอลิกผูเครงศาสนาจํานวนมหาศาลเปนผูมีสิทธิเลือกตั้งสวนใหญ หากเราไดรับความโปรดปรานจากศาสนจักร เราอาจไดรับการสนับสนุนจากมวลชนตอนโยบายของเรา"
 BRA_implement_article_138: "บังคับใชมาตรา 138"
 BRA_implement_article_138_desc: "มาตรา 138 ของรัฐธรรมนูญป 1934 ระบุวารัฐบาลควรชวยเหลือครอบครัวที่มีบุตรมาก มาตราที่คลุมเครือนี้จะครอบคลุมครอบครัวสวนใหญ หมายความวาความชวยเหลือใด ๆ จะมีคาใชจายสูงมาก อยางไรก็ตาม การจัดระบบสวัสดิการพื้นฐานใหครอบครัวเหลานี้จะชวยยกระดับผูคนนับลานใหพนจากความยากจนไดภายในหนึ่งชั่วรุน"
 BRA_tech_slot_2: "มหาวิทยาลัยแหงสหพันธ [ROOT.Capital.GetCapitalVictoryPointName]"
 BRA_tech_slot_2_desc: "เทคโนโลยีกําลังเปลี่ยนแปลงวิถีชีวิตของเราอยางรวดเร็ว ตั้งแตวิธีการทํางานไปจนถึงวิธีการทําสงคราม จึงเปนเรื่องสําคัญยิ่งตอความเจริญรุงเรืองและความมั่นคงอยางตอเนื่องของชาติที่เราตองลงทุนในการวิจัยและพัฒนาเทคโนโลยีใหม"
 BRA_ban_the_communist_party: "สั่งหามพรรคคอมมิวนิสต"
 BRA_ban_the_communist_party_desc: "แมความพยายามกอการกําเริบในป 1935 จะลมเหลว แตขบวนการคอมมิวนิสตยังคงสรางความหวาดหวั่นใหกองทัพและเจาของกิจการในประเทศ บางทีดวยการปราบปรามขบวนการนี้ เราอาจไดรับการสนับสนุนจากกองทัพตอนโยบายของเรามากขึ้น"
 BRA_ban_the_communist_party_dynamic_tt: "§Rเสถียรภาพที่ลดลงจะแปรผันตามความนิยมของพรรคคอมมิวนิสต!§!"
 BRA_posts_for_generals: "ตําแหนงรัฐมนตรีสําหรับนายพล"
 BRA_posts_for_generals_desc: "ดวยการเสนอตําแหนงในคณะรัฐมนตรีใหนายทหารผูมีอิทธิพล เราสามารถลดความกังวลของพวกเขาตอการตัดสินใจของรัฐบาลดวยการใหพวกเขามีสวนรวม ซึ่งนาจะลดความหวาดระแวงตอเจตนาของเราและปองกันไมใหตองนองเลือดอีก"
 BRA_posts_for_generals_tt: "ปลดล็อก §Y$BRA_eurico_gaspar_dutra$§! เปนที่ปรึกษาทางการเมือง: \n ประชากรที่เกณฑได: §Y2%§! \n การสนับสนุนสงคราม: §G+10%§! \n การปองกันของกองพลในดินแดนหลัก: §G+5%§! \n การยอมรับการทูตของประชาธิปไตย: §R-25§!"
 BRA_end_military_interference: "ยุติการแทรกแซงของกองทัพ"
 BRA_end_military_interference_tt: "ความนิยมของฝายไมฝกใฝฝายใดเปลี่ยนแปลง: §G-§![?.Root.party_popularity@neutrality|%0G].\n"
 BRA_end_military_interference_desc: "ดวยการจัดตั้งกองกําลังพิทักษแหงชาติ ในที่สุดเราก็มีความสามารถที่จะจํากัดอิทธิพลของกลุมอํานาจทางทหาร และนํากองทัพของเรามาอยูภายใตการกํากับดูแลของรัฐบาลพลเรือนไดเสียที"
 BRA_free_speech: "เปดกวางการอภิปรายทางการเมือง"
 BRA_free_speech_desc: "เมื่ออิทธิพลของกลุมอํานาจทางทหารเหนือรัฐสภาแหงชาติถูกจํากัดลง โอกาสที่จะเกิดเผด็จการอีกครั้งก็ลดลง บัดนี้ถึงเวลาที่เราจะบัญญัติการคุมครองเสรีภาพในการพูดที่ดีขึ้น และสงเสริมใหพลเมืองมีสวนรวมทางการเมืองมากขึ้น"
 BRA_free_speech_tt: "บุคคลตอไปนี้จะสามารถแตงตั้งเปนที่ปรึกษาทางการเมืองได: \n"
 BRA_the_international_crisis: "วิกฤตการณระหวางประเทศ"
 BRA_the_international_crisis_desc: "โลกไรเสถียรภาพมากขึ้นเรื่อย ๆ ขณะที่ความตึงเครียดระหวางมหาอํานาจเพิ่มสูงขึ้น และขอพิพาทพรมแดนเกา ๆ กลับมาเปนประเด็นหลักในกิจการตางประเทศอีกครั้ง เราตองดําเนินการอยางระมัดระวัง แตก็ตองยื่นมือไปหาชาติประชาธิปไตยอื่นในภูมิภาคเพื่อความมั่นคงรวมกัน"
 BRA_third_republic: "ระเบียบและความกาวหนา"
 BRA_third_republic_desc: "เมื่อเสถียรภาพกลับคืนสูประเทศในที่สุดและภัยคุกคามจากรัฐประหารของกองทัพลดลง เรามีโอกาสที่จะประกาศใชรัฐธรรมนูญที่แข็งแกรงขึ้น ซึ่งมีระบบตรวจสอบและถวงดุลที่เขมแข็ง แตก็เปดใหคณะรัฐมนตรีดําเนินการอยางเด็ดขาดเมื่อจําเปน"
 BRA_united_states_of_brazil: "สหรัฐบราซิล"
 BRA_united_states_of_brazil_desc: "แมเราจะทําสิ่งตาง ๆ มากมายภายใตรัฐธรรมนูญป 1934 เพื่อสงเสริมความเทาเทียมทางการเมืองและเศรษฐกิจ แตเรายังคงถูกจํากัดดวยบทบัญญัติหลายขอ บัดนี้เปนประโยชนของชาติที่จะละทิ้งรัฐธรรมนูญอันจืดชืดนี้ และหันไปใชรัฐธรรมนูญที่คลายกับของมิตรเราในสหรัฐอเมริกา"
 BRA_united_states_of_south_america: "สหรัฐอเมริกาใต"
 BRA_united_states_of_south_america_desc: "ชาติของเราไดกลายเปนประภาคารแหงเสรีภาพ ดึงดูดทุกคนที่มีคุณคาเดียวกับเราใหมาที่นี่ดวยความหวังที่จะเริ่มตนใหม เราควรยอมรับความหลากหลายนี้และแสดงความปรารถนาตออนาคตของเราใหชัดเจนดวยการสถาปนาตนเปนสหรัฐอเมริกาใต"
 BRA_united_states_of_south_america_tt: "ปลดล็อกการตัดสินใจ §Y$BRA_us_of_south_america_cat$§! เพื่อเชิญสมาชิกฝาย§Yประชาธิปไตย§!หรือ§Yไมฝกใฝฝายใด§!ในอเมริกาใตให§Yรวมเขา§!กับ [ROOT.GetNameDef]"
 BRA_bonus_tech_slot: "กองทุนเทคโนโลยีแหงชาติ"
 BRA_bonus_tech_slot_desc: "แมอุตสาหกรรมและกองทัพของเราจะขยายตัวอยางมากในชวงไมกี่ปที่ผานมา แตการรักษาความทัดเทียมทางเทคโนโลยีกับศัตรูตางชาติก็ยากขึ้นเรื่อย ๆ เพื่อรับมือกับเรื่องนี้ เราจะจัดตั้งกองทุนแหงชาติเพื่อลงทุนในเทคโนโลยีเกิดใหม"
 BRA_address_labor_disputes: "จัดการขอพิพาทแรงงาน"
 BRA_address_labor_disputes_desc: "รัฐบาลกอนหนากังวลตอภัยคุกคามของคอมมิวนิสตอยางมีเหตุผล แตแทบไมไดแกไขปญหาที่แทจริงซึ่งทําใหผูคนหันไปหาลัทธิหัวรุนแรง เราจะไมทําผิดพลาดซํ้า และจะมีบทบาทเชิงรุกมากขึ้นในการจัดการขอพิพาทแรงงาน"
 BRA_address_labor_disputes_tt_1: "§Yเหตุการณใหเลือกระหวาง: §!"
 BRA_address_labor_disputes_tt_2: "§Yหรือ:§!"
 BRA_combat_separatism: "ตอตานการแบงแยกดินแดน"
 BRA_combat_separatism_desc: "เมื่อใดก็ตามที่ชาติเผชิญความปนปวนทางการเมือง ผูคนที่มีความคับของใจนอกเมืองหลวงจะเริ่มผลักดันวาระการแบงแยกดินแดนที่คุกคามจะฉีก [ROOT.GetNonIdeologyName] ออกเปนเสี่ยง ๆ เราตองทํามากกวานี้เพื่อสงเสริมอัตลักษณ[ROOT.GetAdjective]รวมกันทั่วประเทศ"
 BRA_war_bonds: "พันธบัตรสงคราม"
 BRA_war_bonds_desc: "เราไมอาจตัดความเปนไปไดที่จะถูกลากเขาสูความขัดแยง ทั้งทางทหารหรือผานการสนับสนุนชาติอื่นทางเศรษฐกิจ ดังนั้นเราควรเริ่มโครงการขายพันธบัตรสงครามเพื่อเปนทุนในการเสริมสรางกําลังอาวุธ"
 BRA_invite_foreign_companies: "เชิญบรรษัทตางชาติ"
 BRA_invite_foreign_companies_desc: "ถึงเวลาที่จะเปดประตูรับทุนตางชาติ เราจะทําเชนนั้นดวยการสรางแรงจูงใจใหบริษัทตางชาติมาตั้งกิจการใน [BRA.GetNonIdeologyName] ซึ่งจะชวยลดการวางงานและเพิ่มรายไดจากภาษี"
 BRA_invite_foreign_companies_tt: "ปลดล็อกการตัดสินใจ §Y$BRA_invite_foreign_companies_cat$§! ทําใหเราสามารถเชิญ§Yองคกรอุตสาหกรรมทางทหาร§!มายัง [BRA.GetNonIdeologyName] จาก §Y[ENG.GetFlag][ENG.GetName]§!, §Y[USA.GetFlag][USA.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§! หรือ §Y[SWE.GetFlag][SWE.GetName]§! \n§Gไดรับโรงงานทหารหรืออูตอเรือ 1 แหงตอ MIO แตละแหงที่เชิญมายัง [BRA.GetNonIdeologyName]§! \n§Rเราจะเชิญ MIO ไดเพียง 1 แหงจากแตละประเทศเทานั้น!§! \n\n§Gเลือกได 4 แหงจากรายการตอไปนี้:§!"
 BRA_pro_labor_agreement: "นโยบายสนับสนุนแรงงาน"

 BRA_romanticize_the_old_empire: "เชิดชูประวัติศาสตรจักรวรรดิ"
 BRA_romanticize_the_old_empire_desc: "มีนักการเมือง ผูนําธุรกิจ หรือพลเมืองที่ไมพอใจมากมาย ซึ่งดวยเหตุผลใดเหตุผลหนึ่ง ตองการเห็นจุดจบของสาธารณรัฐที่ลมเหลวนี้ บางทีดวยการรวมตัวกันรอบประวัติศาสตรจักรวรรดิและความรุงเรืองในอดีต เราอาจรวมพวกเขาทั้งหมดเปนขบวนการเดียวที่เปนปกแผน"
 BRA_vassouras_line: "สนับสนุนสิทธิ์ของเปดรู เองรีกี"
 BRA_vassouras_line_desc: "ความพยายามสรางขบวนการเพื่อเขยาสถานะเดิมทางการเมืองของเราไดนําไปสูเสียงเรียกรองใหฟนคืนประวัติศาสตรจักรวรรดิผานการกลับมาของราชวงศจักรวรรดิ หลายคนกําลังรวมตัวกันสนับสนุนประมุขแหงราชวงศจักรวรรดิบราซิลที่ลี้ภัย เปดรู เองรีกี ในฐานะผูปกครองโดยชอบธรรมของชาติ"
 BRA_petropolis_line: "สนับสนุนสิทธิ์ของเปดรู จี อัลกันตารา"
 BRA_petropolis_line_desc: "เปดรู จี อัลกันตารา เคยเปนประมุขแหงราชวงศจักรวรรดิบราซิลที่ลี้ภัย กอนจะสละสิทธิ์ในราชบัลลังกทั้งหมดเพื่อสมรสกับเคานตเตสเอลีซาเบท ดอบรเชนสกา เมื่อขบวนการฟนฟูราชวงศไดรับแรงสนับสนุนมากขึ้น บัดนี้เขาอางวาการสละสิทธิ์นั้นไมชอบธรรม และเขาคือรัชทายาทโดยชอบธรรม"
 BRA_monarch_choice_1_tt: "§Yเปดรู จี อัลกันตารา§! จะขึ้นเปนประมุขแหงราชวงศจักรวรรดิ \n§Rหาก [ROOT.GetNonIdeologyName] ดําเนินแผนยุทธศาสตร $BRA_constitutional_monarchy$ เสร็จสิ้น จะไดรับจิตวิญญาณแหงชาติตอไปนี้§!:"
 BRA_monarch_choice_2_tt: "§Yเปดรู เองรีกี§! จะขึ้นเปนประมุขแหงราชวงศจักรวรรดิ \n§Rหาก [ROOT.GetNonIdeologyName] ดําเนินแผนยุทธศาสตร $BRA_constitutional_monarchy$ เสร็จสิ้น จะไดรับจิตวิญญาณแหงชาติตอไปนี้§!:"
 BRA_restore_the_coffee_barons: "การเมืองแบบกาแฟใสนม"
 BRA_restore_the_coffee_barons_desc: "เหลาเจาพอกาแฟผูเคยทรงอํานาจและควบคุมการเมือง[ROOT.GetAdjective]มาหลายทศวรรษ ถูกกวาดพนจากอํานาจในการปฏิวัติป 1930 หลายคนยังคงมีอิทธิพลทางเศรษฐกิจอยางมาก และอาจถูกเกลี้ยกลอมใหสนับสนุนขบวนการฟนฟูจักรวรรดิของเราเพื่อแลกกับสัมปทานทางการเมือง"
 BRA_constitutional_monarchy: "การประนีประนอมดวยระบอบราชาธิปไตยภายใตรัฐธรรมนูญ"
 BRA_constitutional_monarchy_desc: "เมื่อขบวนการฟนฟูจักรวรรดิไดรับแรงสนับสนุนมากขึ้นและการสนับสนุนระบอบปจจุบันลดลง เสียงเรียกรองใหหาทางออกแบบประนีประนอมเพื่อสรางเสถียรภาพใหชาติก็เพิ่มขึ้น ขอเสนอที่โดดเดนที่สุดคือการสถาปนาระบอบราชาธิปไตยภายใตรัฐธรรมนูญที่กษัตริยเปนเพียงประมุขในนาม โดยอํานาจทางการเมืองยังคงอยูที่รัฐสภาแหงชาติ"
 BRA_constitutional_monarchy_tt: "ขึ้นอยูกับตัวเลือกกอนหนาระหวาง §Y$BRA_petropolis_line$§! และ §Y$BRA_vassouras_line$§! จะเปดใชจิตวิญญาณแหงชาติอยางใดอยางหนึ่งตอไปนี้:"
 BRA_constitutional_monarchy_tt_2: "§Yหรือ§!"
 BRA_united_kingdom_of_brazil_and_portugal: "สหราชอาณาจักรบราซิลและโปรตุเกส"
 BRA_united_kingdom_of_brazil_and_portugal_desc: "การฟนฟูราชวงศจักรวรรดิบราซิลไดจุดประกายความรูสึกนิยมกษัตริยในโปรตุเกสขึ้นอีกครั้งเชนกัน บางทีเราควรใชโอกาสนี้รวมชาติของเราภายใตกษัตริยองคเดียวอีกครั้ง ทายที่สุดแลว ทั้งสองชาติตางไดประโยชนจากทรัพยากรและความเชี่ยวชาญของกันและกัน"
 BRA_united_kingdom_of_brazil_and_portugal_tt: "ขอรวม §Y[POR.GetFlag][POR.GetNonIdeologyName]§! และ §Y[BRA.GetFlag][BRA.GetNonIdeologyName]§! เขาดวยกัน หาก §Y[POR.GetFlag][POR.GetNonIdeologyName]§! ยอมรับ จะกลายเปนรัฐในอารักขาของบราซิล อยางไรก็ตาม พวกเขาอาจเสนอทางเลือกอื่นหรือปฏิเสธขอเสนอ"
 BRA_claim_the_french_throne: "อางสิทธิ์ในราชบัลลังกฝรั่งเศส"
 BRA_claim_the_french_throne_desc: "ผานราชวงศออรเลอ็อง-บรากังซา ราชวงศของเรามีสิทธิ์ในราชบัลลังกฝรั่งเศสที่ยังไมไดทวงคืน เปดรู กัสตาอู แหงออรเลอ็อง-บรากังซา ปรารถนาจะใชสิทธิ์นี้ขยายอาณาจักรของเรา นี่คือสถานการณที่ตองฉวยใชใหได!"
 BRA_undermine_democracy: "บอนทําลายรัฐสภาแหงชาติ"
 BRA_undermine_democracy_desc: "ผูสนับสนุนที่ทรงอิทธิพลที่สุดของเราไมพอใจกับการประนีประนอมดวยระบอบราชาธิปไตยภายใตรัฐธรรมนูญนี้ พวกเขาเริ่มหมดความอดทนและตองการเห็นกษัตริยใชอิทธิพลที่เพิ่งไดมาลบลางอํานาจรัฐสภาแหงชาติดวยการแตงตั้งคณะรัฐมนตรีชุดใหม"
 BRA_use_the_national_security_law: "ใชกฎหมายความมั่นคงแหงชาติ"
 BRA_use_the_national_security_law_desc: "แมสมาชิกรัฐสภาแหงชาติจะตอตานอยางออนแรง แตคณะรัฐมนตรีชุดใหมของเราก็สถาปนาตนเปนรัฐบาลที่ชอบธรรมของชาติไดสําเร็จ บัดนี้พวกเขาจะใชกฎหมายความมั่นคงแหงชาติที่ตราขึ้นโดยระบอบของ $BRA_getulio_vargas$ เพื่อยืนยันอํานาจเด็ดขาดเหนือกิจการทางการเมือง"
 BRA_amazonian_settlement: "เริ่มการบุกเบิกแอมะซอนอีกครั้ง"
 BRA_amazonian_settlement_desc: "แอมะซอนอุดมดวยทรัพยากรและที่ดิน พรอมสําหรับการใชประโยชน เพื่อกระตุนเศรษฐกิจและสรางแรงจูงใจใหทหารของเราสูรบ เราควรเสนอโอกาสใหผูที่เขารวมกองทัพไดครอบครองที่ดินเหลานี้หลังรับราชการครบระยะเวลาที่เหมาะสม"
 BRA_amazonian_settlement_tt: "ปลดล็อกการตัดสินใจ §Yนิคมทหารในแอมะซอน§! เพื่อพัฒนารัฐในแอมะซอน"
 BRA_empire_of_brazil: "สถาปนาจักรวรรดิบราซิลขึ้นใหม"
 BRA_empire_of_brazil_desc: "เมื่ออํานาจอยูในมือของกษัตริยและรัฐมนตรีที่แตงตั้งอยางมั่นคงแลว ถึงเวลาที่เราจะฟนฟูชาติสูความรุงเรืองในอดีต กาวแรกคือการฟนฟูจักรวรรดิบราซิลและกลับสูคุณคาดั้งเดิมที่จักรวรรดิสรางขึ้นมา"
 BRA_reclaim_territory_in_south_america: "ลัทธิแกแคนซิสแพลทีน"
 BRA_reclaim_territory_in_south_america_desc: "ความอัปยศจากสงครามซิสแพลทีนยังคงแขวนอยูเหนือราชวงศจักรวรรดิแมสงครามอันสิ้นเปลืองจะจบลงไปหนึ่งศตวรรษแลว การยืนยันการอางสิทธิ์ในดินแดนอุรุกวัยอีกครั้งจะชวยจุดประกายความภาคภูมิใจในหมูราษฎรของเราไดอยางมาก และเตือนใหโลกรูวาเราไมใชชาติที่เสื่อมโทรมอยางที่เคยเปนอีกตอไป"
 BRA_demand_portugese_territory: "เรียกรองอาณานิคมโปรตุเกส"
 BRA_demand_portugese_territory_desc: "[POR.GetNonIdeologyName] ในปจจุบันเปนเพียงเปลือกของจักรวรรดิที่ครั้งหนึ่งเคยยิ่งใหญ ขณะที่โลกกําลังวุนวายอยูที่อื่น เราควรใชการทูตเรือปนโนมนาวรัฐบาล[POR.GetAdjective]ใหสงมอบดินแดนโพนทะเลใหแกเรา"
 BRA_demand_portugese_submission: "เรียกรองใหโปรตุเกสยอมสยบทั้งหมด"
 BRA_demand_portugese_submission_desc: "ดินแดนของ [POR.GetNonIdeologyName] ถูกปกครองโดยอํานาจที่ไมชอบธรรม เพราะมีเพียงจักรพรรดิของเราเทานั้นที่มีสิทธิ์ตามประสงคของพระเจาในการปกครองดินแดนเหลานั้น เราจะเรียกรองใหพวกเขายอมมอบดินแดนทั้งหมดแกเรา หรือเราจะยึดมาดวยกําลังหากจําเปน"
 BRA_restoration_of_honor: "ฟนฟูเกียรติภูมิบราซิล"
 BRA_restoration_of_honor_desc: "แมราษฎรจํานวนมากของเราจะเคยสงสัยในการกลับมาของระบอบกษัตริย แตบัดนี้สวนใหญก็พอใจกับผลลัพธ เมื่อพรมแดนของเราขยายออก เศรษฐกิจไดรับการฟนฟู และลําดับชั้นตามธรรมชาติของสังคมไดรับการเสริมใหมั่นคง ในที่สุดเราก็กลาวไดวาเกียรติภูมิของ[ROOT.GetAdjective]ไดรับการฟนฟูแลว"
 BRA_spirit_of_acre_war: "จุดชนวนสงครามอากรีอีกครั้ง"
 BRA_spirit_of_acre_war_desc: "แมภูมิภาคอากรีจะอยูภายใตการควบคุมของเราแลว แตเราสามารถใชความขัดแยงดานพรมแดนทางประวัติศาสตรที่นั่นเปนขออางในการแบงเฉือนโบลิเวียเพิ่มเติม ซึ่งจะทําใหเราเขาถึงทรัพยากรธรรมชาติอันมั่งคั่งที่ยังไมถูกนํามาใช ปอนอุตสาหกรรมของเราไปอีกหลายทศวรรษ"
 BRA_expand_colonial_empire: "ขยายจักรวรรดิอาณานิคม"
 BRA_expand_colonial_empire_desc: "ดวยการขยายตัวโพนทะเลเมื่อไมนานมานี้ บัดนี้เรามีที่มั่นที่จะขยายอาณาเขตเขาสูแอฟริกา แมทวีปสวนใหญยังอยูภายใตการปกครองของมหาอํานาจยุโรป แตก็มีภูมิภาคที่อุดมดวยทรัพยากรมากมายที่พรอมใหยึดครอง"
 BRA_invest_in_the_armed_forces: "ติดสินบนกองทัพ"
 BRA_invest_in_the_armed_forces_desc: "ชนชั้นนําทางทหารมีความภักดีที่ไมแนนอนและหวาดระแวงภัยคุกคามจากคอมมิวนิสต ทั้งภายในและตางประเทศ เราจะใชสิ่งนี้ใหเปนประโยชนดวยการติดสินบนพวกเขาดวยงบประมาณทหารที่เพิ่มขึ้นเพื่อแลกกับการสนับสนุนการปกครองของเรา"
 BRA_royal_colleges: "จัดตั้งราชวิทยาลัยแหง [ROOT.Capital.GetCapitalVictoryPointName]"
 BRA_royal_colleges_desc: "เมื่อไมนานมานี้จักรพรรดิทรงใหความสนใจอยางยิ่งตอสถานะทางวิชาการของชาติ จึงมีพระราชโองการใหจัดตั้งราชวิทยาลัยแหงใหมในเมืองหลวงเพื่อสงเสริมนวัตกรรมทางเทคโนโลยีภายในประเทศ"
 BRA_issue_lordships: "พระราชทานบรรดาศักดิ์"
 BRA_issue_lordships_desc: "ขณะที่เราเริ่มยึดอํานาจเหนืออาณาเขตอันชอบธรรมของเราคืน ภาระในการควบคุมภูมิภาคที่หลากหลายก็กลายเปนภาระหนักสําหรับกษัตริยที่รักของเรา พระองคจึงทรงประกาศวาจะพระราชทานบรรดาศักดิ์พรอมที่ดินใหมแกผูที่ไววางใจได เพื่อชวยในการปกครองราชอาณาจักร"
 BRA_promote_agriculture: "ฟนฟูเจาพอกาแฟ"
 BRA_promote_agriculture_desc: "‘เจาพอกาแฟ’ มีบทบาทสําคัญในการชวยใหเราไดรับการสนับสนุนมากพอที่จะฟนฟูระบอบกษัตริย บัดนี้เราจะตอบแทนพวกเขาดวยการนําพวกเขาเขาสูรัฐบาลเพื่อกํากับดูแลการฟนฟูเศรษฐกิจ"
 BRA_promote_agriculture_tt: "§Yปลดล็อกที่ปรึกษา:§!"
 BRA_acceptance_tt: "หากพวกเขายอมรับ: \n"

 BRA_prepare_for_second_intentona: "Intentona Comunista ครั้งที่สอง"
 BRA_prepare_for_second_intentona_desc: "ความพยายามครั้งแรกของเราในการโคนลมรัฐกระฎมพีของ $BRA_getulio_vargas$ ลมเหลว หากเราไมฟนตัวอยางรวดเร็ว โอกาสใด ๆ ในการปฏิวัติครั้งที่สองจะถูกดับลงในคลื่นกฎหมายตอตานฝายซายระลอกใหมที่เขากําลังผาน เราตองจุดไฟแหงการปฏิวัติขึ้นอีกครั้ง กอนที่สิ่งนั้นจะเกิดขึ้น"
 BRA_seek_soviet_support: "แสวงหาการสนับสนุนจาก[SOV.GetAdjective]"
 BRA_seek_soviet_support_desc: "หากเราจะประสบความสําเร็จและเปลี่ยนประเทศของเราใหเปนสังคมคอมมิวนิสตที่ประชาชนของเราสมควรไดรับ เราจําเปนตองไดรับการสนับสนุนจากภายนอก [SOV.GetNameDefCap]เคยชวยเรามากอน จึงสมควรที่เราจะขอการสนับสนุนจากพวกเขาอีกครั้งเพื่อรับประกันความสําเร็จของเรา"
 BRA_radicalize_the_proletariat: "ปลุกระดมชนชั้นกรรมาชีพใหหัวรุนแรง"
 BRA_radicalize_the_proletariat_desc: "ความพยายามยึดอํานาจครั้งลาสุดของเราลมเหลวสวนใหญเพราะเราไมไดรับการสนับสนุนที่ประสานกันอยางเพียงพอจากคนงาน เราตองเผยแพรสารของเราไปยังพวกเขาและทําใหพวกเขาภักดีตอเราอยางที่สุด"
 BRA_launch_the_revolution: "เริ่มการปฏิวัติ"
 BRA_launch_the_revolution_desc: "เวลามาถึงแลว เราจะแกไขสิ่งที่เราทําพลาดไปในป 1935 ระหวาง Intentona Comunista เราตองลุกขึ้นตอตาน [BRA.GetLeader] และรัฐบาลกดขี่ของเขา"
 BRA_launch_the_revolution_tt: "เริ่ม§Yการปฏิวัติคอมมิวนิสต§!ใน[BRA.GetNameDef] จํานวนกองพลที่เราจะไดรับขึ้นอยูกับระดับการสนับสนุน§Y[BRA.GetCommunistParty]§!\n§Rสิ่งนี้จะนําไปสูสงครามกลางเมืองคอมมิวนิสตกับพรรคประชาธิปไตย!§!"
 BRA_tech_slot_3: "มหาวิทยาลัยประชาชนแหง[BRA.GetNonIdeologyName]"
 BRA_tech_slot_3_desc: "การจะสรางชาติใหเขมแข็ง เราตองมีระบบการศึกษาที่กาวหนา ซึ่งเปดทางใหเราเขาถึงผูมีสติปญญาปราดเปรื่องที่สุดใน[BRA.GetName]ไดโดยงาย การเขาไปมีบทบาทตั้งแตเนิ่นๆ จะทําใหเรามีอิทธิพลในการกําหนดสาขาวิชาของสถาบัน การอุทิศมหาวิทยาลัยแหงนี้ใหแกประชาชนเปนหนทางหนึ่งที่จะทําใหมั่นใจวาในปตอๆ ไป ปญญาชนเหลานี้จะยินดีอยูและชวยเหลืออุดมการณของเรา"
 BRA_international_brigades: "กองพลนอยนานาชาติ"
 BRA_international_brigades_desc: "สงครามกําลังลุกโชนไปทั่วโลก แมเราจะไมไดเขารวมโดยตรง แตในฐานะสหายที่ดี เปนหนาที่ของเราที่จะสงความชวยเหลือไปยังผูที่ตองการเมื่อเรามีกําลังพอจะทําได การกระโจนเขาสูสงครามอยางบาบิ่นไมเกิดประโยชนอันใด ในตอนนี้เราควรมุงสงอาสาสมัครไปแทน"
 BRA_soviet_economic_aid: "ความชวยเหลือทางเศรษฐกิจจากโซเวียต"
 BRA_soviet_economic_aid_desc: "หลังจากถูกบริหารโดยผูนําที่มีแนวคิดตางจากเรามาหลายป เศรษฐกิจของเราก็ยังไมอยูในจุดที่เราตองการ เพื่อเรงฟนฟูเศรษฐกิจใหกลับสูสภาพที่พึงปรารถนา เราควรพิจารณาขอความชวยเหลือจากประเทศอื่นที่มีแนวคิดคลายคลึงกับเรา"
 BRA_license_soviet_designs: "ขอตกลงสิทธิบัตรการผลิตกับ[SOV.GetNameDef]"
 BRA_license_soviet_designs_desc: "การวิจัยของเราลาหลังมหาอํานาจทั้งหลาย การสรางขีดความสามารถเพื่อไลตามใหทันตองใชเวลานาน แตระหวางนั้น เราอาจหาทางขออนุญาตผลิตยุทโธปกรณของ[SOV.GetNameDef]ใน[BRA.GetNameDef] เมื่อพิจารณาถึงตนทุนของขอตกลงเชนนี้ เราควรพยายามตอรองขอสวนลดสักเล็กนอย"
 BRA_license_soviet_designs_tt: "([SOV.GetFlag]§Y[SOV.GetName]§!) จะไดรับเหตุการณ '§Y[BRA.GetNameDefCap]ขอทําขอตกลงสิทธิการผลิต§!' \n \n พวกเขามีแนวโนมจะตอบรับมากขึ้นหากมี§Yความเห็นตอเราในระดับสูง!§!"
 BRA_purchase_soviet_equipment: "จัดซื้อยุทโธปกรณโซเวียต"
 BRA_purchase_soviet_equipment_desc: "กองทัพของเราขาดแคลนยุทโธปกรณอยางมาก เพื่อขยายกองทัพใหใหญยิ่งขึ้น เราตองการโอกาสซื้อยุทโธปกรณในราคาที่เปนธรรมจากพันธมิตรที่ไวใจได ดวยการเจรจาสักเล็กนอย เรานาจะทําขอตกลงกับ[SOV.GetNameDef]ได"
 BRA_infilitrate_the_military: "แทรกซึมกองทัพ"
 BRA_infilitrate_the_military_desc: "แมนายทหารชั้นสูงยังคงรังเกียจอุดมการณของเรา แตนายทหารชั้นผูนอยจํานวนมากกําลังรอโอกาสที่จะโคนผูบังคับบัญชาของตน หากเราแทรกซึมเขาไปในหมูพวกเขาได เราก็จะโนมนาวพวกเขามาเขาขางเราได"
 BRA_infilitrate_the_military_tt: "เมื่อดําเนินแผนยุทธศาสตรนี้ §Yกองทัพ§!สวนที่มากขึ้นจะเขารวมกับฝายคอมมิวนิสตใน§Rสงครามกลางเมือง§!ที่กําลังจะมาถึง"
 BRA_seek_international_support: "แสวงหาการสนับสนุนจากนานาชาติ"
 BRA_seek_international_support_desc: "แมเราจะทุมเทอยางมากเพื่อฟนฟูขบวนการคอมมิวนิสต แตเรายังออนแอเมื่อเทียบกับกองกําลังที่เราตองเอาชนะ ดังนั้นเราตองไดรับการสนับสนุนจากบุคคลและรัฐบาลที่มีแนวคิดเดียวกันทั่วโลก"
 BRA_join_the_comintern: "เขารวมโคมินเทิรน"
 BRA_join_the_comintern_desc: "[BRA.GetNameDef]ยืนอยูนอกโคมินเทิรนมานานเกินไปแลว ทั้งที่ยังพึ่งพาการสนับสนุนจากโคมินเทิรน ถึงเวลาแลวที่เราจะขอเขารวมอยางเปนทางการ!"
 BRA_create_faction: "สหกรณสังคมนิยมละตินอเมริกา"
 BRA_create_faction_desc: "ยังมีอีกหลายชาติที่มีแนวคิดเดียวกับเราวาสังคมคอมมิวนิสตควรเปนอยางไร ถึงเวลาแลวที่เราจะเปดรับความรวมมือกับชาติเหลานี้ เพื่อที่เราจะไดรวมกันยืนหยัดเพื่ออุดมการณของเรา!"

 BRA_free_prestes: "ปลดปลอยเปรสเตสจากคุก"
 BRA_free_prestes_desc: "$BRA_luis_carlos_prestes$ อยูแถวหนาของการเมืองหัวรุนแรงของ[ROOT.GetAdjective]มาหลายปแลว ทวาเมื่อการลุกฮือคอมมิวนิสตครั้งแรกลมเหลว เขาก็ถูกจับกุมพรอมกับแกนนําของขบวนการ หากเราหวังจะไดรับชัยชนะ เราตองปลดปลอยผูนําของเราจากเงื้อมมือของ $BRA_getulio_vargas$"
 BRA_free_prestes_tt: "เมื่อโคนลมรัฐบาลปจจุบันสําเร็จ ที่ปรึกษาจาก§Yพรรคคอมมิวนิสต§!ที่นิยม[SOU.GetAdjective]จะพรอมใหแตงตั้ง"
 BRA_revive_the_anl: "ฟนฟูพันธมิตรปลดปลอยแหงชาติ"
 BRA_revive_the_anl_desc: "แมพันธมิตรปลดปลอยแหงชาติจะลมเหลวในการโคนลมระบอบเผด็จการของ $BRA_getulio_vargas$ แตก็ยังมีอิทธิพลตอชาว[BRA.GetAdjective]นับลานที่หวังจะเห็นการเปลี่ยนแปลงที่แทจริง เราตองปลุกขบวนการนี้ขึ้นมาใหมกอนที่ความหวังนั้นจะดับสูญไปโดยสิ้นเชิง"
 BRA_revive_the_anl_tt: "ระหวางการปฏิวัติคอมมิวนิสตที่กําลังจะมาถึง จะไดรับ§Yกองกําลังอาสาคอมมิวนิสต§!เพิ่มอีก §G2§! กองพล"
 BRA_revive_the_anl_tt_2: "เมื่อโคนลมรัฐบาลปจจุบันสําเร็จ ที่ปรึกษาที่ฝกใฝ§Yพันธมิตรปลดปลอยแหงชาติ§!จะพรอมใหแตงตั้ง"
 BRA_align_with_moscow: "เขาขาง[SOU.Capital.GetCapitalVictoryPointName]"
 BRA_align_with_moscow_desc: "สมาชิกพรรคของเราบางคนไดรับเกียรติไปเยือน[SOU.Capital.GetCapitalVictoryPointName] เมื่อกลับมา พวกเขาตางพูดชื่นชมวิธีบริหารประเทศแบบ[SOU.GetAdjective]อยางมาก เราควรพิจารณาผูกสัมพันธกับ[SOU.GetNameDef]ใหใกลชิดยิ่งขึ้น"
 BRA_oust_prestes: "ปองกันลัทธิบูชาตัวบุคคล"
 BRA_oust_prestes_desc: "สังคมคอมมิวนิสตไมควรถูกบริหารโดยคนเพียงไมกี่คน แมจะมีบางประเทศที่ทําเชนนั้นได แตเราเกรงวาอีกไมนานประเทศเหลานั้นจะกลายเปนเพียงลัทธิบูชาตัวบุคคล เพื่อไมใหชะตากรรมเชนนั้นเกิดขึ้นกับเรา เราควรใหสภา ANL เขาควบคุมกิจการทางการเมืองของประเทศ"
 BRA_soviet_arms_industry: "เชิญอุตสาหกรรมอาวุธโซเวียต"
 BRA_soviet_arms_industry_desc: "[BRA.GetNameDef]มีอุตสาหกรรมทหารที่แข็งแกรง แตระยะหลังเราก็มองหาหนทางเสริมความแข็งแกรงใหมากยิ่งขึ้น องคกรอุตสาหกรรมทหาร[SOV.GetAdjective]บางแหงแสดงความสนใจที่จะเขามาดําเนินการใน[BRA.GetNameDef] เราควรพิจารณาเชิญพวกเขาเขามา"
 BRA_spread_the_revolution: "ขยายการปฏิวัติ"
 BRA_spread_the_revolution_desc: "การปฏิวัติที่เรานํามาสู[BRA.GetNameDef]ไดรับการชื่นชมอยางยิ่งจากประชาชน เมื่อกิจการภายในมีเสถียรภาพแลว ก็ถึงเวลาที่เราจะคิดการใหญและมองออกไปนอกพรมแดนของเรา"
 BRA_smash_fascism: "บดขยี้ฟาสซิสตในอเมริกาใต"
 BRA_smash_fascism_desc: "ยังมีชาติตางๆ ในทวีปอเมริกาใตที่การปฏิวัติยังไปไมถึง ชนชั้นกรรมาชีพในบางชาติยังคงถูกกดขี่อยางหนักภายใตผูปกครองฟาสซิสต เราจะปลอยใหเปนเชนนี้ไมได เราตองปลดปลอยเพื่อนกรรมกรของเรา!"
 BRA_anti_imperialism: "ขับไลจักรวรรดิ"
 BRA_anti_imperialism_desc: "ชาติบางแหงในละแวกของเรายังไมไดรับเอกราชที่ชอบธรรม ยังคงมีจักรวรรดิที่อางอํานาจควบคุมดินแดนเหลานี้ ลัทธิอาณานิคมและจักรวรรดินิยมควรเปนเรื่องของอดีต และถึงเวลานานแลวที่เราจะแสดงใหจักรวรรดิเหลานั้นเห็นอยางชัดเจน"
 BRA_anti_imperialism_tt: "ปลดล็อกการตัดสินใจ§Yตอตานลัทธิอาณานิคมในอเมริกาใต§! เพื่อปลดปลอยอาณานิคมในอเมริกาใต"
 BRA_jaguar_diplomacy: "การทูตเสือจากัวร"
 BRA_jaguar_diplomacy_desc: "เมื่อไมนานมานี้[CHI.GetName]ใชสัตวพื้นเมืองของตนเปนของขวัญทางการทูต แมจะมีความแตกตางทางอุดมการณ แตดูเหมือนวาวิธีนี้จะไดผลในการคลี่คลายความสัมพันธที่ตึงเครียดกับรัฐบาลตางชาติ บางทีเราอาจใชวิธีเดียวกันเพื่อโนมนาวมหาอํานาจไมใหเขามาแทรกแซงกิจการของเรา"
 BRA_jaguar_diplomacy_tt: "ปลดล็อกการตัดสินใจ§Y$BRA_jaguar_diplomacy_cat$§! เพื่อเอาใจมหาอํานาจที่ตอตานคอมมิวนิสตในอเมริกาใต ดวยการทําสนธิสัญญาไมรุกรานกับพวกเขา"
 BRA_sway_the_neighbors: "โนมนาวเพื่อนบาน"
 BRA_sway_the_neighbors_desc: "เราตองใชทุกวิถีทางเพื่อปลุกจิตสํานึกทางชนชั้นในหมูเพื่อนบาน และสนับสนุนพวกเขาใหสลัดพันธนาการแหงการกดขี่ของชนชั้นนายทุน"
 BRA_sway_the_neighbors_tt: "ปลดล็อกการตัดสินใจ§Y$BRA_sway_the_neighbors_cat$§! เพื่อสงเสริมคอมมิวนิสตในชาติตางๆ ของอเมริกาใต"
 BRA_julieta_soria: "ฆูเลียตา โซเรีย"
 BRA_union_of_latin_american_socialist_republics: "กอตั้ง ULASR"
 BRA_union_of_latin_american_socialist_republics_desc: "ขบวนการปฏิวัติของเรายังคงกัดกรอนโครงสรางของสังคมนายทุนไปทั่วทั้งทวีป เห็นไดชัดวาเราไมใชขบวนการของชาว[ROOT.GetAdjective]อีกตอไป แตเปนขบวนการของชาวอเมริกาใต และถึงเวลาแลวที่โครงสรางทางการเมืองของเราจะสะทอนการเปลี่ยนแปลงนั้นไดดียิ่งขึ้น"
 BRA_smash_democracy: "ยุติทุนนิยมในอเมริกาใต"
 BRA_smash_democracy_desc: "ประชาธิปไตยแบบนายทุนและทุนนิยมยังคงบอนทําลายสิทธิและความเปนอยูของชาวอเมริกาใตจํานวนมาก เราตองทําทุกวิถีทางเพื่อปลดปลอยสหายของเราทั่วทวีปจากผูกดขี่"
 BRA_kgbrazil: "[BRA_kgbrazil_key]"
 BRA_create_kgbrazil_with_agents: "กอตั้ง EICI"
 BRA_kgbrazil_just_add_operatives: "ความรวมมือดานขาวกรองกับ[SOU.GetAdjective]"
 BRA_kgbrazil_no_lar: "เสริมแกรงแนวรบขอมูลขาวสาร"
 BRA_kgbrazil_cangaco: "เครือขายโกอิเตยรุส"
 BRA_kgbrazil_desc: "[BRA_kgbrazil_desc_key]"
 BRA_create_kgbrazil_with_agents_desc: "ขาวกรองและขอมูลเกี่ยวกับศัตรูเปนองคประกอบสําคัญยิ่งตอความสามารถในการปกปองประเทศและผลประโยชนของเราเมื่อจําเปน การกอตั้งหนวยขาวกรองที่ทรงพลังอาจตองใชเวลา แตเราก็มีหนวยงานตางชาติที่มีอุดมการณเดียวกันคอยชวยเหลือในภารกิจนี้"
 BRA_kgbrazil_just_add_operatives_desc: "ขาวกรองและขอมูลเกี่ยวกับศัตรูเปนองคประกอบสําคัญยิ่งตอความสามารถในการปกปองประเทศและผลประโยชนของเราเมื่อจําเปน หนวยขาวกรองของเราทํางานหนักมากในชวงหลัง แตจะยิ่งดีขึ้นอีกหากเราดึงสายลับโซเวียตผูมีประสบการณมารวมงาน"
 BRA_kgbrazil_no_lar_desc: "ขาวกรองและขอมูลเกี่ยวกับศัตรูเปนองคประกอบสําคัญยิ่งตอความสามารถในการปกปองประเทศและผลประโยชนของเราเมื่อจําเปน เราควรใหความสําคัญกับการตามทันความตองการดานเทคโนโลยี ทั้งเพื่อรวบรวมขาวกรองของศัตรู และเพื่อปกปองขอมูลออนไหวของเราจากพวกเขา"
 BRA_robert_ivanov: "โรเบิรต อีวานอฟ"
 BRA_nadiya_morozova: "นาดียา โมโรโซวา"

 BRA_collectivization_of_transport: "รวมการขนสงเปนของสวนรวม"
 BRA_collectivization_of_transport_desc: "ระบบขนสงของเราทรุดโทรมและจําเปนตองจัดระเบียบใหมอยางเรงดวน เพื่อใหใชงานไดอยางมีประสิทธิภาพยิ่งขึ้นตามความตองการของเรา การรวมระบบขนสงเปนของสวนรวมจะมอบอํานาจใหกรรมกรดําเนินการปฏิรูปที่จําเปนเหลานี้ในแบบที่พวกเขาเห็นสมควร"
 BRA_nationalization_of_industry: "โอนอุตสาหกรรมเปนของรัฐ"
 BRA_nationalization_of_industry_desc: "อุตสาหกรรมพลเรือนของเรายังไมไดถูกโอนเปนของรัฐ เมื่ออยูในมือของเจาของเอกชนที่มุงแสวงหากําไรมากกวาตอบสนองความตองการของประชาชนและประเทศ ประสิทธิภาพก็ตกตํ่าลงอยางมาก เพื่อประโยชนของประชาชนทุกคนใน[BRA.GetNameDef] เราตองโอนอุตสาหกรรมเปนของรัฐและขยายอุตสาหกรรมใหกวางขวางขึ้น"
 BRA_rapid_industrialization: "เรงรัดการพัฒนาอุตสาหกรรม"
 BRA_rapid_industrialization_desc: "การลงทุนในอุตสาหกรรมพลเรือนของเราดูเหมือนจะใหผลตอบแทนอยางงดงาม ทั้งตอกรรมกรและประเทศ บางทีเราควรพิจารณาลงทุนในลักษณะเดียวกันกับอุตสาหกรรมทหารภายในประเทศ"
 BRA_collectivization_of_agriculture: "รวมเกษตรกรรมเปนของสวนรวม"
 BRA_collectivization_of_agriculture_desc: "ภาคเกษตรกรรมของเรากระจัดกระจายและทํางานไดไมมีประสิทธิภาพเทาที่ควร ดวยการรวมภาคเกษตรเปนของสวนรวมและมอบใหกรรมกรรวมกันดําเนินการปฏิรูปที่จําเปนเอง เราจะแกไขปญหานี้และปญหาอื่นๆ อีกมากได"
 BRA_allow_the_church_to_operate: "โอบรับนักเทววิทยาสายสังคมนิยม"
 BRA_allow_the_church_to_operate_desc: "ขบวนการใหมในหมูนักบวชเริ่มหยั่งรากในอเมริกาใต นักบวชเหลานี้เรียกรองนโยบายแนวสังคมนิยมที่จะยกระดับประชาชนผูยากไรที่สุดของเราใหพนจากความยากจนอยางถาวร บางทีเราควรโอบรับนักเทววิทยาหัวกาวหนาเหลานี้ แทนที่จะทําใหชนชั้นกรรมาชีพผูศรัทธาที่สนับสนุนพวกเขาโกรธเคือง"
 BRA_state_atheism: "รัฐอเทวนิยม"
 BRA_state_atheism_desc: "เพื่อใหมั่นใจวาจิตใจของประชาชนจะไมเต็มไปดวยความคิดที่ไมพึงประสงค เราตองทําใหแนใจวาโฆษณาชวนเชื่อเชนนั้นจะไมถูกเผยแพรที่ใดไดเลย วิถีเกาแกของนักเทววิทยา[BRA.GetAdjective]และคําสอนของพวกเขาขัดแยงอยางสิ้นเชิงกับสิ่งที่เราตองการจากประชาชน เราจะปลอยใหเปนเชนนี้ตอไปไมไดอีกแลว!"
 BRA_support_industrialists: "สนับสนุนนักอุตสาหกรรม"
 BRA_support_industrialists_desc: "แมประชากรของเราจะมีกรรมกรมากกวานายทุน แตนายทุนกลับควบคุมความมั่งคั่งและทรัพยากรไวมากกวาอยางเห็นไดชัด เราควรออกนโยบายที่จํากัดสิทธิของกรรมกร และเปดใหนักอุตสาหกรรมดําเนินกิจการไดอยางมีประสิทธิภาพยิ่งขึ้นเพื่อประโยชนของเศรษฐกิจโดยรวม"
 BRA_reward_army_loyalty: "ตอบแทนความภักดีของกองทัพ"
 BRA_reward_army_loyalty_desc: "กองทัพมีบทบาทขาดไมได ทั้งในการผลักดันเราขึ้นสูอํานาจและในการรักษาอํานาจนั้นไว ถึงเวลาแลวที่เราจะตอบแทนความภักดีของพันธมิตรดวยการจัดสรรทรัพยากรใหโครงการโครงสรางพื้นฐานของกองทัพเพิ่มขึ้น"
 BRA_reinvigorate_the_navy: "ฟนพลังกองทัพเรือ"
 BRA_reinvigorate_the_navy_desc: "นายทหารเรือสนับสนุนขบวนการบูรณาการนิยมมาชานาน แมในยามที่การทําเชนนั้นไมเปนที่นิยมของสาธารณชน เพื่อตอบแทนการสนับสนุนอันยาวนานนี้ เราจะเพิ่มงบประมาณใหพวกเขาเริ่มกระบวนการฟนฟูกองเรือที่เกาแก"
 BRA_establish_caloi: "กอตั้งโรงงานกาลอย"
 BRA_establish_caloi_desc: "ความตึงเครียดที่ทวีขึ้นทั่วโลกทําใหการนําเขาจักรยานและชิ้นสวนจากยุโรปและอเมริกาเหนือเปนไปไดยาก ดวยยางและเหล็กกลาที่เรามีอยางอุดมสมบูรณ บางทีเราควรกอตั้งโรงงานจักรยานของเราเองและนําจักรยานมาใชในกองทัพ"
 BRA_us_brazil_technology_exchange: "การแลกเปลี่ยนเทคโนโลยี[USA.GetAdjective]-[ROOT.GetAdjective]"
 BRA_us_brazil_technology_exchange_desc: "ในชวงหลายปที่ผานมา เราไดพัฒนาความเชี่ยวชาญทางเทคโนโลยีของชาติไปอยางมาก แตเรายังมีอีกมากที่ตองเรียนรูจากมิตรของเราใน[USA.GetNameDef] บางทีเราอาจชักชวนใหพวกเขาแบงปนความรูเพื่อแลกกับความรูของเรา"
 BRA_us_brazil_technology_exchange_tt: "หาก[USA.GetFlag]§Y[USA.GetNameDef]§!ตอบรับขอเสนอ:"
 BRA_depose_vargas: "ปลด[ROOT.GetLeader]"
 BRA_depose_vargas_desc: "[ROOT.GetLeader]กลายเปนภาระไปแลว แมเขาจะเปนนักการเมืองที่เชี่ยวชาญ แตประชาชนก็อดทนตอคนคนเดียวไดเพียงเทานั้น หากเราไมตองการถลํากลับสูความยากแคน เราตองโคนเขาลงและแทนที่ดวยผูนําจากกองทัพที่เปนที่ยอมรับมากกวา"
 BRA_equality_for_women: "ความเสมอภาคของชนชั้นกรรมาชีพ"
 BRA_equality_for_women_desc: "ระเบียบเกาของชนชั้นนายทุนไมวาในรูปแบบใดตองถูกทลายลง ดวยเหตุนี้ สตรีและชนกลุมนอยในบราซิลซึ่งถูกรัฐมองขามมานาน ถึงเวลาแลวที่เราจะแกไขความคับของใจทางประวัติศาสตรของพวกเขา เราตองสงเสริมใหพวกเขาใชความสามารถเพื่อพัฒนาสาธารณรัฐกรรมาชีพของเราดวย"
 BRA_equality_for_women_tt: "ปลดล็อก §Y$BRA_olga_benario_prestes$§! เปนผูนําหนวย"

 BRA_italian_cooperation: "การแบงแอฟริกาแบบ[ITA.GetAdjective]-[ROOT.GetAdjective]"
 BRA_italian_cooperation_desc: "ขณะที่จักรวรรดิเกาพากันลมสลาย การแยงชิงแอฟริการะลอกใหมกําลังกอตัวขึ้น ดวยความสัมพันธพิเศษที่เรามีกับ[ITA.GetNameDef] เรามีโอกาสที่จะจับจองดินแดนสวนหนึ่งของทวีปนี้ไวเปนของเราเอง"
 BRA_german_cooperation: "ครองแอตแลนติกใต"
 BRA_german_cooperation_desc: "มหาสมุทรแอตแลนติกถูกกองทัพเรืออเมริกันและอังกฤษครอบงํามานานเกินไปแลว ดวยความรวมมือกับ[GER.GetNameDef] เราพรอมแลวที่จะขับไลพวกเขาออกไปและยึดครองแอตแลนติกไวเปนของเรา"
 BRA_german_cooperation_tt: "ไดรับ§Yการอางสิทธิ์§!เหนือหมูเกาะใน§Yมหาสมุทรแอตแลนติกใต§!ที่ไมไดเปนของ[ROOT.GetNonIdeologyName]หรือ[GER.GetNonIdeologyName]"
 BRA_german_cooperation_tt_2: "ไดรับ §Y10§! §Yเรือดํานํ้า Type IIA รุนแรก§!ของ[GER.GetAdjective]"
 BRA_attack_bolivia: "ยึดครองแอมะซอน"
 BRA_attack_bolivia_desc: "ปาฝนแอมะซอนเปนของ[BRA.GetAdjective]โดยแท การที่[BOL.GetNameDef]ยังคงยึดครองบางสวนของมันอยูเปนสิ่งที่เราไมอาจยอมรับไดอีกตอไป"
 BRA_attack_chile: "ชิงโจมตีกอน"
 BRA_attack_chile_desc: "ตราบใดที่ชาว[CHL.GetAdjective]ยังซอนตัวอยูหลังเทือกเขา ปกตะวันตกของเราก็ไมมีวันปลอดภัยอยางแทจริง ดังนั้นเราตองกําจัดรัฐ[CHL.GetAdjective]และผนวกดินแดนของมันเขามาเปนของเรา"
 BRA_panama_push: "บุกสูปานามา"
 BRA_panama_push_desc: "หากเราจะครองทวีปนี้ไวใหได เราตองเคลื่อนไหวอยางรวดเร็วและบดขยี้ศัตรูกอนที่พวกมันจะทันตั้งตัว"
 BRA_unify_south_america: "อาเมริกาดูซูล"
 BRA_unify_south_america_desc: "อเมริกาใตตกอยูใตอํานาจของเราแลวดวยพลังและความกลาหาญของประชาชน บัดนี้เราตองเริ่มภารกิจอันยากลําบากในการรวมทวีปนี้ใหเปนหนึ่งภายใตการปกครองและวัฒนธรรมของเรา"
 BRA_unify_south_america_tt: "ปลดล็อกการตัดสินใจเพื่อรับ§Yดินแดนหลัก§!บนดินแดนที่ครอบครองใน§Yอเมริกาใต§!"
 BRA_sway_the_cangaco: "ดึงกังกาซูมาเปนพวก"
 BRA_sway_the_cangaco_desc: "กลุมกังกาซูตอสูกับระบอบการปกครองตาง ๆ ที่ครองอํานาจเหนือประเทศมาหลายป แมจะไมใชพวกมารกซิสตเลยก็ตาม แตโจรกลุมนี้ไดรับการสนับสนุนอยางแข็งขันจากชาวนาในชนบทในเรื่องการกระจายความมั่งคั่งในทองถิ่น บางทีเราอาจดึงพวกเขาพรอมประสบการณของพวกเขาเขาสูขบวนการปฏิวัติของเราได?"
 BRA_sway_the_cangaco_tt: "§Rนํา§!การตัดสินใจ §Y$BRA_cangaceiro_decision_cat$§! §Rออก ทําใหเราไมสามารถปราบปรามกังกาซูในรัฐที่ไดรับผลกระทบได!§! \n\nไดรับหนวยกองกําลังอาสากังกาซู §G3§! หนวยเมื่อสงครามกลางเมืองปะทุหรือรัฐบาลกลายเปน§Yคอมมิวนิสต§!"
 BRA_cangaco_coup: "รัฐประหารกังกาซู"
 BRA_cangaco_coup_desc: "แมการปฏิวัติจะใหคํามั่นไวมากมาย แตผูนําขบวนการกลับลังเลและจมอยูกับการถกเถียงเชิงลัทธิวาควรยึดหลักการใด เมื่อไดรับการสนับสนุนจากประชาชนมากกวาที่เคย ถึงเวลาแลวที่กังกาซูจะเขากุมอํานาจประเทศและตัดรากถอนโคนการคอรรัปชันที่หัวใจของมันใหสิ้นซาก "
 BRA_south_american_defense_cooperation: "การซอมรบรวมแหงอเมริกาใต"
 BRA_south_american_defense_cooperation_desc: "ทวีปของเรามีความหลากหลายทั้งผูคนและภูมิประเทศ การซอมรบรวมกับเพื่อนบานจะชวยใหประชาชนของเราเขาใจไมเพียงแควิธีการรบของกันและกัน แตยังรวมถึงวิถีชีวิตของกันและกันดวย"
 BRA_south_american_defense_cooperation_tt: "§Yผูนํากองทัพ§!ทุกคนของ§Yสมาชิกฝาย§!ทุกประเทศจะมีโอกาส §G50%§! ที่จะไดรับ§Yคุณลักษณะภูมิประเทศ§!แบบสุม"
 BRA_foreign_legion: "เลจิเอาเอสตรังเจยรา"
 BRA_foreign_legion_desc: "[ROOT.GetName]กลายเปนที่พักพิงของชาวตางชาติในยามยุงยากเชนนี้ ในหมูพวกเขามีชายมากมายที่พรอมสละชีวิตเพื่อปกปองคุณคาที่เรามีรวมกัน เราควรใหโอกาสพวกเขาไดทําเชนนั้นดวยการรับสมัครเขาเปนกองทหารตางดาว"
 BRA_foreign_legion_tt: "สรางแมแบบ §YLegião Estrangeira§! และวางกําลัง §G3§! หนวยที่[ROOT.Capital.GetCapitalVictoryPointName] \n\nปลดล็อกการตัดสินใจ §Y$BRA_foreign_legion_cat$§! เพื่อเกณฑกองพล §YLegião Estrangeira§! เพิ่มเติม"
 BRA_legion_name: "Legião Estrangeira"
 BRA_south_american_research_cooperation: "สภาวิจัยละตินอเมริกา"
 BRA_south_american_research_cooperation_desc: "ไมใชความลับวาอุตสาหกรรมและมหาวิทยาลัยทั่วละตินอเมริกาไมไดรับเงินทุนในระดับเดียวกับคูแขงหลายราย แตดวยการรวมมือกันผานสถาบันวิจัยรวม เราจะหลีกเลี่ยงการทํางานซํ้าซอนและเรงจังหวะนวัตกรรมทั่วภูมิภาคได"
 BRA_south_american_tech_sharing_group_tt: "หากสมาชิกฝายในอเมริกาใตตกลงเขารวม:"

### ARGENTINA ###
ARG_preparation_for_the_elections: "เตรียมการเลือกตั้ง"
ARG_preparation_for_the_elections_desc: "วาระของอากุสติน เปโดร ฆุสโต ใกลสิ้นสุดลงแลว และ[ARG.GetName]พรอมสําหรับประธานาธิบดีคนใหม แมผูสมัครอยางเปนทางการของรัฐบาลคือโรแบรโต มาริอา ออรติซ แตพรรคฝายคานที่นําโดยมารเซโล ที. เด อัลเบอาร ก็ยังมีโอกาสตอสูเพื่อ[ARG.GetName]ที่เปนประชาธิปไตยมากขึ้น แนวทางของการเลือกตั้งถูกวางไวแลว เหลือเพียงรอดูวาผลจะออกมาอยางไร"
ARG_roberto_maria_ortiz: "โรแบรโต มาริอา ออรติซ"
ARG_roberto_maria_ortiz_desc: "โรแบรโต มาริอา ออรติซ ชนะการเลือกตั้งดวยเสียงขางมากอยางชัดเจน หมายความวากลุมพันธมิตรกองกอรดันเซียจะปกครอง[ARG.GetName]ตอไป ในสุนทรพจนรับตําแหนง เขาเนนยํ้าถึงศรัทธาในประชาธิปไตย และใหคํามั่นวาจะเคารพเสรีภาพและหลักประกันที่รัฐธรรมนูญมอบใหแกประชาชน[ARG.GetAdjective]"
ARG_roberto_maria_ortiz_tt: "§Y$ARG_roberto_maria_ortiz$§! ขึ้นเปนผูนําของ §Y$ARG_neutrality_party_long$§!"
ARG_coup_imminent_tt: "§Rการเลือกแผนยุทธศาสตรนี้จะเริ่มภารกิจจับเวลาความไมพอใจในกองทัพ§!"
ARG_defense_and_democracy: "แถลงการณกองกอรดันเซีย"
ARG_defense_and_democracy_desc: "การปองกันประเทศและประชาธิปไตยคือเปาหมายหลักของรัฐบาลออรติซ โดยประธานาธิบดีปรารถนาจะฟนฟู[ARG.GetName]ใหเปนประชาธิปไตยมากขึ้นภายใตการปกครองของกองกอรดันเซีย ซึ่งหมายถึงการเพิ่มงบประมาณทางทหารดวย เพื่อให[ARG.GetName]ปองกันตนเองไดอยางเหมาะสม"
ARG_crack_down_on_corruption: "ปราบปรามการคอรรัปชัน"
ARG_crack_down_on_corruption_desc: "แมจะไดรับเลือกจากการเลือกตั้งที่ทุจริตที่สุดครั้งหนึ่งในประวัติศาสตร[ARG.GetAdjective] แตออรติซก็ตั้งใจเต็มที่ที่จะปราบปรามการคอรรัปชันในรัฐบาล ไมวาจะยอนแยงเพียงใด สิ่งนี้ยอมชวยให[ARG.GetName]แข็งแกรงขึ้น"
ARG_british_cooperation: "เศรษฐกิจแบบอังกฤษ"
ARG_british_cooperation_desc: "ความรวมมือที่ใกลชิดยิ่งขึ้นกับ[ENG.GetName]จะชวยกระตุนเศรษฐกิจของเรา โดยเฉพาะเมื่อพวกเขามีอิทธิพลมากเพียงใดในการเลือกตั้งครั้งที่ผานมา การปรับปรุงความสัมพันธกับชาว[ENG.GetAdjective]จะนําไปสูขอตกลงการคาที่ดีขึ้นในอนาคต"
ARG_the_castillo_cabinet: "คณะรัฐมนตรีกัสติโย"
ARG_the_castillo_cabinet_desc: "นาเสียดายที่อาการปวยที่ทรุดหนักลงทําใหประธานาธิบดีออรติซเตรียมยื่นใบลาออก ผูที่ขึ้นมาแทนคืออดีตรองประธานาธิบดี รามอน กัสติโย ขณะที่ความตึงเครียดระหวางกลุมตาง ๆ ในกองทัพเพิ่มสูงขึ้น กัสติโยจะตองเดินหมากอยางระมัดระวังเพื่อรักษาตําแหนงประธานาธิบดีของเขาไว"
ARG_the_castillo_cabinet_tt: "§Y$ARG_ramon_castillo$§! ขึ้นเปนผูนําของ §Y$ARG_neutrality_party_long$§!"
ARG_import_substitution: "การผลิตทดแทนการนําเขา"
ARG_import_substitution_desc: "ขณะที่ความตึงเครียดทั่วโลกเพิ่มสูงขึ้น การนําเขาจากยุโรปลดลงอยางมาก แมเราจะมีความสัมพันธทางการคาใกลชิดกับชาว[ENG.GetAdjective] แตเศรษฐกิจ[ARG.GetAdjective]จะตองเริ่มทดแทนการนําเขาดวยการเรงพัฒนาอุตสาหกรรม"
ARG_emphasis_on_public_works: "เนนงานโยธาสาธารณะ"
ARG_emphasis_on_public_works_desc: "เพื่อฟนฟูประเทศจากซากปรักหักพังของภาวะเศรษฐกิจตกตํ่าครั้งใหญ เราตองทุมเทเวลาใหกับโครงการงานโยธาสาธารณะมากขึ้น หากเราอัดฉีดเงินสูโครงสรางพื้นฐานทองถิ่น ไมเพียงจะชวยเศรษฐกิจ แตยังยกระดับชีวิตของพลเมือง[ARG.GetAdjective]ดวย"
ARG_towards_a_greater_argentina: "สู[ARG.GetName]ที่ยิ่งใหญกวา"
ARG_towards_a_greater_argentina_desc: "ดวยความพยายามรวมกันในการเพิ่มขีดความสามารถทางอุตสาหกรรมและทุมงบประมาณใหกับงานสาธารณะและโครงสรางพื้นฐาน เราไดวางรากฐานให[ARG.GetName]ผงาดขึ้นจากเถาถานของภาวะเศรษฐกิจตกตํ่าครั้งใหญ ในฐานะมหาอํานาจดาวรุงแหงทวีปอเมริกาใตอยางแทจริง!"
ARG_universidad_de_buenos_aires: "มหาวิทยาลัยบัวโนสไอเรส"
ARG_universidad_de_buenos_aires_desc: "นับตั้งแตการปฏิรูปมหาวิทยาลัยป 1918 มหาวิทยาลัยบัวโนสไอเรสสามารถรักษาสถาบันและผูบริหารที่ปกครองรวมกันและมาจากการเลือกตั้งอยางเปนประชาธิปไตยไวได ในฐานะมหาวิทยาลัยที่ใหญที่สุดใน[ARG.GetName] การลงทุนพัฒนามหาวิทยาลัยแหงนี้จะผลิตบุคลากรที่มีการศึกษาสูงซึ่งพรอมนําประเทศสูอนาคตตอไป"
ARG_consolidating_power: "รวบอํานาจ"
ARG_consolidating_power_desc: "รามอน กัสติโย แสดงอํานาจประธานาธิบดีดวยนโยบายที่เผด็จการกวาประธานาธิบดีคนกอน ๆ เปาหมายของเขาคือรวบอํานาจผานพรรคประชาธิปไตยแหงชาติ และคอย ๆ สลายกองกอรดันเซีย การกระทํานี้ไมไดรอดพนสายตาของคูแขงทางการเมืองและทางทหาร"
ARG_maintain_the_status_quo: "รักษาสถานะเดิม"
ARG_maintain_the_status_quo_desc: "ประคองไวใหมั่นคง ไมมีความจําเปนตองสรางแรงกระเพื่อมมากนักหลังเพิ่งขึ้นสูอํานาจ หากกัสติโยตองการอยูในรัฐบาลตอไป เขาตองระมัดระวังมากขึ้นในการจัดการความไมพอใจที่กําลังกอตัวในกลุมคูแขง"
ARG_march_to_la_casa_rosada: "เดินทัพสูกาซาโรซาดา"
ARG_march_to_la_casa_rosada_desc: "รัฐบาลกัสติโยทําเกินขอบเขตไปแลวในที่สุด ความไมพอใจในกองทัพถึงจุดแตกหักเมื่อประธานาธิบดีสั่งใหเปโดร ปาโบล รามีเรซ รัฐมนตรีวาการกระทรวงกลาโหม ลาออกเพราะไปเจรจากับพรรค UCR ฝายตรงขาม ผูนํากองทัพรวบรวมผูภักดีและเตรียมเดินทัพสูลากาซาโรซาดา "
ARG_march_to_la_casa_rosada_tt: "§Y$ARG_pedro_pablo_ramirez$§! ขึ้นเปนผูนําของ §Y$ARG_militarist_party_long$§!"
ARG_military_coup_happens_tt: "จะยุติ 'ภารกิจรัฐประหารโดยทหารที่ใกลเขามา' โดยปลอยใหกองทัพเขายึดอํานาจ"
ARG_intervenciones_federales: "การแทรกแซงของรัฐบาลกลาง"
ARG_intervenciones_federales_desc: "ขณะที่ภัยคุกคามจากการรัฐประหารโดยทหารตอรัฐบาลของเราทวีความรุนแรงขึ้น เราตองตัดสินใจบังคับใชมาตรการแทรกแซงของรัฐบาลกลาง ดวยการใชเวลาผานกฎหมายนี้ในแตละรัฐ [ARG.GetName]จะเตรียมพรอมรับมือการกอกบฏไดดีขึ้น"
ARG_balancing_act: "เดินบนเสนดาย"
ARG_balancing_act_desc: "เมื่อกองทัพเขาควบคุมรัฐบาลแลว เราสามารถหันไปจับตาพายุที่กําลังกอตัวในยุโรป เนื่องจากทั้งฝายสัมพันธมิตรและฝายอักษะตางมีความสัมพันธกับ[ARG.GetName] เราจึงตองระวังไมใหฝายใดฝายหนึ่งตีตัวออกหาง"
ARG_subdue_dissension: "ปราบความแตกแยก"
ARG_subdue_dissension_desc: "พอกันที กลุมทหารกบฏควบคุมไมไดแลว และเราตองปราบรัฐประหารนี้ใหราบคาบกอนที่มันจะมีโอกาสลุกฮือ แมอาจทําใหการเติบโตของกองทัพสะดุดไปชั่วครู แตก็คุมคาที่จะมีกองทัพที่ภักดีอยูเคียงขางเรา"
ARG_subdue_dissension_tt: "คุณตองบังคับใชการแทรกแซงของรัฐบาลกลางอยางนอย 3 ครั้งเพื่อปลดล็อกแผนยุทธศาสตรนี้!"
ARG_the_american_push: "แรงกดดันจากอเมริกา"
ARG_the_american_push_desc: "ความทุมเทของเราในการรักษาสมดุลความสัมพันธระหวางฝายสัมพันธมิตรกับฝายอักษะไมไดรอดพนสายตาของ[USA.GetName] พวกเขาแสดงชัดวาไมพอใจทาทีกลาง ๆ ของเรา และอาจขอใหเราตัดความสัมพันธกับฝายอักษะอยางเด็ดขาด"
ARG_juan_peron_elected: "ฆวน เปรอน"
ARG_juan_peron_elected_desc: "หลังชวงเวลาแหงความปนปวนทางการเมือง ถึงเวลาแลวที่[ARG.GetNameDef]จะมีผูนําที่เปนที่นิยมและเปนที่รักใคร ดวยคํามั่นสัญญาที่ปลุกความภาคภูมิใจและความมั่นคงในหมูชาวอารเจนตินา ฆวน เปรอน จึงกลายเปนตัวเลือกที่ชัดเจนสําหรับประธานาธิบดีคนใหมของประเทศอันยิ่งใหญของเรา เมื่อมีเอวา ภรรยาที่รักอยูเคียงขาง ก็ถึงเวลาเสริมความแข็งแกรงให[ARG.GetNameDef]เพื่อรับมือพายุที่กําลังมา"
ARG_peronism: "ลัทธิเปรอน"
ARG_peronism_desc: "เมื่อเปรอนขึ้นสูอํานาจ ก็เกิดความเคลื่อนไหวเพื่อสถาปนาขบวนการทางการเมืองใหมบนพื้นฐานแนวคิดและอิทธิพลของประธานาธิบดีเอง ลัทธิเปรอนหรือที่รูจักกันในชื่อลัทธิยุติธรรมนิยม กลายเปนประเด็นถกเถียงในหมูฝายตรงขามของเปรอน บางเปรียบวาเหมือนลัทธิฟาสซิสต ขณะที่บางก็วาเปนการผสมผสานอยางคลุมเครือระหวางชาตินิยม แรงงานนิยม และประชานิยม"
ARG_help_the_allies: "ชวยเหลือฝายสัมพันธมิตร"
ARG_help_the_allies_desc: "ขณะที่สงครามลุกลามหนักขึ้น แรงกดดันจาก[USA.GetName]ใหเราละทิ้งความเปนกลางและเขารวมฝายสัมพันธมิตรอยางเปนทางการก็เพิ่มขึ้น หากเราเลือกเชนนั้น เราจะกลายเปนผูเลนในความขัดแยงระดับโลกนี้อยางเปนทางการ"
ARG_maintain_neutrality: "ปฏิเสธฝายสัมพันธมิตร"
ARG_maintain_neutrality_desc: "แมจะมีแรงกดดันจากฝายสัมพันธมิตร แตการเขาไปพัวพันกับสงครามของพวกเขาไมใชผลประโยชนของเรา เรามีเรื่องในทวีปของเราเองใหใสใจมากพอแลวโดยไมตองกังวลกับความขัดแยงในยุโรป หากสิ่งนี้เสี่ยงตอการถูก[USA.GetName]ควํ่าบาตรก็ชางมัน"
ARG_accept_german_advisors: "รับที่ปรึกษาชาวเยอรมัน"
ARG_accept_german_advisors_desc: "เรารักษาความสัมพันธใกลชิดกับ[GER.GetName]มาโดยตลอด และยอมไดประโยชนอยางแนนอนจากการเชิญผูมีปญญาเฉียบแหลมของพวกเขาจํานวนมากมายัง[ARG.GetName] เพื่อชวยเราพัฒนาเปาหมายตอไป"
ARG_our_own_path: "เสนทางของเราเอง"
ARG_our_own_path_desc: "ตลอดไมกี่ปที่ผานมา เราสามารถมุงเนนที่ตัวเอง อยูนอกความขัดแยงระดับโลกที่ทําลายลางประเทศอื่น ๆ [ARG.GetName]ยืนหยัดดวยตนเอง และเราจะตัดสินใจเองวาเสนทางของเราจะนําไปสูที่ใด ไมวาเราจะเจริญรุงเรืองและเติบโตทางเศรษฐกิจตอไป หรือจะมุงสูเปาหมายการขยายดินแดนของเราเอง ก็ยังตองรอดูกันตอไป"
ARG_change_of_course: "เปลี่ยนแนวทาง"
ARG_align_with_the_monroe_doctrine: "สอดคลองกับลัทธิมอนโร"
ARG_align_with_the_monroe_doctrine_desc: "หลายปมาแลวที่ลัทธิมอนโรเปนนโยบายปองกันการแทรกแซงของยุโรปในซีกโลกตะวันตก แมตอนนี้เราจะเปนพันธมิตรกับมหาอํานาจยุโรป แตเราตองยึดหลักลัทธินี้อยางเต็มที่และปองกันการรุกรานในทวีปอเมริกา"
ARG_envoy_to_london: "ทูตสูลอนดอน"
ARG_envoy_to_london_desc: "[ENG.GetName]เปนหนึ่งในพันธมิตรที่ใกลชิดที่สุดของเรามาหลายป และบัดนี้เมื่อเรายืนหยัดเคียงขางพวกเขาตอตานศัตรู ก็ควรสงผูแทนชาว[ARG.GetAdjective]ไปยังลอนดอนเพื่อกระชับความสัมพันธกับรัฐบาล[ENG.GetAdjective]"
ARG_study_the_battle_of_the_river_plate: "ศึกษายุทธนาวีแมนํ้าเพลต"
ARG_study_the_battle_of_the_river_plate_desc: "ยุทธนาวีแมนํ้าเพลตเปนการรบทางทะเลครั้งแรกของสงครามนี้ และเกิดขึ้นในนานนํ้าอเมริกาใต เราควรศึกษายุทธนาวีครั้งนี้ใหดีที่สุดและเรียนรูจากมันเพื่อพัฒนาขีดความสามารถทางเรือของเราเอง"
ARG_islas_del_atlantico_sur: "หมูเกาะแอตแลนติกใต"
ARG_islas_del_atlantico_sur_desc: "หมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียเปนดินแดนอธิปไตยของ[ENG.GetName]มาหลายปแลว แมเราจะอางสิทธิ์เหนือหมูเกาะที่อยูใกล[ARG.GetName]เพียงนี้ แตมันก็ยังอยูใตการปกครองของ[ENG.GetAdjective] ดวยความเปนพันธมิตรครั้งใหมกับ[ENG.GetName] บางทีเราอาจเจรจาใหโอนหมูเกาะมาอยูในการควบคุมของเราได อยางไรเสีย เราก็ปกปองมันไดดีกวาในสงครามครั้งนี้"
ARG_improving_the_islands: "พัฒนาหมูเกาะ"
ARG_improving_the_islands_desc: "เมื่อเราไดครอบครองหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียแลว เราควรมุงพัฒนาโครงสรางพื้นฐานทางทหารบนเกาะเพื่อใหแนใจวาหมูเกาะเหลานี้จะอยูในการควบคุมของเราตอไป"
ARG_firmes_volamos: "Firmes Volamos"
ARG_firmes_volamos_desc: "ชุมชนชาว[ENG.GetAdjective]ที่อาศัยอยูใน[ARG.GetName]เสนอจะออกเงินจัดตั้งฝูงบินบริจาคใหแกกองทัพอากาศอังกฤษ การสงฝูงบินนี้ไปยัง[ENG.GetName]อาจชวยใหเรารวมมือกับ RAF ไดใกลชิดยิ่งขึ้นและพัฒนาขีดความสามารถทางอากาศของเราเอง"
ARG_extinguish_south_american_fascism: "ดับไฟฟาสซิสตในอเมริกาใต"
ARG_extinguish_south_american_fascism_desc: "มลทินที่ลัทธิฟาสซิสตทิ้งไวบนโลกไดลามมาถึงอเมริกาใตแลว เราไมอาจนิ่งดูดายปลอยใหมันขยายตัวตอไป เราตองลุกขึ้นจัดการกับประเทศที่ละทิ้งประชาธิปไตยเพื่อเผด็จการอํานาจนิยม กอนที่มันจะลุกลามไปทั่วทวีป"
ARG_no_fascism_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอทุกประเทศ§Yฟาสซิสต§!ใน§Yอเมริกาใต§!"
ARG_american_allyship: "พันธมิตรอเมริกัน"
ARG_american_allyship_desc: "หนึ่งในพันธมิตรที่แข็งแกรงที่สุดของเราคือยักษใหญทางเหนือที่บัดนี้ตื่นขึ้นแลว ดวยเจตนารมณแหงเอกภาพแพนอเมริกัน เราควรสงทูตชาว[ARG.GetAdjective]ไปยังวอชิงตัน ดี.ซี. เพื่อกระชับความสัมพันธกับรัฐบาล[USA.GetAdjective]"
ARG_us_marine_program: "โครงการฝกนาวิกโยธินสหรัฐฯ"
ARG_us_marine_program_desc: "นาวิกโยธินสหรัฐฯ เปนกองกําลังชั้นยอดและเปนสัญลักษณแหงแสนยานุภาพทางทหารของ[USA.GetAdjective] เรามีสิ่งที่ตองเรียนรูจากพวกเขาอีกมาก และเมื่อเราทํางานใกลชิดกับ[USA.GetName]มากขึ้น เราก็มีโอกาสไดทําเชนนั้น"
ARG_us_marine_program_doctrine: "การฝกนาวิกโยธินสหรัฐฯ"
ARG_encourage_the_red_scare: "ภัยแดง"
ARG_encourage_the_red_scare_desc: "ดูเหมือนวาลัทธิฟาสซิสตจะไมใชสิ่งเดียวที่เราควรกังวล อํานาจที่เพิ่มขึ้นของ[SOV.GetName]ก็นาหวงไมแพกัน ลัทธิคอมมิวนิสตเปนอีกขั้วตรงขามของประชาธิปไตย และเราควรระวังการแพรขยายของมัน"
ARG_counter_intelligence_program: "โครงการตอตานขาวกรอง"
ARG_counter_intelligence_program_desc: "ดูเหมือนวาการจารกรรมจะมีบทบาทสําคัญในสงครามครั้งนี้ และโครงการขาวกรองของเราก็ลาหลังอยางนาใจหาย ดวยขาวลือเรื่องปฏิบัติการของ[GER.GetAdjective]ใน[ARG.GetName]และประเทศอเมริกาใตอื่น ๆ เราควรเตรียมตอบโตโดยเร็วที่สุด"
ARG_end_operation_bolivar: "ยุติปฏิบัติการโบลิบาร"
ARG_end_operation_bolivar_desc: "เราพบวามีภารกิจจารกรรมจาก[GER.GetName]ไหลเขามาในประเทศอยางตอเนื่อง พวกเขาตั้งชื่อมันอยางขบขันวา 'ปฏิบัติการโบลิบาร' นี่เปนเรื่องที่ยอมรับไมได และเราตองยุติปฏิบัติการทั้งหมดของ[GER.GetAdjectives]ใน[ARG.GetName]ทันที"
ARG_extinguish_south_american_communism: "ดับไฟคอมมิวนิสตในอเมริกาใต"
ARG_extinguish_south_american_communism_desc: "ภัยแดงไมใชแคผีที่แตงขึ้นมาหลอกเด็ก ลัทธิคอมมิวนิสตไดลามมาถึงอเมริกาใตและกําลังรุกคืบเขาหา[ARG.GetName]อยางรวดเร็ว เพื่อประชาธิปไตยและเสรีภาพ เราตองระดมกําลังปราบการฟนคืนของพวกแดงนี้กอนที่มันจะลุกลามไปทั่วทวีป"
ARG_no_communism_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอทุกประเทศ§Yคอมมิวนิสต§!ใน§Yอเมริกาใต§!"
ARG_banco_central_de_la_republica_argentina: "ธนาคารกลางแหงสาธารณรัฐอารเจนตินา"
ARG_banco_central_de_la_republica_argentina_desc: "ธนาคารกลางแหงสาธารณรัฐอารเจนตินากอตั้งขึ้นโดยพระราชบัญญัติของรัฐสภาหกฉบับในป 1935 เขามาแทนที่คณะกรรมการเงินตราของ[ARG.GetName] เออรเนสโต บอช ประธานธนาคาร มุงพัฒนาธนาคารและชวยกระตุนเศรษฐกิจของเราใหเริ่มฟนตัวทางการเงินจากภาวะเศรษฐกิจตกตํ่าครั้งใหญไดในที่สุด"
ARG_reach_out_to_the_great_powers: "ยื่นมือหามหาอํานาจ"
ARG_reach_out_to_the_great_powers_desc: "หนึ่งในทางเลือกที่จะชวยใหสถานการณเศรษฐกิจของเราเติบโตคือการติดตอมหาอํานาจของโลกและกูยืมเงินเพื่อเรงการฟนตัว แตเราตองระวัง เพราะเราไมตองการติดหนี้มากกวาตอนเริ่มตน"
ARG_industrial_expansion: "การขยายอุตสาหกรรม"
ARG_industrial_expansion_desc: "อุตสาหกรรมที่แข็งแกรงคือกระดูกสันหลังของทุกระบบเศรษฐกิจ เราควรมุงการวิจัยเพื่อพัฒนาทางเลือกในการขยายอุตสาหกรรมใหมากขึ้น"
ARG_industrial_expansion_bonus: "เรงเทคโนโลยีอุตสาหกรรม"
ARG_production_initiative: "ริเริ่มการผลิต"
ARG_production_initiative_desc: "เครื่องมือการผลิตของเราลาสมัยและควรไดรับการปรับปรุง เราควรทุมเงินพัฒนาเทคโนโลยีการผลิตเพื่อเรงการสรางชิ้นสวนที่จําเปนสําหรับกองทัพ"
ARG_tech_initiative_bonus: "ริเริ่มเทคโนโลยี"
ARG_economic_tax_reforms: "ปฏิรูปภาษีเพื่อเศรษฐกิจ"
ARG_economic_tax_reforms_desc: "โครงสรางพื้นฐานในชนบทของเราดอยพัฒนาอยางมาก หากเราผานการปฏิรูปนโยบายภาษีปจจุบัน เรานาจะเนนการพัฒนาพื้นที่เกษตรที่ดอยพัฒนาไดมากขึ้น"
ARG_economic_reactivation_act: "พระราชบัญญัติฟนฟูเศรษฐกิจ"
ARG_economic_reactivation_act_desc: "พระราชบัญญัติฟนฟูเศรษฐกิจจะใหความสําคัญกับการพัฒนาโครงสรางพื้นฐานพลเรือน เพิ่มความเร็วในการสรางโรงงานใหมในเมืองตาง ๆ"
ARG_immigration_wave: "คลื่นผูอพยพ"
ARG_immigration_wave_desc: "[ARG.GetName]เปนประเทศที่สรางขึ้นจากการอพยพ แมประชากรสวนใหญของเรามีตนกําเนิดจากสเปน แตเราก็มีชาวเยอรมันและแมแตชาวเวลสจํานวนไมนอยในดินแดนของเรา เราสามารถกระตุนเศรษฐกิจดวยการสงเสริมการอพยพจากประเทศเหลานี้มายัง[ARG.GetName]"
ARG_develop_civilian_economy: "พัฒนาเศรษฐกิจพลเรือน"
ARG_develop_civilian_economy_desc: "เมื่อเราใหความสําคัญกับเมืองมากขึ้น สิ่งสําคัญคือตองจัดหาสิ่งอํานวยความสะดวกที่ประชาชน[ARG.GetName]ตองการ หากเราทําใหประชาชนมีความสุขได ก็จะยิ่งทําใหเราแข็งแกรงขึ้น การลงทุนสรางโรงงานเพิ่มในทันทีคือหนทางขางหนา"
ARG_the_argentinian_metropole: "มหานครแหงอารเจนตินา"
ARG_the_argentinian_metropole_desc: "บัวโนสไอเรสจะเปนสัญลักษณของวิถีชีวิตมหานครอยางแทจริงใน[ARG.GetName] การพัฒนาเมืองชวยใหประชาชนใชชีวิตอยางมีความสุขและสรางสรรค ผลที่ตามมาคือประชากรเพิ่มขึ้นอยางกาวกระโดดและอัตราการศึกษาสูงขึ้นทั่วประเทศ"
ARG_invest_in_the_roads: "ลงทุนในถนน"
ARG_invest_in_the_roads_desc: "โครงสรางพื้นฐานใน[ARG.GetName]จําเปนตองปรับปรุงใหมอยางเรงดวน หากเราทุมทุนใหกับถนน ก็จะชวยเชื่อมโยงพื้นที่ภายในแตละจังหวัดไดดีขึ้น"
ARG_invest_in_the_railways: "ลงทุนในทางรถไฟ"
ARG_invest_in_the_railways_desc: "ดวยประวัติการพัฒนาทางรถไฟโดย[ENG.GetName] จึงสมเหตุสมผลที่เราจะเดินหนาปรับปรุงทางรถไฟใหทันสมัยตอไป สิ่งนี้จะเชื่อมทั้งประเทศเขาดวยกันผานเครือขายเดียว และทําให[ARG.GetName]เปนประเทศที่เปนปกแผนมากขึ้น"
ARG_expand_steel_extraction: "ขยายการทําเหมืองเหล็กกลา"
ARG_expand_steel_extraction_desc: "การทําเหมืองเปนอุตสาหกรรมหลักของ[ARG.GetName]มาตั้งแตครั้งที่ไดชื่อวาเปนดินแดนแหงเงิน อยางไรก็ตาม ความสนใจของเราตอนนี้มุงไปที่การขยายการผลิตเหล็กกลาในดินแดนเทือกเขาของเรา"
ARG_expand_aluminum_extraction: "ขยายการทําเหมืองอะลูมิเนียม"
ARG_expand_aluminum_extraction_desc: "อะลูมิเนียมเปนทรัพยากรสําคัญในการพัฒนากองกําลังยานยนตของเรา เราควรพัฒนาการทําเหมืองและเพิ่มอัตราการผลิตโลหะที่มีประโยชนชนิดนี้"
ARG_yacimientos_petroliferos_fiscales: "Yacimientos Petrolíferos Fiscales"
ARG_yacimientos_petroliferos_fiscales_desc: "Yacimientos Petrolíferos Fiscales เปนบริษัทพลังงาน[ARG.GetAdjective]ที่รัฐเปนเจาของ ดําเนินกิจการสํารวจ ผลิต กลั่น และจําหนายปโตรเลียม เราควรลงทุนในบริษัทนี้มากขึ้นเพื่อใหควบคุมการผลิตนํ้ามันของเราไดดีขึ้น"
ARG_yacimientos_petroliferos_fiscales_tt: "ปลดล็อกการตัดสินใจ: §Yขุดเจาะบากามัวรตา§!"
ARG_rapid_urbanization: "การกลายเปนเมืองอยางรวดเร็ว"
ARG_rapid_urbanization_desc: "พื้นที่สวนใหญของ[ARG.GetName]ยังคงเปนชนบท แตหนทางขางหนาในศตวรรษที่ 20 คือการพัฒนาความเปนเมือง การพัฒนาเมืองจะดึงดูดผูคนใหยายเขามามากขึ้น ซึ่งหมายถึงแรงงานที่เพิ่มขึ้นอยางมากสําหรับศูนยกลางอุตสาหกรรมของเรา"
ARG_agricultural_improvements: "ปรับปรุงการเกษตร"
ARG_agricultural_improvements_desc: "การทําฟารมเปนสวนสําคัญของการพัฒนา[ARG.GetName]มาหลายป และผูคนจํานวนมากพึ่งพาวิถีชีวิตนี้ในการหาเลี้ยงชีพ นี่เปนโอกาสดีที่จะปรับปรุงโครงสรางพื้นฐานการเกษตรในชุมชนชนบทของเรา"
ARG_military_production_lines: "สายการผลิตทางทหาร"
ARG_military_production_lines_desc: "ดวยวิกฤตที่ลุกลามไปทั่วโลก การลงทุนในอนาคตของการผลิตทางทหารยอมเปนความคิดที่ชาญฉลาด หากเราสรางกลุมโรงงานสําหรับยุทโธปกรณทางทหารมากขึ้น เราก็จะเตรียมพรอมรับมือพายุที่กําลังจะมาไดดีที่สุด"
ARG_capitalize_the_beef_industry: "ตอยอดอุตสาหกรรมเนื้อวัว"
ARG_capitalize_the_beef_industry_desc: "เนื้อวัว[ARG.GetAdjective]เปนสินคาสงออกหลักของเรา โดยเฉพาะไปยัง[ENG.GetNameDef] เราควรใชประโยชนจากจุดนี้ ขยายกิจการปศุสัตว และทําใหเนื้อแสนอรอยของเราเปนที่รูจักไปทั่วโลก!"
ARG_revisit_the_roca_runciman_treaty: "ทบทวนสนธิสัญญาโรกา-รันซิมัน"
ARG_revisit_the_roca_runciman_treaty_desc: "สนธิสัญญาโรกา-รันซิมันมีผลบังคับใชมาตั้งแตป 1933 เพื่อรับประกันการสงออกเนื้อวัวของเราไปยัง[ENG.GetName] อยางไรก็ตาม ดวยพัฒนาการทางเศรษฐกิจของเราในชวงหลัง อาจถึงเวลาเจรจาสนธิสัญญาฉบับใหมกับชาว[ENG.GetAdjective]เพื่อใหไดขอตกลงการคาที่ดียิ่งขึ้น"
ARG_a_new_trading_partner: "แกไขสนธิสัญญาโรกา-รันซิมัน"
ARG_a_new_trading_partner_desc: "สนธิสัญญาโรกา-รันซิมันมีผลบังคับใชมาตั้งแตป 1933 เพื่อรับประกันการสงออกเนื้อวัวของเราไปยัง[ENG.GetName] อยางไรก็ตาม ดวยสถานการณโลกที่เปลี่ยนไปในชวงหลัง จึงควรฉีกสนธิสัญญานี้ทิ้งและทําฉบับที่เปนประโยชนมากกวากับพันธมิตรใหมของเรา"
ARG_develop_the_electricity_sector: "พัฒนาภาคไฟฟา"
ARG_develop_the_electricity_sector_desc: "ภาคไฟฟาของเราจําเปนตองไดรับการยกระดับ จึงควรทุมทรัพยากรใหกับการวิจัยเทคโนโลยีเพิ่มเติมเพื่อชวยการพัฒนาดานไฟฟา"
ARG_invest_in_construction_guilds: "ลงทุนในสมาคมชางกอสราง"
ARG_invest_in_construction_guilds_desc: "สมาคมชางกอสรางคือกระดูกสันหลังของการพัฒนาเมือง ภารกิจตอไปของเราควรเปนการอัดฉีดเงินทุนใหสมาคมตาง ๆ ของ[ARG.GetName] เพื่อใหเทคโนโลยีการกอสรางของเราตามทันสวนอื่นของโลก"
ARG_technical_schools: "โรงเรียนเทคนิค"
ARG_technical_schools_desc: "การพัฒนาโรงเรียนเทคนิคจะชวยเพิ่มจํานวนที่ปรึกษาดานเทคนิคที่เราสามารถจางไดทั่วทั้งรัฐบาล การสงเสริมการศึกษาประเภทนี้ยอมชวยยกระดับความแข็งแกรงทางเศรษฐกิจของเรา"
ARG_work_with_the_nationalists: "รวมมือกับฝายชาตินิยม"
ARG_work_with_the_nationalists_desc: "บางทีอาจถึงเวลาที่เราตองใชแนวทางการปกครองที่แตกตางออกไป ทายที่สุด การคอรรัปชันที่กัดกินการเลือกตั้งมาหลายปก็ไมมีทีทาวาจะลดลง หากเรารวมมือกับกลุมชาตินิยมในประเทศ เราอาจมีโอกาสฟนฟูความสงบเรียบรอยให[ARG.GetNameDef]ไดดีกวา"
ARG_end_the_coup_tt: "§Gการเลือกแผนยุทธศาสตรนี้จะยุติภารกิจรัฐประหารโดยทหาร§!"
ARG_cut_ties_with_britain: "ตัดสัมพันธกับอังกฤษ"
ARG_cut_ties_with_britain_desc: "แมชาติเกาะอยาง[ENG.GetNameDef]จะเปนคูคาที่ใกลชิดที่สุดของเรามาตลอด แตสนธิสัญญาเนื้อวัวของพวกเขากลับขัดขวางไมใหประชาชนของเราสรางความมั่งคั่งใหประเทศของตนเอง เราควรปลุกกระแสตอตานอังกฤษในหมูประชาชนและพิสูจนใหโลกเห็นวาเรายืนไดดวยขาของตัวเองโดยไมตองพึ่งมหาอํานาจอาณานิคมแหงยุโรป"
ARG_support_radical_nationalism: "สนับสนุนชาตินิยมสุดโตง"
ARG_support_radical_nationalism_desc: "นับตั้งแตเราสลัดพันธนาการของจักรวรรดิสเปน เราพยายามนิยามอัตลักษณความเปน[ARG.GetAdjective]มาโดยตลอด เราเจริญรุงเรืองและอยูรอดที่นี่ และพิสูจนแลวอยางเด็ดขาดวาแผนดินนี้เปนของเรา จงเสริมพลังอัตลักษณ[ARG.GetAdjective] และยํ้าเตือนทุกคนวาใครคือขุมกําลังที่แทจริงแหงอเมริกาใต"
ARG_corporatism: "บรรษัทนิยม"
ARG_corporatism_desc: "บรรษัทนิยมเปนแนวคิดพื้นฐานของลัทธิฟาสซิสตและเปนสิ่งที่เราควรนํามาใชโดยเร็วที่สุด แตการจะทําเชนนั้น เราตองพึ่งพาชนชั้นนําและผูมีความสามารถในทองถิ่น และเปดทางใหพวกเขากาวหนาในลําดับชั้นฟาสซิสตใหมของ[ARG.GetNameDef] นี่คือวิธีที่เราจะนําประเทศสูอนาคตที่เปยมดวยความภักดีและประสิทธิภาพ"
ARG_reestablish_ligas_patrioticas: "ฟนฟูลีกาสปาตริโอติกัส"
ARG_reestablish_ligas_patrioticas_desc: "ลีกาสปาตริโอติกัสเปนองคกรพลเรือนกึ่งตํารวจฝายขวาจัดที่เคลื่อนไหวใน[ARG.GetNameDef]ในชวงทศวรรษ 1920 นับแตนั้นพวกเขาก็กระจัดกระจายไปหมด บางทีอาจถึงเวลาฟนฟูขบวนการนี้เพื่อชวยเราสรางระเบียบทามกลางการคอรรัปชันที่ระบาดในประเทศ"
ARG_fascist_researchers: "นักวิจัยฟาสซิสต"
ARG_fascist_researchers_desc: "ขณะที่ประเทศของเราคอย ๆ กาวเขาใกลเสนทางฟาสซิสต การลงทุนขยายการวิจัยแหงชาติยอมเปนการตัดสินใจที่ชาญฉลาด ทายที่สุด การสรางระเบียบและความภักดีใน[ARG.GetNameDef]เปนเพียงจุดเริ่มตน หากทุกอยางเปนไปตามแผน เราอาจตองการเทคโนโลยีทางทหารที่แข็งแกรงกวาที่มีอยูในปจจุบันมาก"
ARG_support_the_spanish_coup: "สนับสนุนรัฐประหารสเปน"
ARG_support_the_spanish_coup_desc: "พี่นองของเราในสเปนกําลังตอสูในสงครามกลางเมืองนองเลือดเพื่ออนาคตของประเทศ แนวคิดของฟรังโกเรื่องรัฐบาลที่กองทัพควบคุมสอดคลองกับของเราอยางยิ่ง เราควรสงความชวยเหลือไปทันทีและแสดงใหโลกเห็นถึงความบกพรองของประชาธิปไตย"
ARG_demand_spanish_compensation: "เรียกคาตอบแทนจากสเปน"
ARG_demand_spanish_compensation_desc: "พี่นองชาวสเปนของเรายึดอํานาจที่ควรเปนของพวกเขาคืนมาไดสําเร็จแลว บัดนี้บางทีเราควรเตือนพวกเขาวาเรามีสวนในความสําเร็จนั้น และถึงเวลาชดใชแลว!"
ARG_demand_spanish_compensation_tt: "สงเหตุการณไปยัง §Y[SPA.GetNameDef]§! เรียกรองใหมอบ§Yอิเควทอเรียลกินี§!แกเรา พวกเขามีแนวโนมจะยอมรับมากขึ้นหากมีความคิดเห็นตอเราใน§Gระดับสูง§!"
ARG_argentinian_volunteers_in_spain_flag: "§Y[ARG.GetName]§! ไดสงอาสาสมัครไปยัง §Y[SPA.GetName]§!"
ARG_invite_spanish_nationalists: "เชิญชาตินิยมสเปน"
ARG_invite_spanish_nationalists_desc: "นาเสียดายที่รัฐประหารของฟรังโกถูกตีโตกลับ และสงครามกลางเมืองไดสิ้นสุดลงอยางเปนทางการ ชาตินิยมสเปนหลายพันคนกําลังหาทางออกจากคาบสมุทรไอบีเรียเพื่อแสวงหาบานที่เขากับอุดมการณของพวกเขามากกวา ดวยความผูกพันทางประวัติศาสตรระหวางสองชาติ เราควรเปดประตูตอนรับพวกเขาเพื่อชวยขบวนการชาตินิยมที่กําลังเติบโตของ[ARG.GetNameDef]"
ARG_encourage_german_investments: "สงเสริมการลงทุนจากเยอรมนี"
ARG_encourage_german_investments_desc: "แมหลายฝายจะมองวา[GER.GetNameDef]เปนตัวปญหาแหงยุโรป แตก็ไดกลายเปนขุมกําลังทางอุตสาหกรรมและการทหาร เรามีความสัมพันธคอนขางดีกับชาว[GER.GetAdjective]มาตลอด เพราะมีชาว[GER.GetAdjective]จํานวนมากอาศัยอยูใน[ARG.GetNameDef] เราควรติดตอพวกเขาและดูวาพวกเขายินดีลงทุนในขบวนการชาตินิยมที่กําลังเติบโตของเราหรือไม"
ARG_german_investments_bonus: "การลงทุนจากเยอรมนี"
ARG_encourage_italian_argentine_diplomacy: "การทูตอิตาลี-อารเจนตินา"
ARG_encourage_italian_argentine_diplomacy_desc: "ลัทธิฟาสซิสตแบบ[ITA.GetAdjective]เปนตนแบบที่พรรคชาตินิยมหลักของ[ARG.GetNameDef]ใชวางนโยบายมาตลอด เราควรสงทูตไปยัง[ITA.capital.GetCapitalVictoryPointName]และเปดชองทางการทูตใหมระหวางสองประเทศ นี่เปนโอกาสดีที่จะทําขอตกลงดานการวิจัย เพื่อใหทั้งสองชาติไดประโยชนจากความกาวหนาทางเทคโนโลยีอยางรวดเร็ว"
ARG_guardia_nacional: "กวารเดียนาซิโอนัล"
ARG_guardia_nacional_desc: "ถึงเวลาแลวที่เราจะลมกองกอรดันเซียและนํา[ARG.GetNameDef]เขาสูการคุมครองของรัฐบาลทหาร กวารเดียนาซิโอนัลเคยตอสูเพื่ออธิปไตยของเราในสงครามประกาศอิสรภาพอารเจนตินา และบัดนี้ ภายใตการนําของเปโดร ปาโบล รามีเรซ จะนํา[ARG.GetNameDef]สูยุคใหมแหงความรุงเรือง"
ARG_union_nacional_fascista: "สหภาพฟาสซิสตแหงชาติ"
ARG_union_nacional_fascista_desc: "ทามกลางการคอรรัปชันและความขัดแยงภายในที่ไมรูจบ เห็นไดชัดวาผูนํากองกอรดันเซียไรประโยชน ถึงเวลาแหงการเปลี่ยนแปลงครั้งใหญในการเมือง[ARG.GetAdjective]แลว นิมิโอ เด อันกิน ไดรับความนิยมมากพอในฐานะผูนําสหภาพฟาสซิสตแหงชาติ และพรอมจะนําประเทศพรอมคืนความภาคภูมิใจแหงชาตินิยมใหแก[ARG.GetNameDef]"
ARG_rapid_militirization: "เรงเสริมสรางกําลังทหาร"
ARG_rapid_militirization_desc: "เมื่อเรามีรัฐบาลทหารที่มั่นคงกุมอํานาจแลว เราก็เริ่มมองไปยังเปาหมายการขยายดินแดนได ถึงเวลาขยายรูปแบบอุตสาหกรรมทหารและเพิ่มการผลิตอาวุธและกําลังพล โลกตองเตรียมเผชิญหนากับพลังของ[ARG.GetNameDef]"
ARG_argentine_nationalism: "ชาตินิยมอารเจนตินา"
ARG_argentine_nationalism_desc: "จิตวิญญาณของเหลาผูพิชิตไหลเวียนอยูในสายเลือดของเรา และเราควรสืบสานนามของพวกเขาในการพิชิตทวีปอเมริกา จงรวบรวมผูที่พรอมสูและพลีชีพเพื่อชาติ และเตรียมอุตสาหกรรมของเราใหพรอมผลิตอาวุธและเครื่องจักรสงครามจํานวนมหาศาล [ARG.GetNameDefCap]เตรียมพรอมทําสงคราม!"
ARG_war_division: "ฝายกิจการสงคราม"
ARG_war_division_desc: "สงครามทุกครั้งสรางขึ้นบนการเตรียมการที่ดี ขณะที่เราจัดตั้งคณะรัฐมนตรีและสรางเครื่องจักรสงคราม เราก็กาวเขาใกลเปาหมายการขยายดินแดนมากขึ้นทุกวัน"
ARG_argentina_first: "อารเจนตินาตองมากอน"
ARG_argentina_first_desc: "หลังไตรตรองอยางรอบคอบ เราตัดสินใจวาแนวทางที่ดีที่สุดสําหรับอนาคตของ[ARG.GetNameDef]คือการอยูหางจากความขัดแยงที่ลุกลามในยุโรป และมุงตอบสนองความตองการดานการเติบโตและเสถียรภาพของ[ARG.GetNameDef]แทน จงกอตั้งฝายของเราเองและยืนหยัดดวยตนเองตอกรกับโลก"
ARG_join_the_axis: "เขารวมฝายอักษะ"
ARG_join_the_axis_desc: "เราเปนหนี้บุญคุณฝายอักษะอยางมากที่ทําให[ARG.GetNameDef]อยูภายใตการนําที่แข็งแกรงและมั่นคง ดังนั้นเราควรติดตอพวกเขาและขอเขารวมสงคราม ชวยเผยแพรลัทธิฟาสซิสตไปทั่วโลก!"
ARG_dominate_the_south: "ครอบงําแดนใต"
ARG_dominate_the_south_desc: "ดวยศัตรูมากมายรายลอมเราอยูในทวีปนี้ จึงสําคัญยิ่งที่เราตองยื่นกําปนเหล็กออกไปทําลายภัยคุกคามที่อาจเกิดขึ้นกอนที่มันจะกอตัว จงแสดงใหพวกเขาเห็นวาใครคือมหาอํานาจผูครองอเมริกาใต"
ARG_preparations_for_war: "เตรียมพรอมทําสงคราม"
ARG_preparations_for_war_desc: "แมเราอาจพรอมจะทําสงครามในวินาทีนี้ แตสถานการณเสบียงตามแนวชายแดนกลับบอกเลาเรื่องราวที่ตางออกไป การปรับปรุงเสนทางเสบียงจะทําใหเราพิชิตศัตรูไดอยางรวดเร็ว"
ARG_conquer_paraguay: "พิชิต[PAR.GetNameDefCap]"
ARG_conquer_paraguay_desc: "ไมมีที่วางสําหรับการเจรจา [PAR.GetNameDef]ขวางทางการครองอเมริกาใตของเรา แทนที่จะสงคําขาด ทางที่ดีที่สุดคือจับวัวที่เขาแลวประกาศสงครามกับเพื่อนบานของเราเสียเลย"
ARG_paraguayan_ultimatum: "คําขาดตอ[PAR.GetAdjective]"
ARG_paraguayan_ultimatum_desc: "[PAR.GetNameDefCap]เปนดินแดนยุทธศาสตรที่สําคัญยิ่งตอเปาหมายสงครามของเราตอสวนที่เหลือของทวีป พวกเขาจะยอมทํางานภายใตเรา หรือจะถูกบังคับดวยกําลังทหารใหมาอยูใตธงของเราก็ได ทางเลือกเปนของพวกเขา สงคําขาดไป"
ARG_uraguayan_ultimatum.tt: "([URG.GetFlag]§Y[URG.GetNameDefCap]§!) ไดรับเหตุการณ '§Y$ARG_political_events.19.t$§!' ซึ่งจะเรียกรองใหพวกเขากลายเปน§Yรัฐหุนเชิด§!ของเรา พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก§Yมีความคิดเห็นตอเราในระดับสูง§!"
ARG_paraguayan_ultimatum.tt: "([PAR.GetFlag]§Y[PAR.GetNameDefCap]§!) ไดรับเหตุการณ '§Y$ARG_political_events.19.t$§!' ซึ่งจะเรียกรองใหพวกเขากลายเปน§Yรัฐหุนเชิด§!ของเรา พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก§Yมีความคิดเห็นตอเราในระดับสูง§!"
ARG_chilean_ultimatum.tt: "([CHL.GetFlag]§Y[CHL.GetNameDefCap]§!) ไดรับเหตุการณ '§Y$ARG_political_events.19.t$§!' ซึ่งจะเรียกรองใหพวกเขากลายเปน§Yรัฐหุนเชิด§!ของเรา พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก§Yมีความคิดเห็นตอเราในระดับสูง§!"
ARG_revive_the_colonial_plan: "ฟนแผนอาณานิคม"
ARG_revive_the_colonial_plan_desc: "ในความพยายามที่จะตั้งหลักในอเมริกาใต [GER.GetNameDef]เคยริเริ่มแผนจัดตั้งอาณานิคมใน[URG.GetNameDef] แตแผนนั้นไมเคยเปนจริง เราควรรับหนาที่ฟนแผนนี้ขึ้นมาใหม และทําให[URG.GetNameDef]เปนรัฐหุนเชิดในนามของมิตรฟาสซิสตของเรา"
ARG_conquer_uruguay: "ตั้งหลักใหมั่น"
ARG_conquer_uruguay_desc: "ขณะที่ระบอบใหมของเรากําลังตั้งมั่น เราตองตัดสินใจวาจะจัดการกับเพื่อนบานที่เล็กกวาอยางไร [URG.GetNameDefCap]เปนดินแดนที่ถูกชวงชิงมาตลอด และการยึดดวยกําลังจะแสดงใหโลกเห็นวาเราไมใชชาติที่ใครจะดูแคลนได"
ARG_reach_out_to_chile: "ยื่นมือหา[CHL.GetNameDefCap]"
ARG_reach_out_to_chile_desc: "เมื่อเทียบกับเพื่อนบานติดกันรายอื่น [CHL.GetNameDefCap]ใหญกวาและทรงอํานาจกวามาก จึงควรติดตอพวกเขาและเสนอโอกาสเปนพันธมิตรกับเรา บางทีหากเรายกดินแดนที่พวกเขาหมายปองคืนให พวกเขาอาจยอมรับไดงายขึ้น"
ARG_reach_out_to_chile_tt: "พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก§Yมีความคิดเห็นตอเราในระดับสูง§! และเปน§Yฟาสซิสต§!หรือ§Yไมฝกใฝฝายใด§!"
ARG_reach_out_to_chile_2_tt: "หากพวกเขา§Yยอมรับ§! เราจะมอบ §Y[954.GetName]§! และ §Y[953.GetName]§! ใหแกพวกเขา"
ARG_chilean_ultimatum: "คําขาดตอ[CHL.GetAdjective]"
ARG_chilean_ultimatum_desc: "เรามีความตึงเครียดตามแนวชายแดนกับ[CHL.GetNameDef]มานานเกินไปแลว และหากเราตองการสถาปนาตนเปนมหาอํานาจผูครองอเมริกาใตอยางแทจริง เราตองสยบพวกเขาใหเร็วที่สุด พวกเขาจะเขารวมกับเราโดยสันติ หรือเราจะยกทัพเขาดินแดนของพวกเขาและทวงสิ่งที่เปนของเรา"
ARG_the_old_enemy: "ศัตรูเกา"
ARG_the_old_enemy_desc: "ในที่สุดก็ถึงเวลาที่เราจะหันไปทางเหนือ ที่ซึ่งเงาของคูปรับเกาแกที่สุดทาบทับเราอยู [BRA.GetNameDefCap]เปนศัตรูที่ยิ่งใหญที่สุดของเราในทวีปนี้มาตลอด ถึงเวลาจุดจิตวิญญาณแหงสงครามซิสพลาทีนขึ้นอีกครั้ง และปูทางพิชิตสู[BRA.capital.GetCapitalVictoryPointName]"
ARG_south_american_unity: "เอกภาพอเมริกาใต"
ARG_south_american_unity_desc: "เมื่อเราไดครอบครองดินแดนทั่วทวีปแลว ถึงเวลาใชชื่อใหมเพื่อแสดงวาเราไมใชเพียง[ARG.GetNameDef] แตคืออเมริกาใตทั้งมวล ในที่สุดเราก็รวมรัฐที่ทะเลาะเบาะแวงเหลานี้ไวใตธงอันทรงพลังผืนเดียวไดสําเร็จ"
ARG_integrate_operation_bolivar: "ผนวกปฏิบัติการโบลิบาร"
ARG_integrate_operation_bolivar_desc: "[GER.GetNameDef]ดําเนินภารกิจจารกรรมหลายภารกิจทั่วอเมริกาใตมาระยะหนึ่งแลว ปฏิบัติการที่ไดรับฉายาอยางเอ็นดูวา 'ปฏิบัติการโบลิบาร' นี้ดําเนินการอยูใน[ARG.GetNameDef] เมื่อเรามีความสัมพันธที่ดีกับชาว[GER.GetAdjective]แลว เราสามารถผนวกโครงการนี้เขากับของเราและสงเสริมใหแพรขยายไปทั่วทวีป"
ARG_release_hellmuth: "ปลอยตัวเฮลมุท"
ARG_release_hellmuth_desc: "ออสมาร เฮลมุท เปนชาว[ARG.GetAdjective]เชื้อสาย[GER.GetAdjective] ซึ่งถูกจับกุมภายใตรัฐบาลเกาหลังถูกพบวารวมมือกับรัฐบาลฟาสซิสตใน[GER.GetNameDef] เราควรปลอยตัวเขาทันทีและวาจางเขาเขาทํางานในหนวยขาวกรองของเราแทน"
ARG_anti_american_propaganda: "โฆษณาชวนเชื่อตอตานอเมริกา"
ARG_anti_american_propaganda_desc: "[USA.GetNameDefCap]เปนปอมปราการแหงประชาธิปไตยในทวีปอเมริกา และยอมตอตานทุกสิ่งที่เราสรางมา หากเราหวังจะจัดการกับพวกเขาได เราตองปลุกประชาชนใหสนับสนุนเปาหมายนี้ ดวยการโหมกระแสตอตานอเมริกาไปทั่วประเทศ เมื่อมีจิตวิญญาณนักสูหนุนหลัง เราจะมีขออางในการโจมตียักษใหญทางเหนือ"
ARG_the_war_machine: "เครื่องจักรสงคราม"
ARG_the_war_machine_desc: "ขณะที่ระบอบใหมของเราแข็งแกรงขึ้น เราตองมีกองทัพที่ทัดเทียมกัน สิ่งสําคัญคือตองลงทุนสรางนิคมอุตสาหกรรมทหารเพิ่มขึ้นทั่วประเทศ ไมใชแคใน[ARG.capital.GetCapitalVictoryPointName] จงใหเครื่องจักรสงครามแหง[ARG.GetAdjective]ผงาดขึ้น!"
ARG_secure_the_borders: "รักษาชายแดน"
ARG_secure_the_borders_desc: "เราควรทําใหแนใจวาชายแดนปจจุบันของเราปลอดภัยจากคูปรับที่อันตรายที่สุด เราตองสรางแนวปองกันตลอดชายแดนที่ติดกับ[CHL.GetNameDef]และ[BRA.GetNameDef] พรอมฝกผูนําทางทหารใหรบในปามากมายที่ปกคลุมทางเหนือ การปองกันคือสิ่งสําคัญที่สุด!"
ARG_argentine_island_sovereignty: "อธิปไตยเหนือหมูเกาะของอารเจนตินา"
ARG_argentine_island_sovereignty_desc: "หมูเกาะแอตแลนติกใตถูกอังกฤษยึดครองมานานเกินไป ทั้งที่อยูในเขตอิทธิพลของ[ARG.GetNameDef]อยางชัดเจน เราควรลุกขึ้นทวงสิ่งที่เปนของเราโดยชอบธรรม แมจะตองประกาศสงครามกับ[ENG.GetNameDef]ก็ตาม หมูเกาะเหลานี้จะตองเปนของ[ARG.GetAdjective]ไมวาดวยวิธีใด!"
ARG_argentine_island_sovereignty.tt: "หากไมไดอยูในสงครามกับ ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) อยูในขณะนี้ เราจะไดรับเปาหมายสงคราม§Yพิชิต§!ตอพวกเขา"
ARG_a_call_to_reform: "เสียงเรียกรองการปฏิรูป"
ARG_a_call_to_reform_desc: "ตลอดทศวรรษที่ผานมา เห็นไดชัดวาการเมืองใน[ARG.GetNameDef]ยุงเหยิงไปหมด ประชาธิปไตยเต็มรูปแบบตายไปพรอมกับอิโปลิโต อิริโกเยน และไมไดนํามาซึ่งสิ่งใดนอกจากความวุนวายและการคอรรัปชันในรัฐบาล[ARG.GetAdjective] ถึงเวลาที่เราตองเริ่มมองหาการปฏิรูปที่รวดเร็วและจําเปนเพื่อนําประเทศกลับสูเสนทางที่ถูกตอง"
ARG_invite_ghioldi_back_to_argentina: "เชิญเกียลดีกลับอารเจนตินา"
ARG_invite_ghioldi_back_to_argentina_desc: "โรดอลโฟ เกียลดี เปนนักคอมมิวนิสตคนสําคัญใน[ARG.GetNameDef] ซึ่งนาเสียดายที่ตองหนีออกนอกประเทศเพราะถูกรัฐบาลของเราดําเนินคดี ขณะที่เราเริ่มปรับทิศทางไปทางซายใน[ARG.GetNameDef] บางทีอาจถึงเวลานิรโทษกรรมใหเกียลดีและเชิญเขากลับสูบานเกิด"
ARG_invite_ghioldi_back_tt: "§Yโรดอลโฟ เกียลดี§! จะกลับสู [ARG.GetFlag]§Y[ARG.GetNameDef]§! และพรอมรับตําแหนง§Yที่ปรึกษา§! ในฐานะบุคคลสําคัญของขบวนการคอมมิวนิสตอารเจนตินา เขาจะสามารถนํา§Yการปฏิวัติ§!ใด ๆ ในอนาคตได"
ARG_ghioldi_returns: "โรดอลโฟ เกียลดี กลับสู[ARG.GetNameDef]แลว"
ARG_support_the_spanish_republicans: "สนับสนุนฝายสาธารณรัฐสเปน"
ARG_support_the_spanish_republicans_desc: "พี่นองของเราในสเปนติดอยูในความขัดแยงนองเลือด ตองรบกับเพื่อนรวมชาติเพื่อปองกันไมใหระบอบฟาสซิสตเขายึดครองแผนดินของพวกเขา การที่สเปนตกเปนของฟาสซิสตไมสอดคลองกับผลประโยชนของเรา และเราควรสนับสนุนชาติที่ผูกพันทางวัฒนธรรมกับเรามากที่สุดในยุโรปอยางเต็มที่"
ARG_legitimize_the_PCA: "รับรองพรรค PCA"
ARG_legitimize_the_PCA_desc: "พรรคคอมมิวนิสตแหงอารเจนตินาเปนพรรคคอมมิวนิสตหลักใน[ARG.GetNameDef] นับแตกอตั้ง พรรคยึดแนวทางเดียวกับพรรคคอมมิวนิสตแหงสหภาพโซเวียต จนมักเกิดความขัดแยงกับฝายซายอื่น ๆ ของ[ARG.GetNameDef] อยางไรก็ตาม เมื่อเราตองการการเปลี่ยนแปลงครั้งใหญเพื่อยุติทศวรรษอัปยศ บางทีอาจถึงเวลารับรองพรรคนี้ใหมีที่ทางในรัฐบาล[ARG.GetAdjective]"
ARG_reach_out_to_the_soviet_union: "ยื่นมือหา[SOV.GetNameDef]"
ARG_reach_out_to_the_soviet_union_desc: "ไมใชความลับวาเราตองแยกตัวจากรูปแบบการปกครองแบบเกาและเรงเปลี่ยนแปลงเพื่อกําหนดอนาคตของ[ARG.GetNameDef] เนื่องจากสิ่งนี้อาจนําไปสูการปฏิวัตินองเลือด เราจึงควรติดตอชาติที่เคยผานประสบการณนี้มากอน การเชื่อมสัมพันธกับ[SOV.GetNameDef]อาจรับประกันความชวยเหลือ หากการขึ้นสูอํานาจของเรามาพรอมความรุนแรงที่นาเศราแตจําเปน"
ARG_reach_out_to_the_soviet_union_tt: "การเลือกแผนยุทธศาสตรนี้จะปลดล็อกแมแบบกองพล §YVanguardia Socialista§! เมื่อ§Yสงครามกลางเมือง§!ปะทุ และจะเกณฑหนวย Vanguardia Socialista §Yหา§!หนวยใน §Y[955.GetName]§!"
ARG_unite_the_workers_of_argentina: "รวมพลังแรงงานแหงอารเจนตินา"
ARG_unite_the_workers_of_argentina_desc: "หากเราจะเปลี่ยน[ARG.GetNameDef ]ใหดีขึ้น เราตองโนมนาวชนชั้นกรรมาชีพของชาติใหเห็นวาการปรับปรุงอยางถึงรากเปนสิ่งจําเปนเพื่อยุติความทุกขยากของพวกเขา จงรวมแรงงานจากทุกสาขาอาชีพและแสดงใหรัฐบาลเห็นวาสถานะเดิมตองจบสิ้นลง!"
ARG_viva_la_revolucion: "การปฏิวัติจงเจริญ"
ARG_viva_la_revolucion_desc: "ถึงเวลาแลวที่เราจะสงคําขาดถึงรัฐบาลของ[ARG.GetNameDef] และนําสายลมแหงการเปลี่ยนแปลงมาแปรเปลี่ยนชาติของเราใหเปนรัฐสังคมนิยมที่แทจริง หากทุกอยางเปนไปดวยดี เรื่องนี้จะจบลงอยางสันติและรัฐบาลจะเปลี่ยนมือไดโดยงาย แตก็มีโอกาสเสมอที่พวกเขาจะไมยอมแพโดยไมสู"
ARG_communist_civil_war_tt: "§Rจะกอใหเกิดสงครามกลางเมืองใน§! §Y[ROOT.GetFlag][ROOT.GetName]§! §Rระหวางฝายคอมมิวนิสตกับรัฐบาลปจจุบัน!§!"
ARG_forge_our_own_future: "สรางอนาคตของเราเอง"
ARG_forge_our_own_future_desc: "เมื่อการปฏิวัติประสบความสําเร็จอยางงดงาม ก็ถึงเวลาตัดสินใจวาเราจะกําหนดอนาคตของ[ARG.GetNameDef]อยางไร สหายแฟนนี เอเดลมัน เปนผูสนับสนุนพรรค PCA อยางแข็งขันมาหลายป และกาวหนาอยางมากในการตอสูเพื่อสิทธิสตรีใน[ARG.GetNameDef] หลายคนมองวาเธอเหมาะสมที่จะนําประเทศนับจากนี้ไป พา[ARG.GetNameDef]สูยุคใหมแหงความรุงเรือง"
ARG_women_in_industry: "สตรีในภาคอุตสาหกรรม"
ARG_women_in_industry_desc: "ผูหญิงถูกคาดหวังใหอยูบานดูแลครอบครัวมานานเกินไปแลว หากผูหญิงสามารถเปนผูนําประเทศของเราได ก็สมควรอยางยิ่งที่จะใหพวกเธอทํางานในอุตสาหกรรมอื่น ๆ ไดดวย สิ่งนี้จะชวยอนาคตทางเศรษฐกิจของ[ARG.GetNameDef] เพราะจะขยายกําลังแรงงานของเราไดอยางมาก"
ARG_support_the_farmers: "สนับสนุนเกษตรกร"
ARG_support_the_farmers_desc: "[ARG.GetNameDefCap]มีภาคเกษตรที่แข็งแกรงมาตลอด โดยเฉพาะเนื้อวัวของเราที่เปนที่นิยมทั่วโลก ภายใตแอกของรัฐบาลชุดกอน ชุมชนเกษตรกรรมจํานวนมากแทบไมไดรับการสนับสนุน ถึงเวลาเปลี่ยนแปลง เพิ่มงบประมาณดานการเกษตร และสนับสนุนแรงงานชนชั้นกรรมาชีพในชนบทของ[ARG.GetNameDef]"
ARG_socialist_volunteers: "อาสาสมัครสังคมนิยม"
ARG_socialist_volunteers_desc: "ยังมีขบวนการสังคมนิยมอื่น ๆ อีกมากทั่วโลกที่กําลังดิ้นรนเพื่อฝนแหงการปฏิวัติของตน หากมีความจําเปน เราตองยื่นกําลังของเราชวยเหลือชาติที่หวังจะเดินตามเสนทางสีแดงเชนเดียวกับเรา การมุงเนนภายในไมไดหมายความวาเราควรเพิกเฉยตอความทุกขยากของสหายนานาชาติ"
ARG_the_buenos_aires_conference: "การประชุมบัวโนสไอเรส"
ARG_the_buenos_aires_conference_desc: "เมื่อเราเริ่มสรางเสถียรภาพใหประเทศไดแลว เราตองระวังไมใหผูนําของเราตกหลุมพรางกึ่งเผด็จการแบบเดียวกับที่รัฐบาลชุดกอนตกลงไป ดังนั้นจึงมีการเรียกประชุมสังคมนิยมขึ้นที่บัวโนสไอเรส เพื่อหารือและเลือกผูนําคนตอไปของ[ARG.GetNameDef]"
ARG_the_buenos_aires_conference_1_tt: "ไดรับเหตุการณ '§Yการประชุมบัวโนสไอเรสเริ่มตนขึ้น§!' ซึ่งจะใหเราเลือกวาจะให§Yแฟนนี เอเดลมัน§!ครองอํานาจตอ หรือเปลี่ยนเปน§Yอันโตนิโอ โซโต§!"
ARG_the_buenos_aires_conference_2_tt: "การคง§Yแฟนนี เอเดลมัน§!ไวจะปลดล็อกสายแผนยุทธศาสตร §Yรวมทวีปเปนหนึ่ง§! และ §Yปลดปลอยทวีป§! สวนการเลือก§Yอันโตนิโอ โซโต§!จะปลดล็อกสายแผนยุทธศาสตร §Yพัฒนาปาตาโกเนีย§!"
ARG_align_with_the_soviets: "เขาแนวรวมโซเวียต"
ARG_align_with_the_soviets_desc: "เมื่อการปฏิวัติประสบความสําเร็จอยางงดงาม ก็ถึงเวลาตัดสินใจวาเราจะกําหนดอนาคตของ[ARG.GetNameDef]อยางไร สหายโรดอลโฟ เกียลดี คือผูนําการปฏิวัติเมื่อเขากลับมา จึงเปนผูที่เหมาะสมจะนํา[ARG.GetNameDef] เกียลดีตั้งใจกระชับความสัมพันธกับ[SOU.GetNameDef] และเชื่อวารัฐสังคมนิยมใหมของเราจะเติบโตเปนขุมกําลังไดดวยการเดินตามแบบอยางของพวกเขา"
ARG_soviet_industrial_model: "แบบจําลองอุตสาหกรรมโซเวียต"
ARG_soviet_industrial_model_desc: "หลังการปฏิวัติในรัสเซีย [SOU.GetNameDef]กาวหนาอยางมากในการปรับปรุงนิคมอุตสาหกรรมทหารใหทันสมัย เราควรไดแรงบันดาลใจจากสิ่งนี้และเดินตามรอยพวกเขา เพิ่มจํานวนโรงงานที่เนนการทหารในประเทศ"
ARG_committee_of_state_security: "คณะกรรมการความมั่นคงแหงรัฐ"
ARG_committee_of_state_security_desc: "ขณะที่ความตึงเครียดของโลกเพิ่มสูงขึ้น ศัตรูของอุดมการณเราก็เริ่มโผลออกมาจากที่ซอนมากขึ้นเรื่อย ๆ เพื่อรักษาอํานาจของเราไว จําเปนอยางยิ่งที่เราตองมุงสรางหนวยขาวกรองเพื่อบังคับใชคุณคาของเราทั้งใน[ARG.GetNameDef]และในระดับนานาชาติ"
ARG_russian_manufacturers: "ผูผลิตจาก[SOU.GetAdjective]"
ARG_russian_manufacturers_desc: "เพื่อเพิ่มความแข็งแกรงทางอุตสาหกรรมและโดดเดนเหนือชาติอื่นในทวีป เราควรติดตอ[SOU.GetNameDef]และเชิญผูผลิตของพวกเขาจํานวนหนึ่งมายัง[ARG.GetNameDef] อยางไรเสีย เรามีอุดมการณเดียวกัน จึงสมเหตุสมผลที่จะแบงปนเทคโนโลยีทางทหารกันดวย"
ARG_centralize_power: "รวมศูนยอํานาจ"
ARG_centralize_power_desc: "โรดอลโฟ เกียลดี นําพาเรามาไดดีในเสนทางหลังการปฏิวัติ หลายคนในรัฐบาลของเขาเชื่อวาการรวมศูนยอํานาจไวที่ผูนํารัฐบาลแตเพียงผูเดียวจะชวยปกปองรัฐโซเวียตที่กําลังเติบโตของเราจากภัยคุกคามทั้งภายในและภายนอก อยางไรเสีย ทั้งหมดนี้ก็เพื่อความปลอดภัยและความมั่นคงของ[ARG.GetNameDef]"
ARG_workers_rights: "สิทธิแรงงาน"
ARG_workers_rights_desc: "หนึ่งในหลักการสําคัญของการปฏิวัติสังคมนิยมของเราคือการยกระดับคุณภาพชีวิตของแรงงานชนชั้นกรรมาชีพแหง[ARG.GetNameDef] เมื่อเรายึดปจจัยการผลิตมาไดแลว เราควรทําใหแนใจวาสภาพการทํางานอันเลวรายจะไมกัดกินไรนาและโรงงานของเราอีกตอไป"
ARG_reform_our_industry: "ปฏิรูปอุตสาหกรรม"
ARG_reform_our_industry_desc: "นวัตกรรมทางอุตสาหกรรมของเราลาหลังชาติอื่น ๆ ในโลกมานานเกินไปแลว ถึงเวลาขยายอุตสาหกรรมของ[ARG.GetNameDef]และยกระดับสูมาตรฐานที่ทันสมัยยิ่งขึ้น เราเริ่มไดดวยการสรางโรงงานใหมและเดินเครื่องทันที"
ARG_empower_the_fjc: "เสริมพลัง FJC"
ARG_empower_the_fjc_desc: "สหพันธเยาวชนคอมมิวนิสตเปนองคกรการเมืองปฏิวัติของเยาวชนที่กอตั้งขึ้นเพื่อสงเสริมนโยบายของพรรค PCA ในหมูเยาวชน[ARG.GetAdjective] เพื่อวางรากอุดมการณสังคมนิยมของเราไปทั่วประเทศ จึงควรใหเยาวชนของชาติเขามามีสวนรวมตั้งแตเนิ่น ๆ เทาที่จะทําได"
ARG_state_atheism: "รัฐอเทวนิยม"
ARG_state_atheism_desc: "[ARG.GetNameDefCap]เปนประเทศคาทอลิกมาชานาน และศาสนามีบทบาทสําคัญในชีวิตประจําวันของพลเมืองจํานวนมาก อยางไรก็ตาม เรามีทางเลือกที่จะประกาศใหรัฐเปนอเทวนิยม เพราะศาสนามักไมมีที่ทางมากนักในการปฏิวัติสังคมนิยม แตเราตองตระหนักวาสิ่งนี้อาจสรางความไมพอใจในหมูมวลชน ที่ใชชีวิตโดยมีศาสนาเปนสวนหนึ่งมาชานาน"
ARG_liberation_theology: "เทววิทยาการปลดปลอย"
ARG_liberation_theology_desc: "ดวยประวัติศาสตรอันยาวนานของนิกายคาทอลิกใน[ARG.GetNameDef]และความสําคัญตอชีวิตของพลเมือง บาทหลวงจํานวนมากจึงเริ่มรับเอาคริสตศาสนารูปแบบใหมที่เรียกวาเทววิทยาการปลดปลอย เพื่อตอบสนองตอการเปลี่ยนแปลงทางอุดมการณใน[ARG.GetNameDef] เนื่องจากแนวคิดของเทววิทยาการปลดปลอยสอดคลองกับขบวนการปฏิวัติของเรา จึงควรรับเอาแนวทางนี้ของศาสนจักรเปนศาสนาประจํารัฐ"
ARG_socialist_researchers: "นักวิจัยสังคมนิยม"
ARG_socialist_researchers_desc: "ขณะที่ประเทศของเราเติบโตในฐานะรัฐสังคมนิยม การลงทุนขยายการวิจัยแหงชาติยอมเปนการตัดสินใจที่ชาญฉลาด อยางไรเสีย การปฏิวัติและปรับปรุงเทคโนโลยีใหทันสมัยเปนสิ่งสําคัญตอการเติบโตของชาติ"
ARG_a_red_south_america: "อัสดงสีชาด"
ARG_a_red_south_america_desc: "ในที่สุด เราก็นําอเมริกาใตมาอยูใตธงคอมมิวนิสตผืนเดียวกันไดสําเร็จ ขณะที่คลื่นสีแดงซัดสาดไปทั่วทวีป ชนชั้นแรงงานผูถูกกดขี่ก็มีอิสระที่จะดํารงชีวิตแบบพึ่งพาตนเองภายใตการชี้นําของเราในที่สุด แตทําไมเราตองหยุดอยูแคนั้น? ถึงเวลาเริ่มปฏิบัติการอัสดงสีชาด และนําตะวันตกดินสีชาดครั้งสุดทายไปสูทุกผูที่ตอตานการปฏิวัติโลก"
ARG_conquer_south_america: "ปลดปลอยทวีป"
ARG_conquer_south_america_desc: "ไมมีที่วางสําหรับอุดมการณอื่นใดของโลกบนทวีปอเมริกาใต เพราะพวกมันเปนภัยคุกคามตอรัฐสังคมนิยมของเรา หากพวกเขาไมยอมเขารวมกับเรา เราตองเรงปลดปลอยประชาชนของพวกเขาใหเร็วที่สุดและนํามาอยูใตธงคุมครองของ[ARG.GetNameDef]"
ARG_more_communism_in_south_america_tt: "ไดรับเปาหมายสงคราม §Y$annex_everything$§! ตอทุกประเทศที่§Yไมใชคอมมิวนิสต§!ใน§Yอเมริกาใต§!"
ARG_unify_south_america: "รวมทวีปเปนหนึ่ง"
ARG_unify_south_america_desc: "มีหลายประเทศในทวีปอเมริกาใตที่ดําเนินขบวนการปฏิวัติของตนเองและสถาปนารัฐบาลคอมมิวนิสตไดสําเร็จ หากเราจะเขมแข็งตอไป เราตองรวมพลังกัน ถึงเวลาติดตอชาติเหลานี้และขอใหพวกเขาเขารวมสากลของเรา"
ARG_unify_the_continent_tt: "การเลือกแผนยุทธศาสตรนี้จะสงขอเสนอใหประเทศ§Yคอมมิวนิสต§!ทุกประเทศใน§Yอเมริกาใต§!เขารวม§Yฝาย§!ของเรา"
ARG_integrate_the_motherland: "ผนวกรวมทวีปอเมริกา"
ARG_integrate_the_motherland_desc: "ชนชั้นปกครองในดินแดนที่เราปลดปลอยจากความเนาเฟะของทุนนิยมและฟาสซิสตอาจยังคงกอกบฏตอเรา หากเราไมดําเนินการผนวกรวมพวกเขาเขาสูแนวรวมที่กําลังเติบโตของเรา"
ARG_eliminate_american_imperialism: "กําจัดจักรวรรดินิยมอเมริกัน"
ARG_eliminate_american_imperialism_desc: "ยักษใหญทางเหนือเปนปอมปราการแหงความละโมบและการคอรรัปชันของบรรษัทมาชานาน เมื่อเราเติบโตเปนมหาอํานาจดวยตัวเองแลว ก็เปนเพียงเรื่องของเวลาที่สุนัขรับใชทุนนิยมแหงวอชิงตันจะตัดสินวาเราเปนภัยที่ตองกําจัด เราไมอาจปลอยใหสิ่งนั้นเกิดขึ้น ถึงเวลาเริ่มปฏิบัติการอัสดงสีชาด และนําตะวันตกดินสีชาดครั้งสุดทายไปสู[USA.GetNameDef]"
ARG_improve_patagonia: "พัฒนาปาตาโกเนีย"
ARG_improve_patagonia_desc: "เมื่อกลุมอนาธิปไตยสหการนิยมภายใตอันโตนิโอ โซโต เขากุมชะตากรรมของ[ARG.GetNameDef] พวกเขาตัดสินวาจําเปนอยางยิ่งที่ปาตาโกเนีย ภูมิภาคบานเกิดของพวกเขา จะไดรับความใสใจที่ขาดแคลนมานานหลายทศวรรษเสียที"
ARG_establish_the_free_association: "สถาปนาสมาคมเสรี"
ARG_establish_the_free_association_desc: "สมาคมเสรีคือความสัมพันธระหวางปจเจกบุคคลที่ไมมีรัฐ ชนชั้นทางสังคม ลําดับชั้น หรือการถือครองปจจัยการผลิตโดยเอกชน นี่คือเปาหมายระยะยาวของฝายอนาธิปไตยสหการนิยม และถึงเวลาแลวที่เราจะเริ่มทลายพรมแดนเหลานี้และสรางสังคมที่ทุกคนมีอิสระตอบสนองความตองการของตนเอง"
ARG_no_gods_no_masters: "ไรพระเจา ไรนาย"
ARG_no_gods_no_masters_desc: "ไมมีใครควรถูกควบคุมโดยผูที่หมายจะทํารายพวกเขา แมเพื่อนบานของเราอาจไมเขาใจอุดมการณของเรา แตเราสามารถรับหนาที่ปลดปลอยพวกเขาจากชาติกระหายสงครามที่หวังขยายเขตอิทธิพลอยางละโมบ"
ARG_in_memory_of_yrigoyen: "รําลึกถึงอิริโกเยน"
ARG_in_memory_of_yrigoyen_desc: "[ARG.GetNameDefCap]เคยผานสถานการณเชนนี้มาแลวครั้งหนึ่ง แมการปกครองของเขาจะไมไดไรที่ติ แตอิโปลิโต อิริโกเยน ก็ไดทําการปฏิรูปที่จําเปนซึ่งยังเปนประโยชนตอประเทศของเรามาจนทุกวันนี้ เราตองการใครสักคนมารับชวงตอและพาเรากลับสูเสนทางประชาธิปไตยอีกครั้ง"
ARG_in_memory_of_yrigoyen_tt: "§Yมารเซโล ที. เด อัลเบอาร§! ขึ้นเปนผูนําของ §Y$ARG_democratic_party_long$§! และพรรครัฐบาลจะเปลี่ยนเปน§Yประชาธิปไตย§!"
ARG_promote_urbanization: "สงเสริมการพัฒนาเมือง"
ARG_promote_urbanization_desc: "ขณะที่โลกรอบตัวเราพัฒนาอุตสาหกรรมและความเปนเมือง [ARG.GetNameDef]กลับแทบไมเปลี่ยนแปลง สิ่งนี้ทําใหเราตองพึ่งพาชาติอื่นเพื่อประคองเศรษฐกิจ การยอมรับความจริงขอนี้และผลักดันการพัฒนาเมืองนาจะยุติการพึ่งพาเหลานี้ไดอยางรวดเร็ว"
ARG_secure_the_opposition: "ควบคุมฝายคาน"
ARG_secure_the_opposition_desc: "ฝายคานในระดับหนึ่งเปนสิ่งดีตอคุณคาประชาธิปไตยของเรา ฝายคานที่เราเผชิญอยูในปจจุบันคอนขางแข็งแกรง แตปญหาหลักคือพวกเขาไมเลนตามกติกา เราไมอาจปลอยใหพวกเขาเปนแบบอยางที่อันตรายเชนนี้ ฝายคานทางการเมืองตองไดรับการกํากับดูแล เพื่อความปลอดภัยของทุกคน"
ARG_the_clean_election: "การเลือกตั้งที่บริสุทธิ์"
ARG_the_clean_election_desc: "หลังจากการคอรรัปชันและการโกงในการเมืองของ[ARG.GetNameDef]มาหลายทศวรรษ สหภาพพลเมืองหัวรุนแรงก็ควาชัยชนะไดสําเร็จหลังการรณรงคอยางเขมขนที่มุงเปดโปงการยัดบัตรเลือกตั้งที่แพรหลายในกองกอรดันเซีย ขณะนี้กําลังมีการหารือวาใครจะนําพรรคตอไป"
ARG_anti_corruption_policies: "นโยบายตอตานการคอรรัปชัน"
ARG_anti_corruption_policies_desc: "เราตองทําใหแนใจวาการคอรรัปชันทางการเมืองที่ทําใหประเทศของเราดางพรอยตลอดทศวรรษที่ผานมาจะไมหวนกลับสูการเลือกตั้งของรัฐบาลอีก ดวยการบังคับใชนโยบายใหมที่มุงขจัดวัฒนธรรมการรับสินบน การยักยอก และระบบเสนสายในรัฐบาลของชาติ"
ARG_a_true_democracy: "ประชาธิปไตยที่แทจริง"
ARG_a_true_democracy_desc: "[ARG.GetNameDefCap]ถือวาเปนประชาธิปไตยมาตั้งแตป 1861 แตในชวงหลัง สภาพของระบบการเมืองของเราไดนําความอัปยศมาสูแนวคิดสาธารณรัฐประชาธิปไตยเสรี บัดนี้ในที่สุดเราก็กาวตอไปไดในฐานะประชาธิปไตยที่แทจริง ประชาธิปไตยที่ใหคุณคากับเสถียรภาพและการพัฒนาเศรษฐกิจ[ARG.GetAdjective]"
ARG_argentina_for_all: "อารเจนตินาเพื่อทุกคน"
ARG_argentina_for_all_desc: "ในฐานะอดีตอาณานิคม [ARG.GetNameDef]เปนบานของผูคนหลากหลายจากทั่วทุกมุมโลก ในวิสัยทัศนอนาคตของชาติ เราตองการใหทุกคนที่อาศัยอยูภายในพรมแดนเรียกตัวเองวาชาว[ARG.GetAdjective]ได และภาคภูมิใจที่เรียกประเทศนี้วาบาน เราตองทํางานเพื่อใหแนใจวา[ARG.GetNameDef]เปนของทุกคนที่เลือกมาอยูที่นี่"
ARG_reinforce_the_education_system: "เสริมความแข็งแกรงระบบการศึกษา"
ARG_reinforce_the_education_system_desc: "การศึกษาคือรากฐานของชาติประชาธิปไตย ทุกคนที่อาศัยใน[ARG.GetNameDef]ควรมีอิสระที่จะเขาเรียนเพื่อเติบโตเปนพลเมืองที่ซื่อสัตยและขยันขันแข็ง เราควรใชโอกาสนี้มุงงบประมาณไปยังสาขาวิชาชีพเฉพาะ ดวยหวังวาจะชวยใหเราพัฒนาความกาวหนาทางเทคโนโลยีและเศรษฐกิจของเราเอง"
ARG_education_electronics_bonus: "มุงเนนการศึกษาดานอิเล็กทรอนิกส"
ARG_education_industrial_bonus: "มุงเนนการศึกษาดานอุตสาหกรรม"
ARG_education_synthetics_bonus: "มุงเนนการศึกษาดานวัสดุสังเคราะห"
ARG_university_reforms: "ปฏิรูปมหาวิทยาลัย"
ARG_university_reforms_desc: "เมื่อระบบการศึกษาของเราไดรับการเสริมความแข็งแกรง นี่เปนโอกาสดีที่จะปฏิรูปมหาวิทยาลัยไปดวย การยกระดับอุดมศึกษาจะชวยใหเราใชประโยชนจากหนวยวิจัยของมหาวิทยาลัยไดมากขึ้น"
ARG_seek_american_support: "ขอการสนับสนุนจากอเมริกา"
ARG_seek_american_support_desc: "ขณะที่เงาแหงสงครามกอตัวขึ้นทั่วโลก เราตองเตรียมพรอมเผชิญความขัดแยงใด ๆ ที่จะคุกคามพรมแดนของเรา [USA.GetNameDefCap]อาจเปนยักษหลับทางเหนือ แตในฐานะชาติประชาธิปไตยดวยกัน เรามีสิ่งที่จะเรียนรูจากนโยบายตางประเทศและโครงการปองกันพลเรือนของพวกเขาอีกมาก เราควรติดตอพวกเขาและเริ่มสรางสัมพันธไมตรีกับเพื่อนบานในอเมริกาเหนือ"
ARG_us_army_training: "การฝกแบบกองทัพบกสหรัฐฯ"
ARG_us_army_training_desc: "[USA.GetNameDefCap]ไดเสนออยางมีนํ้าใจที่จะสงหลักสูตรการฝกทางทหารมาใหเรา เพื่อใหเราเริ่มเตรียมกองกําลังสําหรับความเปนไปไดที่จะเกิดสงคราม ไมเพียงจะสรางกองทัพที่มีประสบการณและแกรงกลามากขึ้น เรายังสามารถใชสิ่งที่เรียนรูมาพัฒนาโครงการกองกําลังพิเศษของเราไดดวย"
ARG_us_army_training_bonus: "$ARG_us_army_training$"
ARG_american_defense_investments: "การลงทุนดานการปองกันจากอเมริกา"
ARG_american_defense_investments_desc: "แมการมีกองทัพที่แข็งแกรงพรอมทหารที่ฝกมาอยางดีจะเปนเรื่องดี แตมักมีคํากลาววาการปองกันที่มั่นคงก็ดีพอ ๆ กับการรุกที่ทรงพลัง ความรวมมือกับ[USA.GetNameDef]ทําใหเราปรับปรุงขีดความสามารถในการปองกันในภูมิภาคที่เปราะบางที่สุด โดยเฉพาะเพื่อตานทานการโจมตีทางอากาศ ปาดงดิบและเทือกเขาปกปองเราบนภาคพื้นดิน และปอมปนเหลานี้จะปกปองนานฟาของเรา"
ARG_joint_military_exercises: "การซอมรบรวม"
ARG_joint_military_exercises_desc: "เพื่อแสดงไมตรีตอชาว[USA.GetAdjective] เราควรเสนอใหจัดการซอมรบรวมขึ้นใน[ARG.GetNameDef] การทํางานรวมกันจะชวยยกระดับการฝกและทักษะของกองทัพเรือและกองทัพอากาศของเรา"
ARG_join_the_allies: "เขารวมฝายสัมพันธมิตร"
ARG_join_the_allies_desc: "ถึงเวลาแลวที่เราตองเลือกขางในความขัดแยงนี้ ในฐานะชาติที่มุงปกปองความศักดิ์สิทธิ์ของประชาธิปไตย จําเปนอยางยิ่งที่เราตองติดตอฝายสัมพันธมิตรและหาที่ยืนในฝายนี้ใหมั่น เราตองชวยปกปองโลกจากผูที่หมายจะกดขี่มัน"
ARG_bastion_of_democracy: "ปอมปราการแหงสันติภาพ"
ARG_bastion_of_democracy_desc: "เรากาวหนาอยางมากในการยึดมั่นแนวคิดของชาติประชาธิปไตย และมาไกลมากนับตั้งแตการเลือกตั้งที่ทุจริตอยางอันตรายในอดีต ขณะที่สงครามกอตัวขึ้นทั่วโลก เราตองยืนหยัดเปนปอมปราการแหงสันติภาพ และใหคํามั่นวาจะปกปองชาติเล็ก ๆ ในทวีปนี้"
ARG_regulated_national_salaries: "กํากับคาจางแหงชาติ"
ARG_regulated_national_salaries_desc: "เราเห็นแนวโนมที่นากังวลในหมูบรรษัทและบริษัทในประเทศที่จายคาจางพนักงานตํ่าเกินไป เราไมมีความสนใจจะควบคุมงบประมาณของพวกเขา แตเราใสใจที่จะใหพลเมืองทุกคนไดรับคาจางที่เปนธรรม การกําหนดคาจางขั้นตํ่าจะชวยทุกฝายในสถานการณนี้ไดอยางแนนอน"
ARG_social_welfare_fund: "กองทุนสวัสดิการสังคม"
ARG_social_welfare_fund_desc: "งบประมาณดานสวัสดิการสังคมของเราตํ่ามากมาโดยตลอด แตเมื่อพิจารณาผลประโยชนที่อาจไดรับจากการเพิ่มงบสวัสดิการสังคม เราก็เริ่มเชื่อวามันไมควรเปนเชนนั้น การจัดตั้งกองทุนเพื่อใชจายดานสวัสดิการสังคมอาจเปนความพยายามที่คุมคา"
ARG_british_gaurantee: "กระชับสัมพันธกับอังกฤษ"
ARG_british_gaurantee_desc: "ในอดีตเรามีความสัมพันธแนบแนนกับอังกฤษ โดยพวกเขาลงทุนในประเทศของเราอยางมหาศาล เราควรฟนฟูความสัมพันธนี้และกระชับสายสัมพันธใหแนนแฟนยิ่งขึ้น มันอาจเปนประโยชนตอเราอยางมากก็ได!"
ARG_royal_airforce_influence: "อิทธิพลของกองทัพอากาศอังกฤษ"
ARG_royal_airforce_influence_desc: "เมื่อความสัมพันธกับอังกฤษใกลชิดขึ้นแลว เราควรพิจารณาวาจะเรียนรูจากกิจการทางทหารของพวกเขาไดหรือไม กองทัพอากาศอังกฤษไดรับการยกยองอยางกวางขวาง และการศึกษาปฏิบัติการของพวกเขานาจะเปนประโยชน ในเมื่อทําแลว เราก็ควรพิจารณาจัดหาเครื่องบินแบบเดียวกันมาดวย "
ARG_royal_airforce_influence_bonus: "$ARG_royal_airforce_influence$"
ARG_royal_navy_influence: "อิทธิพลของราชนาวีอังกฤษ"
ARG_royal_navy_influence_desc: "เมื่อความสัมพันธกับอังกฤษใกลชิดขึ้นแลว เราควรพิจารณาวาจะเรียนรูจากกิจการทางทหารของพวกเขาไดหรือไม ราชนาวีอังกฤษไดรับการยกยองอยางกวางขวาง และการศึกษาปฏิบัติการของพวกเขานาจะเปนประโยชน ในเมื่อทําแลว เราก็ควรพิจารณาวิจัยเรือแบบเดียวกับของพวกเขาดวย"
ARG_royal_navy_influence_bonus: "$ARG_royal_navy_influence$"
ARG_reinforced_alliance: "เสริมความรวมมือ"
ARG_reinforced_alliance_desc: "ความสัมพันธใกลชิดกับอังกฤษพิสูจนแลววามีประโยชนอยางยิ่ง แตยิ่งเราศึกษากองทัพของพวกเขามากเทาใด ก็ยิ่งเห็นชัดอยางเจ็บปวดวาเรายังไมพรอมรับความขัดแยงที่จะมาถึงเทาที่ควร เราควรพิจารณาขอการสนับสนุนที่ชัดเจนยิ่งขึ้นจากพวกเขาในรูปแบบการรับประกันและสนธิสัญญาไมรุกราน"
ARG_reinforced_alliance.tt: "([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) ไดรับเหตุการณ '§Y$ARG_political_events.73.t$§!' ซึ่งจะเสนอ§Yสนธิสัญญาไมรุกราน§!และ§Yการรับประกันเอกราช§!ระหวางสองประเทศของเรา พวกเขามีแนวโนมจะยอมรับมากขึ้นหาก§Yมีความคิดเห็นตอเราในระดับสูง§!"
ARG_internal_focus: "มุงเนนภายใน"
ARG_internal_focus_desc: "แมจะมีทางเลือกในการติดตอมหาอํานาจประชาธิปไตย แตหลายคนในรัฐบาลเชื่อวาควรมุงเนนภายใน[ARG.GetNameDef]มากกวาจะกระจายทรัพยากรออกไปที่อื่น ในตอนนี้ เราควรจํากัดการคาของชาติกับโลกภายนอก เพื่อใหแนใจวา[ARG.GetNameDef]มีสิ่งที่จําเปนในการตานทานพายุสงคราม"
ARG_alvears_democracy: "ประชาธิปไตยแบบอัลเบอาร"
ARG_alvears_democracy_desc: "หลายคนมองวา[ARG.GetLeader]เปนคนแข็งกราวที่มีนโยบายเขมงวด แตเมื่อเวลาผานไป ก็เห็นไดชัดวาเขาคํานึงถึงผลประโยชนสูงสุดของ[ARG.GetNameDef]อยางแทจริง เขาสืบสานมรดกของอิโปลิโต อิริโกเยน ไดอยางแทจริง และควรไดรับการยกยองเปนบิดาแหงประชาธิปไตยอารเจนตินา"
ARG_south_american_alliance: "ความรวมมือแพนอเมริกัน"
ARG_south_american_alliance_desc: "เมื่อฝายใหมของเรากอตั้งขึ้นและอุทิศตนเพื่อรักษาสันติภาพในทวีปอเมริกาใต เราควรติดตอชาติประชาธิปไตยอื่น ๆ รอบตัวและขอใหพวกเขารวมใหคํามั่นเพื่อสันติภาพและเสรีภาพกับเรา เมื่อรวมกันเราจะแข็งแกรงขึ้นและลมไดยากขึ้น"
ARG_bolstering_the_army: "รณรงครับสมัครทหาร"
ARG_bolstering_the_army_desc: "สงครามยังคงรอนระอุ และเราตองพรอมตอบรับเสียงเรียกของมัน ทั่วทั้ง[ARG.GetNameDef] ทั้งชายและหญิงพรอมเสี่ยงชีวิตเพื่อตอสูปกปองสิทธิเสรีภาพของตนจากผูที่หมายจะพรากมันไป เราตองเปดการรณรงครับสมัครทหาร และกระตุนใหประชาชนแหงชาติอันยิ่งใหญของเราจับอาวุธและเตรียมสูเพื่อบานเกิด"
ARG_the_second_argentine_republic: "สาธารณรัฐอารเจนตินาที่สอง"
ARG_the_second_argentine_republic_desc: "หลังการคอรรัปชันและการโกงมาหลายป ในที่สุดเราก็ผงาดขึ้นจากเถาถานของรัฐเกา และตั้งตระหงานเปนปอมปราการแหงประชาธิปไตยใหมในซีกโลกตะวันตก นับจากวันนี้ เพื่อแยกเราออกจากความผิดพลาดในอดีต เราจะไดชื่อวาสาธารณรัฐอารเจนตินาที่สอง ในเอกภาพและเสรีภาพ!"
ARG_the_second_argentine_republic_tt: "([ARG.GetFlag]§Y[ARG.GetNameDefCap]§!) จะให§Yการรับประกัน§!แกทุกประเทศประชาธิปไตยใน§Yอเมริกาใต§!"
ARG_hitler_1: "ครั้งที่สี่ตองสําเร็จ"
ARG_hitler_1_desc: "เมื่อประธานาธิบดีคนใหมเขาบริหารประเทศ ก็มีการผลักดันทันทีใหเปลี่ยนแปลง[ARG.GetNameDef]อยางถึงราก เพื่อเลียนแบบอํานาจในอดีตที่[GER.GetNameDef]เคยมี เซญอรฮิลเทอรดูจะยืนกรานที่จะสถาปนาไรชที่สี่ในอเมริกาใต ครั้งนี้จะมีอะไรผิดพลาดไดอีกเลา?"
ARG_hitler_2: "เกรราเรลัมปาโก"
ARG_hitler_2_desc: "เกรราเรลัมปาโก หรือที่รูจักกันในชื่อ 'สงครามสายฟาแลบ' คือวิธีที่เราจะใชอํานาจการยิงจากกองกําลังยานยนตอันทวมทนเพื่อเอาชนะศัตรู ประธานาธิบดีของเราตองการขยายดินแดนอยางรวดเร็ว โดยอางวาเปนการ 'ชดเชยเวลาที่เสียไป' ดวยเหตุผลบางอยาง แผนเหลานี้ยังครอบคลุมไปถึงดินแดนเกาของ[GER.GetNameDef]ดวย"
ARG_hitler_2_tt: "ไดรับเปาหมายสงคราม §Y$annex_everything$§! ตอทุกประเทศที่§Yไมใชฟาสซิสต§!ใน§Yอเมริกาใต§!"
ARG_hitler_2_core_tt: "ไดรับ§Yดินแดนหลัก§!ในทุกรัฐที่เคยเปนของ§Yเยอรมนี§!"
ARG_hitler_3: "อารมามาราบิโยซา"
ARG_hitler_3_desc: "อารมามาราบิโยซา หรือที่รูจักกันในชื่อ 'อาวุธมหัศจรรย' เปนโครงการที่เราจะพยายามพัฒนาจรวดและอาวุธที่ทรงพลังยิ่งขึ้นซึ่งอาจพลิกโฉมสงครามได ประธานาธิบดีของเรานําเอกสารที่เปยกนํ้าชุดหนึ่งมาใหเรา ซึ่งเต็มไปดวยแนวคิดอันนาทึ่งที่เราสามารถนํามาใชไดทันที"
ARG_arma_maravillosa_bonus: "อารมามาราบิโยซา"
ARG_worst_timeline_flag: "§Yเซญอรฮิลเทอร§! เปนผูนําของ §Y[ARG.GetNameDef]§!"
ARG_hitler_4: "กูเรือขึ้นมา"
ARG_hitler_4_desc: "ตามคําของเซญอรฮิลเทอร สิ่งสําคัญที่สุดคือเราตองกูซากเรือกราฟชเปขึ้นมา เรือประจัญบาน[GER.GetAdjective]ลําแรกที่จมในสงครามครั้งนี้ เมื่อถูกถามถึงเรื่องนี้ เขาพึมพําอะไรบางอยางเกี่ยวกับ 'ศักดิ์ศรี' และ 'อยามาถามฉัน' เปนภาษาสเปนกะทอนกะแทน อยางไรก็ตาม มากูเรือกราฟชเปกันเถอะ!"

ARG_ligas_patrioticas_tt: "ปลดล็อกแมแบบกองพล Ligas Patrióticas และเกณฑหนวย§Yหา§!หนวยใน §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
ARG_guardia_nacional_tt: "§Y$ARG_pedro_pablo_ramirez$§! ขึ้นเปนผูนําของ §Y$ARG_gen_nazism_party_long$§! และพรรครัฐบาลจะเปลี่ยนเปน§Yฟาสซิสต§!"
ARG_union_nacional_fascista_tt: "§Yนิมิโอ เด อันกิน§! ขึ้นเปนผูนําของ §Y$ARG_fascism_party_long$§! และพรรครัฐบาลจะเปลี่ยนเปน§Yฟาสซิสต§!"
ARG_nationalist_faction: "สมาพันธฟาสซิสต"
ARG_communist_faction: "สากลอเมริกาใต"
ARG_democratic_faction: "พันธมิตรมอนโร"

#GUAY#
GUAY_disperse_military_power: "กระจายอํานาจทางทหาร"
GUAY_disperse_military_power_desc: "เพื่อรักษาอนาคตของคณะรัฐมนตรี เราตองทําใหแนใจวากองทัพจะไมสามารถยึดอํานาจไปเปนของตนได"

GUAY_nationalize_foreign_owned_companies: "โอนบริษัทตางชาติเปนของรัฐ"
GUAY_nationalize_foreign_owned_companies_desc: "บริษัทตางชาติขูดรีดทรัพยากรของเราเพื่อผลประโยชนของตนมานานเกินไปแลว ตอไปนี้จะไมมีอีก"

GUAY_urbanization: "การพัฒนาเมือง"
GUAY_urbanization_desc: "เพื่อนําพลเมืองของเราออกจากความยากจน เราจะพาพวกเขาเขาสูเมืองใหญที่ซึ่งเขาถึงความมั่งคั่งและการศึกษาไดมากกวา"

GUAY_abolish_low_level_income_tax: "ยกเลิกภาษีเงินไดระดับลาง"
GUAY_abolish_low_level_income_tax_desc: "การเก็บภาษีจากคนที่ยากจนที่สุดในสังคมไมสมเหตุสมผล สิ่งนี้ตองถูกยกเลิก"

GUAY_free_seconday_schools: "โรงเรียนมัธยมฟรี"
GUAY_free_seconday_schools_desc: "การศึกษาคือศิลาฤกษของเศรษฐกิจที่ทํางานไดดี เราจะลงทุนในดานนี้เพื่อคนรุนตอไป"

GUAY_the_stuff_of_legends: "ตํานานที่ถูกจารึก"
GUAY_the_stuff_of_legends_cores_tt_arg: "ควบคุมดินแดนหลักเริ่มตนทั้งหมดของ§Yอารเจนตินา§!"
GUAY_the_stuff_of_legends_cores_tt_bra: "ควบคุมดินแดนหลักเริ่มตนทั้งหมดของ§Yบราซิล§!"
GUAY_the_stuff_of_legends_cores_tt_bol: "ควบคุมดินแดนหลักเริ่มตนทั้งหมดของ§Yโบลิเวีย§!"
GUAY_the_stuff_of_legends_cores_tt_urg: "ควบคุมดินแดนหลักเริ่มตนทั้งหมดของ§Yอุรุกวัย§!"
GUAY_the_stuff_of_legends_cores_tt_par: "ควบคุมดินแดนหลักเริ่มตนทั้งหมดของ§Yปารากวัย§!"
GUAY_the_stuff_of_legends_desc: "สิ่งที่เริ่มตนจากความฝนไดกลายเปนความจริง ภายใตการนําของเรา เราไดกุมอํานาจเหนือทวีปอยางมั่นคงและหลอหลอมอัตลักษณอันเปนเอกลักษณขึ้นมา เรื่องนี้จะถูกจารึกในหนาประวัติศาสตรและกลายเปนตํานาน"

GUAY_meet_with_the_old_powers: "พบปะมหาอํานาจเกา"
GUAY_meet_with_the_old_powers_tt: "ปลดล็อกการตัดสินใจเพื่อเขาแนวรวมกับมหาอํานาจโลกเกาหนึ่งชาติ ใหคุณเลือกโบนัสหนึ่งอยางตามมหาอํานาจที่เขารวม"
GUAY_meet_with_the_old_powers_desc: "ประเทศของเราเล็กแตมีความทะเยอทะยานใหญ เราจึงตองการความรูจากมหาอํานาจเกี่ยวกับวิธีเอาชนะเพื่อนบาน"

GUAY_dam_construction: "การกอสรางเขื่อน"
GUAY_dam_construction_desc: "ประเทศของเรามีโอกาสมากมายสําหรับเขื่อนไฟฟาพลังนํ้า แตมีเงินสํารองไมพอจะดําเนินโครงการราคาแพงเชนนี้ บางทีอาจมีหุนสวนที่ยินดีใหเรากูยืมก็ได?"
GUAY_dam_construction_desc_tt: "เราตองชําระคืนเงินลงทุนหลังจาก §Y720 วัน§! การชําระคืนจะเปนโมฆะหากเราทําสงครามกับประเทศนั้นกอนถึงกําหนดชําระ"

GUAY_not_at_war_with_old_power: "ไมไดอยูในสงครามกับมหาอํานาจเกาที่เลือกเขาแนวรวม"
GUAY_has_picked_old_power: "ไดเลือกมหาอํานาจเกาที่จะเขาแนวรวมแลว"
GUAY_old_world_power_faction: "มหาอํานาจโลกเกาอยูในฝายหรือเปนผูนําฝาย"
GUAY_old_world_power_scope: "§Yหุนสวนมหาอํานาจโลกเกา§!:"

GUAY_tag_the_economic_miracle: "ปาฏิหาริยทางเศรษฐกิจแหงอเมริกาใต"
GUAY_beef_and_hide_industry: "อุตสาหกรรมเนื้อวัวและหนังสัตว"
GUAY_beef_and_hide_industry_desc: "เศรษฐกิจหลักของประเทศเราหมุนรอบเนื้อวัวและหนังสัตว จึงสมเหตุสมผลที่จะขยายมัน"
GUAY_protect_domestic_industries_beef: "การทํา $GUAY_beef_and_hide_industry$ สําเร็จจะ\nเพิ่ม: §G1§! §Yโรงงานพลเรือน§!\nเพิ่ม: §G1§! ชองอาคาร"
GUAY_protect_domestic_industries_agricultural: "การทํา $GUAY_agricultural_colonization$ สําเร็จจะ\nเพิ่ม: §G1§! §Yโรงงานพลเรือน§!\nเพิ่ม: §G1§! ชองอาคาร"
GUAY_protect_domestic_industries_cash_crop: "การทํา $GUAY_cash_crop_exports$ สําเร็จจะ\nเพิ่ม: §G1§! §Yโรงงานพลเรือน§!\nเพิ่ม: §G1§! ชองอาคาร"
GUAY_protect_domestic_industries_wool_makers: "การทํา $GUAY_wool_makers$ สําเร็จจะ\nเพิ่ม: §G1§! §Yโรงงานพลเรือน§!\nเพิ่ม: §G1§! ชองอาคาร"

GUAY_cash_crop_exports: "สงออกพืชเศรษฐกิจ"
GUAY_cash_crop_exports_desc: "ประเทศของเรามีเงื่อนไขพรอมสมบูรณที่จะขายพืชเศรษฐกิจจํานวนมากใหประเทศอื่น การสงออกสินคาลํ้าคานี้จะนําความมั่งคั่งมาสูเรามากขึ้น"

GUAY_export_focus: "มุงเนนการสงออก"
GUAY_export_focus_desc: "เราควรทําใหทุกคนทั่วทุกสารทิศรูจักประเทศของเรา เพื่อกระตุนความตองการทุกอยางตั้งแตการทองเที่ยวไปจนถึงการสงออกเนื้อวัวสูโลกกวาง ใหพวกเขาไดรูจัก[FROM.GetNameDefCap]!"

GUAY_agricultural_colonization: "บุกเบิกพื้นที่เกษตร"
GUAY_agricultural_colonization_desc: "การเกษตรเปนสวนสําคัญของเศรษฐกิจเรามาตลอด การขยายพื้นที่ดวยการถางที่ดินจะสรางผลกําไรเพิ่มขึ้น"

GUAY_wool_makers: "ผูผลิตขนแกะ"
GUAY_wool_makers_desc: "ขนแกะเปนสินคาสําคัญสําหรับทุกคน และเราพรอมจะจัดหาให อยางไรเสียทุกคนก็ตองการความอบอุนในฤดูหนาว"

GUAY_form_ties_with_the_military: "สานสัมพันธกับกองทัพ"
GUAY_form_ties_with_the_military_desc: "รัฐบาลปจจุบันลมเหลวในการสรางเสถียรภาพที่ประเทศตองการ เราจะใชกองทัพดําเนินการอยางเด็ดขาดและโคนระบอบที่ลมเหลวนี้"

GUAY_place_opposition_leaders_in_house_arrest: "กักบริเวณผูนําฝายคานในบาน"
GUAY_place_opposition_leaders_in_house_arrest_desc: "เราตองเคลื่อนไหวอยางรวดเร็วเพื่อกระชับการควบคุมประเทศ เราจะกักบริเวณฝายคานไวในบานจนกวารัฐประหารจะเสร็จสิ้น"

GUAY_enact_martial_law: "ประกาศกฎอัยการศึก"
GUAY_enact_martial_law_desc: "ความไมสงบกําลังเพิ่มขึ้น เราตองควบคุมกระแสขาวสารและคุมประชาชนไว เพื่อหลีกเลี่ยงการนองเลือดโดยไมจําเปนซึ่งอาจทําใหสถานการณออกนอกลูนอกทาง"

GUAY_coup_detat: "ผลพวงของรัฐประหาร"
GUAY_coup_detat_desc: "รัฐบาลเกาลมสลายแลว! เราควบคุมสถาบันทั้งหมดไดแมจะมีการเผชิญหนากับกองกําลังฝายรัฐบาลในชวงสั้น ๆ พวกเขาถูกปลดอาวุธโดยไมมีผูบาดเจ็บลมตาย และอาวุธของพวกเขาถูกเพิ่มเขาคลังของเรา"

GUAY_cult_of_personality: "ลัทธิบูชาตัวบุคคล"
GUAY_cult_of_personality_desc: "เพื่อเสริมความแข็งแกรงใหชาติ เราจะยกยองผูนําอันเปนที่รักและสรางลัทธิบูชาตัวบุคคล ใหเปนสัญลักษณที่สามัญชนจะรวมพลังและยอมตายเพื่อ"

GUAY_appease_the_generals: "เอาใจเหลานายพล"
GUAY_appease_the_generals_tt: "นายพลจะไดรับคาสถานะเพิ่มเติมและคุณลักษณะแบบสุมหนึ่งอยาง"
GUAY_appease_the_generals_desc: "เหลานายพลที่ชวยใหเรายึดอํานาจในประเทศไดยอมคาดหวังสิ่งตอบแทน อยาชักชานานเกินไป มิฉะนั้นพวกเขาอาจหันมาตอตานเรา"
GUAY_appease_the_generals_eq_trigger_tt: "มียุทโธปกรณทหารราบในกองทัพมากกวา §Y2500§!"


GUAY_a_domestic_arms_factory: "โรงงานอาวุธในประเทศ"
GUAY_a_domestic_arms_factory_desc: "แมเศรษฐกิจของเราจะไมอาจแขงขันกับมหาอํานาจเกาแหงยุโรปได แตเราก็ไมอาจพึ่งพาการคาอาวุธจากตางชาติไดทั้งหมด เราจะเริ่มกระบวนการผลิตอาวุธภายในประเทศ เผื่อวันใดที่เราถูกโดดเดี่ยว"

GUAY_penal_battalions: "กองพันนักโทษ"
GUAY_penal_battalions_tt: "เพิ่ม §Yกองพันนักโทษ 6 กองพัน§! พรอมกําลังพลเต็มอัตรา ปลดล็อก §Yกองพันนักโทษ§!"
GUAY_penal_battalions_desc: "กองทัพของเราอยูในสภาพยํ่าแยดวยมีผูสมัครเพียงไมกี่คน การเกณฑจากเรือนจําอาจเปนทางออกที่ใช"

GUAY_rekindle_old_gripes: "[GUAY_rekindle_old_gripes]"
GUAY_rekindle_old_gripes_desc: "[GUAY_rekindle_old_gripes_desc]"


GUAY_rekindle_old_gripes_URG: "ปลุกความแคนเกา"
GUAY_rekindle_old_gripes_URG_desc: "ทั้ง[ARG.GetName]และ[BRA.GetName]ตางเคยใชเราเปนเครื่องมือเพื่อผลประโยชนของตนมาในอดีต สงผลรายแรงตอประชาชนของเรา เราตองขยายดินแดนออกไปเพื่อปองกันไมใหกองกําลังศัตรูเขาใกลมอนเตวิเดโออีกเลย"

GUAY_rekindle_old_gripes_PAR: "ใตเงาไตรภาคี"
GUAY_rekindle_old_gripes_PAR_desc: "ประชากร 60% เสียชีวิตในสงครามไตรภาคี และประเทศของเราไมเคยฟนตัวไดอีกเลย มีเพียงการขยายดินแดนเทานั้นที่จะนําเสถียรภาพและความมั่งคั่งมาสูประชาชน เราจะไมใชชีวิตอยูใตเงาของพันธมิตรตองสาปนั้นอีกตอไป"
GUAY_rekindle_old_gripes_ARG_PAR_tt: "หากเราควบคุม §Y[957.GetName]§! ไดภายใน §Y365 วัน§! นับจากสงครามปะทุ [ARG.GetName]จะตองยอมสงบศึกโดยไมมีเงื่อนไข มิฉะนั้นจะสูญเสียขวัญกําลังใจอยางรายแรง"
GUAY_rekindle_old_gripes_BRA_PAR_tt: "หากเราควบคุม §Y[504.GetName]§! ไดภายใน §Y365 วัน§! นับจากสงครามปะทุ [BRA.GetNameDef]จะตองยอมสงบศึกโดยไมมีเงื่อนไข มิฉะนั้นจะสูญเสียขวัญกําลังใจอยางรายแรง"

GUAY_rekindle_old_gripes_ARG_URG_tt: "หากเราควบคุม §Y[510.GetName]§! ไดภายใน §Y365 วัน§! นับจากสงครามปะทุ [ARG.GetName]จะตองยอมสงบศึกโดยไมมีเงื่อนไข มิฉะนั้นจะสูญเสียขวัญกําลังใจอยางรายแรง"
GUAY_rekindle_old_gripes_BRA_URG_tt: "หากเราควบคุม §Y[502.GetName]§! ไดภายใน §Y365 วัน§! นับจากสงครามปะทุ [BRA.GetNameDef]จะตองยอมสงบศึกโดยไมมีเงื่อนไข มิฉะนั้นจะสูญเสียขวัญกําลังใจอยางรายแรง"

GUAY_mobalize_the_economy: "ระดมเศรษฐกิจ"
GUAY_mobalize_the_economy_desc: "เราตองเริ่มระดมเศรษฐกิจเพื่อเตรียมพรอมรับทุกสถานการณ ประชาชนอาจบน แตพวกเขาตองรูวาตนกําลังรับใชเปาหมายที่สูงกวา"

GUAY_adopt_minority_languages: "ใชภาษาชนกลุมนอย"
GUAY_adopt_minority_languages_desc: "เพื่อเสริมขวัญกําลังใจและลดความเสี่ยงที่ขาวกรองทางทหารจะรั่วไหล เราจะใชภาษาของเราเองทั่วทั้งกองทัพ"

GUAY_mythologize_the_father_of_the_nation: "สรางตํานานบิดาแหงชาติ"
GUAY_mythologize_the_father_of_the_nation_desc: "[GUAY_mythologize_the_father_of_the_nation_desc]"

GUAY_mythologize_the_father_of_the_nation_urg: "โฆเซ อารติกัส ไดรับการยกยองเปนบิดาแหงชาติผูตอสูเพื่อเอกราชของเราจากเพื่อนบานที่เปนศัตรูและมหาอํานาจยุโรป มรดกและอุดมการณของเขาจะถูกสถาปนาเปนสถาบัน และกลายเปนสวนหนึ่งของความหมายของการเปนชาวอุรุกวัย"
GUAY_mythologize_the_father_of_the_nation_par: "ฟรันซิสโก โลเปซ นําประเทศตอสูกับไตรภาคี โดยไมยอมจํานนแมตองเผชิญการโจมตีจากสามชาติ ความมุงมั่นและเจตจํานงเชนนี้จะถูกจารึกไวในใจทหารทุกนาย"

GUAY_the_permanent_leader: "ผูนําตลอดกาล"
GUAY_the_permanent_leader_desc: "[ROOT.GetLeader]คือสัญลักษณของประเทศ ดังนั้นเราจะยกยองเขาไวบนแทน เพื่อใหทหารทั่วไปมีสิ่งยึดเหนี่ยวรวมใจ เขาจะเปนผูนําตลอดกาลของประเทศเรา"

GUAY_long_term_contracts: "สัญญาอาวุธระยะยาว"
GUAY_long_term_contracts_desc: "เราไมอาจหวังจะแขงขันกับเพื่อนบานในฐานะผูนําดานการผลิตอาวุธ แตการไดสัญญาอนุญาตผลิตระยะยาวกับมหาอํานาจจะชวยใหเราผลิตสิ่งเหลานี้ไดในราคาที่ถูกลง"

GUAY_clamp_down_on_new_territories: "ปราบปรามดินแดนใหม"
GUAY_clamp_down_on_new_territories_desc: "เราปลอยใหเกิดอนาธิปไตยในดินแดนใหมไมได เราตองลดการตอตานและลงโทษศัตรูของรัฐ"

GUAY_develop_new_territories: "พัฒนาดินแดนใหม"
GUAY_develop_new_territories_desc: "วิธีที่ดีที่สุดในการทําใหการเปลี่ยนมือดินแดนราบรื่นคือการมอบคุณภาพชีวิตที่ดีกวาที่ผูคนเคยมี นั่นจะเปนนโยบายของเรา"

GUAY_a_deal_with_devil: "ขอตกลงกับปศาจ"
GUAY_a_deal_with_devil_desc: "เห็นไดชัดวาเราไมอาจอยูรอดไดหากปราศจากพันธมิตรในโลกที่ไมแนนอนนี้ เราจะขอเขารวมกับหุนสวนอาวุโสและผูกสัมพันธใหแนนแฟนยิ่งขึ้น หวังวาพวกเขาจะไมพาเราไปสูหายนะ"

GUAY_no_second_american_colonization: "ไมมีการลาอาณานิคมอเมริกาครั้งที่สอง"
GUAY_no_second_american_colonization_desc: "ทวีปของเราแกวงไปมาระหวางฝายอักษะกับฝายสัมพันธมิตร ขณะที่เพื่อนบานของเรามองเห็นตัวเองเพียงในฐานะผูอยูใตแอกของผูอื่น อเมริกาใตสมควรไดรับชะตากรรมที่ดีกวา เปนอิสระจากมหาอํานาจเกา กําหนดชะตาของตนเองโดยไมถูกพันธนาการดวยมรดกของการลาอาณานิคม และหากเราตองเหยียบยํ่าผูที่มีวิสัยทัศนดอยกวาเพื่อไปถึงจุดนั้น ก็ชางมัน"

GUAY_demand_a_seat_at_the_high_table: "เรียกรองที่นั่งบนโตะใหญ"
GUAY_demand_a_seat_at_the_high_table_desc: "แมเราจะมีสวนรวมไปมาก แตมหาอํานาจยังคงมองเราเปนเพียงพันธมิตรชั้นสอง เราจะเรียกรองใหไดนั่งโตะเดียวกับคนอื่น ๆ และเปนผูดูแลดินแดนทางใตในระเบียบโลกใหมนี้"

GUAY_laissez_faire: "ปลอยใหเปนไปตามกลไกตลาด"
GUAY_laissez_faire_desc: "รัฐบาลไมมีเหตุผลที่จะแทรกแซงเศรษฐกิจ ยกเวนในสถานการณพิเศษ ตลาดเสรีจะไดรับชัยชนะ!"
GUAY_laissez_faire_tt: "เจาของที่ดินจะเริ่มกอสรางอาคารในประเทศของเรา"

GUAY_land_reforms: "พัฒนาที่ดิน"
GUAY_land_reforms_desc: "เราตองปรับปรุงโครงสรางพื้นฐานในประเทศ เพราะนี่คือกาวแรกของสังคมสมัยใหมทุกสังคม"

GUAY_empower_the_land_owners: "เสริมอํานาจเจาของที่ดิน"
GUAY_empower_the_land_owners_desc: "เจาของที่ดินคือกลุมที่ทรงอิทธิพลที่สุดในประเทศ เราจะเสริมอํานาจพวกเขาดวยการมอบที่ดินเพิ่ม และในทางกลับกันเราจะไดรับการสนับสนุนจากพวกเขา"
GUAY_empower_the_land_owners_desc_tt: "เจาของที่ดินจะมีแนวโนมสรางอาคารมูลคาสูงมากขึ้น เชน §Yโรงงานพลเรือน§! §Yโรงงานทหาร§! §Yอูตอเรือ§! และ§Yชองอาคารเพิ่มเติม§!"

GUAY_river_trade: "การคาทางแมนํ้า"
GUAY_river_trade_desc: "ประเทศของเราเปนดินแดนแหงแมนํ้า การเดินเรือขามฟากไปตามแมนํ้าเหลานี้เปนสิ่งสําคัญมาตั้งแตมีประเทศนี้ จึงสมเหตุสมผลที่จะขยายการคาประเภทนี้ หากเพื่อนบานของเรายินดี"
GUAY_river_trade_tt: "เพิ่ม: §G+1§! §Yโรงงานพลเรือน§! หากความคิดเห็นกับ[THIS.GetNameDef]สูงกวา §Y49§!"

GUAY_the_tag_economic_miracle: "ปาฏิหาริยทางเศรษฐกิจแหง[THIS.GetAdjective]"
GUAY_the_tag_economic_miracle_desc: "ประเทศของเรากําลังประสบกับสิ่งที่นักวิเคราะหบางคนเรียกวาปาฏิหาริยทางเศรษฐกิจ เราเติบโตอยางรวดเร็วในชวงไมกี่ปที่ผานมา ทําใหพัฒนาอุตสาหกรรมไดอยางรวดเร็ว นักลงทุนจากทุกสารทิศแหกันมาลงทุนในเศรษฐกิจของเรา ยิ่งเรงการเติบโตนี้ใหมากขึ้น"

GUAY_heavy_industry: "อุตสาหกรรมหนัก"
GUAY_heavy_industry_desc: "แมเศรษฐกิจของเราจะพึ่งพาสินคาพื้นฐานเปนหลัก แตเราไมอาจละเลยอุตสาหกรรมหนักได การพึ่งพาสินคาตางชาติมากเกินไปทําใหเราเปราะบาง หากมีเหตุใดมาขัดขวางการคา"

GUAY_exploit_mineral_wealth: "ใชประโยชนจากแรธาตุ"
GUAY_exploit_mineral_wealth_desc: "เราไมไดมีแรธาตุมากมายนัก แตที่มีอยูเพียงนอยนิด เราจะใชใหเกิดประโยชนสูงสุด"

GUAY_protect_domestic_industries: "ปกปองอุตสาหกรรมในประเทศ"
GUAY_protect_domestic_industries_desc: "ขณะที่ทําการคากับตางประเทศ เราตองระวังอยางยิ่งไมใหสินคาตางชาติราคาถูกมาตีตลาดอุตสาหกรรมในประเทศ เราตองใชมาตรการภาษีนําเขาชุดหนึ่งเพื่อปกปองเศรษฐกิจภายในกอน"

GUAY_national_academy_of_sciences: "สถาบันวิทยาศาสตรแหงชาติ"
GUAY_national_academy_of_sciences_desc: "การลงทุนเพิ่มเติมในการวิจัยจะชวยใหเราพัฒนาอาวุธสงครามใหมไดเร็วขึ้น และไลตามมหาอํานาจไดทัน"

GUAY_national_academy_of_sciences_2: "มหาวิทยาลัยวิศวกรรมเครื่องกล[THIS.GetAdjective]"
GUAY_national_academy_of_sciences_2_desc: "อนาคตของสงครามอยูที่สงครามเทคโนโลยีขั้นสูง เราตองดึงผูคนบางสวนออกจากไรนามาสูงานวิศวกรรมทางทหาร"

GUAY_national_academy_of_sciences_3: "มหาวิทยาลัยชั้นสูงแหงอเมริกาใต"
GUAY_national_academy_of_sciences_3_desc: "ชาวอเมริกาใตทุกคนสมควรไดรับการศึกษาขั้นสูง การควบคุมทวีปทําใหเรามีทรัพยากรเหลือเฟอที่จะมอบสิ่งนั้นใหทุกคนทั้งชายและหญิง"

GUAY_cooperation_in_the_americas: "$BRA_cooperation_in_the_americas$"
GUAY_cooperation_in_the_americas_desc: "$BRA_cooperation_in_the_americas_desc$"

GUAY_defense_force: "กองกําลังปองกันตนเอง[THIS.GetAdjective]"
GUAY_defense_force_desc: "เพื่อปกปองพลเมือง เราตองจัดตั้งกองกําลังปองกันเพื่อตานทานการรุกรานที่อาจเกิดขึ้นจากเพื่อนบาน"

GUAY_specialized_terrain_training: "การฝกเฉพาะภูมิประเทศ"
GUAY_specialized_terrain_training_desc: "กองทัพของเรามีขนาดเล็ก แตสิ่งที่ขาดไปดานกําลังพลและยุทโธปกรณ เราสามารถชดเชยไดดวยคุณภาพ กองพลเฉพาะทางสามารถสูไดเกินตัวและทําหนาที่เปนเครื่องยับยั้ง"

GUAY_volunteers: "อาสาสมัคร[THIS.GetAdjective]"
GUAY_volunteers_desc: "เราสามารถหลีกเลี่ยงความขัดแยงโดยตรงและการถูกทําลายลางไดดวยการสงอาสาสมัครแทนการเขาไปพัวพันกิจการตางประเทศโดยตรง บางทีมันอาจพลิกตาชั่งได?"

GUAY_mass_drafts: "เกณฑทหารจํานวนมาก"
GUAY_mass_drafts_desc: "เห็นไดชัดวาการรักษาชายแดนไมอาจปลอยใหกองกําลังขนาดเล็กทําไดอีกตอไป ขณะที่โลกยิ่งไมแนนอนมากขึ้นเรื่อย ๆ เราตองพรอมยืนยันพรมแดนที่พระเจาประทานใหแกเรา"

PAR_mass_drafts: "$GUAY_mass_drafts$"
PAR_mass_drafts_desc: "$GUAY_mass_drafts_desc$"

GUAY_workers_rights: "สิทธิแรงงาน"
GUAY_workers_rights_desc: "แรงงานที่มีอายุยืนและมีความสุขก็ทํางานหนักขึ้นดวย การใหสิทธิแรงงานเปนผลดีทั้งตอสุขภาวะของชาติและเศรษฐกิจ"

GUAY_military_licenses: "ใบอนุญาตผลิตยุทโธปกรณ"
GUAY_military_licenses_desc: "เราตองสานสัมพันธกับประเทศที่กาวหนาทางการทหารและขอใบอนุญาตผลิตอาวุธสงครามของพวกเขา เราไมอาจพึ่งพาการผลิตภายในประเทศเพียงอยางเดียว"

one_of_the_options_tt: "ซึ่งตัวเลือกหนึ่งในเหตุการณจะมีผลดังตอไปนี้: "

PAR_reach_out_to_european_contacts: "ติดตอเครือขาย[USA.GetAdjective]เพื่อขอความชวยเหลือ"
PAR_reach_out_to_european_contacts_desc: "กองทัพแข็งแกรงเกินไปเมื่อเทียบกับกองกําลังที่เราปะติดปะตอขึ้นมา เราตองกลืนศักดิ์ศรีและติดตอ[USA.GetName]เพื่อขอความชวยเหลือ พรอมโนมนาววารัฐคอมมิวนิสตในสนามหลังบานของพวกเขาไมใชสิ่งที่นาพึงปรารถนา"

PAR_ban_vouchers: "หามจายคาจางดวยคูปอง"
PAR_ban_vouchers_desc: "เราตองหยุดนายจางไมใหจายคาจางแรงงานดวยสิ่งที่เรียกวา \"เงินขาว\" ซึ่งก็คือคูปองที่นายจางใหลูกจางแทนเงิน ทําใหความเหลื่อมลํ้าดํารงอยูตอไปและสรางการพึ่งพาใหลูกจาง เรื่องนี้ตองยุติ"


PAR_allow_unions_to_strike: "อนุญาตใหสหภาพแรงงานนัดหยุดงาน"
PAR_allow_unions_to_strike_desc: "สหภาพแรงงานที่เขมแข็งเปนสิ่งจําเปนในการปกปองแรงงาน ที่ผานมารัฐบาลตัดทอนอํานาจของสหภาพ ตอไปนี้จะไมมีอีก"

PAR_allow_women_workers: "อนุญาตแรงงานหญิง"
PAR_allow_women_workers_desc: "หลังสงครามไตรภาคีอันหายนะและสงครามชาโกที่ตามมา เราขาดแคลนแรงงานที่มีประสิทธิภาพอยางหนักเพราะขาดผูชายวัยทํางาน "

PAR_order_italian_planes: "สั่งซื้อเครื่องบิน[ITA.GetAdjective]"
PAR_order_italian_planes_desc: "เราตองปรับปรุงกองทัพใหทันสมัย เราจะติดตอ[ITA.GetName]เพื่อใหกองทัพอากาศของเราไดมาตรฐานพอจะปองกันภัยคุกคามจากเพื่อนบาน"

PAR_a_call_out_for_aid: "รองขอความชวยเหลือ"
PAR_a_call_out_for_aid_desc: "เราจะใชภรรยาชาว[FRA.GetAdjective]ของประธานาธิบดีล็อบบี้รัฐบาล[FRA.GetAdjective]ใหอนุญาตอาสาสมัครมาชวยในการตอสูของเรา"

PAR_request_weapons: "ขออาวุธจาก[USA.GetName]"
PAR_request_weapons_desc: "เราไมอาจชนะการตอสูนี้ดวยอาวุธเบาจํานวนนอยนิดที่มีอยู เราตองติดตอ[USA.GetName]และโนมนาววารัฐบาลคอมมิวนิสตใจกลางเขตอิทธิพลของพวกเขาไมใชสิ่งที่พวกเขาอยากใหเกิดขึ้น"

PAR_to_cross_a_river: "ขามแมนํ้า"
PAR_to_cross_a_river_desc: "แมนํ้าปารากวัยเปนอุปสรรคใหญสําหรับเรา และขวางการขามสวนใหญไวโดยธรรมชาติ เราควรติดตอมหาอํานาจที่มีประสบการณทางทหารและมีกองนาวิกโยธินที่แข็งแกรงมาชวยเราในภารกิจนี้"

PAR_ask_for_bankroll: "ขอทุนสนับสนุน"
PAR_ask_for_bankroll_desc: "เราไมอาจรับภาระสงครามนี้ไดขณะที่เศรษฐกิจพังยับเยิน เห็นไดชัดวาเราตองการกําลังตางชาติมาออกทุนให เพื่อไมใหทั้งประเทศดิ่งสูอนาธิปไตย"

PAR_assasinate_rafael_franco: "ลอบสังหารราฟาเอล ฟรังโก"
PAR_assasinate_rafael_franco_desc: "หากเราตัดหัวงูได ขวัญกําลังใจของศัตรูอาจลดลงอยางมาก เราจะติดตอผูตอตานในพื้นที่ชาโกและมอบเครื่องมือใหพวกเขาลงมือ"

PAR_goad_bolivia: "ยุยงโบลิเวีย"
PAR_goad_bolivia_desc: "หากเราดึงโบลิเวียเขามาในความขัดแยงได ฝายกบฏจะออนแอลงอยางมาก แมจะเสี่ยง แตเราจะปลอยโทรเลขปลอมที่บงบอกวาฟรังโกตองการขยายการพิชิตเขาสูโบลิเวียหลังสงครามกลางเมืองยุติ ดวยหวังวาจะยุยงใหรัฐบาล[BOL.GetAdjective]เขามาพัวพัน"

PAR_revenge_for_the_chaco_war: "ลางแคนสงครามชาโก"
PAR_revenge_for_the_chaco_war_desc: "[BOL.GetName]ยังคงจองมองภูมิภาคชาโก และเปนเพียงเรื่องของเวลากอนที่พวกเขาจะพยายามอางสิทธิ์อีกครั้ง เราตองเปนฝายรุกและโจมตีกอน"

PAR_access_the_sea: "เขาถึงทะเล"
PAR_access_the_sea_desc: "ชาติของเราไมเคยมีทาเรือนํ้าเค็ม แตเห็นไดชัดวามหาอํานาจทุกชาติตองมีเพื่อความมั่นคงของชาติ เราตองไดมันมาไมวาจะตองแลกดวยอะไร"

PAR_by_all_means_which_to_win: "ทุกวิถีทางเพื่อชัยชนะ"
PAR_by_all_means_which_to_win_desc: "จนกวาสงครามจะยุติ เราตองใหทั้งระบบเศรษฐกิจมุงไปที่ความขัดแยงในปจจุบัน ประชาชนจะตองลําบากจากผลนี้ แตหากเราแพสงคราม พวกเขาจะยิ่งยํ่าแยกวาภายใตแอกของพวกคอมมิวนิสต..."


PAR_military_pensions: "บํานาญทหาร"
PAR_military_pensions_desc: "รัฐบาลเกาปฏิเสธที่จะจายบํานาญทหารใหทหารผานศึกสงครามชาโก เราจะไมทําผิดพลาดซํ้า"

PAR_rebuild_humaita: "สรางอูไมตาขึ้นใหม"
PAR_rebuild_humaita_desc: "ปอมอูไมตาถูกทําลายราบในสงครามปารากวัย แตมันเคยเปนปราการตานการโจมตีจากทางใต เราจะสรางปอมปราการอันนาเกรงขามนี้ขึ้นใหม เปนสัญลักษณแหงความอดทนและถุยนํ้าลายใสหนาศัตรู"

PAR_a_great_charter: "มหากฎบัตร"
PAR_a_great_charter_desc: "รัฐธรรมนูญของเราตองถูกยกเลิก และตองรางมหากฎบัตรฉบับใหมขึ้น อนาคตใหมของประเทศ!"

PAR_pull_back_troops_from_the_chaco: "ถอนทหารออกจากชาโก"
PAR_pull_back_troops_from_the_chaco_desc: "ทหารที่ประจําการในชาโกตองถูกถอนกลับเพื่อไมใหความตึงเครียดกับ[BOL.GetName]บานปลาย ไมวากองทัพจะวาอยางไร"

PAR_central_bank_of_paraguay: "ธนาคารกลางแหงสาธารณรัฐปารากวัย"
PAR_central_bank_of_paraguay_desc: "เราจะจัดตั้งธนาคารกลางที่จะเปนชองทางเดียวสําหรับการคาตางประเทศ"

PAR_emergency_powers: "อํานาจฉุกเฉิน"
PAR_emergency_powers_desc: "สถานการณอันลอแหลมของประเทศทั้งภายในและภายนอกตองการผูนําที่เขมแข็งมายึดเราไวดวยกัน ซึ่งจะเปนไปไดก็ตอเมื่อผูนําไดรับอํานาจใหดําเนินการอยางรวดเร็วและเด็ดขาด "

PAR_chaco_war_decoration: "เครื่องราชอิสริยาภรณสงครามชาโก"
PAR_chaco_war_decoration_desc: "ทหารผานศึกสงครามชาโกสมควรไดรับเหรียญตราที่ไมเคยไดรับจากรัฐบาลชุดกอน เปนตนทุนเล็กนอยเพื่อเอาใจกองทัพ"

PAR_invite_japanese_settlers: "เชิญผูตั้งถิ่นฐานชาวญี่ปุน"
PAR_invite_japanese_settlers_desc: "เมื่อ[BRA.GetName]ระงับการอพยพของชาวญี่ปุน ก็เปนโอกาสดีที่จะเชิญพวกเขามาที่นี่แทน ผูตั้งถิ่นฐานจะชวยกระตุนการเกษตรและเศรษฐกิจโดยรวม"

PAR_suspend_elections: "ระงับการเลือกตั้ง"
PAR_suspend_elections_desc: "การเลือกตั้งตองถูกเลื่อนออกไปในสถานการณปจจุบัน การลาออกของรัฐมนตรีฝายเสรีนิยมในรัฐบาลทําใหแทบไมเหลือใครตอตานเรา"

PAR_discipline_hierarchy_and_order: "วินัย ลําดับชั้น และระเบียบ"
PAR_discipline_hierarchy_and_order_desc: "เมื่อการเลือกตั้งถูกยกเลิก เราจะประกาศนโยบายใหม "วินัย ลําดับชั้น และระเบียบ" หลักการชุดหนึ่งที่จะใชปกครองประเทศ และผูที่เผยแพรความคิดบอนทําลายจะถูกกักขัง"

PAR_get_rid_of_colonel_peredes: "กําจัดพันเอกปาเรเดส"
PAR_get_rid_of_colonel_peredes_desc: "ปาเรเดส รัฐมนตรีวาการกระทรวงมหาดไทย เปนคูแขงที่อาจเปนภัยเพราะอิทธิพลของเขา เราจะปลดเขาออกเพื่อเสริมอํานาจของเรา"

PAR_ban_the_liberal_party: "สั่งหามพรรคเสรีนิยม"
PAR_ban_the_liberal_party_desc: "พรรคเสรีนิยมสมคบคิดกับชาวโบลิเวีย การเนรเทศผูนําของพวกเขาคือบทลงโทษเดียวที่เหมาะสม เราจะรวบรวมกําลังจากพรรคโคโลราโด"

PAR_ensure_army_loyalty: "ประกันความภักดีของกองทัพ"
PAR_ensure_army_loyalty_desc: "ความไมพอใจกําลังเพิ่มขึ้น และประชาชนตอตานอยางกวางขวางพรอมการนัดหยุดงานทั่วไป เพื่อหลีกเลี่ยงการเผชิญรัฐประหารแบบเดียวกับผูนําคนกอน กองทัพจะไดรับสวนแบงกอนใหญจาก GDP ของประเทศ"

PAR_fedrerista_land_reforms: "การปฏิรูปที่ดินแบบเฟเบรริสตา"
PAR_fedrerista_land_reforms_desc: "เราตองปฏิรูปที่ดินอยางจริงจังเพื่อเสริมพลังเกษตรกรและกระจายที่ดินจากเจาของที่ดินผูทรงอิทธิพล"

PAR_align_with_the_guion_rojo: "รวมมือกับกีออนโรโฆ"
PAR_align_with_the_guion_rojo_desc: "เราตองดึงองคกรกึ่งทหารของพรรคโคโลราโดและผูนําของพวกเขา ฆวน นาตาลิซิโอ กอนซาเลซ มาอยูใตปกของเรา เราจะใชพวกเขาขมขูและคุกคามฝายคานทางการเมือง"

PAR_nazify_the_army: "ทําใหกองทัพเปนนาซี"
PAR_nazify_the_army_desc: "สัญลักษณนาซีกําลังแพรกระจายราวไฟลามทุงทั่วกองทัพ การทําอยางอื่นนอกจากยอมรับหรือแมแตสงเสริมจะทําใหกองทัพขุนเคือง เราสามารถใชสิ่งนี้เพื่อใกลชิดกับ[GER.GetName]มากขึ้น พรอมกับสรางอัตลักษณทางทหารที่แข็งแกรงขึ้น"

PAR_radicalize_the_police: "ทําใหตํารวจหัวรุนแรง"
PAR_radicalize_the_police_desc: "ตํารวจมีบทบาทสําคัญในการรักษาความสงบภายใน ขณะที่กองทัพมุงรับมือภัยคุกคามภายนอก แตพวกเขาสามารถเปนเครื่องมือคํ้าจุนรัฐที่ยิ่งใหญกวานี้ได เราจะมอบทรัพยากรใหมากขึ้น และแลกกับการดึงพวกเขาเขามาอยูใตรัฐบาล และหากกองทัพหรือตํารวจฝายใดมีอํานาจมากเกินไป เราก็ยุใหสองฝายขัดกันเองไดเสมอ"

PAR_neuter_the_guion_rojo: "ลดทอนกีออนโรโฆ"
PAR_neuter_the_guion_rojo_desc: "กีออนโรโฆ กลุมกึ่งทหารหัวรุนแรงของพรรคโคโลราโด เปนภัยตอความมั่นคงของรัฐบาลและเปนหนามยอกอกเรามาตลอด เราตองสยบและปลดอาวุธกลุมนี้กอนที่จะบานปลายเปนความขัดแยงเต็มรูปแบบ"

PAR_get_rid_of_obsolete_guns: "กําจัดปนลาสมัย"
PAR_get_rid_of_obsolete_guns_desc: "อาวุธยุทโธปกรณของกองทัพเราประกอบดวยปนที่ลาสมัย เราตองปรับปรุงใหทันสมัยดวยการกําจัดเศษเหล็กที่ถวงเราไวและปรับปรุงคลังเก็บใหทันสมัย"

PAR_liga_nacional_independiente: "สันนิบาตแหงชาติอิสระ"
PAR_liga_nacional_independiente_desc: "เพื่อผลักดันวาระของผูนํา เราจะเสริมความแข็งแกรงใหกลุมกาวหนา LNI เพื่อเพิ่มความชอบธรรมใหรัฐบาลและปดปากผูเห็นตาง"

PAR_union_nacional_revolucionaria: "พรรคปฏิวัติเฟเบรริสตา"
PAR_union_nacional_revolucionaria_desc: "พรรคใหมของเราจะเปนพรรคการเมืองเดียวที่ถูกกฎหมายในประเทศ จุดเริ่มตนใหมของสหภาพแหงชาติปฏิวัติ ซึ่งอํานาจและสถาบันของประเทศลวนมาจากผูนําพรรค" 

PAR_accept_american_loans: "รับเงินกูจากอเมริกา"
PAR_accept_american_loans_desc: "ชาวอเมริกันกดดันไมใหเราเขารวมฝายอักษะ และยินดีลงทุนอยางมหาศาลในประเทศของเราเพื่อปองกันไมใหเราเอนเอียงไปหาศัตรูของพวกเขา"

PAR_agricultural_technical_assistence: "ความชวยเหลือทางเทคนิคดานการเกษตรและการแพทย"
PAR_agricultural_technical_assistence_desc: "ชาวอเมริกันยินดีชวยปรับปรุงเทคโนโลยีดานการเกษตรและการแพทยของเราใหทันสมัย หากเราเลื่อนแผนใด ๆ ที่คุกคามผลประโยชนของพวกเขาออกไป"

PAR_put_estigarribia_on_a_pedestal: "ยกยองเอสติการริเบีย"
PAR_put_estigarribia_on_a_pedestal_desc: "โฆเซ เฟลิกซ เอสติการริเบีย ไดรับการยกยองอยางกวางขวางวาเปนวีรบุรุษแหงสงครามชาโก และบัดนี้ยังเปนบุคคลสําคัญในการชนะสงครามกลางเมือง เราจะใชเขาเพื่อการโฆษณาชวนเชื่อในการลดความวุนวายจากสงครามกลางเมืองและรวมประเทศเปนหนึ่ง พรอมตอบแทนการรับใชของเขา"

PAR_purge_the_military_of_dissent: "กวาดลางผูเห็นตางในกองทัพ"
PAR_purge_the_military_of_dissent_desc: "เอสติการริเบียตกลงจะถอนรากผูเห็นตางที่หลงเหลืออยูในกองทัพ และกวาดลางความเชื่อมโยงกับการปฏิวัติของฟรังโก"

PAR_aftermath_of_the_coup: "ผลพวงของสงครามกลางเมือง"
PAR_aftermath_of_the_coup_desc: "ประเทศยอยยับหลังตองทนรับการโจมตีครั้งแลวครั้งเลา สงครามไตรภาคี ความขัดแยงชาโก และบัดนี้สงครามกลางเมืองครั้งที่สอง ไดทิ้งแผนดินของเราไวในสภาพพังพินาศ แตเราจะทําอะไรไดนอกจากอดทน? วันนี้คือจุดเริ่มตนของการฟนฟูครั้งใหญ สันติภาพและความยุติธรรม! เพื่อปารากวัย!"

PAR_soliders_for_prisoners: "นักโทษเปนทหาร"
PAR_soliders_for_prisoners_desc: "กองทัพของเราขาดแคลนกําลังพลหลังสงครามกลางเมือง ทําใหประเทศเปราะบาง เมื่อ[BOL.GetName]รอจังหวะเหมาะที่จะยึดชาโกคืน เราตองการกําลังพลจํานวนมากอยางเรงดวนเปนแนวรับ เราจะนิรโทษกรรมนักโทษหากพวกเขาตกลงเขารวมกองทัพและเสริมกําลังของเราจนกวาจะจัดตั้งกองทัพที่เหมาะสมได"

PAR_brazilian_road_finance: "ทุนสรางถนนจาก[BRA.GetAdjective]"
PAR_brazilian_road_finance_desc: "[USA.GetName]โนมนาวรัฐบาล[BRA.GetAdjective]ใหลงทุนขยายโครงสรางพื้นฐานถนนของเรา"

par_has_accepted_american_funds: " ไดรับเงินทุนอเมริกัน @USA แลว"
par_has_accepted_american_funds_tt: "จะรับเงินทุน @USA§Y[USA.GetAdjective]§! ทําใหไมสามารถเขารวมฝายอื่นไดเปนเวลา §Y210 วัน§!"

PAR_join_the_allies: "เขารวมฝายสัมพันธมิตร"
PAR_join_the_allies_desc: "[USA.GetName]กดดันใหเราเขารวมฝายสัมพันธมิตร และเราไมเห็นทางเลือกอื่นที่จะไมนําไปสูการควํ่าบาตรครั้งใหญ"

PAR_join_the_axis: "เขารวมฝายอักษะ"
PAR_join_the_axis_desc: "เห็นไดชัดวาพันธมิตรทางอุดมการณของเราคือชาว[GER.GetAdjective]และพันธมิตรของพวกเขา เราจะเขารวมฝายอักษะและรื่นรมยในระเบียบโลกใหมนี้"

PAR_join_the_cominterm: "เขารวมโคมินเทิรน"
PAR_join_the_cominterm_desc: "ทั้งฝายอักษะและฝายสัมพันธมิตรไมไดนําไปสูทางเลือกที่สอดคลองกับอุดมการณของเรา แต[SOV.GetName]คือทางเลือกที่ชัดเจนนอกเหนือจากความชั่วรายอีกสองฝาย"

PAR_mythologize_the_father_of_the_nation: "$GUAY_mythologize_the_father_of_the_nation$"
PAR_mythologize_the_father_of_the_nation_desc: "$GUAY_mythologize_the_father_of_the_nation_desc$"

