 CHL_high_quality_nitrate: "ดินประสิวคุณภาพสูง"
 CHL_high_quality_nitrate_desc: "แมอุตสาหกรรมของเราอาจยังไมแข็งแกรงที่สุดในตอนนี้ แตยังมีอีกสิ่งหนึ่งที่ทําใหเราโดดเดนกวาใคร นั่นคือดินประสิวที่มีอยูอยางอุดมสมบูรณ และการผลิตสวนใหญของโลกอยูภายในพรมแดนของเรา ดังนั้นเราจึงสามารถทําใหมีเพียงเราเทานั้นที่ไดวัตถุดิบคุณภาพสูงสุด ขณะที่ขายดินประสิวที่ผานการกลั่นนอยกวาออกไป"

 CHL_contract_efe: "ทําสัญญากับ EFE"
 CHL_contract_efe_desc: "ปจจุบัน Empresa de los Ferrocarriles del Estado เปนผูดําเนินการระบบรถไฟของเรา หากเราควบคุมพวกเขาโดยตรงมากขึ้นและกํากับพวกเขาใหอยูในกรอบ เราจะมั่นใจไดวาทรัพยากรและลําดับความสําคัญของพวกเขาจะถูกวางไวในจุดที่เราตองการ"

 CHL_public_works: "โครงการงานสาธารณะ"
 CHL_public_works_desc: "นับตั้งแตวิกฤตเศรษฐกิจครั้งใหญที่เกิดจากการที่สหรัฐอเมริกาปดพรมแดนและยุติการสงออก เศรษฐกิจของเราก็พังทลายและประชาชนกระจัดกระจาย เพื่อฟนตัวจากหายนะนี้อยางมีประสิทธิภาพที่สุด เราควรสงเสริมโครงการงานสาธารณะขนาดใหญ คลายกับนโยบาย New Deal ของอเมริกา เพื่อใหประชาชนกลับมามีงานทําและใหเศรษฐกิจกลับมาเดินหนาอีกครั้ง"

 CHL_dissolve_covensa: "ยุบ COVENSA"
 CHL_dissolve_covensa_desc: "การกอตั้งบริษัทกระจายทรัพยากรภายในอยาง COVENSA เปนความผิดพลาด และเราทุกคนตางรูดี หนทางเดียวที่แทจริงในการแกปญหาเศรษฐกิจคือการเริ่มการสงออกขนาดใหญอีกครั้ง และเพื่อการนั้นเราตองยุบองคกรนี้แลวปฏิรูปใหคลายกับ COSACH ซึ่งเปนองคกรรุนกอนมากขึ้น"

 CHL_issue_bonds: "สงเสริมการซื้อพันธบัตร"
 CHL_issue_bonds_desc: "ความทรงจําเกี่ยวกับวิกฤตเศรษฐกิจเมื่อไมนานมานี้ทําใหประชาชนของเราหวาดกลัวการลงทุน ซึ่งฉุดรั้งการเติบโตทางเศรษฐกิจ ดวยการสงเสริมใหประชาชนซื้อพันธบัตรรัฐบาลพรอมคํามั่นวาจะนําเงินกลับไปลงทุนในประเทศ เราจะสราง [CHL.GetName] ที่แข็งแกรงขึ้นไดรวดเร็วยิ่งขึ้น"

 CHL_expand_the_forestry: "ขยายการปาไม"
 CHL_expand_the_forestry_desc: "ภูมิภาคตอนกลางของประเทศเรา โดยเฉพาะอาราอูกาเนีย อุดมไปดวยไม แมจะมีผูคัดคานการขยายอุตสาหกรรมในภูมิภาคเหลานี้ แตก็เปนสิ่งจําเปนหากเราตองการใหประเทศมีความมั่นคงทางเศรษฐกิจ และการไดไมพรอมกับการบุกเบิกที่ดินคือหนทางที่เร็วที่สุด"
 CHL_expand_the_forestry_decision_tt: "ปลดล็อกการตัดสินใจ §Yขยายการปาไม§! ใน §Y[950.GetName]§! และ §Y[279.GetName]§! \n" 

 CHL_government_mandated_contracts: "สัญญาที่รัฐบาลอุดหนุน"
 CHL_government_mandated_contracts_desc: "เพื่อใหผูคนออกมาทํางานและทําหนาที่ของตนมากขึ้น เราควรพิจารณาอุดหนุนสัญญาของภาคอุตสาหกรรมและจายเงินเดือนบางสวนเอง ดวยวิธีนี้ บริษัทตาง ๆ จะกลาจางงานมากขึ้น และผูคนจะมีเงินใชจายและหมุนกลับเขาสูระบบเศรษฐกิจมากขึ้น"

 CHL_we_must_dig_deeper: "เราตองขุดใหลึกยิ่งขึ้น"
 CHL_we_must_dig_deeper_desc: "ไมมีคําวาขุดลึกเกินไป แมวาเราจะตองขุดอุโมงคใตเมืองของเราเองจนฐานรากเสียหายเล็กนอยก็ตาม หากเราจะฟนฟูเศรษฐกิจดวยการสงออก เราตองกลาเสี่ยงและทําอยางรวดเร็ว เพื่อใหไดผลผลิตจากเหมืองมากที่สุดเทาที่จะเปนไปได"

 CHL_establish_trade_relationships: "สรางความสัมพันธทางการคาที่เปนประโยชน"
 CHL_establish_trade_relationships_desc: "การคาจะประสบความสําเร็จไดตองอาศัยหลายปจจัย และการมีทรัพยากรที่เปนที่ตองการก็ไมใชปจจัยเดียว เรายังตองมีคูคาที่ไวใจได และสัญญาที่ไมขายแรงงานและทรัพยากรธรรมชาติของเราในราคาถูกเกินไป ดังนั้นเราควรเขาหาพี่นองของเราในทวีปอเมริกา เพื่อใหแนใจวาเรารูจักผูที่เราคาขายดวย"

 CHL_international_loans: "เงินกูระหวางประเทศ"
 CHL_international_loans_desc: "การโลส อิบาเญซ เดล กัมโป อดีตประธานาธิบดีของเรา พยายามแกไขวิกฤตเศรษฐกิจดวยการกูเงินจากตางชาติแลวนําเงินมาลงทุนในรัฐ โดยหวังวาจะสรางมูลคาไดมากพอที่จะชําระคืนในภายหลัง และกลยุทธนี้ก็ประสบความสําเร็จในบางดาน เราควรเดินตามรอยของเขาและทําเชนเดียวกันอีกครั้ง"
 CHL_CHL_international_loans_tt: "ปลดล็อกการตัดสินใจ §Yกูเงิน§! จากตางชาติเพื่อปรับปรุงเศรษฐกิจ"

 CHL_connect_the_northern_railways: "เชื่อมทางรถไฟภาคเหนือ"
 CHL_connect_the_northern_railways_desc: "ทางรถไฟและถนนในภาคเหนือ โดยเฉพาะในอาริกา เชื่อมตอกับระบบโครงสรางพื้นฐานสวนอื่นของเราไดไมดีนัก จึงตองทุมเทความพยายามในการปรับปรุงโครงสรางพื้นฐานโดยรวมของภูมิภาคเหนือสุด"

 CHL_expand_southern_infrastructure: "ขยายโครงสรางพื้นฐานภาคใต"
 CHL_expand_southern_infrastructure_desc: "ปจจุบันแทบไมมีโครงสรางพื้นฐานที่แทจริงในดินแดนใตสุดของชิลีเลย และไมมีเสนทางรถไฟแมแตสายเดียว เราจึงตองทุมเทความพยายามอยางมากเพื่อเชื่อมเมืองทาทางใตอยางปุนตาอาเรนัสและปุนตาเดลกาดาเขากับเสนทางรถไฟของเรา"

 CHL_devalue_the_peso: "[CHL_devalue_the_peso_key]"
 CHL_devalue_the_peso_desc: "[CHL_devalue_the_peso_key_desc_key]"

 CHL_devalue_the_peso_peso: "ลดคาเงินเปโซ"
 CHL_devalue_the_peso_peso_desc: "ขณะที่ประเทศอื่น ๆ ยอมใหคาเงินของตนลดลงเพื่อชวยเศรษฐกิจ เรากลับยังไมไดทําเชนนั้น ผลก็คือเราลาหลังไปไกลมาก หากเราตองการตามใหทัน เราตองไมรอชาในการลดคาเงิน แมวาจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"

 CHL_devalue_the_peso_franc: "ลดคาเงินฟรังก"
 CHL_devalue_the_peso_franc_desc: "ขณะที่ประเทศอื่น ๆ ยอมใหคาเงินของตนลดลงเพื่อชวยเศรษฐกิจ เรากลับยังไมไดทําเชนนั้น ผลก็คือเราลาหลังไปไกลมาก หากเราตองการตามใหทัน เราตองไมรอชาในการลดคาเงิน แมวาจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"

 CHL_utlilize_famae: "ใชประโยชนจาก FAMAE"
 CHL_utlilize_famae_desc: "อุตสาหกรรมอาวุธของเราในขณะนี้ยังตองพึ่งพาการซื้อจากตางประเทศ และมีเพียงปนเล็กยาวที่ผลิตเองในประเทศอยูบางประปราย หากเราตองการเรงการผลิตทางทหาร เราตองมีผูผลิตอาวุธที่รัฐควบคุมอยูเคียงขาง เชน Fábricas y Maestranzas del Ejército ที่มีอายุนับศตวรรษ ซึ่งจะตองไดรับการปรับปรุงใหทันสมัยโดยเร็ว"

 CHL_they_shall_not_pass: "พวกมันจะผานไปไมได"
 CHL_they_shall_not_pass_desc: "ประเทศของเราไมเพียงถูกคุกคามจากศัตรูเกาในสงครามแปซิฟกเทานั้น แตยังรวมถึงอารเจนตินา เพื่อนบานขนาดใหญที่เรามีพรมแดนรวมกันยาวเหยียด หากเราหวังจะมีโอกาสแมเพียงนอยนิดในการตั้งรับพวกเขา เราตองยันพวกเขาไวในเทือกเขาใหได พวกมันจะผานไปไมได และเราจะไมมีวันยอมแพ!"

 CHL_domestic_production_of_the_willys_mb: "ผลิต Willys MB ภายในประเทศ"
 CHL_domestic_production_of_the_willys_mb_desc: "เราสามารถผลิตอาวุธเบาและกระสุนไดมากมายภายในประเทศ แตเรายังขาดความเชี่ยวชาญในการผลิตยานยนตและยานเกราะที่ไดมาตรฐาน เพื่อบรรเทาปญหานี้ เราควรซื้อรถจากใครก็ตามที่ยินดีขาย แลวลอกแบบการออกแบบของพวกเขา"

 CHL_strengthen_the_central_bank: "เสริมความแข็งแกรงใหธนาคารกลาง"
 CHL_strengthen_the_central_bank_desc: "เพื่อใหเศรษฐกิจของเราดีขึ้นจริงมากกวาแคในนาม เราควรพยายามเสริมความแข็งแกรงให Banco Central de Chile ซึ่งกอตั้งโดยประธานาธิบดีอารตูโร อเลสซันดรี เราจะใหอิสระแกพวกเขามากขึ้นในการดําเนินการตามที่เห็นสมควร โดยหวังวาพวกเขาจะชวยเราไดในระยะยาว"

 CHL_expand_the_naval_arsenal: "ขยายคลังสรรพาวุธทางเรือ"
 CHL_expand_the_naval_arsenal_desc: "Arsenales de Marina คือผูตอเรือที่เราไววางใจได และยังชวยใหเรารักษากองเรือใหอยูในสภาพดีอยางที่ทําไดในชวงหลายปหลัง ซึ่งเหนือกวาคุณภาพการบํารุงรักษาของประเทศอื่นใดในอเมริกาใตมาก บัดนี้เราควรเพิ่มงบประมาณใหพวกเขาเพื่อเตรียมพรอมสําหรับสงคราม"

 CHL_fortify_the_coastlines: "เสริมปอมปราการชายฝง"
 CHL_fortify_the_coastlines_desc: "ชายฝงของเรายาวมาก และหากเทียบกับขนาดของประเทศแลวก็นาจะยาวที่สุดในโลก ดังนั้นหากเราพายแพในสงครามทางทะเล ทั้งประเทศจะเปดโลงและตกเปนเปาการโจมตีจากทะเล เราจึงตองสรางปอมปราการขนาดใหญที่สามารถตีโตการยกพลขึ้นบกไดทุกรูปแบบ!"

 CHL_invest_in_shipping: "ลงทุนในการเดินเรือพาณิชย"
 CHL_invest_in_shipping_desc: "ทะเลไมไดมีประโยชนเพียงดานการทหารเทานั้น เนื่องจากเราเปนประเทศที่พึ่งพาการคาเปนอยางมาก และยังมีดินแดนนอกชายฝงอยางราปานุย เราจึงควรขยายกองเรือพาณิชย และลงทุนเพื่อขยายอุตสาหกรรมการเดินเรือ"

 CHL_advancements_in_telecommunications: "ความกาวหนาดานโทรคมนาคม"
 CHL_advancements_in_telecommunications_desc: "นักวิทยาศาสตรฝายวิจัยและพัฒนาของเราเริ่มพัฒนาเทคนิคที่ดีขึ้น ไมเพียงในการใชวิทยุ แตยังขยายขอบเขตการใชงานโทรทัศน ซึ่งจะชวยใหเราเผยแพรความรูทั่วไปสูประชาชนไดงายขึ้น และสื่อสารผลการคนพบระหวางหองปฏิบัติการวิทยาศาสตรที่อยูหางไกลกันในประเทศไดดีขึ้น"

 CHL_protect_the_easter_island_tt: "เราจะไดรับ§Yเปาหมายสงครามโคนลมรัฐบาล§! ตอ §Y[JAP.GetName]§!, §Y[NZL.GetName]§! หรือ §Y[AST.GetName]§! หากประเทศเหลานั้น§Yเปนเอกราช§!และเปน§Yฟาสซิสต§!หรือ§Yไมฝกใฝฝายใด§! และกําลังทําสงครามกับ§Yประเทศประชาธิปไตยในทวีปอเมริกา§!"

 CHL_upgrade_central_bank_tt: "ยกระดับ §YBanco Central de Chile§! โดย: \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10%§!"
 right_wing_tt: "ประธานาธิบดี§Yฝายขวา§!ขึ้นสูอํานาจ"
 left_wing_tt: "ประธานาธิบดี§Yฝายซาย§!ขึ้นสูอํานาจ"
 propping_up_gustavo_ross_tt: "เมื่อ §Yกุสตาโว รอสส§! ไดเปนประธานาธิบดีแหงชิลี จะไดรับอํานาจทางการเมือง §G+75§! เสถียรภาพ §G+5%§! และมอบคุณลักษณะ §Yเปนที่นิยมในหมูประชาชน§! แกเขา ซึ่งให: ตัวคูณความเร็วการเพิ่มการยอมรับปกครอง §G+2%§! การปองกันการเปลี่ยนแปลงอุดมการณ §G+25%§! และเสถียรภาพ §G+10%§!"
 CHL_has_idea_near_anarchy: "ยังไมไดขจัดจิตวิญญาณแหงชาติ §Y$idea_CHL_near_anarchic_society$§! ออกไปจนหมดสิ้น"
 CHL_not_has_idea_near_anarchy: "ไดขจัดจิตวิญญาณแหงชาติ §Y$idea_CHL_near_anarchic_society$§! ออกไปจนหมดสิ้นแลว"
 CHL_found_national_steelworks_tt: "ปลดล็อกการตัดสินใจ §Y$CHL_expand_araucanian_steelworks_decision$§! เพื่อรับ§Yเหล็กกลา§!เพิ่มเติมใน §Y[950.GetName]§!"
 denounced_catholicism: "ประณามนิกายคาทอลิก"
 embraced_catholicism: "ยอมรับนิกายคาทอลิก"
 CHL_dispute_over_tierra_del_fuego_tt: "การกระทํานี้อาจนําไปสู§Rสงคราม§!กับผูครอบครองเตียรราเดลฟวยโก"
 CHL_reapproach_america_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yซื้ออาวุธ§!จาก§Yสหรัฐอเมริกา§!"
