PAR_the_permanent_leader_desc: "$GUAY_the_permanent_leader_desc$"

PAR_specialized_terrain_training: "$GUAY_specialized_terrain_training$"
PAR_specialized_terrain_training_desc: "$GUAY_specialized_terrain_training_desc$"

PAR_urbanization: "$GUAY_urbanization$"
PAR_urbanization_desc: "$GUAY_urbanization_desc$"

idea_PAR_emergency_powers: "ประเทศอยูภายใตอํานาจฉุกเฉิน"
idea_PAR_emergency_powers_desc: "ประเทศอยูภายใตกฎหมายฉุกเฉินที่ใหรัฐบาลปราบปรามผูเห็นตางและใชอํานาจทางการเมืองระหวางประเทศไดมากขึ้น"

URG_terras_dictatorship: "เผด็จการแตรรา"
URG_terras_dictatorship_desc: "กาเบรียล แตรรา ยึดอํานาจควบคุมประเทศสวนใหญดวยการรัฐประหารตัวเองเมื่อ 2 ปกอน แตเรายังตองทํางานตอเพื่อกระชับการควบคุมสถาบันตาง ๆ ใหมั่นคงยิ่งขึ้น"

URG_prohibition_of_usury: "หามการเรียกดอกเบี้ยเกินอัตรา"
URG_prohibition_of_usury_desc: "เราไมอาจปลอยใหผูใหกูปลอยเงินกูที่เปนประโยชนแกผูใหกูอยางไมเปนธรรมไดอีกตอไป ตองออกกฎหมายหามเรียกดอกเบี้ยเกินอัตราเพื่อปองกันเรื่องเชนนี้"

URG_womens_vote: "สิทธิเลือกตั้งของสตรี"
URG_womens_vote_desc: "รัฐใดก็ตามที่ปรารถนาจะกาวเขาสูศตวรรษใหมตองยอมรับสิทธิของสตรี และความเทาเทียมทางสิทธิระหวางเพศ"

URG_break_relations_with_the_ussr: "ตัดความสัมพันธกับ[SOV.GetName]"
URG_break_relations_with_the_ussr_desc: "[SOV.GetName]เปนสิ่งประดิษฐที่ผิดธรรมชาติ เห็นไดชัดวาหากจะมีระเบียบโลกในอนาคต มันจะอยูที่ยุโรปกลางและ[USA.GetName] เราไมเห็นเหตุผลที่จะรักษาความสัมพันธกับรัฐนอกคอก"

URG_pay_of_all_external_debts: "ชําระหนี้ตางประเทศทั้งหมด"
URG_pay_of_all_external_debts_desc: "เรายังมีหนี้ตางประเทศคางอยูกับหลายประเทศ และในสถานการณปจจุบัน ไมใชเรื่องสมควรที่รัฐจะมีหนี้คางชําระ"

URG_import_substitution: "การผลิตทดแทนการนําเขา"
URG_import_substitution_desc: "เราจะสรางเศรษฐกิจสมัยใหมบนพื้นฐานแบบจําลองการผลิตทดแทนการนําเขาของเบลเยียม"

URG_la_teja_refinery: "โรงกลั่นลาเตฆา"
URG_la_teja_refinery_desc: "การกอตั้งโรงกลั่นนํ้ามันสมัยใหมจะทําใหเราแขงขันไดบนเวทีโลกและกระจายความเสี่ยงทางเศรษฐกิจ"

URG_revaluation_law: "กฎหมายปรับคาเงิน"
URG_revaluation_law_desc: "กฎหมายปรับคาเงินป 1935 ตองไดรับการขยายเพิ่มเติม โดยใหฝายออกธนบัตรผูกขาดกิจกรรมการธนาคารทั้งหมด"

URG_brou: "BROU"
URG_brou_desc: "ธนาคารแหงสาธารณรัฐบูรพาอุรุกวัยตองไดรับหนาที่เพิ่มเติม และจัดตั้งกองทุนเงินตราเพื่อชําระหนี้ตางประเทศของเรา" 

URG_right_to_food_housing_and_health: "สิทธิในอาหาร ที่อยูอาศัย และสุขภาพ"
URG_right_to_food_housing_and_health_desc: "เราจะบรรจุสิทธิในอาหาร ที่อยูอาศัย และสุขภาพเปนศิลาฤกษสําคัญในรัฐธรรมนูญ และจายเงินชวยเหลือพลเมืองที่ยากไรที่สุด"

URG_conaprole: "Conaprole"
URG_conaprole_desc: "นมเปนสิ่งดี อุดมดวยสารอาหารและมีอยูมากมาย และเราเปนประเทศชั้นยอดที่จะใชประโยชนจากมัน สหกรณผูผลิตนมแหงชาติจะผูกขาดผลิตภัณฑนมและโครงสรางพื้นฐานที่เกี่ยวของ สงเสริมการเติบโตของประเทศ"

URG_ministry_of_public_works: "ความชวยเหลือจากกระทรวงโยธาธิการ"
URG_ministry_of_public_works_desc: "เพื่อขับเคลื่อนการพัฒนาอุตสาหกรรมของประเทศ เราจะสรางโครงการขนาดใหญดานถนนและที่พักอาศัยของแรงงานผานกระทรวงโยธาธิการ"

URG_rapid_industrialization: "เรงพัฒนาอุตสาหกรรม"
URG_rapid_industrialization_desc: "ทุกอยางพรอมแลวที่จะพาประเทศสูยุคใหม เราจะออกเดินทางสูการพัฒนาอุตสาหกรรมอยางรวดเร็วและพาประเทศเขาสูศตวรรษที่ 20 อยางแทจริง"

URG_pluna: "Pluna"
URG_pluna_desc: "Pluna เปนสายการบินแหงชาติดาวรุงที่ใหบริการทั้งขนสงสินคาและเชาเหมาลํา การลงทุนในสายการบินนี้จะพาอุตสาหกรรมการบินของเราเขาสูยุคสมัยใหม"

URG_mercado_modelo: "เมรกาโดโมเดโล"
URG_mercado_modelo_desc: "ถึงเวลาทิ้งตลาดเกษตรแบบเกาไวเบื้องหลัง และเปดตัวเมรกาโดโมเดโล ตลาดเกษตรที่ใหญที่สุดในประเทศ"

URG_tour_to_italy: "เยือน[ITA.GetName]"
URG_tour_to_italy_desc: "ผูนําของเราจะเดินทางเยือน[ITA.GetName]เพื่อกระชับความสัมพันธทางเศรษฐกิจระหวางสองประเทศ"
URG_recognize_francoist_spain: "รับรองสเปนของฟรังโก"
URG_recognize_francoist_spain_desc: "เห็นไดชัดวาสเปนของฟรังโกคือรัฐสเปนที่ชอบธรรม เราจะรับรองใหเปนสเปนที่แทจริงทันที"

URG_rincon_del_bonete_hydroelectric_power_station: "โรงไฟฟารินกอนเดลโบเนเต"
URG_rincon_del_bonete_hydroelectric_power_station_desc: "การจายไฟฟาทั่วประเทศคือกุญแจสูความทันสมัย รัฐ[GER.GetAdjective]ยินดีใหทุนกอสรางโครงการเชนนี้ ซึ่งจะกระชับความสัมพันธของเรา"

URG_allow_nazi_movements_among_german_uruguayan: "ขบวนการนาซี[GER.GetAdjective]-[URG.GetAdjective]"
URG_allow_nazi_movements_among_german_uruguayan_desc: "มีขบวนการนาซีกลุมเล็ก ๆ ในหมูชนกลุมนอย[GER.GetAdjective]-[URG.GetAdjective]ในประเทศ ซึ่งไดรับอิทธิพลจากนโยบายตางประเทศของมาตุภูมิพวกเขาอยางไมตองสงสัย บางคนเรียกรองใหปดปากวาทกรรมนี้ แตมันสามารถใชเพื่อเผยแพรวาระของเราตอไปได"

URG_merge_falangist_movements: "รวมขบวนการฟาลังเก"
URG_merge_falangist_movements_desc: "ยกเวนลัทธิแกไขอุรุกวัยที่อาดอลโฟ อาโกริโอ เปนผูปลุกกระแส ลัทธิฟาลังเกคือขบวนการอํานาจนิยมที่ไดรับความนิยมมากที่สุดในประเทศ แตพวกเขาแตกออกเปนหลายกลุม เราจะรวมพวกเขาเขาดวยกันใหเปนขบวนการที่ใหญกวาตอนแยกกันอยู"

 URG_accion_revisionista_del_uruguay: "ขบวนการแกไขแหงอุรุกวัย"
 URG_accion_revisionista_del_uruguay_desc: "อาดอลโฟ อาโกริโอ เปนหนึ่งในบุคคลสําคัญของลัทธิฟาสซิสตอุรุกวัย อิทธิพลของเขาและพวกพองอาจเปนแทนกระโดดสูขบวนการที่ยิ่งใหญกวาซึ่งจะกวาดไปทั่ว[URG.GetName] เราจะเชิญพวกเขาเขารวมรัฐบาลและมอบความชอบธรรมที่เหมาะสมให"

 URG_force_through_corporatism: "ผลักดันบรรษัทนิยม"
 URG_force_through_corporatism_desc: "รัฐบาลเคยพยายามผลักดันบรรษัทนิยมมาแลวครั้งหนึ่ง แตถูกนักการเมืองในเวลานั้นตอตานอยางหนักจนแนวคิดถูกลมเลิก วันนี้จะไมมีการประนีประนอม เราจะผลักดันกฎหมายนี้ใหผานไมวาจะตองฝาฟนอะไร"

 URG_establish_the_german_uruguayan_cultural_center: "เสริมพลังศูนยวัฒนธรรมของฟูรมันน"
 URG_establish_the_german_uruguayan_cultural_center_desc: "ศูนยวัฒนธรรม[GER.GetAdjective]-[URG.GetAdjective]กอตั้งโดยอารนุลฟ ฟูรมันน เพื่อเผยแพรโฆษณาชวนเชื่อที่สนับสนุนนาซีในประเทศ ซึ่งยิ่งเติบโตขึ้นนับตั้งแตฝายอักษะขยายตัว ขณะที่รัฐบาลพยายามปราบปราม เราจะใหทุนสนับสนุนความพยายามนี้ และติดสินบนผูที่เกี่ยวของเพื่อรักษามันไว"

 URG_the_fuhrmann_plan: "แผนฟูรมันน"
 URG_the_fuhrmann_plan_desc: "อารนุลฟ ฟูรมันน เสนอให[URG.GetName]เปนอาณานิคมของ[GER.GetName] ทําหนาที่เปนแทนกระโดดสูแนวรบฝายอักษะในอเมริกาใต อาจไมใชในฐานะอาณานิคม แตในฐานะผูดูแลอเมริกาใตของฝายอักษะละ?"

 URG_the_american_springboard: "แทนกระโดดแหงอเมริกา"
 URG_the_american_springboard_desc: "เมื่ออํานาจมั่นคงและมีผูหนุนหลังที่ทรงพลัง เราก็พรอมเริ่มพิชิตเพื่อนบานแลว"

 URG_food_for_the_warmachine: "อาหารเพื่อเครื่องจักรสงคราม"
 URG_food_for_the_warmachine_desc: "ดวยพื้นที่เกษตรกรรมจํานวนมากอยูใตการควบคุมของเรา เราสามารถเริ่มสงอาหารใหพันธมิตร เพิ่มพูนอํานาจของเรา"

 URG_colorado_victory: "ชัยชนะการเลือกตั้งของพรรคโคโลราโด"
 URG_colorado_victory_desc: "ไมเคยมีขอสงสัยเลยวาพรรคโคโลราโดจะปกครอง[URG.GetName]ตอไป"

 URG_terra_election: "การเลือกตั้งป 1938 ไดเกิดขึ้นแลว"
 
 URG_blanco_victory: "ชัยชนะการเลือกตั้งของพรรคบลังโก"
 URG_blanco_victory_desc: "ความโกลาหลซึ่งนาจะเกิดจากเผด็จการของกาเบรียล แตรรา ทําใหผูมีสิทธิเลือกตั้งหันหลังใหพรรคโคโลราโด สงพรรคบลังโกขึ้นสูอํานาจ"

URG_declare_neutrality: "ประกาศความเปนกลาง"
URG_declare_neutrality_desc: "เราไมมีกิจธุระใดที่ตองเขาไปยุงเกี่ยวกับกิจการของยุโรป"

URG_legalize_the_pool: "ทําใหการพนันฟุตบอลถูกกฎหมาย"
URG_legalize_the_pool_desc: "การทําใหการพนันฟุตบอลถูกกฎหมายจะเพิ่มรายไดของรัฐ และยังเปนที่นิยมอยางมากในหมูมวลชน"

URG_break_diplomatic_relations_with_the_axis: "ตัดความสัมพันธทางการทูตกับฝายอักษะ"
URG_break_diplomatic_relations_with_the_axis_desc: "แมจะประกาศความเปนกลาง แตเห็นไดชัดวาเราไมอาจทนตออักษะแหงความชั่วรายไดอีกตอไป กระแสลมแหงสงครามเอื้อตอฝายสัมพันธมิตรอยางชัดเจน และไมสมควรที่เราจะอยูฝายที่แพ"

URG_join_the_allies: "เขารวมฝายสัมพันธมิตร"
URG_join_the_allies_desc: "หลังแรงกดดันจาก[USA.GetName] เห็นไดชัดวาเราไมอาจอยูนอกสงครามไดอีกตอไป สิ่งเล็กนอยที่เราทําไดจะถูกทุมลงในการตอสูนี้"

URG_a_new_constitution: "รัฐธรรมนูญฉบับใหม"
URG_a_new_constitution_desc: "รัฐธรรมนูญฉบับปจจุบันใชการไมได เราตองมีฉบับใหมเพื่อผลักดันประเทศสูยุคใหม"

URG_the_good_coup: "รัฐประหาร \"ดี ๆ\""
URG_the_good_coup_desc: "รัฐธรรมนูญถูกตอตานอยางรุนแรง เราจะมัวเสียเวลากับการเมืองไรสาระไมไดหากจะพาอุรุกวัยสูอนาคต เราจะรัฐประหารตัวเองเชนเดียวกับที่แตรราเคยทํา แตแทนที่จะจับกุมจํานวนมากและใชความรุนแรง เราจะทําโดยไมมีการนองเลือดและการกดขี่ขมเหง"



URG_law_no_9914: "กฎหมายฉบับที่ 9914"
URG_law_no_9914_desc: "เมื่อ[FIN.GetName]ถูก[SOV.GetNameDef]โจมตี รัฐบาลไดอนุมัติกฎหมายฉบับที่ 9914 ซึ่งใหกันเงินเปโซไวชวยเหลือชาวฟนแลนด เราไดรวบรวมขนแกะและเนื้อวัวกระปอง 10,600,000 กรัม โดยแตละกระปองเขียนวา \"จากประชาชนอุรุกวัยถึงกองทัพผูกลาแหงฟนแลนด\""


URG_investigate_german_and_italian_cultural_organization: "สอบสวนองคกรเยอรมันและอิตาลี"
URG_investigate_german_and_italian_cultural_organization_desc: "องคกรวัฒนธรรมและกีฬาที่เกี่ยวของกับอิตาลีและเยอรมนีถูกสงสัยวาใหที่พักพิงแกผูฝกใฝฟาสซิสต เราตองจับตาและสอบสวนพวกเขาหากมีการประพฤติมิชอบใด ๆ"

URG_american_air_bases: "ฐานทัพอากาศอเมริกัน"
URG_american_air_bases_desc: "อเมริกากําลังกดดันใหเราอนุญาตใหพวกเขาตั้งฐานทัพอากาศในดินแดนของเรา สิ่งนี้จะชวยปกปองเราจากภัยคุกคามของฝายอักษะไดอยางแนนอน"

URG_law_no_9943: "กฎหมายฉบับที่ 9943"
URG_law_no_9943_desc: "แมจะเปนกลาง แตเห็นไดชัดวาโลกกําลังดิ่งสูความไมแนนอนอยางรวดเร็ว เราตองเตรียมกองกําลังและบังคับใชการเกณฑทหารทั่วประเทศเพื่อปกปองพรมแดน"

URG_herrerismo: "ลัทธิเอรเรรา"
URG_herrerismo_desc: "ผูนําของเราไดบัญญัติลัทธิเอรเรราขึ้น เปนการผสมผสานระหวางชาตินิยม อนุรักษนิยม และประชานิยม ดวยสิ่งนี้เขาหวังจะสรางฐานการเมืองที่แข็งแกรง"

URG_traditionalism: "จารีตนิยม"
URG_traditionalism_desc: "การหวนคืนสูจารีตคือหนทางสูอนาคต สิ่งที่เคยไดผลในอดีตจะไดผลในวันนี้"

URG_ruralism: "ชนบทนิยม"
URG_ruralism_desc: "ฐานเสียงของเราอยูในพื้นที่ชนบทของประเทศ และจําเปนอยางยิ่งที่เราตองลงทุนในพื้นที่เหลานั้นอยางหนัก"

URG_americanism: "อเมริกานิยม"
URG_americanism_desc: "เราตองทําใหแนใจวาประเทศของเรามุงเนนที่คุณคาแบบอเมริกาใต และปกปองคุณคาเหลานั้นในกิจการตางประเทศ"

URG_anti_imperialism: "ตอตานจักรวรรดินิยม"
URG_anti_imperialism_desc: "เราตองแสดงจุดยืนชัดเจนในการตอตานจักรวรรดินิยมและการรุกลํ้าของมหาอํานาจตางชาติในอเมริกาใต"

URG_anticentralism: "ตอตานการรวมศูนย"
URG_anticentralism_desc: "เห็นไดชัดวาความพยายามรวมศูนยประเทศไวที่มอนเตวิเดโอเปนไปไมได จะดีกวาหากยึดถือคุณคาของชนชั้นชนบทในที่ที่พวกเขาอยู และประชากรในเมืองในที่ที่พวกเขาอยู เพื่อใหทุกฝายเจริญรุงเรืองไปดวยกัน"

URG_legacy_of_batlle: "มรดกของบาเยฆา"
URG_legacy_of_batlle_desc: "ไมวาอนาคตจะพาเราไปทางใด เปนที่ชัดเจนวาพรรคโคโลราโดจะผูกพันกับมรดกของโฆเซ บาเยฆา อี ออรโดเญซ ตลอดไป เราจะยึดมั่นในอุดมการณความยุติธรรมทางสังคมอยางถวนหนาของเขาเสมอ"

URG_statism: "รัฐนิยมแบบรวมศูนย"
URG_statism_desc: "ในยุคสมัยเชนนี้ รัฐที่ชัดเจนและเขมแข็ง ซึ่งควบคุมกิจการทางสังคมและเศรษฐกิจจากสวนกลาง เปนสิ่งจําเปนอยางยิ่ง"
