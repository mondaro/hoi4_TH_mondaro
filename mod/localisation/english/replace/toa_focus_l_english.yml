l_english:

 SMB_army_default: "ติดอาวุธให Fuerzas Armadas"
 SMB_army_default_desc: "แมกองทัพของเราจะไมใชเรื่องที่จะดูแคลนได แตก็ยังออนแอกวาที่ตองการมาก การติดอาวุธสมัยใหมใหทหาร พรอมฝกใหพรอมรบไดตลอดเวลาจึงเปนสิ่งจําเปน"
 SMB_military_facilities_default: "ขยายสิ่งอํานวยการทางทหาร"
 SMB_military_facilities_default_desc: "เพื่อติดอาวุธใหกองทัพอยางเหมาะสม เราตองขยายอุตสาหกรรมอาวุธ ดังนั้นการสรางสิ่งอํานวยการทางอุตสาหกรรมใหมที่ออกแบบมาเพื่อการผลิตยุทโธปกรณทางทหารโดยเฉพาะจึงเปนสิ่งที่ขาดไมได"
 SMB_department_of_propaganda_default: "กรมโฆษณาชวนเชื่อ"
 SMB_department_of_propaganda_default_desc: "โลกกําลังลุกเปนไฟ และแมเราจะพยายามอยางเต็มที่ ก็ใชวาพลเรือนทุกคนจะสนับสนุนการทําสงคราม ดวยเหตุนี้ เราจึงตองตั้งกรมที่ทุมเทใหกับการโนมนาวประชาชนถึงประโยชนของการตอสูดวยอาวุธในระดับนานาชาติ"
 SMB_logistics_department_default: "กอตั้งกรมการสงกําลังบํารุง"
 SMB_logistics_department_default_desc: "อเมริกาใตอาจเปนบานของเรา แตก็เปนทวีปที่โหดรายสําหรับกองทัพทั่วไปที่จะสูรบ เพื่อบรรเทาปญหานี้ การตั้งเหลาทัพที่ทุมเทใหกับการบริหารจัดการและการกระจายการสงกําลังบํารุงอยางเหมาะสมโดยเฉพาะจะเปนประโยชนอยางยิ่ง"
 SMB_support_company_default: "ความสําคัญของกองรอยสนับสนุน"
 SMB_support_company_bra: "การฝกทหารชางปาดงดิบ"
 SMB_jungle_pioneers: "$SMB_support_company_bra$"
 SMB_jungle_pioneers_desc: "$SMB_support_company_default_desc$"
 SMB_jungle_pioneers_tt: "ปลดล็อกกองพันสนับสนุน §Yทหารชางปาดงดิบ:§!\n §Yปาดงดิบ§!:\n  การเคลื่อนที่ §G+30%§!, \n  การโจมตี §G+10%§!, \n  การปองกัน §G+20%§!"
 SMB_support_company_default_desc: "การกอตั้งกรมการสงกําลังบํารุงเมื่อไมนานมานี้นําไปสูการคนพบหลายอยาง ประการแรก เพื่อรักษาการไหลเวียนของเสบียง จําเปนตองผลิตยุทโธปกรณและเสบียงที่เหมาะสมในปริมาณที่เพียงพอ และวัสดุอุปกรณในปจจุบันของเราไมเพียงพอ เราตองปรับปรุงยุทโธปกรณสนับสนุนใหทันสมัย หากตองการตามคูแขงใหทัน"
 SMB_department_of_military_intelligence_default: "กรมขาวกรองทหาร"
 SMB_department_of_military_intelligence_default_desc: "แมคําทั้งสองอาจมีความหมายขัดแยงกัน แตสิ่งสําคัญคือตองเขาใจวาหากไมรูที่ตั้งและแรงจูงใจของศัตรูอยางถองแท ก็จะยากที่จะเอาชนะพวกเขาในการรบแบบประจันหนา การตั้งกรมขาวกรองทหารใหกองทัพจึงเปนสิ่งจําเปน"
 SMB_motorized_default: "ลงทุนในอุตสาหกรรมยานยนต"
 SMB_motorized_default_desc: "อนาคตของการสงครามคือยานพาหนะที่รวดเร็ว เคลื่อนที่เขาโอบลอมและทําลายศัตรูโดยไมใหมีเวลาตั้งตัว ไมใชแนวยิงของทหารราบแบบศตวรรษที่ 16 หรือ 17 ซึ่งเปนยุทธศาสตรที่สิ้นเปลืองเวลาและกําลังพลโดยไมจําเปนและไดผลไมมากนัก"
 SMB_tank_warfare_default_CHL: "การสงครามในปาตาโกเนีย"
 SMB_tank_warfare_default: "การสงครามยานเกราะ"
 SMB_tank_warfare_default_desc: "สิ่งเสริมที่ดีที่สุดสําหรับกองทัพเคลื่อนที่เร็วคือหนวยยักษเหล็กอันแข็งแกรง ที่มีอํานาจการยิงเหนือกวาแทบทุกศัตรูที่เผชิญ คําถามเดียวคือ การผลิตรถถังของเราควรมุงเนนยุทธศาสตรสายฟาแลบแบบเยอรมัน หรือควรทําหนาที่สนับสนุนทหารราบ?"
 SMB_tank_warfare_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yเลือกความเชี่ยวชาญ§!ใหโครงการยานเกราะแหงชาติของเรา"
 SMB_domestic_production_default: "มุงเนนการผลิตภายในประเทศ"
 SMB_domestic_production_default_desc: "แมจะยากกวาและใชเวลามากกวาอยางไมตองสงสัย แตการพัฒนาและผลิตรถถังในประเทศของเราเองนั้นเปนประโยชนกวามาก ทั้งเพื่อประกันคุณภาพของผลิตภัณฑ และไมตองเสี่ยงที่อาวุธที่สงมาจะถูกขโมยไปกอนถึงมือ"
 SMB_mechanized_troops_default: "ทําใหกองทหารเปนยานเกราะลําเลียงพล"
 SMB_mechanized_troops_default_desc: "เพื่อผลักดันกองทัพของเราและกาวรับอนาคตของการสงครามอยางแทจริง เราจะทุมเทความพยายามอยางกวางขวางในการปรับกองทหารประจําการใหเปนยานเกราะลําเลียงพล เพื่อที่พวกเขาจะไดสรางความหายนะในสนามรบรวมกับกรมทหารรถถังจากหลังเกราะที่ปลอดภัย"
 SMB_army_academy_default: "ขยายโรงเรียนนายรอยทหารบก"
 SMB_army_academy_default_desc: "อาวุธที่มีประสิทธิภาพไมใชปจจัยเดียวที่กําหนดผลของการรบ อีกปจจัยสําคัญคือทักษะ ไมเพียงแตของทหารแตละนาย แตรวมถึงนายพลผูบัญชาการกองทหารดวย เพื่อการนี้ เราควรลงทุนขยายการดําเนินงานของแผนกทหารบกในสถาบันการทหารของเรา"
 SMB_regular_infantry_default: "พลังของทหารธรรมดา"
 SMB_regular_infantry_default_desc: "แมยุทโธปกรณจะสําคัญไมแพสิ่งอื่นใด แตทหารแตละนายที่ปกปองมาตุภูมิ พิทักษคุณคาหลักของตน และตอสูเพื่อคนที่รัก คือพลังที่แทจริงของกองทัพใดๆ นั่นคือเหตุผลที่เราตองทําทุกวิถีทางเพื่อเพิ่มขวัญกําลังใจของทหารธรรมดา และมอบโอกาสที่ดีที่สุดใหเขาชนะในศึกที่ยากที่สุด"
 SMB_artillery_CHL: "นําการผลิตไนเตรตมาใชประโยชน"
 SMB_artillery_default: "เนนความเชี่ยวชาญอุตสาหกรรมปนใหญหนัก"
 SMB_artillery_default_desc: "เศรษฐกิจของเราไมแข็งแกรงเทามหาอํานาจอยางสหราชอาณาจักร ฝรั่งเศส และอิตาลี ดวยเหตุนี้ เราจึงตองเนนความเชี่ยวชาญเฉพาะดานในการผลิตปนใหญหนัก หากตองการยุทโธปกรณที่แข็งแกรงและดีกวา แมเราจะอยากมีเงินพอจายสําหรับยุทโธปกรณทุกอยางที่ตองการก็ตาม"
 SMB_foreign_designs_default: "จัดหาแบบจากตางประเทศ"
 SMB_foreign_designs_default_desc: "แมเราจะอยากมีนักวิทยาศาสตรและวิศวกรที่สรางยานเกราะของเราเองได แตจะดีที่สุดหากเราใชเสนสายที่มีอยูเพื่อตอรองขอตกลงดีๆ ในตลาดระหวางประเทศแทน เพราะนี่คือทางเลือกเดียวที่เปนจริงและเปนไปไดสําหรับการจัดหายุทโธปกรณเฉพาะทางในขณะนี้"
 SMB_foreign_advisors_default: "ที่ปรึกษาตางชาติ"
 SMB_foreign_advisors_default_desc: "แมครูฝกทหาร[ROOT.GetAdj]จะมีฝมือ แตก็ไมเกงเทาผูที่ผานความขัดแยงมาหลายครั้ง และไดรับการฝกจากสถาบันการทหารชั้นนําที่มีเกียรติสูงสุดในประเทศอื่น ดังนั้นเราควรพยายามดึงดูดที่ปรึกษาทางทหารตางชาติมาชวยฝกกองทัพของเราในความเชี่ยวชาญเฉพาะของประเทศพวกเขา เพื่อเสริมความแข็งแกรงใหกองทัพของเรายิ่งขึ้น"
 SMB_army_professionalism_CHL: "ปรับกองทัพตามแบบปรัสเซีย"
 SMB_army_professionalism_default: "ยกระดับความเปนมืออาชีพของกองทัพยิ่งขึ้น"
 SMB_army_professionalism_default_desc: "แมการมีทหารใหมากที่สุดเทาที่จะทําไดรอพรอมเขาประจําการอาจเปนแนวทางที่ดี แตตามความเห็นของที่ปรึกษาทางทหารตางชาติ สิ่งที่สําคัญกวามากคือการทําใหกองทัพอยูในสภาพพรอมรบสูงสุดไดทุกเมื่อ"
 SMB_conscription_default: "เพิ่มการเกณฑทหาร"
 SMB_conscription_default_desc: "แมความเปนมืออาชีพของทหารเราอาจถูกตั้งคําถามได แตไมตองสงสัยเลยวาสิ่งที่กองทัพตองการอยางยิ่งในตอนนี้คือทหารเพิ่มเพื่อเติมเต็มกําลัง เนื่องจากเรากําลังขาดแคลนผูที่เต็มใจเขารวมกองทัพ"
 SMB_conscription_CHL: "บทเรียนจากมหาสงคราม"
 SMB_experimental_weapons_department_default: "กรมอาวุธทดลอง"
 SMB_experimental_weapons_department_default_desc: "หากไมอยากตามหลังคูแขงดานเทคนิค เราควรเริ่มคิดคนทฤษฎีและพยายามพัฒนาสิ่งที่เรียกวาอาวุธมหัศจรรย เพื่อไมใหถูกเหนือกวาในสนามรบ"
 SMB_nuclear_program_default: "โครงการนิวเคลียรภายในประเทศ"
 SMB_nuclear_program_default_desc: "ชาวอเมริกันและชาวเยอรมันกําลังทุมเทคนหาความลับของอะตอม และเราไมอาจปลอยใหตัวเองตามหลังพวกเขาได แมพวกเขาจะมุงไปที่การสงคราม แตนักวิทยาศาสตรของเราก็บอกถึงวิธีใชการแตกตัวของอะตอมเพื่อพัฒนาชีวิตพลเรือนดวย"
 SMB_nuclear_program_key_BRA: "Programa Paralelo"
 SMB_special_forces_default: "โครงการกองกําลังพิเศษ"
 SMB_special_forces_default_desc: "แมกองทัพของเราจะเล็ก แตสามารถเสริมความแข็งแกรงไดอยางมหาศาลดวยทหารที่ผานการฝกพิเศษ ซึ่งเกงกาจในสถานการณและรูปแบบการรบบางประเภท ดังนั้นการตั้งโครงการฝกและบมเพาะทหารเหลานี้ควรเปนสิ่งสําคัญอันดับหนึ่งของเรา"
 SMB_special_forces_option_1_default: "เสริมกําลังกรมทหารภูเขา"
 SMB_special_forces_option_1_default_desc: "ทหารภูเขาของกองทัพควรไดรับความสนใจเปนพิเศษจากกองบัญชาการระดับสูง เพราะพวกเขาทําสิ่งที่ทหารทั่วไปไดแตฝนถึง พวกเขาสามารถรบในเทือกเขาแอนดีสอันอันตราย และสนับสนุนทหารทั่วไปของเราเมื่อรุกคืบไปขางหนา"
 SMB_special_forces_option_2_default: "กองกําลังนาวิกโยธินอันแข็งแกรง"
 SMB_special_forces_option_2_default_desc: "เนื่องจากกองทัพเรือเปนจุดแข็งขอหนึ่งของเราในปจจุบัน การใชประโยชนจากขอนี้และใหพวกเขามีเหลาทัพของตนเอง ประกอบดวยนาวิกโยธินที่ผานการฝกอยางทรหดและมีประสิทธิภาพสูงยิ่ง จะเปนประโยชนอยางยิ่ง"
 SMB_special_forces_option_2_CHL_desc: "[ROOT.GetNameDefCap]มีประเพณีอันยาวนานดานทหารราบนาวี แตนับตั้งแตสิ้นสุดสงครามแปซิฟก พวกเขาถูกลดบทบาทลงเหลือเพียงหนวยปนใหญชายฝง การปรับเปลี่ยนหนวยเหลานี้ใหเปนกองนาวิกโยธินที่พรอมสําหรับสงครามนอกประเทศ จะทําให[ROOT.GetNameDef]สามารถแผแสนยานุภาพไปโพนทะเลไดอีกครั้ง ดังที่เคยทําไดอยางประสบความสําเร็จในศตวรรษที่ 19"
 SMB_special_forces_option_3_default: "ขยายเหลาทัพอากาศ"
 SMB_special_forces_option_3_default_desc: "เนื่องจากกองทัพอากาศเปนจุดแข็งขอหนึ่งของเราในปจจุบัน การใชประโยชนจากขอนี้และใหพวกเขามีเหลาทัพของตนเอง ประกอบดวยพลรมที่ผานการฝกพิเศษและมีประสิทธิภาพสูงยิ่ง จะเปนประโยชนอยางยิ่ง"
 SMB_special_forces_option_1_continuation_default: "โครงการฝกหนวยจูโจม"
 SMB_special_forces_option_1_continuation_default_desc: "เพื่อสนับสนุนทหารภูเขาของเรา เราควรใชหนวยจูโจม ทหารที่ผานการฝกพิเศษดานการโจมตีและการลาดตระเวน ไมเพียงในบริเวณภูเขา แตรวมถึงในปาและปาดงดิบของอเมริกาใตดวย"
 SMB_special_forces_option_2_continuation_default: "สนับสนุนนาวิกโยธิน"
 SMB_special_forces_option_2_continuation_default_desc: "เพื่อใหนาวิกโยธินของเราปฏิบัติการไดเต็มขีดความสามารถและประสิทธิภาพ เราควรพิจารณาพัฒนาเทคโนโลยีที่สนับสนุนพวกเขา เชน ยานยกพลขึ้นบก และเทคนิคการกระจายเสบียงที่ดีขึ้นเมื่อยกพลขึ้นฝง"
 SMB_special_forces_option_3_continuation_default: "สนับสนุนการสงทางอากาศ"
 SMB_special_forces_option_3_continuation_default_desc: "เพื่อใหพลรมของเรามีโอกาสสําเร็จสูงสุดเมื่อกระโดดรม เราควรพิจารณาพัฒนาเทคโนโลยีที่ชวยเพิ่มโอกาสรอดชีวิตของพวกเขา ไมวาจะเปนเกราะที่ทิ้งลงได หรือลังเสบียงพรางตา"
 SMB_air_defense_default: "การปองกันภัยทางอากาศ"
 SMB_air_defense_default_desc: "บัดนี้คูแขงของเราไดเผยธาตุแทและเริ่มพัฒนาอาวุธทางอากาศของตนเองแลว เราตองเตรียมการตอบโต ดวยเหตุนี้ เราควรเริ่มสั่งการกอสรางและติดตั้งฐานและปนตอสูอากาศยานอยางรวดเร็ว" 
 SMB_air_force_default: "ติดอาวุธให Fuerzas Aéreas"
 SMB_air_force_default_desc: "นักทฤษฎีหลายคนใหเหตุผลวาดานที่เราตามหลังมากที่สุดในขณะนี้คือการพัฒนากองทัพอากาศสมัยใหม ดังนั้นเราตองทํางานหนักเพื่อแกไขเรื่องนี้ ดวยการสรางโรงเก็บเครื่องบินและสิ่งอํานวยการใหม รวมถึงฝกนักบินเพิ่มเติม"
 SMB_air_academy_default: "กอตั้งโรงเรียนนายเรืออากาศอยางเปนทางการ"
 SMB_air_academy_default_desc: "ไมใชเพียงทหารที่จะสูในกองกําลังภาคพื้นดินเทานั้นที่ตองไดรับการฝกอยางเหมาะสม นักบินของเราแมจะกระตือรือรน แตก็ขาดการฝกอยางมืออาชีพที่จําเปนตอการเปนเลิศในการรบทางอากาศ เพื่อแกปญหานี้ เราควรขยายสถาบันการทหารใหมีหลักสูตรสําหรับกองทัพอากาศมากขึ้น"
 SMB_construct_air_bases_default: "สรางฐานทัพอากาศใหม"
 SMB_construct_air_bases_default_desc: "นอกจากตองมีนักบินมืออาชีพที่มีการศึกษาดีและมีแรงจูงใจแลว เรายังขาดองคประกอบสําคัญอีกอยางที่กองทัพอากาศขนาดใหญตองมี นั่นคือสนามบิน แมเราจะมีอยูบาง แตก็ไมเพียงพอหากตองการขยายกองทัพอากาศใหถึงระดับที่แขงขันได"
 SMB_domestic_designs_default: "แบบที่ออกแบบเองภายในประเทศ"
 SMB_domestic_designs_default_desc: "จะดีที่สุดหากเราสรางและผลิตเครื่องบินรุนและแบบของเราเอง เพราะไมอาจไวใจประเทศอื่นใหออกแบบหรือผลิตเครื่องบินที่เหมาะกับนักบินของเราได"
 SMB_license_designs_default: "ซื้อสิทธิ์แบบจากตางประเทศ"
 SMB_license_designs_default_desc: "การวิจัยและพัฒนาแบบเครื่องบินของเราเองใชเวลาและแรงงานมากเกินไป เราจึงควรซื้อสิทธิ์ยุทโธปกรณจากตางประเทศแทน และมุงเนนแคการผลิตที่นี่ใน[ROOT.GetNameDef]"
 SMB_purchase_aircraft_default: "ซื้ออากาศยานจากตางประเทศ"
 SMB_purchase_aircraft_default_desc: "กองทัพอากาศของเราตัดสินแลววาการพัฒนาและผลิตเครื่องบินเองนั้นสิ้นเปลืองและใชเวลามากเกินไป พวกเขาจึงสนับสนุนการซื้อยุทโธปกรณจากตางประเทศแทน ซึ่งเปนจุดยืนที่เราควรยึดถือเชนกัน"
 SMB_establish_aircraft_industry_default: "อุตสาหกรรมอากาศยานภายในประเทศ"
 SMB_establish_aircraft_industry_BRA: "Empresa Brasileira de Aeronáutica"
 SMB_establish_aircraft_industry_default_desc: "เห็นไดชัดวาหากตองการรักษาประสิทธิภาพการผลิตใหสูงที่สุดเทาที่จะทําได เราตองสรางอุตสาหกรรมอากาศยานขนาดใหญภายในพรมแดนของเราเอง"
 SMB_flying_fortress_default: "ปอมบินได"
 SMB_flying_fortress_default_desc: "วิธีเดียวที่จะใชกองทัพอากาศอยางเหมาะสมคือทิ้งระเบิดใสศัตรูจนยอมจํานน จนไมเหลืออะไรยืนอยูตรงหนาเสนขอบฟา เราจึงควรสรางเครื่องบินขนาดใหญที่บรรทุกวัตถุระเบิดไดมากที่สุดเทาที่เราจะตองการ"
 SMB_tactical_air_force_default: "กองทัพอากาศทางยุทธวิธี"
 SMB_tactical_air_force_default_desc: "กองทัพอากาศไมควรใชเพียงสนับสนุนกองกําลังภาคพื้นดิน แตตองทําภารกิจที่ซับซอนกวานั้นไดหลากหลาย ซึ่งกองกําลังภาคพื้นดินลําพังทําไมได นั่นคือแกนแทที่ทําใหกองทัพอากาศยิ่งใหญ"
 SMB_nimble_air_force_default: "กองทัพอากาศที่คลองแคลว"
 SMB_nimble_air_force_default_desc: "เครื่องบินควรหลบหลีกไดเหนือกวาไมเพียงเครื่องบินขาศึก แตรวมถึงสายตาที่จับจองของปนตอสูอากาศยานและเรือรบดวย กองทัพอากาศควรประกอบดวยเครื่องบินขนาดเล็กที่เหมาะกับการรบทางอากาศและการโจมตีอยางมีประสิทธิภาพ โดยไมหนักจนเคลื่อนที่อยางรวดเร็วและเด็ดขาดไมได"
 SMB_strategic_bombing_default: "มุงเนนการทิ้งระเบิดทางยุทธศาสตร"
 SMB_strategic_bombing_default_desc: "การชนะสงครามไมใชแคการเอาชนะศัตรูในการรบ แตยังตองทําใหเศรษฐกิจและขีดความสามารถทางอุตสาหกรรมของพวกเขาพิการ นั่นคือเหตุผลที่การทิ้งระเบิดทางยุทธศาสตรควรเปนเปาหมายอันดับหนึ่งของเราในยามสงคราม"
 SMB_army_support_default: "สนับสนุนกองทัพบก"
 SMB_army_support_default_desc: "กองทัพบกไมอาจชนะไดหากถูกโจมตีจากฟากฟาอยูตลอด ดวยเหตุนี้ นอกจากใชกองทัพอากาศปกปองพวกเขาจากการโจมตีเชนนั้นแลว เครื่องบินของเราควรมุงเนนการทําแบบเดียวกันกับฝายตรงขามดวย"
 SMB_winning_the_air_war_default: "ชนะสงครามทางอากาศ"
 SMB_winning_the_air_war_default_desc: "แมการสนับสนุนภาคพื้นดินและการทิ้งระเบิดทางทะเลจะถือวาสําคัญ แตจําเปนอยางยิ่งที่ตองตระหนักวาหากไมไดครองนานฟา การกระทําเหลานี้ลวนไรคา ดังนั้นกองทัพอากาศของเราควรมุงเนนการครองนานฟาใหไดมากที่สุด"
 SMB_naval_support_default: "มุงเนนการสนับสนุนทางทะเล"
 SMB_naval_support_default_desc: "เปาหมายอันดับหนึ่งของเครื่องบินเราคือชวยเปดทางและปกปองกองทัพเรือและขบวนเรือพลเรือนของเรา จึงสําคัญที่ตองออกแบบเครื่องบินโดยคํานึงถึงบทบาทการสนับสนุนและลาดตระเวนทางทะเล และทําใหแนใจวาจะรอดพนจากการถูกยิงตกโดยปนตอสูอากาศยานบนเรือ"
 SMB_air_modifier_boost_1_default: "ความเชี่ยวชาญดานการสนับสนุนภาคพื้นดิน"
 SMB_air_modifier_boost_1_default_desc: "เปนเรื่องสําคัญยิ่งที่ทหารราบตองไปถึงจุดหมายไดเสมอ และดวยเหตุนี้จึงสําคัญที่ตองมุงเนนใหกองทัพอากาศชวยพวกเขา ไมวาจะดวยการสนับสนุนทางอากาศโดยตรง หรือการทิ้งระเบิดหลังแนวขาศึก"
 SMB_air_modifier_boost_2_default: "พัฒนาโครงสรางอากาศยานขั้นสูง"
 SMB_air_modifier_boost_2_default_desc: "หากตองการใหเครื่องบินของเรารอดจากการปะทะกับขาศึก สิ่งสําคัญคือไมเพียงตองหลบการยิงใหไดมากที่สุด แตตองทนการถูกยิงไดสักนัดสองนัด และบินไปไดไกลพอจะกลับมาซอมแซม เราจึงควรพัฒนาโครงสรางและเครื่องยนตที่ดีขึ้นใหเครื่องบินของเรา เพื่อใหนักบินปลอดภัยไมวาจะเกิดอะไรขึ้น"
 SMB_air_doctrine_default: "ความกาวหนาดานหลักนิยม"
 SMB_air_doctrine_default_desc: "สิ่งสําคัญที่ตองตระหนักคือหากไมมียุทธศาสตรที่เหมาะสม แมแตนักบินและเครื่องบินที่ยอดเยี่ยมที่สุดก็ไมอาจเฟองฟูในการรบได สงครามคือเรื่องของการวางแผน ยุทธศาสตร และการใชจุดแข็งเฉพาะตัวของชาติใหเต็มที่ เราจึงควรทุมเทความพยายามอยางมากในการพัฒนาหลักนิยมใหมใหกองทัพอากาศยึดถือ"
 SMB_aircraft_carriers_default: "เรือบรรทุกเครื่องบิน"
 SMB_joint_operative_command_default: "กองบัญชาการปฏิบัติการรวม"
 SMB_joint_operative_command_default_desc: "บัดนี้เมื่อเราไมเพียงพัฒนากองทัพบก แตยังวางรากฐานที่ดีใหกองทัพอากาศแลว ก็ถึงเวลาสรางการประสานงานและความรวมมือระหวางเหลาทัพตางๆ ดวยเหตุนี้ เราจะกอตั้งกองบัญชาการปฏิบัติการรวม ประกอบดวยผูบัญชาการที่คัดเลือกจากทั้งสองฝาย"
 SMB_war_planning_office_default: "สํานักงานวางแผนสงคราม"
 SMB_war_planning_office_default_desc: "ตอนนี้เรายังตองทําใหแนใจวากองทัพจะไดรับแผนและคําสั่งที่เหมาะสมและคิดมาอยางรอบคอบ เพื่อไมใหตามหลังในสงครามขอมูลขาวสาร และไดรับรายละเอียดที่ลาสมัยจนถูกซุมโจมตีและทําลาย ดวยเหตุนี้ เราควรกอตั้งสํานักงานวางแผนสงครามเพื่อประสานความพยายามเหลานี้ใหดียิ่งขึ้น"
 SMB_women_in_aviation_default: "สตรีในการบิน"
 SMB_women_in_aviation_default_desc: "แมจะไมไดรับการปฏิบัติเชนนั้นเสมอไป แตสตรีมีบทบาทสําคัญในสังคมมาโดยตลอด และบัดนี้ถึงเวลาที่พวกเธอจะกาวขึ้นมาทําสิ่งที่เคยถูกมองวาเปนงานของผูชายเทานั้น เชน การผลิตและการขับเครื่องบินของประเทศเรา"
