 news.169.t: "ชะตากรรมของยูโกสลาเวีย"
 news.169.d_annex_YUG: "การสูญเสียดินแดนเมื่อเร็ว ๆ นี้ไดกอใหเกิดรอยราวภายในรัฐยูโกสลาเวีย นําไปสูความขัดแยงทางชาติพันธุและอํานาจสวนกลางที่ออนแอลง เยอรมนีไดกาวเขามาเติมสุญญากาศที่ขยายตัวนี้ และเลือกที่จะประกาศ 'อารักขา' เหนือสวนที่เหลือของยูโกสลาเวีย"
 news.169.d_puppet_CRO_annex_YUG: "การสูญเสียดินแดนเมื่อเร็ว ๆ นี้ไดกอใหเกิดรอยราวภายในรัฐยูโกสลาเวีย นําไปสูความขัดแยงทางชาติพันธุและอํานาจสวนกลางที่ออนแอลง เยอรมนีไดจัดตั้งรัฐโครเอเชียที่ 'เปนเอกราช' และผนวกสวนที่เหลือ"
 news.169.d_puppet_CRO_YUG: "การสูญเสียดินแดนเมื่อเร็ว ๆ นี้ไดกอใหเกิดรอยราวภายในรัฐยูโกสลาเวีย นําไปสูความขัดแยงทางชาติพันธุและอํานาจสวนกลางที่ออนแอลง เยอรมนีเลือกที่จะแบงสวนที่เหลือออกเปนรัฐเซิรบและรัฐโครแอตภายใตการกํากับของตน"
