 news.172.d: "หลังการสนทนาอันยาวนานและดุเดือดกับเอกอัครราชทูตเยอรมนี [GRE.GetLeader] ไดประกาศวารัฐบาล[GRE.GetAdjective]จะประสานนโยบายอยางใกลชิดกับ [GER.GetNameDef] นับจากนี้ \n\nตํารวจในเมืองหลวงของ[GRE.GetAdjective]ตองใชกําลังสลายการประทวงที่เกิดขึ้นเองหลายครั้งเพื่อตอตานการตัดสินใจนี้ โดยผูประทวงจํานวนมากเรียกรองเอาหัวของ "ไอขี้ขลาด [GRE.GetLeader]""
