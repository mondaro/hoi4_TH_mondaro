 news.170.d_BUL: "เยอรมนีอางวากําลังพยายามรักษาสันติภาพในคาบสมุทรบอลขาน จึงยื่นขอเรียกรองตอรัฐบาลกรีซใหยกดินแดนแกบัลแกเรีย แม [GRE.GetName] จะประทวงอยางหนัก แตอิทธิพลอันแข็งแกรงของเยอรมนีในบอลขานทําใหแทบไมมีทางเลือก หนทางเดียวที่จะหลีกเลี่ยงการเผชิญหนากับ [GER.GetName] คือการยอมใหการทูตของเยอรมนีเปนผูกําหนดบูรณภาพแหงดินแดนของตน"
 news.170.d_ITA: "เยอรมนีอางวากําลังพยายามรักษาสันติภาพในคาบสมุทรบอลขาน จึงยื่นขอเรียกรองตอรัฐบาลกรีซใหยกดินแดนทั้งหมดที่ [ITA.GetName] อางสิทธิ์ แม [GRE.GetName] จะประทวงอยางหนัก แตอิทธิพลอันแข็งแกรงของเยอรมนีในบอลขานทําใหแทบไมมีทางเลือก หนทางเดียวที่จะหลีกเลี่ยงการเผชิญหนากับทั้ง [GER.GetName] และ [ITA.GetName] คือการยอมใหการทูตของเยอรมนีเปนผูกําหนดบูรณภาพแหงดินแดนของตน"
 news.170.d_ITA_BUL: "เยอรมนีอางวากําลังพยายามรักษาสันติภาพในคาบสมุทรบอลขาน จึงยื่นขอเรียกรองตอรัฐบาลกรีซใหยกดินแดนทั้งหมดที่ [BUL.GetName] และ [ITA.GetName] อางสิทธิ์ ดวยอิทธิพลอันแข็งแกรงของ[GER.GetAdjective]ในบอลขาน ประกอบกับทาทีขมขูของทั้งบัลแกเรียและอิตาลี [GRE.GetLeader] จึงไมเห็นทางเลือกอื่นนอกจากยอมรับ"
 news.170.d_GER: "เมื่อสถาปนาตนเปนกําลังสําคัญในคาบสมุทรบอลขานแลว [GER.GetName] อางวาบัดนี้ตนมีแรงจูงใจเพื่อรักษาสันติภาพในภูมิภาคที่ปนปวนแหงนี้ ดวยเหตุนี้ จึงไดเรียกรองใหยกดินแดนกรีซมาอยูใตอํานาจของตนดวย\n\nเมื่อตองเผชิญหนากับเครื่องจักรสงครามเยอรมัน [GRE.GetName] จึงไมมีทางเลือกนอกจากยอมรับขอเรียกรอง แมจะสาปแชงวาขอเรียกรองเหลานี้เปนเพียงเรื่องหลอกลวง"
