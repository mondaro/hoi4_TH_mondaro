 news.172.f: "ชางเปนโศกนาฏกรรมกรีกเสียจริง"
 news.173.t: "องคการสากลที่สี่"
 news.173.d_1: "วันนี้ผูแทนคอมมิวนิสตจํานวนหนึ่งจากทั่วโลกไดพบกันที่ปารีสเพื่อการประชุมกอตั้ง โดยมีผูสนับสนุนทฤษฎีของทรอตสกีเปนแกนนํา และไดวางรากฐานขององคการสากลที่สี่\n\nแมยังไมชัดเจนวาความพยายามรวมตัวกันครั้งนี้จะสงผลตอเวทีการเมืองระหวางประเทศอยางไร แตขาวนี้ดูเหมือนจะปลุกความระแวงของสตาลินขึ้นมา เขาสงสัยมาตลอดวาสมาชิกระดับสูงหลายคนของพรรคและกองทัพแอบสนับสนุนทรอตสกี และหลายคนในนั้นยังมีชีวิตอยู เมื่ออาการหวาดระแวงกลับมาเต็มกําลัง เขาก็ยิ่งเก็บตัวมากขึ้นเรื่อย ๆ ความไมไววางใจและความไมมั่นคงของเขาไดกอใหเกิดวิกฤตในรัฐบาลโซเวียต หากเปนเชนนี้ตอไป ประเทศจะดิ่งลงสูสงครามกลางเมือง"
 news.173.d_2: "วันนี้ผูแทนคอมมิวนิสตจํานวนหนึ่งจากทั่วโลกไดพบกันที่ปารีสเพื่อการประชุมกอตั้ง และไดวางรากฐานของสิ่งที่รูจักกันในชื่อองคการสากลที่สี่ เสียงเรียกรองใหกอตั้งมีมานานหลายปแลว โดยมีผูสนับสนุนทฤษฎีของทรอตสกีเปนแกนนํา\n\nสตาลินตอบโตกระแสสนับสนุนลัทธิทรอตสกีที่เพิ่มขึ้นในตางแดนดวยการสั่งลอบสังหารเพิ่มเติม และเพิ่มการโฆษณาชวนเชื่อโจมตีคูปรับเกา ดวยการกวาดลางผูตองสงสัยวาเปนพวกทรอตสกีในระดับสูงของกองทัพและผูนําโซเวียตที่ยังคงอยูในความทรงจํา คําสั่งนี้จึงไมนาจะเผชิญการตอตานใด ๆ"
 news.173.a: "จะมีองคการสากลกี่แหงกันแน?"
 news.173.b: "ยุคแหงความรุนแรงของสหภาพเรา"
 news.174.t: "[From.GetName] มุงพัฒนาเทคโนโลยีนิวเคลียร"
 news.174.d: "หลังการทดลองเบื้องตน นักการเมืองของ [From.GetName] ไดตัดสินใจมุงการวิจัยของ[From.GetAdjective]ไปที่การพัฒนาเทคโนโลยีนิวเคลียร \n\nเทคโนโลยีนี้ยังอยูในขั้นทดลองอยางยิ่ง และยังไมแนชัดเลยวาจะนําไปใชงานจริงไดหรือไม ใครจะรูวาสิ่งนี้อาจพาการทําสงครามของพวกเขาไปสูจุดใด"
 news.174.a: "เราควรติดตามพัฒนาการนี้"
 news.174.b: "หวังวาการวิจัยของพวกเขาจะเกิดผล"
 news.174.c: "มันไมมีวันไดผลอะไรหรอก"
 news.174.e: "เราจะทําการวิจัยของเราอยางลับ ๆ"
 news.175.t: "ฝรั่งเศสและอังกฤษประกาศเปนพันธมิตร"
 news.175.d: "ฝรั่งเศสไดรองขอเปนพันธมิตรอยางเปนทางการกับอังกฤษ โดยอาศัยสายสัมพันธที่หลอมรวมกันระหวางมหาสงคราม และอางถึงภัยคุกคามที่ไมไดระบุตอเสถียรภาพของยุโรป\n\nวันนี้รัฐสภาอังกฤษไดอนุมัติคําขอดังกลาว และฝรั่งเศสไดเขารวม [ENG.GetFactionName] แลว"
 news.175.a: "เรายืนหยัดเคียงขางกัน"
 news.175.b: "พวกเขากําลังเตรียมรับมือกับสถานการณเลวรายที่สุด"
 news.175.c: "รวมกลุมกันเหมือนหนูจนตรอก"
 news.175.e: "อังกฤษไดเลือกขางแลว"
 news.176.t: "อังกฤษปฏิเสธการเปนพันธมิตรกับฝรั่งเศส"
 news.176.d: "ในเหตุการณพลิกผันอยางนาประหลาดใจ วันนี้รัฐสภาอังกฤษไดปฏิเสธคําขอของ [FRA.GetName] ที่จะเปนพันธมิตรอยางเปนทางการระหวางสองชาติ โดยใหเหตุผลวาเพื่อหลีกเลี่ยงการกระทบดุลอํานาจที่เปราะบางอยูแลวในภาคพื้นทวีปยุโรป\n\nรัฐบาลฝรั่งเศสประณามวานี่เปนการเดินเกมทางการเมือง ที่สละความมั่นคงของฝรั่งเศสเพื่อผลประโยชนของอังกฤษ"
 news.176.a: "พวกเขานาจะขอใหสุภาพกวานี้"
 news.176.b: "ศัตรูเกาของเราแตกแยกกันแลว"
 news.176.c: "วันมืดมนของพันธมิตรเกา"
 news.177.t: "ความตกลงไตรภาคีนอย"
 news.177.d: "เพื่อสรางแนวรวมตอตานศัตรูรวมกัน [From.GetName] ไดยื่นขอเสนอตอเชโกสโลวาเกียใหกอตั้ง "ความตกลงไตรภาคีนอย" เพื่อรวมพลังตอตานศัตรูรวม ซึ่งเทากับละทิ้งสายสัมพันธกับอังกฤษนับแตมหาสงคราม แมจะไดรับขอเสนอใหเขารวมกติกาสัญญาเชิงปองกันนี้ แตนายกรัฐมนตรีอังกฤษไดแสดงจุดยืนชัดเจนวาอังกฤษไมถือวาพันธมิตรนี้ 'เปนประโยชนตอการปกปองเสรีภาพของยุโรป' \n\nถึงกระนั้น ฝรั่งเศสก็ไดสรางสัมพันธทางการทูตกับชาติอื่น ๆ ที่อาจรูสึกถูกคุกคาม และกําลังสงเสริมความเปนเอกภาพเพื่อรักษาดุลอํานาจทางการทูตในยุโรปและปองกันความขัดแยงในอนาคต กาลเวลาเทานั้นที่จะบอกไดวาพวกเขาจะประสบความสําเร็จหรือไม"
 news.177.a: "ถาอยางนั้นวันหลังก็อยามารองไหขอความชวยเหลือจากเราแลวกัน!"
 news.177.b: "ฝรั่งเศสและความตกลงจงเจริญ!"
 news.177.c: "เราตองไมยอมใหฝรั่งเศสครองความเปนใหญในยุโรปอีกเด็ดขาด"
 news.177.e: "ยุโรปตองผนึกกําลังตอตานผูรุกรานฟาสซิสต!"
 news.177.f: "สัญญาณของความตึงเครียดที่เพิ่มขึ้นในยุโรป"
 news.178.t: "ฝายซายผงาดในฝรั่งเศส"
 news.178.d: "หลังความวุนวายทางการเมืองเกือบสองทศวรรษ ประชาชนของ [From.GetName] รูสึกวายังไมไดสิ่งที่สูญเสียไปในมหาสงครามกลับคืนมา ชาว[From.GetAdjective]ไดตั้งเปาที่จะฟนฟูรัฐ[From.GetAdjective]ขึ้นใหม โดยประชาชนของเธอ และเพื่อประชาชนของเธอ\n\nการปฏิรูปทางการเมืองครั้งใหมนี้เปดทางใหสหภาพแรงงานและองคกรคอมมิวนิสตเฟองฟู หากฝรั่งเศสยังเดินบนเสนทางนี้ตอไป ก็จะเกิดการปรับเปลี่ยนขั้วทางการเมืองไปสูฝายซายจัด หรือแมแตการปฏิวัติเต็มรูปแบบ"
 news.178.a: "ฝรั่งเศสกําลังเดินตามเราไปสูอนาคต!"
 news.178.b: "สัญญาณชัดเจนถึงความออนแอของฝรั่งเศส"
 news.178.c: "พัฒนาการอันนาเศราสําหรับสาธารณรัฐที่สาม"
 news.178.e: "พัฒนาการที่นาเปนหวง"
 news.179.t: "ฝายขวาผงาดในฝรั่งเศส"
 news.179.d: "หลังความวุนวายทางการเมืองเกือบสองทศวรรษ ประชาชนของ [From.GetName] รูสึกวายังไมไดสิ่งที่สูญเสียไปในมหาสงครามกลับคืนมา ชนชั้นนํา[From.GetAdjective]ไดตั้งเปาที่จะฟนฟูรัฐ[From.GetAdjective]ขึ้นใหม และสถาปนาความยิ่งใหญของ[From.GetAdjective]ขึ้นอีกครั้ง\n\nการปฏิรูปทางการเมืองเหลานี้กําลังเสริมอํานาจของรัฐและกองทัพ โดยประชาชน[From.GetAdjective]เชื่อมั่นในคําสัญญาถึงความยิ่งใหญของ [From.GetLeader]"
 news.179.a: "รัฐบาลฝรั่งเศสเปนศัตรูของประชาชนตนเอง!"
 news.179.b: "นี่อาจทําใหฝรั่งเศสกลับมาเปนชาติที่ยิ่งใหญอีกครั้ง"
 news.179.c: "พัฒนาการอันนาเศราสําหรับสาธารณรัฐที่สาม"
 news.179.e: "พัฒนาการที่นาเปนหวง"
 news.180.t: "ฝรั่งเศสไดรับการตอนรับเขาสูโคมินเทิรน"
 news.180.d: "หลังการเปลี่ยนแปลงไปสูแนวทางคอมมิวนิสต ไมเพียงในหมูประชาชนฝรั่งเศส แตรวมถึงในแวดวงผูมีอํานาจของฝรั่งเศสดวย [France.GetName] ไดประกาศตอสาธารณะถึงความปรารถนาที่จะเขารวม [From.GetFactionName]\n\n[From.GetName] ตอบรับทันที ซึ่งบงบอกวาคงมีการเจรจากันนอกสายตาสาธารณชนมาหลายสัปดาหแลว [From.GetLeader] กลาวอยางยืดยาววาประชาชนทั่วโลกตองรวมมือกันเพื่อนําการปฏิวัติมาสูทุกประเทศ \n\n[France.GetLeader] เห็นดวย และขมขูอยางชัดแจงตอผูที่ "มีเหตุใหตองหวาดกลัว [From.GetFactionName]""
 news.180.a: "ผนึกกําลังสูการปฏิวัติโลก!"
 news.180.b: "พันธมิตรของพวกเขาจะพังทลายในไมชา"
 news.180.c: "ตองไมปลอยใหศัตรูของประชาธิปไตยแข็งแกรงขึ้น"
 news.180.e: "ฝรั่งเศสไดเลือกขางแลว"
 news.181.t: "[France.GetName] และ [From.GetName] ผนึกกําลัง"
 news.181.d: "หลังการเมืองที่เปนเผด็จการมากขึ้นเรื่อย ๆ [France.GetName] ไดประกาศวาถึงเวลาที่ตองหาพันธมิตรเพื่อตอตานภัยคุกคามจากคอมมิวนิสตโลก และบัดนี้ดูเหมือนวา [From.GetName] คือพันธมิตรนั้น\n\nเชาวันนี้ [From.GetLeader] ประกาศวา [France.GetName] และ [From.GetName] จะยืนเคียงขางกันฉันพี่นอง "มรดกรวมของเราจะไมทําใหเราเปนศัตรูกันอีกตอไป แตเปนพันธมิตร! เหลายักษใหญแหงยุโรปยืนหยัดเคียงขางกัน""
 news.181.a: "เมื่อรวมมือกัน เรายอมแข็งแกรง!"
 news.181.b: "ศัตรูของประชาธิปไตยแข็งแกรงขึ้นเรื่อย ๆ"
 news.181.c: "มิตรภาพที่ไมคาดฝน"
 news.182.t: "[France.GetName] เขารวม [From.GetFactionName]!"
 news.182.d: "การเมืองยุโรปพลิกกลับตาลปตรในวันนี้ เมื่อนักการทูตฝรั่งเศสและเยอรมนีประกาศสนธิสัญญาทางทหารระหวาง [France.GetName] และ [From.GetName] โดยระบุวาเลือดไดหลั่งรินบนพรมแดนของทั้งสองมามากเกินพอแลว ในขณะที่ยังมีกองกําลังอื่น ๆ ที่หมายจะทําลายลางพวกเขาอยู\n\n[From.GetName] เชิญชวนใหทุกคนพิจารณาวาการที่ศัตรูเกาหันมาผนึกกําลังจนแข็งแกรงยิ่งขึ้น แทนที่จะบั่นทอนกันเอง นั้นมีความหมายเชนไร"
 news.182.a: "ไมมีสิ่งใดคุกคาม [From.GetFactionName] ได!"
 news.182.b: "[From.GetName] ใหมทอดเงาทะมึนปกคลุมยุโรป"
 news.182.c: "การทูตยุโรปจัดแนวใหมตามอักษะปารีส-เบอรลิน"
 news.182.e: "แยแลวไง"
 news.183.t: "[From.GetName] ปฏิเสธการเปนพันธมิตรกับฝรั่งเศส!"
 news.183.d: "[From.GetLeader] ปดตกขอเสนอทางการทูตของ[France.GetAdjective] และประกาศตอสาธารณะวา [From.GetName] จะไมทําสนธิสัญญาทางทหารกับ [France.GetName]\n\nนักการทูต[From.GetAdjective]เรียกรัฐ[France.GetAdjective]วาออนแอและฉอฉล และกลาววาชาว[From.GetAdjective]ที่แทจริงจะไมยอมให "โรครายแบบ[France.GetAdjective]" แพรกระจาย"
 news.183.a: "บังอาจนัก!"
 news.183.b: "เราอยูกับการที่พวกเขาเปนศัตรูได"
 news.183.c: "ตราบใดที่พวกเขายังมัวสูกันเอง..."
 news.184.t: "อิตาลีแสวงหาความสัมพันธใกลชิดกับเยอรมนี"
 news.184.d: "อิตาลีและเยอรมนีมีผลประโยชนที่ขัดแยงกันหลายประการ โดยเฉพาะในออสเตรียและคาบสมุทรบอลขาน แตก็ไมไดขัดขวางใหนโยบายตางประเทศของทั้งสองประเทศเปนมิตรตอกันมากขึ้นเรื่อย ๆ และขณะนี้กําลังมีการเจรจาสนธิสัญญาที่จะ "ปกปองผลประโยชนรวมกัน"\n\nหากการเจรจาประสบผล เราอาจไดเห็นพันธมิตรที่สามารถแผอิทธิพลอยางมหาศาลในยุโรปกลางและยุโรปตะวันออก"
 news.184.a: "ชาติของเรามีผลประโยชนรวมกันมากมาย"
 news.184.b: "เราจะจับตาสถานการณตอไป"
 news.185.t: "[From.GetName] แสวงหาสนธิสัญญาทางทหารที่ครอบคลุม"
 news.185.d: "ดวยเปาหมายที่จะนิยามดุลอํานาจในทะเลเมดิเตอรเรเนียนใหม [From.GetName] ไดเริ่มเคลื่อนไหวทางการเมืองเพื่อกอตั้งพันธมิตรใหมในภูมิภาค\n\n[From.GetFactionName] ซึ่งมีลักษณะทางทหารเปนหลัก จะทําใหอิตาลีกลายเปนศูนยกลางของมหาอํานาจโลกใหม ตามคํากลาวของ [From.GetLeader]"
 news.185.a: "[From.GetName] นําทาง!"
 news.185.b: "หวังวาผลประโยชนของพวกเขาจะไมขัดกับของเรา"
 news.185.c: "เรื่องนี้นาเปนหวง"
 news.186.t: "อิตาลีอางสิทธิ์เหนือดินแดนกรีซ"
 news.186.d: "[From.GetName] อางจักรวรรดิโรมันวาเปนตนกําเนิดของรัฐ[From.GetAdjective]สมัยใหม และประกาศวารัฐกรีกที่เปนเอกราชไมมีสิทธิ์ดํารงอยู ทวา "ดินแดนกรีก" จะตองยอมรับความเปนใหญของอิตาลีในทะเลอีเจียน มิฉะนั้นจะถูกยึดดวยกําลัง\n\n[Greece.GetName] ประณามการอางสิทธิ์นี้วาไรสาระ อยางไรก็ตาม [From.GetName] มี [From.GetFactionName] หนุนหลังอยู"
 news.186.a: "อิตาลีควรเปนผูควบคุมทะเลอีเจียน"
 news.186.b: "การอางสิทธิ์ที่อุกอาจ!"
 news.187.t: "อิตาลีแสวงหาการสนับสนุนจาก [GRE.GetName]"
 news.187.d: "[ITA.GetName] อางวา [GRE.GetName] เปนผูสืบทอดรัฐโบราณแหงแรก ๆ ของยุโรป และมีมิตรภาพโดยธรรมชาติระหวางสองรัฐ\nวาระทางการเมืองของพวกเขาชัดเจน เพราะ [ITA.GetName] ยังมองวา [GRE.GetName] เปนสมาชิกโดยธรรมชาติของ [ITA.GetFactionName] ดวย\n\nหลังจากแยกจากกันมาพันหารอยป ตะวันออกและตะวันตกจะกลับมารวมกันไดอีกครั้งหรือไม ยังตองรอดูกันตอไป"
 news.187.a: "[Greece.GetName] ยอมมีผลประโยชนรวมกับเราแนนอน"
 news.187.b: "เรื่องนี้ไมนาแปลกใจเลย"
 news.187.c: "เรามีประวัติศาสตรรวมกันมากมายจริง ๆ"
 news.188.t: "[ITA.GetName] แสวงหาการคืนดีกับ [TUR.GetName]"
 news.188.d: "แมจะผานความขัดแยงและการเดินเกมทางการทูตเพื่อชิงความเปนใหญในทะเลเมดิเตอรเรเนียนมานานหลายทศวรรษ [ITA.GetName] และ [TUR.GetName] ก็เริ่มวางความขัดแยงไวเบื้องหลัง\n\nในขอตกลงที่จะรวมมือกัน "เพื่อประโยชนของทั้งภูมิภาคเมดิเตอรเรเนียน" [ITA.GetName] และ [TUR.GetName] ใหคํามั่นที่จะกระชับความสัมพันธทางการทูตใหใกลชิดกวาที่เคยเปนมานับตั้งแตการสถาปนาทั้งสองชาติในยุคใหม"
 news.188.a: "อิทธิพลของ [ITA.GetName] เติบโตขึ้น"
 news.188.b: "ใครจะไปตกลง "รวมมือ" กับพวก[ITA.GetAdjective]ได?"
 news.188.c: "ความเปนหุนสวนในทะเลเมดิเตอรเรเนียนมีความสําคัญยิ่ง"
 news.189.t: "อิตาลีเรียกรองฐานทัพเรือในอานาโตเลีย"
 news.189.d: "สนธิสัญญาลอนดอนป 1915 ไดสัญญาวาจะมอบดินแดนตุรกีในอานาโตเลียใหแกอิตาลี แมสนธิสัญญาอื่น ๆ จะมีผลบังคับเหนือกวา แตผูนํา[From.GetAdjective]ก็ยังไมลืมคําสัญญานั้น\n\n[From.GetLeader] แถลงตอสาธารณะวา ดวยความสําคัญทางยุทธศาสตรของชายฝงอานาโตเลีย [From.GetName] ตั้งใจเต็มที่ที่จะเอาสิ่งที่ "เปนของอิตาลีโดยชอบธรรม" มา"
 news.189.a: "เรื่องนี้จบไปแลว!"
 news.189.b: "เราจะตองไดสิ่งที่เคยถูกสัญญาไว!"
 news.189.c: "การแขงขันระหวางตุรกีกับอิตาลีกําลังทวีความรุนแรง"
 news.190.t: "หมูเกาะแบลีแอริกถูกยกใหแก [Italy.GetName]"
 news.190.d: "หลังจากที่ตองพึ่งพากองกําลัง[Italy.GetAdjective]ในสงครามกลางเมืองสเปน [Italy.GetName] ไดขอหมูเกาะแบลีแอริกจาก [From.GetName] และ [From.GetLeader] ก็ยินยอม โดยชูวาการเดินหมากทางการทูตครั้งนี้เปนการกระชับสายสัมพันธระหวางสองชาติ\n\nสําหรับ [Italy.GetName] ฐานทัพเรือในหมูเกาะแบลีแอริกจะชวยใหแผอิทธิพลเหนือชองแคบยิบรอลตารไดมากขึ้น และเขาถึงมหาสมุทรแอตแลนติกไดดียิ่งขึ้น"
 news.190.a: "นี่คือกาวสําคัญสูการครองทะเลเมดิเตอรเรเนียนอยางสมบูรณ"
 news.190.b: "อิตาลีกําลังกระชับอํานาจเหนือทะเลเมดิเตอรเรเนียน"
 news.190.c: "สัญลักษณแหง "มิตรภาพอันแนบแนน" ระหวางชาติของเรา"
 news.192.t: "อิตาลีประกาศอางสิทธิ์เหนือดินแดนยูโกสลาเวีย"
 news.192.d: "ขณะกลาวตอประชากรชาวอิตาลีตามแนวชายฝงดัลเมเชีย [From.GetLeader] ประกาศวา [From.GetName] ถือวาดินแดนที่พูดภาษาอิตาลีใน [YUG.GetName] เปนสวนหนึ่งของ [From.GetName] โดยชอบธรรม \n\nแถลงการณอยางเปนทางการสนับสนุนการอางสิทธิ์นี้ และระบุชัดวา [From.GetName] พรอมจะยึดดินแดนดวยกําลังหากจําเปน"
 news.192.a: "นั่นคือดินแดนของยูโกสลาเวีย ไมใชของอิตาลี!"
 news.192.b: "พวกเขากําลังทําลายดุลอํานาจอันเปราะบางในภูมิภาค"
 news.192.c: "ดินแดนเหลานั้นดูเปนของอิตาลีมากกวายูโกสลาเวีย"
 news.193.t: "สํานักงานการตางประเทศอิตาลีใน [YUG.GetName]"
 news.193.d: "แทนที่จะเผชิญหนากับ [YUG.GetName] เรื่องประชากรชาวอิตาลีบนชายฝงดัลเมเชีย [From.GetName] กลับประกาศจัดตั้งคณะผูแทนทางการทูตถาวรประจํา [YUG.GetName] ตามแถลงการณของกระทรวงการตางประเทศ[From.GetAdjective] ทั้งสองประเทศมีประวัติศาสตรและผลประโยชนรวมกันมากมาย จนความเขาใจซึ่งกันและกันสําคัญกวาขอพิพาทพรมแดนเล็ก ๆ นอย ๆ มากนัก\n\nทามกลางความตึงเครียดที่เพิ่มขึ้นทั่วยุโรป ไดแตหวังวาจะมีประเทศอื่น ๆ ใชแนวทางเชนนี้มากขึ้น"
 news.193.a: "ชาติของเรายืนหยัดเคียงขางกันฉันมิตร"
 news.193.b: "ทะเลเอเดรียติกจะมีสันติภาพ"
 news.193.c: "นาสนใจวาเรื่องนี้จะจบลงอยางไร"
 news.194.t: "โปแลนดตะวันออกถูกยกใหแก [From.GetName]"
 news.194.d: "ดวยการเดินเกมทางการเมืองที่ไมมีใครลวงรู ผูนําของ [Poland.GetName] ไดยกดินแดนตะวันออกใหแก [From.GetName] \n\nยังไมมีใครทราบวา [From.GetName] ใหคําสัญญาหรือขมขูอะไรไวจึงไดชัยชนะทางการเมืองครั้งนี้ และเราอาจไมมีวันไดรู เพราะ [Poland.GetLeader] ยังไมไดเอยอะไรเลยนอกจากการประกาศขอตกลง"
 news.194.a: "[Poland.GetName] ยอมรับในความแข็งแกรงของ [From.GetFactionName]!"
 news.194.b: "[From.GetName] กลืนกินทุกสิ่งที่ขวางหนา"
 news.194.c: "[Poland.GetName] คงไมเหลือทางเลือกอื่นแลว"
 news.195.t: "[From.GetName] ไดรับเยอรมนีตะวันออก"
 news.195.d: "หลังจากที่ [Soviet.GetName] ยึดครองเยอรมนี [From.GetName] ก็ไดรับดินแดนสวนใหญของเยอรมนีตะวันออก รวมถึงดินแดนพิพาทอยางปรัสเซียตะวันออก\nดูเหมือนวานี่เปนผลจากขอตกลงลับในสนธิสัญญาโซเวียต-โปแลนด โปแลนดไดรับดินแดนเยอรมันเปนคาชดเชยสําหรับดินแดนที่ถูกบังคับใหยกแก [Soviet.GetName]\n\nโปแลนดเดิมพันดวยเดิมพันสูงสุด และแมจะสูญเสียไปมาก แตตอนนี้ก็ไดอะไรกลับมามากเชนกัน"
 news.195.a: "[Soviet.GetName] รักษาสนธิสัญญาของตน"
 news.195.b: "หวังวาโปแลนดที่เสรีจะลุกขึ้นจากเถาถานที่ "ผูคุมครอง" ของตนสรางไวได"
 news.195.c: "โปแลนดยายที่ทางภูมิศาสตรอีกแลว"
 news.196.t: "[From.GetName] ปลุกระดมนักปฏิวัติ"
 news.196.d: "ในสุนทรพจนอันเรารอน [From.GetLeader] เรียกรองใหพรรคคอมมิวนิสตทั่วโลกเรงการลมสลายของทุนนิยมดวยยุทธวิธีที่รุนแรงยิ่งขึ้น ความกลัวการถูกกดขี่ตองไมหยุดยั้งชายหรือหญิงแมแตคนเดียวจากการสงเสริมการตอสูของชนชั้นแรงงาน\n\n[From.GetName] จะเพิ่มเงินทุนใหแกพรรคคอมมิวนิสตในตางประเทศ และฝกสอนยุทธวิธีที่รุนแรงยิ่งขึ้นซึ่งจําเปนตอการนําชาติของพวกเขามาอยูแนวเดียวกับ [From.GetFactionName]"
 news.196.a: "ประชาธิปไตยจะไมมีวันถูกโคนลม!"
 news.196.b: "ความพยายามที่นาขัน!"
 news.196.c: "ลุกขึ้นเถิด พี่นองชายหญิง!"
 news.196.e: "การปะทะกันของอุดมการณคือการตอสูครั้งสุดทายของอารยธรรม"
 news.197.t: "[From.GetName] ยอมตามคําขาดของ[Soviet.GetAdjective]"
 news.197.d: "[From.GetName] ยอมตามคําขาดของ[Soviet.GetAdjective] และยกการควบคุมหมูเกาะในทะเลอีเจียนใหแก [Soviet.GetName]\n\nดวยเหตุนี้ [Soviet.GetName] จึงเสริมการปรากฏตัวในทะเลเมดิเตอรเรเนียน และตอกยํ้าสถานะการเปนกําลังทางเรือในภูมิภาค"
 news.197.a: "พวกเขาควรดีใจที่เรายื่นเงื่อนไขดี ๆ ใหขนาดนี้"
 news.197.b: "ตองหยุดยั้ง [Soviet.GetName] ใหได!"
 news.197.c: "[Soviet.GetName] กําลังเตรียมรุกเขาสูทะเลเมดิเตอรเรเนียน"
 news.198.t: "[From.GetName] ตอตานคําขาดของ[Soviet.GetAdjective]"
 news.198.d: "[From.GetName] ปฏิเสธขอเรียกรองในคําขาดของ[SOV.GetAdjective]ที่สงมาเรื่องหมูเกาะในทะเลอีเจียน ขณะที่ [SOV.GetName] แผอิทธิพลเหนือภูมิภาคมากขึ้นเรื่อย ๆ [From.GetLeader] ประกาศวาการยกเกาะใหแมเพียงเกาะเดียวในทะเลอีเจียนจะจบลงดวยการที่พวกเขายึดทะเลเมดิเตอรเรเนียนทั้งหมด\n\nเมื่อปฏิเสธคําขาดแลว [From.GetName] จึงอยูบนขอบเหวของสงคราม และทําไดเพียงรอให [SOV.GetNameDef] เปนฝายลั่นไก"
 news.198.a: "ถาเชนนั้นก็หมดเวลาพูดคุยแลว"
 news.198.b: "ตองหยุดยั้งพวกกระหายสงครามแหง [SOV.GetNameDef] ใหได!"
 news.198.c: "นี่คือคําขาดของพวกเขา กรีซตองเตรียมพรอมทําสงคราม"
 news.198.e: "เรายืนหยัดเคียงขาง [From.GetNameDef]"
 news.199.t: "[?SOV.former_controller_of_bessarabia.GetNameDefCap] ยกเบสซาราเบียใหแก [From.GetNameDef]"
 news.199.d: "\n\n[?SOV.former_controller_of_bessarabia.GetNameDefCap] ถูกบังคับใหยอมตามคําขาดของ [From.GetNameDef] ดินแดนเบสซาราเบียไดถูกโอนไปอยูใตการควบคุมของ[From.GetAdjective] และรัฐ[?SOV.former_controller_of_bessarabia.GetAdjective]ก็เหลือพรมแดนที่หดเล็กลง\n\nยังตองรอดูวา [?SOV.former_controller_of_bessarabia.GetNameDef] จะหลีกเลี่ยงการสูญเสียเพิ่มเติมไดอยางไร"
 news.199.a: "นี่คือหัวใจของยุทธศาสตร[From.GetAdjective]"
 news.199.b: "ประเทศทั่วโลกตองเผชิญหนากับความชั่วรายของ [From.GetNameDef]!"
 news.199.c: "[?SOV.former_controller_of_bessarabia.GetNameDefCap] ตกอยูในสถานการณที่นาเห็นใจ"
 news.200.t: "อิทธิพลเยอรมันใน [CZE.GetNameDef]"
 news.200.d: "[From.GetLeader] กลาวถึงภราดรภาพระหวางชาติตาง ๆ ภายใน "เขตอิทธิพลเยอรมัน" ในสุนทรพจนวันนี้ และประกาศความมุงมั่นของ [From.GetName] ตอความรวมมือทางการเมืองและการทูตกับ [CZE.GetNameDef] ดวยประชากรที่พูดภาษาเยอรมันจํานวนมาก [CZE.GetNameDef] จึงถูกนําเสนอวาเปนหุนสวนโดยธรรมชาติของผลประโยชน[From.GetAdjective]\n\nแมจะไมแนชัดวา [CZE.GetNameDef] มีสิทธิ์มีเสียงในความรวมมือนี้มากเพียงใด แตอยางนอยพวกเขาก็มั่นใจไดวาพรมแดนของตนปลอดภัยจากความทะเยอทะยานทางดินแดนของ [GER.GetNameDef]"
 news.200.a: "มิตรภาพกับเยอรมันดีกวาการตกอยูใตอํานาจเยอรมัน"
 news.200.b: "ชาวเช็กเปนมิตรของชาวเยอรมันมาโดยตลอด"
 news.200.c: "[From.GetName] ยังคงขยายเขตอิทธิพลของตนตอไป"
 news.200.e: "สันติภาพในยุคของเรา?"
 news.200.f: "ขาวดีสําหรับตอนที่ [Root.GetLeader] กลับจากพักรอนที่มิวนิก!"
 news.201.t: "[GER.GetNameDefCap] บีบให [TUR.GetNameDef] ยอมสยบ"
 news.201.d: "\nเมื่อตองเผชิญแรงกดดันทั้งทางการทูตและการทหารจาก [GER.GetFactionName] ทั้งทางตะวันออกและตะวันตก รัฐบาล[TUR.GetAdjective]ก็ตกอยูในความปนปวนทางการเมือง\n\nหลังการขมขูของเยอรมนีและโซเวียต รัฐบาลใหมที่เกิดขึ้นจากความโกลาหลก็เปนมิตรกับ [GER.GetFactionName] มากกวารัฐบาลเกาอยางมาก ดินแดนทางตะวันออกหลายแหงไดถูกยกใหแก [SOV.GetNameDef] แลว \n\nแทจริงแลว ผูเห็นตางบางคนที่ถูกปดปากอยางเรงรีบไดโตแยงวารัฐบาลใหมทําตามทุกความตองการของ [GER.GetLeader]"
 news.201.a: "รัฐบาลตุรกีชุดใหมชวยรักษาความสามารถในการแขงขันของเราในทะเลเมดิเตอรเรเนียน"
 news.201.b: "พลังอันนาสะพรึงของ [GER.GetFactionName] กําลังโคนประเทศตาง ๆ ลงเหมือนโดมิโน"
 news.201.c: "[From.GetNameDefCap] ไมอาจตานทานความแข็งแกรงของ [GER.GetFactionName] ได"
 news.201.e: "พันธมิตรกําลังเสริมสถานะของเราใหแข็งแกรงขึ้น"
 news.201.f: "ตุรกีตกเปนเหยื่อของ [GER.GetFactionName] ผูลาเหยื่อ"
 news.202.t: "สโลวาเกียแลกดานซิก"
 news.202.d: "หลังจากวาทกรรมที่กาวราวขึ้นเรื่อย ๆ มาหลายเดือน ความสัมพันธที่ยํ่าแยระหวาง [GER.GetNameDef] และ [POL.GetNameDef] ก็พลิกผันในคํ่าคืนนี้ ดวยขอตกลงทางการทูตที่มุงยุติขอพิพาทดานซิก\n\n[POL.GetNameDef] จะผนวกสโลวาเกียที่อยูใตการควบคุมของเยอรมนีเขาเปนรัฐยอยของโปแลนด และจะยกภูมิภาคดานซิกเปนการแลกเปลี่ยน สถานะของนครเสรีดานซิกไดรับการยุติอยางรวดเร็ว และจะถูกรวมกลับเขาเปนสวนหนึ่งของรัฐเยอรมันอยางสมบูรณในไมชา\n\nแมเรื่องนี้ดูเหมือนจะยุติลงอยางสันติ แตบรรดาผูชนะในมหาสงครามยอมตองคัดคานเปนแน"
 news.202.a: "การแลกเปลี่ยนที่เปนธรรมเพื่อแกไขความผิดพลาดของแวรซาย"
 news.202.b: "ความรวมมือทําใหเราแข็งแกรงกวาความขัดแยง"
 news.202.c: "นี่คือการละเมิดสนธิสัญญาแวรซายอยางโจงแจง!"
 news.202.e: "ความขัดแยงเรื่องดานซิกไดรับการหลีกเลี่ยงแลว"
 news.203.t: "โปแลนดยกดานซิก"
 news.203.d: "หลังจากที่[GER.GetAdjective]ยื่นคําขาดตอ [From.GetNameDef] [From.GetLeader] และรัฐบาล[From.GetAdjective]ตัดสินใจยอมทําตามทุกขอเรียกรองแทนที่จะเผชิญสงคราม\n\nพวกเขาหวังวาเมื่อเสียดานซิกไปแลว [From.GetNameDef] จะปลอดภัยจากความทะเยอทะยานทางดินแดนของเยอรมนีตอไป อยางไรก็ตาม สถานการณยังคงตึงเครียด และเปนที่สังเกตวากองกําลังรักษาชายแดนของโปแลนดยังไมไดรับคําสั่งใหถอนกําลัง"
 news.203.a: "จะปลอยให [GER.GetLeader] เรียกรองจากยุโรปตอไปไมได!"
 news.203.b: "นี่คือการยอมรับในอํานาจของ [GER.GetFactionName]"
 news.203.c: "การขยายตัวของเยอรมนียังคงดําเนินตอไป"
 news.203.e: "เปนที่ชัดเจนแลววา "ประชาธิปไตย" ทั้งหลายในยุโรปไมอาจหยุดยั้งภัยคุกคามฟาสซิสตได"
 news.204.t: "โปแลนดปฏิเสธคําขาดของเยอรมนี"
 news.204.d: "เมื่อพิจารณาขอเรียกรองแลว ผลลัพธนี้ดูจะหลีกเลี่ยงไมได \n\n[From.GetNameDef] จะถูกบังคับใหยกดานซิกแกเยอรมนี และตองสงผูแทนผูมีอํานาจเต็มของโปแลนดไปยังเบอรลินเพื่อเจรจาเงื่อนไขเพิ่มเติม [From.GetLeader] ชี้ถึงการกระทําลาสุดของ [GER.GetNameDef] และกลาววาเห็นไดชัดวาเยอรมนีจะไมพอใจเพียงแคดานซิก\n\nกองกําลังเยอรมนีและโปแลนดตางเตรียมพรอมทําสงคราม และเริ่มมีรายงานการปะทะตามแนวชายแดนแลว สงครามไดอุบัติขึ้นในยุโรปอีกครั้ง"
 news.204.a: "เยอรมนีเพิกเฉยตอทุกคําเตือน!"
 news.204.b: "ถาเชนนั้นก็สงคราม"
 news.204.c: "เราตองรวมกันหยุดยั้งผูรุกรานรายนี้!"
 news.204.e: "นี่คือสถานการณที่รายแรง"
 news.205.t: "สันติภาพแบบอเมริกัน"
 news.205.d_america: "[USA.GetLeader] มองไปยังความขัดแยงในทวีปอื่น ๆ แลวประกาศแผนนโยบายตางประเทศใหม เพื่อรักษาสันติภาพภายในบาน\n\nรัฐบาลใดก็ตามในทวีปอเมริกาสามารถรองขอการคุมครองทางทหารจากสหรัฐอเมริกาได หากรูสึกถูกคุกคามจากเพื่อนบาน แมจะไมใชการรับประกันรัฐใดรัฐหนึ่งโดยเฉพาะ แตความปรารถนาใหทวีปอเมริกามีสันติภาพก็ไมใชเพียงความฝนอีกตอไป หากเปนนโยบายอยางเปนทางการของอเมริกา"
 news.205.d_not_america: "[USA.GetLeader] มองไปยังความขัดแยงในทวีปอื่น ๆ แลวประกาศแผนนโยบายตางประเทศใหม เพื่อรักษาสันติภาพภายในบาน\nรัฐบาลใดก็ตามในทวีปอเมริกาสามารถรองขอการคุมครองทางทหารจากสหรัฐอเมริกาได หากรูสึกถูกคุกคามจากเพื่อนบาน แมจะไมใชการรับประกันรัฐใดรัฐหนึ่งโดยเฉพาะ แตความปรารถนาใหทวีปอเมริกามีสันติภาพก็ไมใชเพียงความฝนอีกตอไป หากเปนนโยบายอยางเปนทางการของอเมริกา"
 news.205.a: "สิ่งนี้นาจะทําใหอเมริกาปลอดภัยขึ้น"
 news.205.b: "เมื่อบานสงบ สหรัฐฯ ก็มุงความสนใจไปที่ศัตรูของเราในตางแดนได"
 news.205.c: "ตอนนี้เราอาจหาพันธมิตรในทวีปอเมริกาไดยากขึ้น"
 news.205.e: "ขอใหเปนสันติภาพที่ยั่งยืน"
 news.206.t: "การตอตานจักรวรรดินิยมของอเมริกา"
 news.206.d_communist: "หลังการปฏิวัติของกรรมกรลุกลามไปถึงสหรัฐอเมริกา วาทกรรมตอตานระเบียบเกาของพวกเขาก็ดุดันขึ้นมาก ขณะนี้ [USA.GetLeader] กําลังตั้งคําถามตอสถานะของแคนาดาในฐานะรัฐในอารักขาของจักรวรรดิบริติช สวนนักการทูตอเมริกันก็ปาวประกาศถึงโลกที่ปลอดจากชนชั้นขุนนางและการเปนเจาอาณานิคมทั่วโลก\n\nแมจะมีสายสัมพันธผูกพันกันอยู ความตึงเครียดระหวาง [USA.GetNameDef] และจักรวรรดิอาณานิคมของ [ENG.GetNameDef] ก็กําลังเพิ่มสูงขึ้น เปนเพียงเรื่องของเวลากอนที่ความขัดแยงทางการทูตนี้จะบานปลาย และการปฏิวัติจะถูกนําไปสู [ENG.GetNameDef] ดวยกําลัง"
 news.206.d_not_communist: "ระบอบคอมมิวนิสตใหมในสหรัฐอเมริกาไดนําหลักนิยมใหมของนโยบายตางประเทศ[USA.GetAdjective]มาใช โดยมีทาทีดุดันยิ่งขึ้นมากตอทั้งอดีตพันธมิตรและมิตรประเทศ ขณะที่ขยับเขาใกลสมาชิกขององคการคอมมิวนิสตสากล\nการเปลี่ยนนโยบายนี้รวมถึงการตั้งคําถามตอสถานะของ [CAN.GetName] ในฐานะชาติในอารักขา และแนวปฏิบัติโดยรวมของสิ่งที่พวกเขาเรียกวา "จักรวรรดินิยมอังกฤษทั่วโลก"\n\nเมื่อความตึงเครียดเพิ่มสูงขึ้น ภัยคุกคามของความขัดแยงครั้งใหมระหวางอังกฤษกับอเมริกาก็ดูเปนจริงขึ้นมาก"
 news.206.a: "ทั้งโลกจะไดรับการปลดปลอยดวยการปฏิวัติ!"
 news.206.b: "เราตองเตรียมพรอมรับทุกสถานการณ"
 news.206.c: "ดุลอํานาจโลกกําลังถูกคุกคาม"
 news.206.e: "ระบอบ[USA.GetAdjective]ไมใชเรื่องที่ตองกังวล"
 news.206.f: "พัฒนาการที่นาเปนหวง"
 news.207.t: "[USA.GetNameDefCap] ประณามองคการคอมมิวนิสตสากล"
 news.207.d_fascism: "\nเพื่อตอบโตวาทกรรมที่ดุดันขึ้นเรื่อย ๆ จาก [SOV.GetNameDef] [USA.GetLeader] ไดออกมาโตกลับสิ่งที่เขาเรียกวา "ภัยรายแรงที่สุดตออารยธรรมมนุษย นั่นคือคอมมิวนิสต"\n\n[USA.GetNameDef] ไมเพียงจะดําเนินนโยบายปกปองเพื่อยับยั้งการแพรกระจายของสังคมนิยมโลกในทวีปอเมริกาเทานั้น แตยังมุงทําลายหัวใจของลัทธิคอมมิวนิสตเองดวย\n\nดวยพลังของเครื่องจักรสงคราม[USA.GetAdjective] การกําจัดลัทธิคอมมิวนิสตใหสิ้นซากดูเปนไปไดอยางแทจริงเปนครั้งแรก"
 news.207.d_not_fascism: "วันนี้ [USA.GetLeader] กลาวสุนทรพจนตอสาธารณะตอตานสิ่งที่เขาเรียกวา "ภัยรายแรงที่สุดตออารยธรรมมนุษย" นั่นคือคอมมิวนิสต\n\n[USA.GetNameDef] ไมเพียงจะดําเนินนโยบายปกปองเพื่อยับยั้งการแพรกระจายของสังคมนิยมโลกในทวีปอเมริกาเทานั้น แตฝาย[USA.GetAdjective]ยังประกาศชัดวามุงทําลายหัวใจของลัทธิคอมมิวนิสตเองดวย\n\nเมื่อความตึงเครียดพุงสูงสุดเปนประวัติการณ เพียงประกายไฟเดียวก็พอจะจุดเพลิงสงครามระหวาง [SOV.GetNameDef] และ [USA.GetNameDef]"
 news.207.a: "มนุษยชาติจะไดรับการปลดปลอยจากโรคระบาดทางอุดมการณนี้!"
 news.207.b: "พวกเขาจะแตกพายเมื่อปะทะกับปอมปราการแหงคอมมิวนิสต"
 news.207.c: "เราจะทําใหพวกเขาตองคุกเขา"
 news.207.e: "ไมวาความขัดแยงนี้จะจบอยางไร ความพินาศจะสิ้นเชิง"
 news.207.f: "[USA.GetNameDefCap] ตองทําสิ่งที่จําเปนเพื่อปกปองตนเอง"
 news.208.t: "กองทัพญี่ปุนยึดแนวคิดนันชินรง"
 news.208.d: "กองทัพญี่ปุนยอมรับมานานแลววา [JAP.GetName] ไมมีทรัพยากรธรรมชาติเพียงพอสําหรับการทําสงครามยืดเยื้อ ดวยความตึงเครียดที่เพิ่มขึ้นและการปะทุของความขัดแยงทางอาวุธที่เกี่ยวพันกับมหาอํานาจของโลก ภัยคุกคามที่จะสูญเสียการนําเขาก็ดูจะเพิ่มขึ้นทุกวัน\nเพื่อรับมือกับสิ่งนี้ นักยุทธศาสตรญี่ปุนไดวางแผนยุทธศาสตรเพื่อยึดอาณานิคมของชาติตะวันตกในเอเชียตะวันออกเฉียงใตและแปซิฟก ภูมิภาคที่อุดมดวยทรัพยากรเหลานี้จะหลอเลี้ยงเครื่องจักรสงครามของญี่ปุนและทําใหมันเดินหนาตอไปไดแทบไมมีอุปสรรค ตราบใดที่ยังกันมหาอํานาจอาณานิคมและ [USA.GetName] ไวได"
 news.208.a: "พวกเขาสามารถคุกคามดินแดนของเราไดจริงหรือ?"
 news.208.b: "ตราบใดที่ดินแดนอเมริกันไมถูกคุกคาม"
 news.208.c: "พวกเขาตระหนักแลววาตองไปหาเหยื่อที่อื่น"
 news.208.e: "สงครามในเอเชียตะวันออกเฉียงใตดูจะเกิดขึ้นแน"
 news.209.t: "กองทัพญี่ปุนยึดแนวคิดโฮกุชินรง"
 news.209.d: "กองทัพญี่ปุนยอมรับมานานแลววา [JAP.GetNameDef] ไมมีทรัพยากรธรรมชาติเพียงพอสําหรับการทําสงครามยืดเยื้อ ดวยความตึงเครียดที่เพิ่มขึ้นและการปะทุของความขัดแยงทางอาวุธที่เกี่ยวพันกับมหาอํานาจของโลก ภัยคุกคามที่จะสูญเสียการนําเขาก็ดูจะเพิ่มขึ้นทุกวัน\nเพื่อรับมือกับสิ่งนี้ นักยุทธศาสตรญี่ปุนไดวางแผนยุทธศาสตรเพื่อยึดเหมืองแรและบอนํ้ามันในไซบีเรียจาก [SOV.GetNameDef] โดยมีทฤษฎีวาการรุกอยางรวดเร็วจะทําใหญี่ปุนยึดดินแดนสําคัญไดกอนที่ฝาย[SOV.GetAdjective]จะตั้งหลักตีโตได เมื่อถึงตอนนั้น กองทัพญี่ปุนจะมีทรัพยากรทุกอยางที่ตองการเพื่อหลอเลี้ยงเปลวไฟสงครามไปจนกวาฝาย[SOV.GetAdjective]จะยอมจํานน"
 news.209.a: "คงเปนเรื่องโงเขลาหากจะคุกคามดินแดนของเรา"
 news.209.b: "เราหามปรามญี่ปุนไมใหรุกเขาแปซิฟกไดแลว"
 news.209.c: "พวกเขาไมเขาใจวากําลังจะตองเผชิญกับพลังอันนาสะพรึงเพียงใด"
 news.209.e: "สงครามในไซบีเรียดูจะหลีกเลี่ยงไมได"
 news.210.t: "ญี่ปุนเปลี่ยนรัฐบาลในจีน"
 news.210.d: "หลังความไรเสถียรภาพทางการเมืองในจีนนานหลายทศวรรษ ประกอบกับความขัดแยงทางอาวุธทั้งภายในและภายนอก รัฐบาลญี่ปุนประกาศวาถือวารัฐบาลจีนเปนภัยคุกคามตอเสถียรภาพในเขตผลประโยชนของตน\n\nดวยเหตุนี้ ภายใตการขูวาจะทําสงคราม รัฐบาลใหมที่ภักดีตอญี่ปุนและอยูใตองคจักรพรรดิญี่ปุนจึงถูกแตงตั้งขึ้นปกครอง รัฐบาลใหมนี้ไมเพียงไดรับการคุมครองจากกองทัพญี่ปุน แตยังไดรับอาณัติทางทหารใหยึดคืนรัฐขุนศึกจีนทั้งหลายดวย\n\nแมความขัดแยงทางการเมืองจะยังคงคุกรุนตอไปแนนอน แตสงครามเต็มรูปแบบระหวางสองประเทศก็ไดรับการหลีกเลี่ยงแลว"
 news.210.a: "ไมอาจปฏิเสธเขตอิทธิพลของญี่ปุนได"
 news.210.b: "เราควรจับตาดูพรมแดนดานตะวันออกเฉียงใตของเรา"
 news.210.c: "บางทีถึงเวลาเสริมกําลังอาณานิคมของเราเพื่อรับมือความทะเยอทะยานของญี่ปุนแลว"
 news.210.e: "ดูเหมือนวาจีนกับญี่ปุนจะมีสันติภาพในแบบหนึ่ง"
 news.211.t: "ญี่ปุนประกาศความเปนเจาในเอเชียตะวันออก"
 news.211.d: "ดวยเห็นวาความเหนือกวาทางทหารของตนในเอเชียตะวันออกไมมีผูใดทาทาย [JAP.GetLeader] จึงประกาศวา [JAP.GetNameDef] ถือวาทั้งภูมิภาคเปนเขตผลประโยชนของตน เนื่องจากไมมีขอมูลที่แมนยําวาญี่ปุนสามารถแผขยายอํานาจไดกวางไกลเพียงใด จึงยังไมชัดเจนวา [JAP.GetNameDef] ถือวาดินแดนใดบางเปนสวนหนึ่งโดยชอบธรรมของ [JAP.GetFactionName] ที่เพิ่งกอตั้งขึ้น"
 news.211.a: "[JAP.GetFactionName] กําลังผงาดขึ้น"
 news.211.b: "นี่เปนพัฒนาการที่นาสนใจ"
 news.211.c: "พวกเขาไมกลาอางสิทธิ์เหนือดินแดนเอเชียของเราหรอก"
 news.211.e: "พัฒนาการที่นากังวลในแปซิฟก"
 news.211.f: "ฟงดูเหมือนเรามีผลประโยชนขัดกัน"
 news.211.g: "เราควรจับตาเรื่องนี้ไว"
 news.212.t: "นักการทูตญี่ปุนในเบอรลิน"
 news.212.d_not_axis: "ความเปนหุนสวนใหมกําลังกอตัวขึ้นระหวางโตเกียวกับเบอรลิน การเจรจาสนธิสัญญาระหวางสองรัฐไดเริ่มขึ้นแลว โดยอางถึงทั้งผลประโยชนทางยุทธศาสตรและคานิยมรวมกัน แมยังตองรอดูวาการเจรจาจะไดผลอะไรหรือไม แตความเปนไปไดที่กองทัพที่แข็งแกรงที่สุดบางสวนของแตละซีกโลกจะผูกมิตรกัน ก็เปนเรื่องนากังวลสําหรับศัตรูจํานวนมากของพวกเขา"
 news.212.d_axis: "ความเปนหุนสวนใหมกําลังกอตัวขึ้นระหวางโตเกียวกับเบอรลิน การเจรจาสนธิสัญญาระหวางสองรัฐไดเริ่มขึ้นแลว โดยอางถึงทั้งผลประโยชนทางยุทธศาสตรและคานิยมรวมกัน แมยังตองรอดูวาการเจรจาจะไดผลอะไรหรือไม แตความเปนไปไดที่กองทัพที่แข็งแกรงที่สุดบางสวนของแตละซีกโลกจะผูกมิตรกัน เปนเรื่องนายินดีสําหรับพันธมิตรของพวกเขา และนากังวลสําหรับศัตรูจํานวนมาก"
 news.212.a: "สิ่งนี้จะทําใหเราทุกคนแข็งแกรงขึ้น"
 news.212.b: "ศัตรูของเราไมควรไดผูกมิตรกัน"
 news.212.c: "คงจะดีที่สุดถาเรื่องนี้ไมเกิดผลอะไร"
 news.213.t: "[USA.GetNameDefCap] ยืนหยัดตอตานฟาสซิสต"
 news.213.d_peace: "ในฐานะดินแดนแหงเสรีภาพ [USA.GetNameDef] ถือวาตนเปนศัตรูโดยธรรมชาติของลัทธิฟาสซิสตทุกรูปแบบทั่วโลก ดวยความกาวราวของระบอบเยอรมัน ขณะนี้พวกเขาจึงเปนศัตรูที่ยิ่งใหญที่สุดของโลกที่สรางบนหลักการเสรีนิยมซึ่ง [USA.GetNameDef] ยึดถือ\n\nดวยเหตุนี้ และดวยความเห็นชอบของรัฐสภา[USA.GetAdjective] [USA.GetLeader] จึงออกคําเตือนถึง [GER.GetNameDef] หาก [GER.GetNameDef] ไมเปลี่ยนแนวทางทางการเมือง [USA.GetNameDef] จะดําเนินการกับพวกเขา\n\nแมจะไมไดระบุวาจะดําเนินการอยางไร แตภัยคุกคามแหงสงครามที่แฝงอยูก็ทอดเงาหนักอึ้งระหวางสองประเทศ"
 news.213.d_war: "ในฐานะดินแดนแหงเสรีภาพ [USA.GetNameDef] ถือวาตนเปนศัตรูโดยธรรมชาติของลัทธิฟาสซิสตทุกรูปแบบทั่วโลก ดวยความกาวราวของระบอบเยอรมัน ขณะนี้พวกเขาจึงเปนศัตรูที่ยิ่งใหญที่สุดของโลกที่สรางบนหลักการเสรีนิยมซึ่ง [USA.GetNameDef] ยึดถือ\n\nดวยเหตุนี้ และดวยความเห็นชอบของรัฐสภา[USA.GetAdjective] [USA.GetLeader] จึงออกคําเตือนถึง [GER.GetNameDef] หาก [GER.GetNameDef] ไมยอมจํานนและเปลี่ยนแนวทางทางการเมือง [USA.GetNameDef] จะทุมสรรพกําลังทางอุตสาหกรรมและการทหารทั้งหมดเขาจัดการพวกเขา\n"เราจะไมยอมให [GER.GetNameDef] หันเหความกาวหนาของประวัติศาสตร!""
 news.213.a: "[GER.GetName] จะยืนหยัดอยางแข็งแกรงไปอีกพันป!"
 news.213.b: "พวกเขาจะตองพิสูจนคําพูดดวยคมเหล็ก"
 news.213.c: "[GER.GetName] จะตองลมสลาย!"
 news.213.e: "เรื่องนี้จะไมจบลงอยางสันติ"
 news.214.t: "โปแลนดแสวงหาความรวมมือกับรัฐบอลติก"
 news.214.d_not_baltic: ""ไมมีผลลัพธใดสําหรับเราที่ไมเสี่ยงตอการกดขี่ชาวโปแลนดยิ่งกวาเดิม"\n\nหลังจากที่ [POL.GetName] ถอยหางจากประชาคมระหวางประเทศ นักการเมืองโปแลนดก็ผลักดันแนวคิดเรื่องมหาอํานาจ "ระหวางทะเล"\n\nแมจะหวังสรางพันธมิตรที่ทอดยาวจากทะเลบอลติกถึงทะเลดํา แตลําดับความสําคัญที่ประกาศไวยังคงเปนการเสริมสถานะของตนตออิทธิพลที่คุกคามทั้งจากตะวันออกและตะวันตก ดวยเหตุนี้ [POL.GetName] จึงแสวงหาความสัมพันธที่ใกลชิดขึ้นกับเพื่อนบานในแถบบอลติก"
 news.214.d_baltic: "[POL.GetName] คอย ๆ ถอยหางจากประชาคมระหวางประเทศ โดยตระหนักดีวาไมอาจพึ่งพาการเลนการเมืองของ "มหาอํานาจ" เพื่อปองกันไมใหผูรุกรานโคนรัฐโปแลนดลงอีกครั้ง\n\n[POL.GetLeader] จึงเสนอแผนการจัดตั้งพันธมิตรเพื่อเสริมความมั่นคงใหภูมิภาคบอลติก ซึ่งหวังวาจะยับยั้งการรุกรานไดทั้งจากตะวันออกและตะวันตก\n\nดวยเสถียรภาพของยุโรปที่เสื่อมถอยลง พันธมิตรเชนนี้อาจเปนประโยชนสูงสุดตอเรา"
 news.214.a: "มหาอํานาจใหมในยุโรปตะวันออก"
 news.214.b: "พวกเขากําลังแทรกแซงเขตอิทธิพลของเรา!"
 news.214.c: "เห็นไดชัดวาพวกเขากําลังพยายามคุกคาม [GER.GetName]"
 news.214.e: "[POL.GetFactionName] อาจเปนทางเลือกที่ปลอดภัยที่สุดของเรา"
 news.215.t: "[GER.GetName] ทําสนธิสัญญาตอตานโซเวียตอยางเปนทางการ"
 news.215.d_not_soviet: "[GER.GetNameDefCap] ประณามลัทธิคอมมิวนิสตทุกรูปแบบมาชานาน และไดเคลื่อนไหวทางการทูตเรียกรองใหชาติอื่น ๆ ตอตานลัทธินี้เชนกัน\n\nบัดนี้ [GER.GetName] ไดเสนอโอกาสให "รัฐที่เผชิญภัยคุกคามจากคอมมิวนิสตโดยตรง" รวมทําสนธิสัญญาตอตาน [SOU.GetName] ประเทศใดที่อยูในสนธิสัญญาจะตองผูกพันเขาทําสงครามกับ [SOU.GetName] หากวันใดสมาชิกรายหนึ่งถูกโจมตี"
 news.215.d_soviet: "[GER.GetLeader] เปนผูตอตานคอมมิวนิสตอยางเปดเผยมาตั้งแตกอนขึ้นสูอํานาจ และไมเคยมีขอสงสัยเลยวา [GER.GetNameDef] ถือวาตนเปนศัตรูของ [SOU.GetNameDef]\n\nวันนี้ ทาทีดังกลาวไดประกาศใหโลกรู เมื่อ "ขอตกลงตอตานโซเวียต" ที่มีอยูเดิมระหวาง [GER.GetNameDef] กับอีกหลายประเทศไดถูกยกระดับเปนสนธิสัญญาอยางเปนทางการ สมาชิกที่เหลือจะถูกเรียกเขาสูสงคราม หากสมาชิกรายใดตองขัดแยงกับเรา"
 news.215.a: "นี่คือหนทางเดียวที่จะตานภัยคอมมิวนิสต"
 news.215.b: "การตอสูนี้มีแตจะเรงการปฏิวัติของกรรมกร"
 news.215.c: "ปลอยใหพวกมันหํ้าหั่นกันจนหมดแรงไปเถอะ"
 news.216.t: "[TUR.GetName] ตอตานคําขาดจาก [GER.GetName]"
 news.216.d: "เมื่อวานนี้ นักการทูตจาก [GER.GetName] ยื่นคําขาดตอ [TUR.GetName] เรียกรองให [TUR.GetLeader] ลงจากตําแหนงและเปดทางใหรัฐบาลที่เยอรมนีหนุนหลัง ดวยการสนับสนุนของสมัชชาแหงชาติใหญ [TUR.GetLeader] ปฏิเสธคําขาดนั้น พรอมประกาศตอประชาชน[TUR.GetAdjective]วาตุรกีจะไมมีวันเปนเบี้ยในเกมสงครามของจอมเผด็จการตางชาติ\n\nบัดนี้ประเทศกําลังเตรียมรับมือกับสงคราม"
 news.216.a: "[GER.GetName] จะตองถูกโคนลง"
 news.216.b: "เรายืนหยัดเคียงขาง [TUR.GetName]"
 news.216.c: "การตอตานที่โงเขลา"
 news.216.e: "สงครามในตุรกีดูจะหลีกเลี่ยงไมได"
 news.217.t: "[GER.GetNameDefCap] ผลักให [TUR.GetNameDef] เขารวม [ENG.GetFactionName]"
 news.217.d: "\n\nการยื่นคําขาดตอรัฐบาล[TUR.GetAdjective] ทําให [GER.GetNameDef] สรางศัตรูใหมใหตนเอง แทนที่จะยอมทําตามขอเรียกรองของนักการทูต[GER.GetAdjective]อยางที่ [GER.GetLeader] คาดไว [TUR.GetNameDef] กลับตกลงเปนพันธมิตรเชิงปองกันกับ [ENG.GetNameDef]\n\n[ENG.GetNameDef] และพันธมิตรเตรียมพรอมปกปอง [TUR.GetNameDef] หาก [GER.GetNameDef] ลงมือตามคําขาด"
 news.217.a: "เราตองรวมกันยืนหยัดตอตาน [GER.GetNameDef]"
 news.217.b: "[GER.GetNameDefCap] กําลังสรางศัตรูเพิ่มขึ้นเรื่อย ๆ"
 news.217.c: "หากพวกเขาปฏิเสธความรวมมืออยางสันติ..."
 news.217.e: "[GER.GetNameDefCap] และ [TUR.GetNameDef] กําลังเลนเกมอันตราย"
 news.218.t: "ใช! เราไมมีกลวย"
 news.218.d: "แมโครงการปนสวนอันเขมงวดของเราจะไมครอบคลุมผลไมสด แตเงาของสงครามทําใหเราสูญเสียขีดความสามารถในการนําเขาไปเกือบทั้งหมด สินคาจากเขตรอนหลายอยางที่เคยมีจึงกลายเปนของฟุมเฟอยที่หาไมได รวมถึงมะนาวและกลวย \nเพื่อรักษาจิตวิญญาณแหงยามสงคราม เจาของรานคาพากันแขวนปายไวที่หนาตาง โดยอางถึงเพลงเกาอันครึกครื้นจากละครเพลง\n\nนาเสียดายที่ถั่วฝกยาวและหัวหอม กะหลํ่าปลีและตนหอม รวมทั้งผลไมทุกชนิดก็ขาดแคลนเชนกัน แตจิตวิญญาณแบบอังกฤษยังคงไมยอทอ!"
 news.218.a: "ฉันแคอยากกินกลวย"
 news.219.t: "การกวาดลางผูนําใน [SOV.GetNameDef]"
 news.219.d: "ความไมแนนอนครอบงํา [SOV.GetNameDef] มาชานาน แมรายละเอียดจะมีนอย แตไดมีการไตสวนลับหลายครั้งในระดับสูงสุด และทั้งนายพลและรัฐมนตรีตางหายไปจากสายตาสาธารณชน\nขอสันนิษฐานทั่วไปคือไดมีการเปดโปงการสมคบคิดครั้งใหญภายในพรรคคอมมิวนิสต แตก็ไมมีแถลงการณอยางเปนทางการ นอกจากนี้ รายงานทางการทูตที่เราเขาถึงไดยังบงชี้วาหลักฐานที่นําเสนอในการไตสวนเหลานี้หางไกลจากความหนักแนนที่ไมอาจโตแยงได\n\nไมวาจะเกิดอะไรขึ้น โครงสรางกองบัญชาการระดับสูงของ[SOV.GetAdjective]ก็ไดเปลี่ยนแปลงไปอยางไมอาจยอนคืน"
 news.219.a: "[SOV.GetLeader] ไดสรางเสถียรภาพให [SOV.GetNameDef] แลว"
 news.219.b: "หลักฐานของความฉอฉลที่แฝงอยูในลัทธิคอมมิวนิสต"
 news.219.c: "กองบัญชาการ[SOV.GetAdjective]ไดรับความเสียหายอยางหนัก"
 news.220.t: "นายทหารกอกบฏใน [SOV.GetNameDef]!"
 news.220.d: "กองบัญชาการระดับสูงของโซเวียตบางสวนไดลุกฮือกอกบฏตอการนําของ [SOV.GetLeader]!\nยังไมแนชัดวาอะไรเปนชนวนของการลุกฮือครั้งนี้ แตดูไมใชความพยายามยึดอํานาจที่วางแผนมาอยางดีนัก\n\nสถานการณทางการเมืองของ[SOV.GetAdjective]อาจไมเปนอยางที่พวกเขาแสดงตอโลกภายนอก"
 news.220.a: "ประชาชนจะไดรับชัยชนะเสมอ"
 news.220.b: "เพื่อ [Root.GetNameDef]!"
 news.220.c: "พวกเขากําลังพังทลายจากภายใน!"
 news.220.e: "โครงสรางอํานาจแบบสังคมนิยมไมอาจยั่งยืน"
 news.220.f: "เปนพัฒนาการที่ไมคาดคิด"
 news.221.t: "ทรอตสกีกลับสู [SOV.GetNameDef]"
 news.221.d: "[SOV.GetNameDefCap] เกิดความพลิกผันครั้งใหญ เมื่อสตาลินถูกโคนอํานาจโดยกลุมที่สนับสนุน [SOV.GetLeader] คูแขงทางการเมืองคนเกาของเขา!\nสวนอดีตจอมเผด็จการอยูที่ใดในตอนนี้ หรือการเปลี่ยนผานเกิดขึ้นอยางไรกันแน รายละเอียดยังมีนอย\nอยางไรก็ตาม ทุกสิ่งบงชี้วานี่ไมใชการเปลี่ยนผานอยางสันติ เพราะผูภักดีตอสตาลินบางสวนไดชูธงกอกบฏตอระบอบใหมของทรอตสกีแลว"
 news.221.a: "องคการสากลที่สี่นําทาง"
 news.221.b: "ผูนําโลกคนใหมกาวขึ้นสูเวที"
 news.221.c: "แตทรอตสกีอยูตรงนี้ใน... ออ"
 news.222.t: "รัฐสภา[ENG.GetAdjective]อภิปรายเรื่องการแทรกแซงในสแกนดิเนเวีย"
 news.222.d: "\nดวยคุณคาทางยุทธศาสตรของภูมิภาคสแกนดิเนเวียตอการปองกันของ[ENG.GetAdjective] และความเสี่ยงที่ศัตรูอาจสรางอิทธิพลขึ้นที่นั่น รัฐสภา[ENG.GetAdjective]จึงไดอภิปรายถึงความเปนไปไดของการแทรกแซงทางทหาร\nแมผลกระทบทางการเมืองของการกระทําเชนนี้จะเปนภาระหนักอึ้งตอ [ENG.GetLeader] แตก็มีการเสนอขอโตแยงชี้ขาดหลายประการ กอนจะมีมติใหอภิปรายสวนที่เหลือเปนการลับ\n\nการแทรกแซงเชนนี้จะเปลี่ยนภูมิทัศนทางการเมืองของยุโรปเหนือไปอยางไมอาจยอนคืน"
 news.222.a: "เราทําสิ่งที่จําเปน เพื่อพระมหากษัตริยและประเทศชาติ"
 news.222.b: "พวกเขาจะคุกคามเอกราชของ[Root.GetAdjective]ดวยหรือไม?"
 news.222.c: "[ENG.GetNameDefCap] ตองตัดสินใจเรื่องยากบางอยาง"
 news.222.e: "การกระทําเชนนี้จะทําลายดุลอํานาจในยุโรป"
 news.222.f: "พวกเขาจะกลาเสี่ยงแทรกแซงจริงหรือ?"
 news.223.t: "รัฐสภา[ENG.GetAdjective]อภิปรายเรื่องการแทรกแซงในเบเนลักซ"
 news.223.d: "\nดวยบทเรียนจากมหาสงคราม ฝาย[ENG.GetAdjective]จะไมประเมินคุณคาทางยุทธศาสตรของภูมิภาคเบเนลักซตํ่าเกินไป รวมถึงความเสี่ยงที่ประเทศศัตรูอาจสรางอิทธิพลขึ้นที่นั่น รัฐสภา[ENG.GetAdjective]จึงไดอภิปรายถึงความเปนไปไดของการแทรกแซงทางทหาร\nแมผลกระทบทางการเมืองของการกระทําเชนนี้จะเปนภาระหนักอึ้งตอ [ENG.GetLeader] แตก็มีการเสนอขอโตแยงชี้ขาดหลายประการ กอนจะมีมติใหอภิปรายสวนที่เหลือเปนการลับ\n\nการแทรกแซงเชนนี้จะเปลี่ยนภูมิทัศนทางการเมืองของยุโรปตะวันตกไปอยางไมอาจยอนคืน"
 news.223.a: "เราทําสิ่งที่จําเปน เพื่อพระมหากษัตริยและประเทศชาติ"
 news.223.b: "พวกเขาจะคุกคามเอกราชของ[Root.GetAdjective]ดวยหรือไม?"
 news.223.c: "[ENG.GetNameDefCap] ตองตัดสินใจเรื่องยากบางอยาง"
 news.223.e: "การกระทําเชนนี้จะทําลายดุลอํานาจในยุโรป"
 news.223.f: "พวกเขาจะกลาเสี่ยงแทรกแซงจริงหรือ?"
 news.224.t: "[ENG.GetNameDefCap] กดดัน [SPR.GetNameDef]"
 news.224.d: "ดวยธรรมเนียมการแผอิทธิพลของอังกฤษในทะเลเมดิเตอรเรเนียนจากยิบรอลตาร จึงไมนาแปลกใจที่รัฐบาล[ENG.GetAdjective]ตัดสินใจกดดันทางการเมืองตอรัฐบาลฟาสซิสตใน [Spain.GetNameDef]\n\nเมื่อยังอยูระหวางการฟนฟูจากสงครามกลางเมือง การสนับสนุนจาก[ENG.GetAdjective]จึงสําคัญกวาหลักการทางการเมืองมากนัก"
 news.224.a: "เราตองยอมรับคณะผูแทนทางการทูตของพวกเขา"
 news.224.b: "พวก[ENG.GetAdjective]คิดวาตัวเองเปนใคร?"
 news.224.c: "ฝาย[ENG.GetAdjective]กําลังแผอิทธิพล"
 news.225.t: "[ENG.GetNameDefCap] แผอิทธิพลใน [TUR.GetNameDef]"
 news.225.d: "\nทะเลเมดิเตอรเรเนียนเปนภูมิภาคที่มีคุณคาทางยุทธศาสตรอยางยิ่งตออิทธิพลแหงจักรวรรดิของ [ENG.GetNameDef] มาชานาน บัดนี้รัฐบาล[ENG.GetAdjective]กําลังแสวงหาการสนับสนุนเพิ่มเติมจากประเทศในภูมิภาค จึงไดแตงตั้ง "กงสุลพิเศษประจํารัฐ[TUR.GetAdjective]"\n\nเมื่อคํานึงถึงการแขงขันอันดุเดือดเพื่อชิงความเปนใหญทางทะเลในเมดิเตอรเรเนียนตลอดหลายศตวรรษ ยังตองรอดูวาพวกเขาจะประสบความสําเร็จในการดึงสองประเทศใหใกลชิดกันหรือไม"
 news.225.a: "คณะผูแทนทางการทูตของพวกเขาอาจเปนประโยชนตอเรา"
 news.225.b: "พวก[ENG.GetAdjective]คิดวาตัวเองเปนใคร?"
 news.225.c: "ฝาย[ENG.GetAdjective]กําลังแผอิทธิพล"
 news.226.t: "[ENG.GetNameDefCap] แผอิทธิพลใน [GRE.GetNameDef]"
 news.226.d: "\nทะเลเมดิเตอรเรเนียนเปนภูมิภาคที่มีคุณคาทางยุทธศาสตรอยางยิ่งตออิทธิพลแหงจักรวรรดิของ [ENG.GetNameDef] มาชานาน บัดนี้รัฐบาล[ENG.GetAdjective]กําลังแสวงหาการสนับสนุนเพิ่มเติมจากประเทศในภูมิภาค จึงไดแตงตั้ง "กงสุลพิเศษประจํารัฐ[GRE.GetAdjective]"\n\nกวาหนึ่งศตวรรษหลังจากลอรดไบรอนเขารวมสงครามประกาศเอกราชกรีซ ยังตองรอดูวา [ENG.GetNameDef] จะประสบความสําเร็จหรือไม"
 news.226.a: "คณะผูแทนทางการทูตของพวกเขาอาจเปนประโยชนตอเรา"
 news.226.b: "พวก[ENG.GetAdjective]คิดวาตัวเองเปนใคร?"
 news.226.c: "ฝาย[ENG.GetAdjective]กําลังแผอิทธิพล"
 news.227.t: "การเดินทางอันมืดมนและปาเถื่อน"
 news.227.d: ""เราอยูหางจากเบอรลินสิบไมลตอนที่ฤทธิ์ยาเริ่มออก มันควรจะชวยเพิ่มประสิทธิภาพในการรบของเรา ไรสาระสิ้นดี สิ่งเดียวที่เพิ่มขึ้นคือความระแวงของผมวาผูบังคับบัญชากําลังพยายามกําจัดผม แถมผมยังแยกไมออกระหวางเสียงตีนตะขาบรถถังแพนเซอรของเยอรมันที่บดถนนมา กับเสียงตุบ ๆ อยางบาคลั่งหลังลูกตา\nผมตองไปหาดร.กอนโซ""
 news.227.a: "เราอยูในดินแดนคางคาวแลว"
 news.228.t: "[ENG.GetNameDefCap] ประกาศแผนริเริ่มทางการทูตในคาบสมุทรบอลขาน"
 news.228.d: "\n[ENG.GetNameDef] ไมไดเปนเพียงผูเดียวที่เห็นภัยคุกคามที่กําลังกอตัวในยุโรปกลาง\n\nดวยสถานะความเปนชาติเอกราชที่รับประกันโดยสนธิสัญญาแวรซายซึ่งบัดนี้ถูกทาทาย หรือดวยการที่มหาอํานาจฟาสซิสตอางสิทธิ์เหนือดินแดนของตนดวยวาทกรรมกาวราว หลายรัฐจึงเห็นความจําเปนที่จะตองดําเนินนโยบายฝกใฝ[ENG.GetAdjective] \n[ENG.GetNameDef] ตอบสนองตอพัฒนาการนี้ดวยการทุมเทความพยายามทางการทูตในภูมิภาคเปนเทาตัว"
 news.228.a: "หวังวาพวกเขาจะปกปองเราจากกระแสฟาสซิสตได"
 news.228.b: "พวกเขาควรอยูแตใน "เขตอิทธิพล" เล็ก ๆ ของตัวเองไปเถอะ!"
 news.228.c: "ตองรักษาเสถียรภาพของยุโรปไว!"
 news.228.e: "[ENG.GetNameDefCap] กําลังเตรียมยุทธศาสตร"
 news.229.t: "[GRE.GetNameDefCap] ตอตานแรงกดดันของ[GER.GetAdjective]"
 news.229.d: "แมจะสูญเสียดินแดนไปมากจากขอเรียกรองที่ [GER.GetNameDef] เปนผูนํา แตบัดนี้ [GRE.GetNameDef] ไดขีดเสนตายแลว [GRE.GetLeader] ประกาศชัดวา [GRE.GetNameDef] จะไมยอมออนขอใด ๆ อีก และจะไมกมหัวใหขอเรียกรองของ[GER.GetAdjective]อีกตอไป\n\nทั้งหมดนี้เปนการตอบโตคําขาดจาก [GER.GetNameDef] ที่ใหรัฐบาลของ [GRE.GetNameDef] ลงจากอํานาจและยอมรับรัฐบาลใหมที่[GER.GetAdjective]เห็นชอบ"
 news.229.a: "ตองปฏิเสธการรุกคืบของ[GER.GetAdjective]!"
 news.229.b: "พวกเขานาจะเอาตัวรอดตอนที่ยังมีโอกาส"
 news.229.c: "เรื่องนี้นาจะจบลงดวยการปะทะดวยอาวุธ"
 news.230.t: "การกบฏในทวีปอเมริกา"
 news.230.d: "ทั้งในอเมริกากลางและอเมริกาใต นักปฏิวัติไดจับอาวุธลุกขึ้นกอกบฏในนามของ[USA.GetRulingIdeologyNoun]\n\nโดยทั่วไปพวกเขามีอาวุธยุทโธปกรณครบครันและจัดตั้งอยางดี และหากพวกเขาชูอุดมการณอื่น ก็คงสืบหาแหลงเงินทุนไดไมยาก แตใครก็ตามที่สงเสบียงใหขบวนการเหลานี้ไดพยายามอยางยิ่งที่จะปกปดการมีสวนเกี่ยวของของตน\n\nแนนอนวามีมหาอํานาจเพียงชาติเดียวที่ประกาศพันธกิจดานนโยบายตางประเทศวาจะสงเสริม[USA.GetRulingIdeologyNoun]ในทวีปอเมริกา..."
 news.230.a: "พวกเขาจะนําประเทศของเราไปสูปากเหวแหงความพินาศ!"
 news.230.b: "หือ? ไมใชเรานะ"
 news.230.c: "ประชาชนทุกหนแหงควรลุกขึ้นเพื่อเสรีภาพ!"
 news.230.e: "รัฐประหารที่อเมริกาหนุนหลังเหรอ?\nเหตุการณที่เกิดขึ้นครั้งเดียวในชีวิต!"
 news.231.t: "[JAP.GetAdjective]ระดมกําลังบนพรมแดน[CHI.GetAdjective]"
 news.231.d: "หลังเหตุการณสะพานมารโคโปโล [JAP.GetName] ยังไมลดแรงกดดันบนพรมแดน[CHI.GetAdjective]\nประกอบกับวาทกรรมกาวราวของ[JAP.GetAdjective]ที่กลาวถึง "การตอบโตอยางสาหัสตอการที่ [CHI.GetNameDef] ปฏิเสธความรวมมือ" สงครามรอบใหมระหวาง [JAP.GetNameDef] และ [CHI.GetNameDef] ก็ดูจะเปนไปไดมากขึ้นทุกวัน\n\nสถานการณทางการทูตใกลถึงจุดเดือดในไมชา และ [JAP.GetNameDef] ก็ไมแสดงความสนใจที่จะคลี่คลายสถานการณเลย"
 news.231.a: "ผูรุกรานจักรวรรดินิยมอันโหดเหี้ยม!"
 news.231.b: "ความขัดแยงในจีนนาเปนหวง"
 news.232.t: "[GER.GetNameDefCap] แสวงหาการสนับสนุนจากสแกนดิเนเวีย"
 news.232.d: "[GER.GetLeader] กลาวถึง "ผลประโยชนทางการเมืองรวมกัน" และประกาศในวันนี้ถึงโครงการทางการทูตเพื่อปรับปรุงความสัมพันธระหวาง [GER.GetNameDef] กับชาติสแกนดิเนเวีย\nขั้นแรกคือการจัดตั้งคณะผูแทนทางการทูตถาวรใน [DEN.GetNameDef] ซึ่งจะทําใหมั่นใจวาจะไมเกิดความขัดแยงระหวางสองประเทศ\n\nตามคํากลาวของ [GER.GetLeader] รัฐบาล[DEN.GetAdjective]ไดตอบรับการยื่นมือทางการทูตนี้อยางยินดี\n\nนักการทูต[DEN.GetAdjective]ไมไดใหความเห็นใด ๆ"
 news.232.a: "ผูกมิตรยอมดีกวาสรางศัตรู..."
 news.232.b: "พวกเขาคิดจริง ๆ หรือวาปานนี้จะหาพันธมิตรใหมได?"
 news.232.c: "เราควรจับตาสถานการณนี้ไว"
 news.233.t: "ผลประโยชนของ[GER.GetAdjective]ในสแกนดิเนเวีย"
 news.233.d_war: "[GER.GetNameDefCap] มีผลประโยชนทางยุทธศาสตรที่ชัดเจนในสแกนดิเนเวีย ทั้งเพื่อเปนฐานปฏิบัติการทางทหารและเพื่อการนําเขาทรัพยากรธรรมชาติ ความขัดแยงที่บานปลายทําใหทรัพยากรใด ๆ ที่ขนสงผานทะเลบอลติกหรือทะเลเหนือเผชิญภัยคุกคามที่เปนรูปธรรมอยางยิ่ง\n\nดวยการขมขูทางการทูตตอ [DEN.GetNameDef] และ [NOR.GetNameDef] ที่ทวีความรุนแรงขึ้นเรื่อย ๆ ปฏิบัติการทางทหารของ[GER.GetAdjective]ในภูมิภาคนี้ดูจะเพิ่มขึ้นแน"
 news.233.d_no_war: "ในชวงไมกี่สัปดาหที่ผานมา วาทกรรมของ[GER.GetAdjective]ตอประเทศทางเหนือดุดันขึ้น สารนั้นชัดเจน: [DEN.GetNameDef] และ [NOR.GetNameDef] ตองไมขัดขวางการนําเขาของเยอรมนีไมวาในทางใด ไมวาจะดวยการตอตานหรือการนิ่งเฉย\n\nแมจะไมมีเหตุผลชัดแจงสําหรับขอเรียกรองเชนนี้ เพราะสินคานําเขายังไหลเขาเยอรมนีไดอยางเสรี แตนักการทูตของเรากังวลวานี่คือการโหมโรงกอนที่[GER.GetAdjective]จะลงมือในภูมิภาค"
 news.233.a: "นี่ไมใชลางดีเลย"
 news.233.b: "เราตองพิจารณาทางเลือกของเรา"
 news.233.c: "เราจะดูวาสถานการณจะพัฒนาไปอยางไร"
 news.234.t: "แรงกดดันของ[GER.GetAdjective]ตอเบเนลักซ"
 news.234.d: "หลังสงครามกับฝรั่งเศสปะทุขึ้น เยอรมนีไดกดดันทางการทูตตอประเทศในเบเนลักซหนักกวาที่เคย อยางไรก็ตาม ดวยการหนุนหลังของ[FRA.GetAdjective]และ[ENG.GetAdjective] พวกเขาจึงไมยอมจํานนตอแรงกดดัน\n\nมีเหตุใหเชื่อวาหาก [GER.GetNameDef] ไมไดสิ่งที่ตองการดวยการทูต พวกเขาจะใชกําลังเขายึด"
 news.234.a: "อีกแลวเหรอ!"
 news.234.b: "ตองกัน [GER.GetNameDefCap] ไวใหได!"
 news.234.c: "นั่นคงเปนการโจมตีที่กาวราว"
 news.235.t: "แชปลินถูกจับกุมในแคลิฟอรเนีย"
 news.235.d: "วันนี้มีขาวดีสําหรับ [GER.GetLeader] เมื่อพบตัวดาราภาพยนตรคนโปรดของเขา ชารลี แชปลิน หนึ่งเดียวไมมีใครเหมือน ในแคลิฟอรเนีย ขณะกําลังหลบหนีไปยังชนบท เขาถูกหนวยลาดตระเวน[GER.GetAdjective]เรียกตรวจ ซึ่งจําเขาไดทันทีจากหนวดอันเปนเอกลักษณ หลังจากใหเขาแสดงบทพูดปดทายจากผลงานชิ้นเอก "The Great Dictator" อีกครั้ง นักแสดงผูทรงเกียรติก็ถูก 'โนมนาว' ใหติดตามไปใหความบันเทิงแกทหาร[GER.GetAdjective]ที่ประจําการในภูมิภาค\n\nบัดนี้เขากําลังจะถูกสงตัวไปเบอรลิน ที่ซึ่ง [GER.GetLeader] จะไดพบฮีโรของเขาเสียที แมความเห็นตางทางการเมืองอาจทําใหการพบกันกรอยลงบาง แต [GER.GetLeader] ก็รอคอยชวงเวลานั้นอยางตื่นเตนราวกับเด็ก"
 news.235.a: "เขาจะไดรับการตอนรับสมกับเปนวีรบุรุษอเมริกัน!"
 news.236.t: "การประชุมยัลตา"
 news.236.d: "เมื่อเห็นวาชัยชนะรวมกันเหนือ [GER.GetNameDef] เปนสิ่งที่หลีกเลี่ยงไมได [yalta_origin.GetNameDef] และ [yalta_partner.GetNameDef] จึงหวังจะวางรากฐานเสถียรภาพของยุโรปในอนาคต [yalta_origin.GetLeader] [yalta_partner.GetLeader] และผูนําประเทศอื่น ๆ ที่รวมทําสงครามไดพบกันเพื่อตกลงชะตากรรมของ [GER.GetNameDef]\n\nการเจรจาหลายวันนําไปสูการวาดแผนที่ยุโรปใหม ระเบียบใหมแหงยุโรปนี้แบงตะวันออกและตะวันตกออกจากกันดวยบาดแผลที่กําลังจะถูกกรีดผานใจกลางของ [GER.GetNameDef]\n\nยังตองรอดูวาสิ่งนี้จะนําไปสูสันติภาพที่ยั่งยืนในยุโรปไดจริงหรือไม"
 news.236.a: "อยาเพิ่งนับไกกอนไขฟก"
 news.236.b: "เราเรียกรองในสิ่งที่เห็นวาถูกตอง"
 news.236.c: "เรามายุติสงครามนี้ใหเร็วที่สุดเถิด"
 news.236.e: "นี่อาจเปนจุดจบของ [GER.GetNameDef]"
 news.237.t: "อันชลุสสออสเตรีย"
 news.237.d: "หลังจากพรรคนาซีทองถิ่นใน [From.Root.GetNameDef] กอรัฐประหารสําเร็จ ทหารเยอรมันก็ขามพรมแดนเขายึดครองประเทศ \n\nทหารเยอรมันไดรับการตอนรับจากฝูงชนที่โหรองยินดีในเมืองตาง ๆ ขณะเรงรุดผานประเทศเพื่อไปสมทบกับชาว[From.Root.GetAdjective]ที่กําลังสูรบในสงครามกลางเมืองที่ยังดําเนินอยู [GER.GetLeader] ประกาศอันชลุสสออสเตรีย และยํ้าวา:\n\n'การตอสูของประชาชนจะสิ้นสุดลงในไมชา! จังหวัดตะวันออกที่เกาแกที่สุดของชนชาติเยอรมัน นับจากนี้ไปจะเปนปอมปราการใหมลาสุดของ [GER.GetNameDef]!'"
 news.237.a: "หากนั่นคือสิ่งที่พวกเขาตองการ..."
 news.237.b: "ยินดีตอนรับสูไรช!"
 news.237.c: "เราตองรักษาพรมแดนทางเหนือของเราไว!"
 news.237.e: "นี่เปนการละเมิดสนธิสัญญาแวรซาย!"
 news.238.t: "[AST.GetNameDefCap] รับผิดชอบดินแดนอาณานิคม"
 news.238.d: "\nเพื่อรับมือกับภัยคุกคามที่เพิ่มขึ้นตอดินแดน[ENG.GetAdjective]ในเอเชียตะวันออกเฉียงใต ดินแดนอาณานิคมสิงคโปรและบอรเนียวจึงถูกโอนใหแก [AST.GetNameDef] ดวยเปาหมายที่จะเปนแนวปองกันดานแรกและดีที่สุดของเครือจักรภพในแปซิฟก [AST.GetNameDef] จึงรับผิดชอบการเตรียมการทางทหารและการบริหารทั้งหมดในกรณีที่เกิดการสูรบในภูมิภาค\n\nเห็นไดชัดวามุงรับมือความทะเยอทะยานแหงจักรวรรดิของ [JAP.GetNameDef] [AST.GetNameDef] จะไมตองพึ่งพาความพยายามของอดีตเจาอาณานิคมทั้งหมดในการปกปองชายฝงของตนจากการรุกรานอีกตอไป"
 news.238.a: "ยุทธศาสตรที่นาสนใจ"
 news.238.b: "หวังวา [AST.GetNameDef] จะรูวากําลังทําอะไรอยู"
 news.238.c: "ในที่สุดเราก็มีวิถีทางที่จําเปนในการปกปองทวีปแลว"
 news.238.e: "พวกเขาเชื่อจริง ๆ หรือวามันจะสรางความแตกตางได?"
 news.239.t: "[AST.GetNameDefCap] เขารวม [SOV.GetFactionName]"
 news.239.d: "ดวยมองวาประเทศของตนเปน "พันธมิตรโดยธรรมชาติในการเผยแพรการปฏิวัติ" [AST.GetLeader] และ [SOV.GetLeader] จึงลงนามในสนธิสัญญาที่ทําให [AST.GetNameDef] เขาเปนหนึ่งในสมาชิกหลักของ [SOV.GetFactionName]\n[AST.GetNameDef] ไดรับการประกาศใหเปนแบบอยางอันโดดเดนของรัฐกรรมกร โดยประชาชนและเพื่อประชาชน มิใชเพื่อเจาอาณานิคมแหงยุโรป\n\nดวยพัฒนาการลาสุดในการเมือง[AST.GetAdjective] บางคนอาจกลาววาการเคลื่อนไหวนี้เปนสิ่งที่หลีกเลี่ยงไมได ถึงกระนั้น ก็ถือเปนเรื่องนากังวลอยางยิ่งในหมู "เจาอาณานิคมแหงยุโรป" เหลานั้นเอง และผูใดก็ตามที่ตอตานการแผอํานาจอยางไรขีดจํากัดของคอมมิวนิสตและการปฏิวัติโลกของพวกเขา"
 news.239.a: "นาวิตกอยางยิ่ง"
 news.239.b: "เราอาแขนตอนรับสหายสังคมนิยมของเรา!"
 news.239.c: "เราคือแนวหนาแหงความยุติธรรมและความเปนธรรม!"
 news.239.e: "หนูอีกฝูงขึ้นเรือที่เรากําลังจะจม"
 news.240.t: "สนธิสัญญาจายาปูรา"
 news.240.d: "วันนี้รัฐบาล[AST.GetAdjective]และ[HOL.GetAdjective]ประกาศ "สนธิสัญญาความรวมมือและการปองกันรวม" ซึ่งจะนําดินแดนอาณานิคม[HOL.GetAdjective]ในเอเชียตะวันออกเฉียงใตมาอยูใตการคุมครองของกองทัพ[AST.GetAdjective] สนธิสัญญาลงนามโดยผูสําเร็จราชการชาวดัตชแหงอินโดนีเซียและ [AST.GetLeader] ซึ่งประกาศวาขอตกลงนี้จะครอบคลุมการบริหารอาณานิคมทั้งหมด เนื่องจาก "สถานการณในยุโรปที่หางไกลและยากลําบาก"\n\nรัฐบาล[HOL.GetAdjective]ยังไมไดออกแถลงการณใด ๆ เกี่ยวกับสนธิสัญญานี้"
 news.240.a: "เรื่องนี้นาประหลาดใจ"
 news.240.b: "คนเรายอมทําสิ่งที่จําเปนเพื่อความอยูรอด"
 news.240.c: "[AST.GetNameDefCap] เฝาระวังแปซิฟก"
 news.241.t: "[NZL.GetNameDefCap] ยอมอยูใตอิทธิพลของ[AST.GetAdjective]"
 news.241.d: "หลังการสถาปนารัฐกรรมกรสังคมนิยมในออสเตรเลีย รัฐบาล[AST.GetAdjective]ก็กําลังแผอิทธิพลในภูมิภาค โดยอางเสียงเรียกรองของชาวนาและกรรมกรโรงงานที่ถูกกดขี่ใน [NZL.GetNameDef] [AST.GetNameDef] ไดกดดันรัฐบาล[NZL.GetAdjective]ใหเขารวม "สหภาพประชาชน" แหงแปซิฟกใต\n\nเมื่อเห็นวาตนถูกลอมไว และแทบไมมีความหวังวาจะไดรับความชวยเหลือจาก [ENG.GetFactionName] ทันเวลา [NZL.GetNameDef] จึงยอมตามขอเรียกรอง แม [AST.GetLeader] จะประกาศ "ความเทาเทียมของทุกรัฐในฐานะสวนขยายของความเทาเทียมของทุกคน" แตก็แทบไมมีขอสงสัยวารัฐใดเปนผูกุมบังเหียน"
 news.241.a: "สถานการณในแปซิฟกกําลังเปลี่ยนไป"
 news.241.b: "เราไมมีทางเลือก ดังนั้น... เพื่อการปฏิวัติ"
 news.241.c: "ขอฟงเสียงพวกคุณพูดวา "เพื่อการปฏิวัติ!""
 news.242.t: "[AST.GetNameDefCap] เขาควบคุมอาณานิคมในเอเชียตะวันออกเฉียงใต"
 news.242.d: "\nหลักนิยมทางทหารของ [ENG.GetNameDef] ประสบปญหาเรื่องการปองกันในเอเชียตะวันออกเฉียงใตมาชานาน บัดนี้พวกเขาหวังวาปญหาจะจบลง เมื่อ [AST.GetNameDef] รับผิดชอบการปองกันสิงคโปรและบอรเนียว เพื่อรับมือกิจกรรมทางทหารของฝายศัตรูในภูมิภาค\n\nการถายโอนอํานาจนี้รวมถึงการบริหารพลเรือนของดินแดนอาณานิคมดวย อยางนอยก็ในระยะนี้ เพื่อให [AST.GetNameDef] ดําเนินมาตรการใด ๆ ที่จําเปนในการปกปองทวีปของตนจากการโจมตีจากโพนทะเล ผลกระทบทางการเมืองของการเคลื่อนไหวนี้ตอ [ENG.GetNameDef] [AST.GetNameDef] และ [MAL.GetNameDef] ยังไมแนชัด"
 news.242.a: "สิ่งนี้เปลี่ยนดุลอํานาจในเอเชียตะวันออกเฉียงใต"
 news.242.b: "หวังวา [AST.GetNameDef] จะไมทําเรื่องนี้พัง"
 news.242.c: "ยอดเยี่ยม! ทุกอยางเปนไปตามแผน"
 news.243.t: "[AST.GetNameDefCap] และ [JAP.GetNameDef] ประกาศเปนพันธมิตร"
 news.243.d: "ดวยความสําเร็จลาสุดของ [AST.GetNameDef] และ [JAP.GetNameDef] ในเอเชียตะวันออกและแปซิฟก ผูสังเกตการณจํานวนมากคาดวาเปนเพียงเรื่องของเวลากอนที่สองจักรวรรดิที่กําลังเติบโตจะปะทะกัน อยางไรก็ตาม ทั้งสองประเทศกลับบรรลุขอตกลงความรวมมือ ซึ่งถูกขนานนามอยางรวดเร็ววา "ปราการแปซิฟก"\nไมมีประเทศใดเผยแพรสนธิสัญญานี้ จึงยังไมทราบรายละเอียดหลายดานของขอตกลง สิ่งที่แนนอนคือทั้งสองฝายสัญญาวาจะใหการสนับสนุนทางทหารแกกันเพื่อ "ตานการรุกคืบของคนนอกผูละโมบในภูมิภาคของเราแตละฝาย"\n\nยังเร็วเกินไปที่จะบอกวาระเบียบโลกที่ [JAP.GetNameDef] และ [AST.GetNameDef] วาดภาพไวเปนอยางไร แตไมตองสงสัยเลยวาบัดนี้ [AST.GetFactionName] คือกําลังที่ครองความเปนใหญในแปซิฟก"
 news.243.a: "นาวิตกอยางนอยที่สุด"
 news.243.b: "[Root.GetNameDefCap] ยินดีรวมมือกับทุกคนที่ไมขวางทางเรา"
 news.243.c: "นี่เปนความรวมมือที่ยอดเยี่ยม อยางนอยก็ในตอนนี้"
 news.244.t: "[AST.GetNameDefCap] สถาปนาเขตอิทธิพล"
 news.244.d: "ดวยการเคลื่อนไหวที่แทบไมมีผูสังเกตการณคนใดแปลกใจ [AST.GetNameDef] ไดประกาศจัดตั้งองคการสนธิสัญญาอิสระของตนเอง [AST.GetLeader] ประกาศวา [AST.GetNameDef] จะแสวงหาพันธมิตรเพื่อรักษาเสถียรภาพในภูมิภาคเอเชียตะวันออกเฉียงใต-แปซิฟกและพื้นที่อื่น ๆ และหากจําเปนก็เพื่อตานการรุกรานตอรัฐ[AST.GetAdjective]และรัฐอื่น ๆ\n\nดวยการเคลื่อนไหวลาสุดที่หางออกจากสายสัมพันธกับเครือจักรภพ นี่จึงดูเปนกาวตอไปโดยธรรมชาติ ขณะที่ [AST.GetNameDef] มุงหมายจะเปนนายแหงชะตากรรมของตนแตเพียงผูเดียว"
 news.244.a: "พวกเขากําลังเดินเกมเพื่อครองความเปนใหญ"
 news.244.b: "หลังบานของเราจะไมถูกปกครองโดยชาวยุโรป!"
 news.245.t: "[USA.GetNameDefCap] เขารวมแผนริเริ่มการปองกันของ[AST.GetAdjective]"
 news.245.d: "\nดวยความกังวลตอความสําคัญทางยุทธศาสตรที่เพิ่มขึ้นของแปซิฟก [AST.GetNameDef] และ [USA.GetNameDef] จึงลงนามสนธิสัญญาความรวมมือแปซิฟก แมจะมุงรักษาเสถียรภาพทางการเมืองของภูมิภาค และโดยสวนขยายคือการเดินเรือขามแปซิฟก แตสนธิสัญญายังรวมถึงแผนสํารองเพื่อการปองกันทางทหาร ซึ่งทําใหสองประเทศแผอํานาจไดไกลเกินกวาดินแดนที่อางสิทธิ์จริงมาก\n\nเมื่อพื้นที่กวางใหญถึงเพียงนี้อยูใต "การคุมครอง" ของออสเตรเลีย-อเมริกา ก็คงเปนเพียงเรื่องของเวลากอนที่แผนสํารองเหลานั้นจะถูกนํามาทดสอบ"
 news.245.a: "การเคลื่อนไหวที่นาทึ่ง..."
 news.245.b: "สิ่งนี้จะรับประกันสถานะของเราในฐานะมหาอํานาจผูครองแปซิฟก"
 news.245.c: "เราจะรวมกันรักษาเสถียรภาพทั่วครึ่งโลก"
 news.246.t: "[USA.GetNameDefCap] และ [CAN.GetNameDef] ทําพันธมิตรอยางเปนทางการ"
 news.246.d: "หลังรวมมือกันมาระยะหนึ่งผานคณะกรรมการปองกันรวม ความเปนหุนสวนทางการเมืองใหมก็กอตัวขึ้นระหวาง [USA.GetNameDef] และ [CAN.GetNameDef] ภายใตชื่อ [CAN.GetFactionName] โครงการนี้มุงสงเสริมผลประโยชนของอเมริกาเหนือในการตางประเทศทุกดาน รวมถึงเรื่องการปองกันและปฏิบัติการทางทหารทั้งหมด\n\nขณะที่ [CAN.GetNameDef] ยังคงคนหาตัวตนหลังยุคอาณานิคม และนักการเมือง[USA.GetAdjective]แทบจะหํ้าหั่นกันเองเรื่องนโยบายโดดเดี่ยวกับนโยบายแทรกแซง พันธมิตรที่เพิ่งกอตั้งนี้อาจใหทิศทางนโยบายตางประเทศที่ทั้งสองประเทศขาดแคลนอยางยิ่ง"
 news.246.a: "พวกเขาจะมองไปที่ทวีปอเมริกา หรือไกลกวานั้น?"
 news.246.b: "พี่นองรวมแผนดิน พี่นองรวมรบ!"
 news.246.c: "บัดนี้ไมมีภัยคุกคามในบานอีกแลว"
 news.247.t: "[CAN.GetNameDefCap] เขารวมพันธมิตรที่[GER.GetAdjective]นํา!"
 news.247.d: "หลังการเจรจาอยางรวดเร็ว [CAN.GetNameDef] ประกาศวาไดลงนามเปนสมาชิกของ [GER.GetFactionName] รัฐบาล[CAN.GetAdjective]ประกาศตนเปน "ผูพิทักษชาว[GER.GetAdjective]อยางภาคภูมิ เชนเดียวกับที่ [GER.GetNameDef] จะเปนผูพิทักษชาว[CAN.GetAdjective]"\n\nแมจะไมทราบรายละเอียดการเขารวมสนธิสัญญาของ [CAN.GetNameDef] แตดูเหมือนวาการสูรบกับศัตรูของ [GER.GetNameDef] จะเริ่มขึ้นในไมชา นี่อาจเปนชวงเวลาชี้ขาดของสงครามเลยทีเดียว"
 news.247.a: "พัฒนาการที่นาตกตะลึง!"
 news.247.b: "เราจะชวยเหลือพันธมิตรของเราในยุโรป!"
 news.247.c: "ชนชาติพี่นองยืนหยัดเคียงขางกัน!"
 news.247.e: "ไอพวก[CAN.GetAdjective]ที่โลเลพวกนั้น!"
 news.248.t: "[ENG.GetNameDefCap] ยอมสละดินแดนทางตะวันออกเฉียงเหนือ"
 news.248.d: "\nหลังแรงกดดันทางการทูตที่เพิ่มขึ้นจาก [CAN.GetNameDef] [ENG.GetNameDef] ไดยกดินแดนแลบราดอรและนิวฟนดแลนดใหแกรัฐ[CAN.GetAdjective] การ "รวมดินแดน[CAN.GetAdjective]โดยชอบธรรมทั้งหมดเปนหนึ่งเดียว" เปนเปาหมายของนักการเมือง[CAN.GetAdjective]มาชานาน และบัดนี้เปาหมายนั้นก็ใกลความจริงเขาไปอีกขั้น\n\nแนนอนวายังมีคําถามที่ไมมีใครตอบ วาดินแดนใดบางที่นับเปน "ของ[CAN.GetAdjective]โดยชอบธรรม" นับจากนี้ไปทั้ง [ENG.GetNameDef] และทั้งทวีปอเมริกาเหนือคงตองนอนลืมตาขางหนึ่ง"
 news.248.a: "[ENG.GetNameDefCap] ไมมีที่มั่นในอเมริกาเหนืออีกตอไป..."
 news.248.b: "ทุกอยางเปนไปอยางที่ควรเปน"
 news.248.c: "ชิ เอากอนหินบานนอกพวกนั้นไปเลย!"
 news.249.t: "[CAN.GetNameDefCap] และ [MEX.GetNameDef] รวมพลัง!"
 news.249.d: "เชานี้นักการเมือง[USA.GetAdjective]ตื่นมาพบขาวนากังวล เมื่อ [CAN.GetNameDef] และ [MEX.GetNameDef] ประกาศสนธิสัญญาปองกันฉบับใหม ที่มุง "ตอบโตและสกัดกั้นภัยคุกคามเฉพาะหนาตออธิปไตยของทั้งสองประเทศ" การขมขูที่แทบไมไดปดบังนี้แทบไมอาจอําพรางเจตนาที่จะขัดขวางปฏิบัติการทางทหารของ [USA.GetNameDef] ในทวีปอเมริกาและอาจไกลกวานั้นไดเลย\n\nนักวิจารณการเมืองเปรียบสถานการณนี้กับยุโรปกอนมหาสงคราม สองฝายที่ตางมีทุกอยางใหสูญเสีย และไมมีทางผอนคลายความตึงเครียด คําถามดูจะไมใชวาใครเปนภัยตอใครมากกวา แตเปนวาฝายใดจะชิงลงมือโจมตีกอน"
 news.249.a: "เราเคยเห็นแบบนี้มาแลว มันจบลงไดแคดวยนํ้าตา"
 news.249.b: "กองทัพแหงเหนือจะพรอม"
 news.249.c: "กองทัพแหงใตจะพรอม"
 news.249.e: "เราตองหาทางตอบโตการเคลื่อนไหวนี้โดยเร็ว"
 news.250.t: "สงครามกลางเมืองใน [MEX.GetNameDef]!"
 news.250.d: "ความไรเสถียรภาพของการเมือง[MEX.GetAdjective]ตลอดไมกี่ปที่ผานมาไดปะทุเปนความขัดแยงทางอาวุธ! กองกําลังของพรรคซินารคิสตไดจับอาวุธ และการสูรบไดปะทุขึ้นบนทองถนนของเมืองใหญหลายแหงของ[MEX.GetAdjective]!\n\nแมจะเชื่อกันวารัฐบาลไดเปรียบอยางชัดเจนเหนือการลุกฮือใด ๆ แตก็มีขาวลือหนาหูวาฝายชาตินิยมไดรับการสนับสนุนจากตางชาติ เพื่อนบานใกลชิดตางเฝามองอยางกลั้นหายใจ ความขัดแยงนี้จะพาเม็กซิโกไปสูจุดใด มีเพียงเวลาเทานั้นที่จะบอกได"
 news.250.a: "ความขัดแยงที่นากังวลซึ่งอาจทําลายเม็กซิโกจนยอยยับ"
 news.250.b: "ตอนนี้เราแคตองทําใหแนใจวาฝายชาตินิยมจะยึดอํานาจได"
 news.250.c: "ราคาที่แพงลิบสําหรับประเทศของเรา แตก็ตองจาย"
 news.251.t: "[CAN.GetNameDefCap] แสวงหาการโอนรัฐธรรมนูญกลับคืนทันที"
 news.251.d: "\n\nหลังการเจรจากับเวสตมินสเตอรลมเหลวและการอภิปรายนานถึง 63 ชั่วโมงอยางไมเคยมีมากอน รัฐสภาแคนาดาไดยกเลิกพระราชบัญญัติอเมริกาเหนือของบริเตน และบัญญัติรัฐธรรมนูญแคนาดาไวในกฎหมายที่รัฐสภาหรือสถาบันกษัตริยอังกฤษไมอาจแตะตองได\nแมในตัวเองจะไมใชการเคลื่อนไหวตอตานอังกฤษ แตก็สงสัญญาณถึงการถอยหางจากนโยบายเครือจักรภพของจักรวรรดิเกา\n\nแมจะเปนกาวโดยธรรมชาติของประเทศใดก็ตามที่ตองการรักษาเสถียรภาพในอนาคต แตก็ไมไดชวยบรรเทาสภาพการเมืองโลกที่ตึงเครียดอยูแลวแตอยางใด"
 news.251.a: "ถาอยางนั้นก็ปลอยใหพวกเขาสูเองตามลําพัง"
 news.251.b: "[ENG.GetNameDefCap] ออนแอลงทุกวัน"
 news.251.c: "ทําไมตองมาเกิดตอนนี้ดวย?!"
 news.251.e: "จักรวรรดิที่กําลังแตกราวตามรอยตอ"
 news.251.f: "จากทะเลสูทะเล [CAN.GetNameDef] จะเปนเสรี!"
 news.252.t: "[CAN.GetNameDefCap] เขารวม [GER.GetFactionName]!"
 news.252.d: "ดวยมองวาเปนพันธมิตรโดยธรรมชาติ [GER.GetNameDef] และ [CAN.GetNameDef] จึงลงนามสนธิสัญญาปองกันรวมกัน นายกรัฐมนตรี[CAN.GetAdjective] [CAN.GetLeader] ประกาศพันธมิตรนี้ในสุนทรพจนที่กลาวถึงการสอดประสานกันโดยธรรมชาติของผลประโยชน[CAN.GetAdjective]และ[GER.GetAdjective]\n\nเมื่อพิจารณาการระดมพลที่เพิ่มขึ้นทั่วยุโรปและการที่ [CAN.GetNameDef] เพิ่งถอยหางจากเครือจักรภพ ก็ไมยากที่จะคาดเดาวากําลังหารือผลประโยชนประเภทใดกันอยู\nทั้งในยุโรปและทวีปอเมริกา มหาอํานาจเกาเฝามองดวยความกังวลที่เพิ่มขึ้น"
 news.252.a: "โลกกําลังหมุนไปในทางนี้..."
 news.252.b: "เราคือนํ้าหนักที่คํ้าจุนดุลอํานาจ"
 news.252.c: "เทานี้ดุลอํานาจก็เอียงมาทางเราแลว!"
 news.252.e: "อีกแนวรบหนึ่งที่ตองกังวล หากถึงขั้นทําสงคราม"
 news.252.f: "เราแข็งแกรงขึ้นเรื่อย ๆ!"
 news.253.t: "[AST.GetNameDefCap] ถอยหางจากเครือจักรภพ"
 news.253.d: "\nในสุนทรพจนเชานี้ นายกรัฐมนตรี [AST.GetLeader] ประกาศความมุงมั่นของรัฐบาลออสเตรเลียตอการเติบโตและเสถียรภาพในฐานะรัฐแหงโอเชียเนีย ซึ่งหมายถึงการมองหาชายฝงใหมนอกเหนือจากยุโรปของอังกฤษ เพราะชาวออสเตรเลียไมอาจแบกรับภาระความขัดแยงของตางชาติไวบนบาไดอีกตอไป [AST.GetLeader] อางถึงพระราชดํารัสของพระมหากษัตริยในพิธีเปดประชุมรัฐสภาครั้งลาสุดโดยตรง และยํ้าประเด็นดวยคําวา "จะไมมีกัลลิโพลีอีกแลว!"\n\nเสียงโหรองอยางกึกกองจากฝูงชนบงบอกวายุคใหมของการเมืองออสเตรเลียไดเริ่มขึ้นแลว จะไปจบที่ใด โลกไดแตเริ่มคาดเดา"
 news.253.a: "[Root.GetFactionName] จะตองอยูโดยไมมี [AST.GetNameDef]"
 news.253.b: "ดูจักรวรรดิลมสลายเปนชิ้น ๆ เถิด..."
 news.253.c: "พวกเขาเลือกที่จะเรียกรองเอกราชมากขึ้นตอนนี้เนี่ยนะ?"
 news.253.e: "เรื่องนี้จะสงผลกระทบใหญหลวงตอแปซิฟก"
 news.253.f: "เราจะเดินบนเสนทางของเราเอง!"
 news.254.t: "[AST.GetNameDefCap] และนิวซีแลนด "รวมเปนหนึ่ง""
 news.254.d: "[AST.GetNameDefCap] ซึ่งยืนยันเอกราชอยางสมบูรณ ไดเริ่มแผอิทธิพลในแปซิฟกใต โดยรัฐบาล[AST.GetAdjective]เรียกรองใหอดีตรัฐอาณานิคมทั้งหมดในโอเชียเนียมาอยูใตอํานาจของตน\n\nรัฐบาล[ENG.GetAdjective]และนิวซีแลนดที่ถูกบีบคั้นอยางหนักยอมไมเต็มใจ จึงตอตานทางการทูตในตอนแรก อยางไรก็ตาม เมื่อไมมีฐานใดสําหรับแผอํานาจของจักรวรรดิในภูมิภาค ซึ่งเปนบทบาทที่ออสเตรเลียเคยทําหนาที่ ก็เปนเพียงเรื่องของเวลากอนที่ [AST.GetNameDef] จะยื่นคําขาดที่มีกําลังทหารหนุนหลัง\nบัดนี้นิวซีแลนดเปนจังหวัดที่อยูตะวันออกสุดของ [AST.GetNameDef]"
 news.254.a: "เราควรจับตาสถานการณไว"
 news.254.b: "ก็สมควรแลว"
 news.254.c: "นี่คือการทรยศ!"
 news.260.t: "[SAF.GetNameDefCap] รับผิดชอบอาณานิคมในแอฟริกา"
 news.260.desc: "\nในพิธีอยางเปนทางการวันนี้ [SAF.GetLeader] ไดลงนามในสนธิสัญญาที่จะมอบอํานาจควบคุมดินแดนในปกครองของอังกฤษในแอฟริกาใหแกรัฐบาลของเขา ดินแดนเบชัวนาลันด โรดีเชีย และเคนยาจะไดรับการบริหารจากพริทอเรียนับจากนี้ \n\n[ENG.GetLeader] กลาวตอสภาสามัญปฏิเสธวาการเคลื่อนไหวนี้ไมไดทําใหสถานะของอังกฤษในทวีปออนแอลง แตเรียกวาเปน "การเปลี่ยนแปลงที่สมเหตุสมผลยิ่ง เพื่อใหการบริหารและการปองกันพื้นที่เหลานี้มีประสิทธิภาพมากขึ้น""
 news.260.a: "นาสนใจ"
 news.260.b: "สมเหตุสมผลจริง ๆ"
 news.260.c: "นี่คือจุดเริ่มตนของจุดจบแหงจักรวรรดิในแอฟริกาหรือไม?"
 news.261.t: "[ENG.GetNameDefCap] ปรับโครงสรางอาณานิคมในแอฟริกา"
 news.261.desc: "รัฐสภาอังกฤษผานมาตรการที่จะปรับโครงสรางอาณานิคมอังกฤษบางสวนในแอฟริกาอยางถึงราก ดวยคะแนนเสียงอยางหวุดหวิด กฎหมายใหมนี้แทบจะเปนการสรางระบอบอาณานิคมใหมสองแหงในรัฐโรดีเชียและเคนยา รัฐใหมเหลานี้จะมีอิสระในระดับหนึ่งในการจัดการกิจการของตนเอง แตก็ตองรับผิดชอบการปองกันตนเองดวย \n\nฝายอนุรักษนิยมบางสวนที่คัดคานการตัดสินใจนี้แสดงความกลัวอยางเปดเผยวา นี่เปนเพียงกาวแรกของกระบวนการที่พวกเขาเรียกวา 'การปลดปลอยอาณานิคม' \n\n[ENG.GetLeader] ยังไมไดใหความเห็นในทันที"
 news.261.a: "นาสนใจ"
 news.261.b: "ชางเปนการจัดการที่โงเขลา"
 news.261.c: "เห็นทีนั่นก็เปนวิธีหนึ่งในการขยายเครือจักรภพ"
 news.262.t: "สงครามกลางเมืองแอฟริกาใต"
 news.262.desc: "ความตึงเครียดที่คุกรุนมานานใน [SAF.GetName] ไดปะทุเปนสงครามเปดแลว ฝายชาตินิยมฟาสซิสตอางวานโยบายของรัฐบาลยูเนียนนิสตฝายประชาธิปไตยกําลังคุกคามวิถีชีวิตแบบ[SAF.GetAdjective] พวกเขากลาววาฝายยูเนียนนิสตแทงขางหลังเหลานักรบผูกลาแหงสงครามบัวรดวยการสนับสนุน [ENG.GetName] อยางไมมีเงื่อนไข \n\nรัฐบาลเฉพาะกาลฝายชาตินิยมภายใต [SAF.GetLeader] เรียกรองใหผูรักชาติที่แทจริงทุกคนเขารวมฟนฟูเสรีภาพใหแอฟริกาใตดวยกําลังอาวุธ รัฐบาลยูเนียนนิสตในพริทอเรียตีตราฝายชาตินิยมวาเปน "ผูกอการกบฏและคนทรยศชั้นเลวที่สุด" เมื่อกองทัพประกาศเขาขางทั้งสองฝายพอ ๆ กัน ความขัดแยงในแอฟริกาใตอาจใชเวลานานกวาจะยุติ"
 news.262.a: "บางทีเราควรพิจารณาสงความชวยเหลือไป"
 news.262.b: "เรื่องนี้กอตัวมานานแลว"
 news.262.c: "บางทีภัยคุกคามที่ใหญที่สุดอาจอยูภายในพรมแดนของเราเอง..."
 news.263.t: "การจลาจลตอตานสถาบันกษัตริยใน [SAF.GetNameDef]"
 news.263.desc: "คลื่นการชุมนุมตอตานสถาบันกษัตริย ซึ่งหลายครั้งกลายเปนความรุนแรง ไดโหมกระหนํ่าไปทั่วแอฟริกาใต ผูประทวงนับพันออกมาบนทองถนน บุกสถานีตํารวจและอาคารรัฐบาลอื่น ๆ พระบรมฉายาลักษณของพระมหากษัตริยถูกฉีกลง กรีด เผา และในครั้งหนึ่งถึงกับถูกละลายในกรด \n\nผูสังเกตการณระบุวาตํารวจและทหารลังเลอยางมากที่จะพยายามควบคุมการลุกฮือ และเลือกไปเฝาโรงงานและสะพานแทน ทําใหเกิดคําถามวาการจลาจลครั้งนี้เปนเรื่องที่รัฐบาลไมคาดคิดจริงหรือ"
 news.263.a: "การปฏิวัติกําลังกอตัว?"
 news.263.b: "ไมมีความเห็น"
 news.263.c: "บางทีภัยคุกคามที่ใหญที่สุดอาจอยูภายในพรมแดนของเราเอง..."
 news.264.t: "สหภาพประชาชนแอฟริกา"
 news.264.desc: "สมาชิกผูกอตั้ง [SAF.GetFactionName] ไดมาชุมนุมกันที่พริทอเรียเพื่อประกาศการกอตั้งพันธมิตรใหม ผูสังเกตการณชาวยุโรปตั้งขอสังเกตอยางรวดเร็ววารัฐบาลเดียวที่มีความชอบธรรมใด ๆ ที่อยู ณ ที่นั้นคือรัฐบาลของ [SAF.GetNameDef] เอง โดย [SAF.GetLeader] เปนประธานในที่ประชุมของรัฐบาลพลัดถิ่นที่ตั้งตัวเองขึ้นและกลุมปฏิวัติอื่น ๆ ที่ปะปนกันมั่วไปหมด\n\nฝายที่เขารวมไดออกปฏิญญารวม เรียกรองใหมหาอํานาจจักรวรรดิยุโรปคืนดินแดนใด ๆ ที่ยึดครองในแอฟริกาแกเจาของโดยชอบธรรมในทันที ประณามลัทธิลาอาณานิคม และปฏิญาณวาจะนําเสรีภาพมาสูชนชาติแอฟริกาที่ถูกกดขี่ ดวยวิธีการใดก็ตามที่จําเปน"
 news.264.a: "ชาวแอฟริกัน? ปกครองตัวเองเนี่ยนะ!?"
 news.264.b: "กาวแรกบนเสนทางสูเสรีภาพที่แทจริง"
 news.264.c: "มาดูกันวาอุดมคติของพวกเขาจะอยูรอดผานสงครามขางหนาไดหรือไม"
 news.264.d: "ยังไงพวกเขาก็ไมใชคอมมิวนิสตตัวจริงอยูดี"
 news.265.t: "แรงกดดันของ[SAF.GetAdjective]ตอฝรั่งเศส"
 news.265.desc: "หลังความพายแพอยางนาตกตะลึงที่ฝรั่งเศสประสบบนแผนดินแม ความชอบธรรมของจักรวรรดิอาณานิคมของฝรั่งเศสก็ถูกตั้งคําถาม รัฐบาลของ [SOV.GetNameDef] และ [SAF.GetNameDef] ไดออกแถลงการณรวมประกาศวาไมอาจไววางใจใหฝรั่งเศสรักษาความสงบเรียบรอยในมาดากัสการไดอีกตอไป และเรียกรองใหสงมอบเกาะนี้แก [SAF.GetNameDef] \n\nรัฐบาลฝรั่งเศสเสรีไดประชุมหารือประเด็นนี้ ผูเชี่ยวชาญดานการปองกันเห็นวาไมนาเปนไปไดที่กองกําลังฝรั่งเศสซึ่งรอยหรอจะสามารถปองกันเกาะได หากถึงขั้นทําสงคราม"
 news.265.a: "ก็แคฉลามที่ไดกลิ่นเลือดในนํ้า"
 news.265.b: "มาดูกันวาฝรั่งเศสจะมีเหตุผลหรือไม"
 news.265.c: "ฝรั่งเศสจบเหแลว"
 news.265.d: "ชัยชนะโดยไมเสียเลือดเนื้ออีกครั้งของคอมมิวนิสต"
 news.270.t: "กําเนิดยานเกราะ[NZL.GetAdjective]"
 news.270.desc: "รถถังบ็อบ เซมเพิลคันใหมของกองกําลังปองกันนิวซีแลนดที่แลนกระหึ่มไปตามถนนสายหลักของเมืองหลวง คือประจักษพยานที่แทจริงของความเฉลียวฉลาดและจิตวิญญาณนักสูของชาว[NZL.GetAdjective] ดวยปนกลหกกระบอกและเกราะเหล็กที่แทบจะแนนอนวากันกระสุนได มันอาจเปนอุปสรรคที่ใหญที่สุดที่ผูรุกรานคนใดก็ตองฝาฟน \n\nผูที่เรียกตัวเองวาผูเชี่ยวชาญบางคนชี้ถึงสมรรถนะที่ยํ่าแยและอาวุธที่ออนแอของยานคันนี้วาเปนเหตุผลที่ไมควรสราง แตดังที่นายกรัฐมนตรี [NZL.GetLeader] กลาวในพิธีรับมอบยานอยางเปนทางการ การปองกันราชอาณาจักรอยางทันทวงทีนั้นสําคัญยิ่ง จนไมอาจคาดหวังหรือเรียกรองยุทโธปกรณที่สมบูรณแบบได"
 news.270.a: "นี่นะหรือที่เรียกวารถถัง!"
 news.270.b: "พวกเขาเรียกไอนี่วาอะไรนะ?"
 news.271.t: "บิ๊กบ็อบปรากฏตัว"
 news.271.desc: "หลังความสําเร็จอยางนาทึ่งของรถถังบ็อบ เซมเพิล กองบัญชาการระดับสูงของกองกําลังปองกัน [NZL.GetName] ไดขอใหผลิตรุนที่ขยายขนาดขึ้น ดวยความสูงกวา 15 ฟุต และนํ้าหนักไมตํ่ากวา 120 ตัน ยานใหมนี้นาเกรงขามในทุกความหมายของคํา อาวุธประกอบดวยปนตอสูรถถังขนาด 17 ปอนดแฝดที่จะจัดการศัตรูใด ๆ ไดอยางงายดาย สวนเกราะหนาซึ่งผานการทดสอบอยางละเอียดเพื่อใหแนใจวากันกระสุนไดจริง ๆ จะทําใหมันบุกเขากลางสมรภูมิไดอยางไมหวั่นเกรง \n\nในพิธีเปดตัว ผูสังเกตการณคนหนึ่งเรียกมันวา "รถถังที่นาทึ่งที่สุดเทาที่เคยผลิตมา" ขณะที่อีกคนเรียกวา "ไมมีอะไรเทียบได" \nคาดวาจะเริ่มการผลิตจํานวนมากภายในเดือนนี้"
 news.271.a: "โลกสั่นสะทานเมื่อเห็นรถถังของเรา!"
 news.271.b: "โลกสั่นสะทาน...ดวยเสียงหัวเราะ"
 news.272.t: "ทุพภิกขภัยเบงกอลอุบัติขึ้น"
 news.272.desc: "ภัยธรรมชาติ การบริหารที่ไรความสามารถ และความพินาศจากสงคราม ไดรวมกันกอใหเกิดทุพภิกขภัยครั้งใหญในอินเดีย\n\nหลังพายุไซโคลนที่ทําลายพื้นที่สวนใหญและกวาดผลผลิตขาวไปเกือบทั้งหมด เจาหนาที่ปกครองอาณานิคมกลับแกปญหาอยางเชื่องชา บางคนอาจบอกวาเชื่องชาอยางนาสงสัย แมพื้นที่อื่นของอินเดียจะมีอาหารเหลือเฟอ แตก็ไมมีการขนสงความชวยเหลือใด ๆ ดวยเกรงวาจะตกไปอยูในมือศัตรู\n\nพื้นที่สวนใหญถูกทําลายยอยยับ และยังไมอาจประเมินความสูญเสียทั้งชีวิตและผลผลิตไดเลย"
 news.272.a: "นาสยดสยอง"
 news.272.b: "เลวรายนัก"
 news.272.c: "ไมมีอะไรที่ทําได"
 news.273.t: "ทุพภิกขภัยเบงกอลสิ้นสุดลง"
 news.273.desc: "หลังจากแทบไมไดทําอะไรมาหลายเดือน ในที่สุดรัฐบาลอาณานิคมและกองทัพอินเดียก็ตัดสินใจลงมือ การแจกจายเสบียงอาหารฉุกเฉินเริ่มไปถึงพื้นที่ที่ไดรับผลกระทบ ขณะที่ผลผลิตขาวฤดูใหมก็เกินความคาดหมาย \n\nอยางไรก็ตาม ราคาอาหารในพื้นที่ที่ไดรับผลกระทบยังคงสูง และยังไมอาจประเมินผลกระทบระยะยาวของทุพภิกขภัยได"
 news.273.a: "อยางนอยมันก็จบแลว"
 news.273.b: "เสียที"
 news.280.t: "อินเดียไดรับสิทธิปกครองตนเอง"
 news.280.desc: "หลังการพบปะอันตึงเครียดระหวางเอกอัครราชทูต[GER.GetAdjective]กับรัฐมนตรีวาการกระทรวงการตางประเทศ[ENG.GetAdjective] วันนี้รัฐบาล [ENG.GetNameDef] ประกาศวา [RAJ.GetNameDef] จะไดรับอนุญาตใหกําหนดนโยบายของตนเองนับจากนี้ การปกครองอนุทวีปของอังกฤษตลอดหลายศตวรรษจึงสิ้นสุดลงอยางรวดเร็วจนนาประหลาดใจ เมื่อขาราชการถูกสั่งใหกลับบาน และการบริหารอาณานิคมถูกสงมอบใหชาวอินเดียพื้นเมือง\n\nหนึ่งในการกระทําแรก ๆ ของผูนําอินเดียชุดใหมคือการประกาศสนธิสัญญาความรวมมืออยางกวางขวางกับ [GER.GetNameDef] รัฐบาลอินเดียปฏิเสธที่จะใหความเห็นตอขอกลาวหาวานี่คือราคาที่ตองจายเพื่อแลกกับการสนับสนุนจากเยอรมนี"
 news.280.a: "ยอดเยี่ยม"
 news.280.b: "นี่คือจุดจบของจักรวรรดิบริติชหรือ?"
 news.280.c: "พันธมิตรที่มีคา"
 news.280.d: "ไมใชชวงเวลาที่รุงโรจนที่สุดของเรา"
 news.281.t: "อินเดียไดรับสิทธิปกครองตนเอง"
 news.281.desc: "ในแถลงการณรวม รัฐมนตรีวาการกระทรวงการตางประเทศ[ENG.GetAdjective]ซึ่งดูหวั่นไหวอยางเห็นไดชัด รวมกับเอกอัครราชทูต[SOV.GetAdjective] ประกาศวาอินเดียจะไดรับอํานาจอธิปไตยเต็มที่เหนือกิจการของตนในทันที ยังไมชัดเจนนักวา [SOV.GetNameDef] มีบทบาทอยางไรในการทําใหนโยบาย[ENG.GetAdjective]เปลี่ยนไปอยางกะทันหันนี้ แตดูเหมือนจะมีบทบาทไมนอย\n\nหนึ่งในการกระทําแรก ๆ ของผูนําอินเดียชุดใหมคือการประกาศความรวมมือที่ใกลชิดขึ้นกับ [SOV.GetNameDef] ซึ่งยิ่งเพิ่มนํ้าหนักใหขาวลือวา [SOV.GetNameDef] เขาแทรกแซงเพื่อพวกเขา"
 news.281.a: "ยอดเยี่ยม"
 news.281.b: "นี่คือจุดจบของจักรวรรดิบริติชหรือ?"
 news.281.c: "พันธมิตรที่มีคา"
 news.281.d: "ไมใชชวงเวลาที่รุงโรจนที่สุดของเรา"
 news.282.t: "ขบวนการออกไปจากอินเดีย"
 news.282.desc: "เสียงเรียกรองเอกราชของอินเดียทวีความเขมขนขึ้นในระยะหลัง บัดนี้สถานการณมาถึงจุดแตกหัก เมื่อขบวนการออกไปจากอินเดียฝายหัวรุนแรงเรียกรองให [ENG.GetNameDef] ออกไปจากประเทศโดยเร็วที่สุด อยางไรก็ตาม ทางการ[ENG.GetAdjective]ตอบโตอยางรวดเร็วและปราบปรามขบวนการ จับกุมแกนนําหลายคนในการบุกคนบานยามรุงสางทั่วอินเดีย \n\nแตรายงานที่หนวยสันติบาลจัดทําขึ้นระบุวาผูเห็นใจจํานวนมากยังลอยนวลอยู และขาราชการหลายคนแสดงความกังวลวากลุมหัวรุนแรงยิ่งกวาในขบวนการอาจถึงขั้นหันไปใชความรุนแรง"
 news.282.a: "อนาคตยังคงไมแนนอน"
 news.282.b: "อีกหนึ่งความพยายามเพื่อเสรีภาพที่ถึงคราวลมเหลว"
 news.283.t: "พรรคคองเกรสแหงชาติอินเดียชนะการเลือกตั้งระดับมณฑล"
 news.283.desc: "\nในการเลือกตั้งทองถิ่นครั้งลาสุด พรรคคองเกรสแหงชาติอินเดียไดเสียงขางมากอยางทวมทนดวยนโยบายเปลี่ยนผานอยางคอยเปนคอยไปและเปนระเบียบสูการปกครองทองถิ่นและสถานะประเทศในเครือจักรภพในอนาคต \n\nดูเหมือนชาวอินเดียจะปฏิเสธนโยบายที่ถึงรากกวาซึ่งคานธีสนับสนุน ผูซึ่งเรียกรองใหตัดขาดจากอังกฤษโดยสิ้นเชิงและปกครองตนเองอยางสมบูรณโดยเร็วที่สุด"
 news.283.a: "พวกเขาจะนําเราสูเสรีภาพ"
 news.283.b: "การลงคะแนนเสียงเปลี่ยนแปลงอะไรไดจริงหรือ?"
 news.284.t: "ขบวนการสวราชไดคะแนนเพิ่มในการเลือกตั้งระดับมณฑล"
 news.284.desc: "\nขาราชการอังกฤษตื่นมาพบความตกตะลึงในเชานี้เมื่อผลการเลือกตั้งระดับมณฑลครั้งลาสุดออกมา บัดนี้ชัดเจนแลววาชาวอินเดียสวนใหญไดลงคะแนนใหผูสมัครที่สนับสนุนสวราช ในมณฑลตาง ๆ ทั่วอินเดีย เริ่มมีเสียงเรียกรองใหเปลี่ยนการปกครองทองถิ่นอันจํากัดนี้เปนการปกครองตนเองอยางสมบูรณโดยเร็วที่สุด \n\nโฆษกรัฐบาล[ENG.GetAdjective]ยํ้าวาขณะนี้ไมใชเวลาที่จะหารือมาตรการเชนนั้น และการโอนอํานาจเพิ่มเติมใหชาวอินเดียเปนเรื่องที่เปนไปไมได"
 news.284.a: "เสรีภาพอยูแคเอื้อม"
 news.284.b: "อังกฤษไมมีวันยอมเรื่องนี้แน"
 news.285.t: "ปากีสถานเปนเอกราช"
 news.285.desc: "ตามทฤษฎีสองชาติ ชนกลุมนอยมุสลิมไดรับมาตุภูมิที่มีอํานาจอธิปไตยในพื้นที่ที่ชาวมุสลิมเปนประชากรสวนใหญ เดิมใชชื่อวาปากสถาน เพื่อแสดงการรวมกันของชาวปญจาบ อัฟกัน แคชเมียร สินธ และบาโลช ตอมาเปลี่ยนชื่อเปนปากีสถานเพื่อใหออกเสียงไดงายขึ้น\n\nอยางไรก็ตาม ความตึงเครียดระหวางอินเดียกับปากีสถานที่เพิ่งไดรับเอกราชยังคงอยู เพราะดินแดนชายแดนบางสวนถูกอางสิทธิ์โดยทั้งสองประเทศใหม ผูสังเกตการณบางคนถึงกับเตือนวาอาจเกิดสงครามครั้งใหมในอนุทวีป"
 news.285.a: "บางทีนี่อาจเปนหนทางเดียว"
 news.285.b: "เสรีภาพ!"
 news.285.c: "มาดูกันวาสันติภาพจะยืนยาวหรือไม"
 news.286.t: "ออสเตรเลียตัดสัมพันธกับอังกฤษ"
 news.286.desc: "\nในการลงมติที่มีการโตแยงอยางดุเดือด เสียงขางมากเพียงเล็กนอยในรัฐสภา[AST.GetAdjective]ตัดสินวาประเทศควรออกจากจักรวรรดิบริติช อํานาจทางกฎหมายของอังกฤษที่เหลืออยูเพียงนอยนิดถูกประกาศใหเปนโมฆะ [AST.GetLeader] ไดลงนามใหมติดังกลาวมีผลเปนกฎหมายแลว โดยขามธรรมเนียมทางกฎหมายที่มีมาชานานที่ผูสําเร็จราชการตองเปนผูใหความยินยอมในพระปรมาภิไธย และทําให [AST.GetNameDef] กลายเปนชาติที่มีอธิปไตยสมบูรณ\n\nรัฐสภายังลงมติจัดตั้งคณะกรรมาธิการรัฐธรรมนูญ ซึ่งจะหารือและใหคําแนะนําเรื่องการแกไขรัฐธรรมนูญเพื่อขจัดรองรอยการแทรกแซงของอังกฤษในกิจการ[AST.GetAdjective]ทั้งหมด"
 news.286.a: "ถึงตอนนี้ก็เปนเพียงพิธีการเทานั้น"
 news.286.b: "เสรีภาพ!"
 news.286.c: "ออสเตรเลียออกจากเครือจักรภพ"
 news.287.t: "เยอรมนียึดครองโปแลนดตะวันตก"
 news.287.desc: "ทหารเยอรมันไดยึดครองโปแลนดตะวันตก โดยอางอยางเปนทางการวาเพื่อปกปองชนกลุมนอยเยอรมันจากความโกลาหลหลังการลมสลายของรัฐบาลโปแลนด \n\nกองกําลังโซเวียตไดถอนตัวจากพื้นที่เหลานี้อยางเปนระเบียบ สงผลใหโปแลนดถูกแบงแยกระหวางสองมหาอํานาจโดยปริยาย"
 news.287.a: "ฟงดูนาเชื่อเหลือเกิน!"
 news.287.b: "สักวันเราจะเอาสวนที่เหลือมาดวย..."
 news.287.c: "พวกฟาสซิสตรุกคืบ อยางนอยก็ในตอนนี้"
 news.288.t: "แนวรวมจีนกอตั้งขึ้น"
 news.288.desc: "[CHI.GetLeader] และ [PRC.GetLeader] ออกประกาศรวมกันวาไดวางความขัดแยงไวกอนเมื่อเผชิญการโจมตีของญี่ปุน ทั้งสองฝายจะยึดถือนโยบายไมรุกรานกันอยางเครงครัดตราบเทาที่สงครามกับญี่ปุนยังดําเนินอยู และไดปฏิญาณวาจะทําทุกอยางที่ทําไดเพื่อขับไลผูรุกราน ขุนศึกรายยอยจํานวนหนึ่งก็ไดประกาศสนับสนุน โดยนํากองกําลังของตนเขาอยูใตการบัญชาการของ [CHI.GetLeader]\n\nยังตองรอดูวาศัตรูเกาแกแหงสงครามกลางเมืองจีนจะรวมมือกันไดจริงหรือไม และผูเชี่ยวชาญหลายคนเชื่อวาสิ่งนี้แทบไมไดชวยอะไรนอกจากชะลอความพายแพที่หลีกเลี่ยงไมไดของจีน"
 news.288.a: "พันธมิตรแหงความสิ้นหวัง"
 news.288.b: "นี่ไมไดเปลี่ยนอะไรเลย!"
 news.288.c: "พันธมิตรที่ไมมั่นคง"
 news.337.title: "ความอัปยศในแอฟริกา"
 news.337.desc: "วันนี้ [ETH.GetLeader] และ [ITA.GetLeader] ไดลงนามสนธิสัญญาสันติภาพ ยุติการสูรบระหวางสองชาติ แมจะมีความตางทางอํานาจมหาศาลระหวางราชอาณาจักรที่ไมมีทางออกทะเลกับจักรวรรดิที่แผไปทั่วโลก แตรัฐบาลเอธิโอเปยก็เปนฝายไดเปรียบในการเจรจาครั้งนี้อยางชัดเจน อิตาลีไมเพียงตองทําการสงบศึกกับเอธิโอเปย แตดินแดนเอริเทรียและโซมาลิแลนดของอิตาลียังถูกยกใหแก [ETH.GetNameDef] อยางเปนทางการดวย\n\nเมื่อนี่เปนความพายแพครั้งที่สองของกองทัพอิตาลีในเอธิโอเปย รัฐบาลของ [ITA.GetLeader] จึงอยูในสภาพยอยยับ และคงตองใชเวลาหลายปกวาศักดิ์ศรีของอิตาลีที่บอบชํ้าจะฟนตัวจากความพายแพนี้ไดอยางแทจริง"
 news.337.desc_some_states: "วันนี้ [ETH.GetLeader] และ [ITA.GetLeader] ไดลงนามสนธิสัญญาสันติภาพ ยุติการสูรบระหวางสองชาติ แมจะมีความตางทางอํานาจมหาศาลระหวางราชอาณาจักรที่ไมมีทางออกทะเลกับจักรวรรดิที่แผไปทั่วโลก แตรัฐบาลเอธิโอเปยก็เปนฝายไดเปรียบในการเจรจาครั้งนี้อยางชัดเจน อิตาลีไมเพียงตองทําการสงบศึกกับเอธิโอเปย แตดินแดนเดิมของอิตาลีบางสวนในแอฟริกาตะวันออกยังถูกยกใหแก [ETH.GetNameDef] อยางเปนทางการดวย\n\nเมื่อนี่เปนความพายแพครั้งที่สองของกองทัพอิตาลีในเอธิโอเปย รัฐบาลของ [ITA.GetLeader] จึงอยูในสภาพยอยยับ และคงตองใชเวลาหลายปกวาศักดิ์ศรีของอิตาลีที่บอบชํ้าจะฟนตัวจากความพายแพนี้ไดอยางแทจริง"
 news.337.desc_no_states: "วันนี้ [ETH.GetLeader] และ [ITA.GetLeader] ไดลงนามสนธิสัญญาสันติภาพ ยุติการสูรบระหวางสองชาติ แมจะมีความตางทางอํานาจมหาศาลระหวางราชอาณาจักรที่ไมมีทางออกทะเลกับจักรวรรดิที่แผไปทั่วโลก แตรัฐบาลเอธิโอเปยก็สามารถยืนหยัดตานกองกําลังอิตาลีไวได \n\nเมื่อนี่เปนความพายแพครั้งที่สองของกองทัพอิตาลีในเอธิโอเปย รัฐบาลของ [ITA.GetLeader] จึงอยูในสภาพยอยยับ และคงตองใชเวลาหลายปกวาศักดิ์ศรีของอิตาลีที่บอบชํ้าจะฟนตัวจากความพายแพนี้ไดอยางแทจริง"
 news.337.a: "ดีแลวสําหรับเอธิโอเปย!"
 news.337.b: "หวังวา [ITA.GetLeader] จะไมถูกจดจําจากความลมเหลวของเขา"
 news.337.c: "เราจะไมมีวันฟนตัวจากเรื่องนี้ได"
 news.337.d: "จักรวรรดิของราส อลูลาถือกําเนิดใหม!"
 news.338.t: "การทดลองนิวเคลียรประสบความสําเร็จ"
 news.338.desc: "เมื่อวานนี้ [FROM.GetLeader] ประกาศในสุนทรพจนตอสาธารณะวา [FROM.GetNameDefCap] ไดทดลองเครื่องปฏิกรณนิวเคลียรสําเร็จ [FROM.GetNameDefCap] ดูเหมือนจะนําหนาอยูในการแขงขันดานปรมาณูของโลกในขณะนี้"
 news.338.a: "อนาคตยังไมแนนอน"
 news.338.b: "โลกควรตะลึงในความสําเร็จของเรา"
 news.350.t: "การรวมชาติ [ROOT.GetNameDef] อยางสันติ"
 news.350.desc: "\n\nดวยการรับฟงเจตจํานงของประชาชน[ROOT.GetAdjective] [ROOT.GetLeader] ไดประสบความสําเร็จในการรวมรัฐ[ROOT.GetAdjective]ฝาย[ROOT.GetRulingIdeology]เขาดวยกันอยางสันติ ยังตองรอดูวาเรื่องนี้จะสงผลตอโลกโดยรวมอยางไร แตอยางนอยที่ [ROOT.Capital.GetCapitalVictoryPointName] ประชาชนก็ไดเฉลิมฉลองเหตุการณประวัติศาสตรนี้"
 news.350.a: "นี่อาจเปนอันตราย"
 news.350.b: "นี่คือจุดเริ่มตนใหมอยางแนนอน"
 news.350.c: "ก็ดีสําหรับพวกเขา มั้ง"

 news.409.t: "ระเบิดเขื่อนแมนํ้าเหลือง"
 news.409.desc: "ในความพยายามครั้งสุดทายที่จะหยุดยั้งกองกําลัง[JAP.GetAdjective]ที่กําลังรุกเขามา เครือขายคันกั้นนํ้าและแนวปองกันนํ้าทวมตามแมนํ้าเหลืองไดถูกกองทัพ[FROM.GetAdjective]ทําลาย\n\nนํ้าปาที่ไหลบาตามมาทําใหประชากรในชนบทจํานวนมหาศาลตองพลัดถิ่น โดยมีเวลาเตรียมตัวเพียงชั่วครู\n\nยังตองรอดูวาการกระทํานี้จะซื้อเวลาใหกองทัพ[FROM.GetAdjective]ไดมากพอที่จะรวมกําลังใหมและเผชิญการรบตอไปหรือไม"
 news.409.a: "รับทราบ"
 news.409.b: "สิ่งนี้หยุดยั้งสิ่งที่หลีกเลี่ยงไมไดไมได"
 news.409.c: "โศกนาฏกรรมทางมนุษยธรรม"
 
 ace_promoted.1.t: "นักบินยอดฝมือไดรับการเลื่อนยศ"
 ace_promoted.2.t: "นักบินยอดฝมือปาเถื่อนปรากฏตัว"
 ace_promoted.1.d: "มีไมกี่คนที่เสี่ยงภัยมากเทานักบินผูกลาแหงกองทัพอากาศ[Root.GetAdjective] [From.GetName] [From.GetSurname] นักบินฝมือดีที่รูจักกันในนามเรียกขาน [From.GetCallsign] ไดสรางชื่อให [From.GetHerselfHimself] ไมเพียงดวยการกลับมาอยางปลอดภัยจากภารกิจลาสุดเหนือ [From.GetMissionRegion] แตยังรอดชีวิตพรอมชัยชนะสําคัญในการปะทะชี้ขาดหลายครั้ง\n\nการเลื่อนยศครั้งลาสุดของ [From.GetName] ไดรับการประชาสัมพันธอยางกวางขวาง ในฐานะแบบอยางอันโดดเดนแหงความกลาหาญของ[Root.GetAdjective] แมประชาชนอาจมองวาสงครามเปนนรกมากกวาความรุงโรจน แตหลายคนก็ยินดีที่ยังมีวีรบุรุษใหรวมใจกันสนับสนุน"
 ace_promoted.1.d_major: "มีไมกี่คนที่เสี่ยงภัยมากเทานักบินผูกลาแหงกองทัพอากาศ[Root.GetAdjective] [From.GetName] [From.GetSurname] นักบินฝมือดีที่รูจักกันในนามเรียกขาน [From.GetCallsign] ไดสรางชื่อให [From.GetHerselfHimself] ไมเพียงดวยการกลับมาอยางปลอดภัย แตยังบังคับ [From.GetWing] ของ [From.GetHerHis] ดวยฝมือเหนือชั้น เมื่อไมนานมานี้ [From.GetName] ไดออกปฏิบัติภารกิจเหนือ [From.GetMissionRegion] และมีสวนสําคัญตอความสําเร็จของการปะทะชี้ขาดครั้งนี้\n\nการเลื่อนยศครั้งลาสุดของ [From.GetName] ไดรับการประชาสัมพันธอยางกวางขวาง ในฐานะแบบอยางอันโดดเดนแหงความกลาหาญของ[Root.GetAdjective] แมประชาชนอาจมองวาสงครามเปนนรกมากกวาความรุงโรจน แตหลายคนก็ยินดีที่ยังมีวีรบุรุษใหรวมใจกันสนับสนุน"
 ace_promoted.1.a: "ผูกลาเทานั้นที่ชนะ"
 ace_died.1.t: "[From.GetCallsign] เสียชีวิตเหนือ [From.GetMissionRegion]"
 ace_died.1.d: "[From.GetFullName] หนึ่งในนักบิน[From.GetAceType]ยอดฝมือที่มีชื่อเสียงที่สุดของ [From.Owner.GetName] ไดรวงลงในเปลวเพลิงขณะปฏิบัติหนาที่ ระหวางภารกิจเหนือ [From.GetMissionRegion] นาเสียดายที่ [From.GetSheHe] เปนบุคคลสาธารณะมานาน การจากไปของ [From.GetCallsign] จึงบั่นทอนขวัญกําลังใจของผูคนมากมายที่เคยชื่นชม [From.GetHerHim] อยางหนัก\n\nแมเราจะอยากปกปดเหตุการณนี้จากประชาชน แตการที่ [From.GetName] ไมปรากฏตัวตอสาธารณะก็จะทําใหเกิดความสงสัยในไมชา ทายที่สุดแลว การเสียชีวิตของ [From.GetHerHis] ก็เปนอีกสวนหนึ่งของตํานานที่หวังวาจะคงอยูไปอีกนานแมความยากลําบากในปจจุบันจะผานพนไป"
 ace_died.1.d_major: "[From.GetFullName] หนึ่งในนักบิน[From.GetAceType]ยอดฝมือที่มีชื่อเสียงที่สุดของ [From.Owner.GetName] ไดเสียชีวิตขณะปฏิบัติหนาที่ นักบินที่กลับจากภารกิจรายงานวาเห็น [From.GetWingShort] ของ [From.GetHerHis] รวงลงในเปลวเพลิงเหนือ [From.GetMissionRegion] หลังถูกขาศึกระดมยิงอยางหนัก นาเสียดายที่ [From.GetSheHe] เปนบุคคลสาธารณะมานาน การจากไปของ [From.GetCallsign] จึงบั่นทอนขวัญกําลังใจของผูคนมากมายที่เคยชื่นชม [From.GetHerHim] อยางหนัก\n\nแมเราจะอยากปกปดเหตุการณนี้จากประชาชน แตการที่ [From.GetName] ไมปรากฏตัวตอสาธารณะก็จะทําใหเกิดความสงสัยในไมชา ทายที่สุดแลว การเสียชีวิตของ [From.GetHerHis] ก็เปนอีกสวนหนึ่งของตํานานที่หวังวาจะคงอยูไปอีกนานแมความยากลําบากในปจจุบันจะผานพนไป"
 ace_died.1.a: "ตํานานที่ยังมีชีวิตอยูยอมดีกวา"
 ace_killed_by_ace.1.t: "[From.GetFullName] ถูก [Prev.GetCallsign] ยิงตก"
 ace_killed_by_ace.1.d: "นักบินที่กลับจาก [From.GetMissionRegion] รายงานวาฝูงบิน[Prev.Owner.GetAdjective]ซึ่งนําโดย [Prev.GetCallsign] ผูฉาวโฉ ไดมุงไลลา [From.GetCallsign] หลังจากหลบกระสุนจากพวก[Prev.Owner.GetAdjective]ไดหลายชุดและยิงเครื่องบินขาศึกตกไปหลายลํา [From.GetCallsign] ก็ถูก [Prev.GetCallsign] เอาชนะไดในที่สุด มีรายงานวาฝายนั้นบินหลบหลีกเหนือกวา [From.GetHerHim] และยิงเขาถังเชื้อเพลิงอยางแมนยําจนฉีกขาด เครื่องบินของ [From.GetName] [From.GetSurname] ลุกเปนไฟและควงสวานรวงลงเหนือ [From.GetMissionRegion] ทามกลางทะเลเพลิงอันรุนแรง\n\n[From.GetFullName] แสดงความกลาหาญอยางยิ่งตลอดการรับราชการของ [From.GetHerHis] และเปนที่ชื่นชมของผูคนมากมาย การสูญเสียวีรบุรุษของชาติผูนี้เปนการสูญเสียครั้งใหญของกองทัพอากาศ[From.Owner.GetAdjective] และเปนความสูญเสียอันเจ็บปวดของชาติเราโดยรวม การรูวาขณะที่เราโศกเศรา [Prev.Owner.GetName] กลับกําลังยกยอง [Prev.GetFullName] เปนวีรบุรุษ ยิ่งทําใหโศกนาฏกรรมนี้ใหญหลวงขึ้นไปอีก"
 ace_killed_by_ace.1.d_major: "นักบินที่กลับจาก [From.GetMissionRegion] รายงานวา ฝูงบิน[Prev.Owner.GetAdjective]ซึ่งนําโดย [Prev.GetCallsign] ผูฉาวโฉ ไดมุงไลลา [From.GetCallsign] หลังจากยิงเครื่องบินขาศึกตกไปหลายลําและหลบกระสุนจากพวก[Prev.Owner.GetAdjective]ไดหลายชุด [From.GetCallsign] ก็ถูก [Prev.GetCallsign] ใน [Prev.GetWingShort] ของเขาเอาชนะไดในที่สุด มีรายงานวาฝายนั้นบินหลบหลีกเหนือกวา [From.GetHerHim] และยิงเขาถังเชื้อเพลิงอยางแมนยําจนฉีกขาด [From.GetWingShort] ของ [From.GetName] [From.GetSurname] ลุกเปนไฟและควงสวานรวงลงเหนือ [From.GetMissionRegion] ทามกลางทะเลเพลิงอันรุนแรง\n\n[From.GetFullName] แสดงความกลาหาญอยางยิ่งตลอดการรับราชการของ [From.GetHerHis] และเปนที่ชื่นชมของผูคนมากมาย การสูญเสียวีรบุรุษของชาติผูนี้เปนการสูญเสียครั้งใหญของกองทัพอากาศ[From.Owner.GetAdjective] และเปนความสูญเสียอันเจ็บปวดของชาติเราโดยรวม การรูวาขณะที่เราโศกเศรา [Prev.Owner.GetName] กลับกําลังยกยอง [Prev.GetFullName] เปนวีรบุรุษ ยิ่งทําใหโศกนาฏกรรมนี้ใหญหลวงขึ้นไปอีก"
 ace_killed_by_ace.1.a: "ความสูญเสียอันเจ็บปวดของพวกเราทุกคน"
 ace_killed_other_ace.1.t: "[From.GetFullName] ยิง [Prev.GetCallsign] ตก"
 ace_killed_other_ace.1.d: "ภารกิจลาสุดของเราเหนือ [From.GetMissionRegion] เปนความสําเร็จครั้งใหญของกองทัพอากาศ[From.Owner.GetAdjective]ในหลายดาน มีรายงานยกยองวีรกรรมของ [From.GetFullName] ที่สามารถเอาชนะไหวพริบนักบิน[Prev.Owner.GetAdjective] [Prev.GetName] [Prev.GetSurname] ซึ่งรูจักกันในนาม [Prev.GetCallsign] ได [From.GetCallsign] ใช [From.GetHerselfHimself] เปนเหยื่อลอ [Prev.GetCallsign] เขาสูกับดักที่นักบิน[From.Owner.GetAdjective]สามารถดิ่งลงโจมตีฝูงบินของ [Prev.GetCallsign] ได จากนั้น [From.GetCallsign] ก็บินหลบหลีกเหนือกวาเครื่องบิน[Prev.Owner.GetAdjective] และดวยการยิงเพียงชุดเดียว ก็สง [Prev.GetCallsign] ควงสวานรวงจากทองฟาเหนือ [From.GetMissionRegion]\n\n[Prev.GetFullName] เปนนักบินที่นาเกรงขาม ผูคราชีวิตชาว[From.Owner.GetAdjective]ไปมากมายจนติดคางอยูในมโนธรรมของ [Prev.GetHerHis] นี่คือชัยชนะครั้งยิ่งใหญ และแสดงใหเห็นวาเมื่อเรารวมใจสนับสนุนวีรบุรุษผูยิ่งใหญ พวกเขาก็จะสรางวีรกรรมอันยิ่งใหญ"
 ace_killed_other_ace.1.d_major: "ภารกิจลาสุดของเราเหนือ [From.GetMissionRegion] เปนความสําเร็จครั้งใหญของกองทัพอากาศ[From.Owner.GetAdjective]ในหลายดาน มีรายงานยกยองวีรกรรมของ [From.GetFullName] ที่สามารถเอาชนะไหวพริบนักบิน[Prev.Owner.GetAdjective] [Prev.GetName] [Prev.GetSurname] ซึ่งรูจักกันในนาม [Prev.GetCallsign] ได [From.GetCallsign] ใช [From.GetHerselfHimself] เปนเหยื่อลอ [Prev.GetCallsign] เขาสูกับดักที่นักบิน[From.Owner.GetAdjective]สามารถดิ่งลงโจมตีฝูงบินของ [Prev.GetCallsign] ได จากนั้น [From.GetCallsign] ก็บินหลบหลีกเหนือกวาเครื่องบิน[Prev.Owner.GetAdjective] และดวยการยิงเพียงชุดเดียว ก็สง [Prev.GetCallsign] ควงสวานรวงจากทองฟาเหนือ [From.GetMissionRegion]\n\n[Prev.GetFullName] เปนนักบินที่นาเกรงขาม ผูคราชีวิตชาว[From.Owner.GetAdjective]ไปมากมายจนติดคางอยูในมโนธรรมของ [Prev.GetHerHis] นี่คือชัยชนะครั้งยิ่งใหญ และแสดงใหเห็นวาเมื่อเรารวมใจสนับสนุนวีรบุรุษผูยิ่งใหญ พวกเขาก็จะสรางวีรกรรมอันยิ่งใหญ"
 ace_killed_other_ace.1.a: "ชัยชนะที่ทั้ง [From.Owner.GetName] จะจดจํา!"
 aces_killed_each_other.1.t: "[From.GetFullName] รวงแลว"
 aces_killed_each_other.1.d: "ระหวางภารกิจลาสุด [From.GetFullname] นักบิน[From.GetAceType]ยอดฝมือผูมีชื่อเสียงของเรา ไดติดพันการรบยืดเยื้อกับนักบินยอดฝมือผูนาเกรงขาม [Prev.GetFullName] เมื่อกระสุนใกลหมดและไมมีทางหนี [From.GetCallsign] จึงบินฝาหากระสุนจากเครื่องบิน[Prev.Owner.GetAdjective] แลวพุงชน [Prev.GetCallsign]\nมีผูเห็นเครื่องบินของทั้ง [From.GetCallsign] และ [Prev.GetCallsign] แตกเปนชิ้น ๆ รวงลงเหนือ [From.GetMissionRegion]\n\nแมจะเปนการปลอบใจเล็ก ๆ วา [Prev.GetCallsign] ภัยรายจาก[Prev.Owner.GetAdjective] จะไมสรางความรําคาญใหเราอีกตอไป แตเราก็สูญเสียบุคคลสาธารณะอันทรงคุณคาและแรงบันดาลใจของชาว[From.Owner.GetAdjective]ทุกคน"
 aces_killed_each_other.1.d_major: "ระหวางภารกิจลาสุด [From.GetFullname] นักบิน[From.GetAceType]ยอดฝมือผูมีชื่อเสียงของเรา ไดติดพันการรบยืดเยื้อกับนักบินยอดฝมือผูนาเกรงขาม [Prev.GetFullName] เมื่อกระสุนใกลหมดและไมมีทางหนี [From.GetCallsign] จึงบังคับ [From.GetWingShort] ของ [From.GetHerHis] ฝาหากระสุนจากเครื่องบิน[Prev.Owner.GetAdjective] แลวพุงชน [Prev.GetCallsign]\nมีผูเห็นทั้ง [From.GetWingShort] ของ [From.GetCallsign] และ [Prev.GetWingShort] ของ [Prev.GetCallsign] แตกเปนชิ้น ๆ รวงลงเหนือ [From.GetMissionRegion]\n\nแมจะเปนการปลอบใจเล็ก ๆ วา [Prev.GetCallsign] ภัยรายจาก[Prev.Owner.GetAdjective] จะไมสรางความรําคาญใหเราอีกตอไป แตเราก็สูญเสียบุคคลสาธารณะอันทรงคุณคาและแรงบันดาลใจของชาว[From.Owner.GetAdjective]ทุกคน"
 aces_killed_each_other.1.a: "ถึงอยางไรก็เปนความสูญเสียครั้งใหญของเรา"
 election.1.t: "การเลือกตั้งทั่วไป"
 election.1.d: ""
 election.1.a: ""
 election.2.t: "การเลือกตั้ง: ประชาชนคัดคานการเสริมสรางกําลังทหาร"
 election.2.d: "ในการเลือกตั้งที่กําลังจะมาถึง [Root.GetRulingParty] ยังคงไดรับการสนับสนุนสูง เพราะประชาชนเชื่อมั่นในการนําของ [Root.GetLeader] อยางไรก็ตาม การที่พรรคมุงให [Root.GetName] ใหความสําคัญกับกิจการทหารมากขึ้นนั้นไมไดเปนที่นิยมของสาธารณชนทั้งหมด พลเมืองกลุมใหญมองวานี่คือลัทธิคลั่งชาติที่ไมรอบคอบ สงครามยังมาไมถึงพรมแดนของเรา และมีนอยคนที่อยากเห็น [Root.GetName] ดําเนินการอยางกาวราว ดวยการรวมมือกับพรรคใหญอื่น ๆ ที่มีความหวงใยตอความปลอดภัยของชาติเชนเดียวกับเรา เราจะยังคงปกครองไดหลังการเลือกตั้ง แมจะไดรับการสนับสนุนลดลง"
 election.2.a: "ตองรับฟงเสียงประชาชน"
 election.2.b: "การปกปองอธิปไตยของเรามาเปนอันดับแรก"
 election.3.t: "การเลือกตั้ง: ประชาชนเรียกรองการเสริมสรางกําลังทหาร"
 election.3.d: "สงครามที่กําลังคืบใกลพรมแดนของเราทอดเงาปกคลุมการเลือกตั้งที่กําลังจะมาถึง ผูมีสิทธิ์เลือกตั้งจํานวนมากกังวลวา [Root.GetName] ยังไมพรอมหากถูกดึงเขาสูความขัดแยงนี้หรือสิ่งใดก็ตามที่อาจเกิดขึ้นตามมา พวกเขาเรียกรองใหเราเพิ่มมาตรการปองกันและทําใหมั่นใจวาชาติของเราพรอมรบ แมเสียงสวนใหญยังคงสนับสนุน [Root.GetRulingParty] แตเราอาจเสียพวกเขาไปใหกลุมหัวรุนแรงหากไมคลายความหวาดวิตกของพวกเขา"
 election.3.a: "ประชาชนมีสิทธิ์ที่จะรูสึกปลอดภัย"
 election.3.b: "หลายคนยังคงสนับสนุนการแกปญหาทางการทูต"
 election.4.t: "การเลือกตั้ง: ฟาสซิสตในรัฐบาล?"
 election.4.d: "กระแสชาตินิยมแบบกาวราวไดเติบโตขึ้นใน [Root.GetName] ทําใหเกิดพรรคการเมืองหลายพรรคที่สงเสริมอุดมการณฟาสซิสต คือรัฐที่บังคับใชอํานาจดวยกําลัง หนึ่งในพรรคเหลานี้ไดรับความนิยมเปนพิเศษในการเลือกตั้งครั้งนี้ จนเกิดการถกเถียงภายในพรรค [Root.GetRulingParty] วาเราควรพยายามรวมมือกับพวกเขาในการจัดตั้งรัฐบาลหรือไม แมพวกเขาจะปฏิเสธอุดมการณประชาธิปไตยที่เปนรากฐานของรัฐเราอยางเปดเผย แตการที่พวกเขาเลือกเขารวมการเลือกตั้งก็ชวยเพิ่มความนาเชื่อถือใหมุมมองของเราอยูบาง และการยอมรับเสียงสนับสนุนจากสาธารณชนของพวกเขาอาจชวยกันไมใหพวกเขาใชความรุนแรง"
 election.4.a: "ยังดีกวาพวกคอมมิวนิสต!"
 election.4.b: "แนวรวมกวางของพรรคฝายประชาธิปไตยเปนทางเลือกที่ดีกวา"
 election.5.t: "การเลือกตั้ง: คอมมิวนิสตในรัฐบาล?"
 election.5.d: "ขบวนการคอมมิวนิสตใน [Root.GetName] ซึ่งไดแรงหนุนจากความไมพอใจอยางกวางขวางในหมูชนชั้นแรงงานและกระแสหัวรุนแรงในหมูนักวิชาการ ไดเติบโตจนเกิดพรรคการเมืองหลายพรรค หลังจากพรรคหนึ่งไดรับการสนับสนุนอยางมากในการเลือกตั้งครั้งนี้ นักการเมืองใน [Root.GetRulingParty] ก็เริ่มถกเถียงวาควรขอการสนับสนุนจากพวกเขาในการจัดตั้งรัฐบาลหรือไม แมพวกเขาจะมองวาสถาบันประชาธิปไตยของเราเปนเพียงทรราชของชนชั้นกระฎมพี แตพวกเขาก็ดูกระตือรือรนที่จะสรางการเปลี่ยนแปลงที่ตองการผานการรวมมือกับรัฐบาลมากกวาการโคนลม"
 election.5.a: "ปฏิรูปยังดีกวาปฏิวัติ!"
 election.5.b: "แนวรวมกวางของพรรคฝายประชาธิปไตยเปนทางเลือกที่ดีกวา"
 election.6.t: "การเลือกตั้ง: พรรคฝายประชาธิปไตยเปนเสียงขางนอย"
 election.6.d: "การเมืองใน [Root.GetName] มีความสุดโตงมากขึ้นเรื่อย ๆ จากที่เคยมีการสนับสนุนอยางกวางขวางตอพรรคที่ยึดมั่นในอุดมการณประชาธิปไตยและสถาบันผูแทนของ [Root.GetName] ในการเลือกตั้งครั้งนี้ ผูมีสิทธิ์เลือกตั้งจํานวนมากขึ้นหันไปหาขั้วการเมืองสุดโตง พรรคสายกลางไมไดเปนเสียงขางมากอีกตอไป แมจะเลือกวางความขัดแยงไวกอนก็ตาม เพื่อหลีกเลี่ยงรัฐบาลเสียงขางนอยที่ออนแอ เราไมมีทางเลือกอื่นนอกจากรวมมือกับฟาสซิสตหรือคอมมิวนิสต"
 election.6.a: "เราจะรวมงานกับฟาสซิสตเพื่อทําให [Root.GetName] แข็งแกรงขึ้น"
 election.6.b: "ดวยการรวมมือกับคอมมิวนิสต เราจะผลักดันการเปลี่ยนแปลงทางสังคมได"
 election.6.c: "รัฐบาลเสียงขางนอยแมจะออนแอ แตก็เปนทางเลือกที่ดีกวา"
 election.7.t: "ฟาสซิสตมีอิทธิพลตอนโยบายตางประเทศ"
 election.7.d: "การยอมรับฟาสซิสตเขามาในแนวรวมทางการเมืองของเราไดสงผลตอนโยบายตางประเทศ แมพวกเขาจะคลั่งชาติอยางรุนแรง แตก็มีผูเห็นใจในตางประเทศที่พอใจกับอิทธิพลที่พวกเขาไดรับใน [Root.GetName] รัฐบาลเผด็จการเบ็ดเสร็จที่มีแนวทางอุดมการณคลายคลึงกันมองวาเราเปนพันธมิตรที่มีศักยภาพ การรักษาสายสัมพันธกับชาติเหลานี้ ไมวา [Root.GetRulingParty] จะรังเกียจอุดมการณของพวกเขาเพียงใด อาจจําเปนเพื่อรักษาการสนับสนุนจากฟาสซิสตที่คํ้าจุนรัฐบาลของเรา"
 election.7.a: "เราตองการพันธมิตรไวรับมือภัยคุกคามที่ใหญกวา"
 election.7.b: "มีเพื่อนแบบนั้น ก็ไมตองมีศัตรูแลว"
 election.8.t: "คอมมิวนิสตมีอิทธิพลตอนโยบายตางประเทศ"
 election.8.d: "คอมมิวนิสตมักถือวาตนเปนสวนหนึ่งของการปฏิวัติสากล และการที่เราเลือกยอมรับพวกเขาเปนหุนสวนในรัฐบาลไดดึงความสนใจจากพันธมิตรนานาชาติของพวกเขาจํานวนมาก ผูแทนพรรคคอมมิวนิสตมีสายสัมพันธใกลชิดกับชาติที่ละทิ้งรูปแบบการปกครองแบบเรา แลวหันไปหาเผด็จการของชนชั้นกรรมาชีพ สายสัมพันธซึ่งเราอาจตองยอมรับในนโยบายตางประเทศของ[Root.GetAdjective] หากตองการรักษาการสนับสนุนของพวกเขาไว"
 election.8.a: "เราควรยอมรับเปาหมายรวมของเรา"
 election.8.b: "เสนทางนั้นนําไปสูการลมสลายของ [Root.GetName] เอง"
 election.11.t: "การเลือกตั้ง: ฟาสซิสตครองเสียงขางมาก"
 election.11.d: "การเลือกตั้งครั้งนี้สรางความเสียหายยอยยับตอสถาบันที่การเลือกตั้งเปนตัวแทน ประชากร[Root.GetAdjective]สวนใหญลงคะแนนใหพรรคฟาสซิสตที่มุงยกเลิกการเลือกตั้งและสถาปนาผูปกครองแบบอัตตาธิปไตย ขณะที่หลายคนคิดจะจับอาวุธตอตานการละเมิดอุดมการณประชาธิปไตยซึ่งเปนสิ่งที่มอบอาณัตินี้ใหพวกเขาตั้งแตแรก อีกหลายคนกลับเห็นวาการใชความรุนแรงมีแตจะยิ่งยืนยันอุดมการณของพวกเขา"
 election.11.a: "วันนี้เปนวันอันมืดมนของ [Root.GetName] แตประชาชนไดตัดสินแลว"
 election.11.b: "เราจะไมยอมสละเสรีภาพโดยไมสู!"
 election.12.t: "การเลือกตั้ง: คอมมิวนิสตครองเสียงขางมาก"
 election.12.d: "การเลือกตั้งครั้งนี้จบลงดวยชัยชนะของพรรคคอมมิวนิสต โดยรัฐบาลชุดเดิมมีปฏิกิริยาที่หลากหลาย แมผูปกครองใหมจะอางวาเปนตัวแทนของประชาชนทั้งมวล แตพวกเขามองวาสถาบันประชาธิปไตยหลายอยางที่เราหวงแหนเปนความพยายามที่จะชักใยและกดขี่ชนชั้นแรงงาน จนเกิดการถกเถียงวาอะไรคือ 'การปกครองโดยประชาชน' ที่แทจริง ในบางชาติ การปฏิวัติเริ่มตนดวยสายธารแหงเลือด แตใน [Root.GetName] ไมใชเชนนั้น ทวาอาจจบลงดวยสายธารแหงเลือดก็เปนได"
 election.12.a: "เรื่องนี้นากังวล แตพวกเขาเปนตัวแทนของเสียงขางมากจริง ๆ"
 election.12.b: "เราตองหยุดพวกเขากอนที่จะกําจัดทุกรองรอยของความคิดเห็นตาง!"
 election.13.t: "การเลือกตั้ง: เจาสัวฝกใฝฟาสซิสต"
 election.13.d: "นักอุตสาหกรรมผูทรงอิทธิพลซึ่งอยูเบื้องหลังบริษัทแหงหนึ่งที่เราเลือกรวมงานดานการผลิตทางอุตสาหกรรม เมื่อไมนานมานี้ไดแสดงความเห็นทางการเมืองหลายครั้งซึ่งทําใหสมาชิกในรัฐบาลรูสึกไมสบายใจ เขาสนับสนุนรัฐบาลแบบอํานาจนิยมอยางเปดเผย และยกยองรัฐบาลตางประเทศที่ประกาศตนเปนฟาสซิสต พรอมบอกเปนนัยวา [Root.GetName] จะไดประโยชนจากการปกครองเชนนั้น การประณามเจาสัวผูนี้และอุดมการณของเขาอาจทําใหความสัมพันธกับบริษัทเสื่อมลง แตหากปลอยไวโดยไมควบคุม ก็จะเปนการเปดเวทีใหเขาเผยแพรโฆษณาชวนเชื่อที่กัดกรอนทุกสิ่งที่ [Root.GetRulingParty] ยึดถือ"
 election.13.a: "เขาจะพูดอะไรก็พูดไป เราไมจําเปนตองเห็นดวย"
 election.13.b: "เราไมอาจพึ่งพาพวกฟาสซิสตใหพัฒนาและปกปอง[Root.GetName]ได"
 election.14.t: "การเลือกตั้ง: ขอยกเวนในยามสงคราม"
 election.14.d: "[Root.GetName]อยูในภาวะสงคราม ตามปกติแลวการเลือกตั้งจะตองจัดขึ้นในชวงเวลานี้ แตเมื่ออยูทามกลางความขัดแยงครั้งสําคัญ หลายฝายจึงแยงวาเราไมอาจเสียเวลาไปกับการหาเสียงทางการเมือง หรือกับการเปลี่ยนตัวผูนําหากเกิดขึ้น ขณะเดียวกัน อีกฝายก็อางวาการถือเอาสงครามที่ดําเนินอยูเปนเหตุผลอันชอบธรรมในการงดการเลือกตั้ง คือกาวแรกของการกัดกรอนประชาธิปไตยแหง[Root.GetAdjective] ทายที่สุดแลว การปลอยใหกิจการทหารอยูเหนืออิทธิพลของประชาชนอาจนําไปสูทางลาดลื่นที่ยากจะหยุดยั้ง"
 election.14.a: "การเลือกตั้งจะจัดขึ้นตามปกติ"
 election.14.b: "เรื่องเหลานี้คอยจัดการเมื่อสงครามจบลง"
 election.15.t: "การเลือกตั้ง: รัฐบาลถูกทาทาย"
 election.15.d: "เมื่อการเลือกตั้งใกลเขามา ประชาชนเริ่มตั้งคําถามถึงความสามารถของรัฐบาลชุดปจจุบันในการดําเนินสงครามที่ยังคงดําเนินอยู [Root.GetName]ไดรับความเสียหายอยางหนัก และมติมหาชนไดหันมาตอตานผูที่ดูเหมือนกําลังนําชาติของเราไปสูความพายแพ แมประชาชนของเราจะมุงมั่นที่จะเห็นสงครามดําเนินไปจนถึงที่สุด แตพวกเขาก็อยากเห็นรัฐบาลชุดอื่นเปนผูยุติมันมากกวา"
 election.15.a: "วิกฤตศรัทธาครั้งนี้ชางนาเสียดายยิ่งนัก"
 election.15.b: "ปลอยใหภูมิทัศนทางการเมืองเปลี่ยนไป เพื่อใหประชาชนยังคงเปนหนึ่งเดียว"
 election.16.t: "[Root.GetLeader]ไดรับการสนับสนุนจากสาธารณชน"
 election.16.d: "ในการเลือกตั้งครั้งนี้ ฝายคานเทาที่ยังหลงเหลืออยูไดวิพากษวิจารณการปกครองที่เปนเผด็จการมากขึ้นทุกทีของ[Root.GetRulingParty] พวกเขาตั้งคําถามวาผูมีสิทธิเลือกตั้งมีอํานาจอยูจริงหรือไม หรือทั้งหมดเปนเพียงการจัดฉาก\n\nอยางไรก็ตาม การสนับสนุน[Root.GetLeader]ดูเหมือนจะยังคงสูง และแมประชาคมระหวางประเทศจะตั้งขอสงสัยตอสภาพแวดลอมของการเลือกตั้ง แตภายในประเทศกลับไมมีผูใดโตแยง ดูเหมือนวาแม[Root.GetName]จะไมไดปกครองโดยประชาชนอีกตอไป แตประชาชนก็ยังสนับสนุนผูปกครองของตน... อยางนอยก็บรรดาผูที่ไดไปถึงคูหาเลือกตั้ง"
 election.16.a: "หนึ่งประชาชน หนึ่งผูนํา"
 election.17.t: "ผลการเลือกตั้งถูกตั้งขอสงสัย"
 election.17.d: "แมระบอบของ[Root.GetLeader]จะใชกําลังบีบบังคับใหฝายตรงขามสวนใหญเงียบเสียงลงแลว แตก็ยังมีบางคนออกมาพูดถึงการเลือกตั้งครั้งลาสุด โดยกลาวหาวา[Root.GetRulingParty]โกงผลการเลือกตั้ง และเพิกเฉยตอความพยายามอยางชัดแจงที่จะเลือกรัฐสภาซึ่งคัดคานนโยบายของพวกเขา\n\nรัฐบาลปดขอคัดคานเหลานี้ทิ้งวาเปนความพยายามยุยงใหประชาชนแตกแยกตอตานรัฐบาลเอง ทวาความจริงก็ยังคงอยูวาประชาชนสวนใหญดูจะมีขอกังขาตอการปกครองของพวกเขา และฝายคานแมจะถูกปดปากไวในตอนนี้ ก็ไดแสดงจุดยืนของตนใหเห็นแลว"
 election.17.a: "พวกบอนทําลายความสามัคคี!"
 political.1.t: "คอมมิวนิสตกําลังผงาด"
 political.1.d: "'ขณะที่กรรมกรทั่วโลกลุกฮือตอตานผูกดขี่ บรรดาผูที่อางวาตระหนักรูทางชนชั้นแลวใน[Root.GetName]กลับนั่งเฉยรอใหการเปลี่ยนแปลงเกิดขึ้นจากภายในระบบการเมืองที่เนาเฟะถึงขนาดที่มีเพียงการปฏิวัติเทานั้นที่จะชวยเราใหพนจากมันได!'\n\nนี่คือเสียงใหมในขบวนการคอมมิวนิสตแหง[Root.GetAdjective] พวกเขาเรียกการปกครองของ[Root.GetRulingParty]วาเปนเผด็จการของชนชั้นนายทุน และเริ่มเรียกรองใหโคนลมออกจากอํานาจดวยวิธีการใดก็ตามที่จําเปน สวนวิธีการเหลานั้นจะมาจากภายในหรือภายนอกยังคงตองรอดูกันตอไป"
 political.1.a: "อาจมีผูคนในรัฐบาลเองที่สนับสนุนแนวคิดเชนนี้"
 political.1.a.tt: "เพิ่มโอกาสที่จะไดรับการสนับสนุนจากภายในสําหรับรัฐประหารของคอมมิวนิสต"
 political.1.b: "ขบวนการเพื่อประชาชนตองแสวงหาการสนับสนุนจากประชาชน"
 political.1.b.tt: "เพิ่มโอกาสที่จะไดรับการสนับสนุนจากประชาชนสําหรับการลุกฮือของคอมมิวนิสต"
 political.2.t: "ความเห็นใจลัทธิมารกซในรัฐบาล"
 political.2.d: "แมแนวทางของ[Root.GetRulingParty]จะตอตานสังคมนิยมปฏิวัติอยางแข็งขัน และคอยจับตาดูกลุมฝายซายหัวรุนแรงในประเทศอยางใกลชิด แตก็มีบางคนในรัฐบาลที่เปดรับความเปนไปไดนี้มากกวา อยางนอยที่สุด พวกเขาก็เห็นชองทางที่จะตอบสนองความกังวลของประชาชนที่หันไปหาคอมมิวนิสตเพื่อหาทางออก โดยไมตองเสี่ยงกับสงครามกลางเมืองเต็มรูปแบบ\n\nแมคนเหลานี้อาจถูกมองวาเปนคนทรยศในสายตาของผูที่ยังคงภักดีตอ[Root.GetLeader] แตเสียงที่เห็นตางเหลานี้อาจเปนผูที่ชวยใหการเปลี่ยนผานเปนไปโดยแทบไมนองเลือด หากการปฏิวัติมาถึง"
 political.2.a: "เราจะจับตาดูพวกเขาอยางใกลชิดเชนกัน ดวยเหตุผลหลายประการ"
 political.2.a.tt: "หากไดรับการสนับสนุนจากสาธารณชนเพียงพอ ก็จะสามารถกอรัฐประหารได"
 political.3.t: "คอมมิวนิสตกอรัฐประหาร"
 political.3.d: "ขณะที่ขบวนการมวลชนเพื่อการปฏิวัติคอมมิวนิสตสงเสียงดังและนาหวาดหวั่น ก็มีกลุมหนึ่งในขบวนการทางการเมืองที่เงียบงันและเฝารอมาโดยตลอด บัดนี้การรอคอยสิ้นสุดลงแลว วันนี้ ขณะที่ผูนําของ[Root.GetRulingParty]และกองทัพกําลังเตรียมรับมือกับการลุกฮือทั่วประเทศ เจาหนาที่จํานวนหนึ่งในรัฐบาล[Root.GetAdjective]ไดควบคุมตัว[Root.GetLeader]ไวในบานพักอยางรวดเร็ว และเปดการเจรจากับฝายกบฏ\n\nแมจะยังคงอางวาเปนการรักษาความสงบเรียบรอย แตโดยเนื้อแทแลวการเจรจาดังกลาวคือการจับจองตําแหนงในรัฐสังคมนิยมใหมใหแกผูที่เลือกจะรวมมือ รัฐประหารเสร็จสิ้นกอนที่ใครจะทันขยับเขามาขัดขวาง และบรรดาผูที่คิดจะขัดขวางก็ถูกระบอบใหมจําคุก เนรเทศ หรือประหารชีวิตไปแลว"
 political.3.a: "กระแสแหงประวัติศาสตรจะกวาดลางอดีตไปสิ้น"
 political.4.t: "ความขัดแยงทางชนชั้นแบงแยก[Root.GetName]"
 political.4.d: "ขบวนการปฏิวัติคอมมิวนิสต ซึ่งครั้งหนึ่งเปนเพียงกลุมชายขอบที่นิยมในหมูนักวิชาการหัวรุนแรงในทางทฤษฎี และพวกกอความวุนวายในทางปฏิบัติ บัดนี้ไดรับการสนับสนุนเพิ่มขึ้นในหมูชนชั้นแรงงานแหง[Root.GetAdjective] การที่ผูคนจํานวนมากขึ้นเลือกจะนิยามตนเองดวย 'ชนชั้น' บงบอกวาแนวคิดมารกซิสตกําลังแพรกระจายไปไกลกวากลุมที่พยายามโคนลมรัฐบาลอยางแข็งขัน\n\nสมาชิก[Root.GetRulingParty]ตางครํ่าครวญถึงพัฒนาการนี้ และโหยหาชวงเวลาที่ผูคนนิยามตนเองวาเปนชาว '[Root.GetAdjective]' เปนอันดับแรกและสําคัญที่สุด ความกังวลของพวกเขาไมไดไรมูล อาจกลาวไดวาการปฏิวัติไดเริ่มตนขึ้นแลวในหลายระดับของสังคม และอาจสายเกินไปที่จะหยุดยั้งมัน"
 political.4.a: "ประชาชนจะเรียกตัวเองวาอะไรก็ไดตามใจ"
 political.5.t: "ทหารหนีทัพไปเขากับกองโจรคอมมิวนิสต"
 political.5.d: "'พวกนายทุนและพวกชาตินิยมตองการใหพวกทานหลั่งเลือดเพื่อพวกมันในแนวหนา ใหพี่นองหันมาฆากันเองเพราะขอพิพาทที่ไมเกี่ยวอะไรกับคนทํางานเลย! แทนที่จะจับอาวุธสูกับกรรมกรที่ดิ้นรนอยูตางแดน จงหันอาวุธไปหาผูกดขี่และโคนลมทรราชเสีย!'\n\nกองทัพ ซึ่งปกติเปนปอมปราการแหงความรักชาติและความภักดี ไดพิสูจนแลววาไมอาจตานทานโฆษณาชวนเชื่อของคอมมิวนิสตที่แพรสะพัดอยางรวดเร็วใน[Root.GetName]ได ทหารพากันหนีทัพ ปฏิเสธที่จะสูรบเพื่อประเทศของตน บางครั้งถึงขั้นเขารวมขบวนการกองโจรที่อางวากําลังเตรียมการปฏิวัติ"
 political.5.a: "บางทีพวกเขาอาจแคกําลังสูเพื่อ[Root.GetName]ในแบบที่ตางออกไป"
 political.6.t: "การปฏิวัติเดือน[GetMonth]"
 political.6.d: "แนวคิดที่วาขบวนการคอมมิวนิสตเปนตัวแทนของประชาชนกําลังไดแรงหนุนอยางมากใน[Root.GetName] ซึ่งการสนับสนุนพรรคคอมมิวนิสตจากสาธารณชนเพิ่มขึ้นอยางรวดเร็วในชวงหลายเดือนที่ผานมา ทวาผูที่เรียกรองการปฏิวัติไมไดเปนเพียงกลุมกองโจรกระจัดกระจายและสหภาพแรงงานที่ไมพอใจอีกตอไปแลว กลุมที่อยูเบื้องหลังการเรียกรองใหลุกฮือมีการจัดตั้งที่ดีพอจะจัดตั้งรัฐบาลไดหากพวกเขาประสบความสําเร็จ\n\nกระนั้น หากการปฏิวัติเริ่มขึ้นในตอนนี้ ก็แทบเปนไปไมไดที่จะไมทําให[Root.GetName]ตกอยูในสงครามกลางเมือง นักปฏิวัติควรเสี่ยงฉีกชาติออกเปนสองเสี่ยงเพื่อสนองความใจรอนของตน หรือควรรอโอกาสที่ดีกวาในอนาคต?"
 political.6.a: "ผูที่ปรารถนาจะสรางประวัติศาสตรตองลงมือวันนี้!"
 political.6.b: "การปฏิวัติเปนสิ่งที่หลีกเลี่ยงไมได และสิ่งที่หลีกเลี่ยงไมไดยอมรอได"
 political.7.t: "ฟาสซิสตกําลังผงาด"
 political.7.d: "'ประชาชนชาว[Root.GetAdjective]ตองทนอยูใตการปกครองอันไรความสามารถของ[Root.GetRulingParty]มานานเกินไปแลว! พวกมันอางวาเปนตัวแทนของประชาชน แตแมแตจะรักษาความสงบบนทองถนนก็ยังทําไมได! มีเพียงการขับพวกมันออกจากอํานาจเทานั้น ที่จะทําใหชาตินี้เติบโตได!'\n\nนักปราศรัยฝายฟาสซิสตใน[Root.GetName]ไมไดปดบังเลยวาพวกเขาคิดอยางไรตอผูปกครองและระบบการเมืองในปจจุบันของเรา สุนทรพจนเชนนี้ไดปลุกความไมพอใจของสาธารณชน ซึ่งเห็นไดชัดเปนพิเศษในกลุมที่อนุรักษนิยมมากกวาในกองทัพ"
 political.7.a: "ผูใหญระดับสูงอาจแอบเห็นใจอยูเงียบ ๆ"
 political.7.a.tt: "เพิ่มโอกาสที่จะไดรับการสนับสนุนจากภายในสําหรับรัฐประหารของฟาสซิสต"
 political.7.b: "คนรุนใหมจะรับคบเพลิงตอไป"
 political.7.b.tt: "เพิ่มโอกาสที่จะไดรับการสนับสนุนจากประชาชนสําหรับรัฐประหารของฟาสซิสต"
 political.8.t: "ความเห็นใจฟาสซิสตในกองทัพ"
 political.8.d: "นายทหารระดับสูงหลายนายของกองทัพ[Root.GetAdjective]ไดแสดงการสนับสนุนขบวนการฟาสซิสตใน[Root.GetName] ทั้งอยางลับ ๆ และอยางเปดเผย พวกเขารูสึกวา[Root.GetRulingParty]ไดหลงลืมไปแลววากําลังอาวุธมีความสําคัญเพียงใดตอการรักษาประเทศใหเปนปกแผน และไมพอใจมากขึ้นเรื่อย ๆ ที่รัฐบาลปฏิบัติตอกองทัพเหมือนเปนเพียงเครื่องมือ มากกวาจะเปนหนึ่งในสถาบันที่สําคัญที่สุดของชาติ บางคนถึงกับเสนอวาจําเปนตองมีรัฐบาลใหม ที่รูวิธีนํา[Root.GetName]กาวเขาสูครึ่งหลังของศตวรรษ\n\nกลุมนี้อาจไมไดประกอบดวยนักการเมืองเปนหลัก แตบางคนก็ไดตําแหนงในกระทรวงกลาโหมแลว หากพัฒนาการเชนนี้ยังดําเนินตอไป พวกเขาอาจไดรับการสนับสนุนทางการเมืองมากพอที่จะกอรัฐประหาร"
 political.8.a: "จิตวิญญาณแหงชาติอยูเหนือรัฐบาล"
 political.9.t: "รัฐประหารของฟาสซิสต"
 political.9.d: "บางคนจะบอกวาพวกเขาเห็นมันมากอนแลว ทั้งผูที่เคยเตือนถึงภัยของลัทธิฟาสซิสตและผูที่เคยยกยองวามันคือผูกอบกู[Root.GetName] ตางไดเห็นคําทํานายของตนกลายเปนจริงในวันนี้ เมื่อกองทัพใน[Root.Capital.GetName]โคนลมรัฐบาลที่นําโดย[Root.GetRulingParty]และยึดอํานาจ [Root.GetLeader]หายสาบสูญ มีขาวลือวาไดลี้ภัยไปแลว และรัฐประหารครั้งนี้แทบไมพบการตอตานในชวงแรก\n\nผูนําชุดใหมของ[Root.GetAdjective]ก็ไมมีแผนจะปลอยใหการตอตานเติบโตขึ้นเชนกัน มีการประกาศกฎอัยการศึก และดวยความเปลี่ยนแปลงที่กําลังดําเนินอยู สิ่งที่จะตามมาหลังจากนี้ก็คงไมแตกตางไปจากนี้มากนัก"
 political.9.a: "รัฐที่เขมแข็งเปนสิ่งจําเปนเพื่อปกปองประชาชนจากตัวพวกเขาเอง"
 political.10.t: "สงครามกลางเมืองเพื่อฟาสซิสต"
 political.10.d: "แมความพยายามของขบวนการฟาสซิสตในการปลุกกระแสชาตินิยมจะประสบความสําเร็จอยูบาง แตการตอตานแนวคิดเหลานี้ยังคงสูง บรรดานายพลที่วางแผนโคนลมรัฐบาลชุดปจจุบันผิดหวังที่ประชาชนชาว[Root.GetAdjective]เองดูจะขาดความเชื่อมั่นใน[Root.GetFascistParty]\n\nพวกเขายังคงมั่นใจวาสักวันประชาชนจะเบื่อหนาย[Root.GetLeader] แตก็แตกแยกกันวาควรดําเนินการอยางไร บางคนเรียกรองใหกอรัฐประหารเสียแตตอนนี้ กอนที่ศัตรูของ[Root.GetName]จะลงมือ ทวาการทําเชนนั้นในขณะที่การสนับสนุนจากสาธารณชนยังมีจํากัด จะทําใหชาติจมดิ่งสูสงครามกลางเมือง"
 political.10.a: "เจตจํานงแหงอํานาจยอมไรความหมาย หากลังเลที่จะความันไว"
 political.10.b: "พวกเขาตองรวมประชาชนใหเปนหนึ่งกอน แลวจึงปกครอง"
 political.11.t: "กองพลจูโจมฟาสซิสตถือกําเนิด"
 political.11.d: "การเมืองและการทหารผูกพันกันมาโดยตลอดในลัทธิฟาสซิสต ควบคูไปกับขบวนการทางการเมืองที่เติบโตขึ้น พรรคฟาสซิสตไดเริ่มจัดตั้งองคกรกึ่งทหารเพื่อปกปองจากภัยคุกคามทั้งภายในและภายนอก โดยภัยภายในก็คือฝายตรงขามทางการเมืองของพวกเขานั่นเอง แมผูคนจํานวนมากจะรูสึกกังวลกับพัฒนาการนี้ แตกระแสคลั่งลัทธิทหารก็ทําใหมีอาสาสมัครเขารวมกองทัพของเรามากขึ้น\n\nผูนําทางการเมืองของขบวนการชี้วาฝายตรงขามมีเหตุผลที่จะตองหวาดกลัว เมื่อกองทัพถูกแทรกซึมในหลายระดับโดยกลุมการเมืองที่ชัดแจงถึงเพียงนี้ ศัตรูของ[Root.GetName]กับศัตรูของลัทธิฟาสซิสตก็เริ่มดูคลายกันมากขึ้นทุกที"
 political.11.a: "มีเพียงคนทรยศชาติเทานั้นที่ตองหวาดกลัว"
 political.12.t: "ภัยคุกคามจากคอมมิวนิสต"
 political.12.d: "'[Root.GetLeader]อยากใหพวกทานเชื่อวา[Root.GetName]ปลอดภัยและเปนหนึ่งเดียว ไมนาแปลกใจเลยที่คําโกหกเชนนี้จะวางยาพิษความคิดของประชาชนเรา ในเมื่ออสรพิษขดตัวอยูขางบานนี่เอง! ไมตองมองไกลไปกวาขามพรมแดนของเรา ก็จะเห็นเพื่อนรวมชาติหันมาทํารายกันเองในนามของคอมมิวนิสต และประกาศจุดจบของชาติ อีกนานเทาไรกวาพวกมันจะประกาศวาชาติของเราตายไปแลวเชนกัน? [Root.GetRulingParty]จะปกปองเราจากภัยนี้ไดหรือ?'\n\nการเติบโตของขบวนการฟาสซิสตใน[Root.GetName]ไดรับแรงหนุนจากการปฏิวัติคอมมิวนิสตที่อยูใกลตัว ผูมีแนวคิดสายกลางจํานวนมากที่ปกติอาจมองขามลัทธิฟาสซิสตวาเปนเพียงการทดลองทางอุดมการณที่หลงทางอีกอยางหนึ่ง ตางพบวานี่เปนความกังวลที่จับตองไดจริงสําหรับพวกเขาเชนกัน หากตองเลือกระหวางคอมมิวนิสตของเพื่อนบานกับระบอบฟาสซิสต พวกเขาก็ยอมรับวาจะเลือกอยางหลัง และอาจถึงขั้นเต็มใจสนับสนุนอยางแข็งขันดวยซํ้า"
 political.12.a: "เราจะเปนแนวหนาตอตานภัยแดง!"
 political.13.t: "มุงสูประชาธิปไตย"
 political.13.d: "'หากเราปดปากเสียงของประชาชน แลวพวกเราคนใดจะอางไดวาตนเปนเสียงของ [Root.GetName]? หากเรากลัวความเห็นตาง กลัวถูกประณามตอหนาสาธารณชนหรือถูกขับออกดวยเสียงของประชาชน สิ่งที่เรากลัวจริง ๆ ก็คือการถูกพลเมืองของเราเองเกลียดชังและรังเกียจ [Root.GetRulingParty] ไมมีความมั่นใจในหลักการของตนเองถึงเพียงนั้นเชียวหรือ?'\n\nกลุมกอนหนึ่งในรัฐบาลซึ่งรวมตัวกันอยางหลวม ๆ และระมัดระวัง แตเปยมดวยความมุงมั่น ไดเริ่มผลักดันใหผอนคลายนโยบายปราบปรามศัตรูของรัฐ พวกเขาตองการใหประชาชนมีสวนรวมในการตัดสินใจผานการลงประชามติและการประชุมพรรคระดับทองถิ่น แมวานั่นจะหมายถึงการเอาอนาคตของวาระปจจุบันไปเสี่ยงก็ตาม"
 political.13.a: "เริ่มจากหารือกันภายในกอนก็ได"
 political.13.a.tt: "เพิ่มโอกาสที่จะไดรับการสนับสนุนภายในใหจัดการเลือกตั้ง"
 political.13.b: "เมื่อรูวาเราเปนฝายถูก เราก็ยอมใหศัตรูพูดไดอยางเปดเผยมากขึ้น"
 political.13.b.tt: "เพิ่มโอกาสที่ประชาชนจะแสดงการสนับสนุนประชาธิปไตยและรวมตัวกันเปนฝายคาน"
 political.14.t: "[Root.GetRulingParty] ถกเถียงเรื่องประชาธิปไตย"
 political.14.d: "นาประหลาดใจที่ขอเรียกรองใหมีการลงประชามติมากขึ้นและผอนคลายมาตรการปราบปรามผูตอตานระบอบไดรับการสนับสนุนอยูบางในการหารือภายในพรรค แมผูนําของ [Root.GetRulingParty] จะยังคงกังขา แตสมาชิกผูทรงอิทธิพลหลายคนก็สนับสนุนการเปลี่ยนแปลงนี้\n\nบางทีพวกเขาอาจมั่นใจวาในทางปฏิบัติจะแทบไมมีอะไรเปลี่ยน หรือบางทีพวกเขาอาจเปนผูทรยศตออุดมการณของพรรคอยางลับ ๆ ดังที่ฝายตรงขามหลายคนกลาวหา ไมวาอยางไร หากเสียงเรียกรองจากประชาชนใหเปลี่ยนแปลงดังขึ้นมา ผูนําบางคนของ [Root.GetName] ก็พรอมจะประนีประนอม"
 political.14.a: "ทางเลือกอาจไมไดมีแคเสรีภาพหรือความตายเสมอไป"
 political.14.a.tt: "รัฐบาลอาจจัดการเลือกตั้งเมื่อนโยบายนี้ไดรับการสนับสนุนจากเสียงขางมาก"
 political.14.c: "เราตองมีการลงประชามติ"
 political.14.e: "เดี๋ยวเรื่องนี้ก็เงียบไปเอง"
 impending_civil_war_tt: "§Rหากการสนับสนุนทางอุดมการณยังคงเพิ่มขึ้นตอไป สิ่งนี้อาจนําไปสูสงครามกลางเมืองเต็มรูปแบบ!§!\n"
 political.15.t: "ฝายคานประชาธิปไตยกําลังกอตัว"
 political.15.d: "การผอนคลายขอจํากัดวาโฆษณาชวนเชื่อตอตาน [Root.GetRulingParty] แบบใดบางที่เผยแพรในที่สาธารณะได สงผลใหมีการแสดงความเห็นตางตอสาธารณะเพิ่มขึ้นตามคาด การเดินขบวนที่จัดอยางเปนระบบและใบปลิวตาง ๆ จนถึงตอนนี้สวนใหญยังพบในสถาบันการศึกษาและในพื้นที่ที่ยากไรบางแหงของ [Root.GetName] แตก็แทบไมตองสงสัยเลยวาขบวนการนี้กําลังแพรขยาย\n\nบรรดาผูนําของชาติตางแตกแยกในประเด็นนี้ [Root.GetLeader] ผูกุมอํานาจนําในพรรคไวอยางเหนียวแนนราวกําปนเหล็ก แทบไมมีความตองการจะเปดใหการถกเถียงสาธารณะหลากหลายขึ้น ทวากาวแรกไดถูกกาวไปแลว และอาจไมมีทางหวนกลับ"
 political.15.a: "ดูเหมือนขบวนการนี้จะเติบโตขึ้นเองตามธรรมชาติเมื่อไมมีการปราบปราม"
 political.16.t: "ประชาชนเรียกรองการเลือกตั้ง"
 political.16.d: "การแสดงความเห็นตางของประชาชนซึ่งครั้งหนึ่งเคยจํากัดอยูเพียงบางพื้นที่ บัดนี้ไดแพรกระจายไปทั่ว ขณะที่ผูคนรวมตัวกันบนทองถนน [Root.GetRulingParty] ก็พบวาตนเองยืนอยูบนทางแยก หากเรายังปลอยใหโฆษณาชวนเชื่อนี้แพรกระจายตอไป การลงประชามติที่ถูกเสนอทั้งจากภายในพรรคเองและจากฝายคานอาจแสดงใหเห็นวาเราไมไดรับการสนับสนุนจากประชาชน ความเปนเอกภาพที่เราพยายามสรางมากําลังเปดทางใหแกความคิดเห็นอันหลากหลายที่รวมตัวกันตอตานเรา"
 political.16.a: "แมการปฏิรูปจะกําลังเกิดขึ้น เราก็ตองแสดงพลังดวยการปราบปรามการแข็งขอนี้"
 political.16.b: "ใหเสียงของประชาชนไดรับการรับฟง"
 political.17.t: "การเลือกตั้งทั่วไปใน [Root.GetName]"
 political.17.d: "เมื่อเสรีภาพในการแสดงออกและการชุมนุมไดรับการยอมรับมากขึ้นเรื่อย ๆ ใน [Root.GetName] กลุมภายใน [Root.GetRulingParty] ที่เรียกรองใหจัดการเลือกตั้งก็เปลี่ยนสถานะจากผูสมคบคิดลับ ๆ มาเปนนักปฏิรูปที่ไดรับการสนับสนุนจากสาธารณชน แม [Root.GetLeader] จะคัดคาน แตตลอดหลายเดือนที่ผานมาประเทศไดกาวเขาสูประชาธิปไตยอยางชา ๆ แตมั่นคง และการเลือกตั้งก็ดูจะเปนกาวตอไปที่เปนธรรมชาติ\n\nอยางไรก็ตาม พลเมือง [Root.GetAdjective] ไมไดเห็นดวยกับการปฏิรูปประชาธิปไตยทั้งหมด ภายในพรรคยังมีการถกเถียงกันวาควรชะลอการเลือกตั้งไวกอนจนกวาเราจะมั่นใจไดวาการพัฒนาจะเปนไปอยางมีเสถียรภาพหรือไม"
 political.17.a: "ผูที่ภักดีตอ [Root.GetRulingParty] จะสนับสนุนการตัดสินใจนี้ในตอนนี้"
 political.17.b: "การปฏิรูปตองไดรับการสนับสนุนที่กวางขวางกวานี้กอนจึงจะจัดการเลือกตั้งได"
 political.18.t: "ฟาสซิสตเรียกรองประชามติ"
 political.18.d: "ขบวนการฟาสซิสต [Root.GetAdjective] ที่เติบโตอยางรวดเร็วไมเคยอางวาตนตองไดเสียงสนับสนุนขางมากกอนจะยึดอํานาจ โดยหวังจะรวมชาติใหเปนหนึ่งภายใตการนําของพวกตนเมื่อสถาปนาการปกครองไดแลว อยางไรก็ตาม ดูเหมือนวาการสนับสนุนจากประชาชนที่มีตอพวกเขาจะเพิ่มขึ้นอยางรวดเร็ว ฟาสซิสตจํานวนมากในตอนนี้เรียก [Root.GetLeader] วาคนหนาไหวหลังหลอก ที่อางวาเปนตัวแทนความตองการของประชาชน แตในความเปนจริงกลับทําหูทวนลมตอมวลชน\n\nจนถึงตอนนี้ สมาชิก [Root.GetRulingParty] ปดตกขอเรียกรองใหลงประชามติวาเปนเพียงความพยายามปวนระบบตามแบบฉบับ แตอยางนอยมันก็ยังเปนวิธีการทางการเมือง หากเราไมลงมือตอนนี้ พวกฟาสซิสตอาจเลือกการตอสูดวยความรุนแรงเปนหนทางสูอํานาจที่ดีกวา"
 political.18.a: "ปราบปรามขบวนการแหงความเกลียดชังนี้!"
 political.18.b: "ไมตองไปสนใจพวกมัน"
 political.18.c: "หากประชาชนตองการ เราก็จะจัดการลงประชามติ"
 political.19.t: "คอมมิวนิสตเรียกรองประชามติ"
 political.19.d: "แนวคิดลัทธิมารกซหยั่งรากใน [Root.GetName] มานานแลว แตระยะหลังไดรับการสนับสนุนอยางกวางขวางขึ้นมาก ขบวนการนี้ไดแผขยายออกจากทฤษฎีการเมืองเขาสูการเมืองภาคปฏิบัติ โดยมีทั้งแรงงานที่ไมพอใจและแมแตคนดังที่มีชื่อเสียงบางคนออกมาแสดงการสนับสนุน พวกคอมมิวนิสตเรียกสิ่งนี้วาจิตสํานึกทางชนชั้น สวน [Root.GetRulingParty] เรียกมันวาทางลัดสูการจลาจลและการกบฏ\n\nดวยความไมเชื่อมั่นวา [Root.GetLeader] จะยอมดําเนินการปฏิรูปตามที่ตนเรียกรอง พวกคอมมิวนิสตที่เสียงดังกวาจึงเรียกรองใหลงประชามติโดยทันทีเพื่อปลดรัฐบาลปจจุบัน แมเราอาจพลิกกระแสของขบวนการมวลชนนี้ได แตหากลมเหลว ผลลัพธยอมหนีไมพนวิธีปลดรัฐบาลที่คอมมิวนิสตนิยมกวา นั่นคือ การปฏิวัติ"
 political.19.a: "กิจกรรมที่ไมใชวิถี [Root.GetAdjective] ตองถูกหยุดยั้ง!"
 political.19.b: "เมินพวกมันไป พวกนั้นแคกอกวนเทานั้น"
 political.19.c: "การลงประชามติยังดีกวาการลุกฮือนองเลือด"
 political.20.t: "ฝายประชาธิปไตยเรียกรองประชามติ"
 political.20.d: "ไมนาแปลกใจที่แนวคิดวาประชาชนควรเปนผูปกครองประเทศที่ตนอาศัยอยูจะไดรับความนิยมอยางงายดายในหมูประชาชน แนนอนวา [Root.GetRulingParty] มองแนวคิดประชาธิปไตยที่ขบวนการเหลานี้ยึดถือ ทั้งเสรีภาพในการพูด การเลือกตั้งทั่วไป และเสรีภาพสื่อ วาเปนเพียงวาทกรรมประชานิยมที่มุงบอนทําลายรัฐบาลของ [Root.GetLeader]\n\nอยางไรก็ตาม ไมอาจปฏิเสธไดวาแนวคิดเหลานั้นไดหยั่งรากในหมูประชากร [Root.GetAdjective] แลว ตามวิถีประชาธิปไตยแท พวกเขาเรียกรองใหมีการลงประชามติเพื่อเปลี่ยนระบอบปจจุบัน แมตอนนี้จะยังเมินเฉยไดงาย แตแนวคิดเชนนี้มักจะฝงแนนและดื้อดึงยิ่งขึ้นเรื่อย ๆ จะเกิดอะไรขึ้นกับเรา หากเราทําใหการปฏิวัติอยางสันติเปนไปไมได?"
 political.20.a: "จับกุมพวกมันใหหมด"
 political.20.b: "ดําเนินการตามปกติตอไป"
 political.20.c: "หากเรายอมรับการลงประชามติ บางทีเราอาจรักษามรดกของเราไวได"
 political.21.t: "ฟาสซิสตเดินขบวนสู [Root.Capital.GetName]"
 political.21.d: "หลังถูกปฏิเสธการลงประชามติ ซึ่งแทบเปนเพียงความพยายามเชิงสัญลักษณที่จะยึดอํานาจอยางถูกกฎหมาย พวกฟาสซิสตไดใชแรงสนับสนุนมหาศาลจากประชาชนและเสนสายในกองทัพ [Root.GetAdjective] พยายามกอรัฐประหาร รัฐบาล [Root.GetRulingParty] ไดปฏิเสธขอเรียกรองของพวกเขา และประกาศวาจะสูจนถึงที่สุดเพื่อรักษา [Root.GetName] ดังที่เรารูจักไว"
 political.21.a: "เราจะหยุดพวกมันไมวาตองแลกดวยอะไร!"
 political.21.b: "พวกฟาสซิสตคือผูสืบทอดจิตวิญญาณที่แทจริงของ [Root.GetName]!"
 political.22.t: "คอมมิวนิสตลุกฮือ"
 political.22.d: "หลังคําขอลงประชามติถูกปฏิเสธ นักปฏิรูปไมกี่คนในขบวนการคอมมิวนิสตของ [Root.GetName] ก็สูญเสียอิทธิพลอยางรวดเร็วใหแกกลุมหัวรุนแรง เมื่อ [Root.GetRulingParty] ปฏิเสธที่จะยอมรับการสนับสนุนของประชาชนตอการปฏิรูปที่เสนอ ภาพการปฏิวัติอันโรแมนติกก็คอย ๆ แพรหลายขึ้น และผูนําขบวนการก็กลายเปนคนที่ปลุกปนใหเกิดจลาจลไดงายที่สุด บัดนี้การจลาจลเหลานั้นไดปะทุขึ้นเปนสงครามกลางเมืองเต็มรูปแบบ โดยมีอนาคตของชาติเปนเดิมพัน"
 political.22.a: "เราจะไมยอมใหพวกมันทําลายประเทศของเรา!"
 political.22.b: "ไฟแหงการปฏิวัติตองดับดวยเลือดของผูกดขี่!"
 political.23.t: "ฤดูใบไมผลิแหง [Root.GetAdjective]"
 political.23.d: "หลังความพยายามจัดการลงประชามติเพื่อสถาปนาประชาธิปไตยถูกปฏิเสธ ผูอยูเบื้องหลังขอเสนอก็ประณามวาระบอบ [Root.GetLeader] นั้นเกินเยียวยา กลุมกบฏหลายกลุมรวมตัวกันเปนแนวรวมกวางขวาง ดวยเปาหมายรวมกันที่จะสถาปนาระบบการเมืองซึ่งเปนตัวแทนของประชาชนมากขึ้นใน [Root.GetName] พวกเขาไดจับอาวุธและประกาศวาจะไมหยุดจนกวา [Root.GetRulingParty] จะถูกโคนลม"
 political.23.a: "ชวยเราใหพนจากการปกครองของฝูงชนนี้ดวย!"
 political.23.b: "ในที่สุด [Root.GetName] ก็เปนอิสระ!"
 political.24.t: "ฟาสซิสตกลายเปนตัวตลก"
 political.24.d: "ดูเหมือนวาความหลงใหลของประชาชน [Root.GetAdjective] ในความภาคภูมิใจชาตินิยมและความพยายามฟนฟูความรุงโรจนในอดีตจะผานพนไปแลว นับเปนการตื่นจากฝนอยางเจ็บปวดสําหรับผูสนับสนุนตัวยง ซึ่งเครื่องแบบ ทาทีแบบทหารนิยม และสุนทรพจนที่เกินจริงของพวกเขา บัดนี้กลายเปนเปาการลอเลียนมากกวาความเห็นใจ\n\nลัทธิฟาสซิสต [Root.GetAdjective] ซึ่งครั้งหนึ่งเคยถูกมองวาเปนภัยตอฐานอํานาจของ [Root.GetRulingParty] บัดนี้ถูกมองมากขึ้นเรื่อย ๆ วาเปนจุดยืนสุดโตงอันไรสาระ และเปนการโจมตีคุณคาพื้นฐานที่สุดของชาติเรา ชาติเดียวกับที่พวกเขาอางวาเทิดทูนยิ่งนัก คํานี้ดูเหมาะจะใชเปนคําดามากกวาชื่อเรียกทางการเมือง"
 political.24.a: "ชางเปนฝูงตัวตลกเสียจริง"
 political.25.t: "กระแสคอมมิวนิสตซาลง"
 political.25.d: "คอมมิวนิสตจํานวนมากเคยทํานายวา [Root.GetName] จะเปนชาติถัดไปที่ตกอยูใตสิ่งที่เรียกวาการปฏิวัติสากล แตหลังการนัดหยุดงานและธงแดงบนทองถนนอยูไมกี่เดือน ขบวนการนี้ดูเหมือนจะซบเซาลง ชนชั้นแรงงานซึ่งควรจะเปนพลังขับเคลื่อนการปฏิวัติ กลับมีเรื่องเรงดวนกวาการโคน [Root.GetLeader] และดูไมประทับใจเลยกับผลลัพธของการปฏิวัติในที่อื่น ๆ ขณะเดียวกัน ปญญาชนที่เคยเขียนขอเรียกรองอันรอนแรงใหเชือดคอผูกดขี่ กลับลังเลอยางนาประหลาดที่จะปลุกปนสิ่งใดที่อาจกระทบวิถีชีวิตอันสุขสบายของตนจริง ๆ\n\nการพูดถึงการปฏิวัติคงจะดําเนินตอไป ไมวาจะในวงเบียรราคาถูกหรือไวนราคาแพง แตก็คงเปนแคการพูด ไมมีอะไรมากกวานั้น"
 political.25.a: "ชางเปนพวกปากวาตาขยิบเสียจริง"
 political.26.t: "ขบวนการประชาธิปไตยเงียบหาย"
 political.26.d: "หลังการตอตานอยางเสียงดังตอระบอบของ [Root.GetLeader] อยูไมกี่เดือน ทั้งเรียกรองการเลือกตั้งทั่วไปและกฎหมายที่เสรีขึ้นเรื่องเสรีภาพในการชุมนุมและการพูด ขบวนการนี้ก็ดูเหมือนจะแตกสลายไป ผูคนในตอนนี้แสดงความกังวลมากขึ้นเกี่ยวกับเสถียรภาพของ [Root.GetName] หากการปฏิรูปเชนนั้นเกิดขึ้นจริง สวนผูที่เรียกรองประชาธิปไตยก็ถูกมองวาเปนตัวปวนมากกวาสิ่งอื่นใด\n\nที่ลึกลับกวานั้นคือ บุคคลสําคัญหลายคนของขบวนการดูเหมือนจะหายตัวไปหรือหยุดเคลื่อนไหวอยางกะทันหัน บางทีบางคนอาจเลือกลี้ภัยเมื่อเห็นวาความพยายามของตนลมเหลว ไมวาอยางไร รัฐบาล [Root.GetRulingParty] ปฏิเสธวาไมรูเห็นและไมมีสวนเกี่ยวของใด ๆ ทั้งสิ้น"
 political.26.a: "ชางเปนพวกยอมแพงายเสียจริง"
 political.27.t: "[Root.GetLeader] ละทิ้งนโยบายตางประเทศแบบเปนกลาง"
 political.27.d_fascism: "หลังจาก [Root.GetRulingParty] ขึ้นสูอํานาจเมื่อไมนานมานี้ [Root.GetLeader] ไดประกาศวา [Root.GetName] จะไมยึดถือนโยบายตางประเทศแบบเปนกลางอีกตอไป\n'โลกไดกลายเปนสิ่งที่ยุงเหยิงและซับซอน เราไมปลอดภัยอีกตอไปหากยืนอยูลําพัง เราตองยืนหยัดเคียงขางพันธมิตรฟาสซิสตของเราเพื่อตอสูกับศัตรู หากเราไมเลือกขาง เราจะพินาศอยางโดดเดี่ยว'"
 political.27.d_communism: "หลังจาก [Root.GetRulingParty] ขึ้นสูอํานาจเมื่อไมนานมานี้ [Root.GetLeader] ไดประกาศวา [Root.GetName] จะไมยึดถือนโยบายตางประเทศแบบเปนกลางอีกตอไป\n'โลกไดกลายเปนสิ่งที่ยุงเหยิงและซับซอน ประเทศนี้ยืนหยัดบนหลักการของตนและพรอมปกปองหลักการเหลานั้นมาโดยตลอด เราไมปลอดภัยอีกตอไปหากยืนอยูลําพัง ความเปนกลางไมใชที่หลบภัยอันปลอดภัยเหมือนเคยอีกแลว และผูที่แสวงหาอํานาจในโลกนี้ก็ไมเคารพมัน เราตองยืนหยัดเคียงขางพี่นองคอมมิวนิสตของเราเพื่อตอสูกับมหาอํานาจที่หมายจะกดขี่เรา ตอสูกับเสียงขางมากชนชั้นกระฎมพีที่ไมตองการอะไรมากไปกวาการกดเราไวใตเทา หากเราไมยืนหยัด เราจะพินาศอยางโดดเดี่ยว'"
 political.27.a: "เพื่ออนาคตของ [Root.GetName]"
 political.28.t: "[Root.GetNameDefCap] กลับมารวมเปนหนึ่ง"
 political.28.d: "สงครามกลางเมืองอันเลวรายที่ทําลายแผนดินของเรากําลังจะสิ้นสุดลง และในที่สุดเราก็บรรลุขอตกลงทางการเมืองได บัดนี้เรามองเห็นตรงกันกับชาว [Root.GetAdjective] ดวยกัน และเราจะรวมกันฟนฟูชาติอันยิ่งใหญของเรา ศัตรูที่หมายจะฉวยประโยชนจากความขัดแยงภายในของเรา บัดนี้ตองเผชิญหนากับรัฐ [Root.GetAdjective] ที่เปนปกแผน\n\n[Root.GetName] แบบ [Root.GetRulingIdeology] ใหม จะไมมีวันถูกแบงแยกอีก!"
 political.28.a: "ในที่สุดก็รวมเปนหนึ่ง!"
 political.29.t: "ความขัดแยงภายในสิ้นสุดลง"
 political.29.d: "สงครามกลางเมืองที่แบงแยกชาติของเราไดสิ้นสุดลงแลว และฝายเราไดรับชัยชนะ อยางไรก็ตาม เราไมอาจปลอยใหผูที่สนับสนุนศัตรูของเราเผยแพรโฆษณาชวนเชื่ออันแยบยลในหมูประชาชนตอไปได ในวันขางหนาจําเปนตองใชมาตรการที่เด็ดขาด เพื่อใหเรายืนหยัดอยางเปนปกแผน พรอม และเขมแข็ง ตอตานภัยคุกคามจากภายนอกใด ๆ ที่อาจเปนอันตรายตอรัฐบาลที่เพิ่งตั้งไขของเรา"
 political.29.a: "จะดําเนินการตามนั้น"
 political.31.t: "กระแสการรวมชาติ [ROOT.GetAdjective]"
 political.31.desc: "สงครามไดแบงแยกประเทศของเรา บัดนี้เมื่อเรากลับมาอยูในสันติภาพอีกครั้ง ก็ถึงเวลาเริ่มฟนฟูประเทศ มีแรงผลักดันอยางมากใหรวมชาติกันในหมูฝาย [ROOT.GetAdjective] ที่ยึดถือแนวทาง [ROOT.GetRulingIdeology]"
 political.31.a: "เราควรสนับสนุนเรื่องนี้"
 political.31.b: "อยูหาง ๆ ไวดีกวา ปลอยใหอดีตเปนอดีต"
 political.32.t: "การรวมชาติ [ROOT.GetAdjective]"
 political.32.desc: "ถึงเวลาแลวที่จะรวมฝาย [ROOT.GetAdjective] แนวทาง [ROOT.GetRulingIdeology] ที่แตกแยกกันหลังสงครามใหกลับมาเปนหนึ่งเดียว [ROOT.GetNameDefCap] จะกลับมาสมบูรณอีกครั้ง"
 political.32.a: "[ROOT.GetName] ที่กลับมารวมเปนหนึ่ง"
 political.33.t: "[ROOT.GetCountryAppropriateFilmProduction]"
 political.33.desc: "เพื่อยกระดับทัศนคติของประชาชนที่มีตอความพยายามในการทําสงคราม รัฐมนตรีฝายโฆษณาชวนเชื่อของเราไดคัดเลือกภาพยนตรชั้นเยี่ยมเรื่อง '[ROOT.GetCountryAppropriateFilmProduction]' ซึ่งใหประสบการณการชมอันยอดเยี่ยมพรอมความรูสึกรักชาติอันแรงกลา ออกฉายทั่วประเทศ\n\nเราหวังวานี่จะเปนจุดเริ่มตนของธรรมเนียมอันยาวนานและนาจดจําของอุตสาหกรรมภาพยนตรรักชาติของเรา ผลลัพธจนถึงตอนนี้ยอดเยี่ยมมาก"
 political.33.a: "สุดยอดผลงานชิ้นเอก"
 britain.1.t: "ภารกิจทิซารด"
 britain.1.d: "รัฐบาลอังกฤษไดสงคณะผูแทนดานวิทยาศาสตรซึ่งนําโดยเฮนรี ทิซารด มาพรอมขอเสนอที่นาสนใจ อังกฤษยินดีจะรวมความพยายามดานการวิจัยกับเราในหลายสาขาสําคัญ เนื่องจากพวกเขาไมมีกําลังการผลิตทางอุตสาหกรรมมากพอจะผลิตสิ่งประดิษฐของตนในจํานวนที่เพียงพอ"
 britain.1.a: "ขอเสนอที่ยอดเยี่ยม!"
 britain.1.b: "ไม อังกฤษตองพึ่งตัวเอง"
 britain.1.c: "เราควรมุงสูความรวมมือระยะยาวกวานี้"
 britain.2.t: "ภารกิจทิซารดสําเร็จ"
 britain.2.d: "รัฐบาลสหรัฐอเมริกาไดตอบรับขอเสนอของเราและแบงปนขอมูลการวิจัยบางสวนใหแกคณะผูแทนของเรา"
 britain.2.a: "ดีเยี่ยมไปเลย!"
 britain.3.t: "ภารกิจทิซารดถูกปฏิเสธ"
 britain.3.d: "รัฐบาลสหรัฐอเมริกาไดปฏิเสธขอเสนอของเรา เราจะไมไดรับความชวยเหลือใด ๆ จากพวกเขา"
 britain.3.a: "เจาพวกนารําคาญ!"
 britain.4.t: "ถนนสายพมา"
 britain.4.d: "เพื่อชวยเหลือการทําสงครามของเรากับญี่ปุน สหราชอาณาจักรไดปรับปรุงโครงสรางพื้นฐานและสรางฐานทัพอากาศตามแนวชายแดนพมาของเรา"
 britain.4.a: "ขับไลพวกสุนัขรับใช!"
 japan.16.t: "รัฐหุนเชิดของญี่ปุน"
 japan.16.d: "ญี่ปุนตองการควบคุมความมั่งคั่งของจีน และจะไมหยุดจนกวาจะเกิดสงคราม หากเราไมตองการสูรบกับพวกเขา เราก็ตองยอมอยูใตการควบคุมและกลายเปนเพียงรัฐหุนเชิดของญี่ปุน"
 japan.16.a: "เราสูไมได"
 japan.16.b: "เราตองสู!"
 japan.17.t: "จีนยอมจํานน"
 japan.17.d: "พวกจีนขี้ขลาดยอมทําตามขอเรียกรองของเราอีกครั้ง พวกเขาตกลงจะเปนเพียงรัฐหุนเชิดของชาติเรา"
 japan.17.a: "ความสูญเสียของพวกเขาคือผลประโยชนของเรา!"
 japan.18.t: "จีนปฏิเสธ"
 japan.18.d: "พวกจีนโงเขลาไดปฏิเสธคําขออันสมเหตุสมผลของเราที่จะเขาไปจัดการบางสวนของรัฐบาลพวกเขา หากเราตองการเขาถึงทรัพยากรของพวกเขา เราจําเปนตองพิชิตพวกเขา"
 japan.18.a: "ไมนายากหรอก!"
 britain.6.t: "เอกราชของอินเดีย"
 britain.6.d: "เมื่อสี่ปกอน เราสัญญาวาจะใหเอกราชแกอินเดียภายในสี่ป บัดนี้ครบกําหนดแลว และชาวอินเดียตองการใหเรารักษาสัญญา เพชรเม็ดงามบนมงกุฎควรออกจากจักรวรรดิอังกฤษหรือไม?"
 britain.6.a: "ถึงเวลาตองปลอยไป"
 britain.6.b: "ไมมีวัน!"
 japan.15.t: "กองทัพแหงชาติอินเดีย"
 japan.15.d: "จากการที่เราไดชัยเหนืออังกฤษ เราจึงมีเชลยศึกชาวอินเดียจํานวนมาก หากโนมนาวอยางถูกวิธี เราอาจใชเชลยเหลานี้เสริมกําลังกองทัพของเราได..."
 japan.15.a: "เพื่อความยุติธรรมอันยิ่งใหญ!"
 JAP_Indian_National_Army_arrives: "กองทัพแหงชาติอินเดียสองกองพลเดินทางมาถึงสิงคโปร"
 britain.7.t: "ยุติการคากับเยอรมนี"
 britain.7.d: "สหราชอาณาจักรไดยื่นคําขาดถึงเรา: ไมเราหยุดคาขายกับเยอรมนี ก็พวกเขาจะบุกเขามา"
 britain.7.a: "ยังไงฉันก็ไมเคยชอบพวกเยอรมันอยูแลว"
 britain.7.b: "เราจะคาขายกับใครก็ไดที่เราตองการ!"
 britain.8.t: "ขอเรียกรองถูกปฏิเสธ!"
 britain.8.d: "[From.GetName] ไดปฏิเสธขอเรียกรองของเราที่ใหยุติการคากับเยอรมนี"
 britain.8.a: "ถาเชนนั้นก็สงคราม!"
 britain.8.b: "เราบังคับพวกเขาไมได"
 britain.9.t: "แชมเบอรเลนลาออก"
 britain.9.d: "เมื่อสงครามดําเนินไปในทางที่เปนผลเสียตอเราและพันธมิตร นายกรัฐมนตรีก็ถูกโจมตีอยางหนักจากการตัดสินใจทั้งในยามสงบและยามสงครามในชวงหัวเลี้ยวหัวตอสําคัญ ในขณะที่บริเตนจําเปนตองยืนหยัดอยางเปนปกแผนยิ่งกวาครั้งใด กลับพบวาตนเองแตกแยก เมื่อสมาชิกรัฐสภาบางสวนดูหมิ่นแชมเบอรเลน\n\nเมื่อขาดการสนับสนุนสําคัญจากพรรคแรงงาน นายกรัฐมนตรีจึงตัดสินใจลาออก โดยสนับสนุนลอรดแฮลิแฟกซใหเปนผูสืบทอดตําแหนง อยางไรก็ตาม แฮลิแฟกซยังลังเล และแชมเบอรเลนจึงกราบทูลแนะนําพระมหากษัตริยใหทรงเรียกวินสตัน เชอรชิลล เชอรชิลลผูเตือนมานานถึงสงครามที่บัดนี้มาถึงตัวเรา เชื่อกันวาเปนผูที่สามารถนําพาเราฝาสงครามครั้งนี้ไปได"
 britain.9.a: "เราจะไมมีวันยอมแพ"
 britain.10.t: "แชมเบอรเลนถึงแกกรรม"
 britain.10.d: "นายกรัฐมนตรีเนวิลล แชมเบอรเลน ลมปวยลงเมื่อไมนานมานี้ แมกอนหนานี้โดยรวมจะมีสุขภาพดีเมื่อเทียบกับวัย หลังไดรับการวินิจฉัยวาเปนมะเร็งลําไส ความเจ็บปวดที่เพิ่มขึ้นและการนอนไมหลับทําใหเขาลาออกจากตําแหนง แชมเบอรเลนยังคงไดรับความนิยมจากประชาชนอยางสูง และยอมลงจากตําแหนงในฐานะทางเลือกสุดทายเทานั้น เมื่อตระหนักวาตนคงไมมีชีวิตอยูจนไดกลับมาทํางาน\n\nคําถามที่ยังคางอยูคือ ใครจะรับไมตอจากรัฐบุรุษผูยิ่งใหญผูนี้ และนําบริเตนฝาชวงเวลามืดมนที่อาจยังรออยูเบื้องหนา"
 britain.10.a: "วินสตัน เชอรชิลล คือผูที่จักรวรรดิตองการ"
 britain.10.b: "ลอรดแฮลิแฟกซคือตัวเลือกแรกของแชมเบอรเลน"
 britain.21.t: "ภารกิจทิซารดประสบความสําเร็จอยางงดงาม"
 britain.21.d: "รัฐบาลสหรัฐอเมริกาไมเพียงตอบรับขอเสนอแรกของเรา แตยังเสนอความรวมมือระยะยาวระหวางนักวิจัยของทั้งสองชาติดวย"
 britain.21.a: "ยอดเยี่ยม!"
 soviet.18.t: "กรณีซีอาน"
 soviet.18.d: "แรงกดดันจากภายนอกโดย [SOV.GetNameDef] ใหยุติการสูรบระหวางเรากับกองทัพแดงจีน ทําใหบางคนในแวดวงของเราลงมือจัดการเรื่องนี้เอง นายพลสองคนไดจับกุม [Root.GetLeader] เพื่อพยายามบังคับใหเกิดการพักรบระหวางเรากับฝายคอมมิวนิสต และรวมจีนเปนหนึ่งเพื่อตอตานภัยคุกคามจากภายนอก แรงกดดันจากนานาชาติใหหาทางออกอยางสันติ ประกอบกับความออนแอของจีนที่แตกแยกในยุคนี้ ลวนเปนปจจัยที่สนับสนุนการจัดตั้งแนวรวม เราควรเลือกทางใด?"
 soviet.18.a: "ติดตอพรรคคอมมิวนิสตเพื่อเจรจาสันติภาพ"
 soviet.18.b: "ไมมีวัน!"
 soviet.19.t: "ฝายชาตินิยมเสนอพักรบ"
 soviet.19.d: "ความขัดแยงภายในฝายชาตินิยมไดนําไปสูสถานการณที่ลอแหลม ผูนําของพวกเขา [From.GetLeader] ถูกจับกุมเพื่อบีบใหศัตรูของเรายอมพักรบกับเรา และรวมจีนเปนหนึ่งเพื่อตอตานศัตรูตางชาติ แมเราอยากเห็นผูนํากกมินตั๋งถูกลงโทษจากอาชญากรรมที่กอตอเรา แตนี่เปนโอกาสหายากที่จะรวมมือกันและทําใหมั่นใจวาจีนจะไมตกอยูในมือของจักรวรรดินิยมตางชาติ"
 soviet.19.a: "เรายอมรับการพักรบไปกอน"
 soviet.19.b: "การปฏิวัติจะถูกพักไวเพราะเรื่องนี้ไมได!"
 soviet.20.t: "จีนคณะชาติปฏิเสธการเจรจา"
 soviet.20.d: "แม [From.GetLeader] จะถูกลักพาตัว แตฝายชาตินิยมก็ปฏิเสธที่จะเขารวมการเจรจาพักรบกับฝายคอมมิวนิสต นาเสียดายที่จีนจะยังคงขัดแยงอยางรุนแรงกับประชาชนของตนเอง ทําใหตกเปนเหยื่ออันงายดายของศัตรู"
 soviet.20.a: "เราทําดีที่สุดแลว"
 soviet.21.t: "การพักรบในสงครามกลางเมืองจีน"
 soviet.21.d: "การเจรจาที่ซีอานไดผลแลว ทั้งฝายชาตินิยมและฝายคอมมิวนิสตตกลงพักรบ ยุติการสูรบอยางนอยเปนการชั่วคราว และเปดโอกาสใหทั้งสองฝายรวมมือกันตอตานภัยคุกคามจากตางชาติ"
 soviet.21.a: "จีนยังมีความหวังอยู"
 soviet.22.t: "จีนคอมมิวนิสตปฏิเสธการเจรจา"
 soviet.22.d: "แมนายพลกกมินตั๋งจะพยายามอยางเต็มที่เพื่อใหเกิดการพักรบกับผูนําพรรคคอมมิวนิสต แตฝายคอมมิวนิสตปฏิเสธที่จะสงบศึกแมเพียงชั่วคราว ตราบใดที่ผูนําฝายชาตินิยมยังมีชีวิตอยู ดูเหมือนวาการสูรบจะไมยุติลงงาย ๆ"
 soviet.22.a: "หากเปนเชนนี้ ศัตรูของจีนอาจแบงแยกแลวพิชิตได"
 soviet.23.t: "[SOV.GetNameDefCap] ยกดินแดนให"
 soviet.23.d: "[SOV.GetNameDefCap] มีภัยคุกคามอื่นที่ตองกังวล และไมตองการเพิ่มความเปนปรปกษกับจักรวรรดิของเราอีก เพื่อแสดงความปรารถนาใหเกิดสันติภาพระหวางสองชาติ พวกเขาไดยกดินแดนบางสวนใหแกเรา โดยหวังวาจะชวยกระชับความสัมพันธทางการทูต"
 soviet.23.a: "บางทีนี่อาจเปนจุดเปลี่ยน"
 soviet.24.t: "แนวรวมที่หา"
 soviet.24.d: "การกวาดลางศัตรูของประชาชน ผูที่หมายจะพลิกกลับหรือบอนทําลายการปฏิวัติ เปนนโยบายที่ดําเนินมาตลอดนับแตพรรคขึ้นสูอํานาจ การแยงชิงอํานาจภายในที่ตามมาไดเปลี่ยนจุดสนใจของเรา และการกวาดลางภายในพรรคเองก็ไดรับความสําคัญมากขึ้นนับตั้งแตทรอตสกีถูกเนรเทศ สตาลินไดสรางตนเองใหเปนสัญลักษณ แตตองแลกดวยการสรางศัตรูตัวจริงมากมายและศัตรูในจินตนาการนับไมถวน\n\nดวยความที่เคยผานการแยงชิงอํานาจภายในที่เลวรายที่สุดมาแลว เลขาธิการใหญจึงพรอมจะลงมือแมมีเพียงความสงสัยเล็กนอย การถูกกวาดลางออกจากพรรคหมายถึงการถูกจําคุกหรือความตาย ชวงเวลามืดมนรออยูขางหนาสําหรับผูที่แสดงความไมภักดี หรือแมแตผูที่แสดงความภักดีมากเกินไปจนดูไมนาเชื่อถือ"
 soviet.24.a: "ซีโนเวียฟกับพวกพองยังติดตอกับทรอตสกีอยูหรือไม?"
 soviet.25.t: "การพิจารณาคดีศูนยกลางทรอตสกีตอตานโซเวียต"
 soviet.25.d: "แมเลฟ ทรอตสกีจะถูกบังคับใหลี้ภัยไปแลว แต $SOV_iosif_stalin$ ก็หวาดกลัววาเขายังมีผูสนับสนุนลับ ๆ อยูในพรรค การจับกุมอยางฉับไวหลายระลอกและการสอบสวนอยางโหดเหี้ยมไดคําสารภาพและคําใหการที่ชี้ไปยังคูแขงบางคนของสตาลินอยางเหมาะเจาะ ทวายิ่งมีคําถามมากขึ้น และยิ่งตํารวจลับขุดคุยจดหมายและบันทึกลึกลงไป ผูคนก็ยิ่งถูกพัวพันมากขึ้น แมจะเปนทางออมก็ตาม\n\nสมาชิกพรรคเริ่มเชื่อวาอํานาจเบ็ดเสร็จของสตาลินและการเสียชีวิตของภรรยาไดทําใหเขาโดดเดี่ยวจนมองทุกคนเปนภัยคุกคาม แตนั่นไมใชสิ่งที่คนทรยศจะพูดหรอกหรือ?"
 soviet.25.a: "ภรรยาของคาลินินถูกสงสัย ตัวเขาเองก็ไวใจไมไดเชนกัน"
 soviet.25.b: "ครุสชอฟเคยของแวะกับลัทธิทรอตสกีในอดีต เขาตองไป"
 soviet.25.c: "คําสารภาพของราเดคชี้ไปยังหลายคนในพรรค"
 soviet.25.e: "สมาชิกพรรคไวใจได ความหวาดระแวงนี้ตองยุติลง"
 soviet.26.t: "การพิจารณาคดีลับเหลานายพล"
 soviet.26.d: "กองทัพแดงเปนที่อยูของกลุมบอนทําลายมาโดยตลอด นับตั้งแตทรอตสกีเองดํารงตําแหนงผูบังคับการฝายสงคราม เอกสารที่ NKVD ไดมาบงชี้วานายทหารระดับสูงหลายนายไมเพียงเปนผูทรยศ แตยังเปนสายลับ มีฮาอิล ตูฮาเชฟสกี เปนหนึ่งในผูตองสงสัยที่โดดเดนที่สุด และเปนคนที่สตาลินกระหายจะกําจัดออกจากกองทัพ ขณะเดียวกัน การที่กองทัพเรือติดตอกับชาวตางชาติบอยครั้งก็ทําใหนายทหารเรือจํานวนมากถูกจับกุมเชนกัน\n\nแมจะมีเอกสารจากฝายศัตรูที่พิสูจนความผิดของพวกเขา แตก็ไมอาจรูไดวาศัตรูปลอมแปลงเอกสารเหลานั้นขึ้นมา หรือไดรับขอมูลเท็จจากผูที่ตองการใหการกวาดลางครั้งนี้เกิดขึ้นตั้งแตแรก"
 soviet.26.a: "ตูฮาเชฟสกีตองถูกพิจารณาคดีลับและประหารชีวิตทันที"
 soviet.26.b: "โรคอสซอฟสกีปฏิเสธที่จะสารภาพ แตจะปลอยใหมีชีวิตอยูไมได"
 soviet.26.c: "เอกสารปลอมและคําสารภาพที่ถูกบังคับไมใชหลักฐาน"
 soviet.27.t: "การพิจารณาคดี 21 คน"
 soviet.27_tt: "เพิ่มบทลงโทษจาก §Yการกวาดลางนายทหาร§!"
 soviet.27_tt2: "§Rจะนําไปสูสงครามกลางเมืองในอนาคต§!"
 soviet.27.d: "หลังการจับกุมและการพิจารณาคดีหลายระลอก การกวาดลางครั้งใหญไดถักทอเรื่องราวที่นํามาสูการพิจารณาคดีนี้ ผูถูกกลาวหาไมไดมีเพียงผูนํารุนเกาอยางนิโคไล บูฮาริน แตยังรวมถึงนักการทูต นักการเมือง เจาหนาที่ทหาร และแมแตเจาหนาที่ระดับสูงของ NKVD อีกจํานวนมาก ขอกลาวหาก็กวางขวางกวาครั้งกอน รวมถึงแผนการเมื่อนับสิบปกอนที่จะสังหารผูนําโซเวียตและขายสหภาพใหแกศัตรู\n\nการที่ NKVD เองตกเปนเปาหมายของการกวาดลางในตอนนี้ ในแงหนึ่งก็ทําใหกระบวนการทั้งหมดวนกลับมาครบรอบ การขมขูและการทุบตีทําใหหลายคนสารภาพทุกขอกลาวหา แมแตขอที่พิสดารที่สุด จําเลยคนสําคัญตองเผชิญกับโทษประหาร"
 soviet.27.a: "กองทัพเรือและกองทัพอากาศรอดตัวไปงาย ๆ มาจนถึงตอนนี้"
 soviet.27.b: "อยางที่เราสงสัย ศัตรูอยูทุกหนแหง"
 soviet.27.c: "เรื่องนี้เลยเถิดเกินไปแลว อีกไมนานเราคงฆาพวกเดียวกันจนหมด"
 soviet.28.t: "รัฐประหารของฝายทรอตสกี"
 soviet.28.d: "โลกอาจไมมีวันรูวาการกวาดลางของสตาลินเล็งเปาไปยังคนที่ถูกตองหรือไม หรือเขาสรางศัตรูมากขึ้นจากการพยายามกําจัดผูนิยมทรอตสกีทุกคนในพรรค สิ่งที่รูคือ สิ่งที่เขาหวาดกลัวไดเกิดขึ้นจริงในที่สุด วันนี้ เลฟ ทรอตสกีไดปรากฏตัวอีกครั้งหลังกลับจากการลี้ภัย และดวยการสนับสนุนจากสมาชิกพรรคผูทรงอิทธิพลหลายคนและเจาหนาที่ NKVD เขาไดกอรัฐประหารโคนลมการปกครองของสตาลิน\n\nอดีตเลขาธิการใหญถูกโจมตีในบานพักดวยขวานนํ้าแข็ง และถูกประหารชีวิตอยางรวดเร็วพรอมกับผูสนับสนุนหลายคน การทลายลัทธิบูชาตัวบุคคลที่เขาสรางขึ้นจะตองใชเวลา แตอยางนอยตอนนี้ประชาชนก็รูแลววาเขาไมไดเปนอมตะ\n\n หนึ่งในผูรอดชีวิตไมกี่คนที่หลบหนีไปไดคืออีวาน โคเนฟ ผูสนับสนุนสตาลินอยางแข็งขันผูนี้สามารถรวบรวมผูสนับสนุนไดจํานวนหนึ่ง และประกาศสงครามกับรัฐบาลของทรอตสกี เพื่อพยายามยึดอํานาจคืนและ 'ทําใหวิสัยทัศนของสหายสตาลินเปนจริง'"
 soviet.28.a: "ผูนํามาแลวก็ไป แตประชาชนยังคงอยู"
 soviet.29.t: "ฝรั่งเศสตองการเขารวมโคมินเทิรน"
 soviet.29.d: "สหายของเราในพรรคคอมมิวนิสตฝรั่งเศส (Parti Communiste Français) ไดกาวหนาไปอยางมาก ชาติฝรั่งเศสพรอมแลวที่จะเขารวมโคมินเทิรน"
 soviet.29.a: "ยินดีตอนรับสมาชิกใหม"
 soviet.29.b: "ไม!"
 soviet.100.t: "คอมมิวนิสตผอนทาที"
 soviet.100.d: "เนื่องจาก [SOV.GetNameDef] และเรากําลังทําสงครามกับศัตรูรวมกัน ดูเหมือนวาพวกเขาจะลดการสนับสนุนพรรคคอมมิวนิสตภายในประเทศของเราลง"
 soviet.100.a: "ดีใจที่พนจากพวกนั้นเสียที!"
 yugoslavia.1.t: "หนุนหลังรัฐประหารในยูโกสลาเวีย"
 yugoslavia.1.d: "กระแสตอตานฝายอักษะในยูโกสลาเวีย ซึ่งเราพยายามถวงดุลมานานเพื่อใหประเทศนี้คงความเปนกลางและใหเรารวมมือกับผูนําชุดปจจุบันตอไปได ไดมาถึงจุดวิกฤตเมื่อชาตินี้พยายามรวมมือกับเยอรมนีครั้งใหม แมพันธมิตรหลายชาติของเยอรมนีจะมีผลประโยชนทางดินแดนในยูโกสลาเวีย แตผูนําของพวกเขาก็เลือกที่จะยอมใหกองทหารเยอรมันเขามาในประเทศ\n\nกลุมหนึ่งในกองทัพอากาศยูโกสลาเวียกําลังหาทางโคนลมรัฐบาลที่ฝกใฝเยอรมนี แมนี่อาจเสี่ยงทําใหภูมิภาคไรเสถียรภาพยิ่งขึ้น แตก็จะยุติความรวมมือของพวกเขากับเยอรมนีได สายลับขาวกรองของเราควรสนับสนุนรัฐประหาร หรือพยายามโนมนาวฝายตอตานเยอรมนีใหชะลอไวกอน?"
 yugoslavia.1.a: "ชวยเหลือรัฐประหารผาน SOE"
 yugoslavia.1.b: "เกลี้ยกลอมผูวางแผนใหลมเลิก"
 yugoslavia.2.t: "รัฐประหาร"
 yugoslavia.2.d: "ขณะที่ [Root.GetLeader] พยายามรักษาความสัมพันธอันดีกับเยอรมนี ความไมพอใจภายในประเทศตอการรวมมือกับเยอรมันก็เพิ่มพูนขึ้น โดยเฉพาะพวกชาตินิยมเซิรบที่คัดคานทิศทางการทูตนี้ และเสียงตอตานของประชาชนก็ดังกระหึ่ม วันนี้ นายทหารในกองทัพอากาศไดพยายามกอรัฐประหาร โดยประกาศวาพระเจาปเตอรที่ 2 ผูทรงพระเยาวทรงบรรลุนิติภาวะแลว และอัญเชิญขึ้นครองราชบัลลังก รัฐประหารครั้งนี้ซึ่งไดรับการหนุนหลังจากหนวยขาวกรองของศัตรูเยอรมนี มุงจะตัดขอตกลงของเราใหสิ้นสุดลง นี่อาจหมายถึงสงคราม"
 yugoslavia.2.a: "ยอมทําสงครามดีกวายอมรับกติกาสัญญา!"
 yugoslavia.2.b: "เราขอสูกับคณะรัฐประหารดีกวาสูกับเยอรมัน"
 yugoslavia.3.t: "การประชุมลอนดอน"
 yugoslavia.3.d: "ความหวังของเราที่จะไมตองเผชิญภัยคุกคามจากเยอรมนีเพียงลําพังไดเปนจริงแลว พลังของจักรวรรดิอังกฤษและพันธมิตรจะยืนหยัดเคียงขางเรา"
 yugoslavia.3.d_FRA_abandoned_yugoslavia: "ความหวังของเราที่จะไมตองเผชิญภัยคุกคามจากเยอรมนีเพียงลําพังไดเปนจริงแลว พลังของจักรวรรดิอังกฤษและพันธมิตรจะยืนหยัดเคียงขางเรา นาเสียดายที่ฝรั่งเศสเลือกเดินทางของคนขี้ขลาด"
 yugoslavia.3.a: "ยูโกสลาเวียจะยืนหยัดอยางเสรี"
 yugoslavia.4.d: "ความหวังของเราที่จะไมตองเผชิญภัยคุกคามจากเยอรมนีเพียงลําพังไดเปนจริงแลว แมพลังที่กําลังเสื่อมถอยของจักรวรรดิอังกฤษจะไมไดอยูขางเรา แตจักรวรรดิฝรั่งเศสอันทรงพลังจะยืนหยัดเคียงขางเรา"
 yugoslavia.4.a: "เราจะไดรับชัยชนะ!"
 yugoslavia.5.t: "คําบัญชาแหงลอนดอน!"
 yugoslavia.5.d: "เมื่อเผชิญหนากับเยอรมนีที่ผงาดขึ้นอีกครั้งและฉีกสนธิสัญญาที่เคยรักษาสันติภาพไว พวกขี้ขลาดในตะวันตกก็โยนเราใหฝูงหมาปา โดยหวังวาเราจะชวยบรรเทาความหิวกระหายของพวกมัน ประวัติศาสตรจะตัดสินพวกเขาอยางไมปรานี แตตอนนี้เราตองเลือกชะตากรรมของตนเอง"
 yugoslavia.5.a: "การตอตานจะนําไปสูความตายอันไรประโยชนเทานั้น"
 yugoslavia.5.b: "เราจะสูจนถึงที่สุด"
 yugoslavia.6.t: "การประชุมลอนดอน"
 yugoslavia.6.d: "เมื่อทุกชาติตางทอดทิ้งเรา มีเพียงอิตาลีที่ยืนหยัดเคียงขาง บัดนี้อิตาลีคือมิตรแทที่สุดของเรา และเราจะสูไปดวยกัน"
 yugoslavia.6.a: "ขอพระเจาคุมครองเรา"
 yugoslavia.7.t: "ชะตากรรมของยูโกสลาเวีย"
 yugoslavia.7.d: "[From.GetNameDefCap] เรียกรองใหเรามอบอํานาจควบคุมประเทศทั้งหมดใหแกพวกเขา พลเมืองยูโกสลาเวียทั้งหมดจะกลายเปนชาวเยอรมันโดยพฤตินัย และเราจะไมมีอิทธิพลใด ๆ อีกตอไป เราอาจเลือกยืนหยัดตรงนี้และหวังวาความชวยเหลือจะมาถึง แตนี่อาจเปนหนทางเดียวที่จะหลีกเลี่ยงการสังหารหมูชาวยูโกสลาเวีย"
 yugoslavia.7.a: "เราตองยืนหยัดอยางมั่นคง"
 yugoslavia.7.b: "จะชวยรักษาชีวิตผูคนไดมากมาย"
 yugoslavia.8.d: "[From.GetNameDefCap] เรียกรองใหเรามอบอํานาจควบคุมประเทศทั้งหมด พลเมืองยูโกสลาเวียจะกลายเปนพลเมืองของ [From.GetNameDef] หรือรัฐหุนเชิดรัฐใดรัฐหนึ่งของพวกเขาโดยพฤตินัย เราอาจเลือกยืนหยัดตรงนี้และหวังวาความชวยเหลือจะมาถึง แตนี่อาจเปนหนทางเดียวที่จะหลีกเลี่ยงการสังหารหมูชาวยูโกสลาเวีย"
 yugoslavia.8.a: "เราตองยืนหยัดอยางมั่นคง"
 yugoslavia.8.b: "จะชวยรักษาชีวิตผูคนไดมากมาย"
 yugoslavia.9.d: "[From.GetNameDefCap] เรียกรองใหเรายกดินแดนใหแกรัฐบาลโครเอเชียที่เพิ่งจัดตั้งขึ้นภายใตการควบคุมของ [From.GetNameDef] พวกเขายังเรียกรองใหเราปฏิรูปรัฐบาลครั้งใหญ ซึ่งจะทําใหเรายังปกครองพลเมืองยูโกสลาเวียได แตการเมืองของเราจะตกอยูใตอิทธิพล [From.GetAdjective] อยางหนัก เราอาจเลือกยืนหยัดตรงนี้และหวังวาความชวยเหลือจะมาถึง แตนี่อาจเปนหนทางเดียวที่จะหลีกเลี่ยงการสังหารหมูชาวยูโกสลาเวีย"
 yugoslavia.9.a: "เราตองยืนหยัดอยางมั่นคง"
 yugoslavia.9.b: "จะชวยรักษาชีวิตผูคนไดมากมาย"
 germany.89.t: "พันธมิตรอธรรม"
 germany.89.d: "หลังความรวมมือครั้งลาสุดประสบความสําเร็จ เยอรมันไดมาหาเราพรอมขอเสนอที่นาสนใจ พวกเขาเสนอใหเราละทิ้งความแตกตาง และแทนที่จะสิ้นเปลืองกําลังสูรบกันเองขณะที่ประชาธิปไตยตะวันตกนั่งดูและเก็บเกี่ยวผลประโยชน เราควรรวมพลังกันแลวบดขยี้พวกนั้นแทน!"
 germany.89.a: "ใหโลกไดสั่นสะทาน!"
 germany.89.b: "ไมมีการตกลงใด ๆ กับพวกฟาสซิสต!"
 germany.90.t: "พันธมิตรถูกปฏิเสธ"
 germany.90.d: "โซเวียตไดปฏิเสธขอเสนอของเรา หากเราตองการทรัพยากรของ [SOV.GetNameDef] เราก็ตองยึดมันมาดวยกําลัง!"
 germany.90.a: "ถาไมอยูขางเรา ก็คือศัตรูของเรา"
 germany.91.t: "ฝรั่งเศสตองการเขารวมฝายของเรา"
 germany.91.d: "บรรดาผูนําผูเขมแข็งของขบวนการฟรังซิสต (Mouvement Franciste) ไดกาวหนาไปอยางมาก และเสนอตัวเขารวมอุดมการณของเรา ชาติฝรั่งเศสพรอมแลวที่จะตอสูเพื่อไรช"
 germany.91.a: "Mehr Soldaten für das Reich"
 germany.91.b: "Nein!"
 germany.92.t: "เยอรมนีปฏิเสธคําขาด"
 germany.92.d: "แมเราจะชี้แจงชัดเจนแลววาการนํากําลังทหารกลับเขาไรนแลนดอีกครั้งจะถือเปนการกระทําเชิงสงคราม แตเยอรมนีก็ไมยอมถอย และไดรุกเขาสูเขตปลอดทหารโดยเมินเฉยตอคําเตือนของเรา นั่นหมายความวาแมเราจะพยายามอยางดีที่สุดเพื่อรักษาสันติภาพ สงครามก็ไดปะทุขึ้นในยุโรปอีกครั้ง"
 germany.92.a: "ตองบังคับใชสนธิสัญญาแวรซาย"
 germany.93.t: "การประชุมลอนดอน"
 germany.93.d: "เราคาดหวังวามหาอํานาจแหงยุโรปจะนั่งลงรวมโตะและบรรลุขอตกลงที่เปนธรรมในนามของสันติภาพ แตอังกฤษและฝรั่งเศสกลับเลือกสนับสนุนพวกยูโกสลาฟหัวดื้อกับรัฐจอมปลอมของพวกเขา ไมทางใดก็ทางหนึ่ง สโลวีเนียจะตองเปนของเรา...."
 germany.93.d_FRA_abandoned_yugoslavia: "เราคาดหวังวามหาอํานาจแหงยุโรปจะนั่งลงรวมโตะและบรรลุขอตกลงที่เปนธรรมในนามของสันติภาพ แมฝรั่งเศสจะเห็นถึงความชอบธรรมของเรา แตอังกฤษผูโงเขลากลับเลือกสนับสนุนพวกยูโกสลาฟหัวดื้อกับรัฐจอมปลอมของพวกเขา ไมทางใดก็ทางหนึ่ง สโลวีเนียจะตองเปนของเรา...."
 germany.93.a: "ไมมีใครขวางเราได"
 germany.94.t: "การยอมจํานนที่ลอนดอน"
 germany.94.d: "ในชัยชนะอีกครั้งของความกลาและการลงมือทํา สโลวีเนีย ซึ่งจะเปลี่ยนชื่อเปนคารนิโอลาในไมชา ไดกลับคืนสูบานอันชอบธรรมในไรชเยอรมันแลว"
 germany.94.a: "ชัยชนะของเยอรมนี!"
 germany.95.t: "ยูโกสลาฟปฏิเสธ"
 germany.95.d: "ดวยการประเมินสถานะของตนในโลกผิดไป ชาวยูโกสลาฟจึงเลือกไมรับโอกาสที่เรามอบให"
 germany.95.a: "ถึงเวลาสั่งสอนพวกมันแลว"
 germany.96.t: "การประชุมลอนดอน"
 germany.96.d: "ชาวยูโกสลาฟซึ่งถูกพวกอิตาลีผูโงเขลายุยง ไดตัดสินใจทาทายเรา พวกอิตาลีผูเนรคุณจะมอดไหมไปพรอมกับยูโกสลาฟ นายพลรอมเมิลยืนยันกับเราวาครั้งกอนพวกมันวิ่งหนี และครั้งนี้ก็คงวิ่งหนีอีกอยางไมตองสงสัย"
 germany.96.a: "สงครามนี้จะไมยืดเยื้อ"
 germany.97.t: "การประชุมลอนดอน"
 germany.97.d: "การประชุมลอนดอนครั้งยิ่งใหญควรจะแกไขความอยุติธรรมหนึ่งในหลายเรื่องที่เยอรมนีเคยไดรับ ทวาฝรั่งเศสยังคงกระหายการแกแคนและตองการเพียงเห็นเยอรมนีคุกเขา พวกเขาหนุนหลังระบอบในเบลเกรดทั้งที่เรามีความชอบธรรม พวกเขาคิดจริง ๆ หรือวาคําขูลม ๆ แลง ๆ จะมีความหมายอะไรกับเรา?"
 germany.97.a: "เราจะบดขยี้ทั้งสองชาติ"
 germany.98.t: "ชะตากรรมของยูโกสลาเวีย"
 germany.98_tt: "§Yหากยูโกสลาเวียยอมรับ สิ่งตอไปนี้จะเกิดขึ้น:§!\n"
 germany.98.d: "เรารูมาตลอดวารัฐยูโกสลาเวียที่ถูกแบงออกมาจากจักรวรรดิฮาพสบวรคเปนประเทศจอมปลอมที่ถูกลิขิตใหไมมีวันยืนยาว ความขุนเคืองทางชาติพันธุที่คุกรุนอยูใตพื้นผิวไดเดือดพลานจนลน และรัฐนี้กําลังแตกสลาย เราตองเขาไปแกไขสถานการณ"
 germany.98.a: "ผนวกยูโกสลาเวียทั้งหมด"
 germany.98.b: "ตั้งโครเอเชียเปนรัฐหุนเชิด ผนวกสวนที่เหลือ"
 germany.98.c: "ตั้งทั้งโครเอเชียและยูโกสลาเวียเปนรัฐหุนเชิด"
 germany.99.t: "แบงกรีซรวมกับ [ITA.GetNameDef]"
 germany.99.d: "เมื่อเราเสนอวาบางทีพรมแดนกรีซควรไดรับการปรับใหม เอกอัครราชทูตอิตาลีก็ประกาศกราววาพวกเขาจะสรางจักรวรรดิโรมันขึ้นใหมบนซากเถาถานของกรีซ"
 germany.99.a: "แนนอนอยูแลว"
 germany.99.b: "ไปทําใหรถไฟเดินตรงเวลากอนเถอะ"
 germany.100.t: "แบงกรีซรวมกับ [BUL.GetNameDef]"
 germany.100.d: "ดินแดนที่บัลแกเรียถือวาเปนของตนถูกยกใหกรีซหลังสงครามบอลขานครั้งที่สองและมหาสงคราม หากเราแกไขความอยุติธรรมนี้ เราจะผูกมัดบัลแกเรียไวกับเราได อยางไรก็ตาม หากพวกเขาไมแข็งแกรงพอจะทวงคืนเอง พวกเขาจะเปนพันธมิตรที่คูควรกับเราหรือ?"
 germany.100.a: "ผูกมัดบัลแกเรียไวกับเรา"
 germany.100.b: "พวกเขาตองพิสูจนตัวเองใหคูควรกับมิตรภาพของเรา"
 germany.101.t: "เรียกรองดินแดนกรีซ"
 germany.101.d: "การขาดพันธมิตรที่เหมาะสมทําใหเยอรมนีอยูในสถานะทางยุทธศาสตรที่เสียเปรียบในทะเลเมดิเตอรเรเนียนตะวันออก อยางไรก็ตาม เราแกไขเรื่องนี้ไดดวยการเรียกรองฐานทัพจากกรีซ พรอมดินแดนโดยรอบเพื่อรักษาความปลอดภัยของฐานเหลานั้น"
 germany.101.a: "พวกเขาตองมอบฐานทัพใหเยอรมนี"
 germany.101.b: "เราควรวางแผนระยะยาว"
 germany.101_tt: "§Yหากกรีซยอมรับ สิ่งตอไปนี้จะเกิดขึ้น:§!"
 germany.102.t: "กรีซปฏิเสธ"
 germany.102.d: "กรีซไดปฏิเสธความชวยเหลือของเราในการแกไขขอพิพาทพรมแดนอยางโงเขลา"
 germany.102.a: "พวกเขาคงตระหนักแลววาทางเลือกอื่นคืออะไร"
 germany.103.t: "กรีซปฏิเสธ"
 germany.103.d: "กรีซไดปฏิเสธขอเสนอการคุมครองและความชวยเหลืออันใจกวางของเรา"
 germany.103.a: "เราตองบังคับใหพวกเขาเห็นเหตุผล"
 germany.104.t: "อิตาลีเรียกรองดินแดนวิชี"
 germany.104.d_Savoy: "อิตาลีเริ่มยื่นขอเรียกรองตอฝรั่งเศสวิชีโดยอาศัยชัยชนะของเรา พวกเขาตองการเขตชายแดนซาวอยเพื่อเสริมความแข็งแกรงใหอิตาลี อยางไรก็ตาม เราคือผูตัดสินเรื่องนั้น"
 germany.104.d_Corsica: "อิตาลีเรียกรองเกาะคอรซิกาจากวิชีเปนสวนแบงของรางวัลสงคราม เราจะยกใหพวกเขาดีไหม?"
 germany.104.d_Savoy_Corsica: "อิตาลีเรียกรองใหวิชีมอบซาวอยและคอรซิกา นี่จะเปนประโยชนแกอิตาลี แตจะทําใหทางการอาณานิคมฝรั่งเศสกังวล"
 germany.104.a: "ก็คงใหซาวอยไปได"
 germany.104.b: "พวกเขาสมควรไดแคคอรซิกา"
 germany.104.c: "ใหซาวอยไป"
 germany.104.e: "พันธมิตรที่แข็งแกรงนําไปสูเยอรมนีที่แข็งแกรง"
 germany.104.f: "พวกเขาตองเสียสละมากกวาทหารไมกี่พันนาย"
 germany.105.t: "อิตาลีออกจาก [Root.GetFactionName]"
 germany.105.d: "หลังจากเราตัดสินใจไมมอบดินแดนใด ๆ ใหอิตาลี พวกเขาก็เลือกออกจาก [Root.GetFactionName] โดยอางวาเราไมใชพันธมิตรที่คูควรกับพวกเขา"
 germany.105.a: "ยังไงพวกเขาก็ไมคอยไดสูรบอยูแลว"
 germany.106.t: "สนธิสัญญาไกรโอวา"
 germany.106_threat: "สนธิสัญญาไกรโอวา"
 germany.106.d_second_vienna_accepted_north: "เมื่อฮังการีไดทรานซิลเวเนียเหนือไป บัลแกเรียก็เตือนใหเรานึกถึงขอพิพาทพรมแดนที่ยืดเยื้อมานานกับโรมาเนียเรื่องโดบรูจาใต ซึ่งโรมาเนียยึดไปเมื่อป 1913"
 germany.106.d_second_vienna_accepted_all: "เมื่อฮังการีไดทรานซิลเวเนียไป บัลแกเรียก็เตือนใหเรานึกถึงขอพิพาทพรมแดนที่ยืดเยื้อมานานกับโรมาเนียเรื่องโดบรูจาใต ซึ่งโรมาเนียยึดไปเมื่อป 1913"
 germany.106.d_no_vienna: "เนื่องจากความสัมพันธกับฮังการีเย็นชาลงหลังพวกเขาเลือกเขารวมพันธมิตรอื่น แผนเดิมของเราที่จะมอบทรานซิลเวเนียบางสวนใหพวกเขาจึงเปนไปไมได เราควรหันมารับฟงขอพิพาทดินแดนของบัลแกเรียเรื่องโดบรูจาใต ซึ่งโรมาเนียยึดไปเมื่อป 1913 แทน"
 germany.106.a: "ใหพวกเขาเรียกรองโดบรูจาใต"
 germany.106.b: "เราจะไมสนับสนุนขอเรียกรองใด ๆ ของบัลแกเรีย"
 germany.107.t: "การบินของรูด็อลฟ เฮสส"
 germany.107.d: "เมื่อวานนี้ รองฟอเรอร รูด็อลฟ เฮสส ถูกทหารกองรักษาดินแดนจับกุมตัวในสกอตแลนด หลังกระโดดรมลงจากเครื่องบินขับไลหนัก ในฐานะนักบินผูเชี่ยวชาญ เขาดูเหมือนจะบินขามทะเลเหนือเพียงลําพัง โดยระวังไมใหเขาระยะเรดารกอนจะเลี้ยวไปทางตะวันตกมุงหนาสูบริเตน\nดูเหมือนเฮสสจะริเริ่มเองที่จะเจรจาสนธิสัญญาสันติภาพระหวางบริเตนกับเยอรมนี แมเบอรลินจะประณามวาเขาเปนคนบาและปลดเขาออกจากทุกตําแหนงทางการเมืองแลว ทางการอังกฤษยังไมมีความเห็นใด ๆ"
 germany.107.a: "Wahnsinn!"
 germany.108.t: "การเสียชีวิตของรูด็อลฟ เฮสส"
 germany.108.d: "เมื่อวานนี้ รองฟอเรอร รูด็อลฟ เฮสส เสียชีวิตเมื่อกองทัพอากาศอังกฤษสกัดกั้นเครื่องบินขับไลหนักที่เขาบินอยูนอกชายฝงสกอตแลนด ลักษณะที่แทจริงของภารกิจของเขายังไมชัดเจน แมเฮสสจะเปนนักบินผูเชี่ยวชาญ แตเขาบินมาเพียงลําพัง และเครื่องบินของเขาดูเหมือนจะไมไดติดอาวุธ\nทางการอังกฤษไดกูรางของเขาไว แตมีการกําหนดจัดรัฐพิธีศพดวยโลงศพเปลาที่เบอรลิน \n\nมีรายงานวาฮิตเลอรโศกเศราอยางเห็นไดชัดกับการเสียชีวิตของสหายเกา"
 germany.108.a: "เจาคนโงผูนาสงสาร"
 germany.109.d: "เรือเหาะฮินเดนบูรก ซึ่งจอดอยูในเยอรมนีนับตั้งแตสงครามเริ่มตน ไดพบจุดจบอยางตื่นตะลึงในวันนี้เมื่อระเบิดกลางอากาศเหนือสกอตแลนด ดูเหมือนรองฟอเรอร รูด็อลฟ เฮสส จะยึดเรือเหาะลํานี้ไป และสามารถบินขามทะเลเหนือเพียงลําพังในภารกิจสวนตัวเพื่อเจรจาสันติภาพกับบริเตน\nสถานีเรดารอังกฤษตรวจจับอากาศยานขนาดมหึมาลํานี้ไดโดยไมยาก และกองบินหลายกองของกองทัพอากาศอังกฤษก็ถูกสั่งใหมุงหนาไปยังตําแหนงของมันทันที เมื่อฮินเดนบูรกไมตอบสนองทางวิทยุ พวกเขาก็เปดฉากยิง \n\nเฮสสกระโดดรมลงมาไดอยางปลอดภัย และขณะนี้ถูกคุมขังอยูในหอคอยแหงลอนดอน"
 germany.110.d: "เรือเหาะฮินเดนบูรก ซึ่งจอดอยูในเยอรมนีนับตั้งแตสงครามเริ่มตน ไดพบจุดจบอยางตื่นตะลึงในวันนี้เมื่อระเบิดกลางอากาศเหนือสกอตแลนด ดูเหมือนรองฟอเรอร รูด็อลฟ เฮสส จะยึดเรือเหาะลํานี้ไป และสามารถบินขามทะเลเหนือเพียงลําพังในภารกิจสวนตัวเพื่อเจรจาสันติภาพกับบริเตน\nสถานีเรดารอังกฤษตรวจจับอากาศยานขนาดมหึมาลํานี้ไดโดยไมยาก และกองบินหลายกองของกองทัพอากาศอังกฤษก็ถูกสั่งใหมุงหนาไปยังตําแหนงของมันทันที เมื่อฮินเดนบูรกไมตอบสนองทางวิทยุ พวกเขาก็เปดฉากยิง \n\nพบรางของเฮสสในซากเรือเหาะ"
 germany.110.a: "ไอคนบานั่น..."
 germany.111.t: "ยูโกสลาเวียปฏิเสธ"
 germany.111.d: "ยูโกสลาเวียไดปฏิเสธขอเสนอของเราในการคลี่คลายความตึงเครียดในภูมิภาคอยางโงเขลา"
 germany.111.a: "พวกเขาบีบใหเราตองลงมือเอง"
 germany.113.t: "เยอรมนียื่นขอดานซิกอยางเปนทางการ"
 germany.113.d: "ดวยเห็นวาการสนับสนุนทางทหารของตนเปนสิ่งจําเปนตอความสําเร็จใด ๆ ในสงครามกลางเมืองของเรา [GER.GetNameDef] จึงไดเสนอแผนการสถาปนาการควบคุมดานซิกของ [GER.GetAdjective] เมื่อการสูรบยุติลง พวกเขายังแสดงชัดวาการที่ [Root.GetNameDef] ตองพึ่งพาการสนับสนุนทางทหารจากพวกเขา ทําให [Root.GetLeader] ไมมีทางเลือกอื่นนอกจากลงนามใน "ขอตกลงดานซิก" นี้"
 germany.113.a: "[Root.GetName] ตองสูไปทีละศึก"
 germany.114.t: "เยอรมนีเรียกรองดานซิก"
 germany.114.d: "หลังชัยชนะของเราในสงครามกลางเมือง [Root.GetAdjective] เยอรมนีไดทวงถามคําขอเรื่องดานซิกกับเราซํ้าแลวซํ้าเลา พวกเขายังเตือนเราถึงผลที่อาจตามมาจากการขัดขืน สําหรับชาติที่ยังฟนตัวจากความขัดแยงภายในไมเสร็จ"
 germany.114.a: "พวกเขาจะไดดานซิกไปตามที่ตกลงกัน"
 germany.114.b: "เราจะไมมีวันยกแผนดินโปแลนดใหใคร!"
 germany.115.t: "โปแลนดยกดานซิกให"
 germany.115.d: "ตามขอตกลงดานซิก [GER.GetNameDef] ไดตกลงใหมีการโอนดานซิกไปอยูใตการควบคุมของ [GER.GetNameDef]"
 germany.115.a: "หุนสวนนี้พิสูจนแลววาเปนประโยชน"
 germany.116.t: "โปแลนดผิดคํามั่นในขอตกลงดานซิก"
 germany.116.d: "[From.GetName] ไมเห็นคาการสนับสนุนอันลํ้าคาที่เรามอบใหในสงครามกลางเมือง และตัดสินใจเมินเฉยตอการอางสิทธิ์ของเราเหนือดานซิก"
 germany.116.a: "การผิดขอตกลงจะทําใหพวกเขาตองชดใชอยางแสนสาหัส"
 germany.116.b: "เราไมอาจแบกรับความขัดแยงนี้ได"
 germany.117.t: "ขอตกลงดานซิก"
 germany.117.d: "[From.GetName] ไดตกลงตามคําขอเรื่องดานซิกของเรา แลกกับการสนับสนุนในสงครามกลางเมือง คําขอและคํามั่นของเราไดรับการกําหนดอยางเปนทางการในขอตกลงดานซิกแลว บัดนี้เราตองทําใหแนใจวา [From.GetName] จะไดรับชัยชนะในความขัดแยงนี้"
 germany.117.a: "นี่ก็เปนการตอสูของ [Root.GetAdjective] เชนกัน"
 germany.118.t: "การประชุมยัลตา"
 germany.118.d: "เมื่อสงครามในยุโรปดําเนินไปอยางรวดเร็ว ก็ถึงเวลาที่ผูชนะซึ่งหลีกเลี่ยงไมไดจะพิจารณาอนาคตของยุโรป\n\nเราอาจเสนอตอ [yalta_partner.GetNameDef] ใหจัดการประชุมเรื่องการแบง [GER.GetNameDef] หลังสงคราม เพื่อกําหนดเขตอิทธิพลของเราบนภาคพื้นทวีป\n\n"มิตร" ของเราใน [yalta_partner.GetNameDef] ไดแสดงทาทีวาสนใจการประชุมเชนนี้ ไมตองสงสัยเลยวาพวกเขายอมตองการผลตอบแทนบางอยางสําหรับการเสียสละของตน"
 germany.118.a: "เราตองจัดการประชุมเรื่องอนาคตของยุโรป"
 germany.118.b: "เรารวมมือกับ [yalta_partner.GetNameDef] ไมได"
 yalta_division_tt: "รัฐตอไปนี้จะถูกกําหนดเปนเขตอิทธิพลของฝายสัมพันธมิตร:\n§Y[42.GetName]§!, §Y[978.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!\n\nรัฐตอไปนี้จะอยูในเขตอิทธิพลของ [SOU.GetAdjective]:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!\n\n การอางสิทธิ์ของ [POL.GetAdjective] เหนือรัฐตอไปนี้จะไดรับการยอมรับจากทุกฝาย: §Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!\n\n"
 germany.118.c: "เราควรดําเนินตามแผนมอรเกนทาว"
 morgenthau_division_tt: "[FRA.GetFlag] [FRA.GetNameDefCap] ไดรับ §Y[42.GetName]§!\n[POL.GetFlag] โปแลนดไดรับ §Y[67.GetName]§! และ §Y[5.GetName]§!\n[SOV.GetFlag] [SOV.GetNameDefCap] ไดรับ §Y[763.GetName]§!\nจะมีการจัดตั้งเขตนานาชาติภายใตการบริหารของ [ENG.GetFlag] [ENG.GetAdjective] ใน: §Y[51.GetName]§!, §Y[52.GetName]§! และ §Y[56.GetName]§!\n จะมีการสถาปนา [GER.GetFlag] รัฐเยอรมันเหนือที่เปนเอกราช ในเขตอิทธิพลของ [yalta_partner.GetAdjective] ใน §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§! และ §Y[60.GetName]§! \nจะมีการจัดตั้ง [GER.GetFlag] รัฐเยอรมันใตที่เปนเอกราชใน §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[978.GetName]§!, §Y[52.GetName]§! และ §Y[53.GetName]§!"
 germany.118.e: "เชอรชิลลมีความคิดนี้..."
 churchill_plan_germany_tt: "เยอรมนีจะถูกแบงออกเปนสามประเทศ ไดแก รัฐเยอรมันตะวันตก รัฐเยอรมันเหนือ และรัฐเยอรมันใต ซึ่งจะรวมบางสวนของจักรวรรดิออสเตรีย-ฮังการีเขาไปดวย ทั้งหมดนี้จะอยูในเขตอิทธิพลของฝายสัมพันธมิตร ขณะที่ยุโรปกลางและยุโรปตะวันออกสวนที่เหลือจะอยูในเขตอิทธิพลของ [yalta_partner.GetAdjective]"
 germany.119.t: "การประชุมยัลตา"
 germany.119.d: "เมื่อสงครามกับ [GER.GetNameDef] กําลังเดินหนาสูบทสรุปที่หลีกเลี่ยงไมได [yalta_origin.GetNameDef] ไดติดตอเราเรื่องการประชุมวาดวยอนาคตของยุโรป\n\nพวกเขาเสนอใหแบง [GER.GetNameDef] ออกเปนตะวันออกและตะวันตก ซึ่งจะทําใหเขตอิทธิพลของเราขยายลึกเขาไปในยุโรป และชวยชดเชยความสูญเสียบางสวนที่เราไดรับจากการตอสูอันโหดรายครั้งนี้"
 germany.119.a: "เพื่อความรวมมืออันยั่งยืน"
 germany.119.b: "เราจะกําหนดสันติภาพเอง"
 germany.1190.t: "การประชุมโทรอนโต"
 germany.1190.desc: "เมื่อสงครามกับ [GER.GetNameDef] กําลังเดินหนาสูบทสรุปที่หลีกเลี่ยงไมได [yalta_origin.GetNameDef] ไดติดตอเราเรื่องการประชุมวาดวยอนาคตของยุโรป\n\nพวกเขาเสนอใหแบง [GER.GetNameDef] ออกเปนสามสวน โดยเราจะไดอิทธิพลอยางจํากัดเหนือภูมิภาคตะวันออก ภูมิภาคอุตสาหกรรมหลักจะอยูใตการควบคุมของฝายสัมพันธมิตร และฝายสัมพันธมิตรยังจะมีอํานาจควบคุมภูมิภาคใตอยางจํากัดดวย วิธีนี้จะลดทอนอํานาจของเยอรมนี แตอิทธิพลของเราเหนือยุโรปกลางจะยังคงไมแนนอน"
 germany.120.t: "[yalta_partner.GetNameDefCap] ปฏิเสธการเขารวม"
 germany.120.d: "การประชุมวาดวยอนาคตของยุโรปที่เราเสนอไวลมเหลวลงแลว\n\n[yalta_partner.GetLeader] กลาวอยางไมออมคอมวาไมมีความจําเปนใด ๆ ที่จะตองวางแผนและรวมมือกันเรื่องยุโรปหลังสงคราม\n\n"เราจะไดพบกันตอนที่ผมยื่นขอเรียกรองตอ [GER.GetNameDef] บนโตะเจรจาสันติภาพ ผมจะไมยอมใหการเลนการเมืองไรสาระมาขวางทาง [yalta_partner.GetNameDef]""
 germany.120.a: "เรื่องนี้นากังวล"
 germany.121.t: "การแบงแยกเยอรมนี"
 germany.121.d: "ตามที่กําหนดไวในขอตกลงยัลตา เยอรมนีจะถูกแบงออกเปนสองรัฐแยกจากกัน แตละรัฐอยูในเขตอิทธิพลของคูสงครามฝายหนึ่ง\n\nขอใหสิ่งนี้นํามาซึ่งการสิ้นสุดของความขัดแยงในยุโรป"
 germany.121.a: "เพื่อเยอรมนี..."
 germany.122.t: "[From.GetNameDefCap] เรียกรองซูเดเทินลันด"
 germany.122.d: "ทามกลางสถานการณที่กําลังดําเนินอยู เยอรมนีไดเรียกรองดินแดนซูเดเทินลันดจากเรา เพื่อ "ปกปองประชากรชาวเยอรมัน" ในภูมิภาคนั้น\n\nดวยสถานการณในขณะนี้ พวกเขาแสดงชัดเจนวานี่คือคําขาด จะไมมีการเจรจาหรือการทูตใด ๆ พวกเขาจะตองไดซูเดเทินลันด ไมเชนนั้นก็จะทําสงครามแยงชิงมัน"
 germany.122.desc_cze_subject_of_ger: "ผูนํา [FROM.GetAdjective] [FROM.GetLeader] ไดเรียกรองดินแดนซูเดเทินลันดจากเรา เพื่อ "ปกปองประชากรชาวเยอรมัน" ในภูมิภาคนั้น\n\nดวยสถานการณในขณะนี้ และการที่ [FROM.GetNameDef] ควบคุมประเทศของเราอยางเขมงวด เราไมอาจทําสิ่งใดเพื่อหยุดยั้งพวกเขาได พวกเขาจะไดซูเดเทินลันดไป และเราตองยอมรับความจริงอันเจ็บปวดนี้"
 germany.122.a: "ถากลาก็ทําสงครามมาเลย!"
 germany.122.b: "เราไมอาจทําสงครามกับ [From.GetNameDef] ได"
 germany.122.c: "เราตองทําตามขอเรียกรองของ [FROM.GetLeader]"
 germany.123.t: "[From.GetNameDefCap] ปฏิเสธไมยกซูเดเทินลันดใหเรา"
 germany.123.d: "ดวยการเดินหมากทางการทูตอันโงเขลา [From.GetLeader] ผูนําของชาว [From.GetAdjective] ไดปฏิเสธขอเรียกรองทั้งหมดของ [ROOT.GetAdjective]!\n\nพวกเขาจะไมยกซูเดเทินลันดให และแทบจะทาใหเราประกาศสงคราม พรอมเยยหยันความปรารถนาของเราที่จะปกปองพี่นองชาว [ROOT.GetAdjective] ของเรา"
 germany.123.a: "ถาเชนนั้นก็ตามนั้น!"
 germany.124.t: "[From.GetNameDefCap] ยกซูเดเทินลันดให"
 germany.124.d: "เมื่อเผชิญกับโอกาสที่จะตองทําสงครามกับเรา [From.GetNameDef] จึงยอมยกการควบคุมซูเดเทินลันดทั้งหมดให และสละการอางสิทธิ์เหนือภูมิภาคนี้ในอนาคต\n\nในที่สุด ประชากรชาว [ROOT.GetAdjective] ในซูเดเทินลันดก็จะไดกลับมาอยูในออมอกของ [ROOT.GetNameDef] อยางปลอดภัย"
 germany.124.desc_cze_subject_of_ger: "รัฐบาล [From.GetAdjective] ไมมีทางเลือกอื่นนอกจากยอมยกการควบคุมซูเดเทินลันดทั้งหมดให และสละการอางสิทธิ์เหนือภูมิภาคนี้ในอนาคต\n\nในที่สุด ประชากรชาว [ROOT.GetAdjective] ในซูเดเทินลันดก็จะไดกลับมาอยูในออมอกของ [ROOT.GetNameDef] อยางปลอดภัย"
 germany.124.a: "เพื่อ [ROOT.GetNameDef] และชาว [ROOT.GetAdjective] ทุกคน!"
 germany.125.t: "[FROM.GetNameDefCap] ยกซูเดเทินลันดให [GER.GetNameDef]"
 germany.125.d: "เจาเหนือหัว [FROM.GetAdjective] ของเราไดตัดสินใจมอบซูเดเทินลันดใหแก [GER.GetNameDef] พวกเขาอางวาทําไปเพื่อรักษาสันติภาพในภูมิภาค และการกระทําอื่นใดจะนําชะตากรรมที่เลวรายยิ่งกวามาสูเรา เราไมไดรับการปรึกษาในเรื่องนี้เลย และตอนนี้ทําไดเพียงเฝามองดินแดนอันชอบธรรมของเราถูกตัดขาดไป"
 germany.125.a: "ถาเปนการตัดสินใจของเรา เราคงจัดการตางออกไป"
 germany.126.t: "อันชลุสสหรือความพินาศ"
 germany.126.warning: "§Rอาจนําไปสูสงคราม§!\n"
 germany.126.d: "ความไมสงบและการใชความรุนแรงไดปะทุขึ้น ขณะที่ผูประทวงแสดงความตองการใหออสเตรียรวมเขากับเยอรมนี ความขัดแยงภายในที่ชาติเราเผชิญอยูแลวยิ่งทําใหเสียงของผูที่ตองการรวมกับเยอรมนีดังขึ้น เบอรลินกําลังกดดันอยางหนักใหเกิดอันชลุสส และนี่อาจเปนโอกาสเดียวของเราที่จะรักษาคุณคาแทจริงของออสเตรียไวไดสวนหนึ่ง"
 germany.126.a: "เราจะเขารวมกับไรชเยอรมัน!"
 germany.126.b: "ไม ชะตากรรมของออสเตรียอยูที่อื่น"
 germany.127.t: "ทําใหพันธมิตรเปนทางการ"
 germany.127.d: "เมื่อเรารวมกันตอสูกับ [SOV.GetNameDef] บางทีอาจถึงเวลาที่จะทําใหพันธมิตรนี้เปนทางการ และเชิญหุนสวนใหมในสงครามตอตานคอมมิวนิสตนี้เขารวมฝายของเรา"
 germany.127.a: "เราจะสงทูตไป"
 germany.127.b: "เราจะไมผูกพันกับพวกเขาไปมากกวานี้"
 germany.128.t: "กติกาสัญญาตอตานโซเวียต"
 germany.128.d: "[From.GetNameDefCap] ไดเสนอตอนรับเราเขาสูฝายของพวกเขา เพื่อใหเราประสานงานกันตอตานภัยคอมมิวนิสตไดดียิ่งขึ้น ทูตที่จะมาทําใหพันธมิตรนี้เปนทางการไดเดินทางมาถึงเมืองหลวงแลว"
 germany.128.a: "เปนความริเริ่มที่ยอดเยี่ยม"
 germany.128.b: "ชะตากรรมของเราขึ้นอยูกับผูอื่น"
 germany.200.t: "เยอรมนีใหม"
 germany.200.desc: "เยอรมนีไมไดเปนภัยคุกคามดังเชนที่เคยเปนอีกตอไป แตกลับเปน [SOV.GetNameDef] ที่คุกคามจะพลิกระเบียบโลก เยอรมนีที่เขมแข็งและเปนประชาธิปไตยอาจเปนพันธมิตรที่มีประโยชนอยางยิ่งในการตอสูครั้งนี้ การยอมใหเยอรมนีผงาดขึ้นอีกครั้งอาจใหประโยชนทางการคาอยางมากทั้งแกเราและพวกเขา บางทีอาจถึงเวลาที่จะยุติการยึดครองและวางรากฐานใหแกโลกประชาธิปไตยที่เขมแข็งและเปนปกแผน"
 germany.200.a: "เริ่มดําเนินแผนนี้กันเถอะ"
 germany.200.b: "ไม เสี่ยงเกินไป"
 germany.201.t: "[FROM.GetName] ตองการรวมเยอรมนีอีกครั้ง"
 germany.201.desc: "[FROM.GetName] ไดตัดสินใจยุติการยึดครองเยอรมนี และใหชาวเยอรมันปกครองตนเองในฐานะสาธารณรัฐใหมที่ชื่อ [WGR.GetNameDef] พวกเขาอางวาทําเพื่อสรางปราการตอตานคอมมิวนิสต โดยใหเหตุผลวาเยอรมนีที่เขมแข็งและเปนประชาธิปไตยจะปองกันการแพรขยายของคอมมิวนิสตไดดีกวาเยอรมนีที่ออนแอและแตกเปนเสี่ยง \nเราไดรับการรองขอใหสนับสนุนเรื่องนี้ดวยการรวมดินแดนเยอรมันของเราเขากับ [WGR.GetName] ที่เพิ่งกอตั้งขึ้น ประชาชนสนับสนุนเรื่องนี้อยางแข็งขัน"
 germany.201.a: "มีขอดีอยูจริง ๆ"
 germany.201.b: "ไม ตอนนี้ยังไมใชเวลา"
 germany.202.t: "เยอรมนีใหม"
 germany.202.desc: "[FROM.GetName] ปลอยใหดินแดนเยอรมันของตนถูกรวมเขากับสิ่งที่เรียกวา [WGR.GetName] เรื่องนี้ทําใหผูคนจํานวนมากในเขตเยอรมันของเราเรียกรองใหรวมเขากับเยอรมนีที่เปนเอกราชเชนกัน"
 germany.202.a: "ถาอยางนั้นก็สรางเยอรมนีที่เปนเอกราชของเราเองเถอะ"
 germany.202.b: "ไมคุมที่จะพยายามเก็บพวกเขาไว"
 THREAT_FROM_EFFECT: "ภัยคุกคามจากการกระทํา"
 war_justification.1.t: "[ROOT.GetLeader] กลาวโจมตี [From.GetName]"
 war_justification.1.d: "'[From.GetName] เปนของชาว [From.GetAdjective] หรือ? ลองถามตัวเองดวยคําถามที่ดีกวานั้น: อนาคตเปนของชาว [From.GetAdjective] หรือเปนของ [ROOT.GetNameDef]?'\n\nสุนทรพจนของ [ROOT.GetLeader] ในวันนี้บงบอกวา [ROOT.GetName] กําลังอยูบนเสนทางสูสงคราม ความตึงเครียดทางการเมืองกอตัวขึ้นตลอดเดือนที่ผานมา และดูเหมือนวาประชาชน [ROOT.GetAdjective] เริ่มยอมรับแลววาสงครามเปนสิ่งที่หลีกเลี่ยงไมได"
 war_justification.1.a: "อนาคตเปนของ [ROOT.GetName]!"
 war_justification.2.t: "[ROOT.GetLeader] ประณามอุดมการณของ [From.GetAdjective]"
 war_justification.2.d: "'ชาว [From.GetAdjective] อางวามีเสรีภาพและประชาธิปไตย อางวาตองการสันติภาพ แตทุกสิ่งที่พวกเขาภาคภูมิใจนั้นลวนกลวงเปลา ประชาธิปไตยของพวกเขาแบงแยกประชาชนในยามที่ควรรวมเปนหนึ่ง และเสรีภาพของพวกเขาก็เผยใหเห็นเพียงการขาดวินัย พวกเราชาว [ROOT.GetAdjective] มองทะลุคําโกหกเหลานี้... และเรามองเห็นวาสันติภาพนี้ สันติภาพตามเงื่อนไขของพวกเขา ก็เปนคําโกหกเชนกัน'\n\n[ROOT.GetRulingParty] เยาะเยยความออนแอของชาติ [From.GetAdjective] มานานแลว แตระยะหลังวาทกรรมกาวราวขึ้นเรื่อย ๆ วันแหงการปะทะดวยอาวุธใกลเขามาทุกที"
 war_justification.2.a: "[ROOT.GetName] ยืนหยัดเปนหนึ่งเดียวภายใต [ROOT.GetLeader]"
 war_justification.3.t: "[ROOT.GetLeader] เตือนภัยคอมมิวนิสต [From.GetAdjective]"
 war_justification.3.d: "'มีภัยคุกคามใดตอวิถีชีวิตของเรา หรือแมแตตอชีวิตเองยิ่งกวาคอมมิวนิสตอีกหรือ? โรคระบาดนี้คุกคามจะใหทาสแทนที่จะเปนนายไดปกครองทุกชาติ จะลมลางชาติ ลมลางผูคนและประวัติศาสตรของพวกเขา เราจะยึด [From.GetName] และกําจัดโรคระบาดคอมมิวนิสตใหสิ้นซาก'\n\nความเกลียดชังคอมมิวนิสตของ [ROOT.GetLeader] เปนที่รูกันดีตั้งแตกอน [ROOT.GetRulingParty] จะขึ้นสูอํานาจ แตดูเหมือนจะทวีความรุนแรงขึ้นเมื่อไมนานมานี้ โดยเฉพาะตอรัฐบาล [From.GetAdjective] ภารกิจของเราในการกวาดลางลัทธิมารกซใหหมดไปจากโลกอาจเริ่มตนที่นั่น"
 war_justification.3.a: "ผูที่ปฏิเสธความเปนชาติจะไดเห็นชาติของตนเองพินาศ"
 war_justification.4.t: "[ROOT.GetName] เตรียมพรอมสําหรับการตอสูครั้งใหญ"
 war_justification.4.d: "'ชาว [From.GetAdjective] เปนชนชาติที่ไมยอมสละอํานาจงาย ๆ อยางไรก็ตาม พวกเขาก็ตองตระหนักเชนกันวาเสนทางของสองชาติเรามีแตจะจบลงดวยการปะทะ เราตองเตรียมใจใหแข็งแกรงสําหรับการตอสูที่กําลังจะมาถึง เพราะ [From.GetName] จะไมถูกยึดไดโดยไมมีการสูรบ'\n\nความเปนไปไดที่รัฐบาลซึ่งมีแนวคิดคลายกันของ [From.GetName] และ [ROOT.GetName] จะเขาใจกันได ไดหลีกทางใหแกการรณรงคเพื่อยึดดินแดนของพวกเขาดวยกําลัง"
 war_justification.4.a: "ประวัติศาสตรจะถูกจารึกดวยชัยชนะของเรา"
 war_justification.5.t: "[ROOT.GetLeader] นําการปฏิวัติสู [From.GetName]"
 war_justification.5.d: "'แมเราจะสรางสังคมสังคมนิยมใน [ROOT.GetName] ใหมั่นคงแลว แตอีกหลายชาติยังคงทนทุกขอยูใตทรราชในระบอบเกา กรรมกรใน [From.GetName] ไมมีปากเสียง ไมมีหนทางจัดตั้งองคกร และความพยายามใด ๆ ที่จะสถาปนาสังคมนิยมจะถูกระบอบ [From.GetLeader] บดขยี้อยางโหดเหี้ยม เราไมอาจรอใหฟนเฟองของการปฏิวัติสากลหมุนไปถึงประชาชน [From.GetAdjective] ได ดวยการปฏิวัติ เราไดพิสูจนแลววาเราบดขยี้ผูกดขี่นายทุนที่นี่ได และเราจะบดขยี้ผูกดขี่ใน [From.Capital.GetName] เชนกัน!'\n\n[ROOT.GetLeader] ไดละทิ้งความพยายามใชถอยคําทางการทูตทั้งหมดตอ [From.GetName] ที่อยูใตการควบคุมของ [From.GetRulingParty] ภารกิจขจัดพรมแดนทั้งปวง บัดนี้มุงเปาไปที่การขจัดพรมแดนของพวกเขาโดยเฉพาะ"
 war_justification.5.a: "กรรมกร [From.GetAdjective] ทั้งหลาย การปลดปลอยของพวกทานใกลเขามาแลว!"
 war_justification.6.t: "[ROOT.GetLeader] เรียกรองใหชวยเหลือกรรมกร [From.GetAdjective]"
 war_justification.6.d: "'มีคําโกหกใดยิ่งใหญไปกวาเสรีภาพจอมปลอมของประชาชน [From.GetAdjective] อีกหรือ? ในอดีตพวกเขาเคยตกเปนทาสของเจาชายและดยุกที่อางกรรมสิทธิ์เหนือผืนดิน บัดนี้พวกเขาถูกบังคับใหขายแรงงานแกผูที่อางกรรมสิทธิ์เหนือโรงงาน เสรีภาพในการเลือกนายคนหนึ่งแทนอีกคนแทบเรียกไมไดวาเปนเสรีภาพ ทํานองเดียวกัน เสรีภาพในการเลือกตั้งผูนําก็เปนเพียงทางเลือกจอมปลอม เพราะโฆษณาชวนเชื่อจะไมมีวันยอมใหนักสังคมนิยมแทขึ้นสูอํานาจ ประชาชนที่ถูกลางสมองถึงเพียงนี้จะรอดไดก็ดวยการแทรกแซงของ [ROOT.GetAdjective] เทานั้น'\n\n[ROOT.GetLeader] โจมตีรัฐบาลใน [From.GetName] ในที่ประชุมพรรคมาเปนเวลานาน แตบัดนี้วาทกรรมเชนนี้ถูกใชในที่สาธารณะบอยขึ้น แทบไมมีเหตุผลใหเชื่อวาความขัดแยงนี้จะคลี่คลายไดอยางสันติ"
 war_justification.6.a: "เราจะบดขยี้เผด็จการกระฎมพีของพวกมัน!"
 war_justification.7.t: "คอมมิวนิสต [From.GetAdjective] กําลังลมเหลว"
 war_justification.7.d: "'สหายทั้งหลาย แมนักปฏิวัติผูยิ่งใหญที่สุดก็เคยถูกเรียกวาผูทรยศมาแลว แตบัดนี้เห็นไดชัดวาการปฏิวัติเองตางหากที่ถูกทรยศ มิฉะนั้นจะอธิบายการปกครองของ [From.GetRulingParty] แหง [From.GetName] ไดอยางไร ในเมื่อพวกเขาโยนทิ้งทุกรองรอยของแนวคิดมารกซิสต เพื่อสรางรัฐกรรมกรที่เสื่อมทราม ซึ่งพวกเขาจะปกครองไดภายใตขออางจอมปลอม? ดวยการเสริมสรางอํานาจของตนเองโดยแลกกับการปฏิวัติสากล พวกเขาไดแสดงใหเห็นวาแทบไมใสใจอุดมการณที่ตนอางวายึดถือ เราตองนําการปฏิวัติที่แทจริงไปสูพวกเขา'\n\nแมในตอนแรก [ROOT.GetLeader] จะสนับสนุนการปฏิวัติ [From.GetAdjective] แตก็แสดงความผิดหวังมากขึ้นเรื่อย ๆ กับทิศทางที่มันพัฒนาไป [ROOT.GetRulingParty] อาจตองเขาแทรกแซงกอนที่จะสายเกินไป"
 war_justification.7.a: "ยังมีเวลากอบกูความพยายามสรางสังคมนิยมของพวกเขา"
 war_justification.8.t: "[ROOT.GetLeader] เรียกรองใหบดขยี้ลัทธิชาตินิยม [From.GetAdjective]"
 war_justification.8.d: "'มีสังคมใดที่นารังเกียจตออนาคตของการปฏิวัติ หรือแปลกแยกจากความทุกขยากของกรรมกรยิ่งกวาระบอบฟาสซิสตแหง [From.GetName] อีกหรือ? พวกเขาเรียกรองใหประชาชนอุทิศตนอยางคลั่งไคลตอสถาบันรัฐชาติที่ผุพัง พวกเขาเอาความปาเถื่อนแบบโบราณมาแตงตัวดวยเครื่องแตงกายสมัยใหม พยายามนําเสนอตนเองเปนอนาคตทางเลือกแทนชัยชนะสากลของชนชั้นแรงงานที่หลีกเลี่ยงไมได เปนเพียงเรื่องของเวลากอนที่พวกเขาจะโจมตีเราหรือพันธมิตรของเรา เราจงโจมตีกอน'\n\nไมมีใครคาดหวังอะไรมากไปกวาความดูแคลนซึ่งกันและกันระหวางเรากับชาว [From.GetAdjective] แตระยะหลังความเปนปรปกษไดทวีความรุนแรงขึ้น บัดนี้ดูเหมือนความขัดแยงจะปะทุขึ้นในไมชา"
 war_justification.8.a: "ความตายจงมีแดฟาสซิสต!"
 war_justification.9.t: "การทูตกับ [From.GetName] ลมเหลว"
 war_justification.9.d: "'แมเราจะพยายามหาทางออกทางการทูตตอความขัดแยงกับ [From.GetName] แตการเจรจาก็ลมเหลวลงอีกครั้ง ทําใหเราเหลือทางเลือกจํากัด ระบอบอํานาจนิยมของ [From.GetLeader] ไดแสดงทาทีอันไรเหตุผลตอเรื่องนี้ ซึ่งเปนแบบฉบับของผูนําที่ไมตองรับผิดชอบตอประชาชนของตน หากผูนํา [From.GetAdjective] ไมกลับลํานโยบายโดยสิ้นเชิง เราจะไมมีทางเลือกอื่นนอกจากการตอสู'\n\nการแทรกแซงของ [ROOT.GetAdjective] ใน [From.GetName] เปนประเด็นรอน โดยนักการเมืองฝายคานบางคนกลาวหาวา [ROOT.GetRulingParty] ดําเนินนโยบายสายเหยี่ยวมาตั้งแตตน ไมวาเจตนาแตแรกจะเปนอยางไร บัดนี้สงครามในอนาคตก็ดูเปนเรื่องจริงและหลีกเลี่ยงไมไดขึ้นมาทันที"
 war_justification.9.a: "บางครั้งเราก็ตองปนขามภูเขาแหงความขัดแยง"
 war_justification.10.t: "[ROOT.GetLeader] เรียกรองใหแทรกแซงใน [From.GetName]"
 war_justification.10.d: "'ดวยความหนักใจ เราตองเผชิญกับความจริงของสถานการณ: การบุก [From.GetName] อาจเปนทางเลือกเดียวของเรา มันมีความไดเปรียบทางยุทธศาสตรมากเกินกวาที่จะลองหาทางออกอื่นในสถานการณปจจุบัน แมเราเชื่อมั่นวาทั้งประชาชน [ROOT.GetAdjective] และ [From.GetAdjective] ตางไมตองการสงคราม แตประวัติศาสตรไดนําเรามาถึงจุดนี้ และทางเลือกของเรามีจํากัด เราไดแตหวังวาการแสดงแสนยานุภาพทางทหารครั้งนี้จะชวยใหเราหลีกเลี่ยงการนองเลือดในอนาคตได'\n\nแมจะมีทฤษฎีที่นิยมกันวาประเทศประชาธิปไตยจะไมทําสงครามกับประเทศประชาธิปไตยดวยกัน แตพัฒนาการลาสุดบงชี้วา [ROOT.GetAdjective] จะบุก [From.GetName] ในอนาคต ประวัติศาสตรอาจทําใหเราประหลาดใจก็ได"
 war_justification.10.a: "ยังไง [From.GetName] ก็เปนประชาธิปไตยที่นาสงสัยอยูแลว"
 war_justification.11.t: "[ROOT.GetLeader] กลาวตอตานภัยแดง"
 war_justification.11.d: "'ไมตองสงสัยเลยวาคอมมิวนิสตของ [From.GetName] เปนภัยคุกคามที่รายแรงที่สุดอยางหนึ่งตอเสรีภาพและความสงบเรียบรอยในยุคนี้ มันไมลดละและไรปรานี คุกคามจะกลืนกินไมเพียงความหวังของประชาชน [From.GetAdjective] ที่จะมีสังคมประชาธิปไตยอันรุงเรือง แตรวมถึงความหวังของเพื่อนบานดวย หากเราไมลงมือตอนนี้ เราอาจเห็นโดมิโนตัวแรกลมลงเมื่อสายเกินไป ทิ้งไวเพียงการทดลองทางสังคมที่ลมเหลวอีกมากมาย ตองมีคนตายอีกเทาไรเราจึงจะเขาแทรกแซง?'\n\nภัยจากกิจกรรมบอนทําลายที่กัดกรอนประชาธิปไตยของเรา ซึ่งไดแรงหนุนจากความทะเยอทะยานของ [From.GetAdjective] ไดกลายเปนประเด็นถกเถียงรอนแรงเมื่อไมนานมานี้ ขณะที่ผูแทนฝายคานเรียกสิ่งนี้วาความหวาดกลัวภัยแดงที่มุงหาเหตุทําสงครามกับ [From.GetName] วาทกรรมของ [ROOT.GetRulingParty] ก็ประสบความสําเร็จอยางสูงจนถึงตอนนี้"
 war_justification.11.a: "พวกมันยึดถืออุดมการณแหงความรุนแรง จะคาดหวังการตอบโตอื่นใดนอกจากความรุนแรงไดเลา?"
 war_justification.12.t: "[ROOT.GetLeader] เผชิญหนาลัทธิฟาสซิสต [From.GetAdjective]"
 war_justification.12.d: "'ในประวัติศาสตรสมัยใหม หรือบางทีอาจในประวัติศาสตรทั้งหมด ไมเคยมีทรราชใดเลวรายไปกวาการกุมอํานาจอยางเหล็กกลาที่ [From.GetRulingParty] มีเหนือ [From.GetName] ในขณะนี้ บางคนอาจแยงวาเราไมควรยั่วยุใหเกิดความขัดแยง วาเราควรไวใจให [From.GetLeader] รักษาสนธิสัญญาและคํามั่นสัญญาในอนาคต แตคนเหลานี้มองไมเห็นวาสนธิสัญญาที่ทําภายใตการปกครองของฟาสซิสตนั้นไรคา สําหรับพวกโกหกไรเกียรติเหลานี้ อํานาจคือความถูกตอง และกระดาษที่ใชเขียนขอตกลงก็ลุกไหมไดงายพอ ๆ กับหนังสือของผูที่วิจารณพวกเขา'\n\nผูที่หวังมานานจะหลีกเลี่ยงการเผชิญหนาโดยตรงกับ [From.GetName] บัดนี้ถูก [ROOT.GetLeader] คัดคานอยางหนัก โดยใหเหตุผลตามแนวมาเคียเวลลีวาเราเพียงแตเลื่อนสงครามออกไปใหเปนประโยชนแกศัตรูเทานั้น หากเปนเชนนี้ สุดทายเราอาจเปนฝายลงมือกอนก็ได"
 war_justification.12.a: "ยุคของเราจะไมมีสันติภาพตราบที่พวกมันยังอยู"
 war_justification.13.t: "[ROOT.GetLeader] เรียกรองใหทําสงครามกับ [From.GetName]"
 war_justification.13.d: "'แมเราจะเปนชนชาติที่รักสันติ แตธรรมชาติของเราเพียงอยางเดียวไมไดกําหนดเสนทางที่เราตองเดินในประวัติศาสตร นี่คือยุคแหงสงคราม ชาว [From.GetAdjective] ครอบครองปจจัยที่เราจําเปนตองใชเพื่อฝาฟนบททดสอบที่อาจตองเผชิญมานานเกินไปแลว และเห็นไดชัดวาพวกเขาจะไมยอมสละมันอยางสันติ แมเราจะพยายามอยางดีที่สุดเพื่อสรางรัฐสมัยใหม แตบางเรื่องก็ตัดสินไดดวยบททดสอบแบบเกา นั่นคือการรบเทานั้น'\n\nวาทกรรมที่เปนปรปกษของ [ROOT.GetLeader] ตอ [From.GetName] ไดพยายามอยางมากในการสรางความชอบธรรมใหแกการบุก ประชาชนสวนหนึ่งสนับสนุนแนวทางนี้ แตการตัดสินใจอยูในมือของผูนําของเรา"
 war_justification.13.a: "นี่อาจเปนการตัดสินใจที่ยาก แตเราตองยืนหยัดสนับสนุนมัน"
 war_justification.14.t: "[ROOT.GetLeader] ทาทายความหยิ่งผยองของ [From.GetAdjective]"
 war_justification.14.d: "'[From.GetName] อาจคิดวาตนทันสมัยและกาวหนากวาเรา แตความจริงคือชาติของพวกเขายังไมเคยถูกทดสอบเหมือนชาติเรา และไมไดเตรียมพรอมรับภัยคุกคามที่บัดนี้เห็นไดชัดอยูที่ขอบฟา ดวยการดูแคลนเรา และขัดขวางไมใหเรายึดสิ่งที่เปนของเราโดยชอบธรรม พวกเขาไดทําใหเรากลายเปนหนึ่งในภัยคุกคามเหลานั้นตอตัวพวกเขาเอง ชาติที่ออนแอและแตกแยกของพวกเขาแทบจะตานทานการอางสิทธิ์ของเราไมได'\n\nทัศนคติเหยียดหยาม [From.GetName] ที่ [ROOT.GetRulingParty] ยึดถือมานานไดพัฒนาจากการวิพากษวิจารณไปสูความเปนปรปกษ แมความเห็นทั่วไปจะมองวาประชาชน [From.GetAdjective] ตองการหลีกเลี่ยงสงคราม แต [ROOT.GetLeader] อางวาผูนําที่พวกเขาเลือกตั้งมาไดยั่วยุใหเกิดสงครามดวยความหยิ่งยโสของตน"
 war_justification.14.a: "พวกเขาไมรูหรอกวาความยากลําบากหลอหลอมใหเราแข็งแกรงเพียงใด"
 war_justification.15.t: "[ROOT.GetLeader] ตองการฟนฟูความสงบเรียบรอยใน [From.GetName]"
 war_justification.15.d: "'จิตวิญญาณแหงชาติ [ROOT.GetAdjective] นั้นแข็งแกรง แตไมใชทุกชาติจะโชคดีเชนนี้ [From.GetName] ถูกทําลายขนบธรรมเนียม และผูปกครองอันชอบธรรมก็ถูกสังหารและฝงกลบไปนานแลว ทั้งหมดนี้ในนามของแนวคิดการปฏิวัติมารกซิสตอันยิ่งใหญ เปนหนาที่ของเราที่จะฟนฟูความสงบเรียบรอยใหแกโลกที่ถูกพวกแยงชิงอํานาจกระหายเลือดชักนําใหหลงทาง และแสดงพลังของ [ROOT.GetName] ตอตานภัยคุกคามนี้'\n\nแม [ROOT.GetRulingParty] จะตอตานคอมมิวนิสตมาโดยตลอด แตในสุนทรพจนชวงหลัง [From.GetName] ตกเปนเปาการโจมตีเปนพิเศษ ไมวาการโจมตีชาติ [ROOT.GetAdjective] จากพวกคอมมิวนิสตจะเปนภัยคุกคามจริงหรือไม การโจมตีชิงลงมือกอนตอคอมมิวนิสต [From.GetAdjective] ก็กําลังถูกเตรียมการอยูแลว"
 war_justification.15.a: "ผูที่ถูกสังหารในการปฏิวัติจะไดรับการแกแคน!"
 war_justification.16.t: "[ROOT.GetLeader] ประณามผูกดขี่ [From.GetAdjective]"
 war_justification.16.d: "'ฝายตรงขามของผมอยากใหพวกทานเชื่อวาการปกครองของผมเหมือนกับของ [From.GetRulingParty] ใน [From.GetName] พวกเขาผิดอยางที่สุด ขณะที่ความสําเร็จของ [From.GetLeader] เปนผลจากกระแสนิยมชั่ววูบ เปนขบวนการมวลชนอันทําลายลางที่มุงรังแกชาติอื่นใหยอมสยบ [ROOT.GetRulingParty] กลับยืนหยัดตอตานขบวนการนั้นในฐานะผูที่ไมยอมสยบ ผมพรอมจะทําทุกอยางที่จําเปนเพื่อกําจัดภัยคุกคามนี้ แมจะหมายถึงสงครามก็ตาม'\n\nระบอบ [ROOT.GetLeader] ไดใชนโยบายที่เปนปรปกษตอชาติ [From.GetAdjective] ไมวาผูนําของเราจะถูกเรียกวาอะไร คําวาฟาสซิสตก็สงวนไวใชกับศัตรูของเราเทานั้น"
 war_justification.16.a: "ขนบธรรมเนียมและความเปนจริงจะมีชัยเหนือความคลั่งไคลและความหวาดกลัวเสมอ"
 war_justification.17.t: "[ROOT.GetLeader] ตั้งคําถามตออธิปไตยของ [From.GetAdjective]"
 war_justification.17.d: "'ใครเปนผูกําหนดพรมแดนของชาติ และกําหนดอยางไร? ไมวาในอดีตผูคนจะหาวิธีใดมาอางความชอบธรรมวา [ROOT.GetName] สิ้นสุดตรงไหนและ [From.GetName] เริ่มตนตรงไหน เราก็อยูในยุคใหมแลว ความสําคัญทางยุทธศาสตรของพรมแดนนี้ไมอาจกลาวเกินจริงได และเรามีสิทธิ์โดยชอบที่จะขยับมันเพื่อรับประกันความมั่นคงของประชาชนเราตอไป'\n\nเมื่อฟงสุนทรพจนลาสุดของ [ROOT.GetLeader] การบุก [From.GetName] ดูเหมือนจะใกลเขามาแลว เสียงคัดคานไดทักทวง แตการสนับสนุนสงครามจากประชาชนกําลังเพิ่มขึ้น"
 war_justification.17.a: "เราตองรวมใจกันสนับสนุนอุดมการณนี้!"
 war_justification.18.t: "[ROOT.GetLeader] ตั้งขอสงสัยตอเจตนาของ [From.GetName]"
 war_justification.18.d: "'ไมตองสงสัยเลยวา [From.GetName] กําลังเตรียมทําสงคราม การเปลี่ยนแปลงนโยบายเศรษฐกิจแสดงใหเห็นชัดวาชาว [From.GetAdjective] ไมใชชนชาติที่รักสันติ แตกําลังรอโอกาสที่เหมาะสมเพื่อโจมตีเรา เราจะยืนดูเฉย ๆ ขณะที่พวกเขาสะสมอาวุธในยามที่ [ROOT.GetName] ไรการปองกันหรือ? หรือเราจะปลดอาวุธภัยคุกคามนี้กอนที่มันจะเติบโตเกินกําลังของเรา?'\n\nฝายสายเหยี่ยวใน [ROOT.GetRulingParty] ไดหันมาจับตา [From.GetName] โดยใหเหตุผลวาการโจมตีคือการปองกันที่ดีที่สุด มุมมองของพวกเขากําลังไดรับการยอมรับมากขึ้น และ [ROOT.GetName] กําลังเตรียมพรอมสําหรับสงคราม"
 war_justification.18.a: "อยางนอยสงครามก็จะทําใหความขัดแยงนี้สิ้นสุดลง"
 war_justification.19.t: "[ROOT.GetLeader] โกรธเคืองทาทีขมขูของ [From.GetAdjective]"
 war_justification.19.d: "'พลเมืองไรเดียงสาของ [ROOT.GetName] ที่จินตนาการวาชาว [From.GetAdjective] เปนชนชาติที่รักสันตินั้นหลุดโลกความเปนจริงไปโดยสิ้นเชิง ผูที่อาศัยอยูตามแนวชายแดนของเราไมมีโอกาสหลงผิดเชนนั้น เพราะพวกเขาเห็นกองทหารของอีกฝายประชิดเขามาอยูอีกฟากพรมแดน นี่คือภัยคุกคามที่เราจะปลอยไวโดยไมตอบโตไมได ทุกวันที่ผานไป [From.GetName] กําลังเตรียมทําสงคราม หากเราไมทําเชนเดียวกันก็คงเปนเรื่องบาบิ่น'\n\nการวางกําลังทหารของ [From.GetAdjective] ใกลดินแดนของเราไดจุดชนวนความกังวลมากขึ้น เมื่อชาตินี้ดูจะเปนศัตรูของ [ROOT.GetRulingParty] มากขึ้นเรื่อย ๆ สวนวานี่เปนเหตุหรือผลของวาทกรรมโจมตีของพวกเขา ยังเปนประเด็นที่ถกเถียงกันอยู"
 war_justification.19.a: "ไมวาอยางไร เราตองเตรียมประชาชนใหพรอมสําหรับสงคราม"
 war_justification.20.t: "[ROOT.GetLeader] สนับสนุนการบุก [From.GetName]"
 war_justification.20.d: "'หากเราตองการไดเปรียบทางยุทธศาสตรในสงครามกับ [From.GetName] ที่คาดการณได หรือจะวาไปก็หลีกเลี่ยงไมได เราไมมีที่วางใหลังเล นี่คือเรื่องของการปกปองอนาคตของลูกหลานเรา และการทําใหมั่นใจวา [ROOT.GetName] จะมีที่ยืนในโลกของวันพรุงนี้ นี่คือเรื่องของความทุมเทตออุดมการณและอุดมคติที่เราถือเปนเรื่องธรรมดา ถึงเวลาลงมือแลว'\n\nสุนทรพจนปลุกใจหลายครั้งจากผูนํา [ROOT.GetRulingParty] โดยเฉพาะ [ROOT.GetLeader] ไดเรียกรองใหประชาชนสนับสนุนการบุก [From.GetName] แรงจูงใจทางภูมิรัฐศาสตรเบื้องหลังการบุกถูกกลาวถึงนอยกวาการปลุกความรูสึกรักชาติในวาทกรรมเหลานี้ แตการรณรงคนี้ดูจะไดผลอยางยิ่งในการโนมนาวประชาชนใหเห็นถึงความจําเปน"
 war_justification.20.a: "ทั้งชาติยืนหยัดสนับสนุนการตัดสินใจสําคัญครั้งนี้"
 war_justification.201.t: "[From.GetLeader] กลาวโจมตี [ROOT.GetName]"
 war_justification.201.d: "'[ROOT.GetName] เปนของชาว [ROOT.GetAdjective] หรือ? ลองถามตัวเองดวยคําถามที่ดีกวานั้น: อนาคตเปนของชาว [ROOT.GetAdjective] หรือเปนของ [From.GetName]?'\n\nสุนทรพจนของ [From.GetLeader] ในวันนี้บงบอกวา [From.GetName] กําลังอยูบนเสนทางสูสงคราม ความตึงเครียดทางการเมืองกอตัวขึ้นตลอดเดือนที่ผานมา และดูเหมือนวาประชาชน [From.GetAdjective] ไดยอมรับแลววาสงครามเปนสิ่งที่หลีกเลี่ยงไมได [ROOT.GetName] ก็ตองเตรียมพรอมเชนกัน"
 war_justification.201.a: "ทําไมเราจึงไมไดรับอนุญาตใหอยูอยางสงบสุข?"
 war_justification.202.t: "[From.GetLeader] ประณามอุดมการณของ [ROOT.GetAdjective]"
 war_justification.202.d: "'ชาว [ROOT.GetAdjective] อางวามีเสรีภาพและประชาธิปไตย อางวาตองการสันติภาพ แตทุกสิ่งที่พวกเขาภาคภูมิใจนั้นลวนกลวงเปลา ประชาธิปไตยของพวกเขาแบงแยกประชาชนในยามที่ควรรวมเปนหนึ่ง และเสรีภาพของพวกเขาก็เผยใหเห็นเพียงการขาดวินัย พวกเราชาว [From.GetAdjective] มองทะลุคําโกหกเหลานี้... และเรามองเห็นวาสันติภาพนี้ สันติภาพตามเงื่อนไขของพวกเขา ก็เปนคําโกหกเชนกัน'\n\n[From.GetRulingParty] เยาะเยยความออนแอของชาติ [ROOT.GetAdjective] มานานแลว แตระยะหลังวาทกรรมกาวราวขึ้นเรื่อย ๆ วันแหงการปะทะดวยอาวุธใกลเขามาทุกที"
 war_justification.202.a: "ก็สมกับเปนพวกสวะฟาสซิสตอยาง [From.GetLeader]"
 war_justification.203.t: "[From.GetLeader] เตือนภัยคอมมิวนิสต [ROOT.GetAdjective]"
 war_justification.203.d: "'มีภัยคุกคามใดตอวิถีชีวิตของเรา หรือแมแตตอชีวิตเองยิ่งกวาคอมมิวนิสตอีกหรือ? โรคระบาดนี้คุกคามจะใหทาสแทนที่จะเปนนายไดปกครองทุกชาติ จะลมลางชาติ ลมลางผูคนและประวัติศาสตรของพวกเขา เราจะยึด [From.GetName] และกําจัดโรคระบาดคอมมิวนิสตใหสิ้นซาก'\n\nความเกลียดชังคอมมิวนิสตของ [From.GetLeader] เปนที่รูกันดีตั้งแตกอน [From.GetRulingParty] จะขึ้นสูอํานาจ แตดูเหมือนจะทวีความรุนแรงขึ้นเมื่อไมนานมานี้ โดยเฉพาะตอรัฐบาล [ROOT.GetAdjective] ภารกิจของเราในการกวาดลางลัทธิมารกซใหหมดไปจากโลกอาจเริ่มตนที่นั่น"
 war_justification.203.a: "หากพวกเขากลัวอุดมการณของเรา ก็เทากับกลัวประชาชนของตัวเอง"
 war_justification.204.t: "[From.GetName] เตรียมพรอมสําหรับการตอสูครั้งใหญ"
 war_justification.204.d: "'ชาว [ROOT.GetAdjective] เปนชนชาติที่ไมยอมสละอํานาจงาย ๆ อยางไรก็ตาม พวกเขาก็ตองตระหนักเชนกันวาเสนทางของสองชาติเรามีแตจะจบลงดวยการปะทะ เราตองเตรียมใจใหแข็งแกรงสําหรับการตอสูที่กําลังจะมาถึง เพราะ [ROOT.GetName] จะไมถูกยึดไดโดยไมมีการสูรบ'\n\nความเปนไปไดที่รัฐบาลซึ่งมีแนวคิดคลายกันของ [ROOT.GetName] และ [From.GetName] จะเขาใจกันได ไดหลีกทางใหแกการรณรงคเพื่อยึดดินแดนของพวกเขาดวยกําลัง"
 war_justification.204.a: "ใหพวกมันมาเลย!"
 war_justification.205.t: "[From.GetLeader] นําการปฏิวัติสู [ROOT.GetName]"
 war_justification.205.d: "'แมเราจะสรางสังคมสังคมนิยมใน [From.GetName] ใหมั่นคงแลว แตอีกหลายชาติยังคงทนทุกขอยูใตทรราชในระบอบเกา กรรมกรใน [ROOT.GetName] ไมมีปากเสียง ไมมีหนทางจัดตั้งองคกร และความพยายามใด ๆ ที่จะสถาปนาสังคมนิยมจะถูกระบอบ [ROOT.GetLeader] บดขยี้อยางโหดเหี้ยม เราไมอาจรอใหฟนเฟองของการปฏิวัติสากลหมุนไปถึงประชาชน [ROOT.GetAdjective] ได เราไดพิสูจนแลววาเราบดขยี้ผูกดขี่นายทุนที่นี่ได และเราจะบดขยี้ผูกดขี่ใน [ROOT.Capital.GetName] เชนกัน!'\n\n[From.GetLeader] ไดละทิ้งความพยายามทางการทูตทั้งหมดกับรัฐบาลของเรา ภารกิจของคอมมิวนิสตในการขจัดพรมแดนทั้งปวง บัดนี้มุงเปาไปที่การขจัดพรมแดนของเราโดยเฉพาะ"
 war_justification.205.a: "[ROOT.GetLeader] เปนผูปกครองที่ดีกวานักฉวยโอกาสปฏิวัติคนใด!"
 war_justification.206.t: "[From.GetLeader] เรียกรองใหชวยเหลือกรรมกร [ROOT.GetAdjective]"
 war_justification.206.d: "'มีคําโกหกใดยิ่งใหญไปกวาเสรีภาพจอมปลอมของประชาชน [ROOT.GetAdjective] อีกหรือ? ในอดีตพวกเขาเคยตกเปนทาสของเจาชายและดยุกที่อางกรรมสิทธิ์เหนือผืนดิน บัดนี้พวกเขาถูกบังคับใหขายแรงงานแกผูที่อางกรรมสิทธิ์เหนือโรงงาน เสรีภาพในการเลือกนายคนหนึ่งแทนอีกคนแทบเรียกไมไดวาเปนเสรีภาพ ทํานองเดียวกัน เสรีภาพในการเลือกตั้งผูนําก็เปนเพียงทางเลือกจอมปลอม เพราะโฆษณาชวนเชื่อจะไมมีวันยอมใหนักสังคมนิยมแทขึ้นสูอํานาจ ประชาชนที่ถูกลางสมองถึงเพียงนี้จะรอดไดก็ดวยการแทรกแซงของ [From.GetAdjective] เทานั้น'\n\nดวยไมยอมรับวาประชาชนของเราอาจพึงพอใจไดโดยไมตองมีการทดลองทางสังคมของพวกเขา ระบอบคอมมิวนิสตใน [From.GetName] จึงขมขูอยางเปดเผยวาจะโจมตีชาติของเรา แทบไมมีเหตุผลใหเชื่อวาความขัดแยงนี้จะคลี่คลายไดอยางสันติ"
 war_justification.206.a: "ความเชื่อของพวกเขาจะมีคุณคาอะไร หากตองบังคับยัดเยียดใหเรา?"
 war_justification.207.t: "คอมมิวนิสต [ROOT.GetAdjective] กําลังลมเหลว"
 war_justification.207.d: "'สหายทั้งหลาย แมนักปฏิวัติผูยิ่งใหญที่สุดก็เคยถูกเรียกวาผูทรยศมาแลว แตบัดนี้เห็นไดชัดวาการปฏิวัติเองตางหากที่ถูกทรยศ มิฉะนั้นจะอธิบายการปกครองของ [ROOT.GetRulingParty] แหง [ROOT.GetName] ไดอยางไร ในเมื่อพวกเขาโยนทิ้งทุกรองรอยของแนวคิดมารกซิสต เพื่อสรางรัฐกรรมกรที่เสื่อมทราม ซึ่งพวกเขาจะปกครองไดภายใตขออางจอมปลอม? ดวยการเสริมสรางอํานาจของตนเองโดยแลกกับการปฏิวัติสากล พวกเขาไดแสดงใหเห็นวาแทบไมใสใจอุดมการณที่ตนอางวายึดถือ เราตองนําการปฏิวัติที่แทจริงไปสูพวกเขา'\n\nแมในตอนแรก [From.GetLeader] จะสนับสนุนชัยชนะของ [ROOT.GetRulingParty] ใน [ROOT.Capital.GetName] แตก็คอย ๆ หางเหินจากแนวคิดของ [ROOT.GetLeader] ความขัดแยงไดบานปลายจนถึงขั้นที่พวกเขากําลังเตรียมบุกเพื่อบังคับยัดเยียดสังคมนิยมแบบของตนใหแกเรา"
 war_justification.207.a: "พวกเขาไมเขาใจวาการปฏิวัติมีความหมายเพียงใดตอประชาชน [ROOT.GetAdjective]"
 war_justification.208.t: "[From.GetLeader] เรียกรองใหบดขยี้ลัทธิชาตินิยม [ROOT.GetAdjective]"
 war_justification.208.d: "'มีสังคมใดที่นารังเกียจตออนาคตของการปฏิวัติ หรือแปลกแยกจากความทุกขยากของกรรมกรยิ่งกวาระบอบฟาสซิสตแหง [ROOT.GetName] อีกหรือ? พวกเขาเรียกรองใหประชาชนอุทิศตนอยางคลั่งไคลตอสถาบันรัฐชาติที่ผุพัง พวกเขาเอาความปาเถื่อนแบบโบราณมาแตงตัวดวยเครื่องแตงกายสมัยใหม พยายามนําเสนอตนเองเปนอนาคตทางเลือกแทนชัยชนะสากลของชนชั้นแรงงานที่หลีกเลี่ยงไมได เปนเพียงเรื่องของเวลากอนที่พวกเขาจะโจมตีเราหรือพันธมิตรของเรา เราจงโจมตีกอน'\n\nไมมีใครคาดหวังอะไรมากไปกวาความดูแคลนซึ่งกันและกันระหวางเรากับชาว [ROOT.GetAdjective] แตระยะหลังความเปนปรปกษไดทวีความรุนแรงขึ้น เมื่อฟง [From.GetLeader] พูดแลว ดูเหมือนความขัดแยงจะปะทุขึ้นในไมชา"
 war_justification.208.a: "ความตายจงมีแดคอมมิวนิสต!"
 war_justification.209.t: "การทูตกับ [ROOT.GetName] ลมเหลว"
 war_justification.209.d: "'แมเราจะพยายามหาทางออกทางการทูตตอความขัดแยงกับ [ROOT.GetName] แตการเจรจาก็ลมเหลวลงอีกครั้ง ทําใหเราเหลือทางเลือกจํากัด ระบอบอํานาจนิยมของ [ROOT.GetLeader] ไดแสดงทาทีอันไรเหตุผลตอเรื่องนี้ ซึ่งเปนแบบฉบับของผูนําที่ไมตองรับผิดชอบตอประชาชนของตน หากผูนํา [ROOT.GetAdjective] ไมกลับลํานโยบายโดยสิ้นเชิง เราจะไมมีทางเลือกอื่นนอกจากการตอสู'\n\nการแทรกแซงกิจการภายในของเราโดย [From.GetAdjective] เปนประเด็นรอน โดยนักการเมืองฝายคานของพวกเขาบางคนกลาวหาวา [From.GetRulingParty] ดําเนินนโยบายสายเหยี่ยวมาตั้งแตตน ไมวาเจตนาแตแรกจะเปนอยางไร บัดนี้สงครามในอนาคตก็ดูเปนเรื่องจริงและหลีกเลี่ยงไมไดขึ้นมาทันที"
 war_justification.209.a: "วาทกรรมดูแคลนของพวกเขาขมขูเราไมได"
 war_justification.210.t: "[From.GetLeader] เรียกรองใหแทรกแซงใน [ROOT.GetName]"
 war_justification.210.d: "'ดวยความหนักใจ เราตองเผชิญกับความจริงของสถานการณ: การบุก [ROOT.GetName] อาจเปนทางเลือกเดียวของเรา มันมีความไดเปรียบทางยุทธศาสตรมากเกินกวาที่จะลองหาทางออกอื่นในสถานการณปจจุบัน แมเราเชื่อมั่นวาทั้งประชาชน [From.GetAdjective] และ [ROOT.GetAdjective] ตางไมตองการสงคราม แตประวัติศาสตรไดนําเรามาถึงจุดนี้ และทางเลือกของเรามีจํากัด เราไดแตหวังวาการแสดงแสนยานุภาพทางทหารครั้งนี้จะชวยใหเราหลีกเลี่ยงการนองเลือดในอนาคตได'\n\nแมจะมีทฤษฎีที่นิยมกันวาประเทศประชาธิปไตยจะไมทําสงครามกับประเทศประชาธิปไตยดวยกัน แตพัฒนาการลาสุดบงชี้วา [From.GetAdjective] จะบุก [ROOT.GetName] ในอนาคต ประวัติศาสตรอาจทําใหเราประหลาดใจก็ได"
 war_justification.210.a: "ยังไง [From.GetName] ก็เปนประชาธิปไตยที่นาสงสัยอยูแลว ถึงไดทําการกาวราวเชนนี้"
 war_justification.211.t: "[From.GetLeader] กลาวตอตานภัยแดง"
 war_justification.211.d: "'ไมตองสงสัยเลยวาคอมมิวนิสตของ [ROOT.GetName] เปนภัยคุกคามที่รายแรงที่สุดอยางหนึ่งตอเสรีภาพและความสงบเรียบรอยในยุคนี้ มันไมลดละและไรปรานี คุกคามจะกลืนกินไมเพียงความหวังของประชาชน [ROOT.GetAdjective] ที่จะมีสังคมประชาธิปไตยอันรุงเรือง แตรวมถึงความหวังของเพื่อนบานดวย หากเราไมลงมือตอนนี้ เราอาจเห็นโดมิโนตัวแรกลมลงเมื่อสายเกินไป ทิ้งไวเพียงการทดลองทางสังคมที่ลมเหลวอีกมากมาย ตองมีคนตายอีกเทาไรเราจึงจะเขาแทรกแซง?'\n\nขบวนการกรรมกรที่เพิ่งกอตัวไดทําใหผูนํา [From.GetAdjective] หวาดหวั่น ขณะที่ผูแทนฝายคานของพวกเขาเรียกสิ่งนี้วาความหวาดกลัวภัยแดงที่มุงหาเหตุทําสงครามกับเรา วาทกรรมของ [From.GetRulingParty] ก็ประสบความสําเร็จอยางสูงจนถึงตอนนี้"
 war_justification.211.a: "ตราบใดที่ยังมีกําไรใหทํา พวกนายทุนก็จะสรางสงครามขึ้นมา"
 war_justification.212.t: "[From.GetLeader] เผชิญหนาลัทธิฟาสซิสต [ROOT.GetAdjective]"
 war_justification.212.d: "'ในประวัติศาสตรสมัยใหม หรือบางทีอาจในประวัติศาสตรทั้งหมด ไมเคยมีทรราชใดเลวรายไปกวาการกุมอํานาจอยางเหล็กกลาที่ [ROOT.GetRulingParty] มีเหนือ [ROOT.GetName] ในขณะนี้ บางคนอาจแยงวาเราไมควรยั่วยุใหเกิดความขัดแยง วาเราควรไวใจให [ROOT.GetLeader] รักษาสนธิสัญญาและคํามั่นสัญญาในอนาคต แตคนเหลานี้มองไมเห็นวาสนธิสัญญาที่ทําภายใตการปกครองของฟาสซิสตนั้นไรคา สําหรับพวกโกหกไรเกียรติเหลานี้ อํานาจคือความถูกตอง และกระดาษที่ใชเขียนขอตกลงก็ลุกไหมไดงายพอ ๆ กับหนังสือของผูที่วิจารณพวกเขา'\n\nดวยความริษยาตอสังคมอันรุงโรจนที่เรากําลังสรางและมรดกที่เปนรากฐานของมัน ชาว [From.GetAdjective] ดูเหมือนพรอมจะกอสงครามเพื่อทําลายมัน ขออางเรื่องสันติภาพของพวกเขาก็มีคาเพียงเทานี้"
 war_justification.212.a: "หลีกเลี่ยงไมได ใหมันจบ ๆ ไปเสียดีกวา"
 war_justification.213.t: "[From.GetLeader] เรียกรองใหทําสงครามกับ [ROOT.GetName]"
 war_justification.213.d: "'แมเราจะเปนชนชาติที่รักสันติ แตธรรมชาติของเราเพียงอยางเดียวไมไดกําหนดเสนทางที่เราตองเดินในประวัติศาสตร นี่คือยุคแหงสงคราม ชาว [ROOT.GetAdjective] ครอบครองปจจัยที่เราจําเปนตองใชเพื่อฝาฟนบททดสอบที่อาจตองเผชิญมานานเกินไปแลว และเห็นไดชัดวาพวกเขาจะไมยอมสละมันอยางสันติ แมเราจะพยายามอยางดีที่สุดเพื่อสรางรัฐสมัยใหม แตบางเรื่องก็ตัดสินไดดวยบททดสอบแบบเกา นั่นคือการรบเทานั้น'\n\nในสุนทรพจนลาสุดตอประชาชน [From.GetAdjective] วาทกรรมที่เปนปรปกษตอ [ROOT.GetName] ไดทวีความรุนแรงขึ้น และ [From.GetLeader] ไดพยายามอยางมากในการสรางความชอบธรรมใหแกการบุก ประชาชนสวนหนึ่งสนับสนุนแนวทางนี้ แตการตัดสินใจอยูในมือของผูนําของพวกเขา"
 war_justification.213.a: "พวกเขาจะเสียใจที่ทําใหเราเปนศัตรู"
 war_justification.214.t: "[From.GetLeader] ทาทายความหยิ่งผยองของ [ROOT.GetAdjective]"
 war_justification.214.d: "'[ROOT.GetName] อาจคิดวาตนทันสมัยและกาวหนากวาเรา แตความจริงคือชาติของพวกเขายังไมเคยถูกทดสอบเหมือนชาติเรา และไมไดเตรียมพรอมรับภัยคุกคามที่บัดนี้เห็นไดชัดอยูที่ขอบฟา ดวยการดูแคลนเรา และขัดขวางไมใหเรายึดสิ่งที่เปนของเราโดยชอบธรรม พวกเขาไดทําใหเรากลายเปนหนึ่งในภัยคุกคามเหลานั้นตอตัวพวกเขาเอง ชาติที่ออนแอและแตกแยกของพวกเขาแทบจะตานทานการอางสิทธิ์ของเราไมได'\n\nทัศนคติเหยียดหยาม [ROOT.GetName] ที่ [From.GetRulingParty] ยึดถือมานานไดพัฒนาจากการวิพากษวิจารณไปสูความเปนปรปกษ แมความเห็นทั่วไปจะมองวาประชาชน [ROOT.GetAdjective] ตองการหลีกเลี่ยงสงคราม แต [From.GetLeader] อางวาผูนําที่เราเลือกตั้งมาไดยั่วยุใหเกิดสงครามดวยความหยิ่งยโสของตน"
 war_justification.214.a: "แนนอนวาเสียงเรียกรองสันติภาพในหมูประชาชน [From.GetAdjective] ถูกปดปากไปแลว"
 war_justification.215.t: "[From.GetLeader] ตองการฟนฟูความสงบเรียบรอยใน [ROOT.GetName]"
 war_justification.215.d: "'จิตวิญญาณแหงชาติ [From.GetAdjective] นั้นแข็งแกรง แตไมใชทุกชาติจะโชคดีเชนนี้ [ROOT.GetName] ถูกทําลายขนบธรรมเนียม และผูปกครองอันชอบธรรมก็ถูกสังหารและฝงกลบไปนานแลว ทั้งหมดนี้ในนามของแนวคิดการปฏิวัติมารกซิสตอันยิ่งใหญ เปนหนาที่ของเราที่จะฟนฟูความสงบเรียบรอยใหแกโลกที่ถูกพวกแยงชิงอํานาจกระหายเลือดชักนําใหหลงทาง และแสดงพลังของ [From.GetName] ตอตานภัยคุกคามนี้'\n\nแม [From.GetRulingParty] จะตอตานคอมมิวนิสตมาโดยตลอด แตในสุนทรพจนชวงหลัง [ROOT.GetName] ตกเปนเปาการโจมตีเปนพิเศษ ดวยความหวาดกลัววาชาติของตนจะกาวสูขั้นตอไปของประวัติศาสตรอยางหลีกเลี่ยงไมได การโจมตีชิงลงมือกอนตอคอมมิวนิสต [ROOT.GetAdjective] จึงกําลังถูกเตรียมการอยูแลว"
 war_justification.215.a: "สายเกินไปแลวที่จะยอนความกาวหนาที่เราสรางมา"
 war_justification.216.t: "[From.GetLeader] ประณามผูกดขี่ [ROOT.GetAdjective]"
 war_justification.216.d: "'ฝายตรงขามของผมอยากใหพวกทานเชื่อวาการปกครองของผมเหมือนกับของ [ROOT.GetRulingParty] ใน [ROOT.GetName] พวกเขาผิดอยางที่สุด ขณะที่ความสําเร็จของ [ROOT.GetLeader] เปนผลจากกระแสนิยมชั่ววูบ เปนขบวนการมวลชนอันทําลายลางที่มุงรังแกชาติอื่นใหยอมสยบ [From.GetRulingParty] กลับยืนหยัดตอตานขบวนการนั้นในฐานะผูที่ไมยอมสยบ ผมพรอมจะทําทุกอยางที่จําเปนเพื่อกําจัดภัยคุกคามนี้ แมจะหมายถึงสงครามก็ตาม'\n\nระบอบ [From.GetLeader] ไดใชนโยบายที่เปนปรปกษตอชาติ [ROOT.GetAdjective] แผนการอันมีวิสัยทัศนเพื่อความยิ่งใหญในอนาคตของเราทําใหชาติของพวกเขาตองอับอาย และไมนาแปลกใจที่พวกเขารูสึกถูกคุกคาม"
 war_justification.216.a: "หากพวกเขาอยากทดสอบพลังของเรา พวกเขาจะตองเสียใจ"
 war_justification.217.t: "[From.GetLeader] ตั้งคําถามตออธิปไตยของ [ROOT.GetAdjective]"
 war_justification.217.d: "'ใครเปนผูกําหนดพรมแดนของชาติ และกําหนดอยางไร? ไมวาในอดีตผูคนจะหาวิธีใดมาอางความชอบธรรมวา [From.GetName] สิ้นสุดตรงไหนและ [ROOT.GetName] เริ่มตนตรงไหน เราก็อยูในยุคใหมแลว ความสําคัญทางยุทธศาสตรของพรมแดนนี้ไมอาจกลาวเกินจริงได และเรามีสิทธิ์โดยชอบที่จะขยับมันเพื่อรับประกันความมั่นคงของประชาชนเราตอไป'\n\nเมื่อฟงสุนทรพจนลาสุดของ [From.GetLeader] การบุก [ROOT.GetName] ดูเหมือนจะใกลเขามาแลว เสียงคัดคานไดทักทวง แตการสนับสนุนสงครามจากประชาชนกําลังเพิ่มขึ้น"
 war_justification.217.a: "โลกไมไดเรียนรูอะไรเลยจากมหาสงครามหรือ?"
 war_justification.218.t: "[From.GetLeader] ตั้งขอสงสัยตอเจตนาของ [ROOT.GetName]"
 war_justification.218.d: "'ไมตองสงสัยเลยวา [ROOT.GetName] กําลังเตรียมทําสงคราม การเปลี่ยนแปลงนโยบายเศรษฐกิจแสดงใหเห็นชัดวาชาว [ROOT.GetAdjective] ไมใชชนชาติที่รักสันติ แตกําลังรอโอกาสที่เหมาะสมเพื่อโจมตีเรา เราจะยืนดูเฉย ๆ ขณะที่พวกเขาสะสมอาวุธในยามที่ [From.GetName] ไรการปองกันหรือ? หรือเราจะปลดอาวุธภัยคุกคามนี้กอนที่มันจะเติบโตเกินกําลังของเรา?'\n\nฝายสายเหยี่ยวใน [From.GetRulingParty] ไดหันมาจับตา [ROOT.GetName] โดยใหเหตุผลวาการโจมตีคือการปองกันที่ดีที่สุด มุมมองของพวกเขากําลังไดรับการยอมรับมากขึ้น และ [From.GetName] กําลังเตรียมพรอมสําหรับสงคราม"
 war_justification.218.a: "นี่คือเหตุผลที่เราตองเตรียมพรอม"
 war_justification.219.t: "[From.GetLeader] โกรธเคืองทาทีขมขูของ [ROOT.GetAdjective]"
 war_justification.219.d: "'พลเมืองไรเดียงสาของ [From.GetName] ที่จินตนาการวาชาว [ROOT.GetAdjective] เปนชนชาติที่รักสันตินั้นหลุดโลกความเปนจริงไปโดยสิ้นเชิง ผูที่อาศัยอยูตามแนวชายแดนของเราไมมีโอกาสหลงผิดเชนนั้น เพราะพวกเขาเห็นกองทหารของอีกฝายประชิดเขามาอยูอีกฟากพรมแดน นี่คือภัยคุกคามที่เราจะปลอยไวโดยไมตอบโตไมได ทุกวันที่ผานไป [ROOT.GetName] กําลังเตรียมทําสงคราม หากเราไมทําเชนเดียวกันก็คงเปนเรื่องบาบิ่น'\n\nการวางกําลังทหารของเราใกลดินแดน [From.GetAdjective] ไดจุดชนวนความกังวลมากขึ้น เนื่องจากพวกเขาตีความการเคลื่อนกําลังพลของเราวาเปนหลักฐานของเจตนาเปนปรปกษ พวกเขาแทบไมไดคิดเลยวาวาทกรรมกาวราวของตนตางหากคือเหตุผลที่เราตองใชมาตรการปองกัน"
 war_justification.219.a: "หลังคําขูเหลานี้ เราคงปลดอาวุธไมไดแน"
 war_justification.220.t: "[From.GetLeader] สนับสนุนการบุก [ROOT.GetName]"
 war_justification.220.d: "'หากเราตองการไดเปรียบทางยุทธศาสตรในสงครามกับ [ROOT.GetName] ที่คาดการณได หรือจะวาไปก็หลีกเลี่ยงไมได เราไมมีที่วางใหลังเล นี่คือเรื่องของการปกปองอนาคตของลูกหลานเรา และการทําใหมั่นใจวา [From.GetName] จะมีที่ยืนในโลกของวันพรุงนี้ นี่คือเรื่องของความทุมเทตออุดมการณและอุดมคติที่เราถือเปนเรื่องธรรมดา ถึงเวลาลงมือแลว'\n\nสุนทรพจนปลุกใจหลายครั้งจากผูนํา [From.GetRulingParty] โดยเฉพาะ [From.GetLeader] ไดเรียกรองใหประชาชนสนับสนุนการบุก [ROOT.GetName] แรงจูงใจทางภูมิรัฐศาสตรเบื้องหลังการบุกถูกกลาวถึงนอยกวาการปลุกความรูสึกรักชาติในวาทกรรมเหลานี้ แตการรณรงคนี้ดูจะไดผลอยางยิ่งในการโนมนาวประชาชนใหเห็นถึงความจําเปน"
 war_justification.220.a: "เตรียมตัวไวดีกวา สงครามกําลังจะมา"
 war_justification.301.t: "[ROOT.GetLeader] ถูกวิจารณเรื่องนโยบายตางประเทศที่ออนแอ"
 war_justification.301.d: "'เรามีโอกาสจะโจมตีศัตรู แต [ROOT.GetRulingParty] กลับปลอยใหมันหลุดลอยไป นี่ไมเพียงเปนอีกกรณีที่นาประณามในบรรดาโอกาสที่พลาดไปมากมายในการเสริมสถานะของ [ROOT.GetName] บนเวทีโลก แตยังเปนสัญญาณวาการอางวาพวกเขาทําเพื่อผลประโยชนของประชาชน [ROOT.GetAdjective] นั้นสวนใหญเปนเพียงวาทกรรมกลวงเปลา ถึงเวลาเปลี่ยนนโยบายแลว'\n\nความลมเหลวของเราในการทําสงครามที่หลายคนคาดหวังไวไดกลายเปนเปาการวิพากษวิจารณอยางรุนแรงจากฝายตรงขามทางการเมือง การไมดําเนินแผนการทางทหารใหถึงที่สุดจะทําใหเราโนมนาวประชาชนไดยากขึ้นวาเรากําลังนํา [ROOT.GetName] ไปในทิศทางใด"
 war_justification.301.a: "พวกเขาไมอยากหลีกเลี่ยงสงครามหรอกหรือ?"
 war_justification.301.b: "ไมมีที่วางสําหรับความเห็นตางในที่สาธารณะนอกที่ประชุมพรรค"
 war_justification.301.c: "เราจะปลอยใหใครกลาวหาวา [ROOT.GetLeader] ขี้ขลาดไมได!"
 nuke_dropped.1.t: "การทิ้งระเบิดปรมาณูใส [From.From.GetName]"
 nuke_dropped.1.d: "เปนครั้งแรกและหวังวาจะเปนครั้งสุดทายในประวัติศาสตร ที่ระเบิดนิวเคลียรถูกจุดระเบิดใน [From.From.GetName] ในฐานะสวนหนึ่งของสงครามระหวางประเทศซึ่งดําเนินการโดย [?global.nukecountry.GetNameDef] การทําลายลางอยางที่ไมเคยเกิดขึ้นมากอนเปนประจักษพยานถึงพลังทําลายลางอันนาสะพรึงของอาวุธใหมนี้ ซึ่งเปนที่หวาดกลัวไมเพียงเพราะสิ่งที่มันทําตอเปาหมาย แตยังเพราะผลที่ตามมาตอผูใชมันและตอมวลมนุษยชาติเอง\n\nโลกทั้งใบกลั้นหายใจรอดูวาจะเกิดอะไรขึ้นตอไป สิ่งนี้จะบีบให [From.From.Owner.GetNameDef] ยอมจํานนเพื่อหลีกเลี่ยงความสยดสยองที่มากขึ้น หรือจะยิ่งทําใหพวกเขามุงมั่นตอบโตผูที่ยอมใชมาตรการเชนนี้?"
 nuke_dropped.1.a: "ยุคปรมาณูไดเริ่มตนขึ้นอยางแทจริงแลว"
 nuke_dropped.1.b: "เราจะทําทุกอยางที่จําเปนเพื่อปกปองประชาชน [ROOT.GetAdjective]"
 nuke_dropped.2.t: "การทิ้งระเบิดปรมาณูใสฮิโรชิมะ"
 nuke_dropped.2.d: ""ถนนหนทางราวกับฉากหนึ่งในนรก"\n - คูนิโยชิ ไอกาวะ\n\nวันนี้ ระเบิดนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยลงมาไดระเบิดเหนือเมืองฮิโรชิมะที่ความสูง 580 เมตร พื้นที่กวาสองในสามของเมืองถูกทําลายในพริบตา แมเมืองนี้จะสรางขึ้นใหทนตอแผนดินไหว แตมีอาคารแข็งแรงเพียงไมกี่หลังที่รอดพนจากแรงระเบิด\n\nขณะที่พลังของระเบิดปรมาณูถูกโหมประโคมในความรับรูของสาธารณชน ความสูญเสียของมนุษยจากอาวุธนี้กลับถูกลดทอนความสําคัญ ไมมีฝายใดอยากใครครวญถึงความสยดสยองของเหตุการณนี้ แตมรดกของมันจะเปนชีวิตที่สูญสิ้นไปในชั่วพริบตาและกัมมันตรังสีที่ตกคางยาวนาน"
 nuke_dropped.2.a: "ตองมีอีกกี่คนที่ลมตายกอนสงครามนี้จะจบ?"
 nuke_dropped.2.b: "เราตองรีบชวยเหลือผูเคราะหราย"
 nuke_dropped.3.t: "การทิ้งระเบิดปรมาณูใสนางาซากิ"
 nuke_dropped.3.d: "ระเบิดนิวเคลียรซึ่งเดิมตั้งใจจะทิ้งที่โคกูระ ไดระเบิดขึ้นเหนือนางาซากิในวันนี้ สภาพอากาศบีบใหเครื่องบินตองเปลี่ยนเปาหมายภารกิจ ทั้งควัน เมฆ และปญหาทางเทคนิค ลวนเปนปจจัยชี้ขาดในเหตุการณที่อาจเปลี่ยนประวัติศาสตร\n\nผลของระเบิดถูกจํากัดลงบางจากที่ตั้งของเมืองซึ่งอยูในหุบเขา แตความเสียหายก็ยังรุนแรง ฐานทัพทหารบางแหงถูกโจมตี แตความสูญเสียของพลเรือนอันหายนะนั้นบดบังสิ่งเหลานั้นไปจนหมด อาจตองใชเวลาหลายทศวรรษกวาเราจะรูผลระยะยาวของอาวุธนี้อยางแนชัด ภัยคุกคามจาก [?global.nukecountry.GetNameDef] ไรขอบเขต"
 nuke_dropped.3.a: "สิ่งนี้จะนําไปสูการยอมจํานนของ [From.From.Owner.GetAdjective] หรือไม?"
 nuke_dropped.3.b: "เราเคยหวังวานางาซากิจะรอดพน"
 nuke_dropped.4.t: "การทิ้งระเบิดปรมาณูใสเบอรลิน"
 nuke_dropped.4.d: "วันนี้ [GetDateText] กรุงเบอรลิน เมืองหลวงของเยอรมนี ถูกโจมตีดวยระเบิดนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยมา เมืองนี้เคยถูกโจมตีมาหลายครั้งทั้งในสงครามนี้และสงครามครั้งกอน แตทั้งหมดลวนเทียบไมไดกับครั้งนี้ นับตั้งแตสงครามสามสิบป เบอรลินไมเคยพบกับความหายนะเทียบเทานี้มากอน และเมื่อพิจารณาถึงการเติบโตของเมืองแลว สิ่งนี้เคยถูกมองวาเปนไปไมได\n\nดูเหมือนบังเกอรฟอเรอรจะรอดจากแรงระเบิด อยางนอยสวนหนึ่งเพราะระเบิดตกหางจากจุดศูนยกลางที่วางแผนไว และมีขาวลือวา [From.From.Owner.GetLeader] ยังมีชีวิตอยู แมจะเดือดดาลก็ตาม อยางไรก็ตาม ผูนํา [From.From.Owner.GetAdjective] ควรถูกอพยพอยางไร และจะปกปองพวกเขาจากกัมมันตรังสีไดหรือไม ก็เปนอีกเรื่องหนึ่ง"
 nuke_dropped.4.a: "วันนี้ ผมโลงใจที่ไมไดเปนชาวเบอรลิน"
 nuke_dropped.4.b: "ศัตรูโจมตีเขาที่หัวใจของชาติเราแลว!"
 nuke_dropped.5.t: "การทิ้งระเบิดปรมาณูใสลอนดอน"
 nuke_dropped.5.d: "วันนี้ระเบิดนิวเคลียรไดทําลายลางกรุงลอนดอน แมเมืองจะมีระบบปองกันภัยทางอากาศ แต [From.From.Owner.GetNameDef] ก็ไมไดเตรียมพรอมรับการโจมตีครั้งนี้ที่ [?global.nukecountry.GetNameDef] เปนผูกอ เมื่อ [GetDateText] หอนาฬกาบิ๊กเบนไดตีบอกเวลาเปนครั้งสุดทายกอนจะหลอมละลายไปกับแรงระเบิด รายงานเบื้องตนระบุวาพระราชวังบักกิงแฮมถูกทําลายราบเปนหนากลอง และขณะนี้ยังไมทราบวาพระราชวงศประทับอยูที่ใด\n\nอยางไรก็ตาม มีการยืนยันแลววา [From.From.Owner.GetLeader] รอดชีวิต และกําลังเตรียมสุนทรพจนปลุกใจทางวิทยุในชวงบายวันนี้ เมื่อขวัญกําลังใจตกตํ่าถึงขีดสุด ประชาชนชาวอังกฤษตองการสิ่งนี้อยางยิ่ง หรือไมก็การยอมจํานนที่ใชถอยคํางดงามที่สุด"
 nuke_dropped.5.a: "ยากที่จะรักษาความสุขุมแบบอังกฤษไวไดเมื่อเผชิญคลื่นระเบิดนิวเคลียร"
 nuke_dropped.5.b: "ขอพระเจาทรงคุมครององคราชา!"
 nuke_dropped.6.t: "การทิ้งระเบิดปรมาณูใสเกียวโต"
 nuke_dropped.6.d: "เมืองเกียวโต ศูนยกลางอุตสาหกรรมสําคัญของ [From.From.Owner.GetAdjective] ถูกระเบิดนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยมาโจมตีในวันนี้ มีการคาดการณวาเมืองนี้ถูกเลือกเปนเปาหมายเพราะไดรับการยกยองวาเปนศูนยกลางทางปญญา\n\nความงดงามและความสําคัญทางประวัติศาสตรของเกียวโตทําใหหลายคนคิดวาเมืองนี้จะรอดพนจากระเบิด แตดูเหมือนวาความสยดสยองของการโปรยหายนะลงบนสถานที่เชนนี้กลับถูกมองวาเปนขอไดเปรียบ เพราะเพิ่มผลกระทบทางจิตวิทยาของการโจมตี ที่ตั้งของเมืองในหุบเขาชวยจํากัดแรงระเบิดไดบาง แตพระราชวังหลวงเกาและอาคารอุตสาหกรรมจํานวนมากถูกทําลายจนสิ้นซาก"
 nuke_dropped.6.a: "มรดกและความงามไมมีความหมายอะไรในสงครามเชนนี้"
 nuke_dropped.6.b: "หากพวกเขาทําลายสิ่งเกา เราก็จะสรางสิ่งใหม"
 nuke_dropped.7.t: "การทิ้งระเบิดปรมาณูใสโตเกียว"
 nuke_dropped.7.d: "วันนี้ [?global.nukecountry.GetNameDef] ไดโจมตีดวยนิวเคลียรเขาที่หัวใจของจักรวรรดิญี่ปุน แมกรุงโตเกียวจะถูกคาดวาเปนเปาหมายของการทิ้งระเบิดเพลิง แตไมเคยมีใครคิดวาจะเปนเปาหมายลําดับตนของอาวุธใหมนี้ ทวาในที่สุด บางทีอาจเพราะความสําคัญของเมืองหลวงใหมและพระราชวังหลวงซึ่งบัดนี้ถูกทําลายแลว ไฟที่เผาผลาญทุกสิ่งยิ่งกวาเดิมจึงไดตกลงสูเมืองนี้\n\nแมจะมีรายงานวา [From.From.Owner.GetLeader] รอดชีวิต แตเหตุการณนี้ไดสรางคําถามวาศัตรูของญี่ปุนพรอมจะไปไกลเพียงใด หากสงครามไมจบลงดวยเหตุการณนี้ จะยังเหลือเปาหมายใดอีก? ยังเหลืออะไรใหขมขูอีก?"
 nuke_dropped.7.a: "นี่หมายถึงจุดจบของจักรวรรดิญี่ปุนหรือไม?"
 nuke_dropped.7.b: "ตราบใดที่ [From.From.Owner.GetLeader] ยังมีชีวิต จักรวรรดิก็ยังคงอยู"
 nuke_dropped.8.t: "การทิ้งระเบิดปรมาณูใสวอชิงตัน ดี.ซี."
 nuke_dropped.8.d: "วันนี้ระเบิดนิวเคลียรไดระเบิดขึ้นเหนือเมืองหลวงของสหรัฐอเมริกา ในการโจมตีที่เล็งเปาไปยังศูนยกลางทางการเมืองและมรดกทางประวัติศาสตรของสหรัฐฯ อยางชัดเจน ทําเนียบขาว อาคารรัฐสภา รวมถึงอนุสาวรียและอนุสรณสถานจํานวนมากถูกลบหายไปจากพื้นโลกโดยศัตรูของพวกเขา [?global.nukecountry.GetNameDef] แมแตการเผากรุงวอชิงตันเมื่อกวาศตวรรษกอนก็เทียบไมไดกับความหายนะที่อาวุธทําลายลางนี้นํามาสูเมือง\n\nแมประธานาธิบดี [From.From.Owner.GetLeader] จะถูกพาไปยังที่ปลอดภัยแลว แตชาติก็สั่นสะเทือนถึงแกน ไมตองสงสัยเลยวาสหรัฐฯ หวังจะเปนประเทศแรกและประเทศเดียวที่ครอบครองอาวุธเชนนี้ บัดนี้ความหวังนั้นไดแหลกสลายไปในแบบที่เลวรายที่สุด"
 nuke_dropped.8.a: "หนึ่งชาติที่ไมอาจแบงแยก ปะทะหนึ่งอะตอมที่แบงแยกได"
 nuke_dropped.8.b: "พญาอินทรีจะผงาดจากเถาถานดั่งนกฟนิกซ"
 nuke_dropped.9.t: "การทิ้งระเบิดปรมาณูใสโรม"
 nuke_dropped.9.d: "วันนี้ระเบิดนิวเคลียรไดถลมกรุงโรม สรางความตกตะลึงไปทั่วโลก ในการโจมตีที่ไมเคยเกิดขึ้นมากอนโดย [?global.nukecountry.GetNameDef] ดวยสมบัติทางประวัติศาสตรและศิลปะของเมือง หลายคนไมเคยคิดวานครโบราณแหงนี้จะตกเปนเปาการทําลายลางอยางไมเลือกหนาเชนนี้ เมื่อนครรัฐวาติกันก็ถูกทําลายไปบางสวนและยังไมทราบวาสมเด็จพระสันตะปาปาอยูที่ใด เหตุการณนี้จึงสรางความสยดสยองไมเพียงแกชาวอิตาลี แตรวมถึงชาวคาทอลิกทั่วโลก\n\nการเติบโตอยางรวดเร็วของโรมในทศวรรษที่ผานมาแทบถูกลบลางไปจนหมดสิ้นดวยการโจมตีครั้งนี้ ชวงหนึ่งดูเหมือนวาเมืองนี้จะชวยใหชาติฟนตัวไดหลังสงครามจบ บัดนี้ความหวังเหลานั้นไดกลายเปนผุยผงไปพรอมกับผูคนมากมาย"
 nuke_dropped.9.a: "Bomba Iacta Est!"
 nuke_dropped.9.b: "กรุงโรมไมไดสรางใหมเสร็จในวันเดียว..."
 nuke_dropped.10.t: "การทิ้งระเบิดปรมาณูใสปารีส"
 nuke_dropped.10.d: "วันนี้ อุปกรณนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยมาไดระเบิดขึ้นเหนือกรุงปารีส กอความเสียหายเปนวงกวางและผูเสียชีวิตนับไมถวน ฝรั่งเศสตกอยูในความตกตะลึงเมื่อเมืองหลวงตองเผชิญกับสิ่งที่อาจเปนการโจมตีที่รายแรงที่สุดเทาที่เคยประสบ แมจะผานสงครามและการปฏิวัติมาหลายศตวรรษ ชาวปารีสอาจเคยคาดวาจะถูกพิชิต แตไมใชความรกรางวางเปลาอันโหดรายถึงเพียงนี้\n\nขบวนพาเหรดฉลองชัยใด ๆ บนถนนช็องเซลีเซผานซากประตูชัยดูจะเปนไปไมไดในสภาพเมืองตอนนี้ บางทีทศวรรษขางหนาอาจไดเห็นการถือกําเนิดของปารีสแหงใหม แตปารีสในความทรงจําของผูคน เมืองที่สรางขึ้นในยุคแบลเอปอก ไดสูญสิ้นไปตลอดกาล"
 nuke_dropped.10.a: "นครแหงแสงสวางไดมอดไหมไปแลว"
 nuke_dropped.10.b: "เมื่อวานนี้เอง ดูเหมือนเราจะมีปารีสอยูเสมอ"
 nuke_dropped.11.t: "การทิ้งระเบิดปรมาณูใสมอสโก"
 nuke_dropped.11.d: "มอสโก เมืองที่หลายคนพยายามพิชิตแตลมเหลว ตกเปนเปาการโจมตีดวยนิวเคลียรโดย [?global.nukecountry.GetNameDef] ในวันนี้ แรงระเบิดพุงเปาไปที่หัวใจของผูนํา [From.From.Owner.GetAdjective] โดยพระราชวังเครมลินถูกทําลายเกือบสิ้นเชิง\n\n[From.From.Owner.GetLeader] ซึ่งระยะหลังตื่นตัวและหวาดกลัวตอภัยคุกคามทั้งที่เปนไปไดและเปนไปไมไดมากขึ้น ไดอพยพทันเวลาและรอดชีวิต อยางไรก็ตาม แมแตความกวางใหญของ [From.From.Owner.GetName] ก็อาจไมพอใหหนีพนศัตรูที่ไรปรานีเชนนี้ อันที่จริง หากเปนเชนนี้ตอไป ชาตินี้จะเหลือเพียงดินแดนรกรางสองประเภท: ที่รกรางมาแตแรก และที่ศัตรูสรางขึ้น"
 nuke_dropped.11.a: "ฤดูหนาวนิวเคลียรจะไมยิ่งทําใหมอสโกเปนเปาที่ยากขึ้นหรอกหรือ?"
 nuke_dropped.11.b: "พวกมันอาจเผาทุกเมืองของเรา แตจะไมมีวันยึดมันได"
 nuke_dropped.12.t: "การทิ้งระเบิดปรมาณูใสโคเปนเฮเกน"
 nuke_dropped.12.d: "วันนี้ กรุงโคเปนเฮเกนถูกโจมตีดวยระเบิดนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยมา เมืองหลวงแหงนี้ซึ่งเติบโตขึ้นหลังรอดพนการทําลายลางในมหาสงครามดวยความเปนกลางของเดนมารก ไมเคยประสบการโจมตีที่รายแรงใกลเคียงนี้มากอนนับตั้งแตสงครามนโปเลียน พื้นที่รอบชองแคบเออเรซุนดก็ไดรับกัมมันตรังสีอยางหนัก และผูรอดชีวิตเริ่มหนีไปยังเกาะฟนและแผนดินใหญเพราะกลัวการโจมตีระลอกใหม\n\nขณะนี้ยังไมทราบวาพระเจาคริสเตียนที่ 10 ประทับอยูที่ใด และขวัญกําลังใจของชาติไดรับความเสียหายอยางหนักจากการโจมตีครั้งนี้ ยังตองรอดูวานี่จะเปนจุดเริ่มตนของจุดจบของหนึ่งในชาติที่เกาแกที่สุดของยุโรปหรือไม"
 nuke_dropped.12.a: "มีบางสิ่งแผรังสีอยูในแผนดินเดนมารก"
 nuke_dropped.12.b: "เมืองนี้เคยถูกเผามาแลว แตไมเคยดับสูญ"
 nuke_dropped.12.c: "ดวยพลูโตเนียม เราจะทําใหชาวเดนสคุกเขา!"
 nuke_dropped.13.t: "การทิ้งระเบิดปรมาณูใสสตอกโฮลม"
 nuke_dropped.13.d: "สตอกโฮลมเมืองอันงดงาม เวนิสแหงทิศเหนืออันนาภาคภูมิ ถูกระเบิดนิวเคลียรที่ [?global.nukecountry.GetNameDef] ปลอยมาโจมตีในวันนี้ แมในอดีตจะพยายามอยางดีที่สุดเพื่อคงความเปนกลาง แตบัดนี้ชาวสวีเดนตองจายราคาสูงสุดของความขัดแยงระหวางประเทศ จุดศูนยกลางของแรงระเบิดอยูกลางยานตอนกลางใตของสตอกโฮลม พื้นที่ที่ตั้งใจไวสําหรับการพัฒนาในอนาคตและโครงการกอสรางขนาดใหญ ซึ่งบัดนี้ถูกทําลายจนไมอาจฟนคืน\n\nเมืองสวนใหญเสียหายจนจําไมได แตสิ่งปลูกสรางเกาที่สลุสเซินดูเหมือนจะรอดจากแรงระเบิดไดดีกวาที่คาด จึงไดมีการตัดสินใจใหคงไวอยางไมแตะตองตลอดไปเพื่อเปนอนุสรณแหงความทรหดของเมือง"
 nuke_dropped.13.a: "ดวยเหตุนี้ ความเปนกลางของสวีเดนจะเหลือเพียงความทรงจํา"
 nuke_dropped.13.b: "เสือสวีเดนจะไมมีวันสูญเสียลายของมัน!"
 soviet.30.t: "เรียกรองเบสซาราเบีย"
 soviet.30.d: "โรมาเนียไมอาจหวังจะตานทานพลังของกองทัพแดงได หากเราสงขอเรียกรองดินแดนเบสซาราเบียที่เราอางสิทธิ์โดยชอบธรรมไปให พวกเขาอาจยอมมอบใหโดยไมสูรบเลยก็ได"
 soviet.30.a: "สงคําขาด!"
 soviet.30.b: "ไม เราจะจายดวยเลือดและเหล็ก!"
 soviet.31.t: "เรียกรองคาเรเลีย"
 soviet.31.d: "ฟนแลนดไมอาจหวังจะตานทานพลังของกองทัพแดงได หากเราสงขอเรียกรองดินแดนคาเรเลียที่เราอางสิทธิ์โดยชอบธรรมไปให พวกเขาอาจยอมมอบใหโดยไมสูรบเลยก็ได"
 soviet.31.a: "สงคําขาด!"
 soviet.31.b: "ไม เราจะจายดวยเลือดและเหล็ก!"
 soviet.32.t: "กดขี่เอสโตเนีย"
 soviet.32.d: "เอสโตเนียไมอาจหวังจะตานทานพลังของกองทัพแดงได หากเราสงขอเรียกรองสิทธิ์ตั้งฐานทัพและการควบคุมความมั่นคงชายแดนไปให เราก็จะผนวกพวกเขาไดโดยพฤตินัยโดยไมตองสูรบ"
 soviet.32.a: "สงคําขาด!"
 soviet.32.b: "ไม เราจะจายดวยเลือดและเหล็ก!"
 soviet.33.t: "กดขี่ลัตเวีย"
 soviet.33.d: "ลัตเวียไมอาจหวังจะตานทานพลังของกองทัพแดงได หากเราสงขอเรียกรองสิทธิ์ตั้งฐานทัพและการควบคุมความมั่นคงชายแดนไปให เราก็จะผนวกพวกเขาไดโดยพฤตินัยโดยไมตองสูรบ"
 soviet.33.a: "สงคําขาด!"
 soviet.33.b: "ไม เราจะจายดวยเลือดและเหล็ก!"
 soviet.34.t: "กดขี่ลิทัวเนีย"
 soviet.34.d: "ลิทัวเนียไมอาจหวังจะตานทานพลังของกองทัพแดงได หากเราสงขอเรียกรองสิทธิ์ตั้งฐานทัพและการควบคุมความมั่นคงชายแดนไปให เราก็จะผนวกพวกเขาไดโดยพฤตินัยโดยไมตองสูรบ"
 soviet.34.a: "สงคําขาด!"
 soviet.34.b: "ไม เราจะจายดวยเลือดและเหล็ก!"
 soviet.35.t: "[From.GetNameDefCap] ตองการเขารวม [SOV.GetNameDef]"
 soviet.35.d: "ความวุนวายทางการเมืองเมื่อไมนานมานี้ใน [From.GetName] ทําใหรัฐบาลของพวกเขามีวิสัยทัศนอันแนวแนตออนาคตที่สอดคลองกับของเรา พวกเขาไดเห็นสิ่งดีที่สหภาพโซเวียตอันทรงพลังทําใหแกโลกได และพรอมจะทุมเททุกสิ่งเพื่อมาตุภูมิ"
 soviet.35.a: "เริ่มดําเนินการ"
 soviet.35.b: "ยังไมใชเวลาสําหรับการเคลื่อนไหวเชนนี้"
 soviet.35_threat_LIT: "ลิทัวเนียเปนสวนหนึ่งของสหภาพโซเวียต"
 soviet.35_threat_FIN: "ฟนแลนดเปนสวนหนึ่งของสหภาพโซเวียต"
 soviet.35_threat_EST: "เอสโตเนียเปนสวนหนึ่งของสหภาพโซเวียต"
 soviet.35_threat_LAT: "ลัตเวียเปนสวนหนึ่งของสหภาพโซเวียต"
 soviet.36.t: "[From.GetName] ตองการอยูใตการปกครองของเรา"
 soviet.36.d: "ความวุนวายทางการเมืองเมื่อไมนานมานี้ใน [From.GetName] ทําใหรัฐบาลของพวกเขามีวิสัยทัศนอันแนวแนตออนาคตที่สอดคลองกับแผนการของเรา พวกเขาแสวงหาความคุมครองจากเราและเสนอการสนับสนุนอยางไมมีเงื่อนไข อยางเปนทางการพวกเขาจะยังคงเปนชาติของตนเอง แตจะเดินตามมาตุภูมิในทุกยางกาว"
 soviet.36.a: "เครื่องมืออีกชิ้นที่จะชวยความกาวหนาของเรา"
 soviet.36.b: "พวกเขาจะตองการการคุมครองมากเกินไป"
 soviet.36_threat_LIT: "ลิทัวเนียเปนรัฐหุนเชิดของสหภาพโซเวียต"
 soviet.36_threat_FIN: "ฟนแลนดเปนรัฐหุนเชิดของสหภาพโซเวียต"
 soviet.36_threat_EST: "เอสโตเนียเปนรัฐหุนเชิดของสหภาพโซเวียต"
 soviet.36_threat_LAT: "ลัตเวียเปนรัฐหุนเชิดของสหภาพโซเวียต"
 soviet.37.t: "นายทหารรุนใหมผูมีความสามารถ"
 soviet.37.d: "นายทหารรุนใหมของเราพิสูจนแลววาพรอมรับภารกิจ และกําลังปรับตัวเขากับบทบาทใหมในกองบัญชาการทหารสูงสุด เมื่อกองทัพของเราอยูในมือของคณะนายทหารผูภักดี การกวาดลางของ [Root.GetLeader] ก็ดูจะไดผลตามที่เราหวังไวบาง กองทัพแดงกําลังฟนคืนพลัง และในไมชาจะแข็งแกรงยิ่งกวาที่เคย"
 soviet.37.a: "ยอดเยี่ยม"
 soviet.37.a_tt: "ลดบทลงโทษจาก §Yการกวาดลางนายทหาร§!"
 soviet.46.t: "มหาสงครามของผูรักชาติ"
 soviet.46.d: "แมเรายังมีงานอีกมากในการฟนฟูกองบัญชาการทหารสูงสุด แตการรุกคืบของกองทัพ [From.GetAdjective] ที่ชายแดนของเราไดจุดประกายความเฉลียวฉลาดและเจตจํานงรักชาติที่จะสูรบในหมูคณะนายทหารรุนใหม เราแข็งแกรงขึ้นทุกครั้งที่ถูกโจมตี ขณะที่เราเตรียมลุกขึ้นตอบโตดวยพลังทั้งหมดของ [Prev.GetName] ทหารทุกนายพรอมสละชีพและยืนหยัดตอสูกับศัตรู เราคาดวาสิ่งนี้จะเปนประโยชนอยางยิ่งตอการฝกฝนและความทุมเทของนายทหารรุนใหม แมหลังจากชนะสงครามนี้แลว!"
 soviet.46.a: "เพื่อความรุงโรจนแหง [Root.GetName]"
 soviet.46.a_tt: "เพิ่ม §Yมหาสงครามของผูรักชาติ§! ซึ่งหักลางบทลงโทษบางสวนจาก §Yการกวาดลางนายทหาร§!"
 soviet.48.t: "การปฏิวัติถาวร"
 soviet.48.d: "แมผูคนนับไมถวนจะถูกประหารชีวิตและจําคุกในฐานะผูทรยศและผูตอตานการปฏิวัติตลอดหลายปที่ผานมา แตผูดํารงตําแหนงระดับนําสวนใหญยังคงปลอดภัย อยางไรก็ตาม พวกเขาก็ไมไดพนจากความสงสัย นับตั้งแตมีการกอตั้งองคการสากลที่สี่ สตาลินดูเหมือนจะหมกมุนกับความคิดวาคนที่ใกลชิดเขาที่สุดไมเคยอยูขางเขาอยางแทจริง ผูที่พยายามเอาชนะความไววางใจของเขาก็ยิ่งโหมความคิดนี้เพื่อทําใหตนเองดูดีขึ้น\n\nสถานการณปจจุบันชางยอนแยงอยางยิ่ง: ความไมไววางใจภายในคณะบริหารชุดปจจุบันทําใหมันไปตอไมได และรัฐประหารก็ใกลจะเกิดขึ้นแลว สมาชิกพรรคบางคนเสนอวาการเชิญทรอตสกีกลับมาและหันการกวาดลางไปเลนงานพวกสตาลินนิสต อาจชวยลดความเสียหายจากสงครามกลางเมืองที่จะตามมาได แผนการนี้ซึ่งเปนสิ่งที่เลขาธิการใหญหวาดกลัวที่สุดมาหลายป จะนํามาใชไดจริงหรือ?"
 soviet.48.a: "คิดไมถึงเลย!"
 soviet.48.a_tt: "§Yสงครามกลางเมืองครั้งใหญจะปะทุขึ้นในไมชา§!"
 soviet.48.b: "สังคมนิยมในประเทศเดียวลมเหลวแลว เราตองการทรอตสกี"
 soviet.48.b_tt: "§Yสงครามกลางเมืองขนาดเล็กจะปะทุขึ้นเมื่อทรอตสกีกลับมา§!"
 soviet.49.t: "สงครามกลางเมืองรัสเซียครั้งที่สอง"
 soviet.49.d: "ดวยความหวาดระแวงที่เพิ่มขึ้นของสตาลิน พรรคและกองทัพจึงแตกแยก ผูที่สามารถไดรับความไววางใจจากเขา อยางนอยก็ชั่วคราว ตองการใหเขาอยูในอํานาจตอไปและรักษาลัทธิบูชาตัวบุคคลที่เขาสรางขึ้นไว แตคนอื่นอีกมากถูกกันออกจากวงในอยางไมเปนทางการ บางคนเชื่อวาการปกครองของสตาลินลมเหลวแลว ขณะที่บางคนสงสัยวาพวกตนเพียงรอวันที่ NKVD จะหาหรือสรางขออางมาจับกุม\n\nพวกเขาไดรวมตัวกันเปนกลุมที่ทรงพลังมากพอจะทาทายคณะบริหารชุดปจจุบัน เปาหมายที่ประกาศไวคือการโคนลมทรราชของสตาลินและเปลี่ยนผานจากรัฐเผด็จการเบ็ดเสร็จ โดยมีคณะนายทหารกํากับดูแลกระบวนการ\n\nผูสนับสนุนสตาลินในกองทัพและพรรคไดรวมพลังเพื่อรักษาระบอบปจจุบัน โดยเรียกฝายตรงขามวาผูทรยศตอตานการปฏิวัติ สงครามกลางเมืองครั้งใหมมาถึงแลว"
 soviet.49.a: "ความตายจงมีแดผูทรยศ!"
 soviet.50.t: "กอตั้งกองทัพปลดปลอยรัสเซีย"
 soviet.50.d: "การกอตั้งองคการสากลที่สี่ไดปลุกความหวาดกลัวของสตาลินตอผูทรยศในพรรคและกองบัญชาการทหารขึ้นมาอีกครั้ง หลังจากไดเห็นการพิจารณาคดีและการประหารชีวิตในการกวาดลางครั้งใหญ หลายคนสงสัยวาอีกครั้งกําลังจะมา เพื่อตอบโต นายพลกลุมหนึ่งซึ่งนําโดยอันเดรย วลาซอฟ ไดจัดตั้งคณะกรรมการปลดปลอยประชาชนแหงรัสเซีย โดยมีเปาหมายจะโคนลมระบอบสตาลินกอนที่มันจะสรางความเสียหายมากกวานี้\n\nแมเปาหมายระยะยาวที่ประกาศไวคือการเปลี่ยนผานสูประชาธิปไตย แตรูปแบบที่แนชัดยังไมชัดเจน สิ่งเดียวที่ชัดเจนคือพวกเขาตั้งใจจะโคนสตาลินลงจากอํานาจและยุติการปกครองของพวกบอลเชวิก"
 soviet.50.a: "ตองหยุดยั้งพวกมัน!"
 soviet.51.t: "NKVD กอรัฐประหาร"
 soviet.51.d: "การกอตั้งองคการสากลที่สี่ไดปลุกความหวาดกลัวของสตาลินตอผูทรยศในพรรคและกองบัญชาการทหารขึ้นมาอีกครั้ง หลังจากไดเห็นการพิจารณาคดีและการประหารชีวิตในการกวาดลางครั้งใหญ หลายคนสงสัยวาอีกครั้งกําลังจะมา NKVD ซึ่งเปนเครื่องมือสําคัญในการกวาดลาง ก็ตระหนักดีวาหนวยงานของตนเองก็อาจตกเปนเปาหมายเชนกัน แทนที่จะรอถูกจําคุก ประหารชีวิต และถูกแทนที่ ผูนําของหนวยงานจึงตัดสินใจชิงลงมือกอนและกอรัฐประหาร โดยไดรับการสนับสนุนจากเจาหนาที่ทหารที่มีความกังวลเชนเดียวกัน\n\nอยางไรก็ตาม แมจะมีสถานะที่ทรงอิทธิพล NKVD ก็พบวายากที่จะไดรับความไววางใจจากผูนํากองทัพ รัฐประหารประสบความสําเร็จเพียงในการยึดพื้นที่จํากัดของสหภาพ แตเมื่อเศษเสี้ยวของหนวยงานเกาตองเผชิญกับการประหารชีวิตอยางแนนอน พวกเขาก็คงไมยอมจํานน"
 soviet.51.a: "ตองจับกุมพวกมันใหได!"
 soviet.52.t: "รัฐประหารของผูรอดชีวิต"
 soviet.52.d: "การกอตั้งองคการสากลที่สี่ไดปลุกความหวาดกลัวของสตาลินตอผูทรยศในพรรคและกองบัญชาการทหารขึ้นมาอีกครั้ง หลังจากไดเห็นการพิจารณาคดีและการประหารชีวิตในการกวาดลางครั้งใหญ หลายคนสงสัยวาอีกครั้งกําลังจะมา เมื่อหลายคนจากไปแลว ก็เหลือผูตองสงสัยเพียงไมกี่คนที่รอดพนการประหารมาได ดวยความที่เคยถูกสอบสวนอยางโหดเหี้ยมและบางคนถูกจําคุก พวกเขารูดีวาตนจะเปนเหยื่อรายแรกของการกวาดลางครั้งตอไป ดวยความสิ้นหวัง นายพลเหลานี้จึงตัดสินใจพยายามโคนลมระบอบสตาลินกอนที่สิ่งนั้นจะเกิดขึ้น\n\nแมความพยายามนี้จะไมนาประสบความสําเร็จ แตผูรอดชีวิตบางคนจากการกวาดลางครั้งใหญก็สามารถยึดอํานาจควบคุมในบางพื้นที่ของสหภาพได อยางนอยที่สุด การปกครองของเลขาธิการใหญก็ถูกสั่นคลอนแลว"
 soviet.52.a: "เราตองรักษาเสถียรภาพใหเร็วที่สุด"
 soviet.53.t: "การกวาดลางที่สําเร็จ"
 soviet.53.d: "ภายหลังการกอตั้งองคการสากลที่สี่ การไลลาผูสนับสนุนทรอตสกีก็เขมขนขึ้น และหลายคนที่ใกลชิดสตาลินถูกประหารชีวิต เมื่อไมเหลือใครนอกจากตัวเอง สตาลินจึงถอยไปอยูในคฤหาสนของเขา เมื่อเพื่อนและสมาชิกครอบครัวผูทรยศทุกคนถูกจัดการเรียบรอยแลว ในที่สุดเขาก็ไดพักผอนและมุงมั่นอยางเต็มที่กับการสรางความรุงโรจนใหแก [SOV.GetNameDef]"
 soviet.53.a: "ถึงเวลาเก็บขวานแลว"
 soviet.54.t: "ภายใตการนําใหม"
 soviet.54.d_nopurge: "ดวยอํานาจของพรรคคอมมิวนิสตที่เสื่อมถอยลง เปนที่ชัดเจนมานานแลววาระบบสตาลินนิสตไมอาจดํารงอยูได\nพลังใหมไดลุกขึ้นยึดอํานาจ โดยอาศัยอุดมคติแบบรัสเซียนําทางประเทศของเราไปสูเสนทางใหม\n\nเพื่อเปนสัญลักษณของการเปลี่ยนผานนี้ [Root.GetLeader] ไดปลดสตาลินและกักบริเวณไวในบาน หางไกลจากศูนยกลางอํานาจที่เขาเคยคิดคนโครงการอันตรายมากมาย\nขณะที่ระบบรัสเซียใหมเติบโตขึ้นแทนที่ซากศพที่กําลังเนาเปอยของพรรค ความลับ ความหวาดระแวง และการวางแผนทางการเมืองของอดีตเลขาธิการใหญก็ไดสิ้นสุดลง"
 soviet.54.d_purge: "เปนที่ชัดเจนแลววาภัยคุกคามที่ใหญที่สุดตอรัฐรัสเซียไมใชผูสมคบคิดตอตานพรรคคอมมิวนิสต แตคือตัวพรรคเอง เมื่อความฝนคอมมิวนิสตในรัสเซียมลายสิ้น พลังใหมจึงไดยึดอํานาจเพื่อนําประเทศของเราสูอนาคต\n\nภายหลัง [Root.GetLeader] ปลดสตาลิน อดีตเลขาธิการใหญถูกนําตัวขึ้นพิจารณาคดีอยางรวบรัด การลาแมมดดวยความหวาดระแวงของเขาถูกระบุวาเปนการทําลายผูนําของชาติในยามที่จําเปนที่สุด สตาลินจึงถูกตัดสินประหารชีวิตในขอหากบฏ ระบบเกาก็ลงหลุมไรชื่อไปพรอมกับเขา"
 soviet.54.a: "รุงอรุณใหมของการเมืองรัสเซีย"
 usa.14.t: "สนธยาแหงฟาสซิสต"
 usa.14.d: "เยอรมนีนาซี แบบอยางอันยิ่งใหญของเรา ไดทรยศตอหลักการอันลึกซึ้งที่สุดของตนเอง และหันไปเปนพันธมิตรกับศัตรูตัวฉกาจ นั่นคือพวกคอมมิวนิสต เมื่อขาวนี้แพรสะพัดออกไป ความไมสงบก็ตามมาติด ๆ ประชาชนยอมเดินตามเรามาไกลถึงเพียงนี้ดวยความหวาดกลัวการปฏิวัติคอมมิวนิสต แตเมื่อเยอรมนีแปรพักตร การฟนฟูอันยิ่งใหญของเราก็กําลังถูกตั้งคําถาม"
 usa.14.a: "กลับคืนสูประชาธิปไตย"
 usa.14.b: "ยึดมั่นในฟาสซิสตตอไป"
 usa.24.t: "สนธยาแหงสีแดง"
 usa.24.d: "[SOV.GetNameDefCap] แรงบันดาลใจที่ทําใหผูคนมากมายเชื่อวาการโคนลมทุนนิยมเปนไปได ไดทรยศตอการปฏิวัติสากลและหันไปเขากับเยอรมนีนาซี ทั้งแนวคิดสังคมนิยมในประเทศเดียวและพันธมิตรกับพวกฟาสซิสตครั้งนี้ ทําใหผูคนเริ่มสงสัยในความจริงใจของอุดมการณคอมมิวนิสตทั่วโลก หรือคอมมิวนิสตแบบอเมริกันจะเปนเพียงอีกเครื่องมือหนึ่งที่ [Root.GetLeader] ใชรวบอํานาจ?"
 usa.24.a: "กลับคืนสูประชาธิปไตย"
 usa.24.b: "ยึดมั่นในคอมมิวนิสตตอไป"
 usa.17.t: "[From.From.GetName] ประกาศสงครามกับ [From.GetName]"
 usa.17.d: "โลกทุกวันนี้ก็ไมปลอดภัยอยูแลว เราจะปลอยใหเกิดสงครามในภูมิภาคของเราเองไดจริงหรือ หรือเราควรรักษาสันติภาพไว? เราสามารถยื่นคําขาดให [From.From.GetName] ทําสันติภาพกับ [From.GetName] หรือจะปลอยใหพวกเขาสูกันเองก็ได"
 usa.17.a: "แจงให [From.From.GetName] รูวาเราพรอมทําสงคราม"
 usa.17.a_tt: "§Rหาก [From.From.GetName] ยอมถอย จะเกิดสันติภาพแบบไมมีเงื่อนไข§!\n"
 usa.17.b: "ครั้งนี้เราจะไมเขาแทรกแซง"
 usa.18.t: "[From.GetName] เขาแทรกแซงสงครามกับ [being_attacked.GetName]"
 usa.18.d: "[From.GetName] ไมพอใจกับสงครามของเรากับ [being_attacked.GetName] พวกเขาขูวาจะทําสงครามกับเราหากเราไมลงนามสันติภาพกับ [being_attacked.GetName] โดยทันที \nเราควรยอมถอยหรือไม?"
 usa.18.a: "แจงให [From.GetName] รูวาเราพรอมทําสงคราม"
 usa.18.b: "เราจะยอมถอย"
 usa.18.b_tt: "[Root.GetNameWithFlag] ทําสันติภาพกับ [being_attacked.GetNameWithFlag]"
 usa.19.t: "[From.GetNameWithFlag] ไดรับเปาหมายสงครามตั้งรัฐหุนเชิด (แผนยุทธศาสตร) ตอ [Root.GetName]"
 usa.20.t: "อิทธิพลของสหรัฐฯ"
 usa.20.d: "การสงเสริมประชาธิปไตยของ [From.GetName] เริ่มสงผลตอประเทศของเรา การกระจายเสียงทางวิทยุทําใหสุนทรพจนของ [From.GetLeader] เขาถึงประชาชนของเรา และเราพบวาชาว[Root.GetAdjective]จํานวนมากหลงใหลในวิถีชีวิตแบบ[From.GetAdjective] [Root.GetName] ไมใชรัฐหุนเชิด และเราจะไมยอมให [From.GetName] มากําหนดการเมืองของเรา อยางไรก็ตาม เราปฏิเสธไมไดวาการเมืองแบบ[From.GetAdjective]มีอิทธิพลตอประเทศของเรา"
 usa.20.a: "ในใจเรา เราจะเปนชาว[Root.GetAdjective]เสมอ"
 usa.20.a_tt: "[Root.GetNameWithFlag] ไดรับ: §Yอิทธิพลของสหรัฐฯ§!"
 usa.21.d: "การสงเสริมลัทธิคอมมิวนิสตของ [From.GetName] เริ่มสงผลตอประเทศของเรา การกระจายเสียงทางวิทยุทําใหสุนทรพจนของ [From.GetLeader] เขาถึงประชาชนของเรา เรายังพบใบปลิวโฆษณาชวนเชื่อที่ปลุกระดมใหแรงงานชาว[Root.GetAdjective]รวมตัวกันและเชิดชูวิถีชีวิตแบบ[From.GetAdjective] [Root.GetName] ไมใชรัฐหุนเชิด และเราจะไมยอมให [From.GetName] มากําหนดการเมืองของเรา อยางไรก็ตาม เราปฏิเสธไมไดวาการเมืองแบบ[From.GetAdjective]มีอิทธิพลตอประเทศของเรา"
 usa.22.d: "การสงเสริมลัทธิฟาสซิสตของ [From.GetName] เริ่มสงผลตอประเทศของเรา การกระจายเสียงทางวิทยุทําใหสุนทรพจนของ [From.GetLeader] เขาถึงประชาชนของเรา และเรายังพบใบปลิวโฆษณาชวนเชื่อเชิดชูวิถีชีวิตแบบ[From.GetAdjective]ถูกแจกจายในบางพื้นที่ของประเทศ [Root.GetName] ไมใชรัฐหุนเชิด และเราจะไมยอมให [From.GetName] มากําหนดการเมืองของเรา อยางไรก็ตาม เราปฏิเสธไมไดวาการเมืองแบบ[From.GetAdjective]มีอิทธิพลตอประเทศของเรา"
 usa.23.t: "การคุมครองของสหรัฐฯ"
 usa.23.d: "[From.GetName] กําลังบังคับใชหลักการมอนโรอยางเขมงวดยิ่งขึ้น นอกจากอิทธิพลทางการเมืองที่มีตอประเทศของเราอยูแลว เจาหนาที่ของ [From.GetName] ยังประกาศวาพรอมจะเขาแทรกแซงความขัดแยงใด ๆ ระหวางประเทศในทวีปอเมริกา"
 usa.23.a: "[From.GetName] กําลังทรงอํานาจขึ้นเรื่อย ๆ"
 usa.23.a_tt: "[From.GetNameWithFlag] สามารถเขาแทรกแซงสงครามในทวีปอเมริกาไดแลว"
 britain.11.t: "อักษะเบอรลิน-มอสโก"
 britain.11.d: "พันธมิตรทางทหารเต็มรูปแบบระหวางเยอรมนีและโซเวียตอาจโคนลมระเบียบโลกและนํามาซึ่งยุคใหมแหงเผด็จการเบ็ดเสร็จ เพื่อตานทานสถานการณนี้ เราตองรวมชาติประชาธิปไตยทั่วโลกเขาเปนมหาพันธมิตรเพื่อตอสูกับภัยคุกคามจากนาซีและคอมมิวนิสต"
 britain.11.a: "รวมพลังประชาธิปไตย!"
 britain.11.b: "ไมจําเปนตองตื่นตูม"
 britain.12.t: "มหาพันธมิตร"
 britain.12.d: "สหราชอาณาจักรเชิญเราเขารวมฝายของพวกเขาเพื่อตอสูกับภัยคุกคามจากนาซีและคอมมิวนิสต เราควรตอบอยางไร?"
 britain.12.a: "ตกลง"
 britain.12.b: "ปฏิเสธ"
 britain.13.t: "ฝรั่งเศสตองการเขารวมฝายสัมพันธมิตร"
 britain.13.d: "โลกกําลังไมปลอดภัยมากขึ้นทุกที สหราชอาณาจักรและฝรั่งเศสยังคงเปนปอมปราการแหงประชาธิปไตยและเสรีภาพในยุโรป และบัดนี้ฝรั่งเศสเสนอที่จะเขารวมฝายสัมพันธมิตร\nเราควรตอบอยางไร?"
 britain.13.a: "ตกลง"
 britain.13.b: "ปฏิเสธ"
 britain.14.t: "การประชุมลอนดอน"
 britain.14.d: "รัฐบาลเยอรมนีเริ่มเคลื่อนไหวเรื่องสถานะของสโลวีเนีย ซึ่งพวกเขาอางวาเปนแควนคารนิโอลาของเยอรมันในอดีต และอางวาชาวเยอรมันและชาวสโลวีนถูกรัฐบาลยูโกสลาเวียกดขี่ รัฐบาลของสมเด็จพระราชาธิบดีจึงเชิญรัฐบาลฝรั่งเศส เยอรมนี และอิตาลีมารวมประชุมที่ลอนดอนเพื่อหาทางออกที่เปนธรรม ไมตองสงสัยเลยวาชนกลุมนอยเชื้อสายเยอรมันกลุมเล็ก ๆ นั้นตองการรวมกับเยอรมนี แตความตองการของชาวสโลวีนนั้นยังไมชัดเจนนัก ดูเหมือนเยอรมนีพรอมจะปลดปลอยสุนัขแหงสงครามเพราะเรื่องนี้ และเมฆทะมึนแหงสงครามก็กําลังกอตัวเหนือทวีปยุโรปอีกครั้ง"
 britain.14.a: "เราตองแสวงหาสันติภาพที่ยั่งยืน"
 britain.14.b: "ประวัติศาสตรจะไมใหอภัยเรา"
 britain.15.t: "ฝรั่งเศสทอดทิ้งเรา"
 britain.15.d: "รัฐบาลฝรั่งเศสไมยอมรับเหตุผลเรื่องขอเสนอปรับพรมแดนเพียงเล็กนอยของเรา และตัดสินใจทําลายสันติภาพเพื่อกอสงครามอันนาสะพรึงกลัว เราจะปลอยใหพวกเขาหมดแรงไปกับสงครามสนามเพลาะอันไรประโยชนอีกรอบ แลวพวกเขาจะมาออนวอนขอความชวยเหลือจากเราเอง"
 britain.15.a: "พวกเขาจะไดรูที่ทางของตัวเอง"
 britain.16.t: "สมเด็จพระเจาจอรจที่ 5 สวรรคต"
 britain.16.d: "สมเด็จพระเจาจอรจที่ 5 พระมหากษัตริยแหงสหราชอาณาจักรและดินแดนในเครือจักรภพอังกฤษ และจักรพรรดิแหงอินเดีย ไดเสด็จสวรรคตแลว ความสุขุมเยือกเย็นและความทุมเทตอพสกนิกรของพระองคไดนําพาจักรวรรดิผานพนทั้งมหาสงครามและภาวะเศรษฐกิจตกตํ่าครั้งใหญ พระราชโอรสของพระองคจะเสด็จขึ้นครองราชยเปนสมเด็จพระเจาเอ็ดเวิรดที่ 8 แตก็มีความกังวลแลววาพระองคอาจทรงมีพระดําริที่เปนอิสระเกินไป สแตนลีย บอลดวิน และเนวิลล แชมเบอรเลน กําลังเตรียมการเพื่อใหแนใจวาพระองคจะทรงยอมรับคําแนะนําจากนายกรัฐมนตรีและคณะรัฐมนตรี"
 britain.16.a: "ขอพระองคทรงสูสุคติ"
 britain.17.t: "สมเด็จพระเจาเอ็ดเวิรดสละราชสมบัติ"
 britain.17.d: "นายกรัฐมนตรีบอลดวินแสดงจุดยืนชัดเจนวาพระเกียรติของพระมหากษัตริยและจักรพรรดิจะมัวหมอง หากพระองคอภิเษกสมรสกับสามัญชน ซึ่งยังเปนหญิงหยาราง และที่รายไปกวานั้นคือเปนชาวอเมริกัน หลังจากทรงไตรตรองอยางหนัก พระองคทรงเลือกความรักเหนือหนาที่และทรงตัดสินพระทัยสละราชสมบัติ พระอนุชาของพระองค อัลเบิรต จะเสด็จขึ้นครองราชยเปนสมเด็จพระเจาจอรจที่ 6 เจามือรับพนันในลอนดอนเริ่มเปดราคาแลววาบุรุษขี้อายผูนี้จะอยูไปถึงพิธีบรมราชาภิเษกของตนเองหรือไม"
 britain.17.a: "ขอพระเจาทรงพิทักษสมเด็จพระเจาจอรจที่ 6"
 britain.18.t: "การกลับมาของกษัตริย"
 britain.18.d: "ไมใชความลับที่วาสมเด็จพระเจาจอรจที่ 6 กับ [Root.GetRulingParty] ไมไดลงรอยกันเลย บัดนี้มีเสียงในรัฐสภาเรียกรองใหพระองคสละราชสมบัติเพื่อเปดทางใหพระเชษฐาที่ถูกเนรเทศ คือเอ็ดเวิรดที่ 8 บุรุษผูไมแปลกแยกกับแนวคิดเอกภาพผานความแข็งแกรง และเปนผูมีวิสัยทัศนตออังกฤษ คุณสมบัติของพระองคคือสิ่งที่เราแสวงหาในผูนําของชาติ!"
 britain.18.a: "เพื่อจักรวรรดิ เอ็ดเวิรดที่ 8 ตองครองราชย!"
 britain.18.b: "เราจะไมแทรกแซงรัฐสภา"
 britain.19.t: "กอตั้งรัฐบาลอินเดียเสรี"
 britain.19.d: "ดวยการสนับสนุนจากญี่ปุน นักชาตินิยมอินเดียไดจัดตั้งรัฐบาลพลัดถิ่นขึ้น ในชื่ออาซาดฮินด\n\nนักชาตินิยมกําลังเผยแพรโฆษณาชวนเชื่อในบริติชราช และยุยงใหทหารซีปอยหนีทัพ แมตอนนี้พวกเขายังขาดแรงสนับสนุน แตความพยายามของพวกเขาอาจกลายเปนภัยอันตรายไดในที่สุด"
 britain.19.a: "ความพยายามที่สูญเปลา!"
 ENG_RAJ_azad_hind_tooltip: "แรงสนับสนุนของฝายชาตินิยมจะเพิ่มขึ้นเรื่อย ๆ เวนแตจะถูกตานดวยคํามั่นวาจะใหเอกราชในทายที่สุด"
 britain.20.t: "อาซาดฮินดนําการลุกฮือในอินเดีย"
 britain.20.d: "อาซาดฮินด รัฐบาลพลัดถิ่นอินเดียเสรี ไดเผยแพรโฆษณาชวนเชื่อและหาเสียงสนับสนุนในหมูประชาชนของบริติชราช แมในเวลาที่จักรวรรดิจําเปนตองรวมมือกันมากกวาที่เคย พวกเขากลับตัดสินใจวานี่คือเวลาที่จะลงมือ"
 britain.20.a: "ไม จักรวรรดิตองสามัคคีกัน!"
 britain.23.t: "การลุกฮือในอินเดีย"
 britain.23.d: "อาซาดฮินด รัฐบาลพลัดถิ่นอินเดียเสรี ประกาศวาถึงเวลาแลวที่ผูรักชาติที่แทจริงทุกคนจะจับอาวุธลุกขึ้นตอสูกับเจาอาณานิคมอังกฤษ ชะตากรรมของอินเดียแขวนอยูบนเสนดาย และเราตองตัดสินใจ"
 britain.23.a: "เราจะยืนหยัดเคียงขางจักรวรรดิ!"
 britain.23.b: "เราจะฉวยโอกาสนี้!"
 britain.24.t: "เริ่มใชงานโรงงานจากโครงการเงา"
 britain.24.d: "การเตรียมการอยางรอบคอบของเราในโครงการเงา เพื่อใหโรงงานพลเรือนเปลี่ยนผานสูอุตสาหกรรมยามสงครามเต็มรูปแบบไดอยางราบรื่น บัดนี้ไดผลิดอกออกผลแลว โรงงานใหมมีประสิทธิภาพสูงกวาที่คาดหวังไวมากในระยะเวลาเทานี้"
 britain.24.a: "ชางเปนการมองการณไกลที่โชคดีจริง ๆ!"
 poland.1.t: "ขยายดินแดนไปทางตะวันออก"
 poland.1.d: "หลังจากถูกบีบใหยกกดัญสกใหเยอรมัน บัดนี้เราถูกบีบอยูระหวางสองจักรวรรดิที่คุกคามอธิปไตยของเรา ในขณะที่เรากําลังเสียดินแดนทางตะวันตก และไมอาจไวใจใหฝายสัมพันธมิตรปกปองเราจากการรุกรานของเยอรมนี เราอาจพิจารณารวมมือกับความทะเยอทะยานของเยอรมนี และทวงคืนดินแดนบางสวนของเครือจักรภพเกาของเราที่ตอนนี้ถูกผนวกเขากับ [SOV.GetNameDef] หากเรายังคงเปนกลาง เราจะกลายเปนเหยื่ออันโอชะ และเราไดตอสูมาอยางหนักเกินกวาจะยอมใหโปแลนดถูกแบงแยกอีกครั้ง"
 poland.1.a: "ถึงเวลาเปลี่ยนฝายอักษะจากภัยคุกคามใหเปนพันธมิตร"
 poland.1.b: "การทํางานทางการทูตรวมกับโซเวียตเปนทางเลือกที่ดีกวา"
 poland.2.t: "[FROM.GetNameDefCap] เรียกรองดินแดนตะวันออก"
 poland.2.d: "หลังจากยืนยันการอางสิทธิ์เหนือดินแดนทางตะวันออกของเราอีกครั้ง [FROM.GetNameDef] ก็กดดันใหเรายกดินแดนนี้ให โดยบอกเปนนัยวานี่คือหนทางเดียวที่จะหลีกเลี่ยงการรุกรานอีกครั้ง และอาจรวมถึงการถูกผนวกหรือแบงแยกดินแดน\n\nโดยปกติแลว การยอมจํานนตอการขมขูเชนนี้โดยงายเปนเรื่องที่ไมตองพูดถึง แต [FROM.GetNameDef] ไมใชความกังวลเดียวของเรา หากเรายอมตามขอเรียกรอง เราอาจกังวลนอยลงเรื่องแนวรบดานตะวันออก แมวาจะทําใหแนวรบดานตะวันออกเลื่อนมาทางตะวันตกมากขึ้นอยางมากก็ตาม"
 poland.2.a: "ยอมยกดินแดนตะวันออกใหโดยสันติ"
 poland.2.b: "[ROOT.GetName] จะไมยอมจํานนโดยไมสู!"
 poland.3.t: "[FROM.GetName] ยอมยกดินแดนตะวันออก"
 poland.3.d: "หลังจากที่เรากดดันให [FROM.GetNameDef] ยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือดินแดนทางตะวันออกของพวกเขา พวกเขาก็ยอมยกดินแดนตามที่เราเรียกรองโดยไมมีการสูรบอีก อยางไรก็ตาม เราคงตองเลิกหวังที่จะสรางสัมพันธที่แนนแฟนกับชาตินี้ในอนาคต เมื่อใหสิ่งที่เราควรไดแลว พวกเขาดูเหมือนหวังจะติดตอกับเราใหนอยที่สุดเทาที่จะทําได"
 poland.3.a: "ตราบใดที่พวกเขายอมรับการอางสิทธิ์ของเรา ก็ไมมีปญหาอะไร"
 poland.4.t: "[FROM.GetName] ปฏิเสธที่จะยกดินแดนตะวันออก"
 poland.4.d: "แมเราจะพยายามแกไขขอพิพาทกับ [FROM.GetNameDef] อยางสันติ แตพวกเขาก็ปฏิเสธที่จะยกดินแดนทางตะวันออก และบีบใหเราตกอยูในสถานะที่ทางเลือกเดียวในการอางสิทธิ์คือสงคราม เห็นไดชัดวาประเทศที่สรางปญหานี้คงหนีการถูกแบงแยกไมพน แมจะไดรับโอกาสแลวก็ตาม"
 poland.4.a: "พวกเขาคิดวาจะตานเราไดงั้นหรือ?"
 poland.5.t: "[FROM.GetNameDefCap] เสนอการคุมครอง"
 poland.5.d: "หลังจากที่ [FROM.GetNameDef] อางสิทธิ์เหนือโปแลนดตะวันออก เราคาดวาการโจมตีอีกครั้งใกลจะเกิดขึ้น อยางไรก็ตาม ขอเสนอลาสุดจากชาว[FROM.GetAdjective]บงชี้ไปในทางตรงกันขาม ดูเหมือนวาหากเรายอมยกดินแดนที่ถูกอางสิทธิ์ พวกเขายินดีใหเราเขารวมเปนพันธมิตร ยิ่งไปกวานั้น พวกเขาสัญญาวาหากเกิดสงครามกับเยอรมนี เราจะไดรับการชดเชยความสูญเสียดวยดินแดนใหมทางตะวันตก\n\nแมนี่อาจเปนขอเสนอที่ดีกวาที่เราคาดไว แตเราก็ไมอาจรูไดวาสงครามในอนาคตที่วานี้จะเกิดขึ้นจริงหรือไม บางที [FROM.GetNameDef] อาจแคตองการฮุบดินแดนอยางงายดาย และบีบใหเราเขาไปอยูในเขตอิทธิพลของพวกเขา ถึงกระนั้น นี่อาจเปนการคุมครองที่ดีที่สุดที่เราพึ่งพาได"
 poland.5.a: "เราตองตอบรับตอนนี้ กอนที่จะสายเกินไป"
 poland.5.b: "[ROOT.GetName] ยังไมสิ้นหวัง!"
 poland.6.t: "[FROM.GetNameDefCap] ยอมรับการคุมครอง"
 poland.6.d: "การเสนอรับ [FROM.GetNameDef] ไวใตปกของเราและนําพวกเขาไปสูการพิชิตดินแดนทางตะวันตกในอนาคต แลกกับดินแดนทางตะวันออก กลายเปนแนวทางที่ประสบความสําเร็จ เมื่อไดรับสัญญาวาจะไดสวนแบงของเยอรมนีหากชนะสงคราม พรอมการคุมครองจากเรา พวกเขาจึงตกลงยกดินแดนทางตะวันออกใหโดยสันติ"
 poland.6.a: "พันธมิตรที่รวมตอตานเยอรมนียอมดีกวาการถูกแบงแยกอีกครั้ง"
 poland.7.t: "[FROM.GetNameDefCap] ปฏิเสธการคุมครอง"
 poland.7.d: "แมเราจะยื่นขอเสนอที่ใจกวางที่สุดเทาที่จะทําได โดยพยายามทําขอตกลงให [FROM.GetNameDef] ยกดินแดนทางตะวันออกแลกกับสัญญาวาจะไดสวนแบงของเยอรมนีในอนาคต แต [From.GetLeader] ก็ปฏิเสธความพยายามทางการทูตของเรา [FROM.GetNameDefCap] เลือกเสนทางที่ยากลําบาก สําหรับเรา และยิ่งกวานั้นสําหรับตัวพวกเขาเอง"
 poland.7.a: "สิ่งใดที่ซื้อไมได ก็ตองยึดเอา"
 poland.8.t: "[POL.GetName] ไดรับเยอรมนีตะวันออก"
 poland.8.d: "ตามที่ไดตกลงกันไวกอนหนานี้ หลังจาก [SOV.GetNameDef] ผนวกดินแดนเยอรมนีตะวันออกแลว ดินแดนบางสวนจะตกอยูใตการควบคุมของ[POL.GetAdjective] เพื่อชดเชยการโอนโปแลนดตะวันออกใหแก [SOV.GetNameDef] ในอดีต"
 poland.8.a: "ภายใตสถานการณเชนนี้ การเลื่อนไปทางตะวันตกคือสิ่งที่ดีที่สุดที่เราหวังได"
 poland.9.a: "ดูเหมือนสถานการณจะคลี่คลายลงอยางเปนที่พอใจของทั้งสองฝาย"
 poland.10.t: "[From.GetName] เขารวม [Root.GetFactionName]!"
 poland.10.d: "ดวยตระหนักถึงความจําเปนที่จะตองเปนหนึ่งเดียวกันเพื่อตานภัยคุกคามที่รายลอมประเทศของเราทุกดาน วันนี้ [From.GetLeader] ไดประกาศตอชาวโลกวา [From.GetName] ไดทําสนธิสัญญากับ [Root.GetName] เพื่อความปลอดภัยรวมกัน"
 poland.10.a: "วันนี้ [Root.GetName] และ [From.GetName] ยืนหยัดเคียงกันดั่งพี่นอง"
 poland.11.t: "[From.GetName] ปฏิเสธที่จะเขารวม [Root.GetFactionName]"
 poland.11.d: "ดวยการกระทําอันโงเขลาที่คิดไปเองวาเปนการเอาตัวรอด วันนี้ [From.GetLeader] ประกาศวา [From.GetName] จะงดเวนการดําเนินการทางการทูตใด ๆ ที่อาจถูกมองวาเปนการคุกคามเพื่อนบานผูทรงอํานาจ จึงปฏิเสธคําขอของเราที่จะใหเขารวม [Root.GetFactionName]"
 poland.11.a: "ความปลอดภัยเดียวคือการยืนหยัดรวมกัน"
 poland.12.t: "วอยเต็กไมเคยทําลังกระสุนหลน"
 poland.12.d: "พลทหารวอยเต็กพิสูจนแลววาเปนสมาชิกที่มีคุณคาอยางหาที่เปรียบไมไดในสายสงกําลังบํารุงของเรา แมในยามการรบดุเดือด กระสุนปนเล็กเฉียดขนบนหัว แขน และขาของมัน ก็ไมเคยทําลังกระสุนหลนแมแตลังเดียว ทหารผูกลาหาญนายนี้ทําใหปนใหญของเรายิงตอไปได และมีสวนสําคัญในการเอาชนะขาศึก ดวยเหตุนี้จึงมีการตัดสินใจเลื่อนยศใหวอยเต็ก"
 poland.12.a: "ขอใหเราทุกคนไดแรงบันดาลใจจากความกลาหาญของเขา"
 WOJTEK_COMMANDER: "วอยเต็กกลายเปน§Hผูบัญชาการกองทัพนอย§!"
 greece.1.t: "คําขาดของโซเวียต"
 greece.1.d: "เรากําลังถูกโซเวียตกดดันใหยกดินแดนให พวกเขาขูวาจะทําสงครามเต็มรูปแบบหากเราไมยอม การยอมอาจรักษาชีวิตทหารกรีกไดมากมาย แตนี่จะเปนครั้งสุดทายที่พวกเขาเรียกรองดินแดนหรือไม?"
 greece.1.a: "การหลีกเลี่ยงสงครามดีที่สุดสําหรับกรีซ"
 greece.1.b: "ไมใหอะไรพวกเขาทั้งนั้น"
 greece.2.t: "คําชี้ขาดลูบลิยานาครั้งที่สอง"
 greece.2.d_GER_demand: "เยอรมนีกําลังพยายามขมขูใหกรีซยกดินแดนใหเพื่อใชเปน 'ฐานทัพ'"
 greece.2.d_ITA: "ชาวเยอรมันกําลังหาดินแดนใหมิตรชาวอิตาลีของพวกเขาโดยใหเราเปนผูเสียสละ"
 greece.2.d_BUL: "ชาวเยอรมันเรียกรองใหเรายกดินแดนใหแกลิ่วลอชาวบัลแกเรียของพวกเขา"
 greece.2.d_ITA_BUL: "ชาวเยอรมันกําลังผลักดันขอเรียกรองของทั้งอิตาลีและบัลแกเรียเหนือดินแดนของเรา"
 greece.2.a: "เราไมอาจตานทานพวกเขาได"
 greece.2.b: "เราจะไมยอมออนขอ"
 greece.3.t: "ชะตากรรมของกรีซ"
 greece.3.d: "เยอรมนีเรียกรองใหเรายอมรับ 'การประสานงาน' กับเยอรมนี ซึ่งในทางปฏิบัติจะทําใหเรากลายเปนรัฐหุนเชิดของเยอรมนี"
 greece.3.a: "ยอมรับสิ่งที่หลีกเลี่ยงไมได"
 greece.3.b: "ปฏิเสธ"
 greece.4.t: "สงครามกับตุรกี"
 greece.4.d: "มิตรชาวอิตาลีของเรากําลังวางแผนจะเคลื่อนไหวตอตุรกี นี่คือโอกาสอันเหมาะเจาะที่เราจะสรางความมั่นคงในทะเลอีเจียน มายึดอิซมีรเปนของเรา และชวยชาวอิตาลีขับไลชาวเติรกออกไปใหไกลจากยุโรปกันเถอะ"
 greece.4.a: "อิซมีรจะเปนของเรา"
 turkey.1.t: "การถึงแกอสัญกรรมของมุสตาฟา เคมาล อตาเติรก"
 turkey.1.d: "\n สาธารณรัฐกําลังโศกเศรา\n\n วีรบุรุษสงคราม นักปฏิวัติ ประธานาธิบดี และบิดาแหงชาวเติรก มุสตาฟา เคมาล อตาเติรก ไดถึงแกอสัญกรรมแลว\n\nเขาปฏิบัติหนาที่ตอชาวตุรกีและสาธารณรัฐที่เขากอตั้งจนถึงวาระสุดทาย ผูไวอาลัยนับพันไดมาแสดงความเคารพที่อิสตันบูล กอนที่รางของเขาจะถูกเคลื่อนยายดวยรถปนใหญ เรือ และรถไฟไปยังอังการา ซึ่งไดจัดรัฐพิธีศพขึ้นโดยมีสมาชิกรัฐสภาทั้งหมดและบุคคลสําคัญจากทั่วโลกเขารวม\n\nเมื่อบิดาแหงชาติตุรกีสมัยใหมจากไปแลว สาธารณรัฐก็ตองกาวตอไป สมัชชาแหงชาติใหญไดเลือก [Root.GetLeader] เปนผูสืบทอดตําแหนง"
 turkey.1.a: "อตาเติรกจะไดรับการจดจําตลอดไป"
 generic.1.t: "[From.GetName] กําลังแทรกแซงการเมืองของเรา"
 generic.1.d_neutral_good: "เปนเวลานานแลวที่รัฐบาล[From.GetAdjective]พยายามใหเสนทางของสองประเทศเปนไปในทิศทางเดียวกัน และแสดงความสนใจอยางมากตอการเมือง[Root.GetAdjective] เมื่อไมนานมานี้สิ่งนี้ยิ่งเขมขนขึ้น เมื่อ [From.GetRulingParty] เริ่มผลักดันโฆษณาชวนเชื่อแบบ[From.GetRulingIdeology]ผานสุนทรพจนและเอกสารตาง ๆ ที่แจกจายใหแกประชาชนชาว[Root.GetAdjective] \n\nบัดนี้แมแตนักการเมืองและเจาหนาที่จํานวนหนึ่งก็เริ่มคลอยตามโฆษณาชวนเชื่อของ[From.GetAdjective] และเริ่มสนับสนุน[From.GetRulingIdeologyNoun]ใน [Root.GetName]"
 generic.1.d_bad: "เปนเวลานานแลวที่รัฐบาล[From.GetAdjective]พยายามใหเสนทางของสองประเทศเปนไปในทิศทางเดียวกัน และมักพยายามแทรกแซงการเมืองของ [Root.GetName] เมื่อไมนานมานี้สิ่งนี้ยิ่งเขมขนขึ้น เมื่อ [From.GetRulingParty] เริ่มผลักดันโฆษณาชวนเชื่อแบบ[From.GetRulingIdeology]โดยไมเคารพขนบธรรมเนียมทางการเมืองของ[Root.GetAdjective] สุนทรพจนและเอกสาร[From.GetRulingIdeology]อื่น ๆ จํานวนมากกําลังถูกแจกจายใหแกประชาชนชาว[Root.GetAdjective] ดูเหมือนวาแมแตนักการเมืองและเจาหนาที่จํานวนหนึ่งก็เริ่มคลอยตามโฆษณาชวนเชื่อของ[From.GetAdjective] และเริ่มสนับสนุน[From.GetRulingIdeologyNoun]ใน [Root.GetName]"
 generic.1.a: "นาสนใจ"
 generic.1.b: "พวกเขากลาดีอยางไร!"
 country_capitulated.0.t: "[Root.GetName] ยอมจํานนแลว"
 country_capitulated.0.d_positive_both_no_faction: "\n[From.From.GetLeader] ประกาศวาชาติ[Root.GetAdjective]ผูขลาดเขลาไมอาจทนแรงกดดันจากกองกําลัง[From.From.GetAdjective]อันมหาศาลที่ประจําอยูทั่วประเทศไดอีกตอไป รัฐบาล[Root.GetAdjective]เลือกหนีออกนอกประเทศและลี้ภัยไปแลว กองกําลังหลักของพวกเขายอมจํานน และบัดนี้ [From.From.GetNameDef] ไดควบคุมดินแดนบานเกิดของพวกเขาแลว\nแมสงครามจะยังดําเนินตอไปในที่อื่น แตนี่คือชัยชนะอันยิ่งใหญของ [From.From.GetNameDef]"
 country_capitulated.0.d_positive_prev_no_faction: "\n[From.From.GetLeader] ประกาศวาชาติ[Root.GetAdjective]ผูขลาดเขลาไมอาจทนแรงกดดันจากกองกําลัง[From.From.GetAdjective]อันมหาศาลที่ประจําอยูทั่วประเทศไดอีกตอไป รัฐบาล[Root.GetAdjective]เลือกหนีออกนอกประเทศและลี้ภัยไปแลว กองกําลังหลักของพวกเขายอมจํานน และบัดนี้ [From.From.GetNameDef] ไดควบคุมดินแดนบานเกิดของพวกเขาแลว\nแมสงครามกับสิ่งที่เหลืออยูของ [Root.GetFactionName] จะยังดําเนินตอไปในที่อื่น แตนี่คือชัยชนะอันยิ่งใหญของ [From.From.GetNameDef]"
