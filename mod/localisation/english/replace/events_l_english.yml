l_english:
 MINIMIZE_EVENT: "§Gคลิก§!เพื่อยอหนาตาง เหตุการณจะถูกนําไปไวในคิวเหตุการณที่ §Hเหตุการณและการตัดสินใจ§!"
 germany.4.t: "อันชลุส"
 germany.4.d: "การลุกฮือซํ้าแลวซํ้าเลาในออสเตรียแสดงใหเห็นชัดวาประชาชนที่นั่นปรารถนาจะรวมเปนหนึ่งเดียวกับไรชของเรา บัดนี้ถึงเวลาลงมือ และทําใหเจตจํานงของประชาชนปรากฏเปนจริง"
 germany.4.a: "ใครจะกลาพูดวาออสเตรียไมใชเยอรมัน?!"
 germany.5.t: "กติกาสัญญาตอตานโคมินเทิรน"
 germany.5.d: "เยอรมนีเสนอใหเราลงนามในกติกาสัญญาเพื่อรับมือกับเปาหมายของโคมินเทิรนที่ตองการเผยแพรลัทธิคอมมิวนิสตไปทั่วโลกดวยการบอนทําลายและความรุนแรง การลงนามครั้งนี้หมายความวาเราตกลงจะแบงปนขาวกรองเกี่ยวกับภัยคุกคามคอมมิวนิสต และรวมมืออยางใกลชิดเพื่อตอตานภัยรายนี้"
 germany.5.a: "เขารวม"
 germany.5.b: "ปฏิเสธ"
 germany.6.t: "กติกาสัญญาไตรภาคี"
 germany.6.d: "ภาคีผูลงนามถือวาเงื่อนไขสําคัญยิ่งของสันติภาพที่ยั่งยืน คือการที่ทุกชาติในโลกไดรับที่ทางอันเหมาะสมของตน จึงตัดสินใจที่จะยืนหยัดเคียงขางและรวมมือกันในความพยายามในมหาเอเชียบูรพาและในภูมิภาคยุโรปตามลําดับ ซึ่งมีเปาหมายหลักคือการสถาปนาและธํารงไวซึ่งระเบียบใหม เพื่อสงเสริมความรุงเรืองและความผาสุกรวมกันของประชาชนในดินแดนเหลานั้น"
 germany.6.a: "เขารวม"
 germany.6.b: "ปฏิเสธ"
 germany.11.t: "กติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ"
 germany.11.d: "กระทรวงการตางประเทศเยอรมนีเสนอใหทําสนธิสัญญาไมรุกรานระหวางสองชาติของเรา สนธิสัญญานี้จะเพิ่มพูนการคาระหวางกันอยางมาก และยังมีพิธีสารลับเพิ่มเติมที่เสนอใหแบงยุโรปตะวันออกออกเปนเขตอิทธิพลของเยอรมนีและโซเวียต\n\nแมพวกฟาสซิสตในเบอรลินอาจไวใจไมได แตสนธิสัญญานี้จะเปดทางใหเราจัดการกับฟนแลนด รัฐบอลติก และโรมาเนียไดโดยไมตองกลัวการแทรกแซงจากภายนอก ดินแดนฝงตะวันออกของโปแลนดก็จะตกเปนของเราดวยหากโปแลนดลมสลาย"
 germany.11.a: "ลงนามในสนธิสัญญา"
 germany.11.a.tt: "§Rระหวางที่สนธิสัญญามีผลบังคับใช จะไมสามารถใชนโยบายการคาแบบเศรษฐกิจปดได§!\n"
 germany.11.b: "ไมมีการตกลงใดๆ กับพวกฟาสซิสต!"
 germany.12.t: "มอสโกลงนามในสนธิสัญญา"
 germany.12.d: "[SOV.GetNameDefCap]ตัดสินใจอยางชาญฉลาดที่จะลงนามในสนธิสัญญาไมรุกรานของเรา หมายความวาเราสามารถเคลื่อนไหวไดอยางอิสระโดยไมตองเสี่ยงกับการแทรกแซงของโซเวียต\n\nนาเสียดายที่มิตรบางรายของเราเริ่มตั้งคําถามถึงความมุงมั่นของเยอรมนีในการทําลายลางคอมมิวนิสตใหสิ้นซาก เมื่อจัดการเรื่องโปแลนดและฝรั่งเศสเรียบรอยแลว เราอาจตองทบทวนสนธิสัญญานี้ใหม แตนั่นเปนเรื่องที่คอยวากันทีหลัง..."
 germany.12.a: "ยอดเยี่ยม"
 germany.13.t: "มอสโกปฏิเสธสนธิสัญญา"
 germany.13.d: "[SOV.GetNameDefCap]ปฏิเสธที่จะลงนามในสนธิสัญญาไมรุกรานของเรา! เรื่องนี้ทําใหสถานการณยุงยากขึ้น เพราะเราไมอาจจัดการกับโปแลนดหรือฝรั่งเศสอยางเด็ดขาดได โดยไมเสี่ยงที่พวกบอลเชวิคจะเขามายุง"
 germany.13.a: "สาปแชงพวกมัน!"
 germany.14.t: "การแบงแยกโปแลนด"
 germany.14.d: "โปแลนดเปนของเราแลว แตดินแดนฝงตะวันออกตกอยูในเขตอิทธิพลของ[SOU.GetAdjective]ตามขอกําหนดของกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ เราควรถอนกําลังและปลอยใหชาว[SOU.GetAdjective]เขายึดครองดินแดนนี้หรือไม? หากไมทํา สนธิสัญญาของเราจะเปนโมฆะ"
 germany.14.a: "ใช ตองปฏิบัติตามขอกําหนดของสนธิสัญญา"
 germany.14.b: "ไม! โปแลนดทั้งหมดเปนของปตุภูมิ!"
 germany.15.t: "เยอรมนีปฏิบัติตามสนธิสัญญา"
 germany.15.d: "ตามกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ กองกําลังเยอรมันไดถอนออกจากโปแลนดตะวันออก และกองทหารของเราไดเคลื่อนเขายึดครองดินแดนดังกลาวแลว"
 germany.16.t: "[From.GetNonIdeologyName]ทรยศตอสนธิสัญญา"
 germany.16.d: "[From.GetNonIdeologyName]ปฏิเสธที่จะแบงโปแลนดกับเรา ซึ่งเปนการละเมิดกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพอยางโจงแจง! การทรยศครั้งนี้ทําใหสนธิสัญญาระหวางเรากับพวกเขาเปนโมฆะ!"
 germany.16.a: "เราชางโงที่ไวใจพวกฟาสซิสต!"
 germany.20.t: "คําชี้ขาดเวียนนาครั้งที่สอง"
 germany.20.d: "ดวยตระหนักวาระเบียบใหมไดสถาปนาขึ้นแลวในยุโรป ฮังการีและโรมาเนียจึงขอใหเราเปนผูไกลเกลี่ยขอพิพาทดินแดนระหวางสองประเทศ ทรานซิลเวเนียถูกพรากไปจากฮังการีและผนวกเขากับโรมาเนีย ซึ่งเปนหนึ่งในความเปลี่ยนแปลงอันไรการไตรตรองมากมายที่ถูกบังคับใชกับโลกที่แวรซาย ควรคืนทรานซิลเวเนียตอนเหนือใหอยูใตการปกครองของฮังการีหรือไม?"
 germany.20.a: "มอบทรานซิลเวเนียตอนเหนือใหฮังการี"
 germany.20.b: "มอบทรานซิลเวเนียทั้งหมดใหฮังการี"
 germany.20.c: "ทรานซิลเวเนียจะยังคงเปนของโรมาเนีย"
 germany.21.t: "โรมาเนียปฏิเสธคําตัดสินของเรา"
 germany.21.d: "โรมาเนียปฏิเสธที่จะปฏิบัติตามคําตัดสินที่เราไดขอสรุปในคําชี้ขาดเวียนนาครั้งที่สอง! คณะผูแทนของพวกเขาถูกเรียกตัวกลับบูคาเรสต และไมมีดินแดนใดถูกสงมอบใหฮังการีเลย"
 germany.21.a: "เจตจํานงของเยอรมนีตองไดรับการปฏิบัติตาม!"
 germany.22.t: "เมเมล - [FROM.GetNameDef]ยอมถอย"
 germany.22.d: "รัฐบาล[FROM.GetAdjective]ยอมรับขอเรียกรองของเรา และเมเมลจะถูกรวมกลับเขากับปรัสเซียตะวันออก ดินแดนอีกแหงที่ถูกชวงชิงไปอยางไมชอบธรรมไดกลับคืนสูชาติเยอรมันแลว!"
 germany.22.a: "ยอดเยี่ยม"
 germany.23.t: "เมเมล - [FROM.GetNameDef]ปฏิเสธขอเรียกรอง"
 germany.23.d: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเรียกรองของเรา! พวกเขาหลบอยูหลังอนุสัญญาไคลเปดา โดยอางวาเยอรมนีไมมีสิทธิ์ตามกฎหมายเหนือดินแดนเมเมล เราคงตองอธิบายจุดยืนของเราใหพวกเขาเขาใจดวยวิธีอื่น..."
 germany.23.a: "พวกหัวรั้นโงเขลา"
 germany.24.t: "คณะผูแทนทางทหารเยอรมันประจําจีน"
 germany.24.d: "เยอรมนีมีความสัมพันธอันดีกับจีนมาตั้งแตสิ้นสุดมหาสงครามครั้งกอน แมเราจะสูญเสียดินแดนในจีนไปแลวก็ตาม คณะผูแทนทางทหารเยอรมันประจําอยูในจีนมาหลายป และอเล็กซานเดอร ฟอน ฟลเคนเฮาเซิน ก็ประสบความสําเร็จอยางมากในการปฏิรูปกองทัพกกมินตั๋งบางสวน\n\nเรื่องนี้ยอมสรางความกังวลใหญี่ปุน เนื่องจากพวกเขากําลังทําสงครามกับจีนอยู ญี่ปุนจึงเรียกรองใหถอนการสนับสนุนทั้งหมดของเยอรมนีที่มีตอจีนในทันที"
 germany.24.a: "เรียกตัวฟอน ฟลเคนเฮาเซินกลับ"
 germany.24.b: "ไม ที่ปรึกษาของเราจะอยูตอ"
 germany.24.c: "ไม ที่ปรึกษาของเราจะอยูตอ ตามที่เราไดสัญญากับจีนไว"
 germany.25.t: "เรียกตัวที่ปรึกษาทางทหารกลับ"
 germany.25.d: "ความสัมพันธกับจีนที่เสื่อมทรามลงทําใหการคงคณะผูแทนทางทหารไวในประเทศของพวกเขาเปนไปไมไดในทางการเมือง อเล็กซานเดอร ฟอน ฟลเคนเฮาเซิน และที่ปรึกษาคนอื่นๆ ของเราจึงถูกเรียกตัวกลับ"
 germany.25.a: "เราจะใหเขาทํางานตอ"
 germany.26.t: "จีนกักตัวที่ปรึกษาทางทหาร"
 germany.26.d: "เยอรมนีและจีนอยูในภาวะสงคราม ฝายจีนจึงกักตัวที่ปรึกษาทางทหารชาวเยอรมันที่กําลังปฏิรูปกองทัพของพวกเขาไว ฟอน ฟลเคนเฮาเซินและนายทหารอีกจํานวนหนึ่งหลบหนีการจับกุมได และกําลังเดินทางกลับยุโรป"
 germany.26.a: "ยอดมาก!"
 germany.27.t: "เสริมความแข็งแกรงแนวปองกันตะวันตก"
 germany.27.d: "ทหารชางไดสํารวจปอมปราการที่มีอยูเสร็จสิ้นแลว และระบุจุดที่ควรเสริมความแข็งแกรง คําสั่งกอสรางที่จําเปนไดถูกออกไปแลว"
 germany.27.a: "นี่จะตานทานไดดีกวาแนวซีคฟรีดแนนอน"
 germany.28.t: "ชาวเยอรมันกดดันใหเกิดอันชลุส"
 germany.28.d: "ความไมสงบและการใชความรุนแรงปะทุขึ้น เมื่อผูประทวงแสดงความตองการใหออสเตรียรวมกับเยอรมนีเปนสหภาพของชนชาติเยอรมัน เบอรลินกําลังกดดันอยางหนักใหเกิดอันชลุส ซึ่งจะทําใหออสเตรียถูกผนวกเขาเปนสวนหนึ่งของชาติพวกเขา"
 germany.28.a: "เราจะเขารวมกับไรชเยอรมัน!"
 germany.28.b: "ไม ชะตากรรมของออสเตรียอยูที่อื่น"
 germany.29.t: "ออสเตรียปฏิเสธอันชลุส!"
 germany.29.d: "พวกโงเขลาในเวียนนาปฏิเสธการรวมสองชาติของเรา! นี่คือการเพิกเฉยตอเจตจํานงของชาวออสเตรียอยางโจงแจง และเราจะไมยอมใหเปนเชนนี้! เราอาจตองบังคับใหเกิดอันชลุสดวยกําลังทหาร"
 germany.29.a: "เราตองเตรียมพรอมสําหรับการแทรกแซงทางทหาร"
 germany.40.t: "การประชุมมิวนิก"
 germany.40.d: "ขอเรียกรองของเยอรมนีตอแควนซูเดเทินลันดของเชโกสโลวาเกีย ซึ่งมีชาวเยอรมันอาศัยอยูเปนจํานวนมาก ไดมาถึงจุดแตกหัก [GER.GetLeader]ไดวางกําลังไวตามแนวชายแดนเชโกสโลวาเกียเพื่อเตรียมโจมตี การเจรจากําลังจัดขึ้นที่มิวนิกระหวางอังกฤษ ฝรั่งเศส อิตาลี และเยอรมนี ดวยความหวังวาจะยุติวิกฤตการณซูเดเทินไดอยางสันติ อังกฤษจะมีจุดยืนอยางไร?"
 germany.40.d_2: "ขอเรียกรองของเยอรมนีตอแควนซูเดเทินลันดของเชโกสโลวาเกีย ซึ่งมีชาวเยอรมันอาศัยอยูเปนจํานวนมาก ไดมาถึงจุดแตกหัก [GER.GetLeader]ไดวางกําลังไวตามแนวชายแดนเชโกสโลวาเกียเพื่อเตรียมโจมตี เนื่องจากเราไดพิสูจนแลววาจะไมยอมรับการขยายอํานาจของเยอรมนี นั่นหมายความวาตอนนี้เรามีพันธมิตรเพิ่มอีกหนึ่งรายในการทําสงครามกับเยอรมนี"
 germany.40.d_3: "ขอเรียกรองของเยอรมนีตอแควนซูเดเทินลันดของเชโกสโลวาเกีย ซึ่งมีชาวเยอรมันอาศัยอยูเปนจํานวนมาก ไดมาถึงจุดแตกหัก [GER.GetLeader]ไดวางกําลังไวตามแนวชายแดนเชโกสโลวาเกียเพื่อเตรียมโจมตี การเจรจากําลังจัดขึ้นที่มิวนิกระหวางเนเธอรแลนด อังกฤษ ฝรั่งเศส อิตาลี และเยอรมนี ดวยความหวังวาจะยุติวิกฤตการณซูเดเทินไดอยางสันติ เนเธอรแลนดจะมีจุดยืนอยางไร?"
 germany.40.a: "ปลอยใหเช็กเอาตัวรอดเอง"
 germany.40.b: "เราตองปกปองเชโกสโลวาเกีย!"
 germany.41.d: "ขอเรียกรองของเยอรมนีตอแควนซูเดเทินลันดของเชโกสโลวาเกีย ซึ่งมีชาวเยอรมันอาศัยอยูเปนจํานวนมาก ไดมาถึงจุดแตกหัก [GER.GetLeader]ไดวางกําลังไวตามแนวชายแดนเชโกสโลวาเกียเพื่อเตรียมโจมตี การเจรจากําลังจัดขึ้นที่มิวนิกระหวางอังกฤษ ฝรั่งเศส อิตาลี และเยอรมนี ดวยความหวังวาจะยุติวิกฤตการณซูเดเทินไดอยางสันติ\n\nอังกฤษแสดงทาทีชัดเจนวาไมมีเจตนาจะทําสงครามเพราะ 'การทะเลาะกันในประเทศที่หางไกล' เราควรทําตามพวกเขา หรือจะรักษาพันธกรณีที่มีตอเชโกสโลวาเกียดวยการใหการสนับสนุน?"
 germany.41.a: "ปลอยใหเช็กเผชิญชะตากรรมเอง"
 germany.41.b: "ชางหัวอังกฤษ! ฝรั่งเศสจะสนับสนุนมิตรของเธอ!"
 germany.42.d: "ขอเรียกรองของเยอรมนีตอแควนซูเดเทินลันดของเชโกสโลวาเกีย ซึ่งมีชาวเยอรมันอาศัยอยูเปนจํานวนมาก ไดมาถึงจุดแตกหัก [GER.GetLeader]ไดวางกําลังไวตามแนวชายแดนเชโกสโลวาเกียเพื่อเตรียมโจมตี การเจรจากําลังจัดขึ้นที่มิวนิกระหวางอังกฤษ ฝรั่งเศส อิตาลี และเยอรมนี ดวยความหวังวาจะยุติวิกฤตการณซูเดเทินไดอยางสันติ\n\nอังกฤษปฏิเสธที่จะถอย และกลับขูเยอรมนีวาจะทําสงครามหากละเมิดพรมแดนเชโกสโลวาเกีย สงครามอาจใกลเขามาแลว"
 germany.42.a: "เราตองเตรียมพรอม!"
 germany.42.b: "ฝรั่งเศสควรอยูนอกเรื่องนี้"
 germany.43.t: "ฝรั่งเศสถอนตัวจากฝายสัมพันธมิตร"
 germany.43.d: "ฝรั่งเศสผูดื้อรั้นปฏิเสธที่จะทําตามแนวทางของเราในวิกฤตการณซูเดเทิน! พวกเขายืนกรานสนับสนุนเชโกสโลวาเกีย และเมื่อเราไมทําเชนนั้น พวกเขาจึงตัดสินใจยกเลิกพันธมิตรระหวางกัน ขณะนี้ฝรั่งเศสกําลังเตรียมพรอมสําหรับสงครามกับเยอรมนีที่ใกลจะมาถึง"
 germany.43.a: "โงเขลา! เราตองเอาใจ[GER.GetLeader]!"
 germany.44.d: "ขอเรียกรองของเยอรมนีตอดินแดนของเราในแควนซูเดเทินลันดทวีความเปนปรปกษขึ้นเรื่อยๆ และตอนนี้กองกําลังของพวกเขากําลังรวมตัวกันตามแนวชายแดนของเรา! มีการประชุมที่มิวนิก ซึ่งผูนํายุโรปกําลังหารือถึงอนาคตของเชโกสโลวาเกีย แตเรากลับไมไดรับเชิญ\n\nโชคดีที่ดูเหมือนฝายสัมพันธมิตรจะยึดมั่นตามคําสัญญาวาจะสนับสนุนที่ใหไวกอนหนานี้ พวกเขาขู[GER.GetLeader]วาจะทําสงครามหากพรมแดนของเราถูกละเมิดแมเพียงเล็กนอย ถึงกระนั้น เราก็ตองเตรียมรับการโจมตีของเยอรมนีที่ใกลจะมาถึง"
 germany.44.a: "ดี! ใหพวกมันมาเลย!"
 germany.45.d: "ขอเรียกรองของเยอรมนีตอดินแดนของเราในแควนซูเดเทินลันดทวีความเปนปรปกษขึ้นเรื่อยๆ และตอนนี้กองกําลังของพวกเขากําลังรวมตัวกันตามแนวชายแดนของเรา! มีการประชุมที่มิวนิก ซึ่งผูนํายุโรปกําลังหารือถึงอนาคตของเชโกสโลวาเกีย แตเรากลับไมไดรับเชิญ\n\nพวกอังกฤษขี้ขลาดปฏิเสธที่จะหนุนหลังอธิปไตยของเรา แตอยางนอยฝรั่งเศสก็ยืนเคียงขางเรา! พวกเขาละทิ้งพันธมิตรกับอังกฤษ และสรางพันธมิตรใหมกับเรา โดยสัญญาวาจะสนับสนุนเชโกสโลวาเกียตอตานการรุกรานของเยอรมนี"
 germany.45.a: "ฝรั่งเศสจงเจริญ!"
 germany.46.t: "คําบัญชาแหงมิวนิก"
 germany.46.d: "ขอเรียกรองของเยอรมนีตอดินแดนของเราในแควนซูเดเทินลันดทวีความเปนปรปกษขึ้นเรื่อยๆ และตอนนี้กองกําลังของพวกเขากําลังรวมตัวกันตามแนวชายแดนของเรา! มีการประชุมที่มิวนิก ซึ่งผูนํายุโรปกําลังหารือถึงอนาคตของเชโกสโลวาเกีย แตเรากลับไมไดรับเชิญ\n\nทั้งอังกฤษและฝรั่งเศสตางถอนคําสัญญาที่เคยใหไววาจะสนับสนุนเราตอตานการรุกรานของเยอรมนี นักการทูตของพวกเขาแสดงทาทีชัดเจนวาหากเราเลือกตอตานเยอรมนี เราตองสูเพียงลําพัง บางทีเราอาจไมมีทางเลือกนอกจากยอมยกซูเดเทินลันดให..."
 germany.46.a: "นี่คือวันอันมืดมนของยุโรป"
 germany.46.b: "เราจะไมมีวันยอมจํานน!"
 germany.47.d: "ผูนําของเยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีไดประชุมกันที่มิวนิกเพื่อหารือถึงอนาคตของเชโกสโลวาเกีย อังกฤษและพันธมิตรตางปฏิเสธการอางสิทธิ์อันชอบธรรมของเราเหนือซูเดเทินลันด และยังขูจะทําสงครามกับเราหากเรา 'ละเมิด' พรมแดนเช็ก!\n\nแผนการบุกเชโกสโลวาเกียไดถูกรางขึ้นแลว แตนี่อาจจุดชนวนใหเกิดสงครามใหญทั่วยุโรป เราตองมั่นใจวาเราพรอมรับมือ"
 germany.47.a: "ถึงเวลาใชไมแข็งแลว"
 germany.48.d: "ผูนําของเยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีไดประชุมกันที่มิวนิกเพื่อหารือถึงอนาคตของเชโกสโลวาเกีย อังกฤษเขาใจเหตุผลและยอมรับวาการอางสิทธิ์ของเราเหนือซูเดเทินลันดนั้นชอบธรรม แตฝรั่งเศสผูดื้อรั้นกลับปฏิเสธที่จะถอย\n\nพวกเขาละทิ้งความรวมมือกับอังกฤษ และหันไปกระชับความสัมพันธกับเช็กแทน ดูเหมือนเราจะตองรับมือกับทั้งสองชาติไปพรอมกัน แตอยางนอยตอนนี้หวังวาอังกฤษจะไมเขามาแทรกแซง..."
 germany.48.a: "นี่อาจเปนผลดีตอเรา"
 germany.49.d: "ผูนําของเยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีไดประชุมกันที่มิวนิกเพื่อหารือถึงอนาคตของเชโกสโลวาเกีย ทั้งอังกฤษและฝรั่งเศสยอมรับวาการอางสิทธิ์ของเราเหนือซูเดเทินลันดนั้นชอบธรรม และไดถอนขอเสนอที่จะสนับสนุนเช็กไปแลว\n\nแมสถานการณจะสิ้นหวัง แตพวกเช็กหัวดื้อก็ยังปฏิเสธที่จะยอมยกดินแดนให! เราคงตองใชกําลังยึดมาเอง แผนการบุกไดเตรียมพรอมแลว ซึ่งจะลบการทดลองอันนารังเกียจของแวรซายนี้ใหหายไปจากพื้นโลก!"
 germany.49.a: "เช็กตองถูกทําลาย"
 germany.50.d: "ผูนําของเยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีไดประชุมกันที่มิวนิกเพื่อหารือถึงอนาคตของเชโกสโลวาเกีย ทั้งอังกฤษและฝรั่งเศสยอมรับวาการอางสิทธิ์ของเราเหนือซูเดเทินลันดนั้นชอบธรรม และไดถอนขอเสนอที่จะสนับสนุนเช็กไปแลว\n\nเมื่อตระหนักวาสถานการณสิ้นหวัง เช็กจึงยอมยกดินแดนซูเดเทินใหแกเรา ชาวเยอรมันที่ถูกกดขี่ในดินแดนนั้นจะไดกลับคืนสูปตุภูมิในที่สุด!"
 germany.50.a: "นี่คือวันประวัติศาสตรของเยอรมนี"
 germany.51.t: "คําชี้ขาดเวียนนาครั้งที่หนึ่ง"
 germany.51.d: "เชโกสโลวาเกียคือเนื้อรายใจกลางยุโรป และในที่สุดชาว[GER.GetAdjective]ก็ตัดสินใจลงมืออยางเด็ดขาด ซูเดเทินลันดถูกยกใหเยอรมนีไปแลว และบัดนี้ ผลจากความตกลงมิวนิก ดินแดนเชโกสโลวาเกียที่เปนของฮังการีโดยชอบธรรมจะถูกสงคืนใหแกเรา"
 germany.51.a: "เสียทีนะ!"
 germany.52.t: "การผนวกซาออลเซีย"
 germany.52.d: "เชโกสโลวาเกียกําลังแตกสลาย และเราตองเรงปกปองดินแดนที่มีชาวโปแลนดอาศัยอยูจํานวนมากกอนที่เยอรมนีจะยึดไป เราโตแยงการครอบครองซาออลเซียของเช็กมาโดยตลอด และถึงเวลาแลวที่ภูมิภาคนี้จะรวมเขากับชาติของเรา"
 germany.52.a: "ซาออลเซียเปนของเรา!"
 germany.53.t: "ชะตากรรมของเชโกสโลวาเกีย"
 germany.53.d: "ไมพอใจเพียงแคขโมยซูเดเทินลันดไป บัดนี้เยอรมันตัดสินใจจะยึดสวนที่เหลือของชาติเราดวย เมื่อถูกสิ่งที่เรียกวาพันธมิตรทอดทิ้ง และแนวปองกันที่ดีที่สุดของเราก็สูญเสียไปในคําบัญชาแหงมิวนิก สถานการณดูสิ้นหวังเหลือเกิน..."
 germany.53.a: "ยอมแพตอเยอรมัน"
 germany.53.b: "...แตเราก็ยังตองตอตาน!"
 germany.54.t: "เช็กตอตาน"
 germany.54.d: "ไมรูวาเช็กไปเอาความกลามาจากไหนถึงลุกขึ้นตอตานการยึดครองประเทศของพวกเขา แนวปองกันที่ดีที่สุดของพวกเขาอยูในซูเดเทินลันด ซึ่งตอนนี้อยูในการควบคุมของเราแลว การทัพครั้งนี้จึงนาจะจบลงอยางรวดเร็ว"
 germany.54.a: "ปรากจะเปนของเราในไมชา"
 germany.55.d: "จุดจบของเชโกสโลวาเกียมาถึงแลว และกองกําลังของเรากําลังเคลื่อนพลเขาสูปรากในขณะนี้ เมื่อกองทัพเชโกสโลวาเกียยอมจํานน เราไดยึดอาวุธยุทโธปกรณมาเปนจํานวนมหาศาล โดยเฉพาะรถถังของพวกเขานาจะเปนประโยชนตอกองกําลังของเราอยางยิ่ง\n\nโบฮีเมียจะถูกผนวกเขากับเยอรมนีในฐานะรัฐในอารักขา แตสโลวาเกียควรเปนอยางไร? เราสามารถตั้งใหเปนรัฐหุนเชิดที่มีอํานาจปกครองตนเองภายใตโยเซฟ ทิโซ"
 germany.55.d_2: "เมื่อพิชิตเชโกสโลวาเกียไดแลว เราตองพิจารณาวิธีแบงดินแดนเหลานี้ที่ดีที่สุด\n\nโบฮีเมียยังคงเปนของเยอรมนีในฐานะรัฐในอารักขา แตสโลวาเกียควรเปนอยางไร? เราสามารถตั้งใหเปนรัฐหุนเชิดที่มีอํานาจปกครองตนเองภายใตโยเซฟ ทิโซ"
 germany.55.a: "ตั้งสโลวาเกียเปนรัฐหุนเชิด"
 germany.55.b: "แบงเชโกสโลวาเกียกับฮังการี"
 germany.55.c: "เชโกสโลวาเกียทั้งหมดเปนของไรช!"
 germany.55.e: "ตั้งทั้งโบฮีเมียและสโลวาเกียเปนรัฐหุนเชิด"
 germany.56.t: "การแบงแยกเชโกสโลวาเกีย"
 germany.56.d: "กองกําลังเยอรมันไดเขาสูปรากแลว และจุดจบของเชโกสโลวาเกียใกลเขามา พวกเขาตั้งใจจะผนวกโบฮีเมียเขากับไรชเยอรมัน แตยินดีใหสโลวาเกียแกเรา เราควรตกลงตามการแบงแยกนี้หรือไม? นั่นหมายถึงการเขาเปนพันธมิตรทางทหารอยางเปนทางการกับเยอรมนี"
 germany.56.d_2: "หลังผนวกเชโกสโลวาเกีย เยอรมนีตั้งใจจะคงโบฮีเมียไวเปนสวนหนึ่งของไรช แตยินดีใหสโลวาเกียแกเรา เราควรตกลงตามการแบงแยกนี้หรือไม? นั่นหมายถึงการเขาเปนพันธมิตรทางทหารอยางเปนทางการกับเยอรมนี"
 germany.56.a: "แนนอน! มหาฮังการีจะเปนจริงในไมชา!"
 germany.56.b: "ไม เราไมตองการทั้งสโลวาเกียและมิตรภาพของเยอรมนี"
 germany.57.t: "ฮังการีปฏิเสธขอเสนอของเรา"
 germany.57.d: "ฮังการีปฏิเสธขอเสนออันใจกวางของเราที่จะใหผนวกสโลวาเกียอยางนาเหลือเชื่อ โดยอางวาไมสนใจภูมิภาคนี้! อีกไมนานเราคงตองจัดการกับพวกเขา แตตอนนี้เราตองหาทางออกใหกับปญหาสโลวาเกียเสียกอน"
 germany.57.a: "ตั้งรัฐบาลหุนเชิดของทิโซ"
 germany.57.b: "ผนวกสโลวาเกียเขากับเยอรมนี"
 germany.58.t: "ปญหาโปแลนด"
 germany.58.d: "กระทรวงการประชาสัมพันธและโฆษณาชวนเชื่อแหงไรชทํางานไดอยางยอดเยี่ยม ประชาชนชาวเยอรมัน รวมถึงคนทั้งโลก ไดรับรูถึงความอยุติธรรมที่พี่นองชาวเยอรมันของเราในโปแลนดถูกบังคับใหตองทนรับ บัดนี้เรามีเหตุผลรองรับครบถวนสําหรับการทําสงครามแลว!"
 germany.58.a: "อีกไมนานโปแลนดจะไมมีอีกตอไป!"
 germany.59.desc: "ดวยการตัดสินใจฝายเดียวอยางอุกอาจ [GER.GetNameDef]ไดประกาศโอนภูมิภาค[664.GetName]ใหแก[FROM.GetNameDef] การตัดสินใจนี้ถูกกําหนดขึ้นโดยไมมีการปรึกษาหารือหรือความยินยอม ถือเปนการรื้อทําลายบูรณภาพแหงดินแดนของ[ROOT.GetNameDef]อีกขั้นหนึ่ง และเปนเครื่องเตือนใจอันโหดรายถึงความเปราะบางทางภูมิรัฐศาสตรของเรา \nคณะผูแทน[GER.GetAdjective]อางการอางสิทธิ์เกาแกทางประวัติศาสตร และกดดันใหผูนําของเรายอมรับการแกไขเขตแดนครั้งนี้ การสูญเสีย[664.GetName] ภูมิภาคที่อุดมดวยวัฒนธรรมและทรัพยากร ใหแก[FROM.GetNameDef] เปนยาขมที่ประชาชนของเราตองกลืน และเปนการทาทายอธิปไตยของชาติเราโดยตรง"
 germany.59.a: "อีกวันอันเศราสลดของ[ROOT.GetNameDef]"
 germany.60.t: "การนํากําลังทหารกลับเขาไรนลันท"
 germany.60.d: "กองพลเยอรมันหลายกองพลเพิ่งเคลื่อนเขาสูไรนลันท นับเปนครั้งแรกนับตั้งแตสิ้นสุดมหาสงครามที่เยอรมนีวางกําลังไวทางตะวันตกของแมนํ้าไรน นี่เปนการละเมิดสนธิสัญญาแวรซายอยางชัดแจง ซึ่งหามเยอรมนีไมใหตั้งกําลังทหารในภูมิภาคนี้! หากเราไมยื่นคําขาดเรียกรองใหถอนกําลัง สนธิสัญญาก็จะไมถูกบังคับใช"
 germany.60.a: "นี่คือการกระทําอันเปนสงคราม! ดึงอังกฤษมาอยูขางเรา!"
 germany.60.a.tt: "§Rหากเกิดสงคราม เราจะตองเผชิญสงครามกลางเมืองเนื่องจาก§Yรัฐบาลที่แตกแยก:§!§!\n"
 germany.60.b: "ยื่นหนังสือคัดคานทางการทูต"
 germany.61.d: "กองพลเยอรมันหลายกองพลเพิ่งเคลื่อนเขาสูไรนลันท นับเปนครั้งแรกนับตั้งแตสิ้นสุดมหาสงครามที่เยอรมนีวางกําลังไวทางตะวันตกของแมนํ้าไรน นี่เปนการละเมิดสนธิสัญญาแวรซายอยางชัดแจง ซึ่งหามเยอรมนีไมใหตั้งกําลังทหารในภูมิภาคนี้!\n\nฝรั่งเศสกําลังระดมพล และดูเหมือนตั้งใจจะยื่นคําขาด หากเยอรมนีปฏิเสธ พวกเขาพรอมจะบุกเขาเยอรมนีเพื่อจัดการกับภัยคุกคามนี้ มติมหาชนในอังกฤษไมเห็นดวยกับสงคราม แตหากเราปฏิเสธที่จะยืนเคียงขางฝรั่งเศส พันธมิตรของเรากับพวกเขาจะถูกยุบ"
 germany.61.a: "สงครามเปนเรื่องที่เปนไปไมได"
 germany.61.b: "เราตองยืนเคียงขางฝรั่งเศส!"
 germany.62.d: "กองพลเยอรมันหลายกองพลเพิ่งเคลื่อนเขาสูไรนลันท นับเปนครั้งแรกนับตั้งแตสิ้นสุดมหาสงครามที่เยอรมนีวางกําลังไวทางตะวันตกของแมนํ้าไรน นี่เปนการละเมิดสนธิสัญญาแวรซายอยางชัดแจง ซึ่งหามเยอรมนีไมใหตั้งกําลังทหารในภูมิภาคนี้!\n\nฝรั่งเศสดูจะพอใจที่จะจํากัดการตอบโตการละเมิดนี้ไวเพียงการคัดคานทางการทูต และมติมหาชนในอังกฤษก็ตอตานสงครามอยางหนักแนน"
 germany.62.a: "เราจะยื่นหนังสือคัดคานดวย"
 germany.62.b: "แวรซายไมใชเรื่องของเราอีกตอไป"
 germany.63.t: "อังกฤษปฏิเสธสงคราม"
 germany.63.d: "อังกฤษปฏิเสธที่จะสนับสนุนเราตอตานเยอรมนี โดยอางวาชาวเยอรมัน 'แคเดินเลนในสวนหลังบานของตัวเอง' หากเราทําสงครามกับพวกเขา ดูเหมือนเราจะตองสูเพียงลําพัง\n\nมติมหาชนในฝรั่งเศสไมเห็นดวยกับสงคราม แตเยอรมนีจะยิ่งแข็งแกรงขึ้น และการนํากําลังทหารกลับเขาไรนลันทถือเปนภัยคุกคามโดยตรงตอพรมแดนของเรา การยื่นคําขาดจะมีนํ้าหนักนอยลงหากไมมีอังกฤษอยูขางเรา เราควรเดินหนาตอตานพวกเขาเพียงลําพังหรือไม?"
 germany.63.a: "ใช! ตองจัดการเยอรมนีเดี๋ยวนี้"
 germany.63.b: "ไม หากไมมีอังกฤษ เราตองถอย..."
 germany.64.t: "อังกฤษสนับสนุนเรา"
 germany.64.d: "แมในอังกฤษจะขาดแรงสนับสนุนจากมหาชนตอการทําสงคราม แตรัฐบาลอังกฤษก็ตระหนักถึงภัยคุกคามจากเยอรมนี และไดเสนอใหการสนับสนุนเราอยางเต็มที่ เราจะยื่นคําขาดครั้งสุดทายใหเยอรมนีถอนกําลังออกจากเขตปลอดทหาร หากพวกเขาปฏิเสธ ก็ถึงเวลาที่กองกําลังของเราจะรุกลึกเขาไปในเยอรมนีและยุติระบอบทรราชของพวกเขา!"
 germany.64.a: "เดินหนา!"
 germany.65.t: "ฝรั่งเศสและอังกฤษระดมพล!"
 germany.65.d: "อังกฤษและฝรั่งเศสปฏิเสธที่จะยอมรับการนํากําลังทหารกลับเขาไรนลันท โดยเรียกวาเปน 'การละเมิดที่ไมอาจใหอภัยได' ตอสนธิสัญญาแวรซาย พวกเขากําลังระดมพลตอตานเรา และยื่นคําขาดใหกองกําลังของเราถอยทันทีและใหไรนลันทคงเปนเขตปลอดทหาร มิฉะนั้นชาติของเราจะอยูในภาวะสงคราม"
 germany.65.a: "เราถอยไมได! ตองปกปองไรช!"
 germany.65.b: "เรายังไมพรอมสําหรับการเผชิญหนาครั้งนี้ เราตองถอย"
 germany.66.t: "ฝรั่งเศสระดมพล!"
 germany.66.d: "อังกฤษเขาใจเหตุผลและยอมรับการนํากําลังทหารกลับเขาไรนลันท แตพวกฝรั่งเศสบาระหํ่ากลับปฏิเสธที่จะถอย! พวกเขาอางวาเหตุการณนี้เปนภัยคุกคามโดยตรงตอความมั่นคงของชาติตน จึงระดมพลและอาจบุกขามพรมแดนมาไดทุกเมื่อ! เราอยูในภาวะสงครามแลว!"
 germany.67.t: "ฝรั่งเศสยอมถอย"
 germany.67.d: "ฝรั่งเศสเลือกที่จะถอยอยางชาญฉลาดเมื่อตระหนักวาการกระทําอันบาบิ่นของตนจะไมไดรับการสนับสนุนจากอังกฤษ กองกําลังของพวกเขาถูกปลดระดมแลว และสงครามก็ถูกหลีกเลี่ยงไปไดในตอนนี้ ใหตายสิ เฉียดฉิวจริงๆ!"
 germany.67.a: "ทําสงครามตอนนี้คงเปนเรื่องบา"
 germany.68.t: "ฝรั่งเศสปฏิเสธที่จะถอย"
 germany.68.d: "ฝรั่งเศสตัดสินใจอยางดื้อรั้นที่จะสูกับเยอรมนีเพียงลําพัง และพันธมิตรของเรากับพวกเขาไดถูกยกเลิกแลว สงครามในยุโรปอีกครั้งไดปะทุขึ้นเพราะการทะเลาะกันอยางไรสาระ บางทีอาจถึงเวลาที่อังกฤษจะถอยหางจากกิจการของภาคพื้นทวีปอีกครั้ง..."
 germany.68.a: "บางทีมันอาจเลี่ยงไมได"
 germany.70.t: "แผนสมคบคิดของออสเตอร"
 germany.70.d: "ดวยเชื่อวาฮิตเลอรไดผลักเยอรมนีเขาสูสงครามที่ไมมีทางชนะ กลุมนายทหารระดับสูงในแวรมัคทจึงกอรัฐประหาร! ดูเหมือนผูวางแผนคือพันเอกฮันส ออสเตอร แหงอับแวร แตก็มีการยืนยันแลววานายพลเบค ฟอน เบราคิทช ฮัลเดอร และพลเรือเอกคานาริสมีสวนเกี่ยวของดวย!\n\nกลุมชายติดอาวุธหนักที่ซุมรออยูในอพารตเมนตหลายแหงทั่วเบอรลินไดมุงหนาเขาสูทําเนียบไรช หมายจะสังหารฮิตเลอรและคนสนิท การยิงตอสูอยางดุเดือดกําลังเกิดขึ้นภายในอาคาร"
 germany.70.a: "ปกปองทานผูนําไมวาตองแลกดวยอะไร!"
 germany.70.b: "บางทีการกําจัดเขาอาจเปนผลดีที่สุด..."
 germany.71.t: "ทานผูนําเสียชีวิตแลว"
 germany.71.d: "ทหารเอสเอสและหนวยทหารที่จงรักภักดีซึ่งรีบรุดไปยังทําเนียบไรช สามารถสังหารหรือจับกุมหนวยคอมมานโดผูทรยศไดทั้งหมด แตไมทันกอนที่พวกสุนัขรับใชจะสังหารฮิตเลอรไดสําเร็จ! พบทานผูนําฟุบอยูบนโตะทํางานพรอมบาดแผลจากกระสุนหลายสิบนัด ไมตองสงสัยเลยวาทานทํางานเพื่อปตุภูมิอยางไมรูเหน็ดเหนื่อยจนลมหายใจสุดทาย! เอวา เบราน คนสนิทของทานมาชานาน ไดรับบาดเจ็บระหวางการยิงตอสู แตดูเหมือนจะฟนตัวไดในเวลาไมนาน\n\nผูสมคบคิดที่รอดชีวิตจะตองขึ้นศาลจากอาชญากรรมอันชั่วราย แต ณ ตอนนี้ เยอรมนีอยูในภาวะสงครามและจําเปนตองมีผูนําคนใหม ใครควรเปนทานผูนําคนตอไป?"
 germany.71.a: "แฮรฮิมมเลอรจะนําเราสูอนาคต"
 germany.71.b: "แฮรเกอริงคือตัวเลือกที่สมเหตุสมผล"
 germany.71.c: "เอวา เบราน ตองไดแกแคน!"
 germany.72.t: "แผนสมคบคิดลมเหลว"
 germany.72.d: "ทหารเอสเอสและหนวยทหารที่จงรักภักดีซึ่งรีบรุดไปยังทําเนียบไรช สามารถสังหารหรือจับกุมหนวยคอมมานโดผูทรยศไดทั้งหมด โดยฮิตเลอรเปนผูนําการกวาดลางเองดวยปนลูเกอรคูใจ นาอัศจรรยที่ทานผูนํารอดออกมาจากการตอสูโดยมีเพียงรอยถลอกไมกี่แหง\n\nผูสมคบคิดที่รอดชีวิตจะตองชดใชอยางสาสมตอความไมภักดี และบัดนี้ฮิตเลอรยิ่งมุงมั่นที่จะนําสงครามครั้งนี้ไปสูชัยชนะอันรุงโรจน!"
 germany.72.a: "ทานผูนําจงเจริญ!"
 germany.73.t: "แผนสมคบคิดสําเร็จ"
 germany.73.d: "การตอสูอยางหนักในทําเนียบไรชทําใหอาคารกลายเปนซากปรักหักพังที่ลุกไหม แมทหารเอสเอสจํานวนมากจะรีบรุดไปชวยฮิตเลอร แตหนวยทหารที่ภักดีตอผูสมคบคิดไดเขารวมการตอสูและกลายเปนปจจัยชี้ขาด มีการยืนยันแลววาทานผูนําถูกสังหาร เอวา เบราน คนสนิทของทานมาชานาน บาดเจ็บสาหัสจากการยิงตอสู และผูสมคบคิดไดบุกยึดอาคารรัฐบาลทั้งหมดในเบอรลินไดสําเร็จ\n\nแวรมัคทสวนใหญไดเปลี่ยนขางไปแลว แตนายทหารจํานวนมากยังคงภักดีตอพรรคนาซี ใครควรเปนผูนําพวกเขา?"
 germany.73.a: "ลัทธินาซีจงพินาศ!"
 germany.73.b: "ฮิมมเลอรจะพลิกสถานการณนี้ได!"
 germany.73.c: "ถึงตอนนี้เกอริงคือความหวังเดียวของเรา!"
 germany.73.e: "เอวา เบราน ตองไดแกแคน!"
 germany.74.t: "ปูทางไวกอน"
 germany.74.d: "ชาวออสเตรียปรารถนาจะเปนสวนหนึ่งของไรชเยอรมัน แตรัฐบาลหัวดื้อในเวียนนายังคงตอตานทุกความพยายามที่จะรวมชาติ เราตองเพิ่มการสนับสนุนลัทธิฟาสซิสตในออสเตรีย แลวพรรคนาซีออสเตรียจะกลายเปนทางเลือกที่เปนไปไดแทนพวกฟาสซิสตออสเตรียที่ครองอํานาจอยู\n\nมีสายลับอับแวรคนหนึ่งพรอมสําหรับภารกิจจารกรรม ใชเขาเพื่อเพิ่มการสนับสนุนลัทธิฟาสซิสตในออสเตรียอยางลับๆ"
 germany.74.a: "ออสเตรียจะเปนของเรา!"
 germany.75.t: "สนธิสัญญาเยอรมัน-โซเวียต"
 germany.75.d: "แมกอนหนานี้จะเคยใชวาทกรรมรุนแรงโจมตีทั้งประชาชนและผูนําทางอุดมการณของ[Root.GetName] แตบัดนี้[From.GetLeader]และเยอรมนีไดยื่นมือมาหาเรา เพื่อขอทําสนธิสัญญาดานการวิจัยที่เปนประโยชนรวมกัน แมการแลกเปลี่ยนความรูจะชวยความพยายามในการพัฒนาแบบรถถังใหมของเรา พรอมคํามั่นวาจะไดประโยชนดานการวิจัยอื่นๆ ในอนาคต แตเมื่อพิจารณาจากคําแถลงกอนหนานี้ ก็แทบไมตองสงสัยวาเยอรมันทําเชนนี้เพื่อประโยชนของตนเอง เราควรเดินหนาทําขอตกลงนี้หรือไม แมจะเสี่ยงตอการสงเสริมความทะเยอทะยานของ[From.GetLeader]?"
 germany.75.a: "พวกนายทุนเปนภัยคุกคามที่รายแรงกวาสําหรับเราทั้งคู"
 germany.75.b: "เราจะไมมอบอาวุธใหฟาสซิสตไวบดขยี้ชนชั้นกรรมาชีพ!"
 germany.76.t: "โซเวียตยอมรับสนธิสัญญาเยอรมัน-โซเวียต"
 germany.76.d: "การเจรจาของเรากับ[From.GetName]ประสบความสําเร็จ ไดบรรลุขอตกลงที่ชาติของเราจะชวยเหลือกันในการพัฒนาหนวยยานเกราะแบบใหม และอาจขยายไปสูดานการวิจัยอื่นๆ ในอนาคต"
 germany.76.a: "สนธิสัญญานี้จะเปนกาวแรกสูอนาคต"
 germany.77.t: "โซเวียตปฏิเสธสนธิสัญญาเยอรมัน-โซเวียต"
 germany.77.d: "[From.GetName]ปฏิเสธขอเสนอของเราในการทําสนธิสัญญาเพื่อพัฒนาการวิจัยหนวยยานเกราะของทั้งสองประเทศ คาดวาคงเพราะกลัววาอาวุธอันเหนือกวาของเราจะหันกลับมาใชกับพวกเขา"
 germany.77.a: "ถึงตอนนี้พวกเขาก็แทบไมไดลดความเสี่ยงนั้นลงเลย"
 germany.78.t: "การวิจัยดานอากาศรวมกับเยอรมนี"
 germany.78.d: "ตามที่กําหนดไวในสนธิสัญญากับเยอรมนี โครงการวิจัยพิเศษบางโครงการของพวกเขาไดแบงปนการคนพบกับวิศวกรของเรา ความกาวหนาครั้งสําคัญลาสุดดานเทคโนโลยีเรดารไดมาถึงมือเรา เปดโอกาสที่ไมคาดคิดในการพัฒนาการวิจัยของเราในสาขานี้"
 germany.78.a: "การตรวจจับขาศึกคือกาวแรก"
 germany.79.t: "คําขาดจากเยอรมนี"
 germany.79.d: "เมื่อกรีซตกอยูใตอํานาจของเยอรมนี [From.GetLeader]ไดกดดันรัฐบาลของเราใหเขารวมฝายของพวกเขา พันธมิตรโซเวียต-เยอรมันทําใหเราอยูในสถานะที่ความเปนกลางไมใชทางเลือกอีกตอไป และบัดนี้คําขาดจากเบอรลินไดมาถึง เรียกรองใหเรายกดินแดนฝงตะวันออกใหพันธมิตรโซเวียตของพวกเขา และเขารวมกติกาสัญญาเดียวกับที่พวกเขาใชบีบบังคับเรา\n\nแมเราจะรักษาความเปนกลางไวไมได แตก็ยังมีทางเลือกอื่น การขอความสนับสนุนจากอังกฤษเปนทางหนึ่ง การยืนหยัดสูเปนอีกทางหนึ่ง แตไมมีทางใดที่รับประกันอนาคตของสาธารณรัฐไดอยางแนนอน"
 germany.79.a: "หากรวมมือกับเยอรมัน เราอาจมีโอกาสทวงคืนดินแดนอื่น"
 germany.79.b: "เราไวใจการสนับสนุนจากอังกฤษได และพวกเขาก็ไวใจเราได"
 germany.79.c: "หากพวกทรราชนี้ตองการยึดบานของเรา ก็ตองสูเพื่อมันกอน"
 germany.80.t: "ดานซิกแลกสโลวาเกีย"
 germany.80.d: "เยอรมันจองมองดานซิกมานาน หมายจะรวมดินแดนในปรัสเซียตะวันออกเขากับสวนที่เหลือของชาติเยอรมัน นักการทูตเตือนวาวันหนึ่งพวกเขาอาจบังคับใหเราเลือกระหวางดานซิกหรือสงคราม\n\nนาประหลาดใจที่เราไดรับขอเสนอซึ่งเยอรมันมองวาเปนทางออกที่สันติกวา พวกเขาเสนอรัฐสโลวาเกียที่เพิ่งกอตั้ง ซึ่งขณะนี้แทบไมตางจากรัฐหุนเชิดใตการปกครองของเยอรมนี ใหแกเราเพื่อแลกกับดานซิก \nยังไมรูวาเยอรมันจะทําอยางไรหากเราปฏิเสธ แตเราไดรับโอกาสที่จะยุติความขัดแยงนี้พรอมไดดินแดนเพิ่มมาบาง"
 germany.80.a: "นี่คือขอเสนอที่ดีที่สุดที่เราจะได"
 germany.80.b: "เราจะไมยอมยกสิ่งที่เปนของเราโดยชอบธรรมเพื่อแลกกับสิ่งที่พวกเขาขโมยมา!"
 germany.81.t: "ยกดานซิกแลกสโลวาเกีย"
 germany.81.d: "โปแลนดตกลงตามการแลกเปลี่ยน โดยดานซิกจะถูกยกให[GER.GetNameDef] ขณะที่สโลวาเกียจะอยูภายใตการควบคุมของโปแลนด ดวยขอตกลงนี้ เราไดทวงคืนดานซิกพรอมรักษาความสัมพันธอันดี หรืออยางนอยก็ไมเปนปรปกษอยางเปดเผย กับเพื่อนบานทางตะวันออกของเรา"
 germany.81.a: "เยอรมนีเปนหนึ่งเดียวอีกครั้ง"
 germany.82.t: "[From.GetNameDefCap]ปฏิเสธที่จะยกดานซิก"
 germany.82.d: "ขอเสนออันใจกวางของเราที่จะมอบดินแดนสโลวาเกียให[From.GetNameDef]เพื่อแลกกับดานซิกถูกปฏิเสธ ดานซิกจึงยังอยูในมือโปแลนด เห็นไดชัดวา[From.GetLeader]ไมไดมองวาดานซิกเปนดินแดนเยอรมันโดยชอบธรรมเหมือนกับเรา \n[Root.GetLeader]โกรธจัด และหนทางทางการทูตในการทวงคืนดานซิกดูเหมือนจะหมดสิ้นแลว"
 germany.82.a: "อาจถึงเวลาพิจารณาทางเลือกอื่นแลว"
 germany.83.t: "กติกาสัญญาตอตานโซเวียต"
 germany.83.d: "ดวยกติกาสัญญาตอตานโคมินเทิรน [From.GetNameDef]ไดวางรากฐานอันดีสําหรับการใชวิธีทางการทูตเพื่อสกัดกั้นภัยคุกคามจากโซเวียต อยางไรก็ตาม กติกาสัญญานี้ไมใชพันธมิตรทางทหาร และไมมีพันธกรณีที่ชัดเจนสําหรับผูลงนาม บัดนี้[From.GetLeader]ตองการขยายกติกาสัญญาใหเปนแนวรวมตอตานโซเวียต ซึ่งเปนขอตกลงผูกมัดวาจะรวมทําสงครามดวยกันหากผูลงนามรายใดเขาสูภาวะสงครามกับสหภาพโซเวียต\n\nแมจะอันตรายกวามาก และนาจะทําใหการทูตใดๆ ที่เรายังมีกับโซเวียตสิ้นสุดลง แตนี่ก็เปนโอกาสที่จะทําใหเรามีพันธมิตรที่แข็งแกรงอยูเคียงขางหากเกิดสงคราม"
 germany.83.a: "เราจะยืนเคียงขางเยอรมนีและพันธมิตรตอตานโซเวียต"
 germany.83.b: "ใครก็อาจกอสงครามโลกครั้งใหมไดดวยกติกาสัญญาเชนนี้"
 germany.84.t: "เรียกสมาชิกกติกาสัญญาเขารวมสงคราม"
 germany.84.d: "ดังที่เราคาดไวตอนลงนามในกติกาสัญญาตอตานโซเวียต บัดนี้เราอยูในภาวะสงครามกับสหภาพโซเวียตแลว ถึงเวลาที่ผูรวมลงนามจะตองรักษาคํามั่นและเขารวมกับเรา"
 germany.84.a: "การมองการณไกลของเราไดผล"
 germany.85.t: "[From.GetName]เรียกสมาชิกกติกาสัญญาเขารวมสงคราม"
 germany.85.t.a: "[From.GetName]เรียกสมาชิกกติกาสัญญาเขารวมสงคราม"
 germany.85.t.b: "[From.GetName]เรียกรองตามการรับประกัน"
 germany.85.d: "กติกาสัญญาตอตานโซเวียตกําหนดใหผูลงนามทุกรายตองเขารวมในการสูรบเชิงปองกันกับสหภาพโซเวียต บัดนี้[From.GetName]ถูกโซเวียตโจมตี และไดสงคํารองขอใหสมาชิกกติกาสัญญาทุกรายเขาชวยเหลือโดยทันที ถึงเวลาแสดงความมุงมั่นของ[Root.GetAdjective]ในการปกปองโลกจากภัยคุกคามของสหภาพโซเวียตใหสิ้นซากเสียที"
 germany.85.desc.a: "กติกาสัญญาตอตานโซเวียตกําหนดใหผูลงนามทุกรายตองเขารวมในการสูรบเชิงปองกันกับสหภาพโซเวียต บัดนี้[From.GetName]ถูกโซเวียตโจมตี และไดสงคํารองขอใหสมาชิกกติกาสัญญาทุกรายเขาชวยเหลือโดยทันที ถึงเวลาแสดงความมุงมั่นของ[Root.GetAdjective]ในการปกปองโลกจากภัยคุกคามของสหภาพโซเวียตใหสิ้นซากเสียที"
 germany.85.desc.b: "การรับประกันของเราตอ[From.GetNameDef]กําหนดใหเราตองเขารวมในการสูรบเชิงปองกันกับสหภาพโซเวียต บัดนี้พวกเขาถูกโซเวียตโจมตี และถึงเวลาที่เราตองทําตามขอตกลงและเขาชวยเหลือพวกเขาโดยทันที ถึงเวลาแสดงความมุงมั่นของ[Root.GetAdjective]ในการปกปองโลกจากภัยคุกคามของสหภาพโซเวียตใหสิ้นซากเสียที"
 germany.85.a: "[From.GetName]ไมไดสูเพียงลําพัง!"
 germany.85.b: "นี่ไมใชสงครามของเรา"
 germany.85.b_tt: "§Yการกระทํานี้จะถูกมองวาเปนการทรยศโดยทุกประเทศที่ยึดมั่นในกติกาสัญญา (ความสัมพันธ §!§R-50§!§Y)§!"
 germany.86.t: "ดานซิกหรือสงคราม"
 germany.86.d: "[GER.GetNameDefCap]ประกาศเปาหมายในการทวงคืนดินแดนที่สูญเสียไปในมหาสงครามมาเปนเวลานาน โดยเฉพาะดินแดนดานซิก ซึ่งแยกปรัสเซียตะวันออกออกจากสวนที่เหลือของชาติพวกเขา \n\nบัดนี้ พวกเขาเรียกรองใหยกดานซิกให[GER.GetNameDef] โดยเสนอเปนการแลกเปลี่ยนเพียงคําสัญญาวาจะสละการอางสิทธิ์เหนือพอซนัน เมื่อภัยสงครามคืบใกล การยอมรับขอเสนอจะชวยชะลอความขัดแยงที่อาจเกิดขึ้น แตตองแลกดวยการมอบความแข็งแกรงใหเยอรมันเพิ่มขึ้นโดยเปลาประโยชนสําหรับสิ่งที่รออยูขางหนา"
 germany.86.a: "ตกลงกันเถอะ บางทีพวกเขาอาจหันไปทางอื่น"
 germany.86.b: "ดานซิกจะยังคงเปนกดัญสก!"
 germany.87.t: "โปแลนดยกดานซิก"
 germany.87.d: "เมื่อเผชิญกับคําขาดของเรา โปแลนดยอมสละดินแดนที่ไดมาโดยไมชอบธรรมใหแกเรา ซึ่งพิสูจนวาพวกเขาตองรูอยูแลววาดินแดนนั้นเปนของเยอรมนีโดยชอบธรรม!"
 germany.87.a: "โปแลนดเลี่ยงสงครามได... ในตอนนี้"
 germany.88.t: "โปแลนดปฏิเสธที่จะยกดานซิก"
 germany.88.d: "แมเราจะพยายามเปดโอกาสใหโปแลนดสงมอบดานซิกอยางสันติ ถึงขั้นใหคํามั่นวาจะสละการอางสิทธิ์เหนือดินแดนเยอรมันอื่นเปนการแลกเปลี่ยน แตเรากลับไดรับการปฏิเสธ ตามคาด โลกนี้ไมใหสิ่งใดแกเราเลยหากเราไมยึดมาดวยกําลัง"
 germany.88.a: "พวกเขารูดีวาทางเลือกอื่นคืออะไร"
 germany.1002.t: "ปฏิบัติตามกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพหรือไม?"
 germany.1002.desc: "เยอรมนีและ[SOU.GetNameDef]ไดตกลงกันไวแลววาจะแบงโปแลนดออกเปนครึ่งตะวันออกและตะวันตก แตการที่เรายึดครองฝงตะวันออกทําใหขอตกลงนี้ยุงยากขึ้น แมพันธมิตรเยอรมันของเราจะคาดหวังเต็มที่วาเราจะสงมอบดินแดนโปแลนดตามที่สัญญาไวให[SOU.GetNameDef] แตเราอาจเลือกฉีกกติกาสัญญาและยึดครองตอไปแทนก็ได"
 germany.1002.b: "โปแลนดเปนของเรา!"
 germany.1003.t: "[From.GetNameDefCap]ฉีกกติกาสัญญา!"
 germany.1003.desc: "แมจะมีการตัดสินใจยกโปแลนดตะวันออกให[SOU.GetNameDef] แตพันธมิตรของเราใน[From.GetNameDef]กลับเลือกยึดครองโปแลนดตอไป ซึ่งเปนการฉีกกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพอยางเปนทางการ!"
 germany.1003.a: "บัดนี้เราตองชดใชราคาของความอวดดีของพวกเขา"
 china.1.t: "กรณีสะพานมารโคโปโล"
 china.1.d: "เมื่อไมนานมานี้ ทหารญี่ปุนไดโจมตีสะพานมารโคโปโลซึ่งเปนจุดยุทธศาสตรทางใตของปกกิ่ง แตถูกทหารผูกลาหาญของเราตีถอยกลับไป ไมตองสงสัยเลยวานี่คือเหตุการณที่จัดฉากขึ้นเพื่อปายความผิดใหเราและบีบใหเรายอมยกดินแดนเพิ่ม เหมือนกับกรณีมุกเดนตอนที่ญี่ปุนบุกแมนจูเรีย \n\nเราควรตอบโตอยางไร?"
 china.1.a: "เราทนมาถึงขีดสุดแลว!"
 china.1.b: "เราไมอาจทําสงครามกับญี่ปุนได"
 china.1.b_tt_SND: "§Y[SND.GetNameDefCap]§!จะถูกกดดันใหยกดินแดนให§Y[JAP.GetName]§!"
 china.1.b_tt_HBC: "§Y[HBC.GetNameDefCap]§!จะถูกกดดันใหยกดินแดนให§Y[JAP.GetName]§!"
 china.2.t: "เยอรมนีถอนที่ปรึกษา"
 china.2.d: "เยอรมนียอมจํานนตอแรงกดดันทางการทูตของญี่ปุน และตัดสินใจถอนที่ปรึกษาทางทหารออกจากประเทศของเรา! ฟอน ฟลเคนเฮาเซินสัญญาในงานเลี้ยงอําลาวาจะไมเปดเผยแผนการรบของเราใหญี่ปุนรู แตการสิ้นสุดการสนับสนุนจากเยอรมนียอมสงผลเสียตอกองทัพของเราแนนอน"
 china.2.a: "เราตองอยูใหไดโดยไมมีพวกเขา"
 china.3.t: "ความสัมพันธจีน-เยอรมันยํ่าแย"
 china.3.d: "ความสัมพันธที่เสื่อมทรามลงกับเยอรมนีทําใหพวกเขาเรียกตัวที่ปรึกษาทางทหารทั้งหมดกลับจากประเทศของเรา"
 china.3.a: "นายทหารจีนจะสานตอสิ่งที่พวกเขาเริ่มไวใหสําเร็จ!"
 china.4.t: "กักตัวที่ปรึกษาทางทหาร"
 china.4.d: "เนื่องจากขณะนี้เราอยูในภาวะสงครามกับเยอรมนี ที่ปรึกษาทางทหารทั้งหมดของพวกเขาที่อยูในประเทศเราจึงถูกกักตัว ฟอน ฟลเคนเฮาเซินและพรรคพวกอีกไมกี่คนหลบหนีไปได และเดินทางกลับยุโรปแลว!"
 china.4.a: "ไปไดก็ดี!"
 china.5.t: "ไมจนมุมอีกตอไป"
 china.5.d: "กองทัพแดงเคยเอาตัวรอดมาไดในสภาพที่ดูสิ้นหวัง แตนับตั้งแตการเดินทัพทางไกลเมื่อหลายปกอน สถานการณก็คอยๆ พลิกกลับ ดวยการรุกคืบยึดดินแดนไดมาก บทบาทผูเสียเปรียบของเราก็กลายเปนอดีตไปแลว เมื่อผานชวงเวลาแหงการตอสูดิ้นรนมาได ความสิ้นหวังก็อยูเบื้องหลังเราแลว เหมา เจอตง ไดเปลี่ยนจากผูนํากองทัพกองโจรมาเปนประธาน"
 china.5.a: "สาธารณรัฐประชาชนจงเจริญ!"
 china.6.t: "เตรียมโจมตีคอมมิวนิสต"
 china.6.d: "หลังการถอยรนอันยาวนานของกองทัพแดงแหงพรรคคอมมิวนิสตจีน พวกเขาไดรวมกําลังใหมและตั้งมั่นอยูในมณฑลสานซี ความพยายามอยางตอเนื่องที่จะปลุกปนประชาชนในชนบทใหตอตานเรา และแสวงหาการสนับสนุนจากสหภาพโซเวียต บงชี้วาพวกเขาอาจแข็งแกรงขึ้นหากถูกปลอยไว อยางไรก็ตาม ขุนศึกหลายรายในพื้นที่โดยรอบ แมจะสนับสนุนรัฐบาลของเรา แตก็ไมเต็มใจหรือไมสามารถเสียสละเทาที่จําเปนเพื่อใหการโจมตีไดผล\n\nขณะนี้ยังไมชัดเจนวากองทัพแดงยังฟนตัวอยูหรือพรอมเผชิญหนากับเราในสนามรบแลว แตเวลาไมไดอยูขางเรา เพื่อเสริมสถานะทางการเมือง เราตองโจมตีพวกคอมมิวนิสต"
 china.6.a: "บีบบังคับขุนศึกทองถิ่นใหรวมการรุก"
 china.6.b: "เกณฑโจรทองถิ่นมาสูเพื่อเรา"
 china.6.c: "พึ่งพาอาสาสมัครทองถิ่นที่ตอตานคอมมิวนิสต"
 china.6.tt: "§Yหาก PRC เลือกเผชิญหนากับการโจมตี:§!\n"
 china.6.tt_2: "§Yหาก PRC เลือกถอยรน:§!\n"
 china.7.t: "กกมินตั๋งเปดฉากรุก"
 china.7.d: "แมเราจะรอดพนจากความพายแพที่แนนอนดวยการเดินทัพทางไกล แตพวกชาตินิยมก็ไมไดคิดจะปลอยใหเราแข็งแกรงขึ้นโดยไมเผชิญหนากันอีก สายลับของเรารายงานวาพวกเขากําลังเตรียมการรุกเรา ซึ่งอาจบั่นทอนการสนับสนุนทางการเมืองของเราหากเราพยายามถอยรนตอไป\n\nเราไมรูวาตอนนี้กกมินตั๋งมุงมั่นจะผลักดันเราถอยแคไหน การพยายามเผชิญหนากับพวกเขามีความเสี่ยงสูง หากขุนศึกทองถิ่นถูกระดมมาสนับสนุนการโจมตี โอกาสของเราอาจริบหรี่ ในทางกลับกัน การถอยรนตอนนี้ ในเมื่อเราเพิ่งหยุดพักไดในที่สุด อาจไมใชทางเลือก"
 china.7.a: "เผชิญหนากับการโจมตีดวยทุกวิถีทางที่เรามี!"
 china.7.b: "ถอยรนไปอยูอยางโดดเดี่ยว"
 china.8.t: "คอมมิวนิสตถอยรน"
 china.8.d: "พรรคคอมมิวนิสตจีนลวงรูแผนการรุกของเราผานเครือขายสายลับทองถิ่น จึงถอนกองทัพแดงลึกเขาไปในมณฑลสานซี แมจะทําใหเราเสียโอกาสบั่นทอนกําลังของพวกเขาเพิ่ม แตก็แสดงใหเห็นวาพวกคอมมิวนิสตยังไมพรอมเผชิญหนากับเรา ไมวาโฆษณาชวนเชื่อของพวกเขาจะวาอยางไร ในระดับหนึ่ง ความพยายามครั้งนี้ก็ยังเปนผลดีตอเรา"
 china.8.a: "พวกขี้ขลาด!"
 china.9.t: "ชัยชนะเหนือคอมมิวนิสต"
 china.9.d: "ความมุงมั่นของเราในการตีกองทัพแดงใหแตกพายประสบผลสําเร็จ อยางนอยก็ในตอนนี้ แมจะไดขาวเกี่ยวกับการโจมตีลวงหนา แตพวกคอมมิวนิสตก็เลือกเผชิญหนากับกองกําลังของเราและพายแพ ตอนนี้พวกเขาถูกบีบใหถอยรนลึกเขาไปอีก และชาวบานจํานวนมากก็เริ่มกังขาวาพวกเขาจะทําตามคําสัญญาที่จะโคนลมรัฐบาลของเราไดจริงหรือ"
 china.9.a: "ก็สมควรแลว!"
 china.10.t: "คอมมิวนิสตตีโตการโจมตี"
 china.10.d: "กองทัพแดงไดขาวเกี่ยวกับแผนการรุกของเราลวงหนา จึงเตรียมพรอมและเผชิญหนากับการโจมตีของเรา กําลังพลที่เรารวบรวมไดในพื้นที่นี้ ซึ่งฐานอํานาจของเราออนแอ ไมเพียงพอที่จะเอาชนะกองกําลังคอมมิวนิสต \nนาเสียดายที่การโจมตีครั้งนี้กลับเปนผลรายตอเรา และถูกมองวาเปนสัญญาณการฟนตัวของกองทัพแดงหลังการถอยรนอันยาวนาน"
 china.10.a: "ในระยะยาวมันไมชวยอะไรพวกเขาหรอก"
 china.11.t: "พายแพตอกกมินตั๋ง"
 china.11.d: "แมเราจะพยายามอยางเต็มที่เพื่อตีโตการโจมตีของกองกําลังทองถิ่นที่สนับสนุนรัฐบาลชาตินิยม แตการเตรียมการของเราไมเพียงพอที่จะหยุดยั้งได ดวยความสูญเสียอยางหนัก เราจึงถูกบีบใหถอยรนอีกครั้ง แมจะเปนระยะที่สั้นกวาก็ตาม\n\nการเผชิญหนากับพวกชาตินิยมกอนที่เราจะฟนตัวเต็มที่อาจเปนความผิดพลาด การฟนตัวอันยิ่งใหญของเราในการเดินทัพทางไกลไดปลูกฝงความหวังใหผูสนับสนุน แตบัดนี้เมล็ดพันธุแหงความสงสัยไดถูกหวานลงแลว"
 china.11.a: "เราจะฟนตัวและชนะใจประชาชนกลับมาอีกครั้ง"
 china.12.t: "ชัยชนะเหนือกกมินตั๋ง"
 china.12.d: "การทาทายการรุกของกกมินตั๋งเปนผลดีตอเรา กองกําลังทองถิ่นที่ถูกสงมาเผชิญหนากับกองทัพแดงไมไดเตรียมรับมือกับการที่เรารูลวงหนาถึงการโจมตี จึงพายแพไป ทั้งหมดนี้เปนคําเตือนถึงขุนศึกใกลเคียงวาการโจมตีเราอาจตองจายแพง \n\nพวกชาตินิยมเพียงพิสูจนวาพวกเขาประเมินเราในฐานะศัตรูตํ่าเกินไป และสาธารณรัฐประชาชนกําลังผงาดขึ้นอีกครั้ง"
 china.12.a: "อํานาจทางการเมืองงอกออกมาจากปากกระบอกปน"
 china.13.t: "ปะทะกับกองโจรคอมมิวนิสต"
 china.13.d: "เมื่อทั้งเราและกองทัพแดงจีนตางเพิ่งฟนตัวจากการรุกครั้งกอนไดไมนาน การที่ทั้งสองฝายมีกําลังทหารอยูใกลชายแดนก็จุดชนวนความขัดแยงขึ้นอีกครั้ง นอกจากขุนศึกและกองกําลังอาสาทองถิ่นแลว เรายังพิจารณาเคลื่อนกําลังพลจากที่อื่นเขามาเพิ่มดวย\n\nแมวิธีนี้อาจไมเปดโอกาสใหเราบดขยี้ภัยคอมมิวนิสตไดอยางเด็ดขาด แตก็จะเปนชัยชนะทางอุดมการณที่สําคัญ แสดงใหเห็นวาพวกเขาจะไมไดรับอนุญาตใหขยายอิทธิพลตอไป"
 china.13.a: "เราตองขีดเสนตอนนี้!"
 china.13.b: "เราไมอาจเผชิญหนากันอีกครั้งได"
 china.14.t: "พายแพใน[From.GetName]"
 china.14.d: "แมเราจะพยายามแสดงใหเห็นวาพวกคอมมิวนิสตจะไมไดรับอนุญาตใหขยายอิทธิพลออกไปนอกพื้นที่ที่พวกเขาหลบภัยอยูในขณะนี้ แตเราไมสามารถทุมทรัพยากรไดมากพอที่จะชนะความขัดแยงตามแนวชายแดน[From.GetName]\n\nการปะทะประปรายกับกองกําลังอาสาคอมมิวนิสตคอยๆ เปนผลดีตอพวกเขามากขึ้นเรื่อยๆ จนในที่สุดการทัพครั้งนี้ก็ลมเหลวในการแสดงใหเห็นวาเราควบคุมสถานการณได หากแรงสนับสนุนจากประชาชนของพวกเขายังเพิ่มขึ้นตอไป พวกคอมมิวนิสตอาจกลายเปนภัยคุกคามที่แทจริง"
 china.14.a: "นากังวล"
 china.15.t: "ชัยชนะใน[From.From.GetName]"
 china.15.d: "หลังการปะทะยอยหลายครั้งตามชายขอบดินแดนที่เราควบคุม ความขัดแยงกับกกมินตั๋งดูเหมือนจะพลิกมาเปนผลดีตอเรา แมการกดดันอยางตอเนื่องจะสรางภาระใหกําลังพลและเสบียงของเรา แตความพยายามนี้ก็คุมคา \n\nแมจะไมมีการรบครั้งชี้ขาด แตครั้งนี้เราไดรับชัยชนะอยางชาๆ ซึ่งเสริมศรัทธาในอุดมการณของเรา และโหมไฟแหงการปฏิวัติใหลุกโชนอีกครั้ง"
 china.15.a: "เรื่องนี้จะไมถูกลืมงายๆ!"
 china.16.t: "พายแพใน[From.GetName]"
 china.16.d: "ความพยายามของเราในการทําสงครามทางออมตอการเพิ่มกําลังของกกมินตั๋งกลับกลายเปนหายนะ พวกชาตินิยมมุงมั่นจะผลักดันเราถอยมากกวาที่เราคิด บางทีอาจคาดการณไวแลววาความลมเหลวครั้งนี้จะสงผลตอชื่อเสียงของเราอยางไร แมตอนนี้กองทัพของเราจะปลอดภัยพอจะฟนตัวไดอีกครั้ง แตชาวบานก็ไมไดมองขามความสูญเสีย และขาวลือเรื่องความลมเหลวของการปฏิวัติก็เริ่มแพรไปยังหมูบานใกลเคียงแลว"
 china.16.a: "การปฏิวัติยังไมตาย!"
 china.17.t: "ชัยชนะใน[From.From.GetName]"
 china.17.d: "ความพยายามของเราในการขีดเสนตอตานภัยคอมมิวนิสตประสบผลสําเร็จ การทัพแบบกองโจรของพรรคคอมมิวนิสตจีนเพื่อตอบโตการเพิ่มกําลังทหารของเราในพื้นที่รอบฐานอํานาจของพวกเขา ไมไดคาดการณถึงความมุงมั่นของเราที่จะหยุดยั้งพวกเขา การแสดงพลังครั้งนี้ แมจะตองแลกดวยความสูญเสียอยูบาง แตก็ทําใหชาวบานจํานวนมากที่เคยใหการสนับสนุนโดยปริยายแก[From.GetLeader]และพรรคของเขา เริ่มตระหนักวาจีนไมมีวันรวมเปนหนึ่งไดภายใตอุดมการณเชนนั้น"
 china.17.a: "หวังวาพวกเขาจะจําไว"
 china.18.t: "ปะทะกับกองทัพชาตินิยม"
 china.18.d: "ขณะที่เราเพิ่งฟนตัวจากการรุกครั้งกอนไดไมนาน พวกชาตินิยมดูเหมือนกําลังเพิ่มกําลังทหารในพื้นที่ใกลชายแดนของเรา เห็นไดชัดวาพวกเขาพยายามแสดงใหเห็นวาสามารถปดลอมเราไดอีกครั้ง และการเดินทัพทางไกลเปนเพียงการชะลอการโจมตีครั้งสุดทายตอพรรคคอมมิวนิสตจีนเทานั้น เราจะปลอยใหประชาชนคิดเชนนั้นไมได"
 china.18.a: "เราไมมีเวลามานั่งฟนตัว"
 china.100.t: "จีนถูกโจมตีหนักขึ้น"
 china.100.d: "ญี่ปุนรุกคืบเขามาเหมือนแมวและยึดเกาหลีไป พวกเขาพยายามเหยียดหยามเราดวยขอเรียกรองยี่สิบเอ็ดขอ ยึดครองแมนจูเรีย และบัดนี้ก็รุกคืบเขามาอีก พอกันที จีนจะสูจนถึงที่สุดเพื่ออิสรภาพ ในสุนทรพจนตอประชาชน [Root.GetLeader]ไดเรียกรองชาว[Root.GetAdjective]ทุกคนใหยืนหยัดรวมกัน มิฉะนั้นจะตองเผชิญหายนะเพียงลําพัง"
 china.100.a: "เพื่อจีน!"
 china.101.t: "จีนถูกโจมตี"
 china.101.d: "ถึงเวลาที่เราตองยืนหยัดรวมกันตอตานศัตรูรวมของเรา นั่นคือญี่ปุน วางเรื่องขัดแยงเล็กๆ นอยๆ ไวกอน แลวสูในฐานะจีนที่แข็งแกรงและเปนหนึ่งเดียว!"
 china.101.a: "สามัคคีคือพลัง!"
 china.101.b: "เราตองขับไลผูรุกราน!"
 china.102.t: "จีนถูกโจมตี"
 china.102.d: "เมื่อสหภาพโซเวียตติดพันอยูกับสงครามกับเยอรมนี เราไดรับแจงวาพวกเขาจะไมสามารถใหความคุมครองไดมากเทาที่เคยใหมาในอดีต จึงเปนประโยชนสูงสุดของเราที่จะหาการสนับสนุนจากกกมินตั๋งและรวมทําสงครามกับญี่ปุนไปกับพวกเขา"
 china.102.a: "สามัคคีคือพลัง!"
 china.102.b: "มารวมกันตีโตภัยญี่ปุนเถิด"
 china.102.c: "ผลประโยชนของเราไดรับการปกปองดีที่สุดโดยโซเวียตผูเกรียงไกร"
 china.103.t: "จีนรวมเปนหนึ่ง"
 china.103.d: "[From.GetName]เลือกที่จะรวมกับเราในการตอสูกับญี่ปุน เมื่อรวมเปนหนึ่ง เราจะขับไลผูรุกรานกลับไป"
 china.103.a: "สามัคคีคือพลัง!"
 china.104.t: "จีนถูกโจมตี"
 china.104.d: "จีนกําลังถูกโจมตี ขุนศึกตางวางความขัดแยงไวกอนเพื่อตอสูกับกองกําลังญี่ปุนที่รุกราน นี่คือโอกาสที่จะสงเสริมผลประโยชนของพรรคคอมมิวนิสตจีน เราสามารถแสดงใหประชาชนจีนเห็นวาเรา ไมใชกกมินตั๋งที่เสื่อมทราม คืออนาคตที่แทจริงของจีน เราควรเขารวมการตอสูดวยเพื่อใหแนใจวาจีนจะมีอนาคตหรือไม?"
 china.104_PRC_SOV_reinforcements: "จะไดรับ 10 กองพลจากโซเวียต"
 china.104.a: "สามัคคีคือพลัง!"
 china.104.b: "พวกเขาตองรับมือกับญี่ปุนเองโดยไมมีเราชวย"
 china.104.tt: "\nจีนตอนเหนือและแมนจูเรียสามารถไดรับการปลดปลอยในนามของ[Root.GetName]ไดแลว\n"
 china.105.t: "จีนรวมเปนหนึ่ง"
 china.105.d: "[From.GetName]ตองการใหเรารวมกําลังกันตอสูกับญี่ปุน พวกเขาเขารวม[From.GetFactionName]แลว และพรอมวางความขัดแยงเกาไวกอนเพื่อยืนหยัดตอตานการรุกรานของญี่ปุน"
 china.105.a: "สามัคคีคือพลัง!"
 china.105.b: "เราจะยอมใหพวกเขาควบคุมชาติเราบางสวนระหวางสงครามที่กําลังจะมาถึง"
 china.106.t: "จีนรวมเปนหนึ่ง"
 china.106.d: "[From.GetName]เขารวม[Root.GetFactionName]แลว และพรอมสูรบ"
 china.106.a: "เราจะไลลาปศาจญี่ปุนออกจากแผนดินของเรา"
 china.107.t: "ไมเปนหนึ่งเดียวอีกตอไป"
 china.107.d_PRC_joined: "[Root.GetFactionName]ไดบรรลุจุดประสงคแลว ไมมีศัตรูใหตองรวมกันตอตานอีกตอไป เหมา เจอตง กําลังกระชับอํานาจเหนือดินแดนในจีนตอนเหนือ แตพวกเขาจะมีความหวังอะไรเมื่อตองเผชิญกับกองทัพผูมีชัยของเรา"
 china.107.d_PRC_refused: "เมื่อสงครามสิ้นสุด ผูรักชาติที่แทจริงก็ไดรับชัยชนะ ถึงเวลาชําระบัญชีกับพวกที่หลบซอนขณะที่เราหลั่งเลือด"
 china.107_tt: "@PRC §Yสาธารณรัฐประชาชนจีน§!เขาควบคุมรัฐของจีนใน§Yจีนตอนเหนือ§!และ§Yแมนจูเรีย§!\n"
 china.107.a: "เราไมมีศัตรูรวมกันอีกตอไป"
 china.108.t: "คอมมิวนิสตรุกคืบ"
 china.108.d: "บทบาทของเราในการตอสูกับหมาญี่ปุนอันนาชิงชังไดสรางเกียรติภูมิอยางมากใหพรรคคอมมิวนิสตจีน ผูคนเห็นมากขึ้นเรื่อยๆ วาเราคืออนาคตของจีน โดยเฉพาะเมื่อเทียบกับกกมินตั๋งที่ฉอฉล แกนนําพรรคกําลังจัดตั้งผูคนเหลานี้เปนกองทัพใหมที่จะแหวกวายอยูในทะเลแหงชาวนา"
 china.108.a: "เราตองเสริมกําลังพล"
 china.108_PRC_SOV_reinforcements_2: "ไดรับ 20 กองพล"
 china.109.t: "สูเพื่อจีน!"
 china.109_tt: "§Yไดรับการอางสิทธิ์เหนือจีนแผนดินใหญ§!\n"
 china.109.d: "ถึงเวลาขจัดโรครายที่ชื่อกกมินตั๋งออกไปจากจีน เราจะปลดปลอยชาวจีนทุกคน และรวมประชาชนเปนหนึ่งเดียวภายใตการนําอันชาญฉลาดของเหมา"
 china.109.a: "สูสงคราม!"
 china.110.t: "[From.GetName]ประกาศสงคราม"
 china.110.d: "[From.GetName]และคณะรัฐบาลของ[From.GetLeader]ไดประกาศสงครามกับเรา"
 china.110.a: "สูสงคราม!"
 china.111.t: "ไมเปนหนึ่งเดียวอีกตอไป"
 china.111.d: "[Root.GetFactionName]ไดบรรลุจุดประสงคแลว ไมมีศัตรูใหตองรวมกันตอตานอีกตอไป เราใชเวลาที่ผานมาอยางชาญฉลาดในการสรางฐานสนับสนุนทั่วจีนตอนเหนือและแมนจูเรีย และบัดนี้ถึงเวลาทําใหการควบคุมภูมิภาคนี้เปนทางการ"
 china.111.a: "เราไมมีศัตรูรวมกันอีกตอไป"
 china.200.t: "เขารวมกับสาธารณรัฐประชาชนจีน"
 china.200.d: "หลังจากแยกตัวจากกกมินตั๋งฝายชาตินิยมเพื่อปลดปลอยประชาชน บัดนี้เราตองรวมกําลังกับสาธารณรัฐประชาชนจีนที่มีอยูแลว เพื่อไมใหขบวนการแตกแยก ศัตรูของจีนพึ่งพาการแตกแยกภายในของเราเพื่อบั่นทอนเรามาตลอด รัฐสังคมนิยมใหมจะไมทําผิดพลาดเชนนั้นอีก!"
 china.200.a: "เมื่อรวมเปนหนึ่ง เราจะเอาชนะพวกชาตินิยม!"
 china.201.t: "นักปฏิวัติคอมมิวนิสตเขารวมสาธารณรัฐ"
 china.201.d: "หลังหลุดพนจากการควบคุมของฝายชาตินิยม นักปฏิวัติชาวจีนที่เห็นอกเห็นใจอุดมการณของเราไดตัดสินใจรวมรัฐของตนเขากับรัฐของเราภายใตการนําของ[Root.GetLeader] นับแตนี้ไป จะมีสาธารณรัฐประชาชนจีนเพียงหนึ่งเดียวที่เปนปกแผน"
 china.201.a: "เราตองรวมกันเพื่อปกปองสหายของเรา!"
 china.202.t: "การลุกฮือของคอมมิวนิสตใน[CHI_communist_state.GetName]"
 china.202.d: "แรงสนับสนุนคอมมิวนิสตที่เพิ่มขึ้นใน[CHI_communist_state.GetName]มาถึงจุดแตกหัก สถานที่ราชการถูกบุกยึด และกลุมกบฏประกาศวาไมถือวาตนเปนสวนหนึ่งของ[Root.GetName]อีกตอไป เราสูญเสียการควบคุม[CHI_communist_state.GetName]ทั้งหมดใหแกระบอบคอมมิวนิสตแลว"
 china.202.a: "เราตองปราบภัยคอมมิวนิสตนี้!"
 china.203.t: "การลุกฮือของคอมมิวนิสตใน[CHI_communist_state.GetName]"
 china.203.d: "หลังหลุดพนจากการควบคุมของฝายชาตินิยม นักปฏิวัติชาวจีนที่เห็นอกเห็นใจอุดมการณของเราไดตัดสินใจรวมรัฐของตนเขากับรัฐของเราภายใตการนําของ[Root.GetLeader] นับแตนี้ไป จะมี[Root.GetName]เพียงหนึ่งเดียวที่เปนปกแผน"
 china.203.a: "เรายินดีตอนรับพี่นองคอมมิวนิสตของเรา!"
 china.204.t: "เมืองหลวงแหง[Root.GetAdjective]"
 china.204.d: "เมื่อสงครามกลางเมืองจีนสิ้นสุดลง ถึงเวลาที่เราจะรวบอํานาจในจีน และแสดงใหประชาชนเห็นวาเราคือการกลับชาติมาเกิดในยุคใหมของอาณาจักรกลาง เราคือรัฐที่จะนําพวกเขาสูอนาคต\n\nดวยเหตุนี้ เราควรมีเมืองหลวงที่สมกับรัฐอันยิ่งใหญของเรา"
 china.204.a: "เราจะปกครองจากนครหลวงฝายเหนือแหงเดิม"
 china.204.b: "เราจะปกครองจากนครหลวงฝายใตแหงเดิม"
 china.204.c: "ไมจําเปนตองยายที่ตั้งรัฐบาล"
 CHI_nanjing_tt: "ยายเมืองหลวงไปที่§Yหนานจิง§!"
 CHI_no_united_front: "จะไมมีความรวมมือตอตานภัยคุกคามจากภายนอก"
 spanish_civil_war: "สงครามกลางเมืองสเปนเริ่มตนขึ้นแลว"
 spain.1.t: "สงครามกลางเมือง!"
 spain.1.d: "กลุมนายพลผูทรงอิทธิพลในกองทัพไดออกแถลงการณประณามรัฐบาลสเปนชุดปจจุบัน! พวกเขากอรัฐประหารฝายขวาโดยไดรับการสนับสนุนจากกลุมนิยมเจาหัวอนุรักษและนักบวช กองทัพสวนสําคัญเขาขางฝายชาตินิยมเหลานี้ แตจนถึงขณะนี้พวกเขายังยึดเมืองใหญของสเปนไมไดเลย ยกเวนเซบียา\n\nในขณะเดียวกัน อาสาสมัครฝายซายก็หลั่งไหลมารวมใตธงของรัฐบาลฝายสาธารณรัฐ พรอมสนับสนุนรัฐบาลตอตานกบฏ ผูภักดีเหลานี้อาจไดรับการฝกมาไมดีนัก แตไมมีใครกังขาในความกระตือรือรนของพวกเขาได\n\nแนวรบไดถูกขีดขึ้นแลว เราควรสนับสนุนฝายใด?"
 spain.1.a: "ฝายชาตินิยม!"
 spain.1.b: "ฝายสาธารณรัฐ!"
 spain.10.d: "หลังการเลือกตั้งอยางสันติที่ทําใหนายพลฟรันซิสโก ฟรังโก ขึ้นเปนประธานาธิบดีแหงสเปน ก็เกิดความหวังวาการลุกฮืออันรุนแรงและความวุนวายทางการเมืองในชวงหลายปที่ผานมาจะยุติลง ขาวลือวาฟรังโกจะพยายามสถาปนาเผด็จการพรรคเดียวโดยมีตนเปนประมุขแหงรัฐ ถูกโหมกระพือดวยการหายตัวไปอยางกะทันหันของผูนําฝายคานหลายคน\nหลังการพิจารณาคดีอยางรวดเร็ว โฆเซ กาลันฟอร นายทหารหนวยการาบิเนโรส ถูกตัดสินวามีความผิดฐานกบฏ และถูกประหารชีวิตตอหนาสาธารณชนในเวลาตอมาไมนาน แมจะตั้งใจใหเปนการดับเจตจํานงที่จะตอตานการผงาดขึ้นของสเปนฝายชาตินิยม แตกลับไดผลตรงกันขาม อาสาสมัครฝายซายและแมแตนายพลกลุมหนึ่งไดหลั่งไหลมารวมใตธงของกองทัพประชาชนที่เพิ่งกอตั้ง พรอมสนับสนุนการตอสูกับฝายชาตินิยมผูกดขี่ แมสวนใหญจะไดรับการฝกมาไมดีนัก แตพวกเขาก็ยึดเมืองสําคัญไดหลายเมืองทามกลางความโกลาหลหลังการลุกฮือ\n\nแนวรบไดถูกขีดขึ้นแลว เราควรสนับสนุนฝายใด?"
 spain.10.b: "กองทัพประชาชน!"
 nationalists_chosen: "พวกแดงจงพินาศ!\n"
 republicans_chosen: "พวกฟาลังเฆจงพินาศ!\n"
 spain.2.t: "แสวงหาการสนับสนุนจากนานาชาติ?"
 spain.2.d: "รัฐประหารครั้งนี้ไมไดสําเร็จอยางสมบูรณ แตกลุมคารลิสต ฟาลังเฆ และสมาพันธฝายขวาปกครองตนเอง ก็สามารถระดมกองทัพสวนใหญเพื่อโคนลมสาธารณรัฐ ซึ่งปลอยใหชาติคริสเตียนอันภาคภูมิของเราลมสลายเขาสูอนาธิปไตยมานานเกินไปแลว ผลลัพธยังไมแนนอน ขณะที่ทั้งโลกจับตาดวยความกังวลวาฝายใดจะเปนผูชนะ\n\nอยางไรก็ตาม เราไมไดกอรัฐประหารนี้ดวยการนิ่งเฉย และโลกก็ไมควรนิ่งเฉยเชนกันหากตองการบดขยี้ภัยแดง ชาติอื่นๆ ที่อยูในกระบวนการฟนฟูความรุงโรจนของชาติเชนเดียวกันนาจะยินดีเขามาชวยเหลือเรา"
 spain.2.a: "ขอยุทโธปกรณและกระสุนกันเถอะ"
 spain.2.b: "สเปนตองไดมาดวยเลือดของชาวสเปน!"
 spain.3.d: "กองกําลังฝายปฏิกิริยาและฟาสซิสตในกองทัพพยายามบดขยี้สาธารณรัฐดวยการโจมตีครั้งเดียว แตไมคาดคิดวาจะเจอการตอตานในเมืองใหญ และการระดมกองกําลังอาสากรรมกรอยางรวดเร็ว แทนที่จะเปนรัฐประหาร พวกเขากลับเริ่มสงคราม สงครามตอความกาวหนาและอนาคตที่ชาวสเปนปรารถนา\n\nทั้งชาติประชาธิปไตยและสังคมนิยมตางแสดงการสนับสนุนสาธารณรัฐ แตมีนอยรายที่กลาเขามาเกี่ยวของโดยตรง เราอาจขอใหพวกเขาสนับสนุนความพยายามของเรา มิฉะนั้นผูกดขี่จะมาเอาเสรีภาพและความเปนปกแผนของพวกเขาเปนรายตอไป"
 spain.3.a: "นี่คือการตอสูระดับนานาชาติเพื่อสกัดกั้นลัทธิฟาสซิสต!"
 spain.3.b: "เราจะไมยอมเปนหุนเชิดของรัฐกรรมกรที่เสื่อมทราม!"
 spain.4.t: "สเปนฝายชาตินิยมตองการความชวยเหลือจากเรา"
 spain.4.d: "สงครามกลางเมืองสเปนกลายเปนภาพจําลองขนาดยอของมุมมองที่เรามีตอสถานการณโลก นั่นคือพวกคอมมิวนิสตและเสรีนิยมพยายามทําลายคุณคาดั้งเดิม และเราจับอาวุธขึ้นมาเพื่อฟนฟูมัน จึงไมนาแปลกใจที่ฝายชาตินิยมในสเปนไดติดตอเราและชาติอื่นๆ ใหชวยติดอาวุธสําหรับความขัดแยงที่กําลังจะมาถึง"
 spain.4.a: "เราสัญญาวาจะสงเทาที่ทําได"
 spain.4.b: "หากพวกเขาไมมีกําลังพอจะยึดอํานาจ พวกเขาก็ไมสมควรไดมันไป"
 spain.5.t: "สเปนฝายสาธารณรัฐตองการความชวยเหลือจากเรา"
 spain.5.d: "ความพยายามโคนลมสาธารณรัฐสเปนที่สองเปนสัญญาณชัดเจนวาพวกฟาสซิสตจะไมยอมใหดอกไมแหงความกาวหนาเติบโต แมในที่ที่มันหยั่งรากลงตามธรรมชาติ ฝายสาธารณรัฐและพันธมิตร ซึ่งเปนการผสมผสานของนักประชาธิปไตย คอมมิวนิสต และอนาธิปไตย ไดหันมาขอความชวยเหลือจากเราและประชาคมระหวางประเทศสวนอื่นๆ หลายชาติที่อางวาปกปองประชาธิปไตยและเสรีภาพกลับระงับการสนับสนุนเพราะกลัวจะถูกลากเขาสูสงคราม เราจะตอบสนองอยางไร?"
 spain.5.a: "สัญญาวาจะสงอาวุธและยุทโธปกรณให"
 spain.4.a.tt: "[From.GetName]จะซาบซึ้งใจหากเราจัดการใหยืม-เชาระหวางสงคราม"
 spain.5.b: "นาเสียดาย เราไมอาจเขาแทรกแซงได"
 spain.6.t: "สเปนฝายชาตินิยมซาบซึ้งในความชวยเหลือของเรา"
 spain.6.d: "การใหยืม-เชาของเราแกสเปนฝายชาตินิยมไมไดถูกมองขาม หากพวกเขาไดรับชัยชนะ เราอาจไดพันธมิตรที่แข็งแกรงเมื่อสเปนฟนฟูขึ้นใหม"
 spain.6.a: "หวังวาพวกเขาจะสกัดกั้นภัยแดงได"
 spain.7.t: "สเปนฝายสาธารณรัฐซาบซึ้งในความชวยเหลือของเรา"
 spain.7.d: "การใหยืม-เชาของเราแกสเปนฝายสาธารณรัฐไมไดถูกมองขาม หากสาธารณรัฐไดรับการฟนฟู เราเชื่อไดวาพวกเขาจะสนับสนุนความพยายามของเราในการกวาดลางพวกสวะฟาสซิสตใหหมดไปจากโลก"
 spain.7.a: "สาธารณรัฐจงเจริญ!"
 spain.8.t: "ทวงคืนมาดริด"
 spain.8.d: "เราชนะสงครามแลว มาดริดกลับมาเปนของเราอีกครั้ง และเรามีโอกาสทําใหนครเกาแกแหงนี้เปนศูนยกลางของสเปนอีกครั้ง เมืองนี้ผานการรบมามากและจําเปนตองฟนฟู จะมีวิธีใดดีไปกวาการตั้งใหเปนเมืองหลวงของเรา?"
 spain.8.a: "ยายเมืองหลวงไปที่มาดริด"
 spain.8.b: "คงที่ตั้งปจจุบันไว"
 spain.9.t: "การเลือกตั้งสเปน ค.ศ. 1936"
 spain.9.d: "สาธารณรัฐที่สองพิสูจนแลววาเปราะบาง [Root.GetLeader]สามารถเปนประธานาธิบดีไดดวยการหนุนหลังของแนวรวมประชาชน ซึ่งเปนแนวรวมกวางขวางของกลุมฝายซายที่ไดรับการสนับสนุนจากฝายสาธารณรัฐ คอมมิวนิสต และอนาธิปไตย\n\nแตฝายคานฝายขวา ซึ่งรวมถึงกลุมอนุรักษนิยม นิยมเจา และฟาสซิสต ก็เริ่มรวมตัวกันเพื่อโคนแนวรวมประชาชนเชนกัน ไมวาแนวรวมฝายใดแตกแยก ฝายตรงขามก็นาจะฉวยโอกาสจากความขัดแยงภายในเพื่อกอการปฏิวัติ การเลือกตั้งครั้งนี้ไมใชบททดสอบสุดทายที่สเปนตองเผชิญเพื่อยุติความขัดแยงนี้"
 spain.9.a: "รักษาแนวรวมประชาชนไว"
 spain.9.b: "รวมกลุมอนุรักษนิยมภายใตฟาลังเฆ"
 italy.9.t: "ขอหมูเกาะแบลีแอริกจากสเปน"
 italy.9.d: "ระหวางสงครามกลางเมือง อิตาลีสงอาสาสมัครไปสูรบเพื่อฝายชาตินิยม แมแรงจูงใจทางอุดมการณจะสําคัญที่สุด แตอิตาลีก็มีผลประโยชนทางยุทธศาสตรในผลลัพธดวย การปองกันหมูเกาะแบลีแอริก โดยเฉพาะมายอรกา เปนที่สนใจเปนพิเศษของอิตาลี เนื่องจากที่ตั้งในทะเลเมดิเตอรเรเนียน โดยเฉพาะเมื่อพิจารณาเทียบกับอาณานิคมของยุโรปตะวันตก\n\nบัดนี้[From.GetLeader]เสนอใหโอนหมูเกาะเหลานี้ไปอยูใตการควบคุมของอิตาลีอยางถาวร เมื่อพิจารณาถึงสวนที่พวกเขามีตอชัยชนะของเรา ขอเสนอนี้ก็อาจมีขอดีอยูบาง"
 italy.9.a: "ใหอิตาลีเก็บสิ่งที่พวกเขาปกปองไว"
 italy.9.b: "เราไมไดชนะสงครามนี้มาเพื่อกมหัวใหขอเรียกรองของตางชาติ!"
 italy.10.t: "สเปนยอมยกหมูเกาะแบลีแอริก"
 italy.10.d: "ดวยความซาบซึ้งในการสนับสนุนและการปกปองอุดมการณฟาสซิสตของเราระหวางสงครามกลางเมืองสเปน [From.GetLeader]จึงตกลงใหที่ตั้งทางทหารชั่วคราวของเราบนเกาะมายอรกา มินอรกา และอิบิซา กลายเปนของถาวร แมหมูเกาะเหลานี้ซึ่งมีที่ตั้งทางยุทธศาสตรสําคัญจะเปนสวนเสริมที่นายินดีของจักรวรรดิเรา แตดูเหมือนชาวสเปนจะถือวาหนี้นี้ไดชดใชหมดแลว"
 italy.10.a: "ตราบใดที่พวกเขายอมรับวาเราเปนเจาของโดยชอบธรรม"
 italy.11.t: "สเปนปฏิเสธที่จะยกหมูเกาะ"
 italy.11.d: "แมเราจะชวยเหลือพวกเขาในสงครามกลางเมือง แตบัดนี้[From.GetLeader]กลับปฏิเสธที่จะมอบหมูเกาะแบลีแอริกใหเรา ทั้งที่เพื่อนรวมชาติของเราไดสูรบเพื่อปกปองมัน แมพวกเขาจะยืนยันวาตองการรักษาความสัมพันธอันดีกับชาติของเรา แตการบังคับใหเราถอนที่ตั้งทางทหารซึ่งทําใหหมูเกาะเหลานี้ยังเปนของสเปนตั้งแตแรก ถือเปนการหยามเกียรติที่เราจะไมลืม"
 italy.11.a: "หากจําเปน เราอาจอางสิทธิ์เหนือมันอยูดี"
 italy.12.t: "การประชุมลอนดอน"
 italy.12.d: "มิตรของเราในยูโกสลาเวียกําลังถูกกดดันจากเพื่อนบานทางเหนือของเรา มหาอํานาจตะวันตกที่ฉอฉลและเสื่อมทรามไดแสดงใหเห็นแลววาเหตุใดพวกเขาจึงกําลังเสื่อมถอย ดวยการไมยอมยืนหยัดปกปองสิทธิของยูโกสลาเวีย นี่อาจเปนชองทางสําหรับมหาอํานาจที่อายุนอยกวาและมีพลวัตมากกวา ซึ่งมีผูนําที่เหมาะสม ใหกาวเดินอยางมีเปาหมายบนเวทีโลก! กองบัญชาการสูงสุดรายงานวาใกลพรอมแลวที่จะปลอยกองทหารอันไรเทียมทานของเราออกไป"
 italy.12.a: "นี่คือเวลาของเรา!"
 italy.12.b: "จะมีโอกาสที่ดีกวานี้"
 italy.13.t: "คําชี้ขาดลูบลิยานาครั้งที่หนึ่ง"
 italy.13.d_dalmatia_montenegro: "เมื่อรัฐยูโกสลาเวียลมสลายเพราะความขัดแยงในตัวเอง ก็ถึงเวลาที่อิตาลีจะไดรับสิ่งที่ควรได มหาอํานาจตะวันตกที่กําลังเสื่อมถอยอาจกลัวอิตาลีจนไมยอมใหสิ่งที่เธอควรได แตมหาอํานาจใหมที่กําลังผงาดขึ้นมองเห็นคุณคาที่แทจริงของอิตาลี เราไมเพียงไดรับสิ่งที่ถูกปฏิเสธในชัยชนะที่ถูกตัดทอน แตดินแดนในอารักขาของเราอยางแอลเบเนียก็ขยายตัวดวย"
 italy.13.d_montenegro: "การตัดสินใจเขาขางมหาอํานาจที่กําลังผงาดอยางเยอรมนีไดผลตอบแทนแลว รัฐยูโกสลาเวียกําลังมุงสูการแตกสลาย และผูนําเยอรมันมีวิสัยทัศนพอจะเห็นประโยชนของมิตรภาพกับอิตาลี มอนเตเนโกรจะถูกสงมอบใหแอลเบเนียตามที่สมควร"
 italy.13.d_dalmatia: "หลังถูกอดีตพันธมิตรทางตะวันตกทรยศในการประชุมสันติภาพปารีส ซึ่งเราไดรับสัญญาวาจะไดดัลเมเชียตอนเหนือ เราจึงเลือกเขาขางเบอรลิน เยอรมนีตัดสินอยางชาญฉลาดวามิตรภาพกับอิตาลีมีคาเกินกวาจะมองขาม และการอางสิทธิ์ของเราในยูโกสลาเวียจะไดรับการยอมรับ ทะเลเอเดรียติกจะเปนทะเลสาบของอิตาลี และความยุติธรรมจะเกิดขึ้น"
 italy.13.a: "อิตาลีผงาด"
 italy.14.t: "เยอรมนีขัดขวางขอเรียกรองของเรา"
 italy.14.d: "เยอรมนีเห็นควรขัดขวางขอเรียกรองอันพอประมาณ ยุติธรรม และสมเหตุสมผลของเราตอดินแดนวิชี เราควรออกจาก[From.GetFactionName]หรือไม?"
 italy.14.a: "รับไมได เราไปเองไดดีกวา"
 italy.14.b: "เราจะไดรับความเคารพจากพวกเขา"
 italy.15.t: "เยอรมนีสนับสนุนขอเรียกรองของเรา"
 italy.15.d: "เยอรมนีเห็นถึงความชาญฉลาดในการสนับสนุนขอเรียกรองของเราตอดินแดนวิชี วิชีไดยกซาวอยและคอรซิกาใหเราแลว"
 italy.15.d_Corsica: "ดวยการสนับสนุนเพียงเล็กนอยจากเยอรมนี วิชีไดยกคอรซิกาใหเราแลว"
 italy.15.a: "การแกแคนเพื่ออิตาลี"
 italy.16.t: "เยอรมนีเกือบจะสนับสนุนเรา"
 italy.16.d: "เยอรมนีเห็นควรเขามายุงในขอพิพาทระหวางเรากับฝรั่งเศสวิชี พวกเขาขัดขวางความพยายามของเราที่จะไดคอรซิกา แตเรายังไดซาวอย"
 italy.16.a: "ปญหาคอรซิกาแคถูกเลื่อนออกไปเทานั้น"
 france.1.t: "ญี่ปุนเรียกรองอินโดจีน"
 france.1.d: "กองกําลังญี่ปุนวางกําลังอยูตามแนวชายแดนอาณานิคมอินโดจีนของเรา และเรียกรองสิทธิ์เขาถึงฐานทัพและสิ่งอํานวยความสะดวกของเราทั้งหมด! หากเรายอมตามคําขอ ก็เทากับยกการควบคุมอินโดจีนใหพวกเขา ในทางกลับกัน เราก็ไมมีกําลังพอจะสูกับพวกเขาในเรื่องนี้"
 france.1.a: "เราไมมีทางเลือกนอกจากยอมตกลง"
 france.1.b: "ไมมีวัน!"
 france.2.t: "การขยายแนวมาฌีโน"
 france.2.d: "แผนการขยายแนวมาฌีโนไปจนถึงชองแคบอังกฤษเสร็จสมบูรณแลว และไดออกคําสั่งกอสรางแลว เบลเยียมไดยื่นประทวงอยางเปนทางการหลังเห็นการเตรียมการของเราจากอีกฟากชายแดน แตงานยังคงดําเนินตอไป"
 france.2.a: "บางทีพวกเขาไมควรออกจากพันธมิตรของเรา"
 france.3.t: "การขยายแนวอัลไพน"
 france.3.d: "เราเริ่มงานปรับปรุงปอมปราการของแนวอัลไพนแลว เมื่อแนวปองกันใหมเหลานี้เสร็จสมบูรณ อิตาลีคงตองบาแนถาจะขามพรมแดนมา!"
 france.3.a: "ใหพวกมันมาเลย!"
 france.10.t: "ความพายแพ"
 france.10.d: "เราแพการรบแลว ปารีสตกอยูในมือเยอรมัน และเปนเพียงเรื่องของเวลากอนที่สวนที่เหลือของประเทศจะถูกยึดครอง บัดนี้เราตองคิดถึงอนาคต บางสวนในรัฐบาลตองการสงบศึกกับเยอรมนี แตนายทหารจํานวนมากตองการสูตอจากอังกฤษ\n\nสมาชิกบางคนของคณะรัฐมนตรีสงครามอังกฤษเสนออีกทางเลือกหนึ่ง นั่นคือการรวมฝรั่งเศสและบริเตนใหญเปนชาติเดียว ซึ่งจะสูตอไปจนกวาฝรั่งเศสทั้งหมดจะไดรับการปลดปลอย"
 france.10.a: "เราตองรวมมือกับเยอรมัน"
 france.10.a_tt: "§Yเลนเปนฝรั่งเศสวิชีหากเยอรมนียอมสงบศึก§!\n"
 france.10.b: "การตอสูยังดําเนินตอไป!"
 france.10.b_tt: "§Yเลนเปนฝรั่งเศสหากเยอรมนียอมสงบศึก§!\n"
 france.10.c: "รวมชาติกับอังกฤษกันเถอะ!"
 france.11.t: "ฝรั่งเศสเสนอการรวมชาติ"
 france.11.d: "สถานการณในฝรั่งเศสเลวรายยิ่ง หลายคนในรัฐบาลของพวกเขาตองการสงบศึกกับเยอรมนี แตบางสวนตอบรับขอเสนอของสมาชิกคณะรัฐมนตรีสงครามอังกฤษที่จะรวมสองชาติของเราเปนหนึ่งเดียว สหภาพฝรั่งเศส-อังกฤษนี้จะสูรบกับเยอรมันตอไปจนกวาจะไดชัยชนะ เราควรตอบสนองอยางไร?"
 france.11.a: "ไม อังกฤษก็คืออังกฤษ ฝรั่งเศสก็คือฝรั่งเศส"
 france.11.b: "ได ถานั่นจะทําใหชาวฝรั่งเศสสูตอไป!"
 france.12.t: "อังกฤษตกลงรวมชาติ"
 france.12.d: "อังกฤษตกลงรวมสองชาติของเราเปนหนึ่งเดียวแลว ขณะนี้กําลังมีการจัดตั้งรัฐบาลรวมชุดใหมในลอนดอน"
 france.12.a: "สูลอนดอน!"
 FRA_franco_british_cores: "§Yดินแดนหลักของ[FRA.GetAdjective]§!ทั้งหมดจะกลายเปน§Yดินแดนหลักของ[ENG.GetAdjective]§!"
 france.13.t: "อังกฤษปฏิเสธการรวมชาติ"
 france.13.d: "รัฐบาลอังกฤษปดตกความเปนไปไดใดๆ ที่จะรวมสองชาติของเราเปนหนึ่งเดียว ถึงตอนนี้การสงบศึกกับเยอรมนีเปนสิ่งที่เลี่ยงไมได"
 france.13.a: "เราตองรวมมือ"
 france.13.b: "เราตองสูตอไป!"
 france.14.t: "ชัยชนะในฝรั่งเศส"
 france.14.d: "ชัยชนะของเราในฝรั่งเศสเกือบสมบูรณแลว รัฐบาลฝรั่งเศสไดขอสงบศึก และนักการทูตของเราไดเตรียมเงื่อนไขที่พวกเขายอมรับแลว พวกเขาจะยังคงควบคุมฝรั่งเศสตอนใต ขณะที่เรามีอิสระที่จะยึดครองสวนที่เหลือ"
 france.14.a: "จัดตั้งฝรั่งเศสวิชี"
 establishing_vichy_tt: "§Yฝรั่งเศสวิชี§!จะถูกจัดตั้งขึ้นในฝรั่งเศสตอนใต \n§Yฝรั่งเศสวิชี§!จะไดรับ§Yดินแดนอาณานิคมของฝรั่งเศส§!ทั้งหมด\nกองกําลัง§Yฝรั่งเศส§!สวนหนึ่งจะถูกโอนให§Yฝรั่งเศสวิชี§!\n(§Yฝรั่งเศสวิชี§!):\n §Yขบวนการฟรังซิสต§!กลายเปนพรรครัฐบาล\n §Yฟลิปป เปแตง§!กลายเปนผูนําของพรรค§Yฟาสซิสต§!\n ไดรับจิตวิญญาณแหงชาติ§Yคาใชจายการยึดครอง§! ซึ่งให (โรงงานสินคาอุปโภคบริโภค: §Y20%§!)\n ยายเมืองหลวงไปที่§Yโอแวรญ§!"
 france.14.b: "ไม เยอรมนีจะพิชิตทั้งหมด!"
 france.14.c: "จัดตั้งฝรั่งเศสราชวงศบูรบง"
 france.15.t: "เยอรมนีปฏิเสธการสงบศึก!"
 france.15.d: "เยอรมันปฏิเสธคําขอสงบศึกของเรา! เห็นไดชัดวาพวกเขาตองการกดขี่เราทุกคนเปนทาส... เราไมมีทางเลือกนอกจากสูจนถึงที่สุด!"
 france.15.a: "เราจบสิ้นแลว!"
 france.16.t: "อยูดวยกัน เขมแข็งไว!"
 france.16.d: "เหตุการณลาสุดในปารีสสงผลกระทบตอพวกเราสวนใหญ จึงสําคัญยิ่งกวาที่เคยที่เราจะรวมใจกันเปนชาติเดียว เราตองมองสภาพของประเทศเรา และไมยอมรับ แตตองเปลี่ยนผลลัพธของสงครามครั้งนี้ \n\nลืมอดีตเสีย แลวมองไปยังขอบฟาใหม เราไมรูวาจะเจออะไรในอีกหลายเดือนขางหนา แตเราจะเผชิญมันไปดวยกัน!"
 france.16.a: "เราเคยเจอที่แยกวานี้มาแลว!"
 france.17.t: "คําเชิญเขารวมฝายของฝรั่งเศส"
 france.17.d: "ในความพยายามเสริมความแข็งแกรงใหความตกลงไตรมิตรนอย ไดแก เชโกสโลวาเกีย ยูโกสลาเวีย และโรมาเนีย และสกัดกั้นการฟนคืนของลัทธิขยายดินแดนอยางกาวราวของอดีตฝายมหาอํานาจกลาง ฝรั่งเศสไดขอใหเราเขารวมพันธมิตรที่มุงรวมชาติเหลานี้เขาดวยกัน"
 france.17.a: "ยินดียิ่ง ความตกลงไตรมิตรนอยจําเปนตองไดรับการฟนฟู"
 france.17.b: "[Root.GetName]จะเดินบนเสนทางของตนเอง"
 france.18.t: "[From.GetName]เขารวมฝายของฝรั่งเศส"
 france.18.d: "แผนของเราที่จะหยุดยั้งพันธมิตรความตกลงไตรมิตรนอยไมใหแตกสลายและหางเหินจากเรากําลังคืบหนา [From.GetLeader]เห็นชอบกับความพยายามของเรา และตอบรับคําเชิญเขารวมพันธมิตรแลว"
 france.18.a: "เราเขาใกลการฟนฟูความตกลงไตรมิตรนอยไปอีกกาวหนึ่ง"
 france.19.t: "[From.GetName]ปฏิเสธพันธมิตรกับฝรั่งเศส"
 france.19.d: "แมเราจะพยายามอยางเต็มที่ในการเสนอการสนับสนุนแกความตกลงไตรมิตรนอย แตความพยายามลาสุดในการติดตอหนึ่งในชาติเหลานั้นกลับเจอความกังขา [From.GetLeader]ปฏิเสธที่จะเขารวมพันธมิตร บางทีอาจสงสัยในเจตนาของเรา หรืออาจกังวลวาการผูกมิตรกับเราใกลชิดเกินไปจะทําใหตนกลายเปนเปาหมาย"
 france.19.a: "ใครจะรู พวกเขาอาจเปนเปาหมายอยูแลวก็ได!"
 france.20.t: "การตอตานการสงบศึก"
 france.20.d: "หลังการสงบศึกระหวางฝรั่งเศสกับเยอรมนี และการจัดตั้งรัฐบาลใหมในฝรั่งเศสวิชี กลุมนายทหารระดับสูงไดกอกบฏตอรัฐบาลฝรั่งเศสชุดใหม ชารล เดอ โกล ไดออกอากาศทางวิทยุเรียกรองใหตอตานระบอบวิชีที่รวมมือกับศัตรู เดอ โกลไดขึ้นเปนผูนํากองกําลังฝรั่งเศสเสรีโดยพฤตินัย และสูรบกับเยอรมันตอไป"
 france.20.a: "การตอสูเพื่อฝรั่งเศสยังดําเนินตอไป"
 france.20.a_tt: "§Yชารล เดอ โกล กลายเปนผูนําของฝรั่งเศส§!"
 france.21.t: "กรรมกรขูนัดหยุดงาน"
 france.21.d: "หลังการไลคนงานสองคนออกจากโรงงานขนาดใหญแหงหนึ่ง การตอสูระหวางกรรมกรกับเจาของโรงงานก็ปะทุขึ้นทั่วประเทศ กรรมกรที่ไดรับการหนุนหลังจาก[Root.GetCommunistParty]ไดรวมตัวกันและเรียกรองสภาพการทํางานที่ดีขึ้น เชน คาแรงที่สูงขึ้นและสัปดาหการทํางานที่สั้นลง สิ่งนี้จะลดผลผลิตของโรงงานเราลงอยางมาก และถูกมองวาเปนชัยชนะของ[Root.GetCommunistParty] เราไดรับเชิญไปเจรจาที่มาติญง เราจะยอมตามขอเรียกรองของพวกเขา หรือยืนหยัดและเสี่ยงตอการนัดหยุดงานทั่วประเทศ?"
 france.21.a: "ปลอยใหพวกเขานัดหยุดงานไป"
 france.21.b: "เจรจาหาขอตกลง"
 france.22.t: "ทบทวนขอตกลงมาติญง"
 france.22.d: "ดวยขอตกลงมาติญงที่เพิ่งลงนามไป อุตสาหกรรมของเราไมมีทางแขงขันกับเยอรมันได เรากําลังตามหลังดานกําลังการผลิตมากขึ้นทุกวัน เจาของโรงงานบางรายเริ่มเจรจาสิทธิบางประการที่ไดใหไวในขอตกลงมาติญงใหมแลว โดยแทบไมมีการตอตานจากกรรมกรเลย เรามีโอกาสที่จะเพิกถอนสิทธิกรรมกรที่เพิ่งไดมาอยางเปนทางการทั่วประเทศ แตเสี่ยงที่พวกเขาจะหันไปรวมตัวสนับสนุน[Root.GetCommunistParty]อีกครั้ง ดวยหวังวาจะหนุนการนัดหยุดงานอีกรอบ การปลอยใหกรรมกรคงสิทธิของตนไวและมุงปรับปรุงกระบวนการทํางานในปจจุบันใหมีประสิทธิภาพ อาจชวยใหชาวฝรั่งเศสกลับมาเปนหนึ่งเดียวและเติบโตไปดวยกัน"
 france.22.a: "เมื่อเวลาผานไป เราจะมีประสิทธิภาพเหมือนเดิม"
 france.22.b: "เพิกถอนสิทธิของพวกเขาและนําอุตสาหกรรมกลับเขาที่ทันที"
 france.23.t: "การนัดหยุดงานสิ้นสุดลง"
 france.23.d: "บัดนี้กรรมกรสวนใหญตระหนักแลววาขอเรียกรองอันไมสมเหตุสมผลของพวกเขาจะไมไดรับการตอบสนอง ลูกๆ ของพวกเขาอดอยาก และแม[Root.GetCommunistParty]จะเรงเราใหนัดหยุดงานตอไป แตพวกเขาก็ไมมีทรัพยากรพอจะทําตอ ทุกวันที่ผานไป กรรมกรตางยอมแพและกลับเขาโรงงาน อุตสาหกรรมของเราจะกลับมาเต็มกําลัง และไมนาจะมีการนัดหยุดงานอีกในเร็วๆ นี้"
 france.23.a: "ในที่สุดเราก็แขงขันไดอีกครั้ง"
 france.24.t: "ภัยคุกคามคอมมิวนิสต"
 france.24.d: "ภัยคุกคามจากเยอรมนีและโซเวียตที่รวมมือกันนั้นใหญหลวงเกินกวาจะมองขาม หลังจากทั้งสองประเทศตกลงแบงแยกโปแลนด เราตองตัดสินใจในเรื่องที่ยากลําบาก หากเราปลอยให[Root.GetCommunistParty]ดําเนินการเหมือนที่ผานมา เราจะเปดทางใหเกิดความขัดแยงภายในขณะที่โซเวียตทรงอํานาจมากขึ้น การหามกิจกรรมคอมมิวนิสตหรือการเกี่ยวของใดๆ กับ[Root.GetCommunistParty] จะเปนสัญญาณอันทรงพลังถึงพลเมืองทุกคนวาเราจะไมยอมใหผูใดที่เปนภัยตอสันติภาพ \nตามธรรมเนียม เราเคยให[Root.GetCommunistParty]มีสวนรวมในการอภิปรายทางการเมืองได แตเมื่อพวกเขาปฏิเสธที่จะเลิกภักดีตอมอสโก อาจถึงเวลาใชมาตรการเด็ดขาดแลว"
 france.24.a: "ประกาศใหลัทธิคอมมิวนิสตในฝรั่งเศสผิดกฎหมาย"
 france.24.b: "ความเห็นตางเปนสวนหนึ่งของกระบวนการประชาธิปไตย"
 france.25.t: "การประชุมลอนดอน"
 france.25.d: "เมื่อระบอบในเบอรลินโหมความตึงเครียดเรื่องพรมแดนระหวางพวกเขากับยูโกสลาเวีย อังกฤษเลือกที่จะยอมถอย อยางไรก็ตาม ยูโกสลาเวียเปนหนึ่งในสามเสาหลักที่คํ้าจุนระเบียบในยุโรปตะวันออก หากเสานี้ออนแอลง ความมั่นคงของฝรั่งเศสก็จะไดรับผลกระทบ เราควรพิสูจนวาเราเปนมหาอํานาจที่ยิ่งใหญกวา และเสี่ยงสูเพียงลําพังหรือไม?"
 france.25.a: "เราจะรักษาสันติภาพ"
 france.25.b: "เราจะยืนหยัดเพื่อเสรีภาพ"
 france.26.t: "การประชุมลอนดอน"
 france.26.d: "เมื่อระบอบในเบอรลินโหมความตึงเครียดเรื่องพรมแดนระหวางพวกเขากับยูโกสลาเวีย อังกฤษตัดสินใจยืนหยัดตอตานการรุกรานของเยอรมนี แตบาดแผลจากสงครามครั้งกอนยังไมหายดี และประเทศของเราก็แตกแยกอยางหนัก เราแข็งแกรงพอจะลุยเพียงลําพังหรือไม?"
 france.26.a: "ถึงเวลายืนหยัดตอกรกับเยอรมันแลว"
 france.26.b: "นี่ไมใชเรื่องที่ควรสู"
 france.27.t: "เยอรมนีหนุนขอเรียกรองของอิตาลี"
 france.27.d_1_state: "เยอรมนียอมตามขอเรียกรองของอิตาลีตอดินแดนของเรา หลังความพายแพ เราไมอยูในสภาพที่จะโตแยงไดเลย"
 france.27.d_both: "อิตาลีจะไดรับทั้งซาวอยและคอรซิกา การตัดสินใจของเยอรมนีครั้งนี้สรางความกังวลใหขาหลวงอาณานิคมทั้งหลายวาใครจะเปนรายตอไป ขาหลวงซีเรียไมรอใหรูคําตอบ และไดแปรพักตรไปเขากับฝรั่งเศสเสรีแลว"
 france.27.a: "เราไมมีทางเลือกจริงๆ"
 france.27.b: "พวกเยอรมันมันโง สายตาสั้น"
 france.28.t: "ซีเรียแปรพักตร"
 france.28.d: "หลังเยอรมนีตัดสินใจมอบดินแดนของวิชีใหอิตาลี ฝายบริหารซีเรียจึงเลือกมาเขาขางเรา"
 france.28.a: "ฝรั่งเศสเขาใกลการกอบกูไปอีกกาว"
 france.29.t: "อังกฤษตอบรับคําขอเปนพันธมิตร"
 france.29.d: "'ประวัติศาสตรไดแสดงใหเห็นแลววาเราจะบรรลุสิ่งตางๆ ไดมากเพียงใดเมื่อชาติอันยิ่งใหญของเรายืนเคียงขางกัน ดวยจิตวิญญาณแหงความตกลงฉันมิตร เราภูมิใจที่จะตอนรับทานไมเพียงในฐานะมิตร แตในฐานะพันธมิตร รวมกัน เราจะเปนประภาคารแหงเสรีภาพที่สองสวางในโลกที่ถูกความมืดมิดแหงการกดขี่รุกลํ้า!'\n\nคําขอเขารวมเปนพันธมิตรกับอังกฤษของเราไดรับการตอบรับแลว เราวางใจไดวาจะไดรับการสนับสนุนเต็มที่จากพวกเขาในชวงเวลาอันปนปวนขางหนา"
 france.29.a: "รวมกัน เราจะยึดแนวไว!"
 france.30.t: "อังกฤษปฏิเสธคําขอเปนพันธมิตร"
 france.30.d: "'แมเราจะมีความสัมพันธอันดีตอกันในอดีต แตเราไมอาจเสี่ยงใหความขัดแยงขามชองแคบลุกลามบานปลาย เยอรมนีไดรับความไววางใจจากเราดวยการปฏิบัติตามความตกลงทางนาวีของเรา และแมเราจะปองกันตนเองหากไฟสงครามลามมา แตเราจะไมเสี่ยงโหมไฟใหลุกโชน สันติภาพตองเปนเปาหมายของชาติประชาธิปไตยทุกชาติเสมอ'\n\nคําขอเขารวมเปนพันธมิตรกับอังกฤษของเราถูกปฏิเสธ รัฐบาลอังกฤษไมเต็มใจจะยั่วยุเยอรมนีเพิ่ม และจะไมทําใหสันติภาพในปจจุบันตกอยูในอันตราย"
 france.30.a: "'สันติภาพ' ของพวกเขาก็แคอีกคําหนึ่งของ 'การยอมจํานน'"
 france.33.title: "การปลดปลอยฝรั่งเศส"
 france.33.desc: "เมื่อสงครามสิ้นสุดลง ความจําเปนที่จะตองคงสหภาพอันใกลชิดกับชาติฝรั่งเศสก็กําลังหมดไปเชนกัน พรรคการเมืองฝรั่งเศสเรียกรองมากขึ้นเรื่อยๆ ใหจัดตั้งรัฐบาลชั่วคราวและจัดการเลือกตั้งทั่วไป"
 france.33.a: "แนนอน พันธมิตรผูมั่นคงของเราเปนประชาชนที่เสรี"
 france.33.b: "เราตองรักษาความมั่นคงอยางเขมงวดบนแผนดินใหญ"
 france.34.title: "สหภาพฝรั่งเศส-อังกฤษสิ้นสุดลง"
 france.34.desc: "เมื่ออังกฤษอยูในภาวะสันติ [From.GetLeader]ไดตกลงตามคําขอของพรรคการเมืองฝรั่งเศสใหฟนฟูรัฐบาลฝรั่งเศสชั่วคราว การรวมกันทางการเมืองไดยุติลง แตไมตองสงสัยวาทั้งสองชาติจะยังคงเปนมิตรใกลชิดกันตอไปในอนาคต"
 france.34.a: "ยอดเยี่ยม!"
 france.34.b: "เขาใจแลว"
 low.1.t: "ฝรั่งเศสขยายแนวมาฌีโน"
 low.1.d: "ฝรั่งเศสตัดสินใจขยายแนวมาฌีโนไปทางตะวันตกจนถึงชองแคบอังกฤษ! นี่แสดงชัดวาพวกเขาตั้งใจจะทอดทิ้งเราหากเยอรมนีบุก สถานทูตของเราในปารีสไดยื่นหนังสือรองเรียนอยางเปนทางการแลว แตก็นาสงสัยวาจะมีผลมากนัก"
 low.1.a: "นี่มันอุกอาจที่สุด!"
 soviet.1.t: "ญี่ปุนเสริมกําลัง"
 soviet.1.d: "สถานการณตามแนวชายแดนแมนจูเรียตึงเครียดมาระยะหนึ่งแลว และบัดนี้เราไดรับรายงานจากสหายชาวมองโกเลียวาญี่ปุนกําลังรวมกําลังพลในเฮยหลงเจียง การถอยอาจถูกมองวาเปนสัญญาณของความออนแอ แตหากเราตอบโตดวยกําลัง สถานการณก็อาจบานปลาย ทานจะสั่งการอยางไร สหายผูบัญชาการ?"
 soviet.1.a: "เราตีโตกลับ อยางหนัก"
 soviet.1.b: "เราไมอาจทําสงครามกับญี่ปุนได"
 soviet.2.t: "การจูโจมสําเร็จ"
 soviet.2.d: "การจูโจมขามชายแดนแมนจูเรียของเราตอกองกําลังญี่ปุนที่รวมพลอยูที่นั่นประสบความสําเร็จ! เราเลนงานพวกเขากอนที่จะเตรียมการเสร็จ และทหารผูกลาของเราไดฟาดพวกเขาจนนวมในการปะทะอันดุเดือดที่ตามมา"
 soviet.2.a: "ทําไดดีมาก!"
 soviet.3.t: "การจูโจมลมเหลว"
 soviet.3.d: "การจูโจมขามชายแดนแมนจูเรียของเราตอกองกําลังญี่ปุนที่รวมพลอยูที่นั่นลมเหลว! ขาศึกตีกระหนาบกองกําลังของเราเปนรูปคีม และเราสูญเสียอยางหนักกวาจะถอนตัวออกมาได"
 soviet.3.a: "เตรียมหนวยยิงเปา"
 soviet.4.t: "[FROM.GetNameDefCap]ยอมยกเบสซาราเบีย"
 soviet.4.d: "ชาว[FROM.GetAdjective]ยอมตามขอเรียกรองของเราอยางชาญฉลาด และถอนกองกําลังทั้งหมดออกจากเบสซาราเบีย เราจะรวมดินแดนนี้เขากับสหภาพในฐานะสาธารณรัฐสังคมนิยมโซเวียตมอลเดเวีย พลเมืองที่นั่นจะไดรับประโยชนจากสังคมนิยมนับแตนี้"
 soviet.4.a: "ยอดเยี่ยม"
 soviet.5.t: "โรมาเนียปฏิเสธขอเรียกรองของเรา"
 soviet.5.d: "ชาวโรมาเนียปฏิเสธที่จะยอมตามขอเรียกรองของเรา! ดูเหมือนเราจะตองใชกําลังขับไลกองกําลังยึดครองของพวกเขาออกจากเบสซาราเบีย"
 soviet.5.a: "โงเขลา!"
 soviet.6.t: "[FROM.GetNameDefCap]ยอมจํานน"
 soviet.6.d: "[FROM.GetNameDefCap]ยอมตามขอเรียกรองของเราแลว เราไดแทนที่รัฐบาลอันเสื่อมทรามในทาลลินนดวยรัฐสภาประชาชน ซึ่งลงมติเปนเอกฉันทใหเปลี่ยน[FROM.GetNameDef]เปนสาธารณรัฐสังคมนิยมโซเวียต หลังการพิจารณา สภาโซเวียตสูงสุดไดตัดสินใจรับคํารองนี้"
 soviet.6.a: "ยินดีตอนรับสูสหภาพ สหายทั้งหลาย"
 soviet.7.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 soviet.7.d: "[FROM.GetNameDefCap]ตัดสินใจปฏิเสธขอเสนออันใจกวางของเราในการทํากติกาสัญญาชวยเหลือซึ่งกันและกันอยางอุกอาจ! พวกนายทุนและพวกประจบสอพลอในทาลลินนยังบังอาจออกแถลงการณเรียกรองใหเราเคารพบูรณภาพแหงดินแดนของชาติพวกเขาอีกดวย!"
 soviet.7.a: "เราตองปกปองชาว[FROM.GetAdjective]จากตัวพวกเขาเอง"
 soviet.8.t: "[FROM.GetNameDefCap]ยอมจํานน"
 soviet.8.d: "รัฐบาล[FROM.GetAdjective]ในริกาตกลงตามขอเรียกรองของเรา และเราไดแทนที่การปกครองอันฉอฉลของพวกเขาดวยสภาประชาชน สภานี้ลงมติเปนเอกฉันทขอเขาเปนสมาชิกสหภาพอันยิ่งใหญของเราในฐานะสาธารณรัฐสังคมนิยมโซเวียต เราไดตกลงตามคํารองนี้อยางเอื้ออารี"
 soviet.8.a: "ตอนนี้พวกคุณเปนสังคมนิยมแลว!"
 soviet.9.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 soviet.9.d: "พวกกระฎมพีผูกดขี่ที่ปกครอง[FROM.GetNameDef]เลือกที่จะทิ้งเหตุผลทั้งหมด พวกเขาปฏิเสธกติกาสัญญาชวยเหลือซึ่งกันและกันอันใจกวางของเรา และเรียกรองใหถอนกองกําลังโซเวียตทั้งหมดที่ 'รวมพล' อยูตามแนวชายแดนของพวกเขาโดยทันที"
 soviet.9.a: "ชาว[FROM.GetAdjective]ตองไดรับการปลดปลอย"
 soviet.10.t: "[FROM.GetNameDefCap]ยอมจํานน"
 soviet.10.d: "คําขอตั้งฐานทัพทหารใน[FROM.GetNameDef]ของเราไดรับอนุมัติ แตนาเสียดายที่รัฐบาลของพวกเขาลมสลาย เราไดจัดตั้งรัฐสภาประชาชนขึ้นเพื่อปองกันอนาธิปไตย และรัฐสภานี้ลงมติเปนเอกฉันทยื่นคํารองตอสภาโซเวียตสูงสุดขอเขาเปนสมาชิกสหภาพของเรา คํารองนี้ไดรับอนุมัติแลว"
 soviet.10.a: "เราจะชวยพวกคุณใหพนจากทุนนิยม"
 soviet.11.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 soviet.11.d: "[FROM.GetNameDefCap]ดูเหมือนตั้งใจจะทําลายตัวเอง และพวกโงเขลาในรัฐบาลของพวกเขาก็ปฏิเสธไมใหกองกําลังของเราเขาประเทศ พวกเขาคิดวาจะอยูใตเยอรมันไดดีกวาหรือ? ผูนําที่เห็นแกตัวของพวกเขากําลังกออาชญากรรมตอประชาชน ดวยการปฏิเสธสังคมนิยมที่แทจริงแกพลเมืองของตน"
 soviet.11.a: "ชาว[FROM.GetAdjective]ทุกขทรมานมามากพอแลว"
 soviet.12.t: "[FROM.GetNameDefCap]ยอมรับขอเรียกรองของเรา"
 soviet.12.d: "กองกําลังมหาศาลที่เรารวมพลไวตามแนวชายแดนของพวกเขาทําใหรัฐบาล[FROM.GetAdjective]ยอมรับคําขออันพอประมาณของเราในการปรับแกพรมแดน เราไดควบคุมคาเรเลียแลว และที่ตั้งของ[195.GetName]ก็ปลอดภัยขึ้นมาก"
 soviet.12.a: "เรานึกวาพวกเขาจะสูเสียอีก..."
 soviet.13.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 soviet.13.d: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเรียกรองของเรา แตนี่ก็เปนสิ่งที่คาดไวแลว หากเราตองการคาเรเลีย เราจะตองใชกําลังยึดมา ถึงเวลาสั่งสอนพวกฟนนหัวดื้อใหจําไปจนตาย!"
 soviet.13.a: "เราจะบดขยี้พวกเขาภายในไมกี่สัปดาห"
 soviet.14.t: "การเปนสมาชิกสหภาพโซเวียต"
 soviet.14.d: "เรากําลังถูกมอสโกกดดันใหเขารวมสหภาพโซเวียตอยางเปนทางการ เราควรตกลงหรือไม?"
 soviet.14.a: "ใช เขารวมกับพวกเขาเถอะ"
 soviet.14.b: "ไม เรายังไปไมถึงศักยภาพสูงสุดของเรา!"
 soviet.15.t: "ตันนู ตูวาปฏิเสธ!"
 soviet.15.d: "ชาวตูวาปฏิเสธการรวมกับสหภาพโซเวียตอยางอุกอาจ! ชาติที่นาสมเพชเชนนี้จะหวังทําอะไรไดดวยตัวเอง เปนปริศนาที่อาจไมมีวันไดคําตอบ"
 soviet.15.a: "ขอใหโชคดีแลวกัน"
 soviet.16.t: "การผนวกตันนู ตูวา"
 soviet.16.d: "สภาโซเวียตสูงสุดไดรับคํารองอยางเปนทางการจากรัฐสภาตูวาขอเขาเปนสมาชิกสหภาพโซเวียต พวกเขาจะไดรับการจัดตั้งเปนแควนปกครองตนเองตูวาในสาธารณรัฐสังคมนิยมสหพันธรัฐโซเวียตรัสเซีย"
 soviet.16.a: "ยินดีตอนรับสูสหภาพ สหายทั้งหลาย"
 soviet.17.t: "ปรับปรุงแนวสตาลิน"
 soviet.17.d: "การทบทวนปอมปราการปองกันตามแนวชายแดนตะวันตกของเราอยางละเอียดเสร็จสิ้นแลว และนักโทษจากคายแรงงานดัดสันดานของเราก็พรอมเริ่มงาน อีกไมนานแนวสตาลินจะสมกับชื่ออันรุงโรจนของมัน!"
 soviet.17.a: "สหายสตาลินจะภาคภูมิใจ!"
 soviet.60.t: "การแบงแยกโปแลนด"
 soviet.60.d: "โปแลนดเปนของเราแลว แตดินแดนฝงตะวันตกตกอยูในเขตอิทธิพลของ[GER.GetAdjective]ตามขอกําหนดของกติกาสัญญาโมโลตอฟ-ริบเบินทร็อพ เราควรถอนกําลังและปลอยใหชาว[GER.GetAdjective]เขายึดครองดินแดนนี้หรือไม? หากไมทํา สนธิสัญญาของเราจะเปนโมฆะ"
 soviet.60.a: "ใช ตอนนี้ไมใชเวลาฉีกสนธิสัญญา"
 soviet.60.b: "ไม! โปแลนดทั้งหมดเปนของมาตุภูมิ!"
 soviet.61.t: "โซเวียตปฏิบัติตามสนธิสัญญา"
 soviet.61.d: "ตามสนธิสัญญา ชาว[SOV.GetAdjective]ไดสงมอบดินแดนฝงตะวันตกของโปแลนดใหอยูใตการบริหารของเรา กองทหารเยอรมันไดเคลื่อนเขาไปรักษาความปลอดภัยแลว"
 soviet.61.a: "ยอดเยี่ยม"
 soviet.62.t: "โซเวียตละเมิดสนธิสัญญา"
 soviet.62.d: "แมจะใหคํามั่นซํ้าแลวซํ้าเลา แตจนถึงขณะนี้โซเวียตยังไมถอนกําลังทหาร และไมมีทาทีจะสงมอบดินแดนและกลับไปยังพรมแดนที่เราตกลงกันไว ดูเหมือนพวกเขาไมมีเจตนาจะปฏิบัติตามสนธิสัญญาเลย"
 soviet.62.a: "ไมคุมแมแตคาหมึก!"
 soviet.70.t: "แรงกดดันจาก[SOV.GetNameDef]"
 soviet.70.desc: "แมมาตุภูมิของเราจะไดรับการปลดปลอยจากการยึดครองของ[GER.GetAdjective]แลว แตเรายังตองรับมือกับ[SOV.GetName]ที่คอยจองอยูเสมอ ตอนนี้พวกเขาปฏิเสธที่จะรับรองความชอบธรรมของรัฐบาลเรา เวนแตจะยอมใหคอมมิวนิสตในประเทศที่ฝกใฝ[SOV.GetAdjective]มีบทบาทในการบริหารมากขึ้น ความจริงแลว นี่คือคําขูที่แทบไมปดบังจากชาว[SOV.GetAdjective]วาพวกเขาคาดหวังใหเราเขาขางพวกเขา ขณะเดียวกัน หุนสวนของเราทางตะวันตกก็ดูไมเต็มใจจะใหการสนับสนุนใดๆ ในการตอตานขอเรียกรองของ[SOV.GetLeader]"
 soviet.70.a: "เราไมอยูในสภาพที่จะหาเรื่องสูอีก"
 soviet.70.b: "เราจะไมยอมให[SOV.GetLeader]มาสั่งการ"
 soviet.71.t: "ได[POL.GetAdjective]มาอยูขางเราแลว"
 soviet.71.desc: "หลังแรงกดดันลาสุดจากฝายบริหารของเรา และภัยคุกคามที่มีอยูตลอดจากกองทัพแดงอันเกรียงไกร ฝายบริหารกระฎมพีของ[POL.GetNameDef]ไดตกลงที่จะเคารพอํานาจของพรรคคอมมิวนิสตในฐานะผูแทนโดยชอบธรรมเพียงหนึ่งเดียวของประชาชน แมเราจะบังคับใชเจตจํานงของเราดวยกําลังได แตตอนนี้ไมจําเปนแลว เพราะเราวางใจไดวา[POL.GetName]จะเปนสวนหนึ่งของเขตอิทธิพลของเรานับแตนี้ไป"
 soviet.71.a: "พวกเขาทําถูกแลวที่ยอมจํานน"
 soviet.72.t: "[POL.GetNameDefCap]ยังคงกดขี่ชนชั้นกรรมาชีพ"
 soviet.72.desc: "ดวยการแสดงความหยิ่งผยองแบบกระฎมพีอยางโงเขลา ฝายบริหารอันไมชอบธรรมของ[POL.GetName]ปฏิเสธที่จะยอมรับอํานาจของพรรคคอมมิวนิสต เราไมอาจปลอยใหคนโงเหลานี้ทําใหโปแลนดกลายเปนฐานสําหรับการรุกรานของฟาสซิสตเขาสู[SOV.GetNameDef]อีกครั้ง การนํา[POL.GetName]เขาสูเขตอิทธิพลของเราโดยทันทีเปนเรื่องความมั่นคงของชาติที่สําคัญสูงสุด"
 soviet.72.a: "เราจะบดขยี้พวกกระฎมพี[POL.GetAdjective]ใหสิ้นซาก"
 soviet.72.b: "ประชาชนเหนื่อยลากับสงครามแลว เราตองหาทางอื่น"
 soviet.73.t: "[SOV.GetNameDefCap]ยอมถอย"
 soviet.73.desc: "ความตึงเครียดเกี่ยวกับแนวทางนโยบายตางประเทศของ[POL.GetName]เพิ่งคลี่คลายลง เมื่อ[SOV.GetNameDef]ถอยหางจากวาทกรรมกาวราวที่เคยใชกอนหนานี้ แมโอกาสที่จะถูกรุกรานอีกครั้งจะลดลง แตเราควรเฝาระวังเพื่อนบานทางตะวันออกและหมากของพวกเขาตอไป"
 soviet.73.a: "เราตองระวังตัวไว"
 soviet.74.t: "[FROM.GetNameDefCap]จะคืนดินแดน[ROOT.GetAdjective]"
 soviet.74.d: "เพื่อแสดงไมตรีจิตและมิตรภาพระหวางประเทศ[FROM.GetAdjective]และ[ROOT.GetAdjective] [FROM.GetLeader]ไดเสนอคืนดินแดนบางสวนที่พวกเขาครอบครองอยู ซึ่งในทางประวัติศาสตรเคยเปนสวนหนึ่งของโปแลนด"
 soviet.74.a: "ไดบางก็ยังดีกวาไมไดอะไรเลย"
 soviet.74.b: "เราไมรับของบริจาค"
 POL_refused_states: "โปแลนดปฏิเสธดินแดน"
 POL_accepted_states: "โปแลนดไดรับดินแดน"
 soviet.75.t: "[FROM.GetLeader]ยอมรับขอเสนอของเรา"
 soviet.75.d: "ขอเสนอคืนดินแดนของเราไดรับการยอมรับจากรัฐบาล[FROM.GetAdjective] หวังวาเรื่องนี้จะทําใหทุกฝายพอใจไปอีกนาน และลดความเสี่ยงของความขัดแยงภายใน"
 soviet.75.a: "ตามคาด"
 soviet.76.t:  "[FROM.GetLeader]ปฏิเสธขอเสนอของเรา"
 soviet.76.d: "ดวยเหตุผลบางประการ ขอเสนอคืนดินแดนของเราถูกรัฐบาล[FROM.GetAdjective]ปฏิเสธ ตอนนี้ยากจะบอกไดวาพวกเขาคิดจะทําอะไร แตอยางนอยก็หมายความวาพวกเขาจะอางสิทธิ์เหนือดินแดนนี้ไดยากขึ้นในภายหลัง"
 soviet.76.a: "บางคนก็เอาใจไมไดจริงๆ"

 finland.1.t: "ชาว[FROM.GetAdjective]เรียกรอง[146.GetName]"
 finland.1.d: "เจาหนาที่จาก[FROM.GetNameDef]อางวาจําเปนตองสรางเขตกันชนดานความมั่นคงให[195.GetName] จึงขอใหปรับแกพรมแดนของเรา พวกเขาตองการใหเรายกคาเรเลียให และดูจากการเสริมกําลังของ[FROM.GetAdjective]ตามแนวชายแดนของเรา พวกเขาคงไมยอมรับคําปฏิเสธ เราควรตอบสนองอยางไร?"
 finland.1.a: "เราไมมีทางเลือกนอกจากยอมรับขอเรียกรอง"
 finland.1.b: "ใหพวกมันมาถากลา!"
 FIN_remove_soviet_claims_in_other_states_tt: "สละการอางสิทธิ์ทั้งหมดในรัฐที่เปนดินแดนหลักของ[FIN.GetFlag]§Y[FIN.GetAdjective]§!"
 finland.2.t: "ขอความชวยเหลือจากสวีเดนในสงคราม"
 finland.2.d: "ฟนแลนดและสหภาพโซเวียตอยูในภาวะสงคราม หลังไดรับอธิปไตยมาเพียงไมกี่ทศวรรษ บัดนี้เราเสี่ยงจะตกเปนรัฐในอารักขาของเพื่อนบานอีกครั้ง\n\nอยางไรก็ตาม ภัยคุกคามจากศัตรูของเราขยายเกินพรมแดนของเรา เพื่อนบานของเราอยางสวีเดนยังคงวางตัวเปนกลางตอสหภาพโซเวียต แตบางทีอาจโนมนาวใหมารวมกับเราในการปกปองมรดกรวมกัน และสรางเขตกันชนทางยุทธศาสตรของตนเองได"
 finland.2.a: "พวกเขาควรมีสวนรวมในการยืนหยัดของเรา"
 finland.2.b: "เราไมตองการความชวยเหลือจากผูกดขี่เกา"
 finland.3.t: "ฟนแลนดขอการสนับสนุนจากสวีเดน"
 finland.3.d: "ฟนแลนดเพื่อนบานของเราปฏิเสธที่จะยอมตอแรงกดดันของสหภาพโซเวียต และตอนนี้ทั้งสองชาติอยูในภาวะสงคราม แมจะยังไมมีการตกลงเปนพันธมิตรอยางเปนทางการระหวางสองประเทศ แตรัฐบาลฟนแลนดไดขอใหสวีเดนรวมปองกันหมูเกาะโอลันด ซึ่งประชากรสวนใหญยังพูดภาษาสวีเดนและมีความสําคัญทางยุทธศาสตรตอทั้งสองประเทศ\n\nแมรัฐบาลยังแตกแยกวาเราควรชวยฟนแลนดอยางไร แตการสนับสนุนจากสาธารณชนตอการปองกันฟนแลนดก็มีใหเห็นชัด เราพรอมจะไปไกลแคไหนเพื่อปกปองเพื่อนรวมนอรดิกจากการรุกรานจากทางตะวันออก?"
 finland.3.a: "เราตองรักษาความเปนกลางไว"
 finland.3.b: "หากพวกเขามีแรงสนับสนุนจากสาธารณชน ก็สงอาสาสมัครและยุทโธปกรณไป"
 finland.3.c: "อุดมการณของฟนแลนดคือของเรา! สูสงคราม!"
 finland.4.t: "สวีเดนปฏิเสธคําขอ"
 finland.4.d: "รัฐบาลสวีเดนตอบปฏิเสธคําขอความชวยเหลือในสงครามกับสหภาพโซเวียตของเรา พวกเขาเลือกวางตัวเปนกลางเพื่อหลีกเลี่ยงผลกระทบทั้งในและนอกประเทศ และจนถึงขณะนี้ยังคัดคานการมีสวนรวมในสงครามไมวาในรูปแบบใด"
 finland.4.a: "หวังวาพวกเขาจะรูตัววาผิดพลาดกอนจะสายเกินไป"
 finland.5.t: "สวีเดนสงอาสาสมัคร"
 finland.5.d: "รัฐบาลสวีเดนไมเต็มใจเขารวมสงครามกับสหภาพโซเวียตกับเรา แตแรงสนับสนุนจากสาธารณชนในหมูเพื่อนบานของเรายังคงสูง และอาสาสมัครจํานวนมากจากประเทศนอรดิกอื่นๆ ก็เสนอตัวเขารวมกองกําลังของเราเพื่อชวยในสงคราม แมจะนอยกวาที่หวังไว แตอยางนอยผูคนก็ตระหนักถึงภัยคุกคามที่เรากําลังเผชิญอยูบาง"
 finland.5.a: "ก็เปนอยางนอยที่สุดที่ควรคาดหวัง"
 finland.6.t: "สวีเดนเขารวมสงครามของเรา"
 finland.6.d: "คําขอของเราตอรัฐบาลสวีเดนใหรวมปองกันหมูเกาะโอลันดไดรับการตอบรับเกินความคาดหมาย สวีเดนเขารวมสงครามกับสหภาพโซเวียตเคียงขางเรา โดยปฏิเสธที่จะวางตัวเปนกลางเมื่อเผชิญภัยคุกคามที่โจงแจงเชนนี้ แมจะมีความเห็นตางภายใน แตบัดนี้พวกเขาจะสูเคียงบาเคียงไหลกับเราเพื่อรักษาอธิปไตยของฟนแลนดตอไป"
 finland.6.a: "วันนี้จะเปนที่จดจํา"
 finland.7.t: "การเจรจาสันติภาพกับ[SOV.GetNameDef]"
 finland.7.d: "เฮลลา วูโอลิโยกิ คอมมิวนิสตชาว[Root.GetAdjective] ไดติดตอรัฐบาลของเราและเสนอตัวชวยประสานการติดตอกับระบอบ[SOV.GetAdjective] มีการนัดพบกันในสถานที่ลับแหงหนึ่งในสวีเดน ซึ่งเราจะไดรับโอกาสยกดินแดนเพื่อแลกกับการคงอธิปไตยของ[Root.GetAdjective]ตอไป \n\nกองกําลังฟนแลนดกําลังรอยหรอลงอยางรวดเร็ว และความพยายามกอนหนานี้ในการเปดชองทางการติดตอก็ไมประสบผล นี่อาจเปนความหวังเดียวของเราที่จะยุติความขัดแยงอยางสันติ"
 finland.7.a_tt: "§Yหาก[SOV.GetName]ยอมรับ:\n§!"
 finland.7.a: "สงครามนี้ไมมีทางชนะ"
 finland.7.b: "เราตองสูตอไป!"
 finland.8.t: "[From.GetNameDefCap]เสนอยอมผอนปรน"
 finland.8.d: "สงครามกับ[From.GetNameDef]ทําใหเราสูญเสียมาก แตเมื่อเราสามารถผลักดันกองทัพ[From.GetAdjective]ถอยกลับไปได พวกเขาก็ยื่นขอเสนอที่นาสนใจมาให เราจะไดควบคุมพื้นที่สําคัญทางยุทธศาสตร แตตองถอนทหารและยุติการสูรบ\nนี่จะยุติการรุกของเราตอ[From.GetNameDef]โดยไมไดควบคุมภูมิภาคทั้งหมด แตก็จะทําใหเรามุงขยายเขตอิทธิพลในสวนอื่นของโลกได"
 finland.8.a: "ทหารของเราจําเปนที่อื่น"
 finland.8.b: "เราตองการ[From.GetNameDef]ทั้งหมด"
 finland.9.t: "[From.GetNameDefCap]ปฏิเสธ"
 finland.9.d: "การเจรจาที่เริ่มตนกับ[From.GetNameDef]ลมเหลว เห็นไดชัดวามันเปนอุบายถวงเวลาเรา ขณะที่กองทัพ[From.GetAdjective]วางกําลังเพื่อโจมตีดินแดน[Root.GetAdjective]อีกระลอก\n\n[Root.GetNameDef]จะยืนหยัดอยางองอาจและสูจนถึงที่สุด"
 finland.9.a: "พวกมันตองหลั่งเลือดทุกกาวที่รุกเขามา!"
 FIN_agree_peace: "ฟนแลนดยอมตามขอเรียกรองของโซเวียตและยก§Yคารยาลา ซัลลา และเปตซาโม§!"
 finland.10.t: "สงครามฤดูหนาว"
 finland.10.d: "ในที่สุด ความทะเยอทะยานทางดินแดนของ[SOV.GetNameDef]ก็นําไปสูการรุกรานประเทศของเราโดยศัตรูอันชั่วรายที่สุดนี้ เราตองใชทุกมาตรการที่มีเพื่อสรางแนวปองกันอันแข็งแกรงตอการโจมตีอันโหดเหี้ยมนี้ ใหพวกมันตองชดใชทุกกาวที่รุกเขามาในแผนดินของเรา!"
 finland.10.a: "ฟนพวกมันใหแหลก!"
 japan.1.d: "ทางการจีนอางวาไดมาถึง 'จุดแตกหัก' แลวตอ 'การรุกรานอยางไมมีเหตุอันควร' ของเราตอจีน! ขอเรียกรองคาปฏิกรรมของเราถูกปฏิเสธ และมีรายงานวาพลเมืองญี่ปุนถูกโจมตีในเซี่ยงไฮ หากเราตองการขออางในการจัดการกับจีนอยางเด็ดขาด ก็คือตอนนี้!"
 japan.1.a: "พวกมันตองชดใช!"
 japan.2.d: "นาประหลาดใจที่จีนเลือกจะถอยหลังการปะทะที่สะพานมารโคโปโล พวกเขาเขาใจดีวาการทําใหเราโกรธตองแลกดวยราคาแพง และยอมยกดินแดนจํานวนมากรวมถึงปกกิ่งและพื้นที่โดยรอบ ทีละเล็กทีละนอย จีนกําลังกลายเปนของเรา"
 japan.2.a: "สงครามคงตองรอไปกอน"
 japan.3.t: "การปะทะชายแดน: โซเวียตชนะ"
 japan.3.d: "รัสเซียและสุนัขรับใชชาวมองโกลตรวจพบการเสริมกําลังทหารของเราในเฮยหลงเจียง และตอบโตดวยการจูโจมขามชายแดนครั้งใหญกอนที่เราจะเตรียมการเสร็จ! กองกําลังของเราถูกตีอยางยอยยับในการปะทะอันดุเดือดที่ตามมา กอนที่ทั้งสองฝายจะถอนตัว"
 japan.3.a: "เรื่องนี้เกิดขึ้นไดอยางไร?!"
 japan.4.t: "การปะทะชายแดน: ญี่ปุนชนะ"
 japan.4.d: "รัสเซียและสุนัขรับใชชาวมองโกลตรวจพบการเสริมกําลังทหารของเราในเฮยหลงเจียง และพยายามจูโจมขามชายแดนครั้งใหญเพื่อขัดขวางการเตรียมการของเรา! โชคดีที่ผูบัญชาการผูไหวพริบของเราตีกระหนาบกองกําลังของพวกเขาเปนรูปคีม เราสรางความสูญเสียอยางหนักใหพวกเขากอนที่จะหนีกลับขามชายแดนไป"
 japan.4.a: "นี่จะเปนบทเรียนใหพวกมัน!"
 japan.5.t: "โซเวียตถอนกําลัง"
 japan.5.d: "หลังตรวจพบการเสริมกําลังทหารของเรา โซเวียตก็เลือกอยางชาญฉลาดที่จะถอนกําลังออกจากพื้นที่ที่ติดกับชายแดนแมนจูเรีย ทหารของเราไดเขายึดครองดานชายแดนที่พวกเขาทิ้งไวหลายแหงเปนการชั่วคราว หวังวานี่จะยุติการอางสิทธิ์ชายแดนอันไรสาระที่รัสเซียและพันธมิตรชาวมองโกลเสนอมาตลอด"
 japan.5.a: "แคแสดงแสนยานุภาพก็พอแลว"
 japan.6.t: "ฝรั่งเศสยอมรับขอเรียกรองของเรา"
 japan.6.d: "ฝรั่งเศสตกลงตามขอเรียกรองของเรา และฐานทัพกับสิ่งอํานวยความสะดวกในอินโดจีนก็อยูในการใชงานของเราอยางสมบูรณ พวกเขาไดสงมอบการควบคุมอาณานิคมทั้งหมดใหเราโดยพฤตินัย"
 japan.6.a: "การตัดสินใจที่ชาญฉลาด"
 japan.7.t: "ฝรั่งเศสปฏิเสธขอเรียกรองของเรา"
 japan.7.d: "ฝรั่งเศสปฏิเสธขอเรียกรองของเราอยางอุกอาจ! ดูเหมือนวาหากเราตองการอินโดจีน เราจะตองใชกําลังยึดมา!"
 japan.7.a: "โงเขลา!"
 japan.8.t: "เยอรมนีเรียกตัวที่ปรึกษากลับ"
 japan.8.d: "เยอรมันตกลงเรียกตัวที่ปรึกษาทั้งหมดกลับจากจีนแลว ปานนี้พวกเขานาจะกําลังขึ้นเครื่องบินมุงหนาสูเบอรลิน เยอรมนีตระหนักวาอนาคตของมหาเอเชียบูรพาเปนของญี่ปุน ไมใชจีน"
 japan.8.a: "ก็ควรเปนเชนนั้น"
 japan.9.t: "เยอรมนีปฏิเสธคําขอของเรา"
 japan.9.d: "เยอรมันปฏิเสธที่จะเรียกตัวที่ปรึกษากลับจากจีน ทั้งที่คณะผูแทนทางทหารของพวกเขาขัดขวางแผนการของเราในเอเชียตะวันออกโดยตรง! พวกเขาไมเห็นหรือวาสิ่งนี้บอนทําลายรากฐานที่ชาติของเราจะใชสรางความสัมพันธทางการทูต? เราจะไวใจเยอรมันไดจริงหรือ?"
 japan.9.a: "ถาเชนนั้นที่ปรึกษาของพวกเขาก็จะตายไปพรอมกับชาวจีนที่เหลือ"
 japan.11.t: "ยื่นคําขาดตอสยาม"
 japan.11.d: "ดวยการรวมพลในอินโดจีนใกลชายแดนสยาม เราไดแสดงใหเห็นชัดวาเราจริงจังกับเจตนาที่จะใชดินแดนของพวกเขาเปนฐานในการปลดปลอยเอเชียตะวันออกเฉียงใตจากลัทธิอาณานิคมยุโรป หวังวาการเปดทางเลือกใหพวกเขาเขารวมเปนพันธมิตรทางทหารกับเรา ซึ่งโดยพฤตินัยจะทําใหสยามเปนรัฐหุนเชิดของจักรวรรดิญี่ปุน จะชวยใหเราหลีกเลี่ยงการรุกรานฝายเดียวอันไรความหมายได แนนอนวาหากพวกเขาปฏิเสธ ก็เทากับการประกาศสงคราม"
 japan.11.a: "เราจะเขาสูสยาม ไมวาพวกเขาจะวาอยางไร"
 japan.11.b: "เมื่อมองยอนกลับไป การขูรุกรานนั้นกาวราวเกินไป"
 japan.12.t: "ญี่ปุนยื่นคําขาด"
 japan.12.d: "ญี่ปุนรวมกําลังพลอยูใกลชายแดนของเรามาเปนเวลานาน และตามที่สงสัยไว แผนของพวกเขาคือใชทาเรือของเราเปนฐานเพื่อขยายอํานาจตอไปยังพมาและมลายู บัดนี้พวกเขายื่นทางเลือกใหเรา คือยอมจํานนและปลอยใหพวกเขาเดินทัพผาน หรือเผชิญกับการรุกราน\n\nแมสิ่งนี้อาจถูกมองวาเปนการสละอธิปไตยและทําใหเรากลายเปนรัฐหุนเชิดของญี่ปุน แตการหลีกเลี่ยงสงครามอาจเปนประโยชนสูงสุดของเรา"
 japan.12.a: "เราจะตกลงเปนพันธมิตรกับญี่ปุน"
 japan.12.b: "เราจะไมยอมสละเอกราชงายๆ!"
 japan.13.t: "สยามยอมรับคําขาด"
 japan.13.d: "[From.GetLeader]ตัดสินใจอยางชาญฉลาดที่จะยอมรับคําขาดของเราและสรางพันธมิตรทางทหารระหวางสองชาติ โดยพฤตินัยแลว เราจะสามารถใชสยามเปนฐานสําหรับปฏิบัติการในแปซิฟกตอไปในอนาคต"
 japan.13.a: "วงไพบูลยรวมแหงมหาเอเชียบูรพาแข็งแกรงยิ่งขึ้น"
 japan.14.t: "สยามปฏิเสธคําขาด"
 japan.14.d: "[From.GetLeader]ปฏิเสธขอเรียกรองของเราที่จะเขาสูสยาม และขอเสนอเปนพันธมิตรทางทหาร เมื่อเราไดประกาศเจตนาวาจะเขาไปไมวาอยางไร นั่นหมายถึงสงคราม"
 japan.14.a: "นาเสียดายที่ตองมาถึงขั้นนี้"
 romania.1.t: "[FROM.GetNameDefCap]เรียกรองเบสซาราเบีย"
 romania.1.d: "กองกําลัง[FROM.GetAdjective]กําลังรวมพลอยูอีกฟากชายแดนของเรา และนักการทูตของพวกเขาเรียกรองใหเรายกเบสซาราเบียทั้งหมดให! เราไมอาจคาดหวังใหเยอรมันเขาแทรกแซง เพราะกติกาสัญญาของพวกเขากับรัสเซียดูเหมือนจะมีพิธีสารลับที่จัดใหเราอยูในเขตผลประโยชนของ[FROM.GetAdjective] เราควรตอตานหรือไม?"
 romania.1.a: "ไม มันสิ้นหวังแลว"
 romania.1.b: "ใช! เราจะไมยอมยกดินแดนใหโดยไมสู!"
 romania.2.t: "คําชี้ขาดเวียนนาครั้งที่สอง"
 romania.2.d: "เยอรมนีถูกดึงเขามาไกลเกลี่ยขอพิพาทดินแดนระหวางเรากับฮังการี และในคําชี้ขาดเวียนนาครั้งที่สอง พวกเขาตัดสินวาทรานซิลเวเนียตอนเหนือควรกลับไปอยูใตการปกครองของฮังการี เราควรยอมรับคําตัดสินนี้หรือไม?"
 romania.2.a: "ใช... เราไมมีทางเลือก"
 romania.2.b: "ไม เราจะไมมีวันยอมยกทรานซิลเวเนีย!"
 romania.3.d: "เยอรมนีถูกดึงเขามาไกลเกลี่ยขอพิพาทดินแดนระหวางเรากับฮังการี และในคําชี้ขาดเวียนนาครั้งที่สอง พวกเขาตัดสินอยางอุกอาจวาทรานซิลเวเนียทั้งหมดควรกลับคืนสูการปกครองของฮังการี! เราควรยอมรับคําตัดสินนี้หรือไม?"
 romania.4.t: "เยอรมนีไกลเกลี่ยขอพิพาท"
 romania.4.d: "เยอรมนีถูกดึงเขามาไกลเกลี่ยขอพิพาทดินแดนระหวางเรากับฮังการี และพวกเขาตัดสินอยางชาญฉลาดวาทรานซิลเวเนียควรอยูใตการควบคุมของโรมาเนียตอไป ชาวฮังการีไมพอใจ แตหวังวานี่จะยุติเรื่องนี้ไดอยางเด็ดขาด"
 romania.4.a: "ทรานซิลเวเนียจะยังคงเปนของโรมาเนีย"
 romania.5.t: "สนธิสัญญาคราอีโอวา"
 romania.5.d: "นักการทูตบัลแกเรียไดออกมาเรียกรองโดยมีเยอรมนีหนุนหลัง ขอคืนโดบรูจาใต ซึ่งเปนดินแดนที่เราผนวกมาจากพวกเขาใน ค.ศ. 1913 หลังสงครามบอลขานครั้งที่สอง ดูเหมือนวาการยอมผอนปรนที่เราถูกบีบใหทําไปแลวไดกระตุนใหเกิดขอเรียกรองนี้"
 romania.5.a: "นี่จะยุติขอพิพาทได"
 romania.5.b: "ไม เราตองขีดเสนไวตรงนี้!"
 romania.6.t: "ทางเลือกที่ยากลําบาก"
 romania.6.d: "เราเสียดินแดนไปมากมายใหแกเพื่อนบานผูละโมบ ถึงกระนั้นก็ยังมีโอกาสทวงคืนดินแดนที่เสียไปบางสวน พรอมกําไรอีกดวย เพียงแคเราตองเลือกขางใหถูก"
 romania.6.a: "ความหวังเดียวของเราคือเยอรมนี"
 romania.6.b: "สหภาพโซเวียตใหโอกาสที่ดีที่สุดแกเรา"
 romania.6.c: "เราควรวางตัวเปนกลาง"
 baltic.1.t: "คําขาดจาก[FROM.GetAdjective]"
 baltic.1.d: "[FROM.GetNameDefCap]กําลังกดดันใหเราลงนามในสนธิสัญญา 'ชวยเหลือซึ่งกันและกัน' กับพวกเขา ซึ่งจะใหสิทธิ์พวกเขาตั้งกองกําลังภายในดินแดนของเรา! นี่ไมใชอะไรอื่นนอกจากความพยายามผนวกประเทศของเราที่แทบไมปดบัง แตเราแทบไมอาจตอตานกองกําลังที่พวกเขาวางไวตามชายแดนของเราได"
 baltic.1.a: "ยอมรับสิ่งที่เลี่ยงไมได..."
 baltic.1.b: "พวกเขาจะตองใชกําลังยึดแผนดินของเรา!"
 baltic.4.t: "เยอรมนีเรียกรองเมเมล"
 baltic.4.d: "กองกําลังเยอรมันกําลังรวมพลในปรัสเซียตะวันออก และกระทรวงการตางประเทศของพวกเขาไดยื่นคําขาดใหเรา! เราตองยกดินแดนเมเมลใหพวกเขาทันที มิฉะนั้นจะเผชิญการคุกคามทางทหาร เราควรยอมตามขอเรียกรองหรือไม?"
 baltic.4.a: "เราตองยอมรับ"
 baltic.4.b: "ไมมีวัน!"
 baltic.5.t: "คอมมิวนิสตครองอํานาจ"
 baltic.5.d: "[Root.GetName]ไดเลือกความเปนปกแผน และอํานาจทางการเมืองก็ถูกชวงชิงมาจากพวกกระฎมพีแลว หลายคนในรัฐบาลใหมเสนอวาเราควรทําหนาที่คอมมิวนิสตใหลุลวงและรวมเปนหนึ่งเดียวกับสหภาพโซเวียต"
 baltic.5.a: "อนาคตของเราจะมั่นคงที่สุดหากเรารวมเปนหนึ่งเดียวกับมาตุภูมิอยางแทจริง"
 baltic.5.b: "[Root.GetName]จะมีประโยชนมากกวาหากดําเนินการเองภายใตการคุมครองของสหภาพโซเวียต"
 baltic.5.c: "[Root.GetName]จะยังคงเปนรัฐอธิปไตย"
 baltic.7.t: "[From.GetName]ขอให[Root.GetAdjective]เขารวม[From.GetFactionName]"
 baltic.7.d: "ดวยการลงนามในสนธิสัญญาไมตรีระหวางชาติของเรา [From.GetName]ไดขอให[Root.GetName]เขารวม[From.GetFactionName]ของพวกเขา เพื่อรวมพลังตอตานภัยคุกคามที่เพิ่มขึ้นรอบชาติของเรา ไมวาจะเปนคอมมิวนิสตหรือฟาสซิสต [From.GetName]สัญญาวาจะยืนหยัดปกปองผลประโยชนของ[Root.GetAdjective]"
 baltic.7.a: "[Root.GetName]ยืนเคียงขางพี่นอง"
 baltic.7.b: "[Root.GetName]อยูรอดไดดวยตัวเองเทานั้น"
 baltic.8.t: "[SOV.GetNameDefCap]ขยายการควบคุมดินแดนบอลติกของเรา"
 baltic.8.desc: "วันนี้เปนวันยิ่งใหญของ[ROOT.GetNameDef]! หลังการทัพอันกลาหาญของสหายของเรา [SOV.GetNameDefCap]ไดประกาศโดยชอบธรรมวาดินแดนบอลติกที่เพิ่งไดรับการปลดปลอย พรอมกรรมกรผูกลาหาญของที่นั่น จะอยูภายใตเขตอํานาจของเรา\n\nนี่นําเราเขาใกลรัฐบอลติกที่เปนหนึ่งเดียวและทรงพลังพอจะตอกรกับศัตรูของชนชั้นกรรมกรไปอีกกาว"
 baltic.8.a: "เปนทางเลือกที่เปนธรรมชาติ!"
 hungary.1.t: "การชี้ขาดของเยอรมนี"
 hungary.1.d: "แมเราจะมีสิทธิ์อันชอบธรรม แตเยอรมนีตัดสินวาทรานซิลเวเนียควรอยูใตการควบคุมของโรมาเนียตอไป พวกเขาบอกวากระตือรือรนที่จะแกไขความอยุติธรรมทั้งหมดที่เกิดขึ้นที่แวรซาย แตเห็นไดชัดวานั่นใชไดเฉพาะกับพรมแดนของพวกเขาเองเทานั้น"
 hungary.1.a: "อุกอาจที่สุด"
 hungary.2.t: "คําชี้ขาดเวียนนาครั้งที่สอง"
 hungary.2.d: "เยอรมนียอมรับความชอบธรรมของการอางสิทธิ์ของเรา อยางที่เรารูอยูแลววาพวกเขาจะทํา และทรานซิลเวเนียตอนเหนือไดกลับคืนสูฮังการีแลว นี่คือชวงเวลาประวัติศาสตร!"
 hungary.2.a: "วันแหงการเฉลิมฉลอง!"
 hungary.3.d: "เยอรมนีไมเพียงยอมรับความชอบธรรมของการอางสิทธิ์ของเรา แตยังตัดสินใหทรานซิลเวเนียทั้งหมดกลับคืนสูการควบคุมของฮังการี! นี่มากเกินกวาที่เรากลาหวังไว"
 hungary.4.d: "เยอรมนียอมรับความชอบธรรมของการอางสิทธิ์ของเราและมอบทรานซิลเวเนียตอนเหนือใหเรา แตโรมาเนียกลับดื้อรั้นปฏิเสธที่จะยอมรับคําตัดสินของพวกเขา!"
 hungary.4.a: "พวกโงเขลา!"
 hungary.5.d: "เยอรมนียอมรับความชอบธรรมของการอางสิทธิ์ของเราและมอบทรานซิลเวเนียทั้งหมดใหเรา แตโรมาเนียกลับดื้อรั้นปฏิเสธที่จะยอมรับคําตัดสินนี้!"
 hungary.6.t: "คําชี้ขาดลูบลิยานาครั้งที่หนึ่ง"
 hungary.6.d: "เยอรมันอาจบนเรื่องสนธิสัญญาแวรซาย แตพวกเขาโดนเบากวามากเมื่อเทียบกับความอยุติธรรมของสนธิสัญญาทรียานง แมจะอางวาเปนเรื่องการกําหนดชะตากรรมของชาติตนเอง แตสนธิสัญญานั้นกลับทําใหบุตรแทของฮังการีจํานวนมากตองตกอยูใตการปกครองของตางชาติ หนึ่งในบาดแผลตอศักดิ์ศรีของฮังการีคือแควนวอยวอดีนา การคืนดินแดนเหลานี้สูฮังการีไดแกไขความอยุติธรรมที่เราไดรับ"
 hungary.6.a: "ความยุติธรรมแหงฮังการี"
 bulgaria.1.t: "สนธิสัญญาคราอีโอวา - โรมาเนียตกลง"
 bulgaria.1.d: "รัฐบาลโรมาเนียยอมรับการชี้ขาดของเยอรมนีในขอพิพาทของเรา โดบรูจาใตไดกลับมารวมกับบัลแกเรียแลว!"
 bulgaria.1.a: "ในที่สุด!"
 bulgaria.2.t: "สนธิสัญญาคราอีโอวา - โรมาเนียปฏิเสธ"
 bulgaria.2.d: "รัฐบาลโรมาเนียปฏิเสธขอเสนอของเราที่จะยุติขอพิพาททั้งหมด! พวกเขาอางวาบัดนี้โดบรูจาใตเปนสวนสําคัญที่แยกไมไดของชาติพวกเขา ซึ่งพวกเขาจะไมมีวันยอมยกให"
 bulgaria.2.a: "รับไมได!"
 bulgaria.3.t: "คําชี้ขาดลูบลิยานาครั้งที่หนึ่ง"
 bulgaria.3.d: "เราใฝฝนถึงมหาบัลแกเรียมานาน และถูกปฏิบัติเหมือนพลเมืองชั้นสองมานาน ถูกปฏิเสธสิ่งที่ควรไดในการประชุมลอนดอน ถูกพันธมิตรทรยศใน ค.ศ. 1913 ถูกลงโทษเพราะตองการความยุติธรรมใน ค.ศ. 1918 แตตอไปจะไมเปนเชนนั้นอีก เยอรมนีตองการแกไขความอยุติธรรมของสิ่งที่เรียกวาสันติภาพนั้น ไมใชเพื่อตัวเองเทานั้นแตเพื่อผูอื่นดวย บัดนี้บัลแกเรียจะไดมาซิโดเนียคืนจากยูโกสลาเวีย"
 bulgaria.3.a: "ชาวบัลแกเรียจงยินดี!"
 bulgaria.4.t: "สนธิสัญญาคราอีโอวา"
 bulgaria.4.d: "เราไมลืมวาโรมาเนียแทงขางหลังเราใน ค.ศ. 1913 และขี้ขลาดฉวยเอาโดบรูจาใตไปขณะที่กองทัพของเราติดพันอยูที่อื่น ฮังการีใชมิตรภาพกับเยอรมนีแกแคนโรมาเนียไปแลว ถึงคราวของเราหรือยัง?"
 bulgaria.4.a: "เราจะไดแกแคน"
 bulgaria.4.b: "การแกแคนควรรอเวลาใหเย็นลงกอน"
 bulgaria.5.t: "สนธิสัญญาคราอีโอวา"
 bulgaria.5.d: "เยอรมนีเลือกเขาขางพวกโรมาเนียอันนารังเกียจในการแสวงหาความยุติธรรมของเรา [Root.GetLeader]ไดแจงเอกอัครราชทูตเยอรมันวาบัลแกเรียคาดหวังจากมิตรมากกวานี้"
 bulgaria.5.a: "ถูกปฏิเสธ"
 italy.1.t: "แอลเบเนียยอมจํานน"
 italy.1.d: "ทางการแอลเบเนียตกลงตามขอเรียกรองของเรา และ[ALB.GetLeader]ถูกบีบใหลาออก นับแตนี้ไปจนชั่วนิรันดร แอลเบเนียจะเปนของอิตาลี!"
 italy.1.a: "วันอันรุงโรจน"
 italy.2.t: "ซอกปฏิเสธคําขาด"
 italy.2.d: "พระเจาซอกทรงตอตานจนถึงที่สุด และทรงปฏิเสธคําขาดของเรา บัดนี้พระองคและที่ปรึกษากําลังพยายามรวบรวมแนวปองกันอันนาสมเพชเทาที่แอลเบเนียจะหาได เราตองยึดครองติรานาและยุติเรื่องตลกนี้!"
 italy.2.a: "เราทําเรื่องนี้แบบงายๆ ก็ไดนะ ซอก!"
 italy.3.t: "คําขาดจากอิตาลี"
 italy.3.d: "นักการทูตอิตาลียื่นคําขาดเรียกรองใหเรายอมจํานนตอการยึดครองของพวกเขา! แอลเบเนียจะถูกปกครองในฐานะรัฐรวมประมุขภายใตกษัตริยอิตาลี!"
 italy.3.a: "เราตองยอมจํานน"
 italy.3.b: "ไมมีวันเปนเชนนั้น! รวมพลังสนับสนุนซอก!"
 italy.4.t: "การขยายแนวปองกันเทือกเขาแอลป"
 italy.4.d: "วิศวกรจากกองทัพบกแหงราชอาณาจักรไดศึกษาพรมแดนทางเหนือของเรา และระบุจุดที่แนวปองกันเทือกเขาแอลปจําเปนตองเสริมความแข็งแกรงและขยายออกไป คําสั่งกอสรางที่จําเปนไดถูกออกไปแลว"
 italy.4.a: "ถาปอมเหลานี้มีอยูในสมัยฮันนิบาล..."
 italy.5.t: "สนธิสัญญาเทคโนโลยีอิตาลี-เยอรมนี"
 italy.5.d: "[FROM.GetNameDefCap]เสนอใหแลกเปลี่ยนเทคโนโลยีและแนวคิด ซึ่งจะทําใหชาติของเราใกลชิดกันมากขึ้นและแข็งแกรงขึ้นทั้งคู"
 italy.5.a: "ขอเสนอที่ยอดเยี่ยม!"
 italy.5.b: "เทคโนโลยีเยอรมันมีไวสําหรับชาวเยอรมันเทานั้น"
 italy.6.t: "สนธิสัญญาเทคโนโลยีอิตาลี-เยอรมนี - ตอบรับ!"
 italy.6.d: "ตามที่เราคาดไว เยอรมันยินดีอยางยิ่งที่จะรางขอตกลงแลกเปลี่ยนเทคโนโลยีหลายฉบับ เห็นไดชัดวาลมใหมกําลังพัดผานยุโรป และอิตาลีก็เขาใกลการทวงคืนความรุงโรจนในอดีตไปอีกกาว!"
 italy.6.a: "เยี่ยม!"
 italy.7.t: "สนธิสัญญาเทคโนโลยีอิตาลี-เยอรมนี - ปฏิเสธ!"
 italy.7.d: "เยอรมันปฏิเสธขอเสนอทําสนธิสัญญาของเรา"
 italy.7.a: "นับแตนี้เราควรดูแลตัวเองใหดีที่สุด"
 italy.8.t: "เขารวมฝายของฝรั่งเศส"
 italy.8.d: "ขบวนการฟรังซิสตกําลังไดรับความนิยมเพิ่มขึ้นในฝรั่งเศส และไดขอใหเราเขารวมฝายของพวกเขา สิ่งนี้สงเสริมผลประโยชนของอิตาลีหรือไม?"
 italy.8.a: "เขารวมกับฝรั่งเศสกันเถอะ"
 italy.8.b: "ฝรั่งเศสไวใจไมได"
 usa.1.t: "แอรฮารตตองการสมัครเปนทหาร"
 usa.1.d: "ขณะที่อเมริกากําลังระดมพลเพื่อทําสงคราม เราไดรับคําขอที่ไมธรรมดา อะมีเลีย แอรฮารต นักบินชื่อดังที่เพิ่งบินรอบโลกไดสําเร็จเมื่อไมนานมานี้ ตองการสมัครเขากองบินทหารบกในฐานะนักบินขับไล เธอแสดงฝมือไดอยางนาประทับใจในการซอมรบทางอากาศ แตก็มีหลายคนในแวดวงทหารที่ไมพอใจกับแนวคิดที่จะใหผูหญิงบินปฏิบัติภารกิจรบ เราควรยกเวนใหเธอและอนุญาตใหเขารวมหรือไม?"
 usa.1.a: "ใช เราตองการเธอ"
 usa.1.b: "ไม ไมจําเปนหรอก"
 usa.2.t: "ชะตาลิขิตที่ประจักษชัด"
 usa.2.d: "รากฐานและประวัติศาสตรอันเปนเอกลักษณของสหรัฐอเมริกาทําใหเรามีหนาที่ปกปองประชาธิปไตยและเสรีภาพในโลก ทศวรรษที่ผานมาพิสูจนแลววาภารกิจนี้ไมอาจสําเร็จไดหากไมจับอาวุธตอสูกับผูที่ตองการทําลายมัน นับแตนี้ไป ผูกดขี่ทุกรายจะตองตอบคําถามตอเรา และกองทัพของเราจะปลดปลอยผูคนทั่วโลก"
 usa.2.a: "เสรีภาพหรือความตาย!"
 usa.3.t: "กองเรืออเมริกันที่เพิรลฮารเบอร"
 usa.3.d: "การควํ่าบาตรทางการทูตและเศรษฐกิจที่เราไดรับจากสหรัฐอเมริกาดูเหมือนจะเปนจุดเริ่มตนของบางสิ่งที่นากลัวกวา กองเรือแปซิฟกของอเมริกาไดประจําการอยูที่ฐานทัพเรือเพิรลฮารเบอร ฮาวาย ซึ่งเปนสัญญาณชัดเจนวาอเมริกาจะคงกําลังอันแข็งแกรงในแปซิฟกและสนับสนุนศัตรูของเราตอไป การโจมตีฐานทัพแหงนี้ในตอนนี้อาจทําใหเราไดเปรียบจากการจูโจมโดยไมใหตั้งตัว"
 usa.3.a: "ใครจะรูวาโอกาสนี้จะอยูนานแคไหน?"
 usa.4.t: "ความตกลงแลกเรือพิฆาตกับฐานทัพ"
 usa.4.d: "เมื่อสหรัฐฯ แสดงจุดยืนตอตานเยอรมันแลว ดูเหมือนพวกเขาสนใจที่จะทําใหอังกฤษยืนหยัดอยางแข็งแกรงตอภัยคุกคามจากเยอรมนี แตพวกเขาก็กังวลเรื่องการรักษากําลังทางเรือของตนในมหาสมุทรแอตแลนติกดวย พวกเขาจะจัดหาเรือพิฆาตใหชาติของเราเพื่อแลกกับฐานทัพเรือหลายแหงของเรา เรือเหลานี้เปนเรือกองหนุน แตการตอบรับจะยังคงกระชับความสัมพันธทางทหารระหวางชาติของเรา และอาจเปนการตัดสินใจที่ชาญฉลาด"
 usa.4.a: "นี่คือโอกาสที่หาไดยาก"
 usa.4.a.tt: "เราจะไดรับเรือพิฆาตอเมริกัน 43 ลํา\nแคนาดาจะไดรับเรือพิฆาตอเมริกัน 7 ลํา"
 usa.4.b: "นี่เอื้อประโยชนตอสหรัฐฯ มากกวาอยางชัดเจน และรับไมได"
 usa.5.t: "อังกฤษปฏิเสธขอเสนอ"
 usa.5.d: "แมเราจะเตรียมการและมีเจตนาดี แตอังกฤษก็ปฏิเสธขอเสนอของเราที่จะใหเรือพิฆาตเกาแลกกับฐานทัพเรือของพวกเขา"
 usa.5.a: "พวกเขาเสียโอกาสเอง"
 usa.6.t: "การเลือกตั้งป [GetYear]"
 usa.6.d: "วันเลือกตั้งประธานาธิบดีมาถึงแลว แฟรงกลิน เดลาโน รูสเวลต ผูดํารงตําแหนงอยู ไดดําเนินโครงการหลายโครงการที่เรียกรวมกันวานโยบายนิวดีล เพื่อนําสหรัฐฯ ออกจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ\n\nแมความพยายามหลายอยางจะไดรับความนิยม แตแผนการขยายบทบาทและอํานาจของรัฐบาลตอไปก็ถูกวิพากษวิจารณจากคูแขงของเขา อัลฟ แลนดอน จากพรรครีพับลิกัน แลนดอนมาจากอุตสาหกรรมนํ้ามันและตองการเห็นเสรีภาพทางเศรษฐกิจที่มากขึ้น ขณะที่รูสเวลตและพรรคเดโมแครตตองการขยายระบบประกันสังคมและสรางเสถียรภาพทางเศรษฐกิจ การเลือกตั้งครั้งนี้อาจสูสี หรืออาจเปนชัยชนะครั้งใหญของพรรคเดโมแครต"
 usa.6.a: "พรรคเดโมแครต อีกสี่ป!"
 usa.6.b: "พรรครีพับลิกัน เราตองพิทักษอุดมการณของระบบอเมริกัน"
 usa.7.t: "รูสเวลต ปะทะ วิลคี"
 usa.7.d: "นับตั้งแตมีการสถาปนาตําแหนงประธานาธิบดีสหรัฐอเมริกาเปนตนมา ยังไมเคยมีประธานาธิบดีคนใดดํารงตําแหนงติดตอกันถึงสามสมัย อยางไรก็ตาม ดวยสถานการณโลกที่ลอแหลมและความเปลี่ยนแปลงระหวางประเทศในชวงไมกี่ปที่ผานมา ประธานาธิบดีรูสเวลตจึงตัดสินใจฉีกธรรมเนียมและลงสมัครเปนสมัยที่สาม เวนเดลล วิลคี ผูสมัครจากพรรครีพับลิกันซึ่งถูกมองวาเปนมามืด มีพื้นเพเปนนักอุตสาหกรรมที่มีประสบการณทางการเมืองนอย ไดวิพากษวิจารณทั้งนโยบายการแทรกแซงทางเศรษฐกิจของรูสเวลตและเหตุผลที่เขาใชอางในการลงสมัครสมัยที่สาม\n\nแมผูสมัครทั้งสองจะมีนโยบายตางประเทศที่คลายคลึงกันมาก และวิลคีเองก็ตองการคงนโยบายนิวดีลไวในบางรูปแบบ แตหลายคนยังคงมองวาการเลือกตั้งครั้งนี้เปนจุดชี้ชะตาอนาคตของประชาธิปไตยอเมริกัน"
 usa.7.a: "พรรคเดโมแครต FDR คือผูที่ขาดไมได"
 usa.7.b: "พรรครีพับลิกัน เราตองการวิลคี!"
 usa.8.t: "แลนดอน ปะทะ รูสเวลต"
 usa.8.d: "เมื่อสี่ปกอน ประธานาธิบดีแลนดอนไดยุติการปฏิรูปตามนโยบายนิวดีลที่พรรคเดโมแครตผลักดันมาอยางตอเนื่อง โดยเลือกที่จะพึ่งพาความแข็งแกรงของชาติที่มาจากบริษัทอุตสาหกรรม เชนเดียวกับบริษัทที่เขาเคยชวยกอตั้งกอนดํารงตําแหนงประธานาธิบดี สวนรูสเวลตซึ่งยังคงรณรงคเพื่อสานตอโครงการที่เขาวางแผนไวแตเดิมสําหรับสมัยที่สอง ไดกลับมาลงสมัครชิงตําแหนงประธานาธิบดีอีกครั้ง แมเขาจะยังเปนผูสมัครที่ไดรับความนิยม แตแลนดอนก็ยังคงวิจารณความพยายามของเขาที่จะรวมอํานาจไวในมือประธานาธิบดี และตัวแลนดอนเองก็หลีกเลี่ยงนโยบายในลักษณะเดียวกันมาโดยตลอด\n\nภัยคุกคามจากตางแดน ทั้งตอประเทศของเราและชาติอื่น ยังคงเปนความจริง และไมมีผูสมัครคนใดเห็นดวยกับการที่สหรัฐอเมริกาจะเมินเฉยตอภัยเหลานั้น คําถามคือใครจะเปนผูนําคลังแสงแหงประชาธิปไตยฝาฟนชวงเวลาอันเลวรายนี้ไปได"
 usa.8.a: "พรรครีพับลิกัน แลนดอนยึดมั่นในคุณคาของเรา"
 usa.8.b: "พรรคเดโมแครต รูสเวลตพรอมทําทุกอยางที่จําเปน"
 usa.9.t: "รูสเวลต ปะทะ ดิวอี"
 usa.9.d: "การดํารงตําแหนงประธานาธิบดีของแฟรงคลิน ดี. รูสเวลตนับวาโดดเดนเปนพิเศษในหลายดานอยูแลว แมสุขภาพของเขาจะทรุดโทรมลงและอยูในตําแหนงยาวนานอยางไมเคยมีมากอน เขาก็ยังปรารถนาจะนําประเทศของเราตอไปในการทําสงคราม พรรครีพับลิกันมีตัวเลือกผูสมัครจํากัด เนื่องจากผูที่อาจไดรับการเสนอชื่อหลายคนกําลังรับราชการในสงคราม แตก็ไดเลือกผูวาการรัฐโทมัส อี. ดิวอีเปนตัวแทนพรรค\n\nรูสเวลตยังคงไดรับการสนับสนุนจากประชาชน แตหลายคนสงสัยวาเขาอาจมีชีวิตอยูไมถึงวันสิ้นสุดวาระ ทวาเพียงเทานี้จะเพียงพอใหดิวอีชนะชายผูพาเรามาไดไกลถึงเพียงนี้หรือไม?"
 usa.9.a: "FDR เอาชนะดิวอี"
 usa.9.b: "ดิวอีเอาชนะ FDR"
 usa.10.t: "[Root.GetLeader] ปะทะ รูสเวลต"
 usa.10.d: "แม [Root.GetLeader] จะคงนโยบายนิวดีลไวหลายดาน แตรูสเวลตยังมองเห็นโอกาสที่จะทําใหแผนการพัฒนาโครงการตาง ๆ ตามที่เขาตั้งใจไวแตแรกกลายเปนจริง แมสุขภาพจะทรุดลง เขาก็ยังรักษาฐานสนับสนุนที่เคยพาเขาขึ้นสูตําแหนงประธานาธิบดีไวไดมาก และขณะนี้กําลังหาเสียงใหพรรคเดโมแครตอีกครั้ง\n\n[Root.GetLeader] โตแยงวาการเปลี่ยนผูนําในขณะที่อเมริกาอยูในสถานการณออนไหวเชนนี้เปนเรื่องไรความรับผิดชอบ ซึ่งออกจะยอนแยงอยูบาง เพราะมีการกลาวอางแบบเดียวกันนี้กอนที่เขาจะชนะรูสเวลตครั้งกอน ถึงกระนั้น เขาก็อาจมีเหตุผลอยูบาง"
 usa.10.a: "[Root.GetLeader] พิสูจนแลววาเปนผูนําที่มีความสามารถ"
 usa.10.b: "อเมริกาพรอมแลวสําหรับนิวดีลครั้งใหม"
 usa.11.t: "รูสเวลต ปะทะ แมกอาเธอร"
 usa.11.d: "ดวยภัยคุกคามที่จะถูกดึงเขาสูสงครามยังคงอยู ทั้งพรรคเดโมแครตและพรรครีพับลิกันตางมุงหาผูสมัครจากแวดวงทหาร นายพลดักลาส แมกอาเธอร ซึ่งปกติทุมเทใหกับหนาที่ทางทหาร ไดใชโอกาสที่ประเทศยังอยูในภาวะสงบลงชิงการเสนอชื่อของพรรครีพับลิกันและไดรับชัยชนะ บัดนี้เขากําลังทาชิงกับรูสเวลต โดยมีแนวรวมฝายอนุรักษนิยมหนุนหลัง\n\nรูสเวลตยังคงไดรับความนิยม แตบารมีและสํานึกในหนาที่ของแมกอาเธอรไดสรางความประทับใจอยางมากตอผูมีสิทธิเลือกตั้ง ทหารรูดีที่สุดจริงหรือ?"
 usa.11.a: "รูสเวลตและทรูแมนจะพาเราผานไปได"
 usa.11.b: "แมกอาเธอรเปนบุรุษแหงสันติภาพพอ ๆ กับแหงสงคราม"
 usa.12.t: "การหาเสียงของดักลาส แมกอาเธอร"
 usa.12.d: "เพื่อทาชิงกับรูสเวลตผูครองตําแหนงประธานาธิบดียาวนานเปนประวัติการณ พรรครีพับลิกันไดมองหาผูบัญชาการทหารที่ไดรับความเคารพ ดวยหวังวาจะพบผูสมัครที่สามารถนําอเมริกาผานพนสงครามครั้งนี้ นายพลดักลาส แมกอาเธอรเปนผูที่ไดรับความนิยมในหมูฝายอนุรักษนิยม แตเขาก็เปนกําลังสําคัญที่ขาดไมไดในความขัดแยงที่ดําเนินอยู และไมเต็มใจนักที่จะเสียเวลาไปกับการหาเสียงชิงตําแหนงประธานาธิบดี\n\nถึงกระนั้น เขาก็ยังเปนหนึ่งในผูสมัครฝายอนุรักษนิยมที่มีอนาคตมากที่สุด และอาจถูกโนมนาวใหลงหาเสียงเพื่อปองกันไมใหไดประธานาธิบดีจากพรรครีพับลิกันสายกลาง คุมคากับการเสียสละหรือไม?"
 usa.12.a: "แนวหนาตองการแมกอาเธอรมากกวาทําเนียบขาว"
 usa.12.b: "เราตองการใหเขาทาชิงกับรูสเวลต"
 usa.13.t: "รูสเวลตถึงแกอสัญกรรม"
 usa.13.d: "แมสุขภาพของประธานาธิบดีรูสเวลตจะทรุดโทรมมาระยะหนึ่งแลว แตการหาเสียงอันแข็งขันของเขาทําใหหลายคนเชื่อวาเขายังมีเวลาอีกหลายป อยางไรก็ตาม ความเปนไปไดที่ FDR จะถึงแกอสัญกรรมขณะดํารงตําแหนงยังคงมีอยูเสมอ และในวันนี้เขาไดจากไปหลังปวยดวยโรคหลอดเลือดสมอง รองประธานาธิบดีแฮรรี เอส. ทรูแมนไดเขาพิธีสาบานตนรับตําแหนงแลว พรอมขอแรงสนับสนุนและคําอธิษฐานจากประชาชน คณะรัฐมนตรีชุดเดิมยังคงอยู และทรูแมนไดใหคํามั่นวาจะสานตอนโยบายหลายประการของผูดํารงตําแหนงกอนหนา"
 usa.13.a: "ยุคหนึ่งสิ้นสุดลง และอีกยุคหนึ่งไดเริ่มตนขึ้น"
 news.1.t: "เหตุการณสะพานมารโคโปโล"
 news.1.d: "กองกําลังญี่ปุนและจีนไดปะทะกันโดยไมมีฝายใดไดเปรียบเด็ดขาด ณ สะพานมารโคโปโลอันเปนจุดยุทธศาสตรทางตะวันตกเฉียงใตของปกกิ่ง \n\n[CHI.GetNameDef] ปฏิเสธขอเรียกรองของ [JAP.GetNameDef] ที่ใหขอโทษและยอมยกดินแดน โดยประกาศวาการรุกรานของญี่ปุนไดมาถึง 'จุดแตกหัก' แลว \n\nนักการทูตเกรงวาสถานการณที่ผันผวนนี้อาจลุกลามเปนสงครามไดทุกเมื่อ"
 news.1.a: "ชางเปนชวงเวลาที่นาสนใจจริง ๆ"
 news.1.b: "เราจะสั่งสอนพวกจีนเอง!"
 news.1.c: "ถูกตอง! ไมยอมเสียแมแตนิ้วเดียว!"
 news.2.d: "กองกําลังญี่ปุนและจีนไดปะทะกันโดยไมมีฝายใดไดเปรียบเด็ดขาด ณ สะพานมารโคโปโลอันเปนจุดยุทธศาสตรทางตะวันตกเฉียงใตของปกกิ่ง \n\n[CHI.GetNameDef] ไดยอมรับผิดชอบตอเหตุการณนี้ทั้งหมด โดยสงคําขอโทษไปยัง [JAP.GetNameDef] พรอมยอมยกดินแดนจํานวนมาก เรื่องนี้สรางความประหลาดใจแกผูเชี่ยวชาญหลายคนที่เคยคาดการณวาความตึงเครียดตามแนวชายแดนจะปะทุเปนสงครามเต็มรูปแบบ \n\nนี่หมายถึงสันติภาพที่ยั่งยืนในเอเชียหรือไม?"
 news.2.a: "นาสงสัย"
 news.2.b: "เทานี้ก็พอใจแลว... ในตอนนี้"
 news.2.c: "เราไมมีทางเลือก"
 news.5.t: "[JAP.GetNameDefCap] เรียกรองอินโดจีนฝรั่งเศส"
 news.5.d: "[JAP.GetNameDef] ฉวยโอกาสจากความออนแอของฝรั่งเศสทามกลางการตอสูในยุโรป บีบบังคับใหรัฐบาลชุดใหมยอมสละอํานาจควบคุมอาณานิคมในอินโดจีน! \n\nกองทหารญี่ปุนไดเคลื่อนเขายึดครองฐานทัพหลักทั้งหมดในภูมิภาคแลว และผูเชี่ยวชาญเกรงวาอาณานิคมแหงนี้อาจถูกใชเปนฐานยิงสําหรับปฏิบัติการทางทหารในอนาคต"
 news.5.a: "แรงรุมทึ้งซากศพ..."
 news.5.b: "ก็สมควรเปนเชนนั้น"
 news.5.c: "พวกหมาในไมใหทางเลือกเราเลย"
 news.5.e: "พันธมิตรของเราแสดงความริเริ่ม!"
 news.6.d: "[JAP.GetNameDef] พยายามฉวยโอกาสจากความออนแอของฝรั่งเศสหลังพายแพในยุโรป ดวยการยื่นขอเรียกรองตอรัฐบาลฝรั่งเศสชุดใหมใหเปดฐานทัพในอินโดจีนใหใชไดอยางสมบูรณ \n\nนี่เทากับเปนการโอนอํานาจควบคุมอาณานิคมทั้งหมดใหแกญี่ปุน ซึ่งฝรั่งเศสไมอาจยอมรับได\n\nผูเชี่ยวชาญมองวาการตัดสินใจครั้งนี้มีแนวโนมจะนําไปสูการตอบโตทางทหารจากญี่ปุน"
 news.6.a: "พวกเขาคงไมกลา... ใชไหม?"
 news.6.b: "พวกหัวดื้อจะตองชดใชความผิดพลาดนี้"
 news.6.c: "เราตองเตรียมพรอม"
 news.6.e: "มิตรของเราเดินเกมกลาอีกครั้ง"
 news.7.t: "การปะทะระหวางโซเวียตกับญี่ปุน"
 news.7.d: "กองกําลังโซเวียตและญี่ปุนเพิ่งปะทะกันครั้งใหญตามแนวชายแดนแมนจูเรีย \n\nดูเหมือนวากองกําลังจูโจมขนาดใหญของโซเวียตซึ่งมีทหารมามองโกเลียสนับสนุนไดโจมตีญี่ปุนอยางไมทันตั้งตัว และสรางความสูญเสียอยางหนัก \n\nมีรายงานวาบรรยากาศในโตเกียวตึงเครียด แตยังเร็วเกินไปที่จะบอกไดวาความขัดแยงจะบานปลายเปนสงครามเปดหรือไม"
 news.7.a: "นี่คือจุดเริ่มตนของสงครามอีกครั้งในเอเชียหรือ?"
 news.7.b: "ชางนาอับอาย..."
 news.7.c: "เราไดสงสารถึงชาวโลกแลว"
 news.8.d: "กองกําลังโซเวียตและญี่ปุนเพิ่งปะทะกันครั้งใหญตามแนวชายแดนแมนจูเรีย \n\nรายงานจากสนามรบระบุวาญี่ปุนไดตีโอบโซเวียตแบบคีมหนีบเมื่อฝายหลังบุกขามชายแดน ทําใหผูรอดชีวิตตองถอยรนอยางระสํ่าระสาย \n\nเหตุการณนี้จะกระตุนใหมอสโกสงกําลังเพิ่มเติมไปยังตะวันออกไกลของรัสเซียหรือไม?"
 news.8.b: "เพื่อองคจักรพรรดิ!"
 news.8.c: "เราตองประเมินสถานการณ..."
 news.9.t: "โซเวียตถอนกําลัง"
 news.9.d: "หลังจากญี่ปุนระดมกําลังในแมนจูเรีย สหภาพโซเวียตดูเหมือนจะถอนหนวยที่ประจําการอยูติดแนวชายแดนออกไปอยางไมคาดคิด \n\nนี่อาจเปนความพยายามของมอสโกที่จะหลีกเลี่ยงการเผชิญหนากับญี่ปุนในอนาคต ซึ่งอาจมีที่มาจากความทรงจําอันเจ็บปวดถึงความพายแพของรัสเซียในสงครามรัสเซีย - ญี่ปุน"
 news.9.a: "บางทีนี่อาจนําไปสูสันติภาพที่ยั่งยืน"
 news.9.b: "พวกขี้ขลาดหนีไปแลว!"
 news.9.c: "เปนการถอยทางยุทธวิธี ไมมีอะไรมากกวานั้น"
 news.10.t: "สหภาพโซเวียตอางสิทธิ์เหนือเบสซาราเบีย"
 news.10.d: "หลังจากระดมกําลังตามแนวชายแดนโรมาเนีย [SOV.GetNameDef] ไดยื่นคําขาดตอรัฐบาลในบูคาเรสตใหโอนเบสซาราเบียมาอยูใตการควบคุมของตนโดยทันที ภูมิภาคนี้เคยเปนของจักรวรรดิรัสเซีย ซึ่ง [SOV.GetNameDef] เห็นวาเปนฐานทางกฎหมายที่เพียงพอสําหรับขอเรียกรองของตน\n\nโรมาเนียประกาศวาไมมีทางเลือกนอกจากตองยินยอม และไดถอนกําลังออกจากเบสซาราเบียแลว"
 news.10.a: "นาสนใจ"
 news.10.b: "เบสซาราเบียเปนของเราโดยชอบธรรม"
 news.10.c: "เราไมมีทางเลือก..."
 news.10.e: "ฉลองชัยชั่วคราวนี้ไปเถอะ มอสโก"
 news.11.t: "โรมาเนียปฏิเสธขอเรียกรองของโซเวียต"
 news.11.d: "[SOV.GetNameDefCap] ไดรวมกําลังจํานวนมากตามแนวชายแดนติดกับ [ROM.GetNameDef] และวันนี้มอสโกไดยื่นคําขาดตอรัฐบาลโรมาเนีย เรียกรองใหโอนเบสซาราเบียมาอยูใตการควบคุมของตนโดยทันที ภูมิภาคนี้เคยเปนของจักรวรรดิรัสเซีย ซึ่ง [SOV.GetNameDef] เห็นวาเปนฐานทางกฎหมายที่เพียงพอสําหรับขอเรียกรองของตน\n\nบูคาเรสตไดเลือกที่จะทาทายดวยการปฏิเสธขอเรียกรองทางดินแดนทั้งหมดของโซเวียต และกองทัพโรมาเนียไดรับคําสั่งใหระดมพลเต็มอัตรา \n\nผูสังเกตการณระหวางประเทศคาดวากองกําลังโซเวียตจะบุกขามชายแดนไดทุกเมื่อ"
 news.11.a: "นาสนใจ"
 news.11.b: "พวกเขาทําผิดพลาดครั้งใหญแลว"
 news.11.c: "เบสซาราเบียเปนของเรา!"
 news.11.e: "ปลอยใหพวกโงสูกันไป"
 news.12.t: "[FIN.GetNameDefCap] ปฏิเสธขอเรียกรองของโซเวียต"
 news.12.d: "นักการทูตโซเวียตไดยื่นคําขาดตอรัฐบาลของ [FIN.GetNameDef] เรียกรองใหปรับแนวพรมแดนในภูมิภาคคาเรเลีย \n\nแมโซเวียตจะระดมกําลังจํานวนมากที่ชายแดน แตเฮลซิงกิก็ปฏิเสธขอเรียกรองเหลานี้ โดยแถลงวา "จะไมมีผืนแผนดินฟนแลนดแมแตฟุตเดียวที่จะยกใหผูรุกรานชาวรัสเซียโดยสมัครใจ" \n\nผูสังเกตการณระหวางประเทศเกรงวาการรุกรานของโซเวียตอาจใกลเขามาแลว"
 news.12.a: "เรื่องนี้คงจบไมสวย"
 news.12.b: "พวกเขาไมควรปฏิเสธขอเรียกรองของเรา"
 news.12.c: "เราตองดูแลแนวปองกันของเรา"
 news.12.e: "มาดูกันวาพวกบอลเชวิคจะทําไดดีแคไหน..."
 news.12.f: "ไมชาพวกเขาจะรูตัววาทําผิด"
 news.13.t: "[FIN.GetNameDefCap] ยอมรับขอเรียกรองของโซเวียต"
 news.13.d: "หลังการอภิปรายอยางยาวนาน รัฐบาลของ [FIN.GetNameDef] ไดตัดสินใจยอมรับขอเรียกรองของโซเวียตใหปรับแนวพรมแดนในภูมิภาคคาเรเลีย \n\n[SOV.GetNameDef] อางถึงความจําเปนในการสรางเขตกันชนเพื่อเพิ่มความมั่นคงใหเลนินกราด ซึ่งอยูหางจากพรมแดนฟนแลนดเดิมเพียง 30 กิโลเมตร \n\nผูสังเกตการณหลายคนเคยเกรงวาการรุกรานฟนแลนดเต็มรูปแบบของโซเวียตใกลเขามาแลว แตทางออกทางการทูตครั้งนี้นาจะชวยคลายความกังวลเหลานั้นลงได"
 news.13.a: "สันติภาพ แตตองแลกดวยอะไร?"
 news.13.b: "ตอนนี้เราสามารถทุมความพยายามไปที่อื่นไดแลว"
 news.13.c: "เราไดรักษาเอกราชของเราไวแลว"
 news.13.e: "นาเสียดาย มันนาจะทําใหพวกบอลเชวิคยุงไปพักหนึ่ง"
 news.13.f: "สหายของเราแสดงพลังแลว!"
 news.14.t: "[SOV.GetNameDefCap] ผนวก [TAN.GetNameDef]"
 news.14.d: "ในแถลงการณตอสื่อมวลชนเมื่อชวงเชาวันนี้ มอสโกประกาศผนวก [TAN.GetNameDef] อยางเปนทางการ \n\nสภาโซเวียตสูงสุดไดตอบรับคําขอจากรัฐสภาตูวาที่ตองการเขาเปนสมาชิกของสหภาพโซเวียต \n\nสาธารณรัฐประชาชนตูวาอันเล็กจอย ซึ่งกอนหนานี้ไดรับการรับรองอยางเปนทางการจากสหภาพโซเวียตและมองโกเลียเทานั้น จะถูกจัดตั้งเปนแควนปกครองตนเอง"
 news.14.a: "ทันนู อะไรนะ?"
 news.14.b: "พวกเขาจะมีชีวิตที่ดีขึ้น"
 news.15.t: "คําตัดสินเวียนนาครั้งที่สอง"
 news.15.d: "สนธิสัญญาไดรับการลงนามที่เวียนนาภายหลังการไกลเกลี่ยของเยอรมนี ซึ่งจะทําใหทรานซิลเวเนียตอนเหนือกลับคืนสูการปกครองของฮังการี\n\nดินแดนนี้เคยถูกยกใหแก [ROM.GetNameDef] เมื่อสงครามโลกครั้งที่ 1 สิ้นสุดลง ซึ่งนําไปสูขอพิพาทอันขมขื่น \n\nนี่จะเปนเพียงจุดเริ่มตนของการปรับพรมแดนอีกมากมาย ในเมื่อดูเหมือนวาระเบียบใหมไดถูกสถาปนาขึ้นในยุโรปแลวหรือไม?"
 news.15.a: "มาดูกันวาจะอยูไดนานแคไหน"
 news.15.b: "แผนที่ยุโรปจะตองถูกวาดใหม"
 news.15.c: "หวังวาสักวันการปรับเปลี่ยนเหลานี้จะเปนผลดีกับเรา"
 news.15.e: "เห็นดวยอยางยิ่ง!"
 news.16.d: "ภายหลังการไกลเกลี่ยของเยอรมนี สนธิสัญญาไดรับการลงนามที่เวียนนา ซึ่งจะทําใหทรานซิลเวเนียทั้งหมดกลับคืนสูการปกครองของฮังการี \n\nดินแดนนี้เคยถูกยกใหแก [ROM.GetNameDef] เมื่อสงครามโลกครั้งที่ 1 สิ้นสุดลง ซึ่งนําไปสูขอพิพาทอันขมขื่น \n\nนี่จะเปนเพียงจุดเริ่มตนของการปรับพรมแดนอีกมากมาย ในเมื่อดูเหมือนวาระเบียบใหมไดถูกสถาปนาขึ้นในยุโรปแลวหรือไม?"
 news.17.t: "โรมาเนียปฏิเสธการไกลเกลี่ยของเยอรมนี"
 news.17.d: "การเจรจาระหวาง [HUN.GetNameDef] และ [ROM.GetNameDef] วาดวยขอพิพาทเรื่องดินแดนที่เวียนนาไดลมลง \n\n[GER.GetNameDef] ทําหนาที่เปนผูชี้ขาด แตเมื่อตัดสินใหคืนทรานซิลเวเนียตอนเหนือแก [HUN.GetNameDef] ทาง [ROM.GetNameDef] กลับปฏิเสธคําตัดสิน รัฐบาลโรมาเนียสั่งใหคณะผูแทนเดินทางกลับบูคาเรสตทันที \n\nดูเหมือนวา [GER.GetNameDef] ยังไมมีอิทธิพลทางการทูตมากอยางที่ตนคิด"
 news.17.a: "นาสนใจ..."
 news.17.b: "พวกโรมาเนียทําใหเราขายหนา..."
 news.17.c: "ทรานซิลเวเนียเปนของเรา!"
 news.17.e: "เรื่องนี้ยังไมจบ"
 news.18.d: "การเจรจาระหวาง [HUN.GetNameDef] และ [ROM.GetNameDef] วาดวยขอพิพาทเรื่องดินแดนที่เวียนนาไดลมลง \n\n[GER.GetNameDef] ทําหนาที่เปนผูชี้ขาด แตเมื่อตัดสินใหคืนทรานซิลเวเนียตอนเหนือแก [HUN.GetNameDef] ทาง [ROM.GetNameDef] กลับปฏิเสธคําตัดสิน รัฐบาลโรมาเนียสั่งใหคณะผูแทนเดินทางกลับบูคาเรสตทันที \n\nดูเหมือนวา [GER.GetNameDef] ยังไมมีอิทธิพลทางการทูตมากอยางที่ตนคิด"
 news.19.t: "[GER.GetNameDefCap] อางสิทธิ์เหนือเมเมล"
 news.19.d: "ดวยกองกําลังเยอรมันที่พรอมบุกอยูริมชายแดน [FROM.GetNameDef] จึงยอมจํานนตอคําขาดของ[GER.GetAdjective]ที่เรียกรองใหสงมอบเมเมล ดินแดนเกาของปรัสเซีย\n\nดินแดนนี้ถูกโอนใหแก [FROM.GetNameDef] ตามสนธิสัญญาแวรซาย แตบัดนี้ไดถูกผนวกกลับเขาเปนสวนหนึ่งของภูมิภาคปรัสเซียตะวันออกแลว \n\nความทะเยอทะยานทางดินแดนของเยอรมนีในยุโรปถึงขีดสุดแลวหรือยัง? ผูเชี่ยวชาญยังคลางแคลงใจ..."
 news.19.a: "แผนที่อีกชุดหนึ่งลาสมัยไปแลว"
 news.19.b: "ชาวเยอรมันทุกหนแหงตองเปนหนึ่งเดียวกัน"
 news.19.c: "หากเรามีกําลังพอจะตอตานก็ดี..."
 news.19.e: "ถูกตองแลวที่พวกเขากมหัวใหผูที่เหนือกวา!"
 news.20.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของ[GER.GetAdjective]"
 news.20.d: "แมกองกําลัง[GER.GetAdjective]จะตั้งแถวอยูริมชายแดน [FROM.GetNameDef] ก็ยังปฏิเสธคําขาดของเบอรลินที่เรียกรองใหคืนดินแดนเมเมล \n\nเมเมลเคยเปนของปรัสเซียตะวันออก แตถูก [FROM.GetNameDef] ผนวกไปภายหลังสนธิสัญญาแวรซาย เมื่อรัฐบาล[FROM.GetAdjective]ประกาศปฏิเสธ [FROM.GetLeader] กลาววาจําเปนตองปกปองความศักดิ์สิทธิ์ของสนธิสัญญาฉบับนี้\n\nบัดนี้ผูสังเกตการณระหวางประเทศคาดวาเยอรมนีอาจพยายามยึดดินแดนนี้ดวยกําลัง..."
 news.20.a: "กลาหาญมาก"
 news.20.b: "พวกเขาไดลงนามในหมายประหารของตัวเองแลว"
 news.20.c: "เราตองขีดเสนไวตรงนี้!"
 news.21.t: "สนธิสัญญาไครโอวา"
 news.21.d: "[ROM.GetNameDef] ถูกบีบใหยอมเสียดินแดนเพิ่มขึ้นอีก โดย [BUL.GetNameDef] ไดทวงคืนโดบรูจาตอนใต \n\nดินแดนนี้ถูกโรมาเนียผนวกไปในป 1913 หลังสงครามบอลขานครั้งที่สอง และประชากรสวนใหญยังคงเปนชาวบัลแกเรียและชาวเติรก\n\nไมวาดวยเหตุผลใด บัดนี้ [ROM.GetNameDef] ออนแอลงอยางมาก"
 news.21.a: "ไมใชเรื่องนากังวล"
 news.21.b: "นี่คือชัยชนะครั้งยิ่งใหญ"
 news.21.c: "ยังไงดินแดนนั้นก็ไรคาอยูแลว"
 news.22.t: "[ALB.GetLeader] ยอมสยบตออิตาลี"
 news.22.d: "นักการทูตอิตาลีไดยื่นคําขาดตอรัฐบาลแอลเบเนีย เรียกรองใหยอมรับการยึดครองทางทหารโดยสมบูรณ \n\n[ALB.GetLeader] สละราชสมบัติหลังตระหนักวาการตอตานไรประโยชน และนับจากนี้แอลเบเนียจะอยูภายใตการปกครองแบบรวมประมุขโดยมีพระเจาวิตโตรีโอ เอมานูเอเลที่ 3 เปนพระประมุข\n\n[ITA.GetNameDef] หันมาจับตาคาบสมุทรบอลขาน..."
 news.22.a: "เหยื่ออีกรายของความทะเยอทะยานของอิตาลี"
 news.22.b: "เราเขาใกลการสรางจักรวรรดิอันยิ่งใหญไปอีกขั้น"
 news.22.c: "อีกหนึ่งชัยชนะของมิตรของเรา [From.GetLeader]!"
 news.23.t: "โซกไมยอมจํานน"
 news.23.d: "นักการทูตจาก [ITA.GetNameDef] ไดยื่นคําขาดตอ [ALB.GetNameDef] เรียกรองใหยอมถูกผนวกเขาเปนสวนหนึ่งของมหาอิตาลี \n\nดวยความเปนผูนําของชาติอันกลาหาญ พระเจาโซกทรงปฏิเสธที่จะยอมตามขอเรียกรองของอิตาลี และทรงเรียกรองใหชาวแอลเบเนียตอตานแรงกดดันจาก [ITA.GetNameDef] \n\nถึงกระนั้น ผูเชี่ยวชาญทางทหารตางชาติตางเห็นตรงกันวา [ALB.GetNameDef] มีโอกาสนอยมากที่จะตานทานการรุกราน"
 news.23.a: "[ALB.GetNameDef] จะสูไดนานแคไหน?"
 news.23.b: "นี่จะเปนการทัพที่สั้น"
 news.23.c: "ทรงพระเจริญ พระเจาโซก!"
 news.24.t: "ปญหาโปแลนด"
 news.24.d: "ในสุนทรพจนอันดุเดือดตอหนาสภาไรชสทาคในวันนี้ [GER.GetLeader] ไดประณามโปแลนดและการปฏิบัติตอชาวเยอรมันที่อาศัยอยูในดานซิกและฉนวนโปแลนด \n\n[GER.GetLeader] อางวาชนกลุมนอยเยอรมันในโปแลนดกําลัง 'ถูกขมเหงดวยวิธีการอันตํ่าชาที่สุดเทาที่จะนึกได' และประกาศจุดยืนของรัฐบาลอยางชัดเจนวา:\n'ดานซิกเคยเปนเมืองเยอรมันและยังคงเปนเมืองเยอรมัน! ฉนวนเคยเปนของเยอรมันและยังคงเปนของเยอรมัน! หากไมมีชนชาติเยอรมัน ดินแดนตะวันออกเหลานี้คงยังจมอยูในหวงแหงความปาเถื่อน'"
 news.24.a: "สงครามใกลเขามาทุกที"
 news.25.t: "การนํากําลังทหารกลับเขาไรนแลนด"
 news.25.d: "เยอรมนีไดสงทหารเขาประจําการในดินแดนไรนแลนดใกลชายแดนฝรั่งเศส ซึ่งเปนการละเมิดสนธิสัญญาแวรซายอยางชัดแจง ชาวเมืองตางโหรองตอนรับทหารเยอรมัน ขณะที่ปฏิกิริยาทางการทูตจากฝรั่งเศสและอังกฤษยังคงเงียบงัน\n\n'นี่ก็แคชาวเยอรมันเดินเขาสวนหลังบานของตัวเองเทานั้น' นักวิจารณการเมืองชาวอังกฤษคนหนึ่งใหความเห็น"
 news.25.a: "นาเปนหวง"
 news.25.b: "มันคือดินแดนของเยอรมัน"
 news.25.c: "เราตองดูแลแนวปองกันชายแดน"
 news.25.e: "ไมเห็นมีอะไรตองตื่นตูมเลย"
 news.26.d: "ทหารเยอรมันไดขามแมนํ้าไรนเขาสูดินแดนไรนแลนดใกลชายแดนฝรั่งเศส อันเปนการละเมิดสนธิสัญญาแวรซายโดยตรง\n\nทั้งฝรั่งเศสและอังกฤษเรียกการกระทํานี้วาเปน 'การละเมิดที่ไมอาจใหอภัย' ตอสนธิสัญญาสันติภาพที่ยุติมหาสงคราม และไดระดมกําลังเตรียมบุกเขาเยอรมนี \n\nสงครามไดปะทุขึ้นในยุโรปอีกครั้ง!"
 news.26.a: "มาอีกแลว!"
 news.26.b: "เยอรมนีจะตองชนะ!"
 news.26.c: "จุดหมายตอไป: เบอรลิน!"
 news.26.e: "ถาอยางนั้นก็มาตัดสินกัน"
 news.27.d: "ทหารเยอรมันไดขามแมนํ้าไรนและเดินทัพเขาสูดินแดนไรนแลนดใกลชายแดนฝรั่งเศส อันเปนการละเมิดสนธิสัญญาแวรซายโดยตรง\n\nแมปฏิกิริยาจากอังกฤษจะยังเงียบงัน แตฝรั่งเศสกําลังระดมกําลังเตรียมบุกเขาเยอรมนี \n\nสงครามไดปะทุขึ้นในยุโรปอีกครั้ง!"
 news.28.t: "ฮิตเลอรถูกลอบสังหาร!"
 news.28.d: "นายทหารกลุมหนึ่งในกองทัพแวรมัคทที่ตอตานสงครามไดกอรัฐประหารในเบอรลิน กลุมชายติดอาวุธที่ไมทราบสังกัดบุกเขาทําเนียบไรช และหลังการดวลปนกับองครักษ ก็สามารถปลิดชีพทานผูนําแหงเยอรมนีไดสําเร็จ\nผูสมรูรวมคิดที่รอดชีวิตถูกเกสตาโปจับกุมทั้งหมด และเชาวันนี้ ไฮนริช ฮิมมเลอร ไดสาบานตนเปนทานผูนําคนใหมแหงไรชเยอรมัน \n\nในสุนทรพจนตอหนาสภาไรชสทาค ฮิมมเลอรกลาวหาวาอังกฤษและฝรั่งเศสเปนผูบงการการลอบสังหารฮิตเลอร และประกาศความมุงมั่นอยางแนวแนของเยอรมนีที่จะทําลายลางทั้งสองชาติใหสิ้นซาก"
 news.28.a: "พัฒนาการที่นาสนใจ"
 news.28.b: "พวกมันตองชดใช!"
 news.28.c: "อยางนอยฮิตเลอรก็ไปแลว"
 news.29.d: "นายทหารกลุมหนึ่งในกองทัพแวรมัคทที่ตอตานสงครามไดกอรัฐประหารในเบอรลิน กลุมชายติดอาวุธที่ไมทราบสังกัดบุกเขาทําเนียบไรช และหลังการดวลปนกับองครักษ ก็สามารถปลิดชีพทานผูนําแหงเยอรมนีไดสําเร็จ\nผูสมรูรวมคิดที่รอดชีวิตถูกเกสตาโปจับกุมทั้งหมด และเชาวันนี้ แฮรมันน เกอริง ไดสาบานตนเปนทานผูนําคนใหมแหงไรชเยอรมัน \n\nในสุนทรพจนตอหนาสภาไรชสทาค เกอริงกลาวหาวาอังกฤษและฝรั่งเศสเปนผูบงการการลอบสังหารฮิตเลอร และประกาศความมุงมั่นอยางแนวแนของเยอรมนีที่จะทําลายลางทั้งสองชาติใหสิ้นซาก"
 news.30.t: "ความพยายามลอบสังหารฮิตเลอรลมเหลว"
 news.30.d: "นายทหารกลุมหนึ่งในกองทัพแวรมัคทที่ตอตานสงครามไดกอรัฐประหารโคนฮิตเลอรในเบอรลิน กลุมชายติดอาวุธที่ไมทราบสังกัดบุกเขาทําเนียบไรช แตถูกหนวยองครักษ SS ของทานผูนําตานไวไดสําเร็จ\nเจาหนาที่เกสตาโปไดจับกุมผูสมรูรวมคิดทั้งหมด ซึ่งรวมถึงนายทหารระดับสูงอยางลุดวิก เบ็ค และวิลเฮลม คานาริส \n\nในสุนทรพจนตอหนาสภาไรชสทาค ฮิตเลอรประกาศจะแกแคนฝรั่งเศสและอังกฤษที่บงการ 'ความพยายามอันชั่วชา' ในการปลิดชีพเขา"
 news.30.a: "ลองนึกดูสิถาพวกเขาทําสําเร็จ..."
 news.30.c: "นี่ไมเปลี่ยนแปลงอะไรเลย"
 news.30.e: "นาเสียดายที่เก็บไอหมอนั่นไมสําเร็จ!"
 news.31.t: "สงครามกลางเมืองในเยอรมนี!"
 news.31.d: "นายทหารกลุมหนึ่งในกองทัพแวรมัคทที่ตอตานสงครามครั้งนี้ไดกอรัฐประหารโคนฮิตเลอรในเบอรลิน กลุมชายติดอาวุธที่ไมทราบสังกัดบุกเขาทําเนียบไรชและสังหารทานผูนําแหงเยอรมนีไดสําเร็จหลังการยิงตอสูอยางดุเดือดกับองครักษ SS\n\nผูกอการสามารถยึดครองเบอรลินไดเกือบทั้งหมด และหนวยทหารแวรมัคทจํานวนมากไดแปรพักตรมาเขารวม กองกําลังที่ยังภักดีตอนาซีไดรวมตัวกันภายใตผูนําคนใหม และประกาศวาจะกวาดลาง 'พวกกบฏคอมมิวนิสตและสายลับตางชาติที่กําลังยึดครองเบอรลิน' ใหหมดไปจากเยอรมนี"
 news.31.a: "นาสนใจ"
 news.31.b: "เยอรมนีตองเปนอิสระจากทรราช!"
 news.31.c: "ความตายจงมีแดคนทรยศ!"
 news.31.e: "นี่เปนผลดีกับเรา!"
 news.32.t: "กติกาสัญญาโมโลตอฟ-ริบเบนทรอพ"
 news.32.d: "วันนี้นักการทูตจากเยอรมนีและสหภาพโซเวียตไดบรรลุสิ่งที่ผูสังเกตการณเรียกวาขอตกลงประวัติศาสตร ดวยการลงนามในกติกาสัญญาโมโลตอฟ-ริบเบนทรอพ \nสนธิสัญญาไมรุกรานฉบับนี้ไดชื่อตามโยอาคิม ฟอน ริบเบนทรอพ รัฐมนตรีตางประเทศเยอรมนี และเวียเชสลาฟ โมโลตอฟ รัฐมนตรีตางประเทศโซเวียต โดยกําหนดวาจะไมมีฝายใดเปนพันธมิตรหรือใหความชวยเหลือแกศัตรูของอีกฝาย\n\nนักการทูตตางชาติเตือนวาสนธิสัญญานี้เทากับเปดทางใหเยอรมนีทําสงครามในยุโรปไดอยางเสรีโดยไมตองกลัวการแทรกแซงจากโซเวียต"
 news.32.d_finland: "$news.32.d$ อยางไรก็ตาม ประชาชน[ROOT.GetAdjective]ดูจะกังวลมากกวาเกี่ยวกับภัยคุกคามที่ [SOV.GetNameDef] อาจมีตอพวกเขา"
 news.32.a: "นี่คงไมใชเรื่องดีแน..."
 news.32.b: "ดื่มใหมิตรบอลเชวิคคนใหมของเรา!"
 news.32.c: "ดื่มใหมิตรชาวเยอรมันคนใหมของเรา!"
 news.32.e: "ขอใหมิตรภาพยืนยาวและเปนประโยชน!"
 news.32.f: "เราตองเตรียมปกปองประเทศของเรา"
 news.33.t: "สหภาพโซเวียตยึดครองโปแลนดตะวันออก"
 news.33.d: "ทหารโซเวียตไดเขายึดครองโปแลนดตะวันออก โดยอางอยางเปนทางการวาเพื่อปกปองชนกลุมนอยชาวเบลารุสและยูเครนจากความโกลาหลภายหลังรัฐบาลโปแลนดลมสลาย \n\nกองกําลังเยอรมันไดถอนตัวออกจากพื้นที่เหลานี้อยางเปนระเบียบ สงผลใหโปแลนดถูกแบงแยกระหวางสองมหาอํานาจโดยปริยาย"
 news.33.a: "ขออางฟงขึ้นจริง ๆ!"
 news.33.b: "ฉลองไปเถอะตอนที่ยังทําได พวกบอลเชวิค..."
 news.33.c: "พรมแดนของคอมมิวนิสตกําลังรุกคืบ!"
 news.34.t: "การสงบศึกครั้งที่สองที่กงเปยญ"
 news.34.d: "การสงบศึกระหวาง [From.GetName] และสาธารณรัฐฝรั่งเศสที่สามไดรับการลงนามที่กงเปยญ ในตูรถไฟตูเดียวกับที่ใชเจรจาการยอมแพของเยอรมนีในสงครามโลกครั้งที่ 1\n\nตามเงื่อนไขการสงบศึก รัฐบาลฝรั่งเศสภายใตการนําของ [vichy_france.GetLeader] ซึ่งตั้งอยูที่วิชี จะยังคงปกครองพื้นที่สวนใหญทางใตของฝรั่งเศส ขณะที่สวนที่เหลือของประเทศตกอยูในเขตยึดครองของเยอรมนี \n\nนายทหารฝรั่งเศสบางสวนไดปฏิญาณวาจะตอตานตอไปจากตางแดน แตการสงบศึกนี้ไดยุติการสูรบในฝรั่งเศสลงโดยปริยาย อยางนอยก็ในขณะนี้"
 news.34.a: "นากังวล"
 news.34.b: "ยอดเยี่ยม!"
 news.34.c: "การตอสูยังดําเนินตอไป!"
 news.35.t: "การกําเนิดสหภาพฝรั่งเศส-อังกฤษ"
 news.35.d: "เมื่อเผชิญกับความพายแพในฝรั่งเศส รัฐบาลฝรั่งเศสและอังกฤษไดตัดสินใจรวมสองชาติเปนหนึ่งเดียวจนกวาจะไดรับชัยชนะเหนือเยอรมนีอยางแนนอน \n\nรัฐบาลรวมชุดใหมกําลังจัดตั้งขึ้นในลอนดอน โดยสมเด็จพระเจาเอ็ดเวิรดที่ 8 ยังคงทรงเปนประมุขแหงรัฐ ใน 'ปฏิญญาแหงสหภาพ' ที่ประกาศออกมา คณะรัฐมนตรีสงครามรวมชุดใหมระบุวา:\n\n'ฝรั่งเศสและบริเตนใหญจะไมเปนสองชาติอีกตอไป แตจะเปนสหภาพฝรั่งเศส-อังกฤษหนึ่งเดียว รัฐธรรมนูญของสหภาพจะกําหนดใหมีองคกรรวมดานการปองกันประเทศ การตางประเทศ การคลัง และนโยบายเศรษฐกิจ พลเมืองทุกคนของฝรั่งเศสหรืออังกฤษจะไดรับสัญชาติของอีกรัฐหนึ่งทันที'"
 news.35.a: "ฝรั่งเศสคงสิ้นหวังเต็มที"
 news.35.b: "พวกเขาคิดวาจะปลอดภัยภายใตธงผืนใหมหรือ?"
 news.35.c: "ผนึกกําลังตอตานศัตรูรวมกัน!"
 news.36.t: "อันชลุสสออสเตรีย"
 news.36.d: "หลังพรรคนาซีทองถิ่นในเวียนนากอรัฐประหารสําเร็จ ทหารเยอรมันไดขามชายแดนออสเตรียและเขาควบคุมประเทศ \n\nไมมีรายงานการสูรบ และทหารเยอรมันไดรับการตอนรับจากฝูงชนที่โหรองยินดีในเมืองตาง ๆ\n\nในสุนทรพจนตอหนาฝูงชนมหาศาลที่จัตุรัสเฮลเดนพลัทซในเวียนนา ฮิตเลอรไดประกาศอันชลุสสออสเตรีย ผนวกประเทศนี้เขากับเยอรมนี:\n\n'จังหวัดตะวันออกที่เกาแกที่สุดของชนชาติเยอรมัน นับแตนี้ไปจะเปนปราการดานใหมลาสุดของไรชเยอรมัน!'"
 news.36.a: "ถานั่นคือสิ่งที่พวกเขาตองการ..."
 news.36.b: "ยินดีตอนรับสูไรช!"
 news.36.c: "เราตองรักษาความมั่นคงของพรมแดนทางเหนือ!"
 news.36.e: "นี่เปนการละเมิดสนธิสัญญาแวรซาย!"
 news.37.t: "การลอบสังหารเลฟ ทรอตสกี"
 news.37.d: "เลฟ ทรอตสกี อดีตมือขวาคนสําคัญและผูที่ถูกคาดหมายวาจะสืบทอดอํานาจตอจากวลาดีมีร อิลิช เลนิน ไดเสียชีวิตแลววันนี้ที่โรงพยาบาลแหงหนึ่งในกรุงเม็กซิโกซิตี เขาถูกชายสัญชาติสเปนซึ่งเชื่อวาทํางานใหหนวย NKVD ทํารายดวยขวานนํ้าแข็งภายในบานพัก\n\nหลังพายแพในการแยงชิงอํานาจกับ $SOV_iosif_stalin$ และพรรคพวกเพื่อควบคุมพรรคคอมมิวนิสตแหงสหภาพโซเวียต ทรอตสกีใชชีวิตชวงทศวรรษ 1930 ในการลี้ภัย โดยพํานักอยูในตุรกี ฝรั่งเศส และนอรเวย กอนจะลงหลักปกฐานในเม็กซิโกในที่สุด \n\nเขายังคงวิพากษวิจารณสตาลินและ 'รัฐ 'กรรมกร' ที่เสื่อมทราม' ของสหภาพโซเวียตอยูเสมอ"
 news.37.a: "ปาเถื่อน"
 news.37.b: "ภารกิจสําเร็จ"
 news.37.c: "จุดจบที่สมควรแลวสําหรับนักปลุกปนคนนั้น"
 news.38.t: "ทรอตสกีรอดจากการลอบสังหาร"
 news.38.d: "หลังการตอสูอยางรุนแรงในบานพักที่เม็กซิโกซิตีเมื่อชวงเชาวันนี้ เลฟ ทรอตสกีไดสังหารมือสังหารดวยขวานนํ้าแข็งที่ชายผูนั้นพยายามใชทํารายเขา ผูกอเหตุไดรับการระบุตัววาเปนชายสัญชาติสเปนซึ่งเชื่อวาทํางานใหหนวย NKVD\n\nทรอตสกีเคยเปนมือขวาคนสําคัญและผูที่ถูกคาดหมายวาจะสืบทอดอํานาจตอจากวลาดีมีร เลนิน แตหลังพายแพในการแยงชิงอํานาจ เขาถูก $SOV_iosif_stalin$ บีบใหลี้ภัยออกจากสหภาพโซเวียต \n\nทรอตสกีใหสัมภาษณสื่อมวลชน ประณามความพยายามลอบสังหารครั้งนี้วาเปน 'แผนการขี้ขลาดอีกครั้งของสตาลินเพื่อปดปากผูวิจารณ'"
 news.38.a: "นาสนใจ"
 news.38.b: "ไอหนอนนั่น!"
 news.39.t: "ทรอตสกีถูกสังหารที่ชายแดนโซเวียต"
 news.39.d: "ทางการโซเวียตไดเผยแพรภาพศพของเลฟ ทรอตสกี ยืนยันขาวลือวาเขาถูกสังหารเมื่อไมนานมานี้ขณะพยายามลักลอบเขา [SOV.GetNameDef] \n\nพบศพของเขาถูกคลื่นซัดเกยฝงแมนํ้าอาเตรกซึ่งไหลเลียบพรมแดนโซเวียต - เปอรเซีย\n\nเชื่อกันวาทรอตสกีพยายามฉวยประโยชนจากความวุนวายภายในสหภาพโซเวียต โดยหาพันธมิตรตอตานสตาลินคูปรับเกาแก และหวังจะโคนเขาดวยการรัฐประหาร"
 news.39.a: "นาสนใจ"
 news.39.b: "อยางนอยก็หมดภัยไปหนึ่ง"
 news.40.t: "ทรอตสกีกอรัฐประหาร!"
 news.40.d: "เกิดการแยงชิงอํานาจอยางรุนแรงขึ้นในเมืองหลวงชั่วคราวของโซเวียต ดูเหมือนวาเลฟ ทรอตสกีไดลอบเขาสูสิ่งที่หลงเหลือของสหภาพโซเวียต ยุติการลี้ภัยอันยาวนานที่เขาถูกบังคับใหตองเผชิญ \n\nเขารวมมือกับพันธมิตรในระดับสูงสุดของพรรคคอมมิวนิสต กอรัฐประหารโคนสตาลินไดสําเร็จ\n\nหลังการพิจารณาคดีอยางรวบรัดโดยศาลประชาชน สตาลินถูกตัดสินประหารชีวิตดวยการแขวนคอ และไดมีการลงโทษไปแลวเมื่อเชานี้"
 news.40.a: "ไมคาดคิดเลย"
 news.40.b: "สหายทรอตสกีจงเจริญ!"
 news.41.t: "จุดจบของทรอตสกี"
 news.41.d: "เชาวันนี้พบเลฟ ทรอตสกีเสียชีวิตในหองพักโรงแรมแหงหนึ่งในบัวโนสไอเรส \n\nดูเหมือนเขาจะถูกรัดคอจนเสียชีวิตดวยสายรัดปนเขา และองครักษของทรอตสกีจับกุมฆาตกรไดกอนที่เขาจะออกจากอาคาร\n\nแมฆาตกรจะเปนชาวโปรตุเกส แตมีหลักฐานเชื่อมโยงเขากับ GRU หนวยขาวกรองของโซเวียต ดูเหมือนวาในที่สุดสตาลินก็ไดจัดการคูปรับเกาของเขาจนสิ้นชีพ"
 news.42.t: "โศกนาฏกรรมฮินเดนบวรก"
 news.42.d: "เรือเหาะโดยสารฮินเดนบวรกของเยอรมนีถูกทําลายในวันนี้ขณะพยายามเทียบทาที่สถานีอากาศนาวีเลคเฮิรสตในสหรัฐอเมริกา ดวยสาเหตุที่ยังไมทราบแนชัด เรือเหาะถูกเปลวไฟลุกทวมและตกกระแทกพื้น คราชีวิตผูคน 35 ราย\n\nเนื่องจากฮีเลียมหายากและมีราคาแพง ประกอบกับสหรัฐฯ หามสงออก ฮินเดนบวรกเชนเดียวกับเรือเหาะโดยสารเยอรมันทุกลําจึงถูกออกแบบใหใชไฮโดรเจน ซึ่งใหแรงยกมากกวาแตก็ติดไฟไดงาย \n\nเมื่อความเชื่อมั่นของสาธารณชนสั่นคลอนจากโศกนาฏกรรมครั้งนี้ ประกอบกับการเกิดขึ้นของเครื่องบินโดยสารที่เร็วกวามาก นี่อาจเปนจุดจบของยุคเรือเหาะ"
 news.42.a: "โอ มนุษยชาติ!"
 news.43.t: "อุบัติเหตุฮินเดนบวรก"
 news.43.d: "วันนี้หายนะถูกหลีกเลี่ยงไดอยางหวุดหวิด เมื่อพบรอยรั่วของนํ้ามันดีเซลบนเรือเหาะโดยสารฮินเดนบวรกของเยอรมนีขณะกําลังเขาเทียบทาที่สถานีอากาศนาวีเลคเฮิรสตในสหรัฐอเมริกา\n\nรอยรั่วไดรับการซอมแซมทันที หากไมมีใครสังเกตเห็น ไอระเหยที่ติดไฟไดอาจทําใหเกิดเพลิงลุกทวมทั้งลํา \n\nนักวิจารณตั้งคําถามมานานแลวถึงความเหมาะสมของเรือเหาะโดยสาร เนื่องจากประวัติดานความปลอดภัยที่ไมแนนอน และเหตุการณครั้งนี้ยอมทําใหพวกเขาสงเสียงดังยิ่งขึ้น"
 news.43.a: "เฉียดฉิว"
 news.44.t: "เที่ยวบินของรูดอลฟ เฮสส"
 news.44.d: "เมื่อวานนี้ รองทานผูนํารูดอลฟ เฮสส ถูกทหารหนวยรักษาดินแดนจับกุมในสกอตแลนด หลังกระโดดรมลงมาจากเครื่องบินขับไลหนัก \n\nเขาเปนนักบินฝมือดี และดูเหมือนจะบินขามทะเลเหนือเพียงลําพัง โดยระวังไมใหเขาระยะเรดาร กอนจะเลี้ยวไปทางตะวันตกมุงหนาสูอังกฤษ\nดูเหมือนเฮสสจะตัดสินใจเองที่จะเจรจาสนธิสัญญาสันติภาพระหวางอังกฤษกับเยอรมนี แมเบอรลินจะประณามวาเขาเปนคนวิกลจริตและปลดเขาออกจากตําแหนงทางการเมืองทั้งหมดแลวก็ตาม \n\nทางการอังกฤษยังไมใหความเห็นใด ๆ"
 news.44.a: "นาสนใจ"
 news.44.b: "บาไปแลว!"
 news.44.c: "สงเขาไปขังที่หอคอยลอนดอน!"
 news.45.t: "การเสียชีวิตของรูดอลฟ เฮสส"
 news.45.d: "เมื่อวานนี้ รองทานผูนํารูดอลฟ เฮสส เสียชีวิต เมื่อกองทัพอากาศอังกฤษสกัดกั้นเครื่องบินขับไลหนักที่เขาขับอยูนอกชายฝงสกอตแลนด \n\nยังไมชัดเจนวาภารกิจของเขาคืออะไร - แมเฮสสจะเปนนักบินฝมือดี แตเขาบินมาลําพังและเครื่องบินก็ดูเหมือนจะไมไดติดอาวุธ\nทางการอังกฤษไดเก็บกูรางของเขาไว แตเบอรลินไดกําหนดจัดรัฐพิธีศพโดยใชโลงศพเปลา \n\nมีรายงานวาฮิตเลอรโศกเศราอยางเห็นไดชัดกับการเสียชีวิตของเพื่อนเกา"
 news.45.a: "นาสนใจ"
 news.45.b: "เจาโงผูนาสงสาร"
 news.45.c: "เขามาทําอะไรที่นี่?"
 news.46.d: "วันนี้เรือเหาะฮินเดนบวรกพบจุดจบอยางนาตื่นตะลึงเมื่อระเบิดกลางอากาศเหนือสกอตแลนด \nดูเหมือนวารองทานผูนํารูดอลฟ เฮสส ไดยึดเรือเหาะลํานี้และบินขามทะเลเหนือเพียงลําพัง ในภารกิจสวนตัวเพื่อเจรจาสันติภาพกับอังกฤษ\nสถานีเรดารของอังกฤษตรวจจับอากาศยานขนาดมหึมาลํานี้ไดโดยไมยาก และฝูงบินหลายฝูงของกองทัพอากาศอังกฤษถูกสั่งใหมุงหนาไปยังตําแหนงของมันทันที เมื่อฮินเดนบวรกไมตอบรับทางวิทยุ พวกเขาก็เปดฉากยิง \n\nเฮสสกระโดดรมลงมาไดอยางปลอดภัย และขณะนี้ถูกคุมขังอยูในหอคอยลอนดอน"
 news.47.d: "วันนี้เรือเหาะฮินเดนบวรกพบจุดจบอยางนาตื่นตะลึงเมื่อระเบิดกลางอากาศเหนือสกอตแลนด \nดูเหมือนวารองทานผูนํารูดอลฟ เฮสส ไดยึดเรือเหาะลํานี้และบินขามทะเลเหนือเพียงลําพัง ในภารกิจสวนตัวเพื่อเจรจาสันติภาพกับอังกฤษ\nสถานีเรดารของอังกฤษตรวจจับอากาศยานขนาดมหึมาลํานี้ไดโดยไมยาก และฝูงบินหลายฝูงของกองทัพอากาศอังกฤษถูกสั่งใหมุงหนาไปยังตําแหนงของมันทันที เมื่อฮินเดนบวรกไมตอบรับทางวิทยุ พวกเขาก็เปดฉากยิง \n\nพบรางของเฮสสในซากเรือเหาะ"
 news.47.b: "ไอคนบานั่น..."
 news.47.c: "เขาหวังจะไดอะไรกัน?"
 news.48.t: "อมีเลีย แอรฮารตหายสาบสูญ"
 news.48.d: "อมีเลีย แอรฮารต นักบินชื่อดังและสตรีคนแรกที่บินเดี่ยวขามมหาสมุทรแอตแลนติกไดสําเร็จ ไดหายสาบสูญไปพรอมกับเฟรด นูนัน ผูนํารองของเธอ ใกลเกาะฮาวแลนดกลางมหาสมุทรแปซิฟก\n\nทั้งสองกําลังพยายามบินรอบโลกดวยเครื่องบินล็อกฮีด อิเล็กตราสองเครื่องยนตขณะที่หายตัวไป \n\nขณะนี้กองทัพเรือและหนวยยามฝงสหรัฐฯ กําลังคนหานักบินทั้งสอง แตมีความหวังนอยมากที่จะพบตัว"
 news.48.a: "ความสูญเสียของวงการการบิน"
 news.49.t: "อมีเลีย แอรฮารตบินรอบโลกสําเร็จ"
 news.49.d: "อมีเลีย แอรฮารต นักบินชื่อดังที่หลายคนรูจักในนาม 'ราชินีแหงเวหา' ไดบินรอบโลกสําเร็จพรอมกับเฟรด นูนัน ผูนํารองของเธอ \n\nหลังเกิดเหตุระทึกสั้น ๆ เมื่อทั้งคูหลงทางชั่วคราวขณะบินเขาใกลเกาะฮาวแลนดในแปซิฟก เที่ยวบินก็ดําเนินตอไปโดยไมมีเหตุการณใด และเชาวันนี้เครื่องบินล็อกฮีด อิเล็กตราของพวกเขาไดลงจอดที่โอกแลนด รัฐแคลิฟอรเนีย\n\nจะมีการจัดพิธีที่ทําเนียบขาวในสัปดาหหนา โดยประธานาธิบดีจะแสดงความยินดีกับแอรฮารตดวยตนเองสําหรับความสําเร็จครั้งนี้"
 news.49.a: "ชางเปนความสําเร็จที่ยิ่งใหญ!"
 news.55.t: "พันธมิตรอังกฤษ-โปแลนด"
 news.55.d: "ในเมื่อเยอรมนีแสดงพฤติกรรมกาวราวในชวงที่ผานมา สหราชอาณาจักรและฝรั่งเศสจึงรูสึกจําเปนตองลงนามเปนพันธมิตรทางทหารกับโปแลนด นายกรัฐมนตรีอังกฤษไดแถลงตอสภาสามัญดังนี้:\n\n'ในกรณีที่มีการกระทําใดซึ่งคุกคามเอกราชของโปแลนดอยางชัดแจง และรัฐบาลโปแลนดเห็นวาจําเปนอยางยิ่งที่จะตองตอตานดวยกําลังทหารของชาติ รัฐบาลแหงสมเด็จพระราชาธิบดีจะถือวาตนมีพันธะตองใหการสนับสนุนรัฐบาลโปแลนดทันทีอยางเต็มกําลังความสามารถ และไดใหคํารับรองในเรื่องนี้แกรัฐบาลโปแลนดแลว'"
 news.55.a: "สถานการณเปลี่ยนแปลงรวดเร็วขึ้นทุกที"
 news.55.b: "พวกเขาแคขู!"
 news.55.c: "เรายืนเคียงขางโปแลนด"
 news.55.e: "ตอนนี้พวกเยอรมันไมกลาบุกแน!"
 news.55.f: "เรายืนเคียงขางพันธมิตรของเรา"
 news.56.t: "ขอตกลงมิวนิก"
 news.56.d: "ขอเรียกรองของเยอรมนีเหนือดินแดนซูเดเทินในเชโกสโลวาเกีย ซึ่งเปนถิ่นที่อยูของชนกลุมนอยเยอรมันจํานวนมาก ไดทวีความรุนแรงขึ้น \n\nในการประชุมสุดยอดที่มิวนิก เยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีพยายามหาทางออกทางการทูตสําหรับสิ่งที่เรียกวา 'วิกฤตซูเดเทิน' โดยไมไดเชิญเชโกสโลวาเกียเขารวม ที่ประชุมบรรลุขอตกลงใหเยอรมนีผนวกซูเดเทินแลนด แตจะไมแสวงหาดินแดนเพิ่มเติมในยุโรปอีก\n\nนายแชมเบอรเลนกลาวตอฝูงชนในลอนดอน:\n'นี่เปนครั้งที่สองที่นายกรัฐมนตรีกลับจากเยอรมนีพรอมนําสันติภาพอันทรงเกียรติกลับมา ขาพเจาเชื่อวานี่คือสันติภาพสําหรับยุคสมัยของเรา'"
 news.56.a: "ถาอยางนั้นปนี้ก็ไมมีสงคราม"
 news.56.b: "อยางนอยก็สงบไปไดชั่วคราว..."
 news.56.c: "เรารอดพนจากสงครามโลกอีกครั้งแลว"
 news.56.e: "นี่ไมใชขอตกลง แตเปนคําบัญชา!"
 news.57.t: "วิกฤตซูเดเทิน"
 news.57.d: "ขอเรียกรองของเยอรมนีเหนือดินแดนชายแดนซูเดเทินในเชโกสโลวาเกีย ซึ่งเปนถิ่นที่อยูของชนกลุมนอยเยอรมันจํานวนมาก ไดทวีความรุนแรงขึ้นในชวงที่ผานมา \n\nในการประชุมสุดยอดที่มิวนิก เยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีพยายามหาทางออกทางการทูตสําหรับสิ่งที่เรียกวา 'วิกฤตซูเดเทิน'\n\nอยางไรก็ตาม การเจรจาดูเหมือนจะลมเหลว โดยทั้งอังกฤษและพันธมิตรไดสงคําเตือนอยางหนักแนนถึงเยอรมนีวา หากทหารเยอรมันขามพรมแดนเชโกสโลวาเกีย ผลลัพธคือสงคราม \n\nเวลาสําหรับการแกไขขอพิพาทอยางสันติดูเหมือนจะเหลือนอยลงทุกที"
 news.57.a: "ดูเหมือนวาสงครามจะเกิดขึ้นแน!"
 news.57.b: "พวกโง!"
 news.57.c: "ถึงเวลาที่ตองยืนหยัดแลว"
 news.57.e: "ใหพวกเยอรมันมาเลย!"
 news.58.d: "ขอเรียกรองของเยอรมนีเหนือดินแดนชายแดนซูเดเทินในเชโกสโลวาเกีย ซึ่งเปนถิ่นที่อยูของชนกลุมนอยเยอรมันจํานวนมาก ไดทวีความรุนแรงขึ้นในชวงที่ผานมา \n\nในการประชุมสุดยอดที่มิวนิก เยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีพยายามหาทางออกทางการทูตสําหรับสิ่งที่เรียกวา 'วิกฤตซูเดเทิน'\n\nเกิดรอยราวระหวางฝรั่งเศสกับอังกฤษ โดยอังกฤษยอมรับวาขอเรียกรองของเยอรมนีสมเหตุสมผล แตฝรั่งเศสไมยอมรับ ฝรั่งเศสไดจัดตั้งพันธมิตรใหมกับเช็ก และขูเยอรมนีวาจะเกิดสงครามหากทหารเยอรมันละเมิดพรมแดนเชโกสโลวาเกีย"
 news.58.b: "อีกไมนานเราจะจัดการพวกฝรั่งเศสเอง"
 news.58.c: "คราวนี้ฝรั่งเศสตองสูตามลําพัง"
 news.58.e: "ตอนนี้พวกเยอรมันไมกลาบุกแน... ใชไหม?"
 news.58.f: "โลกเสรีกําลังฝากความหวังไวกับเรา"
 news.59.t: "คําบัญชามิวนิก"
 news.59.d: "ขอเรียกรองของเยอรมนีเหนือดินแดนชายแดนซูเดเทินในเชโกสโลวาเกีย ซึ่งเปนถิ่นที่อยูของชนกลุมนอยเยอรมันจํานวนมาก ไดทวีความรุนแรงขึ้นในชวงที่ผานมา \n\nในการประชุมสุดยอดที่มิวนิก เยอรมนี อังกฤษ ฝรั่งเศส และอิตาลีพยายามหาทางออกทางการทูตสําหรับสิ่งที่เรียกวา 'วิกฤตซูเดเทิน'\n\nขณะที่ทั้งอังกฤษและฝรั่งเศสยอมรับวาขอเรียกรองของเยอรมนีสมเหตุสมผล เชโกสโลวาเกียซึ่งไมไดรับเชิญเขารวมการประชุมกลับปฏิเสธที่จะยอมแมแตนิ้วเดียว \n\nบัดนี้เชโกสโลวาเกียตองเผชิญหนากับเยอรมนีตามลําพังในการตอสูที่ดูไรความหวัง"
 news.59.a: "สถานการณดูมืดมนสําหรับชาวเช็ก"
 news.59.b: "พวกโงหัวดื้อ"
 news.59.c: "เราจะไมมีวันยอมจํานน!"
 news.60.t: "ชะตากรรมของเชโกสโลวาเกีย"
 news.60.d: "ทหารเยอรมันไดขามเขาสูโบฮีเมียและโมราเวีย โดยอางวาเพื่อฟนฟูความสงบเรียบรอยในภูมิภาคภายหลังรัฐบาลเชโกสโลวาเกียลมสลาย \n\nที่ปราก กองกําลังยึดครองไดประกาศจัดตั้ง 'รัฐในอารักขาปกครองตนเอง' ขึ้นภายในไรชเยอรมัน\n\nดวยการสนับสนุนจากเยอรมนี สโลวาเกียไดประกาศเอกราชภายใตการนําของยอเซฟ ทิโซ ประเทศเชโกสโลวาเกียไดสิ้นสุดลงแลว"
 news.60.d_2: "ภายหลังเยอรมนีผนวกเชโกสโลวาเกีย การหารือวาควรแบงดินแดนเหลานี้อยางไรยังคงดําเนินตอไป และบัดนี้ดูเหมือนวาจะไดขอสรุปแลว\n\nดวยการสนับสนุนจากเยอรมนี สโลวาเกียไดประกาศเอกราชภายใตการนําของยอเซฟ ทิโซ"
 news.60.a: "สันติภาพก็มีเพียงเทานี้"
 news.60.b: "ชาวเช็กตองไดรับการปกปองจากตัวพวกเขาเอง"
 news.60.c: "นี่ไมใชสิ่งที่เราตกลงกันไว!"
 news.60.e: "ฮังการีจะกลับคืนสูความรุงโรจนดังเดิม!"
 news.61.d: "ทหารเยอรมันไดขามเขาสูโบฮีเมียและโมราเวียเมื่อไมนานมานี้ โดยอางวาเพื่อฟนฟูความสงบเรียบรอยในภูมิภาคภายหลังรัฐบาลเชโกสโลวาเกียลมสลาย \n\nที่ปราก กองกําลังยึดครองไดประกาศจัดตั้ง 'รัฐในอารักขาปกครองตนเอง' ขึ้นภายใน [GER.GetNameDef] ขณะที่กองกําลังฮังการีซึ่งปฏิบัติการโดยไดรับความยินยอมจากเยอรมนีไดเดินทัพเขาสโลวาเกียและผนวกเขากับฮังการี \n\nประเทศเชโกสโลวาเกียไดสิ้นสุดลงแลว"
 news.61.d_2: "ภายหลังเยอรมนีผนวกเชโกสโลวาเกีย การหารือวาควรแบงดินแดนเหลานี้อยางไรยังคงดําเนินตอไป และบัดนี้ดูเหมือนวาจะไดขอสรุปแลว\n\nกองกําลังฮังการีซึ่งปฏิบัติการโดยไดรับความยินยอมจากเยอรมนีไดเดินทัพเขาสโลวาเกียและผนวกเขากับฮังการี"
 news.62.d: "ทหารเยอรมันไดขามเขาสูโบฮีเมียและโมราเวียเมื่อไมนานมานี้ โดยอางวาเพื่อฟนฟูความสงบเรียบรอยในภูมิภาคภายหลังรัฐบาลเชโกสโลวาเกียลมสลาย \n\nที่ปราก กองกําลังยึดครองไดประกาศจัดตั้ง 'รัฐในอารักขาปกครองตนเอง' ขึ้นภายในไรชเยอรมัน\n\nนอกจากนี้ยังมีการประกาศจัดตั้งรัฐในอารักขาแหงที่สองซึ่งมีศูนยกลางอยูที่สโลวาเกียในบราติสลาวา เชโกสโลวาเกียทั้งหมดจึงถูกผนวกเขากับเยอรมนีโดยปริยาย"
 news.62.d_2: "ภายหลังเยอรมนีผนวกเชโกสโลวาเกีย การหารือวาควรแบงดินแดนเหลานี้อยางไรยังคงดําเนินตอไป และบัดนี้ดูเหมือนวาจะไดขอสรุปแลว\n\nดินแดนที่ถูกผนวกไดรับการจัดเปนรัฐในอารักขาสองแหง แตยังคงอยูใตการควบคุมของเยอรมนี ในทางปฏิบัติแทบไมมีอะไรเปลี่ยนแปลงไปจากเดิม และเยอรมนียังคงครอบครองเชโกสโลวาเกียทั้งหมด"
 news.63.t: "สงครามกลางเมืองสเปน"
 news.63.d: "สงครามกลางเมืองไดปะทุขึ้นในสเปน! นายพลหลายคนที่ตองการโคนลมรัฐบาลปจจุบันในมาดริดไดออกประกาศกอการ และกองทัพสเปนจํานวนมากไดขานรับการเรียกรองใหจับอาวุธ \n\nฝายชาตินิยมขวาจัดนี้ไดยึดครองพื้นที่สวนใหญของสเปน รวมถึงดินแดนโพนทะเล\nกองกําลังฝายภักดีและอาสาสมัครไดรวมตัวกันภายใตรัฐบาลสาธารณรัฐฝายซาย มุงมั่นที่จะตอตานการกอกบฏจนถึงลมหายใจสุดทาย \n\nศึกชิงสเปนไดเริ่มตนขึ้นแลว"
 news.63.a: "เรื่องนี้จะมีความหมายอยางไรตอสเปน?"
 news.63.b: "มุงสูชัยชนะ!"
 news.64.t: "จุดจบของสงครามกลางเมืองสเปน"
 news.64.d: "เมื่อที่มั่นสุดทายของฝายสาธารณรัฐยอมจํานน สงครามกลางเมืองสเปนก็สิ้นสุดลง \n\nฝายชาตินิยมไดรับชัยชนะ และยุคใหมไดเริ่มตนขึ้นสําหรับสเปน \n\nประเทศที่บอบชํ้าจากสงครามไดรับความเสียหายอยางหนักจากการสูรบ และยังมีอีกมากที่ตองฟนฟู"
 news.64.a: "พัฒนาการที่นาสนใจ"
 news.64.b: "ถึงเวลาเยียวยาชาติของเราแลว"
 news.65.a: "ดีสําหรับสเปน"
 news.65.d: "เมื่อกองกําลังสุดทายของฝายชาตินิยมยอมจํานน สงครามกลางเมืองสเปนก็สิ้นสุดลง \n\nฝายสาธารณรัฐไดรับชัยชนะ และยุคใหมไดเริ่มตนขึ้นสําหรับสเปน \n\nประเทศที่บอบชํ้าจากสงครามไดรับความเสียหายอยางหนักจากการสูรบ และยังมีอีกมากที่ตองฟนฟู"
 news.66.t: "กีฬาโอลิมปกครั้งที่ 11"
 news.66.d: "กีฬาโอลิมปกครั้งที่ 11 เพิ่งจัดขึ้นที่กรุงเบอรลิน ประเทศเยอรมนี \n\nโอลิมปกฤดูรอน 1936 ซึ่งมีนักกีฬาจาก 49 ชาติทั่วโลกเขารวม เปนครั้งแรกในประวัติศาสตรที่มีการถายทอดสดทางโทรทัศนแมจะในวงจํากัด การแขงขันครั้งนี้เปนชัยชนะทางการโฆษณาชวนเชื่อครั้งสําคัญของระบอบเยอรมัน ซึ่งทุมงบประมาณมหาศาลใหกับงานนี้\n\nนักกีฬาเยอรมันประสบความสําเร็จสูงสุด ควา 33 เหรียญทอง สวนอเมริกันตามมาเปนอันดับสองดวย 24 เหรียญ โดยสี่เหรียญในนั้นเปนของเจสซี โอเวนส นักกีฬาที่ประสบความสําเร็จสูงสุดของการแขงขัน"
 news.66.d.b: "กีฬาโอลิมปกครั้งที่ 11 เพิ่งจัดขึ้นในพื้นที่ที่ไมไดรับความเสียหายของกรุงเบอรลิน ประเทศเยอรมนี ซึ่งพังพินาศและกําลังฟนฟูขึ้นใหม\n\nโอลิมปกฤดูรอน 1936 ซึ่งมีนักกีฬาจาก 49 ชาติทั่วโลกเขารวม เปนครั้งแรกในประวัติศาสตรที่มีการถายทอดสดทางโทรทัศนแมจะในวงจํากัด การแขงขันซึ่งเปนสัญลักษณของเอกภาพแหงชาติเยอรมันที่ฟนคืนมานี้ ยังเปนชัยชนะทางการโฆษณาชวนเชื่อครั้งสําคัญของระบอบเยอรมันใหม ซึ่งทุมงบประมาณมหาศาลใหกับงานนี้ แมจะตองแบกรับคาใชจายมหาศาลในการฟนฟูประเทศหลังสงครามกลางเมือง\n\nนักกีฬาเยอรมันประสบความสําเร็จสูงสุด ควา 33 เหรียญทอง สวนอเมริกันตามมาเปนอันดับสองดวย 24 เหรียญ โดยสี่เหรียญในนั้นเปนของเจสซี โอเวนส นักกีฬาที่ประสบความสําเร็จสูงสุดของการแขงขัน"
 news.66.a: "การแขงขันสิ้นสุดลงแลว"
 news.66.b: "เราไดแสดงดานที่ดีที่สุดของเราใหโลกเห็นแลว"
 news.67.t: "กีฬาโอลิมปกครั้งที่ 12"
 news.67.d: "กีฬาโอลิมปกครั้งที่ 12 เพิ่งจัดขึ้นที่กรุงโตเกียว ประเทศญี่ปุน ทามกลางความตึงเครียดระหวางประเทศที่เพิ่มขึ้น หลายคนเกรงวาการแขงขันจะถูกยกเลิก แตก็ไมเปนเชนนั้น \n\nโตเกียวเปนเมืองแรกนอกโลกตะวันตกที่ไดเปนเจาภาพโอลิมปก และเครื่องบินพิสัยไกล Me 261 ที่สรางขึ้นเปนพิเศษไดนําคบเพลิงโอลิมปกจากเยอรมนีมายังโตเกียวโดยไมตองเติมเชื้อเพลิง\n\nนักกีฬาญี่ปุนทําผลงานไดดี โดย 14 เหรียญทองทําใหไดอันดับสามในตารางเหรียญ รองจากเยอรมนีและสหรัฐอเมริกา"
 news.68.d: "กีฬาโอลิมปกครั้งที่ 12 เพิ่งจัดขึ้นที่กรุงเฮลซิงกิ ประเทศฟนแลนด \n\nเดิมการแขงขันมีกําหนดจัดที่โตเกียว แตการทําสงครามที่ยังดําเนินอยูของญี่ปุนทําใหเปนไปไมได คณะกรรมการโอลิมปกสากลจึงมอบสิทธิ์เจาภาพใหเฮลซิงกิแทน\n\nนักกีฬาจากสหรัฐอเมริกาควาเหรียญมากที่สุด ตามดวยเยอรมนีและอิตาลี สวนฟนแลนดไดอันดับสี่ดวย 10 เหรียญทอง"
 news.69.t: "การขยายอํานาจของโซเวียตในยุโรป"
 news.69.d: "นับตั้งแต [From.GetRulingParty] ขึ้นสูอํานาจ [From.GetNameDef] ไดพยายามกระชับความสัมพันธกับ [SOV.GetNameDef] มาโดยตลอด และบัดนี้ไดเขารวมเปนสวนหนึ่งของสหภาพแลว\n\nเมื่อไมกี่วันกอน รัฐบาล[From.GetAdjective]ไดมอบอํานาจควบคุมประเทศใหแก [SOV.GetNameDef] อยางเปนทางการในฐานะแควนหนึ่งของสหภาพ\n\nเจาหนาที่โซเวียตปฏิเสธคํากลาวที่วาการผนวก [From.GetNameDef] เมื่อเร็ว ๆ นี้เปนการรุกราน โดยอางวา "การรวมดินแดน" เกิดขึ้นโดยปราศจากแรงกดดันจากภายนอก"
 news.69.a: "พวกเขาเห็นเหตุผลแลว"
 news.69.b: "[SOV.GetNameDefCap] กําลังขยายอํานาจ"
 news.70.t: "อิทธิพลของโซเวียตในยุโรป"
 news.70.d: "นับตั้งแต [baltic_annexation.GetRulingParty] ขึ้นสูอํานาจ [baltic_annexation.GetNameDef] ไดพยายามกระชับความสัมพันธกับ [SOV.GetNameDef] มาโดยตลอด\n\nแม [baltic_annexation.GetLeader] จะยังดํารงตําแหนงอยู แตรัฐมนตรีลวนไดรับเลือกจากความภักดีตอ [SOV.GetNameDef] และอธิปไตยสวนใหญของชาติไดถูกยกใหไปแลว เจาหนาที่โซเวียตแถลงวา [baltic_annexation.GetName] เพียงแตแสวงหาการคุมครอง ในขณะที่ยุโรปไมปลอดภัยสําหรับชาติเล็ก ๆ มากขึ้นทุกที\n\n[SOV.GetNameDef] ยังยํ้าอีกวาพรอมจะมอบ "การคุมครอง" เชนนี้ใหแกรัฐใดก็ตามที่รูสึกถูกคุกคามจากประเทศเพื่อนบาน"
 news.100.t: "การลมสลายของวอรซอ"
 news.100.d: "กองกําลังเยอรมันที่รุกคืบใน [POL.GetNameDef] ไดยึดวอรซอไดสําเร็จ \n\nการสูรบประปรายยังคงดําเนินอยูในยานปรากาและอีกไมกี่เขต แตการตอตานอยางเปนระบบในเมืองดูเหมือนจะยุติลงแลว\n\nมีรายงานวารัฐบาลโปแลนดไดอพยพออกจากเมืองตั้งแตหนวยแรกของเยอรมันเขาถึงชานกรุงวอรซอ และขณะนี้ยังไมทราบที่อยู\n\nการสูรบกับผูรุกรานชาวเยอรมันยังดําเนินตอไปในสวนอื่นของประเทศ แตการเสียเมืองหลวงเปนการกระทบกระเทือนอยางหนักตอการทําสงครามของโปแลนด"
 news.100.a: "โปแลนดไมมีโอกาสเลย"
 news.100.b: "อีกหนึ่งชัยชนะเพื่อปตุภูมิ"
 news.100.c: "นี่คือหายนะ!"
 news.101.t: "การลมสลายของปารีส"
 news.101.d: "ขณะที่การสูรบยังคงดุเดือดในสวนอื่นของ [FRA.GetNameDef] มีรายงานวาทหารเยอรมันไดเขาสูปารีสแลว \n\nกองกําลังฝรั่งเศสประกาศใหเมืองหลวงเปนเมืองเปดเพียงไมนานกอนที่หนวยสุดทายจะถอนตัว ขบวนทหารเยอรมันหลายขบวนไดจําลองการเดินสวนสนามฉลองชัยของปรัสเซียในป 1871 ดวยการเดินทัพไปตามถนนช็องเซลีเซ ขณะที่ชาวปารีสเฝามองดวยความเงียบงันอยางตกตะลึง \n\nผูเชี่ยวชาญทางทหารคาดการณวาการลมสลายของ [FRA.GetNameDef] ใกลเขามาแลว"
 news.101.a: "กองทัพของ [GER.GetNameDefCap] ดูเหมือนจะไมมีใครหยุดได!"
 news.102.t: "การลมสลายของลอนดอน"
 news.102.d: "รายงานจากลอนดอนยืนยันวาเมืองหลวงของอังกฤษถูกยึดโดยทหารเยอรมันที่รุกคืบเขามาแลว \n\nยังคงไดยินเสียงปนเล็กจากบางเขต แตไมพบกองกําลังอังกฤษที่มีนัยสําคัญภายในเมือง\n\nพลรมเยอรมันหนวยหนึ่งไดบุกเขาพระราชวังบักกิงแฮม แตเชื่อวาราชวงศไดเสด็จลี้ภัยไปกอนการโจมตีนานแลว \n\nนับเปนครั้งแรกนับตั้งแตสมัยพระเจาวิลเลียมผูพิชิตที่ลอนดอนตกอยูในมือผูรุกรานตางชาติ"
 news.400.t: "การลมสลายของ [43.GetCapitalVictoryPointName]"
 news.400.desc: "รายงานจาก [43.GetCapitalVictoryPointName] ยืนยันวาเมืองหลวงของ[HUN.GetAdjective]ถูกยึดโดยทหาร[FROM.GetAdjective]ที่รุกคืบเขามาแลว \n\nยังคงไดยินเสียงปนเล็กจากปอมปราการบางแหงริมฝงแมนํ้าดานูบ แตไมพบกองกําลัง[HUN.GetAdjective]ที่มีนัยสําคัญภายในเมือง\n\nมีรายงานวาสะพานใหญขามแมนํ้าสวนใหญถูกทําลาย และบางแหงตกอยูใตการควบคุมของ [FROM.GetNameDef] \nเปนครั้งแรกในรอบหลายปที่จัตุรัสคอชุตเงียบสงัด และปราสาทบูดาตกอยูในมือตางชาติ"
 news.400.a: "การกระทบกระเทือนอยางหนักตอจิตวิญญาณ[HUN.GetAdjective]"
 news.400.b: "เราจะฟนตัวไดอยางไร?"
 news.401.t: "การลมสลายของ [43.GetCapitalVictoryPointName]"
 news.401.desc: "รายงานจาก [43.GetCapitalVictoryPointName] ยืนยันวาเมืองหลวงของ[HUN.GetAdjective]ถูกยึดโดยทหาร[SOV.GetAdjective]ที่รุกคืบเขามาแลว \n\nเมืองสวนใหญถูกทําลายยอยยับระหวางการลอมกอนถูกยึด และกองกําลังอาสาทองถิ่นยังคงปะทะกับทหาร[SOV.GetAdjective]อยู แมจะมีโอกาสสําเร็จนอยมาก \n\nบัดนี้ธง[SOV.GetAdjective]ไดถูกชักขึ้นเหนือปราสาทบูดา และนักการเมือง[HUN.GetAdjective]จํานวนมากถูกจับกุมระหวางการสูรบที่ผานมา นี่คือจุดจบของ [HUN.GetNameDef] หรือไม?"
 news.401.a: "พัฒนาการที่สําคัญ"
 news.401.b: "อีกหนึ่งชัยชนะเพื่อมาตุภูมิ!"
 news.401.c: "เราอาจใกลจุดจบกวาที่คิด"
 news.103.t: "การลมสลายของ [195.GetCapitalVictoryPointName]"
 news.103.d: "[195.GetCapitalVictoryPointName] แหลงกําเนิดการปฏิวัติรัสเซีย ไดแตกพายตอกองกําลังเยอรมันที่รุกคืบเขามา \n\nยังคงไดยินเสียงการสูรบประปรายจากชานเมืองบางแหง แตความสงบอันแปลกประหลาดดูเหมือนจะปกคลุมสวนที่เหลือของเมืองที่พังพินาศ\n\nเมื่อชวงเชาวันนี้ ขบวนทหารเยอรมันไดเดินทัพผานมหาวิหารเซนตไอแซก ซึ่งโดมขนาดใหญถูกทหารชางของกองทัพ[SOV.GetSovietArmyAdjectiveBasedOnIdeology]ทาสีเทาเพื่อหลบเลี่ยงสายตาของเครื่องบินทิ้งระเบิดลุฟทวัฟเฟอที่ออกตระเวน \nแมจะพยายามเพียงใด โดมก็ยังพรุนไปดวยรอยกระสุนและสะเก็ดระเบิด"
 news.103.c: "ตองมีคนถูกยิงเปาเพราะเรื่องนี้!"
 news.104.t: "การลมสลายของเคียฟ"
 news.104.d: "เคียฟ เมืองหลวงของสาธารณรัฐสังคมนิยมโซเวียตยูเครน ถูกยึดโดยกองทัพเยอรมันที่รุกคืบในสหภาพโซเวียต \n\nการเสียหนึ่งในเมืองสําคัญที่สุดเปนการกระทบกระเทือนอยางหนักตอโซเวียต แตคําถามยังคงอยูวาเยอรมันจะรักษาแรงสงไวไดหรือไม ไมนานหลังเยอรมันยึดเมืองได ทุนระเบิดนับพันที่ NKVD ฝงไวในอาคารตาง ๆ ริมถนนสายหลักเครชชาติกก็ถูกจุดระเบิด สรางความเสียหายเพิ่มเติมแกเมืองที่พังพินาศอยูแลว\n\nบัดนี้กองกําลังผูรุกรานหันไปมองทางตะวันออก"
 news.105.t: "การลมสลายของ [217.GetCapitalVictoryPointName]"
 news.105.d: "หัวหอกเยอรมันที่รุกคืบไดยึดสตาลินกราด เมืองที่ตั้งชื่อตามสตาลินริมฝงแมนํ้าวอลกา \n\nหลังฝาการสูรบผานซากโรงงานแทรกเตอรสตาลินกราดและยึดเนินมามาเยฟคูรกันอันสําคัญยิ่งทางยุทธศาสตรได เยอรมันไดผลักดันทหารโซเวียตกลุมสุดทายขามแมนํ้าวอลกาไปยังฝงตะวันออก ตามรายงานที่ยังไมไดรับการยืนยัน ทหารกองทัพแดงที่ยังหลงเหลือไดรวมมือกับกองโจรถอยลงไปในทอระบายนํ้าและหองใตดินเพื่อสูตอ \n\nอยางไรก็ตาม เชื่อวาไมมีการตอตานอยางเปนระบบที่มีนัยสําคัญหลงเหลืออยูแลว"
 news.105.d_alt: "หัวหอกเยอรมันที่รุกคืบไดยึด [217.GetCapitalVictoryPointName] ศูนยกลางอุตสาหกรรมริมฝงแมนํ้าวอลกา \n\nหลังฝาการสูรบผานซากโรงงานแทรกเตอร [217.GetCapitalVictoryPointName] และยึดเนินมามาเยฟคูรกันอันสําคัญยิ่งทางยุทธศาสตรได เยอรมันไดผลักดันทหาร[SOV.GetAdjective]กลุมสุดทายขามแมนํ้าวอลกาไปยังฝงตะวันออก ตามรายงานที่ยังไมไดรับการยืนยัน ทหารกองทัพ[SOV.GetSovietArmyAdjectiveBasedOnIdeology]ที่ยังหลงเหลือไดรวมมือกับกองโจรถอยลงไปในทอระบายนํ้าและหองใตดินเพื่อสูตอ \n\nอยางไรก็ตาม เชื่อวาไมมีการตอตานอยางเปนระบบที่มีนัยสําคัญหลงเหลืออยูแลว"
 news.106.t: "การลมสลายของมอสโก"
 news.106.d: "รุงเชาวันนี้ รถถังเยอรมันไดทลายสิ่งกีดขวางที่ตั้งขึ้นอยางเรงรีบบนถนนในมอสโก และมีผูพบเห็นรถกึ่งสายพานขนสงทหารราบยานเกราะลงที่จัตุรัสแดง \nควันหนาทึบจากไฟที่ลุกโหมหลายจุดในชานเมืองพวยพุงขึ้นสูทองฟา ขณะที่ทหารราบเยอรมันบุกเขาเครมลิน มีรายงานวาตองใชระเบิดมือและเครื่องพนไฟตอสูกับทหาร NKVD ที่ยืนหยัดปกปองทุกตารางนิ้วของพระราชวัง บัดนี้เมืองหลวงของรัสเซียตกอยูในมือเยอรมัน แตเหลือเพียงซากปรักหักพังที่ลุกเปนไฟ \n\nรายงานที่ยังไมไดรับการยืนยันระบุวาศพอาบนํ้ายาของเลนินไดถูกอพยพไปทางตะวันออกอยางปลอดภัยแลว"
 news.106.a: "นี่คือจุดจบของสหภาพโซเวียตหรือ?"
 news.106.b: "ในที่สุด มอสโกก็เปนของเรา!"
 news.106.c: "ตองขับไลพวกฟาสซิสตออกจากมอสโก!"
 news.107.t: "การลมสลายของเซวัสโตปอล"
 news.107.d: "เซวัสโตปอล เมืองปอมปราการแนนหนาและฐานทัพของกองเรือทะเลดําโซเวียต ไดพายแพตอการโจมตีของเยอรมันในที่สุด \n\nการเสียเมืองนี้จะเปนอุปสรรคอยางหนักตอความพยายามของโซเวียตในการชวงชิงทะเลดํา และการลมสลายของเมืองถือเปนชัยชนะครั้งสําคัญของเยอรมนี\n\nเบอรลินไดออกประกาศแลววา นับแตนี้เมืองนี้จะไดชื่อวา 'เทโอโดริชสฮาเฟน' ตามพระนามของพระเจาเทโอโดริกมหาราช"
 news.108.t: "การลมสลายของบากู"
 news.108.d: "เมื่อชวงเชาวันนี้ กองกําลังเยอรมันไดยึดครองเมืองบากูไดสําเร็จ ซึ่งเปนเปาหมายทางยุทธศาสตรที่สําคัญยิ่งในสงครามกับสหภาพโซเวียต \n\nเมืองนี้ตั้งอยูริมฝงทะเลแคสเปยน เปนกุญแจสูคอเคซัส และบอนํ้ามันจํานวนมากของเมืองยอมเปนประโยชนตอการทําสงครามของเยอรมนีอยางแนนอน\n\nการยึดเมืองนี้ทําใหเยอรมนีอยูในตําแหนงที่จะขยายสงครามเขาสูตะวันออกกลาง และอาจถึงขั้นอินเดีย"
 news.109.t: "การลมสลายของไคโร"
 news.109.d: "กองกําลังจากกองพลแอฟริกาเยอรมันไดฝาการสูรบจนถึงไคโร เมืองหลวงของอียิปต \n\nขณะที่กองกําลังฝายสัมพันธมิตรถอยรนลึกเขาไปในทะเลทรายอยางระสํ่าระสาย ทหารเยอรมันที่เดินทัพผานไคโรไดรับการโหรองตอนรับในฐานะผูปลดปลอยจากพลเมืองจํานวนมากที่มองวาอังกฤษเปนผูกดขี่\n\nการลมสลายของไคโรเปนความสูญเสียครั้งใหญตอการทําสงครามของฝายสัมพันธมิตร และผูเชี่ยวชาญหลายคนคาดวาตะวันออกกลางทั้งหมดไดเปดกวางใหเยอรมนีเขาพิชิตแลว"
 news.110.t: "การลมสลายของวอชิงตัน"
 news.110.d: "การสูรบในพื้นที่วอชิงตัน ดี.ซี. ยุติลงในวันนี้ เมื่อกองกําลังเยอรมันที่รุกคืบตามแมนํ้าโปโตแมคกวาดลางพื้นที่ตอตานสุดทายในเมืองไดหมดสิ้น \n\nกลุมควันหนาทึบปกคลุมเหนือเมือง และมีรายงานวาสวนหนึ่งมาจากเจาหนาที่ OSS ที่เผาเอกสารลับจนถึงวินาทีสุดทาย หนวยวาฟเฟน-SS ไดยึดทําเนียบขาวหลังการยิงตอสูสั้น ๆ กับเจาหนาที่หนวยอารักขาประธานาธิบดีสหรัฐฯ แตเชื่อวาประธานาธิบดีไดอพยพออกไปอยางปลอดภัยเมื่อหลายวันกอน\n\nการลมสลายของเมืองหลวงอเมริกันแสดงใหเห็นถึงพลานุภาพอันนาสะพรึงของเครื่องจักรสงครามเยอรมัน"
 news.111.t: "การลมสลายของนิวยอรก"
 news.111.d: "หลังการรบตามทองถนนนานหลายชั่วโมง ซึ่งมีรายงานวาสวนใหญเปนการตอสูกับกองกําลังติดอาวุธนอกแบบ หัวหอกเยอรมันไดรุกเขาสูนครนิวยอรกและเขาควบคุมเมือง \n\nสิ่งกีดขวางตอตานรถถังชั่วคราวที่ตั้งไวตามถนนฟฟทอเวนิวไรประสิทธิภาพ และทหารราบยานเกราะเยอรมันไดฝาการสูรบผานแมนฮัตตันทีละชวงตึก\n\nไฟไดลุกโหมอยางควบคุมไมไดในพื้นที่ตะวันออกของเมืองมาหลายวันแลว สองสวางเสนขอบฟาในยามคํ่าคืน \n\nเทพีเสรีภาพถูกกระสุนปนใหญลูกหลงยิงจนเศียรขาด แมยังเปนที่ถกเถียงวาฝายใดเปนผูยิง"
 news.112.t: "การลมสลายของยิบรอลตาร"
 news.112.d: "หลังมีรายงานที่ขัดแยงกันหลายกระแส บัดนี้ไดรับการยืนยันแลววายิบรอลตารตกเปนของเยอรมนี \n\nเมืองทาทางยุทธศาสตรแหงนี้เฝาทางเขาทะเลเมดิเตอรเรเนียน และกอนสงครามเริ่มขึ้นถูกมองอยางกวางขวางวาไมมีใครตีแตก กองรักษาการณอังกฤษไดถอยเขาไปในอุโมงคใตผาหิน แตทายที่สุดก็ถูกขับออกมาดวยเครื่องพนไฟและระเบิดมือ \n\nเมื่อยิบรอลตารตกอยูในมือเยอรมนี ดุลอํานาจในยุทธการเมดิเตอรเรเนียนไดเปลี่ยนไปอยางพลิกผัน"
 news.113.d: "วันนี้ทหารอิตาลีที่ปลาบปลื้มยินดีไดเขาสูไคโร ไมนานหลังหนวยสุดทายของอังกฤษถอนตัวออกจากเมือง \n\nมีการจัดขบวนสวนสนามฉลองชัยทันที และทหารอิตาลีตางพากันไปถายรูปหนามหาพีระมิดแหงกีซาอันเลื่องชื่อ\n\nเมื่อไคโรอยูใตการควบคุม [ITA.GetLeader] ก็เขาใกลการเชื่อมแอฟริกาตะวันออกของอิตาลีเขากับลิเบียของอิตาลีเพื่อสรางอาณานิคมที่ตอเนื่องเปนผืนเดียวในแอฟริกาไปอีกขั้น"
 news.113.b: "อีกหนึ่งการพิชิตของอิตาลี!"
 news.114.d: "[GetItalianConquestofParisDesc]"
 news.114.d_leader: "วันนี้มีการกวาดลางพื้นที่ตอตานสุดทายของฝรั่งเศสในปารีส และบัดนี้เมืองตกอยูใตการควบคุมของอิตาลีอยางมั่นคง \n\n[ITA.GetLeader] ถูกนําตัวบินมาอยางเรงดวนเพื่อรวมขบวนสวนสนามฉลองชัยบนถนนช็องเซลีเซ โดยขี่มาขาวนําหนาทหารที่เดินแถว ระหวางการเฉลิมฉลอง เขาเปรียบการทัพในฝรั่งเศสครั้งนี้กับการพิชิตกอลของซีซาร และใหคํามั่นวานี่เปนเพียงจุดเริ่มตนของการกาวสูความยิ่งใหญของอิตาลี\n\nกาลเวลาจะพิสูจนวาเขาพูดถูกหรือไม"
 news.114.d_council: "วันนี้มีการกวาดลางพื้นที่ตอตานสุดทายของฝรั่งเศสในปารีส และบัดนี้เมืองตกอยูใตการควบคุมของอิตาลีอยางมั่นคง \n\n[ITA.GetLeader] ถูกนําตัวบินมาอยางเรงดวนเพื่อรวมขบวนสวนสนามฉลองชัยบนถนนช็องเซลีเซ โดยขี่มาขาวนําหนาทหารที่เดินแถว ระหวางการเฉลิมฉลอง มีการเปรียบการทัพในฝรั่งเศสครั้งนี้กับการพิชิตกอลของซีซาร และสมาชิกสภาหลายคนใหคํามั่นวานี่เปนเพียงจุดเริ่มตนของการกาวสูความยิ่งใหญของอิตาลี\n\nกาลเวลาจะพิสูจนวาพวกเขาพูดถูกหรือไม"
 news.115.d: "กองกําลังอิตาลีบุกยึดลอนดอนไดสําเร็จ และธงไตรรงคอิตาลีไดถูกชักขึ้นเหนือหอคอยวิกตอเรีย การสูรบยอย ๆ ยังคงดําเนินอยูในบางสวนของเมือง และในเหตุการณเมื่อเชานี้ ทหารแบรซาลิเอรีหลายนายถูกพลซุมยิงที่ซอนตัวอยูบนยอดหอนาฬกาบิกเบนยิงเสียชีวิต\n\nหลังพยายามกําจัดพลซุมยิงลมเหลวถึงสามครั้ง หอนาฬกาทั้งหลังก็ถูกระเบิดทําลายลง ซึ่งเจาหนาที่อิตาลีอธิบายวาเปน 'การตอบโตที่เกินกวาเหตุอันนาเสียดาย' ของผูบัญชาการในพื้นที่"
 news.116.d: "ดูเหมือนวาอิตาลีจะควบคุมยิบรอลตารไดแลว หลังมีรายงานการสูรบอยางหนักรอบผาหินและทาเรือ ยังคงไดยินเสียงระเบิดเปนระยะจากอุโมงคทางทหารที่ทอดลึกอยูใตผาหิน แตเจาหนาที่อิตาลีอางวาการตอตานอยางเปนระบบไดยุติลงทั้งหมดแลว\n\nเมื่อประตูสูทะเลเมดิเตอรเรเนียนอันสําคัญยิ่งนี้อยูใตการควบคุมของอิตาลี กองทัพเรืออังกฤษจะทาทายเรเจีย มารีนาในภูมิภาคนี้ไดยากลําบากยิ่งขึ้น"
 news.117.t: "การลมสลายของสิงคโปร"
 news.117.d: "สิงคโปร 'ยิบรอลตารแหงตะวันออก' ถูกกองทัพจักรวรรดิญี่ปุนยึดได แมอดีตเจาของชาวอังกฤษจะเคยถือวาเปนปอมปราการที่ไมมีใครตีแตกก็ตาม\n\nฝายบริหารทหารญี่ปุนแหงสิงคโปรไดเลือกอาคารฟุลเลอรตันเปนกองบัญชาการ และเมืองนี้ถูกเปลี่ยนชื่อเปนโชนันโต ซึ่งแปลคราว ๆ วา 'เกาะทางใตที่ไดมาในยุคโชวะ' เห็นไดวาตํารวจทหารเค็มเปไตลาดตระเวนตามทองถนนเปนจํานวนมาก เพื่อตอกยํ้าวาญี่ปุนจะอยูที่นี่ตอไป"
 news.117.b: "เพื่อองคจักรพรรดิ!"
 news.118.t: "การลมสลายของเพิรลฮารเบอร"
 news.118.d: "กองกําลังญี่ปุนไดบุกยึดโฮโนลูลู เมืองใหญที่สุดบนเกาะโออาฮูของฮาวาย ฐานทัพเรือที่เพิรลฮารเบอร อดีตกองบัญชาการของกองเรือแปซิฟกสหรัฐฯ ก็แตกดวยเชนกัน\n\nตามคําบอกเลาของผูเห็นเหตุการณ ทหารเรือและนาวิกโยธินอเมริกันที่ถูกลอมไดถอยไปยังเกาะฟอรด และตอตานอยางดื้อดึงจนกระทั่งถูกระดมยิงดวยปนใหญและทิ้งระเบิดทางอากาศอยางหนัก เมื่อเกาะนี้อยูใตการควบคุม แขนอันยาวไกลของกองทัพเรือจักรวรรดิญี่ปุนก็ยิ่งยื่นไปไดไกลขึ้นอีก"
 news.119.t: "การลมสลายของนิวเซาทเวลส"
 news.119.d: "จักรวรรดิญี่ปุนไดขยายการพิชิตทางใตออกไปอีก โดยยึดซิดนียและแคนเบอรรา เมืองหลวงของออสเตรเลีย ฝายปองกันในพื้นที่ถูกบีบใหถอยขามสะพานซิดนียฮารเบอรไปตั้งมั่นใหมที่เนินออบเซอรวาทอรี แตความพยายามทําลายสะพานถูกขัดขวางโดยกองกําลังญี่ปุนที่รุกคืบเขามา ซึ่งจากนั้นก็บุกตอไปยึดแคนเบอรรา\n\nบัดนี้ธงรบญี่ปุนโบกสะบัดอยูที่อาคารรัฐสภาในแคนเบอรรา ซึ่งใชเปนกองบัญชาการของฝายบริหารทหารชุดใหมในพื้นที่ และตํารวจทหารเค็มเปไตคอยเฝาระวังตามทองถนนอยางเขมงวด"
 news.120.t: "การลมสลายของลอสแองเจลิส"
 news.120.d: "หลังตั้งหัวหาดบนแผนดินใหญอเมริกาได กองกําลังญี่ปุนไดรวมกําลังเขาสูลอสแองเจลิสและตีฝายปองกันเมืองแตกพาย บายวันนี้ขบวนทหารจักรวรรดิยาวเหยียดไดเดินทัพไปตามถนนเซ็นทรัลอเวนิว ขณะที่ชางภาพขาวญี่ปุนถายภาพยนตรบันทึกเหตุการณ\n\nมีรายงานวากอนกองกําลังอเมริกันจะถอนตัว การสูรบดุเดือดในหลายพื้นที่ของเมือง ฮอลลีวูดไดรับความเสียหายหนักเปนพิเศษ และนายทหารญี่ปุนหลายคนไดถายรูปหนาปายฮอลลีวูดที่พรุนและพังทลาย"
 news.121.t: "การลมสลายของหนานจิง"
 news.121.d: "หนานจิง เมืองหลวงของสาธารณรัฐจีน ถูกกองกําลังจากจักรวรรดิญี่ปุนยึดครองแลว แมฝายปองกันชาวจีนในเมืองกําแพงจะตอตานอยางดุเดือด ทหารญี่ปุนก็สามารถยึดประตูจงซานและฝาเขาสูตัวเมืองได\n\nยังคงไดยินเสียงปนประปรายและมีไฟลุกโหมหลายจุดทั่วเมือง แตกองกําลังจีนที่รอดชีวิตสวนใหญไดถอนตัวหรือถูกจับกุมแลว เมื่อรวมกับการยึดเซี่ยงไฮ นี่คือชัยชนะครั้งสําคัญของญี่ปุนในสงครามกับจีน"
 news.122.t: "การลมสลายของวลาดีวอสตอค"
 news.122.d: "วลาดีวอสตอค เมืองใหญที่สุดในตะวันออกไกลของรัสเซียและที่ตั้งของกองเรือแปซิฟกโซเวียต ถูกทหารญี่ปุนบุกยึดแลว ที่ตั้งทางยุทธศาสตร ณ ปลายทางรถไฟสายทรานสไซบีเรียทําใหการเสียเมืองนี้ยิ่งสงผลรายตอการทําสงครามของโซเวียตในเอเชีย\n\nชาวเมืองจํานวนมากยังจําการยึดครองของญี่ปุนที่กินเวลาหลายปในชวงสงครามกลางเมืองรัสเซียได คราวนี้บางคนเกรงวาพวกเขาอาจไมมีวันจากไปอีกเลย"
 news.123.t: "การลมสลายของฮองกง"
 news.123.d: "ทหารจากจักรวรรดิญี่ปุนไดยึดฮองกง อาณานิคมในพระมหากษัตริยอังกฤษ หลังทะลวงแนวปองกันจินดริงเกอรสและยกพลขึ้นบกบนเกาะฮองกง สถานการณของฝายปองกันเลวรายจนไมอาจตานทานไดอยางรวดเร็ว และผูวาการไดเดินทางไปยอมจํานนดวยตนเองที่โรงแรมเพนนินซูลาฮองกงซึ่งญี่ปุนตั้งเปนกองบัญชาการ\n\nหลังพิธีสั้น ๆ ผูวาการชาวญี่ปุนคนใหมไดเขารับตําแหนง และประกาศตอชาวโลกถึง 'ฮองกงใหม' ที่ 'ปลอดจากลัทธิลาอาณานิคมตะวันตก'"
 news.124.t: "การลมสลายของมะนิลา"
 news.124.d: "มะนิลา เมืองหลวงของฟลิปปนส ตกเปนของญี่ปุนหลังฝายปองกันชาวอเมริกันและฟลิปปนสถอนตัว ทางเขาอาวมะนิลาอันสําคัญยิ่งทางยุทธศาสตรยังคงเปนที่ชวงชิงอยูระยะหนึ่งหลังเมืองแตก เนื่องจากมีปนใหญรักษาชายฝงของอเมริกาหนาแนนบนเกาะคอรเรฮิดอร แตในที่สุดปนเหลานั้นก็เงียบเสียงลงหลังการโจมตีประสานของญี่ปุน\n\nเมื่อมะนิลาอยูใตการควบคุมของญี่ปุน คาดวาสวนที่เหลือของฟลิปปนสจะตามมาในไมชา นี่คือความพายแพอันเจ็บแสบของกองกําลังอเมริกันในเอเชียและแปซิฟก"
 news.125.t: "การลมสลายของกัลกัตตา"
 news.125.d: "หลังการระดมยิงอยางหนักชวงหนึ่ง บัดนี้ไดรับการยืนยันแลววาเมืองกัลกัตตาในอินเดียตกเปนของกองกําลังญี่ปุนที่รุกคืบเขามา แมการสูรบประปรายยังเกิดขึ้นในเขตชานเมือง ก็มีการจัดขบวนสวนสนามฉลองชัยอยางรวดเร็วบนถนนเชาวริงกี\n\nสมาชิกกองทัพแหงชาติอินเดีย ซึ่งเปนหนวยทหารที่ญี่ปุนจัดตั้งขึ้นและอุทิศตนเพื่อปลดปลอยอินเดียจากอังกฤษ ไดรวมขบวนสวนสนามและไดรับเสียงโหรองอยางกึกกองจากฝูงชน เมื่อกัลกัตตาแตก หลายคนคาดการณวาบริติชอินเดียทั้งหมดจะตามมาในไมชา"
 news.126.t: "การลมสลายของนิวเดลี"
 news.126.d: "การรุกของญี่ปุนในอินเดียยังดําเนินตอไป และนิวเดลีเพิ่งแตกไปเมื่อไมนานนี้ ในฐานะเมืองหลวงของบริติชอินเดีย เมืองนี้มีความสําคัญทางยุทธศาสตรอยางยิ่ง และการเสียเมืองนี้อาจเปนปจจัยชี้ขาดในการทัพอินเดียที่ยังดําเนินอยู\n\nมีรายงานวาอุปราชเองถูกหนวยรุกหนาของญี่ปุนจับกุมตัวขณะกําลังควบคุมการขนยายขาวของจากทําเนียบอุปราชขึ้นขบวนรถบรรทุก แตขาวนี้ยังไมไดรับการยืนยัน"
 news.127.t: "การลมสลายของคลองปานามา"
 news.127.d: "ในสิ่งที่ตองถือวาเปนการกระทบกระเทือนครั้งมหันตตอการทําสงครามของอเมริกา กองกําลังญี่ปุนไดยกพลขึ้นบกที่ปานามาและเขาควบคุมคลองหลังบีบใหกองรักษาการณยอมจํานน มีรายงานวาทหารอเมริกันและปานามาหลายกลุมหลบหนีเขาปาใกลเคียงเพื่อทําสงครามกองโจร แตเชื่อวาไมนาจะคุกคามการปรากฏตัวของญี่ปุนไดมากนัก\n\nเมื่อคลองแตก กองทัพเรืออเมริกันตองออมทวีปอเมริกาใตเพื่อไปยังชายฝงตะวันตกของสหรัฐฯ ทําใหกองทัพเรือจักรวรรดิญี่ปุนไดเปรียบทางยุทธศาสตรอยางมาก"
 news.128.t: "การลมสลายของเบอรลิน"
 news.128.d: "เจาหนาที่ในวอชิงตันยืนยันการยึดเมืองหลวงของเยอรมนีแลว หลังกองกําลังสหรัฐฯ ฝาการสูรบเขาสูเบอรลินจากหลายทิศทาง การสูรบในเมืองถูกบรรยายวาดุเดือด โดยทหารชางเยอรมันที่สิ้นหวังไดระเบิดสะพานมอลทเคอเพื่อหยุดยั้งการรุกของอเมริกา\n\nในที่สุดสะพานอื่น ๆ ขามแมนํ้าชเปรก็ถูกยึดได และทหารอเมริกันบุกยึดโรงอุปรากรครอลลและอาคารไรชสทาคไดสําเร็จแมเยอรมันจะตอตานอยางดุเดือด บัดนี้ธงดาวและแถบโบกสะบัดเหนืออาคารไรชสทาค และการสูรบในเมืองไดยุติลงแลว ยุทธการเบอรลินสิ้นสุดลง"
 news.128.b: "ปฏิบัติการตามตําราเปะ!"
 news.129.d: "กองกําลังอังกฤษไดรุกเขาสูเบอรลิน และคณะรัฐมนตรีสงครามไดประกาศการยึดเมืองหลวงของเยอรมนีไดสําเร็จหลังการรบอยางดุเดือด หนวยคอมมานโดอังกฤษโจมตีตั้งแตรุงสางและยึดสนามบินเทมเพิลโฮฟ ขณะที่ขบวนยานเกราะรุกไปตามถนนฟรังคฟวรเทอรอัลเล\n\nเมื่อทําเนียบไรชอยูใตการควบคุมของอังกฤษ การสูรบในเมืองก็ยุติลงเกือบทั้งหมด สถานะปจจุบันของรัฐบาลเยอรมนียังไมชัดเจน แตเชื่อวาอยางนอยบางสวนไดหลบหนีออกจากเมืองกอนเมืองจะแตก"
 news.129.b: "ทําไดเยี่ยมมาก พวกเรา!"
 news.130.d: "กองกําลังฝรั่งเศสบุกยึดเมืองหลวงของเยอรมนีไดสําเร็จ หลังการรบดุเดือดหลายครั้งภายในเขตเมือง ทหารวาฟเฟน-SS กลุมใหญไดตั้งสิ่งกีดขวางปองกันตัวในสนามกีฬาโอลิมเปยชตาดิออน ซึ่งในที่สุดก็แตกหลังการโจมตีอยางมุงมั่นของทหารกองทหารตางดาวโดยมีปนใหญสนับสนุน\n\nบัดนี้ธงไตรรงคฝรั่งเศสโบกสะบัดเหนือทําเนียบไรช และแมจะยังมีรายงานการสูรบประปรายจากชานเมืองบางแหง แตเชื่อวาการตอตานอยางเปนระบบในเบอรลินสวนใหญไดถูกกวาดลางหมดแลว"
 news.130.b: "ฝรั่งเศสจงเจริญ!"
 news.131.d: "มีรายงานการสูรบอยางสิ้นหวังจากเบอรลิน เมืองหลวงของเยอรมนี แตบัดนี้เชื่อวาเมืองตกอยูในมือโปแลนดโดยสมบูรณแลว หลังรุกไปตามถนนฟรังคฟวรเทอรอัลเล ทหารโปแลนดก็มาถึงจัตุรัสอเล็กซานเดอรพลัทซซึ่งกลายเปนสมรภูมิดุเดือด\n\nในสวนอื่นของเมือง ประตูบรันเดินบวรกพังทลายลง โดยคาดวาถูกรถถังโปแลนดพุงชน และโรงอุปรากรครอลลถูกปนใหญระดมยิงจนราบหลังทหาร SS ที่ปองกันอยูไมยอมจํานน บัดนี้ธงสีแดงขาวของโปแลนดโบกสะบัดเหนืออาคารไรชสทาค และพื้นที่ตอตานสุดทายไดถูกจัดการเรียบรอยแลว"
 news.131.b: "ไมมีใครหยุดยั้งพลังอันยิ่งใหญของโปแลนดได"
 news.132.t: "การลมสลายของโรม"
 news.132.d: "กองกําลังฝายสัมพันธมิตรเพิ่งเขาสูกรุงโรมหลังกองรักษาการณยอมจํานน และบัดนี้เมืองอยูภายใตการยึดครองทางทหาร โบราณสถานสวนใหญยังคงสภาพเดิม หลังผานพนการรบชิงเมืองมาอีกครั้ง อยางนอยในขณะนี้ ทหารฝายสัมพันธมิตรยังอยูนอกนครรัฐวาติกันตามคําขอของสันตะสํานัก\n\nการลมสลายของโรมเปนหมุดหมายสําคัญของการทัพในอิตาลี และบางคนสงสัยวานี่จะหมายถึงจุดจบของการตอตานอยางเปนระบบตอกองทัพฝายสัมพันธมิตรที่รุกคืบบนคาบสมุทรหรือไม"
 news.132.b: "ชัยชนะครั้งยิ่งใหญ!"
 news.133.d: "กองกําลังจากฝรั่งเศสเพิ่งเขาสูกรุงโรม หลังกองรักษาการณอิตาลีที่เหลืออยูสลายตัวหนีเขาชนบทรอบเมือง ทหารฝรั่งเศสเคลื่อนเขายึดอาคารราชการสําคัญทั้งหมดอยางรวดเร็ว และมีการจัด 'ขบวนแหฉลองชัย' ไปตามถนนเวียเดลกอรโซ ดวยขบวนทหารเดินแถวและยานเกราะยาวเหยียด\n\nเมื่อโรมแตก ความสามารถของอิตาลีในการทําสงครามตอไปก็เปนที่นาสงสัย ผูสังเกตการณภายนอกคาดวารัฐบาลอิตาลี ซึ่งหนีออกจากเมืองกอนเมืองแตกไมนาน จะเริ่มการเจรจายอมจํานนในไมชา"
 news.134.t: "การปลดปลอยปารีส"
 news.134.d: "บัดนี้ไดรับการยืนยันแลววาปารีส เมืองหลวงของฝรั่งเศส ไดรับการปลดปลอยจากการยึดครองของเยอรมนี กองกําลังฝายสัมพันธมิตรไดเขาสูเมือง และกองรักษาการณเยอรมันที่เหลือไดยอมจํานน ชาวปารีสตางโหรองตอนรับผูปลดปลอยขณะเดินทัพไปตามถนนช็องเซลีเซ แมจะมีขาวลือวายังมีพลซุมยิงเยอรมันในบางสวนของเมือง\n\nกอนหนานี้มีความกังวลวาเยอรมันจะใชยุทธศาสตรเผาผลาญและทิ้งปารีสไวเปนซากปรักหักพังที่ลุกเปนไฟ แตดูเหมือนวาสถานที่สําคัญของเมืองจะรอดพนมาได อันที่จริง บัดนี้ยังเห็นธงไตรรงคฝรั่งเศสโบกสะบัดอยูบนหอไอเฟลดวยซํ้า"
 news.135.t: "การลมสลายของโตเกียว"
 news.135.d: "กองกําลังอเมริกันไดเขาสูโตเกียว และกระทรวงการสงครามสหรัฐฯ เพิ่งประกาศยุติปฏิบัติการรบหลักในเมือง มีรายงานวาการสูรบเปนไปอยางหนักหนวง โดยเฉพาะบริเวณพระราชวังหลวงซึ่งมีทหารราชองครักษผูคลั่งไคลปองกันอยู แมเชื่อวาองคจักรพรรดิไดเสด็จออกจากเมืองไปกอนการโจมตีของอเมริกาจะเริ่มขึ้น\n\nเมื่อโตเกียวแตก ผูเชี่ยวชาญคาดวาการตอตานอยางเปนระบบในสวนที่เหลือของเกาะหลักญี่ปุนจะพังทลายในไมชา คาดวาการเจรจาสันติภาพจะเริ่มขึ้นในเร็ววัน เวนแตฝายสายแข็งของญี่ปุนจะโนมนาวองคจักรพรรดิใหสูตอจนตัวตาย"
 news.136.d: "หลังการรบดุเดือดหลายครั้ง กองกําลังฝายสัมพันธมิตรไดยึดครองมอสโก เมืองหลวงของ [SOV.GetNameDef] เมืองไดรับความเสียหายอยางกวางขวาง และไฟยังคงลุกโหมทั้งสองฝงแมนํ้ามอสควา แมจะถูกทิ้งระเบิดอยางหนัก เครมลินยังคอนขางสมบูรณ และไดรับเลือกใหเปนที่ตั้งกองบัญชาการของฝายบริหารการยึดครองของฝายสัมพันธมิตร\n\nการเสียมอสโกเปนการกระทบกระเทือนครั้งมหาศาลตอการทําสงครามของโซเวียต แมเชื่อวารัฐบาลสวนใหญไดอพยพออกจากเมืองไปนานกอนเมืองแตก แตผูเชี่ยวชาญทางทหารอางวาการลมสลายโดยสิ้นเชิงของโซเวียตอาจอยูอีกไมไกล"
 news.137.t: "การปลดปลอยลอนดอน"
 news.137.d: "การสูรบในลอนดอนยุติลงแลว หลังพื้นที่ตอตานสุดทายของเยอรมันถูกจัดการเรียบรอย ทันทีที่มีสัญญาณปลอดภัย ฝูงชนที่ปลาบปลื้มยินดีก็กรูออกมาตามทองถนนเพื่อตอนรับผูปลดปลอยชาวอเมริกัน ขณะที่เสียงระฆังโบสถดังกังวานไปทั่วเมือง\n\nกระแสแหงการปลดปลอยดูเหมือนจะแผไปทั่วบริเตน เมื่อดูเหมือนวาในที่สุดการยึดครองของเยอรมนีกําลังจะสิ้นสุดลง มีรายงานการลุกฮือขึ้นเองในพื้นที่ที่ยังอยูใตการควบคุมของเยอรมนี แมเหตุการณเหลานี้จะถูกปราบปรามอยางรุนแรง ในที่สุดเสรีภาพไดกลับคืนสูสหราชอาณาจักรแลวหรือ?"
 news.138.d: "ตางจากป 1920 คราวนี้ไมมี 'ปาฏิหาริยริมแมนํ้าวิสตูลา' เมื่อกองทัพโซเวียตเคลื่อนเขาใกลวอรซอ การตอตานของโปแลนดในเมืองพังทลายเกือบหมดสิ้น และธงโซเวียตถูกชักขึ้นเหนืออาคารราชการเกือบทุกแหง\n\nเรากําลังเปนประจักษพยานถึงจุดจบของชาติโปแลนด หรือกองกําลังของพวกเขาจะฟนตัวกลับมายึดเมืองหลวงคืนได? ผูเชี่ยวชาญสวนใหญมองวาสถานการณหลังไมนาจะเกิดขึ้น"
 news.138.b: "[GetSOVIdeologyLondonResponse]"
 get_SOV_ideology_london_response: "รุกตอไป สหาย!"
 get_SOV_ideology_london_response_alt: "รุกตอไป!"
 news.139.t: "การปลดปลอยวอรซอ"
 news.139.d: "วอรซอที่พังพินาศไดตกเปนของกองทัพโซเวียตที่รุกคืบเขามา หลังทหารเยอรมันกลุมสุดทายถอยออกจากชานเมืองที่กําลังลุกไหม เมืองสวนใหญกลายเปนซากปรักหักพังจากการรบครั้งกอน ๆ และสมาชิกขบวนการตอตานในพื้นที่ตางรีบออกมาจากกองซากปรักหักพังเพื่อตอนรับผูปลดปลอย\n\nเมื่อวอรซออยูใตการควบคุมของโซเวียต สถานการณทางยุทธศาสตรของเยอรมนีในยุโรปตะวันออกอาจเลวรายลงอีกในไมชา ผูเชี่ยวชาญสงสัยวาเยอรมนีจะสามารถตีโตกลับมายึดเมืองคืนได แตชาวเมืองที่ทุกขระทมดูจะไมมั่นใจเทาใดนัก"
 news.139.a: "นี่คือจุดเริ่มตนของจุดจบหรือ...?"
 news.140.d: "แถลงการณของโซเวียตประกาศการยอมจํานนของกองกําลังเยอรมันทั้งหมดในเบอรลิน หลังโอบลอมเมือง ทหารรัสเซียไดบุกเขาโจมตีจากหลายทิศทาง โดยฝายปองกันเยอรมันตอตานอยางดุเดือดทุกยางกาว\n\nในที่สุดทหารโซเวียตก็ฝาขามสะพานมอลทเคอเขาสูอาคารไรชสทาค สูรบทีละหองจนถึงหลังคา แลวชักธงโซเวียตขึ้นเหนือเมือง ยุทธการเบอรลินสิ้นสุดลงแลว"
 news.140.a: "หมี[SOV.GetAdjective]กําลังเติบใหญ..."
 news.140.b: "รังของพวกฟาสซิสตเปนของเราแลว!"
 news.141.d: "โรม 'นครนิรันดร' ไดแตกพายตอหัวหอกโซเวียตที่รุกคืบเขามา ขณะที่กองกําลังอิตาลีถอยรน ทหารรัสเซียไดกระจายกําลังเขาไปในเมืองและจัดการพื้นที่ตอตานที่เหลืออยูไมกี่แหง โบราณสถานสวนใหญดูจะไดรับความเสียหายเพียงเล็กนอย แมจะมีรายงานขัดแยงกันวาวิหารแพนธีออนถูกปนกลกราดยิง\n\nจนถึงขณะนี้ โซเวียตดูเหมือนจะเคารพความเปนกลางของสันตะสํานัก แตกองกําลังของพวกเขาไดตั้งวงลอมรอบนครรัฐวาติกัน - ทาทีที่ยอมทําใหสมเด็จพระสันตะปาปาทรงหวั่นพระทัยไมนอย"
 news.142.d: "การรุกอันไมอาจหยุดยั้งของกองทัพแดงยังดําเนินตอไป และบัดนี้มีรายงานเขามาวาเมืองหลวงของฝรั่งเศสไดแตกแลว คาดวาคอมมิวนิสตฝรั่งเศสไดชวยเหลือโซเวียตเมื่อเขาสูเมือง โดยรวมโจมตีหนวยของกองทัพบกฝรั่งเศสที่กําลังถอยรน\n\nมีการแจกใบปลิวไปทั่วเมือง แจงชาวปารีสวาพวกเขาได 'รับการปลดปลอยจากการกดขี่ของชนชั้นนายทุน' แลว และคอมมูนปารีสไดฟนคืนชีพขึ้นมาอีกครั้งในที่สุด"
 news.143.d: "ในคําสั่งประจําวันลาสุดที่ออกอากาศจากมอสโก ไดมีการประกาศการยึดปารีสจากกองกําลังเยอรมัน มีรายงานวาฝายปองกันเมืองจํานวนมากจมนํ้าตายในแมนํ้าแซน หลังปนใหญโซเวียตระดมยิงอยางหนักจนสะพานขามแมนํ้าหลายแหงพังทลาย\n\nหอไอเฟลลมครืนลงหลังเกิดระเบิดครั้งใหญที่ฐาน แมยังไมชัดเจนวาฝายใดเปนผูกระทํา บัดนี้กองกําลังโซเวียตกําลังจัดขบวนสวนสนามฉลองชัยบนถนนช็องเซลีเซ ขณะที่ชาวปารีสผูออนลาเฝามอง และสงสัยวาพวกเขาเพียงแคเปลี่ยนจากผูยึดครองรายหนึ่งไปเปนอีกรายหนึ่งเทานั้นหรือไม"
 news.143.a: "นี่คือจุดเริ่มตนของจุดจบหรือ...?"
 news.144.d: "[GetSOVIdeologyLondonDesc]"
 get_SOV_ideology_london_desc: "กระแสคอมมิวนิสตยังคงโหมแรง โดยกองกําลังโซเวียตเพิ่งยึดลอนดอนไดสําเร็จ กองทัพแดงจัดขบวนสวนสนามอยางรวดเร็ว กอนที่พื้นที่ตอตานสุดทายในเมืองจะถูกจัดการเสร็จสิ้นเสียอีก\n\nผูฝกใฝคอมมิวนิสตรีบสงรายชื่อผูตอตานคอมมิวนิสตที่รูจักกันดีใหแกทางการทหารโซเวียต และศาลประชาชนไดเปดพิจารณาคดีที่จัตุรัสทราฟลการเพื่อลงโทษผูกระทําผิดรายแรงที่สุด"
 get_SOV_ideology_london_desc_alt: "การรุกของ[SOV.GetAdjective]ยังดําเนินตอไป ลาสุดลอนดอนตองเผชิญการโจมตีอยางดุดัน และทายที่สุดก็แตกพายภายใตการโจมตีที่ดูเหมือนไมมีวันสิ้นสุด  \n\n พื้นที่ตอตานสุดทายแทบยังไมทันถูกจัดการ กองกําลัง[SOV.GetAdjective]ก็จัดขบวนสวนสนามฉลองชัยชนะแลว ผูสนับสนุน [SOV.GetLeader] และการนําของ[SOV.GetLeader.GetHerHis]ตางแสดงการสนับสนุนและความชื่นชมอยางเต็มที่ เมื่อยุคใหมนี้มาถึงพวกเขาในที่สุด"
 news.145.d: "ไฟยังคงลุกโหมในใจกลางลอนดอน แตเชื่อวาผูยึดครองชาวเยอรมันสวนใหญในเมืองไดเสียชีวิตในการรบหรือถูกกองกําลังโซเวียตที่รุกคืบเขามาจับกุมแลว ฝูงชนออกมาตามทองถนนเพื่อโหรองเชียรทหารรัสเซียขณะเคลื่อนไปจัดการกลุมที่ยังดื้อดึงตอตานกลุมสุดทาย\n\nผูรวมมือกับศัตรูถูกจัดการอยางรุนแรง และโซเวียตไดจัดตั้งสภาชั่วคราวเพื่อบริหารเมืองที่ไดรับการปลดปลอยจนกวาจะมีประกาศเปลี่ยนแปลง ผูวิจารณตั้งขอสังเกตวาสมาชิกสภานี้ดูเหมือนจะมาจากพรรคคอมมิวนิสตแหงบริเตนใหญทั้งสิ้น"
 news.145.a: "พัฒนาการที่สําคัญ"
 news.146.d: "กองกําลังโซเวียตไดรวมกําลังเขาสูโตเกียว และมีรายงานการสูรบอยางหนักทั่วเมือง บัดนี้เมืองสวนใหญอยูใตการควบคุมของโซเวียต ยกเวนชานเมืองฝงตะวันออกที่ไฟยังลุกโหมอยางรุนแรง\n\nเมื่อการสูรบเคลื่อนเขาใกลพระราชวังหลวง มีรายงานวาทหารราชองครักษไดตะลุยดาบปลายปนเขาใสทหารโซเวียตที่กําลังเคลื่อนเขามา ในที่สุดพระราชวังก็ถูกพลรม VDV หนวยหนึ่งบุกยึด โดยตองสูรบผานพระราชวังทีละหอง ไมมีการจับเชลย แตเชื่อวาองคจักรพรรดิไดเสด็จลี้ภัยอยางปลอดภัยกอนเมืองแตก"
 news.147.d: "เลนินกราด อดีตเมืองหลวงของจักรวรรดิรัสเซีย ถูกกองกําลังฟนแลนดยึดครองแลว ดวยประชากรกวาสามลานคน เมืองนี้มีผูอยูอาศัยเกือบเทากับฟนแลนดทั้งประเทศ แตขอเท็จจริงนี้เห็นไดชัดวาไมไดทําใหผูโจมตีชาวฟนแลนดยอทอ\n\nมีการถกเถียงกันอยูบางวาควรผนวกเมืองนี้เขากับมหาฟนแลนดหรือไม เนื่องจากชาวฟนนอิงเกรียเปนชนกลุมนอยจํานวนมากในพื้นที่นอกเมือง แนนอนวาทั้งหมดนี้ตั้งอยูบนสมมติฐานวากองทัพแดงจะไมสามารถตีโตกลับมายึดเมืองคืนได"
 news.148.d: "ขาวจากโตเกียวเพิ่งยืนยันวาเมืองไดแตกพายตอกองกําลังจีนแลว เมืองสวนใหญกลายเปนซากปรักหักพัง รวมถึงพระราชวังหลวงซึ่งบัดนี้ใชเปนกองบัญชาการของฝายบริหารทหารจีน\n\nผูสื่อขาวตางชาติไดเห็นขบวนสวนสนามฉลองชัยครั้งมโหฬาร ซึ่งมีทหารจีนเดินแถวผานเมืองยาวเหยียดไมรูจบ ชาวญี่ปุนที่ยืนเรียงรายสองขางทางเฝามองขบวนทหารอยางเงียบงัน"
 news.149.d: "เปนครั้งแรกนับตั้งแตถูกอังกฤษยึดไปเมื่อกวาสองศตวรรษกอนที่ยิบรอลตารกลับคืนสูมือสเปน ขาวจากดินแดนนี้รายงานวากองรักษาการณสวนใหญไดยอมจํานนแลว แมจะมีกลุมที่ดื้อดึงตอตานอยูไมกี่กลุมถอยเขาไปในอุโมงคใตผาหิน\n\nในการแถลงขาวที่มาดริด ตัวแทนรัฐบาลแถลงวานับแตนี้ยิบรอลตารจะถือเปนดินแดนของสเปน 'ตลอดกาล' ไมนาแปลกใจที่นักการทูตอังกฤษปฏิเสธคําแถลงนี้ โดยปดตกวาเปน 'เรื่องไรสาระสิ้นดี'"
 news.150.t: "รัฐประหารในยูโกสลาเวีย"
 news.150.d: "ความพยายามของรัฐบาลยูโกสลาเวียที่จะรวมมือกับเยอรมนีถูกตอตานจากหลายฝายในกองทัพของชาติ ซึ่งวันนี้นําไปสูการรัฐประหารโคนลมผูปกครองและอัญเชิญพระเจาปเตอรที่ 2 ขึ้นครองราชย\n\nประเทศไดตัดความสัมพันธกับเยอรมนีไปหลายดาน และระบอบใหมดูพรอมจะเสี่ยงทําสงครามมากกวาจะยอมรวมมือ"
 news.150.b: "พวกโงขุดหลุมฝงตัวเองแลว"
 news.151.t: "ไรนแลนดยังคงเปนเขตปลอดทหาร"
 news.151.d: "หลังเยอรมนีพยายามลมกฎที่สนธิสัญญาแวรซายกําหนดไวและนํากําลังทหารกลับเขาไรนแลนด คําขาดจากฝายสัมพันธมิตรก็บีบใหเยอรมนีตองถอย เมื่อทั้งอังกฤษและฝรั่งเศสขูจะระดมพลหากเยอรมนีเดินหนาตามแผน ก็ชัดเจนอยางรวดเร็ววาเยอรมนีไมคาดคิดวาจะเจอการตอตานถึงระดับนี้ เยอรมนียังไมพรอมจะเผชิญหนากับทั้งสองประเทศในสงครามเต็มรูปแบบ\n\nในสถานการณปจจุบัน ไรนแลนดจะยังคงเปนเขตปลอดทหารตามที่สนธิสัญญากําหนด เวนแตเยอรมนีจะกอสงคราม"
 news.151.a: "วิกฤตคลี่คลายไปไดชั่วคราว"
 news.151.b: "วันของเราจะมาถึง"
 news.151.c: "พวกเขานาจะรูวาเราไมปลอยใหทําตามใจโดยไมถูกทาทาย"
 news.152.d: "หลังเยอรมนีพยายามลมกฎที่สนธิสัญญาแวรซายกําหนดไวและนํากําลังทหารกลับเขาไรนแลนด คําขาดจากฝรั่งเศสก็บีบใหเยอรมนีตองถอย แมอังกฤษจะปฏิเสธที่จะแทรกแซง แตเมื่อฝรั่งเศสขูจะระดมพลหากเยอรมนีเดินหนาตามแผน ก็ชัดเจนอยางรวดเร็ววาเยอรมนีไมคาดคิดวาจะเจอการแทรกแซงทางทหารใด ๆ เลย เยอรมนียังไมพรอมจะเผชิญหนากับฝรั่งเศสในสงครามเต็มรูปแบบ\n\nในสถานการณปจจุบัน ไรนแลนดจะยังคงเปนเขตปลอดทหารตามที่สนธิสัญญากําหนด เวนแตเยอรมนีจะกอสงคราม"
 news.152.c: "ฝรั่งเศสยืนหยัดลําพัง แตแข็งแกรง"
 news.152.e: "เห็นไดชัดวาการแทรกแซงของเราไมจําเปน"
 news.153.t: "เยอรมนีละเมิดกติกาสัญญาโมโลตอฟ-ริบเบนทรอพ"
 news.153.d: "สนธิสัญญาไมรุกรานระหวางเยอรมนีกับ [SOV.GetNameDef] ซึ่งเปนพัฒนาการที่นาประหลาดใจตั้งแตแรก บัดนี้ไดพังทลายลงอยางไมนาประหลาดใจนัก เยอรมนีไดเปดฉากโจมตี ฉีกสนธิสัญญา และหันกลับมาพูดถึงสหภาพโซเวียตอยางเปดเผยอีกครั้งวาเปนภัยคุกคามที่ตองเผชิญ เพื่อใหวิสัยทัศนแหงอนาคตของตนกลายเปนจริง\n\nผูนําโซเวียตไมพอใจนัก แตบางทีอาจไมไดตกใจกับการทรยศครั้งนี้เทากับผิดหวังที่ตนไมไดฉวยโอกาสกอน"
 news.153.a: "ความไววางใจระหวางยักษใหญเปนสิ่งเปราะบาง"
 news.153.b: "เราลงนามเพียงเพื่อถวงเวลาเตรียมการโจมตีเทานั้น"
 news.153.c: "สําหรับพวกฟาสซิสต สนธิสัญญาก็เปนแคเศษกระดาษ"
 news.154.t: "สหภาพโซเวียตละเมิดกติกาสัญญาโมโลตอฟ-ริบเบนทรอพ"
 news.154.d: "สนธิสัญญาไมรุกรานระหวางเยอรมนีกับ [SOV.GetNameDef] ซึ่งเปนพัฒนาการที่นาประหลาดใจตั้งแตแรก บัดนี้ไดพังทลายลงอยางไมนาประหลาดใจนัก [SOV.GetNameDef] ไดเปดฉากโจมตี ฉีกสนธิสัญญา และประกาศจะบดขยี้ระบอบเยอรมันและสั่งสอนรัฐนักขยายอํานาจนี้ใหรูที่ทางของตนอีกครั้ง\n\nผูนําเยอรมนีเองอาจกําลังวางแผนโจมตีอยูเชนกัน แตโลกคงไมมีวันรู บัดนี้พวกเขากําลังระดมพลอยางเรงรีบเพื่อรับมือกับภัยคุกคามใหม"
 news.154.b: "พวกคอมมิวนิสตไมมีทั้งเกียรติและศักดิ์ศรี!"
 news.154.c: "สนธิสัญญาไดบรรลุจุดประสงคแลว"
 news.155.t: "เยอรมนีเขาสูสงครามอีกครั้ง"
 news.155.d: "แมหลายคนจะปรารถนาสันติภาพอันยั่งยืนในยุโรป แตเหตุการณที่พลิกผันเมื่อไมนานมานี้ไดพาเยอรมนีเขาสูเสนทางแหงสงครามอีกครั้ง แมจะเปนการละเมิดสนธิสัญญาแวรซายอยางชัดแจง ทหารเยอรมันไดระดมพลและพรอมจะรุก เจาหนาที่เยอรมนีแถลงวาจะไมคงไรนแลนดไวเปนเขตปลอดทหารอีกตอไป โดยอางความจําเปนในการปกปองพลเมืองเยอรมันในพื้นที่"
 news.155.a: "นี่อาจเปนจุดเริ่มตนของมหาสงครามอีกครั้ง"
 news.155.b: "เพื่อเกียรติภูมิแหงชาติเยอรมัน!"
 news.156.t: "พบเห็นโคเม็ท"
 news.156.d: "การปรากฏตัวของโคเม็ทบนทองฟาไดสรางความแตกตื่นในหมูประชาชนของเรา Me 163 Komet เครื่องบินจรวดทดลองที่ออกบินทดสอบเที่ยวหนึ่ง ไดสรางความตื่นตระหนกแกชาวชนบทที่พบเห็นอากาศยานความเร็วสูงอันเปนเอกลักษณนี้ เครื่องบินนี้ไดรับการพัฒนาอยางลับสุดยอด แตจะถูกเปดตัวในไมชา เหตุการณเล็ก ๆ ครั้งนี้จะยิ่งทําใหการปรากฏตัวอยางเปนทางการครั้งแรกของมันนาประทับใจยิ่งขึ้น"
 news.156.a: "จุดจบใกลเขามาแลว... สําหรับศัตรูของเรา"
 news.156.a.tt: "แจกันใบหนึ่งลมลง\n"
 news.156.a.2.tt: "ยังไงก็ไมไดชอบแจกันใบนั้นอยูแลว\n"
 news.157.t: "[From.From.GetName] แทรกแซงสงคราม[From.GetAdjective]"
 news.157.d: "เมื่อไมกี่วันกอน ทหารจาก [From.GetName] ไดระดมพลมุงหนาสู [From.From.From.GetName] พรอมประกาศสงคราม จากนั้น [From.From.GetName] ไดยื่นคําขาด สั่งใหคูกรณียุติการสูรบและถอนทหาร[From.GetAdjective]ทั้งหมด [From.GetLeader] แถลงวาสงครามของตนชอบธรรมและปฏิเสธที่จะยอม บัดนี้ประเทศจึงตกอยูในความขัดแยงเต็มรูปแบบกับทั้ง [From.From.From.GetName] และ [From.From.GetName]"
 news.157.a: "ดูเหมือน [From.From.GetName] จะยอมลงมือเปอนมือเอง"
 news.157.a_usa: "เราจะสั่งสอนพวกมัน"
 news.158.t: "[From.From.GetName] แทรกแซงสงคราม[From.GetAdjective]"
 news.158.d: "เมื่อไมกี่วันกอน [From.GetName] ไดประกาศสงครามกับ [From.From.From.GetName] ไมนานหลังจากนั้น [From.From.GetName] ไดยื่นคําขาด ระบุวาจะทําสงครามกับ [From.GetName] หากไมยุติการรุกรานทั้งหมดและลงนามในขอตกลงสันติภาพ [From.GetLeader] แถลงวาเหตุผลในการทําสงครามของตนชอบธรรม แตไดเลือกที่จะปลดประจําการทหารและยอมรับสันติภาพ"
 news.158.a: "ดูเหมือนการเดินเกมอํานาจของ[From.From.GetAdjective]จะไดผล"
 news.158.a_usa: "เราตองรักษาสันติภาพไว"
 news.159.t: "รุงอรุณแหง [From.GetFactionName]"
 news.159.d_01: "วันนี้ [From.GetLeader] ประกาศวา [From.GetName] ไดยื่นมือเพื่อกอตั้งพันธมิตรใหม [From.GetFactionName] ไดประกาศตอสาธารณะถึงเจตนาที่จะรวมมือกันหากเกิดสงคราม\n\nแมแนวรวมที่ยิ่งใหญจะชวยยับยั้งการรุกรานได แตเราก็ไดเห็นผลที่ตามมาแลวเมื่อความขัดแยงปะทุขึ้นจริง เจตนาของแตละฝายที่เขารวมพันธมิตรใหมนี้ยังเปนที่ถกเถียง และจุดประสงคที่พันธมิตรนี้จะรับใชในทายที่สุดอาจไมมีใครรู แมแตผูริเริ่มเอง"
 news.159.d_02: "มีทฤษฎีวาประเทศประชาธิปไตยจะไมทําสงครามกันเอง แตนั่นไมไดหมายความวาจะรับประกันไดวาพวกเขาจะชวยเหลือกันในยามสงคราม เมื่อผลประโยชนทางการเมืองหลากหลายและประชาชนตองการสันติภาพ การเขาสูสงครามมักตองแลกดวยตนทุนมหาศาลสําหรับชาติเหลานี้\n\nอยางไรก็ตาม สิ่งนี้ไมไดหยุด [From.GetName] จากการประกาศในวันนี้วาไดกอตั้งพันธมิตรทางทหาร [From.GetFactionName] เพื่อผนึกกําลังปกปองประชาชนและอุดมการณของตน"
 news.159.d_03: "แมแต [From.GetName] ซึ่งขึ้นชื่อเรื่องความเชื่อมั่นในความแข็งแกรงและความเหนือกวาของประชาชนและชาติตน ก็ยังยินดีจะเปนพันธมิตรกับผูที่ตนนับถือ วันนี้ [From.GetLeader] ประกาศวาไดบรรลุขอตกลงขั้นสุดทายเกี่ยวกับ [From.GetFactionName] แลว ซึ่งเปนแนวรวมทางทหารที่วากันวามีที่วางไวสําหรับชาติผูมีเกียรติที่ถูกลิขิตมาเพื่อความยิ่งใหญเทานั้น\n\nความยิ่งใหญนี้จะมาจากการสรางสังคมในอุดมคติภายในพรมแดนของแตละชาติ หรือจากการรวมมือกันขยายออกไปนอกพรมแดน โลกอาจไมรูจนกวาจะสายเกินไป"
 news.159.d_04: "แมโซเวียตจะมุงเนนแนวทางสังคมนิยมในประเทศเดียวในชวงหลัง แตรากเหงาสากลนิยมของขบวนการนี้กาวขามพรมแดน ความเปนปกแผนกับกรรมกรทั่วโลกนี้เปนสาระสําคัญในสุนทรพจนของ [From.GetLeader] ในวันนี้ เมื่อมีการประกาศจัดตั้ง [From.GetFactionName]\n\nนี่ไมใชเพียงองคการสากลทางการเมือง แตเปนพันธมิตรที่ผูกมัดประเทศตาง ๆ ทางการทหาร โดยทั้งสองระบอบใหคํามั่นวาจะชวยเหลือกันเพื่อตอตานภัยคุกคามจากภายนอก พันธมิตรนี้จะเปนดาบหรือโลของการปฏิวัติคอมมิวนิสตนั้นยังตองรอดูกันตอไป"
 news.159.a: "นี่จะนําไปสูสันติภาพนิรันดรหรือสงครามอีกครั้ง?"
 news.159.b: "เมื่อรวมกัน เราจะไมมีวันพายแพ!"
 news.159.c: "ความริเริ่มที่ยอดเยี่ยม!"
 news.159.tt: "[This.GetName] เปนสวนหนึ่งของ [From.GetFactionName] รวมกับ [From.GetName]\n"
 news.160.t: "เยอรมนีถูกโจมตี"
 news.160.d: "เมื่อไมนานมานี้ เยอรมนีถูกลากเขาสูสงครามอีกครั้ง แมทุกคนจะหวังใหเกิดสันติภาพอันยั่งยืนในยุโรป แตเห็นไดชัดวาความตึงเครียดในทวีปยังคงสูงเกินไป เจาหนาที่เยอรมนีแถลงวาไมอาจคงไรนแลนดไวเปนเขตปลอดทหารไดอีกตอไป โดยอางวาจําเปนตองเคลื่อนกําลังไดอยางเต็มที่ภายในพรมแดนของตนเพื่อปองกันตนเอง"
 news.160.a: "นี่ไมใชลางดีสําหรับยุโรป"
 news.160.b: "ชาวเยอรมันจะตองชนะ"
 news.161.t: "ฝรั่งเศสประกาศหามลัทธิคอมมิวนิสต"
 news.161.d: "คณะรัฐมนตรี [From.GetLeader] ไดมีคําสั่งยุบ [From.GetCommunistParty] นับตั้งแตโซเวียตรัสเซียลงนามในสนธิสัญญาไมรุกรานกับนาซีเยอรมนี ก็มีการพูดถึงการสั่งหามลัทธิคอมมิวนิสตในฝรั่งเศส คําสั่งนี้มีผลบังคับใชหลังสองชาติตกลงแบงแยกโปแลนด\n[From.GetLeader] ฉวยโอกาสนี้ขณะที่เสียงสนับสนุนการสั่งหามเพิ่มสูงขึ้น ถึงขนาดที่หนังสือพิมพฝายซายยังเริ่มสนับสนุนใหยุบ [From.GetCommunistParty]"
 news.161.a: "การตัดสินใจที่รุนแรง"
 news.161.b: "ทําทุกวิถีทางเพื่อใหชนชั้นนายทุนครองอํานาจตอไป"
 news.161.c: "อาจเปนสิ่งที่จําเปน"
 news.161.e: "นี่เปนหนทางเดียว"
 news.162.d: "เมื่อทั้งสองฝายยอมรับสนธิสัญญาสันติภาพฉบับสุดทายที่แบงสเปนออกเปนสองสวน สงครามกลางเมืองสเปนก็สิ้นสุดลง แมผูเห็นตางทั้งสองฝายจะประณามการประนีประนอมนี้ แตสันติภาพอันเปราะบางนี้อยางนอยก็ใหเวลาแกชาติที่แตกแยกไดฟนตัวและสรางใหมทั้งสองฝง"
 news.162.a: "ดีสําหรับชาวสเปน"
 news.162.b: "สักวันหนึ่ง เราจะทวงคืนสเปนทั้งหมด"
 news.163.t: "การประชุมลอนดอน"
 news.163.d: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย" การประชุมสันติภาพครั้งใหญนี้นําไปสูการตัดสินวายูโกสลาเวียควรยกสโลวีเนียใหเยอรมนีในนามของสันติภาพที่ยั่งยืน\n\nเมื่อรูสึกวาถูกมหาอํานาจแหงยุโรปทอดทิ้ง รัฐบาลของ [YUG.GetLeader] ก็ไมเห็นทางเลือกอื่นนอกจากลงนามในขอตกลงตามที่เสนอมา"
 news.163.a: "เรื่องนี้จะจบลงดวยดี"
 news.163.b: "ความยุติธรรม"
 news.163.c: "นาเสียใจ"
 news.163.e: "ถูกทรยศ"
 news.164.t: "วิกฤตในสโลวีเนีย"
 news.164.d: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย"\n\nในการประชุม อังกฤษและฝรั่งเศสยืนหยัดรวมกันตอตานขอเรียกรองของเยอรมนี โดยประกาศวายูโกสลาเวียตองคงพรมแดนไวตามที่สนธิสัญญาแวรซายกําหนด"
 news.164.d_FRA_abandoned_yugoslavia: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย"\n\nขณะที่อังกฤษยืนกรานวาตองรักษาความศักดิ์สิทธิ์ของสนธิสัญญาแวรซาย ฝรั่งเศสกลับสนับสนุนขอเรียกรองของเยอรมนีในนามของสันติภาพในยุโรป"
 news.164.a: "ขาวานี่หมายถึงสงคราม"
 news.164.b: "พวกมันจะตองเผชิญความเกรี้ยวกราดของเรา"
 news.164.c: "เราจะยืนขางความยุติธรรม"
 news.164.e: "เปนดานแรกที่ออกรบ!"
 news.164.f: "พวกอังกฤษมันโง"
 news.165.t: "วิกฤตในสโลวีเนีย"
 news.165.d: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย"\n\nแมจะเจรจากันหลายวัน การประชุมก็ไมอาจบรรลุขอตกลง แมรัฐบาลอังกฤษจะแสวงหาทางออกอยางสันติ แตฝรั่งเศสยังคงแนวแนเมื่อเผชิญการขมขูของเยอรมนี คณะผูแทนเยอรมนีเดินออกจากที่ประชุมเพื่อประทวง และเมฆหมอกแหงสงครามกําลังกอตัวเหนือสโลวีเนีย"
 news.165.a: "สถานการณดูมืดมน"
 news.165.b: "เราจะไมถอย"
 news.165.c: "นาเสียดาย"
 news.165.e: "เมื่อรวมกัน เราจะไดรับชัยชนะ"
 news.165.f: "เราจะทําในสิ่งที่ถูกตอง!"
 news.166.t: "ขอตกลงลอนดอน"
 news.166.d: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย"\n\nเหลามหาอํานาจเห็นพองกันวาควรยกสโลวีเนียใหเยอรมนี เปนความพยายามครั้งสุดทายเพื่อรักษาสันติภาพ \nอยางไรก็ตาม ในสุนทรพจนอันเรารอนที่ตอตานภัยคุกคามของเยอรมนีตอเสถียรภาพของยุโรป [YUG.GetLeader] ไดประกาศอยางแนวแนวา [YUG.GetName] จะไมยอมเสียดินแดนแมแตนิ้วเดียว แมจะถูกทอดทิ้งอยางสิ้นเชิงในยามที่ตองการความชวยเหลือก็ตาม"
