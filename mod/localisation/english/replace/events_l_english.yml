 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] ประกาศวาชาติ[Root.GetAdjective]ไมอาจทนแรงกดดันจากกองกําลังยึดครอง[From.From.GetAdjective]ที่กอความอัปยศไปทั่วประเทศไดอีกตอไป รัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศแลว กองกําลังหลักของพวกเขายอมจํานน และบัดนี้ [From.From.GetNameDef] ไดควบคุมดินแดนบานเกิดของพวกเขาแลว\nแมจะเปนความสูญเสียอันยอยยับ แตสงครามกับ [From.From.GetNameDef] ยังไมจบลงงาย ๆ"
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] ประกาศวาชาติ[Root.GetAdjective]ไมอาจทนแรงกดดันจากกองกําลังยึดครอง[From.From.GetAdjective]ที่กอความอัปยศไปทั่วประเทศไดอีกตอไป รัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศแลว กองกําลังหลักของพวกเขายอมจํานน และบัดนี้ [From.From.GetNameDef] ไดควบคุมดินแดนบานเกิดของพวกเขาแลว\nแมสงครามกับ [From.From.GetNameDef] จะยังดําเนินตอไป แตนี่คือความพายแพอันนาเสียดายของ [Root.GetFactionName] ทั้งมวล"
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] ประกาศวาชาติ[Root.GetAdjective]ไมอาจทนแรงกดดันจากกองกําลังยึดครอง[From.From.GetAdjective]ที่กอความอัปยศไปทั่วประเทศไดอีกตอไป รัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศแลว กองกําลังหลักของพวกเขายอมจํานน และบัดนี้ [From.From.GetNameDef] ไดควบคุมดินแดนบานเกิดของพวกเขาแลว\nแมสงครามกับ [From.From.GetNameDef] และสมาชิกที่เหลือของ [From.From.GetFactionName] จะยังดําเนินตอไป แตนี่คือความพายแพอันนาเสียดายของ [Root.GetFactionName] ทั้งมวล"
 country_capitulated.0.d_neutral_both_no_faction: "\nรัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศ และกองกําลังหลักของพวกเขาไดยอมจํานนตอ [From.From.GetNameDef] ซึ่งบัดนี้ควบคุมดินแดนบานเกิดของพวกเขาแลว\n\nแมการตอสูระหวาง [From.From.GetName] และ [Root.GetName] จะสิ้นสุดลง แต [From.From.GetNameDef] ยังคงอยูในสงครามเต็มรูปแบบ และการสูรบยังดําเนินตอไปในที่อื่น"
 country_capitulated.0.d_neutral_prev_no_faction: "\nรัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศ และกองกําลังหลักของพวกเขาไดยอมจํานนตอ [From.From.GetNameDef] ซึ่งบัดนี้ควบคุมดินแดนบานเกิดของพวกเขาแลว\n\nการตอสูใน [Root.GetName] เปนเพียงสวนเล็ก ๆ ของความขัดแยงนี้ สงครามระหวาง [From.From.GetNameDef] และสิ่งที่เหลืออยูของ [Root.GetFactionName] ยังดําเนินตอไปในที่อื่น"
 country_capitulated.0.d_neutral_prev_faction: "\nรัฐบาล[Root.GetAdjective]ไดลี้ภัยออกนอกประเทศ และกองกําลังหลักของพวกเขาไดยอมจํานนตอ [From.From.GetNameDef] ซึ่งบัดนี้ควบคุมดินแดนบานเกิดของพวกเขาแลว\n\nการตอสูระหวาง [From.From.GetNameDef] และ [Root.GetNameDef] เปนเพียงสวนเล็ก ๆ ของความขัดแยงนี้ สงครามระหวาง [From.From.GetFactionName] และสิ่งที่เหลืออยูของ [Root.GetFactionName] ยังดําเนินตอไปในที่อื่น"
 country_capitulated.0.d_positive_collab_diff_ideology: "\n[Root.GetNameDef] ประกาศยอมแพโดยสิ้นเชิงตอ [From.From.GetNameDef] กองกําลัง[From.From.GetAdjective]รวมกับผูสนับสนุนแนวทาง[From.From.GetRulingIdeology]ชาว[Root.GetAdjective]กลุมอิสระจํานวนหนึ่ง ไดบีบให [Root.GetLeader] และรัฐบาลของเขาตองลี้ภัย ขณะที่รัฐบาลใหมไดรับการจัดตั้งขึ้นเพื่อปกครอง [Root.GetNameDef] โดยรวมมือกับ [From.From.GetNameDef] [From.From.GetLeader] กลาววาขอตกลงรวมกันนี้จะนํายุคใหมแหงความรุงเรืองและความรวมมือมาสู [Root.GetNameDef]\n[Root.GetLeader] ตอบโตวา แมจะตองลี้ภัย เขาก็จะสูตอไปเพื่อ [Root.GetNameDef] และสนับสนุนการตอตานทุกรูปแบบในมาตุภูมิ"
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "\n[Root.GetNameDef] ประกาศยอมแพโดยสิ้นเชิงตอ [From.From.GetNameDef] พลเมืองชาว[Root.GetAdjective]จํานวนหนึ่งที่ไมพอใจกับ[From.From.GetRulingIdeologyNoun]ในแบบที่ [Root.GetLeader] นํามาสู [Root.GetNameDef] ไดรวมมือกับทหาร[From.From.GetAdjective]ปลดเขาออกจากอํานาจ และจัดตั้งรัฐบาลใหมภายใตการชี้นําของ [From.From.GetNameDef] [From.From.GetLeader] กลาววาขอตกลงรวมกันนี้จะนํายุคใหมแหงความรุงเรืองและความรวมมือมาสู [From.From.GetNameDef]\n[Root.GetLeader] ตอบโตวา [From.From.GetLeader] ไมใช[From.From.GetRulingIdeology]ที่แทจริง และแมจะตองลี้ภัย เขาก็จะสูตอไปเพื่อ [Root.GetNameDef] และสนับสนุนการตอตานทุกรูปแบบในมาตุภูมิ"
 country_capitulated.0.d_negative_collab_diff_ideology: "\n[Root.GetNameDef] ประกาศยอมแพโดยสิ้นเชิงตอ [From.From.GetNameDef] เห็นไดชัดวาการที่รัฐบาล[Root.GetAdjective]ผอนปรนตอผูเห็นใจแนวทาง[From.From.GetRulingIdeology]ภายในประเทศ เปนปจจัยหนึ่งที่นําไปสูการลมสลายของ [Root.GetName] เมื่อ [Root.GetFascistLeader] ไดกาวขึ้นสูอํานาจเพื่อปกครองประเทศในนามของระบอบของ [From.From.GetLeader]\n[Root.GetLeader] ยืนยันวานี่ยังไมใชจุดจบของอธิปไตย[Root.GetAdjective] และรัฐบาลจะสนับสนุนการตอตานทุกรูปแบบแมจะตองลี้ภัยจากมาตุภูมิ"
 country_capitulated.0.a: "ขาวดี!"
 country_capitulated.0.b: "ชางเปนชวงเวลาที่มืดมน"
 country_capitulated.0.c: "ชวงเวลาแหงความไมแนนอน"
 britain.22.t: "สแตนลีย บอลดวิน ลาออก"
 britain.22.d: "สองสัปดาหหลังพิธีบรมราชาภิเษกของสมเด็จพระเจาจอรจที่ 6 นายบอลดวินประกาศลาออกจากตําแหนงนายกรัฐมนตรีเพื่อเกษียณในวัย 70 ป เขานํารัฐบาลแหงชาติแบบเขา ๆ ออก ๆ มาตั้งแตป 1923 เปนผูนําที่มั่นคงซึ่งพาจักรวรรดิอังกฤษพนจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ และในชวงไมกี่ปมานี้ไดกํากับดูแลการเริ่มเสริมกําลังอาวุธของจักรวรรดิและการสละราชสมบัติของสมเด็จพระเจาเอ็ดเวิรดที่ 8 อยางไมเต็มใจนัก เขาลงจากตําแหนงในฐานะนายกรัฐมนตรีที่เปนที่นิยมและประสบความสําเร็จ แตเขาทํามากพอที่จะรับมือภัยคุกคามที่เพิ่มขึ้นจากเยอรมนีแลวหรือยัง?"
 britain.22.a: "นายแชมเบอรเลนจะพยายามจัดตั้งรัฐบาล"
 france.31.t: "เอดูอาร ดาลาดิเย ลาออก"
 france.31.d: "เมื่อสาธารณรัฐที่สามลมสลาย และรัฐบาลเยอรมนีปฏิเสธที่จะเสนอการสงบศึก ภาระการสูรบตอจากดินแดนอาณานิคมจึงตองตกเปนของผูนําชุดใหม แมจะมีนอยคนที่สงสัยวามองซิเยอรดาลาดิเยเปนนายกรัฐมนตรีที่ดี แตเขาก็ไมอาจรับมือกับสถานการณอันพิเศษสุดที่ฝรั่งเศสตองเผชิญได เราทําไดเพียงภาวนาวาจะมีแสงสวางที่ปลายอุโมงค"
 france.31.a: "มองซิเยอรเรโนจะพยายามจัดตั้งรัฐบาล"
 germany.999.t: "เรื่องเลาของสองนคร"
 germany.999.desc: "หลังชัยชนะอันนาตื่นตะลึงของกองทัพเยอรมัน ถึงเวลาแลวที่จะกวาดลางรองรอยสุดทายของการปกครองแบบบอลเชวิคในยุโรป แมบัดนี้ ชื่อของสตาลินและเลนินก็ยังคงสรางความอัปยศใหแกสองนครใหญในเลเบินสเรามแหงใหมของเยอรมนี เปนการเยยหยันทหารที่สละชีพเพื่อยึดเมืองเหลานั้นมา \n\n"สมาคมทหารผานศึกแหงมหาสงคราม" ไดยื่นขอเสนอตอรัฐบาลเพื่อแกไขสภาพการณอันนาอดสูนี้"
 germany.999.a: "มาเชิดชูวีรบุรุษแหงสงครามครั้งกอนกันเถอะ!"
 germany.999.b: "ชางเปนขอเสนอที่ไรสาระสิ้นดี!"
 GAME_OVER_TT: "§Rเกมจะจบลงสําหรับคุณ§!"
 CAN_ANGERED_WORKERS: "สิ่งนี้จะทําใหประชาชนไมพอใจ"
 generic.2.t: "[From.GetNameDefCap] ตองการเขารวม [Root.GetFactionName]"
 generic.2.d.a: "ทามกลางภัยคุกคามตอเสรีภาพและคุณคาประชาธิปไตยที่เพิ่มขึ้น ชาว[alliance_applicant.GetAdjective]มองวาเราเปนผูพิทักษเสรีภาพ บัดนี้พวกเขาปรารถนาจะเขารวมพันธมิตรของเรา ทั้งเพื่อรับการคุมครองจากเรา และเพื่อยืนหยัดเคียงขางเราตอตานพลังที่คุกคามประชาธิปไตย"
 generic.2.d.b: "ความพยายามของเราที่จะพลิกระเบียบโลกในปจจุบันไมไดรอดพนสายตาของชาติที่มีอุดมการณเดียวกัน ชาว[alliance_applicant.GetAdjective]ตระหนักวาโอกาสที่ดีที่สุดที่จะสรางอนาคตอันรุงเรืองใหตนเองคือการรวมมือกับเราในความขัดแยงที่กําลังจะมาถึง พวกเขาจึงเสนอตัวเขารวมกับเราอยางเปนทางการเพื่อตอสูกับศัตรูของเรา"
 generic.2.d.c: "[alliance_applicant.GetNameDefCap] ตระหนักวาตนตองรวมพลังกับสาธารณรัฐสังคมนิยมพี่นองเพื่อเสริมความแข็งแกรงใหลัทธิคอมมิวนิสตในโลก ชาว[alliance_applicant.GetAdjective]ยอมรับบทบาทผูนําของเราในการตอสูของชนชั้นแรงงานสากล และบัดนี้ไดขอเขารวมเปนพันธมิตรกับเราอยางเปนทางการ"
 generic.2.d.e: "ขณะที่ความปนปวนในการเมืองระหวางประเทศยังคงสั่นสะเทือนไปทั่วโลก ชาว[alliance_applicant.GetAdjective]เห็นวาเราคือโอกาสที่ดีที่สุดในการเอาตัวรอดผานชวงเวลาอันวุนวายนี้ พวกเขาจึงขอเขารวมพันธมิตรของเรา เพื่อที่เราจะไดฝาพายุที่กําลังจะมาถึงไปดวยกัน"
 generic.2.a: "ทุกผูที่ยืนหยัดเพื่อเสรีภาพและประชาธิปไตยยอมยืนเคียงขางเราได"
 generic.2.b: "โลกเปนของผูแข็งแกรงทุกคน!"
 generic.2.c: "หากเรายืนหยัดรวมกัน การปฏิวัติยอมไดรับชัยชนะ"
 generic.2.e: "และเราจะฝามันไปใหได!"
 generic.2.f: "ไมมีพวกเขาเราก็ดีกวา"
 generic.2.g: "เรามีพันธมิตรที่จําเปนอยูแลว"
 generic.3.t: "[alliance_inviter.GetNameDefCap] ตอนรับเราสู [alliance_inviter.GetFactionName]"
 generic.3.d: "[alliance_inviter.GetNameDefCap] ตัดสินใจตอบรับคําขอของเราที่จะเขารวม [alliance_inviter.GetFactionName] นับจากนี้เราจะอยูหรือลมไปดวยกัน"
 generic.3.a: "เราจะรวมกันปกปองประชาธิปไตย"
 generic.3.b: "ไมมีใครตานเราได!"
 generic.3.c: "การตอสูของชนชั้นแรงงานไมอาจหาผูนําที่ดีกวานี้ไดอีกแลว!"
 generic.3.e: "เราจะพักความขัดแยงไวกอน ในตอนนี้"
 generic.4.t: "[alliance_inviter.GetNameDefCap] ปฏิเสธคําขอเขารวม [alliance_inviter.GetFactionName]"
 generic.4.d: "[alliance_inviter.GetNameDefCap] ตัดสินใจปฏิเสธคําขอของเราที่จะเขารวม [alliance_inviter.GetFactionName] เราคงตองหาทางไปตอโดยไมมีความชวยเหลือจากพวกเขา"
 generic.4.a: "แลวยังเรียกตัวเองวาผูพิทักษเสรีภาพอีกหรือ?"
 generic.4.b: "ถาอยางนั้นเราจะบดขยี้พวกเขาดวย!"
 generic.4.c: "การปฏิวัติของพวกเขาเสื่อมทรามแลว!"
 generic.4.e: "ความแตกตางของเรามากเกินไป"
 news.289.t: "[alliance_applicant.GetNameDefCap] เขารวม [alliance_inviter.GetFactionName]"
 news.289.d: "\nเมื่อชวงตนของวันนี้ [alliance_inviter.GetNameDef] และ [alliance_applicant.GetNameDef] ไดออกแถลงการณรวมวาฝายหลังไดรับสถานะสมาชิกของ [alliance_inviter.GetFactionName] อยางเปนทางการแลว ความรวมมือนี้จะถูกใชเพื่อการรุกหรือการปองกันยังคงตองรอดูกันตอไป แตไมตองสงสัยเลยวาการวางแผนทางทหารรวมกันอยางกวางขวางไดเริ่มตนขึ้นแลว"
 news.289.a: "เราแข็งแกรงขึ้นเมื่ออยูดวยกัน"
 news.289.b: "พวกเขาแสวงหาความแข็งแกรงจากจํานวน"
 news.289.c: "มันจะไมชวยอะไรพวกเขาได!"
 news.289.e: "สงครามกําลังลุกลาม..."
 news.289.f: "พันธมิตรของเราแข็งแกรงขึ้น"
 generic.5.t: "[From.GetNameDefCap] เชิญ [Root.GetNameDef] เขารวม [From.GetFactionName]"
 generic.5.d.a: "ดวยความระแวดระวังตอพัฒนาการลาสุดในการเมืองโลก [alliance_inviter.GetNameDef] ไดยื่นมือแหงมิตรภาพมาใหเรา เสนอการคุมครอง และชักชวนใหเรายืนหยัดเคียงขางพวกเขาเพื่อปกปองหลักการแหงเสรีภาพและประชาธิปไตย ในฐานะสมาชิกของ [alliance_inviter.GetFactionName] เสรีภาพของประชาชนของเรายอมไดรับการปกปอง"
 generic.5.d.b: "ดวยตระหนักวาบางครั้งแมแตผูแข็งแกรงก็ยังตองการพันธมิตร ชาว[alliance_inviter.GetAdjective]จึงเชิญเราเขารวม [alliance_inviter.GetFactionName] หากเราตอบรับ นี่อาจเปนโอกาสอันดีที่เราจะไดที่ยืนอันรุงโรจนภายใตดวงอาทิตย"
 generic.5.d.c: "พันธมิตรทางอุดมการณของเราใน [alliance_inviter.GetNameDef] ไดเห็นคุณูปการอันมีคาของเราตออุดมการณของชนชั้นแรงงาน และเชานี้เราไดรับคําเชิญใหเขารวม [alliance_inviter.GetFactionName] การยืนหยัดรวมกับสาธารณรัฐสังคมนิยมอื่น ๆ จะทําใหเราเผยแพรการปฏิวัติไดดวยพลังที่แข็งแกรงยิ่งขึ้น"
 generic.5.d.e: "ดูเหมือนวาชาว[alliance_inviter.GetAdjective]จะเห็นวาเรามีความสําคัญทางยุทธศาสตรตอพวกเขา และเห็นวาการรวมมือกันจะไดประโยชนมากกวาการปลอยใหความแตกตางทางอุดมการณมาแบงแยกเรา เชานี้เอกอัครราชทูต[alliance_inviter.GetAdjective]ไดสงคําเชิญใหเราเปนรัฐสมาชิกของ [alliance_inviter.GetFactionName]"
 generic.5.a: "เราจะยืนหยัดรวมกับพวกเขา"
 generic.5.b: "เราตองการคนตายแคไมกี่พันคน..."
 generic.5.c: "เราจะสูเคียงขางสหายของเรา!"
 generic.5.e: "นี่คือทางเลือกที่ไดประโยชน"
 generic.6.t: "[alliance_applicant.GetNameDefCap] ตอบรับคําเชิญเขารวม [alliance_inviter.GetFactionName]"
 generic.6.d: "[alliance_applicant.GetNameDefCap] ตัดสินใจตอบรับขอเสนอของเราที่จะเขารวม [alliance_inviter.GetFactionName] นับจากนี้เราจะอยูหรือลมไปดวยกัน"
 generic.7.t: "[alliance_applicant.GetNameDefCap] ปฏิเสธขอเสนอเขารวม [alliance_inviter.GetFactionName]"
 generic.7.d: "[alliance_applicant.GetNameDefCap] ตัดสินใจปฏิเสธขอเสนอของเราที่จะเขารวม [alliance_inviter.GetFactionName] เราคงตองหาทางไปตอโดยไมมีความชวยเหลือจากพวกเขา"
 generic.7.a: "ความชวยเหลือของเราไมเปนที่ตองการ"
 news.290.t: "ออทโทขึ้นครองมงกุฎฮังการี"
 news.290.desc: "ในการแสวงหากษัตริยที่เหมาะสม ราชอาณาจักรฮังการีไดเชิญออทโท ฟอน ฮาพสบวรค ใหกลับคืนสูดินแดนที่ราชวงศของเขาเคยปกครองจนกระทั่งไมนานมานี้ ออทโทซึ่งลี้ภัยอยูทั่วยุโรปตะวันตกนับตั้งแตสิ้นมหาสงครามและการลมสลายของจักรวรรดิของพระบิดา ไดตัดสินใจตอบรับขอเสนอ วันนี้ ทามกลางการเฉลิมฉลองอันยิ่งใหญ เขาไดรับการสวมมงกุฎเปนกษัตริยแหงฮังการีในพิธีอันศักดิ์สิทธิ์ ณ พระราชวังหลวงในบูดาเปสต\n\nในสุนทรพจนระหวางพิธีราชาภิเษก กษัตริยออทโทขอบคุณชาวฮังการีสําหรับความจงรักภักดีและความทุมเท และปฏิญาณวาจะรวมดินแดนของราชวงศฮาพสบวรคใหเปนหนึ่งเดียวอีกครั้ง โดยสัญญาวาครั้งนี้ฮังการีจะเปนสวนที่มีบทบาทนํา"
 news.290.a: "ไมใชราชอาณาจักรแตเพียงในนามอีกตอไป"
 news.290.b: "นั่นเปนคําพูดที่อันตราย..."
 news.290.c: "การแยงชิงออสเตรียเริ่มขึ้นแลว!"
 news.290.e: "จักรวรรดิจะผงาดขึ้นอีกครั้งหรือไม?"
 news.291.t: "ออสเตรียลงมติรวมกับฮังการี"
 news.291.desc: "ตามการเรียกรองของชาวฮังการี ออสเตรียไดจัดการลงประชามติเรื่องการรวมสองชาติเขาดวยกันอีกครั้งภายใตมงกุฎแหงราชวงศฮาพสบวรค การนับคะแนนครั้งสุดทายใกลเสร็จสิ้นแลว แตก็เห็นไดชัดวาฝายสนับสนุนการรวมชาติไดรับชัยชนะอยางถลมทลาย ไมมีรายงานความผิดปกติในกระบวนการลงคะแนน และรัฐบาลออสเตรียจําเปนตองปรับโครงสรางตนเองเปนรัฐบาลสวนภูมิภาคของรัฐฮังการี\n\nแมความเคลื่อนไหวนี้จะไดรับการตอนรับอยางมากจากสาธารณชนชาวฮังการี แตผลกระทบทางการเมืองของประชามติครั้งนี้นาจะสงแรงสะเทือนไปทั่วยุโรป"
 news.291.a: "สายสัมพันธฉันพี่นองของเรายังไมถูกลืม"
 news.291.b: "เรื่องนี้จะไมผานไปโดยไรผลตามมา..."
 news.291.c: "สุญญากาศแหงอํานาจของจักรวรรดิอาจไดรับการเติมเต็มในที่สุด..."
 news.292.desc: "ตามการเรียกรองของชาวฮังการี ออสเตรียไดจัดการลงประชามติเรื่องการรวมสองชาติเขาดวยกันอีกครั้งภายใตมงกุฎแหงราชวงศฮาพสบวรค การนับคะแนนครั้งสุดทายใกลเสร็จสิ้นแลว แตก็เห็นไดชัดวาฝายสนับสนุนการรวมชาติไดรับชัยชนะอยางถลมทลาย มีรายงานมากมายเรื่องความไมสอดคลอง การทุจริตการลงคะแนน และการโกงการเลือกตั้ง แตเจาหนาที่ออสเตรียปดตกขอกลาวหาเหลานี้ และไดเริ่มปรับโครงสรางการบริหารเปนรัฐบาลสวนภูมิภาคของรัฐฮังการีแลว\n\nแมความเคลื่อนไหวนี้จะไดรับการตอนรับอยางมากจากสาธารณชนชาวฮังการี แตผลกระทบทางการเมืองของประชามติครั้งนี้นาจะสงแรงสะเทือนไปทั่วยุโรป"
 news.292.a: "สายสัมพันธฉันพี่นองกับสินบนอีกเล็กนอย..."
 news.292.b: "นั่นคือแผนของเรา!"
 news.292.c: "สุญญากาศแหงอํานาจของจักรวรรดิอาจไดรับการเติมเต็มในที่สุด..."
 news.292.e: "เปนการหยามประชาธิปไตย!"
 news.293.t: "ออสเตรียลงมติไมรวมชาติ"
 news.293.desc: "ตามการเรียกรองของชาวฮังการี ออสเตรียไดจัดการลงประชามติเรื่องการรวมสองชาติเขาดวยกันอีกครั้งภายใตมงกุฎแหงราชวงศฮาพสบวรค การนับคะแนนครั้งสุดทายใกลเสร็จสิ้นแลว แตฝายสนับสนุนการรวมชาติไมมีทางชนะไดอีกตอไป รัฐบาลออสเตรียจึงตัดสินใจไมเขารวมสหภาพออสเตรีย-ฮังการี\n\nดวยเจตนารมณแหงประชาธิปไตยและการกําหนดชะตากรรมของตนเอง ฮังการียอมรับผลดังกลาวและตัดสินใจไมผลักดันขอเสนอตอไปอีก"
 news.293.a: "นาเสียดายยิ่งนัก"
 news.293.b: "เอกราชของเราปลอดภัยแลว!"
 news.293.c: "ยอดเยี่ยม... ตาเราตอไป"
 news.293.e: "ถาอยางนั้น การลมสลายของจักรวรรดิก็เปนการถาวร"
 news.294.t: "ออสเตรียลงมติไมรวมชาติ"
 news.294.desc: "ตามการเรียกรองของชาวฮังการี ออสเตรียไดจัดการลงประชามติเรื่องการรวมสองชาติเขาดวยกันอีกครั้งภายใตมงกุฎแหงราชวงศฮาพสบวรค การนับคะแนนครั้งสุดทายใกลเสร็จสิ้นแลว แตฝายสนับสนุนการรวมชาติไมมีทางชนะไดอีกตอไป รัฐบาลออสเตรียจึงตัดสินใจไมเขารวมสหภาพออสเตรีย-ฮังการี\n\nอยางไรก็ตาม ฮังการีกลาวหารัฐบาลออสเตรียวาโกงการลงคะแนนเพื่อขัดขวางการรวมชาติ และประกาศวาจะไมลังเลที่จะใชกําลังเพื่อปกปองความปรารถนาของชาวออสเตรียที่ตองการรวมกับพี่นองชาวฮังการี บัดนี้ทั้งสองฝายเริ่มระดมพลแลว และสงครามดูเหมือนจะหลีกเลี่ยงไมได"
 news.294.a: "ความตายเพียงไมกี่รายจะนับอะไรไดเมื่อเทียบกับจักรวรรดิ?"
 news.294.b: "เราจะปกปองเวียนนาจนคนสุดทาย!"
 news.294.c: "นี่ทําลายแผนการทั้งหมดของเรา..."
 news.294.e: "หวังวาความขัดแยงจะไมลุกลาม"
 news.295.t: "ฟนฟูออสเตรีย-ฮังการี"
 news.295.desc: "เมื่อการรวมออสเตรียและฮังการีเสร็จสมบูรณ รัฐบาลฮังการีไดเชิญสื่อมวลชนนานาชาติมายังบูดาเปสตและประกาศฟนฟูจักรวรรดิออสเตรีย-ฮังการี\n\nกษัตริยออทโทไดรับตําแหนงอันชอบธรรมในฐานะจักรพรรดิแหงออสเตรีย และยํ้าคําปฏิญาณวา แมจักรวรรดิจะยังเปนเพียงเงาของตนเองในอดีต แตพระองคจะไมหยุดพักจนกวาดินแดนทั้งหมดของราชวงศฮาพสบวรคจะไดรวมกันอีกครั้ง ประเทศเพื่อนบานยอมจับตามองความเคลื่อนไหวในบูดาเปสตดวยความระแวง"
 news.295.a: "ดั่งนกฟนิกซที่ฟนจากเถาถาน"
 news.295.b: "นี่เปลี่ยนสถานการณไปมากทีเดียว..."
 news.295.c: "พวกเขาจะเปนมิตรหรือศัตรู?"
 news.295.e: "เราควรเสริมปอมปราการตามชายแดนไว..."
 news.296.t: "วิลเฮลมขึ้นครองมงกุฎฮังการี"
 news.296.desc: "ในการแสวงหากษัตริยใหแกชาติของตน หลังการเจรจาและการเตรียมการอันยาวนาน ชาวฮังการีไดเชิญเจาชายวิลเฮลมแหงสวีเดน ดยุกแหงเซอเดอรมันลันด อยางเปนทางการเมื่อตนสัปดาหนี้ วันนี้ ทามกลางการเฉลิมฉลองอันยิ่งใหญ พระองคไดรับการสวมมงกุฎเปนกษัตริยแหงฮังการีในพิธีอันศักดิ์สิทธิ์ ณ พระราชวังหลวงในบูดาเปสต\n\nกลาวกันวากษัตริยองคใหมทรงใสพระทัยในความเปนอยูของประชาชน และทรงสนับสนุนสิทธิประชาธิปไตยของพวกเขาอยางแข็งขัน ยิ่งไปกวานั้น พระองคยังทรงสนับสนุนการเจรจากับเพื่อนบานของฮังการีมากกวาความเปนปรปกษ กษัตริยองคใหมจึงอาจเปนผูชวยลดความตึงเครียดในภูมิภาคไดเปนอยางดี"
 news.296.b: "ผูออนแออีกคนผงาดขึ้นมา"
 news.296.c: "ผูถือคบเพลิงอีกคนหนึ่ง"
 news.297.t: "ฟรีดริช ฟรันซ ขึ้นครองมงกุฎฮังการี"
 news.297.desc: "ในการแสวงหากษัตริยใหแกชาติของตน หลังการเจรจาและการเตรียมการอันยาวนาน ชาวฮังการีไดเชิญฟรีดริช ฟรันซ ชาวเยอรมัน แกรนดดยุกแหงเมคเลินบวรค-ชเวริน อยางเปนทางการเมื่อตนสัปดาหนี้ วันนี้ ทามกลางการเฉลิมฉลองอันยิ่งใหญ เขาไดรับการสวมมงกุฎเปนกษัตริยแหงฮังการีในพิธีอันศักดิ์สิทธิ์ ณ พระราชวังหลวงในบูดาเปสต\n\nในฐานะสมาชิกหนวย SS มาตั้งแตป 1931 แนวคิดทางอุดมการณของกษัตริยองคใหมเปนที่รูกันดี และเขาไดประกาศแลววา 'จะนําความยิ่งใหญที่ฮังการีสมควรไดรับมาให ไมวาจะตองแลกดวยอะไรก็ตาม' เมื่อรวมกับคําสัญญาของกษัตริยที่จะ 'ลางความอยุติธรรมที่เราไดรับในอดีต' พิธีราชาภิเษกครั้งนี้จึงไมนาจะชวยผอนคลายความตึงเครียดในภูมิภาค"
 news.297.b: "พัฒนาการที่นากังวลอยางยิ่ง..."
 news.297.c: "พันธมิตรที่มีศักยภาพรายใหม!"
 news.298.t: "[HUN.GetName] ประกาศยกเลิกสนธิสัญญาทรียานง"
 news.298.desc: "ในการประกาศตอสาธารณะ [HUN.GetLeader] ไดยกเลิกสนธิสัญญาที่ฝายสัมพันธมิตรบังคับใชหลังมหาสงคราม สนธิสัญญานี้ชาว[HUN.GetAdjective]ลงนามอยางจําใจเมื่อป 1920 ทําใหประเทศสูญเสียดินแดนไปมากและจํากัดกําลังทางทหาร\n\nในสุนทรพจน [HUN.GetLeader] ยังบอกเปนนัยวาฮังการีอาจหันมายืนยันการอางสิทธิ์เหนือดินแดนที่ถูกยึดไปเมื่อสองทศวรรษกอนในไมชา"
 news.298.a: "ความอัปยศสิ้นสุดลงแลว แตจะไมมีวันถูกลืม!"
 news.298.b: "พวกเขากําลังปวนระเบียบโลก..."
 news.298.c: "พวกเขาหลุดพนจากแอกแหงแวรซายแลว"
 news.299.t: "ฮังการีประกาศสถาปนามหาฮังการี"
 news.299.desc: "เมื่อไดดินแดนที่ถูกยึดไปตามสนธิสัญญาทรียานงคืนมาแลว เมื่อเย็นวานนี้ [From.GetLeader] ไดออกประกาศวานับจากนี้ชาติจะมีชื่อวามหาฮังการี หวังวาสิ่งนี้จะชวยเพิ่มเกียรติภูมิของมหาฮังการีในสายตาชาวโลก และสะทอนถึงขอบเขตพรมแดนของประเทศไดดียิ่งขึ้น"
 news.299.a: "โลกจะไดเห็นแสนยานุภาพของเรา"
 news.299.b: "พวกเขาออกจะหลงตัวเองไปหนอย"
 news.300.t: "[HUN.GetNameDefCap] เรียกรองทรานซิลเวเนีย"
 news.300.desc: "ในความพยายามที่จะลมลางสนธิสัญญาทรียานงตอไป [HUN.GetNameDef] ไดยื่นคําขาดตอ [ROM.GetNameDef] เรียกรองใหคืนทรานซิลเวเนีย ยังไมมีการตอบกลับอยางเปนทางการ แต [HUN.GetNameDef] ไดบอกเปนนัยแลววาจะพิจารณาใชกําลังอาวุธหากขอเรียกรองถูกปฏิเสธ"
 news.300.a: "เราจะไมยอมถูกขมเหงอีกตอไป!"
 news.300.b: "เราตองคิดใหเร็ว..."
 news.300.c: "หวังวาพวกเขาจะตกลงกันไดอยางสันติ"
 news.301.t: "[ROM.GetNameDefCap] คืนทรานซิลเวเนีย"
 news.301.desc: "[ROM.GetNameDefCap] ประกาศวาจะยอมรับขอเรียกรองของ[HUN.GetAdjective]ใหคืนทรานซิลเวเนีย ดินแดนนี้จึงไดกลับมารวมกับประเทศอีกครั้ง ทําใหประเทศขยายใหญและแข็งแกรงขึ้นอยางมาก ความสําเร็จขนาดนี้คงไมทําใหชาวฮังการีหยุดเรียกรองดินแดนที่เสียไปสวนที่เหลือ"
 news.301.a: "เรากําลังอยูบนเสนทางสูความยิ่งใหญ!"
 news.301.b: "เราไมมีทางเลือก"
 news.301.c: "อยางนอยสันติภาพก็ยังคงอยู"
 news.302.t: "โรมาเนียปฏิเสธขอเรียกรองของ[HUN.GetAdjective]"
 news.302.desc: "เสนตายของคําขาดผานพนไปโดยไมมีคําตอบจากโรมาเนีย เจาหนาที่[HUN.GetAdjective]ที่เดือดดาลไดประณามรัฐบาลโรมาเนีย โดยกลาวหาวาพวกเขากําลัง 'บอนทําลายเสถียรภาพของภูมิภาค' ดวยการยืนกรานยึดถือ 'สนธิสัญญาที่ไมชอบธรรม' ทั้งสองชาติดูเหมือนกําลังเตรียมพรอมสําหรับสงครามที่อาจปะทุขึ้นไดทุกเมื่อ"
 news.302.a: "ถาพวกเขาฟงแตภาษาของกําลัง..."
 news.302.b: "ใหพวกเขามาเลย!"
 news.302.c: "พวกหัวดื้อโงเขลา..."
 news.303.t: "ฮังการีเรียกรองสโลวาเกียใต"
 news.303.desc: "ตามคําปฏิญาณที่จะแกไขสนธิสัญญาทรียานง ฮังการีไดเรียกรองให [From.GetName] คืนสโลวาเกียใต ชาว[From.GetAdjective]ยังไมไดตอบกลับ แตภัยคุกคามแหงสงครามในถอยคําของ[HUN.GetAdjective]นั้นชัดเจนเกินไป การปฏิเสธอาจนําไปสูสงครามครั้งใหมในภูมิภาค"
 news.303.a: "พวกเขาควรรูสึกโชคดีที่เราเรียกรองแคนี้"
 news.303.b: "หวังวาเราจะหาทางประนีประนอมได..."
 news.304.t: "[From.GetName] คืนสโลวาเกียใต"
 news.304.desc: "[From.GetName] ยอมรับขอเรียกรองของ[HUN.GetAdjective]ใหคืนสโลวาเกียใตอยางเปนทางการ และไดรีบดําเนินการเพื่อใหดินแดนนี้ถูกสงคืนแกฮังการีโดยทันที ความสําเร็จนี้คงไมทําใหชาว[HUN.GetAdjective]หยุดเรียกรองดินแดนที่เสียไปสวนที่เหลือ"
 news.304.a: "เรายินดีตอนรับพวกเขากลับสูออมอก"
 news.305.t: "[From.From.GetName] ปฏิเสธขอเรียกรองของ[HUN.GetAdjective]"
 news.305.desc: "การเจรจาทางการทูตลมเหลว และวันนี้ [From.From.GetName] ไดปฏิเสธขอเรียกรองของ[HUN.GetAdjective]ที่ใหคืนสโลวาเกียใตตอสาธารณะ เจาหนาที่[HUN.GetAdjective]ที่เดือดดาลไดประณามรัฐบาลของ [From.From.GetName] โดยกลาวหาวาพวกเขากําลัง 'บอนทําลายเสถียรภาพของภูมิภาค' ดวยการยืนกรานยึดถือ 'สนธิสัญญาที่ไมชอบธรรม' ทั้งสองชาติดูเหมือนกําลังเตรียมพรอมสําหรับสงครามที่อาจปะทุขึ้นไดทุกเมื่อ"
 news.306.t: "ฮังการีเรียกรองวอยวอดีนา"
 news.306.desc: "ดวยความสําเร็จกอนหนานี้ในการทวงคืนดินแดนที่สูญเสียไป บัดนี้ชาว[HUN.GetAdjective]ไดเรียกรองใหยูโกสลาเวียคืนวอยวอดีนา ขณะที่ชาวยูโกสลาฟพยายามหาทางออกทางการทูต ความใจรอนของ[HUN.GetAdjective]ก็ปรากฏชัดขึ้นเรื่อย ๆ และหากชาวยูโกสลาฟปฏิเสธขอเรียกรอง ก็ไมนาจะหาทางออกอยางสันติได"
 news.306.a: "การเดินหนาสูมหาฮังการียังดําเนินตอไป"
 news.306.b: "เราตองคิดใหเร็ว..."
 news.307.t: "ยูโกสลาเวียคืนวอยวอดีนา"
 news.307.desc: "ยูโกสลาเวียตัดสินใจยอมตามขอเรียกรองของ[HUN.GetAdjective] และไดจัดการโอนวอยวอดีนาใหแกเพื่อนบานอยางรวดเร็ว แมจะตองอาศัยการทูตแบบเรือปนอยูมาก แตก็ปฏิเสธไมไดวาฮังการีไดกลายเปนมหาอํานาจระดับภูมิภาครายใหม"
 news.307.a: "ชัยชนะทางการทูตอีกครั้ง!"
 news.308.t: "ยูโกสลาเวียปฏิเสธขอเรียกรองของ[HUN.GetAdjective]"
 news.308.desc: "ชาวยูโกสลาฟปฏิเสธขอเรียกรองของ[HUN.GetAdjective]ตอวอยวอดีนาอยางทาทายชัดแจง สวนฮังการีเองก็ไมมีทาทีจะลดการขมขูใชกําลังเพื่อยึด 'ดินแดนอันชอบธรรม' ของตน ทั้งสองชาติดูเหมือนกําลังเตรียมพรอมสําหรับสงครามที่อาจปะทุขึ้นไดทุกเมื่อ"
 news.309.t: "ฮังการีอางสิทธิ์ความเปนเจาเหนือสโลวาเกีย"
 news.309.desc.a: "ชาว[HUN.GetAdjective]อางวาสโลวาเกียควรกลับมาเปนสวนหนึ่งของชาติพวกเขาอีกครั้ง ไมวาจะเปนสวนหนึ่งโดยสมบูรณหรือเปนเขตปกครองตนเอง มีการยื่นคําขาดในเรื่องนี้พรอมการขมขูใชกําลัง และนักการทูตจากหลายชาติในยุโรปตางพากันวุนวายเพื่อหาทางออกอยางสันติใหกับวิกฤตครั้งลาสุดนี้"
 news.309.desc.b: "ชาว[HUN.GetAdjective]อางวาสโลวาเกียควรกลับมาเปนสวนหนึ่งของชาติพวกเขาอีกครั้ง ไมวาจะเปนสวนหนึ่งโดยสมบูรณหรือเปนเขตปกครองตนเอง มีการยื่นคําขาดในเรื่องนี้พรอมการขมขูใชกําลัง และรัฐบาลสโลวักกําลังวุนวายเพื่อหาทางออกทางการทูตใหกับวิกฤต[HUN.GetAdjective]ครั้งลาสุดนี้"
 news.309.a: "หวังวาคงไมตองใชกําลัง"
 news.309.b: "นี่ไมใชขอเรียกรองเล็ก ๆ..."
 news.309.c: "เราพรอมจะสละเอกราชหรือไม?"
 news.310.t: "[From.GetName] ยอมจํานนตอฮังการี"
 news.310.desc.a: "หลังการไตรตรองอยางถี่ถวน รัฐบาล[From.GetAdjective]ภายใต [From.GetLeader] ไดตัดสินใจยอมตามขอเรียกรองของ[HUN.GetAdjective] โดยยอมรับการควบคุมสโลวาเกียของ[HUN.GetAdjective] เลือกที่จะเอาใจ [HUN.GetLeader] เพื่อรักษาสันติภาพ ไมตองสงสัยเลยวาสิ่งนี้จะทําให[HUN.GetAdjective]แข็งกราวยิ่งขึ้นในการติดตอกับเพื่อนบานที่ออนแอลงในอนาคต"
 news.310.desc.b: "หลังการไตรตรองอยางถี่ถวน ชาวสโลวักไดตัดสินใจยอมตามขอเรียกรองของ[HUN.GetAdjective] เมื่อไมเห็นทางเลือกอื่น พวกเขาจึงสละเอกราชเพื่อรักษาชีวิตประชาชน ไมตองสงสัยเลยวาสิ่งนี้จะทําให[HUN.GetAdjective]แข็งกราวยิ่งขึ้นในการติดตอกับเพื่อนบานที่ออนแอลงในอนาคต"
 news.310.a: "ชาวสโลวักจะดีกวาถาเปนแบบนี้"
 news.310.b: "มันเปนการเสียสละที่จําเปน"
 news.311.t: "[From.From.GetName] ปฏิเสธขอเรียกรองของ[HUN.GetAdjective]"
 news.311.desc.a: "วิกฤตทางการทูตไดปะทุขึ้นระหวางเยอรมนีและฮังการีเกี่ยวกับชะตากรรมของสโลวาเกีย กอนหนานี้ [HUN.GetLeader] ไดประกาศวาสโลวาเกียเปนผลประโยชนหลักของ [HUN.GetNameDef] เนื่องจากความเชื่อมโยงทางประวัติศาสตรกับฮังการี รัฐบาลของเขาคาดหวังวาจะไดรับการปรึกษาในทุกมาตรการที่เกี่ยวของกับสโลวาเกีย \n\n[GER.GetLeader] ผูนําเยอรมนี ปฏิเสธที่จะยอมรับขอเรียกรองใด ๆ ดังกลาว โดยเรียกวาเปน "การแทรกแซงกิจการภายในของชาติอธิปไตยอยางโงเขลาและอันตราย"\n\nเมื่อความตึงเครียดพุงสูง ผูสังเกตการณจํานวนมากขึ้นเรื่อย ๆ ตางสงสัยวาฮังการีอาจหันไปใชความรุนแรงเพื่อสรางสถานการณที่เปนเรื่องจริงไปแลวหรือไม"
 news.311.desc.b: "ชาวสโลวักยึดมั่นในเอกราชอยางเหนียวแนน ปฏิเสธขอเรียกรองของ[HUN.GetAdjective] และกําลังเสริมปอมปราการตามชายแดน ฮังการีไมมีทาทีจะลดความตึงเครียด และทั้งสองชาติดูเหมือนกําลังมุงหนาสูสงคราม"
 news.311.b: "เรายืนหยัดเปนหนึ่งเดียว ใหพวกเขามาเลย!"
 news.312.t: "การตออายุพิธีสารโรม"
 news.312.desc.a: "ดวยการริเริ่มของ[HUN.GetAdjective] [ITA.GetNameDef] [AUS.GetNameDef] และ [HUN.GetNameDef] ไดตออายุพิธีสารโรมที่ลงนามครั้งแรกในป 1934 ขอตกลงนี้เกี่ยวกับการพัฒนาเศรษฐกิจและการกระชับความสัมพันธ แมโดยเนื้อแทจะเปนเพียงการประกาศมิตรภาพ แตก็มีสัญญาณวาอาจนําไปสูพันธมิตรอยางเปนทางการเพื่อถวงดุลแนวโนมการแกไขสนธิสัญญาและการขยายดินแดนที่เพิ่มขึ้นของ [GER.GetNameDef]"
 news.312.desc.b: "ดวยการริเริ่มของ[HUN.GetAdjective] [ITA.GetNameDef] และ [HUN.GetNameDef] ไดตออายุพิธีสารโรมที่ลงนามครั้งแรกในป 1934 ขอตกลงนี้เกี่ยวกับการพัฒนาเศรษฐกิจและการกระชับความสัมพันธ แมโดยเนื้อแทจะเปนเพียงการประกาศมิตรภาพ แตก็มีสัญญาณวาอาจนําไปสูพันธมิตรอยางเปนทางการเพื่อถวงดุลแนวโนมการแกไขสนธิสัญญาและการขยายดินแดนที่เพิ่มขึ้นของ [GER.GetNameDef]"
 news.312.a: "เรายินดีตอนรับมิตรใหมของเรา"
 news.312.b: "นี่ไมใชลางดีเลย..."
 news.312.c: "บางทีสิ่งดี ๆ อาจเกิดขึ้นจากเรื่องนี้"
 news.313.t: "กอตั้งกติกาสัญญาโรม"
 news.313.desc.a: "วันนี้ รัฐบาลอิตาลี ออสเตรีย และฮังการีไดออกแถลงการณรวมประกาศการกอตั้งกติกาสัญญาโรม ทั้งสามมหาอํานาจปฏิญาณวาจะชวยเหลือกันทางทหารทั้งในการปองกันและการรุก หากมีความจําเปน ดุลแหงอํานาจในภูมิภาคไดเปลี่ยนแปลงไปอยางมากชั่วขามคืน"
 news.313.desc.b: "วันนี้ รัฐบาลอิตาลีและฮังการีไดออกแถลงการณรวมประกาศการกอตั้งกติกาสัญญาโรม ทั้งสองมหาอํานาจปฏิญาณวาจะชวยเหลือกันทางทหารทั้งในการปองกันและการรุก หากมีความจําเปน ดุลแหงอํานาจในภูมิภาคไดเปลี่ยนแปลงไปอยางมากชั่วขามคืน"
 news.313.a: "เรายืนหยัดรวมกัน"
 news.313.b: "นี่เปนเรื่องที่นากังวล..."
 news.313.c: "เยอรมนีไมไดไรคูตอกรอีกตอไป"
 news.314.t: "ฮอรทีถูกลอบสังหาร"
 news.314.desc: "มีรายงานจากฮังการีวามิกโลช ฮอรที ถูกมือปนเพียงลําพังยิงในวันนี้หลังออกจากอาคารรัฐสภาในบูดาเปสต แมจะถูกนําสงโรงพยาบาลทันที แตแพทยแถลงวาเขาเสียชีวิตแลวตั้งแตกอนมาถึง มือปนซึ่งถูกตํารวจยิงขณะพยายามหลบหนีจากที่เกิดเหตุ ไดรับการระบุตัววาเปนสมาชิกพรรคคอมมิวนิสต\n\nการลอบสังหารครั้งนี้กอใหเกิดความโกลาหลในการเมืองภายในของ[HUN.GetAdjective] เนื่องจากแนวคิดตอตานคอมมิวนิสตของฮอรทีเปนปจจัยสําคัญที่สุดในการสกัดกั้นกลุมนักปฏิวัติ เมื่อไมมีพลเรือเอกชราผูนี้กุมบังเหียนการเมือง อิทธิพลของคอมมิวนิสตก็นาจะเพิ่มขึ้นอยางกาวกระโดด"
 news.314.a: "ชีวิตคนคนเดียวเปนเพียงราคาเล็กนอยที่ตองจาย"
 news.314.b: "ไมมีใครหยุดยั้งการปฏิวัติได!"
 news.314.c: "พวกคอมมิวนิสตจะตํ่าชาไปไดมากกวานี้อีกหรือ?"
 news.315.t: "ออสเตรียปฏิเสธการลงประชามติ"
 news.315.desc: "ออสเตรียปฏิเสธการเรียกรองของ[HUN.GetAdjective]ใหจัดการลงประชามติอยางสิ้นเชิง แมฮังการีจะแสดงทาทีกาวราวมากขึ้นเรื่อย ๆ ฮังการีกลาวหารัฐบาลออสเตรียวาเพิกเฉยตอสิทธิประชาธิปไตยของประชาชนอยางโจงแจง และประกาศวาจะไมลังเลที่จะใชกําลังเพื่อปกปองความปรารถนาของชาวออสเตรียที่ตองการรวมกับพี่นองชาว[HUN.GetAdjective] บัดนี้ทั้งสองฝายเริ่มระดมพลแลว และสงครามดูเหมือนจะหลีกเลี่ยงไมได"
 news.316.t: "พันธมิตรโปแลนด-โรมาเนีย"
 news.316.desc: "ชาวโปแลนดและชาวโรมาเนียไดประกาศคํามั่นครั้งใหมที่จะปกปองซึ่งกันและกัน แมทั้งสองชาติจะมีความสัมพันธอันดีมานานกวาทศวรรษแลว แตการประกาศในวันนี้บงชี้วานโยบายการปองกันรวมกําลังมีบทบาทเหนือการวางแผนทางทหารทั้งในโปแลนดและโรมาเนียมากขึ้นเรื่อย ๆ"
 news.316.a: "เราตางตองพึ่งพากัน"
 news.316.b: "พวกเขาคิดวามันจะชวยพวกเขาไดงั้นหรือ?"
 news.316.c: "หวังวามันจะคุมคา"
 news.317.t: "แนวกันชนสุขอนามัย"
 news.317.desc: "ดวยอางถึงอันตรายที่เพิ่มขึ้นจากอุดมการณทางตะวันออกและตะวันตก ชาวโรมาเนียไดประกาศกอตั้งแนวกันชนสุขอนามัย (Cordon Sanitaire) พันธมิตรนี้ยินดีตอนรับทุกชาติในยุโรปตะวันออกที่ถูกฟาสซิสตและคอมมิวนิสตบีบคั้น และขณะนี้ก็มีบางประเทศกําลังพิจารณารวมกําลังกับโรมาเนียแลว"
 news.317.a: "เราจะเปนผูนํา"
 news.317.b: "เรายืนเคียงขางโรมาเนีย"
 news.317.g: "นี่ทําใหแผนของเรายุงเหยิง..."
 news.317.e: "เปนความริเริ่มที่นายกยอง"
 news.317.f: "ทีนี้ใครกันแนที่เปนฝายกาวราว?"
 news.318.t: "บัลแกเรียยอมจํานนตอโรมาเนีย"
 news.318.desc: "เพื่อตอบสนองตอคําขาดของโรมาเนีย และเมื่อตองเผชิญกับปฏิบัติการทางทหารของโรมาเนียทันทีหากปฏิเสธ ชาวบัลแกเรียไดปรับเปลี่ยนรัฐบาลครั้งใหญใหเปนมิตรกับโรมาเนียมากขึ้น บัลแกเรียยอมรับขอเรียกรองทั้งหมดของเพื่อนบาน และคงไมปฏิเสธคําขอใด ๆ ในอนาคต ดวยเหตุนี้ บัดนี้บัลแกเรียจึงถือไดวาเปนเพียงรัฐหุนเชิดของโรมาเนีย"
 news.318.a: "พวกเขารูวาอะไรดีที่สุดสําหรับตัวเอง"
 news.318.b: "มาตรการที่จําเปน..."
 news.318.c: "พัฒนาการที่นากังวล"
 news.319.t: "บัลแกเรียปฏิเสธขอเรียกรองของโรมาเนีย"
 news.319.desc: "แมจะไดรับคําขาด และตองเผชิญกับปฏิบัติการทางทหารของโรมาเนียทันทีหากปฏิเสธ บัลแกเรียก็ยังปฏิเสธขอเรียกรองของโรมาเนีย ฝายโรมาเนียไมยอมถอย และทั้งสองประเทศดูเหมือนกําลังมุงหนาสูการปะทะทางทหารอยางชัดเจน"
 news.319.a: "พวกเขาจะไดรูวาคิดผิดแคไหน"
 news.319.b: "มาเอาไปสิ!"
 news.319.c: "สงครามบอลขานอีกครั้งงั้นหรือ...?"
 news.324.t: "ยูโกสลาเวียยอมจํานนตอโรมาเนีย"
 news.324.desc: "เมื่อเผชิญกับขอเรียกรองของโรมาเนียที่ตองการ 'ปรับโครงสรางอยางถึงราก' ของรัฐ และการขมขูใชกําลังทหารหากปฏิเสธ ยูโกสลาเวียก็ไมเห็นทางเลือกอื่นนอกจากยอมจํานน อยางไรก็ตาม 'การปรับโครงสราง' ที่ประกาศออกมานั้นไมเพียงแตแบงแยกยูโกสลาเวียออกเปนรัฐองคประกอบตาง ๆ แตยังรวมถึงการแตงตั้งรัฐบาลหุนเชิดอีกดวย\n\nเห็นไดชัดวาผลประโยชนของโรมาเนียเปนหลักไดรับการตอบสนองภายใตขออางเรื่องสิทธิในการกําหนดชะตากรรมของตนเอง และอิทธิพลของโรมาเนียในภูมิภาคก็ยังคงเติบโตตอไป"
 news.324.a: "ชางเปนหมากที่แยบยล!"
 news.324.b: "ชางเจาเลหนัก"
 news.320.t: "ยูโกสลาเวียปฏิเสธขอเรียกรองของโรมาเนีย"
 news.320.desc: "แมจะเผชิญกับขอเรียกรองของโรมาเนียที่ตองการ 'ปรับโครงสรางอยางถึงราก' ของรัฐ และการขมขูใชกําลังทหารหากปฏิเสธ ยูโกสลาเวียก็ยังปฏิเสธคําขาด แมจะถูกกดดันอยางหนักจากหลายทิศทาง ชาวยูโกสลาฟก็ตั้งมั่นที่จะปกปองชาติของตนอยางสุดกําลัง บัดนี้โรมาเนียประกาศสงครามแลว และไมใชเรื่องเกินคาดหากชาติอื่นจะเขามารวมแบงแยกดินแดนดวย"
 news.320.a: "พวกเขาหาเรื่องเอง"
 news.320.b: "มาเอาไปสิ!"
 news.320.c: "เราเตือนพวกเขาแลว"
 news.320.f: "พวกเขาคงตานไดไมนาน"
 news.321.t: "ยูโกสลาเวียถูกแบงแยก"
 news.321.desc: "ดวยการริเริ่มของโรมาเนีย ยูโกสลาเวียไดรับคําขาดเรียกรองให 'ปรับโครงสรางรัฐ' เมื่อถูกกดดันจากเพื่อนบานหลายประเทศพรอมกัน ชาวยูโกสลาฟจึงไมเห็นทางเลือกอื่นนอกจากยอมรับ และขณะนี้การแบงแยกประเทศกําลังดําเนินอยู"
 news.321.a: "เราตองขอบคุณมิตรของเรา"
 news.321.b: "นี่เปนความคิดที่ยอดเยี่ยม!"
 news.321.c: "ไอพวกละโมบ"
 news.321.e: "เรารูดีวามันเปนอยางไร..."
 news.322.t: "รัฐประหารในโรมาเนีย"
 news.322.desc: "เมื่อความไมพอใจตอผูนําประเทศพุงสูงถึงระดับอันตรายในโรมาเนีย เจาชายมีไฮไดกอรัฐประหารดวยความชวยเหลือจากกองทัพสวนใหญ รายงานเบื้องตนระบุวาการรัฐประหารสําเร็จ และกษัตริยมีไฮไดประกาศแลววาพระองคทรงรับตําแหนงประมุขแหงรัฐ โดยมุงหมายจะมอบความเปนผูนําที่โรมาเนียตองการ"
 news.322.a: "เปนการเปลี่ยนแปลงที่ดีขึ้น"
 news.322.b: "อยางนอยพระองคก็ดู... ถอมตนกวา"
 news.323.t: "กษัตริยคาโรลที่ 2 สละราชสมบัติ"
 news.323.desc: "ภายใตแรงกดดันจากกลุมผูมีอํานาจในรัฐบาล กษัตริยคาโรลที่ 2 แหงโรมาเนียไมเห็นทางเลือกอื่นนอกจากประกาศและลงนามสละราชสมบัติ ผูสืบราชสมบัติคือกษัตริยมีไฮ แตอํานาจเผด็จการจํานวนมากที่คาโรลเคยไดรับถูกคืนกลับไปยังรัฐบาล กษัตริยหนุมจึงไมนาจะใชอํานาจไดมากเทากษัตริยองคกอน\n\nหลังการสละราชสมบัติ ดูเหมือนคาโรลจะถอนเงินจากบัญชีธนาคารมหาศาลของพระองคจนหมด และลี้ภัยไปพํานักในยานหรูแหงหนึ่งของเม็กซิโกซิตีกับมักดา ลูเปสคู พระสนม"
 news.323.a: "ไปเสียไดก็ดี"
 news.323.b: "นาขันดี"
 news.325.t: "ยูโกสลาเวียอางสิทธิ์เหนือบัลแกเรีย"
 news.325.desc: "ดวยอางถึงรากฐานของชาติในฐานะ 'สหภาพของชาวสลาฟใต' วาทกรรมของยูโกสลาเวียในระยะหลังจึงโตแยงมากขึ้นเรื่อย ๆ วาชาวบัลแกเรียควรเปนสมาชิกของสหภาพนี้ บัดนี้โฆษณาชวนเชื่อดังกลาวไดพลิกผันอยางรุนแรง เมื่อยูโกสลาเวียประกาศอางสิทธิ์เหนือดินแดนบัลแกเรียอยางเปดเผย ขณะที่ทั้งสองชาติเตรียมกําลังพล สงครามอาจปะทุขึ้นไดทุกเมื่อ"
 news.325.a: "ยูโกสลาเวียเพื่อชาวสลาฟทั้งมวล!"
 news.325.b: "เราพรอมรับมือพวกเขาแลว!"
 news.325.c: "ถังดินปนไมเคยทําใหผิดหวัง"
 news.326.t: "บาโนวีนาแหงโครเอเชีย"
 news.326.desc: "ผลจากปญหากับกลุมชาตินิยมโครเอเชียที่ดําเนินตอเนื่องและทวีความรุนแรงขึ้น รัฐบาลยูโกสลาเวียจําเปนตองมอบอํานาจปกครองตนเองใหแกชาวโครแอตมากขึ้น รัฐกึ่งอิสระแหงใหม คือบาโนวีนาแหงโครเอเชีย ไดถือกําเนิดขึ้น แมในนามจะยังเปนดินแดนในปกครองของยูโกสลาเวีย แตอิทธิพลของรัฐบาลในภูมิภาคนี้ก็ลดลงอยางมาก"
 news.326.a: "มันเปนสิ่งจําเปน"
 news.326.b: "โครเอเชียจงเจริญ!"
 news.326.c: "จุดเริ่มตนของการลมสลายของยูโกสลาเวียหรือ?"
 news.327.t: "ยูโกสลาเวียอางสิทธิ์เหนือมาซิโดเนีย"
 news.327.desc: "ดวยเปาหมายที่จะรวมชาวมาซิโดเนียเปนหนึ่งเดียว ยูโกสลาเวียประกาศวาบัดนี้ถือวามาซิโดเนียกลางเปนสวนหนึ่งของชาติยูโกสลาเวีย เพื่อหนุนการอางสิทธิ์ดังกลาว กองพลตาง ๆ ไดถูกสงไปประจําการพรอมรบที่ชายแดน และภัยแหงความขัดแยงทางทหารครั้งใหมก็กําลังปกคลุมภูมิภาค"
 news.327.a: "ชาวสลาฟใตทั้งมวลคือหนึ่งเดียว!"
 news.327.b: "เชิญลองดูไดเลย!"
 news.327.c: "พัฒนาการที่นากังวล"
 news.328.t: "ยูโกสลาเวียอางสิทธิ์เหนือพรมแดนอิตาลี"
 news.328.desc: "ระยะหลังรัฐบาลยูโกสลาเวียออกมาวิจารณการปฏิบัติของอิตาลีตอชนกลุมนอยชาวสลาฟในเขตชายแดนอิสเตรียและซาราบอยขึ้นเรื่อย ๆ วันนี้รัฐบาลประกาศวาถือวาดินแดนเหลานี้ ซึ่งอิตาลียึดไปหลังมหาสงครามและมีประชากรเชื้อสายสลาฟเปนสวนใหญ เปนสวนหนึ่งของชาติยูโกสลาเวีย ยิ่งไปกวานั้น เพื่อปกปองสิทธิของผูอยูอาศัยในดินแดนเหลานี้ ชาวยูโกสลาฟไดแสดงทาทีวาจะไมลังเลที่จะใชกําลังทหาร"
 news.328.a: "มีเพียงในชาติของเราเทานั้นที่พวกเขาจะปลอดภัย"
 news.328.b: "ถาพวกเขากลาลอง เราจะบดขยี้ใหแหลก!"
 news.328.c: "ความขัดแยงครั้งใหมกําลังกอตัว"
 news.329.t: "ยูโกสลาเวียรับรอง [SOV.GetNameDef]"
 news.329.desc: "ยูโกสลาเวียซึ่งแนวแนยิ่งกวาชาติอื่น ๆ ไดปฏิเสธที่จะรับรองรัฐคอมมิวนิสตอยาง [SOV.GetNameDef] มาหลายป ดวยการประกาศในวันนี้วารัฐบาลยูโกสลาเวียจะสถาปนาความสัมพันธอยางเปนทางการกับโซเวียต นโยบายดังกลาวจึงสิ้นสุดลงในที่สุด การนี้จะหมายถึงการเปดรัฐยูโกสลาเวียรับอิทธิพลคอมมิวนิสตหรือไมยังตองรอดูกันตอไป แตนํ้าเสียงของการประกาศนั้นเปนมิตรอยางนาประหลาดใจ"
 news.329.a: "พวกเขามีแนวคิดที่นาสนใจอยูบาง"
 news.329.b: "เราจะนําพวกเขาสูการปฏิวัติ"
 news.329.c: "อิทธิพลโซเวียตกําลังแผขยาย..."
 news.330.t: "สภาแรงงานแพน-สลาฟ"
 news.330.desc: "ดวยความเห็นตางในแงมุมพื้นฐานของคอมมิวนิสตแบบโซเวียต ชาวยูโกสลาฟจึงเลือกแนวทางของตนเองตออุดมการณนี้ แทนที่จะเปนสมาชิกขององคการคอมมิวนิสตสากล รัฐบาลยูโกสลาเวียประกาศวาจะนําชาวสลาฟใตในการตอสูเพื่อสิทธิของชนชั้นแรงงาน มีแนวโนมวาในไมชาพวกเขาจะพยายามดึงเพื่อนบานเขามารวม ซึ่งอาจทําใหดุลแหงอํานาจในภูมิภาคปนปวนอยางรายแรง"
 news.330.a: "เราจะนําพี่นองชาวสลาฟของเรา!"
 news.330.b: "ไอพวกเด็กเมื่อวานซืนอวดดี!"
 news.330.c: "นาสนใจ..."
 news.330.e: "บางทีนี่อาจนํามาซึ่งเสถียรภาพ?"
 excellent: "ยอดเยี่ยม"
 unfortunate: "นาเสียดาย"
 traitors: "พวกทรยศ!"
 stability.21.t: "การหลบเลี่ยงการเกณฑทหาร"
 stability.21.desc.a: "รายงานฉบับใหมของกระทรวงกลาโหมแสดงใหเห็นวากําลังพลที่มีอยูลดลงอยางเห็นไดชัด ดูเหมือนวาทหารเกณฑชุดลาสุดจะมีจํานวนนอยกวาที่คาดไวมาก ขณะนี้กําลังมีการสอบสวนความคลาดเคลื่อนดังกลาว แตเบาะแสแรกชี้วามีคนจํานวนมากที่รางกายพรอมรับราชการทหาร แตหาทางหลบเลี่ยงการเกณฑทหารไดดวยวิธีตาง ๆ นักศึกษาอายุ 18 ปกลายเปนแรงงานฝมือในอุตสาหกรรมสงครามที่สําคัญขึ้นมาทันที อดีตนักกีฬาสอบไมผานการทดสอบสมรรถภาพ และในบางกรณี ทหารเกณฑก็หายตัวไปอยางไรรองรอย\n\nเมื่อถูกจับและสอบสวน พวกเขาชี้ไปที่สภาพความเปนอยูอันยํ่าแยในกองทัพ นายทหารที่ไมใสใจ และการไมอยากตายเพื่อสิ่งที่ไมมีหวัง ผูนําทางทหารเรียกรองใหปราบปรามผูหลบเลี่ยงการเกณฑทหารอยางเด็ดขาด แตหลายคนในรัฐบาลเชื่อวาการปรับปรุงความเปนอยูของพลทหารอาจเปนแนวทางที่ดีกวา"
 stability.21.desc.b: "การตอบสนองที่ไรประสิทธิภาพของทางการตอการหลบเลี่ยงการเกณฑทหารที่แพรหลาย มีแตทําใหปญหาเลวรายลง ทหารเกณฑจํานวนมากขึ้นเรื่อย ๆ ไมมารายงานตัวหลังไดรับหมายเรียก หนวยตอตานขาวกรองไดสกัดจับแผนพับที่จัดทําอยางมืออาชีพซึ่งแนะนําวิธีหลบเลี่ยงการเกณฑทหาร เชน การติดสินบนแพทยใหรับรองวาผูถูกเกณฑไมสมบูรณทางรางกาย ขอยกเวนสําหรับผูเปนพอทําใหแมมายสงครามที่มีลูกถูกรุมขอแตงงาน ขณะที่จํานวนผูยื่นขอยกเวนดวยเหตุผลทางศีลธรรมก็พุงสูงเปนประวัติการณ\n\nผูนําทางทหารเสนอใหยกเลิกขอยกเวนที่เหลืออยูไมกี่ขอ และลงโทษผูหนีหนาที่ที่ถูกจับไดบางคนเปนเยี่ยงอยาง สวนคนอื่นในรัฐบาลเสนอวาเราควรปลุกสํานึกในหนาที่พลเมืองของประชาชน และชี้ใหเห็นถึงผลที่จะตามมาหากเราแพสงครามครั้งนี้"
 stability.21.desc.c: "เมื่อมาตรการของรัฐบาลตอการหลบเลี่ยงการเกณฑทหารไมไดผลเลยแมแตนอย ผูคนจํานวนมากขึ้นเรื่อย ๆ จึงเริ่มสงสัยวาทําไมพวกเขาตองเสี่ยงชีวิตขณะที่คนอื่นอยูอยางปลอดภัย ทหารเกณฑที่มารายงานตัวมักเลาวาถูกรังควานหรือถูกเยาะเยยตามทองถนนวาเปนคนโงที่สูเพื่อสิ่งที่ไรอนาคต มีรายงานเรื่องแมที่หามลูกไปรายงานตัวตามหมายเกณฑอยูทั่วทุกหนแหง และกระทรวงกลาโหมไดยื่นรายงานวาพวกเขาไมแนใจอีกตอไปแลววาควรเกณฑคนจํานวนเทาใด เพราะระบบราชการของพวกเขาเริ่มพังทลายภายใตภาระการดําเนินเรื่องทหารที่หายตัวไปทั้งหมด"
 stability.21.a: "เราทําอะไรกับเรื่องนี้ไมได"
 stability.21.d: "จับกุมทุกคนที่พบวาหลบเลี่ยงการเกณฑทหาร!"
 stability.21.e: "บางทีอาจถึงเวลาขึ้นเงินเดือนใหพลทหาร"
 stability.21.f: "ถึงเวลาใชมาตรการที่เขมงวดขึ้น"
 stability.21.g: "ปลุกสํานึกในหนาที่พลเมืองของประชาชน"
 stability.21.h: "เราตองลงโทษใหเปนเยี่ยงอยาง"
 stability.21.i: "เราตองใหประชาชนมีสิ่งที่ควรคาแกการตอสู"
 stability.22.t: "การนัดหยุดงาน!"
 stability.22.desc.a: "การผลิตในโรงงานหลายแหงชะลอตัวลงอยางมากในชวงไมกี่วันที่ผานมา เมื่อคนงานประกาศนัดหยุดงานในการผลิตเพื่อสงครามทั้งหมด พวกเขาเรียกรอง "สันติภาพและขนมปง!" และจนถึงตอนนี้ก็ปฏิเสธความพยายามเจรจาทุกครั้ง บางคนในรัฐบาลสนับสนุนใหใชกําลังทหารตอบโตอยางเด็ดขาด ตามดวยการประหารแกนนําอยางรวดเร็วในฐานะสายลับของศัตรูและผูทรยศ อยางไรก็ตาม ขาราชการพลเรือนบางคนแนะนําใหใชแนวทางที่รอบคอบกวา โดยชี้วาการตอบโตดวยความรุนแรงอาจยอนกลับมาทํารายเราได หากทหารที่เกี่ยวของไมไดจงรักภักดีอยางที่เราคิด"
 stability.22.desc.b: "ความพยายามของรัฐบาลที่จะโนมนาวใหผูนัดหยุดงานกลับไปทํางานดูเหมือนจะไมไดผลเลย ตรงกันขาม มีรายงานการนัดหยุดงานในโรงงานเพิ่มขึ้นอีก และคนงานกลุมสุดทายที่ยังยืนหยัดทํางานในสถานที่ที่ไดรับผลกระทบแตแรกก็วางเครื่องมือหลังเผชิญความโกรธแคนของเพื่อนรวมงาน แมยุทโธปกรณที่สะสมไวจะชวยบรรเทาผลกระทบตอการสงเสบียงแนวหนาไดบาง แตก็เปนเพียงเรื่องของเวลากอนที่การหยุดชะงักของการผลิตจะเริ่มสงผลตอความสามารถในการทําสงครามของเรา\n\nกระทรวงกลาโหมเรงเรารัฐบาลอีกครั้งใหใชแนวทางแข็งกราวกับผูนัดหยุดงาน แตกลุมอื่นในฝายบริหารเสนอวาการยื่นขอเสนอพบกันครึ่งทางกับคนงานอาจเพียงพอที่จะโนมนาวใหพวกเขากลับไปทํางาน"
 stability.22.desc.c: "สิ่งที่เริ่มจากการประทวงของแรงงานในไมกี่แหง บัดนี้ไดลุกลามไปทั่วประเทศ สงผลกระทบแมแตอุตสาหกรรมที่เกี่ยวของกับความพยายามในสงครามเพียงทางออม แมแตการทํางานของรัฐบาลเองก็ไดรับผลกระทบ เมื่อเสมียนชั้นผูนอย ผูสงสาร และคนขับรถจํานวนมากขึ้นเรื่อย ๆ ปฏิเสธที่จะมาทํางาน \n\nในหลายพื้นที่ สภาคนงานไดเขายึดอาคารโรงงาน รายงานจากตํารวจลับระบุวาบางแหงดูเหมือนจะเริ่มผลิตอาวุธอีกครั้ง เพื่อการลุกฮือครั้งใหญตอตานสิ่งที่ถูกเรียกวา "ระบอบสงคราม"\n\nกองบัญชาการทหารสูงสุดเชื่อวาการปฏิบัติการอยางเด็ดขาดโดยกองทหารที่จงรักภักดียังคงพลิกสถานการณได ขณะที่ฝายพลเรือนในรัฐบาลแยงวานี่เสี่ยงตอสงครามกลางเมืองและความพายแพอยางแนนอน"
 stability.22.a: "เดี๋ยวเรื่องนี้ก็ซาไปเอง"
 stability.22.b: "แสดงแสนยานุภาพทางทหารในเมืองตาง ๆ"
 stability.22.c: "ยกยองผูที่ยังเต็มใจทํางานใหเปนวีรบุรุษในการโฆษณาชวนเชื่อ"
 stability.22.d: "เกณฑคนงานเขารับราชการทหารและใหโรงงานอยูใตการควบคุมของทหาร"
 stability.22.e: "เสนอเพิ่มปนสวนอาหารใหคนงาน"
 stability.22.f: "สงทหารเขาไป จับกุมผูนัดหยุดงาน ประหารแกนนํา"
 stability.22.g: "เสนอกฎหมายสวัสดิการฉบับใหม"
 stability.23.t: "การกบฏในกองทัพ"
 stability.23.desc.a: "ขาวนาตกใจมาถึงกองบัญชาการทหารสูงสุด วาหนวยจํานวนหนึ่งในกองทัพของเราปฏิเสธคําสั่งจากผูบังคับบัญชา แมจะยังไมมีหนวยใดละทิ้งที่มั่นในแนวรบ แตตัวแทนของทหารไดแสดงชัดเจนวาพวกเขาจะไมปฏิบัติตามคําสั่งใด ๆ ใหโจมตีขาศึก\n\nจนถึงตอนนี้การกบฏยังจํากัดอยูในกองพันจํานวนไมมาก และหนวยฝกและหนวยสนับสนุนอีกไมกี่หนวย แตหลายคนในกระทรวงกลาโหมเกรงวาการลุกฮือนี้จะลุกลามไปยังหนวยอื่นในไมชา และในที่สุดอาจทําใหเราไมสามารถทําสงครามตอไปได จําเปนตองดําเนินการอยางเด็ดขาด"
 stability.23.desc.b: "ความพยายามแกไขการกบฏในกองทัพไมไดผลแตอยางใด ดวยความฮึกเหิมจากการที่รัฐบาลไมสามารถตอบสนองไดอยางมีประสิทธิภาพ ผูกอการกบฏไดขยายรายการขอเรียกรองใหรวมถึงการหยุดยิงทันที ตามดวยสนธิสัญญาสันติภาพที่ครอบคลุมและการปลดประจําการ\n\nกระทรวงกลาโหมแนะนําอยางยิ่งใหเราสงสัญญาณที่หนักแนนไปยังผูกอการกบฏเพื่อยับยั้งการเคลื่อนไหวใด ๆ เพิ่มเติม"
 stability.23.desc.c: "เมื่อเห็นไดชัดวารัฐบาลไมเต็มใจหรือไมสามารถแกไขปญหาของพวกเขาได ผูกอการกบฏจึงตัดสินใจลงมือเอง มีการประกาศเลือกตั้ง "สภาคนงานและทหาร" โดยมีเปาหมายชัดเจนที่จะยึดครองประเทศและทําสันติภาพกับขาศึก\n\nหากไมรีบดําเนินการ สภาเหลานี้อาจเขามาแทนที่รัฐบาลของเราในบางพื้นที่ของประเทศ และทําใหเราไมสามารถทําสงครามตอไปได"
 stability.23.a: "ตอนนี้เราทําอะไรกับเรื่องนั้นไมไดแลว"
 stability.23.b: "ลอมหนวยที่กอกบฏดวยทหารที่จงรักภักดีและสั่งใหวางอาวุธ"
 stability.23.c: "กลาวสุนทรพจนปลุกใจรักชาติตอหนาผูกอการกบฏ"
 stability.23.d: "ประกาศตอสาธารณะวาผูใดที่พบวาสนับสนุนผูกอการกบฏจะถูกตั้งขอหากบฏตอแผนดิน"
 stability.23.e: "ประกาศขอริเริ่มสันติภาพ โดยใหแนใจวาศัตรูไมมีทางยอมรับได"
 stability.23.f: "ระดมกองกําลังอาสาฝายภักดีและจับกุมทหารทุกนายที่ไมอยูประจําหนาที่"
 stability.23.g: "เสนอใหทหารเลือกนายทหารผูบังคับบัญชาของตนเอง"
 15_days_tt: "การดําเนินการนี้จะใชเวลาประมาณ §Y15 วัน§!\n"
 30_days_tt: "การดําเนินการนี้จะใชเวลาประมาณ §Y30 วัน§!\n"
 45_days_tt: "การดําเนินการนี้จะใชเวลาประมาณ §Y45 วัน§!\n"
 stability.31.t: "การปราบปรามทางทหารประสบความสําเร็จ"
 stability.31.desc: "การตอบสนองอยางรวดเร็วของเราพิสูจนแลววาไดผลอยางยิ่ง หนวยสารวัตรทหารซึ่งไดรับการสนับสนุนจากเจาหนาที่บังคับใชกฎหมายทองถิ่นและอาสาสมัครผูรักชาติ ไดกระจายกําลังออกไปในปฏิบัติการที่ประสานงานกันอยางดีเพื่อตามตัวผูถูกเกณฑที่หายไปทุกคน สวนใหญยินดีรับหนาที่เมื่อไดรับแจงถึงผลที่ตามมาหากไมมารายงานตัว กองบัญชาการทหารสูงสุดประกาศตอสาธารณะวาผูที่มารายงานตัว ณ หนวยประจําการจะไมถูกตั้งขอหาหรือลงโทษใด ๆ สําหรับการไมมารายงานตัวในอดีต ถึงกระนั้น ก็ยังมีคนจํานวนหนึ่งที่ปฏิเสธเด็ดขาดที่จะจับอาวุธเพื่อประเทศ และไดถูกจับกุมตัว"
 stability.31.a: "การลงมืออยางเด็ดขาดชวยปองกันสิ่งที่เลวรายกวา"
 stability.32.t: "การจลาจลตอตานการเกณฑทหาร"
 stability.32.desc: "ความพยายามของเราที่จะแกไขสถานการณดวยกําลังทหารไมประสบความสําเร็จ ดูเหมือนวามีบางคนในฝายบริหารของเราไดปลอยขาวแผนปฏิบัติการใหสาธารณชนรู และประชาชนก็ตอบสนองอยางรวดเร็ว เมื่อสารวัตรทหารและหนวยงานบังคับใชกฎหมายอื่น ๆ พยายามจับกุมผูหลบเลี่ยงการเกณฑทหารที่รูตัวแลว พวกเขาก็พบวาทางถูกขวางโดยฝูงชนที่โกรธแคน ซึ่งเรียกรองใหยุติสงครามและการเกณฑทหารแบบบังคับ ในหลายกรณีเกิดการตอสูบนทองถนนระหวางตํารวจกับผูประทวง ทําใหมีผูเสียชีวิตจํานวนหนึ่งเมื่อทหารจําตองใชอาวุธเพื่อปองกันตัว ตองใชเวลาหลายชั่วโมงกวาตํารวจจะควบคุมสถานการณไดทั้งหมด\n\nบรรยากาศอันเลวรายปกคลุมเมืองหลวง ขณะที่เครื่องกีดขวางถูกเคลียรออกและผูเสียชีวิตถูกฝง รายงานจากกระทรวงกลาโหมไมพบการเปลี่ยนแปลงในจํานวนทหารเกณฑที่มารายงานตัว หลายคนในรัฐบาลสงสัยวาเราจะสูตอไปไดอีกนานเทาใดภายใตสถานการณเชนนี้"
 stability.32.a: "สถานการณไมไดพัฒนาไปในทางที่เปนประโยชนตอเราเสียทีเดียว"
 stability.33.t: "กบฏตอตานการเกณฑทหาร"
 stability.33.desc: "ความพยายามของเราที่จะแกไขสถานการณดวยกําลังทหารไมประสบความสําเร็จ ดูเหมือนวามีบางคนในฝายบริหารของเราไดปลอยขาวแผนปฏิบัติการใหสาธารณชนรู และประชาชนก็ตอบสนองอยางรวดเร็ว เมื่อสารวัตรทหารและหนวยงานบังคับใชกฎหมายอื่น ๆ พยายามจับกุมผูหลบเลี่ยงการเกณฑทหารที่รูตัวแลว พวกเขาก็พบวาทางถูกขวางโดยฝูงชนที่โกรธแคน ซึ่งเรียกรองใหยุติสงครามและการเกณฑทหารแบบบังคับ ในหลายกรณีเกิดการตอสูบนทองถนนระหวางตํารวจกับผูประทวง ทําใหมีผูเสียชีวิตจํานวนหนึ่งเมื่อทหารจําตองใชอาวุธเพื่อปองกันตัว \n\nหลังจากนั้นสถานการณก็บานปลายจนควบคุมไมไดอยางรวดเร็ว เมื่อประชาชนกรูเขาใสทหารและบุกสถานีตํารวจเพื่อหาอาวุธ บัดนี้หลายเมืองในประเทศอยูในภาวะลุกฮือดวยอาวุธตอตานรัฐบาล ที่นาขันคือ ฝายกบฏดูเหมือนจะไมมีปญหาเลยในการหาทหารที่เต็มใจจับอาวุธ"
 stability.33.a: "อาว ทีนี้อยากสูขึ้นมาแลวหรือ!?"
 stability.34.t: "การปฏิรูปการเกณฑทหารไดผล"
 stability.34.desc: "มาตรการทางสังคมที่รัฐบาลผานออกมาเปนสวนหนึ่งของกระบวนการปฏิรูปนโยบายการเกณฑทหารครั้งใหญ ไดรับความนิยมอยางนาประหลาดใจ คาตอบแทนที่สูงขึ้นและวันลาที่บอยขึ้นมักถูกยกใหเปนสิทธิประโยชนใหมที่สําคัญที่สุด แตหลายคนก็ชี้ถึงโครงการใหมของรัฐบาลที่ชวยเหลือแมมายและเด็กกําพราจากสงครามดวย ผูชายที่หาขออางปฏิเสธการเรียกของชาติมาเปนทหารไดมีนอยลงเรื่อย ๆ และการสนับสนุนจากสาธารณชนตอผูหลบเลี่ยงการเกณฑทหารก็แทบหมดไป\n\nอันที่จริง ในระยะหลังการสนับสนุนรัฐบาลจากสาธารณชนไดเพิ่มขึ้น เมื่อผูคนจํานวนมากขึ้นเรื่อย ๆ ตระหนักวาวิถีชีวิตแบบ[Root.GetAdjective]กําลังถูกโจมตี"
 stability.34.a: "การตัดสินใจที่ชาญฉลาด"
 stability.35.t: "กองพันทัณฑที่ 591"
 stability.35.desc: "เมื่อเห็นความรายแรงของสถานการณ กองบัญชาการทหารสูงสุดจึงตัดสินใจวาจําเปนตองใชมาตรการที่รุนแรงขึ้น เพื่อแสดงใหเห็นวาการหลบเลี่ยงหนาที่พลเมืองในการปกปองประเทศจะไมไดรับการยอมรับ ในยามรุงสาง สารวัตรทหารไดบุกเขาตรวจคนบานของบุคคลที่มีชื่อเสียงและเสนสายจํานวนหนึ่งซึ่งถูกคัดเลือกมาอยางรอบคอบ ผูใชอิทธิพลชวยใหคนอื่นหลบเลี่ยงการเกณฑทหาร ทั้งที่ยังอยูในชุดนอน พวกเขาก็ถูกเกณฑเขากองทัพและถูกคุมตัวไปยังคายทหารภายใตการคุมกันดวยอาวุธ ที่นั่นพวกเขาจะถูกจัดตั้งเปนหนวยแยกตางหาก เพื่อปองกันไมใหอิทธิพลบอนทําลายของพวกเขาแพรไปยังหนวยอื่น \n\nขาวนี้แพรสะพัดอยางรวดเร็ว และดูเหมือนวาผูคนสวนใหญที่เคยเชื่อวาจะเพิกเฉยตอหมายเกณฑไดโดยไมมีผลอะไร ตางก็เปลี่ยนใจ สถานีรับสมัครทั่วประเทศรายงานวามีคนจํานวนมากขึ้นเรื่อย ๆ มาสอบถามวา หาก "เพื่อน" ของพวกเขาที่เคยพยายามหลบเลี่ยงการเกณฑทหารมามอบตัว จะตองรับผลอยางไรบาง"
 stability.35.a: "พวกเขาอาจยังไถโทษตนเองได"
 stability.36.t: "ชนชั้นนําทองถิ่นออกมาประทวง"
 stability.36.desc: "เมื่อเห็นความรายแรงของสถานการณ กองบัญชาการทหารสูงสุดจึงตัดสินใจวาจําเปนตองใชมาตรการที่รุนแรงขึ้น เพื่อแสดงใหเห็นวาการหลบเลี่ยงหนาที่พลเมืองในการปกปองประเทศจะไมไดรับการยอมรับ ในยามรุงสาง สารวัตรทหารไดบุกเขาตรวจคนบานของบุคคลที่มีชื่อเสียงและเสนสายจํานวนหนึ่งซึ่งถูกคัดเลือกมาอยางรอบคอบ ผูใชอิทธิพลชวยใหคนอื่นหลบเลี่ยงการเกณฑทหาร ทั้งที่ยังอยูในชุดนอน พวกเขาก็ถูกเกณฑเขากองทัพ ครอบครัวของพวกเขาไดระดมเครือขายผูสนับสนุนอันกวางขวางเพื่อประทวงการตัดสินใจนี้ กระทรวงกลาโหมถูกโทรศัพทและจดหมายถาโถมเขามา ตั้งแตคนงานธรรมดาที่อยากไดผูจัดการโรงงานของตนคืน ไปจนถึงปลัดกระทรวงในกระทรวงอื่น ๆ ที่ตองการรูวาเหตุใดผูที่ทํางานในดานที่สําคัญตอความพยายามในสงครามจึงถูกดึงตัวออกจากงาน ดูเหมือนวาแมแตรัฐมนตรีบางคนก็เริ่มลังเลเรื่องสงคราม บางทีอาจเพราะกลัวความปลอดภัยของลูกชายตนเอง"
 stability.36.a: "พวกเขาไมมีสํานึกในหนาที่เลยหรือ?"
 stability.37.t: ""หนาที่อันหมนเศราและศักดิ์สิทธิ์""
 stability.37.desc: ""แนนอนวาผมอยากมีชีวิตอยู ผมอยากกลับไปเรียนใหจบ อยากพบปะสาว ๆ อยากสรางครอบครัว แตถาเราแพสงครามครั้งนี้ ผมก็จะไมไดทําสิ่งเหลานั้นเหมือนกัน ผมจึงสู"\n\nจดหมายฉบับนี้ซึ่งสงโดยไมระบุชื่อไปยังหนังสือพิมพรายใหญทุกฉบับในประเทศ ไดสรางกระแสอยางมหาศาล ผูเขียนอางวาเปนทหารที่ตอนแรกพยายามหลบเลี่ยงการเกณฑทหาร แตภายหลังตระหนักวาตนตองสูเพื่อรักษาประเทศ จดหมายนี้ดูเหมือนจะกระทบใจคนอื่น ๆ อีกมากที่รูสึกเชนเดียวกัน คณะกรรมการเกณฑทหารทั่วประเทศรายงานวา จํานวนผูที่ยังปฏิเสธหมายเรียกนั้นไดรับการทดแทนอยางเกินพอโดยอาสาสมัครหนาใหม ที่ไมยอมรอจนถูกเรียกอีกตอไป ขณะที่คนอื่นกําลังออกไปสูเพื่อรักษาประเทศและวิถีชีวิตของพวกเขา"
 stability.37.a: "เราจะไมปลอยใหชีวิตของพวกเขาสูญเปลา"
 stability.38.t: "จุดจบของคนขลาด"
 stability.38.desc: ""พวกเขาพาเขาไปยืนพิงกําแพงในยามรุงสาง เขาปฏิเสธบุหรี่มวนสุดทาย แตยอมใหปดตา คําพูดสุดทายของเขาคือคําขอโทษตอแมที่ทําใหเธอตองเจ็บปวดมากมาย หนวยยิงเปาเล็งไดแมนยํา ไมกี่นาทีตอมา แพทยที่อยู ณ ที่นั้นก็ประกาศวาเขาเสียชีวิตแลว"\n\nแมจะไมสามารถจับตัวผูหลบเลี่ยงการเกณฑทหารไดทั้งหมด แตเจาหนาที่ก็จับกุมไดจํานวนหนึ่ง ดวยสถานการณอันคับขันที่เราเผชิญอยู กระทรวงกลาโหมจึงตัดสินใจใหชายเหลานี้ถูกพิจารณาคดีตามกฎหมายทหารฐานไมมารายงานตัวเขาประจําการ คําพิพากษาประหารชีวิตชุดแรกไดถูกตัดสินแลว และนักโทษถูกประหารโดยการยิงเปา เห็นไดชัดวามาตรการเหลานี้ไดผลตามที่ตองการ ดูเหมือนวาคนสวนใหญตัดสินใจเลือกความเปนไปไดที่จะตายในสนามรบ มากกวาความตายอันไรเกียรติในฐานะคนขลาดที่แนนอน"
 stability.38.a: "นาเสียดายที่เรื่องตองมาถึงขั้นนี้"
 stability.39.t: "ผูพลีชีพเพื่อสันติภาพ"
 stability.39.desc: ""พวกเขาพาเขาไปยืนพิงกําแพงในยามรุงสาง เขาปฏิเสธบุหรี่มวนสุดทาย แตยอมใหปดตา คําพูดสุดทายของเขาคือคําขอโทษตอแมที่ทําใหเธอตองเจ็บปวดมากมาย หนวยยิงเปาเล็งไดแมนยํา ไมกี่นาทีตอมา แพทยที่อยู ณ ที่นั้นก็ประกาศวาเขาเสียชีวิตแลว"\n\nรายงานที่ตีพิมพเรื่องการประหารชีวิตชายผูถูกตัดสินประหารฐานไมมารายงานตัวเขาประจําการ ดูเหมือนจะใหผลตรงกันขาม แทนที่จะทําใหผูคนกลับมารับราชการทหารเพราะกลัวผลที่ตามมา กลับทําใหผูถูกประหารกลายเปนผูพลีชีพของขบวนการสันติภาพในทันที ชื่อและเรื่องราวชีวิตของพวกเขาถูกตีพิมพ และเห็นไดชัดวาถูกตัดตอใหดูดีที่สุดเทาที่จะทําได การชุมนุมเรียกรองสันติภาพครั้งใหญเริ่มขึ้นในหลายเมืองใหญ เรียกรองใหยุติสงคราม กระทรวงกลาโหมรายงานวาไดรับจดหมายจากผูถูกเกณฑจํานวนหนึ่งที่ระบุอยางเปดเผยวาจะไมมารายงานตัว โดยบอกวาจะไมยอมมีสวนรวมในการประหารชีวิตอีกครั้งไมวากรณีใด ๆ เวนแตจะเปนในฐานะผูถูกประหารเอง"
 stability.39.a: "สถานการณไมไดดีขึ้นเสียทีเดียว"
 stability.40.t: "ขอตกลงใหมเพื่อ [Root.GetNameDef]"
 stability.40.desc: "ในสุนทรพจนที่ถายทอดทางวิทยุวันนี้ [Root.GetLeader] ไดประกาศสิ่งที่เขาเรียกวา "การปฏิวัติสังคม" ตลอดหนึ่งชั่วโมงตอมา เขาไดอธิบายระบบการปฏิรูปที่ครอบคลุมทุกดานของชีวิตสังคม โดยสัญญาวาทหารทุกนายที่กลับมาจะไดรับการศึกษา งานที่ไดคาตอบแทนดี และเงินบํานาญอยางเอื้อเฟอ เขายังประกาศโครงการกอสรางที่อยูอาศัยราคายอมเยาสําหรับครอบครัวหนุมสาวครั้งใหญ ซึ่งจะเริ่มในวันที่ลงนามสงบศึก สิ่งนี้ดูเหมือนจะสงผลอยางมากตอขวัญกําลังใจโดยรวม สํานักงานรับสมัครทั่วประเทศรายงานวามีทหารเกณฑมาสอบถามทางเลือกในการขยายเวลารับราชการเกินกวาความขัดแยงในปจจุบัน ขณะที่บางคนถึงขั้นเรียกรองใหสงตัวไปประจําหนวยแนวหนาเพื่อใหไดสิทธิประโยชนเพิ่มเติม"
 stability.40.a: "แลวเราจะจายคาทั้งหมดนี้อยางไร...?"
 strikes_event.1.t: "ฟนฟูความสงบเรียบรอย"
 strikes_event.1.desc: "กองบัญชาการทหารสูงสุดเคลื่อนไหวอยางรวดเร็ว ระดมหนวยฝกจํานวนหนึ่งเขาประจําการ และจัดตั้งกลุมเฉพาะกิจจากทหารที่ลาพัก การเดินแถวหนวยเหลานี้ผานประตูโรงงานไดผลตามที่ตองการ เพราะผูนัดหยุดงานสวนใหญไมอยากเผชิญหนาที่อาจนําไปสูความสูญเสียชีวิต ผูนัดหยุดงานไมกี่คนที่พยายามชักชวนทหารใหรวมอุดมการณก็พบวาคําพูดของตนแทบไมมีผล เมื่อทหารถามกลับวาทําไมคนงานที่อยูสบายในแนวหลังถึงควรไดรับอนุญาตใหทอดทิ้งทหารที่สูรบอยูแนวหนา"
 strikes_event.1.a: "นั่นสิ ทําไมกัน"
 strikes_event.2.t: "วันจันทรนองเลือด"
 strikes_event.2.desc: "กองบัญชาการทหารสูงสุดเคลื่อนไหวอยางรวดเร็ว ระดมหนวยฝกจํานวนหนึ่งเขาประจําการ และจัดตั้งกลุมเฉพาะกิจจากทหารที่ลาพัก อยางไรก็ตาม การเคลื่อนหนวยเหลานี้ไปยังเมืองที่ไดรับผลกระทบนั้นยากกวาที่คาดไวมาก เพราะผูนัดหยุดงานปดกั้นทางรถไฟและบีบใหทหารตองเดินเทาเขาไป ทําใหพวกเขามีเวลาเตรียมตัวอยางเต็มที่ เมื่อทหารของเราไปถึงโรงงานที่ถูกตั้งเครื่องกีดขวาง ก็พบวาผูนัดหยุดงานพรอมรับมือแลว ความพยายามเคลียรถนนถูกตอบโตดวยการโจมตีอยางดุเดือดจากคนงานที่ขวางกอนหินและขวดใสทหาร \n\nในหลายครั้ง ทหารเปดฉากยิงเพื่อปองกันตัว ทําใหผูนัดหยุดงานเสียชีวิตจํานวนหนึ่งและบาดเจ็บอีกนับสิบ สิ่งนี้ยิ่งทําใหฝูงชนโกรธแคนมากขึ้น เสียงตะโกน "ฆาตกร!" จากผูคนที่มุงดูดังกองไปทั่ว บรรยากาศในเมืองหลวงเปลี่ยนไปเขาขางผูนัดหยุดงานอยางมาก เมื่อตกคํ่า ทหารก็ถอนกําลังออกไป ปลอยใหเครื่องกีดขวางยังคงอยู\n\nไมมีความพยายามใชกําลังบีบสถานการณอีก ผูนัดหยุดงานยังคงควบคุมโรงงาน และไมมีการทํางานใด ๆ เลย"
 strikes_event.2.a: "ไมเปนไปตามแผน"
 strikes_event.3.t: "วีรบุรุษแหงแนวหนาการผลิต"
 strikes_event.3.desc: ""สงครามอุตสาหกรรมเปนมากกวาการเดินทัพของกองพลและการทิ้งระเบิดของเครื่องบิน เปนมากกวาหนาที่ของทหารที่จะสูและตายเพื่อประเทศ สงครามอุตสาหกรรมจะชนะไดกอนอื่นเลยในโรงงานและโรงหลอ การละทิ้งการตอสูในสายการผลิตไมไดดีไปกวาการละทิ้งแนวหนา และชัยชนะในสายการผลิตก็ควรไดรับการเฉลิมฉลองไมตางจากชัยชนะในแนวหนา"\n\nทรัพยากรโฆษณาชวนเชื่อทั้งหมดที่มีไดถูกเบนมาเพื่อนําเสนอผลงานของคนงานผลิตอาวุธใหดูดีที่สุด [Root.GetLeader] ไดอนุมัติรางวัลใหมดวยตนเองสําหรับคนงานที่ทํางานเกินโควตามากกวา 100% และผูไดรับรางวัลกลุมแรกไดถูกสงตระเวนไปทั่วประเทศเพื่อสอนวิธีการทํางานใหคนงานคนอื่น\n\nดูเหมือนวาสิ่งนี้ทําใหผูนัดหยุดงานจํานวนมากทบทวนจุดยืนของตน การทํางานไดกลับมาดําเนินตอในทุกโรงงานที่ไดรับผลกระทบกอนหนานี้"
 strikes_event.3.a: "วีรบุรุษกันทุกคน"
 strikes_event.4.t: "กรมการผลิตเพื่อสงคราม"
 strikes_event.4.desc: "วันนี้ [Root.GetLeader] ไดประกาศการเปลี่ยนแปลงเล็กนอยเกี่ยวกับการเกณฑทหาร แมกอนหนานี้แรงงานฝมือจะไดรับการยกเวนจากการเกณฑทหาร แตบัดนี้ขอยกเวนดังกลาวถูกยกเลิก และชายทุกคนที่เคยไดรับการยกเวนจะถูกเกณฑทันที ในขณะเดียวกัน กระทรวงกลาโหมไดรับอํานาจใหเขาควบคุมโรงงานใดก็ตามที่ผลิตสินคาที่เกี่ยวของกับความพยายามในสงครามโดยตรง หากผูบริหารโรงงานนั้นแสดงใหเห็นถึงความไรความสามารถ\n\nการประกาศนี้ไดรับการตอบรับดวยความจํายอมอยางเงียบงันในเมืองที่ไดรับผลกระทบ โดยเฉพาะเมื่อมีการประกาศวาผูใดที่ขัดขืนจะถูกปฏิบัติเชนเดียวกับทหารที่ไมยอมทําตามคําสั่ง แมขวัญกําลังใจของคนงานในโรงงานจะตกตํ่าถึงขีดสุด แตการผลิตก็กลับมาดําเนินตอแลว"
 strikes_event.4.a: "นาจะทําแบบนี้ตั้งแตแรก"
 strikes_event.5.t: "ประเทศที่ลุกขึ้นขัดขืน"
 strikes_event.5.desc: "วันนี้ [Root.GetLeader] ไดประกาศการเปลี่ยนแปลงเล็กนอยเกี่ยวกับการเกณฑทหาร แมกอนหนานี้แรงงานฝมือจะไดรับการยกเวนจากการเกณฑทหาร แตบัดนี้ขอยกเวนดังกลาวถูกยกเลิก และชายทุกคนที่เคยไดรับการยกเวนจะถูกเกณฑทันที ในขณะเดียวกัน กระทรวงกลาโหมไดรับอํานาจใหเขาควบคุมโรงงานใดก็ตามที่ผลิตสินคาที่เกี่ยวของกับความพยายามในสงครามโดยตรง หากผูบริหารโรงงานนั้นแสดงใหเห็นถึงความไรความสามารถ\n\nการประกาศนี้ถูกตอบรับดวยเสียงหัวเราะลั่นในเมืองที่ไดรับผลกระทบ โดยเฉพาะเมื่อมีการประกาศวาผูใดที่ขัดขืนจะถูกปฏิบัติเชนเดียวกับทหารที่ไมยอมทําตามคําสั่ง ตํารวจที่ถูกสงไปมอบหมายเกณฑใหคนงานถูกบอกใหกลับมาพรอมกับอะไรที่มากกวาหมึกบนกระดาษ"
 strikes_event.5.a: "บางทีเราก็ควรทําแบบนั้น"
 strikes_event.6.t: "ผูกินที่มีประโยชน"
 strikes_event.6.desc: "โดยไมเอยถึงการนัดหยุดงานที่เกิดขึ้น วันนี้ [Root.GetLeader] ประกาศวาคนงานในอุตสาหกรรมที่เกี่ยวของกับสงครามจะไดรับปนสวนนํ้าตาล กาแฟ และเนื้อสัตวเพิ่มเติมเพื่อรักษากําลังวังชา นาเสียดายที่ขาวลือวารัฐบาลยินดีแจกช็อกโกแลตเพิ่มนั้นกลายเปนเรื่องไมจริง\n\nขณะที่แกนนําการนัดหยุดงานพยายามรั้งไมใหคนงานกลับไปทํางาน คนสวนใหญดูเหมือนจะยอมรับแลววา "สันติภาพและขนมปง" ไมมีวันเกิดขึ้นจริง และพอใจกับแคขนมปง"
 strikes_event.6.a: "พวกเขาควรทํางานใหคุมคาขาว"
 strikes_event.7.t: "ปฏิบัติการแบล็กโอก"
 strikes_event.7.desc: "กองทหารรวมพลอยูนอกเมืองตลอดคืน โดยรักษาวินัยเรื่องเสียงและแสงเพื่อคงความไดเปรียบจากการจูโจมโดยไมทันตั้งตัว ขณะที่ดวงอาทิตยเริ่มโผลพนขอบฟา และคนงานที่เฝาเครื่องกีดขวางที่โรงงานกําลังรอกะกลางวันมาผลัดเปลี่ยน กองกําลังจูโจมก็เคลื่อนเขามา คนงานที่เหนื่อยลาจัดการตอตานไดเชื่องชาและถูกปราบไดอยางรวดเร็ว ทหารทิ้งหนวยเล็ก ๆ ไวเฝานักโทษ แลวกวาดลางทั่วเมือง จับกุมทุกคนที่อยูในรายชื่อคนงานโรงงาน พอถึงเที่ยงวัน ฝายทหารก็ควบคุมเมืองไดทั้งหมดและประกาศเคอรฟว ไมคาดวาจะมีการตอตานอีก คนงานสวนใหญจะไดรับการปลอยตัวในไมชาโดยมีเงื่อนไขวาตองกลับไปทํางาน สวนแกนนําจะถูกคุมขังและนําขึ้นศาล คาดวาจะมีการตัดสินประหารชีวิต"
 strikes_event.7.a: "ความสงบเรียบรอยกลับคืนมาแลว"
 strikes_event.8.t: "ยุทธการถนนโอก"
 strikes_event.8.desc: "กองทหารรวมพลอยูนอกเมืองตลอดคืน แตวินัยเรื่องแสงและเสียงที่ยํ่าแยทําใหการจูโจมโดยไมทันตั้งตัวลมเหลว เมื่อทหารเคลื่อนเขาไป ก็พบวาคนงานตื่นตัวและพรอมรับมือแลว การบุกครั้งแรกลมเหลวทามกลางหากอนหินที่ถูกขวางใส การบุกครั้งที่สองดวยดาบปลายปนถูกตีโตกลับในการตอสูประชิดตัวอันโหดราย ทิ้งผูเสียชีวิตและผูใกลตายนับสิบไวบนทองถนน\n\nนายทหารผูบังคับบัญชาไดถอนกําลังกลับเพื่อรวบรวมกําลังพล ขณะที่คนงานกําลังขยายแนวปอมปราการและติดอาวุธใหตนเองดวยอาวุธที่ถูกทิ้งไวระหวางการถอย คาดวาการสูรบวันที่สองจะเกิดขึ้นพรุงนี้ แตกองบัญชาการทหารสูงสุดไมเชื่ออีกตอไปแลววาจะไดรับชัยชนะ"
 strikes_event.8.a: "ทางเลือกของเรากําลังหมดลงอยางรวดเร็ว"
 strikes_event.9.t: "พระราชบัญญัติคุมครองสิทธิแรงงาน"
 strikes_event.9.desc: "ดวยความตึงเครียดที่พุงสูงทั่วเมืองหลวง [Root.GetLeader] ไดประกาศกฎหมายใหมเพื่อคุมครองสิทธิของแรงงานแมในยามสงคราม กฎหมายฉบับครอบคลุมนี้กําหนดใหมีวันลาปวยโดยไดรับคาจางอยางไมจํากัด ประกันอุบัติเหตุภาคบังคับสําหรับแรงงานทุกคน สิทธิในการเขารวมสหภาพแรงงานใดก็ได รวมถึงเปนครั้งแรกที่สตรีทุกคนที่มีงานทํามีสิทธิลาคลอดหลังคลอดบุตร\n\nแมหลายคนในรัฐบาลจะมองวานี่ไมตางอะไรกับการยอมแพตอผูนัดหยุดงานโดยสิ้นเชิง แตผลลัพธก็ชัดเจน: การทํางานกลับมาดําเนินตอในทุกโรงงานแลว"
 strikes_event.9.a: "หวังวาแคนี้จะเพียงพอ"
 mutiny_event.1.t: "ปราบการกบฏไดสําเร็จ"
 mutiny_event.1.desc: "หลังการเจรจาอันตึงเครียดไมกี่ชั่วโมงที่ประตูคายทหารและในหลุมหลบภัยแนวหนา การกบฏในกองทัพของเราก็สิ้นสุดลง เมื่อเผชิญกับโอกาสที่จะตองสูในการตอสูที่ไมมีทางชนะ ผูกอการกบฏจึงรีบตัดสินใจยอมวางอาวุธ \n\nประเด็นหลักจึงกลายเปนชะตากรรมของผูที่ปฏิเสธคําสั่ง กองบัญชาการทหารสูงสุดเลือกที่จะผอนปรนและรับรองกับผูกอการกบฏวาจะไมถูกลงโทษอยางรุนแรง มีการลงโทษเปนเยี่ยงอยางเพียงไมกี่กรณี โดยทหารบางนายถูกลดยศและยายไปอยูหนวยอื่น"
 mutiny_event.1.a: "หวังวานี่จะเปนครั้งสุดทาย"
 mutiny_event.2.t: "การขูลม ๆ แลง ๆ"
 mutiny_event.2.desc: "ความพยายามขูใหผูกอการกบฏยอมจํานนกลับยอนมาทํารายเราอยางยอยยับ เพราะทหารแทบไมเกรงกลัวหนวยที่ถูกสงไปปราบเลย ดวยทักษะที่ฝกฝนมาจากแนวหนา พวกเขาจัดการปองกันที่มั่นไดอยางรวดเร็ว ทําใหความพยายามใด ๆ ที่จะเอาชนะพวกเขาตองแลกดวยราคาที่แพงมาก \n\nนายทหารผูบังคับบัญชาหนวยฝายภักดีไดถอนกําลังกลับและกําลังรอคําสั่งตอไป แตความสําเร็จเล็ก ๆ นี้ยอมทําใหผูกอการกบฏมุงมั่นยิ่งขึ้นอยางไมตองสงสัย"
 mutiny_event.2.a: "ไมมีใครคาดการณเรื่องนี้ได"
 mutiny_event.3.t: ""แลวเราสูไปเพื่ออะไรกันแน?""
 mutiny_event.3.desc: ""ไมใชเรื่องแปลกที่ทหารจะสงสัยวาสิ่งที่ตนทําอยูนั้นคุมคาจริงหรือไม มีสิ่งใดที่จะอางความชอบธรรมใหกับการเสียสละที่เราขอจากพวกคุณไดหรือ? เราจะขอใหพวกคุณยอมตายเพื่อเปาหมายที่พวกคุณอาจไมมีวันไดเห็นไดจริงหรือ?\n\nเปนความจริงอันนาเศราที่เราตองมีชีวิตอยูในยุคสมัยที่เราเกิดมา โชคชะตาไดกําหนดใหเราตองทําสงคราม เพื่อปกปองเสรีภาพของเรา บานของเรา และวิถีชีวิตแบบ[Root.GetAdjective]ของเรา! เราไมไดเลือกสงครามนี้ มันถูกยัดเยียดใหเรา! พวกคุณรูดีวาผมจะไมขอสิ่งใดจากพวกคุณที่ผมเองไมเต็มใจจะทํา และผมรูวาพวกคุณจะทําทุกอยางที่จําเปนเพื่อใหไดมาซึ่งชัยชนะ"\n\nสุนทรพจนของ [Root.GetLeader] ตอหนาทหารดูเหมือนจะไดผลตามที่ตองการ เมื่อทหารตางโหรองขึ้นมาเองและกลับไปปฏิบัติหนาที่โดยไมบนมากไปกวาปกติ"
 mutiny_event.3.a: "สุนทรพจนที่ดี"
 mutiny_event.4.t: "พระราชบัญญัติวาดวยการกบฏในยามสงคราม"
 mutiny_event.4.desc: "แมกระทรวงกลาโหมจะพยายามอยางเต็มที่ไมใหการกบฏในกองทัพครั้งนี้เปนที่รับรูในวงกวาง แตการตรวจเซ็นเซอรจดหมายก็ทําไดเพียงเทานั้น ทหารที่ลาพักไดแพรขาวอยางรวดเร็ววากองทัพไมเต็มใจจะหลั่งเลือดโดยไมจําเปนในสงครามนี้อีกตอไป\n\nโดยไมเอยถึงการกบฏโดยตรง วันนี้ [Root.GetLeader] ประกาศวานับจากนี้รัฐบาลจะถือวาการกระทําใด ๆ ที่สะทอนถึงการขาดความทุมเทตอสงครามเปนการกบฏตอแผนดิน\n\nโทษของการกบฏตอแผนดินเปนที่รูกันดี และการสนับสนุนผูกอการกบฏจากสาธารณชนก็แทบมลายหายไป ขาวนี้แนนอนวาแพรกระจายไปอยางกวางขวาง เมื่อแทบไมไดรับการสนับสนุนจากประชาชนทั่วไป ทหารก็กลับไปปฏิบัติหนาที่อยางเงียบ ๆ"
 mutiny_event.4.a: "เราไมควรตองอธิบายเรื่องนี้ใหชัดขนาดนี้เลย"
 mutiny_event.5.t: "ความพยายามปราบปรามลมเหลว"
 mutiny_event.5.desc: "แมกระทรวงกลาโหมจะพยายามอยางเต็มที่ไมใหการกบฏในกองทัพครั้งนี้เปนที่รับรูในวงกวาง แตการตรวจเซ็นเซอรจดหมายก็ทําไดเพียงเทานั้น ทหารที่ลาพักไดแพรขาวอยางรวดเร็ววากองทัพไมเต็มใจจะหลั่งเลือดโดยไมจําเปนในสงครามนี้อีกตอไป\n\nความพยายามของรัฐบาลที่จะหยุดกระแสนี้ลมเหลวโดยสิ้นเชิง รายงานจากตํารวจลับระบุวาผูกอการกบฏไดรับการหนุนหลังอยางแข็งแกรงจากสาธารณชน ทําใหเราไมนาจะแยกตัวและปราบปรามพวกเขาได"
 mutiny_event.5.a: "การไมเคารพกฎหมายเชนนี้นากังวลอยางยิ่ง"
 mutiny_event.6.t: "ขอเสนอสันติภาพของ[Root.GetAdjective]"
 mutiny_event.6.desc: "วันนี้ [Root.GetLeader] แถลงตอสื่อมวลชนวาขอเสนอสันติภาพลาสุดของเขาลมเหลว แมสาเหตุของความพลิกผันอันนาเสียดายนี้จะซับซอนมาก แตขอเรียกรองของ[Root.GetAdjective]ที่ใหอีกฝายชดใชความเสียหายทั้งหมด ปลดอาวุธโดยสิ้นเชิง และยอมรับตอสาธารณะวาเปนผูเริ่มสงคราม อาจเปนฟางเสนสุดทาย\n\nศัตรูของเราตอบโตในทํานองเดียวกัน โดยเรียกขอเรียกรองอันสมเหตุสมผลของเราวาเปนการเรียกรองใหยอมแพอยางไมมีเงื่อนไข พวกเขาสัญญาวาจะทําสงครามนี้ตอไปจนถึงที่สุด \n\nเมื่อศัตรูของเราไมยอมรับเหตุผลอยางเห็นไดชัดและสัญญาวาจะสูตอ ความพยายามของผูกอการกบฏที่จะบีบใหเกิดขอตกลงสันติภาพก็ลมสลายลง"
 mutiny_event.6.a: "นาเสียดายยิ่งนัก"
 mutiny_event.7.t: "การปราบปรามทางทหารประสบความสําเร็จ"
 mutiny_event.7.desc: "แมจะมีบางกรณีที่ผูกอการกบฏกลุมเล็ก ๆ ตัดสินใจสู แตปฏิบัติการปราบกบฏของเราก็ประสบความสําเร็จอยางงดงาม กองกําลังอาสาฝายภักดีอาศัยจํานวนมากกวาทักษะ ลอมที่มั่นของผูกอการกบฏและเรียกรองใหยอมจํานน ทหารสวนใหญตัดสินใจไมจับอาวุธตอสูกับเพื่อนรวมชาติและยอมจํานนโดยสงบ \n\nแกนนําจะถูกพิจารณาคดีในศาลทหารแบบลับ แตทหารทั่วไปจะถูกสงกลับไปแนวหนา แมจะยายไปอยูหนวยอื่นเพื่อปองกันไมใหผูกอการกบฏกอตั้งเครือขายใหม"
 mutiny_event.7.a: "ทําไดดี"
 mutiny_event.8.t: "พี่นองฆากันเอง"
 mutiny_event.8.desc: "ความพยายามของเราที่จะขัดขวางการเลือกตั้งสภาคนงานและทหาร ไดทําใหสถานการณบานปลายเกินกวาการคาดการณที่มองโลกในแงรายที่สุดเสียอีก แทนที่จะยอมจํานน ผูกอการกบฏไดจัดตั้งสภาชั่วคราว เลือกผูบัญชาการสนาม และตั้งแนวปองกันบนทองถนน เห็นไดชัดวาพวกเขาตั้งใจจะสู\n\nรอยราวในกองทัพบัดนี้แผไปทั่วทุกหนวย และบอยครั้งถึงขั้นแบงแยกคนในครอบครัวเดียวกัน [Root.GetNameDefCap] กําลังยืนอยูบนขอบเหวแหงสงครามกลางเมือง"
 mutiny_event.8.a: "เรื่องนี้มีแตจะเลวรายลงเรื่อย ๆ"
 mutiny_event.9.t: "นายทหารพันธุใหม"
 mutiny_event.9.desc: "แมฝายทหารจะคัดคานอยางหนัก แตทุกหนวยในกองทัพ[Root.GetAdjective]ไดจัดการเลือกตั้งเพื่อเลือกผูบังคับบัญชาของตน ผลที่ออกมานาประหลาดใจมาก เพราะผูไดรับเลือกสวนใหญเปนทหารที่มีผลงานโดดเดนและมีประสบการณภาคสนามมากมาย แมนายทหารอาชีพหลายคนยังถือวานี่เปนการดูหมิ่นสวนตัว แตก็แทบไมตองสงสัยเลยวาทหารสวนใหญชอบสถานการณเชนนี้มากกวาอยางเห็นไดชัด"
 mutiny_event.9.a: "มันไมนาจะไดผล ใชไหม?"
 if_they_accept: "หากพวกเขาตอบรับ:\n"
 if_they_reject: "หากพวกเขาปฏิเสธ:\n"
 canada_vanilla.1.title: "รอนนี สาวปนเบรน"
 canada_vanilla.1.desc: "สตรีชาวแคนาดาราวหนึ่งลานคนเขาสูตลาดแรงงานในชวงสงครามโลกครั้งที่สอง พวกเธอมีตัวแทนในสื่อระดับชาติเปนสัญลักษณแหงความทรหดและความรักชาติ นั่นคือเวโรนิกา ฟอสเตอร หรือที่รูจักกันในชื่อรอนนี สาวปนเบรน เธอทํางานใหบริษัทจอหน อิงกลิส แอนด คอมพานี ที่โรงงานผลิตปนในโทรอนโต ขณะที่พี่ชายนองชายทั้งสามของเธอไปรบในตางแดน โปสเตอรและภาพยนตรสั้นที่มีเธอและสตรีอยางเธอรวมสนับสนุนความพยายามในสงคราม นาจะเปนแรงบันดาลใจใหกับการรณรงคทางสื่อที่โดงดังกวาอยาง 'โรซี่ชางยํ้าหมุด' หลังจากที่สหรัฐอเมริกาเขารวมสงคราม"
 canada_vanilla.1.opt: "'งานในโรงงานไมไดยากไปกวางานบาน' ดังที่ภาพยนตรขาววาไว"
 usa.30.t: "การเลือกตั้งสภาคองเกรส"
 usa.30.desc: "ทุก ๆ สองป หนึ่งในสามของที่นั่งวุฒิสภาและที่นั่งทั้งหมดในสภาผูแทนราษฎรจะตองมีการเลือกตั้ง แมมักจะถูกบดบังดวยเหตุการณโลก แตสถานการณทองถิ่นในแตละเขตเลือกตั้งก็สามารถสรางความแตกตางไดในบางครั้ง \n\nหลังนับคะแนนทั้งหมดแลว ฝายที่สนับสนุนรัฐบาล[USA.GetSenateElectionOutcome]ในวุฒิสภา และ[USA.GetHouseElectionOutcome]ในสภาผูแทนราษฎร"
 usa.30.a: "ประชาชนไดตัดสินแลว"
 SenateElectionLost: "เสีย [?sen_loc] ที่นั่ง"
 SenateElectionGained: "ไดเพิ่ม [?sen_loc] ที่นั่ง"
 HouseElectionLost: "เสีย [?ror_loc] ที่นั่ง"
 HouseElectionGained: "ไดเพิ่ม [?ror_loc] ที่นั่ง"
 usa.31.t: "การเปลี่ยนแปลงภูมิทัศนทางการเมือง"
 usa.31.desc: "เมื่อประธานาธิบดีคนใหมเขารับตําแหนง อดีตฝายคานในสภาคองเกรสสวนใหญก็หันมาสนับสนุนรัฐบาลชุดใหม ประธานาธิบดี [USA.GetLeader] สามารถพึ่งพาการสนับสนุนจากสมาชิกวุฒิสภา [?senators_support] คน และสมาชิกสภาผูแทนราษฎร [?representatives_support] คน"
 usa.31.a: "ประชาชนไดตัดสินแลว"
 usa_congress_elections_tt_bad: "ในการเลือกตั้งสภาคองเกรส ฝายที่สนับสนุนรัฐบาลจะตองเผชิญกับฝายคานที่แข็งแกรงขึ้น\n"
 usa_congress_elections_tt_good: "แรงสงจากการเลือกตั้งประธานาธิบดีนาจะสงตอไปยังการเลือกตั้งสภาคองเกรสดวย\n"
 usa.32.t: "ฝายรัฐบาลครองเสียงขางมากในสภาคองเกรส"
 usa.32.desc: "ดูเหมือนวาการปฏิรูประบบการเลือกตั้งที่เราดําเนินการไวจะประสบความสําเร็จอยางยิ่ง เพราะผูสนับสนุนของเราจํานวนมากไดรับเลือกเขาสูสภาคองเกรสในการเลือกตั้งครั้งลาสุด ดวยเสียงขางมากอันมั่นคง เราไมนาจะมีปญหาในการผลักดันวาระทางการเมืองของเรา"
 usa.32.a: "สัญญาณชัดเจนถึงการสนับสนุนที่เรามีในหมูประชาชน"
 usa.40.t: "วุฒิสมาชิกลงคะแนนสนับสนุนขอเสนอของรัฐบาล"
 usa.40.desc: "ในการลงคะแนนครั้งลาสุด วุฒิสมาชิกคนหนึ่งไดเปลี่ยนขางอยางนาประหลาดใจมาลงคะแนนสนับสนุนขอเสนอของรัฐบาล แมประเด็นนั้นจะคอนขางเล็กนอย แตการลงคะแนนสนับสนุนตอสาธารณะจากผูที่เคยวิพากษวิจารณ [USA.GetLeader] อยางเปดเผยมากอน ก็ทําใหหลายคนในวอชิงตันตองเลิกคิ้วดวยความประหลาดใจ\n\nนักวิเคราะหบางคนเชื่อวาตัวอยางนี้จะทําใหวุฒิสมาชิกคนอื่น ๆ ทบทวนจุดยืนของตน"
 usa.40.a: "พันธมิตรที่มีประโยชน"
 usa.41.t: "ผูแทนราษฎรกลาวสนับสนุนรัฐบาลอยางแข็งขัน"
 usa.41.desc: "เมื่อถูกถามถึงจุดยืนตอประเด็นนโยบายหลายเรื่องในงานเลี้ยงระดมทุน ผูแทนราษฎรหญิงคนหนึ่งไดกลาวสนับสนุนนโยบายของประธานาธิบดี [USA.GetLeader] เธอยังอางวาเพื่อนสมาชิกสภาผูแทนราษฎรหลายคนมีความเห็นคลายกัน แตถูกรั้งไวเพียงเพราะ "ความสายตาสั้นอยางโงเขลา ที่คิดไมไกลไปกวาการเลือกตั้งครั้งหนา" แทนที่จะทําสิ่งที่ถูกตองเพื่อชาวอเมริกัน \n\nความเห็นของเธอไดรับการรายงานอยางกวางขวางในสื่อ และทําใหเพื่อนรวมงานหลายคนตกที่นั่งลําบาก เพราะตองออกมาชี้แจงจุดยืนของตนในประเด็นเหลานี้"
 usa.41.a: "เธอพูดถูกนะ"
 usa.42.t: "วุฒิสมาชิกออกมาคัดคานนโยบายรัฐบาล"
 usa.42.desc: "วุฒิสมาชิกคนหนึ่งใหสัมภาษณกับหนังสือพิมพรายใหญวาเขาไมอาจสนับสนุนนโยบายที่ "โงเขลาและอันตราย" ของประธานาธิบดี [USA.GetLeader] ไดอีกตอไป เขายังอางวารูจักวุฒิสมาชิกอีกหลายคนที่คิดเชนเดียวกันและจะทอดทิ้งประธานาธิบดีในเร็ววัน"
 usa.42.a: "อีกไมนานเขาก็จะวิ่งกลับมาเอง"
 usa.43.t: "ผูแทนราษฎรวิจารณประธานาธิบดี"
 usa.43.desc: "ระหวางการอภิปรายเรื่องการปฏิรูปภาษีครั้งลาสุด ผูแทนราษฎรคนหนึ่งไดกลาวสุนทรพจนยืดยาวถึงความลมเหลวมากมายของรัฐบาล ตามความเห็นของเขา ไมมีชาวอเมริกันผูมีวิจารณญาณคนใดจะตองการสนับสนุนนโยบายของประธานาธิบดี ไมวาจะสังกัดพรรคใดก็ตาม \n\nถอยคําอันรุนแรงของเขาดูเหมือนจะไดผล เมื่อผูแทนราษฎรจํานวนหนึ่งที่เคยคิดกันวาสนับสนุนนโยบายของ [USA.GetLeader] อยางมั่นคง เริ่มสงเสียงเห็นดวย"
 usa.43.a: "นาอับอาย"
 usa.44.t: "ฝายคานพายแพในวุฒิสภา"
 usa.44.desc: "ญัตติตําหนิประธานาธิบดี [USA.GetLeader] ถูกตีตกในวุฒิสภา แมแตผูสนับสนุนญัตติที่แข็งขันที่สุดก็แทบไมหวังวาจะผาน แตจํานวนเสียงคัดคานก็สรางความตกตะลึงแมแตผูสังเกตการณที่มองโลกในแงรายที่สุด ดูเหมือนวาประธานาธิบดีไดรับการสนับสนุนในวุฒิสภามากกวาที่คนสวนใหญเชื่อ ซึ่งนาจะชวยผลักดันวาระทางนิติบัญญัติของเขาได"
 usa.44.a: "ยอดเยี่ยม"
 usa.45.t: "คณะกรรมาธิการสภาผูแทนฯ สนับสนุนนโยบายประธานาธิบดี"
 usa.45.desc: "การไตสวนรอบลาสุดของคณะกรรมาธิการวิธีการงบประมาณแหงสภาผูแทนราษฎร ไดออกรายงานที่ยกความดีใหนโยบายของประธานาธิบดีวาทําใหตัวชี้วัดทางเศรษฐกิจทุกดานดีขึ้นอยางมาก แมรายงานจะไมถึงขั้นยกยองอยางเปดเผย แตก็เปนการตบหนาผูที่เคยวิพากษวิจารณประธานาธิบดีและเรียกรองการปฏิรูป\n\nผูแทนราษฎรจํานวนหนึ่งไดประกาศตอสาธารณะแลววา แมยังมีขอสงสัยตอวาระของประธานาธิบดีอยู แตจากนี้พวกเขาจะลงคะแนนสนับสนุน"
 usa.45.a: "ก็สมควรแลว"
 usa.46.t: "วุฒิสมาชิกเกษียณ"
 usa.46.desc: "หลังจากหัวใจวายเล็กนอย วุฒิสมาชิกอาวุโสคนหนึ่งประกาศในวันนี้วาจะเกษียณดวยเหตุผลดานสุขภาพ ดวยประสบการณกวาสองทศวรรษในสภาคองเกรส วุฒิสมาชิกผูนี้ไดสรางเครือขายผูสนับสนุนขนาดใหญและมีอิทธิพลอยางมาก แมในทางเทคนิคเขาเปนเพียงคนคนเดียวที่มีหนึ่งเสียง แตคนวงในวอชิงตันก็นับวาเขามีคาเทากับหลายเสียง เพราะเขาเปนกุญแจในการดึงเสียงอื่นมาอีกหลายเสียง \n\nเมื่อที่นั่งนี้นาจะตกเปนของผูวิจารณประธานาธิบดี [USA.GetLeader] อยางเปดเผย รัฐบาลก็จะพบวาการรวบรวมเสียงที่จําเปนเพื่อผานรางกฎหมายนั้นยากขึ้นมาก"
 usa.46.a: "เราจะคิดถึงเขา และคะแนนเสียงของเขาดวย"
 usa.47.t: "สภาผูแทนฯ ไตสวนการประพฤติมิชอบของประธานาธิบดี"
 usa.47.desc: "เรื่องอื้อฉาวเล็ก ๆ ที่เริ่มตนจากทําเนียบขาวกําลังไดรับความสนใจมากขึ้น หลังจากสื่อรายงานตอเนื่องหลายสัปดาหโดยบอกเปนนัยวาเจาหนาที่ฝายบริหารระดับลางคนหนึ่งรับสินบนเพื่อแลกกับสัญญาของรัฐบาลที่ทํากําไรงาม คณะกรรมาธิการวาดวยรายจายของฝายบริหารแหงสภาผูแทนราษฎรจึงเริ่มไตสวนเพื่อหาวาประธานาธิบดีรูเรื่องนี้หรือไม แมผูสังเกตการณสวนใหญจะไมเชื่อวาเรื่องนี้จะสรางปญหาใหญใหประธานาธิบดี [USA.GetLeader] แตก็ยอมหมายความวาผูสนับสนุนประธานาธิบดีหลายคนจะตองเก็บตัวเงียบไปสักพัก"
 usa.47.a: "การลาแมมด"
 usa.61.t: "วุฒิสมาชิกจาก [USA_congress_investment_state.GetName] เสนอใหการสนับสนุน"
 usa.61.desc: "วุฒิสมาชิกอาวุโสจาก [USA_congress_investment_state.GetName] ไดติดตอรัฐบาลพรอมขอเสนอใหการสนับสนุน รัฐของเขาประสบปญหาขาดการลงทุนอยางวิกฤต และโครงการกระตุนเศรษฐกิจที่รัฐบาลริเริ่มยอมทําใหเขาทบทวนจุดยืนตอนโยบายบางอยางที่รัฐบาลเสนออยางแนนอน วุฒิสมาชิกผูนี้นั่งอยูในคณะกรรมาธิการสําคัญหลายคณะ และขึ้นชื่ออยางมากเรื่องความสามารถในการตอรอง ทําใหคะแนนเสียงของเขามีคาเทากับอีกหลายเสียงในทั้งสองสภา"
 usa.61.a: "เปนภูมิภาคที่ดอยพัฒนามากจริง ๆ"
 usa.61.b: "เรื่องนี้มีกลิ่นของการคอรรัปชัน"
 usa.62.desc: "วุฒิสมาชิกจาก [USA_congress_investment_state.GetName] ไดติดตอรัฐบาล เสนอใหการสนับสนุนประธานาธิบดีเพื่อแลกกับการรับประกันอยางไมเปนทางการวา [USA_congress_investment_state.GetName] จะเปนที่ตั้งของโรงงานผลิตอาวุธยุทธภัณฑแหงใหมของกองทัพบก พวกเขาใหเหตุผลวาการสรางโรงงานในพื้นที่จะสรางงานจํานวนมาก และใหการสนับสนุนที่จําเปนอยางยิ่งแกกองทัพบกในโลกที่อันตรายขึ้นทุกที วุฒิสมาชิกทั้งสองยังกลาวถึงความสัมพันธในการทํางานอันยอดเยี่ยมกับสมาชิกผูมีอิทธิพลหลายคนในสภาผูแทนราษฎรดวย"
 usa.62.a: "พวกเขามีเหตุผลดี ๆ หลายขอ"
 usa.62.b: "ขอตกลงแบบนี้ไมคูควรกับประธานาธิบดี"
 usa.63.t: "ผูแทนราษฎรจาก [USA_congress_investment_state.GetName] เสนอใหการสนับสนุน"
 usa.63.desc: "คณะผูแทนในสภาคองเกรสจาก [USA_congress_investment_state.GetName] ไดติดตอรัฐบาลพรอมขอเสนอแนะหลายประการเพื่อปรับปรุงโครงสรางพื้นฐานของรัฐ ควรจัดสรรงบประมาณของรัฐบาลกลางเพื่อยกระดับถนนและสะพานเพื่อสงเสริมการคาระหวางรัฐ พวกเขายังระบุวาการสนับสนุนจากรัฐบาลในเรื่องนี้ยอมทําใหพวกเขาโนมเอียงที่จะสนับสนุนวาระของประธานาธิบดีโดยตรงมากขึ้นอยางแนนอน"
 usa.63.a: "เปนความริเริ่มที่นายกยอง"
 usa.63.b: "ปลอยใหพวกเขาพยายามผลักดันเองเถอะ"
 usa.64.t: "คณะกรรมาธิการวุฒิสภาตรวจสอบการตอเรือใน [USA_congress_investment_state.GetName]"
 usa.64.desc: "ดวยการผลักดันของวุฒิสมาชิกอาวุโสจาก [USA_congress_investment_state.GetName] คณะกรรมาธิการการพาณิชยแหงวุฒิสภาไดเริ่มไตสวนเกี่ยวกับสภาพอุตสาหกรรมตอเรือในทองถิ่น ตามความเห็นของผูเชี่ยวชาญ การคาของสหรัฐฯ สวนสําคัญพึ่งพาการคาทางทะเล และประเทศกําลังขาดแคลนขีดความสามารถในการตอเรืออยางหนัก [USA_congress_investment_state.GetName] ไดรับการระบุวาเปนภูมิภาคที่ควรไดรับการลงทุนครั้งใหญ และสมาชิกคณะกรรมาธิการหลายคนแสดงความคาดหวังวารัฐบาลของ [USA.GetLeader] จะจัดสรรงบประมาณไวเพื่อการนี้"
 usa.64.a: "จุดออนที่สําคัญยิ่ง"
 usa.64.b: "เรามีปญหาที่ใหญกวานี้"
 usa.65.t: "ความเมตตาอันนาประหลาดใจของ[GER.GetAdjective]"
 usa.65.desc: "เราไดรับเรื่องราวอันนาทึ่งจากกองทัพอากาศ หลังภารกิจทิ้งระเบิดอุตสาหกรรมทหารของ[GER.GetAdjective]ที่ผิดพลาด เครื่องบินทิ้งระเบิด ''Ye Olde Pub'' ของเราไดรับความเสียหายอยางหนัก สูญเสียลูกเรือหนึ่งนาย และที่เหลือบาดเจ็บสาหัส ลูกเรือซึ่งนําโดยรอยโทชาลส ''ชารลี'' บราวน ปฏิเสธที่จะกระโดดรมทิ้งเพื่อนที่ไมอาจลงจอดไดอยางปลอดภัยใหตกไปพรอมกับเครื่องบิน\n\nขณะที่เครื่องบินที่บินกะปลกกะเปลี้ยถูกเครื่องบินขับไลของขาศึกสกัดอีกครั้ง โดยแทบไมเหลืออาวุธที่ใชการไดไวปองกันตัว ลูกเรือตองตกตะลึงเมื่อเห็นวาเครื่องบินขับไลไมเปดฉากยิง นักบิน[GER.GetAdjective]พยายามสื่อสารกับลูกเรือดวยทาทางและการขยับปาก แมทั้งสองฝายจะพยายามอยางมาก แตก็ไมอาจสื่อสารกันได เครื่องบินขับไลคุมกัน ''Ye Olde Pub'' ออกจากนานฟาของ[GER.GetAdjective] และเมื่อลูกเรือหันปนกระบอกเดียวที่เหลือไปทางเครื่องบินขับไลเพื่อสงสัญญาณวาไมตองการความชวยเหลือแลว นักบินขับไลก็ทําความเคารพ และบินกลับไปยัง [GER.GetNameDef]\n\nเรื่องราวนี้นํามาซึ่งความหวังวายังมีคนดีอยู แมแตในฝายศัตรู แตการปลอยใหเรื่องนี้แพรกระจายอยางเสรีในหมูประชาชนและทหารของเราอาจกอผลขางเคียงที่ไมพึงประสงค"
 usa.65.a: "มอบเหรียญกลาหาญแกนักบินผูนี้!"
 usa.65.b: "ถาเขาไวใจพวก[GER.GetAdjective] เราก็ไมไวใจเขา!"
 usa.65.c: "ดูใหแนใจวาเรื่องนี้จะไมแพรออกไป"
 news.334.t: "กรณีเรือพาเนย"
 news.334.d: "เรือปนของ[USA.GetAdjective]และ[ENG.GetAdjective]ถูกเครื่องบินของ[JAP.GetAdjective]โจมตีในเหตุการณแยกกันในวันนี้ ขณะกําลังอพยพพลเรือนชาวตะวันตกออกจากแนวหนาในสงครามระหวาง [JAP.GetName] และ [CHI.GetName] แมจะมีเครื่องหมายแสดงชัดเจนวาเปนเรือของ[USA.GetAdjective] แตเรือ USS Panay ก็ถูกระเบิดสองลูกและจมลง พลเมือง[USA.GetAdjective]สามคนและพลเมือง[ITA.GetAdjective]หนึ่งคนเสียชีวิต และมีผูบาดเจ็บอีกหลายคน ในการโจมตีเรือ HMS Ladybird อีกครั้งหนึ่ง กะลาสี[ENG.GetAdjective]เสียชีวิตหนึ่งนาย\n\nทั้งรัฐบาล[USA.GetAdjective]และ[ENG.GetAdjective]ไดยื่นประทวงอยางรุนแรง เหตุการณนี้ตอกยํ้าความตึงเครียดที่เพิ่มขึ้นระหวางสามมหาอํานาจทางทะเลชั้นนํา"
 news.334.a: "[JAP.GetNonIdeologyName] ไมมีขีดจํากัดเลยหรือ?"
 news.334.b: "เรื่องนี้อาจทําใหสถานการณซับซอนขึ้น"
 news.334.c: "ภัยคุกคามของ[JAP.GetAdjective]ใหญขึ้นทุกที"
 news.335.t: "ความตึงเครียดพุงสูงระหวาง [USA.GetNameDef] และ [JAP.GetName]"
 news.335.d: "\nกรณีเรือพาเนยเมื่อไมนานมานี้ไดบานปลายจนควบคุมไมได ความโกรธแคนใน [USA.GetNameDef] ทําใหนักการเมืองคนสําคัญหลายคนเรียกรองใหตอบโต [JAP.GetNameDef] ทันที สื่อ[USA.GetAdjective]เต็มไปดวยเรื่องราวใหม ๆ ไมหยุดหยอนเกี่ยวกับความโหดรายของ[JAP.GetAdjective] บางจริง บางเกินจริง บางก็กุขึ้นทั้งหมด เมื่อสองมหาอํานาจอยูบนปากเหวแหงสงคราม ผูสังเกตการณเพียงไมกี่คนที่ยังหวังวาสถานการณจะคลี่คลายได"
 news.335.a: "เรื่องนี้มีความหมายอยางไรตอแปซิฟก?"
 news.335.b: "จงจดจําเรือพาเนย!"
 news.335.c: "ใหพวกเขามาเลย!"
 news.335.e: "ขาวรายของญี่ปุนคือขาวดีของเรา"
 news.335.f: "เรื่องนี้อาจทําใหสถานการณในจีนยากขึ้น"
 news.336.title: "จงจดจําอะลาโม"
 news.336.desc: "กองกําลัง[MEX.GetAdjective]ไดกลับเขายึดครองเท็กซัสอีกครั้งหลังหางหายไปนับรอยป กองทหาร[USA.GetAdjective]ถูกกวาดลางออกจากเมืองใหญทั้งหมดของเท็กซัส รวมถึงซานแอนโทนิโอและสถานที่สําคัญอันโดงดังอยางอะลาโม แมจะไมมีการสูรบเกิดขึ้น ณ สถานที่ทางประวัติศาสตรแหงนี้ แต [MEX.GetLeader] ไดเยี่ยมชมบริเวณคณะเผยแผศาสนาคาทอลิกแหงนี้ พรอมจัดการชุมนุมและกลาวสุนทรพจนปลุกใจใหทหารสูตอไปจนไดชัยชนะครั้งสุดทายเหนือพวก 'แยงกี้' ที่นารังเกียจ"
 news.336.a: "เราจดจําได"
 news.336.b: "เราลืมไปแลว"
 news.336.c: "[USA.GetLeader] ปลอยใหเรื่องนี้เกิดขึ้นไดอยางไร?"
 generic.19.t: "[From.GetName] สงความชวยเหลือดานอุตสาหกรรม"
 generic.19.d: "[From.GetNameDefCap] แจงเราวาพวกเขาสนับสนุนอุดมการณของเรา และจะมอบความชวยเหลือดานอุตสาหกรรมจํานวนหนึ่งเพื่อเสริมสถานะของเราในการตอตานศัตรูรวมกัน"
 generic.20.t: "[From.GetNameDefCap] เรียกรองใหเรายอมสยบ"
 generic.20.d_friends: "วันนี้เราไดตอนรับคณะผูแทนที่แสดงความสนใจของ [From.GetLeader] ในการกระชับความสัมพันธระหวางสองประเทศ และดําเนินการเพื่อรวมประชาชนชาว[Root.GetAdjective]เขากับ [From.GetNameDef] การยอมรับขอเสนอของ [From.GetLeader] จะทําให [Root.GetNameDef] กลายเปนรัฐหุนเชิดที่มีอํานาจปกครองตนเองระดับปานกลางของ [From.GetNameDef] และรัฐบาลของเราจะถูกปรับโครงสรางใหสอดคลองกับวิสัยทัศนของ [From.GetLeader] มากขึ้น\n\nคําถามยังคงอยูวา เอกราชของ[Root.GetAdjective]สําคัญกวามิตรภาพของเรากับ [From.GetNameDef] หรือไม?"
 generic.20.d_enemies: "วันนี้มีสาสนมาจาก [From.GetNameDef] เรียกรองให [Root.GetLeader] รับรอง [From.GetLeader] เปนประมุขแหงรัฐ และใหชาติของเราถูกปรับโครงสรางใหสอดคลองกับวิสัยทัศนของรัฐบาล[From.GetAdjective]ที่มีตอ [Root.GetNameDef] มากขึ้น การยอมรับจะทําใหเรากลายเปนรัฐหุนเชิดของ [From.GetNameDef]\n\nแมเราจะไมอยากยอมสละเอกราชใหแกศัตรูขามพรมแดน แตสาสนของพวกเขามีนํ้าเสียงขมขูอยางชัดเจน ซึ่งทําใหเราเชื่อวาหากไมทําตามขอเรียกรองของ [From.GetLeader] อีกไมนานเราจะตองอยูในภาวะสงครามกับ [From.GetNameDef]"
 generic.20.a: "ยอมทําตามขอเรียกรองของพวกเขา"
 generic.20.b: "สวนขาพเจา ขอตอนรับเจานายชาว[From.GetAdjective]คนใหมของเรา"
 generic.20.c: "ไมมีทางเด็ดขาด!"
 generic.21.t: "[From.GetNameDefCap] ยอมสยบ"
 generic.21.d: "รัฐบาล[From.GetAdjective]ตกลงสละเอกราชและกลายเปนรัฐหุนเชิดของ [Root.GetNameDef] เรามั่นใจวาสิ่งนี้จะนําไปสูความยิ่งใหญและสงเสริมผลประโยชนของ[Root.GetAdjective]ในภูมิภาค"
 generic.21.a: "ยอดเยี่ยม"
 generic.22.t: "[From.GetNameDefCap] ขัดขืน!"
 generic.22.d: "นักการทูตจาก [From.GetNameDef] เดินทางมาถึงในวันนี้เพื่อแจงวาพวกเขาปฏิเสธขอเสนอของเราที่จะรวม [From.GetNameDef] เขากับ [Root.GetNameDef] แมจะนาผิดหวัง แตการใชกําลังบังคับให [From.GetNameDef] ยอมสยบก็ยังคงเปนทางเลือกที่ทําไดและนาดึงดูด"
 generic.22.a: "นาผิดหวัง"
 generic.23.t: "[From.GetNameDefCap] เรียกรองใหควบคุม [demanded_prov_target.GetName]"
 generic.23.d: "วันนี้เราไดตอนรับคณะผูแทนที่แสดงทาทีเปนปฏิปกษจาก [From.GetNameDef] ซึ่งอางกรรมสิทธิ์เหนือรัฐ [demanded_prov_target.GetName] ทั้งหมด [From.GetLeader] เรียกรองใหเราคืนดินแดนนี้โดยทันที มิฉะนั้นสงครามจะเลี่ยงไมได พวกเขาอางวาการครอบครองภูมิภาคนี้ของฝาย[demanded_prov_target.Owner.GetAdjective]ไมชอบธรรม และ [demanded_prov_target.GetName] เปนสวนหนึ่งที่แยกไมไดของรัฐ[From.GetAdjective]\n\nหากเรายอมรับขอเรียกรอง [demanded_prov_target.GetName] จะถูกยกใหแก [From.GetNameDef] แตเราจะยังคงรักษาดินแดนหลักหรือการอางสิทธิ์ใด ๆ ที่เรามีเหนือภูมิภาคนี้ไว หากเราปฏิเสธ สงครามระหวางสองชาติของเราก็ดูจะหลีกเลี่ยงไมได"
 generic.23.a: "เราไมมีทางเลือก"
 generic.23.b: "[demanded_prov_target.GetName] จะยังคงเปนของ[Root.GetAdjective]!"
 generic.24.t: "ยก [demanded_prov_target.GetName] ใหแลว!"
 generic.24.d: "[From.GetNameDefCap] ตัดสินใจยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือ [demanded_prov_target.GetName] และไดยกภูมิภาคนี้ใหแก [Root.GetNameDef]\nเมื่อเรื่องนี้ไดรับการจัดการอยางรวดเร็วและสุภาพเชนนี้ เราเชื่อมั่นวาสันติภาพระหวาง [Root.GetNameDef] และ [From.GetNameDef] จะคงอยูตลอดไป"
 generic.25.t: "[From.GetNameDefCap] แข็งขอ!"
 generic.25.d: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา และบัดนี้เราตองตัดสินใจวาจะทําตามคําขูที่จะรุกรานหรือไม การไมรักษาคําพูดจะทําลายภาพลักษณของ [Root.GetLeader] ในสายตาประชาชนและความชอบธรรมของรัฐบาล[Root.GetAdjective]อยางรายแรง"
 generic.25.a: "ไมทางใดก็ทางหนึ่ง [demanded_prov_target.GetName] จะตองเปนของเรา"
 maybe_war_tt: "§Rการกระทํานี้อาจนําไปสูสงครามกับ§! §Y[From.GetNameDef]§!"
 usa.401.t: "[From.GetNameDefCap] ยอมรับขอตกลงแลกเรือพิฆาตกับฐานทัพ"
 usa.401.desc: "[From.GetLeader] นายกรัฐมนตรีอังกฤษไดแสดงทาทีตอบรับเงื่อนไขของขอตกลงแลกเรือพิฆาตกับฐานทัพ คณะนายทหารเรือ[From.GetAdjective]ไดเดินทางมาถึงเพื่อตรวจสอบเรือพิฆาตและกํากับดูแลการสงมอบ\n\n เห็นไดชัดวายังมีงานตองทําอีกพอสมควร เพราะนายทหาร[From.GetAdjective]หลายนายดูจะกังวลอยูบางกับปริมาณและความหนาของมูลนกและสนิมบนเรือที่จะสงมอบ"
 usa.401.a: "ขอทานจะเลือกมากไมได"
 spain.11.t: "การลุกฮือของฝายคารลิสต"
 spain.11.d: "พวกคารลิสตโกรธจัดแลวเฟย!"
 spain.11.a: "แยแลว"
 spain.12.t: "การลุกฮือของฝายอนาธิปไตย"
 spain.12.d: "พวกอนาธิปไตยโกรธจัดแลวเฟย!"
 spain.12.a: "แยแลว"
