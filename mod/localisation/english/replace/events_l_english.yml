 news.167.t: "วิกฤตในสโลวีเนีย"
 news.167.d: "เยอรมนีใชการผนวกออสเตรียเขากับ [GER.GetName] เปนฐานในการอางสิทธิ์ และบัดนี้ไดเรียกรองให [YUG.GetName] "คืนโดยชอบธรรม" ซึ่งสโลวีเนีย ดินแดนเดิมของออสเตรีย \n\nเพื่อตอบโต ประเทศผูลงนามในสนธิสัญญาแวรซายไดมาประชุมกันที่ลอนดอนเพื่อหาทางออกใหกับ "ปญหาสโลวีเนีย"\n\nการประชุมถูกชี้ขาดดวยการพลิกขั้วอยางนาประหลาดใจ เมื่ออิตาลีสนับสนุนบูรณภาพแหงดินแดนของยูโกสลาเวีย ทําใหขอเรียกรองของเยอรมนีไมไดรับการยอมรับ \n\nเชนเคย นโยบายตางประเทศของอิตาลีคาดเดาไมไดเลย และยังตองรอดูวาพวกเขาหวังใหการเดินเกมครั้งนี้พาไปสูจุดใด"
