 lar_collab_gov.1.t: "พลพรรค[From.GetAdjective]ใน [Root.GetNameDef]"
 lar_collab_gov.1.d: "ระยะหลังนี้ [From.GetNameDefCap] เพิ่มความพยายามในการสรางกลุมผูรวมมือภายในชาติของเรา นักการเมือง[This.GetAdjective]จํานวนหนึ่งเริ่มพูดถึงระบอบ[From.GetAdjective]ในทางเห็นอกเห็นใจ และพลพรรคจํานวนมากในชาติของเรากําลังเปลี่ยนความรูสึกฝกใฝ[From.GetRulingIdeology]ของตนใหกลายเปนการสนับสนุน [From.GetNameDef] โดยตรง\n\nอิทธิพลของ[From.GetAdjective]ที่เติบโตขึ้นในชาติของเราจะลดทอนการตอตานของ[Root.GetAdjective]อยางแนนอน และอาจนําไปสูรัฐบาล[From.GetRulingIdeology]ชุดใหมที่รวมมือกับ [From.GetNameDef] หาก [Root.GetNameDef] ยอมจํานน"
 worrying: "นากังวล"
 ETH_events.1.t: "เอธิโอเปยเสนอสันติภาพแบบไมมีเงื่อนไข"
 ETH_events.1.d: "เมื่อการควบคุมทั้งโซมาลิแลนดและเอริเทรียแทบจะสูญสิ้นไป เหลือเพียงพื้นที่ตอตานอยูไมกี่แหง รัฐบาลเอธิโอเปยจึงเสนอใหยุติการสูรบครั้งนี้อยางสันติ อิตาลีจะยุติการรุกรานเอธิโอเปยอยางเปนทางการ และยกดินแดนที่ยึดครองในแอฟริกาตะวันออกใหแกเอธิโอเปย เราควรตอบสนองอยางไร?"
 ETH_events.1.a: "ลงนามในสนธิสัญญา"
 ETH_events.1.b: "เรารับความอัปยศอีกครั้งไมได!"
 ETH_events.101.t: "[From.GetNameDefCap] ปฏิเสธสันติภาพ"
 ETH_events.101.d: "แมจะสูญเสียการควบคุมดินแดนทั้งหมดในแอฟริกาตะวันออกไปแลว [From.GetLeader] ก็ยังปฏิเสธขอเสนอสันติภาพแบบไมมีเงื่อนไขของเรา ดูเหมือนวาการยอมจํานนโดยสิ้นเชิงจะเปนหนทางเดียวที่จะยุติสงครามนี้ได"
 ETH_events.101.a: "นาเศรา"
 germany.1041.t: "[FROM.GetNameDefCap] เรียกรองซูเดเทินลันด"
 germany.1041.desc: "แมพรมแดนเช็กจะเพิ่งผานความปนปวนมา แตนโยบายตางประเทศของ[FROM.GetAdjective]ยังคงไมเปลี่ยนแปลง นักการทูต[FROM.GetAdjective]ไดยื่นคําขาดมายังเรา - สงมอบซูเดเทินลันด มิฉะนั้นจะมีการประกาศสงคราม"
 germany.1041.desc_ally_or_subject: "แมพรมแดนเช็กจะเพิ่งผานความปนปวนมา แตนโยบายตางประเทศของ[FROM.GetAdjective]ยังคงไมเปลี่ยนแปลง นักการทูต[FROM.GetAdjective]ไดยื่นขอเรียกรองทางดินแดนมายังเรา โดยคาดหวังใหเราสงมอบซูเดเทินลันดโดยไมชักชา"
 germany.1041.a: "เราไมมีทางเลือก"
 germany.1041.b: "[GetSudetenlandRejectOption]"
 germany.1041.b_default: "เครื่องจักรสงคราม[FROM.GetAdjective]จะตองหยุดอยูที่นี่"
 germany.1041.b_ally_of_ger: "เราจะไมยอมสละดินแดนที่ไดมา"
 germany.1042.t: "[FROM.GetNameDefCap] ยอมจํานน"
 germany.1042.desc_default: "อานุภาพของ[ROOT.GetAdjective]ไรขีดจํากัด - ดินแดนซูเดเทินลันดที่เคยอยูในเขตอิทธิพลของ[FROM.GetAdjective]ไดถูกโอนมาเปนของเราแลว สวน [FROM.GetNameDefCap] ยังคงไมอยูในเปาหมายของเรา ในตอนนี้"
 germany.1042.desc_ally: "อานุภาพของ[ROOT.GetAdjective]ไรขีดจํากัด - ดินแดนซูเดเทินลันดที่เคยอยูในเขตอิทธิพลของ[FROM.GetAdjective]ไดถูกโอนมาเปนของเราแลว ไมนานนัก [FROM.GetLeader] และนักการทูต[FROM.GetAdjective]ก็ตระหนักวานี่คือสิ่งที่ดีที่สุดสําหรับ [ROOT.GetFactionName]"
 germany.1042.desc_subject: "อานุภาพของ[ROOT.GetAdjective]ไรขีดจํากัด - ดินแดนซูเดเทินลันดที่เคยอยูภายใตการควบคุมของ[FROM.GetAdjective]ไดถูกโอนมาเปนของเราแลว ผูปกครองหุนเชิดของเราใน [FROM.GetNameDef] คือ [FROM.GetLeader] ไดดูแลใหเจาหนาที่ทองถิ่นและองคกร[FROM.GetAdjective]ปฏิบัติตามสนธิสัญญาโดยไมมีขอโตแยง"
 germany.1042.a: "ยอดเยี่ยม"
 germany.1043.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรอง"
 germany.1043.desc: "แมดุลอํานาจจะไมเทาเทียมกัน นักการทูต[FROM.GetAdjective]ก็ยังปฏิเสธขอเรียกรองใหยกซูเดเทินลันดของเรา สงครามจะตองตามมาอยางแนนอน"
 germany.1043.desc_ally: "แมจะเปนประโยชนสูงสุดตอสมาชิกทุกชาติของ [ROOT.GetFactionName] นักการทูต[FROM.GetAdjective]ก็ยังปฏิเสธขอเรียกรองใหยกซูเดเทินลันดของเรา ตอนนี้เราทําอะไรไดไมมากนัก เพราะตองเคารพอํานาจปกครองตนเองของพันธมิตร"
 germany.1043.a: "ใหตายสิ"
 GRE_turkey_surrenders: "ตุรกียอมถอยตามขอเรียกรองของกรีซ"
 germany.1050.t: "การสิ้นชีพของทานผูนํา"
 germany.1050.desc: "ทานผูนํา $GER_adolf_hitler$ ถูกพบเปนศพในบังเกอรของเขา ขณะที่กองกําลังขาศึกประชิดเขามา ดูเหมือนทานผูนําจะเลือกปลิดชีพตนเองแทนที่จะเสี่ยงถูกจับ เพื่อปองกันไมใหขวัญกําลังใจของทหารตกตํ่า หนวยงานโฆษณาชวนเชื่อของเราไดรับคําสั่งใหประกาศวาฮิตเลอรเสียชีวิตขณะตอสูอยางกลาหาญจนลมหายใจสุดทายเผชิญหนากับกองกําลังขาศึกที่เหนือกวามหาศาล อยางไรก็ตาม ปญหาเรงดวนกวาของเราคือ ใครจะขึ้นมาแทนที่ทานผูนํา?"
 germany.1050.a: "$GER_karl_donitz$ คือผูสืบทอดที่ทานผูนําโปรดปราน"
 germany.1050.b: "$GER_albert_speer$ จะสานตอความทะเยอทะยานของทานผูนํา"
 germany.1050.c: "$GER_heinz_guderian$ จะพาเราออกจากสถานการณเลวรายนี้"
 generic_purchase_ships_events.01.t: "การจัดซื้อเรือรบจาก[FROM.GetAdjective]"
 generic_purchase_ships_events.01.desc: "[FROM.GetNameDefCap] ติดตอเราพรอมขอเสนอขอซื้อยุทโธปกรณทางเรือบางสวนที่เราปลดระวางเก็บไว ยุทโธปกรณที่พวกเขาสนใจไมไดประจําการแลวเนื่องจากอายุการใชงานและขาดอุปกรณที่ทันสมัย"
 generic_purchase_ships_events.01.a: "ขอตกลงที่เปนประโยชนรวมกัน"
 generic_purchase_ships_events.01.b: "เราไมอาจสละยุทโธปกรณทางเรือใด ๆ ได"
 generic_purchase_ships_events.02.t: "[FROM.GetNameDefCap] ตกลงขายเรือรบ"
 generic_purchase_ships_events.02.desc: "นักการทูตและบุคลากรทางเรือ[FROM.GetAdjective]แจงเราวาพวกเขายินดีขายยุทโธปกรณที่ปลดระวางซึ่งเราเสนอขอซื้อ การนี้จะชวยใหเราขยายกองทัพเรือที่เพิ่งตั้งไขไดอยางรวดเร็ว"
 generic_purchase_ships_events.02.a: "ขาวดีเยี่ยม!"
 generic_purchase_ships_events.03.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงขายเรือรบ"
 generic_purchase_ships_events.03.desc: "นักการทูต[FROM.GetAdjective]แจงเราวาพวกเขาไมยินดีขายยุทโธปกรณที่ปลดระวางซึ่งเราเสนอขอซื้อ ยังไมชัดเจนวาการปฏิเสธนี้เปนเพราะพวกเขามีแผนสําหรับเรือเหลานั้นเอง หรือตั้งใจแสดงความไมพอใจตอนโยบายของเรา"
 generic_purchase_ships_events.03.a: "นาเสียดาย"
 generic_purchase_ships_events.04.t: "การจัดซื้อเรือรบจาก[FROM.GetAdjective]"
 generic_purchase_ships_events.04.desc.a: "[FROM.GetNameDefCap] ติดตอเราพรอมขอเสนอขอซื้อเรือหลักบางลําที่เราปลดระวางเก็บไว ยุทโธปกรณที่พวกเขาสนใจไมไดประจําการแลวเนื่องจากอายุการใชงานและขาดอุปกรณที่ทันสมัย อยางไรก็ตาม การขายเรือเหลานี้ให [FROM.GetNameDef] เสี่ยงที่จะทําใหการแขงขันสะสมกําลังทางเรือในภูมิภาคซึ่งเลวรายลงอยูแลวทวีความรุนแรงยิ่งขึ้น"
 generic_purchase_ships_events.04.desc.b: "[FROM.GetNameDefCap] ติดตอเราพรอมขอเสนอขอซื้อเรือหลักบางลําที่เราปลดระวางเก็บไว ยุทโธปกรณที่พวกเขาสนใจไมไดประจําการแลวเนื่องจากอายุการใชงานและขาดอุปกรณที่ทันสมัย"
 generic_purchase_ships_events.04.a: "ขอตกลงที่เปนประโยชนรวมกัน"
 generic_purchase_ships_events.04.b: "เราไมอาจสละยุทโธปกรณทางเรือใด ๆ ได"
 generic_purchase_ships_events.05.t: "[FROM.GetNameDefCap] ตกลงขายเรือเดรดนอต"
 generic_purchase_ships_events.05.desc: "นักการทูตและบุคลากรทางเรือ[FROM.GetAdjective]แจงเราวาพวกเขายินดีขายเรือเดรดนอตที่ปลดระวางซึ่งเราเสนอขอซื้อ การนี้จะชวยใหเราขยายกองทัพเรือไดอยางรวดเร็วและรักษาความไดเปรียบเหนือเพื่อนบาน"
 generic_purchase_ships_events.05.a: "ขาวดีเยี่ยม!"
 generic_purchase_ships_events.06.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงขายเรือเดรดนอต"
 generic_purchase_ships_events.06.desc: "นักการทูต[FROM.GetAdjective]แจงเราวาพวกเขาไมยินดีขายเรือเดรดนอตที่ปลดระวางซึ่งเราเสนอขอซื้อ ยังไมชัดเจนวาการปฏิเสธนี้เปนเพราะพวกเขามีแผนสําหรับเรือเหลานั้นเอง หรือตั้งใจแสดงความไมพอใจตอนโยบายของเรา"
 generic_purchase_ships_events.06.a: "นาเสียดาย"

 AAT_germany.1.t: "[FROM.GetNameDefCap] ขอสิทธิ์ในทรัพยากร"
 AAT_germany.1.a: "นั่นไมเปนประโยชนตอเรา"
 AAT_germany.1.b: "ไมมีใครเสียประโยชน!"

 AAT_germany.2.t: "[FROM.GetName] ปฏิเสธขอตกลงของเรา"
 AAT_germany.2.desc: "[FROM.GetName] ปฏิเสธขอเสนอของเรา โดยระบุวาขณะนี้ไมเปนประโยชนตอพวกเขา\nพวกเขายํ้าวาไมไดมีเจตนารายตอเรา เพียงแตมีเรื่องอื่นที่สําคัญกวาในขณะนี้"
 AAT_germany.2.a: "นาเสียดาย"

 AAT_germany.3.t: "[FROM.GetName] ยอมรับขอตกลงของเรา"
 AAT_germany.3.desc: "[FROM.GetName] ยอมรับขอตกลงของเราแลว ซึ่งจะเปนประโยชนตอทั้งสองฝายอยางแนนอน หวังวาความรวมมืออันมีกําไรนี้จะตามมาดวยขอตกลงอีกมากมาย"
 AAT_germany.3.a: "เยี่ยม"
 
 #This loc is now used in a different German event for trade deals:
 AAT_germany.1.desc: "[FROM.GetNameDefCap] ติดตอเราพรอมขอตกลงที่พวกเขาอางวาจะเปนประโยชนตอเศรษฐกิจของทั้งสองฝาย พวกเขาตองการทรัพยากรธรรมชาติของเราเพื่ออุตสาหกรรมของตน ขณะที่เราตองการเงินลงทุนของพวกเขาเพื่อขยายอุตสาหกรรมของเรา เปนขอเสนอที่ทํากําไรงาม แตมันจะเปนสัญญากับปศาจหรือไม?"

 #This loc string is used for when Germany pressures Sweden to give up resource rights:
 AAT_germany.10.desc: "หลังจากที่ [FROM.GetNameDef] และเหลาลิ่วลอเขายึดครอง [144.GetName] เมื่อไมนานมานี้ [GER.GetLeader] ก็เพิ่มแรงกดดันใหเราคาทรัพยากรกับพวกเขามากขึ้นเพื่อปอนเครื่องจักรสงคราม ขอตกลงที่เสนอมาไมไดเอาเปรียบฝายเดียวเสียทีเดียว และการปฏิเสธอาจทําใหเราถูกลากเขาสูสงคราม..."
 wtt_xian_incident_warning_8: "§R[CHI.GetNameDef] อาจเลือกทําสงครามเพราะเรื่องนี้!§!"