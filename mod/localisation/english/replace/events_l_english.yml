 news.168.t: "คําตัดสินลูบลิยานาครั้งที่หนึ่ง"
 news.168.d: "เมื่อเสียสโลวีเนียไป รอยราวทางชาติพันธุภายในยูโกสลาเวียก็เริ่มปรากฏชัดขึ้น และอํานาจสวนกลางก็ออนแอลงทุกวัน \n\nวันนี้ รัฐมนตรีตางประเทศเยอรมนีไดประกาศแผนที่จะแกไข "ความผิดพลาดของรัฐแวรซาย" ใหสิ้นซาก ในสนธิสัญญาที่ลงนามโดยเพื่อนบานที่ทรงอํานาจที่สุดบางรายของ [YUG.GetName] ดินแดนสวนใหญไดถูกแบงใหแกประเทศที่เปนมิตรกับเยอรมนี\n\nนักการทูต[YUG.GetAdjective]ไมเคยแมแตจะไดเห็นสนธิสัญญานี้กอนการใหสัตยาบัน แตเมื่อหลายประเทศตางกรูกันเขายึดดินแดนยูโกสลาเวียจากรัฐบาลกลางที่กําลังลมสลาย รัฐบาลของ [YUG.GetLeader] ก็แทบทําอะไรไมได"
