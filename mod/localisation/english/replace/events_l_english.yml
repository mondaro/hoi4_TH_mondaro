 news.171.t: "คําตัดสินลูบลิยานาครั้งที่สอง"
 news.171.d_BUL: "กรีซไดปฏิเสธการไกลเกลี่ยของเยอรมนีในขอพิพาทพรมแดนกับบัลแกเรีย โดยอางวาขอเสนอของเยอรมนีไมตางอะไรกับการยอมจํานน \n\n[GRE.GetLeader] กลาวกับสื่อมวลชนวา หาก [BUL.GetLeader] และ [GER.GetLeader] ตองการดินแดนเหลานี้ ก็ "มาเอาไปเองสิ" \n\nรัฐบาล[BUL.GetAdjective]ปฏิเสธขอกลาวหาทั้งหมดที่วาตนไดเสนอการสนับสนุนทางทหารและเศรษฐกิจแก [GER.GetNameDef] เพื่อแลกกับความชวยเหลือในการไดดินแดนกรีซ"
 news.171.d_ITA: "หลังการพบปะระหวาง [GER.GetLeader] และ [ITA.GetLeader] รัฐบาล[GER.GetAdjective]ไดประกาศสนับสนุนจุดยืนของ[ITA.GetAdjective]อยางเปดเผยในขอพิพาทพรมแดนที่ยังดําเนินอยูกับ [GRE.GetNameDef] \n\n[GRE.GetLeader] ผูนํากรีซไดประกาศวาทางออกที่เสนอมานั้นยอมรับไมไดโดยสิ้นเชิง และปฏิญาณจะปกปองประเทศ "จนกระสุนนัดสุดทาย ลูกปนใหญลูกสุดทาย และลมหายใจสุดทาย""
 news.171.d_ITA_BUL: "กรีซไดปฏิเสธขอเสนอของเยอรมนีที่จะไกลเกลี่ยขอพิพาทพรมแดนระหวางกรีซฝายหนึ่งกับอิตาลีและบัลแกเรียอีกฝายหนึ่ง โฆษกรัฐบาล[GRE.GetAdjective]ประกาศวากองทัพ[GRE.GetAdjective]พรอมปกปองประเทศจากผูรุกรานทุกราย และยอมตายในการสูรบดีกวายอมจํานนตอพวกหมาในและแรงที่เกาะชายเสื้อเยอรมนีอยู"
 news.171.d_GER: "การเจรจาระหวาง [GRE.GetNameDef] และ [GER.GetNameDef] เพื่อยุติขอพิพาทพรมแดนหลายกรณีไดลมลง [GRE.GetLeader] อางวาขอเสนอของเยอรมนีที่จะเชาพื้นที่บางแหงเพื่อตั้งฐานทัพเยอรมันนั้นเทากับการยอมยกดินแดนสวนใหญของประเทศ และไดเรียกรองใหชาวกรีกทุกคนที่มีรางกายแข็งแรงออกมาปกปองประเทศ"
