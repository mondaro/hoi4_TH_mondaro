 NSB_soviet_five_year_plan.01.t: "แผนหาปฉบับที่สามหยุดชะงัก"
 NSB_soviet_five_year_plan.01.desc: "ดวยการโจมตีมาตุภูมิในขณะนี้ ชัดเจนวาแผนการเติบโตทางเศรษฐกิจกอนหนาของเราไมอาจดําเนินตอไปไดแลว เราอาจกลับไปดําเนินการเมื่อสันติภาพกลับคืนมา แตตอนนี้เราตองมุงเนนการผลิตทางทหาร"
 NSB_soviet_five_year_plan.01.a: "สาปแชงพวกมัน!"
 NSB_soviet_five_year_plan_tt: "แผนยุทธศาสตรดานอุตสาหกรรมทั้งหมดที่เกี่ยวของกับ §Y$SOV_third_five_year_plan$§! จะไมสามารถใชไดอีกตอไป"
 NSB_soviet_great_patriotic_war.01.t: "นิโคไล อีวาโนวิช คุซเนตซอฟ ขอรับมอบหมายภารกิจ"
 NSB_soviet_great_patriotic_war.01.desc: "หลังการรุกรานยูเครนของ[?ROOT.SOV_invader_of_ukraine.GetAdjective] นิโคไล คุซเนตซอฟไดยื่นคําขออยางเปนทางการเพื่อเขารวม NKVD เพื่อปกปองบานเกิดของเขา ดวยความสามารถเฉพาะตัวของเขา เขาจะเปนกําลังสําคัญในการสนับสนุนปฏิบัติการของพลพรรคในพื้นที่"
 NSB_soviet_great_patriotic_war.01.a: "ยินดีตอนรับ สหาย!"

 NSB_soviet_propaganda_capmaign_events.1.t: "ยุวชนผูสรางคอมมิวนิสต"
 NSB_soviet_propaganda_capmaign_events.1.desc: "มิตรและผูชี้นําของเราใน [SOV.GetNameDef] ไดเริ่มโครงการเพื่อใหมั่นใจวาคนรุนที่กําลังเติบโตจะเขาใจอยางถองแทวาตนถูกคาดหวังใหทําอะไร คอมมิวนิสตที่ดีตองทั้งแข็งแรงทางกาย เพื่อทํางานที่จําเปนในการสรางโลกที่ดีกวา และมีการศึกษาดีเพื่อเขาใจอยางถองแทวาตองทําสิ่งใด \n\nเยาวชนผูกระตือรือรนในชาติของเราไดรับแนวคิดนี้มา และพยายามเลียนแบบแนวทางนี้ใหมากที่สุด"
 NSB_soviet_propaganda_capmaign_events.1.a: "พวกเขาจะสรางอนาคตที่สดใสกวาของตนเอง"
 NSB_soviet_propaganda_capmaign_events.2.t: "คํามั่นแหงสันติภาพถูกทําลาย"
 NSB_soviet_propaganda_capmaign_events.2.desc: "การตัดสินใจลงมือเชิงรุกเพื่อรับประกันความปลอดภัยตอไปของเรา ไดทําใหเราตกอยูในสถานะลําบากเมื่อเทียบกับถอยแถลงบางอยางที่เราเพิ่งใหไว แมคนสวนใหญจะไมไดตั้งคําถามถึงสถานการณนี้อยางเปดเผยนัก แตตํารวจลับของเรารายงานวาหลายคนแอบถามกันวาทําไมเราจึงสัญญาวาจะมีสันติภาพ ในเมื่อเห็นไดชัดวาเรากําลังเตรียมทําสงคราม \n\nไมมีใครกลาเรียกสิ่งที่เราทําวาเปนการโกหก แตชัดเจนวาเราไดสูญเสียความไววางใจจากประชาชนทั่วไปไปมาก"
 NSB_soviet_propaganda_capmaign_events.2.a: "จังหวะเวลาชางโชครายเหลือเกิน"
 NSB_soviet_propaganda_capmaign_events.3.desc: "การปะทุของสงครามทําใหสถานะของเราในสายตาสาธารณชนคอนขางลําบาก แมคนสวนใหญจะเห็นพองวาเราเปนฝายถูกกระทํา และความโกรธของสาธารณชนก็มุงไปที่ผูรุกรานอยางสมควร แตหลายคนก็แอบสงสัยวาทําไม [THIS.GetLeader] จึงไมไดคาดการณการโจมตีนี้ ตํารวจลับของเรารายงานวาในบางกรณี ผูคนถึงขั้นเรียก [THIS.GetLeader] วา "ถาไมไรเดียงสาอยางอันตราย ก็ไรความสามารถจนถึงขั้นเปนอาชญากรรม""
 NSB_soviet_propaganda_capmaign_events.3.a: "แตเราไมเคยตองการสงครามนี้!"

 NSB_soviet_foreign_politics_events.1.t: "แรงกดดันจาก[FROM.GetAdjective]ตอรัฐบาล"
 NSB_soviet_foreign_politics_events.1.desc: "รัฐมนตรีวาการกระทรวงการตางประเทศ[FROM.GetAdjective]ไดเดินทางมาถึงเมืองหลวงเพื่อหารือเรงดวนกับ [THIS.GetLeader] คณะผูแทน[FROM.GetAdjective]มาพรอมรายการปญหาคางคายาวเหยียด ตั้งแตความมั่นคงชายแดนไปจนถึงการนําเสนอภาพ [FROM.GetLeader] ในแงลบโดยสื่อทองถิ่น ในแถลงการณตอสื่อ รัฐมนตรีวาการกระทรวงการตางประเทศเนนยํ้าถึงความสําคัญของความรวมมือและการทํางานรวมกันอยางสันติ แตก็ตั้งขอสังเกตวา [FROM.GetLeader] "คงยากที่จะยอมรับ [THIS.GetNameDef] ที่เปนปรปกษหรือไมเปนมิตร""
 NSB_soviet_foreign_politics_events.1.a: "เรายินดีเขารวมฝายของพวกเขา หากเรายังคงรักษารัฐธรรมนูญของเราไวได"
 NSB_soviet_foreign_politics_events.1.b: "เราตองปรับรัฐบาลของเราใหสอดคลองกับพวกเขา"
 NSB_soviet_foreign_politics_events.1.c: "เราจะไมยอมถอยแมแตนิ้วเดียว"
 NSB_soviet_foreign_politics_events.2.t: "การชุมนุมในเมืองหลวงที่ไดรับการสนับสนุนจาก[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.2.desc: "กลุมการเมืองจํานวนหนึ่งไดประกาศจัดการชุมนุมในเมืองหลวงสัปดาหนี้ ดูเหมือนพวกเขาจะไมมีขอรองเรียนเฉพาะเจาะจงที่ตองการเรียกรอง นอกเหนือจากความรูสึกทั่วไปวาเราควรพยายามปรับปรุงความสัมพันธกับ [FROM.GetNameDef] และปลดนักการเมืองที่วิจารณฝายบริหาร[FROM.GetAdjective]ออกจากตําแหนงที่มีอํานาจทั้งหมด\n\nแมเปนไปไดวาการชุมนุมเหลานี้เปนเพียงการแสดงออกของความคิดเห็นมหาชนที่เกิดขึ้นเอง แตอยางนอยก็นาสังเกตวาแกนนําคนสําคัญหลายคนเพิ่งเดินทางไป [FROM.GetCapitalVictoryPointName] และดูเหมือนจะเริ่มปลุกระดมเรื่องนี้หลังจากกลับมา"
 NSB_soviet_foreign_politics_events.2.a: "ก็นั่นเปนสิทธิ์ของพวกเขาแนนอน"
 NSB_soviet_foreign_politics_events.2.b: "สงตํารวจไปฟาดหัวพวกมันสักหนอย!"

 NSB_soviet_foreign_politics_events.10.t: "[FROM.GetNameDefCap] ตองการลงทุนในเศรษฐกิจของเรา"
 NSB_soviet_foreign_politics_events.10.desc: "รัฐบาล[FROM.GetAdjective]ไดเริ่มโครงการลงทุนในเศรษฐกิจอยางกวางขวาง ในฐานะสวนหนึ่งของโครงการ พวกเขาไดกันงบประมาณไวสําหรับกอสรางเครือขายสะพาน อุโมงค และถนนในเมืองหลวงและที่อื่น ๆ ขีดความสามารถของอุตสาหกรรมการกอสรางของเราที่เพิ่มขึ้นตามมายอมใหผลตอบแทนตอไปในอนาคตอยางไมตองสงสัย\n\nอยางไรก็ตาม บางคนในรัฐบาลกังวลวาการเชิญวิศวกรและเงินทุนจาก[FROM.GetAdjective]เขามาจะยิ่งทําใหเราพึ่งพาความเชี่ยวชาญของพวกเขามากขึ้นในอนาคต"
 NSB_soviet_foreign_politics_events.10.a: "ขอบคุณ สหาย!"
 NSB_soviet_foreign_politics_events.10.b: "นี่จะยิ่งทําใหเราพึ่งพา [FROM.GetNameDef] มากขึ้น"
 NSB_soviet_foreign_politics_events.11.t: "[FROM.GetNameDefCap] เรียกรองมาตรการสงคราม"
 NSB_soviet_foreign_politics_events.11.desc: "เมื่อสงครามดูจะใกลเขามาเรื่อย ๆ รัฐบาล[FROM.GetAdjective]เริ่มกดดันใหเราเพิ่มขีดความสามารถในการรบ พวกเขาตองการใหเราเพิ่มกําลังพลสํารองอยางมาก พรอมกับลดเวลาการฝก เพื่อใหมีกองพลพรอมปฏิบัติหนาที่แนวหนามากขึ้น และเพื่อใหกองพล[FROM.GetAdjective]วางไปทําภารกิจอื่น"
 NSB_soviet_foreign_politics_events.11.a: "พวกเขามีเหตุผลอยูแนนอน"
 NSB_soviet_foreign_politics_events.11.b: "เราจะตัดสินใจเองวาจะปองกันตนเองอยางไรดีที่สุด"
 NSB_soviet_foreign_politics_events.12.t: "[FROM.GetNameDefCap] ตองการขยายปอมปราการชายแดน"
 NSB_soviet_foreign_politics_events.12.desc: "ดวยตระหนักถึงภัยคุกคามที่เพิ่มขึ้นจาก [JAP.GetNameDef] รัฐบาล[FROM.GetAdjective]จึงเสนออยางหนักแนนวาเราควรเริ่มเสริมปอมปราการตามชายแดนที่ติดกับ [JAP.GetNameDef] ทันที พวกเขาสัญญาวาจะสนับสนุนดานวัสดุและการสงกําลังบํารุง เพื่อลดกําลังพลที่พวกเขาตองทุมเทใหการปองกันของเรา"
 NSB_soviet_foreign_politics_events.12.a: "เรายินดีตอนรับความริเริ่มนี้"
 NSB_soviet_foreign_politics_events.12.b: "นี่จะเปนการยกระดับความขัดแยงโดยไมจําเปน"
 NSB_soviet_foreign_politics_events.13.t: "[FROM.GetNameDef] ปฏิเสธแนวทางของ[ROOT.GetAdjective]"
 NSB_soviet_foreign_politics_events.13.desc: "อยางไมคาดคิด รัฐบาล[FROM.GetAdjective]ไดปฏิเสธแนวทางของเราและไมยอมปฏิบัติตามแผนที่เจาหนาที่ของเราเสนอ แทบจะดูเหมือนวา [FROM.GetLeader] มีเจตนาเปนปรปกษตอ [ROOT.GetNameDef]..."
 NSB_soviet_foreign_politics_events.13.a: "เอาจริงนะ [FROM.GetLeader] เปนอะไรไป?"
 NSB_soviet_foreign_politics_events.20.t: "[FROM.GetNameDefCap] สงที่ปรึกษาทางทหารมา"
 NSB_soviet_foreign_politics_events.20.desc: "เพื่อสนับสนุนการตอสูอยางสิ้นหวังของเราในการรักษาประชาธิปไตย [FROM.GetLeader] ไดสงคณะที่ปรึกษาทางทหาร[FROM.GetAdjective]มา ดวยประสบการณมากมายจากความขัดแยงตาง ๆ พวกเขายอมมีคุณคายิ่งในการฟนฟูกองทัพของเราอยางไมตองสงสัย ดวยยุทโธปกรณและยุทธวิธีของพวกเขา พวกเขายังสามารถรับมือกับสิ่งที่เรียกวากองพลอาสาสมัครของมหาอํานาจฟาสซิสตตาง ๆ ในสนามรบไดดวย"
 NSB_soviet_foreign_politics_events.20.a: "เรายืนเคียงบาเคียงไหลกัน!"
 NSB_soviet_foreign_politics_events.30.t: "[FROM.GetNameDefCap] เรียกรองใหคืนอะแลสกา"
 NSB_soviet_foreign_politics_events.30.desc: "หลายสัปดาหกอน การโฆษณาชวนเชื่อของ[FROM.GetAdjective]และสื่อที่เขาขาง[FROM.GetAdjective]เริ่มผลักดันอยางชัดเจนและเปนระบบใหนําประเด็นอะแลสกากลับมาพิจารณาอีกครั้ง โดยหลักแลวพวกเขากลาวหาวาการซื้ออะแลสกาในป 1867 เปนการฉอฉลหรือกระทําภายใตการบีบบังคับ พวกเขายังประกาศวาชาวอะแลสกา ทั้งชนพื้นเมืองและผูตั้งถิ่นฐาน จะมีชีวิตที่ดีกวาอยางชัดเจนหากเปนพลเมืองของ [FROM.GetNameDef]\n\nวันนี้เอกอัครราชทูต[FROM.GetAdjective]ไดยื่นหนังสืออยางเปนทางการ ระบุวาสิ่งที่เรียกวา "รัฐบาลพลัดถิ่นแหงสาธารณรัฐปกครองตนเองอะแลสกา" ไดรองขออยางเปนทางการใหเปนสวนหนึ่งของ [FROM.GetNameDef] และ [FROM.GetLeader] ไดอนุมัติคําขอนั้นแลว ตามที่เขากลาว สิ่งเดียวที่เหลืออยูคือการเจรจารายละเอียดของการถายโอนอํานาจ"
 NSB_soviet_foreign_politics_events.30.a: "เอาดินแดนนํ้าแข็งรกรางนั่นไปเถอะ"
 NSB_soviet_foreign_politics_events.30.b: "เปนมุกตลกที่ดีมากจริง ๆ"
 NSB_soviet_foreign_politics_events.31.t: "อะแลสกาถูกสงคืน"
 NSB_soviet_foreign_politics_events.31.desc: "ในพิธีอยางเปนทางการที่ปอมซิตกา [FROM.GetNameDef] ไดโอนอธิปไตยเหนืออะแลสกากลับคืนใหเรา แมชาวอะแลสกาสวนใหญดูจะมีความรูสึกปนเปตอการโอนครั้งนี้ แตประชาชนในประเทศของเรากําลังเฉลิมฉลอง"
 NSB_soviet_foreign_politics_events.31.a: "ความผิดพลาดอีกขอของพระเจาซารไดรับการแกไขแลว"
 NSB_soviet_foreign_politics_events.32.t: "[FROM.GetNameDefCap] ปฏิเสธ"
 NSB_soviet_foreign_politics_events.32.desc: "รัฐมนตรีวาการกระทรวงการตางประเทศ[FROM.GetAdjective]ไมสนใจแมแตจะตอบขอเรียกรองของเราดวยตนเอง แตกลับสงจดหมายมายังสถานทูตของเรา ลงนามโดยปลัดกระทรวงฝายพัฒนาวัฒนธรรม ระบุวาแมพวกเขาจะเคารพความทะเยอทะยานของเราในการแตงนิยายอิงประวัติศาสตรทั้งเรื่อง แตพวกเขาจะยินดีมากหากเราไมใชชองทางทางการในการทําเชนนั้น"
 NSB_soviet_foreign_politics_events.32.a: "ออ พวกเขาคิดวาเราขูเลนงั้นหรือ?"
 NSB_soviet_foreign_politics_events.32.b: "สิ่งสุดทายที่เราตองการคือดินเยือกแข็งเพิ่มอีก"

 NSB_soviet_foreign_politics_events.150.t: "[FROM.GetNameDefCap] ยอมจํานน"
 NSB_soviet_foreign_politics_events.150.desc: "หลังการประชุมคณะรัฐมนตรีที่ยืดเยื้อไปจนถึงเชามืด [FROM.GetLeader] ไดยอมรับขอเรียกรองของเราอยางเปนทางการ เอกอัครราชทูตของเราประจํา [FROM.GetNameDef] จะดูแลใหรัฐบาล[FROM.GetAdjective]ประสานงานกับเราอยางใกลชิดในทุกประเด็นนโยบายตางประเทศและนโยบายภายในประเทศ"
 NSB_soviet_foreign_politics_events.150.a: "ฉลาดมาก"
 NSB_soviet_foreign_politics_events.151.t: "[FROM.GetNameDefCap] เขารวมฝายของเรา"
 NSB_soviet_foreign_politics_events.151.desc: "หลังการเจรจาภายในรัฐบาล[FROM.GetAdjective]เขาสูทางตัน [FROM.GetLeader] ไดเสนอทางออกแบบประนีประนอม แมพวกเขาจะยินดีรับกองกําลัง[THIS.GetAdjective]บนแผนดิน[FROM.GetAdjective] แตจะไมยอมรับการแทรกแซงใด ๆ ในระบบการปกครองของตน \n\nนอกจากนี้ กองทัพ[FROM.GetAdjective]จะยังคงปฏิบัติหนาที่ตอไป โดยมีนายทหารและพลทหาร[FROM.GetAdjective]ประจําการ และขึ้นตรงตอรัฐบาล[FROM.GetAdjective]เทานั้น อยางไรก็ตาม [FROM.GetLeader] ยินดีหารือเรื่องแผนปองกันรวมกัน"
 NSB_soviet_foreign_politics_events.151.a: "อยางนอยพวกเขาก็จะสูอยูฝายที่ถูกตอง"
 NSB_soviet_foreign_politics_events.152.t: "[FROM.GetNameDefCap] ปฏิเสธ"
 NSB_soviet_foreign_politics_events.152.desc: "ความพยายามแกไขปญหาคางคากับ [FROM.GetNameDef] ทางการทูตของเราดูเหมือนจะลมเหลว เมื่อเอกอัครราชทูตของเราเขาพบ [FROM.GetLeader] เพื่อเจรจาอีกรอบ เขาก็ถูกบอกอยางหวน ๆ วาฝาย[FROM.GetAdjective]ไดแสดงจุดยืนชัดเจนแลว และไมมีเรื่องอะไรใหหารืออีก"
 NSB_soviet_foreign_politics_events.152.a: "พวกเขาเลือกชะตากรรมที่เลวรายกวา"
 NSB_soviet_foreign_politics_events.152.b: "เราจะไมกดดันพวกเขาตอ... ในตอนนี้"
 NSB_soviet_foreign_politics_events.152.c: "เตรียมการรุกราน [FROM.GetNameDef]!"
 NSB_soviet_foreign_politics_events.152.d: "เราตองเตรียมการรุกรานรวมกับฝาย[ENG.GetAdjective]"
 NSB_soviet_foreign_politics_events.153.t: "การรุกรานอิหรานของอังกฤษ-[SOV.GetAdjective]"
 NSB_soviet_foreign_politics_events.153.desc: "เราไดรับหนังสือทางการทูตจาก [FROM.GetNameDef] เสนอปฏิบัติการทางทหารรวมกันตอ [PER.GetNameDef] กองบัญชาการ[FROM.GetAdjective]ยืนยันวาปฏิบัติการนี้จะชวยใหเรายึดแหลงนํ้ามันของอิหรานและเสนทางเสบียงของเราไปยัง [FROM.GetNameDef] ไวได ทั้งยังปองกันไมใหขาศึกที่อาจรุกจาก [TUR.GetNameDef] ผาน [PER.GetName] มุงไปยังแหลงนํ้ามันบากูและ [RAJ.GetNameDef]"
 NSB_soviet_foreign_politics_events.153.a: "เราตองยึดระเบียงเปอรเซียไวใหได!"
 NSB_soviet_foreign_politics_events.153.b: "เราจะเคารพเอกราชของ[PER.GetAdjective]"
 NSB_soviet_foreign_politics_events.153_soviets_alone_tt: "ชาว[FROM.GetAdjective]ตองจัดการกับ [PER.GetNameDef] เอง"
 NSB_soviet_foreign_politics_events.154.t: "การรุกรานอิหรานของอังกฤษ-[SOV.GetAdjective]"
 NSB_soviet_foreign_politics_events.154.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดยื่นหนังสือแจงวา [FROM.GetNameDef] ตกลงที่จะจัดและดําเนินปฏิบัติการทางทหารรวมกันตอ [PER.GetNameDef] ทั้งกองบัญชาการ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตางมั่นใจวานี่จะเปนปฏิบัติการที่รวดเร็วและไดผลตอขาศึกที่มีกําลังนอยกวาและดอยกวาทางเทคโนโลยี ซึ่งจะชวยใหเรายึดแหลงนํ้ามันของอิหรานและเสนทางเสบียงของ[FROM.GetAdjective]ไปยัง [ROOT.GetNameDef] ไวได ทั้งยังปองกันไมใหขาศึกที่อาจรุกจาก [TUR.GetNameDef] ผาน [PER.GetName] มุงไปยังแหลงนํ้ามันบากูและ [RAJ.GetNameDef]"
 NSB_soviet_foreign_politics_events.154.a: "เริ่มการเตรียมการ!"
 NSB_soviet_foreign_politics_events.155.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธ"
 NSB_soviet_foreign_politics_events.155.desc: "หลังการประชุมอันนาเหนื่อยหนายหลายครั้งระหวางนักการทูต[ROOT.GetAdjective]และ[FROM.GetAdjective] [FROM.GetNameDef] ไดตัดสินใจไมเขามาเกี่ยวของกับแผนของเราตอ [PER.GetNameDef] [FROM.GetLeader] ถึงกับกลาบอกเปนนัยวาขอเสนอนี้เปนเพียงความพยายามหาเหตุผลใหความทะเยอทะยานทางดินแดนของเรา \nดูเหมือนวาเราจะตองจัดการกับ [PER.GetNameDef] เอง"
 NSB_soviet_foreign_politics_events.155.a: "ไมเคยพึ่งพาไดเลยจริง ๆ..."
 NSB_soviet_foreign_politics_events.200.t: "[FROM.GetNameDefCap] ยื่นขอเรียกรอง"
 NSB_soviet_foreign_politics_events.158.t: "รัฐบาล[FROM.GetAdjective]ชุดใหม"
 NSB_soviet_foreign_politics_events.158.desc: "หลังการเจรจากับเอกอัครราชทูตของเราไมประสบผล และภายใตแรงกดดันอยางหนักจากสื่อและประชาชน อดีตผูนํารัฐบาล[FROM.GetAdjective]ไดตัดสินใจลาออกจากตําแหนงและจัดการเลือกตั้งใหม ตามที่คาดไว การเลือกตั้งครั้งนี้ชนะโดยพรรคที่ใกลชิดกับผลประโยชนของเรามากกวา นั่นคือ [FROM.GetRulingParty] โดยมี [FROM.GetLeader] เปนผูนํา"
 NSB_soviet_foreign_politics_events.158.a: "ในที่สุดเราก็คาดหวังความรวมมือจาก [FROM.GetNameDef] ไดมากขึ้น"
 NSB_soviet_foreign_politics_events.200.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดยื่นหนังสือเรียกรองใหหารือกับ [THIS.GetLeader] โดยดวน ตามหนังสือดังกลาว รัฐบาล[FROM.GetAdjective]ไมยินดีจะทนตอ "สถานการณความมั่นคงที่ไมแนนอน" ในประเทศของเราอีกตอไป ยังไมชัดเจนวาหมายถึงอะไร แตเห็นไดชัดวาเรามีทางเลือกเพียงสามทาง คือ ยอมใหกองทหาร[FROM.GetAdjective]ประจําการบนแผนดินของเรา เปลี่ยนรัฐบาลของเราเปนรัฐบาลที่ตอบสนองความตองการของ [FROM.GetNameDef] มากกวา หรืออาจถูก [FROM.GetNameDef] โจมตีทางทหาร"
 NSB_soviet_foreign_politics_events.200.a: "เราไมมีทางเลือก"
 NSB_soviet_foreign_politics_events.200.b: "บางทีเราอาจประนีประนอมกันได?"
 NSB_soviet_foreign_politics_events.200.c: "เราจะสูเพื่ออิสรภาพของเรา!"
 NSB_soviet_foreign_politics_events.210.t: "แรงกดดันจาก [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.210.desc: "ดูเหมือนรัฐบาล[FROM.GetAdjective]จะกังวลมากขึ้นเรื่อย ๆ เกี่ยวกับสถานการณทางการทูตของเรา ตลอดสัปดาหที่ผานมา เอกอัครราชทูต[FROM.GetAdjective]ไดพบกับ [THIS.GetLeader] ไมตํ่ากวาหกครั้ง และแทบจะยื่นคําขาดในการเจรจารอบลาสุด \n\nเราตองเขารวมกติกาสัญญาปองกันรวมกับ [FROM.GetNameDef] และยอมรับ "การปรึกษาหารือในระดับหนึ่งในกิจการภายในประเทศ" มิฉะนั้น [FROM.GetNameDef] ก็มีแนวโนมจะใชการแทรกแซงทางทหารในประเทศของเรา"
 NSB_soviet_foreign_politics_events.210.a: "การตอสูคงไรประโยชน"
 NSB_soviet_foreign_politics_events.210.c: "ใหพวกมันมาเลย!"
 NSB_soviet_foreign_politics_events.211.t: "ขอเสนอของฮาคิมอฟ"
 NSB_soviet_foreign_politics_events.211.desc: "การีม ฮาคิมอฟ กงสุลใหญโซเวียต กําลังเรงความพยายามเปนสองเทาในการพัฒนาความสัมพันธโซเวียต-อาระเบียใหอบอุนยิ่งขึ้น ฮาคิมอฟเปนมุสลิมโซเวียตเชื้อสายตาตาร ไดรับความเคารพและมิตรภาพจากอิบน ซะอูด เมื่อเขาขับรถสวนตัวฝาหากระสุนจากเจดดาหไปยังที่ประทับของสุลตานกลางทะเลทราย เพื่อสงมอบหนังสือรับรองอยางเปนทางการใหพระองคเปนกษัตริยแหงฮิญาซและสุลตานแหงนัจดในเดือนกุมภาพันธ 1926 นับแตนั้นมา ชายผูนี้ก็เปนผูสงเสริมหลักของความสัมพันธโซเวียต-อาระเบีย เปรียบไดกับลอวเรนซแหงอาระเบียฉบับโซเวียตโดยแท"
 NSB_soviet_foreign_politics_events.211.a: "ขอเสนอของฮาคิมอฟอาจเปนมิตร แตเราตองระวังความทะเยอทะยานของโซเวียต"

 NSB_soviet_foreign_politics_events.250.t: "[FROM.GetNameDefCap] สงความชวยเหลือทางทหารมา"
 NSB_soviet_foreign_politics_events.250.desc: "ขบวนลําเลียง[FROM.GetAdjective]มาถึงแนวของเราแลว พรอมปนไรเฟลและเสบียงอื่น ๆ ไมมีใครบอกไดวาขบวนตอไปจะมาถึงเมื่อใด เราจึงตองใชของเหลานี้ใหคุมคาที่สุด"
 NSB_soviet_foreign_politics_events.251.t: "[FROM.GetNameDefCap] เตรียมทําสงครามกับ [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.251.desc: "ดูเหมือน [FROM.GetLeader] จะไดขอสรุปวาสงครามกับ [JAP.GetNameDef] หลีกเลี่ยงไมไดและนาจะปะทุขึ้นในอนาคตอันใกล ผูแทน[FROM.GetAdjective]ประจําเมืองหลวงของเราจึงเรงเราใหเราเตรียมพรอมกองกําลังชายแดนและระดมกองทัพเพื่อรับมือการโจมตีของ[JAP.GetAdjective]ที่ใกลจะมาถึง"
 NSB_soviet_foreign_politics_events.251.a: "เราจะพรอม"
 NSB_soviet_foreign_politics_events.252.t: "สงครามกับ [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.252.desc: "สงครามกับ [JAP.GetNameDef] ที่คาดการณกันมานานไดมาถึงแลว เมื่อตนวันนี้ กองกําลัง[FROM.GetAdjective]เริ่มโจมตีที่มั่นของ[JAP.GetAdjective]ทั่วประเทศจีน และบัดนี้ถึงเวลาที่เราจะเขารวมกับพวกเขา เคียงบาเคียงไหลกับพันธมิตร[FROM.GetAdjective] เราจะกวาดลางกองกําลัง[JAP.GetAdjective]ออกจากแผนดินของเรา!"
 NSB_soviet_foreign_politics_events.252.a: "วันแหงการชําระแคนมาถึงแลว!"
 NSB_soviet_foreign_politics_events.260.t: "[FROM.GetNameDefCap] เสนอสันติภาพ"
 NSB_soviet_foreign_politics_events.260.desc: "หลังบุกยึดหมูเกาะคูริลและซาคาลินใตได ผูบัญชาการ[FROM.GetAdjective]ไดเสนอหยุดยิงตามแนวปจจุบัน เพื่อเตรียมทําสนธิสัญญาสันติภาพ โดยไมตองพูดก็รูวาสนธิสัญญาสันติภาพนี้นาจะรับรองอยางนอยหมูเกาะทางเหนือเปนพรมแดนใหม ซึ่งเทากับยกหมูเกาะคูริลและซาคาลินใตใหแก [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.260.a: "เจ็บปวด แตยังพอทนได"
 NSB_soviet_foreign_politics_events.260.b: "สงครามอาจยังพลิกกลับมาเปนฝายเราได"
 NSB_soviet_foreign_politics_events.261.desc: "หลังบุกยึดหมูเกาะคูริลและซาคาลินใตได รวมทั้งยกพลขึ้นบกที่ฮกไกโด ผูบัญชาการ[FROM.GetAdjective]ไดเสนอหยุดยิงตามแนวปจจุบัน เพื่อเตรียมทําสนธิสัญญาสันติภาพ ดูเหมือนวาสนธิสัญญาสันติภาพนี้นาจะรับรองกรรมสิทธิ์ของ[FROM.GetAdjective]เหนือหมูเกาะคูริลและซาคาลิน และใหฮกไกโดอยูภายใตการบริหารของ[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.262.b: "ขอเสนอชางไรสาระสิ้นดี!"
 NSB_soviet_foreign_politics_events.263.t: "[FROM.GetNameDefCap] เสนอเปนพันธมิตร"
 NSB_soviet_foreign_politics_events.263.desc: "ทูตจาก [FROM.GetLeader] ไดเขามาหาเราพรอมขอเสนอที่กลาหาญ รัฐบาล[FROM.GetAdjective]ยินดีลงนามในสนธิสัญญาพันธมิตรกับเรา! แมรายละเอียดยังตองหารือกันตอ แตชัดเจนวาพันธมิตรนี้จะมุงลดหรือขจัดอิทธิพลของ [USA.GetNameDef] ในมหาสมุทรแปซิฟกเปนหลัก ในคราวเดียว มันจะขจัดภัยคุกคามใหญที่สุดตอสถานะของเราในจีน ทั้งยังทําใหกองกําลังจํานวนมากวางไปใชที่อื่นได\n\nแมนายทหารสวนใหญในกองทัพเรือจะกระตือรือรนตอโอกาสนี้ แตนายทหารกองทัพบกจํานวนมากกลับระแวงขอเสนอนี้อยางยิ่ง ดวยเกรงวา [FROM.GetNameDef] จะแทงขางหลังเราทันทีที่เราหันหลังให"
 NSB_soviet_foreign_politics_events.263.a: "นี่จะเปลี่ยนดุลอํานาจอยางมหาศาล"
 NSB_soviet_foreign_politics_events.263.b: "เราไวใจไมไดวาพวกเขาจะรักษาคําพูด"
 NSB_soviet_foreign_politics_events.264.t: "[FROM.GetNameDef] ยอมตามเงื่อนไขสันติภาพของเรา"
 NSB_soviet_foreign_politics_events.264.desc: "หลัง[GetAppropriateSovietProgressInJapan] [FROM.GetLeader] ไดยอมรับขอเสนอสันติภาพของเรา โดยยอมตามขอเรียกรองทางดินแดนของเราเพื่อแลกกับการยุติการสูรบระหวางสองประเทศทันที\nบัดนี้พวกเขาจะโอนเขตการปกครองของ [537.GetName], [555.GetName] และ [536.GetName] ใหแก [ROOT.GetNameDef]"
 NSB_soviet_foreign_politics_events.264.desc_default: "การยึดครองหมูเกาะทางเหนือของ[FROM.GetAdjective]โดย[ROOT.GetAdjective]ดวย[GetAppropriateRedArmyNsName]"
 NSB_soviet_foreign_politics_events.264.desc_hokkaido: "การรุกคืบของ[GetAppropriateRedArmyNsName]ในดินแดนทางเหนือของ[FROM.GetAdjective] รวมถึง [536.GetName]"
 NSB_soviet_foreign_politics_events.264.a: "การตัดสินใจที่ชาญฉลาดของ [FROM.GetLeader]"
 NSB_soviet_foreign_politics_events.265.t: "[FROM.GetNameDef] ปฏิเสธเงื่อนไขสันติภาพของเรา"
 NSB_soviet_foreign_politics_events.265.desc: "[From.GetNameDef] ปฏิเสธขอเสนอสันติภาพของเรา และประกาศวาจะสูตอไปจนกวาการยึดครองดินแดน[FROM.GetAdjective]ของ[ROOT.GetAdjective]จะถูกขจัดสิ้น และสงครามถูกนํากลับมายังดินแดนของเรา"
 NSB_soviet_foreign_politics_events.265.a: "[FROM.GetLeader] มองไมออกหรือวาเรื่องนี้จะจบลงอยางไรสําหรับประเทศของเขา?"
 NSB_soviet_foreign_politics_events.266.t: "กติกาสัญญามิตรภาพ[ROOT.GetAdjective]-[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.266.desc: "รัฐบาล[FROM.GetAdjective]พอใจกับทาทีปรองดองของเรา และไดยอมรับขอเสนอของเรา \nเมื่อไมกี่ชั่วโมงกอน นักการทูต[FROM.GetAdjective]และ[ROOT.GetAdjective]ไดลงนามในสนธิสัญญาไมรุกราน ซึ่งตามคํากลาวของเอกอัครราชทูต[FROM.GetAdjective] อาจนําไปสูยุคใหมแหงความรวมมือในโลกตะวันออก"
 NSB_soviet_foreign_politics_events.266.a: "การประนีประนอมของเราจะใหผลตอบแทนในอนาคต"
 NSB_soviet_foreign_politics_events.267.t: "[FROM.GetNameDef] ปฏิเสธขอเสนอกติกาสัญญาปองกันรวมของเรา"
 NSB_soviet_foreign_politics_events.267.desc: "รัฐบาล[FROM.GetAdjective]ไมประทับใจขอเสนอการปรองดองของเรา และปฏิเสธขอเสนออยางไมไยดี \nดูเหมือนเราตองระวังความทะเยอทะยานของ [FROM.GetLeader] ในตะวันออกไกลตอไป..."
 NSB_soviet_foreign_politics_events.267.a: "เราคงตองปรับแผนใหม..."
 NSB_soviet_foreign_politics_events.268.t: "กติกาสัญญา[ROOT.GetAdjective]-[FROM.GetAdjective]ตอตาน [USA.GetNameDef]"
 NSB_soviet_foreign_politics_events.268.desc: "รัฐบาล[FROM.GetAdjective]แสดงความสนใจอยางแทจริงตอขอเสนอกติกาสัญญาเชิงรุกตอตาน [USA.GetNameDef] ของเรา และนักการทูตของ [FROM.GetLeader] เพิ่งลงนามในขอตกลงที่เสนอไป ขณะนี้กองทัพ[FROM.GetAdjective]กําลังปรับตัวเขากับสถานการณใหม และกองบัญชาการสูงสุดของพวกเขามั่นใจวาเราจะรวมกันเอาชนะ [USA.GetNameDef] และยุติอิทธิพลของพวกเขาบนเวทีโลกไดอยางเด็ดขาด"
 NSB_soviet_foreign_politics_events.268.a: "เราจะสกัดกั้นจักรวรรดินิยม[USA.GetAdjective]!"
 NSB_soviet_foreign_politics_events.269.t: "[FROM.GetNameDef] ปฏิเสธขอเสนอกติกาสัญญาเชิงรุกของเรา"
 NSB_soviet_foreign_politics_events.269.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอของเรา ดูเหมือน [FROM.GetLeader] จะไมสนใจสนธิสัญญาที่เราเสนอใหรวมกองกําลัง[ROOT.GetAdjective]และ[FROM.GetAdjective]ในกติกาสัญญาเชิงรุกตอตาน [USA.GetNameDef]"
 NSB_soviet_foreign_politics_events.269.a: "นาเสียดาย..."




 SOV_decision_will_be_locked_tt: "\nการตัดสินใจนี้จะไมสามารถใชไดอีกตอไป เราสามารถยื่นคําขาดตอประเทศหนึ่งไดเพียงครั้งเดียว"
 SOV_decision_will_remain_available_tt: "\nการตัดสินใจนี้จะยังคงใชได"

 NSB_soviet_foreign_politics_events.270.t: "การขยายทางรถไฟทรานสแคสเปยนของ[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.270.desc: "ทางรถไฟทรานสแคสเปยนของรัสเซียทอดผานเอเชียกลางโดยมีสถานีปลายทางดานตะวันออกอยูที่ทาชเคนต บัดนี้รัฐบาล[FROM.GetAdjective]ตั้งใจจะขยายเสนทางนี้ และไดสงขอเสนอใหเชื่อมเสนทางเขากับเมืองหลวงของเราเพื่อสรางความสัมพันธทางการคาที่ดีขึ้น ดูเหมือนเจาหนาที่[FROM.GetAdjective]สนใจจะขยายเขาสูตลาดซินเจียง และอางวานี่อาจเปนกาวแรกบนเสนทางแหงการพัฒนาและการแลกเปลี่ยนที่เปนประโยชนรวมกัน"
 NSB_soviet_foreign_politics_events.270.a: "เราเห็นดวยกับความริเริ่มนี้!"
 NSB_soviet_foreign_politics_events.270.b: "พอคา[SOV.GetAdjective]จะตองไมมายุมยามในประเทศของเรา"
 NSB_soviet_foreign_politics_events.271.t: "[FROM.GetNameDefCap] ตกลงตามขอเสนอของเรา"
 NSB_soviet_foreign_politics_events.271.desc: "กงสุล[SIK.GetAdjective]ประจําเซมิปาลาตินสคไดติดตอนักการทูตของเราเพื่อแจงวารัฐบาล[SIK.GetAdjective]ยินดีรับความริเริ่มของ[ROOT.GetAdjective]ในการขยายทางรถไฟทรานสแคสเปยนใหเชื่อมกับอุรุมชี เขายังระบุวารัฐบาลมณฑล [SIK.GetNameDef] พรอมพัฒนาความสัมพันธทางเศรษฐกิจและการทูตใหม ๆ กับประเทศของเรา"
 NSB_soviet_foreign_politics_events.271.a: "ประตูสูตลาดเศรษฐกิจใหมเปดออกแลว!"
 NSB_soviet_foreign_politics_events.272.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 NSB_soviet_foreign_politics_events.272.desc: "กงสุล[SIK.GetAdjective]ประจําเซมิปาลาตินสคไดติดตอนักการทูตของเราเพื่อแจงวารัฐบาล[SIK.GetAdjective]ตัดสินใจปฏิเสธความริเริ่มของ[ROOT.GetAdjective]ในการขยายทางรถไฟทรานสแคสเปยนและเชื่อมกับอุรุมชี เมืองหลวงของ[SIK.GetAdjective]"
 NSB_soviet_foreign_politics_events.272.a: "นี่เปนเหตุการณที่ไมคาดคิดและนาเสียดายอยางยิ่ง"
 NSB_soviet_foreign_politics_events.272.b: "พวกเขากําลังเลนกับไฟ!"
 NSB_soviet_foreign_politics_events.273.t: "การสํารวจแรของ[FROM.GetAdjective]ใน [619.GetName]"
 NSB_soviet_foreign_politics_events.273.desc: "ผูแทน[FROM.GetAdjective]ในตี้ฮวาไดยื่นขอเสนอใหมตอเรา เพื่อสํารวจทรัพยากรใน [619.GetName] และปรับปรุงโครงสรางพื้นฐานของภูมิภาคเพื่ออํานวยความสะดวกในการขุดใชประโยชน เพื่อเปนการแลกเปลี่ยน พวกเขาขอใหชดใชแกหนวยงานการคา[FROM.GetAdjective]ดวยการสงออกสินคาโภคภัณฑ เชน ทองคําและแรหายากจากอัลไต"
 NSB_soviet_foreign_politics_events.273.a: "นี่เปนขอตกลงที่เปนประโยชนตอทั้งสองฝาย"
 NSB_soviet_foreign_politics_events.273.b: "พวกเขาแคตองการเพิ่มอิทธิพลของ[FROM.GetAdjective]ในประเทศของเรา"
 NSB_soviet_foreign_politics_events.274.t: "[FROM.GetNameDefCap] ตกลงตามขอเสนอของเรา"
 NSB_soviet_foreign_politics_events.274.desc: "ผูแทน[ROOT.GetAdjective]ในตี้ฮวาไดรับแจงจากนักการทูต[SIK.GetAdjective]วาพวกเขายอมรับขอเสนอของเราในการสํารวจทรัพยากรใน [619.GetName] และปรับปรุงโครงสรางพื้นฐานของภูมิภาคเพื่ออํานวยความสะดวกในการขุดใชประโยชน เพื่อเปนการแลกเปลี่ยน หนวยงานการคา[SIK.GetAdjective]จะไดรับการชดใชดวยการสงออกสินคาโภคภัณฑ เชน ทองคําและแรหายากจากอัลไต"
 NSB_soviet_foreign_politics_events.274.a: "นี่เปดโอกาสทางการคาใหม ๆ!"
 NSB_soviet_foreign_politics_events.275.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 NSB_soviet_foreign_politics_events.275.desc: "ผูแทน[ROOT.GetAdjective]ในตี้ฮวาไดรับแจงจากนักการทูต[SIK.GetAdjective]วารัฐบาลของพวกเขาปฏิเสธขอเสนอของเราที่จะลงทุนในประเทศ ดูเหมือน [SIK.GetNameDef] จะไมสนใจเปดการคาและพัฒนาความสัมพันธทางธุรกิจและการทูตที่ดีขึ้นกับ [ROOT.GetNameDef] อีกตอไป"
 NSB_soviet_foreign_politics_events.275.a: "การตัดสินใจที่ไมฉลาดเลย..."
 NSB_soviet_foreign_politics_events.275.b: "เราไมไดขออนุญาตจริง ๆ หรอก"
 NSB_soviet_foreign_politics_events.276.t: "การสํารวจแรของ[FROM.GetAdjective]ใน [618.GetName]"
 NSB_soviet_foreign_politics_events.276.desc: "ขอเสนอใหมจาก[FROM.GetAdjective]ไดสงถึงนักการทูตของเรา ดูเหมือน [FROM.GetNameDefCap] จะสนใจอยางยิ่งที่จะคนหาแหลงแรและนํ้ามันในภาคเหนือของประเทศเรา และเสนอจะดําเนินการสํารวจแรและขยายสิ่งอํานวยความสะดวกดานโครงสรางพื้นฐานในภูมิภาค เพื่อแลกกับสิทธิ์ในการขุดใชทรัพยากร ผูแทน[FROM.GetAdjective]ยืนยันวาการลงทุนทางอุตสาหกรรมนี้ยอมชวยสงเสริมการขุดทองคําและเงินของชาติเราในภูมิภาคไปดวย"
 NSB_soviet_foreign_politics_events.276.a: "ทรัพยากรเหลานั้นไมสําคัญสําหรับเรา เราตองการทองคํา!"
 NSB_soviet_foreign_politics_events.276.b: "ทรัพยากรในแผนดิน[ROOT.GetAdjective]เปนของ [ROOT.GetName]!"
 NSB_soviet_foreign_politics_events.277.t: "$NSB_soviet_foreign_politics_events.274.t$"
 NSB_soviet_foreign_politics_events.277.desc: "นักการทูต[ROOT.GetAdjective]ใน [SIK.GetNameDef] รายงานวาขอเสนอของเราในการสํารวจแหลงแรและนํ้ามันในภาคเหนือของ [SIK.GetNameDef] ไดรับการยอมรับแลว รัฐบาลมณฑล [SIK.GetName] กระตือรือรนที่จะเห็นการขยายสิ่งอํานวยความสะดวกดานโครงสรางพื้นฐานใน [618.GetName] ซึ่งยอมชวยสงเสริมการขุดทองคําและเงินในภูมิภาค จึงตกลงยอมใหเรามีสิทธิ์ขุดใชทรัพยากรยุทธศาสตรใด ๆ ที่อาจพบใน [618.GetName] เพื่อเปนการชดใชการลงทุนของ[ROOT.GetAdjective]"
 NSB_soviet_foreign_politics_events.277.a: "พวกเขาปฏิเสธขอเสนอแบบนี้ไมไดหรอก!"
 NSB_soviet_foreign_politics_events.278.t: "ความชวยเหลือทางทหารจาก[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.278.desc: "จดหมายจากเอกอัครราชทูต[FROM.GetAdjective]ไดสงถึงนักการทูตของเรา ในจดหมายนั้นเพื่อนบานของเรา ซึ่งดูเหมือนจะกังวลเกี่ยวกับขีดความสามารถทางทหารของ [ROOT.GetName] ไดเสนอความชวยเหลือทางทหารเพื่อฟนฟูกองทัพ[ROOT.GetAdjective] โดยสงยุทโธปกรณและครูฝกมายังประเทศของเรา เราจะไดรับเครื่องบินและอุปกรณการบิน ปนไรเฟลและปนกลสําหรับทหารของเรา จะมีการสรางโรงซอมปนใหญและปอมปราการ และเปดโรงเรียนการบินเพื่อฝกนักบินทองถิ่น เพื่อเปนการแลกเปลี่ยน รัฐบาล[FROM.GetAdjective]ตองการลดอุปสรรคทางการคาและเพิ่มการสงออกสินคาโภคภัณฑของ[ROOT.GetAdjective] เชน ขนแกะ ฝาย ขนสัตว และหนังสัตว"
 NSB_soviet_foreign_politics_events.278.a: "นี่เปนขอเสนอที่ใจกวางจริง ๆ"
 NSB_soviet_foreign_politics_events.278.b: "เราตองตอตานการยึดครองทางเศรษฐกิจของ[FROM.GetAdjective]!"
 NSB_soviet_foreign_politics_events.279.t: "[FROM.GetNameDefCap] ยอมรับความชวยเหลือทางทหารของเรา"
 NSB_soviet_foreign_politics_events.279.desc: "นักการทูตของเราใน [SIK.GetNameDef] แจงวาขอเสนอใหความชวยเหลือทางทหารแก [SIK.GetName] ไดรับการยอมรับจาก [SIK.GetLeader] แลว ดูเหมือนผูนําจีนผูนี้กระตือรือรนที่จะเสริมกําลังกองทัพและการปองกันทางทหาร และเชื่อวาดวยความชวยเหลือจาก[ROOT.GetAdjective] [SIK.GetNameDef] จะสามารถยืนหยัดตอมหาอํานาจที่เปนปรปกษจากทางตะวันออกได"
 NSB_soviet_foreign_politics_events.279.a: "การตัดสินใจที่ชาญฉลาด!"
 NSB_soviet_foreign_politics_events.280.t: "การสนับสนุนการขยายดินแดนจาก[FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.280.desc: "หลังการขยายดินแดนของเราไปทางตะวันออก รัฐบาล[FROM.GetAdjective]แสดงความสนใจที่จะสนับสนุนการเติบโตของเรา และชวยกอสรางโครงสรางพื้นฐานและการปองกันทางทหารในดินแดนที่เราไดมาใหม [FROM.GetNameDefCap] ยังสนใจพัฒนาแหลงนํ้ามันใน [756.GetName] ซึ่งพวกเขาระบุวาอาจเปนกุญแจสําคัญในการรุกทางทหารของเราไปทางตะวันออก \nอีกครั้งที่รัฐบาล[FROM.GetAdjective]ขอผลประโยชนทางการเงินเพิ่มเติมสําหรับหนวยงานการคาของตนในตลาดของเรา และการสงออกที่เพิ่มขึ้นเปนการตอบแทน"
 NSB_soviet_foreign_politics_events.280.a: "เปนขอเสนอที่ยุติธรรม"
 NSB_soviet_foreign_politics_events.280.b: "พอแลว เราไมตองการพวกเขา!"
 NSB_soviet_foreign_politics_events.281.t: "[FROM.GetNameDefCap] ยอมรับความชวยเหลือของเรา"
 NSB_soviet_foreign_politics_events.281.desc: "[SIK.GetLeader] ยอมรับขอเสนอของเราในการใหความชวยเหลือดานการสงกําลังบํารุงและการทหารสําหรับการขยายดินแดนของเขาไปทางตะวันออก เราจะไดรับอนุญาตใหสรางโครงสรางพื้นฐานและการปองกันทางทหารในดินแดนที่พวกเขาเพิ่งไดมา รวมถึงพัฒนาแหลงนํ้ามันใน [756.GetName] เพื่อเปนการตอบแทน รัฐบาล[SIK.GetAdjective]จะใหผลประโยชนทางการเงินที่มากขึ้นแกหนวยงานการคาของเราในตลาดของพวกเขา และจะเพิ่มปริมาณการสงออกมายังประเทศของเรา"
 NSB_soviet_foreign_politics_events.281.a: "เรายินดีชวยเหลือเสมอ!"
 NSB_soviet_foreign_politics_events.282.t: "[SOV.GetNameDefCap] เรียกรองใหสถาปนาสาธารณรัฐโซเวียตแหง [ROOT.GetNameDef] อยางเปนทางการ"
 NSB_soviet_foreign_politics_events.282.desc: "เราไดรับแถลงการณอยางเปนทางการจาก [FROM.GetNameDef] เรียกรองใหรวม [ROOT.GetNameDef] เขาเปนสาธารณรัฐสังคมนิยมโซเวียตอิสระ ที่ขึ้นตรงตอรัฐบาล [FROM.GetNameDef] [FROM.GetLeader] ใหคํามั่นดวยตนเองวาชาติของเราจะไดรับอํานาจปกครองตนเองในระดับหนึ่ง และกองทัพแดงจะพรอมปกปองซินเจียงเสมือนเปนแผนดินโซเวียต ตามที่เขากลาว มาตรการเหลานี้จําเปนตอการสรางความรวมมืออยางมีประสิทธิภาพระหวางสองประเทศในยามยากลําบากนี้ \nเมื่อพิจารณาถึงการลงทุนจํานวนมหาศาลของ [FROM.GetNameDef] ในประเทศของเรา และอิทธิพลของ[FROM.GetAdjective]ที่เพิ่มขึ้นตอเศรษฐกิจของเรา ควรคิดใหรอบคอบกอนสงคําตอบ"
 NSB_soviet_foreign_politics_events.282.a: "เราไมมีทางเลือกอื่น"
 NSB_soviet_foreign_politics_events.282.b: "เราตองหยุดละครฉากนี้!"
 NSB_soviet_foreign_politics_events.283.t: "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.283.desc: "เราไดรับแถลงการณอยางเปนทางการจาก [FROM.GetLeader] ยอมรับการรวมมณฑลซินเจียงของจีนเขาเปนสาธารณรัฐสังคมนิยมโซเวียตอิสระ ที่ขึ้นตรงตอรัฐบาล [ROOT.GetNameDef] โครงการพัฒนาขนาดใหญของเราในภูมิภาคไดแสดงใหเห็นถึงเจตนาดีของ[ROOT.GetAdjective]ในการสรางความสัมพันธอันดีกับพันธมิตรและใหความชวยเหลือเมื่อจําเปน การกระทําเหลานี้ชวยให [FROM.GetLeader] เขาใจวาขอเรียกรองของเราเปนเพียงมาตรการที่จําเปนตอการสรางความรวมมืออยางมีประสิทธิภาพระหวางสองประเทศในยามยากลําบากนี้"
 NSB_soviet_foreign_politics_events.283.a: "ยินดีตอนรับสูสหภาพ สหาย!"
 NSB_soviet_foreign_politics_events.284.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 NSB_soviet_foreign_politics_events.284.desc: "เราไดรับแถลงการณอยางเปนทางการจาก [FROM.GetLeader] ปฏิเสธขอเรียกรองของเราที่จะรวม [FROM.GetNameDef] เขาเปนสาธารณรัฐสังคมนิยมโซเวียตอิสระ ดูเหมือนการลงทุนมหาศาลที่เราทุมเทเพื่อพัฒนาภูมิภาคและชวยเหลือเพื่อนบานชาวจีนของเราจะไมมีความหมายใด ๆ สําหรับ [FROM.GetLeader] ซึ่งยังคงมอง [ROOT.GetNameDef] ดวยความไมไววางใจ"
 NSB_soviet_foreign_politics_events.284.a: "พวกเขากําลังขัดขวางความรวมมือระหวางประเทศของเรา"
 NSB_soviet_foreign_politics_events.284.b: "เราจะไมปลอยใหการหยามเกียรตินี้ลอยนวล!"
 NSB_soviet_foreign_politics_events.285.t: "[SOV.GetName] ใกลลมสลาย"
 NSB_soviet_foreign_politics_events.285.desc: "หลังประสบความสูญเสียอยางหนักในสงคราม ดูเหมือนวาการลมสลายของ [SOV.GetNameDef] อาจใกลกวาที่พวกเขาตองการใหเราคิด สมาชิกรัฐบาลของเราหลายคนยืนยันวาประเทศของเรายอมถูกคุกคามจากสถานการณนี้อยางหลีกเลี่ยงไมได และเสนอใหเรายกเลิกขอตกลงกับ[SOV.GetAdjective]ทันที แลวหันไปกระชับความสัมพันธกับเจาหนาที่จีนแทน พวกเขาระบุวาหากเราจะรับประกันความปลอดภัยของ [ROOT.GetNameDef] เราตองทําทุกวิถีทางเพื่อหาพันธมิตรที่ทรงพลังซึ่งสามารถสนับสนุนเราได และเมื่อพิจารณาสถานการณปจจุบันแลว [SOV.GetNameDef] คงไมสามารถตอบโตอะไรได"
 NSB_soviet_foreign_politics_events.285.a: "เราจะรวมกันตอตานศัตรู!"
 NSB_soviet_foreign_politics_events.285.b: "ถึงเวลาหามิตรใหมที่อื่นแลว!"
 NSB_soviet_foreign_politics_events.286.t: "ซินเจียงถูกคุกคามจากความสูญเสียของโซเวียตในสงคราม"
 NSB_soviet_foreign_politics_events.286.desc: "เมื่อวานนี้ ในแถลงการณอยางเปนทางการ [SIK.GetLeader] ไดยืนยันอีกครั้งถึงความภักดีของซินเจียงตอ [ROOT.GetNameDef] และความปรารถนาสวนตัวที่จะสานตอความรวมมือระหวางสองประเทศ อยางไรก็ตาม เปนที่ชัดเจนวากลุมที่ปลุกปนความตื่นตระหนกใน [SIK.GetNameDef] ไดทําลายภาพลักษณของ [ROOT.GetNameDef] อยางรายแรง และการสนับสนุน [SIK.GetLeader] ภายใน [SIK.GetRulingParty] ก็ไดรับผลกระทบอยางหนัก"
 NSB_soviet_foreign_politics_events.286.a: "ชางนาเวทนาเสียจริง..."
 NSB_soviet_foreign_politics_events.286.b: "เราตองจัดการกับพวกทรยศปากพลอยเหลานั้น!"
 NSB_soviet_foreign_politics_events.287.t: "[SIK.GetNameDefCap] ถอนตัวจาก[ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.287.desc: "เมื่อวานนี้ [SIK.GetLeader] ไดออกแถลงการณอยางเปนทางการประกาศใหซินเจียงแยกตัวออกจาก[ROOT.GetFactionName] และยกเลิกขอตกลงทั้งหมดกับฝาย[ROOT.GetAdjective]โดยมีผลทันที \nตามสุนทรพจนของเขา เมื่อ[ROOT:GetName]ใกลจะลมสลายและถูกศัตรูลอมไวทั้งทางตะวันออกและตะวันตก ก็ถึงเวลาแลวที่ซินเจียงจะกระชับความสัมพันธกับเพื่อนบานและพี่นองชาวจีนทางตะวันออก เพื่อเผชิญหนากับผูรุกรานจากตางชาติ"
 NSB_soviet_foreign_politics_events.287.a: "ปลอยพวกเขาไป! เรามีเรื่องเรงดวนกวานี้ตองจัดการ"
 NSB_soviet_foreign_politics_events.287.b: "เราตองทําใหพวกเขาชดใช!"

 SOV_sinikiang_influence_cg_tt_sik: "§Y[SOV.GetFlag][SOV.GetNameDefCap]§! จะไดรับโบนัสสินคาอุปโภคบริโภค §Y-1.0%§! จากขอตกลงนี้"
 SOV_sinikiang_influence_cg_tt_sov: "$SOV_modify_fyp_ns_intro$ \nโรงงานสินคาอุปโภคบริโภค: §Y-1.0%§!"
 SOV_sinkiang_when_project_finishes_tt: "\nผลเมื่อโครงการเสร็จสิ้น:"

 NSB_soviet_soviet_german_trade_agreement.1.t: "ขอตกลงการคาโซเวียต-เยอรมัน"
 NSB_soviet_soviet_german_trade_agreement.1.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดติดตอนักการทูตของเราเพื่อเสนอขอตกลงการคาระหวางสองประเทศ ตามขอเสนอ [FROM.GetNameDef]จะสงวัตถุดิบ เชน ธัญพืช ฝาย นํ้ามัน สินแรโลหะ และยาง มาใหเรา สวนชาว[FROM.GetAdjective]จะไดรับเรือลาดตระเวนชั้นฮิพเพอรที่ยังสรางไมเสร็จ แบบแปลนเรือรบอื่น ๆ ปนใหญเรือขนาดหนัก และตัวอยางอากาศยานของ[ROOT.GetAdjective] \nขอตกลงนี้จะชวยเราในการทําสงครามกับชาติศัตรูในยุโรปอยางไมตองสงสัย ทําใหเรามีหนทางหลบเลี่ยงการปดลอมของ[GetTradeAgreementBlockadeWarPeace]"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng: "ฝาย[ENG.GetAdjective]"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war: "ฝายศัตรู"
 NSB_soviet_soviet_german_trade_agreement.1.desc_peace: "ศัตรูที่อาจเกิดขึ้น"
 NSB_soviet_soviet_german_trade_agreement.1.a: "เราตองการวัตถุดิบ"
 NSB_soviet_soviet_german_trade_agreement.1.b: "เราจะไมแบงปนความลับทางนาวีใหพวกเขา!"
 NSB_soviet_soviet_german_trade_agreement.2.t: "[GER.GetNameDefCap] ลงนามใน$NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.2.desc: "นักการทูต[FROM.GetAdjective]แจงเราวาพวกเขาตกลงรับขอเสนอของเราแลว สองประเทศไดทําสนธิสัญญาการคาซึ่ง[ROOT.GetNameDef]จะสงวัตถุดิบ เชน ธัญพืช ฝาย นํ้ามัน สินแรโลหะ และยาง ใหแก[FROM.GetNameDef] แลกกับการที่เราจะไดรับเรือลาดตระเวนชั้นฮิพเพอรที่ยังสรางไมเสร็จ แบบแปลนเรือรบอื่น ๆ ปนใหญเรือขนาดหนัก และตัวอยางอากาศยานของ[FROM.GetAdjective] \nขอตกลงนี้จะชวยเราพัฒนาเทคโนโลยีทางทหารสมัยใหมไดอยางแนนอน"
 NSB_soviet_soviet_german_trade_agreement.2.a: "กองเรือแดงจะไดประโยชนจากสิ่งนี้"
 NSB_soviet_soviet_german_trade_agreement.3.t: "[GER.GetNameDefCap] ปฏิเสธ$NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.3.desc: "หลังจากเอกอัครราชทูตของเราพยายามหลายครั้งเพื่อโนมนาวเจาหนาที่[FROM.GetAdjective]ถึงผลประโยชนรวมกันของสนธิสัญญาการคาระหวางสองประเทศ นักการทูต[FROM.GetAdjective]เพิ่งแจงเราวาพวกเขาไมสนใจจะทําขอตกลงการคากับ[ROOT.GetNameDef]"
 NSB_soviet_soviet_german_trade_agreement.3.a: "พวกโงหัวรั้น!"

 NSB_soviet_policies_of_collective_security.1.t: "[FROM.GetNameDefCap] เสนอสนธิสัญญาชวยเหลือซึ่งกันและกัน"
 NSB_soviet_policies_of_collective_security.1.desc: "ดวยตระหนักถึงภัยคุกคามที่ทั้งสองชาติกําลังเผชิญ รัฐบาล[FROM.GetAdjective]ไดเสนอสนธิสัญญาชวยเหลือซึ่งกันและกัน ภายใตเงื่อนไขนี้ ทั้งสองฝายจะไมกระทําการเปนปรปกษตอกัน\n\nประเด็นที่ยังคางคาอยูคือ[POL.GetNonIdeologyName]ตั้งอยูระหวางสองชาติของเรา ความพยายามใด ๆ ของฝายหนึ่งที่จะเขาชวยเหลืออีกฝายจําเปนตองผานโปแลนด นักการทูตบางคนเชื่ออยางแรงกลาวาเราควรรวมโปแลนดเขาไวในสนธิสัญญานี้ เพื่อใหมั่นใจวาเราจะชวยเหลือกันไดโดยตรงจริง ๆ"
 NSB_soviet_policies_of_collective_security.1.a: "เราจะตกลงตามเงื่อนไขเดิม"
 NSB_soviet_policies_of_collective_security.1.b: "เราควรติดตอโปแลนด"
 NSB_soviet_policies_of_collective_security.1.c: "นี่ไมใชผลประโยชนของเรา"
 NSB_soviet_policies_of_collective_security.2.t: "[FROM.GetNameDefCap] ตกลงลงนามในสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.2.desc: "รัฐบาล[FROM.GetNameDef]ไดตกลงในหลักการตอสนธิสัญญาชวยเหลือซึ่งกันและกันที่เราเสนอ คณะนักการทูตไดเดินทางมาถึงเพื่อหารือรายละเอียดในการดําเนินการแลว"
 NSB_soviet_policies_of_collective_security.2.a: "เราจะยืนหยัดเคียงขางกัน"
 NSB_soviet_policies_of_collective_security.3.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 NSB_soviet_policies_of_collective_security.3.desc: "หลังการเจรจาอันตึงเครียดยาวนานหลายคืน คณะผูแทน[FROM.GetAdjective]ก็เดินทางกลับไปโดยไมมีการลงนามสนธิสัญญาใด ๆ แมนักการทูตบางคนยังหวังวาสนธิสัญญาอาจกอบกูได แตดูเหมือนรัฐบาล[FROM.GetAdjective]จะถือวาเรื่องนี้จบลงแลว"
 NSB_soviet_policies_of_collective_security.3.a: "ชางเปนการตัดสินใจที่สายตาสั้นเหลือเกิน"
 NSB_soviet_policies_of_collective_security.4.t: "[FROM.GetNameDefCap] ผลักดันใหรวม[POL.GetAdjective]เขาในสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.4.desc: "แมโดยพื้นฐานจะเปดรับสนธิสัญญาชวยเหลือซึ่งกันและกัน แตรัฐบาล[FROM.GetAdjective]ก็มีขอกังวลเกี่ยวกับสถานะของโปแลนด ดูเหมือนจุดยืนของรัฐบาล[FROM.GetAdjective]คือโปแลนดตองถูกรวมไวในสนธิสัญญาดวย \n\nนี่เปนประเด็นที่คณะผูแทน[FROM.GetAdjective]ไมยอมออนขอ และไดขอใหเราเชิญ[POL.GetNonIdeologyName]เขารวมสนธิสัญญาอยางเปนทางการ"
 NSB_soviet_policies_of_collective_security.4.a: "พวกเขาก็มีเหตุผล"
 NSB_soviet_policies_of_collective_security.4.b: "ขอเสนอนี้มีไวระหวางเราเทานั้นก็ดวยเหตุผล"
 NSB_soviet_policies_of_collective_security.5.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะรวม[POL.GetNameDef]เขาในสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.5.desc: "ความพยายามของเราที่จะโนมนาวคณะผูแทน[FROM.GetAdjective]ถึงความจําเปนในการรวม[POL.GetNonIdeologyName]เขาในสนธิสัญญาดูจะไมคอยเกิดผล \n\nพวกเขาเห็นวาประเด็น[POL.GetNonIdeologyName]ไมเกี่ยวของกับสนธิสัญญาที่กําลังพิจารณา และปฏิเสธอยางไมไยดีที่จะหารือเรื่องนี้ตอ ตอนนี้เราตองตัดสินใจวาจะยุติการเจรจาเพียงเทานี้ หรือเดินหนาตอดวยทางออกแบบสนธิสัญญา "ขนาดเล็ก""
 NSB_soviet_policies_of_collective_security.5.a: "เรื่องนี้ไมควรทําใหสนธิสัญญาลม"
 NSB_soviet_policies_of_collective_security.5.b: "ถาเชนนั้นขอตกลงก็เปนอันยกเลิก"
 NSB_soviet_policies_of_collective_security.6.t: "[FROM.GetNameDefCap] ตกลงรวม[POL.GetNameDef]เขาในสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.6.desc: "หลังการเจรจาอีกรอบ คณะผูแทน[FROM.GetAdjective]ตกลงที่จะรวม[POL.GetNonIdeologyName]เขาในสนธิสัญญา ทันทีที่รายละเอียดลงตัว เราจะสงสารถึงรัฐบาล[POL.GetAdjective] เชิญใหเขารวมสนธิสัญญาภายใตเงื่อนไขเดียวกับเรา"
 NSB_soviet_policies_of_collective_security.6.a: "เอาละ ไปคุยกับชาวโปแลนดกันเถอะ"
 NSB_soviet_policies_of_collective_security.7.t: "สนธิสัญญาชวยเหลือซึ่งกันและกัน[SOV.GetAdjective]-[FROM.GetAdjective]"
 NSB_soviet_policies_of_collective_security.7.desc: "เอกอัครราชทูต[FROM.GetAdjective]แจงเราวาประเทศของเขาเพิ่งลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันกับ[SOV.GetNameDef] ภายใตเงื่อนไขของสนธิสัญญา ทั้งสองฝายจะไมโจมตีกัน และจะพยายามสนับสนุนอีกฝายในยามสงคราม \n\nเขากลาวตอวารัฐบาลของเขายอมลงนามในสนธิสัญญานี้ภายใตขอกําหนดชัดแจงวาเราจะไดรับอนุญาตใหเขารวมดวยหากเราตองการ"
 NSB_soviet_policies_of_collective_security.7.a: "เรายินดีเปนฝายที่สามในเรื่องนี้"
 NSB_soviet_policies_of_collective_security.7.b: "พวกเขาไมรูหรือวาโซเวียตไวใจไมได?"
 NSB_soviet_policies_of_collective_security.8.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะลงนามในสนธิสัญญาที่ไมรวม[POL.GetNameDef]"
 NSB_soviet_policies_of_collective_security.8.desc: "ความพยายามเจรจาสนธิสัญญากับ[FROM.GetNameDef]ของเราจบลงดวยความลมเหลว ดูเหมือนวาประเด็น[POL.GetNonIdeologyName]และการรวมเขาในสนธิสัญญาเปนเรื่องสําคัญยิ่งที่ไมอาจหาขอประนีประนอมได"
 NSB_soviet_policies_of_collective_security.8.a: "ชางเปนความภักดีที่ผิดที่ผิดทาง"
 NSB_soviet_policies_of_collective_security.9.t: "[FROM.GetNameDefCap] ตกลงลงนามในสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.9.desc: "หลังการเจรจาเพิ่มเติม รัฐบาล[FROM.GetAdjective]ตกลงลงนามในสนธิสัญญา แมกอนหนานี้จะมีขอกังขาเรื่องการไมรวมโปแลนด แมคณะผูแทน[FROM.GetAdjective]ยังมีเสียงบนอยูบาง แตก็ดูเต็มใจที่จะดําเนินการใหสัตยาบันสนธิสัญญาตอไป"
 NSB_soviet_policies_of_collective_security.9.a: "พวกเขาเขาใจเหตุผลแลว"
 NSB_soviet_policies_of_collective_security.10.t: "[FROM.GetNameDefCap] ปฏิเสธสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.10.desc: "ในความพลิกผันที่ไมคาดคิด รัฐบาลของ[POL.GetLeader]ปฏิเสธที่จะเขารวมสนธิสัญญาที่เสนอ แมเหตุผลอยางเปนทางการคือไมมีภัยคุกคามที่นาเชื่อถือ แตเปนการสวนตัว รัฐบาล[POL.GetAdjective]ชี้วาโซเวียตอาจกระตือรือรนที่จะยกทัพเขาโปแลนดเพื่อปกปอง - แตก็คงไมอยากถอนทัพออกไปในภายหลังเชนกัน"
 NSB_soviet_policies_of_collective_security.10.a: "อยางนอยพวกเขาก็ไดรับขอเสนอแลว"
 NSB_soviet_policies_of_collective_security.11.t: "[POL.GetNameDefCap] ปฏิเสธที่จะเขารวมสนธิสัญญาชวยเหลือซึ่งกันและกันของเรา"
 NSB_soviet_policies_of_collective_security.11.desc: "รัฐบาล[POL.GetAdjective]ปฏิเสธที่จะเขารวมสนธิสัญญาชวยเหลือซึ่งกันและกัน โดยอางวาไมมีภัยคุกคามที่นาเชื่อถือตอพวกเขา และไมตองการพัวพันกับพันธมิตรใด ๆ\n\nในแวดวงการทูตมีขาวลือหนาหูวานี่เปนเพียงการรักษาหนา และเหตุผลที่แทจริงคือพวกเขาไมไวใจเรา"
 NSB_soviet_policies_of_collective_security.11.a: "เสียเวลาเปลาแท ๆ"
 NSB_soviet_policies_of_collective_security.12.t: "[FROM.GetNameDefCap] ตกลงเขารวมสนธิสัญญาชวยเหลือซึ่งกันและกันของเรา"
 NSB_soviet_policies_of_collective_security.12.desc: "รัฐบาล[FROM.GetAdjective]ไดตกลงในหลักการที่จะเขารวมสนธิสัญญา แมยังมีรายละเอียดบางประการที่ตองหารือ แตก็จะไมเปนอุปสรรคตอการใหสัตยาบันสนธิสัญญา"
 NSB_soviet_policies_of_collective_security.12.a: "สิ่งนี้จะทําใหพันธมิตรแข็งแกรงยิ่งขึ้น"
 NSB_soviet_policies_of_collective_security.13.desc: "เมื่อประเด็น[POL.GetNonIdeologyName]ไดรับการแกไขแลว รัฐบาล[FROM.GetAdjective]ก็พรอมดําเนินการใหสัตยาบันสนธิสัญญาอยางเปนทางการ ภายใตเงื่อนไขที่ตกลงกันไวแตแรก"
 NSB_soviet_policies_of_collective_security.13.a: "เอาละ ลงนามกันเถอะ!"

 NSB_soviet_academy_of_sciences.1.t: "การกอตั้งสถาบันวิทยาศาสตร[THIS.GetAdjective]"
 NSB_soviet_academy_of_sciences.1.desc: "ในพิธีอันหรูหราวันนี้ [THIS.GetLeader] และเอกอัครราชทูต[SOV.GetAdjective]ไดรวมกันเปดสถาบันวิทยาศาสตร[THIS.GetAdjective]อยางเปนทางการ สถาบันแหงใหมนี้ใชสถาบันวิทยาศาสตร[SOV.GetAdjective]เปนตนแบบ และจะชวยใหเราทําการวิจัยขั้นสูงไดในระดับสูงมาก ภายใตการชี้แนะของผูเชี่ยวชาญจาก[SOV.GetNameDef]"
 NSB_soviet_academy_of_sciences.1.a: "กาวกระโดดครั้งใหญ!"

 NSB_soviet_atomic_bomb_project.1.t: "สายลับกลับมาพรอมความลับนิวเคลียร"
 NSB_soviet_atomic_bomb_project.1.desc: "สายลับคนหนึ่งของเราซึ่งไดรับมอบหมายใหแทรกซึมโครงการวิจัยนิวเคลียรของตางชาติไดกลับมายังสถานทูตของเรา พรอมเอกสารลับสุดยอดจํานวนมากเกี่ยวกับสิ่งตาง ๆ ที่นักวิทยาศาสตรกําลังศึกษาอยู ตั้งแตแบบเครื่องหมุนเหวี่ยงไปจนถึงการคํานวณขนาดหัวรบ ขอมูลเหลานี้จะมีคายิ่งในการผลักดันโครงการอาวุธนิวเคลียรของเราเองอยางไมตองสงสัย"
 NSB_soviet_atomic_bomb_project.1.a: "ชัยชนะอีกครั้งเพื่อสันติภาพ"
 NSB_soviet_atomic_bomb_project.2.t: "สายลับถูกจับที่สถานที่นิวเคลียร"
 NSB_soviet_atomic_bomb_project.2.desc: "สายลับคนหนึ่งของเราซึ่งไดรับมอบหมายใหแทรกซึมโครงการอาวุธนิวเคลียรถูกจับกุมวันนี้ขณะพยายามออกจากสถานที่ที่มีการรักษาความปลอดภัย การคนกระเปาของเขาพบเอกสารลับจํานวนหนึ่ง โชครายที่เห็นไดชัดวาเขาสารภาพวาทํางานใหเรา เพราะเอกอัครราชทูตของเราถูกเรียกตัวไปหารือดวนและถูกยื่นหลักฐานตอหนา"
 NSB_soviet_atomic_bomb_project.2.a: "ไรสาระ! เราไมมีความเกี่ยวของใด ๆ กับบุคคลนี้"
 NSB_soviet_atomic_bomb_project.3.t: "การรั่วไหลดานความปลอดภัยที่สถานวิจัยนิวเคลียร"
 NSB_soviet_atomic_bomb_project.3.desc: "เมื่อชวงเชาวันนี้ พนักงานคนหนึ่งของสถานวิจัยนิวเคลียรของเราถูกเรียกตรวจตามปกติ การคนขาวของอยางละเอียดพบชองลับในกระเปาของเขา ภายในชองนั้นมีเอกสารลับระดับสูงจํานวนหนึ่งเกี่ยวกับเทคโนโลยีนิวเคลียร \n\nผูตองสงสัยถูกสงตัวใหหนวยตอตานขาวกรอง และไดสารภาพทั้งหมดแลว ดูเหมือนวาเขาติดตอกับสถานทูต[SOV.GetAdjective] และไดรับมอบหมายใหแทรกซึมโครงการวิจัยนิวเคลียรของเราเพื่อขโมยพิมพเขียวและขอมูลการวิจัยอื่น ๆ"
 NSB_soviet_atomic_bomb_project.3.a: "อยางนอยก็ไมมีอะไรถูกขโมยไป"
 

 NSB_soviet_policies_of_collective_security_agreed_effects_tt: "หากสนธิสัญญาเกิดขึ้นจริง เราจะยอมรับเงื่อนไขตอไปนี้:"
 NSB_soviet_policies_of_collective_security_condition_effects_tt: "หากทั้งรัฐบาล[FROM.GetAdjective]และรัฐบาล[POL.GetAdjective]ยินยอมใหรวม[POL.GetNameDef]เขาในสนธิสัญญา ผลเดียวกันจะมีตอ[POL.GetNameDef]ดวย"
 NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt: "เราจะปฏิเสธขอเสนอของ[FROM.GetAdjective]ที่จะรวม[POL.GetNameDef]เขาในสนธิสัญญา [FROM.GetNameDefCap]จะตองเลือกระหวางยอมรับขอเสนอเดิมของเรา หรือลมเลิกแนวคิดขอตกลงรวมวาดวยการชวยเหลือซึ่งกันและกัน"
 NSB_soviet_policies_of_collective_security_tt: "หากรัฐบาล[POL.GetAdjective]ยินยอม [POL.GetNameDef]จะถูกรวมเขาในขอตกลงรวมวาดวยการชวยเหลือซึ่งกันและกัน รวมกับ[FROM.GetNameDef]และ[ROOT.GetNameDef]"
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! และ [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! จะสละการอางสิทธิ์หรือเปาหมายสงครามใด ๆ ตอกัน ลงนามสนธิสัญญาไมรุกราน และรับประกันเอกราชใหแกกันและกัน"
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! และ [POL.GetFlag]§Y[POL.GetNameDefCap]§! จะสละการอางสิทธิ์หรือเปาหมายสงครามใด ๆ ตอกัน ลงนามสนธิสัญญาไมรุกราน และรับประกันเอกราชใหแกกันและกัน"

 NSB_soviet_comecon.1.t: "โครงการอุตสาหกรรมของ[FROM.GetAdjective]ใน[ROOT.GetNameDef]"
 NSB_soviet_comecon.1.desc: "ในฐานะสวนหนึ่งขององคการประสานงานทางเศรษฐกิจโคมีคอน รัฐบาล[FROM.GetAdjective]ไดเริ่มลงทุนในเศรษฐกิจของเรา ซึ่งจะชวยใหเศรษฐกิจของเราเติบโตอยางมากในอีกไมกี่เดือนขางหนา"
 NSB_soviet_comecon.1.a: "นี่แหละคือการชวยเหลือซึ่งกันและกันในทางปฏิบัติ!"
 NSB_soviet_comecon.2.t: "โครงการพัฒนาการทหารของ[FROM.GetAdjective]สําหรับประเทศสมาชิกโคมีคอน"
 NSB_soviet_comecon.2.desc: "รัฐบาล[FROM.GetAdjective]ไดตัดสินใจจัดการซอมรบและการฝกชุดใหญ ซึ่งจะเสริมขีดความสามารถทางทหารของเราและทําใหเราปฏิบัติการรวมกับพันธมิตรอื่น ๆ ได เราควรใชประสบการณที่ไดจากการฝกเหลานี้ในการปฏิรูปกองทัพที่จําเปน"
 NSB_soviet_comecon.2.a: "เราพรอมจะสูเคียงขางทาน สหาย!"
 NSB_soviet_comecon_effect_duration_tt: "ผลเหลานี้จะคงอยู §Y180§! วัน หลังจากนั้นจิตวิญญาณแหงชาติของเราจะกลับไปเปนแบบเดิม"
 NSB_soviet_spanish_civil_war.1.t: "[?SOV.SOV_spanish_general.GetName] เขารวมกับ[ROOT.GetNameDef]"
 NSB_soviet_spanish_civil_war.1.desc: "เมื่อวานนี้ เรือลําหนึ่งเดินทางมาถึงครอนชตัดท พรอมผูลี้ภัยชาวสเปนเต็มลําที่หนีออกนอกประเทศ เนื่องจากรัฐบาลของพวกเขาใกลลมสลายในสงครามกลางเมือง พวกเขาไดรับการตอนรับจากคณะผูแทนของเราจาก[ROOT.Capital.GetName] ซึ่งดูแลคณะนี้ที่สวนใหญเปนเด็ก แตก็มีนักการเมืองและทหารสเปนอยูไมกี่คน \nในหมูพวกเขามีนักสูคอมมิวนิสตผูยิ่งใหญ [?SOV.SOV_spanish_general.GetName] ซึ่งผูแทนของเราไดพูดคุยดวย อดีตนายทหารกองทัพสเปนผูนี้กลาววาชาวสเปนมายัง[ROOT.GetNameDef]เพื่อเยียวยาบาดแผล และแสวงหาความเปนปกแผนในภารกิจปลดปลอยประชาชนชาวสเปน และขอใหรัฐบาล[ROOT.GetAdjective]รับรองยศทหารของเขาและใหเขากลับเขารับราชการ เพื่อที่เขาจะไดสูรบกับลัทธิฟาสซิสตและจักรวรรดินิยมตอไป"
 NSB_soviet_spanish_civil_war.1.a: "เรายินดีตอนรับผูลี้ภัยชาวสเปนทุกคน"
 NSB_soviet_spanish_civil_war.2.t: "กองพลนอยมารกซิสตนานาชาติเดินทางถึง[ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.2.desc: "ผูเห็นอกเห็นใจจากสหภาพโซเวียตไดจัดการระดมพลและฝกสมาชิกกองพลนอยนานาชาตินับรอยคน ผูสนับสนุนอุดมการณของเราที่จะชนะสงครามโดยไมละทิ้งการปฏิวัติ สมาชิกผูกลาหาญของชนชั้นกรรมาชีพและชาวนานานาชาติเหลานี้พรอมสละชีพในสงครามตอตานฟาสซิสตและชนชั้นกระฎมพี"
 NSB_soviet_spanish_civil_war.2.a: "นี่คือจุดเริ่มตนของการปฏิวัติโลก!"
 NSB_soviet_spanish_civil_war.3.t: "หนวยคอมมานโดโซเวียตเดินทางถึง[ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.3.desc: "หนวยคอมมานโดโซเวียตฝายตอตานสตาลินไดลักลอบเดินทางมาถึงบารเซโลนา พรอมกับสายลับและเจาหนาที่ที่ผานการฝกมาอยางดีจํานวนหนึ่งซึ่งเห็นใจอุดมการณของเรา ตามขอมูลจากผูติดตอของเราในสหภาพโซเวียต กําลังเสริมเหลานี้จะชวยใหเราจัดตั้งกองพลนอยชั้นยอดเพื่อเจาะแนวขาศึกหรือหยุดยั้งการรุกของขาศึกได รวมทั้งนําสายลับและนายทหารผูชํานาญเขามาอยูในสายการบังคับบัญชาของเรา"
 NSB_soviet_spanish_civil_war.3.a: "เราจะใชพวกเขาใหเกิดประโยชนสูงสุด"
 NSB_soviet_spanish_civil_war.4.t: "การปราศรัยตอมวลชนที่โซเวียตจัดขึ้น"
 NSB_soviet_spanish_civil_war.4.desc: "สมาชิกผูมีเสนหของขบวนการฝายคานฝายขวาในสหภาพโซเวียต รวมกับนักพูดทองถิ่นจาก POUM, CNT และ FAI ไดดําเนินการรณรงคเผยแพรขอมูลและปลุกระดมเพื่อจุดประกายจิตวิญญาณปฏิวัติของมวลชนกรรมาชีพและชาวนาแหง[ROOT.GetNameDef] ดวยสุนทรพจนอันรอนแรงในทองถิ่นนับไมถวน มวลชนไดพัฒนาจิตสํานึกทางชนชั้นอยางแข็งแกรง และพรอมทุมเทใหอุดมการณมากกวาที่เคย"
 NSB_soviet_spanish_civil_war.4.a: "หากเราสามัคคี เราจะมีชัย!"
 NSB_soviet_spanish_civil_war.5.t: "สายลับโซเวียตแทรกซึมกองบัญชาการฝายสตาลิน"
 NSB_soviet_spanish_civil_war.5.desc: "ผูชวยทูตทหารและที่ปรึกษาโซเวียตชุดใหมเพิ่งเดินทางมาถึงสเปนเพื่อชวยเหลือรัฐบาลสาธารณรัฐกระฎมพี \nในกลุมนี้มีสายลับโซเวียตฝายตอตานสตาลินหลายคนแฝงตัวมาในฐานะผูชวยของที่ปรึกษาทางทหารที่ [FROM.GetLeader] สงมา \nสายลับเหลานี้ไดติดตอและชักชวนเจาหนาที่ ทหาร สมาชิกกองพลนอยนานาชาติ และทหารอาสาที่เห็นใจ POUM ซึ่งกําลังรบอยูในหนวยของฝายสาธารณรัฐกระฎมพีจํานวนมาก จนเกิดเปนเครือขายผูใหขาวอันนาทึ่งที่ทําใหเราไดขอมูลโดยตรงเกี่ยวกับการเคลื่อนไหวที่สายการบังคับบัญชาของขาศึกวางแผนไว"
 NSB_soviet_spanish_civil_war.5.a: "ถึงเวลาปดฉากแลว!"
 NSB_soviet_spanish_civil_war.6.t: "การปฏิวัติที่มีชัยในสเปน"
 NSB_soviet_spanish_civil_war.6.desc_1: "เชานี้ องคกรของเราไดรับจดหมายที่ [SPC.GetLeader] เขียนดวยตนเอง ในจดหมายนั้น ผูนําสเปนประกาศวาประชาชนชาวสเปนจะไมมีวันลืมการสนับสนุนที่ไดรับจากนักปฏิวัติโซเวียตที่แทจริง และเมื่อถึงเวลาที่เราตองเผชิญหนากับมหาศิลาแหงทรราชที่เรียกวาลัทธิสตาลิน เรามั่นใจไดวา POUM จะทําทุกอยางที่ทําไดเพื่อชวยประชาชนโซเวียตในการตอสูเพื่อเสรีภาพและการปฏิวัติที่แทจริง"
 NSB_soviet_spanish_civil_war.6.desc_2: "หลังจากเอาชนะศัตรูฝายฟาสซิสตและกระฎมพีในสเปนได และตระหนักถึงสถานการณของประชาชนโซเวียตในการตอสูกับการปฏิวัติซอนของฝายสตาลิน POUM ไดจัดปฏิบัติการอันนาทึ่งเพื่อนํากองพลนอยอาสาสมัครจํานวนมากมายังกองบัญชาการของเรา ชายหญิงผูกลาเหลานี้ไมไดมาจากสเปนเทานั้นแตมาจากทั่วโลก และสวนใหญเปนทหารผานศึกชํ่าชองจากสงครามกลางเมืองสเปน ซึ่งประสบการณและทักษะของพวกเขาจะชวยพลิกดุลการตอสูของโซเวียตใหเปนประโยชนแกเรา"
 NSB_soviet_spanish_civil_war.6.a: "การปฏิวัติจะมีชัยในรัสเซียเชนกัน!"
 NSB_soviet_spanish_civil_war.6.b: "ปฏิวัติหรือตาย!"
 SOV_poum_aid_in_case_of_civil_War_tt: "POUM แหงสเปนจะจัดตั้งกองพลอาสาสมัครหลายกองพลเพื่อชวยเราในกรณีเกิดสงครามกลางเมืองตอตาน [ROOT.GetLeader] และหลักนิยมของสตาลิน"

 NSB_soviet_planned_economy.1.t: "โครงการเศรษฐกิจแบบวางแผนของ[SOV.GetAdjective]"
 NSB_soviet_planned_economy.1.desc: "[SOV.GetLeader] ไดเสนอแผนใหมสําหรับเศรษฐกิจแบบวางแผนรวมกัน \nแมจะไมไรที่ติ แตรัฐบาล[FROM.GetAdjective]เชื่อวานโยบายเศรษฐกิจใหม (NEP) ก็ประสบความสําเร็จอยูหลายประการ และตั้งใจจะสถาปนาแบบจําลองเศรษฐกิจแบบวางแผน สรางเศรษฐกิจที่พึ่งพาอาศัยกันมากขึ้นระหวาง[FROM.GetNameDef]กับหุนสวน และปูทางสูสังคมสังคมนิยมอยางสมบูรณ"
 NSB_soviet_planned_economy.1.a: "เราตองปฏิบัติตาม"

 nsb_news.100.desc: "เลฟ ทรอตสกี ผูเคยเปนมือขวาคนสําคัญและทายาทโดยสันนิษฐานของวลาดีมีร อิลิช เลนิน ถูกกลุมติดอาวุธบุกโจมตีถึงวิลลาที่พักวันนี้ คนรายพังเขาไปในหองที่บอลเชวิกผูนี้อยู และเปดฉากยิงทันทีกอนจะหลบหนีไปอยางรวดเร็ว ทิ้งทรอตสกีไวในสภาพบาดเจ็บสาหัส ซึ่งเสียชีวิตในอีกไมกี่ชั่วโมงตอมาที่โรงพยาบาลในเม็กซิโกซิตี \n\nหลังพายแพในการแยงชิงอํานาจกับ $SOV_iosif_stalin$ และพวกพองเพื่อควบคุมพรรคคอมมิวนิสตแหงสหภาพโซเวียต ทรอตสกีใชชีวิตชวงทศวรรษ 1930 ในการลี้ภัย อาศัยอยูในตุรกี ฝรั่งเศส และนอรเวย กอนจะลงหลักปกฐานที่เม็กซิโกในที่สุด \nเขายังคงวิพากษวิจารณสตาลินและ 'รัฐกรรมกรที่เสื่อมทราม' ของสหภาพโซเวียตอยูเสมอ"
 nsb_news.101.desc: "เลฟ ทรอตสกี บอลเชวิกรุนเกา ถูกกลุมติดอาวุธบุกโจมตีถึงวิลลาที่พักวันนี้ คนรายพังเขาไปในหองที่เขาอยู ยิงกราดอยางไรทิศทางแลวหลบหนีไปอยางรีบรอน ทิ้งทรอตสกีไวโดยไมบาดเจ็บ เพราะเขาหลบอยูหลังเตียงพรอมภรรยาและหลานชายไดทัน \n\nทรอตสกีเคยเปนมือขวาคนสําคัญและทายาทโดยสันนิษฐานของวลาดีมีร เลนิน แตหลังพายแพในการแยงชิงอํานาจ เขาก็ถูก $SOV_iosif_stalin$ บีบใหลี้ภัยออกจากสหภาพโซเวียต ทรอตสกีใหสัมภาษณสื่อประณามการลอบสังหารครั้งนี้วาเปน 'แผนขี้ขลาดอีกครั้งของสตาลินเพื่อปดปากผูวิจารณ'"
 nsb_news.102.t: "สนธิสัญญา[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot]"
 nsb_news.102.desc_default: "เมื่อวานนี้ นักการทูตจากทั้งสองประเทศไดลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันระหวาง[SOV.GetNameDef]และ[SOV_collective_security_pact_integrant.GetNameDef]ที่[SOV.Capital.GetCapitalVictoryPointName] \n\nขอตกลงนี้เปนสวนหนึ่งของนโยบายความมั่นคงรวมที่เสนอโดยผูบังคับการประชาชนฝายการตางประเทศของ[SOV.GetAdjective] [SOV.SOV_maksim_litvinov.GetName] ภายใตสนธิสัญญานี้ [SOV.GetNameDef]และ[SOV_collective_security_pact_integrant.GetNameDef]ไดใหคํามั่นวาจะปกปองซึ่งกันและกันในกรณีถูกรุกรานโดยมหาอํานาจที่เปนปรปกษ"
 nsb_news.102.desc_poland: "เมื่อวานนี้ นักการทูตจากทั้งสามประเทศไดลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันระหวาง[SOV.GetNameDef] [SOV_collective_security_pact_integrant.GetNameDef] และ[POL.GetNameDef]ที่[SOV.Capital.GetCapitalVictoryPointName] \n\nขอตกลงนี้เปนสวนหนึ่งของนโยบายความมั่นคงรวมที่เสนอโดยผูบังคับการประชาชนฝายการตางประเทศของ[SOV.GetAdjective] [SOV.SOV_maksim_litvinov.GetName] ภายใตสนธิสัญญานี้ [SOV.GetNameDef] [SOV_collective_security_pact_integrant.GetNameDef] และ[POL.GetNameDef]ไดสละการอางสิทธิ์ดินแดนใด ๆ ตอกัน และใหคํามั่นวาจะปกปองซึ่งกันและกันในกรณีถูกรุกรานโดยมหาอํานาจที่เปนปรปกษ"
 nsb_news.102.a: "พันธมิตรที่แปลกประหลาด..."
 nsb_news.102.b: "เพื่อความมั่นคงรวมกัน"
 SOV_collective_security_news_poland_included: "-[POL.GetAdjective]"
 SOV_collective_security_news_poland_no: ""
 nsb_news.103.t: "ขอตกลงการคา[SOV.GetAdjective]-[GER.GetAdjective]"
 nsb_news.103.desc: "[SOV.GetNameDef]และ[GER.GetNameDef]ไดลงนามขอตกลงทางการคาระหวางกัน ดวยขอตกลงนี้ ฝาย[SOV.GetAdjective]หวังจะกระตุนการพัฒนาอุตสาหกรรมและการวิจัยทางทหาร ขณะที่ฝาย[GER.GetAdjective]ตองการนําเขาวัตถุดิบที่จําเปนอยางยิ่ง เชน ธัญพืช นํ้ามัน และสินแรเหล็ก"
 nsb_news.103.a: "สิ่งนี้จะเปนประโยชนตอ[ROOT.GetNameDef]"
 nsb_news.103.b: "จะอยูไดนานแคไหนกัน?"
 nsb_news.104.t: "การรุกราน[PER.GetName]ของอังกฤษ-[SOV.GetAdjective]"
 nsb_news.104.desc: "หลังการวางแผนหลายสัปดาห [ENG.GetNameDef]และ[SOV.GetNameDef]ไดเปดปฏิบัติการทางทหารรวมกันใน[PER.GetName] โดยมุงยึดครองอยางรวดเร็วตอศัตรูที่มีกําลังนอยกวาและดอยกวาทางเทคโนโลยี ตามคํากลาวของ [ENG.GetLeader] ปฏิบัติการนี้จะชวยใหพวกเขายึดแหลงนํ้ามัน[PER.GetAdjective]และรักษาเสนทางเสบียงของ[ENG.GetAdjective]ไปยัง[SOV.GetNameDef]ได ทั้งยังปองกันไมใหศัตรูที่อาจรุกจาก[TUR.GetNameDef]ผาน[PER.GetName]มุงสูแหลงนํ้ามันบากูและ[RAJ.GetNameDef]"
 nsb_news.104.a: "เปนมาตรการที่จําเปน"
 nsb_news.104.b: "เหยื่ออีกรายของ [ENG.GetLeader] และ [SOV.GetLeader]"
 nsb_news.104.c: "ไมใชการตอสูที่ยุติธรรมเลย..."

 NSB_Soviet_fascist_civil_war.001.t: "[GetSovietCivilWarName]!"
 NSB_Soviet_fascist_civil_war.001.desc: "เวลาแหงการเดินเกมทางการเมืองสิ้นสุดลงแลว การตอสูดวยอาวุธกับพวกคอมมิวนิสตไดเริ่มขึ้นอีกครั้ง คณะกรรมการไดถูกจัดตั้งขึ้นเพื่อนําเราผานสงครามครั้งนี้ คราวนี้เราจะสูอยางเปนหนึ่งเดียวจนถึงที่สุด คราวนี้จะไมมีความพายแพ คราวนี้เราจะยึดจักรวรรดิกลับคืนมา!"
 NSB_Soviet_fascist_civil_war.001.a: "จับอาวุธขึ้นสู!"

 NSB_Soviet_fascist_civil_war.002.t: "ทหารใหมของเราพรอมแลว"
 NSB_Soviet_fascist_civil_war.002.desc: "กองพลรูกีพรอมลุกขึ้นตอสูกับผูกดขี่คอมมิวนิสตแลว"
 NSB_Soviet_fascist_civil_war.002.a: "ยอดเยี่ยม"

 NSB_Soviet_fascist_civil_war.003.t: "$SOV_grigory_semyonov$ เดินทางออกจาก[ROOT.GetName]"
 NSB_Soviet_fascist_civil_war.003.desc: "สงครามกลางเมืองรัสเซียไดปะทุขึ้นอีกครั้ง $SOV_grigory_semyonov$ ผูพํานักอยูที่นี่นับแตหลบหนีพวกแดงมา ไดตัดสินใจออกจาก[ROOT.GetName]อีกครั้งเพื่อเขารวมการตอสูกับพวกคอมมิวนิสตใน[SOV.GetNameDef]"
 NSB_Soviet_fascist_civil_war.003.a: "คงตองปลอยเขาไปละนะ"

 NSB_soviet_communist_civil_war.001.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.001.desc: "สหายทั้งหลาย ถึงเวลาอีกครั้งแลวที่จะชูธงและออกรบเพื่อการปฏิวัติ กอนที่เราจะกอบกูชนชั้นกรรมาชีพได เราตองยึดอํานาจควบคุม[ROOT.GetNameDef]กลับคืนมา เชนเดียวกับที่เราเคยเอาชนะกองทัพขาว บัดนี้เราตองเอาชนะผูที่ขวางทางการปฏิวัติที่แทจริงในมาตุภูมิ\nเราตองตัดสินใจดวยวาใครควรเปนผูนําของเราในการตอสูครั้งนี้"
 NSB_soviet_communist_civil_war.001.a: "ทรอตสกีเปนปรปกษหลักของสตาลินมาโดยตลอด"
 NSB_soviet_communist_civil_war.001.b: "สมีรนอฟจะนําประชาชนสูชัยชนะ"
 NSB_soviet_communist_civil_war.001.c: "เราตองการผูที่มีประสบการณทางทหาร"
 NSB_soviet_communist_civil_war.001.d: "ซีโนเวียฟเปนผูนําโดยธรรมชาติ"
 NSB_soviet_communist_civil_war.001.e: "คาเมเนฟจะเปนผูนําเชิงสัญลักษณที่ดี"

 NSB_soviet_communist_civil_war.002.t: "เบรียาถูกกองทัพจับกุม"
 NSB_soviet_communist_civil_war.002.desc: "$SOV_lavrenty_beriya$ ถูกนายทหารจับกุมและถูกคุมขังเพื่อรอการพิจารณาคดี กองพลตาง ๆ ไดเคลื่อนเขาสูเมืองหลวงเพื่อรักษาความสงบจากความพยายามลุกฮือของผูสนับสนุนเขา ขณะนี้กําลังมีการจับกุมคนสนิทของเบรียา ถึงเวลาแลวที่ตองหาผูนําคนใหมให[ROOT.GetNameDef]"
 NSB_soviet_communist_civil_war.002.a: "บูฮารินคือผูสมัครที่สมบูรณแบบ"
 NSB_soviet_communist_civil_war.002.b: "ควรเปนรืยคอฟ"
 NSB_soviet_communist_civil_war.002.c: "ผูที่สามารถรับประกันความภักดีของกองทัพได"
 NSB_soviet_communist_civil_war.002.d: "ซีโนเวียฟเปนผูนําโดยธรรมชาติ"
 NSB_soviet_communist_civil_war.002.e: "คาเมเนฟจะเปนผูนําเชิงสัญลักษณที่ดี"

 NSB_soviet_communist_civil_war.003.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.003.desc: "สงครามมาถึงเราอีกครั้งแลว เราตองจับอาวุธขึ้นสูกับเผด็จการผูนําประเทศนี้ไปผิดทาง สตาลินพาสหภาพโซเวียตไปในทิศทางที่ผิดมานานเกินไปแลว นาเสียดายที่ตองทําเชนนี้ แตเราไมมีทางเลือกอื่นอีกแลว"
 NSB_soviet_communist_civil_war.003.a: "บูฮารินจะนําพวกเรา"
 NSB_soviet_communist_civil_war.003.b: "ประชาชนสามารถรวมใจกันสนับสนุนรืยคอฟได"
 NSB_soviet_communist_civil_war.003.c: "เราตองการผูที่มีประสบการณทางทหาร"
 NSB_soviet_communist_civil_war.003.d: "ซีโนเวียฟเปนผูนําโดยธรรมชาติ"
 NSB_soviet_communist_civil_war.003.e: "คาเมเนฟจะเปนผูนําเชิงสัญลักษณที่ดี"

 NSB_soviet_communist_civil_war.004.t: "การเรียกรองกองพลนอยปฏิวัตินานาชาติ"
 NSB_soviet_communist_civil_war.004.desc: "[FROM.GetLeader] ไดเรียกรองอาสาสมัครเพื่อรวมตอสูกับ [SOS.GetLeader] หลายกลุมไดตอบรับการเรียกรองนี้ และกองพลนอยนานาชาติกําลังกอตัวขึ้น"
 NSB_soviet_communist_civil_war.004.a: "ควรสงเสริมเรื่องนี้"
 NSB_soviet_communist_civil_war.004.b: "ตองหยุดยั้งเรื่องนี้!"
 NSB_soviet_communist_civil_war.004.c: "ออ"

 NSB_soviet_communist_civil_war.005.t: "กองพลนอยนานาชาติเดินทางมาถึง"
 NSB_soviet_communist_civil_war.005.desc: "นักปฏิวัติจากทั่วโลกไดเดินทางมาเพื่อตอสูกับศัตรูของการปฏิวัติที่แทจริง อาสาสมัครกําลังถูกจัดเปนกองพลนอยนานาชาติที่จะถูกปลอยออกไปจัดการศัตรูของ[ROOT.GetNameDef]ในไมชา"
 NSB_soviet_communist_civil_war.005.a: "กําลังเสริมที่นายินดี"

 NSB_soviet_communist_civil_war.006.t: "การประทวงครั้งใหญใน[?SOV_uprising_state.GetName]"
 NSB_soviet_communist_civil_war.006.desc: "คนงานใน[?SOV_uprising_state.GetName]ไดออกมาชุมนุมบนทองถนนครั้งใหญ เสียงเรียกรองใหสหภาพแรงงานมีอิทธิพลมากขึ้นดังไปทั่ว แตก็มีคําขวัญและปายประทวงอื่น ๆ อยูมากเชนกัน ถึงขั้นมีรายงานวามีการตะโกนตอตานสตาลินโดยตรง"
 NSB_soviet_communist_civil_war.006.a: "ปลอยใหพวกเขาประทวงไป"
 NSB_soviet_communist_civil_war.006.b: "ตองหยุดเรื่องนี้กอนที่จะบานปลาย"

 NSB_soviet_communist_civil_war.008.t: "สตาลินรอดจากการลอบสังหาร"
 NSB_soviet_communist_civil_war.008.desc: "มีความพยายามลอบสังหารสตาลินแตไมสําเร็จ มือปนเดี่ยวคนหนึ่งบุกเขาไปในบานพักตากอากาศของสตาลิน แตถูกพบตัวเสียกอนที่จะไปถึงหองของเลขาธิการใหญ มือสังหารผูนั้นถูกองครักษของสตาลินยิงเสียชีวิตคาที่ ขณะนี้เมืองหลวงอื้ออึงไปดวยขาวลือวาใครอยูเบื้องหลังการกระทํานี้"
 NSB_soviet_communist_civil_war.008.a: "สถานการณอาจเลวรายลง"

 NSB_soviet_communist_civil_war.009.t: "อสัญกรรมของสตาลิน"
 NSB_soviet_communist_civil_war.009.desc: "$SOV_iosif_stalin$ ผูนําที่ไมมีใครโตแยงไดของ[SOV.GetNameDef] ถูกมือสังหารนิรนามสังหาร ดูเหมือนวาผูนําของ[SOV.GetNameDef]อยูตามลําพังในบานพักตากอากาศขณะเกิดเหตุ\nคณะสามผูนําซึ่งนําโดย $SOV_lavrenty_beriya$ คนสนิทของสตาลินที่ไมมีใครชอบหนา ไดเขาควบคุมประเทศ แตสถานการณยังไมมั่นคง และอนาคตของ[SOV.GetNameDef]ยังไมแนนอน"
 NSB_soviet_communist_civil_war.009.a: "ชวงเวลาที่นาสนใจรออยูขางหนา"

 NSB_soviet_communist_civil_war.010.t: "[?SOS.SOV_general_to_desert.GetName] แปรพักตร"
 NSB_soviet_communist_civil_war.010.desc: "ดวยความไมพอใจที่ถูกสตาลินปฏิบัติ [?SOS.SOV_general_to_desert.GetName] ไดตัดสินใจละทิ้งเผด็จการผูนั้นและเขารวมการตอสูอันชอบธรรมของเรา หนวยจํานวนหนึ่งตัดสินใจติดตามนายพลของพวกเขามา แทนที่จะอยูกับ [SOS.GetLeader]"
 NSB_soviet_communist_civil_war.010.a: "เรายินดีตอนรับพวกเขาอยางยิ่ง!"

 NSB_soviet_civil_war_common.001.t: "ชัยชนะ"
 NSB_soviet_civil_war_common.001.desc_left: "สงครามตอตานสตาลินสิ้นสุดลงแลว เผด็จการถูกโคนลม [ROOT.GetLeader] ไดนําเราสูชัยชนะ\nถึงเวลาจุดเปลวไฟแหงการปฏิวัติขึ้นอีกครั้ง และนําเสรีภาพไปสูชนชั้นกรรมาชีพทั่วโลก"
 NSB_soviet_civil_war_common.001.desc_right_concessions: "เราไดประเทศคืนมาแลว [ROOT.GetLeader] ไดนําเราสูชัยชนะ บัดนี้ถึงเวลาเยียวยาและปรับโฉมประเทศ เราไดแสดงใหเห็นแลววาเราพรอมทําทุกอยางเพื่อชัยชนะ แตชัยชนะยอมมีราคาที่ตองจายเสมอ นอกจากการเสียสละของเหลาทหารผูกลาแลว เรายังมีหนี้ที่ตองชดใชกอนจะปดบทนี้ของประวัติศาสตรได"
 NSB_soviet_civil_war_common.001.desc_right_no_concessions: "กองทัพผูมีชัยของเราเดินสวนสนามผานเครมลิน ชัยชนะเปนของเรา!\nยุคใหมของ[ROOT.GetNameDef]เริ่มตนวันนี้ ภายใตการนําอันชาญฉลาดของ [ROOT.GetLeader] ประเทศจะฟนฟูและกลับมาแข็งแกรงกวาที่เคย"
 NSB_soviet_civil_war_common.001.desc_exiles: "ระบอบคอมมิวนิสตลมสลายแลว ทหารผูมีชัยของเราควบคุมเมืองหลวงไวได ในที่สุดประชาชนก็เปนอิสระจากทรราชแดง รัสเซียใหมจะผงาดขึ้นจากซากปรักหักพังของสงครามกลางเมืองสองครั้งและการปกครองอันเลวรายหลายปในระหวางนั้น"
 NSB_soviet_civil_war_common.001.a: "ถึงเวลากาวตอไป"

 NSB_soviet_civil_war_common.002.t: "เมืองหลวงของ[ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.002.desc: "สงครามจบลงแลว จําเปนตองตัดสินใจเรื่องเมืองหลวงในอนาคตของประเทศ"
 NSB_soviet_civil_war_common.002.a: "มอสโกเปนเมืองที่สําคัญที่สุด"
 NSB_soviet_civil_war_common.002.b: "เลนินกราดคือจุดกําเนิดของการปฏิวัติ"
 NSB_soviet_civil_war_common.002.c: "ตองเปนเปโตรกราด"
 NSB_soviet_civil_war_common.002.d: "คง[?SOV_civil_war_start_state.GetName]ไว"
 NSB_soviet_civil_war_common.002.e: "วลาดีวอสตอคจะเปนเมืองหลวงตะวันออกแหงใหมของเรา"
 NSB_soviet_civil_war_common.002.f: "เซนตปเตอรสเบิรกเคยเปนเมืองหลวงของจักรวรรดิ"
 SOV_petrograd: "เปโตรกราด"
 SOV_StPetersburg: "เซนตปเตอรสเบิรก"

 NSB_soviet_civil_war_common.003.t: "[ROOT.GetLeader] ระดมกองทัพ"
 NSB_soviet_civil_war_common.003.desc: "ปฏิบัติการของเราไมอาจดําเนินอยางลับ ๆ ไดอีกตอไป [ROOT.GetLeader] ไดระดมกองทัพและ NKVD และเริ่มกวาดจับทุกคนที่ถูกสงสัยวาวางแผนตอตานรัฐ หากเราไมลงมือตอนนี้ ทุกสิ่งที่เราตอสูมาจะสูญเปลา"
 NSB_soviet_civil_war_common.003.a: "ถาเชนนั้นก็สงคราม"

 NSB_soviet_civil_war_common.006.t: "กองโจรเขารวมการลุกฮือ"
 NSB_soviet_civil_war_common.006.desc: "อํานาจของ [SOS.GetLeader] เหนือประเทศกําลังสั่นคลอน ทั่วทั้ง[SOS.GetNameDef] ประชาชนลุกฮือตอตานทรราชของ [SOS.GetLeader] หนวยกองโจรกําลังกอตัวขึ้นเพื่อชวยเราในการตอสู"
 NSB_soviet_civil_war_common.006.a: "ดี"
 SOV_popular_uprising_units_tt: "หนวยกองโจรเขารวมกับ[ROOT.GetNameDef]"

 NSB_soviet_civil_war_common.010.t: "การลางอิทธิพลสตาลิน"
 NSB_soviet_civil_war_common.010_right_opposition: "เผด็จการลมสลายแลว ถึงเวลารื้อถอนลัทธิบูชาตัวบุคคลของสตาลิน ริบสัญลักษณที่สาวกที่เหลืออยูหวงแหน และแสดงใหประชาชนเห็นวายุคเกาไดหมดไปแลว อนุสาวรียตองถูกรื้อถอนและเมืองตาง ๆ ตองเปลี่ยนชื่อ อัญมณีที่สตาลินภาคภูมิใจที่สุดก็คงเปนเมืองสตาลินกราด"
 NSB_soviet_civil_war_common.010_left_opposition: "การปฏิวัติไดรับชัยชนะ เผด็จการลมสลาย และชนชั้นกรรมาชีพไดกลับมาปกครองประเทศอีกครั้ง พฤติกรรมบูชาตัวบุคคลของสตาลินตองยุติลง และสัญลักษณทั้งหมดตองถูกรื้อถอน เมืองที่ตั้งชื่อตามสตาลินและพวกพองตองเปลี่ยนเปนชื่อที่เหมาะสมกวา โดยเฉพาะอยางยิ่งเมืองสตาลินกราด"
 NSB_soviet_civil_war_common.010_exiles: "พวกบอลเชวิกพยายามเปลี่ยนศาสนาประจําชาติเปนลัทธิคอมมิวนิสต และสรางลัทธิบูชาตัวบุคคลรอบผูนําของตน ถึงขั้นเปลี่ยนชื่อเมืองตาง ๆ ของรัสเซีย ระเบียบตองไดรับการฟนฟูทั่วจักรวรรดิ และไมมีที่ใดเหมาะจะเริ่มตนไปกวาเมืองเกาซารีตซิน ซึ่งถูกเปลี่ยนชื่อเปนสตาลินกราด"
 NSB_soviet_civil_war_common.010.a: "โวลโกกราดเปนชื่อที่เหมาะสม"
 NSB_soviet_civil_war_common.010.b: "เคยเปนซารีตซิน ก็ควรเปนซารีตซิน"
 NSB_soviet_civil_war_common.010.c: "ทรอตสกีคือวีรบุรุษที่แทจริงของการปฏิวัติ"
 NSB_soviet_civil_war_common.010.d: "เราควรเปลี่ยนชื่อเพื่อรําลึกถึงบูฮาริน"
