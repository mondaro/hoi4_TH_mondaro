 SOV_Dnipro: "ดนีโปร"
 SOV_Yekaterinoslav: "เยคาเตรีโนสลาฟ"
 SOV_Luhansk: "ลูฮันสค"
 SOV_Yekaterinodar: "เยคาเตรีโนดาร"
 SOV_Samara: "ซามารา"
 SOV_Simbirsk: "ซิมบีรสค"

 NSB_soviet_civil_war_common.100.t: "วลาดีวอสตอคแลกกับการสนับสนุน"
 NSB_soviet_civil_war_common.100.desc: "กลุมฝายคานใน[FROM.GetNameDef]กําลังวางแผนลุกฮือตอตาน [FROM.GetLeader] หัวหนาผูเจรจาของพวกเขาเสนอจะยกวลาดีวอสตอคใหหลังจากเอาชนะ [FROM.GetLeader] ได แลกกับการสนับสนุนในกรณีเกิดสงครามกลางเมือง"
 NSB_soviet_civil_war_common.100_exiles.desc: "กลุมฝายคานชาวรัสเซียในแมนจูเรียกําลังวางแผนลุกฮือตอตาน [FROM.GetLeader] หัวหนาผูเจรจาของพวกเขา $SOV_konstantin_rodzayevsky$ เสนอจะยกวลาดีวอสตอคใหหลังจากเอาชนะ [FROM.GetLeader] ได แลกกับการที่ญี่ปุนสนับสนุนกองกําลังฝายขาวระหวางสงครามกลางเมือง"
 NSB_soviet_civil_war_common.100.a: "ยอดเยี่ยมไปเลย"
 NSB_soviet_civil_war_common.100.b: "เราไมมีกําลังพลเหลือพอ"
 vladivostock_concession_tt: "กองกําลังสํารวจของ[ROOT.GetAdjective]ที่นําโดย §Y[?SOV.SOV_japanese_general.GetName]§! จะถูกสงไปสนับสนุนกองกําลังฝายคาน\n§Y[408.GetName]§! จะถูกโอนให §Y[ROOT.GetName]§! เมื่อสงครามกลางเมืองใน[SOV.GetNameDef]สิ้นสุดลง"

 NSB_soviet_civil_war_common.101.t: "[FROM.GetName] สนับสนุนอุดมการณของเรา"
 NSB_soviet_civil_war_common.101.desc: "ระบอบ[FROM.GetAdjective]ตกลงตามคําขอของเรา และจะสนับสนุนการตอสูกับฝายสตาลินดวยกองกําลังสํารวจอันแข็งแกรงหากถึงคราวคับขัน วลาดีวอสตอคจะเปนของพวกเขาเมื่อการสูรบสิ้นสุดลง"
 NSB_soviet_civil_war_common.101.desc_exiles: "มิตร[FROM.GetAdjective]ของเราตกลงตามคําขอ และจะสนับสนุนการตอสูกับพวกบอลเชวิกดวยกองกําลังสํารวจอันแข็งแกรงเมื่อเราลุกฮือ การยกวลาดีวอสตอคใหเปนราคาที่สูง แตบางครั้งก็ตองยอมเสียสละ - อยางนอยก็ชั่วคราว"
 NSB_soviet_civil_war_common.101.a: "เทานี้แนวหลังของเราก็นาจะปลอดภัย"

 NSB_soviet_civil_war_common.102.t: "ญี่ปุนปฏิเสธวลาดีวอสตอค"
 NSB_soviet_civil_war_common.102.desc: "ในความพลิกผันที่คอนขางไมคาดคิด รัฐบาล[FROM.GetAdjective]ไดปฏิเสธขอเสนอที่จะไดทาเรือและพื้นที่รอบวลาดีวอสตอคเพื่อแลกกับการสนับสนุนอยางแข็งขันในการตอตานสตาลิน"
 NSB_soviet_civil_war_common.102.a: "ชางเปนชวงเวลาที่นาสนใจ"

 NSB_soviet_civil_war_common.103.t: "ซาคาลินเหนือแลกกับอาวุธ"
 NSB_soviet_civil_war_common.103.desc: "เพื่อแลกกับการสนับสนุนยุทโธปกรณใหแกการกบฏตอตานสตาลิน ฝายคานโซเวียตพรอมจะคืนเกาะที่พวกเขาเรียกวาซาคาลินทั้งเกาะใหแก[ROOT.GetName]"
 NSB_soviet_civil_war_common.103.desc_exiles: "ผูแทนจากชุมชนผูอพยพชาวรัสเซียในแมนจูเรียไดติดตอเราเพื่อขอเสบียงในกรณีเกิดสงครามกลางเมืองรัสเซียครั้งที่สอง เพื่อเปนการตอบแทน พวกเขากลาววาพรอมรับรองสิทธิ์ของ[ROOT.GetNameDef]เหนือเกาะคาราฟุโตะทั้งเกาะ"
 NSB_soviet_civil_war_common.103.a: "หากพวกเขาจะมีโอกาสชนะ พวกเขาตองการความชวยเหลือทุกอยางที่หาได"
 NSB_soviet_civil_war_common.103.b: "เรานาจะแบงใหไดบาง"
 NSB_soviet_civil_war_common.103.c: "อยางนอยเราก็ซื้ออาวุธใหพวกเขาไดบาง"
 NSB_soviet_civil_war_common.103.d: "ไมคุมเสี่ยงที่จะถูกลากเขาไปพัวพันกับความขัดแยงนั้น"
 sakhalin_concession_tt: "[655.GetName] จะถูกโอนให[ROOT.getName]เมื่อสงครามกลางเมืองใน[SOV.GetNameDef]สิ้นสุดลง"

 NSB_soviet_civil_war_common.104.t: "[FROM.GetNameDefCap] จะสงอาวุธให"
 NSB_soviet_civil_war_common.104.desc: "การเจรจากับฝาย[FROM.GetAdjective]ประสบความสําเร็จ [FROM.GetName]สัญญาวาจะสงอาวุธสนับสนุนอุดมการณของเรา แลกกับการควบคุมซาคาลินตอนเหนือ"
 NSB_soviet_civil_war_common.104.a: "ราคาแพงลิบ แตหวังวาจะคุมคา"

 NSB_soviet_civil_war_common.105.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะสงอาวุธให"
 NSB_soviet_civil_war_common.105.desc: "แมจะเสนอขอตกลงที่เปนประโยชนตอ[FROM.GetAdjective]อยางแนนอนให [FROM.GetLeader] แลว คณะผูแทนก็กลับมามือเปลา"
 NSB_soviet_civil_war_common.105.a: "แยแลว"

 NSB_soviet_civil_war_common.106.t: "ความชวยเหลือลับแลกกับแหลงนํ้ามันบากู"
 NSB_soviet_civil_war_common.106.desc_right_opp_before: "กลุมฝายคานใน[FROM.GetNameDef]กําลังวางแผนรัฐประหารตอตานสตาลิน พวกเขาติดตอเราเพื่อขอความชวยเหลือในการเสริมสรางกําลังทหารอยางลับ ๆ แลกกับสิทธิ์ในนํ้ามันจากแหลงนํ้ามันบากูในอนาคต"
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war: "[SOV.GetNameDefCap] ซึ่งนําโดย [SOV.GetLeader] ไดลุกฮือตอตาน [SOS.GetLeader] และกําลังทําสงครามกลางเมืองอยางสิ้นหวัง ฝายกบฏไดติดตอเรา เสนอสิทธิ์ในแหลงนํ้ามันบากูในอนาคตแลกกับความชวยเหลือในการเสริมสรางขีดความสามารถทางทหาร"
 NSB_soviet_civil_war_common.106.desc_exiles_before: "กลุมตอตานคอมมิวนิสตในแมนจูเรียกําลังวางแผนตอตาน [SOV.GetLeader] พวกเขาตั้งใจจะโคนลมพวกบอลเชวิกดวยสงครามกลางเมืองอีกครั้ง ผูแทนของกลุมนี้ไดติดตอเราเพื่อขอความชวยเหลือในการเสริมสรางกําลังทหารอยางลับ ๆ แลกกับสิทธิ์ในนํ้ามันจากแหลงนํ้ามันบากูในอนาคต"
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war: "กองกําลังรัสเซียฝายขาวไดลุกฮือตอตาน [SOS.GetLeader] จุดชนวนสงครามกลางเมืองอีกครั้งในรัสเซีย ฝายกบฏไดติดตอเรา เสนอสิทธิ์ในแหลงนํ้ามันบากูในอนาคตแลกกับความชวยเหลือในการเสริมสรางขีดความสามารถทางทหาร"
 NSB_soviet_civil_war_common.106.a: "อะไรก็ตามที่ทําใหสหภาพโซเวียตสั่นคลอนลวนเปนเรื่องดี"
 NSB_soviet_civil_war_common.106.b: "ฟงดูดีมาก เราควรสงที่ปรึกษาทางทหารไปดวย"
 NSB_soviet_civil_war_common.106.c: "อยาไปยุงเลย"
 SOV_baku_oil_fields_tt: "[ROOT.GetNameDefCap] จะชวยสรางอุตสาหกรรมทางทหารเพื่อเตรียมพรอมสําหรับสงครามกลางเมืองใน[FROM.GetNameDef] เปนการตอบแทน [ROOT.GetNameDef]จะไดรับ§Yสิทธิ์ในทรัพยากร§!ของแหลงนํ้ามันบากูหลังสงครามกลางเมืองโซเวียตสิ้นสุดลง\n"
 SOV_german_advisors_tt: "ผูนํากองทัพสองคนจะไปรวมรบใหฝายคานระหวางสงครามกลางเมืองโซเวียต\n"

 NSB_soviet_civil_war_common.107.t: "[FROM.GetNameDefCap] ตกลงชวยเหลือแลกกับแหลงนํ้ามันบากู"
 NSB_soviet_civil_war_common.107.desc_normal: "คําขอความชวยเหลือในการเสริมสรางขีดความสามารถทางทหารของเราไดรับการตอบรับอยางดีจาก[FROM.GetNameDef] รัฐบาล[FROM.GetAdjective]จะชวยสรางโรงงานทหารแลกกับสิทธิ์ในนํ้ามันในคอเคซัสในอนาคต"
 NSB_soviet_civil_war_common.107.desc_advisors: "รัฐบาล[FROM.GetAdjective]ตกลงจะชวยสรางอุตสาหกรรมทางทหารแลกกับสิทธิ์ในนํ้ามันในอนาคต นอกจากนี้ยังตกลงจะสง "ที่ปรึกษา" ทางทหารจํานวนหนึ่งมาอยูกับเราตลอดสงครามกลางเมืองดวย"
 NSB_soviet_civil_war_common.107.a: "ขาวดี"

 NSB_soviet_civil_war_common.108.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะชวยเหลือ"
 NSB_soviet_civil_war_common.108.desc: "การเจรจากับ[FROM.GetNameDef]ไมเกิดผล แมจะเสนอสิทธิ์ในนํ้ามันในอนาคต พวกเขาก็ไมยอมชวยเราสรางอุตสาหกรรมทางทหารเพิ่ม"
 NSB_soviet_civil_war_common.108.a: "ถาเชนนั้นเราคงตองพึ่งตัวเอง"

 NSB_soviet_civil_war_common.109.t: "สง "ที่ปรึกษา" ไปยัง[SOV.GetNameDef]"
 NSB_soviet_civil_war_common.109.desc: "สงครามกลางเมืองไดปะทุขึ้นอีกครั้งในรัสเซีย [SOV.GetLeader] นําการรบตอตาน [SOS.Getleader] และหากฝายกบฏประสบความสําเร็จ เราจะไดประโยชนมหาศาล เราสัญญาวาจะสนับสนุนพวกเขา และ [?ROOT.SOV_foreign_military_advisor_1.GetName] กับ [?ROOT.SOV_foreign_military_advisor_2.GetName] ก็พรอมเดินทางไป[SOV.GetName]เพื่อชวยวางแผนการรบ และเก็บขอมูลเชิงลึกอันมีคาเกี่ยวกับขีดความสามารถทางทหารของ[SOV.GetAdjective]"
 NSB_soviet_civil_war_common.109.a: "นี่จะนาสนใจมากทีเดียว"

 NSB_soviet_civil_war_common.110.t: "ชวยปลุกปนการกบฏในยูเครน"
 NSB_soviet_civil_war_common.110.desc: "ฝายคานโซเวียตไดขอความชวยเหลือจากเราในการแยงชิงอํานาจ พวกเขาตองการใหเราฝกกองกําลังอาสายูเครนอยางลับ ๆ แลกกับสิทธิ์ในทรัพยากรในยูเครนที่เปนเอกราชในอนาคต"

 NSB_soviet_civil_war_common.110.a: "ขอเสนอดีเกินกวาจะปฏิเสธ"
 NSB_soviet_civil_war_common.110.b: "อยาไปยุงกับเรื่องนั้นเลย"
 SOV_ukraine_insurrection_tt: "[ROOT.GetName] จะฝกกองกําลังอาสายูเครนแลกกับ§Yสิทธิ์ในทรัพยากร§!ในยูเครนในอนาคต\n"

 NSB_soviet_civil_war_common.111.t: "[FROM.GetNameDefCap] จะฝกกองกําลังอาสายูเครน"
 NSB_soviet_civil_war_common.111.desc: "[FROM.GetNameDefCap] ตกลงเริ่มฝกกองกําลังอาสายูเครนแลว เมื่อพรอม หนวยเหลานี้จะถูกลักลอบสงเขายูเครนและกอการกบฏตอตานระบอบสตาลิน"
 NSB_soviet_civil_war_common.111.a: "หวังวาคงไดผลนะ"

 NSB_soviet_civil_war_common.112.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอเรื่องยูเครน"
 NSB_soviet_civil_war_common.112.desc: "หลังการหารือหลายวัน [FROM.GetLeader] ก็ตัดสินใจกะทันหันวาจะไมสนับสนุนการกอการกบฏในยูเครน ทิ้งใหผูเจรจาของเรางุนงงวาเหตุใดขอเสนอจึงถูกปฏิเสธ"
 NSB_soviet_civil_war_common.112.a: "นาเสียดาย"

 NSB_soviet_civil_war_common.113.t: "กองกําลังอาสายูเครนพรอมแลว"
 NSB_soviet_civil_war_common.113.desc_before: "ผูติดตอชาวเยอรมันของเรารายงานวากองกําลังอาสายูเครนที่พวกเขาฝกไวพรอมโจมตีแลว หนวยเหลานี้ไดรับยุทโธปกรณและผานการฝก และจะถูกวางกําลังอยางลับ ๆ ในยูเครนเพื่อรอสงครามปะทุ"
 NSB_soviet_civil_war_common.113.desc_started: "ผูติดตอชาวเยอรมันของเรารายงานวากองกําลังอาสายูเครนที่พวกเขาฝกไวพรอมโจมตีแลว หนวยเหลานี้ไดรับยุทโธปกรณและถูกลักลอบขนสงไปยังจุดยุทธศาสตรแลว คําสั่งใหลงมือไดถูกออกไปแลว และการกอการกบฏจะเริ่มขึ้นไดทุกเมื่อ"
 NSB_soviet_civil_war_common.113.a: "ศัตรูเพิ่มอีกหนึ่งของ [SOS.GetLeader]"
 NSB_soviet_civil_war_common.113.b: "ดีที่ไดรู"
 NSB_soviet_civil_war_common.113.c: "เดี๋ยวนะ อะไรนะ?"

 NSB_soviet_civil_war_common.114.t: "การกบฏของยูเครน"
 NSB_soviet_civil_war_common.114.desc: "ทหารยูเครนที่เยอรมนีฝกไดเขายึดเมืองสําคัญทั่วยูเครน รัฐบาลเฉพาะกาลที่นําโดย [UKR.GetLeader] ไดถูกจัดตั้งขึ้น และ[UKR.GetNameDef]ไดประกาศตนเปนประเทศเอกราช"
 NSB_soviet_civil_war_common.114.a: "เรื่องนี้ยอมรับไมได!"
 NSB_soviet_civil_war_common.114.b: "ก็เราตกลงเรื่องนี้ไวเองนี่นะ"
 NSB_soviet_civil_war_common.114.c: "นี่จะเปนการโจมตีอยางหนักตอ [SOS.GetLeader]"

 NSB_soviet_civil_war_common.115.t: "เอกราชของเบลารุสในอนาคตแลกกับการสนับสนุน"
 NSB_soviet_civil_war_common.115.desc: "ฝายคานโซเวียตไดติดตอเราเพื่อขอการสนับสนุนอยางลับ ๆ แลกกับเสบียงและความชวยเหลือในการเสริมสรางกําลังทหาร พวกเขาพรอมจะยอมรับการกลับมาของรัฐบาลพลัดถิ่น[BLR.GetAdjective]"
 NSB_soviet_civil_war_common.115.a: "ความคิดที่ยอดเยี่ยม"
 NSB_soviet_civil_war_common.115.b: "เรามีปญหาของตัวเองมากพอแลว"
 SOV_belarus_tt: "[BLR.GetNameDefCap] จะไดรับการปลดปลอยเปนประเทศเอกราชเมื่อ[GetSovietCivilWarName]สิ้นสุดลง"

 NSB_soviet_civil_war_common.116.t: "[FROM.GetNameDefCap] สนับสนุนอุดมการณของเรา"
 NSB_soviet_civil_war_common.116.desc: "การเจรจากับฝาย[FROM.GetAdjective]ประสบความสําเร็จ เพื่อแลกกับการอนุญาตใหรัฐบาลพลัดถิ่น[BLR.GetAdjective]กลับมาหลังสงคราม รัฐบาล[FROM.GetAdjective]จะสนับสนุนเราในการเสริมสรางกําลังทหารและยุทโธปกรณ"
 NSB_soviet_civil_war_common.116.a: "ดี"

 NSB_soviet_civil_war_common.117.t: "ไมมีการสนับสนุนจาก[FROM.GetNameDef]"
 NSB_soviet_civil_war_common.117.desc: "การเจรจากับฝาย[FROM.GetAdjective]ไมไดผลเปนรูปธรรมใด ๆ [FROM.GetLeader] ปฏิเสธขอเสนอของเรา จึงจะไมมีความชวยเหลือใดมาจาก[FROM.GetName]"
 NSB_soviet_civil_war_common.117.a: "เราคงตองประคองตัวไปโดยไมมีความชวยเหลือจากพวกเขา"

 NSB_soviet_civil_war_common.118.t: "ฝายคานโซเวียตขอการสนับสนุน"
 NSB_soviet_civil_war_common.118.desc: "สมาชิกฝายคานโซเวียตที่ตอตานสตาลินกําลังรณรงคตอตานระบอบสตาลิน มีการจัดชุมนุมตอตานสตาลินหลายครั้ง และพวกเขากําลังระดมทุนอยูที่นี่ใน[ROOT.GetName]\nนอกจากจะปลุกกระแสสนับสนุนจากประชาชนแลว พวกเขายังติดตอเราอยางลับ ๆ เพื่อขออาวุธสนับสนุนการลุกฮือดวย"
 NSB_soviet_civil_war_common.118.a: "สงปนไรเฟลไปใหพวกเขา"
 NSB_soviet_civil_war_common.118.b: "อยางนอยเราก็พอแบงปนไรเฟลใหไดบาง"
 NSB_soviet_civil_war_common.118.c: "เราไมมีเลย แตบางทีเราอาจซื้อมาใหพวกเขาได"
 NSB_soviet_civil_war_common.118.d: "ไมมีประโยชนที่จะเขาไปยุงเกี่ยว"

 NSB_soviet_civil_war_common.119.t: "[FROM.GetNameDefCap] สนับสนุนอุดมการณของเรา"
 NSB_soviet_civil_war_common.119.desc: "รัฐบาล[FROM.GetAdjective]ตกลงที่จะสงอาวุธใหเราอยางลับ ๆ"
 NSB_soviet_civil_war_common.119.a: "ยอดเยี่ยม"

 NSB_soviet_civil_war_common.120.t: "รัฐบาล[FROM.GetAdjective]ไมยอมสนับสนุนเรา"
 NSB_soviet_civil_war_common.120.desc: "การระดมทุนของเราใน[FROM.GetNameDef]ประสบความสําเร็จ แตรัฐบาลกลับปฏิเสธที่จะสงอาวุธใหเรา"
 NSB_soviet_civil_war_common.120.a: "นาเสียดาย"

 NSB_soviet_civil_war_common.121.t: "[FROM.GetName] ขอความคุมครองจากเรา"
 NSB_soviet_civil_war_common.121.desc: "[FROM.GetLeader] ไดสงคณะผูแทนมาขอการสนับสนุนจากเราเพื่อตอตาน[SOS.GetNameDef] \nรัฐบาล[FROM.GetAdjective]ยินดีสละอธิปไตยของตนเพื่อแลกกับการที่[ROOT.GetAdjective]เขารวมสงคราม"
 NSB_soviet_civil_war_common.121.a: "นี่คือสิ่งที่เรารอคอยมาตลอด"
 NSB_soviet_civil_war_common.121.b: "อยาใหเราถูกลากเขาไปพัวพันเลย"

 NSB_soviet_civil_war_common.122.t: "[FROM.GetName] ตอบรับขอเสนอของเรา"
 NSB_soviet_civil_war_common.122.desc: "นาเสียดายที่เรื่องตองมาถึงขั้นนี้ แตเพื่อทวงคืนสิ่งที่เราสูญเสียไป เราจําตองยอมเสียสละ นี่เปนเพียงมาตรการฉุกเฉินชั่วคราวเทานั้น\nเมื่อพวกบอลเชวิคหมดสิ้นไปแลว เราจะมุงมั่นสูเอกราชโดยสมบูรณ"
 NSB_soviet_civil_war_common.122.a: "สูชัยชนะ"

 NSB_soviet_civil_war_common.123.t: "[FROM.GetName] ทอดทิ้งเรา"
 NSB_soviet_civil_war_common.123.desc: "ในยามที่เราสิ้นหวังที่สุด [FROM.GetLeader] กลับตัดสินใจถอนการสนับสนุนที่[FROM.GetNameDef]เคยใหคํามั่นไว ทั้งที่เรายอมทุมเทถึงที่สุดเพื่อใหไดมันมา"
 NSB_soviet_civil_war_common.123.a: "เราจะไมมีวันลืมเรื่องนี้!"

 NSB_soviet_civil_war_common.124.t: "โรงงาน[FROM.GetAdjective]สรางเสร็จแลว"
 NSB_soviet_civil_war_common.124.desc: "โรงงานที่สรางขึ้นใน[?SOV_civil_war_start_state.GetName]พรอมเดินเครื่องแลว สิ่งนี้จะชวยความพยายามในการทําสงครามของเราไดอยางมาก ทั้งในปจจุบันและอนาคต"
 NSB_soviet_civil_war_common.124.a: "ดี"

 NSB_soviet_civil_war_common.125.t: "การหนีทัพของฝายศัตรู"
 NSB_soviet_civil_war_common.125.desc: "หลังจากเรายึด[?SOV.SOV_defections_army_state.GetName]ได กองทัพของ[SOS.GetLeader]ก็เริ่มเสียขวัญ ทหารหนีทัพกันเปนจํานวนมาก บางก็วางอาวุธ ขณะที่บางสวนถึงกับเขารวมฝายเรา"
 NSB_soviet_civil_war_common.125.a: "ยอดเยี่ยม"
 SOS_army_desertions_tt: "กองทัพของ §Y[SOS.GetNameWithFlag]§! สูญเสีย§Yยุทโธปกรณ§! §Yกําลังพล§! และ§Yการจัดระเบียบ§! และบางหนวยแปรพักตรไปเขากับ §Y[ROOT.GetNameWithFlag]§!"

 NSB_soviet_civil_war_common.126.t: "ยึดคลังยุทโธปกรณของกองทัพไดใน[?SOV.SOV_captured_stockpile_state.GetName]"
 NSB_soviet_civil_war_common.126.desc: "กองทหารผูมีชัยของเรายึดคลังเสบียงของกองทัพ[SOS.GetAdjective]ไดใน[?SOV.SOV_captured_stockpile_state.GetName] ฝาย[SOS.GetAdjective]ที่ลาถอยพยายามทําลายมันทิ้ง แตทหารของเราก็ยึดยุทโธปกรณไวไดสวนหนึ่ง"
 NSB_soviet_civil_war_common.126.a: "เราใชมันใหเปนประโยชนได"

 NSB_soviet_civil_war_common.127.t: "การแปรพักตรของกองทัพเรือ"
 NSB_soviet_civil_war_common.127.desc: "หลังชัยชนะของเราใน[?SOV.SOV_defections_navy_state.GetName] นายทหารเรือหลายนายเริ่มตระหนักวาพวกเขากําลังสูเพื่อสิ่งที่ไรความหวัง ผลก็คือเรือจํานวนหนึ่งไดแยกตัวออกจากกองเรือแดง และลูกเรือก็เสนอตัวเขารวมฝายเรา"
 NSB_soviet_civil_war_common.127.a: "ของไดเปลาก็อยาไปติมันเลย"
 SOS_navy_desertions_tt: "หนวยทางเรือจาก §Y[SOS.GetNameWithFlag]§! แปรพักตรไปเขากับ §Y[ROOT.GetNameWithFlag]§!"

 NSB_soviet_civil_war_common.128.t: "ความไมสงบใน[SOS.GetNameDef]"
 NSB_soviet_civil_war_common.128.desc: "รายงานระบุวาชัยชนะครั้งลาสุดของเราในสนามรบ เชน การยึด[?SOV.SOV_civilian_unrest_state.GetName] ไดนําไปสูการประทวงทั่ว[SOS.GetNameDef] แนนอนวาพรรคพวกของ[SOS.GetLeader]ปราบปรามการประทวงเหลานี้อยางโหดเหี้ยม แตถึงอยางไร มันก็ยอมสงผลเสียตอความพยายามในการทําสงครามของ[SOS.GetAdjective]"
 NSB_soviet_civil_war_common.128.a: "เราจะชนะศึกนี้"
 SOS_civilian_unrest_tt: "อุตสาหกรรมใน §Y[SOS.GetNameWithFlag]§! ไดรับความเสียหาย \n ขีดจํากัดการยอมจํานนของ §Y[SOS.GetLeader]§! ลดลง"
 NSB_soviet_civil_war_common.129.t: "[?SOV.SOV_japanese_general.GetName] ออกเดินทาง"
 NSB_soviet_civil_war_common.129.desc: "ขณะที่สงครามกลางเมืองกําลังลุกโชนในรัสเซีย ถึงเวลาแลวที่เราตองทําตามสัญญา [?SOV.SOV_japanese_general.GetName] จะนํากองกําลังสํารวจ[ROOT.GetAdjective]ไปสูชัยชนะและความรุงโรจน และปกปองเกียรติของ[ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.129.a: "ทุกคนตองทําหนาที่ของตน"

 NSB_soviet_nationalist.001.t: "การลุกฮือของฝายชาตินิยมใน[?SOV.SOV_nationalist_country.GetNameDef]"
 NSB_soviet_nationalist.001.desc: "[?SOV.SOV_nationalist_country.GetLeader] ไดประกาศให[?SOV.SOV_nationalist_country.GetName]เปนเอกราช [SOS.GetLeader] เรียกการกระทํานี้วาเปนการกบฏ และสั่งใหจับกุมพวกกบฏไปยิงเปา ผลก็คือ[SOS.GetNameDef]และ[?SOV.SOV_nationalist_country.GetNameDef]ตกอยูในภาวะสงครามแลว[GetFinnishCommittmentInKareliaOrNot]"
 FIN_karelian_uprising_supported_by_finland: "\n\nสถานการณยิ่งบานปลายเมื่อกองกําลัง[FIN.GetAdjective]ขามพรมแดนเขามา ทําใหความขัดแยงขยายวงกวางและดึง[FIN.GetNameDef]เขาสูความขัดแยงกับ[SOS.GetNameDef]"
 SOV_breakaway_country_flag: "ประกาศเอกราชจากสหภาพโซเวียต"
 NSB_soviet_nationalist.001.a: "ศัตรูของศัตรูคือมิตร"
 NSB_soviet_nationalist.001.b: "นี่คือดินแดนอันชอบธรรมของ[ROOT.GetAdjective]!"
 indepence_war_threat: "ประกาศเอกราช"
 NSB_soviet_nationalist.002.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมอยูใตการปกครอง"
 NSB_soviet_nationalist.002.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดเขาพบรัฐบาลของเราพรอม "คําขอ" ใหเรายอมรับ[FROM.GetNameDef]เปนรัฐบาลที่แทจริงและสูงสุดของ[ROOT.GetName] โดยแลกกับ "อํานาจปกครองตนเองในระดับหนึ่ง""
 NSB_soviet_nationalist.002.a: "เราชนะสหภาพโซเวียตมาแลว เราก็ชนะพวกนี้ไดเชนกัน"
 NSB_soviet_nationalist.002.b: "บางทีนี่อาจเปนทางที่ดีที่สุด"
 NSB_soviet_nationalist.003.t: "[FROM.GetNameDefCap] ยอมรับ"
 NSB_soviet_nationalist.003.desc: "[FROM.GetLeader] ไมเห็นเหตุผลที่จะปฏิเสธขอเรียกรองอันชอบธรรมของเรา [FROM.GetNameDef] จะกลับคืนสูจักรวรรดิ โดยไดรับสิทธิ์ปกครองตนเองบางสวน"
 NSB_soviet_nationalist.003.a: "วันอันยิ่งใหญของรัสเซีย"
 NSB_soviet_nationalist.004.t: "[FROM.GetNameDefCap] ปฏิเสธ"
 NSB_soviet_nationalist.004.desc: "แมจะถูกกดดัน และแมจะรูดีถึงสถานการณอันลอแหลมของประเทศ[FROM.GetLeader.GetHerHis] แต [FROM.GetLeader] ก็ปฏิเสธขอเสนออันเอื้อเฟอของเราที่จะใหอํานาจปกครองตนเองภายในจักรวรรดิรัสเซียที่ฟนคืนขึ้นใหม"
 NSB_soviet_nationalist.004.a: "เราตองทําใหพวกเขายอมสยบ!"
 NSB_soviet_nationalist.004.b: "คงตองรออีกสักหนอย"

 NSB_soviet_permanent_revolution.1.t: "นักปฏิวัติสายทรอตสกีปลุกปนมวลชน"
 NSB_soviet_permanent_revolution.1.desc: "พวกทรอตสกีจาก[FROM.GetNameDef]กําลังปลุกระดมมวลชนดวยโฆษณาชวนเชื่อแนวปฏิวัติ ถึงขั้นใหสัญญาวาจะเขามาชวยชนชั้นกรรมาชีพ[ROOT.GetAdjective] หากพวกเขาลุกฮือตอตานรัฐ สถานการณกําลังสอแววจะควบคุมไมอยู"
 NSB_soviet_permanent_revolution.1.a: "นี่แทบจะเปนการรุกรานเลยทีเดียว"
 NSB_soviet_for_the_common_good.1.t: "เพื่อประโยชนสวนรวม"
 NSB_soviet_for_the_common_good.1.desc: "สวนรวมยอมแข็งแกรงกวาปจเจก ซึ่งเปนจริงสําหรับเศรษฐกิจเชนกัน [SOV.GetNameDefCap] ไดตัดสินใจปฏิรูปเศรษฐกิจของพันธมิตรทั้งหมด เพื่อรับใชสวนรวมไดดียิ่งขึ้นแทนที่จะเพื่อประเทศใดประเทศหนึ่ง นี่หมายถึงการเปลี่ยนแปลงวิธีการทํางานของเรา และอาจมีความยากลําบากในชวงแรก แตทายที่สุดแลวจะเปนผลดีตอทุกฝาย"
 NSB_soviet_for_the_common_good.1.a: "เพื่อประโยชนสวนรวม!"

 NSB_soviet_fascist_tsarist.1.t: "การเปนสมาชิกสหภาพแพน-สลาฟ"
 NSB_soviet_fascist_tsarist.1.desc: "ขณะที่โลกรอบตัวเรากําลังจมสูความรุนแรง [FROM.GetNameDef] ไดกาวออกมาและประกาศวาจะปกปองชาวสลาฟทั้งปวงจากผูที่คิดราย พวกเขาเชิญเราเขาเปนสมาชิก "สหภาพแพน-สลาฟ" ที่ตั้งขึ้นใหม ซึ่งพวกเขาอางวาชาวสลาฟทุกชนชาติจะไดรับการเปนตัวแทนอยางเปนธรรมและยุติธรรม ภายใตการคุมครองของกองทัพ[FROM.GetAdjective]อันยิ่งใหญ"
 NSB_soviet_fascist_tsarist.1.a: "เราจะรวมในการรวมชาวสลาฟครั้งยิ่งใหญนี้!"
 NSB_soviet_fascist_tsarist.1.b: "ความคุมครองของพวกเขาไมคุมกับเอกราชของเรา"
 NSB_soviet_fascist_tsarist.2.t: "สหภาพแพน-สลาฟ: [FROM.GetNameDef] ตอบรับ"
 NSB_soviet_fascist_tsarist.2.desc: "เราเพิ่งไดรับขาวจากรัฐบาล[FROM.GetAdjective]วา [FROM.GetNameDef] ไดตอบรับคําเชิญเขาเปนสมาชิกสหภาพแพน-สลาฟแลว"
 NSB_soviet_fascist_tsarist.2.a: "การตัดสินใจที่ชาญฉลาด"
 NSB_soviet_fascist_tsarist.3.t: "สหภาพแพน-สลาฟ: [FROM.GetNameDef] ปฏิเสธ"
 NSB_soviet_fascist_tsarist.3.desc: "ผูแทนจากรัฐบาล[FROM.GetAdjective]แจงเราวาพวกเขาปฏิเสธโดยสิ้นเชิงตอความเปนไปไดใด ๆ ที่จะเขารวมสหภาพแพน-สลาฟของเราโดยสมัครใจ"
 NSB_soviet_fascist_tsarist.3.a: "สหภาพแพน-สลาฟจะเกิดขึ้นจริง ไมวาพวกเขาจะยินยอมหรือไมก็ตาม"
 NSB_soviet_fascist_tsarist.4.t: "[FROM.GetNameDef] แทรกแซงการเมืองของเรา"
 NSB_soviet_fascist_tsarist.4.desc: "เราไดรับรายงานนาวิตกวามีผูปลุกปนชาว[FROM.GetAdjective]เผยแพรโฆษณาชวนเชื่อฟาสซิสตภายในประเทศของเรา อีกทั้งยังมีเงินจาก[FROM.GetAdjective]อุดหนุนกิจกรรมและคาใชจายทางการเมืองของพรรคฟาสซิสตในประเทศ"
 NSB_soviet_fascist_tsarist.4.a: "เราตองระวังตัว มิฉะนั้นเราอาจถูกพิชิตโดยไมตองรบเลย"
 NSB_soviet_fascist_tsarist.5.t: "คําเชิญเขารวม[FROM.GetFactionName]"
 NSB_soviet_fascist_tsarist.5.desc: "ดวยตระหนักวาเรามีโลกทัศนคลายคลึงกัน [FROM.GetNameDef] จึงเชิญเราเขารวม[FROM.GetFactionName] พรอมเสนอการสนับสนุนทางทหารและเศรษฐกิจ ขณะที่เราแสวงหาอนาคตอันรุงโรจนใหแกชาติของเรา!"
 NSB_soviet_fascist_tsarist.5.a: "ภายใตการนําของ[FROM.GetAdjective] เราจะแข็งแกรงยิ่งขึ้น"
 NSB_soviet_fascist_tsarist.5.b: "เราไมตองพึ่งพวกรัสเซียก็แข็งแกรงได!"
 NSB_soviet_fascist_tsarist.6.t: "[FROM.GetNameDef] เขารวม[ROOT.GetFactionName]"
 NSB_soviet_fascist_tsarist.6.desc: "[FROM.GetNameDef] ไดตอบรับขอเสนอเปนพันธมิตรของเรา และเขารวมฝายของเราในทันที!"
 NSB_soviet_fascist_tsarist.6.a: "บัดนี้พวกเขาคือหัวหาดของเราในทวีปอเมริกา"
 NSB_soviet_fascist_tsarist.7.t: "[FROM.GetNameDef] ปฏิเสธคําเชิญ"
 NSB_soviet_fascist_tsarist.7.desc: "รัฐบาล[FROM.GetAdjective]แจงเราวาพวกเขาปฏิเสธขอเสนอเปนพันธมิตรของเรา พวกเขาเลือกที่จะยืนหยัดเพียงลําพังในทวีปอเมริกา"
 NSB_soviet_fascist_tsarist.7.a: "พวกโง!"
 NSB_soviet_fascist_tsarist.8.desc: "ดวยตระหนักวาในที่สุดเราก็มีโลกทัศนคลายคลึงกันแลว [FROM.GetNameDef] จึงเชิญเราเขารวม[FROM.GetFactionName] พรอมเสนอการสนับสนุนทางทหารและเศรษฐกิจตอไป ขณะที่เราแสวงหาอนาคตอันรุงโรจนใหแกชาติของเรา เชนเดียวกับที่พวกเขาเคยสนับสนุนใหพรรคของเราขึ้นสูอํานาจใน[ROOT.GetNameDef]!"
 NSB_soviet_fascist_tsarist.9.desc: "ในที่สุด[FROM.GetNameDef]ก็กลายเปนมหาอํานาจฟาสซิสต ดวยเหตุนี้พวกเขาจึงไดรับขอเสนอและตอบรับการเปนสมาชิกพันธมิตรของเรา"
 NSB_soviet_fascist_tsarist.10.desc: "ในที่สุด[FROM.GetNameDef]ก็กลายเปนมหาอํานาจฟาสซิสต แตแมเราจะชวยเหลือพรรคฟาสซิสตของพวกเขาใหขึ้นสูอํานาจและเสนอใหเปนสมาชิกพันธมิตรของเรา พวกเขากลับปฏิเสธคําเชิญและเลือกที่จะยืนหยัดเพียงลําพัง"
 NSB_soviet_fascist_tsarist.11.t: "การเสริมกําลังทางเรือของ[FROM.GetAdjective]"
 NSB_soviet_fascist_tsarist.11.desc: "มีรายงานวาพบเห็น[FROM.GetNameDef]กําลังขยายโครงสรางพื้นฐานทางเรือในตะวันออกไกลอยางมหาศาล นี่เปนลางรายตอสถานะเดิมในตะวันออกไกล..."
 NSB_soviet_fascist_tsarist.11.a: "พวกเขาคงหมายจะทาทายความเปนเจาของเราอยางไมตองสงสัย"
 NSB_soviet_fascist_tsarist.12.t: "โฆษณาชวนเชื่อตอตานญี่ปุนของ[FROM.GetAdjective]"
 NSB_soviet_fascist_tsarist.12.desc: "หนังสือพิมพ[FROM.GetAdjective]ตีพิมพบทความวิจารณการกระทําของ[ROOT.GetAdjective]ในตะวันออกไกลมากขึ้นเรื่อย ๆ และนักการเมืองของพวกเขาก็ใชถอยคําปลุกปนที่รุนแรงขึ้นในการประณามเรา พรอมตอกยํ้าใหชาว[FROM.GetAdjective]นึกถึงความพายแพอันนาคับแคนในสงครามป 1905 ผูปลุกปนที่เสียงดังที่สุดถึงกับเรียกรองให "ลางแคนสึชิมะ" แลว!"
 NSB_soviet_fascist_tsarist.12.a: "เราควรเตรียมพรอมทําสงครามกับศัตรูเกาของเรา..."
 NSB_soviet_fascist_tsarist.13.t: "การเสริมกําลังในคัมชัตคาของ[FROM.GetAdjective]"
 NSB_soviet_fascist_tsarist.13.desc: "รายงานระบุวา[FROM.GetNameDef]กําลังขยายโครงสรางพื้นฐานทางทหารในคัมชัตคาอยางมหาศาล นักวิเคราะหทางทหารชี้วาสิ่งกอสรางเหลานี้มีจุดประสงคเพียงเพื่อเพิ่มขีดความสามารถในการแผอํานาจทางทหารของ[FROM.GetAdjective]ตอกองกําลังของเราในอะแลสกา และในกรณีเลวรายที่สุด อาจใชเปนฐานกระโดดสําหรับการรุกรานโดยตรง!"
 NSB_soviet_fascist_tsarist.13.a: "เราควรดําเนินการตามขอมูลนี้..."
 NSB_soviet_fascist_tsarist.14.t: "การกลับมาของซาร"
 NSB_soviet_fascist_tsarist.14.desc: "ความอยุติธรรมที่ชาติของเราไดรับเมื่อหลายทศวรรษกอน บัดนี้ไดรับการแกไขในที่สุด ในพิธีอันยิ่งใหญและโออาสมพระเกียรติภายในมหาวิหารแหงการหลับใหล แกรนดดยุกวลาดีมีร คีรีลโลวิชไดรับการสวมมงกุฎเปนซารวลาดีมีรที่ 1 ทามกลางความปติยินดีอยางลนหลามของฝูงชน\n\nจากนั้น พระราชกรณียกิจแรกของซารคือการนําขบวนแหออกจากประตูเครมลิน ทักทายมวลชนที่โหรองยินดี และเสด็จทอดพระเนตรขบวนสวนสนามทางทหารอันนาประทับใจที่จัดขึ้นเพื่อถวายพระเกียรติดวยพระองคเอง\n\nในพระราชดํารัสอันงดงาม ซารองคใหมทรงยกยองคุณงามความดีของชาวรัสเซีย และทรงปฏิญาณวาจะนําชาติกลับสูเสนทางแหงการฟนคืนความรุงโรจนในอดีตอีกครั้ง"
 NSB_soviet_fascist_tsarist.14.a: "รุงโรจน!"
 NSB_soviet_fascist_tsarist.15.t: "พิธีราชาภิเษกของพระสังฆราชเมเลติอุส"
 NSB_soviet_fascist_tsarist.15.desc: "ขณะที่ความสําคัญของศาสนาเปนที่ประจักษมากขึ้นทั่วทั้งชาติ และสถานะของศาสนจักรไดกลับคืนมาเทาเดิม ไมสิ เหนือกวาเดิมเสียอีก ก็เปนเรื่องธรรมดาที่เราจะตอกยํ้าความภักดีตอพระเจาดวยการยกผูแทนสูงสุดของพระองคขึ้นเปนผูนําของชาติ\n\nวันนี้ ในพิธีอันยิ่งใหญสองพิธีที่มหาวิหารพระผูไถและมหาวิหารแหงการหลับใหลในมอสโก เมเลติอุสแหงฮารบินและแมนจูเรีย ผูไดรับเลือกเพื่อเปนเกียรติแกการรับใชอุดมการณของฝายพลัดถิ่น ไดรับการสถาปนาเปนพระสังฆราชแหงมอสโกและรัสเซียทั้งปวง และไดรับการสวมมงกุฎเปนซารแหงรัสเซียทั้งปวง\n\nดวยการรวมศาสนจักรและรัฐเขาเปนหนึ่งเดียวอยางสมบูรณในที่สุดนี้ ก็ไมมีอุปสรรคใดหลงเหลือตอการดําเนินตามพระประสงคของพระเจาบนเวทีแหงโลกนี้อีกตอไป..."
 NSB_soviet_fascist_tsarist.15.a: "Fiat voluntas tua, sicut in caelo, et in terra. (พระประสงคของพระองคจงสําเร็จในแผนดินโลกเหมือนในสวรรค)"
 NSB_soviet_fascist_tsarist.16.t: "ไตรภาคี"
 NSB_soviet_fascist_tsarist.16.desc: "หลังจากผานพนความวุนวายภายในและตั้งรัฐบาลใหมที่เปนมิตรกับเราไดแลว [SOV.GetNameDef] ไดยื่นขอเสนอใหเราฟนฟูพันธมิตรเกาขึ้นมาใหม เพื่อยับยั้งการรุกรานของ[GER.GetAdjective]ในยุโรป"
 NSB_soviet_fascist_tsarist.16.a: "เปนความคิดที่ยอดเยี่ยม!"
 NSB_soviet_fascist_tsarist.16.b: "เรายังไมลืมวาคําสัญญาของพวกเขามีคาแคไหนเมื่อครั้งกอน"
 NSB_soviet_fascist_tsarist.17.t: "ไตรภาคี - ขอเสนอไดรับการตอบรับ"
 NSB_soviet_fascist_tsarist.17.desc: "[FROM.GetNameDefCap] แจงเราวาพวกเขายอมรับขอเสนอเปนพันธมิตรของเรา และไดดําเนินการขยายความสัมพันธทางการทูตกับเราในทันที"
 NSB_soviet_fascist_tsarist.17.a: "นั่นจะทําใหพวกเยอรมันตองกังวลบางละ"
 NSB_soviet_fascist_tsarist.18.t: "ไตรภาคี - ขอเสนอถูกปฏิเสธ"
 NSB_soviet_fascist_tsarist.18.desc: "[FROM.GetNameDef] แจงเราวาพวกเขาไมเห็นประโยชนใด ๆ ในการเปนพันธมิตรกับเราในขณะนี้"
 NSB_soviet_fascist_tsarist.18.a: "ความลมเหลวทางการทูตอยางนาอนาถ..."
 NSB_soviet_fascist_tsarist.19.desc: "รัฐบาล[FROM.GetAdjective]และ[SOV.GetAdjective]ไดเปดการเจรจาเพื่อฟนฟูพันธมิตรไตรภาคีที่เคยมีอยูระหวางมหาอํานาจของเรา บัดนี้พวกเขาตั้งใจจะเดินหนาตามแผนนี้ และสงคําเชิญใหเราเขารวม"
 NSB_soviet_fascist_tsarist.19.a: "เราจะตกลง เพื่อเสถียรภาพของยุโรปในอนาคต"
 NSB_soviet_fascist_tsarist.19.b: "นาเสียดายที่ "ไตรภาคี" ของพวกเขาคงตองเหลือแคทวิภาคี"
 NSB_soviet_fascist_tsarist.20.a: "เมื่อรวมกัน เราแข็งแกรงที่สุด!"
 NSB_soviet_fascist_tsarist.21.a: "อยางนอยเราก็ยังมีรัสเซีย"
 NSB_soviet_fascist_tsarist.22.t: "อักษะเบอรลิน-มอสโก"
 NSB_soviet_fascist_tsarist.22.desc: "ผูแทน[SOV.GetAdjective]ไดติดตอเรามาพรอมขอเสนอเปนพันธมิตร พวกเขาเห็นวาเนื่องจากรัฐบาลใหมของพวกเขากับเรามีโลกทัศนและผลประโยชนคลายคลึงกัน จึงเปนการรอบคอบที่เราจะรวมมือกันอยางใกลชิดยิ่งขึ้นทั้งในดานเศรษฐกิจและการทหาร"
 NSB_soviet_fascist_tsarist.22.a: "อักษะใหมนี้คือแกนที่โลกจะหมุนรอบ!"
 NSB_soviet_fascist_tsarist.22.b: "พันธมิตรหรือ? เราวาไม"
 NSB_soviet_fascist_tsarist.23.t: "อักษะเบอรลิน-มอสโก: ขอเสนอไดรับการตอบรับ"
 NSB_soviet_fascist_tsarist.23.desc: "รัฐบาล[SOV.GetAdjective]แจงเราวายินดีเขารวมในการกอตั้งอักษะทางการทูตใหมของเรา พวกเขากําลังเตรียมการสงผูประสานงานทางการทูตและการทหารมาแลว"
 NSB_soviet_fascist_tsarist.24.t: "อักษะเบอรลิน-มอสโก: ขอเสนอถูกปฏิเสธ"
 NSB_soviet_fascist_tsarist.24.desc: "วันนี้นักการทูต[SOV.GetAdjective]แจงเราวารัฐบาลของพวกเขาปฏิเสธขอเสนอของเรา"
 NSB_soviet_fascist_tsarist.24.a: "นาเสียดายยิ่งนัก... คงไมใชสัญญาณของเจตนารายหรอกนะ?"
 NSB_soviet_fascist_tsarist.25.t: "อักษะโตเกียว"
 NSB_soviet_fascist_tsarist.25.desc: "ผูแทน[SOV.GetAdjective]ไดเสนอใหรวม[JAP.GetNameDef]เขาในพันธมิตรของเรา ดวยประวัติความสัมพันธอันตึงเครียดระหวาง[SOV.GetName]กับ[JAP.GetName] พวกเขาจึงเสนอวาเราควรเปนผูติดตอและไกลเกลี่ยระหวางสองมหาอํานาจ"
 NSB_soviet_fascist_tsarist.25.a: "เราจะสงทูตไปในทันที"
 NSB_soviet_fascist_tsarist.25.b: "เราเกรงวาผลประโยชนของเราไมสอดคลองกับของญี่ปุน"
 NSB_soviet_fascist_tsarist.26.t: "อักษะโตเกียว - [JAP.GetName] ตอบรับ"
 NSB_soviet_fascist_tsarist.26.desc: "เราไดรับคําตอบจากรัฐบาล[GER.GetAdjective]แลว พวกเขาแจงวาไดไกลเกลี่ยระหวางเรากับญี่ปุน และญี่ปุนไดตอบรับขอเสนอแลว!"
 NSB_soviet_fascist_tsarist.26.a: "ขาวดีเยี่ยม ปกตะวันออกของเราปลอดภัยแลว!"
 NSB_soviet_fascist_tsarist.27.t: "อักษะโตเกียว - [JAP.GetName] ปฏิเสธ"
 NSB_soviet_fascist_tsarist.27.desc: "รัฐบาล[GER.GetAdjective]แจงเราวา แมจะพยายามอยางเต็มที่แลว แตนาเสียดายที่ญี่ปุนปฏิเสธขอเสนอเปนพันธมิตรของเรา"
 NSB_soviet_fascist_tsarist.27.a: "ความลมเหลวครั้งใหญ..."
 NSB_soviet_fascist_tsarist.28.t: "อักษะโตเกียว - [GER.GetName] ปฏิเสธ"
 NSB_soviet_fascist_tsarist.28.desc: "รัฐบาล[GER.GetAdjective]ไดพิจารณาขอเสนอของเราที่จะใหญี่ปุนเปนสมาชิกพันธมิตรแลว แตขอแจงดวยความเสียใจวาในขณะนี้พวกเขาไมเห็นวาพันธมิตรดังกลาวเปนประโยชนตอตน"
 NSB_soviet_fascist_tsarist.28.a: "นาเสียดาย! พวกเขาคงมีเหตุผลที่ดี"
 NSB_soviet_fascist_tsarist.29.desc: "[GER.GetAdjective]ไดติดตอเรามาพรอมสิ่งที่พวกเขาบอกวาเปนขอเสนอของ[SOV.GetAdjective] ใหสามมหาอํานาจของเราเปนพันธมิตรกัน พวกเขาใหเหตุผลวาหากเราทั้งสามรวมกัน สวนที่เหลือของโลกก็ไมมีทางตานทานเราได"
 NSB_soviet_fascist_tsarist.29.a: "ขอใหพันธมิตรนี้เปนคําตอบสุดทายของการทูต!"
 NSB_soviet_fascist_tsarist.29.b: "ประวัติศาสตรบอกเราแลววาคณะสามผูนํามีจุดจบอยางไร... เราขอปฏิเสธ"
 NSB_soviet_fascist_tsarist.30.desc: "[JAP.GetName] แจงเราวาพวกเขาเลือกที่จะตอบรับขอเสนอของ[SOV.GetAdjective] และพรอมเขารวมพันธมิตรของเราโดยเร็วที่สุดเทาที่เราสะดวก"
 NSB_soviet_fascist_tsarist.30.a: "รุงโรจน!"
 NSB_soviet_fascist_tsarist.31.desc: "[JAP.GetName] แจงดวยความเสียใจวาพวกเขาเห็นวาขอเสนอของ[SOV.GetAdjective]ไมเปนประโยชนสูงสุดตอตนในขณะนี้ จึงจําตองปฏิเสธ"
 NSB_soviet_fascist_tsarist.31.a: "เราจะทําโดยไมมีพวกเขาก็ได"
 NSB_soviet_fascist_tsarist.32.t: "จับตัววลาซอฟได"
 NSB_soviet_fascist_tsarist.32.desc: "ระหวางการลาถอยครั้งลาสุดของขาศึก กองกําลังของเราไดจับตัวนายพลระดับสูงของ[SOV.GetAdjective]ไวได ขณะอยูในความควบคุมของเรา นายพลผูนี้ อันเดรย วลาซอฟ ไดประกาศตนวา "ตอตานบอลเชวิค" และเสนอที่จะจัดตั้งกองพลจากเชลยชาวรัสเซียจํานวนหนึ่งเพื่อรวมรบเคียงขางเราตอตาน "ลัทธิสตาลิน""
 NSB_soviet_fascist_tsarist.32.a: "พันธมิตรใดก็ตามที่ตอตานบอลเชวิคยอมเปนที่ตอนรับ"
 NSB_soviet_fascist_tsarist.32.b: "เราไวใจเขาไมได!"
 NSB_soviet_fascist_tsarist.33.desc: "เราไดรับขาววานายพล[SOV_andrey_vlasov.GetName]ของเราถูกกองกําลังขาศึกจับตัวไป เราไดแตคาดเดาชะตากรรมของเขา..."
 NSB_soviet_fascist_tsarist.33.a: "นาเสียดาย แตตอนนี้เรามีเรื่องใหญกวาใหกังวล!"

 nsb_news.301.t: "สาธารณรัฐแหงขุนเขารวมตัวกัน"
 nsb_news.301.d: "ดวยจิตวิญญาณของตาปา เชอรมอฟ สาธารณรัฐแหงขุนเขาไดรวมตัวกันอีกครั้งภายใตการนําของ[FROM.GetLeader] พวกเขาประกาศวาจะสูกับผูรุกรานตางชาติทุกรายที่ยางกรายเขามาในดินแดนคอเคซัสเหนือ และจะจารึกที่ยืนของตนไวในหนาประวัติศาสตร และแลว สาธารณรัฐแหงขุนเขาแหงคอเคซัสเหนือก็ถือกําเนิดขึ้น!"
 nsb_news.301.a: "เราจะไมแตกแยกอีกตอไป!"
 nsb_news.301.b: "นาสนใจ"

 nsb_news.302.t: "ทรานสคอเคเซียรวมตัวกันอีกครั้ง"
 nsb_news.302.d: "ครั้งแรกคือในชวงตนสงครามกลางเมืองรัสเซีย ซึ่งลมสลายไปอยางรวดเร็ว ครั้งที่สองคือในฐานะสาธารณรัฐโซเวียต ซึ่งถูกแยกออกหลังรัฐธรรมนูญโซเวียตป 1936 บัดนี้เปนครั้งที่สาม [FROM.GetLeader] ไดพยายามรวมประเทศในทรานสคอเคเซียเขาดวยกันอีกครั้ง และพวกเขาก็พรอมอีกครั้งที่จะไมเพียงปกปองดินแดนของตน แตยังขยายเขาไปในดินแดนของผูอื่นดวย มีเพียงเวลาเทานั้นที่จะบอกไดวาพวกเขาจะทําอะไร"
 nsb_news.302.a: "ครั้งที่สามตองสําเร็จ"
 nsb_news.302.b: "อีกแลวหรือ?"

 nsb_news.303.t: "ไซบีเรียรวมเปนหนึ่ง"
 nsb_news.303.d: "หลังจากอยูใตการปกครองของรัสเซียมาหลายศตวรรษ บัดนี้ไซบีเรียไมไดเปนเพียงภูมิภาคหนึ่งของมหาอํานาจตางชาติอีกตอไป แตเปนหนวยทางการเมืองที่รวมเปนหนึ่งและพรอมตอสูเพื่อสิทธิของตนไมวาจะตองแลกดวยอะไร ชาวไซบีเรียตางปติยินดี เพราะยุคแหงจักรวรรดินิยมไดสิ้นสุดลง และพวกเขาไดอยูในรัฐเอกราชที่ปราศจากการแทรกแซงจากตางชาติ อยางไรก็ตาม สาธารณรัฐไดประกาศวาจะไมนิ่งเฉย เพราะยังมีชาวไซบีเรียอีกมากที่ตองไดรับการปกปองและปลดปลอย ไมวาจะตองแลกดวยอะไรก็ตาม!"
 nsb_news.303.a: "ในที่สุด ไซบีเรียก็หลุดพนจากบังเหียนของจักรวรรดินิยม!"
 nsb_news.303.b: "อํานาจของรัสเซียทางตะวันออกกําลังเสื่อมถอย..."

 nsb_news.304.t: "อีเดล-อูราลกลับมาแลว"
 nsb_news.304.d: "เปนครั้งแรกนับตั้งแตสงครามกลางเมืองรัสเซีย ที่ชนชาติตาง ๆ ในภูมิภาควอลกา-อูราลไดรวมตัวกันอีกครั้งเปนรัฐที่เรียกวาอีเดล-อูราล ครั้งนี้พวกเขาประกาศวาจะไมยอมใหรัสเซียขัดขวาง และจะรักษาเอกราชไวไมวาจะตองแลกดวยอะไร มีเพียงอนาคตเทานั้นที่จะบอกไดวารัฐนี้จะอยูรอดหรือไม..."
 nsb_news.304.a: "ครั้งนี้เราจะไมแตกแยกอีก!"
 nsb_news.304.b: "เออ... ที่นั่นอยูตรงไหนนะ?"
 nsb_news.400.t: "พิธีราชาภิเษกของวลาดีมีรที่ 3"
 nsb_news.400.desc: "หลังจากอยูใตการปกครองของพวกบอลเชวิคมาเกือบสามทศวรรษ วันนี้[SOV.GetName]ไดหวนคืนสูระบอบซาร ดวยพิธีราชาภิเษกของซารวลาดีมีรที่ 3 อยางยิ่งใหญในมหาวิหารแหงการหลับใหลในมอสโก หลังขบวนเสด็จผานฝูงชน ซารองคใหมทรงมีพระราชดํารัสตอประชาชนที่มาเฝาชมพระบารมี ทรงยกยองจิตวิญญาณของชาวรัสเซีย และทรงปฏิญาณวาจะ 'นําชาติกลับคืนสูความรุงโรจนในอดีต'"
 nsb_news.400.a: "เหตุการณอันยิ่งใหญ!"
 nsb_news.400.b: "พวกกระหายสงคราม!"
 nsb_news.400.c: "เรื่องตลกราย!"
 nsb_news.401.t: "เซมสกีโซบอรถูกยุบ"
 nsb_news.401.desc: "เพียงไมกี่เดือนหลังจากสรางความชอบธรรมใหรัฐบาลดวยการฟนฟูเซมสกีโซบอร กลุมฟาสซิสตในรัฐบาล[SOV.GetAdjective]ก็ยุบสภาใหมนี้และนําชาติไปอยูใตการควบคุมของ[SOV.GetLeader]เสียแลว จนถึงขณะนี้ ซารที่เพิ่งไดรับการสวมมงกุฎยังคงทรงเปนประมุขในนาม แตเห็นไดชัดวาแทบไมมีอํานาจที่แทจริงเหลืออยู\n\nหลังการเปลี่ยนแปลงระบอบ วาทกรรมชาตินิยมไดเพิ่มขึ้นอยางเห็นไดชัด มีการกลาวสุนทรพจนยกยองภราดรภาพของ 'ชนชาติสลาฟ' และประณาม 'การลวงละเมิด' ในอดีตของมหาอํานาจเพื่อนบาน"
 nsb_news.401.a: "ชาติอันรุงโรจนของเราตองการผูนําที่เขมแข็ง!"
 nsb_news.401.b: "ยังตองรอดูวาสิ่งนี้จะทําใหสถานการณดีขึ้นหรือไม"
 nsb_news.401.c: "พันธมิตรใหมกําลังผงาดขึ้นหรือ?"
 nsb_news.402.t: "อักษะเบอรลิน-มอสโก"
 nsb_news.402.desc: "ในแถลงการณรวมเมื่อชวงตนวันนี้ โฆษกของ[GER.GetNameDef]และ[SOV.GetNameDef]ไดประกาศการกอตั้ง 'อักษะเบอรลิน-มอสโก' สองมหาอํานาจจะรวมมือกันทั้งดานเศรษฐกิจ การเมือง และการทหาร เพื่อ 'ปกปองผลประโยชนของตน' โดยอางวา 'หวงใยเสถียรภาพของยุโรปตะวันออกและยุโรปกลาง'\n\nยังตองรอดูวานี่สะทอนแรงจูงใจที่แทจริงของพวกเขาหรือไม"
 nsb_news.402.a: "พันธมิตรอันรุงโรจนของเราผงาดขึ้นแลว!"
 nsb_news.402.b: "ความคิดอันยอดเยี่ยมจากพันธมิตรใหมทางตะวันออกของเรา"
 nsb_news.402.c: "พวกเขากําลังสรางระเบียบโลกใหมหรือ?"
 nsb_news.402.d: "บัดนี้ยุโรปตกอยูในกํามือของพวกเขาแลว..."
 nsb_news.403.t: "การแทรกแซงของ[SOV.GetAdjective]ในทวีปอเมริกา"
 nsb_news.403.desc: "มีหลักฐานปรากฏวา[SOV.GetAdjective]ไดแทรกแซงกิจการการเมืองภายในของหลายประเทศในอเมริกาใตและอเมริกากลางอยางกวางขวาง ทั้งการใหทุนแกองคกรการเมืองฝายขวาและกลุมกึ่งทหาร การติดสินบน การหวานลอม และการเผยแพรขอมูลเท็จ ทําใหเสถียรภาพภายในของประเทศเหลานี้สั่นคลอนมากขึ้นเรื่อย ๆ\n\nผูเชี่ยวชาญเห็นพองกันวา หากกิจกรรมลับของ[SOV.GetAdjective]นี้ไมถูกหยุดยั้ง ยอมหลีกเลี่ยงไมไดที่อยางนอยบางประเทศจะกลายเปนฐานที่มั่นทางอุดมการณของ[SOV.GetName]ในทวีปอเมริกา และหากเปนเชนนั้น การสนับสนุนของ[SOV.GetAdjective]ตอประเทศเหลานี้ก็นาจะเพิ่มขึ้นและเปดเผยมากขึ้น"
 nsb_news.403.a: "นาเสียดายที่การเขาไปเกี่ยวของของเราถูกเปดโปง"
 nsb_news.403.b: "พวกเขามาแทรกแซงถึงหนาบานเราเลยหรือ?!"
 nsb_news.403.c: "อีกไมนานพวกเขาจะเห็นขอดีของผูนําที่เขมแข็ง"
 nsb_news.403.d: "การแพรขยายของลัทธิฟาสซิสตควบคุมไมอยูแลว!"
 nsb_news.404.t: "การผงาดของโรมที่สาม"
 nsb_news.404.desc: "นับตั้งแตสงครามกลางเมืองครั้งลาสุดสรางความเสียหายแกประเทศ ศาสนจักรออรโธด็อกซในรัสเซียก็ไดรับอํานาจเพิ่มขึ้นเรื่อย ๆ บัดนี้เมื่อพิชิตไบแซนไทนเกาไดสําเร็จ พวกเขาก็ไดดําเนินขั้นสุดทายสูการรวมศาสนจักรและรัฐเขาเปนหนึ่งเดียวโดยสมบูรณ\n\nหลังการสถาปนาเปนพระสังฆราชสูงสุดและการสวมมงกุฎเปนซารแหงรัสเซียทั้งปวงพรอมกัน บัดนี้[SOV.GetLeader]ไดนําประเทศที่เขาตั้งชื่อวา '[SOV.GetNameDef]' มุงสูสิ่งที่เขาเรียกวา 'พระประสงคของพระเจา'"
 nsb_news.404.a: "ยิ่งใหญตระการตา!"
 nsb_news.404.b: "พวกเขาคงไมไดพูดจริงหรอก!"
 nsb_news.405.t: "[SOV.GetNameDefCap]"
 nsb_news.405.desc: "หลังจากรับบทบาท 'ผูพิทักษชาวสลาฟทั้งปวง' อีกครั้ง รัสเซียตัดสินใจวาวิธีที่ดีที่สุดคือการรวมชนชาติสลาฟทั้งหมดไวในชาติเดียว\n\nเมื่อการรวมชาตินั้นสําเร็จในที่สุด [SOV.GetLeader] ไดประกาศการกอตั้ง[SOV.GetNameDef] พรอมปฏิญาณวา "ทรัพยากรทั้งหมดที่ชาติใหมมีจะถูกนํามาใชเพื่อประโยชนของประชาชน และปกปองชาติจากภัยคุกคามภายนอก""
 nsb_news.405.a: "เมื่อรวมกัน ชาวสลาฟไมมีวันพายแพ!"
 nsb_news.405.b: "พลังที่ตองเกรงขาม"
 nsb_news.406.t: "ผูพิทักษชาวสลาฟ"
 nsb_news.406.desc: "[SOV.GetNameDef]ไดรับบทบาท "ผูพิทักษชาวสลาฟ" อีกครั้ง โดยประกาศรับประกันชนชาติสลาฟอื่น ๆ ในยุโรป ในแถลงการณ [SOV.GetLeader] ปฏิญาณวา "ทรัพยากรทั้งหมดที่[SOV.GetNameDef]มีจะถูกนํามาใชเพื่อประโยชนของชนชาติสลาฟทั้งปวง และปกปองพวกเขาจากภัยคุกคามภายนอก"\n\nโดยยกการเขารวมมหาสงครามขึ้นมาเปนตัวอยางวาตนเปนประเทศที่รักษาคํามั่น รัฐบาล[SOV.GetAdjective]ดูจะตระหนักดีวาการรับประกันของตนอาจนําไปสูสิ่งใด และไมมีเจตนาจะหลีกเลี่ยงความรับผิดชอบ"
 nsb_news.406.a: "เรารักษาสัญญาที่ใหไวกับพี่นองของเรา"
 nsb_news.406.b: "ตราบใดที่พวกเขาเคารพเอกราชของเรา..."
 nsb_news.406.c: "พี่ใหญแหงชาวสลาฟกลับมาแลว..."
 nsb_news.407.t: "ไตรภาคีหรือ?"
 nsb_news.407.desc: "[From.GetNameDefCap]และ[SOV.GetNameDef]ไดประกาศฟนฟูความรวมมือทางทหาร สามทศวรรษหลังจากไตรภาคีเกาสิ้นสุดลง\n\nแมจะไมไดกลาวไวอยางเปดเผย แตพันธมิตรใหมนี้นาจะกอตั้งขึ้นเพื่อสกัดการขยายตัวของมหาอํานาจบางชาติในยุโรปกลาง ยังตองรอดูวาพันธมิตรนี้จะขยายตัวตอไปหรือไม"
 nsb_news.407.a: "กาวหนึ่งสูยุโรปที่มีเสถียรภาพ"
 nsb_news.407.b: "ซากจากอดีต..."
 nsb_news.408.t: "ไตรภาคี"
 nsb_news.408.desc: "[From.GetNameDefCap] ไดประกาศการตัดสินใจเขารวมกับอดีตพันธมิตรในไตรภาคีที่ฟนคืนขึ้นใหม ซึ่งมุงเปาไปที่กองกําลังผูขยายอํานาจในยุโรปกลางโดยตรง"
 nsb_news.408.a: "เรายืนหยัดเคียงขางกันอีกครั้ง"
 nsb_news.408.b: "มาดูกันวาอีกนานแคไหนจะแตกราว"
 nsb_news.409.t: "อักษะเบอรลิน-มอสโก: โตเกียวเขารวม"
 nsb_news.409.desc: "ในแถลงการณไตรภาคี รัฐบาลของ[GER.GetNameDef] [SOV.GetNameDef] และ[JAP.GetNameDef]ไดประกาศวา[JAP.GetNameDef]จะเปนสมาชิกรายตอไปของพันธมิตรฝายอักษะ\n\nแมจะเปนเรื่องเหนือความคาดหมายเมื่อพิจารณาความตึงเครียดเมื่อไมนานมานี้ระหวางรัฐบาล[SOV.GetAdjective]กับ[JAP.GetNameDef] (และนาจะเปนผลจากการเจรจาอยางหนักของ[GER.GetAdjective]) แตพัฒนาการใหมนี้จะชวยรักษาปกตะวันออกของ[SOV.GetAdjective]ไวได ขณะที่ทําให[JAP.GetNameDef]มุงความสนใจไปยังแปซิฟกได"
 nsb_news.409.a: "การเดินหมากทางการทูตที่ทรงพลัง"
 nsb_news.409.b: "พัฒนาการที่ไมคาดคิด!"
