 NSB_soviet_paranoia_system_events.24_paranoia_both_decrease_tt: "£SOV_paranoia_text_icon ความหวาดระแวงทางการเมืองลดลงตามระดับของผูนําหนวยที่ถูกกวาดลาง: §G[?SOV.SOV_combined_unit_leader_level]§!"
