l_english:
 BALTIC_events.1.t: "[From.GetNameDefCap]แสวงหาการรับประกัน"
 BALTIC_events.1.d: "เชานี้ โทรเลขจาก[From.GetNameDef]ถูกสงถึง [Root.GetLeader] ขอให[Root.GetNameDef]ตออายุการรับประกันเอกราชของ[From.GetAdjective] [From.GetLeader] อางถึงมิตรภาพอันยาวนานระหวาง[Root.GetNameDef]และ[From.GetNameDef]นับตั้งแตกอตั้งรัฐในป 1918 และยืนยันวาการอยูรอดของชาติ[From.GetLeader.GetHerHis]เปนสิ่งจําเปนยิ่งตอสันติภาพในยุโรปตะวันออก\n\nขณะที่ความตึงเครียดระหวาง[From.GetNameDef]กับ[SOV.GetNameDefCap]กําลังกอตัว การตอบรับขอเสนอของ [From.GetLeader] อาจนํา[Root.GetNameDef]เขาสูความขัดแยงกับชาว[SOV.GetAdjective]…"
 BALTIC_events.1.a: "เราจะปกปองมิตร[From.GetAdjective]ของเรา"
 BALTIC_events.1.b: "เราไมสนับสนุน [From.GetLeader] หรือรัฐบาลของ[From.GetLeader.GetHerHis]"
 BALTIC_events.101.t: "[From.GetNameDefCap]ตอบรับ!"
 BALTIC_events.101.d: "[From.GetLeader] ประกาศ[From.GetHerHis]สนับสนุนเอกราชของ[Root.GetAdjective]ตอไป และจะเขารวมความขัดแยงใด ๆ ที่คุกคามการดํารงอยูของ[Root.GetNameDef]"
 BALTIC_events.101.a: "เราปลอดภัยแลว"
 BALTIC_events.102.t: "[From.GetNameDefCap]ปฏิเสธ!"
 BALTIC_events.102.d: "ทามกลางความผิดหวังของ [Root.GetLeader] กระทรวงการตางประเทศ[From.GetAdjective]ตัดสินใจไมสานสัมพันธทางทหารกับ[Root.GetNameDef]"
 BALTIC_events.102.a: "เราตองหาทางออกอื่น"
 BALTIC_events.2.t: "[From.GetNameDefCap]แสวงหาความรวมมือบอลติก"
 BALTIC_events.2.d_baltic: "[From.GetLeader] และคณะรัฐมนตรีของ[From.GetHerHis]ไดยื่นขอเสนอตอรัฐบาล[Root.GetAdjective] ใหยกระดับความตกลงบอลติกที่หลวม ๆ ขึ้นเปนพันธมิตรทางทหารอยางเปนทางการ การลงนามในขอตกลงนี้หมายความวา ยามสงคราม กองทัพของเราจะรวมกําลังกันและเผชิญภัยคุกคามตออธิปไตยของเรารวมกัน\n\nแมจะมีลักษณะเชิงปองกัน แต [From.GetLeader] หวังวาในที่สุดจะยกระดับความตกลงบอลติกเปนฝายที่ครอบคลุมตั้งแตริกาไปจนถึงออสโล ทวาความทะเยอทะยานเชนนี้ดูไมนาจะเปนไปได"
 BALTIC_events.2.d_scandi: "[From.GetLeader] และคณะรัฐมนตรีของ[From.GetHerHis]ไดยื่นขอเสนอตอรัฐบาล[Root.GetAdjective] ใหยกระดับความตกลงบอลติกที่หลวม ๆ ขึ้นเปนพันธมิตรทางทหารอยางเปนทางการ การลงนามในขอตกลงนี้หมายความวา ยามสงคราม กองทัพของเราจะรวมกําลังกันและเผชิญภัยคุกคามตออธิปไตยของเรารวมกัน\n\n[From.GetLeader] ยืนยันวา เมื่อภัยคุกคามที่ชายแดนของพวกเขายึดครองสิ่งที่ตองการจากรัฐบอลติกไดแลว สแกนดิเนเวียยอมเปนเปาหมายถัดไปของความทะเยอทะยานในการทําสงครามอยางแนนอน และเปนการฉลาดที่เราจะยืนหยัดรวมกันอยางเขมแข็งในยามที่โลกเต็มไปดวยความขัดแยงเชนนี้"
 BALTIC_events.2.a: "เราจะเขารวม!"
 BALTIC_events.2.b: "เราคิดวาเรามีทางเลือกที่ดีกวานี้"
 BALTIC_events.202.a: "กลาดีอยางไรมาปฏิเสธเรา!"
 BALTIC_events.203.t: "ความตกลงบอลติกถูกลมเลิก!"
 BALTIC_events.203.d: "เมื่อไมสามารถรวบรวมการสนับสนุนไดมากพอที่จะตานทานการรุกรานของ[SOV.GetAdjective] [From.GetLeader] จึงตัดสินใจลมเลิกแนวคิดความตกลงบอลติกและหันไปหาทางเลือกอื่นแทน ทามกลางความผิดหวังของคนทั้งชาติ ความฝนที่จะยืนหยัดตอตานกองทัพ[SOV.GetAdjective]เคียงขางมิตรของเราใน[From.GetNameDef]ก็คงเปนไดเพียงความฝนเทานั้น"
 BALTIC_events.203.a: "นาผิดหวัง"
 BALTIC_events.3.t: "[From.GetNameDefCap]รองขอการแทรกแซงโดยตรง"
 BALTIC_events.3.d: "สงครามกลางเมืองระหวางกองทัพประชาชน[From.GetAdjective]ของ [From.GetLeader] กับเหลาชนชั้นกรรมาชีพที่หลงผิดซึ่งสูรบเพื่อเผด็จการกระฎมพีของ[From.GetNonIdeologyName]ยังคงดุเดือด แตดูเหมือนวา [From.GetLeader] จะพิสูจนแลววาไมสามารถนําการปฏิวัติไปสูชัยชนะไดดวยตนเอง สาสนฉบับหนึ่งจากเอกอัครราชทูต[Root.GetAdjective]ประจํา[From.GetNonIdeologyName]ถูกสงถึงโตะของ [Root.GetLeader] แสดงความกังวลตออนาคตของนักปฏิวัติ[From.GetAdjective] เขาเชื่อวาหากฝายปฏิวัติพายแพในสงครามกลางเมืองนี้ ความหวังที่สังคมนิยมจะประสบความสําเร็จใน[From.GetNonIdeologyName]ก็จะสิ้นสุดลง"
 BALTIC_events.3.a: "จําเปนตองลงมือโดยตรง!"
 BALTIC_events.3.b: "ชนชั้นกรรมาชีพตองปลดปลอยตนเองเทานั้น"
 BALTIC_events.301.t: "[From.GetNameDefCap]ปฏิเสธที่จะแทรกแซง"
 BALTIC_events.301.d: "มิตรและพันธมิตรของเราใน[From.GetNameDef]ตอบคํารองขอการแทรกแซงโดยตรงของ [Root.GetLeader] ดวยการปฏิเสธที่จะเขารวม [From.GetLeader] อางวาหากกรรมกร[Root.GetAdjective]จะไดรับการปลดปลอย พวกเขาตองทําดวยตนเอง และการแทรกแซงโดยตรงใด ๆ ในนามของ[From.GetNameDef]จะถือเปนการกระทําแบบจักรวรรดินิยม"
 BALTIC_events.301.a: "[From.GetLeader.GetSheHeCap]ก็มีเหตุผล"
 BALTIC_events.4.t: "คอมมิวนิสตเดินขบวนสู[Root.Capital.GetName]!"
 BALTIC_events.4.d: "ประชาชน[Root.GetAdjective]คับของใจตอรัฐบาลมากขึ้นเรื่อย ๆ และวันนี้ บนทองถนนของ[Root.Capital.GetName] ความตึงเครียดก็ถึงจุดเดือด การประทวงแสดงความไมพอใจตอระบอบและการปฏิบัติตอพลเมืองชนชั้นลางนําไปสูการปะทะรุนแรงหลายครั้งกับตํารวจทหาร[Root.GetAdjective] จนในที่สุดผูประทวงก็มาถึงอาคารรัฐสภาของ[Root.Capital.GetName] ขณะที่ [Root.GetLeader] และสมาชิกคนสําคัญหลายคนของพรรค[Root.GetRulingParty]กําลังประชุมกันอยู ขอเรียกรองของผูประทวงชัดเจนยิ่ง ขับ [Root.GetLeader] และพรรค[Root.GetRulingParty]ของ[Root.GetLeader.GetHerHis]ออกจากรัฐบาล หรือเผชิญกับการปฏิวัติอันรุนแรง"
 BALTIC_events.4.a: "เราไมมีทางเลือก"
 BALTIC_events.4.b: "สละอํานาจหรือ? ไมมีวัน!"
 BALTIC_events.5.t: "[From.GetNameDefCap]มุงสถาปนา[From.GetNonIdeologyName]-เบลารุส"
 BALTIC_events.5.d: "[From.GetLeader] ไดแรงบันดาลใจจากสาธารณรัฐสังคมนิยมโซเวียตลิทัวเนีย-เบลารุสที่มีอายุสั้นในอดีต จึงมุงรวม[From.GetNameDef]เขากับสาธารณรัฐสังคมนิยมโซเวียตเบลารุส [From.GetLeader.GetSheHeCap]อางวาการรวมสองชาติเขาดวยกันจะขยายขีดความสามารถของ[From.GetNameDef]ในการรับใชการปฏิวัติโลกอยางมาก ดวยการขจัดกําแพงกั้นระหวางตะวันออกกับตะวันตก"
 BALTIC_events.5.a: "ความคิดที่ยอดเยี่ยม!"
 BALTIC_events.5.b: "เบลารุสจะยังคงเปนของ[Root.GetAdjective]"
 BALTIC_events.501.t: "[From.GetNameDefCap]เห็นดวย!"
 BALTIC_events.501.d: "คําตอบจาก[From.GetNameDef]สงกลับมาแลวเกี่ยวกับคําขอของ[Root.GetAdjective]ที่จะกอตั้งสาธารณรัฐสังคมนิยมโซเวียต[Root.GetNonIdeologyName]-เบลารุสรวมกัน [From.GetLeader] ตื่นเตนกับโอกาสที่การรวมกันระหวางแผนดินใหญยุโรปตะวันออกกับชาติบอลติกจะนํามา โดยอางวาสหภาพเชนนี้จะเชื่อมชองวางระหวางตะวันออกกับตะวันตกไดอยางแนนอน และทําใหการเผยแพรการปฏิวัติไปทั่วทวีปงายขึ้น"
 BALTIC_events.501.a: "[Root.GetNonIdeologyName]ยิ่งใหญขึ้น!"
 BALTIC_events.502.t: "[From.GetNameDefCap]ปฏิเสธ!"
 BALTIC_events.502.d: "แมสาธารณรัฐสังคมนิยมโซเวียตลิทัวเนีย-เบลารุสดั้งเดิมจะกอตั้งขึ้นเพื่อเชื่อมชองวางระหวางตะวันออกกับตะวันตก แตดูเหมือนวา [From.GetLeader] จะไมเชื่อวาสิ่งนั้นจําเปนอีกตอไป และอางวาเบลารุสเปนสวนสําคัญของสหภาพโซเวียตที่ไมอาจยกให[Root.GetNameDef]ได"
 BALTIC_events.502.a: "อยางนอยเราก็ไดพยายามแลว"
 BALTIC_events.503.t: "สงครามโฆษณาชวนเชื่อในเบลารุส"
 BALTIC_events.503.d: "[From.GetNameDef]พยายามทวงคืนมรดกของสาธารณรัฐสังคมนิยมโซเวียตลิทัวเนีย-เบลารุส ดวยการบอนทําลายเสถียรภาพของรัฐบาลเบลารุส โดยยุยงใหสมาชิกรัฐบาลเบลารุสแปรพักตรไปเขากับ[From.GetNonIdeologyName]!"
 BALTIC_events.503.a: "เราจะจัดการเรื่องนี้ในไมชา"
 BALTIC_events.6.t: "[From.GetNameDefCap]แสวงหาการรวมชาติบอลติก"
 BALTIC_events.6.d: "รัฐบอลติกมีประวัติศาสตรรวมกันมายาวนานในการทนทุกขและถูกกดขี่ภายใตรองเทาบูตของจักรวรรดินิยมตางชาติ แตจะไมอีกแลว [Root.GetNameDefCap]และ[From.GetNameDef]ตางไดรับการปลดปลอยภายใตสังคมนิยม แต [From.GetLeader] อางวานี่ไมไดรับประกันวารัฐบอลติกจะอยูรอดตอไป [From.GetLeader.GetSheHeCap]อางวา ตราบใดที่รัฐบอลติกยังแบงแยกตามเสนแบงของชาติ เราก็ทําใหตัวเองออนแอและเปราะบางตอจักรวรรดินิยมและทุนนิยม และมีเพียงการรวมเปนสาธารณรัฐบอลติกหนึ่งเดียวเทานั้นที่จะทําใหเราตานทานการบุกกระหนํ่าของผูรุกรานตางชาติได"
 BALTIC_events.6.a: "[From.GetLeader] พูดถูก เราตองรวมชาติ!"
 BALTIC_events.6.b: "ไมมีทาง! [Root.GetNonIdeologyName]จะยังคงเปนของ[Root.GetAdjective]!"
 BALTIC_events.601.t: "[From.GetNameDefCap]ปฏิเสธ!"
 BALTIC_events.601.d: "[From.GetLeader] ตอบคําขอรวมชาติของ[Root.GetAdjective]ดวยความรังเกียจและการปฏิเสธอยางสิ้นเชิง แมหลายคนจะเคารพสิทธิ์ในการปกครองตนเองของ[From.GetNameDef] แตก็ปฏิเสธไมไดวารัฐบอลติกจะดีกวาหากเปนกําลังที่รวมกันมากกวาแตกแยก"
 BALTIC_events.601.a: "เราจะชวยพวกเขาใหพนจากตัวพวกเขาเอง"
 BALTIC_events.601.b: "อยางไรเสียพวกเขาก็มีสิทธิ์กําหนดชะตากรรมของตนเอง"
 BALTIC_events.7.t: "[From.GetNameDefCap]รองขอการบุก[baltic_wargoal_target.GetAdjective]"
 BALTIC_events.7.d: "[From.GetNameDefCap] ประตูสูยุโรปตะวันตกของ[Root.GetAdjective] ไดเสนอแผนบุก[baltic_wargoal_target.GetNameDef]ในนามของ[Root.GetNameDefCap]ในวันนี้ [From.GetLeader] อางวาการบุก[baltic_wargoal_target.GetAdjective]จะมีคุณคาอยางยิ่งตอความพยายามรวมกันในการเผยแพรการปฏิวัติไปทั่วยุโรป และจะเปดโอกาสในการขยายดินแดนมากขึ้นเมื่อรัฐบาล[baltic_wargoal_target.GetAdjective]ถูกรื้อถอนแลว"
 BALTIC_events.7.a: "ยอดเยี่ยม!"
 BALTIC_events.7.b: "การปฏิวัติรอได"
 BALTIC_events.701.t: "[From.GetNameDefCap]ขัดขวางการบุก[baltic_wargoal_target.GetAdjective]"
 BALTIC_events.701.d: "คําขอของ[Root.GetAdjective]ที่จะบุก[baltic_wargoal_target.GetNonIdeologyName]ถูก[From.GetNameDef]ขัดขวาง โดยอางวาการบุกจะสิ้นเปลืองและไมคุมคาเลยกับชีวิตชาว[From.GetAdjective]และชาว[Root.GetAdjective]ที่ตองสูญเสียไป วันนี้[baltic_wargoal_target.GetNameDef]จึงไมตองเผชิญกับกองกําลังปฏิวัติคอมมิวนิสตใด ๆ"
 BALTIC_events.701.a: "ชางเถอะ..."
 BALTIC_events.11.t: "โฆษณาชวนเชื่อของพี่นองแหงปา"
 BALTIC_events.11.d: "สิ่งพิมพตอตานคอมมิวนิสตจํานวนหนึ่งไดตกไปถึงมือพลเมือง[Root.GetAdjective]ทั่วประเทศ โฆษณาชวนเชื่อนี้โจมตีตัวตนของ [Root.GetLeader] โดยตรง กลาวหาวา[Root.GetLeader.GetHerHim]เปนคนทรยศและเปนเครื่องมือของ[SOV.GetAdjective] เนื้อหาของสิ่งพิมพเหลานี้เชิดชูชาตินิยม[Root.GetAdjective] และปฏิเสธคุณคาสากลของการปฏิวัติคอมมิวนิสต ไมตองสงสัยเลยวาการแจกจายสิ่งพิมพเหลานี้อยางลับ ๆ ยอมปลุกกระแสชาตินิยมใหแรงขึ้น"
 BALTIC_events.11.a: "พวกทรยศ!"
 BALTIC_events.12.t: "พี่นองแหงปาจูโจมครั้งใหญใน[forest_brothers_raid_state_target.GetName]"
 BALTIC_events.12.d: "พวกเขามาราวกับโผลมาจากความวางเปลา โจมตีเขตอุตสาหกรรมสําคัญหลายแหงใน[forest_brothers_raid_state_target.GetName] สรางความเสียหายรายแรงแกอุปกรณภายใน โชคดีที่การโจมตีเกิดขึ้นตอนกลางคืนขณะที่โรงงานปดทําการ แตความเสียหายตอทรัพยสินของรัฐก็มหาศาล"
 BALTIC_events.12.a: "พวกทรยศชนชั้นทั้งสิ้น"
 BALTIC_events.13.t: "ปะทะกับพี่นองแหงปา"
 BALTIC_events.13.d: "ขณะลาดตระเวนใน[forest_brothers_raid_state_target.GetName] กองรักษาการณถูกพี่นองแหงปาซุมโจมตี แมความเสียหายฝายเราจะแทบไมมีนัยสําคัญ แตขาวการปะทะไดแพรสะพัดอยางรวดเร็วในหมูชาวบาน และหลายคนเริ่มมองพี่นองแหงปาวาเปนวีรบุรุษแหงชาตินิยม[Root.GetAdjective] ทาทายความชอบธรรมในการเปนผูนําของ [Root.GetLeader]"
 BALTIC_events.13.a: "ใหตายเถอะ!"
 BALTIC_events.14.t: "พี่นองแหงปาลักลอบขนยุทโธปกรณ"
 BALTIC_events.14.d: "ตลอดหลายสัปดาหที่ผานมา ปนเล็กยาวและยุทโธปกรณทางทหารอื่น ๆ จํานวนหนึ่งไดหายไปจากสายการผลิต ถูกนําออกจากโรงงานโดยไมเคยไปถึงมือกองทัพแดง[Root.GetAdjective] ตนตอของยุทโธปกรณที่หายไปถูกเปดโปงแลววาคือพี่นองแหงปา แมรัฐบาลจะรูตัวผูกระทําผิดแลว แตก็ตองใชเวลาหลายสัปดาหในการคุมเขมสายการผลิต เพื่อใหแนใจวาจะไมมีกระสุนแมแตนัดเดียวหลุดไปถึงลํากลองปนของพี่นองแหงปา"
 BALTIC_events.14.a: "เราจะกําจัดพวกทรยศเหลานี้!"
 BALTIC_events_7_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกฟนแลนด§!'"
 BALTIC_events_8_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกเดนมารก§!'"
 BALTIC_events_9_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกสวีเดน§!'"
 BALTIC_events_10_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกโปแลนด§!'"
 BALTIC_events_15_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกลิทัวเนีย§!'"
 BALTIC_events_16_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกลัตเวีย§!'"
 BALTIC_events_17_tt: "ไดรับเหตุการณ '§Y[Root.GetNameDefCap]รองขอการบุกเอสโตเนีย§!'"
 BALTIC_events.18.t: "สงครามโฆษณาชวนเชื่อ"
 BALTIC_events.18.d: "[From.GetNameDefCap]เริ่มแทรกแซงการเมือง[Root.GetAdjective] ดวยการเผยแพรโฆษณาชวนเชื่อคอมมิวนิสตไปตามทองถนนและติดอาวุธใหผูเห็นตาง มีเพียงการตอบโตโฆษณาชวนเชื่อนี้เทานั้นที่จะทําใหเรามีหวังสั่งหามมันโดยเด็ดขาดและกําจัดภัยคุกคามจาก[From.GetAdjective]ใหสิ้นซาก"
 BALTIC_events.18.a: "[Root.GetNameDefCap]จะไมมีวันเปนคอมมิวนิสต!"
 BALTIC_events.19.t: "[SOV.GetNameDefCap]มอบ[BALTIC_country_to_transfer.GetNonIdeologyName]ใหเราดูแล"
 BALTIC_events.19.desc: "วันนี้เปนวันยิ่งใหญของ[ROOT.GetNameDef]! หลังการรบอันกลาหาญของเหลาสหาย [SOV.GetNameDefCap]ไดประกาศอยางชอบธรรมวา[BALTIC_country_to_transfer.GetNonIdeologyName]ที่เพิ่งไดรับการปลดปลอย พรอมดวยกรรมกรผูกลาหาญ จะอยูภายใตเขตอํานาจของเรา[GetExtraBalticTerritories]\n\nสิ่งนี้นําเราเขาใกลรัฐบอลติกที่เปนหนึ่งเดียวและทรงพลังพอจะตอสูกับศัตรูของชนชั้นแรงงานอีกกาวหนึ่ง"
 BALTIC_events.19.extra: "นอกจากนี้ พวกเขายังโอนการควบคุมดินแดน[BALTIC_loose_territory_country.GetNonIdeologyAdjective]ที่ยึดครองไวใหแกเรา เราจึงตองพิสูจนตอไปวาเราคูควรที่จะเปนผูดูแล[BALTIC_loose_territory_country.GetNonIdeologyName]อยางถาวร"
 BALTIC_events.19.a: "เปนทางเลือกที่สมเหตุสมผลที่สุด!"
 BALTIC_entente_events.1.t: "[From.GetNonIdeologyName]ลงทุนในสหภาพบอลติก"
 BALTIC_entente_events.1.d: "ในฐานะผูนําสหภาพบอลติก [From.GetNameDef]ไดใหทุนแกโครงการริเริ่มใหมสําหรับรัฐสมาชิกของสหภาพ ทุนนี้เปนประโยชนรวมกันแก[Root.GetNameDef]และ[From.GetNameDef] และแสดงถึงความมุงมั่นตอเสรีภาพและการพัฒนาอยางตอเนื่องของชาติเรา!"
 BALTIC_entente_events.1.a: "เราแข็งแกรงขึ้นไปดวยกัน"
 BALTIC_entente_events.1.b: "โอกาสฟนฟูประชาธิปไตย!"
 BALTIC_entente_events.6.t: "[From.GetNonIdeologyName]เสนอการรวมชาติ"
 BALTIC_entente_events.6.d: "ความตกลงบอลติกพัฒนาไปอยางมากนับตั้งแตเริ่มตนเปนพันธมิตรหลวม ๆ ระหวางรัฐบอลติก บัดนี้ รัฐบอลติกผูกพันกันทางการเมืองแนนแฟนจนแทบจะเปนชาติเดียวกัน ดูเหมือนวา [From.GetLeader] เสนอใหสหภาพนี้พัฒนาเปนชาติที่สมบูรณในตัวเอง รวมรัฐบอลติกเขาดวยกันทั้งดานการทหารและการปกครองพลเรือน"
 BALTIC_entente_events.6.a: "ความริเริ่มที่ยอดเยี่ยม!"
 BALTIC_entente_events.6.b: "ไมมีทางเด็ดขาด!"
 LIT_events.1.t: "การแบงแยก[POL.GetNameDef]ระหวาง[SOV.GetAdjective]-[LIT.GetAdjective]"
 LIT_events.1.d: "เปนที่ชัดเจนยิ่งวา [LIT.GetLeader] ตองการรวมรัฐ[LIT.GetAdjective]เขากับวิลนีอุส เมืองหลวงเกาอีกครั้ง เมื่อลําพังตนเองแทบไมเปนภัยตอ[POL.GetNameDef]เลย ชาว[LIT.GetAdjective]จึงหวังจะแบงแยกชาตินั้นรวมกับ[Root.GetNameDef] โดยใหยูเครนและเบลารุสของ[POL.GetAdjective]รวมเขากับ[Root.GetNameDefCap] และวิลนีอุสกลับคืนสู[LIT.GetNameDef]\n\nแนนอนวา[POL.GetNameDefCap]อาจปฏิเสธคําขาดรวมนี้ และการปฏิเสธดังกลาวจะนําไปสูภาวะสงครามระหวาง[POL.GetNameDef]กับ[Root.GetNameDef]"
 LIT_events.1.a: "ขอเสนอที่ยอดเยี่ยม!"
 LIT_events.1.b: "เราจะไมลงนามขอตกลงใด ๆ กับ [LIT.GetLeader]"
 LIT_events.101.t: "คําขาดของ[SOV.GetAdjective]-[LIT.GetAdjective]"
 LIT_events.101.d: "นับตั้งแตป 1920 วิลโนอยูภายใตการควบคุมของ[Root.GetNameDef] สรางความขุนเคืองไมหยุดหยอนแก[LIT.GetNameDef]ที่มองวาเมืองนี้คือเมืองหลวงอันชอบธรรมของชาติตน บัดนี้ความตึงเครียดถึงจุดเดือดแลว และดวยความชวยเหลือจากใครไมไดนอกจาก [SOV.GetLeader] ชาวลิทัวเนียจึงเรียกรองใหแบงโปแลนดตะวันออกระหวางชาว[SOV.GetAdjective]และลิทัวเนีย หากเรายอมรับ เราตองยกโปแลนดตะวันออกใหทั้งหมด แตหากเราปฏิเสธ เราจะกลายเปนเปาหมายหลักของพันธมิตร[SOV.GetAdjective]-[LIT.GetAdjective]"
 LIT_events.101.a: "เรายอมแพ!"
 LIT_events.101.b: "ไมมีทางยอมโดยไมสู!"
 LIT_events.102.t: "[From.GetNameDefCap]ตอบรับ!"
 LIT_events.102.d: "[SOV.GetNameDefCap]ตกลงรวมแบงแยก[POL.GetNameDef]กับเราแลว สิ่งที่เหลืออยูตอนนี้คือการยื่นขอเรียกรองของเราตอชาว[POL.GetAdjective]"
 LIT_events.102.a: "วิลนีอุสอยูในกํามือเราแลว!"
 LIT_events.103.t: "[From.GetNameDefCap]ปฏิเสธ!"
 LIT_events.103.d: "[SOV.GetNameDefCap]ปฏิเสธที่จะรวมแบงแยก[POL.GetNameDef]กับเรา แมเรายังมีอิสระที่จะทําสงครามกับ[POL.GetNameDef] แตรัฐมนตรีของเรามั่นใจวาสงครามเชนนั้นจะจบลงดวยความพายแพ"
 LIT_events.103.a: "ใหตายเถอะ!"
 LIT_events.104.t: "[POL.GetNameDefCap]ปฏิเสธ!"
 LIT_events.104.d: "แมจะเผชิญกับสถานการณที่เสียเปรียบอยางทวมทน [POL.GetNameDef]ก็ปฏิเสธที่จะยอมตามขอเรียกรองของเรา!"
 LIT_events.104.a: "ถาอยางนั้นก็สงคราม!"
 LIT_events.104.b: "เรื่องนี้ไมคุมกับแรงที่เสียไป"
 LIT_events.2.t: "[From.GetNameDefCap]ขอสันติภาพ"
 LIT_events.2.d: "แมจะไมมีการสูรบมาหลายปแลว แตในทางเทคนิค[Root.GetNonIdeologyName]และ[From.GetNonIdeologyName]ยังไมเคยลงนามขอตกลงสันติภาพอยางเปนทางการ วันนี้ [From.GetLeader] ไดขอให[From.GetNameDef]และ[Root.GetNameDef]ยุติความเปนปรปกษและกาวตอไปในฐานะพันธมิตรเพื่อตอตานภัยคุกคามที่เพิ่มขึ้นตามพรมแดนรวมกัน แม [From.GetLeader] ยังคงอางวาวิลโนคือเมืองหลวงอันชอบธรรมของ[From.GetNonIdeologyName] แต[From.GetLeader.GetSheHe]ไดแสดงออกวาเปนประโยชนสูงสุดของทั้งสองชาติที่จะวางอาวุธอยางเปนทางการและประกาศสันติภาพ"
 LIT_events.2.a: "[From.GetLeader.GetSheHeCap]ก็มีเหตุผล"
 LIT_events.2.b: "เราไมคิดอยางนั้น"
 LIT_events.201.d: "[From.GetLeader] ดูเหมือนจะเห็นพองกับความรูสึกของรัฐมนตรี[Root.GetAdjective] และตัดสินใจสรางสันติภาพอันเปนมิตรกับ[Root.GetNameDef]ไปกอนในตอนนี้ พรอมกับสันติภาพนี้ยังมีการรับประกันเอกราชซึ่งกันและกัน ยามสงคราม เราสามารถพึ่งพามิตรของเราใน[From.GetNameDef]ใหมาชวยเหลือได!"
 LIT_events.201.a: "ยอดเยี่ยม!"
 LIT_events.202.d: "[From.GetNameDefCap]ปฏิเสธที่จะลงนามสนธิสัญญาสันติภาพอยางเปนทางการใด ๆ กับ[Root.GetNameDef] ดูเหมือนสงครามเย็นนี้จะดําเนินตอไปอยางไมมีกําหนด"
 LIT_events.202.a: "ก็ได บางทีเราอาจไมยอมรับคําปฏิเสธ"
 LIT_events.3.t: "[From.GetNameDefCap]ขอสันติภาพถาวร"
 LIT_events.3.d: "ประเด็นขัดแยงระหวาง[Root.GetNonIdeologyName]และ[From.GetNonIdeologyName]ตลอดทศวรรษที่ผานมาคือการที่[Root.GetAdjective]ยึดครองวิลนีอุส เมืองหลวงดั้งเดิมของ[From.GetNonIdeologyName] บัดนี้เมื่อสองชาติมีความสัมพันธอันดีตอกัน [From.GetLeader] จึงเสนอสันติภาพถาวร โดยมีเงื่อนไขวา[Root.GetNameDef]ตองยกการควบคุมวิลนีอุสและสละการอางสิทธิ์ทั้งหมดเหนือดินแดน[From.GetAdjective] [From.GetLeader] อางวาการปฏิเสธจะเปนเรื่องนาผิดหวัง แตจะไมทําให[From.GetNonIdeologyName]ทําสงครามกับ[Root.GetNameDef]"
 LIT_events.3.a: "ฟงดูสมเหตุสมผล"
 LIT_events.3.b: "ชางไรสาระ"
 LIT_events.301.d: "ในที่สุด ขอตกลงสันติภาพระหวาง[Root.GetNonIdeologyName]และ[From.GetNonIdeologyName]ก็บรรลุผล และความขัดแยงที่คุกรุนอยางเงียบ ๆ มาตั้งแตการกอตั้ง[Root.GetNameDef]ดูเหมือนจะสิ้นสุดลงแลว แมความทะเยอทะยานที่จะฟนเครือจักรภพยังคงอยูในใจชาว[From.GetAdjective]จํานวนมาก แตเรามั่นใจวานี่คือเครือจักรภพรูปแบบใหม ที่ตั้งอยูบนความเคารพซึ่งกันและกันระหวางพันธมิตร"
 LIT_events.301.a: "สันติภาพในยุคของเรา!"
 LIT_events.302.d: "[From.GetLeader] ปฏิเสธที่จะยอมรับการอางสิทธิ์ของ[Root.GetNameDef]เหนือเมืองหลวงทางประวัติศาสตรของ[Root.GetAdjective] แมสิ่งนี้จะไมทําใหความสัมพันธอันสงบสุขระหวางสองชาติสิ้นสุดลง แตก็ปฏิเสธไมไดวามันไดจุดประกายความไมไววางใจที่[Root.GetNameDef]มีตออดีตคูปรับขึ้นมาอีกครั้ง"
 LIT_events.302.a: "นาผิดหวัง"
 LIT_events.4.t: "[From.GetNameDefCap]เสนอสิทธิ์ตั้งฐานทัพ!"
 LIT_events.4.d: "ดวยความหวาดกลัวการรุกราน รัฐมนตรีของ[From.GetNameDef]จึงเสนอใหกองทหาร[Root.GetAdjective]ตั้งฐานภายในพรมแดนของ[From.GetNonIdeologyName] เพื่อแลกกับการที่รัฐบาล[From.GetAdjective]คาดหวังให[Root.GetNameDef]ปกปองพวกเขาจากผูใดก็ตามที่คุกคามอธิปไตย ทวาเมื่อมีกองทหารอยูในพรมแดนแลว [From.GetNameDef]ก็แทบไมมีกําลังจะขัดขืนขอเรียกรองใด ๆ ของ[Root.GetAdjective]ไดเลย…"
 LIT_events.4.a: "ฟงดูเหมือนโอกาสทอง!"
 LIT_events.4.b: "เราไมคิดอยางนั้น"
 LIT_events.401.d: "[From.GetNameDefCap]ปฏิเสธขอเสนออันเอื้อเฟอของเรา โดยอางวาไมตองการถูกลากเขาสูความขัดแยงใด ๆ แทน[Root.GetNonIdeologyName]"
 LIT_events.5.t: "[From.GetNameDefCap]เรียกรอง[784.GetName]"
 LIT_events.5.desc: "นับตั้งแตการรุกวิลนาในป 1919 เมืองหลวงดั้งเดิมของลิทัวเนียก็ตกอยูในมือของ[Root.GetNameDef] และกลายเปนประเด็นขัดแยงระหวางสองชาติของเรามาตลอดหลายทศวรรษนับแตนั้น\n\nสงครามเย็นเหนือเมืองนี้ดําเนินมาตลอด และวันนี้ [From.GetLeader] ขูวาหากไมยกเมืองนี้ให[From.GetNameDef] สงครามจะเปนสิ่งที่หลีกเลี่ยงไมได\n\nเมืองนี้มีประโยชนตอเราไมมากนัก แตเปนลมหายใจสุดทายของเครือจักรภพในอดีต เราพรอมจะสละความฝนแหงโปแลนด-ลิทัวเนียเพื่อแลกกับสันติภาพจริงหรือ?"
 LIT_events.5.a: "มันเปนเมืองไรคา เอาไปเถอะ"
 LIT_events.5.b: "เราจะไมมีวันยอมจํานน"
 LIT_events.501.t: "วิลนีอุสกลับคืนมาแลว!"
 LIT_events.501.desc: "[From.GetNameDefCap]ตกลงคืนวิลนีอุสอยางสันติ ถือเปนการยุติสงครามเย็นหลายทศวรรษระหวางสองชาติของเราอยางเปนทางการ เมื่อวิลนีอุสกลับคืนมา ลิทัวเนียก็กลับมาสมบูรณอีกครั้งในที่สุด"
 LIT_events.502.desc: "ไมนาแปลกใจที่[From.GetNameDef]ปฏิเสธขอเรียกรองของ [Root.GetLeader] ที่ใหคืนวิลนีอุสแก[Root.GetNameDef] แมการทูตจะลมเหลว แต [Root.GetLeader] ยังไมตัดความเปนไปไดของสงคราม และเมื่อความตึงเครียดตามชายแดนเพิ่มสูงขึ้น สงครามก็ดูเหมือนจะหลีกเลี่ยงไมได"
 LIT_events.502.a: "สงครามหรือ? เราเรียกมันวาการเจรจาเชิงรุก"
 LIT_events.6.t: "[From.GetNameDefCap]เสนอสันนิบาตอํานาจสูงสุดโปแลนด-ลิทัวเนีย"
 LIT_events.6.d: "วันนี้โทรเลขจาก[From.Capital.GetName]มาถึง พรอมขอเสนอให[Root.GetNonIdeologyName]และ[From.GetNonIdeologyName]รวมกันเปนฝายใหมที่สามารถตอกรกับทั้ง[GER.GetNameDef]และ[SOV.GetNameDef] ในฐานะรัฐชาตินิยมที่ติดอยูระหวางสองมหาอํานาจนี้ ทั้งสองชาติตางโดดเดี่ยวทางการทูตจากมหาอํานาจของยุโรป และมหาอํานาจประชาธิปไตยทางตะวันตกก็คงไมเต็มใจเขารวมความขัดแยงเพื่อปกปองชาติฟาสซิสตสองชาติ\n\n[From.GetLeader] เสนอทางเลือกแทนความขัดแยงหลายปที่เปนลักษณะของความสัมพันธ[Root.GetAdjective]-[From.GetAdjective]นับแตกอตั้งรัฐทั้งสอง [From.GetLeader.GetSheHeCap]เสนอใหชาติของเรารวมกันเปนสันนิบาตอํานาจสูงสุดโปแลนด-ลิทัวเนีย พันธมิตรที่ตั้งอยูบนหลักการของเครือจักรภพ แตใหคุณคากับคุณธรรมแหงชาตินิยม"
 LIT_events.6.a: "ชางเปนแรงบันดาลใจ!"
 LIT_events.6.b: "เราไมคิดอยางนั้น"
 LIT_events.601.t: "[From.GetNameDef]เขารวมสันนิบาต"
 LIT_events.601.d: "ไมนาแปลกใจที่ชาวโปแลนดตกลงเขารวมสันนิบาตอํานาจสูงสุดโปแลนด-ลิทัวเนีย แมนี่จะยังไมใชวิสัยทัศนสุดทายของลิทัวเนียตอชะตากรรมของโปแลนด แตก็เปนกาวแรกที่สําคัญยิ่งในการรักษาอนาคตของบอลติก"
 LIT_events.601.a: "ทุกอยางกําลังลงตัว"
 LIT_events.602.t: "[From.GetNameDefCap]ปฏิเสธสันนิบาต"
 LIT_events.602.d: "ทามกลางความตกตะลึงของรัฐมนตรี[Root.GetAdjective] [From.GetNameDef]ปฏิเสธที่จะเขารวมสันนิบาตอํานาจสูงสุดโปแลนด-ลิทัวเนีย ดูเหมือนความตึงเครียดระหวางสองชาติจะยังไมใกลคลี่คลาย และการปฏิเสธความรวมมือนี้มีแนวโนมจะนําไปสูการกลับมาของความขัดแยงรุนแรงในอนาคตอันใกล"
 LIT_events.602.a: "บางทีอาจตองโนมนาวพวกเขาสักหนอย"
 LIT_events.7.t: "[From.GetNameDefCap]ขอให[POL.GetAdjective]เขารวม[Root.GetFactionName]"
 LIT_events.7.d: "ดวยความกระตือรือรนในการแสวงหาความรวมมือ[From.GetAdjective]-[POL.GetAdjective] รัฐมนตรีตางประเทศ[From.GetAdjective]ไดติดตอเจาหนาที่[Root.GetAdjective]ในวันนี้ เพื่อขอใหเชิญ[POL.GetNameDef]เขารวม[Root.GetFactionName]"
 LIT_events.7.a: "ขอเสนอที่ยอดเยี่ยม!"
 LIT_events.7.b: "เรามีแผนอื่นสําหรับโปแลนด"
 LIT_events.701.t: "[From.GetNameDefCap]ขัดขวางการเขารวม[From.GetFactionName]ของ[POL.GetAdjective]"
 LIT_events.701.d: "นาเสียดายที่ดูเหมือนผูนําของ[From.GetFactionName]จะมองวาการเขารวม[From.GetFactionName]ของ[POL.GetAdjective]เปนอุปสรรคตอผลประโยชนสูงสุดของฝาย เห็นไดชัดวา[From.GetNameDef]มีแผนอื่นสําหรับ[POL.GetNameDef]"
 LIT_events.701.a: "ชางเถอะ"
 LIT_events.8.t: "[From.GetNameDefCap]เรียกรองการรวมชาติ"
 LIT_events.8.d: "เจาหนาที่[Root.GetAdjective]พยายามฟนฟูเครือจักรภพในอดีตมานาน แตก็ถูกชาวลิทัวเนียปฏิเสธมาโดยตลอด อยางไรก็ตาม วันนี้ [From.GetLeader] ไดตัดสินใจครั้งประวัติศาสตรเสนอการรวมโปแลนดและลิทัวเนียอีกครั้ง แตที่นาฉงนคือ ขอเสนอนี้ไมไดใหชาวโปแลนดและชาวลิทัวเนียอยูในฐานะเทาเทียมกัน อันที่จริงขอเสนอนี้จะทําให [From.GetLeader] เปนผูเผด็จการเบ็ดเสร็จของทั้งสองชาติ"
 LIT_events.8.a: "เปนการเสียสละที่ขาพเจายินดีทํา"
 LIT_events.8.b: "ไมมีทาง"
 LIT_events.801.t: "[From.GetNameDefCap]ตอบรับ!"
 LIT_events.801.d: "[From.GetLeader] ตอบรับคําขอรวมชาติของ[Root.GetAdjective]ดวยการกาวลงจากตําแหนงผูเผด็จการแหงโปแลนดและมอบอํานาจให [Root.GetLeader] เครือจักรภพไดกลับมารวมกันอีกครั้ง นับเปนวิวัฒนาการครั้งประวัติศาสตรของอนาคตที่[From.GetNameDef]และ[Root.GetNameDef]จะมีรวมกันนับจากนี้"
 LIT_events.801.a: "ยอดเยี่ยม"
 LIT_events.802.t: "[From.GetNameDefCap]ปฏิเสธ"
 LIT_events.802.d: "ดูเหมือนชาวโปแลนดยังไมพรอมจะรวมกับ[Root.GetNameDef] แม[Root.GetNameDefCap]จะพยายามนําเสนอสหภาพนี้วาเปนการฟนฟูเครือจักรภพในอดีต แตรัฐมนตรี[From.GetAdjective]ก็ดูไมหวั่นไหวเลยแมแตนอย"
 LIT_events.802.a: "บางทีอาจตองโนมนาวชาวโปแลนดสักหนอย"
 LIT_events.9.t: "[From.GetNameDefCap]ขอดูแลการยึดครองโปแลนด"
 LIT_events.9.d: "[From.GetLeader] อางถึงประวัติศาสตรความรวมมืออันยาวนานระหวางโปแลนดและลิทัวเนีย และเสนอวาการยึดครองโปแลนดของ[Root.GetFactionName]จะราบรื่นไรปญหา หากอยูภายใตการบริหารของ[From.GetNameDef]แตเพียงผูเดียว การทําเชนนั้นหมายถึงการเสียทรัพยากรอันมีคาที่โปแลนดมีให แตก็หมายความวาการตอตานของชาวโปแลนดจะกลายเปนปญหาของลิทัวเนียแทน"
 LIT_events.9.a: "ไมเห็นวาจะเสียหายตรงไหน"
 LIT_events.9.b: "เราไมเห็นดวย"
 LIT_events.901.t: "[From.GetNameDefCap]สงมอบการยึดครองโปแลนด"
 LIT_events.901.d: "คําขอของ[Root.GetAdjective]ที่จะดูแลการยึดครองโปแลนดไดรับการตอบรับจาก[From.GetNameDef] นายพลและทหาร[From.GetAdjective]กําลังเดินทางกลับ[From.GetNonIdeologyName]เพื่อกระจายกําลังไปยังแนวรบอื่น ขณะที่ทหาร[Root.GetAdjective]เขาแทนที่เปนกองรักษาการณในภูมิภาคที่เคยเปนของโปแลนด"
 LIT_events.901.a: "เกียรติภูมิจงมีแดลิทัวเนีย!"
 LIT_events.902.t: "[From.GetNameDefCap]ปฏิเสธ"
 LIT_events.902.d: "คําขอของ[Root.GetAdjective]ที่จะดูแลการยึดครองโปแลนดถูก[From.GetNameDef]ปฏิเสธอยางสิ้นเชิง ความพยายามเขาควบคุมการยึดครองโปแลนดถูกมองวาเปนความพยายามของ [Root.GetLeader] ที่จะยึดเขตอุตสาหกรรมสําคัญของโปแลนด และบอนทําลายการอางสิทธิ์ของ[From.GetAdjective]เหนือดินแดนโปแลนด"
 LIT_events.902.a: "ก็คุมที่จะลองดู"
 LIT_events.10.t: "สงครามกลางเมืองฟาลังจิสต"
 LIT_monarchy_events.1.t: "ปญหาสองกษัตริย"
 LIT_monarchy_events.1.desc: "เมื่อมีกษัตริยประทับบนบัลลังกทั้งในโปแลนดและลิทัวเนีย ความทะเยอทะยานที่จะรวมเครือจักรภพอยางสันติดูจะเปนไปไดยากยิ่ง อยางไรก็ตาม เมื่อสองชาติมีอุดมการณตรงกันแลว ก็อาจมีอีกหนทางหนึ่ง หากเราเลือก เราสามารถเสนอพันธมิตรระหวางสองชาติแก [POL_or_LIT_target.GetLeader] เพื่อเปนการตีความเครือจักรภพใหมในเชิงการทูต หากรวมกัน เราจะกาวไปขางหนาในฐานะมิตร แตหากแยกกัน ฝายหนึ่งตองลมสลายในฐานะศัตรู"
 LIT_monarchy_events.1.a: "พันธมิตรฟงดูดีกวา"
 LIT_monarchy_events.1.b: "ตองมีเพียงหนึ่งเดียว!"
 LIT_monarchy_events.101.t: "[From.GetLeader] ปฏิเสธสันติภาพ"
 LIT_monarchy_events.101.desc: "แมเราจะพยายามหาทางออกอยางสันติ แต [From.GetLeader] ก็ปฏิเสธที่จะสานสัมพันธอันดีกับชาติเรา โดยกลาววา “กษัตริยแหง[From.GetNonIdeologyName]มีไดเพียงพระองคเดียว” ดูเหมือนสงครามกับ[From.GetNameDef]จะหลีกเลี่ยงไมไดแลว"
 LIT_monarchy_events.101.a: "ชางไรมารยาทเสียจริง"
 LIT_monarchy_events.2.t: "พระเจามินเดากัสที่ 3"
 LIT_monarchy_events.2.desc: "เมื่อวันที่ 4 มิถุนายน 1918 วิลเฮลม คารล ฟอน อูรัค ไดรับเลือกตั้งตามระบอบประชาธิปไตยเปนกษัตริยแหงลิทัวเนียดวยเสียงสนับสนุนอยางทวมทน แตการแทรกแซงจากจักรวรรดิเยอรมันทําใหการลงประชามติถูกประกาศเปนโมฆะ และลิทัวเนียไมเคยไดอยูรวมกับกษัตริยของตน อยางไรก็ตาม กษัตริยผูลวงลับมีพระโอรส และเมื่อการปกครองของเยอรมันเหนือลิทัวเนียกลายเปนความทรงจําอันเลือนราง [Root.GetLeader] จึงไดเชิญคารล เกโร ฟอน อูรัค ขึ้นเปนกษัตริยองคใหมของลิทัวเนีย!\n\nเจาชายหนุมไดรับการสวมมงกุฎเปนพระเจามินเดากัสที่ 3 และแมขณะนี้จะทรงมีบทบาทเพียงในพิธีการ แตก็มีแผนการที่จะเสริมอํานาจใหแกราชวงศลิทัวเนียใหมนี้"
 LIT_monarchy_events.2.a: "ทรงพระเจริญ!"
 LIT_monarchy_events.2_tt: "§Yมินเดากัสที่ 3§! ขึ้นเปนกษัตริยแหง[Root.GetNonIdeologyName] ขณะที่ §Y[Root.GetLeader]§! จะยังคงเปนผูนําของ[Root.GetRulingParty]"
 LAT_events.1.t: "ศัตรูที่แทจริง"
 LAT_events.1.d: "แมจะเปนเอกราช แต[Root.GetNameDef]ก็ไมเคยสลัดพันธนาการของจักรวรรดินิยมออกจากชาติไดอยางแทจริง ทั้งชาว[GER.GetAdjective]และชาว[SOV.GetAdjective]ตางมีความทะเยอทะยานและแผนการที่จะดึง[Root.GetNameDef]เขาไปอยูในจักรวรรดิของตน โดยแทบไมใสใจสิทธิ์ในการกําหนดชะตากรรมของตนเองของ[Root.GetNameDef]เลย แมหลายคนจะกระตือรือรนที่จะสูรบในทุกแนวรบเพื่อรักษาเอกราชของ[Root.GetAdjective] แตเราตองตัดสินใจวามหาอํานาจใดในสองชาตินี้เปนภัยคุกคามที่เรงดวนที่สุด และดําเนินมาตรการที่เหมาะสมเพื่อเตรียมรับการรุกราน"
 LAT_events.1.a: "[SOV.GetNameDefCap]คือภัยคุกคามที่แทจริง!"
 LAT_events.1.b: "เราไวใจ[GER.GetNameDef]ไมได"
 LAT_events.8.t: "ลัตเวียลุกเปนไฟ"
 LAT_events.8.d: "การตัดสินใจของรัฐบาลที่ยกเลิกคําสั่งหามกลุมกางเขนสายฟาซึ่งเปนฟาสซิสต ทําใหกุสตาฟส เซลมิญชและผูสนับสนุนฮึกเหิมขึ้น และเคลื่อนไหวอยางรุนแรงยิ่งขึ้นทั่วลัตเวีย วันนี้ ความรุนแรงนี้มาถึงจุดแตกหัก เมื่อกลุมแปรกอนครุสตติดอาวุธและเดินขบวนสูรีกา เรียกรองใหรัฐบาลลัตเวียยอมจํานนทันที\n\nแมจะชัดเจนวารัฐบาลตั้งใจจะรวมมือกับกลุมแปรกอนครุสต แตดูเหมือนกลุมนี้จะไมมีความตั้งใจจะให [Root.GetLeader] มีสวนในระบอบของพวกเขาเลย"
 LAT_events.8.a: "เราจะบดขยี้พวกทรยศเหลานี้!"
 LAT_events.8.b: "เพื่อลัตเวียที่แข็งแกรงกวา!"
 
 nsb_coup.0.t: "การสมคบคิดในหมูนายทหาร?"
 nsb_coup.0.desc: "แมจะเปนความลับที่รูกันทั่ววานายพลบางคนของเราไมพอใจสถานการณใน[Root.GetNameDef] แตดูเหมือนบางคนอาจเริ่มพิจารณาขั้นตอนที่รุนแรงยิ่งขึ้นเพื่อแกไขความเห็นตางของเรา มีการประชุมหลายครั้งระหวางนายทหารตาง ๆ ในสถานที่ที่ไมทราบแนชัด เชื่อวาอยูที่ใดที่หนึ่งใน[?.Root.meeting_location.GetName] \n\nรายละเอียดยังมีนอย แตเรามีเหตุใหเชื่อวา [coup_member_1.GetName] และ [coup_member_2.GetName] อยูในกลุมนี้ดวย เชื่อวาคนหลังติดตอกับ [coup_member_3.GetName] แมลักษณะความสัมพันธที่แทจริงของทั้งคูจะยังไมชัดเจน"
 nsb_coup.0.a: "เราตองสืบใหถึงตนตอ"
 nsb_coup.1.t: "[Root.GetLeader] ยึดอํานาจรัฐบาล"
 nsb_coup.1.desc: "หลังวางแผนอยางพิถีพิถันมาหลายสัปดาห วันนี้กลุมนายทหารภายใต [Root.GetLeader] ไดดําเนิน[Root.GetOperationName] แผนการยึดอํานาจรัฐบาล \n\nการเตรียมการอันยาวนานใหผลคุมคา เมื่อหนวยที่ภักดีตอ [Root.GetLeader] สามารถยึดอาคารรัฐบาลสําคัญทั้งหมดไดอยางรวดเร็ว ยามและหนวยตํารวจทองถิ่นซึ่งเผชิญกําลังที่เหนือกวาอยางทวมทนยอมจํานนโดยไมยิงสักนัด ดานตรวจรอบเมืองหลวงสกัดจับรัฐมนตรีที่พยายามหลบหนีไดทั้งหมด \n\nเมื่อรัฐบาลชุดกอนถูกควบคุมตัวไวอยางปลอดภัยแลว [Root.GetLeader] ก็ประกาศใหสวนที่เหลือของ[Root.GetNameDef]รับรูถึงสิ่งที่เกิดขึ้นแลวและไมอาจเปลี่ยนแปลงได คาดวาหนวยงานทองถิ่นจะยอมปฏิบัติตามในไมชา"
 nsb_coup.1.a: "สวนขาพเจา ขอตอนรับผูปกครองคนใหมของเรา"
 #translation notes: these are names and shouldn't be translated - non-latin alphabets may however transcribe them
 GER_operation_1: "ปฏิบัติการวาลคีรี"
 GER_operation_2: "ปฏิบัติการหินลับมีด"
 GER_operation_3: "ปฏิบัติการสูวัวกระทิง"
 GER_operation_4: "ปฏิบัติการอัครเทวดา"
 USA_operation_1: "ปฏิบัติการลมแดด"
 USA_operation_2: "ปฏิบัติการคารนิวัล"
 USA_operation_3: "ปฏิบัติการขวดหมึก"
 USA_operation_4: "ปฏิบัติการแมวปา"
 ENG_operation_1: "ปฏิบัติการดาบเรเปยร"
 ENG_operation_2: "ปฏิบัติการปลาอายุ"
 ENG_operation_3: "ปฏิบัติการตัวตลก"
 ENG_operation_4: "ปฏิบัติการความโดดเดน"
 #translation notes: these generic operation names can be translated
 generic_operation_1: "แผนสํารอง 1"
 generic_operation_2: "แผนสํารอง 2"
 generic_operation_3: "แผนสํารอง 3"
 generic_operation_4: "แผนสํารอง 4"
 nsb_coup.2.t: "ความพยายามรัฐประหารลมเหลว"
 nsb_coup.2.desc: "หลังวางแผนมาหลายสัปดาห เมื่อคืนนี้กลุมนายทหารไดสั่งการดําเนิน[Root.GetOperationName] แผนการยึดอํานาจรัฐบาล \n\nดูเหมือนพวกเขาตองเริ่มแผนกอนกําหนด เพราะปฏิบัติการดูเรงรีบและประสานงานกันไดไมดี ทหารกลุมหนึ่งที่ภักดีตอฝายรัฐประหารซึ่งไมรูวาตารางเวรยามเปลี่ยนไป ไดปรากฏตัวที่สํานักงานของ [Root.GetLeader] พรอมคําสั่งใหจับกุมหรือสังหาร - ตรงกับจังหวะผลัดเวรยามพอดี จึงตองเผชิญกับยามมากกวาที่คาดไวถึงสองเทา การยิงตอสูที่ตามมาสั้นแตโหดราย ทหารทั้งสองฝายเสียชีวิตและบาดเจ็บหลายนาย ขณะที่ [Root.GetLeader] หลบหนีไปได\n\nนับแตนั้น [Root.GetLeader] ไดปรากฏตัวตอสาธารณชนและทางวิทยุ แสดงใหเห็นวาการลอบสังหารไมสําเร็จ เมื่อรัฐประหารลมสลาย นายทหารจํานวนหนึ่งในกองทัพไดปลิดชีพตนเองเพื่อหนีการจับกุม หรือเลือกสูจนตัวตายเมื่อมีหนวยถูกสงไปจับกุม ขณะที่ผูบังคับบัญชากองรักษาการณตาง ๆ ไดประกาศความภักดีตอ [Root.GetLeader]"
 nsb_coup.2.a: "แลวคนพวกนี้อยากจะบริหารประเทศหรือ?"
 nsb_coup.3.t: "นายทหารพยายามกอรัฐประหาร"
 nsb_coup.3.desc: "หลังวางแผนมาหลายสัปดาห เมื่อคืนนี้กลุมนายทหารไดสั่งการดําเนิน[Root.GetOperationName] แผนการยึดอํานาจรัฐบาล \n\nดูเหมือนพวกเขาตองเริ่มแผนกอนกําหนด และเหตุการณก็บานปลายจนควบคุมไมไดอยางรวดเร็ว ความพยายามจับกุมหรือสังหาร [Root.GetLeader] ไมสําเร็จทั้งสองทาง และเครือขายดานตรวจรอบเมืองหลวงก็ยังปดลอมไมทันขณะที่เจาหนาที่รัฐบาลจํานวนมากหลบหนีไปได\n\nรัฐบาล[Root.GetNameDef]รอดมาสูตอไดอีกวัน และ [Root.GetLeader] ไดใหคํามั่นวาจะนําตัวคนทรยศมาลงโทษ - ดวยทุกวิถีทางที่จําเปน"
 nsb_coup.3.a: "เราจะบดขยี้การกบฏครั้งนี้!"
 
 LAT_events.2.t: "[From.GetNameDefCap]เรียกรองใหผนวก[Root.GetAdjective]"
 LAT_events.2.d: "[From.GetLeader] อางถึงแรงกดดันที่ทวีขึ้นในบอลติก และประกาศวาการรวมชาติบอลติกเปนสิ่งจําเปนอยางยิ่งตอการอยูรอดของทั้งสามรัฐ อยางไรก็ตาม ขอเรียกรองจากรัฐมนตรีตางประเทศของ[From.GetNameDef]ไมเพียงจะผลัก [Root.GetLeader] ออกจากตําแหนง แตยังทําใหพรรค[Root.GetRulingParty]ทั้งพรรคตองอยูใตอํานาจของ [From.GetLeader] และคณะบริหารของ[From.GetLeader.GetHerHis]โดยสิ้นเชิง"
 LAT_events.2.a: "เรามีทางเลือกหรือ?"
 LAT_events.2.b: "ไมมีทางเด็ดขาด!"
 LAT_events.3.t: "[From.GetNameDefCap]สนับสนุนชาตินิยม[Root.GetAdjective]"
 LAT_events.3.d: "ในสุนทรพจนอันปลุกใจวาดวยธรรมชาติของความเปนปกแผนแหงบอลติก [From.GetLeader] ไดชื่นชม [Root.GetLeader] สําหรับความมุงมั่นตอชาตินิยมของ[Root.GetLeader.GetHerHis]ทามกลางภัยคุกคามบอลเชวิกที่กําลังเพิ่มขึ้น แม[From.Getleader.GetSheHe]จะอางวาเคารพอัตลักษณเฉพาะตัวของ[From.GetAdjective]และ[Root.GetAdjective] แต[From.Getleader.GetSheHe]ก็เรียกรองให[From.GetNonIdeologyName]และ[Root.GetNonIdeologyName]รวมมือกันในเปาหมายรวมเพื่อรักษาเอกราช แมตอนนี้จะยังมีความหมายไมมากนัก แตหลายคนคาดวาขอเสนอเปนพันธมิตรกําลังจะตามมา"
 LAT_events.3.a: "นาสนใจ"
 LAT_events.5.t: "[From.GetLeader] แสวงหาการรวมออสทลันด"
 LAT_events.5.d: "เมื่อเบลารุสตะวันตกอยูใตการควบคุมของ[Root.GetFactionName]อยางมั่นคงแลว ผูเผด็จการแหง[From.GetNonIdeologyName]จึงประกาศความสนใจที่จะจัดตั้งเขตยึดครองออสทลันดภายใตการบริหารของ[From.GetAdjective] เหตุผลเบื้องหลังขอเสนอนี้คือการเผยแพรอุดมการณฟาสซิสตไปทั่วรัฐบอลติกและเบลารุส และสงเสริมผลประโยชนของ[Root.GetFactionName]ทางตะวันออก"
 LAT_events.5.a: "ยอดเยี่ยม!"
 LAT_events.5.b: "ไม"
 LAT_events.501.t: "[From.GetNameDefCap]สงมอบออสทลันด"
 LAT_events.501.d: "การสงมอบดินแดนออสทลันดสูมือ[Root.GetAdjective]ประสบความสําเร็จ และ[From.GetNameDef]ตกลงวาการยึดครองรัฐบอลติกและเบลารุสตะวันตกควรอยูภายใตอํานาจของ[Root.GetNameDef]แตเพียงผูเดียว"
 LAT_events.501.a: "ยอดเยี่ยม!"
 LAT_events.502.t: "[From.GetNameDefCap]ปฏิเสธ"
 LAT_events.502.d: "คําขอของ[Root.GetAdjective]ที่จะดูแลการยึดครองออสทลันดถูก[From.GetNameDef]ปฏิเสธอยางสิ้นเชิง ความพยายามเขาควบคุมการยึดครองออสทลันดถูกมองวาเปนความพยายามของ [Root.GetLeader] ที่จะควบคุมศูนยกลางประชากรสําคัญทางตะวันออก และบอนทําลาย[From.GetNameDef]"
 LAT_events.502.a: "วันอันนาเศราของลัตเวีย"
 LAT_events.6.t_both: "[From.GetNameDefCap]ขอใหรัฐบอลติกเขารวม[Root.GetFactionName]"
 LAT_events.6.d_both: "วันนี้[From.GetNameDefCap]ไดขอใหสงคําเชิญเขารวม[Root.GetFactionName]แกรัฐบอลติกทั้งหมด [From.GetLeader] อางถึงความสําเร็จอยางทวมทนของชาตินิยมใน[LIT.GetNameDef]และ[EST.GetNameDef] รวมถึงความปรารถนาโดยธรรมชาติที่จะรวมมือกันในบอลติก และไดยื่นขอเสนออยางแข็งขันใหรัฐบาล[Root.GetAdjective]พิจารณา [LIT.GetLeader] และ [EST.GetLeader] เปนพันธมิตรในอุดมการณชาตินิยม"
 LAT_events.6.t_estonia: "[From.GetNameDefCap]ขอให[EST.GetAdjective]เขารวม[Root.GetFactionName]"
 LAT_events.6.d_estonia: "วันนี้[From.GetNameDefCap]ไดขอใหสงคําเชิญเขารวม[Root.GetFactionName]แก[EST.GetNonIdeologyName] [From.GetLeader] อางถึงความสําเร็จอยางทวมทนของชาตินิยมใน[EST.GetNameDef] รวมถึงความปรารถนาโดยธรรมชาติที่จะรวมมือกันในบอลติก และไดยื่นขอเสนออยางแข็งขันใหรัฐบาล[Root.GetAdjective]พิจารณา [EST.GetLeader] เปนพันธมิตรในอุดมการณชาตินิยม"
 LAT_events.6.t_lithuania: "[From.GetNameDefCap]ขอให[LIT.GetAdjective]เขารวม[Root.GetFactionName]"
 LAT_events.6.d_lithuania: "วันนี้[From.GetNameDefCap]ไดขอใหสงคําเชิญเขารวม[Root.GetFactionName]แก[LIT.GetNonIdeologyName] [From.GetLeader] อางถึงความสําเร็จอยางทวมทนของชาตินิยมใน[LIT.GetNameDef] รวมถึงความปรารถนาโดยธรรมชาติที่จะรวมมือกันในบอลติก และไดยื่นขอเสนออยางแข็งขันใหรัฐบาล[Root.GetAdjective]พิจารณา [LIT.GetLeader] เปนพันธมิตรในอุดมการณชาตินิยม"
 LAT_events.6.a: "ความคิดที่ดีมาก!"
 LAT_events.6.b: "ไรสาระสิ้นดี"
 LAT_events.601.t: "[From.GetNameDefCap]ปฏิเสธการเขารวม[From.GetFactionName]ของรัฐบอลติก"
 LAT_events.601.d: "แม[Root.GetNameDef]จะไดรับการตอนรับเขาสู[From.GetFactionName]อยางอบอุน แตดูเหมือน [From.GetLeader] จะไมมีความเห็นใจในใจของ[From.GetLeader.GetHerHis]ตอสิทธิ์ของพี่นองชาวบอลติกในการปกปองตนเองเลย คําเชิญของเราที่มีตอพี่นองชาวบอลตถูกปฏิเสธ และดูเหมือนชาติของเราจะยังคงแยกกันอยูไปกอนในตอนนี้"
 LAT_events.601.a: "ชางเถอะ"
 LAT_events.7.t: "[Root.GetFascistParty]เดินขบวนสู[Root.Capital.GetName]!"
 LAT_events.7.d: "ดวยการสนับสนุนอยางหนักจากรัฐบาลฟาสซิสตของ[From.GetNameDef] ผูสนับสนุน[Root.GetFascistParty]ไดรวมตัวกันบนทองถนนของ[Root.Capital.GetName]ดวยเจตนารุนแรง ในที่สุดผูกอจลาจลก็มาถึงอาคารรัฐสภาของ[Root.Capital.GetName] ขณะที่ [Root.GetLeader] และสมาชิกคนสําคัญหลายคนของพรรค[Root.GetRulingParty]กําลังประชุมกันอยู พรอมตะโกนเรียกรองให [Root.GetLeader] ลาออก"
 LAT_events.7.a: "สลายฝูงชนพวกนี้!"
 LAT_events.7.b: "บางที [Root.GetLeader] ควรลาออก"
 EST_events.1.t: "[From.GetNameDefCap]แสวงหาสนธิสัญญามิตรภาพ"
 EST_events.1.d: "ดวยความหวาดกลัวการรุกรานของ[SOV.GetAdjective] [From.GetLeader] จึงยื่นคําขออยางเปนทางการใหทําสนธิสัญญาระหวาง[Root.GetNameDef]และ[From.GetNameDef] สนธิสัญญานี้จะรวมถึงการรับประกันไมรุกราน ตลอดจนขอตกลงฉันมิตรหลายประการที่มุงสรางความรวมมือระหวาง[Root.GetNonIdeologyName]และ[From.GetNonIdeologyName]"
 EST_events.1.a: "ขอเสนอที่ดี"
 EST_events.1.b: "เรามีแผนอื่นสําหรับ[From.GetNameDef]"
 EST_events.101.t: "[From.GetNameDefCap]เห็นดวย"
 EST_events.101.d: "[From.GetLeader] เห็นคุณคาอยางชัดเจนของพันธมิตรที่อาจเกิดขึ้นในอนาคตระหวาง[Root.GetNameDef]และ[From.GetNameDef] และตกลงที่จะสานสัมพันธอันดีกับชาติเรา"
 EST_events.101.a: "ยอดเยี่ยม"
 EST_events.102.t: "[From.GetNameDefCap]ปฏิเสธ"
 EST_events.102.d: "แม [Root.GetLeader] จะพยายามอยางเต็มที่ แตดูเหมือน[From.GetNameDef]จะยังคงเปนศัตรูของ[Root.GetNonIdeologyName] แมการปฏิเสธของพวกเขาจะมีความหมายไมมากนัก แตก็อาจหมายความวาหากเกิดการรุกรานของ[SOV.GetAdjective] [From.GetNameDef]ก็คงทําไดแคนั่งดู"
 EST_events.102.a: "ใหตายสิ"
 EST_events.2.t: "[From.GetNameDefCap]แสวงหาการรวมชาติ"
 EST_events.2.d: "วันนี้ [From.GetLeader] ไดยื่นขอเสนอใหรวม[From.GetNameDef]และ[Root.GetNameDef]เขาดวยกัน ปฏิเสธไมไดวารัฐบาล[From.GetAdjective]และ[Root.GetNameDef]ผูกพันกันอยางแยกไมออก หากไมมีขบวนการวัปส [Root.GetFascistParty]ก็แทบไมมีทางยึดอํานาจใน[Root.GetNonIdeologyName]ได และแมกระทั่งตอนนี้ ความเห็นใจตอขบวนการวัปสก็ยังคงแรงกลาในกองทัพของเรา [From.GetLeader] อางวาสหภาพระหวางฟนแลนดและเอสโตเนียจะทําใหชาติของเรามีความพรอมยิ่งขึ้นในการปองกันการรุกรานของ[SOV.GetAdjective]ที่กําลังจะมาถึง"
 EST_events.2.a: "เราไมมีทางเลือก"
 EST_events.2.b: "ขับไลขบวนการวัปสทันที!"
 EST_events.201.t: "[From.GetNameDefCap]ยอมรับการรวมชาติ"
 EST_events.201.d: "[From.GetLeader] ไดตัดสินใจอยางชาญฉลาดที่จะยอมใหสองชาติของเรารวมกัน [From.GetLeader] ไดลงจากตําแหนงหัวหนารัฐบาล[From.GetAdjective]เพื่อเปดทางให [Root.GetLeader] และรับบทบาทรองในรัฐบาล[Root.GetAdjective]-[From.GetAdjective]ที่เพิ่งรวมกันใหม"
 EST_events.201.a: "วิเศษมาก!"
 EST_events.202.t: "[From.GetNameDefCap]ปฏิเสธการรวมชาติกับ[Root.GetAdjective]"
 EST_events.202.d: "แมรัฐบาลวัปสแหง[Root.GetNonIdeologyName]จะมีอิทธิพลอยางทวมทนเหนือ[From.GetNameDef] แต [From.GetLeader] ก็ปฏิเสธความพยายามรวมชาติของ[Root.GetAdjective]"
 EST_events.202.a: "อีกไมนานหรอก!"
 EST_events.4.t: "[From.GetNameDefCap]แสวงหาการรวมชาติบอลติก"
 EST_events.4.d: "รัฐบอลติกมักมีประวัติศาสตรรวมกันในการถูกกดขี่ภายใตอํานาจตางชาติ ทั้งชาวโปแลนด ชาวเยอรมัน และชาวรัสเซีย แต [From.GetLeader] ประกาศวาจะไมมีอีกแลว! แมคุณคาแหงชาตินิยมและการกําหนดชะตากรรมของตนเองจะลุกโชนอยูในใจของชาวบอลติกทุกคน แต [From.GetLeader] ก็ยกขออางที่นาเชื่อถือวา ประวัติศาสตรการถูกตางชาติปกครองของเรามีสาเหตุเพียงประการเดียวคือการขาดความเปนเอกภาพ และแมหลายคนจะกระหายเอกราช แตภัยคุกคามที่เพิ่มขึ้นจากการรุกรานของ[SOV.GetAdjective]ก็เรียกรองใหรัฐบาลของเรารับเอาชาตินิยมรวมแบบหนึ่งมาใช\n\n[From.GetLeader.GetSheHeCap]เสนอ[BAL_UNIFIED_fascism]เพื่อใหประชาชนของเราปลอดภัยและแข็งแกรงตอตานชาวตางชาติที่กลาคิดจะกดขี่เราเปนทาส"
 EST_events.4.a: "บางทีเราอาจเหมือนกันมากกวาที่แตกตาง"
 EST_events.4.b: "อัตลักษณแพนบอลติกหรือ? ไมมีสิ่งนั้นหรอก!"
 EST_events.401.t: "[From.GetNameDefCap]ตอบรับ!"
 EST_events.401.d: "[From.GetLeader] ถูกโนมนาวสําเร็จดวยความพยายามของ[Root.GetAdjective]ในการปลูกฝงอัตลักษณชาติแพนบอลติก และตกลงรวมพรรค[From.GetFascistParty]เขากับ[Root.GetFascistParty] นับเปนชัยชนะอันมั่นคงในเปาหมายของ [Root.GetLeader] ที่จะรวมรัฐบอลติก [Root.GetNameDef]จะอยูในฐานะที่ดีกวามากในการปองกันตนเองจากการรุกรานของ[SOV.GetAdjective]อยางแนนอน"
 EST_events.401.a: "[From.GetNonIdeologyName]เปนเพียงจุดเริ่มตนเทานั้น"
 EST_events.402.t: "[From.GetNameDefCap]ปฏิเสธการรวมชาติ"
 EST_events.402.d: "[From.GetNameDef]ไมหวั่นไหวตอวาทศิลปเรื่องความเปนปกแผนแหงบอลติกของ [Root.GetLeader] และปฏิเสธที่จะรวมกับ[Root.GetNameDef] โดยเชื่อวาการรวมชาติของเราเปนเพียงการกระทําแบบจักรวรรดินิยมที่มุงขัดขวางสิทธิ์ของชาว[From.GetAdjective]ในการมี[From.GetNonIdeologyName]เพื่อชาว[From.GetNonIdeologyAdjective]"
 EST_events.402.a: "พวกเขาอยากไปเขากับชาว[SOV.GetAdjective]มากกวาหรือ? พวกทรยศ!"
 EST_events.5.t: "[From.GetNameDefCap]คุกคามเอกราชของ[Root.GetAdjective]"
 EST_events.5.d: "วันนี้ [From.GetLeader] ไดประกาศโจมตีรัฐบาล[Root.GetAdjective]อยางเปดเผย โดยอางวาออนแอและไรประสิทธิภาพในการปกปองประชาชนของตนจากพวกจักรวรรดินิยมตางชาติ แมตอนนี้จะยังมีความหมายไมมากนัก แตเราคาดไดวาการรุกรานของ[From.GetAdjective]กําลังจะมาถึง"
 EST_events.5.a: "[From.GetLeader] ก็แคคนปากดี"
 EST_events.6.t: "[From.GetNameDefCap]ขอให[FIN.GetAdjective]เขารวม[Root.GetFactionName]"
 EST_events.6.d: "วันนี้[From.GetNameDefCap]ไดขอใหสงคําเชิญเขารวม[Root.GetFactionName]แก[FIN.GetNonIdeologyName] [From.GetLeader] อางถึงความสําเร็จอยางทวมทนของชาตินิยมในชาติของพวกเขา รวมถึงความปรารถนาโดยธรรมชาติที่จะรวมมือกันระหวางฟนแลนดและเอสโตเนีย และไดยื่นขอเสนออยางแข็งขันใหรัฐบาล[Root.GetAdjective]พิจารณา [FIN.GetLeader] เปนพันธมิตรในอุดมการณชาตินิยม"
 EST_events.6.a: "ความคิดที่ดีมาก!"
 EST_events.6.b: "ไรสาระสิ้นดี"
 EST_events.601.t: "[From.GetNameDefCap]ปฏิเสธการเขารวม[From.GetFactionName]ของ[FIN.GetAdjective]"
 EST_events.601.d: "แม[Root.GetNameDef]จะไดรับการตอนรับเขาสู[From.GetFactionName]อยางอบอุน แตดูเหมือน [From.GetLeader] จะไมมีความเห็นใจในใจของ[From.GetLeader.GetHerHis]ตอสิทธิ์ของ[FIN.GetNameDef]ในการปกปองตนเองเลย คําเชิญของเราที่มีตอชาวฟนนถูกปฏิเสธ และดูเหมือนชาติของเราจะยังคงแยกกันอยูไปกอนในตอนนี้"
 EST_events.601.a: "[From.GetLeader] เสียสติหรือแคไรความสามารถกันแน?"
 EST_events.7.t: "สงครามกลางเมืองวัปส"
 EST_events.7.d: "การเดินขบวนและการชุมนุมประทวงไมหยุดหยอนทั่วเมือง ไดทําลายความเปนเอกภาพเพียงนอยนิดที่ยังเหลืออยูใน[Root.GetNonIdeologyName]ลงในที่สุด และชาติก็แตกแยกเขาสูสงครามกลางเมืองเต็มรูปแบบ สิ่งที่ตั้งใจเปนเพียงการปราบปรามกลุม[Root.GetFascistParty]เล็กนอยของรัฐบาล กลับปะทุเปนการปะทะรุนแรงกับผูประทวงเมื่อวานนี้ โดยทหารผานศึกปะทะกับทหารของกองทัพ[Root.GetAdjective]ที่ตนเคยตอสูให เมื่อสมาชิก[Root.GetFascistParty]อยูฝายหนึ่ง และผูภักดีตอรัฐบาลอยูอีกฝายหนึ่ง สิ่งที่เหลือใหรอดูคือใครจะไดนั่งใน[Root.Capital.GetName]เมื่อสิ้นวัน [Root.GetLeader] หรือ [neutral_EST_civil_war.GetLeader]..."
 EST_events.7.a: "เพื่อ[Root.GetNonIdeologyName]!"
 EST_events.9.b: "บางทีเรายอมแพไปเสียก็คงดีที่สุด..."
 EST_events.701.t: "[Root.GetLeader] ลงจากตําแหนง"
 EST_events.701.d: "การเดินขบวนทั่วประเทศของผูชุมนุมวัปสมาถึงจุดเดือดในวันนี้ เมื่อการปะทะระหวางตัวแทนรัฐบาลของ [Root.GetLeader] กับขบวนการวัปสจบลงอยางรุนแรง ทามกลางเสียงของอารทูร ซิรก ผูประทวงพังประตูรีกีโคกูเขาไปและตั้งเครื่องกีดขวางชั่วคราวอยางรวดเร็ว ขัดขวางไมใหเจาหนาที่บังคับใชกฎหมายเขาไปในอาคาร\nชาวเอสโตเนียจํานวนมากคาดวา [Root.GetLeader] จะตอบโตผูประทวงดวยกําลัง แตทามกลางความประหลาดใจของคนทั้งชาติ วันนี้อาคารรีกีโคกูไดรับจดหมายลาออกของ [Root.GetLeader] ซึ่งสละตําแหนงผูเผด็จการใหแกอารทูร ซิรก"
 EST_events.701.a: "เอสโตเนียยืนหยัดไดมั่นคงยิ่งขึ้น"
 EST_events.801.t: "การเดินขบวนอันวุนวายใน [?ROOT.vaps_from.GetName]"
 EST_events.801.d: "การชุมนุมของ [Root.GetFascistParty] ใน [?ROOT.vaps_from.GetName] ไดรับการตอบรับจากสาธารณชนแบบกํ้ากึ่ง และถูกเจาหนาที่ทองถิ่นตอบโตอยางรุนแรง ผูคนในฝูงชนแทบไมมีใครบอกไดดวยซํ้าวาการเดินขบวนครั้งนี้มีจุดประสงคอะไร เพราะความรุนแรงระหวางผูประทวงกับฝายตอตานการประทวงกลายเปนจุดสนใจหลักของการชุมนุม รัฐบาล[Root.GetAdjective]กําลังดําเนินการกวาดลาง [Root.GetFascistParty] อยูแลว และเหตุการณในวันนี้ก็นาจะเรงกระบวนการดังกลาวใหเร็วขึ้น ทั้งยังแทบไมชวยใหไดใจฝูงชนเลย"
 EST_events.801.a: "นี่มันหายนะชัด ๆ"
 EST_events.801.b: "เราตองปราบพวกกบฏเหลานี้ทันที!"
 FIN_putting_down_insurgents_tt: "รัฐนี้จะไมภักดีตอ§Yกลุมกบฏวัปส§!"
 EST_events.802.t: "การเดินขบวนใน [?ROOT.vaps_from.GetName]" 
 EST_events.802.d: "การเดินขบวนของ [Root.GetFascistParty] ทั่ว [?ROOT.vaps_from.GetName] ผานไปโดยแทบไมมีเหตุรายใด ๆ ดวยการหลีกเลี่ยงศูนยกลางประชากรสําคัญและมุงไปยังพื้นที่ชนบทของ [?ROOT.vaps_from.GetName] แทน [Root.GetFascistParty] จึงสามารถแสดงใหประชาชนแหง [Root.GetName] เห็นวาขบวนการนี้ยืนหยัดเพื่อสิ่งใด โดยไมถูกเจาหนาที่[Root.GetAdjective]ตอบโต"
 EST_events.802.a: "นาสนใจ"
 EST_events.803.t: "การเดินขบวนฟาสซิสตครั้งใหญใน [?ROOT.vaps_from.GetName]"
 EST_events.803.d: "ทั่วทั้งรัฐ [?ROOT.vaps_from.GetName] ผูชุมนุมของ [Root.GetFascistParty] พากันออกมาอยางลนหลามเพื่อแสดงการสนับสนุนรัฐชาตินิยมที่เขมแข็ง แมเจาหนาที่จะพยายามกีดกันไมใหผูชุมนุมเดินขบวนเขาสูศูนยกลางประชากรสําคัญ แตเจาหนาที่เหลานั้นกลับวางอาวุธและปลอยใหคนของ [Root.GetFascistParty] เดินขบวนผานทองถนนอยางสงบ เมื่อไมมีฝายตอตานการประทวงที่สําคัญใด ๆ ใหตองรับมือ นี่จึงเปนชัยชนะอยางงดงามของขบวนการ [Root.GetFascistParty]"
 EST_events.803.a: "นาสนใจมาก"
 EST_events.901.t: "[?FIN.EST_previous_finnish_leader.GetName] ลงจากตําแหนง"
 EST_events.901.d: "เปนที่นาประหลาดใจ เมื่อกองกําลังของ [FROM.GetFascistParty] รุกเขาสูเมืองหลวง[From.GetAdjective]ในวันนี้ แทนที่จะจุดชนวนสงครามกลางเมืองตามที่คาดไว อดีตรัฐบาล[From.GetAdjective]กลับประกาศวาจะยอมสละอํานาจและสงมอบอํานาจการปกครองใหแกพรรค [FROM.GetFascistParty]"
 EST_events.901.a: "เอาละ นี่ไมคาดคิดเลย!"
 EST_events.10.t: "ปญหาเรื่องการแทรกแซง"
 EST_events.10.d: "สงครามกลางเมืองไดปะทุขึ้นใน [FIN.GetNonIdeologyName] แลว แตคําถามที่ยังคางอยูคือ [Root.GetNameDef] จะมีบทบาทอยางไรในความขัดแยงนี้ ขณะนี้ความรวมมือของกลุมวัปสกับพวกฟาสซิสต[FIN.GetNonIdeologyAdjective]มีเพียงการติดอาวุธและจัดตั้งใหพวกเขายึดอํานาจดวยตนเอง แตเชนเดียวกับที่พวกเขาเคยสูรบเพื่อปกปองเอกราชของ[EST.GetAdjective]ในอดีต บางที [Root.GetLeader] อาจมองวานี่เปนโอกาสที่จะตอบแทนบุญคุณที่ [EST.GetNonIdeologyName] ติดคางชาวฟนน"
 EST_events.10.a: "ทหารผานศึกไดรวมรบเคียงบาเคียงไหลกันอีกครั้ง!"
 EST_events.10.b: "กองกําลังอาสาสมัครขนาดพอสมควรก็เพียงพอแลว"
 EST_events.11.t: "กลุมวัปสและ [Root.GetFascistPartyName]"
 EST_events.11.d: "เมื่อไดขึ้นมามีอํานาจในเอสโตเนียแลว กลุมวัปสไดตกลงลงนามในสนธิสัญญาความรวมมือกับ [Root.GetFascistPartyName] ขณะนี้กลุมวัปสกําลังสนับสนุนกลุมฟาสซิสตฟนแลนดดวยการโฆษณาชวนเชื่อและการชุมนุมระดับชาติ แตหากรัฐบาลดําเนินการอยางรวดเร็วและเด็ดขาดเพื่อสั่งหามกลุมฟาสซิสตเหลานี้ ก็อาจขจัดปญหานี้ไดอยางถาวร"
 EST_events.11.a: "พวกหัวรั้นไรประโยชน"
 
 NSB_poland_communist_events.1.a: "[POL.GetNameDefCap] ยืนหยัดโดยลําพัง"
 NSB_poland_communist_events.1.b: "โปแลนดควรเปนสวนหนึ่งของสหภาพโซเวียต"
 NSB_poland_communist_events.1.desc: "พรรคคอมมิวนิสตโปแลนดมีความขัดแยงยืดเยื้อมานานระหวางผูที่ตองการใหโปแลนดเขาขางสหภาพโซเวียต กับผูที่เชื่อวาสหภาพโซเวียตเปนจักรวรรดินิยมไมตางจากระบอบราชาธิปไตยที่มากอนหนา\nฝายตอตานโซเวียตมีมาเรีย โคชุตสกาเปนตัวแทน เธอถูกกลาวหาวาเปน[Root.GetStalinistOrTrotskyite] และกลาวหาสหายฝายนิยมโซเวียตวาเปนพวก “ไรกระดูกสันหลัง” และเปนศัตรูของการปฏิวัติ\nวลาดึสวัฟ โกมุวคา ในฐานะผูนําโดยพฤตินัย เปนตัวแทนของปกนิยมโซเวียตในพรรค แมจะเปนที่นิยมภายในพรรคอยูแลว แตโกมุวคากลับเสื่อมความนิยมลงเรื่อย ๆ ในหมูประชาชนชาวโปแลนด เนื่องจากจุดยืนทางการทูตที่นิยมรัสเซีย\nแมขณะนี้พรรคจะควบคุมโปแลนดไดแลว แตก็ยังแตกแยกวาผูสมัครคนใดควรเปนผูนํา ทามกลางความลังเลนี้ มอสโกก็กดดันหนักขึ้นเรื่อย ๆ ไมเพียงใหหามโคชุตสกาขึ้นเปนผูนํา แตยังใหนําตัวเธอขึ้นศาลในฐานะ[Root.GetStalinistOrTrotskyite]และผูตอตานการปฏิวัติดวย"
 NSB_poland_communist_events.1.nosov.desc: "พรรคคอมมิวนิสตโปแลนดมีความขัดแยงยืดเยื้อมานานระหวางผูที่ตองการใหโปแลนดเขาขางสหภาพโซเวียต กับผูที่เชื่อวาสหภาพโซเวียตเปนจักรวรรดินิยมไมตางจากระบอบราชาธิปไตยที่มากอนหนา\nอยางไรก็ตาม นับตั้งแตสหภาพโซเวียตเสื่อมถอยลง คําถามนี้ก็แทบไมมีความหมายอีกตอไป หลังสตาลินหมดอํานาจ วลาดึสวัฟ โกมุวคา ผูนําฝายนิยมโซเวียตก็หมดบทบาทตามไปดวย จึงไมมีใครคัดคานการแตงตั้งมาเรีย โคชุตสกา ผูตอตานโซเวียต ขึ้นเปนผูนําพรรค"
 NSB_poland_communist_events.1.t: "ความขัดแยงภายใน KPP"
 NSB_poland_events.1.a: "เราไมมีทางเลือก"
 NSB_poland_events.1.b: "เราจะไมกมหัวใหโปแลนด!"
 NSB_poland_events.1.desc: "โดยอางถึงความออนแอทางการปองกันที่เห็นไดชัดของ [Root.GetNameDef] เจาหนาที่จาก [From.GetNameDef] ไดเรียกรองใหภูมิภาคสโลวาเกียทั้งหมดตกอยูภายใตการยึดครองโดยตรงของโปแลนด พวกเขาประกาศอยางชัดแจงวาหากเราไมยอม การรุกรานยอมหลีกเลี่ยงไมได เราควรตอบโตอยางไร?"
 NSB_poland_events.1.t: "[From.GetNameDefCap] เรียกรองสโลวาเกีย"
 NSB_poland_events.101.a: "ไมอยากเชื่อเลยวาจะไดผล!"
 NSB_poland_events.101.desc: "[From.GetNameDefCap] ยอมรับขอเรียกรองลาสุดของเราใหยกภูมิภาคสโลวักทั้งหมด ขณะนี้ทหาร[Root.GetAdjective]กําลังหลั่งไหลเขาสูภูมิภาคเพื่อปราบปรามการตอตานในทองถิ่นกอนที่จะกอตัวขึ้น แมชัยชนะนี้จะเล็กนอย แตก็แสดงวาโลกยังเกรงกลัวจักรกลสงคราม[Root.GetAdjective]อยูบาง!"
 NSB_poland_events.101.t: "[From.GetNameDefCap] ยอมรับ!"
 NSB_poland_events.102.a: "ถาอยางนั้นก็ตองสงคราม!"
 NSB_poland_events.102.desc: "นาตกตะลึงที่รัฐบาล[From.GetAdjective]ปฏิเสธขอเรียกรองของเราใหยกภูมิภาคสโลวัก ความพยายามหาทางออกทางการทูตของเราลมเหลว และเรื่องนี้ไดกลายเปนเรื่องของกองทัพไปแลว"
 NSB_poland_events.102.t: "[From.GetNameDefCap] ปฏิเสธ!"
 NSB_poland_events.2.a: "คงตองยอมรับละนะ"
 NSB_poland_events.2.b: "“การอางสิทธิ์” นี้ไรความหมาย"
 NSB_poland_events.2.d: "ดูเหมือนวาการสําเร็จราชการที่ยาวนานใน [Root.GetNameDef] ไดทําให [From.GetLeader] กลาประกาศให [From.GetLeader.GetHerselfHimself] เปนกษัตริยแหงฮังการี การอางสิทธิ์นี้อาศัยเพียงราชอาณาจักรโปแลนด-ฮังการีในยุคกลางเทานั้น และเห็นไดชัดวาเปนความพยายามขยายดินแดนอยางโจงแจง"
 NSB_poland_events.2.t: "[From.GetLeader] อางสิทธิ์ในราชบัลลังก[Root.GetAdjective]!"
 NSB_poland_events.201.a: "ยอดเยี่ยม"
 NSB_poland_events.201.desc: "วันนี้ดูเหมือนผูอางสิทธิ์ในราชบัลลังกฮังการีทั้งหลายจะถูกปดตกไปแลว เมื่อ [Root.GetLeader] ไดรับการสถาปนาเปนกษัตริยแหงฮังการี เมื่อ [Root.GetLeader] เปนกษัตริยทั้งของโปแลนดและฮังการี ความทะเยอทะยานของ[Root.GetAdjective]ที่จะเปนเจาแหงคาบสมุทรบอลขานก็ใกลเปนจริงยิ่งขึ้น"
 NSB_poland_events.201.t: "ฮังการียินยอม"
 NSB_poland_events.202.a: "พวกเขาไมเหลือทางเลือกใหเรา"
 NSB_poland_events.202.desc: "ผูนํารัฐบาล[From.GetAdjective]ประกาศวาจะไมยอมรับการอางสิทธิ์ของ [Root.GetLeader] ในราชบัลลังก[From.GetAdjective] แมเรื่องนี้จะปดโอกาสในการผนวก [From.GetNameDef] อยางสันติ แตก็หมายความวาการอางสิทธิ์ยังอาจผลักดันไดดวยสงคราม"
 NSB_poland_events.202.t: "[From.GetNameDefCap] ปฏิเสธการอางสิทธิ์ของ [Root.GetLeader]"
 NSB_poland_events.3.a: "เรายอมรับ!"
 NSB_poland_events.3.b: "[From.GetNonIdeologyName] ยังคงเปนศัตรูของเรา"
 NSB_poland_events.3.c: "ยกดานซิกมา แลวตกลงกัน!"
 NSB_poland_events.3.desc: "เจาหนาที่จาก [From.GetNameDef] ประกาศความสนใจที่จะลงนามเปนพันธมิตรกับจักรวรรดิเยอรมันใหม ดวยเชื่อวาไกเซอร [Root.GetLeader] จะเปนมิตรตอเอกราชของ[From.GetAdjective]มากกวา[Root.GetHerHis]ผูนําคนกอน และอางวา [From.GetNameDef] ในรูปแบบปจจุบันถือกําเนิดขึ้นโดยตรงจากพระราชบัญญัติ 5 พฤศจิกายนที่ลงนามโดยฝายมหาอํานาจกลาง [From.GetNameDef] จึงเสนอใหทั้งสองรัฐลงนามเปนพันธมิตรอยางเปนทางการ\nการตอบรับจะถือเปนความผิดแผกครั้งใหญในประวัติศาสตรความสัมพันธ [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] และอาจเปนอนาคตอันสดใสของทั้งสองชาติ"
 NSB_poland_events.3.t: "[From.GetNameDefCap] เสนอเปนพันธมิตร"
 NSB_poland_events.301.a: "วันอันยิ่งใหญของโปแลนด!"
 NSB_poland_events.301.desc: "นาประหลาดใจที่ [From.GetNameDef] ตกลงลงนามเปนพันธมิตรอยางเปนทางการกับ [Root.GetNameDef]! แมเคยเปนศัตรูกันมาตลอด แตดูเหมือนวันแหงความขัดแยงระหวาง [Root.GetNonIdeologyName] กับ [From.GetNonIdeologyName] จะสิ้นสุดลงในที่สุด และทั้งสองชาติสามารถกาวไปขางหนาในฐานะพันธมิตรเพื่อตานกระแสอุดมการณสุดโตงที่กําลังกอตัว\nสิ่งที่เริ่มตนจากพระราชบัญญัติ 5 พฤศจิกายน ซึ่งเยอรมนียอมปลดปลอยดินแดน[Root.GetAdjective]ใหเปนราชอาณาจักรอิสระ บัดนี้ไดพัฒนาเปนพันธมิตรทางประวัติศาสตรที่จะเปนที่รูจักตอไปในนาม “พันธมิตรเดือนพฤศจิกายน”"
 NSB_poland_events.301.t: "ไกเซอรตกลง!"
 NSB_poland_events.302.a: "นาผิดหวังเหลือเกิน"
 NSB_poland_events.302.desc: "แมเราจะพยายามทางการทูตอยางดีที่สุดและผลประโยชนของชาติเราดูจะสอดคลองกัน แตไกเซอรก็ปฏิเสธที่จะลงนามเปนพันธมิตรอยางเปนทางการ ดูเหมือนวาไมวาเยอรมนีจะอยูในมือของราชวงศหรือฟาสซิสต ก็ยังมองชาติของเราเปนศัตรูโดยธรรมชาติ"
 NSB_poland_events.302.t: "ไกเซอรผูเปนปรปกษ"
 NSB_poland_events.303.a: "แลกเมืองที่สรางปญหานั้นกับกองทัพดูจะคุมคา"
 NSB_poland_events.303.desc: "[From.GetNameDefCap] กลับมาพรอมขอเสนอแบบมีเงื่อนไข ซึ่งพวกเขาอางวาจะเปนประโยชนตอทั้งสองฝาย พวกเขาอางวาพระราชบัญญัติ 5 พฤศจิกายนไมเคยตกลงอยางเปนทางการที่จะยกดินแดนพิพาทกดัญสกและกดือเนียใหแกราชอาณาจักร[Root.GetAdjective]ที่เพิ่งกอตั้ง พวกเขาจะยอมลงนามเปนพันธมิตร แตตองมีการแกไขสิ่งที่พวกเขาอางวาเปนการละเมิดเงื่อนไขที่เยอรมนีเคยตกลงไวเสียกอน"
 NSB_poland_events.303.t: "ดานซิกแลกการรับประกัน"
 NSB_poland_events.304.a: "เราจะยึดมันดวยกําลัง"
 NSB_poland_events.304.desc: "นาเสียดายที่ดูเหมือนจะไมสามารถตกลงอะไรกับชาวโปลได และพวกเขาไดปฏิเสธขอเสนอใหยกดานซิกแลกกับการเปนพันธมิตร ความตึงเครียดกําลังกอตัวที่ชายแดน[From.GetAdjective]แลว และบางคนเกรงวาสงครามกําลังใกลเขามา"
 NSB_poland_events.304.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_events.4.a: "ใหพวกเขาไปเถอะ!"
 NSB_poland_events.4.b: "[POL_colony_purchase.GetName] เปนสวนสําคัญที่แยกไมไดของจักรวรรดิ[Root.GetAdjective]!"
 NSB_poland_events.4.desc: "วันนี้สันนิบาตการเดินเรือและอาณานิคมโปแลนดไดเขาพบเอกอัครราชทูต[Root.GetAdjective]ใน [From.Capital.GetName] พรอมขอเสนอขอซื้อดินแดนโพนทะเล [POL_colony_purchase.GetName] การขาย [POL_colony_purchase.GetName] ใหชาวโปลยอมทําให [Root.GetNameDef] มีงบประมาณเกินดุลจํานวนมาก แตก็จะทําให [From.GetNameDef] มีอธิปไตยเหนือ [POL_colony_purchase.GetName] ทั้งหมด รวมถึงวัตถุดิบอันลํ้าคาและประชากรพลเรือนของที่นั่น"
 NSB_poland_events.4.t: "โปแลนดขอซื้อ [POL_colony_purchase.GetName]"
 NSB_poland_events.401.a: "ยินดีตอนรับ ประชาชนแหง [POL_colony_purchase.GetName]"
 NSB_poland_events.401.desc: "วันนี้ [From.GetNameDefCap] กลับมาหาเราและตกลงขายดินแดนโพนทะเล [POL_colony_purchase.GetName] สิ่งที่เหลืออยูคือการชําระหนี้ให [From.GetNameDef] แลวอาณานิคมแหงนี้จะกลายเปนสวนสําคัญของจักรวรรดิอาณานิคม[Root.GetAdjective]ที่กําลังเติบโต"
 NSB_poland_events.401.desc.com: "วันนี้ [From.GetNameDefCap] กลับมาหาเราและตกลงขายดินแดนโพนทะเล [POL_colony_purchase.GetName] สิ่งที่เหลืออยูคือการชําระหนี้ให [From.GetNameDef] แตประชาชนแหง [POL_colony_purchase.GetName] ก็ไดรับการปลดปลอยจากเงื้อมมือลัทธิอาณานิคม[From.GetAdjective]แลว"
 NSB_poland_events.401.desc.dem: "วันนี้ [From.GetNameDefCap] กลับมาหาเราและตกลงขายดินแดนโพนทะเล [POL_colony_purchase.GetName] แมตอนนี้เราจะเปนหนี้ [From.GetNameDef] แตการซื้อขายครั้งนี้มาในยามที่ [Root.GetNameDef] ตองการมากที่สุด เมื่อ [POL_colony_purchase.GetName] อยูภายใตการควบคุมโดยตรงของเรา เราก็ไดฐานที่มั่นอีกแหงที่รัฐบาลของเราจะดํารงอยูตอไปในฐานะรัฐบาลพลัดถิ่น"
 NSB_poland_events.401.t: "การซื้อ [POL_colony_purchase.GetName] สําเร็จ"
 NSB_poland_events.402.a: "ก็คุมที่จะลอง"
 NSB_poland_events.402.desc: "นาเสียดายที่รัฐบาล[From.GetAdjective]ไมสนใจจะยก [POL_colony_purchase.GetName] เลยในตอนนี้ แมเรื่องนี้จะไมไดยุติความทะเยอทะยานโพนทะเลของ[Root.GetAdjective] แตความลมเหลวครั้งนี้ทําใหการโอน [POL_colony_purchase.GetName] อยางสันติเปนไปไมไดโดยสิ้นเชิง"
 NSB_poland_events.402.t: "[From.GetNameDefCap] ปฏิเสธที่จะขาย [POL_colony_purchase.GetName]"
 NSB_poland_events.6.a: "ขอเสนอที่เฉียบแหลม"
 NSB_poland_events.6.b: "ไม"
 NSB_poland_events.6.desc: "ในฤดูใบไมรวงป 1932 สันนิบาตชาติรับรองใหโปแลนดเปนผูคุมครองแตเพียงผูเดียวของไลบีเรีย แตมตินั้นไมเคยไดนําไปปฏิบัติจริงเพราะการแทรกแซงของสหรัฐอเมริกา ถึงกระนั้น ชาติของเราก็เต็มไปดวยนิคมและกิจการที่ดําเนินการโดยสันนิบาตการเดินเรือและอาณานิคมโปแลนด\nขอตกลงนี้สรางผลกําไรใหทั้งสองชาติ แตบัดนี้ดูเหมือน [From.GetNameDef] จะแข็งกราวขึ้น และ [From.GetLeader] ไดรองขออยางเปนทางการให [Root.GetNameDef] เปนรัฐในอารักขาของ[From.GetAdjective]\nหากเรายอมรับ เราจะเปนรัฐในอารักขาของ[From.GetAdjective] พรอมทั้งขอดีและขอเสียทั้งหมดที่ตามมา แตหากเราปฏิเสธ ดูเหมือน [From.GetLeader] อาจผลักดันความทะเยอทะยานของ[From.GetLeader.GetHerHis]ดวยกําลัง"
 NSB_poland_events.6.t: "[From.GetNameDefCap] เสนอสถานะรัฐในอารักขา"
 NSB_poland_events.601.a: "ถาเชนนั้นเราจะยึดมันดวยกําลัง"
 NSB_poland_events.601.b: "อยาใหเรื่องนี้บานปลายไปมากกวานี้เลย"
 NSB_poland_events.601.desc: "แมจะเคยตกลงรับสถานะรัฐในอารักขาไปตั้งแตป 1932 แตดูเหมือนวารัฐบาล[From.GetAdjective]จะไมสนใจรักษาผลประโยชนของ[Root.GetAdjective]ในชาตินี้อีกตอไป"
 NSB_poland_events.601.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_events.7.a: "ขอเสนอที่ยอดเยี่ยม!"
 NSB_poland_events.7.b: "นี่ฟงดูเหมือนกับดักมรณะ"
 NSB_poland_events.7.desc: "เมื่อประชาธิปไตยไดรับการฟนฟูในโปแลนด รัฐบาลโปแลนดชุดใหมก็มุงกระชับความสัมพันธฝรั่งเศส-โปแลนด และสรางพันธมิตรขึ้นทั้งสองฟากของชายแดนเยอรมนี แมโปแลนดจะยังออนแอจากความขัดแยงภายในเมื่อไมนานมานี้ แตไมตองสงสัยเลยวา [GER.GetNameDef] ยอมลําบากหากตองทําสงครามทั้งสองฟากของชายแดน"
 NSB_poland_events.7.t: "โปแลนดเสนอกติกาสัญญามอรฌ"
 NSB_poland_events.701.a: "บางทีอังกฤษอาจรับเรา"
 NSB_poland_events.701.desc: "รัฐบาล [From.GetNameDef] ปฏิเสธที่จะลงนามเปนพันธมิตรอยางเปนทางการกับเราในตอนนี้ ความพายแพทางการทูตอันขมขื่นนี้ทําใหแผนพันธมิตรฝรั่งเศส-โปแลนดของแนวรวมมอรฌกลายเปนเพียงความฝนลม ๆ แลง ๆ และเราตองหันไปหาการสนับสนุนจากที่อื่นแทน"
 NSB_poland_events.8.t: "ชะตากรรมของอนาสตาเซีย โรมานอฟ"
 NSB_poland_events.8.d: "หลังจาก [From.GetNameDefCap] และพันธมิตรยึดมอสโกได สายลับของเราไดพบบันทึกจากหอจดหมายเหตุของ NKVD ที่เปดเผยชะตากรรมอันโหดรายของราชวงศโรมานอฟ รายงานสรุปวาราชวงศทั้งหมด รวมถึงอนาสตาเซีย ถูกพวกบอลเชวิกประหารชีวิตในเดือนกรกฎาคม 1918 หากเราไมรีบลงมือ ไมชาโลกจะรูวาราชินีของเราไมใชคนที่นางอางวาเปน"
 NSB_poland_events.8.a: "ฝงหลักฐานเสีย โลกจะไมมีวันรู"
 NSB_poland_events.8.b: "ควรใหคนอื่นสวมมงกุฎแหงโปแลนด!"
 NSB_poland_monarchist_events.1.t: "[From.GetNameDefCap] อางสิทธิ์ในราชบัลลังกของเรา"
 NSB_poland_monarchist_events.2.a: "ชางมันเถอะ"
 NSB_poland_monarchist_events.2.desc: "นาเสียดายที่เราไมสามารถผลักดันการอางสิทธิ์เหนือ [From.GetNonIdeologyName] ไดอีกตอไป รัฐบาล[From.GetAdjective]ชุดปจจุบันชนะสงครามโฆษณาชวนเชื่ออยางเด็ดขาด จนถึงขั้นที่ใครพูดถึงการอางสิทธิ์ของ [Root.GetLeader] ก็จะถูกหัวเราะเยาะและโหไล"
 NSB_poland_monarchist_events.2.t: "การอางสิทธิ์ของ [Root.GetNameDefCap] ถูกปดตก"
 NSB_poland_monarchist_events.3.a: "บัดซบ!"
 NSB_poland_monarchist_events.3.desc: "วันนี้ [From.GetLeader] ไดรับการราชาภิเษกเปนกษัตริยองคใหมแหง [Root.GetNonIdeologyName] การรณรงคโฆษณาชวนเชื่อตอเนื่องยาวนานไดทําใหรัฐมนตรี[Root.GetAdjective]จํานวนมากหันหลังใหระบอบเกาและกอรัฐประหารโดยไมเสียเลือดเนื้อ รัฐประหารครั้งนี้ทําให [Root.GetNonIdeologyName] แทบไมตางอะไรจากรัฐหุนเชิดของ [From.GetNameDef] และอนาคตของอํานาจปกครองตนเองของ[Root.GetAdjective]ก็ดูมืดมน"
 NSB_poland_monarchist_events.3.t: "รัฐประหารของ [From.GetLeader]!"
 NSB_poland_monarchist_events.4.a: "พวกทรยศ!"
 NSB_poland_monarchist_events.4.desc: "วันนี้ทองถนนของ [Root.GetNonIdeologyName] ลุกเปนไฟ เมื่อกองกําลังติดอาวุธฝายนิยมและตอตานราชาธิปไตยไดฉุดชาติเขาสูสงครามกลางเมือง! ผูสนับสนุน [Root.GetLeader] และ [From.GetLeader] ปะทะกันทั่วประเทศ ขณะที่รัฐมนตรีจาก [From.GetNameDef] ปฏิเสธที่จะยอมรับวามีสวนเกี่ยวของกับการบอนทําลายอธิปไตยของชาติเราครั้งนี้ สิ่งเดียวที่ทําไดตอนนี้คือรอดูวาฝายใดจะเปนผูชนะ"
 NSB_poland_monarchist_events.4.t: "สงครามกลางเมืองฝายนิยมกษัตริย"
 NSB_poland_monarchist_events.5.t: "ผูสนับสนุน [From.GetLeader] เรียกรองใหสละราชสมบัติ"
 NSB_poland_monarchist_events.5.desc: "หลังการรณรงคโฆษณาชวนเชื่อของฝายนิยมกษัตริยที่ยาวนานซึ่งริเริ่มโดย [From.GetLeader] และรัฐบาลของ[From.GetLeader.GetHerHis] ความตึงเครียดระหวางผูภักดีตอ [Root.GetLeader] กับผูที่ตองการเห็นการรวม [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] ไดมาถึงจุดที่การอยูรวมกันอยางสันติไมใชทางเลือกอีกตอไป ผูสนับสนุนฝายนิยมกษัตริยเรียกรองอยางชัดแจงให [Root.GetLeader] สละราชสมบัติและยอมรับ [From.GetLeader] เปนกษัตริยที่แทจริงเพียงหนึ่งเดียวแหง [Root.GetNonIdeologyName]\n\nการยอมรับจะทําให [Root.GetNonIdeologyName] แทบไมตางจากรัฐในอารักขาของ[From.GetAdjective] แตการปฏิเสธแทบจะนําไปสูสงครามกลางเมืองอยางแนนอน"
 NSB_poland_monarchist_events.5.a: "เรายอมจํานน!"
 NSB_poland_monarchist_events.5.b: "ยอมทําสงครามดีกวาเปนหุนเชิดของ[From.GetAdjective]"
 NSB_poland_royal_election.1.a: "พระองคคือกษัตริยของเรา!"
 NSB_poland_royal_election.1.b: "ไม เรามีคนอื่นในใจแลว..."
 NSB_poland_royal_election.1.desc: "มารเกรฟแหงไมเซินและเจาชายแหงซัคเซิน อัลแบรท เลโอโปลด ฟรีดริช คริสทีอัน ซิลเวสเตอร อันโน มาคาริอุส ปรารถนาจะเพิ่มตําแหนงกษัตริยแหงโปแลนดเขาไปในบรรดาตําแหนงอันทรงเกียรติมากมายของพระองค กษัตริยผูยิ่งใหญหลายพระองคแหงเครือจักรภพลวนเปนสมาชิกราชวงศเว็ทททีนและเจาผูคัดเลือกแหงซัคเซิน และเมื่อชาติของเรากําลังแสวงหากษัตริย ฟรีดริช คริสทีอันจึงดูเปนผูสมัครที่ชัดเจนและชอบธรรมที่สุด\nดวยสิทธิ์อางเหนือเครือจักรภพที่พระองคถือครอง การเลือกฟรีดริชยอมเสริมการอางสิทธิ์ของรัฐบาลเราเหนือดินแดนเครือจักรภพเดิมทั้งหมดอยางไมตองสงสัย ในฐานะผูอางสิทธิ์เหนือลิทัวเนีย สมาชิกราชวงศโปแลนดในประวัติศาสตร และมีสายเลือดอันทรงเกียรติหนุนหลัง ฟรีดริช คริสทีอันจึงมีสิทธิ์อันหนักแนนในราชอาณาจักรโปแลนด"
 NSB_poland_royal_election.1.t: "ฟรีดริช คริสทีอันอางสิทธิ์ในราชบัลลังก"
 NSB_poland_royal_election.2.a: "รวมราชบัลลังกของเราหรือ? ความคิดที่ยอดเยี่ยม!"
 NSB_poland_royal_election.2.b: "เราไมอาจเสี่ยงความสัมพันธกับโรมาเนีย"
 NSB_poland_royal_election.2.desc: "การอางสิทธิ์เหนือโปแลนดของราชวงศโฮเฮนซอลเลิรนยอนไปไกลพอ ๆ กับการดํารงอยูของรัฐโปแลนดปจจุบัน และบัดนี้ เมื่อความสัมพันธโปแลนด-โรมาเนียมีความสําคัญยิ่งขึ้นตอการอยูรอดของทั้งสองรัฐ การถวายราชบัลลังกของเราแดอดีตกษัตริยและรัชทายาทแหงโรมาเนีย พระเจามีไฮที่ 1 จึงสมเหตุสมผล\n พระเจามีไฮถูกปลดจากราชบัลลังกในป 1930 เพื่อใหพระราชบิดาขึ้นครองราชยแทน พระองคจึงเปนโอกาสสําหรับการรวมราชบัลลังกโปแลนดและโรมาเนีย ดวยอิทธิพลของกองพิทักษเหล็กฟาสซิสตที่เติบโตขึ้นในโรมาเนีย เราอาจใชกระแสตอตานฟาสซิสตเปนเครื่องมือโคนพระเจาคาโรลอีกครั้งและแทนที่ดวยพระเจามีไฮ ความสําเร็จเชนนี้จะสรางสหภาพที่แยกไมออกระหวางชาติของเรา และเจตจํานงรวมของเราจะเปนพลังอันนาเกรงขามที่ศัตรูของเราใน [SOV.GetNameDef] และ [GER.GetNameDef] ตองรับมือ"
 NSB_poland_royal_election.2.t: "มกุฎราชกุมารมีไฮแหงโรมาเนีย"
 NSB_poland_royal_election.3.a: "เปนความคิดที่บาบิ่น แตนี่คือยุคแหงความบาคลั่ง เราไดกษัตริยแลว!"
 NSB_poland_royal_election.3.b: "พาเวลใครนะ?"
 NSB_poland_royal_election.3.desc: "วันนี้มีผูสมัครที่ไมธรรมดาปรากฏตัวตอคณะผูสําเร็จราชการ เจาชายแหงจอรเจีย คอสแซค และอดีตนายพลรัสเซียขาว พาเวล แบรมอนต-อาวาลอฟ ไดเขาพบคณะผูสําเร็จราชการ โดยอางสิทธิ์ไมเพียงในราชอาณาจักรโปแลนด แตในเครือจักรภพโปแลนด-ลิทัวเนียทั้งหมด\nหลายปกอน คอสแซคผูนี้เคยพยายามรุกรานรัฐบอลติกดวยเหตุผลที่ไมมีใครรู และดูเหมือนวาความทะเยอทะยานของเจาชายจะมีแตเพิ่มขึ้นนับแตนั้น\nแมจะไมเปนที่นิยมในหมูชาวโปลทั่วไป แตผูสมัครที่ไมนาเปนไปไดผูนี้จะนํากองทัพผูลี้ภัยฝายขาวมาดวย ซึ่งจะยั่วยุ [SOV.GetNameDef] แตก็เพิ่มกําลังพลของเราและอาจทําใหเราเขาขางมหาอํานาจฟาสซิสตแหงยุโรป"
 NSB_poland_royal_election.3.t: "กษัตริยคอสแซค"
 NSB_poland_royal_election.4.a: "กษัตริยของเราจะเปนโรมานอฟคนสุดทาย นาจะนะ"
 NSB_poland_royal_election.4.desc: "“ปราสาทวอรซอ นกอินทรีที่วาดไว ใช ขาจําได ขาคือกษัตริยที่แทจริงเพียงหนึ่งเดียวแหงโปแลนด” ผูอางตัววาเปนอนาสตาเซีย โรมานอฟอันอื้อฉาวไดเดินทางมาถึงปราสาทวอรซอในวันนี้พรอมผูประชาสัมพันธ เพื่ออางวาราชวงศโรมานอฟยังคงมีสิทธิ์ในราชบัลลังกโปแลนด และในฐานะโรมานอฟคนสุดทาย นางจึงเปนกษัตริยโดยชอบธรรม การอางสิทธิ์ของอนาสตาเซียไมเพียงอาศัยสิทธิ์ของราชวงศโรมานอฟเหนือโปแลนด แตยังขึ้นอยูกับความชอบธรรมของสายเลือดนางดวย\nแมอดีตขุนนางรัสเซียหลายคนจะยืนยันวานางคืออนาสตาเซียตัวจริง แตหลายคนก็มองวานางเปนแคคนประหลาดที่ไดรับความสนใจจากสื่อมากเกินไป\nแมการอางสิทธิ์ของนางอาจนาสงสัย แตนางคือผูสมัครคนสุดทายในรายชื่อ และหากปฏิเสธนางตอนนี้ โปแลนดก็จะกลับไปอยูที่จุดเริ่มตน นั่นคือราชบัลลังกวางเปลาที่มีแตฝุนจับ"
 NSB_poland_royal_election.4.t: "อนาสตาเซีย โรมานอฟเดินทางถึงโปแลนด"
 NSB_poland_royal_election.5.t: "ผูสมัครจากราชวงศฮาพสบูรค"
 NSB_poland_royal_election.5.desc: "ในฐานะเชื้อพระวงศ สมาชิกราชวงศฮาพสบูรค และผูรักชาติโปแลนด คารล อัลเบรชท ฟอน ฮาพสบูรค รับราชการในกองทัพโปแลนดมาแทบจะนานเทากับที่กองทัพนี้ดํารงอยู แมสายเลือดของพระองคจะไมไดมาจากผืนแผนดินนี้ แตความพรอมที่จะสูและสละชีพเพื่อโปแลนดทําใหพระองคเปนผูสมัครที่เหมาะสมสําหรับราชบัลลังก\n\nแมอารชดยุกดูจะไมคอยทะเยอทะยานที่จะปกครอง แตบางทีพระองคอาจถูกโนมนาวใหรับใชโปแลนด ไมใชดวยอาวุธ แตดวยการเปนผูนํา"
 NSB_poland_royal_election.5.a: "โปแลนดแหงราชวงศฮาพสบูรคถือกําเนิด!"
 NSB_poland_royal_election.5.b: "เราตองการคนอื่น..."
 pavel_events.1.a: "คอสแซคดอนตองเปนอิสระ"
 pavel_events.1.b: "พวกเขาจะขึ้นตรงตอเรา"
 pavel_events.1.desc: "เมื่อหุบเขาดอนทั้งหมดอยูภายใตการควบคุมของ [Root.GetLeader] และกองกําลังของ[Root.GetLeader.GetHerHis]แลว เราจึงอยูในฐานะที่จะฟนฟูสาธารณรัฐดอน และเชิญผูนําของสาธารณรัฐกลับมานําคอสแซคดอนตอสูกับพวกแดงอีกครั้ง!\nคําถามเดียวที่เหลืออยูคือจะไวใจใหกองทัพคอสแซคภักดีในฐานะชาติอิสระไดหรือไม หรือควรใหเปนรัฐบาลหุนเชิดที่ขึ้นตรงตอ [Root.GetLeader]"
 pavel_events.1.t: "การฟนฟูสาธารณรัฐดอน"
 pavel_events.2.a: "ก็ได"
 pavel_events.2.b: "ไวใจพวกเขาไมได พวกเขาตองเปนรัฐในอารักขาของเรา"
 pavel_events.2.desc: "สาธารณรัฐประชาชนคูบันเคยเปนชาติที่เปลี่ยนขาง สูใหฝายขาวแลวหันไปสูใหฝายแดง บัดนี้ [Root.GetLeader] ตัดสินใจฟนฟูสาธารณรัฐคูบันขึ้นใหมภายใตผูนําชุดใหมที่เขาขางฝายขาว\nแมชาวคูบันจะเคยทรยศอุดมการณฝายขาว แตผูนําชุดใหมก็ใหคํามั่นวาจะทําทุกวิถีทางเพื่อบดขยี้การสนับสนุนรัฐบาลชุดเกา"
 pavel_events.2.t: "การฟนฟูสาธารณรัฐคูบัน"
 NSB_poland_democratic_events.1.t: "ปญหาเรื่องผูนํา"
 NSB_poland_democratic_events.1.desc: "บัดนี้เมื่อฝายซานาตซียาถูกถอนรากถอนโคนออกจากรัฐบาลแลว คําถามที่เหลืออยูคือใครควรเปนผูนําพรรคชาวนาโปแลนดใหม สตานิสวัฟ มิโคไวชิก ผูสนับสนุนชาวนาที่แข็งขันและกลาพูดที่สุด ดํารงตําแหนงนี้อยูในขณะนี้ แตก็ไมอาจปฏิเสธไดวาชัยชนะในสงครามกลางเมืองคงเปนไปไมไดหากไมมีการสนับสนุนจากแนวรวมมอรฌ\n\nในฐานะตัวแทนของเหลานายพลที่สนับสนุนการฟนฟูการเลือกตั้งเสรีในโปแลนด แนวรวมมอรฌสนับสนุนวินเซนตี วิทอส อดีตนายกรัฐมนตรีโปแลนดที่อยูในวงการมายาวนาน\n\nแมการแตงตั้งวิทอสเปนผูนําพรรคจะทําใหแนวรวมมอรฌพอใจ แตการปลดมิโคไวชิกออกจากตําแหนงอาจทําใหชาวนาจํานวนมากที่สูรบในแนวหนาเพื่ออุดมการณประชาธิปไตยของเรารูสึกถูกตัดสิทธิ์และถูกพรรคทรยศ"
 NSB_poland_democratic_events.1.a: "วิทอสมีประสบการณ เขาคือผูนําของเรา"
 NSB_poland_democratic_events.1.b: "มิโคไวชิกคือวีรบุรุษของประชาชน เขาคือผูนําของเรา"
 NSB_poland_communist_events.2.a: "นี่คือโอกาสที่ดีที่สุดที่เรามี"
 NSB_poland_communist_events.2.b: "ไม!"
 NSB_poland_communist_events.2.desc: "[From.GetNameDefCap] เสนอใหการคุมครองทางทหารแกเราอยางเต็มที่ แลกกับการเปนเจาเหนือหัวของ [Root.GetNonIdeologyName] โดยอางถึงภัยคุกคามตอการดํารงอยูที่ทั้งเรงดวนและยาวนานตลอดมาซึ่งรัสเซียและเยอรมนีมีตอ [Root.GetNonIdeologyName] นักการเมืองจาก [From.GetNameDef] จึงเสนอสถานะรัฐในอารักขาแกเรา การยอมรับจะทําให [Root.GetNonIdeologyName] กลายเปนรัฐหุนเชิด แตดูเหมือน [From.GetNonIdeologyName] จะไมยอมรับคําปฏิเสธ"
 NSB_poland_communist_events.2.t: "[From.GetNameDefCap] เสนอการคุมครอง"
 NSB_poland_communist_events.201.a: "ยอดเยี่ยม"
 NSB_poland_communist_events.201.desc: "[From.GetNameDefCap] ไดกลายเปนรัฐในอารักขาของ [Root.GetNameDef] แลว เมื่อรัฐบาล[From.GetAdjective]ขึ้นตรงตอ [Root.Capital.GetName] เปาหมายของเราที่จะเปนเจาแหงบอลติกก็ใกลเปนจริงอยางหลีกเลี่ยงไมได"
 NSB_poland_communist_events.201.t: "[From.GetNameDefCap] ยอมรับ!"
 NSB_poland_communist_events.202.a: "เราพึ่งพากองทัพไดเสมอ"
 NSB_poland_communist_events.202.desc: "[From.GetNameDefCap] ปฏิเสธขอเสนอการคุมครองของเราและยืนกรานที่จะรักษาเอกราชของตน ขณะนี้กองบัญชาการสูงสุด[Root.GetAdjective]เริ่มเตรียมการเพื่อทําใหสําเร็จในสิ่งที่กระทรวงการตางประเทศลมเหลว และ [Root.GetLeader] เพียงแคออกคําสั่ง การบุกโจมตี [From.GetNameDef] เต็มรูปแบบก็จะเริ่มขึ้น"
 NSB_poland_communist_events.202.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_communist_events.3.a: "กรรมกรแหง [Root.GetNonIdeologyName] และ [From.GetNonIdeologyName] จงสามัคคีกัน!"
 NSB_poland_communist_events.3.b: "ยอมรับไมได"
 NSB_poland_communist_events.3.desc: "[From.GetNameDefCap] เรียกรองใหผนวก [Root.GetNameDef] ทันที การผนวกนี้เปนสวนหนึ่งของความทะเยอทะยานของ [From.GetLeader] ที่จะกอตั้ง “เครือจักรภพแหงสาธารณรัฐสังคมนิยม” การยอมรับหมายถึงการสละเอกราชของเราทันที และ [Root.GetNonIdeologyName] จะกลายเปนสวนหนึ่งของรัฐ[From.GetAdjective]โดยตรง"
 NSB_poland_communist_events.3.t: "[From.GetNameDefCap] ตองการรวม[Root.GetAdjective]เขาดวยกัน"
 NSB_poland_communist_events.301.a: "นาเสียดายจริง"
 NSB_poland_communist_events.301.desc: "[From.GetNameDefCap] ปฏิเสธที่จะถูกผนวกเขาสูเครือจักรภพแหงสาธารณรัฐสังคมนิยม แมเรื่องนี้จะไมไดหมายถึงจุดจบของความทะเยอทะยานของ[Root.GetAdjective]ในภูมิภาค แตก็หมายความวาความสัมพันธอยางสันติกับ [From.GetNameDef] เปนไปไมไดอีกแลว"
 NSB_poland_communist_events.301.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_communist_events.302.a: "ยอดเยี่ยม"
 NSB_poland_communist_events.302.desc: "ความทะเยอทะยานของ [Root.GetLeader] ที่จะเห็น [From.GetNameDef] เขารวมเครือจักรภพแหงสาธารณรัฐสังคมนิยมไดสัมฤทธิ์ผล เมื่อรัฐบาล[From.GetAdjective]ตกลงยอมอยูภายใตการนําของ[Root.GetAdjective]โดยตรง"
 NSB_poland_communist_events.302.t: "[From.GetNameDefCap] ยอมรับการผนวก"
 NSB_poland_communist_events.4.a: "เรายอมรับ"
 NSB_poland_communist_events.4.b: "พวกเขายังไมพรอม"
 NSB_poland_communist_events.4.desc: "[From.GetNameDefCap] เสนอยกโปแลนดตะวันออกใหเรา แลกกับสถานะรัฐในอารักขาและการบูรณาการอยางใกลชิดกับสหภาพโซเวียต หากเรายอมรับ [From.GetNameDef] จะกลายเปนรัฐหุนเชิดของ [Root.GetNameDef] และรัฐเบลารุสและยูเครนที่โปแลนดยึดครองอยูจะถูกยกใหสหภาพโซเวียต\n\nแมจะดูเปนทางเลือกที่ชัดเจน แตความทะเยอทะยานของเยอรมนีในโปแลนดอาจทําใหสงครามระหวาง [Root.GetNameDef] กับ [GER.GetNameDef] เปนสิ่งที่หลีกเลี่ยงไมได"
 NSB_poland_communist_events.4.t: "[From.GetNameDefCap] เสนอดินแดนตะวันออก"
 NSB_poland_communist_events.401.a: "การเสียสละที่จําเปน"
 NSB_poland_communist_events.401.desc: "[From.GetNameDefCap] ตกลงรับเราเปนรัฐในอารักขา และเราไดถูกรวมเขากับสหภาพโซเวียตในฐานะรัฐในอารักขาแลว แมผูคนทั่วประเทศจํานวนมากจะรูสึกถูกทรยศจากการตัดสินใจครั้งนี้ แต [Root.GetLeader] ก็ใหคํามั่นแกชาวโปแลนดวา [From.GetLeader] เปนมิตรของโปแลนด และชาวโปลที่ถูกรวมเขากับสหภาพโซเวียตโดยตรงจะพึงพอใจกับเจาเหนือหัว[From.GetAdjective]คนใหมอยางแนนอน"
 NSB_poland_communist_events.401.t: "[From.GetNameDefCap] ยอมรับ!"
 NSB_poland_communist_events.402.a: "ก็ได"
 NSB_poland_communist_events.402.desc: "[From.GetLeader] ปฏิเสธที่จะรับ [Root.GetNameDef] เขาสูสหภาพโซเวียต โดยระบุวา [Root.GetLeader] “ยังไมพรอม” แมนั่นจะเปนเหตุผลอยางเปนทางการ แตหลายคนสงสัยวาความทะเยอทะยานของเยอรมนีในโปแลนดคือสาเหตุที่แทจริงของการปฏิเสธนี้"
 NSB_poland_communist_events.402.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_communist_events.5.a: "เอกราชไมใชทางเลือกเด็ดขาด"
 NSB_poland_communist_events.5.b: "เรามีเรื่องที่ตองกังวลมากกวานี้"
 NSB_poland_communist_events.5.desc: "[From.GetNameDefCap] ไมไดเปนรัฐหุนเชิดของ[Root.GetAdjective]อีกตอไป และรัฐเล็ก ๆ แหงนี้ไดประกาศตนเปนสาธารณรัฐสังคมนิยมอิสระ ขณะนี้สถานการณยังสงบ และ [From.GetNameDef] ยังคงเปนสมาชิกของ [Root.GetFactionName]"
 NSB_poland_communist_events.5.t: "[From.GetNameDefCap] ประกาศเอกราช!"
 NSB_poland_communist_events.501.a: "ถาอยางนั้นก็ตองสงคราม!"
 NSB_poland_communist_events.501.desc: "อยางที่คาดการณได [From.GetLeader] ไมพอใจการประกาศเอกราชของ[Root.GetAdjective]และประกาศวาเปนการกระทําที่ถือเปนการกอสงคราม"
 NSB_poland_communist_events.501.t: "[From.GetNameDefCap] ประกาศสงคราม"
 NSB_poland_communist_events.502.a: "เราจะอยูใน [From.GetFactionName] ตอไป"
 NSB_poland_communist_events.502.b: "เราประกาศเอกราชโดยสมบูรณ"
 NSB_poland_communist_events.502.desc: "[From.GetNameDefCap] ยอมรับการประกาศเอกราชของเรา และดูเหมือนวาชาติของเราจะยังมีสันติภาพตอกันในตอนนี้ แมบัดนี้เราจะเปนเอกราชโดยสมบูรณ แตเราก็ยังคงเกี่ยวของกับ [From.GetNameDef] ตอไปได หรือจะออกจากฝายเพื่อแสวงหาทางเลือกอื่นก็ได"
 NSB_poland_communist_events.502.t: "[From.GetNameDef] ยอมรับเอกราชของ[Root.GetAdjective]"
 NSB_poland_communist_events.6.a: "ไมใชเรื่องสําคัญอะไร"
 NSB_poland_communist_events.6.b: "นั่นคือดินแดนของเรา"
 NSB_poland_communist_events.6.desc: "แมโปแลนดตะวันออกจะเปนสวนหนึ่งของขอตกลงที่นํา [From.GetNameDef] เขาสู [Root.GetFactionName] แตรัฐเล็ก ๆ แหงนี้ไดรองขอดินแดนคืน โดยอางถึงความภักดีของรัฐตนตออุดมการณสากล พวกเขาอางวาประชาชนในเบลารุสตะวันตกและยูเครนเปนสวนหนึ่งของรัฐโปแลนดมาหลายทศวรรษ และมีบทบาทสําคัญในการนัดหยุดงานของชาวนาซึ่งนําไปสูการผงาดของสังคมนิยมในโปแลนด"
 NSB_poland_communist_events.6.t: "[From.GetNameDefCap] ขอโปแลนดตะวันออกคืน"
 NSB_poland_communist_events.601.a: "ชาติของเรากลับมาสมบูรณอีกครั้ง"
 NSB_poland_communist_events.601.desc: "โปแลนดตะวันออกไดกลับคืนมาเปนดินแดนหลักของ [Root.GetNameDef] แลว ขณะนี้ดินแดนเหลานี้กําลังถูกผนวกกลับเขาสูการบริหารของ[Root.GetAdjective] และภูมิภาคที่มีบทบาทสําคัญยิ่งในการโคนระบอบเกาก็ไดกลับมารวมกับรัฐที่ประชาชนของตนสูรบเพื่อมันแลว"
 NSB_poland_communist_events.601.t: "[From.GetNameDefCap] คืนโปแลนดตะวันออก!"
 NSB_poland_communist_events.602.a: "ก็ได"
 NSB_poland_communist_events.602.b: "ถาอยางนั้นก็เอกราช!"
 NSB_poland_communist_events.602.desc: "[From.GetNameDefCap] ปฏิเสธที่จะคืนโปแลนดตะวันออกให [Root.GetNameDef] แมจะเปนผลที่คาดเดาได แตชาวโปลจํานวนมากก็ยังผิดหวัง และกระแสความตองการแยกตัวจาก [From.GetNameDef] ก็กําลังเติบโตขึ้น"
 NSB_poland_communist_events.602.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_poland_monarchist_events.1.a: "เราตองตอตาน"
 NSB_poland_monarchist_events.1.desc: "เมื่อ [From.GetLeader] ไดรับการราชาภิเษกเปนกษัตริยแหง [From.GetNonIdeologyName] แลว ดูเหมือนรัฐบาล[From.GetAdjective]จะใชสิ่งนี้เปนขออางในการอางสิทธิ์เหนือ [Root.GetNonIdeologyName]! ดวยสงครามโฆษณาชวนเชื่อและการแสดงทาที [From.GetNameDef] จะพยายามใชฝายตอตานระบอบของ [Root.GetLeader] เปนอาวุธและสนับสนุนการรัฐประหารจากภายใน\nหากการโฆษณาชวนเชื่อนี้ไดผล [Root.GetLeader] อาจตองเผชิญรัฐประหาร และ [Root.GetNonIdeologyName] จะถูกลดสถานะลงจนแทบไมตางจากรัฐหุนเชิดของ[From.GetAdjective]"
 NSB_poland_royal_election.4.b: "บางทีเราอาจปดตกฟรีดริช คริสทีอันเร็วเกินไป..."
 NSB_polish_fascist_events.1.a: "จะบุกไปทําไม ในเมื่อพวกเขายอมมอบตัวเอง?"
 NSB_polish_fascist_events.1.b: "เรามีแผนอื่นสําหรับโปแลนด"
 NSB_polish_fascist_events.1.desc: "รัฐบาล[From.GetAdjective]เสนอกติกาสัญญาเพื่อสนับสนุนเปาหมายการเปนเจาโลกของเรา เห็นไดชัดวา [From.GetLeader] รูดีวา [Root.GetLeader] ไมพอใจกับการแบงเขตแดนระหวางโปแลนดกับเยอรมนี ยูเซฟ เบ็ค รัฐมนตรีวาการกระทรวงการตางประเทศโปแลนดจึงถูกสงมาเพื่อเสนอแกไขขอตกลงนี้\n\nโปแลนดตกลงยกดินแดนตะวันตกอยางพอซนาน ดานซิก และไซลีเซียตอนบน แลกกับสนธิสัญญาไมรุกรานตอกันและการคุมครองและชี้นําของเยอรมนีตอความพยายามรุกรานใด ๆ ของ[SOV.GetAdjective] โดยพื้นฐานแลวกติกาสัญญานี้จะทําใหโปแลนดแทบไมตางจากรัฐหุนเชิดของเยอรมนี พรอมกับยกดินแดนพิพาทตามชายแดนของเราใหดวย เราควรตกลงหรือไม?"
 NSB_polish_fascist_events.1.t: "กติกาสัญญาเบ็ค-ริบเบนทรอพ"
 NSB_polish_fascist_events.101.a: "ปลอดภัย แตตองแลกดวยอะไร?"
 NSB_polish_fascist_events.101.desc: "[From.GetNameDefCap] ตกลงตามเงื่อนไขของเรา และบัดนี้ [Root.GetNameDef] อยูภายใตการคุมครองของ[From.GetAdjective]อยางเปนทางการแลว ขณะนี้ทหาร[From.GetAdjective]กําลังหลั่งไหลเขาสูชนบท[Root.GetAdjective] และรัฐมนตรีของเราตองขึ้นตรงตอเบอรลิน"
 NSB_polish_fascist_events.101.t: "[From.GetNameDefCap] ลงนามในกติกาสัญญา"
 NSB_polish_fascist_events.102.a: "ถึงเวลาเปลี่ยนเสนทาง"
 NSB_polish_fascist_events.102.desc: "แมขอเสนอของเราจะเทากับยื่นกุญแจชาติให [From.GetLeader] โดยตรง แตดูเหมือนรัฐบาล[From.GetAdjective]จะมีแผนอื่น และไดปฏิเสธขอเสนอของเราอยางเด็ดขาด"
 NSB_polish_fascist_events.102.t: "[From.GetNameDefCap] ปฏิเสธกติกาสัญญา"
 NSB_polish_fascist_events.2.a: "ยื่นคําขาด"
 NSB_polish_fascist_events.2.b: "ก็ได"
 NSB_polish_fascist_events.2.c: "ไม"
 NSB_polish_fascist_events.2.desc: "แมปจจุบันจะอยูในฐานะลูกนองของ[Root.GetAdjective] แตดูเหมือน [From.GetNameDef] ยังคงมีความทะเยอทะยานที่จะเปนเจาแหงเครือจักรภพ [From.GetLeader] ยอมรับการอางสิทธิ์ของเราในเมเมล และเสนอใหแบงชาตินั้น โดยใหภูมิภาคเมเมลอยูภายใตการควบคุมของ[Root.GetAdjective] และสวนที่เหลือของประเทศเปนของ[From.GetAdjective]"
 NSB_polish_fascist_events.2.t: "[From.GetNameDefCap] ตองการแบงลิทัวเนีย"
 NSB_polish_fascist_events.201.a: "เราไมมีทางเลือก"
 NSB_polish_fascist_events.201.b: "เราปฏิเสธ!"
 NSB_polish_fascist_events.201.desc: "ขอเรียกรองรวมใหผนวกดินแดนไดมาจากพันธมิตรที่ไมนาเปนไปไดระหวาง [POL.GetNameDef] กับ [GER.GetNameDef] พวกเขาเรียกรองใหยกภูมิภาคเมเมลใหเยอรมนี และใหสวนที่เหลือของชาติเราถูกโปแลนดผนวกทั้งหมด"
 NSB_polish_fascist_events.201.t: "เยอรมนีและโปแลนดเรียกรองใหผนวกลิทัวเนีย"
 NSB_polish_fascist_events.202.a: "นาเสียดาย"
 NSB_polish_fascist_events.202.desc: "ดูเหมือนเยอรมนีจะมีแผนอื่นสําหรับลิทัวเนีย เพราะขอเสนอการผนวกของเราถูกปฏิเสธเปนเอกฉันท"
 NSB_polish_fascist_events.202.t: "[From.GetNameDefCap] ปฏิเสธ"
 NSB_polish_fascist_events.203.a: "ยอดเยี่ยม"
 NSB_polish_fascist_events.203.desc: "[From.GetNameDefCap] ยอมตามขอเรียกรองของเรา และขณะนี้ดินแดนเดิมของลิทัวเนียกําลังถูกแบงระหวางโปแลนดกับเยอรมนี โดยไมตองยิงกระสุนแมแตนัดเดียว ลิทัวเนียก็เปนของเราแลว"
 NSB_polish_fascist_events.203.t: "[From.GetNameDefCap] ยินยอม"
 NSB_polish_fascist_events.204.a: "งั้นก็ยึดมาดวยกําลังเสีย"
 NSB_polish_fascist_events.204.desc: "ดูเหมือนลิทัวเนียจะปฏิเสธขอเรียกรองอันสมเหตุสมผลของเรา แมการทูตอาจลมเหลว แตบัดนี้เรื่องนี้ไดกลายเปนเรื่องของกองทัพแลว"
 NSB_polish_fascist_events.204.t: "[From.GetNameDefCap] ทาทาย!"
 NSB_polish_fascist_events.3.a: "ฟงดูสมเหตุสมผล"
 NSB_polish_fascist_events.3.b: "ไม โปแลนดเปนของเรา"
 NSB_polish_fascist_events.3.desc: "โดยอางวาการที่เราใชโรงงานของโปแลนดเปนอุปสรรคตอความพยายามในสงคราม รัฐมนตรีจาก [From.GetNameDef] จึงรองขอใหเราผอนปรนขอเรียกรองตอชาติของพวกเขา แมขอตกลงนี้จะยังคงสถานะของโปแลนดไวเปนรัฐในอารักขาของ[Root.GetAdjective] แตก็จะเพิ่มความเปนอิสระทางการเมืองและเศรษฐกิจใหพวกเขาอยางมาก"
 NSB_polish_fascist_events.3.t: "[From.GetNameDefCap] ขออํานาจปกครองตนเอง"
 NSB_polish_fascist_events.301.a: "ยอดเยี่ยม"
 NSB_polish_fascist_events.301.desc: "[From.GetNameDefCap] ตกลงเพิ่มอํานาจปกครองตนเองใหรัฐของเราอยางมาก แมเรายังคงเปนรัฐในอารักขาของ[From.GetAdjective] แตบัดนี้เรามีอิสระทางอุตสาหกรรมและการทูตมากขึ้นมาก"
 NSB_polish_fascist_events.301.t: "[From.GetNameDefCap] มอบอํานาจปกครองตนเอง"
 NSB_polish_fascist_events.302.a: "อนิจจา"
 NSB_polish_fascist_events.302.b: "บางทีรัฐใตดินอาจชวยได..."
 NSB_polish_fascist_events.302.desc: "คําขออํานาจปกครองตนเองของเราถูก [From.GetNameDef] ปฏิเสธอยางรุนแรง ถึงขั้นที่ที่ปรึกษา[From.GetAdjective]รูสึกขุนเคืองแคที่มีการเสนอเรื่องนี้ พวกเขาอางวาการที่เรายังคงอยูใตอํานาจเปนสวนจําเปนของความพยายามในสงคราม และดูเหมือนเราจะยังคงเปนรัฐในอารักขาของพวกเขาตอไปอีกนาน"
 NSB_polish_fascist_events.302.t: "[From.GetNameDefCap] กระชับบังเหียน"
 NSB_polish_fascist_events.4.a: "เราควรยึดรัฐบอลติก"
 NSB_polish_fascist_events.4.b: "เบลารุสและยูเครนจะเปนบานของเรา"
 NSB_polish_fascist_events.4.c: "เราตองทําใหอินเตอรมาเรียมสมบูรณ"
 NSB_polish_fascist_events.4.desc.first: "เราเสียสละไปมากมายในความพยายามกําจัดลัทธิบอลเชวิค ทั้งชายแดนตะวันตก เอกราช และชีวิตทหารนับไมถวน บัดนี้ถึงเวลาที่จะขอบางสิ่งเปนการตอบแทน เมื่อสงครามกับ [SOV.GetNameDef] แนนอนวาจะจบดวยชัยชนะ เราจึงเห็นโอกาสมากมายนับไมถวนในการขยายดินแดนโปแลนดทางตะวันออก"
 NSB_polish_fascist_events.4.desc.rejected: "[From.GetNameDefCap] ปฏิเสธขอเสนอเรื่องพรมแดนหลังสงครามของเรา แตนั่นไมใชเรื่องสําคัญอะไร ในเมื่อยังมีวิสัยทัศนอื่นอีกมากมายสําหรับรัฐโปแลนดหลังสงคราม"
 NSB_polish_fascist_events.4.t: "โปแลนดหลังสงคราม"
 NSB_polish_fascist_events.401.a: "เปนที่นาพอใจ"
 NSB_polish_fascist_events.401.b: "ไม"
 NSB_polish_fascist_events.401.desc.baltics: "โปแลนดเขามาหาเราพรอมขอเสนอเรื่องพรมแดนในอนาคตหลังสงคราม โดยอางถึงดินแดนที่พวกเขาเสียให [Root.GetNameDef] ในกติกาสัญญาเบ็ค-ริบเบนทรอพ รัฐบาล[From.GetAdjective]เชื่อวาตนมีสิทธิ์ไดรับการปรับแกดินแดนบางสวนหลังชนะสงคราม\n\nพวกเขาตองการขยายขึ้นไปทางเหนือสูรัฐบอลติก โดยอางถึงรัฐบริวารเดิมของเครือจักรภพอยางคูรลันดเปนเหตุผล"
 NSB_polish_fascist_events.401.desc.ukraine: "โปแลนดเขามาหาเราพรอมขอเสนอเรื่องพรมแดนในอนาคตหลังสงคราม โดยอางถึงดินแดนที่พวกเขาเสียให [Root.GetNameDef] ในกติกาสัญญาเบ็ค-ริบเบนทรอพ รัฐบาล[From.GetAdjective]เชื่อวาตนมีสิทธิ์ไดรับการปรับแกดินแดนบางสวนหลังชนะสงคราม\n\nพวกเขาตองการขยายไปทางตะวันออกสูเบลารุสและยูเครน โดยอางถึงดินแดนเดิมของเครือจักรภพทางตะวันออก"
 NSB_polish_fascist_events.401.desc.blacksea: "โปแลนดเขามาหาเราพรอมขอเสนอเรื่องพรมแดนในอนาคตหลังสงคราม โดยอางถึงดินแดนที่พวกเขาเสียให [Root.GetNameDef] ในกติกาสัญญาเบ็ค-ริบเบนทรอพ รัฐบาล[From.GetAdjective]เชื่อวาตนมีสิทธิ์ไดรับการปรับแกดินแดนบางสวนหลังชนะสงคราม\n\nพวกเขาตองการขยายลงไปทางใตสูไครเมีย โดยอางถึงความทะเยอทะยานที่มีมาชานานที่จะใหโปแลนดแผไพศาลจากทะเลจรดทะเล"
 NSB_polish_fascist_events.402.a: "อนาคตของโปแลนดมั่นคงแลว"
 NSB_polish_fascist_events.402.desc: "ขอเสนอเรื่องพรมแดนในอนาคตของโปแลนดไดรับการยอมรับจาก [From.GetNameDef] แลว และขณะนี้ภูมิภาคที่เราอางสิทธิ์กําลังถูกรวมเขากับการบริหารพลเรือนของเรา แมเราอาจไมมีวันไดดินแดนตะวันตกคืน แตดินแดนใหมเหลานี้ก็ชดเชยผืนแผนดินที่ถูกพรากไปเมื่อไมกี่ปกอนไดอยางเหลือเฟอ"
 NSB_polish_fascist_events.5.a: "ความริเริ่มที่ยอดเยี่ยม"
 NSB_polish_fascist_events.5.b: "คิดวาไมละ"
 NSB_polish_fascist_events.5.desc: "[From.GetNameDef] ไดเชิญเราเขารวมองคการฟาลังเฆสากล ซึ่งเปนพันธมิตรที่ตั้งอยูบนหลักการของลัทธิฟาลังเฆและอัตลักษณคาทอลิกเปนสําคัญ การตอบรับหมายความวาชาติทั้งสองจะรวมรบดวยกันในยามสงคราม และยังจะทําใหกลุมฟาลังเฆในรัฐบาลของเรากลาแข็งและมีอํานาจมากขึ้น เราควรตอบรับหรือไม?"
 NSB_polish_fascist_events.5.t: "[From.GetNameDefCap] เชิญเราเขารวมองคการฟาลังเฆสากล"
 NSB_polish_fascist_events.6.t: "การจลาจลในวอรซอ"
 NSB_polish_fascist_events.6.desc: "การเสริมอํานาจและการปลุกปนของฝายฟาลังเฆอยางตอเนื่องไดปะทุเปนการจลาจลชาตินิยมหลายระลอกบนทองถนนในวอรซอ เห็นไดชัดวาไดใจจากการที่ [Root.GetLeader] เต็มใจรวมมือและสนับสนุนพวกขวาจัด ผูกอจลาจลเดินขบวนผานทองถนนในวอรซอ และไปจบที่การเผชิญหนาที่ปราสาทวอรซอ นายทหารที่ภักดีตอฝายซานาตซียาในรัฐบาลไมสามารถหยุดยั้งฝูงชนได เมื่อพวกเขาบุกเขาเมืองหลวงและลากตัว [Root.GetLeader] ออกจากอาคาร\n\nขณะนี้ผูนําฝายซานาตซียาทั้งหมดถูกขับออกจากปราสาทแลว และบอแลสวัฟ ปยาเซตสกีไดประกาศตนเปนผูนําของรัฐโปแลนดใหม"
 NSB_polish_fascist_events.6.a: "ทุกอยางเปนไปตามแผน"
 NSB_polish_fascist_events.7.t: "การเลือกตั้งระดับชาติของโปแลนด"
 NSB_polish_fascist_events.7.desc: "เมื่อฝายซานาตซียารับเอานโยบายและความเชื่อของพรรคชาตินิยมประชาธิปไตยมาใชมากขึ้นเรื่อย ๆ หลายคนจึงมองวาเปนเพียงเรื่องของเวลากอนที่สาธารณรัฐจะเปดการเลือกตั้งระดับชาติอีกครั้ง ดวยการลงนามในรัฐธรรมนูญแหงชาติฉบับที่สามของโปแลนด การเลือกตั้งจึงกลับมาอีกครั้ง แตมีเงื่อนไขวาพรรคที่ถูกมองวาไมรักชาติจะไมไดรับอนุญาตใหปกครอง\n\nพรรค “ไมรักชาติ” รวมถึง PSL และพรรคฝายซายและสายกลางสําคัญอื่น ๆ สวนใหญ ทําใหผูมีสิทธิ์เลือกตั้งแทบไมมีทางเลือกอื่นนอกจากพรรคชาตินิยมประชาธิปไตย พรรคชาตินิยมประชาธิปไตยชนะการเลือกตั้ง โดยพรรคคูแขงอยางซานาตซียาไดคะแนนเสียงเพียงเศษเสี้ยว ทําให ND ควบคุมสาธารณรัฐไดแทบทั้งหมด"
 NSB_polish_fascist_events.7.a: "ฉันรักประชาธิปไตย"
 nsb_news.1.a: "กรรมกรแหงโปแลนดลุกขึ้นสู!"
 nsb_news.1.b: "เราจะบดขยี้พวกหัวรั้นเหลานี้!"
 nsb_news.1.c: "พระแมมารีย โปรดคุมครองเรา"
 nsb_news.1.d: "ดูโปแลนดแบงแยกตัวเองสิ"
 nsb_news.1.e: "เรื่องนี้จะมีความหมายอยางไรตอโปแลนด?"
 nsb_news.1.desc: "รัฐโปแลนดอันเยาววัยไดปะทุเขาสูสงครามกลางเมือง! ความขัดแยงภายในรัฐบาลนานหลายทศวรรษและการไมลงทุนดานโครงสรางพื้นฐานในชนบทโปแลนดตะวันออกเลย นําไปสูการนัดหยุดงานทั่วไปของชนชั้นลางเมื่อตนปนี้ และการปฏิบัติอยางโหดรายตอผูนัดหยุดงานโดยตํารวจและทหารอยางตอเนื่องไดแบงชาติออกเปนสองฝาย\n\nรัฐบาลชาวนาซึ่งนําโดย [peasant_poland_target.GetLeader] ไดรับการสนับสนุนจากฝายแนวรวมมอรฌซึ่งเปนฝายประชาธิปไตยในกองทัพโปแลนด และแนวรวมของมารกซิสต สังคมนิยม และเสรีนิยม\n\nเมื่อกองกําลังฝายภักดีรวมตัวอยูในใจกลางอุตสาหกรรมของโปแลนด และชาวนาอยูในชนบททางตะวันออก โปแลนดจึงถูกแบงแยกดวยเลือดของชาวนา"
 nsb_news.1.t: "การลุกฮือของชาวนาใน [peasant_poland_target.Capital.GetName]"
 nsb_news.2.a: "นี่เปนการดูหมิ่นกัน!"
 nsb_news.2.b: "สวนขานะ ขอตอนรับเจานายชาวโปลคนใหมของเรา"
 nsb_news.2.c: "ไลบีเรียเปนเพียงจุดเริ่มตน"
 nsb_news.2.d: "โปแลนดในแอฟริกา?"
 nsb_news.2.f: "การกระทําแบบจักรวรรดินิยมไรเหตุผลอีกครั้ง"
 nsb_news.2.e: "นี่… ดูเหมือนจักรวรรดินิยมแน ๆ"
 nsb_news.2.desc.dem: "วันนี้โปแลนดไดเขาเปนเจาเหนือหัวของไลบีเรีย! นับตั้งแตป 1932 ไลบีเรียมองโปแลนดเปนหุนสวนการลงทุนที่ตนเลือก ดวยเชื่อวาชาตินี้แทบไมมีความทะเยอทะยานทางอาณานิคม อยางไรก็ตาม ขอตกลงที่ลงนามระหวางโปแลนด ไลบีเรีย และสันนิบาตชาติ ไดทําใหไลบีเรียแทบไมตางจากรัฐหุนเชิดของโปแลนด\n\nเจาหนาที่สหรัฐอเมริกาประณามการตัดสินใจนี้ เพราะมองวาเอกราชของไลบีเรียเปนองคประกอบสําคัญของหลักการกอตั้งชาตินั้น\n\nสันนิบาตการเดินเรือและอาณานิคมโปแลนดมองวานี่เปนชัยชนะครั้งใหญของความทะเยอทะยานทางอาณานิคมของโปแลนด และอางวานี่ยังหางไกลจากความทะเยอทะยานทั้งหมดของชาวโปลในแอฟริกา"
 nsb_news.2.desc.com: "วันนี้โปแลนดไดเขาเปนเจาเหนือหัวของไลบีเรีย! นับตั้งแตป 1932 ไลบีเรียมองโปแลนดเปนหุนสวนการลงทุนที่ตนเลือก ดวยเชื่อวาชาตินี้แทบไมมีความทะเยอทะยานทางอาณานิคม อยางไรก็ตาม ขอตกลงนี้ไดทําใหไลบีเรียแทบไมตางจากรัฐหุนเชิดของโปแลนด\n\nเจาหนาที่สหรัฐอเมริกาประณามการตัดสินใจนี้ เพราะมองวาเอกราชของไลบีเรียเปนองคประกอบสําคัญของหลักการกอตั้งชาตินั้น\n\n[POL.GetLeader] ถูกสมาชิก KPP ดวยกันกลาวหาวากระทําการแบบลัทธิอาณานิคม [POL.GetLeader.GetSheHe] ยืนยันวานี่เปนเพียงการปกปองไลบีเรียจากผูที่หมายจะลาอาณานิคม แตหลายคนก็ยังไมเชื่อ"
 nsb_news.2.t: "ประกาศสถาปนารัฐในอารักขา[LIB.GetAdjective]"
 nsb_news.3.t: "เติรกสถานรวมเปนหนึ่ง!"
 nsb_news.3.desc: "เมื่อภูมิภาคเอเชียกลางทั้งหมดอยูภายใตการควบคุมของ[From.GetOldAdjective]อยางมั่นคง ชนชาติเติรกก็ไดรวมเปนหนึ่งภายใตการนําของ [From.GetLeader] ฝายบริหารเติรกชุดใหมประกาศวา [From.GetOldNameDef] จะเปนที่รูจักในนาม [From.GetNameDef] นับแตนี้ และเปนบานอันชอบธรรมของชนชาติเติรกทั้งปวง\n\nแมแตนอกพรมแดนของชาติใหมนี้ ชนชาติเติรกจํานวนมากก็เริ่มมอง [From.GetNameDef] เปนบานที่แทจริงของตน และ [From.GetLeader] อาจใชโอกาสนี้ขยายชาติที่กําลังเติบโตนี้ออกไป"
 nsb_news.3.a: "เราจะไมแตกแยกอีกตอไป"
 nsb_news.3.b: "นาสนใจ"
 nsb_news.4.t: "[POL.GetNameDefCap] ยึดดานซิก!"
 nsb_news.4.desc: "นครเสรีดานซิกซึ่งกอตั้งขึ้นโดยสนธิสัญญาแวรซายในป 1920 เปนชาติเอกราชภายใตการคุมครองของรัฐโปแลนดมาจนถึงวันนี้ อยางไรก็ตาม เมื่อความตึงเครียดตามแนวชายแดนเยอรมนี-โปแลนดทวีขึ้น และรัฐบาลดานซิกปฏิเสธไมใหการคาของโปแลนดผานทาเรือของเมือง วันนี้รัฐบาลโปแลนดจึงประกาศวาดานซิกไมใชนครเสรีอีกตอไป\n\nขณะนี้ทองถนนในดานซิกเต็มไปดวยทหารโปแลนดที่มีภารกิจเดียวคือเพิ่มอํานาจของรัฐเหนือเมืองนี้ อัลแบรท ฟอรสเตอรและสมาชิกพรรคนาซีอีกหลายคนไดหลบซอนตัว และมีขาวลือเรื่องการกอกบฏและการแปรพักตรไปเขากับ [GER.GetNameDef] ในที่สุด"
 nsb_news.4.a: "ไมใชนคร ‘เสรี’ อีกตอไป"
 nsb_news.4.b: "ตอไปจะเปนอะไรอีก? การนํากําลังทหารกลับเขาไรนแลนดหรือ?"
 nsb_news.4.c: "เราคาดหวังจากโปแลนดไวดีกวานี้"
 nsb_news.4.d: "พวกเขายึดเมืองไวไดไมนานหรอก"
 nsb_news.4.e: "นาสนใจ"
 nsb_news.5.t: "[POL.GetNameDefCap] สถาปนากษัตริย!"
 nsb_news.5.desc.saxon: "เมื่อวันที่ 5 พฤศจิกายน 1916 จักรพรรดิวิลเฮลมที่ 2 แหงเยอรมนีและจักรพรรดิฟรันซ โยเซฟแหงออสเตรียไดลงนามในคําประกาศรวมวาจะกอตั้งราชอาณาจักรใหมขึ้นจากดินแดนโปแลนดที่ยึดครองไดจากรัสเซีย นั่นคือราชอาณาจักรโปแลนด อยางไรก็ตาม รัฐอันเยาววัยนี้ไมสามารถหากษัตริยไดทันเวลา และประธานาธิบดีในขณะนั้นก็ประกาศสถาปนาสาธารณรัฐโปแลนดที่สอง\n\nทวาดูเหมือนวาในที่สุดโปแลนดก็ไดกษัตริยแลวใน [POL.GetLeader]! มารเกรฟแหงไมเซินบัดนี้คือพระเจาฟรีดริชที่ 1 แหงโปแลนด แมจะมีความหวาดกลัววาสงครามกับเยอรมนีใกลเขามา แตคณะผูสําเร็จราชการโปแลนดก็ถวายราชบัลลังกแดมารเกรฟ เนื่องจากความเชื่อมโยงทางประวัติศาสตรอันยาวนานระหวางโปแลนดกับขุนนางแหงซัคเซิน"
 nsb_news.5.desc.romania: "เมื่อวันที่ 5 พฤศจิกายน 1916 จักรพรรดิวิลเฮลมที่ 2 แหงเยอรมนีและจักรพรรดิฟรันซ โยเซฟแหงออสเตรียไดลงนามในคําประกาศรวมวาจะกอตั้งราชอาณาจักรใหมขึ้นจากดินแดนโปแลนดที่ยึดครองไดจากรัสเซีย นั่นคือราชอาณาจักรโปแลนด อยางไรก็ตาม รัฐอันเยาววัยนี้ไมสามารถหากษัตริยไดทันเวลา และประธานาธิบดีในขณะนั้นก็ประกาศสถาปนาสาธารณรัฐโปแลนดที่สอง\n\nทวาดูเหมือนวาในที่สุดโปแลนดก็ไดกษัตริยแลวใน [POL.GetLeader]! ดวยมิตรภาพและพันธมิตรอันยาวนานระหวางโปแลนดกับโรมาเนีย ดูเหมือนคณะผูสําเร็จราชการโปแลนดจะมุงหวังความสัมพันธที่ใกลชิดยิ่งขึ้นกับ [ROM.GetNameDef] ในฐานะรัชทายาทแหงราชบัลลังกโรมาเนีย จึงเปนเพียงเรื่องของเวลากอนที่ทั้งสองชาติจะผูกพันกันอยางแยกไมออก"
 nsb_news.5.desc.cossack: "เมื่อวันที่ 5 พฤศจิกายน 1916 จักรพรรดิวิลเฮลมที่ 2 แหงเยอรมนีและจักรพรรดิฟรันซ โยเซฟแหงออสเตรียไดลงนามในคําประกาศรวมวาจะกอตั้งราชอาณาจักรใหมขึ้นจากดินแดนโปแลนดที่ยึดครองไดจากรัสเซีย นั่นคือราชอาณาจักรโปแลนด อยางไรก็ตาม รัฐอันเยาววัยนี้ไมสามารถหากษัตริยไดทันเวลา และประธานาธิบดีในขณะนั้นก็ประกาศสถาปนาสาธารณรัฐโปแลนดที่สอง\n\nทวาดูเหมือนวาในที่สุดโปแลนดก็ไดกษัตริยแลวใน [POL.GetLeader]! ในฐานะคอสแซค ขุนนาง และขุนศึก [POL.GetLeader] เปนผูอางสิทธิ์ในราชบัลลังกโปแลนดที่ไมนาเปนไปได แตไมตองสงสัยวาความทะเยอทะยานไมรูจบของเขาที่จะมีศักดินาสวนตัวในบอลติก ยอมดึงดูดใจรัฐมนตรีโปแลนดที่ยังคงฝนถึงการฟนฟูเครือจักรภพอยูในใจ"
 nsb_news.5.desc.romanov: "เมื่อวันที่ 5 พฤศจิกายน 1916 จักรพรรดิวิลเฮลมที่ 2 แหงเยอรมนีและจักรพรรดิฟรันซ โยเซฟแหงออสเตรียไดลงนามในคําประกาศรวมวาจะกอตั้งราชอาณาจักรใหมขึ้นจากดินแดนโปแลนดที่ยึดครองไดจากรัสเซีย นั่นคือราชอาณาจักรโปแลนด อยางไรก็ตาม รัฐอันเยาววัยนี้ไมสามารถหากษัตริยไดทันเวลา และประธานาธิบดีในขณะนั้นก็ประกาศสถาปนาสาธารณรัฐโปแลนดที่สอง\n\nทวาดูเหมือนวาในที่สุดโปแลนดก็ไดกษัตริยแลวใน [POL.GetLeader]! เชนเดียวกับยาดวิกาในอดีต สมเด็จพระราชินีนาถทรงเลือกใช ‘กษัตริย’ เปนพระอิสริยยศ แมหลายคนจะสงสัยวาพระนางเปนพระธิดาที่แทจริงของซารนิโคลัสที่ 2 หรือไม แตพระนางก็ไดรับการราชาภิเษกที่วอรซอเปนกษัตริยอนาสตาเซีย โรมานอฟแหงโปแลนด"
 nsb_news.5.desc.habsburg: "เมื่อวันที่ 5 พฤศจิกายน 1916 จักรพรรดิวิลเฮลมที่ 2 แหงเยอรมนีและจักรพรรดิฟรันซ โยเซฟแหงออสเตรียไดลงนามในคําประกาศรวมวาจะกอตั้งราชอาณาจักรใหมขึ้นจากดินแดนโปแลนดที่ยึดครองไดจากรัสเซีย นั่นคือราชอาณาจักรโปแลนด อยางไรก็ตาม รัฐอันเยาววัยนี้ไมสามารถหากษัตริยไดทันเวลา และประธานาธิบดีในขณะนั้นก็ประกาศสถาปนาสาธารณรัฐโปแลนดที่สอง\n\nทวาดูเหมือนวาในที่สุดโปแลนดก็ไดกษัตริยแลวใน [POL.GetLeader]! คารล อัลเบรชท ผูประสูติในราชวงศฮาพสบูรค ไดสูรบใหกองทัพโปแลนดมาแทบจะนานเทากับที่รัฐโปแลนดดํารงอยู และวันนี้ ทามกลางเสียงโหรองยินดีของฝูงชน พระองคไดรับเลือกเปนกษัตริยโปแลนดพระองคแรกจากราชวงศฮาพสบูรค"
 nsb_news.5.a: "ทรงพระเจริญ!"
 nsb_news.5.b: "ราชอาณาจักรไดถือกําเนิดแลว"
 nsb_news.5.c: "นี่มันบาอะไรกัน?"
 nsb_news.6.t: "ฝายชาตินิยมยึดอํานาจรัฐบาลโปแลนด"
 nsb_news.6.desc: "เอ็นเดตสยาและฟาลังกามีความสัมพันธยาวนานกับรัฐบาลโปแลนด แตการที่อิกนาตือ มอชชิตสกีรวมมือกับกลุมขวาจัดเหลานี้อยางตอเนื่องไดกลายเปนเหตุแหงความลมสลายของเขาในที่สุด ดวยอิทธิพลที่เติบโตขึ้นในรัฐบาลโปแลนด บัดนี้ [POL.GetLeader] ไดเขาแทนที่มอชชิตสกีในฐานะประธานาธิบดีคนใหมของโปแลนด\n\nยังตองรอดูวารัฐบาลชาตินิยมชุดใหมนี้เชื่อวาจะสามารถเอาใจมหาอํานาจตางชาติที่แยงชิงดินแดนของตนไดหรือไม หรือบางทีพันธมิตรใหมอาจกําลังจะเกิดขึ้นสําหรับโปแลนด"
 nsb_news.6.a: "โปแลนดถือกําเนิดใหม แข็งแกรงยิ่งกวาเดิม"
 nsb_news.6.b: "นากลัวเหลือเกิน"
 nsb_news.7.t: "ราชบัลลังก[POL.GetAdjective]และ[From.GetAdjective]เขาสูการรวมกัน"
 nsb_news.7.desc: "ในเหตุการณที่พลิกผันอยางประหลาด ทั้ง [From.GetNameDef] และ [POL.GetNameDef] ตางตกอยูภายใตการปกครองของ [POL.GetLeader] แมทั้งสองชาติจะยังแยกจากกันในตอนนี้ แตการมีประมุขแหงรัฐรวมกันหมายความวาทั้งสองผูกพันกันทางการทูตอยางแยกไมออก\n\nดูเหมือนวาการรวมกันในองคประมุขนี้จะพัฒนาไปสูการรวมรัฐ[FROM.GetAdjective]และ[POL.GetAdjective]เขาดวยกันในไมชา แตในตอนนี้การรวมกันยังคงเปนเพียงทางการทูตเทานั้น"
 nsb_news.7.a: "อีกไมนานเราจะเปนหนึ่งเดียวกัน"
 nsb_news.7.b: "นาสนใจ"
 nsb_news.8.t: "ราชอาณาจักรลิทัวเนีย"
 nsb_news.8.desc: "เมื่อวันที่ 4 มิถุนายน 1918 วิลเฮลม คารล ฟอน อูราค ไดรับเลือกตั้งอยางเปนประชาธิปไตยเปนกษัตริยแหงลิทัวเนียดวยเสียงสนับสนุนทวมทน แตการแทรกแซงของจักรวรรดิเยอรมันทําใหการลงประชามติถูกประกาศเปนโมฆะ และลิทัวเนียก็ไมเคยไดรวมกับกษัตริยของตน ถึงกระนั้น วันนี้ประธานาธิบดีลิทัวเนียไดยุบตําแหนงของตนเองและประกาศใหพระเจามินเดากัสที่ 3 เปนประมุขแหงรัฐของราชอาณาจักรลิทัวเนียใหม\n\nเมื่ออันตานัส สเมโตนาดํารงตําแหนงนายกรัฐมนตรีลิทัวเนีย ชาตินี้ก็กลายเปนราชาธิปไตยสมบูรณาญาสิทธิ์ และดูเหมือนวากระแสความรักชาติและลัทธิชาตินิยมคลั่งสงครามระลอกใหมของลิทัวเนียกําลังแผไปทั่วประเทศ"
 nsb_news.8.a: "อีกชาติหนึ่งตกอยูใตลัทธิราชาธิปไตย"
 nsb_news.8.b: "เรื่องนี้จะมีความหมายอยางไรตอเรา?"
 nsb_news.8.c: "ราชอาณาจักรกลับมามีชีวิตอีกครั้ง!"
 nsb_news.8.d: "นาสนใจ"
 nsb_news.9.t: "[GetSovietCivilWarName]!"
 nsb_news.9.desc_left: "สงครามกลางเมืองปะทุขึ้นในรัสเซียอีกครั้ง ดวยความทรงจําถึงสงครามกลางเมืองครั้งกอนยังคงสดใหมในใจทุกคน จึงเปนเรื่องนาประหลาดใจอยูบางที่สถานการณมาถึงจุดนี้ หลังการแยงชิงอํานาจทางการเมืองระหวางฝายสตาลินนิสตและฝายทรอตสกีนิสตมาหลายป ในที่สุดรัฐบาลโซเวียตก็แตกออก และทั้งสองกลุมกําลังสูรบกันบนทองถนนเพื่อแยงชิงการควบคุมประเทศ \n\n[SOV.GetLeader] ประกาศให[SOV.GetLeader.GetHerselfHimself]เปนผูนําของสิ่งที่[SOV.GetLeader.GetSheHe]เรียกวา [SOV.GetNameDef] และนําสงครามตอตาน [SOS.Getleader] จากฐานที่มั่นของ[SOV.GetLeader.GetHerHis]ใน [SOV.Capital.GetName]"
 nsb_news.9.desc_right: "การสูรบอยางเปดเผยปะทุขึ้นอีกครั้งในรัสเซียโซเวียต แตคราวนี้ไมใชสงครามระหวางบอลเชวิคกับฝายขาว หากเปนสงครามระหวางกลุมที่เปนปรปกษกันภายในพรรคคอมมิวนิสต [SOS.GetLeader] ยึดเมืองหลวงไวได ขณะที่ฝายกบฏซึ่งนําโดย [SOV.GetLeader] ตั้งฐานอยูรอบ [SOV.Capital.GetName] มีขาวลือแพรสะพัดวาการกบฏของ [SOV.GetLeader] ไดรับการสนับสนุนจากตางชาติ แตขาวลือนั้นจริงหรือไมยังตองรอดูกันตอไป"
 nsb_news.9.desc_exiles: "อยางไมมีใครคาดคิด กองกําลังฝายขาวไดลุกขึ้นตอตานพวกบอลเชวิคอีกครั้ง อุดมการณของพวกเขาอาจดูเหมือนพายแพไปแลว แตในชวงหลายเดือนที่ผานมามีรายงานหลายฉบับถึงการสะสมกําลังทหารในแมนจูเรียและไซบีเรีย และเมื่อเชาวันนี้ไดมีการประกาศจัดตั้งรัฐบาลเฉพาะกาลแหงรัสเซียขึ้นใน [SOV.capital.GetName] \n\nรัฐบาล[SOS.GetAdjective]ระดมกองทัพแดงทันที และรัสเซียก็ถลําเขาสูสงครามกลางเมืองอีกครั้ง มหาอํานาจตะวันตกยังไมแสดงความสนใจที่จะแทรกแซงความขัดแยงนี้ แตยังตองรอดูวาญี่ปุนจะตอบสนองตอสถานการณนี้อยางไร"
 nsb_news.9.a: "สูชัยชนะ!"
 nsb_news.9.b: "ไมนาเลยที่จะมาถึงขั้นนี้"
 nsb_news.9.c: "พวกคอมมิวนิสตกําลังทําลายตัวเอง"
 nsb_news.9.d: "[SOS.GetLeader] จะตองไดชัยชนะแนนอน"
 nsb_news.9.e: "เรื่องนี้จะมีความหมายอยางไรตออุดมการณคอมมิวนิสต?"
 nsb_news.9.f: "บัดนี้เราไดเห็นความรุนแรงที่แฝงอยูในระบบแลว!"
 nsb_news.9.g: "คราวนี้พวกเขาตองสูเองแลว"
 nsb_news.9.h: "พวกเขาเคยพายแพมาแลวครั้งหนึ่ง คราวนี้ตองถูกบดขยี้แน!"
 nsb_news.9.i: "อุดมการณอันสูงสง แตพวกเขาจะชนะไดจริงหรือ?"
 nsb_news.10.t: "จุดจบของ[GetSovietCivilWarName]!"
 nsb_news.10.desc_stalinist: "เมื่อหนวยกบฏหนวยสุดทายยอมจํานน [GetSovietCivilWarName]ก็สิ้นสุดลงอยางเปนทางการ ในสุนทรพจนอันโออาตอประชาชน [SOS.GetLeader] ประกาศวาตนคือผูสรางชัยชนะครั้งนี้ และยกยองความกลาหาญและความภักดีของกองทัพแดง \n\nเมื่อศัตรูภายในถูกทําลายไปอยางสิ้นซากแลว [SOV.Getleader] ก็สามารถหันไปมองที่อื่นได ผลกระทบระยะยาวจากการทําลายลางอุตสาหกรรมอยางกวางขวางและการสูญเสียชีวิตยังตองรอดูกันตอไป"
 nsb_news.10.desc_communist_opposition: "การยอมจํานนของหนวยสุดทายที่ภักดีตอ [SOS.GetLeader] ถือเปนจุดจบของ[GetSovietCivilWarName] [SOV.GetLeader] ประกาศให[SOV.GetLeader.GetHerselfHimself]เปนผูชนะ และใหคํามั่นวาจะทําให [SOV.GetNameDef] ผงาดขึ้นจากเถาถานของสงครามกลางเมืองและการทําลายลาง ภารกิจขางหนานั้นยิ่งใหญ และสถานการณโลกก็ไมแนนอน แต[SOV.GetLeader.GetSheHe]ยืนกรานวายุคใหมของ [SOV.GetNameDef] และของโลกเพิ่งเริ่มตนขึ้น ยังตองรอดูวา[SOV.GetLeader.GetSheHe]จะทําไดตามคําประกาศเหลานั้นหรือไม"
 nsb_news.10.desc_exiles: "สิ่งที่ดูเหมือนเปนภารกิจที่เปนไปไมได นั่นคือการรื้อฟนการตอสูกับพวกบอลเชวิคของขบวนการฝายขาวพลัดถิ่น ไดกลายเปนชัยชนะแมจะมีอุปสรรคมากมาย [SOV.GetLeader] ประกาศวา [SOS.GetNameDef] พายแพแลว และใหคํามั่นวาจะฟนฟูรัสเซียใหกลับสูความรุงเรืองดังเดิม สงครามไดสรางความเสียหายแกรัสเซียอยางมาก และทําใหประเทศตองสูญเสียอยางหนัก\n\nยังไมมีใครทราบวา [SOS.GetLeader] อยูที่ใด มีขาวลือวา[SOS.GetLeader.GetSheHe]หลบหนีออกนอกประเทศไปไมกี่วันกอนการยอมจํานน และ[SOS.GetLeader.GetSheHe]อาจซอนตัวอยูที่ไหนสักแหงในอเมริกาใต"
 nsb_news.10.desc_exiles_puppet: "ดวยความชวยเหลือของญี่ปุน รัฐบาลเฉพาะกาลแหงรัสเซียสามารถเอาชนะ [SOS.GetLeader] และไดรับชัยชนะใน[GetSovietCivilWarName] แตการกลายเปนรัฐในอารักขาของ [JAP.GetNameDef] โดยพื้นฐานนั้นเปนราคาที่สูงลิ่ว และทําใหหลายคนตั้งคําถามวานี่เปนชัยชนะที่แทจริงของอุดมการณฝายขาวหรือไม"
 nsb_news.10.a: "เราไดรับชัยชนะ!"
 nsb_news.10.b: "การโจมตีครั้งรายแรงตอการปฏิวัติคอมมิวนิสต"
 nsb_news.10.c: "นาประหลาดใจจริง ๆ"
 nsb_news.10.d: "รัสเซียของสตาลินพังทลายลงราวกับบานไพ"
 nsb_news.10.e: "การกําจัดสตาลินคงเปนเรื่องดีที่สุดแลว"
 nsb_news.10.f: "คงยากที่จะไวใจผูนําชุดใหมเหลานี้"
 nsb_news.10.g: "บางที [SOV.GetLeader] อาจคุยดวยเหตุผลไดงายกวา"
 nsb_news.11.t: "$SOV_iosif_stalin$ ถูกลอบสังหาร"
 nsb_news.11.desc: "แมจะมีระบบรักษาความปลอดภัยอยางเขมงวดสุดขีดรอบตัว แตผูนําแหง [SOV.GetNameDef] $SOV_iosif_stalin$ ก็ถูกพบเปนศพในวิลลาของเขา คาดวาถูกฆาตกรรม เมืองหลวง[SOV.GetAdjective]เต็มไปดวยขาวลือ และดูเหมือนคณะสามผูนําซึ่งนําโดย $SOV_lavrenty_beriya$ จะเขายึดอํานาจไวอยางนอยเปนการชั่วคราว อยางไรก็ตาม ผูนําคนใหมไมคอยเปนที่นิยมนัก จึงยังตองรอดูวาเขาจะรักษาอํานาจไวไดหรือไมหากตําแหนงถูกคุกคาม มีรายงานวา NKVD กําลังสืบสวนทุกทิศทาง และเบรียาไดสาบานวาจะหาตัวผูรับผิดชอบตอการสังหารครั้งนี้ใหได"
 nsb_news.11.a: "หรือวา NKVD จะมีสวนเกี่ยวของดวย?"
 nsb_news.11.b: "ไมนะ!"
 nsb_news.12.t: "รัฐประหารใน[SOV.GetAdjective]"
 nsb_news.12.desc: "ฝายคาน[SOV.GetAdjective]ไดจับกุมและโคนคณะสามผูนําที่นําโดยเบรียาอยางรวดเร็วดุจสายฟา กองทัพแดงปดลอมเมืองหลวงในชวงรุงสาง ขณะที่หนวยรบพิเศษจับกุม $SOV_lavrenty_beriya$ อยางลับ ๆ และลักลอบนําตัวไปยังที่ปลอดภัยกอนที่ทหารองครักษสวนตัวของเขาจะรูตัว รัฐบาลชุดใหมไดรับการประกาศจัดตั้งโดยมี [SOV.GetLeader] เปนผูนําคนใหมของประเทศ และ $SOV_lavrenty_beriya$ ถูกตั้งขอหากบฏตอ [SOV.GetNameDef]"
 nsb_news.12.a: "ชางเปนยุคที่นาสนใจ"
 nsb_news.12.b: "สถานการณยิ่งแยลงเรื่อย ๆ"

 pavel_events.3.a: "ถามันชวยเลี่ยงสงครามได..."
 pavel_events.3.b: "นี่มันเรื่องตลกหรือไง? ไม!"
 pavel_events.3.desc: "โทรเลขอันนาตกใจมาถึงจาก [From.GetNameDef] เรียกรองใหแยก “ดินแดนเดิมของโปแลนด” ออกไปทันที พื้นที่ที่พวกเขาหมายถึงไดแกพอเมอเรเนีย ปรัสเซีย และไซลีเซีย\n\nรัฐโปแลนดคาดเดาไดยากอยูบางนับตั้งแต [From.GetLeader] ขึ้นครองราชบัลลังก แตแทบไมมีใครคาดคิดวา[From.GetLeader.GetSheHe]จะกลาถึงขั้นเรียกรองดินแดนจาก [Root.GetNameDef]"
 pavel_events.3.t: "[From.GetNameDefCap] เรียกรองเยอรมนีตะวันออก!"
 pavel_events.301.a: "เดี๋ยว จริงเหรอ?"
 pavel_events.301.desc: "ในเหตุการณที่ไมมีใครคาดคิด [From.GetNameDef] ไดยอมตามขอเรียกรองของ [Root.GetLeader] และยกภูมิภาคไซลีเซีย พอเมอเรเนีย และปรัสเซียใหแก [Root.GetNameDef]"
 pavel_events.301.t: "[From.GetNameDefCap] ยอมแพ"
 pavel_events.302.a: "ขอเรียกรองของเราจะไดรับการตอบสนองในสนามรบ"
 pavel_events.302.desc: "ตามที่คาดไว เยอรมนีปฏิเสธขอเรียกรองของ [Root.GetLeader] โดยเชื่อวาเปนเรื่องตลกที่จัดฉากมาอยางแนบเนียน เมื่อการทูตไมอาจโนมนาว [From.GetNameDef] ได [Root.GetLeader] จึงขึ้นมาควบไปยังชายแดน และนําเรื่องนี้เขาสูมือของกองทัพดวยตนเอง"
 pavel_events.302.t: "[From.GetNameCap] ปฏิเสธที่จะยกดินแดน"
 NSB_poland_monarchist_events.6.t: "[From.GetNameDefCap] เรียกรองใหผนวกเรา"
 NSB_poland_monarchist_events.6.desc: "โดยอางถึงความออนแอทางการปองกันที่เห็นไดชัดของ [Root.GetNameDef] เจาหนาที่จาก [From.GetNameDef] ไดเรียกรองให [Root.GetNameDef] ทั้งหมดตกอยูภายใตการยึดครองโดยตรงของโปแลนด เห็นไดชัดวาไดใจจากคําพูดเพอเจอของกษัตริย “อนาสตาเซีย” ของพวกเขา รัฐโปแลนดจึงมีความทะเยอทะยานไมรูจักพอที่จะรวมชาวสลาฟเปนหนึ่ง พวกเขาประกาศอยางชัดแจงวาหากเราไมยอม การรุกรานยอมหลีกเลี่ยงไมได เราควรตอบโตอยางไร?"
 NSB_poland_monarchist_events.6.a: "เราตองยอมจํานน"
 NSB_poland_monarchist_events.6.b: "ไรสาระ! เราปฏิเสธ!"
 NSB_poland_monarchist_events.601.desc: "[From.GetNameDefCap] ยอมรับขอเรียกรองลาสุดของเราใหเขารวมกับ [Root.GetNameDef] ขณะนี้ทหาร[Root.GetAdjective]กําลังหลั่งไหลเขาสูภูมิภาคเพื่อปราบปรามการตอตานในทองถิ่นกอนที่จะกอตัวขึ้น ดวยชัยชนะอันยิ่งใหญนี้ เราเขาใกลความทะเยอทะยานที่จะรวมชาวสลาฟเปนหนึ่งมากขึ้นทุกที"
 NSB_poland_monarchist_events.601.t: "[From.GetNameDefCap] ยอมรับ!"
 NSB_poland_monarchist_events.602.desc: "นาตกตะลึงที่รัฐบาล[From.GetAdjective]ปฏิเสธขอเรียกรองของเราใหสละการควบคุมภูมิภาคบอลขานใหแก [Root.GetNameDef] ความพยายามหาทางออกทางการทูตของเราลมเหลว และบัดนี้เรื่องนี้ไดกลายเปนเรื่องของกองทัพแลว"
 NSB_poland_monarchist_events.601.a: "ไดผลจริง ๆ เหรอ?"
 NSB_poland_monarchist_events.602.t: "[From.GetNameDefCap] ปฏิเสธ!"
 NSB_poland_monarchist_events.602.a: "ถาอยางนั้นก็สงคราม"
 POL_habsburg_events.1.t: "[From.GetNameDefCap] เรียกรองใหราชวงศฮาพสบูรคปกครอง!"
 POL_habsburg_events.1.desc: "เมื่อ [From.GetLeader] ครองราชบัลลังกโปแลนด วันนี้กษัตริยไดยื่นคําขาดให [Root.GetLeader] ลงจากตําแหนงผูปกครองฮังการีเพื่อเปดทางใหอ็อทโท ฟอน ฮาพสบูรค แมการตัดสินใจเชนนี้อาจถูกมองวาเปนการละเมิดสนธิสัญญาทรียานง แตดูเหมือน [From.GetLeader] จะไมยอมรับคําปฏิเสธใด ๆ"
 POL_habsburg_events.1.a: "เราจะมีกษัตริยจากราชวงศฮาพสบูรค"
 POL_habsburg_events.1.b: "เราปฏิเสธ"
 POL_habsburg_events.101.t: "[From.GetNameDefCap] สถาปนากษัตริยฮาพสบูรค"
 POL_habsburg_events.101.desc: "ดูเหมือนคําขาดของเราตอ [From.GetNameDef] จะโนมนาวใหพวกเขาสถาปนาอ็อทโท ฟอน ฮาพสบูรคเปนกษัตริยแหงฮังการีไดสําเร็จ! เมื่อราชวงศฮาพสบูรคครองราชบัลลังกทั้งฮังการีและโปแลนด ยุคใหมแหงการปกครองของราชวงศฮาพสบูรคทั่วยุโรปก็มาถึงแลว"
 POL_habsburg_events.101.a: "โอใช ทุกอยางกําลังลงตัว"
 POL_habsburg_events.102.t: "[From.GetNameDefCap] ปฏิเสธ"
 POL_habsburg_events.102.desc: "รัฐบาลฮังการีดูไมสะทกสะทานตอคําขาดใหสถาปนาอ็อทโท ฟอน ฮาพสบูรคเปนกษัตริยแหงฮังการีเลย แมคําขาดของเราอาจลมเหลว แตบัดนี้เรื่องนี้อยูในมือของกองทัพแลว"
 POL_habsburg_events.102.a: "ถึงเวลาเจรจาแบบดุดันแลว"
 POL_habsburg_events.2.t: "[From.GetNameDefCap] เสนอเปนพันธมิตร"
 POL_habsburg_events.2.desc: "เมื่อชาติของเราทั้งสองตางปกครองโดยราชวงศฮาพสบูรค [From.GetLeader] จึงเสนอให [Root.GetNameDef] และ [From.GetNameDef] รวมมือกันปกปองผลประโยชนของราชวงศฮาพสบูรคทั่วยุโรป"
 POL_habsburg_events.2.a: "แนนอนวาเราจะเขารวม"
 POL_habsburg_events.2.b: "เราไมสนใจ"
 POL_habsburg_events.201.t: "[From.GetLeader] ปฏิเสธกติกาสัญญา"
 POL_habsburg_events.201.desc: "แมจะมีความสัมพันธทางเครือญาติ แตดูเหมือน [From.GetNameDef] จะไมสนใจเปนพันธมิตรกับ [Root.GetNameDef] เลย"
 POL_habsburg_events.201.a: "บางทีเราควรหันไปหาฝายสัมพันธมิตร"

 NSB_soviet_paranoia_system_events.01.t: "[Root.GetLeader] กังวลเรื่องการแบงพรรคแบงพวก"
 NSB_soviet_paranoia_system_events.01.desc: "ในการประชุมคณะกรรมการกลางครั้งลาสุด สหาย [Root.GetLeader] ไดตั้งขอสังเกตถึงการแบงพรรคแบงพวกที่เพิ่มขึ้นภายในพรรค แมสมาชิกคณะกรรมการทุกคนจะรีบใหคํามั่นถึงการสนับสนุนอยางเต็มที่และไมมีเงื่อนไข แตดูเหมือนจะแทบไมชวยคลายความกังวลของเขาเลย ตามที่สหาย [Root.GetLeader] กลาว เราตองระแวดระวังพวกบอนทําลายและพวกกอวินาศกรรมที่วางแผนตอตานรัฐอยูเสมอ ไมวาพวกเขาจะอยูในตําแหนงใดก็ตาม\n\nขาวนี้สรางความประหลาดใจอยูบางแกหลายคนในพรรค ซึ่งเชื่อวาภัยคุกคามจากการแตกพรรคสิ้นสุดลงไปแลวเมื่อทรอตสกีถูกเนรเทศ"
 NSB_soviet_paranoia_system_events.01.a: "ความกังวลของเขามีมูลจริงหรือ?"
 SOV_paranoia_system_intro_tt: "ระบบ£SOV_paranoia_text_icon ความหวาดระแวงเริ่มทํางานแลว"
 SOV_paranoia_system_nkvd_trait_tt: "ที่ปรึกษาทางการเมืองที่มีคุณลักษณะ §Y$head_of_the_nkvd$§! จะเพิ่ม£SOV_paranoia_text_icon ความหวาดระแวงทางการเมืองทุกสัปดาห"
 NSB_soviet_paranoia_system_events.11.t: "ที่ปรึกษาถูกกลาวหาวาเปนกบฏ"
 NSB_soviet_paranoia_system_events.11.desc: "จากเบาะแสของผูไมประสงคออกนาม NKVD ไดจับกุม [?ROOT.SOV_purged_character_for_loc.GetName] ในขอหาจารกรรม กอวินาศกรรม และสมคบคิดตอตานรัฐ แมชายผูนี้จะยังคงยืนยันวาตนบริสุทธิ์ แตผูสืบสวนมั่นใจวาจะสามารถรวบรวมคดีเอาผิดเขาไดภายในไมกี่สัปดาห ไมวาเขาจะยอมสารภาพระหวางการสอบสวน หรือจะรวบรวมหลักฐานไดเพียงพอจากคนรอบตัวที่เต็มใจใหการถึงความผิดของเขา ไมวาอยางไร โทษสําหรับขอหาเหลานี้ยอมเปนประหารชีวิตหรือใชแรงงานหนักตลอดชีวิตอยางแนนอน"
 NSB_soviet_paranoia_system_events.11.a: "เนื้องอกที่อยูใกลหัวใจขนาดนี้ตองถูกตัดทิ้งอยางไมปรานี"
 NSB_soviet_paranoia_system_events.11.b: "เราไมอาจตัดสินลงโทษใครดวยหลักฐานออนเชนนี้!"
 NSB_soviet_paranoia_system_events.12.t: "การสมคบคิดในหมูขาราชการพลเรือน"
 NSB_soviet_paranoia_system_events.12.desc: "NKVD ไดคนพบหลักฐานการสมคบคิดขนาดใหญภายในฝายบริหารพลเรือน ดูเหมือนวาขาราชการบางคนในคณะกรรมการวางแผนแหงรัฐไดใกลชิดกับผูจัดการโรงงานบางคนจนเกินงาม และปรับตัวเลขการผลิตในแผนหาปใหตํ่าลง ตามที่ NKVD ระบุ นี่คือหลักฐานชัดเจนของการกอวินาศกรรมตอตานโซเวียตและการจงใจบั่นทอนระบบโซเวียต \n\n ผูสมคบคิดที่ถูกจับกุมกําลังเปดเผยชื่อสมาชิกคนอื่น ๆ ของขบวนการสมคบคิดอยางรวดเร็วระหวางการสอบสวน"
 NSB_soviet_paranoia_system_events.12.a: "การทุจริตนี้ตองถูกถอนรากถอนโคน"
 NSB_soviet_paranoia_system_events.12.b: "นี่เปนการตอบโตที่เกินกวาเหตุอยางไรสาระ"
 NSB_soviet_paranoia_system_events.13.t: "ความไมภักดีใน NKVD?"
 NSB_soviet_paranoia_system_events.13.desc: "นายทหารชั้นผูนอยกลุมหนึ่งของ NKVD ไดเขาพบ [Root.GetLeader] พรอมหลักฐานวาหัวหนา NKVD คนปจจุบันไดวางแผนเขายึดการควบคุมเมืองหลวง 'ในกรณีที่เกิดความไมสงบครั้งใหญ' พวกเขาเชื่อวานี่เปนเพียงขออาง และแทจริงแลวแผนเหลานี้มุงยึดอํานาจรัฐบาลดวยกําลัง \n\nเมื่อถูกเผชิญหนาดวยหลักฐานนี้ หัวหนา NKVD พยายามอธิบายในตอนแรกวานี่เปนแผนปกติที่มีมาหลายป และเพียงแคไดรับการปรับปรุงเมื่อไมนานมานี้ อยางไรก็ตาม หลังการสืบสวนเพิ่มเติมและการสอบสวนอยางละเอียด เขาไดเปดเผยการมีอยูของเครือขายสายลับตางชาติขนาดใหญภายใน NKVD ซึ่งวางแผนรวมกับหนวยงานตางชาติเพื่อโคนลมรัฐบาล"
 NSB_soviet_paranoia_system_events.13.a: "อาชญากรรมอันเลวรายเหลานี้ตองถูกลงโทษอยางรุนแรง"
 NSB_soviet_paranoia_system_events.13.b: "ขอกลาวหาเหลานี้กุขึ้นอยางเห็นไดชัด"
 NSB_soviet_paranoia_system_events.19.t: "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.19.desc_1: "การสืบสวนคดีฆาตกรรมสหายคีรอฟในป 1934 ไดพบเบาะแสมากมายที่ชี้ไปยังการสมคบคิดระหวางซีโนเวียฟกับทรอตสกี หลังการจับกุมและสอบสวนหลายครั้ง หลักฐานก็ยิ่งหนักแนนขึ้น \n\nหลังการพบกับ [Root.GetLeader] ในที่สุดซีโนเวียฟและคาเมเนฟก็สารภาพวาไดรวมมือกับทรอตสกีเพื่อโคนลมรัฐบาล ลอบสังหารผูนําโซเวียต และฟนฟูระบอบทุนนิยมในสหภาพโซเวียตในทายที่สุด บัดนี้พวกเขาถูกนําตัวขึ้นศาลพรอมผูสมรูรวมคิดอีก 14 คน ขอกลาวหาตอพวกเขาหนักหนายิ่ง หากถูกตัดสินวามีความผิดยอมหมายถึงความตายอยางแนนอน"
 NSB_soviet_paranoia_system_events.19.desc_2: "หลังการพิจารณาคดีพวกทรอตสกีนิสตและผูกอการรายกลุมแรก การสืบสวนของ NKVD ยังคงดําเนินตอไปและพบหลักฐานเพิ่มเติม คารล ราเดคถูกจับกุมและในที่สุดก็ยอมสารภาพระหวางการสอบสวน เขาเปดเผยการมีอยูของเครือขายกวางขวางของผูที่ทํางานรวมกับทรอตสกีทั้งเต็มตัวหรือบางสวนในแทบทุกภาคสวนของรัฐบาล รวมถึงกองทัพ แกนนําถูกจับกุมและสารภาพระหวางการสอบสวนแลว\n\nแกนนําเหลานี้ รวมถึงราเดค กําลังถูกพิจารณาคดี ความผิดของพวกเขานอยกวาขอกลาวหาในการพิจารณาคดีครั้งกอน แตโทษประหารชีวิตก็เปนไปไดอยางแนนอน"
 NSB_soviet_paranoia_system_events.19.desc_3: "การสืบสวนกอนการพิจารณาคดีมอสโกครั้งที่สองยังไดเปดโปงเครือขายขนาดใหญของพวกทรอตสกีนิสตในกองทัพและผูนําระดับสูงของพรรค ซึ่งนําโดยบูฮาริน คนเหลานี้ถูกจับกุมและสอบสวน และไดสารภาพถึงอาชญากรรมที่รายแรงและชั่วชาที่สุด ตั้งแตการวางแผนกอวินาศกรรม การพยายามลอบสังหาร การสมคบคิดกับตางชาติ ไปจนถึงการผสมตะปูลงในเนยเพื่อทํารายหรือสังหารพลเมืองโซเวียตธรรมดา\n\nหากถูกตัดสินวามีความผิด โทษสําหรับอาชญากรรมเหลานี้แทบจะเปนการประหารชีวิตดวยการยิงเปาอยางแนนอน"
 NSB_soviet_paranoia_system_events.19.desc_4: "สายลับ NKVD ไดเปดโปงการสมคบคิดใหมอันนาวิตกที่เกี่ยวของกับสมาชิกพรรคของเราหลายคน ที่นากังวลยิ่งกวาคือหลังการจับกุมหลายครั้งและการสอบสวนอยางถี่ถวน ชื่อของอดีตบอลเชวิคหลายคนก็ปรากฏขึ้น การสืบสวนเพิ่มเติมพบหลักฐานวาผูถูกกลาวหาวาสมคบคิดหลายคนมีสวนในการกอวินาศกรรม การแบงพรรคแบงพวก และพฤติกรรมตอตานโซเวียตจริง ชายเหลานี้ถูกนําตัวขึ้นศาลและกําลังรอคําพิพากษา จากขอกลาวหาที่มีตอพวกเขา การถูกตัดสินวามีความผิดยอมหมายถึงโทษที่รุนแรงมากอยางไมตองสงสัย"
 NSB_soviet_paranoia_system_events.19.a: "คนทรยศอีกกลุมถูกนําตัวมาลงโทษ"
 NSB_soviet_paranoia_system_events.19.b: "ตองไมปลอยใหการปฏิวัติกลืนกินลูกหลานของตัวเอง"
 NSB_soviet_paranoia_system_events.21.t: "นายพล [?ROOT.SOV_purged_character_for_loc.GetName] ถูกกลาวหาวาเปนกบฏ"
 NSB_soviet_paranoia_system_events.21.desc: "ในฐานะสวนหนึ่งของการสืบสวนพวกทรอตสกีนิสตในกองทัพ NKVD ไดพบหลักฐานวานายพล [?ROOT.SOV_purged_character_for_loc.GetName] เคยแสดงความเห็นวิจารณสหาย [Root.GetLeader] หลายครั้งในอดีต และกลาวถึงคุณูปการอันยิ่งใหญที่เลฟ ทรอตสกีมีตอการปฏิวัติในชวงสงครามกลางเมือง ระหวางการสอบสวน [?ROOT.SOV_purged_character_for_loc.GetName] ยืนยันในตอนแรกถึงความชื่นชมและความภักดีตอ [ROOT.GetLeader] แตในที่สุดก็ยอมสารภาพวาเขาถูกสายลับฝายทรอตสกีนิสตติดตอมาใหจัดตั้งหนวยตอตานการปฏิวัติภายในกองทัพ เพื่อกอวินาศกรรมตอกองทัพแดง"
 NSB_soviet_paranoia_system_events.21.a: "ไมมีที่ในกองทัพสําหรับคนเชนนี้"
 NSB_soviet_paranoia_system_events.21.b: "เห็นไดชัดวาการสืบสวนครั้งนี้กระตือรือรนเกินเหตุ"
 NSB_soviet_paranoia_system_events.22.t: "การสมคบคิดในโรงเรียนนายรอย"
 NSB_soviet_paranoia_system_events.22.desc: "ผูแจงเบาะแสนิรนามไดเปดเผยการมีอยูของนักเรียนกลุมหนึ่งในโรงเรียนนายรอยที่ทรงเกียรติที่สุดแหงหนึ่งของเรา ดูเหมือนกลุมนี้ไดตัดสินใจศึกษามากกวาแคหลักสูตรที่ไดรับอนุมัติ และไดถกเถียงแนวคิดของนักทฤษฎีปฏิกิริยาที่เสื่อมเสียชื่อเสียง ยังไมชัดเจนวาพวกเขาไดงานเขียนของคนเหลานี้มาจากที่ใด แตการสืบสวนและการสอบสวนแกนนําอยางละเอียดจะทําใหไดรายชื่อมาอยางรวดเร็วแนนอน"
 NSB_soviet_paranoia_system_events.22.a: "เราตองมั่นใจในความภักดีของผูนําทุกคนในอนาคต"
 NSB_soviet_paranoia_system_events.22.b: "โรงเรียนนายรอยคือที่สําหรับตั้งคําถาม และเราตองไมขัดขวางสิ่งนั้น"
 NSB_soviet_paranoia_system_events.23.t: "การรณรงคตอตานผูกอวินาศกรรม"
 NSB_soviet_paranoia_system_events.23.desc: "รายงานจากการฝกซอมครั้งใหญลาสุดแสดงใหเห็นวายานพาหนะจํานวนมากตองออกจากการฝกเพราะเครื่องยนตขัดของ และทหารใหมไดรับบาดเจ็บ รายงานเหลานี้ไปถึงโตะของสหาย [Root.GetLeader] ซึ่งกังวลอยางยิ่งถึงความเปนไปไดที่จะมีการกอวินาศกรรมโดยสมาชิกของกองทัพ เขาตองการทราบวารถถังใหมเหลานี้เกิดความบกพรองทางกลไกไดอยางไร หลังจากอยูในสนามเพียงไมกี่วันโดยไมไดซอมบํารุง"
 NSB_soviet_paranoia_system_events.23.a: "เราตองเปดการสืบสวนเต็มรูปแบบเพื่อจับตัวผูกระทําผิด!"
 NSB_soviet_paranoia_system_events.23.b: "เรื่องแบบนี้เกิดขึ้นเปนปกติในกองทัพสมัยใหม"
 NSB_soviet_paranoia_system_events.24.t: "[?ROOT.SOV_accuser_character_for_loc.GetName] กลาวหา [?ROOT.SOV_accused_character_for_loc.GetName]"
 NSB_soviet_paranoia_system_events.24.desc: "รายงานฉบับหนึ่งไดสงถึงกองบัญชาการสูงสุดกองทัพบก ในรายงานนั้น [?ROOT.SOV_accuser_character_for_loc.GetName] กลาวหาวานายพล [?ROOT.SOV_accused_character_for_loc.GetName] เพื่อนรวมตําแหนงของเขาละทิ้งหนาที่อยางรายแรงยิ่ง ตามที่ [?ROOT.SOV_accuser_character_for_loc.GetName] ระบุ [?ROOT.SOV_accused_character_for_loc.GetName] ไดสมคบคิดกับกลุมตางชาติและกลุมปฏิกิริยาเพื่อสงขอมูลใหหนวยขาวกรองตางชาติ เขายังชี้ถึงอุบัติเหตุในการฝกจํานวนมากที่เกิดขึ้นภายใตการบังคับบัญชาของ [?ROOT.SOV_accused_character_for_loc.GetName] โดยกลาวหาวาแทจริงแลวเปนการกอวินาศกรรมโดยนายพลจอมหลอกลวงและผูสมรูรวมคิดของเขาในกองทัพ ผูสมรูรวมคิดดังกลาวไดยืนยันขอกลาวหาหลังการสอบสวนอยางหนัก"
 NSB_soviet_paranoia_system_events.24.a: "[?ROOT.SOV_accused_character_for_loc.GetName] ตองรับโทษตามกฎหมาย"
 NSB_soviet_paranoia_system_events.24.b: "นี่เปนแผนตื้น ๆ ของ [?ROOT.SOV_accuser_character_for_loc.GetName] เพื่อเอาตัวรอด"
 NSB_soviet_paranoia_system_events.24.c: "ยุติการสืบสวนโดยไมมีคําตัดสิน"
 NSB_soviet_paranoia_system_events.28.t: "การกวาดลางครั้งใหญนายทหารชั้นผูนอยกองทัพบก"
 NSB_soviet_paranoia_system_events.28.desc: "รายงานหลั่งไหลเขามาเกี่ยวกับเครือขายนายทหารที่กวางขวางซึ่งวิพากษวิจารณการจัดการกิจการทหารของ [Root.GetLeader] อยางรุนแรง ผูที่ถูกจับกุมในขอหายุยงปลุกปน กอวินาศกรรม และมีความคิดตอตานโซเวียต ตางรีบเปดเผยชื่อคนอื่นในเครือขายระหวางการสอบสวน แมจะมีความสงสัยในความภักดีของเหลานายพลมานาน แตเรื่องนี้เผยใหเห็นวาบางทีแมแตพันตรีและพันเอกก็ไวใจไมได"
 NSB_soviet_paranoia_system_events.28.a: "เราไมอาจปลอยใหความเนาเฟะลุกลาม"
 NSB_soviet_paranoia_system_events.28.b: "ขอกลาวหาเหลานี้เปนการขยายเรื่องเล็กใหเปนเรื่องใหญอยางเกินจริง"
 NSB_soviet_paranoia_system_events.29.t: "การกวาดลางครั้งใหญ - การพิจารณาคดีเหลานายพล"
 NSB_soviet_paranoia_system_events.29.desc: "หลักฐานวามีเครือขายทรอตสกีนิสตขนาดใหญในกองทัพบกกําลังเพิ่มขึ้นอยางรวดเร็ว ทุกวัน NKVD จับกุมผูตองสงสัยรายใหมที่ถูกพาดพิงในคําสารภาพกอนหนา และคนเหลานี้ก็มักจะเปดเผยชื่อผูสมรูรวมคิดเพิ่มอีก คงตองใชเวลาในการตามลานายพลทั้งหมดที่เปนสวนหนึ่งของการสมคบคิดนี้ แตชัดเจนวารายชื่อดานลางเปนสวนสําคัญของมัน ซึ่งความผิดไดรับการพิสูจนแลวจากคําสารภาพของพวกเขาเอง"
 NSB_soviet_paranoia_system_events.29.a: "คนทรยศทุกคนตองชดใชดวยราคาสูงสุด"
 NSB_soviet_paranoia_system_events.29.b: "นี่คือการสังหารหมูอยางไรเหตุผล!"
 NSB_soviet_paranoia_system_events.30.t: "การกวาดลางตามปกติในกองทัพเรือ"
 NSB_soviet_paranoia_system_events.31.t: "พลเรือเอก [?ROOT.SOV_purged_character_for_loc.GetName] ถูกกลาวหาวาเปนกบฏ"
 NSB_soviet_paranoia_system_events.31.desc: "นายทหารคนหนึ่งในฝายเสนาธิการของพลเรือเอก [?ROOT.SOV_purged_character_for_loc.GetName] ไดติดตอ NKVD เพื่อรายงานพฤติกรรมนาสงสัยหลายอยาง ตามที่นายทหารผูนี้ระบุ [?ROOT.SOV_purged_character_for_loc.GetName] ไดรับการตอนรับอยางอบอุนยิ่งจากนายทหารเรือตางชาติระหวางการเยือนทาเรือตางประเทศครั้งลาสุด และอาจใชโอกาสนี้สงขอมูลลับใหพวกเขา ยิ่งไปกวานั้น ยังมีหลักฐานวามีหนวยทรอตสกีนิสตในทาเรือหลายแหงที่พลเรือเอกไปเยือน ซึ่งทําใหเขาสามารถสมคบคิดกับทรอตสกีตอตานรัฐไดหากตองการ"
 NSB_soviet_paranoia_system_events.31.a: "ไมมีที่ในกองทัพเรือสําหรับคนเชนนี้"
 NSB_soviet_paranoia_system_events.33.desc: "มีรายงานจากฐานทัพเรือหลายแหง ระบุวาจํานวนอะไหลที่ถูกขอเบิกเพื่อซอมเรือบางลําอยางเรงดวนเพิ่มขึ้นเล็กนอย แมรายงานจะอางวาความเสียหายเหลานี้เกิดจากการสึกหรอตามปกติและการฝกซอม แต NKVD ก็ไมแนใจนัก [Root.GetLeader] ใหความสนใจเรื่องนี้เปนการสวนตัว และตองการใหสืบสวนขอกลาวหาเรื่องการกอวินาศกรรมอยางละเอียด"
 NSB_soviet_paranoia_system_events.38.t: "การกวาดลางครั้งใหญนายทหารชั้นผูนอยกองทัพเรือ"
 NSB_soviet_paranoia_system_events.38.desc: "หลังรายงานจากนายทหารการเมืองเกี่ยวกับความเคลื่อนไหวผิดปกติในกองเรือ NKVD ไดเปดการสืบสวนเต็มรูปแบบและพบหลักฐานของเครือขายนายทหารขนาดใหญที่วิพากษวิจารณ หรือแมแตเปนปรปกษตอระบบโซเวียตอยางรุนแรง แมสวนใหญจะยืนยันความภักดีตอ [Root.GetLeader] และสหภาพโซเวียต แตชัดเจนวาพวกเขาอาจถูกหนวยงานตางชาติชักจูงใหเปนสายลับไดงาย อันที่จริง การสอบสวนเผยวาหลายคนในหมูพวกเขารับจางรัฐทุนนิยมเพื่อสอดแนมเราอยูแลว และพวกเขากําลังเปดเผยชื่อเพิ่มเติมอยางรวดเร็ว"
 NSB_soviet_paranoia_system_events.39.t: "การกวาดลางครั้งใหญ - การพิจารณาคดีเหลาพลเรือเอก"
 NSB_soviet_paranoia_system_events.39.desc: "การสืบสวนศูนยกลางทรอตสกีนิสตภายในกองทัพแสดงใหเห็นชัดวามันฝงรากลึกเปนพิเศษในกองทัพเรือ พลเรือเอกสวนใหญหรือทั้งหมดในกองทัพเรือลวนนาสงสัยอยางยิ่ง เพราะมีโอกาสสมคบคิดกับกลุมตางชาติขณะประจําการในตางประเทศ จนถึงตอนนี้ พลเรือเอกระดับสูงทุกคนที่ NKVD จับกุมตางสารภาพถึงอาชญากรรมรายแรงยิ่ง รวมถึงการจารกรรมและการกอวินาศกรรม หลังการสอบสวนเพียงไมกี่วัน เมื่อนายทหารเรือถูกพาดพิงในการสมคบคิดนี้มากขึ้นเรื่อย ๆ ชัดเจนวาการถอนรากถอนโคนตองอาศัยการสืบสวนอยางละเอียดถี่ถวน"
 NSB_soviet_paranoia_system_events.42.desc: "การตรวจสอบกองทัพอากาศเมื่อเร็ว ๆ นี้ไดเผยใหเห็นอุบัติเหตุและเครื่องบินตกหลายครั้งอยางนาตกใจระหวางการฝก นอกจากนี้ เครื่องบินที่ทันสมัยที่สุดของเราจํานวนมากยังไมพรอมปฏิบัติภารกิจเต็มที่และกําลังรอการซอมบํารุง ยังไมชัดเจนวาสถานการณเชนนี้เกิดขึ้นไดอยางไร แต [Root.GetLeader] ซึ่งกังวลเรื่องการกอวินาศกรรมไดสั่งใหสืบสวนเต็มรูปแบบ"
 NSB_soviet_paranoia_system_events.48.t: "ยุบสํานักออกแบบ"
 NSB_soviet_paranoia_system_events.48.desc: "NKVD ไดพบหลักฐานวาคณะผูนําในสํานักออกแบบแหงหนึ่งของเราไดสงขอมูลใหหนวยงานตางชาติ ยิ่งไปกวานั้น งานออกแบบลาสุดของพวกเขาเต็มไปดวยขอบกพรองจนตนแบบตองแกไขและปรับปรุงซํ้าหลายรอบกวาจะบินได ซึ่งนําไปสูการคาดเดาวานี่เปนการกอวินาศกรรม ขณะนี้ NKVD กําลังสอบสวนนักออกแบบและวิศวกร และหัวหนาผูสืบสวนมั่นใจวาจะไดคําสารภาพภายในไมกี่วัน"
 NSB_soviet_paranoia_system_events.48.a: "เราไมอาจปลอยใหกลุมบอนทําลายรวมตัวกันในลักษณะนี้"
 NSB_soviet_paranoia_system_events.48.b: "งานของพวกเขาสําคัญเกินไป"
 NSB_soviet_paranoia_system_events.49.t: "นายพลกองทัพอากาศถูกพาดพิง"
 NSB_soviet_paranoia_system_events.49.desc: "การตรวจสอบกองทัพอากาศที่เขมงวดขึ้นไดผลแลว ผูสืบสวนของ NKVD สามารถไดคําสารภาพจากนายทหารชั้นผูนอยจํานวนหนึ่ง ซึ่งชี้ไปยังนายพลระดับสูงที่สั่งใหทําการบินฝกซํ้า ๆ ในสภาพอากาศเลวราย จนนําไปสูเครื่องบินตกตามที่คาดได และการซอมบํารุงที่เพิ่มขึ้นซึ่งลดความพรอมโดยรวมของกองทัพอากาศ ยังไมชัดเจนวาทําไมพวกเขาจึงทําเชนนั้น แตผูสืบสวนของ NKVD เชื่อวาจะไดคําตอบภายในไมกี่วัน"
 NSB_soviet_paranoia_system_events.49.a: "พวกเขาตองรับผิดชอบ"
 NSB_soviet_paranoia_system_events.49.b: "พวกเขาแคทําหนาที่ของตน"

 NSB_soviet_paranoia_system_events.24_paranoia_accused_increase_tt: "£SOV_paranoia_text_icon ความหวาดระแวงทางการเมืองเพิ่มขึ้นตามระดับของผูนําหนวยที่ถูกกวาดลาง: §R[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_accused_decrease_tt: "£SOV_paranoia_text_icon ความหวาดระแวงทางการเมืองลดลงตามระดับของผูนําหนวยที่ถูกกวาดลาง: §G[?SOV.SOV_accused_unit_leader_level]§!"
