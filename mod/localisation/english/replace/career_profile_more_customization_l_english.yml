 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: ""..ตองไมทิ้งหัวรถจักรแมแตคันเดียว ตูรถไฟแมแตตูเดียว ธัญพืชแมแตปอนดเดียว หรือเชื้อเพลิงแมแตแกลลอนเดียวไวใหศัตรู"\n\n- โจเซฟ สตาลิน, คําปราศรัยทางวิทยุ, 3 กรกฎาคม 1941"
