 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "วงดุริยางคแหงเสียงระเบิด"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "สงกองพลที่มีกองพัน "ตอตานอากาศยาน" "ปนใหญ" "ปนใหญจรวด" และ "ตอตานรถถัง" อยางละอยางนอยหนึ่งกองพัน พรอมการสนับสนุนจากกองรอยสื่อสาร เขาประจําการ"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n"เสียงที่ดังกระหึ่มขึ้นเรื่อย ๆ อยางแทจริง ตอเนื่องจนผสานกลมกลืนเปนเสียงคํารามแหงการทําลายลางเพียงเสียงเดียว ดั่งเสียงคํารามของรถไฟในอุโมงคที่ขยายดังขึ้นลานเทา"\n\n- อารโนลด ดี. ฮารวีย"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "ภารกิจลมเหลวอยางสําเร็จ"
