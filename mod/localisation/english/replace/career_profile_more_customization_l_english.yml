 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: ""การจูโจมครั้งนี้ตองถือเปนการลาดตระเวนดวยกําลัง... เราจําเปนตองไดขอมูลทั้งหมดที่จําเปนกอนจะเปดปฏิบัติการในขนาดที่ใหญกวานี้มาก..."\n\n- วินสตัน เชอรชิลล กลาวถึงการจูโจมเดียปป 8 กันยายน 1942"
 CAREER_PROFILE_PUNCH_IT: "ลุยเลย!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "จูโจมศูนยนิวเคลียรไดสําเร็จ ขณะควบคุมรัฐที่อยูติดกับศูนยนั้นอยางนอยหนึ่งรัฐ"
