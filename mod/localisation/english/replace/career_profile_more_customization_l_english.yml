 CAREER_PROFILE_PLAN_L: "แผน L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "เริ่มตนเปนประเทศไมมีทางออกทะเล แลวทําโครงการพิเศษทางเรือใหสําเร็จ 2 โครงการ สรางเรือพิฆาต 10 ลํา เรือลาดตระเวน 5 ลํา เรือประจัญบาน 2 ลํา และเรือบรรทุกเครื่องบิน 1 ลํา"
