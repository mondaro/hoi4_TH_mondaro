 banned_communism_flag: "ไดสั่งหามพรรคคอมมิวนิสตแลว"
 FRA_civil_unrest_category: "ความไมสงบในหมูพลเรือน"
 FRA_communist_civil_war_decision: "การลุกฮือของคอมมิวนิสตใกลจะเกิดขึ้น"
 FRA_communist_civil_war_decision_desc: "กระแสการเมืองหัวรุนแรงที่โหมกระพือขึ้นเรื่อย ๆ ยากจะปลอบประโลมไดอีกตอไป ไมชาก็เร็วเราตองเผชิญหนากับมันไมทางใดก็ทางหนึ่ง"
 FRA_fascist_civil_war_decision: "การลุกฮือของฟาสซิสตใกลจะเกิดขึ้น"
 FRA_fascist_civil_war_decision_desc: "กระแสประชานิยมที่พุงสูงขึ้นกําลังกลายเปนคลื่นที่ไมอาจหยุดยั้ง สิ่งที่หลีกเลี่ยงไมไดกําลังจะมาถึง"
 ETH_defeat_italy: "ปราบเหลานักลาอาณานิคม"
 ETH_defeat_italy_category: "สงครามอิตาลี-เอธิโอเปยครั้งที่สอง"
 ETH_defeat_italy_category_desc: "อิตาลีหมายจะกดขี่เอธิโอเปยใหเปนเพียงอาณานิคมอีกครั้ง เราเคยเอาชนะผูรุกรานเหลานี้มาแลวในครั้งกอน และเราจะเอาชนะพวกมันไดอีก ขอเพียงขับไลพวกมันออกจากชายแดนของเราไดอยางถาวร!"
 seize_some_trains_woo: "เกณฑรถไฟพลเรือน"
 seize_some_trains_woo_desc: "บริษัทรถไฟพาณิชยมีอิทธิพลเหนือโครงสรางพื้นฐานของเรา เมื่อสงครามใกลเขามา เรามีสิทธิ์โดยชอบที่จะเกณฑอุปกรณมาใชเพื่อรัฐ"
 random_general_monarchy_tt: "นายพล[FROM.GetAdjective]คนหนึ่งที่สุมเลือกจะมีความฝกใฝฝายนิยมกษัตริยอยางลับ ๆ"
 removed_when_cancelled_war_prop: "การรณรงคโฆษณาชวนเชื่อไดยุติลงแลว"
 war_propaganda_casualties: "ปลุกเราความกลาหาญ"
 war_propaganda_casualties_desc: "แมยอดผูเสียชีวิตจะเพิ่มขึ้น แตประชาชนของเราตองไดรับการสั่งสอนวาวีรบุรุษถูกหลอหลอมขึ้นไดในสนามรบเทานั้น"
 war_propaganda_convoys: "สงเสริมความประหยัด"
 war_propaganda_convoys_desc: "แมแตพลเรือนก็ชวยใหชนะสงครามได ดวยการใสใจและระมัดระวังการใชวัสดุ เหล็กกลาทุกกรัมจะมีคาตอความพยายามในสงครามเปนสองเทา"
 war_propaganda_bombing: "เสริมสรางขวัญกําลังใจ"
 war_propaganda_bombing_desc: "แมระเบิดจะตกลงรอบตัวเรา แตคนงานผูกลาหาญของเรายังคงทํางานตอไป ดวยจิตวิญญาณเชนนี้เองที่เราจะไดรับชัยชนะ"
 war_support_during_war: "การสนับสนุนสงคราม"
 CHI_occupation_actions: "มาตรการตอตานการยึดครอง"
 CHI_breach_the_yellow_river: "ทําลายเขื่อนกั้นแมนํ้าเหลือง"
 CHI_breach_the_yellow_river_desc: "แมนํ้าเหลืองเปนเสนเลือดใหญของภูมิภาคโดยรอบ แตก็ขวางเสนทางการรุกรานที่กําลังใกลเขามา ในฐานะทางเลือกสุดทายเพื่อชะลอกองกําลังผูรุกราน จึงมีขอเสนอใหระเบิดระบบคันกั้นนํ้าและเขื่อนอันซับซอนเหลานี้\n\nประสิทธิผลของการกระทํานี้ยากจะประเมิน แตผลที่ตามมาจะรุนแรงอยางยิ่ง"
 yellow_river_blown: "นํ้าทวมรุนแรง"
 yellow_river_blown_desc: "ภูมิภาคนี้ถูกนํ้าทวมหนักเนื่องจากการกอวินาศกรรมระบบปองกันนํ้าทวมของแมนํ้าเหลือง"

