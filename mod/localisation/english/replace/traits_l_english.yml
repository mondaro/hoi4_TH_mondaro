 mine_sweeper: "ผูกวาดทุนระเบิด" #obsolete, refer to mine_craft
 mine_sweeper_desc: "§Lเรือลําไหนก็เปนเรือกวาดทุนระเบิดไดหนึ่งครั้ง การทําใหมันกวาดทุนระเบิดไดหลายลูกตางหากที่ตองใชฝมือ§!" #obsolete, refer to mine_craft
