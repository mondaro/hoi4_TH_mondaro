 lancer: "ทหารหอก"
 lancer_desc: "§Lนายทหารผูนี้รูจักตอรปโดดีกวาใคร และสามารถใชมันไดอยางเต็มประสิทธิภาพ§!"
 destroyer_leader: "ผูนําเรือพิฆาต"
 destroyer_leader_desc: "§Lดวยความสมดุลระหวางความกลาหาญและความรอบคอบ นายทหารผูนี้จึงเปนผูบัญชาการในอุดมคติสําหรับกองกําลังเบา§!"
 lone_wolf: "หมาปาเดียวดาย"
