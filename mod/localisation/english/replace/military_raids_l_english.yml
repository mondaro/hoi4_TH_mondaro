 raid_type_JAP_pearl_harbor_strike_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีกองบัญชาการทางเรือหลักและกองเรือของขาศึกในมหาสมุทรแปซิฟก จะชวยเพิ่มขวัญกําลังใจของประชาชนเรา พรอมกับบั่นทอนขวัญกําลังใจและขีดความสามารถทางเรือของศัตรูไปในเวลาเดียวกัน ดวยวิธีนี้ กองทัพเรือของเราจะสามารถเคลื่อนไหวไดอยางเสรีเปนเวลา 6 เดือน!"
