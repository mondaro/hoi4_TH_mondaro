 raid_type_facility_strike: "การโจมตีสถานที่ทดลอง"
 raid_type_facility_strike_desc: "การโจมตีทางอากาศตอสถานที่ทดลองของขาศึก โดยมีเปาหมายเพื่อสรางความเสียหายรายแรงตอสถานที่และโครงการใด ๆ ที่อยูในนั้น"
 
 raid_type_lock_bombing_raid: "การจูโจมทิ้งระเบิดประตูนํ้า"
 raid_type_lock_bombing_raid_desc: "เครื่องบินที่ติดตั้งระเบิดกระดอนแบบพิเศษพยายามทําลายประตูนํ้า เพื่อปองกันการผานคลอง"
 raid_type_lock_bombing_raid_no_bba: "$raid_type_lock_bombing_raid$"
 raid_type_lock_bombing_raid_no_bba_desc: "$raid_type_lock_bombing_raid_desc$"
 
 raid_type_dam_bombing_raid: "การจูโจมทิ้งระเบิดเขื่อน"
 raid_type_dam_bombing_raid_desc: "เครื่องบินที่ติดตั้งระเบิดกระดอนแบบพิเศษพยายามทําลายเขื่อน ลดประสิทธิภาพของเขื่อน และทําใหขาศึกเคลื่อนที่ในพื้นที่ไดยากขึ้น"
 raid_type_dam_bombing_raid_no_bba: "$raid_type_dam_bombing_raid$"
 raid_type_dam_bombing_raid_no_bba_desc: "$raid_type_dam_bombing_raid_desc$"
 
 raid_type_gun_emplacement_raid: "การโจมตีที่ตั้งปน"
 raid_type_gun_emplacement_raid_desc: "ฝูงเครื่องบินทิ้งระเบิดที่ติดตั้งระเบิดเขยาแผนดินพยายามทําลายที่ตั้งของ$mega_gun_emplacement$"
 raid_type_gun_emplacement_raid_no_bba: "$raid_type_gun_emplacement_raid$"
 raid_type_gun_emplacement_raid_no_bba_desc: "$raid_type_gun_emplacement_raid_desc$"

 raid_type_mega_gun_emplacement_strike: "การโจมตีที่ตั้งปนยักษ"
 raid_type_mega_gun_emplacement_strike_desc: "การโจมตีที่ตั้งปนยักษดวยระเบิดเขยาแผนดิน"
 raid_type_mega_gun_emplacement_strike_no_bba: "$raid_type_mega_gun_emplacement_strike$"
 raid_type_mega_gun_emplacement_strike_no_bba_desc: "$raid_type_mega_gun_emplacement_strike_desc$"

 raid_type_oilfield_raid: "การจูโจมแหลงนํ้ามัน"
 raid_type_oilfield_raid_desc: "การโจมตีทางอากาศที่มุงทําลายแหลงนํ้ามันสําคัญและโรงกลั่นที่เชื่อมตออยู เพื่อขัดขวางการผลิตเชื้อเพลิงของขาศึกอยางรายแรงเปนระยะเวลานาน"
 raid_type_nuclear_strike: "การโจมตีดวยนิวเคลียร"
 raid_type_nuclear_strike_desc: "เครื่องบินทิ้งระเบิดทางยุทธศาสตรและเครื่องบินคุมกันจะบินไปยังเปาหมายที่กําหนดและทิ้งระเบิดปรมาณู จากนั้นเครื่องบินทิ้งระเบิดจะพยายามหนีออกจากพื้นที่เพื่อหลีกเลี่ยงคลื่นระเบิด"
 raid_type_nuclear_missile_strike: "การโจมตีดวยขีปนาวุธนิวเคลียร"
 raid_type_nuclear_missile_strike_desc: "ขีปนาวุธพิสัยไกลจะเดินทางตามวิถีขีปนาวุธใตวงโคจรจากฐานยิงที่กําหนดไปยังเปาหมาย เมื่อถึงจังหวะที่เหมาะสม หัวรบจะจุดระเบิดปรมาณู"
 raid_type_nuclear_missile_strike_submarine: "$raid_type_nuclear_missile_strike$จากเรือดํานํ้า"
 raid_type_nuclear_missile_strike_submarine_desc: "$raid_type_nuclear_missile_strike_desc$"
 raid_type_paratrooper_facility_sabotage: "การจูโจมกอวินาศกรรมสถานที่"
 raid_type_paratrooper_facility_sabotage_desc: "ทีมพลรมโดดลงที่สถานที่ของขาศึกและพยายามทําลายอุปกรณสําคัญดวยระเบิดที่ติดตั้ง เพื่อขัดขวางความกาวหนาทางวิทยาศาสตรของขาศึก"
 raid_type_mine_sabotage_raid: "การจูโจมกอวินาศกรรมเหมือง"
 raid_type_mine_sabotage_raid_desc: "ทีมพลรมโดดลงที่กลุมเหมืองสําคัญของขาศึกและพยายามจุดระเบิดที่จะขัดขวางการผลิตเปนเวลานาน"
 raid_type_pathfinder_raid: "การจูโจมของหนวยนําทาง"
 raid_type_pathfinder_raid_desc: "ทีมพลรมโดดลงหลังแนวขาศึกเพื่อเตรียมการบุกที่กําลังจะมาถึง โดยทําลายสะพานสําคัญ ตั้งจุดซุมโจมตี และสรางความวุนวายเบี่ยงเบนความสนใจโดยทั่วไป"
 raid_type_commando_port_raid: "การจูโจมทาเรือของนาวิกโยธิน"
 raid_type_commando_port_raid_desc: "นาวิกโยธินกลุมหนึ่งถูกสงไปสรางความเสียหายแก$naval_base$ขนาดใหญที่ขาศึกควบคุม เรือที่จอดอยูในทาก็อาจไดรับความเสียหายดวย"
 raid_type_commando_facility_raid: "การจูโจมสถานที่ของนาวิกโยธิน"
 raid_type_commando_facility_raid_desc: "นาวิกโยธินกลุมหนึ่งถูกสงไปสรางความเสียหายแกสถานที่ทดลองในจังหวัดชายฝง"
 raid_type_airfield_raid: "การจูโจมสนามบิน"
 raid_type_supply_hub_raid: "การจูโจมศูนยเสบียง"
 raid_type_rescue_captured_general: "ชวยเหลือผูบัญชาการที่ถูกจับ"
 raid_type_rescue_captured_general_desc: "ทีมทหารแทรกซึมหลังแนวขาศึกเพื่อคนหาและชวยเหลือผูบัญชาการที่ถูกขาศึกจับกุมไว"
 raid_type_rescue_captured_general_captive_line: "§Y$NAME$§! ถูกจับกุมตัวไวที่นี่"
 raid_type_demo_dam_raid: "การจูโจมทําลายเขื่อน (สาธิต)"
 raid_type_AUS_reichstag_bombing: "การจูโจมทิ้งระเบิดไรชสทาค"
 raid_type_AUS_reichstag_bombing_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีกองบัญชาการหลักของขาศึกและสัญลักษณแหงอํานาจของเยอรมนี จะชวยเพิ่มขวัญกําลังใจของประชาชนเรา พรอมกับสรางความเสียหายแกศัตรูไปในเวลาเดียวกัน"
 raid_type_ENG_reichstag_bombing: "การจูโจมทิ้งระเบิดไรชสทาค"
 raid_type_ENG_reichstag_bombing_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีกองบัญชาการหลักของขาศึกและสัญลักษณแหงอํานาจของเยอรมนี จะชวยเพิ่มขวัญกําลังใจของประชาชนเรา พรอมกับบั่นทอนขวัญกําลังใจของศัตรูไปในเวลาเดียวกัน"
 raid_type_GER_eben_emael_raid: "การจูโจมเอเบิน-เอมาเอล"
 raid_type_GER_eben_emael_raid_desc: "หนวยจูโจมพลรมและทหารเครื่องรอนจะโจมตีปอมปราการที่ตั้งอยูในจุดยุทธศาสตรจากทางอากาศ พรอมทั้งยึดสะพาน ถนน และทางรถไฟสําคัญในพื้นที่ เพื่อเปดทางใหกําลังโจมตีหลัก"
 raid_type_GER_big_ben_bombing: "การจูโจมทิ้งระเบิดบิกเบน"
 raid_type_GER_statue_of_liberty_bombing: "การจูโจมทิ้งระเบิดเทพีเสรีภาพ"
 raid_type_GER_kremlin_bombing: "การจูโจมทิ้งระเบิดเครมลิน"
 raid_type_ENG_operation_jericho: "ปฏิบัติการเจริโค"
 raid_type_ENG_operation_jericho_desc: "จากขอมูลของขบวนการตอตานฝรั่งเศส เยอรมนีคุมขังนักสูฝายตอตานจํานวนมากไวที่อาเมียง หากสงฝูงบินไประเบิดกําแพงเรือนจําใหเปนชอง เรานาจะสามารถปลดปลอยนักสูฝายตอตานเหลานั้นไดเปนจํานวนมาก"
 raid_type_thermonuclear_strike: "การโจมตีดวยเทอรโมนิวเคลียร"
 raid_type_thermonuclear_strike_desc: "เครื่องบินทิ้งระเบิดทางยุทธศาสตรและเครื่องบินคุมกันจะบินไปยังเปาหมายที่กําหนดและทิ้งระเบิดเทอรโมนิวเคลียร จากนั้นเครื่องบินทิ้งระเบิดจะพยายามหนีออกจากพื้นที่เพื่อหลีกเลี่ยงคลื่นระเบิด"
 raid_type_thermonuclear_missile_strike: "การโจมตีดวยขีปนาวุธเทอรโมนิวเคลียร"
 raid_type_thermonuclear_missile_strike_desc: "ขีปนาวุธพิสัยไกลจะเดินทางตามวิถีขีปนาวุธใตวงโคจรจากฐานยิงที่กําหนดไปยังเปาหมาย เมื่อถึงจังหวะที่เหมาะสม หัวรบจะจุดระเบิดเทอรโมนิวเคลียร"
 raid_type_thermonuclear_missile_strike_submarine: "$raid_type_thermonuclear_missile_strike$จากเรือดํานํ้า"
 raid_type_thermonuclear_missile_strike_submarine_desc: "$raid_type_thermonuclear_missile_strike_desc$"
 raid_type_CHI_huansheng_raid: "ปฏิบัติการหวนเซิง"
 raid_type_CHI_huansheng_raid_desc: "หนวยขาวกรองของเรารายงานวา แมโรงถลุงเหล็กยาวาตะและคลังสรรพาวุธทางเรือซาเซโบจะเปนเปาหมายที่มีคา แตก็ยากเกินกวาที่กองทัพอากาศของเราจะโจมตีไดอยางเหมาะสมในขณะนี้ จึงมีการตัดสินใจวาวิธีที่ไดผลที่สุดในการยุติสงครามนี้คือการปลุกจิตสํานึกของประชาชนญี่ปุนใหตอตานความโหดรายที่พวกจักรวรรดินิยมญี่ปุนผูกระหายสงครามกอขึ้นในจีน โดยการโปรยใบปลิวเหนือเมืองตาง ๆ เชน นางาซากิ ฟูกูโอกะ ซางะ และโอซากะ"
 raid_type_CHI_tokyo_imperial_palace_bombing: "การทิ้งระเบิดพระราชวังหลวงโตเกียว"
 raid_type_CHI_tokyo_imperial_palace_bombing_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีกองบัญชาการหลักของขาศึกและสัญลักษณแหงอํานาจจักรพรรดิของญี่ปุน จะชวยเพิ่มขวัญกําลังใจของประชาชนเรา พรอมกับบั่นทอนขวัญกําลังใจของศัตรูไปในเวลาเดียวกัน"
 raid_type_CHI_national_diet_bombing: "การทิ้งระเบิดรัฐสภาแหงชาติ"
 raid_type_CHI_national_diet_bombing_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีกองบัญชาการหลักของขาศึกและสัญลักษณแหงอํานาจของญี่ปุน จะชวยเพิ่มขวัญกําลังใจของประชาชนเรา พรอมกับบั่นทอนขวัญกําลังใจของศัตรูไปในเวลาเดียวกัน"
 raid_type_CHI_hakko_ichiu_bombing: "การทิ้งระเบิดฮักโกะ อิจิอุ"
 raid_type_CHI_hakko_ichiu_bombing_desc: "การสงเครื่องบินทิ้งระเบิดกลุมหนึ่งไปโจมตีสัญลักษณแหงลัทธิจักรวรรดินิยมของขาศึก จะแสดงใหเห็นถึงความออนแอของญี่ปุน พรอมกับเพิ่มขวัญกําลังใจของประชาชนเราเอง"
 raid_type_CHI_great_wall_raid_land: "การจูโจมแทรกซึมกําแพงเมืองจีน"
 raid_type_CHI_great_wall_raid_land_desc: "กําแพงนี้ไมไดมีคุณคาทางการปองกันเหมือนในอดีตแลว แตก็ยังใหความไดเปรียบแกขาศึกที่ขุดสนามเพลาะตั้งมั่นอยูได การสงทหารกลุมเล็ก ๆ เขาไปจะทําใหเราแทรกซึมแนวขาศึกและจุดระเบิดที่วางไวอยางดีเพื่อลบลางความไดเปรียบนั้นได"


