 tooltip_raid_category_air_raids: "§Hการจูโจมทิ้งระเบิดทางอากาศ§! \nการโจมตีทางอากาศโดยกองบินเดียวที่มุงโจมตีเปาหมายเฉพาะ"
 tooltip_raid_category_nuclear_raids: "§Hการจูโจมดวยนิวเคลียร§! \nการโจมตีที่ดําเนินการโดยเครื่องบินทิ้งระเบิดทางยุทธศาสตรหรือขีปนาวุธนําวิถีที่บรรทุกอาวุธนิวเคลียร"
 tooltip_raid_category_paratrooper_raids: "§Hการจูโจมของพลรม§! \nการจูโจมขนาดเล็กโดยหนวยรบพิเศษที่โดดรมลงหลังแนวขาศึก เพื่อปฏิบัติภารกิจกอวินาศกรรมที่อันตราย"
 tooltip_raid_category_naval_commando_raids: "§Hการจูโจมของคอมมานโดนาวิกโยธิน§! \nการจูโจมขนาดเล็กโดยนาวิกโยธินในพื้นที่ชายฝง โดยใชเรือเร็วขนาดเล็กและอุปกรณที่คลายกันเพื่อโจมตีอยางรวดเร็วแลวหายตัวไปกอนที่ขาศึกจะทันตอบโต"
 tooltip_raid_category_land_infiltration_raids: "§Hการจูโจมทางบก§! \nการจูโจมขนาดเล็กโดยกองกําลังภาคพื้นดินหลังแนวขาศึก โดยใชการพรางตัวและกลอุบายเพื่อดําเนินยุทธวิธีตีแลวถอยอยางรวดเร็ว"
 tooltip_launch_all_button_first: "§Gคลิก§! เพื่อเริ่มการจูโจมทั้งหมดที่พรอมแลว"
 tooltip_launch_all_button_second: "การจูโจม $NUM|H$ ครั้งพรอมเริ่มปฏิบัติการ"
 tooltip_launch_button_enabled: "§Gคลิก§! เพื่อเริ่มการจูโจม"
