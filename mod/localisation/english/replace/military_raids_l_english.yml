 raid_type_INS_militia_increase_activity_raid: "พยายามแทรกซึมแบบกองโจร"
 raid_type_INS_militia_increase_activity_raid_desc: "เราจะสงกองกําลังอาสาสมัครไปยังรัฐนั้น ซึ่งพวกเขาจะติดตอกับนักปฏิวัติในทองถิ่นและจัดตั้งหนวยกองโจร หากปฏิบัติการเปนไปอยางราบรื่น เราจะพยายามแทรกซึมภูมิภาคและยึดอํานาจการควบคุมจากชาวดัตช\n\n§Wรัฐเปาหมายตองอยูในระยะของ§Yบังเกอร§!, §Yทางรถไฟ§! หรือ§Yฐานทัพเรือ§!ที่ฝายสาธารณรัฐเปนเจาของ อาคารเหลานี้สามารถใชเปนจุดเริ่มตนได§!\n\n§Yผล:§!\n§Rกองพลที่ไดรับมอบหมายจะถูกใชหมดไป§!\n§Yสําเร็จ:§!\n       §Wไดเปนเจาของและผูควบคุมรัฐ\n       เพิ่มระดับความรุนแรงของสถานการณ §R1§!§!\n§Yสําเร็จบางสวน:§!\n       §W เพิ่มกิจกรรมกองกําลังอาสาสมัคร§Yหนึ่งขั้น§! ชวยเพิ่มโอกาสสําเร็จในความพยายามครั้งตอไป§!\n§Yลมเหลว:§!\n       §Wไมมีผล§!"
 #Naval
 raid_type_INS_militia_port_raid: "ยึดครองฐานทัพเรือ"
 raid_type_INS_militia_port_raid_desc: "เราจะสงกองกําลังอาสาสมัครปลอมตัวเปนชาวประมงบนเรือเล็กที่หวังวาจะไมถูกตรวจพบ พวกเขาจะพยายามจัดตั้งหนวยกองโจรเมื่อขึ้นฝง และจะรวมมือกับกองโจรในทองถิ่นเพื่อยึดฐานทัพเรือหากมีโอกาส นี่เปนภารกิจที่เสี่ยงมาก หากกองกําลังอาสาสมัครถูกพบเห็น ปฏิบัติการจะลมเหลวอยางแนนอน\n\n§Yผล:§!\n§Rกองพลที่ไดรับมอบหมายจะถูกใชหมดไป§!\n§Yสําเร็จ:§!\n       §Wไดเปนเจาของและผูควบคุมรัฐ\n       เพิ่มระดับความรุนแรงของสถานการณ §R1§!§!\n§Yสําเร็จบางสวน:§!\n       §W เพิ่มกิจกรรมกองกําลังอาสาสมัคร§Yหนึ่งขั้น§! ชวยเพิ่มโอกาสสําเร็จในความพยายามครั้งตอไป§!\n§Yลมเหลว:§!\n       §Wไมมีผล§!"

 SIA_pacific_island_raid: "จูโจมเกาะในแปซิฟก"
 SIA_pacific_island_raid_desc: "เราจะจูโจมเกาะในแปซิฟกและพยายามสรางความเสียหายอยางหนักแกอาคารทางเรือ เรือ และกองทัพของขาศึกบนเกาะนั้น"
