l_english:
 MEX_callistas: "กาเยิสตัส"
 MEX_callistas_desc: "ผูสนับสนุนกาเยสกําลังกอบโกยผลประโยชนใหตนเองและใชอํานาจในทางมิชอบ พวกเขาไดรับแตงตั้งเพราะความภักดีมากกวาความสามารถ และสืบทอดระบบอุปถัมภที่กัดกรอนทุกตําแหนงและทุกยศในประเทศ หากไมควบคุมพวกเขา ชาวเม็กซิกันทั่วไปก็จะยังคงเยยหยันรัฐบาลของเราวาเปน 'robolucionarios' หรือนักปฏิวัติปลนชาติตอไป"
 MEX_church_power_5: "รัฐคาทอลิก"
 MEX_church_power_5_desc: "รัฐธรรมนูญป 1917 อันนาชิงชังถูกยกเลิกแลว หลังจากการยํ่ายีศักดิ์ศรีของศรัทธาที่แทจริงมานานหลายทศวรรษ ในที่สุดเราก็สถาปนาศาสนจักรอันศักดิ์สิทธิ์เปนอํานาจสูงสุดทั้งทางศีลธรรมและกฎหมายในเม็กซิโก!"
 MEX_church_power_4: "ศาสนจักรทรงอํานาจ"
 MEX_church_power_4_desc: "เราไดลดการกดขี่ศรัทธาที่แทจริงดวยการคืนกรรมสิทธิ์ในเซมินารีและโบสถ แตยังมีงานอีกมากที่ตองทํา"
 MEX_church_power_3: "ศาสนจักรที่แข็งขัน"
 MEX_church_power_3_desc: "เราไดยุติความพยายามกวาดลางศาสนจักรคาทอลิกในเม็กซิโกแลว การใหอํานาจปกครองตนเองเล็กนอยแกบาทหลวงจะทําใหพวกเขาเคารพการควบคุมรัฐของเรา และไมพยายามบอนทําลายเสถียรภาพของเรา"
 MEX_church_power_2: "ศาสนจักรออนแอ"
 MEX_church_power_2_desc: "รัฐธรรมนูญป 1917 กําหนดมาตรการเพื่อจํากัดอิทธิพลของศาสนจักรคาทอลิกในเม็กซิโก พวกคริสเตโรสกอกบฏในทศวรรษ 1920 เพราะความพยายามบังคับใชกฎหมายเหลานั้น แตบัดนี้ประชาชนอาจพรอมสําหรับรัฐฆราวาสแลว"
 MEX_church_power_1: "รัฐอเทวนิยม"
 MEX_church_power_1_desc: "ศาสนจักรคาทอลิกในเม็กซิโกจะกลายเปนอดีต บาทหลวงคือพวกตอตานการปฏิวัติและผูเรขายเรื่องงมงายไรสาระ เราจะผลักดันอยางหนักยิ่งขึ้นเพื่อเปลี่ยนเม็กซิโกใหเปนปอมปราการแหงเหตุผลนิยมและวิทยาศาสตร!"
 MEX_cedillo_tension: "ความตึงเครียดกับเหลาเกาดิโยตํ่า"
 MEX_cedillo_tension_desc: "นายพลซาตูรนิโน เซดิโย และเหลาเกาดิโยที่เปนพวกเดียวกับเขาสูญเสียอํานาจไปมาก แตพวกเขายอมกําลังหาทางทวงคืนอยางแนนอน"
 MEX_cedillo_tension_2: "ความตึงเครียดกับเหลาเกาดิโยปานกลาง"
 MEX_cedillo_tension_2_desc: "นายพลซาตูรนิโน เซดิโย และเหลาเกาดิโยที่เปนพวกเดียวกับเขากําลังหวงแหนอิทธิพลของตนอยางยิ่ง เราอาจตองจัดการกับพวกเขาหากพวกเขาขวางทางรัฐบาล"
 MEX_cedillo_tension_3: "ความตึงเครียดกับเหลาเกาดิโยสูง"
 MEX_cedillo_tension_3_desc: "นายพลซาตูรนิโน เซดิโย และเหลาเกาดิโยที่เปนพวกเดียวกับเขากําลังทําการโดยอิสระจากรัฐบาล ควรถือวาพวกเขาติดตอกับศัตรูทั้งภายในและภายนอกของ [Root.GetLeader] และประชาชนชาวเม็กซิกัน!"
 MEX_cedillo_tension_4: "ความตึงเครียดกับเหลาเกาดิโยสูงมาก"
 MEX_cedillo_tension_4_desc: "นายพลซาตูรนิโน เซดิโย และเหลาเกาดิโยที่เปนพวกเดียวกับเขากําลังรวบรวมกําลังพลอยางเปดเผยเพื่อเตรียมกอกบฏตอรัฐบาลอันชอบธรรมของ [Root.GetLeader] เราตองรีบลงมือเพื่อยุติภัยคุกคามตอเอกภาพของเม็กซิโกนี้!"
 MEX_brown_water_navy: "กองทัพเรือชายฝง"
 MEX_brown_water_navy_desc: "เรามีกองกําลังปองกันชายฝงที่สามารถคุกคามเรือดํานํ้าและเรือผิวนํ้าที่เขามาจูโจมได แตกองเรือผิวนํ้าของศัตรูที่มุงมั่นจะกวาดเราออกไปไดอยางงายดาย"
 MEX_blue_water_navy: "กองทัพเรือนํ้าลึก"
 MEX_blue_water_navy_desc: "เปาหมายของเราในตอนนี้คือกองเรือผิวนํ้าที่สามารถยืนหยัดตอกรกับกองเรือของมหาอํานาจโลกได"
 MEX_raiding_navy: "กองทัพเรือจูโจม"
 MEX_raiding_navy_desc: "การพยายามเอาชนะกองทัพเรือของมหาอํานาจโลกยอมไรผล เราจะมุงทําลายการคาและขบวนเรือลําเลียงของศัตรูแทน เพื่อปกปองเม็กซิโกจากการรุกราน"
 MEX_heavy_artillery: "ปนใหญหนัก"
 MEX_heavy_artillery_desc: "เรามุงเนนปนใหญสนามแบบดั้งเดิมสําหรับการยิงสนับสนุน"
 MEX_aerial_artillery: "ปนใหญทางอากาศ"
 MEX_aerial_artillery_desc: "เรามุงเนนเครื่องบินทิ้งระเบิดเบาและเครื่องบินทิ้งระเบิดทางยุทธวิธีสําหรับการยิงสนับสนุน"
 MEX_politicised_army: "กองทัพที่ฝกใฝการเมือง"
 MEX_politicised_army_desc: "ผูปกครองเม็กซิโกมาจากนายทหารของกองทัพปฏิวัติมาเกือบสามทศวรรษ ชวงเวลาอันปนปวนที่เราผานมาตองการการนําที่เด็ดขาด คําถามคือ ความปนปวนผานพนไปแลว หรือกําลังรุนแรงขึ้น? เราควรทําใหกองทัพเปนมืออาชีพ หรือปลอยใหผูมีอิทธิพลในภูมิภาค ทั้งกาซิเกและเกาดิโย ตั้งอาณาเขตเล็กๆ ของตนเอง? นายพลอยางซาตูรนิโน เซดิโย ในซานลุยสโปโตซีกําลังตั้งกองกําลังติดอาวุธสวนตัวเพื่อปกปองอํานาจของตน การกบฏหลายครั้งที่นายทหารผูไมพอใจกอขึ้นในอดีตก็นาจะเกิดขึ้นตอไปหากเราไมลงมือ"
 MEX_politicised_army_2: "กองทัพที่ฝกใฝการเมือง"
 MEX_politicised_army_2_desc: "เราสามารถลดพฤติกรรมแปลกแยกของผูมีอิทธิพลในภูมิภาคไดดวยการหามใชกองกําลังติดอาวุธทางการเมือง เชน กลุมเสื้อแดงของนายพลการริโด และกลุมเสื้อทองของนายพลนิโกลัส โรดริเกซ"
 MEX_revolutionary_army: "กองทัพปฏิวัติ"
 MEX_revolutionary_army_desc: "การปฏิวัติเม็กซิโกตอสูและไดชัยมาดวยวีรชนและผูรักชาติ ซึ่งเราตองการใหอยูเคียงขางเพื่อรักษาเอกราชของประเทศ"
 MEX_left_wing_paramilitaries: "กองกําลังกึ่งทหารฝายซาย"
 MEX_left_wing_paramilitaries_desc: "กลุมตางๆ อยางเสื้อแดงของนายพลการริโดแหงตาบัสโก จะชวยเราทําลายศัตรูของประชาชนที่พยายามบอนทําลายการปฏิวัติดวยการแสวงหาผลประโยชนสวนตน พวกเขาจะชวยเราถอนรากถอนโคนผูสนับสนุนศาสนจักรคาทอลิกที่แอบแฝง ซึ่งเปนพวกตอตานการปฏิวัติที่ตองการใหเม็กซิโกยอนกลับสูยุคมืด"
 MEX_right_wing_paramilitaries: "กองกําลังกึ่งทหารฝายขวา"
 MEX_right_wing_paramilitaries_desc: "กลุมตางๆ อยางเสื้อทองของนายพลนิโกลัส โรดริเกซ การรัสโก จะชวยเรารักษาเอกภาพของประเทศจากพวกทรยศฝายซายและพวกยอมแพ"
 MEX_ejido_worker_militias: "กองกําลังกรรมกรเอฆิโด"
 MEX_ejido_worker_militias_desc: "เกษตรกรผูขยันขันแข็งในระบบเอฆิโดแบบสวนรวมกําลังรวมตัวกันเพื่อปกปองผลประโยชนของตนในเม็กซิโกใหมที่เรากําลังสราง"
 MEX_caudillo_private_armies: "กองทัพสวนตัวของเกาดิโย"
 MEX_caudillo_private_armies_desc: "ผูวาการ นักธุรกิจ และผูบัญชาการกองรักษาการณในภูมิภาคหนึ่งมักเปนคนคนเดียวกัน นั่นคือนายพลแหงการปฏิวัติที่สั่งสมอํานาจดวยการแตงตั้งลูกนองผูภักดีใหดํารงตําแหนงสําคัญ เกาดิโยเหลานี้เปนความจริงที่เราควรบมเพาะ ไมใชตอตาน"
 MEX_strike_breaking: "การสลายการนัดหยุดงาน"
 MEX_strike_breaking_desc: "การนัดหยุดงานคือการทรยศชาติในยามวิกฤต ดวยการควบคุมแรงงานในอุตสาหกรรมยุทธศาสตร เราจะเพิ่มผลผลิตไดเพื่อประโยชนของปตุภูมิ"
 MEX_international_struggle: "การตอสูระดับสากล"
 MEX_international_struggle_desc: "เราจะชวยเหลือผูที่เราเห็นวาควรไดรับความชวยเหลือในการตอสูทางอุดมการณและการปลดปลอย นี่คือความรับผิดชอบอันหนักอึ้ง แตประชาชนชาวเม็กซิกันแข็งแกรงพอสําหรับภารกิจนี้"
 MEX_synarchist_influence: "อิทธิพลซินารกิสต"
 MEX_synarchist_influence_desc: "พวกซินารกิสตเม็กซิกันกําลังพยายามเผยแพรโฆษณาชวนเชื่อในดินแดนของเรา พวกเขาพยายามซอนเปาหมายแหงการกดขี่ไวเบื้องหลังสิ่งที่เรียกวา "ความเปนปกแผนแหงฮิสแปนิก""
 MEX_oil_concessions: "สัมปทานนํ้ามัน"
 MEX_oil_concessions_desc: "เพื่อขุดเจาะนํ้ามันในเม็กซิโก บริษัทตางชาติไดลงนามในสัญญาสัมปทานที่รับรองวาพวกเขาสามารถขุดนํ้ามันไดอยางเสรีในพื้นที่ที่กําหนดเปนระยะเวลายาวนานเพื่อแลกกับคาตอบแทน อยางไรก็ตาม เงินที่บริษัทจายนั้นตํ่ากวามูลคาของนํ้ามันที่ขุดไดมาก ทําใหพวกเขาไดกําไรสูงกวาในประเทศอยางสหรัฐอเมริกามาก ขณะที่แหลงนํ้ามันสํารองของเม็กซิโกตกอยูใตการควบคุมของตางชาติโดยออม"
 MEX_bolivarian_agitation: "การปลุกระดมแบบโบลิวาร"
 MEX_hispanic_culture: "วัฒนธรรมฮิสแปนิก"
 MEX_hispanic_culture_desc: "ชาติตางๆ ในละตินอเมริกามีวัฒนธรรมอันแข็งแกรงที่หลอหลอมจากการพิชิตและการอยูรอด การกบฏและการปกครองอันเด็ดขาด วัฒนธรรมรวมของเราคือที่มาแหงความภาคภูมิใจและแสงนําทางสูความกาวหนาในอนาคต"
 MEX_proletarian_class_army: "กองทัพชนชั้นกรรมาชีพ"
 MEX_proletarian_class_army_desc: "มีเพียงชนชั้นกรรมาชีพที่ติดอาวุธและจัดตั้งเปนกองทัพแหงชนชั้นเทานั้นที่จะปกปองและเผยแผอุดมการณแหงการปฏิวัติได"
 MEX_idea_vanguard_of_the_4th_international: "กองหนาแหงสากลที่ 4"
 MEX_idea_vanguard_of_the_4th_international_desc: "การปฏิวัติของเราไดกลายเปนสายลมแหงเสรีภาพที่ผลักดันกรรมกรทั่วโลกสูวีรกรรมอันกลาหาญยิ่งขึ้น สากลที่ 4 จะปลดปลอยมนุษยชาติจากพันธนาการของปฏิกิริยาฟาสซิสต กระฎมพี และโบนาปารตนิยม"
 MEX_luis_montes_de_oca: "ลุยส มอนเตส เด โอกา"
 MEX_luis_montes_de_oca_desc: "ลุยส มอนเตส เด โอกา เปนนายธนาคารชาวเม็กซิกันผูมีชื่อเสียงและผูสนับสนุนเศรษฐศาสตรสํานักออสเตรีย"
 MEX_alberto_pani: "อัลเบรโต เฆ. ปานี"
 MEX_alberto_pani_desc: "อัลเบรโต เฆ. ปานี เปนผูวางรากฐานอุตสาหกรรมการเงินของเม็กซิโก และเปนหนึ่งในผูนําของธนาคารแหงชาติและธนาคารสินเชื่อเพื่อการเกษตร"
 MEX_luis_farell: "ลุยส ฟาเรลล กูบิยัส"
 MEX_luis_farell_desc: ""
 MEX_abelardo_rodriguez: "อาเบลารโด แอล. โรดริเกซ"
 MEX_abelardo_rodriguez_desc: "อาเบลารโด แอล. โรดริเกซ เขารวมการปฏิวัติในป 1913 และไดรับการเลื่อนยศจากพลทหารขึ้นมาดวยสติปญญาและความขยันหมั่นเพียร ความภักดีตอการปฏิวัติของเขาไดรับการตอบแทนในป 1932 เมื่อเขาไดเปนประธานาธิบดีเม็กซิโกในชวงสองปสุดทายของวาระของอัลบาโร โอเบรกอน หลังจากโอเบรกอนถูกลอบสังหาร"
 MEX_jose_gonzalo_escobar: "โฆเซ กอนซาโล เอสโกบาร"
 MEX_jose_gonzalo_escobar_desc: "นายพลเอสโกบารตอสูกับกบฏของปนโช บิยา ทามกลางความวุนวายและการแยงชิงอํานาจในการปฏิวัติ โดยนําทหารมาบุกโจมตีศัตรูของรัฐบาล เขาขัดแยงกับประธานาธิบดีกาเยสและถูกเนรเทศหลังจากพยายามกอกบฏเองในป 1929 แตดวยการปรับคณะรัฐมนตรี เขาสามารถกลับมาได"
 MEX_pablo_gonzalez: "ปาโบล กอนซาเลซ การซา"
 MEX_pablo_gonzalez_desc: "ปาโบล กอนซาเลซ เปนนายพลแหงกองทัพผูมีพรสวรรคในการจัดการ 'งานสกปรก' เขาชวยวางแผนซุมโจมตีที่สังหารเอมิเลียโน ซาปาตา กบฏและเกาดิโยผูเปนที่นิยมในป 1919"
 MEX_plutarco_calles: "ปลูตารโก เอ. กาเยส"
 MEX_plutarco_calles_desc: "กาเยสเปนประธานาธิบดีระหวางป 1924 ถึง 1928 และยังคงใชอํานาจอยางมากเหนือรัฐเม็กซิโกดวยเครือขายอุปถัมภอันทรงพลัง ศัตรูทางการเมืองตั้งฉายาเขาวา 'Jefe Máximo' (ผูนําสูงสุด) เพื่อเปรียบเทียบเขากับประธานาธิบดีดิอัซผูเปนเผด็จการตลอดชีพ คํานี้กลายเปนที่ใชกันทั่วไป แมเขาจะยืนกรานวาตนเปนเพียงรัฐบุรุษที่เกษียณแลวซึ่งใหคําแนะนําเพื่อประโยชนของประเทศ"
 MEX_vicente_lombardo: "บิเซนเต ลอมบารโด"
 MEX_vicente_lombardo_desc: "นักสหภาพแรงงานหัวรุนแรงผูตอสูเพื่อสิทธิของกรรมกรหลังการปฏิวัติ และนําขบวนการแรงงานเขาเปนพันธมิตรกับพรรครัฐบาลของการเดนัส"
 MEX_jose_vasconcelos: "โฆเซ บัสกอนเซโลส"
 MEX_jose_vasconcelos_desc: "บัสกอนเซโลสเปนนักเขียนดานวัฒนธรรม อดีตรัฐมนตรี และผูสมัครชิงตําแหนงประธานาธิบดี เขาผสมผสานแนวคิดศาสนาพื้นเมือง นิกายคาทอลิก และชาตินิยมพลเมืองเขาดวยกันเปนอุดมการณเม็กซิกันแบบผสมผสาน เขาสนับสนุนการยึดคืนดินแดนที่เม็กซิโกยกใหอเมริกา"
 MEX_bartolome_garcia_correa: "บารโตโลเม การเซีย กอรเรอา"
 MEX_bartolome_garcia_correa_desc: "ชาวมายาพื้นเมืองจากยูกาตังผูเคยดํารงตําแหนงผูวาการและวุฒิสมาชิก ดําเนินนโยบายประชานิยมที่ประสานขนบธรรมเนียมพื้นเมืองเขากับอํานาจรัฐ"
 MEX_aaron_saenz: "อาอารอน ซาเอนซ การซา"
 MEX_aaron_saenz_desc: "อาอารอน ซาเอนซ นักธุรกิจและผูวาการฝายขวา ไดรับฉายาวา 'เงาของกาเยส' จากความสามารถในการควบคุมคณะรัฐมนตรีของประธานาธิบดีหุนเชิดใหเปนไปตามเปาหมายของ el Jefe Máximo"
 MEX_manuel_perez_trevino: "มานูเอล เปเรซ เตรบิโญ"
 MEX_manuel_perez_trevino_desc: "มานูเอล เปเรซ เตรบิโญ เปนนายพลแหงการปฏิวัติผูเชี่ยวชาญดานวิศวกรรมและปนใหญ เขามีอิทธิพลทางการเมืองสูงในฐานะผูกอตั้งพรรคปฏิวัติแหงชาติ (Partido Nacional Revolucionario)"
 MEX_saturnino_cedillo: "ซาตูรนิโน เซดิโย มารตีเนซ"
 MEX_saturnino_cedillo_desc: "นายพลเซดิโย ผูวาการและผูนําทางทหารผูมั่งคั่งจากภาคเหนือ ใชอํานาจผานระบบอุปถัมภที่ตั้งอยูบนความภักดีสวนตัว อิทธิพลที่เสื่อมลงของเหลาเกาดิโยและการรวมศูนยอํานาจของประเทศเปนเรื่องที่เขากังวลอยางยิ่ง เพราะคุกคามความเปนอิสระของเขาจากรัฐบาล"
 MEX_othon_blanco: "โอตอน เป. บลังโก นูเญซ เด กาเซเรส"
 MEX_othon_blanco_desc: "โอตอน บลังโก เปนสมาชิกอาวุโสของกระทรวงทหารเรือ ซึ่งรับราชการเปนนายทหารเรือมาตั้งแตกอนการปฏิวัติ ความเชี่ยวชาญของเขาคือการทําใหกองทัพเรือเขาถึงการสนับสนุนดานการสงกําลังบํารุงไดดี ถึงขั้นสรางชุมชนแหงใหม"
 MEX_heriberto_corona: "เอริเบรโต ฮารา โกโรนา"
 MEX_heriberto_corona_desc: "เอริเบรโต โกโรนา เปนนายพลแหงการปฏิวัติที่ไดรับแตงตั้งเขาสูกองทัพเรือเพื่อรับประกันความภักดีของกองทัพเรือ"
 MEX_manuel_avila: "มานูเอล อาบิลา กามาโช"
 MEX_manuel_avila_desc: "นายพลแหงการปฏิวัติที่ไดรับแตงตั้งเขาสูกระทรวงกลาโหมเพื่อเตรียมเม็กซิโกใหพรอมรับปญหาที่รออยูขางหนา"
 MEX_leon_trotsky: "เลฟ ทรอตสกี"
 MEX_leon_trotsky_desc: "ผูรับผิดชอบการสรางกองทัพแดงขึ้นแทบจากศูนยในชวงสงครามกลางเมืองรัสเซีย ผูนําสันนิบาตคอมมิวนิสตสากลผูนี้จะชวยจัดระเบียบกองทัพ"
 MEX_tga: "ตาเยเรส เฆเนราเลส เด อารมา"
 MEX_tga_desc: "หนวยงานแยกออกมาจากโรงงานอากาศยานเม็กซิกัน TNCA ที่มุงเนนยานรบหุมเกราะ"
 MEX_germano_mexican_tanks: "แบบรถถังเยอรมัน-เม็กซิกัน"
 MEX_germano_mexican_tanks_desc: ""
 MEX_russo_mexican_tanks: "แบบรถถังรัสเซีย-เม็กซิกัน"
 MEX_russo_mexican_tanks_desc: ""
 MEX_american_mexican_tanks: "ไครสเลอรเม็กซิกัน"
 MEX_american_mexican_tanks_desc: ""
 MEX_astimar_gulf: "ASTIMAR อาว"
 MEX_astimar_gulf_desc: "อูตอเรือของกระทรวงทหารเรือแหงอาวเม็กซิโก"
 MEX_astimar_pacific: "ASTIMAR แปซิฟก"
 MEX_astimar_pacific_desc: "อูตอเรือของกระทรวงทหารเรือแหงแปซิฟก"
 MEX_tnca: "โรงงานแหงชาติเพื่อการสรางอากาศยาน"
 MEX_tnca_desc: "โรงงานแหงชาติเพื่อการสรางอากาศยานกอตั้งขึ้นกอนการปฏิวัติ และเคยเปนผูออกแบบที่มีนวัตกรรมกอนจะถูกกระทบจากสงครามกลางเมือง"
 MEX_royal_dutch_shell: "รอยัลดัตชเชลล"
 MEX_royal_dutch_shell_desc: "บริษัทอังกฤษ-ดัตชที่ถือสัมปทานนํ้ามันในเม็กซิโกถึง 60%"
 mexican_ford: "ฟอรดเม็กซิกัน"
 mexican_ford_desc: "แฟรนไชสทองถิ่นของบริษัทฟอรดมอเตอร"
 MEX_pemex: "เปเมกซ"
 MEX_pemex_desc: "เปโตรเลโอส เม็กซิกาโนส กอตั้งขึ้นจากการโอนกิจการเปนของรัฐซึ่งทรัพยสินในประเทศที่เคยเปนของรอยัลดัตชเชลล สแตนดารดออยลแหงแคลิฟอรเนีย และบริษัทตางชาติอื่นๆ"
 MEX_banco_de_mexico: "ธนาคารแหงเม็กซิโก"
 MEX_banco_de_mexico_desc: "ธนาคารแหงชาติของเรากอตั้งขึ้นในป 1925 เพื่อฟนฟูเศรษฐกิจที่พังพินาศจากสงครามกลางเมือง ทําหนาที่เปนผูใหกูแหลงสุดทาย ผูออกเงินตรา และผูลงทุนในกิจการทุกประเภทเพื่อประโยชนของรัฐ"
 MEX_escuela_de_ingeneria_electrica: "โรงเรียนวิศวกรรม"
 MEX_escuela_de_ingeneria_electrica_desc: "Escuela Superior de Ingenería Mecánica y Eléctrica หรือมหาวิทยาลัยวิศวกรรมเครื่องกลและไฟฟา เปนหนึ่งในสถาบันการศึกษาที่ดีที่สุดของเรา และเปนแนวหนาของการวิจัยดานคลื่นแมเหล็กไฟฟาและโทรทัศน"
 MEX_capital_reserves: "ทุนสํารอง"
 MEX_capital_reserves_desc: "ความมั่งคั่งที่หลั่งไหลเขามาจากอุตสาหกรรมนํ้ามันที่ขยายตัวจะชวยใหเราซื้อยุทโธปกรณทางทหารคุณภาพสูงจากตางประเทศได"
 MEX_knights_of_columbus: "อัศวินแหงโคลัมบัส"
 MEX_knights_of_columbus_desc: "อัศวินแหงโคลัมบัส ภราดรภาพนานาชาติของชาวคาทอลิก จะชวยเราสรางสันติภาพและการปรองดองหลังความขัดแยงภายในมาหลายทศวรรษ ดังที่พระวรสารนักบุญมัทธิวกลาวไววา 'ทานทั้งหลายเคยไดยินคํากลาววา 'ตาตอตา ฟนตอฟน' แตเราบอกทานวา อยาตอบโตคนชั่ว ถาผูใดตบแกมขวาของทาน จงหันแกมอีกขางใหเขาดวย'"
 MEX_social_catholicism: "คาทอลิกสังคม"
 MEX_social_catholicism_desc: "การปฏิวัติอุตสาหกรรมทําใหกรรมกรตกอยูในสภาพที่ไรมนุษยธรรม เพื่อตอบโตขอเรียกรองของฝายสังคมนิยม จึงมีการเนนยํ้าเปนพิเศษถึงความจําเปนที่ฝายบริหารตองแสดงความเมตตาตอลูกจาง สิ่งนี้กอใหเกิดสังคมนิยมคริสเตียนแบบไมปฏิวัติรูปแบบหนึ่ง นั่นคือคาทอลิกสังคม"
 MEX_legion_of_christ: "กองทัพแหงพระคริสต"
 MEX_legion_of_christ_desc: "พวกกอการรายผูไรศาสนาพายแพแลว! การกดขี่อันโหดรายของพวกมันตองไดรับการลงโทษอยางสาสม ดังที่หนังสืออพยพกลาวไววา ตาแทนตา ชีวิตแทนชีวิต ในฐานะแขนแหงการแกแคนของพระผูเปนเจา กองทัพแหงพระคริสตจะทําใหความไรศรัทธาแบบซาตานหมดไปจากแผนดินของเรา"
 MEX_triumph_of_synarchism: "ชัยชนะของลัทธิซินารกิสม"
 MEX_triumph_of_synarchism_desc: "ศัตรูของเราพายแพยอยยับ และกําลังซอนตัวในเงามืดเหมือนสมุนของซาตาน บัดนี้เรามีอิสระเต็มที่ในการฟนฟูรัฐในแบบที่จะรับประกันเอกภาพทั้งในศรัทธาและเจตจํานงทางการเมือง"
 MEX_womens_suffrage: "สิทธิเลือกตั้งของสตรี"
 MEX_womens_suffrage_desc: "ในชวงหลายปมานี้ ชนชั้นนําของเม็กซิโกจํานวนมากกังวลวาสตรีจะบอนทําลายอุดมการณแหงการปฏิวัติดวยการเขาขางศาสนจักรคาทอลิกตอตานรัฐธรรมนูญฆราวาสป 1917 แตความเสมอภาคภายใตกฎหมายสําคัญกวามาก และจะทําใหสังคมของเราเจริญรุงเรือง"
 MEX_professional_army: "วิทยาลัยการสงคราม"
 MEX_professional_army_desc: "ดวยวิทยาลัยการทหารของเรา นายพลของเราไดเรียนรูวิธีพัฒนาระบบเสบียงที่มีประสิทธิภาพเพื่อใหกองทหารสูรบไดอยางมีประสิทธิภาพสูงสุด"
 MEX_international_peacekeepers: "กองกําลังรักษาสันติภาพระหวางประเทศ"
 MEX_international_peacekeepers_desc: "มหาอํานาจประชาธิปไตยของโลกวางแผนจะสรางพันธมิตรของผูเทาเทียม หรือสหประชาชาติ เพื่อรักษาความมั่นคงระหวางประเทศ โดยใหประเทศตางๆ ในโลกมีเวทีสําหรับคลี่คลายความขัดแยงและไกลเกลี่ยขอพิพาท เราจะทุมเทใหกับโครงการนี้เพื่อชวยใหชาติละตินอเมริการักษาเอกราชของตนไวได"
 mexico_hispanic_diplomacy: "การทูตแบบฮิสแปนิก"
 mexico_hispanic_diplomacy_desc: "หากเราตองการบรรลุความทะเยอทะยานระดับทวีป เราตองโนมนาวรัฐบาลจํานวนมากในละตินอเมริกา"
 mexico_german_submarine_happy_time: "ชวงเวลาแสนสุขของเรือดํานํ้า"
 mexico_german_submarine_happy_time_desc: "กัปตันเรือดํานํ้าของเรากําลังเพลิดเพลินกับชวงเวลาแสนสุข ('Glückliche Zeit') ดวยการจมเรือสินคาของชาติเปนกลางที่ไรการคุมกันนอกชายฝงทวีปอเมริกา"
 synarchist_youth: "ยุวชนซินารกิสต"
 synarchist_youth_desc: "เยาวชนคืออนาคตของชาติ หากไดรับการศึกษาอยางเหมาะสม พวกเขาจะกลายเปนตัวแทนแหงอุดมการณของเรา นั่นคือความแข็งแกรง ความภักดี และความศรัทธา"
 ENG_trade_union_factory_demands: "ขอเรียกรองของสหภาพแรงงานในโรงงาน"
 ENG_construction_safety_regulations: "กฎระเบียบความปลอดภัยในการกอสราง"
 ENG_mandatory_union_days: "วันสหภาพแรงงานภาคบังคับ"
 ENG_trade_union_factory_worker_support: "การสนับสนุนจากสหภาพแรงงานโรงงาน"
 ENG_trade_union_dockyard_worker_support: "การสนับสนุนจากสหภาพแรงงานอูตอเรือ"
 ENG_trade_union_construction_worker_support: "การสนับสนุนจากสหภาพแรงงานกอสราง"
 ENG_trade_union_war_propaganda_support: "การสนับสนุนโฆษณาชวนเชื่อสงครามจากสหภาพแรงงาน"
 ENG_dominion_fascist_propaganda: "โฆษณาชวนเชื่อฟาสซิสตอังกฤษ"
 ENG_dominion_communist_propaganda: "โฆษณาชวนเชื่อคอมมิวนิสตอังกฤษ"
 ENG_restoring_public_order: "ฟนฟูความสงบเรียบรอยของบานเมือง"
 ENG_support_for_the_king_idea: "การสนับสนุนพระมหากษัตริย"
 ENG_exiled_royal_family: "ราชวงศลี้ภัย"
 ENG_confiscated_royal_wealth: "ทรัพยสินราชวงศที่ถูกยึด"
 ENG_raymond_briggs: "เรยมอนด บริกส"
 HOL_wilhelmina: "วิลเฮลมินา"
 HOL_wilhelmina_desc: "นับหลายศตวรรษที่ราชวงศออเรนจ-นัสเซาผูกพันอยูกับประวัติศาสตรของเนเธอรแลนด เชนเดียวกับวิลเลียมผูเงียบงันพระบรรพบุรุษในสงครามแปดสิบป สมเด็จพระราชินีวิลเฮลมินาพระองคปจจุบันยอมเปนแรงบันดาลใจใหชาวดัตชรวมพลังปกปองมาตุภูมิอยางไมตองสงสัย หากประเทศของพวกเขาถูกรุกราน"
 HOL_aloof_neutrality: "ความเปนกลางแบบเหินหาง"
 HOL_aloof_neutrality_desc: "นโยบายความเปนกลางอยางเครงครัดทําใหชาวดัตชไมตองทําสงครามกับเพื่อนบานใดเลยมาเกือบ 150 ป และที่สําคัญที่สุดคือไมตองเขารวมมหาสงคราม ความเชื่อของประชาชนใน "เครื่องรางคุมภัย" นี้จึงแทบจะแรงกลา และรัฐบาลดัตชที่ออนแอก็ไมอาจฝนเจตจํานงของประชาชนเพื่อแสดงจุดยืนที่แข็งกราวในการเมืองระหวางประเทศได แตกลับตัดสินใจฝากความหวังไวกับสันนิบาตชาติ และวางตัวเหินหางตอเหตุการณโลก"
 HOL_shell_shocked_spectator: "ผูเฝามองมหาสงครามที่ยังขวัญผวา"
 HOL_shell_shocked_spectator_desc: "เนื่องจากเนเธอรแลนดที่เปนกลางเปนที่หลบภัยปลอดภัยที่ใกลที่สุดสําหรับผูลี้ภัยจากแนวรบดานตะวันตก ชาวดัตชจึงไดเฝามองความนาสะพรึงกลัวของมหาสงครามอยางใกลชิดเกินไป ผลที่ตามมาคือขบวนการสันตินิยมที่เขมแข็งไดแผซานไปทั่วประชาชนสวนใหญ และสรางความยุงยากอยางมากใหรัฐบาลในการเพิ่มงบประมาณทางทหาร มีเพียงกองทัพเรือที่ยังคงไดรับเกียรติภูมิในสายตาประชาชนอยูบาง\n\nตองมีสงครามปองกันตนเองหรือ "สงครามตอสันตินิยม" เทานั้นจึงจะขจัดความรูสึกนี้ออกจากประเทศไดอยางแทจริง"
 HOL_de_crisisjaren: "ปแหงวิกฤต"
 HOL_de_crisisjaren_desc: "ดวยลักษณะเฉพาะของเศรษฐกิจโลก ภาวะเศรษฐกิจตกตํ่าครั้งใหญจึงมาถึงเนเธอรแลนดชากวาที่อื่นมาก การตัดสินใจของชาวดัตชที่จะคงมาตรฐานทองคําไว ขณะที่ชาติอื่นละทิ้งไปอยางรวดเร็ว ยิ่งทําให "ปแหงวิกฤต" ในเนเธอรแลนดเลวรายลงอยางมหาศาล การรักษาคาเงินกิลเดอรไมใหลดลงทําใหไมเหลือเงินทุนชวยเศรษฐกิจดัตชที่ยํ่าแย ไมตองพูดถึงการปรับปรุงสภาพการปองกันประเทศที่ทรุดโทรม\n\nวิกฤตนี้สามารถบรรเทาไดดวยการลงทุนในโครงการสาธารณะ และจะแทบหมดความสําคัญหากเรายอมจํานนและสูญเสียการควบคุมแผนดินแมที่ประสบวิกฤต"
 HOL_weak_government: "รัฐบาลออนแอ"
 HOL_weak_government_desc: "รัฐบาลดัตชในชวงหลายปมานี้เต็มไปดวยความออนแอ ไมตองใชแรงมากนักก็โคนลมไดอีกครั้ง"
 HOL_shared_intelligence_eng: "ขาวกรองที่แบงปนจากอังกฤษ"
 HOL_shared_intelligence_fra: "ขาวกรองที่แบงปนจากฝรั่งเศส"
 HOL_shared_intelligence_ger: "ขาวกรองที่แบงปนจากเยอรมนี"
 HOL_shared_intelligence_hol: "ขาวกรองที่แบงปนจากเนเธอรแลนด"
 HOL_staff_plan_eng: "แผนเสนาธิการรวมกับอังกฤษ"
 HOL_staff_plan_fra: "แผนเสนาธิการรวมกับฝรั่งเศส"
 HOL_staff_plan_ger: "แผนเสนาธิการรวมกับเยอรมนี"
 HOL_de_vaarplicht_idea: "เดอฟารพลิคต"
 HOL_de_vaarplicht_idea_desc: ""ตามพระราชกฤษฎีกา A5 พลเมืองและคนในบังคับดัตชทุกคนที่ยังไมถูกเกณฑทหาร หรือถูกเกณฑแลวแตยังไมถูกเรียกเขาประจําการ มีหนาที่ตองปฏิบัติงานใหแกหรือเพื่อประโยชนของกองเรือพาณิชย""
 HOL_caved_to_the_germans_idea: "ยอมตามเยอรมัน"
 HOL_caved_to_the_germans_idea_desc: "แทนที่จะเผชิญภัยคุกคามจากการรุกราน ชาวดัตชเลือกที่จะยอมตามขอเรียกรองของเยอรมันในการเจรจาการคา เสรีภาพแบบประชาธิปไตยจึงเริ่มถูกกระทบ และนี่อาจถือเปนกาวแรกอยางลังเลที่หางออกจากความเปนกลาง"
 HOL_caved_to_the_british_idea: "ยอมตามอังกฤษ"
 HOL_caved_to_the_british_idea_desc: "แทนที่จะเผชิญภัยคุกคามจากการปดลอมเต็มรูปแบบซึ่งยอมหมายถึงหายนะทางเศรษฐกิจ ชาวดัตชเลือกที่จะยอมตามขอเรียกรองของอังกฤษในการเจรจาการคา กระแสตอตานเยอรมันและนิยมอังกฤษเริ่มเห็นไดชัดขึ้นในการเมืองภายในประเทศ และนี่อาจถือเปนกาวแรกอยางลังเลที่หางออกจากความเปนกลาง"
 HOL_prince_bernhard: "เจาชายแบรนฮารด"
 HOL_bernhard_air_example: "เจาชายแบรนฮารดเปนแบบอยางแกนักบิน"
 HOL_bernhard_strategy_meddling: "เจาชายแบรนฮารดแทรกแซงยุทธศาสตร"
 HOL_bernhard_intelligence: "เจาชายแบรนฮารดรวบรวมขาวกรอง"
 HOL_bernhard_organized_resistance: "เจาชายแบรนฮารดจัดตั้งขบวนการตอตาน"
 HOL_redirected_investments: "การลงทุนที่ถูกเบนทิศทาง"
 idea_weapons_for_the_resistance: "อาวุธเพื่อขบวนการตอตาน"
 idea_weapons_for_the_resistance_desc: "พันธมิตรของเรากําลังสงกระสุนใหนักสูเพื่อเสรีภาพผูกลาหาญที่กําลังตอสูกับศัตรูอันชิงชังในมาตุภูมิของเรา"
 political_turmoil: "ความวุนวายทางการเมือง"
 political_turmoil_desc: "รัฐบาลของประเทศนี้เพิ่งถูกตั้งขึ้นดวยกําลัง หลังจากผูนําชุดกอนหมดความโปรดปรานจากผูมีอํานาจเหนือตางชาติ"
 HOL_domestic_aircraft_production: "การผลิตอากาศยานในประเทศ"
 HOL_preparing_evacuation_of_gold_reserves: "เตรียมอพยพทองคําสํารอง"
 HOL_zuiderzee_infrastructure_advancements: "ความกาวหนาดานโครงสรางพื้นฐานไซเดอรเซ"
 HOL_zuiderzee_industrial_advancements: "ความกาวหนาดานอุตสาหกรรมไซเดอรเซ"
 HOL_german_defectors_1: "ผูแปรพักตรชาวเยอรมัน"
 HOL_german_defectors_1_desc: "ผูแปรพักตรชาวเยอรมันที่ไหลเขามาอยางตอเนื่องรวมตัวกันเปนหนวยที่กระตือรือรนจะสูเพื่อเรา เพื่อคืนบัลลังกใหไกเซอรของพวกเขา"
 HOL_german_defectors_2: "ผูแปรพักตรฝายนิยมไกเซอร"
 HOL_german_defectors_2_desc: "ความภักดีอันผิดที่ตอไกเซอรองคเกาทําใหทหารแปรพักตรมาสูเพื่อชาวดัตชอยางตอเนื่อง ดวยความพยายามอันสูญเปลาที่จะคืนบัลลังกใหไกเซอร\n\nมีเพียงความพายแพโดยสิ้นเชิงของชาวดัตชและพันธมิตรที่พวกเขาสังกัดเทานั้นที่นาจะกําจัดขบวนการนี้ไดหมดสิ้น"
 ENG_joint_air_training_scheme: "โครงการฝกนักบินรวม"
 ENG_joint_air_training_scheme_desc: "รัฐบาลอังกฤษไดดําเนินโครงการฝกลูกเรืออากาศยานสําหรับสมาชิกทั่วทั้งเครือจักรภพ เราจะไดรับประโยชนอยางมากจากโครงการนี้"
