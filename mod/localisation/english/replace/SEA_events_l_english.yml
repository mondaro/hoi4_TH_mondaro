l_english:


 
###################
###### JAPAN ######
###################

 SEA_japan.1.t: "กรณี 26 กุมภาพันธ"
 SEA_japan.1.desc: "โดยอางวามีภัยคุกคามตอจิตวิญญาณของชาติจักรวรรดิ นายทหารหนุมที่ภักดีตอกลุมโคโดฮะในกองทัพบกจักรวรรดิไดจัดตั้งการรัฐประหาร โดยมีเปาหมายกวาดลางผูนํารัฐบาลและกองทัพที่ตอตานอุดมการณนิยมทหารและการปกครองโดยตรงของจักรพรรดิ พวกเขาไดลอมบานพักของเจาหนาที่ระดับสูงไวแลว และยึดศูนยกลางรัฐบาลในโตเกียวได ทวาองคจักรพรรดิยังคงทรงนิ่งเงียบ แมฝายกบฏจะหวังวาพระองคจะทรงออกมาสนับสนุนพวกเขา เหตุการณนี้จะดําเนินไปอยางไร?"
 SEA_japan.1.a: "ยุติเรื่องตลกนี้เดี๋ยวนี้!"
 JAP_kodoha_coup_will_fail_historically_tt: "เราจะประกาศกฎอัยการศึกและใชกรมทหารโยโกสุกะของกองทัพเรือจักรวรรดิญี่ปุนปราบปรามการกบฏ มีรายงานความสูญเสียเพียงเล็กนอย แมจะยืนยันแลววาเปาหมายบางคนของโคโดฮะเสียชีวิต:"
 SEA_japan.1.b: "ถึงเวลากลับสูขนบประเพณีแลว!"
 JAP_kodoha_coup_will_succeed_tt: "โคโดฮะจะยึดกระทรวงกลาโหม โรงแรมอิมพีเรียล สภาไดเอ็ตแหงชาติ รวมถึงพระราชวังหลวง เปาหมายสําคัญหลายคนของโคโดฮะไดรับการยืนยันวาเสียชีวิตแลว:"
 SEA_japan.1.c: "ตองควบคุมฝายทหารใหอยู!"
 JAP_kodoha_coup_will_fail_non_historically_tt: "เราจะประกาศกฎอัยการศึกและพยายามปราบปรามการกบฏโดยใชหนวยปฏิบัติการพิเศษของกรมตํารวจนครบาลโตเกียว เพื่อจํากัดบทบาทของกองทัพในการนําโคโดฮะมาลงโทษ มีรายงานความสูญเสียไมมากนัก แมจะยืนยันแลววาเปาหมายบางคนของโคโดฮะเสียชีวิต:"
 SEA_japan.1.d: "ตองควบคุมฝายทหารใหอยู!" # Intentional
 SEA_japan.1.e: "ประชาชนตองตระหนักวาพวกเขากําลังถูกบอนทําลายจากทุกทิศทาง!"

 SEA_japan_foreign_policy.1.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมสยบ"
 SEA_japan_foreign_policy.1.desc: "ผูนํากองทัพคันโตของ [FROM.GetNameDef] เรียกรองใหเรายอมสยบ แตพวกเขาก็มาพรอมขอเสนอ หากเราเขารวมกับพวกเขา พวกเขาจะชวยเรายึดดินแดนมองโกลในอดีตคืนมา และจะอนุญาตใหเราสถาปนาจักรวรรดิมองโกลใหมภายใตการควบคุมของพวกเขา เราจะวาอยางไร?"
 SEA_japan_foreign_policy.1.a: "นี่คือโอกาสของเรา"
 SEA_japan_foreign_policy.1.b: "เราตองรักษาเอกราชไวไมวาจะตองแลกดวยอะไร!"
 MEN_li_shouxin_available_tt: "§Yหลี่ โซวซิน§! พรอมรับตําแหนง§Yนายพล§!"

 SEA_japan_foreign_policy.2.t: "[FROM.GetNameDefCap] ยอมอยูใตการปกครองของเรา"
 SEA_japan_foreign_policy.2.desc: "[FROM.GetLeader] ไดลงจากตําแหนงเพื่อเปดทางใหผูสมัครของเราขึ้นครองบัลลังก[FROM.GetAdjective] คือเจาชายเตอ ภูมิภาคนี้ตกอยูภายใตการยึดครองของเราแลว และการจัดระเบียบรัฐบาลของพวกเขาใหมจะดําเนินการในไมชา"
 SEA_japan_foreign_policy.2.a: "องคจักรพรรดิจะทรงพอพระทัยที่ไดทราบขาวนี้"

 SEA_japan_foreign_policy.3.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะยอมสยบตอจักรพรรดิ"
 SEA_japan_foreign_policy.3.desc: "[FROM.GetLeader] ปฏิเสธที่จะยอมตามขอเรียกรองของเรา ทั้งที่ไดเห็นแลววาเราทําอะไรกับนีมา-อดซอรเมื่อเขาลุกขึ้นตอตานผูปกครองศักดิ์สิทธิ์ของเรา บางทีอาจถึงเวลาสั่งสอนพวกเขาเรื่องความถอมตน"
 SEA_japan_foreign_policy.3.a: "พวกเขาลบหลูองคจักรพรรดิ เรื่องนี้ปลอยไวไมได!"
 SEA_japan_foreign_policy.3.b: "เราไมไดตองการพวกเขาอยูแลว"

 SEA_japan_foreign_policy.4.t: "[FROM.GetNameDefCap] เรียกรองใหเราเขารวมพันธมิตรของพวกเขา"
 SEA_japan_foreign_policy.4.desc: "คณะผูแทน[FROM.GetAdjective]ไดเขามาหาเราเพื่อขอความรวมมือในการแสวงหาความเปนใหญเหนือทวีปเอเชีย โดยเรียกรองใหเราเขารวมสงครามทั้งในปจจุบันและอนาคตขณะที่พวกเขาดําเนินภารกิจนี้ ดูเหมือนพวกเขาจะไมยอมรับคําปฏิเสธ แตนี่ยอมไมเปนประโยชนตอเราแนหรือ?"
 SEA_japan_foreign_policy.4.a: "เราจะแข็งแกรงขึ้นเมื่อรวมมือกัน"
 SEA_japan_foreign_policy.4.b: "นั่นขัดตอหลักความเปนกลางของเรา!"
 SEA_japan_foreign_policy.4.c: "เรากําลังอยูทามกลางสงคราม! ขอใหพวกเขารอกอน"
 SEA_japan_foreign_policy.4.c_tt: "เราจะถูกขอใหตอบเมื่อสงครามจํากัดขอบเขตสิ้นสุดลง"

 SEA_japan_foreign_policy.5.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเรา"
 SEA_japan_foreign_policy.5.desc: "[FROM.GetLeader] ไดเห็นเหตุผล และตัดสินใจวา [FROM.GetNameDef] จะลงนามในเอกสารที่จําเปนอยางเปนทางการเพื่อเขารวมฝายของเรา วันนี้เปนวันที่ควรเฉลิมฉลอง!"
 SEA_japan_foreign_policy.5.a: "ก็ควรเปนเชนนั้น"

 SEA_japan_foreign_policy.6.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวมกับเรา"
 SEA_japan_foreign_policy.6.desc: "[FROM.GetLeader] ไมยอมฟงเหตุผล และแถลงวา [FROM.GetNameDef] จะไมเขารวมพันธมิตรกับเรา สิ่งที่พวกเขาไมรูก็คือ เราไมมีเจตนาจะปลอยใหพวกเขาวางตัวเปนกลางในความขัดแยงระดับโลกที่กําลังจะมาถึง.."
 SEA_japan_foreign_policy.6.a: "เตรียมกองทหารใหพรอมโจมตี!"

 SEA_japan_foreign_policy.7.t: "[FROM.GetNameDefCap] เตรียมการรุกราน"
 SEA_japan_foreign_policy.7.desc: "เมื่อไมยอมรับคําปฏิเสธ มีผูพบเห็นกองทหาร[FROM.GetAdjective]กําลังเตรียมการรุกรานประเทศของเราอยางรวดเร็ว โดยนาจะตั้งใจเคลื่อนเขามาอยางฉับไวและพิชิตเรา ดึงเราเขาสูวงอิทธิพลของพวกเขา นี่นาจะเปนโอกาสสุดทายที่เราจะหลีกเลี่ยงความขัดแยง แตคําถามยังคงอยู เราจะความันไวหรือไม?"
 SEA_japan_foreign_policy.7.a: "คิดอีกที เรายอมสยบเสียตอนนี้ดีกวา"
 SEA_japan_foreign_policy.7.b: "ถาเชนนั้นก็ใหพวกเขามา!"

 SEA_japan_foreign_policy.8.t: "[FROM.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 SEA_japan_foreign_policy.8.desc: "ในที่สุด หลังจากไตรตรองอยูนาน คณะผูแทนจาก [FROM.GetNameDef] ก็ตัดสินใจลงนามในเอกสารฉบับแกไขที่เรายื่นให หลีกเลี่ยงการแทรกแซงทางทหาร แตตองสละเอกราชไปในกระบวนการนี้ บัดนี้เราพรอมเต็มที่ที่จะรุกลงใต!"
 SEA_japan_foreign_policy.8.a: "และความสงบเรียบรอยก็กลับคืนมา"

 SEA_japan_foreign_policy.9.t: "[FROM.GetLeader] ปฏิเสธที่จะยอมสยบ"
 SEA_japan_foreign_policy.9.desc: "โอกาสสุดทายที่เรามอบให [FROM.GetLeader] อยางมีนํ้าใจถูกปฏิเสธ และบัดนี้กองทหารของเราพรอมที่จะยึดครองเมืองใหญของพวกเขาอยางรวดเร็ว ถึงเวลาแสดงใหพวกเขาเห็นแลววาชาติ[ROOT.GetAdjective]ทํามาจากอะไร!"
 SEA_japan_foreign_policy.9.a: "เท็นโนเฮกะ บันไซ!"

 SEA_japan_foreign_policy.10.t: "[FROM.GetNameDefCap] เรียกรองใหยึดครอง [671.GetName]"
 SEA_japan_foreign_policy.10.desc: "คณะผูแทนที่ [FROM.GetNameDef] สงมาไดยื่นคําขาดแกเรา พวกเขาใหเวลาเราหนึ่งสัปดาหในการถอนกองทหารออกจากภูมิภาคตังเกี๋ย และอนุญาตใหกองทหารของพวกเขาเขามาตั้งที่มั่นและสรางฐานทัพในภูมิภาคนี้ พวกเขาอางวาเพื่อรับประกันวาจีนจะไมคุกคามอธิปไตยของ[VIN.GetAdjective] แตเรารูดีวาแทจริงแลวเรื่องนี้คืออะไร..."
 SEA_japan_foreign_policy.10.a: "เรื่องนี้ไมคุมที่จะตอสู"
 SEA_japan_foreign_policy.10.b: "เราจะไมยอมยกใหพวกเขา!"

 SEA_japan_foreign_policy.11.t: "[FROM.GetNameDefCap] โอน [671.GetName]"
 SEA_japan_foreign_policy.11.desc: "ผูนําใน [FROM.GetNameDef] ไดเห็นเหตุผล และเริ่มถอนกองทหารออกจากตังเกี๋ย เพื่อใหเราสรางเขตความมั่นคงที่นั่นเพื่อรับประกันวากองทหารจีนจะไมเขามาในดินแดน[VIN.GetAdjective] เราไดรับชัยชนะแลว!"
 SEA_japan_foreign_policy.11.a: "วันยิ่งใหญของประชาชน[ROOT.GetAdjective]"

 SEA_japan_foreign_policy.12.t: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 SEA_japan_foreign_policy.12.desc: "ผูนําใน [FROM.GetNameDef] ไมยอมฟงเหตุผล โดยแถลงวาพวกเขาจะไมยอมยกดินแดนในอินโดจีนใหแมแตนิ้วเดียว สิ่งนี้ขัดขวางการขยายตัวลงใตของเราอยางมาก... เราควรยอมรับเรื่องนี้ หรือถึงเวลาแลวที่จะโคนลมตะวันตก?"
 SEA_japan_foreign_policy.12.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 SEA_japan_foreign_policy.12.b: "เราตองปลอยเรื่องนี้ไป"

 SEA_japan_foreign_policy.13.t: "[FROM.GetNameDefCap] ยึดครอง [721.GetName]!"
 SEA_japan_foreign_policy.13.desc: "\nเมื่อตนสัปดาหนี้ กองกําลังของ [JAP.GetNameDef] ไดเคลื่อนเขามายึดครองดินแดน [721.GetName] ของเรา โดยอางวากําลังปฏิบัติภารกิจปกปองภูมิภาคจากการถูกยึดครองโดยศัตรูของพวกเขา นี่เปนการกระทําอันเปนสงครามอยางชัดเจน แตก็เปนสิ่งที่เราอาจเลือกเพิกเฉยได เพราะพวกเขาไมใชศัตรูที่เราจะสูไหวในตอนนี้"
 SEA_japan_foreign_policy.13.a: "เรื่องนี้ไมคุมที่จะตอสู"
 SEA_japan_foreign_policy.13.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 SEA_japan_foreign_policy.14.t: "[FROM.GetNameDefCap] จัดระเบียบรัฐบาลของเราใหม"
 SEA_japan_foreign_policy.14.desc: "เจาหนาที่บริหาร[FROM.GetAdjective]ผูชวยสถาปนารัฐของเราไดตัดสินใจวานี่เปนเวลาที่เหมาะสมที่จะจัดระเบียบโครงสรางรัฐบาลของเราใหมและปรับรูปแบบระบบกฎหมาย ในระยะยาวสิ่งนี้จะยิ่งเสริมความแข็งแกรงใหเรา เราจึงไมมีเหตุผลที่จะปฏิเสธ"
 SEA_japan_foreign_policy.14.a: "ก็ได"

 SEA_japan_foreign_policy.15.t: "[FROM.GetNameDefCap] เรียกรองใหยึดครอง [729.GetName]"
 SEA_japan_foreign_policy.15.desc: "โดยอางวาเมืองนี้อาจเปนจุดที่ศัตรูของพวกเขาใชโจมตีพวกเขาหากมีโอกาส กองทหาร[FROM.GetAdjective]ที่ปกครองภูมิภาค [592.GetName] ไดยื่นคําขาดแกเรา จะยอมใหพวกเขาเขามา ซึ่งเทากับมอบอํานาจใหทําอะไรกับเมืองนี้ก็ไดตามใจ หรือจะเผชิญกับกําลังทั้งหมดของกองทัพ[FROM.GetAdjective] เราควรทําอยางไร?"
 SEA_japan_foreign_policy.15.a: "เรื่องนี้ไมคุมที่จะตอสู"
 SEA_japan_foreign_policy.15.b: "เราจะไมยอมยกใหพวกเขา!"

 SEA_japan_foreign_policy.16.t: "[FROM.GetNameDefCap] โอน [729.GetName]"
 SEA_japan_foreign_policy.16.desc: "ผูบริหารภูมิภาค [729.GetName] ตัดสินใจยอมใหกองทหารของเราเขาไป เพราะตระหนักวาการตอตานจะไรผลในที่สุด ประชาชนของเราตางยินดีปรีดา เมื่อมหาอํานาจตะวันตกอีกชาติหนึ่งถูกผลักออกจากเอเชียตะวันออก!"
 SEA_japan_foreign_policy.16.a: "วันยิ่งใหญของประชาชน[ROOT.GetAdjective]"

 SEA_japan_foreign_policy.17.t: "[From.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 SEA_japan_foreign_policy.17.desc: "ผูบริหารภูมิภาค [729.GetName] ลืมฐานะของตน และตัดสินใจปฏิเสธขอเรียกรองที่ผูวาการของเราใน [592.GetName] ยื่นใหกอนหนานี้ ถึงเวลาแลวที่จะโคนจักรวรรดิ[FROM.GetAdjective]ลงใหสิ้นซาก!"
 SEA_japan_foreign_policy.17.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้!"
 SEA_japan_foreign_policy.17.b: "เราตองปลอยเรื่องนี้ไป"

 SEA_japan_foreign_policy.18.t: "[FROM.GetNameDefCap] เชิญเราเขารวมพันธมิตรของพวกเขา"
 SEA_japan_foreign_policy.18.desc: "คณะผูแทนจากแดนไกลเพิ่งเดินทางมาถึงเมืองหลวงของเรา เพื่อขอเขาเฝาองคผูปกครอง พวกเขาอางวามาจาก [FROM.GetNameDef] และตองการสรางพันธมิตรระหวางชาติของเรา เราจะยอมรับหรือไม?"
 SEA_japan_foreign_policy.18.a: "เราจะแข็งแกรงขึ้นเมื่อรวมมือกัน"
 SEA_japan_foreign_policy.18.b: "นั่นขัดตอหลักความเปนกลางของเรา..."

 SEA_japan_foreign_policy.19.t: "[FROM.GetNameDefCap] ยอมรับคําเชิญของเรา"
 SEA_japan_foreign_policy.19.desc: "[FROM.GetLeader] ไดตอบรับขอเสนอของเราอยางมีไมตรีในการสรางพันธมิตรอยางเปนทางการระหวางชาติของเรา และไดเริ่มดําเนินการเพื่อผนวกเขาสูวงอิทธิพลของเราแลว วันนี้เปนวันแหงการเฉลิมฉลอง!"
 SEA_japan_foreign_policy.19.a: "พวกเขารูดีวาอะไรดีที่สุดสําหรับตัวเอง"

 SEA_japan_foreign_policy.20.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวมกับเรา"
 SEA_japan_foreign_policy.20.desc: "[FROM.GetLeader] ตัดสินใจปฏิเสธขอเสนอพันธมิตรระหวางชาติของเราอยางไรมารยาท โดยแถลงวาขัดตอหลักความเปนกลางของพวกเขา เราไดแตจินตนาการวาตองมีการทุจริตมากเพียงใดจึงนําไปสูการตัดสินใจอันผิดพลาดนี้"
 SEA_japan_foreign_policy.20.a: "พวกเขาเสียโอกาสเอง"

 SEA_japan_foreign_policy.21.t: "[FROM.GetNameDefCap] จัดระเบียบรัฐบาลของเราใหมอีกขั้น"
 SEA_japan_foreign_policy.21.desc: "เจาเหนือหัวผูมีพระคุณของเรา [FROM.GetNameDef] ไดตัดสินใจรับรองการอางสิทธิ์ของเราในฐานะรัฐมองโกลที่แทจริงในที่สุด และไดเสนอใหจัดระเบียบรัฐบาลและหนวยงานของเราใหมอีกครั้งเพื่อรองรับการเปลี่ยนแปลงนโยบายนี้ วันนี้เปนวันยิ่งใหญของประชาชน[ROOT.GetAdjective]!"
 SEA_japan_foreign_policy.21.a: "หากนั่นคือสิ่งที่พวกเขาตองการ"

 SEA_japan_foreign_policy.22.t: "พบสายลับตองสงสัยของ[FROM.GetAdjective]"
 SEA_japan_foreign_policy.22.desc: "พบสายลับที่ตองสงสัยวาทํางานตามคําสั่งของ[FROM.GetAdjective]ภายในพรมแดนของเรา ดูเหมือนพยายามติดตอกับขุนนาง และลอลวงพลเมืองของเราดวยคําสัญญาอันยิ่งใหญเรื่องความไพบูลยรวมกัน เราควรจัดการสถานการณนี้อยางไร?"
 SEA_japan_foreign_policy.22.a: "พวกเขาไมทําอันตรายอะไรเรา ปลอยไปเถอะ"
 SEA_japan_foreign_policy.22.b: "เราจําเปนตองยกระดับความมั่นคงของชาติ!"

 SEA_japan_foreign_policy.23.t: "[FROM.GetNameDefCap] กําลังสรางอิทธิพลตอประชาชนของเรา"
 SEA_japan_foreign_policy.23.desc: "สายลับ[FROM.GetAdjective]เริ่มเผยแพรโฆษณาชวนเชื่อลัทธิแพน-เอเชียไปทั่วลาซา และเริ่มลักลอบนําเงินทุนเขามาเพื่อโนมนาวขุนนางทองถิ่น ดูเหมือนสถานการณอาจจะเกินควบคุมในไมชา..."
 SEA_japan_foreign_policy.23.a: "วงไพบูลยรวมกันลอใจพวกเขา..."

 SEA_japan_foreign_policy.24.t: "[FROM.GetNameDefCap] ติดตอกับทุบเทน คุนเปลาไดแลว"
 SEA_japan_foreign_policy.24.desc: "นายทหารของเรารายงานวาสายลับ[FROM.GetAdjective]ดูเหมือนจะประสบความสําเร็จในการติดตอกับทุบเทน คุนเปลา ขุนนางผูมีอํานาจมาก ซึ่งในอดีตไดรับฉายาวาผูทรงอิทธิพลแหงทิเบต จากนี้ไปสถานการณอาจเลวรายลงสําหรับเรา..."
 SEA_japan_foreign_policy.24.a: "พวกเขากําลังวางแผนบางอยาง..."

 SEA_japan_foreign_policy.25.t: "[FROM.GetNameDefCap] ติดอาวุธใหพรรคพัฒนาทิเบต"
 SEA_japan_foreign_policy.25.desc: "พรรคพัฒนาทิเบต พรรคการเมืองที่กอตั้งขึ้นขณะลี้ภัยในบริติชอินเดียและภักดีตอทุบเทน คุนเปลา เพิ่งไดรับหีบหออาวุธจากผูสงที่ไมทราบตัว ดูเหมือนวาพวกเขาอาจกําลังเตรียมกอรัฐประหารจากที่มั่นนอกเหนือการเอื้อมถึงของเรา"
 SEA_japan_foreign_policy.25.a: "สถานการณเริ่มเกินควบคุมแลว!"

 SEA_japan_foreign_policy.26.t: "รัฐประหารของผูทรงอิทธิพล"
 SEA_japan_foreign_policy.26.desc: "ในที่สุดวันนั้นก็มาถึง เชาวันนี้ ทุบเทน คุนเปลา ไดนําผูสนับสนุนติดอาวุธเดินทัพเขาสูลาซา โดยอางวาการปกครองของเราฉอฉลและไรความชอบธรรม และประกาศวา [ROOT.GetNameDef] จะดีกวาหากเปนสวนหนึ่งของวงอิทธิพล[FROM.GetAdjective] เราจะยอมตามขอเรียกรองของเขา หรือจะยืนหยัดสูเปนครั้งสุดทาย?"
 SEA_japan_foreign_policy.26.a: "บางทีเขาอาจพูดถูก"
 SEA_japan_foreign_policy.26.b: "ขับไลพวกมันออกไป!"

 SEA_japan_foreign_policy.27.t: "[FROM.GetNameDefCap] สนับสนุนการอางสิทธิ์แพน-มองโกล"
 SEA_japan_foreign_policy.27.desc: "ในที่สุดวันนั้นก็มาถึง วันที่เราจะเปดฉากการทัพและอางสิทธิ์เหนืออาณาจักรมองโกเลียนอก ซึ่งปจจุบันถูกปกครองโดย [MON.GetLeader] คนขลาดผูไรความชอบธรรม ถึงเวลาแสดงใหโลกเห็นแลววาจิตวิญญาณของเจงกิสขานยังคงอยู!"
 SEA_japan_foreign_policy.27.a: "เปนวันยิ่งใหญจริง ๆ"

 SEA_japan_foreign_policy.28.t: "[FROM.GetNameDefCap] มอบรัฐมองโกลให"
 SEA_japan_foreign_policy.28.desc: "หลังจากยึดครองดินแดนมองโกลอันชอบธรรมแลว เจาเหนือหัวของเรา [FROM.GetNameDef] ไดมอบการบริหารดินแดนเหลานั้นใหเราตามที่สัญญาไว เราซาบซึ้งอยางยิ่งในความไววางใจที่พวกเขามีตอเรา!"
 SEA_japan_foreign_policy.28.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.29.t: "ผลลัพธของการทัพสุยหยวน"
 SEA_japan_foreign_policy.29.desc: "การทัพสุยหยวนสิ้นสุดลงแลว และพรมแดนใหมก็ถูกขีดขึ้น นี่นาจะเปนครั้งสุดทายที่รัฐในอารักขาของเราจะพยายามรุกลํ้าเชนนี้ไดโดยที่รัฐบาลกลางจีนไมเขามารวม เพราะบัดนี้พวกเขาเฝาระวังการกระทําของเราในภูมิภาคนี้อยางเขมงวด"
 SEA_japan_foreign_policy.29.a: "อยางนอยตอนนี้เราก็มุงไปที่ดานอื่นได"

 SEA_japan_foreign_policy.30.t: "จุดจบของการทัพสุยหยวน"
 SEA_japan_foreign_policy.30.desc: "ในที่สุด การโจมตีอยางไมหยุดหยอนของ [JAP.GetNameDef] และรัฐในอารักขาอันโหดรายของพวกเขาก็ยุติลง และกองทหารของพวกเขากําลังกลับสูที่ตั้ง ไมมีใครรูวาสิ่งที่เกิดขึ้นในวันนี้จะถูกจารึกไวในประวัติศาสตรหรือไม แตอยางนอยรัฐบาลนานกิงก็ตระหนักถึงความทะเยอทะยานของ[JAP.GetAdjective]ในภูมิภาคนี้แลว"
 SEA_japan_foreign_policy.30.a: "จัดการภัยคุกคามไดอีกหนึ่ง"

 SEA_japan_foreign_policy.31.t: "กองกําลังนิยมญี่ปุนบุกโจมตีที่มั่นของเรา!"
 SEA_japan_foreign_policy.31.desc: "กองกําลังของ [MEN.GetNameDef] และกองทัพชอบธรรมมหาฮั่นไดบุกโจมตีที่มั่นของเราในสุยหยวน และดูเหมือนตั้งใจจะยึดไอมักมองโกเลียในที่อยูในความครอบครองของเรา เราจะปลอยใหพวกมันผานไปไมได!"
 SEA_japan_foreign_policy.31.a: "แสดงใหพวกมันเห็นวากําลังเจอกับใคร"

 SEA_japan_foreign_policy.32.t: "ญี่ปุนแสวงหาความรวมมือตอตานภัยคอมมิวนิสต"
 SEA_japan_foreign_policy.32.desc: "นักการทูต[FROM.GetAdjective]ไดกลับลํานโยบายตางประเทศแบบหนึ่งรอยแปดสิบองศา และบัดนี้แถลงวาตองการทํางานรวมกับเราอยางใกลชิดขึ้น โดยมีเงื่อนไขวาเราตองปราบปรามกระแสคอมมิวนิสตและตอตานญี่ปุน ขอตกลงนี้มีอะไรแปลก ๆ แตบางทีอาจคุมที่จะเสี่ยง?"
 SEA_japan_foreign_policy.32.a: "เราสัญญากับพวกเขาได"
 SEA_japan_foreign_policy.32.b: "เราจะไมทําขอตกลงใด ๆ กับ[JAP.GetAdjective]"
 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag: "จีนเลือกที่จะใหความรวมมือตามขอเรียกรองของเรา"

 SEA_japan_foreign_policy.33.t: "[FROM.GetLeader] ยอมรับขอเรียกรองของเรา"
 SEA_japan_foreign_policy.33.desc: "[FROM.GetLeader] ผูนําของ [FROM.GetNameDef] ไดยอมรับขอเสนอของเรา และสัญญาวาจะสั่งหามการประทวงตอตานรัฐของเรา พรอมเตรียมปราบปรามกิจกรรมคอมมิวนิสตภายในประเทศ อีกไมนานเราจะสามารถทําพันธมิตรกับพวกเขาอยางเปนทางการ เพื่อทําลายแผลเนาเปอยที่คุกคามจะนําพาชาวเอเชียทั้งปวงไปสูความพินาศที่ไมอาจหลีกหนีได"
 SEA_japan_foreign_policy.33.a: "กาวแรกไดเริ่มขึ้นแลว"

 SEA_japan_foreign_policy.34.t: "[FROM.GetLeader] ปฏิเสธขอเรียกรองของเรา"
 SEA_japan_foreign_policy.34.desc: "[FROM.GetLeader] ผูนําของ [FROM.GetNameDef] ไดตัดสินใจวาประชาชน[FROM.GetAdjective]ไมสมควรไดรับความปรานี โดยปฏิเสธขอเสนออันมีนํ้าใจของเรา และเทากับตัดสินใจแทนเราแลววาเราตองยุติชาติ[FROM.GetAdjective]ลง"
 SEA_japan_foreign_policy.34.a: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

 SEA_japan_foreign_policy.35.t: "[FROM.GetNameDefCap] เผยแพรกระแสนิยม[FROM.GetAdjective]"
 SEA_japan_foreign_policy.35.desc: "สถานีวิทยุหลายแหงบนชายฝงตะวันตกเริ่มกระจายเสียงโฆษณาชวนเชื่อของ[FROM.GetAdjective] เพื่อโนมนาวประชาชนของเราใหเขาขางพวกเขาในความขัดแยงเพื่อเอเชีย เราตองปดมันเสียกอนที่จะสรางความเสียหายมากเกินไป!"
 SEA_japan_foreign_policy.35.a: "บังอาจนัก!"

 SEA_japan_foreign_policy.36.t: "[FROM.GetNameDefCap] เผยแพรกระแสนิยม[FROM.GetAdjective]"
 SEA_japan_foreign_policy.36.desc: "สถานีวิทยุของ [FROM.GetNameDef] เริ่มกระจายเสียงโฆษณาชวนเชื่อนิยม[FROM.GetAdjective]ไปทั่วประเทศของเรา บัดนี้รัฐบาล[FROM.GetAdjective]ยังติดตอมาเสนอลงทุนในอุตสาหกรรมของเรา เพื่อแลกกับการที่เราอนุญาตใหสถานีวิทยุเหลานั้นเปดตอไป"
 SEA_japan_foreign_policy.36.a: "มิตรภาพของพวกเขาอาจเปนประโยชน"
 SEA_japan_foreign_policy.36.b: "ปราบปรามเรื่องไรสาระนี้เดี๋ยวนี้!"

 SEA_japan_foreign_policy.37.t: "[FROM.GetNameDefCap] ยอมใหอิทธิพลของเราแผขยาย"
 SEA_japan_foreign_policy.37.desc: "[FROM.GetLeader] ตัดสินใจยอมรับขอเสนอของเรา และจะอนุญาตใหสถานีวิทยุของเราเปดตอไปบนคลื่นวิทยุ[FROM.GetAdjective] พวกเขายังอนุญาตใหนักอุตสาหกรรมของเราไปเปดกิจการที่นั่นดวย"
 SEA_japan_foreign_policy.37.a: "เปนไปตามที่เราคาดไว"

 SEA_japan_foreign_policy.38.t: "[FROM.GetNameDefCap] สกัดกั้นการแผขยายอิทธิพลของเรา"
 SEA_japan_foreign_policy.38.desc: "[FROM.GetLeader] ตัดสินใจสกัดกั้นการแทรกแซงของเราใน [FROM.GetNameDef] โดยเห็นวาเอกราชของพวกเขามีคามากกวาภารกิจแพน-เอเชียอันศักดิ์สิทธิ์"
 SEA_japan_foreign_policy.38.a: "พวกเขารูดีวาชะตากรรมแบบใดรอพวกเขาอยู"

 SEA_japan_foreign_policy.39.t: "การลงทุนของ[FROM.GetAdjective]ในทรัพยากรธรรมชาติของเรา"
 SEA_japan_foreign_policy.39.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ไดตัดสินใจอนุมัติการลงทุนในทรัพยากรธรรมชาติของเรา และบริษัท[FROM.GetAdjective]ก็เริ่มตั้งฐานปฏิบัติการภายในพรมแดนของเราแลว"
 SEA_japan_foreign_policy.39.a: "ตองมีเจตนาแอบแฝงอยูเบื้องหลังแน ๆ"

 SEA_japan_foreign_policy.40.t: "ปญหาเรื่องความไพบูลยรวมกันแหงเอเชียตะวันออก"
 SEA_japan_foreign_policy.40.desc: "เมื่อวงไพบูลยรวมกันแหงมหาเอเชียตะวันออกถูกสถาปนาขึ้น ก็เกิดคําถามขึ้นมา เราจะมุงสูเปาหมายความไพบูลยของเอเชียตามที่สัญญาไว หรือจะเอาสิ่งที่เปนของเราโดยชอบธรรมและยืนยันการควบคุมเหนือเอเชียอยางตรงไปตรงมากวานี้?"
 SEA_japan_foreign_policy.40.a: "พระราชอํานาจสูงสุดขององคจักรพรรดิตองมากอนเสมอ!"
 SEA_japan_foreign_policy.40.b: "เราตองแสวงหาความไพบูลยใหแกทุกรัฐในเอเชีย!"

 SEA_japan_foreign_policy.41.t: "เซ็มบุ"
 SEA_japan_foreign_policy.41.desc: "เซ็มบุถูกจัดตั้งขึ้นเพื่อเพิ่มการควบคุมเหนือดินแดนบนภาคพื้นทวีปของเรา และเริ่มพยายามเพิ่มการยอมรับปกครองในดินแดนที่เรายึดครอง บางทีอาจถึงเวลามอบหนาที่ดานการบริหารใหมากขึ้นและใชงานพวกเขาอยางเหมาะสม?"
 SEA_japan_foreign_policy.41.a: "เราควรใชยุทธศาสตรนี้ทันที!"
 SEA_japan_foreign_policy.41.b: "การรอกอนตัดสินใจนาจะเปนทางที่ฉลาด"
 apply_senbu_law_tt: "ใชกฎหมายการยึดครอง§Yเซ็มบุ§!กับดินแดนที่ยึดครองทั้งหมดที่เขาเงื่อนไข"

 SEA_japan_foreign_policy.42.t: "พันธมิตรจีน-ญี่ปุน"
 SEA_japan_foreign_policy.42.desc: "[FROM.GetLeader] ไดประกาศวาชาติของเราทั้งสองมีชะตากรรมรวมกัน และมีเพียงการเดินเคียงขางกันเทานั้นที่เราจะกําจัดภัยคอมมิวนิสตได ดวยเหตุนี้ จึงมีการยื่นขอเสนอพันธมิตรมาใหเรา แมเงื่อนไขดูเหมือนจะระบุวาเปนเพียงการชั่วคราว เราควรยอมรับขอเสนอของพวกเขาหรือไม?"
 SEA_japan_foreign_policy.42.a: "เปนประโยชนสูงสุดของเรา"
 SEA_japan_foreign_policy.42.b: "มีกลิ่นไมชอบมาพากล"

 SEA_japan_foreign_policy.43.t: "[FROM.GetLeader] ลงนามในกติกาสัญญา"
 SEA_japan_foreign_policy.43.desc: "ประชาชนของเราตางยินดีปรีดา เมื่อชาติ[FROM.GetAdjective]ไดรวมจับอาวุธกับเราตอตานภัยคุกคามสูงสุดตอเสถียรภาพของเอเชีย นั่นคือพวกคอมมิวนิสต แมกติกาสัญญานี้จะเปนเพียงการชั่วคราว แตยอมนําประโยชนมหาศาลมาสูเราแนนอน"
 SEA_japan_foreign_policy.43.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.44.t: "[FROM.GetLeader] ปฏิเสธที่จะลงนามในกติกาสัญญา"
 SEA_japan_foreign_policy.44.desc: "อยางโงเขลา [FROM.GetLeader] แหง [FROM.GetNameDef] ไดตัดสินใจกระทําการอยางไรเกียรติ ปฏิเสธขอเสนออันยิ่งใหญของเรา พันธมิตรถูกยกเลิก และกองทัพคันโตก็เริ่มจับตามองจีนตอนเหนืออีกครั้ง บางทีสิ่งที่จําเปนในตอนนี้คือการปรับนโยบายตางประเทศของเราใหม"
 SEA_japan_foreign_policy.44.a: "ไมมีอะไรที่ทําได"

 SEA_japan_foreign_policy.45.t: "[FROM.GetNameDefCap] เรียกรองการผนวกรวมทางเศรษฐกิจ"
 SEA_japan_foreign_policy.45.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้เพื่อยื่นขอเสนอ พวกเขาตองการใหเราเพิ่มกิจกรรมทางเศรษฐกิจรวมกันและผนวกรวมกับพวกเขามากขึ้น ซึ่งจะชวยเศรษฐกิจของเราไดอยางมาก แตทั้งหมดนี้มีกลิ่นไมชอบมาพากลอยู..."
 SEA_japan_foreign_policy.45.a: "ดีเกินกวาจะปลอยผาน"
 SEA_japan_foreign_policy.45.b: "เราจะไมยอมสละเอกราชทางเศรษฐกิจของเรา!"

 SEA_japan_foreign_policy.46.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเรา"
 SEA_japan_foreign_policy.46.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ไดตอบรับขอเสนอของเราดวยดี และนักการทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนตอการผนวกรวมทางเศรษฐกิจที่ลึกซึ้งยิ่งขึ้น"
 SEA_japan_foreign_policy.46.a: "เราขอบคุณในความไรเดียงสาของพวกเขา"

 SEA_japan_foreign_policy.47.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 SEA_japan_foreign_policy.47.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ตอบคําเชิญใหผนวกรวมของเราดวยความไมพอใจอยางยิ่ง และยืนยันวาความเปนหุนสวนทางเศรษฐกิจที่ใกลชิดขึ้นในรูปแบบใด ๆ ระหวางประเทศของเราไมอยูในการพิจารณาและจะไมมีวันเกิดขึ้น บางทีพวกเขาอาจมองออกวาเราเตรียมอะไรไวให..."
 SEA_japan_foreign_policy.47.a: "ขาวรายจริง ๆ..."

 SEA_japan_foreign_policy.48.t: "[FROM.GetNameDefCap] พัฒนาอุตสาหกรรมของเรา"
 SEA_japan_foreign_policy.48.desc: "นักอุตสาหกรรมของ [FROM.GetNameDef] เริ่มพัฒนาอุตสาหกรรมทองถิ่นของเราและตั้งบริษัทใหมภายในพรมแดนของเรา สิ่งนี้ยอมนําเราเขาใกลความรุงเรืองยิ่งขึ้น"
 SEA_japan_foreign_policy.48.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.49.t: "การประกาศสถาปนารัฐบาลปฏิรูป"
 SEA_japan_foreign_policy.49.desc: "ในการประกาศที่เซี่ยงไฮวันนี้ [ROOT.GetLeader] พรอมดวยนายพลและผูบริหารที่กองทัพบกจักรวรรดิสงมา ไดประกาศกอตั้งรัฐบาลจีนชุดใหม ทางเลือกที่ดีกวาอาณาจักรศักดินาอันฉอฉลของกกมินตั๋ง สาธารณรัฐจีนจงเจริญ!"
 SEA_japan_foreign_policy.49.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.50.t: "[FROM.GetNameDefCap] เรียกรองการผนวกรวมอยางสมบูรณ"
 SEA_japan_foreign_policy.50.desc: "การผนวกรวมเศรษฐกิจไมเพียงพอที่จะทําใหชาว[FROM.GetAdjective]พอใจ เมื่อวันนี้ [FROM.GetLeader] แหง [FROM.GetNameDef] ไดเรียกรองใหเราผนวกรวมเขากับชาติของพวกเขาอยางสมบูรณ หากเราไมแยกตัวจากพวกเขาทันที นี่จะเปนจุดจบของสถานะชาติเอกราชของเรา เราจะรับมืออยางไร?"
 SEA_japan_foreign_policy.50.a: "เราคงตองยอมรับสถานการณ"
 SEA_japan_foreign_policy.50.b: "ชัยชนะหรือความตาย!"

 SEA_japan_foreign_policy.51.t: "[FROM.GetNameDefCap] ยอมรับการผนวกรวมอยางสมบูรณ"
 SEA_japan_foreign_policy.51.desc: "ขาวอันนายินดีที่ผูนําใน [FROM.GetNameDef] ยอมรับการผนวกรวมเขากับชาติของเรา ไดรับเสียงปรบมือกึกกองในสภาไดเอ็ตแหงชาติเมื่อชวงตนวันนี้ สิ่งที่เราเสนอใหไดนั้นเพียงพออยางชัดเจนที่ทําใหพวกเขาเห็นวาขอเสนอนี้คุมคา แมจะตองสิ้นสุดอธิปไตยของตน"
 SEA_japan_foreign_policy.51.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.52.t: "[FROM.GetNameDefCap] ปฏิเสธการผนวกรวมอยางสมบูรณ"
 SEA_japan_foreign_policy.52.desc: "แมจะมีขอดีอยางเห็นไดชัด และเปนสิ่งที่ดีที่สุดสําหรับอนาคตของเอเชียอยางชัดเจน แต [FROM.GetNameDef] ก็ปฏิเสธคําขออันมีไมตรีของเราในการผนวกรวมอยางสมบูรณ เราไดแตคาดเดาถึงเหตุผลของพวกเขา แตดูเหมือนพวกเขาอาจไมไดคํานึงถึงผลประโยชนสูงสุดของภูมิภาค"
 SEA_japan_foreign_policy.52.a: "พวกเขาเปนภัยตอเอกภาพของเอเชีย!"
 SEA_japan_foreign_policy.52.b: "เราจะจับตาดูพวกเขาอยางใกลชิด.."

 SEA_japan_foreign_policy.53.t: "พบผูบอนทําลายในไอมักฮันเค็นตีอูลิน"
 SEA_japan_foreign_policy.53.desc: "พบสายลับที่ตองสงสัยวาทํางานตามคําสั่งของ[FROM.GetAdjective]ภายในพรมแดนของเรา ดูเหมือนพยายามติดตอกับขุนนาง และลอลวงพลเมืองของเราดวยคําสัญญาอันยิ่งใหญเรื่องความไพบูลยรวมกัน ดูเหมือนพวกเขามีแผนการสําหรับประชาชนมองโกเลีย"
 SEA_japan_foreign_policy.53.a: "เราตองระวังตัว!"

 SEA_japan_foreign_policy.54.t: "อาวุธ[FROM.GetAdjective]ทะลักเขาสูตลาดมืด"
 SEA_japan_foreign_policy.54.desc: "เมื่อไมนานมานี้ ดูเหมือนอาวุธของ [FROM.GetNameDef] ไดทะลักเขาสูตลาดมืดของเรา หลายชิ้นตกไปถึงมือผูเห็นตางและผูบอนทําลายภายในพรมแดนของเรา ดูเหมือนพวกเขาอาจแคตองการบอนทําลายเสถียรภาพของเรา หรือที่เลวรายกวานั้น คือโคนลมรัฐบาลของเรา!"
 SEA_japan_foreign_policy.54.a: "พวกเขากําลังติดอาวุธใหผูเห็นตางทางการเมือง!"

 SEA_japan_foreign_policy.55.t: "ขาวลือการรุกลํ้าจากมองโกเลียใน"
 SEA_japan_foreign_policy.55.desc: "พบกองกําลังของกองทัพมองโกเลียในกําลังรวมพลที่ชายแดนดานใตของเรา ดูเหมือนพวกเขาอาจกําลังเตรียมรุกลํ้าเขามาในดินแดนของเรา แมเปาหมายที่แนชัดจะยังไมแนนอน"
 SEA_japan_foreign_policy.55.a: "ถึงเวลาสูตายแลว เตรียมรับสิ่งเลวรายที่สุด!"

 SEA_japan_foreign_policy.56.t: "พบกองโจรแมนจูเรียทางตะวันออก"
 SEA_japan_foreign_policy.56.desc: "พบกองโจรแมนจูเรียนอกเมืองบายันทูเมน รวมถึงในสวนอื่น ๆ ของภูมิภาคตะวันออกของเรา ตอนนี้พวกเขายังไมรายไปกวาโจรธรรมดา แตเมื่อเวลาผานไปพวกเขาจะกลายเปนปญหาจริงจัง"
 SEA_japan_foreign_policy.56.a: "ถึงเวลาสูตายแลว เตรียมรับสิ่งเลวรายที่สุด!"

 SEA_japan_foreign_policy.57.t: "แรงกดดันจาก[FROM.GetAdjective]ใหยอมสยบ"
 SEA_japan_foreign_policy.57.desc: "เมื่อชวงตนวันนี้ รัฐบาล[FROM.GetAdjective]ไดยื่นคําขาดแกเรา พวกเขาเรียกรองใหเรายอมสยบหากไมอยากใหชาติของเราถูกทําลาย แตเรารูดีวาพวกเขาเตรียมอะไรไวใหเรา บางทีการตอตานพวกเขาอาจเปนประโยชนสูงสุดของเรา?"
 SEA_japan_foreign_policy.57.a: "เราสูพวกเขาไมได"
 SEA_japan_foreign_policy.57.b: "เราตองปกปองการปฏิวัติ!"
 MON_japan_starts_a_popular_civil_war_tt: "ญี่ปุนจะปลุกสงครามกลางเมืองของประชาชนตอตานรัฐบาลของเรา และมีแนวโนมจะเขาแทรกแซงเขาขางฝายนั้น"

 SEA_japan_foreign_policy.58.t: "[FROM.GetNameDefCap] มอบรัฐจีนให"
 SEA_japan_foreign_policy.58.desc: "เจาเหนือหัว[FROM.GetAdjective]ของเราไดมอบการบริหารรัฐหลายแหงที่เคยอยูในการควบคุมของกกมินตั๋งใหแกเรา และขอใหเราเริ่มเตรียมการผนวกรวมดินแดนเหลานี้เขากับรัฐของเราอยางเหมาะสม เราจะไมทําใหพวกเขาผิดหวัง!"
 SEA_japan_foreign_policy.58.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.59.t: "การประกาศสถาปนารัฐพมา"
 SEA_japan_foreign_policy.59.desc: "เมื่อชวงตนวันนี้ [ROOT.GetLeader] และผูนํากองทัพ[JAP.GetAdjective]หลายคนไดรวมกันประกาศสถาปนารัฐ[ROOT.GetAdjective]ใหม เราจะยืนหยัดอยางผูมีชัยเหนือศัตรูทั้งปวง!"
 SEA_japan_foreign_policy.59.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.60.t: "ญี่ปุนสถาปนารัฐพมา"
 SEA_japan_foreign_policy.60.desc: "[JAP.GetLeader]ไดประกาศสถาปนารัฐ[ROOT.GetAdjective]แหงใหม ซึ่งเปนปฏิปกษตอเราและแนวทางปจจุบันของเรา ดูเหมือนวาพวกเขาพรอมจะสูเพื่อเอกราชจากเรา และจะไมยอมแพโดยงาย!"
 SEA_japan_foreign_policy.60.a: "ตีโตพวกมันกลับไป ทําลายพวกทรยศใหสิ้น!"
 SEA_japan_foreign_policy.60.b: "เราตองเขารวมกับพวกเขา ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.61.t: "การทรยศของวังจิงเวย"
 SEA_japan_foreign_policy.61.desc: "วังจิงเวยผูทรยศถูกพบเห็นขณะออกจากบานพักเมื่อสัปดาหที่แลว และเดินทางไปยังจุดหมายที่ไมมีใครรู เมื่อมองยอนกลับไปก็ดูเปนเรื่องที่หลีกเลี่ยงไมได เพราะเขาไมพอใจนโยบายของ[ROOT.GetLeader] อยางไรก็ตาม จะไมมีใครคิดถึงเขา"
 SEA_japan_foreign_policy.61.a: "คาดเดาไดอยูแลว"
 SEA_japan_foreign_policy.61.b: "บางทีเขาอาจจะพูดถูก..."

 SEA_japan_foreign_policy.62.t: "วังจิงเวยแปรพักตร"
 SEA_japan_foreign_policy.62.desc: "วังจิงเวย อดีตสมาชิกระดับสูงของกกมินตั๋ง ไดเดินทางมาถึงเซี่ยงไฮและตองการทํางานรวมกับเรา ดวยตําแหนงและความนิยมของเขา การมอบตําแหนงสําคัญในรัฐบาลใหเขาอาจเปนเรื่องฉลาด เพราะเขาอาจนําพาเราไดเปนอยางดี"
 SEA_japan_foreign_policy.62.a: "เขาจะเปนผูนําที่เขมแข็ง"
 SEA_japan_foreign_policy.62.b: "ซุนเตี้ยนอิงมีความสามารถมากกวา"

 SEA_japan_foreign_policy.63.t: "การรวมเขากับ[RNG.GetNameDef]"
 SEA_japan_foreign_policy.63.desc: "[JAP.GetLeader]เรียกรองใหเรารวมรัฐบาลเขากับ[RNG.GetNameDef] ซึ่งจะยุติความเปนอิสระของเรา และมอบตําแหนงระดับสูงในรัฐบาล[RNG.GetAdjective]ใหแกผูนําของเรา เราจะยอมรับขอเสนอนี้หรือไม?"
 SEA_japan_foreign_policy.63.a: "[ROOT.GetLeader]จะไดตําแหนงที่ดี เราจึงยอมรับ"
 SEA_japan_foreign_policy.63.b: "นั่นจะเปนจุดจบของอํานาจปกครองตนเองของเรา ไม!"

 SEA_japan_foreign_policy.64.t: "[FROM.GetNameDefCap]รวมเขากับเรา"
 SEA_japan_foreign_policy.64.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ไดยอมรับขอเสนอของ[JAP.GetAdjective]ที่จะรวมเขากับรัฐบาลของเรา และดินแดน[FROM.GetAdjective]ทั้งหมดก็อยูภายใตเขตอํานาจของเราแลว นี่คือวันอันยิ่งใหญของเรา!"
 SEA_japan_foreign_policy.64.a: "เราเขาใจวาทําไมพวกเขาถึงยอมรับ"

 SEA_japan_foreign_policy.65.t: "[FROM.GetNameDefCap]ปฏิเสธการรวมชาติ"
 SEA_japan_foreign_policy.65.desc: "[FROM.GetLeader]ผูมีความคิดตื้นเขินไมยอมฟงเหตุผล และปฏิเสธขอเสนอของเราที่จะรวมเขากับ[RNG.GetNameDef] บางทีอาจตองมีขอเสนอที่ดีกวานี้ หรือแมแตการขมขูในปริมาณที่เหมาะสม"
 SEA_japan_foreign_policy.65.a: "ไมชาก็เร็วพวกเขาจะยอมรับ.."

 SEA_japan_foreign_policy.66.t: "การประกาศสถาปนารัฐบาลเฉพาะกาลแหงอินเดียเสรี"
 SEA_japan_foreign_policy.66.desc: "เมื่อชวงเชาวันนี้ [ROOT.GetLeader]และผูนํากองทัพ[JAP.GetAdjective]หลายทานไดรวมกันออกประกาศ สถาปนารัฐ[ROOT.GetAdjective]แหงใหม เราจะยืนหยัดอยางผูมีชัยเหนือศัตรูทั้งปวง!"
 SEA_japan_foreign_policy.66.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.67.t: "ญี่ปุนสถาปนารัฐบาลเฉพาะกาลแหงอินเดียเสรี"
 SEA_japan_foreign_policy.67.desc: "[JAP.GetLeader]ไดประกาศสถาปนารัฐ[ROOT.GetAdjective]แหงใหม ซึ่งเปนปฏิปกษตอเราและแนวทางปจจุบันของเรา ดูเหมือนวาพวกเขาพรอมจะสูเพื่อเอกราชจากเรา และจะไมยอมแพโดยงาย!"
 SEA_japan_foreign_policy.67.a: "ตีโตพวกมันกลับไป ทําลายพวกทรยศใหสิ้น!"
 SEA_japan_foreign_policy.67.b: "เราตองเขารวมกับพวกเขา ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.68.t: "การประกาศสถาปนาสาธารณรัฐฟลิปปนสที่สอง"
 SEA_japan_foreign_policy.68.desc: "เมื่อชวงเชาวันนี้ [ROOT.GetLeader]และผูนํากองทัพ[JAP.GetAdjective]หลายทานไดรวมกันออกประกาศ สถาปนารัฐ[ROOT.GetAdjective]แหงใหม เราจะยืนหยัดอยางผูมีชัยเหนือศัตรูทั้งปวง!"
 SEA_japan_foreign_policy.68.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.69.t: "ญี่ปุนสถาปนาสาธารณรัฐฟลิปปนสที่สอง"
 SEA_japan_foreign_policy.69.desc: "[JAP.GetLeader]ไดประกาศสถาปนารัฐ[ROOT.GetAdjective]แหงใหม ซึ่งเปนปฏิปกษตอเราและแนวทางปจจุบันของเรา ดูเหมือนวาพวกเขาพรอมจะสูเพื่อเอกราชจากเรา และจะไมยอมแพโดยงาย!"
 SEA_japan_foreign_policy.69.a: "ตีโตพวกมันกลับไป ทําลายพวกทรยศใหสิ้น!"
 SEA_japan_foreign_policy.69.b: "เราตองเขารวมกับพวกเขา ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.70.t: "ญี่ปุนเรียกรองใหเรายอมจํานนแบบมีเงื่อนไข"
 SEA_japan_foreign_policy.70.desc: "นักการทูต[FROM.GetAdjective]ไดยื่นคําขาดตอเรา เรียกรองใหเราปกปนพรมแดนดานตะวันออกใหม และลงนามสันติภาพแบบมีเงื่อนไขกับพวกเขา ซึ่งโดยเนื้อแทคือการละทิ้งกิจการในเอเชีย สิ่งนี้จะทําใหเราทุมเทความพยายามทั้งหมดไปที่การกอบกูดินแดนในยุโรปคืน และบางทีอาจกลับมายึดตะวันออกคืนไดเมื่อศัตรูอื่น ๆ ของเราลมสลายหมดแลว"
 SEA_japan_foreign_policy.70.a: "เราจะไมมีวันยอมจํานน!"
 SEA_japan_foreign_policy.70.b: "นั่นจะทําใหศัตรูหลุดจากหลังเราไปหนึ่งราย"

 SEA_japan_foreign_policy.71.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะยอมจํานน"
 SEA_japan_foreign_policy.71.desc: "พวกโงเขลาในมอสโกปฏิเสธที่จะยอมจํานนตอขอเรียกรองเบื้องตนของเรา นี่หมายถึงการทําลายลางรัฐของพวกมันใหสิ้นซาก และการปรับพรมแดนที่มากยิ่งกวาที่วางแผนไวในตอนแรก!"
 SEA_japan_foreign_policy.71.a: "พวกมันจะลมลงดวยคมดาบของเรา!"

 SEA_japan_foreign_policy.72.t: "[FROM.GetNameDefCap]ยอมยกดินแดนตะวันออก"
 SEA_japan_foreign_policy.72.desc: "นักการทูตที่เปนตัวแทนของ[FROM.GetLeader]ไดยอมรับขอเรียกรองของเราอยางหมดทา และกําลังยกดินแดนไซบีเรียของพวกเขาใหแกเรา วันนี้คือวันอันยิ่งใหญของจักรวรรดิ!"
 SEA_japan_foreign_policy.72.a: "วันนี้เราไดรับชัยชนะ!"

 SEA_japan_foreign_policy.73.t: "[SOV.GetNameDefCap]ถอนตัวจากไซบีเรีย"
 SEA_japan_foreign_policy.73.desc: "พันธมิตรของเราไดถอนตัวจากเอเชียตะวันออก ยอมจํานนตอขอเรียกรองของ[JAP.GetNameDef] สิ่งนี้ทําใหเราตกอยูในสถานะที่เปราะบางอยางยิ่ง เราจะแสวงหาพันธมิตรใหม หรือจะสูรบกับฝาย[JAP.GetAdjective]ตอไป?"
 SEA_japan_foreign_policy.73.a: "พวกเขาทอดทิ้งเรา..."
 SEA_japan_foreign_policy.73.b: "ถาเชนนั้นเราตองขอความคุมครองจากญี่ปุนแทน!"

 SEA_japan_foreign_policy.74.t: "[FROM.GetNameDefCap]ขอความคุมครองจากเรา"
 SEA_japan_foreign_policy.74.desc: "[FROM.GetLeader] ผูนําแหง[FROM.GetNameDef] ผิดหวังกับการทรยศอยางโจงแจงของพันธมิตรเกาของ[FROM.GetName] จึงไดติดตอมาขอใหเรารับบทบาทใหมในฐานะผูคุมครองดินแดนและประชาชนของพวกเขา เราจะตอบรับหรือไม?"
 SEA_japan_foreign_policy.74.a: "ก็ได"
 SEA_japan_foreign_policy.74.b: "เราไมตองการพวกเขา"

 SEA_japan_foreign_policy.75.t: "ยุทโธปกรณจาก[FROM.GetAdjective]มาถึงแลว"
 SEA_japan_foreign_policy.75.desc: "ดูเหมือนวาผูติดตอของเราใน[FROM.GetNameDef]จะสามารถทําขอตกลงกับผูนําของประเทศไดในที่สุด หลังจากที่กลุมโคโดฮะ ซึ่งเปนที่อยูของผูติดตอสวนใหญของเรา ไดยึดอํานาจรัฐบาลเมื่อไมนานมานี้ดวยรัฐประหารที่ประสบความสําเร็จ จักรพรรดิทั้งสองจงทรงพระเจริญ!"
 SEA_japan_foreign_policy.75.a: "เราซาบซึ้งใจอยางยิ่ง!"

 SEA_japan_foreign_policy.76.t: "[FROM.GetNameDefCap]เรียกรองการผนวกรวมอยางสมบูรณ"
 SEA_japan_foreign_policy.76.desc: "[FROM.GetLeader]ประกาศวา เนื่องจากภาวะฉุกเฉินที่ประกาศขึ้นหลังรัฐประหารของโคโดฮะ และความเปนไปไดที่นายทหารผูเห็นตางจะหลบซอนอยูในเขตปกครองของเรา เราควรกลายเปนสวนหนึ่งที่ผนวกรวมของชาติ ซึ่งจะทําใหรัฐ[FROM.GetAdjective]ปกครองไดอยางเต็มที่ เราจะยอมรับหรือไม?"
 SEA_japan_foreign_policy.76.a: "เราจําตองยอมรับสถานการณ"
 SEA_japan_foreign_policy.76.b: "พวกเขาคิดวาตัวเองสูงสงเกินไปแลว"

 SEA_japan_foreign_policy.77.t: "[FROM.GetNameDefCap]ยอมรับการผนวกรวมโดยสมบูรณ"
 SEA_japan_foreign_policy.77.desc: "[FROM.GetLeader] ขาหลวงของเราประจํา[FROM.GetNameDef] ไดยอมรับการผนวกรวมเขากับชาติของเราอยางสมบูรณเมื่อชวงเชาวันนี้ หมายความวาในที่สุดรัฐบาลของเราก็สามารถควบคุมไดอยางเต็มที่ แมกระทั่งเขตการปกครองทองถิ่นในภูมิภาคเกาหลีของเรา"
 SEA_japan_foreign_policy.77.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.78.t: "[FROM.GetNameDefCap]ปฏิเสธการผนวกรวมโดยสมบูรณ"
 SEA_japan_foreign_policy.78.desc: "แมจะมีขอดีอยางเห็นไดชัด และเปนสิ่งที่ดีที่สุดสําหรับอนาคตของชาติอยางแนนอน แต[FROM.GetLeader] ขาหลวงแหง[FROM.GetNameDef] ก็ไดปฏิเสธคําขอใหผนวกรวมโดยสมบูรณของเรา เราไดแตคาดเดาถึงเหตุผล แตดูเหมือนวาพวกเขาอาจไมไดคํานึงถึงผลประโยชนสูงสุดของชาติ"
 SEA_japan_foreign_policy.78.a: "เราตองการคนที่ไวใจไดมากกวานี้มาคุมอํานาจ!"
 SEA_japan_foreign_policy.78.b: "เราจะเคารพความปรารถนาของพวกเขา ในตอนนี้..."

 SEA_japan_foreign_policy.79.t: "[FROM.GetNameDefCap]ตองการการผนวกรวมที่ใกลชิดยิ่งขึ้น"
 SEA_japan_foreign_policy.79.desc: "[FROM.GetLeader]ไดยื่นขอเสนอตอเรา โดยอางวาเปนประโยชนสูงสุดตอประชากรของทั้งสองฝาย คําขอนี้คือใหชาติของเรากลายเปนสวนหนึ่งที่ผนวกรวมของ[FROM.GetNameDef]เมื่อถึงเวลาอันควร ยุติอํานาจปกครองตนเองของเรา และทําใหเราเปนดินแดนหลักของอาณาจักรพวกเขา สิ่งนี้เปนประโยชนตอเราจริงหรือ?"
 SEA_japan_foreign_policy.79.a: "ใช สิ่งนี้จะเปนประโยชนตอเรา"
 SEA_japan_foreign_policy.79.b: "ไม! ชะตากรรมของแมนจูเรียอยูที่อื่น!"
 MAN_we_can_be_annexed_by_kodoha_tt: "เราจะสามารถถูก§Rผนวก§!โดย[JAP.GetNameDef]ในอนาคตอันใกล!"

 SEA_japan_foreign_policy.80.t: "สมาคมเซี่ยเหอ (สมาคมสมานฉันท)ตกลง"
 SEA_japan_foreign_policy.80.desc: "สมาคมเซี่ยเหอ (สมาคมสมานฉันท) ชนชั้นนําผูปกครองใน[FROM.GetNameDef] ไดตกลงตามขอเสนอของเรา และพรอมที่จะบริหารภูมิภาคนี้ในฐานะสวนหนึ่งที่แยกไมไดของอาณาจักรเราในอนาคตอันใกล ดูเหมือนวาแผนการรวมชาติของเราจะดําเนินไปไดอยางราบรื่น"
 SEA_japan_foreign_policy.80.a: "ก็ได"

 SEA_japan_foreign_policy.81.t: "สมาคมเซี่ยเหอ (สมาคมสมานฉันท)ตอตานเรา"
 SEA_japan_foreign_policy.81.desc: "สมาคมเซี่ยเหอ (สมาคมสมานฉันท) ชนชั้นนําผูปกครองใน[FROM.GetNameDef] ไดตัดสินใจปฏิเสธขอเสนอของเรา โดยอางวาพวกเขาไมไดประโยชนจากการผนวกรวมเขากับชาติของเรา บางทีพวกเขาอาจถูกชักจูงโดยผูเห็นตางชาวแมนจูหรือพวกคอมมิวนิสต แตนาเสียดายที่นี่ไมใชการตัดสินใจที่เราจะพลิกกลับไดงายนัก..."
 SEA_japan_foreign_policy.81.a: "เราจะจัดการกับพวกเขาทีหลัง"
 SEA_japan_foreign_policy.81.b: "ถานั่นคือความปรารถนาของพวกเขา.."

 SEA_japan_foreign_policy.82.t: "[FROM.GetNameDefCap]แสวงหาความรวมมือตอตานโซเวียต"
 SEA_japan_foreign_policy.82.desc: "มิตรเกาแกทางประวัติศาสตรของเราในชาติตะวันออกไกลอยาง[FROM.GetName]ไดยื่นขอเสนอที่นาดึงดูดมาให ดวยสายสัมพันธทางประวัติศาสตรและความไมไววางใจที่เรามีรวมกันตอรัฐ[SOV.GetAdjective] พวกเขาจึงเสนอกติกาทางทหารที่ระบุวาหากฝายใดฝายหนึ่งเขาสูสงครามกับ[SOV.GetNameDef] อีกฝายก็จะเขารวมดวย นี่เปนโอกาสที่ดีเกินกวาจะปลอยผานไปใชหรือไม?"
 SEA_japan_foreign_policy.82.a: "ทําไดทุกอยางเพื่อมิตรชาว[FROM.GetAdjective]ของเรา!"
 SEA_japan_foreign_policy.82.b: "สิ่งนี้ทําใหเราตกอยูในอันตรายมากเกินไป"

 SEA_japan_foreign_policy.83.t: "[FROM.GetLeader]ลงนามในกติกา"
 SEA_japan_foreign_policy.83.desc: "มิตรผูยิ่งใหญของเราใน[FROM.GetNameDef]ไดตอบรับขอเสนอของเราอยางเต็มใจ ในการจัดตั้งกติการวมตอตาน[SOV.GetAdjective] ผูแทนกําลังลงนามในเอกสารที่จําเปนเพื่อใหขอตกลงเปนจริงในขณะนี้ และการเตรียมการสําหรับการบุก[SOV.GetNameDef]อยางรวดเร็วหากจําเปนก็กําลังดําเนินอยูเชนกัน"
 SEA_japan_foreign_policy.83.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.84.t: "[FROM.GetLeader]ปดตกกติกา"
 SEA_japan_foreign_policy.84.desc: "นาเสียดายที่แมเราจะพยายามปรับปรุงความสัมพันธระหวางสองชาติมาโดยตลอด [FROM.GetLeader]ก็ไดปฏิเสธขอเสนอของเราสําหรับกติการวมตอตาน[SOV.GetAdjective] โดยระบุวาเปนอันตรายเกินไปสําหรับชาติ[FROM.GetAdjective]หากสายลับ[SOV.GetAdjective]คนพบกติกานี้"
 SEA_japan_foreign_policy.84.a: "บางทีการโดดเดี่ยวตัวเองอีกครั้งอาจเปนประโยชนตอเรา..."

 SEA_japan_foreign_policy.85.t: "เรียกสมาชิกกติกาเขาสูสงคราม"
 SEA_japan_foreign_policy.85.d: "ตามที่เราคาดไวตอนลงนามในกติกาตอตานโซเวียต บัดนี้เราพบวาตนเองอยูในภาวะสงครามกับสหภาพโซเวียต ถึงเวลาแลวที่ผูรวมลงนามจะตองรักษาคํามั่นและเขารวมกับเรา"
 SEA_japan_foreign_policy.85.a: "การมองการณไกลของเราใหผลตอบแทนแลว"

 SEA_japan_foreign_policy.86.t: "[From.GetNameDefCap]เรียกสมาชิกกติกาเขาสูสงคราม"
 SEA_japan_foreign_policy.86.desc: "กติกาตอตานโซเวียตโปแลนด-ญี่ปุนกําหนดใหผูลงนามทุกฝายตองเขารวมในความขัดแยงเชิงปองกันใด ๆ กับสหภาพโซเวียต บัดนี้[From.GetName]ถูกโซเวียตโจมตีและไดสงคํารองใหสมาชิกกติกาทุกชาติรีบมาชวยเหลือในทันที ถึงเวลาแลวที่จะแสดงความมุงมั่นของชาว[Root.GetAdjective]ในการปกปองโลกจากภัยคุกคามของสหภาพโซเวียตใหสิ้นซากเสียที"
 SEA_japan_foreign_policy.86.a: "[From.GetNameDefCap]ไมไดยืนหยัดอยูโดดเดี่ยว!"
 SEA_japan_foreign_policy.86.b: "นี่ไมใชสงครามของเรา"
 SEA_japan_foreign_policy.86.b_tt: "§Yทุกประเทศที่ยึดมั่นในกติกาจะมองวานี่เปนการทรยศ (§!§R-50§!§Y ความคิดเห็น)§!"

 SEA_japan_foreign_policy.87.t: "การผนวกโดย[FROM.GetAdjective]"
 SEA_japan_foreign_policy.87.desc: "หลังจากสมาคมเซี่ยเหอ (สมาคมสมานฉันท)ตกลงตามขอเรียกรองของโคโดฮะเมื่อไมนานมานี้ ก็เปนเพียงเรื่องของเวลาเทานั้นที่สิ่งนี้จะเกิดขึ้น วันนี้ คณะผูแทน[FROM.GetAdjective]เดินทางมาพรอมเอกสารเพื่อดําเนินการผนวกรวมเราเขากับชาติของพวกเขาอยางสมบูรณ ซึ่งผูแทนของเราไดลงนามไปแลว"
 SEA_japan_foreign_policy.87.a: "นี่คือสิ่งที่เราลงนามยินยอมไว"

 SEA_japan_foreign_policy.88.t: "การผนวก[FROM.GetNameDef]"
 SEA_japan_foreign_policy.88.desc: "[FROM.GetLeader] ผูนําแหง[FROM.GetNameDef] ไดยอมรับการผนวกรวมเขากับชาติของเราอยางสมบูรณเมื่อชวงเชาวันนี้ หมายความวาในที่สุดรัฐบาลของเราก็สามารถควบคุมไดอยางเต็มที่ แมกระทั่งเขตการปกครองทองถิ่นในภูมิภาคแมนจูเรียของเรา"
 SEA_japan_foreign_policy.88.a: "ดีเยี่ยม"

 SEA_japan_foreign_policy.89.t: "ชาว[FROM.GetAdjective]เสนออุตสาหกรรมแลกทรัพยากร"
 SEA_japan_foreign_policy.89.desc: "เราไดรับขอเสนอจาก[FROM.GetNameDef] พวกเขาสนใจการคาทรัพยากรระยะยาว เพื่อแลกกับกําลังการผลิตทางอุตสาหกรรมบางสวนของพวกเขา ขณะนี้พวกเขาหมายตาทรัพยากรจํานวนหนึ่งใน[FROM.FROM.GetName]"
 SEA_japan_foreign_policy.89.a: "ทําไมจะไมละ?"
 SEA_japan_foreign_policy.89.b: "นี่ไมใชเวลาที่เหมาะสม"

 SEA_japan_foreign_policy.90.t: "[FROM.GetAdjective]ตกลงการคาอุตสาหกรรม"
 SEA_japan_foreign_policy.90.desc: "เราไดรับขาวจากชาว[FROM.GetAdjective]เกี่ยวกับคําขอของเราที่จะแลกอุตสาหกรรมกับทรัพยากรบางสวนของพวกเขา ดูเหมือนวาเราเห็นพองกันถึงประโยชนของขอตกลงนี้ และพวกเขาก็ยินดีตกลงตามเงื่อนไข เราจะไดรับทรัพยากรในไมชา"
 SEA_japan_foreign_policy.90.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.91.t: "[FROM.GetAdjective]ปฏิเสธขอตกลงการคาอุตสาหกรรม"
 SEA_japan_foreign_policy.91.desc: "แมจะมีทาทีเปนกลางตอขอตกลงที่เราเสนอ แตในที่สุดชาว[FROM.GetAdjective]ก็เลือกที่จะปฏิเสธขอเสนอใหเราแลกอุตสาหกรรมกับทรัพยากรของพวกเขา พวกเขาอางวานี่ไมใชเวลาที่เหมาะสม ฟงดูเหมือนวาเราอาจบรรลุขอตกลงไดในอนาคต เมื่อเรากระชับความสัมพันธใหแนนแฟนยิ่งขึ้น"
 SEA_japan_foreign_policy.91.a: "ถาครั้งแรกยังไมสําเร็จ..."

 SEA_japan_foreign_policy.92.t: "ชาว[FROM.GetAdjective]ตองการสายสัมพันธที่ใกลชิดยิ่งขึ้น"
 SEA_japan_foreign_policy.92.desc: "นักการทูตของ[FROM.GetNameDef]ไดติดตอเราเรื่องการกระชับสายสัมพันธ ซึ่งเคยถูกขัดขวางโดยกลุมทหารภายในประเทศของพวกเขา แตบัดนี้ไดรับการจัดการแลว พวกเขาตองการทั้งขอตกลงดานการคา การวิจัย และการปองกัน เราอาจลงนามในขอใดขอหนึ่ง หรือยอมรับทั้งหมดก็ได การปฏิเสธพวกเขาโดยสิ้นเชิงดูไมใชความคิดที่ดี หลังจากความพยายามทั้งหมดที่พวกเขาทุมเทมาถึงตรงนี้"
 SEA_japan_foreign_policy.92.a: "สายสัมพันธสามารถกระชับไดผานการคา"
 SEA_japan_foreign_policy.92.b: "เราไมเห็นความจําเปนของขอตกลงใด ๆ..."
 SEA_japan_foreign_policy.92.c: "เราควรจัดทําขอตกลงดานการปองกันที่เหมาะสมกับพวกเขา"
 SEA_japan_foreign_policy.92.d: "เราควรลงนามในขอตกลงทั้งหมดที่เสนอมา!"

 SEA_japan_foreign_policy.93.t: "[FROM.GetLeader]ลงนามในขอตกลงความรวมมือ"
 SEA_japan_foreign_policy.93.desc: "[FROM.GetLeader] ผูนําผูมีนํ้าใจแหง[FROM.GetNameDef] ไดตอบรับขอเสนอขอหนึ่งของเรา โดยตกลงที่จะสรางความสัมพันธดานการคาและการวิจัยที่ใกลชิดยิ่งขึ้นกับชาติของเรา นี่คือวันอันยิ่งใหญของ[ROOT.GetNameDef] และความสําเร็จทางการทูตของเรา!"
 SEA_japan_foreign_policy.93.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.94.t: "[FROM.GetLeader] ไมลงนามขอตกลงใด ๆ"
 SEA_japan_foreign_policy.94.desc: "[FROM.GetLeader] ผูนําสองหนาแหง[FROM.GetNameDef] ไดปฏิเสธขอเสนอทั้งหมดของเรา ปดประตูความคิดที่จะกระชับความสัมพันธระหวางชาติของเรา นี่คือวันอันมืดมนของ[ROOT.GetNameDef] และความสําเร็จทางการทูตของเรา..."
 SEA_japan_foreign_policy.94.a: "เลวรายนัก"

 SEA_japan_foreign_policy.95.t: "[FROM.GetLeader] ลงนามขอตกลงดานการปองกัน"
 SEA_japan_foreign_policy.95.desc: "[FROM.GetLeader] ผูนําผูมีนํ้าใจแหง[FROM.GetNameDef] ไดตอบรับขอเสนอขอหนึ่งของเรา โดยตกลงที่จะทํากติกาสัญญาปองกันรวมกับชาติของเรา ซึ่งทั้งสองฝายสัญญาวาจะเขาชวยเหลืออีกฝายหากถูกโจมตี นี่คือวันอันยิ่งใหญของ[ROOT.GetNameDef] และความสําเร็จทางการทูตของเรา!"
 SEA_japan_foreign_policy.95.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.96.t: "[FROM.GetLeader] ลงนามขอตกลงทางการทูตฉบับครอบคลุม"
 SEA_japan_foreign_policy.96.desc: "[FROM.GetLeader] ผูนําผูมีนํ้าใจแหง[FROM.GetNameDef] ไดตอบรับขอเสนอทั้งหมดของเรา โดยตกลงที่จะสรางความสัมพันธดานการคาและการวิจัยพัฒนาที่ใกลชิดยิ่งขึ้น พรอมทั้งทํากติกาสัญญาปองกันรวมกับชาติของเรา ซึ่งทั้งสองฝายสัญญาวาจะเขาชวยเหลืออีกฝายหากถูกโจมตี นี่คือวันอันยิ่งใหญของ[ROOT.GetNameDef] และความสําเร็จทางการทูตของเรา!"
 SEA_japan_foreign_policy.96.a: "ยอดเยี่ยม!"

 jap_usa_japan_research_name: "ขอตกลงการวิจัยอเมริกา-ญี่ปุน"
 jap_usa_japan_research_desc: "ขอตกลงการวิจัยระหวางนักวิทยาศาสตรของสหรัฐอเมริกาและญี่ปุน"

 SEA_japan_foreign_policy.97.t: "[FROM.GetNameDefCap] ขอทําขอตกลงการคา"
 SEA_japan_foreign_policy.97.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดสงคณะทูตมายังเมืองหลวงของเราเพื่อหารือถึงลูทางความสัมพันธทางการคาอันแนบแนนกับชาติ[FROM.GetAdjective] สิ่งนี้จะทําใหความสัมพันธของเราใกลชิดขึ้น แตก็จะเปดทางใหพวกเขาเขาถึงทรัพยากรของเราในราคาที่ถูกลง ซึ่งเสี่ยงตอการทํารายเศรษฐกิจของเรา"
 SEA_japan_foreign_policy.97.a: "เราไมเห็นปญหาอะไร"
 SEA_japan_foreign_policy.97.b: "เอาเอกสารของทานกลับโตเกียวไปเถอะ!"

 SEA_japan_foreign_policy.98.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอทางการคา"
 SEA_japan_foreign_policy.98.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอการคาราคาถูกระหวางชาติของเราเปนอยางดี และไดลงนามในเอกสารที่จําเปนเพื่อใหมีผลบังคับใชทันที พวกเขามีวิสัยทัศนเดียวกับเราถึงอนาคตอันสดใสของเอเชียทั้งมวล!"
 SEA_japan_foreign_policy.98.a: "วิเศษ"

 SEA_japan_foreign_policy.99.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอทางการคา"
 SEA_japan_foreign_policy.99.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบโตคําขอการคาราคาถูกภายในพันธมิตรของเราอยางรุนแรง พรอมขูวาจะตั้งกําแพงภาษีหากเราพยายามบีบบังคับเรื่องนี้ ดูเหมือน[FROM.GetNameDef] จะไมไดเปนสวนหนึ่งของอนาคตอันสดใสที่เราวาดไว"
 SEA_japan_foreign_policy.99.a: "นารังเกียจยิ่งนัก!"

 SEA_japan_foreign_policy.100.t: "[FROM.GetNameDefCap] เชิญเราเขารวมสหภาพเงินตรา"
 SEA_japan_foreign_policy.100.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยื่นขอเสนอใหเราเขารวมสหภาพเงินตรากับพวกเขา ซึ่งจะมีแตเสริมความแข็งแกรงใหเศรษฐกิจของทั้งสองชาติ ฟงดูเปนขอเสนอที่ดีเกินกวาจะปลอยผานใชไหมละ?"
 SEA_japan_foreign_policy.100.a: "เรายินดีตอบรับ"
 SEA_japan_foreign_policy.100.b: "ฟงดูนาสงสัยนะ..."

 SEA_japan_foreign_policy.101.t: "[FROM.GetNameDefCap] เขารวมสหภาพเงินตรา"
 SEA_japan_foreign_policy.101.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราในการสถาปนาสกุลเงินรวมระหวางชาติของเราเปนอยางดี และไดลงนามในเอกสารที่จําเปนเพื่อใหมีผลบังคับใชทันที พวกเขามีวิสัยทัศนเดียวกับเราถึงอนาคตอันสดใสของเอเชียทั้งมวล!"
 SEA_japan_foreign_policy.101.a: "วิเศษ"

 SEA_japan_foreign_policy.102.t: "[FROM.GetNameDefCap] ปฏิเสธสหภาพเงินตรา"
 SEA_japan_foreign_policy.102.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบโตคําขอใหใชสกุลเงินรวมภายในพันธมิตรของเราอยางรุนแรง พรอมขูวาจะตั้งกําแพงภาษีหากเราพยายามบีบบังคับเรื่องนี้ ดูเหมือน[FROM.GetNameDef] จะไมไดเปนสวนหนึ่งของอนาคตอันสดใสที่เราวาดไว"
 SEA_japan_foreign_policy.102.a: "นารังเกียจยิ่งนัก!"

 SEA_japan_foreign_policy.103.t: "[FROM.GetNameDefCap] เรียกรองการบูรณาการทางเศรษฐกิจ"
 SEA_japan_foreign_policy.103.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เดินทางมาถึงเมืองหลวงของเราในวันนี้พรอมขอเสนอ พวกเขาตองการใหเรายกระดับกิจกรรมสหภาพเงินตราและบูรณาการทางเศรษฐกิจกับพวกเขาใหลึกซึ้งยิ่งขึ้น สิ่งนี้จะชวยเศรษฐกิจของเราไดมาก แตเรื่องทั้งหมดนี้ดูมีกลิ่นตุ ๆ อยู..."
 SEA_japan_foreign_policy.103.a: "ดีเกินกวาจะปลอยผาน"
 SEA_japan_foreign_policy.103.b: "เราจะไมยอมสละเอกราชทางเศรษฐกิจ!"

 SEA_japan_foreign_policy.104.t: "[FROM.GetNameDefCap] ตอบรับขอเสนอของเรา"
 SEA_japan_foreign_policy.104.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และคณะทูตของพวกเขาไดเดินทางมาถึงประเทศของเราเพื่อลงนามในเอกสารที่จําเปนสําหรับการบูรณาการทางเศรษฐกิจขั้นตอไป"
 SEA_japan_foreign_policy.104.a: "ตองขอบคุณความไรเดียงสาของพวกเขา"

 SEA_japan_foreign_policy.105.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 SEA_japan_foreign_policy.105.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับคําเชิญใหบูรณาการของเราดวยความไมพอใจอยางยิ่ง และประกาศวาความรวมมือทางเศรษฐกิจที่ใกลชิดขึ้นในรูปแบบใด ๆ ระหวางประเทศของเรานั้นไมมีทางเกิดขึ้นไดทั้งในตอนนี้และตลอดไป บางทีพวกเขาอาจมองออกวาเราเตรียมอะไรไวให..."
 SEA_japan_foreign_policy.105.a: "ขาวรายจริง ๆ..."

 SEA_japan_foreign_policy.106.t: "[FROM.GetNameDefCap] กลืนเศรษฐกิจของเรา"
 SEA_japan_foreign_policy.106.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดกาวไกลเกินกวาที่สัญญาไวแตแรก และกําลังปนตลาดเพื่อเพิ่มการพึ่งพาเศรษฐกิจของพวกเขามากขึ้นอีก เพื่อใหแนใจวาเราจะไมอาจออกนอกเสนทางของพวกเขาได หากเราไมตัดขาดจากพวกเขาในทันที นี่จะเปนจุดจบของสถานะชาติเอกราชของเราโดยปริยาย เราจะรับมือเรื่องนี้อยางไร?"
 SEA_japan_foreign_policy.106.a: "เราคงตองยอมรับสถานการณ"
 SEA_japan_foreign_policy.106.b: "ชัยชนะหรือความตาย!"

 SEA_japan_foreign_policy.107.t: "[FROM.GetNameDefCap] ยอมรับการบูรณาการเพิ่มเติม"
 SEA_japan_foreign_policy.107.desc: "ขาวอันนายินดีที่ผูนําของ[FROM.GetNameDef] เลือกจะบูรณาการกับเรามากยิ่งขึ้น ไดรับเสียงปรบมือกึกกองในสภาไดเอ็ตเมื่อชวงตนวันนี้ สิ่งที่เรามอบใหไดนั้นเพียงพอใหพวกเขาเห็นวาขอเสนอนี้คุมคา แมอํานาจอธิปไตยจะตองถูกลดทอนไปบางก็ตาม"
 SEA_japan_foreign_policy.107.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.108.t: "[FROM.GetNameDefCap] ปฏิเสธการบูรณาการเพิ่มเติม"
 SEA_japan_foreign_policy.108.desc: "แมจะมีขอดีชัดเจนและเห็นไดชัดวาดีที่สุดสําหรับสหภาพ แต[FROM.GetNameDef] ก็ปฏิเสธขอเสนอการบูรณาการเพิ่มเติมของเรา เหตุผลของพวกเขาคงทําไดเพียงคาดเดา แตดูเหมือนพวกเขาอาจไมไดคํานึงถึงประโยชนสูงสุดของสหภาพ"
 SEA_japan_foreign_policy.108.a: "พวกเขาเปนภัยตอเอกภาพขององคกร!"
 SEA_japan_foreign_policy.108.b: "เราจะจับตาดูพวกเขาอยางใกลชิด"

 SEA_japan_foreign_policy.109.t: "[FROM.GetNameDefCap] เรียกรองการบูรณาการโดยสมบูรณ"
 SEA_japan_foreign_policy.109.desc: "การบูรณาการเศรษฐกิจดูจะยังไมเพียงพอสําหรับชาว[FROM.GetAdjective] เพราะวันนี้[FROM.GetLeader] แหง[FROM.GetNameDef] ไดกาวไกลเกินกวาที่สัญญาไวแตแรก และกําลังเรียกรองใหเราถูกผนวกรวมเขากับชาติของพวกเขาโดยสมบูรณ หากเราไมตัดขาดจากพวกเขาในทันที นี่จะเปนจุดจบของสถานะชาติเอกราชของเรา เราจะรับมือเรื่องนี้อยางไร?"
 SEA_japan_foreign_policy.109.a: "เราคงตองยอมรับสถานการณ"
 SEA_japan_foreign_policy.109.b: "ชัยชนะหรือความตาย!"

 SEA_japan_foreign_policy.110.t: "[FROM.GetNameDefCap] ยอมรับการบูรณาการโดยสมบูรณ"
 SEA_japan_foreign_policy.110.desc: "ขาวอันนายินดีที่ผูนําของ[FROM.GetNameDef] ยอมใหตนถูกผนวกรวมเขากับชาติของเรา ไดรับเสียงปรบมือกึกกองในสภาไดเอ็ตเมื่อชวงตนวันนี้ สิ่งที่เรามอบใหไดนั้นเพียงพอใหพวกเขาเห็นวาขอเสนอนี้คุมคา แมจะตองแลกกับการสิ้นสุดอํานาจอธิปไตยของตนก็ตาม"
 SEA_japan_foreign_policy.110.a: "ยอดเยี่ยม!"

 SEA_japan_foreign_policy.111.t: "[FROM.GetNameDefCap] ปฏิเสธการบูรณาการโดยสมบูรณ"
 SEA_japan_foreign_policy.111.desc: "แมจะมีขอดีชัดเจนและเห็นไดชัดวาดีที่สุดสําหรับสหภาพ แต[FROM.GetNameDef] ก็ปฏิเสธขอเสนอการบูรณาการโดยสมบูรณของเรา เหตุผลของพวกเขาคงทําไดเพียงคาดเดา แตดูเหมือนพวกเขาอาจไมไดคํานึงถึงประโยชนสูงสุดของสหภาพ"
 SEA_japan_foreign_policy.111.a: "พวกเขาเปนภัยตอเอกภาพขององคกร!"
 SEA_japan_foreign_policy.111.b: "เราจะจับตาดูพวกเขาอยางใกลชิด"

 SEA_japan_foreign_policy.112.t: "[FROM.GetNameDefCap] ขอควบคุมอาณานิคมในเอเชียของเรา"
 SEA_japan_foreign_policy.112.desc: "คณะทูตของ[FROM.GetNameDef] ไดเสนอขอตกลงใหพวกเขาเปนเจาเหนือหัวของรัฐในอารักขาของเราในพมาและมาเลเซีย แลกกับสิทธิ์ในทรัพยากรของพื้นที่สําคัญบางแหง โดยอางวานี่เปนสวนหนึ่งของหลักนิยมผูพิทักษแปซิฟกของพวกเขา และอางวาจะทําใหเรามุงความสนใจไปที่ยุโรปและแอฟริกาได ขณะที่พวกเขาปกปองเอเชียจากคอมมิวนิสต เราจะวาอยางไร?"
 SEA_japan_foreign_policy.112.a: "จะทําใหเราทุมเทกําลังไปยังพื้นที่อื่นได"
 SEA_japan_foreign_policy.112.b: "ประนีประนอมเรื่องจักรวรรดิของเรา? ไมมีทาง!"

 SEA_japan_foreign_policy.113.t: "[FROM.GetNameDefCap] โอนอาณานิคมในเอเชียของตน"
 SEA_japan_foreign_policy.113.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ตอบรับขอเสนอของเราดวยดี และไดลงนามในเอกสารเพื่อสงมอบอาณานิคมในมาเลเซียและพมาใหแกเรา แลกกับการคงสิทธิ์ควบคุมทรัพยากรธรรมชาติสําคัญในพื้นที่ไว วันนี้เปนวันอันยิ่งใหญของชาวเอเชีย!"
 SEA_japan_foreign_policy.113.a: "เราจะพิทักษแปซิฟกแทนพวกเขาเอง"

 SEA_japan_foreign_policy.114.t: "[FROM.GetNameDefCap] ปฏิเสธคําขอของเรา"
 SEA_japan_foreign_policy.114.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดแสดงพฤติกรรมอันนาอับอาย และเผยใหเราเห็นวาทัศนคติแบบตะวันตกนั้นมืดบอดและเสื่อมทรามเพียงใด เราเสนอขอตกลงที่พวกเขาไมนาจะปฏิเสธได ซึ่งจะทําใหเอเชียเปนที่ที่ดีขึ้น แตพวกเขาก็ยังหาทางปฏิเสธจนได วันนี้เปนวันอันมืดมนของพันธมิตรของเรา"
 SEA_japan_foreign_policy.114.a: "พวกตะวันตกผูหยิ่งยโส..."

 ENG_will_gain_resource_right_we_tt: "เราจะไดรับสิทธิ์ในทรัพยากรของบางรัฐในประเทศที่ถูกโอนมา"

 SEA_japan_foreign_policy.115.t: "[From.GetNameDefCap] ตองการเปนเจาเหนือหัวของอาณานิคมหนึ่งของเรา"
 SEA_japan_foreign_policy.115.desc: "ชาว[From.GetAdjective] ฉวยโอกาสจากความออนแอของเรา เสนอที่จะ 'ชวย' เรา 'รักษาความสงบเรียบรอย' ในอาณานิคม พวกเขาอางวาในเมื่อโลกกําลังลุกเปนไฟในที่อื่น เราไมมีทางรักษาการควบคุมดินแดนเหลานี้ไวได\n\nเห็นไดชัดวานี่เปนแผนแยงชิงอาณานิคมไปจากเรา แตเรามีทางเลือกอะไรละ?"
 SEA_japan_foreign_policy.115.a: "ถึงเวลายอมรับการครอบงําเอเชียของญี่ปุนแลว"
 SEA_japan_foreign_policy.115.b: "พวกเขาตองใชกําลังยึดไปเอง!"

 SEA_japan_foreign_policy.116.t: "[From.GetNameDefCap] มอบสิทธิ์เปนเจาเหนือหัวอาณานิคม"
 SEA_japan_foreign_policy.116.desc: "[From.GetNameDefCap] ไดพิจารณาขอเสนอของเราที่จะ 'รักษาความสงบเรียบรอย' ในอาณานิคมของพวกเขาอยางถี่ถวน และตัดสินใจตอบรับ พวกเขาไดโอนการควบคุมรัฐในอารักขาของตนทั้งหมดมาใหเราแลวโดยปริยาย"
 SEA_japan_foreign_policy.116.a: "การตัดสินใจที่ชาญฉลาด"

 SEA_japan_foreign_policy.117.t: "[From.GetNameDefCap] ปฏิเสธการมอบสิทธิ์เปนเจาเหนือหัวอาณานิคม"
 SEA_japan_foreign_policy.117.desc: "[From.GetNameDefCap] ไดพิจารณาขอเสนอของเราที่จะ 'รักษาความสงบเรียบรอย' ในอาณานิคมของพวกเขาอยางถี่ถวน และตัดสินใจปฏิเสธ ดูเหมือนพวกเขาจะไมไดคํานึงถึงประโยชนสูงสุดของชาวเอเชีย"
 SEA_japan_foreign_policy.117.a: "คอยดูกันวาพวกเขาจะลงเอยอยางไร"
 SEA_japan_foreign_policy.117.b: "ถาเชนนั้นเราจะปลดปลอยพวกเขาดวยกําลัง!"

 SEA_japan_foreign_policy.118.t: "[FROM.GetNameDefCap] เชิญเราเขารวมพันธมิตร"
 SEA_japan_foreign_policy.118.desc: "คณะผูแทนจากแดนไกลเพิ่งเดินทางมาถึงเมืองหลวงของเรา เพื่อขอเขาพบ[ROOT.GetLeader] พวกเขาอางวามาจาก[FROM.GetNameDef] และตองการสรางพันธมิตรระหวางชาติของเรา เราจะตอบรับหรือไม?"
 SEA_japan_foreign_policy.118.a: "เราจะแข็งแกรงขึ้นเมื่ออยูดวยกัน"
 SEA_japan_foreign_policy.118.b: "นั่นขัดกับหลักความเปนกลางของเรา..."

 SEA_japan_foreign_policy.119.t: "[FROM.GetNameDefCap] ตอบรับคําเชิญของเรา"
 SEA_japan_foreign_policy.119.desc: "[FROM.GetLeader] ไดตอบรับขอเสนอของเราในการสถาปนาพันธมิตรระหวางชาติของเราอยางเปนทางการดวยดี และไดเริ่มดําเนินการเพื่อผนวกตนเขาสูเขตอิทธิพลของเราแลว วันนี้เปนวันแหงการเฉลิมฉลอง!"
 SEA_japan_foreign_policy.119.a: "พวกเขามีวิสัยทัศนตออนาคตเชนเดียวกับเรา"

 SEA_japan_foreign_policy.120.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะรวมกับเรา"
 SEA_japan_foreign_policy.120.desc: "[FROM.GetLeader] ไดปฏิเสธขอเสนอพันธมิตรระหวางชาติของเราอยางไมไยดี โดยอางวาขัดกับหลักความเปนกลางของพวกเขา เราไดแตนึกภาพวาตองมีการฉอฉลมากมายเพียงใดจึงนําไปสูการตัดสินใจอันผิดพลาดนี้"
 SEA_japan_foreign_policy.120.a: "พวกเขาเสียโอกาสเอง"

 SEA_japan_foreign_policy.121.t: "[FROM.GetNameDefCap] โอนเราใหอยูใตการควบคุมของ[JAP.GetAdjective]"
 SEA_japan_foreign_policy.121.desc: "[FROM.GetLeader] เจาเหนือหัวคนเดิมของเรา ไดลงนามในเอกสารสงมอบการควบคุมชาติของเราใหแก[JAP.GetNameDef] ดูเหมือนเราจะถูกวางไวใตการคุมครองของมหาอํานาจอีกชาติหนึ่ง บัดนี้เรามีเจาเหนือหัวคนใหมที่เราตองอยูใตอํานาจตามแตใจของเขา"
 SEA_japan_foreign_policy.121.a: "โอ..."

 SEA_japan_foreign_policy.122.t: "การแลกเปลี่ยนนายพลชาว[From.GetAdjective]"
 SEA_japan_foreign_policy.122.desc: "ชาว[From.GetAdjective] ตัดสินใจเรียกตัวขาราชการและนายพลฝายซายของพวกเขากลับ และสงนายพลกับขาราชการฝายขวามาใหเราแทนในฐานะผูลี้ภัยอยางไมเปนทางการ"
 SEA_japan_foreign_policy.122.a: "ดูเหมือนจะมีอะไรบางอยางกําลังเกิดขึ้นใน[From.GetNameDef]..."

 SEA_japan_foreign_policy.123.t: "แลกเปลี่ยนนายพลชาว[Root.GetAdjective]แลว"
 SEA_japan_foreign_policy.123.desc: "กระบวนการแลกเปลี่ยนนายพลและขาราชการฝายขวาของเรากับฝายซายที่เราเคยสงไปลี้ภัยอยางไมเปนทางการใน[From.GetNameDef] ไดเสร็จสิ้นลงแลว"
 SEA_japan_foreign_policy.123.a: "สิ่งนี้จะทําใหเรากุมอํานาจเหนือ[Root.GetNameDef] ไดมั่นคงยิ่งขึ้น"

 SEA_japan_foreign_policy.124.t: "[FROM.GetNameDefCap] เชิญเราเขารวมสากลที่หา"
 SEA_japan_foreign_policy.124.desc: "คณะผูแทนจากแดนไกลเพิ่งเดินทางมาถึงเมืองหลวงของเรา เพื่อขอเขาพบ[ROOT.GetLeader] พวกเขาอางวามาจาก[FROM.GetNameDef] และตองการสรางพันธมิตรระหวางชาติของเรา เราจะตอบรับหรือไม?"
 SEA_japan_foreign_policy.124.a: "เราจะแข็งแกรงขึ้นเมื่ออยูดวยกัน"
 SEA_japan_foreign_policy.124.b: "นั่นขัดกับหลักความเปนกลางของเรา..."

 SEA_japan_foreign_policy.125.t: "[FROM.GetNameDefCap] ตอบรับคําเชิญของเรา"
 SEA_japan_foreign_policy.125.desc: "[FROM.GetLeader] ไดตอบรับขอเสนอของเราในการสถาปนาพันธมิตรระหวางชาติของเราอยางเปนทางการดวยดี และไดเริ่มดําเนินการเพื่อผนวกตนเขาสูเขตอิทธิพลของเราแลว วันนี้เปนวันแหงการเฉลิมฉลอง!"
 SEA_japan_foreign_policy.125.a: "พวกเขามีวิสัยทัศนตออนาคตเชนเดียวกับเรา"

 SEA_japan_foreign_policy.126.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะรวมกับเรา"
 SEA_japan_foreign_policy.126.desc: "[FROM.GetLeader] ไดปฏิเสธขอเสนอพันธมิตรระหวางชาติของเราอยางไมไยดี โดยอางวาขัดกับหลักความเปนกลางของพวกเขา เราไดแตนึกภาพวาตองมีการฉอฉลมากมายเพียงใดจึงนําไปสูการตัดสินใจอันผิดพลาดนี้"
 SEA_japan_foreign_policy.126.a: "พวกเขาเสียโอกาสเอง"

 SEA_japan_foreign_policy.127.t: "[FROM.GetNameDefCap] เขารวมสากลที่หา"
 SEA_japan_foreign_policy.127.desc: "[FROM.GetLeader] ผูทรยศไดทิ้งเราไปเขากับพวกคอมมิวนิสตใน[JAP.GetNameDef] ฉีกขอตกลงที่ลงนามระหวางชาติของเราเมื่อสิ้นสุดสงครามกลางเมืองรัสเซีย เราควรลงโทษพฤติกรรมแปรพักตรของพวกเขาหรือไม?"
 SEA_japan_foreign_policy.127.a: "ไม เราตองปลอยเรื่องนี้ไป..."
 SEA_japan_foreign_policy.127.b: "ใช พวกเขาตองชดใช!"

 SEA_japan_foreign_policy.128.t: "[FROM.GetLeader] เรียกรองใหเรายอมสยบ"
 SEA_japan_foreign_policy.128.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหรัฐแบงแยกดินแดนอันผิดกฎหมายของเรากลับไปสยบตอการปกครองของอํานาจสวนกลางในโตเกียวอีกครั้ง และกลับคืนสูเขตอิทธิพลของ[FROM.GetAdjective] เราควรตอบโตภัยคุกคามที่ชัดแจงนี้อยางไร?"
 SEA_japan_foreign_policy.128.a: "เราไมมีกําลังพอจะปฏิเสธขอเรียกรองของพวกเขา"
 SEA_japan_foreign_policy.128.b: "เราจะสูจนคนสุดทาย!"

 SEA_japan_foreign_policy.129.t: "[FROM.GetLeader] ยอมรับขอเรียกรองของเรา"
 SEA_japan_foreign_policy.129.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมรับขอเรียกรองของเราอยางชาญฉลาดและสยบตออํานาจของเรา นําชาติ[FROM.GetAdjective] กลับคืนสูเขตอิทธิพลของเราอีกครั้ง วันนี้เรายืนหยัดอยางผูมีชัย เพราะประชาชนชาว[FROM.GetAdjective] ไดรับการปลดปลอยจากเผด็จการกระฎมพีแลว!"
 SEA_japan_foreign_policy.129.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.130.t: "[FROM.GetLeader] ปฏิเสธขอเรียกรองของเรา"
 SEA_japan_foreign_policy.130.desc: "นาเสียดายที่[FROM.GetLeader] แหง[FROM.GetNameDef] ไดปฏิเสธขอเรียกรองใหยอมสยบของเรา โดยอางวาเจตจํานงของประชาชนคือประชาธิปไตยที่เปนเอกราช มิใชรัฐปฏิวัติในเขตอิทธิพลของ[ROOT.GetAdjective] พวกเขาเลือกผิดเสียแลว..."
 SEA_japan_foreign_policy.130.a: "ถาเชนนั้นเราตองยึดดินแดนคืนดวยกําลัง!"

 SEA_japan_foreign_policy.131.t: "[FROM.GetNameDefCap] ปลุกปนสงครามกลางเมืองใน[ROOT.GetNameDef]"
 SEA_japan_foreign_policy.131.desc: "หลังการเรียกรองลาสุดจากรัฐบาล[FROM.GetAdjective] และนักปลุกระดมอยางพัก ฮ็อน-ยง ดูเหมือนชนชั้นกรรมาชีพชาว[ROOT.GetAdjective] จะเหนื่อยหนายกับการรอคอยการเปลี่ยนรัฐบาลอยางสันติแลว หลังการถกเถียงอยางดุเดือด การทูตก็ลมเหลวและนําไปสูการปะทะดวยอาวุธ โดยกองกําลังของฮ็อน-ยงไดยึดครองพื้นที่ภาคใตของประเทศไวแลว"
 SEA_japan_foreign_policy.131.a: "เพื่อชนชั้นกรรมาชีพ!"
 SEA_japan_foreign_policy.131.b: "เราตองหยุดความบาคลั่งนี้!"

 SEA_japan_foreign_policy.132.t: "[FROM.GetLeader] เรียกรองใหเรายอมสยบ"
 SEA_japan_foreign_policy.132.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เรียกรองใหเผด็จการกระฎมพีของเราสยบตอการปกครองของอํานาจคอมมิวนิสตสวนกลางในโตเกียว และปลอยใหประชาชนในชาติของเราปกครองตนเองอยางแทจริงในฐานะสวนหนึ่งที่ภักดีตอเขตอิทธิพลของ[FROM.GetAdjective] เราควรตอบโตภัยคุกคามที่ชัดแจงนี้อยางไร?"
 SEA_japan_foreign_policy.132.a: "เราไมมีกําลังพอจะปฏิเสธขอเรียกรองของพวกเขา"
 SEA_japan_foreign_policy.132.b: "เราจะสูจนคนสุดทาย!"

 SEA_japan_foreign_policy.133.t: "[FROM.GetLeader] ยอมรับขอเรียกรองของเรา"
 SEA_japan_foreign_policy.133.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมรับขอเรียกรองของเราและสยบตออํานาจของเรา นําชาติ[FROM.GetAdjective] เขาสูเขตอิทธิพลของเรา วันนี้เรายืนหยัดอยางผูมีชัย เพราะประชาชนชาว[FROM.GetAdjective] ไดรับการปลดปลอยจากเผด็จการกระฎมพีแลว!"
 SEA_japan_foreign_policy.133.a: "ยอดเยี่ยม"

 SEA_japan_foreign_policy.134.t: "[FROM.GetLeader] ปฏิเสธขอเรียกรองของเรา"
 SEA_japan_foreign_policy.134.desc: "นาเสียดายที่[FROM.GetLeader] แหง[FROM.GetNameDef] ไดปฏิเสธขอเรียกรองใหยอมสยบของเรา โดยอางวาเจตจํานงของประชาชนคือชาติที่เปนเอกราช มิใชรัฐปฏิวัติในเขตอิทธิพลของ[ROOT.GetAdjective] พวกเขาเลือกผิดเสียแลว..."
 SEA_japan_foreign_policy.134.a: "ถาเชนนั้นเราตองปลดปลอยประชาชนของพวกเขาดวยกําลัง!"

 SEA_japan_foreign_policy.135.t: "การประกาศสถาปนาสาธารณรัฐฟลิปปนสที่สอง"
 SEA_japan_foreign_policy.135.desc: "เมื่อชวงตนวันนี้ [ROOT.GetLeader] และผูนํากองทัพ[JAP.GetAdjective] หลายนายไดรวมกันออกแถลงการณประกาศสถาปนารัฐ[ROOT.GetAdjective] ขึ้นใหม เราจะยืนหยัดเหนือศัตรูทั้งปวงของเรา!"
 SEA_japan_foreign_policy.135.a: "ความรุงเรืองอยูแคเอื้อม!"

 SEA_japan_foreign_policy.136.t: "การโจมตีเพิรลฮารเบอร"
 SEA_japan_foreign_policy.136.desc: "เมื่อวานนี้ วันที่จะเปนมลทินไปชั่วกาลนาน [ROOT.GetNameDef] ถูกกองกําลังทางเรือและทางอากาศของ[JAP.GetNameDef] โจมตีอยางกะทันหันและจงใจ [ROOT.GetNameDefCap] อยูในสันติภาพกับชาตินั้น และตามคํารองขอของ[JAP.GetNonIdeologyName] ยังคงเจรจากับรัฐบาลและจักรพรรดิของพวกเขาเพื่อธํารงสันติภาพในแปซิฟก อันที่จริง หนึ่งชั่วโมงหลังจากฝูงบิน[JAP.GetAdjective] เริ่มทิ้งระเบิดเกาะโออาฮูของ[ROOT.GetAdjective] เอกอัครราชทูต[JAP.GetAdjective] ประจําสหรัฐอเมริกาและคณะยังไดยื่นคําตอบอยางเปนทางการตอสาสนฉบับลาสุดของ[ROOT.GetAdjective] แกรัฐมนตรีวาการกระทรวงการตางประเทศของเรา และแมคําตอบนั้นจะระบุวาดูไรประโยชนที่จะเจรจาทางการทูตตอไป แตก็ไมมีคําขูหรือการบอกเปนนัยถึงสงครามหรือการโจมตีดวยอาวุธเลย แตบัดนี้ถึงเวลาเผชิญความจริงแลว... เราอยูในภาวะสงคราม!"
 SEA_japan_foreign_policy.136.a: "วันนี้จะเปนมลทินไปชั่วกาลนาน!"

 SEA_japan_foreign_policy.137.t: "ควบรวมกับ[MAN.GetNameDef]"
 SEA_japan_foreign_policy.137.desc: "[JAP.GetLeader] เรียกรองใหเราควบรวมรัฐบาลของเรากับ[MAN.GetNameDef] ซึ่งจะยุติเอกราชของเราและมอบตําแหนงระดับสูงในรัฐบาล[MAN.GetAdjective] ใหแกผูนําของเรา เราจะยอมรับขอเสนอนี้หรือไม?"
 SEA_japan_foreign_policy.137.a: "[ROOT.GetLeader] จะไดตําแหนงที่ดี เราจึงตอบรับ"
 SEA_japan_foreign_policy.137.b: "นั่นคือจุดจบของอํานาจปกครองตนเองของเรา ไม!"

 SEA_japan_foreign_policy.138.t: "[FROM.GetNameDefCap] ควบรวมกับเรา"
 SEA_japan_foreign_policy.138.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดยอมรับขอเสนอของ[JAP.GetAdjective] ใหควบรวมกับรัฐบาลของเรา และบัดนี้ดินแดน[FROM.GetAdjective] ทั้งหมดอยูใตอํานาจปกครองของเราแลว วันนี้เปนวันอันยิ่งใหญของเรา!"
 SEA_japan_foreign_policy.138.a: "ทางเลือกที่ชาญฉลาด"

 SEA_japan_foreign_policy.139.t: "[FROM.GetNameDefCap] ปฏิเสธการควบรวม"
 SEA_japan_foreign_policy.139.desc: "[FROM.GetLeader] ผูตื้นเขินไมยอมรับฟงเหตุผล และปฏิเสธขอเสนอใหควบรวมเขากับรัฐบาล[MAN.GetAdjective] บางทีอาจตองมีขอเสนอที่ดีกวานี้ หรือแมแตการขมขูในปริมาณที่เหมาะสม"
 SEA_japan_foreign_policy.139.a: "นาเสียดายยิ่งนัก"

 SEA_japan_foreign_policy.140.t: "[MAN.GetLeader] ตองการควบรวมรัฐบาลหุนเชิด"
 SEA_japan_foreign_policy.140.desc: "[MAN.GetLeader] รองขอใหเราควบรวมรัฐบาลหุนเชิดจีนอื่น ๆ เขากับ[MAN.GetNameDef] ซึ่งจะยุติอํานาจปกครองตนเองของพวกเขาและมอบดินแดนของพวกเขาใหแกรัฐบาล[MAN.GetAdjective] เราจะยอมรับขอเสนอนี้หรือไม?"
 SEA_japan_foreign_policy.140.a: "ก็ได จะทําใหงานบริหารของเรางายขึ้น"
 SEA_japan_foreign_policy.140.b: "ฟงดูนาสงสัย"

 SEA_japan_foreign_policy.141.t: "[JAP.GetLeader] ปฏิเสธขอเสนอของเรา"
 SEA_japan_foreign_policy.141.desc: "[JAP.GetLeader] ไดปฏิเสธคําขอของเราที่จะควบรวมรัฐบาลหุนเชิดจีนอื่น ๆ เขากับรัฐบาลของเราอยางเด็ดขาด ดูเหมือนยังเร็วเกินไปที่รัฐบาลจะยอมรับการเคลื่อนไหวเชนนี้"
 SEA_japan_foreign_policy.141.a: "เราคงตองลองใหมภายหลัง..."






 SEA_japan_popup_events.1.t: "เกนริค ลิวชคอฟ เดินทางถึงแมนจูเรีย"
 SEA_japan_popup_events.1.desc: "สายลับของเราจับกุมผูแปรพักตรชาว[SOV.GetAdjective] ผูเรียกตนเองวาเกนริค ซาโมอีโลวิช ลิวชคอฟ ไดที่โปซเยตบริเวณชายแดนแมนจูเรีย เขาดูเหมือนจะเปนนายทหารระดับสูงของ NKVD และมีเอกสารลับอันมีคาเกี่ยวกับกําลังทหาร[SOV.GetAdjective] ในภูมิภาคนี้ เขาอางวากําลังหลบหนีการกวาดลางครั้งใหญ บางทีนี่อาจเปนโอกาสอันมีคาที่จะลวงรูการทํางานภายในของ[SOV.GetNameDef]?"
 SEA_japan_popup_events.1.a: "กลิ่นของโอกาสชัด ๆ!"
 SEA_japan_popup_events.1.b: "เราไวใจคนตางชาติผูนี้ไมไดวาจะพูดความจริง"

 SEA_japan_popup_events.2.t: "ภราดรภาพปองกันชาติใกลลมสลาย!"
 SEA_japan_popup_events.2.desc: "หลังขอพิพาทภายในระหวางผูนําของโดชิไกเมื่อไมนานมานี้ ดูเหมือนองคกรกําลังจะลมสลาย บางก็ชี้ถึงการแสดงความไมเคารพอยางโจงแจงของคิชิและพวกตอโทโจ ประกอบกับขาวลือมากมายเรื่องแผนลอบสังหารที่หนาหูขึ้นเรื่อย ๆ บรรยากาศจึงเต็มไปดวยความกังวลอยางยิ่ง ยังไมนับขาวลือวาคิชิวางแผนสรางเผด็จการเทคโนแครต  ที่จะขัดตอพระประสงคของจักรพรรดิและกองทัพบกจักรวรรดิญี่ปุน จะดีที่สุดหรือไมที่จะปลอยใหการจับคูนี้สิ้นสุดลง หรือมันมีคาเกินกวาจะปลอยไป?"
 SEA_japan_popup_events.2.a: "มันไมไดถูกสรางมาใหยั่งยืน"
 SEA_japan_popup_events.2.b: "เราตองรักษามันไวไมวาจะตองแลกดวยอะไร!"

 JAP_harakiri_debate_has_taken_place_flag: "ความตึงเครียดระหวาง§Yรัฐบาลพลเรือน§!และ§Yกลุมการทหาร§!มาถึงจุดแตกหัก และ§Yการอภิปรายฮาราคีรี§!ก็ไดเกิดขึ้น"

 SEA_japan_popup_events.3.t: "การอภิปรายฮาราคีรี"
 SEA_japan_popup_events.3.desc: "ในการประชุมใหญของสภาผูแทนราษฎรแหงสภาไดเอ็ตจักรวรรดิเมื่อชวงตนวันนี้ ฮามาดะ คูนิมัตสึ สมาชิกพรรคริกเก็นเซยูไก ไดวิจารณรัฐมนตรีวาการกระทรวงทหารบก ฮิซาอิจิ เทราอุจิ และอํานาจที่เพิ่มขึ้นของกลุมการทหารอยางดุเดือด เมื่อถูกรัฐมนตรีกลาวหาวาไมเคารพอํานาจของกองทัพและดูหมิ่นเกียรติของทหาร เขาก็ตอบกลับวา 'ไปตรวจบันทึกการประชุมดู หากมีถอยคําใดดูหมิ่นกองทัพ ขาพเจาจะทําเซปปุกุเพื่อขอขมาทาน แตหากไมมี ทานเองที่ตองทําเซปปุกุ' หลังจากนั้นเทราอุจิโกรธจัดและจองเขม็งไปยังฮามาดะจากบนเวที จนเกิดความโกลาหลดวยเสียงตะโกนอยางเดือดดาลไปทั่วหองประชุม"
 SEA_japan_popup_events.3.a: "นี่มันหายนะ!"

 ### KODOHA EVENTS ###

 SEA_japan_popup_events.4.t: "โนมนาวจักรพรรดิ"
 SEA_japan_popup_events.4.desc: "จักรพรรดิของเราทรงแสดงความไมสนพระทัยตอความทะเยอทะยานของเราในการฟนฟูโชวะและการสถาปนารัฐบาลทหารชุดใหม เปนไปไดวาพระองคยังคงอยูใตอิทธิพลของกลุมควบคุม แตหากพระองคไมทรงเขาขางเรา เราอาจตองแทนที่พระองคดวยพระอนุชา ยาซูฮิโตะ เราควร 'โนมนาว' ใหพระองครวมกับเรา หรือควรปลอยใหประวัติศาสตรดําเนินไปตามครรลอง?"
 SEA_japan_popup_events.4.a: "เราตองไดการสนับสนุนจากพระองค ไมวาดวยวิธีใด!"
 SEA_japan_popup_events.4.b: "เรามีผูสมควรคนอื่นอยูในใจ"
 SEA_japan_popup_events.4.c: "หากพระองคไมสนับสนุนเรา พระองคตองไป..."

 SEA_japan_popup_events.5.t: "ฮิโรฮิโตะทรงตัดสินพระทัยสนับสนุนรัฐบาลใหม"
 SEA_japan_popup_events.5.desc: "หลังการ 'โนมนาว' อยางเพียงพอ ดูเหมือนจักรพรรดิผูยิ่งใหญของเราทรงตัดสินพระทัยสนับสนุนรัฐบาลที่เพิ่งกอตั้งของเรา พระราชทานความเห็นชอบอยางเปนทางการใหเราเดินหนาแผนการฟนฟูโชวะตอไป สิ่งนี้จะเสริมความแข็งแกรงใหชาติของเรา!"
 SEA_japan_popup_events.5.a: "ยอดเยี่ยม!"

 SEA_japan_popup_events.6.t: "ฮิโรฮิโตะทรงปฏิเสธที่จะสนับสนุนรัฐบาลใหม"
 SEA_japan_popup_events.6.desc: "แมเราจะพยายามโนมนาวจักรพรรดิผูยิ่งใหญของเราอยางไมลดละ แตดูเหมือนพระองคไมทรงยอมรับฟงเหตุผล แมจะไมใชสิ่งที่เราปรารถนา แตเราก็รูวาเรื่องนี้อาจเกิดขึ้นได และไดวางแผนรับมือสถานการณเชนนี้ไวแลว พระอนุชาของพระองค ยาซูฮิโตะ ซึ่งเปนนายพลในกองทัพบกจักรวรรดิญี่ปุน คือผูที่เราหมายตาใหขึ้นแทนที่ โดยอาจเปนในฐานะเซ็สโช (ผูสําเร็จราชการ) แทนอากิฮิโตะ พระโอรสของฮิโรฮิโตะ หรือในฐานะจักรพรรดิองคใหมผูมีแนวคิดสอดคลองกับอุดมการณของเรามากกวา"
 SEA_japan_popup_events.6.a: "ถาเชนนั้นพระองคตองสละราชสมบัติใหพระโอรส"
 SEA_japan_popup_events.6.b: "กักบริเวณพระองคไว!"

 SEA_japan_popup_events.7.t: "ฮิโรฮิโตะถูกลอบปลงพระชนม!"
 SEA_japan_popup_events.7.desc: "เมื่อชวงตนวันนี้มีรายงานวานายทหารของเราพบจักรพรรดิโชวะสวรรคตในที่ประทับ พวกเขาอางวาพระองคถูกสายลับตางชาติลอบปลงพระชนม แตเราไมอาจรูไดแนชัด เพราะความจริงอาจทํารายเรามากกวาเปนประโยชน ดวยภัยคุกคามนี้ กองทัพจึงประกาศกฎอัยการศึก และแถลงวาเจาชายชิจิบุ นายพลแหงกองทัพบกจักรวรรดิ จะขึ้นครองราชย เนื่องจากอันตรายเกินไปที่จะสืบราชสันตติวงศตามปกติและถวายราชบัลลังกแกอากิฮิโตะในขณะที่คนรายอาจยังลอยนวลอยู นี่เปนสวนหนึ่งของแผนสมคบคิดที่ใหญกวา หรือมีคนรายตางชาติจริง ๆ?"
 SEA_japan_popup_events.7.a: "ยาซูฮิโตะจะขึ้นแทนที่"

 SEA_japan_popup_events.8.t: "ปญหาการนําของกลุมทหาร"
 SEA_japan_popup_events.8.desc: "เมื่อรัฐบาลทหารชุดใหมของเราไดสถาปนาขึ้น ปญหาเรื่องผูนําก็กลับมาอีกครั้ง ซาดาโอะ อารากิ ผูกอตั้งโคโดฮะ ประกาศวาเขาประสงคจะรับตําแหนงนายกรัฐมนตรีและไดกราบบังคมทูลเรื่องนี้ตอจักรพรรดิแลว แตดวยจินซาบูโร มาซากิ เปนที่นิยมมากกวาอารากิทั้งในหมูทหารและประชาชนทั่วไป อาจเปนการดีกวาที่จะใหเขาดํารงตําแหนงนายกรัฐมนตรี ขณะที่อารากิรับตําแหนงเชิงพิธีการเทานั้น เราควรทําอยางไร?"
 SEA_japan_popup_events.8.a: "มาซากิเปนที่นิยมมากกวาในหมูทหาร"
 SEA_japan_popup_events.8.b: "อารากิควรไดเปนโซโตของชาติ"

 SEA_japan_popup_events.9.t: "ปญหาศีลธรรม บูชิโด และฟาสซิสต"
 SEA_japan_popup_events.9.desc: "นายพลซาดาโอะ อารากิ นักปรัชญาการเมืองผูมีชื่อเสียงในกองทัพ ไดเชื่อมโยงวิถีบูชิโดโบราณของซามูไรเขากับแนวคิดที่คลายฟาสซิสตแบบยุโรป เพื่อสรางรากฐานทางปรัชญาของอุดมการณของเขา ซึ่งหลอมรวมจักรพรรดิ ประชาชน แผนดิน และศีลธรรมเขาเปนหนึ่งเดียวที่ไมอาจแบงแยก เพื่อเสริมความแข็งแกรงใหแนวคิดเหลานี้ อาจเปนการดีที่จะรับรูปแบบการปกครองที่ใกลเคียงกับชาติตะวันตกที่เขาใชเปนตนแบบทางอุดมการณ เราจะวาอยางไร?"
 SEA_japan_popup_events.9.a: "เราตองอยูหางจากแนวคิดตะวันตกเชนนั้น!"
 SEA_japan_popup_events.9.b: "อารากิพูดถูก เราควรรับแนวคิดเหลานั้น"

 SEA_japan_popup_events.10.t: "ขาวลือรัฐประหารโดยทหาร"
 SEA_japan_popup_events.10.desc: "ชวงนี้มีขาวลือแพรสะพัดวากลุมโคโดฮะ กลุมอนุรักษนิยมสุดโตงในกองทัพ กําลังวางแผนกอรัฐประหาร ดูเปนไปไดวาพวกเขาจะรอจนกวาการพิจารณาคดีของพันโทซาบูโร ไอซาวะ ผูเปนกําลังสําคัญขององคกรจะสิ้นสุดลง เมื่อพิจารณาจากแรงจูงใจที่เปนไปได พวกเขานาจะพยายามลอบสังหารผูคนจํานวนมากที่พวกเขามองวาเปนภัยตอคุณคาของตนระหวางการรัฐประหารนี้ เราอาจตองลงมือโดยเร็ว มิฉะนั้นอาจไดเห็นการนองเลือดในอนาคตอันใกล"
 SEA_japan_popup_events.10.a: "ชางไรเกียรติ! เราตองลงมือโดยเร็ว!"

 SEA_japan_popup_events.11.t: "ขาวลือการลุกฮือของประชาชน"
 SEA_japan_popup_events.11.desc: "ดวยจักรพรรดิยังคงถูกกักบริเวณ แมเวลาจะผานไปนานนับตั้งแตเราสถาปนารัฐบาล ความไมพอใจก็ยิ่งเพิ่มพูนขึ้นอยางรวดเร็ว ดูเหมือนประชาชนของเราปรารถนาจะเห็นฮิโรฮิโตะไดคืนสูราชบัลลังกอยางสมพระเกียรติ และอาจถึงขั้นเตรียมลงมือปลดปลอยพระองค หากเราไมทําอะไรสักอยางกับสถานการณนี้ในเร็ววัน บางทีพวกเขาอาจสงบลงบางหากไมมีบุคคลที่จะกลับขึ้นครองราชยไดอีก ไมวาการทําเชนนั้นจะทําใหเราไมเปนที่นิยมเพียงใด เราควรรับมือเรื่องนี้อยางไร?"
 SEA_japan_popup_events.11.a: "ออกคําสั่งไป แตพยายามอยาทิ้งหลักฐาน"
 SEA_japan_popup_events.11.b: "ไม อดีตจักรพรรดิตองมีชีวิตอยู!"

 SEA_japan_popup_events.12.t: "พบจักรพรรดิสวรรคตในที่ประทับ"
 SEA_japan_popup_events.12.desc: "นายกรัฐมนตรีแถลงเมื่อชวงตนวันนี้วาเพิ่งพบอดีตจักรพรรดิโชวะสวรรคตในพระตําหนักหลวง หลายคนสงสัยวาอาจเปนการกระทําโดยเจตนาของกองทัพเพื่อรักษาอํานาจของตน แมแถลงการณอยางเปนทางการจะระบุวาพระองคสวรรคตดวยสาเหตุตามธรรมชาติ แตตํารวจโตเกียวกลับไมไดรับอนุญาตใหเขาไปยืนยันสาเหตุการสวรรคต นี่ยอมเปนการกบฏของกองทัพเองแน ๆ?"
 SEA_japan_popup_events.12.a: "ทั้งชาติไวทุกข"
 SEA_japan_popup_events.12.b: "หาตัวคนรายใหได นางาโกะตองการคําตอบ!"

 SEA_japan_popup_events.13.t: "นายทหารโคโดฮะถูกฟองขอหาปลงพระชนมฮิโรฮิโตะ"
 SEA_japan_popup_events.13.desc: "จากการสืบสวนลาสุดของกรมตํารวจนครบาลโตเกียวตามคําสั่งของนางาโกะ พระมเหสีในจักรพรรดิโชวะผูลวงลับ พบวากลุมโคโดฮะเปนผูอยูเบื้องหลังการปลงพระชนมอดีตจักรพรรดิอยางเลือดเย็นจริง ดวยหลักฐานที่มากเกินพอจะประกาศวานี่คือกบฏรายแรง ถึงเวลาแลวที่จะขับไลกลุมทรยศนี้ออกจากอํานาจ"
 SEA_japan_popup_events.13.a: "ประกาศกฎอัยการศึก นางาโกะจะยุติความไรเสถียรภาพของชาติ!"

 SEA_japan_popup_events.14.t: "ผลการเลือกตั้งทั่วไปป 1936"
 SEA_japan_popup_events.14.desc: "แมจะอยูในชวงเวลาอันตราย แตการเลือกตั้งทั่วไปก็เสร็จสิ้นลง และประชาชนไดตัดสินแลววาใครจะเปนผูแทนของตนในสภาผูแทนราษฎร พรรคริกเก็นมินเซโตภายใตการนําของมาจิดะ ชูจิ ไดที่นั่งมากที่สุด ขณะที่พรรคริกเก็นเซยูไกเสียเสียงขางมากไป แมจะไมมีความสําคัญมากนักเนื่องจากอํานาจของรัฐบาลพลเรือนที่ลดลงเรื่อย ๆ แตการเลือกตั้งครั้งนี้แสดงใหเห็นวาประชาธิปไตยของเรายังคงยืนหยัดอยู แมจะเปราะบางเพียงใดก็ตาม"
 SEA_japan_popup_events.14.a: "ขอใหมาจิดะ ชูจิ นําพรรคริกเก็นมินเซโตไดดี" 

 SEA_japan_popup_events.15.t: "โอกาดะถูกสังหารที่สถานีโตเกียว"
 SEA_japan_popup_events.15.desc: "เชาวันนี้ นายกรัฐมนตรีเคซูเกะ โอกาดะ ถูกเจาหนาที่ตํารวจลับโทกโกยิงเสียชีวิตขณะรอขึ้นรถไฟสายยามาโนเตะที่สถานีโตเกียว ไมนานหลังจากนั้น กองทัพไดออกคําขูตอสภาไดเอ็ตจักรวรรดิวาความพยายามใด ๆ ที่จะกีดกันพวกเขาจะถูกตอบโตดวยกําลัง นี่คือการยกระดับสถานการณอยางชัดเจน และนายกรัฐมนตรีรักษาการมาจิดะ ชูจิ ไดกราบบังคมทูลขอใหจักรพรรดิทรงรับรูสถานการณและมีพระราชดํารัส มีเพียงเวลาเทานั้นที่จะบอกไดวาพระองคจะทรงเขาขางฝายใด"
 SEA_japan_popup_events.15.a: "ตองหยุดพวกเขาใหได!" 

 SEA_japan_popup_events.16.t: "จักรพรรดิทรงเสนอชื่อนายกรัฐมนตรีคนใหม"
 SEA_japan_popup_events.16.desc: "ตามคํากราบบังคมทูลลาสุดของนายกรัฐมนตรีรักษาการมาจิดะ ชูจิ จักรพรรดิฮิโรฮิโตะทรงมีพระราชดํารัสตอตานความรุนแรงที่เกิดจากความขัดแยงระหวางกลุมกกที่ดําเนินอยู และทรงตัดสินพระทัยแลววาจะเสนอชื่อผูใดขึ้นเปนนายกรัฐมนตรีคนใหมในชวงเวลาอันยากลําบากนี้ ผูที่พระองคทรงเสนอชื่อคือ..."
 SEA_japan_popup_events.16.a: "มาจิดะ ชูจิ ฝายเสรีนิยม" 
 SEA_japan_popup_events.16.b: "อาเบะ อิโซโอ ฝายสังคมนิยม" 
 SEA_japan_popup_events.16.c: "ประธานสภาขุนนาง โทกูงาวะ อิเอซาโตะ" 

 SEA_japan_popup_events.17.t: "กองทัพประกาศนัดหยุดงาน"
 SEA_japan_popup_events.17.desc: "เจาหนาที่ระดับสูงจํานวนมากทั้งในกองทัพบกจักรวรรดิญี่ปุนและกองทัพเรือจักรวรรดิญี่ปุนไดประกาศวากองทัพจะนัดหยุดงาน หลังรัฐบาลของเราประกาศยุติอิทธิพลของพวกเขาเหนือการเมือง พวกเขากลาววาจะไมปกปองรัฐบาลปจจุบันหากเกิดการโจมตีขึ้น และนาจะกําลังวางแผนรัฐประหารอีกครั้งเพื่อโคนนายกรัฐมนตรีของเราจากอํานาจ"
 SEA_japan_popup_events.17.a: "สถานการณกําลังรอนแรงขึ้น..." 

 SEA_japan_popup_events.18.t: "กองทัพตั้งมั่นรอรับมือ"
 SEA_japan_popup_events.18.desc: "กองทัพเริ่มเตรียมการปะทะกับกองกําลังที่ภักดีตอรัฐบาล หลังกองกําลังตํารวจพลเรือนประกาศความภักดีตอสภาไดเอ็ตเมื่อไมนานนี้ ดูเหมือนพวกเขาพยายามยึดกุมพื้นที่ตาง ๆ ไวเผื่อเกิดสงครามกลางเมือง เราตองเรงตอบโตการกอการกําเริบนี้โดยเร็วที่สุด!"
 SEA_japan_popup_events.18.a: "สงตํารวจนครบาลไปยังโตเกียวทันที!"
 SEA_japan_popup_events.18.b: "เราตองไมใหพวกเขายึดเขตอุตสาหกรรมได!"
 enables_the_civil_war_decisions_tt: "เราจะสามารถยึดรัฐตาง ๆ ใหเขารวมฝายเราไดผานการตัดสินใจบนแผนที่ หากเกิด§Yสงครามกลางเมือง§!ขึ้น"

 JAP_shanghai_ultimatum: "คําขาดหงโขว"

 SEA_japan_popup_events.19.t: "คําขาดหงโขว"
 SEA_japan_popup_events.19.desc: "หลังนายทหารญี่ปุนอีกนายถูกสังหารในเซี่ยงไฮ เราไดรับคําขาดวาหากเราไมถอนตัวออกจากภูมิภาคนี้ทั้งหมด พวกเขาจะโจมตีภายในสัปดาหนี้ \n\nเราควรตอบโตอยางไร?"
 SEA_japan_popup_events.19.a: "เราตองไมยอมตามขอเรียกรองของพวกเขา!"
 SEA_japan_popup_events.19.b: "คนของเราทําเกินไปแลว ถอนกําลัง!"

 SEA_japan_popup_events.20.t: "[FROM.GetLeader] ปฏิเสธคําขาดหงโขว"
 SEA_japan_popup_events.20.desc: "ทางการจีนอางวา 'ถึงจุดแตกหัก' แลวตอ 'การรุกรานโดยไรเหตุผล' ของเราตอจีน! ขอเรียกรองคาปฏิกรรมของเราถูกปฏิเสธ และมีรายงานวาพลเมืองญี่ปุนถูกโจมตีเพิ่มขึ้นในเซี่ยงไฮ หากเราตองการขออางเพื่อจัดการกับจีนอยางเด็ดขาด นี่แหละคือขออางนั้น!"
 SEA_japan_popup_events.20.a: "พวกเขาตองชดใช!"

 SEA_japan_popup_events.21.t: "[FROM.GetLeader] ลงนามยอมรับคําขาดหงโขว"
 SEA_japan_popup_events.21.desc: "นาประหลาดใจที่จีนเลือกจะถอยหลังคําขาดเรื่องการควบคุมเซี่ยงไฮ พวกเขาเขาใจดีวาการทําใหเราโกรธมีราคาแพง และยอมตกลงสละดินแดนจํานวนมากรวมถึงตัวเมืองและพื้นที่โดยรอบ ทีละเล็กทีละนอย จีนกําลังกลายเปนของเรา"
 SEA_japan_popup_events.21.a: "สงครามตองรอไปกอน"

 SEA_japan_popup_events.22.t: "การลอมปราสาทโอซากะ"
 SEA_japan_popup_events.22.desc: "หลังทราบขาวการยกเลิกกฎหมายรักษาความสงบอันเปนที่ถกเถียง กองรักษาการณของกองทัพที่กองบัญชาการในปราสาทโอซากะก็เปดฉากยิงใสกองรักษาการณฝายรัฐบาลที่ประจําอยูนอกสวน ดูเหมือนพวกเขาจะไมยอมถอยโดยไมสู และพรอมจะฉีกจิตวิญญาณของชาติเราใหแตกแยกหากนั่นหมายถึงการรักษาอํานาจครอบงําของตนไว เราตองโคนพวกเขาลงใหได!"
 SEA_japan_popup_events.22.a: "ถึงเวลานําจิตวิญญาณแหงยุคไทโชกลับคืนมาแลว!"

 SEA_japan_popup_events.23.t: "จักรพรรดิผูนิ่งเฉย"
 SEA_japan_popup_events.23.desc: "ความชอบธรรมของจักรพรรดิฮิโรฮิโตะถูกตั้งคําถามนับตั้งแตพระองคทรงนิ่งเฉยตอการที่กองทัพเขาครอบงําการเมืองมากขึ้นเรื่อย ๆ และไมทรงทําสิ่งใดเมื่อความรุนแรงระหวางกลุมกกในประเทศทวีขึ้น บัดนี้หลายคนเรียกรองใหพระอนุชาองคหนึ่งของพระองค คือโนบูฮิโตะ ผูทรงสนับสนุนรัฐบาลพลเรือนอยางเปดเผย ขึ้นดํารงพระอิสริยยศจักรพรรดิ เนื่องจากพระเชษฐาทั้งสองพระองคลวนกระทําการเปนกบฏ สิ่งนี้จะชวยรักษาการสนับสนุนจากราชวงศตอรัฐบาลปจจุบันของเรา และเสริมขวัญกําลังใจของประชาชน"
 SEA_japan_popup_events.23.a: "ก็ได โนบูฮิโตะจะขึ้นแทนที่"

 SEA_japan_popup_events.24.t: "กองทัพบกจักรวรรดิยอมจํานน"
 SEA_japan_popup_events.24.desc: "กองทัพบกจักรวรรดิกลุมสุดทายบนหมูเกาะหลักไดโบกธงขาว เปนสัญญาณยุติความขัดแยงยาวนานหลายทศวรรษระหวางรัฐบาลของชาติเรากับกองทัพของตนเอง ประเทศเสียหายจากการสูรบเปนวงกวาง แตนี่คือการเริ่มตนใหมของประชาชนชาว[ROOT.GetAdjective] ศัตรูของเรายังคงหลงเหลืออยูโพนทะเล แตบัดนี้คือเวลาแหงการฟนฟู รัฐบาลไดวางแผนจัดการเลือกตั้งทั่วไปครั้งแรกแลว เมื่อกลุมคนฉอฉลไมอาจแทรกแซงไดอีกตอไป"
 SEA_japan_popup_events.24.a: "เราไดทวงคืนอนาคตของเราแลว!"

 SEA_japan_popup_events.25.t: "การเลือกตั้งทั่วไป"
 SEA_japan_popup_events.25.desc: "การเลือกตั้งครั้งแรกหลังจากกองทัพถูกขจัดออกจากการเมืองกําลังจัดขึ้น และประชาชนตางออกไปใชสิทธิ์เพื่อกําหนดอนาคตของชาติ การเลือกตั้งครั้งนี้เปนการชิงชัยระหวางพรรคริกเก็นมินเซโตฝายเสรีนิยม กับพรรคริกเก็นเซยูไกที่อนุรักษนิยมกวา ซึ่งตางก็เคยนําสภาไดเอ็ตจักรวรรดิเมื่อไมนานมานี้ บัตรเลือกตั้งกําลังถูกหยอนลงหีบ และอีกไมนานผูชนะก็จะปรากฏ"
 SEA_japan_popup_events.25.a: "พรรคริกเก็นมินเซโตไดรับชัยชนะ!"
 SEA_japan_popup_events.25.b: "พรรคริกเก็นเซยูไกไดรับชัยชนะ!"

 SEA_japan_popup_events.26.t: "รัฐประหารของกองทัพกวานตง"
 SEA_japan_popup_events.26.desc: "ขณะที่สงครามกลางเมืองระหวางกองทัพและรัฐบาลในญี่ปุนกําลังลุกโชน กองทัพกวานตงที่ประจําอยูในประเทศของเราไดฉวยโอกาสกอรัฐประหารตอรัฐบาลของเรา โดยหวังจะสรางรัฐขุนศึกศักดินาของตนเองขึ้นในแมนจูเรีย เราควรปลอยใหเรื่องนี้เกิดขึ้น หรือควรตอตานดวยทุกสิ่งที่มี?"
 SEA_japan_popup_events.26.a: "ตอตานไปก็ไรประโยชน"
 SEA_japan_popup_events.26.b: "ถึงเวลาทําลายแอกของญี่ปุนแลว!"
 MAN_kwantung_will_try_to_occupy_east_hebei_tt: "สิ่งนี้จะทําใหเราใชความชวยเหลือของกองทัพกวานตงเพื่อยึดครอง[609.GetName]ได"

 SEA_japan_popup_events.27.t: "โอกาสทอง"
 SEA_japan_popup_events.27.desc: "ขณะที่สงครามกลางเมืองระหวางกองทัพและรัฐบาลในญี่ปุนกําลังลุกโชน ชาวเกาหลีตระหนักวานี่คือเวลาที่จะทวงคืนประเทศของตนและขับไลผูกดขี่ชาวญี่ปุนออกไป คาบสมุทรเกาหลีจะรุงเรืองภายใตการปกครองของประชาชนของตนเองอีกครั้ง"
 SEA_japan_popup_events.27.a: "ขับไลผูรุกรานลงทะเลไป!"

 SEA_japan_popup_events.28.t: "ฐานปฏิบัติการในชนบท"
 SEA_japan_popup_events.28.desc: "พรรคคอมมิวนิสตตัดสินใจเริ่มปฏิบัติการใตดิน ใหพนสายตาและความสนใจของทั้งกองทัพบกจักรวรรดิและรัฐบาล คําถามเดียวที่พวกเขาตองคิดในตอนนี้คือ ภูมิภาคใดหางไกลพอที่โอกาสจะถูกคนพบและกวาดลางตํ่าที่สุด?"
 SEA_japan_popup_events.28.a: "ฮกไกโดเหมาะที่สุด"
 SEA_japan_popup_events.28.b: "ชิโกกุหางไกลพอ"
 SEA_japan_popup_events.28.c: "ตั้งสาขาที่คาโกชิมะ"

 SEA_japan_popup_events.29.t: "เหตุการณมิยาซากิ"
 SEA_japan_popup_events.29.desc: "เชาตรูวันนี้ กองกําลังของกองทัพบกจักรวรรดิไดบุกยึดโกดังแหงหนึ่งชานเมืองมิยาซากิที่นักปฏิวัติคอมมิวนิสตซอนตัวอยู เพื่อพยายามจับกุมพวกเขา ขณะเดียวกัน คีวอิจิ โทกูดะ ไดรับการชวยเหลือออกจากเรือนจําอาบาชิริโดยกองโจรคอมมิวนิสตในทองถิ่น และหลังการยิงปะทะที่โกดังมิยาซากิ โทกูดะก็ออกคําสั่งผานการกระจายเสียงทางวิทยุใหเริ่มการปฏิวัติโดยเร็วที่สุด ดูเหมือนเวลาแหงการลงมือมาถึงแลว"
 SEA_japan_popup_events.29.a: "การปฏิวัติเริ่มตนขึ้นแลวในที่สุด!"
 JAP_democratic_side_also_spawns_tt: "§Yรัฐบาลประชาธิปไตย§!จะพยายามตอบโตการปฏิวัติของเราดวย!"

 SEA_japan_popup_events.30.t: "การถกเถียงเรื่องทิศทางในอนาคตของรัฐ"
 SEA_japan_popup_events.30.desc: "เมื่อสถานการณมีเสถียรภาพมากขึ้นหลังกองทัพบกจักรวรรดิพายแพ การถกเถียงก็ปะทุขึ้นในสภาแหงชาติวาควรเดินไปทางใด กลุมโคซะฮะยืนยันวามีเพียงการใชชนชั้นกรรมาชีพและการชี้นําแบบอํานาจนิยมเพื่อกํากับประชาชนเทานั้นที่จะนําเราไปสูอนาคตในอุดมคติ ขณะที่กลุมโรโนฮะยืนยันวาขบวนการรมใหญที่ออนโยนและกาวกายนอยกวาจะเหมาะสมที่สุดในการควบคุมรัฐ แนวคิดใดควรถูกนํามาใช?"
 SEA_japan_popup_events.30.a: "โคซะฮะเปนฝายถูก"
 SEA_japan_popup_events.30.b: "อุดมการณของโรโนฮะเจิดจรัสที่สุดในวันนี้"
 JAP_supported_the_kozaha_idea_flag: "สนับสนุนโคซะฮะในการถกเถียง"
 JAP_supported_the_rounoha_idea_flag: "สนับสนุนโรโนฮะในการถกเถียง"
 JAP_supported_the_kozaha_idea_tt: "จะปลดล็อกแผนยุทธศาสตร §Y$JAP_the_lecture_group_ascendant$§!"
 JAP_supported_the_rounoha_idea_tt: "จะปลดล็อกแผนยุทธศาสตร §Y$JAP_the_labor_farmer_faction_ascendant$§!"

 SEA_japan_popup_events.31.t: "ผูนําของโคซะฮะ"
 SEA_japan_popup_events.31.desc: "เมื่อการปฏิวัติไดรับชัยชนะและอํานาจอยูในมือของโคซะฮะ ถึงเวลาเลือกนายกรัฐมนตรีของสาธารณรัฐประชาชนแหงใหมแลว ตัวเต็งของพรรคสองคนในชวงสงครามคือซันโซ โนซากะ และคีวอิจิ โทกูดะ และเมื่อการปฏิวัติไดรับชัยชนะ ทั้งคูตางแสดงใหเห็นวามีทั้งความสามารถและความพรอมจะนําเราไปสูคอมมิวนิสต แมแนวคิดทางอุดมการณจะไมตรงกันเสมอไป แตทั้งคูตางมีศักยภาพสูง ผูที่จะไดรับเลือกจึงขึ้นอยูกับโชคชะตาลวน ๆ จะเปนโนซากะผูมีสายสัมพันธระหวางประเทศ หรือโทกูดะผูมีประสบการณมากกวาแตอาจไมเปนที่นิยมกวางขวางเทา?"
 SEA_japan_popup_events.31.a: "ซันโซ โนซากะ เปนที่นิยม"
 SEA_japan_popup_events.31.b: "คีวอิจิ โทกูดะ มีประสบการณ"

 SEA_japan_popup_events.32.t: "ผูนําของโรโนฮะ"
 SEA_japan_popup_events.32.desc: "หลังสงครามกลางเมืองสิ้นสุดและการปฏิวัติไดรับชัยชนะ กลุมกรรมกร-ชาวนาไดรับความไววางใจจากพรรคและประชาชน ดวยอุดมการณที่ไมเครงตามขนบนัก พวกเขาจึงไดผูติดตามมากมายและไดครองอํานาจในที่สุด แตคําถามหลักยังคงอยู ใครจะเปนนายกรัฐมนตรีคนตอไปของสาธารณรัฐ? มีผูสมัครสามคนแตการเลือกตั้งรอบสุดทายยังไมเกิดขึ้น จะเปนฮิโตชิ ยามากาวะ ผูเปนบุคคลสําคัญในขบวนการสังคมนิยมและไดพิสูจนประสบการณมาแลว? จะเปนคันซน อาราฮาตะ ผูรวบรวมแรงสนับสนุนจากประชาชนไดมหาศาลจนไดรับเลือกเปนประธานไปแลว? หรือจะเปนยามากาวะ คิกุเอะ ผูที่แมจะโดดเดนในพรรคนอยกวา แตไดแสดงใหเห็นวาเหมาะสมทั้งในฐานะผูนําและนักปฏิรูป?"
 SEA_japan_popup_events.32.a: "ฮิโตชิ ยามากาวะ มีประสบการณ"
 SEA_japan_popup_events.32.b: "คันซน อาราฮาตะ ไดรับการสนับสนุนจากประชาชน"
 SEA_japan_popup_events.32.c: "ยามากาวะ คิกุเอะ มีแนวคิดปฏิวัติที่สุด"

 SEA_japan_popup_events.33.t: "ชะตากรรมของราชวงศ"
 SEA_japan_popup_events.33.desc: "เมื่ออํานาจอยูในมือของประชาชนอยางมั่นคงแลว ปญหาเรื่องอดีตราชวงศก็ยังคงคางคาอยู มีความเห็นแตกตางกันมากมายวาควรจัดการกับพวกเขาอยางไร บางสนับสนุนการปฏิรูปและลดสถานะพวกเขาลงเปนกรรมกรธรรมดา ขณะที่บางยืนยันวาพวกเขาควรไดรับโทษที่หนักกวานั้นสําหรับอาชญากรรมตอประชาชนทั้งในชวงสงครามและกอนหนานั้นนาน การตัดสินใจยังไมเปนที่ยุติ แตไมวาจะเลือกทางใด ยอมมีเสียงคัดคานที่อาจตองจัดการ"
 SEA_japan_popup_events.33.a: "ใหพวกเขาใชชีวิตอยางคนธรรมดา"
 SEA_japan_popup_events.33.b: "ใหพวกเขารับโทษในเรือนจํา"
 SEA_japan_popup_events.33.c: "พวกเขาอันตรายเกินกวาจะปลอยใหมีชีวิตอยู!"
 SEA_japan_popup_events.33.d: "เนรเทศพวกเขา"

 SEA_japan_popup_events.34.t: "การถกเถียงเรื่องทฤษฎีการปฏิวัติไอนุ"
 SEA_japan_popup_events.34.desc: "นักคิดทางการเมืองของเราหลายคนใหเหตุผลวาชนชั้นกรรมาชีพไรราก (ลุมเพนโปรเลทาเรียต) คือกําลังหลักของการปฏิวัติ และชาวไอนุก็รวมอยูในกลุมนี้ดวย ยิ่งไปกวานั้น พวกเขาเชื่อวาชาวไอนุใชชีวิตในระบบคอมมิวนิสตดั้งเดิมมาตลอด และเห็นวาพวกเขาคูควรจะเปน 'ผูนําการปฏิวัติคอมมิวนิสต' แตคําถามตอนนี้คือ ควรเปนเชนนั้นในรูปแบบใด? ควรผนวกขนบธรรมเนียมของพวกเขาเขากับสังคมสังคมนิยมของเรา หรือควรมอบอํานาจปกครองตนเองใหแกชาวไอนุ?"
 SEA_japan_popup_events.34.a: "เราควรใชประโยชนจากขนบธรรมเนียมอันนาทึ่งของพวกเขา"
 SEA_japan_popup_events.34.b: "ผูนําการปฏิวัติเหลานี้ตองไดรับอํานาจปกครองตนเองที่พวกเขาสมควรได!"

 SEA_japan_popup_events.35.t: "[FROM.GetLeader] ตองการใหอํานาจแกราชวงศอี"
 SEA_japan_popup_events.35.desc: "เจาเหนือหัวของเรา [FROM.GetNameDef] เรียกรองใหผูสําเร็จราชการอาณานิคมของเราลงจากตําแหนงเพื่อเปดทางใหอี อึน รัชทายาทแหงราชบัลลังก[ROOT.GetAdjective] ผูภักดีตอจักรวรรดิญี่ปุน นี่ฟงดูเปนขอเสนอที่ดีเกินกวาจะปลอยผาน"
 SEA_japan_popup_events.35.a: "เรายินดีตอบรับ"
 SEA_japan_popup_events.35.b: "ไม ตําแหนงผูสําเร็จราชการตองคงอยู!"

 SEA_japan_popup_events.36.t: "[FROM.GetNameDefCap] ปลุกกระแสคอมมิวนิสต"
 SEA_japan_popup_events.36.desc: "เราไดรับรายงานวาขณะนี้มีกลุมเซลลของ[FROM.GetAdjective] เคลื่อนไหวอยูในประเทศของเรา เผยแพรแนวคิดคอมมิวนิสต แมจะดูไมเปนพิษเปนภัยนัก แตโฆษณาชวนเชื่อบางสวนดูจะมีลักษณะปลุกปนใหปฏิวัติ รายงานวาคนงานถูกยุยงใหรวมตัวจัดตั้งกลุมมีบอยขึ้นเรื่อย ๆ และเมื่อพิจารณาจากประวัติศาสตรไมนานมานี้ เราไมอาจแนใจไดวานี่ไมใชแผนการอันแยบยลของผูนํา[FROM.GetAdjective] ที่จะผนวกรวมเราในทายที่สุด"
 SEA_japan_popup_events.36.a: "ปลอยใหพวกเขาทําตอไป"
 SEA_japan_popup_events.36.b: "ปราบปรามนักปลุกระดมสังคมนิยมพวกนี้!"

 SEA_japan_popup_events.37.t: "[FROM.GetNameDefCap] ปลุกกระแสคอมมิวนิสต"
 SEA_japan_popup_events.37.desc: "เราไดรับรายงานวาขณะนี้มีกลุมเซลลของ[FROM.GetAdjective] เคลื่อนไหวอยูในประเทศของเรา เผยแพรแนวคิดคอมมิวนิสต แมตัวมันเองจะดูไมเปนพิษเปนภัยนัก แตโฆษณาชวนเชื่อบางสวนดูจะมีลักษณะปลุกปนใหปฏิวัติ รายงานวาคนงานถูกยุยงใหรวมตัวจัดตั้งกลุมมีบอยขึ้นเรื่อย ๆ และเมื่อพิจารณาจากประวัติศาสตรไมนานมานี้ เราไมอาจแนใจไดวานี่ไมใชแผนการอันแยบยลของผูนํา[FROM.GetAdjective] ที่จะผนวกรวมเราในทายที่สุด"
 SEA_japan_popup_events.37.a: "ปลอยใหพวกเขาทําตอไป"
 SEA_japan_popup_events.37.b: "ปราบปรามนักปลุกระดมสังคมนิยมพวกนี้!"

 SEA_japan_popup_events.38.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 SEA_japan_popup_events.38.desc: "หลังกระแสคอมมิวนิสตเติบโตมาเปนเวลานาน ดูเหมือนชนชั้นกรรมาชีพชาว[ROOT.GetAdjective] จะเหนื่อยหนายกับการรอคอยการเปลี่ยนรัฐบาลอยางสันติแลว หลังการถกเถียงอยางดุเดือด การทูตก็ลมเหลวและนําไปสูการปะทะดวยอาวุธ"
 SEA_japan_popup_events.38.a: "เพื่อชนชั้นกรรมาชีพ!"
 SEA_japan_popup_events.38.b: "เราตองหยุดความบาคลั่งนี้!"

 SEA_japan_popup_events.39.t: "การฟนฟูพุทธศาสนา"
 SEA_japan_popup_events.39.desc: "เนื่องจากขบวนการรมใหญของเราไดรวมขบวนการสังคมนิยมตาง ๆ ทั่วญี่ปุนเขามา ขบวนการพุทธสังคมนิยมที่มีกิโร เซโนโอ เปนผูนําจึงเติบโตอยางรวดเร็ว และสันนิบาตเยาวชนเพื่อการฟนฟูพุทธศาสนาก็กลายเปนขบวนการหลักของเยาวชนสังคมนิยมของเรา บัดนี้ สึจิ จุน ที่ปรึกษาของพรรคไดกดดัน[ROOT.GetLeader] ในเรื่องผูนํา โดยอางวารัฐจะดีขึ้นหากกิโร เซโนโอ ผูเปนที่นิยมมากขึ้นทุกวันไดขึ้นนําพรรค นี่คือหนทางที่ถูกตองสูการหลุดพนทางจิตวิญญาณ ตลอดจนการปลดปลอยทางสังคมและเศรษฐกิจหรือไม?"
 SEA_japan_popup_events.39.a: "นี่คือหนทางขางหนา!"
 SEA_japan_popup_events.39.b: "ไม [ROOT.GetLeader] จะนําตอไป"

 SEA_japan_popup_events.40.t: "รายงานนากังวลเรื่องการขยายดินแดนของ[JAP.GetAdjective]"
 SEA_japan_popup_events.40.desc: "ขณะที่[JAP.GetNameDef] ขยายอํานาจในเอเชียอยางรวดเร็ว ยึดครองเพื่อนบานและทําลายลางชาติเหลานั้น อุตสาหกรรมและทรัพยากรธรรมชาติของเรายังคงคํ้าจุนเศรษฐกิจของพวกเขา และไหลเขาสูโรงงานของพวกเขาเพื่อแปรเปนอาวุธสงคราม บัดนี้ประชาชนของเราวิพากษวิจารณเรื่องนี้มากขึ้นเรื่อย ๆ และเรียกรองใหลงมือทําอะไรสักอยาง เราควรทําอยางไร?"
 SEA_japan_popup_events.40.a: "เราจะปอนวัตถุดิบใหสงครามของพวกเขาตอไปไมได!"
 SEA_japan_popup_events.40.b: "ประเทศในเอเชียไมเปนภัยตอเราหรอก ไมเปนไร"

 SEA_japan_popup_events.41.t: "การควํ่าบาตรของ[FROM.GetAdjective]"
 SEA_japan_popup_events.41.desc: "ดูเหมือนพลเมือง[FROM.GetAdjective] ผูกระหายสงครามไดกดดันให[FROM.GetLeader] แหง[FROM.GetNameDef] ควํ่าบาตรเรา โดยอางเหตุจากการขยายดินแดนอยางพอประมาณและการปราบศัตรูของเราใหสงบ ซึ่งเปนการตัดสินใจที่ไมรอบคอบ พวกเขาตัดสินวาจะไมมีการคาระหวางชาติของเราอีกตอไป ซึ่งเปนการละเมิดความเปนกลางที่มีตอเราอยางชัดเจน..."
 SEA_japan_popup_events.41.a: "พวกเขาหลงผิด"

 SEA_japan_popup_events.42.t: "ประชาชนหมดศรัทธาใน[ROOT.GetLeader]"
 SEA_japan_popup_events.42.desc: "เมื่อสมรภูมิตาง ๆ ของสงครามเอเชียตะวันออกกลายเปนทุงระเบิดทางการเมือง และดินแดนกวางใหญถูกปลอยทิ้งไวโดยไมมีการปองกันจากขาศึก ประชาชนเริ่มตั้งคําถามถึงความสามารถของ[ROOT.GetLeader] ในการเอาชนะสงคราม หากไมแกไขสถานการณโดยเร็ว ไมวาจะดวยการปลุกความพยายามในสงครามขึ้นใหมหรือการนําคณะรัฐมนตรีที่มีความสามารถมากกวาเขามา สงครามอาจเรียกไดวาพายแพแลว..."
 SEA_japan_popup_events.42.a: "เราตองยุติหลมโคลนนี้!"
 JAP_unlock_the_surrender_subbranch_tt: "ปลดล็อกแผนยุทธศาสตร §Y$JAP_the_koiso_cabinet$§!, §Y$JAP_the_war_has_not_necessarily_developed_focus$§!, §Y$JAP_japans_longest_day$§! และ §Y$JAP_the_surrender_broadcast$§! ซึ่งชวยใหถอด §Y$JAP_crumbling_military_cabinet_idea$§! ออกไดและอาจถอนตัวจากสงครามเอเชียตะวันออก"

 SEA_japan_popup_events.43.t: "เหตุการณคีวโจ"
 SEA_japan_popup_events.43.desc: "เมื่อทราบถึงพระราชประสงคของจักรพรรดิที่จะประกาศยุติสงครามเอเชียตะวันออกอยางเปนทางการ กลุมผูกอการหลายคนภายใตการบัญชาการของพันตรีเค็นจิ ฮาตานากะ ไดเคลื่อนไหวเพื่อโนมนาวกองทหารราชองครักษใหชวยยึดพระราชวังหลวงโตเกียวและกักบริเวณจักรพรรดิ นายพลชิซูอิจิ ทานากะ และทาเกชิ โมริ เตรียมพรอมจะปราบความพยายามรัฐประหารนี้อยางรวดเร็ว แตใครจะรูวาฝายใดจะเปนผูชนะ?"
 SEA_japan_popup_events.43.a: "บังอาจขัดพระราชประสงคของจักรพรรดิไดอยางไร?"
 SEA_japan_popup_events.43.b: "เมฆหมอกมืดตองหายไปจากรัชสมัยของจักรพรรดิ!"
 JAP_kyujo_incident_rebels_lost_flag: "กบฏคีวโจลมเหลว และผูกอการถูกจับกุม"
 JAP_kyujo_incident_rebels_won_flag: "กบฏคีวโจสําเร็จ และผูกอการไดกักบริเวณจักรพรรดิ"
 JAP_unlock_japans_longest_day_tt: "ปลดล็อกแผนยุทธศาสตร §Y$JAP_japans_longest_day$§!"
 JAP_unlock_surrender_broadcast_tt: "ปลดล็อกแผนยุทธศาสตร §Y$JAP_the_surrender_broadcast$§!"

 SEA_japan_popup_events.44.t: "การผงาดของคอรลูกีน ชอยบาลซาน"
 SEA_japan_popup_events.44.desc: "ในฐานะผูบัญชาการสูงสุดของกองทัพประชาชนมองโกเลีย และหนึ่งในนักปฏิวัติมองโกเลียคนสําคัญป 1921 คอรลูกีน ชอยบาลซาน จึงเปนผูสมควรอยางยิ่งที่จะนําประเทศของเราสูความยิ่งใหญ ดวยผลงานทางทหารเมื่อไมนานมานี้ เขาไดพิสูจนแลววามีความสามารถพอจะปกครองชาติในฐานะผูนําเพียงหนึ่งเดียวไดอยางแทจริง ถึงเวลาแลวหรือยังที่เขาจะรับตําแหนงประธานคณะรัฐมนตรีคนที่ 10?"
 SEA_japan_popup_events.44.a: "ถึงเวลาแลว"
 SEA_japan_popup_events.44.b: "ไม เขาตองอยูในสนามรบตอไป!"

 SEA_japan_popup_events.45.t: "ยึดครองรัฐบาลปกครองตนเองเหอเปยตะวันออก"
 SEA_japan_popup_events.45.desc: "หลังการลมสลายของกองบัญชาการกองทัพญี่ปุนอยางเปนทางการและสงครามกลางเมืองที่ตามมาบนหมูเกาะหลัก รัฐในอารักขาของญี่ปุนที่รูจักกันในชื่อรัฐบาลปกครองตนเองเหอเปยตะวันออก ซึ่งตั้งอยูตามชายแดนดานตะวันตกเฉียงใตของเรา ก็ไรการคุมครองแลว ถึงเวลาที่เราจะโจมตีและยึดมันไว ขณะที่รัฐบาล[JAP.GetAdjective] มีปญหาอื่นมากเกินกวาจะใสใจวาเกิดอะไรขึ้นบนแผนดินใหญ"
 SEA_japan_popup_events.45.a: "การรวบรวมอํานาจของเรายังดําเนินตอไป"

 SEA_japan_popup_events.46.t: "กองทัพกวานตงยึดครองเหอเปยตะวันออก"
 SEA_japan_popup_events.46.desc: "หลังการลมสลายของกองบัญชาการกองทัพญี่ปุนอยางเปนทางการและสงครามกลางเมืองที่ตามมาบนหมูเกาะหลัก อดีตรัฐในอารักขาของเราที่รูจักกันในชื่อรัฐบาลปกครองตนเองเหอเปยตะวันออก ซึ่งตั้งอยูตามชายแดนดานตะวันตกเฉียงใตของ[MAN.GetNameDef] ก็ไรการคุมครองแลว พวกเขาจึงตัดสินใจโจมตีและยึดมันไป ขณะที่รัฐบาลของเรามีปญหาอื่นมากเกินกวาจะใสใจวาเกิดอะไรขึ้นบนแผนดินใหญ"
 SEA_japan_popup_events.46.a: "เราจะจัดการพวกเขาทีหลัง..."

 SEA_japan_popup_events.47.t: "[FROM.GetNameDefCap] ยกเลิกสิทธิ์ในทรัพยากรของเราใน[655.GetName]"
 SEA_japan_popup_events.47.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] เพิ่งลงนามในเอกสารฉบับใหมยกเลิกสิทธิ์การทําปาไมและเหมืองแรของเราใน[655.GetName] ซึ่งเปนการเพิกเฉยอยางเลวทรามตอสนธิสัญญาที่เราลงนามไวตอนคืนภูมิภาคนี้ใหพวกเขาเมื่อสิ้นสุดสงครามกลางเมืองรัสเซีย"
 SEA_japan_popup_events.47.a: "พายุกําลังกอตัวทางเหนือ..."

 SEA_japan_popup_events.48.t: "[ROOT.GetLeader] ประกาศภาวะฉุกเฉินแหงชาติ"
 SEA_japan_popup_events.48.desc: "หลังกองทหารขาศึกยกพลขึ้นบกบนแผนดินของเรา [ROOT.GetLeader] ไดประกาศกฎอัยการศึกและภาวะฉุกเฉินแหงชาติจนกวาผูรุกรานจะถูกขับไลออกจากแผนดินของเรา ไมมีใครรูวาจะใชเวลานานเทาใด แตทุกคนรูวาแผนดินนี้กลับมาอยูใตการควบคุมเบ็ดเสร็จของตระกูลโทกูงาวะอีกครั้ง"
 SEA_japan_popup_events.48.a: "การมอบอํานาจเบ็ดเสร็จแกโทกูงาวะไมเคยผิดพลาดมากอน"

 SEA_japan_popup_events.49.t: "พบ[ROOT.GetLeader] เสียชีวิต!"
 SEA_japan_popup_events.49.desc: "หลังขึ้นสูอํานาจในฐานะสมาชิกฝายสายกลางของกองทัพเรือ [ROOT.GetLeader] ไดรับความนิยมอยางกวางขวางในสายตาประชาชน แตบัดนี้เมื่อกองทัพบกกลับมามีอํานาจมหาศาลอีกครั้ง ดูเหมือนพวกเขายังคงผูกใจเจ็บ เพราะเมื่อชวงตนวันนี้ เขาถูกพบเปนศพในบานพัก มีการพบพินัยกรรมบนรางของนายกรัฐมนตรีที่มอบอํานาจการนําประเทศใหแกอาดาจิ เค็นโซ แมมันนาจะเปนของปลอมก็ตาม"
 SEA_japan_popup_events.49.a: "ดูเหมือนปศาจแหงลัทธิทหารนิยมยังคงหลอกหลอนเราอยู..."

 SEA_japan_popup_events.50.t: "ขอเรียกรองรวมจากโทกโกและเหลาขาราชการ"
 SEA_japan_popup_events.50.desc: "เมื่อสมาคมชวยเหลือการปกครองจักรวรรดิถูกกอตั้งขึ้น ก็เปนที่ชัดเจนวาเก็งกิ อาเบะ ผูนําตํารวจความคิด รวมถึงผูนําหลายคนในฝายขาราชการพลเรือน ไมคอยพอใจการกระทําของ[ROOT.GetLeader] นัก บัดนี้พวกเขาเรียกรองใหเขาลงจากตําแหนงเพื่อเปดทางใหเซโง นากาโนะ นักการเมืองผูนิยมนาซี เราควรยอมรับแรงกดดันนี้หรือไม?"
 SEA_japan_popup_events.50.a: "ก็ได ถานั่นคือนายกรัฐมนตรีที่พวกเขาตองการ..."
 SEA_japan_popup_events.50.b: "เราจะไมทําตามขอเรียกรองของพวกเขา!"

 SEA_japan_popup_events.51.t: "ยุทธนาวีที่มิดเวย"
 SEA_japan_popup_events.51.desc: "เนื่องจากคณะเสนาธิการทหารเรือของเราตองการขยายแนวปองกันในแปซิฟกออกไปยังเกาะปะการังที่ไกลออกไป กองเรือของเราจึงถูกสงไปลาดตระเวนหมูเกาะเวสตเอ็มเพอเรอร และไดปะทะกับกองเรืออเมริกัน การรบเปนไปอยางดุเดือด แตทายที่สุดเราก็ไลขาศึกกลับไปได สรางความเสียหายอยางมากทั้งตอกองทัพเรือและขวัญกําลังใจของพวกเขา สําหรับความสําเร็จนี้ ผูบัญชาการของเราไดรับการเลื่อนยศตามสมควร"
 SEA_japan_popup_events.51.a: "เพื่อองคจักรพรรดิ!"

 SEA_japan_popup_events.52.t: "ยุทธนาวีที่มิดเวย"
 SEA_japan_popup_events.52.desc: "นับตั้งแตญี่ปุนเริ่มพยายามขยายแนวปองกันในแปซิฟกออกไปยังเกาะปะการังที่ไกลออกไป กองเรือของพวกเขาก็เริ่มรุกลํ้าเขาใกลเพิรลฮารเบอรอีกครั้ง แตโดยที่ขาศึกไมรูตัว นักถอดรหัสของเราไดระบุวันและสถานที่ของแผนโจมตีมิดเวยไวแลว ทําใหเราซุมโจมตีกลับได ผูบัญชาการกองเรือแปซิฟกไดสงกําลังขนาดใหญภายใตการนําของแฟรงก แจ็ก เฟลตเชอร ไปยังพื้นที่มิดเวยกอนที่ญี่ปุนจะมาถึง และดวยการเตรียมการอยางรอบคอบนี้ เราไดสรางความเสียหายอยางหนักแกกองกําลังของพวกเขา ซึ่งพวกเขาจะฟนตัวไดไมงาย"
 SEA_japan_popup_events.52.a: "เราสั่งสอนพวกเขาแลว"

 SEA_japan_popup_events.53.t: "หายนะที่มิดเวย"
 SEA_japan_popup_events.53.desc: "เนื่องจากคณะเสนาธิการทหารเรือของเราตองการขยายแนวปองกันในแปซิฟกออกไปยังเกาะปะการังที่ไกลออกไป กองเรือของเราจึงถูกสงไปยึดเกาะปะการังมิดเวย แตโดยที่ผูบัญชาการของเราไมรูตัว นักถอดรหัสชาวอเมริกันไดระบุวันและสถานที่ของแผนโจมตีมิดเวยของเราไวแลว ทําใหพวกเขาซุมโจมตีกลับได การรบจบลงดวยความสูญเสียอยางใหญหลวง และสื่อกําลังเซ็นเซอรขอมูลทุกอยางเกี่ยวกับความสูญเสียไมใหถึงหูประชาชน เพื่อรักษาขวัญกําลังใจ"
 SEA_japan_popup_events.53.a: "ชางนาอับอาย"

 SEA_japan_popup_events.54.t: "ยุทธนาวีมิดเวยอันหายนะ"
 SEA_japan_popup_events.54.desc: "นับตั้งแตญี่ปุนเริ่มพยายามขยายแนวปองกันในแปซิฟกออกไปยังเกาะปะการังที่ไกลออกไป กองเรือของพวกเขาก็เริ่มรุกลํ้าเขาใกลเพิรลฮารเบอรอีกครั้ง แตโดยที่ขาศึกไมรูตัว นักถอดรหัสของเราไดระบุวันและสถานที่ของแผนโจมตีมิดเวยไวแลว ทําใหเราซุมโจมตีกลับได ผูบัญชาการกองเรือแปซิฟกไดสงกําลังขนาดใหญภายใตการนําของแฟรงก แจ็ก เฟลตเชอร ไปยังพื้นที่มิดเวยกอนที่ญี่ปุนจะมาถึง แตถึงจะพยายามอยางสุดความสามารถ กองเรือของเราก็ไมอาจตานทานกองเรือของพวกเขาได และภายในไมกี่ชั่วโมงผลการรบก็ถูกตัดสินแลว บางทีนี่อาจเปนจุดเปลี่ยนที่ขาศึกตองการเพื่อสยบกองเรือแปซิฟกของเรา"
 SEA_japan_popup_events.54.a: "นี่คือหายนะที่ไมเคยเกิดขึ้นมากอน!"

 ### BORDER INCIDENT EVENTS ###  

 # Event for MON 
 SEA_border_incidents_events.1.t: "กองทหารของเรารุกเขาสูเทารัน"
 SEA_border_incidents_events.1.desc: "กองกําลังทหาร[ROOT.GetAdjective] ไมถึง 100 นาย เริ่มรุกเขาสูหมูบานเทารันของ[MAN.GetAdjective] ที่เปนขอพิพาท โดยมีที่ปรึกษาโซเวียตหกคนคอยชี้นํา แมดูเหมือนกองทัพ[JAP.GetAdjective] จะยังไมปรากฏตัวในพื้นที่ แตพวกเขาอาจมาถึงไดทุกเมื่อเพื่อตีเรากลับ หมูบานนี้คุมกับความเสี่ยงหรือไม หรือเราควรระมัดระวังมากกวานี้?"
 SEA_border_incidents_events.1.a: "หมูบานนี้จะเปนของเรา!"
 SEA_border_incidents_events.1.b: "เราตองสั่งใหพวกเขาถอนกําลังทันที!"

 # Event for JAP or MAN  
 SEA_border_incidents_events.2.t: "เหตุการณเทารัน"
 SEA_border_incidents_events.2.desc: "กองกําลังทหาร[MON.GetAdjective] ไมถึง 100 นาย ไดยึดครองหมูบานเทารันของ[MAN.GetAdjective] ที่เปนขอพิพาท โดยมีที่ปรึกษาทางทหารโซเวียตคอยสั่งการ ดูเหมือนพวกเขาจะไมยอมถอยโดยไมสู และตองถูกปราบหากเราตองการรักษาการควบคุม[761.GetName] ไวอยางสมบูรณ"
 SEA_border_incidents_events.2.a: "สั่งใหกองทหารเคลื่อนพลทันที!"
 SEA_border_incidents_events.2.b: "ไมคุมกับความยุงยาก..."

 # Event for MAN if overlord JAP decided to engage in the conflict 
 SEA_border_incidents_events.3.t: "เหตุการณเทารัน"
 SEA_border_incidents_events.3.desc: "กองกําลังทหาร[MON.GetAdjective] ไมถึง 100 นาย ไดยึดครองหมูบานเทารันของ[MAN.GetAdjective] ที่เปนขอพิพาท โดยมีที่ปรึกษาทางทหารโซเวียตคอยสั่งการ ดูเหมือนพวกเขาจะไมยอมถอยโดยไมสู และตองถูกปราบหากเราตองการรักษาการควบคุม[761.GetName] ไวอยางสมบูรณ เจาเหนือหัวของเรา [JAP.GetNameDef] เรียกรองใหลงมือทันที และกองทัพกวานตงมองวาสถานการณนี้เปนการลบหลูองคจักรพรรดิเอง"
 SEA_border_incidents_events.3.a: "เตรียมการบุกโจมตี!"

 ### THE TAURAN INCIDENT BORDER WAR ### 
 SEA_border_incidents_events.4.t: "กองทหาร[FROM.GetAdjective] เตรียมบุกโจมตีเทารัน"
 SEA_border_incidents_events.4.desc: "ทามกลางความตึงเครียดที่ทวีขึ้นระหวางเรากับ[FROM.GetNameDef] หลังขอพิพาทเรื่องหมูบานชายแดนอยางเทารัน ดูเหมือนบัดนี้พวกเขากําลังเคลื่อนกําลังเขามาในพื้นที่เพื่อโจมตีกองรักษาการณที่เราวางไวในภูมิภาคนี้ เราตองเตรียมปองกันภูมิภาคนี้จนคนสุดทาย และขับไลผูรุกรานออกจากผืนดินอันชอบธรรมของ[ROOT.GetAdjective]!"
 SEA_border_incidents_events.4.a: "พายุกําลังกอตัว"

 SEA_border_incidents_events.5.t: "ชัยชนะของ[JAP.GetAdjective] ที่ทะเลสาบบูอีร"
 SEA_border_incidents_events.5.desc: "หลังการปะทะระหวางกองกําลัง[MON.GetAdjective] และ[JAP.GetAdjective] ในพื้นที่ชายแดนรอบทะเลสาบบูอีร มีรายงานวากองกําลัง[MON.GetAdjective] กําลังลาถอยเต็มรูปแบบ หนวยทหาร[JAP.GetAdjective] ไดยึดเนินเขายุทธศาสตรหลายแหงรอบพื้นที่ และกําลังเตรียมกลับเขาสูหมูบานเทารัน\n\nระหวางการรบ ฝาย[JAP.GetAdjective] ไดจับกุมทหาร[MON.GetAdjective] และที่ปรึกษา[SOV.GetAdjective] จํานวนหนึ่ง ซึ่งจะเปนการบั่นทอนขวัญกําลังใจของขาศึกอยางรุนแรง"
 SEA_border_incidents_events.5.a: "เราไดยุติเรื่องนี้อยางมีเกียรติ"
 SEA_border_incidents_events.5.b: "ขอใหพวกเขาอยารุกตอไปอีกเลย..."

 SEA_border_incidents_events.6.t: "ความพายแพของ[JAP.GetAdjective] ที่ทะเลสาบบูอีร"
 SEA_border_incidents_events.6.desc: "หลังการปะทะระหวางกองกําลัง[MON.GetAdjective] และ[JAP.GetAdjective] ในพื้นที่ชายแดนรอบทะเลสาบบูอีร เอกอัครราชทูต[JAP.GetAdjective] ในอูลานบาตอรไดขอหยุดยิง \n\n การบุกโจมตีที่มั่นของ[MON.GetAdjective] หลายครั้งโดยฝาย[JAP.GetAdjective] ลมเหลวพรอมความสูญเสียหนักระหวางการรบ สรางความกังวลในกองทัพ[JAP.GetAdjective] ถึงขีดความสามารถของกองกําลังตน"
 SEA_border_incidents_events.6.a: "ลมเหลวอยางมีเกียรติดีกวาไมเคยลองเลย"
 SEA_border_incidents_events.6.b: "กองกําลังของเราทําไดดีเยี่ยม"

 SEA_border_incidents_events.7.t: "ภาวะชะงักงันที่ทะเลสาบบูอีร"
 SEA_border_incidents_events.7.desc: "การสูรบระหวางกองกําลัง[JAP.GetAdjective] และ[MON.GetAdjective] รอบทะเลสาบบูอีรสงบลง หลังทั้งสองฝายถอนตัวจากพื้นที่พิพาทเพื่อรวมกําลังและเติมเสบียง กองทัพ[JAP.GetAdjective] ตระหนักวาการรุกตอไปไรประโยชน จึงขอหยุดยิงและเจรจากําหนดเสนเขตแดน โดยยอมรับวาหมูบานนี้อยูในดินแดนของ[MON.GetAdjective]"
 SEA_border_incidents_events.7.a: "ยังไงก็เปนแคหมูบานไรคา"
 SEA_border_incidents_events.7.b: "ถาอยางนั้นตอนนี้มันก็เปนของเรา"

 SEA_border_incidents_events.8.t: "[FROM.GetNameDefCap] ถอย"
 SEA_border_incidents_events.8.desc: "หลังเรายึดครองหมูบานเทารัน ดูเหมือนกองกําลัง[FROM.GetAdjective] ไดถอนตัวออกจากบริเวณนั้นและไมมีทาทีวาจะกลับมาอีก กองทัพ[JAP.GetAdjective] ตระหนักวาการรุกตอไปไรประโยชน จึงยอมรับวาหมูบานนี้อยูในดินแดนของ[ROOT.GetAdjective]"
 SEA_border_incidents_events.8.a: "ยอดเยี่ยม"

 if_they_back_down_or_lose_a_border_conflict_tt: "หากพวกเขาถอยหรือแพในความขัดแยงชายแดน:"


 ### STRIKE SOUTH EVENTS ###  

 SEA_imperial_influence_events.500.t: "ฝายทหารเรือเรียกรองใหรุกลงใต"
 SEA_imperial_influence_events.500.desc: "[ROOT.GetLeader] เพิ่งไดรับจดหมายที่ลงนามโดยกองบัญชาการทหารเรือ เรียกรองใหเริ่มเตรียมการดําเนินหลักนิยมรุกลงใตอยางเต็มรูปแบบ โดยอางวาความตองการทรัพยากรที่พบไดในหมูเกาะอินเดียตะวันออกของพวกเขามาถึงจุดวิกฤตแลว แนนอนวาเราอาจเพิกเฉยตอพวกเขาได แตการปลอยใหพวกเขารอก็อาจไมฉลาดนัก"
 SEA_imperial_influence_events.500.a: "ตองเรงเตรียมการโดยเร็ว!" 
 take_the_strike_south_focus_tt: "การดําเนิน §Y$JAP_strike_the_southern_road$§! ใหเสร็จสิ้นและทําสงครามกับ§Yมหาอํานาจตะวันตก§!จะทําให $JAP_naval_faction$ พอใจ"

 SEA_imperial_influence_events.501.t: "นายทหารเรือลาออกดวยความโกรธแคน"
 SEA_imperial_influence_events.501.desc: "เมื่อเราไมสามารถดําเนินแผนที่วางไวสําหรับหลักนิยมรุกลงใตไดภายในเวลาที่กองบัญชาการทหารเรือกําหนด บัดนี้ดูเหมือนนายทหารเรือจํานวนมากที่มีสวนรวมในการกดดัน[ROOT.GetLeader] ใหดําเนินการไดลาออกไปแลว"
 SEA_imperial_influence_events.501.a: "ชางเปนการกระทําที่ไรเกียรติ!" 

 ### TOKKO EVENTS ###

 SEA_japan_tokko_arrest_events.1.t: "เหตุการณแนวรวมประชาชน"
 SEA_japan_tokko_arrest_events.1.desc: "โทกโกไดคนพบภัยคุกคามตอเสถียรภาพภายในของเรา ดูเหมือนจะมีองคกรของนักสังคมนิยมและคอมมิวนิสตที่มุงบอนทําลายสังคมของเรา รายชื่อบุคคลที่จะถูกจับกุมไดจัดทําขึ้นแลว ประกอบดวยสมาชิกระดับสูงของพรรคคอมมิวนิสตหลายคน เชน คันซน อาราฮาตะ, ซาบูโร เอดะ, เรียวกิจิ มิโนเบะ, อิตสึโร ซากิซากะ, โคโซ ซาซากิ, โมซาบูโร ซูซูกิ, มิโนรุ ทากาโนะ และฮิโตชิ ยามากาวะ"
 SEA_japan_tokko_arrest_events.1.a: "ขาวดีเยี่ยม"
 JAP_popular_front_incident_tt: "นักการเมืองและนักปลุกระดมคอมมิวนิสตหลายคนจะถูกจับกุม"

 SEA_japan_tokko_arrest_events.2.t: "เหตุการณค็อกซ"
 SEA_japan_tokko_arrest_events.2.desc: "โทกโกไดคนพบภัยคุกคามตอเสถียรภาพภายในของเรา ชาวอังกฤษ 11 คนที่พํานักอยูในประเทศของเราจะถูกจับกุมดวยขอหาตองสงสัยวาละเมิดกฎหมายคุมครองความลับทางทหาร โดยมีหัวหนาคือ เอ็ม.เจ. ค็อกซ หัวหนาสํานักงานรอยเตอรประจําโตเกียว แมรัฐบาล[ENG.GetAdjective] จะอางวาคนเหลานี้ไมใชสายลับ แตพวกเขาก็ถูกนําตัวไปยังอาคารกองบัญชาการสารวัตรทหารเพื่อสอบสวนแลว"
 SEA_japan_tokko_arrest_events.2.a: "สายลับตางชาติไดรับสิ่งที่สมควรได!"
 SEA_japan_tokko_arrest_events.2.b: "พยายามอยาใหฝาย[ENG.GetAdjective] โกรธ"
 JAP_cox_incident_tt: "พลเมือง[ENG.GetAdjective] หลายคนที่ตองสงสัยวาเปนสายลับจะถูกจับกุม"

 SEA_japan_tokko_arrest_events.3.t: "เหตุการณกัสซากุชะ" # or Kyōsakusha
 SEA_japan_tokko_arrest_events.3.desc: "โทกโกไดคนพบภัยคุกคามอีกประการตอเสถียรภาพภายในของเรา สมาชิกฝายสืบสวนของบริษัทรถไฟแมนจูเรียใตจํานวนมากถูกสารวัตรทหารของกองทัพกวานตงจับกุมเปนครั้งที่สองแลว และถูกควบคุมตัวดวยขอหาตองสงสัยวาเผยแพรโฆษณาชวนเชื่อตอตานญี่ปุนและคอมมิวนิสตในอาณานิคมของเรา ดูเหมือนพวกเขายังทําการวิจัยและวิเคราะหทางสังคมดวยวิธีการแบบมารกซิสตซึ่งเคยถูกสั่งหามบนหมูเกาะหลักมากอน แผนสมคบคิดนี้อาจหยั่งรากลึกมาก ควรจัดการอยางไร?"
 SEA_japan_tokko_arrest_events.3.a: "ปลอยใหกองทัพกวานตงจัดการ"
 SEA_japan_tokko_arrest_events.3.b: "เราตองจับกุมครั้งใหญทันที!"
 SEA_japan_tokko_arrest_events.3.c: "พวกเขาไมเปนภัยตอเรา เพิกเฉยไป"

 SEA_japan_tokko_arrest_events.4.t: "เหตุการณซอรเกอ"
 SEA_japan_tokko_arrest_events.4.desc: "โทกโกไดคนพบภัยคุกคามอีกประการตอเสถียรภาพภายในของเรา ครั้งนี้พวกเขาเปดโปงเครือขายสายลับ[SOV.GetAdjective] ที่นําโดยริชารด ซอรเกอ นักขาวชาว[GER.GetAdjective] ซึ่งพบวามีความผิดฐานจารกรรมและบอนทําลายทั่วประเทศของเรา ดูเหมือนพวกเขาจะมีผูรวมมือที่ตองถูกจัดการดวย เชน โฮตสึมิ โอซากิ อดีตนักขาวอาซาฮีชิมบุน และโคอิจิ ไซองจิ สมาชิกชนชั้นขุนนางของเรา"
 SEA_japan_tokko_arrest_events.4.a: "สายลับตางชาติไดรับสิ่งที่สมควรได!"
 SEA_japan_tokko_arrest_events.4.b: "พยายามอยาใหชาว[SOV.GetAdjective] โกรธ"
 JAP_sorge_incident_tt: "พลเมือง[SOV.GetAdjective] หลายคนและเครือขายของพวกเขาภายในประเทศเราที่ตองสงสัยวาเปนสายลับจะถูกจับกุม"

 SEA_japan_tokko_arrest_events.5.t: "เหตุการณโยโกฮามะ"
 SEA_japan_tokko_arrest_events.5.desc: "ตํารวจพิเศษชั้นสูงโยโกฮามะไดจับกุมปญญาชนเกือบสามโหลในขอหาพยายามฟนฟูพรรคคอมมิวนิสตซึ่งเคยถูกโทกโกบังคับยุบไปแลว ผูตองสงสัยรวมถึงบรรณาธิการนิตยสารชูโอโครอน ไคโซ และนิปปงเฮียวรอน ดูเหมือนเจาหนาที่บังคับใชกฎหมายของเราทําหนาที่ปกปองจิตวิญญาณของชาติจากภัยคุกคามทางจิตใจนี้ไดเปนอยางดี"
 SEA_japan_tokko_arrest_events.5.a: "ปราบผูเห็นตางไดอีกราย"

 SEA_japan_tokko_arrest_events.6.t: "เหตุการณนากาโนะ เซโง"
 SEA_japan_tokko_arrest_events.6.desc: "นากาโนะ เซโง ผูกอตั้งและผูนําพรรคการเมืองขวาจัดโทโฮไก ถูกจับกุมแลว เรื่องนี้เกิดขึ้นหลังจากที่พรรคไมอาจดําเนินกิจกรรมอยางถูกกฎหมายตอไปไดเนื่องจากถูกกดขี่ และดูเหมือนพวกเขาวางแผนจะลงมือโดยตรงอยางผิดกฎหมาย เพราะสิ่งที่พวกเขามองวาเปน 'การกดขี่ทางการเมือง' จากคณะรัฐมนตรีของเรา ชางไรเกียรติ!"
 SEA_japan_tokko_arrest_events.6.a: "บังอาจวารายนายกรัฐมนตรีของเราไดอยางไร? จับเขา!"

 SEA_japan_tokko_arrest_events.7.t: "เหตุการณหอกไมไผ"
 SEA_japan_tokko_arrest_events.7.desc: "ทาเกโอะ ชินเมียว หัวหนาผูสื่อขาวของไมนิจิชิมบุน ถูกโทกโกจับกุมฐานวิจารณความพยายามในสงคราม กลาวกันวาในฐานะสวนหนึ่งของการแขงขันระหวางเหลาทัพ เธออางวา 'หอกไมไผไมพอหรอก ตองเปนเครื่องบิน เครื่องบินทางทะเล' และ 'ผลของสงครามมหาเอเชียบูรพาขึ้นอยูกับการเสริมกําลังทางเรือและทางอากาศ และเราไมอาจตอกรกับกําลังทางอากาศของขาศึกดวยหอกไมไผได' ซึ่งเปนการวิจารณผูนํากองทัพบกของเราโดยตรง พรอมทั้งสงเสริมแนวคิดวามีเพียงกองทัพเรือเทานั้นที่จะนําเราไปสูชัยชนะ"
 SEA_japan_tokko_arrest_events.7.a: "ทําไมพวกเขาไมเชื่อวาเราจะชนะสงครามนี้?"

 SEA_japan_tokko_arrest_events.8.t: "เหตุการณกัสซากุชะ"
 SEA_japan_tokko_arrest_events.8.desc: "สมาชิกฝายสืบสวนของบริษัทรถไฟแมนจูเรียใตจํานวนมากถูกสารวัตรทหารของกองทัพกวานตงจับกุมเปนครั้งที่สองแลว และถูกควบคุมตัวดวยขอหาตองสงสัยวาเผยแพรโฆษณาชวนเชื่อตอตานญี่ปุนและคอมมิวนิสต [JAP.GetNameDefCap] สั่งใหเราจัดการสถานการณอยางเหมาะสมแตจะไมเขาแทรกแซงโดยตรง ควรจัดการสถานการณนี้อยางไร?"
 SEA_japan_tokko_arrest_events.8.a: "ทําตามคําสั่งและเริ่มจับกุมครั้งใหญ!"
 SEA_japan_tokko_arrest_events.8.b: "ซุกไวใตพรม ยังไงก็เปนประโยชนกับเรา"





