 #Army
 SEA_imperial_influence_events.100.t: "ฝายกองทัพบกสูญเสียอิทธิพล"
 SEA_imperial_influence_events.100.desc: "ฝายกองทัพบกพยายามเพิ่มอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] แตลมเหลวเพราะขอบกพรองของตนเอง ดวยเหตุนี้พวกเขาจึงเสียหนาและเสียเกียรติภูมิ ทําใหอิทธิพลของพวกเขาลดลง"
 SEA_imperial_influence_events.110.t: "ฝายกองทัพบกตองการขยายการผลิตอาวุธ"
 SEA_imperial_influence_events.110.desc: "กองทัพบกไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางโรงงานทหารเพิ่มเพื่อเพิ่มผลผลิต ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.120.t: "ฝายกองทัพบกเรียกรองการแตงตั้งทางการเมือง"
 SEA_imperial_influence_events.120.desc: "กองทัพบกไดยื่นขอเรียกรองแลว ดวยขาดการควบคุมจากสวนกลางและอํานาจที่จะดําเนินการเอง พวกเขาจึงตองการเห็นการแตงตั้งเสนาธิการทหารบกคนใหม ซึ่งจะชวยเสริมอิทธิพลของพวกเขาเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.130.t: "ฝายกองทัพบกตองการเปลี่ยนกฎหมายเกณฑทหาร"
 SEA_imperial_influence_events.130.desc: "กองทัพบกไดยื่นขอเรียกรองแลว พวกเขาตองการใหเราเพิ่มการเกณฑทหารระดับชาติ และสงเจาหนาที่จัดหากําลังพลไปยังหมูบานชนบทเพื่อเกณฑชายหนุมเพิ่มสําหรับสงครามที่กําลังจะมาถึง แมจะอางวาเพียงเพื่อเสริมกําลังกองทัพ แตดูเหมือนพวกเขาตองการเพิ่มการควบคุมและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.140.t: "ฝายกองทัพบกวางแผนขยายกําลัง"
 SEA_imperial_influence_events.140.desc: "กองทัพบกไดยื่นขอเรียกรองแลว พวกเขาตองการใหเราเพิ่มจํานวนกรมทหารในกองทัพ และจัดตั้งกองพลเพิ่มเพื่อชวยในการพิชิตที่กําลังจะมาถึง แมจะอางวาเพียงเพื่อเสริมกําลังกองทัพ แตดูเหมือนพวกเขาตองการเพิ่มการควบคุมและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.150.t: "ฝายกองทัพบกยืนกรานเรื่องรถบรรทุกสนับสนุน"
 SEA_imperial_influence_events.150.desc: "กองทัพบกไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตยานยนตและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางรถบรรทุกเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.160.t: "ฝายกองทัพบกเรียกรองใหเพิ่มการผลิตรถถัง"
 SEA_imperial_influence_events.160.desc: "กองทัพบกไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตรถถังและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางรถถังเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.161.t: "ฝายกองทัพบกเรียกรองใหเพิ่มการผลิตปนใหญ"
 SEA_imperial_influence_events.161.desc: "กองทัพบกไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตปนใหญและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางปนใหญเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"

 #Navy
 SEA_imperial_influence_events.200.t: "ฝายทหารเรือสูญเสียอิทธิพล"
 SEA_imperial_influence_events.200.desc: "ฝายทหารเรือพยายามเพิ่มอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] แตลมเหลวเพราะขอบกพรองของตนเอง ดวยเหตุนี้พวกเขาจึงเสียหนาและเสียเกียรติภูมิ ทําใหอิทธิพลของพวกเขาลดลง"
 SEA_imperial_influence_events.210.t: "ฝายทหารเรือตองการขยายการผลิตของอูตอเรือ"
 SEA_imperial_influence_events.210.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางอูตอเรือเพิ่มเพื่อเพิ่มผลผลิต ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.220.t: "ฝายทหารเรือเรียกรองการแตงตั้งทางการเมือง"
 SEA_imperial_influence_events.220.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว ดวยขาดการควบคุมจากสวนกลางและอํานาจที่จะดําเนินการเอง พวกเขาจึงตองการเห็นการแตงตั้งเสนาธิการทหารเรือคนใหม ซึ่งจะชวยเสริมอิทธิพลของพวกเขาเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.230.t: "ฝายทหารเรือตองการเปลี่ยนกฎหมายเกณฑทหาร"
 SEA_imperial_influence_events.230.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว พวกเขาตองการใหเราเพิ่มการเกณฑทหารระดับชาติ และสงผูแทนกองทัพเรือไปยังหมูบานชนบทเพื่อรับชายหนุมเพิ่มสําหรับสงครามที่กําลังจะมาถึง แมจะอางวาเพียงเพื่อเสริมกําลังกองทัพ แตดูเหมือนพวกเขาตองการเพิ่มการควบคุมและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.240.t: "ฝายทหารเรือเรียกรองใหเพิ่มการผลิตเรือบรรทุกเครื่องบิน"
 SEA_imperial_influence_events.240.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายกองเรือบรรทุกเครื่องบินและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสั่งตอเรือบรรทุกเครื่องบินเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.241.t: "ฝายทหารเรือเรียกรองใหเพิ่มการผลิตทางเรือ"
 SEA_imperial_influence_events.241.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายขีดความสามารถในการผลิตและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสั่งสรางอูตอเรือเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.242.t: "ฝายทหารเรือเรียกรองใหเพิ่มการผลิตเรือประจัญบาน"
 SEA_imperial_influence_events.242.desc: "กองทัพเรือไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายกองเรือประจัญบานและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสั่งตอเรือประจัญบานเพิ่มเพื่อตอบสนองความตองการขยายกําลังของพวกเขา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"

 #Zaibatsu
 SEA_imperial_influence_events.300.t: "ฝายไซบัตสึสูญเสียอิทธิพล"
 SEA_imperial_influence_events.300.desc: "กลุมไซบัตสึพยายามเพิ่มอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] แตลมเหลวเพราะขอบกพรองของตนเอง ดวยเหตุนี้พวกเขาจึงเสียหนาและเสียเกียรติภูมิ ทําใหอิทธิพลของพวกเขาลดลง"
 SEA_imperial_influence_events.310.t: "ฝายไซบัตสึตองการขยายฐานอุตสาหกรรมของเรา"
 SEA_imperial_influence_events.310.desc: "ผูนําไซบัตสึไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการขยายกิจการ อุตสาหกรรม และอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] จึงเรียกรองใหเราสรางโรงงานพลเรือนเพิ่มเพื่อขยายฐานอุตสาหกรรม ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.320.t: "ฝายไซบัตสึเรียกรองการแตงตั้งทางการเมือง"
 SEA_imperial_influence_events.320.desc: "ผูนําไซบัตสึไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการใหสมาชิกของตนอยางนอยหนึ่งคนไดเขาไปอยูในคณะที่ปรึกษาของ[GetImperialInfluenceRulerTitle] เพื่อที่จะไดชี้นําการพัฒนาอุตสาหกรรมและเสนทางของชาติ ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.330.t: "ฝายไซบัตสึตองการเปลี่ยนกฎหมายเศรษฐกิจ"
 SEA_imperial_influence_events.330.desc: "ผูนําไซบัตสึไดยื่นขอเรียกรองแลว พวกเขาตองการใหเราปรับยุทธศาสตรเศรษฐกิจของชาติ และใหเงินทุนไหลไปสูกลุมบริษัทอุตสาหกรรมมากขึ้น แมจะอางวาเพียงเพื่อเสริมความแข็งแกรงใหเศรษฐกิจ แตดูเหมือนพวกเขาตองการเพิ่มการควบคุมและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.340.t: "ฝายไซบัตสึเรียกรองใหเราวาจางบริษัทอุตสาหกรรม"
 SEA_imperial_influence_events.340.desc: "ผูนําไซบัตสึไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการใหบริษัทของตนอยางนอยหนึ่งแหงไดรับการวาจางทําสัญญาโดยตรงกับ[GetImperialInfluenceRulerTitle] เพื่อที่จะไดชี้นําการพัฒนาอุตสาหกรรมและเสนทางของชาติ ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"

 #Government
 SEA_imperial_influence_events.400.t: "รัฐบาลพลเรือนสูญเสียอิทธิพล"
 SEA_imperial_influence_events.400.desc: "รัฐบาลพลเรือนพยายามเพิ่มอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] แตลมเหลวเพราะขอบกพรองของตนเอง ดวยเหตุนี้พวกเขาจึงเสียหนาและเสียเกียรติภูมิ ทําใหอิทธิพลของพวกเขาลดลง"
 SEA_imperial_influence_events.420.t: "ฝายรัฐบาลพลเรือนเรียกรองการแตงตั้งทางการเมือง"
 SEA_imperial_influence_events.420.desc: "ผูนําพรรคการเมืองไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาตองการใหสมาชิกของตนอยางนอยหนึ่งคนไดเขาไปอยูในคณะที่ปรึกษาของ[GetImperialInfluenceRulerTitle] เพื่อที่จะไดชี้นําทิศทางการเมืองของชาติและนําพาไปสูอนาคตที่สดใสกวา ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.430.t: "ฝายรัฐบาลพลเรือนตองการเปลี่ยนกฎหมายการคา"
 SEA_imperial_influence_events.430.desc: "ผูนําพรรคการเมืองไดยื่นขอเรียกรองแลว พวกเขาตองการใหเราปรับยุทธศาสตรเศรษฐกิจของชาติ และเปลี่ยนยุทธศาสตรการลงทุนและการคาไปในทางที่เอื้อตอสากลนิยมและความสัมพันธที่ดีขึ้นกับคูคา แมจะอางวาเพียงเพื่อเสริมความแข็งแกรงใหเศรษฐกิจ แตดูเหมือนพวกเขาตองการเพิ่มการควบคุมและอิทธิพลเหนือ[GetImperialInfluenceRulerTitle] ดวย ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.440.t: "ฝายรัฐบาลพลเรือนตองการจํากัดอิทธิพลของกองทัพบก"
 SEA_imperial_influence_events.440.desc: "ผูนําพรรคการเมืองไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาจะกังวลใจกับอํานาจและอิทธิพลที่เพิ่มขึ้นของกองทัพบกเหนือ[GetImperialInfluenceRulerTitle] และตองการใหลงมือจํากัดการเติบโตและอํานาจของกองทัพบกโดยเร็ว ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.450.t: "ฝายรัฐบาลพลเรือนตองการจํากัดอิทธิพลของกองทัพเรือ"
 SEA_imperial_influence_events.450.desc: "ผูนําพรรคการเมืองไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาจะกังวลใจกับอํานาจและอิทธิพลที่เพิ่มขึ้นของกองทัพเรือเหนือ[GetImperialInfluenceRulerTitle] และตองการใหลงมือจํากัดการเติบโตและอํานาจของกองทัพเรือโดยเร็ว ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"
 SEA_imperial_influence_events.460.t: "ฝายรัฐบาลพลเรือนตองการจํากัดอิทธิพลของไซบัตสึ"
 SEA_imperial_influence_events.460.desc: "ผูนําพรรคการเมืองไดยื่นขอเรียกรองแลว ดูเหมือนพวกเขาจะกังวลใจกับอํานาจและอิทธิพลที่เพิ่มขึ้นของไซบัตสึเหนือ[GetImperialInfluenceRulerTitle] และตองการใหลงมือจํากัดการเติบโตและอํานาจของไซบัตสึโดยเร็ว ดูเหมือนพวกเขายอมอดทนรอไดบาง แตจะไมรอตลอดไป"


 SEA_japan_air_accidents_events.01.t: "การเสียชีวิตอันนาเศราของ $JAP_isoroku_yamamoto$"
 SEA_japan_air_accidents_events.01.desc: "พลเรือเอกอิโซโรกุ ยามาโมโตะ ถูกขาศึกยิงตกเมื่อชวงตนวันนี้ เครื่องบินขับไล[USA.GetAdjective] กลุมหนึ่งสกัดกั้นเขาหลังจากดักจับการสงขาวกรองของเราได พวกเขาตั้งชื่อการโจมตีอันอุกอาจนี้วา 'ปฏิบัติการแกแคน' ซึ่งชัดเจนวาตองการสงสาร ขณะที่ชาติของเราไวอาลัยตอการสูญเสียนักรบผูยิ่งใหญผูนี้ เราตองไมลืมหนาที่ในการโคนลมศัตรูผูไรเกียรตินี้!"
 SEA_japan_air_accidents_events.01.a: "ความสูญเสียอันใหญหลวง..."
 SEA_japan_air_accidents_events.02.t: "รอดพนปฏิบัติการแกแคน"
 SEA_japan_air_accidents_events.02.desc: "พลเรือเอกอิโซโรกุ ยามาโมโตะ ถูกขาศึกระดมยิงขณะบินเดินทางเมื่อชวงตนวันนี้ ยามาโมโตะติดตอกองบินนาวีในภูมิภาคไดและหลบพนหากระสุน จนสามารถเล็ดลอดออกมาและนําเครื่องลงจอดไดสําเร็จ พลเรือเอกไดรับการยกยองในความกลาหาญและความใจเย็นทามกลางสถานการณอันคับขันเชนนั้น"
 SEA_japan_air_accidents_events.02.a: "เกียรติของเขาไดรับการธํารงไว"

 ## NEWS EVENTS 

 SEA_japan_news_events.01.t: "[JAP.GetLeader] ออกมาตอตานการแทรกแซงของกองทัพ"
 SEA_japan_news_events.01.desc: "\n ในสุนทรพจนอันเรารอนของ[JAP.GetLeader] เขาประกาศวากองทัพทําเกินไปแลวในครั้งนี้ หลังความพยายามกอรัฐประหารของกลุมโคโดฮะในกองทัพเมื่อไมนานมานี้ เขากลาวตอวา 'การลอบสังหารนับครั้งไมถวนและความพยายามโคนรัฐบาลของเราโดยกลุมสุดโตงยังไมพออีกหรือ บัดนี้พวกเขายังพยายามใชเหตุการณลาสุดเพื่อเสริมอํานาจของตนและแยงชิงการควบคุมชาติไปจากประชาชน เราจะปลอยใหเปนเชนนี้ตอไปไมได!' \n\nดูเหมือนความขัดแยงกําลังกอตัวขึ้นใน[JAP.GetNameDef]"
 SEA_japan_news_events.01.a: "เราตองกลับคืนสูวิถีแหงยุคไทโช!"
 SEA_japan_news_events.01.b: "ดูเหมือนในที่สุดก็มีคนกลาแลว"

 SEA_japan_news_events.02.t: "การกอตั้งวงไพบูลยแหงมหาเอเชียบูรพา"
 SEA_japan_news_events.02.desc: "\nดวยวัตถุประสงคที่เสนอไววาจะสรางความพึ่งพาตนเองทางเศรษฐกิจและความรวมมือระหวางรัฐสมาชิก พรอมตอตานอิทธิพลของจักรวรรดินิยมตะวันตกและคอมมิวนิสตโซเวียต วันนี้[JAP.GetLeader] ไดประกาศกอตั้งไดโตอะเคียวเอเก็ง นี่คือวัตถุประสงคที่แทจริงของสหภาพนี้ หรือเปนเพียงแผนการอันแยบยลอีกชิ้นของเครื่องจักรโฆษณาชวนเชื่อ[JAP.GetAdjective] ยังคงเปนคําถามที่อยูในใจของทุกคน"
 SEA_japan_news_events.02.a: "เราจะนําความรุงเรืองมาสูเอเชียทั้งมวล!"
 SEA_japan_news_events.02.b: "แผนการอีกชิ้นของเครื่องจักรโฆษณาชวนเชื่อ"

 SEA_japan_news_events.03.t: "การแตกของยางกุง"
 SEA_japan_news_events.03.d: "การรุกของญี่ปุนในพมายังดําเนินตอไป และยางกุงเพิ่งแตกเมื่อไมนานนี้ ในฐานะเมืองหลวงของพมาของอังกฤษ เมืองนี้มีความสําคัญทางยุทธศาสตรอยางยิ่ง และการสูญเสียเมืองนี้อาจเปนปจจัยชี้ขาดในการทัพพมาที่กําลังดําเนินอยู\n\nมีรายงานวาผูสําเร็จราชการอาณานิคมเองถูกหนวยทหารสวนหนาของญี่ปุนจับกุมขณะกําลังควบคุมการขนยายขาวของจากทําเนียบผูสําเร็จราชการขึ้นขบวนรถบรรทุก แตเรื่องนี้ยังไมไดรับการยืนยัน"
 SEA_japan_news_events.03.a: "อีกหนึ่งชัยชนะเหนือจักรวรรดินิยม!"






