SEA_PHI_political_events.45.t: "[FROM.GetName] ขอการสนับสนุนเพื่อเอกราช"
SEA_PHI_political_events.45.desc: "รัฐบาล[FROM.GetAdjective]ไดติดตอเรามาพรอมแผนการตอสูเพื่อเอกราชจาก [USA.GetNameDef] แผนเหลานี้ยังไมไดเริ่มดําเนินการ แตพวกเขาขอวาเมื่อ [PHI.GetNameDef] เรียกรองเอกราช เราจะสนับสนุนขอเรียกรองนั้น และรวมตอสูหากถูกปฏิเสธ"
SEA_PHI_political_events.45.a: "นั่นจะขยายอิทธิพลของเรา"
SEA_PHI_political_events.45.b: "เราไมอาจเสี่ยงทําสงครามกับ [USA.GetNonIdeologyName]"

SEA_PHI_political_events.46.t: "[FROM.GetName] สนับสนุนแผนเอกราชของเรา"
SEA_PHI_political_events.46.desc: "เราไดรับสาสนจากรัฐบาล[FROM.GetAdjective]วาพวกเขาพรอมสนับสนุนขอเรียกรองเอกราชของเราในอนาคต แมเพียงเทานี้ก็นาจะชวยโนมนาว [ROOT.overlord.GetNameDef] ไดแลว แต [FROM.GetNameDef] ยังสัญญาวาจะสนับสนุนเราทางทหารหากพวกเขาพยายามลมลางกาวใดๆ สูเอกราช"
SEA_PHI_political_events.46.a: "ยอดเยี่ยม!"

SEA_PHI_political_events.47.t: "[FROM.GetName] ปฏิเสธที่จะสนับสนุนแผนเอกราช"
SEA_PHI_political_events.47.desc: "นักการทูตที่เราสงไป [FROM.GetNameDef] กลับมาอยางรวดเร็ว หลังรัฐบาลของพวกเขาปฏิเสธที่จะใหคํามั่นชวยเหลือกาวสูเอกราชของเรา แมพวกเขาจะอางวาอยากชวยเรา แตก็ไมอาจเสี่ยงเขาไปพัวพันในสงครามกับ [ROOT.overlord.GetNameDef]"
SEA_PHI_political_events.47.desc.2: "นักการทูตที่เราสงไป [FROM.GetNameDef] กลับมาอยางรวดเร็ว หลังรัฐบาลของพวกเขาปฏิเสธที่จะใหคํามั่นชวยเหลือกาวสูเอกราชของเรา ดูเหมือนพวกเขาจะสนใจเปนเจาอาณานิคมรายใหมของเรามากกวาชวยใหเราไดเอกราช"
SEA_PHI_political_events.47.a: "ดูเหมือนวาทะเรื่องการปลดแอกอาณานิคมของพวกเขาจะเปนแคลมปาก"

SEA_PHI_political_events.48.t: "[FROM.GetName] ประกาศเอกราช"
SEA_PHI_political_events.48.desc: "เมื่อชวงตนวันนี้ เราไดรับรายงานถึงความผิดปกติใน [FROM.GetNameDef] จากนั้นเราก็ไดรับคําประกาศเอกราชจากรัฐบาลของพวกเขา แมจะพยายามโนมนาวไมใหเราแทรกแซงอยางชัดเจน แตพวกเขาก็แสดงใหเห็นวาจะไมหลีกเลี่ยงการตอสูเพื่อรักษาเอกราชที่เพิ่งไดมา"
SEA_PHI_political_events.48.desc.2: "เมื่อชวงตนวันนี้ เราไดรับรายงานถึงความผิดปกติใน [FROM.GetNameDef] จากนั้นเราก็ไดรับคําประกาศเอกราชจากรัฐบาลของพวกเขา พรอมแถลงการณสนับสนุนอยางชัดเจนจากรัฐบาล[JAP.GetAdjective] แมแถลงการณจะขอรองไมใหเราแทรกแซง แตรัฐบาล[FROM.GetAdjective]ก็แสดงใหเห็นชัดวาจะไมหลีกเลี่ยงการตอสูเพื่อรักษาเอกราชที่เพิ่งไดมา โดยมีฝาย[JAP.GetAdjective]หนุนหลัง"
SEA_PHI_political_events.48.desc.3: "เมื่อชวงตนวันนี้ เราไดรับรายงานถึงความผิดปกติใน [FROM.GetNameDef] จากนั้นเราก็ไดรับคําประกาศเอกราชจากรัฐบาลของพวกเขา พรอมแถลงการณสนับสนุนอยางชัดเจนจากรัฐบาลอเมริกาใตหลายประเทศ แมแถลงการณจะขอรองไมใหเราแทรกแซง แตรัฐบาล[FROM.GetAdjective]ก็แสดงใหเห็นชัดวาจะไมหลีกเลี่ยงการตอสูเพื่อรักษาเอกราชที่เพิ่งไดมา โดยมีอเมริกาใตหนุนหลัง"
SEA_PHI_political_events.48.desc.4: "เมื่อชวงตนวันนี้ เราไดรับรายงานถึงความผิดปกติใน [FROM.GetNameDef] จากนั้นเราก็ไดรับคําประกาศเอกราชจากรัฐบาลของพวกเขา พรอมแถลงการณสนับสนุนอยางชัดเจนจากรัฐบาล[SPR.GetAdjective] แมแถลงการณจะขอรองไมใหเราแทรกแซง แตรัฐบาล[FROM.GetAdjective]ก็แสดงใหเห็นชัดวาจะไมหลีกเลี่ยงการตอสูเพื่อรักษาเอกราชที่เพิ่งไดมา โดยมีฝาย[SPR.GetAdjective]หนุนหลัง"
SEA_PHI_political_events.48.desc.5: "เมื่อชวงตนวันนี้ เราไดรับรายงานถึงความผิดปกติใน [FROM.GetNameDef] จากนั้นเราก็ไดรับคําประกาศเอกราชจากรัฐบาลของพวกเขา พรอมแถลงการณสนับสนุนอยางชัดเจนจากรัฐบาล[SPR.GetAdjective]และรัฐบาลอเมริกาใตบางประเทศ แมแถลงการณจะขอรองไมใหเราแทรกแซง แตรัฐบาล[FROM.GetAdjective]ก็แสดงใหเห็นชัดวาจะไมหลีกเลี่ยงการตอสูเพื่อรักษาเอกราชที่เพิ่งไดมา โดยมีพันธมิตรชาวฮิสแปนิกหนุนหลัง"
SEA_PHI_political_events.48.a: "อยางไรเราก็จะใหเอกราชพวกเขาอยูแลว"
SEA_PHI_political_events.48.b: "พวกเขายังไมพรอม"

SEA_PHI_political_events.49.t: "[FROM.GetName] ยอมใหเอกราช"
SEA_PHI_political_events.49.desc: "หลังจากไมตอบสนองตอคําประกาศเอกราชของเราอยูหลายวัน ซึ่งคาดวาผูนํา[FROM.GetAdjective]คงถกเถียงกันอยางดุเดือด [FROM.GetNameDef] ก็ไดประกาศอยางเปนทางการวาจะรับรองเอกราชของ[ROOT.GetAdjective]"
SEA_PHI_political_events.49.a: "ขาวดีมาก!"

SEA_PHI_political_events.50.t: "[FROM.GetName] สูเพื่อยึดอํานาจเหนือเราคืน"
SEA_PHI_political_events.50.desc: "ในการตอบสนองตอคําประกาศเอกราชของเรา [FROM.GetNameDef] ไมไดตอบกลับอยางเปนทางการ และเริ่มเคลื่อนกําลังไปยังฐานทัพใกลเคียงเพื่อเขาแทรกแซง"
SEA_PHI_political_events.50.a: "ลองมาดูสิ!"

SEA_PHI_political_events.51.t: "$USA_douglas_macarthur$ ถูกเรียกตัวกลับ [USA.GetNameDef]"
SEA_PHI_political_events.51.desc: "สถานการณทางทหารใน [USA.GetNameDef] เลวรายถึงขั้นที่ตองเรียก $USA_douglas_macarthur$ ใหกลับบานโดยดวน"
SEA_PHI_political_events.51.a: "เราจะคิดถึงเขา"

SEA_PHI_political_events.52.t: "$USA_dwight_d_eisenhower$ ถูกเรียกตัวกลับ [USA.GetNameDef]"
SEA_PHI_political_events.52.desc: "สถานการณทางทหารใน [USA.GetNameDef] เลวรายถึงขั้นที่ตองเรียก $USA_dwight_d_eisenhower$ ใหกลับบานโดยดวน"

SEA_PHI_political_events.53.t: "$USA_dwight_d_eisenhower$ กลับจาก [PHI.GetName]"
SEA_PHI_political_events.53.desc: "หลังเขารวมภารกิจของ $USA_douglas_macarthur$ ใน [PHI.GetNameDef] มีบทบาทตั้งแตป 1935 และมีบทบาทเชิงรุกมากขึ้นในชวงหลัง บัดนี้ $USA_dwight_d_eisenhower$ ไดกลับบานแลว ระหวางภารกิจเขาไดรับประสบการณทางทหารอันมีคา รวมถึงการขับเครื่องบินครั้งแรก และการทํางานรวมกับผูบังคับบัญชาอยาง $USA_douglas_macarthur$ ซึ่งมีแนวคิดแตกตางจากเขาโดยสิ้นเชิงเรื่องการปฏิรูปกองทัพ[PHI.GetAdjective]"
SEA_PHI_political_events.53.a: "ประสบการณของเขาจะเปนประโยชนอยางแนนอน"

SEA_PHI_political_events.54.desc: "เมื่อเพิ่งสูญเสียภูมิภาคมะนิลาไป กองกําลังของเราก็หมดความเชื่อมั่นที่จะชนะสงครามดวยยุทธวิธีแบบดั้งเดิม ขณะที่กองทัพยอมจํานนอยางเปนทางการและรัฐบาลของเราอพยพ องคกรใหมเพื่อตอตานศัตรูก็กําลังกอตัวขึ้นแลว"
SEA_PHI_political_events.54.a: "เราสามารถสูรบตอไปดวยกองโจร"

SEA_PHI_political_events.55.t: "$PHI_treaty_of_manila$"
SEA_PHI_political_events.55.desc: "หลังการเตรียมการทางเศรษฐกิจและการเมืองอยางมาก [PHI.GetNameDef] ไดประกาศเอกราช ซึ่งเปนไปตามคาดหลังจากรัฐบัญญัติไทดิงส-แมกดัฟฟที่รัฐสภาตราเปนกฎหมายในป 1934 ซึ่งวางแนวทางสูเอกราชของ[PHI.GetAdjective] บัดนี้ [PHI.GetNameDefCap] มีอิสระที่จะกําหนดนโยบายการเมืองและเศรษฐกิจของตนเองโดยปราศจากแรงกดดันจาก [USA.GetNameDef]"
SEA_PHI_political_events.55.a: "ยินดีดวยกับพวกเขา"
SEA_PHI_political_events.55.b: "ตอนนี้เรารวมมือกันไดอยางเทาเทียม"
SEA_PHI_political_events.55.c: "ตอนนี้เราตองแสวงหาเอกราชทางการทูตดวย"

SEA_PHI_political_events.56.t: "[FROM.GetName] ขอควบคุมกองทัพเรือในแปซิฟก"
SEA_PHI_political_events.56.desc: "ดวยความตองการจัดตั้งกองทัพเรือและมีสวนรวมในความพยายามทางทหารของเรามากขึ้น [FROM.GetNameDef] ไดขอใหเราโอนหมูเรือเฉพาะกิจหนึ่งหมูหรือมากกวาที่ปฏิบัติการอยูใกลพวกเขาไปอยูในความควบคุมของพวกเขา"
SEA_PHI_political_events.56.a: "เราจัดการกองทัพเรือของเราเองได"
SEA_PHI_political_events.56.b: "ใหพวกเขาดูแลหมูเรือเฉพาะกิจในพื้นที่"
SEA_PHI_political_events.56.c: "ใหพวกเขาดูแลมหาสมุทรแปซิฟก"
SEA_PHI_political_events.56.d: "ใหพวกเขาดูแลมหาสมุทรแปซิฟก แตสงผูกํากับดูแลไปดวย"
SEA_PHI_political_events.56.e: "ใหพวกเขาดูแลมหาสมุทรแปซิฟก และจัดหาเชื้อเพลิงให"
PHI_transfer_20_percent_navy_tt: "โอนกําลังทางเรือ 20% ของเราให [FROM.GetNameDef]"
PHI_transfer_40_percent_navy_tt: "โอนกําลังทางเรือ 40% ของเราให [FROM.GetNameDef]"

SEA_PHI_political_events.57.t: "ไดรับมอบหมายกําลังทางเรือ"
SEA_PHI_political_events.57.desc: "คําขอของเราที่จะควบคุมกําลังทางเรือ[FROM.GetAdjective]ในพื้นที่ไดรับอนุมัติจากรัฐบาลของพวกเขาแลว หมูเรือเฉพาะกิจไดรับคําสั่งใหมายังทาเรือของเราเพื่อรอการจัดระเบียบใหม"
SEA_PHI_political_events.57.desc.2: "$SEA_PHI_political_events.57.desc$ นอกจากนี้ แหลงนํ้ามันใน [371.GetName] จะผลิตเชื้อเพลิงใหกองกําลังของเราเพื่อสนับสนุนการสงกําลังบํารุงหลังการไดมาครั้งสําคัญนี้"
SEA_PHI_political_events.57.a: "นี่เปนการเสริมขีดความสามารถทางทหารของเราอยางมาก"

SEA_PHI_political_events.58.t: "[FROM.GetName] ปฏิเสธที่จะมอบกองทัพเรือ"
SEA_PHI_political_events.58.desc: "นาเสียดายที่พันธมิตร[FROM.GetAdjective]ของเราปฏิเสธคําขอที่จะมอบกองทัพเรือบางสวนใหกองทัพของเรา ดูเหมือนเราจะตองเรงการผลิตของอูตอเรือหากตองการมีสวนรวมในสมรภูมิทางทะเล"
SEA_PHI_political_events.58.a: "เราตองมุงสรางกองทัพเรือของเราเอง"

SEA_PHI_political_events.59.t: "ความลมเหลวของการแทรกแซงโดย[USA.GetAdjective]"
SEA_PHI_political_events.59.desc: "แม [USA.GetNameDef] จะเปดฉากการแทรกแซงทางทหารตอ [PHI.GetNameDef] เพื่อโคนรัฐบาลใหม แตแผนนี้ก็ไมประสบความสําเร็จ เมื่อทั้งสองฝายตระหนักวาสงครามยืดเยื้อไปเปลาๆ การเจรจาเพื่อยุติสงครามจึงเริ่มขึ้น และเอกราชของ[PHI.GetAdjective]ไดรับการรับรองแลว"
SEA_PHI_political_events.59.a: "เสรีภาพไดรับชัยชนะ"
SEA_PHI_political_events.59.b: "สงครามเริ่มไมเปนที่นิยม"

SEA_PHI_political_events.60.t: "อากินัลโดตั้งคําถามตอผลการเลือกตั้ง"
SEA_PHI_political_events.60.desc: "ภายหลังการเลือกตั้งประธานาธิบดีป 1935 [ROOT.GetNeutralLeader] ยังคงไมยอมรับความพายแพอยางขาดลอยของตน และกําลังรองเรียนเรื่องนี้ตอคณะกรรมการที่ดูแลการเลือกตั้ง หากพบหลักฐานการแทรกแซง พรรคนาจะนําเรื่องขึ้นสูศาลสูงสุดแหงใดแหงหนึ่งของประเทศ"
SEA_PHI_political_events.60.a: "คงแคแพแลวไมยอมรับ"

SEA_PHI_political_events.61.t: "ฝายตุลาการลมผลการเลือกตั้ง"
SEA_PHI_political_events.61.desc: "หลังการสอบสวนอยางกวางขวาง คณะกรรมการที่สอบสวนผลการเลือกตั้งป 1935 อางวาพบหลักฐานความผิดปกติ ลําพังเรื่องนี้คงไมนาสนใจนัก หากไมใชเพราะการดําเนินการตอมาของฝายตุลาการที่ตัดสิทธิ์ [ROOT.GetDemocraticParty] สงผลให [ROOT.GetNeutralParty] ไดรับชัยชนะ ความพยายามของ[USA.GetAdjective]ที่จะปดตกกระบวนการนี้อยางรวดเร็วกลับยอนศรอยางรุนแรง เพราะถูกมองวาเปนหลักฐานเพิ่มเติมของการทุจริต"
SEA_PHI_political_events.61.a: "พวกเขารูดีที่สุดวาอะไรดีตอประเทศ"

SEA_PHI_political_events.62.t: "อาสาสมัครสําหรับสงครามกลางเมืองสเปน?"
SEA_PHI_political_events.62.desc: "ความเชื่อมโยงทางประวัติศาสตรและวัฒนธรรมของเรากับ [SPR.GetNonIdeologyName] ทําใหประชาชนของเราติดตามความขัดแยงที่นั่นอยางใกลชิด"
SEA_PHI_political_events.62.a: "ฝายชาตินิยมกําลังสูเพื่อคุณคาแบบคาทอลิกของเรา"
SEA_PHI_political_events.62.b: "ฝายสาธารณรัฐกําลังสูเพื่อเสรีภาพและอิสรภาพ"

SEA_PHI_political_events.63.t: "การเลือกตั้งประธานาธิบดีป [GetYear]"
SEA_PHI_political_events.63.desc: "วาระของประธานาธิบดี [ROOT.GetLeader] คนปจจุบันใกลสิ้นสุดลง และในไมชาจะมีการเลือกตั้งประธานาธิบดีคนตอไป แมความสําเร็จในการนําของ [ROOT.GetLeader] จะเปนภาพที่สดใสสําหรับความเปนไปไดที่เขาจะนําตอไป แตผูมีสิทธิเลือกตั้งบางสวนก็แสวงหาทิศทางใหมสําหรับการปฏิรูปของเรา และประธานาธิบดีคนใหมมาชี้นํา"
SEA_PHI_political_events.63.keep_leader: "[ROOT.GetLeader] ตองอยูตออีกสมัย"
SEA_PHI_political_events.63.roxas: "เสนสายของ $PHI_manuel_roxas$ จะชวยในการปฏิรูปเศรษฐกิจ"
SEA_PHI_political_events.63.laurel: "$PHI_jose_laurel$ จะเปนผูนําที่ดีในยามวุนวายเชนนี้"

SEA_PHI_political_events.64.t: "การถึงแกอสัญกรรมของ $PHI_manuel_luis_quezon$"
SEA_PHI_political_events.64.desc_quezon: "หลังปวยเปนวัณโรค สุขภาพของ $PHI_manuel_luis_quezon$ ที่ทรุดลงเรื่อยๆ ไดนําไปสูการถึงแกอสัญกรรมอยางนาเศรา รองประธานาธิบดีไดรับหนาที่แทนเกซอนชั่วคราวขณะที่ชาติไวทุกข แตอีกไมนานก็ถึงเวลาตองหาผูสืบทอด"
SEA_PHI_political_events.64.desc_generic: "วาระปจจุบันของ [ROOT.GetLeader] สิ้นสุดลงแลว และการเลือกตั้งประธานาธิบดีครั้งใหมจะตัดสินวาใครจะเปนประธานาธิบดีคนตอไป เนื่องจากสุขภาพที่ทรุดโทรมลง $PHI_manuel_luis_quezon$ จึงถอนตัวจากการลงสมัคร"
SEA_PHI_political_events.64.osmena: "$PHI_sergio_osmena$ จะประคับประคองนาวาใหมั่นคง"

SEA_PHI_political_events.65.t: "ดไวต ดี. ไอเซนฮาวร อยูใน [USA.GetName] ตอไป"
SEA_PHI_political_events.65.desc: "นาเสียดายที่คําขอของเราในการเสริมกําลังคณะผูแทนทางทหาร[USA.GetAdjective]ใน [ROOT.GetNameDef] ถูกปฏิเสธ ดูเหมือนแผนการทางทหารอื่นๆ ของ [USA.GetNameDef] ตองการความเชี่ยวชาญของเขา"
SEA_PHI_political_events.65.a: "นาเสียดาย"

SEA_PHI_political_events.66.t: "[FROM.GetName] เสนอสนธิสัญญาชวยเหลือซึ่งกันและกัน"
SEA_PHI_political_events.66.desc: "ในฐานะอีกประเทศหนึ่งในเขตอิทธิพลของ[USA.GetAdjective] [FROM.GetNameDef] ตองการยกระดับความรวมมือภายในเขตอิทธิพลนี้ดวยการกอตั้งพันธมิตรของชาติฮิสแปนิก ซึ่งอาจชวยถวงดุลแรงกดดันจาก[USA.GetAdjective]ที่บางครั้งเกือบจะเปนจักรวรรดินิยม"
SEA_PHI_political_events.66.a: "สิ่งนี้จะสรางเสถียรภาพในภูมิภาค"
SEA_PHI_political_events.66.b: "เราไมอาจทําให [USA.GetNameDef] บาดหมาง"

SEA_PHI_political_events.67.t: "[FROM.GetName] ลงนามสนธิสัญญาชวยเหลือซึ่งกันและกัน"
SEA_PHI_political_events.67.desc: "[FROM.GetNameDefCap] ไดลงนามในสนธิสัญญาชวยเหลือซึ่งกันและกันที่เราเสนอ ซึ่งกําหนดพันธมิตรแบบมีเงื่อนไขที่จะมีผลบังคับใชนับจากนี้ นี่เปนกาวแรกที่ชัดเจนในการเสริมสรางความรวมมือ[FROM.GetAdjective]-[ROOT.GetAdjective]"
SEA_PHI_political_events.67.a: "ขาวดีมาก"

PHI_will_join_faction_later_tt: "§Y[ROOT.GetNameDefCap]§! จะเขารวม§Yฝายของ [FROM.GetNameDef]§! หลังจากผาน §Y$PHI_war_of_independence$§! สําเร็จ"
PHI_will_join_faction_later_PHI_tt: "§Y[FROM.GetNameDefCap]§! จะเขารวม§Yฝายของ [ROOT.GetNameDef]§! หลังจากผาน §Y$PHI_war_of_independence$§! สําเร็จ"

SEA_PHI_political_events.68.t: "[FROM.GetName] ไมลงนามสนธิสัญญาชวยเหลือซึ่งกันและกัน"
SEA_PHI_political_events.68.desc: "ความแตกตางทางอุดมการณ หรืออาจเปนความกังวลวาจะทําให [USA.GetNameDef] บาดหมาง ทําให [FROM.GetNameDef] ไมลงนามในสนธิสัญญาชวยเหลือซึ่งกันและกันที่เราเสนอ ดูเหมือนเราจะตองหาพันธมิตรจากที่อื่น"
SEA_PHI_political_events.68.a: "บางทีคูแขงของพวกเขาในภูมิภาคอาจเต็มใจกวา"

SEA_PHI_political_events.69.t: "[FROM.GetName] เสนอการรวมชาติ"
SEA_PHI_political_events.69.desc: "นับตั้งแตไดรับเอกราช [FROM.GetNameDef] ไดดําเนินการหลายอยางเพื่อรวบรวมเอกราชของตนใหมั่นคง และบัดนี้ตองการขยายความรวมมือกับประเทศฮิสแปนิกอื่นๆ ซึ่งปรากฏออกมาเปนขอเสนอใหรวมประเทศของเรากับของพวกเขาเปนจักรวรรดิฮิสแปนิก"
SEA_PHI_political_events.69.a: "รวมกันเราจะแกแคนการตกเปนอาณานิคม"
SEA_PHI_political_events.69.b: "เราจะไมยอมถูกปกครองจาก [FROM.capital.GetCapitalVictoryPointName]"

SEA_PHI_political_events.70.t: "[FROM.GetName] ยอมรับการรวมชาติ"
SEA_PHI_political_events.70.desc: "คลื่นผูแทน[FROM.GetAdjective]ที่มาเยือน [ROOT.capital.GetCapitalVictoryPointName] บงบอกชัดถึงสิ่งที่ไดรับการยืนยันในไมกี่วันตอมา: [FROM.GetNameDef] ยอมรับคําขอของเราที่จะรวมเขากับ [ROOT.GetNameDef]"
SEA_PHI_political_events.70.a: "ขาวดีมาก!"

SEA_PHI_political_events.71.t: "[FROM.GetName] ปฏิเสธการรวมชาติ"
SEA_PHI_political_events.71.desc: "[FROM.GetNameDefCap] ตัดสินใจไมตกลงตามขอเสนอรวมชาติของเรา แมพวกเขาจะแจงวาเห็นคุณคาของพันธมิตรระหวางเรา แตก็มองวานี่เปนกาวที่ไกลเกินไป"
SEA_PHI_political_events.71.a: "ถาเชนนั้น บางทีความแตกตางของเราอาจมากกวาที่คิด"
SEA_PHI_political_events.71.b: "เราตองยืนกราน"

