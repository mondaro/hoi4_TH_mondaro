 SEA_PRC_request_aid.32.t: "[FROM.GetName] สงรถถังมาให"
 SEA_PRC_request_aid.32.desc: "เพื่อตอบคําขอรถถัง BT-7 ของเรา [FROM.GetName] ไดตกลงสงมาใหเราจํานวนมาก — ไมนอยกวา 350 คัน ซึ่ง (สวนใหญ) เปน BT-7 ใหมเอี่ยม! นายพลของเรากําลังวางแผนวาจะใชงานพวกมันอยางไรใหดีที่สุด รวมถึงจัดตารางฝกใหพลประจํารถถังที่เพิ่งเกณฑมา"
 SEA_PRC_request_aid.32.a: "จุดเริ่มตนของสิ่งยิ่งใหญ"
 
 SEA_PRC_request_aid.33.t: "[FROM.GetName] สงรถถังมาใหบางสวน"
 SEA_PRC_request_aid.33.desc: "เพื่อตอบคําขอรถถัง BT-7 ของเรา [FROM.GetName] ไดตกลงสงมาใหเพียงจํานวนเล็กนอยพอเปนพิธี ไมพอจะติดอาวุธใหกองพลรถถังไดครบ แตก็เพียงพอสําหรับการเริ่มตน อยางนอยเราก็ใชยานพาหนะ 100 คันนี้ฝกพลประจํารถได ขณะที่มองหาวิธีอื่นในการจัดหารถถังสมัยใหม"
 SEA_PRC_request_aid.33.a: "นาจะไดมากกวานี้ แตก็ดีกวาไมมี"
 
 SEA_PRC_request_aid.34.t: "[FROM.GetName] จะผลิตรถถังให"
 SEA_PRC_request_aid.34.desc: "เพื่อตอบคําขอรถถัง BT-7 ของเรา [FROM.GetName] ไดตกลงสราง BT-7 จํานวน 150 คันในอีกไมกี่เดือนขางหนาและสงมาใหเราเมื่อพรอม จะตองใชเวลาสักระยะ แตมาตรการนี้เปนจุดเริ่มตนที่ดีสําหรับความมุงหวังของเราที่จะมีกองกําลังยานเกราะสมัยใหม"
 SEA_PRC_request_aid.34.a: "ยอดเยี่ยม! เราจะใชมันใหเกิดประโยชนเมื่อมาถึง"

 SEA_PRC_request_aid.35.t: "รถถังที่สรางใหมจาก[FROM.FROM.GetName] มาถึงแลว"
 SEA_PRC_request_aid.35.desc: "สินคาชุดหนึ่งจาก[SOV.GetNameDef] ไดมาถึง[ROOT.Capital.GetName] พรอมรถถัง BT-7 ที่สรางใหม 150 คันของเรา ผูมารับสินคามีทั้งผูแทนจากรัฐบาล[ROOT.GetName] และนายทหารชั้นนําของกองทัพบกปลดแอกประชาชน ขณะตรวจดูรถถังที่เพิ่งทาสีดวยสัญลักษณของ PLAGF เหลานายทหารตางกระตือรือรนจะนําไปใช — หลังจากพลประจํารถถังผานชวงฝกและทําความคุนเคยแลว"
 SEA_PRC_request_aid.35.a: "นี่เปนขาวดียิ่ง เราจะใชมันใหเกิดประโยชนสูงสุด!"



 
 SEA_PRC_request_aid.5.t: "[FROM.GetName] สงรถถังมาให"
 SEA_PRC_request_aid.5.desc: "เพื่อตอบคําขอรถถัง T-34 ของเรา [FROM.GetName] ไดตกลงสงมาใหเราจํานวนมาก — ไมนอยกวา 250 คัน ซึ่ง (สวนใหญ) เปน T-34 ใหมเอี่ยม! นายพลของเรากําลังวางแผนวาจะใชงานรถถังเหลานี้อยางไรใหดีที่สุด รวมถึงจัดตารางฝกใหพลประจํารถถังที่เพิ่งไดรับการแตงตั้งใหม"
 SEA_PRC_request_aid.5.a: "จุดเริ่มตนของสิ่งยิ่งใหญ"
 
 SEA_PRC_request_aid.6.t: "[FROM.GetName] สงรถถังมาใหบางสวน"
 SEA_PRC_request_aid.6.desc: "เพื่อตอบคําขอรถถัง T-34 ของเรา [FROM.GetName] ไดตกลงสงมาใหเราเพียงจํานวนเล็กนอยพอเปนพิธี ไมพอจะติดอาวุธใหกองพลรถถังไดครบ แตก็เพียงพอสําหรับการเริ่มตน อยางนอยเราก็ใชยานพาหนะ 50 คันนี้ฝกพลประจํารถถังได ขณะที่มองหาวิธีอื่นในการจัดหารถถังสมัยใหม"
 SEA_PRC_request_aid.6.a: "นาจะไดมากกวานี้ แตก็ดีกวาไมมี"
 
 SEA_PRC_request_aid.7.t: "[FROM.GetName] จะผลิตรถถังให"
 SEA_PRC_request_aid.7.desc: "เพื่อตอบคําขอรถถัง T-34 ของเรา [FROM.GetName] ไดตกลงสราง T-34 จํานวน 150 คันในอีกไมกี่เดือนขางหนาและสงมาใหเราเมื่อพรอม จะตองใชเวลาสักระยะ แตมาตรการนี้เปนจุดเริ่มตนที่ดีสําหรับความมุงหวังของเราที่จะมีกองกําลังยานเกราะสมัยใหม"
 SEA_PRC_request_aid.7.a: "ยอดเยี่ยม! เราจะใชมันใหเกิดประโยชนเมื่อมาถึง"
 
 SEA_PRC_request_aid.8.t: "[FROM.GetName] ปฏิเสธคําขอรถถังของเรา"
 SEA_PRC_request_aid.8.desc: "[FROM.GetName] ปฏิเสธคําขอรถถังของเรา โดยอางวาความจําเปนเรงดวนของตนเองทําใหไมอาจแบงยานพาหนะทั้งที่ประจําการหรือสํารองไวใหได แมจะนาเสียดาย แต[FROM.GetName] ก็สงคูมือการฝกมาใหบาง อยางนอยก็ยังมีสิ่งนั้น"
 SEA_PRC_request_aid.8.a: "นาเสียดายจริง ๆ!"

 SEA_PRC_request_aid.21.t: "รถถังที่สรางใหมจาก[FROM.FROM.GetName] มาถึงแลว"
 SEA_PRC_request_aid.21.desc: "สินคาชุดหนึ่งจาก[SOV.GetNameDef] ไดมาถึง[ROOT.Capital.GetName] พรอมรถถัง T-34 ที่สรางใหม 150 คันของเรา ผูมารับสินคามีทั้งผูแทนจากรัฐบาล[ROOT.GetName] และนายทหารชั้นนําของกองทัพบกปลดแอกประชาชน ขณะตรวจดูรถถังที่ทาสีดวยสัญลักษณของ PLAGF เหลานายทหารตางกระตือรือรนจะนําไปใช — หลังจากพลประจํารถถังผานชวงฝกและทําความคุนเคยแลว"
 SEA_PRC_request_aid.21.a: "นี่เปนขาวดียิ่ง เราจะใชมันใหเกิดประโยชนสูงสุด!"

 SEA_PRC_request_aid.9.t: "[FROM.GetName] ตองการลงนามขอตกลงความรวมมือทางเทคโนโลยี"
 SEA_PRC_request_aid.9.desc: "เราไดรับโทรเลขจาก[FROM.GetLeader] ขอทําขอตกลงความรวมมือทางเทคโนโลยี ขอตกลงนี้จะสงเสริม 'หนทางแหงสหายในการเผยแพรเครื่องมือแหงการปฏิวัติ ทั้งหมดผานความรูและการยกระดับมนุษยชาติ'"
 SEA_PRC_request_aid.9.a: "ตกลงชวยเหลือในภารกิจนี้"
 SEA_PRC_request_aid.9.b: "เราไมมีเวลาสําหรับเรื่องนี้"

 SEA_PRC_request_aid.10.t: "[FROM.GetName] ประกาศลงนามขอตกลงความรวมมือทางเทคโนโลยี"
 SEA_PRC_request_aid.10.desc: "[FROM.GetNameDefCap] ตกลงลงนามขอตกลงความรวมมือทางเทคโนโลยี ซึ่งจะเพิ่มขีดความสามารถในการพัฒนาชาติของเราอยางมาก"
 SEA_PRC_request_aid.10.a: "ยอดเยี่ยม!"

 SEA_PRC_request_aid.11.t: "[FROM.GetName] ปฏิเสธขอตกลงความรวมมือทางเทคโนโลยี"
 SEA_PRC_request_aid.11.desc: "[FROM.GetNameDefCap] ปฏิเสธที่จะลงนามในขอตกลงความรวมมือทางเทคโนโลยี โดยอางวาจําเปนตองใหความสําคัญกับความตองการภายในประเทศกอน แมจะเห็นใจในเปาหมายของเรา แตพวกเขาก็ไมอาจแบงทรัพยากรใดๆ มาใหกับภารกิจนี้ได"
 SEA_PRC_request_aid.11.a: "นาเสียดายจริงๆ!"

 SEA_PRC_faction_events.1.t: "[FROM.GetNameDefCap] เรียกรอง [1032.GetName]"
 SEA_PRC_faction_events.1.desc: "[FROM.GetLeader] ไดสงทูตมาพบ [ROOT.GetLeader] เพื่อหยั่งทาทีวาเราสนใจจะแบงดินแดนของ [XIC.GetName] กันหรือไม"
 SEA_PRC_faction_events.1.a: "ขอตกลงนี้เปนประโยชนตอเรามากกวา"
 SEA_PRC_faction_events.1.b: "เปนไปไมไดเด็ดขาด!"
 SEA_PRC_faction_events.2.t: "การรุกรานที่กําลังจะมาถึง"
 SEA_PRC_faction_events.2.desc: "ดูเหมือนวา [FROM.GetLeader] แหง [FROM.GetName] และ [PRC.GetLeader] แหง [PRC.GetNameDef] ไดรวมมือกันเพื่อแบงดินแดนของเราไปเปนของตน ชางสมกับเปนอสรพิษเสียจริง กองทัพของพวกเขาพรอมจะขามพรมแดนของเราไดทุกเมื่อ หากเราไมขัดขวางแผนการอันขลาดเขลานี้ คําถามคือ เราจะตานทานทั้งสองฝายไวไดนานเพียงใด?"
 SEA_PRC_faction_events.2.a: "ตอตานไปก็ไรประโยชน...."
 SEA_PRC_faction_events.2.b: "ลองมาดูสิ!"
 SEA_PRC_faction_events.3.t: "[FROM.GetLeader] ปฏิเสธขอเสนอของเรา"
 SEA_PRC_faction_events.3.desc: "ดูเหมือนวา [FROM.GetLeader] แหง [FROM.GetName] จะโงเขลาเกินเยียวยา ถึงกับไลทูตของเรากลับมามือเปลา ขอเสนออันใจกวางของเราที่จะแบงเพื่อนบานผูออนแอกันคนละครึ่งถูกเมินเฉยโดยสิ้นเชิง"
 SEA_PRC_faction_events.3.a: "นี่เปนเพียงความพายแพชั่วคราวเทานั้น!"
 SEA_PRC_faction_events.4.t: "[FROM.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 SEA_PRC_faction_events.4.desc: "ภัยคุกคามที่ผนึกกําลังกันของ [CHI.GetNameDef] และ [PRC.GetNameDef] ดูจะหนักหนาเกินไปสําหรับ [FROM.GetLeader] ซึ่งยอมตามขอเรียกรองของเราและตกลงใหกองทัพของเราเดินทัพเขาสู [FROM.GetNameDef] โดยไมมีการตอตาน ดูเหมือนวาผูมีกําลังยอมเปนฝายถูกเสมอ...."
 SEA_PRC_faction_events.4.a: "สถานการณดูดีขึ้นแลว!"
 SEA_PRC_faction_events.5.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของเรา"
 SEA_PRC_faction_events.5.desc: "ดูเหมือนวา [FROM.GetLeader] แหง [FROM.GetName] จะแข็งแกรงกวาที่คาดไว ถึงขั้นไมยอมจํานนตอภัยคุกคามจากกองทัพผสมของ [CHI.GetNameDef] และ [PRC.GetNameDef] การขัดขืนนี้นานับถือพอๆ กับที่โงเขลา ในไมชากองทัพของ [FROM.GetNameDef] จะตองแตกกระเจิงตอหนาแสนยานุภาพของเรา!"
 SEA_PRC_faction_events.5.a: "พวกเขาจะตองเสียใจกับเรื่องนี้"
 SEA_PRC_faction_events.10.t: "[FROM.GetNameDefCap] เสนอเปนพันธมิตร"
 SEA_PRC_faction_events.10.desc: "สาสนจาก [FROM.GetLeader] สงมาถึงเราผานชองทางลับ และดูเหมือนวาความโดดเดี่ยวในหมูบานบนภูเขาไดทําใหผูนํา [FROM.GetNameDef] เปลี่ยนใจ บัดนี้เขาตองการความชวยเหลือจากเราเพื่อรวมจีนใหเปนหนึ่งและปกปองประชาชนจากภัยคุกคามภายนอก เปนขอเสนอที่นาสนใจ แตพวกคอมมิวนิสตไวใจไดหรือ?"
 SEA_PRC_faction_events.10.a: "ปญหาของจีนใหญกวาความบาดหมางของเรา"
 SEA_PRC_faction_events.10.b: "เราจะไมมีวันยอมอยูใตการนําของพวกเขา!"
 SEA_PRC_faction_events.11.t: "[FROM.GetLeader] ผูโงเขลาปฏิเสธขอเสนอของเรา"
 SEA_PRC_faction_events.11.desc: "ผูนําของ [FROM.GetNameDef] ไดแสดงใหโลกเห็นอีกครั้งวา [FROM.GetLeader.GetSheHe] โงเขลาเพียงใด ดวยการปฏิเสธขอเสนอของเราที่จะจัดตั้งแนวรวมเพื่อปกปองและรวมจีนใหเปนหนึ่ง นั่นหมายความวาภาระในการปกปองประชาชนของเราตกอยูกับเราแตเพียงผูเดียว เราจะพิสูจนใหโลกเห็นวาเรามีความสามารถเกินพอสําหรับภารกิจนี้!"
 SEA_PRC_faction_events.11.a: "เราจะปกปองจีนทั้งปวง"
 SEA_PRC_faction_events.20.t: "[FROM.GetLeader] ตั้งคําถามตอการนําของ [?PRC_faction_leader_var.GetName]"
 SEA_PRC_faction_events.20.desc: "[FROM.GetLeader] ไดตั้งคําถามอยางเปดเผยตอการทําสงครามและการนําของ [?PRC_faction_leader_var.GetLeader] ในการประชุมสุดยอดกับสมาชิก [ROOT.GetFactionName] ครั้งลาสุด เขาวิจารณวิธีบริหารและดําเนินสงคราม และกลาวหาวา [?PRC_faction_leader_var.GetName] จงใจยืดเยื้อความขัดแยง นี่อาจเปนเกมของ [FROM.GetLeader] เพื่อเพิ่มอํานาจตอรองภายในพันธมิตร แตบางทีขอกลาวหาของเขาอาจมีมูลความจริงอยูบางก็ได?"
 SEA_PRC_faction_events.20.a: "ชายผูนี้พูดความจริง!"
 SEA_PRC_faction_events.20.b: "ไรสาระสิ้นดี!"
 SEA_PRC_faction_events.21.t: "[FROM.GetNameDefCap] เสนอใหการสนับสนุนเรา"
 SEA_PRC_faction_events.21.desc: "ดูเหมือนวาสุนทรพจนลาสุดของ [ROOT.GetLeader] ที่วิจารณการนํา [ROOT.GetFactionName] ของ [?PRC_faction_leader_var.GetNameDef] จะโดนใจ [FROM.GetLeader] แหง [FROM.GetName] เขาอยางจัง [FROM.GetLeader] ไดยืนยันวาเราจะไดรับการหนุนหลังจาก [FROM.GetName]"
 SEA_PRC_faction_events.21.a: "สัญญาณแหงปญญาอยางชัดเจน"
 SEA_PRC_faction_events.22.t: "[FROM.GetLeader] ตําหนิ [ROOT.GetLeader]"
 SEA_PRC_faction_events.22.desc: "ในสุนทรพจนลาสุดของ [ROOT.GetLeader] เขาไดวิจารณการนํา [ROOT.GetFactionName] ของ [?PRC_faction_leader_var.GetName] ซึ่งไมเปนที่พอใจของผูเขารวมประชุมสุดยอดฝายทุกคน [FROM.GetLeader] แหง [FROM.GetName] ไดตําหนิ [ROOT.GetLeader] อยางเปดเผยวาพยายามบอนทําลาย [ROOT.GetFactionName] และยุยงใหสมาชิกหันมาเปนศัตรูกันเอง"
 SEA_PRC_faction_events.22.a: "คนโงที่มืดบอดก็ยังคงเปนคนโง"
 SEA_PRC_faction_events.30.t: "[FROM.GetNameDefCap] เรียกรองใหจัดสรรดินแดนใหม"
 SEA_PRC_faction_events.30.desc: "ดูเหมือนวา [FROM.GetNameDef] จะแทรกซึมเขามาในดินแดนของเราไดสําเร็จ และไดรับความภักดีจากราษฎรของเราจํานวนมาก บัดนี้พวกเขาเรียกรองใหสงมอบดินแดนเหลานี้ใหแก [FROM.GetNameDef] อยางเปนทางการ แมจะไมไดบอกวาจะเกิดอะไรขึ้นหากเราปฏิเสธ แตก็นาจะนําไปสูการตอบโตดวยกําลัง"
 SEA_PRC_faction_events.30.a: "เราไมมีทางเลือกมากนักจริงๆ..."
 SEA_PRC_faction_events.30.b: "ไรสาระสิ้นดี!"
 SEA_PRC_faction_events.31.t: "[FROM.GetNameDefCap] ยอมรับคําขอของเรา"
 SEA_PRC_faction_events.31.desc: "[FROM.GetNameDefCap] ยอมรับ 'คําขอ' ของเราที่จะสงมอบรัฐที่เราแทรกซึมไดสําเร็จ ทําใหดินแดนอยางเปนทางการของเราเพิ่มขึ้น [FROM.GetNameDefCap] ไมพอใจนัก แตก็ไมกลาตอตานเรา ดินแดนนี้จะอยูภายใตการปกครองของ [ROOT.GetNameDef] อยางเปนทางการนับจากนี้"
 SEA_PRC_faction_events.31.a: "เปนการตัดสินใจที่ชาญฉลาด"
 SEA_PRC_faction_events.32.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะทําตาม"
 SEA_PRC_faction_events.32.desc: "[FROM.GetNameDefCap] ปฏิเสธคําขอของเราที่จะสงมอบดินแดนที่เราแทรกซึมได"
 SEA_PRC_faction_events.32.a: "กาวผิดเพียงกาวเดียวก็อาจตกหนาผา..."
 SEA_PRC_faction_events.32.b: "เราจะไมยอมทนพันธมิตรที่ทรยศ!\n§R[FROM.GetName] อาจหันไปเขารวมฝายอื่น§!"
 SEA_PRC_faction_events.40.t: "เสนทางขางหนา - ชะตากรรมของจีน"
 SEA_PRC_faction_events.40.desc: "เรายืนอยูบนทางแยกที่ตองตัดสินใจวาจะรับมือกับรัฐจีนอื่นๆ อยางไร [ROOT.GetLeader] ไดครุนคิดเรื่องนี้มาหลายคืนจนนอนไมหลับ และดูเหมือนชัดเจนแลววามีเพียงหนทางเดียวเทานั้นที่จะรวมจีนทั้งหมดใหเปนหนึ่ง..."
 SEA_PRC_faction_events.40.a: "การไมตัดสินใจก็คือการตัดสินใจอยางหนึ่ง"
 SEA_PRC_faction_events.40.b: "เราจะสรางเสนทางของเราเอง"
 SEA_PRC_faction_events.40.c: "ความภักดีเกาๆ มีแตจะฉุดรั้งเรา"
 SEA_PRC_faction_events.40.d: "มีจีนที่แทจริงเพียงหนึ่งเดียว!"
 SEA_PRC_faction_events.40.e: "เราจะแข็งแกรงกวาเมื่อรวมกัน"
 SEA_PRC_faction_events.41.t: "[FROM.GetNameDefCap] ออกจาก [ROOT.GetFactionName]"
 SEA_PRC_faction_events.41.desc: "ดูเหมือนวา [FROM.GetLeader] จะตัดสินใจแลววา [FROM.GetNameDef] จะดีกวาหากไมมีกําลังและความมั่นคงที่ [ROOT.GetFactionName] มอบให ก็ไดแตนึกภาพวาพวกเขาจะเอาตัวรอดอยางไรโดยไมมีเรา!"
 SEA_PRC_faction_events.41.a: "ใครกันแนที่จากไป?"
 SEA_PRC_faction_events.42.t: "[ROOT.GetNameDefCap] ถูกขับออกจาก [FROM.GetFactionName]"
 SEA_PRC_faction_events.42.desc: "ดูเหมือนวา [FROM.GetLeader] จะตัดสินใจแลววา [FROM.GetNameDef] และ [FROM.GetFactionName] จะดีกวาหากไมมีเราอยูในพันธมิตร ไมมีใครรูวาความบาคลั่งใดผลักดันให [FROM.GetLeader] ตัดสินใจอยางไรเหตุผลเชนนี้ แตสิ่งหนึ่งที่แนนอนคือ เราตกอยูในสภาพที่เปราะบางกวาเดิม เราไดแตคาดเดาวา [FROM.GetNameDef] กําลังวางแผนอะไรอยู แตที่แนๆ คงไมใชเรื่องดี"
 SEA_PRC_faction_events.42.a: "เราจะอยูไดโดยไมมีพวกเขา"
 SEA_PRC_faction_events.50.t: "[FROM.GetNameDefCap] เสนอเปนพันธมิตร"
 SEA_PRC_faction_events.50.desc: "[FROM.GetLeader] ไดสงคณะผูแทนมาหาเรา พยายามโนมนาวใหเราเขารวมฝายของพวกเขา พวกเขากลาววาเรายืนอยูบนทางแยกที่อนาคตของจีนแขวนอยูบนเสนดาย ตามคําของคณะผูแทนจาก [FROM.GetName] มีเพียงหนทางเดียวเทานั้นที่จะรวมจีนทั้งหมดใหเปนหนึ่ง นั่นคือการรวมมือกัน อดสงสัยไมไดวา [FROM.GetLeader] มีแรงจูงใจแอบแฝงอะไรอยูในใจของ [FROM.GetLeader.GetHerHis] และ [FROM.GetLeader.GetSheHe] ไวใจไดหรือไม..."
 SEA_PRC_faction_events.50.a: "ไม [FROM.GetLeader] ไวใจไมได!"
 SEA_PRC_faction_events.50.b: "หนทางขางหนาของเราคือการรวมมือกัน"
 SEA_PRC_faction_events.51.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 SEA_PRC_faction_events.51.desc: "คณะผูแทนของเราที่ไปพบ [FROM.GetLeader] กลับมามือเปลา นอกจากขาวราย ขอเสนออันใจกวางของเราที่จะเชิญ [FROM.GetNameDef] เขารวมฝายของเรา ดูเหมือนจะไดรับการตอบรับดวยความไมไววางใจและความดูแคลนที่แทบไมปดบัง ดูเหมือนวา [FROM.GetLeader] จะตัดสินใจแลววา [FROM.GetNameDef] จะดีกวาหากไมมีกําลังและความมั่นคงที่ [ROOT.GetFactionName] มอบให ก็ไดแตนึกภาพวาพวกเขาจะเอาตัวรอดอยางไรโดยไมมีเรา!"
 SEA_PRC_faction_events.51.a: "ไลตามเงายอมสูญเสียดวงอาทิตย"
 SEA_PRC_faction_events.52.t: "[FROM.GetNameDefCap] ออกจาก [ROOT.GetFactionName]"
 SEA_PRC_faction_events.52.desc: "เราเพิ่งไดรับขาวจาก [FROM.GetLeader] วา [FROM.GetNameDef] ตัดสินใจถอนตัวจาก [ROOT.GetFactionName] และไปรวมมือกับ [PRC.GetNameDef] ไมมีใครรูวาความบาคลั่งใดผลักดันให [FROM.GetLeader] ตัดสินใจอยางไรเหตุผลเชนนี้ แตหากพวกเขาอยากเชื้อเชิญความยากลําบากและความพินาศ เราจะไปขวางทําไม?"
 SEA_PRC_faction_events.52.a: "วันอันมืดมนรอพวกเขาอยูแนนอน"
 SEA_PRC_faction_events.53.t: "[FROM.GetNameDefCap] เขารวม [ROOT.GetFactionName]"
 SEA_PRC_faction_events.53.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาพรอมขาวดี ปรากฏวา [FROM.GetLeader] เปนผูปกครองที่ฉลาดกวาที่เราเคยใหเครดิต [FROM.GetLeader.GetHerHim] ไวมาก ถึงกับลงนามในขอเสนอพันธมิตรของเรา แมจะไมใชเรื่องเหนือความคาดหมายนัก แตเราควรเตรียมรับฝนเสมอ แลวจะยิ่งยินดีเมื่อแดดออก สิ่งนี้จะเสริมความแข็งแกรงใหประเทศของเราและ [ROOT.GetFactionName] อยางมาก"
 SEA_PRC_faction_events.53.a: "นี่เปนวันยิ่งใหญของจีนทั้งปวง!"

 SEA_PRC_faction_events.60.t: "$generic.2.t$"
 SEA_PRC_faction_events.60.a: "เราจะรับ [FROM.GetName] เขาสู [ROOT.GetFactionName]"
 SEA_PRC_faction_events.60.b: "เราอยูไดดีกวาโดยไมมีพวกเขา"

 SEA_PRC_faction_events.70.desc: "[FROM.GetLeader] ไดสงคณะผูแทนมาหาเรา พยายามโนมนาวใหเราเขารวมฝายของพวกเขา พวกเขากลาววาเรายืนอยูบนทางแยกที่อนาคตของเอเชียแขวนอยูบนเสนดาย ตามคําของคณะผูแทนจาก [FROM.GetName] มีเพียงหนทางเดียวเทานั้นที่จะรักษาเอกราชของเราจากนักลาอาณานิคมตะวันตก นั่นคือการรวมมือกัน"


 SEA_PRC_faction_events.71.t: "[FROM.GetNameDefCap] ตองการปกครองดูแลดินแดนในอารักขาเอเชียของเรา"
 SEA_PRC_faction_events.71.desc: "ในจดหมายจาก [FROM.GetNameDef] [FROM.GetLeader] ขอใหเราปลอยดินแดนในอารักขาในเอเชียไปอยูในความดูแลของพวกเขาภายใต [FROM.GetFactionName] ที่เพิ่งกอตั้งขึ้นใหม"
 SEA_PRC_faction_events.71.a: "ก็ได ถึงเวลาแหงอนาคตที่ดีกวาแลว"
 SEA_PRC_faction_events.71.b: "ไมมีวัน พวกเขาเปนของเรา"


 SEA_PRC_faction_events.72.t: "[FROM.GetNameDefCap] เสนออิสรภาพใหเราอยางมีเงื่อนไข" 
 SEA_PRC_faction_events.72.desc: "[FROM.GetNameDefCap] เสนอจะปลอยเราเปนอิสระ — โดยมีเงื่อนไขขอเดียว: เราจะไดรับเอกราชก็ตอเมื่อเขารวม [PRC.GetFactionName] ที่ [FROM.FROM.GetNameDef] เพิ่งกอตั้งขึ้นใหมเทานั้น"
 SEA_PRC_faction_events.72.a: "เราจะรับทั้งขอเสนอและเงื่อนไข"
 SEA_PRC_faction_events.72.b: "ไม สถานการณปจจุบันของเราก็ดีพออยูแลว"


 SEA_PRC_faction_events.73.t: "[FROM.FROM.GetNameDefCap] ตกลง — [FROM.GetNameDef] เขารวม [PRC.GetFactionName]"
 SEA_PRC_faction_events.73.desc: "[FROM.FROM.GetNameDefCap] ตกลงปลอย [FROM.GetNameDef] เปนอิสระโดยมีเงื่อนไขวาตองเขารวมฝายใหมของเรา และ [FROM.GetNameDef] ก็ตกลง มีการวางแผนจัดพิธีตอนรับขึ้นที่ [ROOT.Capital.GetName]"
 SEA_PRC_faction_events.73.a: "รุงอรุณใหมมาถึงแลว"

 SEA_PRC_faction_events.74.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวม [PRC.GetFactionName]"
 SEA_PRC_faction_events.74.desc: "แมจะไดรับขอเสนอ แต [FROM.GetLeader] ไดประกาศวา [FROM.GetNameDef] ปฏิเสธขอเสนอของ [PRC.GetNameDef] ที่จะเขารวม [PRC.GetFactionName] ที่เพิ่งกอตั้งขึ้นใหม โดยระบุวาประชาชน [FROM.GetAdjective] ตองการคงสถานะเดิมไว"
 SEA_PRC_faction_events.74.a: "พวกเขาไดตัดสินใจแลว"


## New Fourth Army Incident

 SEA_PRC_fourth_army_incident.1.t: "ความไมสงบในหมูพันธมิตร"
 SEA_PRC_fourth_army_incident.1.desc: "ผูบังคับบัญชาของเรารายงานวาการเปนพันธมิตรกับ [PRC.GetNameDef] ไดกอใหเกิดความขัดแยง มีรายงานวาผูบังคับบัญชาฝาย [PRC.GetNameDef] ลังเลที่จะทําตามคําสั่งของเรา และบางครั้งถึงขั้นขัดคําสั่งโดยตรง ซึ่งอาจสรางปญหาใหกับหนวยของเราเอง"
 SEA_PRC_fourth_army_incident.1.a: "[PRC.GetNameDefCap] ควรควบคุมกองกําลังของตนใหดีกวานี้"
 SEA_PRC_fourth_army_incident.1.b: "ความไมไวใจของพวกเขาเปนเรื่องธรรมดา"

 SEA_PRC_fourth_army_incident.2.t: "[FROM.GetNameDefCap] พยายามลดความตึงเครียด" 
 SEA_PRC_fourth_army_incident.2.desc: "หลังเกิดเหตุกระทบกระทั่งระหวางผูบังคับบัญชาของเรากับของ [FROM.GetNameDef] รัฐบาลของพวกเขาไดสงสาสนมาเพื่อคลายความตึงเครียด โดยยืนยันอยางเปนทางการวาเราสามารถบังคับบัญชากองกําลังของเราเองไดตอไป และตองการสรางความรวมมือแบบทวิภาคีมากขึ้นดวยการประสานแผนการรวมกัน"
 SEA_PRC_fourth_army_incident.2.a: "โชคดีที่เราจะไดมุงความสนใจไปที่ภัยคุกคามที่แทจริง"

 SEA_PRC_fourth_army_incident.3.t: "[FROM.GetNameDefCap] รองเรียนเรื่องการขาดการประสานงาน" 
 SEA_PRC_fourth_army_incident.3.desc: "รัฐบาลของ [FROM.GetNameDef] ไดสงคํารองเรียนมายังเราเรื่องการขาดการประสานงานระหวางผูบังคับบัญชาในสนามรบ โดยอางรายงานจากผูบังคับบัญชาของพวกเขาวานายทหารของเราไมยอมทําตามคําสั่งจากกองบัญชาการ [FROM.GetName] ทําใหทุกฝายตกอยูในตําแหนงที่เสี่ยงโดยไมจําเปน โดยเฉพาะอยางยิ่ง [FROM.GetNameDef] ตองการใหเรารับรองวาจะรวมในการถอยทัพทางยุทธวิธีที่กําลังดําเนินอยู และไมทําใหมันลมเหลวเพราะความขัดแยงภายใน"
 SEA_PRC_fourth_army_incident.3.a: "ผูบังคับบัญชาของเราเปนผูกําหนดการปฏิบัติของกองกําลังเรา ไมใชพวกเขา"
 SEA_PRC_fourth_army_incident.3.b: "บางทีพวกเขาอาจมีเหตุผล"

 SEA_PRC_fourth_army_incident.4.t: "[FROM.GetNameDefCap] ตําหนิกองบัญชาการ" 
 SEA_PRC_fourth_army_incident.4.desc: "หลังจากที่เรารองเรียนเรื่องการขัดคําสั่งของกองบัญชาการ [FROM.GetNameDef] รัฐบาลของพวกเขาก็บีบใหกองบัญชาการยอมถอยและใหความรวมมือกับแผนยุทธศาสตรของเราไดสําเร็จ"
 SEA_PRC_fourth_army_incident.4.a: "ดีมาก"

 SEA_PRC_fourth_army_incident.5.t: "กองทัพที่สี่ใหมถูกกองกําลังชาตินิยมโจมตี" 
 SEA_PRC_fourth_army_incident.5.desc: "เราไดรับรายงานวากองทัพที่สี่ใหมถูกทําลายเกือบสิ้นซากหลังถูกกองกําลังชาตินิยมลอมไว ขณะกําลังถอยทัพซึ่งกองบัญชาการของเราไมตองการเขารวม คําบอกเลาวาการสูรบเริ่มตนขึ้นอยางไรยังคลุมเครือ แตสิ่งที่อาจเริ่มจากการยิงพวกเดียวกันโดยไมตั้งใจ ไดกลายเปนการนองเลือดเมื่อทั้งสองฝายสงสัยวาตนถูกโจมตีโดยเจตนา"
 SEA_PRC_fourth_army_incident.5.a: "เรียกรองให [CHI.GetLeader] ดําเนินการ"
 SEA_PRC_fourth_army_incident.5.b: "เราไมอาจไวใจพันธมิตรนี้ไดอีกตอไป"

 SEA_PRC_fourth_army_incident.6.t: "[FROM.GetName] ออกจาก [ROOT.GetFactionName] หลังเหตุยิงพวกเดียวกัน" 
 SEA_PRC_fourth_army_incident.6.desc: "หลังเหตุการณลาสุดที่กองกําลังของ [ROOT.GetName] ปะทะกับกองกําลังของ [FROM.GetName] ฝายหลังไดออกจาก [ROOT.GetFactionName] แลว เหตุการณซึ่งกองทัพที่สี่ใหมของ [FROM.GetNameDef] สูญเสียอยางหนักครั้งนี้ เกิดขึ้นหลังความเห็นไมลงรอยกันเรื่องคําสั่งถอยทัพ จนมีฝายหนึ่งซึ่งไมทราบแนชัดเปดฉากยิงขึ้นเมื่อกองกําลังที่กําลังถอยของเราเผชิญหนากับทหารของ [FROM.GetName]"
 SEA_PRC_fourth_army_incident.6.a: "นี่เปนเรื่องรบกวนที่ไมจําเปนจากปญหาที่อยูตรงหนา"

 SEA_PRC_fourth_army_incident.7.t: "[FROM.GetName] เรียกรองใหดําเนินการหลังเหตุยิงพวกเดียวกัน"
 SEA_PRC_fourth_army_incident.7.desc: "หลังเหตุการณลาสุดที่กองกําลังของ [ROOT.GetName] ปะทะกับกองกําลังของ [FROM.GetName] ฝายหลังเรียกรองใหเรายอมรับสวนรับผิดชอบในเหตุการณนี้ และใหหลักประกันวาผูบังคับบัญชาของเราจะระมัดระวังมากขึ้น เหตุการณซึ่งกองทัพที่สี่ใหมของ [FROM.GetNameDef] สูญเสียอยางหนักครั้งนี้ เกิดขึ้นหลังความเห็นไมลงรอยกันเรื่องคําสั่งถอยทัพ จนมีฝายหนึ่งซึ่งไมทราบแนชัดเปดฉากยิงขึ้นเมื่อกองกําลังที่กําลังถอยของเราเผชิญหนากับทหารของ [FROM.GetName]"
 SEA_PRC_fourth_army_incident.7.a: "ตองโทษการขัดคําสั่งของพวกเขาเทานั้น"
 SEA_PRC_fourth_army_incident.7.b: "เราควรพยายามรักษาไมตรีกับ [FROM.GetNameDef] ไว"

 SEA_PRC_fourth_army_incident.8.t: "[FROM.GetName] ปฏิเสธที่จะขอโทษ" 
 SEA_PRC_fourth_army_incident.8.desc: "ในการตอบสนองตอขอเรียกรองของเราหลังเหตุการณกองทัพที่สี่ใหม [FROM.GetNameDef] ไมยอมรับผิดใดๆ ทั้งสิ้น นี่เปนสัญญาณชัดเจนของความไมไววางใจ หรือแมแตความเปนปรปกษแอบแฝงตอประเทศของเราและกองกําลังที่สนับสนุนความพยายามทําสงครามของพวกเขา"
 SEA_PRC_fourth_army_incident.8.a: "เราไมอาจเสี่ยงใหเกิดความขัดแยงในตอนนี้"
 #no b option here, reuses 5.b
 SEA_PRC_fourth_army_incident.8.c: "เรื่องนี้ตองตอบโตทันที"

 SEA_PRC_fourth_army_incident.9.t: "[FROM.GetName] ยอมถอย" 
 SEA_PRC_fourth_army_incident.9.desc: "แมเราจะไมไดขอโทษ แต [FROM.GetNameDef] ก็แสดงทาทีไมตองการยกระดับความขัดแยงเรื่องเหตุการณกองทัพที่สี่ใหมไปมากกวานี้ แมพวกเขาจะจดจําเหตุการณนี้ไวอยางแนนอน"
 SEA_PRC_fourth_army_incident.9.a: "เปนไปตามคาด"

 SEA_PRC_fourth_army_incident.10.t: "[FROM.GetName] เริ่มสงครามกลางเมืองอีกครั้ง" 
 SEA_PRC_fourth_army_incident.10.desc: "ผลพวงจากเหตุการณกองทัพที่สี่ใหม ทําให [FROM.GetNameDef] มองวาการกระทําของเราเปนการรุกราน และไดเริ่มสงครามกลางเมืองขึ้นอีกครั้ง บัดนี้กองกําลังที่เพิ่งตอสูเคียงบาเคียงไหลกันเมื่อไมนานมานี้กําลังรบกันเองที่แนวหนา และสถานการณหลังแนวหนาก็ไมไดดีไปกวากันนัก"
 SEA_PRC_fourth_army_incident.10.a: "เรารูมาตลอดวาสักวันเรื่องนี้ตองเกิดขึ้น"

 SEA_PRC_fourth_army_incident.11.t: "[FROM.GetLeader] ขอโทษกรณีเหตุยิงพวกเดียวกัน" 
 SEA_PRC_fourth_army_incident.11.desc: "ในการตอบสนองตอคําขอของเราที่สงถึง [FROM.GetLeader] หลังเหตุการณกองทัพที่สี่ใหม [FROM.GetLeader] ไดเขียนจดหมายขอโทษอยางเปนทางการถึงผูนําของเรา เขาสัญญาวาจะพยายามสั่งการใหผูบังคับบัญชาของเขาปฏิบัติตัวตางไปจากเดิมเมื่อเกิดความเห็นไมตรงกันเรื่องคําสั่ง"
 SEA_PRC_fourth_army_incident.11.a: "แคนี้ก็พอแลว"
 #no b option here, reuses 65.b

 SEA_PRC_fourth_army_incident.12.t: "[FROM.GetName] ยอมรับคําขอโทษ" 
 SEA_PRC_fourth_army_incident.12.desc: "หลังไดรับจดหมายขอโทษถึงผูนําของพวกเขา [FROM.GetNameDef] ก็ยอมรับอยางไมคอยเต็มใจนักวาเปนทางออกที่เพียงพอสําหรับเหตุการณกองทัพที่สี่ใหม"
 SEA_PRC_fourth_army_incident.12.a: "ตอนนี้ทั้งสองฝายจะไดมุงไปที่เรื่องเรงดวนกวา"

 SEA_PRC_faction_events.80.t: "[FROM.GetName] เรียกรองใหเรายอมสยบ"
 SEA_PRC_faction_events.80.desc: "สาสนฉบับหนึ่งเดินทางมาจาก [FROM.capital.GetName] ประทับตราของ [FROM.GetLeader] อยางไมอาจเขาใจผิดได เบื้องหลังถอยคําสละสลวยวาดวยเอกภาพและชะตากรรมของชาติ คือขอเรียกรองใหเรายอมจํานนและยอมรับอํานาจของ [FROM.GetNameDef] เหนือดินแดนของเรา ไมมีชองใหเจรจา มีเพียงการเชื่อฟงหรือรับผลที่ตามมา"
 SEA_PRC_faction_events.80.a: "ใหพวกเขามาลองดูสิ"
 SEA_PRC_faction_events.80.b: "เราไมมีทางเลือกนอกจากตองเชื่อฟง"
 SEA_PRC_faction_events.81.t: "[FROM.GetName] ปฏิเสธขอเสนออันใจกวางของเรา"
 SEA_PRC_faction_events.81.desc: "คําขาดของเราถูกปฏิเสธ ดวยการทาทายอยางอุกอาจ [FROM.GetLeader] ไดแสดงใหเห็นชัดวาประชาชนของเขาจะไมยอมจํานน เมื่อทูตของเราถูกไลกลับ การทูตก็ตองหลีกทางใหสงคราม"
 SEA_PRC_faction_events.81.a: "ถาเชนนั้นก็จะถูกบังคับใหสยบ"
 SEA_PRC_faction_events.82.t: "[FROM.GetName] กมหัวยอมรับ"
 SEA_PRC_faction_events.82.desc: "[FROM.GetName] ยอมรับคําขาดของเราแลว ผูนําของพวกเขาพูดถึงเอกภาพแหงชาติและชะตากรรมทางประวัติศาสตร แตความหมายนั้นชัดเจน พวกเขายอมรับความเปนใหญของ [ROOT.GetNameDef] แลว\nแมการยอมจํานนอาจเปนไปอยางไมเต็มใจ แตก็ชวยใหจีนรอดพนจากการแตกแยกและการนองเลือดเพิ่มเติม"
 SEA_PRC_faction_events.82.a: "ดวงตะวันที่แตกกระจายกําลังรวมแสงของตน"

 SEA_PRC_faction_events.90.t: "[FROM.GetNameDefCap] ขอเขารวม [ROOT.GetFactionName]"
 SEA_PRC_faction_events.90.desc: "เมื่อพิจารณาถึงการรุกรานที่ทั้งสองฝายเผชิญอยู [FROM.GetNameDef] ตองการเขารวมกับเรา ซึ่งหมายถึงการรับพวกเขาและสมาชิกทั้งหมดของ [FROM.GetFactionName] เขามาดวย"
 SEA_PRC_faction_events.90.a: "ใช เราตองรวมมือกันตอตานศัตรูรวม"
 SEA_PRC_faction_events.90.b: "ไม เราไวใจพวกเขาไมได"

 SEA_PRC_faction_events.91.t: "[FROM.GetNameDefCap] ปฏิเสธเรา"
 SEA_PRC_faction_events.91.desc: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเราที่จะเขารวมฝายของพวกเขาเพื่อตอตานศัตรูรวม แถลงการณของพวกเขาเนนยํ้าวาแมเราจะแข็งแกรงกวาเมื่อรวมกัน แต [ROOT.GetNameDef] ไวใจไมได"
 SEA_PRC_faction_events.91.a: "นาเสียดายจริงๆ!"

 SEA_PRC_border_war_events.1.t: "[PRC.GetNameDefCap] พิชิต [1045.GetName]"
 SEA_PRC_border_war_events.1.desc: "หลังการปะทะตามแนวพรมแดน [1045.GetName] [PRC.GetNameDef] สามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได บัดนี้ [PRC.GetNameDefCap] อางสิทธิ์วารัฐนี้เปนของตน"
 SEA_PRC_border_war_events.1.a: "เราแข็งแกรงขึ้น!"
 SEA_PRC_border_war_events.1.b: "เราตองถอนกําลัง..."
 SEA_PRC_border_war_events.2.t: "[PRC.GetNameDefCap] ถอนกําลังจาก [1045.GetName]"
 SEA_PRC_border_war_events.2.desc: "หลังการปะทะตามแนวพรมแดน [1045.GetName] [PRC.GetNameDef] ไมสามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได อยางไรก็ตาม [PRC.GetNameDefCap] ก็ยึดปนใหญมาไดจํานวนหนึ่ง"
 SEA_PRC_border_war_events.2.a: "ความพายแพชั่วคราว..."
 SEA_PRC_border_war_events.2.b: "เราขับไลผูรุกรานออกไปไดแลว!"
 SEA_PRC_border_war_events.3.t: "[PRC.GetNameDefCap] พิชิต [615.GetName]"
 SEA_PRC_border_war_events.3.desc: "หลังการปะทะตามแนวพรมแดน [615.GetName] [PRC.GetNameDef] สามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได บัดนี้ [PRC.GetNameDefCap] อางสิทธิ์วารัฐนี้เปนของตน"
 SEA_PRC_border_war_events.4.t: "[PRC.GetNameDefCap] ถอนกําลังจาก [615.GetName]"
 SEA_PRC_border_war_events.4.desc: "หลังการปะทะตามแนวพรมแดน [615.GetName] [PRC.GetNameDef] ไมสามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได อยางไรก็ตาม [PRC.GetNameDefCap] ก็ยึดปนใหญมาไดจํานวนหนึ่ง"
 SEA_PRC_border_war_events.5.t: "[PRC.GetNameDefCap] พิชิต [1032.GetName]"
 SEA_PRC_border_war_events.5.desc: "หลังการปะทะตามแนวพรมแดน [1032.GetName] [PRC.GetNameDef] สามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได บัดนี้ [PRC.GetNameDefCap] อางสิทธิ์วารัฐนี้เปนของตน"
 SEA_PRC_border_war_events.6.t: "[PRC.GetNameDefCap] ถอนกําลังจาก [1032.GetName]"
 SEA_PRC_border_war_events.6.desc: "หลังการปะทะตามแนวพรมแดน [1032.GetName] [PRC.GetNameDef] ไมสามารถเจาะแนวปองกันและผลักดันศัตรูออกไปได อยางไรก็ตาม [PRC.GetNameDefCap] ก็ยึดปนใหญมาไดจํานวนหนึ่ง"

 SEA_PRC_misc_events.1.t: "ประชาชนสงสัยในความมุงมั่นของเรา"
 SEA_PRC_misc_events.1.desc: "ชาวจีนเริ่มสงสัยในความมุงมั่นของเราในการตอตานผูรุกรานตางชาติ!"
 SEA_PRC_misc_events.1.a: "เรื่องนี้จะปลอยไวไมได!"
 SEA_PRC_misc_events.2.t: "การสูญเสียความไววางใจ"
 SEA_PRC_misc_events.2.desc: "ชาวจีนเริ่มสงสัยในความมุงมั่นของเราในการตอตานผูรุกรานตางชาติ"
 SEA_PRC_misc_events.2.a: "เราตองเปลี่ยนความคิดที่พวกเขามีตอเรา"

 SEA_PRC_misc_events.3.t: "$PRC_pavel_mif$ ถูกจับกุมและกวาดลางใน [SOV.GetNameDef]"
 SEA_PRC_misc_events.3.desc: "$PRC_pavel_mif$ อดีตผูใหคําชี้แนะแกกลุมบอลเชวิค 28  ½ คน และบุคคลระดับสูงทั้งในพรรคคอมมิวนิสตจีนและมหาวิทยาลัยซุนยัตเซ็นแหงมอสโก ถูกจับกุมและกวาดลางใน [SOV.GetNameDef] ดูเหมือนวาความเกี่ยวพันของมิฟกับอดีตคูแขงของสตาลินจะนําไปสูจุดจบของเขา"
 SEA_PRC_misc_events.3.a: "ความสูญเสียครั้งใหญ" 

 SEA_PRC_misc_events.5.t: "เฮอหลงและกองทัพแนวรบที่สองเดินทางถึง [ROOT.capital.GetName]"
 SEA_PRC_misc_events.5.desc: "หลังหลบหลีกกองกําลังชาตินิยมมานานกวาสามป เฮอหลงก็เดินทางมาถึง [ROOT.capital.GetName] โดยที่กองทัพของเขาไดรับความเสียหายเพียงเล็กนอย ประสบการณของเฮอหลงในการบังคับบัญชาและฝกกองกําลังชาตินิยมกอนจะเขารวมกองทัพแดงเพื่อนําปฏิบัติการกองโจร จะเปนประโยชนอยางยิ่ง และกองทัพของเขาก็เชนกัน"
 SEA_PRC_misc_events.5.a: "ในที่สุด! เราตองการความเชี่ยวชาญของเขา" 

 SEA_PRC_misc_events.6.t: "เอ็ดการ สโนว นักขาวชาวอเมริกันสัมภาษณเหมา"
 SEA_PRC_misc_events.6.desc: "หลังทํางานเปนนักขาวในสวนอื่นๆ ของจีนมาหลายป เอ็ดการ สโนว ชาวอเมริกัน ไดติดตอขอสัมภาษณเหมา ในการสัมภาษณหลายครั้งตอจากนั้น เหมาและสโนวพูดคุยกันเปนหลักเรื่องจักรวรรดินิยม[JAP.GetAdjective] และวิธีที่ [ROOT.GetNameDef] กับ [CHI.GetNameDef] จะรวมตัวกันตอตาน โดยที่นาสังเกตคือเหมาทํานายวาจะเกิดการปฏิวัติในญี่ปุนหากญี่ปุนพายแพทางทหารอยางรายแรง บทสัมภาษณเหลานี้และประสบการณของสโนวใน [ROOT.GetNameDef] จะกลายเปนรากฐานของหนังสือที่นําเสนอมุมมองอันเปนเอกลักษณของเขาตอชีวิตที่นี่"
 SEA_PRC_misc_events.6.a: "โอกาสที่จะแสดงใหโลกเห็นตัวตนที่แทจริงของเรา" 

 SEA_PRC_misc_events.8.t: "ชวงเวลาแหงผลงานของ $PRC_mao_zedong$"
 SEA_PRC_misc_events.8.desc: "จากถํ้าที่พักบนเนินเขาฟนิกซในเทือกเขาใกลเมืองเหยียนอัน ซึ่งพักอาศัยรวมกับผูนําคนอื่นๆ ของ [ROOT.GetCommunistParty] นอกจากแตงบทกวีแลว เหมายังเขียนงานในหัวขอตางๆ ตั้งแตยุทธวิธีทางทหารไปจนถึงการเมือง"
 SEA_PRC_misc_events.8.a: "งานเขียนเหลานี้จะตองทรงอิทธิพลอยางแนนอน" 

 SEA_PRC_misc_events.9.t: "การประชุมสมัชชาแหงชาติครั้งที่ 7 ของพรรคคอมมิวนิสตจีน"
 SEA_PRC_misc_events.9.desc: "หลังความพายแพของ [JAP.GetNonIdeologyName] พรรคคอมมิวนิสตจีนไดรวมตัวกันเพื่อหารือถึงหนทางขางหนา สมัชชาครั้งที่ 7 นับเปนสมัชชาแหงชาติครั้งแรกนับตั้งแตป 1928 และเปนการกลับมาประชุมบนแผนดินจีน หลังจากสมัชชาครั้งกอนตองจัดที่มอสโกเพราะพรรคออนแอ เรื่องที่หารือรวมถึงความสําเร็จและความลมเหลวของยุทธวิธีของเราในการตอสูกับฝาย[JAP.GetAdjective] ประเด็นอื่นๆ ไดแกการรับรองรัฐธรรมนูญฉบับใหม เพื่อนําวิสัยทัศนของ [ROOT.GetLeader] วาดวยการนําชาติไปขางหนาอยางดีที่สุดมาใช"
 SEA_PRC_misc_events.9.a: "สิ่งนี้จะชวยนําเราสูอนาคต" 

 SEA_PRC_misc_events.10.t: "นายแพทยนอรแมน เบทูน ชาวแคนาดาเดินทางมาถึง"
 SEA_PRC_misc_events.10.desc: "นอรแมน เบทูน คอมมิวนิสตชาวแคนาดาและแพทยสนามผูผานศึกสงครามกลางเมืองสเปน ไดเดินทางมาชวยประชาชน[ROOT.GetAdjective]พัฒนาคุณภาพการรักษาพยาบาล เขาเคยมีชื่อเสียงจากความสําเร็จในการสรางหนวยถายเลือดเคลื่อนที่ และบัดนี้ความพยายามของเขานาจะมุงไปที่การพัฒนาเวชปฏิบัติในพื้นที่ชนบทหางไกลของ [ROOT.GetNameDef]"
 SEA_PRC_misc_events.10.a: "เรายินดีรับอาสาสมัครนานาชาติทุกคน" 

 SEA_PRC_misc_events.11.t: "นอรแมน เบทูน ถึงแกกรรม"
 SEA_PRC_misc_events.11.desc: "ขาวเศรามาถึง [ROOT.Capital.GetName] นายแพทยนอรแมน เบทูน ผูชวยเหลือประชาชนของเราอยางเสียสละมานานกวาสองป ไดถึงแกกรรมหลังจากแผลที่นิ้วซึ่งดูเหมือนเล็กนอยติดเชื้อจนเสียชีวิต หลังไดรับขาวนี้ [ROOT.GetLeader] ไดเขียนคําไวอาลัยยกยองผลงานของเบทูน บทรําลึกนี้เนนถึงความเต็มใจของนายแพทยที่จะเดินทางไปทั่วโลกเพื่อสนับสนุนสหายของเขา และการที่เขาเปนแบบอยางของความรวมมือระหวางชนชั้นกรรมาชีพตางประเทศ"
 SEA_PRC_misc_events.11.a: "คําไวอาลัยที่เหมาะสม" 

 SEA_PRC_misc_events.12.t: "ลงนามสนธิสัญญาไมรุกราน[SOV.GetAdjective]-ญี่ปุน"
 SEA_PRC_misc_events.12.desc: "เพื่อปกปองพรมแดนดานตะวันออก [SOV.GetNameDef] ไดลงนามใน 'สนธิสัญญาความเปนกลาง' กับ [JAP.GetNameDef] แตนั่นหมายความวา [JAP.GetNameDef] จะสามารถขยายอํานาจในเอเชียไดตามใจโดยไมตองกังวลถึงการแทรกแซงของ[SOV.GetAdjective]"
 SEA_PRC_misc_events.12.a: "ยาขมที่ตองกลืน" 

 SEA_PRC_misc_events.13.t: "[FROM.GetNameDefCap] ขอดินแดน"
 SEA_PRC_misc_events.13.desc: "เราไดตอนรับคณะผูแทนจาก [FROM.GetNameDef] ซึ่งมายื่นคํารองขอใหเราสงมอบดินแดนที่พวกเขาอางวาเปนของพวกเขาโดยชอบธรรม และนั่นอาจเปนความจริง... หากมองจากมุมหนึ่ง [FROM.GetLeader] จะซาบซึ้งใจอยางยิ่งหากเรายอมมอบสิ่งที่ชาวจีนขอ และจะไมพอใจพอๆ กันหากเราปฏิเสธ ถึงขนาดที่ [FROM.GetLeader.GetSheHe] อาจพิจารณายึดดินแดนนั้นดวยกําลัง หรืออยางนอยคณะผูแทนก็อางไวเชนนั้น..."
 SEA_PRC_misc_events.13.a: "มอบดินแดนแมนจูเรียของเราใหพวกเขา"
 SEA_PRC_misc_events.13.b: "มอบดินแดนมองโกเลียของเราใหพวกเขา"
 SEA_PRC_misc_events.13.c: "มอบทุกสิ่งที่เราครอบครองใหพวกเขา"
 SEA_PRC_misc_events.13.d: "ไมใหอะไรเลย!"
 SEA_PRC_misc_events.14.t: "[FROM.GetNameDefCap] ยอมตาม"
 SEA_PRC_misc_events.14.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาพรอมขาวดีเยี่ยม! คําขอของเราตอ [FROM.GetLeader] ใหสงมอบดินแดนแมนจูเรียอันชอบธรรมของเราไดรับการอนุมัติ [ROOT.GetLeader] ไดกลาวชื่นชมทั้ง [FROM.GetLeader] และนักการทูตของเราอยางลนหลามที่ทําสําเร็จ"
 SEA_PRC_misc_events.14.a: "กาวเขาใกลจีนที่เปนหนึ่งเดียวอีกขั้น!"
 SEA_PRC_misc_events.15.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาพรอมขาวดีเยี่ยม! คําขอของเราตอ [FROM.GetLeader] ใหสงมอบดินแดนมองโกเลียอันชอบธรรมของเราไดรับการอนุมัติ [ROOT.GetLeader] ไดกลาวชื่นชมทั้ง [FROM.GetLeader] และนักการทูตของเราอยางลนหลามที่ทําสําเร็จ"
 SEA_PRC_misc_events.16.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาพรอมขาวดีเยี่ยม! คําขอของเราตอ [FROM.GetLeader] ใหสงมอบดินแดนอันชอบธรรมของเราที่ [FROM.GetNameDef] ครอบครองอยูไดรับการอนุมัติ [ROOT.GetLeader] ไดกลาวชื่นชมทั้ง [FROM.GetLeader] และนักการทูตของเราอยางลนหลามที่ทําสําเร็จ"
 SEA_PRC_misc_events.17.t: "[FROM.GetNameDefCap] ปฏิเสธ"
 SEA_PRC_misc_events.17.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาดวยทาทีหดหู คําขอของเราตอ [FROM.GetLeader] ใหสงมอบดินแดนอันชอบธรรมของเราถูกปฏิเสธอยางเยยหยัน [ROOT.GetLeader] สาปแชงทั้ง [FROM.GetLeader] และนักการทูตของเราที่ไมสามารถไดสิ่งที่เปนของเราโดยชอบธรรมมา"
 SEA_PRC_misc_events.17.a: "คนโงที่มืดบอดก็ทั้งบอดและโง"
 SEA_PRC_misc_events.17.b: "เราจะยึดสิ่งที่เปนของเราดวยกําลัง!"
 SEA_PRC_misc_events.18.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาดวยทาทีหดหู คําขอของเราตอ [FROM.GetLeader] ใหสงมอบดินแดนอันชอบธรรมของเราถูกปฏิเสธอยางเยยหยัน [ROOT.GetLeader] สาปแชงทั้ง [FROM.GetLeader] และนักการทูตของเราที่ไมสามารถไดสิ่งที่เปนของเราโดยชอบธรรมมา"
 SEA_PRC_misc_events.18.a: "สงมอบ [326.GetName]"
 SEA_PRC_misc_events.18.b: "สงมอบ [729.GetName]"
 SEA_PRC_misc_events.18.c: "สงมอบ [728.GetName]"
 SEA_PRC_misc_events.18.d: "สงมอบทั้งหมด"
 SEA_PRC_misc_events.19.a: "[FROM.GetNameDefCap] สงมอบ [326.GetName]"
 SEA_PRC_misc_events.19.b: "[FROM.GetNameDefCap] สงมอบ [729.GetName]"
 SEA_PRC_misc_events.19.c: "[FROM.GetNameDefCap] สงมอบ [728.GetName]"
 SEA_PRC_misc_events.19.d: "[FROM.GetNameDefCap] สงมอบทั้งหมด"
 SEA_PRC_misc_events.19.e: "[FROM.GetNameDefCap] สงมอบ [743.GetName]"
 SEA_PRC_misc_events.19.desc: "โชคดีที่ [FROM.GetNameDef] ยอมตามขอเรียกรองของเรา"

 SEA_PRC_political_events.1.t: "$PRC_wang_ming$ หรือ $PRC_bo_gu$ จะเปนผูนํา [Root.GetName]?"
 SEA_PRC_political_events.1.desc1: "เมื่อกลุมบอลเชวิค 28  ½ คนเปนฝายชนะในการแยงชิงอํานาจ ก็ถึงเวลาเลือกตัวแทนขึ้นนําประเทศ แมจะลี้ภัยอยูใน [SOV.GetNameDef] แตก็ถึงเวลาที่ $PRC_wang_ming$ จะกลับมาเปนผูนํา หาก $PRC_bo_gu$ ไมไดรับเลือก"
 SEA_PRC_political_events.1.desc2: "เมื่อกลุมบอลเชวิค 28  ½ คนเปนฝายชนะในการแยงชิงอํานาจ ก็ถึงเวลาเลือกตัวแทนขึ้นนําประเทศ แมผูสมัครทั้งสองจะมีสายสัมพันธอันดีกับคอมมิวนิสตใน [SOV.GetNameDef] แต $PRC_bo_gu$ มีประสบการณทางการเมืองนอยกวา อยางไรก็ตาม เขามีความเขาใจลึกซึ้งในเรื่องการทหารซึ่งอาจเปนประโยชนในการตอสูที่จะมาถึง หากสิ่งนั้นจะมีนํ้าหนักมากกวาความเชี่ยวชาญทางการเมืองและการทูตของ $PRC_wang_ming$ ทั้งสองคนพรอมจะรับภาระนี้แลว"
 SEA_PRC_political_events.1.a: "ให $PRC_wang_ming$ เปนผูนํา"
 SEA_PRC_political_events.1.b: "ให $PRC_bo_gu$ เปนผูนํา"

 SEA_PRC_political_events.2.t: "[FROM.GetNameDefCap] ขอการรับประกันดินแดน"
 SEA_PRC_political_events.2.desc: "แมจะไดรับการสนับสนุนจากเรา และมีที่มั่นคอนขางปลอดภัยในเทือกเขาตอนกลางของจีน แต [FROM.GetNameDef] ก็ขอใหเราใหคํามั่นวาจะปกปองพวกเขาหากเกิดความขัดแยง ไมชัดเจนวาพวกเขากลัวการกวาดลางคอมมิวนิสตอีกครั้งโดยกองกําลังชาตินิยม หรือกลัวจักรวรรดินิยมตางชาติ แตเราตองชั่งนํ้าหนักความเสี่ยงที่จะถูกดึงเขาสูความขัดแยงเชนนั้นกอนจะใหการรับประกันใดๆ"
 SEA_PRC_political_events.2.a: "เราควรปกปองสหายของเรา"
 SEA_PRC_political_events.2.b: "เราจะรับประกันพวกเขา หากพวกเขายอมเปนรัฐในอารักขาของเรา"
 SEA_PRC_political_events.2.c: "เสี่ยงเกินไป"

 SEA_PRC_political_events.3.t: "[FROM.GetNameDefCap] ตกลงรับประกันดินแดน"
 SEA_PRC_political_events.3.desc: "คณะทูตของเราที่ไป [FROM.GetNameDef] ประสบความสําเร็จ พวกเขาใหคํามั่นวาจะปกปองเราจากภัยคุกคามใดๆ ที่อาจเผชิญ การคุมครองนี้นาจะทําใหเรามุงไปที่เปาหมายระยะยาวได เชน การพัฒนา [ROOT.capital.GetName] ซึ่งเปนเรื่องที่อาจตองชะงักไปหากจําเปนตองถอยทัพทางยุทธวิธีอีกครั้งอยางเรงดวน"
 SEA_PRC_political_events.3.a: "เทานี้เราก็นาจะปลอดภัย"

 SEA_PRC_political_events.31.t: "[FROM.GetNameDefCap] ตกลงรับประกันดินแดน — แตมีราคาที่ตองจาย"
 SEA_PRC_political_events.31.desc: "คณะทูตของเราที่ไป [FROM.GetNameDef] ประสบความสําเร็จ พวกเขาใหคํามั่นวาจะปกปองเราจากภัยคุกคามใดๆ ที่อาจเผชิญ การคุมครองนี้นาจะทําใหเรามุงไปที่เปาหมายระยะยาวได เชน การพัฒนา [ROOT.capital.GetName] ซึ่งเปนเรื่องที่อาจตองชะงักไปหากจําเปนตองถอยทัพทางยุทธวิธีอีกครั้งอยางเรงดวน"
 SEA_PRC_political_events.31.a: "เทานี้เราก็นาจะปลอดภัย"
 SEA_PRC_political_events.31.b: "คิดอีกที... อยาเลยดีกวา"

 SEA_PRC_political_events.32.t: "[FROM.GetNameDefCap] เปลี่ยนใจ"
 SEA_PRC_political_events.32.desc: "[FROM.GetNameDefCap] ตอบกลับมาวาไมตองการใหเรารับประกันพวกเขาทางการทูตอีกตอไป ดูเหมือนวาหลักการที่ตองกลายเปนรัฐในอารักขาจะเกินกวาที่พวกเขารับได"
 SEA_PRC_political_events.32.a: "พวกเขาเสียเองนั่นแหละ"

 SEA_PRC_political_events.4.t: "[FROM.GetName] ปฏิเสธที่จะรับประกันเรา"
 SEA_PRC_political_events.4.desc: "แมนักการทูตของเราจะพยายามอยางเต็มที่ แต [FROM.GetNameDef] ก็ปฏิเสธที่จะผูกมัดตนเองในการปกปอง [ROOT.GetNameDef] เราไดแตหวังวาคํามั่นในการปกปองเชนนั้นคงไมจําเปนตองใชอยูแลว"
 SEA_PRC_political_events.4.a: "นาเสียดาย"

 SEA_PRC_political_events.5.t: "[FROM.GetName] ตองการเขารวม [ROOT.GetFactionName]"
 SEA_PRC_political_events.5.desc: "[FROM.GetNameDefCap] กาวไปอีกขั้นในการขยายความรวมมือกับเรา ดวยการขอเขารวม [ROOT.GetFactionName] เราตองตัดสินใจวานี่เปนการขยาย [ROOT.GetFactionName] เขาสูจีนที่เปนประโยชน หรือพันธมิตรเชนนี้จะกลายเปนภาระ"
 SEA_PRC_political_events.5.a: "รับพวกเขาเขามา"
 SEA_PRC_political_events.5.b: "เราไมอาจเสี่ยงขยายตัวเกินกําลัง"

 SEA_PRC_political_events.6.t: "[FROM.GetName] ตกลงใหเราเขารวม [FROM.GetFactionName]"
 SEA_PRC_political_events.6.desc: "คณะผูแทนของเราที่ไป [FROM.GetNameDef] กลับมาประกาศวาเราไดรับการตอนรับเขาสู [FROM.GetFactionName] แลว พรอมกันนั้นนักการทูต[FROM.GetAdjective]ก็เดินทางมาหารือถึงรูปแบบความรวมมือของเรา"
 SEA_PRC_political_events.6.a: "วันใหมมาถึงแลว"

 SEA_PRC_political_events.7.t: "[FROM.GetName] ปฏิเสธไมใหเราเขารวม [FROM.GetFactionName]"
 SEA_PRC_political_events.7.desc: "นักการทูตที่เราสงไป [FROM.GetName] กลับมาพรอมขาววาเราไมไดรับอนุญาตใหเขารวม [FROM.GetFactionName] ดูเหมือนวา [FROM.GetNameDef] กําลังมุงความพยายามทางการทูตไปที่อื่น"
 SEA_PRC_political_events.7.a: "นาเสียดาย"

 SEA_PRC_political_events.8.t: "[FROM.GetName] ตองการลงนามสนธิสัญญาไมรุกราน"
 SEA_PRC_political_events.8.desc: "เมื่อเห็นวาตนถูกลอมรอบดวยศัตรูที่อาจเกิดขึ้น [FROM.GetNameDef] จึงติดตอเรามาเพื่อขอทําสนธิสัญญาไมรุกราน เพื่อใหแนใจวาเราจะอยูเฉยในความขัดแยงใดๆ ในภูมิภาคที่มุงเปาไปที่พวกเขา"
 SEA_PRC_political_events.8.a: "อยางไรเราก็ไมอยากเขาไปเกี่ยวของอยูแลว"
 SEA_PRC_political_events.8.b: "นี่อาจทําใหพวกเขากาวราวมากขึ้น"

 SEA_PRC_political_events.9.t: "[FROM.GetName] ตกลงลงนามสนธิสัญญาไมรุกราน"
 SEA_PRC_political_events.9.desc: "หลังไตรตรองอยางรอบคอบ [FROM.GetNameDef] ตัดสินใจลงนามในสนธิสัญญาไมรุกรานที่เราเสนอ โชคดีที่พวกเขาดูไมสนใจจะเขาไปพัวพันกับความขัดแยงในภูมิภาค"
 SEA_PRC_political_events.9.a: "โลงอกไปที"

 SEA_PRC_political_events.10.t: "[FROM.GetName] ปฏิเสธที่จะลงนามสนธิสัญญาไมรุกราน"
 SEA_PRC_political_events.10.desc: "[FROM.GetName] จักรวรรดินิยมไดปฏิเสธคําขอของเราที่จะลงนามสนธิสัญญาไมรุกรานกับเรา ดูเหมือนพวกเขาจะใหความสําคัญกับความสัมพันธกับคูแขงของเรามากกวากับเรา"
 SEA_PRC_political_events.10.a: "นาเสียดาย"

 SEA_PRC_political_events.11.t: "[FROM.GetName] ตองการอิสรภาพ"
 SEA_PRC_political_events.11.desc: "[FROM.GetLeader] ไดสงโทรเลขถึง [Root.GetLeader] เพื่อขอเอกราชให [FROM.GetName] อยางเปนทางการ โทรเลขไมไดระบุวาจะเกิดอะไรขึ้นหากเราปฏิเสธ แตคงเดาไดไมยากวาพวกเขาคงไมพอใจ"
 SEA_PRC_political_events.11.a: "ใหพวกเขาเปนอิสระ"
 SEA_PRC_political_events.11.b: "ไม พวกเขาจะยังคงเปนรัฐในอารักขาของเรา"

 SEA_PRC_political_events.12.t: "[FROM.GetName] ตกลงปลอยเราเปนอิสระ"
 SEA_PRC_political_events.12.desc: "วันนี้เปนวันอันรุงโรจนใน [ROOT.Capital.GetName] เราหลุดพนจากแอกของ [FROM.GetName] แลว ถึงเวลาเฉลิมฉลอง ยุคของเรากําลังจะมาถึง"
 SEA_PRC_political_events.12.a: "ชางเปนวันที่ยอดเยี่ยม!"

 SEA_PRC_political_events.13.t: "[FROM.GetName] ปฏิเสธที่จะปลอยเรา"
 SEA_PRC_political_events.13.desc: "นาเสียดายนัก ในการตอบโทรเลขของ [ROOT.GetLeader] [FROM.GetName] ปฏิเสธที่จะรับรองเอกราชของเรา แตกลับประกาศวาชะตากรรมของเราผูกพันกับพวกเขาอยางแยกไมออก"
 SEA_PRC_political_events.13.a: "ยามคับขันยอมตองใชมาตรการเด็ดขาด..."
 SEA_PRC_political_events.13.b: "เราจะรอจังหวะ..."

 SEA_PRC_political_events.19.t: "นายพลของเราบางคนแปรพักตร!" 
 SEA_PRC_political_events.19.desc: "ความขัดแยงระหวาง [PRC.GetNameDef] และ [CHI.GetNameDef] ไดบั่นทอนกองทัพของเรา เมื่อผูบังคับบัญชาบางคนแปรพักตรไปเขากับฝายคอมมิวนิสต ยังตองรอดูวาพวกเขาเห็นดวยกับ [PRC.GetNameDef] จริงๆ หรือเพียงแคลูตามลม"
 SEA_PRC_political_events.19.a: "พวกทรยศทั้งนั้น"

 SEA_PRC_political_events.20.t: "นายพลทั่วจีนหลั่งไหลมาเขารวมกับเรา"
 SEA_PRC_political_events.20.desc: "การกลับมาสูรบกันอีกครั้งระหวาง [CHI.GetNameDef] และ [PRC.GetNameDef] ไดสรางความไมแนนอนในหมูนายทหารฝายศัตรู ทําใหบางคนแปรพักตรมาอยูฝายเรา"
 SEA_PRC_political_events.20.a: "สัญญาณแหงความหวัง!"

 SEA_PRC_political_events.21.t: "[FROM.GetName] ตองการให $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ เปนที่ปรึกษา"
 SEA_PRC_political_events.21.desc: "\nดวยความตองการคําแนะนําจาก[ROOT.GetAdjective]ดานยุทธศาสตรทางทหาร [FROM.GetNameDef] ไดขอใหเราอนุญาตให $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ กลับไปยังจีน เดิมทีชุยคอฟเคยประจําการอยูใน [FROM.GetNameDef] และพูดภาษาจีนไดคลอง แตถูกเรียกตัวกลับหลังเกิดความขัดแยงเรื่องผลประโยชนของ[ROOT.GetAdjective]ในแมนจูเรีย ในชวงที่แมนจูเรียยังไมถูกญี่ปุนรุกราน"
 SEA_PRC_political_events.21.a: "[FROM.GetNameDefCap] จะไดประโยชนจากความชวยเหลือของพวกเขา"
 SEA_PRC_political_events.21.b: "เราตองการความเชี่ยวชาญของพวกเขาที่บาน"

 SEA_PRC_political_events.22.t: "[FROM.GetName] ตกลงสง $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ มาใหเรา"
 SEA_PRC_political_events.22.desc: "\nผูแทนของเราใน [FROM.capital.GetName] แจงขาวมาวา [FROM.GetNameDef] ยอมรับคําขอของเราที่จะให $SOV_vasily_chuykov$ กลับมายังจีน และแจงวาเขากําลังเดินทางมายัง [ROOT.GetNameDef] แลว นอกจากนี้ $SOV_aleksandr_cherepanov$ ก็รวมเดินทางมาดวย"
 SEA_PRC_political_events.22.a: "ยินดีตอนรับกลับมา!"

 SEA_PRC_political_events.23.t: "[FROM.GetName] ปฏิเสธที่จะสง $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ มาใหเรา"
 SEA_PRC_political_events.23.desc: "\nแม $SOV_vasily_chuykov$ จะเหมาะสมอยางยิ่งกับการเปนผูชวยทูตทหารใน [ROOT.GetNameDef] แต [FROM.GetNameDef] ก็ตัดสินใจไมสงทั้งเขาและ $SOV_aleksandr_cherepanov$ มา โดยอางวาทั้งสองกําลังมีสวนรวมในแผนการทางทหารที่สําคัญกวา"
 SEA_PRC_political_events.23.a: "บางทีหลังการกวาดลาง อาจเหลือผูบังคับบัญชาที่มีฝมืออยูไมมากนัก"

 SEA_PRC_political_events.24.t: "[FROM.GetName] ตองการใหเรายาย $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.24.desc: "\nเมื่อทราบถึงภารกิจของ $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ใน [CHI.GetNameDef] [FROM.GetNameDef] ไดแสดงความสนใจที่จะรับทั้งสองไปเปนผูชวยทูตทหารเชนกัน [FROM.GetNameDefCap] ดูจะเล็งเห็นทักษะเชิงปฏิบัติของผูบังคับบัญชาทั้งสอง ทั้งความคลองแคลวในภาษาจีนและประสบการณทางทหารอันกวางขวาง หรือบางทีพวกเขาอาจเพียงตองการกีดกันไมให [CHI.GetName] ไดความเชี่ยวชาญนี้"
 SEA_PRC_political_events.24.a: "เราจะชวยเหลือสหายของเราใน [FROM.GetNameDef]"
 SEA_PRC_political_events.24.b: "พวกเขากําลังทํางานไดดีใน [CHI.GetName]"

 SEA_PRC_political_events.25.t: "[FROM.GetName] สั่งยาย $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ไปยัง [PRC.GetName]"
 SEA_PRC_political_events.25.desc: "\nหลังจาก [PRC.GetNameDef] ขอใหยาย $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ไปประจําในภูมิภาคของพวกเขา ทั้งสองก็ไดเริ่มออกเดินทางไปแลว แมเราจะขอรองใหอยูเปนที่ปรึกษาตอ แตพวกเขาก็ไมอาจขัดคําสั่งของ [FROM.GetNameDef] ได"
 SEA_PRC_political_events.25.a: "ความสูญเสียของกองทัพเรา"

 SEA_PRC_political_events.26.t: "[FROM.GetName] สั่งยาย $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ไปยัง [PRC.GetName]"
 SEA_PRC_political_events.26.desc: "\n[FROM.GetNameDefCap] ตัดสินใจทําตามคําขอของเรา และสั่งให $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ยายมายัง [ROOT.GetNameDef] คําแนะนําของพวกเขายอมมีคาอยางไมตองสงสัย และการยายครั้งนี้จะเปนการบั่นทอนกองทัพของ [CHI.GetNameDef]"
 SEA_PRC_political_events.26.a: "มาดูกันวาพวกเขาจะมีขอเสนอแนะอะไรบาง"

 SEA_PRC_political_events.27.t: "[FROM.GetName] ปฏิเสธที่จะสง $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ มาใหเรา"
 SEA_PRC_political_events.27.desc: "\nแม [FROM.GetNameDef] จะเคยใหการสนับสนุนเรามากอน แตพวกเขาก็ปฏิเสธที่จะยุติภารกิจของ $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ใน [CHI.GetNameDef] ทําใหเราไมไดผูบังคับบัญชาทั้งสองมาเปนผูชวยทูตทหารที่นี่ พวกเขาใหเหตุผลวากองทัพของ [CHI.GetNameDef] มีความสําคัญสูงตอ [FROM.GetNameDef] ในขณะนี้"
 SEA_PRC_political_events.27.a: "พวกเขากําลังทําผิดพลาด"


 SEA_PRC_political_events.41.t: "สองผูนําจําใจ"
 SEA_PRC_political_events.41.desc: "$PRC_mao_zedong$ และ $PRC_zhang_guotao$ ซึ่งเปนคูแขงทางการเมืองกันมาหลายป ไดพบกันที่ [ROOT.Capital.GetName] เพื่อวางความขัดแยงไวกอนเมื่อเผชิญสถานการณอันคับขัน แมตางฝายจะไมไวใจกันอยางเต็มที่ แตศัตรูของศัตรูก็คือมิตร"
 SEA_PRC_political_events.41.a: "พันธมิตรที่ไมราบรื่น"



 SEA_PRC_zhang_guotao_events.1.t: "ความแตกแยกภายในพรรค"
 SEA_PRC_zhang_guotao_events.1.desc: "$PRC_zhang_guotao$ นายพลผูบัญชาการกองทัพแนวรบที่สี่ นําหนึ่งในสองกองทัพที่ยังมาไมถึงพื้นที่ฐานที่มั่นอันปลอดภัยของเรา พวกเขายังอยูระหวางการเดินทัพทางไกล หลังมีความเห็นไมตรงกับเหมาวาจะใชเสนทางใด ในเดือนตุลาคม 1935 $PRC_zhang_guotao$ ประกาศตนเปนผูนําที่แทจริงของ [ROOT.GetNameDef] และถึงขั้นตั้งคณะกรรมการกลาง รัฐบาลกลาง และคณะกรรมาธิการการทหารกลางของตนเองขึ้นมา นอกจากนี้เขายังประกาศวา $PRC_mao_zedong$, $PRC_zhang_wentian$ และ $PRC_zhou_enlai$ ควรถูกขับออกจากพรรค \n\nบัดนี้ $PRC_zhang_guotao$ ไดสงโทรเลขถึง [ROOT.GetLeader] ประกาศวาเขากําลังนํากองทัพมุงหนาสูความปลอดภัยของพื้นที่ฐานที่มั่น โทรเลขยังระบุวา ตามความประสงคของหลินอวี้อิง ผูแทนของพรรคประจํา [SOV.GetNameDef] กั๋วเทาไดระงับองคกรพรรคของตนเพื่อการคืนดีอยางสันติกับเหมาและคนอื่นๆ ไมวาเขาจะพูดอยางไร กั๋วเทายังคงเปนคูแขงทางการเมืองที่มีพลังและไมควรถูกประเมินตํ่า"
 SEA_PRC_zhang_guotao_events.1.a: "แมกั๋วเทาจะมีกองทัพในมือ แตพรรคก็คัดคานการอางความชอบธรรมของเขา"
 SEA_PRC_zhang_guotao_events.1.b: "บางทีเขาอาจมีเหตุผล?"

 SEA_PRC_zhang_guotao_events.2.t: "โทรเลขจาก $PRC_zhang_guotao$"
 SEA_PRC_zhang_guotao_events.2.desc: "$PRC_zhang_guotao$ แหงกองทัพแนวรบที่สี่ คูแขงทางการเมืองของเหมา ไดสงโทรเลขมาวาเขาและกองทัพกําลังจะถึง [ROOT.Capital.GetName] การเดินทัพทางไกลของพวกเขากินเวลานานกวาของ $PRC_mao_zedong$ เกือบหนึ่งป และกองทัพคงออนลาจากความยากลําบากนี้อยางแนนอน บางทีอาจเปนเพราะเหตุนี้ที่ $PRC_zhang_guotao$ เนนยํ้าอีกครั้งวาเขาไมไดตองการทาทายผูนําพรรคในปจจุบัน" #will arrive soon, drops his claims (for now) etc.
 SEA_PRC_zhang_guotao_events.2.a: "ตอนรับกั๋วเทาและกองทัพของเขา แตจับตาดูเขาอยางใกลชิด"
 SEA_PRC_zhang_guotao_events.2.b: "เราไวใจเขาไมได ประณาม $PRC_zhang_guotao$ และปฏิเสธไมใหเขาดินแดนของเรา"
 PRC_reject_guotao_tt: "§Rสิ่งนี้จะทําใหไมสามารถเขาถึงแผนยุทธศาสตร §!§Y$PRC_the_unwilling_diarchy_focus$§!§R และสายแผนที่ตามมา§!"

 SEA_PRC_zhang_guotao_events.3.t: "$PRC_zhang_guotao$ และกองทัพแนวรบที่สี่เดินทางถึง [ROOT.capital.GetName]"
 SEA_PRC_zhang_guotao_events.3.desc: "ในที่สุด การเดินทัพทางไกลของ $PRC_zhang_guotao$ และกองทัพแนวรบที่สี่ก็สิ้นสุดลง พวกเขามาถึงพื้นที่ฐานที่มั่นของเราในสภาพคอนขางสมบูรณ การสอบถามรายงานไดเริ่มขึ้นแลว แตกั๋วเทายังไมไดสละการอางสิทธิ์ในการเปนผูนํา กลับอางวาเขาสนับสนุนสิ่งที่ตองทําเพื่อชวยใหชนะการตอสูที่จะมาถึง โดยไมอธิบายวาหมายถึงอะไร [Root.GetLeader] จะตองจัดประชุมกรมการเมืองเพิ่มเติมเพื่อสะสางความยุงเหยิงนี้"
 SEA_PRC_zhang_guotao_events.3.a: "การทาทายผูนําพรรคหรือ?"

 SEA_PRC_zhang_guotao_events.4.t: "$PRC_zhang_guotao$ ลาออกจากพรรคคอมมิวนิสต"
 SEA_PRC_zhang_guotao_events.4.desc: "$PRC_zhang_guotao$ ประกาศลาออกจากพรรคคอมมิวนิสตจีน โดยอางถึงความสัมพันธกับคณะกรรมการกลางที่ไมอาจซอมแซมได และความผิดหวังที่มีตอพรรค"
 SEA_PRC_zhang_guotao_events.4.a: "ผูทรยศตออุดมการณของเรา"
 SEA_PRC_zhang_guotao_events.4.b: "โนมนาวใหเขาอยูตอ"
 PRC_zhang_guotao_left_tt: "§Y$PRC_zhang_guotao$§! §Rจะไมสามารถใชงานไดอีกตอไป§! ในฐานะ§Yนายพล§!หรือ§Yที่ปรึกษา§!"
 CHI_guotao_joins_kmt: "$PRC_zhang_guotao$ ไดเขารวมกกมินตั๋ง"

 SEA_PRC_zhang_guotao_events.5.t: "$PRC_zhang_guotao$ ตองการเขารวมกับเรา"
 SEA_PRC_zhang_guotao_events.5.desc: "$PRC_zhang_guotao$ 'อดีต' ผูนําคอมมิวนิสตและคูแขงทางการเมืองของ $PRC_mao_zedong$ ไดเขาพบ [ROOT.GetLeader] เพื่อขอเขารวมฝายเราในการตอสูกับการรุกรานจากตางชาติ ที่ไดชื่อวาเปน 'อดีต' คอมมิวนิสตก็เพราะเขาเพิ่งประณามการนําคณะกรรมการกลางของ [PRC.GetLeader] กั๋วเทาไดออกจากพรรคและบัดนี้ตองการมาอยูกับเรา ประสบการณของเขาอาจเปนประโยชน แต [PRC.GetNameDef] ยอมโกรธเคืองแนที่เรารับคนที่พวกเขามองวาเปนผูทรยศเขามา"
 SEA_PRC_zhang_guotao_events.5.a: "ให $PRC_zhang_guotao$ เขารวมกับเรา"
 SEA_PRC_zhang_guotao_events.5.b: "ปฏิเสธ เราไวใจเขาไมได"

 SEA_PRC_zhang_guotao_events.6.t: "$PRC_zhang_guotao$ เขารวมกกมินตั๋งแลว"
 SEA_PRC_zhang_guotao_events.6.desc: "$PRC_zhang_guotao$ ไมเพียงออกจากพรรคคอมมิวนิสตจีนเทานั้น แตยังเขารวมกกมินตั๋งภายใตการนําของ [CHI.GetNameDef] ดวย หากวันใดเราตองขัดแยงกับพวกเขาโดยตรง $PRC_zhang_guotao$ จะอยูฝายศัตรู"
 SEA_PRC_zhang_guotao_events.6.a: "ผูทรยศ!"

 SEA_PRC_zhang_guotao_events.7.t: "$PRC_zhang_guotao$ ลาออกจากพรรคคอมมิวนิสต"
 SEA_PRC_zhang_guotao_events.7.desc: "$PRC_zhang_guotao$ ประกาศลาออกจากพรรคคอมมิวนิสตจีน โดยอางถึงความสัมพันธกับคณะกรรมการกลางและ $PRC_mao_zedong$ ที่ไมอาจซอมแซมได รวมถึงความผิดหวังที่มีตอพรรค"
 SEA_PRC_zhang_guotao_events.7.a: "สองผูนําจําใจเปนความผิดพลาด เขาไวใจไมได"




#######################
### THE Philippines ###
#######################


SEA_PHI_political_events.1.t: "[FROM.GetName] เสนอขอตกลงการคา" #Japan gets request for trade connection (from PHI to JAP)
SEA_PHI_political_events.1.desc: "ดวยความตองการลดการพึ่งพาการคากับ[USA.GetAdjective] [FROM.GetNameDef] ไดติดตอเรามาพรอมขอเสนอขอตกลงการคาฉบับใหม เชนเดียวกับพวกเขา สิ่งนี้อาจชวยใหเราลดการพึ่งพาคูคากลุมเล็กๆ ไดเชนกัน"
SEA_PHI_political_events.1.a: "การมีแหลงทรัพยากรสํารองที่เราตองการเปนเรื่องสําคัญยิ่ง" ## Agree to trade
SEA_PHI_political_events.1.b: "เรามีคูคารายอื่นในใจแลว" ## Reject Trade

SEA_PHI_political_events.2.t: "ญี่ปุนลงนามขอตกลงการคา"
SEA_PHI_political_events.2.desc: "ขอตกลงการคาที่เราเสนอตอ [FROM.GetNameDef] ไดรับการตอบรับเปนอยางดีจากรัฐบาลของพวกเขา ความกระตือรือรนของพวกเขาเปนจุดเริ่มตนที่ดีในการแสวงหาคูคาใหมของเรา"
SEA_PHI_political_events.2.a: "ขาวดีมาก" 

SEA_PHI_political_events.3.t: "[FROM.GetName] เสนอขอตกลงการคาฉบับใหม" ## These are Siam, Malaya and Dutch East Indies. They get this event from PHI
SEA_PHI_political_events.3.desc: "เมื่อเสนทางสูเอกราชถูกวางไวแลว [FROM.GetNameDef] ไดติดตอเรามาพรอมรางขอตกลงการคาระหวางสองชาติ พวกเขาเสนอขอตกลงที่จะทําใหการนําเขาทรัพยากรจากเรานาสนใจยิ่งขึ้น ซึ่งแตกอนการเลือกคูคาอาจขึ้นอยูกับผลประโยชนของ[USA.GetAdjective] มากกวาผลประโยชนของ[FROM.GetAdjective]"
SEA_PHI_political_events.3.a: "สิ่งนี้จะทําใหเราไดเปรียบในการแขงขัน"
SEA_PHI_political_events.3.b: "พวกเขาจะไดราคาเดียวกับคนอื่นๆ"

SEA_PHI_political_events.4.t: "[FROM.GetName] ตกลงทําขอตกลงการคา" 
SEA_PHI_political_events.4.desc: "ผูแทน[FROM.GetAdjective]ประกาศวาจะสงคณะผูแทนเพิ่มเติมมาจัดทําขอตกลงการคาระหวางสองชาติ ขอตกลงใหมกับ [FROM.GetNameDef] นี้จะเพิ่มทางเลือกใหเราในการจัดหาทรัพยากรสําคัญ"
SEA_PHI_political_events.4.a: "ขาวดีมาก"

SEA_PHI_political_events.5.t: "[FROM.GetName] ปฏิเสธขอตกลงการคา"
SEA_PHI_political_events.5.desc: "ขอเสนอขอตกลงการคาอันสมเหตุสมผลของเราตอ [FROM.GetNameDef] ถูกปฏิเสธ ดูเหมือนวาขอตกลงกับคูคารายอื่นหรือการพิจารณาทางภูมิรัฐศาสตร ทําใหพวกเขาทําในสิ่งที่ขัดตอผลประโยชนของทั้งเราและตัวพวกเขาเอง"
SEA_PHI_political_events.5.a: "เราจะหาคนอื่นมาซื้อทรัพยากรดวย"

SEA_PHI_political_events.6.t: "[FROM.GetName] ใหการสนับสนุน"  ### Support for the Chinese Communists - Sends event from PHI to PRC offering support
SEA_PHI_political_events.6.desc: "อิทธิพลที่เพิ่มขึ้นของ [FROM.GetCommunistParty] ใน [FROM.GetNameDef] เริ่มผลิดอกออกผลแลว เมื่อผูแทนของพรรคเดินทางขามจีนมาแจงเราวากองกําลังอาสาสมัคร[FROM.GetAdjective]กําลังระดมพลเพื่อสนับสนุนกองกําลังของเรา นอกจากนี้ อาสาสมัครเหลานี้ยังนํายุทโธปกรณสวนเกินมาชวยติดอาวุธใหกองกําลังของเราดวย"
SEA_PHI_political_events.6.a: "จุดเริ่มตนที่ดีของความรวมมือกับสหาย[FROM.GetAdjective]ของเรา"
#SEA_PHI_political_events.6.b: "They should focus on their own revolution"

SEA_PHI_political_events.7.t: "[FROM.GetName] ขอบคุณสําหรับการสนับสนุนของเรา" ### Support for the Chinese Communists - They accept
SEA_PHI_political_events.7.desc: "ผูแทนของ [FROM.GetLeader] ไดแสดงความขอบคุณในนามของเขาสําหรับการสนับสนุนจากอาสาสมัครของเราและยุทธปจจัยที่มอบให ดวยประสบการณอันโชกโชนในสงครามกลางเมืองของฝาย[FROM.GetAdjective] ทรัพยากรเหลานี้ยอมถูกใชอยางมีประสิทธิภาพแนนอน"
SEA_PHI_political_events.7.a: "กาวแรกที่ยอดเยี่ยม"

SEA_PHI_political_events.9.t: "[FROM.GetName] เสนอขายเรือแลกกับยุทโธปกรณทางทหาร" ### Request a trade with JAP / USA - convoys for weapons. This is from PHI to JAP/USA
SEA_PHI_political_events.9.desc: "[FROM.GetNameDef] เสนอสงกองเรือพาณิชยและเรือขนสงมาใหเรา เพื่อแลกกับการจัดสง [PHI_GetTradedEquipment]"
SEA_PHI_political_events.9.a: "ขอตกลงดีสุดๆ"
SEA_PHI_political_events.9.b: "เราตองการยุทโธปกรณนั้น"

SEA_PHI_political_events.10.t: "[FROM.GetName] ตกลงซื้อเรือ" ## JAP/USA Accepts trade
SEA_PHI_political_events.10.desc: "ตามที่เราเสนอ [FROM.GetNameDef] ไดสง [PHI_GetTradedEquipment] มาใหเราเพื่อแลกกับเรือพาณิชยและเรือขนสง ซึ่งขณะนี้กําลังแลนไปยังทาเรือ[FROM.GetAdjective]"
SEA_PHI_political_events.10.a: "นี่นาจะเปนประโยชนตอทั้งสองฝาย"

SEA_PHI_political_events.11.t: "[FROM.GetName] ปฏิเสธขอเสนอการคา" ## JAP/USA rejects trade
SEA_PHI_political_events.11.desc: "นาเสียดายที่ [FROM.GetNameDef] ปฏิเสธที่จะมอบ [PHI_GetTradedEquipment] ใหเราเพื่อแลกกับเรือบางสวนของเรา"
SEA_PHI_political_events.11.a: "บางทีพวกเขาอาจยอมแลกยุทโธปกรณชนิดอื่น"

SEA_PHI_political_events.12.t: "ภัยคุกคามจากการแทรกแซงของอเมริกาสิ้นสุดลงแลว"
SEA_PHI_political_events.12.desc: "หลังการเจรจาอันดุเดือดและการยอมออนขอหลายครั้งจาก [PHI.GetNameDef] [USA.GetLeader] ไดประกาศวา [USA.GetNameDef] จะไมแทรกแซงแผนการของ [Root.GetRulingPartyLong] [USA.GetLeader.GetSheHeCap] เชื่อมั่นแลววา [PHI.GetNameDef] ไมไดเปนภัยคุกคามเฉพาะหนาตอชาวอเมริกัน และเราไดดําเนินการอยางเหมาะสมเพื่อใหรัฐบาลที่มีเสถียรภาพดําเนินตอไปไดอยางถูกตอง[TreatyOfManilaToBeSigned]"
SEA_PHI_political_events.12.a: "ความพยายามของเราไดผลแลว"
PHI_TreatyOfManilaToBeSigned: "\n\nดังนั้น การเจรจาเพื่อลงนามสนธิสัญญามะนิลาจึงไดรับอนุมัติ และเอกราชของ [PHI.GetNameDef] ที่ตกลงรวมกันดูจะใกลเขามาแลว"

SEA_PHI_political_events.13.t: "ปญหา[PHI.GetCommunistParty]"
SEA_PHI_political_events.13.desc: "พรรคคอมมิวนิสต [PHI.GetNameDef] ปฏิเสธผูแทนของเราซํ้าแลวซํ้าเลา และขูจะตัดความสัมพันธทั้งหมดกับเรา\n\nนายทหารระดับสูงไดเสนอแผนการทางทหารตอ [Root.GetLeader] ผูสนับสนุนแผนนี้ใหเหตุผลวาฟลิปปนสที่เปนคอมมิวนิสตเปนภัยตอความมั่นคงของเรา และเราตองแทรกแซงเพื่อหยุดยั้งการแพรกระจายของลัทธิคอมมิวนิสต"
SEA_PHI_political_events.13.a: "แทรกแซงเพื่อหยุดยั้งคอมมิวนิสตในเอเชียตะวันออกเฉียงใต"
SEA_PHI_political_events.13.b: "ควํ่าบาตร [PHI.GetName]"
SEA_PHI_political_events.13.c: "สงจดหมายประทวงดวยถอยคํารุนแรง"

SEA_PHI_political_events.14.t: "ประกาศสงคราม"
SEA_PHI_political_events.14.desc: "[USA.GetNameDefCap] ไดประกาศสงครามกับ [PHI.GetName] หลังจากไมสามารถคลายความกังวลของ[USA.GetAdjective]เกี่ยวกับบทบาทของ [PHI.GetRulingPartyLong] ได แถลงการณตอสาธารณะของ [USA.GetLeader] ระบุวาสงครามครั้งนี้จําเปนเพื่อหยุดยั้งการแพรกระจายของลัทธิคอมมิวนิสตในเอเชียตะวันออกเฉียงใต"
SEA_PHI_political_events.14.a: "เราจะตอตานอดีตเจาอาณานิคมของเรา"

SEA_PHI_political_events.15.t: "การควํ่าบาตรของ[USA.GetAdjective]"
SEA_PHI_political_events.15.desc: "[USA.GetNameDefCap] ไดประกาศควํ่าบาตรทางการคาตอ [PHI.GetNameDef] อยางสมบูรณ เนื่องจาก 'ความลมเหลวของรัฐบาล[PHI.GetAdjective]ในการจํากัดอิทธิพลคอมมิวนิสต'"
SEA_PHI_political_events.15.a: "อยางนอยก็ไมใชการตอบโตดวยอาวุธ"

SEA_PHI_political_events.16.t: "[USA.GetName] สงหนังสือประทวง"
SEA_PHI_political_events.16.desc: "เพื่อตอบโตการเปลี่ยนแปลงรัฐบาลและนโยบายตางประเทศของเรา รัฐบาล[USA.GetAdjective]ไดสงจดหมายประณามการกระทําของเรา แตเมื่อพิจารณาถึงการแทรกแซงในอเมริกาใตที่ผานมาของพวกเขา นี่ดูเปนปฏิกิริยาที่คอนขางเบา"
SEA_PHI_political_events.16.a: "เมื่อพิจารณาแลว นี่เปนผลลัพธที่ดีที่สุดที่เปนไปได"

SEA_PHI_political_events.17.t: "ผูนําชุดใหมของเรา" ## Pick a new country leader, the communist coup
SEA_PHI_political_events.17.desc: "พรรคคอมมิวนิสตแหงฟลิปปนส (Partido Komunista ng Pilipinas) ฉวยจังหวะที่การกํากับดูแลรัฐบาลแหงชาติของอเมริกาออนแอ เขามาเติมเต็มชองวางอยางรวดเร็ว โดยสมาชิกพรรคที่ไดรับเลือกตั้งเรียกรองใหดําเนินการอยางเด็ดขาดในทันที ซึ่งมีแตพวกเขาเทานั้นที่ทําได แมกลุมอื่นๆ จะยังมีอิทธิพลอยูบาง แตฝายคอมมิวนิสตก็กาวขึ้นมาโดดเดนอยางรวดเร็ว \n \nบัดนี้ เราตองตัดสินวาใครควรนําพรรคและนําชาติไปสูรุงอรุณสีแดงที่กําลังขึ้น"
SEA_PHI_political_events.17.a: "แตงตั้งเอวังเฮลิสตา เราตองการผูนําหัวกาวหนาสุดขั้ว" 
SEA_PHI_political_events.17.b: "แตงตั้งซานโตส เพื่อแนวทางเชิงปญญาชนมากขึ้น"

SEA_PHI_political_events.18.t: "[FROM.GetName] ตองการเขารวมโคมินเทิรน" ## Event to SOV - PHI wants to join Comintern
SEA_PHI_political_events.18.desc: "เราเฝามองการลุกขึ้นของชาวนา กรรมกรโรงงาน และชาวประมงใน [PHI.GetNameDef] ดวยความสนใจยิ่ง และบัดนี้พวกเขาไดยื่นไมตรีทางการทูตมาหาเรา แสดงความสนใจที่จะเขารวมโคมินเทิรน เราควรตอบสนองอยางไร?"
SEA_PHI_political_events.18.a: "ตอนรับ [FROM.GetName] เขาสูโคมินเทิรน" ## Yes, they may join
SEA_PHI_political_events.18.b: "ปฏิเสธพวกเขา"

SEA_PHI_political_events.19.t: "[FROM.GetName] ปฏิเสธไมใหเขารวมโคมินเทิรน" ## Event to PHI - Soviet refuses
SEA_PHI_political_events.19.desc: "คณะผูแทนของเราที่ไป [SOV.GetNameDef] เพิ่งกลับมา แตพวกเขานําขาวรายมาดวย- เราถูกปฏิเสธไมใหเขารวมโคมินเทิรน อยางนอยในตอนนี้ เราตองยืนหยัดเพียงลําพังตานกระแสแหงความมืด"
SEA_PHI_political_events.19.a: "วันนี้โลกดูมืดลงอีกนิด"

SEA_PHI_political_events.20.t: "ดักลาส แมกอาเธอร ไดรับคําสั่งใหไปฟลิปปนส" ## Event to USA - MacArthur going to PHI
SEA_PHI_political_events.20.desc: "ประธานาธิบดี [USA.GetLeader] ไดเรียกดักลาส แมกอาเธอร กลับเขาประจําการ และมอบหมายใหบัญชาการกองกําลังกองทัพบกสหรัฐฯ ในตะวันออกไกลที่เพิ่งจัดตั้งขึ้นใหม ซึ่งประจําการอยูในฟลิปปนส ประธานาธิบดีแตงตั้งเขาเพราะแมกอาเธอรทํางานเปนที่ปรึกษาทางทหารในฟลิปปนสมาหลายป และรูสถานการณการปองกันที่นั่นเปนอยางดี \n \nเพื่อใหเขาบัญชาการกองกําลังภาคพื้นดินที่นั่นไดดียิ่งขึ้น เราจะไมสามารถควบคุมเขาไดอีกตอไป อยางไรก็ตาม เราสามารถเรียกตัวเขากลับไดหากตองการความสามารถของเขาที่นี่ แตเราควรคิดใหรอบคอบกอนทําเชนนั้น เพราะการที่เขาออกจากฟลิปปนสอาจถูกมองวาเปนการถอนผลประโยชนของอเมริกา และการละทิ้งความรับผิดชอบของเราทั่วแปซิฟกในชวงเวลาสําคัญยิ่งนี้"
SEA_PHI_political_events.20.a: "ขอใหโชคดี ทานนายพล!"

SEA_PHI_political_events.21.t: "ดักลาส แมกอาเธอร เดินทางถึงฟลิปปนส" ## Event to PHI - MacArthur has arrived
SEA_PHI_political_events.21.desc: "ขาวดีเยี่ยม! ประธานาธิบดี [USA.GetLeader] ไดมอบหมายใหนายพลดักลาส แมกอาเธอร บัญชาการกองกําลังกองทัพบกสหรัฐฯ ในตะวันออกไกล เรารูจักแมกอาเธอรเปนอยางดี เพราะในชวงเกษียณเขาเคยเปนที่ปรึกษาทางทหารที่นี่มาหลายป และการแตงตั้งเขากลับเขาประจําการเปนสัญญาณที่ชัดเจนวา [USA.GetNameDef] จริงจังกับความรับผิดชอบในการปองกันประเทศของเรา \n \nเมื่อมาถึงมะนิลา เขาก็เริ่มจัดหาทรัพยากรจาก [USA.GetNameDef] ทันที และใหคํามั่นวาจะยืนเคียงขางชาวฟลิปปนสผูกลาหาญตอตานการรุกรานใดๆ จนถึงที่สุด"
SEA_PHI_political_events.21.a: "ยินดีตอนรับสูฟลิปปนส ทานนายพล!"

SEA_PHI_political_events.30.t: "ฟลิปปนสขอตัวไอเซนฮาวร" ## Event to USA - Eisenhower going to PHI
SEA_PHI_political_events.30.desc: "ดักลาส แมกอาเธอร ผูบัญชาการสูงสุดกองกําลังกองทัพบกสหรัฐฯ ในตะวันออกไกล ไดขอตัวดไวต ดี. ไอเซนฮาวร ลูกศิษยของเขามาชวยงาน ไอเซนฮาวรเคยรับราชการภายใตแมกอาเธอรมาแลวในสมัยที่แมกอาเธอรเปนเสนาธิการทหารบก และเห็นไดชัดวานายพลอาวุโสมองเห็นศักยภาพของเขา เราเองก็มองวาไอเซนฮาวรเปนดาวรุงในกองทัพบกสหรัฐฯ และการไดอยูในหนวยบัญชาการที่คึกคักและกําลังขยายตัวเชนนี้จะทําใหเขาไดรับประสบการณมากมาย \n\nไอเซนฮาวรเองเนนยํ้าวาเขาไมไดมองวานี่เปนการแตงตั้งระยะยาว และตั้งใจจะกลับสหรัฐฯ ภายในสองป เมื่อไดเรียนรูทุกสิ่งที่ทําไดจากแมกอาเธอรและจากการเปนนายทหารฝายเสนาธิการประจําการ"
SEA_PHI_political_events.30.a: "แมกอาเธอรกับไอเซนฮาวรทํางานดวยกัน? แนนอนที่สุด!"
SEA_PHI_political_events.30.b: "ไม ไอเซนฮาวรมีประโยชนมากกวาที่นี่" #PHI needs a no explainer

SEA_PHI_political_events.31.t: "ดไวต ดี. ไอเซนฮาวร เดินทางถึงฟลิปปนส" ## Event to PHI - Eisenhower has arrived
SEA_PHI_political_events.31.desc: "คําขอของนายพลแมกอาเธอรใหดไวต ดี. ไอเซนฮาวร มารวมงานกับเราในฟลิปปนสไดรับการอนุมัติแลว! เราโชคดีที่ไดดาวรุงเชนนี้มารวมงาน และนี่เปนอีกหนึ่งขอพิสูจนวาสหรัฐอเมริกาทุมเทเพียงใดในการปกปองเรา เราไดรับแจงชัดเจนวานี่เปนภารกิจระยะสั้นราวสองป แตอาจมีวิธีจูงใจใหเขาอยูในฟลิปปนสตอไป"
SEA_PHI_political_events.31.a: "ยินดีตอนรับสูฟลิปปนส!"

SEA_PHI_political_events.40.t: "มานูเอล เกซอน ถูกลอบสังหาร!" ## Assassination of Quezon
SEA_PHI_political_events.40.desc: "มานูเอล เกซอน ถูกลอบสังหารวันนี้เวลา 15.00 น. ขณะกลาวสุนทรพจนตอผูสนับสนุนที่สวนลูเนตา มือปนยังคงหลบหนี แตสงสัยวามีความเชื่อมโยงกับขบวนการศักดาลิสตา ในระหวางนี้ สมัชชาแหงชาติถูกปดดวยเหตุผลดานความมั่นคงของชาติ ตํารวจภูธรไดปรากฏตัวเต็มกําลังในมะนิลา และถนนหนทางถูกเคลียรจนวางเปลา ความเงียบอันนาอึดอัดปกคลุมทั่วประเทศ ทุกคนตางกลั้นหายใจรอสิ่งที่จะเกิดขึ้นตอไป"
SEA_PHI_political_events.40.a: "คบเพลิงแหงประชาธิปไตยดับวูบลง!"
SEA_PHI_political_events.40.b: "หัวหนาตํารวจไอเซนฮาวรจะเขามาจัดการ!"
PHI_eisenhower_steps_in_tt: "§Gไอเซนฮาวรจะพยายามขัดขวางแผนการของฝายฟาสซิสต§!"

SEA_PHI_political_events.41.t: "ผูลี้ภัยศักดาลิสตากลับมา" ## Assassination of Quezon
SEA_PHI_political_events.41.desc: "อารเตมิโอ ริการเต ซึ่งกลับจากการลี้ภัยพรอมแกนนําผูติดตามที่ถืออาวุธญี่ปุนหลากชนิด อางวาพบและจับกุมมือสังหารมานูเอล เกซอน ไดแลว และบัดนี้ใหคํามั่นวาจะรวมมือกับตํารวจภูธรเพื่อรักษาความสงบเรียบรอยในชวงวิกฤตที่เกิดจากการสังหารประธานาธิบดี เนื่องจากขบวนการศักดาลิสตาตกเปนผูตองสงสัย เขาจึงสัญญาวาจะรวมมือกับพรรคกานัปเพื่อสรางความชอบธรรม และเรงใหไดเอกราชจากสหรัฐอเมริกาโดยเร็วที่สุด เพื่อตอบสนอง ตํารวจภูธรไดถอนกําลังออกจากมะนิลา โดยอางวาเพื่อไมใหความตึงเครียดบานปลาย ขณะที่กองรักษาการณอเมริกันถูกสั่งใหเตรียมพรอมขั้นสูงสุด แมจะยังไมมีความเคลื่อนไหวใดๆ"
SEA_PHI_political_events.41.a: "เอกราชใกลเขามาทุกที"

#Artemio Ricarte, returning from exile with a cadre of followers armed with a variety of Japanese arms have claimed to have found and apprehended the assassin, and are now promising to work together with the constabulary in order to retain order during the crisis caused by the murder of the president. In the mean time, the National Assembly has been closed for reasons of national security."

SEA_PHI_political_events.42.t: "การชิงตําแหนงผูนํา" #Fascist Choose New Leader Aguinaldo, Ricarte or Laurel
SEA_PHI_political_events.42.desc: "เมื่อการควบคุมฟลิปปนสเปนไปอยางมั่นคงแลว และเสถียรภาพเริ่มกลับคืนมา ก็ถึงเวลาที่คณะกรรมาธิการบริหารจะประชุมเพื่อตัดสินวาอํานาจสูงสุดของชาติจะอยูที่ใคร มีผูสมัครสามคนใหเลือก \n\nเอมิลิโอ อากินัลโด วีรบุรุษแหงการปฏิวัติตอตานสเปน เปนผูสนับสนุนเอกราชของฟลิปปนสมาอยางยาวนาน และเคยออกมาพูดวาภายใตสหรัฐอเมริกา ชาวฟลิปปนสเปนเพียงตลาดผูบริโภคสําหรับสินคาสงออกของอเมริกา หรือแยกวานั้นคือเปนคนชายขอบ เพราะชาวฟลิปปนสไมไดรับการยอมรับแมแตเปนพลเมืองสหรัฐฯ \n\nอารเตมิโอ ริการเต ผูบัญชาการกองทัพฟลิปปนสในสงครามตอตานสเปนและสหรัฐอเมริกา ซึ่งตอมาถูกเนรเทศเพราะปฏิเสธที่จะสาบานตนจงรักภักดีตอผูยึดครองอเมริกัน ความรักที่เขามีตอประเทศไมเคยจางหาย แมขณะอาศัยอยูในญี่ปุน เขาก็ยังทํางานเพื่อใหเราไดรับเอกราชในที่สุด \n\nโฆเซ ลอเรล ตัวเลือกสายกลาง ผูพิพากษาศาลฎีกาผูนี้ไดรับการศึกษาในตางประเทศ และมีสายสัมพันธทางครอบครัวกับเจาหนาที่ญี่ปุน จึงอยูในฐานะที่ดีที่จะสรางความสัมพันธระหวางฟลิปปนสกับญี่ปุน และผลักดันขอเรียกรองเอกราชของเราตอไป"
SEA_PHI_political_events.42.a: "อากินัลโดเคยนําเราสูเอกราชมาแลว"
SEA_PHI_political_events.42.b: "ริการเตมีความทุมเทอยางไมยอทอตออุดมการณของเราอยางที่เราตองการ"
SEA_PHI_political_events.42.c: "ลอเรลมีเสนสาย"
PHI_laurel_help: "§Yโฆเซ ลอเรล§! จะเพิ่มโอกาสไดรับการสนับสนุนจากญี่ปุนใน §Yรับประกันการคุมครองจากญี่ปุน§!"

SEA_PHI_political_events.43.t: "การลอมสมัชชาแหงชาติ" #Eisenhower Steps In, Calls in MacArthur
SEA_PHI_political_events.43.desc: "อารเตมิโอ ริการเต ซึ่งกลับจากการลี้ภัยพรอมแกนนําผูติดตามที่ถืออาวุธญี่ปุนหลากชนิด อางวาพบและจับกุมมือสังหารมานูเอล เกซอน ไดแลว แตหัวหนาตํารวจไอเซนฮาวรไดหักลางคํากลาวอางนี้ โดยระบุวาชายผูนั้นเปนเพียงชาวนายากจนที่ถูกจางมาเปนแพะรับบาป \n\nเพื่อตอบโต กลุมดังกลาวจึงเดินขบวนไปยังสมัชชาแหงชาติดวยความมุงมั่นที่จะทวงความยุติธรรม และบุกเขายึดอาคาร มีการยิงปนที่ทางเขา และผูคนที่อยูใกลเคียงถูกยิงสองราย ยามที่อเมริกาใหการสนับสนุนถูกกลาวโทษ และไอเซนฮาวรจําตองถอนตํารวจภูธรออกจากพื้นที่ดวยเกรงวาความตึงเครียดจะบานปลาย \n\nแมเขาจะพยายามอยางเต็มที่ ฝูงชนก็กอตัวขึ้น โดยมีกบฏศักดาลิสตาที่ถูกขนมาจากพื้นที่โดยรอบคอยยุยง จนคุกคามวาจะเอาชนะตํารวจไดทั้งหมด ดวยความสิ้นหวัง  ไอเซนฮาวรไดสงขอความดวนถึง[MessageToMac]กองรักษาการณอเมริกันเพื่อขอความชวยเหลือ"
SEA_PHI_political_events.43.a: "ตอนนี้ขึ้นอยูกับ [MacOrGarrison] แลว"
PHI_message_to_mac: "นายพลดักลาส แมกอาเธอร แหง"
PHI_macarthur: "แมกอาเธอร"
PHI_american_garrison: "กองรักษาการณอเมริกัน"

SEA_PHI_political_events.44.t: "ภาวะฉุกเฉินทางทหาร" #MacArthur announces military emergency
SEA_PHI_political_events.44.desc: "เมื่อถึงเวลา ปฏิกิริยาของ [MacOrGarrison] ก็ฉับพลันและรุนแรงอยางทวมทน โดยไมยอมเสี่ยงใดๆ กองพลฟลิปปนสทั้งกองพลถูกสงเขามะนิลา ทหารมาบุกเขาไปกอน ตามดวยทหารราบติดดาบปลายปนในทันที จุดใดที่มีการตอตานอยางดื้อรั้น ก็ใชแกสนํ้าตาสลาย กองกําลังติดอาวุธศักดาลิสตาตกตะลึงกับกําลังอันทวมทน จําตองทิ้งเครื่องกีดขวางและสลายตัวหนีออกจากเมือง \n\nแมภัยคุกคามจากรัฐประหารฟาสซิสตในเบื้องตนจะถูกสกัดไวได แตก็ยังมีอันตรายที่จะบานปลายเปนสงครามกลางเมือง ดวยเหตุนี้ [MacOrEisenhower] จึงเห็นสมควรประกาศภาวะฉุกเฉินทางทหาร บังคับใชกฎอัยการศึก และรับอํานาจเผด็จการเพื่อใหการปกครองมีเสถียรภาพตอเนื่อง"
SEA_PHI_political_events.44.a: "ทั้งหมดนี้ในนามของเสรีภาพและประชาธิปไตย!"
PHI_eisenhower: "ไอเซนฮาวร"
PHI_declare_military_emergency_tt: "สิ่งนี้ไดปลดล็อกสายแผนยุทธศาสตรใหมทางซายสุด"

