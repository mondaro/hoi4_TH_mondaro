 # Requesting Soviet aid 
 SEA_china.1.t: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเรา"
 SEA_china.1.desc: "เราไดรับคํารองจาก[FROM.GetNameDef] ขอใหเราสงความชวยเหลือดานยุทโธปกรณ แม[FROM.GetLeader] เคยกลาวถึงเราในทางที่นากังขาในอดีต แตนี่อาจเปนโอกาสที่จะตรึงผลประโยชนของตางชาติในภูมิภาคนี้ไว"
 SEA_china.1.a: "เราจะสนับสนุนพวกเขา"
 SEA_china.1.b: "เสี่ยงเกินไป"

 SEA_china.2.t: "[FROM.GetNameDefCap] ตกลงสนับสนุนเรา"
 SEA_china.2.desc: "ในชวงเวลาแหงความกระจาง [FROM.GetNameDef] ไดตัดสินใจสนับสนุนเราในการตอสู เราไมไดคิดวานี่เปนการกระทําดวยนํ้าใจ แตเปนผลประโยชนสวนตนที่จะใหเราทํางานสกปรกแทนพวกเขาเสียมากกวา"
 SEA_china.2.a: "สิ่งนี้จะชวยความพยายามของเรา"

 SEA_china.3.t: "[FROM.GetNameDefCap] ปฏิเสธคํารองของเรา"
 SEA_china.3.desc: "ไมนาแปลกใจที่คํารองขอการสนับสนุนของเราถูก[FROM.GetNameDef] ปฏิเสธ แมเราจะไมไดหวังไวมากนัก แตก็คาดวาอยางนอยพวกเขาจะยอมรับถึงภัยคุกคามที่[JAP.GetNameDef] มีตอเอเชียทั้งมวล แตเห็นไดชัดวาเราคิดผิด" 
 SEA_china.3.a: "จะคาดหวังอะไรได"

 # Requesting American/Allied aid
 SEA_china.4.t: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเรา"
 SEA_china.4.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดสงคํารองขอความชวยเหลือดานการเงินและยุทโธปกรณในการตอสูกับ[JAP.GetNameDef] สารนี้มิไดสงมาทางวิทยุหรือผานทูตธรรมดา แตผานบุคคลสําคัญอยาง $CHI_soong_mei_ling$ ผูดึงดูดฝูงชนไดมากมายระหวางเดินทางทั่ว[ROOT.GetName] แมการตรึง[JAP.GetNameDef] ไวจะเปนประโยชนตอเราอยูแลว แตเราอาจไดประโยชนจากกระแสความนิยมของการเดินทางครั้งนี้ดวย" 
 SEA_china.4.a: "เราจะสนับสนุนพวกเขา"
 SEA_china.4.b: "เราตองดูแลความมั่นคงของตนเองกอน"
 SEA_china.4.tt: "เพิ่มรางวัล §Yยุทโธปกรณปนใหญ§! จาก §Yแสดงความแนวแนของเรา§! อีก 100"

 SEA_china.5.t: "[FROM.GetNameDefCap] ตกลงสนับสนุนเรา"
 SEA_china.5.desc: "เราไดรับคําตอบตอคํารองแลว และยินดีจะรายงานวาเงินทุนจากตางประเทศจะพรอมใหเราใชในไมชา สิ่งนี้จะเปนประโยชนอยางยิ่งตออุตสาหกรรมของเราและชวยใหเราขยายกองทัพไดอยางมาก และเปนไปไดวาความชวยเหลืออาจขยายไปถึงยุทโธปกรณในภายหลัง"
 SEA_china.5.a: "เสนทางสูชัยชนะเปดกวางแลว"
 SEA_china.5.tt: "เพิ่มรางวัล §Y$CIC_BANK_HEADER$§! จาก §Yแสดงความแนวแนของเรา§! อีก §Y1000§!"

 SEA_china.6.t: "[FROM.GetNameDefCap] ปฏิเสธคํารองของเรา"
 SEA_china.6.desc: "คําตอบตอคําวิงวอนของเราไดกลับมาจาก[FROM.GetNameDef] แลว พวกเขาเลือกที่จะทอดทิ้งเรา จะไมมีการสงความชวยเหลือหรือเงินทุนใด ๆ มาให เรายืนหยัดเพียงลําพังตอหนาการรุกรานดังที่เคยเปนมาหลายครั้ง เราจะตองชนะ เพราะหากไมชนะ มรดกของเราจะถูกลืมเลือน"
 SEA_china.6.a: "สูเพื่อความอยูรอดของประเทศ!"

 ### Warlord - Invitation to Join Faction
 SEA_china.7.t: "คําเชิญจาก[FROM.GetName]"
 SEA_china.7.desc: "รัฐบาลกลางของ[FROM.GetName] ไดยื่นคําเชิญให[ROOT.GetName] เขารวมฝายของพวกเขา พวกเขาพูดถึงเอกภาพของชาติและความจําเปนที่ตองตอตานการรุกลํ้าของตางชาติเปนหนึ่งเดียว แมความแตกตางทางอุดมการณยังคงอยู แตลูทางความรวมมือเมื่อเผชิญภัยคุกคามที่เพิ่มขึ้นก็อาจควรคาแกการพิจารณา"
 SEA_china.7.a: "เราจะยืนหยัดรวมกันตอตานศัตรู"
 SEA_china.7.b: "เราจะไมแลกเอกราชกับคําสัญญา"

 ### SEA_china.8 - Acceptance
 SEA_china.8.t: "[FROM.GetName] ตอบรับคําเชิญ"
 SEA_china.8.desc: "[FROM.GetLeader] ไดตกลงตามขอเสนอของเรา [FROM.GetNameDefCap] จะเขารวมฝายของเราและยืนเคียงขางเราในการตอสูเพื่อรวมชาติและปกปองจากภัยภายนอก นี่คือกาวสําคัญสูเอกภาพของจีนที่ยิ่งใหญกวาเดิม"
 SEA_china.8.a: "เมื่อรวมกัน เราแข็งแกรงกวา"

 ### SEA_china.9 - Rejection
 SEA_china.9.t: "[FROM.GetName] ปฏิเสธขอเสนอ"
 SEA_china.9.desc: "[FROM.GetLeader] ปฏิเสธที่จะเขารวมฝายของเรา โดยอางความจําเปนที่จะรักษาความเปนอิสระของภูมิภาคและอํานาจปกครองตนเองทางการเมือง แมจะนาเสียดาย แตการตัดสินใจนี้สะทอนความแตกแยกที่ยังคงฝงรากอยูในประเทศ"
 SEA_china.9.a: "สักวันพวกเขาจะเสียใจ"


# Joining the Allies
 SEA_china.10.t: "[FROM.GetNameDefCap] ขอเขารวมกับเรา"
 SEA_china.10.desc: "เราไดรับขอเสนอจาก[FROM.GetNameDef] ที่จะเขารวม[ROOT.GetFactionName] พรอมกับสมาชิกทั้งหมดของ[FROM.GetFactionName] หากเราตอบรับ คูแขงที่อาจเปนไปไดจะลดลงหนึ่งราย และสถานะของเราจะแข็งแกรงขึ้น คําถามคือเราจะไวใจไดหรือไมวาพวกเขาไมคิดจะเขามาแทนที่เรา"
 SEA_china.10.a: "พลังของเราอยูที่จํานวน"
 SEA_china.10.b: "เรายอมรับเรื่องนี้ไมได"

 SEA_china.11.t: "[FROM.GetNameDefCap] สนับสนุนการเขารวมของเรา"
 SEA_china.11.desc: "เราไดรับคําตอบจากผูนําของ[FROM.GetFactionName] แลว และยุคแหงการมองแตมุมเล็ก ๆ ของโลกเราเองไดสิ้นสุดลง รัฐบาลของ[FROM.GetNameDef] ตอนรับเราดวยออมแขนที่เปดกวาง และบัดนี้เราสามารถยืนในเวทีโลกอยางเทาเทียมไดแลว"
 SEA_china.11.a: "เราจะเดินบนเสนทางนี้ไปดวยกัน"

 SEA_china.12.t: "[FROM.GetNameDefCap] ปฏิเสธคํารองของเรา"
 SEA_china.12.desc: "ผูนําของ[FROM.GetFactionName] ไดปฏิเสธขอเสนอที่จะรวมกําลังกับเรา นี่เปนโอกาสที่จะนําสันติภาพและเสถียรภาพมาสูโลก แตนาเสียดายที่บางคนตอตานสิ่งเหลานี้"
 SEA_china.12.a: "นาเสียดายจริง ๆ"
 SEA_china.12.b: "เราจะเดินบนเสนทางของเราเอง"


# Chiang gets killed
 SEA_china.13.t: "[CHI.GetLeader] ถูกสังหาร"
 SEA_china.13.desc: "ผูนําผูยิ่งใหญของเรา [CHI.GetLeader] ถูกยิงในรถยนตของเขา เปนจุดจบอันหายนะของการปะทะบนทองถนน เราไดรับแจงวามือปนลงมือเพียงลําพัง แตเมื่อเขาถูกสังหารระหวางการไลลาในทันที ผูสมรูรวมคิดใด ๆ ที่อาจมีอยูก็จะลอยนวล พรรคไดเริ่มมองหาผูสืบทอดแลว"
 SEA_china.13.a: "ชางนาเศรา"

# Giving away Subject
 SEA_china.14.t: "[FROM.GetName] กําลังโอนการควบคุมของตนให[JAP.GetNameDef]"
 SEA_china.14.desc: "ดวยความสิ้นหวังที่จะเอาใจ[JAP.GetNameDef] รัฐบาลกลางไดเสนอใหพวกเขาเปนเจาเหนือหัวของเรา นี่เปนการกระทําที่นาอัปยศ เราไมคาดคิดวารัฐบาลใหมจะกลาถึงเพียงนี้"
 SEA_china.14.a: "เรื่องที่เกิดขึ้นแลวแกไขไมได..."
 SEA_china.14.b: "เรายอมรับเรื่องนี้ไมได จับอาวุธ!"
 SEA_china.15.t: "การควบคุม[FROM.GetNameDef] ไดถูกมอบใหแกเรา"
 SEA_china.15.desc: "เพื่อเอาใจฝายในกองทัพของเราที่ผลักดันใหทําสงคราม [CHI.GetName] ไดโอนการควบคุม[FROM.GetName] มาใหเรา ดูเหมือนเราจะไมมีความขัดแยงใด ๆ ในอนาคตอันใกล"
 SEA_china.15.a: "ดีมาก"

 # Informing Japan
 SEA_china.16.t: "[From.GetName] มอบสิทธิ์จอดเรือใหเรา"
 SEA_china.16.desc: "ในความพยายามเอาใจไมใหเราโจมตี [From.GetName] ไดมอบสิทธิ์จอดเรือใหเรา กองทัพกวานตงจึงตัดสินใจถอยไปกอนในตอนนี้"
 SEA_china.16.a: "ยอดเยี่ยม!"
 SEA_china.17.t: "[From.GetName] มอบสิทธิ์ใชฐานทัพอากาศใหเรา"
 SEA_china.17.desc: "ในความพยายามเอาใจไมใหเราโจมตี [From.GetName] ไดมอบสิทธิ์ใชฐานทัพอากาศใหเรา กองทัพกวานตงจึงตัดสินใจถอยไปกอนในตอนนี้"
 SEA_china.17.a: "ยอดเยี่ยม!"
 SEA_china.18.t: "[From.GetName] มอบสิทธิ์ในทรัพยากรใหเรา"
 SEA_china.18.desc: "ในความพยายามเอาใจไมใหเราโจมตี [From.GetName] ไดมอบสิทธิ์ในทรัพยากรใหเรา กองทัพกวานตงจึงตัดสินใจถอยไปกอนในตอนนี้"
 SEA_china.18.a: "ยอดเยี่ยม!"

### Chinese Nine-Power Treaty Crisis ###
 SEA_china.19.t: "[CHI.GetName] เรียกรองใหยกเลิกสนธิสัญญาเกามหาอํานาจ"
 SEA_china.19.desc: "จดหมายอยางเปนทางการจาก[CHI.GetNameDef] มาถึงกระทรวงการตางประเทศของเราในวันนี้ โดยระบุวาสนธิสัญญาเกามหาอํานาจพันธนาการอธิปไตยของ[CHI.GetAdjective] และตองถูกฉีกทิ้งทันที [CHI.GetLeader] ยืนกรานวาขอตกลงนี้เปนซากของการบีบบังคับ และใหคํามั่นวาจะทวงคืนเอกราชโดยสมบูรณ ไมวาเราจะยินยอมหรือไมก็ตาม"
 SEA_china.19.a: "ยอมตามคํารองของปกกิ่ง"
 SEA_china.19.b: "ปฏิเสธที่จะยกเลิกสนธิสัญญา"
 SEA_china.19_tt: "§Rเราจะเขารวมสงครามของจีนกับญี่ปุน!§!"

# FROM accepts Beijing’s demand without reservation ---
 SEA_china.20.t: "[FROM.GetName] ละทิ้งสนธิสัญญาเกามหาอํานาจ"
 SEA_china.20.desc: "[FROM.GetNameDefCap] ยืนยันการถอนตัวจากสนธิสัญญาเกามหาอํานาจทันที พวกเขายอมรับวาสนธิสัญญานี้ลาสมัยแลว และอธิปไตยของ[CHI.GetAdjective] ตองเปนอิสระจากพันธนาการ"
 SEA_china.20.a: "ชัยชนะอันเด็ดขาดที่นายินดี"

# China reacts to refusal 
 SEA_china.21.t: "[FROM.GetName] ทาทายปกกิ่ง"
 SEA_china.21.desc: "[FROM.GetNameDefCap] ปฏิเสธที่จะรื้อสนธิสัญญาเกามหาอํานาจ โดยอางถึงดุลอํานาจอันเปราะบางในแปซิฟก การดูหมิ่นเชนนี้ยอมทําใหใครก็ตามเดือดดาล แตยุคของสมุนจักรวรรดินิยมไดผานพนไปแลว เราตองตัดสินใจวาจะเพิ่มแรงกดดันหรือถอยออกจากเวทีการทูต"
 SEA_china.21.a: "กดดันตอไป"
 SEA_china.21.b: "ถอยไปกอนในตอนนี้"

# Beijing escalates; target nation must respond
 SEA_china.22.t: "[CHI.GetName] กดดันตอไป"
 SEA_china.22.desc: "ปกกิ่งยิ่งเพิ่มแรงกดดัน คณะรัฐมนตรีถกเถียงกันวาจะตอบโตแรงกดดันที่ทวีขึ้นนี้อยางไร จะตอบโตดวยการควํ่าบาตรที่อาจพลิกควํ่าการคา หรือจะปลดปลอย[CHI.GetName] จากพันธะทั้งหมด"
 SEA_china.22.a: "ควํ่าบาตร[CHI.GetName]"
 SEA_china.22.b: "ไมทําอะไร"

#FROM enacts a blockade against China ---
 SEA_china.23.t: "[FROM.GetName] ควํ่าบาตรเรา"
 SEA_china.23.desc: "รัฐบาล[FROM.GetAdjective] ประกาศควํ่าบาตรเราเพื่อลงโทษที่เราปฏิเสธสนธิสัญญาเกามหาอํานาจ และนายทาเรือของ[FROM.GetNameDef] ก็ไลเรือสินคาจีนทุกลํากลับไป สื่อในประเทศประณามมาตรการนี้วาเปนการบีบคอทางเศรษฐกิจ ลมหายใจเฮือกสุดทายของยุคจักรวรรดินิยมที่ควรจะผานพนไปนานแลว"
 SEA_china.23.a: "เราจะไมยอมกมหัว"

#FROM yields to Chinese pressure and scraps the treaty ---
 SEA_china.24.t: "[FROM.GetName] ยกเลิกสนธิสัญญาเกามหาอํานาจ"
 SEA_china.24.desc: "โทรเลขจาก[FROM.GetNameDef] มาถึงหนานจิง ยืนยันการถอนตัวจากสนธิสัญญาเกามหาอํานาจ หนวยลาดตระเวนทางแมนํ้าของตางชาติเตรียมแลนกลับบาน ขณะที่นักการทูต[FROM.GetAdjective] ยอมรับวาขอตกลงนี้ไมมีผลผูกพันจีนอีกตอไป ฝูงชนรวมตัวกันหนากระทรวงการตางประเทศขณะที่วิทยุประกาศการสิ้นสุดของสัญญาไมเปนธรรมอีกฉบับหนึ่ง"
 SEA_china.24.a: "ชัยชนะของอธิปไตยแหงชาติ"

# China requests Armor MIO
 SEA_china.25.t: "จีนขอผูเชี่ยวชาญดานยานเกราะ"
 SEA_china.25.desc: "[FROM.GetNameDefCap] ไดติดตอเรามาเพื่อขอใหผูเชี่ยวชาญจากหนวยยานเกราะของเราชวยสนับสนุนการปรับเปลี่ยนไปสูการสงครามรูปแบบที่ทันสมัยยิ่งขึ้น เราอาจสงทีมที่ปรึกษาจากผูผลิตรายใหญรายหนึ่งของเรา หรือปฏิเสธคํารองของพวกเขาไปเลย"
 SEA_china.25.a: "$morozov_design_bureau$"
 SEA_china.25.b: "$astrov_design_bureau$"
 SEA_china.25.c: "$okmo$"
 SEA_china.25.d: "พวกเขาไมสมควรไดรับความชวยเหลือ"
 SOV_accepted_Morozov: "[SOV.GetNameDefCap] สงทีมจาก $morozov_design_bureau$"
 SOV_accepted_Astrov: "[SOV.GetNameDefCap] สงทีมจาก $astrov_design_bureau$"
 SOV_accepted_OKMO: "[SOV.GetNameDefCap] สงทีมจาก $okmo$"
# Answering yes
 SEA_china.26.t: "[SOV.GetNameDefCap] ตอบกลับ"
 SEA_china.26.desc: "บัดนี้เราไดรับคําตอบจาก[SOV.GetNameDef] ซึ่งตกลงจะสงคณะผูเชี่ยวชาญมาใหเรา ความชวยเหลือนาจะมาถึงในไมชา และเมื่อมาถึง เราจะใหผูเชี่ยวชาญเหลานี้ชวยเสริมความแข็งแกรงใหกองพลรถถังของเรา"
 SEA_china.26.a: "เรามุงหนาสูชัยชนะ"
# Answering no 
 SEA_china.27.t: "[SOV.GetNameDefCap] ตอบกลับ"
 SEA_china.27.desc: "นาเสียดายที่[SOV.GetNameDef] ตัดสินใจไมสงความชวยเหลือที่เราตองการมาให แมเราจะไมรูเหตุผลที่ปฏิเสธคําขอเล็กนอยนี้ แตดูเหมือนเราตองหาวิธีอื่น..."
 SEA_china.27.a: "สักวันพวกเขาจะเสียใจ"

 SEA_china.28.t: "[FROM.GetName] เรียกรองใหยอมสยบ"
 SEA_china.28.desc: "รัฐบาลกลางไดยอมจํานนตอ[JAP.GetNameDef] โดยใหคํามั่นวาจะไมตอตานการรุกรานดินแดนของพวกเขา บัดนี้หายนะตกมาอยูที่เรา เมื่อฝาย[JAP.GetAdjective] เรียกรองดินแดนของเรา หมายจะผนวกดวยการบีบบังคับทางการทูต"
 SEA_china.28.a: "เราไมมีทางเลือก"
 the_game_will_end_for_us: "§Rเกมจะจบลงสําหรับเรา§!"
 SEA_china.28.b: "ไมมีวัน!"

# Zhang Xueliang getting thrown in jail
 SEA_china.29.t: "ชะตากรรมของ $CHI_zhang_xueliang$"
 SEA_china.29.desc: "ดวยความมุงมั่นเพื่อเสรีภาพของประเทศ $CHI_zhang_xueliang$ ไดทําเกินกวาตําแหนงหนาที่ของตนไปมาก ในยามปกติเรื่องนี้ไมอาจยอมรับได แตเราไมไดอยูในยามปกติ และแม[ROOT.GetLeader] จะเรียกรองใหจําคุกเขา แตความสามารถของ[CHI_zhang_xueliang.GetName] อาจเปนประโยชน"
 SEA_china.29.a: "โยนเขาเขาคุก!"
 SEA_china.29.b: "เราเสียเขาไปไมได..."

 SEA_china_improvement.1.t: "นายทหารรุนใหม"
 SEA_china_improvement.1.desc: "แดดสองจา เสื้อถูกรีดเรียบ และรองเทาบูตถูกขัดจนเงาวับ ทหารยืนเรียงแถวอยางเปนระเบียบ ฟง[ROOT.GetLeader] ที่มากลาวสุนทรพจนในพิธีสําเร็จการศึกษาของพวกเขา อีกไมนานผูสําเร็จการศึกษาเหลานี้จะอยูที่แนวหนา นําเกียรติยศมาสู[ROOT.GetNameDef]"
 SEA_china_improvement.1.a: "อาสาสมัครเดินทัพสูเกียรติยศ"
 SEA_china_improvement.1_tt: "\n §Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! จะ§Gเพิ่มขึ้นทุก 6 เดือน§!"

 SEA_china_improvement.2.t: "ถอนรากพิษราย"
 SEA_china_improvement.2.desc: "เมื่อตระหนักถึงผลกัดกรอนของการคาฝนตออํานาจรัฐและความเชื่อมั่นของประชาชน เราจําเปนตองเริ่มการรณรงคระยะยาวเพื่อลดอิทธิพลของเครือขายคาฝน เจาหนาที่ไดรับมอบหมายใหตรวจตราเขมงวดขึ้น สับเปลี่ยนตําแหนงทางการบริหาร และรณรงคสรางความตระหนักแกสาธารณชน ซึ่งไมมีสิ่งใดจะเห็นผลในชั่วขามคืน แตทุกกาวยอมบั่นทอนเครือขายเงามืดที่หากินกับจุดออนของ[CHI.GetAdjective]"
 SEA_china_improvement.2.a: "ใหการตอสูอันยาวนานเริ่มตนขึ้น"
 SEA_china_improvement.2_tt: "ผลเสียของ§Yการคาผิดกฎหมาย§!จะลดลงทุก 6 เดือน"

 SEA_china_improvement.3.t: "จุดจบของอบายมุข"
 SEA_china_improvement.3.desc: "หลังการปฏิรูปอยางไมลดละ การกวาดลางอยางเงียบเชียบ และการกํากับดูแลอยางเขมงวดมาหลายป เครือขายฝนรายใหญกลุมสุดทายก็ถูกทลายลง เปนครั้งแรกในรอบหลายทศวรรษที่เจตจํานงของรัฐครอบคลุมทั่วชนบทโดยไมมีผูใดทาทาย พวกชางเหน็บแนมอาจบนถึงวันเกา ๆ แตแมแตพวกเขาก็ตองยอมรับวาอากาศบริสุทธิ์ขึ้น"
 SEA_china_improvement.3.a: "ผลงานยอดเยี่ยม"


 SEA_china_warlords.1.t: "[FROM.GetName] เรียกรองใหเรายอมสยบ"
 SEA_china_warlords.1.desc: "สาสนฉบับหนึ่งมาถึงจากหนานจิง ประทับตราของรัฐบาลกลางอยางไมผิดตัว เบื้องหลังถอยคําสวยหรูวาดวยเอกภาพและชะตากรรมของชาติคือขอเรียกรอง — ใหเรายอมสยบตอ[FROM.GetLeader] และยอมรับอํานาจของ[FROM.GetNameDef] เหนือดินแดนของเรา ไมมีชองใหตอรอง มีเพียงการเชื่อฟงหรือรับผลที่ตามมา"
 SEA_china_warlords.1.a: "ใหพวกเขามาลองดู"
 SEA_china_warlords.1.b: "เราไมมีทางเลือกนอกจากเชื่อฟง"
 SEA_china_warlords.1.tt: "§Rเราจะกลายเปนรัฐในอารักขาของ[FROM.GetName]§!"

 SEA_china_warlords.2.t: "[FROM.GetName] กมหัว"
 SEA_china_warlords.2.desc: "[FROM.GetName] ยอมรับคําขาดของเราแลว ผูนําของพวกเขาพูดถึงเอกภาพของชาติและชะตากรรมทางประวัติศาสตร แตความหมายนั้นชัดเจน — บัดนี้พวกเขายอมรับความเปนใหญของ[ROOT.GetNameDef]\nแมการยอมสยบอาจเกิดขึ้นอยางไมเต็มใจ แตก็ชวยใหจีนรอดพนจากการแตกแยกและการนองเลือดที่มากขึ้น"
 SEA_china_warlords.2.a: "ดวงตะวันที่แตกราวกําลังรวมแสงกลับคืน"

 SEA_china_warlords.3.t: "[FROM.GetName] ปฏิเสธ"
 SEA_china_warlords.3.desc: "คําขาดถูกปฏิเสธ ในการแข็งขออยางอุกอาจ [FROM.GetLeader] แสดงใหเห็นชัดวาประชาชนของเขาจะไมยอมสยบ เมื่อทูตของเราถูกไลกลับ การทูตก็ตองหลีกทางใหสงคราม"
 SEA_china_warlords.3.a: "ถาอยางนั้นก็ตองทําใหพวกเขาสยบ"

 SEA_china_warlords.4.t: "[FROM.GetNameDef] เรียกรองการผนวกโดยสมบูรณ"
 SEA_china_warlords.4.desc: "เมื่อสถานการณมีเสถียรภาพขึ้นและอํานาจสวนกลางไดรับการยืนยันอีกครั้ง [FROM.GetNameDef] ก็เคลื่อนไหวเพื่อยกเลิกอํานาจปกครองตนเองของขุนศึกที่หลงเหลืออยู [THIS.GetNameDefCap] ถูกคาดหวังใหยกการควบคุมดานการบริหารและการทหารที่เหลือทั้งหมดใหแกรัฐบาลกลาง เพื่อใหกระบวนการรวมชาติเสร็จสมบูรณ"
 SEA_china_warlords.4.a: "เราตองกมหัว"
 SEA_china_warlords.4.b: "ไมมีวัน!"

 SEA_china_warlords.5.t: "[FROM.GetNameDefCap] ยอมรับการรวมเขาดวยกัน"
 SEA_china_warlords.5.desc: "ดวยตระหนักถึงความจําเปนของเอกภาพแหงชาติ [FROM.GetLeader] ไดตกลงยุบ[FROM.GetNameDef] และโอนอํานาจทั้งหมดใหแก[ROOT.GetNameDef] กองกําลังติดอาวุธของพวกเขาถูกรวมเขาในโครงสรางการบังคับบัญชาแหงชาติ ขณะที่หนวยงานบริหารของพวกเขาถูกรื้อถอน"
 SEA_china_warlords.5.a: "เอกภาพมีชัย"

 SEA_china_warlords.6.t: "[FROM.GetNameDefCap] ปฏิเสธการรวมเขาดวยกัน"
 SEA_china_warlords.6.desc: "[FROM.GetLeader] ไดปฏิเสธคําขาดอยางเปดเผยเพื่อทาทายรัฐบาลกลาง [FROM.GetNameDefCap] ยังคงเปนรัฐในอารักขาแตในนาม แตการกระทําของพวกเขาเผยใหเห็นความทะเยอทะยานที่จะเปนเอกราช การขัดคําสั่งเชนนี้จะปลอยไวโดยไมตอบโตไมได"
 SEA_china_warlords.6.a: "พวกเขาจะตองเสียใจ"

 SEA_china_democratic.1.t: "ประธานาธิบดีแหงสาธารณรัฐ"
 SEA_china_democratic.1.desc: "ในที่สุดก็ถึงเวลาฟนฟูการเลือกตั้งเสรีในจีน และฟนคืนสาธารณรัฐที่ถูกบดขยี้ทั้งโดยกองกําลังภายนอกและภายใน แตคําถามยังคงอยูวา ใครจะสืบทอดภารกิจของ ดร.ซุน และเปนประธานาธิบดีคนแรกของสาธารณรัฐใหมนี้?"
 SEA_china_democratic.1.a: "พรรค CPWDP มีผูสมัครที่ดี"
 SEA_china_democratic.1.b: "จาง จวินมาย ไดพิสูจนคุณคาของตนแลว"
 SEA_china_democratic.1.c: "ซง ชิ่งหลิง คือผูนําในอุดมคติ"
 SEA_china_democratic.1.d: "ควรใหโอกาสนี้แกเจิง ฉี"

 SEA_china_democratic.2.t: "[FROM.GetNameDefCap] เชิญเราเขารวมพันธมิตร"
 SEA_china_democratic.2.desc: "คณะผูแทนจากแดนไกลเพิ่งเดินทางมาถึงเมืองหลวงของเรา เรียกรองขอเขาพบ[ROOT.GetLeader] พวกเขาอางวามาจาก[FROM.GetNameDef] และตองการสรางพันธมิตรระหวางชาติของเรา เราจะตอบรับหรือไม?"
 SEA_china_democratic.2.a: "เราจะแข็งแกรงขึ้นเมื่ออยูดวยกัน"
 SEA_china_democratic.2.b: "นั่นขัดกับหลักความเปนกลางของเรา..."

 SEA_china_democratic.3.t: "[FROM.GetNameDefCap] ตอบรับคําเชิญของเรา"
 SEA_china_democratic.3.desc: "[FROM.GetLeader] ไดตอบรับขอเสนอของเราในการสถาปนาพันธมิตรระหวางชาติของเราอยางเปนทางการดวยดี และไดเริ่มดําเนินการเพื่อผนวกตนเขาสูเขตอิทธิพลของเราแลว วันนี้เปนวันแหงการเฉลิมฉลอง!"
 SEA_china_democratic.3.a: "พวกเขามีวิสัยทัศนตออนาคตเชนเดียวกับเรา"

 SEA_china_democratic.4.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะรวมกับเรา"
 SEA_china_democratic.4.desc: "[FROM.GetLeader] ไดปฏิเสธขอเสนอพันธมิตรระหวางชาติของเราอยางไมไยดี โดยอางวาขัดกับหลักความเปนกลางของพวกเขา เราไดแตนึกภาพวาตองมีการฉอฉลมากมายเพียงใดจึงนําไปสูการตัดสินใจอันผิดพลาดนี้"
 SEA_china_democratic.4.a: "พวกเขาเสียโอกาสเอง"

 SEA_china_democratic.5.t: "สงครามกลางเมืองใน[ROOT.GetNameDef]"
 SEA_china_democratic.5.desc: "หลังกระแสสาธารณรัฐนิยมเติบโตมาเปนเวลานาน ดูเหมือนฝายประชาธิปไตยชาว[ROOT.GetAdjective] จะเหนื่อยหนายกับการรอคอยการเปลี่ยนรัฐบาลอยางสันติแลว หลังการถกเถียงอยางดุเดือด การทูตก็ลมเหลว และการปะทะดวยอาวุธก็ปะทุขึ้น"
 SEA_china_democratic.5.a: "เพื่อประชาธิปไตย!"
 SEA_china_democratic.5.b: "เราตองหยุดความบาคลั่งนี้!"

 SEA_china_democratic.6.t: "[FROM.GetNameDefCap] ปลุกกระแสสาธารณรัฐนิยม"
 SEA_china_democratic.6.desc: "เราไดรับรายงานวาขณะนี้มีกลุมเซลลของ[FROM.GetAdjective] เคลื่อนไหวอยูในประเทศของเรา เผยแพรแนวคิดสาธารณรัฐนิยม แมจะดูไมเปนพิษเปนภัยนัก แตโฆษณาชวนเชื่อบางสวนดูจะมีลักษณะปลุกปนใหปฏิวัติ รายงานวาคนงานถูกยุยงใหรวมตัวจัดตั้งกลุมมีบอยขึ้นเรื่อย ๆ และเมื่อพิจารณาจากประวัติศาสตรไมนานมานี้ เราไมอาจแนใจไดวานี่ไมใชแผนการอันแยบยลของผูนํา[FROM.GetAdjective] ที่จะผนวกรวมเราในทายที่สุด"
 SEA_china_democratic.6.a: "ปลอยใหพวกเขาทําตอไป"
 SEA_china_democratic.6.b: "ปราบปรามนักปลุกระดมอวดดีพวกนี้!"

 SEA_china_democratic.7.t: "[CHI.GetNameDefCap] เรียกรองใหเราปลดปลอยอาณานิคมในเอเชีย"
 SEA_china_democratic.7.desc: "เราไดรับหนังสือที่ใชถอยคําคอนขางรุนแรงจาก[CHI.GetNameDef] พวกเขาเรียกรองใหเราปลดปลอย[CHI_country_to_be_liberated.GetNameDef] และคืนดินแดนใหแกเจาของที่ชอบธรรม"
 SEA_china_democratic.7.a: "ยังไงอาณานิคมพวกนั้นก็ไมคอยมีประโยชนกับเรา"
 SEA_china_democratic.7.b: "เจาของที่ชอบธรรมก็คือเรานี่แหละ"
 SEA_china_democratic.7.b.tt: "§Rสิ่งนี้จะทําใหพวกเขาไดเปาหมายสงครามตอเรา!§!"

 SEA_china_democratic.8.t: "[FROM.GetNameDefCap] ตกลงปลดปลอย[CHI_country_to_be_liberated.GetNameDef]"
 SEA_china_democratic.8.desc: "คําตอบตอขอเรียกรองของเราให[FROM.GetNameDef] ปลดปลอย[CHI_country_to_be_liberated.GetNameDef] เพิ่งมาถึง อาจนาประหลาดใจอยูบาง แตพวกเขาตกลงปลดปลอย[CHI_country_to_be_liberated.GetNameDef] เปนชาติเอกราช"
 SEA_china_democratic.8.a: "ผลลัพธที่นาพอใจยิ่ง"

 SEA_china_democratic.9.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะปลดปลอยอาณานิคม"
 SEA_china_democratic.9.desc: "คําตอบตอขอเรียกรองของเราให[FROM.GetNameDef] ปลดปลอย[CHI_country_to_be_liberated.GetNameDef] เพิ่งมาถึง พวกเขาระบุวาการตางประเทศของพวกเขาไมใชเรื่องของเรา และปฏิเสธแนวคิดที่จะใหเอกราชอันชอบธรรมแกอาณานิคม"
 SEA_china_democratic.9.a: "เราตองปลดปลอยพวกเขา ไมวาจะตองแลกดวยอะไร"

 SEA_china_democratic.10.t: "[FROM.GetNameDefCap] ตองการใหเรารวมสงครามของพวกเขา"
 SEA_china_democratic.10.desc: "คณะผูแทนจากแดนไกลเพิ่งเดินทางมาถึงเมืองหลวงของเรา เพื่อขอเขาพบ[ROOT.GetLeader] พวกเขาอางวามาจาก[FROM.GetNameDef] และตองการใหเรารวมสงครามกับ[JAP.GetNameDef] เราจะตอบรับหรือไม?"
 SEA_china_democratic.10.a: "รวมกันสูชัยชนะ!"
 SEA_china_democratic.10.b: "นั่นขัดกับหลักความเปนกลางของเรา..."

 SEA_china_democratic.11.t: "[FROM.GetNameDefCap] ตอบรับคําขออันนอบนอมของเรา"
 SEA_china_democratic.11.desc: "[FROM.GetLeader] ไดตอบรับขอเสนอของเราในการสถาปนาพันธมิตรตอตาน[JAP.GetAdjective]ระหวางชาติของเราอยางเปนทางการดวยดี และไดเริ่มดําเนินมาตรการตอตานภัยคุกคามจากตะวันออกแลว วันนี้เปนวันแหงการเฉลิมฉลอง!"
 SEA_china_democratic.11.a: "เราเปนหนี้บุญคุณประชาชนของพวกเขา"

 SEA_china_democratic.12.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะรวมกับเรา"
 SEA_china_democratic.12.desc: "[FROM.GetLeader] ไดปฏิเสธขอเสนอพันธมิตรตอตาน[JAP.GetAdjective]ระหวางชาติของเราอยางไมไยดี โดยอางวาขัดกับหลักความเปนกลางของพวกเขา เราไดแตนึกภาพวาตองมีการฉอฉลมากมายเพียงใดจึงนําไปสูการตัดสินใจอันผิดพลาดนี้"
 SEA_china_democratic.12.a: "ขาวรายจริง ๆ..."

 SEA_china_democratic.13.t: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเรา"
 SEA_china_democratic.13.desc: "[FROM.GetLeader] แหง[FROM.GetNameDef] ไดสงคํารองขอการสนับสนุนทางการเงินสําหรับประเทศของพวกเขา พวกเขาไดระดมชาว[FROM.GetAdjective] โพนทะเลจํานวนมากที่อาศัยอยูในประเทศเราใหสนับสนุนเปาหมายของตน และกระแสสนับสนุนจากประชาชนก็พุงสูงขึ้น เราควรตอบรับคํารองของพวกเขาหรือไม?" 
 SEA_china_democratic.13.a: "เราจะสนับสนุนพวกเขา"
 SEA_china_democratic.13.b: "พวกเขาตองดูแลเศรษฐกิจของตนเอง"

 SEA_china_democratic.14.t: "[FROM.GetNameDefCap] ตกลงสนับสนุนเรา"
 SEA_china_democratic.14.desc: "เราไดรับคําตอบตอคํารองแลว และยินดีจะรายงานวาเงินทุนจากตางประเทศจะพรอมใหเราใชในไมชา สิ่งนี้จะเปนประโยชนตอเศรษฐกิจของเรา และชวยใหเราขยายอุตสาหกรรมและกองทัพไดอยางมาก"
 SEA_china_democratic.14.a: "เสนทางสูชัยชนะเปดกวางแลว"

 SEA_china_democratic.15.t: "[FROM.GetNameDefCap] ปฏิเสธคํารองของเรา"
 SEA_china_democratic.15.desc: "คําตอบตอคําวิงวอนของเราไดกลับมาจาก[FROM.GetNameDef] แลว พวกเขาเลือกที่จะทอดทิ้งเรา จะไมมีการสงความชวยเหลือหรือเงินทุนใด ๆ มาให เรายืนหยัดเพียงลําพัง แมจะมีกระแสสนับสนุนจากประชาชนใน[FROM.GetNameDef] เราจะตองชนะ เพราะหากไมชนะ มรดกของเราจะถูกลืมเลือน"
 SEA_china_democratic.15.a: "เราถูกหลอกใหหลงทาง..."

 SEA_china_democratic.16.t: "[FROM.GetNameDefCap] ลงทุนในเศรษฐกิจของเรา"
 SEA_china_democratic.16.desc: "นักอุตสาหกรรมจาก[FROM.GetNameDef] ไดเริ่มพัฒนาอุตสาหกรรมทองถิ่นของเราและตั้งบริษัทใหมภายในประเทศของเรา สิ่งนี้จะนําเราเขาใกลความรุงเรืองอยางแนนอน"
 SEA_china_democratic.16.a: "เราขอบคุณพวกเขาสําหรับการลงทุนนี้"
 SEA_china_democratic.16.b: "เราไมตองการความชวยเหลือของพวกเขา!"

 SEA_china_democratic.17.t: "[FROM.GetName] เรียกรองใหเรายอมสยบ"
 SEA_china_democratic.17.desc: "สาสนฉบับหนึ่งมาถึงจากหนานจิง ประทับตราของรัฐบาลกลางอยางไมผิดตัว เบื้องหลังถอยคําสวยหรูวาดวยเอกภาพและชะตากรรมของชาติคือขอเรียกรอง — ใหเรายอมสยบตอ[CHI.GetLeader] และยอมรับอํานาจของ[CHI.GetNameDef] เหนือดินแดนของเรา ไมมีชองใหตอรอง มีเพียงการเชื่อฟงหรือรับผลที่ตามมา"
 SEA_china_democratic.17.a: "เราจะไมมีวันยอมสยบ!"
 SEA_china_democratic.17.b: "นี่ดีที่สุดสําหรับประชาชนของเรา"
 SEA_china_democratic.17.tt: "§Rเราจะกลายเปนรัฐในอารักขาของ[FROM.GetName]§!"

 SEA_china_democratic.18.t: "[FROM.GetName] กลับคืนสูสาธารณรัฐ"
 SEA_china_democratic.18.desc: "[FROM.GetName] ยอมรับคําขาดของเราแลว ผูนําของพวกเขาพูดถึงเอกภาพของชาติและชะตากรรมทางประวัติศาสตร แตความหมายนั้นชัดเจน — บัดนี้พวกเขายอมรับความเปนใหญของ[CHI.GetNameDef]\nแมการยอมสยบอาจเกิดขึ้นอยางไมเต็มใจ แตก็ชวยใหจีนรอดพนจากการแตกแยกและการนองเลือดที่มากขึ้น"
 SEA_china_democratic.18.a: "ดวงตะวันที่แตกราวกําลังรวมแสงกลับคืน"

 SEA_china_democratic.19.t: "[FROM.GetName] ปฏิเสธที่จะยอมสยบ"
 SEA_china_democratic.19.desc: "คําขาดถูกปฏิเสธ ในการแข็งขออยางอุกอาจ [FROM.GetLeader] แสดงใหเห็นชัดวาประชาชนของเขาจะไมยอมสยบ เมื่อทูตของเราถูกไลกลับ การทูตก็ตองหลีกทางใหสงคราม"
 SEA_china_democratic.19.a: "ถาอยางนั้นก็ตองทําใหพวกเขาสยบ"

 SEA_china_democratic.20.t: "[FROM.GetNameDefCap] เรียกรองใหนําหลักหมินเฉวียนมาใช!"
 SEA_china_democratic.20.desc: "[FROM.GetLeader] ประธานาธิบดีแหง[FROM.GetNameDef] ไดสงขอเรียกรองอยางเปนทางการใหเราเริ่มนําหลักหมินเฉวียน (สิทธิของประชาชน) มาใชในดินแดนที่เราปกครอง สิ่งนี้จะนําเราเขาใกลสาธารณรัฐและชวยการพัฒนาของเราอยางแนนอน"
 SEA_china_democratic.20.a: "เราจะปฏิบัติตาม"
 SEA_china_democratic.20.b: "เรื่องนี้มีอะไรแปลก ๆ!"

 SEA_china_misc.1.t: "$CHI_retreat_to_taiwan$"
 SEA_china_misc.1.desc: "$CHI_retreat_to_taiwan_desc$"
 



