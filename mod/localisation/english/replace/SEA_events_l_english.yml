 SEA_imperial_influence_events.1.t: "การแยงชิงอํานาจภายในปะทุขึ้น"
 SEA_imperial_influence_events.1.desc: "การแยงชิงอํานาจอันขมขื่นไดปะทุขึ้นในหมูกลุมกกภายในตาง ๆ ของ[ROOT.GetNameDef] ทุกฝายตางแขงกันเพื่อให[GetImperialInfluenceRulerTitle]รับฟง และพยายามโนมนาว[GetImperialInfluenceGenderHimHer]ใหเขาขางตน คําถามในใจทุกคนคือ [GetImperialInfluenceRulerTitle]จะโปรดปรานฝายใดในทายที่สุด และ[GetImperialInfluenceGenderHeShe]จะเมินเฉยตอฝายใด?"
