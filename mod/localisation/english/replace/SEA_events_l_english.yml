 SEA_warlords.21.a: "$wtt_political_warlord_support.22.a$"
 SEA_warlords.22.t: "การถึงแกกรรมของหลิวเซียง"
 SEA_warlords.22.desc: "เมื่อหลิวเซียง ผูนําของ [SIC.GetNameDef] ถึงแกกรรม ก็ยิ่งชัดเจนวาเราตองเขาไปควบคุมโดยตรง เพื่อไมใหเสี่ยงเสียดินแดนใหกับผูที่ไมเปนมิตรกับรัฐบาลของเรา อยางไรก็ตาม การทําเชนนี้อาจยิ่งสรางความเปนปรปกษกับผูบังคับบัญชาระดับรองที่กําลังแยงชิงอํานาจอยู เราจึงยังตองระมัดระวัง"
 SEA_warlords.22.a: "เราควรเขาไปจัดการ"
 SEA_warlords.22.b: "ปลอยพวกเขาไป"
 SEA_warlords.23.t: "[From.GetNameDefCap] เรียกรองใหยอมสยบ"
 SEA_warlords.23.desc: "ดูเหมือนวา [From.GetLeader] ไดเริ่มการตอสูเพื่อจีนแลว และไดรวบรวมขุนศึกคนอื่นๆ มาอยูฝายเขาเพื่อตอตานรัฐบาลกลาง หากเราเขารวมก็เสี่ยงที่จะตองยอมมอบอํานาจสวนใหญให [From.GetNameDef] แตหากปฏิเสธก็อาจตองเผชิญความโกรธแคนของพวกเขาแทน"
 SEA_warlords.23.a: "สูดวยกันดีกวาสูลําพัง"
 SEA_warlords.23.b: "เราจะไมมีวันยอมสยบ"
 SEA_warlords.24.t: "[From.GetLeader] ยอมสยบ"
 SEA_warlords.24.desc: "[From.GetLeader] ตอบรับขอเสนอของเราที่จะรวมมือกันตอตานรัฐบาลกลางอยางกระตือรือรน และใหคํามั่นวาจะชวยเราในการตอสูนี้ บัดนี้เรากาวเขาใกลการรวมชาติอีกขั้นหนึ่งแลว"
 SEA_warlords.24.a: "ยอดเยี่ยม"
 SEA_warlords.25.t: "[From.GetLeader] ปฏิเสธ"
 SEA_warlords.25.desc: "[From.GetLeader] ตอบขอเสนอของเราที่จะรวมมือกันในการตอสูเพื่อจีนดวยคําดูหมิ่นและคําสาปแชงมากมาย โดยอางวาภารกิจของเราเปนเพียงความพยายามที่ลมเหลวอีกครั้งในการยึดอํานาจและกดขี่มณฑลตางๆ ดูเหมือนเราจะไมไดพวกเขามาอยูฝายเดียวกันในการตอสูครั้งนี้"
 SEA_warlords.25.a: "ถาเชนนั้นเราก็ตองโคนพวกเขาดวย!"
 SEA_warlords.26.t: "[FROM.GetLeader] เรียกรองใหเรายอมจํานน"
 SEA_warlords.26.desc: "หลังความเคลื่อนไหวหลายครั้งเพื่อแสดงความเปนใหญในภูมิภาคและในตระกูลหมา [FROM.GetLeader] ไดตัดสินวาการสาบานตนจงรักภักดีตอเขาจะเปนผลดีที่สุดตอเรา [FROM.GetLeader] ยังอางดวยวาหากเราปฏิเสธ เราจะถูกลงโทษและกองทัพของเราจะถูกทําลาย แตทายที่สุดแลวการตัดสินใจอยูที่เรา"
 SEA_warlords.26.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 SEA_warlords.26.b: "เราจะไมมีวันยอมจํานน!"
 SEA_warlords.27.t: "[FROM.GetLeader] ยอมจํานน"
 SEA_warlords.27.desc: "ดวยความกลัววาการสูรบจะนําไปสูการนองเลือดและความไรเสถียรภาพในภูมิภาคมากขึ้น [FROM.GetLeader] จึงตัดสินใจวาการสาบานตนจงรักภักดีตอเราเปนทางเลือกที่ดีที่สุด"
 SEA_warlords.27.a: "ขาวดีมาก"
 SEA_warlords.28.t: "[FROM.GetLeader] ยืนหยัดแข็งขอ"
 SEA_warlords.28.desc: "แมเราจะพยายามอยางยิ่งยวดที่จะหลีกเลี่ยงการนองเลือดเพิ่มเติม แต [FROM.GetLeader] ก็สงจดหมายดูหมิ่นกลับมา โดยอางวาคําขูของเราไรความหมาย และกองทัพของ [FROM.GetNameDef] จะไลตีเรากลับไปจนถึง [ROOT.Capital.GetName] หากเราพยายามรุกราน"
 SEA_warlords.28.a: "ถาเชนนั้นเราจะโจมตีใหราบคาบ"
 SEA_warlords.29.t: "[FROM.GetLeader] เสนอสันติภาพ"
 SEA_warlords.29.desc: "หลังสถานการณสงครามลาสุด [FROM.GetLeader] ไดตัดสินใจวาการสูรบกับเราไมคุมคาอีกตอไป และเราควรรวมมือกันตอตานศัตรูที่ใหญกวา ดวยเหตุนี้ [FROM.GetLeader] จึงเสนอนิรโทษกรรมเต็มรูปแบบแกทหารและผูนําของเราหากเรายอมรับ โดยจะอภัยโทษสําหรับอาชญากรรมใดๆ ที่อาจกระทําตอจีน เพื่อแลกกับการรวมรบดวยกัน"
 SEA_warlords.29.a: "ฟงดูสมเหตุสมผล"
 SEA_warlords.29.b: "เราจะไมมีวันยอมจํานน!"
 SEA_warlords.30.t: "[FROM.GetLeader] ปฏิเสธที่จะยอมจํานน"
 SEA_warlords.30.desc: "[FROM.GetLeader] อางวาขอเสนอสันติภาพและนิรโทษกรรมของเราเปนเพียงกลลวงเพื่อทําลาย [FROM.GetNameDef] จึงปฏิเสธที่จะยุติการสูรบ และกลับเปดฉากการรุกอีกครั้งเมื่อเชานี้ ดูเหมือนวาจะตองใชมากกวาจดหมายฉบับเดียวเพื่อยุติความขัดแยงนี้"
 SEA_warlords.30.a: "ไอคนทรยศ!"
 SEA_warlords.31.t: "[FROM.GetLeader] เรียกรองใหโอน [434.GetName]"
 SEA_warlords.31.desc: "หลังการยั่วยุตามแนวชายแดนเมื่อเร็วๆ นี้ [FROM.GetLeader] ไดยื่นคําขออยางเปนทางการใหเราถอนทหารออกจาก [434.GetName] และสงมอบใหแกทางการ[FROM.GetAdjective] หากเราปฏิเสธ เขาอางวา [FROM.GetName] จะตอบโตดวยกําลังทหาร และจะไมหยุดเดินทัพจนกวาจะถึงเดลี"
 SEA_warlords.31.a: "พวกเขาไมเหลือทางเลือกใหเรา"
 SEA_warlords.31.b: "ใหพวกเขาลองดู"
 SEA_warlords.32.t: "[FROM.GetLeader] ปฏิเสธ"
 SEA_warlords.32.desc: "แมเราจะพยายามโนมนาวอยางเต็มที่ แตความพยายามที่จะได [434.GetName] มาทางการทูตก็ไรผล [FROM.GetLeader] ยืนยันเสนแม็กมาฮอนอีกครั้ง และอางวาเราไมมีสิทธิ์ในดินแดนนั้น และการยั่วยุของเราเปนเพียงการขูลมๆ แลงๆ"
 SEA_warlords.32.a: "ถาเชนนั้นก็ตองรบ"
 SEA_warlords.33.t: "[FROM.GetLeader] ตกลงโอน [434.GetName]"
 SEA_warlords.33.desc: "หลังผานไปไมกี่วันอันตึงเครียด [FROM.GetLeader] ไดตกลงโอน [434.GetName] และสละเสนแม็กมาฮอน โดยอางวาการพยายามบังคับใชเสนนี้จะสรางปญหามากกวาที่คุมคา ดวยเหตุนี้ประเทศของเราจึงยิ่งใหญขึ้นไปอีก"
 SEA_warlords.33.a: "ยอดเยี่ยม"

 tsr_sichuan_border_war.1.t: "[SIC.GetNameDefCap] พิชิต [601.GetName]"
 tsr_sichuan_border_war.1.desc: "หลังการทัพอันรวดเร็วใน [601.GetName] กองทัพ[SIC.GetAdjective]ภายใตการนําของหลิวเหวินฮุยไดยึดพื้นที่สวนใหญของมณฑลและประกาศวาพื้นที่นี้อยูภายใตการควบคุมของตน"
 tsr_sichuan_border_war.1.a: "เราแข็งแกรงขึ้น!"
 tsr_sichuan_border_war.1.b: "ไมดีเลย"
 tsr_sichuan_border_war.2.t: "[SIC.GetNameDefCap] ถอนกําลังจาก [601.GetName]"
 tsr_sichuan_border_war.2.desc: "เมื่อเผชิญความยากลําบากอยางหนัก กองทัพ[SIC.GetAdjective]ไดถอยออกจาก [601.GetName] และประกาศยุติการรุกทางทหาร พรมแดนจะยังคงเปนเชนเดิม"
 tsr_sichuan_border_war.2.a: "อยางนอยพวกเขาก็ไมไดยึดสวนที่เหลือของซีคังคืนไป..."
 tsr_sichuan_border_war.2.b: "ซีคังยังยืนหยัด!"
 chiang_will_be_shot_tt: "§Rหลังจากนี้จะมีคนจํานวนมากไมพอใจเจียง ไคเชก...§!"
 chiang_could_be_shot_tt: "§Rหลังจากนี้อาจมีบางคนไมพอใจเจียง ไคเชก...§!"
 SEA_warlords.34.t: "กรณีเหลี่ยงกวาง"
 SEA_warlords.34.desc: "หลังการยั่วยุหลายครั้ง มณฑลกวางสีและกวางตุงไดรวมตัวกันโดยอางวาเรานิ่งเฉยเกินไปตอญี่ปุน และจึงตั้งคําถามตอการปกครองของเรา พวกเขาอางวาหากเราไมลงมือ พวกเขาจะยกทัพมาตอตานกองกําลังของเราและยึดหนานจิงไวเอง แมพวกเขาจะเสนอใหเจียง ไคเชก ไปกวางโจวเพื่อหารือเพิ่มเติมเรื่องการรับมือญี่ปุน แตก็ไมชัดเจนวานี่เปนเพียงกับดักหรือไม"
 SEA_warlords.34.a: "เราจะไมหลงกลคําโกหกของพวกเขา!"
 SEA_warlords.34.b: "สงเขาไปกวางโจวเพื่อหารือเรื่องแนวรวมนี้"
 SEA_warlords.35.t: "เจียง ไคเชก เดินทางถึงกวางโจว"
 SEA_warlords.35.desc: "ดวยขวัญกําลังใจที่สูงและอาวุธที่ชูสูงยิ่งกวา เจียง ไคเชก เดินทางมาถึงเมื่อเชานี้พรอมกองพันขนาดเล็กเปนองครักษ ดูเหมือนวาการตอบรับขอเสนอไมใชกับดัก และการเจรจาก็เริ่มขึ้นทันที เฉินจี้ถังและหลี่จงเหรินตางผลักดันใหเจียงจัดตั้งแนวรวมตอตานญี่ปุน ถึงขั้นใหยุติการสูรบกับคอมมิวนิสตไวกอนชั่วคราว ยากจะบอกวานี่เปนทางเลือกที่ถูกตองหรือไม แตก็อาจเปนเชนนั้นได"
 SEA_warlords.35.a: "ถาเชนนั้นเราจะรวมกัน!"
 SEA_warlords.35.b: "รอดูไปกอน..."
 SEA_warlords.36.t: "การหนีทัพและผูทรยศ"
 SEA_warlords.36.desc: "หลังหนานจิงประกาศวาจะไมยอมถอยตอคําขูใดๆ ของเรา และเราประกาศตอตานตามมา ทหารสวนหนึ่งของเราไดหนีทัพ และนายพลอวี๋ฮั่นโหมวขูวาหาก [ROOT.GetLeader] ไมลาออก เขาจะยกทัพมากวางโจวและบังคับใหเปนไปตามนั้น"
 SEA_warlords.36.a: "[ROOT.GetLeader] จะตองลาออก"
 SEA_warlords.36.b: "เราจะไมถอย!"
 SEA_warlords.36.c: "มีเพียงการรวมมือกันเทานั้นที่เราจะตานภัยนี้ได!"
 SEA_warlords.36.tt: "§Rหากกวางสีปฏิเสธขอเสนอของเรา เราจะตกอยูในสงครามกลางเมืองทันที!§!"
 SEA_warlords.37.t: "การตอสูเพื่อกวางสี"
 SEA_warlords.37.desc: "หลังหนานจิงประกาศวาจะไมยอมถอยตอคําขูใดๆ ของเรา และเราประกาศตอตานตามมา ก็มีผูหวั่นเกรงวารัฐบาลกลางจะใชกําลังทหารบังคับใหเรายอมอยูใตการปกครองของพวกเขา"
 SEA_warlords.37.a: "ถาเชนนั้นก็มาเลย!"
 SEA_warlords.37.b: "เรายอมจํานน"
 SEA_warlords.38.t: "กลุมกวางสียอมจํานน"
 SEA_warlords.38.desc: "ดวยความกลัววาเราจะทําลายมณฑลของพวกเขาในระหวางการขับไล [GXC.GetLeader] พวกเขาจึงเสนอเขาเปนสวนหนึ่งของสาธารณรัฐของเรา แลกกับการไวชีวิตผูนําทุกคนและใหคงตําแหนงเดิม นี่ดูเปนการประนีประนอมที่ยุติธรรม"
 SEA_warlords.38.a: "ก็ได"
 SEA_warlords.39.t: "การลมสลายของกลุมกวางตุง"
 SEA_warlords.39.desc: "หลังหลายชั่วโมงอันตึงเครียดบนปากเหวสงครามกลางเมือง เฉินจี้ถังไดตกลงลาออก และเราไดเคลื่อนทหารเขาสูกวางตุงแลว อนาคตของมณฑลนี้อยูในมือเราโดยสมบูรณ"
 SEA_warlords.39.a: "ยอดเยี่ยม"
 SEA_warlords.40.t: "สงครามกลางเมืองในกวางตุง"
 SEA_warlords.40.desc: "หลังเฉินจี้ถังไมยอมถอยแมจะมีทหารหนีทัพมาเขากับฝายเราและอวี๋ฮั่นโหมวขูจะยกทัพมากวางโจว มณฑลนี้ก็ลมสลายเขาสูสงครามกลางเมืองเต็มรูปแบบ ระหวางกองกําลังฝายสนับสนุนรัฐบาลกับฝายตอตานรัฐบาล เราควรเขาไปแกไขความวุนวายนี้"
 SEA_warlords.40.a: "ไอหัวขี้เลื่อยดื้อดาน..."
 SEA_warlords.41.t: "กลุมกวางสียืนหยัดแข็งขอ"
 SEA_warlords.41.desc: "[GXC.GetLeader] อางวาคําขูรุกรานของเราเปนเพียงนิทาน และประกาศวาพวกเขาจะไมถอย แตจะบีบใหเราตองเจรจาแทน ยังเร็วเกินไปที่จะบอกวาจะสําเร็จหรือไม คงตองรอดูกันตอไป"
 SEA_warlords.41.a: "ชางเถอะ"
 SEA_warlords.42.t: "หันฟูจวี่หนีออกจากจี่หนาน"
 SEA_warlords.42.desc: "แมจะมีศักยภาพที่จะยืนหยัดไดนานกวานี้ แตหันฟูจวี่ก็ตัดสินใจหนีออกจากจี่หนาน ทิ้งปกของเราไวโดยไรการปองกัน เขาถูกกองกําลังของเราจับกุมในขอหากบฏแลว แตคําถามคือเราควรทําอยางไรกับเขา เราควรจัดการเขาและยึดดินแดนทั้งหมดของเขาเพื่อเปนเยี่ยงอยาง หรือควรใหนายพลคนอื่นเขารับหนาที่แทนไปกอนเพื่อหลีกเลี่ยงปญหาเพิ่มเติม?"
 SEA_warlords.42.a: "ลงโทษเขาใหเปนเยี่ยงอยาง"
 SEA_warlords.42.b: "ใหซุนถงเซวียนรับหนาที่แทนไปกอน"
 may_join_japan_tt: "§Rมีโอกาสที่เขาอาจไปเขากับญี่ปุน§!"
 SEA_warlords.43.t: "การปกครองของซุนถงเซวียน"
 SEA_warlords.43.desc: "หลังการหลบหนีอยางขลาดเขลาของหันฟูจวี่จากจี่หนาน ก็เกิดสุญญากาศทางอํานาจในมณฑลซานตงที่ถูกสงครามยํ่ายี รัฐบาลกลางเลือกที่จะไมเขามาแทรกแซง แตแตงตั้งซุนถงเซวียนเปนผูวาการชั่วคราว และปลอยใหเราเปนผูตัดสินใจวาจะทําอยางไรตอไป"
 SEA_warlords.43.a: "เขาขางรัฐบาลกลาง"
 SEA_warlords.43.b: "กกมินตั๋งลมเหลวแลว เราตองเขารวมกับญี่ปุน!"

 SEA_warlords.44.t: "[FROM.GetLeader] เสนอการรวมเหลี่ยงกวาง"
 SEA_warlords.44.desc: "เราเพิ่งไดรับขาวจาก [FROM.GetNameDef] วาพวกเขาตองการเห็นสองภูมิภาคของเรากลับมารวมกันอีกครั้งเปนดินแดนที่เรียกวาเหลี่ยงกวาง แนวคิดนี้ยอนกลับไปถึงสมัยราชวงศชิงในชื่อเขตอุปราชเหลี่ยงกวาง แมเราจะไมตองการบรรดาศักดิ์แบบจักรวรรดิเชนนั้นอีกแลว แตอํานาจและเกียรติภูมิที่ดินแดนที่รวมกันนี้มีในเวลานั้นเปนสิ่งที่ปฏิเสธไมได"
 SEA_warlords.44.a: "ใช มีเพียงความรวมมือที่ลึกซึ้งขึ้นเทานั้นที่จะทําใหเราประสบความสําเร็จ!"
 SEA_warlords.44.b: "เราจะไมรวมมือกับราชาแหงแดนใต!"

 SEA_warlords.45.t: "[FROM.GetLeader] ตกลงรวมชาติ"
 SEA_warlords.45.desc: "ขาวดีเยี่ยม! [GXC.GetNameDefCap] ไดตกลงตามขอเสนอรวมชาติภายใตธงเหลี่ยงกวางของเรา เมื่อรวมกัน เราจะเปนกลุมอํานาจที่ทรงพลัง มีอุตสาหกรรม วัตถุดิบ และกําลังพลอยางลนเหลือ! ทั่วทั้งจีนตองสั่นสะทานตอพลังและเจตจํานงอันเปนหนึ่งเดียวของเรา"
 SEA_warlords.45.a: "เราจะไดรับชัยชนะ!"

 SEA_warlords.46.t: "[FROM.GetLeader] ทอดทิ้งเรา"
 SEA_warlords.46.desc: "เราไดรับคําตอบจาก [GXC.GetNameDef] แลว และนาเสียดายที่พวกเขาตัดสินวา 'อธิปไตย' ที่กําลังจะสูญเสียไปนั้นสําคัญกวาอนาคตรวมกันอันเปนหนึ่งเดียวของเรา บัดนี้เราตองพิจารณาทางเลือกอื่น ซึ่งที่เปนไปไดมากที่สุดคือการรวมชาติดวยกําลัง เพราะมีเพียงการรวมกันเทานั้นที่เราจะตานทานมหาอํานาจที่กําลังรวมตัวตอตานเราได"
 SEA_warlords.46.a: "บัดนี้มีเพียงชัยชนะหรือความตาย!"
 SEA_warlords.46.tt: "§Rสิ่งนี้นาจะนําไปสูสงครามกับ [CHI.GetNameDef]§!"

 SEA_warlords.47.t: "การนํากลุมเหลี่ยงกวาง"
 SEA_warlords.47.desc: "เมื่อการรวมชาติใกลเขามาทุกที เราตองตัดสินใจอันยากลําบากวาใครควรนํากลุมใหมนี้ ทั้งสองตัวเลือกลวนมั่นคง เพราะ [ROOT.GetLeader] กุมอํานาจบัญชาการสูงสุดของกองทัพอากาศ สวนหลี่จงเหรินเปนปรมาจารยการรบภาคพื้นดินและเปนแรงบันดาลใจของทหาร ใครจะเปนผูชนะ?"
 SEA_warlords.47.a: "[ROOT.GetLeader] ควรอยูตอ"
 SEA_warlords.47.b: "กลุมกวางสีใหมมีอํานาจที่แข็งแกรงกวา!"

 SEA_warlords.48.t: "แดนใตรวมตัวตอตานเรา"
 SEA_warlords.48.desc: "การรวมชาติใหเปนหนึ่งอีกครั้งนั้นงายกวามากเมื่อกลุมที่แข็งขอมีขนาดเล็กและแตกแยกกัน นาเสียดายที่มณฑลทางใตเริ่มรวมตัวกัน และปราการที่ตานทานกําลังของเรานี้สรางความกังวลมากขึ้นเรื่อยๆ พวกเขาสามารถระดมทรัพยากรและกําลังพลจํานวนนาตกใจมาตอตานเราได หากเลือกที่จะตอตาน"
 SEA_warlords.48.a: "เราจะนําพวกเขากลับมาอยูใตการควบคุมของเรา!"
 SEA_warlords.48.b: "ไมยั่วยุพวกเขานาจะเปนการฉลาดกวา..."
 SEA_warlords.48.tt: "§Rหากเราไมสามารถเอาชนะพวกเขาไดภายในครึ่งป เราจะถูกบีบใหเขาสูภาวะชะงักงัน!§!"

 SEA_warlords.49.t: "ความขัดแยงที่ชะงักงัน"
 SEA_warlords.49.desc: "ดวยแรงกดดันที่เพิ่มขึ้นจากคูแขงทางการเมืองและขวัญกําลังใจของทหารที่ลดลง เปนที่ชัดเจนวาเราตองยุติการสูรบที่ไรผลนี้ และหันไปรับมือภัยคุกคามที่ใหญกวาซึ่งกําลังกอตัวทางตะวันออก เราพายแพในวันนี้ กองกําลังของ [GDC.GetLeader]' จะยังคงยึดครองพื้นที่ทางใตของจีนไปอีกระยะหนึ่ง"
 SEA_warlords.49.a: "ถาเชนนั้นเราจะรอจังหวะ..."

 SEA_warlords.50.t: "คณะผูแทนจาก [FROM.GetLeader] เดินทางมาถึง"
 SEA_warlords.50.desc: "คณะผูแทนที่สงมาจากซีอานเดินทางมาถึงเราในวันนี้ เพื่อหารือมาตรการตอตานญี่ปุนเพิ่มเติมในอีกไมกี่เดือนขางหนา ดูเหมือนวา [FROM.GetLeader] ไดติดตอกับพรรคคอมมิวนิสตจีนในเทือกเขาสานซี และตองการสรางพันธมิตรรวมกับพวกเขา เพื่อการนี้ [FROM.GetLeader] ตองการใหเราใชสายสัมพันธกับ [SOV.GetNameDef] เพื่อหาความชวยเหลือที่จะเปนประโยชนในความขัดแยงที่จะมาถึง"
 SEA_warlords.50.a: "รวมกันเราจะเอาชนะภัยคุกคามทางตะวันออก"

 SEA_warlords.51.t: "การหารืออันเกิดผลที่ลั่วชวน"
 SEA_warlords.51.desc: "เมื่อตนสัปดาหนี้ หลี่เคอหนง ผูแทนของเราไดพบกับ [FROM.GetLeader] ที่ลั่วชวน เพื่อหารือเรื่องการตอตานญี่ปุนและประเด็นความชวยเหลือจากโซเวียตในการตอสูกับผูรุกราน เมื่อการประชุมสิ้นสุดลง ทั้งสองฝายตกลงรวมกันตอตานญี่ปุน แมจะยังไมตกลงเรื่องการเจรจากับเจียงไคเชก ถึงกระนั้น จาง ผูยังคงแคนญี่ปุนที่สังหารบิดาของตน ไดประกาศวาจะทําทุกวิถีทาง แมตองแลกดวยชีวิต เพื่อโนมนาวผูบัญชาการสูงสุดใหรวมมือกับพรรคคอมมิวนิสตจีนตอตานญี่ปุน"
 SEA_warlords.51.a: "บางทีเราอาจไดพันธมิตรเพิ่มอีกรายแลว"

 SEA_warlords.52.t: "[FROM.GetLeader] ตองการระงับการรณรงคโอบลอม"
 SEA_warlords.52.desc: "ขณะนี้ [FROM.GetLeader] ไดรับคําสั่งจาก [CHI.GetLeader] ใหปราบปรามสิ่งที่เรียกวาโจร ในพื้นที่ของเรา ซึ่งแนนอนวารวมถึงพวกเราดวย แต [FROM.GetLeader] ไดติดตอมาและถามวาเราจะยุติการสูรบไวชั่วคราวไดหรือไม ในขณะที่เขาเตรียมการจัดตั้งแนวรวมระหวางเรากับกกมินตั๋ง เราจะรับขอเสนอนี้หรือไม?"
 SEA_warlords.52.a: "เรายินดีรับชวงพักหายใจนี้"
 SEA_warlords.52.b: "เรามีแผนอื่นสําหรับ [FROM.GetNameDef]"

 SEA_warlords.53.t: "[FROM.GetLeader] ลักลอบสงเงินทุนและยุทโธปกรณใหแกอุดมการณของเรา"
 SEA_warlords.53.desc: "[FROM.GetLeader] เริ่มลักลอบนําอาวุธและเงินทุนที่รัฐบาลกลางในนานกิงจัดสรรใหกองทัพของเขา สงมายังฐานที่มั่นปฏิวัติของเราดวยวิธีการตาง ๆ เพื่อเสริมสรางความไววางใจซึ่งกันและกัน และทําใหเราแข็งแกรงขึ้น เนื่องจากเราตางเปนศัตรูคูอาฆาตของฝาย[JAP.GetAdjective]"
 SEA_warlords.53.a: "เราจะใชมันใหเกิดประโยชนสูงสุด"

 SEA_warlords.54.t: "[FROM.GetLeader] ถอนทหารออกจาก [1032.GetName]"
 SEA_warlords.54.desc: "[FROM.GetLeader] ไดถอนทหารที่ประจําการอยูในเมืองเหยียนอัน ไมเพียงเพื่อเสริมกําลังใหเรา แตยังเพื่อดึงความสนใจของรัฐบาลกลางดวย การกระทํานี้นาจะทําให [CHI.GetLeader] เดินทางขึ้นเหนือเพื่อลงโทษกองทหารปราบปรามและพยายามยายพวกเขาไปทางตะวันออกเฉียงใต พรอมทั้งตําหนิรัฐบาลทองถิ่นที่กระดางกระเดื่องอยาง [FROM.GetLeader] และ [SHX.GetLeader] แตขณะที่เขาอยูในซีอาน [FROM.GetLeader] วางแผนจะใชวิธีการขั้นเด็ดขาดเพื่อบีบให [CHI.GetLeader] ตั้งแนวรวมตอตานญี่ปุน"
 SEA_warlords.54.a: "ขาวดีเยี่ยม!"

 SEA_warlords.55.t: "การรุกหยุดชะงัก"
 SEA_warlords.55.desc: "ดวยแรงกดดันที่เพิ่มขึ้นจากรัฐบาลกลางใหแสดงผลงานซึ่งไมเคยเกิดขึ้นจริง ประกอบกับขวัญกําลังใจของทหารที่ถดถอยลง เห็นไดชัดวาเราตองยุติการสูรบที่ไรผลนี้และหันไปรับมือกับภัยคุกคามที่ใหญกวาซึ่งกําลังคุกคามจีน วันนี้เราพายแพแลว [PRC.GetNameDef] ยังยืนหยัดไดแมเผชิญความยากลําบาก และกองกําลังของพวกเขาจะยังคงยึดครองพื้นที่ทางเหนือของมณฑลเราตอไปอีกระยะหนึ่ง"
 SEA_warlords.55.a: "ถาเชนนั้นเราจะรอเวลา..."
 SEA_warlords.55.tt: "เราจะสามารถดําเนินแผนยุทธศาสตร §Y$XIC_request_relocation_to_northeastern_command$§! ไดแลว"

 SEA_warlords.56.t: "[FROM.GetLeader] ขอยายไปประจําที่ [608.GetName]"
 SEA_warlords.56.desc: "จอมทัพหนุม [FROM.GetLeader] ไดขอยายไปประจํากองรักษาการณภาคตะวันออกเฉียงเหนือที่ [608.GetName] เพื่อใหใกลภัยคุกคามจากญี่ปุนและทําหนาที่เปนปราการตานการรุกรานของพวกเขา ในฐานะอดีตผูนํากลุมเฟงเทียน ดูเหมือนเขาตองการลงมือเชิงรุกเพื่อทวงคืนบานเกิดที่สูญเสียไป เราวาอยางไร?"
 SEA_warlords.56.a: "การปองกันเชิงรุกหรือ? ยอดเยี่ยม!"
 SEA_warlords.56.b: "เราไวใจใหเขารับตําแหนงนั้นไมได"

 SEA_warlords.57.t: "[FROM.GetLeader] ปฏิเสธคําขอของเรา"
 SEA_warlords.57.desc: "[FROM.GetLeader] คนทรยศผูนิ่งนอนใจ ไดปฏิเสธคําขอของเราที่จะตั้งฐานที่มั่นแนวหนาเพื่อตานญี่ปุน เห็นไดชัดวาเขาไมไดคํานึงถึงอนาคตที่ดีที่สุดของจีนเลย"
 SEA_warlords.57.a: "พวกเขาจะตองเสียใจกับวันนี้..."

 SEA_warlords.58.t: "รัฐบาลกดดันใหยอมสยบตอ [XIC.GetNameDef]"
 SEA_warlords.58.desc: "[XIC.GetNameDef] และ [FROM.GetNameDef] ไดยื่นขอเรียกรองรวมกันใหเรายอมรับแผนใหมในการสงมอบ [608.GetName] และดินแดนโดยรอบใหแกจอมทัพหนุม เพื่อใชเปนฐานปฏิบัติการแนวหนาแหงใหมตอตานญี่ปุน ดูเหมือนพวกเขาตั้งใจจะยุติอํานาจปกครองตนเองของเราไมทางใดก็ทางหนึ่ง..."
 SEA_warlords.58.a: "ก็ได เราทําหนาที่ของเราครบแลว"
 SEA_warlords.58.b: "พวกเขาตองใชกําลังยึด [608.GetName] เอาเอง!"

 SEA_warlords.59.t: "การเคลื่อนพลครั้งใหญสูทางเหนือ"
 SEA_warlords.59.desc: "ในที่สุดก็ถึงเวลาทวงคืนดินแดนที่สูญเสียไปของกลุมเฟงเทียน [608.GetName] อยูภายใตการบัญชาของเราแลว และภารกิจปราบโจรในสานซีของเราก็สิ้นสุดลงอยางเปนทางการ อีกไมนานบานเกิดที่สูญเสียไปทั้งหมดจะกลับมาอยูในการควบคุมของเรา!"
 SEA_warlords.59.a: "เราเขาใกลการกอบกูเกียรติยศของเราอีกกาวหนึ่งแลว!"

 SEA_warlords.60.t: "นายพลแปรพักตรไปเขากับ [FROM.GetNameDef]"
 SEA_warlords.60.desc: "นายพลและทหารจํานวนมากที่เคยภักดีตอจอมทัพเฒาจางจั้วหลิน ผูถูกกองทัพควันตงสังหารเมื่อหลายปกอน บัดนี้กําลังตอบรับการเรียกรองของบุตรชายของเขา [FROM.GetLeader] และแปรพักตรไปเขากับ [FROM.GetNameDef] นี่คือหายนะ!"
 SEA_warlords.60.a: "เงาของจั้วหลินยังคงตามหลอกหลอนเรา..."

 SEA_warlords.61.t: "ภารกิจที่ลมเหลว"
 SEA_warlords.61.desc: "หลังจากที่เราลักพาตัว [CHI.GetLeader] และบีบบังคับใหระงับการรณรงคโอบลอมเพื่อมุงรับมือภัยคุกคามที่ใหญกวาตอประชาชนจีน เราไดรับหมายจับและคําขูจากรัฐบาลกลาง ซึ่งระบุวา [ROOT.GetLeader] และคนสนิทจะตองรับผิดชอบ และกองบัญชาการปราบโจรภาคตะวันตกเฉียงเหนือจะตองถูกยุบทั้งหมด เราควรยอมรับชะตากรรมนี้ หรือสูตอเพื่อวันขางหนา?"
 SEA_warlords.61.a: "อยางนอยเราก็ไดพันธมิตรตามที่ขอ..."
 SEA_warlords.61.b: "ไม เราตองคงอํานาจปกครองตนเองไวเพื่อบรรลุเปาหมายสูงสุดของ [ROOT.GetLeader]!"

 SEA_warlords.62.t: "การยุบกองบัญชาการปราบโจรภาคตะวันตกเฉียงเหนือ"
 SEA_warlords.62.desc: "หลังจากที่ [ROOT.GetLeader] ถูกลักพาตัวและถูกบีบบังคับใหจัดตั้งแนวรวมครั้งที่สอง เจาหนาที่รัฐบาลของเราไดออกหมายจับและคําขูตอ [FROM.GetLeader] และคนของเขา และเริ่มเคลื่อนทหารเพื่อยุติภารกิจปกครองตนเองของกองบัญชาการปราบโจรภาคตะวันตกเฉียงเหนือ ถึงเวลาที่คนทรยศเหลานี้จะไดรับสิ่งที่สมควรไดรับแลว"
 SEA_warlords.62.a: "พวกเขาลมเหลวในภารกิจ จงควบคุมพวกเขาไว"

 SEA_warlords.63.t: "เสบียงเพิ่มเติมจาก[SOV.GetAdjective]มาถึงทางชองเขาเอียรเคชตัม"
 SEA_warlords.63.desc: "เมื่อตนสัปดาหนี้ อาวุธและเสบียงเพิ่มเติมจาก[SOV.GetAdjective]ไดมาถึงกองทหารของเรารอบเมืองคาชการ ผานชองเขาเอียรเคชตัมทางทิศตะวันตก โดยไดรับการสั่งการจากอเล็กซานเดอร บารมิน เจาหนาที่[SOV.GetAdjective]ผูรับผิดชอบการสงอาวุธใหรัฐบาลของเรา ดูเหมือนวา [SOV.GetNameDef] มีแผนเฉพาะเจาะจงที่จะกระชับความรวมมือกับเราใหลึกซึ้งยิ่งขึ้น"
 SEA_warlords.63.a: "ขอขอบคุณสหายของเราสําหรับความเอื้อเฟอ"

 SEA_warlords.64.t: "$KHM_ma_hushan$ มาถึงพรอมทองคําของ[KHM.GetAdjective]"
 SEA_warlords.64.desc: "$KHM_ma_hushan$ ผูบัญชาการกองพลที่ 36 แหงกกมินตั๋งผูเสื่อมเสียเกียรติ และปาดิชาหแหง [KHM.GetNameDef] ไดมาถึง [441.GetName] หลังจากทิ้งกองทหารของตน พรอมนําทองคํา 1000 ออนซที่เขาและลูกนองปลนมาจากเมืองหลวงของรัฐเดิม นี่มีกลิ่นของโอกาส..."
 SEA_warlords.64.a: "ยึดทองคําของเขา!"

 SEA_warlords.65.t: "[FROM.GetLeader] ตองการรวมชาวคีรกีซ"
 SEA_warlords.65.desc: "[FROM.GetLeader] รัฐในอารักขาผูภักดีของเรา ซึ่งปจจุบันควบคุม [FROM.GetNameDef] หลังรัฐประหารในมณฑลที่ไดรับการหนุนหลังจาก NKVD ไดแสดงความประสงคจะรวมมณฑลเขากับคีรกีซสถาน เพื่อพัฒนาภูมิภาคใหดีขึ้นและรวมผูคนที่กระจัดกระจายใหอยูใตธงเดียวกัน เราวาอยางไร?"
 SEA_warlords.65.a: "ตราบใดที่เขายังภักดี"
 SEA_warlords.65.b: "เราจะไมประนีประนอมเรื่องพรมแดน!"

 SEA_warlords.66.t: "[FROM.GetLeader] โอนคีรกีซสถาน"
 SEA_warlords.66.desc: "[FROM.GetLeader] ยอมรับคําขอของเราแลว และภูมิภาคปามีรกําลังถูกโอนมาใหเราในขณะที่ไดรับขาวนี้ นับจากนี้รัฐดังกลาวจะอยูภายใตการปกครองของเรา โดยเปนอิสระจากการปกครองโดยตรงของฝาย[FROM.GetAdjective]"
 SEA_warlords.66.a: "วันอันยิ่งใหญ!"

 SEA_warlords.67.t: "[FROM.GetLeader] ปฏิเสธคําขอของเรา"
 SEA_warlords.67.desc: "[FROM.GetLeader] ไดปฏิเสธคําขอโอนดินแดนของเรา เปนสิ่งที่คาดไวแลวจากพวกเขา แตจะสงผลเสียตอความสัมพันธของเราในระยะยาวอยางแนนอน"
 SEA_warlords.67.a: "สักวันเราจะไดมันคืน..."

 SEA_warlords.68.t: "นายพลกั๋วหมินจวินแปรพักตรไปเขากับ [FROM.GetNameDef]"
 SEA_warlords.68.desc: "เฝงอวี้เสียงและทหารที่เคยภักดีตอกั๋วหมินจวิน องคกรที่เคยกอกบฏตอเราและกลับเขารวมหลังจากเราบดขยี้พวกเขา บัดนี้กําลังแปรพักตรไปเขากับ [FROM.GetNameDef] เมื่อ [FROM.GetLeader] ประกาศฟนฟูองคกรทหารนี้ขึ้นมาใหม"
 SEA_warlords.68.a: "เงาของกั๋วหมินจวินยังคงตามหลอกหลอนเรา..."

 SEA_warlords.69.t: "การยุบสภาการเมืองเหอเปย-ชาฮาร"
 SEA_warlords.69.desc: "เมื่อพายแพตอกองกําลังขาศึกแลว สภาการเมืองเหอเปย-ชาฮาร ซึ่งทําหนาที่เปนหนวยปกครองตนเองทองถิ่นเพื่อสนองขอเรียกรองของญี่ปุนเรื่องการปลอดทหารในภูมิภาคตามขอตกลงเหอ-อุเมซุ ก็ไมมีประโยชนที่แทจริงอีกตอไป บางทีอาจถึงเวลาควบคุมผูนําของพวกเขา และนํากองกําลังของพวกเขามาอยูใตการบัญชาของรัฐบาลกลาง"
 SEA_warlords.69.a: "พวกเขาทําหนาที่ของตนเสร็จแลว"
 SEA_warlords.69.b: "พวกเขาอาจยังมีประโยชนตอเรา"

 SEA_warlords.70.t: "มรดกแหงผิงหนานกั๋ว"
 SEA_warlords.70.desc: "เมื่อบรรลุสิ่งที่ประชาชนของเราใฝหามาตั้งแตกบฏปนไถและกบฏตงกาน คือการขจัดเศษซากการปกครองของราชวงศชิงและกกมินตั๋งออกจากจีนจนหมดสิ้น หลายคนจึงเริ่มตั้งคําถามถึงรูปแบบการปกครองแผนดินของเรา เราควรสืบทอดเจตนารมณของตูเหวินซิ่วและนําพายุคทองใหมมาสู หรือเลือกเสนทางที่ปลอดภัยกวาโดยเดินตามรอยหยวนซื่อไข?"
 SEA_warlords.70.a: "ในที่สุดก็ถึงเวลาสําหรับการปกครองรูปแบบใหม!"
 SEA_warlords.70.b: "เราจะเปนจักรวรรดิอีกครั้ง!"
 SEA_warlords.70.c: "ราชวงศหมาผูยิ่งใหญจงเจริญ!"

 SEA_warlords.71.t: "[FROM.GetLeader] ขอความชวยเหลือ"
 SEA_warlords.71.desc: "[FROM.GetLeader] ไดขอความชวยเหลือจากเราในการตอสูกับ [SIK.GetLeader] แมการสูญเสียพวกเขาจะหมายถึงการที่ตระกูลของเราสูญเสียที่มั่นในมณฑล แตสิ่งสําคัญไมแพกันคือเราตองไมปลอยใหพวกคอมมิวนิสตทางตะวันออกฉวยโอกาสขณะที่ทหารของเราไปรบที่อื่น"
 SEA_warlords.71.a: "เราจะชวยพวกเขาตอสูกับคอมมิวนิสต!"
 SEA_warlords.71.b: "เรามีปญหาตองจัดการมากพออยูแลว"

 SEA_warlords.72.t: "ความชวยเหลือมาถึงจาก [FROM.GetNameDef]"
 SEA_warlords.72.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ตัดสินใจสนับสนุนความพยายามของเราอยางเต็มที่ เพื่อไมใหโซเวียตยึดมณฑลของเราได แมจะตองเสี่ยงตอความสัมพันธของพวกเขาเองกับรัฐนั้นก็ตาม"
 SEA_warlords.72.a: "เทานี้เราก็พลิกสถานการณไดแลว!"

 SEA_warlords.73.t: "ไมมีความชวยเหลือจาก [FROM.GetNameDef]"
 SEA_warlords.73.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ตัดสินใจไมใหความชวยเหลือใด ๆ แกเรา เพื่อเอาใจทางการโซเวียต เพราะพวกเขาใหความสําคัญกับความเปนหุนสวนกับชาตินั้นมากกวาการอยูรอดของเรา"
 SEA_warlords.73.a: "พวกคนทรยศบัดซบ"

 SEA_warlords.74.t: "การลมสลายของกลุมหมาแหงโคตัน"
 SEA_warlords.74.desc: "หลังรัฐประหารโคนหมาหูซาน สมาชิกตระกูลของเราจํานวนมากเริ่มหลั่งไหลขามพรมแดนมาสมทบกับเรา เพื่อรอวันทวงคืนกลุมที่สูญเสียไปของพวกเขา"
 SEA_warlords.74.a: "ยินดีตอนรับ พี่นอง"

 SEA_warlords.75.t: "[FROM.GetLeader] ตองการเริ่มการทัพสุยหยวน"
 SEA_warlords.75.desc: "กองทัพมองโกเลียในและกองทัพธรรมะตาฮั่นพรอมเปดปฏิบัติการเขาสูดินแดนของขุนศึก [SHX.GetLeader] หากไดรับการสนับสนุนทางอากาศและการกํากับดูแลจากนายทหารเสนาธิการญี่ปุน บางทีเราอาจยึดครองมองโกเลียในไดมากขึ้นโดยไมตองจุดชนวนสงครามขนาดใหญในจีน"
 SEA_warlords.75.a: "เชิญลองดูไดเลย"
 SEA_warlords.75.b: "ความคิดที่โงเขลา"

 JAP_suiyuan_campaign_has_started_flag: " การทัพสุยหยวนไดเริ่มขึ้นแลว"
 JAP_suiyuan_campaign_has_ended_flag: " การทัพสุยหยวนสิ้นสุดลงแลว"
 
 SEA_warlords.100.t: "[XIC.GetName] ทรยศ [ROOT.GetLeader]"
 SEA_warlords.100.desc: "มีรายงานดวนจาก [XIC.GetNameDef] แจงวา [XIC.GetLeader] ไดถอนทหารออกจาก [1032.GetName] ปลอยใหกองกําลัง [PRC.GetNameDef] หลั่งไหลเขาสูภูมิภาคและอางเปนของตน จุดประสงคทั้งหมดของ [XIC.GetName] คือการควบคุมและกําจัด [PRC.GetName] ไมใชชวยเหลือพวกเขา"
 SEA_warlords.100.a: "การทรยศครั้งนี้จะไมถูกปลอยผาน!"

 #Tooltips
 SIC_can_lead_to_war_with_china_tt: "§Rสิ่งนี้อาจนําไปสูความขัดแยงกับรัฐบาลกลางมากขึ้น!§!"
 SIK_locks_good_focus_tt: "§Rเรายังไมสามารถสรางกลุมซินเกียงที่เปนหนึ่งเดียวได§!"
 SIK_failed_campaign_tt: "[SIK.GetLeader] ลมเหลวในการขับไลกกมินตั๋งออกจากมณฑล"
 yulbars_khan_fled_tt: "$KUM_yulbars_khan$ หนีไปยังโคตัน"
 TSR_recieve_pp_warlord: "เราจะไดรับอํานาจทางการเมือง 100 เมื่อพวกเขาทําตามขอตกลง"
 TSR_recieve_manpower_warlord: "เราจะไดรับกําลังพล 5000 เมื่อพวกเขาทําตามขอตกลง"
 TSR_recieve_equipment_warlord: "เราจะไดรับยุทโธปกรณทหารราบ 1000 เมื่อพวกเขาทําตามขอตกลง"


 #############
 ##MANCHUKUO##
 #############
 tsr_manchukuo.1.t: "คําถามเรื่องผูนํา"
 tsr_manchukuo.1.desc: "ตําแหนงจักรพรรดิเปนเสี้ยนหนามในฐานะความเปนจักรวรรดิของแมนจูเรียมาโดยตลอด เมื่อประเทศทําหนาที่เสมือนสาธารณรัฐภายใตการปกครองของนายกรัฐมนตรีจางจิ่งฮุยและกองทัพควันตง จักรพรรดิจึงออนแออยางยิ่ง แทบเปนเพียงประมุขในนาม แตทั้งหมดนี้อาจเปลี่ยนไปได เพราะนายทหารบางคนในกองทัพควันตงเชื่อวาเพื่อใหชาติเจริญรุงเรือง ราชบัลลังกตองอยูในพระหัตถของจักรพรรดิอยางมั่นคง แตก็มีบางฝายที่มองวาผูอี๋ออนแอและไมนาไววางใจ และอยากใหราชบัลลังกตกเปนของผูเจี๋ย พระอนุชาผูไดรับการศึกษาจากญี่ปุนมากกวา"
 tsr_manchukuo.1.a: "เราควรรักษาสถานะเดิมไว"
 tsr_manchukuo.1.b: "ผูอี๋ควรไดครองบัลลังก!"
 tsr_manchukuo.1.c: "จักรพรรดิไวใจไมได ผูเจี๋ยคือตัวเลือกที่ถูกตอง"
 tsr_manchukuo.2.t: "[FROM.GetLeader] ขอควบคุมตาเหลียน"
 tsr_manchukuo.2.desc: "เย็นวันนี้ [FROM.GetLeader] มาพรอมขอเสนอที่นาสนใจทีเดียว นั่นคือใหเราสงมอบการบริหารดินแดนเชาควันตงรอบเมืองทาตาเหลียน โดยที่เรายังคงดําเนินกิจการตาง ๆ ไดตามเดิม เขากลาววาเมื่อสองชาติของเราแยกจากกันไมไดอยูแลว ก็สมเหตุสมผลที่จะรวมตาเหลียนกลับเขากับแมนจูเรียสวนที่เหลือ ทั้งยังชวยลดภาระคาใชจายดานการบริหารของเราดวย"
 tsr_manchukuo.2.a: "ทําไมจะไมละ?"
 tsr_manchukuo.2.b: "เราไมมีวันยกดินแดนใหงาย ๆ แบบนั้นเด็ดขาด!"
 tsr_manchukuo.3.t: "การโอนตาเหลียน"
 tsr_manchukuo.3.desc: "หลังจากเห็นพองกับขอโตแยงของเราวาการรวมดินแดนเชาควันตงเขากับสวนที่เหลือของชาติแมนจูเรียเปนเรื่องที่สมเหตุสมผล ทางการญี่ปุนจึงตกลงโอนดินแดนดังกลาวใหแกเรา"
 tsr_manchukuo.3.a: "ยอดเยี่ยม!"
 tsr_manchukuo.4.t: "ญี่ปุนปฏิเสธ"
 tsr_manchukuo.4.desc: "ญี่ปุนไมไดหวั่นไหวตอขอโตแยงของเราเลย กลับหัวเราะเยาะคําขออยางจริงจังของเราที่จะใหโอนทาเรือตาเหลียน โดยกลาววาเปนเรื่อง "ไรสาระสิ้นดี" และแนะวาเราควรทบทวนเสียใหมวาบทบาทของเราในวงอํานาจนี้สําคัญเพียงใดกันแน"
 tsr_manchukuo.4.a: "ชางเถอะ"
 tsr_manchukuo.5.t: "การปฏิวัติลุกลาม"
 tsr_manchukuo.5.desc: "หลังเหตุการณอันนาตกตะลึงในแมนจูเรีย กลุมคอมมิวนิสตที่รูจักกันในนามพรรคปฏิวัติประชาชนมองโกเลียในไดตัดสินใจฉวยกระแสนี้กอรัฐประหารตอรัฐบาลเหมิงเจียง แมในชวงแรกพวกเขาจะยึดครองทั้งประเทศไมสําเร็จ แตอีกไมนานพวกเขาอาจไดเห็นอํานาจควบคุมของญี่ปุนในพื้นที่นี้พังทลายลงอยางรวดเร็ว"
 tsr_manchukuo.5.a: "การปฏิวัติจะตองไดรับชัยชนะ!"
 tsr_manchukuo.5.b: "พวกทรยศ!"
 tsr_manchukuo.6.t: "[MAN.GetLeader] เสนอเปนพันธมิตร"
 tsr_manchukuo.6.desc: "หลังไดรับชัยชนะในสงครามกับญี่ปุน สาขาพรรคคอมมิวนิสตจีนในแมนจูเรียไดเสนอใหเรารวมมือกันในการชิงความเปนใหญเหนือจีน นี่เปนเพียงความพยายามฉวยอํานาจหรือไมนั้นยังตองรอดูกันตอไป แตมันก็อาจเปนโอกาสทองของเรา"
 tsr_manchukuo.6.a: "แนนอนวาเราจะสนับสนุนพี่นองของเราทางเหนือ!"
 tsr_manchukuo.6.b: "ไมมีวัน"
 tsr_manchukuo.7.t: "[MAN.GetLeader] เสนอใหรวมเปนหนึ่ง"
 tsr_manchukuo.7.desc: "หลังไดรับชัยชนะในสงครามกับรัฐบาลจีนและประกาศสถาปนาสาธารณรัฐประชาชนจีน [MAN.GetLeader] ไดเรียกรองใหสาขาพรรคคอมมิวนิสตจีนอื่น ๆ ทั้งหมดรวมเขากับสาธารณรัฐใหมนี้ โดยสัญญาวาจะมอบตําแหนงสูงในรัฐบาลให หากเราปฏิเสธ เขาอางวาเราจะถูกมองวาเปนผูทรยศตอการปฏิวัติ และจะตองเผชิญกับกําลังทหารเต็มอัตราของกองทัพปลดปลอยประชาชน"
 tsr_manchukuo.7.a: "ถาเชนนั้นเราก็จะทําตาม"
 tsr_manchukuo.7.b: "ไมมีวัน!"
 tsr_manchukuo.8.t: "[FROM.GetLeader] ปฏิเสธการรวมเปนหนึ่ง"
 tsr_manchukuo.8.desc: "[FROM.GetLeader] ไมขบขันกับทาทีของเรา และตอบกลับวาขอเสนออันใจกวางของเราเปนเพียงความพยายามอีกครั้งที่จะกดขี่ผูอื่น และพวกเขาจะไมขอมีสวนรวมในละครตลกนี้ พวกเขาจึงไมเหลือทางเลือกอื่นใหเรานอกจากบุกเขาไปยึดสิ่งที่เปนของเราโดยชอบธรรม"
 tsr_manchukuo.8.a: "เขามาเลย!"
 tsr_manchukuo.9.t: "[FROM.GetLeader] ขอใหโอนดินแดน"
 tsr_manchukuo.9.desc: "หลังสถานการณในจีนพัฒนาไปอยางรวดเร็ว [FROM.GetLeader] แหง[FROM.GetNameDef] ในฐานะผูแทนของจีนทั้งหมด ไดเสนอใหเราชวยโอนดินแดนที่เคยเปนของพวกเขามากอน แลกกับการไดพันธมิตรในภูมิภาคนี้ แมการประเมินแบบอนุรักษนิยมจะมีเพียงมองโกเลียและตูวาซึ่งสูญเสียไปในชวงการปฏิวัติ แตบางฝายถึงขั้นผลักดันใหคืนแมนจูเรียนอกดวย เนื่องจากเจาหนาที่พรรคหลายคนมีความผูกพันสวนตัวกับภูมิภาคนั้น"
 tsr_manchukuo.9.a: "พวกเขาจะไมไดอะไรเลย"
 tsr_manchukuo.9.b: "ขอเสนอแรกฟงดูดีกวานะ"
 tsr_manchukuo.9.c: "มองโกเลียเปนของเรา แตยกแมนจูเรียใหพวกเขาไป"
 tsr_manchukuo.9.d: "ใหพวกเขาไปทั้งหมดเลย"
 tsr_manchukuo.10.t: "[SOV.GetLeader] โอนดินแดนของเรา"
 tsr_manchukuo.10.desc: "หลังการเจรจาระหวาง[MAN.GetNameDef]กับ[SOV.GetNameDef] ซึ่งเราไมไดรับเชิญ ทั้งสองฝายไดตกลงโอนดินแดนของเราใหแก[MAN.GetNameDef] หากเราไมยอมรับ เราจะตองเผชิญผลลัพธอันรายแรงจากทั้งสองฝาย"
 tsr_manchukuo.10.a: "เราทําอะไรไมไดแลว"
 tsr_manchukuo.10.b: "เราจะสูจนตัวตาย!"
 MAN_will_support_japan_tt: "§Y$MAN_urzhin_garmaev$§! และ §Y$MAN_jonjurjab$§! จะกลับไปเปนที่โปรดปรานของญี่ปุนอีกครั้ง และจะไมเขารวมฝายเราหากเกิดสงครามระหวางเรากับ [JAP.GetFlag] §Yญี่ปุน§!"
 tsr_manchukuo.11.t: "อุบัติการณหลิงเซิง"
 tsr_manchukuo.11.desc: "หลังการประหารชีวิตหลิงเซิง ผูวาการมณฑลซิงอันและนักการเมืองลัทธิรวมชาติมองโกล โดยนํ้ามือของกองทัพควันตง ความไมสงบไดแผขยายไปทั่วประเทศ กองทัพซิงอันรวมถึงนายพลชาวมองโกลและบูรยัตอยาง $MAN_urzhin_garmaev$ และ $MAN_jonjurjab$ ขูจะลาออกหากเรื่องนี้ไมไดรับการจัดการ แตในขณะเดียวกัน การยอมออนขอก็อาจเสี่ยงตอการทําใหญี่ปุนไมพอใจ"
 tsr_manchukuo.11.a: "เราจะดําเนินการอยางระมัดระวัง"
 tsr_manchukuo.11.b: "ถาอยากลาออกก็ใหลาออกไป"
 tsr_manchukuo.11.c: "ใหกองทัพควันตงขอโทษ"
 tsr_manchukuo.12.t: "การแทรกซึมของ IMPRP"
 tsr_manchukuo.12.desc: "มีรายงานเขามาวาพรรคปฏิวัติประชาชนมองโกเลียในซึ่งนําโดยเซเรงดงรุบ ไดรวมมือกับโจรแมนจูเรียแทรกซึมเขาสูจุดสําคัญหลายแหงทางเหนือ และกําลังรอเวลาลงมือ เรายังไมรูวาจะเกิดขึ้นเมื่อใด แตเกรงวาคงอีกไมนาน"
 tsr_manchukuo.12.a: "พวกโจรบัดซบ!"
 tsr_manchukuo.12.b: "เราคงทําไดแคเฝาดูสถานการณตอไป"
 tsr_manchukuo.13.t: "[MAN.GetLeader] ขอใหโอนตัว $JAP_naoki_hoshino$"
 tsr_manchukuo.13.desc: "ดวยความกาวหนาทางอุตสาหกรรมอยางรวดเร็วของแมนจูเรีย [MAN.GetLeader] หมายตา $JAP_naoki_hoshino$ ไวเปนสมาชิกคณะรัฐมนตรีมาระยะหนึ่งแลว บัดนี้จึงขอใหโอนตัวเขาไปยัง[MAN.GetNameDef] เพื่อดํารงตําแหนงผูอํานวยการสํานักงานกิจการทั่วไป"
 tsr_manchukuo.13.a: "เขาจะรับใชพวกเขาไดดี"
 tsr_manchukuo.13.b: "เราตองการตัวเขาที่นี่"
 tsr_manchukuo.14.t: "$JAP_naoki_hoshino$ เดินทางถึงแมนจูเรีย"
 tsr_manchukuo.14.desc: "หลังการหารือกับญี่ปุนหลายครั้ง ในที่สุดการโอนตัว $JAP_naoki_hoshino$ เขาสูคณะรัฐมนตรีของเราก็ไดรับความเห็นชอบ เขาจะชวยเราพัฒนาเศรษฐกิจไดเปนอยางดีในฐานะผูอํานวยการสํานักงานกิจการทั่วไป"
 tsr_manchukuo.14.a: "ยอดเยี่ยม"
 tsr_manchukuo.15.t: "$JAP_naoki_hoshino$ อยูที่ญี่ปุนตอ"
 tsr_manchukuo.15.desc: "ญี่ปุนไมหวั่นไหวตอขอโตแยงของเรา และตัดสินใจวาจะดีกวาหาก $JAP_naoki_hoshino$ อยูที่บานเกิดในญี่ปุนแทนที่จะไปรับตําแหนงในคณะรัฐมนตรีแมนจูเรีย แมจะนาผิดหวัง แตเราก็จะหาทางเดินหนาตอไปใหได"
 tsr_manchukuo.15.a: "ชางเถอะ"
 tsr_manchukuo.16.t: "[FROM.GetLeader] ขอควบคุมจีน"
 tsr_manchukuo.16.desc: "หลังการประกาศจัดตั้งรัฐบาลความรวมมือแหงชาติ [FROM.GetLeader] ไดขอใหเรารวมดินแดนในจีนของเราไวใตการปกครองของเขา ไมใชภายใต [RNG.GetLeader] แมอาจไมตรงกับที่เราวางแผนไวนัก แตในกรณีนี้การปกครองผานรัฐหุนเชิดเพียงรัฐเดียวนาจะมีประสิทธิภาพกวาหลายรัฐ"
 tsr_manchukuo.16.a: "ถาเชนนั้นเราจะรวมพวกเขาเขาดวยกัน"
 tsr_manchukuo.16.b: "เราขอใหแยกกันอยูดีกวา"
 tsr_manchukuo.17.t: "[FROM.GetLeader] เห็นชอบขอเสนอของเรา"
 tsr_manchukuo.17.desc: "หลังการหารือกับ[FROM.GetNameDef] ไดขอตกลงวาแนวทางที่ดีที่สุดคือการรวมการบริหารจีนไวภายใตเรา เราหวังวาจะไดรวมมือกับพวกเขาตอไป"
 tsr_manchukuo.17.a: "เยี่ยม"
 tsr_manchukuo.18.t: "[FROM.GetLeader] ปฏิเสธขอเสนอของเรา"
 tsr_manchukuo.18.desc: "แมเราจะพยายามโนมนาวอยางเต็มที่ รัฐบาล[FROM.GetAdjective]ก็ตัดสินใจวาการรวมการบริหารจีนไวภายใตเราไมเปนประโยชนตอพวกเขา ตอนนี้เราจึงยังคงแตกแยกกันตอไป"
 tsr_manchukuo.18.a: "บาเอย"
 tsr_manchukuo.19.t: "โซเวียตไมใหอะไรเราเลย"
 tsr_manchukuo.19.desc: "แมเราจะพยายามโนมนาวอยางเต็มที่ โซเวียตก็ตัดสินใจวาเราไมคูควรกับดินแดนใด ๆ ที่พวกเขายึดครองอยู นี่เปนการกระทบกระเทือนความสัมพันธของเราอยางหนัก"
 tsr_manchukuo.19.a: "พวกบอลเชวิคบัดซบ..."
 tsr_manchukuo.20.t: "โซเวียตโอนมองโกเลียและตูวา"
 tsr_manchukuo.20.desc: "โซเวียตตัดสินใจไมโอนแมนจูเรียนอก โดยเห็นวามีความเปนรัสเซียมากเกินไป แตอยางนอยก็ยอมโอนมองโกเลียและตูวาให เนื่องจากการอางสิทธิ์ของเราเหนือดินแดนเหลานั้นเกิดขึ้นเมื่อไมนานมานี้"
 tsr_manchukuo.20.a: "ก็ไมเลว"
 tsr_manchukuo.21.t: "โซเวียตโอนแมนจูเรีย"
 tsr_manchukuo.21.desc: "ในความพลิกผันที่แปลกประหลาด โซเวียตตัดสินใจยกแมนจูเรียนอกให โดยอางวาเรามีความผูกพันสวนตัวกับดินแดนนั้นมากกวา ขณะที่ยังคงมองโกเลียไวเปนรัฐกันชน"
 tsr_manchukuo.21.a: "อยางนอยก็ยังไดอะไรบาง"
 tsr_manchukuo.22.t: "โซเวียตยอมตามขอเรียกรองทั้งหมดของเรา"
 tsr_manchukuo.22.desc: "โชคดีที่โซเวียตมีนํ้าใจยอมรับขอเรียกรองทางดินแดนทั้งหมดของเรา ไมเพียงแตมองโกเลียและตูวาเทานั้น แตรวมถึงแมนจูเรียนอกดวยที่เขามาอยูในอาณาจักรของเรา สิ่งนี้มีแตจะนํามาซึ่งเรื่องดี ๆ"
 tsr_manchukuo.22.a: "วิเศษมาก"



 tsr_manchukuo_news.1.t: "การลุกฮือครั้งใหญในแมนจูเรีย"
 tsr_manchukuo_news.1.desc: "หลังชวงเวลาแหงความรุนแรงและการสูรบที่ทวีขึ้นระหวางผูบริหารชาวญี่ปุนกับกลุมโจรตาง ๆ โจรคนหนึ่งนามวา [MAN.GetLeader] สามารถยึดซินจิงได และโนมนาวใหจักรพรรดิมาเขาขางตน \n\nเมื่อจักรพรรดิเขาขางฝายกบฏ กองทัพก็ตามมาในไมชา บัดนี้แมนจูเรียยืนอยูบนทางแยก ญี่ปุนจะถูกขับไลออกไป หรือการกบฏจะถูกบดขยี้รวดเร็วพอ ๆ กับที่มันปะทุขึ้น?"
 tsr_manchukuo_news.1.a: "ลูกหมาคํารามงั้นหรือ?"
 tsr_manchukuo_news.1.b: "เราจะทวงคืนชะตากรรมของเรา!"
 tsr_manchukuo_news.1.c: "มาถึงจุดนี้ไดอยางไร?"
 tsr_manchukuo_news.1.d: "เหนือความคาดหมายอยางยิ่ง"

 tsr_manchukuo_border_war.1.t: "[MAN.GetNameDefCap]พิชิต[1039.GetName]"
 tsr_manchukuo_border_war.1.desc: "หลังการรุกอยางรวดเร็วใน[1039.GetName] กองทัพ[MAN.GetAdjective]ไดยึดคัลกันและประกาศวาพื้นที่นี้อยูภายใตการควบคุมของตน"
 tsr_manchukuo_border_war.1.a: "ความแข็งแกรงของเราเพิ่มพูน!"
 tsr_manchukuo_border_war.1.b: "ชางเถอะ"
 tsr_manchukuo_border_war.2.t: "[MAN.GetNameDefCap]ถอนตัวจาก[1039.GetName]"
 tsr_manchukuo_border_war.2.desc: "เมื่อเผชิญความยากลําบากอยางหนัก กองทัพ[MAN.GetAdjective]ไดถอยออกจากเมืองคัลกัน นี่อาจยังไมใชจุดจบของความขัดแยง แตในตอนนี้คัลกันจะยังคงเปนของ[CHI.GetAdjective]"
 tsr_manchukuo_border_war.2.a: "ความพายแพชั่วคราว..."
 tsr_manchukuo_border_war.2.b: "คัลกันยังยืนหยัด!"
 tsr_manchukuo_border_war.3.t: "[MAN.GetNameDefCap]พิชิต[608.GetName]"
 tsr_manchukuo_border_war.3.desc: "หลังกองทัพ[MAN.GetAdjective]เดินทัพเขาสูปกกิ่งอยางผูมีชัย กองทัพ[CHI.GetAdjective]ไดถอยลงใตไปยังที่มั่นที่ปองกันไดดีกวา"
 tsr_manchukuo_border_war.3.a: "ในที่สุดปกกิ่งก็เปนของเรา!"
 tsr_manchukuo_border_war.3.b: "พวกมันไมเหลือทางเลือกใหเรา ถอยทัพ!"
 tsr_manchukuo_border_war.4.t: "[MAN.GetNameDefCap]ถอนตัวจาก[608.GetName]"
 tsr_manchukuo_border_war.4.desc: "เมื่อยึดเมืองไมสําเร็จ กองทัพ[MAN.GetAdjective]จึงถอนตัวจากปกกิ่ง แตสันติภาพชั่วคราวนี้จะยืนยาวเพียงใดยังไมแนนอน"
 tsr_manchukuo_border_war.4.a: "เราลมเหลวแลว"
 tsr_manchukuo_border_war.4.b: "ปกกิ่งจะไมแตกงาย ๆ หรอก!"
 tsr_manchukuo_border_war.5.t: "[MAN.GetNameDefCap]พิชิต[614.GetName]"
 tsr_manchukuo_border_war.5.desc: "หลังยึดเหอเปยไดทั้งหมด ก็ไดมีการสงบศึก โดยตกลงวากองทัพ[MAN.GetAdjective]จะไมรุกคืบเขาไปในดินแดนจีนอีก เวนแตจะถูกยั่วยุ"
 tsr_manchukuo_border_war.5.a: "ใกลชัยชนะเขาไปอีกกาว!"
 tsr_manchukuo_border_war.5.b: "เสียไปอีกมณฑลแลว..."
 tsr_manchukuo_border_war.6.t: "[MAN.GetNameDefCap]ถอนตัวจาก[614.GetName]"
 tsr_manchukuo_border_war.6.desc: "แมปกกิ่งจะตกเปนของกองทัพ[MAN.GetAdjective] แตกองกําลังของพวกเขาก็ถูกหยุดยั้งไมใหรุกคืบลึกเขาไปในมณฑลเหอเปย"
 tsr_manchukuo_border_war.6.a: "ชางเถอะ"
 tsr_manchukuo_border_war.6.b: "เหอเปยยังยืนหยัด!"