#Tooltips
 PRC_gains_more_faction_inluence_tt: "[PRC.GetName] ไดรับอิทธิพลในฝายมากขึ้น"


 SEA_PRC_request_aid.1.t: "[FROM.GetName] ขออาวุธ"
 SEA_PRC_request_aid.1.desc: "เนื่องจากเราสนับสนุน[FROM.GetNameDef] บอยครั้งในอดีต พวกเขาจึงขอใหเราจัดหายุทโธปกรณใหอีกครั้ง คําขอนี้อาจเกี่ยวของกับการเดินทัพทางไกลที่เพิ่งสิ้นสุดลง ซึ่งทําใหพวกเขาสูญเสียกําลังพลและยุทโธปกรณอยางหนัก"
 SEA_PRC_request_aid.1.a: "สงเทาที่เราพอแบงใหได"
 SEA_PRC_request_aid.1.b: "เราไมมีอะไรจะแบงให"
 
 SEA_PRC_request_aid.2.t: "[FROM.GetName] สงความชวยเหลือ"
 SEA_PRC_request_aid.2.desc: "[FROM.GetNameDefCap] ตกลงสงยุทโธปกรณที่เรารองขอ การขนสงครั้งใหญนี้จะชวยใหเราจัดตั้งกองพลใหมไดหลายกองพล และยังไดยุทโธปกรณเฉพาะทางที่จะชวยใหจัดตั้งกองรอยสนับสนุนได"
 SEA_PRC_request_aid.2.a: "ยอดเยี่ยม เราจะใชมันใหเกิดประโยชนสูงสุดแนนอน"
 
 SEA_PRC_request_aid.3.t: "[FROM.GetName] ปฏิเสธที่จะสงความชวยเหลือ"
 SEA_PRC_request_aid.3.desc: "คําขอความชวยเหลือของเราจาก[FROM.GetNameDef] ถูกปฏิเสธ โดยเจาหนาที่[FROM.GetAdjective] ระบุวา[FROM.GetNameDef] มียุทโธปกรณเหลือแบงใหนอยมากหลังการปรับโครงสรางเมื่อไมนานนี้"
 SEA_PRC_request_aid.3.a: "เราตองหาแหลงอื่น"
 
 SEA_PRC_request_aid.4.t: "[FROM.GetName] ขอรถถัง"
 SEA_PRC_request_aid.4.desc: "เนื่องจาก[FROM.GetNameDef] ขาดขีดความสามารถทางอุตสาหกรรมและประสบการณในการสรางกองกําลังยานเกราะ [FROM.GetLeader] จึงสงคําขอความชวยเหลือมายังเรา [FROM.GetNameDefCap] ขอรถถังขนาดกลาง T-34 ของเราโดยเฉพาะ โดยอางถึงความสมดุลอันยอดเยี่ยมระหวางอํานาจการยิง การปองกัน และความคลองตัว เราควรตอบอยางไร?"
 SEA_PRC_request_aid.4.a: "เราแบงใหไดมาก" 
 SEA_PRC_request_aid.4.b: "เราแบงใหไดบาง"
