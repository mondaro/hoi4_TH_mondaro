SEA_generic_events.2.t: "[GetOppositionPartyName] จัดการนัดหยุดงาน"
SEA_generic_events.2.desc: "แรงงาน[GetOppositionPartyAdjective]ในโรงงานทองถิ่นแหงหนึ่งไดหยุดการผลิตชั่วคราวเพื่อประทวงเรียกรองสภาพการทํางานที่ดีขึ้นและเสรีภาพทางการเมืองมากขึ้น แมจะมีขนาดจํากัด แตการนัดหยุดงานครั้งนี้ก็แสดงใหเห็นถึงความนิยมของ [GetOppositionPartyName]"
SEA_generic_events.2.a: "พวกเขาจะถูกแทนที่"
SEA_generic_events.2.b: "การเขาแทรกแซงมีแตจะสรางปญหามากขึ้น"

SEA_generic_events.3.t: "[GetOppositionPartySupportersName] ประทวงรัฐบาลที่ออนแอ"
SEA_generic_events.3.desc: "มีรายงานวาผูสนับสนุน [GetOppositionPartyName] กําลังชุมนุมในเมืองหลวง พวกเขาวิจารณความไรประสิทธิภาพของรัฐบาล และดูเหมือนจะสงเสริมรัฐบาลแบบรวมศูนยมากขึ้น"
SEA_generic_events.3.a: "พวกเขาโชคดีที่มีสิทธิ์นั้น"
#SEA_generic_events.3.b: ""

SEA_generic_events.4.t: "[GetOppositionPartySupportersName] กอกวนการประชุมรัฐบาล"
SEA_generic_events.4.desc: "ผูสนับสนุน [GetOppositionPartyName] กลุมเล็กๆ เพิ่งกอกวนการประชุมของรัฐบาลดวยการประทวงขนาดเล็กแตเสียงดัง แมจะไมเปนอันตราย แตเหตุการณทํานองนี้ที่เกิดบอยขึ้นสะทอนถึงการสนับสนุนขบวนการฝายคาน"
SEA_generic_events.4.a: "ประณามการกระทําของพวกเขา"
SEA_generic_events.4.b: "ไมใสใจเหตุการณนี้"

SEA_generic_events.5.t: "[GetOppositionPartyName] จัดการชุมนุม"
SEA_generic_events.5.desc: "วันนี้ [GetOppositionPartyName] ไดจัดการชุมนุมครั้งใหญที่สุดครั้งหนึ่งในชวงหลัง โดยสัญญาวาจะเปนทางเลือกที่แข็งแกรงแทนรัฐบาลของ [ROOT.GetLeader] ขณะนี้รัฐบาลยังไมแนใจวาควรเพิกเฉยตอการชุมนุม หรือควรสกัดไมใหขาวแพรออกไป เพราะไมเชนนั้นอาจดึงดูดผูสนับสนุนใหมใหกับแนวทาง[GetOppositionPartyAdjective]"
SEA_generic_events.5.a: "ทําใหแนใจวาสื่อจะไมรายงานขาวนี้"
SEA_generic_events.5.b: "ยินดีดวยกับพวกเขา"

SEA_generic_events.6.t: "แผนการของรัฐบาลที่จะบอนทําลาย [GetOppositionPartyName] ถูกเปดโปง"
SEA_generic_events.6.desc: "เรื่องอื้อฉาวที่เกี่ยวของกับเจาหนาที่รัฐฝาย [ROOT.GetRulingParty] ถูกเปดเผยขึ้น หลังพบเอกสารที่ระบุแผนการบอนทําลาย [GetOppositionPartyName] ดวยการกอวินาศกรรมแหลงเงินทุนของพวกเขา แมเจาหนาที่เหลานั้นจะกระทําการโดยลําพัง แต [GetOppositionPartySupportersName] คงไมเชื่อเชนนั้น"
SEA_generic_events.6.a: "ขอโทษตอสาธารณะ"
SEA_generic_events.6.b: "เราจะตีตัวออกหางจากแผนการนี้"

SEA_generic_events.7.t: "[GetOppositionPartyName] จัดการชุมนุมใหญ"
SEA_generic_events.7.desc: "วันนี้พรรค[GetOppositionPartyAdjective]กําลังจัดการชุมนุม และมีรายงานคาดการณวาจะมีผูเขารวมในระดับเดียวกับการชุมนุมของ [ROOT.GetRulingParty] เราไดแตหวังวาผูสนับสนุนของเราจะไมเห็นดวยกับขอกังวลของพวกเขา"
SEA_generic_events.7.a: "มาจัดการชุมนุมของเราเองโดยหยิบขอกังวลของพวกเขามาใช"
#SEA_generic_events.7.b: ""

SEA_generic_events.8.t: "[GetOppositionPartySupportersName] พัวพันการปะทะบนทองถนน"
SEA_generic_events.8.desc: "ความนิยมของ [GetOppositionPartyName] กอปญหาขึ้นในวันนี้ เมื่อกลุมผูสนับสนุนปะทะกับผูสนับสนุนรัฐบาลและ [ROOT.GetRulingParty] จนตํารวจตองเขาแทรกแซง แมจะเกิดขึ้นเฉพาะพื้นที่ แตเหตุการณนี้ก็แสดงใหเห็นถึงบรรยากาศทางการเมืองที่ตึงเครียด"
SEA_generic_events.8.a: "เราใชเรื่องนี้ประณาม [GetOppositionPartyName] ได"
SEA_generic_events.8.b: "มุงประณามความรุนแรง"

SEA_generic_events.9.t: "สายลับตางชาติฉวยประโยชนจากความนิยมของฝาย[GetOppositionPartyAdjective]"
SEA_generic_events.9.desc: "หลังมีรายงานความไมสงบเมื่อเร็วๆ นี้ ทั้งกองทัพและตํารวจตางสรุปโดยอิสระวาสมาชิกของ [GetOppositionPartyName] กําลังถูกชักนําโดยประเทศอื่นที่ตองการบอนทําลายหรือสอดแนมรัฐบาลของเรา"
SEA_generic_events.9.a: "ประณาม [GetOppositionPartyName] ตอสาธารณะวาเปนสายลับตางชาติ"
SEA_generic_events.9.b: "มุงกวาดลางผูแทรกซึม"

SEA_generic_events.10.t: "เรื่องอื้อฉาวการทุจริตของรัฐบาล"
SEA_generic_events.10.desc: "ความนิยมที่เพิ่มขึ้นของขบวนการฝายคานอยาง [GetOppositionPartyName] ทําใหรัฐบาลหันไปใชมาตรการที่แยบยลขึ้นเรื่อยๆ เพื่อรักษาอํานาจ แผนการหนึ่งเพิ่งถูกเปดโปง และขนาดของทรัพยากรที่ทุมลงไปเพื่อให [ROOT.GetRulingParty] คงอยูในอํานาจไดกอใหเกิดกระแสตอตานอยางรุนแรง"
SEA_generic_events.10.a: "เราจะปฏิเสธทุกอยาง"
SEA_generic_events.10.b: "ตีตัวออกหางจากบุคคลที่เกี่ยวของ"

SEA_generic_events.11.t: "คนงานทาเรือฝาย[GetOppositionPartyAdjective]นัดหยุดงาน"
SEA_generic_events.11.desc: "คนงานในอุตสาหกรรมตอเรือ ซึ่งสนับสนุน [GetOppositionPartyName] อยางแข็งขันเปนพิเศษ ไดเริ่มการนัดหยุดงานครั้งใหญที่กําลังขัดขวางการตอเรือของเรา แมขอกังวลทางการเมืองของพวกเขาจะแกไขไดไมหมด แตเราก็ยังหลีกเลี่ยงความไมสงบเพิ่มเติมไดดวยการปรับปรุงสภาพการทํางานของพวกเขา"
SEA_generic_events.11.a: "เราจะดูแลใหพวกเขาไดรับคาตอบแทนอยางเปนธรรม"
SEA_generic_events.11.b: "เรื่องนี้เดี๋ยวก็ผานไป"

SEA_generic_events.12.t: "[GetOppositionPartySupportersName] ตอตานมาตรการปองกันประเทศ"
SEA_generic_events.12.desc: "วันนี้ผูสนับสนุน [GetOppositionPartyName] และฝายคานอื่นๆ ไดประทวงเรียกรองใหเราลดการเสริมสรางกําลังทหาร ดวยความกังวลวากองทัพที่ขยายตัวขึ้นจะถูกสงไปปฏิบัติการในตางแดน"
SEA_generic_events.12.desc_wartime: "วันนี้ผูสนับสนุน [GetOppositionPartyName] และพรรคฝายคานอื่นๆ ไดประทวงเรียกรองใหเรายุติสงครามที่กําลังดําเนินอยู โดยมองวาการเสียสละของกองทัพเราไมจําเปนตอผลประโยชนของ[ROOT.GetAdjective]"
SEA_generic_events.12.a: "ยืนยันกับพวกเขาวาเปนเพียงการปกปองประเทศ"
SEA_generic_events.12.b: "ยืนยันกับพวกเขาวาเราตองการสันติภาพ"
SEA_generic_events.12.c: "ปฏิเสธที่จะแสดงความเห็น"

SEA_generic_events.13.t: "ผูสนับสนุนฝาย[GetOppositionPartyAdjective]กอจลาจลใน [root.capital.GetCapitalVictoryPointName]"
SEA_generic_events.13.desc: "กอนที่ตํารวจจะทันไดแจงเรา เจาหนาที่รัฐก็รายงานวาพบความไมสงบระหวางปฏิบัติงานใน [root.capital.GetCapitalVictoryPointName] ดูเหมือนวาสิ่งที่เริ่มจากการชุมนุมทางการเมืองครั้งใหญเพื่อตอตาน [ROOT.GetRulingParty] ไดกลายเปนการปลนสะดม สรางความเสียหายไปทั่วเมือง"
SEA_generic_events.13.a: "ใหนักการเมืองที่ไดรับความเคารพชวยสงบฝูงชน"
SEA_generic_events.13.b: "สงกองทัพเขาไป"

SEA_generic_events.14.t: "การประทวงตอตานรัฐบาลครั้งใหญ"
SEA_generic_events.14.desc: "ความนิยมอยางลนหลามของ [GetOppositionPartyName] ทั้งที่ไมไดมีอํานาจมากนักในรัฐบาล ไดนําไปสูการประทวงใหญหลายครั้งทั่วประเทศ การยอมตามขอเรียกรองบางสวนของผูประทวงอาจชวยคลี่คลายสถานการณได แตก็มีปญหาในตัวของมันเอง"
SEA_generic_events.14.a: "เราจะนําขอเสนอบางสวนของฝาย[GetOppositionPartyAdjective]มาปรับใช"
SEA_generic_events.14.b: "ดูแลใหการประทวงเปนไปอยางสงบ"

SEA_generic_events.15.t: "การประทวงของฝาย[GetOppositionPartyAdjective]กลายเปนความรุนแรง"
SEA_generic_events.15.desc: "เราไดรับขาววาการประทวงขนาดใหญในทองถิ่นที่จัดโดย [GetOppositionPartyName] กลายเปนการนองเลือด หลังมีการขวางปาสิ่งของใสตํารวจจนมีการยิงปนตอบโต เหตุการณนี้แมจะไมใชความผิดของทั้งรัฐบาลและ [GetOppositionPartySupportersName] แตก็สรางความกังวลอยางยิ่งตอเสถียรภาพของประเทศ"
SEA_generic_events.15.a: "ประณามเจาหนาที่พรรคในทองถิ่น"
SEA_generic_events.15.b: "โทษผูประทวง"

#######################
####### WARLORDS ######
#######################


 SEA_warlords.1.t: "การถึงแกกรรมของหลิวเซียง"
 SEA_warlords.1.desc: "ดวยการจากไปของหลิวเซียงและแรงกดดันที่เพิ่มขึ้นเรื่อยๆ จากรัฐบาลกลาง ทําใหชัดเจนยิ่งขึ้นวา [ROOT.GetNameDef] อาจถูกยุบในไมชา อยางไรก็ตาม มีผูเชื่อวาการเสียชีวิตครั้งนี้ไมใชเรื่องบังเอิญแตเปนการลอบสังหาร และตองการสูตอไปแมจะเสี่ยงทําใหรัฐบาลกลางโกรธเคือง"
 SEA_warlords.1.a: "[ROOT.GetNameDefCap] ไดทําหนาที่ของตนสําเร็จแลว"
 SEA_warlords.1.b: "เราตองสูตอไป!"
 SEA_warlords.2.t: "[FROM.GetNameDefCap] ยังคงแข็งขอ"
 SEA_warlords.2.desc: "หลังการจากไปของหลิวเซียง [FROM.GetNameDef] ก็เผชิญการแยงชิงอํานาจ จนหยางเซินขึ้นครองอํานาจ จากขาวลือวาหลิวเซียงถูกกองกําลังของเราลอบสังหาร พวกเขาจึงวางตัวออกหางจากรัฐบาลของเราและตอตานการผนวกรวม"
 SEA_warlords.2.a: "พวกนายพลอวดดี!"
 SEA_warlords.2.b: "ชางเถอะ"
 SEA_warlords.3.t: "[FROM.GetNameDefCap] ยอมรับการผนวกรวม"
 SEA_warlords.3.desc: "หลังการจากไปของหลิวเซียง [FROM.GetNameDef] ก็ถูกยุบอยางรวดเร็วและบัดนี้อยูภายใตอํานาจของเรา เราตองใชประโยชนจากเรื่องนี้"
 SEA_warlords.3.a: "ยอดเยี่ยม"
 SEA_warlords.4.t: "กบฏคูมูลครั้งที่สอง"
 SEA_warlords.4.desc: "ขณะที่การเดินทัพของเราเพื่อตอตานโคทานเริ่มตนขึ้น ยุลบารส ขาน ไดประกาศสนับสนุนหมาหูซาน และเรียกรองใหลุกฮือตอตานการปกครองของเราเหนือฮามี ดวยเหตุนี้ เราจึงตองสูรบสองแนวรบ"
 SEA_warlords.4.a: "ถาเชนนั้นเราจะบดขยี้พวกเขาดวย!"
 SEA_warlords.4.b: "เราตองควาโอกาสนี้! ขานจงเจริญ!"
 SEA_warlords.5.t: "ความขัดแยงที่ชะงักงัน"
 SEA_warlords.5.desc: "ดวยแรงกดดันที่เพิ่มขึ้นจากรัฐบาลกลางและขวัญกําลังใจของทหารที่ลดลง เปนที่ชัดเจนวาเราตองยุติการสูรบที่ไรผลนี้ และหันไปรับมือภัยคุกคามที่ใหญกวาซึ่งกําลังคุกคามจีน เราพายแพในวันนี้ กองกําลังของหมาหูซานจะยังคงยึดครองพื้นที่ทางใตของมณฑลเราตอไป"
 SEA_warlords.5.a: "ถาเชนนั้นเราจะรอจังหวะ..."
 SEA_warlords.6.t: "[FROM.GetLeader] ขอความชวยเหลือ"
 SEA_warlords.6.desc: "[FROM.GetLeader] ไดขอความชวยเหลือจากเราในการตอสูกับ [SIK.GetLeader] แมการสูญเสียพวกเขาจะหมายถึงการที่เราเสียที่มั่นในมณฑลนี้ แตก็สําคัญยิ่งที่เราจะไมทําใหโซเวียตโกรธ เพราะนั่นหมายถึงการเสียหุนสวนและผูคํ้าประกันที่มีศักยภาพ"
 SEA_warlords.6.a: "สงไปใหนอยที่สุดเพื่อเลี่ยงความสนใจของโซเวียต"
 SEA_warlords.6.b: "ชางโซเวียตปะไร พวกเขาไดรับการสนับสนุนเต็มที่จากเรา"
 SEA_warlords.6.c: "เราไมมีอะไรจะแบงให"
 SEA_warlords.7.t: "ความชวยเหลือเล็กนอยมาถึง"
 SEA_warlords.7.desc: "รัฐบาลกลางตัดสินใจใหการสนับสนุนเราเพียงเล็กนอย เพื่อไมใหทางการโซเวียตโกรธเคือง เพราะพวกเขาเห็นคุณคาของความเปนหุนสวนกับชาตินั้นมากกวาความอยูรอดของเรา"
 SEA_warlords.7.a: "อยางนอยก็ยังดีกวาไมมี"
 SEA_warlords.8.t: "ความชวยเหลือมาถึง"
 SEA_warlords.8.desc: "รัฐบาลกลางตัดสินใจยืนหยัดสนับสนุนความพยายามของเราอยางเต็มที่ เพื่อไมใหโซเวียตยึดมณฑลของเราไป และดวยเหตุนี้จึงเสี่ยงตอความสัมพันธของตนเองกับรัฐนั้น"
 SEA_warlords.8.a: "ดวยสิ่งนี้เราจะพลิกสถานการณได!"
 SEA_warlords.9.t: "ไมมีความชวยเหลือมาถึง"
 SEA_warlords.9.desc: "รัฐบาลกลางตัดสินใจไมใหความชวยเหลือใดๆ แกเราเพื่อเอาใจทางการโซเวียต เพราะพวกเขาเห็นคุณคาของความเปนหุนสวนกับชาตินั้นมากกวาความอยูรอดของเราอยางมาก"
 SEA_warlords.9.a: "พวกทรยศเลวทราม"
 SEA_warlords.10.t: "$KUM_yulbars_khan$ เดินทางถึงโคทาน"
 SEA_warlords.10.desc: "หลังการลมสลายของคานาเตะคูมูล $KUM_yulbars_khan$ สามารถหลบหนีการจับกุมและหนีมาหาเราเพื่อสูกับศัตรูรวมตอไป เราควรตอนรับเขาดวยออมแขนที่เปดกวาง"
 SEA_warlords.10.a: "เราจะใหเขาเริ่มงานทันที!"
 SEA_warlords.11.t: "$KUM_yulbars_khan$ เดินทางมาถึง"
 SEA_warlords.11.desc: "$KUM_yulbars_khan$ นายพลกกมินตั๋ง ไดกลับมาอยูฝายเราแลว หลังการลุกฮือตอตานกองกําลังของ [SIK.GetLeader] ผูวาการมณฑลซินเจียงลมเหลว เราควรตอนรับเขาดวยออมแขนที่เปดกวาง"
 SEA_warlords.11.a: "ถึงเวลาสูตอ"
 SEA_warlords.12.t: "$XSM_ma_hongbin$ เดินทางมาถึง"
 SEA_warlords.12.desc: "หลังการลมสลายของรัฐของหมาหูซาน $XSM_ma_hongbin$ หลบหนีการจับกุมและในที่สุดก็มาถึงเรา ซึ่งเขาพํานักอยูในขณะนี้ เราควรใชประสบการณและความเชี่ยวชาญของเขาใหเปนประโยชนในการตอสูอีกมากที่จะมาถึง"
 SEA_warlords.12.a: "ยินดีตอนรับกลับบาน"
 SEA_warlords.13.t: "ผูทรยศกลับมา"
 SEA_warlords.13.desc: "หลังกองกําลังของหมาหูซานลมสลาย $KHM_mahmut_muhiti$ อดีตผูวาการคาชการที่ไปเขารวมกับฝายกบฏ ไดเสนอตัวกลับมารับใชรัฐบาลของเราในฐานะผูวาการและนายทหารอีกครั้ง ดูเหมือนเขาตองการโอกาสที่สองเพื่อไถโทษ แตเมื่อคํานึงถึงการกระทําในอดีตของเขา การไวใจเขาอาจไมใชเรื่องฉลาดนัก"
 SEA_warlords.13.a: "เราจะไมไวใจผูทรยศ"
 SEA_warlords.13.b: "เขาจะไดรับโอกาสที่สอง"
