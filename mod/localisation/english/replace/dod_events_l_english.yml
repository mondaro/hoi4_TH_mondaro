 DOD_hungary.163.t: "การประกวดเครื่องบินทิ้งระเบิดของ[From.GetAdjective]"
 DOD_hungary.163.desc: "กองทัพอากาศ[From.GetAdjective]กําลังจัดการทดสอบเครื่องบินทิ้งระเบิดเบาแบบใหม ผูชวยทูตฝายทหารอากาศของเรารายงานวาเครื่องบินรุนใหมลาสุดของเรามีแนวโนมจะชนะ และคาดวาจะมีคําขออยางเปนทางการจากรัฐบาล[From.GetAdjective]ในไมชา \n\nตัวแทนของบริษัทผูผลิตสนับสนุนการขายอยางเต็มที่ แตก็มีความกังวลดานความมั่นคงของชาติเรื่องการขายยุทโธปกรณที่ทันสมัยที่สุดของเราใหแกตางประเทศ เราควรอนุญาตใหการขายนี้ดําเนินตอไปหรือไม?"
 DOD_hungary.164.t: "การประกวดเครื่องบินทิ้งระเบิดของ[From.GetAdjective]"
 DOD_hungary.164.desc: "กองทัพอากาศ[From.GetAdjective]กําลังจัดการทดสอบเครื่องบินทิ้งระเบิดขนาดกลางแบบใหม ผูชวยทูตฝายทหารอากาศของเรารายงานวาเครื่องบินรุนใหมลาสุดของเรามีแนวโนมจะชนะ และคาดวาจะมีคําขออยางเปนทางการจากรัฐบาล[From.GetAdjective]ในไมชา \n\nตัวแทนของบริษัทผูผลิตสนับสนุนการขายอยางเต็มที่ แตก็มีความกังวลดานความมั่นคงของชาติเรื่องการขายยุทโธปกรณที่ทันสมัยที่สุดของเราใหแกตางประเทศ เราควรอนุญาตใหการขายนี้ดําเนินตอไปหรือไม?"
 DOD_hungary.165.t: "การประกวดเครื่องบินทิ้งระเบิดเสร็จสิ้น"
 DOD_hungary.165.desc: "หลังการเจรจากับบริษัทผูผลิตและเจาหนาที่รัฐ เราไดสิทธิบัตรการผลิตเครื่องบินทิ้งระเบิดแบบใหมมาเรียบรอยแลว เครื่องบินตัวอยางไดมาถึงแลวเพื่อใชฝกชางเครื่องในการซอมบํารุง และคาดวาแบบแปลนและพิมพเขียวครบชุดจะตามมาในไมชา สามารถเริ่มการผลิตไดทุกเมื่อ"
 DOD_hungary.165.a: "เยี่ยม"
 DOD_hungary.170.t: "จุดจบของสนธิสัญญา"
 DOD_hungary.170.desc: "เมื่อผูสนับสนุนเดิมไมอยูแลว สนธิสัญญาทรียานงก็ไรคายิ่งกวากระดาษที่ใชพิมพ ไมมีใครปฏิเสธสิทธิ์ในการถืออาวุธของเราไดอีกตอไป!"
 DOD_hungary.170.a: "ยอดเยี่ยม!"
 SWE_HUN_ALLIANCE: "ราชวงศแบรนาด็อต"
 DOD_romania.1.t: "โรมาเนียตองการฟนฟูพันธมิตร"
 DOD_romania.1.desc: "พันธมิตรเกากับโรมาเนียไดสิ้นสุดลงในชวงไมกี่ปที่ผานมา เพราะภัยคุกคามจากเยอรมนีและฮังการีดูหางไกล แตเมื่อสถานการณเปลี่ยนแปลงไป [ROM.GetLeader] จึงเดินทางมาวอรซอเพื่อหารือการตออายุพันธมิตรโรมาเนีย-โปแลนด ในขณะนี้ขอตกลงนี้มีลักษณะเปนการปองกันเทานั้น โดยทั้งสองฝายสัญญาวาจะสนับสนุนกันและกันหากเกิดสงคราม"
 DOD_romania.1.a: "เปนคําขอที่สมเหตุสมผล"
 DOD_romania.1.b: "เราไมสนใจ"
 DOD_romania.2.t: "[From.GetNameDefCap] ตกลงเปนพันธมิตร"
 DOD_romania.2.desc: "คณะผูแทนของเราที่ไปวอรซอไดกลับมาพรอมสนธิสัญญาชวยเหลือที่ลงนามโดย [POL.GetLeader] บัดนี้เรามีพันธะตองปกปองซึ่งกันและกันหากสงครามปะทุขึ้น"
 DOD_romania.2.a: "ดี"
 DOD_romania.3.t: "[From.GetNameDefCap] ปฏิเสธการเปนพันธมิตร"
 DOD_romania.3.desc: "[From.GetLeader] ปฏิเสธที่จะพบคณะผูแทนของเราในวอรซอ โดยสงเพียงขอความหวน ๆ วาการผูกสัมพันธใกลชิดกับโรมาเนีย 'ยังไมอยูในผลประโยชนของรัฐบาล[From.GetAdjective]ในขณะนี้'\n\nคําขอใหชี้แจงเพิ่มเติมไมไดรับคําตอบ"
 DOD_romania.3.a: "นาเสียดาย"
 DOD_romania.10.t: "แนวกันชนสุขอนามัย"
 DOD_romania.10.desc: "แนวคิดแนวกันชนสุขอนามัย (Cordon Sanitaire) ซึ่งเดิมมีจุดประสงคเพื่อสกัดการแพรขยายของลัทธิคอมมิวนิสตและกันกองทัพแดงไมใหบุกเขายุโรป ไดถูก [ROM.GetLeader] ปลุกขึ้นมาใหมเมื่อไมนานมานี้ เพื่อแยกชาติที่ถูกโดดเดี่ยวทางการทูตอยาง [GER.GetNameDef] และ [SOV.GetNameDef] ออกจากกัน\n\nชาวโรมาเนียไดหยั่งทาทีเราเรื่องการเขารวมเปนพันธมิตรอยางเปนทางการกับพวกเขา"
 DOD_romania.10.a: "เรายืนหยัดเปนหนึ่งเดียว"
 DOD_romania.10.b: "ความเปนกลางคือการปองกันที่ดีที่สุด"
 DOD_romania.11.t: "[From.GetNameDefCap] ตกลงเขารวมแนวกันชนสุขอนามัย"
 DOD_romania.11.desc: "รัฐบาลของ [From.GetLeader] ไดประกาศสนับสนุนแนวกันชนสุขอนามัย คณะผูแทนจาก [From.GetNameDef] เดินทางมาถึงแลวเพื่อหารือรายละเอียดการเขารวมฝายของเรา และวางแผนการสนับสนุนทางทหารในกรณีเกิดสงคราม"
 DOD_romania.11.a: "ดี"
 DOD_romania.12.t: "[From.GetNameDefCap] ปฏิเสธ"
 DOD_romania.12.desc: "การเจรจากับ [From.GetNameDef] เรื่องการเขารวมฝายของเราลมเหลว คณะผูแทนจาก [From.GetNameDef] ไดยื่นรายการขอเรียกรองยาวเหยียดเปนเงื่อนไขกอนเขารวมฝายของเรา รวมถึงพันธะการสนับสนุนทางทหารอยางกวางขวาง\n\nเสนาธิการทหารไดปฏิเสธขอเรียกรองเหลานี้ดวยเหตุผลวาเปนไปไมไดที่จะทําตาม และขณะนี้กระทรวงการตางประเทศเชื่อวานี่เปนการเดินเกมโดยเจตนาของ [From.GetLeader] เพื่อปฏิเสธขอเสนอของเราโดยไมดูเหมือนเปนฝายผิด"
 DOD_romania.12.a: "ชางหยาบคาย"
 DOD_romania.20.t: "โรมาเนียเรียกรองการรับประกัน"
 DOD_romania.20.desc: "หลายเดือนมาแลวที่เราพยายามผูกพันธมิตรกับ [ROM.GetNameDef] อยางนอยก็เพื่อไมใหนํ้ามันของพวกเขาตกไปอยูในมือศัตรู บัดนี้ [ROM.GetLeader] ไดประกาศวาการรับประกันอยางเปนทางการวาจะใหการสนับสนุนทางทหารในยามสงคราม เปนขั้นตอนที่จําเปนกอนที่รัฐบาลของเขาจะยอมพิจารณาเขารวมฝายของเราดวยซํ้า"
 DOD_romania.20.a: "พวกเขาจะไดการรับประกันตามตองการ"
 DOD_romania.20.b: "นั่นจะทําใหกําลังของเรากระจายบางลงไปอีก"
 DOD_romania.21.t: "[From.GetNameDefCap] รับประกันพรมแดนโรมาเนีย"
 DOD_romania.21.desc: "[From.GetLeader] กลาวตอที่ประชุมสมาคมมิตรภาพโรมาเนีย-[From.GetAdjective] ประกาศวาพรมแดนปจจุบันของโรมาเนีย 'ไมอาจเปลี่ยนแปลงและเปนนิรันดร' พรอมสัญญาวารัฐบาลของเขาจะทําทุกอยางเทาที่ทําไดเพื่อปกปองพรมแดนนั้นหากสงครามมาถึง"
 DOD_romania.21.a: "ดี"
 DOD_romania.22.t: "[From.GetNameDefCap] ปฏิเสธการรับประกัน"
 DOD_romania.22.desc: "การรุกทางการทูตครั้งลาสุดของเราถูก [From.GetNameDef] ปฏิเสธอยางเย็นชา [From.GetLeader] กลาวตอรัฐสภาวาคําถามเรื่องการรับประกันโรมาเนียอยางเปนทางการ 'จะไดรับการตัดสินเมื่อและหากเรื่องนี้มีความเกี่ยวของขึ้นมา'"
 DOD_romania.22.a: "โหดราย"
 DOD_romania.30.t: "โรมาเนียเสนอฐานทัพ"
 DOD_romania.30.desc: "ขณะที่ความตึงเครียดในยุโรปเพิ่มสูงขึ้น [ROM.GetLeader] ไดมาหาเราพรอมขอเสนอที่นาประหลาดใจ: หากเราใหคํามั่นวาจะปกปองโรมาเนียจากภัยคุกคามภายนอกใด ๆ เราจะไดรับอนุญาตใหตั้งกองกําลังบนแผนดินโรมาเนีย \n\nเพื่อแสดงไมตรีจิต [ROM.GetLeader] ยังไดผอนคลายขอจํากัดตอพรรคคอมมิวนิสตดวย"
 DOD_romania.30.desc_alt: "ขณะที่ความตึงเครียดในยุโรปเพิ่มสูงขึ้น [ROM.GetLeader] ไดมาหาเราพรอมขอเสนอที่นาประหลาดใจ: หากเราใหคํามั่นวาจะปกปองโรมาเนียจากภัยคุกคามภายนอกใด ๆ เราจะไดรับอนุญาตใหตั้งกองกําลังบนแผนดินโรมาเนีย"
 DOD_romania.30.a: "พวกเขาจะไดการรับประกันตามตองการ"
 DOD_romania.30.b: "ไมมีการตกลงกับพวกจักรวรรดินิยม!"
 DOD_romania.31.t: "[From.GetNameDefCap] ตกลงตามขอเสนอ"
 DOD_romania.31.desc: "[SOV.GetLeader] ไดสั่งการดวยตนเองใหกองทัพ[SOV.GetSovietArmyAdjectiveBasedOnIdeology]วางแผนปองกันโรมาเนียในกรณีเกิดสงคราม คณะผูแทนทางทหารขนาดเล็กไดเดินทางมาถึงเพื่อเตรียมฐานทัพและสนามบินสําหรับกองรักษาการณที่จะมาถึงในไมชา"
 DOD_romania.31.a: "หวังวาเราจะไมตองเสียใจภายหลัง"
 DOD_romania.32.t: "[From.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 DOD_romania.32.desc: "การเจรจาเรื่องการตั้งกองกําลัง[SOV.GetAdjective]ในโรมาเนียยุติลงหลังผานไปเพียงไมกี่ชั่วโมง โดยชาว[SOV.GetAdjective]ประกาศวาพวกเขาไมสนใจจะรับประกันพรมแดนของเรา\n\nนายพลของเราไมนอยตางจับนัยที่นากังวลวา นี่อาจเปนเพราะพวกเขาไมชอบรูปรางพรมแดนในปจจุบันและตองการจะเปลี่ยนแปลงมัน"
 DOD_romania.32.a: "นากังวลจริง ๆ"
 DOD_romania.40.t: "แรงกดดันจากโรมาเนีย"
 DOD_romania.40.desc: "เอกอัครราชทูตของเราประจํา [ROM.GetNameDef] ถูกเรียกตัวอยางเรงดวนไปยังสํานักงานของ [ROM.GetLeader] กอนที่เขาจะไดสอบถามถึงการเคลื่อนกําลังของกองทัพโรมาเนียมายังพรมแดนรวมของเรา เขาก็ถูกยื่นคําขาด [ROM.GetLeader] ยืนกรานวา [BUL.GetNameDefCap] ไมอาจไดรับอนุญาตใหดําเนินการใด ๆ โดยปราศจากความยินยอมโดยชัดแจงของเขาอีกตอไป และตองเสนอการตัดสินใจเชิงนโยบายสําคัญทุกเรื่องใหเขาอนุมัติ\n\nการปฏิเสธจะถูกตอบโตดวยกําลัง"
 DOD_romania.40.a: "เราตองยอมตามขอเรียกรองของพวกเขา"
 DOD_romania.40.b: "ยอมตายดีกวาเสียศักดิ์ศรี!"
 DOD_romania.41.t: "[From.GetNameDefCap] ยอมจํานน"
 DOD_romania.41.desc: "[BUL.GetNameDefCap] ยอมรับคําขอของเรา และบัดนี้จะปรึกษาเรากอนตัดสินใจทางการเมืองใด ๆ\n\nผูแทนพิเศษไดเดินทางถึงโซเฟยเพื่อประสานงานกับรัฐบาลของพวกเขา"
 DOD_romania.41.a: "ดี"
 DOD_romania.42.t: "[From.GetNameDefCap] แข็งขอ"
 DOD_romania.42.desc: "มีรายงานวาเมื่อไดรับรายการขอเรียกรองของเรา [BUL.GetLeader] หัวเราะแลวฉีกกระดาษทิ้ง พรอมอางวาไมมีกองทัพโรมาเนียใดจะเอาชนะกองทัพบัลแกเรียในการรบได"
 DOD_romania.42.a: "เรื่องนี้ไมคุมกับการนองเลือด"
 DOD_romania.42.b: "มาดูกันวาเขาพูดถูกหรือไม"
 DOD_romania.50.t: "โรมาเนียเรียกรองใหเปลี่ยนแปลงรัฐบาล"
 DOD_romania.50.desc: "เมื่อ [ROM.GetLeader] เรียกรองตอสาธารณะวาเขาควรมีสิทธิ์ยับยั้งการแตงตั้งใด ๆ ของรัฐบาล[HUN.GetAdjective] เพียงเพราะเปนผลประโยชนของโรมาเนีย คนสวนใหญในวงการทูตตางมองวาเปนแคโฆษณาชวนเชื่อสําหรับผูฟงในประเทศ \n\nเราจึงคอนขางประหลาดใจเมื่อไดรับบันทึกอยางเปนทางการที่มีเนื้อหาเดียวกันในเวลาตอมาไมนาน\n\nการขูวาจะใชกําลังทหารหากเราไมปฏิบัติตามทําใหเสนาธิการทหารตื่นตระหนก และกองบัญชาการสูงสุดของกองทัพบกไดแสดงความสงสัยอยางยิ่งวาเราจะตานโรมาเนียไวที่พรมแดนไดหรือไม"
 DOD_romania.50.a: "เราไมมีทางเลือก"
 DOD_romania.50.b: "เราประนีประนอมไดบาง"
 DOD_romania.50.c: "ยอมตายอยางเสรีดีกวาอยูอยางทาส"
 DOD_romania.51.t: "[From.GetNameDefCap] เขารวมแนวทาง"
 DOD_romania.51.desc: "เมื่อตระหนักวาการตอตานทางทหารเปนไปไมไดและไรประโยชน รัฐบาลฮังการีจึงตัดสินใจทําตามคําแนะนําของเราและยอมอยูใตการบงการของเรา โดย [HUN.GetLeader] สัญญาวาจะปรึกษาเรากอนการตัดสินใจเชิงนโยบายสําคัญใด ๆ"
 DOD_romania.51.a: "ดี"
 DOD_romania.52.t: "[From.GetNameDefCap] เสนอสนธิสัญญามิตรภาพ"
 DOD_romania.52.desc: "เพื่อตอบสนองคําขอลาสุดของเราใหเปลี่ยนแปลงรัฐบาลฮังการีบางประการ [HUN.GetLeader] ไดเสนอสนธิสัญญามิตรภาพและความชวยเหลือซึ่งกันและกัน ซึ่งจะบังคับใหพวกเขาตองมาชวยเหลือเราในยามสงคราม แตก็มีขอกําหนดที่เราตองสาบานวาจะไมแทรกแซงการเมืองฮังการี"
 DOD_romania.52.a: "เปนการประนีประนอมที่ยอมรับได"
 DOD_romania.52.b: "นั่นไมใชสิ่งที่เราหมายถึง"
 DOD_romania.53.t: "[From.GetNameDefCap] แข็งขอ"
 DOD_romania.53.desc: "แมกองทัพของเขาจะดอยกวาอยางเห็นไดชัด [HUN.GetLeader] ก็ไมยอมฟงเหตุผล และสั่งใหกองทัพเขาที่มั่นตั้งรับตามแนวพรมแดนของเรา ดวยเหตุผลที่ไมทราบแนชัด ดูเหมือนวากองทัพของพวกเขาสวนใหญจะทําตามคําสั่งนี้\n\nดูเหมือนพวกเขาตองการจะสู"
 DOD_romania.53.a: "ไมคุมกับเวลาและแรงที่เสียไป"
 DOD_romania.53.b: "ชัยชนะเปนของเราแนนอน สูสงคราม!"
 DOD_romania.60.t: "โรมาเนียเรียกรองการปรับโครงสรางอยางถึงราก"
 DOD_romania.60.desc: "เมื่อกองทัพโรมาเนียตั้งประชิดพรมแดนของเรา ขาวลือเรื่องจุดประสงคของพวกเขาก็แพรสะพัด เมื่อเอกอัครราชทูตของเราในบูคาเรสตสอบถามเรื่องนี้ เขาไดรับคําตอบตรง ๆ วา [ROM.GetLeader] ตัดสินใจแลววายูโกสลาเวียที่เปนปกแผนไมอยูในผลประโยชนของเขาอีกตอไป ประเทศของเราจะถูกแบงออกเปนรัฐบริวารหลายรัฐภายใตการควบคุมโดยตรงของโรมาเนียแทน\n\nคาดวาคําขาดอยางเปนทางการจะมาถึงภายในชั่วโมงนี้"
 DOD_romania.60.a: "เราไมมีหวังจะตานพวกเขาได"
 DOD_romania.60.b: "ไมมีวัน!"
 DOD_romania.61.t: "[From.GetNameDefCap] ยอมแพ"
 DOD_romania.61.desc: "เพียงไมกี่นาทีกอนคําขาดตอเบลเกรดจะหมดเวลา แถลงการณอยางเปนทางการก็มาถึง ระบุวารัฐบาลยูโกสลาเวียไดยุบตัวลงและโอนอํานาจใหแกรัฐบาลทองถิ่นหลายแหง ซึ่งทั้งหมดไดประกาศความภักดีตอเรา"
 DOD_romania.61.a: "ดี"
 DOD_romania.62.t: "[From.GetNameDefCap] แข็งขอ"
 DOD_romania.62.desc: "รัฐบาล[YUG.GetAdjective]ปลอยใหคําขาดหมดเวลาโดยไมตอบกลับ เที่ยวบินลาดตระเวนพบการเคลื่อนกําลังพลฝงยูโกสลาเวียของพรมแดน ทําใหเสนาธิการทหารตองทบทวนแผนการบุก ที่ปรึกษาทางทหารระดับสูงไมยอมรับประกันวาจะเอาชนะยูโกสลาเวียไดอยางรวดเร็ว"
 DOD_romania.62.a: "เราจะบดขยี้พวกมัน"
 DOD_romania.62.b: "ขอการสนับสนุนกันเถอะ"
 DOD_romania.63.t: "[From.GetLeader] หมายจะแบงยูโกสลาเวีย"
 DOD_romania.63.desc: "เกิดวิกฤตขึ้นระหวางโรมาเนียกับยูโกสลาเวีย ซึ่งอาจเปดโอกาสใหเรา [YUG.GetLeader] ปฏิเสธขอเรียกรองของ [ROM.GetLeader] ที่ใหยอมจํานนประเทศของตน [ROM.GetLeader] จึงมาหาเราพรอมขอตกลงที่จะแบงยูโกสลาเวีย เขาเสนอสโลวีเนียใหเรา พรอมการจัดตั้งรัฐเอกราชโครเอเชียภายใตการควบคุมของเรา"
 DOD_romania.63.a: "แผนการที่นาสนใจ"
 DOD_romania.63.b: "เราจะตองการความชวยเหลือจากพวกเขาไปทําไม?"
 DOD_romania.64.desc: "เกิดวิกฤตขึ้นระหวางโรมาเนียกับยูโกสลาเวีย ซึ่งอาจเปดโอกาสใหเรา [YUG.GetLeader] ปฏิเสธขอเรียกรองของ [ROM.GetLeader] ที่ใหยอมจํานนประเทศของตน [ROM.GetLeader] จึงมาหาเราพรอมขอตกลงที่จะแบงยูโกสลาเวีย เขาเสนอดัลมาเชียใหเรา พรอมการจัดตั้งรัฐหุนเชิดในมอนเตเนโกรภายใตการควบคุมของเรา"
 DOD_romania.65.t: "[From.GetNameDefCap] ยอมรับ"
 DOD_romania.65.desc: "[From.GetLeader] ไดสงสัญญาณยอมรับเงื่อนไขแลว รัฐบาล[From.GetAdjective]จะสนับสนุนการดําเนินการของเราในยูโกสลาเวีย"
 DOD_romania.65.a: "ยอดเยี่ยม"
 DOD_romania.66.t: "[From.GetNameDefCap] ปฏิเสธ"
 DOD_romania.66.desc: "แมจะไมไดเตือนเราโดยตรงไมใหแทรกแซงในยูโกสลาเวีย แตรัฐบาลแหง [From.GetNameDef] ก็ปฏิเสธที่จะรับรองขอเสนอของเรา \n\nบางทีพวกเขาอาจคาดวาเราจะลมเหลว และหมายจะยึดยูโกสลาเวียไวเองโดยไมมีเราเกี่ยวของ"
 DOD_romania.66.a: "เสียใจดวยที่ตองทําใหพวกเขาผิดหวัง"
 DOD_romania.67.t: "คําขาดตอยูโกสลาเวีย"
 DOD_romania.67.desc: "เมื่อไดการสนับสนุนทางการทูตเพิ่มเติมแลว ก็ถึงเวลาแจงชาวยูโกสลาเวียวาสถานการณไดเปลี่ยนไปอยางสิ้นเชิง ดวยกําลังที่กระจายบางเพื่อปองกันพรมแดนอันยาวเหยียด สถานการณทางทหารของพวกเขายิ่งสิ้นหวังกวาเดิม"
 DOD_romania.67.a: "ชัยชนะอยูแคเอื้อม"
 DOD_romania.68.t: "ความพยายามทางการทูตลมเหลว"
 DOD_romania.68.desc: "ความพยายามติดตอเยอรมนีและอิตาลีเพื่อขอการสนับสนุนของเราไมประสบผล ชวงเวลาหายใจที่ชาวยูโกสลาเวียไดรับจากเรื่องนี้ยอมสงผลตอการทัพที่กําลังจะมาถึงอยางแนนอน แตเสนาธิการทหารยังคงมองในแงดีอยางระมัดระวังวาเราจะไดชัยชนะอยางรวดเร็ว"
 DOD_romania.68.a: "จับอาวุธ!"
 DOD_romania.69.t: "การโอบลอม"
 DOD_romania.69.desc_GER: "คําขาดฉบับที่สองไดถูกสงมาแลว คราวนี้ขอเรียกรองมาพรอมบันทึกทํานองเดียวกันจากเอกอัครราชทูตแหง [GER.GetNameDef] ซึ่งประกาศสนับสนุนแผนการของโรมาเนีย และยืนกรานวากองทัพของเราจะตองไมขัดขวางการยึดครองสโลวีเนียและโครเอเชียโดยกองทหารเยอรมัน"
 DOD_romania.69.desc_ITA: "คําขาดฉบับที่สองไดถูกสงมาแลว คราวนี้ขอเรียกรองมาพรอมบันทึกทํานองเดียวกันจากเอกอัครราชทูตแหง [ITA.GetNameDef] ซึ่งประกาศสนับสนุนแผนการของโรมาเนีย และยืนกรานวากองทัพของเราจะตองไมขัดขวางการยึดครองดัลมาเชียและมอนเตเนโกรโดยกองทหารอิตาลี"
 DOD_romania.69.desc_GERITA: "คําขาดฉบับที่สองไดถูกสงมาแลว คราวนี้ขอเรียกรองมาพรอมบันทึกทํานองเดียวกันจากเอกอัครราชทูตแหง [GER.GetNameDef] และ [ITA.GetNameDef] ซึ่งประกาศสนับสนุนแผนการของโรมาเนีย และยืนกรานวากองทัพของเราจะตองไมขัดขวางการยึดครอง เพื่อหลีกเลี่ยงการนองเลือดโดยไมจําเปน"
 DOD_romania.69.a: "วางอาวุธ"
 DOD_romania.69.b: "เราจะสูจนลมหายใจสุดทาย!"
 DOD_romania.70.t: "ยูโกสลาเวียถูกแบงแยก"
 DOD_romania.70.desc: "รัฐบาลยูโกสลาเวียยอมรับความพายแพ กองกําลังของฝายพันธมิตรไดเขาควบคุมประเทศและยึดครองเขตที่ไดรับมอบหมายของตน"
 DOD_romania.70.a: "อีกหนึ่งชัยชนะทางการทูต"
 DOD_romania.71.t: "ยูโกสลาเวียแข็งขอ"
 DOD_romania.71.desc: "กองทัพยูโกสลาเวียไดเขาที่มั่นตามแนวพรมแดนของเรา และกองทัพอากาศยูโกสลาเวียก็เขาประจําสถานีรบแลว พวกเขาดูพรอมจะสู \n\nอยางไรก็ตาม แหลงขาวในกระทรวงกลาโหมยูโกสลาเวียอางวานี่เปนเพียงทาทีแข็งขอ เพราะ [YUG.GetLeader] เชื่อมั่นวาเราแคขูและจะไมมีสงครามเกิดขึ้น"
 DOD_romania.71.a: "เราไมไดขู"
 DOD_romania.81.t: "นางบําเรอของกษัตริยซื้อวิลลา"
 DOD_romania.81.desc: "มีรายงานวามักดา ลูเปสกู นางบําเรอของพระเจาคาโรลที่ 2 ไดซื้อวิลลาหลังใหมในยานชานเมืองราคาแพงของบูคาเรสต มีการคาดเดากันอยางกวางขวางวาเธอเอาเงินมาจากไหน หลักฐานใหมในหนังสือพิมพตางประเทศชี้อยางชัดเจนวากษัตริยทรงอนุมัติการซื้อนี้ดวยเงินของรัฐบาลเอง\n\nเรื่องอื้อฉาวกําลังลุกลาม และเราตองแถลงตอสาธารณะเกี่ยวกับเรื่องนี้โดยเร็วที่สุด"
 DOD_romania.81.a: "รัฐบาลเปนผูซื้ออาคารนี้และอนุญาตใหคุณลูเปสกูพํานักอาศัย"
 DOD_romania.81.b: "กษัตริยทรงนําเงินมาจากการเบิกเงินปลวงหนา"
 DOD_romania.82.t: "กษัตริยทรงสั่งหามหนังสือที่วิจารณ"
 DOD_romania.82.desc: "หนังสือเลมใหมของนักสังคมศาสตรชื่อดังเพิ่งไดรับการตีพิมพ โดยบรรยายรายละเอียดถึงอิทธิพลกวางขวางที่คนวงในของกษัตริยมีตอการตัดสินใจเชิงนโยบาย ซึ่งการตัดสินใจสวนใหญลงเอยดวยการเอื้อประโยชนใหคนกลุมนี้ในภายหลัง ที่นาสนใจเปนพิเศษคือการเกี่ยวของของนางบําเรอของกษัตริย ซึ่งมีรายงานวาใชเสนสายของตนหาความรํ่ารวยใสตัว กษัตริยจึงทรงสั่งจับกุมผูเขียน\n\nหนังสือพิมพสายเสรีนิยมและฝายขวาจัดตางเดือดดาลกับเรื่องนี้ แมจะดวยเหตุผลที่แตกตางกันมาก เราตองออกแถลงการณกอนที่เรื่องจะบานปลาย"
 DOD_romania.82.a: "การหมิ่นประมาทเปนความผิดทางอาญา"
 DOD_romania.82.b: "จะปลอยตัวผูเขียนทันที"
 DOD_romania.83.t: "กษัตริยทรงจัดงานเลี้ยงหรูหรา"
 DOD_romania.83.desc: "แมกษัตริยจะทรงตรวจทานดวยพระองคเอง แตการรายงานขาวอยางเปนทางการเกี่ยวกับงานเลี้ยงลาสุดที่พระราชวังก็กอใหเกิดความไมพอใจอยางมากในหมูประชาชน ภาพนางบําเรอของกษัตริยในชุดราตรีฝรั่งเศสราคาแพง และคําบรรยายโดยละเอียดถึงอาหาร 7 คอรสที่เสิรฟบนจานทองคํา ยิ่งจุดชนวนความโกรธของประชาชนที่ยังคงไดรับผลกระทบจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ\n\nกษัตริยทรงเรียกรองใหเราแถลงสนับสนุนตอสาธารณะทันที"
 DOD_romania.83.a: "กษัตริยตองสามารถทรงงานดานพิธีการได"
 DOD_romania.83.b: "เรื่องสวนพระองคของกษัตริยไมใชเรื่องของรัฐบาล"
 DOD_romania.84.t: "พบนางบําเรอของกษัตริยในปารีส"
 DOD_romania.84.desc: "หนังสือพิมพฝรั่งเศสเต็มไปดวยขาววีรกรรมของมักดา ลูเปสกู ในปารีส ซึ่งมีรายงานวาเธอช็อปปงอยางบาคลั่ง\n\nแมเรื่องนี้จะไมใชเรื่องแปลกในตัวมันเอง แตรายงานวาเธอขอความชวยเหลือจากสถานทูตโรมาเนียใหขนของที่ซื้อ และบอกรานคาใหสงบิลมาเก็บเงินกับรัฐบาลโรมาเนีย ไดถูกสื่อในประเทศหยิบยกขึ้นมา เราถูกขอใหแสดงความเห็นตอรายงานเหลานี้"
 DOD_romania.84.a: "คุณลูเปสกูกระทําตามพระราชประสงคของกษัตริย"
 DOD_romania.84.b: "รัฐบาลไมแสดงความเห็นตอการกระทําของพลเมืองสวนบุคคล"
 DOD_romania.85.t: "กษัตริยเสด็จพักผอนที่นีซ"
 DOD_romania.85.desc: "พระเจาคาโรลที่ 2 เสด็จถึงเมืองนีซเพื่อพักผอน พรอมดวยนางบําเรอและคนวงในสวนใหญ กษัตริยประทับที่หองรับรองหลวงของโรงแรมเนเกรสโก และตรัสกับนักขาวทองถิ่นวาทรงตั้งพระทัยจะใชเวลาหลายสัปดาหตอจากนี้เพลิดเพลินกับอาหารและการตอนรับชั้นเลิศ โดยมีแผนเสด็จชมโรงอุปรากรนีซ และเสด็จไปปารีสระยะสั้นเพื่อซื้อของ\n\nสื่อทองถิ่นไดตั้งคําถามแหลมคมเรื่องจังหวะเวลาของการเสด็จครั้งนี้ รวมถึงวาเงินที่ใชจายจะมาจากไหน"
 DOD_romania.85.a: "เปนการเสด็จเยือนอยางเปนทางการ"
 DOD_romania.85.b: "กษัตริยเสด็จพักผอนที่นีซทุกป"
 DOD_romania.86.t: "กษัตริยพัวพันเรื่องอื้อฉาวการยักยอกเงิน"
 DOD_romania.86.desc: "หลังมีขาวลือเรื่องการทุจริตในกระบวนการจัดซื้อจัดจางของกองทัพ กษัตริยทรงสัญญาวาจะมีการสอบสวนอยางเปนกลาง รายงานเบื้องตนไดรั่วไหลถึงสื่อมวลชน ซึ่งไมเพียงยืนยันขาวลือ แตยังชี้วาที่ปรึกษาใกลชิดที่สุดของกษัตริยเกี่ยวของโดยตรง\n\nเรื่องทั้งหมดกลายเปนความอับอายของรัฐบาล กษัตริยทรงเรียกรองใหดําเนินการ แตก็ทรงประกาศสนับสนุนที่ปรึกษาเหลานั้นอยางเต็มที่"
 DOD_romania.86.a: "สัญญาที่ลงนามแลวไมอาจถูกโตแยงได"
 DOD_romania.86.b: "ปฏิรูปกระบวนการ"
 DOD_romania.110.t: "โรมาเนียเสนอแบง [CZE.GetNameDef]"
 DOD_romania.110.desc: "[ROM.GetLeader] ไดมาหาเราพรอมขอเสนอใหจัดการกับ [CZE.GetNameDef] โดยชี้ถึงผลประโยชนรวมกันของเราในภูมิภาคนี้ เขาเสนอใหแบงประเทศนั้นออกเปนสามสวน: เราจะไดสวนตะวันตก โรมาเนียจะควบคุมสโลวาเกีย และฮังการีจะไดดินแดนแถบเล็ก ๆ ตามพรมแดนตอนใต"
 DOD_romania.110.a: "เราตองควาโอกาสนี้ไว"
 DOD_romania.110.b: "จะเจรจาไปทําไมในเมื่อเรายึดเอาเองได?"
 DOD_romania.111.t: "[GER.GetLeader] ยอมรับ"
 DOD_romania.111.desc: "รัฐบาลเยอรมนีไดอนุมัติรางสนธิสัญญาและเสนแบงเขตที่เราเสนอแลว ที่เหลือก็แคสงคําขาดไปยังปราก"
 DOD_romania.111.a: "สงบันทึกไปเลย"
 DOD_romania.113.t: "[GER.GetLeader] ปฏิเสธ"
 DOD_romania.113.desc: "ในการพบปะที่ตึงเครียดกับ [GER.GetLeader] เอกอัครราชทูตของเราถูกปฏิเสธอยางเด็ดขาดที่จะหารือหรือเจรจาเรื่องใด ๆ ที่เกี่ยวกับ [CZE.GetNameDef] รัฐบาลเยอรมนีถือวาประเทศนั้นอยูในเขตอิทธิพลของตนโดยสมบูรณ และเตือนวาการแทรกแซงใด ๆ จะถือเปนการขัดตอความประสงคโดยชัดแจงของ [GER.GetLeader]"
 DOD_romania.113.a: "ถึงเวลาทบทวนแนวทางของเรา"
 DOD_romania.113.b: "เราจะลงมือเพียงลําพัง"
 DOD_romania.114.t: "คําขาดจากเยอรมนี"
 DOD_romania.114.desc: "ขณะที่กองทหารเยอรมันรวมพลอยูที่พรมแดนของเรา เอกอัครราชทูตจากเยอรมนีและโรมาเนียไดยื่นคําขาดรวมกัน: หากเราไมยอมยกสโลวาเกียใหฮังการีและโรมาเนีย และกลายเปน 'รัฐในอารักขา' ของเยอรมนี กองทัพอากาศเยอรมันลุฟทวัฟเฟอพรอมจะ 'ลบ' ปรากทิ้ง ขณะที่กองทหารฮังการีก็เตรียมบุกประเทศของเราจากทางใต"
 DOD_romania.114.a: "เราไมมีทางเลือก"
 DOD_romania.114.b: "เราเลือกตายดีกวาเสียศักดิ์ศรี"
 DOD_romania.115.t: "[CZE.GetLeader] แข็งขอ"
 DOD_romania.115.desc: "รัฐบาล[CZE.GetAdjective]เพิกเฉยตอคําขาดของเราและระดมพลกองทัพ [CZE.GetLeader] ใหคํามั่นวาผูรุกรานใด ๆ จะพบวากองทัพพรอมเกินพอที่จะปกปองประเทศจนคนสุดทาย"
 DOD_romania.115.a: "เราจะพิจารณาทางเลือกของเรา"
 DOD_romania.120.t: "เชิญบริษัทยานยนตตางชาติ"
 DOD_romania.120.desc: "บริษัทรถบรรทุกตางชาติหลายแหงแสดงความสนใจจะเปดโรงงานในโรมาเนีย เพื่อผลิตรถบรรทุกใหมทั้งสําหรับตลาดพาณิชยและกองทัพ การเลือกบริษัทหนึ่งจะถือเปนขอตกลงนํารองที่อาจตามมาดวยการไดสิทธิบัตรการผลิตอื่น ๆ อีก\n\nเราควรติดตอใคร?"
 DOD_romania.120.a: "วอกซฮอลล เพื่อยานพาหนะที่เร็วกวา"
 DOD_romania.120.b: "โอเปล เพื่อวิศวกรรมเยอรมันที่ไวใจได"
 DOD_romania.120.c: "ฟอรด เพื่อการผลิตจํานวนมาก"
 DOD_yugoslavia.1.t: "ทหารกอรัฐประหาร"
 DOD_yugoslavia.1.desc: "หลังการตัดสินใจลงนามกติกาสัญญากับเยอรมนีของเรา นายทหารกองทัพอากาศกลุมหนึ่งไดกอรัฐประหาร ฝายทหารไดยึดจุดสําคัญในเบลเกรด และประกาศใหพระเจาปเตอรบรรลุนิติภาวะ เปนการยุติการสําเร็จราชการของ [YUG.GetLeader]\n\nประชาชนทั่วไปสนับสนุนการรัฐประหาร โดยฝูงชนตางตะโกนวา "ยอมรบดีกวายอมทํากติกา ยอมลงหลุมดีกวายอมเปนทาส!"\n\nรัฐบาลอยูบนทางแยก เราจะสนับสนุนรัฐประหารซึ่งหมายถึงสงครามกับเยอรมนี หรือจะตอตานมัน ซึ่งจะฉีกประเทศออกเปนเสี่ยงดวยสงครามกลางเมืองอันนองเลือด"
 DOD_yugoslavia.1.a: "เรานาจะฟงเหลานายทหาร"
 DOD_yugoslavia.1.a.tt: "§Yปเตอรที่ 2§! ขึ้นเปนผูนําพรรค§Y[YUG.GetIdeologyNameWithCaps]§!\n"
 DOD_yugoslavia.1.b: "เรายืนหยัดตามการตัดสินใจของเรา!"
 DOD_yugoslavia.2.t: "รัฐประหารใน [YUG.GetNameDef]"
 DOD_yugoslavia.2.desc: "ทันทีหลังจากรัฐบาลของเจาชายพอลลงนามในกติกาสัญญาไตรภาคี นายทหารกองทัพอากาศ[YUG.GetAdjective]กลุมหนึ่งไดกอรัฐประหารที่วางแผนมาอยางดี โคนรัฐบาลที่ชอบธรรมและยกพระเจาปเตอรที่ 2 ซึ่งยังทรงพระเยาวขึ้นครองราชย\n\nรัฐบาลยูโกสลาเวียลมสลายโดยสิ้นเชิง โดยผูนําชุดใหมประกาศใหการลงนามของเจาชายพอลเปนโมฆะ"
 DOD_yugoslavia.2.a: "ดําเนินการตามคําสั่งฟอเรอรที่ 25"
 DOD_yugoslavia.3.desc: "ทันทีหลังจากรัฐบาลของเจาชายพอลลงนามในกติกาสัญญาไตรภาคี นายทหารกองทัพอากาศ[YUG.GetAdjective]กลุมหนึ่งไดกอรัฐประหารที่วางแผนมาอยางดี โคนรัฐบาลที่ชอบธรรมและยกพระเจาปเตอรที่ 2 ซึ่งยังทรงพระเยาวขึ้นครองราชย\n\nกลุมรัฐบาลเดิมบางสวนไดประณามการรัฐประหารและประกาศภาวะฉุกเฉินแหงชาติ พวกเขาอางวาเนื่องจากนี่เปนฝมือของสายลับตางชาติอยางชัดเจน เราจึงมีพันธะตองปกปองพวกเขา"
 DOD_yugoslavia.3.a: "พวกเขาเขาใจผิดอยางรายแรง"
 DOD_yugoslavia.3.b: "เราจะชวยพวกเขา"
 DOD_yugoslavia.10.t: "แนวรวมที่หา"
 DOD_yugoslavia.10.desc: "เมื่อขาวการประกาศสงครามกับเยอรมนีแพรไปทั่วประเทศ ก็เห็นไดชัดอยางรวดเร็ววาผูคนจํานวนมากในประเทศไมมีความตั้งใจจะจับอาวุธสูกับผูรุกราน หนวยที่มีชาวโครแอตเปนสวนใหญปฏิเสธคําสั่งใหเคลื่อนไปยังพรมแดน และหลายครั้งถึงกับเปดฉากยิงใสหนวยอื่นที่ปฏิบัติตามคําสั่ง\n\nดูเหมือนวาเราไมอาจพึ่งพาชาวโครแอตใหสนับสนุนเราไดอีกตอไป ซึ่งทําใหการปองกันพรมแดนติดกับเยอรมนียากลําบากเปนอยางยิ่ง"
 DOD_yugoslavia.10.a: "พวกทรยศ!"
 DOD_yugoslavia.10.b: "จริง ๆ แลวพวกเขาก็มีเหตุผล..."
 warning_we_will_change_to_this_country_tt: "§Rจะเปลี่ยนไปเลนเปน [CRO.GetNameDef]§!"
 YUG_CRO_independence_war_troops_tt: "§Yกองพลทหารมา[CRO.GetAdjective]§! หนึ่งกองพล และ§Yกองพลทหารราบ[CRO.GetAdjective]§! หากองพล จะเขารวมการลุกฮือ"
 DOD_yugoslavia.20.t: "[YUG.GetName] ขอซื้อเครื่องบิน"
 DOD_yugoslavia.20.desc: "เมื่อตระหนักถึงจุดออนทางยุทธศาสตร กองทัพอากาศ[YUG.GetAdjective]จึงเริ่มโครงการเรงดวนเพื่อปรับปรุงและขยายกําลังรบใหทันสมัย โดยไดกันเงินสํารองจํานวนมากไวสําหรับการจัดซื้อ คณะกรรมาธิการกําลังเดินทางไปทั่วยุโรปเพื่อหาแหลงจัดหาเครื่องบินขับไลและเครื่องบินทิ้งระเบิดขนาดกลางแหลงใหม\n\nดวยความเรงดวนของเรื่องนี้ ชาว[YUG.GetAdjective]จึงยืนกรานใหสงมอบทันทีหรือโอนเครื่องบินโดยตรงจากผูผลิต"
 DOD_yugoslavia.20.a: "อนุมัติการขายเครื่องบินขับไลจากกองหนุนของเรา"
 DOD_yugoslavia.20.b: "อนุมัติการขายเครื่องบินทิ้งระเบิดจากกองหนุนของเรา"
 DOD_yugoslavia.20.d: "โยกการผลิตเครื่องบินขับไลไปรองรับคําสั่งซื้อของพวกเขา"
 DOD_yugoslavia.20.e: "โยกการผลิตเครื่องบินทิ้งระเบิดไปรองรับคําสั่งซื้อของพวกเขา"
 DOD_yugoslavia.20.c: "เราไมมีอะไรจะแบงใหได"
 DOD_yugoslavia.21.t: "[From.GetNameDefCap] อนุมัติการขายเครื่องบินขับไล"
 DOD_yugoslavia.21.desc: "คณะกรรมาธิการจัดซื้อของเราใน [From.GetNameDef] ไดตกลงซื้อเครื่องบินขับไลจํานวนหนึ่งใหกองทัพอากาศของเราเรียบรอยแลว เครื่องบินชุดแรกมาถึงแลว และนักบินของเราไดเริ่มการฝกปรับเปลี่ยนแบบเครื่องบิน"
 DOD_yugoslavia.21.a: "ยอดเยี่ยม"
 DOD_yugoslavia.22.t: "[From.GetNameDefCap] อนุมัติการขายเครื่องบินทิ้งระเบิด"
 DOD_yugoslavia.22.desc: "คณะกรรมาธิการจัดซื้อของเราใน [From.GetNameDef] ไดตกลงซื้อเครื่องบินทิ้งระเบิดขนาดกลางจํานวนหนึ่งใหกองทัพอากาศของเราเรียบรอยแลว เครื่องบินชุดแรกมาถึงแลว และนักบินของเราไดเริ่มการฝกปรับเปลี่ยนแบบเครื่องบิน"
 DOD_yugoslavia.30.t: "ปญหาเรื่อง [YUG.GetNameDef]"
 DOD_yugoslavia.30.desc: "\nหลังจากออสเตรียกลับคืนสูไรช บัดนี้เรามีพรมแดนติดกับ [YUG.GetNameDef] รัฐบาลของ [YUG.GetLeader] คอนขางเงียบเฉยตอจุดยืนของตนเกี่ยวกับการจัดระเบียบยุโรปใหมที่เราเสนอ บางทีเราควรเตือนพวกเขาวาจะถึงเวลาที่พวกเขาตองเลือกขาง"
 DOD_yugoslavia.30.a: "บีบพวกเขาหนอย"
 DOD_yugoslavia.30.b: "ความเห็นของพวกเขาไมสําคัญ"
 DOD_yugoslavia.31.t: "แรงกดดันจากเยอรมนี"
 DOD_yugoslavia.31.desc: "เมื่อไมกี่วันกอน เอกอัครราชทูตเยอรมนีไดตอน [YUG.GetLeader] ในงานเลี้ยงรับรองทางการทูต เขาชี้วาหลังการผนวกออสเตรีย [YUG.GetNameDef] และ [GER.GetNameDef] ก็มีพรมแดนรวมกันแลว เอกอัครราชทูตยืนยันกับ [YUG.GetLeader] วาแนนอนวาเยอรมนีสนใจอยางยิ่งที่จะมีความสัมพันธฉันมิตร \n\nเขาขอเพียงใหเราคํานึงถึงเรื่องนี้เมื่อตัดสินใจเชิงนโยบายในอนาคต"
 DOD_yugoslavia.31.a: "ชางใจดีเสียจริง"
 DOD_yugoslavia.31.b: "เราตองรักษาความสัมพันธอันดีกับพวกเขาไว..."
 YUG_wavering_to_GER_pressure_opm: "หวั่นไหวตอแรงกดดันของเรา"
 YUG_wavering_to_GER_pressure_reverse_opm: "หวั่นไหวตอแรงกดดันของเยอรมนี"
 YUG_GER_pressured_us_annoyed_opm: "ขุนเคืองตอแรงกดดันทางการทูต"
 DOD_yugoslavia.32.desc: "เมื่อ [CZE.GetNameDef] หลุดออกไปจากสมการ ดุลอํานาจในยุโรปตะวันออกเฉียงใตก็เปลี่ยนไปอยางมาก อาวุธและเงินของเช็กเคยใชสนับสนุนหลายประเทศที่บัดนี้ตองหาผูอุปถัมภรายใหม บางทีถึงเวลาแลวที่จะเตือน [YUG.GetLeader] ถึงขอเท็จจริงนี้"
 DOD_yugoslavia.32.a: "บีบเขาหนอย"
 DOD_yugoslavia.32.b: "เรามีแผนอื่น"
 DOD_yugoslavia.33.desc: "เพียงไมกี่ชั่วโมงหลังกองทหารเยอรมันเขาสูปราก ขณะที่เอกอัครราชทูต[CZE.GetAdjective]ยังกลาวอําลาอยู เอกอัครราชทูตแหง [GER.GetNameDef] ก็มาเยือนกระทรวงการตางประเทศ \n\nเขากลาววารัฐบาลเยอรมนีเสียใจอยางยิ่งที่ตองใชมาตรการเชนนั้นใน [CZE.GetNameDef] และ [GER.GetLeader] ยินดีที่การกระทําของ [YUG.GetLeader] ไมไดใหเหตุผลใดที่ทําใหเขาตองพิจารณาดําเนินการเชนเดียวกันกับยูโกสลาเวีย\n\nเอกอัครราชทูตปดทายดวยการแสดงความหวังวาเรื่องจะยังคงเปนเชนนี้ตอไปในอนาคต"
 DOD_yugoslavia.33.a: "ชางใจดีเสียจริง"
 DOD_yugoslavia.33.b: "เรื่องเริ่มรายแรงแลว เราตองปราบปรามกลุมตอตานเยอรมันทันที!"
 DOD_yugoslavia.34.desc: "บัดนี้เราเปนใหญที่สุดในยุโรป ฝรั่งเศสเคยเปนรากฐานของเสถียรภาพในยุโรปตะวันออกเฉียงใตมานาน แตบัดนี้ทั้งภูมิภาคเปดกวางใหใครก็ไดเขายึดครอง เราสามารถดึงทุกชาติในภูมิภาคนั้นเขามาอยูในวงโคจรของเรา โดยไมเหลือใครหยุดเราได \n\nถึงเวลาบอกชาวยูโกสลาเวียแลววาพวกเขาตองเลือก จะยืนเคียงขางเรา - หรือจะถูกกวาดทิ้งไป"
 DOD_yugoslavia.34.a: "ความอดทนของเราตอพวกเขาใกลหมดแลว"
 DOD_yugoslavia.34.b: "เสือไมสนใจความเห็นของหนู"
 DOD_yugoslavia.35.desc: "ในการพบปะครั้งลาสุดที่แบรกฮอฟ [GER.GetLeader] และ [YUG.GetLeader] ไดหารือถึงสถานการณในยุโรปและบทบาทของเราในนั้น [GER.GetLeader] ยืนกรานวายูโกสลาเวียไมอาจหลีกเลี่ยงการเลือกขางในการตอสูเปนตายที่กําลังกอตัวอยูไกล ๆ ได และเยอรมนีก็ไมอาจทนใหมีประเทศที่ไมฝกใฝฝายใดอยูติดพรมแดนของตน \n\nเขาปดทายวา แทบจะดีกวาเสียอีกหากยูโกสลาเวียเลือกเขาขางฝายสัมพันธมิตร อยางนอยทุกคนจะไดรูวาใครยืนอยูตรงไหน"
 DOD_yugoslavia.35.a: "เวลากําลังจะหมด"
 DOD_yugoslavia.35.b: "ไม เราตองไมยอมเอาใจพวกเขาอีกแลว!"
 enemy_of_the_reich_opm: "ศัตรูแหงไรช"
 YUG_wavering_to_GER_pressure_2_opm: "หวั่นไหวตอแรงกดดันของเรา"
 YUG_wavering_to_GER_pressure_reverse_2_opm: "หวั่นไหวตอแรงกดดันของเยอรมนี"
 DOD_yugoslavia.36.t: "ชะตากรรมของยูโกสลาเวีย"
 DOD_yugoslavia.36.desc: "แมเราจะกดดันครั้งแลวครั้งเลาใหประกาศเขาขางฝายหนึ่ง รัฐบาลของ [YUG.GetLeader] ก็ยังยึดติดกับความคิดที่วายูโกสลาเวียจะนั่งดูความขัดแยงนี้อยูขางสนามได บัดนี้พวกเขาตองรับผลจากความขี้ขลาดของตน"
 DOD_yugoslavia.36.a: "ถาไมอยูขางเรา ก็คือศัตรูของเรา!"
 DOD_yugoslavia.36.b: "พวกเขาไมมีความสําคัญ และจะไมมีวันมีความสําคัญ"
 DOD_yugoslavia.40.desc: "ยูโกสลาเวียเปนหัวใจสําคัญของยุทธศาสตรบอลขานใหมของเรา จนถึงตอนนี้พวกเขายังไมผูกมัดกับฝายใด คาขายกับเยอรมนีแตก็ยังหางไกลจากการเขารวมฝายอักษะ เราควรเตือนพวกเขาวาเราจะไมยอมใหมีการคาขายกับศัตรูหากสงครามปะทุขึ้น"
 DOD_yugoslavia.40.a: "สงขาวถึงพวกเขาสักหนอย"
 DOD_yugoslavia.40.b: "เราไมอาจแทรกแซงกิจการของชาติอื่น"
 DOD_yugoslavia.41.t: "แรงกดดันจากอังกฤษ"
 DOD_yugoslavia.41.desc: "[ENG.GetLeader] เพิ่งประกาศการรุกทางการทูตในภูมิภาคบอลขาน สวนหนึ่งของความเคลื่อนไหวนี้คือการพบปะสวนตัวระหวางเขากับเอกอัครราชทูตของเราในลอนดอน ระหวางการพบปะ เขาไดสอบถามถึงจุดยืนของเราตอเยอรมนี เขาชี้วา [GER.GetNameDefCap] เปนปลายทางของสินคาสงออกที่ไมใชทรัพยากรของเราเปนสัดสวนสําคัญ และกลาวตอวาเราควรลดการพึ่งพาเยอรมนีลง"
 DOD_yugoslavia.41.a: "เราจะพิจารณา"
 DOD_yugoslavia.42.desc: "ความตกลงมิวนิกอาจหมายถึงสันติภาพในยุคของเรา - หรืออาจไมใชก็ได เยอรมนีไมใชประเทศเดียวที่ตองการขีดเสนพรมแดนยุโรปใหม รัฐบาลของ [YUG.GetLeader] เงียบอยางนาประหลาดใจตอชะตากรรมของผูจัดหาอาวุธรายหลักของตน\n\nเรื่องนี้ทําใหคนในวงการทูตไมนอยสงสัยวาชาวยูโกสลาเวียรูลวงหนาหรือไมวาจะเกิดอะไรขึ้น และอาจเห็นชอบดวยซํ้า \n\nเราควรพิจารณาเตือนพวกเขาวาขอตกลงใด ๆ กับเยอรมนีจะถือเปนการกระทําที่เปนปรปกษหากสงครามปะทุขึ้น"
 DOD_yugoslavia.42.a: "สงผูแทนพิเศษ"
 DOD_yugoslavia.42.b: "พวกเขาคงยังตกใจอยู"
 DOD_yugoslavia.43.desc: "ผูแทนพิเศษจากอังกฤษไดเดินทางมาถึงเพื่อหารือถึงความเห็นของเราตอความตกลงมิวนิก ดูเหมือนวา [ENG.GetLeader] หวังวาจะไดคําประกาศสนับสนุนที่หนักแนนกวานี้จากเราในชวงที่มีความหวาดกลัวสงครามระหวางการเจรจา เขาเตือนเราวาชะตากรรมของ [CZE.GetNameDef] ผูกติดกับชะตากรรมของเรา หาก [CZE.GetNameDef] ตกเปนของเยอรมนี เราจะพบวาตนเองโดดเดี่ยวบนภาคพื้นทวีปมากขึ้นเรื่อย ๆ"
 DOD_yugoslavia.43.a: "พวกเขาแคหาเบี้ยตัวใหม"
 DOD_yugoslavia.44.desc: "แมสงครามจะลุกโชนมาหลายเดือนแลว [YUG.GetLeader] ก็ยังปฏิเสธที่จะประกาศเขาขางฝายใด แถมยังคาขายกับเยอรมนีตอไปขณะยึดถือความเปนกลางอยางเครงครัด แมการสนับสนุนเยอรมนีของพวกเขาอาจยังไมสําคัญถึงขั้นวิกฤตในทันที แตเราตองตัดสินใจวาจะยอมใหพวกเขาสนับสนุนประเทศที่เรากําลังทําสงครามอยูหรือไม"
 DOD_yugoslavia.44.a: "พวกเขาตองเลือก"
 DOD_yugoslavia.44.b: "ความเปนกลางของพวกเขาเหมาะกับเรามากกวา"
 DOD_yugoslavia.45.desc: "วันนี้เอกอัครราชทูตอังกฤษมาเยือนกระทรวงการตางประเทศ เรียกรองใหชี้แจงวาเหตุใดเรายังคาขายกับเยอรมนี เราไดรับแจงวารัฐบาลอังกฤษถือวานี่เปนการกระทําที่เปนปรปกษ และจะพิจารณา 'มาตรการที่เหมาะสม' หากเราไมหยุดทันที"
 DOD_yugoslavia.45.a: "เราตองเลือก"
 YUG_if_we_dont_side_with_britain_within_a_year_warning_tt: "§Rหากเราไมเขาขางฝาย[ENG.GetAdjective]ภายในปหนา พวกเขาอาจมองเราเปนศัตรู§!"
 DOD_yugoslavia.46.desc: "ดูเหมือนแรงกดดันของเราตอยูโกสลาเวียจะไมไดผลตามที่ตั้งใจ แทนที่จะหยุดคาขายกับเยอรมนีหรือประกาศสนับสนุนฝายสัมพันธมิตร รัฐบาลของ [YUG.GetLeader] กลับยึดมั่นในความเปนกลางและไมยอมขยับ เมื่อเร็ว ๆ นี้ MI6 ไดรับรายงานวารัฐบาลยูโกสลาเวียกําลังพิจารณาใหสิทธิ์เยอรมนีเคลื่อนกําลังพลผานประเทศของตนไดอยางเสรี"
 DOD_yugoslavia.46.a: "พวกเขาก็เหมือนเปนศัตรูอยูแลว"
 DOD_yugoslavia.46.b: "ตอนนี้เราไมควรสรางศัตรูเพิ่ม"
 DOD_yugoslavia.181.t: "กระแสคอมมิวนิสตแพรขยายใน [This.GetNameDef]"
 DOD_yugoslavia.181.d: "ดวยการกอตั้งสภาแรงงานแพนสลาฟ ดูเหมือนวาชนชั้นแรงงาน[This.GetAdjective]จํานวนมากเริ่มสนับสนุนแนวคิดให [This.GetNameDef] เขารวมฝายในฐานะรัฐคอมมิวนิสตตามแบบอยางของ [From.GetNameDef] แมขณะนี้จะเปนเพียงขบวนการเล็ก ๆ แตเจาหนาที่[This.GetAdjective]หลายคนเกรงวาหากนักเคลื่อนไหวเหลานี้ไมถูกลงโทษโดยเร็วฐานเผยแพรแนวคิดนี้ [This.GetNameDef] อาจตองเผชิญการนัดหยุดงานทั่วประเทศ หรือแมแตการผงาดขึ้นของกองกําลังกึ่งทหารฝายซาย"
 DOD_yugoslavia.182.t: "โฆษณาชวนเชื่อแพนสลาฟ"
 DOD_yugoslavia.182.d: "ทั่วทั้งประเทศของเรา ผูสนับสนุนสภาแรงงานแพนสลาฟเริ่มประดับทองถนนของ [This.Capital.GetName] ดวยโปสเตอรและใบปลิวที่สงเสริมแบบอยางสังคมนิยมของ[From.GetAdjective] พวกเขายกยอง [From.GetLeader] และระบอบของเขา และเชื่อวารัฐบาล[This.GetAdjective]จะไดประโยชนจากการปฏิรูปสังคมแบบเดียวกับที่มีใน [From.GetNameDef] แมหลายคนจะสงสัยวานี่เปนความพยายามอยางอุกอาจของ [From.GetLeader] ที่จะบอนทําลายเอกราชของ[This.GetAdjective] แตก็ปฏิเสธไมไดวาโฆษณาชวนเชื่อนี้สงผลอยางมากตอทัศนคติของพลเมือง[This.GetAdjective]ทั่วไปที่มีตอแนวคิดคอมมิวนิสตและพันธมิตรบอลขานที่เปนหนึ่งเดียว"
 DOD_yugoslavia.183.t: "กองกําลังอาสาแพนบอลขาน"
 DOD_yugoslavia.183.d: "ขณะที่กระแสคอมมิวนิสตยังคงคุกรุนอยูในประเทศของเรา กลุมกึ่งทหารขนาดเล็กหลายกลุมก็เริ่มกอตัวขึ้นในหมูฝายซายจัดของประเทศ อาวุธที่พบดูเหมือนจะมีตนกําเนิดจากยูโกสลาเวีย และหลายคนสงสัยวา [From.GetLeader] และระบอบของเขามีแผนจะโคนรัฐบาล[This.GetAdjective] เพื่อตั้งรัฐบาลที่สอดคลองกับรัฐ[From.GetRulingIdeology]แหงใหมของเขามากกวา"
 DOD_yugoslavia.183.a: "เราควรระมัดระวังใหดี"
 DOD_yugoslavia.184.t: "กลุมติดอาวุธคอมมิวนิสตเรียกรองใหเปลี่ยนระบอบ"
 DOD_yugoslavia.184.d: "ความตึงเครียดระหวางรัฐบาล[This.GetAdjective]กับชาวนาไดถึงจุดเดือด โดยกลุมติดอาวุธฝายซายจํานวนมากทั่วประเทศไดติดอาวุธใหตนเองดวยอาวุธที่เชื่อวาไดมาจาก [From.GetNameDef] บัดนี้ชาวนาเรียกรองให [This.GetLeader] สละอํานาจและมอบอํานาจนั้นใหแกประชาชนที่เขาอางวาเปนตัวแทน ขอเรียกรองของพวกเขาแฝงคําเตือนวา หากไมทําตาม ชาวนาจะจับอาวุธขึ้นสูในนามของรัฐบาล[From.GetRulingIdeology]ชุดใหม"
 DOD_yugoslavia.184.a: "หากนั่นคือสิ่งที่ประชาชนตองการ..."
 DOD_yugoslavia.184.b: "กวาดลางพวกชาวนาที่ทนไมไดพวกนี้ใหสิ้นซาก!"
 DOD_yugoslavia.50.t: "งานกาลาที่กรอสเวเนอร"
 DOD_yugoslavia.50.desc: "ประเด็นเรื่องการอภิเษกสมรสและการสืบราชสันตติวงศใน [YUG.GetName] เปนที่พูดถึงในหมูชนชั้นการเมืองมานาน ระยะเวลาที่เราไมมีกษัตริยที่ชอบธรรมบนบัลลังกทําใหบางคนตั้งคําถามถึงความชอบธรรมของการปกครองของราชวงศคาราจอรเจวิช อยางไรก็ตาม ในงานกาลาเมื่อไมนานมานี้ที่ลอนดอน พระเจาปเตอรผูทรงพระเยาวไดทรงตกหลุมรักสตรีสูงศักดิ์ผูงดงามนางหนึ่ง สมาชิกคณะรัฐมนตรีในราชสํานักตางเริ่มหารือแผนการอภิเษกสมรสเพื่อสานตอความรักของกษัตริยแลว ไมตองสงสัยเลยวาผูที่พระองคอภิเษกสมรสดวยจะสงผลทางการทูตตอประเทศของเราอยางยาวนาน และอาจมีอิทธิพลวาประเทศใดบางที่ยินดีจะเปนพันธมิตรกับยูโกสลาเวีย"
 DOD_yugoslavia.50.a: "เจาหญิงอเล็กซานดราแหงกรีซทรงครองพระทัยกษัตริย"
 DOD_yugoslavia.50.b: "เจาหญิงมาเรีย ฟรันเชสกาแหงอิตาลี"
 DOD_yugoslavia.50.c: "เจาหญิงอเล็กซานดรีนแหงเยอรมนี"
 DOD_yugoslavia.50.d: "อาเดลไฮด ฟอน ฮาพสบวรค"
 DOD_yugoslavia.50.e: "เจาหญิงมารี-ฟร็องซัวสแหงสเปน"
 DOD_yugoslavia.501.t: "[From.GetNameDefCap] แสวงหาราชินี"
 DOD_yugoslavia.501.desc: "ราชวงศคาราจอรเจวิชแหง [From.GetNameDef] ปรารถนาจะสืบตอทั้งราชสกุลและชาติของตนผานการอภิเษกสมรส ดูเหมือนวา [From.GetLeader] จะหลงใหล [Root.GetPrincessName] เชื้อพระวงศแหงราชวงศ[Root.GetFamilyName] เปนอยางมาก และไดทูลขอเธออภิเษกสมรส หากหญิงสาวตอบรับ [From.GetNameDef] และ [Root.GetNameDef] จะผูกพันกันทางสายเลือด แมจะไมนําไปสูพันธมิตร[From.GetAdjective]-[Root.GetAdjective]ในทันที แตก็จะผลักดันใหสิ่งนั้นเปนไปไดในอนาคตอันใกล"
 DOD_yugoslavia.501.a: "งานอภิเษกสมรสฟงดูวิเศษยิ่งนัก!"
 DOD_yugoslavia.501.b: "[Root.GetPrincessName] จะไมมีวันอภิเษกสมรสกับ [From.GetLeader]!"
 italian_princess_name: "เจาหญิงมาเรีย"
 german_princess_name: "เจาหญิงอเล็กซานดรีน"
 hungarian_princess_name: "อารชดัชเชสอาเดลไฮด"
 spanish_princess_name: "เจาหญิงมารี-ฟร็องซัวส"
 italian_dynasty_name: "ซาวอย"
 german_dynasty_name: "โฮเฮนโซลเลิรน"
 hungarian_dynasty_name: "ฮาพสบวรค"
 spanish_dynasty_name: "บูรบง"
 DOD_yugoslavia.19.t: "พระเจาปเตอรทรงบรรลุนิติภาวะ!"
 DOD_yugoslavia.19.desc: "ดวยสถานการณอันเลวรายของความขัดแยงทั่วโลกที่ทําใหตองเสด็จขึ้นครองราชยกอนวัยอันควร บัดนี้พระเจา[Root.GetLeader]ทรงบรรลุนิติภาวะแลว และทรงพิสูจนวาเปนผูนําที่ทรงพระปรีชาและมีความสามารถ เมื่อมีรัชทายาทโดยชอบธรรมที่ทรงพระชนมายุเหมาะสมบนบัลลังก ประชาชนแหง [YUG.GetNameDef] จึงมีสัญลักษณแหงอัตลักษณของชาติใหรวมใจและตอสูเพื่อในที่สุด"
 DOD_yugoslavia.19.a: "ทรงพระเจริญ!"
 DOD_yugoslavia.502.t: "[From.GetPrincessName] ตอบรับ!"
 DOD_yugoslavia.502.desc: "พระเจา[Root.GetLeader]ผูทรงพระเยาวไดประกาศความรักและความภักดีตอ [From.GetPrincessName] ตอสาธารณะผานพันธะศักดิ์สิทธิ์แหงการอภิเษกสมรส ในพิธีที่จัดขึ้นที่ [Root.GetLondonBelgrade] ทามกลางเสียงโหรองยินดีของฝูงชนที่ไดเปนประจักษพยานความรักราวเทพนิยายของคูรักที่ไดมาพบกันในยามวิกฤต [Root.GetWeddingGoodBad] แมการอภิเษกสมรสครั้งนี้จะไมไดกอตั้งพันธมิตร[yugoslavia_wedding_partner.GetAdjective]-[Root.GetAdjective]อยางเปนทางการ แต ณ จุดนี้ดูเหมือนแนนอนแลววาความรวมมือระหวางชาติเหลานี้จะไมจบลงเพียงเทานี้"
 DOD_yugoslavia.502.a: "ชางโรแมนติก!"
 YUG_wedding_bad: "อยางไรก็ตาม ที่บานเกิดใน [Root.GetNameDef] พระมหากษัตริยหนุมกําลังเผชิญคําวิจารณอยางหนักจากสื่อ[Root.GetAdjective]สายอนุรักษนิยม ที่ทรงเลือกอภิเษกสมรสในชวงที่ชาติกําลังเผชิญวิกฤตครั้งใหญ"
 YUG_wedding_good: "จากเบลเกรดถึงบูคาเรสต ทั่วทั้งบอลขานตางรวมเฉลิมฉลองความเพียรพยายามของพระมหากษัตริย[Root.GetAdjective]ทามกลางหายนะที่คืบคลานเขามา"
 DOD_yugoslavia.503.t: "[From.GetPrincessName] ปฏิเสธ!"
 DOD_yugoslavia.503.desc: "แมพระเจา[Root.GetLeader]จะทรงยืนยันวาความรักของพระองคเปนของแท แตเจาหญิงตางแดนในฝนของพระองคก็ไมไดหวั่นไหวไปกับความหลงใหลนั้น หลังการเกี้ยวพาราสีอยางเขมขนหลายสัปดาห [From.GetPrincessName] ไดปฏิเสธการขออภิเษกสมรสของกษัตริย และการตัดสินใจของเธอยังไดรับการเห็นชอบตอสาธารณะจากรัฐบาล[From.GetAdjective]ดวย แมจะทรงอกหักอยางเห็นไดชัด แตกษัตริยยังทรงตั้งมั่นวาวันหนึ่งจะทรงหาราชินีที่เหมาะสมสําหรับราชอาณาจักรของพระองคได"
 DOD_yugoslavia.503.a: "บางทีเจาหญิงอเล็กซานดราผูออนโยน..."
 DOD_yugoslavia.60.t: "พระราชพิธีบรมราชาภิเษก"
 DOD_yugoslavia.60.peter: "เปนครั้งแรกนับตั้งแตรุงอรุณแหงศตวรรษที่ 20 ที่ [YUG.GetNameDef] ไดเห็นพระมหากษัตริยของตนเขาพิธีบรมราชาภิเษก ณ มหาวิหารแหงเบลเกรด ในพิธีที่คอนขางเปนแบบฆราวาส สะทอนถึงความหลากหลายทางศาสนาในรัฐยูโกสลาฟยุคใหม แมบางคนจะโตแยงความสามารถในการปกครองของพระเจาปเตอรที่ยังทรงพระเยาว แตบัดนี้มงกุฎไดอยูบนพระเศียรของพระองคแลว และไมวาดีหรือราย อนาคตของยูโกสลาเวียก็อยูในหัตถของ[YUG.GetLeader.GetHerHis]"
 DOD_yugoslavia.60.paul: "เปนครั้งแรกนับตั้งแตรุงอรุณแหงศตวรรษที่ 20 ที่ [YUG.GetNameDef] ไดเห็นพระมหากษัตริยของตนเขาพิธีบรมราชาภิเษก ณ มหาวิหารแหงเบลเกรด ในพิธีตามธรรมเนียมเซอรเบียนออรทอดอกซ แมหลายคนยังมองวาพระเจาพอลเปนผูชิงราชบัลลังก และเปนจอมเผด็จการฟาสซิสตมากกวากษัตริยที่คูควร แตบัดนี้มงกุฎไดอยูบนพระเศียรของพระองคแลว และไมวาดีหรือราย อนาคตของยูโกสลาเวียก็อยูในหัตถของ[YUG.GetLeader.GetHerHis]"
 DOD_yugoslavia.60.a: "ทรงพระเจริญ!"
 DOD_yugoslavia.70.t: "[FROM.GetNameDefCap] ตองการลงนามกติกาสัญญาไตรภาคี"
 DOD_yugoslavia.70.desc: "วันนี้มีโทรเลขจาก [From.GetLeader] มาถึง [Root.Capital.GetName] แสดงความสนใจจะลงนามกติกาสัญญาไมรุกรานกับมหาอํานาจฟาสซิสตของโลก ดวยความหวาดกลัวการรุกรานของ[SOV.GetAdjective] และกระแสชาตินิยมที่เพิ่มขึ้นภายในประเทศของ[From.GetLeader.GetHerHis] [From.GetLeader] จึงตองการให[From.GetLeader.GetHerselfHimself]เขาขาง [Root.GetNameDef] แมนี่จะไมไดหมายถึงพันธมิตรอยางเปนทางการ แตก็นํา [From.GetNameDef] เขามาอยูในเขตอิทธิพลของเรา และจะเรงกระบวนการที่[From.GetAdjective]จะเขารวม [Root.GetFactionName]"
 DOD_yugoslavia.70.a: "เราเห็นดวย"
 DOD_yugoslavia.70.b: "เรามีวิสัยทัศนอื่นสําหรับ [FROM.GetNameDef]"
 DOD_yugoslavia.701.t: "[FROM.GetNameDefCap] คัดคาน!"
 DOD_yugoslavia.701.tripartite_rejection: "[FROM.GetLeader] ตอบขอเสนอของ[ROOT.GetAdjective]ใหลงนามกติกาสัญญาไตรภาคีดวยการปดตก โดยระบุวาพวกเขามี “ความคิดอื่น” สําหรับอนาคตของรัฐเรา"
 DOD_yugoslavia.701.allied_objection: "การตัดสินใจลงนามกติกาสัญญาไตรภาคีกอใหเกิดขอถกเถียงอยางรุนแรงทั้งภายในและภายนอกประเทศ และทําใหเกิดคําถามถึงความชอบธรรมของสิทธิ์ที่ [ROOT.GetLeader] จะเปนผูสําเร็จราชการแทนพระเจาปเตอรที่ 2 หรือแมกระทั่งวาจําเปนตองมีผูสําเร็จราชการหรือไม นายทหารกลุมหนึ่งจากกองทัพบกหลวงยูโกสลาเวียไดประกาศใหพระเจาปเตอรที่ 2 บรรลุนิติภาวะ และดวยการสนับสนุนของ[From.GetAdjective] ไดยกกําลังเขาเบลเกรดและเรียกรองใหปลด [ROOT.GetLeader] ออกจากอํานาจทันที"
 DOD_yugoslavia.701.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 DOD_yugoslavia.701.b: "จับอาวุธ!"
 DOD_yugoslavia.702.t: "[YUG.GetNameDefCap] ลงนามกติกาสัญญาไตรภาคี"
 DOD_yugoslavia.702.desc: "วันนี้รัฐบาล[YUG.GetAdjective]ไดรวมกับชาติฟาสซิสตลงนามในกติกาสัญญาไตรภาคี แมนี่ยังไมไดหมายความวา [YUG.GetNameDef] เขารวม [From.GetFactionName] แลว แตก็แสดงถึงความภักดีตอกันที่เพิ่มขึ้นระหวางสองชาติ และวา [YUG.GetLeader] อาจมีใจเอนเอียงไปทางฟาสซิสต หลายคนคาดวา[Root.GetAdjective]จะตอบโตพัฒนาการที่นากังวลนี้ แตจนถึงตอนนี้ [Root.GetLeader] ยังคงนิ่งเงียบในเรื่องนี้…"
 DOD_yugoslavia.702.a: "[YUG.GetLeader] เปนคนขี้ขลาดที่ไรความชอบธรรม!"
 DOD_yugoslavia.702.b: "ไมเห็นตองใสใจ"
 DOD_yugoslavia.80.t: "ซาราแลกพันธมิตร"
 DOD_yugoslavia.80.desc: "วันนี้ [From.GetLeader] ประกาศวา [From.GetNameDef] ยินดีจะเขาขาง [Root.GetNameDef] และเขารวม [Root.GetFactionName] อยางเปนทางการ แตตองแลกกับการที่เราถอนตัวจากบอลขาน ดวยการสละการควบคุม [163.GetName]"
 DOD_yugoslavia.80.a: "ฟงดูยุติธรรม"
 DOD_yugoslavia.80.b: "พวกเขาควรสละ [103.GetName] แทน"
 DOD_yugoslavia.801.t: "[From.GetNameDefCap] เรียกรอง [103.GetName]!"
 DOD_yugoslavia.801.desc: "ดูเหมือนคณะผูแทนของเราจะไมไดรับการตอนรับที่ดีนักใน [From.GetNameDef] เพราะเอกอัครราชทูตกลับตอบโตดวยการเรียกรอง [103.GetName] จากเราเพื่อแลกกับการเปนสมาชิก [From.GetFactionName]"
 DOD_yugoslavia.801.a: "ก็ได..."
 DOD_yugoslavia.801.b: "ไมมีทาง"
 DOD_yugoslavia.802.t: "[From.GetNameDefCap] ยอมรับ!"
 DOD_yugoslavia.802.desc: "ความขัดแยงตามแนวพรมแดนกับ [From.GetNameDef] จะไดรับการแกไขในที่สุด เมื่อรัฐบาล[From.GetAdjective]ตกลงคืนดินแดนดัลมาเชียที่อยูใตการยึดครองของ[From.GetAdjective]ใหกลับคืนสูผูปกครองยูโกสลาฟโดยชอบธรรม วันนี้ [Root.GetLeader] ไดประกาศวา [From.GetLeader] เปนมิตรแทของเสรีภาพและการกําหนดชะตากรรมตนเองของ[Root.GetAdjective] และบัดนี้ทั้งสองชาติจะกาวตอไปในฐานะพันธมิตร"
 DOD_yugoslavia.802.a: "เปนไปตามแผนทุกประการ"
 czech.1.t: "การเปนสมาชิกโคมินเทิรน"
 czech.1.d: "ความสัมพันธของเรากับชาวเช็กในอดีตไมคอยราบรื่นนัก แตเมื่อไมนานมานี้การเมืองของพวกเขาไดหักเลี้ยวไปสูฝงที่ถูกตองของประวัติศาสตรอยางฉับพลัน ประกอบกับแรงกดดันที่เพิ่มขึ้นจากเยอรมนีและการขาดความเชื่อมั่นวาประชาธิปไตยตะวันตกจะปกปองพวกเขาได ทําใหมีคําขออยางเปนทางการเพื่อเขารวมโคมินเทิรน"
 czech.1.a: "ยินดีตอนรับอยางยิ่ง"
 czech.1.b: "พวกเขายังไมพรอม"
 czech.2.d: "[SOV.GetLeader] ยอมรับคําขอของเราที่จะเขารวมโคมินเทิรนแลว คณะผูแทนของเราไดเขารวมคณะกรรมการบริหารพรอมสิทธิ์ออกเสียงเต็มที่"
 czech.3.d: "[SOV.GetLeader] ปฏิเสธคําขอของเราที่จะเขารวมโคมินเทิรน โดยไมใหเหตุผลใด ๆ"
 czech.3.a: "สายสัมพันธสลาฟของเราก็มีคาแคนี้เอง..."
 czech.4.t: "ปญหาโรมาเนีย"
 czech.4.d: "ความสัมพันธกับโรมาเนียตึงเครียดมาตลอดเพราะพวกเขายึดครองเบสซาราเบียซึ่งเปนดินแดนโดยชอบธรรมของเรา และราวกับวานั่นยังไมพอ ทั้งประเทศนั้นยังขวางกั้นไมใหเราไปชวยพันธมิตร[From.GetNameAdj]ของเราได บัดนี้พันธมิตรเหลานั้นไดเสนอทางออก: แบงโรมาเนียระหวางเราเพื่อแกปญหานี้ใหจบสิ้นไปเสียที!"
 czech.4.a: "เรียบงายแตยอดเยี่ยม"
 czech.4.b: "เราจะหาทางออกอื่น"
 czech.5.d: "[From.GetNameDefCap] เห็นชอบกับทางออกปญหาโรมาเนียของเราแลว กองทัพพรอมแลว และการทัพเริ่มไดตามที่เราเห็นสมควร"
 czech.6.d: "[From.GetLeader] ปฏิเสธขอเสนอของเราเกี่ยวกับปญหาโรมาเนีย ดูเหมือนวาเขายังมีแผนสําหรับโรมาเนียอยู"
 czech.6.a: "ก็คุมที่จะลองดู"
 czech.7.t: "สถานการณโปแลนด"
 czech.7.d: "นับตั้งแตเริ่มภารกิจปลดปลอยแรงงานทั่วโลกของเรา โปแลนดก็สรางแตปญหามาตลอด บัดนี้พันธมิตร[From.GetNameAdj]ของเราไดเสนอขอเสนอที่นาสนใจ: โปแลนดไดยึดดินแดนจากทั้งสองชาติของเรา แลวทําไมไมตอบแทนดวยการแบงโปแลนดกันเสียเลยละ?"
 czech.7.a: "จริงสิ ทําไมจะไมได"
 czech.8.d: "[From.GetNameDefCap] เห็นชอบกับทางออกสถานการณโปแลนดที่เราเสนอแลว เราจะเริ่มปฏิบัติการทันทีที่มีคําสั่ง"
 czech.9.d: "[From.GetNameDefCap] ไมเห็นชอบกับขอเสนอของเรา เราตองรอจังหวะและพิจารณาทางเลือกอื่น"
 czech.10.d: "นับตั้งแตมหาสงครามสิ้นสุดลง โปแลนดไดยึดครองดินแดนเยอรมัน และราวกับวานั่นยังไมพอ พวกเขายังโจมตีเพื่อนบานอยูตลอดเพื่อขยายดินแดนอยางกาวราว พันธมิตร[From.GetNameAdj]ของเราไดขอสรุปเดียวกับเรา: เพื่อรับประกันสันติภาพในยุโรป รัฐโปแลนดจะตองถูกกําจัด"
 czech.10.a: "ลงมือกันเลย"
 czech.11.d: "[From.GetNameDefCap] เห็นชอบกับแผนจัดการสถานการณโปแลนดของเราแลว เราสามารถโจมตีไดทันทีที่การเตรียมการเสร็จสิ้น"
 czech.12.d: "[From.GetNameDefCap] ปฏิเสธทางออกสถานการณโปแลนดของเรา เวลาจะเปนเครื่องพิสูจนวาจะมีโอกาสอื่นเกิดขึ้นหรือไม"
 czech.14.t: "กบฏสโลวัก"
 czech.14.d: "นับตั้งแตเราปลดพวกเขาออกจากรัฐบาล ผูนําสโลวักก็คุกรุนดวยความแคนและปลุกระดมประชาชนใหใชความรุนแรง วันนี้ถอยคําของพวกเขาก็ประสบผลในการกอสงครามที่พวกเขาปรารถนานักหนา การกบฏสโลวักไดเริ่มขึ้นแลว"
 czech.14.a: "ถาพวกเขาตองการสงคราม ก็จะไดสงคราม"
 czech.15.d: "ที่มั่นสุดทายของอํานาจสโลวักถูกบดขยี้แลว การกบฏสิ้นสุดลง"
 czech.15.a: "ชัยชนะ!"
 czech.16.t: "ชาวเช็กในฝายอักษะ?"
 czech.16.d: "แมจะลังเลในตอนแรก แตชาวเช็กก็เริ่มมองวาลัทธิบอลเชวิคเปนภัยคุกคามที่ใกลตัวจริง ๆ และบัดนี้ไดขอเขารวมฝายอักษะ รัฐบาลของ [CZE.GetLeader] ระบุไวโดยเฉพาะวาเรื่องนี้ไมสงผลตอประเด็นซูเดเทินแลนดแตอยางใด"
 czech.17.d: "[From.GetNameDefCap] ยอมรับคําขอของเราที่จะเขารวมฝายอักษะ!"
 czech.17.a: "ยอดเยี่ยม!"
 czech.18.d: "[From.GetNameDefCap] ปฏิเสธคําขอของเราที่จะเขารวมฝายอักษะ!"
 czech.18.a: "ยุงยากจริง"
 czech.19.t: "ยอมเสียศักดิ์ศรีดีกวาตาย"
 czech.19.d: "รัฐบาลของ [From.GetLeader] ไดตระหนักในสิ่งที่เรารูมาตลอด: [From.GetNameDef] จะดํารงอยูตอไปไดก็ภายใตการคุมครองของเราเทานั้น แมจะทําใหเราไมอาจยึดครองดินแดนของพวกเขาโดยตรง แตการมีพันธมิตรที่เต็มใจอาจดีกวา และยังปองกันการแทรกแซงจากตางชาติดวย"
 czech.20.t: "ยอมเสียศักดิ์ศรีดีกวาตาย"
 czech.20.d: "[From.GetLeader] ยอมรับขอเสนอของเราแลว ผูแทนผูมีอํานาจเต็มของ[From.GetAdjective]ไดเดินทางถึงปรากเพื่อประสานนโยบาย"
 czech.20.a: "นี่เปนทางเดียว"
 czech.21.t: "ยอมเสียศักดิ์ศรีดีกวาตาย"
 czech.21.d: "มีรายงานวาเมื่อไดรับขอเสนอของเรา [From.GetLeader] ไดอุทานวา "พันปก็ไมมีทาง!" กอนจะระเบิดถอยคํายืดยาวถึงความดอยกวาของประชาชนเรา ระบบการปกครองของเรา และคุณสมบัติความเปนผูนําของ [CZE.GetLeader] ยังไมมีการปฏิเสธอยางเปนทางการ แตเอกอัครราชทูตของเราแทบไมมีความหวัง"
 czech.21.a: "บางทีอาจดีแลวก็ได"
 czech.22.t: "ปญหาซูเดเทิน"
 czech.22.d: "รัฐบาลแหง [From.GetNameDef] เสนอซูเดเทินแลนดใหเปนกาวแรกสูความเขาใจรวมกัน ดานหนึ่ง นี่เปนโอกาสดีที่จะไดรัฐอันมั่งคั่งมาดวยตนทุนและความเสี่ยงเพียงเล็กนอย อีกดานหนึ่ง การสรางวิกฤตเรื่องซูเดเทินแลนดจะเปนโอกาสอันยอดเยี่ยมที่จะแสดงใหโลกเห็นวาพวกที่เรียกตัวเองวามหาอํานาจซึ่งคํ้าจุนสนธิสัญญาแวรซายนั้นไรเขี้ยวเล็บและดอยกวาทางศีลธรรม"
 czech.23.d: "[From.GetNameDefCap] ยอมรับขอเสนอของเราแลว กองทหาร[From.GetAdjective]ไดเคลื่อนเขาสูซูเดเทินแลนดทามกลางเสียงโหรองยินดีของประชาชนทองถิ่น"
 czech.23.a: "พวกเขาคงไมขออะไรมากกวานี้แลวละ"
 czech.24.d: "[From.GetLeader] ปฏิเสธขอเสนอของเราที่จะยกซูเดเทินแลนดให เขาไมไดใหเหตุผลใด ๆ แตการตัดสินใจของ[From.GetAdjective]ไดสรางความตื่นตะลึงไปทั่วกองทัพ ซึ่งเชื่อวาเยอรมันอาจมีแผนการที่ใหญกวานั้นสําหรับเรา"
 czech.24.a: "รอดูกันไป"
 czech.25.t: "ยูโกสลาเวียในความตกลงไตรภาคี"
 czech.25.d: "รัฐบาลแหง [From.GetNameDef] ตัดสินใจยืนยันพันธมิตร 'ความตกลงไตรภาคีนอย' (Little Entente) อีกครั้ง หลังจากที่เสื่อมถอยไปในชวงไมกี่ปที่ผานมาทามกลางอิทธิพลที่เพิ่มขึ้นของเยอรมนี รัฐมนตรีตางประเทศของพวกเขาเพิ่งมาเยือนเมืองหลวงของเราเพื่อหารือวาเราสนใจจะเขารวมพันธมิตรในฐานะสมาชิกถาวรหรือไม"
 czech.26.d: "[From.GetName] ตกลงเขารวมความตกลงไตรภาคีแลว คณะผูแทนทางทหารไดเดินทางมาถึงเพื่อหารือการจัดเตรียมดานการปองกัน"
 czech.27.d: "แม [From.GetLeader] จะตกลงพบคณะผูแทนของเรา แตจนถึงตอนนี้เขายังปฏิเสธที่จะผูกมัดประเทศของตนใหเขารวมความตกลงไตรภาคี ชาว[From.GetAdjective]ดูจะกังวลวาการเขารวมพันธมิตรของเราอาจทําลายดุลอํานาจอันละเอียดออนในภูมิภาค"
 czech.28.t: "โรมาเนียในความตกลงไตรภาคี"
 czech.32.t: "การปรองดองเช็ก-ฮังการี"
 czech.32.d: "ความตกลงไตรภาคีที่นําโดย [From.GetNameDef] มีเปาหมายเพื่อปดลอมชาติของเรามานาน อยางไรก็ตาม เมื่ออํานาจของเยอรมนีเติบโตขึ้น [From.GetNameDef] ก็รูสึกถูกคุกคามจากทิศทางนั้นมากขึ้นเรื่อย ๆ ดวยไมตองการเผชิญภัยคุกคามสองดาน [From.GetLeader] จึงแสวงหาความเขาใจรวมกับเรา \n\nรัฐบาลของเราแตกเปนสองฝายในประเด็นนี้ ฝายหนึ่งเชื่อวาขอตกลงกับ [From.GetNameDef] เปนกาวแรกสูการทลายวงลอม ขณะที่อีกฝายชี้วาเรื่องนี้จะตองเรียกโทสะของ [GER.GetLeader] อยางไมตองสงสัย"
 czech.32.a: "เรายอมรับขอเสนอของพวกเขา"
 czech.32.b: "ไมมีวัน!"
 czech.33.d: "[From.GetLeader] เปดรับขอเสนอของเราอยางนาประหลาดใจ เราไดลงนามในสนธิสัญญามิตรภาพรวมกัน ยืนยันวาทั้งสองฝายไมมีการอางสิทธิ์ดินแดนใดตอกัน"
 czech.33.a: "ดีกวาที่คาด!"
 czech.34.d: "ไมคอยมีใครแปลกใจ [From.GetLeader] ปฏิเสธขอเสนอของเรา โดยอางวาเราไมยอมยกดินแดนบางสวนใหฮังการี"
 czech.34.a: "ก็ไมมีอะไรใหม"
 dod_news.1.t: "ยืนยันความตกลงไตรภาคีนอยอีกครั้ง"
 dod_news.1.d: "วันนี้ [From.GetName] ประกาศวาระบบพันธมิตร 'ความตกลงไตรภาคีนอย' ที่แทบจะสิ้นสภาพไปแลวจะยืนหยัดตามพันธะของตน แถลงการณที่เผยแพรโดยกระทรวงการตางประเทศ[From.GetNameAdj]ระบุวา:\n'[From.GetName] ไมใชมหาอํานาจ แตเปนมหาอํานาจระดับภูมิภาค เราเชื่อมั่นวาพันธมิตรของมหาอํานาจระดับภูมิภาคสามารถและจะปองกันไมใหพวกที่เรียกตัวเองวามหาอํานาจเขามาแทรกแซงกิจการของเรา"
 dod_news.1.a: "เมื่อรวมกัน เราคือมหาอํานาจ"
 dod_news.1.b: "ขอเสนอแนะที่นาสนใจ"
 dod_news.1.c: "เรายังไมลืมวามันถูกตั้งขึ้นมาเพื่อตอตานใคร"
 dod_news.1.e: "ถาจําเปน เราก็จะจัดการพวกเขาไดอยางรวดเร็วอยูดี"
 dod_news.1.f: "พัฒนาการที่นาทึ่ง!"
 dod_news.2.a: "เราจะสูเคียงขางพันธมิตรใหมของเราจนถึงที่สุด"
 dod_news.2.b: "พวกเขาเลือกไดอยางชาญฉลาด"
 dod_news.2.c: "ขาวที่นากังวลอยางยิ่ง..."
 dod_news.2.t: "[CZE.GetName] เขารวมฝายอักษะ"
 dod_news.2.d: "[CZE.GetName] ไดลงนามสนธิสัญญาพันธมิตรกับ [GER.GetNameDef] สรางความตกตะลึงไปทั่วยุโรป [CZE.GetName] ซึ่งเคยเปนประชาธิปไตยอยางเขมแข็ง ไดเคลื่อนไปทางขวามากขึ้นเรื่อย ๆ ในชวงหลายเดือนที่ผานมา"
 dod_news.3.t: "[CZE.GetName] เขารวมโคมินเทิรน"
 dod_news.3.d: "[CZE.GetName] ไดลงนามสนธิสัญญาพันธมิตรกับ [SOV.GetNameDef] สรางความตกตะลึงไปทั่วยุโรป [CZE.GetName] ซึ่งเคยเปนประชาธิปไตยอยางเขมแข็ง ไดเคลื่อนไปทางซายมากขึ้นเรื่อย ๆ ในชวงหลายเดือนที่ผานมา"
 dod_news.4.t: "[CZE.GetName] ยอมยกซูเดเทินแลนด"
 dod_news.4.d: "ในความเคลื่อนไหวที่สรางความประหลาดใจใหหลายฝาย วันนี้ [CZE.GetName] ไดยอมยกภูมิภาคซูเดเทินแลนดใหเยอรมนีฝายเดียว เมื่อถูกถาม แหลงขาวในกระทรวงการตางประเทศ [CZE.GetName] ตอบวา 'เห็นไดชัดวาลมพัดไปทางไหน นี่เปนหนทางเดียวที่ชาติจะอยูรอด' \n\nมีรายงานวารัฐมนตรีฝรั่งเศสผูไมประสงคออกนามคนหนึ่งไดประณามการกระทําของ[CZE.GetNameAdj] โดยอางวาฝายตะวันตกจะสนับสนุน [CZE.GetName] หากเยอรมนีกดดันพวกเขา"
 dod_news.4.a: "ไมมีทางเลือกอื่นแลว"
 dod_news.4.b: "ดวยการมองการณไกล พวกเขาไดปองกันวิกฤตไว"
 dod_news.4.c: "พวกเขาเลือกไดอยางชาญฉลาด"
 dod_news.4.e: "เรานาจะทําอะไรไดบางหรือเปลา?"
 DOD_romania.999.t: "บรรณาการแดความรัก"
 DOD_romania.999.desc: "พระเจาคาโรลที่ 2 ซึ่งเมามายและอารมณออนไหวเปนพิเศษ ไดยึดการประชุมยุทธศาสตรวันนี้ เรียกความสนใจจากทุกคนไปยังความคิด 'อันยอดเยี่ยม' ที่ทรงคิดไดเมื่อคืนกอน\n\nดวยความเปนคนโรแมนติกโดยแท กษัตริยทรงประกาศทั้งนํ้าตาวาทรงปรารถนาใหสตรีในชีวิตของพระองคไดรับรูถึงความรักอันลึกซึ้งและแทจริงที่ทรงมีตอพวกเธอ พระองคตรัสกับเสนาธิการและคณะรัฐมนตรีเปนบทพูดยืดยาวแมจะคอนขางลิ้นพันกัน วิงวอนตอความรูสึกอันออนโยนและจริงใจที่สุดของพวกเขา กอนจะปดทายดวยการเรียกรองอยางจริงจังใหเปลี่ยนชื่อเมืองใหญสองเมืองของศัตรู เพื่อเปนบรรณาการแดความรูสึกที่ยิ่งใหญและลึกซึ้งที่สุดที่มนุษยรูจัก นั่นคือความรัก\n\nเห็นไดชัดวากษัตริยทรงหมกมุนกับความคิดนี้อยางสิ้นเชิง และแทบเปนไปไมไดที่จะทรงยอมเปลี่ยนพระทัยงาย ๆ หากเราตองการทัดทาน"
 DOD_romania.a: "พระองคทรงเปนอัจฉริยะที่จุติลงมาจากสวรรคโดยแท!"
 DOD_romania.b: "จัดงานเลี้ยงเบี่ยงเบนความสนใจแทน งานใหญ -จริง ๆ- ไปเลย"
 DOD_romania.16.t: "[FROM.GetNameDefCap] ตองการเขารวม [ROOT.GetFactionName]"
 DOD_romania.16.desc: "แมปจจุบันจะเปนพันธมิตรกับ [romania_former_ally_target.GetNameDef] แตความเปลี่ยนแปลงภายในรัฐบาล[FROM.GetAdjective]ทําใหชาตินี้มีแนวทางสอดคลองกับอุดมการณของ[ROOT.GetAdjective]มากขึ้น และ [FROM.GetLeader] ไดแสดงความสนใจจะเขารวม [ROOT.GetFactionName] นี่คือโอกาสทางประวัติศาสตร ขณะที่ศัตรูหันหลังให [FROM.GetNameDef] สิ่งสุดทายที่พวกเขาจะคาดคิดก็คือทหาร[FROM.GetAdjective]หันปากกระบอกปนเขาใสพวกเขา"
 DOD_romania.16.a: "ยินดีตอนรับ มิตรสหายชาว[FROM.GetAdjective]!"
 DOD_romania.161.t: "[FROM.GetNameDefCap] ทรยศ [ROOT.GetNameDef]!"
 DOD_romania.161.desc: "นาเสียดายที่รัฐมนตรีตางประเทศ[FROM.GetAdjective]ไดสงสาสนของ [FROM.GetNameDef] ซึ่งไมตองสงสัยเลยวาเปนการทรยศตอ [ROOT.GetFactionName] และอุดมการณ[ROOT.GetRulingIdeology]อยางโจงแจง! [FROM.GetNameDefCap] ประกาศวาจากนี้ไปจะสูเพื่อ [romania_new_ally_target.GetFactionName]"
 DOD_romania.161.a: "เรานาจะรูตั้งแตแรกวา [FROM.GetLeader] ไวใจไมได!"
 DOD_romania.162.t: "[romania_new_ally_target.GetNameDefCap] ยอมรับ!"
 DOD_romania.162.desc: "เราไดรับแจงวา [romania_new_ally_target.GetNameDef] ยอมรับคําขอของเราที่จะเขารวม [romania_new_ally_target.GetFactionName] แลว และในไมชา [romania_former_ally_target.GetLeader] จะไดเรียนรูวาทหาร[ROOT.GetAdjective]ตัวจริงรบกันอยางไร"
 DOD_romania.162.a: "จับอาวุธ!"
 DOD_romania.601.t: "[FROM.GetName] ตองการแบง [YUG.GetNameDef]"
 DOD_romania.601.desc: "เมื่อเห็นความขัดแยงภายในที่เปนลักษณะเดนของ [YUG.GetNameDef] [ROM.GetLeader] จึงตัดสินใจสานตอนโยบายครองความเปนใหญในบอลขานของ[ROM.GetLeader.GetHerHis] ดวยการแบงชาวยูโกสลาฟใหแกมหาอํานาจทองถิ่นหลายราย [Root.GetNameDefCap] เปนหนึ่งในชาติที่ไดรับเชิญใหรวมแบงยูโกสลาเวีย และแมนี่จะเปนโอกาสอันนาดึงดูดที่จะขยายดินแดนในบอลขานของเรา แตเราจะมีพันธะตองเขารวมความขัดแยงหากยูโกสลาเวียปฏิเสธคําขาด"
 DOD_romania.601.a: "ความคิดที่ยอดเยี่ยม!"
 DOD_romania.601.b: "บางทีเราไมควรเขาไปยุงเรื่องนี้"
 invited_to_split_yugo: "รับคําเชิญใหรวมแบงยูโกสลาเวียแลว"
 strongest_claimant_ROM: "§Yโรมาเนีย§! มีการอางสิทธิ์ที่หนักแนนที่สุด"
 strongest_claimant_GER: "§Yเยอรมนี§! มีการอางสิทธิ์ที่หนักแนนที่สุด"
 strongest_claimant_ITA: "§Yอิตาลี§! มีการอางสิทธิ์ที่หนักแนนที่สุด"
 strongest_claimant_HUN: "§Yฮังการี§! มีการอางสิทธิ์ที่หนักแนนที่สุด"
 DOD_romania.163.t: "คอดรีอานูเสียชีวิต"
 DOD_romania.163.desc: "คอดรีอานูเปนภัยคุกคามตออนาคตของรัฐโรมาเนีย การกระทําอันบาบิ่นของเขาเปนเหตุใหตองจับกุมเพื่อรักษาเสถียรภาพ ความตายของเขาจะเปนเครื่องเตือนใจอันมีคาวาคนเราเลือกไดวาจะเปนแบบอยางที่ดี หรือเปนคําเตือนที่นาสะพรึง ผูนําที่รอบคอบและมีความรับผิดชอบมากกวากําลังรอพวกฟาสซิสตแหงโรมาเนียอยู"
 DOD_romania.163.a: "จากไปแตไมถูกลืม"
