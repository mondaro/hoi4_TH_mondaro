l_english:
 DOD_hungary.1.t: "ฮังการีเรียกรองใหจัดการลงประชามติ"
 DOD_hungary.1.desc: "ในสุนทรพจนที่บูดาเปสต [HUN.GetLeader]ไดเรียกรองใหราษฎรชาวออสเตรียของเขาไดรับอนุญาตใหกลับมาอยูใตการปกครองของเขา อยางไรก็ตาม เพื่อแสดงทาทีปรองดอง เขาไดกลาวตอสาธารณะวาชาวออสเตรียควรไดรับอนุญาตใหตัดสินใจเรื่องนี้ดวยตนเอง"
 DOD_hungary.1.a: "ใหประชาชนไดแสดงความเห็น"
 DOD_hungary.1.b: "เรื่องเชนนี้ควรปลอยใหมืออาชีพจัดการ"
 DOD_hungary.1.c: "เราจะทําใหแนใจวาผลออกมาถูกตอง"
 DOD_hungary.2.t: "อนุมัติการลงประชามติ"
 DOD_hungary.2.desc: "ผลการลงประชามติออกมาแลว และการนับคะแนนเบื้องตนแสดงเสียงขางมากอยางชัดเจนที่สนับสนุนการรวมกับฮังการี"
 DOD_hungary.2.a: "ประชาชนไดตัดสินแลว"
 DOD_hungary.3.t: "การลงประชามติลมเหลว"
 DOD_hungary.3.desc: "แมกลุมที่นิยมฮังการีและฝายนิยมกษัตริยจะรณรงคอยางเปนระบบ แตผลเบื้องตนแสดงเสียงขางมากเล็กนอยที่ตองการคงสถานะเดิม"
 DOD_hungary.3.a: "เปนทางเลือกที่ชาญฉลาด"
 DOD_hungary.4.t: "การลงประชามติสําเร็จ"
 DOD_hungary.4.desc: "ไมนานหลังเที่ยงคืน [AUS.GetLeader]ประกาศวาชาวออสเตรียไดลงมติรวมกับฮังการี โทรเลขฉบับหนึ่งไดมาถึง เพื่อถวายมงกุฎแหงออสเตรียแด[HUN.GetLeader]อยางเปนทางการ เปนกาวแรกสูการฟนฟูราชาธิปไตยคู"
 DOD_hungary.4.a: "ยอดเยี่ยม"
 DOD_hungary.5.t: "การลงประชามติพายแพ"
 DOD_hungary.5.desc: "แมเราจะพยายามอยางสุดความสามารถ ชาวออสเตรียก็ตัดสินใจคงสถานะเดิมไว"
 DOD_hungary.5.a: "เราตองปลดปลอยประเทศนี้และคืนใหแกผูปกครองที่ชอบธรรม"
 DOD_hungary.5.b: "เราจะเคารพผลการลงประชามติ"
 DOD_hungary.6.t: "ปฏิเสธการลงประชามติ"
 DOD_hungary.6.desc: "[AUS.GetLeader] ผูนําออสเตรียไดประกาศตอสาธารณะวาทั้งประเทศเปนหนึ่งเดียวในการตอตานราชวงศฮับสบูรก และแนวคิดเรื่องการลงประชามติเกี่ยวกับเอกราชของออสเตรียนั้นไรสาระสิ้นดี"
 DOD_hungary.6.a: "มาดูกันวาพวกเขาเปนหนึ่งเดียวกันจริงแคไหน"
 DOD_hungary.6.b: ""ประชาธิปไตย" ในทางปฏิบัติ"
 DOD_hungary.7.t: "ชี้นําการลงประชามติ"
 DOD_hungary.7.desc: "ขอเสนอของฮังการีใหจัดการลงประชามติทําใหเราตกที่นั่งลําบากในเวทีระหวางประเทศ เราไมอาจถูกมองวาปฏิเสธทางเลือกของประชาชน แตก็ไวใจไมไดวาพวกเขาจะเลือกถูก โชคดีที่ยังมีวิธีการตาง ๆ แกปญหานี้ได เราตองการผลการลงประชามติแบบใด?"
 DOD_hungary.7.a: "ประชาชนปฏิเสธ"
 DOD_hungary.7.b: "ประชาชนเห็นชอบ"
 DOD_hungary.10.t: "ออสเตรีย-ฮังการีเสนอการรับประกัน"
 DOD_hungary.10.desc: "ดวยความเปลี่ยนแปลงอยางฉับพลันในภูมิทัศนทางการเมืองของบอลขานเมื่อไมนานมานี้ คําถามเรื่องความสัมพันธของเรากับจักรวรรดิออสเตรีย-ฮังการีใหมถูกหยิบยกขึ้นมาซํ้าแลวซํ้าเลา วันนี้เอกอัครราชทูตฮังการีไดยื่นหนังสือทางการ ขอใหเราประกาศจุดยืนตอจักรวรรดิอยางเปนทางการ ราชวงศฮับสบูรกอางวาโบฮีเมียและโมราเวียเปนของพวกเขาในฐานะดินแดนในราชบัลลังกเดิม \n\nอยางไรก็ตาม [HUN.GetLeader]ไดแสดงทาทีวาจะยอมรับทางออกแบบประนีประนอม โดยตนเองจะเปนประมุขแหงรัฐของเราในนาม แตมีอํานาจที่แทจริงนอยมาก"
 DOD_hungary.10.a: "เราจะกลับคืนสูจักรวรรดิ"
 DOD_hungary.10.b: "เราจะยอมรับการประนีประนอม"
 DOD_hungary.10.c: "เราจะไมมีวันสละเสรีภาพเพื่อแลกกับความปลอดภัย!"
 DOD_hungary.11.t: "โบฮีเมียกลับคืนสูราชบัลลังก"
 DOD_hungary.11.desc: "หลังการหารือในระดับสูงสุดที่ยืดเยื้อจนดึกดื่น รัฐบาล[CZE.GetAdjective]ไดตัดสินใจยอมรับขอเสนอของเรา และประกาศให[HUN.GetLeader]เปนกษัตริยแหงโบฮีเมียและมารเกรฟแหงโมราเวีย ทหารของกองทัพเช็กเดิมไดถวายสัตยปฏิญาณตอกษัตริยและจักรพรรดิองคใหม และฝายปกครองพลเรือนของดินแดนเหลานี้ไดถูกผนวกรวมอยางสมบูรณ"
 DOD_hungary.11.a: "อีกกาวหนึ่งบนเสนทางทวงคืนสิทธิโดยกําเนิดของเรา"
 DOD_hungary.12.t: "โบฮีเมียยอมกระชับความสัมพันธ"
 DOD_hungary.12.desc: "[CZE.GetLeader]ซึ่งตองรักษาสมดุลอยางระมัดระวังระหวางฝายสาธารณรัฐนิยมและฝายนิยมกษัตริยในรัฐบาล ไดเลือกทางออกแบบประนีประนอม [HUN.GetLeader]จะไดรับการประกาศเปนกษัตริยแหงโบฮีเมียและโมราเวีย แตรัฐธรรมนูญ[CZE.GetAdjective]จะจํากัดพระราชอํานาจใหกระทําการไดดวยคําแนะนําและความยินยอมของรัฐสภาเทานั้น"
 DOD_hungary.12.a: "ยอมรับได"
 DOD_hungary.13.t: "[CZE.GetNameDefCap]ปฏิเสธขอเสนอ"
 DOD_hungary.13.desc: "[CZE.GetNameDefCap]ปฏิเสธที่จะพิจารณาขอตกลงหรือการประนีประนอมใด ๆ เกี่ยวกับความสัมพันธในอนาคตกับเรา เมื่อเอกอัครราชทูตของเราไปถึงกระทรวงการตางประเทศเพื่อหารือเรื่องหนังสือทางการที่ยื่นไวกอนหนา เขากลับไดรับแจงวาไมมีอะไรตองคุย และถูกเชิญออกไปอยางรวดเร็ว เอกอัครราชทูต[CZE.GetAdjective]ประจํารัฐบาลของเราไดประกาศวา แมรัฐบาลของเขาตองการความสัมพันธที่สงบสุขและเปนมิตรระหวางสองชาติ แตไมมีทางเปนไปไดที่จะรวม[CZE.GetNameDef]เขากับจักรวรรดิออสเตรีย-ฮังการี"
 DOD_hungary.13.a: "นาเสียดาย"
 DOD_hungary.20.t: "สงครามในฮังการี"
 DOD_hungary.20.desc: "หลังสงครามปะทุขึ้นในฮังการี คําถามเรื่องการสนับสนุนพวกเขาถูกหยิบยกขึ้นมาซํ้าแลวซํ้าเลา หนังสือพิมพฝายอนุรักษนิยมเรียกรองใหลงมือชวยเหลือชาวฮังการี โดยอางวาไมอาจคาดหวังใหกษัตริยนิ่งเฉยได ขณะที่พระราชโอรสของพระองคเอง ซึ่งปจจุบันเปนกษัตริยแหงฮังการี กําลังถูกโจมตี จดหมายจากกลุมนายทหารบกนิรนามรั่วไหลสูสื่อ ระบุวาทหารจํานวนมากพรอมจะไปสูรบในฮังการีหากรัฐบาลอนุญาต \n\nรัฐบาลไดประชุมเพื่อหารือทางเลือกตาง ๆ"
 DOD_hungary.20.a: "เราไมอาจถูกลากเขาไปในความขัดแยงนี้ได"
 DOD_hungary.20.b: "สงคณะผูสังเกตการณไปฮังการี ใหใหญเขาไว"
 DOD_hungary.20.c: "สงครามของพวกเขาคือสงครามของเรา"
 DOD_hungary.21.t: "สวีเดนปฏิเสธการชวยเหลือ"
 DOD_hungary.21.desc: "แมจะมีการรองขอหลายครั้งทั้งจากกษัตริยสวีเดนและกลุมตาง ๆ ในกองทัพสวีเดน รัฐบาลสวีเดนก็ปฏิเสธไมใหผูใดมาชวยเหลือเรา แมแตบุคคลทั่วไปที่ประสงคจะเดินทางมาสูรบในฮังการีก็ถูกปฏิเสธวีซา และรัฐบาลยังผลักดันกฎหมายหามขายอาวุธปนใหเราอีกดวย"
 DOD_hungary.21.a: "เราตองพึ่งตัวเอง"
 DOD_hungary.22.t: "สวีเดนสงความชวยเหลือ"
 DOD_hungary.22.desc: "แมรัฐบาลสวีเดนจะวางตัวเปนกลางอยางเปนทางการ แตก็อนุญาตใหทหารและนายทหารจํานวนมากอยางนาประหลาดใจลาพักเปนเวลานาน และยังยอมใหพวกเขานําอาวุธสวนตัวติดตัวไปดวย ทหารเหลานี้ไดเดินทางมาถึงฮังการีและพรอมเขารวมกองทัพของเราแลว"
 DOD_hungary.22.a: "ยอดเยี่ยม"
 DOD_hungary.23.t: "สวีเดนเขาแทรกแซง"
 DOD_hungary.23.desc: "ในพัฒนาการที่ทําใหแมแตนักการทูตผูมากประสบการณยังประหลาดใจ รัฐบาลสวีเดนประกาศวาถือวาความอยูรอดของเราเปนผลประโยชนหลักของชาติสวีเดน มีขาวลือวากษัตริยสวีเดนเองทรงเขามาชวยเหลือเรา โดยขูจะสละราชสมบัติและเสด็จมาฮังการีดวยพระองคเองเพื่อรับใชในกองทัพ หากรัฐบาลไมใหอะไรมากกวาคําพูดสนับสนุนอันอบอุน"
 DOD_hungary.23.a: "พวกเขาจะมาทันเวลาไหม?"
 DOD_hungary.24.t: "สวีเดนกําลังถูกโจมตี"
 DOD_hungary.24.desc: "สวีเดนเขาไปพัวพันในความขัดแยงนองเลือด ในการปรากฏพระองคที่หาไดยากตอหนารัฐสภาทั้งสองสภา กษัตริยทรงกลาววาพระองคทรงกังวลอยางยิ่งตอบานเกิดเดิม โดยเฉพาะชะตากรรมของพระราชบิดาและพระราชวงศหากสวีเดนพายแพ ดวยเหตุนี้ รัฐบาลจึงตัดสินใจประชุมหารือวาจะชวยเหลือสวีเดนไดอยางไร"
 DOD_hungary.24.a: "เราไมอาจถูกลากเขาไปในความขัดแยงของพวกเขาได"
 DOD_hungary.24.b: "สงความชวยเหลือแบบลับ"
 DOD_hungary.24.c: "เรายืนเคียงขางชาวสวีเดน"
 DOD_hungary.25.t: "ฮังการีปฏิเสธการชวยเหลือ"
 DOD_hungary.25.desc: "แมกษัตริยฮังการีจะทรงรองขอดวยพระองคเอง รัฐสภาก็ลงมติปฏิเสธการสนับสนุนทุกรูปแบบแกสวีเดน ฝายคานขูจะปลด[HUN.GetLeader]ดวยการลงมติไมไววางใจ หากเขาพยายามทําสิ่งใดที่ละเมิดความเปนกลางของฮังการี"
 DOD_hungary.25.a: "เราตองพึ่งตัวเอง"
 DOD_hungary.26.t: "ฮังการีสงความชวยเหลือ"
 DOD_hungary.26.desc: "ฮังการีไดเปดคลังแสงเกาและสงปนไรเฟลที่ซอมบํารุงใหมและยุทโธปกรณทหารราบอื่น ๆ จํานวนหนึ่งมาใหเรา อาสาสมัครชาวฮังการีหลายพันคนก็เดินทางมาสมทบกับเราดวย"
 DOD_hungary.26.a: "ยินดีตอนรับอยางยิ่ง"
 DOD_hungary.27.t: "ฮังการีเขาแทรกแซง"
 DOD_hungary.27.desc: "รัฐบาลฮังการีออกแถลงการณประกาศวาการโจมตีสวีเดนใด ๆ จะถือเปนการโจมตีฮังการีดวย กองทัพฮังการีถูกยกระดับเปนการเตรียมพรอมสูงสุด และคาดวาจะเขาสูสงครามทันทีที่การระดมพลเสร็จสิ้น"
 DOD_hungary.27.a: "จะทันเวลาไหม?"
 DOD_hungary.30.t: "ฮังการีเสนอการฟนสัมพันธ"
 DOD_hungary.30.desc: "รัฐบาลฮังการีติดตอเราพรอมขอเสนอใหเจรจาสนธิสัญญาทรียานงใหม ตามขอเสนอนี้ ขอจํากัดเรื่องขนาดกองทัพในสนธิสัญญาจะถูกแกไขใหฮังการีสามารถเสริมกองทัพปจจุบันใหมีกําลังเต็มอัตรา ฮังการียังจะไดรับอนุญาตใหใชงบประมาณสวนที่มากขึ้นในการขยายและปรับปรุงอุตสาหกรรมทางทหารใหทันสมัย \n\nเมื่อรัฐบาลประชาธิปไตยกุมอํานาจในประเทศอยางมั่นคง แผนนี้จึงไดรับการสนับสนุนอยางมากในหนวยงานการทูตของเรา"
 DOD_hungary.30.a: "เปนคําขอที่สมเหตุสมผล"
 DOD_hungary.30.b: "แลวพวกเขาจะเอากองทัพที่ใหญขึ้นไปทําอะไร?"
 DOD_hungary.31.t: "การแกไขสนธิสัญญาทรียานง"
 DOD_hungary.31.desc: "รัฐบาลของ[HUN.GetLeader]ไดรับชัยชนะทางการเมืองครั้งสําคัญ เมื่อ[From.GetNameDef]เพิ่งใหสัตยาบันการแกไขสนธิสัญญาทรียานง บัดนี้เราไดรับอนุญาตใหกลับมาเกณฑทหาร และสามารถจัดสรรงบประมาณเพื่อสรางโรงงานทหารไดอยางเปดเผย"
 DOD_hungary.31.a: "ยอดเยี่ยม"
 DOD_hungary.32.t: "[From.GetNameDefCap]ปฏิเสธการเจรจา"
 DOD_hungary.32.desc: "รัฐบาลของ[From.GetNameDef]ไมยอมออนขอในประเด็นการฟนฟูกําลังรบ การเจรจาลมแทบจะทันที โดยคณะผูแทน[From.GetAdjective]ถวงเวลาทุกโอกาส และเปลี่ยนเรื่องเล็กนอยอยางลําดับที่นั่งใหกลายเปนการถกเถียงนานนับชั่วโมง เห็นไดชัดวาพวกเขาไมตั้งใจจะใหเราฟนฟูกําลังรบ แตตองการใหเราเปนฝายเดินออกจากโตะเจรจาเอง"
 DOD_hungary.32.a: "ก็ได เราจะตามใจพวกเขา"
 DOD_hungary.32.b: "ขอความชวยเหลือจากฝรั่งเศส"
 DOD_hungary.32.c: "ขอความชวยเหลือจากสหราชอาณาจักร"
 DOD_hungary.33.t: "ฮังการีรองขอการสนับสนุน"
 DOD_hungary.33.desc: "เมื่อไมนานมานี้ ฮังการีเริ่มหยั่งทาทีเพื่อนบานเรื่องการแกไขขอจํากัดบางประการที่ถูกบังคับใชหลังสงครามครั้งกอน โดยเฉพาะอยางยิ่ง พวกเขาตองการนําการเกณฑทหารกลับมาใชและขยายอุตสาหกรรมทางทหาร ฮังการีใหเหตุผลวาโลกกําลังอันตรายขึ้นทุกวัน และพวกเขาจําเปนตองมีกองทัพที่เหมาะสมเพื่อปองกันตนเอง [From.From.GetNameDefCap]คิดตางออกไป"
 DOD_hungary.33.a: "ควรอนุญาตใหฮังการีฟนฟูกําลังรบไดอยางจํากัด"
 DOD_hungary.33.b: "เราไมอาจทําลายดุลอํานาจในภูมิภาคได"
 DOD_hungary.34.t: "[From.GetName]สนับสนุนฮังการี"
 DOD_hungary.34.desc: "เอกอัครราชทูตจาก[From.GetNameDef]แสดงใหเห็นชัดวารัฐบาลของเขาคัดคานอยางหนักตอการตัดสินใจของเราที่ปฏิเสธสิทธิ์การฟนฟูกําลังรบของฮังการี เขายังยํ้าชัดวาหากเรายืนกรานใหฮังการีปลอดอาวุธตอไป รัฐบาลของเขาจะนําเรื่องนี้มาพิจารณาเมื่อมีประเด็นทางการทูตที่เกี่ยวของกับเราเกิดขึ้นในอนาคต \n\nกลาวอีกนัยหนึ่ง พวกเขายอมเอาความสัมพันธอันดีในปจจุบันของเราเปนเดิมพัน"
 DOD_hungary.34.a: "ขอภาวนาใหพวกเขาคิดถูก"
 DOD_hungary.34.b: "เราตองแนวแนในประเด็นนี้"
 DOD_hungary.35.t: "[From.GetName]ปฏิเสธการสนับสนุน"
 DOD_hungary.35.desc: "รัฐบาลของ[From.GetNameDef]แจงเราวาพวกเขาถือวาการแกไขสนธิสัญญาทรียานงเปนเรื่องภายในของประเทศที่เกี่ยวของลวน ๆ และปฏิเสธที่จะเขามายุงเกี่ยว ดูเหมือนพวกเขาจะใสใจการรักษาความสัมพันธอันดีกับพันธมิตรเกามากกวาความยุติธรรม"
 DOD_hungary.35.a: "ชางหัวพวกมัน"
 DOD_hungary.36.t: "[From.GetNameDefCap]ยังคงดื้อดึง"
 DOD_hungary.36.desc: "แมจะถูก[From.From.GetNameDef]กดดันทางการเมืองอยางหนัก [From.GetNameDef]ก็ปฏิเสธเด็ดขาดที่จะหารือประเด็นนี้ ดูเหมือนพวกเขายังกลัววาเราจะใชอาวุธตอตานพวกเขา \n\nเมื่อทุกชองทางการทูตถูกปดกั้น เราคงตองรอดูวาจะมีโอกาสหยิบยกประเด็นนี้ขึ้นมาอีกในอนาคตหรือไม"
 DOD_hungary.36.a: "เราดูนากลัวขนาดนั้นเลยหรือ?"
 DOD_hungary.40.t: "[HUN.GetNameDefCap]ประกาศยกเลิกสนธิสัญญาทรียานง"
 DOD_hungary.40.desc: "วันนี้[HUN.GetLeader]แถลงตอสาธารณะวาเขาไมถือวา[HUN.GetNameDef]ผูกพันตามสนธิสัญญาอีกตอไป ยิ่งไปกวานั้น เขาประกาศวาสนธิสัญญาเปนโมฆะ โดยอางวาฮังการีถูกบังคับใหลงนามภายใตปากกระบอกปน จึงไมเคยมีผลผูกพันทางกฎหมาย รัฐบาลฮังการีไมแมแตจะแจงการตัดสินใจนี้ใหเราทราบอยางเปนทางการ\n\n หลายคนในรัฐบาลสนับสนุนใหตอบโตอยางแข็งกราว หากเราแสดงใหชาวฮังการีเห็นวาเราไมกลัวพวกเขา พวกเขายอมยอมถอยแนนอน อยางไรก็ตาม พวกเขาก็อาจตัดสินวาเราแคขู"
 DOD_hungary.40.a: "ยื่นคําขาดทันที"
 DOD_hungary.40.b: "ตอนนี้เราไมอาจรับภาระสงครามได"
 DOD_hungary.41.t: "[From.GetName]ยื่นคําขาด"
 DOD_hungary.41.desc: "การตัดสินใจลาสุดของเราที่จะละทิ้งสนธิสัญญาทรียานงถูก[From.GetNameDef]ตอบโตอยางแข็งกราวเกินคาด มีรายงานวา[From.GetLeader]สั่งใหกองทัพ[From.GetAdjective]เตรียมแผนการแทรกแซงโดยดวน ขณะเดียวกัน เอกอัครราชทูต[From.GetAdjective]ไดขอใหเราชี้แจงถอยแถลงเกี่ยวกับสนธิสัญญา พรอมบอกเปนนัยวาทางเลือกทางทหารยังคงอยูบนโตะ"
 DOD_hungary.41.a: "พวกเขาแคขูเทานั้น"
 DOD_hungary.41.b: "ดูเหมือนจะมีความเขาใจผิดกัน"
 DOD_hungary.42.t: "[From.GetName]ยอมถอย"
 DOD_hungary.42.desc: "แมเราจะแถลงอยางแข็งกราวเรื่องสนธิสัญญาทรียานง [From.GetNameDef]ก็ไมไดเคลื่อนไหวใด ๆ เพื่อหยุดเรา ในการแถลงขาวครั้งลาสุด [From.GetLeader]พยายามทุกทางที่จะไมตอบคําถามใด ๆ เกี่ยวกับการตัดสินใจละทิ้งสนธิสัญญาของเรา นี่แสดงใหเห็นชัดถึงสิ่งที่ทุกคนสงสัยอยูแลว: [From.GetNameDef]เปนเพียงเสือกระดาษ"
 DOD_hungary.42.a: "เปนไปตามคาด"
 DOD_hungary.43.t: "[HUN.GetNameDefCap]ไมยอมถอย"
 DOD_hungary.43.desc: "ดูเหมือนคําเตือนของเราตอ[HUN.GetNameDef]จะไมเปนผล ในการชุมนุมที่บูดาเปสตเมื่อเย็นวานนี้ มีรายงานวาฝูงชนตะโกนวา "[From.From.GetNameDef]จงพินาศ!" และ[HUN.GetLeader]ไดปฏิญาณตอสาธารณะวาความพยายามใด ๆ ที่จะหยุดยั้ง[HUN.GetNameDef]ไมใหทวงคืนที่ทางอันชอบธรรมในโลก จะตองเผชิญกับ "สงครามที่โลกไมเคยพบเห็นมากอน สงครามที่จะทําใหการสังหารหมูครั้งใหญระหวางป 1914 ถึง 1918 ดูเปนเพียงการตีกันในบาร" \n\nเรากําลังยืนอยูบนทางแยก เราตองเลือกระหวางการทําสงครามเพื่อปกปองเกียรติและความนาเชื่อถือ หรือยอมรับวาเราถูกอีกฝายเดินเกมเหนือกวา"
 DOD_hungary.43.a: "หากชาว[HUN.GetAdjective]ตองการสงคราม เราก็จะมอบให"
 DOD_hungary.43.b: "พวกเขาจับไดวาเราแคขู"
 DOD_hungary.44.t: "[HUN.GetNameDefCap]ยอมถอย"
 DOD_hungary.44.desc: "เมื่อภัยสงครามอยูตรงหนา รัฐบาลฮังการีก็กลับเปนมิตรขึ้นมาอยางฉับพลัน เอกอัครราชทูตของเราไดรับเชิญไปรับประทานอาหารกลางวันสวนตัวกับ[HUN.GetLeader] ซึ่งเขาไดรับคํายืนยันวา[HUN.GetNameDef]ไมตองการสิ่งใดนอกจากสันติภาพและความสัมพันธอันดีกับเรา ถอยแถลงใด ๆ ในสื่อหวือหวาไมควรถือวามาจากรัฐบาลฮังการี ซึ่งไมเคยตองการสงครามเลย"
 DOD_hungary.44.a: "อยางที่เราคิดไว"
 DOD_hungary.45.t: "การแทรกแซงใน[HUN.GetNameDef]"
 DOD_hungary.45.desc: "[From.GetNameDefCap]ไดประกาศการแทรกแซงทางทหาร หลังจาก[HUN.GetNameDef]ประกาศยกเลิกสนธิสัญญาทรียานงอยางเปดเผย พวกเขาขอใหเรารวมกันโคน[HUN.GetNameDef]กอนที่จะฟนกําลังขึ้นมาได"
 DOD_hungary.45.a: "เราตองโจมตีกอนที่จะสายเกินไป"
 DOD_hungary.45.b: "เราจะไมถูกลากเขาไปในความขัดแยงนี้"
 DOD_hungary.46.t: "[From.GetNameDefCap]ประกาศความเปนกลาง"
 DOD_hungary.46.desc: "พวกทรยศและขี้ขลาดใน[From.GetNameDef]ปฏิเสธที่จะตอบรับการเรียกรองใหจับอาวุธของเรา! แทนที่จะลุกขึ้นตอกรกับอันธพาลในบูดาเปสต พวกเขากลับยอมศิโรราบและปลอยใหเราเผชิญหนากับชาว[HUN.GetAdjective]ตามลําพัง"
 DOD_hungary.46.a: "เราทําไดดวยตัวเอง"
 DOD_hungary.50.t: "[HUN.GetNameDefCap]เรียกรองทรานซิลเวเนีย"
 DOD_hungary.50.desc: "ทรานซิลเวเนียเคยเปนสวนหนึ่งของ[HUN.GetNameDef]มายาวนาน กอนที่ประชาชนที่นั่นจะตัดสินใจเขารวมกับเราโดยเสรีหลังมหาสงคราม นาเสียดายที่[HUN.GetNameDef]ไมเคยทําใจกับการสูญเสียดินแดนได หลายครั้งหลายคราที่พวกเขาอางตอสาธารณะวาทรานซิลเวเนียเปนสวนหนึ่งที่แยกไมไดของชาติตน ดวยการเปลี่ยนแปลงทางการเมืองเมื่อไมนานมานี้ พวกเขาจึงตัดสินใจรื้อฟนขออางอีกครั้ง โดยเรียกรองใหเรายกทรานซิลเวเนียทั้งหมดใหพวกเขา...ไมเชนนั้นละก็"
 DOD_hungary.50.a: "ไมคุมกับการนองเลือดจากสงครามอีกครั้ง"
 DOD_hungary.50.b: "ไมเชนนั้น...แลวไง?"
 DOD_hungary.51.t: "[ROM.GetNameDefCap]ยกทรานซิลเวเนียให"
 DOD_hungary.51.desc: "แทนที่จะเผชิญหนากับแสนยานุภาพของกองทัพเรา ชาว[ROM.GetAdjective]ผูขี้ขลาดเลือกคืนดินแดนอันชอบธรรมของเรา ทรานซิลเวเนียทั้งหมดถูกสงมอบใหอยูใตการปกครองของเรา และกองกําลังของเราไดเขาควบคุมอยางสมบูรณ"
 DOD_hungary.51.a: "ก็ควรเปนเชนนั้น"
 DOD_hungary.52.t: "[ROM.GetNameDefCap]ปฏิเสธที่จะสละทรานซิลเวเนีย"
 DOD_hungary.52.desc: "สิ่งที่บงบอกไดชัดที่สุดอาจเปนการที่เอกอัครราชทูต[ROM.GetAdjective] ในการพบกับ[HUN.GetLeader]เมื่อเชานี้ รูสึกวาจําเปนตองเติมคําวา "เชนเคย" ลงในคําปฏิเสธหวน ๆ ที่จะไมแมแตหารือถึงความเปนไปไดในการโอนดินแดนพิพาท รัฐบาล[ROM.GetAdjective]ปฏิเสธขออางของเราตอสาธารณะครั้งแลวครั้งเลา ถึงขั้นเยาะเยยดวยซํ้า หลายปที่ผานมาเราออนแอเกินกวาจะตอบโต\n\nแตไมใชอีกตอไป"
 DOD_hungary.52.a: "ความโกรธเปนเครื่องนําทางที่เลวในสงคราม เราจะรอจังหวะ"
 DOD_hungary.52.b: "คราวนี้พวกเขาทําเกินไปแลว"
 DOD_hungary.53.t: "[HUN.GetNameDefCap]ระดมพล"
 DOD_hungary.53.desc: "[HUN.GetNameDefCap]ไดยกระดับกองกําลังเขาสูภาวะเตรียมพรอมสูง เครื่องบินลาดตระเวนของฮังการีรุกลํ้านานฟาของเรานับสิบครั้งในไมกี่ชั่วโมงที่ผานมา หนวยขาวกรองของเรารายงานการเคลื่อนกําลังพลขนาดใหญมุงหนาสูชายแดน และเสียงไซเรนเตือนภัยทางอากาศดังกองในบูดาเปสต ดูเหมือนวาครั้งนี้ชาว[HUN.GetAdjective]เอาจริง เราอาจกําลังจะเขาสูสงคราม"
 DOD_hungary.53.a: "เราแสดงทาทีไปแลว ไมมีใครตองการสงคราม"
 DOD_hungary.53.b: "พวกมันจะผานไปไมได!"
 DOD_hungary.53.c: "บางทีอาจถึงเวลาประนีประนอม"
 DOD_hungary.54.t: "[ROM.GetNameDefCap]ระดมพล"
 DOD_hungary.54.desc: "เพื่อตอบโตการเตรียมการทางทหารของเรา [ROM.GetLeader]ไดลงนามในคําสั่งทั่วไปที่ 1 ใหกองทัพ[ROM.GetAdjective]เตรียมพรอมขั้นสูงสุด กองทัพอากาศ[ROM.GetAdjective]เขาประจําฐานรบแลว และเครื่องบินขับไลของพวกเขาไดซอมพันตูหลอก ๆ กับเครื่องบินของเรา เอกอัครราชทูต[ROM.GetAdjective]ไดขอหนังสือเดินทางคืน ยังไมมีการยิงกันแมแตนัดเดียว แตเปนเพียงเรื่องของเวลากอนที่วิกฤตนี้จะระเบิดเปนสงคราม \n\nเอกอัครราชทูตของเราในสหราชอาณาจักร ฝรั่งเศส และเยอรมนี รายงานความเคลื่อนไหวอยางคึกคักในกระทรวงการตางประเทศของแตละประเทศ บงชี้วาชาติเหลานี้อาจใหความสนใจในวิกฤตที่กําลังกอตัว หากเราตองการแกปญหาดวยกําลัง เราตองลงมือใหเร็ว"
 DOD_hungary.54.a: "สถานการณกําลังบานปลายเกินควบคุม"
 DOD_hungary.54.b: "ถาอยางนั้นก็สงคราม"
 DOD_hungary.54.c: "เสนอใหมีคนกลางที่เปนกลางไกลเกลี่ย"
 DOD_hungary.55.t: "เลือกผูไกลเกลี่ย"
 DOD_hungary.55.desc: "แมความตึงเครียดจะสูง แตยังมีโอกาสแกไขปญหาดวยการทูต อีกฝายไดติดตอเราผานชองทางลับ บอกเปนนัยวาพวกเขาไมจําเปนตองคัดคานคณะกรรมาธิการจากชาติที่ไมมีสวนเกี่ยวของในการตัดสินประเด็นนี้ เราควรติดตอใครใหชวยสนับสนุนจุดยืนของเรา?"
 DOD_hungary.55.a: "ติดตอเยอรมนี"
 DOD_hungary.55.b: "ติดตอสหราชอาณาจักร"
 DOD_hungary.55.d: "ติดตอฝรั่งเศส"
 DOD_hungary.55.c: "ติดตอสหภาพโซเวียต"
 DOD_hungary.55.e: "ติดตออิตาลี"
 DOD_hungary.55.f: "ไมมีใครยินดีรับฟงเรื่องของเราเลย..."
 DOD_hungary.57.t: "[HUN.GetNameDefCap]ยอมถอย"
 DOD_hungary.57.desc: "แมวาทกรรมดุเดือดยังคงออกมาจากบูดาเปสต แตกองกําลังฮังการีใกลชายแดนก็ไดถอนกําลังออกไป การละเมิดนานฟาของเรายุติลงแลว ดูเหมือน[HUN.GetLeader]ตองการใหเรื่องนี้เงียบที่สุด และกระทรวงการตางประเทศเห็นพองกันวาควรปลอยใหเขาทําเชนนั้น ทาทีปรองดองถือเปนราคาเพียงเล็กนอย เมื่อเราเพิ่งรอดพนจากสงครามมาอยางหวุดหวิด"
 DOD_hungary.57.a: "ชัยชนะอันงดงาม"
 DOD_hungary.58.t: "[HUN.GetNameDefCap]ขอใหมีการไกลเกลี่ย"
 DOD_hungary.58.desc: "ขณะที่สถานการณในบอลขานกําลังมุงสูสงครามเต็มรูปแบบอยางรวดเร็ว ฮังการีตัดสินใจขอใหมีการไกลเกลี่ยขอพิพาททรานซิลเวเนีย พวกเขาติดตอมาขอใหเรารวมเปนคณะกรรมาธิการตัดสินชะตากรรมของทรานซิลเวเนีย เห็นไดชัดวาพวกเขาเชื่อวาเราจะสนับสนุนจุดยืนของพวกเขาในการประชุมที่จะมาถึง"
 DOD_hungary.58.a: "เรายินดีอยางยิ่ง"
 DOD_hungary.58.b: "การเปนตัวแทนพวกเขาไมเปนประโยชนตอเรา"
 DOD_hungary.59.t: "[ROM.GetNameDefCap]ขอใหมีการไกลเกลี่ย"
 DOD_hungary.59.desc: "เมื่อเผชิญแรงกดดันที่เพิ่มขึ้นจากฮังการี โรมาเนียไดขอใหมีคณะกรรมาธิการที่เปนกลางตัดสินขอพิพาทเรื่องทรานซิลเวเนีย พวกเขาติดตอมาหยั่งทาทีวาเรายินดีจะรวมเปนคณะกรรมาธิการหรือไม ไมตองสงสัยเลยวาพวกเขาเชื่อวาเราจะปกปองขออางสิทธิ์ของพวกเขาในพื้นที่นั้น"
 DOD_hungary.59.a: "แนนอนวาเราจะทํา"
 DOD_hungary.59.b: "เราไมสนใจจะปกปองพวกเขา"
 DOD_hungary.60.t: "วิกฤตบอลขาน"
 DOD_hungary.60.desc: "ในชวงไมกี่วันที่ผานมา ความสัมพันธอันตึงเครียดระหวางฮังการีกับโรมาเนียไดพังทลายลงโดยสิ้นเชิง ฮังการีเรียกรองใหโรมาเนียสงมอบดินแดนพิพาทในทรานซิลเวเนีย แตโรมาเนียปฏิเสธ บัดนี้ทั้งสองฝายไดระดมพลแลว และสงครามในภูมิภาคดูเหมือนจะหลีกเลี่ยงไมได\n\nกระทรวงการตางประเทศเห็นวาจําเปนอยางยิ่งที่เราตองเตรียมการแทรกแซงเพื่อปกปองผลประโยชนของเราในภูมิภาค นอกจากนี้ยังมีโอกาสที่เพียงแคการขูวาเราจะเขาไปเกี่ยวของ ก็อาจทําใหอีกฝายยอมมาที่โตะเจรจา"
 DOD_hungary.60.a: "เราควรหนุนหลังฮังการี"
 DOD_hungary.60.b: "เราควรสนับสนุนโรมาเนีย"
 DOD_hungary.60.c: "ก็แคเรื่องโง ๆ อีกเรื่องในบอลขาน"
 DOD_hungary.61.t: "วิกฤตบอลขาน - [From.GetNameDef]หนุนหลังฮังการี"
 DOD_hungary.61.desc: "เอกอัครราชทูต[From.GetAdjective]มาถึงกระทรวงการตางประเทศของเราเมื่อเชานี้ แจงวารัฐบาลของเขาเฝาดูวิกฤตปจจุบันดวยความกังวลอยางยิ่ง การตัดสินใจของเราที่จะเสี่ยงทําสงครามเพื่อทรานซิลเวเนีย บีบใหรัฐบาล[From.GetNameAdj]ตองพิจารณาการแทรกแซงทางทหารเคียงขางฮังการี"
 DOD_hungary.61.a: "เราไมมีหวังจะตานทานพวกเขาได"
 DOD_hungary.61.b: "ตอนนี้เราถอยไมไดแลว"
 DOD_hungary.61.c: "ขอใหมีการไกลเกลี่ย"
 DOD_hungary.62.t: "วิกฤตบอลขาน - [From.GetNameDef]หนุนหลังโรมาเนีย"
 DOD_hungary.62.desc: "เอกอัครราชทูตของเราประจํา[From.GetNameDef]ถูกเรียกตัวไปหารือ ระหวางการพบปะ เขาไดรับแจงวา[From.GetNameDef]ถือวาบูรณภาพแหงดินแดนของโรมาเนียเปนผลประโยชนแหงชาติของตน โดยเฉพาะบอนํ้ามันที่ปลอเยชติมีความสําคัญอยางยิ่งตอ[From.GetNameDef] หากทรานซิลเวเนียตกเปนของเรา หรือหากเราพยายามยึดครองโรมาเนียทั้งประเทศ อุปทานนํ้ามันจะตกอยูในอันตรายอยางมาก เห็นไดชัดวารัฐบาล[From.GetAdjective]ไมยอมรับความเสี่ยงนี้ และถึงขั้นขูจะแทรกแซงทางทหารเคียงขางโรมาเนียหากสงครามปะทุขึ้น"
 DOD_hungary.62.a: "เราตองยอมถอย"
 DOD_hungary.62.b: "สงครามนี้จะจบกอนที่พวกเขาจะมาถึงเสียอีก"
 DOD_hungary.62.c: "ขอใหมีการไกลเกลี่ย"
 DOD_hungary.63.t: "การไกลเกลี่ยลมเหลว"
 DOD_hungary.63.desc_HUN_refused: "แมเราจะพยายามอยางดีที่สุด แตก็ไมสามารถหาผูสนับสนุนขออางสิทธิ์ของเราไดเลย ทุกชาติที่เราหันไปพึ่งตางปฏิเสธ และบอกใหเรายอมรับความจริงวาทรานซิลเวเนียเปนสวนหนึ่งของโรมาเนีย \n\nแลวจะยอมรับสิ่งที่ยอมรับไมไดอยางไรเลา?"
 DOD_hungary.63.desc_HUN_nothing: "ผลการประชุมเรื่องทรานซิลเวเนียเปนหายนะโดยสิ้นเชิง ดวยเหตุผลที่ไมมีใครรู ที่ประชุมไดตัดสินใหทรานซิลเวเนียทั้งหมดยังคงอยูกับโรมาเนีย แมสนธิสัญญาฉบับสุดทายจะมีบทบัญญัติบางประการที่ควรคุมครองสิทธิของชาวฮังการีเชื้อสาย แตไมตองสงสัยเลยวาเราพายแพทางการทูตอยางราบคาบ"
 DOD_hungary.63.a: "เราถูกทุกคนทรยศ!"
 DOD_hungary.63.b: "เราจะทวงคืนดินแดนของเรา หรือไมก็ตายไปพรอมกับความพยายามนั้น!"
 DOD_hungary.64.t: "การไกลเกลี่ยลมเหลว"
 DOD_hungary.64.desc_ROM_refused: "เราพยายามอยางหนักเพื่อหาแรงสนับสนุนตอจุดยืนของเรา แตดูเหมือนวาทุกวันนี้มีไมกี่ประเทศที่ใสใจจะปกปองระเบียบที่สรางขึ้นโดยแวรซายและทรียานง เมื่อมีอันธพาลอยาง[HUN.GetLeader]อยู สิ่งเดียวที่สําคัญคือกําลัง"
 DOD_hungary.64.desc_ROM_nothing: "ดูเหมือนวาสนธิสัญญาและธรรมเนียมจะไมมีความหมายอีกตอไป ที่ประชุมเรื่องทรานซิลเวเนียไดตัดสินใหดินแดนพิพาททั้งหมดตกเปนของฮังการี ขาราชการทั้งหมดยังตกตะลึงไมหาย แตตองมีการตัดสินใจ - เราจะยอมรับสิ่งนารังเกียจนี้ หรือจะสู?"
 DOD_hungary.64.a: "วันอันมืดมน"
 DOD_hungary.64.b: "เรายังสูได"
 DOD_hungary.65.t: "ฮังการีปฏิเสธผลการไกลเกลี่ย"
 DOD_hungary.65.desc: "เมื่อไดรับแจงผลการชี้ขาดเรื่องดินแดนพิพาท [HUN.GetLeader]ปฏิเสธที่จะยอมรับ เขากลาววาสิ่งใดก็ตามที่นอยกวาการฟนฟูพรมแดนเดิมของฮังการีอยางสมบูรณ ถือเปนการดูหมิ่นชาวฮังการีทุกคนทั้งที่ยังมีชีวิตและที่ลวงลับไปแลว\n\nเขายังกลาวตอไปอีกวา เวลาแหงการเจรจาและการทูตไดผานพนไปแลว และตอนนี้มีเพียงหนทางเดียวที่จะยุติปญหานี้ได \n\nรัฐบาลโรมาเนียสอบถามวาเรายืนอยูตรงไหนในขอพิพาทนี้ เนื่องจากเราเคยตกลงจะสนับสนุนพวกเขามากอน"
 DOD_hungary.65.a: "ขอเสนอของเราไมไดไปไกลขนาดนั้น"
 DOD_hungary.65.b: "ตองหยุดชาวฮังการีไวกอนที่พวกเขาจะยึดครองทั้งภูมิภาค"
 DOD_hungary.66.t: "โรมาเนียปฏิเสธผลการไกลเกลี่ย"
 DOD_hungary.66.desc: "รัฐบาลโรมาเนียไมยอมรับเงื่อนไขของสนธิสัญญาที่เจรจากันในการประชุมครั้งลาสุด มีรายงานวา[ROM.GetLeader]ไมไดอานเอกสารทั้งฉบับดวยซํ้า กอนจะฉีกทิ้งและประกาศวายอมตัดมือตัวเองดีกวาลงนามในสิ่งที่นาอัปยศเชนนี้\n\nรัฐบาลฮังการีประกาศวาพรอมอยางเต็มที่ที่จะตอสูเพื่อสิ่งที่ถูกประกาศวาเปนของพวกเขาโดยชอบธรรม แตก็สอบถามดวยวาเราจะยืนอยูตรงไหนในความขัดแยงนี้"
 DOD_hungary.66.a: "เราขอใหพวกเขาไดรับชัยชนะ"
 DOD_hungary.66.b: "เรายินดีจะสนับสนุนพวกเขา"
 DOD_hungary.67.t: "การเจรจาลมเหลว"
 DOD_hungary.67.desc: "การเจรจาระหวางมหาอํานาจลมเหลวโดยสิ้นเชิง เมื่อทั้งสองชาติไมอาจหาจุดรวมใด ๆ ได ความพยายามหาทางออกแบบประนีประนอมทุกครั้งถูกขัดขวางดวยขอเรียกรองที่ตางฝายตางรับไมได คณะผูแทนตางเดินทางกลับประเทศ ทิ้งใหเรื่องนี้คางคาไว"
 DOD_hungary.67.a: "เรื่องนี้จะยุติลงดวยไฟ เลือด และเหล็ก"
 DOD_hungary.68.t: "คําชี้ขาดทรานซิลเวเนีย"
 DOD_hungary.68.desc: "ทั้งสองฝายไดติดตอเราใหตัดสินวาใครจะไดทรานซิลเวเนีย กระทรวงการตางประเทศไดจัดทําบันทึกสรุปดังนี้:\n\n"ในสถานการณปจจุบัน ไมควรมอบทรานซิลเวเนียทั้งหมดใหฝายใดฝายหนึ่ง ควรเลือกทางออกแบบประนีประนอมที่แมไมเปนที่นิยมแตทั้งสองฝายยอมรับได เพื่อหลีกเลี่ยงการดูหมิ่นฝายหนึ่งจนถึงขั้นปฏิเสธขอตกลง""
 DOD_hungary.68.a: "มอบทรานซิลเวเนียทั้งหมดใหฮังการี"
 DOD_hungary.68.b: "มอบทรานซิลเวเนียตอนเหนือใหฮังการี"
 DOD_hungary.68.c: "ทรานซิลเวเนียยังคงอยูกับโรมาเนีย"
 DOD_hungary.69.t: "การประนีประนอมเรื่องทรานซิลเวเนีย"
 DOD_hungary.69.desc: "หลังการเจรจายาวนานหลายชั่วโมง ดูเหมือนจะใกลไดขอยุติแลว ขาวรายคือเราจะตองยกดินแดนบางสวนใหฮังการี ทรานซิลเวเนียตอนเหนือจะตกเปนของพวกเขา ขณะที่เรายังคงรักษาสวนใตไว นี่ไมใชสิ่งที่เราหวังไว แตการประเมินสถานการณตามความเปนจริงชี้วานี่คือผลลัพธที่ดีที่สุดเทาที่เปนไปได"
 DOD_hungary.69.a: "ผลลัพธที่ยอมรับได อยางหวุดหวิด"
 DOD_hungary.69.b: "เราจะไมยอมเสียดินแดนแมแตนิ้วเดียว!"
 DOD_hungary.70.t: "การประนีประนอมเรื่องทรานซิลเวเนีย"
 DOD_hungary.70.desc: "ในชวงเชามืด คณะผูแทนในที่ประชุมไดตกลงประนีประนอมกันสําเร็จ ภายใตเงื่อนไขนี้ เราจะไดทรานซิลเวเนียตอนเหนือ ขณะที่สวนใตของพื้นที่ยังคงอยูกับโรมาเนีย คณะผูแทนโรมาเนียไดตกลงแลว กระทรวงการตางประเทศเตือนวาการไมยอมรับขอเสนอนี้จะทําใหเราโดดเดี่ยวทางการทูต"
 DOD_hungary.70.a: "นี่คือสิ่งที่ดีที่สุดที่เราจะขอได"
 DOD_hungary.71.t: "การประชุมเรื่องทรานซิลเวเนีย - วันที่ 1"
 DOD_hungary.71.desc: "เมื่อเสร็จสิ้นพิธีการทางการทูต คณะผูแทนจากฮังการี โรมาเนีย และ[ROM_mediator.GetNameDef] ไดนั่งลงหารือประเด็นที่อยูตรงหนา ที่ประชุมตกลงใหเราในฐานะตัวแทนฝายฮังการี เปนผูยื่นขอเสนอแรก"
 DOD_hungary.71.a: "มอบทรานซิลเวเนียทั้งหมดใหฮังการี"
 DOD_hungary.71.b: "มอบทรานซิลเวเนียตอนเหนือใหฮังการี"
 DOD_hungary.71.c: "ทรานซิลเวเนียยังคงอยูกับโรมาเนีย"
 DOD_hungary.72.t: "การประชุมเรื่องทรานซิลเวเนีย - วันที่ 2"
 DOD_hungary.72.desc_HUN_all: "ฝายฮังการีไดยื่นขอเสนอเพื่อแกวิกฤตที่กําลังคืบคลานเขามา ไมนาแปลกใจที่พวกเขาเรียกรองใหสงมอบทรานซิลเวเนียทั้งหมดใหฮังการีโดยเร็วที่สุดเทาที่ทําได เราสามารถยอมรับขอเสนอนี้ได แตยอมทําใหพันธมิตรโรมาเนียของเราไมพอใจอยางแนนอน \n\nเรายังสามารถยื่นขอเสนอโตกลับได หัวหนานักการทูตของเราแนะนําอยางยิ่งใหเลือกทางหลัง ทางออกแบบประนีประนอมอาจเปนที่ยอมรับของทั้งสองฝายมากกวา"
 DOD_hungary.72.desc_compromise: "ฝายฮังการีไดยื่นขอเสนอเพื่อแกวิกฤตที่กําลังคืบคลานเขามา ตามขอเสนอนี้ ทรานซิลเวเนียตอนเหนือจะถูกมอบใหฮังการี สวนตอนใตยังคงอยูกับโรมาเนีย \n\nหัวหนานักการทูตของเราเชื่อวานี่แสดงวาฝายฮังการีเริ่มใจฝอแลว และเราควรผลักดันเงื่อนไขที่ดียิ่งขึ้น"
 DOD_hungary.72.desc_HUN_nothing: "ฝายฮังการียื่นเงื่อนไขแบบประนีประนอมอยางนาประหลาดใจ ทรานซิลเวเนียทั้งหมดจะยังคงอยูกับโรมาเนีย แลกกับการยินยอมเล็กนอยบางประการแกชนกลุมนอย ผูแทนโรมาเนียเรียกรองอยางหนักแนนใหเรายอมรับขอเสนอนี้ โดยสัญญาวาจะผลักดันการยินยอมดังกลาวใหสําเร็จภายในไมกี่วันหากตกลงกันได"
 DOD_hungary.72.a: "ยอมรับขอเสนอ"
 DOD_hungary.72.b: "ผลักดันเงื่อนไขที่ดีกวา"
 DOD_hungary.73.t: "การประชุมเรื่องทรานซิลเวเนีย - วันที่ 3"
 DOD_hungary.73.desc: "เมื่อตัดสินใจปฏิเสธขอเสนอของฮังการีแลว บัดนี้ถึงคราวที่เราตองเสนอเงื่อนไขอื่น"
 DOD_hungary.73.a: "มอบทรานซิลเวเนียทั้งหมดใหฮังการี"
 DOD_hungary.73.b: "มอบทรานซิลเวเนียตอนเหนือใหฮังการี"
 DOD_hungary.73.c: "ทรานซิลเวเนียยังคงอยูกับโรมาเนีย"
 DOD_hungary.74.t: "การประชุมเรื่องทรานซิลเวเนีย - วันที่ 4"
 DOD_hungary.74.desc_HUN_all: "ฝายโรมาเนียดูจะรอนรนอยางมากที่จะใหเรื่องนี้จบลง เพราะพวกเขาปฏิเสธขอเสนอแบบประนีประนอมกอนหนาของเรา และกลับเสนอใหสงมอบทรานซิลเวเนียทั้งหมดแกฮังการีแทน ในการหารือสวนตัว คณะผูแทนของเราคิดไมออกวาเหตุใดพวกเขาจึงเสนอเชนนี้ แตดูเหมือนจะเปนขอเสนอที่จริงใจ เราควรรับไว"
 DOD_hungary.74.desc_compromise: "ชาวโรมาเนียเสนอทางออกแบบประนีประนอม โดยแบงทรานซิลเวเนียออกเปนสองสวน เมื่อพิจารณาความตึงเครียดระหวางสองประเทศ นี่อาจเปนทางออกที่ดีที่สุดเทาที่เปนไปได"
 DOD_hungary.74.desc_HUN_nothing: "ไมนาแปลกใจที่ฝายโรมาเนียไมยอมออนขอในประเด็นทรานซิลเวเนีย พวกเขาดูมุงมั่นเต็มที่ที่จะรักษาทรานซิลเวเนียทั้งหมดไวกับโรมาเนีย ในขั้นนี้ของการเจรจา เราแทบทําอะไรไมได - เราตองเลือกระหวางยอมรับขอเสนอหรือเดินออกจากที่ประชุม"
 DOD_hungary.74.a: "เรายอมรับ"
 DOD_hungary.74.b: "ผลของความลมเหลวครั้งนี้เปนความรับผิดชอบของพวกเขา!"
 DOD_hungary.75.a: "เราพยายามอยางเต็มที่แลว"
 DOD_hungary.80.t: "ฮังการีเรียกรองสโลวาเกียตอนใต"
 DOD_hungary.80.desc: "รัฐบาลฮังการีติดตอมาขอใหเรายกสโลวาเกียตอนใตใหพวกเขา โดยอางวาชาวฮังการีในพื้นที่ถูกปฏิบัติอยางไมเปนธรรม ในเวลาเดียวกัน สมาชิกของกลุมกอการรายที่เรียกวา "กองกําลังมอซอ" ถูกจับกุมขณะพยายามขามพรมแดนจากฮังการี แมคนเหลานี้จะอางวาไมเกี่ยวของกับรัฐบาลฮังการี แตกลับพบยุทโธปกรณที่มีเครื่องหมายทางการของฮังการีอยูกับพวกเขา\n\nบรรยากาศแหงสงครามคุกรุน แตเราอาจหาทางออกทางการทูตได หากไดรับการหนุนหลังจากชาติมหาอํานาจ"
 DOD_hungary.80.a: "เราไมมีหวังจะชนะสงคราม ยอมสละดินแดนเถิด"
 DOD_hungary.80.b: "รองขอตอพันธมิตรของเรา"
 DOD_hungary.80.c: "รองขอตอเยอรมนี"
 DOD_hungary.80.d: "เราจะไมยอมถูกรังแก!"
 DOD_hungary.81.t: "[From.GetNameDefCap]คืนสโลวาเกียตอนใต"
 DOD_hungary.81.desc: "[From.GetName]ไดสละสโลวาเกียตอนใตและถอนกําลังออกไปพนเสนปกปนเขตแลว บัดนี้เราควบคุมพื้นที่ไดอยางสมบูรณ"
 DOD_hungary.81.a: "ดี"
 DOD_hungary.82.t: "[CZE.GetName]รองขอความชวยเหลือ"
 DOD_hungary.82.desc: "เอกอัครราชทูตจาก[CZE.GetName]มาหาเราพรอมคําขอความชวยเหลืออยางเรงดวน เมื่อไมนานมานี้ [HUN.GetNameDef]ไดเปดฉากการบอนทําลายเสถียรภาพครั้งใหญที่มุงเปาไปยังสโลวาเกียตอนใต เปาหมายของพวกเขาชัดเจน - พวกเขาตองการสรางขออางในการรุกรานเพื่อปกปองผูคนที่พวกเขาถือวาเปนพลเมืองของตน \n\nรัฐบาล[CZE.GetAdjective]ไดขอการสนับสนุนจากเราในเรื่องนี้"
 DOD_hungary.82.a: "พวกเขาจะไดรับมัน"
 DOD_hungary.82.b: "นี่ไมใชการตอสูของเรา"
 DOD_hungary.83.t: "[SLO.GetName]รองขอความชวยเหลือ"
 DOD_hungary.83.desc: "เมื่อไมนานมานี้ [SLO.GetName]ถูก[HUN.GetNameDef]กดดันอยางหนักใหคืนพื้นที่ตามแนวพรมแดนดานใต ซึ่งในอดีตเคยเปนของฮังการี รัฐบาล[HUN.GetAdjective]สงสัญญาณวาพรอมจะสูเพื่อดินแดนนั้นหากจําเปน \n\nเราไมอาจปลอยใหสงครามปะทุขึ้นในภูมิภาคนั้นเพราะเรื่องเล็กเพียงเทานี้ และควรผลักดันทางออกทางการทูต"
 DOD_hungary.83.a: "บอกฮังการีใหดําเนินการไดเลย"
 DOD_hungary.83.b: "บอกฮังการีใหถอยไป"
 DOD_hungary.84.t: "[From.GetName]ปฏิเสธ"
 DOD_hungary.84.desc: "[From.GetName]ปฏิเสธที่จะหารือขอเรียกรองของเราดวยซํ้า โดยยืนกรานวาดินแดนนั้นเปนสวนหนึ่งของ[From.GetName]มาโดยตลอด และจะปกปองไว "จนถึงทหารคนสุดทาย กระสุนนัดสุดทาย และลมหายใจสุดทาย""
 DOD_hungary.84.a: "เราจะมีโอกาสของเรา แตไมใชตอนนี้"
 DOD_hungary.84.b: "ถาอยางนั้นเราจะตามใจพวกเขา"
 DOD_hungary.85.t: "[From.GetNameDefCap]ออกคําเตือนเรื่องสโลวาเกียตอนใต"
 DOD_hungary.85.desc: "รัฐบาลของ[From.GetNameDef]แจงเราวาบูรณภาพแหงดินแดนของสโลวาเกียไมใชเรื่องที่จะนํามาหารือ เรายังไดรับคําสั่งใหถอนกองกําลังประจําการหรือกองกําลังนอกแบบใด ๆ ที่เราอาจมีในพื้นที่ มิฉะนั้นจะตองรับผลที่ตามมา"
 DOD_hungary.85.a: "นี่หรือคือหลักการกําหนดใจตนเองของชาติ"
 DOD_hungary.85.b: "เราจะเอาสิ่งที่เปนของเรา"
 DOD_hungary.86.t: "[From.GetNameDefCap]ปฏิเสธที่จะสนับสนุนเรา"
 DOD_hungary.86.desc: "รัฐบาล[From.GetAdjective]ปฏิเสธคําขอของเราที่จะหนุนหลังเราเมื่อเผชิญการรุกรานอยางโจงแจงของ[HUN.GetAdjective] แมพวกเขาจะเห็นใจจุดยืนของเรา แตก็ไมยอมเสี่ยงเสียเลือดเนื้อหรือทรัพยสินเพื่อปกปองมัน"
 DOD_hungary.86.a: "เราไมอาจชนะสงครามไดดวยคําพูดอบอุนเพียงอยางเดียว"
 DOD_hungary.86.b: "ถาอยางนั้นเราจะสูตามลําพัง"
 DOD_hungary.90.t: "[HUN.GetNameDefCap]เรียกรอง[45.GetName]"
 DOD_hungary.90.desc: "รัฐบาล[HUN.GetAdjective]เริ่มกดดันหนักขึ้นในประเด็นวอยวอดีนา โดยระบุวาดินแดนนี้เคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ จึงควรไดรับคืน พวกเขาอางวาการรวมกับเซอรเบียเมื่อสิ้นมหาสงคราม "เปนโมฆะเนื่องจากแรงกดดันจากภายนอก" และดินแดนดังกลาวจึงยังคงเปนของ[HUN.GetAdjective]ตามกฎหมาย"
 DOD_hungary.90.a: "นี่ไมใชความขัดแยงที่เราจะชนะได"
 DOD_hungary.90.b: "เราจะไมสนับสนุนความเพอฝนของพวกเขา"
 DOD_hungary.91.t: "[FROM.GetNameDefCap]ยกวอยวอดีนาให"
 DOD_hungary.91.desc: "\n[FROM.GetNameDef]ตกลงยกวอยวอดีนาใหเรา กองกําลังของเราไดเขาควบคุมอยางสมบูรณแลว"
 DOD_hungary.91.a: "ดี"
 DOD_hungary.92.t: "[From.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
 DOD_hungary.92.desc: "ในการพบปะอันตึงเครียดกับ[FROM.GetLeader] คณะผูแทนของเราไดรับแจงวาอธิปไตยเหนือวอยวอดีนาไมใชเรื่องที่จะนํามาหารือ และไมวาอยางไรรัฐบาล[FROM.GetAdjective]จะไมมีวันกมหัวใหแรงกดดันเชนนี้ ประชาชนในวอยวอดีนาไดแสดงเจตจํานงไปแลวในป 1919 และพวกเขาเลือกจะอยูกับ[FROM.GetNameDef] สําหรับรัฐบาล[FROM.GetAdjective] เรื่องนี้ถือวาจบแลว"
 DOD_hungary.92.a: "บางทีอาจจบแลวจริง ๆ"
 DOD_hungary.92.b: "ขอการสนับสนุนจากเยอรมนี"
 DOD_hungary.92.c: "ขอการสนับสนุนจากอิตาลี"
 DOD_hungary.92.d: "รองขอตอเยอรมนีและอิตาลี"
 DOD_hungary.92.e: "เราจะจัดการเรื่องนี้ใหจบดวยตัวเอง"
 DOD_hungary.93.t: "ฮังการีเสนอใหจัดระเบียบยูโกสลาเวียใหม"
 DOD_hungary.93.desc: "ในการพบกันที่ซูริก ผูแทนรัฐบาล[HUN.GetAdjective]ไดหยั่งทาทีเราเรื่องการดําเนินการรวมกันตอ[YUG.GetNameDef] จนถึงตอนนี้รัฐบาล[YUG.GetAdjective]ยังคงปฏิเสธคําขอของ[HUN.GetAdjective]ที่จะคืนดินแดนซึ่ง[YUG.GetNameDef]ผนวกไปเมื่อสิ้นมหาสงคราม เมื่อพิจารณาวาเราเองก็มีดินแดนพิพาทกับ[YUG.GetNameDef]เชนกัน เราอาจรวมมือกันยื่นคําขาดอยางแข็งกราว แตนั่นอาจบีบใหเราตองทําสงครามเพราะเรื่องนี้"
 DOD_hungary.93.a: "พวกเขาจะไดรับการสนับสนุนจากเราอยางเต็มที่"
 DOD_hungary.93.b: "เราจะไมเขาไปเกี่ยวของกับเรื่องนี้"
 DOD_hungary.94.t: "[From.GetNameDefCap]เสนอสนับสนุนเราตอตานยูโกสลาเวีย"
 DOD_hungary.94.desc: "\nการเจรจาผานชองทางลับกับ[From.GetNameDef]นําไปสูขอตกลงในหลักการวา ยูโกสลาเวียควรถูกรื้อทิ้งทั้งหมด หรืออยางนอยก็ตองถูกลดขนาดลงอยางมาก \n\nดวยผูหนุนหลังรายใหม เราสามารถเจรจากับรัฐบาล[YUG.GetAdjective]จากจุดที่มีกําลังเหนือกวาอยางทวมทน เรายังอาจเลือกแกปญหาดวยกําลัง ในขณะที่กองทัพยูโกสลาเวียยังไมพรอม"
 DOD_hungary.94.a: "สงคําขาดไปยังเบลเกรด!"
 DOD_hungary.94.b: "โจมตีเดี๋ยวนี้!"
 DOD_hungary.95.t: "[From.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 DOD_hungary.95.desc: "\nหลังการเจรจาหลายรอบ ก็ยังไมสามารถบรรลุขอตกลงกับรัฐบาล[From.GetAdjective]ในประเด็นการจัดระเบียบยูโกสลาเวียใหม หนังสือที่[From.GetLeader]ลงนามดวยตนเองระบุวาประเด็นดินแดนที่คางคาอยูจะไดรับการแกไขแบบทวิภาคี "เมื่อสถานการณเรียกรอง""
 DOD_hungary.95.a: "นาเสียดาย"
 DOD_hungary.95.b: "ถาอยางนั้นเราจะลุยเองตามลําพัง!"
 DOD_hungary.96.t: "คําขาดจากบูดาเปสต"
 DOD_hungary.96.desc_HUN_GER: "แทนที่จะคลี่คลายสถานการณ การตอบโตอยางแข็งกราวของเราตอขอเรียกรองลาสุดของฮังการีเรื่องวอยวอดีนา ดูเหมือนจะนําไปสูขอตกลงระหวางฮังการีกับเยอรมนี ในสุนทรพจนลาสุด [GER.GetLeader]เรียกสโลวีเนียวา "หนึ่งในมณฑลเกาแกของไรชที่ยังไมไดรับการไถคืน" ซึ่งควรทวงคืนโดยเร็วที่สุด เอกอัครราชทูตฮังการีและเยอรมนีตางยื่นหนังสือมีใจความวาใหโอนวอยวอดีนาและสโลวีเนียไปอยูใตการควบคุมของพวกเขาโดยทันที"
 DOD_hungary.96.desc_HUN_ITA: "แทนที่จะคลี่คลายสถานการณ การตอบโตอยางแข็งกราวของเราตอขอเรียกรองลาสุดของฮังการีเรื่องวอยวอดีนา ดูเหมือนจะนําไปสูขอตกลงระหวางฮังการีกับอิตาลี ในสุนทรพจนลาสุด [ITA.GetLeader]กลาวถึงดัลมาเทียวาเปน "ฝงไกลของทะเลเอเดรียติกที่ยังไมไดรับการไถคืน" เอกอัครราชทูตฮังการีและอิตาลีตางยื่นหนังสือมีใจความวาใหโอนวอยวอดีนาและดัลมาเทียไปอยูใตการควบคุมของพวกเขาโดยทันที"
 DOD_hungary.96.desc_HUN_both: "การที่เราไมยอมกมหัวใหขอเรียกรองของฮังการี ไมไดทําใหบูดาเปสตเปลี่ยนใจ วาทกรรมโกรธเกรี้ยวที่ออกมาจากเมืองหลวงฮังการี บัดนี้มีถอยแถลงที่นาวิตกไมแพกันจากโรมและเบอรลินตามมา ทั้งสองชาติแสดงการสนับสนุนจุดยืนของฮังการี พรอมประกาศขอเรียกรองของตนเอง เอกอัครราชทูตจากทั้งสามประเทศไดมาปรากฏตัวพรอมกันที่กระทรวงการตางประเทศ เพื่อยื่นหนังสืออยางเปนทางการเรียกรองใหโอนวอยวอดีนา สโลวีเนีย และดัลมาเทียใหแกผูอางสิทธิ์แตละราย"
 DOD_hungary.96.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 DOD_hungary.96.b: "เรายอมตายในสนามรบดีกวา!"
 DOD_hungary.97.t: "ยูโกสลาเวียไมยอมจํานน"
 DOD_hungary.97.desc: "แมจะเผชิญกับความไดเปรียบที่ทวมทน รัฐบาล[YUG.GetAdjective]ก็ไมยอมฟงเหตุผล และบอกผูแทนของเราวาหากเราเลือกใชทางออกทางทหาร ก็จะพบวากองทัพ[YUG.GetAdjective]เตรียมพรอมไวเปนอยางดี"
 DOD_hungary.97.a: "ถาอยางนั้นก็สงคราม"
 DOD_hungary.100.t: "ฮังการีเรียกรองสโลวาเกีย"
 DOD_hungary.100.desc: "รัฐบาลฮังการีติดตอเราเรื่องสถานะในอนาคตของสโลวาเกีย พวกเขาเชื่ออยางแรงกลาวาควรมีอํานาจควบคุมชะตากรรมของสโลวาเกียอยางเต็มที่ เนื่องจากสโลวาเกียเคยเปนสวนหนึ่งของฮังการีในสมัยจักรวรรดิ\n\nแมคณะผูแทนฮังการีจะหลีกเลี่ยงการขมขูอยางชัดแจง แตหนวยขาวกรองของเรารายงานความเคลื่อนไหวที่นากังวลภายในกองทัพฮังการี"
 DOD_hungary.100.a: "เราไมมีทางเลือก"
 DOD_hungary.100.b: "เราจะไมยอมถอยแมแตนิ้วเดียว"
 DOD_hungary.101.t: "โอนสโลวาเกียแลว"
 DOD_hungary.101.desc: "สโลวาเกียกลับมาอยูใตการควบคุมของเราแลว คําถามตอนนี้คือเราควรจัดการปกครองอยางไร แมหลายคนในรัฐบาลจะสนับสนุนการผนวกโดยสมบูรณ โดยเรียกวาเปน "การคืนสูพรมแดนทางประวัติศาสตร" แตบางสวนก็กังวลถึงผลของการพยายามผนวกรวมผูที่ไมใชชาวฮังการีจํานวนมากเขาสูรัฐของเรา ทางเลือกที่พวกเขาตองการคือการตั้งรัฐบาลที่มีการกระจายอํานาจในบราติสลาวา ซึ่งมีอํานาจบางสวนเหนือนโยบายภายใน แตดําเนินนโยบายสอดคลองกับเราอยางใกลชิดในเรื่องอื่นทั้งหมด"
 DOD_hungary.101.a: "เราจะกลับคืนสูพรมแดนเดิม"
 DOD_hungary.101.b: "รัฐบาลหุนเชิดนาจะดีกวา"
 DOD_hungary.102.t: "[From.GetNameDefCap]ปฏิเสธที่จะโอนสโลวาเกีย"
 DOD_hungary.102.desc: "การเจรจาเรื่องการโอนสโลวาเกียชะงักงันแทบจะทันที คณะผูแทน[From.GetAdjective]แถลงจุดยืนซึ่งโดยพื้นฐานคือการคงสถานะเดิม โดยไมเสนอการเปลี่ยนแปลงที่สําคัญใด ๆ แนนอนวาคณะผูแทนของเรายํ้าวาเราถือวาสโลวาเกียเปนดินแดนของเรา ซึ่งถูกยึดไปอยางผิดกฎหมายเมื่อสิ้นมหาสงคราม\n\nไมมีความคืบหนาใด ๆ และความหงุดหงิดที่เพิ่มขึ้นของทั้งสองฝายทําใหไมนาจะมีความคืบหนาเกิดขึ้น"
 DOD_hungary.102.a: "ปลอยเรื่องนี้ไป"
 DOD_hungary.102.b: "ติดตอเยอรมนีเรื่องการแบงประเทศนี้"
 DOD_hungary.103.t: "ฮังการีตองการแบง[CZE.GetNameDef]"
 DOD_hungary.103.desc: "รัฐบาลฮังการีติดตอเราพรอมขอเสนอใหแบง[CZE.GetNameDef] เราจะไดสวนตะวันตกของประเทศ ขณะที่ฮังการีจะไดสโลวาเกียเกือบทั้งหมด โดยเสนปกปนเขตระหวางสองประเทศจะแบงประเทศนั้นออกเปนสองสวนโดยประมาณ \n\nพวกเขายืนยันกับเราวาตราบใดที่สุดทายพวกเขาไดสวนแบงของตน พวกเขายินดีใหเราเปนฝายลงมือกอน"
 DOD_hungary.103.a: "เราจะคํานึงถึงผลประโยชนของพวกเขา"
 DOD_hungary.103.b: "พวกเขาจะไมไดอะไรเลย"
 germany.55.do: "รักษาสัญญาที่ใหไวกับฮังการี"
 DOD_hungary.104.t: "[GER.GetLeader]เห็นชอบ"
 DOD_hungary.104.desc: "ในโทรเลขลับ รัฐบาลเยอรมนียืนยันกับเราวาผลประโยชนของเราจะไดรับการพิจารณาเมื่อมีการตัดสินชะตากรรมของ[CZE.GetNameDef] สวนจะเปนเมื่อใดนั้นยังไมมีใครรู"
 DOD_hungary.104.a: "ดี"
 DOD_hungary.105.t: "เยอรมนีปฏิเสธที่จะแบง[CZE.GetName]"
 DOD_hungary.105.desc: "\nมีรายงานวาเมื่อไดยินขอเสนอของเราที่จะแบง[CZE.GetNameDef] [From.GetLeader]ถึงกับเดือดดาล และเรียกเราวา "พวกหมดยุคที่ไมมีความเขาใจแมแตนอยเกี่ยวกับความเปนจริงของโลก" \n\nไมตองบอกก็รูวาขอเสนอของเราไมไดรับการตอบรับ"
 DOD_hungary.105.a: "ชางหยาบคายนัก"
 DOD_hungary.105.b: "เราจะเอาสิ่งที่เปนของเรา"
 DOD_hungary.106.t: "[From.GetLeader]ผิดสัญญา"
 DOD_hungary.106.desc: "แม[From.GetLeader]จะใหสัญญาเปนลายลักษณอักษร แตรัฐบาลเยอรมนีก็ไมไดทําตามพันธะที่ใหไวกับเรา ในการเจรจาลาสุดเรื่องชะตากรรมของ[CZE.GetNameDef] เราไมมีบทบาทใดเลยนอกจากเปนเครื่องมือกดดันใหผูอื่นยอมทําตาม ดูเหมือนวา[From.GetLeader]ไมเคยตั้งใจจะรักษาคําพูดเลย"
 DOD_hungary.106.a: "ประทวงดวยถอยคําที่รุนแรงที่สุด"
 DOD_hungary.106.b: "ระดมกองทัพ"
 DOD_hungary.107.t: "ฮังการีเรียกรองอํานาจเหนือเรา"
 DOD_hungary.107.desc_SLO_independent: "หลังความเคลื่อนไหวอยางคึกคักในกองทัพฮังการีหลายสัปดาห [HUN.GetLeader]ไดออกแถลงการณประกาศวาสถานการณปจจุบันในสโลวาเกียเปนขอกังวลรายแรงของฮังการี และเรียกรองการรับประกันบางประการจากเรา \n\nนอกเหนือจากเรื่องอื่น ๆ เราจะตองปรึกษาพวกเขากอนเขารวมพันธมิตรหรือลงนามในสนธิสัญญาใด ๆ และตองยอมรับคณะผูแทนทางทหารเพื่อประสานงานกองทัพของเรา"
 DOD_hungary.107.desc_SLO_puppet: "คณะผูแทนฮังการีเดินทางมาถึงเพื่อหารือประเด็นสโลวาเกีย พวกเขาถือวาประเทศนี้อยูในเขตอิทธิพลทางประวัติศาสตรของตน และกังวลอยางยิ่งตออิทธิพลที่เรามีตอนโยบายของสโลวาเกีย\n\nหัวหนาคณะผูแทนถึงกับกลาวเปนนัยวาดินแดนสโลวาเกียอาจถูกใชเปนฐานกระโดดในการรุกรานฮังการี\n\nพวกเขาเสนอวารัฐบาลฮังการีควรไดรับอนุญาตใหมีอิทธิพลตอสโลวาเกียในระดับใกลเคียงกับที่เรามีอยูในปจจุบัน"
 DOD_hungary.107.a: "ก็ได"
 DOD_hungary.107.b: "ไมมีทาง"
 DOD_hungary.108.t: "สโลวาเกียอยูใตการควบคุมของเรา"
 DOD_hungary.108.desc: "ผูมีอํานาจเต็มของเราไดเขาประจําที่บราติสลาวาแลว เพื่อใหแนใจวารัฐบาลสโลวาเกียจะดําเนินนโยบายสอดคลองกับเราอยางใกลชิด"
 DOD_hungary.108.a: "ดี"
 DOD_hungary.109.t: "ถูกปฏิเสธการควบคุมสโลวาเกีย"
 DOD_hungary.109.desc: "แมเราจะพยายามอยางเต็มที่ รัฐบาลสโลวาเกียก็ปฏิเสธที่จะยอมรับบทบาทเปนผูอยูใตอํานาจของเรา บัดนี้เราตองพิจารณาความเปนไปไดของการใชกําลังทหารเพื่อรักษาความมั่นคงของพรมแดนดานเหนือ"
 DOD_hungary.109.a: "ไมทางใดก็ทางหนึ่ง เราจะตองไดมันมา"
 DOD_hungary.110.t: "ฮังการีตองการกดดันโรมาเนีย"
 DOD_hungary.110.desc: "[HUN.GetLeader]เดินทางมาถึงมอสโกเพื่อหารือประเด็นโรมาเนีย เมื่อสิ้นมหาสงคราม โรมาเนียไดยึดดินแดนหลายแหงไปอยางผิดกฎหมาย รวมถึงเบสซาราเบียและทรานซิลเวเนีย สหายชาวฮังการีของเราเสนอใหเรากดดันโรมาเนียใหคืนดินแดนเหลานั้นแกเจาของที่ชอบธรรม"
 DOD_hungary.110.a: "ขอเสนอที่ยอดเยี่ยม สหาย!"
 DOD_hungary.110.b: "ยังไมใชตอนนี้"
 DOD_hungary.111.t: "คําขาดของฝายคอมมิวนิสต"
 DOD_hungary.111.desc: "รัฐบาลของ[HUN.GetNameDef]และ[SOV.GetNameDef]ไดยื่นหนังสือรวมกัน ระบุวาพวกเขาถือวาการผนวกทรานซิลเวเนียและเบสซาราเบียของเราไมชอบธรรม ในมุมมองของพวกเขา ดินแดนเหลานี้อยูภายใตการยึดครองที่ผิดกฎหมาย และพวกเขาใหโอกาสสุดทายแกเราในการถอนตัวออกจากพื้นที่เหลานั้น"
 DOD_hungary.111.a: "เราไมมีทางเลือก"
 DOD_hungary.111.b: "บางทีเราอาจประนีประนอมกันได"
 DOD_hungary.111.c: "รัฐบาลคอมมิวนิสตอาจไดผลลัพธที่ดีกวา"
 DOD_hungary.111.d: "ดินแดนเหลานี้ศักดิ์สิทธิ์!"
 DOD_hungary.112.t: "[SOV.GetLeader]ปฏิเสธขอเสนอของเรา"
 DOD_hungary.112.desc: "ในการเดินทางเยือนมอสโกครั้งลาสุด [HUN.GetLeader]ตองทนประชุมอันแสนทรมานหลายชั่วโมงกับ[SOV.GetLeader] ซึ่งเรียกเขาวาคนโงซํ้าแลวซํ้าเลาที่พยายามเสนอแผนการที่ผิดพลาดอยางเห็นไดชัดเชนนี้ ดูเหมือนวาเรายังไมเขาใจบทบาทของดินแดนแหงชาติในการตอสูเชิงปฏิวัติดีพอ และจึงไดขอสรุปที่ผิดเกี่ยวกับยุทธศาสตรที่ควรเปน"
 DOD_hungary.112.a: "เราจะเดินหนาตอตามลําพัง"
 DOD_hungary.112.b: "เราจะทบทวนความผิดพลาดของเรา"
 DOD_hungary.113.t: "โรมาเนียเสนอการประนีประนอม"
 DOD_hungary.113.desc: "รัฐบาลโรมาเนียภายใต[ROM.GetLeader]ไดสงคณะผูแทนมายังมอสโกเพื่อเจรจาเรื่องดินแดนพิพาท ดูเหมือนพวกเขาเชื่อวาจะสามารถหาทางออกแบบประนีประนอมได โดยยอมสละพื้นที่พิพาทสวนหนึ่งเพื่อรักษาอีกสวนไว หากเราตกลง เราควรเรียกรองสวนใด?"
 DOD_hungary.113.a: "บีบใหพวกเขาสละทรานซิลเวเนีย"
 DOD_hungary.113.b: "บีบใหพวกเขาสละเบสซาราเบีย"
 DOD_hungary.113.c: "ยํ้าขอเสนอแรกของเราอยางหนักแนนยิ่งขึ้น"
 DOD_hungary.114.t: "โรมาเนียเสนอการยินยอมทางการเมือง"
 DOD_hungary.114.desc: "ในความเคลื่อนไหวที่นาประหลาดใจ [ROM.GetLeader]เสนอจะแบงปนอํานาจกับพรรคคอมมิวนิสตโรมาเนีย หากเรารับประกันพรมแดนของพวกเขาเปนการตอบแทน นี่อาจเปนหนทางที่ดีในการขยายอิทธิพลของเราในภูมิภาคโดยไมตองเสี่ยงทําสงคราม"
 DOD_hungary.114.a: "การปฏิวัติยังคงรุดหนาตอไป"
 DOD_hungary.114.b: "ยืนกรานเรื่องดินแดน"
 DOD_hungary.115.t: "โรมาเนียปฏิเสธขอเรียกรอง"
 DOD_hungary.115.desc: "รัฐบาล[ROM.GetAdjective]ปฏิเสธที่จะเจรจาเรื่องดินแดนพิพาท ในการพบปะสวนตัว รัฐมนตรีตางประเทศโรมาเนียถึงกับบอกเอกอัครราชทูตของเราวา หนทางเดียวที่เราจะไดดินแดนเหลานี้คือตองสังเวยทหารนับลานคน"
 DOD_hungary.115.a: "ไมคุมที่จะพยายาม"
 DOD_hungary.115.b: "ยืนกรานเรื่องดินแดน"
 DOD_hungary.115.c: "ถาอยางนั้นก็จะไดเห็นทหารนับลานคน"
 DOD_hungary.116.t: "[SOV.GetLeader]ตอบรับขอเสนอ"
 DOD_hungary.116.desc_transylvania: "หลังการพบปะกับคณะผูแทนของเรา [SOV.GetLeader]ไดเสนอการประนีประนอมในรูปแบบหนึ่ง [SOV.GetNameDefCap]เห็นชอบในหลักการวาเบสซาราเบียควรอยูกับเรา แต "คณะกรรมาธิการพรมแดนอิสระ" ซึ่งประกอบดวยเจาหนาที่จากสหภาพโซเวียตและตูวาไดขอสรุปวาทรานซิลเวเนียสวนใหญควรตกเปนของฮังการี"
 DOD_hungary.116.desc_bessarabia: "หลังการพบปะกับคณะผูแทนของเรา [SOV.GetLeader] ไดเสนอทางประนีประนอมบางอยางใหเรา โดยที่คณะผูแทนฮังการีไมไดมารวมดวยอยางเห็นไดชัด เราไดรับแจงวาโซเวียตยินดีจะยกเลิกการเรียกรองทรานซิลเวเนีย หากเรายอมยกเบสซาราเบียใหแกพวกเขา"
 DOD_hungary.116.desc_no_deal: "ระหวางการพบปะกับคณะผูแทนของเรา ฝายโซเวียต-ฮังการีไดยํ้าขอเรียกรองของตนอีกครั้ง หากทั้งเบสซาราเบียและทรานซิลเวเนียไมถูกสงมอบใหแกผูอางสิทธิ์แตละฝาย พวกเขาจะพิจารณาใชมาตรการทางทหาร"
 DOD_hungary.116.a: "รับได"
 DOD_hungary.116.b: "เราจะไมมีวันยอมรับเงื่อนไขเชนนี้!"
 DOD_hungary.117.t: "[SOV.GetLeader] ยอมรับขอเสนอ"
 DOD_hungary.117.desc: "โซเวียตยอมรับขอเสนอของเราที่จะใหคอมมิวนิสตขึ้นกุมอํานาจ [SOV.GetLeader] ใหคํามั่นกับคณะผูแทนของเราดวยตนเองวาจะไมมีการอางสิทธิ์ดินแดนใดตอเราอีก อยางนอยก็ไมใชจากโคมินเทิรน"
 DOD_hungary.117.a: "เราจะทวงสัญญานั้น"
 DOD_hungary.118.t: "โซเวียตถอย"
 DOD_hungary.118.desc: "การตอบโตอยางแข็งกราวของเราตอการรุกรานของโซเวียต-ฮังการีดูจะเกิดผล หนังสือพิมพ 'ปราฟดา' เพิ่งลงบทความหลักคัดคาน "การอางสิทธิ์แบบลัทธิแกที่ตอตานสังคมนิยม" โดยยกประเด็นการอางสิทธิ์เหนือเบสซาราเบียและทรานซิลเวเนียขึ้นมาเปนพิเศษวาเปน "พฤติกรรมแบบจักรวรรดินิยมที่ชาติสังคมนิยมที่พัฒนาแลวทั่วโลกไมกระทํากัน"\n\nอยางไรก็ตาม ปฏิกิริยาในบูดาเปสตกลับเงียบเชียบอยางยิ่ง เปนไปไดวา [HUN.GetLeader] ยังคงหมายตาดินแดนของเราอยู"
 DOD_hungary.118.a: "อยากเห็นพวกมันลองดูนัก"
 DOD_hungary.120.t: "ฮังการีเสนอใหสนับสนุนเชโกสโลวาเกีย"
 DOD_hungary.120.desc: "[HUN.GetLeader] เดินทางไปมอสโกพรอมขอเสนอใหรวมกันรับประกัน [CZE.GetNameDef] แลกกับการยกเลิกขอจํากัดตอพรรคคอมมิวนิสต และการโอนอธิปไตยเหนือสโลวาเกียตอนใตใหแกฮังการี"
 DOD_hungary.120.a: "ความคิดที่ยอดเยี่ยม"
 DOD_hungary.120.b: "ทําไมเราตองเขาไปพัวพันกับสงครามของพวกจักรวรรดินิยมดวย?"
 DOD_hungary.121.t: "โคมินเทิรนเสนอการรับประกัน"
 DOD_hungary.121.desc: "เอกอัครราชทูตของ [HUN.GetNameDef] และ [SOV.GetNameDef] ไดเขาพบเราพรอมขอเสนอรวมกันที่จะรับประกันพรมแดนของเราจากการรุกรานของศัตรูใด ๆ แลกกับการที่เราตองรับประกันที่นั่งในรัฐบาลใหแกพวกคอมมิวนิสต ทั้งนี้ฮังการียังผูกพันธะของตนไวกับการคืนสโลวาเกียตอนใตใหอยูใตการควบคุมของพวกเขาดวย"
 DOD_hungary.121.a: "เปนราคาที่ยอมรับได"
 DOD_hungary.121.b: "นี่แหละคือขอเรียกรองที่เราตองปองกันตัวจากมัน!"
 DOD_hungary.122.t: "เชโกสโลวาเกียปฏิเสธขอเสนอของเรา"
 DOD_hungary.122.desc: "ขอเสนอการรับประกันของเราไมไดรับการตอบรับอยางกระตือรือรนนักจากชาว[CZE.GetAdjective] สัมปทานทางการเมืองที่เราขอไปไดกอใหเกิดความวุนวายใน [CZE.GetNameDef] โดยนายพลและบุคคลสําคัญทางการเมืองหลายคนขูจะลาออกหากรัฐบาลยอมรับ\n\nรัฐบาล[CZE.GetAdjective]ไดปฏิเสธขอเสนอของเราอยางเปนทางการ โดยอางความกังวลอยางยิ่งวาความชวยเหลืออาจมาไมทันการณ"
 DOD_hungary.122.a: "เปนปฏิกิริยาที่เขาใจได"
 DOD_hungary.122.b: "ติดตอเยอรมัน"
 DOD_hungary.123.t: "[SOV.GetLeader] ปฏิเสธขอเสนอแนะของเรา"
 DOD_hungary.123.desc: "[SOV.GetLeader] ยืนอยูหนาแผนที่ยุโรปขนาดใหญ แลวบรรยายใหคณะผูแทนของเราฟงนานนับชั่วโมง ชี้จุดบกพรองและขอผิดพลาดในแผนที่เสนอมาครั้งแลวครั้งเลา และพูดยืดยาวถึงความโงเขลาเปนพิเศษของขอเสนอของเรา ถึงขั้นกลาวหาวาเราสมคบกับพวกจักรวรรดินิยม\n\nคณะผูแทนของเรากลับจากมอสโกมามือเปลา แตก็ยังรอดชีวิต"
 DOD_hungary.123.a: "บางทีนี่อาจไมใชแผนที่ดีที่สุดก็ได"
 DOD_hungary.123.b: "ติดตอเยอรมัน"
 DOD_hungary.124.t: "[From.GetNameDefCap] เสนอแบงเชโกสโลวาเกีย"
 DOD_hungary.124.desc: "รัฐมนตรีตางประเทศ[From.GetAdjective]เดินทางมาถึงเบอรลินเพื่อหารือแผนการแบง [CZE.GetNameDef] ออกเปนสองสวน คูสัญญาแตละฝายในสนธิสัญญาที่เสนอนี้จะควบคุมดินแดนสวนของตนอยางเต็มที่ แนนอนวาเราจะไดสวนตะวันตกอยางโบฮีเมียและโมราเวีย สวนพวกเขาจะไดสโลวาเกีย"
 DOD_hungary.124.a: "แผนการที่นาสนใจ"
 DOD_hungary.124.b: "เราจะไมยอมใหพวกเขามากาวกายในละแวกบานของเรา!"
 DOD_hungary.126.t: "ชาว[CZE.GetAdjective]ปฏิเสธ"
 DOD_hungary.126.desc: "มีรายงานวารัฐบาล[CZE.GetAdjective]ไดปฏิเสธขอเสนอการรับประกัน เนื่องจากสัมปทานที่ถูกเรียกรองเปนการตอบแทนนั้น 'เกินจะทนได'\n\nอยางไรก็ตาม เอกอัครราชทูตของเราประจํา [SOV.GetNameDef] รายงานวามีความเคลื่อนไหวคึกคักในกระทรวงการตางประเทศ[SOV.GetAdjective] ขาวลือในแวดวงการทูตชี้วาอาจมีการตกลงกับเยอรมนี"
 DOD_hungary.126.a: "คอยดูกันตอไป"
 DOD_hungary.127.t: "เยอรมนียอมแบง [CZE.GetNameDef]"
 DOD_hungary.127.desc: "[GER.GetLeader] ไดลงนามในสนธิสัญญาลับแหงเบอรลิน ซึ่งรัฐบาลเยอรมนียินยอมแบง [CZE.GetNameDef] ออกเปนสองเขตอิทธิพล และสัญญาวาจะเคารพการตัดสินใจใด ๆ ที่เกี่ยวกับสโลวาเกีย"
 DOD_hungary.127.a: "ชัยชนะทางการทูต"
 DOD_hungary.127.b: "นี่ไมใชขอตกลงที่เราคาดหวังไว"
 DOD_hungary.128.t: "เยอรมนีปฏิเสธขอเสนอ"
 DOD_hungary.128.desc: "ในการพบปะกับเอกอัครราชทูตของเรา [GER.GetLeader] ไดแสดงใหเห็นชัดเจนวารัฐบาลของเขาถือวา [CZE.GetNameDef] อยูในเขตอิทธิพลของตนโดยสมบูรณ และการแทรกแซงใด ๆ ตอพรมแดนของประเทศนั้นจะถือเปนการกระทําที่เปนปรปกษ"
 DOD_hungary.128.a: "หยาบคาย"
 DOD_hungary.128.b: "พวกเขาแคขูเทานั้นแหละ"
 DOD_hungary.129.t: "คําขาดจากเยอรมนี"
 DOD_hungary.129.desc: "วันนี้เอกอัครราชทูตเยอรมนีไดยื่นบันทึกจาก [GER.GetLeader] เรียกรองใหโอนอํานาจการปกครองใหแกเขาทันทีในฐานะ "ไรชโพรเทคเตอร" คนใหม ระหวางรอผูบริหารที่คัดเลือกมาเปนพิเศษจากเบอรลิน ในบันทึกฉบับเดียวกัน เอกอัครราชทูตยังเรียกรองให [From.From.GetNameDef] ไดรับสิทธิ์ทํานองเดียวกันเหนือสโลวาเกีย\n\nหากเราปฏิเสธ บันทึกนั้นระบุวาจะมี "ปฏิบัติการทางทหารที่รวดเร็วและเด็ดขาด""
 DOD_hungary.129.a: "เราไมมีทางเลือก"
 DOD_hungary.129.b: "โยนมันออกนอกหนาตางไปเลย!"
 DOD_hungary.130.t: "ชาว[From.GetAdjective]ลมการเจรจา"
 DOD_hungary.130.desc: "แมจะประสบความสําเร็จในชวงแรก แตดูเหมือนวารัฐบาลของ [From.GetLeader] จะเปลี่ยนใจเกี่ยวกับสนธิสัญญาที่เสนอในนาทีสุดทาย พวกเขาเงียบมากเรื่องเหตุผลที่แทจริงของการตัดสินใจครั้งนี้ แตหนวยขาวกรองของเราสงสัยวาเปนเพราะกองทัพของพวกเขายังไมพรอม"
 DOD_hungary.130.a: "นาเสียดาย"
 DOD_hungary.140.t: "[FROM.GetNameDefCap] เรียกรองสิทธิ์ในการติดอาวุธใหม"
 DOD_hungary.140.desc: "[HUN.GetLeader] ไดประกาศตอสาธารณะวารัฐบาลของเขาจะแสวงหาการสนับสนุนจากประเทศเพื่อนบานเพื่อใหมีการแกไขสนธิสัญญาทรียานง โดยอางถึงสถานการณการเมืองในยุโรปที่เลวรายลงเรื่อย ๆ และความลมเหลวโดยสิ้นเชิงของสันนิบาตชาติในการยับยั้งเรื่องนี้ [HUN.GetLeader] ไมไดเอยถึงการอางสิทธิ์ดินแดนใด ๆ แตกลาวถึงเพียงขอจํากัดที่มีตอกองทัพฮังการีเทานั้น\n\nคณะผูแทนจากฮังการีไดเดินทางมาถึงเมืองหลวงของเราเพื่อขอความเห็นชอบอยางเปนทางการตอการติดอาวุธใหมของฮังการี"
 DOD_hungary.140.a: "ตองใหพวกเขาไดปองกันตนเอง"
 DOD_hungary.140.b: "พวกนี้เคยลากโลกเขาสูสงครามมาแลวครั้งหนึ่ง!"
 DOD_hungary.141.t: "[HUN.GetNameDefCap] ไดรับการสนับสนุนจาก[From.GetAdjective]ในการติดอาวุธใหม"
 DOD_hungary.141.desc: "รัฐบาล[From.GetAdjective]ไดลงนามในสนธิสัญญากับฮังการีโดยไมปรึกษาเรา เปนการแกไขหรือยกเลิกขอจํากัดของสนธิสัญญาทรียานง บัดนี้ฮังการีสามารถติดอาวุธใหมไดอยางเสรีและพัฒนายุทโธปกรณทางทหารไดทุกประเภท รวมถึงรถถังและเครื่องบิน\n\nแมจะเปนความลับที่ใคร ๆ ก็รูวาฮังการีขยายกองทัพมาตลอด แตขอตกลงฉบับใหมนี้จะทําใหพวกเขากลับมาเปนภัยคุกคามทางทหารตอเราไดอีกครั้งในไมชา"
 DOD_hungary.141.a: "เราตองโจมตีกอนที่จะสายเกินไป!"
 DOD_hungary.141.b: "ยื่นหนังสือประทวงทางการทูต"
 DOD_hungary.141.c: "ดําเนินตามแนวทางของ[From.GetAdjective]"
 DOD_hungary.142.t: "ขอตกลงเบลด"
 DOD_hungary.142.desc: "เราไดรับการสนับสนุนจาก[From.GetAdjective]ในการแกไขสนธิสัญญาทรียานงบางสวน ขอจํากัดทั้งหมดตอกองทัพของเราถูกยกเลิกแลว ผูตรวจสอบอาวุธระหวางประเทศไดออกจากประเทศไป และกระทรวงกลาโหมไดรางแผนเบื้องตนสําหรับการขยายกองทัพอยางพอประมาณ"
 DOD_hungary.142.a: "ยอดเยี่ยม"
 DOD_hungary.143.t: "[From.GetNameDefCap] ยื่นหนังสือประทวง"
 DOD_hungary.143.desc: "เอกอัครราชทูต[From.GetAdjective]ไดสงบันทึกดังตอไปนี้: \n"รัฐบาลแหง [From.GetNameDef] เฝาติดตามพัฒนาการลาสุดใน [HUN.GetNameDef] ดวยความกังวลอยางยิ่ง สนธิสัญญาทรียานงเปนหลักประกันสันติภาพและเสถียรภาพในภูมิภาคมาชานาน แมรัฐบาล[From.GetAdjective]จะยอมรับโดยหลักการวาทุกชาติควรไดกําหนดชะตากรรมของตนเอง แตเราขอเรียกรองอยางหนักแนนที่สุดใหรัฐบาลแหง [HUN.GetNameDef] ปฏิบัติตามสนธิสัญญา ผลที่ตามมาจากการบอนทําลายเสถียรภาพของภูมิภาคเพิ่มเติมอาจลุกลามจนควบคุมไมไดอยางรวดเร็ว""
 DOD_hungary.143.a: "ดีสําหรับพวกเขา"
 DOD_hungary.144.t: "[From.GetNameDefCap] ยืนกรานเรื่องการติดอาวุธใหม"
 DOD_hungary.144.desc: "การเจรจาเรื่องการแกไขสนธิสัญญาทรียานงไมคืบหนาไปไกลกวาขั้นแรกเริ่มนัก รัฐบาลแหง [From.GetNameDef] แสดงชัดวาจะไมขยับจากจุดยืนที่จะรักษาสถานะเดิมแมแตนอย\n\nเราจะยอมรับเรื่องนี้ หรือพยายามหาการสนับสนุนจากฝายที่สามก็ได"
 DOD_hungary.144.a: "เราตองยอมตอแรงกดดันของพวกเขา"
 DOD_hungary.144.b: "รองขอการสนับสนุนจากมหาอํานาจ"
 DOD_hungary.145.t: "รองขอการสนับสนุน"
 DOD_hungary.145.desc: "เมื่อการเจรจาที่เบลดเขาสูทางตันโดยสิ้นเชิง เราตองชิงความริเริ่มทางการทูตกลับคืนมาโดยดึงผูเลนภายนอกเขามา หากเราไดชาติมหาอํานาจมาหนุนหลัง [From.From.GetLeader] อาจยังถูกโนมนาวใหยอมได เราควรติดตอใคร?"
 DOD_hungary.145.a: "เยอรมนี"
 DOD_hungary.145.b: "ฝรั่งเศส"
 DOD_hungary.145.c: "สหภาพโซเวียต"
 DOD_hungary.145.d: "อิตาลี"
 DOD_hungary.145.e: "สหราชอาณาจักร"
 DOD_hungary.146.t: "[HUN.GetLeader] รองขอการสนับสนุนทางการทูต"
 DOD_hungary.146.desc: "ขณะนี้รัฐบาลฮังการีกําลังพยายามแกไขสนธิสัญญาทรียานงเพื่อใหฮังการีเริ่มฟนฟูกองทัพได การเจรจาที่เบลดชะงักงันมาหลายวันแลว เอกอัครราชทูตฮังการีไดเขาพบรัฐบาลของเราพรอมคําขอใหใชแรงกดดันทางการทูตตออีกฝาย\n\nกระทรวงการตางประเทศเตือนวาการเขาขางฮังการียอมสงผลเสียตอความสัมพันธกับเพื่อนบานของฮังการีอยางแนนอน และเปลี่ยนดุลอํานาจในภูมิภาค อยางไรก็ตาม การปฏิเสธชาวฮังการีอาจทําใหพวกเขาเคลื่อนไหวอยางกาวราวและละทิ้งการทูตไปโดยสิ้นเชิง ซึ่งอาจบอนทําลายเสถียรภาพของทั้งภูมิภาค"
 DOD_hungary.146.a: "ฮังการีตองไดรับอนุญาตใหติดอาวุธใหม"
 DOD_hungary.146.b: "ฮังการีตองไมไดรับอนุญาตใหติดอาวุธใหม"
 DOD_hungary.147.t: "[From.GetNameDefCap] แทรกแซงวิกฤตการติดอาวุธใหมของฮังการี"
 DOD_hungary.147.desc: "ในจดหมายสวนตัว [From.GetLeader] ไดเรียกรองใหเราทบทวนจุดยืนตอประเด็นการติดอาวุธใหมของฮังการี โดยเฉพาะอยางยิ่ง เขาชี้วาแมจะอนุญาตใหติดอาวุธใหมไดตอนนี้ ชาวฮังการีก็ยังตองใชเวลาหลายปกวาจะสรางกองทัพที่แข็งแกรงพอจะคุกคามใครในภูมิภาคได \n\nการยืนกรานในเรื่องนี้จะทําใหเราโดดเดี่ยวทางการทูต เราตองตัดสินใจวาความมั่นคงที่เพิ่มขึ้นนั้นคุมคาหรือไม"
 DOD_hungary.147.a: "ขอภาวนาใหพวกเขาคิดถูก"
 DOD_hungary.147.b: "เรารูดีวาอะไรดีที่สุดสําหรับเรา"
 DOD_hungary.148.t: "การประชุมเบลดลมเหลว"
 DOD_hungary.148.desc: "หลังการเจรจาอันดุเดือดหลายวัน การประชุมที่เบลดก็ไมมีความคืบหนาใด ๆ และคณะผูแทนตางเดินทางกลับประเทศของตน แมแตการแทรกแซงของ [From.From.GetLeader] ก็ไมเกิดผลใด ๆ \n\nในหนวยงานการทูตมีความขุนเคืองอยูไมนอย นักการทูตอาวุโสหลายคนเสนอวาเราควรติดอาวุธใหมไปเลย เพียงเพื่อให [From.GetLeader] เห็นวาจะเกิดอะไรขึ้นหากเขาปฏิเสธการเจรจา"
 DOD_hungary.148.a: "เราเสี่ยงทําสงครามไมได"
 DOD_hungary.148.b: "ถึงเวลาลงมือทํา ไมใชแคพูด!"
 DOD_hungary.150.t: "การประกวดเครื่องบินขับไล"
 DOD_hungary.150.desc: "การศึกษาการรบทางอากาศสมัยใหมเมื่อไมนานมานี้ไดเผยใหเห็นจุดออนรายแรงของกองทัพอากาศเรา เครื่องบินขับไลของเราลาหลังพัฒนาการในประเทศอื่นอยางมาก กระทรวงการบินจึงเริ่มโครงการเรงดวนเพื่อจัดหาเครื่องบินขับไลสมัยใหมโดยเร็วที่สุด เนื่องจากการพัฒนาเองในประเทศจะใชเวลานานเกินรับได จึงตัดสินใจซื้อสิทธิบัตรการผลิตจากตางประเทศ และไดอนุมัติงบประมาณเพิ่มเติมแลว\n\nผูเชี่ยวชาญยังเห็นตางกันวาเครื่องบินแบบใดเหมาะที่สุดสําหรับการปรับปรุงกองบินขับไลของเราใหทันสมัย"
 DOD_hungary.150.a: "เครื่องบินสกัดกั้นขนาดเล็กนํ้าหนักเบา"
 DOD_hungary.150.b: "เครื่องบินขับไลขนาดใหญหนัก"
 DOD_hungary.151.t: "การประกวดเครื่องบินขับไลเบา"
 DOD_hungary.151.desc_light_fighter: "กระทรวงการบินตองการจัดหาเครื่องบินขับไลเบาแบบใหมสําหรับภารกิจกวาดลางเชิงรุกและการปองกันจุดสําคัญ แตกระทรวงการตางประเทศเสนอวาขอพิจารณาทางการเมืองและการทูตก็ควรมีสวนในการตัดสินใจวาจะซื้อจากประเทศใด"
 DOD_hungary.151.desc_light_fighter_refused: "รัฐบาล[From.GetAdjective]ปฏิเสธที่จะใหสิทธิบัตรการผลิต โดยอางความมั่นคงของชาติ เราอาจมีโอกาสดีกวาที่อื่น หรือจะหันไปปรับปรุงเครื่องบินที่มีอยูเปนมาตรการขัดตาทัพฉุกเฉินก็ได"
 DOD_hungary.151.a: "ติดตอเยอรมนี"
 DOD_hungary.151.b: "ติดตออิตาลี"
 DOD_hungary.151.c: "ติดตอฝรั่งเศส"
 DOD_hungary.151.d: "ติดตอสหราชอาณาจักร"
 DOD_hungary.151.e: "ติดตอสหรัฐอเมริกา"
 DOD_hungary.151.f: "นําประสบการณจากการประกวดมาปรับปรุงเครื่องบินของเราเอง"
 DOD_hungary.152.t: "การประกวดเครื่องบินขับไลหนัก"
 DOD_hungary.152.desc_heavy_fighter: "กระทรวงการบินตองการจัดหาเครื่องบินขับไลหนักแบบใหมสําหรับการสกัดกั้นระยะไกลและการคุมกันเครื่องบินทิ้งระเบิด แตกระทรวงการตางประเทศเสนอวาขอพิจารณาทางการเมืองและการทูตก็ควรมีสวนในการตัดสินใจวาจะซื้อจากประเทศใด"
 DOD_hungary.152.desc_heavy_fighter_refused: "รัฐบาล[From.GetAdjective]ปฏิเสธที่จะใหสิทธิบัตรการผลิต โดยอางความมั่นคงของชาติ เราอาจมีโอกาสดีกวาที่อื่น หรือจะหันไปปรับปรุงเครื่องบินที่มีอยูเปนมาตรการขัดตาทัพฉุกเฉินก็ได"
 DOD_hungary.153.t: "การประกวดเครื่องบินขับไลของ[From.GetAdjective]"
 DOD_hungary.153.desc: "กองทัพอากาศ[From.GetAdjective]กําลังจัดการทดสอบเครื่องบินขับไลเบาแบบใหม ผูชวยทูตฝายทหารอากาศของเรารายงานวาเครื่องบินรุนใหมลาสุดของเรามีแนวโนมจะชนะ และคาดวาจะมีคําขออยางเปนทางการจากรัฐบาล[From.GetAdjective]ในไมชา \n\nตัวแทนของบริษัทผูผลิตสนับสนุนการขายอยางเต็มที่ แตก็มีความกังวลดานความมั่นคงของชาติเรื่องการขายยุทโธปกรณที่ทันสมัยที่สุดของเราใหแกตางประเทศ เราควรอนุญาตใหการขายนี้ดําเนินตอไปหรือไม?"
 DOD_hungary.153.a: "แนนอน"
 DOD_hungary.153.b: "เราเสี่ยงใหขอมูลรั่วไหลไมได"
 DOD_hungary.154.desc: "กองทัพอากาศ[From.GetAdjective]กําลังจัดการทดสอบเครื่องบินขับไลหนักแบบใหม ผูชวยทูตฝายทหารอากาศของเรารายงานวาเครื่องบินรุนใหมลาสุดของเรามีแนวโนมจะชนะ และคาดวาจะมีคําขออยางเปนทางการจากรัฐบาล[From.GetAdjective]ในไมชา \n\nตัวแทนของบริษัทผูผลิตสนับสนุนการขายอยางเต็มที่ แตก็มีความกังวลดานความมั่นคงของชาติเรื่องการขายยุทโธปกรณที่ทันสมัยที่สุดของเราใหแกตางประเทศ เราควรอนุญาตใหการขายนี้ดําเนินตอไปหรือไม?"
 DOD_hungary.155.t: "การประกวดเครื่องบินขับไลเสร็จสิ้น"
 DOD_hungary.155.desc: "หลังการเจรจากับบริษัทผูผลิตและเจาหนาที่รัฐ เราไดสิทธิบัตรการผลิตเครื่องบินขับไลแบบใหมมาเรียบรอยแลว เครื่องบินตัวอยางไดมาถึงแลวเพื่อใชฝกชางเครื่องในการซอมบํารุง และคาดวาแบบแปลนและพิมพเขียวครบชุดจะตามมาในไมชา สามารถเริ่มการผลิตไดทุกเมื่อ"
 DOD_hungary.155.a: "เยี่ยม"
 DOD_hungary.160.t: "การประกวดเครื่องบินทิ้งระเบิด"
 DOD_hungary.160.desc: "การศึกษาของกระทรวงการบินเผยวากองทัพอากาศของเราไมพรอมจะสนับสนุนกองทัพบก การโจมตีทางอากาศระยะไกลและการสนับสนุนทางอากาศโดยใกลชิดถูกระบุวาเปนจุดสําคัญที่เราขาดแคลนอยางรายแรง รัฐบาลไดจัดสรรงบประมาณสําหรับโครงการเรงดวนเพื่อจัดหาเครื่องบินทิ้งระเบิดสมัยใหม แตเราตองตัดสินใจวาจะจัดหาเครื่องบินแบบใด"
 DOD_hungary.160.a: "เครื่องบินทิ้งระเบิดขนาดเล็กสําหรับสนับสนุนโดยใกลชิด"
 DOD_hungary.160.b: "เครื่องบินขนาดใหญกวาที่มีพิสัยไกลกวา"
 DOD_hungary.161.t: "การประกวดเครื่องบินทิ้งระเบิดเบา"
 DOD_hungary.161.desc_cas: "กระทรวงการบินตองการจัดหาเครื่องบินทิ้งระเบิดเบาแบบใหมสําหรับสนับสนุนกําลังภาคพื้นดินโดยใกลชิด แตกระทรวงการตางประเทศเสนอวาขอพิจารณาทางการเมืองและการทูตก็ควรมีสวนในการตัดสินใจวาจะซื้อจากประเทศใด"
 DOD_hungary.161.desc_cas_refused: "รัฐบาล[From.GetAdjective]ปฏิเสธที่จะใหสิทธิบัตรการผลิต โดยอางความมั่นคงของชาติ เราอาจมีโอกาสดีกวาที่อื่น หรือจะหันไปปรับปรุงเครื่องบินที่มีอยูเปนมาตรการขัดตาทัพฉุกเฉินก็ได"
 DOD_hungary.162.t: "การประกวดเครื่องบินทิ้งระเบิดขนาดกลาง"
 DOD_hungary.162.desc_tac: "กระทรวงการบินตองการจัดหาเครื่องบินทิ้งระเบิดขนาดกลางแบบใหมสําหรับการสกัดกั้นระยะไกลและการโจมตีทางอากาศทางยุทธวิธี แตกระทรวงการตางประเทศเสนอวาขอพิจารณาทางการเมืองและการทูตก็ควรมีสวนในการตัดสินใจวาจะซื้อจากประเทศใด"
