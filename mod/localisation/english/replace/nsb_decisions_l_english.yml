 SOV_influence_army_opposition_level_tt: "การสนับสนุนในกองทัพบกนอยกวา §Y70%§!"

 SOV_influence_navy_opposition: "เพิ่มการสนับสนุนจากกองทัพเรือ"
 SOV_influence_navy_opposition_desc: "กองทัพเรืออาจไมคอยมีประโยชนในสงครามกลางเมือง แตก็ยังชวยเรายึดจุดสําคัญและรับประกันการสงเสบียงได จึงคุมคาที่จะซื้อใจผูบังคับการเรือจํานวนหนึ่งไว นอกจากนี้ การมีกองเรือหลังสงครามยังเปดโอกาสใหมใหเราบนเวทีนานาชาติอีกดวย"
 SOV_influence_navy_opposition_tt: "การสนับสนุนจากกองทัพเรือเพิ่มขึ้น"
 SOV_influence_navy_opposition_level_tt: "การสนับสนุนในกองทัพเรือนอยกวา §Y70%§!"
 SOV_influence_airforce_opposition: "เพิ่มการสนับสนุนจากกองทัพอากาศ"
 SOV_influence_airforce_opposition_desc: "ดวยการใชเสนสายในกองทัพ เรานาจะหานักบินและผูบังคับการทางอากาศที่เห็นใจอุดมการณของเราได การมีกองทัพอากาศอยูขางเราจะทําใหสงครามงายขึ้นมากอยางแนนอน"
 SOV_influence_airforce_opposition_tt: "การสนับสนุนจากกองทัพอากาศเพิ่มขึ้น"
 SOV_influence_air_opposition_level_tt: "การสนับสนุนในกองทัพอากาศนอยกวา §Y70%§!"

 SOV_recruit_general_opposition: "ชักชวนนายพลมารวมอุดมการณ"
