 SOV_plan_start_of_uprising_archangelsk: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_archangelsk_desc: "ภูมิภาคทางเหนือเขาถึงทาเรือไดและอยูคอนขางใกลมอสโก จึงเปนฐานที่ดี แตโครงสรางพื้นฐานภายในยํ่าแยและพัฒนานอย การทําสงครามจากที่นี่จึงคอนขางยากลําบาก เวนแตจะมีการแกไขปญหานี้"
 SOV_plan_start_of_uprising_odessa: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_odessa_desc: "ยูเครนเปนฐานที่ดีสําหรับการกอการ เปนภูมิภาคที่มั่งคั่ง มีเมืองใหญ ทาเรือ และโครงสรางพื้นฐานที่ดี แตก็หมายความวาการดึงรัฐตาง ๆ มาเขากับอุดมการณของเราจะยากกวาในภูมิภาคที่พัฒนานอยกวาของ[SOV.GetNameDef]"
 SOV_plan_start_of_uprising_chita: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_chita_desc: "ไซบีเรียเปนที่มั่นของฝายตอตานสตาลินและตอตานบอลเชวิกมาแตดั้งเดิม ภูมิภาคนี้อาจยังดอยพัฒนา แตนาจะดึงมาเปนพวกไดคอนขางงาย"
 SOV_plan_start_of_uprising_omsk: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_omsk_desc: "ออมสคตั้งอยูในทําเลที่ดีทางไซบีเรียตะวันตก ติดกับภูมิภาคอูราลและทุงหญาสเตปปใหญ แมจะดอยพัฒนาอยูบาง แตก็นาจะสรางฐานที่มั่นคงสําหรับการลุกฮือไดคอนขางงาย กอนจะเริ่มเดินทัพสูมอสโก"
 SOV_plan_start_of_uprising_tashkent: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_tashkent_desc: "การตั้งฐานในภูมิภาคสเตปปใหญหมายความวาแนวหลังของเราจะปลอดภัย แมตองเดินทัพไกลกวาจะถึงมอสโก แตการสูรบสวนใหญจะอยูเบื้องหนาเรา และนาจะไดรับการสนับสนุนในภูมิภาคนี้ไดคอนขางงาย"

 SOV_plan_start_of_uprising_ufa: "ตั้งกองบัญชาการลับใน[FROM.GetName]"
 SOV_plan_start_of_uprising_ufa_desc: "อูราลมีขอไดเปรียบที่ปองกันไดงาย และการตั้งฐานที่นี่ยังทําใหเราขยายอิทธิพลไปไดทั้งไซบีเรียและภูมิภาคทางเหนือ รวมถึงลงใตสูเขตสเตปปใหญ ทําใหเรามีทางเลือกมากมาย"

