 form_idel_ural_category_desc: "เมื่อวันที่ 1 มีนาคม 1918 มิลลีเมจลิส หรือที่รูจักในชื่อสภาแหงชาติ พยายามประกาศจัดตั้งสาธารณรัฐอีเดล-อูราล แตถูกขัดขวางโดยทั้งสองฝายในสงครามกลางเมือง ทุกวันนี้ แนวคิดเรื่องชาติที่เปนหนึ่งเดียวในภูมิภาคนี้ยังแทบไมมีใครสํารวจ แตหากมีผูประกาศขึ้นมาเพื่อปกปองประชาชนจากจักรวรรดินิยมรัสเซีย ก็จะไดรับการสนับสนุนจากประชาชนอยางลนหลาม"
