 SOV_organize_covert_depots_poum: "เตรียมคลังลับ"
 SOV_organize_covert_depots_poum_desc: "ผูติดตอฝายตอตานสตาลินของเราในสเปนจะเตรียมคลังลับไวเก็บอาวุธและยุทโธปกรณทางทหารที่สายลับของเราจะจัดหามาดวยวิธีตาง ๆ"
 SOV_organize_covert_depots_poum_tt: "ผลเมื่อการลุกฮือของ POUM เกิดขึ้น:\n"
 SOV_send_infantry_equipment_poum: "จัดสงปนเล็กยาวและกระสุน"
 SOV_send_infantry_equipment_poum_desc: "การจัดสงปนเล็กยาวและกระสุนล็อตใหมจะชวยใหสหายชาวสเปนของเราทําสงครามตอตานฟาสซิสตและชนชั้นกระฎมพีฝายตอตานการปฏิวัติตอไปได"
 SOV_organize_popular_brigades_poum: "จัดตั้งกองพลนอยประชาชน"
 SOV_organize_popular_brigades_poum_desc: "เราจะติดตอกับสมาชิกองคกรการเมืองตาง ๆ ของฝายซายตอตานสตาลิน ทั้งในประเทศและตางประเทศ เพื่อจัดตั้งกองพลนอยนานาชาติไปสนับสนุนสหายชาวสเปนของเราในสงคราม"
 SOV_send_elite_commandos_poum: "สงหนวยคอมมานโดชั้นยอด"
 SOV_send_elite_commandos_poum_desc: "เรามีบุคลากรที่ผานการฝกมาอยางดีและมีทักษะสูง สามารถปฏิบัติการพิเศษไดสําเร็จ รวมถึงอดีตนักรบสงครามกลางเมืองที่ไมใชสายสตาลิน และทหารผานศึกที่รูวิธีทําสงคราม \nเราตองมอบกําลังเหลานี้ใหรัฐบาล POUM ใชในการตอสูกับฟาสซิสตและลัทธิสตาลิน"
 SOV_send_elite_commandos_poum_flag: "สงหนวยคอมมานโดชั้นยอดไปสเปนแลว"
 SOV_organize_popular_speeches_poum: "จัดการปราศรัยมวลชน"
 SOV_organize_popular_speeches_poum_desc: "สหายชาวสเปนของเราตองการความรวมมืออยางเต็มที่จากประชาชนเพื่อทําสงครามตอไป เราตองรวมมือกับสมาชิกผูทรงอิทธิพลขององคกรทองถิ่น ดําเนินการรณรงคใหขอมูลและปลุกระดม เพื่อจุดประกายไฟแหงการปฏิวัติในหมูมวลชนชาวสเปนขึ้นอีกครั้ง"
 SOV_infiltrate_stalinist_plans_in_spain_poum: "แทรกซึมกองบัญชาการสายสตาลินในสเปน"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc: "ที่ปรึกษาทางทหารโซเวียตชุดใหมจะถูกสงไปสเปนเพื่อชวยรัฐบาลสาธารณรัฐกระฎมพีในเร็ว ๆ นี้ และเรามีโอกาสแทรกสายลับตอตานสตาลินหลายคนเขาไปปะปน \nสายลับเหลานี้จะติดตอและชักชวนทหาร สมาชิกกองพลนอยนานาชาติ และทหารอาสาที่เห็นใจ POUM ในฝายสาธารณรัฐกระฎมพี เพื่อสรางเครือขายผูใหขอมูลที่จะทําใหเรารูแผนการของศัตรูกอนที่จะลงมือ"
 SOV_default_poum_cd_tt: "\nการตัดสินใจนี้จะใชไดอีกครั้งใน §Y[?SOV_default_poum_cd]§! วัน\n"
 SOV_long_poum_cd_tt: "\nการตัดสินใจนี้จะใชไดอีกครั้งใน §Y[?SOV_long_poum_cd]§! วัน\n"
 decision_only_once_tt: "\nการตัดสินใจนี้ใชไดเพียงครั้งเดียวเทานั้น"
 
