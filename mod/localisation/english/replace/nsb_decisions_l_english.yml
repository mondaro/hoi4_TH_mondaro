 SOV_army_framejob: "ใสรายนายทหารกองทัพบก"
 SOV_army_framejob_desc: "ดวยการปลอยขาวลือเกี่ยวกับนายพลที่ภักดีตอ [ROOT.GetLeader] และสง "หลักฐาน" ปลอมไปถึงมือ NKVD เรานาจะเบี่ยงความสนใจออกไปจากตัวเราไดระยะหนึ่ง ผลพลอยไดคือ หากโชคดี บุคลากรอื่นในกองทัพบกอาจเกิดความไมพอใจตอการกดขี่ปราบปรามนี้"
