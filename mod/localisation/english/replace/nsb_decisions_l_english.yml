 SOV_paranoia_bg_tooltip: "หากคา £SOV_paranoia_text_icon §Yความหวาดระแวง§! สูงเกิน §Y25§! อาจเกิดเหตุการณกวาดลางแบบสุมขึ้นได \nยิ่ง £SOV_paranoia_text_icon §Yความหวาดระแวง§! สูงเทาใด และยิ่งอยูในระดับสูงนานเทาใด โอกาสเกิดการกวาดลางก็ยิ่งมากขึ้น \nหากคา £SOV_paranoia_text_icon §Yความหวาดระแวง§! สูงเกิน §R75§! อาจเกิดเหตุการณการกวาดลางครั้งใหญขึ้นได \n\n§Yแผนยุทธศาสตร§! §Yการตัดสินใจ§! และ§Yผล§!บางอยางจะทําให £SOV_paranoia_text_icon §Yความหวาดระแวง§! เพิ่มขึ้น/ลดลงทันที และคุณลักษณะบางอยางของที่ปรึกษาและผูนําประเทศจะคอย ๆ เพิ่ม§Yความหวาดระแวง§!ไปตามเวลา \n\nการทําแผนยุทธศาสตร §Y[GetAppropriateLastPurgeFocusName]§! สําเร็จจะยกเลิกระบบ £SOV_paranoia_text_icon §Yความหวาดระแวง§!"
