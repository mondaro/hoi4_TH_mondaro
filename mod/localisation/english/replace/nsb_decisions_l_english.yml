 form_siberia_category_desc: "ไซบีเรียไมเคยมีอัตลักษณรวมกันเลย ไมวาจะทางวัฒนธรรม ชาติพันธุ หรือการเมือง นอกเหนือจากความเปนรัสเซียในปจจุบัน อยางไรก็ตาม เมื่อถูกรวมเขามาอยูในอาณาจักรเดียวกันดวยนํ้ามือของชาวรัสเซีย ชาวไซบีเรียจึงเปนหนึ่งเดียวกันมากกวาที่เคยเปนมา หากมีรัฐใดรวมไซบีเรียและขับไลพวกจักรวรรดินิยมรัสเซียออกไปได ผูคนจํานวนมากยอมยอมรับการรวมเปนหนึ่งภายใตรัฐใหมนี้ และหลายคนก็เรียกรองใหสิ่งนี้เกิดขึ้นจริง"
