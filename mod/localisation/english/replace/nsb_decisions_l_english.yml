 SOV_sinkiang_mineral_prospection_sik: "เสนอสํารวจแรทางตอนใตของ[SIK.GetNameDef]"
 SOV_sinkiang_mineral_prospection_sik_desc: "เจาหนาที่[ROOT.GetAdjective]เริ่มสนใจทองคําและแรหายากที่ขุดไดในอัลไต [SIK.GetNameDef] เพื่อเขาถึงตลาดของซินเจียง เราจะเสนอสํารวจหาแหลงแรใหมและปรับปรุงโครงสรางพื้นฐานใน[619.GetName] ภูมิภาคที่อุดมดวยแรธาตุแตเพื่อนบานของเรายังใชวิธีขุดคนที่ลาหลังอยางยิ่ง"
 SOV_sinkiang_mineral_prospection: "การสํารวจแรทางตอนใตของซินเจียง"
 SOV_sinkiang_mineral_prospection_desc: "ภูมิภาค[619.GetName]ทางตะวันตกเฉียงใตของอดีตซินเจียงอุดมดวยแรธาตุ แตปจจุบันมีการขุดเพียงไมกี่แหลง และยังใชวิธีที่ลาหลังและไรประสิทธิภาพอยางมาก เราตองสํารวจหาทรัพยากรและปรับปรุงโครงสรางพื้นฐานของภูมิภาคเพื่อใหขุดคนไดสะดวกขึ้น"
