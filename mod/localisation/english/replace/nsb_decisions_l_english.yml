l_english:
 BALTIC_entente: "ความตกลงบอลติก"
 BALTIC_entente_desc: "พวกเราชาวบอลตมีความเปนพี่นองกัน อันเกิดจากประวัติศาสตรอันยาวนานแหงความทุกขทนภายใตจักรวรรดินิยมตางชาติ เราจะไมยอมกมหัวใหมหาอํานาจตางชาติอีก เพราะนั่นเทากับยื่นกุญแจอธิปไตยของเราใหมหาอํานาจจักรวรรดินิยมอีกรายหนึ่ง มีเพียงการรวมตัวกันเทานั้นที่เราจะหวังรักษาเอกราชไวได"
 formalize_the_entente: "ทําใหความตกลงบอลติกเปนทางการ"
 formalize_the_entente_desc: "เราลังเลที่จะประกาศใหความตกลงบอลติกเปนฝายอยางเปนทางการมาตลอด แตตอนนี้เรามั่นใจวามีสมาชิกมากพอที่จะยืนหยัดดวยตนเองตอตานจักรวรรดินิยมที่กําลังผงาดขึ้นตามพรมแดนของเรา"
 abandon_the_entente: "ละทิ้งความตกลง"
 abandon_the_entente_desc: "นี่เปนความพยายามที่โงเขลา แมเราจะอยากใหเปนไปไดมากเพียงใด แตการที่ประเทศบอลติกยืนหยัดเพียงลําพังไมใชทางรอดที่เปนไปได เราตองยอมสยบตอมหาอํานาจตางชาติ ไมวาจะเปนใครก็ตาม"
 baltic_entente_leader_flag: "เปนผูนําของความตกลงบอลติก\n"
 baltic_entente_flag: "ตกลงเขารวมความตกลงบอลติกแลว"
 convert_neighbours_baltic_cat: "เผยแพรการปฏิวัติ"
 convert_neighbours_baltic_cat_desc: "การปฏิวัติที่นี่ใน [Root.GetNameDef] ประสบความสําเร็จอยางงดงาม สิ่งที่เหลืออยูคือการเผยแพรการปฏิวัติไปสูพี่นองชาวบอลติกของเรา แรงงานแหงบอลติกจะปลดปลอยตนเองจากผูกดขี่ชนชั้นกระฎมพีดวยมือของพวกเขาเอง แตความชวยเหลือจาก[Root.GetAdjective]บางสวนจะชวยใหพวกเขาไปถึงเปาหมายได"
 BALTIC_promote_communism: "โฆษณาชวนเชื่อสังคมนิยมใน [From.Owner.GetNameDef]"
 BALTIC_promote_communism_desc: "ชาวนาจํานวนมากของ [From.Owner.GetNameDef] ยังมองวาสังคมนิยมเปนศัตรูตอวิถีชีวิตของพวกเขา แมเราอาจไมมีวันเยียวยาบาดแผลที่กองทัพแดงทิ้งไวได แตเราอาจโนมนาวพวกเขาไดวาการปฏิวัติในแบบของเรานั้นไมไดนองเลือดถึงเพียงนั้น"
 BALTIC_promote_communism_militancy: "สนับสนุนกลุมติดอาวุธ[From.Owner.GetAdjective]"
 BALTIC_promote_communism_militancy_desc: "ไฟแหงสังคมนิยมลุกโชนอยูในใจของแรงงาน[From.Owner.GetAdjective]จํานวนมาก พวกเขาตองการเพียงแรงสนับสนุนจากภายนอกเพื่อเริ่มกาวแรกในการโคนลมเผด็จการ"
 BALTIC_communist_propaganda: "โฆษณาชวนเชื่อคอมมิวนิสตบอลติก"
 BALTIC_communist_militancy: "ความเคลื่อนไหวติดอาวุธของคอมมิวนิสตบอลติก"
 infiltrate_belarus_decisions: "แทรกซึมเบลารุส"
 infiltrate_belarus_decisions_desc: "สหภาพโซเวียตอางวาเปนตัวแทนผลประโยชนของชนชั้นลางชาวเบลารุส แตนักสังคมนิยมบอลติกกลาววานั่นเปนเพียงการเสแสรง พวกเขาอางวา [SOV.GetLeader] คือเผด็จการกระฎมพีในทุกความหมาย และมีเพียงการติดอาวุธใหประชาชนเบลารุสเทานั้นที่จะปลดปลอยพวกเขาสูรัฐสังคมนิยมไดอยางแทจริง"
 BALTIC_promote_unity_BLR: "ชิงอํานาจควบคุมใน [From.GetName]"
 BALTIC_promote_unity_BLR_desc: "เมื่อสงครามกลางเมืองเบลารุสปะทุขึ้น แตละรัฐตองตัดสินใจเองวาจะเขาขางฝายใดของการปฏิวัติ เราตองทําใหแนใจวา [From.GetName] จะอยูฝายผูชนะ"
 BALTIC_belarus_uprising: "สงครามกลางเมืองเบลารุสที่ใกลปะทุ"
 BALTIC_belarus_uprising_desc: "ประชาชนเบลารุสกําลังถูกฉีกออกเปนสองฝาย ครึ่งหนึ่งของชาติตองการคงอยูเปนสวนหนึ่งของ [SOV.GetNameDef] ขณะที่อีกครึ่งตองการแปรพักตรไปอยูกับบอลติก"
 support_polish_falange_decisions: "สนับสนุนลัทธิฟาลังเฆโปแลนด"
 support_polish_falange_decisions_desc: "ลัทธิฟาสซิสตประสบความสําเร็จในลิทัวเนียแลว และเราไมเห็นเหตุผลที่จะทอดทิ้งพี่นองเกาของเราในโปแลนด ดวยการเผยแพรแนวคิดฟาลังเฆในหมูประชาชน เราอาจเสริมอํานาจให [POL.GetFascistParty] และจากนั้นเราจะผลักดันความยิ่งใหญของโปแลนด-ลิทัวเนียใหแผไปทั่วทวีป"
 LIT_promote_fascism: "โฆษณาชวนเชื่อฟาสซิสตในโปแลนด"
 LIT_promote_fascism_desc: "ตลอดหลายทศวรรษ ลัทธิฟาสซิสตถูกผลักไปอยูชายขอบของการเมืองโปแลนด แมเราอยากใหชาวโปลลุกขึ้นสูดวยตนเอง แตพวกเขาแทบไมมีโอกาสเลยหากเราไมสงเสริมลัทธิฟาสซิสตในประเทศของพวกเขาอยางเปดเผย"
 LIT_promote_falange_militancy: "สนับสนุนกลุมติดอาวุธฟาลังเฆ"
 LIT_promote_falange_militancy_desc: "[POL.GetFascistParty] ขึ้นชื่อเรื่องวิธีการเดินขบวนที่วุนวายและรุนแรง ฟาสซิสตจํานวนมากหวาดกลัวความคลั่งชาติของ [POL.GetFascistParty] แตเรารูดีวานี่เปนเพียงการแสดงออกถึงความรักชาติที่ลุกโชนในใจพวกเขา ซึ่งตองไดรับการสนับสนุน"
 LIT_ignite_civil_war_in_POL: "เริ่มการลุกฮือ"
 LIT_ignite_civil_war_in_POL_desc: "การเตรียมการพรอมแลว อีกไมนานโปแลนดจะกลายเปนสมรภูมิไมเพียงแหงความคิด แตแหงความกลาหาญและเกียรติยศดวย เราไดทําทุกอยางเทาที่ทําไดเพื่อสนับสนุนฟาลังเฆในโปแลนด สิ่งที่เหลือคือการทอดลูกเตาและหวังวาพระเจาจะอยูขางพวกเขาจริง ๆ"

 LIT_adopt_the_dobuzhinsky_flag_design_decision: "ใชแบบธงตามหลักมุทราศาสตรของโดบูชินสกี"
 LIT_adopt_the_dobuzhinsky_flag_design_decision_desc: "สีของธงเราตองตรงกับสีของตราแผนดิน ตราแผนดินไมมีสีเขียว ธงจึงไมควรมีสีเขียวดวย ดังนั้นเราควรรับขอเสนอที่มสติสลาฟ โดบูชินสกี และวีดูนัส มอบใหเรา"

 march_through_estonia: "การเดินขบวนทั่วเอสโตเนีย"
 march_through_estonia_desc: "รัฐบาลอันออนแอของคอนสตันติน แพตส ปดปากเสียงรองของผูรักชาติเอสโตเนียมานานพอแลว เราขาดกําลังพลที่จะสูกับกองทัพเอสโตเนียเพียงลําพัง แตบางทีการแสดงความคับแคนตอเผด็จการดวยการเดินขบวนหลายครั้งทั่วประเทศ อาจเตือนใจเยาวชนเอสโตเนียไดวาบรรพบุรุษของพวกเขาตอสูเพื่อชีวิตที่ดีใหพวกเขา ซึ่งแพตสและพรรคพวกกําลังพรากไป"
 EST_stomp_the_vaps: "การปราบปรามของรัฐบาลที่กําลังจะมาถึง"
 EST_stomp_the_vaps_desc: "[EST.GetLeader] รูวาเราตองการบอนทําลายระบอบของ [EST.GetLeader.GetHerHis] และ [EST.GetLeader.GetSheHe] กําลังเตรียมการปราบปรามเราและยุติการเดินขบวนของเรา หากเราโคนลมรัฐบาลไมสําเร็จกอนถึงตอนนั้น เอสโตเนียจะตองเผชิญสงครามกลางเมือง!"
 EST_march_in_state: "เดินขบวนใน [FROM.GetName]"
 EST_convert_FIN_cat: "การเดินขบวนทั่วฟนแลนด"
 EST_convert_FIN_cat_desc: "[FIN.GetFascistParty] มีความสัมพันธใกลชิดกับ [EST.GetFascistParty] มานาน และเมื่อเราไดครองอํานาจเหนือชาติของเราเองแลว เราตองเสริมพลังใหทหารผานศึกฟนแลนดยึดอํานาจในชาติของพวกเขา"
 EST_march_in_FIN_state: "เดินขบวนใน [FROM.GetName]"
 EST_march_in_FIN_capital: "การเดินขบวนสู [FROM.GetName]"
 EST_march_in_FIN_capital_desc: "เมื่อเรารูสึกวาทหารผานศึกฟนแลนดมีความฮึกเหิมมากพอแลว เราเพียงตองใหสัญญาณเดินขบวนสู [FROM.GetName] แลวชาวฟนนก็จะไดรับอํานาจภายใตลัทธิฟาสซิสตในที่สุด"
 promote_baltic_fascism_cat: "สงเสริมลัทธิฟาสซิสตบอลติก"
 promote_baltic_fascism_cat_desc: "ดินแดนบอลติกมีลักษณะเดนคือระบอบที่ออนแอและไรเดียงสา ไมสามารถเปนตัวแทนของสายเลือดชาวบอลตที่ไหลเวียนในกายประชาชนได ลิทัวเนีย เอสโตเนีย และแมแตบางสวนในโปแลนดตองไดรับการเตือนใจถึงความรุงโรจนของบรรพบุรุษที่เคยยืนหยัดตอตานชาวเจอรแมนิกและชาวสลาฟ ซึ่งบัดนี้กําลังพยายามกดขี่เราอีกครั้ง"
 LAT_promote_fascism: "โฆษณาชวนเชื่อฟาสซิสตใน [From.Owner.GetNameDef]"
 LAT_promote_fascism_desc: "ผูคนจํานวนมากใน [From.Owner.GetNameDef] ยังไมยอมรับวาพรรค [From.Owner.GetFascistParty] ของพวกเขาคือหนทางเดียวที่ประชาชน[From.Owner.GetAdjective]จะไดปกครองตนเองในที่สุด สิ่งนี้ตองไดรับการแกไขดวยการโฆษณาชวนเชื่อและการสนับสนุนพรรค [From.Owner.GetFascistParty] อยางแข็งขัน"
 LAT_promote_falange_militancy: "สนับสนุนกลุมติดอาวุธ [From.Owner.GetFascistParty]"
 LAT_promote_falange_militancy_desc: "ใน [From.Owner.GetNameDef] มีผูที่เก็บความเกรี้ยวกราดของชาวบอลตไวในใจ และเปนหนาที่ของเราที่จะมอบการสนับสนุนทางทหารและการเมืองที่พวกเขาสมควรไดรับ"
 LAT_ignite_civil_war_in_target: "จุดชนวนสงครามกลางเมือง[From.Owner.GetAdjective]"
 LAT_ignite_civil_war_in_target_desc: "การโฆษณาชวนเชื่อทําไดเพียงเทานั้น บางครั้งตองลงมือโดยตรงเพื่อนําความแข็งแกรงและเสถียรภาพมาสูรัฐ เราไดทําทุกอยางเทาที่ทําไดแลว บัดนี้เราปลอยให [From.Owner.GetFascistParty] เผชิญชะตากรรมของตนเอง"
 LIT_iron_wolf_coup: "รัฐประหารหมาปาเหล็ก"
 LIT_iron_wolf_coup_desc: "ผูติดตามของเอากุสตีนัส โวลเดมารัส กําลังวางแผนกอกบฏในชาติของเรา หากไมทําอะไรเพื่อสกัดหมาปาเหล็ก เราเสี่ยงจะตกอยูในสงครามกลางเมือง เราตองตัดสินใจวาจะยอมออนขอใหพลพรรคหมาปาเหล็กและเสี่ยงเสริมอํานาจใหพวกเขา หรือจะเนรเทศผูนําของพวกเขาออกจากชาติ ปลอยใหผูติดตามกระจัดกระจายโดยไรการนําที่เขมแข็งดังที่พวกเขาอาง"
 LIT_iron_wolf_partisans: "พลพรรคหมาปาเหล็ก"
 LIT_iron_wolf_partisans_desc: "หมาปาเหล็กกําลังรวมตัวกันในชาติของเรา เมื่อเวลาผานไป พวกเขาจะไดรับการสนับสนุนจากชาวลิทัวเนียมากขึ้นอยางหลีกเลี่ยงไมได และอาจฮึกเหิมพอที่จะกอรัฐประหารโคนรัฐบาลในที่สุด"
 LIT_iron_wolf_appeasement: "ชะลอการลุกฮือของหมาปาเหล็ก"
 LIT_iron_wolf_appeasement_desc: "เราตองพยายามขัดขวางกิจกรรมของหมาปาเหล็กในชาติของเรา แมมาตรการเหลานี้จะไมอาจกําจัดพวกเขาไดหมดสิ้น แตเราอาจชะลอความพยายามของพวกเขาไดนานพอที่จะหาทางแกปญหาอยางถาวร"
 LIT_relocate_iron_wolf_recruitment: "ยายศูนยรับสมัครของหมาปาเหล็ก"
 LIT_relocate_iron_wolf_recruitment_desc: "หมาปาเหล็กอาศัยผูรับสมัครในทองถิ่นเพื่อดึงคนใหมเขาสูขบวน การบังคับยายผูรับสมัครเหลานี้จะทําใหผูที่คิดจะเขารวมสับสน และอาจปองกันไมใหพวกเขาเขารวมกลุมหมาปาเหล็กได"
 LIT_promote_alternative_paramilitaries: "สงเสริมกองกําลังกึ่งทหารทางเลือก"
 LIT_promote_alternative_paramilitaries_desc: "แมเราอยากใหพลเมืองเขารวมกองทัพลิทัวเนียอยางเปนทางการ แตยอมหลีกเลี่ยงไมไดที่บางคนอยากภักดีตอกลุมที่แยกจากรัฐบาลมากกวา บางทีการสงเสริมกลุมอื่น เชน สหภาพพลแมนปนลิทัวเนีย อาจดึงนักชาตินิยมบางสวนไมใหเขารวมหมาปาเหล็กได"
 LIT_grant_concessions_to_iron_wolf: "เสนอขอผอนปรนแกหมาปาเหล็ก"
 LIT_grant_concessions_to_iron_wolf_desc: "บางทีการแสดงทาทีเชิงสัญลักษณบางอยางตอหมาปาเหล็กอาจชวยบรรเทาความปนปวนของพวกเขาลงไดบาง"
 EST_vaps_revolt_category: "การกอกบฏของกลุมวาปส"
 EST_vaps_revolt_category_desc: "สมาคมทหารผานศึกหลายแหงทั่วเอสโตเนียไดรวมตัวกันเปนองคกรฟาสซิสตหนึ่งเดียวที่เรียกวาขบวนการวาปส ซึ่งคุกคามที่จะโคนลมรัฐบาล เราตองลงมือสกัดการผงาดของชาตินิยมเอสโตเนียนี้ หากตองการรักษาระบอบไวอยางสงบ"
 EST_vaps_uprising: "วาปสเดินขบวนสูทาลลินน"
 EST_vaps_uprising_desc: "กลุมวาปสยังคงเดินขบวนและชุมนุมทั่วเอสโตเนียแมจะเปนองคกรผิดกฎหมาย ยิ่งเราปลอยใหกลุมชาตินิยมนี้ลุกลามนานเทาไร ก็ยิ่งเสี่ยงที่คนอื่นจะเขารวมอุดมการณของพวกเขามากขึ้น"
 EST_vaps_crackdown: "ปราบปรามกลุมวาปส"
 EST_vaps_crackdown_desc: "เรากําลังประสานการปราบปรามเบ็ดเสร็จตอทุกสมาคมที่เกี่ยวของกับขบวนการวาปส หากวาปสยังอยูชายขอบทางการเมือง การปราบปรามก็นาจะเปนเรื่องเล็ก แตหากพวกเขารวบรวมแรงสนับสนุนไดมากพอ ผลของการปราบปรามอาจเปนสงครามกลางเมืองนองเลือดกับทหารผานศึกรุนเกาที่สุดของเอสโตเนีย"
 EST_fight_vaps_decisions: "ตอสูกับกลุมวาปส"
 EST_fight_vaps_decisions_desc: "ตองตอบโตขบวนการวาปสหากการปราบปรามของเราจะประสบความสําเร็จ การกระทําที่ขัดขวางวาปสจะลดอิทธิพลของพวกเขาในชาติเราลงอยางมาก และทําใหการกําจัดพวกเขาดวยกําลังราบรื่นยิ่งขึ้น"
 EST_divide_veterans_societies: "แบงแยกสมาคมทหารผานศึก"
 EST_divide_veterans_societies_desc: "กลุมวาปสประกอบดวยผูที่เคยรบในสงครามประกาศเอกราชเอสโตเนียเปนหลัก แมจะนาเศราที่เห็นวีรบุรุษของเราตกอยูใตอิทธิพลของลัทธิชาตินิยมสุดโตง แตเราตองสลายและแบงแยกสมาคมทหารผานศึกที่วาปสรวมเขาดวยกัน"
 EST_disrupt_vaps_recruitment: "ขัดขวางการรับสมัครของวาปส"
 EST_disrupt_vaps_recruitment_desc: "แมวาปสจะเปนทหารผานศึกวัยกลางคนจนถึงผูสูงอายุมาแตเดิม แตพวกเขาก็ไมขาดแคลนผูเห็นใจรุนเยาวที่ตองการเขารวมในนามของพอและปู เราตองหาทางขัดขวางการรับสมัครนี้และกันชายหนุมเหลานี้ใหหางจากเสียงยั่วยวนของลัทธิฟาสซิสต"
 EST_crackdown_on_vaps: "บุกจูโจมกลุมวาปส"
 EST_crackdown_on_vaps_desc: "กลุมวาปสชักจะกําเริบเสิบสานเกินไปแลว เราตองบุกจูโจมสมาชิกของพวกเขาหากตองการกําจัดอิทธิพลที่กําลังเติบโตของพวกเขาบางสวน"
 EST_put_vaps_leaders_on_trial: "นําผูเห็นใจวาปสขึ้นศาล"
 EST_put_vaps_leaders_on_trial_desc: "ไมใชความลับวาสมาชิกบางคนในรัฐบาลเห็นใจขบวนการวาปส เราจะปลอยใหเปนเชนนี้ตอไปไมได เจาหนาที่ทางทหารของเราที่เกี่ยวของกับวาปสตองถูกพิจารณาคดีในฐานะผูทรยศ"
 EST_launch_vaps_investigation: "เปดการสอบสวนกลุมวาปส"
 EST_launch_vaps_investigation_desc: "เราตองทุมหนวยงานบางสวนของหนวยราชการลับเพื่อแทรกซึมและยุติความพยายามของวาปสที่จะบอนทําลายรัฐบาล"
 EST_anti_vaps_propaganda: "โฆษณาชวนเชื่อตอตานฟาสซิสต"
 EST_anti_vaps_propaganda_desc: "เราตองเดินอยางระมัดระวังเมื่อสงเสริมการตอตานฟาสซิสตในชาติของเรา ผูตอตานฟาสซิสตจํานวนมากเปนนักประชาธิปไตยและคอมมิวนิสต แตบางทีพวกเขาอาจถูกโนมนาวใหสนับสนุนเผด็จการในความพยายามรวมกันเพื่อสกัดการผงาดของลัทธิฟาสซิสต"
 EST_delay_the_crackdown: "ชะลอการปราบปราม"
 EST_delay_the_crackdown_desc: "แมเราจะอยากจัดการกับวาปสอยางรวดเร็ว แตเราไมอาจเสี่ยงใหประเทศตกอยูในความโกลาหล การปราบปรามจึงตองเลื่อนออกไป"
 EST_vapsid_takeover: "รัฐบาลวาปสปกครองประเทศอยูแลว"
 LAT_perkonkrust_revolt_category: "การกอกบฏของเปรคอนครุสตส"
 LAT_perkonkrust_revolt_category_desc: "เปรคอนครุสตสเปนพวกชาตินิยมสุดโตงที่เชิดชูชนเผาบอลติกและชาติพันธุลัตเวีย เปนภัยคุกคามตอการดํารงอยูของลัตเวียที่เราตอสูอยางหนักเพื่อสรางขึ้น เปรคอนครุสตสคือเชื้อโรคบนบาดแผลแหงความภาคภูมิใจของชาติ และตองถูกกําจัด"
 LAT_perkonkrust_uprising: "การลุกฮือของเปรคอนครุสตส"
 LAT_perkonkrust_uprising_desc: "เมื่อเวลาผานไป เปรคอนครุสตสจะรวบรวมแรงสนับสนุนทั่วประเทศ และหากปลอยไวไมควบคุม พวกเขาจะฮึกเหิมพอที่จะพยายามกอรัฐประหารโคนรัฐบาล"
 LAT_delay_perkonkrust_decisions: "ตอสูกับเปรคอนครุสตส"
 LAT_delay_perkonkrust_decisions_desc: "แมจะไมใชทางแกถาวร แตเราอาจดําเนินการรณรงคบางอยางเพื่อลดการสนับสนุนฟาสซิสตในชาติเรานานพอที่จะจัดการกับเปรคอนครุสตสได ไมทางใดก็ทางหนึ่ง"
 LAT_equality_campaigns: "การรณรงคเพื่อความเทาเทียม"
 LAT_equality_campaigns_desc: "เปรคอนครุสตสตอตานพันธกิจของ [Root.GetLeader] ที่จะสรางลัตเวียซึ่งดวงอาทิตยสองแสงเทาเทียมกันแกชาวลัตเวียทุกคน ดังนั้นเราตองทําใหชัดเจนวาการสนับสนุนวาทกรรมความเหนือกวาของพวกเขาขัดตอคุณคาหลักของชาติเรา"
 LAT_empower_democrats: "เสริมอํานาจฝายประชาธิปไตย"
 LAT_empower_democrats_desc: "แมจะไมพึงปรารถนา แตฝายประชาธิปไตยเปนผูตอตานเปรคอนครุสตสอยางเปดเผย และเปนภัยตอชาติเรานอยกวามาก การนี้จะเพิ่มการสนับสนุนฝายคานประชาธิปไตย แตเราตองทําทุกอยางเพื่อสกัดกิจกรรมของเปรคอนครุสตส"
 LAT_support_loyalists: "ผนวกรวมฝายคาน"
 LAT_support_loyalists_desc: "ดวยการดึงบางสวนของฝายคานเขามา เราจะมีอํานาจมากขึ้นในการผลักเปรคอนครุสตสไปอยูชายขอบทางการเมืองของสังคม"
 BALTIC_forest_brother_resistance_cat: "การตอตานของพี่นองแหงปา"
 BALTIC_forest_brother_resistance_cat_desc: "ไมใชทุกคนในชาติเราที่ยอมรับสังคมนิยมอยางเต็มใจ และไมมีใครแสดงความรังเกียจตอ [Root.GetNonIdeologyName] ใหมอยางเปดเผยและแข็งขันเทากับพี่นองแหงปา พวกเขาเปนผูสนับสนุนชาตินิยม[Root.GetAdjective]อยางแรงกลา ปฏิเสธอิทธิพลตางชาติทั้งปวงใน [Root.GetNonIdeologyName] และมุงโคนพรรคคอมมิวนิสตลงจากอํานาจเพื่อใหรัฐบาลที่เปนชาตินิยมมากกวาขึ้นมาแทน"
 BALTIC_forest_brothers_resistance: "กิจกรรมการตอตาน"
 BALTIC_forest_brothers_resistance_desc: "พี่นองแหงปากําลังเตรียมกอการกบฏภายในชาติของเรา เรายังไมรูวาพวกเขาจะทําอะไร แตรูวามันจะขัดขวางเปาหมายของเราในการเผยแพรสังคมนิยมไปทั่วประเทศอยางแนนอน"
 POL_purchase_madagascar: "ซื้อ [543.GetName]"
 POL_purchase_madagascar_desc: "มาดากัสการเปนดินแดนแปลกหนา เต็มไปดวยพืชพรรณและสัตวที่ชาวโปลไมคุนเคย แมหลายคนจะมองวาเกาะนี้ไมเหมาะกับชาวโปล แตบางคนอาจมองวาเปนโอกาสที่จะไดใชชีวิตในที่ใหมโดยสิ้นเชิง ขนาดของเกาะและวัตถุดิบที่อาจมีอยูทําใหที่นี่เปนจุดหมายในอุดมคติสําหรับรัฐบาลพลัดถิ่นของโปแลนด หากถึงคราวจําเปน"
 POL_purchase_gambia: "ซื้อ [701.GetName]"
 POL_purchase_gambia_desc: "หลายศตวรรษกอน ดัชชีคูรลันดเคยพยายามตั้งอาณานิคมที่ [701.GetName] ในนามของเครือจักรภพโปแลนด-ลิทัวเนีย แมจะมีความสัมพันธที่ดีกับคนทองถิ่น แตพวกเขาก็ถูกมหาอํานาจตางชาติขับไลออกไป ถึงเวลาแลวที่จะแกไขเรื่องนี้"
 POL_purchase_cheap_colony: "ซื้อ [FROM.GetName]"
 POL_purchase_cheap_colony_desc: "ชาวโปแลนดใหความสนใจใน [FROM.GetName] มากขึ้นเรื่อย ๆ แมความสนใจเหลานี้จะอยูนอกขอบเขตของรัฐบาล แตความกระตือรือรนของพวกเขาก็อาจใชเปนเหตุผลใหโปแลนดซื้อภูมิภาคนี้ได"
 POL_anti_capitalist_decisions: "การปฏิวัติตอตานทุนนิยม"
 POL_anti_capitalist_decisions_desc: "ทุนนิยมคือโรครายบนโลก แมหลายชาติจะเรียกตัวเองวา "ประชาธิปไตย" แตพวกเขาเพียงกดขี่ชนชั้นกรรมาชีพไวในประชาธิปไตยแบบกระฎมพี และเปนหนาที่ของนักสังคมนิยมทุกคนที่จะปลดปลอยสหายของตน"
 POL_anti_fascist_revolution_category: "การปฏิวัติตอตานฟาสซิสต"
