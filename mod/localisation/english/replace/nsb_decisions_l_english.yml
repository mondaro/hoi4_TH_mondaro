 SOV_influence_army_opposition: "เพิ่มการสนับสนุนจากกองทัพบก"
 SOV_influence_army_opposition_desc: "เมื่อแทรกซึมเขาไปในกองทัพบกไดแลว เราก็เริ่มเสาะหานายทหารชั้นผูนอยและพลทหารที่เห็นใจอุดมการณของเรา และทําใหแนใจวาพวกเขาจะเขารวมฝายเราหากสงครามเริ่มขึ้น"
 SOV_influence_army_opposition_tt: "การสนับสนุนจากกองทัพบกเพิ่มขึ้น"
