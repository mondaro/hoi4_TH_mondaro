 SOV_raid_trotskys_villa: "บุกวิลลาของทรอตสกี"
 SOV_raid_trotskys_villa_desc: "อีโอซิฟ กรีกูเลวิช สายลับ NKVD จะนํากลุมมือสังหารติดอาวุธบุกโจมตีวิลลาของทรอตสกี"
 SOV_raid_trotskys_villa_tt: "กลุมมือสังหารติดอาวุธจะพยายามสังหารทรอตสกีดวยการบุกวิลลาของเขา\n\nโอกาสสังหารทรอตสกีสําเร็จจะเพิ่มขึ้นหาก §Y[FROM.GetFlag][FROM.GetNameDefCap]§!: \n-มีการสนับสนุนคอมมิวนิสตสูง \n-อยูในฝายเดียวกับ [ROOT.GetFlag][ROOT.GetNameDefCap] \n-เปนรัฐในอารักขาของ [ROOT.GetFlag][ROOT.GetNameDefCap]\n"
 SOV_carefully_planned_assassination: "แทรกซึมและลอบสังหาร"
 SOV_carefully_planned_assassination_desc: "รามอน เมรกาเดร สายลับ NKVD ชาวสเปน จะผูกมิตรกับคนสนิทของทรอตสกี จากนั้นจะยายไปเม็กซิโกและปลอมตัวเปนผูเห็นใจทรอตสกี เพื่อรอจังหวะที่เหมาะสมในการลงมือลอบสังหาร"
 SOV_carefully_planned_assassination_tt: "สายลับ NKVD จะพยายามแทรกซึมเขาไปในวงในของทรอตสกีและลอบสังหารเขา \n\nโอกาสสังหารทรอตสกีสําเร็จจะเพิ่มขึ้นหาก §Y[FROM.GetFlag][FROM.GetNameDefCap]§!: \n-มีการสนับสนุนคอมมิวนิสตสูง \n-มีความสัมพันธที่ดีกับ [ROOT.GetFlag][ROOT.GetNameDefCap] \n-อยูในฝายเดียวกับ [ROOT.GetFlag][ROOT.GetNameDefCap] \n-เปนรัฐในอารักขาของ [ROOT.GetFlag][ROOT.GetNameDefCap] \n-เคยบุกวิลลาของทรอตสกีมาแลว \n"
