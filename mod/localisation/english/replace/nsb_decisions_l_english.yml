 SOV_army_framejob_cd_tt: "\nการตัดสินใจนี้จะใชไดอีกครั้งใน §Y[?SOV_army_framejob_decision_re_enable_days_display] วัน§!"
 SOV_navy_framejob: "ใสรายพลเรือเอก"
