  #HISTORICAL
 PRC_put_an_end_to_the_sufan: "ยุติการกวาดลางซูฝาน"
 PRC_put_an_end_to_the_sufan_desc: "เมื่อเรามาถึง[622.GetName] หลิว จื้อตาน ผูนําคณะกรรมการกลางกรมการเมืองทองถิ่น และผูนําทองถิ่นคนอื่น ๆ กําลังถูกกวาดลางในการรณรงคตอตานฝายปฏิปกษปฏิวัติ $PRC_bo_gu$ จะไดรับมอบหมายใหยุติเรื่องไรสาระนี้"
 PRC_usurp_control_over_yanan: "ชวงชิงอํานาจควบคุมเหยียนอาน"
 PRC_usurp_control_over_yanan_desc: "[1032.GetName]ทางใตของเราคือกาวตอไปที่สมเหตุสมผลในความพยายามสรางฐานที่มั่นอันแข็งแกรงขึ้นใหม"
 PRC_usurp_control_over_yanan_tt: "หาก [ROOT.GetName] §Yอยูในฝายเดียวกัน§!กับ §Y[CHI.GetName]§! และประเทศอื่นควบคุม §Y[1032.GetName]§! และควบคุม §Y[744.GetName]§! หรือ §Y[283.GetName]§! อยางใดอยางหนึ่ง:"
 PRC_the_westward_expedition: "การขยายตัวสูตะวันตก"
 PRC_the_westward_expedition_desc: "[NXM.GetNameDefCap]ทางตะวันตกเปนโอกาสชั้นดีใหเราขยายอาณาเขต หากเราจัดการปะทะประปรายตามแนวชายแดน[1045.GetName] เราอาจฉวยประโยชนจากการที่พวกเขาไมทันระวังเราได"
 PRC_the_eastward_expedition: "การยกทัพสูตะวันออก"
 PRC_the_eastward_expedition_desc: "ทางตะวันออกของเรา [SHX.GetLeader]ปกครอง[615.GetName]อยู แตเราอาจเจาะแนวปองกันของพวกเขาขามแมนํ้าเหลืองได"
 PRC_develop_yanan_soviet: "พัฒนาโซเวียตเหยียนอาน"
 PRC_develop_yanan_soviet_desc: "บัดนี้เราสถาปนาอํานาจควบคุมเหนือ[1032.GetName]ไดแลว ซึ่งเปนโอกาสใหเราขยายฐานที่มั่น เราจะตั้ง[1032.GetName]เปนที่ตั้งของรัฐบาลเรา"
 PRC_the_internal_enemy: "ศัตรูภายใน"
 PRC_the_internal_enemy_desc: "การตอสูกับ[CHI.GetLeader]และรัฐบาล[CHI.GetRulingParty]ดําเนินมาเปนทศวรรษแลว เราจดจําการกวาดลางวันที่ 12 เมษายน 1927 ได และเราตองทําใหมั่นใจวาความอัปยศเชนนั้นจะไมเกิดขึ้นซํ้าอีก"
 PRC_know_the_enemy: "รูเขา"
 PRC_know_the_enemy_desc: "เพื่อนบานของเราอาจเปนมิตรในตอนนี้ แตเราตองระวังไวกอนดวยการสํารวจแนวปองกันของพวกเขาในกรณีที่สถานการณเปลี่ยนแปลง"
 PRC_unlock_border_defense_raids_tt: "ปลดล็อกการจูโจม §Y$raid_type_PRC_probe_border_defenses_raid$§! ตอ §Y$STATE_615$§! และ §Y$STATE_1045$§!"
 PRC_cooperate_ulanhu: "รวมมือกับอูหลานฟู"
 PRC_cooperate_ulanhu_desc: "หยุน เจอ หรืออูหลานฟู เปนนักสูคอมมิวนิสตผูแนวแนจากมองโกเลีย ซึ่งกําลังจัดตั้งกําลังอยูทางเหนือของฐานที่มั่นของเรา เขาเสนอจะนํากองกําลังมาสมทบกับเราที่[ROOT.capital.GetName]เพื่อสูเคียงขางเรา"
 PRC_know_the_enemy_tt: "เมื่อ §Y$PRC_the_westward_expedition$§!, §Y$PRC_the_eastward_expedition$§! และ §Y$PRC_usurp_control_over_yanan$§! เสร็จสิ้นแลว:"
 PRC_burn_the_paper_tigers: "เผาเสือกระดาษ"
 PRC_burn_the_paper_tigers_desc: "เราจะติดตอ[CHI.GetName]และฝายอื่น ๆ ทั้งหมด เพื่อจัดตั้งแนวรวมแหงชาติครั้งที่สองตอตานศัตรูรวมของเรา"
 PRC_rally_the_peasants: "รวมพลังชาวนา"
 PRC_rally_the_peasants_desc: "ชาวนาคือฐานอํานาจหลักของเรา เนื่องจากการบริหารที่ผิดพลาดของ[CHI.GetNameDef] พวกเขาจะไดประโยชนมากมายจากการปฏิรูปที่เราสัญญาไว"
 PRC_rally_the_28_bolsheviks: "รวมพลังบอลเชวิค 28 คนครึ่ง"
 PRC_rally_the_28_bolsheviks_desc: "ความรูอันกวางขวางของบอลเชวิค 28 คนครึ่ง ผูไดรับการฝกฝนในสหภาพโซเวียตใหเปนผูนํารัฐบาลและกองทัพ จะตองถูกนํามาใชอยางเต็มที่ในยามยากลําบากเชนนี้"
 PRC_guide_central_committee: "ชี้นําคณะกรรมการกลาง"
 PRC_guide_central_committee_desc: "เราตองกําหนดทิศทางที่ชัดเจนใหคณะกรรมการกลาง หากเราไมอาจรักษาเอกภาพของพรรคไวได เราก็ไมมีทางหวังจะรวมจีนเปนหนึ่งไดเชนกัน"
 PRC_leadership_of_mao: "ภาวะผูนําของ $PRC_mao_zedong$"
 PRC_leadership_of_mao_desc: "เหมาไดพิสูจนความแกรงของตนในการเดินทัพทางไกล และการที่เขามีอิทธิพลมากขึ้นจากความสามารถของตนก็อาจไมใชเรื่องเลวราย ทายที่สุดแลว หากเราไมตองการถูกจํากัดอยูในพรมแดนปจจุบัน เราจําเปนตองมีผูนําที่เขมแข็ง"
 PRC_expel_the_occupiers: "ขับไลผูยึดครอง"
 PRC_expel_the_occupiers_desc: "เมื่อใดที่เรามีกําลังพอ เราควรขับไลกองกําลังตางชาติออกจากจีน มิฉะนั้นพวกเขาจะไมหยุดยั้งที่จะบอนทําลายเราเพื่อผลประโยชนของตนเอง"
 PRC_restore_territorial_integrity: "ฟนฟูบูรณภาพแหงดินแดน"
 PRC_restore_territorial_integrity_desc: "เราจะขอใหผูที่ภักดีตออุดมการณของเราโอนดินแดนใหแตโดยดี"
 PRC_seek_support_from_ussr: "ขอการสนับสนุนจาก[SOU.GetNameDef]"
 PRC_seek_support_from_ussr_desc: "พันธมิตรเกาแกของเรา [SOU.GetNameDef] ไดใหความชวยเหลือสําคัญแกการปฏิวัติของเรา แตเพื่อใหการปฏิวัติสําเร็จ เราตองขอใหพวกเขาเพิ่มความชวยเหลือขึ้นอีก ทายที่สุดแลว ความสําเร็จของการปฏิวัติจะทําใหพวกเขาสามารถมุงความพยายามไปยังแนวรบอื่นได"
 PRC_request_guarantees: "ขอการรับประกันดินแดน"
 PRC_request_guarantees_desc: "แนวทางใหมของเราซึ่งไดแรงบันดาลใจจากสหภาพโซเวียต จะไดประโยชนอยางมากจากการคุมครองของพวกเขา การใหหลักประกันความมั่นคงยอมมีความเสี่ยงสําหรับพวกเขา แตความสําคัญในการยับยั้งศัตรูที่อาจเกิดขึ้นทําใหคุมคา"
 PRC_request_guarantees_tt: "§R[SOV.GetNameDefCap]อาจขอใหเรากลายเปนรัฐในอารักขาเพื่อแลกกับการรับประกัน...§!"
 PRC_on_guerilla_warfare: "วาดวยสงครามกองโจร"
 PRC_on_guerilla_warfare_desc: "ในฐานะนักทฤษฎีและผูเขียนตําราวาดวยสงครามกองโจร เหมาและอํานาจที่เพิ่งไดมาจะทําใหมั่นใจวากองกําลังอิสระขนาดเล็กของเราจะถูกใชอยางเหมาะสม"
 PRC_dissent_in_the_united_front: "[GetDissentFocusName]"
 PRC_dissent_in_the_united_front_default: "หวานความแตกแยกในแนวรวมแหงชาติ"
 PRC_dissent_in_the_united_front_alt: "หวานความแตกแยกใน[ROOT.GetFactionName]"
 PRC_dissent_in_the_united_front_desc: "แมขณะสูเคียงขางพันธมิตร เราก็ตองชูขอดีของอุดมการณของเราเอง การทําเชนนี้อาจทําใหเราไดผูสนับสนุน ซึ่งอาจรวมถึงบุคคลที่มีบทบาทสําคัญในอีกฟากหนึ่งของพันธมิตรดวย"
 PRC_dissent_in_the_united_front_1_tt: "เมื่ออยูใน §Yฝาย§! เดียวกับ [CHI.GetNameWithFlag]:"
 PRC_halves_infiltration_cost_tt: "§Gลดตนทุนลงครึ่งหนึ่ง§! สําหรับการตัดสินใจ §Y$PRC_infiltration_sea_cat$§!"
 PRC_establish_friendly_bases: "ตั้งฐานหลังแนวขาศึก"
 PRC_establish_friendly_bases_desc: "พลเรือนจํานวนมากในดินแดนที่ถูกยึดครองทําใหผูแทรกซึมของเรากลมกลืนไปกับฝูงชนไดโดยงายขณะลงมือกอวินาศกรรม"
 PRC_establish_friendly_bases_1_tt: "ปลดล็อกการตัดสินใจ: §Yจัดตั้งปฏิบัติการกอวินาศกรรม§!"
 PRC_establish_friendly_bases_2_tt: "§Rรัฐที่ขาศึกยึดครอง§! ซึ่งมี §Y$PRC_guerilla_cells_active_2$§! หรือเปน §Yดินแดนหลัก§! ของรัฐในอารักขาที่มีเจาเหนือหัวเปนตางชาติ สามารถไดรับ §Y$PRC_anti_japanese_base$§! แลว"
 PRC_secure_the_peoples_support: "ครองใจประชาชน"
 PRC_secure_the_peoples_support_desc: "แมเราจะยังไมไดควบคุมจีนสวนใหญ เราก็ตองทําใหมั่นใจวาประชาชนจะภักดีตออุดมการณของเรา ในกรณีที่สงครามกลางเมืองปะทุขึ้นอีกครั้ง"
 PRC_secure_the_peoples_support_tt: "ปลดล็อกการตัดสินใจ §Y$PRC_infiltration_sea_cat$§! ครบทั้ง §Y3 ระดับ§!"
 PRC_rural_recruitment: "เกณฑคนในชนบท"
 PRC_rural_recruitment_desc: "ผูยึดครองไมมีทางเฝาระวังชุมชนชนบททุกแหงได ทําใหเราสามารถเกณฑคนที่นั่นไดโดยมีความเสี่ยงนอยที่สุด"
 PRC_rural_recruitment_tt: "เมื่อ §Yแทรกซึม§! รัฐประเภท §Yชนบท§!, §Yชนบทที่พัฒนาแลว§! หรือ §Yทุงปศุสัตว§! จะไดรับกําลังพล §G[?PRC_rural_recruitment_manpower]§!"
 PRC_raid_weapon_depots: "จูโจมคลังอาวุธ"
 PRC_raid_weapon_depots_desc: "ความพยายามแทรกซึมทําใหเราทําแผนที่เครือขายการสงกําลังบํารุงของศัตรูได เราสามารถใชประโยชนจากสิ่งนี้เพื่อจูโจมเครือขายเหลานั้น แลวใชยุทโธปกรณที่ยึดไดสงสายลับออกไปมากขึ้นอีก"
 PRC_raid_weapon_depots_tt: "ปลดล็อก §Y$raid_type_PRC_weapons_depot_raid$§! ในทุกที่ที่ [ROOT.GetNameWithFlag] ไดตั้ง §Yเซลลกองโจร§! หรือ §Y$PRC_anti_japanese_base$§! ไว เพื่อรับ §Y$infantry_equipment$§! และ §Y$artillery$§!"
 PRC_empower_the_guerillas: "เสริมอํานาจกองโจร"
 PRC_empower_the_guerillas_desc: "เมื่อกองกําลังกองโจรของเรามีประสบการณมากขึ้น เราก็เริ่มปลอยใหพวกเขาปฏิบัติการอยางอิสระได ซึ่งจะทําใหกองกําลังแทรกซึมไดลึกยิ่งขึ้น และปองกันไมใหพวกเขาถูกเปดโปงหากการติดตอของเรากับพวกเขาถูกดักจับ"
 PRC_empower_the_guerillas_tt: "§Gลดตนทุนลงครึ่งหนึ่ง§! สําหรับการตัดสินใจ §Y$PRC_guerilla_warfare_sea_cat$§! และปลดล็อกการตัดสินใจเพื่อแทนที่ §Y$PRC_guerilla_cells_active_1$§! ดวย §Y$PRC_guerilla_cells_active_2$§! ผลที่เปลี่ยนแปลง:"
 PRC_holding_half_the_sky: "คํ้าฟาไวครึ่งหนึ่ง"
 PRC_holding_half_the_sky_desc: "สถานะของสตรีในสังคมจีนไมเทาเทียมมาชานาน ขณะที่เรามุงสูความเทาเทียม เราตองเปลี่ยนแปลงเรื่องนี้ดวย ดังที่เหมาเคยกลาวไว สตรีคํ้าฟาไวครึ่งหนึ่ง และเราตองเปดโอกาสใหพวกเธอมีสวนรวมในการปฏิวัติ"
 PRC_question_the_faction_leadership: "ตั้งคําถามตอผูนําฝาย"
 PRC_question_the_faction_leadership_desc: "เพื่อเพิ่มอิทธิพล เราควรชี้ใหเห็นความผิดพลาดของผูนําพันธมิตร พรอมกับชูความสําเร็จของเราเอง"
 PRC_to_unify_a_country: "รวมประเทศเปนหนึ่ง"
 PRC_to_unify_a_country_desc: "เมื่อสถานะของเราแข็งแกรงขึ้นทั้งทางการเมืองและการทหารในดินแดนของขุนศึกอื่น ๆ เราตองเรียกรองทรัพยากรและการยอมรับที่สมควรไดรับ"
 PRC_to_unify_a_country_tt: "สงมอบรัฐใด ๆ ที่ถูก §Y[ROOT.GetName]§! §Yแทรกซึม§! สําเร็จแลว"
 PRC_strengthen_the_central_party_school: "เสริมความแข็งแกรงโรงเรียนพรรคกลาง"
 PRC_strengthen_the_central_party_school_desc: "การฝกเจาหนาที่พรรครุนใหมผานโรงเรียนพรรคกลาง หมายความวาบอลเชวิค 28 คนครึ่งและผูสนับสนุนที่ไดรับการฝกในสหภาพโซเวียตจะคอย ๆ มีจํานวนนอยกวาเจาหนาที่ที่ฝกจากโรงเรียนแหงนี้"
 PRC_propaganda_efforts: "ความพยายามดานโฆษณาชวนเชื่อ"
 PRC_propaganda_efforts_desc: "การโฆษณาชวนเชื่อเปนสวนสําคัญในการหาผูติดตามใหการปฏิวัติ และรักษาความเชื่อมั่นของผูติดตามที่มีอยูแลว โฆษณาชวนเชื่อของเรายังอาจถูกพันธมิตรนําไปใชเมื่อพวกเขาปลุกระดมประชาชนใหปกปองจีน"
 PRC_propaganda_efforts_1_tt: "ไดรับ §Yอิทธิพลในฝาย§! §G[?PRC_gain_faction_inluence_number|%]§! ตอการตัดสินใจ §Yสงครามกองโจร§! แตละครั้ง และตอการ §Yแทรกซึม§! รัฐ[CHI.GetAdjective]"
 PRC_propaganda_efforts_2_tt: "ไดรับ §Yอิทธิพลในฝาย§! §G[?PRC_gain_faction_inluence_number|%]§! ตอการตัดสินใจ §Yสงครามกองโจร§! แตละครั้ง"
 PRC_establish_yanan_university: "กอตั้งมหาวิทยาลัยเหยียนอาน"
 PRC_establish_yanan_university_desc: "เครือขายโรงเรียนที่แยกกันสําหรับศิลปะ วิทยาศาสตร และการศึกษาการเมืองในปจจุบันไมมีประสิทธิภาพอยางยิ่ง หากรวมโรงเรียนเหลานี้เขาดวยกัน เราจะสอนไดมีประสิทธิภาพยิ่งขึ้น และขยายขอบเขตความรูของนักศึกษาดวยการใหพวกเขาแลกเปลี่ยนความรูอันหลากหลายกัน"
 PRC_peaceful_reunification: "แสวงหาการรวมชาติโดยสันติ"
 PRC_peaceful_reunification_desc: "เราคือผูนําที่แทจริงของจีน และขอเท็จจริงนี้ตองไดรับการยอมรับอยางเด็ดขาด เราจะพยายามโนมนาว[WTT_current_china_leader.GetNameDef]ใหยอมรับความจริงขอนี้ หากพวกเขาปฏิเสธ... ก็... ชาติจะไดเห็นวาพวกเขาเปนใครกันแน"
 PRC_adopt_sun_yat_sens_principles: "รับหลักการของซุน ยัตเซ็น"
 PRC_adopt_sun_yat_sens_principles_desc: "หลักการของซุน ยัตเซ็น ไดแก ชาตินิยม ประชาธิปไตย และสวัสดิการ ไมไดขัดแยงกับคุณคาคอมมิวนิสตที่เรามุงหวังแตอยางใด วิสัยทัศนของเขาที่เคยทําใหจีนมีเสถียรภาพอาจถูกทําใหเปนจริงไดมากยิ่งขึ้นในตอนนี้"
 PRC_establish_democratic_socialism: "สถาปนาสังคมนิยมประชาธิปไตย"
 PRC_establish_democratic_socialism_desc: "ผลงานสําคัญของเราเพื่อจีนอาจถูกจารึกไวในหนังสือประวัติศาสตร แตเมื่อยามยากลําบากหวนกลับมา ผลงานเหลานี้จะไมมีความหมายมากนัก ดังนั้นประชาชนตองรูสึกวาพวกเขาสามารถชี้นําการปฏิวัติ และเรียกรองความรับผิดชอบจากรัฐบาลดวยคะแนนเสียงได หากรัฐบาลบกพรองตอหนาที่"
 PRC_form_central_social_affairs_department: "จัดตั้งกรมกิจการสังคมกลาง"
 PRC_form_central_social_affairs_department_desc: "การปรับเปาหมายของการปฏิวัติยอมนําไปสูการถกเถียงระหวางผูสนับสนุนและผูคัดคานอยางหลีกเลี่ยงไมได แตวาทกรรมทางอุดมการณนี้ก็เสี่ยงที่จะเบี่ยงเบนไปสูประเด็นตอตานการปฏิวัติ ดังนั้นเราตองจัดตั้งหนวยขาวกรองเพื่อติดตามผลกระทบจากการฝงรากของลัทธิเหมา"
 PRC_reform_the_republic: "ปฏิรูปสาธารณรัฐ"
 PRC_reform_the_republic_desc: "สาธารณรัฐเปนแนวคิดที่ดี แตถูกนําไปปฏิบัติอยางยํ่าแย เราคือผูสืบทอดอุดมคติของสาธารณรัฐที่แทจริง"
 PRC_asian_democratic_union: "สหภาพประชาธิปไตยเอเชีย"
 PRC_asian_democratic_union_desc: "เพื่อสงเสริมความเทาเทียม เราตองรวมมือกับหุนสวนในเอเชียเพื่อใหมั่นใจวาพวกเขามีอํานาจตอรองที่แข็งแกรงบนเวทีโลก"
 PRC_asian_democratic_union_tt: "§Y$PRC_asian_democratic_union_modifier$§! เพิ่ม §Yความเร็วการวิจัย§! §G+1.00%§! และ §Yสัดสวนโรงงานสินคาอุปโภคบริโภค§! §Y-2.0%§! ตอสมาชิกฝายใหมแตละราย สูงสุดความเร็วการวิจัย §G+10.0%§! และสัดสวนโรงงานสินคาอุปโภคบริโภค §Y-20.0%§!"
 PRC_yanan_rectification_movement: "ขบวนการชําระสะสางเหยียนอาน"
 PRC_yanan_rectification_movement_tt: "ขึ้นอยูกับคาปจจุบันของ §Y$PRC_communist_power_struggle$§! โดย §Y$PRC_maoism_dynamic_modifier$§! จะไดรับตัวปรับคาที่แตกตางกัน\nผลปจจุบัน:"
 PRC_yanan_rectification_movement_desc: "ความสําเร็จของระบอบเราจนถึงตอนนี้ลวนเปนผลงานของเหมา และเราตองใชบารมีนี้ตอกยํ้าลัทธิเหมาในพรรค การแกไขธรรมนูญพรรคใหรวมแนวคิดของเหมา และอางวาเปนคอมมิวนิสตรูปแบบแรกที่ปรับใหเขากับสภาพเฉพาะของจีน จะทําใหการคัดคานแนวคิดเหลานี้ยากขึ้น"
 PRC_enforce_maoism: "บังคับใชลัทธิเหมา"
 PRC_enforce_maoism_desc: "เพื่อเสริมสถานะของลัทธิเหมาใหแข็งแกรงยิ่งขึ้น เราควรผูกอุดมการณนี้เขากับการนําของรัฐและพรรคอยางสมบูรณ ทําใหเหมาเปนสัญลักษณของทั้งชาติ"
 PRC_deepen_the_dixie_mission: "กระชับความรวมมือภารกิจดิกซี"
 PRC_deepen_the_dixie_mission_desc: "ความมุงมั่นที่[USA.GetNameDef]แสดงในการรวมมือกับ[ROOT.GetNameDef]นั้นนาชื่นชม บางทีพวกเขาอาจยินดีขยายภารกิจดิกซีดวยผูเชี่ยวชาญ[USA.GetAdjective]เพื่อปรับปรุงอุตสาหกรรมของเราใหทันสมัย"
 PRC_invite_the_dixie_mission: "เชิญภารกิจดิกซี"
 PRC_invite_the_dixie_mission_desc: "ในฐานะมหาอํานาจที่กําลังผงาดขึ้นในเอเชีย เราควรหยั่งเชิงวา[USA.GetNameDef]สนใจจะสรางความสัมพันธทางการทูตหรือไม บางทีพวกเขาอาจตางจากมหาอํานาจจักรวรรดินิยมรอบตัวเรา และยินดีชวยสรางจีนที่สามารถปองกันตนเองจากภัยคุกคามภายนอกได"
 PRC_overthrow_the_ussr: "โคนคอมมิวนิสตจอมปลอม"
 PRC_overthrow_the_ussr_desc: "ความแตกตางทางอุดมการณระหวางเรากับมหาอํานาจคอมมิวนิสตอื่น ๆ ไมไดเกิดจากการที่เราปรับตัวใหเขากับสถานการณในจีนเพียงอยางเดียว นโยบายปฏิกิริยาและเผด็จการเบ็ดเสร็จของมหาอํานาจเหลานั้นไปไกลเกินไปแลว และเราควรเขาแทรกแซงเพื่อปลดปลอยชนชั้นกรรมาชีพของพวกเขาจากการปฏิวัติรูปแบบที่มัวหมองนั้น"
 PRC_overthrow_the_ussr_tt: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอประเทศคอมมิวนิสตมหาอํานาจทุกประเทศ ผลปจจุบัน:"
 PRC_two_soviets_together: "สองโซเวียตเคียงคู"
 PRC_two_soviets_together_desc: "แมเราจะปรับทิศทางอุดมการณไปแลว แตเรายังคงมีสายสัมพันธทางอุดมการณอันแนนแฟนกับ[SOV.GetNameDef] และแนนอนวาเราไมไดลืมการสนับสนุนทั้งทางวัตถุและการเมืองจากพวกเขาตลอดหลายปที่ผานมา"
 PRC_tech_agreement_with_ussr: "ขอตกลงวาดวยเทคโนโลยีปองกันประเทศใหม"
 PRC_tech_agreement_with_ussr_desc: "ความกาวหนาของการปฏิวัติเราทําใหเราสามารถมีสวนรวมดานการวิจัยในความเปนหุนสวนกับ[SOV.GetNameDef]ได เมื่อเราตามทันเทคโนโลยีของพวกเขาในหลายสาขาแลว เราสามารถแบงปนผลการประเมินยุทโธปกรณของพวกเขา โดยปราศจากอคติที่ติดมากับการเปนผูพัฒนาเอง"
 PRC_the_end_of_capitalism: "จุดจบของทุนนิยม"
 PRC_the_end_of_capitalism_desc: "ความรวมมืออยางใกลชิดกับ[SOV.GetNameDef]ทําใหพันธมิตรของเราแข็งแกรงพอที่จะทาทายมหาอํานาจทุนนิยมไดแลว ดวยกัน เราสามารถเผยแพรการปฏิวัติและปลดปลอยดินแดนอาณานิคมของพวกเขา"
 PRC_purge_the_world_of_fascism: "กวาดลางฟาสซิสตใหสิ้นโลก"
 PRC_purge_the_world_of_fascism_desc: "แมจะสัญญาวาจะแตกตางจากทุนนิยม แตความเกลียดชังที่ฟาสซิสตมีตอคอมมิวนิสตก็เปนหลักฐานเพียงพอวานั่นเปนเพียงเรื่องตลก วิธีการถึงรากที่เราใชปลดปลอยชนชั้นกรรมาชีพ ถูกฟาสซิสตนําไปใชกดขี่ชนชั้นกรรมาชีพ และนั่นคือสิ่งที่เราควรเขาแทรกแซง"
 PRC_hundred_regiments_offensive: "การรุกรอยกรมทหาร"
 PRC_hundred_regiments_offensive_desc: "การขยายกองทัพและจัดระเบียบเปนกองกําลังอิสระจํานวนมาก จะทําใหเราสรางความปนปวนแกเสนทางเสบียงของขาศึกได"
 PRC_prepare_for_the_inevitable: "เตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 PRC_prepare_for_the_inevitable_desc: "ทาทีขยายอํานาจทั้งจาก[JAP.GetNameDef] และอาจรวมถึงพันธมิตรดั้งเดิมของเราอยาง[SOV.GetNameDef] กําลังคุกคามอยูที่ขอบฟา เราตองวางขอกังวลทางอุดมการณไวกอน และเตรียมพรอมแสดงแนวรวมที่เปนเอกภาพตอภัยคุกคามภายนอก"
 PRC_ask_for_soviet_lend_lease: "ขอความชวยเหลือใหยืม-เชาจากโซเวียต"
 PRC_ask_for_soviet_lend_lease_desc: "$PRC_secure_lend_lease_from_soviet_desc$"
 #28 BOLSHEVIKS ALT-HISTORY
 PRC_reclaim_the_grasp_of_power: "ทวงคืนกุมอํานาจ"
 PRC_reclaim_the_grasp_of_power_desc: "อํานาจที่เคลื่อนไปอยูกับเหมาจากการนําทัพในการเดินทัพทางไกล กําลังหวนกลับสูผูนําเดิมของพรรคในที่สุด เมื่อการเดินทัพทางไกลสิ้นสุดลง $PRC_wang_ming$ หรือ $PRC_bo_gu$ ก็พรอมจะรับบทบาทผูนําอีกครั้ง"
 PRC_playing_both_sides: "เลนทั้งสองฝง"
 PRC_playing_both_sides_desc: "เราตองพยายามรักษาความภักดีของประชาชนในรัฐขุนศึกและรัฐ[CHI.GetAdjective] เผื่อวาวันหนึ่งจะถึงเวลาแหงการรบชี้ขาดเพื่ออนาคตของประเทศเรา"
 PRC_the_fight_of_a_people: "การตอสูของประชาชน"
 PRC_the_fight_of_a_people_desc: "ประชาชนของเราตองตอตานการรุกคืบของศัตรู แมจะอยูในดินแดนที่ถูกศัตรูยึดครอง เราควรสงหนวยขนาดเล็กไปรวบรวมขบวนการตอตานในทองถิ่น เพื่อบอนทําลายผูยึดครองอยางไดผล และปลดปลอยมาตุภูมิในที่สุด"
 PRC_a_stronger_united_front: "แนวรวมแหงชาติที่แข็งแกรงยิ่งขึ้น"
 PRC_a_stronger_united_front_desc: "เราควรแสดงให[CHI.GetName]เห็นวาเราเปนพันธมิตรที่ไวใจได เพื่อที่พวกเขาจะไมรูสึกวาตองสํารองทรัพยากรไวเผื่อเราผิดสัญญาพันธมิตร เราจะไดมีสวนในการตัดสินใจมากขึ้น"
 PRC_sino_allied_pact_of_non_aggression: "สนธิสัญญาไมรุกรานจีน-สัมพันธมิตร"
 PRC_sino_allied_pact_of_non_aggression_desc: "ขณะที่เรากําจัดอิทธิพลตางชาติออกจากจีน เราตองทําใหมั่นใจวามหาอํานาจที่ไมคอยขยายดินแดนจะไมเขามาเกี่ยวของ"
 PRC_sino_allied_pact_of_non_aggression_accept_tt: "พวกเขาจะลงนาม §Yสนธิสัญญาไมรุกราน§! กับ §Y[ROOT.GetName]§!"
 PRC_with_inspiration_from_nkvd: "ดวยแรงบันดาลใจจาก NKVD"
 PRC_with_inspiration_from_nkvd_desc: "NKVD ของโซเวียต ซึ่งผูนําหลายคนของเราเคยไดยินผานสายสัมพันธกับเจาหนาที่โซเวียต ตองเปนแบบอยางของการปองกันศัตรูจากภายใน"
 PRC_soviet_technological_cooperation: "ความรวมมือทางเทคโนโลยีกับโซเวียต"
 PRC_soviet_technological_cooperation_desc: "เราจะมุงหา[SOV.GetNameDef]เพื่อทําขอตกลงดานการวิจัย เพื่อสงเสริมเปาหมายของทั้งสองชาติ"
 PRC_reestablish_moscow_sun_yat_sen_university: "ฟนฟูมหาวิทยาลัยซุน ยัตเซ็นแหงมอสโก"
 PRC_reestablish_moscow_sun_yat_sen_university_desc: "ดวยการฟนฟูและเพิ่มงบประมาณใหมหาวิทยาลัยซุน ยัตเซ็นแหงมอสโก เราจะชวยชี้นําและพัฒนาชาติดวยการบมเพาะนักวิชาการรุนตอไปตามแบบอยางของ 28 คนครึ่งที่มากอน"
 PRC_a_truly_united_front: "แนวรวมแหงชาติที่เปนหนึ่งเดียวอยางแทจริง"
 PRC_a_truly_united_front_desc: "เราตองเสริมความแข็งแกรงใหคณะทูตของเรา และยกระดับสถานะของแนวรวมแหงชาติครั้งที่สอง"
 PRC_a_truly_united_front_tt: "§Gลดตนทุนลงครึ่งหนึ่ง§! สําหรับการตัดสินใจ §Y$PRC_28_bolshevik_faction_cat$§!"
 PRC_part_of_the_comintern: "สวนหนึ่งของโคมินเทิรน"
 PRC_part_of_the_comintern_desc: "เมื่อการปฏิวัติในประเทศกาวหนาไปแลว เราสามารถมุงชวยเหลือโคมินเทิรนในเปาหมายระดับสากล"
 PRC_petition_for_freedom: "ยื่นคํารองขอเอกราช"
 PRC_petition_for_freedom_desc: "นานเกินไปแลวที่เอกราชของเราอยูในมือผูอื่น ถึงเวลาเปลี่ยนแปลงเรื่องนี้อยางเด็ดขาด"
 PRC_petition_for_freedom_not_subject_tt: "§Yไมมีผลหากไมไดเปนรัฐในอารักขา§!"
 PRC_aggressive_pursuit_of_diplomacy: "การทูตเชิงรุกอยางดุดัน"
 PRC_aggressive_pursuit_of_diplomacy_desc: "แมเราอยากใชการทูตในรูปแบบที่มีอารยะกวานี้ แตบางครั้งการขูวาจะใชกําลังก็เปนสิ่งที่จําเปนเพื่อใหเจตจํานงของเราเปนใหญ และหากการขูไมไดผล..."
 PRC_supreme_infiltration: "การแทรกซึมขั้นสูงสุด"
 PRC_supreme_infiltration_desc: "จากประสบการณการแทรกซึมที่ผานมา เราไดบทเรียนที่สามารถนํามาใชขยายปฏิบัติการเหลานี้ ดึงเพื่อนรวมชาติมาอยูฝายเรามากขึ้นเรื่อย ๆ"
 PRC_scholarly_revolution: "การปฏิวัติของปญญาชน"
 PRC_scholarly_revolution_desc: "ผูนําของเรามาจากกลุมปญญาชน และเราตองหลอหลอมอนาคตของชาว[ROOT.GetAdjective]ผานมุมมองของพวกเขา"
 #COMMON END-FOCUSES
 PRC_towards_one_china: "สูจีนเดียว"
 PRC_towards_one_china_desc: "รัฐขุนศึกบอนทําลายเสถียรภาพของจีนมากเกินกวาจะปลอยใหคงอยูตอไป ดังนั้นควรสถาปนาการนําแบบรวมศูนย"
 PRC_towards_one_china_bypass_tt: "§Yทุกประเทศจีน§!: ตองเปนไปตามเงื่อนไขขอใดขอหนึ่งตอไปนี้: \n  ไมมีอยู\n  อยูในภาวะสงครามกับ §Y[ROOT.GetNameWithFlag]§!\n  เปนรัฐในอารักขาของ §Y[ROOT.GetNameWithFlag]§!\n  อยูในฝายเดียวกับ §Y[ROOT.GetNameWithFlag]§!\n  §Y[ROOT.GetName]§!: มี §Yเปาหมายสงคราม§! ตอประเทศนั้น"
 PRC_towards_one_china_tt: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอประเทศจีนทุกประเทศที่ไมไดเปนพันธมิตร ผลปจจุบัน:"
 PRC_allow_autonomous_regions: "อนุญาตเขตปกครองตนเอง"
 PRC_allow_autonomous_regions_desc: "ความตองการเฉพาะของแตละภูมิภาคในจีนควรไดรับการยอมรับ ดวยการใหอํานาจปกครองตนเองในระดับหนึ่ง"
 PRC_allow_autonomous_regions_tt: "\n§Yประเทศจีนที่เปนพันธมิตร§!ทุกประเทศอาจเลือกเปนรัฐในอารักขาของ §Y[ROOT.GetNameDef]§! ผลปจจุบัน:"
 PRC_the_peoples_republic: "สาธารณรัฐประชาชน"
 PRC_the_peoples_republic_desc: "เมื่อการปฏิวัติตั้งมั่นอยางมั่นคงแลว เราสามารถเริ่มเปลี่ยนผานจากรัฐปฏิวัติไปสูรัฐที่มอบเสถียรภาพและความรุงเรืองแกพลเมืองดวยการปฏิรูป"
 PRC_remove_iniltration_and_guerilla_decisions_tt: "§Rนําออก§!การตัดสินใจ §Y$PRC_infiltration_sea_cat$§! และ §Y$PRC_guerilla_warfare_sea_cat$§!"
 PRC_taiwan: "ยึดไตหวัน"
 PRC_taiwan_desc: "การที่รัฐบาลราชวงศชิงในอดีตเสียไตหวันใหแกญี่ปุนตองถูกแกไข แมความจําเปนตองใชการสนับสนุนทางอากาศหรือทางทะเลจะเปนความทาทายเฉพาะตัวก็ตาม"
 PRC_reclaim_tibet: "ทวงคืนทิเบต"
 PRC_reclaim_tibet_desc: "ความไรเสถียรภาพในจีนเปดโอกาสให[TIB.GetNameDef]แยกตัวจากการปกครองของจีน แตสายสัมพันธทางประวัติศาสตรระหวางชาติของเราไมอาจมองขามได เราตองมุงรวมเปนหนึ่งกับพวกเขาอีกครั้ง เพื่อใหพรมแดนของเราจรดเทือกเขาหิมาลัยอีกครา"
 PRC_subjugate_korea: "ปราบเกาหลีใหสยบ"
 PRC_subjugate_korea_desc: "การที่[JAP.GetNameDef]ยึดครองเกาหลีและขยายเขาสูแมนจูเรียในเวลาตอมาแสดงใหเห็นวา เกาหลีที่เปนพันธมิตรมีความสําคัญยิ่งตอความปลอดภัยของ[ROOT.GetAdjective] หากตอนนี้ยังไมใชทางเลือก เราควรเขาแทรกแซง"
 PRC_dare_to_struggle: "กลาตอสู..."
 PRC_dare_to_struggle_desc: "เมื่อรัฐขุนศึกมาอยูฝายเราแลว ก็ถึงเวลาตอสูกับผูรุกรานตางชาติที่ยึดบางสวนของจีนเปนอาณานิคม"
 PRC_dare_to_win: "... กลาชนะ"
 PRC_dare_to_win_desc: "การขยายดินแดนเขาสูแผนดินจีนของบรรพบุรุษจักรวรรดินิยมของ[SOV.GetNameDef]ไดรับการใหอภัยเพื่อความสัมพันธที่ดีขึ้น แตไมไดถูกลืม เราควรพยายามฟนฟูพรมแดนดั้งเดิมของเรา เมื่อเรามีกําลังพอจะทําเชนนั้นแลว"
 PRC_move_capital: "ยายเมืองหลวง"
 PRC_move_capital_desc: "หลังการสถาปนา $PRC_proclaimed_communism$ ยอมเปนเรื่องธรรมดาที่เราจะยายที่ตั้งรัฐบาลและคืนชื่อเมืองเปนปกกิ่ง"
 PRC_beijing_capital_name: "ปกกิ่ง"
 beijing_winter_capital_name: "ขานบาลิก"
 yuan_summer_capital_name: "ชางตู"
 PRC_education_reform: "ปฏิรูปการศึกษา"
 PRC_education_reform_desc: "เราจะดําเนินการเพื่อปฏิรูปการศึกษาทั่วประเทศอยางรวดเร็ว โดยมุงนําระบบอุดมศึกษาแบบโซเวียตมาใช เนนการศึกษาดานวิศวกรรมและเทคนิค"
 PRC_the_first_premier: "นายกรัฐมนตรีคนแรก"
 PRC_the_first_premier_desc: "$PRC_zhou_enlai$ จะไดรับแตงตั้งเปนนายกรัฐมนตรีคนแรกของ $PRC_proclaimed_communism$ ตอกยํ้าสถานะของเขาในฐานะหนึ่งในนักการเมืองแถวหนาของพรรค"
 PRC_the_party_builds_the_nation: "พรรคสรางชาติ"
 PRC_the_party_builds_the_nation_desc: "เมื่อเราควบคุมพื้นที่กวางใหญของจีนไดแลว ก็ถึงเวลาเริ่มรณรงคทั่วประเทศเพื่อใชประโยชนจากประชากรและอุตสาหกรรมที่กําลังเติบโตของเรา"
 PRC_the_chinese_century: "ศตวรรษแหงจีน"
 PRC_the_chinese_century_desc: "การเติบโตทางเศรษฐกิจควบคูกับอํานาจทางการเมืองที่มากพอจะกําหนดทิศทางโลก คือสิ่งที่ชาตินี้โหยหามาตลอด และบัดนี้ไดรับแลว การผงาดขึ้นของจีนเริ่มตนขึ้นแลว นี่คือศตวรรษของเรา"
 #UNWILLING DIARCHY ALT-HISTORY
 PRC_the_unwilling_diarchy_focus: "อํานาจคูที่ไมเต็มใจ"
 PRC_the_unwilling_diarchy_focus_desc: "ยามวิกฤตตองใชมาตรการเด็ดขาด เราตองแทนที่องคกรพรรคที่มีอยู เพื่อใหแนใจวาผูนําชุดใหมมีอํานาจที่จะลงมือตอศัตรูของประชาชนไดอยางรวดเร็ว \n\nเหมาและกั๋วเทาตองวางความขัดแยงไวและทํางานรวมกัน"
 PRC_the_unwilling_diarchy_focus_tt: "คุณจะไมสามารถจัดตั้งหรือเขารวม §Yแนวรวมแหงชาติครั้งที่สอง§! ได"
 PRC_the_response_to_a_threat: "การตอบโตภัยคุกคาม"
 PRC_the_response_to_a_threat_desc: "เราจะทําสิ่งที่จําเปนเพื่อตอบโตภัยคุกคามทั้งหมดที่รายลอมเรา เราตองเตรียมพรอมรับการโจมตี"
 PRC_promote_regular_army: "สงเสริมกองทัพประจําการ"
 PRC_promote_regular_army_desc: "มีเพียงวิธีการตามแบบแผนเทานั้นที่จะทําใหมั่นใจวากองทัพแดงสามารถปกปองและขยายดินแดนของ[ROOT.GetNameDef]ได"
 PRC_strict_training_regiments: "ระเบียบการฝกอันเขมงวด"
 PRC_strict_training_regiments_desc: "เราตองกวดขันวินัยของกองทัพแดง\n\nการฝกยามเชาทุกวันจะสรางกองทัพอาชีพไดในเวลาอันสั้น และยกระดับคุณภาพของทหารใหมที่สงไปยังหนวยแนวหนา"
 PRC_army_reforms: "ปฏิรูปกองทัพ"
 PRC_army_reforms_desc: "กองทัพแดงลาสมัยและยึดหลักนิยมเกาที่ใชไมไดอีกตอไปหลังการเดินทัพทางไกล เราตองสรางกองทัพใหมตั้งแตรากฐาน\n\nการปฏิรูปชุดใหมโดย[ROOT.GetLeader]รวมกับนายพลชั้นนําจะนําไปสูกองทัพแดงใหมที่แข็งแกรงยิ่งขึ้น"
 PRC_centralized_army_command: "การบัญชาการกองทัพแบบรวมศูนย"
 PRC_centralized_army_command_desc: "การบัญชาการแบบกระจายอํานาจไมเปนประโยชนแกเรา ขอมูลทั้งหมดตองไหลผานโครงสรางการบัญชาการใหม เพื่อยกระดับการวางแผนปฏิบัติการใหเหมาะสมตั้งแตระดับบนสุดลงไปถึงพลทหารชั้นผูนอยที่สุด"
 PRC_soviet_battle_tactics: "ยุทธวิธีการรบแบบโซเวียต"
 PRC_soviet_battle_tactics_desc: "ดวยการเลียนแบบยุทธวิธีของ[SOV.GetNameDef] เราสามารถใชกําลังพลจํานวนมากที่ทัดเทียมกันของเราใหเปนประโยชน เราจะมีคณะนายทหารที่ไดรับมอบหมายใหศึกษาบทเรียนจากประสบการณของ[SOV.GetNameDef]"
 PRC_promote_guerilla_warfare: "สงเสริมสงครามกองโจร"
 PRC_promote_guerilla_warfare_desc: "กองทัพแดงไมอาจหวังจะเทียบกําลังกับศัตรูได อยางนอยก็ยังไมใชตอนนี้ \n\nเราตองใชจุดแข็งของเรา และสูหลังแนวขาศึก กอนจะหายตัวไปอยางรวดเร็วเพื่อโจมตีอีกครั้ง"
 PRC_the_battle_behind_the_front_lines: "การรบหลังแนวขาศึก"
 PRC_the_battle_behind_the_front_lines_desc: "เราตองเพิ่มความพยายามเปนทวีคูณในการโจมตีผูรุกรานตางชาติหลังแนวของพวกเขา ดวยการขัดขวางเสบียงและความสามารถในการเสริมกําลังแนวหนา เราจะบีบใหขาศึกตองใชกําลังพลอันมีคาเพื่อปกปองแนวหลัง"
 PRC_gain_the_peoples_trust: "ไดรับความไววางใจจากประชาชน"
 PRC_gain_the_peoples_trust_desc: "เราจะแทรกซึมเขาไปในชนบทโดยรอบ ติดสินบนและขมขูบุคคลที่เกี่ยวของ เพื่อใหมั่นใจในความภักดีของประชาชนในพื้นที่ที่เรายังไมไดควบคุม เราจะตองการการสนับสนุนจากพวกเขาในวันขางหนา..."
 PRC_limited_infiltration_efforts: "ความพยายามแทรกซึมแบบจํากัด"
 PRC_limited_infiltration_efforts_desc: "เราตองทําทุกอยางที่ทําไดเพื่อรวมจีนเปนหนึ่ง ดวยวิธีการใดก็ตามที่จําเปน ประชาชนจีนตองรับรูวาเราไมไดลืมพวกเขา และเราจะใหการสนับสนุนทั้งทางวัตถุและทางจิตใจแกพวกเขาเมื่อวันที่ตองการมาถึง"
 PRC_secure_the_lands: "ยึดครองแผนดิน"
 PRC_secure_the_lands_desc: "เราใกลบรรลุเปาหมายกวาครั้งใด เราตองไมลังเลในตอนนี้ เราจําเปนตองใชทรัพยากรมากขึ้นเพื่อโนมนาวประชาชนที่อยูใตการควบคุมของรัฐบาลจอมปลอมใหเห็นถึงความชอบธรรมของอุดมการณเรา"
 PRC_launch_sabotage_campaigns: "เปดฉากการกอวินาศกรรม"
 PRC_launch_sabotage_campaigns_desc: "ปฏิบัติการกอวินาศกรรมตอผูรุกรานจะชวยสนับสนุนภารกิจของกองทัพแดง และขัดขวางการรุกคืบของขาศึก"
 PRC_raiding_parties: "หนวยจูโจม"
 PRC_raiding_parties_desc: "สิ่งที่เราขาดในดานกําลังอุตสาหกรรมเมื่อเทียบกับขาศึก เราชดเชยดวยความเฉลียวฉลาด การสงหนวยจูโจมออกไปไมเพียงชวยใหสถานการณยุทโธปกรณของเรามั่นคงขึ้น แตยังทําใหของพวกเขาแยลงดวย"
 PRC_mobilization_of_the_people: "ระดมพลประชาชน"
 PRC_mobilization_of_the_people_desc: "ในยามวิกฤต ประชาชนจะลุกขึ้นสู\n\nเราจะจัดตั้งหนวยทหารอาสาที่นําโดยทหารผานศึกการเดินทัพทางไกล และเกณฑพรอมติดอาวุธใหประชาชนในทองถิ่น"
 PRC_mobilization_of_the_people_tt: "สรางหนวยทหารอาสา §Yจีน 4§! หนวย"
 PRC_mao_zedong_ascends: "$PRC_mao_zedong$ ขึ้นสูอํานาจ"
 PRC_mao_zedong_ascends_desc: "$PRC_mao_zedong$ ยืนหยัดเพียงผูเดียวในฐานะผูนําที่แทจริงของ[ROOT.GetNameDef]\n\n$PRC_zhang_guotao$ ไมอาจอยูในระดับเดียวกับประธานเหมาไดอีกตอไป ผูนํามีไดเพียงหนึ่งเดียว"
 PRC_promote_womens_suffrage: "สงเสริมสิทธิเลือกตั้งของสตรี"
 PRC_promote_womens_suffrage_desc: "'สตรีคํ้าฟาไวครึ่งหนึ่ง' ความเทาเทียมทางเพศที่แทจริงคือเปาหมายของพรรค และเราตองดําเนินการเพื่อใหสตรีทั่วจีนมีสวนรวมทั้งทางกฎหมาย การเมือง สังคม และเศรษฐกิจ"
 PRC_zhang_guotao_ascends: "$PRC_zhang_guotao$ ขึ้นสูอํานาจ"
 PRC_zhang_guotao_ascends_desc: "$PRC_zhang_guotao$ ยืนหยัดเพียงผูเดียวในฐานะผูนําที่แทจริงของ[ROOT.GetNameDef]\n\n$PRC_mao_zedong$ ไมอาจอยูในระดับเดียวกับประธานกั๋วเทาไดอีกตอไป ผูนํามีไดเพียงหนึ่งเดียว"
 PRC_consolidate_politcal_power: "รวบอํานาจทางการเมือง"
 PRC_consolidate_politcal_power_desc: "บัดนี้ผูนําหนึ่งเดียวยืนอยูเหนือสุด และเปนเรื่องสําคัญยิ่งที่เราตองรวบอํานาจนี้ใหมั่นคงไปทั่วทุกโครงสรางของพรรค ผูเห็นตางจะไมไดรับอนุญาต"
 PRC_consolidate_politcal_power_tt: "เลื่อน §Y$PRC_communist_power_struggle$§! ไปทางฝายที่นําอยู ผลปจจุบัน:"
 PRC_secure_lend_lease_from_soviet: "รับความชวยเหลือใหยืม-เชาจาก[SOV.GetNameDef]"
 PRC_secure_lend_lease_from_soviet_desc: "ความพยายามในอดีตที่จะเชื่อมเสนทางทางบกกับ[SOV.GetNameDef]ลมเหลวอยางยอยยับ แตเมื่อเราฝาอุปสรรคนี้ไดแลว การรับเสบียงจากพวกเขาก็จะงายขึ้นมาก"
 PRC_preemptive_strike: "โจมตีชิงลงมือกอน"
 PRC_preemptive_strike_desc: "ผลพวงของการลุกฮือที่หนานชางในป 1927 แสดงใหเห็นวากองกําลังชาตินิยมมีประสิทธิภาพเพียงใด เพื่อปองกันการเดินทัพทางไกลอีกครั้ง เราตองโจมตีกอน ทําการโอบลอมเอง และใชประโยชนจากที่มั่นที่ไดเปรียบกวาของเรา"
 PRC_an_end_to_the_japanese_threat: "ยุติภัยคุกคามจาก[JAP.GetAdjective]"
 PRC_an_end_to_the_japanese_threat_desc: "การปรากฏตัวของ[JAP.GetAdjective]ที่หนาประตูบานเราเปนภัยคุกคามอยูตลอดเวลา เพราะความทะเยอทะยานแบบจักรวรรดินิยมของพวกเขาไมมีขีดจํากัด หากเราโจมตีกอน เราอาจจูโจมพวกเขาไดโดยไมทันตั้งตัว"
 PRC_assume_leadership: "รับตําแหนงผูนํา"
 PRC_assume_leadership_desc: "[GetAssumeLeaderShipText]"
 PRC_assume_leadership_tt: "ขึ้นอยูกับคาปจจุบันของ §Y$PRC_communist_power_struggle$§! โดย §Y[ROOT.GetLeader]§! จะไดรับคุณลักษณะที่แตกตางกัน\nผลปจจุบัน:"
 PRC_GetAssumeLeaderShipText_Wentian: "สถานะของประธานคนใหมตองไมถูกตั้งคําถาม เราตองกาวไปขางหนาในฐานะพรรคและชาติ"
 PRC_GetAssumeLeaderShipText_NotWentian: "สถานะของประธานคนใหมตองไมถูกตั้งคําถาม อดีตประธาน $PRC_zhang_wentian$ ไดทําหนาที่ของตนในการสรางเสถียรภาพใหพรรคแลว แตบัดนี้เปนยุคของ[ROOT.GetLeader]"
 PRC_emergency_supply_protocols: "มาตรการเสบียงฉุกเฉิน"
 PRC_emergency_supply_protocols_desc: "ระบบเสบียงของเราไมอาจดํารงอยูได เราตองทุมเทความพยายามทั้งหมดเพื่อปรับปรุงมัน มิฉะนั้นทหารของเราจะไมมีปน กระสุน และอาหาร"
 PRC_emergency_prodction_protocols: "มาตรการการผลิตฉุกเฉิน"
 PRC_emergency_prodction_protocols_desc: "เพื่อเพิ่มการผลิตในยามสงคราม เราตองกําหนดโควตาการผลิตใหอุตสาหกรรม มาตรการเชนนี้เสี่ยงที่จะทําใหผูสนับสนุนของเราตีตัวออกหาง แตขณะนี้ไมมีทางเลือกอื่น"
 PRC_extend_emergency_measures: "ขยายมาตรการฉุกเฉิน"
 PRC_extend_emergency_measures_desc: "เราใกลจะแกปญหาที่วิกฤตที่สุดไดกวาครั้งใด แตเราตองขยายความพยายามออกไป มิฉะนั้นสิ่งที่ทํามาจะสูญเปลา"
 PRC_extend_emergency_measures_1_tt: "เมื่อ §Y$PRC_emergency_supply_protocols$§! เสร็จสิ้นแลว §Yขยายระยะเวลาออกไป [?PRC_emergency_protocol_idea_days] วัน§! หรือ:"
 PRC_extend_emergency_measures_2_tt: "เมื่อ §Y$PRC_emergency_prodction_protocols$§! เสร็จสิ้นแลว §Yขยายระยะเวลาออกไป [?PRC_emergency_protocol_idea_days] วัน§! หรือ:"
 PRC_to_support_the_army: "เพื่อสนับสนุนกองทัพ"
 PRC_to_support_the_army_desc: "เราจะทําสิ่งที่ตองทําเพื่อขยายมาตรการที่ใชอยูแลว และทําใหการเปลี่ยนแปลงเหลานี้เปนการถาวร กองทัพตองมีสิ่งที่จําเปนตอการนําการปฏิวัติ"
 PRC_to_support_the_army_1_tt: "เมื่อ §Y$PRC_emergency_supply_protocols$§! เสร็จสิ้นแลว:"
 PRC_to_support_the_army_2_tt: "เมื่อ §Y$PRC_emergency_prodction_protocols$§! เสร็จสิ้นแลว:"
 PRC_reach_out_to_the_west: "ยื่นมือสูตะวันตก"
 PRC_reach_out_to_the_west_desc: "แมในอดีตชาติตะวันตกจะกระทําการตออธิปไตยของ[ROOT.GetAdjective]ซํ้าแลวซํ้าเลา แตพวกเขาก็มีทรัพยากรมากมายที่สามารถชวยให[ROOT.GetNameDef]เติบโตเปนมหาอํานาจโลกได"
 PRC_reach_out_to_the_west_tt: "หาก §Yประเทศมหาอํานาจตะวันตก§! ที่ไมใชฟาสซิสตกําลังสูกับศัตรูรวมกัน และไมมีฝายใดมีพันธมิตรที่กําลังรบกันเอง:"
 PRC_closer_ties_to_sov: "กระชับสัมพันธกับ[SOV.GetName]"
 PRC_closer_ties_to_sov_desc: "เราตองแสวงหาความสัมพันธที่ใกลชิดกับ[SOV.GetNameDef]ยิ่งขึ้นไปอีก สายสัมพันธจีน-โซเวียตแนนแฟนอยูแลว แตตองทําใหแนนแฟนยิ่งขึ้น"
 PRC_demand_warlord_loyalty: "เรียกรองความภักดีจากขุนศึก"
 PRC_demand_warlord_loyalty_desc: "เราตองรวมจีนภายใตการนําเดียว และตองแสดงใหทุกคนเห็นชัดวาจะเปนการนําของใคร\n\nเราจะสงสาสนถึงเหลาขุนศึก เปนขอเสนอใหจัดตั้งรัฐบาลปองกันชาติ [CHI.GetLeader]อาจไมเห็นดวย แตนี่คือสิ่งจําเปน"
 PRC_bring_war_to_neighboring_warlords: "ทําสงครามกับขุนศึกเพื่อนบาน"
 PRC_bring_war_to_neighboring_warlords_desc: "จีนมีผูปกครองไดเพียงหนึ่งเดียว กาวแรกในการเผยแพรการปฏิวัติคือการปราบขุนศึกใหสยบ"
 PRC_bring_war_to_neighboring_warlords_tt: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอ §Yขุนศึกเพื่อนบาน§! ทั้งหมด ผลปจจุบัน:"
 PRC_lessons_of_the_west: "บทเรียนจากตะวันตก"
 PRC_lessons_of_the_west_desc: "เราจะมองไปนอกพรมแดนเพื่อดูวามีบทเรียนใดจากชาติอื่นที่เราจะนํามาใชได เรียนรูจากผูที่อุตสาหกรรมไปถึงขีดที่ของเรายังไปไมถึง อยางนอยก็ในตอนนี้\n\nเราตองไลตามใหทัน"
 PRC_the_long_march_towards_progress: "การเดินทัพทางไกลสูความกาวหนา"
 PRC_the_long_march_towards_progress_desc: "เราตองกาวหนาตอไป เราอาจลาหลังทางเทคโนโลยี แตจะไมเปนเชนนั้นตลอดไป ตองทุมทรัพยากรเพื่อเสริมความแข็งแกรงใหภาคการศึกษาใน[ROOT.GetNameDef]"
 PRC_every_peasant_a_soldier: "ชาวนาทุกคนคือทหาร"
 PRC_every_peasant_a_soldier_desc: "ทุกคนที่มีรางกายแข็งแรงซึ่งตรากตรําในไรนา ตองพรอมจับอาวุธดวยหากชาติตองการ\n\n'สงครามปฏิวัติคือสงครามของมวลชน มีเพียงการระดมมวลชนและพึ่งพามวลชนเทานั้นจึงจะทําสงครามนี้ได'"
 PRC_every_peasant_a_soldier_1_tt: "เมื่อ §Y$PRC_promote_guerilla_warfare$§! เสร็จสิ้นแลว:"
 PRC_every_peasant_a_soldier_2_tt: "เมื่อ §Y$PRC_promote_regular_army$§! เสร็จสิ้นแลว:"
 PRC_avenge_the_century_of_humiliation: "ชําระแคนศตวรรษแหงความอัปยศ"
 PRC_avenge_the_century_of_humiliation_desc: "คริสตศตวรรษที่ 19 คือศตวรรษแหงความอัปยศที่มหาอํานาจตะวันตกกระทําตอเรา ถึงเวลาแลวที่หนี้นี้จะตองถูกชดใช"
 PRC_avenge_the_century_of_humiliation_tt: "[ROOT.GetNameWithFlag] ไดรับเปาหมายสงคราม §Yพิชิต (แผนยุทธศาสตร)§! ตอ §Yประเทศตะวันตก§! ที่เปนเพื่อนบานหรือรัฐในอารักขาของประเทศนั้น ผลปจจุบัน:"
 PRC_the_march_to_victory: "การเดินทัพสูชัยชนะ"
 PRC_the_march_to_victory_desc: "การเดินทัพสูชัยชนะเปนสิ่งที่หลีกเลี่ยงไมได สิ่งที่เริ่มตนจากอํานาจคูที่ไมเต็มใจไดนําไปสูโครงสรางพรรคที่แข็งแกรงและเปนเอกภาพ บัดนี้เราตองมองออกไปขางนอก สูศัตรูภายในของเรา"
 PRC_a_new_central_committee: "คณะกรรมการกลางชุดใหม"
 PRC_a_new_central_committee_desc: "ถึงเวลาเปลี่ยนแปลงแลว $PRC_zhang_guotao$ จะสั่งใหทบทวนคณะกรรมการกลางทั้งหมด และสรางขึ้นใหมตั้งแตตน"
 PRC_a_new_central_committee_tt_1: "เปนเวลา §Y180 วัน§!:"
 PRC_a_new_central_committee_tt_2: "จากนั้น:"

 #COMMON BRANCHES
 PRC_expedite_land_revolution: "เรงการปฏิวัติที่ดิน"
 PRC_expedite_land_revolution_desc: "การกระจายที่ดินจากเจาที่ดินสูชาวนาไดทลายโครงสรางศักดินาในชนบท มวลชนชนบทบัดนี้ยืนหยัดหนักแนนเบื้องหลังการปฏิวัติ"
 PRC_halt_land_revolution: "ระงับการปฏิวัติที่ดิน"
 PRC_halt_land_revolution_desc: "เพื่อรักษาเสถียรภาพ โครงการที่ดินแบบปฏิวัติถูกเลื่อนออกไป แมชาวนาจะบนพึมพํา แตชนชั้นนําทองถิ่นก็พอใจ และความเปนปกแผนภายในระยะสั้นก็ถูกรักษาไว"
 PRC_reestablish_the_state_bank: "ฟนฟูธนาคารแหงรัฐ"
 PRC_reestablish_the_state_bank_desc: "เพื่อบริหารเศรษฐกิจอยางเหมาะสม เราจําเปนตองฟนฟูธนาคารกลางของเรา ธนาคารแหงชาติ$PRC_communism$กอตั้งขึ้นในจีนตอนกลาง แตการเดินทัพทางไกลบังคับใหตองหยุดดําเนินการ อุปกรณของธนาคารอยูระหวางขนยายนับแตนั้น และบัดนี้เริ่มมาถึง[ROOT.capital.GetCapitalVictoryPoint.GetName]แลว"
 PRC_promote_the_silver_dollar: "สงเสริมเหรียญเงิน"
 PRC_promote_the_silver_dollar_desc: "การนําเหรียญทองแดงออกจากการหมุนเวียนแลวหันมาใชเหรียญเงินแทน จะทําใหเรานําโลหะเกากลับมาใชผลิตอาวุธยุทธภัณฑได มูลคาในตัวของเหรียญยังหมายความวาคูคาของเราไมตองกังวลเรื่องคาเงินที่ขึ้นลง เพราะผูกไวกับมูลคาของโลหะเงิน"
 PRC_promote_paper_bills: "สงเสริมธนบัตรกระดาษ"
 PRC_promote_paper_bills_desc: "เงินกระดาษที่มีตนทุนการผลิตตํ่าจะเปนสิ่งทดแทนที่ดีสําหรับเหรียญทองแดง ซึ่งสามารถนําไปหลอมใชในโรงงานผลิตอาวุธยุทธภัณฑได แตขอเสียสําคัญคือคูคาของเราอาจกังวลกับสกุลเงินที่เราสามารถเปลี่ยนมูลคาไดงาย ๆ เพียงแคพิมพเพิ่ม"
 PRC_new_currency_established: "การเลือกแผนยุทธศาสตรนี้จะปองกันผลเสียจาก §Y$PRC_equipment_from_copper_coins$§! หากยังไมเกิดขึ้น"
 PRC_allow_special_goods_trade: "อนุญาตการคาสินคาพิเศษ"
 PRC_allow_special_goods_trade_desc: "การคาสินคาพิเศษเปนสิ่งที่รัฐบาลควรยอมรับและใชประโยชน โดยควบคุมบางสวนผานการเก็บภาษี"
 PRC_ban_special_goods_trade: "หามการคาสินคาพิเศษ"
 PRC_ban_special_goods_trade_desc: "แมสินคาพิเศษจะเปนที่นิยม แตการเสพติดเปนปญหารายแรงที่เราควรจัดการดวยการหาม แมการปฏิรูปเชนนี้จะไมเปนที่นิยมในชวงแรก แตก็สําคัญยิ่งเพื่อไมใหสินคาพิเศษกลายเปนอุปสรรคตอการปฏิวัติ อยางที่สุราเคยเปนใน[SOV.GetNameDef]"
 PRC_ban_special_goods_trade_tt: "§Yจิตวิญญาณแหงชาติ§! ที่ยกระดับแลวซึ่งจะมีผลหลังจากหนึ่งปคือ:"
 PRC_agricultural_reform: "ปฏิรูปเกษตรกรรม"
 PRC_agricultural_reform_desc: "เมื่อเรามั่นใจแลววาสามารถควบคุมทรัพยากรทางเศรษฐกิจได เราควรดําเนินการปฏิรูปเกษตรกรรมตอไปดวยการมอบที่ดินจากเจาที่ดินใหแกชาวนาที่ยากจนกวา"
 PRC_agricultural_reform_tt: "เปลี่ยน §Y$PRC_agrarian_society$§! เปน §Y$PRC_agrarian_reform$§! ซึ่งให:"
 PRC_eight_points_for_attention: "กฎแปดขอที่ตองใสใจ"
 PRC_eight_points_for_attention_desc: "$PRC_eight_points_for_attention$ ที่ $PRC_mao_zedong$ ตราขึ้น ระบุความสําคัญของ: การพูดจาสุภาพ การซื้อขายอยางซื่อตรง การคืนสิ่งของที่ยืมมาทุกชิ้น การชดใชคาเสียหายทุกอยางที่ทําเสียหาย การไมทํารายหรือดาทอผูอื่น การไมทําลายพืชผล การไมลวงเกินสตรี และการไมทารุณเชลย"
 PRC_CSCEC_mils: "ให CSCEC เชี่ยวชาญ - อุตสาหกรรมทหาร"
 PRC_CSCEC_mils_desc: "เราจะเรงให CSCEC เชี่ยวชาญดานการกอสรางทางทหาร และใชทุกวิถีทางเพื่อบรรลุเปาหมายนั้น เราจําเปนตองยกระดับการผลิตทางทหารเพื่อใหมีโอกาสสูในปตอ ๆ ไป"
 PRC_CSCEC_civs: "ให CSCEC เชี่ยวชาญ - อุตสาหกรรมพลเรือน"
 PRC_CSCEC_civs_desc: "เราจะเรงให CSCEC เชี่ยวชาญดานการกอสรางอุตสาหกรรม เพราะนั่นคือจุดแข็งของ CSCEC อยูแลว"
 PRC_industrialization_efforts: "เริ่มความพยายามสรางอุตสาหกรรม"
 PRC_industrialization_efforts_desc: "ผลผลิตทางการเกษตรที่เพิ่มขึ้นลาสุดทําใหประชาชนบางสวนไปทํางานในอุตสาหกรรมอื่นได เราควรใหความสําคัญกับการยายแรงงานไปสูอุตสาหกรรมที่ชวยใหเติบโตตอไป เชน การผลิตวัสดุกอสรางหรือเครื่องมือการเกษตร"
 PRC_construct_the_banqiao_dam: "สรางเขื่อนปานเฉียว"
 PRC_construct_the_banqiao_dam_desc: "เขื่อนบนแมนํ้าหรูใน[602.GetName]จะผลิตไฟฟาใหภูมิภาคได และยังชวยปองกันนํ้าทวมซึ่งรุนแรงเปนพิเศษในชวงหลายทศวรรษที่ผานมา"
 PRC_resource_extraction_focus: "การสกัดทรัพยากร"
 PRC_resource_extraction_focus_desc: "เราจําเปนตองใชทรัพยากรธรรมชาติในดินแดนของเราอยางครอบคลุมมากขึ้น เพื่อเพิ่มการเติบโตทางอุตสาหกรรม"
 PRC_connecting_the_country: "เชื่อมโยงประเทศ"
 PRC_connecting_the_country_desc: "การขยายตัวของอุตสาหกรรม และความตองการที่เพิ่มขึ้นในการกระจายสินคาที่เคยผลิตในชุมชนพึ่งพาตนเองแตดําเนินงานอยางไมมีประสิทธิภาพ ทําใหโครงสรางพื้นฐานมีความสําคัญยิ่งกวาที่เคย"
 PRC_establish_shorter_market_plans: "วางแผนตลาดระยะสั้น"
 PRC_establish_shorter_market_plans_desc: "แผนระยะยาวอันเด็ดขาดสําหรับเศรษฐกิจอาจสัญญาผลตอบแทนมหาศาล แตก็มีตนทุนสูงและความเสี่ยงดวย เราควรมุงใหอุตสาหกรรมที่มีอยูแลวมีปจจัยพรอมทํางานไดอยางเต็มประสิทธิภาพแทน"
 PRC_initialize_five_year_plan: "เริ่มแผนหาปฉบับแรก"
 PRC_initialize_five_year_plan_desc: "เปาหมายของแผนหาปฉบับแรกคือการยกระดับการผลิตของอุตสาหกรรมที่มีอยูแลว กอนจะใชผลผลิตสวนเกินสรางอุตสาหกรรมในภาคสวนใหมทั้งหมด"
 PRC_urbanization: "สงเสริมการขยายตัวของเมือง"
 PRC_urbanization_desc: "เพื่อสงเสริมการพัฒนาอุตสาหกรรมหนัก เราตองจูงใจชาวนาที่เคยพึ่งพาตนเองใหมาทํางานในอุตสาหกรรม ขณะที่รัฐดูแลใหชาวนาคนอื่น ๆ ผลิตไดเพียงพอสําหรับกระจายทั้งในเมืองและชนบท"
 PRC_rural_region_development: "พัฒนาภูมิภาคชนบท"
 PRC_rural_region_development_desc: "เพื่อยกระดับคุณภาพชีวิตใน[ROOT.GetNameDef] ตองเพิ่มการผลิตอาหารดวยการลงทุนปรับปรุงฟารมในพื้นที่ชนบทใหทันสมัย"
 PRC_finalize_industrial_plan: "สรุปแผนอุตสาหกรรม"
 PRC_finalize_industrial_plan_desc: "เมื่อแผนปฏิรูปเสร็จสมบูรณแลว เราสามารถสรุปแผนอุตสาหกรรมใหเสร็จสิ้นได ดวยการทําใหศูนยวิจัยและโรงงานผลิตแหงใหมรวมมือกันใหมากที่สุด"
 PRC_great_production_movement: "ขบวนการผลิตครั้งใหญ"
 PRC_great_production_movement_desc: "การขาดแคลนอาหารใน[ROOT.GetNameDef] ซึ่งรุนแรงขึ้นจากภัยธรรมชาติหลายครั้ง ทําใหเราสงเสริมการเปลี่ยนแปลงในชุมชนที่เคยพึ่งพาอาหารจากรัฐบาล พวกเขาออกไปบุกเบิกที่ดินที่เคยไมไดใชประโยชนเพื่อตั้งฟารม และบัดนี้ทหารของเราควรรวมแรงดวยการแบงปนประสบการณดานวิศวกรรมแกสหาย"
 PRC_equipment_from_copper_coins: "ยุทโธปกรณจากเหรียญทองแดง"
 PRC_equipment_from_copper_coins_desc: "เนื่องจากเราไมมีอุตสาหกรรมเหมืองแรขนาดใหญ เหรียญทองแดงจึงสามารถนํามาหลอมเพื่อทํากระสุนหรือยุทธภัณฑอื่น ๆ ได"
 PRC_rally_the_industry: "รวบรวมอุตสาหกรรม"
 PRC_rally_the_industry_desc: "การยายถิ่นทําใหอุตสาหกรรมของเราขาดระเบียบ เราควรสํารวจวาจะทําอะไรไดบางจากเครื่องมือการผลิตที่นํามาระหวางการเดินทัพทางไกล และพยายามนําทรัพยากรที่ถูกลืมจากฐานที่มั่นเดิมกลับมาใชใหม"
 PRC_red_army_reborn: "กองทัพแดงคืนชีพ"
 PRC_red_army_reborn_desc: "ฐานที่มั่นใหมของเราใน[622.GetName]ตองมั่นคง ความสูญเสียบางสวนสามารถชดเชยไดดวยการรับอาสาสมัครในทองถิ่น และเราตองวางแผนปกปองบานใหมของเรา"
 PRC_asymmetric_warfare: "สงครามอสมมาตร"
 PRC_asymmetric_warfare_desc: "หลายศตวรรษที่ผานมา กองทัพที่มีจํานวนนอยกวาพยายามเอาชนะสถานการณที่เปนไปไมได และเราก็ควรทําเชนกัน ดวยการใชขอไดเปรียบที่ศัตรูไมมี ความรูเรื่องภูมิประเทศที่ดีกวา สายสัมพันธกับพลเรือนทองถิ่น และยุทธวิธีกองโจร ลวนนํามาใชเพื่อชิงความไดเปรียบได"
 PRC_conventional_warfare: "สงครามตามแบบ"
 PRC_conventional_warfare_desc: "แมการทําสงครามบั่นทอนกําลังที่ยืดเยื้อจะมีขอไดเปรียบ แตก็มีขอเสียเชนกัน การจํากัดตัวเองอยูแคการโจมตีฉวยโอกาส ทําใหเราเปราะบางตอการโจมตีโรงงานผลิตของเรา การปลุกขวัญกําลังใจดวยชัยชนะเล็ก ๆ หลายครั้งทําไดยากกวา และการหลีกเลี่ยงการรบใหญอาจทําใหความขัดแยงที่อาจยุติไดเร็วกวานี้ยืดเยื้อออกไป"
 PRC_indirect_fire: "การยิงเล็งจําลอง"
 PRC_indirect_fire_desc: "เราจะมุงสรางกองกําลังปนใหญที่ดีขึ้น โดยเนนการยิงเล็งจําลองใสศัตรู"
 PRC_three_rules_of_discipline: "ปลูกฝงวินัยสามประการ"
 PRC_three_rules_of_discipline_desc: "ดังที่เหมาวางหลักไวในทศวรรษ 1920 เปนสวนหนึ่งของยุทธศาสตรทางทหาร หากเราตองการไดรับการสนับสนุนจากประชาชนมากขึ้น ทหารของเราตองไมใชอํานาจขโมยทรัพยสิน และหากเราตองการใชประโยชนจากทรัพยากรอันจํากัดอยางเต็มที่ สิ่งของที่ยึดไดจากศัตรูก็ตองสงมอบใหกองบัญชาการระดับสูงเพื่อแจกจาย"
 PRC_request_for_aid: "คําขอความชวยเหลือ"
 PRC_request_for_aid_desc: "[SOV.GetNameDefCap]สนับสนุนความพยายามของเรามาตั้งแตเรากอตั้ง แตก็หลีกเลี่ยงการเขามาเกี่ยวของโดยตรง อยางไรก็ตาม สถานการณโลกปจจุบันตองการมากกวาการสนับสนุนพอเปนพิธี จึงตองสงคณะผูแทนไปขอยุทโธปกรณ[SOV.GetAdjective]เพื่อชวยเสริมสรางกองทัพของเรา"
 PRC_long_march_to_recovery: "การเดินทัพทางไกลสูการฟนตัว"
 PRC_long_march_to_recovery_desc: "การเดินทัพทางไกลสู [622.GetName] สรางความสูญเสียมหาศาลแกกองทัพของเรา ถึงเวลาแลวที่เราจะจัดระเบียบทหารที่เหลืออยูใหม และวางแนวทางฟนฟูความรุงโรจนของกองทัพแดงกรรมกรและชาวนา"
 PRC_best_of_the_best: "ยอดฝมือในหมูยอดฝมือ"
 PRC_best_of_the_best_desc: "กองทัพของเราจะมุงปลูกฝงคุณภาพและความเปนมืออาชีพในระดับสูงสุด เราตองรับเฉพาะทหารใหมที่แสดงความทุมเทตออุดมการณอยางลึกซึ้งที่สุด และมีทักษะที่คูควรกันเทานั้น"
 PRC_master_the_terrain: "เจาแหงภูมิประเทศ"
 PRC_master_the_terrain_desc: "การฝกรบในภูเขาและการจัดทําแผนที่ภูมิประเทศที่ดีจะชวยใหเราโอบปกขาศึกได และถอนตัวไดอยางปลอดภัยหลังโจมตี"
 PRC_to_steal_an_army: "ขโมยกองทัพ"
 PRC_to_steal_an_army_desc: "เนื่องจากอุตสาหกรรมอันจํากัดของเราไมอาจตอบสนองความตองการของกองทัพได การใชยุทโธปกรณที่ยึดมาไดเมื่อมีโอกาสจึงสําคัญยิ่ง แมอาจกอใหเกิดความทาทายดานการสงกําลังบํารุง แตดวยการเตรียมการที่เหมาะสมและมาตรการอยางการรับประกันการจัดหาอะไหล ปญหาเหลานี้ก็สามารถเอาชนะได"
 PRC_role_of_kangda: "บทบาทของคั่งตา"
 PRC_role_of_kangda_desc: "โรงเรียนทหารหลักของเรา คือโรงเรียนกองทัพแดง [622.GetName] หรือที่รูจักกันในชื่อคั่งตา เคยมุงเนนดานการฝก บัดนี้จะกลายเปนศูนยกลางนวัตกรรมดวยงบประมาณที่เพิ่มขึ้น โดยมุงพัฒนาหลักนิยมและยุทโธปกรณ ทั้งในประเทศและจากตางประเทศ"
 PRC_develop_the_army: "พัฒนากองทัพ"
 PRC_develop_the_army_desc: "เมื่อกองทัพที่เราสรางขึ้นมาทํางานไดเต็มศักยภาพแลว ก็ถึงเวลาที่เราจะมอบเครื่องมือใหกองทัพกาวสูความทันสมัย"
 PRC_to_serve_the_people: "รับใชประชาชน"
 PRC_to_serve_the_people_desc: "เราควรทําใหทหารรูสึกวาเรามุงตอสูเพื่อสิ่งที่เปนประโยชนของประชาชน ทหารตองยังคงเทิดทูนหนาที่ตอชาติ และผูที่ไมไดอยูในกองทัพก็ควรเปนเชนนั้นดวย"
 PRC_prepare_for_596: "เตรียมการสู 596"
 PRC_prepare_for_596_desc: "ภัยคุกคามจากอาวุธนิวเคลียรไมอาจรับมือไดหากเราไมมีอาวุธเชนนั้นเอง รัฐบาลจึงควรสรรหาและสนับสนุนนักวิทยาศาสตรในสาขาที่เกี่ยวของ เพื่อใหพวกเขาเตรียมโครงการนิวเคลียรได"
  GER_unlock_national_nuclear_corporation_tt: "ปลดล็อกบริษัทอุตสาหกรรม §Y$PRC_china_national_nuclear_corporation$§!"
 PRC_increase_domestic_production_capacity: "เพิ่มการผลิตทางทหารในประเทศ"
 PRC_increase_domestic_production_capacity_desc: "แมเราจะขยายอิทธิพลไดดวยทรัพยากรอันจํากัด แตถึงเวลาแลวที่จะลงทุนในอุตสาหกรรมทหาร หากเราตองเผชิญสงครามยืดเยื้ออีกครั้ง ยุทโธปกรณที่สะสมไวจะหมดลงหรือตองซอมแซมในที่สุด และการไมมีของทดแทนจะเปนหายนะ"
 PRC_army_tank_research: "เตรียมการผลิตรถถังในประเทศ"
 PRC_army_tank_research_desc: "เมื่ออุตสาหกรรมที่เพิ่งตั้งไขของเราสามารถผลิตอาวุธหนักไดแลว ก็ถึงเวลาตามใหทันมหาอํานาจทางทหารอื่น ๆ และพัฒนาโรงงานผลิตรถถัง สิ่งนี้จะทําใหเราไดเปรียบอยางมากเหนือประเทศเพื่อนบานที่ไมมีอาวุธเหลานี้ และเสริมสถานะของเราตอผูที่มีกองกําลังยานเกราะของตนเอง"
 PRC_army_doctrines: "นําหลักนิยมสูการปฏิบัติ"
 PRC_army_doctrines_desc: "หลักนิยมที่เราพัฒนาอยางยากลําบากตลอดความขัดแยงตาง ๆ ที่ผานมา ตองไดรับการปรับใหเขากับการจัดหนวยและอาวุธใหมของเรา หากไมบูรณาการ ขอไดเปรียบของมันจะลดลง"
 PRC_army_doctrines_tt: "ไดรับโบนัสตาม§Yหลักนิยมใหญ§!ที่คุณเลือก:"
 PRC_army_doctrines_mobile_warfare_tt: "หากมี §Y$GRAND_DOCTRINE_MOBILE_WARFARE$§!:"
 PRC_army_doctrines_superior_firepower__tt: "หากมี §Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§!:"
 PRC_army_doctrines_grand_battleplan_tt: "หากมี §Y$GRAND_DOCTRINE_GRAND_BATTLEPLAN$§!:"
 PRC_army_doctrines_mass_assault_tt: "หากมี §Y$GRAND_DOCTRINE_MASS_ASSAULT$§!:"
 PRC_appeal_for_foreign_aid: "รองขอความชวยเหลือจากตางชาติ"
 PRC_appeal_for_foreign_aid_desc: "การขอยานเกราะจาก [SOV.GetNameDef] จะทําใหเราสรางเหลายานเกราะในกองทัพได และยังศึกษาแบบของพวกเขาเพื่อพัฒนาของเราเองไดดวย"
 PRC_establish_pla_air_force: "กองทัพอากาศปลดแอกประชาชน"
 PRC_establish_pla_air_force_desc: "เมื่อเราขยายออกจากปอมปราการบนภูเขาและยึดที่ราบลุมไดมากขึ้น เราก็เสี่ยงตอการโจมตีทางอากาศมากขึ้น โชคดีที่การขยายตัวของเราไดทําใหเรามีกําลังอุตสาหกรรมพอที่จะรับมือเรื่องนี้ และเราจะแกจุดออนนี้ทันทีดวยการจัดตั้งกองทัพอากาศของเราเอง"
 PRC_appoint_chang_qiankun: "แตงตั้งฉางเฉียนคุน"
 PRC_appoint_chang_qiankun_desc: "หลังจากศึกษาที่สถาบันกองทัพอากาศจูคอฟสกีในสหภาพโซเวียต ฉางเฉียนคุนคือผูที่เหมาะสมที่สุดที่จะกํากับดูแลกองทัพอากาศของเรา"
 PRC_the_northeast_aviation_university_sea: "มหาวิทยาลัยการบินภาคตะวันออกเฉียงเหนือ"
 PRC_the_northeast_aviation_university_sea_desc: "การจัดตั้งศูนยฝกขนาดใหญสําหรับกองทัพอากาศจะเปนกาวสําคัญ เราจะไมตองพึ่งโรงเรียนในตางประเทศเพื่อสอนนายทหารเรื่องหลักนิยม การใชงานยุทโธปกรณ หรือการถายทอดทักษะเหลานี้สูนักบินผูกลาหาญของเราอีกตอไป"
 PRC_form_the_5th_research_institute: "จัดตั้งสถาบันวิจัยที่ 5"
 PRC_form_the_5th_research_institute_desc: "ขาวจากความขัดแยงครั้งลาสุดไดจุดประกายแผนการสรางสถาบันวิจัยที่มุงเนนเครื่องยนตไอพนและจรวด สถาบันนี้สามารถใชพัฒนาแบบอากาศยานของเรา และตอมาผลิตขีปนาวุธและจรวดได"
 PRC_aviation_infrastructure: "ลงทุนในโครงสรางพื้นฐานการบิน"
 PRC_aviation_infrastructure_desc: "ดวยขนาดของ [ROOT.GetNonIdeologyName] การมีเครื่องบินจํานวนมากยังไมเพียงพอตอการปองกันนานฟา สนามบินในตําแหนงที่เหมาะสม รวมถึงการติดตามความเคลื่อนไหวในนานฟาของเรา จะเปนสิ่งสําคัญยิ่ง"
 PRC_anti_air_effort: "ความพยายามตอสูอากาศยาน"
 PRC_anti_air_effort_desc: "นานฟาอันกวางใหญของเราทําใหยากที่จะจัดหาเครื่องบินและโครงสรางพื้นฐานใหครอบคลุมทั้งหมด แตเราสามารถติดตั้งปนตอสูอากาศยานเพื่อปองกันการโจมตีทางอากาศแทน ซึ่งเปนทางออกที่คุมคาอยางยิ่ง"
 PRC_establish_domestic_aircraft_production: "จัดตั้งการผลิตอากาศยานในประเทศ"
 PRC_establish_domestic_aircraft_production_desc: "การผลิตอากาศยานในประเทศจะลดการพึ่งพาผูจัดหาตางชาติ และทําใหเราปรับแบบใหเขากับความตองการของชาติได"
 PRC_light_plane_focus: "พัฒนาอากาศยานเบา"
 PRC_light_plane_focus_desc: "การปรับปรุงเครื่องบินเบาของเราจะทําใหเราไดเปรียบในการรบทางอากาศ"
 PRC_medium_plane_focus: "พัฒนาเครื่องบินขนาดกลาง"
 PRC_medium_plane_focus_desc: "เพื่อเพิ่มขีดความสามารถในการโจมตีเปาหมายทางยุทธวิธี เราควรมุงเนนแบบเครื่องบินขนาดกลาง"
 PRC_large_plane_focus: "พัฒนาเครื่องบินขนาดใหญ"
 PRC_large_plane_focus_desc: "ดวยการมุงเนนเครื่องบินขนาดใหญ เราจะไดแบบที่บรรทุกนํ้าหนักไดมาก และมีเชื้อเพลิงพอจะบินไดไกลมาก"
 PRC_establish_pla_navy: "กองทัพเรือปลดแอกประชาชน"
 PRC_establish_pla_navy_desc: "เนื่องจากกอนหนานี้เราไมมีทางออกสูชายฝง เราจึงเผชิญภารกิจยากในการไลตามกําลังนาวีของขาศึกใหทัน กองทัพเรือไมเพียงชวยปกปองชายฝงและเสนทางการคาใหมของเรา แตยังแผขยายอิทธิพลของเราไปทั่วทองทะเลดวย"
 PRC_dockyard_construction_efforts: "ลงทุนในการสรางอูตอเรือ"
 PRC_dockyard_construction_efforts_desc: "ในการจัดตั้งกองทัพเรือ เราจําเปนตองลงทุนในหลายอุตสาหกรรมเพื่อผลิตเรือ ขณะที่โรงงานอื่น ๆ เชนโรงงานผลิตปนใหญ ก็ควรรวมมือกับภาคสวนใหมนี้ดวย"
 PRC_naval_mio: "ยกระดับอุตสาหกรรมนาวี"
 PRC_naval_mio_desc: "เมื่อพิจารณาวากอนหนานี้เราขาดอุตสาหกรรมดานนาวี รัฐบาลควรทําใหองคกรผลิตเรือที่เพิ่งจัดตั้งขึ้นใหมดําเนินงานอยางมีประสิทธิภาพ"
 PRC_the_pla_naval_school: "โรงเรียนนายเรือกองทัพปลดแอกประชาชน"
 PRC_the_pla_naval_school_desc: "ศูนยการศึกษาแหงใหมที่ฝกนายทหารและกะลาสีใหมจะเปนศูนยกลางในการสอนทักษะมากมายที่จําเปนบนเรือขนาดใหญ โดยมีหลักสูตรตั้งแตการเดินเรือไปจนถึงการออกแบบและซอมบํารุงอากาศยาน"
 PRC_reappoint_jinguang_as_admiral: "แตงตั้งจิ่นกวงเปนพลเรือเอกอีกครั้ง"
 PRC_reappoint_jinguang_as_admiral_desc: "เนื่องจากกองทัพของเราขาดประสบการณการรบทางทะเล ผูที่เหมาะสมที่สุดที่จะนํากองทัพเรือใหมของเราอาจเปนผูบัญชาการกําลังภาคพื้นดินที่มีประสบการณ"
 PRC_reappoint_jinguang_as_admiral_tt: "§Rปลด [PRC_ziao_jingguang.GetName] ออกจากตําแหนงนายพล§!"
 PRC_naval_infrastructure_effort: "พัฒนาโครงสรางพื้นฐานทางนาวี"
 PRC_naval_infrastructure_effort_desc: "ในการปฏิบัติการตลอดแนวชายฝงอันยาวไกลของ [ROOT.GetNonIdeologyName] เราตองจัดหาโครงสรางพื้นฐานใหกองทัพเรือ เพื่อใหเติมเชื้อเพลิงหรือซอมเรือไดอยางรวดเร็วไมวาจะอยูที่ใด"
 PRC_a_modern_army: "กองทัพบกสมัยใหม"
 PRC_a_modern_army_desc: "เมื่อเราไดปรับปรุงยุทโธปกรณ หลักนิยม การฝก และอื่น ๆ แลว ในที่สุดเราก็มั่นใจไดวาเราเตรียมพรอมดีที่สุดเทาที่จะทําได ไมวาจะเผชิญขาศึกใด"
 PRC_air_force_capstone: "กองทัพอากาศสมัยใหม"
 PRC_air_force_capstone_desc: "การลงทุนในการวิจัยยุทโธปกรณของกองทัพอากาศนาจะทําใหเราผลิตอากาศยานที่เหนือกวาของขาศึกได และยังชวยใหบูรณาการความกาวหนาใหม ๆ อยางเครื่องยนตไอพนไดอยางราบรื่น"
 PRC_naval_capstone: "กองทัพเรือสมัยใหม"
 PRC_naval_capstone_desc: "เมื่อกองทัพเรือไดรับการจัดระเบียบใหมโดย [PRC_ziao_jingguang.GetName] และไดรับทรัพยากรที่จําเปนตอการใชอํานาจการยิงทางนาวีทุกรูปแบบแลว เราจะแผขยายอิทธิพลไปทั่วแปซิฟกได"
 PRC_peoples_liberation_army_sea: "กองกําลังภาคพื้นดินกองทัพปลดแอกประชาชน"
 PRC_peoples_liberation_army_sea_desc: "กองทัพแดงกรรมกรและชาวนาของเรามีทหารที่มีประสบการณมากขึ้นเรื่อย ๆ และถึงเวลาแลวที่เราจะยอมรับการเปลี่ยนแปลงลักษณะนี้อยางเต็มที่ ในการเปลี่ยนจากกองกําลังอาสาสมัครเปนกองทัพทหารอาชีพที่ไดรับการฝกและติดอาวุธอยางดี ถึงเวลาจัดตั้งกองกําลังภาคพื้นดินของกองทัพปลดแอกประชาชนแลว"
 PRC_central_military_commision: "คณะกรรมาธิการการทหารสวนกลาง"
 PRC_central_military_commision_desc: "เมื่อเหลาทัพตาง ๆ ไดรับการจัดระเบียบใหมและทันสมัยแลว เราสามารถจัดตั้งองคกรเพื่อประสานงานเหลาทัพเหลานี้ได ซึ่งจะทําใหเรากํากับดูแลกองทัพไดดีขึ้น และเพิ่มขีดความสามารถในการปฏิบัติการรวม"
 PRC_prepare_for_third_phase: "เตรียมพรอมสูระยะที่สาม"
 PRC_prepare_for_third_phase_desc: "เหมาประกาศวาสงครามกองโจรมีสามระยะ หลังจากผานสองระยะแรกที่มุงสรางแรงสนับสนุนและบั่นทอนขาศึกแลว ถึงเวลาหันมาใชวิธีการรบตามแบบ เราจะขยายดินแดนตอไปดวยการโจมตีเมืองตาง ๆ โดยตรงในระยะที่สามซึ่งเปนระยะสุดทาย"
 PRC_revolutionary_war_of_the_masses: "สงครามปฏิวัติของมวลชน"
 PRC_revolutionary_war_of_the_masses_desc: "เราควรแสดงใหชัดเจนวาพรรคของเราเปนตัวแทนของสามัญชนมากกวารัฐชาตินิยมที่ฉอฉลและถือตนเปนชนชั้นสูง เปาหมายของเราคือตอสูกับกองกําลังเหลานี้และสรางระบบที่ดีกวา"
 PRC_one_with_the_people: "หนึ่งเดียวกับประชาชน"
 PRC_one_with_the_people_desc: "ความมุงมั่นที่จะตอสูเพื่อ [CHI.GetNonIdeologyName] ที่ดีกวาตองไดรับการเนนยํ้าใหมากที่สุด เพื่อรวบรวมอาสาสมัครเขากองทัพใหมากขึ้น"
 PRC_strengthen_the_air_arsenal: "เสริมสรางคลังแสงทางอากาศ"
 PRC_strengthen_the_air_arsenal_desc: "เพื่อพัฒนากองทัพอากาศ เราควรลงทุนปรับปรุงยุทโธปกรณตามประสบการณที่ผานมา การลงทุนครั้งเดียวเพื่อใหแบบของเราเชื่อถือไดมากขึ้นในตอนนี้ อาจชวยประหยัดคาใชจายในการทดแทนในอนาคตดวย"
 PRC_destroyers: "เรือพิฆาตชั้นอันชาน"
 PRC_destroyers_desc: "แมจะลาสมัย แตการไดเรือพิฆาตชั้นกเนฟนืยที่เหลือใชของโซเวียตจะวางรากฐานใหกองทัพเรือของเรา โดยไมตองใชเวลาหลายปในการสรางเรือขนาดใหญ เรายังสามารถยกเครื่องและปรับปรุงเรือเหลานี้ใหทันสมัยหลังจากศึกษาสมรรถนะแลว"
 PRC_submarines: "เรือดํานํ้าชายฝง"
 PRC_submarines_desc: "การใชเรือดํานํ้าในนานนํ้าชายฝงจะเปนวิธีที่คุมคาและอยูรอดไดดีในการปกปองโครงสรางพื้นฐานชายฝง แมเรือดํานํ้าเหลานี้จะไมไดออกแบบมาเพื่อดํานํ้าลึก แตอยางนอยก็เปนกาวหนึ่งสูการพัฒนารุนที่กาวหนากวา"
 PRC_cruisers: "เรือลาดตระเวนนานนํ้าชายฝง"
 PRC_cruisers_desc: "เรือลาดตระเวนที่ติดอาวุธเบาแตอเนกประสงค อยางชั้นคีรอฟ จะชวยใหเราปกปองทะเลใกลบานได เราจะซื้อตัวเรือที่ยังสรางไมเสร็จมาและสรางใหเสร็จ"
 PRC_capital_ships: "กาวแรกสูเรือหลัก"
 PRC_capital_ships_desc: "ขอมูลที่เรามีเกี่ยวกับแบบเรือลาดตระเวนประจัญบานชั้นครอนชตัดทของ[SOV.GetAdjective] เปนพื้นฐานที่ดีในการขยายกองเรือดวยเรือหลัก แบบเรือเหลานี้ทันสมัยจนอุตสาหกรรมของ[SOV.GetAdjective]เองยังประสบปญหา แตสําหรับกองทัพเรือที่กําลังขยายตัวของเรา ความทาทายเหลานี้คุมคากับผลลัพธ"
 PRC_carriers: "แผแสนยานุภาพ"
 PRC_carriers_desc: "การพัฒนาเรือบรรทุกเครื่องบินจะทําใหเราแขงขันกับมหาอํานาจทางทะเลได ความสามารถในการสงกําลังทางอากาศไปทุกที่ที่กองทัพเรือไปถึง ยังชวยเพิ่มความสามารถในการแผอํานาจในความขัดแยงที่หางไกลจากมาตุภูมิดวย"
 PRC_naval_guns: "เพิ่มอํานาจการยิงทางนาวี"
 PRC_naval_guns_desc: "รากฐานที่เราวางไวสําหรับการสรางเรือขนาดใหญ จะทําใหเราใชอาวุธขนาดใหญขึ้นไดดวย อาวุธเหลานี้สามารถคุกคามแมแตเปาหมายที่หุมเกราะหนา และเขาปะทะไดกอนที่เราจะอยูในระยะหวังผลของพวกเขา"
 PRC_naval_ocean_navy: "จากนาวีนานนํ้าชายฝงสูมหาสมุทรสีคราม"
 PRC_naval_ocean_navy_desc: "การปฏิรูปกองทัพเรือนาจะทําใหกองทัพเรือปฏิบัติการไดอยางมีประสิทธิภาพในระยะทางไกลจากฐานสงกําลังบํารุงแลว ซึ่งจะทําใหเราสกัดกั้นกองกําลังขาศึกไดกอนที่พวกเขาจะมาถึงทะเลใกลเคียง"
 PRC_pilot_training: "จัดตั้งโรงเรียนการบิน"
 PRC_pilot_training_desc: "เราไมอาจเสี่ยงสงนักบินผูมีประสบการณเพียงไมกี่คนเขาสูการรบได แตควรใหพวกเขาเปนครูฝกนักบินใหมในขณะที่กองทัพอากาศขยายตัว"
 PRC_night_attack: "ใชประโยชนจากความมืด"
 PRC_night_attack_desc: "การฝกกองทัพใหโจมตีในเวลากลางคืนจะยิ่งใชประโยชนจากประสบการณในการสงครามอสมมาตรของเรา"
 PRC_reorganize_divisions: "จัดระเบียบกองพลใหม"
 PRC_reorganize_divisions_desc: "เพื่อใหกองทัพทันสมัยยิ่งขึ้น เราควรจัดกองกําลังอาสาสมัครที่เหลืออยูใหเปนกองพล และทําใหกองพลที่มีอยูมีความแข็งแกรงเสมอกัน ซึ่งจะทําใหเราสรางสายการบังคับบัญชาที่ชัดเจน และประสานงานทหารไดงายขึ้น"
 PRC_rural_region_development_two: "ขยายการพัฒนาชนบท"
 PRC_rural_region_development_two_desc: "การปรับปรุงฟารมใหทันสมัยตองไดรับการสนับสนุนเพิ่มเติมดวยการลงทุนในโครงสรางพื้นฐานของพื้นที่ชนบท เชน โรงเรียนและถนน ซึ่งจะชวยเพิ่มผลิตภาพในชนบท"
 PRC_urbanization_two: "ขยายความพยายามดานการพัฒนาเมือง"
 PRC_urbanization_two_desc: "การขยายตัวของเมืองหมายความวาเราสามารถรองรับโครงการกอสรางขนาดใหญขึ้นเพื่อสรางที่อยูอาศัยและงานไดแลว เราจะอนุญาตใหผูคนยายเขาเมืองมากขึ้น และจัดหางานใหระหวางการกอสราง"
 PRC_make_agrarian_to_urban_tt: "เปลี่ยน §Y$PRC_agrarian_reform$§! เปน §Y$PRC_urban_society$§! ซึ่งให:"
 PRC_found_the_academy_of_science: "กอตั้งสถาบันวิทยาศาสตร"
 PRC_reinforce_base_area: "เสริมกําลังฐานที่มั่นใหม"
 PRC_reinforce_base_area_desc: "เพื่อหลีกเลี่ยงการรณรงคอีกครั้งของกองกําลังชาตินิยมตอฐานที่มั่นของเรา เราควรพิจารณาทุกทางเลือกที่เปนไปไดเพื่อปกปองฐานเหลานั้น"
 PRC_rebuild_28_bolshevik: "ฟนฟูกลุม 28 ½ บอลเชวิค"
 PRC_rebuild_28_bolshevik_desc: "แรงสนับสนุนที่ผูนําชุดใหมของเราไดรับแสดงใหเห็นชัดวาประชาชนไววางใจ ความชอบธรรมนี้จะชวยใหเรารวบรวมผูสนับสนุนไดงายขึ้นทั้งในตางแดนและในประเทศ"
 PRC_bolshevik_world_revolution: "เผยแพรการปฏิวัติโลก"
 PRC_bolshevik_world_revolution_desc: "ความสําเร็จของการปฏิวัติของเราไมควรถูกจํากัดอยูแคในพรมแดน เราตองชวยเหลือชนชั้นกรรมาชีพในชาติอื่นดวย"
 PRC_bolshevik_urbanization: "การปฏิวัติจากเมือง"
 PRC_bolshevik_urbanization_desc: "แมฐานอํานาจของเราในตอนนี้สวนใหญจะเปนชาวนาในชนบทที่แสวงหาชีวิตที่ดีขึ้น แตเราตองขยายสารของเราไปสูผูคนในเมืองดวย เพราะพวกเขาก็เผชิญความไมเทาเทียมเชนกัน"
 PRC_embrace_stalinism: "นอมรับลัทธิสตาลิน"
 PRC_embrace_stalinism_desc: "เมื่อการนําของเรามั่นคงแลว เราก็สามารถเริ่มนําอุดมการณสตาลินมาใชอยางเขมขนยิ่งขึ้น การรวมนาเปนนารวมใหมากขึ้นและการพัฒนาอุตสาหกรรมอยางรวดเร็วควรเปนเปาหมายหลักของเรา"
 PRC_embrace_stalinism_tt: "§Y$PRC_bolshevik_dominance$§! จะไดรับตัวปรับคาแตกตางกันไปตามคาปจจุบันของ §Y$PRC_communist_power_struggle$§!\nผลปจจุบัน:"
 PRC_bolshevik_aid: "[GetBolshevikAid]"
 PRC_bolshevik_aid_default: "ความชวยเหลือจากบอลเชวิคโซเวียต"
 PRC_bolshevik_aid_alt: "ตอนรับบอลเชวิคพลัดถิ่น"
 PRC_bolshevik_aid_desc: "บอลเชวิคโซเวียตมีประสบการณในสงครามปฏิวัติ และอาจยินดีสนับสนุนการเงินแกอุดมการณของเราดวย"
 PRC_party_control: "ควบคุมพรรค"
 PRC_party_control_desc: "ความสําเร็จของผูนําของเรานาจะเปดทางใหเราควบคุมพรรคคอมมิวนิสตจีนไดมากยิ่งขึ้น"
 PRC_invite_pavel_mif: "เชิญพาเวล มิฟ"
 PRC_invite_pavel_mif_desc: "พาเวล มิฟ ผูเปนอาจารยของกลุม 28 ½ บอลเชวิคทุกคน ควรไดรับเชิญมาเปนที่ปรึกษาของรัฐบาลเรา การมาของเขาจะกระชับความสัมพันธระหวางเรากับ[SOV.GetNameDef]"
 PRC_invite_otto_braun: "เชิญอ็อทโท เบราน"
 PRC_invite_otto_braun_desc: "$PRC_otto_braun$ เปนหนึ่งในผูบัญชาการทหารคนสําคัญของการรบป 1934 รวมกับ $PRC_bo_gu$ ยอมรับวาการรบครั้งนั้นจบลงดวยความพายแพ และเบรานถูกลดบทบาทระหวางการเดินทัพทางไกล แตผูนําชุดใหมของเราเห็นวานั่นไมใชความผิดของ $PRC_otto_braun$ และตองการคืนตําแหนงใหเขา"
 PRC_invite_soviet_general: "เชิญนายพลโซเวียต"
 PRC_invite_soviet_general_desc: "ประสบการณอันกวางขวางของ $SOV_vasily_chuykov$ และ $SOV_aleksandr_cherepanov$ ทั้งในสงครามกลางเมืองรัสเซียและในฐานะผูชวยทูตทหารประจํา[CHI.GetNameDef] จะทําใหทั้งสองเปนกําลังสําคัญของกองทัพเรา"
 PRC_invite_soviet_general_tt: "§Y$SOV_vasily_chuykov$§! และ §Y$SOV_aleksandr_cherepanov$§! จะกลายเปนนายพล"
 PRC_bolshevik_urbanization_2: "เรงการขยายตัวของเมือง"
 PRC_bolshevik_urbanization_2_desc: "การสรางงานในเมืองเพื่อจูงใจใหประชากรชนบทยายเขามาไมเพียงเปนผลดีตอเศรษฐกิจของเรา แตยังเพิ่มอิทธิพลของเราในเมืองที่ยังตั้งคําถามตอการปฏิวัติอีกดวย"
 PRC_bolshevik_urban_industrialization: "อุตสาหกรรมในเมือง"
 PRC_bolshevik_urban_industrialization_desc: "เราตองลงทุนในเมืองตาง ๆ เพื่อสงเสริมการกอตัวของอุตสาหกรรมหนัก"
 PRC_bolshevik_urbanization_completed: "กรรมกรทั้งหลาย จงสามัคคีกัน!"
 PRC_bolshevik_urbanization_completed_desc: "การลงทุนในเขตเมืองชวยเพิ่มอิทธิพลของเราที่นั่นไดสําเร็จ บัดนี้เราสามารถมุงหนาสูความรวมมือที่แนนแฟนยิ่งขึ้นระหวางองคกรคอมมิวนิสตในชนบทกับในเมือง"
 PRC_join_comintern: "เขารวมโคมินเทิรน"
 PRC_join_comintern_desc: "เมื่อการนําของพรรคคอมมิวนิสตและรัฐถูกรวมศูนยมากขึ้นเรื่อย ๆ เราจึงสามารถยื่นขอเขารวมโคมินเทิรนในฐานะพันธมิตรที่ไวใจได"
 PRC_rebuild_28_bolshevik_tt: "สมาชิก §Y28 ½ บอลเชวิค§! ทุกคน:\nพัฒนาประสิทธิภาพของคุณลักษณะ"
 PRC_rebuild_28_bolshevik_effect_tt: "เสีย §Y$PRC_28_bolshevik_trait$§! และไดรับ §Y$PRC_28_bolshevik_trait_improved$§!\n§Yผลที่เปลี่ยนแปลง:§!\nอํานาจทางการเมืองรายวัน: §G+0.12§!\nเสถียรภาพ: §G+5.00%§!\nความเห็นรายเดือนจากอุดมการณเดียวกัน: §G+5.00%§!" ## Make sure match values in trait file TODO_ML, change to variables
 PRC_agricultural_reform_boom: "เสรีภาพทางการเกษตร"
 PRC_agricultural_reform_boom_desc: "เราตองใหความมั่นคงแกชาวนา เพื่อใหพวกเขามีกําลังใจผลิตพืชผลที่ชาติตองการ"
 PRC_he_long_second_army: "เฮอ หลงและกองทัพที่สอง"
 PRC_he_long_second_army_desc: "กองทัพของเฮอ หลงที่ยังคงสภาพเกือบสมบูรณทําใหเรามีกําลังหลักใหมไวปกปอง[ROOT.capital.GetName] ประสบการณในการหลบหลีกกองกําลังชาตินิยมของเขาก็เปนสิ่งที่เราควรนํามาใช"
 PRC_rural_survey: "สํารวจชนบท"
