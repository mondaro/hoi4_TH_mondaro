 PRC_initialize_five_year_plan_tt: "§Rหากไมสามารถบรรลุเปาหมายอุตสาหกรรมภายในกําหนดเวลาของแผน จะถูกลงโทษดานประสิทธิภาพทางเศรษฐกิจ สะทอนถึงการสูญเสียความเชื่อมั่นในการวางแผนจากสวนกลาง§!\n\n§Yจํานวนโรงงานทั้งหมดที่ตองมีเพื่อบรรลุเปาหมาย:\nโรงงานพลเรือน [GetFiveYearPlanGoalCivFactoriesText] แหง\nโรงงานทหาร [GetFiveYearPlanGoalMilFactoriesText] แหง§!"
 PRC_initialize_shorter_market_plans_tt: "§Rหากไมสามารถบรรลุเปาหมายอุตสาหกรรมภายในกําหนดเวลาของแผน จะถูกลงโทษอยางหนักดานประสิทธิภาพทางเศรษฐกิจ สะทอนถึงการสูญเสียความเชื่อมั่นในการวางแผนจากสวนกลาง§!\n\n§Yจํานวนโรงงานทั้งหมดที่ตองมีเพื่อบรรลุเปาหมาย:\nโรงงานพลเรือน [GetShorterMarketPlansGoalCivFactoriesText] แหง\nโรงงานทหาร [GetShorterMarketPlansGoalMilFactoriesText] แหง§!"

