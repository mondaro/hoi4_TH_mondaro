 JAP_sea_purge_the_kodoha_faction: "กวาดลางกลุมโคโดฮะ"
 JAP_sea_purge_the_kodoha_faction_desc: "กลุมโคโดฮะทิ้งโอกาสในการยึดอํานาจไปเปลา ๆ และพวกเขาจะตองชดใชอยางสาสม สําหรับการทรยศตอองคจักรพรรดิ เราจะปลดพวกเขาออกจากยศและนําตัวขึ้นศาลในขอหากบฏ ในที่สุดก็ถึงเวลาที่กลุมโทเซฮะจะเขาควบคุมกองทัพจักรวรรดิแลว!"
 JAP_sea_purge_the_kodoha_faction_tt: "§Yซาดาโอะ อารากิ§! และ §Yชิเงรุ ฮนโจ§! จะถูกปลดจากราชการประจําการ"

 JAP_east_asian_cooperative_society: "สมาคมความรวมมือเอเชียตะวันออก"
 JAP_east_asian_cooperative_society_desc: "ทฤษฎีสมาคมความรวมมือเอเชียตะวันออกที่เพิ่งไดรับการพัฒนาขึ้น สนับสนุนการสรางสังคมแหงความรวมมือในเอเชียตะวันออกที่กาวขามพรมแดนทางชาติพันธุและชาติ เราควรตอยอดแนวคิดนี้เพื่อเสริมสถานะของเราในฐานะผูพิทักษแปซิฟกและผูนําของประชาชาติเอเชียตะวันออก"
 JAP_east_asian_cooperative_society_tt: "ปลดล็อกการตัดสินใจเพื่อผูกมิตรและลงทุนในทรัพยากรธรรมชาติของ§Yชาติเอเชีย§!"

 JAP_imperial_headquarters_liasion_conference: "การประชุมประสานงานจักรวรรดิ"
 JAP_imperial_headquarters_liasion_conference_desc: "ดวยการรื้อฟนกองบัญชาการใหญจักรวรรดิขึ้นเปนครั้งแรกนับตั้งแตสงครามรัสเซีย-ญี่ปุน ถึงเวลาแลวที่เราจะจัดการประชุมระหวางผูนํากลุมตาง ๆ เพื่อสงเสริมความรวมมือและการแลกเปลี่ยนขอมูลระหวางฝายทหารกับรัฐบาล"

 JAP_promulgate_the_military_ministers_system: "ระบบรัฐมนตรีฝายทหารตองเปนนายทหารประจําการ"
 JAP_promulgate_the_military_ministers_system_desc: "ชวงเวลาสั้น ๆ นับตั้งแตความพยายามกอรัฐประหารของกลุมโคโดฮะ ไมมีความมั่นคงเลยแมแตนอย เมื่อฝายทหารเริ่มไมพอใจรัฐบาลมากขึ้น จําเปนตองทําบางอยางเพื่อเอาใจพวกเขา ดวยเหตุนี้ โคกิ ฮิโรตะ จึงเสนอใหตําแหนงรัฐมนตรีวาการกระทรวงสงครามมอบใหไดเฉพาะนายทหารประจําการเทานั้น ดังที่เคยเปนมาแลวหลายครั้งในประวัติศาสตรของเรา"
 JAP_promulgate_the_military_ministers_system_tt: "การเคลื่อนไหวนี้§Rไมเปนที่นิยม§!ในหมูสมาชิก§Yรัฐบาลพลเรือน§! และยอมกอใหเกิดความขัดแยงระหวางกลุมตาง ๆ ในเวลาตอมา"

 JAP_reprimand_hamada_kunimatsu: "ตําหนิฮามาดะ คูนิมัตสึ"
 JAP_reprimand_hamada_kunimatsu_desc: "ในสุนทรพจนวิจารณฝายทหารในสภาไดเอต ฮามาดะ คูนิมัตสึทําเกินเลยไปมาก เพื่อไมใหฝายทหารเอาชนะรัฐบาลพลเรือนทางการเมืองไดอยางเบ็ดเสร็จ เราจําเปนตองตําหนิเขาอยางเหมาะสม และแสดงใหเห็นวาเรายังมีแรงสูเหลืออยู"

 JAP_the_harakiri_debate: "การโตวาทีฮาราคีรี"
 JAP_the_harakiri_debate_desc: "หลังการแสดงทาทีทาทายอันนาอับอายของฮามาดะ คูนิมัตสึตอฝายทหาร ฮิไซจิ เทราอุจิไดเรียกรองใหคณะรัฐมนตรีลาออกและแตงตั้งนายกรัฐมนตรีคนใหม หากคนเกายังพอมีเกียรติเหลืออยูบาง ดวยการเดินหมากอยางระมัดระวังเพียงเล็กนอย เราสามารถตั้งเซ็นจูโร ฮายาชิขึ้นเปนหุนเชิดของฝายทหารได"

 JAP_konoes_first_cabinet: "คณะรัฐมนตรีโคโนเอะชุดแรก"
 JAP_konoes_first_cabinet_desc: "เซ็นจูโร ฮายาชิ เปนเพียงนายกรัฐมนตรีขัดตาทัพในระยะสั้นเทานั้น เจาชายฟูมิมาโระ โคโนเอะ ผูไมฝกใฝการเมืองและไดรับการอบรมสั่งสอนจากเก็นโร ไซองจิ คินโมจิ คือผูสมัครที่สมบูรณแบบในการสรางเสถียรภาพใหสถานการณการเมืองอันวุนวาย และรวมใจชาติใหเปนหนึ่งเดียว ถึงเวลาแลวที่เขาจะจัดตั้งคณะรัฐมนตรีของตนเอง โดยไซองจิเปนผูเสนอชื่อเขาตอจักรพรรดิฮิโรฮิโตะดวยตนเอง"

 JAP_new_order_in_east_asia: "ระเบียบใหมในเอเชียตะวันออก"
 JAP_new_order_in_east_asia_desc: "จากถอยแถลงลาสุดของ [ROOT.GetLeader] ยิ่งเห็นไดชัดวาเขาตั้งใจจะสถาปนาระเบียบใหมในเอเชียตะวันออก ซึ่งมีเปาหมายหลักหกประการ ไดแก เสถียรภาพถาวรของเอเชียตะวันออก ไมตรีระหวางเพื่อนบานและความยุติธรรมระหวางประเทศ การปองกันรวมกันตอตานคอมมิวนิสต การสรางวัฒนธรรมใหม ความเปนปกแผนและความรวมมือทางเศรษฐกิจ และทายที่สุดคือสันติภาพของโลก"
 JAP_new_order_in_east_asia_faction: "ระเบียบใหมในเอเชียตะวันออก"
 JAP_new_order_in_east_asia_tt: "การดําเนินแผนยุทธศาสตร $JAP_sea_greater_east_asian_co_properity_sphere$ จะเปลี่ยนแปลงฝายนี้"

 JAP_reiterate_the_three_principles_of_hirota: "ยํ้าหลักการสามประการของฮิโรตะ"
 JAP_reiterate_the_three_principles_of_hirota_desc: "ดวยการเดินหมากอยางระมัดระวังของรัฐบาล ฮิโรตะสามารถผลักดันใหคาซูชิเงะ อูงากิ ผูสืบทอดของเขา ขึ้นเปนนายกรัฐมนตรีคนใหมได ถึงเวลาแลวที่จะใหสัตยาบันอยางเปนทางการตอถอยแถลงสามประการของฮิโรตะ ไดแก การจัดตั้งกลุมญี่ปุน–จีน–แมนจูกัว การจัดตั้งแนวรวมจีน-ญี่ปุนตอตานการแพรขยายของคอมมิวนิสต และการปราบปรามกิจกรรมตอตานญี่ปุนในจีน"

 JAP_formalize_japan_china_manchukuo_alliance: "พันธมิตรญี่ปุน - จีน - แมนจูกัว"
 JAP_formalize_japan_china_manchukuo_alliance_desc: "เมื่อรัฐบาลของ [CHI.GetLeader] ยอมรับขอเรียกรองของเราในการปราบปรามกิจกรรมคอมมิวนิสตและตอตานญี่ปุนแลว ดูเหมือนเปนไปไดวาพวกเขาจะยินดีเปนพันธมิตรกับเราชั่วคราว เพื่อจัดการกับแผลเนาที่ฝงลึกอยูในอกของเอเชียตะวันออก นั่นคือระบอบขุนศึกและคอมมิวนิสต ซึ่งคุกคามทั้งเอเชียดวยความตายอันแนนอนและไมอาจหลีกหนี"
 JAP_sino_japanese_pact: "กติกาสัญญาจีน-ญี่ปุนตอตานคอมมิวนิสต"

 JAP_sea_national_spiritual_mobliization_movement: "ขบวนการระดมจิตวิญญาณแหงชาติ"
 JAP_sea_national_spiritual_mobliization_movement_desc: ""ความฟุมเฟอยคือศัตรูของเรา!" เมื่อความมัธยัสถ สุขอนามัย และความขยันหมั่นเพียรไดรับการยกยองเปนคุณธรรมของชาติ กําลังพลก็จะมีมากขึ้นสําหรับความพยายามในสงคราม และพระประสงคของจักรพรรดิแหงสวรรคก็จะถูกถายทอดสูราษฎรของจักรวรรดิทุกคนอยางเหมาะสม"

 JAP_hokushin_ron: "โฮกุชินรง"
 JAP_hokushin_ron_desc: "กลุมในกองทัพของเราที่เรียกตนเองวากลุมรุกขึ้นเหนือ สนับสนุนการขยายอํานาจเขาสูไซบีเรียและมองโกเลีย เพื่อใหไดมาซึ่งทรัพยากรธรรมชาติและคุณคาทางเศรษฐกิจที่เราตองการเพื่อสานตอความทะเยอทะยานของจักรวรรดิ เราควรสนับสนุนแนวคิดนี้ และเริ่มเตรียมกองกําลังใหพรอมดําเนินตามหลักนิยมนี้เมื่อถึงเวลาที่เหมาะสม"
 JAP_strike_north_doctrine: "หลักนิยมรุกขึ้นเหนือ"

 JAP_strenghten_manchukuo_imperial_army: "เสริมกําลังกองทัพจักรวรรดิแมนจู"
 JAP_strenghten_manchukuo_imperial_army_desc: "กองทัพจักรวรรดิแมนจูกัวเปนกองหนาตานทานกองกําลังของ[SOV.GetNameDef] และเปนผูที่จะยึดแนวชายแดนไวหากเกิดสงคราม เราตองชวยขยายกองกําลังเหลานี้ เพื่อหวังวาพวกเขาจะสามารถยืนหยัดตอกรกับยักษใหญ[SOV.GetAdjective]ได"

 JAP_strenghten_manchukuo_imperial_airforce: "เสริมกําลังกองทัพอากาศจักรวรรดิแมนจู"
 JAP_strenghten_manchukuo_imperial_airforce_desc: "กองทัพอากาศจักรวรรดิแมนจูกัวเพิ่งกอตั้งขึ้นไมนาน และนายทหารของพวกเขายังตองเรียนรูอีกมาก เราควรสงนายทหารไปฝกพวกเขา พรอมทั้งสงมอบเครื่องบินขับไล Nakajima Army Type 91 และเครื่องบินทิ้งระเบิดเบา Kawasaki Type 88 เพื่อเสริมกําลังของพวกเขา"

 JAP_ensure_temporary_peace_with_china: "รักษาสันติภาพชั่วคราวกับจีน"
 JAP_ensure_temporary_peace_with_china_desc: "เพื่อมุงความสนใจไปที่[SOV.GetNameDef] เราตองแนใจวาพวก[CHI.GetAdjective]เจาเลหจะไมแทงขางหลังเราขณะที่กองกําลังของเราติดพันการรบอยูที่อื่น เราควรแนใจดวยวากองทัพควันตงจะไมทําการนอกลูนอกทางในระหวางนี้ เพื่อไมใหพวกเขากอสงครามที่เราไมอาจเอาชนะได"
 trautmann_agreement_opm: "ขอตกลงเทราทมันน"

 JAP_a_mongol_volunteer_army: "ปฏิรูปกองทัพเอกราชมองโกเลีย" # Could also be A Mongol Volunteer Army
 JAP_a_mongol_volunteer_army_desc: "กองทัพแมนจูเรียมีกองทัพเอกราชมองโกเลียอยูภายใน ประกอบดวยชาวมองโกลและโจร นําโดยที่ปรึกษาชาว[ROOT.GetAdjective] เราควรจัดตั้งกองทัพลักษณะเดียวกันที่อยูภายใตการควบคุมของเราโดยสมบูรณ โดยมีเปาหมายจะสงพวกเขาไปยัง[MON.GetNameDef]ในที่สุด เพื่อปลดปลอยมาตุภูมิจากกองกําลังศัตรู"
 JAP_a_mongol_volunteer_army_tt: "หาก §Y[MAN.GetName]§! หรือ §Y[MEN.GetName]§! เปนพันธมิตรของเรา พวกเขาจะไดรับจิตวิญญาณนี้ดวย"
 JAP_a_mongol_volunteer_army_1_tt: "ปลดล็อกการตัดสินใจ§Yบอนทําลายเสถียรภาพมองโกเลีย§! โดยมีเปาหมายเพื่อดึงพวกเขามาอยูฝายเราและกอรัฐประหารตอรัฐบาล"

 JAP_utilize_ainu_expertise: "ใชความเชี่ยวชาญของชาวไอนุ"
 JAP_utilize_ainu_expertise_desc: "ชาวไอนุซึ่งเปนชนพื้นเมืองทางเหนือของญี่ปุน เชี่ยวชาญการเดินทางฝาหิมะและภูมิประเทศอันโหดรายของฮกไกโด บางทีเราอาจเรียนรูเทคนิคของพวกเขาเพื่อใหการบุกไซบีเรียรวดเร็วยิ่งขึ้น?"

 JAP_kantokuen: "คันโตกุเอ็น"
 JAP_kantokuen_desc: "เพื่อฉวยประโยชนจากพัฒนาการของโลก กองทัพควันตงไดเตรียมการซอมรบพิเศษ เพื่อเตรียมการบุกและยึดครองตะวันออกไกลของรัสเซีย เพื่อใหการโจมตีเปนไปอยางรวดเร็ว เราควรลงทุนในการเตรียมการขั้นสุดทายเหลานี้กอนลงมือ"

 JAP_a_green_persimmon: "ลูกพลับดิบ"
 JAP_a_green_persimmon_desc: "กองกําลังของเรายังไมพรอมเต็มที่สําหรับสงครามกับ[SOV.GetNameDef] และความสนใจของพวกเขาก็ยังไมไดเบนไปทางตะวันตกมากพอ แมกระนั้น เราตองโจมตีเดี๋ยวนี้ มิฉะนั้นโอกาสอาจหลุดลอยไปตลอดกาล..."

 JAP_the_persimmon_has_ripened: "ลูกพลับสุกแลว"
 JAP_the_persimmon_has_ripened_desc: "ผลแหงชัยชนะกําลังสุกงอมอยางรวดเร็ว และกองทัพของเราพรอมเต็มที่ที่จะเขาแทรกแซงและยึดไซบีเรียจากจักรวรรดิ[SOV.GetAdjective]ที่กําลังลมสลาย สงครามจะรวดเร็ว และชัยชนะของเราจะรุงโรจน เทนโนเฮกะ บันไซ!"
 JAP_peace_out_soviets_dec_tt: "ปลดล็อกการตัดสินใจลงนาม§Yสันติภาพแยก§!กับ §Y[SOV.GetNameDef]§! เพื่อรับ§Yไซบีเรีย§!จากพวกเขาหากเราควบคุมอยู"

 JAG_neutality_pact_focus_days_tt: "จํานวนวันปจจุบัน: [?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_soviet_japanese_neutrality_pact_flag: "ดําเนินแผนยุทธศาสตร §Y$JAP_soviet_japanese_neutrality_pact$§! เสร็จแลว"

 JAP_chinese_japanese_neutrality_pact_flag: "ดําเนินแผนยุทธศาสตร §Y$JAP_ensure_temporary_peace_with_china$§! เสร็จแลว"
 JAG_chinese_neutality_pact_focus_days_tt: "จํานวนวันปจจุบัน: [?JAP_chinese_japanese_neutrality_pact_flag:days|Y0]"

 JAP_hokushin_ron_started_flag: "ดําเนินแผนยุทธศาสตร §Y$JAP_hokushin_ron$§! เสร็จแลว"
 JAG_hokushin_ron_focus_days_tt: "จํานวนวันปจจุบัน: [?JAP_hokushin_ron_started_flag:days|Y0]"

 JAP_nanshin_ron_started_flag: "ดําเนินแผนยุทธศาสตร §Y$JAP_nanshin_ron$§! เสร็จแลว"
 JAG_nanshin_ron_focus_days_tt: "จํานวนวันปจจุบัน: [?JAP_nanshin_ron_started_flag:days|Y0]"

 JAP_sea_establish_the_northern_resource_area: "จัดตั้งเขตทรัพยากรภาคเหนือ"
 JAP_sea_establish_the_northern_resource_area_desc: "เมื่อเรายึดครองภาคเหนือไดสําเร็จแลว ดินแดนรกรางอันอุดมสมบูรณของไซบีเรียตองถูกนํามาใชปอนเครื่องจักรสงครามที่เติบโตไมหยุดของเรา ดังนั้นเราควรเปดเหมืองใหมและสรางเมืองตามแผนในจุดสําคัญ เพื่อดึงทรัพยากรออกมาใหไดมากที่สุด"

 JAP_nanshin_ron: "นันชินรง"
 JAP_nanshin_ron_desc: "แมจีนและไซบีเรียจะอุดมสมบูรณ แตก็ไมไดมีทรัพยากรทั้งหมดที่เราตองการ ทวาไมไกลนักทางใตคือฟลิปปนส หมูเกาะอินเดียตะวันออกของดัตช และอาณานิคมมลายาและบอรเนียวของอังกฤษ เพื่อการพึ่งพาตนเองอยางแทจริง เราตองแยงชิงการควบคุมดินแดนเหลานี้มาจากพวกจักรวรรดินิยมยุโรป"
 JAP_unlocks_pearl_harbor_raid: "ปลดล็อก§Yการจูโจม§!:\nการโจมตีเพิรลฮารเบอรตอ §Y[USA.GetNameWithFlag]§!"

 JAP_soviet_japanese_neutrality_pact: "กติกาสัญญาความเปนกลางโซเวียต–ญี่ปุน"
 JAP_soviet_japanese_neutrality_pact_desc: "พรมแดนทางเหนือของเราตองมั่นคงหากเราตองการอิสระในการรุกลงใต เราจะเริ่มเจรจากับ[SOV.GetNameDef]ทันทีเพื่อใหแนใจวาพวกเขาจะวางตัวเปนกลาง พรอมทั้งเจรจาสิทธิ์ในทรัพยากรเพิ่มเติมในซาคาลินเหนือ"
 JAP_soviet_japanese_neutrality_pact_tt: "หากชาว§Y[SOV.GetAdjective]§!ยอมรับกติกาสัญญานี้ นักอุตสาหกรรมชาว[ROOT.GetAdjective]จะเห็นประโยชนในการลงทุนในสัมปทานของเราใน §Y[655.GetName]§! มากขึ้น"

 JAP_unsinkable_aircraft_carriers: "เรือบรรทุกเครื่องบินที่ไมมีวันจม"
 JAP_unsinkable_aircraft_carriers_desc: "ดินแดนในทะเลใตเปนฐานที่สมบูรณแบบสําหรับปฏิบัติการของอากาศยานของเราในการชิงแปซิฟก เราควรเสริมกําลังเกาะเหลานี้และสรางปอมปราการเพื่อยึดไวใหได มิฉะนั้นมันอาจ 'จม' เหมือนเรือบรรทุกเครื่องบินธรรมดา"

 JAP_isolate_oceania: "ตัดขาดโอเชียเนีย"
 JAP_isolate_oceania_desc: "กองบัญชาการระดับสูงของเราเห็นวาการยกพลขึ้นบกและยึดครอง[AST.GetNameDef]และ[NZL.GetNameDef]ไมอาจทําได จึงเสนอทางออกที่ดีกวาตอปญหาชาติศัตรูเหลานี้ เราควรยึดครองเกาะที่มีการปองกันนอยรอบรัฐเหลานี้ และตัดขาดพวกเขาจากพันธมิตร เพื่อคอย ๆ บั่นทอนเจตจํานงในการสูรบกับเรา"

 JAP_battle_for_australia: "ยุทธการเพื่อออสเตรเลีย"
 JAP_battle_for_australia_desc: "เมื่อ[AST.GetNameDef]ถูกตัดขาดแลว ถึงเวลาเริ่มชิงนานฟาเหนือทวีปนี้ หากเราสามารถครองนานฟาของพวกเขาได บางทีการยึดครองโอเชียเนียอาจไมใชเรื่องเกินเอื้อมนัก"

 JAP_operation_take_australia: "ปฏิบัติการ AN" # Australia-New Zealand
 JAP_operation_take_australia_desc: "ในที่สุดเวลาก็มาถึง กองบัญชาการระดับสูงไดอนุมัติปฏิบัติการยกพลขึ้นบกในออสเตรเลีย รหัสนามปฏิบัติการ AN เราจะโคนศัตรูและยึดครองทองนอยของเอเชีย!"

 JAP_sea_exploit_southern_resource_area: "ใชประโยชนจากเขตทรัพยากรภาคใต"
 JAP_sea_exploit_southern_resource_area_desc: "เมื่อเรานําภาคใตมาอยูใตสนเทาแลว เราตองขยายการใชประโยชนจากทรัพยากรอันอุดมสมบูรณของเอเชียตะวันออกเฉียงใตและหมูเกาะอินเดียตะวันออกอยางมหาศาล เพื่อหลอเลี้ยงกองกําลังของเราในสงคราม"

 JAP_demand_tonkinese_bases: "เรียกรองฐานทัพในตังเกี๋ย"
 JAP_demand_tonkinese_bases_desc: "ภูมิภาคตังเกี๋ยไมเพียงอุดมดวยทรัพยากร แตยังเปนบันไดสําคัญสูการขยายอํานาจลงใตตอไปของเรา ดวยที่ตั้งติดชายแดนจีน มันยังอาจเปนฐานปฏิบัติการสําคัญใหกองทัพอากาศของเราโจมตีเขาไปในกวางตุงไดดวย"
 JAP_demand_tonkinese_bases_tt: "ฝรั่งเศสเปนเจาของ§Yตังเกี๋ย§!"
 JAP_demand_tonkinese_bases_2_tt: "ฝรั่งเศสไมไดเปนเจาของ§Yตังเกี๋ย§!"

 JAP_occupy_indochina: "ยึดครองอินโดจีน"
 JAP_occupy_indochina_desc: "ประชาชนในอินโดจีนกําลังถูกกดขี่โดยระบอบอาณานิคมและจักรวรรดินิยมที่แทบไมใสใจความเปนอยูของพวกเขา เราตองเขาไปควบคุมภูมิภาคนี้เพื่อปกปองประชาชน และไดครอบครองทรัพยากรธรรมชาติของพื้นที่นี้ไปพรอมกัน"
 JAP_occupy_indochina_tt: "ฝรั่งเศสไมไดเปนเจาของ§Yอินโดจีน§!"

 JAP_occupy_siam: "ยึดครองสยาม"
 JAP_occupy_siam_desc: "แมสยามจะเปนพันธมิตรที่มีศักยภาพของเรา แตก็อาจกลายเปนจุดออนที่ศัตรูของเรายอมฉวยโอกาสใชประโยชนอยางแนนอน เราจึงควรเขาแทรกแซงและยึดครองสยามโดยตรง เพื่อมิใหพวกเขามีโอกาสสมคบกับศัตรูของเราไดเลย"

 JAP_sea_pressure_siam: "กดดันสยาม"
 JAP_sea_pressure_siam_desc: "สยามตั้งอยูในทําเลชั้นเยี่ยมที่จะชวยเหลือเราในสงครามกับมหาอํานาจตะวันตกที่กําลังจะมาถึง หากไดสยามมาอยูฝายเดียวกัน การรุกรานมลายูและหมูเกาะอินดีสตะวันออกที่ไมอาจหลีกเลี่ยงไดก็จะงายขึ้นอยางมาก เราจึงตองแสดงใหพวกเขาเห็นอยางชัดแจงวา หากไมอยูขางเรา ก็คือศัตรูของเรา"

 JAP_strike_the_southern_road: "รุกลงเสนทางใต"
 JAP_strike_the_southern_road_desc: "ถึงเวลาแลวที่จะเริ่มแผนการของเรา เราจะรุกลงใตและยึดอาณานิคมตะวันตกที่อุดมดวยทรัพยากรมาเปนของเรา ดวยการโจมตีที่รวดเร็วและเด็ดขาดนี้ เรานาจะลดขีดความสามารถในการรบของศัตรูไดกอนที่สงครามจะเริ่มขึ้นอยางจริงจังเสียดวยซํ้า เทนโนเฮกะ บันไซ!"

 JAP_occupy_east_timor: "ยึดครองติมอรตะวันออก"
 JAP_occupy_east_timor_desc: "แมชาวติมอรจะยังไมไดเปนคูสงครามกับเรา แตก็ยังจําเปนตองนํามาอยูใตปกของเราเพื่ออนาคตของเอเชีย กองทหารของเราพรอมอยูบนเกาะ และเราเตรียมพรอมจะเคลื่อนเขาไปอยางรวดเร็วโดยไมประกาศสงคราม หวังวาจะไมมีใครสังเกต"
 JAP_occupy_east_timor_tt: "§Rสิ่งนี้อาจนําไปสูสงครามกับเจาของ [721.GetName]!§!"

 JAP_revisit_the_thirteen_demands: "ทบทวนขอเรียกรองยี่สิบเอ็ดขอ" # Could also be the 13 demands (the revised list)
 JAP_revisit_the_thirteen_demands_desc: "ในชวงมหาสงคราม รัฐบาลของเราไดยื่นขอเรียกรองชุดหนึ่งตอสาธารณรัฐจีนเพื่อควบคุมทางรถไฟและอื่น ๆ แมในตอนแรกจะรวมถึงสิทธิ์ชี้ขาดในดานการเงิน การตํารวจ และกิจการรัฐบาลของพวกเขาดวย แตขอเหลานั้นถูกปฏิเสธ และสุดทายลงนามกันโดยเหลือขอเรียกรองเพียงสิบสามขอ เราควรหวนกลับไปหาแนวคิดเหลานี้ และประกาศตนเปนผูปกครองเอเชียตะวันออก"

 JAP_invest_in_senbu: "ลงทุนในเซ็นบุ"
 JAP_invest_in_senbu_desc: "องคกรเซ็นบุของเรา ซึ่งมักอยูในรูปของโรงเรียน หนวยแพทย และศูนยแจกจายอาหาร เปนปฏิบัติการสงครามจิตวิทยารูปแบบหนึ่งที่มุงสรางความสงบในหมูประชากรทองถิ่นในดินแดนยึดครอง จนถึงตอนนี้พวกมันพิสูจนแลววามีประสิทธิภาพในการทําใหแมนจูเรียสงบ บางทีเราควรขยายปฏิบัติการใหครอบคลุมสวนที่เหลือของจีน"
 JAP_unlock_senbu_occupation_law_tt: "ปลดล็อกกฎหมายการยึดครองในรัฐของ§Yจีน§!:\n"

 JAP_establish_mongol_military_government: "จัดตั้งรัฐบาลทหารมองโกล"
 JAP_establish_mongol_military_government_desc: "เจาชายเตอ ผูสืบเชื้อสายของเจงกิสขานผูยิ่งใหญ ดํารงตําแหนงทรงอํานาจในสภาไปหลิงเมี่ยว ซึ่งเปนผูนําหุนเชิดของกกมินตั๋งในมองโกเลียใน เขาปรารถนาจะฟนฟูชาวมองโกลสูความรุงเรืองในอดีต และยินดีอยางยิ่งที่จะเขาขางเราในการจัดตั้งรัฐบาลทหารมองโกล หากเราสัญญาวาจะชวยใหความทะเยอทะยานของเขาเปนจริง"

 JAP_launch_the_suiyuan_campaign: "เปดการทัพสุยหยวน"
 JAP_launch_the_suiyuan_campaign_desc: "กองทัพมองโกเลียในและกองทัพธรรมะฮั่นใหญพรอมเปดปฏิบัติการเขาสูดินแดนของขุนศึก [SHX.GetLeader] หากไดรับการสนับสนุนทางอากาศและการกํากับดูแลจากนายทหารฝายเสนาธิการชาวญี่ปุน บางทีเราอาจยึดมองโกเลียในเพิ่มไดโดยไมกอใหเกิดสงครามขนาดใหญในจีน"
 JAP_launch_the_suiyuan_campaign_tt: "ดวยการสนับสนุนของเรา §Yกองทัพมองโกเลียใน§! และ§Yกองทัพธรรมะฮั่นใหญ§!จะเปดการรุกเพื่อยึด §Y[621.GetName]§! จากกองกําลังกกมินตั๋ง แตจะมีชวงเวลาจํากัดกอนที่ปฏิบัติการจะตองถูกยกเลิก"

 JAP_reorganize_the_united_autonomous_government: "รัฐบาลปกครองตนเองสหรวม"
 JAP_reorganize_the_united_autonomous_government_desc: "รัฐบาลทหารมองโกลในปจจุบันมีเพียงองคกรทางการเมืองขั้นพื้นฐาน และจะไมสามารถดํารงอยูไดนานหากเราไมเขาแทรกแซง เราตองปรับโครงสรางใหเปนรัฐบาลปกครองตนเองสหรวมมองโกล เพื่อใหพวกเขาสามารถสถาปนาตนเปนชาติอธิปไตยไดอยางเหมาะสม"

 JAP_mengjiang_united_autonomous_government: "รัฐบาลปกครองตนเองเหมิงเจียง"
 JAP_mengjiang_united_autonomous_government_desc: "เพื่อใหความชอบธรรมแกการอางสิทธิ์ของเจาชายเตอเหนือมองโกเลียในทั้งหมด เราควรปรับโครงสรางรัฐบาลของรัฐนี้อีกครั้งเปนรัฐบาลปกครองตนเองสหรวมเหมิงเจียง เพื่อที่พวกเขาจะไดรวมชาวมองโกลภายในพรมแดนจีนไวใตธงผืนเดียวกันอยางเด็ดขาด"

 JAP_mongol_autonomous_state: "รัฐมองโกเลียปกครองตนเอง"
 JAP_mongol_autonomous_state_desc: "[MON.GetNameDefCap]อางวาเปนรัฐบาลมองโกเลียที่แทจริง ซึ่งเจาชายเตอคัดคานอยางรุนแรง เราควรปรับโครงสรางและเปลี่ยนชื่ออาณาจักรของเขาอีกครั้ง เพื่อใหเขาสามารถอางสิทธิ์เหนือดินแดนมองโกลทั้งหมดไดอยางชอบธรรมยิ่งขึ้น"

 JAP_reinforce_the_beijing_garrison: "เสริมกําลังกองรักษาการณเหอเปยตะวันออก"
 JAP_reinforce_the_beijing_garrison_desc: "รัฐบาลปกครองตนเองเหอเปยตะวันออกถูกจัดตั้งขึ้นหลังจากเราพิชิตกําแพงเมืองจีน โดยมีกองทัพเหอเปยตะวันออกทําหนาที่บังคับใหฝง[CHI.GetAdjective]ของภูมิภาคเปนเขตปลอดทหาร เราควรเสริมกําลังหนวยนี้และกองรักษาการณควันตงในพื้นที่เชิงรุก เพื่อไมใหตกเปนเหยื่อการรุกรานของ[CHI.GetAdjective]"
 JAP_reinforce_the_beijing_garrison_tt: "§Rอาจนําไปสูสงครามกับ[CHI.GetNameDef]§!"

 JAP_develop_the_chinese_resources: "พัฒนาทรัพยากรของจีน"
 JAP_develop_the_chinese_resources_desc: "เมื่อดินแดนจีนผืนใหญตกอยูใตท็อปบูตของเราแลว ตอนนี้เราตองพัฒนาทรัพยากรอันอุดมสมบูรณของจีนเพื่อใหเปนประโยชนในสงครามครั้งตอไป"

 JAP_form_the_jikyoku_iinkai: "จัดตั้งจิเกียวกุ อีอินไค"
 JAP_form_the_jikyoku_iinkai_desc: "เพื่อควบคุมการนําเขาและสงออกระหวางเรากับ[USA.GetNameDef]ไดดีขึ้น รวมถึงพยายามโนมนาวประชาชน[USA.GetAdjective]ใหเขาขางเรามากกวา[CHI.GetNameDef] เราควรจัดตั้งคณะกรรมการการคาและสารสนเทศแหงญี่ปุน"
 japanese_committee_on_trade_and_information_pom: "คณะกรรมการการคาและสารสนเทศแหงญี่ปุน"

 JAP_strategic_offensives: "การรุกเชิงยุทธศาสตร"
 JAP_strategic_offensives_desc: "[CHI.GetNameDefCap]พิสูจนแลววาเปนเม็ดมะขามที่แกะยากยิ่ง และกองบัญชาการระดับสูงของเราไดเรียกรองใหมีการรุกที่ประสานกันมากขึ้น โดยมุงเปาไปยังจุดสําคัญตาง ๆ เมื่อพวกเกโคคุโจในสนามรบขัดขวางผลประโยชนระดับสูงของเรา เราตองจํากัดพวกเขาเสียกอน เพื่อใหปฏิบัติการเหลานี้เดินหนาไดในที่สุด"
 JAP_strategic_offensives_tt: "ปลดล็อกการตัดสินใจ§Yเปดการรุก§!ที่ใหโบนัสชั่วคราวใน§Yรัฐของจีน§!"

 JAP_intensify_anti_guerilla_operations: "ยกระดับปฏิบัติการตอตานกองโจร"
 JAP_intensify_anti_guerilla_operations_desc: "กองโจรและผูแทรกซึมกําลังขัดขวางความคืบหนาและความสําเร็จของการทัพของเราในจีน ดวยการโจมตีจุดที่เจ็บที่สุดของเรา เราตองเตรียมโจมตีอยางประสานกันตอพวกโจรเหลานี้ และกําจัดเครือขายของพวกมันออกจากดินแดนของเราไมวาจะดวยวิธีใดก็ตาม!"
 JAP_intensify_anti_guerilla_operations_tt: "ลดคาใชจายในการตัดสินใจ §Y$PRC_root_out_guerilla_fighters$§! ลงครึ่งหนึ่ง และทําใหการตอตานลดลงชั่วคราวในรัฐที่กองโจรถูกกวาดลางแลว"

 JAP_reorganized_national_government: "รัฐบาลแหงชาติปฏิรูป"
 JAP_reorganized_national_government_desc: "เราพบวารัฐบาลทองถิ่นจํานวนมากที่กองทัพของเราจัดตั้งขึ้น รวมถึงการยึดครองชนบทของจีนโดยตรง กําลังสรางภาระใหเราอยางหนัก เราตองรวมรัฐบาลเหลานี้เขาดวยกันและจัดตั้งรัฐบาลแหงชาติปฏิรูป"
 JAP_reorganized_national_government_tt: "ปลดล็อกการตัดสินใจ§Yรวบรวม§!§Yดินแดนในจีน§!ของเรา"

 JAP_occupy_macau: "ยึดครองมาเกา"
 JAP_occupy_macau_desc: "มาเกาเปนเมืองที่อันตรายเกินกวาจะปลอยไวนอกการควบคุมของเรา หากเรายังจะสูกับพวกนักลาอาณานิคมตะวันตกตอไป เมืองนี้อาจเปนจุดพักพลเพื่อตัดขาดกองทัพของเราและสงเสบียงใหศัตรูทั้งทางอากาศและทางทะเล ดังนั้นเราตองเขายึดครองทันทีกอนที่มันจะกลายเปนหายนะที่ไมคาดคิดของเรา"

 JAP_an_expedition_to_tibet: "คณะสํารวจสูทิเบต"
 JAP_an_expedition_to_tibet_desc: "เพื่อใหเขาใจไดดีขึ้นวาเราจะสามารถโนมนาวรัฐบาล[TIB.GetAdjective]ใหเขาขางเราในความขัดแยงครั้งใหญเพื่อเอเชียไดหรือไม เราควรเริ่มภารกิจขาวกรองเพื่อติดตอกับพวกเขา แตดวยกฎที่เขมงวดเรื่องผูที่จะเขาประเทศได เราจึงตองสงจินโซ โนโมโตะ ปลอมตัวเปนชาวมองโกลเดินทางไปพรอมกับพระทิเบต"
 JAP_an_expedition_to_tibet_tt: "ปลดล็อกการตัดสินใจ§Yแผอิทธิพลในทิเบต§! โดยมีเปาหมายเพื่อเปลี่ยนพวกเขาใหเปน§Yรัฐในอารักขาของญี่ปุน§!"

 JAP_ally_the_dragon_king: "ผูกพันธมิตรกับราชามังกร"
 JAP_ally_the_dragon_king_desc: "ราชามังกรแหงภูฏานปกครองราชอาณาจักรทิเบตอันโดดเดี่ยวและปดตัวของพระองค แตบางทีพระองคอาจมองเห็นภาพที่ใหญกวา เราควรสงคณะผูแทนอยางเปนทางการไปยังปูนาคา เพื่อโนมนาวใหพระองครวมกับเราในการปลดปลอยเอเชีย"

 JAP_claim_the_raven_crown: "ยึดมงกุฎกา"
 JAP_claim_the_raven_crown_desc: "องคจักรพรรดิแหงสวรรคของเราอยูเหนือผูอื่นทั้งปวง และผูใดที่ไมเห็นเชนนั้นจะตองถูกบดขยี้ เราควรบุก[BHU.GetNameDef]และยึดราชบัลลังกมาเปนของเรา"

 JAP_ally_the_gorkhas: "ผูกพันธมิตรกับชาวกุรขา"
 JAP_ally_the_gorkhas_desc: "พระมหากษัตริยแหงเนปาลปกครองราชอาณาจักรของพระองคทามกลางเทือกเขาที่สูงที่สุดในโลก และแทบถูกตัดขาดจากการติดตอกับตางชาติ บางทีพระองคอาจรับฟงเหตุผล เราควรสงคณะผูแทนอยางเปนทางการไปยังกาฐมาณฑุ เพื่อโนมนาวใหพระองครวมกับเราในการปลดปลอยเอเชีย"

 JAP_claim_the_scripech: "ยึดศรีเปช"
 JAP_claim_the_scripech_desc: "องคจักรพรรดิแหงสวรรคของเราอยูเหนือผูอื่นทั้งปวง และผูใดที่ไมเห็นเชนนั้นจะตองถูกบดขยี้ เราควรบุก[NEP.GetNameDef]และยึดราชบัลลังกมาเปนของเรา"

 JAP_ally_afghanistan: "ผูกพันธมิตรกับราชวงศบารักไซ"
 JAP_ally_afghanistan_desc: "พระมหากษัตริยแหงอัฟกานิสถานปกครองชนเผาอัฟกันตาง ๆ ในหนึ่งในภูมิภาคภูเขาที่โหดรายที่สุดของโลก บางทีพระองคอาจรับฟงเหตุผล เราควรสงคณะผูแทนอยางเปนทางการไปยังคาบูล เพื่อโนมนาวใหพระองครวมกับเราในการปลดปลอยเอเชีย"

 JAP_best_the_graveyard: "พิชิตสุสานแหงจักรวรรดิ"
 JAP_best_the_graveyard_desc: "องคจักรพรรดิแหงสวรรคของเราอยูเหนือผูอื่นทั้งปวง และผูใดที่ไมเห็นเชนนั้นจะตองถูกบดขยี้ เราควรบุก[AFG.GetNameDef]และยึดราชบัลลังกมาเปนของเรา"

 JAP_form_the_central_economic_council: "จัดตั้งสภาเศรษฐกิจกลาง"
 JAP_form_the_central_economic_council_desc: "เพื่อแกภาวะเศรษฐกิจตกตํ่าที่ประเทศเผชิญจากความไรเสถียรภาพทางการเมืองและสงคราม เราควรจัดตั้งองคกรที่ปรึกษาพิเศษขึ้นตรงตอนายกรัฐมนตรี โดยมีเปาหมายเพื่อศึกษาและพิจารณานโยบายเศรษฐกิจระหวางแผนดินแมกับดินแดนโพนทะเล รวมถึงแผนพื้นฐานในการนําไปปฏิบัติ"

 JAP_expand_the_showa_research_association: "ขยายสมาคมวิจัยโชวะ"
 JAP_expand_the_showa_research_association_desc: "โชวะ เค็งคิวไค คลังสมองทางการเมืองที่กอตั้งขึ้นเพื่อสรางแนวคิดใหมสําหรับการปฏิรูปการเมืองผานการทบทวนและประเมินปญหาของรัฐธรรมนูญเมจิ ไดขยายขอบเขตความสนใจและจัดตั้งกลุมยอยใหม ๆ เราควรสงเสริมเรื่องนี้ เพื่อใหพวกเขาพัฒนาเทคโนโลยีใหมและวิธีการครอบงําเอเชีย"

 JAP_form_the_great_japan_industrial_patriotic_association: "สมาคมรักชาติอุตสาหกรรมมหาญี่ปุน"
 JAP_form_the_great_japan_industrial_patriotic_association_desc: "นักอุตสาหกรรมและสหภาพแรงงานในประเทศของเราแตกแยกและไรประสิทธิภาพ ซึ่งขัดขวางการพัฒนาเศรษฐกิจของเรา เราตองรวมพวกเขาทั้งหมดไวใตองคกรรมเดียว เพื่อใหอุตสาหกรรมของเราดําเนินไปอยางมีประสิทธิภาพที่สุดและนําไปสูการขยายตัวตอไป"

 JAP_sea_guide_the_zaibatsus: "ชี้นําไซบัตสึ"
 JAP_sea_guide_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของประเทศเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาชานาน ดวยชั้นเชิงเล็กนอย เราอาจชี้นําความพยายามของพวกเขาใหเปนประโยชนตอเรา และจัดระเบียบผูนําของพวกเขาใหมเปนกลุมภายใตการควบคุมที่กวางขวางของเรา"

 JAP_form_cabinet_intelligence_bureau: "จัดตั้งสํานักขาวกรองคณะรัฐมนตรี"
 JAP_form_cabinet_intelligence_bureau_desc: "นายกรัฐมนตรี [ROOT.GetLeader] ไดรองขอเปนการสวนตัวใหมีองคกรรัฐบาลที่มุงปรับปรุงมติมหาชนใหนิยมญี่ปุน และทําใหแนใจวาพลเมืองทุกคนทุมเททุกสิ่งเพื่อสงครามและการปองกันชาติอันยิ่งใหญของเรา โนบุฟูมิ อิโต ไดรับคําขอนี้แลว และรอเพียงคําสั่งอยางเปนทางการเพื่อจัดตั้งสํานักงานนี้"

 JAP_crackdown_on_foreign_agents: "กวาดลางสายลับตางชาติ"
 JAP_crackdown_on_foreign_agents_desc: "สํานักขาวกรองคณะรัฐมนตรีไดพบบุคคลนาสงสัยจํานวนมากดอม ๆ มอง ๆ อยู บางคนมีอุดมการณที่ไมพึงประสงค และบางคนก็เปนสายลับของมหาอํานาจตางชาติอยางชัดเจน บางทีถึงเวลาแลวที่สํานักงานจะเริ่มลงมือ และเปดปฏิบัติการเพื่อปกปองชาติและประชาชนของเรา?"
 JAP_crackdown_on_foreign_agents_tt: "§Yโทกโก§!จะจับกุมผูเห็นตางและสายลับอยางแข็งขันยิ่งขึ้น เพื่อเสริมความมั่นคงและเสถียรภาพของชาติ"

 JAP_found_the_great_japan_press_association: "กอตั้งสมาคมสื่อมวลชนมหาญี่ปุน"
 JAP_found_the_great_japan_press_association_desc: "สํานักขาวกรองคณะรัฐมนตรีไดคิดคนวิธีชี้นําประชาชนไปในทิศทางที่ถูกตองอยางมีประสิทธิภาพยิ่งขึ้น ดวยการจัดตั้งสมาคมสื่อมวลชนมหาญี่ปุน เราจะมีสํานักงานเดียวควบคุมสื่อทั้งหมดในประเทศ เซ็นเซอรขอมูลใดก็ตามที่จําเปนไดอยางมีประสิทธิภาพ และกระจายโฆษณาชวนเชื่อแบบรักชาติไปยังผูที่อาจตองการมัน"

 JAP_empower_the_thought_police: "เสริมอํานาจตํารวจความคิด"
 JAP_empower_the_thought_police_desc: "ตํารวจระดับสูงพิเศษมีไวเพื่อบังคับใชกฎหมายแพง ควบคุมกลุมการเมืองและอุดมการณที่ถูกมองวาคุกคามความสงบเรียบรอยของจักรวรรดิญี่ปุน ตอตานขาวกรอง สืบสวนคดีอาญาภายในประเทศ ดูแลความมั่นคงระดับสูง และความปลอดภัยสาธารณะ เราควรเสริมความแข็งแกรงใหองคกรนี้ เพื่อใหพวกเขาทํางานไดมีประสิทธิภาพยิ่งขึ้น"

 JAP_sea_state_general_mobilization_law: "กฎหมายระดมพลทั่วไปแหงรัฐ"
 JAP_sea_state_general_mobilization_law_desc: "เราพบวาจําเปนตองปรับเศรษฐกิจของชาติเขาสูภาวะสงคราม เพื่อไมใหลาหลังในการพัฒนาอาวุธ ดวยกฎหมายใหมนี้ รัฐบาลจะสามารถควบคุมองคกรพลเรือนและสหภาพแรงงาน โอนอุตสาหกรรมยุทธศาสตรเปนของรัฐ ควบคุมราคา และกําหนดการปนสวนไดตามที่จําเปน" 
 JAP_sea_state_general_mobilization_law_tt: "ปลดล็อกความสามารถในการเปลี่ยนเปน §Y$closed_economy$§! แมจะเปน§Yไมฝกใฝฝายใด§!"

 JAP_issue_the_ten_commandments_for_marriage: "บัญญัติสิบประการแหงการสมรส"
 JAP_issue_the_ten_commandments_for_marriage_desc: "เจาหนาที่ของเราไดคิดคําขวัญใหม 'จงมีลูกดกและทวีจํานวน' ซึ่งเปนสวนหนึ่งของรณรงคใหมเพื่อเพิ่มประชากร[ROOT.GetAdjective] เนื่องจากจํานวนประชากรของเราคอนขางนอยเมื่อเทียบกับศัตรูหลายราย เราตองสนับสนุนโครงการนี้"

 JAP_enact_religious_organizations_law: "ตรากฎหมายองคกรศาสนา"
 JAP_enact_religious_organizations_law_desc: "เพื่อชี้นําความสนใจของประชาชนไปสูสิ่งที่ถูกตอง และใหแนใจวาพวกเขาจะสนับสนุนการไลตามชะตากรรมของ[ROOT.GetAdjective]อยางไมหวั่นไหว เราตองประกาศใชกฎหมายที่ใหอํานาจรัฐควบคุมองคกรศาสนาทั้งหมดในประเทศ"

 JAP_new_order_movement: "ขบวนการระเบียบใหม"
 JAP_new_order_movement_desc: "เราตองจัดตั้งองคกรระดับชาติดานกิจการภายในโดยยึดแบบอยางรัฐพรรคเดียวในตะวันตก เพื่อระดมชาติเขาสูสงครามกับมหาอํานาจอาณานิคม และปองกันคอมมิวนิสตดวยการปฏิเสธเสนทางทุนนิยมสมัยใหมที่เริ่มตนตั้งแตการปฏิรูปเมจิ เรื่องนี้เรงดวนกวาที่เคย เพราะหากเราไมลงมือโดยเร็ว เราอาจตกรถเมล"

 JAP_sea_tripartite_pact: "เสนอกติกาสัญญาไตรภาคี"
 JAP_sea_tripartite_pact_desc: "ขณะที่ศัตรูรวมตัวกันตอตานเรา ภารกิจในการเอาชนะพวกเขาก็ยิ่งทาทายขึ้น เราควรยื่นมือไปยังรัฐบาลอื่นที่มีเปาหมายคลายกัน เพื่อใหเรารวมมือกันไดในระดับหนึ่ง"

 JAP_sea_mil_tech_coop_with_germany: "ความรวมมือทางทหารกับเยอรมนี"
 JAP_sea_mil_tech_coop_with_germany_desc: "เราตองการเทคโนโลยีที่ดีกวาเพื่อรวมโลกไวใตหลังคาเดียวกัน เยอรมนีไมเพียงเปนหุนสวนดานการพัฒนาเทคโนโลยีของเรามาแตอดีต แตยังมีความกาวหนาทางเทคโนโลยีทหารมากมายที่จะเปนประโยชนอยางยิ่งตอความพยายามในสงครามของเรา เราตองไดแบบพิมพเขียวเหลานี้มาใหได ไมวาจะตองแลกดวยอะไรก็ตาม!"

 JAP_imperial_rule_assistance_association: "สมาคมชวยเหลือการปกครองของจักรพรรดิ"
 JAP_imperial_rule_assistance_association_desc: "ดวยภัยคุกคามทั้งภายในและภายนอก และความแตกแยกในรัฐบาลพลเรือน เราตองจัดตั้งไทเซ โยกุซังไค เพื่อนําระบบการเมืองแบบรัฐนิยมกึ่งฟาสซิสตเขามา โดยมีเปาหมายขจัดลัทธิแบงพวกและการแบงฝกฝายออกจากการเมืองและเศรษฐกิจ สรางรัฐพรรคเดียวแบบเบ็ดเสร็จเพื่อเพิ่มประสิทธิภาพสูงสุดใหหลักนิยมสงครามเต็มรูปแบบของเรา"

 JAP_form_the_yokusan_sonendan: "จัดตั้งโยกุซัง โซเน็นดัน"
 JAP_form_the_yokusan_sonendan_desc: "เพื่อปกปองอธิปไตยของชาติ เราตองการผูคนมากขึ้นที่ไมเพียงพรอมจะสูเพื่อเรา แตยังพรอมเขารวมกองรักษาดินแดนเพื่อชวยเหลือดานการปองกันภัยฝายพลเรือนภายใตการสั่งการของเจาหนาที่ทองถิ่น ดวยเหตุนี้เราควรจัดตั้งหนวยเยาวชนกึ่งทหารชั้นยอดของสมาคมชวยเหลือการปกครองของจักรพรรดิ ที่ชื่อวา 'โยกุซัง โซเน็นดัน'"

 JAP_integrate_the_great_japan_youth_party: "ผนวกพรรคเยาวชนมหาญี่ปุน"
 JAP_integrate_the_great_japan_youth_party_desc: "พรรคเยาวชนมหาญี่ปุน องคกรเยาวชนชาตินิยมที่จําลองแบบมาจากขบวนการเยาวชนของเยอรมนี ยังไมอยูภายใตการควบคุมของเราโดยสมบูรณ และทําตัวเปนบุคคลที่สามอิสระภายใตพันเอกคิงโงโร ฮาชิโมโตะ เราตองควบคุมพวกเขาและนํามาอยูใตการควบคุมของไทเซ โยกุซังไค"

 JAP_sea_national_defense_state: "รัฐปองกันประเทศ"
 JAP_sea_national_defense_state_desc: "[ROOT.GetLeader] ไดประกาศชินไทเซ เปลี่ยนญี่ปุนใหเปนรัฐปองกันประเทศ ซึ่งชาย หญิง และเด็กทุกคนจะถูกระดมเพื่อปกปองชาติ ภายใตกฎหมายระดมพลแหงชาติ รัฐบาลยังไดรับอํานาจเด็ดขาดเหนือทรัพยสินของชาติดวย ดวยสิ่งนี้ จักรวรรดิจะคงอยูไดชั่วนิรันดร!"
 JAP_gain_national_defense_state_remove_total_mob_tt: "§Rลบ§! §Y$tot_economic_mobilisation$§! ไดรับ §Y$national_defense_state$§!"

 JAP_formalize_the_tonarigumi: "ทําใหโทนาริงุมิเปนทางการ"
 JAP_formalize_the_tonarigumi_desc: "สมาคมเพื่อนบานดํารงอยูอยางไมเปนทางการมาระยะหนึ่งแลว โดยชวยจัดสรรสินคาปนสวน กระจายพันธบัตรรัฐบาล ดับเพลิง ดูแลสาธารณสุข ปองกันภัยฝายพลเรือน เผยแพรโฆษณาชวนเชื่อเพื่อระดมจิตวิญญาณ แจงโทกโกเรื่องผูเห็นตางทางการเมือง และเฝาระวังชายฝงจากกิจกรรมนาสงสัย เราควรทําใหพวกเขาเปนทางการ เพื่อจัดสรรงบประมาณใหกลุมเหลานี้มากขึ้น"
 JAP_formalize_the_tonarigumi_tt: "ปลดล็อกการตัดสินใจ§Yจัดตั้งโทนาริงุมิ§!ในรัฐในอารักขาของเรา"

 JAP_ichioku_isshin: "อิจิโอกุ อิชชิน"
 JAP_ichioku_isshin_desc: "ดังคําขวัญหนึ่งของไทเซ โยกุซังไค ประชาชน[ROOT.GetAdjective]คือ 'รอยลานคน หนึ่งหัวใจ' อยางแทจริง แมประชาชนของเราจะเปนราษฎรแตละคนขององคจักรพรรดิ แตทุกคนยืนหยัดรวมกันเปนหนึ่งเดียว มีหัวใจและจิตใจเปนหนึ่งเดียวกัน"

 JAP_issue_the_senjinkun_military_code: "ออกประมวลวินัยทหารเซ็นจินคุง"
 JAP_issue_the_senjinkun_military_code_desc: "ควรแจกจายประมวลวินัยทหารขนาดพกพา 'คําสั่งสอนสําหรับสนามรบ' ใหทหาร[ROOT.GetAdjective]ทุกนาย เพื่อเตรียมพวกเขาใหพรอมสําหรับความขัดแยงหลายปที่จะมาถึง พวกเขาจะไดเรียนรูระเบียบวินัยทหาร ความพรอมรบ ขวัญและกําลังใจของหนวย ความกตัญู ตลอดจนการเคารพบูชาเทพเจาชินโตและโคกุไต 'อยามีชีวิตอยูเพื่อรับความอัปยศในฐานะเชลย เกียรติตองมากอนการยอมจํานน!'"
 cost_reduced_last_stand_2: "สามารถใชความสามารถคําสั่ง§Yยืนหยัดครั้งสุดทาย§!ไดดวยตนทุนที่ลดลงอยางมาก พรอมยืดระยะเวลาออกไปอีก §G3§! วัน\n"

 JAP_issue_the_shinmin_no_michi_manifesto: "ออกแถลงการณ 'ชินมิน โนะ มิจิ'"
 JAP_issue_the_shinmin_no_michi_manifesto_desc: "ประชาชนของเราตองไดรับการสั่งสอนถึงวิถีแหงราษฎร ซึ่งจะทําผานแถลงการณเชิงอุดมการณที่มุงสูประชาชน เพื่ออธิบายอยางชัดเจนวาพวกเขาถูกคาดหวังใหทําสิ่งใด 'ในฐานะประชาชนและชาติ' การออกแถลงการณนี้จะเปนความรับผิดชอบของกระทรวงศึกษาธิการ"

 JAP_sea_greater_east_asian_co_properity_sphere: "วงไพบูลยรวมแหงมหาเอเชียบูรพา"
 JAP_sea_greater_east_asian_co_properity_sphere_desc: "เราตองจัดตั้งสหภาพในเอเชียเพื่อใหรัฐสมาชิกพึ่งพาตนเองทางเศรษฐกิจและรวมมือกัน พรอมทั้งตอตานอิทธิพลของจักรวรรดินิยมตะวันตกและคอมมิวนิสตโซเวียต แตแนนอนวานี่ก็เปนเครื่องมือโฆษณาชวนเชื่อที่มีประสิทธิภาพในการบังคับใชอํานาจครอบงําของเราเหนือทวีปนี้"
 JAP_CHI_pact_is_active_flag: " พันธมิตรจีน-ญี่ปุนมีผลบังคับใช"
 JAP_unlock_east_asia_occupation_law_tt: "ปลดล็อกกฎหมายการยึดครองในรัฐของ§Yเอเชีย§!:\n"
 JAP_sea_greater_east_asian_co_properity_sphere_tt: "การปลดปลอยและตั้งรัฐหุนเชิดในรัฐของ§Yเอเชีย§!และ§Yโอเชียเนีย§!มีคาใชจายถูกลง §G25%§!"
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt: "ปลดล็อกการตัดสินใจ§Yจัดตั้งระบอบหุนเชิด§!ทั่วเอเชียตะวันออกเฉียงใต"

 JAP_expand_japan_manchukuo_economic_bloc: "กลุมเศรษฐกิจญี่ปุน-แมนจูกัว"
 JAP_expand_japan_manchukuo_economic_bloc_desc: "เราควรริเริ่มสรางกลุมเศรษฐกิจระหวางเรากับรัฐในอารักขาของจักรวรรดิ เพื่อเสริมความแข็งแกรงทางเศรษฐกิจและจัดหาวัตถุดิบยุทธศาสตรใหเพียงพอ เชน เหล็ก ถานหิน ฝาย และเกลือ"

 JAP_develop_the_yen_bloc: "พัฒนากลุมเงินเยน"
 JAP_develop_the_yen_bloc_desc: "เราตองใหความสําคัญกับดานเศรษฐกิจของวงไพบูลยรวมแหงมหาเอเชียบูรพามากขึ้น เศรษฐกิจของเอเชียตองบูรณาการเขาดวยกัน และทุกประเทศควรใชเงินเยนเปนสกุลเงิน ซึ่งทําไดดวยการพัฒนากลุมเงินเยนญี่ปุน–แมนจูกัว–จีนตอไปจนสมบูรณแบบในที่สุด"
 JAP_develop_the_yen_bloc_tt: "ปลดล็อกการตัดสินใจ§Yบูรณาการเศรษฐกิจ§!ของ§Yพันธมิตรเอเชีย§!ของเรา"

 JAP_east_asia_development_board: "คณะกรรมการพัฒนาเอเชียตะวันออก"
 JAP_east_asia_development_board_desc: "การจัดตั้งโคอาอินจะชวยประสานนโยบายจีนของรัฐบาล ซึ่งออกแบบมาเพื่ออุดหนุนการพัฒนาอุตสาหกรรมและการพาณิชยในจีน เพื่อเพิ่มการสนับสนุนการปกครองของญี่ปุนในดินแดนยึดครอง นอกจากนี้ยังใชเปนเครื่องมือจัดหาแรงงานใหเหมืองและอุตสาหกรรมสงครามของเราไดดวย"
 JAP_east_asia_development_board_tt: "ปลดล็อกการตัดสินใจเริ่ม§Yโครงการอุตสาหกรรม§!ในประเทศพันธมิตรของเรา"

 JAP_ministry_of_greater_east_asia: "กระทรวงมหาเอเชียบูรพา"
 JAP_ministry_of_greater_east_asia_desc: "การจัดตั้งไดโตอาโชจะชวยใหเราบริหารดินแดนโพนทะเลที่ไดมาในแปซิฟกไดอยางมีประสิทธิภาพยิ่งขึ้น รวมถึงประสานการจัดตั้งและพัฒนาวงไพบูลยรวมแหงมหาเอเชียบูรพา"

 JAP_the_flying_geese: "ฝูงหานบิน"
 JAP_the_flying_geese_desc: "การพัฒนาเทคโนโลยีในเอเชียตะวันออกเฉียงใตจะนําโดยใครไมไดนอกจากเรา และชาติเอเชียจะไลตามตะวันตกทันในฐานะสวนหนึ่งของลําดับชั้นในภูมิภาค ซึ่งการผลิตสินคาทั่วไปจะเคลื่อนยายจากประเทศที่กาวหนากวาไปสูประเทศที่กาวหนานอยกวาอยางตอเนื่อง ดุจฝูงหานที่บินเปนรูปตัววี เราจะนําทางการพัฒนาของเอเชีย!"

 JAP_greater_east_asia_railroad: "ทางรถไฟมหาเอเชียบูรพา"
 JAP_greater_east_asia_railroad_desc: "วิศวกรชั้นนําของเราไดคิดแนวคิดทางรถไฟที่เชื่อมญี่ปุนกับแผนดินใหญเอเชียและยุโรป รวมถึงอุโมงคหรือสะพานที่เชื่อมประเทศของเรากับดินแดนเกาหลีของเรา ดวยแนวคิดที่ไดมาจากทางรถไฟแมนจูเรียใต รถไฟหัวกระสุนของเราจะวิ่งจากโตเกียวไปยางกุง และตอไปยังเตหะราน ขอใหจักรวรรดิของเราคงอยูชั่วนิรันดร!"
 JAP_greater_east_asia_railroad_tt: "ทุกรัฐที่เราหรือพันธมิตรควบคุมซึ่งมี§Yโครงสรางพื้นฐานตํ่ากวา 2§! จะไดรับ§Yโครงสรางพื้นฐาน§!เพิ่ม §G1§!"

 JAP_promote_pan_asianism: "สงเสริมลัทธิรวมเอเชีย"
 JAP_promote_pan_asianism_desc: "ความฝนถึงรัฐเอเชียที่เปนหนึ่งเดียวใกลความจริงกวาที่เคย ดวยวีรกรรมของทหารผูกลาหาญของเราและการริเริ่มภายใตวงไพบูลยรวมแหงมหาเอเชียบูรพา ครั้งนี้และตลอดไป ชาติตะวันตกจะไดเห็นวาเอเชียไมใชแคภูมิภาคที่พวกเขาจะเอาเปรียบได แตเปนภูมิภาคที่จะยืนหยัดเทียบเคียงไดแมกับจักรวรรดิที่ยิ่งใหญที่สุดเกินกวาที่พวกเขาจะจินตนาการได"
 JAP_promote_pan_asianism_tt: "ปลดล็อกการตัดสินใจ§Yผนวกรวม§!รัฐในอารักขาเอเชียที่พัฒนาแลวของเรา โดยมีเปาหมาย§Yรวมเอเชีย§!ใหเปนรัฐเดียว"

 JAP_tojos_premiership: "นายกรัฐมนตรีโทโจ" 
 JAP_tojos_premiership_desc: "ดวยสถานการณในปจจุบัน เปนเรื่องสําคัญยิ่งที่จะเลือกนายกรัฐมนตรีที่สามารถรวมกองทัพบกจักรวรรดิไวเบื้องหลัง และนําประเทศไดทั้งในฐานะผูนําทางทหารและผูนําพลเรือน ดวยเหตุนี้ นายพลฮิเดกิ โทโจ จะไดรับเลือกใหนําชาติสูความรุงโรจน"
 JAP_tojos_premiership_tt: "ไมใชรัฐของจีน"

 JAP_yamamotos_premiership: "นายกรัฐมนตรียามาโมโตะ"
 JAP_yamamotos_premiership_desc: "ดวยสถานการณในปจจุบัน เปนเรื่องสําคัญยิ่งที่จะเลือกนายกรัฐมนตรีที่สามารถรวมกองทัพเรือจักรวรรดิไวเบื้องหลัง และนําประเทศไดทั้งในฐานะผูนําทางทหารและผูนําพลเรือน ดวยเหตุนี้ พลเรือเอกอิโซโรกุ ยามาโมโตะ จะไดรับเลือกใหนําชาติสูความรุงโรจน"
 JAP_yamamoto_shot_down_flag: " ยามาโมโตะถูกยิงตกและเสียชีวิต"

 JAP_the_crysanthemum_throne: "ราชบัลลังกดอกเบญจมาศ"
 JAP_the_crysanthemum_throne_desc: "กลุมตาง ๆ ในกองทัพของเราทะเลาะกันมากเกินไป และไมสามารถตกลงกันไดวาจะเลื่อนใครขึ้นเปนนายกรัฐมนตรีคนตอไป ดวยสถานการณที่ผันผวนเชนนี้ อาจเปนการรอบคอบที่องคจักรพรรดิจะเขามาควบคุมสถานการณโดยตรง"

 JAP_solidify_tohokai_rule: "ตอกยํ้าการปกครองของโทโฮไค"
 JAP_solidify_tohokai_rule_desc: "เมื่อนากาโนะขึ้นเปนนายกรัฐมนตรี กลุมโทโฮไคภายในสมาคมชวยเหลือการปกครองของจักรพรรดิก็กลายเปนกลุมที่ใหญที่สุด ตอนนี้เรามีโอกาสตอกยํ้าการปกครองภายใตสมาคมแหงตะวันออกอยางแทจริง และรักษาบทบาทของนากาโนะในการเมือง[ROOT.GetAdjective]ไปอีกหลายป!"

 JAP_national_defense_brotherhood: "ภราดรภาพปองกันประเทศ"
 JAP_national_defense_brotherhood_desc: "เพื่อหาเงินทุนสําหรับความพยายามในสงคราม โนบูซูเกะ คิชิ และฮิเดกิ โทโจ ไดคิดแผนจัดตั้งโกโกกุ โดชิไค องคกรการเมืองเพื่อประสานยุทธศาสตรการเงินและการริเริ่มทางอุตสาหกรรมของชาติใหดีขึ้น อยางไรก็ตาม การจับคูนี้คอนขางเปนที่ถกเถียง และภราดรภาพปองกันประเทศอาจตองเผชิญปญหามากมาย"

 JAP_supreme_council_for_direction_of_war: "สภาสูงสุดเพื่อการอํานวยการสงคราม"
 JAP_supreme_council_for_direction_of_war_desc: "รัฐบาลของเราตระหนักวาจําเปนตองจัดการประชุมประสานงานระหวางกองบัญชาการใหญจักรวรรดิกับรัฐบาลโดยเร็ว หลังจากเห็นความจําเปนเรงดวนในการเสริมการประสานงานระหวางกิจการรัฐกับการบัญชาการ บางทีสิ่งนี้อาจนําเราไปสูชัยชนะได"

 JAP_found_the_boeitai: "กอตั้งโบเอไต"
 JAP_found_the_boeitai_desc: "เมื่อสงครามปองกันบนแผนดินของเราเองเริ่มเปนจริงมากขึ้นเรื่อย ๆ เราตองจัดตั้งกองปองกันที่สามารถระดมพลไดอยางรวดเร็วเพื่อปกปองหมูเกาะแผนดินแมในกรณีที่ศัตรูรุกลํ้า ซึ่งจะรวมถึงบุคคลที่ตามปกติไมตองรับราชการทหารภายใตระบบเกณฑทหารของญี่ปุนดวย"
 JAP_found_the_boeitai_tt: "ปลดล็อกความสามารถในการเกณฑ§Yกองกําลังอาสาสมัครรบ§!ในหมูเกาะแผนดินแม"

 JAP_advance_one_hundred_million_fireballs: "รุกไปขางหนา หนึ่งรอยลานลูกไฟ"
 JAP_advance_one_hundred_million_fireballs_desc: "สมาคมชวยเหลือการปกครองของจักรพรรดิไดคิดคําขวัญ 'รุกไปขางหนา หนึ่งรอยลานลูกไฟ' เพื่อแสดงความโกรธแคนของประชาชนตอตะวันตกและจิตวิญญาณนักสูที่เพิ่มพูน หากตองเสียสละเพื่อโคนศัตรู ประชาชนของเรายอมพรอมสละชีวิตเพื่อจักรวรรดิ!"
 JAP_advance_one_hundred_million_fireballs_tt: "จิตวิญญาณนี้จะถูกลบออกหากเสถียรภาพลดลงตํ่ากวา §Y40%§!"

 JAP_joshi_teishin_tai: "ระดมพลสตรี[ROOT.GetAdjective]"
 JAP_joshi_teishin_tai_desc: "จะมีการกอตั้งกองอาสาสมัครสตรีเพื่อใหผูหญิงมีโอกาสรับใชจักรวรรดิกอนแตงงาน โดยกําหนดใหพวกเธอทํางานแรงงานในยามสงคราม ดวยวิธีนี้ พลเมืองจํานวนมากขึ้นจะถูกระดมมาชวยอุตสาหกรรมสงครามของเรา"

 JAP_the_metal_collection_order: "คําสั่งรวบรวมโลหะ"
 JAP_the_metal_collection_order_desc: "ประเทศของเรากําลังขาดแคลนวัตถุดิบยุทธศาสตรอยางรวดเร็ว รวมถึงโลหะทั่วไป ดังนั้นเราตองประกาศใชพระราชกฤษฎีกาจักรวรรดิฉบับที่ 667 เพื่อรวบรวมโลหะที่ภาครัฐและเอกชนครอบครอง เพื่อชดเชยสถานการณสงครามที่ทวีความรุนแรงและการขาดแคลนวัตถุดิบ"

 JAP_form_the_dai_nippon_fujinkai: "จัดตั้งได นิปปอน ฟูจินไค"
 JAP_form_the_dai_nippon_fujinkai_desc: "ยามาอุจิ ซาจิโกะ อาสาจัดตั้งสมาคมสตรีมหาญี่ปุน ซึ่งเสนอใหควบรวมสมาคมสตรีชาตินิยมอีกสามแหง โดยมีเปาหมายระดมสตรีเขาสูงานสงคราม เพื่อเสริมขวัญกําลังใจของทหาร ดํารงชีวิตอยางประหยัดเพื่อรักษาทรัพยากรของชาติ เพิ่มระดับการผลิต และสนับสนุนกองทัพ"

 JAP_found_the_air_defense_surveilance_corps: "กอตั้งกองเฝาตรวจปองกันภัยทางอากาศ"
 JAP_found_the_air_defense_surveilance_corps_desc: "เพื่อใหตรวจพบการโจมตีทางอากาศของศัตรูไดแตเนิ่น ๆ เราตองระดมพลเรือนใหประจําการที่จุดสังเกตการณปองกันภัยทางอากาศทั่วประเทศ เพื่อตรวจจับอากาศยานขาศึกตั้งแตระยะแรกและรายงานตอเจาหนาที่ที่เกี่ยวของ ซึ่งจะจัดตั้งขึ้นโดยการตรากฎหมายปองกันภัยทางอากาศ"

 JAP_fund_propaganda_films: "อุดหนุนภาพยนตรโฆษณาชวนเชื่อ"
 JAP_fund_propaganda_films_desc: "กองทัพเรือของเราเสนอใหลงทุนในอุตสาหกรรมภาพยนตรมากขึ้น เพื่อจูงใจใหประชาชนสูตอไป ดวยเหตุนี้จึงไดวาจางหองปฏิบัติการภาพยนตรใหผลิตภาพยนตรแอนิเมชันโฆษณาชวนเชื่อที่เสริมเรื่องเลาของกองทัพเรือจักรวรรดิ และโยนความผิดใหกองทัพบกจักรวรรดิไปในตัว"
 JAP_fund_propaganda_films_tt: "รีเฟรชการตัดสินใจ §Y[ROOT.GetImportOrDomesticFilmIndustry]§!"
 JAP_fund_propaganda_films_2_tt: "สามารถใช §Y[ROOT.GetImportOrDomesticFilmIndustry]§! ไดเพิ่มอีกหนึ่งครั้ง"

 JAP_the_eternal_kingdom: "จักรวรรดินิรันดร"
 JAP_the_eternal_kingdom_desc: "ญี่ปุนเปนชาติที่ปกครองโดยจักรพรรดิผูศักดิ์สิทธิ์ จึงเปนประเทศที่ไดรับการปกปองจากเทพเจา ดวยความชวยเหลือของพวกทาน ประเทศศักดิ์สิทธิ์ของเราเปนอมตะ และจะยืนหยัดอยางแข็งแกรงไปชั่วนิรันดร ขอองคจักรพรรดิทรงพระเจริญ และขอมหาจักรวรรดิญี่ปุนจงเจริญ!"
 JAP_the_eternal_kingdom_tt: "จิตวิญญาณนี้จะถูกลบออกหากความคืบหนาการยอมจํานนถึง §Y50%§!"

 JAP_revere_the_emperor_destroy_the_traitors: "เทิดทูนจักรพรรดิ ทําลายผูทรยศ"
 JAP_revere_the_emperor_destroy_the_traitors_desc: "วันที่เราวางแผนไวมาถึงแลวในที่สุด กองทหารของเราไดยึดโตเกียว และเริ่มเจรจากับองคจักรพรรดิเพื่อโนมนาวใหสนับสนุนขบวนการของเรา แมในตอนแรกพระองคจะทรงมีทาทีลังเล ในที่สุดเราจะสามารถกําจัดความเสื่อมทรามแบบตะวันตกออกจากประเทศ และนําความรุงโรจนของวิถีเกากลับคืนมา!"

 JAP_authorize_aid_to_ethiopia: "อนุมัติความชวยเหลือแกเอธิโอเปย"
 JAP_authorize_aid_to_ethiopia_desc: "กลุมของเรามีการติดตอกับชาว[ETH.GetAdjective]มาหลายป จนสามารถโนมนาวรัฐบาลใหชวยเหลือการทําให[ETH.GetNameDef]ทันสมัยได ตอนนี้พวกเขากําลังถูกมหาอํานาจตะวันตกโจมตี เราตองสงความชวยเหลือใหพวกเขาทันที!"

 JAP_establish_the_gunbatsu: "จัดตั้งกุนบัตสึ"
 JAP_establish_the_gunbatsu_desc: "เพื่อจัดระเบียบรัฐบาลใหม เราตองรื้อโครงสรางเดิมกอนแลวสรางขึ้นใหมตั้งแตฐานราก เพื่อการนี้ ไดเริ่มเตรียมการจัดตั้งกลุมทหารที่จะชวยองคจักรพรรดิปกครองประเทศในฐานะวงในที่ปดลับแลว"

 JAP_grand_army_purge: "การกวาดลางกองทัพครั้งใหญ"
 JAP_grand_army_purge_desc: "เพื่อใหการควบคุมกองทัพของเราเบ็ดเสร็จ เราตองกําจัดผูทรยศที่พยายามสนับสนุนแนวคิดของคณาธิปไตยเมจิ และผูที่จะตอตานและขัดขวางเสนทางสูอํานาจของเรา รวมถึงนายทหารกลุมโทเซฮะผูนารังเกียจที่ตองการควบคุมองคจักรพรรดิเพื่อประโยชนของตน ไมวาดวยวิธีใดก็ตาม กองทัพตองถูกชําระลางจากพวกตัวรายเหลานี้!"
 JAP_grand_army_purge_tt: "§Rกวาดลาง§!§Yสมาชิกกลุมโทเซฮะ§!และนายทหาร§Yเชื้อสายซามูไร§!หลายคน และ§Gเลื่อนยศ§!§Yนายทหารหนุม§!ที่มีสวนรวมในรัฐประหาร ผูบัญชาการคนสําคัญที่ถูก§Rปลด§! ไดแก:\n"

 JAP_remove_the_weeds_from_the_crop: "ถอนวัชพืชออกจากพืชผล"
 JAP_remove_the_weeds_from_the_crop_desc: "ดังที่ซาดาโอะ อารากิ นักทฤษฎีการเมืองคนสําคัญของเรากลาวไวอยางชัดเจน หากไมถอนวัชพืชออก พืชผลที่ดีก็จะพินาศ ในทํานองเดียวกัน เราตองกําจัดวัชพืชในรัฐบาลที่จะขัดขวางความกาวหนาของชาติ และทํารายจิตวิญญาณของเราพรอมกับขายชาติใหนายทุนและสายลับตางชาติ ถึงเวลาถอนวัชพืชแลว!"
 JAP_can_no_longer_manually_promote_civ_government_tt: "เราจะไมสามารถ§Rสนับสนุนดวยตนเอง§!ใหกับ§Yกลุมพลเรือน§!ไดอีกตอไป"

 JAP_sea_the_showa_restoration: "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_key_emperor_showa: "การฟนฟูโชวะ"
 JAP_sea_the_showa_restoration_key_emperor_genka: "การฟนฟูเก็งกะ"
 JAP_sea_the_showa_restoration_desc: "[JAP_sea_the_showa_restoration_desc_key]"
 JAP_sea_the_showa_restoration_emperor_showa_desc: "ในที่สุด ยุคประชาธิปไตยไทโชแบบเสรีนิยมก็สิ้นสุดลง ประเทศจะถูกนําโดยกลุมคนเล็ก ๆ ที่มีคุณสมบัติเหมาะสมซึ่งคํ้าจุนจักรพรรดิผูเขมแข็งอีกครั้ง มีเพียงวิธีนี้เทานั้นที่ประเทศของเราจะไดรับการกอบกูในที่สุด"
 JAP_sea_the_showa_restoration_emperor_genka_desc: "ในที่สุด ยุคประชาธิปไตยไทโชแบบเสรีนิยมก็สิ้นสุดลง ประเทศจะถูกนําโดยกลุมคนเล็ก ๆ ที่มีคุณสมบัติเหมาะสมซึ่งคํ้าจุนจักรพรรดิผูเขมแข็งอีกครั้ง มีเพียงวิธีนี้เทานั้นที่ประเทศของเราจะไดรับการกอบกูในที่สุด"

 JAP_kodoha_the_emperor_cooperated_flag: "§Yจักรพรรดิโชวะ§!ทรงเลือกรวมมือกับกลุมโคโดฮะ"
 JAP_hirohito_has_been_killed_flag: "§Yฮิโรฮิโตะ§!สิ้นพระชนมแลว"
 JAP_emperor_hirohito_has_abdicated_flag: "§Yฮิโรฮิโตะ§!สละราชบัลลังกแลว"
 JAP_emperor_hirohito_under_house_arrest_flag: "§Yฮิโรฮิโตะ§!ถูก§Yกักบริเวณ§!"
 JAP_yasuhito_is_the_current_regent_or_emperor_flag: "§Yยาสุฮิโตะ§!ขึ้นครองราชบัลลังกแลว"
 JAP_nobuhito_is_the_current_regent_or_emperor_flag: "§Yโนบุฮิโตะ§!ขึ้นครองราชบัลลังกแลว"
 JAP_yasuhito_takes_up_the_throne_tt: "§Yยาสุฮิโตะ§!จะเขาแทนที่§Yฮิโรฮิโตะ§!ในอิทธิพลจักรวรรดิ"
 JAP_nobuhito_takes_up_the_throne_tt: "§Yโนบุฮิโตะ§!จะเขาแทนที่§Yฮิโรฮิโตะ§!ในอิทธิพลจักรวรรดิ"

 JAP_an_ode_to_showa_restoration: "บทเพลงแหงการฟนฟูโชวะ"
 JAP_an_ode_to_showa_restoration_desc: "นายทหารเรือมิกามิ ทากุ ประพันธบทเพลงแหงการฟนฟูโชวะ ซึ่งเปนเพลงประจําขบวนการที่งดงามและใชภาพทางธรรมชาติและศาสนาอยางทรงพลัง เมื่อเราไดคืนอํานาจและเชิดชูจักรพรรดิฮิโรฮิโตะขึ้นครองราชย พรอมทั้งลมลางประชาธิปไตยไทโชแบบเสรีนิยมแลว เราควรยกใหเพลงนี้เปนเพลงชาติเพลงที่สอง"

 JAP_ikki_kitas_state_socialist_ideals: "อุดมการณสังคมนิยมรัฐของอิกกิ คิตะ"
 JAP_ikki_kitas_state_socialist_ideals_desc: "อิกกิ คิตะ นักเขียนและนักปรัชญาการเมือง มีอิทธิพลอยางสูงและมีสวนรวมกับขบวนการของเรา เขาวิจารณรูปแบบทุนนิยมหลายครั้ง โดยประกาศตนเปนนักสังคมนิยม เราควรยอมรับแนวคิดของเขาและจัดระเบียบเศรษฐกิจใหมใหใกลเคียงอุดมคตินี้มากขึ้น"

 JAP_oppose_the_zaibatsus: "ตอตานไซบัตสึ"
 JAP_oppose_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของประเทศเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาชานาน เราตองเตือนพวกเขาวาพวกเขายังคงอยูใตพระประสงคขององคจักรพรรดิ และทําใหแนใจวานโยบายทุนนิยมอันละโมบของพวกเขาจะไมสามารถทําใหจิตวิญญาณของชาติเราแปดเปอนไดอีก"
 JAP_oppose_the_zaibatsus_tt: "เมื่อจิตวิญญาณนี้หมดเวลา:\n"

 JAP_give_it_your_all_for_the_emperor: "ทุมเททุกสิ่งเพื่อองคจักรพรรดิ!"
 JAP_give_it_your_all_for_the_emperor_desc: "ชาย[ROOT.GetAdjective]เปนผูขยันขันแข็งที่เลื่อมใสในองคจักรพรรดิผูยิ่งใหญของเราอยางแรงกลา เราควรโฆษณาชวนเชื่อเรื่องนี้ และสงเสริมแรงงานที่ดีและความขยันหมั่นเพียรใหเปนแกนของสังคม[ROOT.GetAdjective]"
 JAP_give_it_your_all_for_the_emperor_tt: "ปลดล็อกการตัดสินใจสราง§Yโรงงานพลเรือน§! §G1§! แหงในรัฐหลักเริ่มตนที่มี§Yโครงสรางพื้นฐาน§!ระดับ §Y4§! ขึ้นไป \n§Rการตัดสินใจนี้ทําไดเพียงครั้งเดียวตอรัฐ§!"

 JAP_revitalize_rural_areas: "ฟนฟูพื้นที่ชนบท"
 JAP_revitalize_rural_areas_desc: "นายทหารหนุมจํานวนมากในขบวนการของเรามาจากครอบครัวยากจนในชนบท เพื่อรักษาแรงสนับสนุนจากพวกเขา เราควรหยุดยั้งการลดลงของประชากรในชนบท และฟนฟูพื้นที่ชนบท"

 JAP_nationalize_western_corporations: "โอนบรรษัทตะวันตกเปนของรัฐ"
 JAP_nationalize_western_corporations_desc: "นายทุนตะวันตกผูละโมบเขามาในประเทศเพื่อขูดรีดประชาชนและทรัพยากรของเรา ทิ้งรอยแผลไวในจิตวิญญาณของชาติที่ตองใชเวลานานกวาจะเยียวยา เราตองโคนบรรษัทเหลานั้นทันทีและโอนโรงงานของพวกเขาเปนของรัฐ แมจะทําใหตะวันตกโกรธเคืองก็ตาม"

 JAP_ally_the_league_of_blood: "ผูกพันธมิตรกับสันนิบาตเลือด"
 JAP_ally_the_league_of_blood_desc: "นิสโช อิโนอุเอะ นักเทศนพุทธหัวรุนแรงแหงนิกายนิจิเร็น กอตั้งสันนิบาตเลือดขึ้นโดยมีเจตนากําจัดนักธุรกิจผูมั่งคั่งและนักการเมืองเสรีนิยม ในสิ่งที่ตอมารูจักกันในชื่ออุบัติการณกองสาบานเลือด เมื่อเขาไดรับการปลอยตัวแลว เราควรติดตอกับเขา เพราะเขามีอุดมการณรวมกับเรา"

 JAP_integrate_the_kenkokutai: "ผนวกเค็งโกกุไค"
 JAP_integrate_the_kenkokutai_desc: "สมาคมรากฐานแหงชาติเปนองคกรตอตานคอมมิวนิสต ที่ไดรับอิทธิพลอยางมากจากลัทธินาซีของโมโตยูกิ ทากาบาตาเกะ ซึ่งแสวงหาการสรางรัฐของประชาชนอยางแทจริงบนพื้นฐานความเปนหนึ่งเดียวระหวางประชาชนกับองคจักรพรรดิ เราควรดึงพวกเขาเขาสูรัฐบาล เนื่องจากเรามีเปาหมายคลายคลึงกัน"

 JAP_contact_the_masterless_samurai: "ติดตอซามูไรไรนาย"
 JAP_contact_the_masterless_samurai_desc: "โรนินไคเปนกลุมการเมืองชาตินิยมสุดโตงตอตานประชาธิปไตย ซึ่งมีสมาชิกรวมกับองคกรคลายกันอยางสมาคมมหาสมุทรมืดและสมาคมมังกรดําจํานวนมาก กอตั้งโดยทานากะ ฮิโรยูกิ ในป 1908 สมาคมลับนี้ปจจุบันมีอิทธิพลตอนักการเมืองฝายขวาสวนใหญของเรา เราตองติดตอพวกเขาและสรางสายสัมพันธระหวางพวกเขากับรัฐบาลของเรา"

 JAP_contact_former_sakurakai_members: "ติดตออดีตสมาชิกซากุระไค"
 JAP_contact_former_sakurakai_members_desc: "สมาคมดอกซากุระเปนสมาคมลับชาตินิยมสุดโตงที่นายทหารหนุมกอตั้งขึ้นในป 1930 และถูกยุบไปตั้งแตอุบัติการณธงจักรวรรดิ พวกเขามีเปาหมายจะจัดระเบียบรัฐใหมตามแนวทางทหารนิยมเบ็ดเสร็จผานรัฐประหาร หากจําเปน บัดนี้เมื่อเราทําสําเร็จแลว เราควรติดตอเชิญอดีตสมาชิกบางคนกลับมารวมรัฐบาลของเรา"

 JAP_the_great_spiritual_evil: "ความชั่วรายทางจิตวิญญาณครั้งใหญ"
 JAP_the_great_spiritual_evil_desc: "การตรากฎหมายรักษาความสงบเปนกาวแรกที่ดีบนเสนทางหยุดยั้งความเสื่อมทรามของคอมมิวนิสตไมใหครอบงําจิตใจประชาชนของเรา แตเรายังมีงานตองทําอีกมาก โคกุไตยังถูกคุกคามจากแนวคิดสังคมนิยมตางชาติ และเราตองใชแนวทางเชิงรุกมากขึ้นเพื่อหยุดไมใหมันทําลายชาติของเรา"

 JAP_strike_down_the_enemy_of_the_people: "โคนศัตรูของประชาชน"
 JAP_strike_down_the_enemy_of_the_people_desc: "ศัตรูตัวฉกาจของประชาชน[ROOT.GetAdjective]คือคอมมิวนิสต และขอเท็จจริงนี้จะไมมีวันเปลี่ยน มันไมอาจอยูรวมกับชาติของเราไดโดยพื้นฐาน ดังนั้นจะมีเพียงฝายเดียวเทานั้นที่ยังยืนอยูไดเมื่อสงครามครั้งสุดทายระหวางอารยธรรมตะวันออกและตะวันตกสิ้นสุดลง"
 JAP_strike_down_the_enemy_of_the_people_tt: "ไดรับเปาหมายสงคราม§Yผนวก§!ตอชาติ§Yคอมมิวนิสตในเอเชีย§!ใดก็ได เปาหมายปจจุบัน:"

 JAP_prepare_for_the_final_war: "เตรียมพรอมสําหรับสงครามครั้งสุดทาย"
 JAP_prepare_for_the_final_war_desc: "เทคโนโลยีเปนตัวกําหนดประวัติศาสตรสงคราม และประวัติศาสตรสงครามเปนตัวกําหนดประวัติศาสตร อีกไมนานจะเกิดสงครามครั้งสุดทาย ซึ่งจะตัดสินกันดวยสงครามทางอากาศ เพราะในอนาคต อากาศยานจะสามารถบินระยะไกลไปโจมตีเมืองหลวงของชาติอื่นไดโดยตรง เพื่อหลีกเลี่ยงสิ่งนี้ เราควรเขาสูระบบเศรษฐกิจแบบสั่งการใหมดวยการสถาปนารัฐปองกันประเทศพรรคเดียว"

 JAP_indoctrination_in_the_military_academy: "ปลูกฝงอุดมการณในโรงเรียนนายรอย"
 JAP_indoctrination_in_the_military_academy_desc: "เปนเรื่องสําคัญที่กลุมหัวรุนแรงในกองทัพจะตองไมหันมาตอตานรัฐบาลเหมือนที่เราเคยทํา เราตองแนใจวาวินัยเขมงวด และทุกคนสาบานความภักดีตอองคจักรพรรดิแทนที่จะภักดีตอกลุมหรือฝายใด!"
 JAP_every_kodoha_member_tt: "§Yผูเห็นใจกลุมโคโดฮะ§!ทุกคน:"

 JAP_sea_supremacy_of_will: "ความเหนือกวาของเจตจํานง"
 JAP_sea_supremacy_of_will_desc: "ยุทโธปกรณที่ทันสมัยที่สุดก็ไรประโยชนหากไมมีผูกลาแกรงมาใชมัน และความกลาแกรงสามารถเปลี่ยนกอนหินธรรมดาที่สุดใหเปนอาวุธที่รายแรงที่สุดได สงครามจะชนะไดดวยจิตวิญญาณแหงความฮึกเหิม ลัทธิแหงการรุกเทานั้น"

 JAP_tennoheika_banzai: "เทนโนเฮกะ บันไซ!"
 JAP_tennoheika_banzai_desc: "การบุกตะลุยบันไซคือสัญลักษณแหงจิตวิญญาณนักสู[ROOT.GetAdjective] ในฐานะสวนหนึ่งของหลักสูตรทางทหาร ทุกคนจะรูจักเสียงโหรองรบนี้ และไดรับการฝกยุทธวิธีบุกดวยดาบปลายปน ดวยสิ่งนี้ ทหารของเราจะไมมีชีวิตอยูอยางเชลยศึก แตจะจากไปอยางรุงโรจน ขอองคจักรพรรดิทรงพระเจริญ!"

 JAP_a_truly_righteous_army: "กองทัพแหงธรรมอยางแทจริง"
 JAP_a_truly_righteous_army_desc: "กองทัพจักรวรรดิ[ROOT.GetAdjective]ไมไดสูเพียงเพื่อการพิชิตหรือความรุงโรจน แตสูเพื่อองคจักรพรรดิ เพื่อชาติ เพื่ออุดมการณ และเพื่อประชาชน ทหารทุกนายตองรูสิ่งเหลานี้ และตระหนักวาทุกสิ่งที่ทําในหนาที่สะทอนถึงองคจักรพรรดิและประชาชนของพระองค และเพื่อองคจักรพรรดิแลว การเสียสละใด ๆ ลวนคุมคา"

 JAP_supremacy_of_the_kempeitai: "อํานาจสูงสุดของเค็มเปไต"
 JAP_supremacy_of_the_kempeitai_desc: "'ทหารแหงกฎหมาย' ของเราจะเขารับบทบาทแทนโทกโกซึ่งภักดีตอระบอบเกามากกวา เค็มเปไตจะไดรับมอบหมายใหดูแลตํารวจแหงชาติ และปรับปรุงขีดความสามารถในการตอตานการกอความไมสงบ การตอตานขาวกรอง และการปราบปรามผูเห็นตาง"

 JAP_sonnou_joui: "ซนโน โจอิ!" # Sonnō Jōi!
 JAP_sonnou_joui_desc: "เราไดยึดมั่นในอุดมคติยุคบากูมัตสึวาดวยจักรพรรดิผูทรงอํานาจอีกครั้ง และพรอมตอตานจักรวรรดินิยมตางชาติ เชนเดียวกับที่รัฐบาลโชกุนโทกูงาวะเคยถูกขับไล เราจะขับไลทุกผูที่ตอตานการปกครองขององคจักรพรรดิผูยิ่งใหญ เทิดทูนจักรพรรดิ ขับไลอนารยชน! ถึงเวลาทวงคืนชะตากรรมแหงสวรรคของเราแลว"
 JAP_sonnou_joui_tt: "จิตวิญญาณนี้จะตออายุเมื่อยึดเมืองหลวงของชาติที่เราอางสิทธิ์ผาน §Yหอกประดับมณีไดโจมตีแลว§! §Rหากยังมีผลอยูในขณะนั้น§!"

 JAP_subdue_the_kwantung_army: "ปราบกองทัพควันตง"
 JAP_subdue_the_kwantung_army_desc: "กองทัพควันตงเปนหนามยอกอกของเรามานาน ไมฟงอํานาจของกลุมทหารของเรา เราตองทําใหพวกเขายอมสยบตอเราโดยสมบูรณ ผานการเลื่อนยศเชิงกลยุทธและการขมขู ในเวลาอันควร ซาดาโอะ อารากิ จะขึ้นเปนผูบัญชาการคนใหมของกองทัพควันตง"
 JAP_subdue_the_kwantung_army_tt: "§Gควบคุม§!§Yกองทัพควันตง§! และทําใหแนใจวาพวกเขาไมสามารถกระทําการเปนอิสระจากความตองการของรัฐบาลเราได"
 JAP_subdue_the_kwantung_army_2_tt: "นายพลบางคนของ§Yกองทัพควันตง§!ถูกลดยศและปลดจากราชการประจําการ:"

 JAP_hasten_the_integration_of_taiwan: "เรงการผนวกรวมไตหวัน"
 JAP_hasten_the_integration_of_taiwan_desc: "ความพยายามผนวกรวมไตหวันของเราเปนไปดวยดี มีอุปสรรคสําคัญเพียงไมกี่ครั้ง ในเวลาอันควร เกาะนี้จะเปนสวนหลักของญี่ปุนเชนเดียวกับริวกิว อยางไรก็ตามเราควรเรงมือ หากตองการหันความสนใจไปยังภูมิภาคอื่นในเร็ว ๆ นี้"

 JAP_integrate_the_government_general: "ผนวกรวมรัฐบาลใหญ"
 JAP_integrate_the_government_general_desc: "อํานาจปกครองตนเองของรัฐบาลใหญแหงโชเซ็นเปนความผิดพลาดครั้งมหันต พวกเขาปลอยใหขบวนการตอตานดํารงอยูนานเกินไป จนทําลายอุตสาหกรรมของเราในพื้นที่ เราตองเขาแทรกแซงโดยตรง และนําดินแดนเกาหลีมาอยูภายใตรัฐบาลกลางโดยตรง"
 JAP_integrate_the_government_general_tt: "ปลดล็อกการตัดสินใจ§Yผนวกรวมรัฐของเกาหลี§!เมื่อมีการยอมรับปกครองสูงพอ"

 JAP_align_the_concordia_association: "ปรับแนวทางสมาคมคองคอรเดีย"
 JAP_align_the_concordia_association_desc: "สมาคมคองคอรเดีย พรรคการเมืองภายใตการควบคุมของเราในแมนจูเรีย ยึดถืออุดมการณลัทธิรวมเอเชียและการสรางรัฐชาติหลายชาติพันธุ รวมถึงการสรางโครงสรางที่คอย ๆ เปลี่ยนการปกครองแมนจูกัวโดยทหารใหเปนการควบคุมโดยพลเรือน เราควรเสนอการรวมสองชาติของเราเขาดวยกันเพื่อความกาวหนาของลัทธิรวมเอเชีย"

 JAP_integrate_the_great_empire_of_manchuria: "ผนวกรวมจักรวรรดิแมนจูเรียอันยิ่งใหญ"
 JAP_integrate_the_great_empire_of_manchuria_desc: "เมื่อสมาคมคองคอรเดียอยูขางเราอยางมั่นคง ผูอี๋และผูภักดีของเขาก็ไมมีอํานาจพอจะขัดขวางเราไมใหยุติอํานาจปกครองตนเองของพวกเขา ในที่สุดก็ถึงเวลารวมสองชาติของเราไวใตจักรพรรดิที่แทจริงเพียงพระองคเดียว!"
 JAP_MAN_accepted_our_proposal_for_integration: "§Y[MAN.GetNameDefCap]§!ยอมรับขอเสนอการรวมชาติของเรา"
 JAP_integrate_the_great_empire_of_manchuria_tt: "ปลดล็อกการตัดสินใจ§Yผนวกรวมรัฐของแมนจูเรีย§!เมื่อมีการยอมรับปกครองสูงพอ"

 JAP_embrace_kokutai: "ยึดมั่นในโคกุไต"
 JAP_embrace_kokutai_desc: "อัตลักษณ แกนแท และลักษณะประจําชาติของเราถูกละเลยและเจือจางโดยรัฐบาลในอดีตมานานเกินไป จนเกือบจะสูญหายไปตามกาลเวลา เราตองทําใหพลเมือง[ROOT.GetAdjective]ทุกคนเขาใจวาเปนหนาที่ของพวกเขาที่จะดํารงตนตามขนบธรรมเนียมของเรา และใชชีวิตสอดคลองกับโคกุไต"

 JAP_empower_the_shogun: "เสริมอํานาจโชกุน"
 JAP_empower_the_shogun_desc: "องคจักรพรรดิตองคงบทบาทเชิงพิธีการมากขึ้น โดยมีคนกลางผูเขมแข็งดําเนินการในพระนามของพระองค ซึ่งยอมทําใหพระดํารัสขององคจักรพรรดิแผไปไดไกลและกวางขวางยิ่งขึ้น"

 JAP_empower_the_emperor: "เสริมอํานาจองคจักรพรรดิ"
 JAP_empower_the_emperor_desc: "ยุคของประมุขแตในนามไดผานพนไปนานแลว องคจักรพรรดิเองตองเขาควบคุมรัฐโดยตรง เมื่อนั้นจักรวรรดิของเราจึงจะสามารถยืนหยัดตอสูกับจักรวรรดินิยมตะวันตกได"

 JAP_a_worthy_succssor_of_meiji: "ผูสืบทอดที่คูควรแหงเมจิ"
 JAP_a_worthy_succssor_of_meiji_desc: "เมื่อมีการดําเนินการที่คลายกับการปฏิรูปเมจิครั้งที่สองแลว องคจักรพรรดิของเราก็กลับมาเปนบุคคลที่ทรงอํานาจที่สุดในประเทศอีกครั้ง บางทีอาจเปนการดีที่จะดําเนินตามอุดมคติของการปฏิวัติแหงชาตินี้ และพยายามทําใหอุตสาหกรรมและวิทยาศาสตรของเราทันสมัย เพื่อนํามาซึ่งยุคฟนฟูศิลปวิทยา[ROOT.GetAdjective]ครั้งใหม"

 JAP_the_art_of_warfare: "ตําราพิชัยสงคราม"
 JAP_the_art_of_warfare_desc: "ประวัติศาสตรเอเชียตะวันออกมีนักยุทธวิธีและนักรบผูยิ่งใหญมากมายที่ถูกจารึกเปนตํานาน แตมีนอยคนที่เทียบไดกับซุนวู ปรมาจารยดานยุทธศาสตร บางทีเขาอาจมีบางสิ่งที่เราเรียนรูได เพื่อใหแผนการของเรารัดกุมยิ่งขึ้นตามกาลเวลา"
 cost_reduced_staff_office_planning: "สามารถใชความสามารถคําสั่ง§Yแผนกองเสนาธิการ§!ไดดวยตนทุนที่ลดลงอยางมาก พรอมยืดระยะเวลาออกไปอีก §G2§! วัน\n"

 JAP_the_imperial_colors: "ธงจักรวรรดิ"
 JAP_the_imperial_colors_desc: "เพื่อเปนเกียรติแกสหายรวมชาติของเราที่พยายามกอรัฐประหารในป 1931 แตลมเหลว เชนเดียวกับที่เราทําในตอนนี้ เราควรกําหนดใหวันที่ 21 ตุลาคมเปนวันหยุดราชการ ซึ่งเราจะชักธงจักรวรรดิและรําลึกถึงการเสียสละที่พวกเขาไดทําในพระนามขององคจักรพรรดิ"

 JAP_utilize_our_polish_friendship: "ใชมิตรภาพกับโปแลนด"
 JAP_utilize_our_polish_friendship_desc: "ชาติของเรามีความสัมพันธอันดีกับชาวโปแลนดมาตั้งแตสมัยจักรวรรดิรัสเซีย เมื่อเรารับชาวโปแลนดที่ถูกเนรเทศไปไซบีเรียเขามา นับแตนั้นเราไดแลกเปลี่ยนขาวกรองเกี่ยวกับ[SOV.GetNameDef]และมีความเปนปรปกษรวมกันตอชาตินั้น เราควรทํากติกาสัญญาปองกันรวมกับพวกเขาอยางเปนทางการ เพื่อใหทั้งสองฝายรูสึกปลอดภัยจากหมีขาว"

 JAP_return_to_sakoku_ron: "หวนคืนสูซาโกกุรง"
 JAP_return_to_sakoku_ron_desc: "ชาติของเรายุติการปดประเทศก็เพราะพลเรือจัตวาเพรรีและการทูตเรือปนของ[USA.GetAdjective]เทานั้น เมื่ออิทธิพลภายนอกกําลังทําใหจิตวิญญาณของชาติเราเสื่อมทรามและพังทลาย เราควรเริ่มยุคปดประเทศครั้งที่สอง"
 JAP_japanese_supremacy_faction: "วงอิทธิพลญี่ปุน"
 JAP_eth_is_invited_to_faction_tt: "§Y[ETH.GetNameDefCap]§!ไดรับเชิญเขารวมฝายของเรา"

 JAP_the_enemy_of_our_enemy: "ศัตรูของศัตรู"
 JAP_the_enemy_of_our_enemy_desc: "ภัยคุกคาม[SOV.GetSovietThreatName]ตอพรมแดนทางเหนือของเราตองไดรับการจัดการ เราตองเริ่มเตรียมทําสงครามกับ[SOV.GetNameDef] วิธีที่ดีที่สุดคือการกระชับความสัมพันธกับ[GER.GetNameDef] ซึ่งรายงานของเราชี้วากําลังเตรียมทําสงครามกับ[SOV.GetNameDef]"

 JAP_societal_bushido: "บูชิโดในสังคม"
 JAP_societal_bushido_desc: "นายพลซาดาโอะ อารากิ ไดเชื่อมโยงประมวลบูชิโดโบราณของซามูไรเขากับแนวคิดที่คลายลัทธิฟาสซิสตยุโรป เพื่อสรางรากฐานทางปรัชญาของอุดมการณของเขา ซึ่งเชื่อมโยงองคจักรพรรดิ ประชาชน แผนดิน และศีลธรรมเขาเปนหนึ่งเดียวที่ไมอาจแบงแยก ดวยเหตุนี้เราควรสงเสริมประมวลบูชิโดใหเปนสิ่งที่พลเมืองดีทุกคนตองยึดถือเสมอ"

 JAP_politicize_the_education_system: "ทําใหระบบการศึกษาเปนเรื่องการเมือง"
 JAP_politicize_the_education_system_desc: "กองทัพควบคุมระบบการศึกษาของชาติมานานแลว แตยังทําไมมากพอที่จะปลุกเยาวชนใหหัวรุนแรงจนเขารวมอุดมการณของเราอยางเต็มที่ เราควรลงทุนอยางหนักในการปลูกฝงทางการเมือง และเพิ่มงบประมาณใหระบบการศึกษา"

 JAP_the_spirit_of_the_imperial_nation: "จิตวิญญาณแหงชาติจักรวรรดิ"
 JAP_the_spirit_of_the_imperial_nation_desc: "เพื่อชี้นําความสนใจของประชาชนไปสูสิ่งที่ถูกตอง และใหแนใจวาพวกเขาจะสนับสนุนการไลตามชะตากรรมของ[ROOT.GetAdjective]อยางไมหวั่นไหว เราตองสงเสริมโคกุไตในทุกศาลเจา และประดิษฐาน [ROOT.GetLeader] ไวในศาลเจาแหงหนึ่งในโตเกียว"

 JAP_propagandize_the_nihon_shoki: "โฆษณาเผยแพรนิฮงโชกิ"
 JAP_propagandize_the_nihon_shoki_desc: "พงศาวดารญี่ปุนเปนสวนสําคัญในการอธิบายประวัติศาสตรของเรา และบันทึกรายละเอียดตํานานการกอตั้งชาติ เราตองทําใหแนใจวามีการสอนอยางใกลชิดในโรงเรียน และเด็ก ๆ ไดเรียนรูความเชื่อมโยงระหวางการพิชิตของจิมมุในครั้งนั้นกับชะตากรรมในอนาคตของเรา"

 JAP_the_yamato_spirit: "จิตวิญญาณยามาโตะ"
 JAP_the_yamato_spirit_desc: "หัวใจและจิตใจของประชาชน[ROOT.GetAdjective]เปนหนึ่งเดียวกัน เชื่อมโยงดวยวิญญาณแหงยามาโตะที่แผซานอยูในสังคมของเรา เราควรทําใหพลเมืองทุกคนรูถึงความรุงโรจนในอดีต และรูวาตองทําสิ่งใดเพื่อหวนคืนสูวิถีชีวิตดั้งเดิมของเรา"

 JAP_children_of_the_sun: "บุตรแหงดวงอาทิตย"
 JAP_children_of_the_sun_desc: "ไมเพียงแตราชวงศของเราเทานั้น แตประชาชน[ROOT.GetAdjective]เองก็เปนบุตรแหงดวงอาทิตย เทพีอามาเทราซุผูยิ่งใหญเคยประทานแผนดินนี้แกเรา และเราตองสํานึกในพระคุณนั้น ถึงเวลาแลวที่เราจะตอบแทนสิ่งที่พระนางประทานให!"

 JAP_the_footsteps_of_jimmu: "รอยเทาของจิมมุ"
 JAP_the_footsteps_of_jimmu_desc: "จักรพรรดิจิมมุ ผูกอตั้งในตํานานของเรา ไดยกทัพจากฮิวงะใกลทะเลในเซโตะ ยึดยามาโตะ และสถาปนาที่นั่นเปนศูนยกลางอํานาจ พระองคเริ่มการเสด็จทัพบูรพาครั้งใหญที่ขยายดินแดนของเราอยางมาก โดยมียาตะงาราสุ เทพอีกา เปนผูนําทาง เชนเดียวกับที่นักรบศักดิ์สิทธิ์ผูนี้เคยพิชิตในนามของเทพเจา เราก็จะทําเชนกัน"

 JAP_yatagarasus_guidance: "การนําทางของยาตะงาราสุ"
 JAP_yatagarasus_guidance_desc: "ยาตะงาราสุ เทพอีกาสามขา ไดนําทางจิมมุในการพิชิตยามาโตะและนาระครั้งยิ่งใหญ ในฐานะการแทรกแซงของเทพเจาในกิจการมนุษย เมื่อเราเองก็ตองการการนําทางอยางยิ่ง เราควรตั้งชื่อระบบใหมของเราตามเทพแหงการนําทางองคนี้"

 JAP_the_jeweled_spear_has_struck: "หอกประดับมณีไดโจมตีแลว"
 JAP_the_jeweled_spear_has_struck_desc: "หอกประดับมณีแหงสวรรคเคยถูกใชโดยเทพผูสรางอิซานางิและอิซานามิเพื่อยกแผนดินแรกขึ้นจากทะเล เชนเดียวกับที่พวกทานเคยใชหอกที่ปกลงเพื่อครอบครองแผนดินใหม เราก็จะทําเชนกัน ถึงเวลาแลวที่จะไดเห็นวาหอกแหงสวรรคจะโจมตี ณ ที่ใดอีกครั้ง"
 JAP_the_jeweled_spear_has_struck_tt: "ปลดล็อกการตัดสินใจอางสิทธิ์ในรัฐของ§Yเอเชีย§! และไดรับ§Yเปาหมายสงคราม§!ตอเจาของรัฐเหลานั้น เราสามารถเลือกเปาหมายอางสิทธิ์ไดครั้งละหนึ่งประเทศ หลังจากนั้นตองยึดครองรัฐที่อางสิทธิ์ไวทั้งหมดกอนจึงจะอางสิทธิ์เพิ่มได"

 JAP_hakko_ichiu: "ฮักโก อิจิอุ" # Hakkō Ichiu
 JAP_hakko_ichiu_desc: "ทั้งโลกตองรวมเปนหนึ่งใตหลังคาเดียวกัน! เรามีสิทธิ์อันศักดิ์สิทธิ์ที่จะทําเชนนั้นภายใตการปกครองของเรา ดังที่บัญญัติไวในนิฮงโชกิ เมื่อครั้งขึ้นครองราชย จักรพรรดิจิมมุประกาศวา 'เราจะปกคลุมแปดทิศและทําใหเปนที่พํานักของเรา' ในที่สุดก็ถึงเวลาทําใหพระประสงคของพระองคเปนจริง!"
 JAP_hakko_ichiu_tt: "ปลดล็อกการตัดสินใจผนวกรวมรัฐของ§Yเอเชีย§!ที่§Yเปนของ§!เรา หรือที่เรา§Yควบคุมและอางสิทธิ์§!อยู"

 JAP_embodying_empress_jinguu: "สืบสานจักรพรรดินีจิงกู" # Embodying Empress Jingū
 JAP_embodying_empress_jinguu_desc: "เชนเดียวกับที่พระสวามีของจักรพรรดินีนางาโกะถูกลอบสังหาร พระสวามีของจักรพรรดินีจิงกูก็เชนกัน พระนางทรงออกทัพแกแคน แลวหันความสนใจไปยังดินแดนแหงพันธสัญญา หลังสามปพระนางทรงพิชิตศัตรูและเสด็จกลับอยางผูมีชัย เราควรสืบสานตํานานนี้ และดําเนินการใหถึงที่สุด"

 JAP_to_reach_princess_kaguya: "ไปใหถึงเจาหญิงคางุยะ"
 JAP_to_reach_princess_kaguya_desc: "ในตํานานคนตัดไผ คางุยะฮิเมะ เจาหญิงจากดวงจันทร ถูกพบเปนทารกอยูในลําตนไผที่เรืองแสง ในตอนจบของเรื่อง คางุยะฮิเมะเปดเผยวาตนมาจากสวรรคและกลับคืนสูดวงจันทร เมื่อเรามีเทคโนโลยีพรอมแลว เราตองทําทุกวิถีทางเพื่อไปใหถึงเธออีกครั้ง"

 JAP_to_rival_zheng_yi_sao: "เทียบชั้นเจิ้งอีเสา"
 JAP_to_rival_zheng_yi_sao_desc: "เจิ้งอีเสาเปนผูนําโจรสลัดจีนในตํานานที่เคลื่อนไหวในทะเลจีนใต และเปนโจรสลัดหญิงที่ประสบความสําเร็จที่สุดในประวัติศาสตร เราตองเทียบชั้นและกาวขามตํานานนี้ไปใหได ในพระนามของจักรพรรดินีนางาโกะผูยิ่งใหญ!"

 JAP_amaterasus_aramitama: "อาวุธแหงอารามิตามะของอามาเทราซุ"
 JAP_amaterasus_aramitama_desc: "หนึ่งในเทพเจาที่ชวยจิงกูในการทัพตอราชอาณาจักรเกาหลีคือวิญญาณดุรายของอามาเทราซุ สึกิซากากิ อิซุ โนะ มิตามะ อามาซาการุ มูกัตสึฮิเมะ โนะ มิโกโตะ วิญญาณนี้ครอบครองพลังอันยิ่งใหญของเทพีแหงดวงอาทิตย ซึ่งเราควรพยายามนํามาใชเพื่อตัวเราเอง!"

 JAP_okadas_military_purge_speech: "สุนทรพจนกวาดลางกองทัพของโอกาดะ"
 JAP_okadas_military_purge_speech_desc: "ครั้งนี้ฝายทหารทําเกินไปแลว ราวกับการลอบสังหารนับไมถวนและความพยายามโคนรัฐบาลโดยกลุมสุดโตงยังไมพอ ตอนนี้พวกเขายังตองการใชเหตุการณลาสุดเพื่อเสริมอํานาจของตนและแยงชิงการควบคุมชาติไปจากประชาชน ถึงเวลาแลวที่โอกาดะจะแสดงใหชัดเจนวาใครปกครองรัฐ และลงมือตอตานอํานาจที่เพิ่มขึ้นของฝายทหาร"
 JAP_okadas_military_purge_speech_tt: "§Rสิ่งนี้จะนําไปสูการบานปลายของความขัดแยงระหวางรัฐบาลกับฝายทหาร ซึ่งจะคลี่คลายไดดวยการยกเลิกกฎหมายรักษาความสงบเทานั้น!§!"

 JAP_ministry_of_commerce_and_industry: "กระทรวงพาณิชยและอุตสาหกรรม"
 JAP_ministry_of_commerce_and_industry_desc: "เพื่อใหเห็นภาพรวมทางการเงินไดดีขึ้น เราควรขยายกระทรวงพาณิชยและอุตสาหกรรม และทําใหแนใจวาพวกเขามีทรัพยากรทั้งหมดที่จําเปนตอการปฏิบัติหนาที่อยางเหมาะสม"

 JAP_continue_takahashi_korekiyos_policies: "สานตอนโยบายของทากาฮาชิ โคเรกิโยะ"
 JAP_continue_takahashi_korekiyos_policies_desc: "ไวเคานตทากาฮาชิ โคเรกิโยะ กอบกูชาติของเราจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ และทําใหผลกระทบของมันไมสงผลตอเศรษฐกิจของเราอีก แตเพื่อการนี้ เขาไดตัดงบประมาณการเงินของกองทัพ ซึ่งพิสูจนแลววาเปนการกระทําที่ไมเปนที่นิยมสําหรับหลายฝาย เราตองเดินตามรอยเทาของเขา!"

 JAP_increase_armament_spending: "เพิ่มงบประมาณดานอาวุธ"
 JAP_increase_armament_spending_desc: "ไวเคานตทากาฮาชิ โคเรกิโยะ อาจทําประโยชนตอเศรษฐกิจของเรามาก แตก็ทิ้งใหเราไมพรอมรับสงครามที่จะมาถึง เราตองแกไขเรื่องนี้ และกลับมาลงทุนในอุตสาหกรรมทหารที่กําลังเติบโตของเรา"

 JAP_approach_mitsui: "เขาหามิตซุย"
 JAP_approach_mitsui_desc: "ไซบัตสึมิตซุยมีตนกําเนิดยอนไปถึงยุคเอโดะ และปจจุบันเปนหนึ่งในบรรษัทอุตสาหกรรมที่ใหญที่สุดในประเทศ เราตองไดรับการสนับสนุนจากพวกเขาตอรัฐบาล เพื่อใหใชบริการของพวกเขาไดอยางมีประสิทธิภาพสูงสุด"
 JAP_reduce_zaibatsu_focus_cost_tt: "การดําเนิน §Y$JAP_sea_guide_the_zaibatsus$§! หรือ §Y$JAP_democratic_work_with_the_zaibatsus$§! จะลดเวลาของแผนยุทธศาสตรนี้เหลือ §G35§! วัน"

 JAP_approach_mitsubishi: "เขาหามิตซูบิชิ"
 JAP_approach_mitsubishi_desc: "บริษัทมิตซูบิชิกอตั้งขึ้นครั้งแรกเปนบริษัทเดินเรือในชวงตนยุคเมจิ หลังขยายกิจการสูภาคอุตสาหกรรมสวนใหญ ปจจุบันพวกเขาควบคุมอุตสาหกรรมทหารสวนใหญในประเทศ เราตองไดรับการสนับสนุนจากพวกเขาตอรัฐบาล เพื่อใหใชสิ่งอํานวยความสะดวกของพวกเขาไดอยางมีประสิทธิภาพสูงสุด"

 JAP_approach_sumitomo: "เขาหาซูมิโตโม"
 JAP_approach_sumitomo_desc: "ไซบัตสึซูมิโตโมมีรากเหงามาจากรานหนังสือในเกียวโต แตการถลุงทองแดงทําใหบริษัทมีชื่อเสียง ปจจุบันพวกเขาเชี่ยวชาญดานการขุดแรและการธนาคาร เราตองไดรับการสนับสนุนจากพวกเขาตอรัฐบาล เพื่อใหใชสินทรัพยของพวกเขาไดอยางมีประสิทธิภาพสูงสุด"

 JAP_approach_yasuda: "เขาหายาซูดะ"
 JAP_approach_yasuda_desc: "ไซบัตสึยาซูดะมีตนกําเนิดในยุคเมจิ และทําธุรกิจธนาคารมาตั้งแตกอตั้ง ในฐานะองคกรหลักของธนาคารยาซูดะ ปจจุบันพวกเขาเชื่อมโยงกับภาคการเงินทั้งหมดในประเทศอยางแยกไมออก เราตองไดรับการสนับสนุนจากพวกเขาตอรัฐบาล เพื่อใหใชความมั่งคั่งมหาศาลของพวกเขาไดอยางมีประสิทธิภาพสูงสุด"

 JAP_fund_the_riken_institute: "อุดหนุนสถาบัน RIKEN"
 JAP_fund_the_riken_institute_desc: "สถาบันวิจัยฟสิกสและเคมีกอตั้งขึ้นในป 1917 ในยุคไทโช ปจจุบันอยูภายใตการควบคุมของริเก็นคอนเซิรน ไซบัตสึที่ควบคุมโรงงานราว 121 แหงและบริษัท 63 แหง ภายใตไวเคานตมาซาโตชิ โอโคจิ เราควรพยายามขยายสถาบันตอไป เพื่อดําเนินโครงการวิจัยปรมาณูของเราที่นั่น"
 JAP_fund_the_riken_institute_tt: "หาก $JAP_zaibatsu_faction$ อยูในระดับ $JAP_imperial_influence_tier_3$ ขึ้นไป จะไดรับ§Yศูนยวิจัยนิวเคลียร§! §G1§! แหงดวย"

 JAP_build_the_nishotaki_and_miyanaka_dams: "สรางเขื่อนนิโชตากิและมิยานากะ"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc: "โรงงานและสิ่งอํานวยความสะดวกใหมในประเทศตองการไฟฟามากกวาที่เราผลิตไดในราคาที่เหมาะสมในปจจุบัน เราตองสรางเขื่อนไฟฟาพลังนํ้าใหม เพื่อผลิตไฟฟาโดยไมตองเผาถานหินสํารองอันมีคาของเรา"

 JAP_establish_synthetic_fuel_joint_venture: "จัดตั้งกิจการรวมคาเชื้อเพลิงสังเคราะห"
 JAP_establish_synthetic_fuel_joint_venture_desc: "ตั้งแตทศวรรษ 1920 เราไดรวมทุนกับเยอรมนีเพื่อจัดตั้งศูนยผลิตทรัพยากรสังเคราะหจากถานหินและนํ้ามัน เราควรเปดมุมมองใหกวางขึ้น และมุงเพิ่มความรวมมือนี้กับมหาอํานาจตะวันตก เพื่อใหเราพึ่งพาตนเองไดในที่สุด"
 JAP_establish_synthetic_fuel_joint_venture_tt: "หากประเทศ§Yมหาอํานาจตะวันตก§!ได§Yรับประกัน§!หรือมีความเห็นตอ §Y[ROOT.GetNameDef]§! อยางนอย §Y75§! [ROOT.GetNameDef]จะไดรับโบนัสเทคโนโลยี $cat_synth_oil$ เพิ่มเติม และ §Y$synthetic_refinery$§!"

 JAP_establish_nippon_hassoden: "จัดตั้งนิปปอน ฮัสโซเด็น"
 JAP_establish_nippon_hassoden_desc: "เพื่อเพิ่มการควบคุมของรัฐบาลตอการจายไฟฟาของชาติ และเพื่อใหสามารถควบคุมการใชงานได เราควรจัดตั้งบริษัทผลิตและสงไฟฟาแหงญี่ปุนเพื่อกํากับอุตสาหกรรมไฟฟา ซึ่งทําไดงาย ๆ ดวยการควบรวมบริษัทไฟฟาที่มีอยู"

 JAP_new_industrial_city_development_policy: "นโยบายพัฒนาเมืองอุตสาหกรรมใหม"
 JAP_new_industrial_city_development_policy_desc: "คณะกรรมการวางแผนที่ดินแหงชาติไดพัฒนาแผนจัดตั้งเมืองใหมโดยมีศูนยกลางอยูที่สิ่งอํานวยความสะดวกดานเสบียงทหารของกองทัพบกและกองทัพเรือ โรงงานอาวุธยุทธภัณฑและสิ่งอํานวยความสะดวกที่เกี่ยวของ รวมถึงการวางผังเมืองขนาดใหญเพื่อสนับสนุนอุตสาหกรรมเหลานี้ เราควรลงทุนในโครงการนี้"

 JAP_establish_housing_corporation: "จัดตั้งบรรษัทเคหะ"
 JAP_establish_housing_corporation_desc: "เพื่อจัดหาที่อยูอาศัยทั่วประเทศใหทุกคนที่ตองการ เราตองจัดตั้งบรรษัทโดยมีเปาหมายสรางหนวยที่อยูอาศัยหลายหมื่นหนวยสําหรับคนงาน และที่พักใหเชาจํานวนมากสําหรับชางไมและพลเมือง"

 JAP_central_agricultural_association: "สมาคมเกษตรกรรมกลาง"
 JAP_central_agricultural_association_desc: "องคกรเกษตรกรรมที่กระจัดกระจายจํานวนมากของเราจําเปนตองรวมเปนหนึ่งเดียว หากเราตองการแกปญหาคอขวดในหวงโซอุปทาน เพื่อใหแนใจวาจะสําเร็จ เราควรมอบหมายใหเซ็งโงกุ โคทาโร จัดตั้งสมาคมเกษตรกรรมกลางตามที่ระบุไวในกฎหมายองคกรเกษตรกรรม"

 JAP_the_five_great_cities: "หามหานคร"
 JAP_the_five_great_cities_desc: "เมืองเกียวโต โอซากะ โยโกฮามะ โคเบะ และนาโงยะ ไดรับการกําหนดสถานะพิเศษที่ใหบทบัญญัติพิเศษตาง ๆ ซึ่งเมืองทั่วไปไมมี เพื่อชวยในกระบวนการพัฒนาอุตสาหกรรมและการกลายเปนเมือง โดยมีเปาหมายสูงสุดคือการเปนเมืองพิเศษที่เปนอิสระจากจังหวัด เราควรเพิ่มการลงทุนในโครงการนี้"

 JAP_resource_security: "ความมั่นคงทางทรัพยากร"
 JAP_resource_security_desc: "เปาหมายอันทะเยอทะยานในการพึ่งพาตนเองอยางสมบูรณของเราออกดอกออกผลแลวในที่สุด! ชาติของเราอุดมไปดวยทรัพยากรธรรมชาติ ซึ่งจะยิ่งทําใหเราแข็งแกรงขึ้น จนไมมีใครหยุดเราได!"

 JAP_ship_management_committee: "คณะกรรมการบริหารการเดินเรือ"
 JAP_ship_management_committee_desc: "ดวยการใหสัตยาบันคําสั่งควบคุมการเดินเรือยามสงครามเมื่อไมนานมานี้ เราสามารถอนุมัติการจัดตั้งบรรษัทพิเศษที่รับผิดชอบการบริหารอุตสาหกรรมเดินเรือ เพื่อควบคุมและรวมมือในการดําเนินนโยบายแหงชาติดานการเดินเรือ เพื่อใชศักยภาพของอุตสาหกรรมเดินเรือในยามสงครามอยางเต็มที่"
 JAP_convoy_production_cost_tt: "[JAPGetConvoyProductionCostBonusText]"
 JAP_ship_management_committee_tt: "§Y$convoy_1$§!:\n   £production_cost ตนทุนการผลิต: §G-15.00%§!"

 JAP_danganressha: "แผนรถไฟหัวกระสุน" # Danganressha
 JAP_danganressha_desc: "กระทรวงการรถไฟไดอนุมัติแผนที่เรียกวาดังกันเรสชะ ซึ่งจะวางรางรถไฟขนาดกวางขางรางขนาดมาตรฐาน เพื่อใหรถไฟขนสงวิ่งไดเร็วดั่งกระสุน ยาซูจิโร ชิมะ ผูบุกเบิกดานรถไฟ และบุตรชายของเขาไดสัญญาวาจะชวยพัฒนาแผนนี้"

 JAP_ministry_of_colonial_affairs: "กระทรวงกิจการอาณานิคม"
 JAP_ministry_of_colonial_affairs_desc: "กระทรวงนี้เริ่มตนจากสํานักงานบุกเบิกฮกไกโด และไดพัฒนามาไกลแลว เราตองขยายความรับผิดชอบของกระทรวงเพื่อใหสามารถบริหารนันโย โชเซ็น คาราฟูโตะ คันโต และไตหวันไดอยางเหมาะสม ขอใหวันหนึ่งดินแดนเหลานี้ถูกทุกคนเรียกวาญี่ปุน!"

 JAP_manchuria_five_year_plan: "แผนพัฒนาอุตสาหกรรมแมนจูเรียหาป"
 JAP_manchuria_five_year_plan_desc: "แมหมูเกาะของเราจะขาดแคลนที่ดินใชประโยชนได แตดินแดนบนแผนดินใหญของเราไมเปนเชนนั้น สิ่งใดที่เราสรางเองไมได เราก็สรางบนแผนดินใหญแทนได เราจะเริ่มโครงการพัฒนาอุตสาหกรรมขนาดใหญให[MAN.GetNameDef]"

 JAP_establish_manchuria_airplane_manufacturing_company: "จัดตั้งบริษัทอากาศยานแมนจูเรีย"
 JAP_establish_manchuria_airplane_manufacturing_company_desc: "เพื่อผลิตยุทโธปกรณใหใกลแหลงทรัพยากรที่ใชผลิตมากขึ้น บริษัทอากาศยานนากาจิมะเสนอจะเปดบริษัทลูกภายใตการกํากับของเราในแมนจูเรีย ซึ่งปจจุบันพวกเขาเรียกวามันชู เราตองสนับสนุนแนวคิดอันยอดเยี่ยมนี้"

 JAP_eastern_road_and_steel_expansion: "ขยายถนนและเหล็กกลาภาคตะวันออก"
 JAP_eastern_road_and_steel_expansion_desc: "เพื่ออํานวยความสะดวกในการขยายเหมืองและอุตสาหกรรมของเราในแมนจูเรีย เราควรกอตั้งบรรษัทพัฒนาถนนภาคตะวันออก เมื่อสําเร็จแลว จะมีการตั้งสถานีเหมืองแรในเถี่ยฉางจื่อ อูเตาเจียง และสือเหรินโกว และตั้งสํานักงานเหมืองแรเหล็กในตาลี่จื่อและชีเตาโกว"

 JAP_sea_promote_japanese_settlement: "สงเสริมการตั้งถิ่นฐานของชาวญี่ปุน"
 JAP_sea_promote_japanese_settlement_desc: "ดวยการใหประชาชนของเราไปตั้งถิ่นฐานในแมนจูเรีย เราสามารถเพิ่มแรงงานและสรางทําเลที่เหมาะสมสําหรับโรงงานไดมากขึ้น ผูที่ยายไปยังที่นั่นยังสามารถผลิตสินคาเกษตรสงกลับมายังหมูเกาะแผนดินแมไดดวย"

 JAP_construct_the_sui_ho_dam: "สรางเขื่อนซุยโฮ"
 JAP_construct_the_sui_ho_dam_desc: "เพื่อใหมีพลังงานเพียงพอสําหรับอุตสาหกรรมของเราในมณฑลเหลียวหนิงของแมนจูเรีย เราควรสรางเขื่อนแรงโนมถวงซุยโฮ วิศวกรของเราไดรางแผนสําหรับเขื่อนที่จะใหญที่สุดในเอเชีย โดยมีแผนวาจางบริษัทไฟฟาพลังนํ้ายาลูและบริษัทรถไฟพย็องบุกเพื่อดําเนินการ"

 JAP_the_shuilikeng_power_plant: "โรงไฟฟาสุยหลีเคิง"
 JAP_the_shuilikeng_power_plant_desc: "การพัฒนาไตหวันของเราดําเนินไปตามแผน แตปญหาการผลิตไฟฟากลับเรงดวนขึ้นเรื่อย ๆ ซึ่งไดบรรเทาลงบางสวนดวยการสรางโรงไฟฟาพลังนํ้า เชน โรงไฟฟาเหมินไผทาน เราควรเรียนรูจากวิศวกรรุนกอน และสรางเขื่อนและสถานีเหลานี้ทั่วเกาะตอไป"

 JAP_develop_the_south_seas_mandate: "พัฒนาดินแดนในอาณัติทะเลใต"
 JAP_develop_the_south_seas_mandate_desc: "ดินแดนในอาณัติของญี่ปุนเพื่อการปกครองหมูเกาะทะเลใต ซึ่งสันนิบาตชาติมอบใหเราหลังมหาสงคราม เปนดินแดนกวางใหญที่สวนใหญยังไมไดรับการสํารวจ และพรอมใหใชประโยชน หากเราพัฒนาภูมิภาคเหลานี้และทําใหเชี่ยวชาญในการสงความมั่งคั่งใหประชาชนของเรา รัฐบาลนันโยที่ปกครองภูมิภาคนี้อาจถึงขั้นโนมนาวคนทองถิ่นใหผนวกรวมเขากับรัฐของเราอยางแทจริงได"

 JAP_build_up_korean_industries: "สรางอุตสาหกรรมเกาหลี"
 JAP_build_up_korean_industries_desc: "เราควรทุมเทความพยายามสรางฐานอุตสาหกรรมในคาบสมุทรเกาหลี โดยเฉพาะดานอุตสาหกรรมหนักและอาวุธยุทธภัณฑ เพราะสิ่งเหลานี้จะมีคาอยางยิ่งในสงครามใด ๆ ที่จะเกิดขึ้นกับจีนหรือชาติตะวันตก นโยบายนี้เดิมเสนอโดยคาซูชิเงะ อูงากิ และเราควรเดินหนาบนเสนทางนี้ตอไป"

 JAP_increase_agricultural_export: "เพิ่มการสงออกสินคาเกษตร"
 JAP_increase_agricultural_export_desc: "นับตั้งแตเราไดดินแดนนี้มา เกาหลีทําหนาที่เปนอูขาวอูนํ้าของจักรวรรดิ เราควรเพิ่มความพยายามในการขยายภาคนี้ เพื่อใหอาหารจากที่นั่นสงออกไปทั่วทั้งอาณาจักรได"

 JAP_hydroelectric_dams_in_korea: "เขื่อนไฟฟาพลังนํ้า"
 JAP_hydroelectric_dams_in_korea_desc: "การพัฒนาอุตสาหกรรมและการกระจายไฟฟาในเกาหลีจะหยุดชะงักลงทันทีหากเราไมเขาแทรกแซงและแกไขสถานการณ เราควรสรางเขื่อนแรงโนมถวงใหมทั่วภูมิภาค และวิศวกรของบริษัทไฟฟาพลังนํ้าแมนํ้าฮันก็ไดรางแผนอยางละเอียดสําหรับการสรางเขื่อนที่พวกเขาเรียกวาเขื่อนฮวาช็อนแลว"

 JAP_prepare_for_peninsular_warfare: "เตรียมพรอมสําหรับสงครามบนคาบสมุทร"
 JAP_prepare_for_peninsular_warfare_desc: "ในกรณีที่เราตองทําสงครามและอยูในฐานะถอยรน คาบสมุทรเกาหลีนาจะเปนที่มั่นสุดทายของเราบนแผนทวีป เราควรเตรียมการเพื่อใหสามารถยึดภูมิภาคนี้ไวได หากสถานการณเลวรายที่สุดเชนนั้นเกิดขึ้น"

 JAP_establish_the_japanese_korean_army: "ขยายกองทัพญี่ปุนประจําเกาหลี"
 JAP_establish_the_japanese_korean_army_desc: "นับตั้งแตป 1904 โชเซ็นกุงทําหนาที่เปนกองรักษาการณในเกาหลี แตแทบไมไดออกรบเลยนอกจากการบุกแมนจูเรียในป 1931 เราควรยกเลิกสนธิสัญญาที่ผูกมัดรัฐบาลใหญเกาหลีของเรา เพื่อขยายกองทัพนี้ใหใชเปนกําลังรบไดอยางแทจริง"

 JAP_increase_crop_yields: "เพิ่มผลผลิตพืชผล"
 JAP_increase_crop_yields_desc: "หมูเกาะทะเลใตมีมะพราวจํานวนมาก ซึ่งมีศักยภาพเปนพืชเศรษฐกิจที่ทํากําไรงาม เราควรสงเสริมการผูกขาดที่ผสานการริเริ่มของเอกชนเขากับทุนของรัฐบาล ดวยการวาจางนันโย โคฮัตสึ ดวย จะสามารถปลูกไรออย สรางโรงงานนํ้าตาล ปลูกกลวย สับปะรด เผือก มันสําปะหลัง กาแฟ และพืชผลเขตรอนอื่น ๆ ทําใหหมูเกาะมีผลผลิตเทียบเทาไตหวัน"

 JAP_improve_agricultural_output: "ปรับปรุงผลผลิตทางการเกษตร"
 JAP_improve_agricultural_output_desc: "การผลิตทางอุตสาหกรรมในไตหวันกําลังจะแซงหนาการผลิตทางการเกษตรบนเกาะ แมสิ่งนี้จะเปนประโยชนตออุตสาหกรรมของเรา แตก็ยังหางไกลจากอุดมคติ เพราะสินคาเกษตรสงออกจากไตหวันมีความสําคัญอยางยิ่งตอการทําใหประชาชนพอใจและสงเสบียงใหกองทัพ เราตองแกไขเรื่องนี้ทันที!"

 JAP_upgrade_the_oriental_development_company: "ขยายบริษัทพัฒนาตะวันออก"
 JAP_upgrade_the_oriental_development_company_desc: "ปจจุบันบริษัทพัฒนาตะวันออกมีสาขาที่ดําเนินงานอยูเกาแหง ครอบคลุมเกือบทุกดินแดนโพนทะเลของเรา พวกเขามีบทบาทสําคัญในการชี้นําความกาวหนาของภูมิภาคตาง ๆ ไปในทิศทางที่สอดคลองกับความทะเยอทะยานของเรา และบังคับทิศทางการพัฒนาอุตสาหกรรมและเกษตรกรรมใหมุงเนนประสิทธิภาพเหนือสิ่งอื่นใด เพื่อพัฒนาอาณานิคมของเรา เราจึงตองขยายบริษัทนี้และทําใหแนใจวามีทรัพยากรทั้งหมดที่ตองการ"

 JAP_the_imperial_defense_plan: "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_imperial: "แผนปองกันจักรวรรดิ"
 JAP_the_imperial_defense_plan_national: "แผนปองกันประเทศ"
 JAP_the_imperial_defense_plan_desc: "เพื่อปกปองรัฐ เราตองจัดทําแผนการปองกันเชิงรุกฉบับใหม สงครามทั้งปวงจะชนะไดดวยการโจมตีขนาดใหญอยางเด็ดขาดและฉับพลัน หลีกเลี่ยงสงครามยืดเยื้อ และบีบใหศัตรูยอมตามขอเรียกรองของเรา"
 JAP_first_strike_principle_tt: "เมื่อ §Y[ROOT.GetNameDef]§! §Rประกาศสงคราม§!กับ§Yประเทศเพื่อนบาน§! หรือประเทศเพื่อนบานของรัฐในอารักขา จะไดรับเปนเวลา §Y90 วัน§!:\n §Y$JAP_first_strike_principle_dm$§!\n $MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!\n  $MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!"
 JAP_kantai_kessen_tt: "เมื่อ §Y[ROOT.GetNameDef]§! §Rประกาศสงคราม§!กับประเทศที่มี §Y$capital_ship$§! จะไดรับเปนเวลา §Y180 วัน§!:\n §Y$JAP_kantai_kessen_dm$§!\n  การโจมตีของเรือหลักตอประเทศ: §G+10.0%§!\n  ความเร็วการตรวจจับตอประเทศ: §G+10.0%§!"
 JAP_first_strike_blocked_due_to_kwantung_army_tt: "เนื่องจาก§Rการรุกโดยไมไดวางแผน§!ของกองทัพควันตง เราจะไมไดรับโบนัส §Y$JAP_first_strike_principle_dm$§!"

 JAP_divert_naval_guns_to_the_army: "โอนปนเรือใหกองทัพบก"
 JAP_divert_naval_guns_to_the_army_desc: "เพื่อใหกองกําลังภาคพื้นดินใชอาวุธหนักอยางปนใหญรถไฟและรถถังได เราตองโอนการผลิตปนเรือบางสวนไปใหกองทัพบก"
 JAP_divert_naval_guns_to_the_army_tt: "สรางหนวย §Y2 $railway_gun_equipment_1$§! ใน [ROOT.capital.GetName]"

 JAP_expand_kawagoe_army_arsenal: "ขยายคลังสรรพาวุธกองทัพบกคาวาโงเอะ"
 JAP_expand_kawagoe_army_arsenal_desc: "อุตสาหกรรมอาวุธของเรากําลังดิ้นรนใหทันความตองการการผลิต เพื่อใหกองทัพสามารถรบในสนามรบสมัยใหมได เราควรขยายคลังสรรพาวุธกองทัพบกคาวาโงเอะในไซตามะ เพื่อเพิ่มโอกาสใหอุปทานทันกับอุปสงค"

 JAP_reform_the_army: "ปฏิรูปกองทัพบก"
 JAP_reform_the_army_desc: "เคานตฮิไซจิ เทราอุจิ นายพลที่เลื่อนยศอยางรวดเร็วในกองทัพของเรา ไดเสนอใหทบทวนหลักนิยมกองทัพบก เขามองวาหลักนิยมการจูโจมครั้งใหญแบบเกาลาสมัยแลว และอางวาสงครามรูปแบบที่คลองตัวกวาจะครองสนามรบในอนาคต เราควรฟงคําแนะนําของเขา และทําใหแนใจวาเราจะไมตามหลังยุคสมัย"

 JAP_rely_on_supremacy_of_the_will: "พึ่งพาการรุกของทหารราบ"
 JAP_rely_on_supremacy_of_the_will_desc: "นายพลฮิเดกิ โทโจ เคยเสนอวาสงครามควรชนะดวยการโจมตีชิงลงมือกอนอยางเด็ดขาด และการรบควรชนะดวยการบุกตะลุยขนานใหญอยางรุงโรจนและความเหนือกวาของเจตจํานง เราควรสนับสนุนแนวคิดนี้ เพราะเขากับหลักนิยมทางทหารปจจุบันของเราเปนอยางดี"

 JAP_rethink_armor_doctrine: "ทบทวนหลักนิยมยานเกราะ"
 JAP_rethink_armor_doctrine_desc: "ฮิไซจิ เทราอุจิ ไดขอสรุปอันนาวิตก แบบยานเกราะและยานพาหนะภาคพื้นดินในปจจุบันของเราไมพรอมจะสูกับสิ่งใดนอกจากทหารราบเบา และจะถูกทําลายยอยยับหากตองเผชิญหนากับยานเกราะของตะวันตก เราควรแกไขความบกพรองนี้โดยเร็วที่สุด!"

 JAP_foreign_tank_modernization_cooperation: "โครงการปรับปรุงรถถังใหทันสมัยจากตางชาติ"
 JAP_foreign_tank_modernization_cooperation_desc: "เพื่อเอาชนะตะวันตก เราตองศึกษาแบบของพวกเขากอน และเรียนรูวิธีเอาชนะผานสิ่งนั้น เราควรแสวงหามิตรภาพกับมหาอํานาจตะวันตกสักแหง เพื่อที่ในที่สุดเราจะสามารถผลิตรถถังที่แมแตพวกเขาก็ยังตองทึ่ง"
 JAP_foreign_tank_modernization_cooperation_tt: "ประเทศ§Yมหาอํานาจตะวันตก§!ได§Yรับประกัน§!หรืออยูใน§Yฝาย§!เดียวกับ §Y[ROOT.GetNameDef]§!"
 JAP_foreign_tank_modernization_cooperation_2_tt: "ปลดล็อกคุณลักษณะ MIO §Y$JAP_mio_trait_foreign_research_and_development_cooperation$§! สําหรับ§Yผูออกแบบรถถัง§!ทั้งหมด §Rแตสามารถใชไดกับเพียงรายเดียวเทานั้น§!"

 JAP_domestic_tank_modernization_program: "โครงการปรับปรุงรถถังใหทันสมัยภายในประเทศ"
 JAP_domestic_tank_modernization_program_desc: "เราตองเรียนรูจากความผิดพลาด และทําใหแนใจวายานเกราะของเราสามารถรอดพนจากอาวุธตอสูรถถังได มิฉะนั้นกองกําลังของเราจะตองพบกับความลมเหลว ซึ่งไมควรทําโดยพึ่งพาแบบของมหาอํานาจตะวันตก แตดวยความเฉลียวฉลาดของประชาชน[ROOT.GetAdjective]ผูยิ่งใหญ"

 JAP_the_ultimate_tank: "รถถังขั้นสูงสุด"
 JAP_the_ultimate_tank_desc: "วิศวกรของเราคิดแนวคิดอันยอดเยี่ยมได แทนที่จะสงยานพาหนะขนาดเล็กจํานวนมหาศาลเขาสนามรบ เราควรมุงสรางอสูรกายเหล็ก ที่สามารถบดขยี้ศัตรูไดดวยการสนับสนุนเพียงเล็กนอย รางแรกของพวกเขาคือยานพาหนะที่เรียกวารถถัง O-I และเราควรเริ่มเปลี่ยนวิสัยทัศนนี้ใหเปนจริงโดยเร็วที่สุด"
 JAP_the_ultimate_tank_tt: "\nเมื่อวิจัยเทคโนโลยี §Y$super_heavy_tank_chassis$§! เสร็จ:\n"

 JAP_prepare_the_northern_front: "เตรียมแนวรบภาคเหนือ"
 JAP_prepare_the_northern_front_desc: "กองทัพควันตงคันไมคันมืออยากรบกับ[SOV.GetNameDef]อยางจริงจังมานานแลว แตขาดโครงสรางพื้นฐานทางทหารที่จําเปนตอความสําเร็จ เราควรลงทุนขยายถนนและทางรถไฟในแมนจูเรีย เพื่อที่ในที่สุดเราจะสามารถขับไลชาว[SOV.GetAdjective]ออกจากไซบีเรียไดสําเร็จ"

 JAP_enact_the_national_conscription_law: "ตรากฎหมายเกณฑทหารแหงชาติ"
 JAP_enact_the_national_conscription_law_desc: "มีพระราชกฤษฎีกาใหคนหาชาย[ROOT.GetAdjective]ทุกคนที่มีคุณสมบัติและเกณฑเขากองทัพ เราควรสงเจาหนาที่จัดหาทหารไปแมแตหมูบานที่หางไกลที่สุด เพื่อใหเกณฑทหารเพิ่มไดอยางรวดเร็ว"

 JAP_instill_the_spirit_of_bushido: "ปลูกฝงจิตวิญญาณบูชิโด"
 JAP_instill_the_spirit_of_bushido_desc: "ผานชินโตแหงรัฐและแนวคิดทางศีลธรรมแบบดั้งเดิมที่เรียกวาบูชิโด เราจะสามารถปลูกฝงใหประชาชนตระหนักถึงความจําเปนในการเสียสละตนเพื่อประโยชนของรัฐและราชวงศจักรพรรดิ" 
 JAP_instill_the_spirit_of_bushido_tt: "เปดใชยุทธวิธี: §Y$tactic_grand_banzai_charge$§!"

 JAP_adopt_new_assault_doctrine: "นําหลักนิยมการจูโจมแบบใหมมาใช"
 JAP_adopt_new_assault_doctrine_desc: "นายพลชุนโรกุ ฮาตะ เสนอวิธีใหมในการเอาชนะศัตรูในสนามรบอยางเด็ดขาด ดวยการใชปนใหญจํานวนมาก เราจะสามารถระดมยิงจนศัตรูยอมสยบ แลวจึงบุกเขาใสสวนที่เหลือซึ่งแตกพายและหมดขวัญเพื่อปดฉาก"

 JAP_develop_lethal_infantry_equipment: "พัฒนายุทโธปกรณทหารราบที่รายกาจ"
 JAP_develop_lethal_infantry_equipment_desc: "กองทัพบกไดแสดงใหเราเห็นชัดวาอาวุธที่พวกเขาครอบครองอยูลาสมัยเพียงใด และรองขอใหทําอะไรสักอยาง เราควรลงทุนอยางมากในการพัฒนายุทโธปกรณทหารราบที่ทันสมัยยิ่งขึ้น เพื่อที่เราจะไมแพสงครามอีกเลย"
 JAP_develop_lethal_infantry_equipment_tt: "หาก $JAP_army_faction$ อยูในระดับ $JAP_imperial_influence_tier_3$ ขึ้นไป จะไดรับเพิ่มดวย:\n"

 JAP_develop_sophisticated_artillery_equipment: "พัฒนายุทโธปกรณปนใหญที่ทันสมัย"
 JAP_develop_sophisticated_artillery_equipment_desc: "กองทัพบกไดแสดงใหเราเห็นชัดวาอาวุธที่พวกเขาครอบครองอยูลาสมัยเพียงใด และรองขอใหทําอะไรสักอยาง เราควรลงทุนอยางมากในการพัฒนาปนใหญที่ทันสมัยยิ่งขึ้น เพื่อที่เราจะไมตองบุกเขาใสศัตรูจนกวาพวกเขาจะแทบยอมจํานนไปแลว"

 JAP_expand_the_irago_proving_ground: "ขยายสนามทดสอบอิราโงะ"
 JAP_expand_the_irago_proving_ground_desc: "เพื่อครองสนามรบไดดียิ่งขึ้น เราควรขยายสนามทดสอบอิราโงะซึ่งเปนที่ทดสอบอาวุธใหมและอาวุธทดลอง ที่นั่นเราอาจพัฒนาเครื่องมือแหงสงครามที่จะทําใหศัตรูทั้งหมดยอมสยบได"

 JAP_sea_mountaineers: "จัดตั้งกรมทหารภูเขา"
 JAP_sea_mountaineers_desc: "กองทัพบกของเราตระหนักวาจะไมสามารถเจาะเขาสูภูมิภาคภูเขาทางใตและตะวันตกของจีนไดหากไมทําอะไรที่เด็ดขาด จึงไดรองขอใหจัดตั้งกองพลนอยทหารภูเขาพิเศษ เพื่อนําการบุกและเจาะแนวขาศึก"

 JAP_jungle_adaptation: "ปรับตัวสูสงครามปา"
 JAP_jungle_adaptation_desc: "กองทัพบกของเราตระหนักวาจะไมสามารถเจาะเขาสูภูมิภาคปาทึบของพมาและอินโดนีเซียใหญไดหากไมทําอะไรที่เด็ดขาด จึงไดรองขอใหจัดตั้งกองพลปาพิเศษ เพื่อนําการบุกและเจาะแนวขาศึก"

 JAP_army_weapons_administration_headquarters: "กองบัญชาการบริหารอาวุธกองทัพบก"
 JAP_army_weapons_administration_headquarters_desc: "เพื่อรวมการผลิต การสงกําลัง การวิจัย การพัฒนา การทดสอบ และการฝกดานอาวุธของกองทัพบกไวดวยกัน เราควรจัดตั้งกองบัญชาการบริหารอาวุธกองทัพบก ดวยวิธีนี้ หวังวาอุตสาหกรรมของเราจะมีโอกาสสูกับยักษใหญอยาง[SOV.GetNameDef]และ[USA.GetNameDef]ได"
 JAP_army_weapons_administration_headquarters_tt: "หาก $JAP_army_faction$ อยูในระดับ $JAP_imperial_influence_tier_3$ ขึ้นไป จะไดรับ§Yศูนยวิจัยสงครามภาคพื้นดิน§! §G1§! แหงดวย"

 JAP_pivot_towards_defensive_measures: "หันมาใชมาตรการปองกัน"
 JAP_pivot_towards_defensive_measures_desc: "สงครามไมไดพัฒนาไปในทางที่เปนประโยชนตอเรานัก มีความเปนไปไดมากขึ้นเรื่อย ๆ ที่ศัตรูจะยกพลขึ้นบกบนหมูเกาะแผนดินแม ซึ่งปจจุบันเราไมพรอมรับมือ เราควรแกปญหานี้ มิฉะนั้นเราจะตองเผชิญศตวรรษแหงความอัปยศที่เราสรางขึ้นเอง!"

 JAP_strenghten_the_supply_lines: "เสริมความแข็งแกรงใหเสนทางเสบียง"
 JAP_strenghten_the_supply_lines_desc: "เสนทางเสบียงของเรายืดยาวเกินกวาที่จะรับไหว และกองทหารของเรากําลังสูญเสียเปนผลจากเรื่องนี้ เราตองแกไขสถานการณหากตองการใหความสําเร็จดําเนินตอไป เพราะเวลากําลังหมดลงอยางรวดเร็วกอนที่กองทหารของเราจะสั่นคลอนและลมสลาย"

 JAP_ni_go_nuclear_project: "โครงการนิวเคลียรนิโง"
 JAP_ni_go_nuclear_project_desc: "คณะกรรมการกองทัพบกไดตั้งโครงการทดลองที่ RIKEN ซึ่งเรียกวาโครงการนิโง มีเปาหมายแยกยูเรเนียม-235 ดวยการแพรความรอน โดยไมสนใจวิธีอื่นอยางการแยกดวยแมเหล็กไฟฟา การแพรของแกส และการแยกดวยแรงเหวี่ยง หวังวาอีกไมนานเราจะเรียนรูวิธีนําสิ่งนี้มาใชทางทหารได"

 JAP_establish_showa_aircraft_idnsutry: "จัดตั้งอุตสาหกรรมอากาศยานโชวะ"
 JAP_establish_showa_aircraft_idnsutry_desc: "เราไดรับคําขออนุญาตจัดตั้งโชวะ ฮิโคกิ โคเงียว คาบูชิกิไกชะ ที่อากิชิมะ โตเกียว บริษัทนี้ตองการสรางอากาศยานทหารเพื่อสงมอบใหกองทัพของเรา เราควรอนุมัติคําขอและใหพวกเขาเริ่มจัดหายุทโธปกรณการบินใหเราทันที"

 JAP_develop_new_fighters: "พัฒนาเครื่องบินขับไลแบบใหม"
 JAP_develop_new_fighters_desc: "แบบใหมของมิตซูบิชิอาจพิสูจนไดวาเปนเครื่องบินขับไลประจําเรือบรรทุกเครื่องบินที่มีขีดความสามารถสูงสุดเทาที่เคยออกแบบมา ความคลองตัวที่ไมมีใครเทียบ ประกอบกับพิสัยที่ดีพอ ทําใหแบบนี้นาจะใชงานไดไปอีกหลายป เราควรเริ่มสรางตนแบบและผลิตทันที"

 JAP_modern_bombers: "เครื่องบินทิ้งระเบิดสมัยใหม"
 JAP_modern_bombers_desc: "กองกําลังเครื่องบินทิ้งระเบิดทางยุทธวิธีที่ทันสมัยเปนกุญแจสําคัญในการสนับสนุนกองทัพของเราในสนามรบ ดังนั้นเราควรสั่งใหทั้งกองทัพบกและกองทัพเรือเริ่มพัฒนาเครื่องบินที่สามารถสนับสนุนทางยุทธวิธีใหกองกําลังภาคพื้นดินของเรา"

 JAP_improve_the_type_91_aerial_torpedo: "ปรับปรุงตอรปโดอากาศ Type 91"
 JAP_improve_the_type_91_aerial_torpedo_desc: "เราควรพัฒนาตอรปโดที่เชี่ยวชาญการโจมตีเรือในนํ้าตื้น เพื่อปรับปรุงขีดความสามารถในการโจมตีทาเรือ ตอรปโดอากาศเหลานี้จะไดรับแรงบันดาลใจจากตอรปโดที่ลํ้าหนาที่สุดของเรา Long Lance และจะนําผลแหงชัยชนะมาสูเราเร็วกวาที่เคยฝนไว"

 JAP_7075_aluminium_alloy: "โลหะผสมอะลูมิเนียม 7075"
 JAP_7075_aluminium_alloy_desc: "พิสัยบินเพียงอยางเดียวไมมีประโยชน หากเครื่องบินของเราสูขาศึกไมไดเมื่อไปถึง เราตองผลิตอากาศยานที่คลองแคลวเหนือกวา เพื่อไมใหถูกชิงเชิงไดเลย วิศวกรของเราที่มิตซูบิชิไดพัฒนาโลหะผสมอะลูมิเนียมชนิดใหมที่จะปฏิวัติการสรางเครื่องบินอยางสิ้นเชิง"

 JAP_escort_efficiency: "ลงทุนในเครื่องบินคุมกัน"
 JAP_escort_efficiency_desc: "เราตองคงความเหนือกวาขาศึกในทุกดาน รวมถึงการสงครามทางอากาศ มิฉะนั้นเครื่องบินทิ้งระเบิดและเครื่องบินลําเลียงของเราจะถูกสกัดกั้นและยิงตก เครื่องบินขับไลที่ทันสมัยจึงเปนสิ่งจําเปนตอการบรรลุเปาหมายนี้ และเปนกุญแจสูชัยชนะในอนาคต"

 JAP_sea_sturdy_aircraft: "อากาศยานที่แข็งแกรงทนทาน"
 JAP_sea_sturdy_aircraft_desc: "ความคลองแคลวและพิสัยบินลวนจําเปน แตไมใชปจจัยเดียวที่กําหนดความสําเร็จบนทองฟา หากเครื่องบินของเราบางเหมือนกระดาษ เราคงแพตั้งแตสงครามยังไมเริ่ม เราจึงตองลงทุนพัฒนาโครงสรางอากาศยานที่แข็งแรงขึ้นและเกราะที่หนาขึ้น เพื่อครองนานฟาไปอีกหลายป"
 JAP_sea_sturdy_aircraft_tt: "ลดโอกาสที่บุคคลบางคนจะตกเปนเปาการโจมตีทางอากาศ"

 JAP_sea_long_operational_range: "พิสัยปฏิบัติการไกล"
 JAP_sea_long_operational_range_desc: "แมเราจะปรารถนาชัยชนะอยางรวดเร็วเพียงใด สงครามก็ไมอาจเอาชนะไดงาย ๆ ดวยการปะทะทางทหารโดยตรงเพียงอยางเดียว ระยะทางในสมรภูมิแปซิฟกนั้นกวางใหญไพศาล เราจึงตองมีเครื่องบินที่ครอบคลุมระยะทางเหลานั้นได หากตองการประสบความสําเร็จ"

 JAP_project_z_bomber_project: "โครงการเครื่องบินทิ้งระเบิด Z"
 JAP_project_z_bomber_project_desc: "เมืองหลวงของขาศึกอยูหางไกลจากเรามาก ทําใหยากที่จะโจมตีเด็ดขาดตั้งแตเนิ่น ๆ เพื่อยุติสงครามอยางรวดเร็ว เราจึงตองสรางอากาศยานที่บินไปถึงชายฝงตะวันออกของอเมริกาไดหากจําเปน และลงทุนในเครื่องบินทิ้งระเบิดทางยุทธศาสตรรุนใหมที่ทําลายอุตสาหกรรมหลังแนวรบของขาศึกได"

 JAP_adopt_new_air_doctrine: "รับหลักนิยมทางอากาศใหม"
 JAP_adopt_new_air_doctrine_desc: "เมื่อไดเผชิญหนากับขาศึกที่มีขีดความสามารถทางเทคโนโลยีทัดเทียมกับเราแลว เราจึงตระหนักวาตองปรับหลักนิยมการรบใหทันสมัยดวยเพื่อใหตามทัน"

 JAP_the_divine_wind: "ลมศักดิ์สิทธิ์"
 JAP_the_divine_wind_desc: "คามิกาเซ ยุทธวิธีของหนวยจูโจมพิเศษ ไดเปลี่ยนการโจมตีแบบพลีชีพจากมาตรการสุดทายที่ทําแบบเฉพาะหนา ใหกลายเปนหลักนิยมที่วางไวอยางเปนระบบ ดวยเครื่องบินแบบใหมซึ่งแทจริงคือขีปนาวุธที่มีคนบังคับ การโจมตีเหลานี้จะไมมีใครหยุดยั้งได"

 JAP_sea_unify_the_air_forces: "รวมกองทัพอากาศเปนหนึ่ง"
 JAP_sea_unify_the_air_forces_desc: "นานเกินไปแลวที่เราตองทนกับการวิจัยและพัฒนาการบินที่แยกกันระหวางกองทัพบกและกองทัพเรือ เราตองรวมโครงการเหลานี้เขาดวยกัน เพื่อใหอาวุธมีมาตรฐานเดียวกันและใชทรัพยากรการวิจัยที่จํากัดของเราไดดีขึ้น"
 JAP_sea_unify_the_air_forces_tt: "ปลดล็อกคุณลักษณะ MIO §Y$JAP_mio_trait_unified_research_and_development$§! ใหแก §Yผูออกแบบเครื่องบิน§! ทุกราย §Rแตใชไดกับเพียงรายเดียวเทานั้น§!"
 JAP_sea_unify_the_air_forces_2_tt: "แทนที่ §Y$JAP_army_and_naval_air_services_dm$§! ดวย §Y$JAP_japanese_airforce_dm$§! ผลการเปลี่ยนแปลง:"

 JAP_improved_radio_communications: "ปรับปรุงการสื่อสารทางวิทยุ"
 JAP_improved_radio_communications_desc: "วิทยุของเราอยูในสภาพยํ่าแย สงผลใหรูปขบวนของเรามักแตกแถวเพราะการสื่อสารที่ไมดีและสัญญาณที่ขาดหายในปาทึบและบนเกาะหางไกล เราตองปรับปรุงยุทโธปกรณใหทันสมัยและสรางเสาวิทยุใหม เพื่อไมใหเหตุการณนี้เกิดขึ้นอีก"

 JAP_combined_arms: "เหลาผสม"
 JAP_combined_arms_desc: "การประสานงานระหวางกําลังทางอากาศและทางบกคือกุญแจสูความสําเร็จ เพื่อใหการสนับสนุนที่ดีขึ้นและกวาดลางอุปสรรคที่กองทัพของเราอาจเผชิญในสนามรบ เราควรลงทุนในยุทธวิธีเหลาผสมที่ทําใหเครื่องบินของเราปฏิบัติการรวมกับเหลาทัพอื่นได"

 JAP_sea_jet_prototypes: "อาวุธจักรวรรดิหมายเลข 2" 
 JAP_sea_jet_prototypes_desc: "อนาคตของการบินไมไดอยูที่ใบพัด เราตองหันไปหาเครื่องยนตไอพนเพื่อเพิ่มขีดความสามารถของอากาศยาน วิศวกรของเราตั้งชื่อโครงการสรางเครื่องบินทดลองแบบใหมนี้วา อาวุธจักรวรรดิหมายเลข 2 โดยเรียกเครื่องบินรุนนี้วา คิกกะ"

 JAP_rockets_development: "การพัฒนาจรวด"
 JAP_rockets_development_desc: "ฮิเดโอะ อิวากูโระ มีแนวคิดดี ๆ มากมายเกี่ยวกับขีปนาวุธนําวิถีอากาศสูพื้นและขีปนาวุธตอสูอากาศยานพื้นสูอากาศ เราควรสงเสริมแนวคิดของเขา และพัฒนาจรวดรูปแบบใหมที่จะชวยนําเราไปสูชัยชนะในอนาคต"

 JAP_expand_hiratsuka_navy_arsenal: "ขยายคลังสรรพาวุธกองทัพเรือฮิราสึกะ"
 JAP_expand_hiratsuka_navy_arsenal_desc: "คลังสรรพาวุธกองทัพเรือฮิราสึกะที่กอตั้งในป 1905 มีศักยภาพจะขยายไดอีกมาก โดยสามารถแยกโรงงานเฉพาะทางสําหรับงานออกแบบและวิศวกรรม ทั้งกระสุนปนกล กระสุนปนใหญเรือ การนําตัวทําละลายกลับมาใชใหม และการผลิตไนโตรกลีเซอรีน"
 JAP_expand_hiratsuka_navy_arsenal_tt: "ไดออกจาก §Yสนธิสัญญานาวีลอนดอน§! แลว หรือ §Yไดใชขอกําหนดยกระดับแลว§!"

 JAP_expand_navy_technical_department: "ขยายกรมเทคนิคกองทัพเรือ"
 JAP_expand_navy_technical_department_desc: "เราตองจัดทําประมาณการใหมสําหรับขนาดการขยายกองทัพเรือ และสําหรับอูตอเรือที่จําเปนตอการขยายนั้น กาวแรกในการปรับสิ่งอํานวยความสะดวกของเราใหทันกับความตองการสมัยใหมคือการขยายกรมเทคนิคของกองทัพเรือ"

 JAP_prepare_the_southern_front: "เตรียมแนวรบดานใต"
 JAP_prepare_the_southern_front_desc: "สงครามในแปซิฟกจะเกี่ยวของกับการยกพลขึ้นบกเปนอยางมาก กองกําลังยกพลขึ้นบกพิเศษของกองทัพเรือตองไดรับการขยายหากจะรับมือภารกิจนี้ได นอกจากนี้ การลงทุนในพลรมนาวิกโยธินก็จะคุมคา เพราะพวกเขาสามารถยึดจุดยุทธศาสตรและหมูเกาะไดกอนที่กําลังหลักของเราจะไปถึง"
 JAP_prepare_the_southern_front_tt: "เมื่อ [ROOT.GetNameWithFlag] §Rประกาศสงคราม§! กับประเทศที่ควบคุม §Yรัฐในเอเชียตะวันออกเฉียงใต§!:"

 JAP_focus_on_aircraft_carriers: "มุงเนนเรือบรรทุกเครื่องบิน" 
 JAP_focus_on_aircraft_carriers_desc: "เรือประจัญบานคือซากของยุคที่ผานพนไปแลว เราตองมองไปยังอนาคต และอนาคตคือการบิน เรือบรรทุกเครื่องบินจะทําใหเราแผแสนยานุภาพทางอากาศไปทั่วแปซิฟกได"

 JAP_balanced_naval_approach: "แนวทางนาวีแบบสมดุล"
 JAP_balanced_naval_approach_desc: "เราตองไมตอนตัวเองเขามุม หากปรากฏวาเรือประจัญบานหรือเรือบรรทุกเครื่องบินไรประสิทธิภาพตอขาศึก เราจึงควรรักษาแนวทางนาวีแบบสมดุล และลงทุนในทั้งสองดาน"

 JAP_sea_battleship_initiative: "ริเริ่มเรือประจัญบาน"
 JAP_sea_battleship_initiative_desc: "ดวยแบบเรือประจัญบานที่เหนือกวา เราตองการการรบชี้ขาดเพียงครั้งเดียวเพื่อตัดสินสงครามทางทะเล เราตองทําใหกองเรือรบของเราพรอมสําหรับการปะทะชี้ขาดและควาชัยชนะไดรวดเร็วดั่งสายลม"

 JAP_sea_heavier_naval_guns: "ปนเรือที่หนักขึ้น"
 JAP_sea_heavier_naval_guns_desc: "ดูเหมือนวาขาศึกของเราไดลงทุนอยางหนักกับเกราะของเรือรบ เราตองตามการพัฒนาของพวกเขาใหทันและเจาะตัวเรือของพวกเขาใหได ดวยเหตุนี้ การลงทุนในปนเรือที่หนักขึ้นจึงเปนสิ่งที่สมควร"

 JAP_sea_bigger_better_yamato: "เรือประจัญบานชั้นสึชิมะ"
 JAP_sea_bigger_better_yamato_desc: "เนื่องจากเราไมไดรํ่ารวยทรัพยากร เราตองใชทรัพยากรที่มีใหเกิดประโยชนสูงสุด เราจะสรางเรือประจัญบานที่ทรงพลังที่สุดเทาที่เคยลอยอยูบนผิวโลก ซึ่งสามารถเอาชนะขาศึกใดก็ไดในการปะทะซึ่งหนา ดวยสิ่งนี้ ขาศึกจะตองกมหัวใหเรา หรือไมก็สูญสิ้นไป"

 JAP_yokosuka_naval_air_technical_arsenal: "คลังสรรพาวุธเทคนิคการบินนาวีโยโกสุกะ"
 JAP_yokosuka_naval_air_technical_arsenal_desc: "คลังสรรพาวุธเทคนิคการบินนาวีโยโกสุกะจะเปนกําลังสําคัญในการจัดหาเครื่องบินที่ทันสมัยที่สุดใหกองเรือบรรทุกเครื่องบินใหมของเรา โดยจะมุงสรางแบบที่ดีขึ้น เพื่อใหบริษัทอยาง Aichi kokuki และ Kyūshū hikoki Kabushiki-kaisha ผลิตจํานวนมาก และประกอบที่คลังสรรพาวุธกองทัพเรือฮิโระ"

 JAP_establish_the_mine_warfare_force: "จัดตั้งกองกําลังสงครามทุนระเบิด"
 JAP_establish_the_mine_warfare_force_desc: "เราทราบมาวาชาติตะวันตกกําลังใชทุนระเบิดทางทะเลเปนเครื่องมือควบคุมทองทะเล เราควรนําแนวคิดเหลานี้มาใช แตตองจัดตั้งกองกําลังที่รับผิดชอบติดตามทุนระเบิดและกวาดทุนระเบิดในนานนํ้าเมื่อจําเปนดวย"

 JAP_akizuki_class_destroyers: "เรือพิฆาตชั้นอากิซูกิ"
 JAP_akizuki_class_destroyers_desc: "เราตองการเรือแพลตฟอรมอเนกประสงคที่มีขีดความสามารถสูง พรอมความสามารถคุมกันตอสูอากาศยานที่แข็งแกรง เพื่อประจําในกลุมเรือบรรทุกเครื่องบินและกองเรือรบของเรา วิศวกรของเราจึงเริ่มพัฒนาตอยอดจากเรือพิฆาตชั้นยูกูโมะ เปนชั้นใหมที่เรียกวาชั้นอากิซูกิ"

 JAP_form_the_kido_butai: "จัดตั้งคิโดบูไต" # Form the Kidō Butai
 JAP_form_the_kido_butai_desc: "เพื่อใหมีอํานาจการโจมตีเชิงรุกสูงสุด เราจะรวมเรือบรรทุกเครื่องบินจํานวนมากที่สุดเทาที่โลกเคยเห็นไวในกลุมรบเดียว ดวยการพัฒนาหลักนิยมที่จําเปนตอการปฏิบัติการรุกรวมกันในรูปแบบนี้ ขาศึกจะไมมีทางตานทานความเหนือกวาดานการบินนาวีของเราได"
 JAP_form_the_kido_butai_tt: "โอกาสสําเร็จของ§Yการจูโจม§!เพิรลฮารเบอรตอ §Y[USA.GetNameWithFlag]§! จะเพิ่มขึ้น"

 JAP_nationalize_suzuka_naval_arsenal: "โอนคลังสรรพาวุธกองทัพเรือซูซูกะเปนของรัฐ"
 JAP_nationalize_suzuka_naval_arsenal_desc: "คลังสรรพาวุธกองทัพเรือซูซูกะเปนสถานที่ผลิตอาวุธอากาศยาน อาวุธเบา และกระสุนใหกองทัพเรือ เราควรโอนสถานที่นี้เปนของรัฐ เพื่อใหควบคุมการขยายได และจัดตั้งอูซอมเรือแหงใหมในพื้นที่"

 JAP_nationalize_fujinagata_shipyards: "โอนอูตอเรือฟูจินางาตะเปนของรัฐ"
 JAP_nationalize_fujinagata_shipyards_desc: "อูตอเรือฟูจินางาตะเปนอูตอเรือและผูผลิตตูรถไฟสําคัญในโอซากะ ซึ่งมีความสําคัญเชิงยุทธศาสตรตอความพยายามในสงครามของเรา เพื่อขยายสิ่งอํานวยความสะดวกและเกณฑแรงงานเพิ่ม เราควรพยายามโอนอูตอเรือเหลานี้เปนของรัฐ"

 JAP_naval_armaments_program: "โครงการเสริมสรางกําลังนาวี"
 JAP_naval_armaments_program_desc: "เพื่อใหอูตอเรือและอุตสาหกรรมของเราตามทันความทะเยอทะยานที่เพิ่มขึ้นไมหยุด กองทัพเรือไดรางแผนขยายกําลังใหมภายใตโครงการเสริมกําลังนาวีเรงดวน ซึ่งรวมถึงเรือรบใหม และมีเปาหมายจะขยายกองทัพเรือใหมีเรืออยางนอย 293 ลํา"
 JAP_naval_armaments_program_tt: "เมื่อสําเร็จ §Y$JAP_focus_on_aircraft_carriers$§!: สราง§Yรุนยอย§!เรือบรรทุกเครื่องบิน และ §Yสายการผลิต 4 สาย§! ของ §Yชั้นโชกากุ§!\nเมื่อสําเร็จ §Y$JAP_balanced_naval_approach$§!: สราง§Yรุนยอย§!เรือบรรทุกเครื่องบินและเรือประจัญบานยักษ และ §Yสายการผลิต 2 สาย§! ของทั้ง §Yชั้นโชกากุ§! และ §Yชั้นยามาโตะ§!\nเมื่อสําเร็จ §Y$JAP_sea_battleship_initiative$§!: สราง§Yรุนยอย§!เรือประจัญบานยักษ และ §Yสายการผลิต 4 สาย§! ของ §Yชั้นยามาโตะ§!\n"

 JAP_radio_guided_missiles: "ขีปนาวุธนําวิถีความรอน"
 JAP_radio_guided_missiles_desc: "คณะกรรมการสรรพาวุธกองทัพบกจักรวรรดิญี่ปุนมีความกาวหนาอยางมากในการพัฒนาอาวุธนําวิถี พวกเขาใกลจะประสบความสําเร็จครั้งสําคัญกับขีปนาวุธแบบทิ้งดิ่ง นําวิถีดวยอินฟราเรด และรักษาการทรงตัวดวยไจโร ซึ่งออกแบบใหทิ้งจากเครื่องบินใสเปาหมายเรือเดินสมุทร อาวุธใหมนี้ไดรับชื่อวา เค-โกะ"

 JAP_assure_superior_naval_quality: "รับประกันคุณภาพนาวีที่เหนือกวา"
 JAP_assure_superior_naval_quality_desc: "แมจํานวนจะสําคัญ แตเราตองไมปลอยใหขาศึกมีเรือที่ทรงพลังกวาเรือที่ยิ่งใหญที่สุดของเรา ยามาโตะเปนกาวแรกที่ดี แตเราตองผลักดันแนวคิดเหลานี้ใหไปไกลยิ่งขึ้น"

 JAP_seek_strength_in_numbers: "แสวงหากําลังจากจํานวน"
 JAP_seek_strength_in_numbers_desc: "เรือลําเดียวไมพอจะชนะการรบ เราตองกระจายความหลากหลายของกองเรือ และเพิ่มจํานวนแทนที่จะมุงแตคุณภาพ เพราะทายที่สุดแลว ปริมาณก็คือคุณภาพในตัวมันเอง"
 JAP_seek_strength_in_numbers_tt: "ปลดล็อกคุณลักษณะ MIO §Y$JAP_mio_trait_strength_in_numbers$§! ใหแก §Yผูออกแบบเรือ§! ทุกราย §Rแตใชไดกับเพียงรายเดียวเทานั้น§!"

 JAP_secure_the_sea_lanes: "รักษาเสนทางเดินเรือใหปลอดภัย"
 JAP_secure_the_sea_lanes_desc: "กองเรือของเราตองมีเรือคุมกันที่ทันสมัยที่สุด เพื่อปฏิบัติการไดโดยไมถูกเรือดํานํ้าและเรือตอรปโดของขาศึกขัดขวาง มีเพียงการลงทุนในดานนี้เทานั้นที่เรือลําเลียงของเราจะไปถึงจุดหมายไดอยางปลอดภัย"

 JAP_fix_flawed_naval_designs: "แกไขแบบเรือที่บกพรอง"
 JAP_fix_flawed_naval_designs_desc: "แบบเรือของเราพิสูจนแลววาหนักสวนบนเกินไป และเคยเกิดเหตุเรือพลิกควํ่าทันทีที่ออกจากทา เราตองแกปญหาเหลานี้โดยทันที เพื่อใหเรือของเราออกสูทะเลไดอยางปลอดภัย"

 JAP_f_go_nuclear_project: "โครงการนิวเคลียร F-Go"
 JAP_f_go_nuclear_project_desc: "กองบัญชาการทหารเรือของเราตองการเริ่มโครงการวิจัยนิวเคลียร โดยหวังจะนําพลังของเทคโนโลยีนี้มาใชกับกองเรือ พวกเขาเสนอใหดําเนินการภายใตบุนซากุ อารากัตสึ ที่มหาวิทยาลัยหลวงเกียวโต ทีมของเขารวมถึงฮิเดกิ ยูกาวะ นักทฤษฎีคนสําคัญที่จะสรางความกาวหนาที่เราตองการไดอยางแนนอน"

 JAP_combined_nuclear_research_efforts: "รวมความพยายามวิจัยนิวเคลียร"
 JAP_combined_nuclear_research_efforts_desc: "เมื่อความเปนปฏิปกษระหวางเหลาทัพของเราใกลจะยุติลง ก็ถึงเวลาแลวที่จะรวมโครงการนิวเคลียรอันทะเยอทะยานของพวกเขาเขาเปนหนึ่งเดียว และใหบุคลากรที่ปราดเปรื่องที่สุดของชาติทํางานรวมกันในทีมเดียว"

 JAP_end_the_interservice_rivalry: "ยุติการแขงขันระหวางเหลาทัพ"
 JAP_end_the_interservice_rivalry_desc: "เมื่อชัยชนะของเราพิสูจนแลววาชาติของเราสามารถกาวขึ้นเปนมหาอํานาจโลก การแยงชิงทรัพยากรระหวางกลุมตาง ๆ ภายในก็ดูไรความหมายยิ่งขึ้น ถึงเวลาแลวที่เราจะยุติความแตกแยกที่แบงผลประโยชนของเรามานานเกินไป และสรางความมั่นใจวาความเปนใหญของ[ROOT.GetAdjective]เหนือเอเชียจะดํารงอยูไปอีกหลายศตวรรษ"
 JAP_end_the_interservice_rivalry_tt: "จะยุติ§Yการแขงขันระหวางเหลาทัพ§!ระหวางกองทัพบกและกองทัพเรือ ทั้งสองจะ§Gไมใหผลลบอีกตอไป§!ตามสถานะเมื่อเทียบกับอีกฝาย แตจะทําหนาที่เหมือนกลุมอื่น ๆ แทน"

 JAP_seek_yakuza_support: "แสวงหาการสนับสนุนจากยากูซา"
 JAP_seek_yakuza_support_desc: "มีหลายกลุมที่ถืออํานาจมหาศาลอยูในเงามืด พวกเขาควบคุมและมีอิทธิพลตอการกระทําของทั้งนักการเมืองและนายพล เราควรพยายามเปนพันธมิตรกับกลุมเหลานี้ และโนมนาวใหพวกเขารวมมือกับเราเพื่อไมใหฝายทหารทําไดตามใจ"
 JAP_seek_yakuza_support_tt: "§Yกองทัพบกจักรวรรดิ§!ในสัดสวนที่มากขึ้นจะถูกโนมนาวมาอยูฝายเราใน§Yสงครามกลางเมือง§!"
 JAP_seek_yakuza_support_2_tt: "§Yนายพล§! §G1§! คนจะภักดีตอเรา"

 JAP_expand_the_metropolitan_police: "ขยายกรมตํารวจนครบาล"
 JAP_expand_the_metropolitan_police_desc: "เรารูแนชัดวากองกําลังตํารวจพลเรือนเปนกลุมที่พรอมรบและยืนอยูขางเราอยางมั่นคง ไมไดอยูภายใตการควบคุมของฝายทหาร พวกเขาชวยเราโคนกลุมโคโดฮะ และสามารถชวยเราไดอีกครั้งในการฟนฟูความสงบเรียบรอยทามกลางสถานการณอันวุนวายนี้"
 JAP_expand_the_metropolitan_police_tt: "§Yนายพล§! §G2§! นายจะภักดีตอเรา"
 JAP_expand_the_metropolitan_police_2_tt: "รัฐบาลประชาธิปไตยจะไดรับ §Yกองพลตํารวจ§! เพิ่มอีก §G8§! กองพลเมื่อเกิด §Yสงครามกลางเมือง§!"

 JAP_secretly_rebuild_the_party: "ฟนฟูพรรคคอมมิวนิสตญี่ปุนอยางลับ ๆ" # Can also be Secretly Rebuild the Party
 JAP_secretly_rebuild_the_party_desc: "มีหลายกลุมที่สูญเสียเสียงและตัวแทนทางการเมืองไปเมื่อกฎหมายรักษาความสงบถูกลงนามเมื่อป 1925 หนึ่งในนั้นคือพวกคอมมิวนิสต ซึ่งองคกรของพวกเขาถูกประกาศใหผิดกฎหมายและถูกกดขี่อยางหนักภายใตระบอบเกาของเรา เราตองหาทางทําใหขบวนการของพวกเขาถูกกฎหมาย เพื่อดึงพวกเขามาเปนแนวรวมในการตอสูกับฝายทหาร"
 JAP_secretly_rebuild_the_party_tt: "ปลดล็อกการตัดสินใจ §Yแทรกซึมรัฐที่ฝายคานควบคุม§! เพื่อใหมั่นใจวารัฐเหลานั้นจะเขารวมกับ §Yฝายคอมมิวนิสต§! เมื่อเกิด §Yสงครามกลางเมือง§!"

 JAP_anti_militarist_speeches_in_the_diet: "สุนทรพจนตอตานลัทธิทหารในสภาไดเอ็ต"
 JAP_anti_militarist_speeches_in_the_diet_desc: "เมื่อกระแสตอตานกองทัพแผขยายไปทั่วประเทศ จึงเปนการรอบคอบที่จะผลักดันประชาชนผูวิพากษลัทธิชาตินิยมสุดโตงใหเอนไปทางซายมากขึ้น ดวยการใหอิโซกลาวสุนทรพจนวิจารณขนบธรรมเนียมของเรา และแจกจายใบปลิวโฆษณาชวนเชื่อคอมมิวนิสตตามทองถนนเทาที่พรรคจะทําได"
 JAP_anti_militarist_speeches_in_the_diet_tt: "ปลดล็อกการตัดสินใจ §Yเพิ่มแรงสนับสนุนคอมมิวนิสต§! ทั่วประเทศ"

 JAP_sway_disillusioned_young_officers: "ดึงนายทหารหนุมผูผิดหวัง"
 JAP_sway_disillusioned_young_officers_desc: "นายทหารหนุมสวนใหญที่รวมกอรัฐประหารของฝายโคโดฮะครั้งลาสุดมาจากครอบครัวชนบทที่ยากจน ซึ่งไมพอใจโครงสรางปจจุบันของกองทัพ และระบบการเลื่อนยศที่อิงชาติตระกูลแทนที่จะเปนความสามารถ เราควรใชประโยชนจากจุดนี้และสัญญากับพวกเขาถึงวันพรุงนี้ที่ดีกวา"
 JAP_sway_disillusioned_young_officers_tt: "§Yนายทหารหนุมโคโดฮะ§! จะเห็นใจตออุดมการณของเรา"
 JAP_sway_disillusioned_young_officers_2_tt: "§Yกองทัพบกจักรวรรดิ§! สวนที่ใหญขึ้นเล็กนอยจะถูกโนมนาวใหมาอยูฝายเราใน §Yสงครามกลางเมือง§!"
 focus_effects_are_as_follows_tt: "ผลของแผนยุทธศาสตรมีดังนี้:"

 JAP_organize_the_student_movements: "จัดตั้งขบวนการนักศึกษา"
 JAP_organize_the_student_movements_desc: "นักศึกษาในมหาวิทยาลัยของเราไมพอใจกับสภาพของประเทศ และมีแนวคิดสอดคลองกับสมาชิกคนสําคัญหลายคนของพรรคคอมมิวนิสตญี่ปุน เราควรจัดตั้งคณะกรรมการตอสูรวมทุกวิทยาเขต โดยมีเปาหมายเผยแพรแนวคิดสังคมนิยมไปทั่วมหาวิทยาลัย"
 JAP_organize_the_student_movements_tt: "เมื่อเกิด §Yสงครามกลางเมือง§! ฝายตรงขามจะไดรับจิตวิญญาณแหงชาติตอไปนี้เปนเวลา §Y365§! วัน:"

 JAP_raise_support_within_the_proletarian_class: "ปลุกแรงสนับสนุนในหมูชนชั้นกรรมาชีพ"
 JAP_raise_support_within_the_proletarian_class_desc: "ผูนําระดับสูงหลายคนของเรามาจากชนชั้นแรงงาน เคยทํางานในอูตอเรือและโรงถลุงเหล็ก เราควรสงเสริมใหกรรมาชีพญี่ปุนรวมตัวกันเปนสหภาพ และลุกขึ้นตอตานผูที่ตองการเหยียบยํ่าสิทธิของพวกเขา"
 JAP_raise_support_within_the_proletarian_class_tt: "§Y[529.GetName]§! จะหันมาสนับสนุนพรรคคอมมิวนิสตญี่ปุน"
 JAP_raise_support_within_the_proletarian_class_2_tt: "เราจะไดรับ §Y$JAP_strong_unions_idea$§! หากเกิด §Yสงครามกลางเมือง§!" 

 JAP_organize_underground_resistance: "จัดตั้งขบวนการตอตานใตดิน"
 JAP_organize_underground_resistance_desc: "หากพรรคของเราจะลุกขึ้นตอตานไมเพียงแคกองทัพ แตรวมถึงรัฐบาลกลางดวย เราจําเปนตองมีฐานปฏิบัติการที่อยูไกลเกินอํานาจของพวกเขา จากที่นั่นเราจะเริ่มปลดปลอยสหายของเราออกจากคุก และเริ่มปฏิบัติการจัดหาอาวุธเพื่อการปฏิวัติ"
 JAP_organize_underground_resistance_tt: "ปลดล็อกการตัดสินใจ §Yจูโจมคลังอาวุธของกองทัพ§! และรับยุทโธปกรณเมื่อการปฏิวัติเริ่มตน พรอมทั้งสรางผลเสียเล็กนอยแกฝายตรงขาม"

 JAP_mountain_village_operation_units: "หนวยปฏิบัติการหมูบานภูเขา"
 JAP_mountain_village_operation_units_desc: "ซันโซ โนซากะ อนุมัติใหจัดตั้งหนวยกึ่งทหารใตดินและเซลลลับในหมูบานชนบทและพื้นที่หางไกล โดยมีเปาหมายทําสงครามกองโจรตอรัฐบาล และเตรียมพรอมสําหรับการปฏิวัติคอมมิวนิสตทั่วประเทศ เพื่อการนี้ จุลสาร 'วิธีปลูกหัวไมดอก' จึงเริ่มถูกแจกจายไปทั่วประเทศ"
 JAP_mountain_village_operation_units_tt: "ปลดล็อกการตัดสินใจ §Yจัดตั้งหนวยกองโจร§! ในรัฐที่จะลุกฮือขึ้นเมื่อถึงเวลาอันเหมาะสม"

 JAP_return_of_the_manchukuo_exiles: "การกลับมาของผูลี้ภัยจากแมนจูกัว"
 JAP_return_of_the_manchukuo_exiles_desc: "นักทฤษฎีและนักเศรษฐศาสตรสังคมนิยมจํานวนมากเดินทางไปทํางานในสหกรณแนวสหการนิยมและอุตสาหกรรมตาง ๆ ที่กอตั้งขึ้นในแมนจูเรียหลังกองทัพคันโตพิชิตดินแดนนั้น ดวยความหวังจะหยั่งรากแนวคิดปฏิวัติที่นั่น แมจะอยูไดไมนานก็ตาม เราควรใหนายกรัฐมนตรีรักษาการชวยอํานวยความสะดวกใหคนเหลานี้กลับมา แลกกับการสงนายพลบางคนไปลี้ภัย"
 JAP_return_of_the_manchukuo_exiles_tt: "เฉพาะรัฐที่มี §Y$JAP_state_infiltrated_by_the_jcp$§! เทานั้นที่จะเขารวมกับเราเมื่อเริ่ม §Yสงครามกลางเมือง§!"
 JAP_return_of_the_manchukuo_exiles_2_tt: "§Yนายพลเชื้อสายขุนนางผูภักดีตอกองทัพบกจักรวรรดิ§! §G5§! นายจะถูกสงไปยัง §Yแมนจูเรีย§! แลกกับ §Yนักอุตสาหกรรมสังคมนิยม§!"

 JAP_organize_the_fifth_column: "จัดตั้งแนวรวมที่หา"
 JAP_organize_the_fifth_column_desc: "ขณะที่กองกําลังทั้งสี่สายของเรารุกเขาใกลโอซากะและโตเกียว แนวรวมที่หาซึ่งเปนผูสนับสนุนของเราจะลุกฮือขึ้นจากภายในเมืองและบอนทําลายแนวปองกันของศัตรูจากขางใน เราจะจัดตั้ง 'แนวรวมที่หา' เหลานี้ในทุกเมืองที่เรารุกเขาใกล ทําใหเราไดเปรียบอยางเด็ดขาดในสงครามปลดปลอยชาติ"
 JAP_organize_the_fifth_column_tt: "ปลดล็อกการตัดสินใจเพื่อสนับสนุนพลพรรคให §Yสรางความเสียหายแกหนวยขาศึก§! ระหวางสงครามกลางเมือง"
 JAP_organize_the_fifth_column_2_tt: "ไดรับ 5 หนวยที่มีกองพัน §Yทหารอาสา 5§! กองพัน\n"

 JAP_revoke_the_peace_preservation_law: "ยกเลิกกฎหมายรักษาความสงบ"
 JAP_revoke_the_peace_preservation_law_desc: "กฎหมายรักษาความสงบอันชั่วรายเปดทางใหกําเนิดโทกโก ซึ่งกอความวุนวายในนามของกองทัพมาตั้งแตโอกาดะเริ่มออกมาตอตานพวกเขา กฎหมายนี้ยังขัดขวางกระบวนการประชาธิปไตย เพราะทําใหหลักการและองคกรประชาธิปไตยหลายอยางผิดกฎหมาย ถึงเวลาแลวที่เราจะลงคะแนน และฉีกกระดาษแหงหายนะแผนนี้ทิ้งเสีย"
 JAP_revoke_the_peace_preservation_law_requirements_tt: "แรงสนับสนุนรวมของ §Yคอมมิวนิสต§! และ §Yประชาธิปไตย§! เกิน 50%"
 JAP_revoke_the_peace_preservation_law_tt: "§Rอาณานิคมหลายแหงของเราอาจมองวานี่คือโอกาสที่จะแยกตัวออกจากจักรวรรดิ§!"

 JAP_a_red_sun_rises_for_a_new_era: "ตะวันแดงขึ้นสูยุคใหม"
 JAP_a_red_sun_rises_for_a_new_era_desc: "การปฏิวัติไดรับชัยชนะ วันนี้เปนของเราแลว! เมื่อกวาดลางที่มั่นสุดทายของเซลลตอตานการปฏิวัติไดแลว เราตองเริ่มลงมือจัดระเบียบรัฐใหมตามแนวทางสังคมนิยม แตภายในพรรคยังมีความเห็นแตกตางกันอยางมากวาควรทําอยางไร ดังนั้นเราตองจัดการอภิปรายครั้งใหญเพื่อกําหนดทิศทางในอนาคตของรัฐ"

 JAP_the_lecture_group_ascendant: "กลุมบรรยายขึ้นครองอํานาจ"
 JAP_the_lecture_group_ascendant_desc: "ในการอภิปราย ฝายโคซะฮะซึ่งเนนอํานาจนิยมและชนชั้นกรรมาชีพมากกวาเปนฝายชนะ ผูนําของฝายนี้ คือ ซันโซ โนซากะ และคีวอิจิ โทกูดะ จะรับภาระหนักในการสรางรัฐใหม แตคําถามที่ยังเหลืออยูคือ ใครควรเปนประธาน และใครจะเปนนายกรัฐมนตรีของชาติ?"

 JAP_the_labor_farmer_faction_ascendant: "ฝายแรงงาน-ชาวนาขึ้นครองอํานาจ"
 JAP_the_labor_farmer_faction_ascendant_desc: "ในการอภิปราย ฝายโรโนฮะซึ่งยึดอุดมคติและเนนชาวนามากกวาเปนฝายชนะ เอาชนะฝายโคซะฮะไดอยางนาอัศจรรย แมขบวนการรมใหญนี้จะไดชัยชนะ แตคําถามหลักยังคงอยูวา ใครจะเปนนายกรัฐมนตรีคนตอไปของสาธารณรัฐ?"
 JAP_the_labor_farmer_faction_ascendant_tt: "ตัวปรับคาทั้งหมดจะถูกโอนไปยัง §Y$JAP_rounouha_modifier$§!"

 JAP_sea_fate_of_the_imperial_family: "ชะตากรรมของราชวงศจักรพรรดิ"
 JAP_sea_fate_of_the_imperial_family_desc: "ถึงเวลาแลวที่จะจัดการและขจัดรองรอยสุดทายของการปกครองแบบสืบสันตติวงศในญี่ปุน เรามีหลายทางที่จะดําเนินการ แตตองระมัดระวัง เพราะราชวงศจักรพรรดิยังคงเปนที่นิยมอยางกวางขวางในหมูประชาชน เราตองตัดสินวาอดีตจักรพรรดิและพระราชวงศจะพบชะตากรรมเชนไร"

 JAP_hold_a_peoples_tribunal: "จัดตั้งศาลประชาชน"
 JAP_hold_a_peoples_tribunal_desc: "มีคนจํานวนมากที่กออาชญากรรมรายแรงในนามของรัฐบาลชุดกอน ๆ และตอสูขัดขวางและบอนทําลายการปฏิวัติและผูศรัทธาในการปฏิวัติ เราตองพิจารณาคดีคนเหลานี้ตอหนาสาธารณชน และกําจัดผูคิดตอตานการปฏิวัติใหสิ้นซากในทันที!"
 JAP_hold_a_peoples_tribunal_tt: "§Yที่ปรึกษาทางทหาร§! บางคนถูกพิจารณาคดีฐานรวมมือกับรัฐบาลเกาและถูกปลดออกจากราชการประจําการ:"

 JAP_social_and_cultural_revolution: "การปฏิวัติสังคมและวัฒนธรรม"
 JAP_social_and_cultural_revolution_desc: "บัดนี้เราตองเริ่มภารกิจอันยิ่งใหญในการขจัดเศษซากของระบบศักดินา ลัทธิชาตินิยม และขนบธรรมเนียมอนุรักษนิยม พรอมกับสงเสริมอุดมการณคอมมิวนิสตไปทั่วรัฐ เราตองถอดบูชิโดออกจากระบบการศึกษา และสงเสริมใหประชาชนสวมโยฟูกุ ทิ้งเครื่องแตงกายแบบดั้งเดิมแลวหันมาใชแบบตะวันตก เพื่อยกระดับรัฐของเราใหทัดเทียมสังคมปฏิวัติอื่น ๆ"
 JAP_social_and_cultural_revolution_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$JAP_reorganization_of_society_idea$§! ถูกนําออก:\n"

 JAP_overhaul_the_education_system: "ปฏิรูประบบการศึกษาครั้งใหญ"
 JAP_overhaul_the_education_system_desc: "ระบบการศึกษายังคงถูกครอบงําดวยแนวคิดและวิถีแบบเกา และปลูกฝงความคิดชาตินิยมและรักชาติ เราตองแกไขเรื่องนี้โดยเร็ว และปฏิรูประบบการศึกษาอยางถอนรากถอนโคน เพื่อสอนเยาวชนใหกลายเปนผูนําการปฏิวัติดวยตัวเอง"

 JAP_sea_nationalize_the_zaibatsus: "โอนไซบัตสึเปนของรัฐ"
 JAP_sea_nationalize_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาเนิ่นนาน แตมันจะสิ้นสุดลง ณ ที่นี้ อํานาจควบคุมของรัฐจะตองไมถูกทาทาย เราตองโอนกิจการเหลานี้เปนของรัฐ และใชทุนของพวกเขาเพื่อประโยชนของประชาชน!"
 JAP_can_no_longer_manually_promote_zaibatsus_tt: "เราจะไมสามารถ §Rใหการรับรองดวยตนเอง§! แก §Yกลุมไซบัตสึ§! ไดอีกตอไป"

 JAP_a_functionalist_housing_policy: "นโยบายที่อยูอาศัยแบบฟงกชันนิยม"
 JAP_a_functionalist_housing_policy_desc: "นักทฤษฎีของเราไดวางแผนใหมในการสรางกลุมอาคารอพารตเมนตหรือบานขนาดใหญในรูปแบบเฉพาะ เพื่อใชเปนที่อยูอาศัยสาธารณะภายใตการดูแลของหนวยงานรัฐ ดวยการกอสรางที่คํานึงถึงประโยชนใชสอยเปนหลัก ผูคนจํานวนมากขึ้นจะมีที่อยูอาศัยราคาถูกลงทั่วทั้งรัฐ"

 JAP_redistribute_land_and_wealth: "กระจายที่ดินและความมั่งคั่ง"
 JAP_redistribute_land_and_wealth_desc: "ที่ดินจํานวนมากทั่วประเทศยังคงเปนของตระกูลที่สืบเชื้อสายจากไดเมียวในอดีตซึ่งเคยปกครองแควนอันกวางใหญ ที่ดินเหลานี้ตองถูกกระจายใหแกชาวนาของเรา และบางสวนถูกรัฐยึดเพื่อสรางเมืองและอุตสาหกรรมใหม"

 JAP_ganbarou: "กัมบาโร!"
 JAP_ganbarou_desc: "ชายและหญิง[ROOT.GetAdjective]เปนคนขยันขันแข็งที่ทุมเทสุดกําลังเพื่อรัฐ เราควรโฆษณาชวนเชื่อเรื่องนี้ และสงเสริมการทํางานที่ดีและความขยันหมั่นเพียรใหเปนแกนแทของสังคม[ROOT.GetAdjective]"

 JAP_cooperate_with_anarchists: "รวมมือกับพวกอนาธิปไตย"
 JAP_cooperate_with_anarchists_desc: "พวกอนาธิปไตยถูกฝายอื่น ๆ ในพรรคคอมมิวนิสตญี่ปุนเขี่ยทิ้ง ตองดิ้นรนเอาตัวรอดเองตอรัฐทรราช เราควรเชิญพวกเขาเขามาในขบวนการรมใหญของเรา และทําใหอุดมคติบางสวนของพวกเขาเปนจริงไดในอนาคตที่เราวาดไว"

 JAP_the_ie_system_and_socialism: "ระบบอิเอะกับสังคมนิยม"
 JAP_the_ie_system_and_socialism_desc: "ระบบอิเอะแบบดั้งเดิมซึ่งกําหนดการจัดโครงสรางครอบครัว ไดหลอหลอมโครงสรางสังคม แนวปฏิบัติทางธุรกิจ และแมแตการจัดองคกรของบริษัทในชาติเรามาโดยตลอด เราควรรักษาระบบนี้ไว แตเนนใหรัฐเปนผูมีอํานาจสูงสุดภายในระบบ"

 JAP_fukumotoism: "ลัทธิฟูกูโมโตะ"
 JAP_fukumotoism_desc: "ฟูกูโมโตะ คาซูโอะ ยํ้าถึงความจําเปนของการตอสูทางทฤษฎีและการเมืองโดยพรรคแนวหนาหัวรุนแรง ที่จะปลูกฝงจิตสํานึกแบบมารกซิสตใหแกกรรมกรจากภายนอกผานการตอสูทางทฤษฎี เพื่อพัฒนาขบวนการใหกลายเปนการตอสูทางการเมือง หากนําแนวคิดนี้มาใชในการปกครอง เราจะมีวิธีเขาถึงประชาชนไดดีขึ้นและเผยแพรแนวคิดใด ๆ ที่เราตองการได"
 JAP_fukumotoism_tt: "ปลดล็อกการตัดสินใจที่ทําไดสูงสุด §G6§! ครั้ง ซึ่งใหโบนัส §Yโรงงานพลเรือน§! และ §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"

 JAP_the_modern_ashigaru: "อาชิงารุยุคใหม"
 JAP_the_modern_ashigaru_desc: "ทหารราบชาวนาที่เหลาขุนศึกญี่ปุนใชเสริมกําลังซามูไรในกองทัพ ซึ่งแพรหลายในยุคมูโรมาจิ เรียกวาอาชิงารุ และไมไดภักดีตอผูใดเปนพิเศษ เพื่อเสริมกําลังทหารอาชีพของเราเอง เราควรพยายามฟนฟูระบบที่คลายกัน ซึ่งชาวนามีหนาที่ปกปองรัฐเมื่อเกิดสงคราม"
 JAP_the_modern_ashigaru_tt: "ปลดล็อกการตัดสินใจ §Yระดมทหารอาสา§! เมื่ออยูในภาวะสงคราม"

 JAP_learn_from_the_nkvd: "เรียนรูจาก NKVD"
 JAP_learn_from_the_nkvd_desc: "ตํารวจลับโซเวียตไดฝกฝนศิลปะการปราบปรามผูเห็นตางและการตอตานการปฏิวัติจนถึงขั้นสมบูรณ แมเราไมตองการทํางานรวมกับพวกเขา แตบางทีเราอาจเรียนรูวิธีการของพวกเขาไดบาง"

 JAP_further_urban_investments: "ลงทุนในเขตเมืองเพิ่มเติม"
 JAP_further_urban_investments_desc: "ศูนยกลางเมืองของเราตองการการลงทุนอยางเรงดวน หากเราตองการใหอุตสาหกรรมในเมืองมีประสิทธิภาพและแรงงานเพียงพอที่จะรักษาโควตาการผลิต เราตองเขาไปชวยเหลือพวกเขา"

 JAP_the_first_five_year_plan: "แผนหาปฉบับแรก"
 JAP_the_first_five_year_plan_desc: "เพื่อรักษาอนาคตของประชาชน เราตองจัดตั้งคณะกรรมการที่สามารถสรางและนําแบบจําลองเศรษฐกิจใหมอันกลาหาญมาใชกับ[ROOT.GetNameDef] แผนหาปฉบับใหมนี้จะทําใหเราเบงบานและรุงเรืองอยางแทจริง!"

 JAP_form_pioneer_organizations: "จัดตั้งองคการยุวชนบุกเบิก"
 JAP_form_pioneer_organizations_desc: "พรรคจําเปนตองจัดตั้งองคกรสําหรับเยาวชน ใหพวกเขาไดรวมกิจกรรมเพื่อเปนคอมมิวนิสตที่แทจริง สามารถชวยเหลือรัฐและวันหนึ่งก็ปกปองรัฐได"

 JAP_war_communism: "คอมมิวนิสตยามสงคราม"
 JAP_war_communism_desc: "เราควรนําระบบเศรษฐกิจและการเมืองแบบที่เคยใชในรัสเซียโซเวียตระหวางสงครามกลางเมืองรัสเซียในป 1918 ถึง 1921 ซึ่งพวกเขาเรียกวาคอมมิวนิสตยามสงคราม มาปรับใช ระบบนี้จะชวยใหเรารักษาอํานาจควบคุมและตัดสินใจสิ่งที่จําเปนเพื่อนําการปฏิวัติไปสูสวนอื่นของเอเชียดวยกําลังอาวุธ"
 JAP_war_communism_new_economy_law: "ปลดล็อกกฎหมายเศรษฐกิจใหม: §Y$JAP_war_communism_idea$§!"

 JAP_the_uno_school_of_economics: "สํานักเศรษฐศาสตรอูโนะ"
 JAP_the_uno_school_of_economics_desc: "โคโซ อูโนะ นักทฤษฎีการเมืองและเศรษฐศาสตร ไดเสนอทฤษฎีวาจะเปลี่ยนแบบจําลองทุนนิยมเดิมใหกลายเปนการพัฒนาเศรษฐกิจที่แทจริงไดอยางไร รวมถึงสิ่งอํานวยความสะดวกที่จําเปนตอการสรางสังคมนิยมที่แทจริง ถึงเวลาแลวที่จะเริ่มทําใหทฤษฎีของเขากลายเปนความจริง"
 JAP_the_uno_school_of_economics_tt: "เริ่มภารกิจที่จะลด $MODIFIER_CONSUMER_GOODS_FACTOR$ ของเรา §Y-2.5%§! ทุกป"

 JAP_incorporate_buddhist_socialism: "ผสานสังคมนิยมแบบพุทธ"
 JAP_incorporate_buddhist_socialism_desc: "อิโนอุเอะ ชูเต็น และกิโร เซโนโอะ เสนอทฤษฎีการนําสังคมนิยมมาใชโดยยึดหลักพุทธธรรม และมองวาทั้งสองเปนแนวคิดที่คลายกัน เพราะตางมุงเปลี่ยนแปลงจิตสํานึกของปจเจกเพื่อยุติความแปลกแยกและความเห็นแกตัวของมนุษย เราควรเชิญนักคิดเหลานี้เขารวมขบวนการของเรา"

 JAP_the_spirit_of_the_ikko_ikki: "ปลุกจิตวิญญาณแหงอิกโก-อิกกิ"
 JAP_the_spirit_of_the_ikko_ikki_desc: "ชาวพุทธนิกายโจโดชินชูผูนิยมการทหารในอดีตไดพิสูจนใหโลกเห็นวาพระสงฆของเรานาเกรงขามในสนามรบ และดวยศรัทธาของพวกเขา เครือขายวัดวาอารามทําใหการระดมพลมีประสิทธิภาพและไดผลยิ่งขึ้นเมื่อถึงคราวจําเปน เราควรปลุกจิตวิญญาณของนักรบชาวพุทธเหลานี้ขึ้นมาอีกครั้งดวยความศรัทธา ขณะที่เรามุงหนาสูแดนสุขาวดี!"

 JAP_achieving_joubukkokudo: "ประกาศโจบุกโคกุโดะ"
 JAP_achieving_joubukkokudo_desc: "ดวยการรวมนครหลวงของรัฐมหายานแหงเอเชียตะวันออกเปนหนึ่ง การแสวงหาเพื่อสรางแดนสุขาวดี ซึ่งอุดมคติสังคมนิยมแบบพุทธแนวใหมจะทําใหการหลุดพนทางจิตวิญญาณ ตลอดจนการปลดแอกทางสังคมและเศรษฐกิจของเราสมบูรณ ก็ใกลบรรลุผลแลว สรรเสริญกิโร เซโนโอะ และโจบุกโคกุโดะจงเจริญ!"

 JAP_uplift_ainu_revolution_theory: "ยกยองทฤษฎีการปฏิวัติไอนุ"
 JAP_uplift_ainu_revolution_theory_desc: "นักคิดทางการเมืองหลายคนของเราใหเหตุผลวากรรมาชีพไรชนชั้น (ลุมเพนโปรเลตาเรียต) คือกําลังหลักของการปฏิวัติ และชาวไอนุก็รวมอยูในกลุมนี้ดวย ยิ่งไปกวานั้น พวกเขาเชื่อวาชาวไอนุใชชีวิตในระบบคอมมิวนิสตดั้งเดิมมาแตไหนแตไร และเห็นวาพวกเขาคูควรจะเปน 'ผูนําการปฏิวัติคอมมิวนิสต' เราควรสนับสนุนขบวนการนี้ใหกวางขวางยิ่งขึ้น"

 JAP_kikues_new_model: "แบบจําลองใหมของคิกุเอะ"
 JAP_kikues_new_model_desc: "ยามาคาวะ คิกุเอะ สงเสริมแนวคิดยกระดับสตรีญี่ปุนใหเปนสวนหนึ่งของสังคมอยางเทาเทียมมาชานาน และตองการประกันคาจางและสิทธิการจางงานที่เทาเทียม พรอมทั้งยกเลิกระบบครัวเรือนแบบปตาธิปไตย ถึงเวลาแลวที่จะเปลี่ยนอุดมคติเหลานี้ใหเปนจริง!"

 JAP_women_in_industry: "สตรีในภาคอุตสาหกรรม"
 JAP_women_in_industry_desc: "นานเกินไปแลวที่สตรีถูกคาดหวังใหอยูบานดูแลครอบครัว หากสตรีสามารถเปนผูนําประเทศได ก็สมควรแลวที่จะใหพวกเธอทํางานในอุตสาหกรรมอื่น ๆ ดวย สิ่งนี้จะชวยอนาคตทางเศรษฐกิจของ[ROOT.GetNameDef] เพราะจะขยายกําลังแรงงานของเราไดอยางมหาศาล"

 JAP_form_national_cooperatives: "จัดตั้งสหกรณแหงชาติ"
 JAP_form_national_cooperatives_desc: "นักคิดหลายคนของเราสนับสนุนการจัดตั้งสหกรณแหงชาติเพิ่มขึ้น ซึ่งเปนองคกรที่กอตั้งโดยปจเจกบุคคลหรือธุรกิจที่มีความตองการทางเศรษฐกิจ สังคม หรือวัฒนธรรมรวมกัน ดําเนินงานบนหลักการความเปนเจาของรวมของสมาชิก การควบคุมแบบประชาธิปไตย และผลประโยชนรวมกัน เราควรสงเสริมการจัดตั้งสหกรณเหลานี้"

 JAP_further_rural_investments: "ลงทุนในชนบทเพิ่มเติม"
 JAP_further_rural_investments_desc: "ภูมิภาคชนบทของเราถูกรัฐบาลกลางละเลยมานาน และการพัฒนาอุตสาหกรรมอยางรวดเร็วของเมืองอยางโตเกียวไดดึงผูคนออกจากชนบท ทิ้งใหเมืองเล็กและหมูบานหลายแหงตกอยูในสภาพยํ่าแย เราตองลงทุนในพื้นที่เหลานี้ เพื่อใหแรงงานที่จําเปนตอการดํารงอยูของพื้นที่ยังคงอยูตอไป"
 JAP_further_rural_investments_tt: "ปลดล็อกการตัดสินใจเพื่อ §Gยกระดับ§! §Yประเภทของรัฐ§! ของรัฐขางตน หากรัฐนั้นมี §Yโครงสรางพื้นฐาน§! ตั้งแต §Y4§! ขึ้นไป"

 JAP_adopt_syndicalist_ideas: "รับแนวคิดสหการนิยม"
 JAP_adopt_syndicalist_ideas_desc: "เราควรรับแนวคิดการจัดตั้งสหกรณแบบสหการนิยมในภาคอุตสาหกรรม และนําแนวคิดของพวกเขาเรื่องความสัมพันธระหวางปจเจกกับนายจางมาใชปรับปรุงแบบจําลองอุตสาหกรรมปจจุบันของเรา"

 JAP_raise_the_red_flag_high: "ชูธงแดงใหสูงเดน"
 JAP_raise_the_red_flag_high_desc: "ธงแดงคือสัญลักษณแหงการปฏิวัติของเรา และแสดงถึงความมุงมั่นในการผลักดันการปฏิวัติไปขางหนา ดวยความหวังวาวันหนึ่งจะปลดปลอยกรรมกรเอเชียทั้งมวลจากการกดขี่ของชนชั้นนายทุน ถึงเวลาแลวที่จะชูธงขึ้นสูงอยางภาคภูมิ และประกาศวาการปฏิวัติจะเดินหนาตอไปตลอดกาล!"

 JAP_guide_the_lesser_states: "ชี้นํารัฐที่ดอยกวา"
 JAP_guide_the_lesser_states_desc: "รัฐในเอเชียที่ดอยพัฒนากวาไมมีเงื่อนไขพื้นฐานที่จะกอการปฏิวัติและสถาปนาสาธารณรัฐกรรมกรของตนเองไดสําเร็จ เราตองชี้นําพวกเขา และแสดงใหเห็นวาการบริหารรัฐที่ถูกตองเปนอยางไร"
 JAP_pan_asian_revolutuonary_front: "แนวรวมปฏิวัติแพนเอเชีย"

 JAP_socialism_in_one_state: "สังคมนิยมในรัฐเดียว"
 JAP_socialism_in_one_state_desc: "ผูที่จะใหการศึกษาและยกระดับประชาชนแหงเอเชียไดมีเพียงเรา ผูแสดงใหเห็นแลววาการปฏิวัติสามารถสําเร็จได เราตองนําพวกเขาเขามาอยูในออมอก เพื่อแสดงใหเห็นวาควรดําเนินชีวิตอยางไร แมจะตองใชกําลังอาวุธก็ตาม"

 JAP_the_courage_to_defend_the_revolution: "ความกลาที่จะปกปองการปฏิวัติ"
 JAP_the_courage_to_defend_the_revolution_desc: "ชายและหญิงทุกคนตองแสดงความกลาหาญและความมุงมั่นในการปกปองการปฏิวัติจากกองกําลังตอตานการปฏิวัติมากมายทั่วโลก ถึงเวลาแลวที่จะปกปองอุดมคติของเราดวยทุกสิ่งที่เรามี!"

 JAP_demand_submission_from_breawakay_states: "เรียกรองใหรัฐที่แยกตัวยอมสยบ"
 JAP_demand_submission_from_breawakay_states_desc: "รัฐที่แยกตัวออกไปอยางผิดกฎหมายเพียงแคทําผิดพลาด และไมไดตระหนักวาการปฏิวัติของประชาชนจะประสบความสําเร็จ เราควรเขาหาพวกเขาและแถลงอยางหนักแนน เรียกรองใหพวกเขายอมสยบตอพรรค และปลอยใหประชาชนของพวกเขาเปนอิสระจากการกดขี่ของทุนนิยม"

 JAP_ignite_the_korean_peninsula: "จุดไฟที่คาบสมุทรเกาหลี"
 JAP_ignite_the_korean_peninsula_desc: "ประชาชน[KOR.GetAdjective]ยังไมไดรับการปลดปลอย เราควรติดตอกับนักปฏิวัติทางตอนใตของ[KOR.GetAdjective] และใหพวกเขาเริ่มการปฏิวัติ นี่จะเปดโอกาสใหเราเขาไปปกปองประชาชน[KOR.GetAdjective]จากสงครามกลางเมืองที่ตามมา"
 JAP_ignite_the_korean_peninsula_tt: "กอสงครามกลางเมืองใน[KOR.GetNameDef] โดยฝายคอมมิวนิสตจะกลายเปนรัฐหุนเชิดของเรา"

 JAP_protect_the_manchurians: "ปกปองชาวแมนจู"
 JAP_protect_the_manchurians_desc: "ชาวแมนจูยังคงถูกกดขี่โดยเศษซากกองทัพคันโตเกาของเรา เราตองเก็บกวาดความยุงเหยิงที่ตัวเองกอ และเคลื่อนพลเขาไปปลดปลอยประชาชน ถึงเวลาแลวที่จะยุติการตอสู และสะสางบัญชีกับกองทัพบกจักรวรรดิ!"

 JAP_guide_the_chinese: "ชี้นําชาวจีน"
 JAP_guide_the_chinese_desc: "การปฏิวัติยังไมประสบความสําเร็จในจีน เราตองเขาไปชี้นําประชาชนจีนดวยตนเองสูความรุงเรือง และปลดปลอยพวกเขาจากวิถีชีวิตแบบศักดินาที่ลาหลัง"
 JAP_guide_the_chinese_tt: "เราจะไดรับเปาหมายสงคราม §Yรัฐหุนเชิด§! ตอรัฐ §Yจีนที่ไมใชคอมมิวนิสต§! ทุกรัฐ เปาหมายปจจุบัน:"
 JAP_guide_the_chinese_2_tt: "ประเทศ §Yจีนคอมมิวนิสต§! ทุกประเทศจะไดรับเชิญเขารวมฝายของเรา เปาหมายปจจุบัน:"

 JAP_guide_the_mongols: "ชี้นําชาวมองโกล"
 JAP_guide_the_mongols_desc: "การปฏิวัติอาจสําเร็จในบางสวนของมองโกเลีย แตบัดนี้พวกเขากลับตกอยูใตการกดขี่ของโซเวียตแทน เราตองเขาไปชี้นําประชาชนมองโกเลียดวยตนเองสูความรุงเรือง และปลดปลอยพวกเขาจากวิถีชีวิตแบบศักดินาที่ลาหลังและเผด็จการ"

 JAP_spread_the_revolutuon_south: "สงการปฏิวัติลงใต"
 JAP_spread_the_revolutuon_south_desc: "เปลวไฟแหงการปฏิวัติตองถูกนําลงใตอยางรวดเร็ว หากประชาชนแหงเอเชียจะไดรับการปลดปลอย ถึงเวลาแลวที่เราจะโจมตี และสรางอนาคตที่สดใสกวาใหชาวเอเชียทุกคน!"

 JAP_free_asians_from_soviet_opression: "ปลดปลอยชาวเอเชียจากการยึดครองของโซเวียต"
 JAP_free_asians_from_soviet_opression_desc: "พวกบอลเชวิครัสเซียก็ไมไดดีไปกวาพวกนายทุนที่ตองการควบคุมประชาชนและพรากอนาคตของพวกเขา เราไมอาจนิ่งดูดายขณะที่พวกเขายังกดขี่ชาวเอเชียตอไป ถึงเวลาลงมือแลว!"

 JAP_go_after_the_capitalists: "ไลลาพวกนายทุน"
 JAP_go_after_the_capitalists_desc: "นายทุนตะวันตกตองการขูดรีดประชาชนแหงเอเชียโดยไมเคยใหอะไรตอบแทน เราตองโคนพวกเขาลงกอนที่พวกเขาจะขูดรีดประชาชนจนถึงจุดที่ไมอาจหวนกลับ"

 JAP_a_free_asia_pacific: "เอเชีย-แปซิฟกเสรี"
 JAP_a_free_asia_pacific_desc: "วันนั้นมาถึงแลวในที่สุด วันที่ผูคนทั่วเอเชียจะใชชีวิตไดอยางอิสระโดยไมถูกขูดรีดจากชาวตางชาติและรัฐบาลที่ไมใสใจความเปนอยูของพวกเขา [ROOT.GetNameDef]จงเจริญ และกรรมกรแหงเอเชียจงเจริญ!"

 JAP_the_pan_asian_revolutionary_front: "แนวรวมปฏิวัติแพนเอเชีย"
 JAP_the_pan_asian_revolutionary_front_desc: "เพื่อชี้นําพรรคปฏิวัติตาง ๆ ในเอเชีย เราตองจัดตั้งพันธมิตรและองคกรเหนือรัฐที่ออกคําสั่งแกรัฐที่ดอยพัฒนากวา และสามารถประสานการลงทุนเพื่อพัฒนาสังคมของพวกเขาไดรวดเร็วยิ่งขึ้น"

 JAP_educate_the_peasants: "ใหการศึกษาแกชาวนา"
 JAP_educate_the_peasants_desc: "การศึกษาของชาวนาบนแผนดินใหญถูกละเลยมานานเกินไปแลว ถึงเวลาที่เราจะเริ่มประสานความรวมมือระหวางสมาชิกพันธมิตร เพื่อยกระดับความรูของกําลังแรงงาน"
 JAP_educate_the_peasants_tt: "โบนัสความเร็วการวิจัยจาก §Y$JAP_educating_the_peasants_modifier$§! จะเพิ่มขึ้น §G1%§! ตอสมาชิกฝายใหมแตละราย สูงสุด §G10%§!"

 JAP_a_common_currency_for_all_of_asia: "สกุลเงินรวมสําหรับทั่วเอเชีย"
 JAP_a_common_currency_for_all_of_asia_desc: "ในฐานะสวนหนึ่งของการประสานงานระหวางประเทศ เราควรผลักดันใหรัฐปฏิวัติทั้งหมดใชเงินเยนเปนสกุลเงินทางการ เพื่อใหสามารถจัดตั้งสหภาพศุลกากรและการคาไดอยางเหมาะสม"

 JAP_the_minitry_of_pan_asian_development: "กระทรวงพัฒนาแพนเอเชีย"
 JAP_the_minitry_of_pan_asian_development_desc: "เพื่อยกระดับสภาพความเปนอยูในรัฐตาง ๆ ของเอเชียใหดียิ่งขึ้น เราควรจัดตั้งกระทรวงกลางที่กํากับดูแลการลงทุนเพื่อการพัฒนา และชวยจัดโครงการดานอุตสาหกรรมและเศรษฐกิจ"

 JAP_development_for_the_undeveloped: "พัฒนาผูดอยพัฒนา"
 JAP_development_for_the_undeveloped_desc: "เพื่อใหเกิดการปฏิวัติที่แทจริง เราตองพัฒนารัฐที่ดอยพัฒนากวา และยกระดับโครงสรางพื้นฐานและขีดความสามารถทางอุตสาหกรรมของสมาชิกที่ดอยกวาในพันธมิตร"

 JAP_a_pan_asian_diet: "สภาไดเอ็ตแพนเอเชีย"
 JAP_a_pan_asian_diet_desc: "เพื่อใหรัฐปฏิวัติแหงเอเชียใกลชิดกันยิ่งขึ้น เราควรจัดตั้งองคกรปกครองที่มีผูแทนจากรัฐสมาชิกทุกรัฐ ซึ่งจะลงมติวาจะนํากฎหมายและสถาบันใดมาใชในสาธารณรัฐพี่นองของเรา"

 JAP_extensive_navy_maneuvers: "เริ่มการซอมรบทางทะเลครั้งใหญ"
 JAP_extensive_navy_maneuvers_desc: "เพื่อปราบรัฐที่แยกตัวออกไปเมื่อชาติของเราลมสลายเขาสูสงครามกลางเมือง เราตองทําใหมั่นใจวากองทัพเรือของเรามีความพรอมเต็มที่ที่จะรับมือพวกเขา ดังนั้นเราควรจัดการซอมรบขนาดใหญเพื่อใหมั่นใจวาเราพรอมสําหรับการรบ"

 JAP_extensive_army_maneuvers: "เริ่มการซอมรบทางบกครั้งใหญ"
 JAP_extensive_army_maneuvers_desc: "เพื่อปราบกองทัพคันโตที่ยึดแมนจูเรียไวเมื่อชาติของเราลมสลายเขาสูสงครามกลางเมือง เราตองทําใหมั่นใจวากองทัพบกของเรามีความพรอมเต็มที่ที่จะรับมือพวกเขา ดังนั้นเราควรจัดการซอมรบขนาดใหญเพื่อใหมั่นใจวาเราพรอมสําหรับการรบ"

 JAP_reclaim_lost_territories: "ทวงคืนดินแดนที่สูญเสีย"
 JAP_reclaim_lost_territories_desc: "ถึงเวลาแลวที่จะหวนกลับไปยังดินแดนที่แยกตัวออกจากเขตอิทธิพลของเรา และนําพวกเขากลับเขาสูสาธารณรัฐของเรา มีเพียงการแทรกแซงทางทหารเทานั้นที่จะรับประกันไดวาประชาชนในดินแดนเหลานี้จะเจริญรุงเรือง"

 JAP_conquer_the_army_remnants: "พิชิตเศษซากกองทัพ"
 JAP_conquer_the_army_remnants_desc: "ถึงเวลาแลวที่จะยุติการตอสูที่เราเริ่มไว และปดฉากเศษซากสุดทายของกองทัพบกจักรวรรดิและสงครามกลางเมืองของเรา เราตองโคนกองทัพคันโต และยึดแมนจูเรียคืนมา!"

 JAP_put_an_end_to_chinese_feudalism: "ยุติระบบศักดินาจีน"
 JAP_put_an_end_to_chinese_feudalism_desc: "ขนบแบบศักดินายังคงครองอํานาจสูงสุดในจีน และมีผูคนนับลานที่ตองไดรับการปลดปลอยและนําเขาสูสาธารณรัฐปฏิวัติของเรา คําสั่งจะถูกประกาศ และประชาชนจีนจะไดรับการปลดปลอยอยางถาวร!"

 JAP_mobilize_the_proletariat: "ระดมกําลังชนชั้นกรรมาชีพ"
 JAP_mobilize_the_proletariat_desc: "กรรมกรทํางานไดดีในการผลิตอาวุธใหกองทัพอยางขยันขันแข็ง แตยามวิกฤตยอมตองใชมาตรการเด็ดขาด ถึงเวลาแลวที่เราจะเพิ่มโควตาการผลิต แมเพียงชั่วคราว เพื่อใหกองทัพไดรับอาวุธทุกชิ้นที่ตองการ"

 JAP_the_long_march_to_victory: "การเดินทัพทางไกลสูชัยชนะ"
 JAP_the_long_march_to_victory_desc: "เพื่อทําลายรัฐบาลจีน เราจําเปนตองเดินทัพลึกเขาไปในแผนดินใหญเอเชีย เราควรจัดการรณรงคโฆษณาชวนเชื่อที่อางอิงถึงการเดินทัพทางไกล โดยหวังวาจะเพิ่มความเต็มใจของทหารที่จะเดินหนาตอไปไมวาจะนานเพียงใด!"

 JAP_the_pacific_union_of_soviet_socialist_republics: "สหภาพสาธารณรัฐสังคมนิยมโซเวียตแปซิฟก"
 JAP_the_pacific_union_of_soviet_socialist_republics_desc: "ชวงเวลาที่เราดิ้นรนไขวความาถึงแลวในที่สุด ถึงเวลาประกาศสถาปนารัฐใหมแหงเอเชีย ซึ่งจะรวมโซเวียตตาง ๆ เขาเปนสหภาพเดียว"
 JAP_the_pacific_union_of_soviet_socialist_republics_tt: "เราจะเปนที่รูจักในนาม §Yสหภาพสาธารณรัฐสังคมนิยมโซเวียตแปซิฟก§!"

 JAP_the_indochinese_soviet: "โซเวียตอินโดจีน"
 JAP_the_indochinese_soviet_desc: "เมื่อสหภาพกอตั้งขึ้นแลว เราตองสถาปนาสาธารณรัฐโซเวียตใหม ๆ และนําพวกเขาเขามารวม เราควรสรางโซเวียตอินโดจีนเพื่อใหความชอบธรรมแกการยึดครองภูมิภาคนี้"

 JAP_transformation_of_nature: "การแปรเปลี่ยนธรรมชาติ"
 JAP_transformation_of_nature_desc: "เอเชียอุดมดวยทรัพยากรธรรมชาติที่รอการนํามาใช ดวยวงการวิทยาศาสตรของเราที่ผลักขีดจํากัดของสิ่งที่เคยคิดวาเปนไปได แมแตโครงการที่ใหญโตและรุกลํ้าธรรมชาติที่สุดก็เริ่มเปนไปได สิ่งแวดลอมตองถูกปรับแตงและหลอหลอมในระดับมหาศาลเพื่อประโยชนของประชาชน!"

 JAP_the_south_pacific_soviet: "โซเวียตแปซิฟกใต"
 JAP_the_south_pacific_soviet_desc: "เมื่อสหภาพกอตั้งขึ้นแลว เราตองสถาปนาสาธารณรัฐโซเวียตใหม ๆ และนําพวกเขาเขามารวม เราควรสรางโซเวียตแปซิฟกใตเพื่อใหความชอบธรรมแกการยึดครองภูมิภาคนี้"

 JAP_the_oceanian_soviet: "โซเวียตโอเชียเนีย"
 JAP_the_oceanian_soviet_desc: "เมื่อโซเวียตแปซิฟกใตสถาปนาขึ้นแลว เราควรขยายพรมแดนลงใตตอไป ดวยเหตุนี้ เราควรสรางโซเวียตโอเชียเนียเพื่อใหความชอบธรรมแกการยึดครองภูมิภาคนี้"

 JAP_strike_down_the_great_pretender: "โคนจอมหลอกลวงผูยิ่งใหญ"
 JAP_strike_down_the_great_pretender_desc: "พวกบอลเชวิคในสหภาพโซเวียตแสรงทําเปนอยูขางประชาชน แตกลับปกครองบางสวนของเอเชียอยางทรราช เราควรโคนเผด็จการชนชั้นนายทุนที่สวมรอยเปนพลังปฏิวัตินี้ และประกาศวาเราคือผูพิทักษการปฏิวัติเพียงหนึ่งเดียว!"

 JAP_a_red_dawn_over_asia: "รุงอรุณสีแดงเหนือเอเชีย"
 JAP_a_red_dawn_over_asia_desc: "เมื่อกองทัพของเราไดรับชัยชนะ และพรมแดนของเราแผไปทั่วมหาสมุทรแปซิฟกอันกวางใหญ การปฏิวัติก็ใกลชัยชนะยิ่งกวาครั้งใดที่เคยมีมา ตะวันแดงสองสวางทั่วฟา ขณะที่รุงอรุณนําพายุคใหมมาสูเอเชีย!"

 JAP_to_rival_the_comintern: "ทาชิงองคการโคมินเทิรน"
 JAP_to_rival_the_comintern_desc: "นับตั้งแตพวกทรอตสกีสถาปนาองคการสากลที่สี่ขึ้น หลายฝายก็เรียกรองใหจัดตั้งองคการคอมมิวนิสตสากลที่หา เพื่อถวงดุลทั้งองคการนั้นและโคมินเทิรน เราควรรับบทบาทนี้ และประกาศวาเราคือผูพิทักษการปฏิวัติที่แทจริง!"
 JAP_alternative_communist_international: "องคการคอมมิวนิสตสากลที่หา"

 JAP_wrestle_mongolia_from_the_soviets: "ดึงมองโกลออกจากเขตอิทธิพลโซเวียต"
 JAP_wrestle_mongolia_from_the_soviets_desc: "ชาวมองโกลตกอยูใตอํานาจของรัสเซียมาหลายป และโหยหาโอกาสที่จะตีตัวออกหางจากชาวยุโรป เราสามารถมอบโอกาสนั้นใหพวกเขาได และควรเชิญพวกเขาเขารวมองคการสากล อยางไรก็ตาม การนี้อาจทําใหความตึงเครียดกับ[SOV.GetNameDef]เพิ่มขึ้น"

 JAP_wrestle_tuva_from_the_soviets: "ดึงตูวาออกจากเขตอิทธิพลโซเวียต"
 JAP_wrestle_tuva_from_the_soviets_desc: "ชาวตูวาตกอยูใตอํานาจของรัสเซียมาหลายป และโหยหาโอกาสที่จะตีตัวออกหางจากชาวยุโรป เราสามารถมอบโอกาสนั้นใหพวกเขาได และควรเชิญพวกเขาเขารวมองคการสากล อยางไรก็ตาม การนี้อาจทําใหความตึงเครียดกับ[SOV.GetNameDef]เพิ่มขึ้น"

 JAP_spread_revolutionary_flames_to_south_asia: "โหมไฟปฏิวัติสูเอเชียใต"
 JAP_spread_revolutionary_flames_to_south_asia_desc: "เปลวไฟแหงการปฏิวัติแผขยายไปไกลและกวาง และการรณรงคที่ประสบความสําเร็จของเราไดจุดประกายแกชนชั้นกรรมาชีพทุกหนแหง เราควรเริ่มใหทุนแกกลุมปฏิวัติในเอเชียใต เพื่อบั่นทอนเสถียรภาพของภูมิภาคและนําพวกเขาเขาสูองคการสากลที่หา"
 JAP_spread_revolutionary_flames_to_south_asia_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญประเทศ §Yคอมมิวนิสตในเอเชียใต§! เขารวมฝายของเรา"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt: "ปลดล็อกการตัดสินใจ §Yปลุกกระแสคอมมิวนิสต§! ภายในประเทศ §Yเอเชียใต§!"

 JAP_spread_revolutionary_flames_to_west_asia: "โหมไฟปฏิวัติสูเอเชียตะวันตก"
 JAP_spread_revolutionary_flames_to_west_asia_desc: "เปลวไฟแหงการปฏิวัติแผขยายไปไกลและกวาง และการรณรงคที่ประสบความสําเร็จของเราไดจุดประกายแกชนชั้นกรรมาชีพทุกหนแหง เราควรเริ่มใหทุนแกกลุมปฏิวัติในเอเชียตะวันตก เพื่อบั่นทอนเสถียรภาพของภูมิภาคและนําพวกเขาเขาสูองคการสากลที่หา"
 JAP_spread_revolutionary_flames_to_west_asia_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญประเทศ §Yคอมมิวนิสตในตะวันออกกลาง§! เขารวมฝายของเรา"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt: "ปลดล็อกการตัดสินใจ §Yปลุกกระแสคอมมิวนิสต§! ภายในประเทศ §Yตะวันออกกลาง§!"

 JAP_trans_pacific_influence: "อิทธิพลขามแปซิฟก"
 JAP_trans_pacific_influence_desc: "เปลวไฟแหงการปฏิวัติแผขยายไปไกลและกวาง และการรณรงคที่ประสบความสําเร็จของเราไดจุดประกายแกชนชั้นกรรมาชีพทุกหนแหง เราควรเริ่มใหทุนแกกลุมปฏิวัติอีกฟากหนึ่งของมหาสมุทร เพื่อบั่นทอนเสถียรภาพของภูมิภาคและนําพวกเขาเขาสูองคการสากลที่หา"
 JAP_trans_pacific_influence_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญประเทศ §Yคอมมิวนิสตในอเมริกาใต§! เขารวมฝายของเรา"

 JAP_build_an_anti_army_coalition: "สรางแนวรวมตอตานกองทัพ"
 JAP_build_an_anti_army_coalition_desc: "เพื่อตานทานอิทธิพลอันแข็งแกรงของกองทัพ เราไมอาจทะเลาะกันระหวางพรรคตอไปได เราตองพยายามจัดตั้งรัฐบาลผสมที่จะรวมกันผลักดันญี่ปุนไปสูอนาคตที่สดใสกวา"

 JAP_ensure_cross_party_support: "ประกันความรวมมือขามพรรค"
 JAP_ensure_cross_party_support_desc: "เมื่อรัฐบาลผสมกําลังกอตัวขึ้น เราตองพยายามไดรับการสนับสนุนจากพรรคอื่น ๆ ดวย เพื่อไมใหเราพังทลายเมื่อเผชิญความยากลําบาก ดวยกัน เราจะนําจิตวิญญาณแหงประชาธิปไตยไทโชกลับคืนมา!"

 JAP_gather_royal_pacifists_support: "รวบรวมแรงสนับสนุนจากเชื้อพระวงศผูรักสันติ"
 JAP_gather_royal_pacifists_support_desc: "มีหลายพระองคในราชวงศที่ไมสนับสนุนแนวคิดใหกองทัพครอบงําการเมืองและหลักนิยมสงครามเบ็ดเสร็จ เราควรติดตอซาดาโกะ คุโจ, โนบูฮิโตะ และโคอิจิ คิโดะ เพื่อขอการสนับสนุนในการขับไลฝายทหารออกจากรัฐบาลของเรา"
 JAP_gather_royal_pacifists_support_tt: "หาก §Yจักรพรรดิฮิโรฮิโตะ§! เขาขางฝายทหารระหวาง §Yสงครามกลางเมือง§! เราจะยังคงไดรับ §Yการสนับสนุนจากราชวงศ§! จากพระอนุชา §Yโนบูฮิโตะ§! และพระราชมารดา §Yซาดาโกะ คุโจ§!"

 JAP_limit_military_power: "ผลักดันการจํากัดอํานาจทหาร"
 JAP_limit_military_power_desc: "เพื่อปองกันรัฐประหารอีกครั้ง เราควรลดตําแหนงบุคลากรทางทหารออกจากตําแหนงที่มีอํานาจใหไดมากที่สุดเทาที่จะทําไดโดยไมยั่วยุใหเกิดกบฏ ดวยวิธีนี้ เราอาจหยุดพวกเขาไมใหดับคบเพลิงแหงเสรีภาพได"
 JAP_limit_military_power_tt: "เมื่อเกิด §Yสงครามกลางเมือง§! ฝายตรงขามจะไดรับจิตวิญญาณแหงชาติตอไปนี้เปนเวลา §Y365§! วัน:"

 JAP_divert_military_funds: "เบี่ยงงบประมาณทหาร"
 JAP_divert_military_funds_desc: "เมื่อการกบฏดูใกลเขามาทุกที หากเราตองการบั่นทอนกองทัพใหออนแอจนไมอาจโคนเราได เราตองเบี่ยงงบประมาณของพวกเขาไปยังแหลงอื่น ดวยวิธีนี้ พวกเขาจะตองขาดแคลนงบประมาณไปอีกนาน"
 JAP_divert_military_funds_tt: "ทุกรัฐที่ไมไดอยูใต §Yการควบคุมของกองทัพ§! จะเขารวมกับเราเมื่อเริ่ม §Yสงครามกลางเมือง§!"

 JAP_sway_the_navy_moderates: "โนมนาวสายกลางในกองทัพเรือ"
 JAP_sway_the_navy_moderates_desc: "ในกองทัพเรือมีบุคคลระดับสูงหลายคนที่มีเหตุผลกวาคนในกองทัพบกมาก หากเราเขาหาอดีตสมาชิกฝายสนธิสัญญา เราอาจไดรับการรับรองจากพวกเขา และอาจถึงขั้นไดรับการสนับสนุนหากเกิดสงครามกลางเมือง"
 JAP_sway_the_navy_moderates_tt: "เราจะรักษาสวนแบงที่ใหญขึ้นของ §Yกองทัพเรือจักรวรรดิ§! และกําลังพลของพวกเขาไวสําหรับ §Yสงครามกลางเมือง§!"
 JAP_sway_the_navy_moderates_2_tt: "§Yพลเรือเอก§! §G4§! นายจะภักดีตอเรา"

 JAP_bribe_generals: "ติดสินบนนายพล"
 JAP_bribe_generals_desc: "แมจะหัวรุนแรง แตไมใชเสนาธิการทหารทุกคนที่อยากอยูฝายอธรรม พวกเขารวมกับสหายในกองทัพเพราะหนาที่และเกียรติยศ แตบางทีพวกเขาอาจถูกโนมนาวใหสนับสนุนเปาหมายที่ดีกวาได หากใชเวลาและความพยายามมากพอ"
 JAP_bribe_generals_tt: "§Yนายพล§! §G4§! นายจะภักดีตอเรา"

 JAP_appoint_new_generals: "แตงตั้งนายพลใหม"
 JAP_appoint_new_generals_desc: "เมื่อนายพลจํานวนมากตัดสินใจตอตานเรา เราจึงเผชิญภาวะขาดแคลนนายทหารที่มีความสามารถในการนําทัพ เราตองทําทุกวิถีทางเพื่อแกไขปญหานี้ และรับผูบัญชาการกองทัพรุนใหมเขามา"

 JAP_implement_army_reforms: "ดําเนินการปฏิรูปกองทัพ"
 JAP_implement_army_reforms_desc: "เมื่อกําจัดเสนาธิการทหารชุดเกาแลว ก็ถึงเวลาที่จะกําจัดแนวคิดการสงครามอันลาสมัยของพวกเขาดวย กองทัพจะคอย ๆ ถูกจัดระเบียบใหมเปนกองกําลังปองกันตนเอง และ 'หลักการโจมตีกอน' จะกลายเปนแนวคิดในอดีตไปในไมชา"
 JAP_implement_army_reforms_tt: "§Rตัด§!ความสามารถในการรับตัวปรับคา §Yหลักการโจมตีกอน§! และ §Yคันไต เคสเซ็น§! ที่ไดจากแผนยุทธศาสตร §Yแผนปองกันจักรวรรดิ§!"

 JAP_a_new_take_on_state_shintoism: "สงเสริมทฤษฎีศาลเจาทางโลก"
 JAP_a_new_take_on_state_shintoism_desc: "นโยบายทางศาสนาและทฤษฎีทางการเมืองที่เกิดขึ้นในสมัยรัฐบาลเมจิ ซึ่งเรียกวา จินจะ ฮิชูเกียวรง สงเสริมแนวคิดวาศาลเจาชินโตมีลักษณะทางโลกมากกวาทางศาสนา และชินโตเปนเพียงชุดขนบประเพณีแหงชาติของญี่ปุนที่ไมเกี่ยวกับศาสนา เราควรสงเสริมทฤษฎีนี้ตอไป เพื่อใชประโยชนจากกระแสนี้ใหเปนผลดีแกเรา"

 JAP_crush_the_spirit_of_gekokujo: "บดขยี้จิตวิญญาณเกโกกุโจ"
 JAP_crush_the_spirit_of_gekokujo_desc: "ในชวงตนยุคโชวะ เกิดเหตุการณเกโกกุโจซํ้าแลวซํ้าเลา ซึ่งผูมียศตํ่ากวาในกองทัพพยายามขับไลผูอยูในตําแหนงสูงกวา สิ่งนี้คุกคามที่จะทําลายสายการบังคับบัญชาของเรา เราตองปราบปรามแนวคิดเหลานี้โดยเร็วที่สุด!"

 JAP_organize_a_general_election: "จัดการเลือกตั้งทั่วไป"
 JAP_organize_a_general_election_desc: "เมื่อความขัดแยงภายในยุติลงในที่สุด ก็ถึงเวลาเตรียมฟนฟูและหวนคืนสูขนบประชาธิปไตยของเรา เปนครั้งแรกนับตั้งแตสมัยเมจิ เราควรจัดการเลือกตั้งที่ปลอดจากอิทธิพลและการฉอฉลของฝายทหาร และใหประชาชนตัดสินอนาคตของตนเอง!"

 JAP_draft_the_showa_constitution: "[JAP_draft_the_showa_constitution_key]"
 JAP_draft_the_showa_constitution_desc: "[JAP_draft_the_showa_constitution_desc_key]"
 JAP_draft_the_showa_constitution_key_emperor_eian: "รางรัฐธรรมนูญเออัน" # Eian (永安)
 JAP_draft_the_showa_constitution_key_emperor_showa: "รางรัฐธรรมนูญโชวะ"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian: "เรายอมรับและเคารพประวัติศาสตรจักรวรรดิของชาติ แตอํานาจนิยมไมมีที่ยืนในญี่ปุนที่เราตองการสราง เราจะคงจักรพรรดิองคใหมไวเปนประมุขในนาม แตจะจํากัดพระราชอํานาจไวในรัฐธรรมนูญ เชนเดียวกับในหลายประเทศตะวันตก"
 JAP_draft_the_showa_constitution_desc_key_emperor_showa: "เรายอมรับและเคารพประวัติศาสตรจักรวรรดิของชาติ แตอํานาจนิยมไมมีที่ยืนในญี่ปุนที่เราตองการสราง เราจะคงจักรพรรดิไวเปนประมุขในนาม แตจะจํากัดพระราชอํานาจไวในรัฐธรรมนูญ เชนเดียวกับในหลายประเทศตะวันตก"

 JAP_form_the_ldp: "กอตั้งพรรค LDP"
 JAP_form_the_ldp_desc: "เมื่อพรรคริกเก็นเซยูไกครองทั้งสภาไดเอ็ตและคณะรัฐมนตรีไดแลว ก็ถึงเวลาปฏิรูปพรรคใหเปนองคกรปกครองที่มีประสิทธิภาพยิ่งขึ้น ตามแนวทางของอิจิโร ฮาโตยามะ ถึงเวลาจัดตั้งพรรคเสรีประชาธิปไตย โดยมุงปกครองประเทศไปอีกนานเทาที่มองเห็น" 

 JAP_rikken_minseito_victory: "ชัยชนะของพรรคริกเก็นมินเซโต"
 JAP_rikken_minseito_victory_desc: "ผลการเลือกตั้งไดขอยุติแลว พรรคริกเก็นมินเซโตแนวเสรีนิยมกาวหนาชนะอยางถลมทลาย และจะครองเสียงขางมากอยางชัดเจนตอจากนี้ ดูเหมือนประชาชนไดตัดสินแลววาตองการใหประเทศเดินไปในทิศทางใด"
 JAP_rikken_minseito_victory_flag: "พรรคริกเก็นมินเซโตชนะการเลือกตั้งทั่วไป"

 JAP_rikken_seiyukai_victory: "ชัยชนะของพรรคริกเก็นเซยูไก"
 JAP_rikken_seiyukai_victory_desc: "ผลการเลือกตั้งไดขอยุติแลว พรรคริกเก็นเซยูไกแนวเสรีนิยมอนุรักษชนะอยางถลมทลาย และจะครองเสียงขางมากอยางชัดเจนตอจากนี้ ดูเหมือนประชาชนไดตัดสินแลววาตองการใหประเทศเดินไปในทิศทางใด"
 JAP_rikken_seiyukai_victory_flag: "พรรคริกเก็นเซยูไกชนะการเลือกตั้งทั่วไป"

 JAP_minshu_shugi: "มินชู ชูงิ"
 JAP_minshu_shugi_desc: "แมที่ผานมาเราจะยึดหลักการเมืองแบบมินปง ชูงิ แตประชาธิปไตยที่แทจริงอยูในขอบเขตของมินชู ชูงิ ทายที่สุดแลว 'ตามกฎหมาย อํานาจอธิปไตยของชาติเปนของประชาชน' ซึ่งไมใชกรณีของหลักมินปง เพราะหลักนั้นเนนอํานาจอธิปไตยของพระมหากษัตริยเหนือสิ่งอื่นใด เราตองบรรจุแนวคิดใหมเหลานี้ไวในรัฐธรรมนูญ!"

 JAP_minpon_shugi: "มินปง ชูงิ"
 JAP_minpon_shugi_desc: "หลักการเมืองแบบมินปง ชูงิ ซึ่งถือกําเนิดในยุคไทโช นิยามไดวาเปน 'นโยบายการใชอํานาจทางการเมืองโดยใหคุณคาแกผลประโยชน ความสุข และความคิดเห็นของประชาชน' หลักนี้ไมขัดตอสถาบันจักรพรรดิ และเปนประโยชนทั้งตอประชาชนและจักรพรรดิ เราควรดําเนินประชาธิปไตยที่ตั้งอยูบนอํานาจอธิปไตยของพระมหากษัตริยตอไป และบรรจุไวในรัฐธรรมนูญฉบับใหม!"

 JAP_promote_meritocracy: "สงเสริมระบบคุณธรรม"
 JAP_promote_meritocracy_desc: "ประเทศจะไมอาจดําเนินไปอยางมีประสิทธิภาพ หากเราไมเลื่อนตําแหนงผูที่ทํางานไดดีใหอยูในตําแหนงที่เหมาะสม ผูเชี่ยวชาญดานอิเล็กทรอนิกสควรเปนผูนําอุตสาหกรรมอิเล็กทรอนิกส ไมใชนักการเมืองที่มีเสนสายกับคณะรัฐมนตรี ถึงเวลาแลวที่จะถอนรากธรรมเนียมอามากูดาริ และยึดระบบคุณธรรมเพื่อประโยชนของชาติ!"

 JAP_experimental_housing_solutions: "ทางออกดานที่อยูอาศัยเชิงทดลอง"
 JAP_experimental_housing_solutions_desc: "การพัฒนาเมืองควรยึดประเภทการใชงานสี่ประการ ไดแก ที่อยูอาศัย การทํางาน การคมนาคม และนันทนาการ เค็นโซ ทังเงะ พรอมสถาปนิกหนาใหมคนอื่น ๆ ไดเสนอวิธีการสรางเมืองแบบใหม ในฐานะสวนหนึ่งของกระแสใหมที่กําลังมาแรงซึ่งพวกเขาเรียกวา เมตาบอลิซึม เราควรสงเสริมแนวคิดนี้ เพื่อยกระดับความเปนอยูของพลเมืองทุกคน"

 JAP_embrace_amakudari: "ยอมรับอามากูดาริ"
 JAP_embrace_amakudari_desc: "อามากูดาริ ซึ่งแปลตรงตัววา การลงมาจากสวรรค หมายถึงธรรมเนียมที่ขาราชการระดับสูงที่เกษียณแลวเขารับตําแหนงผูบริหารระดับสูงในบริษัทเอกชน ซึ่งมักอยูในอุตสาหกรรมเดียวกับที่ตนเคยกํากับดูแล แมอาจทําใหประสิทธิภาพของอุตสาหกรรมแยลงมาก แตก็ทําใหเรามีขอมูลเชิงลึกและอํานาจควบคุมเหนือสังคมอยางมาก"

 JAP_agricultural_protectionism: "การคุมครองภาคเกษตร"
 JAP_agricultural_protectionism_desc: "เศรษฐกิจโลกเปนปฏิปกษตอวิถีการผลิตแบบดั้งเดิมของเรามากขึ้นเรื่อย ๆ หากเราไมใชมาตรการปกปองเกษตรกร เราจะตองเผชิญวิกฤตขนาดใหญหลวงในไมชา เมื่อเกษตรกรของเราไมอาจแขงขันกับอาหารที่ผลิตแบบอุตสาหกรรมซึ่งหลั่งไหลเขามาจากตางประเทศ"

 JAP_machida_chuuji_focus: "รัฐบาลมาจิดะ ชูจิ"
 JAP_machida_chuuji_focus_desc: "มาจิดะ ชูจิ หัวหนาพรรคริกเก็นมินเซโตซึ่งเปนพรรครัฐบาลในปจจุบัน ควรไดรับการสนับสนุนใหจัดตั้งคณะรัฐมนตรีชุดใหม ที่จะผลักดันการประกาศใชรัฐธรรมนูญฉบับใหมของเรา ดวยวิธีนี้ เราจะไมมีนายกรัฐมนตรีรักษาการอีกตอไป และระเบียบกอนเกิดความขัดแยงจะไดรับการฟนฟูในที่สุด"

 JAP_abe_isoo_focus: "รัฐบาลอาเบะ อิโซ"
 JAP_abe_isoo_focus_desc: "อาเบะ อิโซ หัวหนาพรรคชาไกไทชูโตในปจจุบันและบิดาแหงเบสบอลญี่ปุน ควรไดรับการสนับสนุนใหจัดตั้งคณะรัฐมนตรีชุดใหม ที่จะผลักดันการประกาศใชรัฐธรรมนูญฉบับใหมของเรา ดวยวิธีนี้ เราจะไมมีนายกรัฐมนตรีรักษาการอีกตอไป และระเบียบกอนเกิดความขัดแยงจะไดรับการฟนฟูในที่สุด"

 JAP_uplift_labor_unions: "สงเสริมสหภาพแรงงาน"
 JAP_uplift_labor_unions_desc: "สหภาพแรงงานชวยใหประชาชนปกครองตนเอง และชวยเราฟนฟูซอมแซมอุตสาหกรรมที่ถูกฝายทหารทําลายทั้งกอนและระหวางสงครามกลางเมือง เราควรยกระดับองคกรเหลานี้ตอไป จนวันหนึ่งเราจะสรางสังคมสวัสดิการญี่ปุนได"

 JAP_tokugawa_iesato_focus: "รัฐบาลโทกูงาวะ อิเอซาโตะ"
 JAP_tokugawa_iesato_focus_desc: "โทกูงาวะ อิเอซาโตะ ผูเปนที่นิยมอยางยิ่ง ประธานสภาขุนนางและทายาทแหงรัฐบาลโชกุนโทกูงาวะ ควรไดรับการสนับสนุนใหจัดตั้งคณะรัฐมนตรีชุดใหม ที่จะผลักดันการประกาศใชรัฐธรรมนูญฉบับใหมของเรา ดวยวิธีนี้ เราจะไมมีนายกรัฐมนตรีรักษาการอีกตอไป และระเบียบกอนเกิดความขัดแยงจะไดรับการฟนฟูในที่สุด"

 JAP_ichiro_hatoyama_focus: "รัฐบาลอิจิโร ฮาโตยามะ"
 JAP_ichiro_hatoyama_focus_desc: "อิจิโร ฮาโตยามะ หัวหนาพรรคริกเก็นเซยูไกซึ่งเปนพรรครัฐบาลในปจจุบัน ควรไดรับการสนับสนุนใหจัดตั้งคณะรัฐมนตรีชุดใหม ที่จะผลักดันการประกาศใชรัฐธรรมนูญฉบับใหมของเรา ดวยวิธีนี้ เราจะไมมีนายกรัฐมนตรีรักษาการอีกตอไป และระเบียบกอนเกิดความขัดแยงจะไดรับการฟนฟูในที่สุด"

 JAP_mitsumasa_yonai_focus: "รัฐบาลมิตสึมาซะ โยไน"
 JAP_mitsumasa_yonai_focus_desc: "มิตสึมาซะ โยไน พลเรือเอกสายกลางผูเปนกําลังสําคัญของฝายสนธิสัญญาที่นิยมตะวันตกในกองทัพเรือ ควรไดรับการสนับสนุนใหจัดตั้งคณะรัฐมนตรีชุดใหม ที่จะผลักดันการประกาศใชรัฐธรรมนูญฉบับใหมของเรา ดวยวิธีนี้ เราจะไมมีนายกรัฐมนตรีรักษาการอีกตอไป และระเบียบกอนเกิดความขัดแยงจะไดรับการฟนฟูในที่สุด"

 JAP_limit_the_emperors_power: "จํากัดพระราชอํานาจของจักรพรรดิ"
 JAP_limit_the_emperors_power_desc: "จักรพรรดิยังคงเปนสวนสําคัญของสังคมเรา แตก็อาจเปนภัยตอประชาธิปไตยไดหากพระองคทรงประสงค เราตองพยายามจํากัดพระราชอํานาจของพระมหากษัตริยภายใตรัฐธรรมนูญ เพื่อที่เราจะไมสูญเสียคุณคาประชาธิปไตยไปอีก"

 JAP_ensure_civil_liberties: "ประกันเสรีภาพของพลเมือง"
 JAP_ensure_civil_liberties_desc: "เมื่อสันติภาพและความรุงเรืองหวนคืนสูชาติอีกครั้ง ก็ถึงเวลาที่เราจะทําตามคําสัญญาบางขอที่ใหไว เราควรทําใหมั่นใจวาเสรีภาพของพลเมืองทุกประการจะเกิดขึ้นไดในญี่ปุนใหม และเริ่มสรางภาพยนตรใหม ๆ เพื่อสงเสริมประชาธิปไตยของเรา"

 JAP_crush_the_internal_factions: "บดขยี้กลุมอํานาจภายใน"
 JAP_crush_the_internal_factions_desc: "การแขงขันระหวางกลุมอํานาจตาง ๆ ภายในประเทศที่ตางแยงชิงความโปรดปรานจากจักรพรรดิไดกอผลรายแรง บัดนี้เมื่อรัฐบาลกลับมาควบคุมสถานการณไดเต็มที่อีกครั้ง ก็ถึงเวลาตอกยํ้าวาใครคือผูถืออํานาจที่แทจริง และแสดงใหกลุมอื่น ๆ เห็นวาเราไมใชคนที่จะมาลอเลนดวยได"

 JAP_democratic_war_with_manchukuo: "ปดฉากการตอสู"
 JAP_democratic_war_with_manchukuo_desc: "กองทัพคันโตตัดความสัมพันธกับเรานับตั้งแตสงครามกลางเมือง และเขาควบคุมแมนจูเรีย ผูคนที่นั่นยังคงอยูใตการกดขี่แบบเผด็จการอยางที่เราเคยประสบ และตองการการชวยเหลือ ถึงเวลาแลวที่เราจะทําสิ่งที่เริ่มไวใหสําเร็จ"
 MAN_kwantung_army_took_control_flag: "กองทัพคันโตเขาควบคุมแมนจูเรีย"

 JAP_democratic_war_with_china: "ปกปองเขตสัมปทานเซี่ยงไฮ"
 JAP_democratic_war_with_china_desc: "ผูคนในเขตสัมปทานนานาชาติเซี่ยงไฮกําลังถูกคุกคามจากระบอบจีนอันฉอฉลและพรรคพวก เราตองเขาไปชวยเหลือพวกเขา กอนที่เลือดจะตองหลั่งโดยไมจําเปน!"

 JAP_closer_ties_with_the_usa: "กระชับสัมพันธกับสหรัฐอเมริกา"
 JAP_closer_ties_with_the_usa_desc: "เมื่อระบอบประชาธิปไตยมั่นคงในประเทศแลว นักการทูตของเราไดทํางานอยางหนักเพื่อซอมแซมความสัมพันธที่ฝายทหารทําใหมัวหมอง โดยเริ่มจากสหรัฐอเมริกา เราควรเขาหาพวกเขา และดูวาจะทําขอตกลงที่ประกันมิตรภาพของเราไปอีกหลายปไดหรือไม"

 JAP_ally_the_philippines: "เปนพันธมิตรกับฟลิปปนส"
 JAP_ally_the_philippines_desc: "เมื่อเพิ่งฟนฟูความสัมพันธกับอดีตเจาอาณานิคมของพวกเขาไดไมนาน บางทีอาจถึงเวลาที่เราจะยื่นขอเสนอเชิญรัฐบาล[PHI.GetAdjective]เขารวมพันธมิตรของเรา ในมุมมองของเรา ทั้งสองฝายจะไดประโยชนอยางมากจากขอตกลงนี้"

 JAP_strike_the_soviets: "โจมตีคูปรับเกา"
 JAP_strike_the_soviets_desc: "เรายืนหยัดเปนปราการตอตานพวกบอลเชวิคที่ชิงคาราฟุโตะตอนเหนือไปจากเรา นับตั้งแตการยกทัพไซบีเรียและสงครามรัสเซีย-ญี่ปุน ประชาชนของเราก็กระหายที่จะสูกับ[SOV.GetNameDef]อีกครั้ง เพื่อขับไลพวกเขาออกจากไซบีเรียตะวันออกและรักษาเขตอิทธิพลของเราไวในที่สุด"

 JAP_free_colonized_asian_countries: "ปลดปลอยประเทศอาณานิคมในเอเชีย"
 JAP_free_colonized_asian_countries_desc: "มีหลายชาติในเอเชียที่ยังอยูภายใตการยึดครองของมหาอํานาจตะวันตก ในฐานะผูพิทักษแหงเอเชียคนใหม เราควรเขาหาชาวตะวันตกเหลานี้และยื่นขอเสนอที่พวกเขาไมอาจปฏิเสธ เพื่อใหเราไดควบคุมอาณานิคมเหลานี้"
 JAP_free_colonized_asian_countries_tt: "ปลดล็อกการตัดสินใจ §Yเรียกรองสิทธิ์ความเปนเจาเหนือ§! §Yประเทศในเอเชีย§! ที่เปนรัฐในอารักขาของ §Yประเทศนอกเอเชีย§!"

 JAP_fund_resistance_groups_in_asia: "ใหทุนกลุมตอตานในเอเชีย"
 JAP_fund_resistance_groups_in_asia_desc: "บนทวีปของเรามีผูคนมากมายที่ตอสูกับการกดขี่จากตางชาติ และยินดีรับความชวยเหลือจากเราหากเรายื่นมือไป เราควรใชโอกาสนี้บั่นทอนมหาอํานาจตะวันตก และสงเสริมเสรีภาพแกทั่วทั้งเอเชีย!"
 JAP_fund_resistance_groups_in_asia_tt: "ปลดล็อก §Yการตัดสินใจ§! เพื่อเพิ่มการตอตานและรับโบนัสการโจมตีในรัฐเอเชียที่ถูกยึดครอง"

 JAP_sea_rekindle_the_old_alliance: "ฟนพันธมิตรเกา"
 JAP_sea_rekindle_the_old_alliance_desc: "โอกาสที่ดีที่สุดของเราอยูที่อดีตพันธมิตรในมหาสงคราม เราจะฟนพันธมิตรเกาขึ้นมาอีกครั้ง และยืนเคียงขาง[ENG.GetNameDef]ในการปกปองประชาธิปไตย"

 JAP_create_greater_east_asian_treaty_organization: "องคการสนธิสัญญาแปซิฟกตะวันตก"
 JAP_create_greater_east_asian_treaty_organization_desc: "พันธมิตรของเราเองรวมกับชาติเอเชียอื่น ๆ จะทําใหเรายืนหยัดอยางมั่นคงตอภัยคุกคามใด ๆ ที่อาจเกิดกับวิถีชีวิตใหมของเรา ถึงเวลาแลวที่เราจะยอมรับชะตาในฐานะผูพิทักษทวีป และเริ่มนําทวีปไปสูอนาคต"
 JAP_greater_east_asian_treaty_organization: "องคการสนธิสัญญามหาเอเชียบูรพา"
 JAP_create_greater_east_asian_treaty_organization_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญประเทศ §Yไมฝกใฝฝายใด§! และ §Yประชาธิปไตย§! ใน §Yเอเชีย§! และ §Yโอเชียเนีย§! เขารวมฝายของเรา"

 JAP_form_greater_east_asian_customs_union: "จัดตั้งสหภาพศุลกากรมหาเอเชียบูรพา"
 JAP_form_greater_east_asian_customs_union_desc: "ตามที่นักทฤษฎีเศรษฐกิจของเราวางแผนไวนาน เราควรพยายามจัดตั้งสหภาพศุลกากรแปซิฟก และคอย ๆ รวมเศรษฐกิจเอเชียเขาเปนพลังอันทรงอํานาจที่สุดเพียงหนึ่งเดียวอยางมั่นคง"

 JAP_form_greater_east_asian_currency_union: "จัดตั้งสหภาพการเงินมหาเอเชียบูรพา"
 JAP_form_greater_east_asian_currency_union_desc: "เราควรมุงสูการใชสกุลเงินเดียวทั่วเอเชีย ซึ่งนักทฤษฎีการเมืองรุนเกาของเราเรียกวากลุมเงินเยน ถึงเวลาแลวที่เราจะกาวไปอีกขั้นสูเปาหมายนี้ และจัดตั้งสหภาพการเงินสําหรับพันธมิตรใหมทั้งหมดของเรา"
 JAP_form_greater_east_asian_currency_union_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญพันธมิตรเขารวม §Yสหภาพการเงิน§!"

 JAP_an_integrated_union: "สหภาพที่บูรณาการ"
 JAP_an_integrated_union_desc: "การบูรณาการเศรษฐกิจของพันธมิตรเขากับของเรา และการจัดตั้งธนาคารกลางเอเชียที่สามารถติดตามและชวยเหลือสถานการณเศรษฐกิจของรัฐอื่น ๆ จะเปนประโยชนอยางยิ่งตอเราในระยะยาว ไมเพียงทําใหเราแข็งแกรงขึ้น แตยังเพิ่มการพึ่งพาเราของพวกเขา จนในที่สุดเราจะเขาควบคุมกิจการตางประเทศของพวกเขาได"
 JAP_an_integrated_union_tt: "§Yสมาชิกฝาย§! ทุกรายจะไดรับ §Yเหตุการณ:§! [JAP.GetNameDefCap]ปรารถนาจะบูรณาการเศรษฐกิจของเรามากยิ่งขึ้น"
 JAP_an_integrated_union_2_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญพันธมิตรให §Yเศรษฐกิจของพวกเขาบูรณาการ§!เขากับของเรามากขึ้นเรื่อย ๆ ซึ่งทําใหเราสามารถ §Yพยายามผนวกพวกเขาเปนรัฐบริวารทางการทูต§! ไดในภายหลัง"

 JAP_greater_east_asian_federation: "สหพันธรัฐมหาเอเชียบูรพา"
 JAP_greater_east_asian_federation_desc: "วันนั้นมาถึงแลวในที่สุด วันที่เราสามารถรวมประชาชาติเอเชียไวภายใตรัฐเดียว! เราควรเรงบูรณาการสวนตาง ๆ ของเรา และจัดตั้งสหพันธรัฐมหาเอเชียบูรพา เผยแพรประชาธิปไตยไปทุกมุมของเอเชีย"
 JAP_allied_civilian_administration_integration_tt: "ปลดล็อกการตัดสินใจ: §Yบูรณาการการบริหารพลเรือนของรัฐในอารักขา§! ซึ่งทําใหเราสามารถ §Yผนวก§! §Yรัฐหุนเชิด§! ของเราได"
 JAP_greater_east_asian_federation_tt: "เราจะเปนที่รูจักในนาม §Yสหพันธรัฐมหาเอเชียบูรพา§!"
 JAP_greater_east_asian_federation_2_tt: "ปลดล็อกการตัดสินใจเพื่อบูรณาการรัฐใน §Yเอเชีย§! ที่อยูภายใต §Yการควบคุม§! ของเรา"

 JAP_democratic_womens_suffrage: "สิทธิเลือกตั้งของสตรี"
 JAP_democratic_womens_suffrage_desc: "อิจิกาวะ ฟุซาเอะ สนับสนุนการขยายสิทธิออกเสียงเลือกตั้งใหครอบคลุมสตรีมาชานาน บัดนี้เมื่อสถานการณการเมืองมีเสถียรภาพแลว ก็ถึงเวลาใหสิทธิเลือกตั้งแกสตรีญี่ปุน เพื่อใหพวกเธอไดมีสวนรวมในความสําเร็จที่เติบโตขึ้นของเราดวย"

 JAP_launch_the_income_doubling_plan: "เปดตัวแผนเพิ่มรายไดเปนสองเทา"
 JAP_launch_the_income_doubling_plan_desc: "โอซามุ ชิโมมูระ นักเศรษฐศาสตรที่เพิ่งเขารวมคณะกรรมการรักษาเสถียรภาพทางเศรษฐกิจของญี่ปุน ไดเสนอสิ่งที่เขาเรียกวาแผนเพิ่มรายไดเปนสองเทา ซึ่งเขาอางวาจะมีบทบาทสําคัญในการวางแผนเศรษฐกิจ และชวยวางรากฐานใหการเติบโตทางเศรษฐกิจอยางรวดเร็วของเรา เราควรรับขอเสนอของเขา และดูวามันจะพาเราไปที่ใด"

 JAP_reform_the_education_system: "ปฏิรูประบบการศึกษา"
 JAP_reform_the_education_system_desc: "ระบบการศึกษาปจจุบันยังคงมีขอบกพรองทั้งหมดของสถาบันจักรวรรดิ และเขาถึงเด็ก ๆ ของเราไดไมมีประสิทธิภาพพอ ทําใหเราตามหลังชาติตะวันตก เราควรปฏิรูปโดยเรงดวนที่สุด เพื่อไมใหเปนเชนนี้ตอไป"

 JAP_democratic_women_in_the_workforce: "สตรีในกําลังแรงงาน"
 JAP_democratic_women_in_the_workforce_desc: "เพศเปนปจจัยกําหนดมาชานานวาบุคคลควรรับใชชาติในที่ใด ไมวาจะเปนแนวหนา ในโรงงาน หรือที่บาน ดวยการแบงเบาภาระอยางเทาเทียมกันมากขึ้น เราจะมีกําลังแรงงานที่ใหญขึ้น และกองทัพที่ใหญขึ้นหากจําเปน"

 JAP_taiheyo_belt: "แถบไทเฮโย" 
 JAP_taiheyo_belt_desc: "นักเศรษฐศาสตรของเรากลาวถึงแผนใหมในการสรางเขตเมืองที่เรียกวาแถบไทเฮโย ซึ่งทอดยาวจากโตเกียวถึงฟูกูโอกะ เชื่อมพื้นที่เขาเปนมหานครขนาดใหญที่จะทําใหการเดินทาง และกิจกรรมทางเศรษฐกิจและอุตสาหกรรมสะดวกขึ้นทั่วเกาะหลักทางใตสวนใหญ เราตองทําใหสิ่งนี้เปนจริง!"

 JAP_shinkansen: "โครงการชินกันเซ็ง"
 JAP_shinkansen_desc: "หัวหนาวิศวกร ฮิเดโอะ ชิมะ ไดคิดแผนสรางเสนทางรถไฟหัวกระสุนที่เขาเรียกวา โทไกโด ชินกันเซ็ง ซึ่งจะเชื่อมโตเกียว นาโงยะ และโอซากะ ทําใหการขนสงทั้งสินคาและพลเรือนระหวางเมืองใหญของเราเปนไปอยางรวดเร็วและสะดวก เราควรลงทุนในโครงการนี้"
 JAP_shinkansen_tt: "เมื่อจิตวิญญาณแหงชาติ §Y$JAP_shinkansen_construction_idea$§! ถูกนําออก:\n"

 JAP_pursue_international_trade: "มุงการคาระหวางประเทศ"
 JAP_pursue_international_trade_desc: "แมเราจะคาขายกับตางชาติมาตั้งแตพลเรือจัตวาแมทธิว เพอรรี ยุติการปดประเทศของเรา แตก็ยังไมเพียงพอเลย เราควรใหความสําคัญกับตลาดระหวางประเทศอยางมาก และทําใหมั่นใจวาเราจะไดทรัพยากรที่ตองการผานการทูต แทนที่จะเปนสงคราม"

 JAP_seek_foreign_investments: "แสวงหาการลงทุนจากตางประเทศ"
 JAP_seek_foreign_investments_desc: "เมื่อเราเปดประเทศมากขึ้นแลว เราควรใชความสัมพันธที่เพิ่งสรางขึ้นดึงดูดการลงทุนจากทุนตางชาติ และสงเสริมอุตสาหกรรมของเราไปพรอมกัน"
 JAP_seek_foreign_investments_tt: "ปลดล็อกการตัดสินใจ §Yดึงดูดการลงทุนจากตางประเทศ§! เพื่อรับ §Yโรงงานพลเรือน§! แลกกับ §Yอํานาจทางการเมือง§!"

 JAP_invest_in_foreign_industries: "ลงทุนในอุตสาหกรรมตางประเทศ"
 JAP_invest_in_foreign_industries_desc: "เราควรใชทุนจํานวนมหาศาลที่ไดมาลงทุนในตางประเทศ ใหความชวยเหลือทางเศรษฐกิจแกพวกเขาแลกกับสวนแบงทรัพยากรธรรมชาติ ชวยเหลือชาติเอเชียอื่น ๆ และแกปญหาของเราเองไปพรอมกัน"
 JAP_invest_in_foreign_industries_tt: "ปลดล็อก §Yการตัดสินใจ§! เพื่อลงทุนในอุตสาหกรรมของชาติเล็กใน §Yเอเชีย§! แลกกับทรัพยากร"

 JAP_democratic_foreign_exchange_allocation_policy: "นโยบายจัดสรรเงินตราตางประเทศ"
 JAP_democratic_foreign_exchange_allocation_policy_desc: "ตลาดหุนเปนเครื่องมือที่ทรงพลัง เราควรใชประโยชนจากกระแสทุนตางชาติ และทําใหมั่นใจวานักเศรษฐศาสตรและนักอุตสาหกรรมของเราสามารถลงทุนทุนเหลานั้นในชาติที่กําลังเติบโตของเราไดมากที่สุด"

 JAP_democratic_research_slot: "ปรับโครงสรางมหาวิทยาลัยจักรวรรดิโตเกียว"
 JAP_democratic_research_slot_desc: "มหาวิทยาลัยจักรวรรดิโตเกียวยังคงดําเนินงานตามแนวทางของระบบการศึกษาแบบเกา เพื่อใหไดปญญาชนรุนใหมที่จะชวยนําประเทศไปสูอนาคตที่ดีกวา เราตองลงทุนในมหาวิทยาลัย และเปลี่ยนหลักสูตรใหถูกควบคุมโดยการเมืองระดับชาตินอยลง"

 JAP_offshore_coal: "ขยายเหมืองถานหินนอกชายฝง"
 JAP_offshore_coal_desc: "เกาะอิเกชิมะและฮาชิมะนอกชายฝงนางาซากิเปนเหมืองถานหินสําคัญที่ขุดถานหินจากใตทองทะเล เราควรขยายเหมืองเหลานี้ และสรางบานเพิ่มบนเกาะเพื่อรองรับแรงงานประจําที่มากขึ้นไปอีก"

 JAP_democratic_nationalize_zaibatsus: "โอนไซบัตสึเปนของรัฐ"
 JAP_democratic_nationalize_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาเนิ่นนาน มันจะสิ้นสุดลง ณ ที่นี้ อํานาจควบคุมของรัฐจะตองไมถูกทาทาย เราตองโอนกิจการเหลานี้เปนของรัฐ และใชทุนของพวกเขาเพื่อประโยชนของประชาชน!"

 JAP_split_uo_zaibatsu_monopolies: "แยกการผูกขาดของไซบัตสึ"
 JAP_split_uo_zaibatsu_monopolies_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาเนิ่นนาน เราตองเตือนใหพวกเขารูวายังตองอยูใตความประสงคของรัฐบาล และแยกพวกเขาออกเปนกลุมบริษัทเคเรตสึที่เล็กลง เพื่อใหควบคุมไดงายขึ้น"

 JAP_democratic_work_with_the_zaibatsus: "รวมมือกับไซบัตสึ"
 JAP_democratic_work_with_the_zaibatsus_desc: "บรรษัทที่ใหญที่สุดของชาติเรามีอํานาจทางการเมืองและเศรษฐกิจอยางที่ไมเคยมีมากอนมาเนิ่นนาน ดวยชั้นเชิงบางอยาง เราอาจทํางานรวมกับพวกเขาและชี้นําความพยายามของพวกเขาใหเปนประโยชนแกเราได"

 JAP_lifetime_employment: "การจางงานตลอดชีพ"
 JAP_lifetime_employment_desc: "ชูชิน โคโย ถูกใชโดยบริษัทใหญของเรามาระยะหนึ่งแลว เริ่มตั้งแตความสําเร็จทางเศรษฐกิจครั้งแรกในทศวรรษ 1920 เราควรทําใหมั่นใจวาลักษณะเดนของวัฒนธรรมองคกรญี่ปุนนี้จะชวยใหเราบรรลุปาฏิหาริยทางเศรษฐกิจ เพื่อที่วันหนึ่งเราจะแซงหนาแมแตเศรษฐกิจของชาติตะวันตก"

 JAP_modernize_agriculture: "ปรับปรุงเกษตรกรรมใหทันสมัย"
 JAP_modernize_agriculture_desc: "ภาคเกษตรของเราสําคัญพอ ๆ กับภาคอุตสาหกรรม ทายที่สุดแลว อุตสาหกรรมของเราจะเดินหนาไมไดหากเราเลี้ยงปากทองทุกคนในประเทศไมได ดังนั้นเราควรลงทุนพัฒนาเครื่องมือใหม ๆ และปรับปรุงเครือขายถนนที่เชื่อมหมูบานชนบทกับเมืองใหญ"

 JAP_civilian_nuclear_reactor_investments: "ลงทุนในเครื่องปฏิกรณนิวเคลียรพลเรือน"
 JAP_civilian_nuclear_reactor_investments_desc: "ดังที่นักวิทยาศาสตรของเราที่สถาบันริเก็นไดขอสรุป พลังงานนิวเคลียรจะเปนพลังงานแหงอนาคต เราตองลงทุนในเทคโนโลยีใหมนี้ เพื่อที่เราจะไมตองเผาถานหินอีกตอไป"
 JAP_civilian_nuclear_reactor_investments_tt: "แทนที่ §Y$JAP_early_industrialization_efforts_dm$§! ดวย §Y$JAP_the_economic_mirale_dm$§! ผลที่เปลี่ยนแปลง:"

 JAP_guardian_of_the_pacific: "ผูพิทักษแหงแปซิฟก"
 JAP_guardian_of_the_pacific_desc: "เราจะรับบทบาทผูพิทักษรัฐเอเชียทั้งหมดในและรอบมหาสมุทรแปซิฟก เมื่อหลุดพนจากจักรวรรดินิยมตะวันตกแลว พวกเขาจะตองการมือที่คอยชี้นําเพื่อยกระดับใหเปนประชาธิปไตยเต็มรูปแบบ กาวแรกสูเปาหมายนี้คือการเสนอตัวเปนผูคุมครองคนใหมของรัฐในอารักขาอาณานิคมแปซิฟกของ[ENG.GetNameDef]"

 JAP_build_diet_building_landmark_tt: "\nแทนที่ §Y$landmark_tokyo_imperial_palace$§! ดวย §Y$landmark_national_diet$§!"
 JAP_build_hakko_ichiu_landmark_tt: "สราง §Y$landmark_hakko_ichiu$§! ใน[1018.GetName]" 

 JAP_the_koiso_cabinet: "คณะรัฐมนตรีโคอิโซะ"
 JAP_the_koiso_cabinet_desc: "เมื่อจักรพรรดิทรงแสดงความไมไววางพระราชหฤทัยตอความสามารถของ[ROOT.GetLeader]และกองทัพจักรวรรดิญี่ปุนมากขึ้นเรื่อย ๆ พระองคทรงแสดงพระประสงคที่จะรวมชาติเปนหนึ่งและหาทางออกจากสงคราม เพื่อหลีกเลี่ยงการลมสลายของชาติอยางสิ้นเชิง แมโคอิโซะจะไมเปนที่นิยมในหมูนักการเมืองและนายพล แตเขาอาจมีความสามารถที่จะนําชาติออกจากความขัดแยงได"

 JAP_the_war_has_not_necessarily_developed_focus: "คัดคานความขัดแยงในเอเชียตะวันออกอยางแข็งขัน"
 JAP_the_war_has_not_necessarily_developed_focus_desc: "เมื่อการแขงขันระหวางกองทัพบกกับกองทัพเรือยังคงเปนหนามยอกอก และยุทธศาสตรยุติสงครามดวยการโจมตีขาศึกอยางหนักหนวงลมเหลว ดูเหมือนเราใกลจะหมดทางเลือกแลว บางทีอาจถึงเวลายอมรับความอัปยศ และนํามาซึ่งยุคที่ปลอดจากความขัดแยง"
 JAP_the_war_has_not_necessarily_developed_focus_tt: "กลุมหัวรุนแรงในกองทัพจะพยายามกอรัฐประหารตอรัฐบาล เพื่อหยุดยั้งไมใหจักรพรรดิทรงออกอากาศประกาศยอมจํานนของชาติเรา"

 JAP_japans_longest_day: "วันที่ยาวนานที่สุดของญี่ปุน"
 JAP_japans_longest_day_desc: "นายกรัฐมนตรีผูไรเกียรติและพรรคพวกถูกจัดการเรียบรอยแลว และจักรพรรดิผูหลงผิดก็ถูกกักบริเวณในพระราชวัง บัดนี้ถึงเวลาปลุกความพยายามในการทําสงครามขึ้นใหม และนําชาติของเรากลับสูความรุงโรจนที่ถูกลิขิตไว"

 JAP_the_surrender_broadcast: "การออกอากาศประกาศยอมจํานน"
 JAP_the_surrender_broadcast_desc: "เราไดพิจารณาอยางลึกซึ้งถึงแนวโนมทั่วไปของโลกและสถานการณปจจุบันของจักรวรรดิ และไดตัดสินใจใชมาตรการพิเศษเพื่อยุติสถานการณในปจจุบัน สถานการณสงครามไดพัฒนาไปในทางที่ไมจําเปนตองเปนประโยชนแกญี่ปุน และเราตองยอมรับความจริงขอนี้"
 JAP_the_surrender_broadcast_tt: "เรามีโอกาสมากขึ้นที่จะรักษาการควบคุมหมูเกาะหลักไวได หากเรายอมจํานนโดยสันติ"







