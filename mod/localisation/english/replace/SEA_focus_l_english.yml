 CHI_end_military_primacy: "ยุติความเปนใหญของกองทัพ"
 CHI_end_military_primacy_desc: "กองทัพไดทําหนาที่ของตนแลว แตอํานาจที่กุมไวตองถูกทลายลง อํานาจพลเรือนตองไดรับการฟนฟู หาก[ROOT.GetName]จะเปนชาติที่ปกครองดวยกฎหมาย มิใชดวยเหลานายพล"
 CHI_accelerate_the_tutelage: "เรงการปกครองแบบชี้นํา"
 CHI_accelerate_the_tutelage_desc: "กกมินตั๋งลมเหลวในการทําตามสัญญาของการปฏิวัติซินไฮและของ ดร.ซุน ยัตเซ็น แทนที่จะสอนประชาชนเรื่องประชาธิปไตย พวกเขากลับเอารัดเอาเปรียบประชาชนเพื่อผลประโยชนสวนตน เราตองชดเชยเวลาที่เสียไป"
 CHI_accelerate_the_tutelage_tt: "ปลดล็อกการตัดสินใจเพื่อ §Yเรงการชี้นําทางการเมือง§! แกประชาชนทั่ว §Yชนบทของจีน§!"
 CHI_revive_the_new_culture_movement: "ฟนฟูขบวนการวัฒนธรรมใหม"
 CHI_revive_the_new_culture_movement_desc: "นักปฏิวัติรุนแรก ๆ สวนใหญในพรรคคอมมิวนิสตจีนและกกมินตั๋งลวนไดแรงบันดาลใจจากขบวนการวัฒนธรรมใหมที่ตอตานทั้งราชวงศชิงและหยวน ซื่อไข มีเพียงจิตวิญญาณของขบวนการวัฒนธรรมใหมเทานั้นที่จะทําใหจีนใหมผงาดขึ้นจากเถาถานของอดีต!"
 CHI_revive_the_chinese_action_committee: "ฟนฟูคณะกรรมการปฏิบัติการจีน"
 CHI_revive_the_chinese_action_committee_desc: "กกมินตั๋งผูกขาดการเขาถึงกองทัพ ดึงอํานาจไปรวมไวที่กลุมเล็ก ๆ กลุมหนึ่ง อยางไรก็ตาม มีผูเห็นตางที่มีประสบการณทางทหารบางคนไมเห็นดวยกับกลุมผูปกครอง แมจะไมสนับสนุนฝายคอมมิวนิสตก็ตาม"
 CHI_revive_the_chinese_action_committee_tt: "§Y$CHI_jiang_guangnai$§!, §Y$CHI_cai_tingkai$§! และ §Y$CHI_chen_mingshu$§! พรอมรับตําแหนง §Yนายพล§!"
 CHI_ally_the_young_china_party: "ผูกมิตรกับพรรคเยาวชนจีน"
 CHI_ally_the_young_china_party_desc: "พรรคเยาวชนจีนกอตั้งโดยกลุมนักศึกษาจีนในปารีสเมื่อวันที่ 2 ธันวาคม 1923 และเปนขบวนการขนาดเล็กที่โดดเดนที่สุดในประเทศรองจากกกมินตั๋งและพรรคคอมมิวนิสตจีน พวกเขามีแนวคิดดี ๆ สําหรับอนาคตของเราที่เราไมอาจมองขาม เราควรผูกมิตรกับพวกเขาทันที!"
 CHI_invite_carsun_chang: "เชิญจาง จวินมาย"
 CHI_invite_carsun_chang_desc: "แมมหาอํานาจตะวันตกจะสรางความเสียหายตอผลประโยชนของ[ROOT.GetAdjective] แตแนวคิดบางอยางของพวกเขาก็มีประโยชนตอเรา เมื่อจาง จวินมายเชื่อมแนวคิดเหลานี้เขากับบริบทแบบขงจื๊อของเรา เขาจะกลายเปนศูนยรวมของขบวนการประชาธิปไตย"
 CHI_give_protection_of_civil_rights: "คุมครองสิทธิพลเมือง"
 CHI_give_protection_of_civil_rights_desc: "ซง ชิ่งหลิงและสันนิบาตจีนเพื่อการคุมครองสิทธิพลเมืองเคลื่อนไหวในชวงตนทศวรรษ 1930 ตอสูกับมาตรการเผด็จการของกกมินตั๋ง งานที่พวกเขาเริ่มไว เราจะสานตอดวยการบัญญัติสิทธิของสามัญชนใหมั่นคง"
 CHI_rural_reconstruction_movement_sea: "ขบวนการฟนฟูชนบท"
 CHI_rural_reconstruction_movement_sea_desc: "เมืองของเราเปนศูนยกลางแหงความทันสมัยที่คึกคัก แตชนบทกลับไมเปนเชนนั้น เราควรทุมเทความพยายามรวมกันเพื่อขยายสวัสดิการทางเศรษฐกิจและการสนับสนุนทางอุดมการณในหมูบาน การแผอิทธิพลอยางเต็มที่จะทําใหเราใชประโยชนจากพื้นที่ที่มิฉะนั้นจะถูกละเลยได"
 CHI_rural_reconstruction_movement_sea_tt: "ลดเวลาการถอดการตัดสินใจ §Yการชี้นําทางการเมืองในชนบทและในเมือง§! ลง §G10§! วัน"
 CHI_rural_reconstruction_movement_sea_2_tt: "การตัดสินใจ §Yการชี้นําในชนบท§! จะเพิ่ม §Y$CHI_local_rural_reconstruction_modifier$§! ใหแกรัฐเปาหมายดวย"
 CHI_sino_american_joint_commission_on_rural_reconstruction: "ความชวยเหลือฟนฟูชนบทจากอเมริกา"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc: "เราควรใชสายสัมพันธกับชาวอเมริกันเพื่อขยายงานในชนบทใหครอบคลุมโรงเรียนประจําหมูบาน และสงเสริมระบบการศึกษาที่มีประสิทธิภาพสําหรับทั้งประเทศ"
 CHI_a_matter_of_will: "เรื่องของเจตจํานง"
 CHI_a_matter_of_will_desc: "จีนอาจไดประโยชนจากแนวคิดตางชาติ แตดวยประวัติศาสตรของเรา เรามีเสนทางของตนเอง เราตองเริ่มวางรากฐานที่โรงเรียนประจําหมูบาน และสรางเอกภาพจากรากหญาขึ้นมา"
 CHI_glorify_deng_yanda: "เชิดชูเติ้ง เหยี่ยนตา"
 CHI_glorify_deng_yanda_desc: "กกมินตั๋งละทิ้งการปฏิวัติที่เราเริ่มไวในป 1911 เพราะการแสวงหากําไรอยางเห็นแกตัว มีอยูคนหนึ่งที่ยืนหยัดเพื่อสามัญชนและสรางเสนทางอื่นนอกเหนือจากทรราชและการประนีประนอม นั่นคือ เติ้ง เหยี่ยนตา เขาพลีชีพเพื่อความเชื่อของตน และเราจะไมมีวันลืมเขาหรือสิ่งที่เขายืนหยัด"
 CHI_apply_yandas_work: "สานตองานของเหยี่ยนตา"
 CHI_apply_yandas_work_desc: "เติ้งตองการระดมมวลชนและมอบทางเลือกใหประชาชนในชนบทเสมอ การเผยแพรแนวคิดจากหมูบานสูหมูบานจะทําใหองคกรของเราและประเทศโดยรวมเขมแข็งขึ้น"
 CHI_apply_yandas_work_tt: "ลดตนทุนการตัดสินใจ §Yการชี้นําทางการเมืองในชนบทและในเมือง§! ลง §G10§!"
 CHI_socialize_major_industries: "โอนอุตสาหกรรมหลักเปนของรัฐ"
 CHI_socialize_major_industries_desc: "เราปลอยใหบางคนสะสมความมั่งคั่งและอํานาจมากเกินไป จนอุตสาหกรรมสําคัญตกไปอยูในมือผิดคน เราควรนําอุตสาหกรรมเหลานั้นมาอยูในความดูแลของรัฐเพื่อความปลอดภัย"
 CHI_a_burgeoning_welfare_state: "รัฐสวัสดิการที่กําลังเติบโต"
 CHI_a_burgeoning_welfare_state_desc: "รัฐที่ดูแลประชาชนของตนยอมมีพลังและความยืดหยุนที่ไมมีใครเทียบได เราจะเริ่มกาวสูอนาคตที่เปนธรรมยิ่งขึ้น โดยไดแรงบันดาลใจจากชาวเยอรมันกอนที่พวกเขาจะตกอยูในความคลั่งลัทธิ"
 CHI_truly_free_speech: "เสรีภาพในการพูดอยางแทจริง"
 CHI_truly_free_speech_desc: "แมเราจะคุมครองประชาชนจากการถูกดําเนินคดีเพราะความคิดเห็น แตการถกเถียงในสังคมก็ยังคับแคบ เราตองสงเสริมใหผูคนเขารวมการสนทนาสาธารณะมากขึ้น เพื่อใหเสียงที่หลากหลายไดรับการรับฟงและแสดงจุดยืน"
 CHI_a_control_yuan_with_teeth: "สภาควบคุมที่มีเขี้ยวเล็บ"
 CHI_a_control_yuan_with_teeth_desc: "อํานาจทําใหคนฉอฉล เราจึงตองมีกลไกที่ทําใหนักการเมืองซื่อสัตย ภายใตเจียง ไคเช็ก องคกรที่มีหนาที่นี้ถูกทําใหไรนํ้ายา เราจะสรางองคกรนี้ขึ้นใหมใหทําภารกิจไดอยางเต็มที่"
 CHI_unify_as_the_china_democratic_league: "รวมตัวเปนสันนิบาตประชาธิปไตยจีน"
 CHI_unify_as_the_china_democratic_league_desc: "ในฐานะกลุมเล็ก ๆ ที่กระจัดกระจาย เราไมอาจตอกรกับกกมินตั๋งได แตหากรวมตัวกัน เราอาจมีโอกาส ทวาใครเลาจะเปนผูนําเรา?"
 CHI_continue_the_ding_xian_experiment: "สานตอการทดลองติ้งเสี้ยน"
 CHI_continue_the_ding_xian_experiment_desc: "โครงการฟนฟูชนบทที่ติ้งเสี้ยนไดรับการสนับสนุนจากขบวนการการศึกษามวลชนของเจมส เยน มาโดยตลอด ในฐานะหองทดลองทางสังคม โครงการนี้ไดพัฒนาและแสดงใหเห็นวิธียกระดับมาตรฐานการครองชีพ สุขภาพ ความรับผิดชอบทางการเมือง และวัฒนธรรมในหมูบานจีน เราควรใหทุนโครงการนี้เพื่อนําความทันสมัยสูชนบท"
 CHI_continue_the_ding_xian_experiment_tt: "\n§Yการไฟฟาและการศึกษามวลชน§! จะเริ่มแผขยายออกจาก §Yเหอเปยและหูหนาน§! เมื่อเวลาผานไป โดยรัฐหลักใหมหนึ่งรัฐจะไดรับตัวปรับคานี้ทุกสองเดือน"
 CHI_minsheng_focus: "หลักการหมินเซิง"
 CHI_minsheng_focus_desc: "รัฐสมัยใหมยอมดูแลพลเมืองของตน เพื่อวาในยามจําเปน พลเมืองจะสามารถและเต็มใจปกปองรัฐ ดวยเหตุนี้ เราตองนําหลักการหมินเซิง (ความผาสุกของประชาชน) มาใช และรับประกันวาพลเมืองทุกคนของชาติจะไดรับสวัสดิการ"
 CHI_minzu_focus: "หลักการหมินจู"
 CHI_minzu_focus_desc: "แนวคิดเรื่องการเปนสวนหนึ่งของชาติ แทนที่จะเปนของชนเผาหรือศาสนา คือสิ่งที่เปลี่ยนกลุมคนใหกลายเปนรัฐ ดังนั้น เราตองนําหลักการหมินจู (ชาตินิยม) มาใช และทําใหประชาชนทุกคนของชาติมีความรูสึกชาตินิยมและรักชาติอยางแรงกลา พรอมทั้งมีความเปนหนึ่งเดียวภายใตรัฐบาลกลาง"
 CHI_minquan_focus: "หลักการหมินเฉวียน"
 CHI_minquan_focus_desc: "การเดินทางที่ ดร.ซุน ยัตเซ็น เริ่มตนไวจะนําไปสูสาธารณรัฐที่เปนหนึ่งเดียวในที่สุด นี่ยอมเปนการเดินทางที่ยาวไกล แตเราจะกาวไปทีละกาว กาวแรกคือการนําหลักการหมินเฉวียน (อํานาจของประชาชน) มาใช และรับประกันวาพลเมืองจีนทุกคนจะไดมีสิทธิออกเสียงเลือกตั้ง"
 CHI_demand_regional_adherence: "เรียกรองใหภูมิภาคปฏิบัติตาม"
 CHI_demand_regional_adherence_desc: "บัดนี้เราพิสูจนใหผูปกครองระดับภูมิภาคของจีนเห็นไดแลววาเราไดนําหลักไตรราษฎรมาใชอยางเหมาะสม เราจึงมีโอกาสกดดันใหพวกเขาทําเชนเดียวกัน ซึ่งทายที่สุดจะนําไปสูการสยบและผนวกพวกเขาเขากับสาธารณรัฐภายใตการชี้นําของอํานาจสวนกลางของเรา"
 CHI_demand_regional_adherence_tt: "ปลดล็อกการตัดสินใจเพื่อ §Yพัฒนา§! ภูมิภาคที่ขุนศึกควบคุม และบังคับใหปฏิบัติตามหลักไตรราษฎร เพิ่มการสนับสนุน §Yประชาธิปไตย§! ของพวกเขา และในที่สุด §Yสยบและผนวก§! พวกเขา"
 CHI_zhonghua_minzu_focus: "จงหัวหมินจู"
 CHI_zhonghua_minzu_focus_desc: "เมื่อขุนศึกและผูวาการภูมิภาคทั้งหมดกลับมาอยูใตการควบคุมของเราแลว ก็ถึงเวลาเริ่มการรวมชาติอยางแทจริงและมองออกไปภายนอก ดินแดนอันชอบธรรมหลายแหงของเราสูญเสียใหแกพวกชาตินิยมหัวรุนแรงและมหาอํานาจตางชาติ และบัดนี้เราตองทําทุกวิถีทางเพื่อนําดินแดนเหลานั้นกลับคืนสูรมเงาของสาธารณรัฐ"
 CHI_zhonghua_minzu_focus_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐของ [MON.GetFlag] §Y[MON.GetAdjective]§!, [TAN.GetFlag] §Y[TAN.GetAdjective]§! และ [TIB.GetFlag] §Y[TIB.GetAdjective]§! เปนดินแดนหลัก"
 CHI_zhonghua_minzu_focus_2_tt: "แทนที่ §Y$CHI_the_political_tutelage_dm$§! ดวย §Y$CHI_the_political_tutelage_upgraded_dm$§! ผลที่เปลี่ยนแปลง:"
 CHI_toward_a_socialist_economy: "มุงสูเศรษฐกิจสังคมนิยม"
 CHI_toward_a_socialist_economy_desc: "หากจะเปลี่ยนสังคมของเราใหดีขึ้นอยางแทจริง เราตองเปลี่ยนวิธีที่เงินหมุนเวียน และปลดผูบริหารบรรษัทที่ไดตําแหนงมาเพียงเพราะระบบเสนสาย คนทํางานจะไดมีสิทธิมีเสียงในประเทศของตนอีกครั้ง และชาว[ROOT.GetAdjective]ทุกคนจะเทาเทียมกัน!"
 CHI_enact_georgist_tax_reforms: "ปฏิรูปภาษีตามแนวจอรจิสต"
 CHI_enact_georgist_tax_reforms_desc: "แนวคิดจอรจิสตเปนรากฐานของทฤษฎีเศรษฐกิจของซุน ยัตเซ็น ผูตองการเก็บภาษีจากการถือครองที่ดิน 'หนทางเดียวในการคํ้าจุนรัฐบาลคือภาษีที่ยุติธรรม สมเหตุสมผล และกระจายอยางเทาเทียมอยางที่สุด ซึ่งเราจะใชเปนรากฐานของระบบใหมของเรา'"
 CHI_leverage_contacts: "ใชประโยชนจากสายสัมพันธ"
 CHI_leverage_contacts_desc: "เพื่อนรวมชาติของเรากระจายอยูทั่วโลก บางสวนถึงกับไปถึงอเมริกา ในสหรัฐอเมริกา ผูติดตอของเรารอเพียงใหเรารองขอความชวยเหลือเทานั้น"
 CHI_reach_out_for_help: "ขอความชวยเหลือ"
 CHI_reach_out_for_help_desc: "เงาทะมึนของลัทธิทหารนิยมคุกคามจีนจากทางตะวันออก และเราตองขอความชวยเหลือจากผูติดตอชาวอเมริกัน พวกเขาตองเขาใจวาเราคือแนวปองกันดานแรกของพวกเขาตอภัยคุกคามจากญี่ปุน"
 CHI_reach_out_for_help_tt: "§Y[USA.GetNameDefCap]§! จะมีแนวโนมสง §Yใหยืม-เชา§! มาใหเรามากขึ้น"
 CHI_deal_with_the_shadow_elements: "จัดการกับกลุมอิทธิพลมืด"
 CHI_deal_with_the_shadow_elements_desc: "กลุมลึกลับในประเทศของเรากําลังเปนพิษตอประชาชนเพื่อผลประโยชนสวนตน เรื่องนี้จะปลอยไวไมได!"
 CHI_utilize_the_albazinian_contact_tt: "ปลดล็อกการตัดสินใจเพื่อขอการสนับสนุนเพิ่มเติมจาก[SOV.GetNameDef]"
 CHI_shifting_the_balance: "พลิกดุลอํานาจ"
 CHI_shifting_the_balance_desc: "แมเราจะไดรับการสนับสนุนจากตางประเทศ แตก็เปนเพียงการสนับสนุนแบบตั้งรับ เราจะขอใหพวกเขาเขามามีสวนรวมอยางจริงจัง เพื่อชวยเราปราบภัยคุกคามจากญี่ปุนใหสิ้นซาก"
 CHI_the_german_mission: "คณะผูแทนเยอรมัน"
 CHI_the_german_mission_desc: "เรามีสายสัมพันธกับเยอรมนีมากวาทศวรรษ และเราควรใชผูติดตอของจาง จวินมายโดยเฉพาะเพื่อขยายความรวมมือ"
 CHI_reach_out_to_expats: "ติดตอชาวจีนโพนทะเล"
 CHI_reach_out_to_expats_desc: "ประชาชนของเรากระจัดกระจายไปทั่วโลกและสรางชีวิตใหมใหตนเอง บางคนอาจมองวานั่นคือจุดออน แตสําหรับเรา มันคือจุดแข็ง เราจะเรียกรองเพื่อนรวมชาติที่อยูหางไกลใหกลับมาชวยในยามที่ชาติตองการ"
 CHI_reach_out_to_expats_tt: "ปลดล็อกการตัดสินใจเพื่อ §Yเพิ่มสวนเกินขีดความสามารถทางเศรษฐกิจรายเดือน§! จากตางชาติ โดยใชผูติดตอและชุมชนชาวจีนโพนทะเลของเรา"
 CHI_invoke_the_nine_powers: "อางสนธิสัญญาเกามหาอํานาจ"
 CHI_invoke_the_nine_powers_desc: "แมสนธิสัญญาไมเปนธรรมจะถูกลงนามจนเราเสียเปรียบ แตเกามหาอํานาจไดตกลงรักษาสถานะเดิมไววาจะไมมีชาติใดยึดครองจีนเพิ่มอีก เมื่อญี่ปุนยังคงรุกรานอยู ก็ถึงเวลาอางขอตกลงนั้นแลว"
 CHI_aeronautical_expertise: "ความเชี่ยวชาญดานการบิน"
 CHI_aeronautical_expertise_desc: "นักบินชาวจีนไดรับชื่อเสียงอยางสมควรอยูอีกฟากของแปซิฟก เราสามารถเรียกพวกเขากลับบานเพื่อใชความเชี่ยวชาญของพวกเขาได"
 CHI_expand_the_faction: "เชิญชวนผูรักเสรี"
 CHI_expand_the_faction_desc: "เชนเดียวกับขบวนการในประเทศของเรา อุดมการณประชาธิปไตยในเอเชียตองพึ่งพากลุมเล็ก ๆ จํานวนมาก เราตองรวมทุกขบวนการเขาเปนฝายที่ใหญขึ้น เพื่อใหสามารถยืนหยัดตอตานผูที่จะกดขี่เราได"
 CHI_pacific_entente_faction: "ความตกลงแปซิฟก"
 CHI_expand_the_faction_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญชาติ §Yประชาธิปไตย§! ใน §Yเอเชีย§! และ §Yโอเชียเนีย§! เขารวมฝายของเรา"
 CHI_make_a_stand_against_the_colonialists: "ยืนหยัดตอตานนักลาอาณานิคม"
 CHI_make_a_stand_against_the_colonialists_desc: "ศตวรรษแหงจักรวรรดิไดสิ้นสุดลงแลว และเราคือผูประกาศยุคแหงการกําหนดชะตากรรมของตนเอง เราตองประกาศขอความเรียบงายนี้ใหผูที่ยึดติดกับระเบียบเการับรู และหากพวกเขาตอตาน พวกเขาจะไดรูจักความเกรี้ยวกราดของประชาชน"
 CHI_make_a_stand_against_the_colonialists_tt: "ปลดล็อกการตัดสินใจ §Yตอตานลัทธิอาณานิคม§! เพื่อปลดปลอยอาณานิคมใน §Yเอเชียและโอเชียเนีย§! ที่มหาอํานาจอาณานิคมยึดครองอยู"
 CHI_spreading_the_light_of_freedom: "สองแสงแหงเสรีภาพ"
 CHI_spreading_the_light_of_freedom_desc: "การปลอดจากภัยคุกคามตางชาติเปนเพียงกาวแรกบนเสนทางของเรา เรายังตองทําใหมั่นใจวาภัยคุกคามภายในจะไมขัดขวางเจตจํานงของชาติในการแสดงออก"
 CHI_spreading_the_light_of_freedom_tt: "ปลดล็อกการตัดสินใจเพื่อ §Yปลุกกระแสสาธารณรัฐนิยม§! ภายในชาติ §Yเอเชียและโอเชียเนีย§!"

 CHI_correct_a_historical_wrong: "แกไขความผิดพลาดทางประวัติศาสตร"
 CHI_correct_a_historical_wrong_desc: "สิ่งที่ชาวยุโรปกระทําตอโลกนั้นอยุติธรรมเกินกวาจะรับได และเปนรอยดางบนผืนผาแหงอารยธรรมมนุษย เราจะแกไขความผิดนี้และลงโทษพวกเขาสําหรับอาชญากรรมที่กอไว"
 CHI_championing_the_cause_of_liberty: "ผูนําแหงอุดมการณเสรีภาพ"
 CHI_championing_the_cause_of_liberty_desc: "เราไดนําแสงแหงเสรีภาพมาสูเอเชีย และยืนหยัดเปนประภาคารสําหรับทุกคนที่ใหคุณคากับเสรีภาพและการกําหนดชะตากรรมของตนเอง"
 CHI_utilize_the_albazinian_contact: "ใชผูติดตอชาวอัลบาซิน"
 CHI_utilize_the_albazinian_contact_desc: "บิชอปซีเมโอน ตู เปนโปรโตดีคอนคนปจจุบันของคริสตจักรออรโธดอกซจีน ในฐานะชาวอัลบาซินที่เดินทางไปทั่วจีน บิชอปมีความสัมพันธใกลชิดกับสมาชิกกองกําลังรัสเซียขาวเกาหลายคน บางทีทานอาจโนมนาวใหชาวรัสเซียสงความชวยเหลือมายังชาติของเราได?"


  # Wang Jingwei
 CHI_prepare_for_a_change_in_leadership: "เตรียมพรอมเปลี่ยนผูนํา"
 CHI_prepare_for_a_change_in_leadership_desc: "รัฐบาลชุดปจจุบันอยูกับเรามาหนึ่งทศวรรษแลว และเงาของ[JAP.GetNameDef]ก็ยังคงหลอกหลอนชาติ[CHI.GetAdjective] ถึงเวลาที่ตองใหผูอื่นขึ้นกุมบังเหียนอํานาจ"
 CHI_prepare_for_a_change_in_leadership_tt: "§R[CHI_chiang_kaishek.GetName] จะถูกแทนที่ดวย [CHI_wang_jingwei.GetName] ในกรณีซีอาน§!"
 CHI_prepare_for_a_change_in_leadership_tt_2: "§Rการสงเจียง ไคเช็กไปกวางโจวระหวางกรณีเหลียงกวางจะทําใหเขาเสียชีวิตเร็วขึ้น ทําใหสามารถเลือก $CHI_look_for_allies$ ได§!"
 CHI_prepare_for_a_change_in_leadership_dai_li: "§R[CHI_chiang_kaishek.GetName] จะถูกแทนที่ดวย [CHI_dai_li.GetName] ในกรณีซีอาน§!"
 CHI_avoid_another_crisis: "หลีกเลี่ยงวิกฤตอีกครั้ง"
 CHI_avoid_another_crisis_desc: "ในป 1931 เราไมไดเตรียมพรอมและถูกกองทัพ[JAP.GetAdjective]จูโจมโดยไมทันตั้งตัว แมจะผานไปครึ่งทศวรรษแลว เราก็ยังไมพรอมจะตีโตพวกเขา และตองหาทรัพยากรอันลํ้าคาที่เรียกวาเวลาเพิ่มขึ้น เราสามารถเสนอสัมปทานเล็ก ๆ นอย ๆ เพื่อเอาใจฝาย[JAP.GetAdjective] ใหเรามีเวลาเตรียมรับพายุที่หลีกเลี่ยงไมไดจากทางตะวันออก"
 CHI_avoid_another_crisis_tt: "\nจะไดตัวเลือกในการชะลอการรุกรานของญี่ปุนดวยการใหสัมปทาน"
 CHI_lay_the_foundation_for_a_united_china: "วางรากฐานสูจีนที่เปนหนึ่งเดียว"
 CHI_lay_the_foundation_for_a_united_china_desc: "รัฐบาลปจจุบันเปนเพียงแกงอันธพาลที่รูจักแตอํานาจของดาบ ชาติที่แข็งแรงตองการมากกวาการปกครองดวยกําลัง สถาบันที่เขมแข็งภายใตรัฐบาลพลเรือนคือรากฐานของการปฏิวัติที่ตอเนื่องของเรา"
 CHI_preempt_the_inevitable: "ชิงลงมือกอน"
 CHI_preempt_the_inevitable_desc: "เรารูวา[JAP.GetNameDef]กําลังคืบเขามาใกล โดยเชื่อวาเราออนแอและพรอมใหยึดครอง ลองนึกดูวาพวกเขาจะประหลาดใจเพียงใดหากเราโจมตีกอน"
 CHI_utilize_german_contacts: "ใชผูติดตอชาวเยอรมัน"
 CHI_utilize_german_contacts_desc: "แมพวกอนารยชนตะวันออกจะกระหายเลือดไมรูจักพอ แตในหมูพวกเขาก็มีผูที่รับฟงเหตุผลได เพียงแตไมใชจากเรา ดวยการติดตอผานคนรูจักรวมกันในยุโรป เราสามารถใหพวกเขาชวยลดความรอนแรงของพวกหัวรุนแรงได"
 CHI_utilize_german_contacts_tt: "หากเรายอมรับคําขอของ[GER.GetAdjective]เรื่องสนธิสัญญาตอตานโซเวียต [GER.GetNameDef]จะมีแนวโนมเขามาแทรกแซงแทนเรามากขึ้น"
 CHI_utilize_german_contacts_wang_tt: "เราจะใชสายสัมพันธผาน [CHI.GetLeader] เพื่อใหได:"
 CHI_look_for_allies: "หาพันธมิตรภายใน"
 CHI_look_for_allies_desc: "เจียงมีเวลาเกือบทศวรรษในการรวบอํานาจเหนือพรรค แตก็ยังมีบางกลุมที่ไมยอมยืนอยูขางเขา เราตองตามหาคนเหลานี้และรวมพวกเขาเปนฝายคานที่แทจริง"
 CHI_infiltrate_the_examination_yuan: "แทรกซึมสภาสอบคัดเลือก"
 CHI_infiltrate_the_examination_yuan_desc: "รัฐไมไดขับเคลื่อนดวยผลงานของคนเพียงไมกี่คน แตดวยการทํางานอยางไมรูเหน็ดเหนื่อยของขาราชการจํานวนมหาศาล หากเราแทรกซึมเขาไปในองคกรที่ตรวจสอบคุณสมบัติของขาราชการเหลานั้นได ขบวนการของเราจะไดประโยชนอยางมาก หากเราทําใหขาราชการมีจุดยืนเดียวกับเราได ก็จะเกิดเปนพลังที่ไมมีใครหยุดยั้ง"
 CHI_take_control_of_the_executive_yuan: "ยึดสภาบริหาร"
 CHI_take_control_of_the_executive_yuan_desc: "ผูออกกฎหมายยอมมีอํานาจ แตผูบังคับใชกฎหมายยอมอยูเหนือกฎหมายได เมื่อคนของเราอยูในตําแหนงรัฐมนตรี เราจะสามารถตอตานลัทธิเจียงไดในทุกระดับ"
 CHI_take_control_of_the_executive_yuan_tt: "เมื่อขุนศึกรายใหมตกเปนรัฐหุนเชิด รัฐหุนเชิดขุนศึกทุกรายที่มีอยูจะไดรับ: อัตราอํานาจปกครองตนเอง §Y[?executive_yuan_autonomy_ratio|%]§!"
 CHI_our_people_in_the_legislative: "คนของเราในฝายนิติบัญญัติ"
 CHI_our_people_in_the_legislative_desc: "ระบบปจจุบันถูกทําใหไรเขี้ยวเล็บภายใตเจียง ผูนําเผด็จการพยายามแทนที่อํานาจสวนกลางที่เขมแข็ง และนั่นคือสิ่งที่เราตองตอสู เราจะตองเขียนอํานาจอิสระของหนวยงานรัฐบางสวนใหมเพื่อเสริมแกนกลางของชาติใหแข็งแกรง"
 CHI_clear_out_sycophants: "กวาดลางพวกประจบสอพลอ"
 CHI_clear_out_sycophants_desc: "ทรราชยอมเลี้ยงพวกขี้ประจบ และยิ่งปกครองนานเทาไร คนพวกนี้ก็ยิ่งมากขึ้น แมเราจะกุมอํานาจนิติบัญญัติและบริหารในนาม แตก็ยังมีคนจํานวนมากที่ยึดถือแนวคิดเกา เราควรรวมแรงกันทําใหผูที่ไดประโยชนจากระบอบเดิมถูกจัดใหอยูในที่ที่เหมาะสม"
 CHI_impair_the_control_yuan: "ลดทอนสภาควบคุม"
 CHI_impair_the_control_yuan_desc: "การตรวจสอบและถวงดุลเปนปจจัยสําคัญของระบอบการเมืองที่ใชการได แตก็อาจถวงความกาวหนาไดเชนกัน จะเปนผลดีตออุดมการณของเราหากสภาควบคุมไมทรงพลังอยางที่บางคนหวัง เพื่อไมใหขัดขวางเปาหมายของเรา"
 CHI_impair_the_control_yuan_tt: "อัปเกรด §Yการตัดสินใจความพยายามผนวกรวม§! ใหมีผล:"
 CHI_impair_the_control_yuan_tt_2: "480 วัน $instead_of$ 365 วัน"
 instead_of: "แทนที่จะเปน:"
 and_last_for: "และคงอยูเปนเวลา:"


 CHI_appoint_sympathetic_judges: "แตงตั้งผูพิพากษาที่เห็นดวย"
 CHI_appoint_sympathetic_judges_desc: "เมื่อมีผูพิพากษาอยูในตําแหนงสําคัญ เราจะสามารถขยายอํานาจลงสูเบื้องลางและแผออกไปจนถึงมณฑลตาง ๆ"
 CHI_appoint_sympathetic_judges_tt: "รัฐในอารักขาขุนศึกทุกรายในอนาคตจะไดรับจิตวิญญาณตอไปนี้เมื่อตกเปนรัฐหุนเชิด:"
 CHI_close_whampoa: "ปดโรงเรียนหวงผู"
 CHI_close_whampoa_desc: "หวงผูเปนที่รูกันมาตลอดวาเปนอาณาจักรสวนตัวของเจียงและเปนแหลงบมเพาะแนวคิดทางอุดมการณของเขา นี่คือสถาบันที่ไมอาจปลอยใหคงอยูตอไปได เราจึงจะปดมันลงและตําหนิทุกคนที่รูวามีความเกี่ยวของ"
 CHI_close_whampoa_tt: "นายพลที่เหลืออยูทุกคนจะไดรับ: คาสถานะสุม §G+3§!"
 CHI_censure_the_opposition: "ตําหนิฝายคาน"
 CHI_censure_the_opposition_desc: "สภาควบคุมออนแออยูแลว แตหากเราควบคุมไดทั้งหมด เราก็สามารถแกไขกลุมที่ไมพึงประสงคได การชี้แนะเรื่องความประพฤติที่เหมาะสมจะเปนมาตรการแกไขที่ดี"
 CHI_the_freedom_to_abject: "เสรีภาพในการคัดคาน"
 CHI_the_freedom_to_abject_desc: "ระบบที่ไมอาจถูกวิจารณไดจะไมมีวันเติบโตและพัฒนา เราเหยียบยํ่าผูที่ชี้ใหเห็นถึงกลุมที่รํ่ารวยบนความเดือดรอนของประชาชน[CHI.Getadjective]มานานเกินไปแลว เราตองมีกระบวนการที่เปดใหชี้ขอบกพรองของระบบได ตราบเทาที่ไมทําใหเราสั่นคลอน"
 CHI_expropriate_industrialists: "ยึดทรัพยนักอุตสาหกรรม"
 CHI_expropriate_industrialists_desc: "สมุนของเจียงไดประโยชนมหาศาลจากการติดตามคนฉอฉลเชนนั้นและสะสมความมั่งคั่งไวมากมาย ผลประโยชนสวนตนจะอยูเหนือพรรคไมได และสิ่งที่เกิดขึ้นตองไดรับการแกไข เราจะคืนสิ่งที่เปนของรัฐโดยชอบใหแกรัฐ"
 CHI_politicise_the_process: "ทําใหกระบวนการเปนเรื่องการเมือง"
 CHI_politicise_the_process_desc: "ในฐานะขาราชการ การเขาใจความรับผิดชอบทางการเมืองของตนเปนเรื่องสําคัญ ไมใชทุกคนที่เขาใจเรื่องนี้ จึงตองไดรับการสั่งสอนใหดีขึ้น เราจะปรับปรุงการศึกษาและการสอบของขาราชการทุกคนเพื่อใหเกิดความเขาใจอยางกวางขวาง"
 CHI_a_functioning_bureaucracy_first: "ระบบราชการที่ใชการไดมากอน"
 CHI_a_functioning_bureaucracy_first_desc: "แมการควบคุมกลไกรัฐจะสําคัญยิ่ง แตก็ไรประโยชนหากไมมีรัฐตั้งแตแรก การใหสถาบันตาง ๆ มีอํานาจปกครองตนเองในระดับหนึ่ง และสงเสริมใหคนที่เหมาะสมไดเลื่อนขั้นตามความสามารถ ไมใชตามแนวคิดที่ถูกตอง จะเปนผลดีตอเราในระยะยาว"
 CHI_extend_jurisdiction_to_the_provinces: "ขยายเขตอํานาจสูมณฑล"
 CHI_extend_jurisdiction_to_the_provinces_desc: "[ROOT.GetRulingParty]ทําไดดีในการยึดกุมเมืองใหญและสถาบันสวนกลาง แตเรายังทําไดดีกวานี้ในพื้นที่รอบนอก การขยายอํานาจจะชวยไดมากในการรวมจีนเปนหนึ่งและตานทานการบุกโจมตีของฝาย[JAP.GetAdjective]"
 CHI_affirm_civilian_primacy: "ยืนยันความเปนใหญของพลเรือน"
 CHI_affirm_civilian_primacy_desc: "เจียงสรางอํานาจบนหลังของกองทัพ แตเรารูวาความคิดของนายทหารนั้นโนมเอียงไดงาย และมีนอยคนที่เปนประโยชนตอเรา เราตองทําใหกองทัพเขาใจวาพวกเขาอยูใตการควบคุมของพลเรือน"
 CHI_proclaim_a_new_chapter: "ประกาศบทใหม"
 CHI_proclaim_a_new_chapter_desc: "ระบอบเดิมอางเสมอวาเปนพลังแหงเสรีภาพและประชาธิปไตย แตความจริงคือพวกเขากระหายเพียงอํานาจ เมื่อหวัง จิงเวยรวบอํานาจไดแลว บัดนี้เราประกาศไดวารัฐบาลพลเรือนไดกลับมากุมบังเหียนอํานาจอีกครั้ง"
 CHI_negotiate_the_nine_powers_treaty: "เจรจาสนธิสัญญาเกามหาอํานาจ"
 CHI_negotiate_the_nine_powers_treaty_desc: "ราชวงศชิงยอมกมหัวใหมหาอํานาจตะวันตก และสนธิสัญญาแหงศตวรรษที่ 19 ยังคงหลอกหลอนเราดั่งภูตผี ผลกระทบของมันยังปกคลุมจีนอยู เราจะติดตอประเทศคูสัญญาเพื่อดูวาจะคลี่คลายความขัดแยงไดหรือไม คราวนี้ไมใชในฐานะผูรับใช แตในฐานะผูเทาเทียม"
 CHI_start_looking_outwards: "เริ่มมองออกไปภายนอก"
 CHI_start_looking_outwards_desc: "ความผิดพลาดในอดีตคือการเชื่อวาเราสามารถแยกตัวจากโลกได ชาติอาณานิคมฉีกทึ้งเราไปพรอมกับสวนที่เหลือของเอเชีย ทิ้งใหเราตองอัปยศ เรื่องนี้จะปลอยไวโดยไมลงโทษไมได เราจะรวบรวมเอเชียที่เหลือใหยืนหยัดรวมกันอยางเขมแข็ง"
 CHI_start_looking_outwards_tt: "เราจะสามารถเชิญประเทศเอเชียที่เปนอิสระเขารวมฝายของเราได"
 CHI_liberate_the_peoples_of_asia: "ปลดปลอยประชาชาติแหงเอเชีย"
 CHI_liberate_the_peoples_of_asia_desc: "เชนเดียวกับในศตวรรษที่ผานมา เอเชียที่เหลือมองมาที่เราเพื่อขอการชี้นํา และเราจะตอบรับ เราจะชวยพวกเขาลุกขึ้นตอตานจักรวรรดินิยม คนพบเสรีภาพของตนเอง และแกแคนแทนพี่นองของพวกเขา"
 CHI_liberate_the_peoples_of_asia_tt: "เราจะไดรับเปาหมายสงครามตอทุกชาติที่ควบคุมรัฐอาณานิคมหรือมีรัฐหุนเชิดใน §Y$asia$§!"
 CHI_liberate_the_peoples_of_asia_tt_2: "ปลดล็อกการตัดสินใจเพื่อตั้งรัฐบาลหุนเชิดทั่ว §Y$asia$ §!"
 CHI_punish_the_signatories: "ลงโทษประเทศคูสัญญา"
 CHI_punish_the_signatories_desc: "ความเสียหายที่ชาติตะวันตกกอไวตอชาติของเรานั้นประเมินคามิได มันทําใหเราตกตํ่ายํ่าแย พวกเขาตองถูกทําใหเขาใจถึงสิ่งที่ไดทําลงไป และเริ่มชดใชหนี้ทางประวัติศาสตร"
 CHI_bring_the_revolution_further: "ขยายการปฏิวัติใหไกลยิ่งขึ้น"
 CHI_bring_the_revolution_further_desc: "เสนทางแหงการปลดปลอยของเราไปไดไกลเกินกวาที่เคยคิดไว เราจะสองแสงแหงเสรีภาพไปทั่วแปซิฟกและผลักดันนักลาอาณานิคมใหถอยรนไปไกลยิ่งขึ้น"
 CHI_bring_the_revolution_further_tt: "เราจะไดรับเปาหมายสงครามตอทุกชาติที่ควบคุมรัฐอาณานิคมหรือมีรัฐหุนเชิดใน §Y$Australia$: §!"
 CHI_bring_the_revolution_further_tt_2: "แถลงการณของฝายเราจะครอบคลุม §Y$Australia$ §! ดวย\nปลดล็อกการตัดสินใจเพื่อตั้งรัฐบาลหุนเชิดทั่ว §Y$Australia$ §!"
 CHI_end_the_humiliation: "ยุติความอัปยศ"
 CHI_end_the_humiliation_desc: "ในที่สุดเราก็ยืนหยัดเปนมหาอํานาจไดอีกครั้งดังเชนในศตวรรษที่ผานมา เปนที่ชื่นชม ทรงอิทธิพล และนาเกรงขาม เราผงาดขึ้นเหนือผูอื่น ขับไลผูกดขี่ใหกลายเปนเพียงเรื่องในตําราประวัติศาสตร จะไมมีความอัปยศอีกตอไป!"

  # Chiang Kai-shek
 CHI_dang_guo: "ตั่งกั๋ว"
 CHI_dang_guo_desc: "เปาหมายของพรรคคือการนําประชาธิปไตยมาสูชาติของเรามาโดยตลอด แตในยามที่ไมแนนอนเชนนี้ กกมินตั๋งจําเปนตองดําเนินการไดอยางมีประสิทธิภาพ เราจึงตองใหพรรคอยูเหนือชาติไปพลางกอน"
 CHI_denounce_feudalism: "ประณามระบอบศักดินา"
 CHI_denounce_feudalism_desc: "แมเราจะประกาศตนวาเปนนักปฏิวัติ แตในพรรคของเรายังมีบางคนที่ประพฤติตัวเหมือนเจาที่ดินและชนชั้นนําในอดีต พวกศักดินาเกาเหลานี้ตองถูกเผชิญหนากับพฤติกรรมตอตานการปฏิวัติของพวกเขาตามที่เปนจริง"
 CHI_denounce_feudalism_tt: "จะไดรับ: §G+[?warlord_subjects_pp_gain_base] อํานาจทางการเมือง§! ตอเดือนสําหรับรัฐในอารักขาขุนศึกแตละราย"
 CHI_one_nation_undivided: "หนึ่งชาติ ไมแบงแยก"
 CHI_one_nation_undivided_desc: "การรวมมณฑลตาง ๆ ไวใตอํานาจเดียวที่ไมแบงแยกจะทําใหเรากาวขามความแตกแยกระหวางภูมิภาค และวางรากฐานสูชาติที่เขมแข็งและภาคภูมิ แลวเราจะสามารถยืนหยัดตอตานภัยคุกคามใด ๆ ทั้งจากภายนอกและภายใน"
 CHI_one_nation_undivided_tt: "จะเชิญขุนศึกทุกรายเขารวมฝายแนวรวมสามัคคี ยกเวน [PRC.GetName] และ [HBC.GetName]"
 CHI_one_nation_undivided_bypass_tt:  "§Yขุนศึกจีนทุกราย§!: ตองเปนจริงอยางนอยหนึ่งขอตอไปนี้: \n  ไมมีอยู\n  อยูในสงครามกับ §Y[ROOT.GetNameWithFlag]§!\n  เปนรัฐในอารักขาของ §Y[ROOT.GetNameWithFlag]§!\n  อยูในฝายเดียวกับ §Y[ROOT.GetNameWithFlag]§!\n  §Y[ROOT.GetName]§!: มี §Yเปาหมายสงคราม§! ตอพวกเขา"
 CHI_decree_the_end_to_corruption: "ประกาศยุติการทุจริต"
 CHI_decree_the_end_to_corruption_desc: "การทุจริตแพรระบาดในรัฐบาลของเรา ตั้งแตรัฐมนตรีระดับสูงสุดไปจนถึงทหารเกณฑชั้นตํ่าสุด เราตองกําจัดเจาหนาที่ที่ละโมบและฉอฉล เพื่อใหเกิดการบริหารที่ซื่อสัตย"
 CHI_reinforce_connections_with_shanghai_elites: "กระชับสายสัมพันธกับชนชั้นนําเซี่ยงไฮ"
 CHI_reinforce_connections_with_shanghai_elites_desc: "ในเซี่ยงไฮมีกลุมบุคคลที่มีความมั่งคั่งและอํานาจมหาศาล ซึ่งสั่งสมมาดวยการเคลื่อนไหวทั้งในที่มืดและที่แจง การสนับสนุนคนเหลานี้อาจเปนประโยชนตออุดมการณของเรา"
 CHI_introduce_the_baojia_system: "นําระบบเปาเจี่ยมาใช"
 CHI_introduce_the_baojia_system_desc: "ระบบเปาเจี่ยถูกใชจัดระเบียบประชาชนและรักษาความปลอดภัยมาตั้งแตโบราณ และพิสูจนแลววามีประสิทธิภาพสูง เราควรขยายระบบนี้ใหเปนพื้นฐานของการเกณฑทหาร เพราะจะรับประกันการไหลเขาของทหารใหมอยางตอเนื่อง"
 CHI_expand_the_tongzi_jun: "ขยายถงจื่อจวิน"
 CHI_expand_the_tongzi_jun_desc: "กองยุวชนสามารถบมเพาะพลเมืองรุนใหมที่ภักดีและมีวินัย การฝกทหารในระดับหนึ่งจะชวยเปดทางใหพวกเขาเขาสูกองทัพไดงายขึ้นดวย"
 CHI_demonstrate_our_resolve: "แสดงความมุงมั่น"
 CHI_demonstrate_our_resolve_desc: "โลกดูถูกเรามานานเกินไปแลว ถึงเวลาพิสูจนความแกรงของเราดวยการเอาชนะการรุกรานอันโหดรายนี้"
 CHI_arrest_the_seven_gentlemen: "จับกุมเจ็ดสุภาพบุรุษ"
 CHI_arrest_the_seven_gentlemen_desc: "แมในจีนจะมีนอยคนที่เห็นดวยกับการรุกรานของญี่ปุน แตวิธีรับมือกับมันเปนประเด็นที่สรางความแตกแยก เราไมอาจปลอยใหมีผูทาทายการปกครองของเรา จึงตองแสดงความเปนใหญในเรื่องนี้"
 CHI_develop_counterinsurgency_tactics_tt_2: "จะทําให §Y$CHI_counter_infiltration_measures$§! มีตนทุนเหลือเพียง §G25%§!"
 CHI_take_a_stance_on_illicit_trade: "แสดงจุดยืนตอการคาผิดกฎหมาย"
 CHI_take_a_stance_on_illicit_trade_desc: "เราตกอยูใตอิทธิพลของยาพิษที่ซึมซาบไปทั่วสังคมและผูคามันมานานเกินไป เราตองปฏิเสธสิ่งยั่วยวนนี้ เพื่อกาวสูศตวรรษใหมแหงความรุงเรืองอยางเขมแข็งและมีสติยิ่งขึ้น"
 CHI_reshuffle_the_green_gang: "ปรับโครงสรางแกงเขียว"
 CHI_reshuffle_the_green_gang_desc: "ตูหูใหญรับใชเรามาอยางดี แตก็มีอิทธิพลมากเกินไปแลว เมื่อศัตรูรายลอม เราตองลงมือโดยตรงมากขึ้น บางทีอาจถึงเวลาที่คนอื่นจะขึ้นมาคุมแกงเขียว?"
 CHI_legitimise_du: "รับรองสถานะของตู"
 CHI_legitimise_du_desc: "บางคนอยากใหเราอยูหางจากผูที่หาเลี้ยงชีพดวยวิธีนอกรีต แตนั่นอาจเทากับทิ้งทรัพยากรอันมีคาไป เราควรดูวาตู เยวเซิงจะทําอะไรไดบางหากไมตองทํางานในเงามืด"
 CHI_inspect_the_troops: "ตรวจพลทหาร"
 CHI_inspect_the_troops_desc: "จะมีการตรวจสอบอยางเขมงวดเพื่อรวมใจทหารใหอยูเบื้องหลังพรรคและ [root.GetLeader] กองทัพอันรุงโรจนของเราจะนําเราไปสูอนาคต"
 CHI_secure_the_soviet_border: "รักษาชายแดนโซเวียต"
 CHI_secure_the_soviet_border_desc: "หมีรัสเซียเปนเสี้ยนหนามที่คอยแทรกแซงกิจการของเรามานานเกินไป เราควรรักษาแนวรบดานเหนือดวยการสรางความสัมพันธอยางเปนทางการกับ[SOV.GetNameDef] และบางทีอาจไดอะไรมากกวานั้นจากพวกเขา"
 CHI_secure_the_soviet_border_tt: "§Rเราจะเห็นผูออกแบบยานเกราะที่สามารถเลือกไดในเหตุการณในอนาคต§!"
 CHI_send_the_first_lady_abroad: "สงสตรีหมายเลขหนึ่งไปตางประเทศ"
 CHI_send_the_first_lady_abroad_desc: "ยังมีบางชาติที่อาจสนับสนุนเราเมื่อเผชิญการรุกราน แตตอนนี้ยังลังเลอยู เราควรสงสตรีหมายเลขหนึ่งไปโนมนาวพวกเขาวา แมเราจะเสียเลือดเนื้อดั่งมหาสมุทรและแบกรับภาระสงครามอันหนักอึ้งอยางไมยอทอ แตเราจะยังคงไดรับชัยชนะ"
 CHI_take_advantage_of_dus_contacts: "ใชประโยชนจากเสนสายของตู"
 CHI_take_advantage_of_dus_contacts_desc: "ผูนําแกงเขียวมีเพื่อนอยูในหลายที่และมีความรูที่นอยคนจะมี เครือขายเชนนี้อาจเปนประโยชนตอเราหากใชอยางถูกวิธี แมวาจะทําใหคนนอกคอกบางคนไดประโยชนก็ตาม"
 CHI_draw_support_from_the_big_families: "ดึงการสนับสนุนจากตระกูลใหญ"
 CHI_draw_support_from_the_big_families_desc: "จีนมีตระกูลทรงอิทธิพลจํานวนหนึ่งในภาคสวนตาง ๆ แมสิ่งนี้อาจไมชวยใหประเทศมีเสถียรภาพ แตสายสัมพันธเหลานี้ก็ยังใชผลักดันเปาหมายของเราได"
 CHI_prosecute_cronyism: "ดําเนินคดีระบบพวกพอง"
 CHI_prosecute_cronyism_desc: "ผลประโยชนสวนบุคคลอยูเหนือความตองการของรัฐมานานเกินไป การเลนพรรคเลนพวก การติดสินบน และการยักยอกไดฉีกทึ้งโครงสรางสังคมของเรา สิ่งนี้จะจบลงตั้งแตบัดนี้ และยุคใหมแหงคุณธรรมกําลังรออยู!"
 CHI_crack_down_on_illicit_goods: "ปราบปรามสินคาผิดกฎหมาย"
 illicit_good_improvement_increase: "เพิ่มความเร็วในการกําจัด §Yการคาผิดกฎหมาย§! อีก §G+2%§! ทุก §Y6 เดือน§!"
 which_will_give_tt: "ซึ่งจะให:"
 CHI_crack_down_on_illicit_goods_desc: "เราตกอยูใตอิทธิพลของยาพิษที่ซึมซาบไปทั่วสังคมและผูคามันมานานเกินไป เราตองปฏิเสธสิ่งยั่วยวนนี้ เพื่อกาวสูศตวรรษใหมแหงความรุงเรืองอยางเขมแข็งและมีสติยิ่งขึ้น"
 CHI_turn_a_blind_eye: "ทําเปนมองไมเห็น"
 CHI_turn_a_blind_eye_desc: "ตองยอมรับวาการคานอกระบบบางอยางสงผลเสียตอโครงสรางสังคมจีน อยางไรก็ตาม ผลกําไรจากการคานี้ปฏิเสธไมได และหากเราปลอยไว เราก็อาจไดรับความมั่งคั่งมหาศาล"
 CHI_weaponise_the_hongmen: "ติดอาวุธใหแกง"
 CHI_weaponise_the_hongmen_desc: "ในเขตเมืองทาของเรามีสมาคมลับที่ฝกการปองกันตัวมาแลว ซึ่งเราสามารถหันไปใชกับศัตรูได หากใหการสนับสนุนพวกเขามากพอ พวกเขาจะสรางความปนปวนใหผูรุกรานที่กลาลวงลํ้าแผนดินของเรา"
 CHI_weaponise_the_hongmen_tt: "รัฐชายฝงของจีนและรัฐที่มีเมืองใหญทุกรัฐที่ถูกยึดครอง:\n  การตอตาน: §R+30.0%§!"
 CHI_facilitate_operation_zet: "อํานวยความสะดวกปฏิบัติการเซต"
 CHI_facilitate_operation_zet_desc: "เราเขาใจวา[SOV.GetNameDef]ไมสบายใจกับทาทีกาวราวของ[JAP.GetNameDef]ในเอเชียตะวันออก พวกเขายินดีใหการสนับสนุนดานยุทโธปกรณและอาสาสมัครแกเรา สิ่งที่เราตองทําคือเตรียมพรอมรับความชวยเหลือนั้น"
 CHI_from_many_to_one: "จากหลายเปนหนึ่ง"
 CHI_from_many_to_one_desc: "ชาติของเรามีผูคนนับไมถวน แตระยะหลังเราแตกแยกและถูกฉีกทึ้งดวยความเห็นที่แตกตาง หากเราจะตานทานการโจมตีจากตางชาติและอยูรอดในที่สุด เราตองรวมใจกันเบื้องหลังเปาหมายรวมเดียว"
 CHI_from_many_to_one_tt: "ไดรับเสถียรภาพ §G+1.5%§! สําหรับขุนศึกแตละรายในฝายของเรา"
 CHI_from_many_to_one_faction_tt: "จะเพิ่ม $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$ §G+20.0%§! เมื่อการบรรลุแถลงการณของฝายอยูในระดับตํ่า \nจะเพิ่ม $MODIFIER_AUTONOMY_GAIN_WARSCORE$ §G-10.0%§! เมื่อการบรรลุแถลงการณของฝายอยูในระดับสูง"
 CHI_request_soviet_advisors: "ขอที่ปรึกษาโซเวียต"
 CHI_request_soviet_advisors_desc: "สงครามเปลี่ยนแปลงไปอยางสิ้นเชิงในชวงหลายทศวรรษหลัง และเราก็ตามหลังอยู [SOV.GetNameDefCap]เสนอจะสงผูเชี่ยวชาญที่มีคุณภาพมาชวยใหเราไลตามดานยานเกราะทัน และเราควรตอบรับ"
 CHI_the_northwest_highway: "ทางหลวงตะวันตกเฉียงเหนือ"
 CHI_the_northwest_highway_desc: "เรามีพรมแดนยาวรวมกับ[SOV.GetnameDef] จึงนาจะมีโอกาสมากมายในการขนสงสิ่งของระหวางสองระบอบโดยไมถูกรบกวน อยางไรก็ตาม โครงสรางพื้นฐานในภูมิภาคเหลานั้นขาดแคลนอยางยิ่ง เราควรมุงสรางเสนทางที่อยูหางไกลจากแนวหนา เพื่อใหรับความชวยเหลือจากมิตร[SOV.Getadjective]ไดมากขึ้น"
 CHI_collaborate_with_allied_forces: "รวมมือกับกองกําลังสัมพันธมิตร"
 CHI_collaborate_with_allied_forces_desc: "เราตอสูอยางยาวนานและหนักหนวงกับภัยคุกคามจาก[JAP.GetAdjective] แตบัดนี้เราไมไดโดดเดี่ยวอีกตอไป เพื่อใหประสานความพยายามกันได เราควรผนวกกองทัพของทั้งสองฝายใหใกลชิดยิ่งขึ้น และควาชัยชนะครั้งสุดทาย"
 CHI_collaborate_with_allied_forces_tt: "ปลดล็อกการตัดสินใจเพื่อจัดตั้งกองกําลัง X และ Y ซึ่งจะสรางกองพล"
 CHI_scout_for_air_experts: "เสาะหาผูเชี่ยวชาญดานการบิน"
 CHI_scout_for_air_experts_desc: "กองทัพอากาศของเรายังอยูในวัยทารก และหลายความทาทายตองฝาฟนอยางยากลําบาก เราจะสงเสริมความพยายามของกองทัพอากาศดวยการใชประโยชนจากความเชี่ยวชาญของผูอื่น"
 CHI_sell_lend_lease: "ขายยุทโธปกรณใหยืม-เชา"
 CHI_sell_lend_lease_desc: "การไดยุทโธปกรณมาใหกองกําลังยอมมีประโยชนเสมอ แตสิ่งที่ไดรับไมไดตรงกับความตองการเสมอไป อยางไรก็ตาม ที่ไหนสักแหงยอมตองการยุทโธปกรณเสมอ นั่นหมายความวามีตลาดสําหรับมันอยูเสมอ"
 CHI_sell_lend_lease_tt: "หากเรามี §Y$CHI_soviet_support$§! จะไดรับ: §Y+100 $CIC_BANK_HEADER$§! ตอเดือน\n\nหากเรามี §Y$CHI_american_support$§! จะไดรับ: §Y+150 $CIC_BANK_HEADER$§! ตอเดือน\n\n"
 CHI_international_instructors: "ครูฝกนานาชาติ"
 CHI_international_instructors_desc: "ความตองการนักบินและลูกเรือนั้นมหาศาล และเราฝกพวกเขาไดไมทัน การตอนรับครูฝกตางชาติเพิ่มขึ้นจะชวยเรงใหเรามีเครื่องบินขึ้นบินไดมากขึ้น"
 CHI_allocate_lend_lease: "จัดสรรยุทโธปกรณใหยืม-เชา"
 CHI_allocate_lend_lease_desc: "ปจจุบันจีนมีศูนยอํานาจหลายแหง แตมีเพียงหนึ่งเดียวที่ไดเปนตัวแทนของชาติในตางแดน เราสามารถใชขอไดเปรียบนี้ตัดสินวาใครจะไดรับการสนับสนุน และดวยเหตุนั้นใครจะไดแผอิทธิพล"
 CHI_allocate_lend_lease_tt: "ปลดล็อกการตัดสินใจเพื่อลดอํานาจปกครองตนเองของรัฐในอารักขาขุนศึกโดยใช §Yยุทโธปกรณทหารราบ§!"
 CHI_burma_campaign: "การทัพพมา"
 CHI_burma_campaign_desc: "พันธมิตรของเรากําลังลําบาก [JAP.GetNameDefCap]บุกลึกเขาไปและตอนนี้ควบคุมบางสวนของพมาไวได เราจะแสดงใหเห็นวาเราไมไดเปนเพียงตัวดึงความสนใจของศัตรู แตเปนพันธมิตรที่ไวใจไดซึ่งจะปดฉากศัตรูดวยตนเอง"
 CHI_burma_campaign_trigger: "[BRM.GetName] สูญเสียดินแดนอยางนอยหนึ่งแหงใหแกศัตรู"
 CHI_indo_chinese_campaign: "การทัพอินโดจีน"
 CHI_indo_chinese_campaign_desc: "เรามีประวัติศาสตรอันยาวนานกับเอเชียตะวันออกเฉียงใต และวันนี้อีกบทหนึ่งกําลังถูกเขียนขึ้น เราจะยึดพื้นที่นี้คืนจาก[671.controller.GetNameDef] เพื่อใหกองกําลังสัมพันธมิตรปฏิบัติการไดอยางอิสระ" 
 CHI_international_squadron: "เชิญกองบินเสือบิน"
 CHI_international_squadron_desc: "มิตรสหายโพนทะเลของเราไดจัดตั้งกลุมนักบินอาสาสมัครและซื้อเครื่องบินสมัยใหมจํานวนหนึ่งเพื่อสนับสนุนความพยายามทางสงครามของเรา เราควรตอนรับความริเริ่มนี้ดวยออมแขนที่เปดกวาง"
 CHI_form_the_chinese_womens_national_war_relief_society: "เปดโรงเรียนสําหรับผูยากไร"
 CHI_form_the_chinese_womens_national_war_relief_society_desc: "หลายคนสูญเสียไปมากในการตอสูกับจักรวรรดินิยม และเราตองตอบสนองความตองการของพวกเขา สมาคมสตรีจีนแหงชาติเพื่อบรรเทาภัยสงครามแสดงผลลัพธที่นาพอใจ และควรขยายใหมีประสิทธิภาพยิ่งขึ้น"
 CHI_towards_a_professional_army: "มุงสูกองทัพอาชีพ"
 CHI_towards_a_professional_army_desc: "กองทัพของเรามีขนาดใหญ แตประสิทธิภาพยังเปนที่ถกเถียง คณะที่ปรึกษาทางทหารเยอรมันแนะนําใหเราลดขนาดกองทัพลง และมุงสรางกองกําลังที่เล็กลงแตมียุทโธปกรณดีกวา มีขวัญกําลังใจสูงและประสิทธิภาพการรบสูง"
 CHI_towards_a_popular_army: "มุงสูกองทัพประชาชน"
 CHI_towards_a_popular_army_desc: "กองทัพของเราขาดแคลนยุทโธปกรณและการฝก แตสิ่งหนึ่งที่เรามีคือผูคน เราจะทําใหผูรุกรานตางชาติแตกพายเมื่อปะทะกําแพงทหารที่ชื่อวากองทัพปฏิวัติแหงชาติ"
 CHI_the_hanoi_route: "เสนทางฮานอย"
 CHI_the_hanoi_route_desc: "เมืองทาทางตะวันออกของเราเปราะบางตอ[JAP.GetNameDef] และเราตองใชมาตรการปองกันไวกอน การลงจากเทือกเขาจากคุนหมิงเขาสูปาดงดิบรอบฮานอยเปนเสนทางที่ยากลําบาก แตจะชวยใหการขนสงของเราไดหายใจหายคอบาง"
 CHI_form_saco: "จัดตั้ง SACO"
 CHI_form_saco_desc: "หากจะชนะ ตองรูจักศัตรู ชาวอเมริกันเสนอใหจัดตั้งองคการความรวมมือจีน-อเมริกัน (SACO) เพื่อแบงปนขาวกรองและชวยฝกหนวยกองโจรของเรา"
 CHI_the_burma_road: "ถนนพมา"
 CHI_the_burma_road_desc: "พันธมิตรตางชาติของเราแสดงความเต็มใจที่จะสนับสนุนดานยุทโธปกรณ แตแรงกดดันทางทหารจาก[JAP.GetName]ทําใหการขนสงเปนไปไดยาก การเปดเสนทางผานพมาจะชวยใหเราไดรับยุทโธปกรณจากทางตะวันตกเฉียงใตมากขึ้น"
 CHI_the_hump_sea: "เสนทางบินขามหิมาลัย"
 CHI_the_hump_sea_desc: "รถไฟ รถบรรทุก และเรือลวนดีสําหรับการขนสงยุทโธปกรณ แตอนาคตอยูบนทองฟา ดวยนักบินที่เชี่ยวชาญ เราจะสามารถบินขามเทือกเขาหิมาลัยไปลงจอดที่ยูนนานได ซึ่งหมายความวาไมมีสิ่งใดหยุดยั้งการขนสงของเราได"
 CHI_women_in_the_war_effort: "สตรียุคใหมในความพยายามทางสงคราม"
 CHI_women_in_the_war_effort_desc: "นับตั้งแตขบวนการสี่พฤษภาคม บทบาทของสตรีในสังคมไดเปลี่ยนไปตลอดกาล ดวยการเปดรับความทันสมัยและความรักชาติ สตรีก็ควรมีสวนรวมไดเชนกัน การจัดตั้งกองพันสตรีและผนวกเขากับกองทัพจะชวยเราไดอยางมาก"
 CHI_the_sky_cannot_have_two_suns: "ฟาไมอาจมีสองตะวัน"
 CHI_the_sky_cannot_have_two_suns_desc: "การบอนทําลายของคอมมิวนิสตคุกคามรากฐานของสังคมจีน มีเพียงการพิสูจนความเหนือกวาของเราและทําลายอุดมการณของพวกเขาเทานั้นที่จะทําใหจีนอยูรอด เปนหนึ่งเดียวใตธงผืนเดียว ตะวันสองดวงอาจลับฟา แตจะมีเพียงดวงเดียวที่ขึ้นยามรุงอรุณ"
 CHI_the_sky_cannot_have_two_suns_tt: "ขุนศึกทุกรายในฝายของเราที่เปนคอมมิวนิสตดวย:\n   เพิ่ม: อิทธิพลในฝาย §Y-10.00%§!"
 CHI_preemptive_strike: "ชิงโจมตีกอน"
 CHI_preemptive_strike_desc: "ทุกวันศัตรูภายในของเราแข็งแกรงขึ้นและสมคบคิดตอตานอํานาจของเรา เราไมอาจรอใหใครพยายามยึดอํานาจในจีนไดอีกแลว เราตองลงมือ เราตองโจมตี!"
 CHI_preemptive_strike_tt: "เราจะไดรับเปาหมายสงคราม §Y$annex_everything$§! ตอขุนศึก[CHI.GetAdjective]ทุกรายที่ยังไมเขารวม [ROOT.GetFactionName] หรือปฏิเสธขอเรียกรองใหเปนรัฐในอารักขาของเรา"
 CHI_tour_the_north: "ตรวจเยี่ยมภาคเหนือ"
 CHI_tour_the_north_desc: "ภูมิภาคภูเขาตอนในกลายเปนศูนยกลางการปลุกปนของคอมมิวนิสต เราจะปลอยใหเปนเชนนี้ตอไปไมได และควรแสดงการมีอยูของเราดวยการเดินทางไปตามมณฑลตาง ๆ"
 CHI_unlock_faction_goal_north_subjugated_tt: "หากนี่เปนแผนยุทธศาสตรการตรวจเยี่ยมแผนแรกที่เลือก เปาหมายของฝาย §Y$faction_goal_north_subjugated_name$§! จะถูกปลดล็อก"
 CHI_tour_the_west: "ตรวจเยี่ยมภาคตะวันตก"
 CHI_tour_the_west_desc: "ในดินแดนแหงขุนเขาและทะเลทราย ที่ตั้งของเสนทางสายไหมในอดีตอยูหางไกลจากศูนยกลางอํานาจ [SOV.GetNameDefCap]ไดแผอิทธิพลในภูมิภาคนี้ เราจึงจะทําใหผูมีอํานาจในทองถิ่นรูวาควรหันความสนใจไปทางใด"
 CHI_unlock_faction_goal_west_subjugated_tt: "หากนี่เปนแผนยุทธศาสตรการตรวจเยี่ยมแผนแรกที่เลือก เปาหมายของฝาย §Y$faction_goal_west_subjugated_name$§! จะถูกปลดล็อก"
 CHI_tour_the_south: "ตรวจเยี่ยมภาคใต"
 CHI_tour_the_south_desc: "จีนตอนใตเปนดินแดนที่หลากหลายและคึกคัก มักเปนหนาตางสูโลกภายนอก ดินแดนที่ใหกําเนิดพรรคของเราแหงนี้ไดรับอํานาจปกครองตนเองมากขึ้นในระยะหลัง ซึ่งเปนแนวโนมที่เราตองพลิกกลับ เราควรไปเยือนมณฑลเหลานี้!"
 CHI_unlock_faction_goal_south_subjugated_tt: "หากนี่เปนแผนยุทธศาสตรการตรวจเยี่ยมแผนแรกที่เลือก เปาหมายของฝาย §Y$faction_goal_south_subjugated_name$§! จะถูกปลดล็อก"
 CHI_ma_clique_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [XSM.GetNameDef], [GSM.GetNameDef] และ [NXM.GetNameDef] ลง §G[?ma_clique_integration_cost_reduction|%G0]§!"
 CHI_warlord_integration_cost_reduction: "ลดตนทุนการ §Yกดดันขุนศึกใหเปนรัฐในอารักขาของเรา§! ลง £GFX_influence_texticon §G-5%§! และ £pol_power §G-50§!"
 CHI_shx_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [SHX.GetNameDef] ลง §G[?shx_integration_cost_reduction|%G0]§!"
 CHI_snd_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [SND.GetNameDef] ลง §G[?snd_integration_cost_reduction|%G0]§!"
 CHI_khm_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [KHM.GetNameDef] ลง §G[?khm_integration_cost_reduction|%G0]§!"
 CHI_sik_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [SIK.GetNameDef] ลง §G[?sik_integration_cost_reduction|%G0]§!"
 CHI_sic_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [SIC.GetNameDef] ลง §G[?sic_integration_cost_reduction|%G0]§!"
 CHI_yun_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [YUN.GetNameDef] ลง §G[?yun_integration_cost_reduction|%G0]§!"
 CHI_gxc_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [GXC.GetNameDef] ลง §G[?gxc_integration_cost_reduction|%G0]§!"
 CHI_gdc_integration_cost: "ลดตนทุนการผนวกรวมสําหรับ [GDC.GetNameDef] ลง §G[?gdc_integration_cost_reduction|%G0]§!"
 CHI_victory_over_the_invaders: "ชัยชนะเหนือผูรุกราน"
 CHI_victory_over_the_invaders_desc: "ผูรุกรานตางชาติพายแพราบคาบ และกองทัพปฏิวัติแหงชาติอันรุงโรจนของเรายืนหยัดอยางผูมีชัย สงครามครั้งนี้ และที่สําคัญยิ่งกวาคือผูนําผูทรงเกียรติของเรา [root.GetLeader] ไดหลอมรวมมณฑลและประชาชนที่กระจัดกระจายใหเปนชาติเดียวกันใตดวงตะวันสีขาว!"
 CHI_remove_guerilla_decisions_tt: "§Rลบ§! การตัดสินใจ §Y$PRC_guerilla_warfare_sea_cat$§!"
 CHI_petition_territorial_restoration: "ยื่นคํารองขอคืนดินแดน"
 CHI_request_territory_trigger_tt: "รัฐที่ควบคุมอยูใด ๆ:\n      เปนดินแดนหลักของ §Y[ROOT.GetNameWithFlag]§!\n      ผูควบคุม: $is_literally_china_tt_NOT$\n      ตองเปนจริงอยางนอยหนึ่งขอตอไปนี้:\n         ผูควบคุมไมไดเปนเจาของ\n         ผูควบคุม:\n            พรรครัฐบาลปจจุบันคือ §Y[ROOT.GetRulingIdeology]§!" #The weird indentations are deliberate and is there to make the tooltip look like the real deal!
 CHI_petition_territorial_restoration_desc: "$PRC_restore_territorial_integrity_desc$"
 CHI_crush_the_communists: "บดขยี้[PRC.GetNameDef]"
 CHI_crush_the_communists_desc: "ถึงเวลาแลวที่จะสะสางสิ่งที่เราเริ่มไวเมื่อนานมาแลวใหเสร็จสิ้น นั่นคือการทําลาย[PRC.GetNameDef]ใหสิ้นซากโดยสมบูรณ! เราถูกเรื่องอื่นดึงความสนใจไปนานเกินไปแลว แตเราจะไมทนใหตัวกอกวนนี้อยูตอไปอีก!"
 CHI_request_handover_of_coastal_cities: "ขอใหสงมอบเมืองชายฝง"
 CHI_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_ncns_request_handover_of_coastal_cities: "$CHI_request_handover_of_coastal_cities$"
 CHI_ncns_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_a_generalissimo_for_all_of_china: "จอมทัพแหงจีนทั้งปวง"
 CHI_a_generalissimo_for_all_of_china_desc: "การตอสูกับผูรุกรานตางชาติเปนเพียงโรคผิวหนัง แตภัยคุกคามภายในของเราเปนโรคที่หัวใจมาโดยตลอด บัดนี้เราไดรักษาโรคนั้นแลว เพื่อที่เราจะไดฝนถึงอนาคต"
 CHI_empower_the_mtac: "เสริมอํานาจคณะกรรมการกิจการมองโกเลียและทิเบต"
 CHI_empower_the_mtac_desc: "สังคมของ[ROOT.GetNameDef]กําลังมุงสูความกลมเกลียว แตงานยังไมเสร็จสิ้น คณะกรรมการกิจการมองโกเลียและทิเบตดูแลความสัมพันธกับกลุมตาง ๆ ในประเทศของเรา แตอาจมีบทบาทที่กวางขึ้นได เราจะนําการปฏิวัติไปสูพี่นองของเรานอกพรมแดน!"
 CHI_empower_the_mtac_tt: "ปลดล็อกการตัดสินใจเพื่อทําใหรัฐของ [MON.GetFlag] §Y[MON.GetAdjective]§! และ [TIB.GetFlag] §Y[TIB.GetAdjective]§! เปนดินแดนหลัก"
 CHI_unify_the_admissions_process: "รวมระบบการรับเขาศึกษา"
 CHI_unify_the_admissions_process_desc: "ระบบอุดมศึกษาของเราแบงออกเปนหลายแหง และกระบวนการสมัครก็ซับซอนและกระจัดกระจาย หากเราปรับโครงสรางใหเปนการสอบคัดเลือกรวม เราจะมั่นใจไดวามีที่นั่งสําหรับนักเรียนที่มีความสามารถทุกคน"
 CHI_retreat_to_taiwan: "ถอยไปไตหวัน"
 CHI_retreat_to_taiwan_desc: "ความขัดแยงที่ปะทุขึ้นอีกครั้งกับ[PRC.GetNameDef]ไมไดเปนไปในทางที่เปนคุณตอเรา และเรากําลังเสียพื้นที่ ผูคนแสดงความกังวลมากขึ้นเรื่อย ๆ และเรียกรองอยางเปดเผยใหเราถอยทางยุทธวิธีไปยังไตหวัน เพื่อฟนฟูกําลังและอยูรอด"
 CHI_joining_the_international_community: "ประชาคมระหวางประเทศ"
 CHI_joining_the_international_community_desc: "เรามองแตภายในมานานเกินไป ซึ่งเพียงเปดโอกาสใหผูอื่นเอารัดเอาเปรียบเรา บัดนี้เราตองกาวออกสูโลกและรวมมือกับผูที่มุงมั่นเพื่อเสรีภาพ ผูที่สนับสนุนเราในยามวิกฤตที่สุด!"
 CHI_a_world_freed_from_communism: "โลกที่ปลอดคอมมิวนิสต"
 CHI_a_world_freed_from_communism_desc: "ลัทธิฟาสซิสตจุดไฟเผาโลก แตก็ไมใชอุดมการณเดียวที่คุกคามมนุษยชาติ เราตองทําภารกิจที่เริ่มไวในประเทศของเราใหสําเร็จ และกําจัดความคิดชั่วรายออกไปจากโลกนี้!"
 CHI_reclaim_the_north: "ทวงคืนภาคเหนือ"
 CHI_reclaim_the_north_desc: "ดวยความจําเปน ในอดีตเราตองสละการอางสิทธิ์เหนือดินแดนผืนใหญทางเหนือ แตสถานการณเปลี่ยนไปแลว และตอนนี้เราอยูในสถานะที่แข็งแกรงกวามาก แข็งแกรงพอจะทวงคืนดินแดนทางเหนือของเราอีกครั้ง!"
 CHI_subjugate_korea: "$PRC_subjugate_korea$"
 CHI_subjugate_korea_desc: "$PRC_subjugate_korea_desc$"

  # Fascist Branch
 CHI_strengthening_our_resolve: "เสริมความมุงมั่น"
 CHI_strengthening_our_resolve_desc: "กลุมการเมืองเกาทะเลาะกันไมหยุด และผูนําปจจุบันก็ไมแข็งแกรงพอจะรวมใจเรา จําเปนตองเปลี่ยนทิศทาง เพราะสาธารณรัฐตองคงอยู ไมใชลมสลาย"
 CHI_china_reborn: "จีนเกิดใหม"
 CHI_china_reborn_desc: "แนวคิดเกา ๆ นํามาซึ่งการถูกจักรวรรดินิยมเอารัดเอาเปรียบเทานั้น จําเปนตองเปลี่ยนทิศทางอยางถึงราก เราตองปรับโฉมสังคมดวยอุดมการณใหม เราจะเริ่มการรณรงคชุดหนึ่งที่เราจะเรียกวาขบวนการชีวิตใหม" 
 CHI_co_opt_the_koh_hsin_movement: "ดึงขบวนการเกอซินมาเปนพวก"
 CHI_co_opt_the_koh_hsin_movement_tt: "ลดตนทุนการตอตานการแทรกซึมของคอมมิวนิสตลง §G25%§!"
 CHI_co_opt_the_koh_hsin_movement_desc: "พรรคกลายเปนระบบราชการและฉอฉลเกินไป เราตองกวาดลางสวนที่เนาเฟะออกไป แนวทางที่แข็งกราวขึ้นไมเพียงเปนประโยชน แตยังจําเปนยิ่งตอการอยูรอดของชาติ!"
 permanently_protected_from_infiltration: "รัฐไมสามารถถูกแทรกซึมโดยกองกําลังคอมมิวนิสตได"
 CHI_mend_the_rift_with_hu: "สมานรอยราวกับหู"
 CHI_mend_the_rift_with_hu_desc: "ความเปนคูแขงเการะหวาง [ROOT.GetLeader] กับหู ฮั่นหมินทําใหพรรคออนแอมานานพอแลว ผูติดตามของฮั่นหมินหมายความวาเขามีอิทธิพลไมนอย ซึ่งจะเปนประโยชนตอชาติหากเรารวมกันได"
 CHI_revive_the_western_hills_group: "ฟนฟูกลุมซีซาน"
 CHI_revive_the_western_hills_group_desc: "[ROOT.GetNameDefCap]ถูกอิทธิพลตางชาติครอบงํามานานเกินไป จําเปนตองหวนคืนสูขนบธรรมเนียม ซึ่งเปนแนวทางที่หลิน เซินและไต จี้เทายึดถือมาตลอด สิ่งนี้จะทําใหเราบรรลุแนวคิดของ ดร.ซุน ตามเจตนารมณเดิมโดยปราศจากการบิดเบือน"
 CHI_reform_the_blue_shirts: "ปฏิรูปกลุมเสื้อนํ้าเงิน"
 CHI_reform_the_blue_shirts_desc: "สมาคมปฏิบัติตามหลักไตรราษฎร หรือสมาคมเสื้อนํ้าเงิน เคลื่อนไหวมาเกือบครึ่งทศวรรษแลว แตประสิทธิผลยังจํากัด เพราะยังไมแพรหลายในหมูสามัญชน กลุมนี้จึงยังไมบรรลุศักยภาพเต็มที่ ดวยการปฏิรูปองคกรใหเปนแนวรวมมวลชน เราจะทาทายคอมมิวนิสตดวยเกมของพวกเขาเอง"
 modify_blue_shirts: "จะปรับ §Y$CHI_blue_shirt_society$§! ดังนี้:"
 CHI_empower_the_bureau_of_investigation_and_statistics: "เสริมอํานาจสํานักงานสืบสวน"
 CHI_empower_the_bureau_of_investigation_and_statistics_desc: "นับแตโบราณ การรูเขารูเราคือสิ่งที่ทําใหชนะศึก เราตองการองคกรที่สามารถหาขอมูลที่เราตองการได และควรขยายสํานักงานสืบสวนและสถิติแหงชาติ"
 CHI_revise_the_national_curriculum: "ปรับปรุงหลักสูตรแหงชาติ"
 CHI_revise_the_national_curriculum_desc: "ดวยประเทศที่ใหญโตอยางเรา จึงไมนาแปลกใจที่จะมีจุดยืนที่แตกตางกันมากมาย เราสามารถทําใหระบบการศึกษาเปนมาตรฐานและเปนระเบียบ เพื่อสงเสริมพฤติกรรมบางอยางที่พึงประสงค"
 CHI_target_upper_society: "มุงเปาที่ชนชั้นสูง"
 CHI_target_upper_society_desc: "ชนชั้นสูงในสังคมละทิ้งคานิยมอันดีงามและหลงใหลในความบันเทิงแบบสากลมากเกินไป ทั้งที่ควรเปนแบบอยางของชีวิตที่มีศีลธรรมและคุณธรรมแกสามัญชน เมื่อพวกเขาทําได เราก็จะยกระดับทั้งชาติดวยการฟนฟูจิตวิญญาณและกาวขามความรํ่ารวยทางวัตถุเพียงอยางเดียว"
 CHI_outlaw_opposition_parties: "ประกาศใหพรรคฝายคานผิดกฎหมาย"
 CHI_outlaw_opposition_parties_desc: "กกมินตั๋งครองอํานาจมาเกือบทศวรรษ แตก็ยังอนุญาตใหมีพรรคฝายคาน เราเกรงวาชาติกําลังอยูบนทางแยก และเราจําเปนตองจํากัดฝายคานจนกวาจะจัดการกับ[JAP.GetNameDef]และพวกคอมมิวนิสตได"
 CHI_seek_out_western_fascist_cooperation: "แสวงหาความรวมมือจากตะวันตก"
 CHI_seek_out_western_fascist_cooperation_desc: "เพราะการแทรกแซงจากตางชาติในอดีต เราจึงลาหลังดานการพัฒนาทางเทคนิค ไมวาเราจะรังเกียจเพียงใด การแสวงหาความรวมมือกับประเทศตะวันตกที่เห็นใจอุดมการณของเราอาจเปนทางเลือกที่ฉลาด เพื่อใหเราไลตามทัน กอนที่เราจะพลิกสถานการณกลับไปเลนงานพวกเขา..."
 CHI_a_chapter_in_every_village: "สาขาในทุกหมูบาน"
 CHI_a_chapter_in_every_village_desc: "กลุมเสื้อนํ้าเงินประสบความสําเร็จในเมือง แตประชากรสวนใหญอาศัยอยูในชนบท เราตองขยายองคกรใหมีตัวแทนในทุกเมือง หมูบาน และชุมชนเล็ก ๆ"
 CHI_secure_the_northern_front: "รักษาแนวรบดานเหนือ"
 CHI_secure_the_northern_front_desc: "เราเสียแมนจูเรียใหแกญี่ปุนไปแลว ซึ่งเปนเพื่อนบานที่แข็งแกรงและอันตรายที่สุดของเราอยางเทียบไมติด เราตองรักษาชายแดนทางเหนือเพื่อจับตาดูญี่ปุน และทําใหแนใจวาพวกเขาจะไมคิดขยายอิทธิพลลงใตอีก..."
 CHI_a_party_unified: "พรรคที่เปนหนึ่งเดียว"
 CHI_a_party_unified_desc: "ดวยวินัย ศีลธรรม และคุณธรรม เราไดหลอมความเปนหนึ่งเดียวภายในพรรค การทะเลาะเบาะแวงและความแตกแยกเปนเรื่องของอดีต เรากาวไปขางหนาใตธงฟาตะวันขาว มุงสูชัยชนะครั้งสุดทายเหนือศัตรูทั้งปวง ทั้งภายในและภายนอก!"
 CHI_a_party_unified_tt: "§Rการสงเจียง ไคเช็กไปกวางโจวระหวางกรณีเหลียงกวางจะทําใหเขาเสียชีวิตเร็วขึ้น§!"
 CHI_a_popular_movement: "ขบวนการมวลชน"
 CHI_a_popular_movement_desc: "บทใหมในประวัติศาสตรของเราตองการองคกรใหม ทุกคนจะไดรูวาเราในฐานะประชาชนคือคลื่นที่ซัดผานสังคมเกา ทําใหทุกคนเปนสวนหนึ่งของสิ่งที่ยิ่งใหญกวานี้"
 CHI_a_popular_movement_trigger: "คาปจจัยการเกณฑทหารของ §Yการทุจริตในกองทัพ§! มากกวา §Y0%§!"
 CHI_integrate_the_hongmen: "ผนวกกลุมปองกันตนเอง"
 CHI_integrate_the_hongmen_desc: "จีนเต็มไปดวยกลุมที่กอตั้งขึ้นเพื่อตอตานการกดขี่ของราชวงศชิง นับตั้งแตการปฏิวัติซินไฮ พวกเขาก็หมดจุดประสงคและแยกยายไปคนละทาง เราสามารถมอบจุดประสงคใหพวกเขาอีกครั้งดวยการผนวกเขามา หรือเลียนแบบการจัดองคกรและแนวปฏิบัติของพวกเขา"
 CHI_ban_immoral_entertainment: "หามความบันเทิงที่ผิดศีลธรรม"
 CHI_ban_immoral_entertainment_desc: "ความบันเทิงอันเสื่อมทรามแพรมาถึงชายฝงของเราและทําใหศีลธรรมของเราแปดเปอน เราควรหามสิ่งเหลานี้และหันไปสงเสริมกีฬาและศิลปะของชาติแทน พรอมจัดตั้งหนวยเฉพาะกิจเพื่อบังคับใช"
 CHI_develop_counterinsurgency_tactics: "ยุทธวิธีปราบปรามการกอความไมสงบ"
 CHI_develop_counterinsurgency_tactics_desc: "กองโจรปฏิบัติการดวยวิธีนอกแบบและคาดเดาไมได และเราตองเรียนรูวิธีรับมือ เราควรจัดตั้งคณะกรรมการและคณะทํางานเพื่อพัฒนาเทคนิคและการปรับตัวตอสงครามรูปแบบใหม"
 CHI_develop_counterinsurgency_tactics_tt: "จะทําให §Y$CHI_counter_infiltration_measures$§! มีตนทุนเหลือเพียง §Gครึ่งเดียว§!"
 CHI_a_brotherhood_for_china: "ภราดรภาพเพื่อจีน"
 CHI_a_brotherhood_for_china_desc: "สําหรับหลายคน สมาคมเสื้อนํ้าเงินเปนเพียงกลุมอันธพาลที่กอความวุนวาย แตผูนําของสมาคม ไต ลี่ มองวามันคือภราดรภาพ และนั่นคือมุมมองที่เราสามารถใชเพื่อหลอเลี้ยงความเปนหนึ่งเดียว"
 CHI_nationalize: "โอนเปนของรัฐ!"
 CHI_nationalize_desc: "นี่คือชวงเวลาวิกฤตของพรรค ชาติ และประชาชน ผลประโยชนสวนตัวจึงตองหลีกทางใหความจําเปนของชาติ ภายใตการชี้นําโดยตรงของเรา เราจะใชโรงงานเหลานี้อยางมีประสิทธิภาพสูงสุด!"
 CHI_militarize: "สูการทหาร!"
 CHI_militarize_desc: "ประชาชนของเราเฉยเมยตอที่ทางของตนในประวัติศาสตรและตองถูกปลุกใหตื่น เราจะทําใหพวกเขารูสึกถึงไฟแหงการปฏิวัติ และเตรียมพรอมโคนศัตรูทั้งภายในและภายนอก"
 CHI_militarize_tt: "กองกําลังอาสาเสื้อนํ้าเงินจะถูกจัดตั้งขึ้นในทุกรัฐทั้งปจจุบันและอนาคตที่มี §Y$CHI_infiltrated_state_3$§!"
 CHI_productive: "สูการผลิต!"
 CHI_productive_desc: "มือที่วางงานไมสรางสิ่งใด! ความเกียจครานไมเพียงฉุดรั้งเรา แตยังชวยศัตรูดวย พวกที่เฉื่อยชาและไมใสใจตองถูกจัดการ หากพรรคของเราจะไดรับชัยชนะ!"
 CHI_enforce__virtues: "บังคับใชคุณธรรม"
 CHI_enforce__virtues_desc: "ผูคนยังคงเสียเวลาไปกับเรื่องไรสาระไรความหมาย ทั้งที่พวกเขาควรพัฒนาตนเองเพื่อพรรคและชาติ เราหละหลวมในการบังคับใชมากเกินไป และเราจะทุมเทความพยายามเปนสองเทา"
 CHI_whampoa_ideological_primacy: "ความเปนใหญทางอุดมการณของหวงผู"
 CHI_whampoa_ideological_primacy_desc: "นายทหารจากหวงผูไมไดแบกเพียงอาวุธ แตยังแบกหลักการดวย หลักคําสอนของหวงผูไวใจไดตางจากของสถาบันอื่น เราควรใหการฝกอบรมทางอุดมการณทั้งหมดผานโรงเรียนนี้ เพื่อเสริมความแข็งแกรงใหชาติโดยรวม"
 CHI_postpone_the_tutelage: "เลื่อนการปกครองแบบชี้นํา"
 CHI_postpone_the_tutelage_desc: "แมเปาหมายจะยังคงเปนประชาธิปไตย แตยังไมถึงเวลา และวิกฤตในปจจุบันตองการมาตรการพิเศษ เราตองนําชาติฝาอันตรายไปใหไดกอนที่ประชาธิปไตยจะเบงบาน"
 CHI_postpone_the_tutelage_tt: "ปลดล็อกการตัดสินใจเพื่อ §Yปรับทัศนคติ§! §Yนายพลขุนศึก§! บางคนเมื่อพิชิตกลุมขุนศึกไดแลว"
 CHI_second_father_of_the_nation: "บิดาแหงชาติคนที่สอง"
 CHI_second_father_of_the_nation_desc: "ดร.ซุน ยัตเซ็น ทําใหเราสลัดพันธนาการของราชวงศชิงได และจะเปนบิดาแหงชาติคนแรกของเราตลอดไป จอมทัพเจียงกวาดลางคอมมิวนิสตออกจากพรรค และดวยเหตุนั้นเขาจะไดรับการจดจําในฐานะบิดาแหงชาติคนที่สองตลอดไป"
 CHI_weaponise_the_faithful: "ติดอาวุธใหผูศรัทธา"
 CHI_weaponise_the_faithful_desc: "ผูที่ศรัทธาแรงกลาที่สุดจะสูอยางดุเดือดที่สุด ตอนนี้เรายังไมมีชองทางใหคนเหลานั้น แตเราสรางขึ้นไดและสงพวกเขาไปอยูแนวหนาสุด ความทุมเทของพวกเขาจะกลายเปนใบมีดที่คมที่สุดของเรา ฟนฝาศัตรูทุกราย"
 CHI_political_advisors_in_every_division: "ที่ปรึกษาการเมืองในทุกกองพล"
 CHI_political_advisors_in_every_division_desc: "กองทัพปกปองรัฐ จนกวาจะไมทําเชนนั้น รัฐลมสลายดวยนํ้ามือของผูถืออาวุธมาบอยเกินไปแลว แตเราจะไมปลอยใหเกิดขึ้นกับเรา นายทหารการเมืองจะชวยจูงใจกองทัพใหปฏิบัติอยางเหมาะสม"
 CHI_an_alternative_rooted_in_tradition: "ทางเลือกที่หยั่งรากในขนบธรรมเนียม"
 CHI_an_alternative_rooted_in_tradition_desc: "เสรีนิยมและคอมมิวนิสตเปนแนวคิดตางชาติที่ไรความหมายในชาติ[ROOT.GetAdjective] มีเพียงสิ่งที่เราสรางขึ้นเองเทานั้นที่จะนําความรุงเรืองและความภาคภูมิใจมาสูแผนดินของเรา"
 CHI_an_alternative_rooted_in_tradition_tt: "เพิ่มตนทุนการแทรกซึมของ[PRC.GetNameDefCap]: §G+25%§!"
 CHI_expel_the_occupiers: "$PRC_expel_the_occupiers$"
 CHI_expel_the_occupiers_desc: "$PRC_expel_the_occupiers_desc$"
 CHI_put_an_end_to_PRC: "ปดฉาก[PRC.GetNameDef]"
 CHI_put_an_end_to_PRC_desc: "สิ่งที่ขวางทางเราในการรวมจีนทั้งหมดอยางแทจริงคือพวกคอมมิวนิสตนารําคาญที่ซองสุมอยูในขุนเขา ภายใตการนําของ [PRC.GetLeader] ตราบใดที่พวกเขายังอยู จีนจะไมมีวันเปนหนึ่งเดียว ศัตรูภายในทําใหเราออนแอ ความออนแอเชื้อเชิญการรุกรานจากตางชาติ และการรุกรานจากตางชาติเปนภัยตออธิปไตยของเรา ดังนั้นจึงเปนหนาที่ของเราที่จะปดฉาก[PRC.GetNameDef]!"
 CHI_reject_the_nine_powers: "ปฏิเสธเกามหาอํานาจ"
 CHI_reject_the_nine_powers_desc: "สนธิสัญญาที่คนแปลกหนาจากโพนทะเลบีบบังคับเรานั้นถูกยัดเยียดในยามที่เราออนแอ แตบัดนี้เราสามารถปฏิเสธมันไดแลว จงใหประเทศคูสัญญาทุกชาติรูไว: เราไมไดติดหนี้ชาวตางชาติแมแตนอย!"
 CHI_setting_a_new_standard: "สรางมาตรฐานใหม"
 CHI_setting_a_new_standard_desc: "กองทัพของเราไดรับอิทธิพลจากแนวคิดและหลักนิยมตะวันตกมากเกินไป แตเราคือประเทศของซุนวู ไมใชเคลาเซวิทซ ดวยการเปลี่ยนแปลงเชิงโครงสรางและงานดานอุดมการณ เราไดปรับโฉมกองทัพใหเปนแบบฉบับของเราเอง"
 CHI_eternal_revolution: "การปฏิวัติชั่วนิรันดร"
 CHI_eternal_revolution_desc: "ความสําเร็จของเราแสดงใหเห็นวาระบบของเรามีประสิทธิภาพเหนือกวาแนวคิดเกาและแนวคิดตางชาติ ไฟแหงการปฏิวัติลุกโชนในใจของเพื่อนรวมชาติทุกคน และเราตองใชพลังนั้นเผยแพรการปฏิวัติใหกวางไกลยิ่งขึ้น"
 CHI_eternal_revolution_tt: "อนุญาตให §Yประกาศเขตสงคราม§! ในรัฐที่อางสิทธิ์"
 CHI_reclaim_what_was_lost: "ทวงคืนสิ่งที่สูญเสียไป"
 CHI_reclaim_what_was_lost_desc: "ราชวงศชิงไดรับมรดกเปนจักรวรรดิที่ใหญที่สุดที่เราเคยมี แตกลับปลอยใหสูญเสียไปเพื่อประโยชนของมหาอํานาจตางชาติ สิ่งนี้นําความอัปยศมาสูเราทั้งในฐานะประชาชน ชาติ และพรรค เราตองแกไขความวิปริตนี้และฟนฟูศักดิ์ศรีของจีน"
 CHI_bring_the_wayward_back_into_the_fold: "นําผูหลงทางกลับคืนสูออมอก"
 CHI_bring_the_wayward_back_into_the_fold_desc: "นับตั้งแตการปฏิวัติซินไฮ พี่นองของเราบางสวนถูกชี้นําผิดทางและหลงไป พวกเขาถูกบอกวาการแยกตัวออกจากสวนรวมจะดีกวา ถึงเวลาแลวที่เราจะพลิกกลับเรื่องนี้และนําพวกเขากลับคืนสูออมอก"
 CHI_retake_coastal_cities: "ยึดเมืองชายฝงคืน"
 CHI_retake_coastal_cities_desc: "จักรวรรดินิยมตะวันตกบังคับเจตจํานงของตนเหนือเรามานานเกินไป ถึงเวลาอันเหมาะสมแลวที่เราจะทวงคืนสิ่งที่ถูกขโมยไป [326.GetName], [729.GetName] และ [728.GetName] ตองกลับมาเปนสวนหนึ่งของแผนดินเราอีกครั้ง!"
 CHI_a_new_middle_kingdom: "อาณาจักรกลางใหม"
 CHI_a_new_middle_kingdom_desc: "ในยุคกอน เราเคยเปนศูนยกลางที่โลกหมุนรอบ สิ่งนี้ทําใหเราโดดเดี่ยวจากโลกและปลอยใหยุคสมัยผานเราไป เราจะไมทําผิดซํ้าอีก และครั้งนี้เราจะเปนผูกําหนดชะตากรรมของตนเอง และของผูอื่นดวย"
 CHI_remove_infiltration_decisions_tt: "§Rลบ§! การตัดสินใจ §Y$PRC_infiltration_sea_cat$§!"
 CHI_the_southern_mandate: "อาณัติแหงทักษิณ"
 CHI_the_southern_mandate_desc: "ทางใตคือดินแดนที่อุดมดวยทรัพยากรและผูคนที่เปนเครือญาติของเรา เรามีสิทธิ์เหนือดินแดนเหลานี้จากความสัมพันธมาแตโบราณ และถึงเวลาแลวที่เราจะเคลื่อนทัพลงใต"
 CHI_the_northern_mandate: "อาณัติแหงอุดร"
 CHI_the_northern_mandate_desc: "ทางเหนือของดินแดนเราคือดินแดนรกรางวางเปลา เพชรในตมที่[SOV.GetNameDef]ปลอยทิ้งขวาง มีเพียงผูที่มองเห็นศักยภาพที่แทจริงของดินแดนนี้เทานั้นที่ควรครอบครอง และนั่นคือเรา!"
 CHI_the_greater_game: "เกมที่ยิ่งใหญกวา"
 CHI_the_greater_game_desc: "จักรวรรดินิยมเคยเลนเกมของพวกเขาในเอเชียกลาง แตก็เพียงเอาหัวไปชนกําแพงในภูมิภาคนั้น ถึงเวลาที่เราจะมุงหนาสูตะวันตก และนํากองทัพของเราขามทุงหญาสเต็ปปอีกครั้ง"
 CHI_cradle_of_civilization: "อูอารยธรรม"
 CHI_cradle_of_civilization_desc: "จากสายนํ้าขุนตะกอนของแมนํ้าเหลืองไดถือกําเนิดอารยธรรมที่หลอหลอมมนุษยชาติ จักรวรรดิทั้งหลายเกิดขึ้นและลมสลาย แตความรุงโรจนของจีนโบราณสองสวางเหนือพิภพชั่วนิรันดร และความเปนใหญของเราก็จะเปนเชนนั้น"
 CHI_cradle_of_civilization_tt: "ปลดล็อกการตัดสินใจเพื่อผนวกรวมรัฐใน §Yเอเชีย§! ที่เรา §Yอางสิทธิ์§! เมื่อ §Yการยอมรับปกครอง§! สูงถึงระดับที่กําหนด"


  # Army Focuses 
 CHI_military_affairs_commission_sea: "คณะกรรมาธิการกิจการทหาร"
 CHI_military_affairs_commission_sea_desc: "รากฐานของกองทัพที่มีประสิทธิภาพคือกองบัญชาการสูงสุดที่เหมาะสม เนื่องจากคณะกรรมาธิการกิจการทหารเปนองคกรสูงสุดในการปองกันประเทศของเรา เราจึงควรทําใหมั่นใจวามีความสามารถ"
 CHI_set_up_an_nco_school: "ตั้งโรงเรียนนายสิบ"
 CHI_set_up_an_nco_school_desc: "ทหารสวนใหญอยางลนหลามของเราขาดการศึกษาอยางเปนทางการ ซึ่งสําหรับพลทหารทั่วไปอาจพอใหอภัยได แตจะกลายเปนปญหาเมื่อเลื่อนยศสูงขึ้น เราตองตั้งระบบฝกนายทหารชั้นประทวนเพื่อรับประกันคุณภาพ"
 CHI_formalize_field_promotions: "วางระเบียบการเลื่อนยศในสนามรบ"
 CHI_formalize_field_promotions_desc: "ในโลกอุดมคติ เราจะมีกองทัพที่ไดรับการฝกและการศึกษาอยางสมบูรณ แตนี่ไมใชโลกเชนนั้น ในสถานการณคับขันปจจุบัน การสงทหารไปแนวหนาคือสิ่งสําคัญที่สุด และยิ่งทําไดเร็วก็ยิ่งดี เราจะตั้งโครงการเพื่อคนหาผูที่สามารถนําเพื่อนรวมรบไปขางหนาจากในหมูพลทหาร"
 CHI_crackdown_on_corruption_in_recruitment: "ปราบปรามการทุจริต"
 CHI_crackdown_on_corruption_in_recruitment_desc: "นับตั้งแตกอตั้งกองทัพสาธารณรัฐ การเกณฑทหารมีปญหาเชิงระบบมาตลอด ผูคนจายเงินเพื่อเลี่ยงการรับราชการ และมีการตกแตงบัญชีเพื่อยักยอกเงินเดือน สิ่งนี้ตองยุติ หากเราจะอยูรอดทามกลางการถาโถมของโลกสมัยใหม เพราะไมมีที่วางสําหรับความไรประสิทธิภาพ"
 CHI_crackdown_on_corruption_in_recruitment_tt: "§Y$CHI_he_yingqin$§! พรอมรับตําแหนงนายพลระดับ §Y3§!"

 CHI_form_the_combined_logistics_command: "จัดตั้งกองบัญชาการสงกําลังบํารุงรวม"
 CHI_form_the_combined_logistics_command_desc: "บัดนี้กองทัพของเราไดรับการจัดระเบียบใหมและรับมือกับภัยคุกคามตอชาติไดอยางมีประสิทธิภาพ แตเรากลับพบปญหาอื่น แมสถานการณการสงกําลังบํารุงจะดีขึ้น แตกองทัพของเรายังขาดการประสานงานในระบบกระจายการสงกําลังบํารุง เราตองแกปญหานี้โดยดวน!" 

 CHI_reorganise_the_train: "จัดระเบียบหนวยขนสงใหม"
 CHI_reorganise_the_train_desc: "องคกรเสบียงของเราไมเคยพัฒนาไปถึงขนาดหรือความซับซอนที่เราตองการ การจัดระเบียบใหมอยางละเอียดจะทําใหเราสงทหารเขาสูสมรภูมิไดมากขึ้น"
 CHI_rely_on_locals: "พึ่งพาคนทองถิ่น"
 CHI_rely_on_locals_desc: "การสรางองคกรเต็มรูปแบบใหกองกําลังของเราใชนั้นซับซอน ใชเวลานาน และมีคาใชจายสูง ประวัติศาสตรไดแสดงทางเลือกใหเราเห็นแลว จะขนสงสิ่งที่หาไดในทองถิ่นไปทําไม หากเราพึ่งพาชาวนาและคนงานที่อาศัยอยูทั่วแผนดินอันยิ่งใหญของเรา เราก็จะชดเชยสวนที่ระบบของเราขาดได"
 CHI_focus_on_meritocratic_principles: "มุงเนนหลักคุณธรรมนิยม"
 CHI_focus_on_meritocratic_principles_desc: "การเลนพรรคเลนพวก การติดสินบน และการทุจริตคือหายนะของกองทัพที่มีประสิทธิภาพ สิ่งนารังเกียจเหลานี้มีอยูในกองกําลังของเรามากเกินไป และตองเปลี่ยนแปลง การวางโครงสรางเพื่อเลื่อนตําแหนงผูที่มีคุณสมบัติดีที่สุดใหอยูในตําแหนงที่เหมาะสมจะรับประกันชัยชนะ"
 CHI_focus_on_meritocratic_principles_tt: "เปดใหสามารถถอดจิตวิญญาณกองทัพ §Yความเปนใหญของหวงผู§! ไดดวยตนเอง"
 CHI_protracted_warfare: "สงครามยืดเยื้อ"
 CHI_protracted_warfare_desc: "นับตั้งแต[JAP.GetNameDef]เอาชนะรัสเซีย ประชาชนของพวกเขาเชื่อวาการปฏิบัติการที่รวดเร็วและดุดันคือหนทางสูชัยชนะ สิ่งนี้ทําใหกองทัพของพวกเขาขาดความอึด ดังนั้นหากเราไมยอมใหพวกเขาชนะอยางรวดเร็ว หนวยของพวกเขาจะพังทลายในเวลาอันสั้น"
 CHI_decisive_battles: "ศึกชี้ขาด"
 CHI_decisive_battles_desc: "ชัยชนะแตละครั้งมีนํ้าหนักไมเทากัน ดังที่[JAP.GetNameDef]แสดงใหเห็นในป 1905 เราควรทุมกําลังเพื่อชนะการรบสําคัญดวยการชิงความริเริ่มบุกเขาสูแมนจูเรีย"
 CHI_invest_in_mountain_guns: "ลงทุนในปนใหญภูเขา"
 CHI_invest_in_mountain_guns_desc: "ดินแดนของเราไมใชที่ที่เดินทางผานไดงาย และการเคลื่อนยายปนใหญหนักแบบดั้งเดิมผานไปก็เปนความทาทายสําหรับคนสวนใหญ การมีปนที่ถอดประกอบไดตามตองการคือทางออกโดยธรรมชาติของปญหานี้ และควรคาแกการศึกษา"
 CHI_repurpose_fort_artillery: "นําปนใหญปอมมาใชใหม"
 CHI_repurpose_fort_artillery_desc: "สงครามไมอาจถูกตรึงไวดวยปอมปราการสําคัญไดอีกตอไป ตอนจบของมหาสงครามครั้งกอนพิสูจนใหเห็นแลว แมสิ่งกอสรางเหลานั้นอาจไมมีคามากนัก แตปนใหญในนั้นยังยิงใสศัตรูได"
 CHI_repurpose_fort_artillery_tt: "§Rคุณไมไดควบคุมปอมใดที่จะรื้อถอนได §!"
 CHI_fund_the_marine_corp: "ใหทุนแกหนวยนาวิกโยธิน"
 CHI_fund_the_marine_corp_desc: "กองทัพของเรามีขนาดมหึมาและพลังของมันไมอาจสงสัยได แตอาจเปนเพียงเครื่องมือทื่อ ๆ หากใชอยางไมถูกตอง หนวยทหารราบนาวีอาชีพเฉพาะทางที่ฝกมาเพื่อปองกันแนวชายฝงจะมีคาเทากับทหารทั่วไปสิบเทาของจํานวน และเมื่อถึงเวลา ก็จะแผอํานาจของเราขามทะเล"
 CHI_the_4_defence_areas: "4 เขตปองกัน"
 CHI_the_4_defence_areas_desc: "หากเราจะปกปองชาติอันยิ่งใหญไดสําเร็จ แผนที่ครอบคลุมคือหัวใจสําคัญ เราจะแบงประเทศเปนสี่เขตและแตงตั้งผูบัญชาการที่เหมาะสมประจําแตละเขต ซึ่งจะรับประกันความมั่นคงในทองถิ่นและการตอตานที่มีประสิทธิภาพ"
 CHI_defence_in_depth: "การปองกันเชิงลึก"
 CHI_defence_in_depth_desc: "การปองกันที่เหมาะสมไมอาจหยุดนิ่ง และเราตองนําสิ่งนี้มาใชในยุทธศาสตร เรารูวาฝาย[JAP.GetAdjective]ขาดความอึด ดังนั้นยิ่งเราลากพวกเขาเขามาลึกเทาไรยิ่งดี กระแสขึ้นลงของการรบไมควรทําลายเขื่อนที่เปนกองทัพของเรา"
 CHI_prepare_the_war_zones: "เตรียมเขตสงคราม"
 CHI_prepare_the_war_zones_desc: "เราตองจัดระเบียบกองทัพใหมตามแนวภูมิภาค เพื่อใหรูวาใครรับผิดชอบพื้นที่ใด สิ่งนี้จะทําใหเราวางแผนปฏิบัติการที่เหมาะสมกับพื้นที่นั้น ๆ และเพิ่มขีดความสามารถในการเจาะแนวใหสูงสุด"
 CHI_guerrilla_warfare: "สงครามกองโจร"
 CHI_guerrilla_warfare_desc: "สงครามตามแบบชวยใหเราตานทานไดระดับหนึ่ง แตการรบบนแผนดินของเราเองเปดโอกาสใหใชวิธีนอกแบบไดมากขึ้น การแทรกซึมเขาไปในรัฐที่ศัตรูยึดครองและสรางความปนปวนแกหนวยแนวหลังคือวิธีการรบที่[JAP.GetNameDef]ไมไดเตรียมรับมือไวเลย"
 CHI_guerrilla_warfare_tt: "ปลดล็อกการตัดสินใจ §Y$PRC_guerilla_warfare_sea_cat$§!"
 CHI_rapidity_is_the_essence_of_war: "ความรวดเร็วคือหัวใจของสงคราม"
 CHI_rapidity_is_the_essence_of_war_desc: "ความเร็วและการจูโจมโดยไมคาดฝนคืออาวุธที่ดีที่สุดของเรา และการเรียนรูวิธีใชประโยชนจากสิ่งเหลานี้จะสําคัญยิ่งในสงครามสมัยใหม การดําเนินกลยุทธที่กลาหาญและรวดเร็วจะทําใหศัตรูเสียหลัก และเปดทางใหเราบุกลึกขึ้นโดยเผชิญการตานทานนอยลง"
 CHI_organise_the_200th_division: "จัดตั้งกองพลที่ 200"
 CHI_organise_the_200th_division_desc: "กองกําลังยานเกราะคือนวัตกรรมทางสงครามที่ยิ่งใหญที่สุดแหงศตวรรษนี้ และนาเสียดายที่เราตามหลังอยู การจัดตั้งกองพลยานเกราะและแตงตั้งผูบัญชาการที่เหมาะสมเพื่อนําการบุกจะเปนตัวทวีกําลังที่ปูทางสูชัยชนะ"
 CHI_organise_the_200th_division_tt: "ไดรับหนวย §Yยานเกราะ§! ชั้นยอดหนึ่งหนวยใน [ROOT.capital.GetName]"
 CHI_motorise_our_infantry: "ทําใหทหารราบเปนยานยนต"
 CHI_motorise_our_infantry_desc: "กําลังพลของเรามีมหาศาล และเปนบอเกิดแหงพลังของเรามาโดยตลอด การขนสงดวยยานยนตสมัยใหมเสริมพลังใหพลทหารธรรมดา พาพวกเขาเขาสูการรบไดเร็วขึ้นและพรอมโจมตีอยางหนักหนวง ชายหนึ่งคนในที่ที่ถูกตองพรอมปนไรเฟลในมือยอมมีประสิทธิภาพเสมอ"
 CHI_bog_them_down_in_the_centre: "ตรึงพวกเขาไวที่ใจกลาง"
 CHI_bog_them_down_in_the_centre_modify: "จะปรับโบนัสจาก §Y$CHI_bog_them_down$§! ใหเปน:"
 CHI_bog_them_down_in_the_centre_desc: "เรารูวาเราไมสามารถหยุด[JAP.GetNameDef]ไวที่ชายแดนได และตองเลือกแนวปองกันอื่นอยางระมัดระวัง การยึดแมนํ้าแยงซีเปนศูนยกลางจะเปนวิธีที่มีประสิทธิภาพในการหยุดยั้งผูรุกรานและทําใหพื้นที่นี้เปนจุดหมุนของการปองกันทั้งหมด อยางไรก็ตาม การวางแผนปองกันสําหรับพื้นที่เฉพาะยังไปไดไกลกวานั้น" 
 CHI_appear_where_you_are_not_expected: "ปรากฏในที่ที่ไมมีใครคาดคิด"
 CHI_appear_where_you_are_not_expected_desc: "ไมมีผูบัญชาการที่ประสบความสําเร็จคนใดโจมตีศัตรูในที่และในแบบที่ศัตรูคาดไว การลวงคือรากฐานของสงคราม และเราตองดูออนแอเสมอเมื่อเราแข็งแกรง และดูแข็งแกรงเมื่อเราออนแอ"
 CHI_declare_war_zone_modify: "จะปรับโบนัสจาก §Y$CHI_declare_war_zone$§! ใหเปน:"
 CHI_relocate_factories_from_the_coast: "ยายโรงงานออกจากชายฝง"
 CHI_relocate_factories_from_the_coast_desc: "เรากําลังเผชิญปญหาทางยุทธศาสตรที่รายแรง ศูนยกลางอุตสาหกรรมของเราตั้งอยูตามแนวชายฝงและเสี่ยงจะตกอยูในมือศัตรู หากไมมีการผลิต การตอตานก็ไมอาจคาดหวังวาจะยืนหยัดไดนาน เราจะยายการผลิตเขาสูแผนดินตอนในที่ที่ปลอดภัย"
 CHI_relocate_factories_from_the_coast_tt: "อนุญาตใหยาย §YMIO§! และ §Yโรงงาน§!"
 CHI_relocate_factories_from_the_coast_tt_no_aat: "อนุญาตใหยาย §Yโรงงาน§!"
 CHI_state_aa: "โลสูทองฟา"
 CHI_state_aa_desc: "ในโลกใหมนี้ ศัตรูไมไดโจมตีจากทางบกและทางทะเลเทานั้น แตยังโจมตีจากทางอากาศดวย การเตรียมพรอมรับการถาโถมที่จะมาจากฟากฟาอยางหลีกเลี่ยงไมไดดวยการหันปากกระบอกปนขึ้นฟาเปนสิ่งจําเปนยิ่ง หากเราจะตานทานผูรุกรานไวได"
 CHI_coastal_forts: "กําแพงสูทะเล"
 CHI_coastal_forts_desc: "แมผูรุกรานตางชาติและหุนเชิดของพวกเขาจะโจมตีจากทางเหนือกอน แตเรามั่นใจไดวาในที่สุดพวกเขาจะโจมตีจากทางทะเลดวย เราจะพรอมผลักพวกเขากลับลงทะเลทันทีที่พวกเขากลาเหยียบแผนดินของเรา"
 CHI_salvage_enemy_equipment: "เก็บกูยุทโธปกรณของศัตรู"
 CHI_salvage_enemy_equipment_desc: "อุตสาหกรรมของเราไมอาจสนองความตองการของกองทัพปฏิวัติแหงชาติไดเพียงพอ หนวยของเราสามารถชดเชยชองวางบางสวนไดดวยการนําสิ่งที่พบในคายของศัตรูกลับมาใช"
 CHI_salvage_enemy_equipment_random_generals_tt: "ผูนํากองทัพ §Yหา§! คนที่สุมเลือกจะไดรับ §Y$Scavenger$§!: \n-$MODIFIER_EQUIPMENT_CAPTURE$: §G+3%§!"
 CHI_commemorate_the_labour_corps: "รําลึกถึงกองแรงงาน"
 CHI_commemorate_the_labour_corps_desc: "ประชาชนของเราเดินทางไปโพนทะเลและตรากตรําทํางานเพื่อใหชาติไดรับการยอมรับ แสดงความวิริยะบนสมรภูมิแหงมหาสงคราม แมชาว[ENG.GetAdjective]และชาว[FRA.GetAdjective]จะไมจดจําพวกเขา แตเราจดจํา และเราจะยกยองผลงานของพวกเขาดวยการเชิดชูความทรงจําและนอมนําบทเรียนของพวกเขามาไวในใจ"
 CHI_utilise_the_terrain: "ใชประโยชนจากภูมิประเทศ"
 CHI_utilise_the_terrain_desc: "กองพลของเราไมไดมียุทโธปกรณลาสุด และไมไดมีมาตรฐานการฝกที่เปนแบบเดียวกัน แตหากมีสิ่งใดที่เรารูซึ้ง นั่นคือแผนดินของเราเอง เราสามารถใชทุกทางนํ้า เนินเขา และทุงนาใหเปนประโยชน และทําใหผูที่กลารุกรานตองพบกับนรกบนดิน"
 CHI_train_for_asymmetry: "ฝกเพื่อสงครามอสมมาตร"
 CHI_train_for_asymmetry_desc: "สงครามไมเคยยุติธรรม และเราไมอาจคาดหวังใหเปนเชนนั้น มีผูที่มีกองทัพแข็งแกรงกวาซึ่งจะพยายามสยบเรา และเราตองหาทางลดความไดเปรียบนั้น การฝกกองทัพและผูนําใหคนหาวิธีรบแบบใหมจะยากลําบาก แตประโยชนนั้นปฏิเสธไมได"
 CHI_train_for_asymmetry_guerilla_cost_tt: "§Gลดตนทุนลงครึ่งหนึ่ง§! สําหรับการตัดสินใจ §Y$PRC_guerilla_warfare_sea_cat$§!"
 CHI_train_for_asymmetry_random_generals_tt: "ผูนํากองทัพ §Yสาม§! คนที่สุมเลือกจะไดรับ §Yนักรบกองโจร§!: \n-$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+50%§!" 
 CHI_know_thy_enemy: "รูเขา"
 CHI_know_thy_enemy_desc: "เราตองรูวิธีคนหาจุดในแนวรบของศัตรูที่เราสามารถทุมกําลังและใชประโยชนจากรอยแตกได"
 CHI_know_thy_enemy_tt: "ปลดล็อกการบุกโจมตีแบบอัปเกรดที่ไมสูญเสียการขุดสนามเพลาะเมื่อโจมตี"
 CHI_know_thy_self: "รูเรา"
 CHI_know_thy_self_desc: "การเขาใจศัตรูจะนําชัยชนะมาให แตชัยชนะขั้นสุดทายจะมาไดก็ตอเมื่อรูถึงขีดความสามารถของตนเองดวย การวางกระบวนการประเมินตนเองอยางเขมงวดจะเผยใหเห็นจุดออน และจุดแข็งของเราดวย"
 CHI_river_crossing_studies: "ศึกษาการขามแมนํ้า"
 CHI_river_crossing_studies_desc: "จีนเปนดินแดนแหงแมนํ้าสายใหญ และกองทัพใดที่จะปฏิบัติการที่นี่จะตองเรียนรูวิธีรบขามแมนํ้า เราอยูในตําแหนงที่เหมาะเปนพิเศษในการเรียนรูเรื่องนี้และนําไปปฏิบัติจริง บทเรียนที่จะเปนประโยชนตอเราในการขับไลผูรุกรานและนําการรบไปสูตางแดน"
 CHI_armoured_car_tactics: "ยุทธวิธีรถหุมเกราะ"
 CHI_armoured_car_tactics_desc: "กองทัพสวนใหญมีหนวยยานเกราะที่หนักขึ้นเรื่อย ๆ ในการแขงขันดานกําลังอุตสาหกรรม อยางไรก็ตาม ขวานไมไดทํางานดีกวาเมื่อสิ่งที่ตองการคือมีด"
 CHI_serve_the_country_with_utmost_loyalty: "รับใชชาติดวยความภักดีสูงสุด"
 CHI_serve_the_country_with_utmost_loyalty_desc: "เราไดแสดงความแกรงใหศัตรูเห็นและหยุดพวกเขาไวไดอยางสิ้นเชิง ดวยความทุมเทและการรับใชชาติอยางไมหวั่นไหว จะไมมีผูรุกรานใดสามารถสยบเราได!"
 CHI_the_well_timed_swoop_of_a_falcon: "เหยี่ยวโฉบในจังหวะที่เหมาะเจาะ"
 CHI_the_well_timed_swoop_of_a_falcon_desc: "เราเชี่ยวชาญวิธีโจมตีและทําลายศัตรูแลว ตั้งแตการขับไลผูรุกรานไปจนถึงการโจมตีพวกเขาถึงบาน ความรูโบราณยังคงเปนจริงจนถึงทุกวันนี้ เมื่อเราเดินทัพสูชัยชนะ!"

  # Air Focuses
 CHI_rocaf: "เสริมกําลังกองทัพอากาศชาตินิยม" # was Establish the ROCAF
 CHI_rocaf_desc: "เพื่อรักษานานฟาของ[ROOT.GetName]และแผอํานาจออกนอกพรมแดน เราตองเสริมกําลังกองทัพอากาศ การลงทุนในหลักนิยมและความเชี่ยวชาญทางเทคนิคจะวางรากฐานสูกําลังทางอากาศสมัยใหมที่สามารถทาทายศัตรูใดก็ได"
 CHI_officialize_the_rocaf: "สถาปนากองทัพอากาศสาธารณรัฐจีนอยางเปนทางการ"
 CHI_officialize_the_rocaf_desc: "กองทัพอากาศเปนหนวยงานที่ไมเปนทางการมานานเกินไป บัดนี้ดวยพัฒนาการทางเทคโนโลยีและยุทธวิธีที่เราไดสรางขึ้น จึงปลอดภัยแลวที่จะปรับโครงสรางคณะกรรมการกิจการการบินใหเปนกองบัญชาการกองทัพอากาศ กองทัพอากาศสาธารณรัฐจีนจะเปนเหลาทัพที่แยกเปนเอกเทศโดยสมบูรณ เปนอิสระจากกองทัพบกและกองทัพเรือ"
 CHI_bring_the_war_home: "นําสงครามไปถึงบานศัตรู"
 CHI_bring_the_war_home_desc: "ศัตรูของเราตองเรียนรูวาไมมีดินแดนสวนใดของพวกเขาที่อยูพนมือเรา ดวยการทิ้งระเบิดแบบเจาะจงเปาหมายและสงครามจิตวิทยา เราจะโจมตีลึกและทําลายเจตจํานงในการรบของศัตรู"
 CHI_bring_the_war_home_tt: "ปลดล็อกการจูโจมตอไปนี้:\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_open_afamf_plants: "เปดโรงงาน AFAMF"
 CHI_open_afamf_plants_desc: "เพื่อพัฒนาอากาศยานแบบใหม เชน Chu XP-0 ที่พลตรีจู เจียเหรินวาดภาพไว เราตองเปดโรงงานที่สามารถรองรับและผลิตเครื่องบินขับไลเบาและเครื่องบินทิ้งระเบิดแบบดิ่ง สถานที่ที่เหมาะที่สุดคือคุนหมิง แตที่ใดก็ได ขอเพียงเราสรางสิ่งที่ตอกรกับศัตรูบนทองฟาได"
 CHI_open_afamf_plants_tt: "หากเราหรือรัฐในอารักขาของเราควบคุม §Y[325.GetName]§! เราจะไดรับโรงงานทหารเพิ่มอีกหนึ่งแหงที่นั่น"
 CHI_projecting_power: "แผอํานาจ"
 CHI_projecting_power_desc: "ดวยการขยายระยะปฏิบัติการทางอากาศออกไปไกลกวาแนวหนา เราจะพรอมโจมตีทุกที่ที่มีโอกาส การแผอํานาจทางอากาศไมใชเพียงความทะเยอทะยานอีกตอไป แตเปนความจําเปนทางยุทธศาสตร"
 CHI_strike_at_what_is_weak: "โจมตีจุดออน"
 CHI_strike_at_what_is_weak_desc: "เราจะไมปะทะความแข็งแกรงตรง ๆ แตหลักนิยมของเราตองเนนการโจมตีจุดที่เปราะบางที่สุดของศัตรูอยางแมนยําและตอเนื่อง"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long: "ลมที่พัดยามกลางวันยอมพัดนาน"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc: "การทิ้งระเบิดอยางตอเนื่องในเวลากลางวันเปนแนวทางการรบทางอากาศที่มั่นคงและเปนระบบ เราตองใชประโยชนจากทัศนวิสัยและการประสานงานเพื่อโจมตีอยางไดผล"
 CHI_but_a_night_breeze_soon_falls: "แตลมยามราตรียอมสงบเร็ว"
 CHI_but_a_night_breeze_soon_falls_desc: "ปฏิบัติการยามคํ่าคืนอาจเต็มไปดวยความเสี่ยง แตดวยการฝกที่เขมขนขึ้น นักบินของเราสามารถลดความสูญเสียภายใตความมืดได ศัตรูจะไมมีวันเห็นเราเขามา..."
 CHI_escort_efficiency: "ประสิทธิภาพการคุมกัน"
 CHI_escort_efficiency_desc: "เครื่องบินขับไลคุมกันคือโลของเครื่องบินทิ้งระเบิดของเรา การยกระดับการประสานงานและการคุมกันจะทําใหเครื่องบินกลับฐานไดครบถวนมากขึ้น พรอมสําหรับภารกิจครั้งตอไป"
 CHI_controlling_our_skies: "ครองนานฟาของเรา"
 CHI_controlling_our_skies_desc: "กอนจะครองความเหนือกวาในตางแดน เราตองควบคุมนานฟาในบานของเราใหได เครือขายปองกันภัยทางอากาศที่มีวินัยคือกระดูกสันหลังของความมั่นคงแหงชาติ"
 CHI_interception_detection: "การตรวจจับเพื่อสกัดกั้น"
 CHI_interception_detection_desc: "การตรวจจับที่ทันทวงทีชวยใหเราโจมตีกอนศัตรู เราจะพัฒนาเครือขายเรดารและการเฝาสังเกตการณเพื่อใหไดความไดเปรียบที่สําคัญยิ่งนั้น"
 CHI_focus_on_positional_advantage: "เนนความไดเปรียบเชิงตําแหนง"
 CHI_focus_on_positional_advantage_desc: "การรบทางอากาศไมไดขึ้นอยูกับจํานวนหรือความเร็วเทานั้น ความไดเปรียบอยูที่ความสูง มุม และการรับรูสถานการณ เราตองสอนนักบินใหใชประโยชนจากทุกความไดเปรียบ"
 CHI_effectivize_ground_crew_usage: "ใชลูกเรือภาคพื้นดินอยางมีประสิทธิภาพ"
 CHI_effectivize_ground_crew_usage_desc: "ประสิทธิภาพบนภาคพื้นดินสําคัญไมแพสมรรถนะบนทองฟา การปรับปรุงงานของลูกเรือและการสงกําลังบํารุงใหคลองตัวจะทําใหมีเครื่องบินอยูบนอากาศไดมากขึ้น"
 CHI_coordinate_with_the_army: "ประสานงานกับกองทัพบก"
 CHI_coordinate_with_the_army_desc: "ชัยชนะมาจากความเปนหนึ่งเดียวของเหลาทัพ กองทัพอากาศและกองกําลังภาคพื้นดินของเราตองปฏิบัติการดวยใจเดียวเพื่อภารกิจเดียว"
 CHI_an_appropriate_design: "แบบที่เหมาะสม"
 CHI_an_appropriate_design_desc: "อากาศยานของเราตองสอดคลองกับหลักนิยม ไมวาจะเพื่อพิสัยหรือความทนทาน เราจะมุงพัฒนาแบบที่เหมาะกับความตองการในการปฏิบัติการของเรา"
 CHI_an_appropriate_design_3_tt: "หากเลือก §Y$CHI_projecting_power$§! แลว:\n"
 CHI_an_appropriate_design_2_tt: "หากเลือก §Y$CHI_controlling_our_skies$§! แลว:\n"
 CHI_reorganise_the_central_armys_academy_aviation_corps: "จัดระเบียบหนวยการบินของโรงเรียนใหม"
 CHI_reorganise_the_central_armys_academy_aviation_corps_desc: "การฝกตองพัฒนาไปพรอมกับเทคโนโลยี เราจะปรับปรุงหนวยการบินอยางถึงรากเพื่อผลิตนักบินสมัยใหมที่มีความสามารถ พรอมสําหรับสมรภูมิแหงอนาคต"
 CHI_formalise_training_regime: "วางระเบียบแบบแผนการฝก"
 CHI_formalise_training_regime_desc: "แบบแผนการฝกที่สมํ่าเสมอและเขมงวดคือกุญแจสูการลดความสูญเสียและเพิ่มสมรรถนะ การสรางมาตรฐานเริ่มตนตั้งแตบัดนี้"
 CHI_conserve_our_pilots: "รักษานักบินของเรา"
 CHI_conserve_our_pilots_desc: "นักบินไมใชสิ่งที่หามาแทนไดงาย ดวยการลดความเสี่ยงและเพิ่มโอกาสรอดชีวิต เราจะรักษาประสบการณและคงกําลังรบไวได"
 CHI_camco_primacy: "ความเปนใหญของ $CHI_camco_organization_sea$"
 CHI_camco_primacy_desc: "CAMCO คือพันธมิตรในประเทศที่ดีที่สุดของเราดานการพัฒนาอากาศยาน การใหความสําคัญกับขีดความสามารถของพวกเขาจะทําใหการผลิตกาวทันความทะเยอทะยาน"
 CHI_SINAW_primacy: "ความเปนใหญของ $CHI_sinaw_organization_sea$"
 CHI_SINAW_primacy_desc: "SINAW มอบนวัตกรรมทางเทคนิคที่ CAMCO ใหไมได การลงทุนในการขยายตัวของพวกเขาจะนําเราเขาใกลความทัดเทียมกับมหาอํานาจตางชาติ"
 CHI_initiate_the_sky_projects: "ริเริ่มโครงการฟา"
 CHI_initiate_the_sky_projects_desc: "วิทยาการจรวดและระบบขับเคลื่อนขั้นสูงเปดทางเลือกทางยุทธศาสตรใหม เราจะใหทุนแกโครงการทดลองโดยมุงผลตอบแทนในระยะยาว"
 CHI_focus_on_the_Tianlong_project: "มุงเนนโครงการเทียนหลง"
 CHI_focus_on_the_Tianlong_project_desc: "เครื่องยนตไอพนคืออนาคตของสงครามทางอากาศ โครงการเทียนหลงยืนอยูแถวหนาของวิวัฒนาการนั้น"
 CHI_VTOL_experiments: "การทดลอง VTOL"
 CHI_VTOL_experiments_desc: "อากาศยานขึ้นลงทางดิ่งใหความคลองตัวบนภูมิประเทศที่คาดเดาไมได เราจะเริ่มทดสอบเพื่อประเมินบทบาทของมันในการรบสมัยใหม"
 CHI_hongxiang_force: "กองกําลังพลรมยูนนาน"
 CHI_hongxiang_force_desc: "ดวยความรวมมือกับพันธมิตรและเพื่อนรวมวงการการบิน เราจึงสามารถจัดตั้งโครงการฝกปฏิบัติการโดดรมทางทหารภายในประเทศได"

 # Navy focuses
 CHI_republic_of_china_navy: "กองทัพเรือสาธารณรัฐจีน"
 CHI_republic_of_china_navy_desc: "กองทัพเรือกลางมีอดีตที่ยุงยาก งบประมาณที่ขาดแคลนและการควบคุมชายฝงที่ไมแนนอนทําใหเรือของเราอยูในสภาพยํ่าแย เมื่อปญหากําลังกอตัวที่ขอบฟา เปาหมายของเราคือการกาวขามความทาทายเหลานี้"
 CHI_foreign_acquisition: "จัดหาจากตางประเทศ"
 CHI_foreign_acquisition_desc: "แมเราตั้งใจใหนี่เปนเพียงความถดถอยชั่วคราว แตเราตองยอมรับวามหาอํานาจอื่นลํ้าหนาเราไปไกลในดานความกาวหนาทางเทคโนโลยีทางเรือ การปรับปรุงกองทัพเรือใหทันสมัยตองเริ่มจากการติดตอผูอุปถัมภที่เหนือกวาทางเทคโนโลยี"
 CHI_develop_northern_naval_logistics: "พัฒนาการสงกําลังบํารุงทางเรือภาคเหนือ"
 CHI_develop_northern_naval_logistics_desc: "ชิงเตาซึ่งไดคืนจากญี่ปุนอยางเปนทางการในป 1922 เปนเมืองทาสําคัญทางยุทธศาสตรที่ควรมีบทบาทในความพยายามเสริมกําลังทางเรือของเรา"
 CHI_develop_southern_naval_logistics: "พัฒนาการสงกําลังบํารุงทางเรือภาคใต"
 CHI_develop_southern_naval_logistics_desc: "ชายฝงทางใตของเราซึ่งเต็มไปดวยดินแดนสวนแยกของนักลาอาณานิคมนั้นมีการปองกันที่ออนแออยางนาเศรา หากเราจะเผชิญหนามหาอํานาจตะวันตกในแบบของพวกเขา การทวงคืนและพัฒนาพื้นที่สําคัญนี้เปนสิ่งจําเปน"
 CHI_concerted_push: "ผลักดันอยางพรอมเพรียง"
 CHI_concerted_push_desc: "ชาวจีนแสดงใหเห็นครั้งแลวครั้งเลาถึงความสามารถในการปรับตัวเมื่อเผชิญความยากลําบาก สถานการณนี้ก็ไมตางกัน ผูนําของเราประกาศถึงความจําเปนในการมีกองทัพเรือที่ทัดเทียมมหาอํานาจ และเศรษฐกิจของเราจะลุกขึ้นรับความทาทายนี้"
 CHI_local_alloy_commission: "คณะกรรมการโลหะผสมในประเทศ"
 CHI_local_alloy_commission_desc: "แผนดินของเราอุดมดวยแรธาตุตามธรรมชาติมหาศาล แตเรากลับยังไมไดใชประโยชนจากมัน การสํารวจความเปนไปไดในดานนี้ยอมใหผลตอบแทนในอนาคตอยางแนนอน"
 CHI_deny_the_enemy: "ขัดขวางศัตรู"
 CHI_deny_the_enemy_desc: "แมความเหนือกวาทางบกของเราจะไมมีใครเทียบ แตขณะที่เราฟนฟูกองทัพเรือที่ทรุดโทรม สิ่งที่ดีที่สุดที่เราหวังไดอาจเปนการขัดขวางปฏิบัติการของศัตรู"
 CHI_dominate_the_enemy: "ครอบงําศัตรู"
 CHI_dominate_the_enemy_desc: "เราจะตอกรกับศัตรูอยางทัดเทียม ไมวาตองแลกดวยอะไร"
 CHI_navy_spooks: "พัฒนาหนวยขาวกรองทางเรือ"
 CHI_navy_spooks_desc: "นานนํ้ารอบจีนเปนศูนยกลางการคาที่คึกคัก ที่ใดมีพอคา ที่นั่นมีขาวลือ ที่ใดมีขาวลือ ที่นั่นมีโอกาส..."
 CHI_promote_admiral: "เลื่อนยศพลเรือเอก"
 CHI_promote_admiral_desc: "ความพยายามตอเรือในระยะหลังจะทําใหเรือรบเกาแกจากศตวรรษที่ 19 ของเราลาสมัยในที่สุด อยางไรก็ตาม นี่คือโอกาสที่จะดัดแปลงพวกมันเปนเรือฝกสําหรับทั้งลูกเรือและผูบังคับการ ดวยโครงการฝกที่ปรับใหเขากับทิศทางยุทธศาสตรของกองทัพเรือ"
 CHI_promote_admiral_tt: "หากเลือก §Y$CHI_deny_the_enemy$§! แลว พลเรือเอกทุกคนจะไดรับคุณลักษณะ §Y$green_water_expert$§! \n\nหากเลือก §Y$CHI_dominate_the_enemy$§! แลว พลเรือเอกทุกคนจะไดรับคุณลักษณะ §Y$blue_water_expert$§!"
 CHI_promote_admiral_dingwen_tt: "เลื่อนยศ §Y$CHI_jiang_dingwen_admiral$§! เปนพลเรือเอก"
 CHI_heavy_ship_research: "วิจัยเรือหนัก"
 CHI_heavy_ship_research_desc: "การผลิตเรือประจัญบานภายในประเทศเปนสิ่งสําคัญยิ่งเพื่อทัดเทียมมหาอํานาจในภูมิภาคและมหาอํานาจอาณานิคมที่ปลนสะดมชาติของเรามาจนถึงบัดนี้ แมเทคโนโลยีอาจทําใหเราเสียเปรียบ แตกระบวนการผลิตและเจตจํานงอันแรงกลาของประชาชนจะนําเราสูชัยชนะ"
 CHI_strike_from_below: "โจมตีจากใตนํ้า"
 CHI_strike_from_below_desc: "เยอรมนีพิสูจนแลววาชาติที่ถูกคุกคามโดยมหาอํานาจทางทะเลสามารถพึ่งพากองเรือใตนํ้าที่แข็งแกรงเพื่อปกปองผลประโยชนได เมื่อเราอยูในสถานการณคลายกัน เราจะมองไปทางตะวันตกเพื่อหาบทเรียน"
 CHI_fund_the_naval_air_establishment: "ใหทุนแกหนวยการบินนาวี"
 CHI_fund_the_naval_air_establishment_desc: "ความไดเปรียบรวมของความเหนือกวาทางทะเลและทางอากาศเปนรางวัลที่ยิ่งใหญเกินกวาจะมองขาม การขยายกําลังการบินนาวีจะลดความเสี่ยงที่การสื่อสารระหวางเหลาทัพจะลมเหลว"
 CHI_early_detections: "การตรวจจับลวงหนา"
 CHI_early_detections_desc: "ดวยกองเรือที่มีประสิทธิภาพแตขนาดไมใหญ เราไมมีทางเลือกนอกจากตองปรับการปะทะใหใชเรือไดคุมคาที่สุด ขาวกรองและการรับรูสถานการณคือวิธีที่ดีที่สุดในการทําเชนนั้น"
 CHI_defend_our_coasts: "ปกปองชายฝงของเรา"
 CHI_defend_our_coasts_desc: "ศัตรูไมอาจโจมตีเราไดหากเขาถึงเราไมได การวางทุนระเบิดคือวิธีปองกันการรุกรานที่มีประสิทธิภาพที่สุด เรื่องคาใชจายคอยกังวลทีหลัง..."
 CHI_long_range: "พิสัยไกล"
 CHI_long_range_desc: "ลูกธนูที่ถวงนํ้าหนักมาอยางดีอาจยุติสงครามไดกอนที่จะเริ่มตน เครื่องยนตที่ใหญและเสียงดังกวาอาจทําใหลูกเรือเสี่ยงอันตราย แตความสามารถในการแผอํานาจไปไดไกลยิ่งขึ้นจะเพิ่มอํานาจตอรองของเราบนเวทีโลกดวย"
 CHI_battleship_focus: "มุงเนนเรือประจัญบาน"
 CHI_battleship_focus_desc: "ขณะที่เราเริ่มตอยักษใหญแหงทองทะเลลําแรกของเรา จึงเปนการถูกตองและสมควรที่เราจะเฉลิมฉลองบิดาผูยิ่งใหญแหงชาติของเรา"
 CHI_coastal_defence: "การปองกันชายฝง"
 CHI_coastal_defence_desc: "การใชพื้นที่อยางคุมคาที่สุดในกองเรือดํานํ้าหมายถึงเรือดํานํ้าที่เล็กลงและเร็วขึ้น แตเราก็ตองตัดสิ่งที่ไมจําเปนออกไปบาง เชน เตียงนอน... หรือสิ่งอํานวยความสะดวกอื่นใด"
 CHI_heavy_cruiser_focus: "มุงเนนเรือลาดตระเวนหนัก"
 CHI_heavy_cruiser_focus_desc: "กองเรือผิวนํ้าของเรา แมจะเปนมรดกตกทอดจากราชวงศชิง แตก็รับใชเรามาอยางดีเกือบ 50 ป แมโลกจะเปลี่ยนไป แตก็ไมฉลาดนักที่จะทิ้งองคความรูเชิงสถาบันอันกวางขวางในการปฏิบัติการเรือลาดตระเวนหุมเกราะพิสัยใกล อนาคตของเราควรผสานอดีตไวดวย"
 CHI_mobile_bases: "ฐานเคลื่อนที่"
 CHI_mobile_bases_desc: "ดังที่สวนอื่นของโลกกําลังพิสูจน ทองฟาคืออนาคตของสงคราม อยางไรก็ตาม ความสามารถในการโจมตีระยะไกลของเราถูกจํากัดดวยภูมิศาสตร เราตองทุมเทความพยายามใหกับแพลตฟอรมโจมตีเคลื่อนที่ตามแบบอยางของมหาอํานาจ"
 CHI_the_seas_of_tomorrow: "ทองทะเลแหงวันพรุงนี้"
 CHI_the_seas_of_tomorrow_desc: "เราฝนถึงอนาคตที่จีนเปนผูนําโลกดานอํานาจละมุนและความเกงกาจทางเทคโนโลยี เราใชเวลาหลายปไลตามกองทัพเรือขนาดมหึมาของมหาอํานาจอาณานิคมและคูแขงในภูมิภาค แตบัดนี้ถึงเวลาที่เราจะกําหนดเสนทางแหงอนาคตดวยตนเอง"
 CHI_the_seas_of_tomorrow_tt: "§Yนักวิทยาศาสตร§! ที่เชี่ยวชาญในสิ่งที่เลือกไวกอนหนานี้จะพรอมใหใชงาน"
 CHI_long_range_screens: "เรือคุมกันพิสัยไกล"
 CHI_long_range_screens_desc: "เมื่อเราเพิ่มความพยายามที่จะมองไกลกวาความขัดแยงภายในประเทศ ความสามารถในการวางกําลังจํานวนมากในระยะไกลดวยตนทุนตํ่าจึงกลายเปนสิ่งจําเปนยิ่ง"

  # Industrial branch
 CHI_promote_the_national_currency: "สงเสริมเงินตราแหงชาติ"
 CHI_promote_the_national_currency_desc: "การยกเลิกมาตรฐานเงินดวยการนําเงินตราแหงชาติแบบใหมมาใชเมื่อไมนานนี้ไดแสดงผลดีในเบื้องตนในการลดการพึ่งพาเหตุการณโลก อยางไรก็ตาม เงินตราใหมยังใชแพรหลายเฉพาะในเมืองใหญ และเราควรรวมแรงกันเพื่อใหมีการใชในเขตชนบทดวย"
 CHI_institute_a_national_registry_of_property: "จัดตั้งทะเบียนทรัพยสินแหงชาติ"
 CHI_institute_a_national_registry_of_property_desc: "ระบบราชการคือรากฐานของรัฐ และระบบราชการไมอาจทํางานไดอยางมีประสิทธิภาพหากไมมีขอมูลที่ถูกตอง ความไรประสิทธิภาพนี้เองที่เปดชองใหผูไรยางอายฉวยประโยชนจากระบบและแสวงหาความรํ่ารวยบนความเสียหายของชาติ"
 CHI_the_three_year_plan: "แผนสามป"
 CHI_the_three_year_plan_desc: "ความพยายามของเราไรจุดมุงเนนอยางมาก และชาติของเราขาดการชี้นํา ดวยความพยายามตามแผนในอีกไมกี่ปขางหนา เราจะทุมพลังไปที่เปาหมายอันยิ่งใหญหนึ่งเดียว หวังวาจะไมมีสิ่งใดมาหยุดยั้ง"
 CHI_the_three_year_plan_tt: "§Rจะถูกลบออกเมื่อเขาสูสงคราม§!"
 CHI_extend_compulsory_education: "ขยายการศึกษาภาคบังคับ"
 CHI_extend_compulsory_education_desc: "ประชากรที่รูหนังสือคือกระดูกสันหลังของการพัฒนาชาติ แตนาเสียดายที่ความพยายามดานการศึกษาของเราเปนเพียงผิวเผินและกระจุกอยูในเขตเมือง ทําใหประชากรในชนบทถูกมองขาม ประชากรที่พรอมใหใครคนอื่นเขามาทําหนาที่แทนรัฐ"
 CHI_extend_compulsory_education_tt: "ทุก §Y[?CHI_improving_neglected_countryside_mission_time]§! วัน §Y$CHI_neglected_countryside$§! จะ §Gดีขึ้น§! จนกวาตัวปรับคาเชิงลบจะหมดไป"
 CHI_initiate_the_gung_ho_movement: "ริเริ่มขบวนการกงเหอ"
 CHI_initiate_the_gung_ho_movement_desc: "วิกฤตปจจุบันทําใหเราเขาใจวาสถานการณของเราขาดแคลนเพียงใด ทั้งดานยุทโธปกรณและปจจัยการผลิต สิ่งที่เราไมขาดคือผูคนที่พรอมทํางานหากไดรับการจัดระเบียบอยางเหมาะสม มีผูเสนอแนวคิดใหจัดตั้งสหกรณอุตสาหกรรมขนาดเล็กที่เราสามารถกระจายไปทั่วประเทศ"
 CHI_expand_the_bureaucracy: "ขยายระบบราชการ"
 CHI_expand_the_bureaucracy_desc: "ประเทศของเรากวางใหญ และการบริหารตองใชความพยายามและผูคนมาก ดวยฐานการศึกษาที่ขยายตัว ตอนนี้เราสามารถจางคนเขาสูกลไกรัฐไดมากขึ้น และเสริมการควบคุมพื้นที่หางไกลของประเทศ"
 CHI_send_the_urban_students_to_the_countryside: "สงนักศึกษาในเมืองสูชนบท"
 CHI_send_the_urban_students_to_the_countryside_desc: "แมความพยายามดานการศึกษาของเราจะเกิดผลแลว แตยังคงมีชองวางขนาดใหญระหวางเมืองกับชนบท ถึงเวลาใชแนวทางที่ตรงไปตรงมามากขึ้น และนําความรูของนักศึกษาระดับอุดมศึกษามาใชในโรงเรียนประจําหมูบาน"
 CHI_find_foreign_financiers: "หานักลงทุนตางชาติ"
 CHI_find_foreign_financiers_desc: "แมศักยภาพทางเศรษฐกิจของเราจะไรขีดจํากัด แตสภาพปจจุบันหมายความวาการสรางเศรษฐกิจจะใชเวลานานหากเราทําเอง วิธีที่เร็วกวาในการเรงเครื่องเศรษฐกิจคือการนําทุนจากภายนอกเขาประเทศผานการรวมทุน เราควรมองหาบุคคลในตางประเทศที่มองเห็นโอกาสของชาติจีน"
 CHI_find_foreign_financiers_tt: "ไดรับ: §Y+1500 $CIC_BANK_HEADER$§! สําหรับมหาอํานาจแตละชาติ (ยกเวนญี่ปุน) ที่มีความเห็นตอ [ROOT.GetName] อยางนอย §G70§!\n\n"
 CHI_naval_separate_defense_plan: "แผนปองกันแยกสวนทางเรือ"
 CHI_naval_separate_defense_plan_desc: "เฉิน เสากวานไดเสนอสิ่งที่เขาเรียกวาแผนปองกันแยกสวนทางเรือ ซึ่งมุงสรางเรือบรรทุกเครื่องบินอยางนอยสิบสองลําภายใน 30 ปขางหนา หากเราตองการรักษานานนํ้า เราควรรับขอเสนอนี้ และเริ่มสรางกองเรือบรรทุกเครื่องบินโดยเร็วที่สุด!"
 CHI_fund_the_plan_domestically: "ระดมทุนแผนจากในประเทศ"
 CHI_fund_the_plan_domestically_desc: "หากมีบทเรียนหนึ่งจากศตวรรษที่ผานมา นั่นคือการไวใจทุนตางชาติเปนเรื่องอันตราย หากเราจะสรางอุตสาหกรรมของชาติ การพึ่งพาชาวตางชาติแทนธนาคารและนักลงทุนในประเทศจะเปนความผิดพลาดรายแรงและเปนแนวโนมที่อันตราย เราควรหาแหลงทุนในประเทศแทนเพื่อไมใหเสี่ยงตอการพึ่งพา"
 CHI_finance_cooperatives: "ใหทุนแกสหกรณ"
 CHI_finance_cooperatives_desc: "สหกรณเต็มไปดวยพลังและความเฉลียวฉลาด แตเขาไมถึงสินเชื่อ แมเราอาจไมมีทรัพยากรมหาศาล แตความตองการของสหกรณนั้นนอยมากจนเราสามารถใหทุนเองไดและกาวไปอีกขั้น"
 CHI_introduce_income_tax: "นําภาษีเงินไดมาใช"
 CHI_introduce_income_tax_desc: "วิธีที่เราหาเงินเขารัฐนั้นลาสมัยและไมเหมาะกับโลกสมัยใหม แมเราพยายามนําภาษีเงินไดมาใชหลายครั้งในชวงครึ่งศตวรรษที่ผานมา แตครั้งนี้เรามีรัฐบาลที่เขมแข็งพอจะทําใหสําเร็จ"
 CHI_redistribute_land: "ปฏิรูปที่ดิน"
 CHI_redistribute_land_desc: "ชาวนาในประเทศของเราจํานวนมากตองทํางานภายใตเจาที่ดินที่ขูดรีดผลประโยชนไปเปนของตน สิ่งนี้จะปลอยไวไมได เพราะมันฉุดผลิตภาพของประเทศใหตกตํ่าและลาหลัง"
 CHI_expand_academica_sinica: "ขยายบัณฑิตยสถานแหงชาติ (Academia Sinica)"
 CHI_expand_academica_sinica_desc: "เมื่อประชากรสวนใหญเริ่มมีระดับการศึกษาที่นาพอใจ ก็ถึงเวลาหันมาดูการอุดมศึกษา เพื่อขีดความสามารถที่สูงขึ้น เราจะพัฒนาสถาบันที่มีอยูแลวใน Academia Sinica ซึ่งเปนสถาบันวิทยาศาสตรชั้นนําที่สุดของเรา"
 CHI_expand_the_chinese_academy_of_sciences: "กอตั้งสถาบันวิทยาศาสตรจีน"
 CHI_expand_the_chinese_academy_of_sciences_desc: "Academia Sinica ไดเริ่มโครงการริเริ่มใหม ซึ่งจะรวบรวมยอดอัจฉริยะของชาติมาไวดวยกันที่สถาบันแหงชาติแหงใหมดานวิทยาศาสตรธรรมชาติ วิทยาศาสตร และเทคโนโลยี"
 CHI_expand_national_sun_yat_sen_university: "มหาวิทยาลัยแหงชาติซุน ยัตเซ็น"
 CHI_expand_national_sun_yat_sen_university_desc: "เมื่อเศรษฐกิจสามารถสนับสนุนการอุดมศึกษาของประชาชนไดแลว ก็ถึงเวลาที่ชาวจีนจะศึกษาอยางกวางขวาง ไตถามอยางถี่ถวน ไตรตรองอยางรอบคอบ แยกแยะอยางชัดแจง และปฏิบัติอยางจริงจัง มีเพียงหลักการเหลานี้ที่ ดร.ซุน ยัตเซ็น วางไวเทานั้นที่จะทําใหชาติของเรากาวขึ้นเปนผูนําดานการวิจัยและพัฒนา"
 CHI_expand_academica_sinica_tt: "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$อยูที่ [?CHI_neglected_countryside_academia_sinica_trigger|R%] หรือสูงกวา"
 CHI_expand_the_cooperatives: "ขยายสหกรณ"
 CHI_expand_the_cooperatives_desc: "สหกรณสรางความประทับใจใหเราดวยประสิทธิภาพ แตยังมีขนาดและขอบเขตเล็ก หากเราใหพวกเขาใชเครือขายสายสัมพันธของเรา พวกเขาจะเติบโตและขยายตัวไดอีกมาก"
 CHI_administer_cooperatives: "บริหารสหกรณ"
 CHI_administer_cooperatives_desc: "ธรรมชาติของสหกรณทําใหเติบโตและแพรกระจายอยางรวดเร็ว แตมักทํางานอยางโดดเดี่ยว สํานักงานระดับชาติจะชวยประสานงานและสนับสนุนเครือขายสหกรณทั่ว[ROOT.GetName]"
 CHI_monopolise_resource_extraction: "ผูกขาดการขุดทรัพยากร"
 CHI_monopolise_resource_extraction_desc: "เราไดเห็นในประเทศอื่นแลวถึงพลังขององคกรสวนกลางในการวางแผนเศรษฐกิจ โดยเฉพาะการทําใหการไหลของทรัพยากรไมหยุดชะงักหรือถูกผลประโยชนสวนตัวฉวยประโยชน ควรอยูในมือของนักวิชาการเทคโนแครต หรือในกรณีของเราคือคณะกรรมการทรัพยากรแหงชาติ"
 CHI_invite_foreign_experts: "เชิญผูเชี่ยวชาญตางชาติ"
 CHI_invite_foreign_experts_desc: "ศตวรรษที่ผานมาแสดงใหเห็นวาความรูทางเทคนิคของเราลาหลังชาวตะวันตก แมสิ่งนั้นจะทําใหเราเสียเปรียบ แตบัดนี้เราอยูในฐานะที่จะใชประโยชนจากความรูของพวกเขาและทําใหเศรษฐกิจเติบโตเร็วกวาที่เคย"
 CHI_print_money_for_the_army: "พิมพเงินเพื่อกองทัพ"
 CHI_print_money_for_the_army_desc: "กองทัพไมเคยไดมาฟรี และหากตองการกองทัพขนาดใหญก็มีราคาที่ตองจาย อยางไรก็ตาม มีวิธีจายหลายแบบ และเราสามารถสั่งใหพิมพเงินเพิ่มเพื่อจุดประสงคนี้โดยเฉพาะ"
 CHI_maintain_adequate_currency_reserves: "รักษาทุนสํารองเงินตราใหเพียงพอ"
 CHI_maintain_adequate_currency_reserves_desc: "การใชจายอยางไมยั้งคิดเสี่ยงทําใหระบบลมสลาย ดังที่เห็นมาแลวครั้งแลวครั้งเลา หากเราจะประสบความสําเร็จในการเติบโตอยางมีการควบคุม เราตองยับยั้งชั่งใจและรักษาทุนสํารองเงินตราใหเหมาะสม"
 CHI_maintain_adequate_currency_reserves_tt: "ทุก §Y[?CHI_improving_inefficient_economy_mission_time]§! วัน §Y$CHI_inefficient_economy$§! จะดีขึ้นจนกวาตัวปรับคาเชิงลบจะหมดไป"
 CHI_develop_the_chemical_industry: "พัฒนาอุตสาหกรรมเคมี"
 CHI_develop_the_chemical_industry_desc: "หนึ่งในความสําเร็จยิ่งใหญที่สุดของอารยธรรมสมัยใหมคือการพิชิตธรรมชาติดวยเคมี ตั้งแตเกษตรกรรมไปจนถึงการผลิต อุตสาหกรรมเคมีสามารถเสริมพลังใหสังคมได แตนาเสียดายที่ของเรายังอยูในขั้นเริ่มตน หากเราพัฒนาอุตสาหกรรมเหลานี้ได ก็ไมอาจบอกไดวาเราจะบรรลุสิ่งใดไดบาง"
 CHI_grow_the_coal_industry: "ขยายอุตสาหกรรมถานหิน"
 CHI_grow_the_coal_industry_desc: "ถานหินใหพลังงานแกโรงงาน รถไฟ และเตาหลอมของเรา เพื่อใหมีพลังงานปอนชาติตอไปขณะที่อํานาจทางเศรษฐกิจเติบโต เราตองหาแหลงพลังงานใหม คณะกรรมการทรัพยากรแหงชาติไดระบุแหลงหลายแหงที่เราควรนํามาใช"
 CHI_grow_the_coal_industry_tt1: "ไดรับ §Yถานหิน§! เพิ่มเติมในรัฐหลักของเราและในรัฐขุนศึกที่เปนพันธมิตร"
 CHI_grow_the_coal_industry_tt2: "ปลดล็อกการตัดสินใจสํารวจแหลง §Yถานหิน§! ในรัฐของเราและรัฐขุนศึกที่เปนพันธมิตร"
 CHI_tungsten_and_antimony_extraction: "การขุดทังสเตนและพลวง"
 CHI_tungsten_and_antimony_extraction_desc: "โลหะยุทธศาสตรสรางชัยชนะเชิงยุทธศาสตร และเรามีแหลงแรมหาศาล แหลงแรที่จะใชประโยชนไดอยางมากหากเราขุดแรขึ้นมาจากพื้นดินได"
 CHI_central_steel_and_machine_works: "โรงงานเหล็กกลาและเครื่องจักรกลาง"
 CHI_central_steel_and_machine_works_desc: "เหล็กกลาเปนรากฐานสําคัญยิ่งของอุตสาหกรรม และจนถึงตอนนี้เรายังขาดการผลิตที่เหมาะสม ทั้งที่เรามีทรัพยากรอยู เราเพียงตองนําแผนของคณะกรรมการทรัพยากรแหงชาติมาใช"
 CHI_empower_those_that_have_lost: "เสริมพลังผูที่สูญเสีย"
 CHI_empower_those_that_have_lost_desc: "ในชาติของเรามีหลายคนที่สูญเสียไปมากในสงครามนี้ ทั้งงานหรือบาน คนเหลานี้อาจดูไมใชแหลงพลังที่นาจะเปนไปได แตหากไดรับโอกาส พวกเขาจะเปนคลื่นที่ซัดผูรุกรานออกไป"
 CHI_found_a_modern_fertiliser_plant: "กอตั้งโรงงานปุยสมัยใหม"
 CHI_found_a_modern_fertiliser_plant_desc: "เพื่อเลี้ยงดูชาติ เราตองปรับปรุงเกษตรกรรมใหเปนระบบ และการผลิตปุยในทองถิ่นคือกาวแรก เราจะสรางโรงงานเพื่อจุดประสงคนี้ แตจะใชทําอยางอื่นดวย"
 CHI_import_fertilisers: "นําเขาปุย"
 CHI_import_fertilisers_desc: "แมการผลิตในประเทศจะแกปญหาการพึ่งพาได แตการเลียนแบบผูอื่นก็เปนเพียงขั้นตอนที่เพิ่มขึ้นมา หากเราตั้งคําสั่งซื้อจากที่อื่น เราก็จะมุงเนนจุดแข็งเฉพาะตัวของเราได"
 CHI_construct_the_banqiao_dam: "สรางเขื่อนปานเฉียว"
 CHI_construct_the_banqiao_dam_desc: "แมนํ้าอันยิ่งใหญคือสิ่งที่นิยามแผนดินของเรา และการควบคุมแมนํ้าเปนรากฐานของอารยธรรมเรามาโดยตลอด ในอนาคต แมนํ้าเหลานั้นจะขับเคลื่อนการเติบโตและความยิ่งใหญของชาติเรา!"

#################
## PHILIPPINES ##
#################

#############
# PHI FOCUS #
#############

PHI_commonwealth_of_the_philippines: "เครือจักรภพฟลิปปนส"
PHI_commonwealth_of_the_philippines_desc: "เครือจักรภพฟลิปปนสที่เพิ่งกอตั้งเมื่อปที่แลวคือกาวแรกสูฟลิปปนสที่เปนเอกราช ซึ่งสหรัฐอเมริกาสัญญาไววาจะเปนชวงเปลี่ยนผาน 10 ป ยังมีอีกหลายสิ่งที่ตองทําและหลายการตัดสินใจที่ตองเลือก เพื่อใหชาติที่เพิ่งถือกําเนิดของเราเดินหนาไดอยางเหมาะสม"
PHI_align_with_the_usa: "เขาขางสหรัฐอเมริกา"
PHI_align_with_the_usa_desc: "สหรัฐอเมริกาพิสูจนแลววาเปนเจาอาณานิคมที่มีเมตตาและมั่งคั่ง การทําใหชาติของเราใกลชิดกันยิ่งขึ้นจะทําใหพวกเขาชวยเราไดอีกมากในการเรงการพัฒนาและรับประกันความคุมครอง"
PHI_usa_equipment: "§Y[PHI.GetName]§! จะใชองคกรอุตสาหกรรมทหาร (MIO) ของ §Y[USA.GetName]§!"
PHI_usa_equipment_non_aat: "§Y[PHI.GetName]§! จะใชผูออกแบบยุทโธปกรณของ §Y[USA.GetName]§!"
PHI_align_with_japan: "เขาขางญี่ปุน"
PHI_align_with_japan_desc: "แมจะวางทาอยางไร สหรัฐอเมริกาก็ยังเปนเจาอาณานิคม และอาจผิดสัญญาตอเราเมื่อใดก็ได ดังนั้นจึงควรหามิตรใหมบนเวทีระหวางประเทศ และในตอนนี้ญี่ปุนดูจะเปนทางเลือกที่รอบคอบที่สุด"
PHI_jap_equipment: "§Y[PHI.GetName]§! จะใชองคกรอุตสาหกรรมทหาร (MIO) ของ §Y[JAP.GetName]§!"
PHI_jap_equipment_non_aat: "§Y[PHI.GetName]§! จะใชผูออกแบบยุทโธปกรณของ §Y[JAP.GetName]§!"
PHI_quezon_city: "เมืองเกซอน"
PHI_quezon_city_desc: "มะนิลาทําหนาที่เมืองหลวงไดดี แตก็ถูกบีบดวยปญหารายแรง เชน ความแออัด การขาดแคลนที่อยูอาศัย สุขอนามัยที่ยํ่าแย และการจราจรติดขัด สิ่งที่เราตองการคือเมืองที่วางผังมาตั้งแตแรกเพื่อเปนเมืองหลวง และแมจะตองใชเวลาหลายปหรือหลายทศวรรษในการกอสรางและพัฒนา เราควรเริ่มตั้งแตตอนนี้และเก็บเกี่ยวผลจากวิสัยทัศนของเราในภายหลัง!"
PHI_peg_the_peso_to_the_dollar: "ตรึงเปโซไวกับดอลลาร"
PHI_peg_the_peso_to_the_dollar_desc: "เงินตราของเราควรผูกไวกับดอลลารสหรัฐเพื่อกําหนดมูลคา ซึ่งจะทําใหเงินตราของเรามีฐานมูลคาที่แทจริงและเปนรากฐานที่เชื่อถือไดในการคาขาย"
PHI_leverage_the_peso: "ใชประโยชนจากเปโซ"
PHI_leverage_the_peso_desc: "เงินตราของเราเปนของเราเอง และเราควรทําใหมันแตกตางจากดอลลารสหรัฐ สิ่งนี้จะทําใหเราดําเนินนโยบายการเงินเชิงแกไขที่เหมาะสมที่สุดตอการพัฒนาเศรษฐกิจตอไปได"
PHI_agricultural_migrants_to_hawaii: "แรงงานเกษตรอพยพสูฮาวาย"
PHI_agricultural_migrants_to_hawaii_desc: "แรงงานชาวฟลิปปนสจํานวนหนึ่งไดรับโชคดีจากการทํางานใหเกษตรกรชาวอเมริกันในฮาวาย เราควรสงเสริมการอพยพนี้ เพื่อใหพวกเขาสงเงินกลับมาใหครอบครัวที่บานตอไป และทําใหเศรษฐกิจของเราเติบโต"
PHI_unicameral_legislature: "สภานิติบัญญัติสภาเดียว"
PHI_unicameral_legislature_desc: "หนึ่งในขั้นตอนสําคัญที่สุดในการสถาปนารัฐเอกราชของเราคือการจัดตั้งรัฐบาลที่เปนอิสระ การสรางบางสิ่งขึ้นจากความวางเปลานั้นยากยิ่ง ดังนั้นเราควรจัดตั้งสภาเดียวในรัฐสภาฟลิปปนส"
PHI_national_fiscal_policy: "นโยบายการคลังแหงชาติ"
PHI_national_fiscal_policy_desc: "เมื่อชาติของเรามุงหนาสูเอกราชอยางมั่นคงแลว สิ่งแรก ๆ ที่เราตองทําคือแยกการเงินของเราออกจากสหรัฐอเมริกา จัดทํางบประมาณของเราเอง และสรางชองทางหารายไดผานการเก็บภาษี"
PHI_encourage_foreign_investment: "สงเสริมการลงทุนจากตางชาติ"
PHI_encourage_foreign_investment_desc: "สหรัฐอเมริกาไมใชชาติเดียวที่สนใจจะไดสวนแบงในตลาดของเรา เรามีวัตถุดิบมากมายและภาคเกษตรที่รุงเรือง เราควรแสดงใหชัดวาชาติของเราเปดรับการลงทุนจากผูที่มีทุนและวิสัยทัศนที่จะไดประโยชนจากความอุดมสมบูรณของฟลิปปนส"
PHI_develop_japanese_trade_connections: "พัฒนาสายสัมพันธการคากับญี่ปุน"
PHI_develop_japanese_trade_connections_desc: "ญี่ปุนแสดงชัดวากระหายสินคาและทรัพยากร และฟลิปปนสก็มีของมากมายใหคาขาย เราควรสงเสริมการพาณิชยระหวางสองชาติเพื่อประโยชนรวมกัน"
PHI_encourage_japanese_investment: "สงเสริมการลงทุนจากญี่ปุน"
PHI_encourage_japanese_investment_desc: "ปจจุบันสหรัฐอเมริกาไดเปรียบทางการคาหลายประการในประเทศของเรา เราควรสรางสายสัมพันธกับญี่ปุนอยางเงียบ ๆ เพื่อใหการลงทุนจากญี่ปุนไหลเขาสูชาติของเรา และตัดราคาความละโมบของชาวอเมริกัน"
PHI_quezon_city_campus: "วิทยาเขตเมืองเกซอน"
PHI_quezon_city_campus_desc: "เชนเดียวกับที่เรากําลังวางแผนอนาคตของชาติดวยการวางผังและสรางเมืองแหงอนาคต เราก็ควรคํานึงถึงอนาคตของพลเมืองฟลิปปนส และทําใหความเปนเลิศทางการศึกษามีพื้นที่เติบโตในเมืองที่เพิ่งตั้งตนแหงนี้"
PHI_reduce_unneccessary_expenditure: "ลดรายจายที่ไมจําเปน"
PHI_reduce_unneccessary_expenditure_desc: "เมื่อเรามีนโยบายการคลังแหงชาติแลว เราตองทําใหบัญชีสมดุลอยางเหมาะสม เราตองการบรรลุเปาหมายนี้ไมใชดวยการขึ้นภาษีหรือไลลาผูหลบเลี่ยงภาษี แตดวยการตัดไขมันสวนเกินที่ไมจําเปน ทายที่สุดแลว หากเรายังไมไดใหบริการเหลานั้นอยูแลว ใครจะคิดถึงมัน?"
PHI_subsidies: "เงินอุดหนุน"
PHI_subsidies_desc: "เปนขอเท็จจริงของทุนนิยมวาตองใชเงินเพื่อสรางเงิน เราตองใชงบประมาณอัดฉีดเงินเขาสูภาคสวนที่จะเห็นผลตอบแทนรวดเร็ว ดวยการใหเงินอุดหนุนแบบเจาะจงแกความพยายามดานอุตสาหกรรม และขยายโครงสรางพื้นฐานเพื่อใหเขาถึงทรัพยากรและประชากรที่อุดมสมบูรณแตเขาถึงยากไดงายขึ้น"
PHI_basic_welfare: "สวัสดิการพื้นฐาน"
PHI_basic_welfare_desc: "เรามีความรับผิดชอบตอประชาชนที่เปราะบางกวา และมีหนาที่บรรเทาความยากลําบากของพวกเขาอยางนอยบางสวน เรามีสิ่งจําเปนขั้นพื้นฐานอยางสถาบันการกุศลอยูแลว แตเมื่ออุตสาหกรรมเติบโต ความทุกขยากของคนงานก็ปรากฏชัดขึ้น เราจะจัดตั้งสภาเศรษฐกิจแหงชาติเพื่อกําหนดกฎหมายแรงงานและคาแรงขั้นตํ่า"
PHI_encourage_asian_trade: "สงเสริมการคาในเอเชีย"
PHI_encourage_asian_trade_desc: "ชาติในเอเชียมีสายสัมพันธทางทะเลที่สําคัญมาแตอดีต และแมมหาอํานาจอาณานิคมจะพยายามอยางเต็มที่เพื่อตัดทอน แตสายสัมพันธเหลานั้นก็ยังแนนแฟน เราควรหลอเลี้ยงความเชื่อมโยงนี้และสงเสริมการคาระหวางชาติใหมากขึ้น เพื่อการเติบโตและความรุงเรืองรวมกันของทุกฝาย"
PHI_pro_hacendados: "สนับสนุนอาเซนดาโด"
PHI_pro_hacendados_desc: "ชนชั้นนําเจาที่ดินผูมั่งคั่งที่ตกทอดมาจากยุคอาณานิคมสเปนยังคงเปนพลังที่มีอิทธิพลและความมั่งคั่งอยางมากในฟลิปปนส เราควรเอาใจตระกูลเกาแกเหลานี้ และแลกกับการคงสถานะเดิมไว เพื่อใหไดรับการอุปถัมภจากพวกเขา"
PHI_anti_hacendados: "ตอตานอาเซนดาโด"
PHI_anti_hacendados_desc: "ชนชั้นนําเจาที่ดินผูมั่งคั่งที่ตกทอดมาจากยุคอาณานิคมสเปนกดขี่ผูเชาที่ดินของตนมานานเกินไป เราควรรื้อถอนสถาบันลาสมัยนี้และคืนที่ดินใหแกผูที่ทํากินบนนั้น มีเพียงวิธีนี้เทานั้นที่จะทําใหเศรษฐกิจทันสมัยและกําจัดปลิงดูดเลือดเหลานี้ไปได"
PHI_sugar_barons: "เจาพอนํ้าตาล"
PHI_sugar_barons_desc: "นํ้าตาลคือกระดูกสันหลังของเศรษฐกิจฟลิปปนสทั้งหมด หากไมมีทรัพยากรอันอุดมนี้ ความรุงเรืองของชาติจะหายไปในชั่วขามคืน เราตองสงเสริมผูที่เพาะปลูกและสงออกพืชสําคัญนี้ เพื่อใหเราไดเงินหวาน ๆ มากขึ้นอีก"
PHI_sugar_barons_unlock_tt: "§Yปลดล็อกการตัดสินใจภาษีสรรพสามิตนํ้าตาล§!"
PHI_sugar_barons_tt: "§Yนายพลหนึ่งคนที่สุมเลือก§! จะไดรับทักษะการวางแผน §G+2§!"
PHI_luzon_transport: "การคมนาคมลูซอน"
PHI_luzon_transport_desc: "แมจะเปนสวนที่พัฒนาแลวมากที่สุดของฟลิปปนส แตก็มีประชากรหนาแนนและเปนเขตอุตสาหกรรมมากที่สุดดวย เสนทางคมนาคมจึงตองการการลงทุนและการขยายเพิ่มเติมอยางมาก"
PHI_expand_gold_mining: "ขยายการทําเหมืองทองคํา"
PHI_expand_gold_mining_desc: "สเปนเฉียบแหลมเปนพิเศษเสมอเมื่อเปนเรื่องการคนหาแหลงทองคําและเงิน และพวกเขาก็ไมผิดหวังในฟลิปปนส แตพวกเขาคงโกรธมากหากรูวาสายแรทองคําที่รํ่ารวยที่สุดเพิ่งถูกขุดในตอนนี้ และการสงออกที่เฟองฟูนี้กําลังนํารายไดสูงเปนประวัติการณมาสูชาติของเรา"
PHI_mindanao_transport: "การคมนาคมมินดาเนา"
PHI_mindanao_transport_desc: "แมจะเปนเกาะใหญอันดับสองของหมูเกาะฟลิปปนส แตก็ไมเคยไดรับการลงทุนใกลเคียงกับลูซอนทางเหนือเลย เราควรแกไขการมองขามนี้!"
PHI_land_reform: "ปฏิรูปที่ดิน"
PHI_land_reform_desc: "เจาที่ดินผูมั่งคั่งยังคงครอบงําภาคเกษตรในฟลิปปนส เราตองแสดงใหเห็นวาเราเปนชาติสมัยใหม ไมใชชาติศักดินา รัฐจะบังคับซื้อที่ดินผืนใหญเหลานี้ และขายแบงเปนแปลงใหเกษตรกรรายยอยและบริษัทเพื่อการเพาะปลูกและใชประโยชนอยางมีประสิทธิภาพยิ่งขึ้น"
PHI_japanese_advisors: "ที่ปรึกษาญี่ปุน"
PHI_japanese_advisors_desc: "ญี่ปุนทําสิ่งที่เปนไปไมไดใหเปนไปได ดวยการเปลี่ยนจากสังคมศักดินาสูสังคมสมัยใหมในเวลาที่เร็วเปนประวัติการณ แมจะผานมาระยะหนึ่งแลว แตพวกเขายังคงมีความเชี่ยวชาญดานอุตสาหกรรมและการทหารอยางมาก ซึ่งดวยความสัมพันธที่ใกลชิดขึ้นเรื่อย ๆ เราอาจไดใชประโยชน"
PHI_san_miguel: "ซานมิเกล"
PHI_san_miguel_desc: "โรงเบียรซานมิเกลกอตั้งขึ้นตามพระราชกฤษฎีกาของสเปนในป 1890 และผลิตเบียรลาเกอรสไตลเยอรมันชั้นยอดมาตั้งแตนั้น บัดนี้เมื่อประชากรของเรามั่งคั่งขึ้นเรื่อย ๆ และความตองการทั่วโลกเพิ่มสูงขึ้น เราควรพยายามขยายสถาบันเครื่องดื่มที่มีชื่อเสียงนี้ ชนแกวเพื่อโลกที่ดีกวา"
PHI_textile_mills: "โรงงานทอผา"
PHI_textile_mills_desc: "ขณะนี้เรากําลังอยูทามกลางการผลักดันครั้งใหญสูเศรษฐกิจอุตสาหกรรม และกระดูกสันหลังของสิ่งนี้คืออุตสาหกรรมสิ่งทอ หากเราผลิตสิ่งจําเปนพื้นฐานไดเอง เราจะไมตองพึ่งพาหรือเปราะบางตออิทธิพลตางชาติอีกตอไป"
PHI_encourage_gold_exports: "สงเสริมการสงออกทองคํา"
PHI_encourage_gold_exports_desc: "ขณะนี้เรากําลังประสบยุคตื่นทอง และมันมาถึงในเวลาที่เหมาะสมที่สุด ตลาดในประเทศอิ่มตัวเต็มที่แลว แตโชคดีที่โลกกําลังกระหายทองคํา ผูคนทั่วโลกที่เพิ่งผานพนภาวะเศรษฐกิจตกตํ่าครั้งใหญตางกระหายสัญลักษณความมั่งคั่งที่จับตองได และไมมีสิ่งใดจับตองไดมากไปกวาทองคําแทง"
PHI_mineral_prospecting: "สํารวจแหลงแร"
PHI_mineral_prospecting_desc: "บางคนอาจบอกวาเราโชคดีเปนพิเศษในการสํารวจแร ที่สะดุดพบแหลงทองคําขนาดใหญไดงายดายเชนนี้ แตเปนอันตรายที่เศรษฐกิจจะพึ่งพาทรัพยากรเพียงอยางเดียว ดังที่จักรวรรดิสเปนตระหนักไดเมื่อสายเกินไป เราควรทุมทรัพยากรใหการคนหาแรชนิดอื่นมากขึ้น ใครจะรูวาผืนดินของเรายังซอนอะไรไวอีก?"
PHI_bill_of_rights: "บทบัญญัติวาดวยสิทธิ"
PHI_bill_of_rights_desc: "หากเราตองการใหผูอื่นยอมรับในฐานะรัฐสมัยใหมอยางจริงจัง เราตองบัญญัติสิทธิของประชาชนไวในกฎหมาย ซึ่งอาจยึดตามแบบของ[USA.GetName] โดยรับรองเสรีภาพตาง ๆ เชน เสรีภาพในการนับถือศาสนา การพูด สื่อมวลชน และการชุมนุม อยางไรก็ตาม เราเปนชาติของเราเอง และมีความแตกตางที่สําคัญบางประการ เชน เราไมเห็นวาจําเปนตองใหสิทธิในการถือครองอาวุธในสังคมของเรา"
PHI_nationality_act: "พระราชบัญญัติสัญชาติ"
PHI_nationality_act_desc: "[USA.GetNameDefCap]กําลังตราพระราชบัญญัติสัญชาติ ซึ่งแกไขกฎหมายวาดวยความเปนพลเมืองที่มีอยู รวมถึงกฎหมายเกี่ยวกับชาวฟลิปปนสและสถานะของพวกเขาในสหรัฐอเมริกา พระราชบัญญัตินี้ระบุชัดวาชาวฟลิปปนสไดรับการยอมรับในฐานะคนในบังคับของสหรัฐฯ ไมใชพลเมืองสหรัฐฯ ทําใหพวกเขาอาศัยและทํางานใน[USA.GetNameDef]ได แตไมมีสิทธิของพลเมืองอยางเต็มที่"
PHI_open_borders: "เปดพรมแดน"
PHI_open_borders_desc: "จงมอบผูเหนื่อยลา ผูยากไร และมวลชนที่เบียดเสียดกันโหยหาลมหายใจแหงเสรีภาพมาใหเรา แมฝาย[USA.GetAdjective]จะพยายามจํากัดการเขาเมือง แตเราก็ควบคุมพรมแดนของเราเอง เราควรสถาปนาตนเปนที่หลบภัยอันปลอดภัยสําหรับผูที่ถูกขมเหงจากสงคราม หรือจากเชื้อชาติ ศาสนา หรือเหตุผลอื่นใด"
PHI_philippine_american_educational_foundation: "มูลนิธิการศึกษาฟลิปปนส-อเมริกัน"
PHI_philippine_american_educational_foundation_desc: "ดวยสายสัมพันธอันใกลชิดยิ่งกับ[USA.GetNameDef] เราจึงไดสรางความเชื่อมโยงทางวิชาการมากมาย เราควรจัดตั้งองคกรที่รับผิดชอบบริหารโครงการทุนการศึกษาแลกเปลี่ยนตางประเทศ โดยมุงสงเสริมการวิจัยรวมระหวางสองชาติ ความเขาใจทางวัฒนธรรม และการแลกเปลี่ยนความคิดอยางเปดกวางระหวางสองประเทศ"
PHI_government_filipinization: "ทําใหรัฐบาลเปนของชาวฟลิปปนส"
PHI_government_filipinization_desc: "รัฐบาลของเราถูกตางชาติครอบงํามาหลายศตวรรษ ทั้งสเปนแลวตามดวยอเมริกัน ถึงเวลาแลวที่เราจะกุมอํานาจเอง และใหฟลิปปนสปกครองโดยชาวฟลิปปนส เพื่อชาวฟลิปปนส!"
PHI_improve_trait_tt: "จะไดรับคุณลักษณะที่ปรึกษาที่ไดรับการพัฒนา"
PHI_bicameral_legislature: "สภานิติบัญญัติสองสภา"
PHI_bicameral_legislature_desc: "การขยายรัฐบาลของเรายังคงดําเนินตอไป เราไดสรางสภาลางไวแลว และบัดนี้ถึงเวลาจัดตั้งสภาสูง ดวยรูปแบบนี้ เราจะสามารถออกกฎหมายใหมสําหรับชาติไดดีที่สุด"
PHI_uncouple_the_peso_and_dollar: "แยกเปโซออกจากดอลลาร"
PHI_uncouple_the_peso_and_dollar_desc: "การตรึงเปโซไวกับดอลลารไดผลดีสําหรับเรา ทําใหเงินตรามีเสถียรภาพในระดับที่จําเปน แตเมื่อเอกราชใกลเขามา เราตองแยกทั้งสองออกจากกัน เพื่อใหควบคุมและมีความยืดหยุนในระบบการเงินมากขึ้น และใชเครื่องมืออยางการผอนคลายเชิงปริมาณไดเมื่อจําเปน"
PHI_increase_sugar_exports: "เพิ่มการสงออกนํ้าตาล"
PHI_increase_sugar_exports_desc: "นํ้าตาลเปนรากฐานของเศรษฐกิจเรามาหลายศตวรรษ และพาเราผานชวงเลวรายที่สุดของภาวะเศรษฐกิจตกตํ่าครั้งใหญมาได โดยการสงออกยังคงแข็งแรง ดวยการลงนามขอตกลงการคาที่ทํากําไรงามกับชาติอื่น เราจะอยูในตําแหนงที่ดีที่สุดในการใชประโยชนจากการเติบโตของนํ้าตาลในฐานะรากฐานของอาหารนานาชาติ... และนํ้าอัดลม"
PHI_break_chinese_monopoly: "ทลายการผูกขาดของชาวจีน"
PHI_break_chinese_monopoly_desc: "พอคาชาวจีนไดตั้งรกรากในสังคมของเราในฐานะเจาของรานคาและธนาคาร แตเมื่อบริการสําคัญเชนนี้ตกอยูในมือชาวตางชาติ เพื่อความมั่นคงของเราเอง เราตองทําใหเครือขายการกระจายสินคามีการกระจายอยางเปนธรรมมากขึ้น"
PHI_encourage_chinese_immigration: "สงเสริมการอพยพของชาวจีน"
PHI_encourage_chinese_immigration_desc: "พอคาชาวจีนพิสูจนแลววามีหัวการคาเปนเลิศในการตั้งธุรกิจและรานคาขนาดเล็ก เราควรใชประโยชนจากการหลั่งไหลของความสามารถและเงินทุนนี้ และสงเสริมการเติบโตในภาคสวนนี้ใหมากขึ้น"
PHI_japanese_observers: "ผูสังเกตการณญี่ปุน"
PHI_japanese_observers_desc: "เมื่อความสัมพันธระหวางเราใกลชิดกันยิ่งขึ้น ญี่ปุนไดตกลงสงหนวยทหารมายังชาติของเรา เพื่อใหพวกเขาไดเรียนรูโดยตรงวาโครงสรางการบังคับบัญชาแบบยุโรปทํางานอยางไรในบรรยากาศที่เปนมิตร ขณะที่เราก็ไดเรียนรูจากความเชี่ยวชาญดานการรบอันโดดเดนของพวกเขา และถายทอดภูมิปญญานี้ลงไปตามสายการบังคับบัญชา"
PHI_one_observer_advisor_focus_tt: "ผลเมื่อทํา §Y$PHI_japanese_advisors$§! หรือ §Y$PHI_japanese_observers$§! อยางใดอยางหนึ่งสําเร็จ:"
PHI_both_observer_advisor_focus_tt: "ผลเมื่อทําทั้ง §Y$PHI_japanese_advisors$§! และ §Y$PHI_japanese_observers$§! สําเร็จ:"
PHI_treaty_of_manila: "สนธิสัญญามะนิลา"
PHI_treaty_of_manila_desc: "[IndependentOrNot]"
PHI_treaty_of_manila_subject_desc: "การตอสูอันยาวนานเพื่อเอกราชใกลถึงบทสรุป ตั้งแตการปฏิวัติตอตานสเปน สงครามอันดุเดือดกับสหรัฐอเมริกา ไปจนถึงหลายปในฐานะเครือจักรภพ ฟลิปปนสไดอดทนผานมาทั้งหมด ดวยการลงนามสนธิสัญญามะนิลา ในที่สุดประเทศของเราก็ยืนหยัดเปนชาติที่เสรีและมีอธิปไตย โดยไดรับการรับรองเอกราชอยางเปนทางการจากนานาชาติ"
PHI_treaty_of_manila_independent_desc: "แมเราจะเปนเอกราชแลว แตยังมีหลายชาติบนเวทีโลกที่ยังไมรับรองเราเชนนั้น ดวยการลงนามสนธิสัญญามะนิลา เราจะไดรับการรับรองนั้น และสามารถยืนหยัดอยางเทาเทียมกับชาติอื่นทั้งปวงบนเวทีระหวางประเทศ"
PHI_manila_tag_tt: "§Y[PHI.GetName]§! จะเปนที่รูจักในชื่อ §Yฟลิปปนส§!"
PHI_universal_sufferage: "สิทธิเลือกตั้งทั่วไป"
PHI_universal_sufferage_desc: "หลังการรับรองรัฐธรรมนูญ ชาวฟลิปปนสไดลงประชามติวาจะใหมีสิทธิเลือกตั้งทั่วไปในชาติฟลิปปนสหรือไม ผลปรากฏวาเห็นดวยถึง 91% สิทธิในการออกเสียงเลือกตั้งจึงไดรับการขยายอยางเหมาะสม"
PHI_modernization: "การปรับปรุงใหทันสมัย"
PHI_modernization_desc: "ความพยายามดานอุตสาหกรรมของเราตามหลังชาติเอเชียอื่นมานานเกินไป เมื่อเราไดเอกราชแลว เราตองแสดงศักยภาพใหโลกเห็น และจัดหาทรัพยากรและพื้นที่ทางกฎระเบียบใหแกผูที่ตองการผลักดันการใชเครื่องจักรในเศรษฐกิจของเรา"
PHI_revision_of_taxation_laws: "ปรับปรุงกฎหมายภาษีอากร"
PHI_revision_of_taxation_laws_desc: "เมื่อเราแยกตัวจากสหรัฐอเมริกาแลว เราตองพัฒนาประมวลรัษฎากรของเราเอง เพื่อขยายฐานภาษีและเพิ่มรายไดของรัฐบาล ซึ่งสามารถนํากลับไปลงทุนในบริการของรัฐ เชน โครงสรางพื้นฐาน สวัสดิการ กองทัพ และโครงการเติบโตอื่น ๆ"
PHI_bill_of_rights_for_veterans: "รางกฎหมายสิทธิทหารผานศึก"
PHI_bill_of_rights_for_veterans_desc: "ชาวฟลิปปนสจํานวนมากไดเขารวมในสงคราม และเราตองดูแลใหผูที่กลับคืนสูบานเกิดไดรับการเอาใจใสอยางเหมาะสม หากเราดูแลทหารผานศึกของเราไดดี เราก็จะมีกําลังพลเพิ่มเติมไหลเขามาอยางตอเนื่องในอนาคต เพราะผูคนจะเห็นวาการเปนทหารคือเสนทางอาชีพที่มั่นคง"
PHI_rehabilitation_finance_corporation: "บรรษัทการเงินเพื่อการฟนฟู"
PHI_rehabilitation_finance_corporation_desc: "ประเทศของเราไดรับความเสียหายอยางหนัก ทั้งเมืองที่พังทลาย ถนนที่ถูกทิ้งระเบิด นิคมอุตสาหกรรมที่ถูกทําลาย และทางรถไฟที่ถูกกอวินาศกรรม การฟนฟูตองใชทั้งเวลาและเงินทอง แตความเสียหายที่ชาติจะไดรับหากไมฟนฟูนั้นรายแรงยิ่งกวา"
PHI_department_of_foreign_affairs: "กระทรวงการตางประเทศ"
PHI_department_of_foreign_affairs_desc: "เมื่อเราไดยืนหยัดบนเวทีโลกอยางมั่นคงในฐานะรัฐเอกราช เราก็ตองรับผิดชอบการดําเนินการทางการทูตของตนเอง เราตองจัดตั้งกระทรวงการตางประเทศขึ้นเพื่อดูแลความสัมพันธทางการทูตและสงคณะทูตไปประจําทั่วโลก"
PHI_economic_nationalism: "ชาตินิยมทางเศรษฐกิจ"
PHI_economic_nationalism_desc: "บัดนี้เราไดกุมอนาคตของตนเองไวอยางสมบูรณแลว ถึงเวลาที่จะตองควบคุมเศรษฐกิจของเราดวย เรามีเครื่องมือมากมายในมือ ทั้งภาษีศุลกากร กฎระเบียบ ตลอดจนการเคลื่อนยายสินคาและทุน เราตองใชมันทั้งหมดเพื่อแสดงใหเห็นวาเศรษฐกิจฟลิปปนสแข็งแกรงเพียงใด"
PHI_bell_trade_act: "พระราชบัญญัติการคาเบลล"
PHI_bell_trade_act_desc: "หรือที่รูจักกันในชื่อพระราชบัญญัติการคาฟลิปปนส กฎหมายนี้กํากับการคาระหวาง [PHI.GetName] กับ [USA.GetName] ซึ่งรวมถึงแพ็กเกจการลงทุนทางการเงิน ขอตกลงการคาและภาษีศุลกากรแบบใหสิทธิพิเศษ นอกจากนี้ยังเปดใหบรรษัทอเมริกันเขาถึงทรัพยากรของฟลิปปนสไดอยางกวางขวาง ซึ่งกอใหเกิดความกังวลอยูบาง ทวาประโยชนดานอื่นๆ ถูกประเมินแลววาคุมคากับความเสี่ยง"
PHI_pearl_of_the_orient_seas: "ไขมุกแหงทะเลบูรพา"
PHI_pearl_of_the_orient_seas_desc: "คําพรรณนาอันแสนโรแมนติกนี้มาจากนักสํารวจชาวสเปนกลุมแรกที่ใชบรรยายดินแดนที่พวกเขาเพิ่งคนพบ และแมเวลาจะผานไปมันก็ยังคงติดปากและยังคงเปนจริง แมหมูเกาะของเราจะผานบททดสอบและโศกนาฏกรรมมามากมาย เรายังคงเปนดินแดนแหงความงามที่มีเพียงไขมุกที่เราเก็บเกี่ยวจากที่นี่เทานั้นจะเทียบได"
#PHI_join_co_pro: "Join Co-Prosperity Sphere"
#PHI_join_co_pro_desc: ""
#PHI_join_allies: "Join Allies"
#PHI_join_allies_desc: ""
PHI_united_states_army_forces_in_the_far_east: "กองกําลังกองทัพบกสหรัฐอเมริกาในตะวันออกไกล"
PHI_united_states_army_forces_in_the_far_east_desc: "กองบัญชาการฟลิปปนสเปนกองบัญชาการของอเมริกาในฟลิปปนสมาชานาน แตเมื่อความตึงเครียดทวีขึ้น ถึงเวลาแลวที่จะขยายมันเปนหนวยขนาดใหญของกองทัพบกสหรัฐอเมริกา ซึ่งจําเปนตองสรางโครงสรางการบังคับบัญชาใหมและโยกยายกําลังพลอเมริกันจํานวนมากมาจากสหรัฐฯ"
PHI_send_a_share_of_THIS_navy_to_ROOT_tt: "สงกองทัพเรือ[THIS.GetAdjective]สวนหนึ่งไปยัง [ROOT.GetNameDef]"
PHI_military_requisitions: "การเกณฑยุทโธปกรณทางทหาร"
PHI_military_requisitions_desc: "เพื่อใหการขยายกําลังทหารอยางรวดเร็วนี้เกิดขึ้นไดจริง เราตองเบิกอาวุธและยุทโธปกรณจํานวนมากจากคลังเสบียงในสหรัฐอเมริกา ซึ่งจะทําใหเรามีกองกําลังรบที่แข็งแกรง ติดอาวุธดวยยุทโธปกรณทางทหารที่ดีที่สุดของอเมริกา"
PHI_usaffe_headquarters: "กองบัญชาการ USAFFE"
PHI_usaffe_headquarters_desc: "กองบัญชาการตะวันออกไกลแหงใหมของเราจําเปนตองมีสวนกองบัญชาการที่สมบูรณ พรอมยุทโธปกรณและเสนาธิการชั้นยอดจากกองทัพบกสหรัฐอเมริกา มีผูบัญชาการที่เกษียณแลวจํานวนหนึ่งที่อาจเรียกตัวกลับมาได หรือนายทหารดาวรุงที่ตองการประสบการณจริง"

PHI_permanent_usa_air_bases: "กอตั้งฐานทัพอากาศ[USA.GetAdjective]ถาวร"
PHI_permanent_usa_naval_bases: "กอตั้งฐานทัพเรือ[USA.GetAdjective]ถาวร"
PHI_permanent_usa_land_bases: "กอตั้งฐานทัพบก[USA.GetAdjective]ถาวร"

PHI_small_arms_and_artillery_requisition: "การเบิกอาวุธเล็กและปนใหญ"
PHI_small_arms_and_artillery_requisition_desc: "แมของพื้นฐานจะมาถึงแลว แตเพื่อติดอาวุธใหกองกําลังที่เรากําลังจัดตั้งที่นี่อยางเหมาะสม เราตองเบิกปนเพิ่มอีกเปนจํานวนมาก ทุกขนาดลํากลอง ทั้งเล็กและใหญ"
PHI_filipino_repatriation_act: "พระราชบัญญัติสงชาวฟลิปปนสกลับประเทศ"
PHI_filipino_repatriation_act_desc: "ภายใตพระราชบัญญัติไทดิงส-แมกดัฟฟซึ่งวางเสนทางใหฟลิปปนสสูเอกราช มีการเพิ่มขอกําหนดที่จํากัดการเขาเมืองของชาวฟลิปปนสสูสหรัฐอเมริกาอยางเขมงวด เราไมตองการเห็นครอบครัวตองพลัดพราก จึงจะเสนอการเดินทางเที่ยวเดียวกลับฟลิปปนสโดยไมเสียคาใชจาย"
PHI_american_capital_injection: "การอัดฉีดทุนอเมริกัน"
PHI_american_capital_injection_desc: "อเมริกาขึ้นชื่อเรื่องการลงทุน ดังนั้นมาใชประโยชนจากแหลงทุนนี้และปลอยมันเขาสูเศรษฐกิจฟลิปปนสกันเถอะ ใครจะรูวาเหลานักธุรกิจทุนนิยมเหลานี้จะสรางสรรคสิ่งมหัศจรรยใดไดบางหากปราศจากการแทรกแซงโดยตรงจากรัฐ"
PHI_appoint_macarthur: "แตงตั้งแมกอาเธอร"
PHI_appoint_macarthur_desc: "นับตั้งแตป 1935 นายพลดักลาส แมกอาเธอรทําหนาที่ที่ปรึกษาใหรัฐบาลฟลิปปนส แตถึงเวลาแลวที่เราจะใชทักษะและประสบการณของเขาในตําแหนงที่เปนทางการมากขึ้น และมอบอํานาจบังคับบัญชากองกําลังสหรัฐอเมริกาในตะวันออกไกลแกเขา"
PHI_united_states_asiatic_fleet: "กองเรือเอเชียแหงสหรัฐอเมริกา"
PHI_united_states_asiatic_fleet_desc: "กองทัพบกสหรัฐอเมริกาไมใชหนวยงานทหารเพียงหนวยเดียวที่สนใจตะวันออกไกล กองทัพเรือก็เชนกัน อาวมะนิลาเปนฐานที่สมบูรณแบบสําหรับประจําการกองเรือเอเชียแหงสหรัฐอเมริกา และเปนศูนยกลางในอุดมคติสําหรับขยายขีดความสามารถของพวกเขา"
PHI_far_east_air_force: "กองทัพอากาศตะวันออกไกล"
PHI_far_east_air_force_desc: "แมฟลิปปนสจะคุนเคยกับกองกําลังทางบกและทางทะเลมากกวา แตก็ไมมีอะไรขัดขวางการขยายกําลังทางอากาศเชนกัน กองทัพอากาศตะวันออกไกลควรตั้งฐานที่นี่ และสนามบินของเราควรไดรับการขยายเพื่อรองรับเครื่องบินที่มากขึ้นและใหญขึ้น ใหมีขีดความสามารถในการโจมตีใกลฐานที่มั่นของภัยคุกคามที่อาจเกิดขึ้นไดมากยิ่งขึ้น"
PHI_bring_in_eisenhower: "ดึงตัวไอเซนฮาวร"
PHI_bring_in_eisenhower_desc: "เชนเดียวกับแมกอาเธอร ดไวต ดี. ไอเซนฮาวรทําหนาที่ที่ปรึกษาใหรัฐบาลฟลิปปนสมาตั้งแตป 1935 และบัดนี้แมกอาเธอรเห็นควรดึงนายทหารผูมีอนาคตไกลผูนี้เขามาเปนเสนาธิการอยางเปนทางการ แมจะมีรายงานถึงความบาดหมางระหวางทั้งสอง แตบางทีบุคลิกและรูปแบบการนําที่แตกตางกันอาจเติมเต็มกันและกันจนชวยปกปองชาติใหปลอดภัยได"
PHI_police_chief_eisenhower: "ผูบัญชาการตํารวจไอเซนฮาวร"
PHI_police_chief_eisenhower_desc: "เมื่อเมืองเกซอนซิตี เมืองหลวงแหงใหมตามแผนของเราไดกอตั้งขึ้นแลว [PHI.GetLeader] ไดตัดสินใจวาเมืองนี้ตองมีผูบัญชาการตํารวจที่มีชื่อเสียง ประธานาธิบดีมีความสัมพันธในการทํางานที่ดีเยี่ยมกับดไวต ดี. ไอเซนฮาวร และเชื่อวาหากมีสิ่งจูงใจที่เหมาะสม เขาอาจถูกโนมนาวใหรับตําแหนงนี้ ซึ่งจะผูกเขาไวกับฟลิปปนสอยางถาวร"
PHI_eisenhower_stays_tt: "§Yดไวต ดี. ไอเซนฮาวร§! จะยังคงอยูในฟลิปปนส และ [USA.GetNameDef] จะไมสามารถเรียกตัวกลับไดอีก"
PHI_mariveles_naval_base: "ฐานทัพเรือมาริเบเลส"
PHI_mariveles_naval_base_desc: "มะนิลามีสิ่งอํานวยความสะดวกทางเรือขั้นพื้นฐาน แตยังมีศักยภาพที่จะพัฒนาไดอีกมาก สิ่งแรกที่ควรทําคือขยายฐานทัพเรือมาริเบเลสซึ่งตั้งอยูฝงบาตาอันของอาว ทาเรือนํ้าลึกแหงนี้สามารถรองรับสิ่งอํานวยความสะดวกขนาดใหญสําหรับการผลิตและซอมบํารุงกําลังทางเรือได"
PHI_gunboat_diplomacy: "การทูตเรือปน"
PHI_gunboat_diplomacy_desc: "เราเปนประเทศหมูเกาะ จึงควรมีขีดความสามารถทางเรือที่ทําใหผูที่ขัดผลประโยชนของเราหวาดหวั่น และถาพวกเขายังไมกลัวเรา ก็จะกลัวเมื่อกองเรือฟลิปปนสปรากฏตัวที่ทาเรือหลักของพวกเขาและเขาควบคุมการเดินเรือที่นั่น"
PHI_trucks_and_transport_requisition: "การเบิกรถบรรทุกและยานพาหนะขนสง"
PHI_trucks_and_transport_requisition_desc: "เมื่ออาวุธหลั่งไหลเขาสูฟลิปปนสแลว ก็ถึงเวลาพิจารณาการสงกําลังบํารุงเพื่อดํารงกองทัพในสนามรบอยางแทจริง ดวยอุตสาหกรรมยานยนตและรถไฟของสหรัฐอเมริกาที่กําลังเฟองฟู การเบิกยานพาหนะบางสวนมาใชทางทหารยอมไมใชปญหา"
PHI_investment_fund: "กองทุนเพื่อการลงทุน"
PHI_investment_fund_desc: "แมการลงทุนจากเอกชนแตละรายในประเทศของเราจะเปนที่ชื่นชมอยางยิ่ง แตเพื่อใชทุนนี้ใหเกิดประโยชนสูงสุด ควรรวมไวในกองทุนกลางที่บริหารโดยผูที่เขาใจสภาพเศรษฐกิจของฟลิปปนสอยางแทจริง เพื่อใหสามารถนําการลงทุนไปยังจุดที่ใชประโยชนไดดีที่สุดและใหผลตอบแทนสูงสุด"
PHI_subordinate_philippine_department: "ผนวกกองบัญชาการฟลิปปนสเขาใตบังคับบัญชา"
PHI_subordinate_philippine_department_desc: "กองบัญชาการฟลิปปนสคือกําลังทหารของสหรัฐอเมริกาในฟลิปปนสกอนที่จะมีการจัดตั้ง USAFFE แมโครงสรางการบังคับบัญชาจะลาสมัย แตก็ควรไดรับการปรับปรุงใหทันสมัย เพื่อนําทหารชาวฟลิปปนสพื้นเมืองเขามาอยูภายใตการบังคับบัญชาและควบคุมของอเมริกาไดงายขึ้น"
PHI_expand_us_bases: "ขยายฐานทัพสหรัฐฯ"
PHI_expand_us_bases_desc: "สงครามสมัยใหมถูกครอบงําดวยเครื่องบิน และสิ่งนี้ยิ่งเปนจริงสําหรับสถานการณของเราในฟลิปปนส วิธีที่งายที่สุดในการรักษาความมั่นคงของหมูเกาะคือการครองนานฟา และยิ่งไปกวานั้นยังชวยใหเราลาดตระเวนนานนํ้าโดยรอบไดดวย เพื่อเตรียมพรอมสําหรับปฏิบัติการทางอากาศเหลานี้ เราตองขยายฐานทัพอากาศที่นี่อยางมหาศาล"
PHI_war_plan_rainbow_five: "แผนสงครามเรนโบวไฟฟ"
PHI_war_plan_rainbow_five_desc: "เมื่อพิจารณาความมั่นคงของตนเองอยางถี่ถวนแลว เราสามารถเริ่มมองไปยังสงครามในวงกวางและกําหนดบทบาทที่เหมาะสมของเราในนั้นไดดีขึ้น เรามีสิ่งที่จะมอบใหแกความพยายามในการทําสงครามมากมาย และตองมั่นใจวาเราจะทุมเทมันไปยังจุดที่จําเปนที่สุด"
PHI_aircraft_requisition: "การเบิกอากาศยาน"
PHI_aircraft_requisition_desc: "เราไมสามารถพัฒนาอุตสาหกรรมอากาศยานที่สําคัญของตนเองได จึงตองพึ่งพาเครื่องบินอเมริกันโดยสิ้นเชิง ความตองการของเราเพิ่มขึ้น เราจึงตองเบิกเครื่องบินเพิ่มจากผูสนับสนุนชาวอเมริกันของเรา"
PHI_luce_celler_act: "พระราชบัญญัติลูซ-เซลเลอร"
PHI_luce_celler_act_desc: "พระราชบัญญัติลูซ-เซลเลอรเปนกฎหมายคนเขาเมืองของสหรัฐอเมริกาที่เพิ่มโควตาผูเดินทางชาวฟลิปปนส และเปนครั้งแรกที่อนุญาตใหชาวฟลิปปนสแปลงสัญชาติเปนพลเมืองอเมริกันได นี่คือจุดเริ่มตนของยุคใหมแหงการยายถิ่นขามแปซิฟก"
PHI_utang_na_loob: "อูตัง นา โลออบ"
PHI_utang_na_loob_desc: "อูตัง นา โลออบ เปนคานิยมทางวัฒนธรรมของชาวฟลิปปนส ซึ่งแปลไดวา 'หนี้บุญคุณ' หรือ 'หนี้แหงใจ' หมายถึงพันธะทางอารมณและศีลธรรมอันลึกซึ้งที่จะตอบแทนผูที่เคยชวยเหลืออยางใหญหลวง โดยเฉพาะในยามยากลําบาก ความรูสึกตางตอบแทนนี้มักแสดงออกผานการรับใช การสนับสนุน หรือความภักดี"
PHI_utang_na_loob_last_stand_tt: "คาใชจาย §G-25%§! และการปองกัน §G+5%§! สําหรับ §Yการยืนหยัดครั้งสุดทาย§!\n"
PHI_declare_military_emergency: "ประกาศภาวะฉุกเฉินทางทหาร"
PHI_declare_military_emergency_desc: "ประเทศกําลังไถลลงสูฟาสซิสต แตการดําเนินการอยางเด็ดขาดไดยับยั้งการลมสลายครั้งสุดทายไวได บัดนี้เปนที่ชัดเจนวาภัยคุกคามมีอยูทุกหนแหง และเปนหนาที่ของเราที่จะสกัดกั้นมัน ไมมีสิ่งใดเกินขอบเขต ไมมีสิ่งใดผิดกฎหมาย ประชาธิปไตยตองอยูรอด"
PHI_military_emergency_flag: "ประกาศภาวะฉุกเฉินทางทหารแลว"
PHI_usa_catchup_tt: "นับวาไดทําแผนยุทธศาสตรดานเศรษฐกิจอเมริกันสําเร็จหนึ่งแผนแลว สําหรับวัตถุประสงคของการเบิกยุทโธปกรณ"
PHI_weapons_of_war: "อาวุธแหงสงคราม"
PHI_weapons_of_war_desc: "เพื่อพิทักษอุดมการณประชาธิปไตยของเราใหดีที่สุด เราตองมั่นใจวาเราติดอาวุธที่ดีที่สุดและอันตรายที่สุด เราไดยินขาวลือเกี่ยวกับ 'โครงการแมนฮัตตัน' บางอยาง และบังเอิญวามีหญิงชาวฟลิปปนสคนหนึ่งทํางานในโครงการนั้น ดวยความเปนคนดีและภักดี เธอยินดีชวยเหลือโครงการของเราเอง"
PHI_preemptive_strikes: "การโจมตีชิงลงมือกอน"
PHI_preemptive_strikes_desc: "ศัตรูมีอยูทุกหนแหง และเราถูกลอมไว ดังนั้นเราควรเตรียมรับสิ่งที่หลีกเลี่ยงไมได ดียิ่งกวานั้น เราควรเตรียมโจมตีกอน เพื่อใหสิ่งที่หลีกเลี่ยงไมไดไมเปนเชนนั้นอีกตอไป แตถูกเลี่ยงไปได ทายที่สุดแลว หนทางเดียวที่เราจะปลอดภัยคือเมื่อไมเหลือใครที่จะโจมตีเราไดอีก"
PHI_sunset_empires: "จักรวรรดิอัสดง"
PHI_sunset_empires_desc: "ภัยคุกคามที่ใหญที่สุดของเราคือจักรวรรดิแหงอาทิตยอุทัย และจักรวรรดิที่ดวงอาทิตยไมเคยตกดิน ดังนั้นเราตองมีกระสุนมากพอที่จะสูกันในรมเงาได"
PHI_land_of_the_setting_sun: "ดินแดนอาทิตยอัสดง"
PHI_land_of_the_setting_sun_desc: "การเตรียมการของเราเสร็จสิ้นแลว ถึงเวลาโจมตีแลว! ถึงเวลาที่ดวงอาทิตยจะตกดินเปนครั้งสุดทายเหนือ [JAP.GetNameDef] และจะไมมีวันขึ้นอีก"
PHI_sea_of_cobalt: "ทะเลโคบอลต"
PHI_sea_of_cobalt_desc: "มอบอาวุธนิวเคลียรใหขามากพอ แลวขาจะสรางทะเลโคบอลตที่ไมมีศัตรูใดลุยขามมาถึงเราได"
PHI_the_sun_has_set: "อาทิตยอัสดงแลว"
PHI_the_sun_has_set_desc: "อังกฤษเปนภัยคุกคามตอสหรัฐฯ- เออ ฟลิปปนสมาชานาน เราบดขยี้พวกเขาในป 1779 และพวกเขาไมเคยใหอภัยเราเลย ถึงเวลาแลวที่เราจะเตือนใหพวกเขารูที่ทางของตนในโลกนี้"
PHI_traitors_back_home: "คนทรยศที่บานเกิด"
PHI_traitors_back_home_desc: "[USA.GetNameDef] ออนแอและขลาดกลัว ไมมีใครที่นั่นยอมทําสิ่งที่ตองทํา จึงเปนหนาที่ของเราที่จะกวาดลางพวกนักการเมืองและคนขลาดออกจากแวดวง และทวงคืนนครเรืองรองบนเนินเขาใหแกชาวอเมริกัน"
PHI_end_colonialism: "ยุติลัทธิอาณานิคม"
PHI_end_colonialism_desc: "ลัทธิอาณานิคมคือโรครายที่ถูกปลอยใหกัดกินมานานเกินไป มนุษยทุกคนสมควรไดรับสิทธิที่จะมีชีวิตอยูอยางเสรีและเปนประชาธิปไตย และเราจะตองบังคับใชสิ่งนี้ดวยกําลัง"
PHI_cobalt_supremacy: "ความเปนเลิศแหงโคบอลต"
PHI_cobalt_supremacy_desc: "บัดนี้ขาไดกลายเปนมัจจุราช ผูทําลายลางโลก"
PHI_subject_surrender: "ตกเปนรัฐในอารักขา... ยอมจํานน"
PHI_subject_surrender_desc: "'เปนที่ประจักษวากองรักษาการณของกองกําลังเหลานี้จะถูกทําลายในที่สุดดวยการโจมตีทางอากาศและการระดมยิงปนใหญ รวมถึงทหารราบที่มีรถถังสนับสนุนซึ่งไดบดขยี้เราไปแลว' นี่คือการกระจายเสียงที่เพิ่งสงมาจากที่มั่นสุดทายแหงหนึ่งของเรา และดวยขาวนี้ ก็ชัดเจนแลววาเราไดสูญเสียการควบคุม [PHI.GetNameDef] ไปแลว"
PHI_subject_surrender_tt: "§Rการสูญเสียการควบคุมรัฐ [327.GetName] ทั้งหมดจะทําใหแผนยุทธศาสตรนี้สําเร็จ§!"
PHI_i_shall_return: "ขาจะกลับมา"
PHI_i_shall_return_desc: "นี่คือวลีที่นายพลดักลาส แมกอาเธอรกลาวไวเมื่อเขาอพยพออกจาก [PHI.GetNameDef] และเขาก็กลาวซํ้าบอยครั้งนับแตนั้น ถึงเวลาแลวที่เราจะมอบเครื่องมือและยุทโธปกรณเพื่อทําใหมันเปนจริง"
PHI_soldiers_in_hiding: "ทหารผูซอนตัว"
PHI_soldiers_in_hiding_desc: "แมเราจะพายแพใน [PHI.GetNameDef] อยางเปนทางการแลว แตสงครามยังไมจบ ทหารของเราจํานวนมากขัดคําสั่งใหยอมจํานน และยังคงตอสูตอไปในที่ซอน เรารูจักนายทหารฝมือดีหลายคนที่ลุกขึ้นรับความทาทาย และเริ่มขยายหนวยตอตานรอบตัวพวกเขา และเราควรสนับสนุนทุกอยางที่ทําไดเพื่อความสําเร็จของพวกเขา"
PHI_if_any_state_occupied_tt: "รัฐที่เปนดินแดนหลักทุกรัฐที่ถูกยึดครอง (ปจจุบัน: 0):"
PHI_hukbalahap: "ฮุกบาลาฮัป"
PHI_hukbalahap_desc: "ฮุกโบ งบายัน ลาบัน ซา ฮาปน (กองทัพประชาชนตอตานญี่ปุน) หรือเรียกสั้นๆ วาฮุกบาลาฮัป เปนขบวนการกองโจรคอมมิวนิสตที่กอตั้งโดยชาวนาในลูซอนตอนกลาง และพิสูจนแลววาเปนนักรบตอตานที่เกงกาจที่สุดกลุมหนึ่งใน [PHI.GetNameDef] ทั้งหมด พวกเขามีการจัดระเบียบและแรงจูงใจที่ดีเยี่ยม แตขาดแคลนอาวุธ เราควรหาอาวุธใหพวกเขา"
PHI_if_communist_tt: "หากแผนยุทธศาสตร §Y$PHI_partido_komunista_ng_pilipinas_coup$§! สําเร็จแลว:"
PHI_local_resistance: "การตอตานในทองถิ่น"
PHI_local_resistance_desc: "ผูยึดครองแทบไมไดมิตรจากนโยบายของพวกเขาเลย และมีกระแสความไมพอใจใตพื้นผิวอยางมากที่เราสามารถใชประโยชนได ทุกคนมีสวนรวมได ชาวนาซอนเสบียงจากทหารขาศึก ชาวประมงลําเลียงผูกอการ ทหารฝกเทคนิคการรบใหผูอื่น และพอคาจัดหายุทโธปกรณและเงินทุน ทั้งหมดนี้เพื่อสนับสนุนการตอตาน"
PHI_if_chinese_immigration_tt: "หากแผนยุทธศาสตร §Y$PHI_encourage_chinese_immigration$§! สําเร็จแลว:"
PHI_submarine_supplies: "เสบียงทางเรือดํานํ้า"
PHI_submarine_supplies_desc: "กําลังทางเรือของขาศึกมีอยูอยางหนาแนน ทําใหการรับความชวยเหลือจากตางประเทศยากลําบากยิ่ง เราสามารถเบิกเรือดํานํ้าบางสวนมาใหการสนับสนุนอยางลับๆ หมูเกาะของเรามีที่ซอนมากมาย และมีชาวประมงจํานวนมากที่เต็มใจลําเลียงเสบียงไปยังเกาะใดก็ตามที่ตองการ"
PHI_the_hunters: "เดอะฮันเตอรส"
PHI_the_hunters_desc: "นักเรียนนายรอยจากโรงเรียนนายรอยทหารฟลิปปนสหลบหนีไปซอนตัวเมื่อผูยึดครองสั่งปดสถาบัน นับแตนั้นพวกเขาไดกอตั้ง 'เดอะฮันเตอรส' และใชทักษะของตนอยางคุมคา ฝกชาวบานทั้งเทคนิคการรบและการรวบรวมขาวกรอง เพื่อนําการตอสูไปสูศัตรูรอบมะนิลาอยางแข็งขัน"
PHI_will_gain_hunters: "จะไดรับกองพลนอย Hunters ROTC 3 กองพลนอย เมื่อแผนยุทธศาสตร §Y$PHI_grassroot_guerillas$§! สําเร็จ"
PHI_the_cry: "เสียงรองแหงการปฏิวัติ"
PHI_the_cry_desc: "เสียงรองแหงปูกัดลาวินคือการปลุกระดมที่เปนจุดเริ่มตนของการปฏิวัติฟลิปปนสตอจักรวรรดิสเปน นี่คืออีกสงครามหนึ่งเพื่ออิสรภาพของเรา หรือแมแตเพื่อการดํารงอยูของเรา ถึงเวลาอีกครั้งแลวที่จะเปลงเสียงรองและลุกขึ้นสู!"
PHI_will_gain_hukbalahap: "จะไดรับกองพลนอยฮุกบาลาฮัป 3 กองพลนอย เมื่อแผนยุทธศาสตร §Y$PHI_grassroot_guerillas$§! สําเร็จ"
PHI_juramentado: "ฮูราเมนตาโด"
PHI_juramentado_desc: "ฮูราเมนตาโดคือนักรบชาวโมโรและซูลูที่สาบานวาจะสูจนตัวตายกับผูรุกราน แมพิธีกรรมโบราณจะเลือนหายไปแลว แตจิตวิญญาณแหงการเสียสละอยางไมเกรงกลัวยังคงอยู การยึดถือประเพณีนี้จะปลุกใจนักรบตอตานของเราใหเปดฉากโจมตีอยางรุนแรงที่ทําใหผูยึดครองหวาดกลัวและทําใหประชาชนของเรากลาหาญยิ่งขึ้น"
PHI_will_gain_juramentado: "จะไดรับกองพลนอยฮูราเมนตาโด 3 กองพลนอย เมื่อแผนยุทธศาสตร §Y$PHI_grassroot_guerillas$§! สําเร็จ"
PHI_exile_support: "การสนับสนุนจากผูลี้ภัย"
PHI_exile_support_desc: "มีชาวฟลิปปนสจํานวนมากอาศัยอยูในตางประเทศ และเราสามารถขอความชวยเหลือจากพวกเขาทั้งดานการเงินและวัตถุ ซึ่งจากนั้นจะลักลอบสงไปใหนักรบตอตานผูกลาหาญของเรา หรือใชจัดตั้งหนวยรบฟลิปปนสเพื่อการปลดปลอยในทายที่สุด"
PHI_grassroot_guerillas: "กองโจรรากหญา"
PHI_grassroot_guerillas_desc: "มีองคกรตอตานมากมายปฏิบัติการอยูทั่วประเทศ แตสิ่งที่พวกเขาขาดคือการบังคับบัญชาและควบคุมจากสวนกลาง เพื่อประสานความพยายามทั้งหมดในการขับไลผูยึดครองใหเปนหนึ่งเดียว จิตวิญญาณนักสูมีอยูแลว เพียงแตตองไดรับการชี้นําอยางเหมาะสมไปยังเปาหมายที่ออนแอที่สุด"
PHI_grassroot_guerillas_tt: "สรางกองพลนอยทหารกองโจร 3 กองพลนอยตอแผนยุทธศาสตรเบื้องตนแตละแผนที่สําเร็จแลว โดยจะใหความสําคัญกับรัฐที่ไดรับการปลดปลอยแลวกอน จากนั้นจึงเปนรัฐที่มีทหารขาศึกนอย"
PHI_reconquista: "เรกองกิสตา"
PHI_reconquista_desc: "จากขุนเขาแหงลูซอนถึงปาดงดิบแหงมินดาเนา ประชาชนของเราไดหลั่งเลือดและอดทนภายใตการยึดครอง บัดนี้ถึงเวลาทวงคืนแผนดินของเรา ทีละเมือง ทีละเกาะ ดั่งที่บรรพบุรุษของเราตอตานพวกกองกิสตาดอร บัดนี้เราสูเพื่อขับไลผูรุกรานและฟนฟูชาติของเรา นี่คือเรกองกิสตาของเรา — การตอสูครั้งสุดทายเพื่อฟลิปปนส"
PHI_rebuild_sakdalistas: "ฟนฟูกลุมศักดาลิสตา"
PHI_rebuild_sakdalistas_desc: "ในคืนวันที่ 2 พฤษภาคม 1935 ชาวนา 65,000 คนที่มีอาวุธเพียงบางสวนไดทําลายความสงบสุขของฟลิปปนส เพื่อพยายามยึดอํานาจจากรัฐบาลที่อเมริกาหนุนหลัง ความพยายามนั้นลมเหลว แตความโกรธแคนตอชองวางความมั่งคั่งที่ถางกวางขึ้นระหวางคนรวยในเมืองกับคนจนในชนบทยังคงคุกรุนอยูใตพื้นผิว รอคอยการนํามาใช"
PHI_slippery_slope: "ทางลาดลื่น"
PHI_slippery_slope_desc: "อิทธิพลของญี่ปุนที่เพิ่มขึ้นในประเทศของเราเริ่มจุดชนวนความไมพอใจ สิ่งที่เราตองทํามีเพียงถอยออกมาและเฝามองความโกรธแคนตอความละโมบที่ฝงอยูในระบบทุนนิยมประชาธิปไตยอันฉอฉลระเบิดออกจากภายใน ทิ้งไวเพียงสุญญากาศที่อุดมการณหัวรุนแรงยินดีอยางยิ่งที่จะเขามาเติมเต็ม"
PHI_assassination_of_quezon: "ลอบสังหารเกซอน"
PHI_assassination_of_quezon_desc: "เปนความจริงอันนาเศราที่ 'ประธานาธิบดี' เกซอนไดฉุดรั้งฟลิปปนสไวนานเกินไป สุนัขรับใชของอเมริกาผูนี้ทําทุกวิถีทางเพื่อไมใหเจตจํานงของชาวฟลิปปนสเปนจริง สถาบันตางๆ ที่เขาสรางขึ้นรอบตัวทําใหเขาไมถูกสั่นคลอนดวยการเปลี่ยนแปลงตามวิถีประชาธิปไตย ดังนั้นตอนนี้เราตองขับเคลื่อนการเมืองดวยวิธีอื่น"
PHI_assassination_of_quezon_tt: "§Rแผนการไดเริ่มขึ้นแลวเพื่อปลดเกซอนออกจากตําแหนง อยางถาวร§!"
PHI_eisenhower_steps_in_flag: "ไอเซนฮาวรเขาแทรกแซงแลว"
PHI_makapili: "มากาปลี"
PHI_makapili_desc: "การผงาดขึ้นของฟาสซิสตในชาติฟลิปปนสเปนไปอยางรวดเร็ว และนาเสียดายที่มาพรอมกับความโกลาหลจํานวนหนึ่ง มิตรของเราในตางแดนไดเสนออาวุธและการฝกเพื่อจัดตั้ง 'กองทัพสันติภาพ' เพื่อรักษาความสงบเรียบรอย ปราบโจรผูราย และปราบปรามการกอกบฏ"
PHI_sakdalista_exiles_returned_flag: "ผูลี้ภัยกลุมศักดาลิสตาไดกลับมาแลว (เหตุการณ)"
PHI_form_the_executive_commision: "จัดตั้งคณะกรรมาธิการบริหาร"
PHI_form_the_executive_commision_desc: "กลุมผูนําเงาไดชักใยอยูเบื้องหลังมาตลอด แตบัดนี้เมื่ออุดมการณฟาสซิสตไดขึ้นสูอํานาจในฟลิปปนสแลว ถึงเวลาที่บุคคลเหลานี้จะกาวออกสูแสงสวางและรับตําแหนงอันชอบธรรมในฐานะผูนํารัฐบาล"
PHI_aguinaldos_coup: "ชิงตําแหนงผูนํา"
PHI_aguinaldos_coup_desc: "เมื่อความโกลาหลเฉพาะหนาจากการยึดอํานาจรัฐบาลเริ่มสงบลง บุคคลตางๆ ในคณะกรรมาธิการบริหารก็เริ่มแยงชิงอํานาจกัน ระบอบเผด็จการตองการผูมีอํานาจที่ชัดเจนในการปกครอง และแรงสนับสนุนก็กําลังรวมตัวกัน"
PHI_resolve_interregnum_tt: "§Gสิ่งนี้จะยุติชวงวางผูนํา และเปดใหแตงตั้งผูนําคนใหมได§!"
PHI_secure_japanese_guarantees: "รับคําประกันจากญี่ปุน"
PHI_secure_japanese_guarantees_desc: "หากเราตองการเรงเอกราชจากสหรัฐอเมริกาอยางแทจริง เราตองเตรียมรับความเปนไปไดของสงครามที่เกิดขึ้นจริง เพราะพวกเขาคงไมยอมปลอยลูกสมุนไปงายๆ เราควรติดตอผูสนับสนุนของเราในญี่ปุนและขอรับการสนับสนุนทางทหารที่เปนทางการมากขึ้นในกรณีที่เกิดการสูรบ"
PHI_war_of_independence: "สงครามประกาศเอกราช"
PHI_war_of_independence_desc: "ใหอิสรภาพแกขา หรือไมก็ใหความตาย! ถึงเวลาแลวที่ผูกดขี่อาณานิคมจะตองจากชายฝงของเราไปตลอดกาล \n\nดวงอาทิตยดวงใหมกําลังขึ้นเหนือฟลิปปนส"
PHI_will_take_peace_decision: "§Y[USA.GetName]§! จะใชการตัดสินใจนี้หาก §Y[ROOT.GetNameDef]§! ปองกันตนเองไดสําเร็จเปนเวลาหนึ่งป หรือเร็วกวานั้นหากสูญเสียฐานทัพบนเกาะใกลเคียงหรือเขาไปพัวพันกับสงครามที่อื่น"
PHI_second_philippine_republic: "สาธารณรัฐฟลิปปนสที่สอง"
PHI_second_philippine_republic_desc: "แมจะยังไมสําเร็จ แตการแสวงหาเอกราชของเราก็ใกลเขามาทุกที ขั้นตอไปคือการสรางสาธารณรัฐใหมเพื่อสงเสริมการแยกตัวอยางเปนทางการ และจากนั้นเริ่มสรางองคประกอบของรัฐบาลใหม และแนนอนวารวมถึงธงชาติผืนใหมดวย"
PHI_second_republic_tag_tt: "§Y[PHI.GetName]§! จะไดรับการขนานนามวา §Yสาธารณรัฐฟลิปปนสที่สอง§!"
PHI_election_overturned: "ลมผลการเลือกตั้ง"
PHI_election_overturned_desc: "การเลือกตั้งป 1935 ใหผลชนะอยางทวมทนแกมานูเอล เกซอน ทวมทนเกินไปสักหนอย เอมีลีโอ อากีนัลโดไดชี้ใหเห็นขอกังวลรายแรงและนําเรื่องไปยื่นตอสหรัฐอเมริกา ซึ่งไดสัญญาวาจะสอบสวนการบิดเบือนผลการเลือกตั้งที่อาจเกิดขึ้นอยางถี่ถวน"
PHI_hispanidad_filipina: "อิสปานิดัดฟลิปนา"
PHI_hispanidad_filipina_desc: "แมจะมีรอยราวที่เกิดจากสงครามประกาศเอกราชตอจักรวรรดิสเปนในป 1896-1898 แตชาวฟลิปปนสจํานวนมากยังคงมองวาตนเปนสวนหนึ่งของชาวฮิสแปนิกพลัดถิ่น และความตึงเครียดที่ยังดําเนินอยูในแผนดินใหญสเปนก็กลายเปนเรื่องที่นากังวลพอสมควร"
PHI_spanish_refugees: "ผูลี้ภัยชาวสเปน"
PHI_spanish_refugees_desc: "ดวยความเสียหายจากสงครามกลางเมืองในบานเกิด พลเมืองสเปนจํานวนมากไดแสวงหาที่ลี้ภัยในที่อื่น และเมื่อความสัมพันธระหวางเรากับสเปนอบอุนขึ้น ประชาชนของพวกเขาจํานวนมากจึงมาขอลี้ภัยในหมูเกาะของเรา"
PHI_if_supported_scw_side_lost_tt: "หากฝายใน§Yสงครามกลางเมืองสเปน§!ที่เราสงอาสาสมัครไปชวยพายแพ:"
PHI_if_supported_scw_side_wins_tt: "หากฝายใดใน§Yสงครามกลางเมืองสเปน§!ไดรับชัยชนะหลังจากไดรับอาสาสมัครจากเรา §Y$PHI_reconciliation_with_spain$§! จะใหผลที่ดีกวาแทน"
PHI_reconciliation_with_spain: "คืนดีกับสเปน"
PHI_reconciliation_with_spain_desc: "[ReconciliationWithSpain]"
PHI_reconciliation_with_spain_winner: "อาสาสมัครของเราที่รวมรบเคียงขางรัฐบาลสเปนผูไดรับชัยชนะไดหลอมสายสัมพันธใหมที่แนนแฟนยิ่งขึ้นระหวางสองชาติ และเราควรใชสายสัมพันธนี้อยางเปนทางการมากขึ้นเพื่อนําสองชาติมาเปนพันธมิตรกันในอนาคต"
PHI_reconciliation_with_spain_loser: "แมอาสาสมัครของเราจะเคยรบกับพวกเขา แตรัฐบาลสเปนก็ยอมรับอยางไมเต็มใจนักถึงสายสัมพันธทางวัฒนธรรมและศาสนาที่เรามีรวมกัน และเห็นควรนําสิ่งนี้ไปใชในการโฆษณาชวนเชื่อที่เนนความเปนหนึ่งเดียวของชาวฮิสแปนิกทั่วโลก"
PHI_reconciliation_with_spain_neutral: "สเปนมีอิทธิพลอยางปฏิเสธไมไดตอพัฒนาการของชาติเรา แตประวัติศาสตรชวงหลังสวนใหญเปนความขัดแยงเนื่องจากความสัมพันธแบบอาณานิคม ถึงกระนั้นก็ปฏิเสธไมไดวาเรามีอะไรเหมือนพวกเขามากกวา เพียงแคเราตองไดรับการปฏิบัติอยางเทาเทียม"
PHI_hispanic_overtures: "ทาบทามโลกฮิสแปนิก"
PHI_hispanic_overtures_desc: "เราไมใชชาติเดียวในโลกที่มีความเชื่อมโยงกับฮิสแปนิก อันที่จริงอเมริกาใตสวนใหญก็มี และเราไดสานสัมพันธอันดีกับหลายชาติในนั้นมาโดยตลอด เราควรยื่นมือออกไปและพยายามทําใหความสัมพันธเหลานี้เปนทางการมากขึ้น"
PHI_revolutionary_regrets: "ความเสียดายตอการปฏิวัติ"
PHI_revolutionary_regrets_desc: "ภายใตสเปน เราเปนคนในบังคับหรือพลเมืองของสเปนเสมอ แตตอนนี้ภายใตสหรัฐอเมริกา เราเปนเพียงตลาดผูบริโภคสําหรับสินคาสงออกของพวกเขา หรือไมก็เปนผูถูกรังเกียจ เพราะพวกเขาไมเคยใหเราเปนพลเมืองของรัฐใดๆ ในสหรัฐอเมริกาเลย"
PHI_royal_exiles: "ราชวงศผูลี้ภัย"
PHI_royal_exiles_desc: "ราชวงศสเปนผานการสละราชสมบัติหลายครั้ง ทั้งโดยถูกบังคับและโดยสมัครใจ รวมถึงการตัดสิทธิ์สืบสันตติวงศ ทวาราชวงศยังคงอยูและกําลังแสวงหาที่ลี้ภัย เราจะไดรับเกียรติภูมิอยางมหาศาลในโลกฮิสแปนิกหากเสนอที่พักพิงแกพวกเขา"
PHI_reino_de_filipinas: "ราชอาณาจักรฟลิปปนส"
PHI_reino_de_filipinas_desc: "ทุกสิ่งกําลังเขาที่ และดวยสเปนเองที่แตกแยกจากความขัดแยงภายใน ฟลิปปนสจึงไดผงาดขึ้นเปนหัวใจของโลกฮิสแปนิก เราขาดเพียงพิธีราชาภิเษกเพื่อตอกยํ้าสถานะของเรา นี่จะเปนชวงเวลาสูงสุดในประวัติศาสตรของเรา"
PHI_unlock_unification_decision_tt: "ปลดล็อกการตัดสินใจ: §Yเสนอการรวมชาติกับสมาชิกฝาย§!"
PHI_unlock_conquer_decision_tt: "ปลดล็อกการตัดสินใจ: §Yบังคับผนวกรวมชาติฮิสแปนิก§!"
PHI_unlock_mutual_assistance_with_spain_tt: "ปลดล็อกการตัดสินใจ: §Yเสนอสนธิสัญญาชวยเหลือซึ่งกันและกันกับ [SPR.GetNameDef]§!"
PHI_war_for_the_oceans: "สงครามแหงมหาสมุทร"
PHI_war_for_the_oceans_desc: "ในอดีตเราเปนชนชาติแหงทองทะเล และถึงเวลาแลวที่จะทวงคืนสิทธิโดยกําเนิดของเรา และอางสิทธิ์ในภูมิประเทศที่เรารูจักดีที่สุด นั่นคือมหาสมุทร"
PHI_assume_the_naval_burden: "รับภาระทางทะเล"
PHI_assume_the_naval_burden_desc: "ญี่ปุนกําลังพัวพันกับความขัดแยงบนแผนดิน ขณะที่ความเชี่ยวชาญของเรายังคงอยูในทะเล เราควรเสนอรับผิดชอบการรบทางทะเล เพื่อใหพวกเขามุงความสนใจไปยังสมรภูมิอื่นไดอยางเต็มที่"
PHI_develop_naval_infrastructure: "พัฒนาโครงสรางพื้นฐานทางทะเล"
PHI_develop_naval_infrastructure_desc: "เมื่อความทะเยอทะยานทางทะเลของเราเพิ่มขึ้น ขีดความสามารถในการตอเรือของเราก็ตองขยายตามไปดวย"
PHI_reunite_madagascar: "รวมมาดากัสการกลับคืน"
PHI_reunite_madagascar_desc: "แมจะแตกตางกันอยางมาก แตชาวมาลากาซีพื้นเมืองมีเชื้อสายผสมระหวางออสโตรนีเซียนกับแอฟริกัน ซึ่งหมายความวาพวกเขามีความเชื่อมโยงใกลชิดกับประชาชนของเราอยางนาประหลาดใจ เราควรลดระยะหางระหวางเราลง"
PHI_claim_to_core_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yรับดินแดนหลัก§!หลังจากที่เราเขาควบคุมพื้นที่เหลานั้นแลว"
PHI_take_pacific_islands: "ยึดหมูเกาะแปซิฟก"
PHI_take_pacific_islands_desc: "ฟลิปปนสเปนประเทศหมูเกาะอยูแลว จึงไมตองใชจินตนาการมากนักในการขยายพรมแดนอันชอบธรรมของเราไปทางตะวันออกขามแปซิฟก"
PHI_malayo_polynesia: "มลาโย-พอลินีเชีย"
PHI_malayo_polynesia_desc: "ในประวัติศาสตร เรามีความเชื่อมโยงใกลชิดทั้งทางวัฒนธรรม ประวัติศาสตร และชาติพันธุกับคาบสมุทรมลายูและหมูเกาะอินดีส ดวยสายสัมพันธฉันพี่นองนี้ เราควรมอบสิทธิและเอกสิทธิ์เดียวกับที่ประชาชนของเราไดรับใหแกพวกเขาดวย"
PHI_war_for_oceania: "สงครามแหงโอเชียเนีย"
PHI_war_for_oceania_desc: "โอเชียเนียถูกนิยามดวยมหาสมุทร แตประชาชนของเราไดลองเรือขามนานนํ้าเหลานี้มาตั้งแตโบราณกาล ถึงเวลาแลวที่จะผนวกหมูเกาะเหลานี้เขากับชาติที่กําลังเติบโตของเรา"
PHI_conquest_of_japan: "พิชิตญี่ปุน"
PHI_conquest_of_japan_desc: "ญี่ปุนเปนคูแขงหลักของเราในการครองทะเลในภูมิภาคนี้มาชานาน ถึงเวลาแลวที่จะยุติการแขงขันนั้นและแสดงอํานาจเหนือพวกเขาใหเด็ดขาดเสียที"
PHI_filipino_polynesian_reunification: "เจาแหงแปซิฟก"
PHI_filipino_polynesian_reunification_desc: "ภูมิภาคนี้ของโลกถูกครอบงําดวยมหาสมุทร ประกอบดวยผืนแผนดินที่กระจัดกระจายและหมูเกาะอันหางไกล แตเราไดพิชิตมันทั้งหมดแลว ดวยเหตุนี้เราจึงครองตําแหนงอันชอบธรรมในฐานะเจาแหงแปซิฟก"
PHI_polynesia_tag_tt: "§Y[PHI.GetName]§! จะไดรับธงและชื่อใหม"
PHI_petition_the_supreme_court: "ยื่นคํารองตอศาลฎีกา"
PHI_petition_the_supreme_court_desc: "ลัทธิคอมมิวนิสตถูกศาลฎีกาสั่งหามอยางเปนทางการในป 1932 แตเราบังเอิญพบชองโหวทางกฎหมายที่อาจทําใหขบวนการนี้กลับมาถูกกฎหมายอีกครั้ง เราเพียงตองลงนามและยื่นคํารองเทานั้น"
PHI_legalize_the_communist_party: "ทําใหพรรคคอมมิวนิสตถูกกฎหมาย"
PHI_legalize_the_communist_party_desc: "บัดนี้เมื่อขบวนการคอมมิวนิสตกลับมาถูกกฎหมายอีกครั้ง ขั้นตอไปคือการนําพรรคออกจากเงามืด เปดเผยการเคลื่อนไหวตอสาธารณะอีกครั้ง และเริ่มงานขยายขบวนการ"
PHI_return_of_the_exiles: "การกลับมาของผูลี้ภัย"
PHI_return_of_the_exiles_desc: "บุคคลสําคัญจํานวนหนึ่งที่มีแนวคิดฝายซายถูกบีบใหตองจากบานเกิดทั่วเอเชียตะวันออกเฉียงใต ภายใตภัยคุกคามจากกลุมนักลาอาณานิคมและนายทุน เราสามารถเปดพรมแดนใหพวกเขาและใหคํามั่นวาที่นี่คือที่พักพิงที่ปลอดภัย"
PHI_support_for_chinese_communists: "สนับสนุนคอมมิวนิสตจีน"
PHI_support_for_chinese_communists_desc: "พวกคอมมิวนิสตยังคงตอสูในจีน ทั้งตอตานการรุกรานของญี่ปุนและตอตานขุนศึกจีน เรามีโอกาสลักลอบสงคนและยุทธปจจัยไปใหพวกเขาตามแมนํ้าเหลือง ไมวาจะเพื่อสนับสนุนการตอสูโดยตรง หรือเพียงเพื่อโหมไฟแหงความขัดแยงในภูมิภาค"
PHI_the_red_sun_over_manila: "ตะวันแดงเหนือมะนิลา"
PHI_the_red_sun_over_manila_desc: "กระแสคอมมิวนิสตกําลังเพิ่มขึ้นทั่วฟลิปปนส และเปนครั้งแรกที่มีโอกาสรําไรที่จะยึดอํานาจไดจริง ความลมเหลวของการลุกฮือของกลุมศักดาลิสตาเปนเครื่องเตือนใจถึงความไรผลของการกอกบฏดวยอาวุธตอรัฐบาลที่อเมริกาหนุนหลัง เราจึงตองหาหนทางทางการเมืองในการยึดอํานาจแทน"
PHI_partido_komunista_ng_pilipinas_coup: "รัฐประหารของพรรคคอมมิวนิสตแหงฟลิปปนส"
PHI_partido_komunista_ng_pilipinas_coup_desc: "ทุกอยางเริ่มจากการนัดหยุดงานทั่วไปของชาวนา ซึ่งลุกลามไปยังสหายในโรงงาน ประชาชนไดแสดงเจตจํานงแลว และสมัชชาแหงชาติไดตกอยูในมือของฝายคอมมิวนิสต บัดนี้สหภาพแรงงานและกลุมรวมตางเรงคัดเลือกคณะกรรมการกลางชุดใหม และที่สําคัญที่สุดคือตัดสินวาใครควรเปนเลขาธิการใหญคนใหม"
PHI_national_confederation: "สมาพันธแหงชาติ"
PHI_national_confederation_desc: "บัดนี้เมื่อเราขึ้นสูอํานาจแลว ถึงเวลาเริ่มรวบอํานาจใหมั่นคง สมาพันธชาวนาแหงชาติฟลิปปนส (Kalipunang Pambansa ng Magbubukid sa Pilipinas) ในฐานะองคกรชาวนาชั้นนํา ควรเปนกลุมแรกๆ ที่เราเขาหาเพื่อการนี้"
PHI_anti_intervention_strategies: "ยุทธศาสตรตอตานการแทรกแซง"
PHI_anti_intervention_strategies_desc: "เมื่อความตึงเครียดระหวางเรากับสหรัฐอเมริกาเพิ่มขึ้น เราตองทําทุกวิถีทางเพื่อใหรัฐคอมมิวนิสตที่เพิ่งกอตั้งของเราอยูรอดไดในระยะยาว ไมวาจะผานการยอมออนขอแบบเจาะจง หรือการริบสิ่งที่ทําไดจากพวกเขากอนที่ความตึงเครียดจะปะทุเปนการสูรบ"
PHI_rally_the_fisherfolk: "รวมพลชาวประมง"
PHI_rally_the_fisherfolk_desc: "ในฐานะหมูเกาะ อุตสาหกรรมประมงของเรามีขนาดใหญและมีแรงงานมากมาย ดังนั้นเราควรหันไปหาชาวนาแหงทองทะเลเหลานี้ ปลุกพวกเขาใหเขารวมขบวนการคอมมิวนิสต และใชศักยภาพทางทะเลที่พวกเขามี"
PHI_smugglers: "พวกลักลอบขนของ"
PHI_smugglers_desc: "ประเทศของเราประกอบดวยเกาะและเกาะเล็กเกาะนอยมากมาย มีซอกมุมลับตาใหเลือกมากมายที่ประชาชนของเราใชลักลอบขนสินคาพนมือเจาหนาที่ทางการมาหลายชั่วอายุคน เราควรใชประสบการณนี้ใหเปนประโยชนแกเรา!"
PHI_struggle_conference: "การประชุมแหงการตอสู"
PHI_struggle_conference_desc: "ขบวนการคอมมิวนิสตของเราตองรับมือกับความขัดแยงและความตึงเครียดหลากหลายรูปแบบ และการตอบสนองตอสิ่งเหลานี้ตองเปนระบบและเปนทางการมากขึ้น ดังนั้นเราตองรวมผูนําของเราไวในการประชุมแหงการตอสูครั้งแรก ซึ่งจะนําทุกประเด็นมาพิจารณาและหาขอยุติ"
PHI_sanction_piracy: "รับรองการปลนสะดมทางทะเล"
PHI_sanction_piracy_desc: "ประเทศหมูเกาะของเราเปนแหลงรวมเรือเล็กและคนหนุมสาวที่กลาไดกลาเสียมากมาย ดังนั้นคงเปนเรื่องผิดมหันตหากเราไมหยิบระบบ 'หนังสืออนุญาตปลนเรือ' แบบเกามาใช โดยเราจะใหฐานทางกฎหมายแกโจรสลัดเหลานี้ในการออกไปจูโจมศัตรูของเรา แลวหนีกลับเขาอาวพรอมรางวัลทางทะเลที่เพิ่งไดมา"
PHI_infiltrate_chinese_ports: "แทรกซึมทาเรือจีน"
PHI_infiltrate_chinese_ports_desc: "คนงานทาเรือของเราเปนกลุมแรกๆ ที่ควาโอกาสที่ลัทธิคอมมิวนิสตมอบให และเปนพันธมิตรที่แข็งขันที่สุดของเรามาชานาน เราควรปลุกกระแสเดียวกันนี้ในทาเรือของจีน แลวใชมันเปนฐานกระโดดสูการแทรกแซงการตอสูในจีนตอไป"
PHI_every_non_communist_coastal_warlord: "ขุนศึกจีนทุกรายที่ไมใชคอมมิวนิสตและมีชายฝง:"
PHI_maritime_communism: "คอมมิวนิสตทางทะเล"
PHI_maritime_communism_desc: "ขณะที่รัฐคอมมิวนิสตหลายแหงมุงระดมประชาชนเขาสูการเคลื่อนพลขนาดใหญบนแผนดิน เราควรใชการระดมพลมหาชนเพื่อกําลังทางทะเลแทน และปลดปลอยกองทัพแหงทองทะเลนี้ออกสูมหาสมุทรทั่วโลก เพื่อรวมทุกคนไวภายใตขบวนการคอมมิวนิสตทางทะเล"
PHI_pan_pacific_trade_union_secretariat: "สํานักเลขาธิการสหภาพแรงงานแพนแปซิฟก"
PHI_pan_pacific_trade_union_secretariat_desc: "แมเราจะไดเก็บเกี่ยวประโยชนจากลัทธิคอมมิวนิสตเพื่อตัวเราและประชาชนของเราแลว แตขบวนการนี้ไมควรโดดเดี่ยวและปดตัว เราควรสงออกปรัชญาของเราพรอมวิธีทําใหมันเปนจริงไปยังผูรวมอุดมการณอื่นๆ ทั่วเอเชียตะวันออกเฉียงใต และจัดตั้งสํานักเลขาธิการสหภาพแรงงานแพนแปซิฟกเพื่อปกปองและพัฒนารวมกัน"
PHI_comitern: "โคมินเทิรน"
PHI_comitern_desc: "แมความเชื่อมโยงของเรากับ [SOV.GetNameDef] จะเปราะบางอยางยิ่ง แตก็ปฏิเสธไมไดถึงอํานาจของพวกเขาบนเวทีโลก และหากเราตองการใหการทดลองคอมมิวนิสตของเราดําเนินตอไปและสงออกไปยังผูอื่นได เราตองรวมกันภายใตขอบเขตอิทธิพลเดียวเพื่อความรุงเรืองของอุดมคติสังคมนิยมทั่วโลก"
PHI_national_defense_act: "พระราชบัญญัติการปองกันประเทศ"
PHI_national_defense_act_desc: "พระราชบัญญัติการปองกันประเทศผานการรับรองเมื่อวันที่ 21 ธันวาคม 1935 พรอมจัดสรรงบประมาณ 16,000,000 เปโซใหแกกองทัพฟลิปปนส สิ่งที่เหลืออยูคือการตัดสินวาจะใชเงินจํานวนนี้อยางไรและที่ใด กองทัพทุกเหลาตางเรียกรองการลงทุน เชนเดียวกับระบบปองกันที่สําคัญยิ่งตอความมั่นคงของเรา"
PHI_war_plan_orange: "แผนสงครามออเรนจ"
PHI_war_plan_orange_desc: "หลักการพื้นฐานของแผนสงครามออเรนจคือฟลิปปนสตองทําหนาที่เปนฐานปฏิบัติการสวนหนาของอเมริกาตอไปในกรณีที่เกิดความขัดแยง ดังนั้นสิ่งสําคัญที่สุดที่ตองปกปองคืออาวมะนิลา เราตองดําเนินคําสั่งการปองกันเพื่อการนี้ และรวมกําลังปองกันไวรอบพื้นที่ยุทธศาสตรสําคัญแหงนี้"
PHI_beach_defense_strategy: "ยุทธศาสตรปองกันชายหาด"
PHI_beach_defense_strategy_desc: "ดวยปนและทหารที่มากพอ เรานาจะรักษาแนวรอบนอกของฟลิปปนสไวได ดังนั้นเราควรวางยุทธศาสตรการปองกันโดยมีเปาหมายนี้เปนหลัก ดวยวิธีนี้ เราจะมั่นใจไดวาฟลิปปนสทั้งประเทศจะยังคงมีสวนรวมในการทัพระยะยาวใดๆ ที่อาจเกิดขึ้น"
PHI_fortify_corregidor: "เสริมปอมคอรเรฮิดอร"
PHI_fortify_corregidor_desc: "เกาะคอรเรฮิดอรตั้งอยูตรงปากทางเขาอาวมะนิลา จึงเปนหัวใจสําคัญในการควบคุมอาวและกําลังทางเรือที่นั่นอยางตอเนื่อง เราควรยกระดับปอมปราการบนเกาะ และสรางสิ่งปลูกสรางใตดินเพื่อชวยตานทานการปดลอมและการระดมยิงอันยาวนานจากกองกําลังทางอากาศและทางเรือของขาศึก"
PHI_fortify_corregidor_bypass_tt: "ไมสามารถสราง §Y$bunker$§! และ §Y$coastal_bunker$s§! ในเมืองมะนิลาไดอีก"
PHI_bastion_bataan: "ปอมปราการบาตาอัน"
PHI_bastion_bataan_desc: "คาบสมุทรบาตาอันเปนที่มั่นปองกันตามธรรมชาติซึ่งเปนดานหนึ่งของอาวมะนิลา ตราบใดที่เรายึดพื้นที่นี้ไวได เราก็จะควบคุมไดวาใครและสิ่งใดจะใชอาวและสิ่งอํานวยความสะดวกของมันได เพื่อรักษาความเหนือกวาในพื้นที่นี้ไว เราตองพัฒนาแนวปองกันตามดานที่ติดแผนดิน และวางปนใหญไวบนที่สูง"
PHI_bastion_bataan_bypass_tt: "ไมสามารถสราง §Y$bunker$§! บนพรมแดนรัฐของบาตาอันไดอีก และไมสามารถสราง §Y$coastal_bunker$s§! ในตัวบาตาอันหรือในดากูปนได"
PHI_coastal_artillery: "ปนใหญรักษาฝง"
PHI_coastal_artillery_desc: "ไมตองสงสัยเลยวาบนหมูเกาะ หนวยที่มีเปาหมายใหโจมตีมากที่สุดคือปนใหญรักษาฝง ซึ่งสามารถโจมตีเปาหมายไดทั้งบนบกและในทะเล การลงทุนดานยุทโธปกรณ การฝก และการยกระดับหนวยเหลานี้ควรเปนสิ่งสําคัญอันดับตน"
PHI_the_concrete_battleship: "เรือประจัญบานคอนกรีต"
PHI_the_concrete_battleship_desc: "ปอมดรัม ปอมปราการทาเรือที่นาเกรงขามที่สุดของอาวมะนิลา มีรูปทรงคลายเรือประจัญบาน เริ่มกอสรางในป 1909 และไดรับการยกระดับอาวุธและโครงสรางสนับสนุนมาตลอด ปอมปราการเกาแกที่ไดรับฉายาอยางเอ็นดูวา USS No-Go นี้ ถูกเรียกกลับมาประจําการอีกครั้งในยุคสงครามสมัยใหม"
PHI_philippine_scouts: "หนวยลาดตระเวนฟลิปปนส"
PHI_philippine_scouts_desc: "หนวยลาดตระเวนฟลิปปนสกอตั้งขึ้นในป 1901 เปนกลุมชาวฟลิปปนสที่รับราชการทหารที่ใหญที่สุดของเรา เราควรสนับสนุนหนวยนี้ตอไป และดูแลใหพวกเขาไดรับการฝกและยุทโธปกรณที่ดีที่สุดเพื่อปฏิบัติหนาที่ในฐานะกองกําลังเฉพาะทางที่ไดรับมอบหมายใหปกปองมาตุภูมิ"
PHI_militarize_the_constabulary: "เปลี่ยนตํารวจภูธรเปนกําลังทหาร"
PHI_militarize_the_constabulary_desc: "ตํารวจภูธรฟลิปปนสถูกรวมเขากับกองทัพฟลิปปนสสวนกลางตามพระราชบัญญัติการปองกันประเทศ แตเมื่อมองยอนกลับไป นี่อาจเปนความผิดพลาด เพราะกําลังตํารวจที่เหลืออยูทดแทนนั้นพิสูจนแลววาไมเพียงพอ เราควรจัดตั้งตํารวจภูธรขึ้นใหม แตใหคงอาวุธและการฝกแบบทหารไว เพื่อใหพวกเขาทั้งรับใชและปกปองชาติได"
PHI_philippine_army_orchestra: "วงดุริยางคกองทัพฟลิปปนส"
PHI_philippine_army_orchestra_desc: "วงดุริยางคตํารวจภูธรฟลิปปนสเปนหนึ่งในวงดุริยางคทหารชั้นนําของโลก และไดรับเกียรติใหบรรเลงในพิธีสาบานตนรับตําแหนงของประธานาธิบดีสหรัฐฯ เราควรรวมวงเขากับกองทัพเพื่อใชพลังของดนตรีกับทหารของเราไดดียิ่งขึ้น และใชพลังที่ปลุกใจนี้หลอหลอมความฮึกเหิมของชาติ และกระตุนใหพวกเขาแสดงความกลาหาญยิ่งขึ้นไปอีก"
PHI_philippine_military_academy: "โรงเรียนนายรอยทหารฟลิปปนส"
PHI_philippine_military_academy_desc: "หลายปที่ผานมา โรงเรียนนายรอยตํารวจภูธรฟลิปปนสทําหนาที่เปนสถานฝกนายทหารหลักของประเทศ แตเรายังขาดสถาบันการศึกษาทางทหารอยางเปนทางการ เราควรรวมสถาบันนี้เขากับกองทัพ และกําหนดอยางเปนทางการใหเปนโรงเรียนนายรอยทหารฟลิปปนสแหงใหม อุทิศเพื่อการศึกษาและพัฒนาชนชั้นนําทางทหารแหงอนาคต"
PHI_philippine_division: "กองพลฟลิปปนส"
PHI_philippine_division_desc: "กองพลฟลิปปนสมีหนาที่ปองกันหมูเกาะของเรา แตมียุทโธปกรณไมดีและขาดกําลังพล เราควรแสวงหาความเชี่ยวชาญดานการนําจากภายนอก และดูแลใหทหารของเรามีอาวุธและยุทโธปกรณที่ทันสมัยยิ่งขึ้น"
PHI_10_year_training_plan: "แผนการฝก 10 ป"
PHI_10_year_training_plan_desc: "ดวยคํามั่นวาจะเปลี่ยนผานสูเอกราชภายในสิบป พระราชบัญญัติการปองกันประเทศจึงมีบทบัญญัติสําหรับการฝกกองกําลังที่พึ่งพาตนเองไดและเปนอิสระ สามารถปกปองบานเกิดของเรา ซึ่งรวมถึงการกาวสูกองทัพประจําการ โครงการฝกนายทหาร การจัดตั้งกองกําลังสํารอง และการลงทุนในโครงสรางพื้นฐานทางทหาร"
PHI_battalion_combat_teams: "ชุดรบระดับกองพัน"
PHI_battalion_combat_teams_desc: "ความเปนจริงของสงครามแสดงใหเห็นชัดวาเราตองการกองกําลังที่คลองตัวและยืดหยุนมากขึ้น สามารถปรับตัวกับทุกสถานการณที่เกิดขึ้น พวกเขาควรมีลําดับชั้นการบังคับบัญชาที่หลวมขึ้นและไดรับอํานาจใหปฏิบัติการในระดับหนวยเล็ก"
PHI_battalion_combat_teams_tt: "§Y$category_all_infantry$§!:\n    การโจมตีเปาออน: §G+15%§!\n    การโจมตีเปาแข็ง: §G+15%§!\n    การเจาะเกราะ: §G+15%§!\n §Y$category_cavalry$§!:\n    การโจมตีเปาออน: §G+10%§!\n    การโจมตีเปาแข็ง: §G+10%§!\n    การเจาะเกราะ: §G+10%§!"
PHI_mandatory_conscription: "การเกณฑทหารภาคบังคับ"
PHI_mandatory_conscription_desc: "การปองกัน [PHI.GetNameDef] เปนความรับผิดชอบของพลเมืองทุกคน ดังนั้นพลเมืองควรอยูภายใตการเกณฑทหารภาคบังคับ เพื่อใหไดเรียนรูพื้นฐานการรบ และพรอมพรั่งดวยการฝกหากมีความจําเปนตองรับราชการทหาร"
PHI_self_reliance_defense: "การปองกันแบบพึ่งพาตนเอง"
PHI_self_reliance_defense_desc: "เราพึ่งพาการชวยเหลือจากชาติอื่นในการปกปองประเทศอยางมาก แตสิ่งนี้เผยใหเห็นจุดออนทางยุทธศาสตรที่รายแรง เราตองสรางหนทางปกปองตนเอง โดยเริ่มจากการพัฒนาฐานอุตสาหกรรมที่สามารถสนับสนุนกองกําลังที่เพิ่งกอตั้งของเราดวยยุทธปจจัยทุกอยางที่ตองการ"
PHI_army_of_the_philippines: "กองทัพแหงฟลิปปนส"
PHI_army_of_the_philippines_desc: "กองทัพของเราพัฒนาไปอยางมากในเวลาเพียงไมกี่ป และถึงเวลาแลวที่จะเลิกพึ่งพาความชวยเหลือจากตางชาติ และเดินหนาอยางมั่นใจดวยตัวเองสูอนาคตใหมที่สดใสและมั่นคง ซึ่งไดรับการปกปองดวยเลือดเนื้อและเหล็กกลาของชาวฟลิปปนสทั้งหมด นับจากนี้ ความมั่นคงของเราเปนเรื่องของเราเอง"
PHI_army_air_corps: "กองบินทหารบก"
PHI_army_air_corps_desc: "แมกองบินทหารบกจะมีขนาดและทรัพยากรจํากัด แตก็ไมขาดความทะเยอทะยาน หมูเกาะของเรากระจัดกระจายและเดินทางขามไดยาก เราจึงควรลงทุนในขีดความสามารถทางอากาศมากขึ้นเพื่อครอบคลุมพื้นที่ใหไดมากที่สุด "
PHI_pilot_training_programme: "โครงการฝกนักบิน"
PHI_pilot_training_programme_desc: "นักบินเปนทรัพยากรที่สําคัญอยางยิ่ง และเราขาดแคลนนักบินอยางมากเมื่อพิจารณาจากสภาพอันยํ่าแยของอุตสาหกรรมการบินของเรา เราควรเจรจาขอตกลงกับชาติอื่นเพื่อใหคนหนุมสาวของเราไดรับการฝกในอาชีพที่โบยบินสูงนี้"
PHI_off_shore_patrol: "หนวยลาดตระเวนนอกชายฝง"
PHI_off_shore_patrol_desc: "กองทัพอากาศของเราจะตองปกปองนานฟาไดทั้งเหนือแผนดินและทะเล ดังนั้นเราควรจัดหาอากาศยานทางทะเลเฉพาะทางที่มีพิสัยไกลขึ้นและมีขีดความสามารถตอตานเรือ เพื่อใหเราโจมตีผูรุกรานไดกอนที่พวกเขาจะมองเห็นชายฝงของเราดวยซํ้า"
PHI_expand_airbases: "ขยายฐานทัพอากาศ"
PHI_expand_airbases_desc: "แมพันธมิตรของเราตองการสงกองทัพอากาศมายังหมูเกาะของเรา หรือหากเราพัฒนาขีดความสามารถที่จะผลิตเองได เราก็ไมมีพื้นที่ใหตั้งฐานเลย! เราควรเริ่มสรางสนามบินและทาอากาศยานใหมทันที เพื่อใหอากาศยานประจําการที่นี่ไดงายขึ้น"
PHI_develop_domestic_aircraft_industry: "พัฒนาอุตสาหกรรมอากาศยานภายในประเทศ"
PHI_develop_domestic_aircraft_industry_desc: "การพึ่งพามิตรและพันธมิตรของเราใชไดดีมาจนถึงตอนนี้ แตทายที่สุดแลว หากเราตองการไดรับการยอมรับในฐานะรัฐเอกราชที่มีขีดความสามารถทางทหารเปนของตนเองในโลกสมัยใหม เราตองเริ่มลงทุนในอุตสาหกรรมการบินภายในประเทศ ซึ่งเริ่มตนไดดวยการอุดหนุนนักนวัตกรรมและผูประกอบการดานการบินในประเทศของเรา"
PHI_if_align_with_japan_tt: "หากแผนยุทธศาสตร §Y$PHI_align_with_japan$§! สําเร็จแลว:"
PHI_if_align_with_the_usa_tt: "หากแผนยุทธศาสตร §Y$PHI_align_with_the_usa$§! สําเร็จแลว:"
PHI_philippine_air_force: "กองทัพอากาศฟลิปปนส"
PHI_philippine_air_force_desc: "ถึงเวลาแลวที่กองทัพอากาศจะไดรับการยอมรับเปนหนวยงานของตนเอง แยกจากกองทัพบก เมื่อจัดโครงสรางเชนนี้ พวกเขาจะมีความยืดหยุนมากขึ้นในการจัดองคกรและการจัดหากําลังคนและยุทธปจจัย พวกเขาจะไมตองขึ้นอยูกับความตองการของเหลาทัพใดเหลาทัพหนึ่งอีกตอไป แตจะบินรับใชทั้งกองทัพ"
PHI_thats_not_an_island: "นั่นไมใชเกาะ!"
PHI_thats_not_an_island_desc: "แมหมูเกาะของเราจะมอบความยืดหยุนอยางมาก แตก็มีขอจํากัดอยูบาง ตัวอยางเชน หากเราตองการปฏิบัติการไกลจากหมูเกาะบานเกิดละ? ถาอยางนั้นเราก็แคพาเกาะสักเกาะไปดวย แลวเราก็จะมีขีดความสามารถในการปฏิบัติการโจมตีไดทุกที่ในโลกที่ตองการ"
PHI_offshore_patrol: "หนวยลาดตระเวนนอกชายฝง"
PHI_offshore_patrol_desc: "พระราชบัญญัติการปองกันประเทศยังมีบทบัญญัติเพื่อการปกปองทางทะเลของหมูเกาะฟลิปปนส ซึ่งไมไดคาดหวังใหเปนกองเรือทะเลลึกที่สมบูรณ แตเปนกองเรือที่สรางขึ้นเพื่อปกปองชายฝงบานเกิดของเรา ทั้งนี้ไมไดหมายความวามันจะเปนกาวแรกสูกองเรือที่ทรงอํานาจกวานี้ไมได"
PHI_marine_corps: "นาวิกโยธิน"
PHI_marine_corps_desc: "เรามีประสบการณอยางมากในการขึ้นและลงฝง ผูคนจํานวนมากในชุมชนของเราตองนั่งเรือขามฟากหรือแมแตพายเรือขามระหวางเกาะเพื่อไปทํางานหรือไปพบครอบครัว เราสามารถใชประสบการณนี้และหลอหลอมเปนนาวิกโยธินชั้นนําของโลก ดวยทหารที่สามารถนําการรบไปยังชายฝงใดก็ได ทั้งในและตางประเทศ"
PHI_cavite_naval_base: "ฐานทัพเรือกาบีเต"
PHI_cavite_naval_base_desc: "อูทหารเรือที่กาบีเตซึ่งตั้งอยูฝงตรงขามอาวจากนครมะนิลา มีศักยภาพสูงสุดที่จะเปนทาเรือนํ้าลึกและอูตอเรือในฟลิปปนส ที่นี่มีสิ่งอํานวยความสะดวกเบื้องตนอยูบางแลว และหากไดรับการลงทุนก็อาจกลายเปนสินทรัพยทางยุทธศาสตรสําคัญสําหรับประจําการกองเรือที่สามารถควบคุมนานนํ้าเอเชียตะวันออกเฉียงใตได "
PHI_pt_boat_development: "พัฒนาเรือ PT"
PHI_pt_boat_development_desc: "ประเทศของเราซึ่งประกอบดวยเกาะจํานวนมากจะไดประโยชนมากกวาจากการใชเรือขนาดเล็กที่พุงเขาออกตามรองนํ้าแคบๆ ของหมูเกาะได เพื่อกอกวนและจมขาศึกที่ใหญกวา เราควรซื้อความเชี่ยวชาญดานหลักนิยมเรือตอรปโด และนํามาพัฒนากําลังทางเรือเฉพาะของเราเองที่เรียกวาเรือลาดตระเวน"
PHI_pt_boat_development_tt: "ความเร็วในการไดรับความชํานาญ §G+10%§! สําหรับ§Yเรือคุมกัน§!"
PHI_pt_boat_development_2_tt: "ความเร็วในการไดรับความชํานาญ §G+20%§! สําหรับ§Yเรือลาดตระเวน§!"
PHI_mosquito_fleet: "กองเรือยุง"
PHI_mosquito_fleet_desc: "ตอรปโดลูกเดียวหรือกระสุนนัดเดียวสามารถเล็งและจมเรือไดเพียงลําเดียว ดังนั้นเราตองไมมีเรือเพียงลําเดียว แตตองมีทั้งฝูง พวกเขาอาจจมไดหนึ่งลํา สิบลํา หรือแมแตรอยลํา แตจะไมมีทางจมเราไดหมด! ที่แยกวานั้นสําหรับพวกเขา เราอาจตองการเพียงนัดเดียวที่ยิงถูกเปา และดวยฝูงเรือของเรา เราแทบจะไมมีทางพลาดเลย"
PHI_devil_boats: "เรือปศาจ"
PHI_devil_boats_desc: "เรือลาดตระเวนของเราไดรับชื่อเสียงดานความเร็วและความกลาบาบิ่น โดยเฉพาะความสามารถในการโจมตีอยางหนักแลวหายลับไปในสายหมอกดั่งภูตผีแหงทองทะเล ขาศึกของเราจึงเรียนรูที่จะหลีกเลี่ยงชายฝงของเรา เกรงวาจะตกเปนเหยื่อของ 'เรือปศาจ' เหลานี้"
PHI_fast_attack_craft: "เรือโจมตีเร็ว"
PHI_fast_attack_craft_desc: "วิวัฒนาการในอุดมคติของเรือลาดตระเวนคือเรือโจมตีเร็ว ดวยความเร็วและอํานาจการยิงที่เพิ่มขึ้นอยางมาก เรือเหลานี้สามารถลาดตระเวนรอบชายฝงของเรา สรางความพินาศใหขาศึกที่หลงเขามาใกลเกินไป แลวพุงหนีไปกอนที่ความชวยเหลือจะมาถึง"
PHI_coastal_defense_ships: "เรือปองกันชายฝง"
PHI_coastal_defense_ships_desc: "กองเรือของเราเติบโตจนมีโครงสรางพื้นฐานและวิธีการที่จะประกอบและดูแลเรือขนาดใหญขึ้นไดแลว เปาหมายแรกของเรายังคงเปนการปกปองชายฝงของตนเอง แตบัดนี้เราสามารถออกแบบเรือที่ยืนหยัดตอกรกับเรือหลักของขาศึกได โดยใชภูมิศาสตรของเราใหเปนประโยชน"
PHI_philippine_naval_patrol: "หนวยลาดตระเวนทางทะเลฟลิปปนส"
PHI_philippine_naval_patrol_desc: "เพื่อใหไดรับการยอมรับอยางเหมาะสมบนเวทีโลก โดยเฉพาะในฐานะชาติที่ประกอบดวยเกาะมากมาย กองเรือของเราตองมีขีดความสามารถในการปกปองชายฝงอยางแทจริง เพื่อขยายใหไดขนาดและขีดความสามารถเชนนั้น เราควรพัฒนาและปรับปรุงระบบการบังคับบัญชาและควบคุมใหสอดคลองกับมาตรฐานของกองเรือสมัยใหม"
PHI_thalassocracy: "จักรวรรดิทางทะเล"
PHI_thalassocracy_desc: "แนวคิด 'กองทัพที่มีรัฐ' เปนที่รูจักกันดีและมักไดรับการยกยองในกรณีของปรัสเซีย อยางไรก็ตาม เราควรมุงเปน 'กองทัพเรือที่มีรัฐ' ดวยกองเรือที่มีขีดความสามารถเหนือกวาแมแตอังกฤษในยุครุงเรืองสูงสุด"










