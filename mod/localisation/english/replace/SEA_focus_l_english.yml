 SIK_six_great_policies: "หกนโยบายใหญ"
 SIK_six_great_policies_desc: "หกนโยบายใหญ ไดแก การตอตานจักรวรรดินิยม มิตรภาพกับสหภาพโซเวียต ความเทาเทียมทางเชื้อชาติและชาติพันธุ รัฐบาลที่สะอาด ตลอดจนสันติภาพและการฟนฟู ซึ่งสงเสริมผานสมาคมตอตานจักรวรรดินิยมของประชาชน คือรากฐานการปกครองกลุมซินเจียงของเซิ่ง ชื่อไฉ ดวยนโยบายเหลานี้ เราจะทําใหมณฑลรุงเรืองและไมหวนกลับไปสูการปกครองแบบศักดินา"
 SIK_invest_in_the_dushanzi_oil_fields: "ลงทุนในแหลงนํ้ามันตูซานจื่อ"
 SIK_invest_in_the_dushanzi_oil_fields_desc: "มีการคนพบนํ้ามันในพื้นที่ตูซานจื่อเมื่อชวงตนศตวรรษ และภายในป 1909 เราก็เริ่มขุดเจาะในระดับหนึ่งแลว แตดวยการลงทุนจากสหภาพโซเวียตเมื่อไมนานมานี้ จึงมีศักยภาพที่จะขยายไดอีก เราควรลงทุนเพิ่มเติมในความรวมมือโซเวียต-ซินเจียงนี้เพื่อขยายโรงกลั่นนํ้ามัน ซึ่งอาจมีความสําคัญยิ่งตอความพยายามในการทําสงครามทั้งของเราและของโซเวียต"
 SIK_three_year_plan_for_reconstruction: "แผนฟนฟูสามป"
 SIK_three_year_plan_for_reconstruction_desc: "เพื่อรักษาการปกครองของเราและหลีกเลี่ยงความวุนวายเพิ่มเติม เราตองริเริ่มแผนฟนฟูสามปโดยไดรับการสนับสนุนจากโซเวียต การกูเงินจะผูกเราไวกับสหภาพโซเวียตชั่วคราว แตในระยะยาวจะรับประกันความรุงเรืองทางเศรษฐกิจและทายที่สุดคือเอกราชของเรา"
 SIK_a_new_xinjiang: "ซินเจียงใหม"
 SIK_a_new_xinjiang_desc: "บัดนี้เมื่ออุตสาหกรรมของเราไดรับการพัฒนาใหทันสมัย และประชาชนไดเรียนรูการอานเขียนแลว มณฑลของเราก็พรอมกาวสูขั้นตอไปบนเสนทางสูอนาคต บัดนี้เราจะเริ่มโครงการขนาดใหญเพื่อหลอมรวมซินเจียงและประชาชนเขากับโลกสมัยใหม ขณะที่เราเตรียมพรอมจะยืนหยัดบนเวทีโลก!"
 SIK_transformation_of_nature: "การเปลี่ยนแปลงธรรมชาติ"
 SIK_transformation_of_nature_desc: "เอเชียอุดมดวยทรัพยากรธรรมชาติที่รอการนํามาใช เมื่อแวดวงวิทยาศาสตรของเราผลักดันขีดจํากัดของสิ่งที่เคยคิดวาเปนไปได แมแตโครงการที่ใหญโตและรุกลํ้าธรรมชาติที่สุดก็กลายเปนสิ่งที่ทําได สิ่งแวดลอมตองถูกปรับแตงและหลอหลอมในระดับมหาศาลเพื่อประโยชนของประชาชน!"
 SIK_soviet_intervention: "การแทรกแซงโดยตรงของโซเวียต"
 SIK_soviet_intervention_desc: "เซิ่ง ชื่อไฉ พิสูจนแลววาไวใจไมได ดวยการเปลี่ยนขางไปมาระหวางฝายตางๆ เราจึงตองแทนที่เขาดวยคนที่เราไวใจไดวาจะปกครองซินเจียงไปในทิศทางที่ไมเบี่ยงเบนจากแนวทางของพรรค"
 SIK_protector_of_the_kyrgiz: "ผูพิทักษชาวคีรกีซ"
 SIK_protector_of_the_kyrgiz_desc: "ชาวคีรกีซอีกฟากหนึ่งของพรมแดนโซเวียตปรารถนาจะไดรับการนําโดยผูที่เขาใจพวกเขา [ROOT.GetLeader] มีรากเหงาเดียวกับพวกเขาและรูจักวิถีของพวกเขา เราควรยื่นคํารองตอ [SOV.GetLeader] เพื่อขอรวมเขากับมณฑลนี้"
 SIK_ensure_a_clean_government: "รับประกันรัฐบาลที่สะอาด"
 SIK_ensure_a_clean_government_desc: "หนึ่งในหกนโยบายใหญคือรัฐบาลที่สะอาดปราศจากการคอรรัปชัน และปราศจากการปลุกปนกอความไมสงบดวย เราตองรักษาเสถียรภาพของรัฐบาลไมวาตองแลกดวยสิ่งใด โดยกําจัดทุกคนที่อาจคุกคามการปกครองของ [ROOT.GetLeader] ดวยความชวยเหลือจาก NKVD!"
 SIK_a_new_nationality_policy: "นโยบายชาติพันธุใหม"
 SIK_a_new_nationality_policy_desc: "เราควรนํานโยบายชาติพันธุแบบโซเวียตมาใช ที่ไมใชกลุมเดียวครอบงําทั้งหมด แตหลายกลุมอยูรวมกันอยางกลมกลืน ดวยเหตุนี้ ชาวฮั่นตองไดเรียนการอานเขียนภาษาอุยกูร และในทางกลับกันดวย เราจะบังคับใชหลักอเทวนิยมในสวนราชการ แตใหประชาชนมีเสรีภาพในการปฏิบัติศาสนกิจและความเชื่อ เพื่อใหมณฑลมั่นคงและเปนเอกภาพยิ่งขึ้น"
 SIK_settle_dzungarian_tribes: "ใหชนเผาซุงกาเรียตั้งถิ่นฐาน"
 SIK_settle_dzungarian_tribes_desc: "เราไดรับคําขอจากหัวหนาและผูนําของชนเผาซุงกาเรียที่จะตั้งถิ่นฐานในรัฐของเรา เนื่องจากพวกเขาไมไดรับผลประโยชนจากการเก็บเกี่ยวที่อุดมสมบูรณของเรา เราควรสนองความปรารถนาของพวกเขา"
 SIK_king_of_sinkiang: "ราชาแหงซินเจียง"
 SIK_king_of_sinkiang_desc: "เซิ่ง ชื่อไฉ เปนผูนําที่ไมมีใครโตแยงไดของกลุมซินเจียง ถึงขั้นที่บางคนเรียกเขาวาราชา อยางไรก็ตาม มณฑลนี้ตั้งอยูบนทางแยก บางคนตองการเดินตามรัฐบาลกลาง ขณะที่บางคนตองการเดินตามแนวทางโซเวียตตอไป ไมวาราชาจะประกาศสิ่งใด ก็จะกําหนดอนาคตของมณฑลและประชาชน แตยังไมชัดเจนวาจะเปนเชนไร"
 SIK_rejoin_the_central_government: "กลับเขารวมรัฐบาลกลาง"
 SIK_rejoin_the_central_government_desc: "โซเวียตไมไดนาเชื่อถืออยางที่เราเคยคิด ดูเหมือนวาทางที่ดีที่สุดคือการแทงมาตัวที่ชนะ และเปลี่ยนแนวทางกลับไปเขารวมกับกกมินตั๋งและผนวกรวมเขากับรัฐบาลกลางอยางรวดเร็ว"
 SIK_reestablish_the_guominjun: "ฟนฟูกั๋วหมินจวิน"
 SIK_reestablish_the_guominjun_desc: "กั๋วหมินจวินเปนกลุมทหารที่กอตั้งโดยเฝง ยวี่เสียง ในทศวรรษ 1920 ดวยการยึดมั่นในชาตินิยม การตอตานจักรวรรดินิยม และสังคมนิยมคริสเตียน ดูเหมือนจะเปนองคกรที่เหมาะอยางยิ่งที่จะฟนฟูขึ้นมา หากเราตองการเปนฝายที่สามในสงครามกลางเมือง ยังไมตองพูดถึงความจริงที่วา ทายที่สุดแลวเซิ่ง ชื่อไฉ เคยเขารวมกั๋วหมินจวินในอดีต และความภักดีของเขาไมเคยอยูกับกกมินตั๋งเลย"
 SIK_reaffirm_soviet_connections: "ตอกยํ้าความสัมพันธกับโซเวียต"
 SIK_reaffirm_soviet_connections_desc: "รัฐบาลกลางไดทําใหจีนลมเหลว และสิ่งนี้ยิ่งชัดเจนขึ้นทุกวัน เราควรพยายามตัดความสัมพันธกับพวกเขาใหขาด และเขารวมกับ [SOV.GetNameDef] ในสงครามครูเสดตอตานระบบศักดินา"
 SIK_utilize_asperovs_contacts: "ใชเสนสายของอาเปรซอฟ"
 SIK_utilize_asperovs_contacts_desc: "กาเรกิน อาเปรซอฟ กงสุลใหญโซเวียตผูมีอํานาจพิเศษ และผูแทนกรมตะวันออกที่สองแหงคณะกรรมาธิการประชาชนวาดวยการตางประเทศของสหภาพโซเวียตประจําอุรุมชี มีเสนสายสําคัญมากมายใน [SOV.GetNameDef] เราควรใชอํานาจและเสนสายของเขาเพื่อรีดผลประโยชนจากความรวมมือกับชาว[SOV.GetAdjective]ใหไดมากขึ้น"
 SIK_office_of_sinkiang_border_commissioner: "สํานักงานปองกันชายแดนซินเจียง"
 SIK_office_of_sinkiang_border_commissioner_desc: "สํานักงานขาหลวงปองกันชายแดนซินเจียงเปนหนวยงานที่รับผิดชอบการบังคับบัญชากองรักษาการณประจําภูมิภาค ดวยอํานาจปกครองตนเองนี้ เราสามารถเสริมความแข็งแกรงใหรัฐบาลมณฑลและดําเนินการอยางอิสระจากรัฐบาลกลางไดแทบทุกเมื่อที่ตองการ"
 SIK_cooperate_with_the_nkvd: "รวมมือกับ NKVD"
 SIK_cooperate_with_the_nkvd_desc: "เพื่อกระชับความสัมพันธกับ [SOV.GetNameDef] พรอมกับรักษาการปกครองของเราและปกปองอุรุมชีจากผูสมคบคิดตางชาติ เราตองรวมมือกับ NKVD และชวยใหพวกเขาตั้งฐานปฏิบัติการในประเทศของเราอยางเหมาะสม"
 SIK_cooperate_with_the_ussr: "รวมมือกับสหภาพโซเวียต"
 SIK_cooperate_with_the_ussr_desc: "ความสัมพันธของเรากับสหภาพโซเวียตนั้นมีเอกลักษณไมเหมือนใครในจีน และเพื่อรักษาบูรณภาพแหงดินแดน เราตองใชประโยชนจากสิ่งนั้น ดวยความชวยเหลือของพวกเขา ในที่สุดเราอาจขับไลกกมินตั๋งออกจากมณฑลของเราได"
 SIK_military_cooperation: "ความรวมมือทางทหาร"
 SIK_military_cooperation_desc: "กกมินตั๋งยังคงมีทหารจํานวนมากในโคตันผานกองพลที่ 36 ใหม เพื่อใหแนใจวาจะขับไลพวกเขาออกไปได เราควรขอความชวยเหลือจากสหภาพโซเวียต"
 SIK_a_soviet_airforce: "กองทัพอากาศแบบโซเวียต"
 SIK_a_soviet_airforce_desc: "ดวยความสัมพันธที่เติบโตขึ้นกับ [SOV.GetNameDef] เราจะสามารถจัดหาอากาศยานจากพวกเขาได นอกจากนี้ พวกเขายังเตรียมจัดตั้งโรงเรียนการบินในอุรุมชี และเริ่มสงที่ปรึกษามาชวยเตรียมเราใหพรอมสําหรับสงครามแหงอนาคต"
 SIK_march_into_khotan: "บุกโคตัน"
 SIK_march_into_khotan_desc: "วันนั้นมาถึงแลว! อีกไมนานซินเจียงทั้งหมดจะอยูภายใตการปกครองของเรา และทหารของหมา หูซาน จะถูกขับไลออกไป!"
 we_will_play_as_kum_tt: "เราจะเลนตอในฐานะ [KUM.GetFlag]§Y[KUM.GetNameDef]§!!"
 SIK_march_into_khotan_tt: "อีกไมนาน §Yเสบียงเพิ่มเติม§! จะมาถึงจาก §Y[SOV.GetNameDef]§!"
 SIK_a_united_sinkiang_clique: "กลุมซินเจียงที่เปนหนึ่งเดียว"
 SIK_a_united_sinkiang_clique_desc: "เมื่อขับไลกองพลที่ 36 ใหมออกไปไดและซินเจียงอยูภายใตการปกครองของเราทั้งหมดแลว บัดนี้เราเปนกองกําลังที่นาเกรงขามในภูมิภาค เราตองหันไปมองทางตะวันออกและปกปองบูรณภาพแหงดินแดนของสหายและพันธมิตรจากผูรุกรานญี่ปุน"
 SIK_pursue_further_soviet_integration: "มุงหลอมรวมกับโซเวียตยิ่งขึ้น"
 SIK_pursue_further_soviet_integration_desc: "เมื่อการรบสิ้นสุดลงและฝุนควันจางหาย เราตองหันไปมองภัยคุกคามอื่นๆ ภายใตปกคุมครองของสหภาพโซเวียต เราจะไมตองเผชิญภัยคุกคามจากการถูกรัฐบาลกลางผนวก นี่จึงเปนแนวทางที่สมเหตุสมผลที่สุดอยางชัดเจน"
 SIK_establish_the_xinjiangneft: "กอตั้งซินเจียงเนฟต"
 SIK_establish_the_xinjiangneft_desc: "กรมการเมือง[SOV.GetAdjective]ไดหารือประเด็น 'นํ้ามันซินเจียง' และมีมติใหเตรียมการพัฒนาแหลงนํ้ามันใกลพรมแดน[SOV.GetAdjective]ภายใตบริษัทของรัฐบาลเรา เพื่อการนี้ จะมีการจัดตั้งบริษัทรวมซินเจียง-โซเวียต 'ซินเจียงเนฟต' เพื่อชวยในการขุดคนทรัพยากรธรรมชาติในภูมิภาครวมกัน"
 SIK_established_the_xinjiangneft_flag: "กอตั้งซินเจียงเนฟตแลว"
 KHM_call_for_aid: "รองขอความชวยเหลือ"
 KHM_call_for_aid_desc: "เมื่อกองกําลังของเซิ่ง ชื่อไฉ มาประชิดหนาประตูบาน เราตองรองขอความชวยเหลือจากเพื่อนรวมชาติ มิฉะนั้นเราจะลมสลาย"
 KHM_strike_the_governor: "โจมตีผูวาการ"
 KHM_strike_the_governor_desc: "ทหารของเราพรอมแลว ขวัญกําลังใจของเราสูง เราตองฉวยโอกาสนี้ขับไลหุนเชิดโซเวียตออกจากมณฑลของเรา!"
 KHM_push_them_back: "ผลักดันพวกมันกลับไป"
 KHM_push_them_back_desc: "การรบเพื่อมณฑลซินเจียงตองไมจบลงดวยชัยชนะของพวกมัน เราจะผลักดันพวกมันกลับไปจนถึงสหภาพโซเวียต!"
 KHM_the_sinkiang_ma_clique: "กลุมตระกูลหมาแหงซินเจียง"
 KHM_the_sinkiang_ma_clique_desc: "ดวยความพายแพของเซิ่ง ชื่อไฉ และกลุมซินเจียงของเขา บัดนี้เราเปนผูปกครองเพียงผูเดียวของมณฑล เราตองเสริมสถานะของเราใหกลายเปนกองกําลังที่แข็งแกรงยิ่งขึ้นในภูมิภาค"
 KHM_kumul_rebellion_avenged: "ลางแคนใหกบฏคูมูลแลว"
 KHM_kumul_rebellion_avenged_desc: "ดวยความพายแพของเซิ่ง ชื่อไฉ และกลุมซินเจียงของเขา บัดนี้เราเปนผูปกครองเพียงผูเดียวของมณฑล กบฏคูมูลครั้งแรกที่ถูกบดขยี้อยางไมเปนธรรมไดรับการลางแคนแลวในที่สุด และเราสามารถหันไปฟนฟูมณฑลและขยายกองกําลังประจําการเพื่อรักษาเอกราชของเราไว"
 KHM_utilize_family_contacts: "ใชเสนสายในตระกูล"
 KHM_utilize_family_contacts_desc: "เราตองใชความสัมพันธใกลชิดกับกลุมตระกูลหมาอื่นๆ เพื่อขับไลเซิ่ง ชื่อไฉ ออกจากซินเจียงใหสิ้นซาก"
 KHM_undermine_kmt_rule: "บอนทําลายการปกครองของกกมินตั๋ง"
 KHM_undermine_kmt_rule_desc: "กกมินตั๋งไดปลนสะดมมณฑลและกดขี่ชาวทองถิ่นมานานเกินไปแลว ถึงเวลาที่เราจะเตรียมการขับไลกลุมตระกูลหมาผูกดขี่ออกจากโคตัน!"
 KHM_establish_the_kashgar_clique: "กอตั้งกลุมคาชการ"
 KHM_establish_the_kashgar_clique_desc: "กอนหนานี้เราพยายามตีตัวออกหางจากกกมินตั๋ง หากเราจะทําสิ่งนี้ไดอยางแทจริง เราตองเรียนรูจากตระกูลหมาและกอตั้งกลุมของเราเอง ถึงเวลาทําใหสิ่งนี้เปนจริง และรวมตัวภายใตรองผูบัญชาการทหารแหงภูมิภาคคาชการ มะหมุต มุฮิตี"
 KHM_shizangs_coup: "รัฐประหารของชือจาง"
 KHM_shizangs_coup_desc: "เมื่อการเตรียมการพรอมแลว และกรมทหารอุยกูรที่ 24 และ 25 ภายใตการควบคุมของมุฮิตีกําลังเคลื่อนพลไปลอมโคตัน เราก็เริ่มเคลื่อนไหวเพื่อขับไลผูนําชาวหุยออกจากเมืองได ขอเกียรติจงมีแดมะหมุต ชือจาง และขอใหรัฐเอมีรโคตันจงเจริญ!"
 KHM_shizangs_coup_tt: "§Yนายพลตระกูลหมา§!หลายคนจะ§Rออกไป§!และเขารวมกลุมตระกูลหมาอื่นๆ"
 KHM_take_control_of_zakat_and_waqf: "เขาควบคุมซะกาตและวะกัฟ"
 KHM_take_control_of_zakat_and_waqf_desc: "เพื่อหาทุนสําหรับการปกครองใหมของเรา เราอาจตองยืดหยุนกฎบางขอและเขาควบคุมองคกรการกุศลซะกาตและวะกัฟของโคตัน โดยโยกยายความมั่งคั่งของศาสนสถานทองถิ่นไปใชกับตําราเรียน การรักษาความสงบ ทหาร และครู"
 KHM_implement_jizyah: "บังคับใชญิซยะฮ"
 KHM_implement_jizyah_desc: "สิทธิของผูที่ไมใชมุสลิมถูกกําหนดไวอยางเขมงวดภายใตการบริหารแบบเกา ถึงเวลาปรับเรื่องเหลานี้ใหเขากับโลกสมัยใหม และพิสูจนใหราษฎรทุกคนเห็นวาเราเปนแผนดินที่รูแจง" 
 KHM_promote_jadidism: "สงเสริมลัทธิญะดีด"
 KHM_promote_jadidism_desc: "นักปฏิรูปและนักสมัยใหมนิยมอิสลามที่เปนสวนหนึ่งของขบวนการญะดีดใน [SOV.GetNameDef] กําลังถูกรัฐบาลปราบปรามอยางหนัก และเนื่องจากบุฆราเองก็เปนนักญะดีดตัวยง จึงนาจะเปนการดีที่จะใหที่ลี้ภัยแกพวกเขาในประเทศของเรา พรอมเปดใหพวกเขานําแนวคิดปฏิรูปบางสวนเขามาดวย"
 KHM_revive_the_basmachi_movement: "ฟนฟูขบวนการบัสมาชิ"
 KHM_revive_the_basmachi_movement_desc: "จนถึงป 1934 ขบวนการบัสมาชิไดตอสูกับกองกําลัง[SOV.GetAdjective]เพื่อปลดปลอยเอเชียกลางจากการปกครองแบบทรราช แมขบวนการของพวกเขาจะถูกบดขยี้ไปเกือบหมดแลว แตผูนําบางคนก็หลบหนีไปได เราควรพยายามติดตอนักสูเพื่ออิสรภาพเหลานี้และเชิญพวกเขามายังราชสํานักของเรา"
 KHM_rally_the_faithful: "รวมพลผูศรัทธา"
 KHM_rally_the_faithful_desc: "เพื่อใหประสบความสําเร็จในการรับประกันอํานาจปกครองตนเองจากรัฐตางชาติ เราตองรวมพลผูศรัทธาและจัดตั้งระเบียบทางทหารใหมในเมืองหลวงของเรา"
 KHM_indian_expeditionary_forces_plan: "แผนกองกําลังสํารวจอินเดีย"
 KHM_indian_expeditionary_forces_plan_desc: "ฝาย[ENG.GetAdjective]ไดเสนอแผนสงความชวยเหลือทางทหารจาก [RAJ.GetNameDef] มาใหเราหากเราถูกกองกําลังขาศึกโจมตี บางทีการเริ่มกระชับความสัมพันธกับพวกเขาอาจเปนเรื่องที่ชาญฉลาด"
 KHM_expand_the_madrasas: "ขยายโรงเรียนสอนศาสนา"
 KHM_expand_the_madrasas_desc: "เพื่อควบคุมประชาชนไดดีขึ้นและสอนวิถีที่พวกเขาควรดําเนินชีวิต เราควรเพิ่มงบประมาณใหสถาบันการศึกษาของชาวมุสลิมในประเทศของเรา"
 KHM_promote_anti_communism: "สงเสริมการตอตานคอมมิวนิสต"
 KHM_promote_anti_communism_desc: "การขับไลเซิ่ง ชื่อไฉ และพวกคอมมิวนิสตของเขาเปนเรื่องสําคัญที่สุด หากเราไมตองการตกอยูในมือของสาธารณรัฐโซเวียต ดังนั้นเราตองกวาดลางคอมมิวนิสตที่หลงเหลืออยูออกจากดินแดนของเรา"
 KHM_raise_additional_dungan_regiments: "จัดตั้งกรมทหารตุงกานเพิ่มเติม"
 KHM_raise_additional_dungan_regiments_desc: "กองทัพยังคงประกอบดวยชาวหุยเปนสวนใหญ ซึ่งสาบานความภักดีอยางสมบูรณตอผูบัญชาการของตน แมจะไมใชสิ่งที่ดีที่สุด  แตเราตองใชประโยชนจากสิ่งนี้ เพราะพวกเขาจะมีประโยชนอยางยิ่งในอีกหลายปขางหนา"
 KHM_indian_expeditionary_forces_plan_tt: "§Y[ENG.GetNameDefCap]§! และ §Y[RAJ.GetNameDef]§! จะมีแนวโนมสงอาสาสมัครมาชวยเรามากขึ้น"
 KHM_our_position_remains: "สถานะของเรายังคงอยู"
 KHM_our_position_remains_desc: "สงครามอาจไมไดเปนไปในทางที่เปนประโยชนตอเราทั้งหมด แตกลุมโคตันยังคงยืนหยัดอยู และกองพลที่ 36 ใหมก็พรอมกวาที่เคยสําหรับความขัดแยงที่กําลังจะมาถึง"
 CHI_sea_gain_warlord_support: "รับการสนับสนุนจากขุนศึก"
 CHI_sea_gain_warlord_support_desc: "เพื่อใหไดรับการมองวาเปนผูปกครองที่ชอบธรรมของจีน เราตองไดรับการสนับสนุนจากขุนศึกอื่นๆ กอน"
 CHI_allow_warlord_support_tt: "ปลดล็อกการตัดสินใจเพื่อรับอิทธิพลในฝายโดยแลกกับการใหประโยชนแกขุนศึก"
 CHI_sea_propaganda_campaigns: "การรณรงคโฆษณาชวนเชื่อ"
 CHI_sea_propaganda_campaigns_desc: "ดวยการใชการโฆษณาชวนเชื่ออยางมีประสิทธิภาพ เราจะแยงความสนใจจากรัฐบาลกลางได และอีกไมนานพวกเขาก็จะตกเปนของเรา"
 CHI_propaganda_decisions_tt: "ปลดล็อกการตัดสินใจเพื่อรับอิทธิพลในฝายผานการรณรงคโฆษณาชวนเชื่อ"
 CHI_sea_unified_army_structure: "โครงสรางกองทัพแบบรวมศูนย"
 CHI_sea_unified_army_structure_desc: "เพื่อยืนหยัดตอภัยคุกคามทั้งจากภายนอกและภายในอยางมีประสิทธิภาพ เราตองปฏิรูปกองทัพใหเปนหนวยอาชีพ ดวยความชวยเหลือจากที่ปรึกษาพรรคคอมมิวนิสต เราจะสามารถสรางกองทัพแดงของเราเอง และตานทานภัยคุกคามจากภายนอกไดดียิ่งขึ้น"
 CHI_sea_battle_for_china: "ศึกชิงจีน"
 CHI_sea_battle_for_china_desc: "เมื่อรัฐบาลกลางเบี่ยงเบนจากแนวทางที่ถูกตองของพรรคมากขึ้นเรื่อยๆ ก็ยิ่งชัดเจนวาหนทางเดียวที่จะกาวไปขางหนาคือการทวงคืนอํานาจ เราตองรบฝาไปจนถึงเมืองหลวงและยึดมันจากรัฐที่ทําใหเราผิดหวัง"
 CHI_sea_rally_the_warlords: "รวมพลขุนศึก"
 CHI_sea_rally_the_warlords_desc: "ขุนศึกเปนสวนสําคัญของการชิงอํานาจในจีน หากพวกเขาอยูฝายเรา การยึดอํานาจจะงายขึ้นมาก"
 CHI_sea_a_new_expedition: "การกรีธาทัพครั้งใหม"
 CHI_sea_a_new_expedition_desc: "ขณะที่รัฐบาลกลางกําลังสั่นคลอน เราตองระลึกถึงมรดกของการกรีธาทัพขึ้นเหนือและยึดเมืองหลวงทั้งหลาย เมื่อเมืองเหลานั้นอยูใตการปกครองของเรา ก็เปนเพียงเรื่องของเวลากอนที่เราจะไดรับการยอมรับเปนผูมีอํานาจอันชอบธรรมเหนือจีน"
 PRC_sea_inward_focus: "มุงเนนภายในประเทศ"
 PRC_sea_inward_focus_desc: "หนทางขางหนาไมไดอยูที่การเดินตามแนวทางโซเวียต เราตองพิสูจนความเปนอิสระจากพวกเขาและสรางเสนทางของเราเองเพื่อใหการปฏิวัติประสบความสําเร็จ"
 PRC_sea_rally_the_industry: "รวมพลภาคอุตสาหกรรม"
 PRC_sea_rally_the_industry_desc: "หากปราศจากชนชั้นแรงงานที่ใหความรวมมือและฐานอุตสาหกรรมที่ปอนการปฏิวัติของเรา มันก็จะมอดดับไปเฉยๆ ดังนั้นจึงจําเปนอยางยิ่งที่เราตองดึงพวกเขามาอยูฝายเรา"
 PRC_sea_reforming_our_ranks: "จัดระเบียบแถวของเราใหม"
 PRC_sea_reforming_our_ranks_desc: "เพื่อใหการปฏิวัติของเราประสบความสําเร็จ เราตองจัดระเบียบแถวของเราใหมและรวมพลชนชั้นชนบท หากปราศจากความชวยเหลือของพวกเขา เราจะไมมีกองทัพที่ใชการไดเลย แตหากพวกเขาอยูฝายเรา เราจะไดเปรียบเหนือคูตอสู"
 PRC_sea_forging_our_own_path: "สรางเสนทางของเราเอง"
 PRC_sea_forging_our_own_path_desc: "ยิ่งนานวันก็ยิ่งชัดเจนวาโคมินเทิรนไดทําใหนักปฏิวัติจีนผิดหวัง และเราตองจัดตั้งสหภาพของเราเอง ดวยสิ่งนี้ เราจะสามารถแผอํานาจออกไปนอกจีนไดในเวลาอันควร"
 PRC_sea_toe_the_soviet_line: "เดินตามแนวทางโซเวียต"
 PRC_sea_toe_the_soviet_line_desc: "เปนที่ชัดเจนแลววาการปฏิวัติจีนจะสําเร็จไดก็ดวยความชวยเหลือจากโซเวียตเทานั้น แมหลายคนในพรรคจะมีความเห็นตาง แตเวลาเทานั้นที่จะบอกไดวาพวกเขาถูกหรือไม"
 PRC_sea_aid_from_soviet_bolsheviks: "ความชวยเหลือจากบอลเชวิคโซเวียต"
 PRC_sea_aid_from_soviet_bolsheviks_desc: "เพื่อใหการปฏิวัติของเราประสบความสําเร็จ เราตองมีฐานอุตสาหกรรมที่รองรับ ดวยความชวยเหลือจากนักลงทุนโซเวียต เราจะสามารถเริ่มตนอุตสาหกรรมของเราเองได"
 PRC_sea_soviet_advisors: "ที่ปรึกษาโซเวียต"
 PRC_sea_soviet_advisors_desc: "โซเวียตมีสายลับหลายคนปฏิบัติการอยูในจีน เราตองดึงตัวพวกเขามาและใชความเชี่ยวชาญของพวกเขาหากเราจะเอาชนะรัฐบาลชาตินิยม"
 PRC_sea_industrialisation_of_nature: "อุตสาหกรรมแปรธรรมชาติ"
 PRC_sea_industrialisation_of_nature_desc: "เพื่อสรางเงื่อนไขสําหรับสังคมนิยม เราตองมีชนชั้นแรงงานอุตสาหกรรมเสียกอน ดวยความชวยเหลือจากโซเวียต เราจะสรางเงื่อนไขเหลานี้ไดเร็วขึ้น"
 PRC_sea_comintern_integration: "หลอมรวมกับโคมินเทิรน"
 PRC_sea_comintern_integration_desc: "เมื่อเงื่อนไขพรอมแลว ถึงเวลาที่จะหลอมรวมเขากับโคมินเทิรนอยางสมบูรณ"
 PRC_sea_new_economic_direction: "ทิศทางเศรษฐกิจใหม"
 PRC_sea_new_economic_direction_desc: "เมื่อสาธารณรัฐประชาชนของเราไดรับการประกาศและฝุนควันเริ่มจางลง ก็ถึงเวลาปรับทิศทางและปรับโครงสรางเศรษฐกิจใหม ดวยการวางแผนอยางรอบคอบ ในที่สุดเราจะแซงหนาเศรษฐกิจตะวันตกและกลายเปนมหาอํานาจที่ไมมีใครกลามองขาม"
 PRC_sea_move_capital: "ยายเมืองหลวง"
 PRC_sea_move_capital_desc: "หลังจากการกอตั้ง $PRC_proclaimed_communism$ เปนเรื่องธรรมดาที่เราจะยายที่ตั้งรัฐบาลและคืนชื่อเมืองเปนปกกิ่ง"
 china_communist_warlord_focus: "ผังยุทธศาสตรของจีนคอมมิวนิสต"
 china_nationalist_warlord_focus: "ผังยุทธศาสตรของจีนคณะชาติ"
 CHI_sea_develop_capital: "พัฒนา [ROOT.Capital.GetName]"
 CHI_sea_develop_capital_desc: "หากไมมีฐานอุตสาหกรรม เราจะไมมีทางรักษาสถานะของเราไวได ดังนั้นเราตองลงทุนในเมืองหลวงของเรา"
 CHI_sea_further_industrial_investment: "การลงทุนดานอุตสาหกรรมเพิ่มเติม"
 CHI_sea_further_industrial_investment_desc: "แมเราจะมีอุตสาหกรรมขนาดเล็ก แตก็ยังเทียบไมไดกับของรัฐบาลกลาง ดังนั้นเราตองลงทุนในอุตสาหกรรมของเราเพิ่มขึ้น"
 CHI_sea_develop_capital_arsenal: "ขยายคลังสรรพาวุธ [ROOT.Capital.GetName]"
 CHI_sea_develop_capital_arsenal_desc: "หากไมมีคลังสรรพาวุธ เราจะไมมีกองทัพ และหากไมมีกองทัพ เราจะไมมีรัฐ เพื่อความอยูรอด เราจึงตองขยายขีดความสามารถทางอุตสาหกรรมของเรา"
 CHI_sea_small_arms_production: "การผลิตอาวุธเล็ก"
 CHI_sea_small_arms_production_desc: "อาวุธเล็กคือกระดูกสันหลังของอุตสาหกรรมทหารของเรา หากไมมีมัน กองทัพของเราจะไรประโยชนและรัฐของเราจะพังทลายภายใตแรงกดดันใดๆ ดังนั้นเราจึงควรลงทุนในภาคสวนนี้เพิ่มเติม"
 CHI_sea_industrial_research_projects: "โครงการวิจัยดานอุตสาหกรรม"
 CHI_sea_industrial_research_projects_desc: "หากไมมีอุตสาหกรรมสมัยใหม เราจะลาหลังผูอื่น และไมนานก็จะถูกรัฐบาลกลางทิ้งหาง การใหทุนวิจัยวิธีการและเครื่องจักรที่ทันสมัยขึ้นจะชวยใหอุตสาหกรรมของเราทัดเทียมกับสวนอื่นของโลก"
 CHI_sea_expand_public_education: "ขยายการศึกษาสาธารณะ"
 CHI_sea_expand_public_education_desc: "หากประชากรไมสามารถเขาถึงการศึกษา เราก็จะลาหลังชาติอื่น เพื่อความรุงเรืองของชาติ เราจึงตองลงทุนในการศึกษาสาธารณะ"
 CHI_sea_fund_research_projects: "ใหทุนโครงการวิจัย"
 CHI_sea_fund_research_projects_desc: "เพื่อรักษาความไดเปรียบเหนือคูตอสู เปนเรื่องสําคัญที่เราตองรูและใชประโยชนจากความกาวหนาทางเทคโนโลยีลาสุดได การใหทุนโครงการวิจัยจะชวยใหเราทําเชนนั้นได พรอมกับชวยเหลือประชาชนของเราไปดวย"
 CHI_sea_rely_on_our_infantry: "พึ่งพาทหารราบของเรา"
 CHI_sea_rely_on_our_infantry_desc: "กองทัพที่เนนทหารราบไมเคยทําใหเราผิดหวัง และจะไมมีวันทําใหผิดหวัง เราจึงควรลงทุนในทหารราบมากขึ้นเพื่อใหไดเปรียบเหนือศัตรูที่อาจเกิดขึ้น"
 CHI_sea_modern_warfare: "สงครามสมัยใหม"
 CHI_sea_modern_warfare_desc: "อนาคตของสงครามไมไดอยูที่กองทัพที่เนนทหารราบอยางที่เรามีในวันนี้ เพื่อไมใหถูกศัตรูเอาชนะดวยการดําเนินกลยุทธและถูกทําลาย เราตองลงทุนในเทคโนโลยีใหม"
 CHI_sea_consolidate_our_rule: "รวบอํานาจการปกครอง"
 CHI_sea_consolidate_our_rule_desc: "แมเราจะมีอํานาจควบคุมมณฑลในนาม แตยังมีบางพื้นที่ที่อํานาจของเราเบาบาง เราควรพยายามเขาถึงพื้นที่เหลานี้เพื่อใหประชาชนรูวาใครคือผูปกครองพวกเขา"
 CHI_sea_fortification_efforts: "การเสริมปอมปราการ"
 CHI_sea_fortification_efforts_desc: "แมตอนนี้สถานะของเราจะยังมั่นคง แตอาจมีวันที่เราตองปองกันพรมแดนจนถึงคนสุดทาย จึงเปนที่ชัดเจนวาเราตองเสริมปอมปราการตามพรมแดนและขุดสนามเพลาะตั้งมั่น"
 CHI_sea_infantry_efforts: "การพัฒนาทหารราบ"
 CHI_sea_infantry_efforts_desc: "ทหารราบคือกระดูกสันหลังของกองทัพเรา ดวยการปรับปรุงวิธีการและมาตรฐานการฝก เราจะทําใหพวกเขาปฏิบัติการในการรบจริงไดดียิ่งขึ้น"
 CHI_sea_brigade_specialization: "ความเชี่ยวชาญเฉพาะของกองพลนอย" 
 CHI_sea_brigade_specialization_desc: "แมการมีกองทัพที่เหมาะกับภารกิจสวนใหญจะเปนพื้นฐานสูชัยชนะเหนือผูรุกราน แตก็จําเปนอยางยิ่งที่เราจะตองมุงเนนความเชี่ยวชาญเฉพาะในระดับหนึ่งดวย"
 CHI_sea_the_army: "กองทัพ[ROOT.GetAdjective]"
 CHI_sea_the_army_desc: "เมื่อการปฏิรูปกองทัพเสร็จสิ้น ในที่สุดเราก็พูดไดวาเราไมใชเพียงขุนศึกกับกลุมทหารของเขา แตเปนผูบัญชาการกับกองทัพของเขา พรอมรับมือภัยคุกคามใดๆ ที่อาจขวางทาง"
 CHI_crackdown_on_looting: "ปราบปรามการปลนสะดม"
 CHI_crackdown_on_looting_desc: "เพื่อใหมณฑลของเราพัฒนาไดอยางเหมาะสม เราตองหยุดทหารของเราจากการฉวยอาหารและเครื่องมือของชาวบานอยูตลอดเวลา และทําใหรัฐบาลสามารถบังคับใชกฎหมายและความยุติธรรมไดตามความจําเปนเพื่อรักษาความสงบ"
 XSM_the_military_governor: "ขาหลวงทหาร"
 XSM_the_military_governor_desc: "แมในนามประเทศของเราจะนําโดยหมา หลิน ขาหลวงพลเรือนแหงชิงไห แตหมา ปูฟาง ขาหลวงทหารและหลานชายของหมา หลิน ไดพยายามชิงอํานาจควบคุมมณฑลอยางสมบูรณมาระยะหนึ่งแลว ยังไมแนชัดวาเขาจะโคนลุงของตนไดสําเร็จหรือไม แตดวยการวางเกมบางอยางก็เปนไปไดแนนอน"
 XSM_a_hui_army: "กองทัพชาวหุย"
 XSM_a_hui_army_desc: "กองทัพภายใตการบังคับบัญชาของหมา ปูฟาง ประกอบดวยชาวหุยเปนสวนใหญ ซึ่งสาบานความภักดีอยางสมบูรณตอผูบัญชาการของตน พวกเขาจะมีประโยชนอยางยิ่งหากหมา ปูฟาง ตองยึดอํานาจดวยวิธีทางทหาร"
 XSM_sway_the_people: "โนมนาวประชาชน"
 XSM_sway_the_people_desc: "แมกองทัพจะอยูขางหมา ปูฟาง อยางมั่นคง แตประชาชนดูเหมือนจะชื่นชอบหมา หลิน มากกวา การพยายามโนมนาวพวกเขาจะเปนเรื่องสําคัญ แตหากไมมีเหตุการณรุนแรงเกิดขึ้น พวกเขาก็จะยังอยูฝายหมา หลิน ไปกอน"
 XSM_sweep_out_communists: "กวาดลางคอมมิวนิสต"
 XSM_sweep_out_communists_desc: "การขับไลจาง กั๋วเทา และพวกคอมมิวนิสตของเขาเปนเรื่องสําคัญที่สุด หากเราไมตองการตกอยูในมือของสาธารณรัฐโซเวียต ดังนั้นเราตองกวาดลางคอมมิวนิสตที่หลงเหลืออยูออกจากดินแดนของเรา"
 XSM_send_ma_lin_on_hajj: "สงหมา หลิน ไปประกอบพิธีฮัจญ"
 XSM_send_ma_lin_on_hajj_desc: "หมา หลิน รูดีวาหมดเวลาของเขาแลว แตการโคนเขาโดยไมมีเหตุผลจะยังคงทําใหประชาชนโกรธเคือง ดังนั้นเราควรบีบใหเขาสละตําแหนงโดยอางวาไปประกอบพิธีฮัจญ"
 XSM_the_civilian_governor_remains: "ขาหลวงพลเรือนยังคงอยู"
 XSM_the_civilian_governor_remains_desc: "แมหมา ปูฟาง ตองการอํานาจเต็ม แตก็ยิ่งชัดเจนวาเปนไปไมไดหากไมเสี่ยงตอการลุกฮือครั้งใหญของประชาชน อยางไรก็ตาม หมา หลิน ไดเสนอการประนีประนอมใหทั้งสองตําแหนงปกครองรวมกัน โดยเขาจะถอยไปรับบทผูนําเชิงสัญลักษณ และปูฟางจะเปนผูควบคุมกิจการสวนใหญโดยพฤตินัย"
 XSM_solidifying_control: "ตอกยํ้าการควบคุม"
 XSM_solidifying_control_desc: "บัดนี้เมื่อความขัดแยงภายในสิ้นสุดลง ถึงเวลาตอกยํ้าการปกครองเหนือชิงไหใหมั่นคงเพื่อหลีกเลี่ยงการบอนทําลายเสถียรภาพใดๆ อีก ไมวาจากกองกําลังภายในหรือภายนอก"
 XSM_sideline_family_conflicts: "พักความขัดแยงในตระกูลไว"
 XSM_sideline_family_conflicts_desc: "ตระกูลหมาเปนตระกูลใหญและควบคุมดินแดนกวางใหญ ในทางทฤษฎี การรวมตัวกันอาจสรางกองกําลังที่นาเกรงขามในภูมิภาค แตในความเปนจริง ตระกูลนี้เต็มไปดวยการทะเลาะเบาะแวงและความขัดแยง หากเราจะรวมตัวกัน เราตองทําใหแนใจกอนวาความขัดแยงเหลานี้จะไมขวางทางเรา"
 XSM_strengthening_our_position: "เสริมสถานะของเรา"
 XSM_strengthening_our_position_desc: "เราจะตองมีกองกําลังรบหากจะรวมตัวกัน เพราะความเปนไปไดของการปะทะดวยอาวุธนั้นมีอยูจริง และกองทัพของเรายังเล็กเกินไปสําหรับปฏิบัติการขนาดใหญใดๆ"
 XSM_demand_submission: "เรียกรองใหยอมสยบ"
 XSM_demand_submission_desc: "เราควรหลีกเลี่ยงความขัดแยงหากเปนไปได ทางที่ถูกตองคือการประกาศเจตนาของเราและใหโอกาสผูอื่นยอมจํานนกอนที่เราจะโจมตี"
 XSM_strike_at_the_detractors: "โจมตีพวกทรยศ"
 XSM_strike_at_the_detractors_desc: "สมาชิกคนอื่นในตระกูลไวใจไมได และการประกาศเจตนาจะยิ่งเปดโอกาสใหพวกเขาเตรียมตัว เราควรโจมตีกอน แลวคอยถามทีหลัง"
 XSM_a_united_ma_state: "รัฐตระกูลหมาที่เปนหนึ่งเดียว"
 XSM_a_united_ma_state_desc: "เมื่อทั้งตระกูลรวมกันภายใตธงผืนเดียว บัดนี้เราเปนกองกําลังที่ไมมีใครกลามองขาม ทั้งในระดับทองถิ่นและระดับโลก กลุมตระกูลหมาจะคงอยูพันป!"
 XSM_a_united_ma_state_tt: "กลุมตระกูลหมาที่เปนรัฐหุนเชิดของเราทั้งหมดจะถูก§Yผนวก§!และกลายเปน§Yดินแดนหลัก§! และเราจะไดรับ§Yนายพล§!ของพวกเขา"
 XSM_ma_qis_natural_successor: "ผูสืบทอดโดยชอบธรรมของหมา ฉี"
 XSM_ma_qis_natural_successor_desc: "แมหมา ปูฟาง บุตรชายของหมา ฉี อดีตขาหลวง จะเปนนักยุทธศาสตรทางทหารที่ปราดเปรื่องและกระหายอํานาจ แตเขาไมเหมาะที่จะปกครองมณฑล หมา หลิน นองชายของอดีตขาหลวง มีคุณสมบัติในการปกครองมากกวามาก เขาจะผลักดันการปฏิรูปของเขาไปจนสําเร็จ"
 XSM_recruit_salar_officers: "เกณฑนายทหารชาวซาลาร"
 XSM_recruit_salar_officers_desc: "ชาวซาลารเชื้อสายเตอรกิกแหงมณฑลชิงไหมีแววดานศิลปะการสงคราม จะมีการสงนายทหารไปยังอําเภอซวินฮวาเพื่อเสาะหาผูนําหนาใหมที่มีแวว และดูแลใหพวกเขาไดรับการฝกทางทหารอยางเหมาะสม"
 XSM_rebuild_the_ninghai_army: "สรางกองทัพหนิงไหขึ้นใหม"
 XSM_rebuild_the_ninghai_army_desc: "เพื่อนําความสงบเรียบรอยกลับคืนสูมณฑลทางใตและรักษาพรมแดนของเรา เราตองสรางกองทัพหนิงไหขึ้นใหม ดวยวิธีนี้ เรานาจะไดเปรียบในการปะทะกับชาวทิเบต"
 XSM_rebuilt_the_ninghai_army_flag: "สราง§Yกองทัพหนิงไห§!ขึ้นใหมแลว"
 KHM_established_the_kashgar_clique_flag: "กอตั้ง§Yกลุมคาชการ§!แลว" 

 KUM_victory_in_tihwa: "ชัยชนะที่ตีฮวา"
 KUM_victory_in_tihwa_desc: "ดวยการลมสลายของ [617.GetName] สถานะของเราในมณฑลไดมั่นคงอยางแทจริงแลว วันนี้เรายืนหยัดอยางผูมีชัย ขานจงเจริญ!"

 KUM_restore_yettishar: "ฟนฟูเยตติชาร"
 KUM_restore_yettishar_desc: "ดวยการควบคุมมณฑลซินเจียงอยางสมบูรณ บัดนี้เราควรสานตอความทะเยอทะยานของมุฮัมมัด ยะกูบ เบก และรวมมณฑลมุสลิมแหงภาคตะวันตกเฉียงเหนือเปนหนึ่งเดียว"

 MAN_tsr_expand_the_navy: "ขยายกองทัพเรือจักรวรรดิแมนจูกัว"
 MAN_tsr_expand_the_navy_desc: "แมเราจะยังตองพึ่งพาการสนับสนุนทางทะเลจากญี่ปุน แตการลงทุนใหมีมากกวากองทัพเรือลํานํ้าก็เปนเรื่องที่ชาญฉลาด ภายใตการนําของเรือธงไหเวย และดวยความรวมมืออยางใกลชิดกับพันธมิตร เราจะสามารถตานทานความพยายามใดๆ ในการรุกรานหรือจูโจมดินแดนของเราจากทะเลได"
 MAN_tsr_mangyo_tt: "§Y$MAN_showa_steel_works$§! และ §Y$MAN_south_manchuria_railway_company$§! จะถูกควบรวมเปน§Yบริษัทพัฒนาอุตสาหกรรมแมนจูเรีย§!"
 MAN_tsr_embrace_state_shintoism_tt: "ปลดล็อกการตัดสินใจเพื่อพัฒนาจิตวิญญาณแหงชาติ §Y$MAN_state_shintoism_dm$§!"
 MAN_tsr_promote_manchu_identity_tt: "ปลดล็อก §Y$MAN_incoporate_manchu_nationalism_decision$§!"
 MAN_tsr_strengthen_ties_with_nissan: "กระชับความสัมพันธกับนิสสัน"
 MAN_tsr_strengthen_ties_with_nissan_desc: "นิสสันเปนหุนสวนสําคัญของอุตสาหกรรมทั้งทางทหารและพลเรือนของเรา เราควรสรางความสัมพันธที่ใกลชิดยิ่งขึ้นกับพวกเขา เพื่อใหเรารักษาและขยายทั้งสองภาคสวนไดอยางงายดาย"
 MAN_tsr_mangyo: "มังเงียว"
 MAN_tsr_mangyo_desc: "บริษัทพัฒนาอุตสาหกรรมแมนจูเรีย หรือเรียกสั้นๆ วามังเงียว เปนความริเริ่มของโยชิสุเกะ ไอกาวะ ผูกอตั้งไซบัตสึนิสสัน ที่จะรวมมือกับรัฐบาลเพื่อสรางความรุงเรืองทางเศรษฐกิจใหแมนจูเรียยิ่งขึ้น โดยจะพัฒนาอุตสาหกรรมเชิงยุทธศาสตรบางประเภทกอน แลวคอยๆ ขยายไปสูภาคสวนอื่น"
  MAN_tsr_obedience: "เสริมความแข็งแกรงสมาคมคองคอรเดีย"
  MAN_tsr_obedience_desc: "บางคนเรียกเราวาเปนเพียงหุนเชิดของญี่ปุน แตพวกเขาเขาใจผิดโดยพื้นฐานเกี่ยวกับความสัมพันธอันใกลชิดและเทาเทียมของเรา ซึ่งมีสมาคมคองคอรเดียเปนแนวหนา การตอตานผูมีพระคุณของเราก็ไมตางจากลูกที่ตอตานพอแม"
  MAN_tsr_trading_illicit_goods: "คาสินคาผิดกฎหมาย"
  MAN_tsr_trading_illicit_goods_desc: "แมการคาสินคาผิดกฎหมายจะไมใชแหลงรายไดหลักของประเทศเรา แตก็สรางกําไรมหาศาล การปดมันลงคงเปนเรื่องโงเขลา แตหากปลอยไวโดยไมควบคุม อาจสงผลรายแรงตอทั้งสังคมแมนจูเรียและสังคมจีน"
  MAN_tsr_social_research_unit: "ศึกษากัสซะคุฉะ"
  MAN_tsr_social_research_unit_desc: "กัสซะคุฉะเปนองคกรสหกรณการเกษตรที่ดําเนินงานทั้งในญี่ปุนและแมนจูเรีย เราควรศึกษาองคกรเหลานี้เพื่อใหเขาใจวาเหตุใดจึงไดผล เพื่อจะนําไปประยุกตใชในบริบทอื่นได"
  MAN_tsr_further_mobilization: "ความพยายามระดมพล"
  MAN_tsr_further_mobilization_desc: "หากไมมีทหาร เราก็ไมมีกองทัพ เราตองผลักดันการระดมพลและการฝกเพิ่มเติม เพื่อใหเราสงกองทัพที่นาเกรงขามลงสนามได"
  MAN_tsr_strengthen_the_manchukuo_imperial_army: "เสริมความแข็งแกรงกองทัพจักรวรรดิแมนจู"
  MAN_tsr_strengthen_the_manchukuo_imperial_army_desc: "เราตองการกองทัพที่แข็งแกรงเพื่อเอาชนะคูตอสูและรักษาเอกราชของเรา การพึ่งพากองทัพคันโตมากเกินไปจะนําไปสูความลมสลายของเราในที่สุด หากจะมีชาติแมนจูเรียที่เสรี เราตองมีกองทัพกอน"
  MAN_tsr_expand_xingan_army: "ขยายกองทัพซิงอาน"
  MAN_tsr_expand_xingan_army_desc: "กองทัพซิงอานเปนกองกําลังสําคัญในกองทัพของเรา หากเราจะประสบความสําเร็จในการรบที่กําลังจะมาถึง การขยายกองทัพนี้ก็เปนเรื่องที่ชาญฉลาด"
  MAN_tsr_request_dalian: "ขอคืนตาเหลียน"
  MAN_tsr_request_dalian_desc: "ปจจุบันญี่ปุนยึดครองเมืองทาตาเหลียนของแมนจูเรีย ซึ่งตั้งอยูที่ปลายคาบสมุทรเหลียวตง ในฐานะสวนหนึ่งของดินแดนเชาคันโต อยางไรก็ตาม เราควรพยายามโนมนาวใหพวกเขาสงมอบเมืองนี้ใหรัฐบาลของเรา เพราะสําหรับพวกเขาแทบไมตางอะไร แตสําหรับเราจะเปนประโยชนมหาศาล"
  MAN_tsr_the_question_of_leadership: "ปญหาเรื่องผูนํา"
  MAN_tsr_the_question_of_leadership_desc: "แมปจจุบันเราจะอยูภายใตการปกครองของนายกรัฐมนตรีจาง จิ่งฮุย โดยผูอี๋เปนจักรพรรดิแตในนาม แตสิ่งนี้ยอมเปลี่ยนแปลงได หากกองทัพคันโตเห็นวาจําเปน พวกเขาอาจคืนอํานาจใหจักรพรรดิ หรือถึงขั้นตั้งจักรพรรดิของตนเองขึ้นมาและกันผูอี๋ออกไป" 
  MAN_tsr_empire_of_manchukuo: "จักรวรรดิแมนจูกัว"
  MAN_tsr_empire_of_manchukuo_desc: "แมนจูกัว หรือชื่ออยางเปนทางการคือจักรวรรดิแมนจูเรียใหญ ไมไดเปนมหาอํานาจโลกแตอยางใด แตเราก็สามารถสรางที่ทางของตนในภูมิทัศนของมหาเอเชียบูรพาได เราควรรักษาสถานะนี้ไว ไมหลงไปกับภาพลวงของความมั่งคั่งและความรุงโรจน แตมุงคนหาบทบาทของเราในโลกนี้"
  MAN_tsr_embrace_state_shintoism: "ยึดถือลัทธิชินโตแหงรัฐ"
  MAN_tsr_embrace_state_shintoism_desc: "ลัทธิชินโตแหงรัฐรับใชจักรวรรดิญี่ปุนไดเปนอยางดี สามารถระดมผูคนนับลานเพื่ออุดมการณ เราควรนํามาใชในดินแดนของเราเชนกัน แมในชวงแรกอาจเผชิญการตอตานก็ตาม"
  MAN_tsr_work_with_the_kempeitai: "รวมมือกับเคมเปไต"
  MAN_tsr_work_with_the_kempeitai_desc: "เคมเปไต สารวัตรทหารของญี่ปุน ปฏิบัติการอยูในแมนจูเรียเพื่อตอตานโจรและผูเห็นตางอื่นๆ อยางไรก็ตาม พวกเขาประสบความยากลําบากอยางมากเนื่องจากการสื่อสารกับทางการของเราไมดีและขาดความรูเกี่ยวกับพื้นที่ เราควรรวมมือกับพวกเขาเพื่อสรางหนวยที่มีประสิทธิภาพมากขึ้น"
  MAN_tsr_promote_manchu_identity: "สงเสริมอัตลักษณแมนจู"
  MAN_tsr_promote_manchu_identity_desc: "ชาวแมนจูเรียไมใชเพียงอีกชนชาติหนึ่งของจีน เราควรตอกยํ้าความผูกพันกับแผนดินนี้และสงเสริมชาตินิยมแมนจูเรียเพื่อแยกเราออกจากสวนอื่นของจีน ดวยวิธีนี้ เราจะรักษาเอกราชไดงายขึ้น พรอมกับเชื่อมโยงเราใกลชิดยิ่งขึ้นกับชาติยิ่งใหญแหงเอเชีย"
  MAN_tsr_claim_outer_manchuria: "อางสิทธิ์แมนจูเรียนอก"
  MAN_tsr_claim_outer_manchuria_desc: "การสูญเสียแมนจูเรียนอกใหแกรัสเซียยังคงเปนหนามยอกอกของนักชาตินิยมแมนจูเรียจนถึงทุกวันนี้ เราควรแกไขความผิดพลาดทางประวัติศาสตรนี้ดวยการทวงคืนและผนวกรวมดินแดนเหลานี้กลับเขาสูชาติแมนจูเรียที่เพิ่งถือกําเนิด"
  MAN_tsr_reclaim_our_lost_possessions: "ทวงคืนดินแดนที่สูญเสียไป"
  MAN_tsr_reclaim_our_lost_possessions_desc: "การสูญเสียแมนจูเรียนอกในสนธิสัญญาไอกุนและปกกิ่ง รวมถึงการที่โซเวียตยึดมองโกเลีย ยังคงเปนแผลในใจของรัฐเรา เราตองพลิกความผิดพลาดทางประวัติศาสตรนี้และยุติจักรวรรดิโซเวียตใหสิ้นซาก!"
  MAN_tsr_reclaim_our_lost_possessions_tt: "ปลดล็อกการตัดสินใจเพื่อผนวกรวมรัฐใน§Yแมนจูเรียนอก§! รัฐ[MON.GetFlag] §Y[MON.GetAdjective]§! และรัฐ[TAN.GetFlag] §Y[TAN.GetAdjective]§!"
  MAN_tsr_a_new_constitution: "รัฐธรรมนูญฉบับใหม"
  MAN_tsr_a_new_constitution_desc: "เผด็จการโดยกษัตริยไมเปนประโยชนตอผูใด เราควรรางรัฐธรรมนูญที่มอบอํานาจบางสวนใหจักรพรรดิ แตก็จํากัดพระราชอํานาจไวภายใตรัฐบาลที่มาจากการเลือกตั้งตามระบอบประชาธิปไตย"
  MAN_tsr_division_of_power: "การแบงแยกอํานาจ"
  MAN_tsr_division_of_power_desc: "เมื่อรางรัฐธรรมนูญเสร็จแลว ก็จะมีผลบังคับใช และมลทินจากรูปแบบการปกครองอันปาเถื่อน เชนเผด็จการทหารและเผด็จการโดยกษัตริย จะกลายเปนอดีต จักรวรรดิจีนจะเปนรัฐไมเพียงสําหรับผูแข็งแกรงและทรงอํานาจ แตเพื่อทุกคน"
  MAN_tsr_reestablish_the_qing_army: "ฟนฟูกองทัพชิง"
  MAN_tsr_reestablish_the_qing_army_desc: "หากไมมีกองทัพ เราจะไมมีทางรวมจักรวรรดิที่เคยเปนใหกลับมาเปนหนึ่งได เราควรไดแรงบันดาลใจจากกองทัพเกาของเรา แตก็ไมยึดติดกับขนบประเพณีมากเกินไป ศิลปะการสงครามกําลังเปลี่ยนแปลงและเราตองกาวตาม"
  MAN_tsr_question_the_emperors_authority: "ตั้งคําถามตอพระราชอํานาจของจักรพรรดิ"
  MAN_tsr_question_the_emperors_authority_desc: "แมผูอี๋จะยังไดรับการสนับสนุนพอสมควรจากผูที่ตอตานรัฐบาล แตก็ถูกวิจารณอยางกวางขวางถึงความเฉยเมยตอญี่ปุน เราควรใชกระแสนี้และกําจัดเขาออกจากภาพของแมนจูเรียเสรีโดยสิ้นเชิง"
  MAN_tsr_bandit_recruitment: "การเกณฑโจร"
  MAN_tsr_bandit_recruitment_tt: "ปลดล็อกการตัดสินใจ§Yการเกณฑโจร§!"
  MAN_tsr_bandit_recruitment_desc: "สิ่งที่เรียกวาโจรจํานวนมากที่ทองไปทั่วดินแดนของเรา แทจริงแลวคือนักรบกองโจรที่กําลังตอสูกับญี่ปุนอยางแข็งขัน เราควรรวมมือและใชประสบการณของพวกเขาหากเราจะมีโอกาสตอกรกับจักรวรรดิญี่ปุน"
  MAN_tsr_ally_bandit_leaders: "เปนพันธมิตรกับหัวหนาโจร"
  MAN_tsr_ally_bandit_leaders_tt: "ไดรับ 5 หนวยที่มีกองพัน§Yทหารราบ 5§! กองพัน\n"
  MAN_tsr_ally_bandit_leaders_desc: "การปรากฏตัวของกองทัพคันโตหมายความวาญี่ปุนสามารถแผอํานาจเหนือประเทศของเราไดอยางมาก อยางไรก็ตาม นี่ก็หมายความวามีผูคนจํานวนมากที่พรอมจับอาวุธขับไลพวกเขาออกจากแผนดินของเรา เราตองฉวยโอกาสนี้เพื่อชัยชนะของประชาชน"
  MAN_tsr_a_new_dawn_over_manchuria: "อรุณรุงใหมเหนือแมนจูเรีย"
  MAN_tsr_a_new_dawn_over_manchuria_desc: "ถึงเวลาแลว ทหารของเราพรอมแลว และกองรักษาการณญี่ปุนกําลังพังทลายภายใตการโจมตีระลอกใหมของฝายกบฏ หากเราจะขับไลผูรุกรานออกไปได ก็ตองเปนตอนนี้"
  MAN_kim_il_sung_tt: "นักปฏิวัติชาวเกาหลีบางคนอาจไดรับการสนับสนุนใหเขารวมการตอสู"
  MAN_tsr_depose_puyi: "ถอดถอนผูอี๋"
  MAN_tsr_depose_puyi_desc: "ผูอี๋ไดทําหนาที่ประมุขในนามแลว แตบัดนี้เขาเปนเพียงอุปสรรคตอประชาธิปไตยที่แทจริง การอยูภายใตกษัตริยจะยิ่งฝงรัฐของเราไวกับแนวคิดยุคกลางเรื่องอภิชนและชนชั้นสูง ดังนั้นจึงจําเปนอยางยิ่งที่ตองถอดเขาออกจากตําแหนง"
  MAN_tsr_the_new_beiyang_government: "รัฐบาลเปยหยางใหม"
  MAN_tsr_the_new_beiyang_government_desc: "กองทัพเปยหยางเคยนําสาธารณรัฐจีนจากที่ที่เรายืนอยูตอนนี้ หากเราจะนําประชาธิปไตยที่แทจริงมาสูจีน เราตองสวมบทผูสืบทอดของพวกเขา มิฉะนั้นเราจะถูกมองเปนเพียงรัฐนอกกฎหมายที่บริหารโดยโจร"
  MAN_cores_beiyang_tt: "ไดรับดินแดนหลักใน§Yจีนตอนเหนือ§!และ§Yมองโกเลียใน§!"
  MAN_tsr_reform_the_army: "ปฏิรูปกองทัพ"
  MAN_tsr_reform_the_army_desc: "กองกําลังปจจุบันของเราเปนเพียงกลุมคละเคลาของกองทัพกบฏตางๆ และเศษซากกองทัพแมนจูเรีย หากเราตองการหลีกเลี่ยงหายนะครั้งใหญในสงครามที่กําลังจะมาถึง เราตองปฏิรูปใหกลับเปนเหมือนที่เคยเปนกอน"
  MAN_tsr_beiyang_university: "มหาวิทยาลัยเปยหยาง"
  MAN_tsr_beiyang_university_desc: "หากไมมีการศึกษาที่เหมาะสม ประชาชนของเราจะขาดโอกาส และความพยายามดานการวิจัยของเราจะลาหลังสวนอื่นของจีนและที่อื่นๆ ดังนั้นเราควรกอตั้งมหาวิทยาลัยเพื่อเปนเกียรติแกพาน ฟู นายกรัฐมนตรีคนสุดทายของรัฐบาลเปยหยางเกา"
  MAN_tsr_the_southern_expedition: "การกรีธาทัพลงใต"
  MAN_tsr_the_southern_expedition_desc: "การกรีธาทัพขึ้นเหนือของกกมินตั๋งคือสิ่งที่เคยทําลายสาธารณรัฐอันงดงามของเรา เราควรพลิกความผิดพลาดนี้ดวยการเปดฉากกรีธาทัพลงใต และยุติรัฐลมเหลวที่ยึดครองหนานจิงอยูในขณะนี้เสียที"
  MAN_tsr_proclaim_the_republic_of_china: "ประกาศสาธารณรัฐจีน"
  MAN_tsr_proclaim_the_republic_of_china_desc: "เมื่อเมืองหลวงทั้งหมดอยูใตการควบคุมของเรา ในที่สุดเราก็สามารถประกาศตนเปนสาธารณรัฐจีนและผูสืบทอดโดยชอบธรรมของรัฐบาลเปยหยางได อนาคตจะเปนเชนไรยังตองรอดู แตตอนนี้เราไดนําประชาธิปไตยมาสูจีนทั้งหมดแลว และหวังวามันจะคงอยูเชนนี้ไปอีกพันป"
  MAN_tsr_finish_off_the_japanese_threat: "กําจัดภัยคุกคามจากญี่ปุนใหสิ้นซาก"
  MAN_tsr_finish_off_the_japanese_threat_desc: "ญี่ปุน ผูยึดครองดั้งเดิมของเรา ถูกปลอยใหลอยนวลมานานเกินไปแลว ถึงเวลาที่เราจะยุติละครตลกของพวกเขาและแสดงใหเห็นวารัฐใดมีสิทธิ์ปกครองเอเชีย"
  MAN_tsr_an_industrial_power: "มหาอํานาจทางอุตสาหกรรม"
  MAN_tsr_an_industrial_power_desc: "เมื่ออุตสาหกรรมของเราสามารถแขงขันกับตะวันตกไดในที่สุด เราควรผลักดันขยายมันใหมากยิ่งขึ้น ดวยสิ่งนี้ ในเวลาอันควรเราจะกลายเปนมหาอํานาจทางอุตสาหกรรมหลักของเอเชีย และตอจากนั้นก็ของทั้งโลก"
  MAN_tsr_zhao_shangzhis_coup: "รัฐประหารของจาว ชางจื้อ"
  MAN_tsr_zhao_shangzhis_coup_desc: "เมื่อฝุนควันจางลง ญี่ปุนจากไปและผูอี๋ถูกถอดถอน ก็เกิดสุญญากาศทางอํานาจขึ้นในแมนจูเรีย จาว ชางจื้อ และกองทัพสหพันธตอตานญี่ปุนภาคตะวันออกเฉียงเหนือของเขาไดรีบเขามาเติมเต็มชองวางนี้ และกําลังเรียกรองให [MAN.GetLeader] ลงจากตําแหนง"
  MAN_tsr_ally_the_soviet_republic: "เปนพันธมิตรกับสาธารณรัฐโซเวียต"
  MAN_tsr_ally_the_soviet_republic_desc: "มิตรสหายของเราในพรรคคอมมิวนิสตจีนทางตอนใตในสวนอื่นของจีนยอมตองการรวมมือกับเราอยางแนนอน เมื่อรวมมือกัน เราจะตอสูกับภัยคุกคามทั้งจากตางชาติและภายในไดดียิ่งขึ้นมาก"
  MAN_tsr_research_cooperation: "ความรวมมือดานการวิจัยกับพรรคคอมมิวนิสตจีน"
  MAN_tsr_research_cooperation_desc: "ปจจุบันการสื่อสารระหวางพื้นที่ตางๆ ที่พรรคของเรายึดครองแทบไมมีอยูจริง เราจึงควรประสานความพยายามดานการวิจัยภายในพรรคคอมมิวนิสตจีน เพื่อไมใหสวนใดลาหลัง"
  MAN_tsr_the_long_march_south: "การเดินทัพลงใต"
  MAN_tsr_the_long_march_south_desc: "ถึงเวลาแลว เมื่อเคลื่อนทหารขามพรมแดน เราจะไดเริ่มขั้นสุดทายของสงครามกลางเมืองจีน ยังเร็วเกินไปที่จะรูวาใครจะชนะ แตดวยการดําเนินกลยุทธอยางเชี่ยวชาญ ศัตรูของเราจะตามไมทันไดยาก"
  MAN_tsr_soviet_aid: "ความชวยเหลือจากโซเวียต"
  MAN_soviet_volunteers_tt: "[SOV.GetFlag] §Yสหภาพโซเวียต§! จะมีแนวโนมสงอาสาสมัครมาชวยเรามากขึ้น"
  MAN_tsr_soviet_aid_desc: "เมื่อสหภาพโซเวียตอยูทางเหนือและตะวันออกของเรา การจัดการขนสงทั้งยุทโธปกรณและกําลังคนมายังดินแดนของเรายอมไมยากนัก เราจึงควรโนมนาวใหพวกเขาชวยเหลือพันธมิตรทางอุดมการณในจีน"
  MAN_tsr_proclaim_the_peoples_republic: "ประกาศสาธารณรัฐประชาชน"
  MAN_tsr_proclaim_the_peoples_republic_desc: "เมื่อเมืองหลวงสําคัญของจีนอยูใตการควบคุมของเรา ถึงเวลาประกาศการกอตั้งสาธารณรัฐประชาชนจีนแลว ในสายตาของมหาอํานาจโลก เราจะไมเปนเพียงดินแดนชายขอบที่ไรระเบียบซึ่งนําโดยโจรและอาชญากรอีกตอไป แตจะเปนรัฐที่สมบูรณแบบ!"
  MAN_tsr_request_our_lost_territories: "ขอคืนดินแดนที่สูญเสียไป"
  MAN_tsr_request_our_lost_territories_tt: "ขอให [SOV.GetFlag] §Yสหภาพโซเวียต§! สงมอบดินแดนที่เคยอยูใตการควบคุมของจีน"
  MAN_tsr_request_our_lost_territories_desc: "ปจจุบันสหภาพโซเวียตครอบครองดินแดนหลายแหงที่เคยเปนของจีนและแมนจูเรีย หากเราจะมีความสัมพันธที่ใชการไดกับรัฐของพวกเขา ก็เปนการยุติธรรมที่จะขอดินแดนคืน หรืออยางนอยก็ยุติขอพิพาทนี้"
  MAN_tsr_persuade_the_IMPRP: "โนมนาว IMPRP"
  MAN_tsr_persuade_the_IMPRP_tt: "สมาชิกของ [MEN.Getflag] §Yพรรคปฏิวัติประชาชนมองโกเลียใน§! จะเริ่มสงครามกลางเมืองเมื่อเราประกาศเอกราช"
  MAN_tsr_persuade_the_IMPRP_desc: "พรรคปฏิวัติประชาชนมองโกเลียในยังไมใชกองกําลังหลักใน [MEN.GetName] ในขณะนี้ แตดวยการโนมนาวและความชวยเหลือจากฝงพรมแดนของเรา เราสามารถดึงพวกเขาเขารวมการปฏิวัติตอตาน [JAP.GetNameDef] และปลดปลอยพวกเขาไปพรอมกัน"
  MAN_tsr_raise_the_yong_ying: "จัดตั้งหยงอิ๋ง"
  MAN_tsr_raise_the_yong_ying_desc: "หยงอิ๋ง แปลตรงตัววา 'คายผูกลา' เปนกองทัพระดับภูมิภาครูปแบบหนึ่งในสมัยจักรวรรดิชิง ประกอบดวยกองอาสาสมัครทองถิ่น และตางจากกองทัพประจําการตรงที่ไดรับเงินทุนจากทองถิ่น กองอาสาเหลานี้มักทําหนาที่ปองกันตนเองในมณฑลตางๆ และรับใชเราไดดียิ่ง เราควรฟนฟูระบบนี้ แตปรับใหเหมาะกับสงครามสมัยใหม"
  MAN_tsr_raise_the_yong_ying_tt: "ปลดล็อกการตัดสินใจ§Yจัดตั้งกองอาสา§!เมื่ออยูในภาวะสงคราม"
  MAN_tsr_a_new_self_strengthening_movement: "ขบวนการเสริมสรางตนเอง"
  MAN_tsr_a_new_self_strengthening_movement_desc: "ขบวนการเสริมสรางตนเอง หรือขบวนการกิจการตะวันตก เปนชวงเวลาแหงการรับวัฒนธรรมตะวันตกในจักรวรรดิเกาของเรา จุดประสงคหลักคือการพัฒนาขีดความสามารถทางอุตสาหกรรมและการทหารหลังวิกฤตหลายครั้งที่เกือบทําลายชาติของเรา เราควรสานตอการปรับปรุงใหทันสมัยนี้เพื่อหลีกเลี่ยงหายนะใดๆ ที่อาจเกิดขึ้นในอนาคต"
  MAN_tsr_reestablish_the_gansu_braves: "ฟนฟูกองทหารผูกลาแหงกานซู"
  MAN_tsr_reestablish_the_gansu_braves_desc: "กองทหารผูกลาแหงกานซูเปนกองกําลังผสมของทหารมุสลิมจากกานซู เมื่อพื้นที่ที่ตระกูลหมาควบคุมตกอยูใตการควบคุมของเราในที่สุด เราควรฟนฟูกองทัพนี้และดึงนายพลของพวกเขามาชวยเราควบคุมพื้นที่"
  CHI_sea_one_china_policy_tt: "ปลดล็อกการตัดสินใจเพื่อผนวกรวมรัฐที่เคยเปนสวนหนึ่งของจีน"
  CHI_sea_annex_tuva: "ผนวกตูวา"
  CHI_sea_annex_tuva_desc: "ตูวาเคยเปนสวนหนึ่งของรัฐเรา แตหลังการปฏิวัติ รัสเซียไดขโมยพวกเขาไปจากเรา เราตองรวมพวกเขากลับคืนสูพี่นองทางใตและปลดปลอยพวกเขาจากเงื้อมมือของรัสเซีย"
  CHI_sea_push_into_manchuria: "บุกเขาแมนจูเรีย"
  CHI_sea_push_into_manchuria_desc: "การสูญเสียแมนจูเรียใหแกรัสเซียในสนธิสัญญาป 1858 และ 1860 เปนความอัปยศ และหากเราจะเปนมหาอํานาจจักรวรรดิ เราตองพลิกความผิดพลาดนี้"
  CHI_sea_dominate_siam: "ครอบงําสยาม"
  CHI_sea_dominate_siam_desc: "สยามเปนหนึ่งในไมกี่ชาติในเอเชียที่ยังไมตกอยูใตการยึดครองของมหาอํานาจตางชาติ เราควรปกปองพวกเขาจากมหาอํานาจตางชาติเหลานั้นตอไปดวยการเสนอความคุมครอง และแลกกับการเขาควบคุมประเทศของพวกเขา"
  SIC_the_sichuan_clique: "กลุมเสฉวน"
  SIC_the_sichuan_clique_desc: "กลุมเสฉวนอยูในสถานะที่นาสนใจ เพราะเปนดินแดนของขุนศึกหลายคนที่มีความคิดแตกตางกัน ซึ่งยึดโยงกันอยางหลวมๆ ดวยแนวคิดความเปนหนึ่งเดียวของมณฑล เราควรใชจุดแข็งที่แตกตางกันของขุนศึกเหลานี้เพื่อเติบโตและแข็งแกรงยิ่งกวาที่เปนอยู"
  SIC_the_domain_of_liu_wenhui: "อาณาเขตของหลิว เหวินฮุย"
  SIC_the_domain_of_liu_wenhui_desc: "หลิว เหวินฮุย อาและอดีตคูแขงของหลิว เซียง ไดสรางอาณาจักรเล็กๆ ของตนเองในมณฑลซีคัง เดิมทีเขาเปนผูวาการเสฉวน แตถูกโคนในป 1935 และนับแตนั้นก็ปกครองซีคังเหมือนแวนแควนที่เปนอิสระโดยพฤตินัย และอาจมีความทะเยอทะยานที่จะรวมซีคังทั้งหมดไวใตการปกครองของตน"
  SIC_develop_xikang: "พัฒนาซีคัง"
  SIC_develop_xikang_desc: "ซีคังมีประชากรเบาบางและเปนภูเขา จึงมักถูกมองขามเมื่อพูดถึงการพัฒนามณฑล เราควรลงทุนในพื้นที่นี้เพื่อใหไดใจประชาชนและพัฒนาฐานเศรษฐกิจของเราไปพรอมกัน"
  SIC_push_back_the_tibetans: "ผลักดันชาวทิเบตกลับไป"
  SIC_push_back_the_tibetans_desc: "ในที่สุดก็ถึงเวลาโจมตีแลว เราควรรุกขามแมนํ้าจินซาเขาสูชัมโดอยางเด็ดขาด ดังที่เราเคยขูไวในป 1932 และรวมซีคังไวใตการปกครองของเราในที่สุด!"
  SIC_the_armies_of_yang_sen: "กองทัพของหยาง เซิน"
  SIC_the_armies_of_yang_sen_desc: "หยาง เซิน เปนนายพลที่มีประวัติการทหารยาวนานแลว เคยเปนผูวาการเสฉวนในป 1924 ถึง 1925 กอนจะปะทะกับอังกฤษและเขารวมกกมินตั๋งในป 1926 เราควรไดใจเขาเพื่อเสริมขีดความสามารถทางทหารของเรา"
  SIC_anti_communism: "การตอตานคอมมิวนิสต"
  SIC_anti_communism_desc: "หยาง เซิน เปนผูสนับสนุนการตอตานคอมมิวนิสตอยางแข็งขัน และเคยตอสูอยางจริงจังเพื่อปองกันการแทรกซึมของคอมมิวนิสตในมณฑล เราควรยึดถือนโยบายนี้เพื่อไมใหเสฉวนตกไปอยูในมือที่ผิด"
  SIC_drive_out_the_japanese: "ขับไลญี่ปุน"
  SIC_drive_out_the_japanese_desc: "ความพยายามของญี่ปุนที่จะพิชิตชาวจีนตองยุติลงทันที แมชัยชนะทางทหารโดยสมบูรณเหนือพวกเขายังดูเปนไปไมได แตเราตองหยุดพวกเขาและพลิกสถานการณใหเด็ดขาด เราตองขับไลพวกเขาออกจากชาติอันรุงโรจนของเรา!"
  SIC_the_governor_of_sichuan: "ผูวาการเสฉวน"
  SIC_the_governor_of_sichuan_desc: "หลิว เซียง ผูวาการคนปจจุบันและหลานของหลิว เหวินฮุย ควบคุมสวนที่รํ่ารวยและสําคัญที่สุดของเสฉวน เราควรพัฒนาพื้นที่นี้เพิ่มเติม พรอมกับยกระดับขีดความสามารถทางเทคโนโลยี เพื่อสานตอการปฏิรูปของเขา"
  SIC_develop_chongqing: "พัฒนาฉงชิ่ง"
  SIC_develop_chongqing_desc: "ฉงชิ่งคือหัวใจของเสฉวน และเราควรพัฒนาอุตสาหกรรมที่นี่เพิ่มเติม หากเราจะยืนหยัดตอภัยคุกคามจากตางชาติหรือภายใน เราก็ตองมีฐานอุตสาหกรรมสนับสนุนดวย"
  SIC_armor_efforts: "การพัฒนายานเกราะ"
  SIC_armor_efforts_desc: "ขีดความสามารถดานยานเกราะและกองทัพอากาศที่เรามีอยูนั้นนอยเกินไปสําหรับความขัดแยงสมัยใหม เราควรพัฒนาเทคโนโลยีเพื่อตอกรกับภัยคุกคามจากตางชาติ"
  SIC_sichuan_still_stands: "เสฉวนยังคงยืนหยัด"
  SIC_sichuan_still_stands_desc: "แมรัฐบาลกลางจะหวังวาการเดินทัพสูฉงชิ่งหลังการเสียชีวิตของหลิว เซียง จะทําใหเรายอมจํานน แตก็ไมเปนเชนนั้น เรากลับพิสูจนตนเองวาเปนกองกําลังที่ชอบธรรมในจีน และสามารถยืนหยัดตอรัฐบาลกลางไดหากจําเปน"
  SND_unlock_loyalty_decision_tt: "§Yปลดล็อกการตัดสินใจเพื่อพิสูจนความภักดีของหาน ฟูจวี่ หรือแปรพักตรไปเขากับญี่ปุน§!"
  GXC_the_japanese_visit: "การเยือนของญี่ปุน"
  GXC_the_japanese_visit_desc: "ญี่ปุนใหความสนใจสองรัฐของเรามาระยะหนึ่งแลว โดยหวังวาการตอตานรัฐบาลกลางของเราจะเปดทางใหพวกเขาขยายอํานาจในจีนตอไป แมเราไมเห็นดวยกับญี่ปุนและตอตานการรุกคืบเขาสูแผนดินของเราอยางรุนแรง แตการรับของขวัญที่พวกเขาเสนอก็เปนเรื่องฉลาด เพื่อที่เราจะไดใชอาวุธของพวกเขาเองยอนเลนงานพวกเขาเมื่อถึงเวลา"
  GXC_question_chiangs_authority: "ตั้งคําถามตออํานาจของเจียง"
  GXC_question_chiangs_authority_desc: "เมื่อไมนานมานี้ เจียง ไคเชก พยายามแผอิทธิพลเหนือมณฑลของเรามากขึ้นเรื่อยๆ เพื่อควบคุมเรา เราควรตั้งคําถามวาเขามีอํานาจเหนือเราจริงหรือไม ในเมื่อเราเปนอิสระโดยพฤตินัย"
  GXC_the_scorched_earth_speech: "สุนทรพจนเผาผลาญแผนดิน"
  GXC_the_scorched_earth_speech_desc: "รัฐบาลกลางออนขอใหญี่ปุนมากเกินไป เราควรสูกับพวกเขาจนถึงคนสุดทาย เผาผลาญแผนดินหากเราถูกบีบใหลาถอย จักรวรรดิญี่ปุนตองไมมีวันควบคุมจีนทั้งหมดได ไมวาตองแลกดวยสิ่งใด"
  GXC_rumors_of_deposition: "ขาวลือการโคนอํานาจ"
  GXC_rumors_of_deposition_desc: "มีขาวลือแพรสะพัดวาเจียง ไคเชก มองวาเฉิน จี้ถัง เปนอิสระเกินไป จึงพยายามควบคุมมณฑลดวยการบีบใหเขาลาออก หากเปนความจริงก็นากังวลอยางยิ่ง และเราตองลงมือทันที!"
  GXC_denounce_chiang: "ประณามเจียง ไคเชก"
  GXC_denounce_chiang_desc: "ทาทีขึงขังแตไรความสามารถในการตานทานญี่ปุนของเจียง ไคเชก เพิ่งพิสูจนวาเขาออนแอและไมเหมาะที่จะปกครอง เราควรประณามเขาและเสนอทางเลือกอื่นที่ไมออนแอ"
  GXC_formation_of_the_nraja: "กอตั้ง NRAJA"
  GXC_formation_of_the_nraja_desc: "เราไดเห็นอีกครั้งวาเราไมมีทางเลือกอื่นนอกจากจัดตั้งการตอตานดวยอาวุธและเดินทัพสูหนานจิง หากเราจะปองกันไมใหญี่ปุนคอยๆ ยึดแผนดินของเรา เราจึงควรจัดตั้งกองทัพปฏิวัติแหงชาติตอตานญี่ปุน และเตรียมเดินทัพบุกหูหนาน"
  GXC_declare_opposition: "ประกาศตอตาน"
  GXC_declare_opposition_desc: "ถึงเวลาแลว เราควรประกาศตอตานรัฐบาลกลางและเดินทัพขึ้นเหนือ เพื่อบีบใหพวกเขาเจรจาหรือโคนพวกเขาใหสิ้นซาก สิ่งที่จะเกิดขึ้นตอไปยังไมแนนอน แตแมเราจะลมเหลว เราก็ไดสงสารที่หนักแนนออกไปแลว!"

  MA_develop_inter_province_ties: "พัฒนาความสัมพันธระหวางมณฑล"
  MA_develop_inter_province_ties_desc: "เพื่อปกครองและพัฒนาดินแดนอันกวางใหญและมีประชากรเบาบางของเราอยางมีประสิทธิภาพยิ่งขึ้น เราตองติดตอสมาชิกรวมตระกูลและสรางความสัมพันธที่ใกลชิดยิ่งขึ้นระหวางมณฑลที่เราปกครอง"
  cast_off_ma_ties_or_became_china_flag: " ไดตัดสายสัมพันธกับตระกูลหมา หรือไดกลายเปนรัฐบาลกลางชุดใหม"

  MA_unified_training_program: "โครงการฝกแบบรวมศูนย"
  MA_unified_training_program_desc: "เพื่อปกปองพรมแดนและควบคุมภาคตะวันออกเฉียงเหนืออยางเขมงวด สิ่งสําคัญที่สุดคือการพัฒนาคุณภาพทหารของเรา และประสานการเกณฑทหารเพื่อไมใหทหารใหมที่มีคาหลุดรอดไปตอหนาตอตา"

  MA_strenghten_regional_trade: "เสริมการคาระดับภูมิภาค"
  MA_strenghten_regional_trade_desc: "แมดินแดนของเราจะกวางใหญ แตเศรษฐกิจของเรายังขาดแคลนในหลายดาน เราตองประสานการคาและการสรางอุตสาหกรรมเพื่อบรรเทาปญหาเหลานี้"
  MA_strenghten_regional_trade_tt: "สมาชิกทุกรายไดรับ§Yโรงงานพลเรือน§! §G1§! แหงในเมืองหลวงของตน"

  MA_promises_of_mutual_defense: "คํามั่นวาดวยการปองกันรวมกัน"
  MA_promises_of_mutual_defense_desc: "เมื่อลงนามสนธิสัญญากอนหนาทั้งหมดแลว บัดนี้เราสามารถกาวไปสูการตราสนธิสัญญาปองกันรวมกัน ซึ่งจะรับประกันวาเราทุกคนจะเขาชวยเหลือกันและกันหากมหาอํานาจตางชาติใดๆ ไมวาจะเปนจีนหรือไมก็ตาม รุกลํ้าดินแดนของเรา"
  MA_promises_of_mutual_defense_tt: "กลุมตระกูลหมาทั้งหมดจะ§Yรับประกันเอกราช§!ของกันและกัน"

  MA_formalize_the_ma_clique_collective: "ทําใหสหพันธกลุมตระกูลหมาเปนทางการ"
  MA_formalize_the_ma_clique_collective_desc: "รากฐานทั้งหมดไดวางไวแลวเพื่อเปลี่ยนสหพันธกลุมตระกูลหมาจากการรวมตัวหลวมๆ ของขุนศึกหางไกล ใหกลายเปนสิ่งที่เปนหนึ่งเดียวอยางแนนแฟนยิ่งขึ้น เราควรทําใหองคกรนี้เปนทางการ และดูแลใหเราทุกคนใชนโยบายตางประเทศเดียวกัน"
  MA_clique_collective_faction: "สหพันธกลุมตระกูลหมา"

  XIC_northwest_bandit_suppression_headquarters: "กองบัญชาการปราบปรามโจร"
  XIC_northwest_bandit_suppression_headquarters_desc: "ปฏิบัติการตอตานคอมมิวนิสตในสานซีของเราหยุดชะงัก และในครึ่งหลังของป 1935 เพียงชวงเดียว เราสูญเสียกองพลทหารราบหนึ่งกองพลและกรมทหารหนึ่งกรมในภูมิภาคนี้ ดวยแรงกดดันที่เพิ่มขึ้นจากนายทหารและทหารของเราใหยุติการสูรบที่ไรผลกับคอมมิวนิสต และมุงกอบกูมณฑลที่สูญเสียไปในภาคตะวันออกเฉียงเหนือ เราจําเปนตองตัดสินใจ"

  XIC_discussions_in_luochuan: "การเจรจาที่ลั่วชวน"
  XIC_discussions_in_luochuan_desc: "คอมมิวนิสตไดสงหลี่ เคอหนง มาเปนตัวแทนเพื่อพบกับ $CHI_zhang_xueliang$ ที่ลั่วชวน พวกเขาตองการหารือความเปนไปไดในการยุติการสูรบและมุงความสนใจไปที่สิ่งที่ทั้งสองฝายมองวาเปนภัยคุกคามที่ใหญกวาตอจีน นั่นคือญี่ปุน เราจะตอบรับและรีบมุงหนาไปยังสถานที่ที่กําหนดโดยเร็ว"

  XIC_send_a_representative_to_sheng_shicai: "สงตัวแทนไปหาเซิ่ง ชื่อไฉ"
  XIC_send_a_representative_to_sheng_shicai_desc: "หลี่ เคอหนง ตกลงที่จะแสวงหาความรวมมือระหวางเรากับพรรคคอมมิวนิสตจีน โดยมีเงื่อนไขวาทั้งสองฝายตองติดตอตัวแทนของ[SOV.GetAdjective]และพยายามขอความชวยเหลือในการตอสูกับญี่ปุน เราควรใชเสนสายของเราใน [SIK.GetNameDef] เพื่อใหไดใจ [SOV.GetLeader]"

  XIC_non_agression_pact_with_the_cpc: "ไมรุกรานพรรคคอมมิวนิสตจีน"
  XIC_non_agression_pact_with_the_cpc_desc: "เพื่อพิสูจนความมุงมั่นตอการตอตานญี่ปุน เราควรพยายามยุติการสูรบไวชั่วคราว แม [CHI.GetLeader] ผูนิ่งนอนใจอาจไมพอใจกับการตัดสินใจนี้ก็ตาม เมื่อถึงเวลาอันควร เรานาจะโนมนาวผูนํา[CHI.GetAdjective]ใหรวมมือกับ [PRC.GetNameDef] ได"

  XIC_the_fushi_conference: "การประชุมฟูซือ"
  XIC_the_fushi_conference_desc: "ในการพบกันครั้งที่สอง [PRC.GetLeader] ตกลงสงหลี่เคอหนงและโจวเอินไหลเปนทูตไปยังฟูซือ เพื่อหารือถึงเงื่อนไขและการดําเนินการเพิ่มเติมที่จําเปนตอการโนมนาว [CHI.GetLeader] ใหเขารวมแนวรวมอยางเปนทางการ เวลาแหงการเอาชนะฝาย[JAP.GetAdjective]และทวงคืนดินแดนของกลุมเฟงเทียนใกลเขามาทุกที..."

  XIC_anti_japanese_national_salvation_agreement: "ขอตกลงกอบกูชาติตอตานญี่ปุน"
  XIC_anti_japanese_national_salvation_agreement_desc: "เมื่อบรรลุขอตกลงอยางเปนทางการในการยุติการสูรบในสานซีแลว ก็ถึงเวลาเสริมกําลังพรรคคอมมิวนิสตจีน เพื่อใหพวกเขามีอิทธิพลมากพอจะโนมนาว [CHI.GetLeader] วาการยุติสงครามกลางเมืองและการตั้งแนวรวมครั้งที่สองนั้นคุมคาสําหรับกกมินตั๋ง เราจึงควรลักลอบสงอาวุธและเงินทุนที่กกมินตั๋งมอบใหเราเขาไปยังเขตฐานที่มั่นโซเวียต เพื่อเสริมกําลังของพวกเขา"

  XIC_withdraw_forces_from_yanan: "ถอนกําลังออกจากเหยียนอัน"
  XIC_withdraw_forces_from_yanan_desc: "เพื่อจุดชนวนความโกรธของ [CHI.GetLeader] และทําใหแนใจวาผูนําพรรคกกมินตั๋งจะเดินทางมาซีอานเพื่อตรวจสอบกองทหารของเรา เราควรกอเหตุดวยการถอนกําลังออกจากเหยียนอันและปลอยใหพวกคอมมิวนิสตยึดเมืองได"

  XIC_form_the_anti_japanese_comrades_association: "จัดตั้งสมาคมสหายตอตานญี่ปุน"
  XIC_form_the_anti_japanese_comrades_association_desc: "เพื่อสรางกําลังของเราและโนมนาวกองทัพใหเลิกสูรบกับพรรคคอมมิวนิสตจีน เราตองจัดตั้งองคกรแกนกลางลับเพื่อรวมกองทัพภาคตะวันออกเฉียงเหนือและดึงผูที่มีแนวคิดตอตานญี่ปุนอยางแข็งขันเขามา ซึ่งจางตั้งชื่อวาสมาคมสหายตอตานญี่ปุน จางจะดํารงตําแหนงประธานสมาคม รวมมือกับคอมมิวนิสตตอสูกับญี่ปุนและฝกแกนนําตอตานญี่ปุน"

  XIC_invite_chiang_for_troop_inspections: "เชิญ [CHI.GetLeader] มาตรวจพล"
  XIC_invite_chiang_for_troop_inspections_desc: "ประเทศของเราออนแอลงเพราะการสูรบภายใน ขณะที่ญี่ปุนหมายตาดินแดนของเราอยางชัดเจน ถึงกระนั้น [CHI.GetLeader] กลับปฏิเสธที่จะรวมมือกับพรรคคอมมิวนิสตจีน และเรียกรองใหเราปราบโจรตอไปไมหยุด แมเราจะรองขออยางสิ้นหวัง มิฉะนั้นเราจะถูกยายลงใต เราตองบังคับใหฝายชาตินิยมและคอมมิวนิสตใชเหตุผลและตั้งแนวรวม"

  XIC_sixth_encirclement_campaign: "การรณรงคโอบลอมครั้งที่ 6"
  XIC_sixth_encirclement_campaign_desc: "แมภัยคอมมิวนิสตจะสรางความสูญเสียหนักใหเรา แตเราตองเตรียมการรุกอีกครั้ง เนื่องจาก [CHI.GetLeader] สั่งใหเราดําเนินการรณรงคโอบลอมตอไปอีก มีเพียงวิธีนี้ที่ผูนํา[CHI.GetAdjective]จะพอใจและยอมใหเราหันความสนใจไปทางตะวันออกเฉียงเหนือ"

  XIC_request_relocation_to_northeastern_command: "ขอยายไปกองบัญชาการภาคตะวันออกเฉียงเหนือ"
  XIC_request_relocation_to_northeastern_command_desc: "เมื่อภารกิจปราบโจรในสานซีเสร็จสิ้นแลว ก็ถึงเวลาเสนอแผนตอ [CHI.GetLeader] โดยเสนอให $CHI_zhang_xueliang$ รับบทบาทเปนปราการทางเหนือและผูพิทักษ [608.GetName] ซึ่งปจจุบันอยูในการครอบครองของ [HBC.GetLeader] ดวยวิธีนี้ เราจะกาวหนาสูเปาหมายในการฟนฟูกลุมเฟงเทียนที่เคยยิ่งใหญได"

  XIC_invite_zuolin_loyalsits: "เชิญผูภักดีตอจั้วหลิน"
  XIC_invite_zuolin_loyalsits_desc: "ทหารและนายพลจํานวนมากที่รับใชในกองทัพของ [MAN.GetNameDef] เคยภักดีตอจางจั้วหลิน บิดาของ [ROOT.GetLeader] ถึงเวลาที่เราจะติดตอพวกเขาอยางลับ ๆ และเชิญใหกลับมายัง [ROOT.GetNameDef]"

  XIC_reestablish_the_zhili_army: "ฟนฟูกองทัพจื๋อลี่"
  XIC_reestablish_the_zhili_army_desc: "กองทัพจื๋อลี่ของกลุมเฟงเทียนเคยเปนกองทัพที่จั้วหลินวางกําลังไวในพื้นที่ซึ่งปจจุบันคือมณฑลเหอเปยและเปยผิง เราควรฟนฟูองคกรนี้ขึ้นใหม เพื่อเปนบันไดกาวสําคัญในการสรางกลุมขึ้นใหมตั้งแตฐานราก"

  XIC_recruit_mancurian_bandits: "เกณฑโจรแมนจูเรีย"
  XIC_recruit_mancurian_bandits_desc: "สิ่งที่เรียกวาโจรจํานวนมากที่ทองไปทั่วแมนจูเรียแทจริงแลวคือนักรบกองโจรที่กําลังตอสูกับ [JAP.GetNameDef] และ [MAN.GetNameDef] เราควรเปนพันธมิตรและใชประโยชนจากประสบการณของพวกเขา หากตองการมีโอกาสจริงในการตานภัยจากตะวันออก"
  XIC_recruit_mancurian_bandits_tt: "ไดรับ 3 หนวยที่มีกองพัน§Yทหารราบ 5§! กองพัน และ 2 หนวยที่มีกองพัน§Yทหารมา 5§! กองพัน\n"

  XIC_restore_the_glory_of_the_fengtian_army: "ฟนฟูความรุงโรจนของกองทัพเฟงเทียน"
  XIC_restore_the_glory_of_the_fengtian_army_desc: "เมื่อฟนฟูกองทัพจื๋อลี่เสร็จสิ้นแลว ก็ถึงเวลาสรางกองทัพเฟงเทียนขึ้นใหมอยางเหมาะสมใหแข็งแกรงดังเดิม ในฐานะกองกําลังที่ครองความเปนใหญในจีนตอนเหนือ อีกไมนานวันอันรุงโรจนของเราจะกลับคืนมา!"

  XIC_reclaim_the_lost_birthright: "ทวงคืนมรดกที่สูญเสียไป"
  XIC_reclaim_the_lost_birthright_desc: "ในที่สุดก็ถึงเวลาขับไลภัยรายฝาย[MAN.GetAdjective]และ[JAP.GetAdjective]ออกจากบานเกิด และทวงคืนแมนจูเรียเปนของเรา! เราควรเปดการบุกขึ้นเหนือโดยเร็ว และยึดภูมิภาคนี้กอนที่กองกําลังของพวกเขาจะรูตัว"

  XIC_restore_the_homeland: "ฟนฟูมาตุภูมิ"
  XIC_restore_the_homeland_desc: "เมื่อทวงคืนมุกเดนเมืองหลวงเกาของเราไดแลว ก็ถึงเวลาที่ $CHI_zhang_xueliang$ จะรับตําแหนงขุนศึกแหงแมนจูเรียและจอมทัพแหงรัฐบาลทหารจีนอยางสมบูรณ และฟนฟูกลุมเฟงเทียนสูอํานาจดังที่เคยมี เฟงเทียนจงเจริญ จอมทัพหนุมจงเจริญ!"
  XIC_restore_the_homeland_tt: "ไดรับ§Yดินแดนหลัก§!ในดินแดนทั้งหมดที่§Yกลุมเฟงเทียน§!เคยครอบครองในชวงที่กวางใหญที่สุด"

  XIC_revive_the_beiyang_government: "ฟนฟูรัฐบาลเปยหยาง"
  XIC_revive_the_beiyang_government_desc: "ในฐานะทายาทโดยชอบธรรมของรัฐบาลพลัดถิ่นของรัฐบาลเปยหยาง ในที่สุดเราก็ประกาศตนเปนสาธารณรัฐจีนโดยชอบธรรมได อนาคตจะเปนอยางไรยังตองรอดู แตตอนนี้เราไดนําประชาธิปไตยมาสูจีนทั้งปวงแลว และหวังวาจะคงอยูเชนนี้ไปอีกพันป"

  CHI_tsr_repoen_the_natioal_assembly: "เปดสภาแหงชาติอีกครั้ง"
  CHI_tsr_repoen_the_natioal_assembly_desc: "สภาแหงชาติเปนฝายนิติบัญญัติของรัฐบาลเปยหยาง ซึ่งถูกหยวนซื่อไขปดลงอยางถาวร และตอมาถูกแทนที่ดวยสภานิติบัญญัติ หากเราตองการฝายนิติบัญญัติแบบประชาธิปไตยที่เสรีอยางแทจริงในประเทศ เราจะพอใจเพียงการปลอยใหสภานิติบัญญัติดําเนินงานตอไปไมได ตองวางระบบที่มีหลายมิติ เพื่อใหเจตจํานงของประชาชนอยูเหนือสิ่งอื่นใด!"

  CHI_tsr_form_a_preparatory_committee: "จัดตั้งคณะกรรมการเตรียมการ"
  CHI_tsr_form_a_preparatory_committee_desc: "หากไมขจัดขอเสียของการแยงชิงตําแหนงประมุขแหงรัฐเสียกอน ประเทศจะไมมีวันสงบสุข ดังนั้น ดังที่เคยทําเมื่อวันที่ 19 สิงหาคม 1915 ตองจัดตั้งคณะกรรมการเตรียมการโดยมีเปาหมายสถาปนาระบอบราชาธิปไตยภายใตรัฐธรรมนูญ มีเพียงเชนนั้นความขัดแยงภายในและความวุนวายทางการเมืองจึงจะถูกขจัดไดอยางแทจริง!"

  CHI_tsr_legacy_of_the_hongxian_emperor: "มรดกแหงจักรพรรดิหงเซี่ยน"
  CHI_tsr_legacy_of_the_hongxian_emperor_desc: "หยวนซื่อไขอาจทิ้งประเทศไวในสภาพยํ่าแย เต็มไปดวยขุนศึกและกระแสสาธารณรัฐนิยม แตเจตนาของเขาดี เขาจึงรับบทบาทเปนจักรพรรดิหงเซี่ยนเพื่อมอบความอุดมสมบูรณแหงรัฐธรรมนูญแกชาติ และกลายเปนผูพิทักษแหงชาติ หากจะมีผูใดควรคาแกการเคารพ ก็คือเขา และเราตองพยายามฟนฟูมรดกของเขากอนที่เขาจะถูกกาลเวลาลืมเลือน"

  CHI_tsr_coronation_at_the_temple_of_heaven: "ราชาภิเษกที่หอฟาเทียนถาน"
  CHI_tsr_coronation_at_the_temple_of_heaven_desc: "เพื่อสรางอํานาจบารมี [ROOT.GetLeader] ตองฟนฟูองคประกอบของลัทธิขงจื๊อแหงรัฐ และรื้อฟนพิธีกรรมทางศาสนาของรัฐสมัยราชวงศชิง ดังนั้น จึงเปนประโยชนสูงสุดตอ [ROOT.GetLeader] ที่จะเขารวมพิธีกรรมในฐานะจักรพรรดิที่หอฟาเทียนถานของราชวงศชิง และในที่สุดก็ประกอบพิธีราชาภิเษกที่นั่น"

  CHI_tsr_outlaw_the_kmt_and_cpc: "ประกาศใหกกมินตั๋งและพรรคคอมมิวนิสตจีนผิดกฎหมาย"
  CHI_tsr_outlaw_the_kmt_and_cpc_desc: "ระบอบสาธารณรัฐไมเหมาะกับสภาพของชาติจีน ดังนั้น จะตองไมปลอยใหกลุมปฏิวัติที่เคยโคนลมจักรวรรดิและผงาดขึ้นจากเถาถานของมันกลับมามีอํานาจอีก ประเทศจะฟนคืนความรุงโรจนในอดีตไดภายใตการนําที่เปนเอกภาพเทานั้น การตอตานภายในจึงตองไดรับการจัดการอยางรวดเร็ว"

  CHI_tsr_restoration_of_the_chinese_empire: "การฟนฟูจักรวรรดิจีน"
  CHI_tsr_restoration_of_the_chinese_empire_desc: "ถึงเวลาแลวที่จะฟนฟูชาติของเรา และนําชาติออกจากศตวรรษแหงความอัปยศที่ถูกบังคับใหตองทนรับ ถึงเวลาแลวที่จะทวงที่ทางของเราในกิจการระหวางประเทศ และยืนหยัดอยางองอาจในจักรวาล ถึงเวลาแลวที่ [ROOT.GetLeader] จะรับบทบาทมหาจักรพรรดิแหงจักรวรรดิจีน!"

  CHI_tsr_adopt_the_twelve_symbols: "ใชตราสิบสองสัญลักษณ"
  CHI_tsr_adopt_the_twelve_symbols_desc: "ตราแผนดินสิบสองสัญลักษณเคยเปนตราประจํารัฐของจักรวรรดิจีน และจะกลับมาเปนเชนนั้นอีกครั้ง ตรานี้อิงจากสัญลักษณโบราณของลวดลายทั้งสิบสอง และดวยพลังของมัน พระราชอํานาจของจักรพรรดิจะเปนที่รูจักทั่วแผนดิน ดวยมังกรเขียวและหงสเฟงหวง ขอพระประสงคของจักรพรรดิจงสัมฤทธิ์ผล!"

  CHI_tsr_reinstate_the_new_imperial_code: "นําประมวลกฎหมายจักรวรรดิใหมกลับมาใช"
  CHI_tsr_reinstate_the_new_imperial_code_desc: "ในชวงที่หยวนขึ้นครองราชย อาริงะ นางาโอะ ที่ปรึกษาดานกฎหมายของเขาไดรางประมวลกฎหมายจักรวรรดิใหม โดยอิงตามแบบจักรวรรดิญี่ปุน แมเราไมตองการยึดตามรากฐานกฎหมายของรัฐอันธพาลเชนนั้นอยางใกลชิดนัก แตก็ชัดเจนวามันจะใหผลตามที่ตองการ ดวยเหตุนี้ เราควรรางรัฐธรรมนูญฉบับใหมโดยอิงจากประมวลกฎหมายนี้"

  CHI_tsr_reestablish_xinhua_palace: "ฟนฟูพระราชวังซินหัว"
  CHI_tsr_reestablish_xinhua_palace_desc: "เมื่อขึ้นครองราชย หยวนซื่อไขไดเปลี่ยนชื่อที่พํานักจงหนานไหขางพระราชวังตองหามเปนพระราชวังจีนใหม และเลือกเปนที่ประทับ จึงเปนการสมควรที่ [ROOT.GetLeader] จะใชแนวทางเดียวกันและเดินตามรอยเขา"

  CHI_tsr_reclaim_the_mandate_of_heaven: "อางอาณัติแหงสวรรค"
  CHI_tsr_reclaim_the_mandate_of_heaven_desc: "ชัยชนะที่ผานมาในสงครามทวงคืนเมืองหลวงจักรวรรดิไดแสดงใหเห็นชัดวาสวรรคเองไดตัดสินแลววาจักรพรรดิทรงธรรมและคูควรกับบัลลังกสวรรค ขอสงสัยใด ๆ วาพระองคไมใชผูปกครองโดยชอบธรรมของจีนทั้งปวงตองมลายไปเมื่อเผชิญหลักฐานอันทวมทนเชนนี้"

  CHI_tsr_five_races_under_one_union: "หาชนชาติในสหภาพเดียว"
  CHI_tsr_five_races_under_one_union_desc: "หากราชวงศใหมของเราจะอยูรอดในปตอ ๆ ไป เราตองผนวกหลักการของสาธารณรัฐที่หยวนซื่อไขใชกาวขึ้นสูอํานาจเขามาดวย ผานหลักการของสาธารณรัฐหาสี การอยูรวมกันอยางกลมกลืนของกลุมชนตาง ๆ ในภูมิภาคภายใตชาติเดียวจะเปนจริงได"

  CHI_tsr_zhonghua_minzu: "จงหัวหมินจู"
  CHI_tsr_zhonghua_minzu_desc: "เพื่อสรางรัฐที่ประสบความสําเร็จตอไป เราตองปลุกชาตินิยมจีนโดยโยงกับแนวคิดการสรางชาติและความผูกพัน แสดงใหประชาชนเห็นอยางไดผลวาพวกเขามีหนาที่ตองจงรักภักดีตอจักรพรรดิและรัฐบาลของ [ROOT.GetNameDef]"

  CHI_tsr_reestablish_the_beiyang_army: "ฟนฟูกองทัพเปยหยาง"
  CHI_tsr_reestablish_the_beiyang_army_desc: "กองทัพเปยหยางกอตั้งโดยหยวนซื่อไขในป 1895 และเปนหัวใจของการปฏิรูประบบทหารที่ลาสมัยของราชวงศชิงอยางทั่วดาน เราควรทําเชนเดียวกัน และปฏิรูปกองทัพเพื่อหลีกเลี่ยงการฉอฉลและความไรประสิทธิภาพที่ฝงอยูในระบบที่กกมินตั๋งสรางไว"

  CHI_tsr_reestablish_the_wuwei_corps: "ฟนฟูกองพลอูเวย"
  CHI_tsr_reestablish_the_wuwei_corps_desc: "กองพลอูเวยเปนกองกําลังรักษาความปลอดภัยของปกกิ่งและพระราชวังตองหาม กอตั้งขึ้นจากความพยายามของราชสํานักชิงที่จะสรางกองทัพแบบตะวันตกพรอมอาวุธทันสมัย หลังพายแพในสงครามจีน-ญี่ปุน เพื่อปกปองพระชนมชีพของจักรพรรดิและนครแหงสวรรค เราตองใชมาตรการแบบเดียวกัน"

  CHI_tsr_never_another_national_protection_war: "ไมมีสงครามพิทักษชาติอีกตอไป"
  CHI_tsr_never_another_national_protection_war_desc: "สงครามพิทักษชาติเกิดขึ้นระหวางป 1915 ถึง 1916 เปนความพยายามของนายพลที่ไมภักดีและพวกสาธารณรัฐนิยมที่จะโคนลมการปกครองโดยชอบธรรมของจักรพรรดิหงเซี่ยน เพื่อใหแนใจวาจะไมเกิดขึ้นอีก เราตองปราบปรามขุนศึกที่ปกครองตนเองและกองทัพอิสระอยางรวดเร็ว และทําใหอํานาจทั้งหมดอยูในมือของโอรสแหงสวรรค!"

  CHI_tsr_tianxia: "เทียนเซี่ย"
  CHI_tsr_tianxia_desc: "แผนดินทั้งปวงบนโลกนี้ถูกกําหนดใหเปนของจักรพรรดิแหงสวรรคของเราดวยหลักแหงระเบียบที่เปนสากลและชัดแจง ศูนยกลางของแผนดินนี้คือราชสํานัก[ROOT.GetAdjective]และจักรพรรดิ ในที่สุดก็ถึงเวลาทวงที่ทางของเราในฐานะอาณาจักรกลาง และในฐานะแหลงกําเนิดที่แทจริงของอารยธรรมมนุษย!"

  CHI_tsr_the_reorganied_government: "รัฐบาลที่จัดตั้งใหม"
  CHI_tsr_the_reorganied_government_desc: "เมื่อระบอบ [CHI.GetLeader] ลมสลายและลาถอยไปทางตะวันตกอยางขี้ขลาด เราจึงเปนรัฐจีนโดยชอบธรรม เพื่อยืนยันสิ่งนี้ [ROOT.GetLeader] ไดไปเยือนสุสานซุนยัตเซ็นและประกาศวาจะยึดมั่นในหลักการสาธารณรัฐที่ทานเคยวางไว"

  CHI_tsr_military_industrial_collaboration: "ความรวมมือทางทหาร"
  CHI_tsr_military_industrial_collaboration_desc: "กองทัพของเราขาดแคลนทั้งกําลังพลและยุทโธปกรณ หลายสวนตองใชเพียงยุทโธปกรณที่ยึดมาได เราตองแกไขขอบกพรองนี้ดวยการรวมมือกับญี่ปุนและจัดตั้งคลังแสงของเราเอง"

  CHI_tsr_industrial_expansion_cooperation: "การขยายอุตสาหกรรม"
  CHI_tsr_industrial_expansion_cooperation_desc: "หากไมมีอุตสาหกรรมและทรัพยากรที่สนับสนุน จีนจะไมมีวันรุงเรืองในฐานะชาติ เราตองพยายามพัฒนาขีดความสามารถทางอุตสาหกรรม หากจะยืนหยัดตอกรกับตะวันตก"

  CHI_tsr_expand_the_nanjing_army: "ขยายกองทัพนานกิง"
  CHI_tsr_expand_the_nanjing_army_desc: "เราคาดหวังไดวากองกําลังในนามของเราไมเกินหนึ่งในสิบที่จะภักดีตอเรา เมื่อเปนเชนนั้น เราตองสรางกองกําลังที่ภักดีอยางแทจริงภายใตการนําของผูนําผูยิ่งใหญของเรา"

  CHI_tsr_promote_tridemism: "ยึดถือลัทธิไตรราษฎร"
  CHI_tsr_promote_tridemism_desc: "หลักไตรราษฎรที่ซุนยัตเซ็นวางไว ไดแก ชาตินิยม ประชาธิปไตย และการกินดีอยูดีของประชาชน เราควรสืบสานมรดกของทาน พรอมทั้งรับหลักการของเราเองเพื่อสะทอนธรรมชาติของรัฐเราไดดียิ่งขึ้น"

  CHI_tsr_peace: "สันติภาพ"
  CHI_tsr_peace_desc: "เราตองมุงสูสันติภาพดวยทุกวิถีทางที่จําเปน แมจะหมายถึงการทรยศหลักการนี้ในระยะสั้นก็ตาม เราตองเอาชนะทุกคนที่ขวางทางความรุงเรืองของจีน"

  CHI_tsr_anti_communism: "ตอตานคอมมิวนิสต"
  CHI_tsr_anti_communism_desc: "ลัทธิคอมมิวนิสตคือภัยรายของชาติเรา และพวกกองโจรก็เปนหนามยอกอกของรัฐบาลเรา เราตองตอสูกับอุดมการณนี้และกําจัดมันใหสิ้นซาก แมจะตองสละชีวิตเพื่ออุดมการณนี้ก็ตาม"

  CHI_tsr_national_construction: "การกอสรางชาติ"
  CHI_tsr_national_construction_desc: "จีนจะไมมีวันรุงเรืองอยางแทจริงไดหากไมมีการขยายตัวทางอุตสาหกรรมระลอกใหม หากปราศจากกระดูกสันหลังที่คํ้าจุน เราจะไมมีวันกลายเปนชาติที่จีนควรจะเปนไดเลย"

  CHI_tsr_pan_asianism: "ลัทธิแพนเอเชีย"
  CHI_tsr_pan_asianism_desc: "เปนเรื่องธรรมดาที่เราจะรับเอาอุดมการณแพนเอเชียมาใช เพราะเราเปนชาติพี่นองของญี่ปุน และซุน ยัตเซ็นเองก็เคยประกาศไววาชาติเอเชียทั้งหลายควรรวมใจกันขับไลนักลาอาณานิคม สงครามครั้งนี้มิใชเพียงการตอสูในจีน แตเปนการตอสูที่ใหญกวานั้นเพื่อขับไลชาวตะวันตกออกจากแผนดินของเรา"

  CHI_tsr_establish_the_tewu: "กอตั้งเทอู"
  CHI_tsr_establish_the_tewu_desc: "เราไมอาจพึ่งพาเพียงหนวยสืบราชการลับของญี่ปุนในการตามลาผูเห็นตางได เราจึงควรสรางหนวยงานของเราเอง ดวยความชวยเหลือจากที่ปรึกษาชาวญี่ปุน เราจะไมเพียงฝกสายลับของเราเองได แตอีกไมนานเราจะมีหนวยขาวกรองเปนของตนเอง"

  CHI_tsr_embrace_japanese_cultural_institutions: "รับเอาสถาบันทางวัฒนธรรมญี่ปุน"
  CHI_tsr_embrace_japanese_cultural_institutions_desc: "เพื่อใหความรวมมือกับญี่ปุนแนนแฟนยิ่งขึ้น โดยมีเปาหมายคือเอเชียที่เปนหนึ่งเดียวตอตานผูรุกรานตางชาติ เราควรหลอหลอมวัฒนธรรมรวมกัน โดยรับเอาบางสวนของวัฒนธรรมญี่ปุนมาเพื่อใหเราใกลชิดกันมากขึ้น"
  CHI_tsr_embrace_japanese_cultural_institutions_tt: "ปลดล็อกการตัดสินใจเพื่อพัฒนาจิตวิญญาณแหงชาติ §Y$RNG_state_shintoism_dm$§!"

  CHI_tsr_a_new_chinese_identity: "อัตลักษณจีนใหม"
  CHI_tsr_a_new_chinese_identity_desc: "เมื่อชะตากรรมของจีนอยูในมือเราแลว เราควรเสริมสรางสถานะของเราและพิสูจนวาเราเปนหุนสวนที่คูควร และเปนสาธารณรัฐจีนที่แทจริงตามที่ซุน ยัตเซ็นไดวาดฝนไว"

  CHI_tsr_our_place_in_the_sphere: "บทบาทของเราในวงไพบูลย"
  CHI_tsr_our_place_in_the_sphere_desc: "เมื่อเรากลายเปนหุนสวนที่แทจริงของญี่ปุน มิใชเพียงรัฐบริวารอีกตอไป เราควรหาที่ทางของเราในวงไพบูลยรวมกันและในมหาเอเชียบูรพาโดยรวม จีนจะกลับมาเปนมหาอํานาจโลกอีกครั้ง!"

  CHI_tsr_deepen_our_collaboration: "กระชับความรวมมือ"
  CHI_tsr_deepen_our_collaboration_desc: "ภายใตการชี้นําของจักรวรรดิญี่ปุน เราไดรับชัยชนะอันยิ่งใหญเหนือผูรุกราน เราควรกระชับความรวมมือกับพวกเขาใหลึกซึ้งยิ่งขึ้น เพื่อใหเปาหมายเอเชียที่เปนหนึ่งเดียวเปนจริง"

 YUN_rally_around_long_yun: "รวมพลังเบื้องหลังหลง ยฺหวิน"
 YUN_rally_around_long_yun_desc: "ขณะที่ภาคเหนือถูกปกครองโดยเผด็จการหัวรุนแรงที่ไลตามอุดมการณของตนโดยไมสนราคาที่ตองจาย ภูมิภาคของเรากลับมั่นคงและพลเมืองตางมองวาเปนปอมปราการแหงประชาธิปไตย ดวยเศรษฐกิจที่เติบโตและการปฏิรูปทางสังคม การศึกษา และการเมือง ดังนั้นเราควรรวมพลังสนับสนุนสถาปนิกผูสรางปาฏิหาริยนี้ หลง ยฺหวิน!"

 YUN_expand_local_infrastructure: "ขยายโครงสรางพื้นฐานทองถิ่น"
 YUN_expand_local_infrastructure_desc: "เพื่อใหการสัญจรทั่วมณฑลของเราเปนไปอยางสะดวก เราตองลงทุนในโครงสรางพื้นฐานที่ทนทานตอภูมิประเทศภูเขาเชนของเรา ดวยวิธีนี้สินคาก็จะขนสงระหวางเมืองตาง ๆ ไดมากขึ้นดวย"

 YUN_strive_for_self_sufficiency: "มุงสูการพึ่งพาตนเอง"
 YUN_strive_for_self_sufficiency_desc: "เพื่อใหประชาธิปไตยของเรารุงเรืองอยางแทจริง เราตองแนใจวาจะไมพึ่งพาความชวยเหลือจากพวกนักอุดมการณทางเหนือมากเกินไป และสามารถยืนหยัดไดดวยตนเองในปตอ ๆ ไป"

 YUN_a_land_of_mountains: "ดินแดนแหงขุนเขา"
 YUN_a_land_of_mountains_desc: "ยูนนานเปนดินแดนแหงขุนเขา และประชาชนของเราไดเรียนรูและปรับตัวใหใชชีวิตและสูรบในดินแดนอันโหดรายเชนนี้มาชานาน สิ่งนี้จะเปนประโยชนแกเราอยางแนนอนเมื่อถึงเวลาอันควร"

 YUN_political_reforms: "การปฏิรูปการเมือง"
 YUN_political_reforms_desc: "เพื่อบริหารรัฐของเราใหดียิ่งขึ้น เราตองทําใหกระบวนการทางการเมืองปลอดจากคอขวดและการทุจริตใหมากที่สุด และใหเศรษฐกิจไดประโยชนจากขาราชการของเรา มิใชในทางกลับกัน"

 YUN_eduational_reforms: "สงเสริมการปฏิรูปการศึกษา"
 YUN_eduational_reforms_desc: "ยุคการกํากับดูแลประชาชนถูกเลื่อนออกไปในภาคเหนือ แตหากเราปรารถนาใหความฝนของดร.ซุนเปนจริง เราตองสานตอมัน แมจะเปนเพียงที่นี่ในมณฑลของเราเองก็ตาม"

 YUN_the_democratic_fortress: "ปอมปราการแหงประชาธิปไตย"
 YUN_the_democratic_fortress_desc: "เมื่อการปฏิรูปทั้งหมดเสร็จสิ้น กลาวไดอยางเต็มปากวาเราคือปราการแหงประชาธิปไตยทามกลางภูมิทัศนการเมืองอันโหดรายของจีน บัดนี้เราสามารถเริ่มมองออกไปภายนอก และดูวาจะนําแสงสวางทางปญญาของเราไปสูจิตใจใหม ๆ ไดหรือไม"

 YUN_strengthen_burmic_ties: "กระชับสัมพันธกับพมา"
 YUN_strengthen_burmic_ties_desc: "ประชากรทองถิ่นของเรามีความผูกพันทั้งกับจีนและพมาผานประชากรที่พูดภาษาตระกูลโลโล-พมา ในฐานะบุตรของถูซือผูยิ่งใหญ หลง ยฺหวินตองนําประชาธิปไตยลงไปสูทางใตดวย เพื่อปลดปลอยพวกเขาจากพันธนาการของลัทธิอาณานิคม"




