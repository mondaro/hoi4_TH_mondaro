 large_plane_airframe_desc: "โครงเครื่องบินขนาดใหญที่มีพื้นที่เหลือเฟอ สามารถติดตั้งเครื่องยนตไดถึงหกเครื่องและบรรทุกนํ้าหนักจํานวนมากในระยะทางไกล"
