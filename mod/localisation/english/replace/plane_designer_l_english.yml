 AIR_TITLE_MOTHERSHIP: "เครื่องบินแม"
 AIR_TITLE_MOTHERSHIP_DESC: "เครื่องบินแมคืออากาศยานขนาดใหญที่ออกแบบมาเพื่อบรรทุกและปลอยเครื่องบินขนาดเล็กเขาสูการรบ ชวยขยายระยะปฏิบัติการไดไกลเกินกวาที่เครื่องบินขับไลแตละลําจะทําไดดวยตัวเองอยางมาก"
