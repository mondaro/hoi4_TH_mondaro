 medium_plane_airframe_0: "โครงเครื่องบินขนาดกลางยุคระหวางสงคราม"
 medium_plane_airframe_0_desc: "แมจะบรรทุกนํ้าหนักไดมากในระยะทางไกล แตศักยภาพในการพัฒนาตอยอดของโครงเครื่องบินนี้มีจํากัดอยางมาก"
 medium_plane_airframe_1: "โครงเครื่องบินขนาดกลางพื้นฐาน"
 medium_plane_airframe_1_desc: "ดวยการนําเทคโนโลยีใหมหลายอยางที่เพิ่งพัฒนาขึ้นมาใช โครงเครื่องบินนี้จึงมีขีดความสามารถสูงกวาเครื่องบินขนาดใกลเคียงกันรุนกอน ๆ อยางมาก"
 medium_plane_airframe_2: "โครงเครื่องบินขนาดกลางปรับปรุง"
 medium_plane_airframe_2_desc: "ดวยการใชประโยชนจากเทคโนโลยีการผลิตสมัยใหม โครงเครื่องบินนี้ชวยใหเครื่องบินบรรทุกนํ้าหนักไดมากขึ้นในระยะทางที่ไกลขึ้น"
 medium_plane_airframe_3: "โครงเครื่องบินขนาดกลางขั้นสูง"
 medium_plane_airframe_3_desc: "ออกแบบมาเพื่อเพิ่มสมรรถนะและนํ้าหนักบรรทุกใหไดสูงสุด โครงเครื่องบินนี้คือสุดยอดของเครื่องบินที่ใชเครื่องยนตแบบดั้งเดิม"
 medium_plane_airframe_4: "โครงเครื่องบินขนาดกลางสมัยใหม"
 medium_plane_airframe_4_desc: "ดวยแนวโนมที่เครื่องบินไอพนจะครองความเปนใหญ วิศวกรจึงเริ่มคิดคนวิธีสรางโครงเครื่องบินที่ออกแบบโดยคํานึงถึงการขับเคลื่อนดวยไอพน"
