 large_plane_airframe_0: "โครงเครื่องบินขนาดใหญยุคระหวางสงคราม"
 large_plane_airframe_0_desc: "โครงเครื่องบินขนาดใหญมากนี้มีพื้นที่เหลือเฟอสําหรับบรรทุกระเบิดหรือถังเชื้อเพลิง อยางไรก็ตาม เห็นไดชัดวาศักยภาพในการพัฒนามีจํากัดอยางมาก เครื่องบินทิ้งระเบิดทางยุทธศาสตรรุนใหมกําลังจะปรากฏขึ้นในไมชา"
 large_plane_airframe_1: "โครงเครื่องบินขนาดใหญพื้นฐาน"
 large_plane_airframe_1_desc: "โครงเครื่องบินนี้ออกแบบมาเพื่อทดสอบศักยภาพของเครื่องบินทิ้งระเบิดทางยุทธศาสตรอยางแทจริง ซึ่งสามารถโจมตีเปาหมายทางอุตสาหกรรมลึกเขาไปในดินแดนขาศึก และนําลูกเรือกลับมาไดอยางปลอดภัย"
 large_plane_airframe_2: "โครงเครื่องบินขนาดใหญปรับปรุง"
 large_plane_airframe_2_desc: "เมื่อแนวคิดเครื่องบินทิ้งระเบิดทางยุทธศาสตรไดรับการพิสูจนแลว โครงเครื่องบินนี้จึงออกแบบมาเพื่อเพิ่มนํ้าหนักบรรทุกและระยะบิน พรอมทั้งมีศักยภาพเพียงพอสําหรับการพัฒนาตอในอนาคต"
 large_plane_airframe_3: "โครงเครื่องบินขนาดใหญขั้นสูง"
 large_plane_airframe_3_desc: "ไดรับการปรับแตงเพื่อการบินระยะไกลมากที่ระดับความสูงมาก โครงเครื่องบินนี้สามารถบรรทุกนํ้าหนักจํานวนมากเขาไปถึงใจกลางดินแดนขาศึกได"
 large_plane_airframe_4: "โครงเครื่องบินขนาดใหญสมัยใหม"
 large_plane_airframe_4_desc: "การขับเคลื่อนดวยไอพนมอบสมรรถนะที่กาวกระโดดอยางมหาศาล โครงเครื่องบินนี้ออกแบบมาเพื่อใชประโยชนจากจุดนั้น"
 large_plane_maritime_patrol_plane_airframe_0: "เครื่องบินลาดตระเวนทางทะเลยุคระหวางสงคราม"
 large_plane_maritime_patrol_plane_airframe_0_desc: "กองเรือตองการเครื่องบินพิสัยไกลเพื่อคนหาขาศึกที่อยูหางไกลจากชายฝง แมจะคอนขางลาสมัย แตโครงเครื่องบินนี้ก็มีระยะบินเพียงพอที่จะครอบคลุมพื้นที่มหาสมุทรอันกวางใหญ"
 large_plane_maritime_patrol_plane_airframe_1: "เครื่องบินลาดตระเวนทางทะเลพื้นฐาน"
 large_plane_maritime_patrol_plane_airframe_1_desc: "การมาถึงของเครื่องบินประจําเรือบรรทุกเครื่องบินที่ทรงพลังยิ่งขึ้น ทําใหจําเปนตองคนหาและทําลายกองเรือขาศึกที่อยูหางไกลจากชายฝง ขั้นแรกคือการคนหาพวกมันกลางมหาสมุทร ซึ่งจําเปนตองใชเครื่องบินชนิดใหม"
 large_plane_maritime_patrol_plane_airframe_2: "เครื่องบินลาดตระเวนทางทะเลปรับปรุง"
 large_plane_maritime_patrol_plane_airframe_2_desc: "ภัยคุกคามสองดานจากเรือดํานํ้าและเรือลาดตระเวนจูโจมทําใหตองลาดตระเวนพื้นที่มหาสมุทรอันกวางใหญ โครงเครื่องบินนี้ไดรับการปรับแตงมาเพื่อภารกิจนี้โดยเฉพาะ"
 large_plane_maritime_patrol_plane_airframe_3: "เครื่องบินลาดตระเวนทางทะเลขั้นสูง"
 large_plane_maritime_patrol_plane_airframe_3_desc: "เรดารและเครื่องตรวจจับอื่น ๆ ทําใหสามารถคนหากองเรือขาศึกไดแมในสภาพอากาศเลวรายหรือในคืนที่มืดมิด แตอุปกรณใหมทั้งหมดนี้ตองการโครงเครื่องบินที่ใหญขึ้นเพื่อบรรทุก"
 large_plane_maritime_patrol_plane_airframe_4: "โครงเครื่องบินลาดตระเวนทางทะเลสมัยใหม"
 large_plane_maritime_patrol_plane_airframe_4_desc: "เมื่อเขาสูยุคขีปนาวุธ เครื่องบินลาดตระเวนทางทะเลตองสามารถปฏิบัติการไดไกลจากชายฝงยิ่งขึ้นและนานยิ่งขึ้น"
 cv_small_plane_airframe_0: "โครงเครื่องบินประจําเรือบรรทุกเครื่องบินยุคระหวางสงคราม"
 cv_small_plane_airframe_0_desc: "ติดตั้งตะขอเกี่ยวลงจอดและฐานลอที่เสริมความแข็งแรง โครงเครื่องบินนี้จึงสามารถปฏิบัติการจากเรือบรรทุกเครื่องบินได"
 cv_small_plane_airframe_1: "โครงเครื่องบินประจําเรือบรรทุกเครื่องบินพื้นฐาน"
 cv_small_plane_airframe_1_desc: "ดวยการนําเทคโนโลยีใหมที่พัฒนาสําหรับเครื่องบินภาคพื้นดินมาใช โครงเครื่องบินนี้จึงมีขีดความสามารถไมแพกัน แตสามารถขึ้นบินจากดาดฟาเรือบรรทุกเครื่องบินได"
 cv_small_plane_airframe_2: "โครงเครื่องบินประจําเรือบรรทุกเครื่องบินปรับปรุง"
 cv_small_plane_airframe_2_desc: "เพื่อใหทันกับพัฒนาการของการบินภาคพื้นดิน โครงเครื่องบินนี้จึงออกแบบดวยเทคโนโลยีใหมเพื่อเพิ่มระยะบินและสมรรถนะ"
 cv_small_plane_airframe_3: "โครงเครื่องบินประจําเรือบรรทุกเครื่องบินขั้นสูง"
 cv_small_plane_airframe_3_desc: "ลักษณะอันเขมงวดของการบินจากเรือบรรทุกเครื่องบินจํากัดขนาดและขีดความสามารถของโครงเครื่องบิน โครงเครื่องบินนี้คือขีดสุดที่โครงเครื่องบินซึ่งใชเครื่องยนตแบบดั้งเดิมจะทําได"
 cv_small_plane_airframe_4: "โครงเครื่องบินประจําเรือบรรทุกเครื่องบินสมัยใหม"
 cv_small_plane_airframe_4_desc: "โครงเครื่องบินนี้ออกแบบมาเพื่อใชประโยชนจากแรงขับที่เพิ่มขึ้นของเครื่องยนตไอพน และนํามาใชกับการบินนาวี"
