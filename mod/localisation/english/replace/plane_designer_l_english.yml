 early_bombs: "ระเบิด"
 early_bombs_desc: "นับตั้งแตชวงแรกของมหาสงคราม เครื่องบินถูกนํามาใชทิ้งวัตถุระเบิดใสเปาหมายของขาศึกมากขึ้นเรื่อย ๆ เมื่อเวลาผานไป สิ่งนี้ไดพัฒนาจนกลายเปนสวนสําคัญพื้นฐานของสงครามทางอากาศ"
 heavy_bombs: "ระเบิดหนัก"
 heavy_bombs_desc: "สงครามสมัยใหมทําใหเครื่องบินตองใชระเบิดที่ใหญขึ้นเรื่อย ๆ โจมตีเปาหมายของขาศึก เมื่อเวลาผานไป สิ่งนี้ไดพัฒนาจนกลายเปนสวนสําคัญพื้นฐานของสงครามทางอากาศ"
 armor_piercing_bombs: "ระเบิดเจาะเกราะ"
 armor_piercing_bombs_desc: "เรือรบไดเพิ่มเกราะดาดฟาอยางตอเนื่อง เพื่อเอาชนะสิ่งนี้ จําเปนตองพัฒนาระเบิดชนิดพิเศษที่สามารถเจาะทะลุเกราะดังกลาวได"
 air_torpedoe_1: "ตอรปโดยิงจากอากาศ"
 air_torpedoe_1_desc: "ตอรปโดนํ้าหนักเบาสามารถบรรทุกไดโดยอากาศยานที่มีขีดความสามารถพอ เพื่อขยายขีดความสามารถในการโจมตีทางทะเลของเรา"
 air_torpedoe_2: "ตอรปโดยิงจากอากาศปรับปรุง"
 air_torpedoe_2_desc: "ฐานติดตั้งและมาตรฐานที่เปนแบบเดียวกันชวยใหพัฒนาตอรปโดที่ใหญและทรงพลังยิ่งขึ้น รวมถึงเพิ่มประโยชนใชสอยโดยรวม"
 air_torpedoe_3: "ตอรปโดยิงจากอากาศขั้นสูง"
 air_torpedoe_3_desc: "การพัฒนาอุปกรณนํ้าหนักเบาที่ออกแบบใหหลุดออกเมื่อลงสูนํ้า ชวยใหตอรปโดยิงจากอากาศแมนยําขึ้นอยางมาก และเพิ่มความปลอดภัยใหแกอากาศยานที่ทําการปลอย"
 photo_reconnaisance: "การลาดตระเวนถายภาพ"
 photo_reconnaisance_desc: "จุดประสงคทางทหารประการแรกที่ชัดเจนของเครื่องบินคือการคนหาขาศึกและรายงานตําแหนงใหนายพลบนภาคพื้นดินทราบ ซึ่งยังคงเปนหนึ่งในภารกิจที่พบบอยที่สุดของการบินทางทหาร"
 aa_lmg: "ปนกลเบา"
 aa_lmg_desc: "ปนกลขนาดลํากลองปนเล็กยาวเปนอาวุธหลักสําหรับการรบอากาศสูอากาศมาตั้งแตสมัยมหาสงคราม"
 survivability_studies: "การศึกษาความอยูรอด"
 survivability_studies_desc: "ดวยการวิเคราะหความเสียหายจากการรบของเครื่องบินที่บินกลับมาอยางละเอียด เราสามารถระบุไดอยางแมนยําวาสวนใดของเครื่องบินที่สําคัญอยางแทจริง"
 aircraft_construction: "การสรางอากาศยาน"
 aircraft_construction_desc: "เราไดกาวมาไกลจากยุคที่ใชไมอัดและผาในการผลิตเครื่องบิน เทคโนโลยีใหมทําใหไดเครื่องบินที่เหมาะกับบทบาทเฉพาะดานมากขึ้น"
 aa_hmg: "ปนกลหนัก"
 aa_hmg_desc: "เครื่องบินสมัยใหมทนทานตอความเสียหายไดมากกวารุนเกาอยางมาก และยังมีโอกาสใหยิงถูกนอยลง การยิงถูกแตละครั้งจึงตองสรางความเสียหายใหมากที่สุด ซึ่งจําเปนตองใชกระสุนที่ใหญขึ้น"
 aa_cannon_1: "ปนใหญอากาศ I"
 aa_cannon_1_desc: "กระสุนปนใหญสามารถเจาะทะลุไดแมแตเครื่องบินที่แข็งแกรงที่สุด และอาจบรรจุวัตถุระเบิดมากพอที่จะสรางความเสียหายรายแรงเมื่อยิงถูก"
 aa_cannon_2: "ปนใหญอากาศขนาดใหญ"
 aa_cannon_2_desc: "ดวยขนาดลํากลองที่ใหญขึ้นและกระสุนที่ใหญกวา ปนใหญเหลานี้สามารถยิงเครื่องบินลําใหญใหตกไดในนัดเดียว"
 aa_cannon_3: "ปนใหญอากาศ II"
 aa_cannon_3_desc: "ดวยปนใหญสมัยใหมที่ยิงกระสุนขนาดใหญดวยความเร็วสูง เราสามารถยิงอากาศยานที่แข็งแกรงที่สุดใหตกได"
 engines_1: "เครื่องยนต I"
 engines_1_desc: "เครื่องยนตเครื่องบินตองทรงพลัง แตก็ตองนํ้าหนักเบาและเชื่อถือได เครื่องยนตประเภทนี้ใหกําลังมากพอจะนําเครื่องบินขึ้นสูอากาศ แตก็จํากัดไมใหเครื่องบินแสดงศักยภาพไดเต็มที่อยูบาง"
 engines_2: "เครื่องยนต II"
 engines_2_desc: "การเติบโตอยางรวดเร็วของเครื่องบินจําเปนตองอาศัยการเพิ่มกําลังเครื่องยนตใหสอดคลองกัน"
 engines_3: "เครื่องยนต III"
 engines_3_desc: "$engine_3_1x_desc$"
 engines_4: "เครื่องยนต IV"
 engines_4_desc: "$engine_4_1x_desc$"
 range_improvements: "การปรับปรุงระยะบิน"
 range_improvements_desc: "แมจะดูชัดเจนวาการเพิ่มความจุเชื้อเพลิงจะเพิ่มระยะบินของเครื่องบิน แตการเพิ่มความจุนั้นใหกับเครื่องบินโดยไมกระทบสมรรถนะการบินมากเกินไปนั้นไมใชเรื่องงายเลย"

 sp_centrifugal_jet_tech: "ไอพนแบบหอยโขง"
 sp_centrifugal_jet_tech_desc: "เครื่องยนตไอพนแบบหอยโขงใชคอมเพรสเซอรชั้นเดียวอัดอากาศที่ดูดเขามา กอนจะพนออกไปเพื่อสรางแรงขับ ทําใหไดเครื่องยนตที่เล็กลงและบํารุงรักษาไดงายขึ้น"
 jet_engine_axial_1x: "เครื่องยนตไอพนแบบไหลตามแกน x1"
 jet_engine_axial_1x_desc: "ดวยการติดตั้งคอมเพรสเซอรหลายชุดเรียงตอกัน เครื่องยนตแบบไหลตามแกนจึงสามารถทวีแรงขับที่ไดจากเครื่องยนตไอพนคอมเพรสเซอรชั้นเดียวแบบธรรมดาไดหลายเทา"
 jet_engine_axial_2x: "เครื่องยนตไอพนแบบไหลตามแกน x2"
 jet_engine_axial_2x_desc: "$engine_1_2x_desc$"
 jet_engine_axial_3x: "เครื่องยนตไอพนแบบไหลตามแกน x3"
 jet_engine_axial_3x_desc: "$engine_1_3x_desc$"
 jet_engine_axial_4x: "เครื่องยนตไอพนแบบไหลตามแกน x4"
 jet_engine_axial_4x_desc: "$engine_1_4x_desc$"
 jet_engine_axial_6x: "เครื่องยนตไอพนแบบไหลตามแกน x6"
 jet_engine_axial_6x_desc: "$engine_1_6x_desc$"

