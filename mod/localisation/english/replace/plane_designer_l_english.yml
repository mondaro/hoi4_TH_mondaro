 medium_plane_airframe_desc: "โครงเครื่องบินขนาดกลางที่มีเครื่องยนตสองถึงสี่เครื่อง และมีพื้นที่ภายในมากสําหรับนํ้าหนักบรรทุก ถังเชื้อเพลิง หรืออุปกรณปองกันตัว"
