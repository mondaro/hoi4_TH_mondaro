 cv_small_plane_airframe_desc: "ติดตั้งตะขอเกี่ยวลงจอดและฐานลอที่เสริมความแข็งแรง โครงเครื่องบินขนาดเล็กนี้จึงสามารถปฏิบัติการจากเรือบรรทุกเครื่องบินได"
