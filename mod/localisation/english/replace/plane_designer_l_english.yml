 bba_air_techs_folder_desc: "$air_techs_folder_desc$"
 engine_1_1x: "เครื่องยนต I x1"
 engine_1_1x_desc: "เครื่องยนตพื้นฐานนี้เชื่อถือไดและราคาถูก แตไมไดมีกําลังมากนัก"
 engine_1_2x: "เครื่องยนต I x2"
 engine_1_2x_desc: "เครื่องยนตคูชวยเพิ่มแรงขับใหเครื่องบินอยางมาก แตตองแลกกับตนทุนที่สูงขึ้น"
 engine_1_3x: "เครื่องยนต I x3"
 engine_1_3x_desc: "เครื่องยนตสามเครื่องใหแรงขับมากกวาเครื่องยนตคู โดยไมตองเสียตนทุนเพิ่มสําหรับเครื่องยนตเครื่องที่สี่"
 engine_1_4x: "เครื่องยนต I x4"
 engine_1_4x_desc: "เครื่องยนตสี่เครื่องใหแรงขับมากพอที่จะยกเครื่องบินขนาดหนักและทําใหบรรทุกนํ้าหนักไดมาก"
 engine_1_6x: "เครื่องยนต I x6"
 engine_1_6x_desc: "ดวยเครื่องยนตหกเครื่อง เครื่องบินลําใดก็สามารถบรรทุกนํ้าหนักไดมากในระยะไกลดวยความเร็วที่ดีพอสมควร"
 engine_2_1x: "เครื่องยนต II x1"
 engine_2_1x_desc: "เครื่องยนตที่ใหญและทรงพลังกวาชวยใหทําความเร็วไดสูงขึ้นและบรรทุกนํ้าหนักไดมากขึ้น"
 engine_2_2x: "เครื่องยนต II x2"
 engine_2_2x_desc: "$engine_1_2x_desc$"
 engine_2_3x: "เครื่องยนต II x3"
 engine_2_3x_desc: "$engine_1_3x_desc$"
 engine_2_4x: "เครื่องยนต II x4"
 engine_2_4x_desc: "$engine_1_4x_desc$"
 engine_2_6x: "เครื่องยนต II x6"
 engine_2_6x_desc: "$engine_1_6x_desc$"
 engine_3_1x: "เครื่องยนต III x1"
 engine_3_1x_desc: "ดวยคุณสมบัติขั้นสูงอยางระบบฉีดเมทานอลและระบบปรับสวนผสมอัตโนมัติ เครื่องยนตนี้จึงใหกําลังไดมากขึ้นอยางเห็นไดชัด"
 engine_3_2x: "เครื่องยนต III x2"
 engine_3_2x_desc: "$engine_1_2x_desc$"
 engine_3_3x: "เครื่องยนต III x3"
 engine_3_3x_desc: "$engine_1_3x_desc$"
 engine_3_4x: "เครื่องยนต III x4"
 engine_3_4x_desc: "$engine_1_4x_desc$"
 engine_3_6x: "เครื่องยนต III x6"
 engine_3_6x_desc: "$engine_1_6x_desc$"
 engine_4_1x: "เครื่องยนต IV x1"
 engine_4_1x_desc: "ดวยงานวิศวกรรมอยางละเอียดเพื่อรีดสมรรถนะทุกสวนที่เปนไปได เครื่องยนตนี้คือจุดสูงสุดของเทคโนโลยีเครื่องยนตลูกสูบ"
 engine_4_2x: "เครื่องยนต IV x2"
 engine_4_2x_desc: "$engine_1_2x_desc$"
 engine_4_3x: "เครื่องยนต IV x3"
 engine_4_3x_desc: "$engine_1_3x_desc$"
 engine_4_4x: "เครื่องยนต IV x4"
 engine_4_4x_desc: "$engine_1_4x_desc$"
 engine_4_6x: "เครื่องยนต IV x6"
 engine_4_6x_desc: "$engine_1_6x_desc$"
 jet_engine_1x: "เครื่องยนตไอพน x1"
 jet_engine_1x_desc: "ดวยแนวทางการขับเคลื่อนเครื่องบินที่แตกตางโดยสิ้นเชิง เครื่องยนตที่ซับซอนและเอาแนเอานอนไมไดนี้ยังคงใหแรงขับและความเร็วเพิ่มขึ้นอยางมาก"
 jet_engine_2x: "เครื่องยนตไอพน x2"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "เครื่องยนตไอพน x3"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "เครื่องยนตไอพน x4"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "เครื่องยนตไอพน x6"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 rocket_engine_1: "เครื่องยนตจรวด I"
 rocket_engine_1_desc: "ดวยการใชเชื้อเพลิงที่ระเหยไวหลายชนิดรวมกับสารออกซิไดซที่ไมเสถียรพอกัน เครื่องยนตนี้จึงสรางแรงขับไดมหาศาลเพื่อสงเครื่องบินใหทะยานดวยความเร็วสูง แตตองแลกกับระยะบิน"
 rocket_engine_2: "เครื่องยนตจรวด II"
 rocket_engine_2_desc: "การปรับปรุงหองเผาไหมและการปรับสวนผสมเชื้อเพลิงเล็กนอยชวยใหสมรรถนะสูงยิ่งขึ้น โดยระยะบินลดลงตามไปดวย"
 rocket_engine_3: "เครื่องยนตจรวด III"
 rocket_engine_3_desc: ""

 light_mg_2x: "ปนกลเบา x2"
 light_mg_2x_desc: "ปนกลขนาดลํากลองปนเล็กยาวสองกระบอกชวยเพิ่มอํานาจการยิงตอเปาหมายทางอากาศไดเล็กนอยดวยตนทุนที่ไมสูงนัก"
 light_mg_4x: "ปนกลเบา x4"
 light_mg_4x_desc: "สิ่งที่อาวุธขนาดลํากลองปนเล็กยาวสี่กระบอกชุดนี้ขาดไปในดานอานุภาพการทําลาย ไดถูกชดเชยดวยปริมาณการยิงอันมหาศาล"
 aircraft_cannon_1_1x: "ปนใหญอากาศ I x1"
 aircraft_cannon_1_1x_desc: "ปนใหญอัตโนมัติใหอํานาจการยิงตอเปาหมายทางอากาศสูงมาก แตนํ้าหนักที่เพิ่มขึ้นทําใหเครื่องบินชาลงและคลองตัวนอยลง"
 aircraft_cannon_1_2x: "ปนใหญอากาศ I x2"
 aircraft_cannon_1_2x_desc: "ปนใหญอัตโนมัติสองกระบอกมอบอาวุธยิงดานหนาอันนาเกรงขามตอเปาหมายทางอากาศและเปาออนภาคพื้นดิน แตตองแลกกับนํ้าหนักและความคลองตัวที่ลดลงมาก"
 bomb_locks: "ตะขอแขวนระเบิด"
 bomb_locks_desc: "ฐานติดตั้งระเบิดขนาดเล็กใตปกหรือลําตัวชวยใหเครื่องบินโจมตีเปาหมายภาคพื้นดินไดโดยมีโอกาสสําเร็จบาง"
 heavy_bomb_locks: "ตะขอแขวนระเบิดหนัก"
 heavy_bomb_locks_desc: "ฐานติดตั้งระเบิดขนาดใหญใตปกหรือลําตัวชวยใหเครื่องบินโจมตีเปาหมายภาคพื้นดินไดอยางมีประสิทธิภาพสูง"
 armor_piercing_bomb_locks: "ตะขอแขวนระเบิดเจาะเกราะ"
 armor_piercing_bomb_locks_desc: "ฐานติดตั้งระเบิดเจาะเกราะขนาดใหญใตปกหรือลําตัวชวยใหเครื่องบินโจมตีเปาหมายทางทะเลไดอยางมีประสิทธิภาพสูง"
 torpedo_mounting: "ฐานติดตั้งตอรปโดเบา"
 torpedo_mounting_desc: "จุดยึดสําหรับติดตั้งตอรปโดนํ้าหนักเบาใตลําตัว ทําใหเครื่องบินมีอาวุธทรงอานุภาพสําหรับใชโจมตีเรือขาศึก"
 torpedo_mounting_2: "ฐานติดตั้งตอรปโดขนาดกลาง"
 torpedo_mounting_2_desc: "จุดยึดสําหรับติดตั้งตอรปโดนํ้าหนักปานกลางใตลําตัว ทําใหเครื่องบินมีอาวุธทรงอานุภาพสําหรับใชโจมตีเรือขาศึก"
 torpedo_mounting_3: "ฐานติดตั้งตอรปโดหนัก"
 torpedo_mounting_3_desc: "จุดยึดสําหรับติดตั้งตอรปโดนํ้าหนักมากใตลําตัว ทําใหเครื่องบินมีอาวุธทรงอานุภาพสําหรับใชโจมตีเรือขาศึก"
 armor_plate_small: "แผนเกราะ"
 armor_plate_small_desc: "แผนเหล็กกลาดานหลังที่นั่งนักบินและรอบเครื่องยนตชวยเพิ่มความอยูรอดของเครื่องบินจากการยิงจากภาคพื้นดินและการโจมตีจากดานหลัง"
 heavy_mg_2x: "ปนกลหนัก x2"
 heavy_mg_2x_desc: "ปนกลหนักคูหนึ่งสามารถเจาะทะลุผิวลําตัวที่แข็งแกรงของเครื่องบินสมัยใหมได"
 heavy_mg_4x: "ปนกลหนัก x4"
 heavy_mg_4x_desc: "ปนกลหนักสี่กระบอกใหอํานาจการยิงที่นาสะพรึงกลัว ทั้งในแงสมรรถนะของแตละกระบอกและปริมาณการยิงโดยรวม"
 aircraft_cannon_2_1x: "ปนใหญอากาศ II x1"
 aircraft_cannon_2_1x_desc: "ปนใหญสมัยใหมที่ยิงกระสุนขนาดใหญดวยความเร็วสูง อาวุธนี้สามารถยิงตกไดทั้งเครื่องบินขับไลและเครื่องบินทิ้งระเบิดทางยุทธศาสตร"
 aircraft_cannon_2_2x: "ปนใหญอากาศ II x2"
 aircraft_cannon_2_2x_desc: "ปนใหญคูมอบพลังโจมตีอยางมากใหแกเครื่องบิน ขณะที่ปริมาณการยิงที่เพิ่มขึ้นทําใหยิงถูกจุดสําคัญไดงายยิ่งขึ้น"
 large_aircraft_cannon_1x: "ปนใหญอากาศขนาดใหญ x1"
 large_aircraft_cannon_1x_desc: "ยิงกระสุนที่ใหญและทรงพลังกวาปนใหญอัตโนมัติรุนกอน ๆ แมความเร็วตนจะตํ่ากวา อาวุธนี้สามารถยิงเครื่องบินลําใหญใหตกไดในนัดเดียว"
 large_aircraft_cannon_2x: "ปนใหญอากาศขนาดใหญ x2"
 large_aircraft_cannon_2x_desc: "ปนใหญคูมอบพลังโจมตีอยางมากใหแกเครื่องบิน ขณะที่ปริมาณการยิงที่เพิ่มขึ้นทําใหยิงถูกจุดสําคัญไดงายยิ่งขึ้น"
 small_bomb_bay: "ชองทิ้งระเบิดขนาดเล็ก"
 small_bomb_bay_desc: "ชองขนาดเล็กสําหรับบรรทุกระเบิด การเก็บไวในลําตัวชวยลดแรงตาน แตการดัดแปลงโครงสรางที่จําเปนทําใหเครื่องบินไมสามารถทําการหลบหลีกอยางรุนแรงในการรบทางอากาศได"
 medium_bomb_bay: "ชองทิ้งระเบิดขนาดกลาง"
 medium_bomb_bay_desc: "ชองทิ้งระเบิดขนาดกลางชวยใหบรรทุกสรรพาวุธไดมากพอที่จะโจมตีเปาหมายไดหลากหลาย"
 large_bomb_bay: "ชองทิ้งระเบิดขนาดใหญ"
 large_bomb_bay_desc: "ชองขนาดใหญสําหรับบรรทุกสรรพาวุธมากพอที่จะสรางความเสียหายหรือทําลายไดแมแตโรงงานขนาดใหญและเปาแข็งอื่น ๆ"
 tank_buster_1: "ปนใหญตอสูรถถัง I"
 tank_buster_1_desc: "ดัดแปลงมาจากปนตอสูรถถังที่กองทัพบกใช ปนนี้สามารถทําลายแมแตรถถังสมัยใหมไดหากยิงไดแมนยํา อยางไรก็ตาม นํ้าหนักที่มากและโครงสรางที่เทอะทะจํากัดสมรรถนะของเครื่องบินอยางมาก"
 tank_buster_2: "ปนใหญตอสูรถถัง II"
 tank_buster_2_desc: "รถถังที่หนักขึ้นซึ่งประจําการอยูในปจจุบันตองใชปนที่ใหญกวามากในการรับมือ แมจะหนักและเทอะทะอยางยิ่ง แตก็เปนอาวุธที่มีประสิทธิภาพสูงในการโจมตีที่มั่นของขาศึก"
 fuel_tanks_small: "ถังเชื้อเพลิงเสริม"
 fuel_tanks_small_desc: "การใชพื้นที่ภายในโครงเครื่องบินเพื่อบรรจุเชื้อเพลิงมากขึ้นชวยเพิ่มระยะบิน แตก็ทําใหเครื่องบินติดไฟไดงายขึ้นมาก"
 self_sealing_fuel_tanks_small: "ถังเชื้อเพลิงปดผนึกตัวเอง"
 self_sealing_fuel_tanks_small_desc: "ดวยการเพิ่มชั้นยางที่ผานกรรมวิธีพิเศษรอบถังเชื้อเพลิง เมื่อถังเชื้อเพลิงถูกยิง เครื่องบินจะไมเสียหายหนัก เพราะถังจะปดผนึกตัวเองเมื่อเวลาผานไป ปองกันการสูญเสียเชื้อเพลิง"
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "เกราะรอบเครื่องยนตและสวนที่เปราะบางของลําตัวชวยเพิ่มความอยูรอดของเครื่องบินอยางมาก แตตองแลกกับระยะบิน"
 fuel_tanks_medium: "$fuel_tanks_small$"
 fuel_tanks_medium_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_medium: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc: "$self_sealing_fuel_tanks_small_desc$"
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "แผนเหล็กกลาที่ครอบคลุมอยางกวางขวางชวยปกปองเครื่องยนต ถังเชื้อเพลิง และหองลูกเรือ ทําใหเครื่องบินทนทานตอทุกสิ่งยกเวนการยิงถูกโดยตรงจากปนตอสูอากาศยาน และยังทําใหเปนเปาหมายที่เครื่องบินขับไลยิงตกไดยากมาก"
 fuel_tanks_large: "$fuel_tanks_small$"
 fuel_tanks_large_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc: "$self_sealing_fuel_tanks_small_desc$"
 lmg_defense_turret: "ปอมปนปองกันปนกลเบา"
 lmg_defense_turret_desc: "แมจะมีกําลังคอนขางนอยสําหรับการรบอากาศสูอากาศ แตปนกลเบาในปอมปนจะทําใหการโจมตีเครื่องบินลํานี้เปนภารกิจที่อันตรายยิ่งขึ้น"
 lmg_defense_turret_2x: "ปอมปนปองกันปนกลเบา x2"
 lmg_defense_turret_2x_desc: "ปนกลเบาสองกระบอกในปอมปนขับเคลื่อนดวยไฟฟาครอบคลุมมุมยิงไดมากขึ้น และทําใหเครื่องบินเปนเปาที่โจมตีไดยากขึ้นมาก"
 hmg_defense_turret: "ปอมปนปองกันปนกลหนัก"
 hmg_defense_turret_desc: "ปนกลหนักในปอมปนหมุนไดชวยใหฝายปองกันตอบโตเครื่องบินขับไลที่ติดอาวุธใกลเคียงกันไดโดยมีโอกาสสําเร็จบาง"
 hmg_defense_turret_2x: "ปอมปนปองกันปนกลหนัก x2"
 hmg_defense_turret_2x_desc: "ปอมปนขับเคลื่อนสองปอมพรอมปนกลหนักทําใหเครื่องบินขับไลที่เขาโจมตีตองเผชิญกับเปาหมายที่อันตราย"
 cannon_defense_turret: "ปอมปนปองกันปนใหญอากาศ"
 cannon_defense_turret_desc: "ปนใหญสมัยใหมในปอมปนที่หมุนไดเปลี่ยนดุลอํานาจระหวางฝายปองกันและฝายโจมตีในการรบทางอากาศอยางมาก เครื่องบินขับไลเพียงไมกี่ลําที่จะทนการยิงถูกโดยตรงจากปนใหญสมัยใหมและยังรบตอไปได"
 cannon_defense_turret_2x: "ปอมปนปองกันปนใหญอากาศ x2"
 cannon_defense_turret_2x_desc: "ปอมปนสองปอมที่ติดตั้งปนใหญอัตโนมัติมอบพลังการปองกันอันนาเกรงขามใหแกเครื่องบิน ทําใหการโจมตีของเครื่องบินขับไลใด ๆ กลายเปนเรื่องที่อันตรายอยางยิ่ง"
 rocket_rails: "รางจรวด"
 rocket_rails_desc: "กระสุนไมนําวิถีที่แขวนอยูใตปก เนื่องจากถูกยิงไปขางหนาของเครื่องบินที่เขาโจมตี นักบินจึงเล็งไปยังเปาหมายไดงายกวาระเบิดมาก"
 bomb_sights_1: "ศูนยเล็งทิ้งระเบิด I"
 bomb_sights_1_desc: "คอมพิวเตอรเชิงกลที่ซับซอนซึ่งคํานวณการเบี่ยงเบนจากลม ความเร็วปลาย และระดับความสูง ชวยใหพลทิ้งระเบิดทิ้งระเบิดไดอยางแมนยําสูง"
 bomb_sights_2: "ศูนยเล็งทิ้งระเบิด II"
 bomb_sights_2_desc: "ขณะที่ศูนยเล็งทิ้งระเบิดรุนกอน ๆ มักตองใชเวลาตั้งคานานกวาจะไดคาการเล็ง ศูนยเล็งทิ้งระเบิดแบบรักษาเสถียรภาพเต็มรูปแบบนี้ใชเวลาเพียงไมกี่วินาที และยังชดเชยการดิ่งลงระดับตื้นไดอีกดวย"
 radio_navigation_1: "ระบบนํารองดวยวิทยุ I"
 radio_navigation_1_desc: "เครื่องรับวิทยุที่คอยรับสัญญาณจุดตัดของลําคลื่นนํารองวิทยุแบบเรียบงายสองลํา ทําใหสามารถคนหาเปาหมายไดแมในความมืดสนิท"
 radio_navigation_2: "ระบบนํารองดวยวิทยุ II"
 radio_navigation_2_desc: "เครื่องรับวิทยุที่มาพรอมอุปกรณชวยวัดระยะทางหลายชนิด บอกพลทิ้งระเบิดถึงจังหวะที่แนนอนในการปลอยระเบิด แมเขาจะมองไมเห็นเปาหมายก็ตาม"
 air_ground_radar_1: "เรดารอากาศสูพื้น I"
 air_ground_radar_1_desc: "ชุดเรดารบนอากาศยานที่ใหภาพพื้นผิวเบื้องลางเครื่องบินอยางแมนยําแกตนหน ชวยใหนํารองไดอยางแมนยําแมในความมืดหรือสภาพอากาศเลวราย"
 air_ground_radar_2: "เรดารอากาศสูพื้น II"
 air_ground_radar_2_desc: "ดวยความละเอียดที่สูงกวารุนกอน ๆ ชุดเรดารนี้ชวยใหทิ้งระเบิดไดอยางแมนยําแมผานชั้นเมฆ"
 air_air_radar_1: "เรดารอากาศสูอากาศ I"
 air_air_radar_1_desc: "ชุดเสาอากาศเรดารบนเครื่องบินชวยใหผูควบคุมที่ผานการฝกสามารถคนหาเปาหมายในอากาศไดแมในความมืด"
 air_air_radar_2: "เรดารอากาศสูอากาศ II"
 air_air_radar_2_desc: "ดวยเครื่องสงสัญญาณที่ทรงพลังยิ่งขึ้น ชุดเรดารนี้สามารถตรวจจับเปาหมายไดในระยะไกลขึ้น"
 non_strategic_materials_small: "การใชวัสดุที่ไมใชวัสดุยุทธศาสตร"
 non_strategic_materials_small_desc: "ดวยการใชไมหรือผาที่ผานกรรมวิธีพิเศษแทนอะลูมิเนียมในทุกจุดที่ทําได เราจะลดการใชวัสดุยุทธศาสตรลงไดอยางมาก อยางไรก็ตาม ไมและผาทนทานตออาวุธสมัยใหมไดไมดีนัก"
 drop_tanks: "ถังเชื้อเพลิงสลัดทิ้ง"
 drop_tanks_desc: "ถังขนาดเล็กแบบใชแลวทิ้งที่บรรจุเชื้อเพลิงสํารองชวยเพิ่มระยะบินใหเครื่องบินขับไลของเราในภารกิจเชิงรุก เนื่องจากจะถูกสลัดทิ้งกอนเขาสูการรบ จึงไมลดทอนสมรรถนะในการรบ"
 dive_brakes_small: "แผนเบรกดิ่ง"
 dive_brakes_small_desc: "ชุดแผนสปอยเลอรตามแนวขอบทายของปกจะกางออกเมื่อเครื่องบินเริ่มดิ่ง ชวยลดความเร็วโดยรวมและทําใหเครื่องบินถอนตัวจากการดิ่งชันไดโดยปกไมฉีกขาด ซึ่งทําใหเครื่องบินสามารถโจมตีจากการดิ่งเกือบตั้งฉากได เพิ่มความแมนยําอยางมาก"
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "ทุนลอย"
 floats_desc: "ชุดทุนลอยที่ติดตั้งใตโครงเครื่องบินชวยใหเครื่องบินลงจอดบนนํ้าได ทําใหภารกิจลาดตระเวนคนหากําลังทางเรือของขาศึกงายขึ้น แตก็ลดความคลองตัวลงอยางมาก"
 flying_boat_medium: "เรือบิน"
 flying_boat_medium_desc: "แทนที่จะติดตั้งฐานลอ สวนใตทองเครื่องบินสามารถขึ้นรูปใหลงจอดบนนํ้าได ทําใหภารกิจลาดตระเวนเหนือนานนํ้างายขึ้นมาก"
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"
 guided_anti_ship_missile: "ขีปนาวุธนําวิถีตอตานเรือ"
 guided_anti_ship_missile_desc: "โดยแทแลวคือระเบิดตอตานเรือที่ติดเครื่องยนตจรวดและระบบนําวิถีดวยวิทยุ อาวุธสงครามชนิดใหมนี้เปนภัยคุกคามรายแรงตอเรือทุกลําที่ลอยลําอยูในปจจุบัน"
 bouncing_bomb_release: "กลไกปลอยระเบิดกระดอน"
 bouncing_bomb_release_desc: "แทนแขวนระเบิดสําหรับบรรทุกและปลอยระเบิดกระดอนชนิดพิเศษ ซึ่งจะกระดอนไปตามผิวนํ้าจนกระทั่งปะทะเปาหมาย กลไกนี้ทําใหระเบิดหมุนถอยหลังขณะปลอย จึงมีโอกาสไปถึงโครงสรางเปาหมายที่ตองการมากขึ้น"
 earthshaker_bomb_release: "กลไกปลอยระเบิดเอิรธเชกเกอร"
 earthshaker_bomb_release_desc: "แทนแขวนและกลไกปลอยสําหรับระเบิดเอิรธเชกเกอรขนาดมหึมา ซึ่งออกแบบมาใหเจาะลงไปในพื้นดินเมื่อกระทบและระเบิดใตดิน สรางความเสียหายตอโครงสรางของเปาหมายอยางมหาศาล"
 rocket_propelled_bombs: "ระเบิดขับดันดวยจรวด"
 rocket_propelled_bombs_desc: "ระเบิดไมนําวิถีที่ขับดันดวยจรวดสามารถสรางความเสียหายอยางมากตอเรือและเปาหมายขนาดใหญที่หุมเกราะในลักษณะเดียวกัน"
 improved_rocket_propelled_bombs: "ระเบิดขับดันดวยจรวดขนาดหนัก"
 improved_rocket_propelled_bombs_desc: "ระเบิดไมนําวิถีขับดันดวยจรวดที่ใหญยิ่งขึ้น บรรทุกหัวรบที่หนักกวา สามารถเจาะทะลุเปาหมายไดอยางมีประสิทธิภาพยิ่งขึ้น"

 fixed_explosive_charge: "ระเบิดติดตั้งถาวร"
 fixed_explosive_charge_desc: "ระเบิดดินโพรงที่ติดตั้งถาวรเปลี่ยนเครื่องบินใหกลายเปนระเบิดบินได หากบังคับเครื่องบินพุงชนเรือขาศึก จะสรางความเสียหายอยางรุนแรง แตตองแลกกับการสูญเสียทั้งเครื่องบินและลูกเรือ"
 recon_camera: "กลองลาดตระเวน"
 recon_camera_desc: "ชุดกลองถายภาพพรอมเลนสพิเศษ ชวยใหเครื่องบินถายภาพรูปขบวนและที่ตั้งทางทหารของขาศึกไดอยางแมนยําแมจากระดับความสูงมาก"
 airdropped_mines: "ทุนระเบิดทิ้งจากอากาศ"
 airdropped_mines_desc: "ชุดทุนระเบิดทางทะเลที่ติดรมชูชีพ ทําใหสามารถทิ้งจากเครื่องบินได"
 demining_coil: "ขดลวดกวาดทุนระเบิด"
 demining_coil_desc: "ขดลวดขนาดใหญที่ติดตั้งบนโครงเครื่องบินชวยใหเครื่องบินปลอยสนามแมเหล็กอันทรงพลัง ซึ่งทําใหทุนระเบิดแมเหล็กในเสนทางบินระเบิดขึ้น"

 small_plane_airframe_0: "โครงเครื่องบินขนาดเล็กยุคระหวางสงคราม"
 small_plane_airframe_0_desc: "นับตั้งแตชวงแรกของมหาสงคราม การบินไดกาวหนาไปอยางกาวกระโดด โครงเครื่องบินนี้คือผลสรุปของพัฒนาการเหลานั้น แตเห็นไดชัดวาศักยภาพในการพัฒนาตอยอดมีจํากัด"
 small_plane_airframe_1: "โครงเครื่องบินขนาดเล็กพื้นฐาน"
 small_plane_airframe_1_desc: "ในชวงไมกี่ปที่ผานมา มีเทคโนโลยีใหม ๆ เกิดขึ้นหลายอยาง ทําใหสามารถสรางเครื่องบินขนาดเล็กที่มีขีดความสามารถสูงได โครงเครื่องบินนี้เปนเพียงกาวแรกบนเสนทางนั้น"
 small_plane_airframe_2: "โครงเครื่องบินขนาดเล็กปรับปรุง"
 small_plane_airframe_2_desc: "ดวยหลักอากาศพลศาสตรที่ดีขึ้นและโครงสรางที่แข็งแรงขึ้น โครงเครื่องบินนี้จึงเปนกาวที่ลํ้าหนาอยางชัดเจนเมื่อเทียบกับรุนพื้นฐาน"
 small_plane_airframe_3: "โครงเครื่องบินขนาดเล็กขั้นสูง"
 small_plane_airframe_3_desc: "ไดรับการปรับแตงอยางละเอียดเพื่อสมรรถนะ โครงเครื่องบินนี้คือขีดสุดของสิ่งที่เครื่องบินเครื่องยนตลูกสูบจะทําได"
 small_plane_airframe_4: "โครงเครื่องบินขนาดเล็กสมัยใหม"
 small_plane_airframe_4_desc: "โครงเครื่องบินนี้ออกแบบมาเพื่อใชประโยชนจากความเร็วสูงของเครื่องยนตสมัยใหม และแกปญหาดานโครงสรางบางประการที่มาพรอมกับการบินดวยความเร็วสูงใกลความเร็วเสียง"

 small_plane_airframe_5: "โครงเครื่องบินขนาดเล็กความเร็วเหนือเสียง"
 small_plane_airframe_5_desc: "โครงเครื่องบินขั้นสูงนี้ซึ่งสามารถบินดวยความเร็วเหนือเสียงระดับ มัค 1 คือสุดยอดแหงวิศวกรรมของมนุษย"
