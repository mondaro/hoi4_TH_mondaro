 SPR_heavy_cruiser_1_desc: "เรือชั้นปรินเซซาเดอัสตูเรียสประกอบดวยเรือลาดตระเวนหุมเกราะสามลําที่สรางใหกองทัพเรือสเปนราวชวงเปลี่ยนศตวรรษ ทั้งสามลําถูกแยกชิ้นหรืออับปางไปหมดแลวภายในกลางทศวรรษ 1930 ติดปนแฝด 240mm Guillén M1896 และปน 140mm/33 Schneider-Canet แปดกระบอก มีเกราะหนาแตคอนขางชาเมื่อเทียบกับเรือลาดตระเวนหนักทั่วไป"
 SPR_heavy_cruiser_2: "ชั้นกานาริอัส"
 SPR_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักสองลําของชั้นกานาริอัสสรางตามขอกําหนดของสนธิสัญญานาวีวอชิงตัน ปลอยลงนํ้าในตนทศวรรษ 1930 แตสรางเสร็จในป 1936 มีระวางขับนํ้าเกือบ 10,700 ตันและมีความเร็วดี เกราะคอนขางบาง แตติดปน 203mm/50 Vickers-Armstrong Mk D แปดกระบอกเปนอาวุธหลัก"
 SPR_battleship_1: "ชั้นเอสปญญา"
 SPR_battleship_1_desc: "เดิมเรือชั้นเอสปญญาเปนเรือประจัญบานเดรดนอตสามลําที่เขาประจําการราวชวงสงครามโลกครั้งที่หนึ่ง แตลําหนึ่งอับปางไปกอนสงครามกลางเมืองสเปน อีกสองลําสูญเสียระหวางสงคราม เรือคอนขางเล็กสําหรับเรือประจัญบาน ระวางขับนํ้าเพียงกวา 15,400 ตัน อยางไรก็ตามมีเกราะและความเร็วพอใชได และมีปนหลัก 305mm/50 Vickers H แปดกระบอก "
 ### SWE - SWEEDEN ###
 SWE_submarine_1: "ชั้นฮาเยน"
 SWE_submarine_1_desc: "เรือชั้นฮาเยน แบเวิรน และวาเลน เปนเรือดํานํ้าขนาดเล็กถึงกลางชุดหนึ่งที่สรางใหกองทัพเรือสวีเดนในทศวรรษ 1920 เรือชั้นฮาเยนเขาประจําการในป 1920 มีระวางขับนํ้าเกือบ 400 ตัน ติดทอตอรปโดขนาด 450 มม. สี่ทอ และดําไดลึกเพียง 30 ม."
 #SWE_submarine_1b: "Draken Class"
 SWE_submarine_2: "ชั้นเชอเลโยเนต"
 SWE_submarine_2_desc: "เรือชั้นเชอเลโยเนตประกอบดวยเรือดํานํ้าเกาลําที่สรางระหวางป 1936 ถึง 1942 เปนเรือดํานํ้าขนาดกลาง ระวางขับนํ้า 580 ตัน และแบบเรือไดรับอิทธิพลอยางมากจากเรือดํานํ้าชั้น O ของเนเธอรแลนด ติดทอตอรปโดขนาด 533 มม. หกทอ และดําไดลึก 60 ม. "
 SWE_submarine_3: "ชั้น U"
 SWE_submarine_3_desc: "เรือดํานํ้าชั้น U ของสวีเดนมีเกาลํา เขาประจําการระหวางป 1942 ถึง 1944 เรือคอนขางเล็กและคอนขางชา ระวางขับนํ้าเพียง 370 ตัน ติดทอตอรปโดขนาด 533 มม. สี่ทอ"
 SWE_submarine_4: "ชั้นเนปทุน"
 SWE_submarine_4_desc: "เรือชั้นเนปทุนประกอบดวยเรือดํานํ้าขนาดกลางสามลําที่เขาประจําการทั้งหมดในป 1943 ใชงานหลักในภารกิจวางทุนระเบิด มีระวางขับนํ้า 550 ตัน ติดทอตอรปโดขนาด 533 มม. หาทอ"
 SWE_destroyer_1: "ชั้นเอเรนเชิลด"
 SWE_destroyer_1_desc: "เรือพิฆาตสองลําของชั้นเอเรนเชิลดสรางเสร็จในป 1927 เปนเรือพิฆาตสมัยใหมรุนแรกของสวีเดนหลังสงครามโลกครั้งที่หนึ่ง มีระวางขับนํ้ากวา 970 ตันเล็กนอย ติดปน 120mm/44 K/45 สามกระบอกและทอตอรปโดขนาด 533 มม. หกทอ พิสัยสั้นแตความเร็วดี"
 SWE_destroyer_2: "ชั้นเยอเตบอรย"
 SWE_destroyer_2_desc: "เรือชั้นเยอเตบอรยประกอบดวยเรือพิฆาตหกลําที่สรางระหวางป 1935 ถึง 1942 มีตัวเรือยาวขึ้นและเครื่องจักรที่ปรับปรุงดีกวารุนกอน ระวางขับนํ้ากวา 1,020 ตันเล็กนอย อาวุธหลักคือปน 120mm/44 K/45 และยังมีทอตอรปโดขนาด 533 มม. หกทอ พิสัยจํากัดแตความเร็วยอดเยี่ยม"
 SWE_destroyer_3: "ชั้นวิสบี"
 SWE_destroyer_3_desc: "เรือพิฆาตทั้งสี่ลําของชั้นวิสบีสรางระหวางป 1942 ถึง 1944 คลายกับชั้นเยอเตบอรยรุนกอนแตใหญกวา ระวางขับนํ้ากวา 1,130 ตัน ทั้งยังมีเครื่องยนตที่ปรับปรุงแลว พิสัยดีขึ้นบาง และยุทโธปกรณตอตานเรือดํานํ้าที่แข็งแกรง"
 SWE_destroyer_4: "ชั้นเออลันด"
 SWE_destroyer_4_desc: "§Tเรือพิฆาตชั้นเออลันดสองลําถือเปนการเปลี่ยนแปลงครั้งใหญจากแบบเรือรุนกอน ๆ ปลอยลงนํ้าและสรางเสร็จไมนานหลังสงครามโลกครั้งที่สอง เรือมีขนาดใหญ ระวางขับนํ้า 1,880 ตัน ติดปน 120mm/45 M44 สี่กระบอกเปนอาวุธหลัก และมีอาวุธตอสูอากาศยาน ตอรปโด และยุทโธปกรณตอตานเรือดํานํ้าที่แข็งแกรง ชากวาเรือพิฆาตรุนกอนเล็กนอย แตมีพิสัยดีขึ้นอยางมาก§!"
 SWE_light_cruiser_1: "ชั้นฟลเกีย"
 SWE_light_cruiser_1_desc: "ฟลเกียเปนเรือลาดตระเวนหุมเกราะขนาดคอนขางเล็กที่เขาประจําการในกองทัพเรือสวีเดนในป 1905 เรือทําหนาที่ฝกเปนสวนใหญในชวงสงคราม และไดรับการปรับปรุงครั้งใหญในป 1939-41 กอนการปรับปรุง เรือมีระวางขับนํ้ากวา 4,300 ตัน ติดปน 152mm/45 K/50 M1903 หกกระบอกเปนอาวุธหลัก มีเกราะดีแตคอนขางชาสําหรับเรือลาดตระเวน"
 SWE_light_cruiser_4: "ชั้นเตรโครนูร"
 SWE_light_cruiser_4_desc: "เรือชั้นเตรโครนูรประกอบดวยเรือลาดตระเวนเบาสองลําที่สรางเสร็จใหกองทัพเรือสวีเดนหลังสงครามโลกครั้งที่สองสิ้นสุดไมนาน มีระวางขับนํ้าเกือบ 7,700 ตัน ความเร็วและพิสัยพอใชได อาวุธหลักประกอบดวยปน 152/53 M42 เจ็ดกระบอก ทั้งยังมีปนตอสูอากาศยาน ตอรปโด และยุทโธปกรณตอตานเรือดํานํ้าที่แข็งแกรง"
 SWE_heavy_cruiser_1: "ชั้นสเวรีเย"
 SWE_heavy_cruiser_1_desc: "เรือชั้นสเวรีเยประกอบดวยเรือประจัญบานชายฝงสามลําที่สรางใหกองทัพเรือสวีเดนกอนสงครามโลกครั้งที่หนึ่ง เรือมีลักษณะใกลเคียงเรือลาดตระเวนหนักมากกวาทั้งในดานขนาด (ระวางขับนํ้ากวา 6,800 ตัน) และอาวุธ (ปน 283mm/44 K/45 M12 สี่กระบอก) เรือคอนขางชาสําหรับเรือลาดตระเวนแตมีเกราะดีมาก ทั้งสามลําประจําการในสงครามโลกครั้งที่สอง"
 ### TUR - TURKEY ###
 TUR_submarine_1: "ชั้นบีรินจิอีเนอนู"
 TUR_submarine_1_desc: "เรือชั้นบีรินจิอีเนอนูประกอบดวยเรือดํานํ้าชายฝงสองลําที่สรางในเนเธอรแลนดใหตุรกีในกลางทศวรรษ 1920 เปนเรือลําแรกที่สรางใหกองทัพเรือตุรกีหลังสงครามโลกครั้งที่หนึ่ง มีระวางขับนํ้า 520 ตัน ติดทอตอรปโดขนาด 450 มม. หกทอ คอนขางชาแตมีพิสัยดี"
 #TUR_submarine_1b: "Dumlupınar Class"
 TUR_submarine_2: "ชั้นซัลดือราย"
 TUR_submarine_2_desc: "เรือดํานํ้าทั้งสามลําของชั้นซัลดือรายปลอยลงนํ้าในปลายทศวรรษ 1930 แบบเรือไดรับอิทธิพลอยางมากจากเยอรมนี โดยลําแรกสรางในเยอรมนี และอีกสองลําสรางภายใตสิทธิบัตรในอิสตันบูล เปนเรือดํานํ้าเดินสมุทรขนาดใหญ ระวางขับนํ้ากวา 930 ตันและมีพิสัยยอดเยี่ยม ติดทอตอรปโดขนาด 533 มม. หกทอ"
 TUR_submarine_3: "ชั้นโอรุชเรอิส"
 TUR_submarine_3_desc: "เรือดํานํ้าชั้นโอรุชเรอิสสรางในอังกฤษโดยดัดแปลงจากแบบเรือชั้น S ของอังกฤษ ปลอยลงนํ้าในป 1940 และหลายลําถูกราชนาวีอังกฤษกักไวชั่วคราว ในที่สุดทุกลํายกเวนหนึ่งลําไดคืนใหตุรกี เรือมีระวางขับนํ้า 625 ตัน ติดทอตอรปโดขนาด 533 มม. หาทอ ความเร็วและพิสัยคอนขางจํากัด"
 TUR_submarine_4: "ชั้นซาการยา"
 TUR_submarine_4_desc: "เรือดํานํ้าชั้นซาการยาคือเรือดํานํ้าชั้นบาลาโอของสหรัฐอเมริกาที่ขายใหตุรกีหลังสงคราม เปนเรือดํานํ้าขนาดใหญมากสําหรับยุคนั้น ระวางขับนํ้ากวา 1,520 ตัน มีพิสัยและความเร็วยอดเยี่ยม และติดทอตอรปโดขนาด 533 มม. สิบทอ"
 TUR_destroyer_1: "ชั้นเพยค"
 TUR_destroyer_1_desc: "เรือชั้นเพยคประกอบดวยเรือตอรปโดขนาดใหญความเร็วสูงสองลําที่เขาประจําการในกองทัพเรือออตโตมันในป 1907 เรือสรางในเยอรมนีและรอดพนสงครามโลกครั้งที่หนึ่ง แตลาสมัยแลวเมื่อถึงสงครามโลกครั้งที่สอง มีระวางขับนํ้า 775 ตัน ติดปนแฝด 105mm/37 SK L/40 และทอตอรปโดขนาด 450 มม. สามทอ มีพิสัยพอใชไดแตคอนขางชาสําหรับเรือพิฆาต"
 TUR_destroyer_2: "ชั้นบารบารอส"
 TUR_destroyer_3: "ชั้นเดมีรฮีซาร"
 TUR_destroyer_3_desc: "เรือพิฆาตทั้งสี่ลําของชั้นเดมีรฮีซารสรางในอังกฤษและเสร็จในป 1942 สองลําถูกราชนาวีอังกฤษกักไว ซึ่งหนึ่งในนั้นไดคืนหลังสงคราม เรืออิงแบบเรือชั้น I ของอังกฤษ ระวางขับนํ้า 1,370 ตัน ติดปน 120mm/45 QF Mk IX สี่กระบอกเปนอาวุธหลัก มีความเร็วพอใชไดและพิสัยดี ทั้งยังมีปนตอสูอากาศยานและยุทโธปกรณตอตานเรือดํานํ้าที่แข็งแกรง"
 TUR_light_cruiser_1: "ชั้นเมจีดิเย"
 TUR_light_cruiser_1_desc: "เรือเมจีดิเยของตุรกีเปนเรือลาดตระเวนปองกันตนเองที่สรางในสหรัฐอเมริกาใหกองทัพเรือออตโตมันราวชวงเปลี่ยนศตวรรษ เรือเคยจมในนํ้าตื้นระหวางสงครามโลกครั้งที่สอง แตถูกกูขึ้นมา และหลังจากประจําการในกองทัพเรือจักรวรรดิรัสเซียชวงสั้น ๆ ก็ไดคืนใหตุรกี มีระวางขับนํ้าเกือบ 3,500 ตัน ติดปน 152mm/44 Bethlehem No. 2 สองกระบอกและปน 120mm/45 Armstrong Y แปดกระบอก มีพิสัยพอใชไดแตคอนขางชาและเกราะบาง"
 TUR_battle_cruiser_1: "ชั้นยาวูซ"
 TUR_battle_cruiser_1_desc: "ยาวูซเดิมเขาประจําการในฐานะเรือลาดตระเวนประจัญบานเกอเบินของเยอรมนี แตถูกขายใหออตโตมันและเขาประจําการใหมในป 1914 เพื่อหลีกเลี่ยงการถูกกักเรือ มีระวางขับนํ้าเกือบ 23,000 ตัน ความเร็วและพิสัยพอใชได มีเกราะดี ติดปน 283mm/47 SK L/50 สิบกระบอกพรอมอาวุธรองที่แข็งแกรง"
 TUR_battleship_1: "ชั้นเรชาดีเย"
 TUR_battleship_1_desc: "เรือชั้นเรชาดีเยคือเรือประจัญบานเดรดนอตสามลําที่ตุรกีสั่งตอจากสหราชอาณาจักรใหกองทัพเรือตุรกีกอนสงครามโลกครั้งที่หนึ่งไมนาน อยางไรก็ตามสรางเสร็จเพียงลําเดียว และถูกอังกฤษยึดไวเมื่อสงครามโลกครั้งที่หนึ่งเริ่มตน หากสรางเสร็จ เรือจะมีระวางขับนํ้า 23,000 ตัน พรอมเกราะ ความเร็ว และพิสัยที่ดี อาวุธหลักจะเปนปน 343mm/45 Vickers สิบกระบอก"
 ### URU - URUGUAY ###
 URG_destroyer_1: "ชั้นอุรุกวัย"
 URG_destroyer_1_desc: "อุรุกวัยเปนเรือตอรปโดหนักที่สรางในเยอรมนีใหกองทัพเรืออุรุกวัยกอนสงครามโลกครั้งที่หนึ่ง มีระวางขับนํ้ากวา 1,400 ตัน ติดปน 120mm/45 Krupp QF สี่กระบอก มีอาวุธตอสูอากาศยานที่แข็งแกรงและทอตอรปโดขนาด 450 มม. สองทอ ดวยอายุและขนาดที่ใหญ จึงคอนขางชาเมื่อเทียบกับเรือพิฆาตอื่น ๆ"
 ### VEN - VENEZUELA -- generic only ###
 ### VIC - VICHY FRANCE ###
 VIC_submarine_1: "ซีรีส 600"
 VIC_submarine_1_desc: "เรือดํานํ้าซีรีส 600 ตันเปนเรือดํานํ้าสมัยใหมรุนแรกของฝรั่งเศสหลังสงครามโลกครั้งที่หนึ่ง เปนเรือขนาดกลาง ระวางขับนํ้าราว 600 ตัน แมจะเดินทะเลได แตก็ถูกจัดเปนเรือดํานํ้าชายฝงและใชงานสวนใหญในนานนํ้าอุนของทะเลเมดิเตอรเรเนียน มีการสรางเรือประเภทนี้สามชั้น ชั้นละสี่ลํา ไดแก ชั้นซีแรน ชั้นอาเรียน และชั้นซีรเซ เรือเหลานี้เปนตนแบบของซีรีส 630 ตันที่ใหญกวา ไดแก ชั้นอารโกโนต ชั้นดียาน และชั้นโอรียง"
 #VIC_submarine_1b: "630 Series"
 #VIC_submarine_1c: "Redoutable Class"
 VIC_submarine_2: "ชั้นมิแนรฟ"
 VIC_submarine_2_desc: "เรือดํานํ้าชั้นมิแนรฟ (ชื่อโครงการ T2) อิงแบบซีรีส 630 ตัน แตมีเครื่องยนตดีกวาและการจัดวางตอรปโดตางออกไป เรือดํานํ้าเหลานี้เปนสวนแรกของโครงการสรางมาตรฐานซึ่งเปนผลจากการออกแบบแบบรวมศูนยของ DCAN (Direction des Constructions et Armes Navale) แทนการออกแบบเฉพาะของแตละอูตอเรือแบบเรือชั้นกอน ๆ"
 #VIC_submarine_2b: "Aurore Class"
 VIC_submarine_3: "ชั้นโรลองมอรีโย"
 VIC_submarine_3_desc: "เรือดํานํ้าชั้นโรลองมอรีโย (ชื่อโครงการ Z2) เปนเรือดํานํ้าเดินสมุทรขนาดใหญที่อิงแบบเรือดํานํ้าชั้นเรอดูตาเบิลรุนกอน มีระวางขับนํ้า 1,800-2,400 ตัน และติดอาวุธอันนาเกรงขามคือทอตอรปโด 10 ทอ ฝรั่งเศสลมสลายกอนที่จะมีลําใดสรางเสร็จ"
 VIC_submarine_4: "ชั้นเฟนิกซ"
 VIC_submarine_4_desc: "เรือดํานํ้าชั้นเฟนิกซเปนเรือเดินสมุทรพิสัยไกลขนาดกลางที่ไดรับอนุมัติในโครงการกองทัพเรือป 1939-40 แตการเริ่มตนสงครามและการลมสลายของฝรั่งเศสทําใหถูกยกเลิก เรือคลายกับชั้นเรอดูตาเบิลแตเล็กกวา ระวางขับนํ้า 1,200 ตัน และติดอาวุธตอรปโดหนักใกลเคียงกัน"
 VIC_destroyer_1: "ชั้นบูราสก"
 VIC_destroyer_1_desc: "เรือพิฆาตชั้นบูราสกเปนสวนหนึ่งของซีรีส 1,500 ตัน ปลอยลงนํ้าในกลางทศวรรษ 1920 เรือชั้นนี้รวมกับชั้นชากาลรุนกอนและชั้นลาดรัวรุนถัดมาเปนกําลังหลักของกองเรือฝรั่งเศสสมัยใหมหลังสงคราม เรือเร็วและติดอาวุธดีสําหรับยุคนั้น แตอาวุธตอรปโดนอยกวาเรือที่คลายกันของกองทัพเรืออื่น"
 #VIC_destroyer_1b: "Chacal Class"
 #VIC_destroyer_1c: "Aigle & Vauquelin Class"
 VIC_destroyer_2: "ชั้นเลอฟองตาสก"
 VIC_destroyer_2_desc: "เรือพิฆาตชั้นเลอฟองตาสกโดยพื้นฐานคือรุนปรับปรุงของซูเปอรเรือพิฆาตซีรีส 2,400 ตันรุนกอน (เกปาร เอกล โวเกอแล็ง) ที่สรางภายใตโครงการกองทัพเรือป 1930 เปนเรือพิฆาตขนาดใหญ ติดอาวุธหนัก และเร็วมาก เหมาะอยางยิ่งสําหรับคุมกันหนวยความเร็วสูงใหมของกองเรือฝรั่งเศส อาวุธประกอบดวยปนที่พัฒนาขึ้นใหม อาวุธตอสูอากาศยานที่เพียงพอ และอาวุธตอรปโด"
 #VIC_destroyer_2b: "Le Hardi Class"
 #VIC_destroyer_2c: "Mogador Class"
 VIC_destroyer_3: "ชั้นแลงเทรปด"
 VIC_destroyer_3_desc: "เรือพิฆาตชั้นแลงเทรปดเปนรุนดัดแปลงของเรือพิฆาตชั้นเลอารดีรุนกอน ไดรับอนุมัติในโครงการกองทัพเรือป 1938 และ 1939 แตสงครามและการลมสลายของฝรั่งเศสทําใหถูกยกเลิก เรือจะเนนบทบาทตอสูอากาศยานมากขึ้น โดยเพิ่มระวางขับนํ้าเปน 2,800-2,900 ตันและใชเครื่องยนตที่ใหญขึ้น"
 VIC_destroyer_4: "ชั้นโอช"
 VIC_destroyer_4_desc: "เรือชั้นโอชและชั้นบายารเปนแบบซูเปอรเรือพิฆาตสุดทายของกองทัพเรือฝรั่งเศส ทั้งสองชั้นอิงแบบชั้นโมกาดอร ระวางขับนํ้า 4,200 ตัน อาวุธหลักใกลเคียงกันแตมีปนตอสูอากาศยานที่ปรับปรุงแลวและเครื่องยนตที่แรงกวา ไดรับอนุมัติในโครงการกองทัพเรือป 1939-40 แตการเริ่มตนสงครามและการลมสลายของฝรั่งเศสทําใหถูกยกเลิก"
 VIC_light_cruiser_1: "ชั้นดูแกทรูแอ็ง"
 VIC_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้นดูแกทรูแอ็งเปนเรือรบหลักลําแรกของฝรั่งเศสที่สรางหลังสงครามโลกครั้งที่หนึ่งในโครงการกองทัพเรือป 1922 และเปนเรือลาดตระเวนเบาชุดแรกที่มีปอมปนหลักแบบปดซึ่งยิงขามกันได ในบรรดาเรือลาดตระเวนเบา เรือชั้นนี้มีอาวุธตอรปโดแข็งแกรงแตแทบไมมีเกราะเลย"
 VIC_light_cruiser_2: "ชั้นลากาลีซอนีแยร"
 VIC_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้นลากาลีซอนีแยรเปนคําตอบตอเรือลาดตระเวนเบาแบบคอนดอตติเอรีของอิตาลี และอิงแบบชั้นเอมีลแบรแต็งรุนกอน สรางในโครงการกองทัพเรือป 1931 และ 1932 มีอาวุธหลักตามแบบฉบับและอาวุธตอสูอากาศยานที่เพียงพอสําหรับยุคนั้น ระวางขับนํ้า 10,850 ตัน มีเครื่องบินลาดตระเวนจํานวนมากขึ้น และมีความเร็วดี"
 VIC_light_cruiser_3: "ชั้นเดอกราส"
 VIC_light_cruiser_3_desc: "เรือลาดตระเวนชั้นเดอกราสไดรับอนุมัติในโครงการกองทัพเรือป 1938 และ 1939 โดยพื้นฐานคือเรือชั้นลากาลีซอนีแยรที่ปรับปรุงแลว มีอาวุธตอสูอากาศยานที่แข็งแกรงขึ้นและเครื่องยนตที่ใหญขึ้น การลมสลายของฝรั่งเศสทําใหสองลําสุดทายถูกยกเลิก และเรือลําแรกสรางเสร็จหลังสงครามดวยแบบเรือที่ตางออกไป เยอรมนีตั้งใจจะสรางใหเสร็จเปนเรือบรรทุกเครื่องบินเบา แตโครงการนี้ก็ไมไดดําเนินการเชนกัน"
 VIC_light_cruiser_4: "ชั้นกอลแบร"
 VIC_light_cruiser_4_desc: "กอลแบรเปนเรือลาดตระเวนเบาตอสูอากาศยานที่ปลอยลงนํ้าในป 1956 เรือลาดตระเวนชั้นกอลแบรสรางในลักษณะคลายกับเดอกราสหลังสงครามมาก โดยมีอาวุธตอสูอากาศยานหนักทั้งระยะไกลและระยะใกล ความแตกตางระหวางกอลแบรกับเดอกราสคือกอลแบรมีเครื่องยนตเล็กกวา เกราะบางกวา และมีขนาดเล็กกวาเล็กนอย"
 VIC_heavy_cruiser_1: "ชั้นซุฟเฟรน"
 VIC_heavy_cruiser_1_desc: "เรือลาดตระเวนหนักชั้นซุฟเฟรนโดยพื้นฐานคือการสรางซํ้าของชั้นดูแกนรุนกอน โดยปรับปรุงความสามารถในการเดินทะเลเล็กนอย ทั้งสองชั้นสะทอนแนวคิดเรือลาดตระเวนของกองทัพเรือฝรั่งเศสในยุคนั้น คือเกราะบางมากแตมีความเร็วและพิสัยดี ระวางขับนํ้ามาตรฐาน 10,000 ตัน และติดอาวุธตามมาตรฐานของเรือลาดตระเวนหนัก"
 VIC_heavy_cruiser_2: "ชั้นอาลเฌรี"
 VIC_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้นอาลเฌรีเปนการพัฒนาตอยอดจากชั้นซุฟเฟรนและดูแกนรุนกอน แตออกแบบมาเพื่อรับมือเรือลาดตระเวนหนักชั้นซาราใหมของอิตาลี ทั้งสายเกราะหลักและการปองกันใตนํ้าเพิ่มขึ้นอยางมาก อาวุธตอสูอากาศยานเพียงพอสําหรับยุคนั้น แตดวยการเปลี่ยนแปลงเหลานี้ ระวางขับนํ้ามาตรฐานจึงเกิน 10,000 ตัน"
 VIC_heavy_cruiser_3: "ชั้นแซ็งลุย"
 VIC_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้นแซ็งลุยอิงแบบชั้นอาลเฌรี แตรูปลักษณโดยรวมใกลเคียงกับเรือหลักชั้นดันเคิรกและชั้นรีเชอลีเยอมากกวา มีการสั่งตอสามลําในโครงการกองทัพเรือป 1940 แตเนื่องจากการลมสลายของฝรั่งเศส จึงไมมีลําใดไดวางกระดูกงู เรือจะติดปนแบบใหมและอาวุธตอสูอากาศยานที่ปรับปรุงแลว แตเกราะจะเหมือนกับชั้นอาลเฌรี นับเปนแบบเรือลาดตระเวนหนักแบบสุดทายของกองทัพเรือฝรั่งเศส"
 VIC_heavy_cruiser_4: "ชั้นฟอรแบ็ง"
 VIC_heavy_cruiser_4_desc: "เรือลาดตระเวนหนักชั้นฟอรแบ็งเปนแบบเรือสมมติที่สืบตอจากชั้นแซ็งลุย ออกแบบมาเพื่อปกปองเสนทางการคาระหวางฝรั่งเศสแผนดินใหญกับอาณานิคม มีพิสัยไกลและความเร็วดี พรอมอาวุธหนักเปนปนในปอมสามลํากลองสี่ปอม และอาวุธตอสูอากาศยานในจํานวนที่เพียงพอ การจัดวางและรูปลักษณโดยรวมของเรือไดรับอิทธิพลจากชั้นแซ็งลุยรุนกอนและชั้นคราวนโคโลนีของอังกฤษ"
 VIC_battle_cruiser_1: "แบบดูว็องวีแยล"
 VIC_battle_cruiser_1_desc: "แบบเรือลาดตระเวนประจัญบานดูว็องวีแยลเปนขอเสนอหนึ่งในชุดการศึกษาที่ยอนไปถึงสงครามโลกครั้งที่หนึ่ง โดยพื้นฐานคือเรือลาดตระเวนประจัญบานรุนหนึ่งของเรือประจัญบานชั้นนอรม็องดีและชั้นลียง ติดปอมปนสี่ลํากลองและปนแบบเดียวกันแตจํานวนนอยกวา เชนเดียวกับเรือลาดตระเวนประจัญบานรวมสมัยของกองทัพเรืออื่น เรือจะเร็วกวาแตเกราะบางกวาเรือประจัญบาน โครงการถูกยกเลิกกอนสงครามโลกครั้งที่หนึ่งปะทุ"
 VIC_battle_cruiser_2: "ชั้นดันเคิรก"
 VIC_battle_cruiser_2_desc: "เรือชั้นดันเคิรกออกแบบมาเพื่อรับมือเรือประจัญบานกระเปาชั้นดอยชลันดของเยอรมนี เปนจุดสูงสุดของชุดการศึกษาแบบเรือตั้งแตกลางทศวรรษ 1920 ถึงตนทศวรรษ 1930 ไดรับอนุมัติในโครงการกองทัพเรือป 1931 และ 1934 คลายกับเรือประจัญบานชั้นเนลสันของอังกฤษ โดยรวมปอมปนหลักทั้งหมดไวที่สวนหนา สงผลใหสายเกราะสั้นลงและเรือเล็กลงเพื่อใหอยูในขอจํากัดของสนธิสัญญานาวี"
 VIC_battleship_1: "ชั้นกูรแบ"
 VIC_battleship_1_desc: "เรือประจัญบานชั้นกูรแบเปนเรือซูเปอรเดรดนอตรุนแรกที่สรางใหกองทัพเรือฝรั่งเศสกอนและระหวางสงครามโลกครั้งที่หนึ่ง ไดรับอนุมัติในโครงการกองทัพเรือป 1910 และ 1911 ประจําการอยางจํากัดในสงครามโลกครั้งที่หนึ่ง แตมีบทบาทในสงครามโลกครั้งที่สอง แมจะมีเกราะหนาและปนแรงกวาเรือประจัญบานชั้นดันเตรุนกอน แตก็ยังดอยกวาเรือประจัญบานรวมสมัยของกองทัพเรือสหรัฐฯ และราชนาวีอังกฤษ มีระวางขับนํ้ากวา 22,000 ตันเล็กนอย และการปรับปรุงใหทันสมัยกอนสงครามโลกครั้งที่สองมีเพียงอาวุธตอสูอากาศยานและหมอไอนํ้าที่ปรับปรุงแลว"
 #VIC_battleship_1b: "Bretagne Class" 
 VIC_battleship_2: "ชั้นรีเชอลีเยอ"
 VIC_battleship_2_desc: "เรือประจัญบานชั้นรีเชอลีเยอเปนเรือประจัญบานชุดสุดทายที่เขาประจําการในกองทัพเรือฝรั่งเศส เปนแบบที่ปรับปรุงจากชั้นดันเคิรก และไดรับอนุมัติภายใตโครงการกองทัพเรือป 1935 และ 1938 มีอาวุธตอสูอากาศยาน ความเร็ว และพิสัยยอดเยี่ยม ทําใหเปนเรือหลักชั้นเยี่ยม จากที่สั่งตอสี่ลํา มีเพียงสองลําที่ปลอยลงนํ้าและหนึ่งลําที่สรางเสร็จกอนการลมสลายของฝรั่งเศส มีความพยายามหลายครั้งที่จะสรางเรือที่เหลือใหเสร็จดวยแบบเรือตาง ๆ ทั้งเรือประจัญบานตอสูอากาศยาน เรือลูกผสมประจัญบาน-บรรทุกเครื่องบิน หรือเรือบรรทุกเครื่องบินเต็มรูปแบบ"
 VIC_battleship_3: "ชั้นกาสกอญ"
 VIC_battleship_3_desc: "เรือประจัญบานชั้นกาสกอญเปนชั้นยอยของชั้นรีเชอลีเยอ มีการสั่งตอสามลําในโครงการกองทัพเรือป 1940 แตไมมีลําใดเริ่มสราง แบบเรือจะเหมือนรีเชอลีเยอ แตกระจายอาวุธหลักไวทั้งหัวและทายเรืออยางสมดุล มีอาวุธตอสูอากาศยานและเครื่องยนตที่ปรับปรุงแลว ทําใหเปนเรือที่ดีกวาโดยรวม"
 VIC_battleship_4: "ชั้นอาลซาส"
 VIC_battleship_4_desc: "เรือประจัญบานชั้นอาลซาสวางแผนไวเพื่อสืบตอจากชั้นรีเชอลีเยอ มีการสั่งตอสี่ลํา การศึกษาแบบเรือเสร็จในป 1939 ไดรับอนุมัติในป 1940 และคาดวาจะวางกระดูกงูในป 1941 แตการลมสลายของฝรั่งเศสทําใหไมไดเกิดขึ้น แบบเรือนี้พัฒนาตอจากรีเชอลีเยอดวยปนหลักที่หนักและมากขึ้น อาวุธตอสูอากาศยานที่แข็งแกรงขึ้น แผนเกราะที่หนาขึ้น และเครื่องยนตที่ใหญขึ้น"
 VIC_SH_battleship_1: "ชั้นชารเลอมาญ"
 VIC_SH_battleship_1_desc: "เรือซูเปอรประจัญบานชั้นชารเลอมาญเปนแบบเรือสมมติที่ทัดเทียมเรือประจัญบานขนาดใหญของกองทัพเรืออื่น ติดอาวุธหนักทั้งหมดไวดานหนาในตําแหนงยิงขามกัน อาวุธตอสูอากาศยานหนัก และเกราะหนา แบบเรือทั้งหมดยืมองคประกอบจากชั้นรีเชอลีเยอและชั้นเนลสันของอังกฤษ"
 VIC_SH_battleship_2: "ชั้นนโปเลียนโบนาปารต"
 VIC_SH_battleship_2_desc: "เรือประจัญบานชั้นนโปเลียนโบนาปารตเปนแบบเรือสมมติที่อิงจากชั้นอาลซาสและชั้นกาสกอญ อาวุธหนักกระจายไวทั้งหัวและทายเรืออยางสมดุลในปอมสามลํากลอง มีอาวุธรองแบบยิงขามกันและอาวุธตอสูอากาศยานหนัก เกราะหนาและเครื่องยนตทรงพลังใหความเร็วและการปองกันที่จําเปนในการเคลื่อนที่ไปพรอมเรืออื่นในกองเรือและตอสูกับขาศึกไดอยางมีประสิทธิภาพ"
 VIC_carrier_1: "ชั้นแบอารน"
 VIC_carrier_1_desc: "แบอารนเดิมวางกระดูกงูเปนเรือประจัญบานชั้นนอรม็องดี แตตอมาสรางเสร็จเปนเรือบรรทุกเครื่องบิน ระวางขับนํ้า 22,100 ตัน และประจําการในชวงระหวางสงครามและสงครามโลกครั้งที่สอง ในฐานะเรือบรรทุกเครื่องบินดัดแปลง เรือจึงชาและมีพื้นที่สําหรับอากาศยานจํากัด แตสายเกราะขนาดกลางและพิสัยไกลชวยชดเชยจุดออนเหลานี้ การสรางเรือลํานี้มอบประสบการณสําคัญแกนักออกแบบชาวฝรั่งเศสใน DCAN (Direction des Constructions et Armes Navale) และนําไปสูชุดการศึกษาแบบเรือในเวลาตอมา"
 VIC_carrier_2: "ชั้นจอฟเฟอร"
 VIC_carrier_2_desc: "เรือบรรทุกเครื่องบินชั้นจอฟเฟอร (ชื่อโครงการ PA-16) เปนเรือบรรทุกเครื่องบินรุนถัดไปของกองทัพเรือฝรั่งเศส เปนแบบสุดทายของชุดการศึกษาที่เริ่มในป 1929 และสิ้นสุดในป 1937 มีการอนุมัติสองลําในโครงการกองทัพเรือป 1938 แตความขัดแยงที่ทวีความรุนแรงทําใหการกอสรางลาชา และในที่สุดการลมสลายของฝรั่งเศสก็ทําใหสรางไมเสร็จ ระวางขับนํ้าจะอยูที่ราว 20,000 ตัน มีอาวุธตอสูอากาศยาน เกราะ และความเร็วที่ดี แตจํานวนอากาศยานตํ่ากวาเกณฑเฉลี่ย โดยรวมแลวจะเปนเรือบรรทุกเครื่องบินที่สมดุลและอเนกประสงคสําหรับกองทัพเรือฝรั่งเศส"
 VIC_carrier_3: "ชั้นฌ็องบาร"
 VIC_carrier_3_desc: "เรือบรรทุกเครื่องบินฌ็องบารเปนขอเสนอในชวงกลางสงครามที่จะดัดแปลงเรือประจัญบานชั้นรีเชอลีเยอ ฌ็องบาร ที่ยังสรางไมเสร็จใหเปนเรือบรรทุกเครื่องบินเต็มรูปแบบ ในลักษณะคลายกับเรือชินาโนะของกองทัพเรือจักรวรรดิญี่ปุน ตัวเรือขนาดใหญจะรองรับอากาศยานไดจํานวนมาก และเมื่อรวมกับเครื่องยนตขนาดใหญ จะเปนเรือบรรทุกเครื่องบินที่เร็วและพิสัยไกล อาวุธตอสูอากาศยานหนักจากสหรัฐอเมริกาจะใหการปองกันที่ดีตออากาศยานและเรือรบผิวนํ้าขนาดเล็ก"
 VIC_carrier_4: "ชั้นเกลมองโซ"
 VIC_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นเกลมองโซ (ชื่อโครงการ PA-28) เปนแบบเรือบรรทุกเครื่องบินแบบแรกหลังสงครามของกองทัพเรือฝรั่งเศส แบบเรือจะคลายกับเรือบรรทุกเครื่องบินชั้นจอฟเฟอรที่สรางไมเสร็จ แตอุปกรณและอาวุธที่ติดตั้งจะเปนผลิตภัณฑสมัยใหมของฝรั่งเศส การไดมาซึ่งเรือบรรทุกเครื่องบินคุมกันจากกองทัพเรือสหรัฐฯ และราชนาวีอังกฤษ รวมถึงสภาพเศรษฐกิจของฝรั่งเศสหลังสงคราม ทําใหเรือเหลานี้ไมไดวางกระดูกงู อยาสับสนกับเรือบรรทุกเครื่องบินชั้นเกลมองโซรุนหลัง (ชื่อโครงการ PA-54) ซึ่งวางกระดูกงูในป 1955 และ 1957"
 ### YUG - YUGOSLAVIA ###
 YUG_submarine_1: "ชั้นฮราบรี"
 YUG_submarine_1_desc: "เรือดํานํ้าชั้นฮราบรีสองลําเดิมวางกระดูกงูเปนเรือดํานํ้าชั้น L ของอังกฤษใหราชนาวีอังกฤษ แตถูกขายและสรางเสร็จใหยูโกสลาเวียดวยแบบที่ดัดแปลงในป 1928 เปนเรือดํานํ้าขนาดใหญ ระวางขับนํ้า 975 ตัน ติดทอตอรปโดขนาด 533 มม. หกทอ"
 YUG_submarine_2: "ชั้นออสเวตนิก"
 YUG_submarine_2_desc: "เรือดํานํ้าชั้นออสเวตนิกสองลําออกแบบและสรางในฝรั่งเศสตามแบบเรือดํานํ้าชั้นซีรเซ มีขนาดเล็กกวาเรือดํานํ้าชั้นฮราบรีรุนกอนเล็กนอย แตดวยทอตอรปโดขนาด 533 มม. หกทอ จึงยังมีอานุภาพทัดเทียมกัน"
 YUG_destroyer_1: "ชั้นดูบรอฟนิก"
 YUG_destroyer_1_desc: "เรือพิฆาตดูบรอฟนิกเปนเรือที่ใหญที่สุดในกองเรือยูโกสลาเวียในขณะที่จัดซื้อ เรือสรางในสหราชอาณาจักรและสงมอบใหยูโกสลาเวียในป 1932 เปนเรือพิฆาตขนาดใหญ ระวางขับนํ้า 1,880 ตัน ติดปน 140mm/53 Skoda สี่กระบอก อาวุธตอสูอากาศยานที่แข็งแกรง ทอตอรปโดขนาด 533 มม. หกทอ และยุทโธปกรณตอตานเรือดํานํ้าที่ดี"
 YUG_destroyer_2: "ชั้นเบโอกราด"
 YUG_destroyer_2_desc: "เรือชั้นเบโอกราดประกอบดวยเรือพิฆาตสามลําที่สรางโดยไดรับความชวยเหลือจากฝรั่งเศส สองลําสรางที่สปลิต สวนลําที่สามสรางในฝรั่งเศส ทั้งสามลําอิงแบบเรือพิฆาตชั้นลาดรัวของฝรั่งเศสและเขาประจําการในป 1939 มีระวางขับนํ้า 1,210 ตัน ติดปน 120mm/43 Skoda สี่กระบอกและทอตอรปโดขนาด 533 มม. หกทอ มีความเร็วยอดเยี่ยมแตพิสัยตํ่ากวาเกณฑเฉลี่ย"
 YUG_destroyer_4: "ชั้นสปลิต"
 YUG_destroyer_4_desc: "สปลิตเปนเรือพิฆาตหนักที่ปลอยลงนํ้าและสรางเสร็จในยูโกสลาเวีย ปลอยลงนํ้าในป 1943 แตสรางเสร็จในป 1958 ดวยแบบเรือที่ดัดแปลง แบบเดิมมีระวางขับนํ้า 2,400 ตัน ติดปน 140/56 Skoda หากระบอกเปนอาวุธหลัก แมจะมีขนาดใหญ แตก็มีความเร็วยอดเยี่ยม"
 YUG_light_cruiser_1: "ชั้นดัลมาซียา"
 YUG_light_cruiser_1_desc: "เรือลาดตระเวนเกาของเยอรมนี SMS Niobe ถูกขายในป 1925 ใหราชนาวียูโกสลาเวียที่เพิ่งกอตั้ง และไดรับการสรางใหมครั้งใหญ ดวยอาวุธตอสูอากาศยานสมัยใหมและปนที่หนักที่สุดในกองทัพเรือ ดัลมาซียาทําหนาที่หลักเปนเรือฝกการยิงปน"
 screen_ship: "เรือคุมกัน"
 capital_ship: "เรือหลัก"
 
