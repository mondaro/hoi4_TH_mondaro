 ship_hull_carrier_3_desc: "วิธีการกอสรางที่ดีขึ้นและระบบเฉพาะทางยิ่งขึ้นอยางลิฟตขอบดาดฟา ชวยใหเรือบรรทุกเครื่องบินเหลานี้ขนเครื่องบินไดมากขึ้นและมีประสิทธิภาพยิ่งขึ้น"
 SH_battleship_1: "เรือประจัญบานหนักพิเศษ I"
 SH_battleship_2: "เรือประจัญบานหนักพิเศษ II"
 SH_battleship_1_desc: "สถานการณโลกในปจจุบันไมเหลือที่วางใหยึดถือสนธิสัญญานาวีอีกตอไป เมื่อปราศจากขอจํากัดเหลานี้ เราสามารถทุมเทเต็มที่ในการสรางเรือประจัญบานที่หนักที่สุดและติดอาวุธดีที่สุดตลอดกาล ซึ่งสามารถรับมือเรือที่ดอยกวาไดหลายลําพรอมกัน"
 SH_battleship_2_desc: "แบบปรับปรุงจากเรือประจัญบานหนักพิเศษรุนกอนของเรา ดวยอาวุธที่ทรงพลังกวาและระบบควบคุมการยิงที่ดีขึ้น"
 ship_hull_super_heavy_1_desc: "สถานการณโลกในปจจุบันไมเหลือที่วางใหยึดถือสนธิสัญญานาวีอีกตอไป เมื่อปราศจากขอจํากัดเหลานี้ เราสามารถทุมเทเต็มที่ในการสรางเรือประจัญบานที่หนักที่สุดและติดอาวุธดีที่สุดตลอดกาล ซึ่งสามารถรับมือเรือที่ดอยกวาไดหลายลําพรอมกัน"
