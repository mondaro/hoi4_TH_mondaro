 ship_hull_cruiser_desc: "เรือลาดตระเวนคือมางานของกองเรือ รับหนาที่สําคัญมากมาย ตั้งแตการลาดตระเวนและคุมกันสําหรับเรือลาดตระเวนเบา ไปจนถึงการสนับสนุนแนวเรือประจัญบานสําหรับเรือลาดตระเวนหนัก"
 ship_hull_cruiser_1: "เรือลาดตระเวนยุคแรก"
