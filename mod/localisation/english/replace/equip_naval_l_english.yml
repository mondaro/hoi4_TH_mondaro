 ship_hull_carrier_modern_desc: "เรือบรรทุกเครื่องบินที่ใหญและทันสมัยที่สุด สามารถใชเทคโนโลยี ยุทโธปกรณ และความกาวหนาลาสุดได เปนสุดยอดของอาวุธ 'ลํ้าสมัย' อยางแทจริง"
