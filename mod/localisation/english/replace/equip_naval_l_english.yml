 ship_hull_heavy: "เรือหนัก"
 ship_hull_heavy_desc: "สัญลักษณสูงสุดแหงแสนยานุภาพทางทะเล เรือยักษขนาดมหึมาที่หุมเกราะหนาเหลานี้ยังคงเปนที่เกรงขามในทะเลหลวง แมผูเชี่ยวชาญบางคนจะตั้งคําถามถึงบทบาทของมันในยุคของเครื่องบินและเรือดํานํ้า"
 ship_hull_heavy_1: "เรือหนักยุคแรก "
