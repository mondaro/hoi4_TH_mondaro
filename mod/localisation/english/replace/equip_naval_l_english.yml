 ship_hull_submarine_desc: "เรือดํานํ้าสมัยใหมแตกตางอยางลิบลับจากเรือหยาบ ๆ ในมหาสงคราม มีขีดความสามารถมากกวาที่เคย และสามารถคุกคามไดแมแตเรือที่ใหญที่สุดดวยตนทุนที่ไมสูงนัก"
