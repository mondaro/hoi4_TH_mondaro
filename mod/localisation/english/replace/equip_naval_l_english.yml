 rocket_submarine: "เรือดํานํ้ายิงขีปนาวุธ"
 rocket_submarine_desc: "เรือดํานํ้ารุนใหมที่ติดตั้งขีปนาวุธและระบบยิง เปดโอกาสใหเราโจมตีเปาหมายทางยุทธศาสตรของศัตรูไดอยางไมทันตั้งตัว"
 nuclear_submarine: "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc: "$ship_hull_nuclear_submarine_desc$"
 nuclear_missile_submarine: "เรือดํานํ้าขีปนาวุธนิวเคลียร"
 nuclear_missile_submarine_desc: "เรือดํานํ้าที่สามารถบรรทุกและยิงขีปนาวุธนิวเคลียรใสเปาหมายของเรา พวกมันคือมัจจุราชผูทําลายลางโลกอยางแทจริง และเราจะไมมีวันรูตัวเลยวามันกําลังมา"
 submarine_1_desc: "เรือดํานํ้าคือเรือที่ลอบเรนซึ่งออกแบบมาเพื่อทําลายขบวนเรือลําเลียงที่ไมมีการคุมกัน รุนแรก ๆ จากมหาสงครามไดปูทางสูวิธีการใหมของสงครามทางทะเล"
 submarine_2_desc: "เรือดํานํ้าแบบใหมที่มีอาวุธดีกวาและมีเสถียรภาพมากขึ้น ถูกสรางขึ้นเพื่อใชประโยชนจากความกาวหนาทางยุทธวิธีนาวี และมีพิสัยไกลขึ้นจนสามารถโจมตีเสนทางขบวนเรือลําเลียงที่อยูหางไกลได"
 submarine_3_desc: "บทบาทของเรือดํานํ้าในกองเรือนอกเหนือจากการโจมตีขบวนเรือลําเลียงยังคงเปนที่ถกเถียง การสรางสมดุลระหวางความเร็ว พิสัย และอาวุธจะเปนกุญแจสําคัญของแบบที่ตองการ"
 submarine_4_desc: "ความลึกในการดําที่เพิ่มขึ้นและการจัดวางที่มีประสิทธิภาพจะเปนคุณสมบัติของเรือดํานํ้าสมัยใหม โดยอาศัยประสบการณจากสนามรบในการเลือกอาวุธและเครื่องยนตที่เหมาะสม"
 ship_hull_submarine_1_desc: "เรือดํานํ้าคือเรือที่ลอบเรนซึ่งออกแบบมาเพื่อทําลายขบวนเรือลําเลียงที่ไมมีการคุมกัน รุนแรก ๆ จากมหาสงครามไดปูทางสูวิธีการใหมของสงครามทางทะเล"
 ship_hull_submarine_2_desc: "เรือดํานํ้าแบบใหมที่มีอาวุธดีกวาและมีเสถียรภาพมากขึ้น ถูกสรางขึ้นเพื่อใชประโยชนจากความกาวหนาทางยุทธวิธีนาวี และมีพิสัยไกลขึ้นจนสามารถโจมตีเสนทางขบวนเรือลําเลียงที่อยูหางไกลได"
 ship_hull_submarine_3_desc: "บทบาทของเรือดํานํ้าในกองเรือนอกเหนือจากการโจมตีขบวนเรือลําเลียงยังคงเปนที่ถกเถียง การสรางสมดุลระหวางความเร็ว พิสัย และอาวุธจะเปนกุญแจสําคัญของแบบที่ตองการ"
 ship_hull_submarine_4_desc: "ความลึกในการดําที่เพิ่มขึ้นและการจัดวางที่มีประสิทธิภาพจะเปนคุณสมบัติของเรือดํานํ้าสมัยใหม โดยอาศัยประสบการณจากสนามรบในการเลือกอาวุธและเครื่องยนตที่เหมาะสม"
 destroyer_1: "เรือพิฆาต I"
 destroyer_2: "เรือพิฆาต II"
 destroyer_3: "เรือพิฆาต III"
 destroyer_4: "เรือพิฆาต IV"
 destroyer_1_desc: "เพื่อรักษาความปลอดภัยของขบวนเรือลําเลียง เรือพิฆาตจากมหาสงครามตองถูกปรับบทบาทและพัฒนาใหม การติดตั้งตอรปโดใหมากขึ้นจะเพิ่มโอกาสในการเขาปะทะ"
 destroyer_2_desc: "พิสัยตอรปโดที่ไกลขึ้นและความเร็วในการบรรจุใหมที่สูงขึ้น รวมกับอาวุธชนิดใหมอยางปอมปนตอสูอากาศยาน จะชวยใหเรือพิฆาตของเรายังคงมีประสิทธิภาพและอเนกประสงค"
 destroyer_3_desc: "เพื่อรับมือภัยคุกคามทั้งจากฟาและใตนํ้าไดดีขึ้น เรือพิฆาตรุนใหมตองติดตั้งเรดาร รวมทั้งอาวุธตอสูอากาศยานและอาวุธปราบเรือดํานํ้าสมัยใหม"
 destroyer_4_desc: "เรือพิฆาตสมัยใหมตองติดตั้งเทคโนโลยีตรวจจับที่หลากหลาย ระบบปลอยระเบิดลึกแบบใหม และสรางใหมีขนาดใหญกวารุนกอน ๆ"
 ship_hull_light_1_desc: "เพื่อรักษาความปลอดภัยของขบวนเรือลําเลียง เรือพิฆาตจากมหาสงครามตองถูกปรับบทบาทและพัฒนาใหม การติดตั้งตอรปโดใหมากขึ้นจะเพิ่มโอกาสในการเขาปะทะ"
 ship_hull_light_2_desc: "พิสัยตอรปโดที่ไกลขึ้นและความเร็วในการบรรจุใหมที่สูงขึ้น รวมกับอาวุธชนิดใหมอยางปอมปนตอสูอากาศยาน จะชวยใหเรือพิฆาตของเรายังคงมีประสิทธิภาพและอเนกประสงค"
 ship_hull_light_3_desc: "เพื่อรับมือภัยคุกคามทั้งจากฟาและใตนํ้าไดดีขึ้น เรือพิฆาตรุนใหมตองติดตั้งเรดาร รวมทั้งอาวุธตอสูอากาศยานและอาวุธปราบเรือดํานํ้าสมัยใหม"
 ship_hull_light_4_desc: "เรือพิฆาตสมัยใหมตองติดตั้งเทคโนโลยีตรวจจับที่หลากหลาย ระบบปลอยระเบิดลึกแบบใหม และสรางใหมีขนาดใหญกวารุนกอน ๆ"
 light_cruiser_1: "เรือลาดตระเวนเบา I"
 light_cruiser_2: "เรือลาดตระเวนเบา II"
 light_cruiser_3: "เรือลาดตระเวนเบา III"
 light_cruiser_4: "เรือลาดตระเวนเบา IV"
 torpedo_cruiser: "เรือลาดตระเวนตอรปโด"
 torpedo_cruiser_desc: "เรือลาดตระเวนเบาที่ติดตั้งทอยิงตอรปโดจํานวนมาก แลกกับปนใหญหลักที่เล็กลงและปนตอสูอากาศยานที่นอยลง"
 JAP_torpedo_cruiser: "ชั้น Kitakami"
 light_cruiser_1_desc: "เรือลาดตระเวนเบาที่คลองตัวและรักษาความเร็วสูงไดจะยังคงมีประโยชนในภารกิจลาดตระเวน"
 light_cruiser_2_desc: "สนธิสัญญาหลังสงครามไดจํากัดเรือลาดตระเวน แตเรายังสามารถพัฒนาเรือเบาที่ติดอาวุธอยางดีไดโดยยังคงอยูในขอบเขตขอจํากัดเหลานี้"
 light_cruiser_3_desc: "เมื่อเลียบขอบขอจํากัดของสนธิสัญญา เราสามารถสรางเรือลาดตระเวนที่ใหญขึ้นและหุมเกราะหนาขึ้นได โดยยังคงมีอาวุธเบาพอที่จะจัดเปนเรือลาดตระเวนเบา"
 light_cruiser_4_desc: "เรือลาดตระเวนเบารุนสมัยใหมซึ่งใชทางยุทธวิธีเพื่อคุมกันเรือขนาดใหญ สามารถหลุดพนจากขอจํากัดในอดีตเกือบทั้งหมด และติดอาวุธไดดีขึ้นเพื่อรับมือการโจมตีทางอากาศ"
 heavy_cruiser_1: "เรือลาดตระเวนหนัก I"
 heavy_cruiser_2: "เรือลาดตระเวนหนัก II"
 heavy_cruiser_3: "เรือลาดตระเวนหนัก III"
 heavy_cruiser_4: "เรือลาดตระเวนหนัก IV"
 heavy_cruiser_1_desc: "สนธิสัญญานาวีวอชิงตันถูกจัดทําขึ้นเพื่อปองกันการแขงขันสะสมอาวุธดานเรือลาดตระเวนและเรือประเภทอื่น ๆ แตดูเหมือนจะหลีกเลี่ยงไมได ดวยการคงเกราะใหเบา เราจะเพิ่มอาวุธที่บรรทุกได"
 heavy_cruiser_2_desc: "แมจะมีความพยายามใหมในการทําสนธิสัญญา การปรับปรุงเรือลาดตระเวนที่เบากวาใหติดอาวุธหนักขึ้นยังคงมีประสิทธิภาพ แมเกราะจะยังคงถูกจํากัด"
 heavy_cruiser_3_desc: "เมื่อขอจํากัดถูกเพิกเฉยมากขึ้นทั่วโลก เราสามารถสรางเรือลาดตระเวนหนักแบบที่สมดุลมากขึ้นโดยใหความสําคัญกับเกราะมากขึ้น ปนตอสูอากาศยานที่ดีขึ้นชวยใหเรือเหลานี้รวมปฏิบัติการในสงครามทางอากาศเหนือทะเลได"
 heavy_cruiser_4_desc: "แบบที่ขยายขนาด ยาวขึ้น และหนักขึ้น พรอมอาวุธยิงเร็ว คือลักษณะเดนของการพัฒนาเรือลาดตระเวนหนักในขั้นสุดทายนี้"
 ship_hull_cruiser_1_desc: "แมจะถูกผูกมัดดวยขอกําหนดของสนธิสัญญานาวีวอชิงตัน เรือลาดตระเวนก็ยังคงเปนเรือรบที่ยืดหยุนที่สุด ตัวเรือนี้ชวยใหสรางไดทั้งเรือลาดตระเวนเบาสําหรับการคุมกันและลาดตระเวน หรือเรือลาดตระเวนหนักเพื่อสนับสนุนแนวเรือประจัญบาน"
 ship_hull_cruiser_2_desc: "เรือลาดตระเวนรุนถัดไปมีการจัดวางเครื่องยนตแบบใหมที่ชวยเพิ่มความอยูรอด รวมทั้งมีพื้นที่สําหรับสิ่งอํานวยความสะดวกดานอากาศยานโดยเฉพาะ"
 ship_hull_cruiser_3_desc: "เมื่อเรือลาดตระเวนทั่วโลกมีพลังและขีดความสามารถมากขึ้น จึงจําเปนตองมีตัวเรือใหมที่ใหญขึ้นเพื่อรองรับอุปกรณเพิ่มเติมทั้งหมดที่ตองใช"
 ship_hull_cruiser_4_desc: "ดวยอิทธิพลจากประสบการณในสงคราม เรือลาดตระเวนรุนลาสุดมีการจัดโครงสรางสวนบนใหมเพื่อใหอาวุธตอสูอากาศยานมีมุมยิงกวางขึ้น และจัดผังภายในใหมเพื่อรองรับการใชเรดาร"
 battle_cruiser_1: "เรือลาดตระเวนประจัญบาน I"
 battle_cruiser_2: "เรือลาดตระเวนประจัญบาน II"
 battle_cruiser_3: "เรือลาดตระเวนประจัญบาน III"
 battle_cruiser_4: "เรือลาดตระเวนประจัญบาน IV"
 battle_cruiser_1_desc: "การแขงขันสะสมอาวุธดานเรือลาดตระเวนประจัญบานหลังสงครามไดใหกําเนิดแบบเรือติดอาวุธหนักหลายแบบ ซึ่งยอมสละเกราะเพื่อแลกกับความเร็วเมื่อเทียบกับเรือประจัญบาน"
 battle_cruiser_2_desc: "เรือลาดตระเวนประจัญบานที่ถูกสรางใหมและปรับบทบาทยังคงแลนไดเร็วกวาแมแตเรือประจัญบานแบบสมัยใหมดวยการปองกันที่เบากวา แตไดพัฒนาระบบควบคุมการยิง การตรวจจับ และการปองกันทางอากาศที่ดีขึ้น"
 battleship_1: "เรือประจัญบาน I"
 battleship_2: "เรือประจัญบาน II"
 battleship_3: "เรือประจัญบาน III"
 battleship_4: "เรือประจัญบาน IV"
 battleship_5: "เรือประจัญบาน V"
 battleship_6: "เรือประจัญบาน VI"
 battleship_1_desc: "บางคนมองวาเปนซากของยุคสงครามทางทะเลที่ลวงเลยไปแลว บางคนมองวาเปนเรือที่นาเกรงขามที่สุดเทาที่เคยสรางมา แตไมมีใครปฏิเสธไดวาสิ่งที่หลงเหลือจากการแขงขันสะสมเรือประจัญบานเหลานี้คือเรือที่ติดอาวุธและหุมเกราะหนักที่สุดบางลําเทาที่เคยสรางมา"
 battleship_2_desc: "ดวยเสถียรภาพและพิสัยที่ดีขึ้น เรือประจัญบานรุนใหมไดพัฒนาตอยอดจากแบบกอน ๆ ขณะยังคงอยูในขอบเขตที่สนธิสัญญานาวีกําหนด"
 battleship_3_desc: "เกราะที่หนาขึ้น เครื่องยนตที่แรงขึ้น ปนใหญขนาดลํากลองใหญ และขีดความสามารถตอสูอากาศยานที่ดีขึ้น สามารถทําใหเรือประจัญบานยังคงมีบทบาทไดหากใชงานอยางถูกตอง ในโลกที่สงครามทางทะเลถูกครอบงําดวยการสนับสนุนทางอากาศมากขึ้นเรื่อย ๆ"
 battleship_4_desc: "ขณะที่โลกกําลังไดเห็นสิ่งที่อาจเปนการปะทะครั้งใหญครั้งสุดทายของเรือประจัญบาน ความสําคัญของอาวุธหนักและปอมปนตอสูอากาศยานยิ่งทวีความสําคัญกวาที่เคย"
 ship_hull_heavy_1_desc: "บางคนมองวาเปนซากของยุคสงครามทางทะเลที่ลวงเลยไปแลว บางคนมองวาเปนเรือที่นาเกรงขามที่สุดเทาที่เคยสรางมา แตไมมีใครปฏิเสธไดวาสิ่งที่หลงเหลือจากการแขงขันสะสมเรือประจัญบานเหลานี้คือเรือที่ติดอาวุธและหุมเกราะหนักที่สุดบางลําเทาที่เคยสรางมา"
 ship_hull_heavy_2_desc: "ดวยเสถียรภาพและพิสัยที่ดีขึ้น เรือประจัญบานรุนใหมไดพัฒนาตอยอดจากแบบกอน ๆ ขณะยังคงอยูในขอบเขตที่สนธิสัญญานาวีกําหนด"
 ship_hull_heavy_3_desc: "เกราะที่หนาขึ้น เครื่องยนตที่แรงขึ้น ปนใหญขนาดลํากลองใหญ และขีดความสามารถตอสูอากาศยานที่ดีขึ้น สามารถทําใหเรือประจัญบานยังคงมีบทบาทไดหากใชงานอยางถูกตอง ในโลกที่สงครามทางทะเลถูกครอบงําดวยการสนับสนุนทางอากาศมากขึ้นเรื่อย ๆ"
 ship_hull_heavy_4_desc: "ขณะที่โลกกําลังไดเห็นสิ่งที่อาจเปนการปะทะครั้งใหญครั้งสุดทายของเรือประจัญบาน ความสําคัญของอาวุธหนักและปอมปนตอสูอากาศยานยิ่งทวีความสําคัญกวาที่เคย"
 carrier_1: "เรือบรรทุกเครื่องบิน I"
 carrier_2: "เรือบรรทุกเครื่องบิน II"
 carrier_3: "เรือบรรทุกเครื่องบิน III"
 carrier_4: "เรือบรรทุกเครื่องบิน IV"
 carrier_5: "เรือบรรทุกเครื่องบิน V"
 carrier_6: "เรือบรรทุกเครื่องบิน VI"
 carrier_1_desc: "นักทฤษฎีทางทหารจํานวนมากเชื่อวาการบินนาวีคืออนาคต การดัดแปลงเรือหลักเกาและเรือเดินสมุทรใหบรรทุกอากาศยานไดจะเปนกาวแรกสูการนําหลักนิยมใหมเหลานี้มาใช"
 carrier_2_desc: "ขณะที่งานออกแบบเรือบรรทุกเครื่องบินที่สรางขึ้นใหมตั้งแตกระดูกงูเริ่มตนขึ้น เราตองมั่นใจวาเรือเหลานี้มีพิสัยและความเร็วที่ตามทันกองทัพเรือสวนอื่นของเรา ขณะยังคงเคารพสนธิสัญญานาวีหลังสงคราม"
 carrier_3_desc: "วิธีการกอสรางที่ดีขึ้นและระบบเฉพาะทางยิ่งขึ้นอยางลิฟตขอบดาดฟา ชวยใหเรือบรรทุกเครื่องบินเหลานี้ขนเครื่องบินไดมากขึ้นและมีประสิทธิภาพยิ่งขึ้น"
 carrier_4_desc: "เมื่อสนธิสัญญานาวีหลายฉบับถูกเพิกเฉยมากขึ้น เราสามารถสรางเรือบรรทุกเครื่องบินที่ขนเครื่องบินไดมากกวาที่เคยเพื่อสรางความเหนือกวาทางอากาศ"
 ship_hull_carrier_1_desc: "นักทฤษฎีทางทหารจํานวนมากเชื่อวาการบินนาวีคืออนาคต การดัดแปลงเรือหลักเกาและเรือเดินสมุทรใหบรรทุกอากาศยานไดจะเปนกาวแรกสูการนําหลักนิยมใหมเหลานี้มาใช"
