 ship_hull_carrier: "เรือบรรทุกเครื่องบิน"
 ship_hull_carrier_desc: "หลังการทดลองมาหลายป เรือบรรทุกเครื่องบินไดคอย ๆ พัฒนาจนกลายเปนเรือประเภทหนึ่งของตนเอง ดวยความสามารถในการรองรับอากาศยานที่ทรงพลังยิ่งขึ้นในจํานวนที่เพิ่มขึ้นเรื่อย ๆ เรือบรรทุกเครื่องบินจึงพรอมจะกลายเปนที่สุดของการแผแสนยานุภาพทางทะเล"
