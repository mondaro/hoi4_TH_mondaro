 ship_hull_pre_dreadnought_desc: "เรือที่หลงเหลือมาจากยุคกอนการแขงขันสรางเรือเดรดนอตซึ่งนําไปสูมหาสงคราม เรือรบกอนยุคเดรดนอตมีคุณคาในการรบอยางจํากัดมากในยุคปจจุบัน"
 ship_hull_cruiser_panzerschiff: "Panzerschiff"
 ship_hull_cruiser_panzerschiff_desc: "ในความพยายามทําสิ่งที่เปนไปไมได วิศวกรชาวเยอรมันประสบความสําเร็จในการผสานอาวุธระดับเกือบเทาเรือประจัญบานเขากับตัวเรือลาดตระเวน ผลลัพธคือเรือที่มีอํานาจการยิงเหนือกวาเรือลาดตระเวนใด ๆ ที่รูจัก แตก็มีราคาแพง คอนขางชา และหุมเกราะคอนขางบาง"
 ship_hull_cruiser_coastal_defense_ship: "เรือปองกันชายฝง"
 ship_hull_cruiser_coastal_defense_ship_desc: "เล็กเกินไปสําหรับการรบในมหาสมุทรอยางแทจริง เรือที่คอนขางราคาถูกนี้ยอมสละพิสัยเพื่อแลกกับอาวุธและเกราะหนัก"
 ship_hull_torpedo_cruiser: "เรือลาดตระเวนตอรปโด"
 ship_hull_torpedo_cruiser_desc: "เรือลาดตระเวนเบาที่ติดตั้งทอยิงตอรปโดจํานวนมาก แลกกับปนใหญหลักที่เล็กลงและปนตอสูอากาศยานที่นอยลง"
 ship_hull_super_heavy_1: "เรือประจัญบานหนักพิเศษ"
 ship_hull_cruiser_submarine: "เรือดํานํ้าลาดตระเวน"
 ship_hull_cruiser_submarine_desc: "ตัวเรือดํานํ้าขนาดใหญที่ปรับใหเหมาะกับพิสัยไกล สามารถติดตั้งถังเชื้อเพลิงเพิ่มเติมเพื่อเพิ่มพิสัยยิ่งขึ้น หรือเครื่องบินลาดตระเวนขนาดเล็กได"
 ship_hull_midget_submarine: "เรือดํานํ้าจิ๋ว"
 ship_hull_midget_submarine_desc: "เรือดํานํ้าขนาดเล็กที่ใชลูกเรือจํานวนนอย พิสัยและขีดความสามารถดานอาวุธที่ลดลงถูกชดเชยดวยอัตราการผลิตที่สูง"
 ship_hull_fleet_submarine: "เรือดํานํ้ากองเรือ"
 ship_hull_fleet_submarine_desc: "เรือดํานํ้าที่ดวยพิสัยปฏิบัติการไกลจึงสามารถทําหนาที่คุมกันและสนับสนุนกองเรือผิวนํ้าได"
 ship_hull_carrier_submarine: "เรือดํานํ้าบรรทุกเครื่องบิน"
 ship_hull_carrier_submarine_desc: "ตัวเรือดํานํ้าขนาดใหญที่สามารถเก็บและสงอากาศยานขึ้นปฏิบัติภารกิจทางอากาศไดหลากหลาย"
 ship_hull_nuclear_submarine: "เรือดํานํ้านิวเคลียร"
 ship_hull_nuclear_submarine_desc: "ดวยเตาปฏิกรณนิวเคลียร เรือดํานํ้าของเราสามารถปฏิบัติการใตนํ้าไดเปนเวลานานมาก พรอมคงความเร็วสูง ทําใหเปนเครื่องมือที่อันตรายอยางยิ่งในคลังแสงของเรา "
 ship_hull_mega_carrier: "เรือบรรทุกเครื่องบินนํ้าแข็ง"
 ship_hull_mega_carrier_desc: "เรือบรรทุกเครื่องบินขนาดมหึมาที่สรางจากวัสดุผสมนํ้าแข็งแบบทดลองอยาง Pykrete ซึ่งเครื่องบินทั่วไปสามารถใชขึ้นลงได ชวยเพิ่มพิสัยของการบินนาวีของเรา"
 support_ship_hull: "เรือสนับสนุน"
 support_ship: "เรือสนับสนุน"
 support_ship_1: "เรือสนับสนุน"
 support_ship_1_desc: "เรือสนับสนุนคือเรือที่ไมใชเรือรบ มุงเนนการสงกําลังบํารุงใหกองเรือรบ ชวยยืดระยะเวลาปฏิบัติการดวยเชื้อเพลิงและเสบียงสํารอง"
 support_ship_2: "เรือสนับสนุนปรับปรุง"
 support_ship_2_desc: "ประสบการณปฏิบัติการทําใหไดเรือสนับสนุนที่กาวหนาและมีขีดความสามารถมากขึ้น สามารถคํ้าจุนกองเรือรบไดในระยะทางที่ไกลยิ่งขึ้น"
 repair_ship_hull: "เรือซอมบํารุง"
 repair_ship: "เรือซอมบํารุง"
 repair_ship_1: "เรือซอมบํารุง"
 repair_ship_1_desc: "เรือซอมบํารุงบรรทุกอุปกรณกูซอมงานหนักที่อาจเปนตัวตัดสินระหวางเรือที่เสียหายหนักแตยังประคองตัวกลับทาได กับเรือที่จมลง"
 repair_ship_2: "เรือซอมบํารุงปรับปรุง"
 repair_ship_2_desc: "เรือซอมบํารุงที่มีขีดความสามารถสูงยิ่งขึ้น พรอมอุปกรณลํ้าสมัยที่สามารถชวยเรือรบฝายเดียวกันจากความเสียหายไดแทบทุกระดับ ยกเวนความเสียหายรายแรงที่สุด"
 ship_hull_escort_carrier: "เรือบรรทุกเครื่องบินคุมกัน"
 ship_hull_escort_carrier_desc: "เรือบรรทุกเครื่องบินที่เล็กกวาและราคาถูกกวา มักใชคุมกันขบวนเรือลําเลียงและปราบเรือดํานํ้ามากกวาการรบของกองเรือโดยตรง บรรทุกกองบินขนาดเล็กแตมีประโยชน"
 escort_carrier: "เรือบรรทุกเครื่องบินคุมกัน"
 escort_carrier_desc: "เรือบรรทุกเครื่องบินที่เล็กกวาและราคาถูกกวา มักใชคุมกันขบวนเรือลําเลียงและปราบเรือดํานํ้ามากกวาการรบของกองเรือโดยตรง บรรทุกกองบินขนาดเล็กแตมีประโยชน"
 ### ENG - ENGLAND ###
 ENG_submarine_1: "ชั้น L"
 ENG_submarine_1_desc: "เรือชั้น L เปนเรือดํานํ้าขนาดกลางที่เดิมวางแผนไวภายใตโครงการสงครามฉุกเฉิน ในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางขึ้นในชวงทายของสงครามโลกครั้งที่หนึ่งและติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น ประจําการจนถึงชวงตนสงครามโลกครั้งที่สอง ซึ่งสวนใหญถูกใชในภารกิจรองและการฝก"
 #ENG_submarine_1b: "O/P/R Class"
 #ENG_submarine_1c: "S Class"
 ENG_submarine_2: "ชั้น T"
 ENG_submarine_2_desc: "เรือชั้น To หรือชั้น Triton ถูกออกแบบมาแทนที่เรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าขนาดคอนขางใหญที่มีพิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้ติดอาวุธดีและเปนแพลตฟอรมที่มีเสถียรภาพ ถูกใชอยางกวางขวางในสงคราม โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายระหวางสงคราม"
 ENG_submarine_3: "ชั้น U"
 ENG_submarine_3_desc: "เรือชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือจึงถูกเปลี่ยน ทําใหเรือดํานํ้าเหลานี้พิสูจนคุณคาในนานนํ้าจํากัดของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงมีจํากัด เรือชั้นนี้ประกอบดวยชั้นยอยสามชั้น ไดแก Undine, Umpire และ Uproar"
 #ENG_submarine_3b: "Seraph Class"
 ENG_submarine_4: "ชั้น V"
 ENG_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้น Vampire พัฒนาจากเรือชั้น U ขนาดเล็กรุนกอน มีขนาดใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้นแตพิสัยปฏิบัติการและอาวุธมีจํากัด"
 #ENG_submarine_4b: "Amphion Class"
 ENG_destroyer_1: "ชั้น V/W"
 ENG_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของ Admiralty และ Thornycroft สรางขึ้นภายใตโครงการสงครามฉุกเฉิน เปนวิวัฒนาการขั้นสูงสุดของการออกแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่หนึ่ง ซึ่งรวมการปรับปรุงจากรุนกอนหนาเขากับความกาวหนาทางเทคโนโลยีใหม เรือเหลานี้ถูกสรางขึ้นจํานวนมากในชวงทายของสงครามโลกครั้งที่หนึ่งและกลายเปนกําลังหลักของหมวดเรือพิฆาตแหงราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือเหลานี้ถูกนําเขากองเรือสํารอง และในที่สุดถูกลดบทบาทไปทําหนาที่คุมกันขบวนเรือลําเลียง เปนเรือที่รวดเร็ว ติดอาวุธเพียงพอ และมีพิสัยดี"
 #ENG_destroyer_1b: "A/B/C/D Class"
 ENG_destroyer_2: "ชั้น G/H/I"
 ENG_destroyer_2_desc: "เรือพิฆาตชั้น G, H และ I ถูกสั่งตอในโครงการกอสรางนาวีป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าของชั้น F กอนหนา โดยมีขนาดเล็กลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยใชปนขนาด 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล ติดอาวุธเพียงพอ และมีตอรปโดที่ทรงพลัง ถูกใชอยางกวางขวางในสงครามและสูญเสียไปจํานวนมาก"
 #ENG_destroyer_2b: "Tribal Class"
 ENG_destroyer_3: "ชั้น J/K/N"
 ENG_destroyer_3_desc: "เรือชั้น J, K และ N มีลักษณะคลายชั้น Tribal กอนหนา แตแทนที่จะเนนอาวุธปน ผูออกแบบกลับไปใชการจัดวางแบบมาตรฐานที่เนนตอรปโดหนักและปนเบากวา เรือเหลานี้ไดรับการดัดแปลงตลอดการประจําการในสงคราม การอัปเกรดรวมถึงปนตอสูอากาศยานและเรดารที่ดีขึ้น เปนเรือที่รวดเร็ว พิสัยไกล และติดอาวุธดี เหมาะสําหรับคุมกันกองเรือ"
 ENG_destroyer_4: "ชั้น Battle"
 ENG_destroyer_4_desc: "เรือพิฆาตชั้น Battle พัฒนาตอยอดจากวิวัฒนาการของเรือพิฆาตอังกฤษที่ใชตลอดสงคราม เรือเหลานี้ถูกสั่งตอในโครงการนาวีป 1942 และ 1943 ติดอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถปราบเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรือที่อเนกประสงค การเขาประจําการลาชาในสงครามทําใหมีบทบาทเพียงเล็กนอย"
 #ENG_destroyer_4b: "Weapon Class"
 ENG_light_cruiser_1: "ชั้น C"
 ENG_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบาที่สรางขึ้นกอนและระหวางสงครามโลกครั้งที่หนึ่งสําหรับสภาพอันโหดรายของทะเลเหนือ พิสูจนแลววาเปนเรือที่ทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธของเรือเกินพอ เพราะติดปนขนาด 6 นิ้วเพียงพอที่จะตอสูกับเปาหมายผิวนํ้าของศัตรู และตอรปโดจํานวนมากเพื่อปดฉากเรือและขบวนเรือลําเลียงของศัตรู ถูกใชอยางกวางขวางในสงครามโลกครั้งที่หนึ่งและรวมในการรบผิวนํ้าหลายครั้ง"
 #ENG_light_cruiser_1b: "Emerald Class"
 #ENG_light_cruiser_1c: "Amphion Class"
 ENG_light_cruiser_2: "ชั้น Southampton"
 ENG_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้น Southampton เปนชั้นยอยของเรือลาดตระเวนชั้น Town และออกแบบมาเพื่อตอบโตเรือลาดตระเวนชั้น Mogami ของญี่ปุน เรือเหลานี้หุมเกราะดี มีความเร็วและพิสัยดี และติดอาวุธที่นาเกรงขามเปนปนขนาด 6 นิ้วสิบสองกระบอกในปอมปนสามลํากลองสี่ปอม เปนตนแบบของเรือลาดตระเวนเบาในยามสงครามของราชนาวีอีกหลายแบบในเวลาตอมา"
 #ENG_light_cruiser_2b: "Edinburgh Class"
 ENG_light_cruiser_3: "ชั้น Crown Colony"
 ENG_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้น Crown Colony เปนรุนปรับปรุงของชั้น Town กอนหนา แตมีการออกแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือเหลานี้ติดปนแบบเดียวกับรุนกอน คือปอมปนสามลํากลองสี่ปอมที่ติดปนขนาด 6 นิ้ว หุมเกราะใกลเคียงกัน แตเพราะเครื่องยนตที่เล็กกวา พิสัยจึงลดลงบาง ประเภทนี้มีชั้นยอยสองชั้น ไดแก Fiji และ Ceylon"
 #ENG_light_cruiser_3b: "Dido Class"
 ENG_light_cruiser_4: "ชั้น Minotaur"
 ENG_light_cruiser_4_desc: "หรือที่รูจักกันในชื่อชั้น Swiftsure เรือลาดตระเวนเหลานี้ออกแบบเปนรุนดัดแปลงของชั้น Crown Colony โดยรวมการดัดแปลงในยามสงครามที่ไดรับอนุมัติในป 1941 มีพิสัยปฏิบัติการไกลกวาและมีอาวุธตอสูอากาศยานมากกวาชั้น Crown Colony ขณะที่อาวุธหลักลดลงเหลือปอมปนสามลํากลองสามปอม สรางเสร็จชาเกินกวาจะสงผลตอผลลัพธของสงคราม เรือสวนใหญที่สั่งตอจึงถูกยกเลิกในภายหลัง "
 ENG_heavy_cruiser_1: "ชั้น Hawkins"
 ENG_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้น Hawkins เปนเรือลาดตระเวนหนักลําแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้น Town กอนหนา โดยเฉพาะชั้นยอย Birmingham แตติดปนขนาด 7.5 นิ้วและสายเกราะที่หนาขึ้น ออกแบบมาเพื่อตอสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี ติดอาวุธดี มีความเร็วและพิสัยพอสมควร และมีการปองกันที่ดี รวมแลวมีเรือขึ้นระวางประจําการหาลํา แตมีเพียงสี่ลําที่ยังประจําการอยูเมื่อเริ่มสงครามโลกครั้งที่สอง"
 #ENG_heavy_cruiser_1b: "County Class"
 ENG_heavy_cruiser_2: "ชั้น Surrey"
 ENG_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้น Surrey ถูกเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้น York กอนหนา หากสรางเสร็จ เรือจะติดปอมปนแฝดขนาด 8 นิ้วสี่ปอม เกราะที่หนักขึ้น และเครื่องยนตที่ทรงพลังกวา มีการสั่งตอเรือสองลําแตไมมีลําใดไดวางกระดูกงู"
 ENG_heavy_cruiser_3: "ชั้น Admiral"
 ENG_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้น Admiral (ไมใชเรือลาดตระเวนประจัญบานชั้น Admiral) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนที่ติดปนขนาด 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และสิ้นสุดในป 1941 ไดขอเสนอหลากหลายแบบ ขอเสนอสุดทายประกอบดวยปนขนาด 8 นิ้วแบบใหมในปอมปนสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วที่ดี การที่ศัตรูขาดแคลนเรือลาดตระเวนและความคุมคาของเรือเหลานี้ ทําใหหันไปเนนสรางเรือลาดตระเวนเบาใหมากขึ้นแทน"
 ENG_heavy_cruiser_4: "แบบของเชอรชิลล"
 ENG_heavy_cruiser_4_desc: "เรือเหลานี้ถูกเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกองทัพเรือ ในชวงตนสงครามโลกครั้งที่สอง เพื่อตอบโตเรือลาดตระเวนปนใหญชั้น Deutschland ของเยอรมนี เรือเหลานี้มีปนขนาด 9.2 นิ้ว อาวุธตอสูอากาศยานหนัก และเกราะแข็งแกรง ออกแบบมาเพื่อตอสูกับเรือหลักของศัตรูอยางมีประสิทธิภาพ ในที่สุดเรือเหลานี้ถูกยกเลิกเพราะตนทุนสูงและไมมีความตองการเรือลาดตระเวนหนักแบบใหม "
 ENG_battle_cruiser_1: "ชั้น Renown"
 ENG_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้น Renown เดิมวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้น Revenge การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่ 1 ปะทุขึ้น พลเรือเอกลอรดฟชเชอรผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบานไดสําเร็จ เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานโดยแท ติดอาวุธดี เร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากทั้งหมดสามลําที่วางแผนไว มีเพียงสองลําคือ Repulse และ Renown ที่สรางเสร็จ"
 #ENG_battle_cruiser_1b: "Admiral Class"
 ENG_battle_cruiser_2: "ชั้น Princess Royal"
 ENG_battle_cruiser_2_desc: "Princess Royal เปนเรือลาดตระเวนประจัญบานสมมุติ ซึ่งเปนรุนที่เร็วกวาและถูกกวาของเรือประจัญบานชั้น King George V เรือเหลานี้ติดอาวุธใกลเคียงกันแตลดจํานวนลง ทั้งสําหรับการรบผิวนํ้าและการตอตานอากาศยาน ไดแก ปนใหญ 14 นิ้วปอมสามลํากลองสองปอม และปนตอสูอากาศยาน 5.25 นิ้วปอมแฝดหกปอม ความเร็วสูงและพิสัยไกลจะชวยใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 ENG_battleship_1: "ชั้น Revenge"
 ENG_battleship_1_desc: "เรือประจัญบานชั้น Revenge ถูกสั่งตอในป 1913 ในฐานะรุนราคาประหยัดของเรือเดรดนอตความเร็วสูงชั้น Queen Elizabeth แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่ 2 จากที่วางแผนไว 8 ลํา สรางเสร็จเพียง 5 ลํา"
 #ENG_battleship_1b: "Nelson Class"
 ENG_battleship_2: "ชั้น King George V"
 ENG_battleship_2_desc: "เรือประจัญบานชั้น King George V เปนผลจากสนธิสัญญาวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและปนของเรือหลัก ดวยเหตุนี้ เรือเหลานี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้น Queen Elizabeth ที่เกาแลว"
 ENG_battleship_3: "ชั้น Lion"
 ENG_battleship_3_desc: "เรือประจัญบานชั้น Lion เปนชั้นที่สืบตอจากเรือประจัญบาน King George V โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้น Revenge ที่ชราภาพ แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบที่ปะทุขึ้น เรือเหลานี้จะมีลักษณะโดยรวมคลายชั้น King George แตอาวุธหลักจะหนักกวา โดยนําปนใหญ 16 นิ้วแบบใหมมาใช อีกทั้งจะมีเกราะหนาขึ้นและเครื่องยนตทรงพลังยิ่งขึ้น"
 ENG_battleship_4: "ชั้น Vanguard"
 ENG_battleship_4_desc: "เรือประจัญบานชั้น Vanguard เปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวี มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาสรางเพิ่มอีกสี่ลําสําหรับยุทธบริเวณแปซิฟก เรือถูกสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ใหเสถียรภาพและความทนทะเลยอดเยี่ยม อาวุธเปนแบบเดียวกับเรือประจัญบานชั้น Queen Elizabeth และ Revenge ใหอํานาจการยิงสูง เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือทั้งเร็วและไดรับการปกปองอยางดี"
 ENG_SH_battleship_1: "ชั้น Centurion"
 ENG_SH_battleship_1_desc: "Centurion เปนเรือประจัญบานหนักสมมุติของราชนาวี สรางขึ้นเพื่อรับมือเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาดใหญ 18 นิ้วและเกราะหนาใหอํานาจการยิงและการปกปองที่จําเปนในการตอกรกับเรือเหลานี้ อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีเปนสิ่งจําเปนเพื่อครอบคลุมนานนํ้าอันกวางใหญของจักรวรรดิบริติช"
 ENG_SH_battleship_2: "ชั้น Lion II"
 ENG_SH_battleship_2_desc: "เรือประจัญบานชั้น Lion II ไดรับการออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้น Lion รุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จ จะติดปน 16 นิ้วรุนลาสุดแบบปอมสามลํากลองสามหรือสี่ปอม แผนเกราะหนาปกปองเรือจากศัตรูทั้งผิวนํ้าและทางอากาศ คาใชจายในการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการนี้ถูกยกเลิก"
 ENG_carrier_1: "ชั้น Courageous"
 ENG_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวี การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือมีเกราะปานกลางแตอาวุธครบครัน พิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลง จํานวนเครื่องบินที่บรรทุกไดจึงจํากัด ถึงกระนั้น เรือเหลานี้ก็มอบประสบการณสําคัญแกราชนาวีในการสรางเรือบรรทุกเครื่องบินและการแผอํานาจทางอากาศของกองเรือ"
 ENG_carrier_2: "ชั้น Ark Royal"
 ENG_carrier_2_desc: "เรือบรรทุกเครื่องบิน Ark Royal เปนเรือประเภทนี้ลําแรกที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน และเปนเรือลําแรกที่โรงเก็บเครื่องบินและดาดฟาบินเปนสวนหนึ่งของตัวเรือ ออกแบบในป 1934 เรือลํานี้มีเกราะและอาวุธที่ดี บรรทุกเครื่องบินไดจํานวนมาก และมีพิสัยปฏิบัติการกับความเร็วเพียงพอที่จะรวมปฏิบัติการกับกําลังหลักของราชนาวี"
 ENG_carrier_3: "ชั้น Illustrious"
 ENG_carrier_3_desc: "ชั้น Illustrious ออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน นับเปนเรือบรรทุกเครื่องบินอังกฤษลําแรกที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหขนาดกองบินลดลง เกราะหนาและอาวุธตอสูอากาศยานใหการปองกันที่แข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหเรือมีพิสัยปฏิบัติการไกล"
 ENG_carrier_4: "ชั้น Implacable"
 ENG_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้น Implacable ถูกสั่งตอภายใตโครงการนาวีป 1938 และโดยพื้นฐานคือรุนปรับปรุงของชั้น Illustrious สงครามและการเปลี่ยนลําดับความสําคัญไปยังเรือขนาดเล็กเพื่อคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงคราม ทําใหการสรางเรือเหลานี้ลาชา เรือมีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้น โดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาทําใหมีความเร็วและพิสัยปฏิบัติการมากกวาชั้น Illustrious"
 #ENG_carrier_4b: "Malta Class"
 ### FRA - FRANCE ###
 FRA_submarine_1: "ซีรีส 600"
 FRA_submarine_1_desc: "เรือดํานํ้าซีรีส 600 ตัน เปนเรือดํานํ้าสมัยใหมรุนแรกของฝรั่งเศสหลังสงครามโลกครั้งที่ 1 มีขนาดกลาง ระวางขับนํ้าราว 600 ตัน แมจะเปนเรือเดินสมุทร แตถูกจัดเปนเรือดํานํ้าชายฝงและใชงานสวนใหญในนานนํ้าอบอุนของทะเลเมดิเตอรเรเนียน เรือแบบนี้สรางขึ้นสามชั้น ชั้นละ 4 ลํา ไดแก ชั้น Sirène, Ariane และ Circé และเปนพื้นฐานของซีรีส 630 ตันที่ใหญกวา ไดแก ชั้น Argonaute, Diane และ Orion"
 #FRA_submarine_1b: "630 Series"
 #FRA_submarine_1c: "Redoutable Class"
 FRA_submarine_2: "ชั้น Minerve"
 FRA_submarine_2_desc: "เรือดํานํ้าชั้น Minerve (ชื่อโครงการ T2) พัฒนาจากซีรีส 630 ตัน แตมีเครื่องยนตดีกวาและการจัดวางทอตอรปโดตางออกไป เรือดํานํ้าเหลานี้เปนสวนแรกของโครงการสรางมาตรฐาน ซึ่งเปนผลจากการออกแบบรวมศูนยโดย DCAN (Direction des Constructions et Armes Navale) แทนที่จะเปนแบบเฉพาะของแตละอูตอเรือเหมือนชั้นกอนหนา"
 #FRA_submarine_2b: "Aurore Class"
 FRA_submarine_3: "ชั้น Roland Morillot"
 FRA_submarine_3_desc: "เรือดํานํ้าชั้น Roland Morillot (ชื่อโครงการ Z2) เปนเรือดํานํ้าเดินสมุทรขนาดใหญที่พัฒนาจากเรือดํานํ้าชั้น Redoubtable รุนกอน มีระวางขับนํ้า 1,800-2,400 ตัน และติดอาวุธทรงพลังดวยทอตอรปโด 10 ทอ ฝรั่งเศสลมสลายกอนที่จะมีลําใดสรางเสร็จ"
 FRA_submarine_4: "ชั้น Phénix"
 FRA_submarine_4_desc: "เรือดํานํ้าชั้น Phénix เปนเรือเดินสมุทรพิสัยไกลขนาดกลางที่ไดรับอนุมัติในโครงการนาวีป 1939-40 แตการเริ่มตนของสงครามและการลมสลายของฝรั่งเศสทําใหตองยกเลิก เรือเหลานี้คลายกับชั้น Redoutable แตเล็กกวา ระวางขับนํ้า 1,200 ตัน และติดอาวุธตอรปโดหนักในระดับใกลเคียงกัน"
 FRA_destroyer_1: "ชั้น Bourrasque"
 FRA_destroyer_1_desc: "เรือพิฆาตชั้น Bourrasque เปนสวนหนึ่งของซีรีส 1,500 ตัน และปลอยลงนํ้าในกลางทศวรรษ 1920 เรือชั้นนี้รวมกับชั้น Chacal กอนหนาและชั้น L'Adroit ที่ตามมา เปนกําลังหลักของกองเรือฝรั่งเศสสมัยใหมหลังสงคราม เรือเร็วและติดอาวุธดีสําหรับยุคสมัย แตอาวุธตอรปโดนอยกวาเรือแบบเดียวกันของกองทัพเรือชาติอื่น"
 #FRA_destroyer_1b: "Chacal Class"
 #FRA_destroyer_1c: "Aigle & Vauquelin Class"
 FRA_destroyer_2: "ชั้น Le Fantasque"
 FRA_destroyer_2_desc: "เรือพิฆาตชั้น Le Fantasque โดยพื้นฐานคือรุนปรับปรุงของซูเปอรเรือพิฆาตซีรีส 2,400 ตัน (Guépard, Aigle, Vauquelin) ที่สรางภายใตโครงการนาวีป 1930 เปนเรือพิฆาตขนาดใหญ อาวุธหนัก และเร็วมาก เหมาะอยางยิ่งสําหรับคุมกันหนวยความเร็วสูงรุนใหมของกองเรือฝรั่งเศส อาวุธประกอบดวยปนที่พัฒนาขึ้นใหม อาวุธตอสูอากาศยานที่เพียงพอ และอาวุธตอรปโด"
 #FRA_destroyer_2b: "Le Hardi Class"
 #FRA_destroyer_2c: "Mogador Class"
 FRA_destroyer_3: "ชั้น L'Intrépide"
 FRA_destroyer_3_desc: "เรือพิฆาตชั้น L'Intrépide เปนรุนดัดแปลงของเรือพิฆาตชั้น Le Hardi รุนกอน ไดรับอนุมัติในโครงการนาวีป 1938 และ 1939 แตสงครามและการลมสลายของฝรั่งเศสทําใหตองยกเลิก เรือเหลานี้จะเนนบทบาทตอตานอากาศยานมากขึ้น ระวางขับนํ้าเพิ่มเปน 2,800-2,900 ตัน และมีเครื่องยนตใหญขึ้น"
 FRA_destroyer_4: "ชั้น Hoche"
 FRA_destroyer_4_desc: "ชั้น Hoche และ Bayard เปนแบบซูเปอรเรือพิฆาตสุดทายของกองทัพเรือฝรั่งเศส ทั้งสองชั้นพัฒนาจากชั้น Mogador ระวางขับนํ้า 4,200 ตัน มีอาวุธหลักใกลเคียงกันแตปนตอสูอากาศยานดีขึ้นและเครื่องยนตแรงขึ้น ไดรับอนุมัติในโครงการนาวีป 1939-40 แตการเริ่มตนของสงครามและการลมสลายของฝรั่งเศสทําใหตองยกเลิก"
 FRA_light_cruiser_1: "ชั้น Duguay-Trouin"
 FRA_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น Duguay-Trouin เปนเรือรบสําคัญลําแรกของฝรั่งเศสที่สรางหลังสงครามโลกครั้งที่ 1 ในโครงการนาวีป 1922 และเปนเรือลาดตระเวนเบาลําแรกที่มีปอมปนหลักแบบปดที่ยิงขามกันได ในบรรดาเรือลาดตระเวนเบา เรือชั้นนี้มีอาวุธตอรปโดที่แข็งแกรง แตแทบไมมีเกราะเลย"
 FRA_light_cruiser_2: "ชั้น La Galissonnière"
 FRA_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้น La Galissonnière เปนคําตอบตอเรือลาดตระเวนเบาแบบ Condottieri ของอิตาลี และพัฒนาจากชั้น Emile Bertin รุนกอน สรางในโครงการนาวีป 1931 และ 1932 มีอาวุธหลักตามแบบฉบับและอาวุธตอสูอากาศยานที่เพียงพอสําหรับยุคนั้น ระวางขับนํ้า 10,850 ตัน มีเครื่องบินตรวจการณมากขึ้น และมีความเร็วดี"
 FRA_light_cruiser_3: "ชั้น De Grasse"
 FRA_light_cruiser_3_desc: "เรือลาดตระเวนชั้น DeGrasse ไดรับอนุมัติในโครงการนาวีป 1938 และ 1939 และโดยพื้นฐานคือ La Galissonnière รุนปรับปรุง มีอาวุธตอสูอากาศยานแข็งแกรงขึ้นและเครื่องยนตใหญขึ้น การลมสลายของฝรั่งเศสทําใหสองลําสุดทายถูกยกเลิก และเรือลํานําถูกสรางเสร็จหลังสงครามดวยแบบที่ตางออกไป ฝายเยอรมันตั้งใจจะสรางเรือลํานี้ใหเสร็จเปนเรือบรรทุกเครื่องบินเบา แตโครงการนี้ก็ไมไดดําเนินการเชนกัน"
 FRA_light_cruiser_4: "ชั้น Colbert"
 FRA_light_cruiser_4_desc: "Colbert เปนเรือลาดตระเวนเบาตอตานอากาศยานที่ปลอยลงนํ้าในป 1956 เรือลาดตระเวนชั้น Colbert ลํานี้สรางในแบบที่คลายคลึงกับ De Grasse หลังสงครามมาก โดยมีอาวุธตอสูอากาศยานหนักทั้งระยะไกลและระยะใกล ความแตกตางระหวาง Colbert กับ DeGrasse คือ Colbert มีเครื่องยนตเล็กกวา เกราะบางกวา และมีขนาดเล็กกวาเล็กนอย"
 FRA_heavy_cruiser_1: "ชั้น Suffren"
 FRA_heavy_cruiser_1_desc: "เรือลาดตระเวนหนักชั้น Suffren โดยพื้นฐานคือการสรางซํ้าชั้น Duquesne รุนกอนพรอมปรับปรุงความสามารถในการเดินทะเลเล็กนอย ทั้งสองชั้นสะทอนแนวคิดเรือลาดตระเวนรวมสมัยของกองทัพเรือฝรั่งเศส คือเกราะบางมากแตความเร็วและพิสัยดี ระวางขับนํ้ามาตรฐาน 10,000 ตัน และติดอาวุธตามมาตรฐานของเรือลาดตระเวนหนัก"
 FRA_heavy_cruiser_2: "ชั้น Algérie"
 FRA_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้น Algérie เปนการปรับปรุงตอยอดจากชั้น Suffren และ Duquesne รุนกอน แตออกแบบมาเพื่อเปนคูปรับของเรือลาดตระเวนหนักชั้น Zara รุนใหมของอิตาลี ทั้งสายเกราะหลักและการปองกันใตนํ้าเพิ่มขึ้นอยางมาก อาวุธตอสูอากาศยานเพียงพอสําหรับยุคนั้น แตดวยการเปลี่ยนแปลงเหลานี้ ระวางขับนํ้ามาตรฐานจึงเกิน 10,000 ตัน"
 FRA_heavy_cruiser_3: "ชั้น Saint Louis"
 FRA_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้น Saint Louis พัฒนาจากชั้น Algérie แตรูปลักษณโดยรวมใกลเคียงกับเรือหลักชั้น Dunkerque และ Richelieu มากกวา มีการสั่งตอสามลําในโครงการนาวีป 1940 แตเนื่องจากการลมสลายของฝรั่งเศส จึงไมมีลําใดไดวางกระดูกงู เรือจะติดปนแบบใหมและอาวุธตอสูอากาศยานที่ปรับปรุงแลว แตเกราะจะเหมือนกับชั้น Algérie นี่คือแบบเรือลาดตระเวนหนักแบบสุดทายของกองทัพเรือฝรั่งเศส"
 FRA_heavy_cruiser_4: "ชั้น Forbin"
 FRA_heavy_cruiser_4_desc: "เรือลาดตระเวนหนักชั้น Forbin เปนแบบเรือสมมุติที่สืบตอจากชั้น Saint Louis ออกแบบมาเพื่อปกปองเสนทางการคาระหวางฝรั่งเศสแผนดินใหญกับอาณานิคม มีพิสัยไกลและความเร็วดี พรอมอาวุธหนักเปนปนในปอมสามลํากลองสี่ปอม และอาวุธตอสูอากาศยานในจํานวนที่เพียงพอ การจัดวางและรูปลักษณโดยรวมของเรือไดรับอิทธิพลจากชั้น Saint Louis รุนกอน รวมถึงชั้น Crown Colony ของอังกฤษ"
 FRA_battle_cruiser_1: "แบบ Durand-Viel"
 FRA_battle_cruiser_1_desc: "แบบเรือลาดตระเวนประจัญบาน Durand-Viel เปนขอเสนอหนึ่งในชุดการศึกษาที่ยอนไปถึงสงครามโลกครั้งที่ 1 โดยพื้นฐานคือเรือลาดตระเวนประจัญบานรุนของเรือประจัญบานชั้น Normandie และ Lyon ซึ่งมีปอมปนสี่ลํากลองและปนแบบเดียวกันแตจํานวนนอยกวา เชนเดียวกับเรือลาดตระเวนประจัญบานรวมสมัยของกองทัพเรือชาติอื่น เรือเหลานี้จะเร็วกวาแตมีเกราะนอยกวาเรือประจัญบาน และถูกยกเลิกกอนสงครามโลกครั้งที่ 1 จะปะทุ"
 FRA_battle_cruiser_2: "ชั้น Dunkerque"
 FRA_battle_cruiser_2_desc: "เรือชั้น Dunkerque ออกแบบมาเพื่อรับมือเรือประจัญบานกระเปาชั้น Deutschland ของเยอรมนี และเปนจุดสูงสุดของชุดการศึกษาแบบเรือตั้งแตกลางทศวรรษ 1920 ถึงตนทศวรรษ 1930 ไดรับอนุมัติในโครงการนาวีป 1931 และ 1934 มีลักษณะคลายเรือประจัญบานชั้น Nelson ของอังกฤษ โดยรวมปอมปนหลักทั้งหมดไวดานหนา ทําใหสายเกราะสั้นลงและเรือมีขนาดเล็กลงเพื่อใหอยูในขอจํากัดของสนธิสัญญานาวี"
 FRA_battleship_1: "ชั้น Courbet"
 FRA_battleship_1_desc: "เรือประจัญบานชั้น Courbet เปนเรือซูเปอรเดรดนอตรุนแรกที่สรางใหกองทัพเรือฝรั่งเศสกอนและระหวางสงครามโลกครั้งที่ 1 ไดรับอนุมัติในโครงการนาวีป 1910 และ 1911 มีบทบาทจํากัดในสงครามโลกครั้งที่ 1 แตยังประจําการในสงครามโลกครั้งที่ 2 แมจะมีเกราะหนาและปนแรงกวาเรือประจัญบานชั้น Dante รุนกอน แตก็ยังดอยกวาเรือประจัญบานรวมสมัยของกองทัพเรือสหรัฐฯ และราชนาวีอังกฤษ ระวางขับนํ้าเกิน 22,000 ตันเล็กนอย และการปรับปรุงเพียงอยางเดียวกอนสงครามโลกครั้งที่ 2 คืออาวุธตอสูอากาศยานและหมอนํ้าที่ดีขึ้น"
 #FRA_battleship_1b: "Bretagne Class" 
 FRA_battleship_2: "ชั้น Richelieu"
 FRA_battleship_2_desc: "เรือประจัญบานชั้น Richelieu เปนเรือประจัญบานชุดสุดทายที่เขาประจําการในกองทัพเรือฝรั่งเศส เปนแบบที่ปรับปรุงจาก Dunkerque และไดรับอนุมัติภายใตโครงการนาวีป 1935 และ 1938 มีอาวุธตอสูอากาศยาน ความเร็ว และพิสัยยอดเยี่ยม ทําใหเปนเรือหลักชั้นเยี่ยม จากที่สั่งตอสี่ลํา มีเพียงสองลําที่ปลอยลงนํ้า และหนึ่งลําที่สรางเสร็จกอนการลมสลายของฝรั่งเศส มีความพยายามหลายครั้งที่จะสรางเรือที่เหลือใหเสร็จดวยแบบที่ตางออกไป ทั้งเรือประจัญบานตอตานอากาศยาน เรือลูกผสมประจัญบาน-บรรทุกเครื่องบิน หรือเรือบรรทุกเครื่องบินเต็มรูปแบบ"
 FRA_battleship_3: "ชั้น Gascogne"
 FRA_battleship_3_desc: "เรือประจัญบานชั้น Gascogne เปนชั้นยอยของชั้น Richelieu มีการสั่งตอสามลําในโครงการนาวีป 1940 แตไมมีลําใดเริ่มสราง แบบเรือจะเปนการสรางซํ้า Richelieu แตกระจายอาวุธหลักไวหัวและทายเรืออยางเทากัน ปรับปรุงอาวุธตอสูอากาศยาน และปรับปรุงเครื่องยนต ทําใหโดยรวมเปนเรือที่ดีกวา"
 FRA_battleship_4: "ชั้น Alsace"
 FRA_battleship_4_desc: "เรือประจัญบานชั้น Alsace วางแผนไวเพื่อสืบตอจากชั้น Richelieu มีการสั่งตอสี่ลํา การศึกษาแบบเสร็จในป 1939 ไดรับอนุมัติในป 1940 และคาดวาจะวางกระดูกงูในป 1941 แตการลมสลายของฝรั่งเศสทําใหไมเกิดขึ้น แบบเรือนี้ปรับปรุงจาก Richelieu ดวยปนหลักที่หนักกวาและมากกวา อาวุธตอสูอากาศยานแข็งแกรงขึ้น แผนเกราะหนาขึ้น และเครื่องยนตใหญขึ้น"
 FRA_SH_battleship_1: "ชั้น Charlemagne"
 FRA_SH_battleship_1_desc: "ซูเปอรเรือประจัญบานชั้น Charlemagne เปนแบบสมมุติเพื่อทัดเทียมเรือประจัญบานขนาดใหญของกองทัพเรือชาติอื่น มีอาวุธหนักทั้งหมดอยูดานหนาในตําแหนงยิงขามกัน อาวุธตอสูอากาศยานหนัก และเกราะหนา แบบเรือทั้งหมดยืมองคประกอบจากชั้น Richelieu และชั้น Nelson ของอังกฤษ"
 FRA_SH_battleship_2: "ชั้น Napoléon Bonaparte"
 FRA_SH_battleship_2_desc: "เรือประจัญบานชั้น Napoléon Bonaparte เปนแบบสมมุติที่พัฒนาจากชั้น Alsace และ Gascogne อาวุธหนักกระจายไวหัวและทายเรืออยางเทากันในปอมสามลํากลอง พรอมปนรองที่ยิงขามกันไดและอาวุธตอสูอากาศยานหนัก เกราะหนาและเครื่องยนตทรงพลังใหความเร็วและการปองกันที่จําเปนตอการรวมปฏิบัติการกับเรือลําอื่นในกองเรือและตอกรกับขาศึกไดอยางมีประสิทธิภาพ"
 FRA_carrier_1: "ชั้น Béarn"
 FRA_carrier_1_desc: "Béarn เดิมวางกระดูกงูเปนเรือประจัญบานชั้น Normandie แตภายหลังสรางเสร็จเปนเรือบรรทุกเครื่องบิน ระวางขับนํ้า 22,100 ตัน และประจําการในชวงระหวางสงครามและสงครามโลกครั้งที่ 2 ในฐานะเรือบรรทุกเครื่องบินดัดแปลง เรือมีความเร็วตํ่าและพื้นที่สําหรับเครื่องบินจํากัด แตสายเกราะขนาดกลางและพิสัยไกลชวยชดเชยจุดดอยเหลานี้ การสรางเรือลํานี้มอบประสบการณสําคัญแกนักออกแบบฝรั่งเศสใน DCAN (Direction des Constructions et Armes Navale) และนําไปสูชุดการศึกษาแบบเรือในเวลาตอมา"
 FRA_carrier_2: "ชั้น Joffre"
 FRA_carrier_2_desc: "เรือบรรทุกเครื่องบินชั้น Joffre (ชื่อโครงการ PA-16) เปนเรือบรรทุกเครื่องบินรุนถัดไปของกองทัพเรือฝรั่งเศส และเปนผลสุดทายของชุดการศึกษาแบบที่เริ่มในป 1929 และจบในป 1937 ไดรับอนุมัติสองลําในโครงการนาวีป 1938 แตความขัดแยงที่ทวีความรุนแรงทําใหการกอสรางลาชา และในที่สุดการลมสลายของฝรั่งเศสทําใหเรือเหลานี้สรางไมเสร็จ ระวางขับนํ้าจะอยูที่ราว 20,000 ตัน มีอาวุธตอสูอากาศยาน เกราะ และความเร็วที่ดี แตจํานวนเครื่องบินตํ่ากวาเกณฑเฉลี่ย โดยรวมแลวจะเปนเรือบรรทุกเครื่องบินที่สมดุลและอเนกประสงคสําหรับกองทัพเรือฝรั่งเศส"
 FRA_carrier_3: "ชั้น Jean Bart"
 FRA_carrier_3_desc: "เรือบรรทุกเครื่องบิน Jean Bart เปนขอเสนอในชวงกลางสงครามที่จะดัดแปลงเรือประจัญบาน Jean Bart ชั้น Richelieu ที่ยังสรางไมเสร็จใหเปนเรือบรรทุกเครื่องบินเต็มรูปแบบ ในลักษณะเดียวกับ IJN Shinano ของญี่ปุน ตัวเรือขนาดใหญจะทําใหบรรทุกเครื่องบินไดมาก และเมื่อรวมกับเครื่องยนตขนาดใหญ จะเปนเรือบรรทุกเครื่องบินที่เร็วและพิสัยไกล อาวุธตอสูอากาศยานหนักจากสหรัฐอเมริกาจะชวยปองกันอากาศยานและเรือรบผิวนํ้าขนาดเล็กไดดี"
 FRA_carrier_4: "ชั้น Clemenceau"
 FRA_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้น Clemenceau (ชื่อโครงการ PA-28) เปนแบบเรือบรรทุกเครื่องบินแบบแรกหลังสงครามของกองทัพเรือฝรั่งเศส แบบเรือจะคลายเรือบรรทุกเครื่องบินชั้น Joffre ที่สรางไมเสร็จ แตอุปกรณและอาวุธที่ติดตั้งจะเปนผลิตภัณฑสมัยใหมของฝรั่งเศส การไดรับเรือบรรทุกเครื่องบินคุมกันจากกองทัพเรือสหรัฐฯ และราชนาวีอังกฤษ ประกอบกับสภาพเศรษฐกิจของฝรั่งเศสหลังสงคราม ทําใหเรือเหลานี้ไมไดวางกระดูกงู อยาสับสนกับเรือบรรทุกเครื่องบินชั้น Clemenceau รุนหลัง (ชื่อโครงการ PA-54) ซึ่งวางกระดูกงูในป 1955 และ 1957"
 ### GER - GERMANY ###
 GER_submarine_1: "แบบ UB III"
 GER_submarine_1_desc: "เรือดํานํ้าชายฝงแบบ UB III เปนยูโบทชั้นหนึ่งที่สรางขึ้นระหวางสงครามโลกครั้งที่ 1 โดยกองทัพเรือจักรวรรดิเยอรมัน บรรทุกตอรปโดสิบลูกและมีระวางขับนํ้าเกิน 500 ตัน ระหวางป 1916 ถึง 1918 สรางขึ้น 96 ลํา แตทั้งหมดปลดประจําการภายในป 1935"
 GER_submarine_2: "แบบ IIA"
 GER_submarine_2_desc: "เรือดํานํ้าแบบ IIA ของเยอรมนีเปนเรือดํานํ้าชายฝงตัวเรือชั้นเดียว เชื่อมทั้งลํา พรอมถังอับเฉาภายใน ระวางขับนํ้าเกิน 250 ตัน และติดทอตอรปโด 533 มม. หาทอ สรางขึ้นหกลําระหวางป 1934 ถึง 1935"
 #GER_submarine_2b: "Type VIIA"
 GER_submarine_3: "แบบ VIIC"
 GER_submarine_3_desc: "เรือดํานํ้าเดินทะเลแบบ VIIC เปนกําลังหลักของกองเรือยูโบทเยอรมัน โดยเขาประจําการ 568 ลําระหวางป 1940 ถึง 1945 เรือมีระวางขับนํ้า 770 ตัน และติดทอตอรปโด 533 มม. หาทอ"
 #GER_submarine_3b: "Type IXC"
 GER_submarine_4: "แบบ XXI"
 GER_submarine_4_desc: "เรือดํานํ้าแบบ XXI หรือที่รูจักกันในชื่อ 'Elektroboote' เปนเรือดํานํ้ารุนแรกที่ออกแบบมาใหปฏิบัติการใตนํ้าเปนหลัก แทนที่จะเปนเรือผิวนํ้าที่ดําลงไดเพื่อหลบการตรวจจับหรือเขาโจมตี จุดเดนสําคัญคือตัวเรือและหอบังคับการที่เพรียวลม และเซลลแบตเตอรี่จํานวนมาก เปนเรือดํานํ้าชั้นที่ใหญที่สุดชั้นหนึ่งของเยอรมนี ระวางขับนํ้าเกิน 1,620 ตัน มีเรือเขาประจําการ 118 ลําระหวางป 1943 ถึง 1945"
 GER_destroyer_1: "แบบ 23"
 GER_destroyer_1_desc: "แบบ 23 เปนเรือตอรปโดชั้นหนึ่งที่สรางใหครีกสมารีเนอหลังสงครามโลกครั้งที่ 1 สรางขึ้นหกลําระหวางป 1926 ถึง 1928 และทั้งหมดประจําการในสงครามโลกครั้งที่ 2 แมจะจัดเปนเรือตอรปโด แตเรือมีขนาดเทาเรือพิฆาต ระวางขับนํ้าเกิน 920 ตัน และติดปน 105 มม. L/45 สามกระบอก"
 GER_destroyer_2: "Zerstörer 1934"
 GER_destroyer_2_desc: "ชั้น Zerstörer 1934 เปนเรือพิฆาตชั้นแรกของเยอรมนีที่สรางขึ้นนับตั้งแตสงครามโลกครั้งที่ 1 ติดปน 5" หากระบอกและทอตอรปโดแปดทอ สรางขึ้น 16 ลํา ในจํานวนนี้ 12 ลําเปนชั้นยอย Zerstörer 1934A ที่ปรับปรุงแลว"
 GER_destroyer_3: "ชั้น Narvik"
 GER_destroyer_3_desc: "Zerstörer 1936A ซึ่งฝายสัมพันธมิตรรูจักในชื่อเรือพิฆาตชั้น Narvik ออกแบบมาเพื่อติดปน 150 มม. (5.9") แบบใหม ออกแบบใหมีปนเดี่ยวสามกระบอกที่ทายเรือและปนแฝดที่หัวเรือ แตเดิมติดตั้งปนเดี่ยวที่หัวเรือ เรือสี่ในแปดลําของชั้นนี้ไดรับการปรับปรุงติดปอมปนแฝดในภายหลัง เรือพิฆาตกลุมที่สองเจ็ดลําสรางตามแบบที่ดัดแปลงเล็กนอยโดยมีปนแฝดที่หัวเรือ"
 GER_destroyer_4: "Zerstörer 1944"
 GER_destroyer_4_desc: "แมเรือพิฆาตตนแบบลําแรกที่ใชเครื่องยนตดีเซล (Zerstörer 1942) จะสรางไมเสร็จ แตการพัฒนาเรือประเภทนี้ยังดําเนินตอไป มีขอเสนอหลายแบบซึ่งนําไปสูโครงการ Zerstörer 1944 ในที่สุด นอกจากอาวุธหลักที่หนักแลว เรือยังมีปนตอสูอากาศยานเพิ่มขึ้นเมื่อเทียบกับรุนกอน รวมถึงปนตอสูอากาศยาน 5,5 ซม. แบบใหม"
 GER_light_cruiser_1: "ชั้น Emden"
 GER_light_cruiser_1_desc: "Emden เปนเรือรบขนาดใหญลําแรกที่สรางในเยอรมนีหลังสงครามโลกครั้งที่ 1 วางกระดูกงูในป 1921 และเขาประจําการในป 1925 อาวุธประกอบดวยปน 150 มม. (5.9") แปดกระบอกในปอมเดี่ยว"
 #GER_light_cruiser_1b: "Königsberg Class"
 GER_light_cruiser_2: "ชั้น Leipzig"
 GER_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้น Leipzig สรางขึ้นระหวางป 1928 ถึง 1935 เปนรุนปรับปรุงจากเรือลาดตระเวนชั้น Königsberg รุนกอน ระวางขับนํ้าเกิน 8,100 ตัน มีความเร็วและพิสัยเพียงพอ และติดปน 15 ซม. SK C/25 เกากระบอกเปนอาวุธหลัก"
 GER_light_cruiser_3: "ชั้น M"
 GER_light_cruiser_3_desc: "เรือลาดตระเวนชั้น M ออกแบบมาเปนเรือสอดแนมใหกองเรือจูโจมการคา มีการสั่งตอหกลําเปนสวนหนึ่งของแผน Z โดยวางกระดูกงูแลวสองลํากอนงานจะหยุดลงเมื่อสงครามปะทุ อาวุธหลักจะเปนปน 150 มม. แปดกระบอกในปอมแฝดสี่ปอม"
 GER_light_cruiser_4: "ชั้น Q"
 GER_light_cruiser_4_desc: "เรือลาดตระเวนชั้น Q เปนแบบดัดแปลงจากชั้น M ออกแบบใหใหญกวาชั้น M พรอมอาวุธตอสูอากาศยานที่หนักกวาและระบบควบคุมการยิงที่ดีขึ้น"
 GER_heavy_cruiser_1: "ชั้น Blücher"
 GER_heavy_cruiser_1_desc: "Blücher เปนเรือลาดตระเวนหุมเกราะลําสุดทายที่เยอรมนีสราง แบบเรือลํ้าสมัยสําหรับยุคนั้นและปูทางใหเรือลาดตระเวนประจัญบานชั้น Von der Tann ในเวลาตอมา เมื่อถึงสงครามโลกครั้งที่ 1 เรือก็ลาสมัยไปแลว Blücher ถูกจมในยุทธนาวีด็อกเกอรแบงกป 1915"
 GER_heavy_cruiser_2: "ชั้น Hipper"
 GER_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้น Admiral Hipper เปนเรือลาดตระเวนหนักรุนแรกของครีกสมารีเนอ อยางเปนทางการมีระวางขับนํ้า 10,000 ตัน แตในความเปนจริงเกิน 16000 ตัน ติดปน 8" แปดกระบอกในปอมแฝดสี่ปอม และปนรองขนาด 105 มม. สิบสองกระบอก"
 GER_heavy_cruiser_3: "ชั้น Prinz Eugen"
 GER_heavy_cruiser_3_desc: "อยางเปนทางการเปนสวนหนึ่งของชั้น Hipper ชั้นยอย Prinz Eugen มีการปรับปรุงหลายอยาง รวมถึงอาวุธตอสูอากาศยานที่หนักขึ้น จากเรือสามลําในชั้นยอยนี้ มีเพียง Prinz Eugen ที่สรางเสร็จ เรือมีสวนรวมในการจม HMS Hood ระหวางปฏิบัติการไรนอืบุง หลังสงคราม เรือถูกโอนใหสหรัฐอเมริกาและประจําการในชื่อ USS Prinz Eugen ในการทดสอบระเบิดปรมาณู Able และ Baker กอนจะจมลงที่อะทอลลควาจาลีนในป 1946"
 GER_heavy_cruiser_4: "เรือลาดตระเวนชั้น P"
 GER_heavy_cruiser_4_desc: "ชั้น P เปนแบบเรือลาดตระเวนหนักขนาดใหญ ที่ครีกสมารีเนอกําหนดอยางเปนทางการวา Panzerschiff (เรือหุมเกราะ) ดวยระวางขับนํ้าเกือบ 24,000 ตัน เรือจะเบากวา 3,000 ตันแตยาวกวา 55 เมตร เมื่อเทียบกับเรือประจัญบานชั้น New York ของสหรัฐฯ อาวุธประกอบดวยปน 280 มม. หกกระบอกในปอมสามลํากลองสองปอม"
 GER_battle_cruiser_1: "ชั้น Yorck"
 GER_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้น Yorck ทั้งสามลําออกแบบมาเพื่อตอบโตชั้น Renown ของอังกฤษ จะติดปน 380 มม. แปดกระบอกในปอมแฝดสี่ปอม ทั้งสามลําวางกระดูกงูในป 1916 แตไมมีลําใดสรางเสร็จเนื่องจากสงคราม"
 GER_battle_cruiser_2: "ชั้น O"
 GER_battle_cruiser_2_desc: "ในป 1939 ครีกสมารีเนอตัดสินใจแทนที่เรือลาดตระเวนชั้น P ที่วางแผนไวสามลําดวยเรือลาดตระเวนประจัญบาน ผลที่ไดคือเรือลาดตระเวนประจัญบานชั้น O ติดปน 38 ซม. (15") หกกระบอกในปอมแฝดสามปอม เรือออกแบบใหมีระวางขับนํ้า 35,400 ตันและความเร็วสูงสุด 35 นอต มีคําสั่งสรางเรือทั้งสามลําของชั้นนี้ แตไมมีลําใดเริ่มสราง"
 GER_battleship_1: "ชั้น Deutschland"
 GER_battleship_1_desc: "ตามสนธิสัญญาแวรซาย เยอรมนีไดรับอนุญาตใหคงเรือประจัญบานกอนยุคเดรดนอตไวหกลํา ครีกสมารีเนอจัดประเภทเปน Linienschiffe (เรือแนวรบ) มีเพียงสองลําของชั้น Deutschland ซึ่งไมควรสับสนกับเรือประจัญบานกระเปาชั้น Deutschland รุนหลัง ที่ยังประจําการตลอดทศวรรษ 1930 เวลา 04:47 น. ของวันที่ 1 กันยายน 1939 Schleswig-Holstein ยิงกระสุนนัดแรกของสงครามโลกครั้งที่ 2 เมื่อเปดฉากยิงใสฐานเวสเตอรพลัตเตอในดานซิก โปแลนด"
 GER_battleship_2: "ชั้น Scharnhorst"
 GER_battleship_2_desc: "เรือประจัญบานชั้น Scharnhorst เปนเรือประจัญบานสมัยใหมรุนแรกที่สรางใหครีกสมารีเนอ สรางขึ้นเพื่อตอบโตเรือลาดตระเวนประจัญบานชั้น Dunkerque ของฝรั่งเศส ซึ่งเองก็เปนการตอบโต Panzerschiffe (เรือประจัญบานกระเปา) ชั้น Deutschland ของเยอรมนี ชั้น Scharnhorst ติดปน 283 มม. (11") เกากระบอกในปอมสามลํากลองสามปอม มีแผนจะเพิ่มขนาดปนเปนปนแฝด 380 มม. (15") แตเมื่อสงครามปะทุ สิ่งนี้ก็ไมเคยเกิดขึ้น"
 GER_battleship_3: "ชั้น Bismarck"
 GER_battleship_3_desc: "เรือประจัญบานชั้น Bismarck สองลําเปนเรือรบที่ใหญที่สุดที่สรางใหครีกสมารีเนอ ออกแบบมาเพื่อตอบโตเรือประจัญบานใหมของฝรั่งเศสที่กําลังสราง โดยมีอาวุธใกลเคียงกันคือปน 38 ซม. (15") แปดกระบอกเหมือนชั้น Richelieu แตใชปอมแฝดสี่ปอมแทนปอมสี่ลํากลองสองปอมของ Richelieu เรือ Bismarck มีชื่อเสียงจากการจมเรือลาดตระเวนประจัญบาน HMS Hood ของอังกฤษในยุทธนาวีชองแคบเดนมารก แตตอมาถูกไลลาและจมกอนจะถึงทา"
 GER_battleship_4: "ชั้น Hindenburg"
 GER_battleship_4_desc: "แผน Z ของเยอรมนีวาดภาพกองกําลังเรือประจัญบานสิบลําเพื่อทาทายแสนยานุภาพทางทะเลของสหราชอาณาจักร ชั้น H คือชุดแบบเรือสําหรับเรือประจัญบานหกลําที่จําเปนตอการบรรลุเปาหมายของแผน เรือสองลําตามแบบ H39 วางกระดูกงูเมื่อสงครามโลกครั้งที่ 2 ปะทุ แตการกอสรางถูกระงับเมื่อสงครามเริ่มขึ้น ไมมีลําใดไดรับชื่ออยางเปนทางการ แตมีการคาดกันวา Hindenburg อาจเปนชื่อของเรือลํานําของชั้น หากสรางเสร็จ เรือเหลานี้จะเปนเรือชั้น Bismarck ที่ขยายขนาด พรอมปนหลัก 40.6 ซม. (16") แปดกระบอก"
 GER_carrier_1: "Flugzeugdampfer I"
 GER_carrier_1_desc: "โครงการ Flugzeugdampfer I (เรือกลไฟบรรทุกเครื่องบิน I) ออกแบบในป 1915 เปนการดัดแปลงเรือโดยสาร Ausonia ที่ยังสรางไมเสร็จใหเปนเรือบรรทุกเครื่องบิน การกอสรางถูกยกเลิกเมื่อสงครามโลกครั้งที่ 1 สิ้นสุด หากสรางเสร็จ เรือจะบรรทุกทั้งเครื่องบินทะเลและเครื่องบินลอในโรงเก็บสามแหง และมีระวางขับนํ้า 12,500 ตัน"
 GER_carrier_2: "ชั้น Seydlitz"
 GER_carrier_2_desc: "Seydlitz วางกระดูกงูเปนเรือลําที่สี่ของเรือลาดตระเวนหนักชั้น Admiral Hipper เมื่อสงครามเริ่ม เรือสรางเสร็จไปบางสวนและถูกพิจารณาใหดัดแปลงเปนเรือบรรทุกเครื่องบิน โครงการซึ่งมีรหัสวา Weser 1 ดําเนินไปไดบางสวนกอนงานจะหยุดลง เนื่องจากการโจมตีทางอากาศตอเบรเมินที่เพิ่มขึ้นและการขาดแคลนทรัพยากรสําหรับการกอสราง"
 GER_carrier_3: "ชั้น Graf Zeppelin"
 GER_carrier_3_desc: "Graf Zeppelin เปนเรือชั้นเดียวในครีกสมารีเนอที่ออกแบบเปนเรือบรรทุกเครื่องบินตั้งแตกระดูกงู มีการสั่งตอสองลํา แตไมมีลําใดสรางเสร็จ ตามแบบ Graf Zeppelin จะบรรทุกเครื่องบินขับไล Bf-109T 30 ลํา และเครื่องบินทิ้งระเบิดดิ่ง Ju-87E 12 ลํา ซึ่งเปนรุนประจําเรือของ Bf-109E และ Ju-87D"
 GER_carrier_4: "ชั้น Europa"
 GER_carrier_4_desc: "ครีกสมารีเนอพิจารณาดัดแปลงเรือพลเรือนหลายลําเปนเรือบรรทุกเครื่องบินในทศวรรษ 1940 ลําที่ใหญที่สุดคือเรือโดยสาร Europa ในฐานะเรือโดยสารที่ใหญที่สุดของเยอรมนี เรือถูกใชเปนเรือที่พักทหารและเรือลําเลียงพลกอนจะเริ่มงานดัดแปลงเปนเรือบรรทุกเครื่องบิน หากสรางเสร็จ เรือจะมีระวางขับนํ้า 56,000 ตันและบรรทุกกองบินได 42 ลํา"
 GER_SH_battleship_1: "Schlachtschiff H41"
 GER_SH_battleship_1_desc: "แบบเรือประจัญบาน H41 เปนการปรับปรุงจากแบบ H39 รุนกอน แบบเรือกําหนดใหมีเกราะแข็งแกรงขึ้นอยางมาก ผนังกั้นตอรปโดที่เสริมความแข็งแรง และการปองกันหางเสือและเพลาใบจักร ปนหลักถูกยกระดับเปนปน 42 ซม. แปดกระบอก ใหญกวาเรือประจัญบานชั้น Lion ที่สหราชอาณาจักรเสนอ ตามแบบ เรือเหลานี้จะมีระวางขับนํ้าเกือบ 70,000 ตัน"
 GER_SH_battleship_2: "Schlachtschiff H44"
 GER_SH_battleship_2_desc: "ชั้น H44 เปนแบบสุดทายของชุดแบบเรือประจัญบาน H เมื่อไมมีขอจํากัดดานขนาดลํากลองหรือระวางขับนํ้า แบบ H42 ถึง H44 จึงติดอาวุธและเกราะที่หนักขึ้นเรื่อยๆ จนถึงจุดสูงสุดที่แบบ H44 ขนาด 131,000 ตัน ติดปน 508 มม. (20") แปดกระบอก"
 ### ITA - ITALY ###
 ITA_submarine_1: "ชั้น Mameli"
 ITA_submarine_1_desc: "ชั้น Geoffredo Mameli เปนเรือดํานํ้าขนาดกลางของเรเจียมารีนาที่ปลอยลงนํ้าระหวางป 1926 ถึง 1928 ระวางขับนํ้าตํ่ากวา 800 ตันเล็กนอย และดําไดลึก 100 ม. เปนพื้นฐานของรุนตอมา เชน ชั้น Pisani, Bandiera และ Squalo"
 #ITA_submarine_1b: "Bandiera Class"
 #ITA_submarine_1c: "Sirena Class"
 ITA_submarine_2: "ชั้น Perla"
 ITA_submarine_2_desc: "เรือดํานํ้าชั้น Perla และชั้น Adua สรางขึ้นในทศวรรษ 1930 เปนชั้นยอยที่สามและสี่ของเรือดํานํ้าซีรีส 600 ที่อิตาลีสราง มีขนาดเล็กกวารุนกอน ระวางขับนํ้าเกิน 600 ตันเล็กนอย"
 #ITA_submarine_2b: "Marcello Class"
 ITA_submarine_3: "ชั้น Marconi"
 ITA_submarine_3_desc: "ชั้น Marconi เปนเรือดํานํ้าหกลําที่สรางระหวางป 1939 ถึง 1940 สืบตอจากเรือดํานํ้า Luizzi รุนกอน เรือดํานํ้าทั้งสองชั้นมีระวางขับนํ้าราว 1,000 ตัน และมีทอตอรปโด 533 มม. แปดทอ เมื่อรวมทั้งสองชั้นแลว มีเพียงลําเดียวที่รอดพนสงคราม"
 #ITA_submarine_3b: "Plantino Class"
 ITA_submarine_4: "ชั้น Pietro Calvi"
 ITA_submarine_4_desc: "ชั้นยอย Pietro Calvi มีการปรับปรุงเพียงเล็กนอยจากชั้น Flutto รุนกอน ซึ่งเปนเรือดํานํ้าขนาดกลาง ปลอยลงนํ้าไดเพียงไมกี่ลํา เนื่องจากตัวเรือสวนใหญถูกเยอรมนียึดหลังการสงบศึกของอิตาลี Pietro Calvi รุนที่ออกแบบใหมเขาประจําการในที่สุดเมื่อป 1961"
 ITA_destroyer_1: "ชั้น Curtatone"
 ITA_destroyer_1_desc: "เรือพิฆาตชั้น Curtatone เปนเรือพิฆาตรุนแรกที่สรางในอิตาลีหลังสงครามโลกครั้งที่ 1 สิ้นสุด และเปนเรือพิฆาตรุนแรกที่ใชแทนปนแฝด เดิมสั่งตอพรอมกับเรือพิฆาตชั้น Palestro แตถูกเลื่อนออกไปเพราะขาดแคลนเหล็กกลา ระวางขับนํ้าตํ่ากวา 1,000 ตันเล็กนอย และติดปน Schneider-Armstrong 102 มม. สี่กระบอก"
 #ITA_destroyer_1b: "Navigatori Class"
 #ITA_destroyer_1c: "Maestrale Class"
 ITA_destroyer_2: "ชั้น Soldati"
 ITA_destroyer_2_desc: "ชั้น Soldati เปนกลุมเรือพิฆาตที่สรางในชวงปลายทศวรรษ 1930 แบงเปนสองชุด ชุดแรกมีสิบสองลําในป 1938-39 ชุดที่สองสรางเสร็จหาลําในป 1941-42 ชุดแรกมีระวางขับนํ้าเกิน 1,800 ตันเล็กนอย และติดปน Ansaldo 120 มม. สี่กระบอก"
 ITA_destroyer_3: "ชั้น Ciclone"
 ITA_destroyer_3_desc: "เรือพิฆาตชั้น Ciclone ถูกจัดเปนเรือตอรปโด แตแทจริงแลวคลายเรือพิฆาตคุมกันมากกวา เปนรุนขยายขนาดเล็กนอยของชั้น Orsa รุนกอน ระวางขับนํ้าเกิน 1,100 ตัน มีเสถียรภาพดีขึ้นและอาวุธตอตานเรือดํานํ้าหนักขึ้น"
 #ITA_destroyer_3b: "Ariete Class"
 ITA_destroyer_4: "ชั้น Medaglie d'Oro"
 ITA_destroyer_4_desc: "ชั้น Comandanti Medaglie d'Oro เปนกลุมเรือพิฆาตที่วางแผนไวสําหรับเรเจียมารีนา แตยังไมไดปลอยลงนํ้าเลยจนถึงการสงบศึกของอิตาลี เรือมีขนาดใหญกวาเรือพิฆาตอิตาลีรุนกอนอยางมาก ระวางขับนํ้าเกือบ 2,100 ตัน ติดปน Ansaldo 135 มม. ที่ใหญกวา และมีเครื่องยนตที่ปรับปรุงแลว"
 ITA_light_cruiser_1: "ชั้น Taranto"
 ITA_light_cruiser_1_desc: "เรือลาดตระเวน Taranto และ Bari เปนเรือลาดตระเวนยุคสงครามโลกครั้งที่ 1 ที่ไดรับจากเยอรมนีเปนคาปฏิกรรมสงคราม ทั้งสองลํามีระวางขับนํ้าระหวาง 4,500 ถึง 5,100 ตัน และติดปน SK/45 150 มม. ของเยอรมัน"
 #ITA_light_cruiser_1b: "Giussano Class"
 #ITA_light_cruiser_1c: "Montecuccoli Class"
 ITA_light_cruiser_2: "Duca degli Abruzzi"
 ITA_light_cruiser_2_desc: "ชั้น Duca degli Abruzzi เปนชั้นยอยที่หาของเรือลาดตระเวนเบาชั้น Condottieri สรางขึ้นกอนสงครามโลกครั้งที่ 2 เพื่อครองความเหนือกวาในทะเลเมดิเตอรเรเนียน เปนเรือลาดตระเวนเบาที่ใหญที่สุดของอิตาลีที่เขาประจําการระหวางสงคราม ระวางขับนํ้าเกิน 9,400 ตัน มีเกราะดีและติดปน Ansaldo 152 มม. สิบกระบอก"
 ITA_light_cruiser_3: "ชั้น Capitani Romani"
 ITA_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้น Capitani Romani โดยพื้นฐานออกแบบมาใหเร็วกวาและมีอํานาจการยิงเหนือกวาเรือพิฆาตขนาดใหญรุนใหมของฝรั่งเศสในชวงปลายทศวรรษ 1930 มีการสั่งตอสิบสองลําในปลายป 1939 แตสรางเสร็จเพียงสามลํากอนการสงบศึกของอิตาลีในป 1943 เรือมีเกราะเบาและระวางขับนํ้าเพียง 3,700 ตัน แตเร็วมาก ติดปน OTO/Ansaldo 135 มม. แปดกระบอก"
 ITA_light_cruiser_4: "ชั้น San Marco"
 ITA_light_cruiser_4_desc: "ชั้น San Marco เปนรุนปรับปรุงของเรือลาดตระเวนเบาชั้น Capitani Romani รุนกอน เนื่องจากการสงบศึกของอิตาลี San Marco และเรือพี่นองที่ออกแบบใหมอยาง San Giorgio จึงไมไดเขาประจําการจนถึงทศวรรษ 1950"
 ITA_heavy_cruiser_1: "ชั้น Trento"
 ITA_heavy_cruiser_1_desc: "ชั้น Trento เปนแบบเรือลาดตระเวนหนักของเรเจียมารีนาจากชวงปลายทศวรรษ 1920 เปนเรือรุนแรกที่ออกแบบมาโดยเฉพาะตามขอจํากัดของสนธิสัญญานาวีวอชิงตัน ซึ่งจํากัดเรือลาดตระเวนไวที่ 10,000 ตันและปน 8 นิ้ว เรือลําสุดทายของชั้นคือ Bolzano เปนแบบที่ปรับปรุงแลวและปลอยลงนํ้าในป 1932"
 #ITA_heavy_cruiser_1b: "Zara Class"
 ITA_heavy_cruiser_2: "ชั้น San Giorgio"
 ITA_heavy_cruiser_2_desc: "ชั้น San Giorgio เปนเรือลาดตระเวนหนักสมมุติในชวงระหวางสงคราม ซึ่งจะปลอยลงนํ้าไมนานกอนสงครามเริ่ม เรือลาดตระเวนเหลานี้จะมีระวางขับนํ้าเกิน 11,000 ตัน และติดปน Ansaldo 203 มม. แปดกระบอก"
 ITA_heavy_cruiser_3: "ชั้น Pisa"
 ITA_heavy_cruiser_3_desc: "ชั้น Pisa เปนเรือลาดตระเวนหนักสมมุติจากชวงกลางสงคราม ระวางขับนํ้าราว 12,000 ตัน และทําหนาที่เปนเรือนําของหนวยลาดตระเวนของตนเอง"
 ITA_heavy_cruiser_4: "ชั้น Garibaldi"
 ITA_heavy_cruiser_4_desc: "ชั้น Garibaldi เปนเรือลาดตระเวนหนักสมมุติในชวงปลายสงคราม ระวางขับนํ้าราว 14,000 ตัน ติดอาวุธดีดวยปน OTO/Ansaldo 203 มม. แปดกระบอก และสามารถตามทันเรือบรรทุกเครื่องบินและเรือหลักอื่นๆ ไดเกือบทั้งหมด"
 ITA_battle_cruiser_1: "ชั้น Caracciolo"
 ITA_battle_cruiser_1_desc: "ชั้น Francesco Caracciolo เปนเรือหลักที่เสนอขึ้นไมนานหลังสงครามโลกครั้งที่ 1 เรือมีระวางขับนํ้าราว 34,000 ตัน เกราะดี และคอนขางเร็วเมื่อเทียบกับขนาดและยุคสมัย ปลอยลงนํ้าเพียงลําเดียว แตถูกยกเลิกในป 1921"
 ITA_battle_cruiser_2: "ชั้น Principe Amedeo"
 ITA_battle_cruiser_2_desc: "ชั้น Principe Amedeo เปนเรือลาดตระเวนประจัญบานสมมุติที่จะปลอยลงนํ้าราวปลายทศวรรษ 1930 เทียบไดกับเรือลาดตระเวนประจัญบาน Dunkerque ของฝรั่งเศส ระวางขับนํ้าราว 30,000 ตัน และติดปน 320 มม. เปนอาวุธหลัก"
 ITA_battleship_1: "ชั้น Conte Di Cavour"
 ITA_battleship_1_desc: "เรือประจัญบานชั้น Conte Di Cavour เขาประจําการระหวางสงครามโลกครั้งที่ 1 ติดปน Armstrong-Vickers 305 มม. ระวางขับนํ้า 23,000 ตัน และมีความเร็วสูงสุดใกลเคียงกับเรือประจัญบานยุคเดรดนอตอื่นๆ ตั้งแตป 1933 เรือสองลําที่เหลือของชั้นนี้ไดรับการปรับปรุงแบบครั้งใหญ ทั้งขนาด อาวุธ และสมรรถนะ เพื่อใหทัดเทียมกับเรือประจัญบาน 'ความเร็วสูง' ที่เริ่มปรากฏในยุคนั้น"
 ITA_battleship_2: "ชั้น Caio Duilio"
 ITA_battleship_2_desc: "เรือประจัญบานชั้น Caio Duilio เดิมเขาประจําการเมื่อเริ่มสงครามโลกครั้งที่ 1 อยางไรก็ตาม ทั้งสองลําไดรับการออกแบบใหมทั้งหมดระหวางป 1937 ถึง 1940 รุนนี้แสดงถึงแบบที่ออกแบบใหม อาวุธถูกยกระดับเปนปน 320 มม. M1934 สิบกระบอก ระวางขับนํ้าเพิ่มเปน 29,000 ตัน และความเร็วเพียงพอที่จะจัดเปนเรือประจัญบาน 'ความเร็วสูง'"
 ITA_battleship_3: "ชั้น Littorio"
 ITA_battleship_3_desc: "ชั้น Littorio หรือที่รูจักในชื่อชั้น Vittorio Veneto เปนเรือประจัญบานที่ทันสมัยที่สุดที่อิตาลีใชในสงครามโลกครั้งที่ 2 ระวางขับนํ้าเกิน 40,000 ตัน และเร็วมากเมื่อเทียบกับขนาด เปนกําลังหลักของกองเรืออิตาลี"
 ITA_battleship_4: "ชั้น Impero"
 ITA_battleship_4_desc: "เรือประจัญบาน Impero เปนเรือประจัญบานสมมุติในชวงปลายสงคราม ระวางขับนํ้าราว 43,000 ตัน ติดปน Ansaldo 381 มม. และมีเกราะดี"
 ITA_carrier_1: "ชั้น Giuseppe Miraglia"
 ITA_carrier_1_desc: "ชั้น Giuseppe Miraglia เปนเรือบรรทุกเครื่องบินสมมุติในชวงตนของยุคระหวางสงคราม เทียบไดกับเรือบรรทุกเครื่องบินชั้น Lexington ของสหรัฐฯ และเรือบรรทุกเครื่องบิน Kaga หรือ Akagi ของญี่ปุน"
 ITA_carrier_2: "ชั้น Falco"
 ITA_carrier_2_desc: "Falco เปนเรือบรรทุกเครื่องบินสมมุติของอิตาลีในชวงระหวางสงคราม เทียบไดกับเรือบรรทุกเครื่องบินชั้น Yorktown ของสหรัฐฯ และเรือบรรทุกเครื่องบิน Ark Royal ของอังกฤษ ระวางขับนํ้าราว 21,000 ตัน มีเกราะพอใช และบรรทุกเครื่องบินในจํานวนปานกลาง"
 ITA_carrier_3: "ชั้น Aquila"
 ITA_carrier_3_desc: "Aquila เปนแผนดัดแปลงเรือเดินสมุทร Roma การดัดแปลงจะเริ่มในป 1941 แตโครงการไมเคยแลวเสร็จ หากสรางเสร็จ Aquila จะมีระวางขับนํ้า 23,500 ตัน และเทียบไดกับเรือบรรทุกเครื่องบินชั้น Hiyo ของญี่ปุนและชั้น Indomitable ของอังกฤษ"
 ITA_carrier_4: "ชั้น Sparviero"
 ITA_carrier_4_desc: "Sparviero ก็เปนแผนดัดแปลงเรือเดินสมุทร Augustus เชนกัน การดัดแปลงเริ่มในปลายป 1942 แตคืบหนาไปไมมาก เยอรมนีจมเรือลํานี้ทิ้งหลังยึดไดภายหลังการสงบศึกของอิตาลี เรือบรรทุกเครื่องบินลํานี้จะมีระวางขับนํ้า 30,400 ตัน เกราะคอนขางดี และมีชุดอาวุธปองกันภัยทางอากาศที่แข็งแกรง"
 ITA_SH_battleship_1: "ชั้น Regina Margherita"
 ITA_SH_battleship_1_desc: "ชั้น Regina Margherita เปนเรือประจัญบานหนักสมมุติที่จะปลอยลงนํ้าไมนานกอนสงครามเริ่ม เทียบไดกับเรือประจัญบานชั้น Yamato ของญี่ปุน เรือจะมีเกราะดีมาก ระวางขับนํ้าราว 60,000 ตัน และติดปน 406 มม."
 ITA_SH_battleship_2: "ชั้น Regina Elena"
 ITA_SH_battleship_2_desc: "ชั้น Regina Elena เปนเรือประจัญบานหนักสมมุติที่จะปลอยลงนํ้าราวชวงที่อิตาลีเขาสูสงคราม เทียบไดกับเรือประจัญบานชั้น Montana ที่สหรัฐฯ วางแผนไว มีเกราะหนามาก ระวางขับนํ้าเกิน 70,000 ตัน และติดปน 406 มม. เปนอาวุธหลัก"
 ### JAP - JAPAN ###
 JAP_submarine_1: "ชั้น Kaichu"
 JAP_submarine_1_desc: "เรือดํานํ้าชั้น Kaichu สรางขึ้นหลังสงครามโลกครั้งที่ 1 โดยพัฒนาจากเรือดํานํ้ารุนกอน เรือดํานํ้าขนาดกลางเหลานี้มีอาวุธเพียงพอ พิสัยปฏิบัติการดี และความเร็วดีสําหรับยุคนั้น แตเมื่อถึงป 1938 ก็คอนขางลาสมัยแลว มีการสรางเรือดํานํ้าแบบ Kaichu ใหกองทัพเรือจักรวรรดิญี่ปุนทั้งหมด 42 ลํา และซีรีสนี้มี 7 รุนยอย"
 #JAP_submarine_1b: "Kaidai III Class"
 JAP_submarine_2: "ชั้น Kaidai VI"
 JAP_submarine_2_desc: "เรือดํานํ้าชั้น Kaidai VI เปนเรือดํานํ้าขนาดใหญที่ติดอาวุธดี มีพิสัยไกลและความเร็วคอนขางดี เรือดํานํ้าซีรีส Kaidai ทั้งหมดเปนเรือที่มีเสถียรภาพและประสบความสําเร็จ ซึ่งรับใชกองทัพเรือจักรวรรดิญี่ปุนจนสงครามแปซิฟกสิ้นสุด"
 JAP_submarine_3: "ชั้น Ko/Otsu/Hei-gata"
 JAP_submarine_3_desc: "เรือชั้น Ko-gata, Otsu-gata และ Hei-gata เปนเรือดํานํ้าลาดตระเวนขนาดใหญที่ทําหนาที่เปนเรือบังคับการของกองเรือดํานํ้า ติดตั้งอุปกรณวิทยุที่ทันสมัย อาวุธตอรปโดหนัก และขนาดที่ใหญทําใหมีรัศมีปฏิบัติการกวาง ชั้น Ko และ Otsu-gata ยังบรรทุกเครื่องบินทะเลเพื่อทําหนาที่ลาดตระเวนดวย"
 #JAP_submarine_3b: "Ko/Otsu/Hei-gata Class (late)"
 JAP_submarine_4: "ชั้น Sen-Toku"
 JAP_submarine_4_desc: "เรือดํานํ้าชั้น Sen-Toku เปนเรือดํานํ้าที่ใหญที่สุดในสงครามโลกครั้งที่ 2 เปนเรือดํานํ้าบรรทุกเครื่องบินที่มีอาวุธตอรปโดหนัก อาวุธตอสูอากาศยานเบาที่เพียงพอ และดวยขนาดและเครื่องยนต จึงคอนขางเร็วและพิสัยไกล สามารถบรรทุกเครื่องบิน Aichi M6A Seiran สามลําเพื่อการลาดตระเวนและการโจมตีแบบจํากัด"
 #JAP_submarine_4b: "Sen-Taka Class"
 JAP_destroyer_1: "ชั้น Minekaze"
 JAP_destroyer_1_desc: "เรือพิฆาตชั้น Minekaze, Kamikaze และ Mutsuki ติดอาวุธดีทั้งปนผิวนํ้าและตอรปโดสําหรับยุคนั้น แตมีอาวุธตอสูอากาศยานจํากัด เรือเหลานี้ถูกมองวาลาสมัยเมื่อสงครามโลกครั้งที่ 2 เริ่ม และถูกลดบทบาทไปทําภารกิจรองเปนสวนใหญ"
 #JAP_destroyer_1b: "Fubuki Class"
 JAP_destroyer_2: "ชั้น Asashio"
 JAP_destroyer_2_desc: "เรือพิฆาตชั้น Asashio เปนเรือพิฆาตญี่ปุนชั้นแรกที่มีระวางขับนํ้าเกิน 2,000 ตัน และเปนชั้นแรกที่ติดตั้งโซนาร มีอาวุธตอรปโดหนักและปนตอสูอากาศยานเบาที่เพียงพอ และมีรัศมีปฏิบัติการกวางกวาชั้น Fubuki รุนเกาเล็กนอย"
 #JAP_destroyer_2b_ "Kagero Class"
 JAP_destroyer_3: "ชั้น Akizuki"
 JAP_destroyer_3_desc: "เรือพิฆาตชั้น Akizuki ติดอาวุธดีทั้งปนผิวนํ้าและตอรปโด มีอาวุธตอสูอากาศยานเพียงพอ รวมถึงระเบิดลึกเพิ่มเติมที่จําเปนอยางยิ่ง จากที่วางแผนไว 39 ลํา สรางเสร็จเพียง 12 ลํากอนที่ซีรีสนี้จะถูกยกเลิก"
 JAP_destroyer_4: "ชั้น Shimakaze"
 JAP_destroyer_4_desc: "ชั้น Shimakaze เปนเรือพิฆาตที่เร็วที่สุดในโลกเมื่อสรางเสร็จ เปนเรือพิฆาตตนแบบเพื่อทดสอบกังหันอุณหภูมิสูง แรงดันสูงแบบใหม เรือเร็วมากและติดตอรปโดจํานวนมาก แตนั่นหมายถึงรัศมีปฏิบัติการที่แคบลง"
 JAP_light_cruiser_1: "ชั้น Tenryu"
 JAP_light_cruiser_1_desc: "เรือชั้น Tenryu มีระวางขับนํ้าราว 4,400 ตัน และมีอาวุธเบาเมื่อเทียบกับเรือแบบเดียวกันของกองทัพเรือชาติอื่น แตความเร็วที่ดีและอาวุธตอรปโดที่เพียงพอชวยชดเชยจุดดอยเหลานี้ เรือออกแบบมาใหเปนเรือธงของกองเรือพิฆาต จึงถือเปนชั้นกึ่งกลางระหวางเรือลาดตระเวนเบากับเรือพิฆาต"
 #JAP_light_cruiser_1b: "Kuma Class"
 #JAP_light_cruiser_1c: "Sendai Class"
 JAP_light_cruiser_2: "ชั้น Mogami (เบา)"
 JAP_light_cruiser_2_desc: "เรือลาดตระเวนชั้น Mogami ติดอาวุธหนัก มีเกราะดีและเครื่องยนตทรงพลังที่ใหความเร็วสูง ภายหลังไดรับการเพิ่มขนาดปนจากแบบเดิมและถูกจัดประเภทใหมเปนเรือลาดตระเวนหนัก การปองกันภัยทางอากาศที่ดีและความเร็วสูงทําใหมีพิสัยปฏิบัติการไกล"
 JAP_light_cruiser_3: "ชั้น Agano"
 JAP_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้น Agano ออกแบบมาเปนเรือนําหมูใหกองเรือพิฆาตเปนหลัก เรือเร็ว ติดปน 152 มม. ปอมแฝด 3 ปอม แตอาวุธตอสูอากาศยานที่จํากัดและแผนเกราะบางเปนจุดดอยสําคัญของแบบเรือ"
 #JAP_light_cruiser_3b: "Oyodo Class"
 JAP_light_cruiser_4: "ชั้น Agatsuma"
 JAP_light_cruiser_4_desc: "ชั้น Agatsuma เปนเรือลาดตระเวนเบาที่ไมมีลําใดสรางขึ้นกอนสงครามสิ้นสุด เรือลาดตระเวนเหลานี้ออกแบบใหเร็วและติดอาวุธหนักแตมีเกราะเบา เพื่อปกปองกองเรือและเรือบรรทุกเครื่องบินจากอากาศยานขาศึก"
 JAP_heavy_cruiser_1: "ชั้น Furutaka"
 JAP_heavy_cruiser_1_desc: "เรือลาดตระเวนหนักชั้น Furutaka และชั้น Aoba ที่ตามมา เปนเรือลาดตระเวนหนักรุนแรกของกองทัพเรือจักรวรรดิญี่ปุน ออกแบบโดยใชชั้น Omaha ของสหรัฐฯ และชั้น Hawkins ของอังกฤษเปนตนแบบ ในชวงหลังของอายุการใชงาน เรือไดรับการปรับปรุงใหทันสมัย พรอมอาวุธใหมและเครื่องยนตที่ดีขึ้น"
 #JAP_heavy_cruiser_1b: "Myoko Class"
 JAP_heavy_cruiser_2: "ชั้น Mogami (หนัก)"
 JAP_heavy_cruiser_2_desc: "ชั้น Mogami แบบหนักคือเรือลาดตระเวนเบาที่เพิ่มขนาดปนและถูกจัดประเภทใหม ทําใหเปนเรือลาดตระเวนที่เร็ว อาวุธหนัก และเกราะดี พิสัยไกลของเรือแลกมาดวยการปองกันดวยเกราะที่บางลง"
 JAP_heavy_cruiser_3: "ชั้น Tone"
 JAP_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้น Tone เดิมออกแบบเปนเรือลาดตระเวนเบา แตถูกปรับแบบใหมใหมีอาวุธหนักขึ้น เรือมีเอกลักษณตรงที่อาวุธทั้งหมดอยูดานหนา สวนทายเรือใชบรรทุกและซอมบํารุงเครื่องบินทะเลที่ใชสอดแนมกําลังขาศึก"
 JAP_heavy_cruiser_4: "ชั้น Ibuki"
 JAP_heavy_cruiser_4_desc: "เรือลาดตระเวนหนักชั้น Ibuki เปนเรือลาดตระเวนชุดสุดทายที่ญี่ปุนสรางกอนสงครามสิ้นสุด เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้น Mogami มีการจัดวางและอาวุธแบบเดียวกัน แตมีอาวุธตอสูอากาศยานและเครื่องยนตที่ทันสมัยกวา"
 JAP_battle_cruiser_1: "ชั้น Amagi"
 JAP_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบาน Amagi เปนชุดเรือลาดตระเวนประจัญบานที่วางแผนไว ตามแผนอันทะเยอทะยานของกองทัพเรือญี่ปุนที่จะมีเรือประจัญบานแปดลําและเรือลาดตระเวนประจัญบานแปดลํา หลังสนธิสัญญานาวีวอชิงตัน เรือชั้น Amagi ถูกแยกชิ้นสวน และหนึ่งลําถูกดัดแปลงเปนเรือบรรทุกเครื่องบิน"
 JAP_battle_cruiser_2: "แบบ B-65"
 JAP_battle_cruiser_2_desc: "เรือลาดตระเวนประจัญบานแบบ B-65 เปนเรือที่เร็ว มีเกราะปานกลาง อาวุธตอสูอากาศยานดี และอาวุธทันสมัย ออกแบบมาเพื่อตอกรกับเรือลาดตระเวนหนักรุนใหมของกองทัพเรือสหรัฐฯ และปกปองเรือบรรทุกเครื่องบินประจํากองเรือของกองทัพเรือจักรวรรดิญี่ปุน หากสรางเสร็จ เรือเหลานี้จะเปนกําลังที่นาเกรงขาม"
 JAP_battleship_1: "ชั้น Fuso"
 JAP_battleship_1_desc: "เรือประจัญบานชั้น Fuso สรางขึ้นระหวางสงครามโลกครั้งที่ 1 และไดรับการปรับปรุงใหทันสมัยในทศวรรษ 1930 เมื่อสนธิสัญญานาวีลอนดอนฉบับแรกหามประเทศภาคีสรางเรือประจัญบานใหม เรือมีเกราะและอาวุธดี ปอมแฝด 6 ปอมบนแนวกึ่งกลางลําเรือใหอํานาจการยิงดานขางสูง แตก็จํากัดอาวุธตอสูอากาศยานเพิ่มเติมที่เรือจะติดตั้งได"
 #JAP_battleship_1b: "Ise Class" (refit version)
 #JAP_battleship_1c: "Nagato Class" (refit version)
 JAP_battleship_2: "ชั้น Kongo"
 JAP_battleship_2_desc: "เรือประจัญบาน Kongo สรางใหกองทัพเรือจักรวรรดิญี่ปุนกอนสงครามโลกครั้งที่ 1 ไมนานในฐานะเรือลาดตระเวนประจัญบาน แตไดรับการปรับปรุงครั้งใหญในชวงปลายทศวรรษ 1930 และถูกจัดประเภทใหมเปนเรือประจัญบานความเร็วสูงชั้นหนึ่ง เกราะ ปน และเครื่องยนตลวนไดรับการยกระดับอยางมาก และเรือชั้น Kongo กลายเปนเรือประจัญบานที่เร็วที่สุดของญี่ปุนในสงคราม"
 JAP_battleship_3: "ชั้น Tajima"
 JAP_battleship_3_desc: "ชั้น Tajima เปนเรือประจัญบานความเร็วสูงสมมุติ ออกแบบใหถูกกวาและสรางไดเร็วกวาเรือประจัญบานชั้น Yamato อันมหึมา เรือใชปนใหญรุนเกาจากเรือประจัญบานรุนกอน แตความเร็วสูง เกราะที่เพียงพอ และอาวุธตอสูอากาศยานชวยใหการปองกันแกเรือเหลานี้"
 JAP_battleship_4: "ชั้น Iwami"
 JAP_battleship_4_desc: "ชั้น Iwami เปนเรือประจัญบานสมมุติที่ใชวิธีการใหมเพื่อเรงการกอสราง ติดอาวุธดีดวยปนใหญใหมและปนตอสูอากาศยานหนัก และมีอํานาจการยิงทัดเทียมเรือใดๆ ที่ติดอาวุธใกลเคียงกัน อยางไรก็ตาม การปรับปรุงเหลานี้ทําใหเรือหนักขึ้นและชาลงบาง"
 JAP_SH_battleship_1: "ชั้น Yamato"
 JAP_SH_battleship_1_desc: "ชั้น Yamato ประกอบดวยเรือประจัญบานที่หนักที่สุดเทาที่เคยสรางมา ระวางขับนํ้า 72,000 ตัน และออกแบบมาใหเปนความภาคภูมิใจและแสนยานุภาพของกองทัพเรือญี่ปุนภายใตแผนเทพธิดาแหงสันติภาพ เรือแตละลําติดปนเรือ 460 มิลลิเมตรเกากระบอก ซึ่งเปนปนใหญเรือที่ใหญที่สุดที่เคยติดตั้งบนเรือรบ"
 JAP_SH_battleship_2: "ชั้น Super Yamato"
 JAP_SH_battleship_2_desc: "ชั้น Super Yamato สมมุติใช Yamato เปนพื้นฐาน แตอาวุธจะทรงพลังยิ่งขึ้น ดวยอาวุธหลักเปนปนใหญ 51 ซม. และอาวุธตอสูอากาศยานรุนใหมลาสุดที่แข็งแกรง ความหนาของเกราะออกแบบใหทนไดแมกระสุนจากปนของตัวเอง และจะมีระวางขับนํ้าราว 70-80.000 ตัน"
 JAP_carrier_1: "ชั้น Kaga"
 JAP_carrier_1_desc: "เรือบรรทุกเครื่องบิน Kaga เปนเรือบรรทุกเครื่องบินประจํากองเรือลําแรกของญี่ปุน เดิมเปนเรือประจัญบาน แตสรางเสร็จเปนเรือบรรทุกเครื่องบิน ผลที่ไดคือเรือบรรทุกเครื่องบินขนาดใหญ เกราะหนา แตมีพื้นที่จํากัดสําหรับการปรับปรุง อยางไรก็ตาม นี่เปนประสบการณสําคัญในการสรางเรือบรรทุกเครื่องบินสําหรับกองทัพเรือจักรวรรดิญี่ปุน"
 #JAP_carrier_1b: "Akagi Class" (refit Kaga class)
 JAP_carrier_2: "ชั้น Soryu"
 JAP_carrier_2_desc: "Soryu และ Hiryu ออกแบบใหมีโครงสรางเกาะสะทอนกลับดานกัน เพื่อเรงกระบวนการรับเครื่องบินกลับขณะแลนเคียงกัน เปนเรือบรรทุกเครื่องบินความเร็วสูงที่มีพื้นที่สําหรับกองบินขนาดใหญ แตมีเกราะนอยที่สุด ระวางขับนํ้า 20.000 ตัน และเครื่องยนตขนาดใหญใหความเร็วสูงและพิสัยปฏิบัติการไกล"
 #JAP_carrier_2b: "Hiryu Class"
 JAP_carrier_3: "ชั้น Shokaku"
 JAP_carrier_3_desc: "เรือบรรทุกเครื่องบินชั้น Shokaku ออกแบบมาเพื่อความเร็วสูง รัศมีปฏิบัติการไกล การปองกันหนา และความจุเครื่องบินมาก ซึ่งทําใหเปนเรือบรรทุกเครื่องบินชั้นยอด ดวยวิธีการกอสรางที่ปรับปรุงแลว เรือมีระวางขับนํ้าเต็มที่ 33.000 ตัน และทนความเสียหายไดมากกวาเรือบรรทุกเครื่องบินรวมสมัยสวนใหญ"
 #JAP_carrier_3b: "Hiyo Class"
 JAP_carrier_4: "ชั้น Taiho"
 JAP_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้น Taiho เปนเรือบรรทุกเครื่องบินหุมเกราะเต็มรูปแบบลําแรกของกองทัพเรือจักรวรรดิญี่ปุน มีดาดฟาบินหุมเกราะที่ทนการโดนระเบิดและตอรปโดหลายครั้งไดและยังทํางานไดอยางมีประสิทธิภาพ กองบินขนาดใหญรวมกับอาวุธตอสูอากาศยานหนักจะไมเพียงใหการปองกันตนเอง แตยังใหการแผอํานาจเหนือกําลังขาศึกดวย"
 #JAP_carrier_4b: "Shinano Class"
 ### SOV - SOVIET UNION ###
 SOV_submarine_1: "ชั้น AG"
 SOV_submarine_1_desc: "เรือดํานํ้าชั้น Amerikansky Golland (ฮอลแลนดอเมริกัน) สรางในแคนาดา แลวสงมอบใหรัสเซียระหวางสงครามโลกครั้งที่ 1 ซึ่งนําไปประกอบขั้นสุดทาย เปนการลอกแบบโดยตรงจากเรือดํานํ้าแบบ Holland ที่ประสบความสําเร็จ ออกแบบใหเปนเรือที่เดินทะเลไดดีและติดอาวุธดีสําหรับยุคนั้น"
 #SOV_submarine_1b: "Series I Debakrist"
 SOV_submarine_2: "ซีรีส V Shchuka"
 SOV_submarine_2_desc: "เรือดํานํ้าซีรีส V ของชั้น Schuka เปนเรือดํานํ้าที่มีจํานวนมากเปนอันดับสองของกองทัพเรือโซเวียต จํานวนที่มากมาจากการวางกําลังใหกองเรือทั้งสี่ของสหภาพโซเวียต ไดแก ทะเลดํา บอลติก ภาคเหนือ และแปซิฟก เปนเรือดํานํ้าลาดตระเวนขนาดกลางที่มีอาวุธตอรปโดดีและเดินทะเลไดดี"
 #SOV_submarine_2b: "Series IX Srednyaya" (Stalinets<-unofficial name)
 #SOV_submarine_2c: "Series X Shchuka"
 SOV_submarine_3: "ซีรีส XIV ชั้น K"
 SOV_submarine_3_desc: "เรือดํานํ้าซีรีส XIV เปนเรือดํานํ้าลาดตระเวนขนาดใหญที่มีพิสัยขยาย โดยพื้นฐานคือรุนปรับปรุงของซีรีส IV ชั้น Pravda เรือดํานํ้าเหลานี้มีอาวุธหนักทั้งปนผิวนํ้าและตอรปโด มีพิสัยไกลแตความสามารถในการเดินทะเลเพียงพอใช"
 SOV_submarine_4: "โครงการ 611"
 SOV_submarine_4_desc: "เรือดํานํ้าโครงการ 611 (ชื่อรหัส NATO: Zulu) เปนเรือดํานํ้าชั้นแรกของกองทัพเรือโซเวียตที่สรางหลังสงครามโลกครั้งที่ 2 แบบเรือพัฒนาจากเรือดํานํ้าแบบ XXI ของเยอรมนี และมีไวเพื่อทดแทนเรือซีรีส XIV ชั้น K รุนเกา เปนเรือดํานํ้าเดินสมุทรขนาดใหญที่มีอาวุธตอรปโดหนักและพิสัยไกล และเปนพื้นฐานของเรือดํานํ้าโครงการ 613 (ชื่อรหัส NATO: Whiskey) และโครงการ 641 (ชื่อรหัส NATO: Foxtrot) ที่ตามมา"
 SOV_destroyer_1: "ชั้น Orfey"
 SOV_destroyer_1_desc: "เรือพิฆาตชั้น Orfey เปนรุนปรับปรุงของชั้น Novik รุนกอน มีอาวุธผิวนํ้าและตอสูอากาศยานเพียงพอสําหรับขนาด พิสัยคอนขางสั้น แตความเร็วดีและอาวุธตอรปโดหนัก ชั้น Fidonisy และ Izyaslav ที่ตามมาเปนรุนที่ปรับปรุงตอยอด โดยเพิ่มอาวุธหลักและขนาดตัวเรือ"
 #SOV_destroyer_1b: "Leningrad & Minsk Class"
 SOV_destroyer_2: "ชั้น Gnevny"
 SOV_destroyer_2_desc: "เรือพิฆาตชั้น Gnevny (โครงการ 7) ไดรับอนุมัติภายใตโครงการตอเรือป 1933-1938 ตัวชั้นไดรับอิทธิพลอยางมากจากเรือพิฆาต Maestrale ของอิตาลี และถือเปนแบบเรือที่ประสบความสําเร็จ ระวางขับนํ้าอยูในชวง 1,600-2,000 ตัน มีอาวุธดี และมีอาวุธตอสูอากาศยานและตอรปโดเพียงพอ ดวยเครื่องยนตทรงพลัง เรือจึงเร็วแตพิสัยสั้น"
 SOV_destroyer_3: "ชั้น Soobrazitelnyi"
 SOV_destroyer_3_desc: "เรือพิฆาต Soobrazitelnyi (โครงการ 7U) เปนรุนปรับปรุงของชั้น Gnevny รุนกอน เครื่องยนตไดรับการออกแบบใหมและมีอาวุธตอสูอากาศยานแข็งแกรงขึ้น ระวางขับนํ้าระหวาง 1,900 ถึง 2,400 ตัน และมีความเร็วกับพิสัยใกลเคียงกับชั้น Gnevny"
 #SOV_destroyer_3b: "Ognevoy Class"
 SOV_destroyer_4: "ชั้น Skoryi"
 SOV_destroyer_4_desc: "ชั้น Skoryi (โครงการ 30bis) เปนการปรับปรุงตอยอดจากชั้น Ognevoy ขนาดและระวางขับนํ้าที่เพิ่มขึ้น (2,500-3,100 ตัน) ทําใหเรือมีเสถียรภาพมากขึ้นและพิสัยปฏิบัติการไกลขึ้น เรือทั้งหมดสรางหลังสงครามดวยแบบโมดูลาร ซึ่งทําใหสรางและนําเขาประจําการไดรวดเร็ว อาวุธเหมือนกับชั้น Ognevoy รุนกอน แตปนหลักติดตั้งในปอมแฝดแทนปอมเดี่ยว"
 SOV_light_cruiser_1: "ชั้น Krasniy Krym"
 SOV_light_cruiser_1_desc: "เรือลาดตระเวนชั้น Krasniy Krym เดิมคือเรือลาดตระเวนชั้น Svetlana เริ่มสรางกอนสงครามโลกครั้งที่ 1 แตสงครามและการปฏิวัติที่ตามมาทําใหทั้งชั้นสรางเสร็จลาชา ในชวงกลางถึงปลายทศวรรษ 1920 เรือก็เขาประจําการในกองทัพเรือโซเวียตในที่สุด พรอมกับเรือพี่นองตางแบบ Chervona Ukraina (เดิมคือ Admiral Nakhimov) เรือเหลานี้เปนเรือลาดตระเวนขับเคลื่อนดวยกังหันรุนแรกของกองทัพเรือจักรวรรดิรัสเซีย และเปนเรือลาดตระเวนที่ติดอาวุธหนักและเกราะดีสําหรับยุคนั้น"
 SOV_light_cruiser_2: "ชั้น Komsomolets"
 SOV_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้น Komsomolets เปนชุดเรือสมมุติ ซึ่งผสมผสานเทคโนโลยีเกาและใหมเขาดวยกัน การใชตัวเรือที่สรางไมเสร็จของชั้น Svetlana และ Admiral Nakhimov ชวยลดคาใชจายในการสราง เรือติดปอมแฝดหกปอมพรอมปนขนาดเล็กระดับเรือพิฆาต และอาวุธตอสูอากาศยานที่เพียงพอ จึงเหมาะกับบทบาทลาดตระเวนและเรือนํากองเรือพิฆาต รูปลักษณโดยรวมของเรือคลายเรือลาดตระเวนชั้น Kirov"
 SOV_light_cruiser_3: "ชั้น Chapayev"
 SOV_light_cruiser_3_desc: "เรือลาดตระเวนชั้น Chapayev (โครงการ 68) พัฒนาจากเรือลาดตระเวนชั้น Kirov (โครงการ 26) และไดรับอนุมัติในโครงการตอเรือป 1938-43 ในฐานะเรือลาดตระเวนเบาแทจริงรุนแรกของกองทัพเรือโซเวียต เรือติดอาวุธตอตานเปาหมายผิวนํ้าและตอสูอากาศยานที่แข็งแกรง รวมกับอาวุธตอรปโดที่เพียงพอ โดยรวมแลวเปนเรือที่ดี มีสายเกราะหนา ความเร็วสูง พิสัยปฏิบัติการดี และระวางขับนํ้า 10,500 ถึง 14,000 ตัน เนื่องจากสงครามและการรุกรานของกองกําลังเยอรมัน เรือหลายลําในชั้นนี้ถูกยกเลิก และที่เหลือสรางเสร็จหลังการสูรบยุติ"
 SOV_light_cruiser_4: "ชั้น Sverdlov"
 SOV_light_cruiser_4_desc: "เรือลาดตระเวนชั้น Sverdlov (โครงการ 68bis) เปนเรือลาดตระเวนติดปนชุดสุดทายของกองทัพเรือโซเวียต และเปนรุนปรับปรุงของชั้น Chapayev กอนหนา เมื่อเทียบกับ Chapayev เรือมีอาวุธหลัก เครื่องจักร และเกราะปองกันเหมือนกัน แตมีความจุเชื้อเพลิงเพิ่มขึ้นเพื่อพิสัยที่ไกลขึ้น การปองกันใตนํ้าดีขึ้น ชุดอาวุธตอสูอากาศยานเพิ่มขึ้น และความสามารถในการเดินทะเลดีขึ้นเล็กนอย ออกแบบมาสําหรับบทบาทลาขบวนเรือลําเลียงและคุมกันเรือหลัก เนื่องจากการมาถึงของยุคขีปนาวุธ เรือหลายลําจึงถูกยกเลิกหรือสรางไมเสร็จ"
 SOV_heavy_cruiser_1: "ชั้น Krasniy Kavkaz"
 SOV_heavy_cruiser_1_desc: "เรือลาดตระเวน Krasnyi Kavkaz เดิมคือเรือลาดตระเวนเบาชั้น Admiral Nakhimov เปนเรือพี่นองตางแบบของ Chervona Ukraina Krasnyi Kavkaz สรางเสร็จดวยแบบที่ดัดแปลง ซึ่งรวมถึงปนขนาดลํากลองใหญขึ้น 180 มม. และอาวุธตอสูอากาศยานที่แข็งแกรงขึ้น เนื่องจากเปนเรือลาดตระเวนเบาที่สรางใหม เกราะจึงบางกวาเรือลาดตระเวนหนักของกองทัพเรือชาติอื่น"
 SOV_heavy_cruiser_2: "ชั้น Kirov"
 SOV_heavy_cruiser_2_desc: "เรือลาดตระเวนชั้น Kirov (โครงการ 26) เปนเรือลาดตระเวนสมัยใหมรุนแรกของกองทัพเรือโซเวียต แบบเรือพัฒนาจากเรือลาดตระเวนเบาชั้น Raimondo Montecuccoli ของอิตาลี และสรางเปนสวนหนึ่งของโครงการตอเรือป 1933-1938 เรือมีระวางขับนํ้าระหวาง 7,700 ถึง 9,200 ตัน ติดปน 180 มม. แบบใหมในปอมสามลํากลอง 3 ปอม และชุดอาวุธตอสูอากาศยานที่มั่นคง เครื่องยนตทรงพลังใหความเร็วดีและพิสัยปฏิบัติการที่ยอมรับได ขณะที่สายเกราะบางเมื่อเทียบกับเรือลาดตระเวนหนักอื่นๆ"
 #SOV_heavy_cruiser_2b: "Maxim Gorky Class"
 SOV_heavy_cruiser_3: "โครงการ 22"
 SOV_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักโครงการ 22 ออกแบบในกลางทศวรรษ 1930 เพื่อรับมือเรือแบบเดียวกันของประเทศเพื่อนบาน แบบเรือกําหนดใหเปนเรือขนาดใหญขึ้น ระวางขับนํ้าระหวาง 15,500 ถึง 17,000 ตัน ติดปนใหญ 240 มม. ปอมสามลํากลองสี่ปอมเพื่อตอสูกับเรือลาดตระเวนขาศึก อาวุธตอสูอากาศยานหนักเพื่อปองกันตนเอง และเครื่องบินตรวจการณจํานวนมากขึ้นเพื่อคนหาขาศึก ภารกิจหลักคือสอดแนมกําลังขาศึกและลาขบวนเรือลําเลียง คาใชจายของเรือและการจัดสรรทรัพยากรไปยังความตองการอื่นทําใหโครงการถูกยกเลิก"
 SOV_heavy_cruiser_4: "โครงการ 66"
 SOV_heavy_cruiser_4_desc: "เรือลาดตระเวนหนักโครงการ 66 เปนความพยายามครั้งสุดทายของกองทัพเรือโซเวียตในการออกแบบและสรางเรือลาดตระเวนติดปนลวน การศึกษาแบบเริ่มในป 1943 และแบบสุดทายออกมาหลังสงคราม เรือจะติดปนใหญ 220 มม. ในปอมสามลํากลอง 3 ปอม และอาวุธตอสูอากาศยานที่แข็งแกรง ระวางขับนํ้าจะอยูที่อยางนอย 26,500 ตัน การมาถึงของยุคขีปนาวุธและการเสียชีวิตของโจเซฟ สตาลิน ทําใหโครงการถูกยุติ"
 SOV_battle_cruiser_1: "ชั้น Borodino"
 SOV_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้น Borodino เปนเรือสี่ลําที่ไดรับอนุมัติในป 1914 กอนสงครามโลกครั้งที่ 1 ไมนาน พัฒนาจากเรือประจัญบานชั้น Imperatritsa Mariya และยึดตามแนวปฏิบัติการสรางเรือหลักของรัสเซียรวมสมัย คือใชปอมสามลํากลองสี่ปอมสําหรับอาวุธหลักหนัก อาวุธรองที่แข็งแกรงในปอมขางลํา และดาดฟาเรียบตลอดลํา เรือมีรูปทรงตํ่าและกินนํ้าตื้นเพื่อรบในนานนํ้าตื้นของทะเลบอลติก เชนเดียวกับเรือรัสเซียหลายลําในยุคนี้ การปะทุของสงครามโลกครั้งที่ 1 และการปฏิวัติรัสเซียทําใหเรือเหลานี้ไมมีวันสรางเสร็จ"
 SOV_battle_cruiser_2: "ชั้น Kronshtadt"
 SOV_battle_cruiser_2_desc: "เรือลาดตระเวนประจัญบานชั้น Kronshtadt (โครงการ 69) ไดรับอนุมัติในโครงการตอเรือป 1938-43 และมีกําหนดสรางเสร็จในทศวรรษ 1940 แบบเดิมมุงเปนเรือลาดตระเวนหนักขนาดใหญ 23,000 ตัน แตหลังจากไดขอมูลเกี่ยวกับเรือลาดตระเวนประจัญบาน Scharnhorst ของเยอรมนี เรือก็ถูกออกแบบใหมใหมีระวางขับนํ้า 35,000 ตัน เมื่อการสูรบระหวางเยอรมนีกับสหภาพโซเวียตปะทุขึ้น การกอสรางก็ถูกระงับและยกเลิกในที่สุด มีแผนทางเลือกที่จะสรางตัวเรือที่ไมเสร็จใหเปนเรือบรรทุกเครื่องบินภายใตโครงการ 69AV"
 SOV_battleship_1: "ชั้น Marat"
 SOV_battleship_1_desc: "เรือประจัญบานชั้น Marat (เดิมคือชั้น Gangut) เปนเรือประจัญบานยุคสงครามโลกครั้งที่ 1 และเปนเรือเดรดนอตรุนแรกที่ประจําการในกองทัพเรือจักรวรรดิรัสเซีย แบบเรือและการจัดวางปอมปนเปนพื้นฐานของเรือประจัญบานและเรือลาดตระเวนประจัญบานทุกชั้นที่ตามมา มีเพียงสามลําที่รอดพนความโกลาหลของการปฏิวัติรัสเซีย เรือไดรับการปรับปรุงใหทันสมัยและซอมปรับสภาพในทศวรรษ 1930 ทําใหมีโครงสรางสวนบนสูงเกือบคลายเจดีย มีอุปกรณอิเล็กทรอนิกสทันสมัยและอาวุธตอสูอากาศยานที่แข็งแกรง"
 SOV_battleship_2: "โครงการ 21"
 SOV_battleship_2_desc: "เรือประจัญบานโครงการ 21 ออกแบบในกลางทศวรรษ 1930 เพื่อเปนสวนหนึ่งของกองทัพเรือเดินสมุทรของสตาลิน เรือจะคลายเรือประจัญบานชั้น Nelson ของอังกฤษมาก ระวางขับนํ้าราว 41,000 ตัน ติดปนใหญ 406 มม. เกากระบอกในปอมสามลํากลอง 3 ปอม (ทั้งหมดอยูดานหนา) และอาวุธรองเปนปน 152 มม. สิบสองกระบอก อาวุธตอสูอากาศยานที่ดีและเกราะหนาใหการปองกันที่แข็งแกรงตอเปาหมายทั้งทางอากาศและผิวนํ้า ในที่สุดโครงการถูกยกเลิก แตองคประกอบบางสวนถูกนําไปใชในเรือประจัญบานชั้น Sovetsky Soyuz (โครงการ 23)"
 SOV_battleship_3: "ชั้น Lenin"
 SOV_battleship_3_desc: "เรือประจัญบานชั้น Lenin เปนแบบสมมุติเพื่อทัดเทียมและรับมือเรือประจัญบาน Bismarck ของเยอรมนีและชั้น South Dakota ของสหรัฐฯ ปนใหญ 406 มม. เกากระบอกในปอมสามลํากลอง 3 ปอมจะใหอํานาจการยิงที่เพียงพอ ขณะที่ปนตอสูอากาศยาน 130 มม. เกราะหนา และเครื่องยนตขนาดใหญจะชวยใหเรือรอดในการรบ"
 SOV_battleship_4: "ชั้น Stalingrad"
 SOV_battleship_4_desc: "เรือหลักชั้น Stalingrad (โครงการ 82) มีจุดประสงคเพื่อเปนอํานาจการยิงหลักของกองทัพเรือโซเวียตในยุคหลังสงครามโลกครั้งที่ 2 เปนเรือที่เร็ว อาวุธดี และเกราะดี การกอสรางเริ่มหลังสงคราม แตการเสียชีวิตของโจเซฟ สตาลิน นําไปสูการยกเลิกเรือเหลานี้ แมจะมีโครงการที่จะสรางอยางนอยหนึ่งลําใหเสร็จดวยแบบดัดแปลงที่ติดขีปนาวุธ V-2 ของโซเวียต"
 SOV_SH_battleship_1: "ชั้น Sovetsky Soyuz"
 SOV_SH_battleship_1_desc: "ชั้น Sovetsky Soyuz (โครงการ 23) เปนเรือประจัญบานชั้นสุดทายที่อูตอเรือโซเวียตสราง และไดรับอนุมัติในโครงการตอเรือป 1938-43 มีแผนสรางสี่ลํา ระวางขับนํ้ามาตรฐาน 59,000 ตัน ปอมสามลํากลองสามปอมติดปนใหญ 406 มม. พรอมอาวุธรองและอาวุธตอสูอากาศยานหนัก เรือยังมีเครื่องยนตทรงพลังเพื่อรองรับสายเกราะที่หนามาก การปะทุของสงครามทําใหเรือเหลานี้สรางไมเสร็จ"
 SOV_SH_battleship_2: "โครงการ 23bis"
 SOV_SH_battleship_2_desc: "เรือประจัญบานชั้นโครงการ 23bis เปนรุนดัดแปลงและปรับปรุงของชั้น Sovetsky Soyuz (โครงการ 23) กอนหนา เมื่อเทียบกับรุนกอน เรือติดปอมสามลํากลองสี่ปอมพรอมปนใหญขนาด 406 มม. เทาเดิม สายเกราะหนาขึ้น ปรับการจัดวางปนรองใหม และอาวุธตอสูอากาศยานแข็งแกรงขึ้น"
 SOV_carrier_1: "ชั้น Ismail"
 SOV_carrier_1_desc: "เรือบรรทุกเครื่องบินชั้น Ismail เปนการดัดแปลงโดยตรงจากตัวเรือที่สรางไมเสร็จของเรือลาดตระเวนประจัญบานชั้น Borodino ที่มีชื่อเดียวกัน ดวยลักษณะของการดัดแปลง เรือจะมีสายเกราะหนาและอาวุธตอตานเปาหมายผิวนํ้ากับตอสูอากาศยานที่แข็งแกรงสําหรับยุคนั้น กองบินขนาดปานกลางจะใหการคุมกันทางอากาศที่จําเปนแกกองเรือ โครงการไมไดดําเนินการเนื่องจากคาใชจายและสภาพอุตสาหกรรมตอเรือของโซเวียตหลังการปฏิวัติเดือนตุลาคม"
 SOV_carrier_2: "Krasnyi Vozdukh"
 SOV_carrier_2_desc: "เรือบรรทุกเครื่องบินชั้น Krasnyi Vozdukh เปนแบบสมมุติเพื่อใหกองทัพเรือโซเวียตแผอํานาจทางอากาศเหนือกองเรือของตน มีขนาดใกลเคียงกับชั้น Ark Royal ของอังกฤษหรือชั้น Hiryu ของญี่ปุน แตติดปนรองเพิ่มเติมเพื่อตอตานเปาหมายผิวนํ้า และปนตอสูอากาศยานที่เพียงพอสําหรับการคุมกันทางอากาศ เกราะที่เพิ่มขึ้นทําใหกองบินเล็กลงเล็กนอยเมื่อเทียบกับชั้นเหลานั้น"
 SOV_carrier_3: "โครงการ 71B"
 SOV_carrier_3_desc: "เรือบรรทุกเครื่องบินโครงการ 71B ออกแบบในชวงกลางถึงปลายทศวรรษ 1930 วางแผนไวเพื่อใหการคุมกันทางอากาศแกกองเรือผิวนํ้าใหมที่สตาลินสั่งการในแผนของเขา มีแผนสรางสองลํา ระวางขับนํ้าราว 30,000 ตัน มีอาวุธตอสูอากาศยานแข็งแกรง เกราะดี และกองบินที่เพียงพอ การรุกรานของเยอรมนีทําใหการกอสรางเรือเหลานี้ถูกยกเลิก"
 SOV_carrier_4: "โครงการ 72"
 SOV_carrier_4_desc: "เรือบรรทุกเครื่องบินโครงการ 72 เปนรุนปรับปรุงของเรือโครงการ 71 กอนหนา การศึกษาแบบเสร็จในตนทศวรรษ 1940 ไดเรือที่ใหญขึ้นแตเกราะบางลง พื้นที่ที่เพิ่มขึ้นถูกใชติดตั้งอาวุธตอสูอากาศยานที่แข็งแกรงขึ้นและรองรับกองบินที่ใหญขึ้น"
 ### USA - USA ###
 USA_submarine_1: "ชั้น S"
 USA_submarine_1_desc: "เรือ S หรือที่เรียกกันทั่วไปวา Sugar Boats เปนชุดเรือดํานํ้า 51 ลําที่ออกแบบและสรางในทศวรรษ 1920 เมื่อเทียบกับชุดเรือ O และ R ยุคสงครามโลกครั้งที่ 1 เรือ S มีขนาดใหญกวา ทําใหพิสัยไกลขึ้นและบรรจุตอรปโดสํารองไดมากขึ้น แมชั้นนี้จะมีทอขนาด 21 นิ้วหันไปดานหนาเพียงสี่ทอ แมจะมีอายุมาก โดยเรือ S ลําสุดทายเขาประจําการในป 1924 แตเรือ S ก็ยังเปนสวนสําคัญของกําลังเรือดํานํ้าประจําการของกองทัพเรือสหรัฐฯ"
 #USA_submarine_1b: "Barracuda Class"
 USA_submarine_2: "ชั้น Porpoise"
 USA_submarine_2_desc: "เรือดํานํ้าชั้น Porpoise เปนเรือดํานํ้าสมัยใหมลําแรกของกองทัพเรือสหรัฐฯ ที่ออกแบบและสรางตอจากชุดเรือทดลอง "V Boats" ที่สรางในชวงปลายทศวรรษ 20 และตนทศวรรษ 30 แมจะมีปญหาในชวงแรกกับระบบขับเคลื่อนไฟฟาลวน แตชั้นนี้ก็มีอนาคตและถูกพิจารณาเปนแนวทางของแบบเรือในอนาคต ชั้นนี้ติดทอตอรปโด 6 ทอและปนดาดฟา 3""
 #USA_submarine_2b: "Salmon Class"
 USA_submarine_3: "ชั้น Tambor"
 USA_submarine_3_desc: "ชั้น Tambor เปนผลสรุปจากการทดลองหลายปของกองทัพเรือสหรัฐฯ ในการออกแบบเรือดํานํ้าใหเหมาะกับบทบาท "Fleet Boat" และทํางานไดดีในนานนํ้ามหาสมุทรแปซิฟก อาวุธไดรับการยกระดับเปนทอตอรปโด 10 ทอ โดยสี่ทอยิงไปทางทาย ปนดาดฟา 3" และปนตอสูอากาศยานสองกระบอกเพื่อการปองกันเพิ่มเติม"
 #USA_submarine_3b: "Gato Class"
 USA_submarine_4: "ชั้น Balao"
 USA_submarine_4_desc: "ชั้น Balao เปนการสานตอแบบเรือที่มีรากฐานจากชั้น Tambor การปรับปรุงมาในรูปของการเสริมความแข็งแรงตัวเรือและการยกระดับปนดาดฟาเปนขนาด 5"/24 พรอมการปรับปรุงแบบเรือเล็กๆ นอยๆ อีกมากมาย"
 USA_destroyer_1: "ชั้น Clemson"
 USA_destroyer_1_desc: "เรือพิฆาตชั้น Clemson สืบทอดองคประกอบการออกแบบหลายอยางจากรุนกอนหนาโดยตรงคือชั้น Wickes Clemson เดินทะเลไดดีกวาชั้น Wickes และติดปนหลักขนาด 4"/50 ปนตอสูอากาศยานขนาด 3"/23 และทอตอรปโด 12 ทอ ชั้นนี้มีอายุมากและเกือบลาสมัย แตยังเปนกําลังสวนใหญของกองเรือพิฆาตของกองทัพเรือสหรัฐฯ"
 #USA_destroyer_1b: "Farragut Class"
 USA_destroyer_2: "ชั้น Sims"
 USA_destroyer_2_desc: "ชั้น Sims เปนแบบ "1500 Tonner" ที่ใหญที่สุด มีการจัดวางตอรปโดที่กระชับกวาและตัวเรือยาวกวา การปรับปรุงระบบควบคุมการยิงทําใหมีขีดความสามารถในการโจมตีดีขึ้นดวยปนขนาด 5"/38 และมีทอตอรปโดแนวกึ่งกลางลํา 12 ทอ"
 #USA_destroyer_2b: "Benson & Gleaves Class"
 USA_destroyer_3: "ชั้น Fletcher"
 USA_destroyer_3_desc: "ชั้น Fletcher เปนกาวกระโดดครั้งใหญดานขีดความสามารถของเรือพิฆาต โดยสวนใหญมาจากการเพิ่มขนาดเปน 2500 ตัน แมจะคงปนอเนกประสงค 5"/38 และการจัดวางตอรปโดแนวกึ่งกลางลําไว แตชั้นนี้เพิ่มปอมเดี่ยวอีกหนึ่งปอม และไดรับอาวุธตอสูอากาศยานเพิ่มขึ้นอยางมาก รวมถึงพิสัยที่ดีขึ้นและระวางขับนํ้าที่มากขึ้น"
 USA_destroyer_4: "ชั้น Allen M Sumner"
 USA_destroyer_4_desc: "ชั้น Sumner สานตอจากชั้น Fletcher โดยเพิ่มระวางขับนํ้าเพียงเล็กนอย เรือสามารถติดอาวุธไดมากขึ้น ไดปนแฝดขนาด 5"/38 และอาวุธตอสูอากาศยานจํานวนมากขึ้นอยางมาก การเพิ่มหางเสือที่สองชวยใหการหลบหลีกระหวางปฏิบัติการตอตานเรือดํานํ้าดีขึ้น"
 USA_light_cruiser_1: "ชั้น Omaha"
 USA_light_cruiser_1_desc: "ชั้น Omaha เดิมออกแบบมาเพื่อทําหนาที่สอดแนมสําคัญในกองเรือของกองทัพเรือสหรัฐฯ ยุคสงครามโลกครั้งที่ 1 เปนเรือชั้นที่เร็วและมีขีดความสามารถ ติดอาวุธอันนาเกรงขามดวยปนขนาด 6"/53 ในการจัดวางแบบปอมเดี่ยว 8 ปอมและปอมแฝด 2 ปอม พรอมเครื่องยิงตอรปโดหกเครื่อง ชั้น Omaha มีอายุมากแลว แตเปนกําลังสวนใหญของกองเรือลาดตระเวนเบาของกองทัพเรือสหรัฐฯ"
 USA_light_cruiser_2: "ชั้น Brooklyn"
 USA_light_cruiser_2_desc: "ชั้น Brooklyn ออกแบบโดยคํานึงถึงสนธิสัญญานาวีวอชิงตัน จึงถูกจํากัดไวที่ปน 6" เพื่อใหอํานาจการยิงสูงสุด Brooklyn ติดปน Mk16 6" แบบใหม 15 กระบอกในปอมสามลํากลอง แบบเรือโดยรวมสมดุลมาก และถือเปนพื้นฐานของแบบเรือลาดตระเวนทั้งหมดในอนาคตของกองทัพเรือสหรัฐฯ"
 USA_light_cruiser_3: "ชั้น Cleveland"
 USA_light_cruiser_3_desc: "ชั้น Cleveland พัฒนาจากชั้น Brooklyn แตปราศจากขอจํากัดของสนธิสัญญานาวีวอชิงตัน ชั้น Cleveland คงการจัดวางปนหลัก 6" 12 กระบอกไว แตเพิ่มอาวุธรอง 5" อยางมาก และเพิ่มอาวุธตอสูอากาศยาน"
 USA_light_cruiser_4: "ชั้น Fargo"
 USA_light_cruiser_4_desc: "ชั้น Fargo ปรับปรุงจากชั้น Cleveland ที่ประสบความสําเร็จ ใหมุมยิงตอสูอากาศยานที่ดีขึ้นดวยโครงสรางสวนบนทรงพีระมิดที่ออกแบบไดดีกวา"
 USA_heavy_cruiser_1: "ชั้น Pensacola"
 USA_heavy_cruiser_1_desc: "ชั้น Pensacola ออกแบบภายใตขอจํากัดของสนธิสัญญานาวีวอชิงตัน และมุงใหอํานาจการยิงสูงสุดภายใตขอจํากัดปน 8" ติดอาวุธอันนาเกรงขามดวยปน 8"/55 จํานวน 10 กระบอก เกราะตัวเรือบาง และแบบเรือหนักสวนบน แตก็มีขีดความสามารถ เปนกําลังสวนใหญของกองเรือลาดตระเวนหนักของกองทัพเรือสหรัฐฯ"
 #USA_heavy_cruiser_1b: "Portland Class"
 USA_heavy_cruiser_2: "ชั้น Wichita"
 USA_heavy_cruiser_2_desc: "เรือชั้น Wichita ปรับปรุงอาวุธจากชั้น Pensacola และรุนยอย ดวยแบบปอมปนใหมสําหรับปนขนาด 8"55 และปรับปรุงมุมยิงของอาวุธรองซึ่งเปนปน 5"/38"
 USA_heavy_cruiser_3: "ชั้น Baltimore"
 USA_heavy_cruiser_3_desc: "ชั้น Baltimore รวบรวมองคประกอบที่ประสบความสําเร็จมากกวาของแบบเรือลาดตระเวนรุนกอนเขาดวยกัน โดยสวนใหญพัฒนาจากเรือลาดตระเวนเบาชั้น Brooklyn ผสานกับการจัดวางอาวุธและเกราะจาก USS Wichita"
 USA_heavy_cruiser_4: "ชั้น Oregon City"
 USA_heavy_cruiser_4_desc: "เรือลาดตระเวนชั้น Oregon City มีการปรับปรุงเล็กนอยในหลายดานจากชั้น Baltimore ที่โดดเดนที่สุดคือการเปลี่ยนโครงสรางสวนบน ซึ่งใหมุมยิงตอสูอากาศยานที่ดีขึ้น การปรับปรุงในทํานองเดียวกันยังพบไดจากเรือลาดตระเวนเบาชั้น Cleveland ไปสูชั้น Oregon City"
 USA_battle_cruiser_1: "ชั้น Lexington"
 USA_battle_cruiser_1_desc: "ชั้น Lexington เดิมเปนการตอบโตเรือลาดตระเวนประจัญบานชั้น Kongo ของญี่ปุน เรือถูกสั่งตอตามรัฐบัญญัตินาวีป 1916 โดยตั้งใจใหติดปน 16" ในปอมแฝดและทําความเร็วได 33 นอต หลังเริ่มการกอสราง สหรัฐฯ เขารวมสนธิสัญญานาวีวอชิงตัน และ USS Lexington กับ USS Saratoga ถูกดัดแปลงเปนเรือบรรทุกเครื่องบิน"
 USA_battle_cruiser_2: "ชั้น Alaska"
 USA_battle_cruiser_2_desc: "ชั้น Alaska เปนการตอบโตเรือประจัญบานกระเปาของเยอรมนี และยิ่งกวานั้นคือ "ซูเปอรเรือลาดตระเวน" ของญี่ปุน ออกแบบใหติดปน 12" และทนกระสุนไดถึงขนาด 10" เรือชั้นนี้ทําความเร็วไดระดับเรือลาดตระเวน แตตองแลกกับการปองกันใตนํ้า"
 USA_battleship_1: "ชั้น New York"
 USA_battleship_1_desc: "เรือประจัญบานชั้น New York เปนเรือประจัญบานสหรัฐฯ รุนแรกที่ติดปนหลักขนาด 14"/45 ปน 5"/51 จํานวนมากทําหนาที่เปนอาวุธรอง และมีเกราะหนากวา 10""
 #USA_battleship_1b: "Pennsylvania Class"
 #USA_battleship_1c: "New Mexico Class"
 USA_battleship_2: "ชั้น North Carolina"
 USA_battleship_2_desc: "ชั้น North Carolina เปนแบบเรือที่ทาทาย และเปนเรือประจัญบานชั้นแรกที่กองทัพเรือสหรัฐฯ สรางในรอบ 20 ป กองทัพเรือสหรัฐฯ กําหนดใหชั้นนี้ตองเปนไปตามมาตรฐานของสนธิสัญญานาวีวอชิงตัน คือจํากัดที่ 36,000 ตัน แตยังตองติดปนขนาด 16"/45 มีเกราะที่ดีขึ้น และสามารถคุมกันเรือบรรทุกเครื่องบินความเร็วสูงของกองทัพเรือสหรัฐฯ ได"
 #USA_battleship_2b: "South Dakota Class"
 USA_battleship_3: "ชั้น Iowa"
 USA_battleship_3_desc: "ชั้น Iowa รวมนวัตกรรมและขีดความสามารถทั้งหมดของ North Carolina รุนกอน แตเพิ่มระวางขับนํ้าและความเร็วทางยุทธวิธีอยางมาก เรือชั้น Iowa รับผิดชอบหลักในการคุมกันกลุมเรือบรรทุกเครื่องบิน และออกแบบโดยคํานึงถึงบทบาทรองในฐานะ "นักลาเรือลาดตระเวน""
 USA_battleship_4: "ชั้น Illinois"
 USA_battleship_4_desc: "ชั้น Illinois สานตอแบบเรือและบทบาทที่ชั้น Iowa กําหนดไว โดยใหความสําคัญกับความเร็วและอาวุธมากกวาเกราะ ชั้น Illinois เพิ่มจํานวนปนขนาด 16"/50 จาก 9 เปน 12 กระบอก พรอมปรับปรุงหมอนํ้าและเครื่องจักรเพื่อใหทําความเร็วเดินทางสูงไดอยางมีประสิทธิภาพมากขึ้น เชนเดียวกับชั้น Montana แบบแรกเริ่มมีปน 6" ในปอมแฝด 4 ปอม แตถูกเปลี่ยนกลับไปใชปอมแฝดปนอเนกประสงค 5" เพื่อเพิ่มขีดความสามารถในการตอสูอากาศยานใหสูงสุด"
 USA_carrier_1: "ชั้น Lexington"
 USA_carrier_1_desc: "เรือบรรทุกเครื่องบินชั้น Lexington เกิดจากการดัดแปลงตัวเรือของเรือลาดตระเวนประจัญบานชั้น Lexington สองลํา เพื่อใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน เปนเรือบรรทุกเครื่องบินชั้นแรกที่ปฏิบัติการไดในกองทัพเรือสหรัฐฯ และใชเวลาหลายปในการพัฒนาการปฏิบัติการของเรือบรรทุกเครื่องบิน"
 USA_carrier_2: "ชั้น Ranger"
 USA_carrier_2_desc: "ชั้น Ranger เปนเรือชั้นแรกของกองทัพเรือสหรัฐฯ ที่ออกแบบเปนเรือบรรทุกเครื่องบินตั้งแตกระดูกงู ในฐานะสวนหนึ่งของแนวคิดเรือบรรทุกเครื่องบินขนาดเล็กของกองทัพเรือสหรัฐฯ ชั้นนี้เล็กกวาชั้น Lexington รุนกอนมาก แตยังคงจํานวนกองบินเทาเดิมไดดวยการปรับปรุงการออกแบบภายใน"
 #USA_carrier_2b: "Yorktown Class"
 #USA_carrier_2c: "Wasp Class"
 USA_carrier_3: "ชั้น Essex"
 USA_carrier_3_desc: "ดวยบทเรียนจากชั้น Lexington, Ranger และรุนยอยของชั้น Yorktown กอนหนา ผลที่ไดคือชั้น Essex เรือความเร็วสูงที่บรรทุกเครื่องบินจํานวนมากเขาสูการรบได แบบการควบคุมความเสียหายยังไดรับการสืบทอดจากชั้น Yorktown และมีการติดตั้งลิฟตขอบดาดฟาเพื่อปรับปรุงการจัดการเครื่องบิน"
 USA_carrier_4: "ชั้น Midway"
 USA_carrier_4_desc: "ชั้น Midway คือสุดยอดขีดความสามารถของเรือบรรทุกเครื่องบินของกองทัพเรือสหรัฐฯ ดวยดาดฟาหุมเกราะและความสามารถบรรทุกเครื่องบินไดมากกวาชั้นกอนหนาอยางมาก ชั้น Midway จึงไดรับการกําหนดชั้นยอยเฉพาะวา CVB (Carrier Vessel Battle)"
 USA_SH_battleship_1: "ชั้น Virginia"
 USA_SH_battleship_1_desc: "ในป 1920 การกอสรางเรือประจัญบานขนาดใหญชั้น South Dakota ซึ่งติดปน 16"/50 จํานวน 12 กระบอกไดเริ่มขึ้น ชั้นนี้จะนําไปสูยุคใหมของการออกแบบเรือประจัญบานหนัก แตถูกยกเลิกในป 1922 เพื่อใหสอดคลองกับสนธิสัญญานาวีวอชิงตัน เมื่อสนธิสัญญาไมมีผลบังคับใชอีกตอไปและมีภัยคุกคามจากโครงการเรือประจัญบานลับของญี่ปุน เราสามารถปรับปรุงแบบเรือใหทันสมัย เพิ่มระวางขับนํ้าเปนกวา 55,000 ตัน และเพิ่มขนาดปนเปนปนขนาด 18"/50 เพื่อสรางเรือประจัญบานหนักชั้นใหม"
 USA_SH_battleship_2: "ชั้น Montana"
 USA_SH_battleship_2_desc: "ชั้น Montana ใหญกวาและมีเกราะมากกวาชั้น Illinois โดยแลกความเร็วเพื่อรองรับสิ่งที่เพิ่มขึ้น ดวยอาวุธหลักเปนปนขนาด 18"/50 จํานวน 12 กระบอก และระบบควบคุมการยิงลาสุดของเรา อํานาจการยิงของ Montana จะไมมีผูใดเทียบได แบบแรกเริ่มมีปน 6" แตถูกเปลี่ยนกลับไปใชปอมแฝดปนอเนกประสงค 5""
 ### ALB - ALBANIA -- all generic ###
 ### ARG - ARGENTINA ###
 ARG_submarine_1: "ชั้น Santa Fe"
 ARG_submarine_1_desc: "ชั้น Santa Fe คือเรือดํานํ้าสามลําที่สั่งตอจากอิตาลีและสงมอบใหอารเจนตินาในป 1933 เรือทั้งสามลําของชั้นนี้เปนกําลังหลักของกองเรือดํานํ้าอารเจนตินาจนถึงป 1960 ไดรับฉายาวา 'Tarantinos' ตามอูตอเรือในเมืองตารันโต อิตาลี ที่สรางเรือเหลานี้"
 ARG_destroyer_1: "ชั้น Catamarca"
 ARG_destroyer_1_desc: "เรือพิฆาตชั้น Catamarca สั่งตอโดยกองทัพเรืออารเจนตินาและสรางโดยสหราชอาณาจักรไมนานกอนสงครามโลกครั้งที่ 1 ติดปนหลักขนาด 120 มม./50 สี่กระบอก และทอตอรปโด 533 มม. สี่ทอ"
 #ARG_destroyer_1b: "Cervantes Class"
 ARG_destroyer_2: "ชั้น Buenos Aires"
 ARG_destroyer_2_desc: "เรือพิฆาตชั้น Buenos Aires สรางในสหราชอาณาจักรใหอารเจนตินาระหวางป 1936 ถึง 1938 พัฒนาจากเรือพิฆาตชั้น G ของอังกฤษ ระวางขับนํ้าเกิน 1300 ตัน และติดปนใหญ QF 4.7 นิ้ว Mark IX สี่กระบอกเปนปนหลัก"
 ARG_light_cruiser_1: "ชั้น Libertad"
 ARG_light_cruiser_1_desc: "เรือชั้น Libertad ไดรับการกําหนดเปน 'เรือประจัญบานลํานํ้า' แตแทจริงแลวเทียบไดกับเรือลาดตระเวนปองกันตัวที่เล็กกวาและติดอาวุธเบากวาในชวงตนทศวรรษ 1900 เรือสองลําของชั้นนี้สรางในปลายทศวรรษ 1890 และยังประจําการอยูเมื่อสงครามโลกครั้งที่ 2 เริ่มตน"
 ARG_light_cruiser_2: "ชั้น La Argentina"
 ARG_light_cruiser_2_desc: "เรือลาดตระเวนเบา La Argentina สรางใหอารเจนตินาโดยสหราชอาณาจักรในปลายทศวรรษ 1930 เรือออกเดินทางฝกหลายครั้งกอนสงคราม แตถูกจัดเขากองเรือประจําการเพื่อรักษาความเปนกลางของอารเจนตินา เรือเปนรุนขยายขนาดของชั้น Arethusa ของอังกฤษ ระวางขับนํ้า 6500 ตัน และติดปนใหญ 6 นิ้วเกากระบอกเปนปนหลัก"
 ARG_heavy_cruiser_1: "ชั้น Garibaldi"
 ARG_heavy_cruiser_1_desc: "ชั้น Garibaldi คือเรือลาดตระเวนหุมเกราะที่สรางใหอารเจนตินาราวชวงเปลี่ยนศตวรรษ ทั้งหมดลาสมัยภายในกลางทศวรรษ 1930 โดยลําสุดทายปลดประจําการภายในป 1932 และถูกแทนที่ในป 1931 ดวยเรือลาดตระเวนหนักชั้น Veinticinco de Mayo ที่สรางโดยอังกฤษ"
 #ARG_heavy_cruiser_1b: "Veinticinco de Mayo Class"
 ARG_battleship_1: "ชั้น Rivadavia"
 ARG_battleship_1_desc: "ชั้น Rivadavia คือเรือประจัญบานเดรดนอตคูหนึ่งที่สรางโดยสหรัฐฯ ใหกองทัพเรืออารเจนตินาในตนทศวรรษ 1910 ระวางขับนํ้า 27,500 ตัน และติดปนใหญขนาด 305 มม./50 สิบสองกระบอกเปนปนหลัก ประจําการจนถึงทศวรรษ 1950"
 ### AST - AUSTRALIA ###
 AST_submarine_1: "ชั้น L"
 AST_submarine_1_desc: "ชั้น L เปนเรือดํานํ้าขนาดกลางที่เดิมวางแผนภายใตโครงการสงครามฉุกเฉินในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางในชวงปลายสงครามโลกครั้งที่ 1 และติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น ประจําการจนถึงชวงเริ่มสงครามโลกครั้งที่ 2 ซึ่งสวนใหญถูกใชทําภารกิจรองและภารกิจฝก"
 AST_submarine_2: "ชั้น T"
 AST_submarine_2_desc: "เรือดํานํ้าชั้น T หรือชั้น Triton ออกแบบมาเพื่อทดแทนเรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าคอนขางใหญที่มีพิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้ติดอาวุธดี เปนแทนที่มีเสถียรภาพ และถูกใชงานอยางกวางขวางระหวางความขัดแยง โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายในสงคราม"
 AST_submarine_3: "ชั้น U"
 AST_submarine_3_desc: "ชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือก็ถูกเปลี่ยน ทําใหเรือดํานํ้าเหลานี้พิสูจนตัววามีประโยชนในนานนํ้าแคบของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงจํากัด ชั้นนี้ประกอบดวยสามชั้นยอย ไดแก Undine, Umpire และ Uproar"
 AST_submarine_4: "ชั้น V"
 AST_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้น Vampire พัฒนาจากเรือขนาดเล็กชั้น U รุนกอน เรือใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้น แตพิสัยปฏิบัติการและอาวุธจํากัด"
 AST_destroyer_1: "ชั้น Vendetta"
 AST_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของ Admiralty และ Thornycroft ซึ่งถูกโอนใหกองทัพเรือออสเตรเลียเพื่อจัดตั้ง 'กองเรือเศษเหล็ก' สรางภายใตโครงการสงครามฉุกเฉิน เปนวิวัฒนาการขั้นสุดทายของแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่ 1 รวมการปรับปรุงจากรุนกอนและความกาวหนาทางเทคโนโลยีใหม เรือเหลานี้สรางขึ้นจํานวนมากในชวงปลายสงครามโลกครั้งที่ 1 และกลายเปนกําลังหลักของกองเรือพิฆาตราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือถูกจัดเขากองเรือสํารอง และในที่สุดถูกลดบทบาทไปทําภารกิจคุมกันขบวนเรือลําเลียง เปนเรือที่เร็ว ติดอาวุธเพียงพอ และมีพิสัยดี"
 AST_destroyer_2: "ชั้น G/H/I"
 AST_destroyer_2_desc: "เรือพิฆาตชั้น G, H และ I ถูกสั่งตอเปนสวนหนึ่งของโครงการตอเรือป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าชั้น F กอนหนาโดยลดขนาดลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยทั้งสองใชปน 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล อาวุธเพียงพอ และมีตอรปโดจํานวนมาก ถูกใชงานอยางกวางขวางในสงครามและสูญเสียไปจํานวนมาก"
 #AST_destroyer_2b: "Arunta Class"
 AST_destroyer_3: "ชั้น Nizam"
 AST_destroyer_3_desc: "ชั้น Nizam คือชื่อเรียกของเรือพิฆาตชั้น J, K และ N ที่โอนมาจากราชนาวี เรือคลายชั้น Tribal รุนกอน แตแทนที่จะเนนอาวุธปน นักออกแบบกลับไปใชการจัดวางมาตรฐานที่มีตอรปโดหนักและปนเบากวา เรือไดรับการดัดแปลงตลอดชวงประจําการในสงคราม รวมถึงปนตอสูอากาศยานและเรดารที่ปรับปรุงแลว เปนเรือที่เร็ว พิสัยไกล และอาวุธดี เหมาะอยางยิ่งสําหรับการคุมกันกองเรือ"
 AST_destroyer_4: "ชั้น Battle"
 AST_destroyer_4_desc: "เรือพิฆาตชั้น Battle ตอยอดจากวิวัฒนาการของเรือพิฆาตอังกฤษที่ใชตลอดสงคราม เรือถูกสั่งตอเปนสวนหนึ่งของโครงการนาวีป 1942 และ 1943 ติดอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถตอตานเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรืออเนกประสงค"
 #AST_destroyer_4b: "Tobruk Class"
 AST_light_cruiser_1: "ชั้น C"
 AST_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบายี่สิบแปดลําของราชนาวี สรางกอนและระหวางสงครามโลกครั้งที่ 1 สําหรับสภาพอันโหดรายของทะเลเหนือ เรือพิสูจนแลววาทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธเกินกวาที่นาพอใจ เพราะติดปน 6 นิ้วมากพอจะตอสูเปาหมายผิวนํ้าของขาศึก และบรรทุกตอรปโดจํานวนมาก เรือถูกใชงานอยางกวางขวางในสงครามโลกครั้งที่ 1 และเขารวมการรบผิวนํ้าหลายครั้ง เมื่อถึงกลางทศวรรษ 1930 เหลือเพียงชั้นยอย Caledon, Ceres และ Carlisle ที่ยังประจําการ"
 #AST_light_cruiser_1c: "Sydney Class"
 AST_light_cruiser_2: "ชั้น Southampton"
 AST_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้น Southampton เปนชั้นยอยของเรือลาดตระเวนชั้น Town และออกแบบมาเพื่อรับมือเรือลาดตระเวนชั้น Mogami ของญี่ปุน เรือเหลานี้มีเกราะดี ความเร็วและพิสัยดี และติดอาวุธอันนาเกรงขามดวยปน 6 นิ้วสิบสองกระบอกในปอมสามลํากลองสี่ปอม เปนพื้นฐานของแบบเรือลาดตระเวนเบาของราชนาวีในยามสงครามหลายแบบที่ตามมา"
 AST_light_cruiser_3: "ชั้น Crown Colony"
 AST_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้น Crown Colony เปนรุนปรับปรุงของชั้น Town กอนหนา แตใชแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือติดปนแบบเดียวกับรุนกอน คือปอมสามลํากลองสี่ปอมติดปน 6 นิ้ว มีเกราะใกลเคียงกัน แตเพราะเครื่องยนตเล็กลง พิสัยจึงลดลงบาง แบบนี้มีสองชั้นยอย คือ Fiji และ Ceylon"
 AST_light_cruiser_4: "ชั้น Minotaur"
 AST_light_cruiser_4_desc: "หรือที่รูจักในชื่อชั้น Swiftsure เรือลาดตระเวนเหลานี้ออกแบบเปนรุนดัดแปลงของชั้น Crown Colony โดยรวมการดัดแปลงยามสงครามที่ไดรับอนุมัติในป 1941 มีพิสัยปฏิบัติการไกลกวาและอาวุธตอสูอากาศยานมากกวาชั้น Crown Colony ขณะที่อาวุธหลักลดลงเหลือปอมสามลํากลองสามปอม"
 AST_heavy_cruiser_1: "ชั้น Hawkins"
 AST_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้น Hawkins เปนเรือลาดตระเวนหนักรุนแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้น Town รุนกอน โดยเฉพาะชั้นยอย Birmingham แตติดปน 7.5 นิ้วและสายเกราะที่หนากวา ออกแบบมาเพื่อตอสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี มีอาวุธดี ความเร็วและพิสัยพอสมควร และการปองกันที่ดี มีเรือเขาประจําการทั้งหมดหาลํา แตมีเพียงสี่ลําที่ยังประจําการเมื่อสงครามโลกครั้งที่ 2 เริ่มตน"
 #AST_heavy_cruiser_1b: "Canberra Class"
 AST_heavy_cruiser_2: "ชั้น Surrey"
 AST_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้น Surrey ถูกเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้น York กอนหนา หากสรางเสร็จ เรือจะติดปอมปนแฝด 8 นิ้วสี่ปอม เกราะหนักขึ้น และเครื่องยนตทรงพลังยิ่งขึ้น มีการสั่งตอสองลํา แตไมมีลําใดไดวางกระดูกงู"
 AST_heavy_cruiser_3: "ชั้น Admiral"
 AST_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้น Admiral (อยาสับสนกับเรือลาดตระเวนประจัญบานชั้น Admiral) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนติดปน 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และจบในป 1941 ไดขอเสนอหลายแบบ ขอเสนอสุดทายมีปน 8 นิ้วแบบใหมในปอมสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วที่ดี การขาดเรือลาดตระเวนของขาศึกและความคุมคาของเรือเหลานี้ทําใหหันไปมุงสรางเรือลาดตระเวนเบาเพิ่มขึ้นแทน"
 AST_heavy_cruiser_4: "แบบเชอรชิลล"
 AST_heavy_cruiser_4_desc: "เรือเหลานี้ไดรับการเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกระทรวงทหารเรือ ในชวงตนของสงครามโลกครั้งที่สองเพื่อรับมือกับเรือลาดตระเวนปนใหญชั้นดอยชลันทของเยอรมนี เรือเหลานี้จะติดปนใหญขนาด 9.2 นิ้ว ปนตอสูอากาศยานหนัก และเกราะแข็งแรง โดยออกแบบมาเพื่อตอกรกับเรือหลักของขาศึกไดอยางมีประสิทธิภาพ ทายที่สุดโครงการถูกยกเลิกเนื่องจากตนทุนสูงและความตองการเรือลาดตระเวนหนักลําใหมมีไมมากพอ"
 AST_battle_cruiser_1: "ชั้นรีโนวน"
 AST_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้นรีโนวนเดิมทีวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้นรีเวนจ การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่หนึ่งปะทุขึ้น กอนที่พลเรือเอกลอรดฟชเชอรจะผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบาน เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานอยางแทจริง มีอาวุธครบครัน รวดเร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากเรือสามลําที่วางแผนไวแตแรก มีเพียงสองลําคือรีพัลสและรีโนวนที่สรางเสร็จ"
 AST_battle_cruiser_2: "ชั้นพรินเซสรอยัล"
 AST_battle_cruiser_2_desc: "พรินเซสรอยัลเปนเรือลาดตระเวนประจัญบานสมมุติที่เร็วกวาและถูกกวาเรือประจัญบานชั้นคิงจอรจที่ 5 เรือเหลานี้ติดอาวุธคลายกันแตลดจํานวนลงทั้งสําหรับการรบผิวนํ้าและการตอสูอากาศยาน ไดแก ปอมปนสามลํากลองขนาด 14 นิ้วสองปอม และปนตอสูอากาศยานแฝดขนาด 5.25 นิ้วหกปอม ความเร็วสูงและพิสัยไกลจะทําใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 AST_battleship_1: "ชั้นรีเวนจ"
 AST_battleship_1_desc: "เรือประจัญบานชั้นรีเวนจไดรับคําสั่งตอในป 1913 ในฐานะรุนราคาถูกของเรือเดรดนอตเร็วชั้นควีนเอลิซาเบธ แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหเรือเหลานี้ถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่สอง จากที่วางแผนไว 8 ลํา มีเพียง 5 ลําที่สรางเสร็จ"
 AST_battleship_2: "ชั้นคิงจอรจที่ 5"
 AST_battleship_2_desc: "เรือประจัญบานชั้นคิงจอรจที่ 5 เปนผลมาจากสนธิสัญญานาวีวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและขนาดปนของเรือหลัก ดวยเหตุนี้เรือชั้นนี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้นควีนเอลิซาเบธที่เกาแลว"
 AST_battleship_3: "ชั้นไลออน"
 AST_battleship_3_desc: "เรือประจัญบานชั้นไลออนเปนเรือชั้นถัดมาจากเรือประจัญบานคิงจอรจที่ 5 โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้นรีเวนจที่เกาลง แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบปะทุขึ้น เรือเหลานี้โดยรวมจะคลายกับชั้นคิงจอรจ แตมีอาวุธหลักหนักกวา โดยใชปนใหญขนาด 16 นิ้วแบบใหม อีกทั้งยังมีเกราะหนาขึ้นและเครื่องยนตทรงพลังกวา"
 AST_battleship_4: "ชั้นแวนการด"
 AST_battleship_4_desc: "เรือประจัญบานชั้นแวนการดเปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวี มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาสรางเพิ่มอีกสี่ลําสําหรับยุทธบริเวณแปซิฟก เรือไดรับคําสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ทําใหมีเสถียรภาพและความสามารถในการเดินทะเลยอดเยี่ยม อาวุธเหมือนกับเรือประจัญบานชั้นควีนเอลิซาเบธและรีเวนจ ใหอํานาจการยิงสูง เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือรวดเร็วและไดรับการปองกันอยางดี"
 AST_SH_battleship_1: "ชั้นเซนจูเรียน"
 AST_SH_battleship_1_desc: "เซนจูเรียนเปนเรือประจัญบานหนักสมมุติของราชนาวีที่สรางขึ้นเพื่อรับมือกับเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาดใหญ 18 นิ้วและเกราะหนาทําใหเรือมีอํานาจการยิงและการปองกันที่จําเปนในการตอกรกับเรือเหลานั้น อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีลวนจําเปนตอการครอบคลุมนานนํ้าอันกวางใหญของจักรวรรดิบริติช"
 AST_SH_battleship_2: "ชั้นไลออน II"
 AST_SH_battleship_2_desc: "เรือประจัญบานชั้นไลออน II ออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้นไลออนรุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จจะติดปอมปนสามลํากลองขนาด 16 นิ้วแบบลาสุดสามหรือสี่ปอม แผนเกราะหนาชวยปกปองเรือจากศัตรูทั้งบนผิวนํ้าและทางอากาศ ตนทุนการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการถูกยกเลิกไป"
 AST_carrier_1: "ชั้นเคอเรจัส"
 AST_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวี การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือเหลานี้มีเกราะปานกลางแตติดอาวุธดี พิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลงจึงบรรทุกอากาศยานไดจํากัด อยางไรก็ตาม เรือเหลานี้ไดมอบประสบการณสําคัญแกราชนาวีในการสรางเรือบรรทุกเครื่องบินและการใชกําลังทางอากาศของกองเรือ"
 AST_carrier_2: "ชั้นอารกรอยัล"
 AST_carrier_2_desc: "เรือบรรทุกเครื่องบินอารกรอยัลเปนเรือลําแรกในประเภทนี้ที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน และเปนเรือลําแรกที่โรงเก็บเครื่องบินและดาดฟาบินเปนสวนหนึ่งของตัวเรือ เรือนี้ออกแบบในป 1934 มีเกราะและอาวุธที่ดี บรรทุกอากาศยานไดจํานวนมาก และมีพิสัยปฏิบัติการกับความเร็วเพียงพอที่จะเคลื่อนที่ไปพรอมกับกําลังหลักของราชนาวี"
 AST_carrier_3: "ชั้นอิลลัสเทรียส"
 AST_carrier_3_desc: "เรือชั้นอิลลัสเทรียสออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน นี่เปนเรือบรรทุกเครื่องบินลําแรกของอังกฤษที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหขนาดกองบินลดลง เกราะหนาและอาวุธตอสูอากาศยานชวยปองกันเรืออยางแข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหมีพิสัยปฏิบัติการไกล"
 AST_carrier_4: "ชั้นอิมพลาเคเบิล"
 AST_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นอิมพลาเคเบิลไดรับคําสั่งตอภายใตโครงการนาวีป 1938 และโดยพื้นฐานคือรุนปรับปรุงของชั้นอิลลัสเทรียส สงครามและการเปลี่ยนลําดับความสําคัญไปที่เรือขนาดเล็กสําหรับคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงครามทําใหการกอสรางลาชา เรือเหลานี้มีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้น โดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาทําใหมีความเร็วและพิสัยปฏิบัติการมากกวาชั้นอิลลัสเทรียส"
 ### BEL - BELGIUM -- all generic ###
 ### BRA - BRAZIL ###
 BRA_submarine_1: "ชั้นอูไมตา"
 BRA_submarine_1_desc: "เรือดํานํ้าอูไมตาของบราซิลสั่งซื้อจากอิตาลีและสงมอบในปลายทศวรรษ 1920 ออกแบบโดยดัดแปลงจากชั้นบาลิลลา ซึ่งเปนเรือดํานํ้าสําหรับดํานํ้าลึกในทะเลเปด มีระวางขับนํ้าเกือบ 1,400 ตัน และติดทอตอรปโดขนาด 533 มม. หกทอ"
 BRA_submarine_2: "ชั้นตูป"
 BRA_submarine_2_desc: "ชั้นตูปเปนเรือดํานํ้าของบราซิลที่อิตาลีสรางในชวงกลางทศวรรษ 1930 เปนเรือดํานํ้าขนาดเล็ก ระวางขับนํ้าราว 600 ตันเศษ และติดตอรปโดขนาด 533 มม. หกทอ"
 BRA_destroyer_1: "ชั้นมารันเยา"
 BRA_destroyer_1_desc: "มารันเยาเปนเรือพิฆาตชั้น K ที่อังกฤษสรางและขายใหบราซิลในป 1922 มีระวางขับนํ้าราว 930 ตันเศษ และติดปนขนาด 4 นิ้วสี่กระบอก"
 BRA_destroyer_2: "ชั้นจูรูเอนา"
 BRA_destroyer_2_desc: "เรือพิฆาตชั้นจูรูเอนาเปนเรือพิฆาตชั้น H จํานวนหกลําที่บราซิลสั่งตอจากสหราชอาณาจักรในปลายทศวรรษ 1930 อยางไรก็ตาม เรือเหลานี้ไมเคยไดรับการสงมอบ เนื่องจากอังกฤษเรียกเกณฑไปใชเมื่อสงครามปะทุในป 1939 เรือมีระวางขับนํ้ากวา 1,300 ตัน ความเร็วดี และติดปนใหญ QF 4.7 นิ้ว Mk IX สามกระบอกเปนปนหลัก พรอมทอตอรปโดขนาด 533 มม. แปดทอ"
 BRA_destroyer_3: "ชั้นมารซีลีอู ดีอัส"
 BRA_destroyer_3_desc: "เรือพิฆาตชั้นมารซีลีอู ดีอัส (บางครั้งเรียกวาชั้น M หรือชั้นกรีนฮาลก) เปนเรือสามลําของกองทัพเรือบราซิลที่เขาประจําการในป 1943 ออกแบบตามเรือพิฆาตชั้นมาฮันของสหรัฐฯ และเปนเรือขนาดใหญลําแรกๆ ที่สรางในบราซิล มีระวางขับนํ้า 1,500 ตัน และติดปนหลักขนาด 5 นิ้ว/38 คาลิเบอรหากระบอก"
 BRA_destroyer_4: "ชั้นอากรี"
 BRA_destroyer_4_desc: "ชั้นอากรี (บางครั้งเรียกวาชั้นอามาโซนัส) คือเรือพิฆาตหกลําที่สรางใหกองทัพเรือบราซิล ไมมีลําใดสรางเสร็จกอนสงครามสิ้นสุด เรือเหลานี้สรางในบราซิลโดยใชแบบของอังกฤษที่ดัดแปลงและยุทโธปกรณบางสวนจากสหรัฐฯ เพื่อทดแทนเรือพิฆาตชั้นจูรูเอนาหกลําที่อังกฤษเรียกเกณฑไปเมื่อเริ่มสงคราม"
 BRA_light_cruiser_1: "ชั้นบาเอีย"
 BRA_light_cruiser_1_desc: "ชั้นบาเอียเปนเรือลาดตระเวนสอดแนมสองลําที่อังกฤษสรางใหบราซิลและสงมอบในป 1910 เรือไดรับการปรับปรุงและทําใหทันสมัยอยางมากในทศวรรษ 1920 แตเมื่อถึงตนสงครามโลกครั้งที่สองก็ยังถือวาคอนขางลาสมัย ระหวางสงคราม เรือลาดตระเวนเหลานี้ทําหนาที่คุมกันขบวนเรือลําเลียงเปนหลัก"
 BRA_battleship_1: "ชั้นมีนัสเชไรส"
 BRA_battleship_1_desc: "มีนัสเชไรสเปนเรือประจัญบานเดรดนอตสองลําที่สหราชอาณาจักรสรางใหบราซิลในชวงตนทศวรรษ 1900 เรือยังประจําการอยูในสงครามโลกครั้งที่สอง แตลาสมัยเกินกวาจะทําภารกิจจริงจังใดๆ จึงถูกใชเปนเรือปองกันชายฝงตามแนวชายฝงบราซิลแทน"
 ### BUL - BULGARIA -- all generic ###
 ### CAN - CANADA ###
 CAN_submarine_1: "ชั้น L"
 CAN_submarine_1_desc: "เรือดํานํ้าชั้น L เปนเรือขนาดกลางที่เดิมวางแผนไวภายใตโครงการสงครามฉุกเฉินในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางขึ้นในชวงทายของสงครามโลกครั้งที่หนึ่ง และติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น เรือเหลานี้ประจําการจนถึงตนสงครามโลกครั้งที่สอง ซึ่งสวนใหญใชในภารกิจรองและการฝก"
 CAN_submarine_2: "ชั้น T"
 CAN_submarine_2_desc: "เรือดํานํ้าชั้น T หรือชั้นไทรทันออกแบบมาเพื่อทดแทนเรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าคอนขางใหญ พิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้มีอาวุธดีและเปนแทนยิงที่มั่นคง ถูกใชงานอยางกวางขวางระหวางสงคราม โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายไปในสงคราม"
 CAN_submarine_3: "ชั้น U"
 CAN_submarine_3_desc: "เรือดํานํ้าชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือก็ถูกปรับเปลี่ยน ทําใหเรือดํานํ้าเหลานี้มีประโยชนในนานนํ้าแคบของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงมีจํากัด เรือชั้นนี้แบงเปนสามชั้นยอย ไดแก อันดีน อัมไพร และอัปโรร"
 CAN_submarine_4: "ชั้น V"
 CAN_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้นแวมไพรพัฒนาจากเรือขนาดเล็กชั้น U รุนกอน มีขนาดใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้น แตพิสัยปฏิบัติการและอาวุธยังจํากัด"
 CAN_destroyer_1: "ชั้น V/W"
 CAN_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของกระทรวงทหารเรือและของธอรนีครอฟต สรางภายใตโครงการสงครามฉุกเฉิน ถือเปนวิวัฒนาการขั้นสุดทายของการออกแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่หนึ่ง โดยรวมขอปรับปรุงของรุนกอนหนาเขากับความกาวหนาทางเทคโนโลยีใหมๆ มีการสรางเรือเหลานี้จํานวนมากในชวงทายของสงครามโลกครั้งที่หนึ่ง และกลายเปนกําลังหลักของหมวดเรือพิฆาตราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือเหลานี้ถูกโอนเขากองเรือสํารอง และทายที่สุดถูกลดบทบาทไปทําหนาที่คุมกันขบวนเรือลําเลียง เปนเรือที่มีอาวุธเพียงพอ รวดเร็ว และพิสัยดี"
 #CAN_destroyer_1b: "Saguenay Class"
 CAN_destroyer_2: "ชั้นออตตาวา"
 CAN_destroyer_2_desc: "ชั้นออตตาวาเปนชื่อเรียกของแคนาดาสําหรับเรือพิฆาตชั้น G, H และ I ของอังกฤษที่สั่งตอภายใตโครงการกอสรางนาวีป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าของชั้น F กอนหนา แตลดขนาดลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยทั้งคูใชปนขนาด 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล อาวุธเพียงพอ และติดตอรปโดไดมาก ถูกใชงานอยางกวางขวางระหวางสงครามและสูญเสียไปหลายลํา"
 #CAN_destroyer_2b: "Athabaskan Class"
 CAN_destroyer_3: "ชั้น J/K/N"
 CAN_destroyer_3_desc: "ชั้น J, K และ N คลายกับชั้นไทรบัลรุนกอน แตแทนที่จะเนนอาวุธปน ผูออกแบบกลับไปใชการจัดวางแบบมาตรฐานที่เนนตอรปโดหนักและปนเบากวา เรือไดรับการดัดแปลงตลอดชวงประจําการในสงคราม การปรับปรุงรวมถึงปนตอสูอากาศยานที่ดีขึ้นและเรดาร เปนเรือที่รวดเร็ว พิสัยไกล และอาวุธดี เหมาะอยางยิ่งสําหรับคุมกันกองเรือ"
 CAN_destroyer_4: "ชั้นอัลกองควิน"
 CAN_destroyer_4_desc: "ชั้นอัลกองควินเปนชื่อเรียกของแคนาดาสําหรับเรือพิฆาตชั้นแบทเทิลของอังกฤษ เรือไดรับคําสั่งตอภายใตโครงการนาวีป 1942 และ 1943 มีอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถในการปราบเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรืออเนกประสงค แตการเขาสูสงครามที่ลาชาทําใหมีบทบาทเพียงเล็กนอย"
 CAN_light_cruiser_1: "ชั้น C"
 CAN_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบายี่สิบแปดลําของราชนาวี สรางกอนและระหวางสงครามโลกครั้งที่หนึ่งเพื่อรับมือกับสภาพทะเลเหนือที่โหดราย เรือเหลานี้พิสูจนวาทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธนาพอใจเกินคาด เพราะติดปนขนาด 6 นิ้วมากพอจะสูกับเปาหมายผิวนํ้าของขาศึกและบรรทุกตอรปโดจํานวนมาก เรือถูกใชงานอยางกวางขวางในสงครามโลกครั้งที่หนึ่งและเขารวมการรบผิวนํ้าหลายครั้ง เมื่อถึงกลางทศวรรษ 1930 เหลือเพียงชั้นยอยแคลิดอน ซีรีส และคารไลลที่ยังประจําการอยู"
 CAN_light_cruiser_2: "ชั้นเซาแทมปตัน"
 CAN_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้นเซาแทมปตันเปนชั้นยอยของเรือลาดตระเวนชั้นทาวน ออกแบบมาเพื่อรับมือกับเรือลาดตระเวนชั้นโมงามิของญี่ปุน เรือเหลานี้มีเกราะดี ความเร็วและพิสัยดี และติดอาวุธทรงพลังคือปนขนาด 6 นิ้วสิบสองกระบอกในปอมปนสามลํากลองสี่ปอม เรือชั้นนี้เปนพื้นฐานของแบบเรือลาดตระเวนเบาในยามสงครามของราชนาวีอีกหลายแบบในเวลาตอมา"
 CAN_light_cruiser_3: "ชั้นควิเบก"
 CAN_light_cruiser_3_desc: "ชั้นควิเบกเปนชื่อเรียกของแคนาดาสําหรับเรือลาดตระเวนเบาชั้นคราวนโคโลนีของอังกฤษ ซึ่งเปนรุนปรับปรุงของชั้นทาวน แตมีแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือติดปนแบบเดียวกับรุนกอน คือปนขนาด 6 นิ้วในปอมปนสามลํากลองสี่ปอม มีเกราะใกลเคียงกัน แตดวยเครื่องยนตที่เล็กกวา พิสัยจึงลดลงบาง เรือแบบนี้มีสองชั้นยอย คือฟจิและซีลอน"
 CAN_light_cruiser_4: "ชั้นออนแทรีโอ"
 CAN_light_cruiser_4_desc: "ชั้นออนแทรีโอเปนชื่อเรียกของแคนาดาสําหรับเรือลาดตระเวนเบาชั้นไมโนทอร (หรือชั้นสวิฟตชัวร) ของอังกฤษ เรือลาดตระเวนเหลานี้ออกแบบโดยดัดแปลงจากชั้นคราวนโคโลนี โดยนําการปรับปรุงในยามสงครามที่อนุมัติในป 1941 มาใช มีพิสัยปฏิบัติการไกลกวาและอาวุธตอสูอากาศยานมากกวาชั้นคราวนโคโลนี ขณะที่อาวุธหลักลดลงเหลือปอมปนสามลํากลองสามปอม"
 CAN_heavy_cruiser_1: "ชั้นฮอวกินส"
 CAN_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้นฮอวกินสเปนเรือลาดตระเวนหนักรุนแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้นทาวนรุนกอน โดยเฉพาะชั้นยอยเบอรมิงแฮม แตติดปนขนาด 7.5 นิ้วและสายเกราะที่หนากวา ออกแบบมาเพื่อสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี เรือมีอาวุธดี ความเร็วและพิสัยพอใช และการปองกันที่ดี รวมแลวมีการขึ้นระวางประจําการหาลํา แตมีเพียงสี่ลําที่ยังประจําการเมื่อเริ่มสงครามโลกครั้งที่สอง"
 CAN_heavy_cruiser_2: "ชั้นเซอรรีย"
 CAN_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้นเซอรรียไดรับการเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้นยอรกรุนกอน หากสรางเสร็จจะติดปอมปนแฝดขนาด 8 นิ้วสี่ปอม เกราะหนักขึ้น และเครื่องยนตทรงพลังกวา มีการสั่งตอสองลํา แตไมมีลําใดไดวางกระดูกงู"
 CAN_heavy_cruiser_3: "ชั้นแอดมิรัล"
 CAN_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้นแอดมิรัล (อยาสับสนกับเรือลาดตระเวนประจัญบานชั้นแอดมิรัล) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนที่ติดปนขนาด 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และสิ้นสุดในป 1941 ไดขอเสนอออกมาหลายแบบ ขอเสนอสุดทายประกอบดวยปนขนาด 8 นิ้วแบบใหมในปอมปนสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วดี การที่ขาศึกมีเรือลาดตระเวนไมมากและความคุมคาของเรือเหลานี้ ทําใหหันไปมุงสรางเรือลาดตระเวนเบาเพิ่มแทน"
 CAN_heavy_cruiser_4: "แบบเชอรชิลล"
 CAN_heavy_cruiser_4_desc: "เรือเหลานี้ไดรับการเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกระทรวงทหารเรือ ในชวงตนของสงครามโลกครั้งที่สองเพื่อรับมือกับเรือลาดตระเวนปนใหญชั้นดอยชลันทของเยอรมนี เรือเหลานี้จะติดปนใหญขนาด 9.2 นิ้ว ปนตอสูอากาศยานหนัก และเกราะแข็งแรง โดยออกแบบมาเพื่อตอกรกับเรือหลักของขาศึกไดอยางมีประสิทธิภาพ ทายที่สุดโครงการถูกยกเลิกเนื่องจากตนทุนสูงและความตองการเรือลาดตระเวนหนักลําใหมมีไมมากพอ"
 CAN_battle_cruiser_1: "ชั้นรีโนวน"
 CAN_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้นรีโนวนเดิมทีวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้นรีเวนจ การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่หนึ่งปะทุขึ้น กอนที่พลเรือเอกลอรดฟชเชอรจะผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบาน เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานอยางแทจริง มีอาวุธครบครัน รวดเร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากเรือสามลําที่วางแผนไวแตแรก มีเพียงสองลําคือรีพัลสและรีโนวนที่สรางเสร็จ"
 CAN_battle_cruiser_2: "ชั้นพรินเซสรอยัล"
 CAN_battle_cruiser_2_desc: "พรินเซสรอยัลเปนเรือลาดตระเวนประจัญบานสมมุติที่เร็วกวาและถูกกวาเรือประจัญบานชั้นคิงจอรจที่ 5 เรือเหลานี้ติดอาวุธคลายกันแตลดจํานวนลงทั้งสําหรับการรบผิวนํ้าและการตอสูอากาศยาน ไดแก ปอมปนสามลํากลองขนาด 14 นิ้วสองปอม และปนตอสูอากาศยานแฝดขนาด 5.25 นิ้วหกปอม ความเร็วสูงและพิสัยไกลจะทําใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 CAN_battleship_1: "ชั้นรีเวนจ"
 CAN_battleship_1_desc: "เรือประจัญบานชั้นรีเวนจไดรับคําสั่งตอในป 1913 ในฐานะรุนราคาถูกของเรือเดรดนอตเร็วชั้นควีนเอลิซาเบธ แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหเรือเหลานี้ถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่สอง จากที่วางแผนไว 8 ลํา มีเพียง 5 ลําที่สรางเสร็จ"
 CAN_battleship_2: "ชั้นคิงจอรจที่ 5"
 CAN_battleship_2_desc: "เรือประจัญบานชั้นคิงจอรจที่ 5 เปนผลมาจากสนธิสัญญานาวีวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและขนาดปนของเรือหลัก ดวยเหตุนี้เรือชั้นนี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้นควีนเอลิซาเบธที่เกาแลว"
 CAN_battleship_3: "ชั้นไลออน"
 CAN_battleship_3_desc: "เรือประจัญบานชั้นไลออนเปนเรือชั้นถัดมาจากเรือประจัญบานคิงจอรจที่ 5 โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้นรีเวนจที่เกาลง แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบปะทุขึ้น เรือเหลานี้โดยรวมจะคลายกับชั้นคิงจอรจ แตมีอาวุธหลักหนักกวา โดยใชปนใหญขนาด 16 นิ้วแบบใหม อีกทั้งยังมีเกราะหนาขึ้นและเครื่องยนตทรงพลังกวา"
 CAN_battleship_4: "ชั้นแวนการด"
 CAN_battleship_4_desc: "เรือประจัญบานชั้นแวนการดเปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวี มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาสรางเพิ่มอีกสี่ลําสําหรับยุทธบริเวณแปซิฟก เรือไดรับคําสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ทําใหมีเสถียรภาพและความสามารถในการเดินทะเลยอดเยี่ยม อาวุธเหมือนกับเรือประจัญบานชั้นควีนเอลิซาเบธและรีเวนจ ใหอํานาจการยิงสูง เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือรวดเร็วและไดรับการปองกันอยางดี"
 CAN_SH_battleship_1: "ชั้นเซนจูเรียน"
 CAN_SH_battleship_1_desc: "เซนจูเรียนเปนเรือประจัญบานหนักสมมุติของราชนาวีที่สรางขึ้นเพื่อรับมือกับเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาดใหญ 18 นิ้วและเกราะหนาทําใหเรือมีอํานาจการยิงและการปองกันที่จําเปนในการตอกรกับเรือเหลานั้น อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีลวนจําเปนตอการครอบคลุมนานนํ้าอันกวางใหญของจักรวรรดิบริติช"
 CAN_SH_battleship_2: "ชั้นไลออน II"
 CAN_SH_battleship_2_desc: "เรือประจัญบานชั้นไลออน II ออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้นไลออนรุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จจะติดปอมปนสามลํากลองขนาด 16 นิ้วแบบลาสุดสามหรือสี่ปอม แผนเกราะหนาชวยปกปองเรือจากศัตรูทั้งบนผิวนํ้าและทางอากาศ ตนทุนการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการถูกยกเลิกไป"
 CAN_carrier_1: "ชั้นเคอเรจัส"
 CAN_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวี การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือเหลานี้มีเกราะปานกลางแตติดอาวุธดี พิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลงจึงบรรทุกอากาศยานไดจํากัด อยางไรก็ตาม เรือเหลานี้ไดมอบประสบการณสําคัญแกราชนาวีในการสรางเรือบรรทุกเครื่องบินและการใชกําลังทางอากาศของกองเรือ"
 CAN_carrier_2: "ชั้นอารกรอยัล"
 CAN_carrier_2_desc: "เรือบรรทุกเครื่องบินอารกรอยัลเปนเรือลําแรกในประเภทนี้ที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน และเปนเรือลําแรกที่โรงเก็บเครื่องบินและดาดฟาบินเปนสวนหนึ่งของตัวเรือ เรือนี้ออกแบบในป 1934 มีเกราะและอาวุธที่ดี บรรทุกอากาศยานไดจํานวนมาก และมีพิสัยปฏิบัติการกับความเร็วเพียงพอที่จะเคลื่อนที่ไปพรอมกับกําลังหลักของราชนาวี"
 CAN_carrier_3: "ชั้นอิลลัสเทรียส"
 CAN_carrier_3_desc: "เรือชั้นอิลลัสเทรียสออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน นี่เปนเรือบรรทุกเครื่องบินลําแรกของอังกฤษที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหขนาดกองบินลดลง เกราะหนาและอาวุธตอสูอากาศยานชวยปองกันเรืออยางแข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหมีพิสัยปฏิบัติการไกล"
 CAN_carrier_4: "ชั้นอิมพลาเคเบิล"
 CAN_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นอิมพลาเคเบิลไดรับคําสั่งตอภายใตโครงการนาวีป 1938 และโดยพื้นฐานคือรุนปรับปรุงของชั้นอิลลัสเทรียส สงครามและการเปลี่ยนลําดับความสําคัญไปที่เรือขนาดเล็กสําหรับคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงครามทําใหการกอสรางลาชา เรือเหลานี้มีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้น โดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาทําใหมีความเร็วและพิสัยปฏิบัติการมากกวาชั้นอิลลัสเทรียส"
 ### CHI - NATIONALIST CHINA ###
 CHI_destroyer_1: "ชั้นเจี้ยนเวย"
 CHI_destroyer_1_desc: "ชั้นเจี้ยนเวยเปนเรือตอรปโดขนาดใหญที่สรางใหกองทัพเรือจีนคณะชาติและเขาประจําการในป 1904 เรือสองลําในชั้นนี้ไดรับการปรับปรุงใหทันสมัยและยังประจําการอยูเมื่อญี่ปุนบุกจีน หลังปรับปรุงมีระวางขับนํ้า 870 ตัน และติดปนหลักขนาด 4.7 นิ้วสองกระบอก"
 CHI_light_cruiser_1: "ชั้นไหหรง"
 CHI_light_cruiser_1_desc: "ไหหรงเปนเรือลาดตระเวนปองกันของจีนที่เยอรมนีสรางในปลายทศวรรษ 1890 เรือนี้คลายกับเรือลาดตระเวนปองกันและเรือลาดตระเวนเบาลําอื่นๆ ที่ผลิตใหจีนในชวงเปลี่ยนศตวรรษ ไหหรงมีระวางขับนํ้าเกือบ 2,700 ตัน และติดปน QF ขนาด 5.9 นิ้วสามกระบอก"
 ### CHL - CHILE ###
 CHL_submarine_1: "ชั้น H"
 CHL_submarine_1_desc: "เรือดํานํ้าเหลานี้คือเรือดํานํ้าชั้น H หรือฮอลแลนด 602 ของอังกฤษจํานวนหกลํา สรางในสหราชอาณาจักรและโอนใหชิลีไมนานหลังสงครามโลกครั้งที่หนึ่ง เพื่อชดเชยเรือดํานํ้าที่ถูกยึดไวระหวางสงคราม เรือสรางขึ้นระหวางป 1915 ถึง 1918 มีระวางขับนํ้ากวา 360 ตัน ดําไดลึก 30 เมตร และติดทอตอรปโดขนาด 450 มม. สี่ทอ"
 #CHL_submarine_1b: "Capitán O`Brien Class"
 CHL_destroyer_1: "ชั้นอัลมีรันเต ลินช"
 CHL_destroyer_1_desc: "เรือพิฆาตชั้นอัลมีรันเต ลินชเปนกลุมเรือหกลําที่สรางในสหราชอาณาจักรใหกองทัพเรือชิลีกอนสงครามโลกครั้งที่หนึ่งไมนาน มีเพียงสองลําที่สงมอบกอนสงครามปะทุและประจําการจนถึงป 1945 เรือมีระวางขับนํ้า 1,430 ตัน ความเร็วและพิสัยดีพอสมควรสําหรับยุคของมัน และติดปนหลัก QF 4 นิ้ว L/40 Mark VI หกกระบอกกับทอตอรปโดขนาด 21 นิ้วสองทอ"
 #CHL_destroyer_1b: "Serrano Class"
 CHL_light_cruiser_1: "ชั้นชากาบูโก"
 CHL_light_cruiser_1_desc: "ชากาบูโกเปนเรือลาดตระเวนปองกันที่สรางในอังกฤษและเขาประจําการในกองทัพเรือชิลีในป 1902 มีระวางขับนํ้า 4,160 ตัน ติดปนหลักอารมสตรองขนาด 8 นิ้วสองกระบอกและทอตอรปโดขนาด 18 นิ้วสามทอ เรือแลนชาแตมีเกราะดีเมื่อเทียบกับเรือลาดตระเวนเบารุนแรกๆ"
 CHL_heavy_cruiser_1: "ชั้นโอฮิกกินส"
 CHL_heavy_cruiser_1_desc: "โอฮิกกินสเปนเรือลาดตระเวนหุมเกราะที่สรางในอังกฤษใหกองทัพเรือชิลีในชวงตนศตวรรษที่ 20 มีระวางขับนํ้า 7,800 ตัน ติดปนขนาด 8 นิ้ว 45 คาลิเบอรสี่กระบอกเปนอาวุธหลัก แตคอนขางชาเมื่อเทียบกับเรือลาดตระเวนหนักที่สรางหลังสงครามโลกครั้งที่หนึ่ง"
 CHL_battleship_1: "ชั้นอัลมีรันเต ลาตอรเร"
 CHL_battleship_1_desc: "ชั้นอัลมีรันเต ลาตอรเรประกอบดวยเรือประจัญบานซูเปอรเดรดนอตสองลําที่สรางในอังกฤษใหกองทัพเรือชิลีเมื่อสงครามโลกครั้งที่หนึ่งปะทุ มีเพียงลําเดียวที่สรางเสร็จเปนเรือประจัญบาน สวนอีกลําถูกดัดแปลงเปนเรือบรรทุกเครื่องบิน HMS Eagle เรือมีระวางขับนํ้ากวา 28,000 ตัน อาวุธหลักคือปน BL ขนาด 14 นิ้ว/45 คาลิเบอรสิบกระบอก มีเกราะนอยกวาแตเร็วกวาเรือเดรดนอตลําอื่นในยุคเดียวกันเล็กนอย"
 ### COL - COLOMBIA ###
 COL_destroyer_2: "ชั้นอันตีโอเกีย"
 COL_destroyer_2_desc: "ชั้นอันตีโอเกียประกอบดวยเรือพิฆาตสองลําที่สรางในโปรตุเกสใหกองทัพเรือโคลอมเบีย เรือเขาประจําการในป 1934 มีระวางขับนํ้ากวา 1,200 ตัน และติดปน BL ขนาด 4.7 นิ้วสี่กระบอกกับทอตอรปโดขนาด 533 มม. แปดทอ"
 ### DEN - DENMARK ###
 DEN_submarine_1: "ชั้นโรทา"
 DEN_submarine_1_desc: "เรือดํานํ้าชั้นโรทาสรางและเขาประจําการในเดนมารกหลังสงครามโลกครั้งที่หนึ่งสิ้นสุดลง เปนเรือดํานํ้าขนาดเล็กที่พัฒนาจากแบบฮอลแลนด 602 มีระวางขับนํ้า 290 ตัน และติดทอตอรปโดขนาด 450 มม. สี่ทอ"
 DEN_submarine_2: "ชั้นเฮาเมนเนน"
 DEN_submarine_2_desc: "ชั้นเฮาเมนเนนประกอบดวยเรือดํานํ้าที่วางแผนไวหาลํา สามลําสรางเสร็จกอนเยอรมนีเขายึดครอง หนึ่งลําสรางเสร็จระหวางการยึดครอง และลําที่หาถูกยกเลิก เรือดํานํ้าเหลานี้คอนขางเล็ก มีระวางขับนํ้า 320 ตัน และติดทอตอรปโดขนาด 450 มม. หาทอ"
 DEN_submarine_4: "ชั้นสเตอเรน"
 DEN_submarine_4_desc: "สเตอเรนเปนเรือดํานํ้าชั้นแวมไพรของอังกฤษที่โอนใหกองทัพเรือเดนมารกหลังสงคราม เรือคอนขางเล็ก มีระวางขับนํ้า 545 ตัน แตมีทอตอรปโดขนาด 533 มม. สี่ทอและความสามารถในการเดินทะเลที่ดี"
 DEN_destroyer_4: "ชั้นฮวิตเฟลต"
 DEN_destroyer_4_desc: "ชั้นฮวิตเฟลต หรือที่รูจักกันในชื่อชั้นนายาเดน ประกอบดวยเรือตอรปโดขนาดใหญสองลําที่สรางและเขาประจําการในเดนมารก การกอสรางเริ่มในป 1942 และแลวเสร็จในป 1947 เรือมีระวางขับนํ้ากวา 780 ตัน ติดปนขนาด 105 มม. สองกระบอกเปนอาวุธหลัก พรอมทอตอรปโดขนาด 533 มม. หกทอ และอาวุธปราบเรือดํานํ้าหลายแบบ"
 DEN_heavy_cruiser_1: "ชั้นแฮรลุฟ ทรอลเลอ"
 DEN_heavy_cruiser_1_desc: "ชั้นแฮรลุฟ ทรอลเลอคือเรือประจัญบานปองกันชายฝงหุมเกราะสามลําที่เขาประจําการระหวางป 1901 ถึง 1908 แมจะจัดเปนเรือประจัญบาน แตขนาดและอาวุธใกลเคียงกับเรือลาดตระเวนมากกวา เมื่อเริ่มสงครามโลกครั้งที่สองเหลือเพียงลําเดียวคือปเดอร สกรัมที่ยังประจําการ เรือมีระวางขับนํ้ากวา 3,700 ตัน ติดปนขนาด 240 มม./K43 สองกระบอกเปนอาวุธหลัก และมีเกราะดี แมจะชากวาเรือประจัญบานเดรดนอตสวนใหญในยุคเดียวกัน"
 ### DOM - DOMINICAN REPUBLIC -- all generic ###
 ### ECU - ECUADOR -- all generic ###
 ### EST - ESTONIA ###
 EST_submarine_2: "ชั้นคาเลฟ"
 EST_submarine_2_desc: "ชั้นคาเลฟประกอบดวยเรือดํานํ้าสองลําที่สรางในสหราชอาณาจักรใหกองทัพเรือเอสโตเนียในป 1936 ภารกิจหลักคือการวางทุนระเบิด แตก็ติดทอตอรปโดขนาด 533 มม. สี่ทอดวย"
 ### FIN - FINLAND ###
 FIN_heavy_cruiser_1: "ชั้นไวแนเมิยเนน"
 FIN_heavy_cruiser_1_desc: "ชั้นไวแนเมิยเนนประกอบดวยเรือประจัญบานปองกันชายฝงสองลําที่สรางและเขาประจําการในฟนแลนดในชวงตนทศวรรษ 1930 นับเปนเรือปองกันชายฝงกลุมสุดทายที่เคยสรางขึ้น แมขนาดและอาวุธจะใกลเคียงกับเรือลาดตระเวนหนักมากกวา เรือมีระวางขับนํ้าเพียง 3,900 ตันและคอนขางชา แตติดปนโบฟอรสขนาด 254 มม./45 คาลิเบอรสี่กระบอก"
 FIN_submarine_1: "ชั้นเวเตฮิเนน"
 FIN_submarine_1_desc: "ชั้นเวเตฮิเนนประกอบดวยเรือดํานํ้าขนาดกลางสามลําที่สรางใหกองทัพเรือฟนแลนด พัฒนาจากเรือดํานํ้า UB III ของเยอรมนีในยุคสงครามโลกครั้งที่หนึ่ง มีระวางขับนํ้าเกือบ 500 ตัน และติดทอตอรปโดขนาด 533 มม. สี่ทอ"
 ### GRE - GREECE ###
 GRE_submarine_1: "ชั้นคัตโซนิส"
 GRE_submarine_1_desc: "เรือดํานํ้าชั้นคัตโซนิสสรางในฝรั่งเศสใหกองทัพเรือกรีซในปลายทศวรรษ 1920 เรือทั้งสองลําในชั้นนี้ประจําการในสงครามโลกครั้งที่สอง มีระวางขับนํ้าเกือบ 580 ตัน และติดทอตอรปโดขนาด 533 มม. หกทอ"
 GRE_submarine_2: "ชั้นมาโตรซอส"
 GRE_submarine_2_desc: "เรือดํานํ้ามาโตรซอสของกรีซเดิมคือเรือดํานํ้าชั้นแปรลาของอิตาลีที่อังกฤษยึดไดและโอนใหกองทัพเรือกรีซพลัดถิ่นในป 1942 เรือดํานํ้านี้มีระวางขับนํ้า 680 ตัน ติดทอตอรปโดขนาด 533 มม. หกทอ และดําไดลึก 80 เมตร"
 GRE_submarine_4: "ชั้นปปโนส"
 GRE_submarine_4_desc: "เรือสี่ลําในชั้นปปโนสคือเรือดํานํ้าชั้น U ของอังกฤษที่โอนใหกองทัพเรือกรีซพลัดถิ่นระหวางป 1943 ถึง 1946 เรือมีระวางขับนํ้า 545 ตัน และติดทอตอรปโดขนาด 533 มม. สี่ทอ"
 GRE_destroyer_1: "ชั้นแอโตส"
 GRE_destroyer_1_desc: "เรือพิฆาตชั้นแอโตสสรางในอังกฤษและซื้อใหกองทัพเรือกรีซกอนสงครามโลกครั้งที่หนึ่ง ทั้งสี่ลํายังประจําการในสงครามโลกครั้งที่สอง เรือมีระวางขับนํ้า 980 ตัน ติดปนอารมสตรอง P ขนาด 105 มม./40 สี่กระบอกและทอตอรปโดขนาด 533 มม. สี่ทอ และไดรับการปรับปรุงใหทันสมัยในปลายทศวรรษ 1920"
 #GRE_destroyer_1b: "Hydra Class"
 GRE_destroyer_2: "ชั้นวาซิเลฟส เยออรยิออสที่ 1"
 GRE_destroyer_2_desc: "ชั้นวาซิเลฟส เยออรยิออสที่ 1 เปนเรือพิฆาตชั้น H ของอังกฤษแบบดัดแปลงสองลําที่สรางในสหราชอาณาจักรใหกองทัพเรือกรีซในปลายทศวรรษ 1930 เรือมีระวางขับนํ้า 1,350 ตัน ความเร็วดีพอสมควร พิสัยไกล ติดปน SK C/34 ขนาด 128 มม./42 สี่กระบอก และติดตอรปโดไดมาก"
 GRE_destroyer_3: "ชั้นอาเดรียส"
 GRE_destroyer_3_desc: "ชั้นอาเดรียสเปนเรือพิฆาตคุมกันชั้นฮันต III ของอังกฤษหกลํา ซึ่งสี่ลําในนั้นโอนใหกองทัพเรือกรีซพลัดถิ่นในป 1942 ในฐานะเรือพิฆาตคุมกัน เรือจึงชากวาเรือพิฆาตมาตรฐาน มีระวางขับนํ้า 1,050 ตัน ติดปน QF Mk XVI ขนาด 102 มม./45 สี่กระบอกเปนอาวุธหลัก และมีตอรปโดกับยุทโธปกรณปราบเรือดํานํ้าจํานวนมาก"
 GRE_destroyer_4: "ชั้นเลออน"
 GRE_destroyer_4_desc: "ชั้นเลออนคือเรือพิฆาตคุมกันชั้นแคนนอนของสหรัฐฯ เขาประจําการในป 1943 แตไมไดสงมอบใหกองทัพเรือกรีซจนถึงป 1951 เรือชากวาเรือพิฆาตมาตรฐาน มีระวางขับนํ้า 1,240 ตัน ติดปนขนาด 3 นิ้ว/40 คาลิเบอรสามกระบอกเปนอาวุธหลัก พรอมตอรปโดและยุทโธปกรณปราบเรือดํานํ้าจํานวนมาก"
 GRE_light_cruiser_1: "ชั้นเอลลี"
 GRE_light_cruiser_1_desc: "เอลลีเปนเรือลาดตระเวนเบาที่สหรัฐฯ สรางในป 1914 เดิมตั้งใจสรางใหกองทัพเรือจีน แตทายที่สุดสงมอบใหกรีซ เรือมีขนาดเล็กสําหรับเรือลาดตระเวน ระวางขับนํ้าเพียง 2,600 ตัน ติดปนขนาด 152 มม./45 คาลิเบอรสองกระบอกเปนอาวุธหลัก เรือประจําการในสงครามโลกครั้งที่สองและถูกเรือดํานํ้าอิตาลีจมกอนที่ฝายอักษะจะบุกกรีซ"
 GRE_heavy_cruiser_1: "ชั้นแอเวรอฟ"
 GRE_heavy_cruiser_1_desc: "แอเวรอฟเปนเรือลาดตระเวนหุมเกราะที่สรางในอิตาลีใหกองทัพเรือกรีซกอนสงครามโลกครั้งที่หนึ่ง และประจําการตลอดสงครามโลกครั้งที่สองในฐานะเรือธงของกองเรือ แอเวรอฟทรงพลังมากเมื่อเทียบกับเรือลาดตระเวนในยุคเดียวกัน ดวยระวางขับนํ้าเกือบ 10,000 ตัน มีเกราะดีมากและอาวุธหลักคือปนอารมสตรองขนาด 234 มม./45 สี่กระบอก ถึงกระนั้นก็ยังคอนขางเร็วสําหรับเรือลาดตระเวนหุมเกราะ"
 GRE_battleship_1: "ชั้นคิลคิส"
 GRE_battleship_1_desc: "ชั้นคิลคิสประกอบดวยเรือประจัญบานชั้นมิสซิสซิปปของสหรัฐฯ สองลําที่เขาประจําการในป 1908 และขายใหกรีซในป 1914 เปนเรือประจัญบานกอนยุคเดรดนอตรุนสุดทายที่สหรัฐฯ สราง มีระวางขับนํ้าเพียง 13,000 ตัน และติดปน Mk V ขนาด 10 นิ้ว/45 คาลิเบอรสี่กระบอกเปนอาวุธหลัก อาวุธ ความเร็ว และพิสัยอยูในระดับกลางสําหรับยุคของมัน ทั้งสองลําปลดประจําการภายในป 1936"
 ### HOL - NETHERLANDS ###
 HOL_submarine_1: "ชั้น K-III"
 HOL_submarine_1_desc: "ชั้น K-III ประกอบดวยเรือดํานํ้าสองลําที่สรางใหและใชงานโดยราชนาวีเนเธอรแลนดในฐานะเรือดํานํ้าลาดตระเวน เขาประจําการในชวงตนทศวรรษ 1920 และพัฒนาจากเรือดํานํ้าชั้นฮอลแลนดของสหรัฐฯ แตละลํามีระวางขับนํ้ากวา 580 ตัน และติดทอตอรปโดขนาด 450 มม. สี่ทอ"
 #HOL_submarine_1b: "K-XIV Class"
 HOL_submarine_2: "ชั้น O16"
 HOL_submarine_2_desc: "เรือดํานํ้า O16 ผลิตและเขาประจําการในเนเธอรแลนดใหราชนาวีเนเธอรแลนดในป 1936 เปนเรือดํานํ้าขนาดใหญ ระวางขับนํ้ากวา 980 ตัน ดําไดลึก 80 เมตร และติดทอตอรปโดขนาด 533 มม. แปดทอ"
 HOL_submarine_3: "ชั้น O21"
 HOL_submarine_3_desc: "ชั้น O21 ประกอบดวยเรือดํานํ้าเจ็ดลําที่เนเธอรแลนดสรางและนําเขาประจําการ ทุกลํายังสรางไมเสร็จเมื่อเยอรมนีบุก แตหาลําสามารถหนีไปอังกฤษและรับใชกองทัพเรือเนเธอรแลนดพลัดถิ่นได เรือดํานํ้าเหลานี้ใหญกวาเรือดํานํ้าชั้น O กอนหนาเล็กนอย ระวางขับนํ้ากวา 990 ตัน แตติดอาวุธแบบเดียวกันคือทอตอรปโดขนาด 533 มม. แปดทอ"
 HOL_submarine_4: "ชั้นซวารดฟส"
 HOL_submarine_4_desc: "ชั้นซวารดฟสคือเรือดํานํ้าชั้นทาซิเทิรนของอังกฤษสี่ลําที่โอนใหราชนาวีเนเธอรแลนดพลัดถิ่นระหวางป 1943 ถึง 1945 เรือมีระวางขับนํ้า 1,090 ตัน ติดทอตอรปโดขนาด 533 มม. สิบเอ็ดทอ และดําไดลึกกวา 100 เมตร"
 HOL_destroyer_1: "ชั้นฟนเคนต"
 HOL_destroyer_1_desc: "ชั้นฟนเคนต หรือชั้นแอดมิราเลิน ประกอบดวยเรือพิฆาตแปดลําที่สรางใหราชนาวีเนเธอรแลนดระหวางป 1926 ถึง 1931 พัฒนาจากเรือชั้น A ของอังกฤษรุนแรกๆ ทุกลําไดรบในสงครามโลกครั้งที่สองและถูกจมเองหรือถูกจม เรือมีระวางขับนํ้ากวา 1,300 ตัน ติดปนขนาด 120 มม. สี่กระบอก และมีความเร็วดีพอสมควรสําหรับยุคของมัน"
 HOL_destroyer_3: "ชั้นคาลเลินบืรค"
 HOL_destroyer_3_desc: "ชั้นเครารด คาลเลินบืรควางแผนสรางเรือพิฆาตสี่ลําใหราชนาวีเนเธอรแลนด ทั้งสี่ลําปลอยลงนํ้ากอนเยอรมนีบุก แตสรางเสร็จเพียงสองลํา ลําหนึ่งโดยอังกฤษหลังหนีไปอังกฤษได และอีกลําโดยเยอรมนี เรือพิฆาตเหลานี้มีระวางขับนํ้ากวา 1,600 ตัน ติดปนขนาด 120 มม. หากระบอกเปนอาวุธหลัก พรอมทอตอรปโดขนาด 533 มม. แปดทอ และมีความเร็วดี"
 HOL_destroyer_4: "ชั้นปต ไฮน"
 HOL_destroyer_4_desc: "ชั้นปต ไฮนประกอบดวยเรือพิฆาตชั้น S ของอังกฤษสามลําที่โอนใหราชนาวีเนเธอรแลนดไมนานหลังสงคราม เรือมีระวางขับนํ้ากวา 1,800 ตัน ติดปน QF Mk IX ขนาด 120 มม./45 สี่กระบอก และมีอาวุธปราบเรือดํานํ้าหลากหลาย"
 HOL_light_cruiser_1: "ชั้นชวา"
 HOL_light_cruiser_1_desc: "เนเธอรแลนดนําเรือลาดตระเวนเบาชั้นชวาสองลําเขาประจําการในชวงกลางทศวรรษ 1920 เรือออกแบบในเยอรมนีแตสรางในเนเธอรแลนด มีระวางขับนํ้าเกือบ 6,700 ตัน อาวุธหลักคือปนโบฟอรสขนาด 150 มม. สิบกระบอก มีเกราะบางและความเร็วดีพอสมควรสําหรับยุคของมัน"
 HOL_light_cruiser_2: "ชั้นเดอไรเตอร"
 HOL_light_cruiser_2_desc: "เรือลาดตระเวนเบาเดอไรเตอรสรางและเขาประจําการในเนเธอรแลนดชวงกลางทศวรรษ 1930 ประจําการสวนใหญในหมูเกาะอินเดียตะวันออกของเนเธอรแลนด มีระวางขับนํ้ากวา 6,500 ตัน และติดปนขนาด 150 มม. เจ็ดกระบอกเปนอาวุธหลัก ความเร็วตํ่ากวาเกณฑเฉลี่ยแตพิสัยดี"
 HOL_light_cruiser_3: "ชั้นทรมป"
 HOL_light_cruiser_3_desc: "ชั้นทรมปประกอบดวยเรือลาดตระเวนเบาคอนขางเล็กสองลําที่เขาประจําการใหเนเธอรแลนดกอนเยอรมนีบุกไมนาน ทั้งสองลําประจําการในตะวันออกไกลและรอดพนสงคราม มีระวางขับนํ้าเพียง 3,350 ตัน และตามแบบเดิมติดปนขนาด 150 มม. หกกระบอกเปนอาวุธหลัก"
 HOL_light_cruiser_4: "ชั้นเดอเซเวนโปรวินซีเอิน"
 HOL_light_cruiser_4_desc: "ชั้นเดอเซเวนโปรวินซีเอินประกอบดวยเรือลาดตระเวนสองลําที่วางกระดูกงูกอนเยอรมนีบุกไมนาน แตสรางเสร็จในป 1951 แบบสุดทายดัดแปลงจากแผนเดิมป 1939 ไดเรือสองลําที่มีระวางขับนํ้ากวา 12,000 ตัน ติดปนใหญโบฟอรสขนาด 152 มม. แปดกระบอก มีเกราะดีสําหรับเรือลาดตระเวนเบาและพิสัยดี"
 HOL_heavy_cruiser_1: "ชั้นซูราบายา"
 HOL_heavy_cruiser_1_desc: "เรือลาดตระเวนซูราบายาของเนเธอรแลนด เดิมชื่อเดอเซเวนโปรวินซีเอิน เปนเรือปองกันชายฝง ('panterschip') ที่สรางและเขาประจําการในเนเธอรแลนดกอนสงครามโลกครั้งที่หนึ่ง มีระวางขับนํ้ากวา 6,500 ตัน ติดปนขนาด 280 มม. สองกระบอกและ 150 มม. สี่กระบอกเปนอาวุธหลัก ประจําการในสงครามโลกครั้งที่สองจนถูกเครื่องบินทิ้งระเบิดของญี่ปุนจมในป 1942"
 ### IRE - IRELAND -- all generic ###
 ### LAT - LATVIA ###
 LAT_submarine_1: "ชั้นโรนิส"
 LAT_submarine_1_desc: "ชั้นโรนิสประกอบดวยเรือดํานํ้าสองลําที่สรางในฝรั่งเศสใหกองทัพเรือลัตเวีย เขาประจําการในป 1927 เปนเรือขนาดเล็ก ระวางขับนํ้าเพียง 390 ตัน และติดทอตอรปโดขนาด 533 มม. หกทอ"
 ### LIT - LITHUANIA -- all generic ###
 ### MEX - MEXICO ###
 MEX_destroyer_1: "ชั้นกัวนาวาโต"
 MEX_light_cruiser_1: "ชั้นโปรเกรโซ"
 MEX_heavy_cruiser_1: "ชั้นอานาวัก"
 ### NOR - NORWAY ###
 NOR_submarine_1: "ชั้น B"
 NOR_submarine_1_desc: "เรือดํานํ้าชั้น B ของนอรเวยคือเรือดํานํ้าแบบฮอลแลนดของอเมริกาที่สรางในนอรเวยใหกองทัพเรือนอรเวย เรือหกลําในชั้นนี้เขาประจําการระหวางป 1923 ถึง 1930 มีระวางขับนํ้า 420 ตัน ติดทอตอรปโดขนาด 450 มม. สี่ทอ และดําไดลึก 60 เมตร"
 NOR_submarine_3: "ชั้นอูเรดด"
 NOR_submarine_3_desc: "ชั้นอูเรดดประกอบดวยเรือดํานํ้าชั้น U ของอังกฤษสองลําที่สรางใหกองทัพเรือนอรเวยพลัดถิ่นระหวางป 1941 ถึง 1943 เรือมีระวางขับนํ้า 540 ตัน ติดทอตอรปโดขนาด 533 มม. สี่ทอ มีเรดารและโซนารของอังกฤษครบครัน และดําไดลึก 60 เมตร"
 NOR_submarine_4: "ชั้นอุตซีรา"
 NOR_submarine_4_desc: "ชั้นอุตซีราประกอบดวยเรือดํานํ้าชั้นแวมไพรของอังกฤษสี่ลํา สรางระหวางป 1943 ถึง 1944 แตมีเพียงลําเดียวที่โอนใหกองทัพเรือนอรเวยพลัดถิ่นกอนสงครามสิ้นสุด เรือปรับปรุงจากชั้น U กอนหนาเพียงเล็กนอย มีระวางขับนํ้า 545 ตัน ติดทอตอรปโดขนาด 533 มม. สี่ทอ และดําไดลึก 90 เมตร"
 NOR_destroyer_1: "ชั้นเดรา"
 NOR_destroyer_1_desc: "เรือพิฆาตชั้นเดราสี่ลําเปนเรือพิฆาตชั้นแรกที่มีหลายลําซึ่งสรางใหราชนาวีนอรเวย เขาประจําการกอนสงครามโลกครั้งที่หนึ่งไมนาน มีระวางขับนํ้า 580 ตัน ติดปน QF ของอังกฤษขนาด 3 นิ้วสามกระบอกเปนอาวุธหลัก อยางไรก็ตาม เรือคอนขางชา แมเทียบกับเรือพิฆาตในยุคเดียวกัน"
 NOR_destroyer_2: "ชั้นสไลปเนอร"
 NOR_destroyer_2_desc: "ชั้นสไลปเนอรเปนเรือตอรปโดขนาดใหญที่สรางในนอรเวยใหราชนาวีนอรเวย และเขาประจําการระหวางป 1937 ถึง 1939 ตางจากชั้นเดรารุนกอน ชั้นสไลปเนอรมีอาวุธและยุทโธปกรณปราบเรือดํานํ้าคอนขางดี มีระวางขับนํ้า 735 ตัน และความเร็วดีพอสมควรสําหรับขนาดของมัน"
 NOR_destroyer_3: "ชั้นโอเลซุนด"
 NOR_destroyer_3_desc: "ชั้นโอเลซุนดประกอบดวยเรือพิฆาตสองลําที่วางกระดูกงูในป 1939 แตไมไดสรางเสร็จกอนเยอรมนีเขายึดครอง หากสรางเสร็จ เรือเหลานี้จะเปนเรือพิฆาตลําแรกของนอรเวยที่มีขนาดเทียบเทาเรือพิฆาตของชาติมหาอํานาจสวนใหญ ดวยระวางขับนํ้ากวา 1,200 ตัน ตามแผนจะติดปนใหญโบฟอรสขนาด 120 มม./40 สี่กระบอกและทอตอรปโดขนาด 533 มม. สี่ทอ"
 NOR_destroyer_4: "ชั้นสตูร"
 NOR_destroyer_4_desc: "ชั้นสตูรประกอบดวยเรือพิฆาตชั้น S ของอังกฤษสี่ลําที่สรางใหราชนาวีนอรเวยพลัดถิ่นระหวางป 1943 ถึง 1944 มีระวางขับนํ้าเกือบ 1,800 ตัน ติดปน QF Mk IX ขนาด 120 มม./45 สี่กระบอกเปนอาวุธหลัก พรอมทอตอรปโดขนาด 533 มม. แปดทอ และยุทโธปกรณปราบเรือดํานํ้ากับเรดารที่ดีพอสมควร อีกทั้งยังมีความเร็วและความนาเชื่อถือที่ดี"
 NOR_heavy_cruiser_1: "ชั้นนอรเก"
 NOR_heavy_cruiser_1_desc: "นอรเกเปนเรือปองกันชายฝงที่สรางในอังกฤษใหนอรเวยในชวงเปลี่ยนศตวรรษ อาวุธซึ่งมีปนขนาด 210 มม. สองกระบอกเปนหลักนั้นเทียบไดกับเรือลาดตระเวนหนัก แตขนาดซึ่งมีระวางขับนํ้าราว 4,200 ตันเศษนั้นใกลเคียงเรือลาดตระเวนเบามากกวา สวนความเร็วเทียบไดกับเรือประจัญบานเดรดนอต เปนหนึ่งในเรือปองกันชายฝงสี่ลําในยุคนั้นที่ยังรับใชราชนาวีนอรเวยอยูเมื่อเริ่มสงครามโลกครั้งที่สอง"
 ### NZL - NEW ZEALAND ###
 NZL_submarine_1: "ชั้น L"
 NZL_submarine_1_desc: "เรือดํานํ้าชั้น L เปนเรือขนาดกลางที่เดิมวางแผนไวภายใตโครงการสงครามฉุกเฉินในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางขึ้นในชวงทายของสงครามโลกครั้งที่หนึ่ง และติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น เรือเหลานี้ประจําการจนถึงตนสงครามโลกครั้งที่สอง ซึ่งสวนใหญใชในภารกิจรองและการฝก"
 NZL_submarine_2: "ชั้น T"
 NZL_submarine_2_desc: "เรือดํานํ้าชั้น To หรือชั้นไทรทันออกแบบมาเพื่อทดแทนเรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าคอนขางใหญ พิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้มีอาวุธดีและเปนแทนยิงที่มั่นคง ถูกใชงานอยางกวางขวางระหวางสงคราม โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายไปในสงคราม"
 NZL_submarine_3: "ชั้น U"
 NZL_submarine_3_desc: "เรือดํานํ้าชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือก็ถูกปรับเปลี่ยน ทําใหเรือดํานํ้าเหลานี้มีประโยชนในนานนํ้าแคบของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงมีจํากัด เรือชั้นนี้แบงเปนสามชั้นยอย ไดแก อันดีน อัมไพร และอัปโรร"
 NZL_submarine_4: "ชั้น V"
 NZL_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้นแวมไพรพัฒนาจากเรือขนาดเล็กชั้น U รุนกอน มีขนาดใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้น แตพิสัยปฏิบัติการและอาวุธยังจํากัด"
 NZL_destroyer_1: "ชั้น V/W"
 NZL_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของกระทรวงทหารเรือและของธอรนีครอฟต สรางภายใตโครงการสงครามฉุกเฉิน ถือเปนวิวัฒนาการขั้นสุดทายของการออกแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่หนึ่ง โดยรวมขอปรับปรุงของรุนกอนหนาเขากับความกาวหนาทางเทคโนโลยีใหมๆ มีการสรางเรือเหลานี้จํานวนมากในชวงทายของสงครามโลกครั้งที่หนึ่ง และกลายเปนกําลังหลักของหมวดเรือพิฆาตราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือเหลานี้ถูกโอนเขากองเรือสํารอง และทายที่สุดถูกลดบทบาทไปทําหนาที่คุมกันขบวนเรือลําเลียง เปนเรือที่มีอาวุธเพียงพอ รวดเร็ว และพิสัยดี"
 NZL_destroyer_2: "ชั้น G/H/I"
 NZL_destroyer_2_desc: "เรือพิฆาตชั้น G, H และ I ไดรับคําสั่งตอภายใตโครงการกอสรางนาวีป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าของชั้น F กอนหนา แตลดขนาดลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยทั้งคูใชปนขนาด 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล อาวุธเพียงพอ และติดตอรปโดไดมาก ถูกใชงานอยางกวางขวางระหวางสงครามและสูญเสียไปหลายลํา"
 NZL_destroyer_3: "ชั้น J/K/N"
 NZL_destroyer_3_desc: "ชั้น J, K และ N คลายกับชั้นไทรบัลรุนกอน แตแทนที่จะเนนอาวุธปน ผูออกแบบกลับไปใชการจัดวางแบบมาตรฐานที่เนนตอรปโดหนักและปนเบากวา เรือไดรับการดัดแปลงตลอดชวงประจําการในสงคราม การปรับปรุงรวมถึงปนตอสูอากาศยานที่ดีขึ้นและเรดาร เปนเรือที่รวดเร็ว พิสัยไกล และอาวุธดี เหมาะอยางยิ่งสําหรับคุมกันกองเรือ"
 NZL_destroyer_4: "ชั้นแบทเทิล"
 NZL_destroyer_4_desc: "เรือพิฆาตชั้นแบทเทิลตอยอดจากวิวัฒนาการของเรือพิฆาตอังกฤษที่ใชตลอดสงคราม เรือไดรับคําสั่งตอภายใตโครงการนาวีป 1942 และ 1943 มีอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถในการปราบเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรืออเนกประสงค แตการเขาสูสงครามที่ลาชาทําใหมีบทบาทเพียงเล็กนอย"
 NZL_light_cruiser_1: "ชั้น C"
 NZL_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบายี่สิบแปดลําของราชนาวี สรางกอนและระหวางสงครามโลกครั้งที่หนึ่งเพื่อรับมือกับสภาพทะเลเหนือที่โหดราย เรือเหลานี้พิสูจนวาทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธนาพอใจเกินคาด เพราะติดปนขนาด 6 นิ้วมากพอจะสูกับเปาหมายผิวนํ้าของขาศึกและบรรทุกตอรปโดจํานวนมาก เรือถูกใชงานอยางกวางขวางในสงครามโลกครั้งที่หนึ่งและเขารวมการรบผิวนํ้าหลายครั้ง เมื่อถึงกลางทศวรรษ 1930 เหลือเพียงชั้นยอยแคลิดอน ซีรีส และคารไลลที่ยังประจําการอยู"
 #NZL_light_cruiser_1c: "Leander Class"
 NZL_light_cruiser_2: "ชั้นเซาแทมปตัน"
 NZL_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้นเซาแทมปตันเปนชั้นยอยของเรือลาดตระเวนชั้นทาวน ออกแบบมาเพื่อรับมือกับเรือลาดตระเวนชั้นโมงามิของญี่ปุน เรือเหลานี้มีเกราะดี ความเร็วและพิสัยดี และติดอาวุธทรงพลังคือปนขนาด 6 นิ้วสิบสองกระบอกในปอมปนสามลํากลองสี่ปอม เรือชั้นนี้เปนพื้นฐานของแบบเรือลาดตระเวนเบาในยามสงครามของราชนาวีอีกหลายแบบในเวลาตอมา"
 NZL_light_cruiser_3: "ชั้นแกมเบีย"
 NZL_light_cruiser_3_desc: "ชั้นแกมเบียเปนชื่อเรียกของนิวซีแลนดสําหรับเรือลาดตระเวนเบาชั้นคราวนโคโลนีของอังกฤษ ซึ่งเปนรุนปรับปรุงของชั้นทาวน แตมีแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือติดปนแบบเดียวกับรุนกอน คือปนขนาด 6 นิ้วในปอมปนสามลํากลองสี่ปอม มีเกราะใกลเคียงกัน แตดวยเครื่องยนตที่เล็กกวา พิสัยจึงลดลงบาง เรือแบบนี้มีสองชั้นยอย คือฟจิและซีลอน"
 NZL_light_cruiser_4: "ชั้นแบล็กพรินซ"
 NZL_light_cruiser_4_desc: "ชั้นแบล็กพรินซเปนชื่อเรียกของแคนาดาสําหรับเรือลาดตระเวนเบาชั้นไมโนทอร (หรือชั้นสวิฟตชัวร) ของอังกฤษ เรือลาดตระเวนเหลานี้ออกแบบโดยดัดแปลงจากชั้นคราวนโคโลนี โดยนําการปรับปรุงในยามสงครามที่อนุมัติในป 1941 มาใช มีพิสัยปฏิบัติการไกลกวาและอาวุธตอสูอากาศยานมากกวาชั้นคราวนโคโลนี ขณะที่อาวุธหลักลดลงเหลือปอมปนสามลํากลองสามปอม เนื่องจากสรางชาเกินกวาจะสงผลตอผลลัพธของสงคราม เรือสวนใหญที่สั่งตอไวจึงถูกยกเลิกในภายหลัง"
 NZL_heavy_cruiser_1: "ชั้นฮอวกินส"
 NZL_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้นฮอวกินสเปนเรือลาดตระเวนหนักรุนแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้นทาวนรุนกอน โดยเฉพาะชั้นยอยเบอรมิงแฮม แตติดปนขนาด 7.5 นิ้วและสายเกราะที่หนากวา ออกแบบมาเพื่อสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี เรือมีอาวุธดี ความเร็วและพิสัยพอใช และการปองกันที่ดี รวมแลวมีการขึ้นระวางประจําการหาลํา แตมีเพียงสี่ลําที่ยังประจําการเมื่อเริ่มสงครามโลกครั้งที่สอง"
 NZL_heavy_cruiser_2: "ชั้นเซอรรีย"
 NZL_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้นเซอรรียไดรับการเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้นยอรกรุนกอน หากสรางเสร็จจะติดปอมปนแฝดขนาด 8 นิ้วสี่ปอม เกราะหนักขึ้น และเครื่องยนตทรงพลังกวา มีการสั่งตอสองลํา แตไมมีลําใดไดวางกระดูกงู"
 NZL_heavy_cruiser_3: "ชั้นแอดมิรัล"
 NZL_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้นแอดมิรัล (อยาสับสนกับเรือลาดตระเวนประจัญบานชั้นแอดมิรัล) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนที่ติดปนขนาด 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และสิ้นสุดในป 1941 ไดขอเสนอออกมาหลายแบบ ขอเสนอสุดทายประกอบดวยปนขนาด 8 นิ้วแบบใหมในปอมปนสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วดี การที่ขาศึกมีเรือลาดตระเวนไมมากและความคุมคาของเรือเหลานี้ ทําใหหันไปมุงสรางเรือลาดตระเวนเบาเพิ่มแทน"
 NZL_heavy_cruiser_4: "แบบเชอรชิลล"
 NZL_heavy_cruiser_4_desc: "เรือเหลานี้ไดรับการเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกระทรวงทหารเรือ ในชวงตนของสงครามโลกครั้งที่สองเพื่อรับมือกับเรือลาดตระเวนปนใหญชั้นดอยชลันทของเยอรมนี เรือเหลานี้จะติดปนใหญขนาด 9.2 นิ้ว ปนตอสูอากาศยานหนัก และเกราะแข็งแรง โดยออกแบบมาเพื่อตอกรกับเรือหลักของขาศึกไดอยางมีประสิทธิภาพ ทายที่สุดโครงการถูกยกเลิกเนื่องจากตนทุนสูงและความตองการเรือลาดตระเวนหนักลําใหมมีไมมากพอ "
 NZL_battle_cruiser_1: "ชั้นรีโนวน"
 NZL_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้นรีโนวนเดิมทีวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้นรีเวนจ การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่หนึ่งปะทุขึ้น กอนที่พลเรือเอกลอรดฟชเชอรจะผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบาน เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานอยางแทจริง มีอาวุธครบครัน รวดเร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากเรือสามลําที่วางแผนไวแตแรก มีเพียงสองลําคือรีพัลสและรีโนวนที่สรางเสร็จ"
 NZL_battle_cruiser_2: "ชั้นพรินเซสรอยัล"
 NZL_battle_cruiser_2_desc: "พรินเซสรอยัลเปนเรือลาดตระเวนประจัญบานสมมุติที่เร็วกวาและถูกกวาเรือประจัญบานชั้นคิงจอรจที่ 5 เรือเหลานี้ติดอาวุธคลายกันแตลดจํานวนลงทั้งสําหรับการรบผิวนํ้าและการตอสูอากาศยาน ไดแก ปอมปนสามลํากลองขนาด 14 นิ้วสองปอม และปนตอสูอากาศยานแฝดขนาด 5.25 นิ้วหกปอม ความเร็วสูงและพิสัยไกลจะทําใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 NZL_battleship_1: "ชั้นรีเวนจ"
 NZL_battleship_1_desc: "เรือประจัญบานชั้นรีเวนจไดรับคําสั่งตอในป 1913 ในฐานะรุนราคาถูกของเรือเดรดนอตเร็วชั้นควีนเอลิซาเบธ แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหเรือเหลานี้ถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่สอง จากที่วางแผนไว 8 ลํา มีเพียง 5 ลําที่สรางเสร็จ"
 NZL_battleship_2: "ชั้นคิงจอรจที่ 5"
 NZL_battleship_2_desc: "เรือประจัญบานชั้นคิงจอรจที่ 5 เปนผลมาจากสนธิสัญญานาวีวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและขนาดปนของเรือหลัก ดวยเหตุนี้เรือชั้นนี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้นควีนเอลิซาเบธที่เกาแลว"
 NZL_battleship_3: "ชั้นไลออน"
 NZL_battleship_3_desc: "เรือประจัญบานชั้นไลออนเปนเรือชั้นถัดมาจากเรือประจัญบานคิงจอรจที่ 5 โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้นรีเวนจที่เกาลง แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบปะทุขึ้น เรือเหลานี้โดยรวมจะคลายกับชั้นคิงจอรจ แตมีอาวุธหลักหนักกวา โดยใชปนใหญขนาด 16 นิ้วแบบใหม อีกทั้งยังมีเกราะหนาขึ้นและเครื่องยนตทรงพลังกวา"
 NZL_battleship_4: "ชั้นแวนการด"
 NZL_battleship_4_desc: "เรือประจัญบานชั้นแวนการดเปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวี มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาสรางเพิ่มอีกสี่ลําสําหรับยุทธบริเวณแปซิฟก เรือไดรับคําสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ทําใหมีเสถียรภาพและความสามารถในการเดินทะเลยอดเยี่ยม อาวุธเหมือนกับเรือประจัญบานชั้นควีนเอลิซาเบธและรีเวนจ ใหอํานาจการยิงสูง เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือรวดเร็วและไดรับการปองกันอยางดี"
 NZL_SH_battleship_1: "ชั้นเซนจูเรียน"
 NZL_SH_battleship_1_desc: "เซนจูเรียนเปนเรือประจัญบานหนักสมมุติของราชนาวีที่สรางขึ้นเพื่อรับมือกับเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาดใหญ 18 นิ้วและเกราะหนาทําใหเรือมีอํานาจการยิงและการปองกันที่จําเปนในการตอกรกับเรือเหลานั้น อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีลวนจําเปนตอการครอบคลุมนานนํ้าอันกวางใหญของจักรวรรดิบริติช"
 NZL_SH_battleship_2: "ชั้นไลออน II"
 NZL_SH_battleship_2_desc: "เรือประจัญบานชั้นไลออน II ออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้นไลออนรุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จจะติดปอมปนสามลํากลองขนาด 16 นิ้วแบบลาสุดสามหรือสี่ปอม แผนเกราะหนาชวยปกปองเรือจากศัตรูทั้งบนผิวนํ้าและทางอากาศ ตนทุนการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการถูกยกเลิกไป"
 NZL_carrier_1: "ชั้นเคอเรจัส"
 NZL_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวี การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือเหลานี้มีเกราะปานกลางแตติดอาวุธดี พิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลงจึงบรรทุกอากาศยานไดจํากัด อยางไรก็ตาม เรือเหลานี้ไดมอบประสบการณสําคัญแกราชนาวีในการสรางเรือบรรทุกเครื่องบินและการใชกําลังทางอากาศของกองเรือ"
 NZL_carrier_2: "ชั้นอารกรอยัล"
 NZL_carrier_2_desc: "เรือบรรทุกเครื่องบินอารกรอยัลเปนเรือลําแรกในประเภทนี้ที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน และเปนเรือลําแรกที่โรงเก็บเครื่องบินและดาดฟาบินเปนสวนหนึ่งของตัวเรือ เรือนี้ออกแบบในป 1934 มีเกราะและอาวุธที่ดี บรรทุกอากาศยานไดจํานวนมาก และมีพิสัยปฏิบัติการกับความเร็วเพียงพอที่จะเคลื่อนที่ไปพรอมกับกําลังหลักของราชนาวี"
 NZL_carrier_3: "ชั้นอิลลัสเทรียส"
 NZL_carrier_3_desc: "เรือชั้นอิลลัสเทรียสออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน นี่เปนเรือบรรทุกเครื่องบินลําแรกของอังกฤษที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหขนาดกองบินลดลง เกราะหนาและอาวุธตอสูอากาศยานชวยปองกันเรืออยางแข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหมีพิสัยปฏิบัติการไกล "
 NZL_carrier_4: "ชั้นอิมพลาเคเบิล"
 NZL_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นอิมพลาเคเบิลไดรับคําสั่งตอภายใตโครงการนาวีป 1938 และโดยพื้นฐานคือรุนปรับปรุงของชั้นอิลลัสเทรียส สงครามและการเปลี่ยนลําดับความสําคัญไปที่เรือขนาดเล็กสําหรับคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงครามทําใหการกอสรางลาชา เรือเหลานี้มีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้น โดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาทําใหมีความเร็วและพิสัยปฏิบัติการมากกวาชั้นอิลลัสเทรียส"
 ### POR - PORTUGAL ###
 POR_submarine_1: "ชั้นโฟกา"
 POR_submarine_1_desc: "ชั้นโฟกาของโปรตุเกสคือเรือดํานํ้าขนาดเล็กสามลําที่สรางในอิตาลีใหกองทัพเรือโปรตุเกสไมนานหลังสงครามโลกครั้งที่หนึ่ง เปนรุนขยายขนาดของชั้นเอสปาดารเตของอิตาลี และเปนเรือพี่นองของชั้น A ของสเปน มีระวางขับนํ้าเพียง 260 ตัน และติดทอตอรปโดขนาด 450 มม. สองทอ ทั้งสามลําปลดประจําการภายในกลางทศวรรษ 1930"
 POR_submarine_2: "ชั้นเดลฟง"
 POR_submarine_2_desc: "ชั้นเดลฟงประกอบดวยเรือดํานํ้าสองลําที่เดิมสั่งตอและวางกระดูกงูในอิตาลีใหกองทัพเรือโปรตุเกสในชวงตนทศวรรษ 1930 แตคําสั่งซื้อถูกยกเลิก และเรือถูกสรางจนเสร็จใหกองทัพเรืออิตาลีแทน เรือพัฒนาจากชั้นสกวาโลขนาดใหญของอิตาลี มีระวางขับนํ้า 980 ตัน และติดทอตอรปโดขนาด 533 มม. แปดทอ"
 POR_submarine_4: "ชั้นนารวัล"
 POR_submarine_4_desc: "ชั้นนารวัลประกอบดวยเรือดํานํ้าชั้นซัทเทิลของอังกฤษสามลําที่เขาประจําการในป 1945 และขายใหโปรตุเกสหลังสงครามโลกครั้งที่สอง มีระวางขับนํ้า 840 ตัน และติดทอตอรปโดขนาด 533 มม. เจ็ดทอ"
 POR_destroyer_1: "ชั้นดอรู"
 POR_destroyer_1_desc: "ชั้นดอรูเปนเรือพิฆาตเจ็ดลําที่ปลอยลงนํ้าในชวงตนทศวรรษ 1930 สรางทั้งในโปรตุเกสและสหราชอาณาจักร สองลําในนั้นขายใหโคลอมเบียในป 1934 เรือมีระวางขับนํ้ากวา 1,200 ตัน และติดปน BL ขนาด 4.7 นิ้วสี่กระบอกกับทอตอรปโดขนาด 533 มม. แปดทอ"
 ### PRU - PERU ###
 PRU_submarine_1: "ชั้น R"
 PRU_submarine_1_desc: "เรือดํานํ้าชั้น R ของเปรูประกอบดวยเรือดํานํ้าสี่ลําที่สั่งซื้อและสรางโดยสหรัฐฯ ในชวงกลางทศวรรษ 1920 โดยพื้นฐานเหมือนกับเรือดํานํ้าชั้น R ของสหรัฐฯ มีระวางขับนํ้ากวา 570 ตัน และติดทอตอรปโดขนาด 533 มม. สี่ทอ"
 PRU_destroyer_1: "ชั้นอัลมีรันเต บิยาร"
 PRU_destroyer_1_desc: "อัลมีรันเต บิยารและอัลมีรันเต กีเซเปนอดีตเรือพิฆาตชั้นโนวิคของรัสเซียสองลํา เรือผานเสนทางออมคอมกวาจะมาถึงกองทัพเรือเปรู โดยเคยชักธงทั้งของสหราชอาณาจักรและเอสโตเนีย กอนจะสงมอบใหเปรูในที่สุดในป 1934 เรือติดปนขนาด 102 มม./60 คาลิเบอรสี่กระบอกและทอตอรปโดขนาด 533 มม. เกาทอ มีระวางขับนํ้ากวา 1,200 ตัน และความเร็วดีพอสมควรสําหรับขนาดและยุคของมัน"
 PRU_light_cruiser_1: "ชั้นอัลมีรันเต กราว"
 PRU_light_cruiser_1_desc: "ชั้นอัลมีรันเต กราวประกอบดวยเรือลาดตระเวนเบากอนสงครามโลกครั้งที่หนึ่งสองลําที่สรางในอังกฤษใหกองทัพเรือเปรูและเขาประจําการในป 1907 แมจะเปนเรือลาดตระเวนเบา แตก็คอนขางเล็ก ระวางขับนํ้าเพียง 3,100 ตัน และความเร็วยังตํ่ากวาเกณฑเฉลี่ย เรือมีเกราะบางและติดปนวิกเกอรสแฝดขนาด 152 มม./50 คาลิเบอรเปนอาวุธหลัก"
 ### RAJ - BRITISH RAJ ###
 RAJ_submarine_1: "ชั้น L"
 RAJ_submarine_1_desc: "เรือดํานํ้าชั้น L เปนเรือขนาดกลางที่เดิมวางแผนไวภายใตโครงการสงครามฉุกเฉินในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางขึ้นในชวงทายของสงครามโลกครั้งที่หนึ่ง และติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น เรือเหลานี้ประจําการจนถึงตนสงครามโลกครั้งที่สอง ซึ่งสวนใหญใชในภารกิจรองและการฝก"
 RAJ_submarine_2: "ชั้น T"
 RAJ_submarine_2_desc: "เรือดํานํ้าชั้น T หรือชั้นไทรทันออกแบบมาเพื่อทดแทนเรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าคอนขางใหญ พิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้มีอาวุธดีและเปนแทนยิงที่มั่นคง ถูกใชงานอยางกวางขวางระหวางสงคราม โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายไปในสงคราม"
 RAJ_submarine_3: "ชั้น U"
 RAJ_submarine_3_desc: "เรือดํานํ้าชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือก็ถูกปรับเปลี่ยน ทําใหเรือดํานํ้าเหลานี้มีประโยชนในนานนํ้าแคบของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงมีจํากัด เรือชั้นนี้แบงเปนสามชั้นยอย ไดแก อันดีน อัมไพร และอัปโรร"
 RAJ_submarine_4: "ชั้น V"
 RAJ_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้นแวมไพรพัฒนาจากเรือขนาดเล็กชั้น U รุนกอน มีขนาดใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้น แตพิสัยปฏิบัติการและอาวุธยังจํากัด"
 RAJ_destroyer_1: "ชั้น V/W"
 RAJ_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของกระทรวงทหารเรือและของธอรนีครอฟต สรางภายใตโครงการสงครามฉุกเฉิน ถือเปนวิวัฒนาการขั้นสุดทายของการออกแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่หนึ่ง โดยรวมขอปรับปรุงของรุนกอนหนาเขากับความกาวหนาทางเทคโนโลยีใหมๆ มีการสรางเรือเหลานี้จํานวนมากในชวงทายของสงครามโลกครั้งที่หนึ่ง และกลายเปนกําลังหลักของหมวดเรือพิฆาตราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือเหลานี้ถูกโอนเขากองเรือสํารอง และทายที่สุดถูกลดบทบาทไปทําหนาที่คุมกันขบวนเรือลําเลียง เปนเรือที่มีอาวุธเพียงพอ รวดเร็ว และพิสัยดี"
 RAJ_destroyer_2: "ชั้น G/H/I"
 RAJ_destroyer_2_desc: "เรือพิฆาตชั้น G, H และ I ไดรับคําสั่งตอภายใตโครงการกอสรางนาวีป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าของชั้น F กอนหนา แตลดขนาดลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยทั้งคูใชปนขนาด 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล อาวุธเพียงพอ และติดตอรปโดไดมาก ถูกใชงานอยางกวางขวางระหวางสงครามและสูญเสียไปหลายลํา"
 RAJ_destroyer_3: "ชั้น J/K/N"
 RAJ_destroyer_3_desc: "ชั้น J, K และ N คลายกับชั้นไทรบัลรุนกอน แตแทนที่จะเนนอาวุธปน ผูออกแบบกลับไปใชการจัดวางแบบมาตรฐานที่เนนตอรปโดหนักและปนเบากวา เรือไดรับการดัดแปลงตลอดชวงประจําการในสงคราม การปรับปรุงรวมถึงปนตอสูอากาศยานที่ดีขึ้นและเรดาร เปนเรือที่รวดเร็ว พิสัยไกล และอาวุธดี เหมาะอยางยิ่งสําหรับคุมกันกองเรือ"
 RAJ_destroyer_4: "ชั้นแบทเทิล"
 RAJ_destroyer_4_desc: "เรือพิฆาตชั้นแบทเทิลตอยอดจากวิวัฒนาการของเรือพิฆาตอังกฤษที่ใชตลอดสงคราม เรือไดรับคําสั่งตอภายใตโครงการนาวีป 1942 และ 1943 มีอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถในการปราบเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรืออเนกประสงค แตการเขาสูสงครามที่ลาชาทําใหมีบทบาทเพียงเล็กนอย"
 RAJ_light_cruiser_1: "ชั้น C"
 RAJ_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบายี่สิบแปดลําของราชนาวี สรางกอนและระหวางสงครามโลกครั้งที่หนึ่งเพื่อรับมือกับสภาพทะเลเหนือที่โหดราย เรือเหลานี้พิสูจนวาทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธนาพอใจเกินคาด เพราะติดปนขนาด 6 นิ้วมากพอจะสูกับเปาหมายผิวนํ้าของขาศึกและบรรทุกตอรปโดจํานวนมาก เรือถูกใชงานอยางกวางขวางในสงครามโลกครั้งที่หนึ่งและเขารวมการรบผิวนํ้าหลายครั้ง เมื่อถึงกลางทศวรรษ 1930 เหลือเพียงชั้นยอยแคลิดอน ซีรีส และคารไลลที่ยังประจําการอยู"
 RAJ_basic_light_cruiser: "ชั้นเซาแทมปตัน"
 RAJ_light_cruiser_2: "ชั้นเซาแทมปตัน"
 RAJ_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้นเซาแทมปตันเปนชั้นยอยของเรือลาดตระเวนชั้นทาวน ออกแบบมาเพื่อรับมือกับเรือลาดตระเวนชั้นโมงามิของญี่ปุน เรือเหลานี้มีเกราะดี ความเร็วและพิสัยดี และติดอาวุธทรงพลังคือปนขนาด 6 นิ้วสิบสองกระบอกในปอมปนสามลํากลองสี่ปอม เรือชั้นนี้เปนพื้นฐานของแบบเรือลาดตระเวนเบาในยามสงครามของราชนาวีอีกหลายแบบในเวลาตอมา"
 RAJ_light_cruiser_3: "ชั้นคราวนโคโลนี"
 RAJ_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้นคราวนโคโลนีเปนรุนปรับปรุงของชั้นทาวน แตมีแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือติดปนแบบเดียวกับรุนกอน คือปนขนาด 6 นิ้วในปอมปนสามลํากลองสี่ปอม มีเกราะใกลเคียงกัน แตดวยเครื่องยนตที่เล็กกวา พิสัยจึงลดลงบาง เรือแบบนี้มีสองชั้นยอย คือฟจิและซีลอน"
 RAJ_light_cruiser_4: "ชั้นไมโนทอร"
 RAJ_light_cruiser_4_desc: "เรือลาดตระเวนเหลานี้หรือที่รูจักในชื่อชั้นสวิฟตชัวร ออกแบบโดยดัดแปลงจากชั้นคราวนโคโลนี โดยนําการปรับปรุงในยามสงครามที่อนุมัติในป 1941 มาใช มีพิสัยปฏิบัติการไกลกวาและอาวุธตอสูอากาศยานมากกวาชั้นคราวนโคโลนี ขณะที่อาวุธหลักลดลงเหลือปอมปนสามลํากลองสามปอม เนื่องจากสรางชาเกินกวาจะสงผลตอผลลัพธของสงคราม เรือสวนใหญที่สั่งตอไวจึงถูกยกเลิกในภายหลัง"
 RAJ_heavy_cruiser_1: "ชั้นฮอวกินส"
 RAJ_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้นฮอวกินสเปนเรือลาดตระเวนหนักรุนแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้นทาวนรุนกอน โดยเฉพาะชั้นยอยเบอรมิงแฮม แตติดปนขนาด 7.5 นิ้วและสายเกราะที่หนากวา ออกแบบมาเพื่อสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี เรือมีอาวุธดี ความเร็วและพิสัยพอใช และการปองกันที่ดี รวมแลวมีการขึ้นระวางประจําการหาลํา แตมีเพียงสี่ลําที่ยังประจําการเมื่อเริ่มสงครามโลกครั้งที่สอง"
 RAJ_heavy_cruiser_2: "ชั้นเซอรรีย"
 RAJ_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้นเซอรรียไดรับการเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้นยอรกรุนกอน หากสรางเสร็จจะติดปอมปนแฝดขนาด 8 นิ้วสี่ปอม เกราะหนักขึ้น และเครื่องยนตทรงพลังกวา มีการสั่งตอสองลํา แตไมมีลําใดไดวางกระดูกงู"
 RAJ_heavy_cruiser_3: "ชั้นแอดมิรัล"
 RAJ_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้นแอดมิรัล (อยาสับสนกับเรือลาดตระเวนประจัญบานชั้นแอดมิรัล) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนที่ติดปนขนาด 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และสิ้นสุดในป 1941 ไดขอเสนอออกมาหลายแบบ ขอเสนอสุดทายประกอบดวยปนขนาด 8 นิ้วแบบใหมในปอมปนสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วดี การที่ขาศึกมีเรือลาดตระเวนไมมากและความคุมคาของเรือเหลานี้ ทําใหหันไปมุงสรางเรือลาดตระเวนเบาเพิ่มแทน"
 RAJ_heavy_cruiser_4: "แบบเชอรชิลล"
 RAJ_heavy_cruiser_4_desc: "เรือเหลานี้ไดรับการเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกระทรวงทหารเรือ ในชวงตนของสงครามโลกครั้งที่สองเพื่อรับมือกับเรือลาดตระเวนปนใหญชั้นดอยชลันทของเยอรมนี เรือเหลานี้จะติดปนใหญขนาด 9.2 นิ้ว ปนตอสูอากาศยานหนัก และเกราะแข็งแรง โดยออกแบบมาเพื่อตอกรกับเรือหลักของขาศึกไดอยางมีประสิทธิภาพ ทายที่สุดโครงการถูกยกเลิกเนื่องจากตนทุนสูงและความตองการเรือลาดตระเวนหนักลําใหมมีไมมากพอ "
 RAJ_battle_cruiser_1: "ชั้นรีโนวน"
 RAJ_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้นรีโนวนเดิมทีวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้นรีเวนจ การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่หนึ่งปะทุขึ้น กอนที่พลเรือเอกลอรดฟชเชอรจะผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบาน เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานอยางแทจริง มีอาวุธครบครัน รวดเร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากเรือสามลําที่วางแผนไวแตแรก มีเพียงสองลําคือรีพัลสและรีโนวนที่สรางเสร็จ"
 RAJ_battle_cruiser_2: "ชั้นพรินเซสรอยัล"
 RAJ_battle_cruiser_2_desc: "พรินเซสรอยัลเปนเรือลาดตระเวนประจัญบานสมมุติที่เร็วกวาและถูกกวาเรือประจัญบานชั้นคิงจอรจที่ 5 เรือเหลานี้ติดอาวุธคลายกันแตลดจํานวนลงทั้งสําหรับการรบผิวนํ้าและการตอสูอากาศยาน ไดแก ปอมปนสามลํากลองขนาด 14 นิ้วสองปอม และปนตอสูอากาศยานแฝดขนาด 5.25 นิ้วหกปอม ความเร็วสูงและพิสัยไกลจะทําใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 RAJ_battleship_1: "ชั้นรีเวนจ"
 RAJ_battleship_1_desc: "เรือประจัญบานชั้นรีเวนจไดรับคําสั่งตอในป 1913 ในฐานะรุนราคาถูกของเรือเดรดนอตเร็วชั้นควีนเอลิซาเบธ แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหเรือเหลานี้ถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่สอง จากที่วางแผนไว 8 ลํา มีเพียง 5 ลําที่สรางเสร็จ"
 RAJ_battleship_2: "ชั้นคิงจอรจที่ 5"
 RAJ_battleship_2_desc: "เรือประจัญบานชั้นคิงจอรจที่ 5 เปนผลมาจากสนธิสัญญานาวีวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและขนาดปนของเรือหลัก ดวยเหตุนี้เรือชั้นนี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้นควีนเอลิซาเบธที่เกาแลว"
 RAJ_battleship_3: "ชั้นไลออน"
 RAJ_battleship_3_desc: "เรือประจัญบานชั้นไลออนเปนเรือชั้นถัดมาจากเรือประจัญบานคิงจอรจที่ 5 โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้นรีเวนจที่เกาลง แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบปะทุขึ้น เรือเหลานี้โดยรวมจะคลายกับชั้นคิงจอรจ แตมีอาวุธหลักหนักกวา โดยใชปนใหญขนาด 16 นิ้วแบบใหม อีกทั้งยังมีเกราะหนาขึ้นและเครื่องยนตทรงพลังกวา"
 RAJ_battleship_4: "ชั้นแวนการด"
 RAJ_battleship_4_desc: "เรือประจัญบานชั้นแวนการดเปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวี มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาสรางเพิ่มอีกสี่ลําสําหรับยุทธบริเวณแปซิฟก เรือไดรับคําสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ทําใหมีเสถียรภาพและความสามารถในการเดินทะเลยอดเยี่ยม อาวุธเหมือนกับเรือประจัญบานชั้นควีนเอลิซาเบธและรีเวนจ ใหอํานาจการยิงสูง เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือรวดเร็วและไดรับการปองกันอยางดี"
 RAJ_SH_battleship_1: "ชั้นเซนจูเรียน"
 RAJ_SH_battleship_1_desc: "เซนจูเรียนเปนเรือประจัญบานหนักสมมุติของราชนาวีที่สรางขึ้นเพื่อรับมือกับเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาดใหญ 18 นิ้วและเกราะหนาทําใหเรือมีอํานาจการยิงและการปองกันที่จําเปนในการตอกรกับเรือเหลานั้น อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีลวนจําเปนตอการครอบคลุมนานนํ้าอันกวางใหญของจักรวรรดิบริติช"
 RAJ_SH_battleship_2: "ชั้นไลออน II"
 RAJ_SH_battleship_2_desc: "เรือประจัญบานชั้นไลออน II ออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้นไลออนรุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จจะติดปอมปนสามลํากลองขนาด 16 นิ้วแบบลาสุดสามหรือสี่ปอม แผนเกราะหนาชวยปกปองเรือจากศัตรูทั้งบนผิวนํ้าและทางอากาศ ตนทุนการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการถูกยกเลิกไป"
 RAJ_carrier_1: "ชั้นเคอเรจัส"
 RAJ_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวี การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือเหลานี้มีเกราะปานกลางแตติดอาวุธดี พิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลงจึงบรรทุกอากาศยานไดจํากัด อยางไรก็ตาม เรือเหลานี้ไดมอบประสบการณสําคัญแกราชนาวีในการสรางเรือบรรทุกเครื่องบินและการใชกําลังทางอากาศของกองเรือ"
 RAJ_carrier_2: "ชั้นอารกรอยัล"
 RAJ_carrier_2_desc: "เรือบรรทุกเครื่องบินอารกรอยัลเปนเรือลําแรกในประเภทนี้ที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน และเปนเรือลําแรกที่โรงเก็บเครื่องบินและดาดฟาบินเปนสวนหนึ่งของตัวเรือ เรือนี้ออกแบบในป 1934 มีเกราะและอาวุธที่ดี บรรทุกอากาศยานไดจํานวนมาก และมีพิสัยปฏิบัติการกับความเร็วเพียงพอที่จะเคลื่อนที่ไปพรอมกับกําลังหลักของราชนาวี"
 RAJ_carrier_3: "ชั้นอิลลัสเทรียส"
 RAJ_carrier_3_desc: "เรือชั้นอิลลัสเทรียสออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน นี่เปนเรือบรรทุกเครื่องบินลําแรกของอังกฤษที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหขนาดกองบินลดลง เกราะหนาและอาวุธตอสูอากาศยานชวยปองกันเรืออยางแข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหมีพิสัยปฏิบัติการไกล "
 RAJ_carrier_4: "ชั้นอิมพลาเคเบิล"
 RAJ_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นอิมพลาเคเบิลไดรับคําสั่งตอภายใตโครงการนาวีป 1938 และโดยพื้นฐานคือรุนปรับปรุงของชั้นอิลลัสเทรียส สงครามและการเปลี่ยนลําดับความสําคัญไปที่เรือขนาดเล็กสําหรับคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงครามทําใหการกอสรางลาชา เรือเหลานี้มีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้น โดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาทําใหมีความเร็วและพิสัยปฏิบัติการมากกวาชั้นอิลลัสเทรียส"
 ### ROM - ROMANIA ###
 ROM_submarine_1: "ชั้นเดลฟนุล"
 ROM_submarine_1_desc: "เดลฟนุลเปนเรือดํานํ้าของโรมาเนียที่สรางในอิตาลีใหกองทัพเรือโรมาเนีย ปลอยลงนํ้าในป 1930 มีระวางขับนํ้า 650 ตัน และติดทอตอรปโดขนาด 533 มม. หกทอ"
 ROM_submarine_3: "ชั้นเรคินุล"
 ROM_submarine_3_desc: "เรือดํานํ้าเรคินุลและมารซุยนุลสรางโดยเยอรมนีใหโรมาเนียซึ่งเปนพันธมิตร และเขาประจําการในป 1943 เรือพัฒนาจากเรือดํานํ้าแบบ VII ของเยอรมนี เปนเรือดํานํ้าขนาดกลาง ระวางขับนํ้า 600 ตัน และติดทอตอรปโดขนาด 533 มม. หกทอ"
 ROM_destroyer_1: "ชั้นมาราชตี"
 ROM_destroyer_1_desc: "ชั้นมาราชตีเปนเรือพิฆาตที่สรางใหโรมาเนียในชวงสงครามโลกครั้งที่หนึ่ง เรือทั้งสี่ลําในชั้นนี้ถูกกองทัพเรืออิตาลีเรียกเกณฑไปใชระหวางสงคราม และในที่สุดสองลําก็ถูกขายใหโรมาเนียในชวงตนทศวรรษ 1920 เปนเรือพิฆาตขนาดใหญ ระวางขับนํ้ากวา 1,400 ตัน ติดปนชไนเดอร-กาเน-อารมสตรองขนาด 120 มม./45 สี่กระบอกและทอตอรปโดขนาด 450 มม. สี่ทอ มีความเร็วและความนาเชื่อถือระดับกลางสําหรับยุคของมัน"
 #ROM_destroyer_1b: "Regele Ferdinand Class"
 ### SAF - SOUTH AFRICA ###
 SAF_submarine_1: "ชั้น L"
 SAF_submarine_1_desc: "เรือดํานํ้าชั้น L เปนเรือขนาดกลางที่เดิมวางแผนไวภายใตโครงการสงครามฉุกเฉินในฐานะรุนปรับปรุงของเรือดํานํ้าชั้นกอนหนา สรางขึ้นในชวงทายของสงครามโลกครั้งที่หนึ่ง และติดตั้งตอรปโดขนาด 21 นิ้วแบบใหมที่ใหญขึ้น เรือเหลานี้ประจําการจนถึงตนสงครามโลกครั้งที่สอง ซึ่งสวนใหญใชในภารกิจรองและการฝก"
 SAF_submarine_2: "ชั้น T"
 SAF_submarine_2_desc: "เรือดํานํ้าชั้น T หรือชั้นไทรทันออกแบบมาเพื่อทดแทนเรือดํานํ้าขนาดใหญชั้น O, P และ R เปนเรือดํานํ้าคอนขางใหญ พิสัยไกล เหมาะกับมหาสมุทรแอตแลนติกและแปซิฟก เรือเหลานี้มีอาวุธดีและเปนแทนยิงที่มั่นคง ถูกใชงานอยางกวางขวางระหวางสงคราม โดยรอยละ 25 ของเรือที่สรางขึ้นสูญหายไปในสงคราม"
 SAF_submarine_3: "ชั้น U"
 SAF_submarine_3_desc: "เรือดํานํ้าชั้น U เปนเรือดํานํ้าขนาดเล็กที่สรางภายใตโครงการสงครามฉุกเฉินป 1940 และ 1941 เดิมออกแบบเปนเรือดํานํ้าฝก แตเมื่อสงครามปะทุ แบบเรือก็ถูกปรับเปลี่ยน ทําใหเรือดํานํ้าเหลานี้มีประโยชนในนานนํ้าแคบของทะเลเหนือและทะเลเมดิเตอรเรเนียน ดวยขนาดที่เล็ก พิสัยและอาวุธจึงมีจํากัด เรือชั้นนี้แบงเปนสามชั้นยอย ไดแก อันดีน อัมไพร และอัปโรร"
 SAF_submarine_4: "ชั้น V"
 SAF_submarine_4_desc: "เรือดํานํ้าชั้น V หรือชั้นแวมไพรพัฒนาจากเรือขนาดเล็กชั้น U รุนกอน มีขนาดใหญขึ้นแตยังคอนขางเล็ก มีความสามารถในการเดินทะเลดีขึ้น แตพิสัยปฏิบัติการและอาวุธยังจํากัด"
 SAF_destroyer_1: "ชั้น V/W"
 SAF_destroyer_1_desc: "เรือพิฆาตเหลานี้รวมถึงชั้น V และ W ของกระทรวงทหารเรือและของธอรนีครอฟต สรางภายใตโครงการสงครามฉุกเฉิน ถือเปนวิวัฒนาการขั้นสุดทายของการออกแบบเรือพิฆาตอังกฤษในสงครามโลกครั้งที่หนึ่ง โดยรวมขอปรับปรุงของรุนกอนหนาเขากับความกาวหนาทางเทคโนโลยีใหมๆ มีการสรางเรือเหลานี้จํานวนมากในชวงทายของสงครามโลกครั้งที่หนึ่ง และกลายเปนกําลังหลักของหมวดเรือพิฆาตราชนาวีในเวลาตอมา ตั้งแตทศวรรษ 1930 เรือเหลานี้ถูกโอนเขากองเรือสํารอง และทายที่สุดถูกลดบทบาทไปทําหนาที่คุมกันขบวนเรือลําเลียง เปนเรือที่มีอาวุธเพียงพอ รวดเร็ว และพิสัยดี"
 SAF_destroyer_2: "ชั้น G/H/I"
 SAF_destroyer_2_desc: "เรือพิฆาตชั้น G, H และ I ไดรับคําสั่งตอภายใตโครงการกอสรางนาวีป 1933 และ 1934 โดยทั่วไปเปนการสรางซํ้าของชั้น F กอนหนา แตลดขนาดลงเล็กนอย อาวุธของชั้น G และ H เหมือนกับชั้น F โดยทั้งคูใชปนขนาด 4.7 นิ้ว เรือเหลานี้มีพิสัยไกล อาวุธเพียงพอ และติดตอรปโดไดมาก ถูกใชงานอยางกวางขวางระหวางสงครามและสูญเสียไปหลายลํา"
 SAF_destroyer_3: "ชั้น J/K/N"
 SAF_destroyer_3_desc: "ชั้น J, K และ N คลายกับชั้นไทรบัลรุนกอน แตแทนที่จะเนนอาวุธปน ผูออกแบบกลับไปใชการจัดวางแบบมาตรฐานที่เนนตอรปโดหนักและปนเบากวา เรือไดรับการดัดแปลงตลอดชวงประจําการในสงคราม การปรับปรุงรวมถึงปนตอสูอากาศยานที่ดีขึ้นและเรดาร เปนเรือที่รวดเร็ว พิสัยไกล และอาวุธดี เหมาะอยางยิ่งสําหรับคุมกันกองเรือ"
 SAF_destroyer_4: "ชั้นแบทเทิล"
 SAF_destroyer_4_desc: "เรือพิฆาตชั้นแบทเทิลตอยอดจากวิวัฒนาการของเรือพิฆาตอังกฤษที่ใชตลอดสงคราม เรือไดรับคําสั่งตอภายใตโครงการนาวีป 1942 และ 1943 มีอาวุธดีทั้งปนและตอรปโด อาวุธตอสูอากาศยาน ขีดความสามารถในการปราบเรือดํานํ้า ความเร็ว และพิสัย ทําใหเปนเรืออเนกประสงค แตการเขาสูสงครามที่ลาชาทําใหมีบทบาทเพียงเล็กนอย"
 SAF_light_cruiser_1: "ชั้น C"
 SAF_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้น C เปนกลุมเรือลาดตระเวนเบายี่สิบแปดลําของราชนาวี สรางกอนและระหวางสงครามโลกครั้งที่หนึ่งเพื่อรับมือกับสภาพทะเลเหนือที่โหดราย เรือเหลานี้พิสูจนวาทนทานและมีขีดความสามารถ แมจะคอนขางเล็กและคับแคบ อาวุธนาพอใจเกินคาด เพราะติดปนขนาด 6 นิ้วมากพอจะสูกับเปาหมายผิวนํ้าของขาศึกและบรรทุกตอรปโดจํานวนมาก เรือถูกใชงานอยางกวางขวางในสงครามโลกครั้งที่หนึ่งและเขารวมการรบผิวนํ้าหลายครั้ง เมื่อถึงกลางทศวรรษ 1930 เหลือเพียงชั้นยอยแคลิดอน ซีรีส และคารไลลที่ยังประจําการอยู"
 SAF_light_cruiser_2: "ชั้นเซาแทมปตัน"
 SAF_light_cruiser_2_desc: "เรือลาดตระเวนเบาชั้นเซาแทมปตันเปนชั้นยอยของเรือลาดตระเวนชั้นทาวน ออกแบบมาเพื่อรับมือกับเรือลาดตระเวนชั้นโมงามิของญี่ปุน เรือเหลานี้มีเกราะดี ความเร็วและพิสัยดี และติดอาวุธทรงพลังคือปนขนาด 6 นิ้วสิบสองกระบอกในปอมปนสามลํากลองสี่ปอม เรือชั้นนี้เปนพื้นฐานของแบบเรือลาดตระเวนเบาในยามสงครามของราชนาวีอีกหลายแบบในเวลาตอมา"
 SAF_light_cruiser_3: "ชั้นคราวนโคโลนี"
 SAF_light_cruiser_3_desc: "เรือลาดตระเวนเบาชั้นคราวนโคโลนีเปนรุนปรับปรุงของชั้นทาวน แตมีแบบที่เรียบงายขึ้นเพื่อเรงการกอสรางและลดตนทุน เรือติดปนแบบเดียวกับรุนกอน คือปนขนาด 6 นิ้วในปอมปนสามลํากลองสี่ปอม มีเกราะใกลเคียงกัน แตดวยเครื่องยนตที่เล็กกวา พิสัยจึงลดลงบาง เรือแบบนี้มีสองชั้นยอย คือฟจิและซีลอน"
 SAF_light_cruiser_4: "ชั้นไมโนทอร"
 SAF_light_cruiser_4_desc: "เรือลาดตระเวนเหลานี้หรือที่รูจักในชื่อชั้นสวิฟตชัวร ออกแบบโดยดัดแปลงจากชั้นคราวนโคโลนี โดยนําการปรับปรุงในยามสงครามที่อนุมัติในป 1941 มาใช มีพิสัยปฏิบัติการไกลกวาและอาวุธตอสูอากาศยานมากกวาชั้นคราวนโคโลนี ขณะที่อาวุธหลักลดลงเหลือปอมปนสามลํากลองสามปอม เนื่องจากสรางชาเกินกวาจะสงผลตอผลลัพธของสงคราม เรือสวนใหญที่สั่งตอไวจึงถูกยกเลิกในภายหลัง "
 SAF_heavy_cruiser_1: "ชั้นฮอวกินส"
 SAF_heavy_cruiser_1_desc: "เรือลาดตระเวนชั้นฮอวกินสเปนเรือลาดตระเวนหนักรุนแรกของโลก พัฒนาจากเรือลาดตระเวนเบาชั้นทาวนรุนกอน โดยเฉพาะชั้นยอยเบอรมิงแฮม แตติดปนขนาด 7.5 นิ้วและสายเกราะที่หนากวา ออกแบบมาเพื่อสูกับเรือจูโจมขบวนเรือลําเลียงขนาดใหญของเยอรมนี เรือมีอาวุธดี ความเร็วและพิสัยพอใช และการปองกันที่ดี รวมแลวมีการขึ้นระวางประจําการหาลํา แตมีเพียงสี่ลําที่ยังประจําการเมื่อเริ่มสงครามโลกครั้งที่สอง"
 SAF_heavy_cruiser_2: "ชั้นเซอรรีย"
 SAF_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักชั้นเซอรรียไดรับการเสนอภายใตโครงการนาวีป 1928 เปนรุนปรับปรุงของเรือลาดตระเวนหนักชั้นยอรกรุนกอน หากสรางเสร็จจะติดปอมปนแฝดขนาด 8 นิ้วสี่ปอม เกราะหนักขึ้น และเครื่องยนตทรงพลังกวา มีการสั่งตอสองลํา แตไมมีลําใดไดวางกระดูกงู"
 SAF_heavy_cruiser_3: "ชั้นแอดมิรัล"
 SAF_heavy_cruiser_3_desc: "เรือลาดตระเวนหนักชั้นแอดมิรัล (อยาสับสนกับเรือลาดตระเวนประจัญบานชั้นแอดมิรัล) เปนความพยายามครั้งสุดทายของราชนาวีในการออกแบบและสรางเรือลาดตระเวนที่ติดปนขนาด 8 นิ้ว การศึกษาแบบเริ่มในป 1938 และสิ้นสุดในป 1941 ไดขอเสนอออกมาหลายแบบ ขอเสนอสุดทายประกอบดวยปนขนาด 8 นิ้วแบบใหมในปอมปนสามลํากลอง อาวุธตอสูอากาศยานหนัก เกราะหนา และความเร็วดี การที่ขาศึกมีเรือลาดตระเวนไมมากและความคุมคาของเรือเหลานี้ ทําใหหันไปมุงสรางเรือลาดตระเวนเบาเพิ่มแทน"
 SAF_heavy_cruiser_4: "แบบเชอรชิลล"
 SAF_heavy_cruiser_4_desc: "เรือเหลานี้ไดรับการเสนอโดยเซอรวินสตัน เชอรชิลล ลอรดแหงกระทรวงทหารเรือ ในชวงตนของสงครามโลกครั้งที่สองเพื่อรับมือกับเรือลาดตระเวนปนใหญชั้นดอยชลันทของเยอรมนี เรือเหลานี้จะติดปนใหญขนาด 9.2 นิ้ว ปนตอสูอากาศยานหนัก และเกราะแข็งแรง โดยออกแบบมาเพื่อตอกรกับเรือหลักของขาศึกไดอยางมีประสิทธิภาพ ทายที่สุดโครงการถูกยกเลิกเนื่องจากตนทุนสูงและความตองการเรือลาดตระเวนหนักลําใหมมีไมมากพอ "
 SAF_battle_cruiser_1: "ชั้นรีโนวน"
 SAF_battle_cruiser_1_desc: "เรือลาดตระเวนประจัญบานชั้นรีโนวนเดิมทีวางกระดูกงูเปนรุนปรับปรุงของเรือประจัญบานชั้นรีเวนจ การกอสรางถูกระงับเมื่อสงครามโลกครั้งที่หนึ่งปะทุขึ้น กอนที่พลเรือเอกลอรดฟชเชอรจะผลักดันใหกลับมาสรางตอในฐานะเรือลาดตระเวนประจัญบาน เรือเหลานี้คือแบบฉบับของเรือลาดตระเวนประจัญบานอยางแทจริง มีอาวุธครบครัน รวดเร็ว และคลองตัว แตมีเกราะบางกวาและพิสัยปฏิบัติการสั้นกวา จากเรือสามลําที่วางแผนไวแตแรก มีเพียงสองลําคือรีพัลสและรีโนวนที่สรางเสร็จ"
 SAF_battle_cruiser_2: "ชั้นพรินเซสรอยัล"
 SAF_battle_cruiser_2_desc: "พรินเซสรอยัลเปนเรือลาดตระเวนประจัญบานสมมุติที่เร็วกวาและถูกกวาเรือประจัญบานชั้นคิงจอรจที่ 5 เรือเหลานี้ติดอาวุธคลายกันแตลดจํานวนลงทั้งสําหรับการรบผิวนํ้าและการตอสูอากาศยาน ไดแก ปอมปนสามลํากลองขนาด 14 นิ้วสองปอม และปนตอสูอากาศยานแฝดขนาด 5.25 นิ้วหกปอม ความเร็วสูงและพิสัยไกลจะทําใหราชนาวีมีขีดความสามารถในการโจมตีอยางรวดเร็วและคุมกันขบวนเรือลําเลียง แตเกราะที่จํากัดจะกลายเปนปญหาหากตองปะทะกับเรือประจัญบานสมัยใหม"
 SAF_battleship_1: "ชั้นรีเวนจ"
 SAF_battleship_1_desc: "เรือประจัญบานชั้นรีเวนจไดรับคําสั่งตอในป 1913 ในฐานะรุนราคาถูกของเรือเดรดนอตเร็วชั้นควีนเอลิซาเบธ แมจะมีอาวุธและเกราะใกลเคียงกัน แตความเร็วที่ตํ่ากวามากทําใหเรือเหลานี้ถูกลดบทบาทไปทําภารกิจรองในสงครามโลกครั้งที่สอง จากที่วางแผนไว 8 ลํา มีเพียง 5 ลําที่สรางเสร็จ"
 SAF_battleship_2: "ชั้นคิงจอรจที่ 5"
 SAF_battleship_2_desc: "เรือประจัญบานชั้นคิงจอรจที่ 5 เปนผลมาจากสนธิสัญญานาวีวอชิงตันป 1922 และสนธิสัญญานาวีลอนดอนฉบับแรกป 1930 ซึ่งจํากัดระวางขับนํ้าสูงสุดและขนาดปนของเรือหลัก ดวยเหตุนี้เรือชั้นนี้จึงติดปนใหญขนาดลํากลองเล็กกวาเรือประจัญบานรุนกอนหนาและแมแตรุนรวมสมัย แมลํากลองจะเล็กกวา แตเรือก็มีอาวุธเพียงพอ ติดอาวุธตอสูอากาศยานที่แข็งแกรง และมีการปองกันที่เหมาะสม มีการสั่งตอและวางกระดูกงูหาลําเพื่อทดแทนเรือประจัญบานชั้นควีนเอลิซาเบธที่เกาแลว"
 SAF_battleship_3: "ชั้นไลออน"
 SAF_battleship_3_desc: "เรือประจัญบานชั้นไลออนเปนเรือชั้นถัดมาจากเรือประจัญบานคิงจอรจที่ 5 โดยนําคุณสมบัติหลายอยางมาใช มีการสั่งตอหกลําในโครงการนาวีป 1938 เพื่อทดแทนเรือประจัญบานชั้นรีเวนจที่เกาลง แตไมมีลําใดสรางเสร็จเนื่องจากการสูรบปะทุขึ้น เรือเหลานี้โดยรวมจะคลายกับชั้นคิงจอรจ แตมีอาวุธหลักหนักกวา โดยใชปนใหญขนาด 16 นิ้วแบบใหม อีกทั้งยังมีเกราะหนาขึ้นและเครื่องยนตทรงพลังกวา"
 SAF_battleship_4: "ชั้นแวนการด"
 SAF_battleship_4_desc: "เรือประจัญบานชั้นแวนการดเปนเรือประจัญบานลําสุดทายที่สรางใหราชนาวีอังกฤษ มีการสั่งตอเพียงลําเดียว แตเคยพิจารณาจะสรางเพิ่มอีกสี่ลําเพื่อใชในยุทธบริเวณแปซิฟก เรือถูกสั่งตอภายใตโครงการสงครามฉุกเฉินป 1940 แตการกอสรางไมไดรับความสําคัญสูงนักและแลวเสร็จหลังสงคราม เรือชั้นนี้มีตัวเรือเพรียว ทําใหมีเสถียรภาพและความสามารถในการเดินทะเลยอดเยี่ยม อาวุธหลักเหมือนกับเรือประจัญบานชั้นควีนเอลิซาเบธและชั้นรีเวนจ ใหอํานาจการยิงมหาศาล เครื่องยนตทรงพลังและเกราะที่ดีทําใหเรือทั้งเร็วและไดรับการปกปองอยางดี"
 SAF_SH_battleship_1: "ชั้นเซนจูเรียน"
 SAF_SH_battleship_1_desc: "เซนจูเรียนเปนเรือประจัญบานหนักสมมติของราชนาวีอังกฤษ สรางขึ้นเพื่อรับมือเรือขนาดใหญของกองทัพเรือเยอรมนีและญี่ปุน ปนขนาด 18 นิ้วและเกราะหนาใหอํานาจการยิงและการปกปองที่จําเปนตอการตอกรกับเรือเหลานั้น อาวุธตอสูอากาศยานที่แข็งแกรง พิสัยไกล และความเร็วที่ดีเปนสิ่งจําเปนเพื่อครอบคลุมทองทะเลอันกวางใหญของจักรวรรดิบริติช"
 SAF_SH_battleship_2: "ชั้นไลออน II"
 SAF_SH_battleship_2_desc: "เรือประจัญบานชั้นไลออน II ออกแบบในป 1944 เปนรุนปรับปรุงของเรือประจัญบานชั้นไลออนรุนกอน โดยนําบทเรียนจากสงครามมาใช แบบเรือนี้ใหญและหนักกวา และหากสรางเสร็จจะติดปนสามลํากลองขนาด 16 นิ้วรุนลาสุดสามหรือสี่ปอม แผนเกราะหนาปกปองเรือจากศัตรูทั้งบนผิวนํ้าและทางอากาศ คาใชจายในการสราง ความพายแพของกองทัพเรือขาศึก และความตองการเรือบรรทุกเครื่องบิน ทําใหโครงการถูกยกเลิก"
 SAF_carrier_1: "ชั้นเคอเรจัส"
 SAF_carrier_1_desc: "เรือบรรทุกเครื่องบินทั้งสามลํานี้ดัดแปลงมาจากเรือลาดตระเวนประจัญบาน และเปนเรือบรรทุกเครื่องบินประจํากองเรือรุนแรกของราชนาวีอังกฤษ การดัดแปลงเปนผลจากสนธิสัญญานาวีวอชิงตันป 1922 และแลวเสร็จในป 1925 เรือมีเกราะปานกลางแตติดอาวุธดี มีพิสัยไกลและความเร็วดี แตดวยลักษณะของการดัดแปลง จํานวนอากาศยานที่บรรทุกไดจึงจํากัด ถึงกระนั้น เรือเหลานี้ก็มอบประสบการณสําคัญแกราชนาวีอังกฤษในการสรางเรือบรรทุกเครื่องบินและการแผกําลังทางอากาศของกองเรือ"
 SAF_carrier_2: "ชั้นอารกรอยัล"
 SAF_carrier_2_desc: "เรือบรรทุกเครื่องบินอารกรอยัลเปนเรือลําแรกในประเภทนี้ที่สรางใหสอดคลองกับขอจํากัดของสนธิสัญญานาวีวอชิงตัน เปนเรือลําแรกที่โรงเก็บอากาศยานและดาดฟาบินเปนสวนหนึ่งของตัวเรือ ออกแบบในป 1934 เรือมีเกราะและอาวุธที่ดี บรรทุกอากาศยานไดจํานวนมาก และมีพิสัยปฏิบัติการและความเร็วเพียงพอที่จะเคลื่อนที่ไปพรอมกับกําลังหลักของราชนาวีอังกฤษ"
 SAF_carrier_3: "ชั้นอิลลัสเทรียส"
 SAF_carrier_3_desc: "เรือชั้นอิลลัสเทรียสออกแบบภายใตขอจํากัดของสนธิสัญญานาวีลอนดอนฉบับที่สองป 1936 ซึ่งจํากัดขนาดเรือบรรทุกเครื่องบินไวไมเกิน 23,000 ตัน เปนเรือบรรทุกเครื่องบินลําแรกของอังกฤษที่มีดาดฟาบินหุมเกราะ ซึ่งทําใหจํานวนอากาศยานลดลง เกราะหนาและอาวุธตอสูอากาศยานใหการปองกันที่แข็งแกรง ขณะที่เครื่องยนตทรงพลังและถังเชื้อเพลิงขนาดใหญทําใหเรือมีพิสัยปฏิบัติการไกล "
 SAF_carrier_4: "ชั้นอิมพลาเคเบิล"
 SAF_carrier_4_desc: "เรือบรรทุกเครื่องบินชั้นอิมพลาเคเบิลถูกสั่งตอภายใตโครงการกองทัพเรือป 1938 และโดยพื้นฐานคือรุนปรับปรุงของเรือชั้นอิลลัสเทรียส สงครามและการเปลี่ยนลําดับความสําคัญไปยังเรือขนาดเล็กสําหรับคุมกันขบวนเรือลําเลียงในชวงตนและกลางสงครามทําใหการกอสรางลาชา เรือมีขนาดใหญขึ้น บรรทุกเครื่องบินไดมากขึ้นโดยยังคงเกราะหนาทั้งที่ตัวเรือและดาดฟาบิน เครื่องยนตที่ทรงพลังกวาใหความเร็วและพิสัยปฏิบัติการมากกวาเรือชั้นอิลลัสเทรียส"
 ### SIA - SIAM ###
 SIA_submarine_2: "ชั้นวิรุณ"
 SIA_submarine_2_desc: "เรือดํานํ้าชั้นวิรุณเปนเรือดํานํ้าชายฝงขนาดเล็กสี่ลํา สรางในญี่ปุนใหราชนาวีไทยระหวางป 1936 ถึง 1938 มีระวางขับนํ้า 370 ตัน และติดทอตอรปโดขนาด 533 มม. หาทอ"
 SIA_destroyer_1: "ชั้นพระรวง"
 SIA_destroyer_1_desc: "พระรวงเดิมเปนเรือพิฆาตชั้น R ของอังกฤษ ซึ่งขายใหราชนาวีไทยในป 1920 เรือมีระวางขับนํ้ากวา 1,000 ตันเล็กนอย ติดปน 120mm/45 QF Mk IV สามกระบอกและทอตอรปโดขนาด 533 มม. สี่ทอ มีความเร็ว พิสัย และความนาเชื่อถือดีสําหรับเรือในยุคนั้น"
 SIA_light_cruiser_3: "ชั้นตาสิน"
 SIA_light_cruiser_3_desc: "เรือชั้นตาสินประกอบดวยเรือลาดตระเวนเบาสองลําที่สรางในอิตาลี ปลอยลงนํ้าในป 1941 แตถูกกองทัพเรือสยามเรียกเกณฑไปในป 1942 เรือทั้งสองจะกลายเปนเรือลาดตระเวนตอสูอากาศยานชั้นเอตนาของเรเจียมารีนา แตไมเคยสรางเสร็จกอนการสงบศึกของอิตาลี หากสรางเสร็จจะมีระวางขับนํ้า 5,900 ตัน และติดปน 152mm/53 OTO 1929 หกกระบอกเปนอาวุธหลัก เรือจะมีเกราะพอใชไดแตคอนขางชาสําหรับเรือลาดตระเวน"
 SIA_heavy_cruiser_1: "ชั้นศรีอยุธยา"
 SIA_heavy_cruiser_1_desc: "เรือปองกันชายฝงชั้นศรีอยุธยาอาจเปนเรือประเภทนี้ชุดสุดทายที่สรางขึ้นในโลก ทั้งสองลําสรางในญี่ปุนและเขาประจําการในราชนาวีไทยในป 1938 แบบเรือมีขนาดเทียบไดกับเรือลาดตระเวนขนาดเล็ก (หรือเรือพิฆาตขนาดใหญ) ความเร็วเทียบไดกับเรือประจัญบาน และอาวุธเทียบไดกับเรือลาดตระเวนหนัก ปนหลักคือปน 203mm/53 3-Shiki สี่กระบอก มีเกราะบางเมื่อเทียบกับเรือลาดตระเวนหนักรวมสมัย"
 ### SPA - NATIONALIST SPAIN ###
 SPA_submarine_1: "ชั้น B"
 SPA_submarine_1_desc: "เรือชั้น B เปนเรือดํานํ้าชุดแรกที่สรางในสเปนใหกองทัพเรือสเปน เรือทั้งหกลําในชั้นนี้เขาประจําการระหวางป 1922 ถึง 1925 ออกแบบเปนเรือตัวถังชั้นเดียว สงผลใหความนาเชื่อถือตํ่ากวามาตรฐาน เปนเรือดํานํ้าขนาดกลาง ระวางขับนํ้ากวา 550 ตัน ติดทอตอรปโดขนาด 450 มม. สี่ทอ"
 #SPA_submarine_1b: "C Class"
 SPA_submarine_2: "ชั้นเฆเนรัลโมลา"
 SPA_submarine_2_desc: "§Tเรือชั้นเฆเนรัลโมลาคือเรือดํานํ้าชั้นอารคิเมดีสของอิตาลีสี่ลํา ซึ่งเขาประจําการในป 1934 และโอนใหฝายชาตินิยมในป 1937 เรือคอนขางใหญ ระวางขับนํ้า 880 ตัน แตเร็วกวาเรือดํานํ้าสวนใหญ ติดทอตอรปโดขนาด 533 มม. แปดทอ และดําไดลึก 90 ม.§!"
 SPA_submarine_3: "ชั้น G"
 SPA_submarine_3_desc: "เรือดํานํ้าชั้น G ของสเปนคือเรือดํานํ้า VIIC ของเยอรมนีสองลําที่สเปนฝายชาตินิยมไดรับสิทธิบัตรมาสรางเอง แตสรางเสร็จเพียงลําเดียว และไมไดโอนใหกองทัพเรือสเปนจนถึงป 1947 เรือมีระวางขับนํ้า 770 ตัน ติดทอตอรปโดขนาด 533 มม. หาทอ มีความเร็วและพิสัยยอดเยี่ยม เพราะ Type VIIC คือกําลังหลักของกองเรือดํานํ้าเยอรมนี"
 SPA_submarine_4: "ชั้น D"
 SPA_submarine_4_desc: "เรือดํานํ้าทั้งสามลําของชั้น D ของสเปนปลอยลงนํ้าในป 1944 และเขาประจําการในชวงเวลาตาง ๆ หลังสงคราม ทั้งสามลําออกแบบและสรางในสเปน เปนเรือดํานํ้าขนาดใหญสําหรับเดินสมุทร ระวางขับนํ้า 1,050 ตัน ติดทอตอรปโดขนาด 533 มม. หกทอ และมีความเร็วและพิสัยยอดเยี่ยม"
 SPA_destroyer_1: "ชั้นอัลเซโด"
 SPA_destroyer_1_desc: "เรือพิฆาตทั้งสามลําของชั้นอัลเซโดสรางในสเปนใหกองทัพเรือสเปน โดยอิงแบบเรือชั้น L ของอังกฤษ และเขาประจําการระหวางป 1924 ถึง 1925 มีระวางขับนํ้ากวา 1,040 ตัน ติดปน 102mm/45 Vickers Mk LA สามกระบอกเปนอาวุธหลัก และทอตอรปโดขนาด 450 มม. สี่ทอ ทั้งยังมีความเร็วและพิสัยพอใชไดสําหรับเรือในยุคนั้น"
 SPA_destroyer_2: "ชั้นชูรรูกา"
 SPA_destroyer_2_desc: "เรือชั้นชูรรูกาของสเปนประกอบดวยเรือพิฆาตสิบหกลําที่ปลอยลงนํ้าระหวางป 1925 ถึง 1933 โดยสองลําถูกขายใหอารเจนตินาในภายหลัง เรือออกแบบโดยอิงเรือพิฆาตชั้น S ของอังกฤษ และเปนกําลังหลักของกองทัพเรือสเปนในชวงสงครามกลางเมือง มีระวางขับนํ้ากวา 1,500 ตัน ติดปน 120mm/45 Vickers-Armstrong หากระบอกเปนอาวุธหลัก และทอตอรปโดขนาด 533 มม. หกทอ มีความเร็วดีและพิสัยยอดเยี่ยม "
 SPA_destroyer_4: "ชั้นอาลาบา"
 SPA_destroyer_4_desc: "เรือพิฆาตชั้นอาลาบาปลอยลงนํ้าหลังสงคราม เปนรุนปรับปรุงของชั้นอัลมีรันเตอันเตเกรา (ซึ่งเปนชั้นยอยของชั้นชูรรูการุนกอน) มีระวางขับนํ้า 1,710 ตัน ติดปน 120mm/45 Vickers-Armstrong Mk F สี่กระบอกเปนปนหลัก ความเร็วและพิสัยใกลเคียงกับแบบเรือรุนกอนที่เปนตนแบบ"
 SPA_light_cruiser_1: "ชั้นเมนเดซนูเญซ"
 SPA_light_cruiser_1_desc: "เรือลาดตระเวนเบาชั้นเมนเดซนูเญซเปนเรือลาดตระเวนสองลําที่สรางในสเปนใหกองทัพเรือสเปนในตนทศวรรษ 1920 เรือถูกสั่งตอในป 1915 แตการขาดแคลนวัสดุในชวงสงครามโลกครั้งที่หนึ่งทําใหการกอสรางลาชา แบบเรือไดรับอิทธิพลอยางมากจากเรือลาดตระเวนชั้น C ของอังกฤษ เรือมีระวางขับนํ้าเกือบ 4,800 ตันแตคอนขางชา อาวุธหลักประกอบดวยปน 152mm/50 Vickers Mk V หกกระบอก ทั้งยังมีเกราะดีและทอตอรปโดขนาด 533 มม. สิบสองทอ"
 #SPA_light_cruiser_1b: "Príncipe Alfonso Class"
 SPA_heavy_cruiser_1: "ชั้นปรินเซซาเดอัสตูเรียส"
 SPA_heavy_cruiser_1_desc: "เรือชั้นปรินเซซาเดอัสตูเรียสประกอบดวยเรือลาดตระเวนหุมเกราะสามลําที่สรางใหกองทัพเรือสเปนราวชวงเปลี่ยนศตวรรษ ทั้งสามลําถูกแยกชิ้นหรืออับปางไปหมดแลวภายในกลางทศวรรษ 1930 ติดปนแฝด 240mm Guillén M1896 และปน 140mm/33 Schneider-Canet แปดกระบอก มีเกราะหนาแตคอนขางชาเมื่อเทียบกับเรือลาดตระเวนหนักทั่วไป"
 SPA_heavy_cruiser_2: "ชั้นกานาริอัส"
 SPA_heavy_cruiser_2_desc: "เรือลาดตระเวนหนักสองลําของชั้นกานาริอัสสรางตามขอกําหนดของสนธิสัญญานาวีวอชิงตัน ปลอยลงนํ้าในตนทศวรรษ 1930 แตสรางเสร็จในป 1936 มีระวางขับนํ้าเกือบ 10,700 ตันและมีความเร็วดี เกราะคอนขางบาง แตติดปน 203mm/50 Vickers-Armstrong Mk D แปดกระบอกเปนอาวุธหลัก"
 SPA_battleship_1: "ชั้นเอสปญญา"
 SPA_battleship_1_desc: "เดิมเรือชั้นเอสปญญาเปนเรือประจัญบานเดรดนอตสามลําที่เขาประจําการราวชวงสงครามโลกครั้งที่หนึ่ง แตลําหนึ่งอับปางไปกอนสงครามกลางเมืองสเปน อีกสองลําสูญเสียระหวางสงคราม เรือคอนขางเล็กสําหรับเรือประจัญบาน ระวางขับนํ้าเพียงกวา 15,400 ตัน อยางไรก็ตามมีเกราะและความเร็วพอใชได และมีปนหลัก 305mm/50 Vickers H แปดกระบอก "
