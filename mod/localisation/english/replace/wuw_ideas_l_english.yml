 COG_force_publique: "ฟอรซ ปูบลิก"
 COG_force_publique_desc: "ฟอรซ ปูบลิก (Force Publique) คือกองกําลังตํารวจภูธรและกองกําลังทหารของคองโก กอตั้งขึ้นในป 1877 ในสมัยรัฐเสรีคองโก นายทหารทั้งหมดเปนชาวยุโรป ไมวาจะเปนชาวเบลเยียมหรือทหารรับจาง สวนพลทหารสวนใหญเปนชาวคองโกพื้นเมือง กองกําลังนี้สูรบไดอยางมีประสิทธิภาพมากในยามคับขัน แตความเหลื่อมลํ้าและการบริหารที่ยํ่าแยเปนตนเหตุของความไมพอใจอยางมาก"

