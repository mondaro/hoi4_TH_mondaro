 HUN_bastion_of_catholicism_desc: "ชาติของเรานับถือคาทอลิกอยางเครงครัด และทหารของเราจะทําหนาที่เปนผูพิทักษศรัทธาอันยิ่งใหญ เปนผูรับใชของพระสันตะปาปาเอง"
 HUN_a_multi_ethnic_empire: "จักรวรรดิพหุชาติพันธุ"
 HUN_a_multi_ethnic_empire_desc: "จักรวรรดิของเรารวมผูคนและวัฒนธรรมที่หลากหลาย และเรานอมรับสิ่งนี้อยางเต็มที่ โดยมอบอํานาจปกครองตนเองอยางกวางขวางแกทองถิ่นตางๆ ในอาณาจักรของเรา ทําใหประชาชนอยากเปนสวนหนึ่งของเราตอไป"
