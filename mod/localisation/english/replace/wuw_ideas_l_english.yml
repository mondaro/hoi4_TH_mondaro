 HUN_apostolic_kingdom_idea: "ราชอาณาจักรอัครสาวก"
 HUN_apostolic_kingdom_idea_desc: "ดังที่ไดรับพระอิสริยยศสืบมาหลายศตวรรษนับแตสมัยนักบุญสตีเฟน องคอัครสาวกพระมหากษัตริยของเรายอมเปนอัครสาวกแหงคริสตศาสนาในยุคหลังอยางชัดแจง ทรงมีสิทธิ์อางเหนือดินแดนคริสเตียนทั้งปวง และทรงมีสิทธิ์ปกครองในพระนามแหงพระบุตร เราตองทวงคืนทุกสิ่งที่เปนของเราโดยชอบธรรม!"
