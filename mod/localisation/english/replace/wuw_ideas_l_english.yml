 BEL_language_barriers_ns: "อุปสรรคทางภาษา"
 BEL_language_barriers_ns_desc: "เบลเยียมถูกแบงออกเปนสองกลุมภาษา คือภาษาฝรั่งเศสซึ่งชาววอลลูนใช และภาษาดัตชซึ่งชาวเฟลมิชใช ทั้งสองฝายตางภาคภูมิใจในวัฒนธรรมและมรดกของตนอยางยิ่ง และภาษาก็ผูกพันแนบแนนกับสิ่งเหลานี้ จึงไมมีฝายใดยอมละทิ้งภาษาของตน หรือยอมใหภาษาของตนตกอยูใตอีกฝาย"
 BEL_language_barriers_fas_nl_ns: "ภาษาดัตชเปนภาษาหลัก"
 BEL_language_barriers_fas_nl_ns_desc: "ภาษาดัตชไดรับเลือกใหเปนภาษาหลักที่ใชใน[ROOT.GetName] โดยสงเสริมวัฒนธรรมเฟลมิชและกดวัฒนธรรมวอลลูนไวในนามของความเปนเอกภาพ"
 BEL_language_barriers_fas_fr_ns: "ภาษาฝรั่งเศสเปนภาษาหลัก"
 BEL_language_barriers_fas_fr_ns_desc: "ภาษาฝรั่งเศสไดรับเลือกใหเปนภาษาหลักที่ใชใน[ROOT.GetName] โดยสงเสริมวัฒนธรรมวอลลูนและกดวัฒนธรรมเฟลมิชไวในนามของความเปนเอกภาพ"
 BEL_traditional_family_values_ns: "คานิยมครอบครัวแบบดั้งเดิม"
 BEL_traditional_family_values_ns_desc: "ครอบครัวเปนหนึ่งในสิ่งสําคัญที่สุดในชีวิตของคนเรา และเรายึดถือมาตรฐานเฉพาะในเรื่องนี้ มีการกําหนดบทบาทและความคาดหวังทางเพศไวอยางชัดเจนภายในครอบครัว เพื่อมุงสูการเติบโตและเสถียรภาพของประชากรของเรา"
 BEL_defensive_neutrality_capstone_ns: "การปรับโครงสรางเชิงรับ"
 BEL_defensive_neutrality_capstone_ns_desc: "เราไดทําทุกอยางเทาที่ทําไดเพื่อเตรียมรับการรุกราน สิ่งเดียวที่เหลืออยูคือการกําหนดการเปลี่ยนแปลงหลักนิยมในระดับยุทธศาสตรและระดับสูง ตามแนวคิดการปองกันที่ทันสมัยที่สุด"
 BEL_lack_of_junior_officers_ns: "ขาดแคลนนายทหารชั้นผูนอย"
 BEL_lack_of_junior_officers_ns_desc: "การระดมพลอยางรวดเร็วของเราโดยรวมดําเนินไปไดดี ยกเวนปญหาเดียว คือการขาดแคลนนายทหารชั้นผูนอยที่จะจัดระเบียบทหารใหม! คงตองใชเวลาสักระยะกวาที่สายการบังคับบัญชาจะจัดระเบียบตัวเองใหมได"
 BEL_legacy_of_the_great_war_ns: "มรดกแหงมหาสงคราม"
 BEL_legacy_of_the_great_war_ns_desc: "ทุงแหงแฟลนเดอสเคยเปนสมรภูมิที่ดุเดือดที่สุดแหงหนึ่งในแนวรบดานตะวันตก เปนพื้นที่ที่พระเจาอัลแบร ทหารเบลเยียมผูกลาหาญของพระองค และการเสียสละของพันธมิตรของเรารวมกันปกปองอยางเหนียวแนน เราควรเชิดชูความทรงจํานี้และมุงมั่นดําเนินตามแบบอยางของพวกเขา"
 BEL_pressurized_cabins_ns: "หองโดยสารปรับความดัน"
 BEL_pressurized_cabins_ns_desc: "เพื่อยนระยะทางระหวางเบลเยียมกับอาณานิคมของเราในคองโก เราไดบุกเบิกการใชหองโดยสารปรับความดันในอากาศยานของเรา"
 BEL_license_air_idea: "ใบอนุญาตผลิตอากาศยาน"
 BEL_license_air_idea_desc: "เราจําเปนตองไดอากาศยานมาอยางรวดเร็ว จึงไดลงนามสัญญาหลายฉบับกับบริษัทตางชาติ"
 BEL_license_POL_air_idea: "ใบอนุญาตผลิตเครื่องบินโปแลนด"
 BEL_license_POL_air_idea-desc: "ดวยความสัมพันธอันดีกับหุนสวนชาวโปแลนด เราจึงไดรับใบอนุญาตผลิตยุทโธปกรณทางทหารหลายรายการในราคาที่สมเหตุสมผลมาก"
 BEL_legacy_of_the_belgian_airforce_ns: "มรดกแหงกองทัพอากาศเบลเยียม"
 BEL_legacy_of_the_belgian_airforce_ns_desc: "เบลเยียมเปนหนึ่งในชาติแรก ๆ ที่หันมาใหความสําคัญกับกําลังทางอากาศ และนักบินของเราตอสูอยางกลาหาญยิ่งในมหาสงคราม มรดกของพวกเขาไดรับการยอมรับจากนักบินรุนปจจุบันของเรา ซึ่งไมปรารถนาสิ่งใดมากไปกวาการเดินตามรอยพวกเขา"
 BEL_re_build_the_fleet_ns: "ฟนฟูกองเรือ"
 BEL_re_build_the_fleet_ns_desc: "กองทัพเรือของเราถูกยุบไปในป 1927 แตสถานการณโลกทําใหเราตองลงทุนในกองเรืออีกครั้ง เพื่อรักษาเสนทางการคากับคองโกใหเปดอยู และเพื่อแสวงหาผลประโยชนทางทะเลของเรา"
 BEL_maritime_support_ns: "การสนับสนุนทางทะเล"
 BEL_maritime_support_ns_desc: "เมื่อโครงสรางพื้นฐานทางทหารเรือของเราเริ่มเปดใชงานมากขึ้น ขีดความสามารถของกองเรือก็ขยายตัวขึ้นอยางมาก"
 BEL_convoy_protection_duties_ns: "ภารกิจคุมกันขบวนเรือลําเลียง"
 BEL_convoy_protection_duties_ns_desc: "เสนทางเดินเรือทางทะเลอันตรายขึ้นเรื่อย ๆ เราจึงติดอาวุธใหลูกเรือพาณิชยนาวีของเรา เพื่อใหขบวนเรือลําเลียงมีการปองกันอยูบางหากถูกโจมตี แมจะเพียงชวยใหหลบหนีไดงายขึ้นก็ตาม"
 BEL_maritime_phoenix_ns: "ฟนิกซแหงทองทะเล"
 BEL_maritime_phoenix_ns_desc: "ดุจดั่งนกฟนิกซที่ผงาดขึ้นจากเถาถาน กองเรือของเราก็ผงาดขึ้นจากซากเรือที่ถูกปลดระวาง"
 BEL_economic_recovery_ns: "การฟนตัวทางเศรษฐกิจ"
 BEL_economic_recovery_ns_desc: "เศรษฐกิจที่ออนแอของเราเริ่มแสดงสัญญาณการฟนตัวครั้งแรก การใชจายเพิ่มขึ้น หนี้ลดลง และนักเก็งกําไรก็มีความเชื่อมั่นในตลาดมากขึ้น"
 BEL_collapsing_government_ns: "รัฐบาลที่กําลังลมสลาย"
 BEL_collapsing_government_ns_desc: "ขอกลาวหาเรื่องการทุจริตสั่นคลอนรัฐบาลอยางหนักจนหนูตางพากันหนีออกจากเรือที่กําลังจม มีการลาออกแทบทุกวัน และเห็นไดชัดวาคณะรัฐมนตรีชุดนี้คงอยูไดอีกไมนาน"
 BEL_the_kings_surrender_ns: "การยอมจํานนของกษัตริย"
 BEL_the_kings_surrender_ns_desc: "พระเจาเลโอโปลดที่ 3 ทรงเสนอยอมจํานนในนามของชาติเราไปแลว ซึ่งสั่นคลอนขวัญกําลังใจของทหาร และบั่นทอนความสามารถในการตอสูตอไปของเราอยางรุนแรง"
 BEL_prisoner_king_ns: "กษัตริยผูถูกจองจํา"
 BEL_prisoner_king_ns_desc: "พระเจาเลโอโปลดที่ 3 ทรงประทับอยูเคียงขางประชาชนหลังชาติของเรายอมจํานน บัดนี้พระองคทรงเปนศูนยรวมใจที่ชาวเบลเยียมทุกคนจะมารวมตัวกันและเตรียมพรอมสําหรับการฟนฟูการปกครองของเบลเยียม"
 BEL_dame_blanche_ns: "ดาม บลองช"
 BEL_dame_blanche_ns_desc: "องคกรตอตานที่ถือกําเนิดขึ้นในมหาสงครามดูเหมือนเพียงแคจําศีลไป เพราะบัดนี้ไดกลับมาเคลื่อนไหวอีกครั้งเมื่อเบลเยียมถูกคุกคามอีกหน กลุมนี้สงขอมูลใหพันธมิตรของเราและประสานงานการตอตานจากเงามืด"
 BEL_king_law_freedom_ns: "กษัตริย กฎหมาย เสรีภาพ"
 BEL_king_law_freedom_ns_desc: "คําขวัญของเบลเยียมสะทอนจิตวิญญาณของชาวเบลเยียมไดเปนอยางดี กษัตริย ผูจะนําเราสูชัยชนะ กฎหมาย ดาบที่ฟาดฟนความโกลาหลแหงสงคราม เสรีภาพ เพื่อเบลเยียมและชาวเบลเยียม"
 BEL_chasseurs_ardennais_ns: "ทหารพรานอารแดน"
 BEL_chasseurs_ardennais_ns_desc: "ทหารพรานอารแดน (Chasseurs Ardennais) คือผูพิทักษปาอารแดนของเบลเยียมที่ชํ่าชอง มีประสบการณสูงและผานการฝกการรบในปามาอยางดี"
 BEL_chasseurs_ardennais_ns_ncns: "$BEL_chasseurs_ardennais_ns$"
 BEL_chasseurs_ardennais_ns_ncns_desc: "$BEL_chasseurs_ardennais_ns_desc$"
 BEL_dissolve_political_parties_ns: "ยุบพรรคการเมือง"
 BEL_dissolve_political_parties_ns_desc: "นายกรัฐมนตรีของเราประกาศวาพรรคการเมืองคือแกนที่เนาเฟะของระบบการเมืองอันฉอฉล และเพื่อรักษาโรครายนี้ จะตองยุบพรรคการเมืองทั้งหมด"
 BEL_the_walloon_legion_ns: "กองทหารอาสาวอลลูน"
 BEL_the_walloon_legion_ns_desc: "กองทหารอาสาวอลลูนกอตั้งขึ้นจากอาสาสมัครที่พูดภาษาฝรั่งเศส ซึ่งปรารถนาจะพิสูจนคุณคาของตนในความพยายามทางสงคราม ดวยเกรงวาจะถูกพี่นองชาวเฟลมิชบดบังรัศมี"
 BEL_surrender_tt: "§Rการเลือกตัวเลือกนี้จะทําใหชาติของคุณยอมจํานน!§! \n\nหากคุณอยูในฝาย คุณจะยังคงสูตอในฐานะรัฐบาลพลัดถิ่น"
 BEL_scars_of_ww1_ns_fake: "$BEL_scars_of_ww1_dynamic_modifier$"
 BEL_scars_of_ww1_ns_fake_desc: "$BEL_scars_of_ww1_dynamic_modifier_desc$"
 BEL_corruption_ns_fake: "$BEL_corruption_dynamic_modifier$"
 BEL_corruption_ns_fake_desc: "$BEL_corruption_dynamic_modifier_desc$"
 BEL_democratization_of_education_ns: "การศึกษาเพื่อมวลชน"
 BEL_democratization_of_education_ns_desc: "สังคมของเรามีธรรมเนียมแหงการดูแลเอาใจใสซึ่งกันและกัน ซึ่งเห็นไดชัดที่สุดจากสัญญาประชาคมระหวางแรงงานกับบริษัท ในทํานองเดียวกัน รัฐควรมุงมอบความเทาเทียมทางโอกาสแกทุกคน และเนนยํ้าความสําคัญของการศึกษาที่ดี"

 ###### BELGIAN DYNAMIC MODIFIERS #########

 BEL_scars_of_ww1_dynamic_modifier: "บาดแผลแหงมหาสงคราม"
 BEL_scars_of_ww1_dynamic_modifier_desc: "[BEL.GetName]ไดรับความเสียหายอยางหนักในมหาสงคราม เพราะเปนสมรภูมิสวนใหญของแนวรบดานตะวันตก และยังคงมีบาดแผลเหลานั้นอยูจนทุกวันนี้"
 BEL_social_partners_dynamic_modifier: "หุนสวนทางสังคม"
 BEL_social_partners_dynamic_modifier_desc: "[ROOT.GetName]ไดนําสหภาพแรงงานและตัวแทนบริษัทมาพบกัน และเปนตัวกลางใหเกิดขอตกลงประนีประนอม ซึ่งรวมถึงการกําหนดคาแรงขั้นตํ่าและวันหยุดพักผอนแบบไดรับคาจางหกวัน"
 BEL_engine_of_the_economy_dynamic_modifier: "หัวรถจักรแหงเศรษฐกิจ"
 BEL_engine_of_the_economy_dynamic_modifier_desc: "ทุกคนขึ้นรถดวนสูความมั่งคั่ง! เมื่อวงลอแหงอุตสาหกรรมหมุน เราก็เรงแรงสง พุงทะยานไปขางหนา และสงสัญญาณถึงการเริ่มตนของยุคใหม"
 BEL_belgian_miracle_dynamic_modifier: "ปาฏิหาริยเบลเยียม"
 BEL_belgian_miracle_dynamic_modifier_desc: "นโยบายของ[ROOT.GetLeader]ไดผลอยางแทจริง และ[ROOT.GetName]ไดกาวขึ้นมาโดดเดนบนเวทีโลก อุตสาหกรรมของเราเปนที่อัศจรรยใจของบรรดาสิ่งที่เรียกวามหาอํานาจหลายชาติ"
 BEL_neutrality_dynamic_modifier: "ความเปนกลางถาวร"
 BEL_neutrality_dynamic_modifier_desc: "เบลเยียมเปนรัฐเอกราชที่เปนกลางถาวร และจะยึดถือความเปนกลางเชนเดียวกันนี้ตอรัฐอื่นทั้งปวง"
 BEL_defensive_neutrality_dynamic_modifier: "ความเปนกลางเชิงปองกัน"
 BEL_defensive_neutrality_dynamic_modifier_desc: "เพื่อปกปองความเปนกลางของเรา เราตองทําใหแนใจวาการปองกันของเราแข็งแกรงจนไมมีผูรุกรานรายใดอยากโจมตีเรา"
 BEL_austrian_resistance_active_state_dynamic_modifier: "แนวรวมเสรีภาพออสเตรีย"
 BEL_austrian_resistance_active_state_dynamic_modifier_desc: "แนวรวมเสรีภาพออสเตรียเคลื่อนไหวอยูในรัฐนี้ ทําใหมีแหลงเกณฑพลที่ใหญขึ้น และมีการตอตานมากขึ้นหากรัฐนี้ถูกยึดครอง"
 BEL_mobilize_the_nation_dynamic_modifier: "ระดมพลทั้งชาติ"
 BEL_mobilize_the_nation_dynamic_modifier_desc: "ประชาชนคือทรัพยสินที่มีคาที่สุดของเรา จงระดมพวกเขาเพื่อสรางกองกําลังใหใหญที่สุดเทาที่จะทําได"
 BEL_defensive_reorganization_dynamic_modifier: "การปรับโครงสรางเชิงรับ"
 BEL_defensive_reorganization_dynamic_modifier_desc: "เราไดกําหนดการเปลี่ยนแปลงหลักนิยมในระดับยุทธศาสตรและระดับสูงเพิ่มเติม และอยูในกลุมผูนําของโลกดานทฤษฎีการปองกันสมัยใหม"
 BEL_royal_military_academy_dynamic_modifier: "โรงเรียนนายรอยหลวง"
 BEL_royal_military_academy_dynamic_modifier_desc: "เราสงคนที่เกงและฉลาดที่สุดไปยังโรงเรียนนายรอยหลวง ที่ซึ่งนายทหารรุนตอไปจะไดรับการฝกทางทหารระดับโลกในวิชาเฉพาะทางหลากหลายสาขา"
 BEL_corruption_dynamic_modifier: "การทุจริต"
 BEL_corruption_dynamic_modifier_desc: "การทุจริตแพรระบาดในรัฐบาลของเรา มีเรื่องอื้อฉาวตอเนื่องหลายกรณีที่เกี่ยวพันกับอาชญากรรมหลากหลาย ทั้งการติดสินบนและการยักยอกทรัพย ความเชื่อมั่นของประชาชนตอสถาบันประชาธิปไตยของเราไมเคยตกตํ่าเทานี้มากอน"
 BEL_economic_downturn_dynamic_modifier: "เศรษฐกิจตกตํ่า"
 BEL_economic_downturn_dynamic_modifier_desc: "เศรษฐกิจของเรายํ่าแยมาตั้งแตสงครามครั้งกอนเปลี่ยนชาติของเราใหกลายเปนสมรภูมิ และการฟนตัวยิ่งถูกขัดขวางดวยผลกระทบของภาวะเศรษฐกิจตกตํ่าครั้งใหญทั่วโลกที่เรายังคงดิ้นรนฟนตัวอยู"
 BEL_belgian_legion_dynamic_modifier: "กองทหารอาสาเบลเยียม"
 BEL_belgian_legion_dynamic_modifier_desc: "กลุมผูจงรักภักดีฝายอนุรักษนิยมและฝายนิยมกษัตริยพรอมและกระตือรือรนที่จะจับอาวุธในพระนามของกษัตริย"
 BEL_gold_reserves_dynamic_modifier: "ทุนสํารองทองคํา[BEL.GetAdjective]"
 BEL_rexist_legion_dynamic_modifier: "กองทหารอาสาเรกซิสต"
 BEL_rexist_legion_dynamic_modifier_desc: "การรวมศาสนจักรกับรัฐในขบวนการเรกซิสตทําใหเราสามารถจัดตั้งขบวนการทางทหารตามแบบอยางคณะอัศวินทหารในอดีตได"
 BEL_european_crusade_dynamic_modifier: "สงครามครูเสดยุโรป"
 BEL_european_crusade_dynamic_modifier_desc: "เราคือหัวใจที่เตนอยูแหงอุดมคติยุโรป และเมื่อแรงวนเวียนอยูรอบพรมแดน ก็ขึ้นอยูกับความมุงมั่นอันแนวแนของเราที่จะสกัดกั้นภัยคุกคามจากพวกปาเถื่อน ไมวาจะมาในรูปแบบใด"
 BEL_socialism_on_the_rise_dynamic_modifier: "กระแสสังคมนิยม"
 BEL_socialism_on_the_rise_dynamic_modifier_desc: "หลังจากวันเดอรเฟลเดอไดรับชัยชนะพอสมควรในการเลือกตั้ง กระแสสังคมนิยมก็เพิ่มขึ้นอยางตอเนื่องใน[ROOT.GetNameDef]"
BEL_academies_of_belgium_dynamic_modifier: "ราชบัณฑิตยสถานแหงเบลเยียม"
BEL_academies_of_belgium_dynamic_modifier_desc: "ราชบัณฑิตยสถานแหงเบลเยียมเปนองคกรรวมของสถาบันอุดมศึกษาทั่วประเทศ และเปนหัวใจของความกาวหนาทางเทคโนโลยีของเบลเยียม"

