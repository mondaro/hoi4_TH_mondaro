 GER_economy_of_conquest_modifier: "เศรษฐกิจแหงการพิชิต"
 GER_economy_of_conquest_modifier_desc: "แมขอกําหนดอันไมเปนธรรมของสนธิสัญญาแวรซาย เราก็ลุกขึ้นจากเถาถานดวยความมุงมั่นอันแนวแน ดวยการเสริมกําลังอาวุธอยางไมรูเหน็ดเหนื่อย เราตั้งใจจะสรางอุตสาหกรรมการทหารที่ไรคูแขงเพื่อขับเคลื่อนเราสูความรุงโรจน สิ่งนี้จะสรางแรงกดดันตอเศรษฐกิจ แตชัยชนะจะนํามาซึ่งโอกาสเก็บเกี่ยวผลประโยชนจากการพิชิต และนําความมั่งคั่งของชาติอื่นมาเสริมกําลังกองทัพของเรา วิบัติจงมีแดผูพายแพ!"
 GER_aufrusting_modifier: "เอาฟรึสทุง"
 GER_aufrusting_modifier_desc: "ทุกโรงงานที่สราง ทุกมารคที่ใชจาย และทุกทรัพยากรที่ลงทุน ลวนขับเคลื่อนเปาหมายอันทะเยอทะยานของเราในการสรางเครื่องจักรสงครามที่นาเกรงขาม การเสริมกําลังอาวุธ หรือเอาฟรึสทุง เปนสิ่งสําคัญยิ่งตอการปกปองอนาคตของชาติและเสริมความแข็งแกรงใหอธิปไตยของเยอรมนี"
 GER_recovering_economy_modifier: "เศรษฐกิจที่กําลังฟนตัว"
 GER_recovering_economy_modifier_desc: "เศรษฐกิจและอุตสาหกรรมของเราอยูบนปากเหวแหงการลมสลาย หลังการใชจายทรัพยากรที่เราแทบไมมีกําลังจายไปกับการเสริมกําลังอาวุธอยางไมยั้งคิด ดวยนโยบายการคลังที่รอบคอบและความมุงมั่นอยางแรงกลา เราจะฟนฟูชาติและแข็งแกรงยิ่งกวาที่เคย!"
 GER_wirtschaftswunder_modifier: "เวิรทชัฟทสวุนเดอร"
 GER_wirtschaftswunder_modifier_desc: "เราไดเปลี่ยนเศรษฐกิจที่พังยับเยินใหกลายเปนหนึ่งในมหาอํานาจอุตสาหกรรมชั้นนําของโลก การฟนตัวอันนาทึ่งนี้เรียกไดเพียงวาเวิรทชัฟทสวุนเดอร ปาฏิหาริยทางเศรษฐกิจ"
 GER_kriegsproduktion_modifier: "ครีกสโพรดุคทีโอน"
 GER_kriegsproduktion_modifier_desc: "เราตองระดมแรงงานฝมือสูงของเราและนําพวกเขาไปผลิตอาวุธ เพื่อรักษาเอกราชของ[GER.GetAdjective]และสรางคลังสรรพาวุธที่จําเปน" 
 GER_wunderwaffen_modifier: "อาวุธมหัศจรรย"
 GER_wunderwaffen_modifier_desc: "โครงการวุนเดอรวัฟเฟอเปนความริเริ่มอันกลาหาญที่มุงสรางอนาคตแหงการสงครามผานความกาวหนาทางเทคโนโลยีอยางถึงราก นักวิทยาศาสตรและวิศวกรของเรากําลังผลักดันขีดจํากัดของความเปนไปได พัฒนาอาวุธปฏิวัติวงการที่จะรับประกันความเปนเจาของเยอรมนีทั้งบนทองฟา เหนือทองทะเล และบนแผนดิน นวัตกรรมเหลานี้มีศักยภาพที่จะเปลี่ยนเสนทางของโลก และมอบการโจมตีอันชี้ขาดแกศัตรูใดก็ตามที่กลาตอตานเรา!"
 GER_wehrwirtschaft_modifier: "แวรวิรทชัฟท"
 GER_wehrwirtschaft_modifier_desc: "เราไมอาจปลอยใหมหาอํานาจตางชาติกําหนดความรุงเรืองหรืออนาคตของเรา การบรรลุการพึ่งพาตนเองจะรักษาเอกราชทางเศรษฐกิจของ[ROOT.GetNameDef] ลดการพึ่งพาทรัพยากรตางชาติ และทําใหประชาชนของเราพึ่งพาตนเองได" 
 GER_army_modifier: "ดอยทเชส แฮร"
 GER_army_modifier_desc: "[GER.GetNameDefCap]มีประวัติศาสตรการทหารอันยาวนานและนาภาคภูมิใจ พรอมประเพณีแหงการคิดเชิงนวัตกรรม เสนาธิการทหารพยายามปรับปรุงกองทัพของเราใหดียิ่งขึ้นนับตั้งแตความพายแพอันนาอัปยศในมหาสงคราม ดวยความเชี่ยวชาญนี้ กองทัพของเราพรอมจะโจมตีศัตรูใดก็ตามที่ปรารถนาจะกดขี่ประชาชนผูภาคภูมิของเรา"
 GER_army_communist_modifier: "ฟอลคสอารเม"
 GER_army_communist_modifier_desc: "กองทัพประชาชนยืนหยัดเปนโลแหงสังคมนิยม พรอมปกปองและเผยแพรการปฏิวัติของชนชั้นกรรมาชีพ การคิดเชิงนวัตกรรมของเสนาธิการประชาชนทําใหมั่นใจไดวาการรุกรานของจักรวรรดินิยมใดๆ จะไมอาจดับจิตวิญญาณแหงการปฏิวัติของชาวเยอรมันได"
 GER_navy_fascist_modifier: "ครีกสมารีเนอ"
 GER_navy_fascist_modifier_desc: "ดวยการปรับปรุงใหทันสมัยและยุทธศาสตรอันกลาหาญ เราทาทายมหาสมุทร สรางความหวาดกลัวแกศัตรู เรือประจัญบานอันทรงพลังของเราจะครองเหนือคลื่น และเรืออูของเราจะครองใตคลื่น"
 GER_navy_democratic_modifier: "ดอยทเชอ มารีเนอ"
 GER_navy_democratic_modifier_desc: "กองทัพเรือเยอรมันทาทายทองทะเลเพื่อปกปองผลประโยชนทางทะเลของเรา และทําใหอิทธิพลของเราแผไปทั่วโลก"
 GER_navy_imperial_modifier: "ไกเซอรลิเชอ มารีเนอ"
 GER_navy_imperial_modifier_desc: "กองทัพเรือจักรวรรดิอันทรงพลังของเราจะฝาคลื่นมหาสมุทรเพื่อเปนหัวหอกของความทะเยอทะยานระดับโลก และยืนยันความเปนเจาของเราทั่วนานนํ้าสากล"
 GER_navy_communist_modifier: "ฟอลคสมารีเนอ"
 GER_navy_communist_modifier_desc: "กองทัพเรือประชาชนเฝาระวังการรุกรานของจักรวรรดินิยมอยูเสมอ มันจะเผยแพรการปฏิวัติของชนชั้นกรรมาชีพไปทั่วทองทะเล และนํามาซึ่งระเบียบโลกใหม"
 GER_airforce_modifier: "ลุฟทวัฟเฟอ"
 GER_airforce_modifier_desc: "ดวยทักษะและความสามารถทางเทคนิคที่ไรผูเทียบ ลุฟทวัฟเฟอพรอมครองนานฟาและแสดงพลังของเราตอศัตรูที่โงเขลาพอจะทาทายเรา ดวยอากาศยานลํ้าสมัยและนักบินที่ผานการฝกอยางเชี่ยวชาญ กองทัพอากาศของเราพรอมจะจุดไฟเผาทองฟา ทําลายกองทัพใดๆ และจมทุกกองเรือที่ตอตานเรา"
 GER_airforce_communist_modifier: "ลุฟทชไตรทแครฟเทอ"
 GER_airforce_communist_modifier_desc: "กองทัพอากาศของเราทะยานไปทั่วฟากฟาเพื่อปกปองรัฐกรรมาชีพและอนาคตของสังคมนิยม อากาศยานทุกลําบินขึ้นเปนประจักษพยานถึงความเฉลียวฉลาดและจิตวิญญาณอันไมยอทอของประชาชนเรา พรอมเผชิญศัตรูใดก็ตามที่อาจพบ"
 GER_military_modifier_tt: "[GetSubmarineMaxSpeed]"
 GER_military_modifier_submarine_speed_big: "$GER_military_modifier$"
 GER_military_modifier_submarine_speed_big_desc: "$GER_military_modifier_desc$"
