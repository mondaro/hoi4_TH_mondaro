 BEL_belgian_resistance_state_dynamic_modifier: "ขบวนการตอตานเบลเยียม"
 BEL_belgian_resistance_state_dynamic_modifier_desc: "ประชาชนของเราไมใชคนแปลกหนากับการถูกยึดครอง หลายคนไดเรียนรูบทเรียนของการดื้อแพงและการตอตานมาแลวในสงครามครั้งกอน" #Note, this is countered by the Secretaries General occupation law.
