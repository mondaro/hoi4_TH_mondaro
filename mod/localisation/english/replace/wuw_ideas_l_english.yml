 #TIMED SPIRITS
 GER_collect_scrap_metal_ns_desc: "เราไดเปดการรณรงคทั่วประเทศเพื่อรวบรวมเศษโลหะใหไดมากที่สุดเทาที่ทําได เพื่อชวยความพยายามเสริมกําลังอาวุธของเรา"
 GER_import_tariffs_ns_desc: "การตั้งกําแพงภาษีนําเขาเปนความชั่วรายที่จําเปนเพื่อสงเสริมการเติบโตของการผลิตภายในประเทศ แตที่สําคัญกวานั้น มันจะชวยประหยัดเงินอันมีคาของเรา เพราะเราไมตองใชเงินตราตางประเทศอันนอยนิดที่มีอยู"
 GER_knickebein: "คนิคเคอไบน"
 GER_knickebein_desc: "ความกาวหนาของเราดวยระบบนํารองคนิคเคอไบนทําใหเราปรับปรุงความแมนยําของเครื่องบินทิ้งระเบิดในการเล็งเปาที่ตั้งของศัตรูไดอยางแมนยําไรเทียมทาน แมแตในการโจมตียามคํ่าคืน"
 GER_defense_of_the_reich_ns_desc: "เราจะรักษานานฟาเหนือ[ROOT.GetNameDef] และปกปองอุตสาหกรรมและประชาชน ไมมีเครื่องบินทิ้งระเบิดของศัตรูลําใดจะทะลวงกําแพงสวรรคแหงเครื่องบินขับไลผูแรงกลาของเราได!"
 GER_the_kammhuber_line: "แนวคัมฮูเบอร"
 GER_the_kammhuber_line_desc: "เราไมอาจปลอยใหเครื่องบินทิ้งระเบิดและเครื่องบินขับไลของศัตรูทองไปอยางอิสระในนานฟาเหนือ[ROOT.GetNameDef] ดวยการสรางระบบสัญญาณเรดารที่ซอนทับกันอยางประณีต เราจะสกัดกั้นพวกมันกอนที่จะไปถึงดินแดนใจกลางของเรา"
 GER_nachtjagdgeschwader: "นัคทยาคทเกชวาเดอร"
 GER_nachtjagdgeschwader_desc: "นัคทยาคทเกชวาเดอร หรือฝูงบินขับไลกลางคืนของเรา จะไลลาและทําลายอากาศยานศัตรูใดๆ ที่โงเขลาพอจะกลาขามพรมแดนของเรา ฝูงบินเหลานี้ครองนานฟายามราตรี ปกปองมาตุภูมิจากเครื่องบินทิ้งระเบิดของศัตรูภายใตความมืด"
 GER_tragergruppen_ns: "เทรเกอรกรุพเพิน"
 GER_tragergruppen_ns_desc: "การฝกและติดอาวุธใหเทรเกอรกรุพเพิน หรือกลุมบินประจําเรือบรรทุกเครื่องบินโดยเฉพาะ จะรับประกันความเปนเจาเหนือนานฟาเหนือทองทะเลอันไรที่สิ้นสุดของเรา"
 GER_cruiser_warfare_ns_desc: "เรือลาดตระเวนของเราสรางความหายนะแกกองเรือพาณิชยของศัตรูในทะเลเปด สิ่งนี้จะทําใหอุตสาหกรรมของพวกเขาตองคุกเขาเปนแน"
 GER_panzerschiff_raiders_ns_desc: "เรือลาดตระเวนหนักของเราเปนภัยคุกคามรายแรงตอกองทัพเรือของศัตรู ปนของพวกมันมีอานุภาพรุนแรง ขณะที่ความเร็วทําใหพวกมันหลบหนีไปไดกอนจะถูกปะทะอยางจริงจัง"
 GER_rudeltaktik_ns: "รูเดิลทัคทีค"
 GER_rudeltaktik_ns_desc: "ฝูงหมาปาเรืออูของเราตระเวนไปทั่วทองทะเล แสวงหาเหยื่อรายใหม การใชรูเดิลทัคทีคทําใหพวกมันประสานงานไดดีขึ้น และโจมตีจุดตายของศัตรูได นั่นคือการพึ่งพาเสนทางทะเลเปด"

