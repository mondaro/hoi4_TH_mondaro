 GER_nordische_legion_ns: "กองทหารนอรดิก"
 GER_nordische_legion_ns_desc: "ชาว[ROOT.GetAdjective]จํานวนมากโหยหาการผจญภัย และอยากไปรบเพื่ออุดมการณที่ดี เพื่อการนั้นเราจึงจัดตั้งกองทหารอาสาสมัครที่จะไปชวยพี่นองชาวนอรดิกในสงครามของพวกเขา"
 GER_fernostliche_legion_ns: "กองทหารตะวันออกไกล"
