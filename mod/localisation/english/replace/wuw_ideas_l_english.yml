 HUN_hungarian_national_defense_association_greenshirts_desc: "M.O.V.E. องคกรขวาจัดซึ่งสวนใหญเปนกึ่งทหารที่กอตั้งในป 1919 โดยรวมภักดีตอผูนําและผูกอตั้งอยางดยูลอ เกิมเบิช แตเมื่อกลุมเสื้อเขียวและองคกรกางเขนเคียวไดรวมเขามา ความภักดีของพวกเขาก็กระจัดกระจาย และอาจภักดีตอผูนํากางเขนศรมากกวาผูใด"
