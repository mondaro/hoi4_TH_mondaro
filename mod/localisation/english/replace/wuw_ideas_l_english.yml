 GER_german_development_aid: "ความชวยเหลือเพื่อการพัฒนาจากเยอรมนี"
 GER_german_exploitation: "การแสวงประโยชนของเยอรมนี"
 GER_the_inner_circle_dm: "วงใน"
 GER_the_inner_circle_dm_desc: "วงในของทานผูนําประกอบดวยชนชั้นนําทางการเมืองของ[GER.GetNameDef] ผูภักดีอยางแรงกลาที่พรอมผลักดันวิสัยทัศนของ [GER.GetLeader] ดวยความทะเยอทะยานอันเปยมลน พวกเขาตางพยายามกาวขึ้นในวงในเพื่อเปนไรชสไลเทอร หรือผูนําแหงไรช อิทธิพลของพวกเขาหลอหลอมการตัดสินใจทั้งทางทหาร อุตสาหกรรม และการเมือง และขับเคลื่อนการกําหนดนโยบายของเยอรมนี แรงผลักดันของพวกเขายังเปนตนเหตุของความตึงเครียด เมื่อความทะเยอทะยานนําไปสูการวางอุบายและการทรยศ"
 GER_the_inner_circle_dm_tt: "ที่ปรึกษาใน§Yวงใน§!ที่ดํารงตําแหนงอยู: \n[GetAscendedAdvisor1][GetAscendedAdvisor2][GetAscendedAdvisor3]"
