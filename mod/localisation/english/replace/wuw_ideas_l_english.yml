###### AUSTRIAN NATIONAL SPIRITS (IDEAS) ######

 AUS_widespread_unemployment: "การวางงานแพรหลาย"
 AUS_widespread_unemployment_desc: "หลังวิกฤตเศรษฐกิจ ออสเตรียตองดิ้นรนกับเงินเฟอและอัตราการวางงานที่สูง ความขุนเคืองตอนักการเมืองอยูในระดับสูง"
 AUS_employment_efforts: "ความพยายามสรางการจางงาน"
 AUS_employment_efforts_desc: "มีการลงทุนจํานวนมากเพื่อยุติวิกฤตการจางงานในออสเตรีย เมื่อเด็กฝกงานกลายเปนภาพที่เห็นจนชินตาในโรงงาน ทั้งประชาชนและภาคอุตสาหกรรมตางดูพึงพอใจ"
 AUS_phonix_insurance: "ประกันภัยเฟอนิกซ"
 AUS_phonix_insurance_desc: "โครงการประกันภัยเฟอนิกซทําใหทหารของเราซื้อประกันชีวิตที่คุมครองพวกเขาในกรณีที่เกิดเรื่องรายที่สุดได การรูวาครอบครัวจะไดรับการดูแลทําใหจํานวนผูที่ยินดีเขารวมกองทัพเพิ่มขึ้นอยางมาก"
 AUS_covering_the_phonix_insurances: "รับภาระแทนประกันภัยเฟอนิกซ"
 AUS_covering_the_phonix_insurances_desc: "การใหประชาชนรูวาประกันภัยเฟอนิกซอันเปนที่รักของพวกเขาลมสลายไปแลว จะสงผลรายแรงตอความสามารถในการรักษาและพัฒนากองทัพของเรา รัฐจะรับภาระคาประกันแทนจนกวาประกันภัยเฟอนิกซจะกลับมาตั้งตัวได"
 AUS_cannot_train_due_to_treaty_of_saint_germain_en_laye: "ไมสามารถฝกหนวยใหมไดขณะที่ §Y$AUS_treaty_of_saint_germain_en_laye$§! ยังมีผลอยู"
 AUS_treaty_of_saint_germain_en_laye: "สนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แล"
 AUS_treaty_of_saint_germain_en_laye_desc: "ดวยถูกผูกมัดโดยสนธิสัญญาอันเขมงวดที่ลงนามหลังมหาสงคราม กองทัพออสเตรียและอุตสาหกรรมการทหารจึงเหลือเพียงเงาของสิ่งที่เคยเปน"
 AUS_treaty_of_saint_germain_en_laye_tt: "สงอาสาสมัครได: §Rไมได§!"
 AUS_treaty_of_saint_germain_en_laye_tt_2: "§Rตราบใดที่จิตวิญญาณแหงชาตินี้ยังมีผล กฎหมายการเกณฑทหารจะไมสามารถยกระดับเกิน 'อาสาสมัครเทานั้น' ได หนวยตางๆ ไมสามารถฝก ยุบ หรือแกไขแมแบบได§!"
 AUS_revised_treaty_of_saint_germain_en_laye: "สนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลฉบับแกไข"
 AUS_revised_treaty_of_saint_germain_en_laye_desc: "ดวยความพยายามทางการทูต ผลกระทบของสนธิสัญญาแซ็ง-แฌรแม็ง-อ็อง-แลฉบับเดิมไดลดลงแลว เมื่อไมตองถูกจํากัดขนาดกองทัพอยางเขมงวดอีกตอไป [ROOT.GetNameDef]จึงสามารถเริ่มการเสริมกําลังอาวุธในระดับที่เล็กลงได"
 AUS_recovering_from_the_depression: "ฟนตัวจากภาวะเศรษฐกิจตกตํ่า"
 AUS_recovering_from_the_depression_desc: "การฟนตัวจากวิกฤตเศรษฐกิจชวงตนทศวรรษ 30 เปนไปอยางเชื่องชา แตดูเหมือนในที่สุดออสเตรียกําลังมุงสูชวงเวลาที่ดีขึ้น"
 AUS_recurrent_economic_depression: "ภาวะเศรษฐกิจตกตํ่าหวนกลับมา"
 AUS_recurrent_economic_depression_desc: "รูปแบบที่มาตรการระยะสั้นไดผลชั่วคราว กอนที่วิกฤตเศรษฐกิจจะหวนกลับมารุนแรงยิ่งกวาเดิมเมื่อผลหมดลง ดูจะตามหลอกหลอนออสเตรียราวกับคําสาป อัตราเงินเฟอพุงสูงอีกครั้ง และเศรษฐกิจพังยับเยิน"
 AUS_economic_boom: "เศรษฐกิจเฟองฟู"
 AUS_economic_boom_desc: "ดวยการทํางานหนักและความพยายามอยางยิ่งใหญ ออสเตรียไดเปลี่ยนหายนะทางเศรษฐกิจใหกลายเปนเศรษฐกิจที่เติบโตอยางรวดเร็ว"
 AUS_women_in_academia: "สตรีในแวดวงวิชาการ"
 AUS_women_in_academia_desc: "การเปดโอกาสใหสตรีไดรับการศึกษาระดับสูงทําใหความกาวหนาทางวิทยาศาสตรในออสเตรียกาวกระโดดไปขางหนาอยางมาก"
 AUS_militia_support: "การสนับสนุนจากกองกําลังอาสา"
 AUS_militia_support_2: "การสนับสนุนจากกองกําลังอาสา"
 AUS_militia_support_desc: "เราไดรับการสนับสนุนจาก[GetMilitiaName]เพื่อชวยอุดมการณของเรา องคกรกึ่งทหารนี้ถูกสั่งหามมานาน แตในสถานการณเชนนี้ เราสามารถหาเหตุผลมารองรับการนําพวกเขากลับมาไดอยางงายดาย"
