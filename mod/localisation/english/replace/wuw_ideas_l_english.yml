 GER_military_modifier_fascist_desc: "[GER.GetNameDefCap]มีประวัติศาสตรการทหารอันยาวนานและนาภาคภูมิใจ พรอมประเพณีแหงการคิดเชิงนวัตกรรม และเสนาธิการทหารของเราพยายามปรับปรุงกองทัพใหดียิ่งขึ้นนับตั้งแตความพายแพอันนาอัปยศในมหาสงคราม ดวยความเชี่ยวชาญนี้ เราพรอมจะโจมตีศัตรูใดก็ตามที่ปรารถนาจะกดขี่ประชาชนผูภาคภูมิของเรา"

