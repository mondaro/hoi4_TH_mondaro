 HUN_gombos_trade_treaty: "สนธิสัญญาการคาเกิมเบิช"
 HUN_gombos_trade_treaty_desc: "สนธิสัญญาการคาที่ดยูลอ เกิมเบิช ลงนามกับเยอรมนีในป 1934 มีความสําคัญตอการกระตุนเศรษฐกิจและชวยฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ แตก็มีขอเสียมหาศาล แมขอตกลงจะใหราคาขายขาวสาลีที่ดีแกเรา แตเงินที่ไดตองอยูในบัญชีในเยอรมนี และใชไดเฉพาะซื้อสินคาอุตสาหกรรมของเยอรมนีเทานั้น หากเปนเชนนี้ตอไป เยอรมนีจะครอบงําเศรษฐกิจของประเทศเราได"
 HUN_hungarian_national_defense_association: "สมาคมปองกันชาติฮังการี"
 HUN_hungarian_national_defense_association_desc: "M.O.V.E. องคกรขวาจัดซึ่งสวนใหญเปนกึ่งทหารที่กอตั้งในป 1919 โดยรวมภักดีตอผูนําและผูกอตั้งอยางดยูลอ เกิมเบิช กระนั้นพวกเขาก็ใหความเคารพอยางสูงตอมิกโลช โฮรตี เนื่องจากจุดยืนตอตานคอมมิวนิสตอยางแข็งกราวของเขา"
 HUN_levente_associations: "สมาคมเลเวนเต"
 HUN_levente_associations_desc: "ประชาชนของเราไดจัดตั้งองคกรเยาวชนกึ่งทหารที่รูจักกันในชื่อเลเวนเต ภายใตขออางของการฝกพลานามัยและสุขภาพ พวกเขาเตรียมเยาวชนฮังการีทั้งในและนอกพรมแดนของเราใหพรอมรบ และพรอมสําหรับการทวงคืนดินแดนอันชอบธรรมของเราในทายที่สุด"
 HUN_forceful_industrial_revitalization: "การฟนฟูอุตสาหกรรมอยางเขมงวด"
 HUN_forceful_industrial_revitalization_desc: "รัฐบาลไดใชมาตรการเด็ดขาดเพื่อใหอุตสาหกรรมของชาติกลับมายืนไดอีกครั้ง แตมีเพียงเวลาเทานั้นที่จะบอกไดวามาตรการนี้ประสบความสําเร็จหรือไม"
 HUN_revaluing_the_pengo: "ปรับคาเงินเปงเงอใหม"
 HUN_revaluing_the_pengo_desc: "สกุลเงิน[HUN.GetAdjective] เปงเงอ กําลังอยูในกระบวนการปรับคาใหม เปนความพยายามอยางสิ้นหวังเพื่อเสริมความแข็งแกรงใหเศรษฐกิจและแกวิกฤตเงินเฟอ แมจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"
 HUN_hungarian_autarky_idea: "การพึ่งพาตนเองของฮังการี"
 HUN_hungarian_autarky_idea_desc: "หากชาติจะอยูรอดไดดวยตนเองทามกลางศัตรูรายลอม ก็ตองเรียนรูที่จะผลิตทุกสิ่งที่ตองการเอง แมการผลิตดังกลาวจะมีตนทุนสูงก็ตาม"
 HUN_agrarian_tradition: "ประเพณีเกษตรกรรมของฮังการี"
 HUN_agrarian_tradition_desc: "ประเพณีเกษตรกรรมอันนาภาคภูมิใจของเรามีมาชานาน ยอนไปกอนที่เราจะมาถึงดินแดนที่เราเรียกวาบานในวันนี้ เราควรใหคุณคากับประเพณีเหลานี้และสงเสริมใหมากที่สุดเทาที่ทําได"
 wuw_HUN_not_has_trianon_for_laws_tt: "ไมมีจิตวิญญาณแหงชาติ§Yสนธิสัญญาทรียานง§!"
 HUN_rapid_army_expansion: "ขยายกองทัพอยางรวดเร็ว"
 HUN_rapid_army_expansion_desc: "เมื่อสงครามใกลเขามาในยุโรป ชายทุกคนตองพรอมปกปองมาตุภูมิไดทุกเมื่อ ถึงเวลาแลวที่ชาย[HUN.GetAdjective]จะเขาใจความรูสึกนี้ และพรอมชวยเหลือในยามที่เราตองการ"
 HUN_modify_academy_of_sciences_ns_intro: "ปรับ §Y$HUN_academy_of_sciences$§! โดย"
 HUN_academy_of_sciences: "สถาบันวิทยาศาสตรแหงฮังการี"
 HUN_academy_of_sciences_desc: "ดวยการลงทุนขยายสถาบันวิทยาศาสตรแหง[ROOT.GetAdjective] ชาติของเราจะสามารถพัฒนาทางเทคโนโลยีไดเร็วกวาคูแขง"
 HUN_gombos_trade_treaty_tt: "สนธิสัญญาการคาเกิมเบิชทําใหเราคาขายกับเยอรมนีได"
 HUN_hungarian_gendarmerie: "ตํารวจภูธรหลวงฮังการี"
 HUN_hungarian_gendarmerie_desc: "เพื่อปกปองพรมแดนและผูนําของเราใหพนภัย ตํารวจภูธรกึ่งทหารของเราตองไดรับการขยาย และไดรับอํานาจมากขึ้นในการปฏิบัติการดวยตนเอง"
 HUN_hungarian_gendarmerie_hussars: "ตํารวจภูธรกองพันดํา"
 HUN_hungarian_gendarmerie_hussars_desc: "เพื่อปกปองพรมแดนและผูนําของเราใหพนภัย ตํารวจภูธรกึ่งทหารของเราตองไดรับการขยาย และไดรับอํานาจมากขึ้นในการปฏิบัติการดวยตนเอง"
 cat_air_bombs: "ระเบิดอากาศ"
 cat_air_engine: "เครื่องยนตอากาศยาน"
 mio_cat_artillery: "ปนใหญ"
 HUN_recon_airplane_focus: "มุงเนนเครื่องบินลาดตระเวน"
 HUN_recon_airplane_focus_desc: "ขณะนี้[ROOT.GetNameDefCap]กําลังลงทุนอยางหนักในการพัฒนาและใชงานเครื่องบินลาดตระเวน เพื่อจับตาดูศัตรูอยางใกลชิด"
 HUN_rapid_army_groups_idea: "กลุมกองทัพเคลื่อนที่เร็ว"
 HUN_rapid_army_groups_idea_desc: "กองทัพของเราไดรับการจัดระเบียบใหมใหสามารถไปถึงจุดที่ตองการไดเร็วที่สุดในทุกเวลา"
 HUN_pan_ugric_volunteer_force: "กองกําลังอาสาสมัคร[ROOT.GetAdjective]"
 HUN_pan_ugric_volunteer_force_desc: "ความกระตือรือรนลาสุดของเราในการชวยเหลือพี่นองฟนโน-อูกริก ไดกระตุนการเกณฑอาสาสมัคร[ROOT.GetAdjective]ที่ปรารถนาจะไปรวมรบในตางแดน"
 HUN_GER_trade_modifier: "ขอตกลงการคาฮังการี-เยอรมนี"
 HUN_POL_friendship_modifier: "ชาวโปแลนดและชาวฮังการี — สองเพื่อนรัก รวมรบ และรวมดื่มในตอนทาย"
 HUN_restricted_voting_rights: "จํากัดสิทธิเลือกตั้ง"
 HUN_restricted_voting_rights_desc: "การจํากัดสิทธิเลือกตั้งของประชาชนอาจไมใชทางเลือกที่ไดรับความนิยม แตก็จําเปนเพื่อสกัดอุดมการณคอมมิวนิสตและเสรีนิยมที่กําลังเติบโตในประเทศ"
 HUN_crackdown_on_extremism: "ปราบปรามลัทธิสุดโตง"
 HUN_crackdown_on_extremism_desc: "ในฐานะสวนหนึ่งของการปฏิรูปตอตานลัทธิสุดโตงของนายกรัฐมนตรีคนใหม กาลมาน ดาราญี เฟแรนตส ซาลาชี ถูกจับกุม และพรรคเจตจํานงแหงชาติ ซึ่งเปนพรรคการเมืองนาซีของเขา ถูกสั่งหาม"
 HUN_power_to_the_regent_idea: "อํานาจแกผูสําเร็จราชการ"
 HUN_power_to_the_regent_idea_desc: "ดวยการผานบทบัญญัติที่ XIX ผูสําเร็จราชการแหง[ROOT.GetNameDef]ไดรับอํานาจมากขึ้น และความภักดีของประชาชนก็อยูกับผูนําผูยิ่งใหญ มิกโลช โฮรตี"
 HUN_turul_association_idea: "สมาคมตูรุล"
 turanist_connections_op_modifier: "สายสัมพันธลัทธิตูราน"
 HUN_old_hungary_reclaimed: "ฟนฟูมหาฮังการี"
 HUN_old_hungary_reclaimed_desc: "ในที่สุด เราไดลบลางความอัปยศที่สนธิสัญญาทรียานงบังคับใหเรา ดวยการทวงคืนสิ่งที่เปนของเราไดสําเร็จ!"
 HUN_promoted_hungarianism: "สงเสริมลัทธิฮังการีนิยม"
 HUN_promoted_hungarianism_desc: "เพื่อรับใชผลประโยชนของชาติไดดีที่สุด เราควรเสริมขบวนการฮังการีนิยม และทําใหประชาชนรูวาอนาคตของเราอยูที่ใด"
