 HUN_habsburg_restored_desc: "นับตั้งแตป 1526 ชาติของเราถูกปกครองโดยราชวงศฮาพสบวรค ผูทรงสิทธิ์อันศักดิ์สิทธิ์เหนือแผนดินของเรา เมื่อระบอบกษัตริยไดรับการฟนฟูแลว ถึงเวลาที่เราจะทําใหแนใจวาพระองคจะคงอยูตอไป และชาติของเราจะไมตกสูความเสื่อมทรามแบบสาธารณรัฐอีก"
