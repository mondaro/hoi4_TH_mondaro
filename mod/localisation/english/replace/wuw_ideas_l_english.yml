 HUN_promises_of_peace_desc: "เพื่อเอาใจมหาอํานาจแหงความตกลงไตรภาคีนอย เราตองสัญญาวาจะไมเสริมกําลังทหารหรือขยายดินแดนอยางกาวราว สงผลใหกองทัพหยุดชะงักการเติบโตชั่วคราว"
