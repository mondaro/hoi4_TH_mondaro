 ###### AUSTRIAN NATIONAL SPIRITS (DYNAMIC MODIFIERS) ######

 AUS_austrofascism: "ลัทธิฟาสซิสตออสเตรีย"
 AUS_austrofascism_desc: "ดวยการปฏิเสธระบบรัฐสภาแบบประชาธิปไตยตะวันตกและดําเนินการในฐานะรัฐบรรษัทนิยม แนวรวมปตุภูมิจึงเปนพรรครัฐบาลเพียงหนึ่งเดียว รัฐธรรมนูญถูกรางใหมเพื่อนําออสเตรียไปสูบรรษัทนิยม อํานาจนิยม และชาตินิยม"
 AUS_habsburg_monarchy_restored: "ฟนฟูราชวงศฮาพสบวรค"
 AUS_austrian_monarchy_restored: "ฟนฟูระบอบกษัตริยออสเตรีย"
 AUS_habsburg_monarchy_restored_desc: "ในฐานะราชาธิปไตย [AUS.GetNameDef]เคยเปนมหาอํานาจในทวีปยุโรป ดวยการฟนฟูระบอบกษัตริย เราจะกลับไปเปนเชนนั้นอีกครั้ง!"
 AUS_farr: "ฟนคืนสาธารณรัฐออสเตรียที่หนึ่ง"
 AUS_farr_desc: "ดวยการยกเลิกรัฐธรรมนูญเดือนพฤษภาคม และกลับมาอนุญาตใหมีพรรคการเมืองและจัดการเลือกตั้งอีกครั้ง [AUS.GetNameDef]ไดฟนคืนสาธารณรัฐที่เคยคิดกันวาสูญสิ้นไปนานแลว"
 AUS_doth: "การปองกันมาตุภูมิ"
 AUS_doth_desc: "เปนหนาที่ของชาว[AUS.GetAdjective]ทุกคนที่จะทําสวนของตนในการปกปองมาตุภูมิ ไมวาจะในกองทัพ ในโรงงาน หรือในสถานที่กอสราง ดวยการเรียกรองความรวมแรงรวมใจของทั้งชาติ มาตุภูมิจะไดรับการปกปอง!"
 AUS_aggression: "ความกาวราวของออสเตรีย"
 AUS_aggression_desc: "การนั่งรอและหวังวาจะไมถูกโจมตีเปนแนวทางที่ไมปลอดภัยในยามเชนนี้ เพื่อไมใหถูกจูโจมขณะไมทันระวัง เราตองพรอมที่จะโจมตีกอน"
 AUS_austromarxism: "ลัทธิมารกซออสเตรีย"
 AUS_austrostalinism: "ลัทธิสตาลินออสเตรีย"
 AUS_austrotrotskyism: "ลัทธิทรอตสกีออสเตรีย"
 AUS_austromarxism_desc: "วาระลัทธิมารกซออสเตรียซึ่งอิงจากงานเขียนของอ็อทโท เบาเออร สนับสนุนทางสายกลางระหวางสังคมประชาธิปไตยกับคอมมิวนิสตแบบโซเวียต หลังจากหันเหอยางมากจากสภาพเดิมภายใตลัทธิฟาสซิสตออสเตรีย ประเทศกําลังเดินอยูบนเสนแบงระหวางคอมมิวนิสตกับประชาธิปไตย"
 AUS_austrostalinism_desc: "ดวยการหันเหจากทางสายกลางของลัทธิมารกซออสเตรีย และยกเลิกลัทธิฟาสซิสตออสเตรียไปนานแลว ปจจุบัน[AUS.GetNameDef]ยึดถือแนวคิดสตาลินนิสตอยางเครงครัด"
 AUS_austrotrotskyism_desc: "ดวยการหันเหจากทางสายกลางของลัทธิมารกซออสเตรีย และยกเลิกลัทธิฟาสซิสตออสเตรียไปนานแลว ปจจุบัน[AUS.GetNameDef]ยึดถือแนวคิดทรอตสกีอยางเครงครัด"
 AUS_peoples_army: "กองทัพประชาชน"
 AUS_peoples_army_desc: "การปลุกระดมมวลชนทําใหเกิดกองกําลังอาสาที่เขมแข็งในประเทศ กองกําลังอาสาเหลานี้ไดรับการฝกและติดอาวุธดีเปนพิเศษ ทั้งที่ถูกระดมขึ้นอยางรวดเร็ว ผลที่ตามมาคือการเกณฑเขากองทัพประจําการก็เพิ่มขึ้นเชนกัน"
 AUS_empire_restored: "ฟนฟูจักรวรรดิออสเตรีย"
 AUS_empire_restored_desc: "เคยเปนจักรวรรดิ และจะเปนจักรวรรดิอีกครั้ง! เมื่อยึดดินแดน[AUS.GetAdjective]เดิมคืนมาไดมาก จักรวรรดิก็ไดรับการสถาปนาขึ้นใหม"
 AUS_airforce: "กองทัพอากาศออสเตรีย"
 AUS_army: "กองทัพสหพันธออสเตรีย"
 AUS_army_monarchy: "ลันทแวรออสเตรีย"
 AUS_navy: "กองทัพเรือออสเตรีย"
 AUS_compensation_for_guarantee: "ตอบแทนการสนับสนุนจากตางชาติ"
 AUS_compensation_for_guarantee_desc: "การที่ประเทศอื่นสนับสนุนเรานั้นไมไดมาฟรีๆ ดวยการเสนอรับภาระการผลิตสินคาอุปโภคบริโภคบางสวนของพวกเขา เราจึงซื้อการสนับสนุนจากพวกเขาไวได หากเกิดเรื่องรายที่สุดขึ้น"


