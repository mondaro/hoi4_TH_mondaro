l_english:
 poland.13.t: "[From.GetNameDefCap] ตองการความรวมมือกับ[faction_invitee_target.GetAdjective]"
 poland.13.d: "[From.GetLeader] ไดรองขอใหรัฐบาล[Root.GetAdjective]สงคําเชิญเขารวม [Root.GetFactionName] โดยอางถึงประโยชนทางยุทธศาสตรอยางใหญหลวงที่พันธมิตร[faction_invitee_target.GetAdjective]จะมีใหหากเกิดการรุกราน"
 poland.13.a: "[faction_invitee_target.GetNameDefCap] เปนมิตรของเราอยูแลว!"
 poland.13.b: "เราไวใจ [faction_invitee_target.GetLeader] ไมได"
 poland.1301.t: "[From.From.GetNameDefCap] ขอความรวมมือ"
 poland.1301.d: "[From.From.GetLeader] ซึ่งเปนสมาชิกของ [From.GetFactionName] อยูแลว ตองการความรวมมือทางทหารกับ [Root.GetNameDef] โดยอางถึงประโยชนทางยุทธศาสตรอยางใหญหลวงที่พันธมิตร[From.From.GetAdjective]-[Root.GetAdjective]จะมีใหหากเกิดการรุกรานจาก[GER.GetAdjective]หรือ[SOV.GetAdjective]"
 poland.1301.a: "แนนอน!"
 poland.1301.b: "เราไมสนใจ “[From.GetFactionName]” นี่หรอก"
 poland.1302.t: "[From.GetNameDefCap] ปฏิเสธการเขารวมของ[faction_invitee_target.GetAdjective]"
 poland.1302.d: "ดูเหมือนวา [From.GetLeader] จะไมไดเชื่อมั่นในความจําเปนของพันธมิตร[faction_invitee_target.GetAdjective]มากเทากับ [Root.GetLeader] ยังไมแนชัดวาเหตุผลที่แทจริงของการตัดสินใจนี้คืออะไร แตเห็นไดชัดวารัฐบาล[From.GetAdjective]เชื่อวา [faction_invitee_target.GetNameDef] เปนภาระมากกวาเปนประโยชนตอการอยูรอดของ [From.GetFactionName]"
 poland.1302.a: "ก็คุมคาที่ไดลองดู"
 poland.1303.t: "[From.GetNameDefCap] ปฏิเสธ!"
 poland.1303.d: "ดวยเหตุผลบางประการที่ไมมีใครรู รัฐบาล[From.GetAdjective]ตัดสินใจวาจะไมเขารวมการตอสูเพื่อเสรีภาพกับเราในฝาย [From.From.GetFactionName] ไมวาขออางของพวกเขาจะเปนอะไร อนาคตของความรวมมือ[Root.GetAdjective]-[From.GetAdjective]ก็ดูไมสดใสนัก"
 poland.1303.a: "นาเสียดาย"
 poland.15.t: "[From.GetNameDefCap] เรียกรองใหผนวก[Root.GetAdjective]!"
 poland.15.d: "วันนี้โทรเลขที่นากังวลอยางยิ่งจากประธานาธิบดี[From.GetAdjective]มาถึงโตะของ [Root.GetLeader] เรียกรองไมเพียงให [LIT.GetNameDef] ละทิ้งการอางสิทธิ์เหนือวิลนีอุส อดีตเมืองหลวง แตยังใหวางอาวุธและยกดินแดนทั้งหมดใหรัฐ[From.GetAdjective] [From.GetNameDefCap] พยายามฟนฟูเครือจักรภพที่ลมสลายไปนานแลวมาตั้งแต [Root.GetNameDef] กอตั้งขึ้น และดูเหมือนวาตอนนี้พวกเขาเชื่อวาเพียงแคขูวาจะเกิดสงครามอีกครั้งก็เพียงพอที่จะทําให [Root.GetLeader] ยอมแพ"
 poland.15.d.notlit: "วันนี้โทรเลขที่นากังวลอยางยิ่งจากประธานาธิบดี[From.GetAdjective]มาถึงโตะของ [Root.GetLeader] เรียกรองให [Root.GetNameDef] วางอาวุธและยกดินแดนทั้งหมดใหรัฐ[From.GetAdjective] [From.GetNameDefCap] พยายามฟนฟูเครือจักรภพที่ลมสลายไปนานแลวมาตั้งแต [Root.GetNameDef] กอตั้งขึ้น และดูเหมือนวาตอนนี้พวกเขาเชื่อวาเพียงแคขูวาจะเกิดสงครามระหวางสองชาติก็เพียงพอที่จะทําให [Root.GetLeader] ยอมแพ"
 poland.15.a: "ก็ได"
 poland.15.b: "ไมมีทาง!"
 poland.1501.t: "[From.GetNameDefCap] ยอมรับ!"
 poland.1501.d: "วันนี้เปนวันแหงการเฉลิมฉลองครั้งยิ่งใหญของ [Root.GetNameDef] เมื่อกองทัพ[From.GetAdjective]วางอาวุธและปลอยใหทหาร[Root.GetAdjective]เดินทัพเขาสูเมืองหลวงและประกาศการรวมชาติของ [Root.GetNameDef] และ [From.GetNameDef]! เครือจักรภพไดกําเนิดใหม ทองถนนของ [Root.Capital.GetName] เต็มไปดวยผูคนที่โบกธง[Root.GetAdjective]และ[From.GetAdjective]เคียงคูกัน แมวาในเมืองหลวง[From.GetAdjective]จะไมมีการเฉลิมฉลองเชนนี้ ผูคนที่นั่นดูหมนหมองและโศกเศราอยางประหลาด"
 poland.1501.a: "เครือจักรภพกําเนิดใหมแลว!"
 poland.1502.t: "[From.GetNameDefCap] ไมยอมจํานน!"
 poland.1502.d: "วันนี้มีคําตอบจากกองบัญชาการสูงสุด[From.GetAdjective] ปฏิเสธขอเรียกรองของ[Root.GetAdjective]ทั้งหมดอยางสิ้นเชิง และประกาศวาจะ “ไมยอมให [Root.GetLeader] เหยียบยํ่าอธิปไตยของ[From.GetAdjective]” แมหลายคนไมตองการเขาสูสงครามกับ [From.GetNameDef] อีกครั้ง แตหาก [Root.GetLeader] ไมตอบโตในเร็ววัน ขอเรียกรองของ[Root.GetAdjective]ในอนาคตก็คงไมมีใครเอาจริงเอาจัง"
 poland.1502.a: "[Root.GetNameDef] และ [From.GetNameDef] จะเปนหนึ่งเดียว!"
 poland.16.t: "[From.GetNameDefCap] เชิญเราเขารวมมีนดือมอเชอ"
 poland.16.a: "แนนอน!"
 poland.16.b: "ไมเห็นเหตุผลที่ตองเปนพันธมิตรกับชาวโปล"
 poland.17.t: "ชัยชนะของซานัตซยาฝายซาย"
 poland.17.d: "ในที่สุดวาเลรี สวาเวก ก็กลับคืนสูตําแหนงหัวหนารัฐบาลของ [Root.GetNameDef] ไดสําเร็จ ผลักให [Root.GetLeader] ไปมีบทบาทเปนที่ปรึกษาในรัฐบาลมากขึ้น อยางไรก็ตาม หลายคนยังไมแนใจในจุดยืนทางการเมืองที่แทจริงของสวาเวก บางเชื่อวาเขาเปนนักสังคมนิยมที่ตองการปฏิรูป ขณะที่ผูวิจารณจํานวนมากเชื่อวาเขาเปนเพียงนักอํานาจนิยมอีกคน ไมตางจาก [Root.GetLeader] หรือรึตส-ชมิกวือ บัดนี้เมื่อไดเปนหัวหนารัฐบาลแลว สวาเวกอาจไขขอสงสัยเหลานี้ได เมื่อเขาแกไขรัฐธรรมนูญของโปแลนดอีกครั้ง"
 poland.17.a: "รักษารัฐบาลที่เขมแข็ง"
 poland.17.b: "ดําเนินการปฏิรูปสังคม"
 poland.18.t: "ชัยชนะของ OZN"
 poland.18.d: "เอดวารด รึตส-ชมิกวือ และผูติดตามในซานัตซยาฝายขวาเปนผูกุมอํานาจที่แทจริงเบื้องหลัง [Root.GetNameDef] มานาน แตเมื่อ [Root.GetLeader] เห็นชอบกับคายเอกภาพแหงชาติ อํานาจโดยพฤตินัยของรึตส-ชมิกวือก็ไดรับความชอบธรรมในที่สุด ดวยสายสัมพันธใกลชิดกับพวกฟาลังกิสต บางคนกังวลวา [Root.GetNameDef] กําลังเอนเอียงไปทางขวาจัดชายขอบทางการเมืองมากเกินไป และความฝกใฝฟาสซิสตของรึตส-ชมิกวืออาจทําให [Root.GetNameDef] โดดเดี่ยวทางการทูตจากพันธมิตรเดิม"
 poland.18.a: "เผด็จการของเราเปนกลางโดยสมบูรณ"
 poland.18.b: "เชิญพวกฟาลังกิสตเขารวมรัฐบาล"
 poland.19.t: "อัตวินิบาตกรรมของวาเลรี สวาเวก"
 poland.19.d: "“ขาพเจาขอปลิดชีพตนเอง โปรดอยาโทษผูใด ขาพเจาไดเผาเอกสารสวนตัวทั้งหมดและเอกสารที่ฝากไวกับขาพเจาแลว หากไมหมด ขอโปรดอภัยใหขาพเจาดวย พระผูเปนเจาผูทรงฤทธานุภาพอาจทรงอภัยบาปของขาพเจา รวมทั้งบาปสุดทายนี้” บันทึกนี้และอาวุธปนถูกพบอยูขางรางของวาเลรี สวาเวก เมื่อเวลา 20:45 น. ตรงของเมื่อวานนี้ แพทยที่ชํานาญและมีฝมือที่สุดของโรงพยาบาลทหารปวซุดสกีไมสามารถหยุดเลือดของสวาเวกได และอดีตนายกรัฐมนตรีถูกประกาศวาเสียชีวิตเมื่อเชานี้ นอกจากบันทึกแลวยังมีจดหมายที่มีไวให [Root.GetLeader] อานเทานั้น และแมเนื้อหาในจดหมายรวมถึงเหตุผลของการกระทําที่นาตกตะลึงที่สุดนี้จะยังคงเปนปริศนา แตทุกคนใน [Root.Capital.GetName] ตางพากันคาดเดา หลายคนสงสัยวาการที่ซานัตซยาฝายซายถูกกีดกันอยางตอเนื่องและความโดดเดี่ยวที่เพิ่มขึ้นเรื่อย ๆ ของสวาเวกเปนปจจัยสําคัญที่ทําใหเขาหดหู และการจากไปของผูนําที่ทรงอิทธิพลที่สุดของฝายซายยอมทําใหหลายคนรูสึกทอแทและสิ้นหวัง"
 poland.19.a: "ขอใหไปสูสุคติ"
 poland.20.t: "แผนสี่ปเสร็จสิ้น!"
 poland.20.desc.a: "การแทบไมมีการลงทุนเลยตลอดสี่ปที่ผานมาทําใหหลายคนประกาศวาแผนสี่ปลมเหลวโดยสิ้นเชิง โปแลนดตะวันออกยังคงเปนดินแดนปดของชาวนายากจน สิ่งที่เรียกวา ‘เขตอุตสาหกรรมกลาง’ มีเพียงโรงงานและสถานีรถไฟอันนาสมเพชไมกี่แหง และอุตสาหกรรมโปแลนดเปนความอัปยศของชาติ ผูเชี่ยวชาญดานการเงินมั่นใจวาความลมเหลวอยางสิ้นเชิงของแผนสี่ปจะเปนผลเสียระยะยาวตอความพยายามดานอุตสาหกรรมของโปแลนดในอนาคต"
 poland.20.desc.b: "ดวยการลงทุนพอประมาณ อนาคตของภาคอุตสาหกรรมโปแลนดดูสดใส แตก็ยังตามหลังเพื่อนบานทั้งทางตะวันตกและตะวันออกอยูมาก แมจะไมใชโครงการอุตสาหกรรมขนาดมหึมาอยางที่ [Root.GetLeader] สัญญาไว แตการลงทุนของรัฐบาลจะเปนประโยชนอยางยิ่งตอแผนสี่ปถัดไป!"
 poland.20.desc.c: "เสียงกรีดหวีดแหบพราของหัวรถจักรบนราง กลิ่นฉุนของเขมาและหมอกควันในอากาศ ไอหมอกแหลมคมของอุตสาหกรรมที่แสบตา เหลานี้คือสัมผัสแหงความกาวหนา การมาถึงภาคกลางของโปแลนดในวันนี้คือการกาวเขาสูโลกแหงอุตสาหกรรมและความกาวหนา โรงงาน ถนน ทางรถไฟ หัวรถจักร รถยนต ในที่สุดรัฐโปแลนดก็มีครบทุกอยาง เมื่อโปแลนดคองเกรส โปแลนดใหญ และโปแลนดตะวันออก เชื่อมถึงกันดวยเครือขายถนนและทางรถไฟที่หนาแนน โปแลนดก็ไดรวมเปนหนึ่งเดียวทางอุตสาหกรรมในที่สุด และแผนสี่ปของกเวียตกอฟสกีก็เรียกไดวาประสบความสําเร็จ แมนี่จะไมใชจุดสิ้นสุดของการลงทุนดานอุตสาหกรรมของโปแลนด แตความสําเร็จอยางทวมทนของโครงการสรางอุตสาหกรรมไดมอบเสถียรภาพและการจางงานแกประชาชนโปแลนด และหลายคนรูสึกพรอมรับมือกับความยากลําบากใด ๆ ที่รัฐโปแลนดจะตองเผชิญในอนาคต"
 poland.20.a: "ใหตายสิ!"
 poland.20.b: "ยอดเยี่ยม!"
 poland.20.c: "ยอดเยี่ยม!"
 poland.20.d: "ไมมีเสรีภาพหากปราศจากความสมานฉันท!"
 poland.20.e: "ยอดเยี่ยม!"
 poland.20.f: "ใหตายสิ!"
 poland.21.t: "[DNZ.GetNameDef] ตองการรวมเขากับ [Ger.GetNameDefCap]"
 poland.21.d: "ขณะที่ไฟสงครามลุกโชนไปทั่วทองถนนของ [DNZ.GetNameDef] [DNZ.GetLeader] ยืนหยัดตานกองกําลังของ [POL.GetLeader] อยางแข็งขัน แตเห็นไดชัดวานครเพียงแหงเดียวไมอาจตานทานการโจมตีจากกองกําลังทั้งหมดของ [POL.GetNameDef] ได ในฐานะสมาชิกพรรค [Root.GetRulingParty] [DNZ.GetLeader] ตองรับผิดชอบตอ [Root.GetLeader] และความพายแพของ[DNZ.GetAdjective]เปนสิ่งที่ยอมรับไมได [GER.GetNameDefCap] อาจเขาสูสงครามในฐานะผูปกปอง [DNZ.GetNameDef] ซึ่งเปนโอกาสพิเศษที่จะยึดนครนี้ไว ขณะที่ดูเหมือนเปนผูปกปอง…"
 poland.21.a: "กดัญสกจะยังคงเปนดานซิก!"
 poland.21.b: "เราไมควรเขาไปยุง"
 poland.2101.t: "[From.GetNameDefCap] เสนอใหการสนับสนุน!"
 poland.2101.d: "พรรค [GER.GetRulingParty] แหงเยอรมนีเสนอใหการสนับสนุนการตอสูของเรากับโปแลนด แลกกับการให [From.GetNameDef] ควบคุม [Root.GetNameDef] โดยตรงมากขึ้น"
 poland.2101.a: "เราไมมีทางเลือก"
 poland.2101.b: "ดานซิกจะยังคงเปนดานซิก!"
 poland.2102.t: "การผนวกดานซิก"
 poland.2102.d: "[DNZ.GetLeader] พิสูจนแลววาเปนเครื่องมือที่มีประโยชนในการตอกร [POL.GetNameDef] แตดินแดนปกครองตนเองนี้หมดประโยชนไปนานแลว และชะตากรรมของ [DNZ.GetLeader] คือการเปนเกาไลเตอรแหงไรชสเกาดานซิก-ปรัสเซียตะวันตก ซึ่งผนวกรวมเขากับ [Root.GetNameDef] อยางแนบแนน"
 poland.2102.a: "ยินดีตอนรับสูไรช"
 poland.2102.b: "บางทีพวกเขาก็สมควรไดรับอํานาจปกครองตนเองบาง"
 poland.22.t: "[DNZ.GetNameDefCap] เสนอสันติภาพ"
 poland.22.d: "สงครามนี้ยืดเยื้อมานานพอแลว แมแต [DNZ.GetLeader] ผูทรยศก็ยังตองการสันติภาพกับ [POL.GetNameDef] เมื่อแมแตกดือเนียก็ตกอยูใตการควบคุมของ[DNZ.GetAdjective] หลายคนกังวลวาการทําสงครามกับนครเสรีตอไปมีความเสี่ยงมากกวาสิ่งที่เราจะได แมในที่สุดนครนี้จะตกอยูใตการควบคุมของ[GER.GetAdjective]อยางหลีกเลี่ยงไมได แตเราไมอาจแบกรับความขัดแยงนี้ตอไปไดอีกแลว"
 poland.22.a: "อยางนอยเราก็ไดพยายามแลว"
 poland.22.b: "สงครามนี้ยังไมจบจนกวาขาจะประกาศ!"
 poland.23.t: "อุตสาหกรรมใน [poland_state_withdrawn.GetName] ถูกกอวินาศกรรม"
 poland.23.d: "ขณะที่ทหาร[Root.GetAdjective]รุกเขาสู [poland_state_withdrawn.GetName] และเริ่มยึดทางรถไฟและอุตสาหกรรม ปรากฏอยางนาตกใจวาทุกอยางถูกติดตั้งวัตถุระเบิดไวพรอมจุดชนวน นี่เปนกับดักที่กองทัพ[POL.GetAdjective]ทิ้งไวอยางชัดเจน และเราคาดไดวาเรื่องนี้จะเกิดขึ้นทุกครั้งที่เราพยายามยึดอุตสาหกรรมของ[POL.GetAdjective]"
 poland.23.a: "นั่นถวงเราไดไมนานหรอก"
 poland.24.d: "ความตึงเครียดทางตะวันออกปะทุขึ้นแลว มีการสงตํารวจไปจัดการกับผูประทวง แตความโหดรายของเจาหนาที่กลับยิ่งโหมไฟแหงการกบฏในหมูประชาชน\n\nหากเราไมคลี่คลายวิกฤตนี้โดยเร็วที่สุด เราอาจตองเผชิญสงครามกลางเมือง การนัดหยุดงานที่นําโดยสตานิสวัฟ มิโควายชิก ผูนําพรรคชาวนา ไดกอตั้งแนวรวมของฝายประชาธิปไตย สังคมนิยม และคอมมิวนิสต เพื่อตอตานรัฐบาลโปแลนด และหากเพิกเฉยจะลุกลามเปนกบฏ"
 poland.24.a: "ชาวนากอกบฏแลว!"
 poland.25.t: "[hosting_country_target.GetNameDefCap] เรียกรองให [Root.GetLeader] ลาออก!"
 poland.25.d: "แม [hosting_country_target.GetNameDef] จะสัญญาวาจะใหที่พักพิงแกรัฐบาลพลัดถิ่น[Root.GetAdjective] แต [hosting_country_target.GetLeader] กลับเรียกรองให [Root.GetLeader] ลาออกจากตําแหนงประธานาธิบดีแหง [Root.GetNameDef] ของ[Root.GetLeader.GetHerHis]ทันที ทามกลางความโกลาหลของการยอมจํานนและการลี้ภัย [Root.GetLeader] ไดหนีไปยังประเทศเปนกลางแหงหนึ่งในยุโรปแลว และผูลี้ภัยเพียงไมกี่คนที่เหลืออยูของรัฐบาล[Root.GetAdjective]ตองตัดสินใจวาใครจะเปนผูนําการตอสูเพื่อยึดมาตุภูมิคืน"
 poland.25.a: "ผูรักชาติที่ไมมีสายสัมพันธกับซานัตซยา"
 poland.25.b: "เราตองการทหารลีเจียน"
 poland.25.c: "นี่คือโอกาสฟนฟูประชาธิปไตยโปแลนด"
 poland.26.t: "เสียงกระซิบแหงการปฏิวัติ"
 poland.26.d: "ทั่วโปแลนดที่ถูก[Root.GetAdjective]ยึดครอง มีเสียงกระซิบถึงการปฏิวัติที่กําลังกอตัวอยูใตดิน บนกําแพงเมืองมีขอความ “Niech żyje opór!” และคําขวัญทํานองเดียวกันติดอยู เรียกรองใหขบวนการตอตานลุกขึ้นสูการยึดครองของ[Root.GetAdjective] ที่ผานมากิจกรรมของขบวนการตอตานจํากัดอยูแคการแจกจายใบปลิวโฆษณาชวนเชื่อ การกอกวนสายการผลิต และการวางระเบิดกับกอวินาศกรรมเปนครั้งคราว แตตอนนี้ขบวนการตอตานกลับเงียบผิดปกติ และบรรยากาศในโปแลนดก็อบอวลไปดวยการทรยศและความหวาดระแวง\n\nสายลับ[Root.GetAdjective]ทั่วโปแลนดคาดการณวาจะเกิดการกบฏเต็มรูปแบบโดยการสนับสนุนของรัฐบาลพลัดถิ่น[POL.GetAdjective] [Root.GetNameDef] จะคุมโปแลนดไวไดก็ตอเมื่อปราบปรามขบวนการตอตานอยางเด็ดขาดเทานั้น"
 poland.26.a: "เราตองกวาดจับพวกทรยศเหลานี้"
