 ICE_greyshirts: "เสื้อเทา"
 ICE_greyshirts_desc: "กองกําลังติดอาวุธที่มีอาวุธพรอมและไดรับการฝกตั้งแตวัยเยาวอาจเปนเครื่องมืออันมีประโยชนในการบมเพาะคนหนุมสาวและหลอหลอมพวกเขาใหเขากับโลกใหมของเรา นอกจากนี้ การฝกกึ่งทหารยังหมายถึงการเสริมขีดความสามารถของกองทัพ ซึ่งอาจเปนประโยชนเมื่อทวงคืนสิ่งที่เปนของเราโดยชอบธรรม"
 ICE_viking_spirit: "Ásatrú"
 ICE_viking_spirit_desc: "ไรความกลัวและรายกาจ คือคําที่ใชกลาวถึงชาวไวกิ้งในอดีต พวกเขาขามมหาสมุทรโดยไมรูวามีสิ่งใดรออยูเบื้องหนา และมีเพียงผูแข็งแกรงเทานั้นที่ประสบความสําเร็จ ไรความกลัวและกลาหาญ คือสิ่งที่ชาวไอซแลนดตองเปนในวันนี้ เพราะดวยความกลาบาบิ่นและความกลาหาญเทานั้น ประเทศนี้จึงจะกาวขามสิ่งที่เคยเปน และครองทะเลเหนือไดอีกครั้ง"
 ICE_fascist_tech_sharing_group_name: "องคการวิจัยไอซแลนด"
 ICE_fascist_tech_sharing_group_desc: "รัฐไอซแลนดไดจัดตั้งโครงการความรวมมือดานการวิจัยระหวางตนเองกับรัฐที่มีอุดมการณเดียวกัน เพื่อพัฒนาเทคโนโลยีใหกาวหนายิ่งขึ้น"
 ICE_hosting_american_soldiers: "ตอนรับทหารอเมริกัน"
 ICE_hosting_american_soldiers_desc: "การใหทหารอเมริกันประจําการบนเกาะของเราเปดโอกาสใหเราชักชวนพวกเขามาเขารวมชาติของเรา นําชายผูมีความสามารถที่พรอมตอสูเพื่ออุดมการณรวมของเรามาให"
 ICE_conscription_idea: "Herþjónustu"
 ICE_conscription_idea_desc: "คนหนุมสาวทุกคนในไอซแลนดตองรับราชการทหารเปนเวลา 4 ประหวางอายุ 18 ถึง 22 ป เพื่อปกปองอธิปไตยของชาติ"
 ICE_professional_army_idea: "Víkingasveitin"
 ICE_professional_army_idea_desc: "กองทัพไอซแลนดประกอบดวยชายผูกลาหาญและใจเด็ดที่สุด และพรอมปกปองชาติไอซแลนดไมวาจะตองแลกดวยสิ่งใด"
 ICE_civil_defence_organization: "องคการปองกันภัยฝายพลเรือน"
 ICE_civil_defence_organization_desc: "พลเมืองไอซแลนดทุกคนพรอมทุกเมื่อที่จะทําทุกสิ่งที่จําเปนเพื่อปกปองประเทศ ชวยเหลือประชาชน หรือรักษาโครงสรางพื้นฐาน"

