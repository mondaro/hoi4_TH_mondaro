 DEN_industrial_capability_dynamic_modifier_light_regulation: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_desc: "เดนมารกเปนสังคมเกษตรกรรมและผูผลิตสินคาเกษตรมาแตดั้งเดิม แตอุตสาหกรรมของเรามีความสําคัญทั้งในดานบทบาทและเศรษฐกิจมากขึ้นเรื่อย ๆ เราตองพัฒนาอุตสาหกรรมและความทันสมัยเพื่อใหทันกับการพัฒนาอันรวดเร็วในยุคใหม"
