 #National Spirits
 FIN_finnish_army: "กองทัพบกฟนแลนด"
 FIN_finnish_army_desc: "ในฐานะผลผลิตของมรดกอันภาคภูมิและเปนเอกราช กองทัพบกฟนแลนดเปนกองกําลังที่นาเกรงขาม ผานการหลอหลอมจากการตอสูกับการรุกรานจากภายนอกมาหลายป ดวยความมุงมั่นอันแรงกลาที่จะปกปองมาตุภูมิ ทหารฟนแลนดเปนพลแมนปนที่เชี่ยวชาญและนักสูที่ทรหด พรอมตานทานแมศัตรูที่นาหวาดหวั่นที่สุด แมทรัพยากรจะจํากัด กองทัพบกฟนแลนดก็เปนตัวแทนของจิตวิญญาณที่เหนียวแนนและไมยอมแพซึ่งไมอาจหักไดงายๆ"
 FIN_finnish_navy: "กองทัพเรือฟนแลนด"
 FIN_finnish_navy_desc: "กองทัพเรือฟนแลนดเปนกองกําลังขนาดเล็กแตภาคภูมิ ซึ่งพรอมปกปองมาตุภูมิจากภัยคุกคามทั้งปวง ดวยการมุงเนนการปองกันชายฝงและการปกปองเสนทางเดินเรือ กองทัพเรือฟนแลนดจึงเปนสัญลักษณอันทรงพลังแหงเอกราชของฟนแลนด และเปนองคประกอบสําคัญในยุทธศาสตรการปองกันประเทศโดยรวม แมอาจตองเผชิญศัตรูที่เหนือกวาอยางทวมทน แตกะลาสีของกองทัพเรือฟนแลนดก็มุงมั่นจะสูดวยความกลาหาญและความทรหดไมแพเพื่อนรวมรบบนภาคพื้นดิน"
 FIN_finnish_airforce: "กองทัพอากาศฟนแลนด"
 FIN_finnish_airforce_desc: "แมจะมีขนาดเล็กและทรัพยากรจํากัด แตกองทัพอากาศฟนแลนดก็มีนักบินฝมือดีและนักออกแบบหัวกาวหนาจํานวนหนึ่ง ซึ่งขัดเกลาฝมือผานการทดลองและการดนสดมาหลายป ดวยความมุงมั่นลวนๆ และความพรอมปรับตัวตามสถานการณที่เปลี่ยนไป กองทัพอากาศฟนแลนดจึงไดชื่อวาเปนกองกําลังที่ไมอาจมองขาม พรอมปกปองมาตุภูมิดวยความกลาหาญและความทรหดไมแพกองกําลังภาคพื้นดิน"
 FIN_national_industry_expand: "$BUL_national_industry_01$"
 FIN_national_industry_expand_desc: "$SWI_expand_arms_industry_desc$"
 FIN_sami_pathfinders: "หนวยนําทางซามี"
 FIN_sami_pathfinders_desc: "ในฐานะผูเชี่ยวชาญการแกะรอยและนําทางในปา ชาวซามีสามารถเดินทางผานภูมิประเทศอันทุรกันดารทางเหนือของฟนแลนดไดอยางงายดาย และใหขาวกรองสําคัญแกกองกําลังฟนแลนด \nไมวาจะทามกลางความรอนแรงของการรบหรือในความเงียบงันของปาลึก หนวยนําทางซามีไดกลายเปนกําลังสําคัญของกองทัพบกฟนแลนด และเปนสัญลักษณอันยั่งยืนแหงมรดกอันภาคภูมิของประเทศ"
 FIN_fortification_effort: "ความพยายามสรางปอมปราการ"
 FIN_fortification_effort_desc: "$FIN_defense_in_depth_desc$"
 FIN_coastal_batteries_effort: "ความพยายามสรางปนใหญชายฝง"
 FIN_coastal_batteries_effort_desc: "$FIN_coastal_defense_desc$"
 FIN_mannerheim_line_expansion_modifier: "ขยายแนวมันเนอรไฮม"
 FIN_mannerheim_line_expansion_modifier_desc: "ดวยการเสริมความแข็งแกรงและขยายแนวมันเนอรไฮม เราจะสงสารที่ชัดเจนวาฟนแลนดไมใชเปาหมายที่จะยึดไดงายๆ และชาวฟนนพรอมปกปองเอกราชของตนดวยทุกเครื่องมือที่มี"
 FIN_bank_of_aland_ns: "$FIN_bank_of_aland$"
 FIN_bank_of_aland_ns_desc: "$FIN_bank_of_aland_desc$"
 FIN_infrastructure_effort: "ความพยายามสรางโครงสรางพื้นฐาน"
 FIN_infrastructure_effort_desc: "$FIN_industrial_development_desc$"
 FIN_hydro_electric_expansion: "ขยายพลังงานไฟฟาพลังนํ้า"
 FIN_hydro_electric_expansion_desc: "ดวยการใชประโยชนจากทรัพยากรธรรมชาติของแมนํ้าอันอุดมสมบูรณของ [ROOT.GetName] การขยายโครงสรางพื้นฐานไฟฟาพลังนํ้าครั้งสําคัญกําลังดําเนินอยู การลงทุนสรางโรงไฟฟาพลังนํ้าแหงใหมจะเปนหนทางขยายขีดความสามารถทางอุตสาหกรรมอยางมหาศาลและขับเคลื่อนการเติบโตของชาติ"
 FIN_motti_tactics_modifier: "ยุทธวิธีม็อตติ"
 FIN_motti_tactics_modifier_desc: "ทหารฟนแลนดกําลังใชยุทธวิธีม็อตติในรัฐนี้ โอบลอมและตัดขาดหนวยของศัตรูโดยมีเปาหมายเพื่อทําลายเสนทางการสงกําลังบํารุงและการสื่อสารของพวกเขา"
 FIN_weapon_caches_modifier: "คลังอาวุธลับ"
 FIN_weapon_caches_modifier_desc: "หลังปฏิบัติการทางทหารลับ อาวุธและยุทโธปกรณของกองทัพบกฟนแลนดจํานวนมากถูกซอนไวในคลังลับที่กระจายอยูทั่วรัฐ เพื่อใหกลุมตอตานของฟนแลนดสูรบกับผูรุกรานตอไปได"
 FIN_public_opposition_to_the_winter_war: "ประชาชนตอตานสงครามฤดูหนาว"
 FIN_public_opposition_to_the_winter_war_desc: "ประชาชนเริ่มสงสัยถึงความจําเปนของสงครามกับ [FIN.GetNonIdeologyName] สิ่งที่เคยเปนความคิดเห็นของคนสวนนอยซึ่งหนวยงานความมั่นคงของเราควบคุมไวได บัดนี้ไดขยายกลายเปนความรูสึกกระแสหลักที่อยูนอกเหนือการควบคุมของเรา"
 FIN_we_are_the_white_death_idea: "เราคือมัจจุราชสีขาว"
 FIN_we_are_the_white_death_idea_desc: "ซิโม แฮยฮา พลซุมยิงผูโดงดังของเรา ไดปลุกขวัญกําลังใจของกองทัพดวยวีรกรรมอันกลาหาญในสนามรบ บัดนี้ทหารตางรวมใจกันภายใตชื่อเรียก 'มัจจุราชสีขาว' ชื่ออันนาขนลุกที่สะทอนความมุงมั่นไมยอทอในการทําลายศัตรูทุกรายที่โงพอจะรุกรานชาติของเรา"
 FIN_embraced_by_the_white_death: "ในออมกอดของมัจจุราชสีขาว"
 FIN_embraced_by_the_white_death_desc: "แมจะเฉียดตายมาหลายครั้ง ซิโม แฮยฮา ยังคงมอบออมกอดอันเยือกเย็นแหงความตายและความหวาดกลัวใหแกศัตรูของเรา"

 FIN_the_lapland_war: "เขารวมสงครามแลปแลนด"
 FIN_compensation_for_side_switch_good: "คาชดเชยจากฟนแลนด"
