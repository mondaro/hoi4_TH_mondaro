 DEN_industrial_capability_dynamic_modifier_light_regulation_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_improved_desc: "เดนมารกเปนสังคมเกษตรกรรมและผูผลิตสินคาเกษตรมาแตดั้งเดิม แตอุตสาหกรรมของเรามีความสําคัญทั้งในดานบทบาทและเศรษฐกิจมากขึ้นเรื่อย ๆ เราไดกาวแรกในการปรับปรุงและพัฒนาอุตสาหกรรมใหทันสมัย ทําใหเรามีความสามารถในการแขงขันและผลิตภาพมากขึ้น"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved_desc: "$DEN_industrial_capability_dynamic_modifier_improved_desc$"
 DEN_industrial_capability_dynamic_modifier_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_max_improved_desc: "เดนมารกเปนสังคมเกษตรกรรมและผูผลิตสินคาเกษตรมาแตดั้งเดิม แตอุตสาหกรรมของเรามีความสําคัญทั้งในดานบทบาทและเศรษฐกิจมากขึ้นเรื่อย ๆ อุตสาหกรรมของเราไดรับการปรับใหทันสมัยและพัฒนาอยางเต็มที่ เดินเครื่องเต็มกําลังทั้งวันทั้งคืน"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved_desc: "$DEN_industrial_capability_dynamic_modifier_max_improved_desc$"
 DEN_economic_crisis_dynamic_modifier: "วิกฤตเศรษฐกิจ"
 DEN_economic_crisis_dynamic_modifier_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญโจมตีเราอยางเต็มกําลัง ผลคืออุปสงคผลผลิตทางการเกษตรที่ลดลงทําใหเกษตรกรจํานวนมากตองเปนหนี้และถูกยึดทรัพย ขณะที่อัตราการวางงานที่พุงสูงขึ้นกลายเปนแหลงเพาะพันธุของขบวนการสุดโตงที่ชายขอบทางการเมือง "
 DEN_neglected_military_dynamic_modifier: "กองทัพที่ถูกละเลย"
 DEN_neglected_military_dynamic_modifier_desc: "เราดําเนินนโยบายความเปนกลางแบบปลดอาวุธมาหลายป เพื่อไมใหเปนการยั่วยุชาวเยอรมัน กองทัพแทบไมไดเปนอะไรมากไปกวากองกําลังเชิงสัญลักษณเพื่อปกปองอธิปไตยของเรา กองทัพถูกตัดงบประมาณอยางตอเนื่องตลอดหลายป ทําใหไมมีความพรอมเลยสําหรับความขัดแยงใด ๆ ที่อาจเกิดขึ้น"
 DEN_danish_produce: "ผลิตผลของเดนมารก"
 DEN_danish_produce_desc: "เบคอนและผลิตภัณฑนมเปนสินคาสงออกหลักของเดนมารกมาโดยตลอด ถึงขนาดที่ในชวงมหาสงครามเกิดคําวา ‘บารอนกูลาช’ ขึ้น ซึ่งหมายถึงผูที่รํ่ารวยจากการคาขายกับบริเตนใหญและเยอรมนี"
 DEN_sahnefront: "แนวรบเนย"
 DEN_sahnefront_desc: "เดนมารกเปนประเทศอุดมสมบูรณที่มีประเพณีเกษตรกรรมอันเกาแก และในฐานะที่พวกเขาอยูใตการปกครองของเรา เรายอมไดเก็บเกี่ยวผลประโยชนเหลานั้น การครอบครองเดนมารกจะเสริมกําลังและขีดความสามารถทางทหารของเรา"
 DEN_improved_logistics: "การสงกําลังบํารุงที่ดีขึ้น"
 DEN_improved_logistics_desc: "เดนมารกเปนประเทศที่มั่งคั่งและอุดมสมบูรณ การนําทรัพยากรเหลานี้มาใชจะชวยใหเรามีอาหารสําหรับกองทหารและเสริมขีดความสามารถทางทหารของเรา"
 DEN_danish_licensing_ns: "ขอตกลงการคา"
 DEN_danish_licensing_ns_desc: "ในโลกที่การทําธุรกรรมและการคาระหวางประเทศเปนสิ่งจําเปน การมีคูคาที่ใกลชิดยอมเปนเรื่องดี ขอตกลงนี้จะเปนประโยชนตอทั้งสองประเทศและกระชับสายสัมพันธระหวางเรา"
