 DEN_war_preparations_dynamic_modifier: "การเตรียมพรอมทําสงคราม"
 DEN_war_preparations_dynamic_modifier_desc: "เราจะฝาพายุไปไดก็ตอเมื่อเราพรอมเทานั้น เราตองสะสมวัตถุดิบและเสบียงอื่น ๆ ไวใชยามจําเปน และเตรียมอุตสาหกรรมของเราใหพรอมสนับสนุนความพยายามในการทําสงคราม" 
 DEN_rule_the_north_sea: "ครองทะเลเหนือ"
 DEN_rule_the_north_sea_desc: "เพื่อบรรลุความทะเยอทะยานในทะเลเหนือ เราตองสรางกองเรือใหญที่มีอํานาจการยิงเหนือกวา เพื่อรักษาดินแดนของเราและยับยั้งไมใหชาติอื่นมาแยงชิงไป"
 DEN_fromandskorpset_ns: "$DEN_fromandskorpset$"
 DEN_fromandskorpset_ns_desc: "เมื่อกองกําลังสะเทินนํ้าสะเทินบกพิเศษของเราจัดตั้งขึ้นแลว เราก็พรอมแผแสนยานุภาพทางทหารไปไกลทั่วทุกทิศ ขามนานนํ้าไปสูชายฝงตางแดน"
 DEN_declaration_of_neutrality: "คําประกาศความเปนกลาง"
 DEN_declaration_of_neutrality_desc: "เดนมารกสามารถอยูหางจากสงครามไดมาหลายทศวรรษ และเปนไปไดดวยนโยบายความเปนกลางของเราเทานั้น นโยบายนี้รับใชเราไดดีมาตลอดและจะยังคงเปนเชนนั้นตอไป"
 DEN_denmark_becomes_a_puppet_tt: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! จะมีทางเลือกที่จะพยายามเปนรัฐหุนเชิดหากประเทศใกลเคียงที่แข็งแกรงกวาบุกเขามา โดยยังคงรูปแบบการปกครองปจจุบันไว\n\n"
 DEN_neutrality_flag: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! เปนเอกราชและไมไดอยูในภาวะสงคราม"
 DEN_political_edicts_dynamic_modifier: "ประกาศทางการเมือง"
 DEN_political_edicts_dynamic_modifier_desc: "ชาวเดนมารกทุกคนตองรูวาตนถูกคาดหวังและตองทําสิ่งใดในยามยากลําบากเชนนี้ เราตองระแวดระวังการกระทําที่เปนปรปกษตอชาติของเรา และรวมมือกันมุงสูเปาหมายเดียวกัน"
 DEN_resistance_dynamic_modifier: "Modstandsbevægelsen"
 DEN_resistance_dynamic_modifier_desc: "มีเพียงการรวมพลังและตอตานกองกําลังยึดครอง[?DEN.DEN_overlord_nation.GetAdjective]เทานั้น เราจึงจะหวังไดเห็น [DEN.GetNameDef] ที่เปนอิสระอีกครั้ง ขบวนการตอตานเปนศูนยกลางของเรื่องนี้ และจะมีบทบาทสําคัญยิ่งในการทวงคืนอิสรภาพของเราในสักวันหนึ่ง" 
 DEN_resistance_dynamic_modifier_improved: "$DEN_resistance_dynamic_modifier$"
 DEN_resistance_dynamic_modifier_improved_desc: "$DEN_resistance_dynamic_modifier_desc$"
 DEN_occupation_laws_dynamic_modifier: "กฎหมายการยึดครอง"
 DEN_occupation_laws_dynamic_modifier_desc: "เจาเหนือหัว[?DEN.DEN_overlord_nation.GetAdjective]ของเราสั่งใหเราชวยเหลือพวกเขาในสงคราม และไดบังคับใชกฎหมายหลายฉบับเพื่อใหแนใจวาเราจะทําตาม"
 DEN_securing_sweden_ns: "ยึดครอง [SWE.GetNameDef]"
 DEN_securing_sweden_ns_desc: "ชาวสวีเดนเคยเปนสวนหนึ่งของสหภาพคาลมารและอยูใตการปกครองของเดนมารก ถึงเวลาแลวที่จะผนวกสวีเดนกลับเขาสูราชอาณาจักรของเรา กองทัพของเราเตรียมพรอมสําหรับวันนี้และฝกฝนอยางขยันขันแข็งเพื่อตอสูและทําลายกองกําลังสวีเดนที่เปนปรปกษ" 
 DEN_securing_norway_ns: "ยึดครอง [NOR.GetNameDef]"
 DEN_securing_norway_ns_desc: "ชาวนอรเวยเคยเปนสวนหนึ่งของราชอาณาจักรของเรามาหลายรอยป ถึงเวลาแลวที่จะผนวกนอรเวยกลับเขาสู [DEN.GetNameDefCap] อีกครั้ง กองทัพของเราเตรียมพรอมสําหรับวันนี้และฝกฝนอยางขยันขันแข็งเพื่อตอสูและทําลายกองกําลังนอรเวยที่เปนปรปกษ" 
 DEN_securing_finland_ns: "ยึดครอง [FIN.GetNameDef]"
 DEN_securing_finland_ns_desc: "แมเราจะไมเคยใชอํานาจปกครองพวกเขาโดยตรง แตชาวฟนแลนดก็เคยเชื่อฟงเราภายใตสหภาพคาลมาร บัดนี้ถึงเวลาที่จะนําฟนแลนดมาอยูใตการปกครองโดยตรงของเดนมารก กองทัพของเราเตรียมพรอมสําหรับวันนี้และฝกฝนอยางขยันขันแข็งเพื่อตอสูและทําลายกองกําลังฟนแลนดที่เปนปรปกษ"
 DEN_foreign_influence_ns: "อิทธิพลตอมติมหาชนตางชาติ"
 DEN_fascist_propaganda_ns: "โฆษณาชวนเชื่อฟาสซิสต"
 DEN_fascist_propaganda_ns_desc: "พวกฟาสซิสตผูหลอกลวงและไมซื่อสัตยกําลังปลอยขาวลือมุงรายเกี่ยวกับรัฐบาลของเรา เพื่อบอนทําลายการปกครองของเรา"
 DEN_communist_propaganda_ns: "โฆษณาชวนเชื่อคอมมิวนิสต"
 DEN_communist_propaganda_ns_desc: "พวกคอมมิวนิสตผูหลอกลวงและไมซื่อสัตยกําลังปลอยขาวลือมุงรายเกี่ยวกับรัฐบาลของเรา เพื่อบอนทําลายการปกครองของเรา"
 DEN_monarchist_discontent_ns: "ความไมพอใจของฝายนิยมกษัตริย"
 DEN_monarchist_discontent_ns_desc: "ขบวนการรักชาติไดกอตัวขึ้น โดยรวมตัวกันภายใตสัญลักษณอันลาสมัยอยางพระมหากษัตริย พวกเขาไมพอใจรัฐบาลของประชาชน โดยประชาชน เพื่อประชาชนของเรา และอยากเห็นพระมหากษัตริยขึ้นมาทรงกุมอํานาจเองมากกวา"
 DEN_haeren_dynamic_modifier: "Hæren"
 DEN_haeren_dynamic_modifier_desc: "ในอดีตเดนมารกเคยปกครองสแกนดิเนเวียและเปนมหาอํานาจที่โดดเดนในภูมิภาค กองทัพของเราเคยเดินทัพขามภูมิภาคทะเลบอลติกโดยไมมีสิ่งใดขัดขวางหรือตอตาน บัดนี้กองทัพเหลือเพียงเงาของตนในอดีต แตเรายังสามารถสรางกําลังและแสนยานุภาพขึ้นมาใหมเพื่อปกปองพรมแดนและประชาชนของเรา"
 DEN_haeren_dynamic_modifier_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_improved_desc: "ในอดีตเดนมารกเคยปกครองสแกนดิเนเวียและเปนมหาอํานาจที่โดดเดนในภูมิภาค กองทัพของเราเคยเดินทัพขามภูมิภาคทะเลบอลติกโดยไมมีสิ่งใดขัดขวางหรือตอตาน กองทัพไดกําลังบางสวนในอดีตกลับคืนมาแลว และเราไดกาวแรกในการฟนฟูกองทัพสูความรุงโรจนดังเดิม"
 DEN_haeren_dynamic_modifier_max_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_max_improved_desc: "ในอดีตเดนมารกเคยปกครองสแกนดิเนเวียและเปนมหาอํานาจที่โดดเดนในภูมิภาค กองทัพของเราเคยเดินทัพขามภูมิภาคทะเลบอลติกโดยไมมีสิ่งใดขัดขวางหรือตอตาน กองทัพของเรากลับมาเปนที่นาเกรงขามและหวาดกลัวอีกครั้ง! เราไดฟนฟูกําลังของมันขึ้นมาใหม และพรอมรับมือทุกสิ่งที่อาจเกิดขึ้น"
 DEN_sovaernet_dynamic_modifier: "Søværnet"
 DEN_sovaernet_dynamic_modifier_desc: "ครั้งหนึ่งเดนมารกเคยเปนมหาอํานาจในทะเลบอลติก ครองทองทะเลดวยกองเรืออันเกรียงไกร แตเรามีประวัติศาสตรการเดินเรืออันยาวนานมากอนหนานั้นเสียอีก ชาวไวกิ้งแลนเรือไปไกลทั่วทุกทิศเพื่อแพรความหวาดกลัวและพิชิตดินแดน ดวยความมุงมั่นและอดทน เราจะสรางกองทัพเรือขึ้นมาใหมเพื่อครองทองทะเลอีกครั้ง"
 DEN_sovaernet_dynamic_modifier_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_improved_desc: "ครั้งหนึ่งเดนมารกเคยเปนมหาอํานาจในทะเลบอลติก ครองทองทะเลดวยกองเรืออันเกรียงไกร แตเรามีประวัติศาสตรการเดินเรืออันยาวนานมากอนหนานั้นเสียอีก ชาวไวกิ้งแลนเรือไปไกลทั่วทุกทิศเพื่อแพรความหวาดกลัวและพิชิตดินแดน แมยังมีงานอีกมากรออยูขางหนา แตกองทัพเรือก็ไดความรุงโรจนและกําลังในอดีตกลับคืนมามากแลว"
 DEN_sovaernet_dynamic_modifier_max_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_max_improved_desc: "ครั้งหนึ่งเดนมารกเคยเปนมหาอํานาจในทะเลบอลติก ครองทองทะเลดวยกองเรืออันเกรียงไกร แตเรามีประวัติศาสตรการเดินเรืออันยาวนานมากอนหนานั้นเสียอีก ชาวไวกิ้งแลนเรือไปไกลทั่วทุกทิศเพื่อแพรความหวาดกลัวและพิชิตดินแดน เราไดเสริมสรางกองทัพเรือขึ้นมาแลว และพรอมออกเรือไปครองทองทะเลอีกครั้ง"
 DEN_flyvevabnet_dynamic_modifier: "Flyvevåbnet"
 DEN_flyvevabnet_dynamic_modifier_desc: "สงครามทางอากาศคือวิธีทําสงครามแบบใหมลาสุดและเปนเครื่องชี้วัดกองทัพสมัยใหม ดวยการจัดตั้งเหลาทัพใหมลาสุดของกองทัพเดนมารกอยาง Flyvevåbnet บัดนี้เราไดกลายเปนกองกําลังสมัยใหมที่ทุกคนตองเกรงขามอยางแทจริง"
 DEN_flyvevabnet_dynamic_modifier_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_flyvevabnet_dynamic_modifier_max_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_max_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
#STATE MODIFIERS
 DEN_development_projects_state_modifier: "โครงการพัฒนาอุตสาหกรรม"
 DEN_development_projects_state_modifier_desc: "ภาคอุตสาหกรรมจําเปนตองขยายตัวและพัฒนากระบวนการและผลิตภัณฑที่คุมคามากขึ้น เราไดลงทุนทรัพยากรที่นี่เพื่อใหอุตสาหกรรมเติบโตรุงเรือง และชวยใหเศรษฐกิจของรัฐขยายตัว"
 DEN_development_projects_mainland_state_modifier: "$DEN_development_projects_state_modifier$"
 DEN_development_projects_mainland_state_modifier_desc: "$DEN_development_projects_state_modifier_desc$"
 DEN_military_projects_state_modifier: "โครงการพัฒนาการทหาร"
 DEN_military_projects_state_modifier_desc: "รัฐนี้ไดรับการพิจารณาวาจําเปนตองไดรับการปกปองและเสริมสรางขีดความสามารถทางทหาร เพื่อรับประกันความมั่นคงของชาติ"
 DEN_home_guard_state_modifier: "Hjemmeværnet"
 DEN_home_guard_state_modifier_desc: "กองกําลังรักษาดินแดนปฏิบัติการอยูในรัฐนี้ คอยชะลอการรุกคืบของขาศึก"
 DEN_pan_scandinavianism_modifier: "จิตวิญญาณแหงลัทธิรวมสแกนดิเนเวีย"
 DEN_pan_scandinavianism_modifier_desc: "ความคลั่งไคลในลัทธิรวมสแกนดิเนเวียแผปกคลุมรัฐนี้ เสริมความมุงมั่นและความทุมเทของประชาชน"

###### NORDIC SHARED IDEAS ######

 NORDIC_to_arms_against_tyranny_ns: "จับอาวุธตอตานทรราช"
 NORDIC_to_arms_against_tyranny_ns_desc: "ขณะที่กรงเล็บแหงทรราชคุกคามเอกราชของเพื่อนบานนอรดิกของเรา เราตองพรอมปกปองพวกเขา มิฉะนั้นเราจะกลายเปนเหยื่อรายตอไปของทรราช"
 NORDIC_the_nordic_march_ns: "การเดินทัพแหงนอรดิก"
 NORDIC_the_nordic_march_ns_desc: "ชาติรอบขางเรายังมองไมเห็น แตสิ่งที่พวกเขาเรียกวาทรราชนั้นไมใชอะไรอื่นนอกจากสายลมแหงการเปลี่ยนแปลง และหลังจากที่พวกเขาทําลายทุกสิ่งที่ขวางหนาแลว ระเบียบใหมแหงนอรดิกจะผงาดขึ้นจากเถาถาน และเราจะอยูในตําแหนงที่จะยึดอํานาจนั้นไว"

