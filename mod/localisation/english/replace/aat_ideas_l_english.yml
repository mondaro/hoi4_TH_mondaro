 SWE_air_rearnament_value: "การฟนฟูกําลังกองทัพอากาศ: [SWE_rearmament_status_text_air] [?SWE.folkhemmet_air_part]/[?SWE.folkhemmet_max_constituent_parts]"
 SWE_folkhemmet_intactness_value: "§Yสถานะ Folkhemmet:§! [SWE_folkhemmet_status_text] ([?SWE.folkhemmet_intactness]/[?SWE.folkhemmet_max_intactness])"
 SWE_folkhemmet_system_desc: "ขณะที่โลกขยับเขาใกลความขัดแยงระดับโลกมากขึ้นทุกที สวีเดนติดอยูในทางแพรงวาจะฟนฟูกําลังทหารโดยแลกกับระบบสวัสดิการของตน หรือจะรักษามันไวแตเสี่ยงที่จะไมพรอมรับมือความขัดแยงในอนาคต"
 #SWE_folkhemmet_status_text: "[SWE_folkhemmet_status_text]"
 SWE_folkhemmet_intactness_intact: "§Gสมบูรณ§!"
 SWE_folkhemmet_intactness_eroding: "§Yกําลังกัดกรอน§!"
 SWE_folkhemmet_intactness_gone: "§Rถูกกัดกรอนแลว§!"
 SWE_folkhemmet_army_status_text: "[SWE_rearmament_status_text_army]"
 SWE_rearmament_3_text: "§Yงบประมาณเต็มที่§!"
 SWE_rearmament_2_text: "§Yงบประมาณปานกลาง§!"
 SWE_rearmament_1_text: "§Yงบประมาณตํ่า§!"
 SWE_rearmament_0_text: "§Yไมมีงบประมาณ§!"
 SWE_folkhemmet_pdx_tooltip: "ทุกปเราสามารถกําหนดนโยบายการฟนฟูกําลังทหารหรือการลดกําลังทหารของ [SWE.GetnameDef] ได ยิ่งเราผลักดันสังคมไปสูการฟนฟูกําลังทหารมากเทาใด โบนัส§Yการสนับสนุนสงคราม§! และความเร็วการกอสราง§Yโรงงานทหาร§!และ§Yอูตอเรือ§!ก็จะยิ่งแข็งแกรงขึ้น ขณะที่§Yเสถียรภาพ§!และความเร็วการกอสราง§Yโรงงานพลเรือน§!จะออนลง\n§YFolkhemmet§! ที่มี§Yความสมบูรณ§! 0 จะกลับขั้วกันเอง โดยโบนัสฝายพลเรือนจะเปน§Rคาลบ§! และโบนัสฝายทหารจะเปน§Gคาบวก§! \n\nเมื่อคณะกรรมการฟนฟูกําลังทหารเปดประชุม เราจะมีชวงเวลาหนึ่งใหเปลี่ยนนโยบายไดอยางอิสระ แตเมื่อการประชุมสิ้นสุดลง ทางเลือกเหลานั้นจะถูกล็อกไวจนถึงปถัดไป"
 #SWE_folkhemmet_intactness_abolished: "§RAbolished§!"


 SWE_hungershield: "Hungersköld"
 SWE_hungershield_instant_desc: "สวีเดนเสี่ยงตอการนัดหยุดงานหรือการจลาจลหากเสถียรภาพตํ่ากวา §Y68%§! §Yจะถูกนําออกเมื่อเงื่อนไขขอใดขอหนึ่งตอไปนี้เปนจริง:§!\nมีโรงงานพลเรือนมากกวา §Y45§! แหงรวมการคา \nสรางโรงงานพลเรือนแลวมากกวา §Y14§! แหงไมรวมการคา\nไดรับ§Yอํานาจทางการเมือง§! §G120§! เมื่อถูกนําออก"
 SWE_severe_lack_of_ammunition: "ขาดแคลนกระสุนอยางรุนแรง"
