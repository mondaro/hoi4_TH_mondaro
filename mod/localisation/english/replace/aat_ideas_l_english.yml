 FIN_repurposed_small_industries: "อุตสาหกรรมขนาดเล็กที่ปรับเปลี่ยนการใชงาน"
 FIN_repurposed_small_industries_desc: "ดวยการเขาควบคุมอุตสาหกรรมขนาดเล็กและปรับเปลี่ยนใหตอบสนองความตองการของความพยายามในสงคราม บัดนี้รัฐบาลฟนแลนดสามารถรวบรวมทรัพยากรและระดมเศรษฐกิจไดอยางเต็มที่ ทั้งเพื่อความตองการดานพลเรือนและการทหาร"
 FIN_lotta_svard: "ลอตตา สวารด"
 FIN_lotta_svard_desc: "ลอตตา สวารดสนับสนุนกองทัพของเราในฐานะหนวยเสริมมาหลายป เมื่อชาติเผชิญสถานการณอันเลวรายเชนนี้ เราจึงขยายบทบาทของพวกเธอดวยการติดอาวุธให และอนุญาตใหสมาชิกมีบทบาทในแนวหนามากขึ้นในการสนับสนุนการปองกันประเทศ"
 FIN_lotta_svard_support_battalions_bonus_tt: "§Y$category_support_battalions$:§! การจัดระเบียบ: §G+10§!, HP: §G+5§!"
 FIN_international_volunteers: "อาสาสมัครนานาชาติ"
 FIN_international_volunteers_desc: "อาสาสมัครจากทั่วโลกกําลังเดินทางมายังฟนแลนดเพื่อเขารวมกองกําลังของเรา ชาวฟนนจะไมตองสูสงครามนี้ตามลําพัง!"

 FIN_militarized_society_requirement_tt: "§Rจะถูกนําออกชั่วคราว§! หากไมไดใชกฎหมายการเกณฑทหาร §Y$all_adults_serve$§! หรือ §Y$scraping_the_barrel$§!"
 FIN_the_lone_wolf_tt: "§Rไมสามารถสรางหรือเขารวมฝายได§!"

 FIN_popular_support_for_the_revolution: "การสนับสนุนการปฏิวัติจากมวลชน"
 FIN_popular_support_for_the_revolution_desc: "ชนชั้นกรรมาชีพ[FIN.GetAdjective]ลุกขึ้นและสลัดพันธนาการแหงการกดขี่ของชนชั้นกระฎมพีไดในที่สุด ขบวนการของเราจะรวมกันสั่นคลอนรากฐานของจักรวรรดินิยม ไมเพียงใน [FIN.GetNonIdeologyName] แตทั่วทั้งโลก!"
 FIN_imprisoned_right_wing_leaders: "ผูนําฝายขวาถูกจําคุก"
 FIN_imprisoned_right_wing_leaders_desc: "ผูนํากลุมฝายขวาตางๆ เชน นักการเมืองและเจาสัวธุรกิจ ถูกจับกุมคุมขังลวงหนาเพื่อปองกันไมใหพวกเขาดําเนินกิจกรรมตอตานการปฏิวัติ"
 FIN_low_army_morale: "ขวัญกําลังใจกองทัพตกตํ่า"
 FIN_low_army_morale_desc: "กองทัพของเราไมคอยกระตือรือรนกับการตองสูในสงครามกลางเมืองอีกครั้ง ในเวลาไมนานหลังครั้งกอน โดยเฉพาะขวัญกําลังใจในกองทัพที่ตกตํ่าลงอยางหนักนับตั้งแตการสูรบปะทุขึ้น"
 FIN_commitment_from_construction_workers: "ความทุมเทของแรงงานกอสราง"
 FIN_commitment_from_construction_workers_desc: "แรงงานกอสรางคุนเคยดีกับความโหดรายของการขูดรีดแบบทุนนิยม หลายคนจึงกลายเปนผูสนับสนุนขบวนการปฏิวัติของเราอยางแข็งขัน ขณะที่บางคนเขารวมกองทัพ อีกหลายคนทุมเทนําความเชี่ยวชาญมาใชในงานกอสรางใดๆ ที่รัฐอาจตองดําเนินการเพื่อทําสงคราม"
 FIN_commitment_from_the_trade_unions: "ความทุมเทของสหภาพแรงงาน"
 FIN_commitment_from_the_trade_unions_desc: "สหภาพแรงงานตอสูอยางดุเดือดมาหลายทศวรรษกับความอยุติธรรมของการกดขี่แบบทุนนิยมในที่ทํางาน และมีบทบาทสําคัญในการยกระดับจิตสํานึกทางชนชั้นในหมูประชาชน บัดนี้พวกเขาเขารวมขบวนการปฏิวัติของเราอยางเต็มใจเพื่อยุติทุนนิยมใหสิ้นซาก"
 FIN_infiltrated_assets: "สายลับที่แทรกซึมไว"
 FIN_infiltrated_assets_desc: "ดวยขอตกลงการคาใหมกับชาติอื่นๆ เรายังไดโอกาสในการแทรกซึมหุนสวนของเราดวย หวังวาสิ่งนี้จะทําใหเราเขาใจแรงจูงใจและเปาหมายของพวกเขาไดดีขึ้น ซึ่งจะชวยใหเราปกปองผลประโยชนของเราเองไดดียิ่งขึ้น"
 FIN_baltic_sea_focus: "มุงเนนทะเลบอลติก"
 FIN_baltic_sea_focus_desc: "ทะเลบอลติกเปนประเด็นสําคัญยิ่งตอการปองกันประเทศ เราตองใหการฝกและทรัพยากรที่กองทัพเรือตองการ เพื่อใหพวกเขาบรรลุภารกิจในภูมิภาคนี้อยางมีประสิทธิภาพที่สุด"
 FIN_finnish_goods: "สินคาฟนแลนด"
 FIN_finnish_goods_desc: "ดวยการเดินเกมอันแยบยล เราไดทําขอตกลงการคาที่แข็งแกรงกับ [FIN.GetName] ของคูซิเนน ทําใหเราไดสิทธิพิเศษในการเขาถึงสินคาอันมีคาของพวกเขา และไดเงื่อนไขการจัดซื้อที่เปนประโยชนอยางยิ่ง"
 FIN_fascist_regime: "ระบอบฟาสซิสต"
 FIN_fascist_regime_desc: "$FIN_a_fascist_regime$"
 FIN_patriotic_peoples_movement_ns_1: "$FIN_patriotic_peoples_movement$"
 FIN_academic_karelian_society_ns_1: "$FIN_academic_karelian_society$"
 FIN_suojeluskunta_ns_1: "Suojeluskunta"
 FIN_anti_soviet_sentiment: "ความรูสึกตอตานโซเวียต"
 FIN_anti_soviet_sentiment_desc: "ประชาชนในรัฐนี้ฝงใจเคียดแคน [SOU.GetNameDef] อยางลึกซึ้ง โดยมองวาเปนเพียงจักรวรรดิรัสเซียที่เปลี่ยนชื่อใหม หรือเปนภัยคุกคามตอคุณคาดั้งเดิมของพวกเขา"
 FIN_confederation_of_finno_russian_republics_dm: "สมาพันธสาธารณรัฐฟนโน-รัสเซีย"
 FIN_confederation_of_finno_russian_republics_dm_desc: "$FIN_confederated_finno_russian_republics$"


#NORWAY - National Spirits 
# Ideas 
 NOR_complacent_cabinet_ns: "คณะรัฐมนตรีที่ชะลาใจ"
 NOR_complacent_cabinet_ns_desc: "การที่โยฮัน นีกอรดสโวลล จัดตั้งรัฐบาลที่มีเสถียรภาพไดไมใชเรื่องเล็ก เขาและคณะรัฐมนตรีดูเหมือนจะคิดวานั่นคืออุปสรรคสุดทาย แตสิ่งที่พวกเขายังไมรูคือมันเปนเพียงอุปสรรคแรกจากอีกมากมาย"
 NOR_obsolete_armed_forces_ns_1: "กองทัพที่ลาสมัย"
 NOR_obsolete_armed_forces_ns_1_desc: "นอรเวยไมไดดูแลกองทัพมานานมาก จนบัดนี้กองทัพเหมาะจะอยูในพิพิธภัณฑมากกวาในสนามรบ"
 NOR_the_hard_thirties_ns: "ทศวรรษ 1930 อันยากลําบาก"
 NOR_the_hard_thirties_ns_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญป 1929 ยังคงสงผลตอทุกครัวเรือนและทุกธุรกิจทั่วนอรเวย อาจตองอาศัยปาฏิหาริยจึงจะผานทศวรรษนี้ไปได"
 NOR_anti_communist_sentiment_ns: "ความรูสึกตอตานคอมมิวนิสต"
 NOR_anti_communist_sentiment_ns_desc: "[SOU.GetNameDefCap] และคอมมิวนิสตในตางแดนไดปลูกฝงความหวาดกลัวใหชาว[NOR.GetAdjective]จํานวนมาก จนถึงขั้นที่ฟาสซิสตกลายเปนเรื่องไมนากังวลเมื่อเทียบกัน ตราบใดที่พวกเขาจัดการภัยแดงได"
 NOR_disjointed_cabinet_conscription_law_TT: "§Rไมสามารถเพิ่มระดับกฎหมายการเกณฑทหารได§!"
 NOR_broken_gun_ns: "ปนหัก"
 NOR_broken_gun_ns_desc: "นโยบายปนหักของเราจะทําใหสันติภาพและความมั่งคั่งแผไปทั่ว [NOR.GetName] และไกลกวานั้น เราสามารถใชเงินไปปรับปรุงชีวิตของพลเมือง และแสดงใหเพื่อนบานเห็นวาเราไมมีเจตนาราย" 
 NOR_printing_money_ns: "พิมพธนบัตร"
 NOR_printing_money_ns_desc: "หากเราตองการหลุดพนจากทศวรรษ 1930 อันยากลําบากกอนที่ทศวรรษจะสิ้นสุดลงจริงๆ เราตองใชเงิน และตองใชมหาศาล!"
 NOR_defensive_rearmament_ns: "การติดอาวุธใหมเพื่อการปองกัน"
 NOR_defensive_rearmament_ns_desc: "เราจะปลอยใหสวนอื่นของโลกคิดวาเราเปนพวกกระหายสงครามแลวโจมตีเรากอนไมได ทุกความพยายามในการติดอาวุธใหมตองมีเปาหมายเพื่อการปองกันอยางชัดเจน"
 NOR_coordinating_committee: "คณะกรรมการประสานงาน"
 NOR_coordinating_committee_desc: "ศูนยกลางของการตอตานภาคพลเรือนคือ Koordinasjonskomiteen ซึ่งมีหนาที่เชื่อมโยงรัฐบาลพลัดถิ่นกับกลุมตอตานภาคพลเรือนตางๆ ใน [NOR.GetName]"
 NOR_kretsen_ns: "Kretsen"
 NOR_kretsen_ns_desc: "กลุมนี้ฝงตัวอยูลึกในใจกลางของผูรุกราน และจัดประชุมลับที่ฟารมกรีเมลุนด หนาที่ของพวกเขาคือนําการตอตานภาคพลเรือนดวยทุกวิถีทาง ทั้งจากภายนอกและภายในการยึดครองของฟาสซิสต"
 NOR_sivorg_ns: "Sivorg"
 NOR_sivorg_ns_desc: "การรวมตัวของกลุมตอตานภาคพลเรือน รวมถึงคณะกรรมการประสานงานและ Kretsen พวกเขาคือชายหญิงแหงแนวหลัง ผูตองยึดมั่นในความหวังวาเราจะเอาชนะฟาสซิสตและนําอิสรภาพกลับคืนสู [NOR.GetName]"
 NOR_ketsen_plus_KK_fake_ns: "$NOR_kretsen_ns$ §Wและ§! $NOR_coordinating_committee$"
 NOR_efficient_production_ns: "การผลิตที่มีประสิทธิภาพ"
 NOR_efficient_production_ns_desc: "เราไมอาจมองขามการปรับปรุงประสิทธิภาพใดๆ ได เราตองทําใหแนใจวาใชสิ่งที่มีใหเกิดประโยชนสูงสุด มิฉะนั้นจะเสี่ยงถูกผลิตแซงหนา"
 NOR_new_haeren_ns_1: "กองทัพบกยุคใหม"
 NOR_new_haeren_ns_1_desc: "กองทัพบก[NOR.GetAdjective]ในอดีตไมเพียงพอสําหรับยุคอันตรายเชนนี้ นี่คือกองทัพสมัยใหมสําหรับสงครามสมัยใหม" 
 NOR_new_haeren_ns_2_desc: "$NOR_new_haeren_ns_1_desc$" 
 NOR_kungens_garde_ns: "Hans Majestet Kongens Garde"
 NOR_kungens_garde_ns_desc: "พระมหากษัตริยอาจมีองครักษ 3 ลานคน แตมีเพียงกองกําลังเดียว คือหนวยชั้นยอดของกองทัพบก[NOR.GetAdjective] ที่สามารถปะทะซึ่งหนากับศัตรูของเราได"
 NOR_expanded_conscription_ns: "ขยายการเกณฑทหาร"
 NOR_expanded_conscription_ns_desc: "ในฐานะประเทศที่มีประชากรเบาบางในยามคับขัน ไมมีชาว[NOR.GetAdjective]คนใดมีเวลาวางพอจะนั่งเฉย ทุกคนที่มีคุณสมบัติขั้นตํ่าตองถูกเกณฑหากเราจะบรรลุเปาหมาย"
 NOR_XU_ns: "XU"
 NOR_XU_ns_desc: "ชาวนอรเวยจํานวนมากที่ยืนหยัดตอตานการยึดครองของฟาสซิสตตองการมีสวนรวมในการขัดขวางผูกดขี่ XU สามารถรวบรวมกลุมเหลานี้ทั้งหมดไวใตรมเดียว และสนับสนุนความพยายามในการสอดแนม ถวงเวลา และทายที่สุดคือขับไลผูบุกรุกเหลานี้"
 NOR_communist_education_centers_ns_1: "ศูนยการศึกษาคอมมิวนิสต"
 NOR_communist_education_centers_ns_1_desc: "ศูนยเหลานี้กอตั้งโดยสหายของเราจากตางแดน และเปนแนวหนาในความพยายามเตรียมชาว[NOR.GetAdjective]ใหพรอมสําหรับ [NOR.GetNonIdeologyName] ใหมที่กําลังจะมาถึง"
 NOR_crumbling_fortifications_ns: "ปอมปราการที่ทรุดโทรม"
 NOR_crumbling_fortifications_ns_desc: "ในบางกรณี การเรียกมันวาปอมปราการก็ถือวาใจดีเกินไป ไมเพียงถูกทิ้งรางไว แตยังไมพรอมสําหรับการรบสมัยใหมเลยแมแตนอย"
# Allied Democratic
 NOR_reduced_workers_rights_ns: "ลดสิทธิแรงงาน"
 NOR_reduced_workers_rights_ns_desc: "ดวยเหตุผลวาสงครามและหายนะใกลเขามา เราจึงยอมเสียสละจํากัดสิทธิของแรงงานไวชั่วคราว หวังวาพวกเขาจะเขาใจเมื่อสงครามสิ้นสุดลง"
 NOR_investing_in_norway_ns: "ลงทุนในนอรเวย"
 NOR_investing_in_norway_ns_desc: "การลงทุนเงินทุนบางสวนของเราใน [NOR.GetName] จะไมเพียงทําใหประเทศของเราใกลชิดกันมากขึ้น แตยังเสริมความแข็งแกรงใหพันธมิตรในกรณีที่เราตองการความชวยเหลือจากพวกเขาในอนาคต"
 NOR_improved_training_ns: "ปรับปรุงการฝก"
 NOR_improved_training_ns_desc: "โครงการฝกใหมของเราชวยใหสงทหารสูสนามรบไดเร็วขึ้น โดยยังคงสอนทุกสิ่งที่พวกเขาจําเปนตองรูเพื่อเอาชีวิตรอดและทําลายศัตรู และอีกมากมาย"
 NOR_flexible_officers_academy_spirit: "นายทหารที่ยืดหยุน" 
 NOR_flexible_officers_academy_spirit_desc: "นายทหารรุนใหมนี้จะนํากองทัพ[NOR.GetAdjective]สูชัยชนะ เพราะพวกเขาเรียนรูไดจากมากกวาแคตําราเกาฝุนจับและศาสตราจารยโบราณยุคสันติ"
    # Fascist Path 
 NOR_contested_leadership_ns: "ความเปนผูนําที่ถูกทาทาย"
 NOR_contested_leadership_ns_desc: "[get_NOR_contested_leadership_ns_desc]"
 NOR_contested_leadership_ns_desc_ger: "ไมวากวิสลิงหวังจะบรรลุสิ่งใดดวยรัฐประหารของเขา [GER.GetNameDef] ก็มีแผนของตนเองสําหรับรัฐบาลที่จะจัดตั้งขึ้นเมื่อ [NOR.GetNonIdeologyName] ถูกพิชิตแลวความจริงคือ มีคนในไรชนอยมากที่คิดวากวิสลิงเหมาะกับงานนี้ ยกเวนฮิตเลอรเอง ซึ่งดูจะชื่นชอบทรราชจอมกระจอกชาว[NOR.GetAdjective]ผูนี้อยางแปลกประหลาด"
 NOR_contested_leadership_ns_desc_generic: "แมกวิสลิงจะทํารัฐประหารสําเร็จ แตความจริงคือลําดับชั้นของอํานาจยังสับสนวุนวายอยางมาก เพราะไมใชทุกคนในกองทัพ หรือแมแตในฝายบริหารของเขาเอง ที่เห็นดวยกับการยึดอํานาจของเขา"
 NOR_abandoning_nynorsk_ns: "$NOR_abandoning_nynorsk$"
 NOR_abandoning_nynorsk_ns_desc: "ผูนําของพรรคนัสโจนัลซัมลิงไดประกาศวาจะไมยอมรับภาษานีนอสก และพลเมืองทุกคนตองใชภาษานอรเวยแบบบุกมอลเทานั้น"
 NOR_oppressed_civilians_dmod: "พลเรือนที่ถูกกดขี่"
 NOR_oppressed_civilians_dmod_desc: "พลเมืองของนอรเวยกําลังเผชิญมาตรการมากมายหลายรูปแบบเพื่อปราบปรามการตอตานใดๆ ตอระบอบฟาสซิสตที่พรรคนัสโจนัลซัมลิงบังคับใชในนามของทรราชตางชาติ"
 NOR_ulfhedhnar_ns: "$NOR_ulfhedhnar_wolf_coats$"
 NOR_ulfhedhnar_ns_desc: "เราไดฟนฟูนักรบเบอรเซิรกเกอรแหงไวกิ้งตามประเพณีขึ้นมาใหม นั่นคือเหลาเสื้อหนังหมาปา คนเหลานี้กระหายการรบและพรอมเปนหัวหอกในการพิชิตของเราทั่วโลก"
 NOR_permanent_revolution_ns: "การปฏิวัติถาวร"
 NOR_permanent_revolution_ns_desc: "ดังที่เลฟ ทรอตสกีสอนเรา การปฏิวัติจะไมสิ้นสุดจนกวาแรงงานทุกคนทั่วโลกจะไดรับการปลดปลอยและไดรับผลแหงแรงงานของตนคืน พรมแดนไมมีความหมายใดๆ ตอชนชั้นแรงงาน"
 NOR_attack_sweden_ns: "โจมตีสวีเดน"
 NOR_attack_sweden_ns_desc: "[SWE.GetNonIdeologyName] เปนเปาหมายที่สําคัญเกินกวาจะปลอยไวโดยไมยึดครอง หากเราไมยึดทรัพยากรของพวกเขากอน ทรัพยากรเหลานั้นอาจตกไปอยูในมือศัตรู หรือที่แยกวานั้นคือพวกคากําไรจากสงครามชาว[SWE.GetAdjective]"
 NOR_attack_denmark_ns: "โจมตีเดนมารก"
 NOR_attack_denmark_ns_desc: "[DEN.GetNonIdeologyName] คือสะพานสูสวนอื่นของยุโรป นาเสียดายที่นั่นหมายความวามันอาจกลายเปนฐานยิงของศัตรูเพื่อบุกสแกนดิเนเวียดวย เราจะปลอยใหมันไรการปองกันไมได"
 NOR_crush_stalin_ns: "บดขยี้สตาลิน"
 NOR_crush_stalin_ns_desc: "สตาลินและสิ่งที่เรียกวา [SOU.GetName] ของเขาถูกใชเปนมาตรวัดวาคอมมิวนิสตคืออะไร เราจะปลอยใหเปนเชนนั้นตอไปไมได เพราะระบอบของอันธพาลผูนี้ก็เปนแคจักรวรรดิรัสเซียเกาที่ทาสีแดงทับเทานั้น"
 NOR_crush_hitler_ns: "บดขยี้ฮิตเลอร"
 NOR_crush_hitler_ns_desc: "มีระบอบไมกี่ระบอบที่โหดรายและไรมนุษยธรรมเทาระบอบของฮิตเลอร เราจะปลอยใหคนบาผูนี้อาละวาดในขณะที่เราเฝาดูอยูไมได มาจัดการเขาและ [GER.GetNonIdeologyName] นาซีของเขาอยางรวดเร็วและเด็ดขาด"
 NOR_liberate_finland_ns: "ปลดปลอยฟนแลนด"
 NOR_liberate_finland_ns_desc: "แรงงานแหง [FIN.GetName] ตองการการปลดปลอยอยางชัดเจน พวกเขาตรากตรําทํางานไมใชเพื่อตนเองหรือเพื่อนรวมชาติชาวฟนน แตเพื่อเจาที่ดินและนักอุตสาหกรรม มาชวยสหายของเราปลดปลอยแผนดินนี้ เพื่อใหพวกเขาไดทํางานเพื่อการปฏิวัติ"
 
 # Monarchist Path 
 NOR_king_haakon_vii_ns: "พระเจาฮากอนที่ 7"
 NOR_king_haakon_vii_ns_desc: "ในฐานะพระมหากษัตริย[NOR.GetAdjective]พระองคแรกนับแตศตวรรษที่ 13 พระเจาฮากอนที่ 7 ทรงเปนแบบอยางแหงประชาธิปไตย พระองคทรงรับราชบัลลังกหลังการลงประชามติเทานั้น และทรงมอบการปกครอง [NOR.GetName] ใหแกที่ปรึกษาและขุนนางชั้นสูงคนอื่นๆ"

 NOR_new_high_king: "จอมกษัตริยองคใหม"
 NOR_new_high_king_desc: "ผูสําเร็จราชการเพเดอร อังเคอร เวเดล-ยารลสแบรก ไดประกาศตนเปนจอมกษัตริยองคใหมแหงนอรเวย สถาปนาตนเปนผูปกครองโดยไมไดรับพระอิสริยยศของพระเจาฮากอนโดยตรง อยางไรก็ตาม การกระทํานี้ไมเปนที่นิยมอยางกวางขวางในหมูเพื่อนบานของชาติ"

 NOR_norwegian_regency: "ผูสําเร็จราชการนอรเวย"
 NOR_norwegian_regency_desc: "ผูสําเร็จราชการเพเดอร อังเคอร เวเดล-ยารลสแบรก ไดประกาศวาเขาตั้งใจเพียงสนองพระราชประสงคและพระบรมราชโองการของพระมหากษัตริยของเขา พระเจาฮากอนที่ 7 ดวยเหตุนี้เขาจึงแสวงหาการกระชับความสัมพันธกับราชาธิปไตยสแกนดิเนเวียที่เปนเพื่อนบาน"

 NOR_second_north_sea_empire: "จักรวรรดิทะเลเหนือที่สอง"
 NOR_second_north_sea_empire_desc: "ผูสําเร็จราชการเพเดอร อังเคอร เวเดล-ยารลสแบรก ไดประกาศวาเขาตั้งใจจะฟนฟูนอรเวยสูความรุงโรจนในอดีต และเปนเพียงเรื่องของเวลากอนที่จักรวรรดินอรเวยใหมจะผงาดขึ้น"

 #Dynamic Modifiers 
 NOR_independent_norway_dmod: "นอรเวยที่เปนเอกราช"
 NOR_independent_norway_dmod_desc: "เราเปนเอกราชจากสวีเดนมาตั้งแตป 1905 และกาวมาไกลนับแตนั้น บัดนี้ถึงคราวที่เราจะสราง [NOR.GetNonIdeologyName] ที่บรรพบุรุษของเราใฝฝนไว"
 NOR_army_air_force_dmod: "Hærens Flyvevaaben"
 NOR_army_air_force_dmod_desc: "ในตอนนี้ หนาที่ของกองทัพอากาศที่เพิ่งกอตั้งของเราคือการสนับสนุนกองทัพภาคพื้นดินทุกที่ที่ไป จึงยังไมจําเปนตองมีสายการบังคับบัญชาแยกตางหาก ในตอนนี้"
 NOR_royal_air_force_dmod: "Luftforsvaret"
 NOR_royal_air_force_dmod_desc: "กองทัพอากาศของเราพัฒนาจนถึงจุดที่ถือไดวาไมเพียงเปนเจาแหงนานฟา[NOR.GetAdjective] แตยังเปนนายแหงชะตากรรมของตนเองดวย"
 NOR_royal_navy_dmod: "Sjøforsvaret"
 NOR_royal_navy_dmod_desc: "กองทัพเรืออันภาคภูมิของเราจะแลนไปทั่วทองทะเลรอบ [NOR.GetName] และไกลกวานั้น ทายที่สุดแลว ทางหลวงที่กวางที่สุดเขาสูประเทศของเราก็คือทะเลเหนือนั่นเอง"
 NOR_administrative_council_dmod: "สภาบริหาร"
 NOR_administrative_council_dmod_desc: "ขณะที่ประเทศของเราอยูใตการยึดครอง ชายหญิงเหลานี้จะเปนกลุมที่รับผิดชอบเรื่องเล็กๆ นอยๆ สวนการตัดสินใจใหญๆ จะถูกกําหนดจากที่ไกลโดยเจาเหนือหัวฟาสซิสตของเรา"
 NOR_kingdom_of_norway_dmod: "$NOR_the_kingdom_of_norway$"
 NOR_kingdom_of_norway_dmod_desc: "ฉากหนาประชาธิปไตยนั่นจะมีประโยชนอะไร? บัดนี้เมื่อรัฐสภาสตอรติงถูกยุบในที่สุด ราชอาณาจักรของเราจะเจริญรุงเรืองภายใตพระหัตถอันเมตตาของพระมหากษัตริย และกําปนอันชอบธรรมของทานผูสําเร็จราชการเพเดอร อังเคอร เวเดล-ยารลสแบรก"
 # State Modifiers 

 NOR_prep_his_dmod_1: "กําลังพัฒนา"
 NOR_prep_his_dmod_1_desc: "เรากําลังพัฒนารัฐนี้จากดินแดนลาหลังใหมีอุตสาหกรรมพลเรือนขนาดเล็ก"
 NOR_prep_his_dmod_2: "พัฒนาแลว"
 NOR_prep_his_dmod_2_desc: "#รัฐนี้พัฒนาไปพอสมควรแลว แตยังตองไปอีกไกลกวาจะไดชื่อวาเปนขุมพลังทางอุตสาหกรรม"
 NOR_prep_his_dmod_3: "พัฒนาอยางสูง"
 NOR_prep_his_dmod_3_desc: "รัฐนี้ทุมเทอยางเต็มที่ใหกับการพัฒนาอุตสาหกรรมพลเรือนของนอรเวย"
 NOR_prep_resistance_dmod: "วางรากการตอตาน"
 NOR_prep_resistance_dmod_desc: "ไมวาผูรุกรานจะคิดอยางไรกับเรา ประชาชนแหง [NOR.GetNonIdeologyName] จะไมยอมจํานนงาย ๆ เราไดแฝงคนไว ซอนเครื่องมือ และกระจายทรัพยากรไวใหพวกเขาใชตอตานผูรุกรานอันโหดรายเหลานี้ไดดียิ่งขึ้น"
 NOR_defend_state_dmod: "ปกปองรัฐ"
 NOR_defend_state_dmod_desc: "เราจะปกปองสิ่งที่เปนของเราโดยชอบธรรมดวยทุกสิ่งที่เรามี ผูรุกรานตองตาย"
 NOR_prep_fasc_dmod_1: "ผูสนับสนุนฟาสซิสต"
 NOR_prep_fasc_dmod_2: "$NOR_prep_fasc_dmod_1$"
 NOR_prep_fasc_dmod_3: "$NOR_prep_fasc_dmod_1$"
 NOR_royal_defenses: "แนวปองกันหลวง"
 NOR_royal_defenses_desc: "ตามพระราชโองการจากพระราชวัง รัฐนี้จะมุงสรางแนวปองกันที่จําเปนเพื่อปกปองราชอาณาจักร"
 # Concerns 
 NOR_aat_norsk_hydro: "$NOR_norsk_hydro$"
 NOR_folks_hydro: "ไฟฟาพลังนํ้าของประชาชน"

