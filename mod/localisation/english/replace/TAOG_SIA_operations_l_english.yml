l_english:
 operation_SIA_sabotage_indochina_ports: "บอนทําลายทาเรืออินโดจีน"
 operation_SIA_sabotage_indochina_ports_desc: "สงหนวยทําลายแทรกซึมเขาสูทาเรือใหญของอินโดจีนฝรั่งเศส และลอบวางระเบิดไวลวงหนาที่ทาเทียบเรือ ปนจั่น และคลังเชื้อเพลิง ระเบิดเหลานี้จะซอนอยูเงียบ ๆ จนถึงวันที่เรายกทัพ แลวทาเรือทั้งหมดจะถูกทําลายในคราวเดียว กอนที่กองเรือขาศึกจะทันกระจายกําลังเขาไปหลบภัย"
 operation_SIA_sabotage_indochina_ports_potential_tt: "§Yหากสําเร็จ:§! ลอบวางระเบิดไวที่ทาเรือในอินโดจีน (§Yอันนัม§!, §Yตังเกี๋ย§! และ§Yกัมพูชา§!) ระเบิดจะทํางานทันทีที่เราทําสงครามกับผูครอบครองดินแดนเหลานี้ และทําลายฐานทัพเรือแตละแหงจนสิ้นซาก"
 operation_SIA_sabotage_indochina_ports_failed_tt: "§Rปฏิบัติการลมเหลว:§! หนวยของเราไมสามารถวางระเบิดได"
 SIA_plant_indochina_port_charges_tt: "มีการลอบวางระเบิดไวที่§Yทาเรือในอินโดจีน§! ซึ่งจะทํางานเมื่อเราทําสงครามกับผูครอบครองดินแดนนั้น"
