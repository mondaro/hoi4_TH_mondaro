#Dynamic Modifiers National Spritits
CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
CZE_ceskoslovenska_armada_dynamic_modifier_desc: "กองทัพนี้ถูกสรางขึ้นจากซากหนวยทหารเช็กแหงออสเตรีย-ฮังการีและทหารผานศึกจากกองทหารเชโกสโลวัก มรดกของทั้งสองยังคงมีอิทธิพลตอวิธีบริหารกองทัพ" 
CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "เครื่องบินอาจไมพรอมเสมอไป แตนักบินของเราพรอมเสมอ ดวยภัยคุกคามทางอากาศที่อาจมาจากทุกทิศทาง เราตองทําใหทองฟาเปนทะเลของเรา นักบินทุกคนตองมีคาเทากับสามคน"
CZE_a_divided_nation_dynamic_modifier: "ชาติที่แตกแยก" 
CZE_a_divided_nation_dynamic_modifier_desc: "รัฐ[CZE.GetAdjective]ยืนหยัดเพียงลําพังในยุโรปกลางในฐานะรัฐพหุนิยมที่คุมครองทุกคนภายในพรมแดน แตภาวะเศรษฐกิจตกตํ่าครั้งใหญไดเปลี่ยนแปลงสิ่งนั้น ความยากลําบากทางเศรษฐกิจทําใหขบวนการตาง ๆ ในประเทศเกิดความขุนเคืองตอรัฐบาล และความขุนเคืองเหลานี้กําลังแบงแยกชาติอยางลึกซึ้ง"
CZE_skoda_works_dynamic_modifier: "โรงงาน Škoda"
CZE_skoda_works_dynamic_modifier_desc: "บริษัท Škoda ครอบคลุมทั้งการผลิต การกอสราง และการลงทุนในทุกภาคสวนของอุตสาหกรรมหนักของเรา อิทธิพลของบริษัทแผไปทั่วทุกหนแหงภายในพรมแดนของเรา"
CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"

#Dynamic State Modifiers
CZE_sudetenland_german_state_modifier: "การแบงแยกดินแดนซูเดเทินลันด"
CZE_sudetenland_german_state_modifier_desc: "ความยากลําบากทางเศรษฐกิจเมื่อไมนานมานี้ไดกระทบอุตสาหกรรมในซูเดเทินลันด ทําใหผูคนในภูมิภาคโทษรัฐบาล [ROOT.getname] สําหรับเคราะหกรรมที่เกิดขึ้น"
CZE_tesinko_polish_state_modifier: "การแบงแยกดินแดนของชาวโปล"
CZE_czech_state_modifier: "การขาดแคลนแรงงานฝมือชาวเช็ก"
CZE_czech_state_modifier_desc: "การพัฒนาเศรษฐกิจอยางรวดเร็วในศตวรรษที่ 20 สรางภาระใหประชากรเช็กซึ่งสวนใหญเปนเกษตรกร การหาแรงงานเช็กที่มีทักษะและคุณสมบัติมาเติมตําแหนงงานเปนเรื่องยาก ตองมีความพยายามชวยเตรียมพลเมืองเช็กรุนใหมใหพรอมรับความตองการที่เปลี่ยนไปของเศรษฐกิจสมัยใหม"
CZE_slovakia_state_modifier: "การพัฒนาเศรษฐกิจที่ไมสมดุล"
CZE_hungarian_state_modifier: "การแบงแยกดินแดนของชาวฮังการี"
CZE_ukrainian_state_modifier: "การพัฒนาเศรษฐกิจที่ไมสมดุล"
CZE_economic_investment_in_state_modifier: "ความพยายามลงทุนทางเศรษฐกิจ"
CZE_central_bohemia_modifier: "การวางแผนโบฮีเมียกลาง"
CZE_balance_industrial_development: "การพัฒนาอุตสาหกรรมที่สมดุล"
CZE_industrial_subsidies: "เงินอุดหนุนอุตสาหกรรม"
CZE_czech_state_mines: "เหมืองแรของรัฐเช็ก"
CZE_merged_consumer_good_plants: "โรงงานสินคาอุปโภคที่ควบรวมแลว"
CZE_river_monitor_fleet: "กองเรือมอนิเตอรลํานํ้า"
CZE_enemy_intelligence_collaborators: "ผูรวมมือกับหนวยขาวกรองขาศึก"
CZE_enemy_intelligence_collaborators_no_lar: "ผูรวมมือกับหนวยขาวกรองขาศึก"
CZE_first_sudetenland_fortification_program: "โครงการสรางปอมปราการซูเดเทินลันดระยะแรก"
CZE_first_sudetenland_fortification_program_GD: "โครงการสรางปอมปราการซูเดเทินลันดระยะแรก"
CZE_sudetenland_paramilitaries_modifier: "กิจกรรมกองกําลังกึ่งทหารในซูเดเทินลันด"
CZE_sudetenland_paramilitaries_modifier_desc: "พลพรรคและกองกําลังกึ่งทหารในซูเดเทินลันดกําลังบอนทําลายกําลังของเราในภูมิภาคนี้ พวกเขาโจมตีทหารของเราอยางตอเนื่องและรวมมือกับศัตรูของเรา"
CZE_nationalist_protests: "การประทวงของฝายชาตินิยม"
CZE_rut_comprise_agreement_modifier: "สนธิสัญญาอํานาจปกครองตนเองของคารเพโธ-ยูเครน" #Can't use [RUT.Getname] in the context this is used in
CZE_improve_cross_border_rail_connections_modifier: "ปรับปรุงการเชื่อมตอทางรถไฟขามพรมแดน"

#National Spirits
CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
CZE_taticek_of_czechoslovakia_desc: "โตมาช มาซาริก ซึ่งมักถูกเรียกวา 'Tatíček Masaryk' หมายถึง 'พอ' หรือ 'บิดา' (แหงชาติ) เปนรากฐานของชาติเชโกสโลวาเกียมาตั้งแตกอตั้ง ยามที่คิดกันวาไมอาจจัดตั้งรัฐบาลผสมได และทางตันทางการเมืองยิ่งใหญเกินจะกาวขาม มาซาริกก็สามารถสรางปาฏิหาริยทางการเมืองไดครั้งแลวครั้งเลาเพื่อเสริมสรางและพัฒนาเชโกสโลวาเกีย แมจะเกษียณแลว ความเห็นและขอเสนอแนะของเขาตอผูนําทางการเมืองก็ยังถูกถือเปนคําสั่งมากกวาคําแนะนํา"
CZE_industrialists_veto: "สิทธิยับยั้งของนักอุตสาหกรรม"
CZE_industrialists_veto_desc: "นักอุตสาหกรรมมีอิทธิพลอยางมากตอการเมืองของประเทศ เพราะพวกเขาเปนผูนําของกลุมบริษัทที่ใหญที่สุดหลายแหงใน [CZE.GetNameDef] ขอกังวลของพวกเขาไมอาจถูกละเลยในเรื่องนโยบายเศรษฐกิจ และการระดมเศรษฐกิจเขาสูสงครามก็เปนหนึ่งในมาตรการที่พวกเขาจะตอตานอยางดุเดือดที่สุด"
CZE_agrarian_politics_1: "การเมืองของเกษตรกร"
CZE_agrarian_politics_1_desc: "แมประเทศของเราจะมีลักษณะเปนอุตสาหกรรม แตเกษตรกรและชาวนาในชนบทก็มีอิทธิพลทางการเมืองอยางมากในหลายพรรค ความรูสึกของพวกเขามักสงผลตอการตัดสินใจนโยบายเศรษฐกิจ และเปนอุปสรรคทางการเมืองอยูเสมอตอความกาวหนาทางอุตสาหกรรม"
CZE_directorate_of_fortification_works_no_gd_idea: "กองอํานวยการงานปอมปราการ"
CZE_directorate_of_fortification_works_no_gd_idea_desc: "$CZE_directorate_of_fortification_works_no_gd_idea$ หรือที่รูจักกันดีในชื่อ ROP เปนหนวยงานบริหารที่รับผิดชอบกํากับดูแลงานสรางปอมปราการในประเทศ"
CZE_czech_corporatism: "ลัทธิบรรษัทนิยมเช็ก"
CZE_broken_shield: "โลที่แตกสลาย"
CZE_redirected_fortification_council_funds: "งบสภาปอมปราการที่ถูกโยกยาย"
CZE_army_readiness_1: "กองทัพที่ไมพรอมรบ"
CZE_army_readiness_1_desc: "ความพรอมรบของกองทัพไมไดขึ้นอยูกับทหารและยุทโธปกรณในสนามรบเทานั้น ความมั่นใจในการเตรียมการ และการหนุนหลังจากผูนําทางการเมืองและอุตสาหกรรมของประเทศก็สําคัญเมื่อตองเผชิญภัยคุกคาม การมีปจจัยในการสูรบเปนเรื่องหนึ่ง แตความสามารถที่จะสูรบอยางมีประสิทธิภาพเปนอีกเรื่องหนึ่ง"
CZE_army_readiness_3: "กองทัพที่พรอมรบ"
CZE_army_readiness_3_desc: "ความพรอมรบของกองทัพไมไดขึ้นอยูกับทหารและยุทโธปกรณในสนามรบเทานั้น ความมั่นใจในการเตรียมการ และการหนุนหลังจากผูนําทางการเมืองและอุตสาหกรรมของประเทศก็สําคัญเมื่อตองเผชิญภัยคุกคาม การมีปจจัยในการสูรบเปนเรื่องหนึ่ง แตความสามารถที่จะสูรบอยางมีประสิทธิภาพเปนอีกเรื่องหนึ่ง"
CZE_ready_for_anything_idea: "พรอมรับทุกสถานการณ"
CZE_sudeten_german_quandary: "ภาวะกลืนไมเขาคายไมออกแหงซูเดเทินลันด"
CZE_sudeten_german_quandary_desc: "แมคนสวนใหญในซูเดเทินลันดตองการเพียงอํานาจปกครองตนเองที่มากขึ้นภายใตรัฐบาลปจจุบัน แตพรรคการเมืองซูเดเทินหลายพรรคและผูสนับสนุนอาจกลายเปนแนวรวมที่หาไดอยางรวดเร็ว หากรัฐเยอรมันใดตองการผนวกสวนใดสวนหนึ่งของภูมิภาค"
CZE_sudeten_german_quandary_modifier_tt: "§Yผลแบบติดตัว§!:\nหาก §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! หรือ [BAY.GetFlag]§Yประเทศเยอรมัน§! อื่นใดที่มีพรมแดนติดเรา สรางหรือไดรับ §Rเปาหมายสงคราม§! ตอเรา ขณะที่ §Y[69.GetName]§!, §Y[972.GetName]§! หรือ §Y[74.GetName]§! อยูในการควบคุมของเรา:\n - (§Yทุกรัฐในซูเดเทินลันดที่ควบคุมอยู§!):\n    เพิ่ม §Y$CZE_sudetenland_paramilitaries_modifier$§! ซึ่งให:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n - §Yผล§! นี้เกิดขึ้นไดเพียงครั้งเดียว"
CZE_sudeten_challenge: "ความทาทายแหงซูเดเทิน"
CZE_sudeten_challenge_desc: "ความเคลื่อนไหวลาสุดของกองกําลังกึ่งทหารในซูเดเทินลันดทําใหประชาคมระหวางประเทศจํานวนมากเชื่อวาการกระทําอันกาวราวตอเราในขณะนี้ชอบธรรมแลว! ตองใชเวลาในการโนมนาวโลกใหเห็นเปนอยางอื่น"
CZE_sudeten_facde: "ฉากบังหนาซูเดเทิน"
CZE_sudeten_facde_desc: "การที่เราไมหนุนหลังกองกําลังกึ่งทหารทองถิ่น ทําใหขออางในการดําเนินการตอ [CZE.getname] ของเราถูกมองวาเปนเพียงฉากบังหนาไปทั่วโลก"
CZE_anti_rearmament_propaganda_idea: "$CZE_anti_rearmament_propaganda$" 
CZE_anti_democratic_propaganda_idea: "$CZE_anti_democratic_propaganda$"
CZE_revolutionary_brigades_idea: "กองพลนอยปฏิวัติ"
