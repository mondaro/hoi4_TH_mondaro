 CZE_the_second_fortification_program_category: "โครงการสรางปอมปราการ"
 CZE_the_second_fortification_program_category_desc: "พรมแดนที่เสียเปรียบของประเทศเราเปนปญหาความมั่นคงแหงชาติที่เรงดวน ประเทศรอบขางแสดงชัดเจนวาพวกเขามีแผนจะขีดเสนพรมแดนของเราใหมใหเปนประโยชนตอตน การเสริมปอมปราการตามพรมแดนตอไปจะทําใหศัตรูใดๆ ตองคิดใหดีกอนโจมตีเรา"
 CZE_fate_of_the_ro: "ชะตากรรมของสภาปอมปราการ"
