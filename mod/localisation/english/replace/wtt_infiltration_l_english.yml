 PRC_infiltrate_nationalist_areas_desc: "เรายังไมอาจสูกับฝายชาตินิยมในการรบซึ่งหนาไดในตอนนี้ เราควรสะสมกําลังและสรางฐานที่มั่นแหงใหมเพื่อกระจายกําลังขาศึกใหบางลง เมื่อถึงเวลาที่เหมาะสม เราจะจุดชนวนการลุกฮือ \n\nหนวยคอมมิวนิสตของเราจะกอวินาศกรรม§Hโครงสรางพื้นฐาน§!และ§Hโรงงานทหาร§! หรือจัดตั้ง§Hกองพลกองกําลังอาสา§!เพื่อยึดอํานาจในรัฐ ขึ้นอยูกับระดับของ§Hการแทรกซึม§!"
