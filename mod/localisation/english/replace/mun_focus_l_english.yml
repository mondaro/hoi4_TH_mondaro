CZE_coalition_building: "สรางรัฐบาลผสม"
CZE_coalition_building_desc: "รัฐบาลผสมที่เกิดขึ้นหลังการเลือกตั้งตองสรางเอกภาพในหมูสมาชิกใหมากขึ้นหากจะทํางานไดอยางมีประสิทธิภาพ การเกษียณจากตําแหนงนายกรัฐมนตรีของยัน มาลีเปตรเมื่อเร็วๆ นี้ยิ่งเพิ่มแรงกดดันใหรัฐบาลผสมขนาดใหญตองรวบรวมการสนับสนุนใหมั่นคง"
CZE_merge_the_paramilitaries: "รวมกลุมกองกําลังกึ่งทหาร"
CZE_merge_the_paramilitaries_desc: "กองกําลังกึ่งทหารของเรากระจัดกระจายและแตกออกเปนหลายกลุม หากเราหวังจะใชประโยชนจากพวกเขาทางทหาร เราจะตองบังคับใหพวกเขารวมกัน"
CZE_integrated_paramilitaries: "ผนวกกองกําลังกึ่งทหาร"
CZE_integrated_paramilitaries_desc: "กองทัพอาจไมพอใจนักกับแนวคิดนี้ แตการผนวกกลุมกองกําลังกึ่งทหารเขากับกองทัพจะทําใหเรามีกําลังสํารองมากขึ้นในยามที่ตองการที่สุด"
CZE_wielding_the_hammer: "กุมคอนแหงอํานาจ"
CZE_wielding_the_hammer_desc: "เราสามารถใชเสียงขางมากพิเศษในสภาแหงชาติเพื่อทําใหกระบวนการผานกฎหมายรวดเร็วกวาที่เปนอยูมาก สิ่งสําคัญที่สุดคือการจัดระเบียบฝายนิติบัญญัติของเราใหเรียบรอย"
CZE_emergency_measures: "มาตรการฉุกเฉิน"
CZE_emergency_measures_desc: "ดวยการใชมาตรการฉุกเฉินเพื่อชวยรับมือกับวิกฤตมากมายที่ชาติเราเผชิญ และในขณะเดียวกันก็ใชมาตรการบางสวนเพื่อจับตาผูที่อาจไมนาไววางใจทางอุดมการณตอรัฐบาลอยางใกลชิดยิ่งขึ้น เราจะมีความพรอมมากขึ้นในการเผชิญความทาทายที่ชาติเราเผชิญอยู"
CZE_king_of_the_castle: "เจาแหงปราสาท"
CZE_king_of_the_castle_desc: "เราทุกคนรูดีวาใครคือผูชี้ขาดในรัฐบาลของเรา ในยามที่เต็มไปดวยความไมแนนอน ถึงเวลาเลิกเสแสรงและให $CZE_edvard_benesh$ นําโดยตรงมากขึ้น ความมั่นคงของประเทศเราขึ้นอยูกับสิ่งนี้"
CZE_closer_ties_with_the_moderate_germany_parties: "รวบรวมพรรคสายกลางในซูเดเทินลันด"
CZE_closer_ties_with_the_moderate_germany_parties_desc: "พรรคการเมืองบางพรรคในซูเดเทินลันดพรอมจะทํางานรวมกับรัฐบาลผสมของเราและสรางสายสัมพันธกับรัฐบาล มากระชับความสัมพันธเหลานั้นใหแนนแฟนยิ่งขึ้น"
CZE_complete_reconciliation: "การปรองดองอยางสมบูรณ"
CZE_complete_reconciliation_desc: "เราไดทุมเทสรางสะพานแหงความไววางใจแลว ถึงเวลาปรองดองกับเพื่อนรวมชาติของเรา"
CZE_complete_reconciliation_cooldown_flag: "ทําแผนยุทธศาสตร §Y$CZE_closer_ties_with_the_moderate_germany_parties$§! สําเร็จแลว"
CZE_complete_reconciliation_cooldown_flag_tt: "จํานวนวันปจจุบัน: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
CZE_bastion_of_liberty: "ปอมปราการแหงเสรีภาพ"
CZE_bastion_of_liberty_desc: "ในทศวรรษนี้ เราเปนหนึ่งในไมกี่ประเทศที่เปนพหุนิยมอยางแทจริงในยุโรปฝงตะวันออกของแมนํ้าไรน มาทําใหแนใจวาผูคนจะไมลืมเรื่องนี้"
CZE_standing_against_the_storm: "ยืนหยัดตานพายุ"
CZE_standing_against_the_storm_desc: "แมเราจะมีขอบกพรองและอาจขาดการเตรียมพรอม แตเราจะเผชิญทุกความทาทายอยางไมหวั่นไหวและยืนหยัดตานพายุที่กําลังจะมาถึง"
CZE_truth_prevails: "ความจริงยอมชนะ"
CZE_truth_prevails_desc: "แมตองเผชิญความเสียเปรียบมหาศาลและภารกิจที่เปนไปไมได ประเทศของเรารูดีวาคติพจนประจําชาติ 'ความจริงยอมชนะ' จะเปนจริงเมื่อทุกอยางสิ้นสุดลง จงแสวงหาความจริง จงพูดความจริง แลวความจริงจะชนะ"
CZE_negotiations_with_the_autonomous_bloc: "เจรจากับกลุมเรียกรองการปกครองตนเอง"
CZE_negotiations_with_the_autonomous_bloc_desc: "หากเราตองการจัดตั้งรัฐบาลผสมที่ไมยอมยกอํานาจใหกองทัพลูกสมุนของเบเนชในสภาแหงชาติ เราจะตองรวมมือกับกลุมเรียกรองการปกครองตนเอง อยางไรก็ตาม การไดรับการสนับสนุนเต็มที่จากพวกเขาตองแลกมาดวยราคาที่สูง"
CZE_slovakia_autonomy_agreement: "ขอตกลงการปกครองตนเองของสโลวาเกีย"
CZE_slovakia_autonomy_agreement_desc: "ราคาของการที่กลุมเรียกรองการปกครองตนเองจะรวมงานกับรัฐบาลผสมของเราคือขอตกลงการปกครองตนเองกับรัฐบาล นี่เปนราคาที่หนักหนา แตผลที่ตามมาหากเราไมทําตามขอตกลงอาจเลวรายกวา"
CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§! จะตองการขอตกลงแบบเดียวกับที่เราใหแก §Y[SLO.getname]§!!"
CZE_slovakia_autonomy_agreement_2_tt: "$CZE_the_autonomous_bloc_demands$ จะถูกเลื่อนออกไป §Y35 วัน§! เมื่อเลือกแผนยุทธศาสตรนี้"
CZE_topple_the_king: "โคนเจาแหงปราสาท"
CZE_topple_the_king_desc: "อิทธิพลของ $CZE_edvard_benesh$ ที่มีตอรัฐบาลของเรากําลังบีบคั้นจนหายใจไมออก อํานาจของเขามีมากกวาบทบาทประธานาธิบดีเพราะมีกองทัพผูภักดีอยูในรัฐสภา บัดนี้เมื่อสถานการณเอื้ออํานวย เราสามารถแทนที่อิทธิพลของเขาในวุฒิสภา (Horní Komora) ได"
CZE_comprise_with_the_carpathians: "ประนีประนอมกับชาวคารเพเทียน"
CZE_comprise_with_the_carpathians_desc: "ภูมิภาครูทีเนียกําลังมุงหาขอตกลงสหพันธรัฐแบบเดียวกับที่เราใหแก[SLO.getnamedef] การทําเชนนั้นจะบั่นทอนสถานะของเราในภูมิภาคและใน [9.getname] อยางมาก การตอรองทําขอตกลงกับพวกเขาอาจดีกวายอมตามขอเรียกรองทั้งหมด"
CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "$CZE_the_rut_demands$ จะถูกเลื่อนออกไป §Y35 วัน§! เมื่อเลือกแผนยุทธศาสตรนี้"
CZE_cut_carpathia_loose: "ปลอยคารเพเทียไป"
CZE_cut_carpathia_loose_desc: "เมื่อสโลวาเกียเปนรัฐในสหพันธรัฐแลว ภูมิภาครูทีเนียก็หวังจะทําขอตกลงแบบเดียวกัน แมจะดูไมสมเหตุสมผล แตเมื่อสโลวาเกียไมไดอยูใตการควบคุมโดยตรงของเรา การพยายามควบคุมพวกเขาก็คงยาก บางทีเราควรยอมตามขอเรียกรองของพวกเขาไปเสีย"
CZE_compromise_with_the_veteran_agrarian: "ประนีประนอมกับเกษตรกรรุนเกา"
CZE_compromise_with_the_veteran_agrarian_desc: "ผูนํารุนเกาฝายเกษตรกรเปนอุปสรรคตอการเขาถึงฐานเสียงในเมืองที่กําลังเติบโต เราตองประนีประนอมกับพวกเขาเพื่อบรรลุเปาหมาย"
CZE_reorient_the_broad_coalition: "ปรับทิศทางรัฐบาลผสมขนาดใหญ"
CZE_reorient_the_broad_coalition_desc: "รัฐบาลผสมขนาดใหญเปนกลุมนําในรัฐบาลของเรามาหลายป พรรคการเมืองหลากหลายที่รวมอยูในนั้นทําใหการนํารัฐบาลผสมยากขึ้นเรื่อยๆ การปรับทิศทางนโยบายของกระทรวงตางๆ นั้นลาชามานานแลว"
CZE_leverage_sokol: "ขบวนการซอกอล"
CZE_leverage_sokol_desc: "ขบวนการซอกอลเปนองคกรสําคัญในประเทศของเรามาหลายทศวรรษ ในยามวิกฤต เราควรใชประโยชนจากพวกเขาเพื่อชวยฝกกึ่งทหารและจัดหากําลังพลใหมใหกองทัพ"
CZE_urbanist_policies: "นโยบายเพื่อคนเมือง"
CZE_deepend_ties_with_the_trademans: "กระชับความสัมพันธกับพอคาชางฝมือ"
CZE_deepend_ties_with_the_trademans_desc: "พรรคพอคาชางฝมือเปนที่นิยมในหมูผูมีสิทธิเลือกตั้งชนชั้นกลางในเมือง หากเราเสริมอํานาจและรวมงานกับพวกเขา เราจะเขาถึงฐานเสียงในเมืองไดโดยไมทําใหฐานเสียงชนบทของเราแปลกแยก"
CZE_apart_but_togather: "แยกกันแตเปนหนึ่ง"
CZE_apart_but_togather_desc: "บัดนี้ภูมิภาคตางๆ ของเรามีอํานาจปกครองตนเองมากกวาที่เคยมีมา แตเราก็แข็งแกรงกวาที่เคยเปนดวย เราพรอมรับมือกับทุกสิ่ง"
CZE_contact_henlein: "ติดตอเฮนไลน"
CZE_contact_henlein_desc: "$CZE_konrad_henlein$ เปนหนามยอกอกรัฐบาลของเรามาหลายปแลว อยางไรก็ตาม ดวยเหตุการณระหวางประเทศลาสุด อาจถึงเวลาเริ่มเปดการเจรจากับเขา"
CZE_contact_henlein_cooldown_flag: "ทําแผนยุทธศาสตร §Y$CZE_no_compromise_with_the_sdp$§! สําเร็จแลว"
CZE_contact_henlein_cooldown_flag_tt: "จํานวนวันปจจุบัน: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
CZE_contact_henlein_focus_warning_tt: "หากเราทํา §Y$CZE_no_compromise_with_the_sdp$§! สําเร็จ เราจะตองรอ §Y350§! วันกอนจะเลือก§Yแผนยุทธศาสตร§!นี้ได"
CZE_contact_henlein_focus_order_warning_tt: "หากเราทํา §Y$CZE_no_compromise_with_the_sdp$§! สําเร็จหลังจากทํา§Yแผนยุทธศาสตร§!นี้แลว §Y$CZE_konrad_henlein$§! จะถูกปลดเกษียณ"
CZE_no_compromise_with_the_sdp: "กีดกันพรรค SdP ตอไป"
CZE_no_compromise_with_the_sdp_desc: "พรรค SdP ไมมีอะไรจะมอบใหรัฐบาลผสมของเรา พวกเขาตองการเพียงสรางความตึงเครียดทางการเมืองและปายสีการกระทําของรัฐบาล เพื่อธรรมาภิบาลที่ดี พวกเขาควรถูกกีดกันจากรัฐบาลผสมใดๆ ตอไป"
CZE_no_compromise_with_the_sdp_cooldown_flag: "ทําแผนยุทธศาสตร §Y$CZE_contact_henlein$§! สําเร็จแลว"
CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "จํานวนวันปจจุบัน: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
CZE_no_compromise_with_the_sdp_focus_warning_tt: "หากเราทํา §Y$CZE_contact_henlein$§! สําเร็จ เราจะตองรอ §Y350§! วันกอนจะเลือก§Yแผนยุทธศาสตร§!นี้ได"
