CZE_form_a_federation: "กอตั้งสหพันธรัฐ"
CZE_form_a_federation_desc: "ความฝนถึงสหพันธรัฐยุโรปกลางไมไดอยูไกลเกินเอื้อมอีกตอไป ในที่สุดเราจะทําใหเปนจริงและกลายเปนยักษใหญแหงประชาธิปไตย เมื่อรวมกัน เราจะมีพลังพอจะตานทานมหาอํานาจไดดวยตนเอง!"
CZE_bend_the_bars: "$ITA_bend_the_bars$"
CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
CZE_reassure_the_army: "สรางความมั่นใจใหกองทัพ"
CZE_reassure_the_army_desc: "กองทัพเริ่มกังวลกับการตัดสินใจและนโยบายบางอยางของรัฐบาลเมื่อเร็วๆ นี้ ถึงเวลาสรางความมั่นใจใหพวกเขาวาเรายืนเคียงขางพวกเขาไมวารัฐบาลจะพูดหรือทําอะไร"
CZE_outreach_to_the_western_powers: "กระชับสัมพันธกับมหาอํานาจตะวันตกใหมากขึ้น"
CZE_outreach_to_the_western_powers_desc: "ประเทศประชาธิปไตยตะวันตกบอกวาพวกเขาหนุนหลังเรา แตเราตองกระชับสัมพันธกับพวกเขาใหมากขึ้น เพื่อใหมั่นใจวาคําพูดของพวกเขาจะมาพรอมการกระทําเมื่อถึงเวลาสําคัญที่สุด"
CZE_demand_guarantees: "เรียกรองการรับประกันที่หนักแนนขึ้น"
CZE_demand_guarantees_desc: "แมเราจะมีสนธิสัญญาและพันธมิตรอยูแลว เราก็ตองแนใจวาหุนสวนของเราจะไมทอดทิ้งเราในยามสิ้นหวังเพียงเพราะมันงายกวาสําหรับพวกเขา เราตองการสิ่งที่หนักแนนกวาการรับประกัน"
CZE_guardian_of_central_europe: "ผูพิทักษแหงยุโรปกลาง"
CZE_guardian_of_central_europe_desc: "บัดนี้เราอยูในฐานะที่จะเปนผูดูแลประชาธิปไตยในใจกลางยุโรป เราสามารถเปนผูพิทักษใหชาติที่ไมอาจปกปองตนเองได และทําใหแนใจวาประชาธิปไตยจะยืนหยัดอยางสงางาม"
CZE_central_european_faction: "เจาเหนือหัวแหงยุโรปกลาง"
CZE_central_european_faction_desc: "แมเราจะมุงเสริมความแข็งแกรงใหตนเองแทนที่จะพึ่งพาการทูตมากเกินไป แตสิ่งสําคัญยิ่งคือเราตองไมขยายอิทธิพลเกินกําลัง อาจถึงเวลาที่จะมองออกไปภายนอก"
CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
CZE_strike_at_the_heart_of_bolshevism_1: "โจมตีหัวใจของลัทธิบอลเชวิค"
CZE_strike_at_the_heart_of_bolshevism_2: "รักษาปกตะวันออก"
CZE_strike_at_the_heart_of_bolshevism_desc: "การขยายตัวของ[SOV.GetNameDef]เปนภัยคุกคามตอการดํารงอยูของยุโรปและชาติเรา เราตองเปนปราการตานพวกเขา"
CZE_destroy_the_fascist_threats: "ทําลายภัยคุกคามฟาสซิสต"
CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
CZE_destroy_the_fascist_threats_desc_enemy_ger: "เราทุกคนรูดีวาใครคือภัยคุกคามตอสันติภาพในยุโรปมากที่สุด [GER.getnamedefCAP]ตองถูกหยุดยั้งโดยเร็ว หากไมมีใครเต็มใจทํา ก็ใหเปนเราเองนี่แหละ"
CZE_destroy_the_fascist_threats_desc_backup: "เพื่อความมั่นคงของเรา สิ่งสําคัญที่สุดคือประเทศเพื่อนบานตองไมหลงไปกับวาทกรรมขยายดินแดนที่ไมชาก็เร็วอาจพุงเปามาที่เรา"
CZE_peace_on_our_time: "สันติภาพในยุคสมัยของเรา"
CZE_peace_on_our_time_desc: "เราเปนเพียงเรื่องรองในความสัมพันธระหวางประเทศของยุโรปมานานเกินไปแลว นับจากนี้จะไมเปนเชนนั้นอีก! เราสามารถยืนบนขาของตัวเองและกําหนดเงื่อนไขของเราเอง ไมวาจะเปนสงครามหรือสันติภาพ"
CZE_reach_out_for_military_assistance: "ขอความชวยเหลือทางทหาร"
CZE_free_tuka: "ปลอยตัว $CZE_vojtech_tuka$"
CZE_free_tuka_desc: "$CZE_vojtech_tuka$ พนโทษจําคุกแลว แทนที่จะหาขออางขยายโทษ เราอาจปลอยตัวเขาตามกําหนดและใชประโยชนจากเขาในรัฐบาล ใหเขาทํางานใตเราดีกวาทํางานตอตานเรา"
CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "ธนาคารแองโกล-เชโกสโลวัก"
CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "ธนาคารสินเชื่อแองโกล-เช็กเปนหนึ่งในแรงขับเคลื่อนหลักของอุตสาหกรรมของเรา หากไมมีเงินทุนจากพวกเขา เราคงไมสามารถรักษาธุรกิจสงออกขนาดใหญที่มีอยูในปจจุบันได การเปดสาขาใหมในนิวยอรกและกระชับความสัมพันธกับ[ENG.GetNameDef]จะทําใหธนาคารเติบโตยิ่งขึ้น และยังทําให [ENG.getname] มีสวนไดเสียในการอยูรอดของเราดวย"
CZE_feeding_the_alligator: "ปอนอาหารใหจระเข"
CZE_feeding_the_alligator_desc: "แผนการของ [GER.getname] ตอซูเดเทินลันดเปนภัยคุกคามตอการดํารงอยูของชาติเรา บางทีหากเราใหสิ่งที่พวกเขาตองการ พวกเขาจะปลอยเราไวตามลําพัง"
CZE_complete_capitulation: "ยอมจํานนโดยสิ้นเชิง"
CZE_complete_capitulation_desc: "เรามีทางเลือกอื่นนอกจากยอมแพหรือ? เราไมอาจตานทานพายุที่กําลังกอตัวที่ขอบฟาได บางทีหากเราทําขอตกลงกับ[GER.getnamedef]ขณะที่ยังมีอํานาจตอรองอยูบาง พวกเขาอาจปลอยใหเรามีเอกราชบางสวนภายใตแอกของพวกเขา"
CZE_stabilize_the_protectorate: "สรางเสถียรภาพใหรัฐในอารักขา"
CZE_stabilize_the_protectorate_desc: "รัฐในอารักขาไมมีเสถียรภาพเลยแมแตนอย เราตองพยายามโนมนาวประชาชนวาเราคือรัฐบาลที่ชอบธรรมและจะดูแลความตองการของพวกเขา"
CZE_stabilize_the_protectorate_unretire_henlein_tt: "นํา §Y$CZE_konrad_henlein$§! กลับมาจากการเกษียณใน §Y[ROOT.getname]§!"
CZE_full_faith_in_hacha: "ศรัทธาเต็มเปยมในฮาคา"
CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ เปนที่นิยมและไดรับความนับถือในหมูประชาชนมากกวา $CZE_emanuel_moravec$ มาก งานที่เขาทําอาจนาสงสัย แตคุณไมอาจแทนที่ผูนําในนามที่เปนที่นิยมมากกวาได"
CZE_moravecs_bohemia: "โบฮีเมียของโมราเวตส"
CZE_moravecs_bohemia_desc: "มีขาวลือหนาหูวา $CZE_emil_hacha$ กําลังพยายามบอนทําลายรัฐบาลใหมของเรา หากเราหวังจะประสบความสําเร็จและเติบโตภายใตสภาพปจจุบัน เราตองการผูนําที่สอดคลองกับอุดมการณของเจาเหนือหัวของเรามากกวานี้"
CZE_form_the_government_army: "กอตั้งกองทัพรัฐบาล"
CZE_form_the_government_army_desc: "หากเราตองการใหประเทศประสบความสําเร็จ เราตองตั้งกองทัพใหมที่เรียนรูจากความลมเหลวของกองทัพชุดกอน เราตองแนใจดวยวาผูนําของกองทัพจะสอดคลองกับรัฐบาลทางการเมืองมากขึ้น"
CZE_forced_administration_of_companies: "บังคับควบคุมการบริหารบริษัท"
CZE_forced_administration_of_companies_desc: "แมจะมีการกํากับดูแลอยางเขมงวด แตบางบริษัทก็ยังดําเนินการนอกการควบคุมของเรา ถึงเวลาบังคับใหพวกเขาอยูใตการกํากับของเรา"
CZE_revisit_custom_union_talks: "รื้อฟนการเจรจาสหภาพศุลกากร"
CZE_revisit_custom_union_talks_desc: "การเจรจาสหภาพศุลกากรกับเพื่อนบานบางประเทศอาจไปไดแยมากเมื่อเทียบกับบางประเทศ ถึงเวลารื้อฟนการเจรจาและผลักดันสหภาพศุลกากรระหวางประเทศของเราอีกครั้ง"
CZE_revisit_custom_union_talks_tt: "เรายังสามารถโนมนาวใหพวกเขาเขารวมไดดวย§Rวิธีการ§!อื่น"
CZE_revisit_custom_union_talks_2_tt: "พวกเขาจะมีแนวโนมยอมรับขอเรียกรองใหเขารวมสหพันธรัฐของเรามากขึ้น"
CZE_reintegrate_cross_border_rail_connections: "ปรับปรุงเสนทางรถไฟขามพรมแดน"
CZE_reintegrate_cross_border_rail_connections_desc: "การปรับปรุงเสนทางรถไฟเชื่อมกับเพื่อนบานเปนวิธีที่ดีในการเอาใจพวกเขา ยิ่งถาเราพยายามขยายความเชื่อมโยงทางเศรษฐกิจระหวางกัน"
CZE_reintegrate_cross_border_rail_connections_flag: "เสนทางรถไฟขามพรมแดนไดรับการปรับปรุงแลว"
CZE_vonapo_20: "VONAPO 20"
CZE_vonapo_20_desc: "เราไมไดเปนเพียงผูเดียวที่เห็นภัยคุกคามที่เพิ่มขึ้นจาก[GER.GetNameDef] จึงมีการวางแผนรวมมือกับ[SOV.GetNameDef]ในการรวบรวมขาวกรอง เพื่อใหเราสกัดกั้นความทะเยอทะยานของ[GER.GetAdjective]ไดดียิ่งขึ้น"
CZE_increase_funding_from_moscow: "เพิ่มเงินทุนจาก[SOV.capital.GetCapitalVictoryPointName]"
CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty]ขาดเงินทุนถึงขั้นที่ปจจุบันตองใชเงินเดือนของผูแทนพรรคจายคาอาคาร เพื่อเติบโต เราตองขอเงินทุนเพิ่มจาก[SOV.GetNameDef]เพื่อเผยแพรหนังสือพิมพของเราและรับสมาชิกเพิ่ม"
CZE_zdenek_fierlinger_tt: "แตงตั้งที่ปรึกษา §Y$CZE_zdenek_fierlinger$§!"
CZE_expand_the_communist_press: "ขยายสื่อคอมมิวนิสต"
CZE_expand_the_communist_press_desc: "หนังสือพิมพของเรา 'กฎหมายแดง' สามารถใหขอมูลแกผูที่ปจจุบันไมไดอานหนังสือพิมพใดเลย สิ่งที่ตองการมีเพียงเงินทุนที่เพิ่มขึ้น"
CZE_anti_rearmament_propaganda:0 "โฆษณาชวนเชื่อตอตานการเสริมกําลังอาวุธ"
CZE_anti_rearmament_propaganda_desc: "การลมสลายของรัฐบาลฟาสซิสตของศัตรูหลักของเรา [GER.GetNonIdeologyName] หมายความวาเราสามารถอางไดวาจุดยืนตอตานการสะสมกําลังทหารของเราถูกตองมาตลอด"
CZE_anti_democratic_propaganda: "โฆษณาชวนเชื่อตอตานประชาธิปไตย"
CZE_anti_democratic_propaganda_desc: "เพื่อสรางการสนับสนุนใหพรรคของเรา เราตองชี้ใหเห็นความลมเหลวของรัฐบาลสาธารณรัฐชุดกอนๆ และแสดงใหเห็นวาเราจะจัดการสถานการณไดดีกวาอยางไร"
CZE_form_workers_brigades: "กอตั้งกองกําลังกรรมกร"
CZE_form_workers_brigades_desc: "กรรมกรที่เรากําลังปลดปลอยตองพรอมจะเขารวมการตอสู พวกเขาอาจไมใชทหารที่ผานการฝก แตก็ยังมีสวนรวมไดในฐานะผูเชี่ยวชาญตามอาชีพของตน"
CZE_kohler_faction: "กลุมเคอเลอร"
CZE_kohler_faction_desc: "กลุมของบรูโน เคอเลอรเชื่อวาการโคนลมชนชั้นกระฎมพีดวยความรุนแรงเปนสิ่งจําเปนตอการสรางรัฐเชโกสโลวาเกียคอมมิวนิสตที่ประสบความสําเร็จ"
CZE_gottwald_faction: "กลุมกอตตวัลด"
CZE_gottwald_faction_desc: "กลุมสตาลินนิสตของเคลเมนต กอตตวัลด ผูภักดีตอมอสโกอยางสุดโตง มองเห็นรัฐเชโกสโลวาเกียที่ถอดแบบมาจากสหภาพโซเวียต"
CZE_zapotocky_faction: "กลุมซาโปตอตสกี"
CZE_zapotocky_faction_desc: "ผูกอตั้งพรรคคอมมิวนิสต โบฮูมีร ชเมรัล และอันโตนีน ซาโปตอตสกี วาดภาพนโยบายที่เปนสายกลางกวาที่เคลเมนต กอตตวัลดบังคับใชกับพรรค เราตองกลับคืนสูรากเหงานี้เพื่อใหเขาถึงประชาชน[CZE.GetAdjective]ทุกคนไดอยางแทจริง"
CZE_ally_with_moderate_socialists:0 "รวมมือกับนักสังคมนิยมสายกลาง"
CZE_ally_with_moderate_socialists_desc: "ไมใชทุกประเทศที่พรอมจะรับลัทธิคอมมิวนิสตผานการเลือกตั้งหรือชื่นชม [SOV.GetLeader] ดังนั้นการรวมมือกับขบวนการที่เปนสายกลางกวาจึงเปนสิ่งที่เราไมควรหลีกเลี่ยง"
CZE_democracies_willing_to_join_faction_tt: "§Yชาติประชาธิปไตยจะเต็มใจเขารวมฝายคอมมิวนิสตของเรามากขึ้น§!"
CZE_limited_cooperation: "ความรวมมืออยางจํากัดกับ [SOV.GetLeader]"
CZE_limited_cooperation_desc: "แมจะแตกตางทางอุดมการณ แตแมแต[SOV.GetNameDef]ก็อาจเห็นคุณคาของเราในฐานะหุนสวนและรวมทําขอตกลงเชิงปฏิบัติบางอยาง แมจะประณามเราในหนังสือพิมพของพวกเขาก็ตาม"
CZE_denounce_stalinism: "ประณามลัทธิสตาลิน"
CZE_denounce_stalinism_desc: "ชื่อเสียงของลัทธิคอมมิวนิสตถูกแปดเปอนไปตลอดกาลดวยความอยุติธรรมของสตาลิน ถึงเวลาแลวที่เราจะใชมาตรการทางทหารเพื่อปลดปลอยประชาชนที่อยูใตระบอบเชนเดียวกับเขา"
CZE_country_leader_has_ideology_stalinism_tt: "ผูนําประเทศมีอุดมการณ §Y$stalinism$§!"
CZE_cooperate_with_tito: "รวมมือกับตีโต"
CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap] กําลังทดลองลัทธิคอมมิวนิสตในรูปแบบที่ยึดหลักปฏิบัติจริงเชนเดียวกับเรา และพวกเขาก็มุงหมายจะรวมผูคนหลากหลายเชื้อชาติไวใตธงแดงเหมือนกัน ในการเผชิญความทาทายเหลานี้ เราควรรวมมือกันทั้งดานการทหารและการเมือง"
CZE_reduce_divided_nation_cost_tt: "ลดคาใชจายและระยะเวลาของการตัดสินใจ §Yชาติที่แตกแยก§! สวนใหญ"
CZE_balkan_union: "ขยายสหภาพ"
CZE_balkan_union_desc: "แมวาในภูมิภาคนี้จะมีหลายชาติหันมารับลัทธิคอมมิวนิสตมากขึ้นแลว แตเราไมอาจปกปองตนเองจากมหาอํานาจไดหากไมมีความรวมมือที่แนนแฟน การรวมเปนสหภาพจึงเปนหนทางที่ไดผลที่สุด"
CZE_cooperation_with_the_ussr:0 "รวมมือกับ [SOV.GetLeader]"
CZE_cooperation_with_the_ussr_desc: "แมแตผูสนับสนุน [SOV.GetNameDef] ที่แข็งขันที่สุดในหมูผูนําพรรคก็ยังตระหนักถึงขอบกพรองของการรวมนาหลังไดไปเยือนประเทศนั้น ถึงกระนั้น การรวมมือกับพวกเขาดานการรวมนาจะทําใหเราวิเคราะหไดอยางรอบคอบวาอะไรผิดพลาด อะไรไดผล และจะนํามาปรับใชใหดีที่สุดสําหรับ [ROOT.GetNameDef] ไดอยางไร"
CZE_exchange_military_expertise: "แลกเปลี่ยนความเชี่ยวชาญทางทหาร"
CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap] ก็เหมือนมหาอํานาจสวนใหญที่มีกองทัพขนาดใหญ ซึ่งไดทดลองยุทธวิธีของกองทัพมาแลว เราควรขอใหพวกเขาแบงปนความรู และเราก็จะแบงปนของเราเปนการตอบแทน"
CZE_pressure_romania: "กดดันโรมาเนีย"
CZE_pressure_romania_desc: "[ROM.GetNameDefCap] อาจเปนภัยคุกคามรายแรงหากเขาขางศัตรูของเรา ซึ่งอาจตัดเสนทางเชื่อมตอของเรากับ [SOV.GetNameDef] หรือปอนนํ้ามันอันมีคาใหศัตรู ดวยการหนุนหลังจาก[SOV.GetAdjective] เราจะมีแรงกดดันมากพอที่อาจดึงพวกเขามาเขาขางไดโดยไมตองทําสงคราม"
CZE_facility_in_state_tt: "หากไมมี §Yสถานที่ทดลอง§! อื่นใน $STATE|Y$ เราจะไดรับ $FACILITY_TYPE|Y$ §G1§! แหงใน $STATE|Y$"
CZE_spread_the_revolution: "เผยแพรการปฏิวัติ"
CZE_spread_the_revolution_desc: "เมื่อการปฏิวัติใน [ROOT.GetNameDef] ประสบความสําเร็จแลว เราควรสงเสริมใหชนชั้นกรรมาชีพในตางแดนลุกขึ้นตอสูเพื่ออิสรภาพของตน ซึ่งเปนการตอสูที่เราพรอมสนับสนุน"
CZE_agrarian_reform: "ฟนฟูสํานักงานที่ดิน"
CZE_agrarian_reform_desc: "สํานักงานที่ดินซึ่งเพิ่งถูกยุบไปเคยมีหนาที่จัดสรรที่ดินใหม ซึ่งสวนใหญเปนที่ดินเกษตรกรรม ถึงเวลาแลวที่เราจะปฏิรูปหนวยงานนี้เพื่อใชมาตรการที่เด็ดขาดยิ่งขึ้น"
CZE_realign_the_church: "รัฐอเทวนิยม"
CZE_realign_the_church_desc: "ศาสนาเปนปจจัยที่แบงแยกประชาชนชาว[CZE.GetAdjective]มานานเกินไปแลว เราตองลดอิทธิพลของศาสนาในกิจการของรัฐ เชน การศึกษาและขาวสาร เพื่อสรางสังคมที่เปนเอกภาพยิ่งขึ้น"
CZE_create_a_secret_police_branch: "จัดตั้งหนวยตํารวจลับ"
CZE_create_a_secret_police_branch_desc: "เพื่อรักษาเสถียรภาพ เราตองปองกันทั้งศัตรูภายนอกและภายใน ประชาชนตองใชเวลาปรับตัวกับระบบใหม โดยเฉพาะเมื่อระบบนี้ยังอยูระหวางการปรับปรุงใหสมบูรณ"
CZE_promote_urbanization: "$ARG_promote_urbanization$"
CZE_promote_urbanization_desc: "เมื่อเราจัดตั้งนารวมที่มีประสิทธิภาพไดแลว เราก็เริ่มโครงการดึงดูดประชากรชนบทบางสวนเขาสูเมืองเพื่อเพิ่มผลิตภาพที่นั่นได"
CZE_confiscate_church_lands: "ยึดที่ดินของศาสนจักร"
CZE_confiscate_church_lands_desc: "ศาสนจักรครอบครองที่ดินและความมั่งคั่งมากเกินกวาที่จําเปนตอภารกิจของตน เราตองจัดสรรที่ดินบางสวนนี้ใหม เชนเดียวกับที่เราทําใหชาวนา"
CZE_change_the_narrative:0 "เปลี่ยนเรื่องเลา"
CZE_change_the_narrative_desc: "แมศาสนจักรจะยังไมสนับสนุนการปฏิวัติของเรา แตการปรับคุณคาของศาสนจักรใหสอดคลองกับของเราอาจมีบทบาทสําคัญในการสรางแรงสนับสนุนใหระบอบใหม"
CZE_the_second_fortification_program: "เริ่มโครงการสรางปอมปราการระยะที่สอง"
CZE_the_second_fortification_program_desc: "โครงการสรางปอมปราการระยะแรกไดวางรากฐานการปองกันที่เราตองตอยอดทันที เพื่ออนาคตของชาติ เราตองเริ่มโครงการระยะที่สองโดยเร็วที่สุด และขยายแนวปอมปราการของเราใหแข็งแกรงยิ่งขึ้น"
CZE_redirect_the_fortification_councils_funds: "โยกงบสภาปอมปราการ"
CZE_redirect_the_fortification_councils_funds_desc: "โครงการสรางปอมปราการเหลานี้สูบเงินจากเศรษฐกิจของเราอยางมหาศาล เงินทุนเหลานั้นควรนําไปใชกับโครงการอื่นจะดีกวา อีกอยางกองทัพก็ไมไดตองการแนวปองกันเพิ่ม พวกเขามีมากพอแลว"
CZE_jachymov_uranium_mine: "เหมืองยูเรเนียมยาคีมอฟ"
CZE_jachymov_uranium_mine_desc: "เหมืองในยาคีมอฟเปนแหลงยูเรเนียมและแรอื่น ๆ มาชานาน แตยูเรเนียมแทบไมมีประโยชนอะไรเลยจนกระทั่งเกิดความกาวหนาทางฟสิกสเมื่อไมนานมานี้"
CZE_skoda_internal_competition: "สงเสริมการแขงขันภายใน"
CZE_skoda_internal_competition_desc: "ในบริษัทขนาดใหญอยาง Škoda เปนเรื่องยากที่จะทําใหทุกคนทํางานไดเต็มศักยภาพ การสงเสริมการแขงขันภายในจะชวยยกระดับผลงานของพนักงานในโรงงานของเราไดอยางมาก"
CZE_skoda_max_optimization_tt: "ระดับการปรับใหเหมาะสมสูงสุดของ §YŠkoda Focus§! จะเพิ่มเปน 7"
CZE_skoda_increase_cooperation: "เพิ่มความรวมมือภายใน Škoda"
CZE_skoda_increase_cooperation_desc: "เราสามารถพัฒนาตนเองไดดวยการเพิ่มความรวมมือระหวางโรงงาน ซึ่งอาจนําไปสูการแบงปนความเชี่ยวชาญระหวางโรงงานของเราดวย"
CZE_skoda_fast_optimization_tt: " อัตราที่ระดับการปรับใหเหมาะสมของ §YŠkoda Focus§! £GFX_prod_eff_cap เพิ่มขึ้นตามเวลาสูระดับสูงสุด: §G+100.0%§!"
CZE_master_of_armaments: "เจาแหงอาวุธยุทโธปกรณ"
CZE_master_of_armaments_desc: "โรงงาน Škoda เปนผูผลิตอาวุธรายใหญที่สุดภายในพรมแดนของเรามาตั้งแตสมัยจักรวรรดิออสเตรีย-ฮังการี ความเชี่ยวชาญและประสบการณของพวกเขาไมมีกลุมบริษัทอุตสาหกรรมใดในประเทศเทียบได ถึงเวลาแลวที่จะยกยองพวกเขาขึ้นเปนเจาแหงอาวุธยุทโธปกรณ"
CZE_only_the_best_is_good_enough: "ตองดีที่สุดเทานั้นจึงจะพอ"
CZE_only_the_best_is_good_enough_desc: "โรงงาน Škoda ขับเคลื่อนดวยจรรยาบรรณการทํางานหนักและจิตวิญญาณแหงนวัตกรรมมาโดยตลอด ผูกอตั้งของเรายึดมั่นในคติพจนที่วา “ลูกคาของเราสมควรไดแตสิ่งที่ดีที่สุดเทานั้น!” และคติพจนนี้ยิ่งเปนจริงมากกวาที่เคยในยุคนี้"
CZE_an_industrial_legacy: "มรดกทางอุตสาหกรรม"
CZE_an_industrial_legacy_desc: "เมื่อเราพัฒนาอุตสาหกรรมของประเทศจนสูงสงเกินกวาที่เคยคิดวาเปนไปได ในที่สุดเราก็สามารถยอมรับและประกาศมรดกทางอุตสาหกรรมของเราได เราคือขุมพลังอุตสาหกรรมที่ไมมีใครเทียบ"
CZE_powerhouse_of_europe: "ขุมพลังแหงยุโรป"
CZE_powerhouse_of_europe_desc: "อุตสาหกรรมของเราเปนที่อิจฉาของคนทั้งโลกแลว บัดนี้เราตองทําใหภาคพลังงานสามารถปอนพลังงานใหอุตสาหกรรมไดอยางเพียงพอ"
CZE_supply_fighters_for_allies: "สงเครื่องบินขับไลใหฝายสัมพันธมิตร"
CZE_supply_fighters_for_allies_desc: "รัฐบาล[FRA.GetAdjective]และ[ENG.GetAdjective]หวาดกลัวอยางยิ่งวาเครื่องบิน[GER.GetAdjective]จะทําลายแนวปองกันของพวกเขาอยางรวดเร็วและโจมตีเมืองตาง ๆ หากเกิดความขัดแยง การเสริมกําลังทางอากาศใหพวกเขาจึงอาจทําใหพวกเขามั่นใจขึ้นบางวาจะหยุดยั้งการขยายตัวของ[GER.GetAdjective]ไดโดยไมสูญเสียชีวิตมากนัก"
CZE_allies_more_likely_to_defend_us_tt: "§Yฝายสัมพันธมิตรจะมีแนวโนมหนุนหลังเรามากขึ้นในการตอตานการแผขยายของเยอรมนีเหนือซูเดเทินลันด§!"
CZE_allies_more_likely_to_defend_us_2_tt: "§Yฝายสัมพันธมิตรจะมีแนวโนมหนุนหลังเรามากขึ้นอยางมากในการตอตานการแผขยายของเยอรมนีเหนือซูเดเทินลันด§!"
CZE_allies_more_likely_to_defend_us_3_tt: "§Yฝายสัมพันธมิตรจะมีแนวโนมหนุนหลังเรามากขึ้นเล็กนอยในการตอตานการแผขยายของเยอรมนีเหนือซูเดเทินลันด§!"
CZE_establish_the_state_defense_guard: "จัดตั้งกองกําลังพิทักษรัฐ"
CZE_german_nonagressionpact: "กติกาเฮาสโฮเฟอร-ครอฟตา"
CZE_german_nonagressionpact_desc: "การเจรจาสนธิสัญญาไมรุกรานกับ [GER.GetNameDef] ดําเนินมาไดระยะหนึ่ง แตหลังจากเกิดสัญญาณความไมมั่นคงใน [SOV.GetNameDef] และแผนการแผขยายใหม การเจรจาก็หยุดชะงักลง ขณะที่ [GER.GetNameDef] กําลังวุนอยูกับศัตรูรายอื่น เราตองพยายามรื้อฟนการเจรจานี้ขึ้นมาใหม"
CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
CZE_revive_the_czechoslovak_legion_default: "ฟนฟูกองทหารเชโกสโลวัก"
CZE_revive_the_czechoslovak_legion_communist: "จัดตั้งองคกรอาสาสมัคร"
CZE_revive_the_czechoslovak_legion_dynamic_desc: "ความไมสงบกําลังกอตัวขึ้นในโลกอีกครั้ง และเหลาทหารผูกลาของ [ROOT.GetNameDef] ก็พรอมปกปองปตุภูมิ แตดังที่อดีตไดพิสูจนแลว การปกปองบานเกิดบางครั้งก็ตองอาศัยกองทหารที่ไปรบในตางแดน และเราตองตามหาผูที่ยอมจากบานเกิดไปเพื่อปกปองบานเกิดนั่นเองอีกครั้ง"
CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! จะถูกเปลี่ยนจาก §Yจิตวิญญาณกองทัพ§! เปน §Yจิตวิญญาณแหงชาติ§!"
CZE_state_sponsored_recruitment_for_spain: "การรับสมัครเพื่อสเปนโดยรัฐสนับสนุน"
CZE_state_sponsored_recruitment_for_spain_desc: "ในความขัดแยงครั้งใหมที่การแทรกแซงจากตางชาติอาจมีบทบาทชี้ขาด เราควรสงเสริมใหนักรบอาสาสมัครผูชํ่าชองของ [ROOT.GetNameDef] ไปสนับสนุนฝายที่มีนโยบายสอดคลองกับเรามากที่สุด และระหวางนั้นเราอาจไดเรียนรูบทเรียนเกี่ยวกับความกาวหนาของการสงครามในทศวรรษที่ผานมาดวย"
CZE_support_spain_reward_tt: "§Yผลเมื่อฝายในสเปนที่มีอาสาสมัครจากเราชนะหรือแพ:§!"
CZE_profit_off_the_spanish_civil_war: "หากําไรจากสงครามกลางเมืองสเปน"
CZE_profit_off_the_spanish_civil_war_desc: "สงครามกลางเมืองสเปนกําลังกลายเปนสงครามตัวแทนของมหาอํานาจ เราไมควรเสี่ยงชีวิตทหารผูกลาของเราดวยการเขาไปพัวพันกับความขัดแยงเชนนี้ แตนี่คือโอกาสอันดีที่จะหาทุนมาเสริมสรางอุตสาหกรรมดวยการขายอาวุธ ซึ่งอาจขายใหทั้งสองฝายเลยก็ได"
CZE_skoda_sell_weapons_to_SPR_tt: "ปลดล็อกการตัดสินใจ: §Yลักลอบขายอาวุธใหฝายในสเปน§!"
CZE_placate_benes_faction: "ยอมใหกลุมของเบเนช"
CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ ตองยอมรับความจริงวาชวงเวลาที่เขาดํารงตําแหนงรัฐมนตรีวาการกระทรวงการตางประเทศนั้นลมเหลวอยางสิ้นเชิง $CZE_edvard_benesh$ พรอมจะเขามาพรอมผูสนับสนุนในพรรคเกษตรกร และเสริมสถานะนายกรัฐมนตรีของ $CZE_milan_hodza$ ตราบใดที่เขายอมสละตําแหนงรัฐมนตรีตางประเทศ"
CZE_claim_lands_of_the_bohemian_crown: "อางสิทธิ์ดินแดนแหงราชบัลลังกโบฮีเมีย"
CZE_claim_lands_of_the_bohemian_crown_desc: "เนื่องจากชาติของเราเคยเปนดินแดนชายขอบของจักรวรรดิตาง ๆ ในหลายศตวรรษที่ผานมา พรมแดนของเราจึงถูกเปลี่ยนไปตามความขัดแยง มิใชตามเจตจํานงของผูอยูอาศัย ถึงเวลาแลวที่จะแกไขความเปลี่ยนแปลงเหลานั้น"
CZE_demand_katowice: "เรียกรอง [762.GetName]"
CZE_demand_katowice_desc: "การไดควบคุม [762.GetName] ไมเพียงหมายถึงการฟนฟูพรมแดนเดิมของเรา แตยังจะบั่นทอนการอางสิทธิ์ของ[POL.GetAdjective]เหนือ [72.GetName] ดวย"
CZE_fight_over_silesia: "สูเพื่อไซลีเซีย"
CZE_fight_over_silesia_desc: "ไซลีเซียอาจเปนดินแดนของ[ROOT.GetAdjective]โดยชอบธรรม แตสงครามเต็มรูปแบบกับ [66.owner.GetNameDef] ไมใชสิ่งที่พึงปรารถนา เราจึงควรแสดงแสนยานุภาพดวยการปะทะตามชายแดนขนาดใหญแทนสงครามขนาดใหญ หาก [66.owner.GetNameDef] ไมยอมสูเพื่อปกปองไซลีเซีย เราก็อาจยึดดินแดนนั้นมาได"
CZE_dismantle_poland:0 "รื้อถอน [POL.GetNonIdeologyName]"
CZE_dismantle_poland_desc: "เมื่อความไรความสามารถในการปองกันตนเองถูกเปดเผยแลว ก็ชัดเจนวา [POL.GetNameDef] ไมอาจเปนรัฐกันชนที่ไวใจไดตอศัตรูของเรา เราควรหันมาเสริมความแข็งแกรงใหรัฐของเราเองแทน"
CZE_proclaim_the_restoration_of_bohemia: "ประกาศฟนฟูราชอาณาจักรโบฮีเมีย"
CZE_proclaim_the_restoration_of_bohemia_desc: "เมื่อพรมแดนเดิมไดรับการฟนฟูแลว เราก็สามารถทวงคืนมรดกของเราและมุงผนวกรวมดินแดนใหมได"
CZE_integrate_lost_territories: "ผนวกรวมดินแดนที่สูญเสีย"
CZE_integrate_lost_territories_desc: "ดินแดนในประวัติศาสตรของราชอาณาจักรโบฮีเมียแผขยายจากทะเลบอลติกไปจนถึงทะเลเอเดรียติก ถึงเวลาแลวที่จะอางอิงประวัติศาสตรนี้ขณะที่เราผนวกรวมดินแดนใหมของเรา"
CZE_deepen_ties_with_puppet_kingdoms: "กระชับสัมพันธกับราชอาณาจักรหุนเชิด"
CZE_deepen_ties_with_puppet_kingdoms_desc: "แมตอนนี้เราจะมีเขตอิทธิพลที่ชัดเจนแลว แตเราตองเพิ่มอิทธิพลใหแข็งแกรงยิ่งขึ้นเพื่อใหไดประโยชนสูงสุดจากชาติพันธมิตรเหลานี้"
CZE_poland_alliance_monarchist: "ขอตกลงกับ [POL.GetNonIdeologyName]"
CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
CZE_a_strong_poland:0 "[POL.GetNonIdeologyName] ที่แข็งแกรง"
CZE_a_strong_poland_desc: "ดวยกองทัพที่แข็งแกรงที่สุดแหงหนึ่งในยุโรปตะวันออก [POL.GetNameDef] มีศักยภาพที่จะเปนพันธมิตรอันมีคา"
CZE_mend_balkan_relations: "ฟนสัมพันธบอลขาน"
CZE_facilitate_a_strong_hungary: "สนับสนุนฮังการีที่แข็งแกรง"
CZE_facilitate_a_strong_hungary_desc: "นับตั้งแตไดรับเอกราช [HUN.GetNameDef] มีความสัมพันธที่ไมมั่นคงกับเรามาตลอด แตเมื่อความขัดแยงกําลังกอตัว เราอาจดึงพวกเขามารวมอุดมการณของเราได"
CZE_subjegate_romania: "กดดันโรมาเนียดวยการอางสิทธิ์ของ[HUN.GetAdjective]"
CZE_subjegate_romania_desc: "การอางสิทธิ์ของรัฐหุนเชิด[HUN.GetAdjective]ของเราเปนเครื่องมือที่มีประโยชนในการตอกร [ROM.GetNameDef] ดวยการขูวาจะปลอยให [HUN.GetNameDef] เดินหนาอางสิทธิ์เหนือดินแดน[ROM.GetAdjective]และชวยใหไดดินแดนนั้นมา เราอาจเรียกรองให [ROM.GetNameDef] มาเขาขางเราได"
CZE_demanded_overlordship_HUN: "ฮังการีภายใตอํานาจ"
CZE_demanded_overlordship_ROM: "โรมาเนียภายใตอํานาจ"
CZE_integrate_hungary: "ผนวกรวมดินแดนออสเตรียเดิม"
CZE_integrate_hungary_desc: "เมื่อเราสรางเขตอิทธิพลขนาดใหญไดแลว การผนวกรวม [HUN.GetName] ที่ขยายใหญขึ้นและดินแดนอื่น ๆ อาจนําไปสูการฟนฟูพรมแดนออสเตรีย-ฮังการี แตภายใตการนําของ[ROOT.GetAdjective]"
CZE_subjegate_serbia: "ปราบ [YUG.GetName] ใหสยบ"
CZE_subjegate_serbia_desc: "[YUG.GetName] ที่ออนแอลงไมอาจทําหนาที่เปนรัฐกันชนปกปองปกใตของเราไดอีกตอไป หลังจากผนวกรวมสโลวีเนียแลว เราควรมุงขยายดินแดนออกไปอีก"
CZE_strike_the_eastern_threat: "โจมตีภัยคุกคามจากตะวันออก"
CZE_strike_the_eastern_threat_desc: "[SOV.GetName] ผูหนาไหวหลังหลอก ซึ่งอางความชอบธรรมใหความทะเยอทะยานแบบจักรวรรดินิยมของตนดวยการวิพากษรัฐบาลของเรา เปนภัยคุกคามตอการดํารงอยูของ [CZE.GetName] ที่ตองถูกกําจัด"
CZE_assist_austria:0 "ปกปอง [AUS.GetName]"
CZE_assist_austria_desc: "การกัน [AUS.GetNameDef] ใหพนจากความขัดแยงทั้งปวงเปนสิ่งจําเปนตอความมั่นคงของชาติเรา พรมแดน[AUS.GetAdjective]เปนจุดที่เปราะบางที่สุดจุดหนึ่งในแนวปองกันของเรา อีกทั้งเศรษฐกิจของพวกเขาจะเปนทรัพยสินอันมีคาสําหรับศัตรูของเรา ซึ่งเราจะปลอยใหเกิดขึ้นไมได"
CZE_return_to_democracy: "คืนสูประชาธิปไตย"
CZE_return_to_democracy_desc: "เมื่อบานเกิดของเราปลอดภัยแลว ประชาชนก็ยิ่งตระหนักวาเผด็จการทหารไมกอประโยชนอีกตอไป จึงถึงเวลาจัดการเลือกตั้งและคืนอํานาจใหรัฐบาลพลเรือนที่เปนประชาธิปไตย"
CZE_cooperate_with_the_allies: "รวมมือกับฝายสัมพันธมิตร"
CZE_cooperate_with_the_allies_desc: "เมื่อภูมิภาคมีเสถียรภาพมากขึ้นแลว เราควรพยายามฟนฟูความสัมพันธกับพันธมิตรดั้งเดิมของเรา"
CZE_eliminate_austrian_defeatists:0 "ปราบพวกยอมแพชาว[AUS.GetAdjective]"
CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap] หมดความตั้งใจที่จะปกปองรัฐของตนแลว เราตองเขาแทรกแซงเดี๋ยวนี้ กอนที่เราจะถูกลอมรอบ"
CZE_the_legacy_of_ottokar:0 "มรดกแหงออตโตการ"
CZE_the_legacy_of_ottokar_desc: "พระเจาออตโตการที่ 2 ผูเปนตํานานทรงขยายอาณาจักรโบฮีเมียเขาไปในออสเตรียจนถึงทะเลเอเดรียติกดวยความยินยอมของขุนนางออสเตรีย เราตองหันไปเอาใจชาวออสเตรียอีกครั้ง ทั้งผูสูงศักดิ์และสามัญชน"
CZE_demand_the_istrian_peninsula: "เรียกรองคาบสมุทรอิสเตรีย"
CZE_demand_the_istrian_peninsula_desc: "การที่ [ROOT.GetNameDefCap] ไมมีทางออกทะเลเปนอุปสรรคตอการคาและอิทธิพลของเรามานานเกินไปแลว เราไมอาจยอมใหเศรษฐกิจของเราตกอยูในความเมตตาของประเทศเพื่อนบานไดอีก และควรเรียกรองทางออกสูทะเลเอเดรียติก"
CZE_demand_slovenia: "เรียกรองสโลวีเนีย"
CZE_demand_slovenia_desc: "ในอดีตสโลวีเนียเปนสวนสําคัญของจักรวรรดิออสเตรีย และเมื่อเราไดควบคุมดินแดนใจกลางของจักรวรรดินั้นแลว เราตองพยายามทวงคืนดินแดนของพวกเขาอีกครั้ง"
CZE_demand_overlordship_of_yugoslav_league: "เรียกรองอํานาจเหนือสันนิบาต[YUG.GetAdjective]"
CZE_demand_overlordship_of_yugoslav_league_desc: "แมเราจะรูดีพอ ๆ กับ [YUG.GetName] วาชาติที่มีหลายชาติพันธุบางครั้งก็จําเปนตองใหอํานาจปกครองตนเองแกทองถิ่น แตพันธมิตรของพวกเขาตอนนี้ออนแอเกินกวาจะปองกันตนเองได เราตองโนมนาว [YUG.GetNameDef] ใหยอมรับขอนี้และยอมใหเราเขาแทรกแซง"
CZE_expand_the_rome_protocols: "ขยายพิธีสารโรม"
CZE_expand_the_rome_protocols_desc: "รัฐบาลใหมของเรามีแนวทางสอดคลองกับรัฐบาลใน [ITA.capital.GetCapitalVictoryPointName] มากกวาใน [GER.capital.GetCapitalVictoryPointName] มาก เมื่อทั้งสองมีความขัดแยงกันเรื่องออสเตรีย การเขารวมพิธีสารโรมอาจทําให [ITA.GetNameDef] มีความมั่นใจพอที่จะเดินตามแนวทางปจจุบันตอไปแทนที่จะหันไปหา [GER.GetNameDef]"
CZE_prague_protocols: "พิธีสารปราก"
CZE_soviet_alliance: "ขยายสนธิสัญญาพันธมิตรป 1935"
CZE_soviet_alliance_desc: "สนธิสัญญาพันธมิตรฉบับปจจุบันกับ [SOV.GetNameDef] คลุมเครือเกินกวาจะมั่นใจไดวาพวกเขาจะเขาแทรกแซงหากเราถูกโจมตี ดังนั้นหากเราตองการประกันความมั่นคงของตน เราตองเจรจาขอตกลงฉบับใหมกับพวกเขา"
CZE_airlift_soviet_support: "ขนสงความชวยเหลือโซเวียตทางอากาศ"
CZE_airlift_soviet_support_desc: "การที่เราไมมีพรมแดนติดกับพันธมิตร[SOV.GetAdjective] กอใหเกิดแนวคิดใหมในการลําเลียงทหาร[SOV.GetAdjective]ทางอากาศ ปฏิบัติการขนสงขนาดนี้ไมเคยเกิดขึ้นมากอน แตจะทําใหทหาร[SOV.GetAdjective]ไมตองเขาไปในดินแดนของเพื่อนบานเรา อยางนอยก็ทางบก"
CZE_unlocks_volunteer_transport_raid_tt: "ปลดล็อก §Yการจูโจม§!:\nสะพานอากาศสําหรับอาสาสมัครโซเวียตที่ §Y[73.GetName]§!"
CZE_intervene_in_the_ussr: "แทรกแซงสงครามกลางเมือง[SOV.GetAdjective]"
CZE_intervene_in_the_ussr_desc: "ความไมสงบเกิดขึ้นใน [SOV.GetNameDef] อีกครั้ง และแมราชวงศเกาที่เราเคยสนับสนุนจะไมไดกลับมา แตความเปนไปไดที่จะไดรัฐบาลที่เปนมิตรกวาก็ไมอาจมองขามได"
CZE_forgive_trading_debts: "ยกหนี้การคา"
CZE_forgive_trading_debts_desc: "ความไมมั่นคงทางเศรษฐกิจและภาวะเศรษฐกิจตกตํ่าครั้งใหญทําใหพันธมิตรที่มีศักยภาพบางรายแบกหนี้ที่ติดคางเราและดิ้นรนชําระคืน ซึ่งทําใหความสัมพันธตึงเครียด รัฐบาลอาจยกหนี้เหลานั้นและชดเชยใหบริษัทในประเทศที่ไดรับผลกระทบ"
CZE_improve_balkan_trade_relations: "ปรับปรุงความสัมพันธการคากับบอลขาน"
CZE_improve_balkan_trade_relations_desc: "ทรัพยสินสําคัญที่สุดในการดึงพันธมิตรบอลขานมาเปนพวกคือเศรษฐกิจของเรา เราควรแสดงใหเห็นวาเราพรอมทุมทรัพยากรเพื่อปรับปรุงสถานการณเศรษฐกิจของพันธมิตรที่มีศักยภาพ"
CZE_ally_austria: "เปนพันธมิตรกับ [AUS.GetName]"
CZE_ally_austria_desc: "รัฐบาลของ [AUS.GetNameDef] เกือบถูกพวกอันธพาลนาซีโคนลมเมื่อไมกี่ปกอน พวกเขานาจะเริ่มเห็นประโยชนของการรวมมือกับ [ROOT.GetNameDef] แลว"
CZE_demand_the_czech_corridor: "เรียกรองฉนวนเช็ก"
CZE_demand_the_czech_corridor_desc: "ขณะที่เราพัฒนาความตกลงไตรภาคีเล็กใหเปนพันธมิตรเต็มรูปแบบ ก็ยิ่งเห็นชัดวาการสงทหารไปยังพันธมิตรหรือรับทหารของพวกเขาเขามาอาจทําไดยากมากหากเกิดความขัดแยง การมีแถบดินแดนเชื่อมชาติของเรากับ [YUG.GetNameDef] ดังที่เคยเสนอไวหลังมหาสงคราม จะชวยเพิ่มความปลอดภัยและปกปองการคาของเรา"
CZE_ally_hungary: "เปนพันธมิตรกับ [HUN.GetName]"
CZE_ally_hungary_desc: "แมความขัดแยงจะบั่นทอนความสัมพันธของเรากับ [HUN.GetNonIdeologyName] มาตั้งแตกําเนิด [CZE.GetNonIdeologyName] แตเมื่อไมนานมานี้พวกเขาไดแสดงศักยภาพที่จะเปนพันธมิตรอันมีคา"
CZE_ally_yugoslavia: "เปนพันธมิตรกับ [YUG.GetName]"
CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap] อาจประสบปญหาเศรษฐกิจในชวงหลัง แตทรัพยากรทางยุทธศาสตรและที่ตั้งของพวกเขาไมอาจมองขามได"
CZE_protect_neutrality: "ปกปองความเปนกลาง"
CZE_protect_neutrality_desc: "มหาสงครามแสดงใหเห็นชัดวาการพยายามวางตัวเปนกลางนั้นไรประโยชนเมื่อตกเปนเปาของศัตรู การปกปองชาติเหลานี้หมายถึงการบีบใหศัตรูตองทําสงครามสองแนวรบเมื่อขยายอํานาจ แทนที่จะปลอยใหพวกมันแบงแยกและพิชิต"
CZE_if_cooperate_with_moderate_socialists_completed_tt: "ผลหาก §Yรวมมือกับกลุมสังคมนิยมสายกลาง§! สําเร็จแลว:"
CZE_mutual_protection_agreement_with_switzerland: "ขอตกลงคุมครองกับ [SWI.GetNonIdeologyName]"
CZE_mutual_protection_agreement_with_switzerland_desc: "ทั้งเราและ [SWI.GetNameDef] ตางมุงสรางสถานการณที่การรุกรานดินแดนของเราเปนไปไมไดหากไมยอมสูญเสียอยางมหาศาล ดวยการรวมมือกัน เราจะสามารถสงกองทัพที่มีจํานวนมากพอไมเพียงเพื่อปองกัน แตเพื่อตีโตกลับอยางเด็ดขาดดวย"
CZE_exchange_technology: "รวมมือดานการวิจัย"
CZE_exchange_technology_desc: "แมจะอุดมดวยทรัพยากรธรรมชาติ แตคาบสมุทรบอลขานขาดอาณานิคมที่ทํากําไรหรืออุตสาหกรรมกาวหนาแบบมหาอํานาจ ดังนั้นการรวมมือดานการวิจัยจึงเปนกุญแจสําคัญที่ทําใหแตละฝายมุงเนนความเชี่ยวชาญเฉพาะของตนได"
CZE_demand_corridor_to_ussr: "เรียกรองฉนวนสูชาว[SOV.GetAdjective]s"
CZE_demand_corridor_to_ussr_desc: "หาก [POL.GetNameDef] ไมยอมรวมมือกับเรา เราตองดําเนินการที่จริงจังยิ่งขึ้นเพื่อใหแนใจวาเราเขาถึงพันธมิตร [SOV.GetName] ของเราได"
CZE_ally_poland:0 "เปนพันธมิตรกับ [POL.GetName]"
CZE_ally_poland_desc: "ดวยความทรงจําถึงสงครามโปแลนด-โซเวียตที่ยังไมจางหายและภัยคุกคามที่กําลังกอตัวทางตะวันตก [POL.GetNameDef] จึงกําลังแสวงหาความมั่นคงเชนเดียวกับเรา เราตองโนมนาวชาว[POL.GetAdjective]วาความเปนกลางจะไมชวยพวกเขา และใหมารวมชะตากรรมกับเรา"
CZE_realize_the_polish_czechoslovak_confederation: "สถาปนาสมาพันธรัฐ"
CZE_realize_the_polish_czechoslovak_confederation_desc: "แมจะสูอยางกลาหาญ แต [POL.GetNameDef] ก็พายแพ เมื่อรัฐบาลของพวกเขาลี้ภัยอยูตางแดน ก็เกิดแนวคิดที่จะรวมเปนสหภาพกับเรา หากรวมรัฐบาลของพวกเขาเขากับของเรา เราจะสามารถรวบรวมชาว[POL.GetAdjective]มาสนับสนุนรัฐใหมนี้ และรวมกันปลดปลอยมาตุภูมิของเราทั้งสอง"
CZE_integrate_western_ukrainians:0 "ผนวกรวมชาวยูเครนตะวันตก"
CZE_integrate_western_ukrainians_desc: "ชาวยูเครนใน [CZE.GetNameDef] ไดรับความชวยเหลือและอํานาจปกครองตนเองอยางมาก บัดนี้เราสามารถพยายามผนวกรวมดินแดนที่เพิ่งไดมาเขากับมณฑลยูเครนของเรา"
CZE_ally_russia:0 "เปนพันธมิตรกับ [SOV.GetNonIdeologyName]"
CZE_ally_russia_desc: "เมื่อรัฐบาลของ [SOV.GetNameDef] มีแนวทางใกลเคียงกับเรามากขึ้น เราอาจพยายามตอยอดขอตกลงอันคลุมเครือที่ลงนามไวกับรัฐบาลชุดกอนของพวกเขา"
CZE_claim_ukraine:0 "จัดตั้งรัฐบาลยูเครนที่เปนมิตร"
CZE_claim_ukraine_desc: "ยูเครนเปนสวนสําคัญของ [SOV.GetNameDef] หากยึดไวได เราจะสามารถสรางรัฐกันชนที่ทรงพลัง"
CZE_strengthen_the_little_entente:0 "ทําใหความตกลงไตรภาคีเล็กเปนทางการ"
CZE_strengthen_the_little_entente_desc: "ความตกลงไตรภาคีเล็กซึ่งมุงปดลอม [HUN.GetNonIdeologyName] เปนหลัก มีศักยภาพที่จะกลายเปนพันธมิตรจริงจังที่มีกองทัพขนาดใหญ"
CZE_seek_french_leadership:0 "แสวงหาการนําของ[FRA.GetAdjective]"
CZE_seek_french_leadership_desc: "แมเราจะเปนผูริเริ่มกอตั้งพันธมิตรนี้ แตก็ชัดเจนวากองทัพของ [FRA.GetNonIdeologyName] จะเปนกําลังเสริมชั้นยอดใหพันธมิตรใด ๆ ก็ตาม แมวานั่นจะหมายถึงการยกตําแหนงผูนําใหก็ตาม"
CZE_increase_food_and_resource_imports:0 "เพิ่มการนําเขาอาหารและทรัพยากร"
CZE_increase_food_and_resource_imports_desc: "เมื่อพันธมิตรใหมของเรามีภาคเกษตรกรรมที่แข็งแกรง ความจําเปนที่จะตองอุดหนุนภาคเกษตรของเราเองก็ลดลง การนําเขาทรัพยากรในราคาถูกจะชวยประหยัดเงินของเราและกระตุนเศรษฐกิจของพันธมิตรไปพรอมกัน"
CZE_double_down_on_heavy_industry:0 "ทุมสุดตัวใหอุตสาหกรรมหนัก"
CZE_double_down_on_heavy_industry_desc: "ขอตกลงใหมกับพันธมิตรจะทําใหเรามุงเนนอุตสาหกรรมที่มีความสามารถในการแขงขันสูงสุด เชน อุตสาหกรรมอาวุธ สวนที่เกินก็สามารถขายได"
CZE_neutralize_the_hungarian_threat:0 "ขจัดภัยคุกคามจาก[HUN.GetAdjective]"
CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] เปนอุปสรรคตอการคากับพันธมิตรที่มีศักยภาพทางใต และหากเขาขางศัตรูของเรา ก็อาจตรึงกองทัพสวนที่อาจสําคัญยิ่งของเราไวได แมจะไดรับผลกระทบจากสนธิสัญญาทริอานงก็ตาม"
CZE_cancel_anti_hungary_focus: "ถอยหลังจากการแทรกแซงของ[GER.GetAdjective]"
CZE_ally_romania:0 "เปนพันธมิตรกับ [ROM.GetName]"
CZE_ally_romania_desc: "[ROM.GetNameDefCap] เปนหนึ่งในชาติที่พึ่งพาตนเองไดมากกวาชาติอื่นในภูมิภาคอยางโดดเดน ทั้งผลิตอาหารและนํ้ามันอันมีคา การดึงพวกเขามาเขาขางไมเพียงชวยใหเราเขาถึงทรัพยากรของกันและกันไดงายขึ้น แตยังตัดวัตถุดิบที่ศัตรูตองใชทําสงครามกับเราดวย"
CZE_divide_germany:0 "แบงแยกเยอรมนี"
CZE_divide_germany_desc: "ภัยคุกคามจาก [GER.GetNameDef] ยากที่จะรับมือเพียงลําพัง เราจึงควรแสวงหาพันธมิตรที่กังวลตอการแผขยายของ[GER.GetAdjective]เชนเดียวกัน และมีความมุงมั่นพอที่จะลงมือปองกันลวงหนา"
CZE_if_FRA_ally_tt: "ผลหาก §Yฝรั่งเศสเปนฝายนิยมกษัตริย§! และยังไมไดเขาขางผูใด:"
CZE_if_POL_ally_tt: "ผลหาก §Yโปแลนดที่แข็งแกรง§! สําเร็จแลวและสงผลใหไดรับการรับประกันจาก [POL.GetNonIdeologyName]:"
CZE_revolutionary_brigades:0 "กอตั้งกองพลนอยปฏิวัติ"
CZE_revolutionary_brigades_desc: "นักปฏิวัติของเราที่มีประสบการณสูรบเพื่อ [ROOT.GetNameDef] แลวควรถูกผนวกเขากับกองทัพประจําการมากขึ้น"
CZE_recruit_communist_exiles: "รับสมัครคอมมิวนิสตลี้ภัย"
CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName] เปนที่หลบภัยอันปลอดภัยของนักปฏิวัติลี้ภัยมาชานาน รัฐบาลใหมของเราสามารถใชประโยชนจากนักหัวรุนแรงตางชาติเหลานี้ได"
CZE_destabilize_potential_adversaries: "บอนทําลายเสถียรภาพของศัตรูที่อาจเกิดขึ้น"
CZE_destabilize_potential_adversaries_desc: "คอมมิวนิสตลี้ภัยที่เรารวมงานดวยเขาใจบานเกิดของตนในระดับที่แมแตสายลับของเราก็ยากจะเทียบ เราตองใชความรูนี้ใหเต็มที่เมื่อวางยุทธศาสตรปลดปลอยบานเกิดของพวกเขา"
CZE_nationalize_key_industries:0 "โอนธนาคารและเหมืองเปนของรัฐ"
CZE_nationalize_key_industries_desc: "เหมืองแรปอนวัตถุดิบที่อุตสาหกรรมของเรานําไปหลอมเปนอาวุธสงคราม การรับประกันการจัดหาวัตถุดิบในยามวิกฤตควรอยูในมือของรัฐบาล มิใชในมือของนักการเงินและนักอุตสาหกรรม"
CZE_rehabilitate_the_army: "ฟนฟูกองทัพ"
CZE_rehabilitate_the_army_desc: "นายพลสวนใหญของกองทัพ[CZE.GetAdjective]เปนทหารผานศึกจากกองทหารเชโกสโลวัก ซึ่งมีชื่อเสียงที่สุดจากการสูรบกับโซเวียตในสงครามกลางเมืองของพวกเขา เราจําเปนตองทําใหมั่นใจวาพวกเขาจะจงรักภักดีตอรัฐบาล[CZE.GetAdjective]ชุดใหม"
CZE_unlock_civil_war_army_generals_tt: "ฟนกําลังผูบัญชาการที่สูญเสียไปในสงครามกลางเมือง"
CZE_recruit_ideologically_aligned_generals: "สรรหานายพลที่ภักดีตออุดมการณ"
CZE_recruit_ideologically_aligned_generals_desc: "ถึงเวลาปรับโครงการฝกเพื่อเติมกองทัพดวยผูสมัครใหมที่เขาใจคุณคาใหมของเรา"
CZE_recruit_communist_generic_general_tt: "ไดรับนายพลคอมมิวนิสตหนึ่งคน"
CZE_purge_two_random_commanders_tt: "ผูบัญชาการสองคนแบบสุมจะถูกกวาดลาง"
CZE_czechoslovak_union: "สหภาพเชโกสโลวัก"
CZE_czechoslovak_union_desc: "ตองเพิ่มอํานาจปกครองตนเองของทองถิ่นใน [CZE.GetNameDef] ซึ่งจะทําใหปรับระบบคอมมิวนิสตใหเขากับสภาพทองถิ่นได"
CZE_continue_industrial_relocation_schemes: "ดําเนินแผนยายคลังแสงตอไป"
CZE_continue_industrial_relocation_schemes_desc: "เพื่อความมั่นคงของชาติ เราตองยายโรงงานที่เปราะบางไปยังพื้นที่ที่ไดรับการปกปองจากการโจมตีทางอากาศและภาคพื้นดินไดดีกวาตอไป เราไมอาจเสี่ยงใหอุตสาหกรรมสําคัญเชนนี้ตกอยูในอันตราย"
CZE_continue_industrial_relocation_schemes_tt: "ลบ §Yโรงงานทหาร 1 แหง§!"
CZE_continue_industrial_relocation_schemes_2_tt: "§Rโรงงานจะตองสรางขึ้นใหม§!"
CZE_establish_a_armament_factory_in_uhersky_brod: "กอตั้งโรงงานอาวุธอูแฮรสกีบรอด"
CZE_establish_a_armament_factory_in_uhersky_brod_desc: "โรงงานอูแฮรสกีบรอดเปนโรงงานอาวุธที่เชี่ยวชาญการผลิตและออกแบบอาวุธอัตโนมัติสําหรับทหารราบและอากาศยาน เราวางแผนจะทําใหที่นี่เปนโรงงานประเภทนี้ที่กาวหนาที่สุดในโลก"
CZE_appeal_to_the_castle: "ขอแรงสนับสนุนจาก 'ปราสาท'"
CZE_appeal_to_the_castle_desc: "'ปราสาท' ในเชโกสโลวาเกียหมายถึงเครือขายกวางขวางขององคกรและบุคคลผูทรงอิทธิพลที่สนับสนุนประธานาธิบดี อํานาจนี้ทําใหประธานาธิบดีมีอิทธิพลมากกวาที่หนาที่อันจํากัดตามรัฐธรรมนูญจะบงบอก การขอแรงสนับสนุนจากกลุมนี้จะชวยเสริมความพยายามชิงตําแหนงผูนําของเราไดอยางมหาศาล"
CZE_petition_the_nobles: "ยื่นคํารองตอเหลาขุนนาง"
CZE_petition_the_nobles_desc: "ชนชั้นขุนนางของ [ROOT.GetNameDef] อาจไมมีบรรดาศักดิ์ที่ไดรับการรับรองอีกแลว แตก็ยังเปนสวนที่มีอิทธิพลในสังคม[ROOT.GetAdjective] การสนับสนุนของพวกเขาจะมอบทั้งความชอบธรรมและทรัพยากรที่จําเปนตอการรวบรวมแรงสนับสนุนเพิ่มเติม"
CZE_unify_the_fascist_parties: "รวมพรรคฟาสซิสตเปนหนึ่ง"
CZE_unify_the_fascist_parties_desc: "พรรคฟาสซิสตตาง ๆ แตกกระจาย หลายพรรคสุดโตงเกินกวาจะหวังไดรับการสนับสนุนอยางมีนัยสําคัญ เพื่อปกปองชาติ พรรคเหลานี้จําเปนตองรวมตัวกันและสรางวิสัยทัศนของเชโกสโลวาเกียที่ดึงดูดใจคนทั่วไป ไมใชเพียงกลุมชายขอบของสังคม"
CZE_pro_rearmament_propaganda: "โฆษณาชวนเชื่อสนับสนุนการสรางกําลังอาวุธ"
CZE_pro_rearmament_propaganda_desc: "เพื่อเพิ่มการสนับสนุนรัฐบาลที่รวมศูนยอํานาจมากขึ้น เราตองเนนยํ้าสถานการณอันเปราะบางของโลกรอบตัวเรา ซึ่งจะชวยกระตุนใหประชาชนสนับสนุนแผนเสริมสรางกองทัพเมื่อจําเปนดวย"
CZE_align_nationalist_parties: "ดึงพรรคชาตินิยมเช็กมาเปนพวก"
CZE_align_nationalist_parties_desc: "แมเราควรพยายามดึงดูดชาว[ROOT.GetAdjective]ทุกกลุม แตปฏิเสธไมไดวาพรรคชาตินิยมเช็กดั้งเดิมมีอิทธิพลมากที่สุดในเวทีการเมือง และเปนกลุมที่เราจะรวบรวมแรงสนับสนุนไดงายที่สุด"
CZE_align_slovak_catholics: "ดึงชาวคาทอลิกสโลวักมาเปนพวก"
CZE_align_slovak_catholics_desc: "พรรคคาทอลิกและพรรคชาตินิยมไดรับการสนับสนุนอยางมากในสโลวาเกียขณะนี้ แมการดึงใจกลุมชาตินิยมจะยากหากไมยอมออนขออยางจริงจัง แตเราอาจรวบรวมกลุมคาทอลิกมาสนับสนุนเราได"
CZE_jozef_tiso_tt: "แตงตั้งที่ปรึกษา §Y$CZE_jozef_tiso$§!"
CZE_align_catholic_parties: "ดึง CSL มาเปนพวก"
CZE_align_catholic_parties_desc: "ČSL และพรรคคาทอลิกอื่น ๆ เคยเปนฐานสนับสนุนดั้งเดิมของระบอบกษัตริยในจักรวรรดิออสเตรีย-ฮังการี ถึงเวลาแลวที่เราจะพยายามโนมนาวพวกเขากลับสูจุดยืนนี้"
CZE_restore_the_monarchy: "ฟนฟูระบอบกษัตริย"
CZE_restore_the_monarchy_desc: "เมื่อการสนับสนุนระบบใหมมั่นคงแลว ถึงเวลาเสนอแนวคิดที่ขัดเกลาแลวตอประชาชน ดวยการเลือก $CZE_karel_schwarzenberg$ เปนกษัตริย เราจะดึงใจไดทั้งผูสนับสนุนระบอบกษัตริยรุนเกาและรุนใหม เพราะเขาเปนชาว[ROOT.GetAdjective] มิใชกษัตริย[AUS.GetAdjective]ที่เคยถูกยัดเยียดใหเราดังเชนในอดีต"
CZE_semi_constitutional_monarchy: "ระบบกึ่งรัฐธรรมนูญ"
CZE_semi_constitutional_monarchy_desc: "เมื่อไดเลือกกษัตริยแลว ก็ถึงเวลาปรับแกรัฐธรรมนูญ แมบางฝายจะสนับสนุนการรวมศูนยอํานาจเพื่อหลีกเลี่ยงความขัดแยงภายในในยามยากลําบากนี้ แตก็ชัดเจนวากษัตริยไมอาจทําทุกอยางไดโดยลําพัง ดังนั้นอาจดีที่สุดที่จะคงระบบปจจุบันไวบางสวนเพื่อชวยบริหารประเทศ ขณะที่กษัตริยทําหนาที่ชี้นําประเทศ"
CZE_restore_noble_titles: "ฟนฟูบรรดาศักดิ์ขุนนาง"
CZE_restore_noble_titles_desc: "บรรดาศักดิ์ของขุนนางถูกยกเลิกไปเมื่อกอตั้งสาธารณรัฐ ถึงเวลาตอบแทนความรวมมือของเหลาขุนนางดวยการคืนบรรดาศักดิ์ให ซึ่งยังทําใหเราสามารถมอบบรรดาศักดิ์กิตติมศักดิ์แกวีรบุรุษ เชน นายทหารผานศึกที่สูรบเพื่อรัฐ[ROOT.GetAdjective]ครั้งแลวครั้งเลา"
CZE_restore_the_austro_hungarian_customs_union: "ฟนฟูสหภาพศุลกากรแหงจักรวรรดิ"
CZE_restore_the_austro_hungarian_customs_union_desc: "ขอไดเปรียบที่ปฏิเสธไมไดประการหนึ่งของจักรวรรดิออสเตรีย-ฮังการีคือกําแพงการคาที่จํากัดสําหรับอุตสาหกรรมของเรา การฟนฟูสหภาพนี้จะเปนกาวแรกในการดึงประเทศที่เคยเปนสวนหนึ่งของจักรวรรดิเขามาอยูในเขตอิทธิพลของเรา"
CZE_customs_union: "สหภาพศุลกากร"
CZE_catholic_focus:0 "มุงเนนคาทอลิก"
CZE_catholic_focus_desc: "แมขบวนการฮุสไซตจะเปนสวนที่มีชื่อเสียงในประวัติศาสตร[ROOT.GetAdjective] แตผูคนจํานวนมากยังคงนับถือคาทอลิก ซึ่งเราควรดึงใจดวยการเพิ่มบทบาทของพวกเขาในสังคม"
CZE_hussite_legacy:0 "มรดกแหงฮุสไซต"
CZE_hussite_legacy_desc: "ขบวนการฮุสไซตไมเพียงสงเสริมคริสตศาสนาแบบโปรเตสแตนตมากขึ้น แตยังโดดเดนดวยความอดกลั้นตอความเห็นที่แตกตางในเรื่องนี้ ตางจากทรราชที่กอสงครามเพื่อตอตานพวกเขา"
CZE_align_with_germany:0 "เขาขาง [GER.GetNonIdeologyName]"
CZE_align_with_germany_desc: "รัฐบาลใหมใน [GER.GetNameDef] อาจไมไดลดความกระหายการแผขยายลง แตอาจพรอมจะยึดหลักปฏิบัติจริงมากขึ้นในการเลือกวาจะเปนพันธมิตรกับใครและจะประณามใคร เราควรพยายามอยูในกลุมแรก"
CZE_rally_against_germany: "รวมพลังตอตาน [GER.GetNonIdeologyName]"
CZE_rally_against_germany_desc: "ชาวเชโกสโลวาเกียตอสูอยางกลาหาญเพื่อเอกราชของตน และบัดนี้เราตองเรียกรองใหประชาชนทุกคนรวมปกปองเอกราชนี้"
CZE_integrate_sudeten_germans:0 "ผนวกรวมซูเดเทินลันด"
CZE_integrate_sudeten_germans_desc: "ความแตกแยกในหมูประชากรซูเดเทินลันดไมเปนประโยชนตอใครเลย เราตองมุงรับฟงขอกังวลของพวกเขาและแกไขปญหาเหลานั้น เพียงเทานี้ก็อาจลดทอนพลังของกลุมเรียกรองเอกราชได เพราะขอกลาวหาเรื่องการถูกปฏิบัติอยางไมเปนธรรมจะนาเชื่อถือนอยลง"
CZE_cooperate_with_the_sdp:0 "รวมมือกับ SdP"
CZE_cooperate_with_the_sdp_desc: "แม SdP จะเปนกลุมที่บอนทําลายเสถียรภาพ แตก็อาจยอมเขาแถวหากไดรับการโนมนาวอยางเหมาะสม เชน การดึงเขารวมรัฐบาลผสม"
CZE_revive_the_december_bloc:0 "ฟนฟูกลุมธันวาคม"
CZE_revive_the_december_bloc_desc: "กลุมธันวาคมซึ่งประกอบดวยพรรคฟาสซิสต พรรคชนกลุมนอย และพรรคฝายขวาที่คัดคานการที่เอดวารด เบเนช ขึ้นเปนประธานาธิบดี ควรไดรับการฟนฟูเพื่อเปนทางเลือกแทนรัฐบาลปจจุบัน"
CZE_revert_1926_anti_military_laws:0 "ยกเลิกกฎหมายตอตานทหารป 1927"
CZE_revert_1926_anti_military_laws_desc: "หลังความพยายามกอรัฐประหารของ $CZE_radola_gajda$ กองทัพและตํารวจภูธรถูกเพิกถอนสิทธิ์เลือกตั้งรวมถึงเอกสิทธิ์อื่นบางประการ ดวยบทบาทสําคัญยิ่งของกองทัพในยามยากลําบากนี้ จึงเปนธรรมแลวที่เราจะยกเลิกขอจํากัดเหลานี้และขจัดเสนแบงระหวางกองทัพกับการเมือง"
CZE_bop_to_fascism_support_tt: "เพิ่มหนึ่งในสามของคา §Y$CZE_bop_army_readiness$§! ใหกับการสนับสนุนฟาสซิสต:"
CZE_power_to_the_military: "อํานาจสูฝายทหาร"
CZE_power_to_the_military_desc: "เห็นไดชัดวาเราไมอาจประหยัดทรัพยากรใด ๆ ในการปกปองชาติ จึงสําคัญยิ่งที่ผูกุมอํานาจตองเขาใจความตองการของกองทัพ และไมมีวิธีใดรับประกันเรื่องนี้ไดดีไปกวารัฐบาลทหาร"
CZE_militarize_the_associations: "ทําใหสมาคมตาง ๆ เปนกองกําลังทหาร"
CZE_militarize_the_associations_desc: "สมาคมจํานวนมากใน [CZE.GetNameDef] สามารถมีสวนรวมในการปองกันประเทศไดดวยการสอนทักษะที่จําเปนสําหรับทหาร ตั้งแตกอนที่ประชาชนจะถูกระดมพลเสียอีก"
CZE_aggressive_foreign_policy:0 "นโยบายตางประเทศเชิงรุก"
CZE_aggressive_foreign_policy_desc: "ยุคแหงการไววางใจกติกาสัญญาที่เปราะบางไดสิ้นสุดลงแลว เราตองลงมืออยางเด็ดขาดเพื่อรักษาความมั่นคงของเรา แมจะตองเสียสละอยางมากก็ตาม"
CZE_work_with_germany: "ทํางานรวมกับ [GER.GetNameDef]"
CZE_work_with_germany_desc: "เมื่อปญหาซูเดเทินลันดยุติลงแลว บางที [GER.GetNameDef] อาจตระหนักไดวา [ROOT.GetNameDef] จะเปนพันธมิตรที่มีคาเพียงใด"
CZE_control_the_associations:0 "ควบคุมสมาคมตาง ๆ"
CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName] มีองคกรมากมาย ตั้งแตกลุมผูประกอบอาชีพเดียวกัน กลุมงานอดิเรก ไปจนถึงสมาคมกีฬา ควบคุมองคกรเหลานี้ไดก็เทากับควบคุมสังคมไดเปนสวนใหญ"
CZE_diversify_bata: "กระจายธุรกิจของ Bat'a"
CZE_diversify_bata_desc: "Bat'a เปนบริษัทสินคาอุปโภคบริโภครายใหญที่เราสามารถใชประโยชนในหวงโซอุปทานทรัพยากรของเรา พวกเขาชวยจัดหาวัสดุสําคัญที่หาไดยากดวยวิธีอื่น"
CZE_devaluate_the_koruna: "ลดคาเงินโครูนา"
CZE_devaluate_the_koruna_desc: "การมีคาเงินแข็งเปนสถานะทางเศรษฐกิจที่อันตรายสําหรับประเทศที่พึ่งพาการสงออกเปนสวนสําคัญของเศรษฐกิจ การทําใหคาเงินออนลงอาจสรางความเจ็บปวดในระยะสั้น แตในระยะยาวเราจะไดประโยชนมากกวา"
CZE_continue_the_central_bohemia_plan: "แผนโบฮีเมียกลาง"
CZE_continue_the_central_bohemia_plan_desc: "การเดินหนาตามแผนขยายเขตอุตสาหกรรมในใจกลางประเทศจะชวยใหเราไดประโยชนจากการประหยัดตอขนาด อีกทั้งการขยายอุตสาหกรรมในพื้นที่ที่หางไกลจากพรมแดนก็เปนการตัดสินใจที่ฉลาดในแงความมั่นคงของชาติ"
CZE_balance_industrial_invevestments: "ถวงดุลการพัฒนาอุตสาหกรรม"
CZE_balance_industrial_invevestments_desc: "การปลอยใหพื้นที่นอก [9.getname] และ [75.getname] ดอยพัฒนาเปนสาเหตุหนึ่งที่ทําใหประเทศเริ่มแตกแยกเมื่อตนทศวรรษ การพัฒนาพื้นที่รอบนอกของประเทศจะชวยลดชองวางการพัฒนาอุตสาหกรรมระหวางสองพื้นที่"
CZE_expand_prf_science_facilities: "ขยายสถานวิทยาศาสตรของ PrF"
CZE_expand_prf_science_facilities_desc: "สถานวิทยาศาสตรของ PrF เต็มไปดวยกองทัพคนหัวดีที่รอโอกาสทําสิ่งที่ยิ่งใหญกวาที่ทําอยู การขยายคณะและใหพวกเขารวมงานกับรัฐบาลเปนจุดเริ่มตนที่ดีในการพัฒนาการวิจัยของเรา"
CZE_raise_more_industrial_funds: "ระดมทุนอุตสาหกรรมเพิ่มเติม"
CZE_raise_more_industrial_funds_desc: "นับตั้งแตสมัยออสเตรีย-ฮังการีจนถึงปจจุบัน อุตสาหกรรมคือหัวใจของชาติเรา ดวยการจัดสรรงบประมาณและเงินทุนที่จําเปน อุตสาหกรรมจะยังคงเฟองฟูตอไปในยุโรปที่ปนปวนนี้"
CZE_skoda_priority_focus_info_tt: "§Yแผนยุทธศาสตร§! บางแผนกําหนดใหเราตองอยูใน £GFX_CZE_skoda_text_icon §Yลําดับความสําคัญ Škoda§! แบบเฉพาะจึงจะทําสําเร็จ แผนเหลานี้จะมีไอคอนเล็ก ๆ ที่เกี่ยวของกับ £GFX_CZE_skoda_text_icon §Yลําดับความสําคัญ Škoda§! ที่ตองการกํากับไว"
CZE_joint_stock_schemes: "โครงการรวมทุนแบบหุน"
CZE_joint_stock_schemes_desc: "โครงการรวมทุนแบบหุนเปนแหลงการเติบโตทางเศรษฐกิจเมื่อแหลงเงินทุนแบบดั้งเดิมขาดแคลน การใชวิธีนี้ตอไปจะทําใหเศรษฐกิจของเราเติบโตยิ่งขึ้น"
CZE_the_slovak_arrow: "ลูกศรสโลวัก"
CZE_the_slovak_arrow_desc: "การพัฒนารถรางไฟความเร็วสูงระหวางสองเมืองใหญของเราจะเปนความภาคภูมิใจของชาติอยางยิ่ง ทั้งยังเปนขออางที่ดีในการปรับปรุงโครงสรางพื้นฐานทางรถไฟดวย"
CZE_finish_double_tracking_efforts: "สรางทางรถไฟทางคู"
CZE_finish_double_tracking_efforts_desc: "การสรางทางคูบนเสนทางรถไฟสายรองที่สําคัญใหแลวเสร็จจะชวยใหรองรับการจราจรไดมากขึ้น นําไปสูการเชื่อมตอที่ดีขึ้นระหวางเมืองรองของเรา"
CZE_realize_motorway_proposals: "ทําขอเสนอทางหลวงพิเศษใหเปนจริง"
CZE_realize_motorway_proposals_desc: "มีขอเสนอสรางทางหลวงพิเศษหลายโครงการที่ยื่นตอรัฐบาล ซึ่งจะชวยปรับปรุงการเชื่อมตอทางถนนภายในประเทศไดอยางมาก เราควรดําเนินการตามขอเสนอเหลานี้และทําใหเปนจริง"
CZE_build_additional_rail_stations: "สรางสถานีรถไฟเพิ่มเติม"
CZE_build_additional_rail_stations_desc: "ดวยโครงสรางพื้นฐานทางรถไฟที่เพิ่งพัฒนาขึ้น สถานีรถไฟเดิมบางแหงไมอาจรองรับปริมาณที่เพิ่มขึ้นได การปรับปรุงสถานีเหลานี้จะชวยใหเราขนสงผูคนและสินคาไปยังที่ที่ตองการไดในปริมาณที่มากขึ้นอยางมาก"
CZE_build_additional_rail_stations_focus_cost_tt: "การเลือก §Y$CZE_devaluate_the_koruna$§! จะลดเวลาของแผนยุทธศาสตรนี้ลงเหลือ §G35§! วัน"
CZE_grow_ckd_secondary_facilities: "โรงงานรองของ CKD"
CZE_grow_ckd_secondary_facilities_desc: "CKD มีโรงงานรองขนาดเล็กจํานวนมากที่ผลิตสินคาอุตสาหกรรมสําคัญ เชน เครื่องกําเนิดไฟฟา การขยายโรงงานเหลานี้จะชวยใหอุตสาหกรรมหนักของเราเติบโต"
CZE_bolster_domestic_construction: "เสริมกําลังภาคกอสรางในประเทศ"
CZE_bolster_domestic_construction_desc: "ภาคการกอสรางในประเทศของเราเติบโตอยางตอเนื่องนับตั้งแตไดรับเอกราชหลังมหาสงครามสิ้นสุด การลงทุนเพิ่มเติมในผูรับเหมากอสรางขนาดกลางบางรายจะชวยเสริมการเติบโตนี้ยิ่งขึ้น"
CZE_invest_in_vhht: "ลงทุนใน VHHT"
CZE_invest_in_vhht_desc: "VHHT เปนบริษัทที่มีโรงงานโลหะการหลากหลายประเภทกระจายอยูทั่วประเทศ การลงทุนและขยายโรงงานเหลานี้จะชวยใหเราพัฒนาการผลิตโลหะไดในหลายดานในอนาคต"
CZE_expand_vitkovice_ironworks: "ขยายโรงถลุงเหล็กวีตโควิตซเก"
CZE_expand_vitkovice_ironworks_desc: "โรงถลุงเหล็กวีตโควิตซเกเปนแหลงผลิตเหล็กสําคัญใน [74.getname] การขยายโรงงานจะเพิ่มผลผลิตไดอยางมาก"
CZE_expand_central_bohemian_mines: "ขยายเหมืองโบฮีเมียกลาง"
CZE_expand_central_bohemian_mines_desc: "เหมืองในใจกลางประเทศมีความสําคัญที่สุดตอความมั่นคงทางพลังงานของเรา เราตองขยายเหมืองเหลานี้โดยเร็วที่สุด"
CZE_increase_bauxite_imports: "เพิ่มการนําเขาบอกไซต"
CZE_increase_bauxite_imports_desc: "ประเทศของเราอาจไมอุดมดวยอะลูมิเนียม แตดวยกระบวนการกลั่นบางอยางและการเพิ่มการนําเขาบอกไซต เราก็สามารถผลิตทรัพยากรนี้ไดในประเทศจํานวนหนึ่ง ซึ่งจะชวยบรรเทาการขาดแคลนทรัพยากร"
CZE_merge_the_oil_companies: "ควบรวมบริษัทนํ้ามัน"
CZE_merge_the_oil_companies_desc: "บริษัทนํ้ามันของเราแทบจะเรียกตัวเองวาบริษัทนํ้ามันไมได ทั้งหมดเปนบริษัทเล็ก ๆ ที่มีบอนํ้ามันเพียงไมกี่บอ ดวยการควบรวมและนําอุตสาหกรรมนํ้ามันมาอยูใตการควบคุมของรัฐ เราจะทําไดมากขึ้นดวยทรัพยากรที่นอยลง"
CZE_expand_trinec_ironworks: "โรงถลุงเหล็กตรชีเนตซ"
CZE_expand_trinec_ironworks_desc: "โรงงานเหล็กกลาตรชีเนตซเปนยักษใหญแหงอุตสาหกรรมใน [72.getname] มาตั้งแตกอตั้ง การลงทุนเพิ่มเติมจะใหผลตอบแทนมหาศาลดานการผลิตทรัพยากร"
CZE_consolidate_mining_operations: "รวมศูนยการทําเหมือง"
CZE_consolidate_mining_operations_desc: "การทําเหมืองของเราจะมีประสิทธิภาพยิ่งขึ้นหากรวมการบริหารบริษัทเหมืองเขาดวยกัน ซึ่งจะทําใหการวิจัยและความพยายามขยายเหมืองที่มีอยูมีประสิทธิภาพมากขึ้น"
CZE_expand_praga: "สัญญากับ Praga"
CZE_expand_praga_desc: "Praga เปนแหลงผลิตชิ้นสวนตาง ๆ ใหอุตสาหกรรมทหารของเรามาหลายปแลว จึงสมเหตุสมผลที่จะตอบแทนดวยสัญญาเพิ่มเติมเพื่อชวยใหพวกเขาเติบโตตอไป"
CZE_shrink_educational_disparities: "ลดความเหลื่อมลํ้าทางการศึกษา"
CZE_shrink_educational_disparities_desc: "พื้นที่ชนบทของเราขาดการศึกษาที่ดีเทากับในเขตเมือง เราตองตอสูกับความเหลื่อมลํ้านี้ดวยโครงการการศึกษาขนาดใหญที่มุงเปาไปยังพื้นที่เหลานี้"
CZE_kickstart_rapid_rearmanent: "เรงสรางกําลังอาวุธอยางรวดเร็ว"
CZE_kickstart_rapid_rearmanent_desc: "นักการเมืองและนักธุรกิจจํานวนมากอาจมองวาเปนการตัดสินใจที่เลวราย แตเราตองเริ่มสรางกําลังอาวุธตั้งแตตอนนี้ ประเทศรอบตัวเราไมไดลดอาวุธ ตรงกันขามพวกเขากําลังทําในสิ่งตรงขาม และนี่คือความลับที่ใครก็รู เราตองเตรียมกองทัพในขณะที่ยังมีเวลา"
CZE_keep_focus_on_weapon_exports: "มุงเนนการสงออกอาวุธตอไป"
CZE_keep_focus_on_weapon_exports_desc: "อุตสาหกรรมสงออกอาวุธขนาดใหญของเราคือสิ่งที่พาเราออกจากภาวะเศรษฐกิจตกตํ่า การกลับทิศทางนี้จะเปนอันตรายทั้งทางการเมืองและเศรษฐกิจ การเดินหนาแนวทางเดิมคือทางเลือกที่ดีที่สุดในตอนนี้ อีกอยางภัยคุกคามตอเราก็ถูกขยายเกินจริงอยูแลว"
CZE_force_the_industrialists_hand: "บีบบังคับนักอุตสาหกรรม"
CZE_force_the_industrialists_hand_desc: "นักอุตสาหกรรมและกลุมบริษัทขัดขวางความสามารถในการสรางกําลังอาวุธอยางมีประสิทธิภาพของเรามานานเกินไปแลว ถึงเวลาที่เราจะตัดสินใจแทนพวกเขา เพื่อประโยชนของชาติ"
CZE_embrace_corporatism: "ยอมรับลัทธิบรรษัทนิยม"
CZE_embrace_corporatism_desc: "เราอาจเจรจากับนักอุตสาหกรรมใหชวยเริ่มตนการสรางกําลังอาวุธใหม หากเรายอมรับเงื่อนไขบางขอของพวกเขา การเปลี่ยนนโยบายบางอยางเพื่อเอื้อประโยชนแกพวกเขานั้นสมเหตุสมผลและเปนผลดีตอเราดวย"
CZE_expand_existing_armory_plants: "ขยายโรงงานอาวุธที่มีอยู"
CZE_expand_existing_armory_plants_desc: "การยายที่ตั้งคลังแสงบางแหงจะเปนการลงทุนที่มีราคาแพงแตไดประโยชนระยะยาวนอย การขยายสถานที่เดิมจะใหประโยชนและโอกาสในการเพิ่มการผลิตและการวิจัยพัฒนา ณ ที่ตั้งปจจุบัน แมจะเสี่ยงที่ที่ตั้งเหลานั้นจะถูกศัตรูโจมตีไดงายกวาก็ตาม"
CZE_expand_skoda_offices: "ขยายสํานักงานของ Škoda"
CZE_expand_skoda_offices_desc: "สํานักงานตางประเทศของเราคือตัวขับเคลื่อนยอดขายอาวุธ การขยายไปยังที่ตั้งใหม ๆ จึงเปนการตัดสินใจที่สมเหตุสมผล"
CZE_skoda_office_unlock_tt: "ปลดล็อกการตัดสินใจ: §Yสรางสํานักงานขายอาวุธ§!"
CZE_complete_the_power_grid: "สรางโครงขายไฟฟาใหสมบูรณ"
CZE_complete_the_power_grid_desc: "โครงขายไฟฟาในพื้นที่ชนบทของเรายังตองพัฒนาอีกมาก มันลาหลังสวนอื่นของประเทศและเปนอุปสรรคตอความกาวหนาทางเศรษฐกิจ"
CZE_build_the_slapy_reservoir: "สรางอางเก็บนํ้าสลาป"
CZE_build_the_slapy_reservoir_desc: "การสรางเขื่อนใกลสลาปจะนําไปสูการผลิตไฟฟาที่มากขึ้นและโอกาสทางเศรษฐกิจในพื้นที่ การผลิตไฟฟาที่เพิ่มขึ้นจะชวยใหอุตสาหกรรมในภูมิภาคเติบโตไดอยางมาก"
CZE_diversify_refinery_processes: "กระจายกระบวนการกลั่น"
CZE_diversify_refinery_processes_desc: "บอนํ้ามันของเราสามารถผลิตผลพลอยไดจากนํ้ามันไดหลากหลาย ปญหาเพียงอยางเดียวคือเราขาดความรูที่จะทําใหเกิดขึ้น หากเราทุมเวลาวิจัยเพื่อหาวิธี เราก็จะทําความฝนนี้ใหเปนจริงได"
CZE_enlarge_smaller_wells: "ขยายบอนํ้ามันขนาดเล็ก"
CZE_enlarge_smaller_wells_desc: "แมจะมีขนาดเล็ก แตบอนํ้ามันเหลานี้สามารถผลิตไดมากกวาปริมาณอันนอยนิดที่ผลิตอยูตอนนี้มาก เราเพียงแคตองทุมเวลาเพื่อใหเกิดขึ้น"
CZE_develop_sudetenland_resources: "พัฒนาทรัพยากรซูเดเทินลันด"
CZE_develop_sudetenland_resources_desc: "ซูเดเทินลันดมีแหลงทรัพยากรมากมายที่เรายังไมไดใชประโยชน การไมลงทุนสรางเหมืองเพิ่มในพื้นที่นี้จะเปนความผิดพลาด"
CZE_grow_tatras_capabilities: "เพิ่มขีดความสามารถของ Tatra"
CZE_grow_tatras_capabilities_desc: "แผนกรถถังขนาดเล็กของ Tatra มีแบบการผลิตที่แปลกใหม การมอบทรัพยากรเพิ่มเติมจะชวยใหพวกเขาพัฒนาการออกแบบยานเกราะตอไปได"
CZE_bailout_moser: "อุม Moser"
CZE_bailout_moser_desc: "Moser ตกอยูในภาวะยากลําบากหลังภาวะเศรษฐกิจตกตํ่าครั้งใหญ อุตสาหกรรมของพวกเขาตองไดรับการชวยเหลือ โรงงานตองเปดใหม และคนที่ถูกเลิกจางตองไดกลับมาทํางาน"
CZE_merge_skodas_consumer_good_plants: "ควบรวมโรงงานสินคาอุปโภคของ Škoda"
CZE_merge_skodas_consumer_good_plants_desc: "Škoda มีโรงงานสินคาอุปโภคขนาดเล็กจํานวนมากในเครือที่ไมไดรวมศูนย การควบรวมจะชวยเพิ่มประสิทธิภาพการผลิตในหลายดานของโรงงานเหลานั้น และอาจสงผลดีตอ Škoda โดยรวมดวย"
CZE_giant_of_central_europe_industry: "ยักษใหญแหงอุตสาหกรรม"
CZE_giant_of_central_europe_industry_desc: "สูงสงเกินกวาที่เคยคิดวาเปนไปได บัดนี้เราคือยักษใหญแหงอุตสาหกรรมในยุโรป!"
CZE_continue_armed_force_reform: "ปฏิรูปกองทัพตอไป"
CZE_continue_armed_force_reform_desc: "ดวยการปรับปรุงกองทัพใหทันสมัยตอไปตามกําหนดการที่วางไว และจัดสรรเขตทหารใหมใหขึ้นกับกองบัญชาการระดับมณฑล เราจะประสานงานไดดีขึ้นในความขัดแยงใด ๆ ที่อาจเกิดขึ้น"
CZE_air_force_officer_recruitment: "รับสมัครนายทหารกองทัพอากาศ"
CZE_air_force_officer_recruitment_desc: "สโมสรการบินทั่วทุกมณฑลรวมมือกับโรงเรียนนายทหารสํารองกองทัพอากาศ ตอบสนองความตองการนายทหารสํารองที่สําคัญยิ่งดวยการเปดหลักสูตรการบินและการฝกยิงกระสุนจริง"
CZE_national_defense_act: "พระราชบัญญัติการปองกันประเทศ"
CZE_national_defense_act_desc: "พระราชบัญญัติปองกันประเทศฉบับนี้ครอบคลุมทุกมาตรการ ทั้งทางทหารและดานอื่น ๆ ที่มุงรับมือภัยคุกคามหรือการโจมตีตออธิปไตย บูรณภาพ เอกภาพ และความมั่นคงของชาติเรา ภายใตการกํากับดูแลของสภาปองกันประเทศสูงสุด (NROS)"
CZE_car_and_oil_rationing: "ปนสวนรถยนตและนํ้ามัน"
CZE_car_and_oil_rationing_desc: "การปนสวนยานยนตสวนบุคคลและเกณฑมาใชตามความจําเปน จะชวยใหเราทุมการผลิตยานยนตและทรัพยากรปโตรเลียมใหกับความตองการทางทหารได"
CZE_expand_airfield_capacity: "ขยายขีดความสามารถของสนามบิน"
CZE_expand_airfield_capacity_desc: "กรมการบินที่ 3 ไดวางแผนสรางสนามบินและโรงเก็บเครื่องบินใหม เพื่อใชปฏิบัติการ จัดเก็บ และซอมบํารุงอากาศยานของเราอยางเหมาะสม รวมถึงหอพักสําหรับฝูงบินและเจาหนาที่ภาคพื้นที่เพิ่งจัดตั้งขึ้น"
CZE_trust_in_old_guard: "เชื่อมั่นในคนรุนเกา"
CZE_trust_in_old_guard_desc: "ทักษะการบินและประสบการณจากมหาสงครามจะถูกถายทอดสูคนรุนใหมโดยทหารผานศึก ผูซึ่งเราไววางใจอยางมั่นคง"
CZE_expand_the_aero_clubs: "ขยายสโมสรการบิน"
CZE_expand_the_aero_clubs_desc: "สโมสรการบินไดพิสูจนแลววามีประโยชนในการปอนนักบินที่มีความสามารถใหประเทศอยางตอเนื่อง เราควรขยายสโมสรเหลานี้ใหมากขึ้น"
CZE_invest_in_the_smaller_air_plants: "ลงทุนในโรงงานอากาศยานขนาดเล็ก"
CZE_invest_in_the_smaller_air_plants_desc: "การลงทุนในผูผลิตอากาศยานรายใหมและรายเล็กจะสรางการแขงขันที่จําเปนใหกับผูผลิตรายเดิม และยังชวยรองรับความตองการการผลิตที่กวางขึ้นของเราได"
CZE_continue_avia_expansion: "ขยาย Avia ตอไป"
CZE_continue_avia_expansion_desc: "การลงทุนใน Avia จะชวยเพิ่มเครื่องจักรอุปกรณที่จําเปนตอการเสริมกําลังการผลิต ซึ่งจะชวยใหผลิตโครงเครื่องบินที่เปนที่ตองการสูงไดอยางมีประสิทธิภาพมากขึ้น"
CZE_increase_military_aeronautical_institute_funding: "เพิ่มงบประมาณการบินทางทหาร"
CZE_increase_military_aeronautical_institute_funding_desc: "การสรางสิ่งอํานวยความสะดวกเพิ่มเติมใหสถาบันวิจัยและทดสอบอากาศยาน (VZLÚ) จะชวยใหเขาใจอากาศพลศาสตรไดดียิ่งขึ้น และพัฒนาการออกแบบอากาศยานของเราใหกาวหนาและประณีตยิ่งขึ้น"
CZE_air_training_abroad: "ฝกบินในตางประเทศ"
CZE_air_training_abroad_desc: "การสงผูรับการฝกไปยังกองทัพอากาศของชาติที่เปนมิตรกับเรา จะทําใหเราไดมุมมองอันหลากหลายและประสบการณตรงที่มีคาเมื่อพวกเขากลับมารับราชการ"
CZE_establish_air_defense_zones: "จัดตั้งเขตปองกันภัยทางอากาศ"
CZE_establish_air_defense_zones_desc: "เราสามารถจัดวางฐานปนตอสูอากาศยานใหมไวที่จุดสําคัญและโรงงาน และจัดตั้งเขตปองกันภัยทางอากาศผานศูนยสื่อสารระดับพื้นที่ เพื่อเพิ่มความแมนยําในการตอสูอากาศยานใหสูงสุด"
CZE_establish_air_defense_zones_enable_tt: "เปดใช §Yเขตปองกันภัยทางอากาศ§!"
CZE_establish_air_defense_zones_tt: "ตัวคูณโอกาสยิงถูกของปนตอสูอากาศยานประจําที่: §G+10%§!"
CZE_the_air_is_our_sea: "ทองฟาคือทะเลของเรา"
CZE_the_air_is_our_sea_desc: "ภายใตการฝกนักบินอยางเปนระบบ เราจะเสริมพลังใหนักบินบินอยางกลาหาญและมั่นใจ 'เราไมมีทั้งทาเรือริมมหาสมุทรและเรือเดินสมุทร ทองฟาคือทะเลของเรา'"
CZE_bring_kramer_and_lobel_under_state_control: "นํา Kramer & Löbl มาอยูใตการควบคุมของรัฐ"
CZE_bring_kramer_and_lobel_under_state_control_desc: "การโอน Kramer & Löbl เปนของรัฐจะชวยใหมั่นใจไดถึงการวิจัยอยางตอเนื่องและการสงมอบอุปกรณไฟฟาและอุปกรณวิทยุที่จําเปนไดทันเวลา"
CZE_second_to_none: "ไมเปนรองใคร"
CZE_second_to_none_desc: "แบบเครื่องบินของอุตสาหกรรมอากาศยานเราพัฒนาขึ้นทุกวัน ดวยการวิจัยเพิ่มเติม แบบของเราจะไมเปนรองใครในโลก!"
CZE_diversify_airframe_production: "กระจายการผลิตโครงเครื่องบิน"
CZE_diversify_airframe_production_desc: "เราไมอาจพึ่งพาเครื่องบินขับไลเพียงอยางเดียวในการปฏิบัติการทางอากาศ เรายังตองการอากาศยานประเภทอื่นและโครงเครื่องบินขนาดใหญเพื่อทําภารกิจประเภทอื่น ๆ"
CZE_projekt_l_52: "โครงการ L 52"
CZE_projekt_l_52_desc: "เทคโนโลยีเครื่องยนตไอพนคืออนาคตของอากาศยานทางทหาร แมตอนนี้เทคโนโลยียังไมสมบูรณนัก แตหากเราใชเวลาพัฒนาโครงการเฉพาะและออกแบบโครงเครื่องบินที่สรางขึ้นเพื่อการนี้โดยเฉพาะ เราจะนําหนาผูอื่นได"
CZE_fund_vladimir_mandl_research: "สนับสนุนงานวิจัยของวลาดีมีร มันเดิล"
CZE_fund_vladimir_mandl_research_desc: "ทนายความชื่อ $CZE_vladimir_mandl$ หลงใหลในแนวคิดเทคโนโลยีจรวด หากเรารวมมือกับเขาและจัดหาทรัพยากรที่เขาตองการเพื่อเปลี่ยนงานวิจัยใหเปนเทคโนโลยีที่ใชงานไดจริง เราจะไดประโยชนมหาศาลจากความรวมมือนี้"
CZE_mobilize_the_reserves: "ระดมกําลังสํารอง"
CZE_mobilize_the_reserves_desc: "ความตึงเครียดที่ชายแดนของเรากําลังเลวรายลง เราตองเรียกพลทหารกองหนุนและผูเชี่ยวชาญทางทหารที่คัดเลือกไวแลวตามบัตรระดมพลของเรา"
CZE_three_kings: "สามกษัตริย"
CZE_three_kings_desc: "การชวยเหลือกลุมตอตานของเราอยางเปนทางการจะเพิ่มความสามารถของพวกเขาในการสรางความเสียหายใหกองทัพขาศึกอยางมาก และยังอาจชวยกองทัพของเราในสนามรบดวย"
CZE_form_the_state_defense_guard: "กอตั้งกองกําลังพิทักษรัฐ"
CZE_form_the_state_defense_guard_desc: "การจัดตั้ง SOS จะทําใหเรามีองคกรที่เชี่ยวชาญการปกปองพรมแดนอันยาวไกลของเรา เนื่องจากสมาชิกกองกําลังไดรับการจัดระเบียบและฝกแบบทหาร พวกเขาจะเปนแนวปองกันดานแรกตอการรุกลํ้าชายแดนทุกรูปแบบ"
CZE_expand_the_horska_divisions: "ขยาย Horská Divize"
CZE_expand_the_horska_divisions_desc: "เนื่องจากประเทศของเราสวนใหญเปนเนินเขาเตี้ยและที่ราบสูง ทหารที่ไดรับการฝกพิเศษสําหรับการรบบนภูเขาจะมีความสําคัญยิ่งในภูมิประเทศที่ยากลําบากเหลานั้น"
CZE_develop_horska_artillery: "พัฒนา Horské Dělostřelectvo"
CZE_develop_horska_artillery_desc: "การดัดแปลงปนใหญปจจุบันใหมีนํ้าหนักเบาและถอดประกอบได จะทําใหกองทหารของเรามีอํานาจการยิงเพียงพอในภูมิประเทศภูเขาและเนินเขา"
CZE_develop_horska_artillery_tech_tt: "เปดใช §Yปนใหญ Horská§!\n§Yปนใหญ (ภูเขา)§!\n  การโจมตี: §G+10%§!\n  การเคลื่อนที่: §G+10%§!\n§Yปนใหญ (เนินเขา)§!\n  การโจมตี: §G+10%§!\n  การเคลื่อนที่: §G+10%§!"
CZE_bribery_investigations: "สอบสวนการติดสินบน"
CZE_bribery_investigations_desc: "เราไดรับจดหมายนิรนามเกี่ยวกับอาหารและการปฏิบัติตอทหาร หลักฐานบางสวนชี้ไปที่การประพฤติมิชอบของนายทหารฝายพลาธิการบางคน เราตองยุติเรื่องนี้กอนที่จะสรางความเสียหายตอกองทัพมากกวานี้"
CZE_bribery_investigations_remove_effect_tt: "จิตวิญญาณแหงชาตินี้จะถูกลบออกเมื่อแผนยุทธศาสตร '§Y$CZE_bribery_investigations$§!' สําเร็จ"
CZE_opl_exercises: "การฝก OPL"
CZE_opl_exercises_desc: "การฝกปองกันภัยทางอากาศ (OPL) จะชวยใหกองทัพของเราฝกการดําเนินกลยุทธดวยการประสานงานและการรักษากําลังที่ดีขึ้น สงผลใหการเคลื่อนพลและความปลอดภัยโดยรวมดีขึ้น"
CZE_rapid_response_divisions: "กองพลเคลื่อนที่เร็ว"
CZE_rapid_response_divisions_desc: "กองทัพตางชาติไดแสดงใหเห็นถึงผลกระทบของหนวยเคลื่อนที่ที่สามารถปรับตําแหนงไดเร็วกวาขาศึก ซึ่งชี้ใหเห็นถึงศักยภาพของมัน เราอาจจัดตั้งหนวยลักษณะเดียวกันเพื่อทดลองประเมินผล"
CZE_redouble_tank_development_efforts: "เรงพัฒนารถถังเปนสองเทา"
CZE_redouble_tank_development_efforts_desc: "แบบรถถังเบาในปจจุบันของเรายังพัฒนาไดอีกเมื่อเทียบกับของชาติอื่นในยุโรปที่ใชยานเกราะ เราตองเพิ่มความพยายามเปนทวีคูณเพื่อใหทัดเทียมพวกเขา"
CZE_rearmed_and_retooled: "ติดอาวุธใหม ปรับเครื่องมือใหม"
CZE_rearmed_and_retooled_desc: "แชสซีรถถังหนักในปจจุบันของเราแสดงใหเห็นถึงศักยภาพในการปรับปรุงใหทันสมัย เราควรสํารวจแนวทางนี้ตอไปเพื่อรองรับการขยายกองยานเกราะในอนาคต"
CZE_establish_the_fall_backlines: "จัดตั้งแนวถอยรน"
CZE_establish_the_fall_backlines_desc: "เราตองยอมรับความจริงวาแนวปองกันของเราจะแตกในบางจุด หากเกิดเหตุเชนนั้น การมีแนวถอยรนเตรียมไวพรอมจะเปนตัวชี้ขาดระหวางชัยชนะและความพายแพ"
CZE_establish_the_fall_backlines_masterful_delay_tactic_tt:0 "\nเปดใชยุทธวิธี: §Y$tactic_masterful_delay$§!"
CZE_anti_tank_development: "พัฒนาปนตอสูรถถัง"
CZE_anti_tank_development_desc: "เมื่อกองทัพตาง ๆ สงกองกําลังยานเกราะขนาดใหญขึ้นเรื่อย ๆ การปรับปรุงปนตอสูรถถังของเราจึงเปนสิ่งจําเปน ความสามารถในการจัดการรถถังดวยปนสนามคือตัวชี้ขาดระหวางการตรึงขาศึกไวกับการปลอยใหพวกมันฝาแนวมาได"
CZE_anti_tank_development_tech_tt: "เปดใช §Yการปรับปรุงตอสูรถถัง§!\n§Yปนใหญ§! การเจาะเกราะ: §G+5%§!\n§Yปนใหญสนับสนุน§! การเจาะเกราะ: §G+5%§!\n§Yตอสูรถถัง§! การเจาะเกราะ: §G+5%§!\n§Yตอสูรถถังสนับสนุน§! การเจาะเกราะ: §G+5%§!"
CZE_recon_in_force: "ลาดตระเวนดวยกําลัง"
CZE_recon_in_force_tech_tt: "เปดใช §Yลาดตระเวนดวยกําลัง§! \n§Yลาดตระเวน§!: HP: §G+5§!\nการลาดตระเวน: §G+10.0%§!"
CZE_recon_in_force_desc: "การใหหนวยลาดตระเวนปะทะขาศึกขณะหยั่งเชิงแนวปองกันเปนวิธีหาขาวกรองที่มีคายิ่ง"
CZE_integrate_fortification_engineers: "ผนวกวิศวกรปอมปราการ"
CZE_integrate_fortification_engineers_desc: "เมื่อวิศวกรปอมปราการของกองทัพไมไดสรางปอมปราการถาวร เราสามารถยายพวกเขาไปปฏิบัติหนาที่แนวหนาไดอยางรวดเร็วเพื่อปรับปรุงแนวปองกัน ซึ่งจะชวยใหกองกําลังแนวหนาสรางที่มั่นปองกันชั่วคราวที่ดีขึ้นสําหรับทหารของเรา"
CZE_integrate_fortification_engineers_tech_tt: "เปดใช §Yวิศวกรปอมปราการแบบผนวก§!\n§Yกองรอยทหารชาง§!:\nการขุดสนามเพลาะ §G+10.00%§!\n§Y(ปอม)§!\n การปองกัน §G+10.0%§!"
CZE_concealment_efforts: "ความพยายามดานการพราง"
CZE_concealment_efforts_desc: "การใชเครื่องบินโจมตีภาคพื้นดินและเครื่องบินลาดตระเวนอยางแพรหลาย ทําใหตาขายพรางและยุทธวิธีการพรางอื่น ๆ กลายเปนสิ่งจําเปน เราตองเพิ่มความพยายามใหทหารของเราพรางตัวไดดีในสนามรบ"
CZE_concealment_efforts_tech_tt: "เปดใช §Yตาขายพรางที่ปรับปรุงแลว§! \n§Yทหารราบเดินเทา (ปา)§!\n การปองกัน: §G+10%§!"
CZE_elevate_the_vsv: "ยกระดับวิทยาลัยการทัพ"
CZE_elevate_the_vsv_desc: "การเปนมันสมองของกองทัพเปนความรับผิดชอบอันใหญหลวงตอชาติและรัฐ ดังนั้นการรับราชการในกองเสนาธิการทหารจึงตองการนายทหารที่มีคุณสมบัติดีที่สุด ทั้งดานการฝกฝนวิชาชีพ ความนาเชื่อถือ การควบคุมตนเอง ไหวพริบ และอุปนิสัย"
CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
CZE_continue_with_snejdareks_plan_default: "ดําเนินตามแผนของชเนยดาเรก"
CZE_continue_with_snejdareks_plan_no_snejdareks: "ดําเนินแผนการปองกันแบบตั้งรับตอไป"
CZE_continue_with_snejdareks_plan_dynamic_desc: "เครือขายการปองกันที่มีประสิทธิภาพจะปองกันการเจาะแนวโดยไมคาดคิดของกองทหารขาศึก ทั้งยังใหการคุมครองและสรางฐานที่แข็งแกรงสําหรับการเปลี่ยนจากการตั้งรับเชิงยุทธศาสตรไปสูการรุก"
CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
CZE_go_with_vojcechovskys_plan_default: "เลือกแผนของลูชา"
CZE_go_with_vojcechovskys_plan_no_luza: "หลักนิยมการปองกันเชิงรุก"
CZE_go_with_vojcechovskys_plan_dynamic_desc: "ขอเสียของแนวปองกันแบบตั้งรับคือไมสามารถเคลื่อนยายได เมื่อถูกเจาะแลวก็ไมอาจใชเพื่อการรุกไดอีก เหลือเพียงซากที่ตั้งเดิมเทานั้น"
CZE_improve_the_current_officer_pool: "พัฒนากลุมนายทหารปจจุบัน"
CZE_improve_the_current_officer_pool_desc: "เราจะเลื่อนตําแหนงกําลังพลที่แสดงศักยภาพในการเปนกระดูกสันหลังของกองทัพ เพราะพวกเขามีความสําคัญยิ่งในบทบาทกํากับดูแลและประสานงานระหวางกองบัญชาการระดับสูงกับหนวยในพื้นที่"
CZE_elevate_slovak_officers: "ยกระดับนายทหารสโลวัก"
CZE_elevate_slovak_officers_desc: "เราจะมุงยกระดับชาวสโลวักเพื่อใหมีตัวแทนในกองทัพมากขึ้น ดวยการผอนปรนขอกําหนดบางประการสําหรับผูสมัครจากเขตสโลวัก เราคาดวากองทัพจะมีความเปนปกแผนมากขึ้นในอนาคต"
CZE_promote_moravec_writings: "เผยแพรงานเขียนของโมราเวตซ"
CZE_promote_moravec_writings_desc: "แมผลงาน 'ทหารกับกาลเวลา' และ 'การปองกันรัฐ' ของโมราเวตซจะกอใหเกิดปฏิกิริยาที่ขัดแยงกันอยางมาก แตงาน 'ความสําคัญทางทหารของรัฐเราในยุโรปกลาง' ที่เพิ่งตีพิมพก็ไดรับการพูดถึงในหนังสือพิมพรายวันทั่วยุโรป เราตองสนับสนุนใหเขาทํางานตอไปในฐานะผูเชี่ยวชาญที่ไมมีใครกังขาดานนโยบายการปองกันประเทศและประวัติศาสตรการทหาร"
CZE_lessons_of_war: "บทเรียนจากสงคราม"
CZE_lessons_of_war_desc: "เมื่อเรามีประสบการณการรบกับคูตอสูระดับเดียวกันแลว เราสามารถนําบทเรียนเหลานี้มาปรับปรุงกองบัญชาการระดับสูงของเรา ไมมีสิ่งใดทดแทนบทเรียนที่ไดจากการปะทะจริงกับกองทัพได"
CZE_lessons_of_war_i_had_war_with_major_flag: "เคยทําสงครามกับประเทศมหาอํานาจ"
CZE_for_the_homeland: "เพื่อมาตุภูมิ"
CZE_for_the_homeland_desc: "เมื่อกองทัพของเราเตรียมพรอมเต็มที่สําหรับความทาทายขางหนา เราก็กลาวไดอยางมั่นใจวาเราพรอมปกปองมาตุภูมิ เราพรอมสําหรับทุกภารกิจที่รออยูเบื้องหนา"
CZE_the_lions_roar: "เสียงคํารามของราชสีห"
CZE_the_lions_roar_desc: "สัญลักษณราชสีหแหงเชโกสโลวาเกียแทนคุณสมบัติที่ดีที่สุดของกองทัพเรา ความกลาหาญ พลัง และความเปนวีรบุรุษในระดับสูงสุด ทุกคนจะไดรูจักจิตวิญญาณที่ไมมีใครเทียบของกองทัพเรา"
CZE_diversify_our_specialists: "กระจายความเชี่ยวชาญของหนวยพิเศษ"
CZE_diversify_our_specialists_desc: "เราตองขยายความเชี่ยวชาญของหนวยพิเศษใหกวางกวาทหาร Horska สงครามไมไดเกิดขึ้นแคบนภูเขาและยอดเขาเทานั้น"
CZE_merge_the_financial_and_state_guard: "ควบรวมหนวยพิทักษการคลังกับหนวยพิทักษรัฐ"
CZE_merge_the_financial_and_state_guard_desc: "เมื่อมีการกอตั้งกองกําลังพิทักษรัฐแลว หนวยพิทักษการคลังก็ไมจําเปนอีกตอไป การควบรวมเขากับกองกําลังพิทักษรัฐจะชวยเพิ่มกําลังของ SOS ไดอยางรวดเร็ว"
CZE_merge_the_financial_and_state_guard_tt: "เปดใช §Yหนวยพิทักษการคลังแบบผนวก§! \n§Yสารวัตรทหาร§!: HP: §G+5§!"
CZE_logistics_beyond_the_sudetes: "การสงกําลังบํารุงเหนือเทือกเขาซูเดเทน"
CZE_logistics_beyond_the_sudetes_desc: "หากเราหวังจะปฏิบัติการรบนอกเทือกเขาซูเดเทน เราตองเรียนรูวาการสงกําลังบํารุงระยะไกลทํางานอยางไร ซึ่งแตกตางอยางมากจากการปฏิบัติการเฉพาะในพื้นที่บานเกิดของเรา"
CZE_logistics_beyond_the_sudetes_tt: "เปดใช §Yคลังเสบียงที่ปรับปรุงแลว§!\n§Yกองรอยสงกําลังบํารุง§!: การใชเสบียง: §G-10%§!"
CZE_expand_the_river_monitor_fleet: "ขยายกองเรือมอนิเตอรลํานํ้า"
CZE_expand_the_river_monitor_fleet_desc: "กองเรือมอนิเตอรลํานํ้าของเราเปนหนึ่งในกองเรือที่ใหญที่สุดในยุโรป และชวยกองทัพปองกันพื้นที่ภายในประเทศ การขยายกองเรือจะเพิ่มขีดความสามารถในภารกิจนี้อยางมาก"
CZE_the_tvp_project: "โครงการ TVP"
CZE_the_tvp_project_desc: "กองทัพของเราไดเสนอโครงการรถถังอเนกประสงค (TVP) เพื่อพัฒนาแบบรถถังภายในประเทศ ผูผลิตบางรายที่มีประสบการณมากมายในการผลิตรถถังไดแสดงความสนใจในโครงการของเรา"
CZE_expand_the_land_department_of_vtu: "ขยายแผนกภาคพื้นดินของ VTÚ"
CZE_expand_the_land_department_of_vtu_desc: "การขยายแผนกภาคพื้นดินของสถาบันเทคนิคทหาร (VTÚ) จะทําใหพวกเขามีเครื่องมือและสนามทดสอบเพิ่มเติม เพื่อเสริมงานวิจัยยุทโธปกรณในอนาคตของเรา"
CZE_department_two_expansion: "กรมที่สอง"
CZE_department_two_expansion_desc: "หนวยขาวกรองของเรา กรมที่ 2 ตองการทรัพยากรมากขึ้นเพื่อปกปองเราจากสายลับขาศึกไดดีขึ้น ซึ่งอาจนําไปสูการขยายฝายเฉพาะทางภายในหนวยงานดวย"
CZE_military_intelligence: "ฝายขาวกรองทางทหาร"
CZE_military_intelligence_desc: "ขาวกรองทางทหารเปนหนึ่งในดานที่สําคัญที่สุดของหนวยขาวกรอง การจัดสรรทรัพยากรใหดานนี้มากขึ้นจะใหประโยชนอยางมาก"
CZE_air_intelligence: "ฝายขาวกรองทางอากาศ"
CZE_air_intelligence_desc: "การรูจํานวนเครื่องบินของกองทัพอากาศขาศึกเปนองคประกอบสําคัญยิ่งในการชนะสงครามทางอากาศ ขอมูลที่แมนยําเกี่ยวกับกําลังทางอากาศของขาศึกคือกุญแจสําคัญเมื่อตองปะทะกับพวกเขาในพื้นที่"
CZE_within_the_eagles_nest: "ภายในรังอินทรี"
CZE_within_the_eagles_nest_desc: "การมีกองทัพสายขาวและผูกอวินาศกรรมอยูแคหนาประตูบานจะเปนขอไดเปรียบมหาศาลสําหรับกองทัพเรา ดวยความชวยเหลือจากกรมที่ 2 เครือขายสายลับของเราในพื้นที่เหลานี้จะขยายตัวไดอยางกวางขวาง"
CZE_restart_naval_gun_production: "เริ่มการผลิตปนเรืออีกครั้ง"
CZE_restart_naval_gun_production_desc: "โรงงาน Škoda เคยเปนผูออกแบบและผูผลิตปนเรือรายใหญที่สุดในจักรวรรดิออสเตรีย-ฮังการี การเริ่มผลิตอีกครั้งจะสรางโอกาสในการฟนฟูการผลิตดานนาวีในประเทศ"
CZE_restart_naval_gun_production_tt: "แผนยุทธศาสตรดานนาวี §Yลําดับความสําคัญ Škoda§! จะ §Yเริ่มทํางาน§!"
CZE_reform_the_naval_detachment: "ปฏิรูปกองเรือนอย"
CZE_reform_the_naval_detachment_desc: "กองเรือนอยเพิ่งถูกยุบไปเพราะเห็นวาเหมาะที่จะผนวกเขากับกองทัพบกมากกวา แตเหตุการณลาสุดทําใหการจัดตั้งขึ้นใหมกลายเปนสิ่งจําเปน"
CZE_build_2_dockyards_when_we_have_coast_tt: "จะสราง §Yอูตอเรือ§! §G2§! แหงทันทีใน §Yรัฐ§! ชายฝงแบบสุมเมื่อควบคุมได"
CZE_skoda_naval_yards: "อูตอเรือ Škoda"
CZE_skoda_naval_yards_desc: "เมื่อเราเขาถึงทะเลไดอีกครั้ง เราก็สามารถฟนอุตสาหกรรมนาวีเกาของจักรวรรดิออสเตรีย-ฮังการีขึ้นมาใหมได โดยอาศัยความเชี่ยวชาญที่ยังคงมีอยูภายในพรมแดนของเรา การทําใหอูตอเรือในประเทศเปดดําเนินการไดควรเปนความสําคัญสูงสุด"
CZE_build_3_dockyards_when_we_have_coast_tt: "จะสราง §Yอูตอเรือ§! §G3§! แหงทันทีใน §Yรัฐ§! ชายฝงแบบสุมเมื่อควบคุมได"
CZE_legacy_of_the_kriegsmarine: "มรดกแหง Kriegsmarine"
CZE_legacy_of_the_kriegsmarine_desc: "เราเคยชวยสรางเรือประจัญบานขนาดใหญเมื่อไมนานมานี้ ความสามารถในการทําเชนนั้นจึงเปนไปไดอยางยิ่ง มันอยูในมรดกของโรงงานเดียวกับที่เคยชวยสราง Kriegsmarine ของออสเตรีย-ฮังการี"
CZE_build_off_old_ganz_danubius_designs: "ตอยอดแบบเรือเกาของ Ganz Danubius"
CZE_build_off_old_ganz_danubius_designs_desc: "การนําแบบเรือของ Ganz Danubius กลับมาใชอาจเปนประโยชนในการสรางเรือชั้นเรือลาดตระเวนใหม ผูที่มีความรูเกี่ยวกับแบบเหลานี้ยังคงอาศัยอยูในพรมแดนของเรา"
CZE_modernize_trieste_designs: "ปรับปรุงแบบเรือ Trieste ใหทันสมัย"
CZE_modernize_trieste_designs_desc: "ดวยการใชแบบเรือเกาของกองทัพเรือออสเตรีย-ฮังการีสําหรับเรือประจัญบานขนาดเล็ก เราจะเขาใจวิธีสรางเรือชั้นนี้ไดดียิ่งขึ้น"
CZE_leverage_gunboat_experience: "ใชประโยชนจากประสบการณเรือปน"
CZE_leverage_gunboat_experience_desc: "ประสบการณการออกแบบเรือปนของเราสามารถนํามาใชสรางเรือพิฆาตได ฐานความเชี่ยวชาญที่มีอยูจะชวยเรงกระบวนการออกแบบ"
CZE_revive_kraljevica_designs: "ฟนฟูแบบเรือ Kraljevica"
CZE_revive_kraljevica_designs_desc: "ดวยความรูเรื่องเรือปนและการศึกษาแบบเรือเกาของ Kraljevica เราจะฟนฟูเรือพิฆาตชั้นนี้ขึ้นมาใหมเพื่อชาติของเรา"
CZE_wolfs_of_bohemia: "หมาปาแหงโบฮีเมีย"
CZE_wolfs_of_bohemia_desc: "ดวยประสบการณดานเรือดํานํ้าที่ยังคงมีอยูในพรมแดนของเรา การสรางฝูงหมาปาของเราเองก็ไมใชเรื่องยากนัก"
CZE_raider_lineage: "สายเลือดนักจูโจม"
CZE_raider_lineage_desc: "เรามีสายเลือดแหงการจูโจมสืบทอดจากอดีตนายทหารที่เคยประจําการในกองทัพเรือออสเตรีย-ฮังการี เราควรใชประโยชนจากประสบการณนั้น"
CZE_a_modern_navy: "กองทัพเรือสมัยใหม"
CZE_a_modern_navy_desc: "เมื่อเราพัฒนาเทคโนโลยีนาวีกาวหนาแลว ในที่สุดเราก็กลาวไดวาเรามีกองทัพเรือที่ทันสมัยและมีขีดความสามารถ"
CZE_build_1_dockyards_when_we_have_coast_tt: "จะสราง §Yอูตอเรือ§! §G1§! แหงทันทีใน §Yรัฐ§! ชายฝงแบบสุมเมื่อควบคุมได"
CZE_naval_aviation: "การบินนาวี"
CZE_naval_aviation_desc: "เรือบรรทุกเครื่องบินและอากาศยานประจําเรือดูจะเปนอนาคตของสงครามทางทะเล เราตองทุมเวลาใหกับการรบทางทะเลในดานใหมเหลานี้"
CZE_across_the_atlantic: "ขามแอตแลนติก"
CZE_across_the_atlantic_desc: "กองทัพเรือตองแผอํานาจขามมหาสมุทรไดจึงจะมีประสิทธิภาพ เราตองทําใหกองทัพเรือของเราเคลื่อนที่ในระยะไกลได"
CZE_joint_equipment_designs: "รวมออกแบบยุทโธปกรณ"
CZE_joint_equipment_designs_desc: "ทั้ง [ROOT.GetNameDef] และ [GER.GetNameDef] ตางอยูแถวหนาดานการออกแบบรถถังและเครื่องบิน โดยแตละฝายมีความเชี่ยวชาญเฉพาะของตน เราควรแบงปนขอมูลกันเพื่อใหตางฝายมุงเนนสิ่งที่ตนถนัดที่สุดตอไปได"
CZE_negotiate_sphere_of_influence: "เจรจาเขตอิทธิพล"
CZE_negotiate_sphere_of_influence_desc: "ปฏิเสธไมไดวาทรัพยากรทางทหารของ [ROOT.GetNameDef] มีคุณคายิ่งตอพันธมิตร[GER.GetAdjective] จึงเปนธรรมแลวที่เราจะขอดินแดนบางสวนเปนการตอบแทน"
CZE_set_up_polish_puppet_state: "ตั้งรัฐหุนเชิด[POL.GetAdjective]ตอนใต"
CZE_set_up_polish_puppet_state_desc: "ในเมื่อ [GER.GetNameDef] สนใจจะตั้งรัฐหุนเชิดในโปแลนด ก็ชัดเจนวาเราควรพิจารณาทําเชนเดียวกัน"
CZE_usurp_the_mantle: "ชวงชิงฐานันดร"
CZE_usurp_the_mantle_desc: "ดวยราชอาณาจักรของเราที่แผขยายจากทะเลบอลติกถึงทะเลเอเดรียติก และปกครองเหนือดินแดนออสเตรียซึ่งเปนมหาอํานาจประจําภูมิภาคในประวัติศาสตร บัดนี้เราสามารถประกาศตนเปนผูสืบทอดโดยชอบธรรมของจักรวรรดิโรมันอันศักดิ์สิทธิ์"
CZE_austro_hungary_puppets: "§Yรัฐในอารักขา§! ทุกรัฐที่เปนเปาหมายของเงื่อนไขแผนยุทธศาสตร"
CZE_decrease_autonomy_tier: "รัฐในอารักขาระดับ §Y$autonomy_dominion$§! หรือ §Y$autonomy_puppet$§! ทุกรัฐจะสูญเสียอํานาจปกครองตนเองหนึ่งระดับ"

#Exile Focus
CZE_prepare_for_exile: "เตรียมลี้ภัย"
CZE_prepare_for_exile_desc: "รัฐควรชวยเหลือผูนําทางการเมืองของเราอยางลับ ๆ ใหหลบหนีไปตางประเทศและจัดตั้งรัฐบาลพลัดถิ่น"
