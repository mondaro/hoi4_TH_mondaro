 faction_goal_west_subjugated_name: "พิชิตภาคตะวันตกใหอยูใตอํานาจ"
 faction_goal_west_subjugated_desc: "หากเราทุมเทความพยายามรวมกันในการผนวกรวมสวนนี้ของฝายเรา ขุนศึกที่เหลือจะเขาใจวาลมพัดไปทางใดและยอมเขาแถวตาม"
 faction_goal_south_subjugated_name: "พิชิตภาคใตใหอยูใตอํานาจ"
 faction_goal_south_subjugated_desc: "หากเราทุมเทความพยายามรวมกันในการผนวกรวมสวนนี้ของฝายเรา ขุนศึกที่เหลือจะเขาใจวาลมพัดไปทางใดและยอมเขาแถวตาม"
 faction_goal_no_japanese_in_china_name: "ขับไลผูรุกราน"
 faction_goal_no_japanese_in_china_desc: "ญี่ปุนกดขี่ประชาชนของเรามานานเกินไปแลว เราจะไมยอมใหพวกเขาอยูในจีนอีกตอไป"
 faction_goal_the_northern_mandate_name: "ควบคุมไซบีเรียตะวันออก"
 faction_goal_the_northern_mandate_desc: "หากประชาชนของเราจะเจริญรุงเรือง เราตองการดินแดนและทรัพยากรที่มีอยูในไซบีเรีย ผูควบคุมในปจจุบันไมสามารถใชประโยชนจากมันไดอยางเหมาะสม เราจึงมีสิทธิ์ในดินแดนนั้น"
 faction_goal_the_southern_mandate_name: "ควบคุมเอเชียตะวันออกเฉียงใต"
 faction_goal_the_southern_mandate_desc: "ในอดีตอันรุงโรจน เราเคยแผอิทธิพลไปยังดินแดนทางใต และเราจะทําเชนนั้นอีกครั้ง ดวยความมั่งคั่งที่มีอยูในภูมิภาคนั้น ไมมีสิ่งใดที่เราทําไมได"
 faction_goal_the_greater_game_name: "ควบคุมเอเชียกลาง"
 faction_goal_the_greater_game_desc: "จักรวรรดิตาง ๆ เคยพยายามบังคับเจตจํานงของตนเหนือเอเชียกลางแตก็ถูกขับไลกลับไป บัดนี้ถึงเวลาของเราที่จะรุกไปทางตะวันตกและขามทุงหญาสเตปปอีกครั้ง"
 suppress_asian_communism_goal_name: "ปราบปรามคอมมิวนิสตในเอเชีย"
 suppress_asian_communism_goal_desc: "คอมมิวนิสตเปนภัยคุกคามตอวิถีชีวิตดั้งเดิมและตอระเบียบตามธรรมชาติของสรรพสิ่ง เราตองรวมมือกันเพื่อเอาชนะคอมมิวนิสตไมวามันจะโผลหัวอันนาเกลียดออกมาที่ใด"
 strategic_resource_control_goal_name: "ควบคุมทรัพยากรยุทธศาสตร"
 strategic_resource_control_goal_desc: "ผูที่ควบคุมทรัพยากรยุทธศาสตรของโลกคือผูที่ควบคุมการเมืองของโลก"
 align_china_goal_name: "ทําใหจีนเขาขางเรา"
 align_china_goal_desc: "กลุมตาง ๆ ในจีนและภัยคุกคามที่พวกเขากอตองถูกควบคุม ทางออกที่ดีที่สุดสําหรับปญหานี้คือแทนที่พวกเขาดวยระบอบที่เปนมิตร"
 control_the_chinese_capitals_goal_name: "ควบคุมเมืองหลวงของจีน"
 control_the_chinese_capitals_goal_desc: "หากเราควบคุมเมืองหลวงทางประวัติศาสตรของจีนได การตอตานแผนการของเรายอมลดลงอยางแนนอน"
 war_on_communism_in_asia_goal_name: "ประกาศสงครามกับคอมมิวนิสตในเอเชีย"
 war_on_communism_in_asia_goal_desc: "มีเพียงหนทางเดียวที่จะเอาชนะคอมมิวนิสตไดอยางแทจริง นั่นคือดวยกําลังอาวุธ เราตองถอนรากถอนโคนคอมมิวนิสตทั่วทั้งเอเชียหากตองการปลอดภัยจากอิทธิพลของมัน"
 coastal_security_goal_name: "ควบคุมชายฝง"
 coastal_security_goal_desc: "เราควรทําใหมั่นใจวาเราควบคุมแนวชายฝงทั้งหมดของเอเชียตะวันออกและเอเชียตะวันออกเฉียงใตไดอยางเบ็ดเสร็จ ดวยวิธีนี้เราจะมั่นใจไดวานักลาอาณานิคมจักรวรรดินิยมตะวันตกจะไมอาจรักษาที่มั่นในภูมิภาคของเราได"
 secure_the_oil_supply_goal_name: "รักษาแหลงนํ้ามัน" 
 secure_the_oil_supply_goal_desc: "หากเราตองทําสงครามยืดเยื้อ เราตองหานํ้ามันใหเพียงพอเพื่อหลอเลี้ยงสงครามดวยทุกวิถีทาง"
 secure_the_oil_supply_tech_bonus: "โบนัสเปาหมายรักษาแหลงนํ้ามัน"
 protector_of_peace_goal_name: "ผูพิทักษสันติภาพ"
 protector_of_peace_goal_desc: "หนาที่ของเราไมใชการเขาไปพัวพันกับสงครามในยุโรปหรือที่อื่นใด แตเราควรพยายามธํารงสันติภาพ และสนับสนุนใหประเทศอื่น ๆ ยุติขอพิพาทอยางสันติและรวดเร็ว"
 african_domination_goal_name: "ครองความเปนใหญในแอฟริกา"
 african_domination_goal_desc: "เปาหมายสูงสุดของเราตองเปนการทําใหไมมีอิทธิพลตางชาติในแอฟริกาเสมอ ผูที่ไมไดอยูขางเราคือผูที่ตอตานเรา และตองถูกทําใหยอมจํานน"
 contain_japanese_expansion_asia_goal_name: "สกัดกั้นการขยายตัวของญี่ปุน"
 contain_japanese_expansion_asia_goal_desc: "เราตองทําทุกอยางเทาที่ทําไดเพื่อสกัดกั้นการขยายดินแดนของ[JAP.GetName]"
 pan_americanism_goal_name: "ลัทธิแพน-อเมริกัน"
 pan_americanism_goal_desc: "ทวีปอเมริกาทั้งหมดควรรวมเปนหนึ่งเดียว ดวยการดึงทุกฝายมารวม เราจะสามารถรักษาภูมิภาคของเราและสรางแนวรวมหนึ่งเดียวตอตานกองกําลังภายนอกใด ๆ"

 amerindian_liberation_goal_name: "การปลดปลอยชนพื้นเมืองอเมริกัน"
 amerindian_liberation_goal_desc: "ชนพื้นเมืองดั้งเดิมแหงทวีปอเมริกาตองไดรับการปลดปลอยจากผูกดขี่ตางชาติที่ปกครองพวกเขาอยูในปจจุบัน"
 islamic_brotherhood_goal_name: "ภราดรภาพอิสลาม"
 islamic_brotherhood_goal_desc: "ชาติอิสลามทั่วโลกตองรวมตัวกันเพื่อยืนหยัดตอตานผูที่ปรารถนาจะเห็นเราถูกพิชิตและกดขี่"

 baltic_security_goal_name: "ปกปองบอลติก"
 baltic_security_goal_desc: "เพื่อรักษาอนาคตของพลเมืองและพลเรือนของเรา เราตองปกปองภูมิภาคบอลติกดวยทุกสิ่งที่เรามี มีเพียงการรักษาภูมิภาคนี้ไวใตการควบคุมของเราเทานั้นที่ประชาชนของที่นี่จะเจริญรุงเรืองได"

 nordic_defence_goal_name: "ปองกันกลุมนอรดิก"
 nordic_defence_goal_desc: "เพื่อรักษาอนาคตของพลเมืองและพลเรือนของเรา เราตองปกปองภูมิภาคนอรดิกดวยทุกสิ่งที่เรามี มีเพียงการกันจักรวรรดิที่ขมเหงออกไปเทานั้นที่เราจะเจริญรุงเรืองได"

 european_dominance_goal_name: "สถาปนาความเปนใหญในยุโรป"
