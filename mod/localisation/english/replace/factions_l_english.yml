 control_baku_oil_fields_goal_desc: "การยึดครองภูมิภาคนํ้ามันบากูจะทําใหเขาถึงแหลงสํารองปโตรเลียมมหาศาลซึ่งมีความสําคัญยิ่งตอปฏิบัติการทางทหาร"
 control_iraqi_oil_goal_name: "ควบคุมนํ้ามันอิรัก"
 control_iraqi_oil_goal_desc: "กําลังการผลิตนํ้ามันของอิรักอาจเปนกุญแจสําคัญในการตอบสนองความตองการเชื้อเพลิงของกองทัพเรา"
 control_persian_oil_goal_name: "ควบคุมนํ้ามันเปอรเซีย"
 control_persian_oil_goal_desc: "การควบคุมบอนํ้ามันและกําลังการกลั่นของเปอรเซียจะรับประกันการไหลเวียนของเชื้อเพลิงอยางตอเนื่องสําหรับความตองการทางปฏิบัติการ"
 control_chinese_metals_goal_name: "ควบคุมแรโลหะจีน"
 control_chinese_metals_goal_desc: "ความมั่งคั่งดานโลหะสําคัญหลากหลายชนิดของจีนสามารถปอนทรัพยากรที่ฐานอุตสาหกรรมทหารของพันธมิตรตองการได"
 control_malayan_riches_goal_name: "ควบคุมความมั่งคั่งของมลายา"
 control_malayan_riches_goal_desc: "การควบคุมทรัพยากรทังสเตนและยางของมลายาจะเสริมฐานวัตถุดิบของพันธมิตรอยางมาก รับประกันปจจัยสําคัญสําหรับการผลิตและการสงกําลังบํารุงทางทหาร"
 control_indonesian_riches_goal_name: "ควบคุมความมั่งคั่งของอินโดนีเซีย"
 control_indonesian_riches_goal_desc: "ความมั่งคั่งทางธรรมชาติอันหลากหลายของอินโดนีเซีย ทั้งนํ้ามัน ยาง และแรธาตุ มีคามหาศาลในการสนับสนุนฐานอุตสาหกรรมของเราและรับประกันการพึ่งพาตนเองดานทรัพยากรของพันธมิตร"
 control_newfoundland_bases_goal_name: "ควบคุมฐานทัพนิวฟนดแลนด"
 control_newfoundland_bases_goal_desc: "การยึดฐานทัพในนิวฟนดแลนดจะทําใหเราควบคุมขบวนเรือลําเลียงในแอตแลนติกเหนือ และแผอํานาจทางอากาศและทางทะเลไปทั่วเสนทางเดินเรือสําคัญ"
 control_bermuda_goal_name: "ควบคุมเบอรมิวดา"
 control_bermuda_goal_desc: "ฐานทัพในเบอรมิวดาจะทําใหเราลาดตระเวนแอตแลนติกตอนกลางไดอยางมีประสิทธิภาพยิ่งขึ้น และรักษาเสนทางเสบียงระหวางทวีปใหปลอดภัยยิ่งขึ้น"
 control_bahamas_bases_goal_name: "ควบคุมฐานทัพบาฮามาส"
 control_bahamas_bases_goal_desc: "การครอบครองฐานทัพในบาฮามาสจะชวยใหเฝาติดตามเสนทางเดินเรือในทะเลแคริบเบียนไดมีประสิทธิภาพยิ่งขึ้น และปกปองเสนทางทางทะเลเขาสูอเมริกาเหนือและอเมริกาใต"
 control_panama_canal_goal_name: "ควบคุมคลองปานามา"
 control_panama_canal_goal_desc: "การควบคุมคลองปานามามีความสําคัญยิ่งตอการเคลื่อนยายกองเรืออยางรวดเร็วระหวางแอตแลนติกและแปซิฟก รับประกันความยืดหยุนทางยุทธศาสตรในมหาสมุทรทั้งสอง"
 control_trinidad_goal_name: "ควบคุมตรินิแดด"
 control_trinidad_goal_desc: "ที่ตั้งสําคัญของตรินิแดดทําใหเกาะนี้จําเปนยิ่งตอการควบคุมแหลงนํ้ามันในทะเลแคริบเบียน และสามารถใชเปนจุดตั้งตนทางยุทธศาสตรบนชายฝงทางเหนือของอเมริกาใต"
 control_azores_goal_name: "ควบคุมอะโซรส"
 control_azores_goal_desc: "ที่ตั้งทางยุทธศาสตรของอะโซรสชวยขยายพิสัยไปทั่วแอตแลนติกตอนกลาง ปดชองวางทั้งดานปฏิบัติการเรือดํานํ้าและการตอตานเรือดํานํ้า และรับประกันการคุมกันทางอากาศแกขบวนเรือลําเลียงอยางตอเนื่อง"
 control_iceland_goal_name: "ควบคุมไอซแลนด"
 control_iceland_goal_desc: "การควบคุมฐานทัพในไอซแลนดจะชวยใหยึดชองแคบเดนมารกและแผอิทธิพลเหนือเสนทางแอตแลนติกเหนือได"
 control_faroe_islands_goal_name: "ควบคุมหมูเกาะแฟโร"
 control_faroe_islands_goal_desc: "หมูเกาะแฟโรตั้งอยูในทําเลทางยุทธศาสตรที่ชวยใหควบคุมเสนทางเดินเรือทางเหนือ และสนับสนุนปฏิบัติการทางเรือสูบริเตน สแกนดิเนเวีย และอารกติก"
 control_narvik_goal_name: "ควบคุมนารวิก"
 control_narvik_goal_desc: "การยึดนารวิกจะชวยรักษาการเขาถึงการขนสงสินแรเหล็กอันสําคัญยิ่ง และควบคุมเสนทางเสบียงในอารกติก"
 control_danish_belts_goal_name: "ควบคุมชองแคบเดนมารก"
 control_danish_belts_goal_desc: "การตั้งกองรักษาการณที่คัตเตอกัตจะทําใหเราควบคุมเสนทางเดินเรือระหวางทะเลบอลติกและทะเลเหนือแตเพียงผูเดียว"
 control_brittany_bases_goal_name: "ควบคุมฐานทัพบริตทานี"
 control_brittany_bases_goal_desc: "ฐานทัพทางยุทธศาสตรตามแนวชายฝงบริตทานีจะชวยขยายพิสัยปฏิบัติการเรือดํานํ้าและทางอากาศเขาสูแอตแลนติก รวมถึงรักษาเสนทางเขาสูแผนดินใหญยุโรป"
 control_gibraltar_goal_name: "ควบคุมยิบรอลตาร"
 control_gibraltar_goal_desc: "ฐานทัพทางยุทธศาสตรบนชองแคบยิบรอลตารจะทําใหเราควบคุมการสัญจรทางทะเลระหวางทะเลเมดิเตอรเรเนียนและแอตแลนติก"
 control_malta_goal_name: "ควบคุมมอลตา"
 control_malta_goal_desc: "การครอบครองมอลตาจะชวยใหตัดเสนทางเสบียงของขาศึกและแผอํานาจไปทั่วเมดิเตอรเรเนียนตอนกลาง"
 control_crete_goal_name: "ควบคุมครีต"
 control_crete_goal_desc: "การควบคุมเกาะครีตจะชวยใหครองเมดิเตอรเรเนียนตะวันออก และเอื้อตอปฏิบัติการในทะเลอีเจียนและแอฟริกาเหนือ"
 control_cyprus_goal_name: "ควบคุมไซปรัส"
 control_cyprus_goal_desc: "การควบคุมไซปรัสจะชวยสนับสนุนปฏิบัติการในเมดิเตอรเรเนียนตะวันออก และรักษาเสนทางบินสําคัญเขาออกตะวันออกกลาง"
 control_bosporus_goal_name: "ควบคุมชองแคบบอสพอรัส"
 control_bosporus_goal_desc: "การยึดชองแคบบอสพอรัสจะทําใหเราควบคุมเสนทางเดินเรือทั้งหมดระหวางทะเลดํากับทะเลเมดิเตอรเรเนียน"
 control_dardanelles_goal_name: "ควบคุมชองแคบดารดะเนลส"
 control_dardanelles_goal_desc: "การยึดครองชองแคบดารดะเนลสจะทําใหเรากําหนดการเคลื่อนไหวของกองเรือและการคาจากทะเลดําได"
 control_suez_canal_goal_name: "ควบคุมคลองสุเอซ"
 control_suez_canal_goal_desc: "การครอบครองคลองสุเอซอันสําคัญยิ่งจะทําใหเราควบคุมเสนทางคมนาคมหลักระหวางยุโรปและเอเชียแตเพียงผูเดียว รับประกันการเคลื่อนยายกําลังและทรัพยากรอยางรวดเร็ว"
 control_gulf_of_aden_bases_goal_name: "ควบคุมฐานทัพอาวเอเดน"
 control_gulf_of_aden_bases_goal_desc: "ฐานทัพทางยุทธศาสตรตามแนวอาวเอเดนชวยปกปองเสนทางเขาสูทะเลแดง และรักษาเสนทางเดินเรือที่เชื่อมยุโรป แอฟริกา และเอเชีย"
 control_strait_of_hormuz_goal_name: "ควบคุมชองแคบฮอรมุซ"
 control_strait_of_hormuz_goal_desc: "ฐานทัพทางยุทธศาสตรบนชองแคบฮอรมุซจะทําใหเราควบคุมการเขาถึงนํ้ามันอันสําคัญยิ่งของเปอรเซียและอิรักได"
 control_ceylon_goal_name: "ควบคุมซีลอน"
 control_ceylon_goal_desc: "การยึดซีลอนจะชวยใหครองมหาสมุทรอินเดีย และปกปองเสนทางเดินเรือสําคัญระหวางตะวันออกกลางและเอเชียตะวันออกเฉียงใต"
 control_singapore_goal_name: "ควบคุมสิงคโปร"
 control_singapore_goal_desc: "ฐานทัพเรือที่มีปอมปราการอันยิ่งใหญแหงสิงคโปรควบคุมชองแคบมะละกาและการสัญจรระหวางมหาสมุทรอินเดียและแปซิฟก มันควรเปนของเรา"
 control_manila_goal_name: "ควบคุมมะนิลา"
 control_manila_goal_desc: "การครอบครองอาวมะนิลาซึ่งปองกันไดงายจะชวยใหแผอํานาจไปทั่วแปซิฟกตะวันตก และรักษาเสนทางเขาถึงหมูเกาะอินเดียตะวันออกและทะเลจีนใต"
 control_okinawa_goal_name: "ควบคุมโอกินาวา"
 control_okinawa_goal_desc: "การควบคุมโอกินาวาจะทําใหสามารถเปดปฏิบัติการตอเกาะหลักของญี่ปุน และสรางแนวปองกันที่แข็งแกรงในแปซิฟก"
 control_iwo_jima_goal_name: "ควบคุมอิโวจิมะ"
 control_iwo_jima_goal_desc: "การยึดอิโวจิมะจะชวยสนับสนุนปฏิบัติการทางอากาศพิสัยไกลเหนือญี่ปุน และขยายพิสัยของเราเขาสูแปซิฟกตอนกลาง"
 control_caroline_islands_goal_name: "ควบคุมหมูเกาะแคโรไลน"
 control_caroline_islands_goal_desc: "การครองหมูเกาะแคโรไลนและอะทอลลทรุกจะเอื้อตอการรบทางทะเลและทางอากาศอยางตอเนื่องทั่วแปซิฟกตอนกลาง"
 control_guadalcanal_goal_name: "ควบคุมกัวดัลคะแนล"
 control_guadalcanal_goal_desc: "การยึดกัวดัลคะแนลจะทําใหเราควบคุมปฏิบัติการทางทะเลในแปซิฟกใต รวมถึงเสนทางเขาออกออสเตรเลียได"
 control_wake_island_goal_name: "ควบคุมเกาะเวก"
 control_wake_island_goal_desc: "การยึดครองเกาะเวกจะทําใหขยายการลาดตระเวนและการคุมกันทางอากาศไปทั่วเสนทางในแปซิฟกตอนกลางได"
 control_midway_island_goal_name: "ควบคุมเกาะมิดเวย"
 control_midway_island_goal_desc: "การควบคุมมิดเวยจะชวยรักษาความปลอดภัยของเสนทางเขาสูแปซิฟกตอนกลาง และเปนฐานสําคัญสําหรับปฏิบัติการขามมหาสมุทร"
 control_hawaii_goal_name: "ควบคุมฮาวาย"
 control_hawaii_goal_desc: "การยึดเพิรลฮารเบอรจะทําใหเราใชเปนหลักยึดของปฏิบัติการในแปซิฟก และประสานการสงกําลังบํารุงทั่วทั้งเขตสงครามมหาสมุทร รวมถึงเปดทางเขาสูชายฝงแปซิฟกของอเมริกา"
 control_attu_island_goal_name: "ควบคุมเกาะแอตทู"
 control_attu_island_goal_desc: "การยึดเกาะแอตทูจะชวยใหควบคุมเสนทางเดินเรือในแปซิฟกเหนือ และเปดทางปฏิบัติการตามหมูเกาะอะลูเชียนมุงสูอะแลสกาและชายฝงแปซิฟกของอเมริกา"
 undo_versailles_goal_name: "ลางแคนสนธิสัญญาแวรซาย"
 undo_versailles_goal_desc: "ถึงเวลาแลวที่เราจะลบลางความอัปยศของ 'คําบัญชา' นี้ เราจะยึดดินแดนอันชอบธรรมของเราคืนมา!"
 
 # Long term goals
 strategic_bombing_campaign_goal_name: "การทิ้งระเบิดทางยุทธศาสตรอยางตอเนื่อง"
 strategic_bombing_campaign_goal_desc: "การทิ้งระเบิดทางยุทธศาสตรขนาดใหญจะบั่นทอนขีดความสามารถทางอุตสาหกรรมของขาศึกอยางเปนระบบ ทําใหเราบดขยี้กําลังของพวกเขาใหออนลาลงได"
 liberate_territory_goal_name: "ปลดปลอยดินแดนของเรา"
