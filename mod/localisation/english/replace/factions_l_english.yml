 defense_of_democracy_goal_desc: "ประชาธิปไตยกําลังถูกคุกคาม เราตองรวมมือกันเพื่อไมใหประเทศประชาธิปไตยทั่วโลกลมสลายไปทีละประเทศ"
 containment_of_communism_goal_name: "ปดลอมคอมมิวนิสตโลก"
 containment_of_communism_goal_desc: "โลกจะไมปลอดภัยจนกวาภัยคุกคามคอมมิวนิสตจะถูกปราบปรามลง"
 suppress_regional_fascism_goal_name: "ปราบปรามฟาสซิสต"
 suppress_regional_fascism_goal_desc: "ลัทธิฟาสซิสตกําลังคุกคามที่จะลุกลามดั่งไฟปา ยิ่งมีประเทศตกอยูในกรงเล็บของมันมากเทาไร สถานการณรอบตัวเราก็ยิ่งอันตรายมากขึ้นเทานั้น"
 suppress_regional_communism_goal_name: "ปราบปรามคอมมิวนิสตใน[ROOT.GetCountryContinent]"
 suppress_regional_communism_goal_desc: "เราตองทําทุกวิถีทางเพื่อรักษา[ROOT.GetCountryContinent]ใหพนจากแอกของคอมมิวนิสตใหมากที่สุด"
 regional_expansionism_goal_name: "ขยายอํานาจใน[ROOT.GetCountryContinent]"
 regional_expansionism_goal_desc: "ฝายของเราควรเปนผูนําและครองความเปนใหญใน[ROOT.GetCountryContinent]"
 suppress_regional_democracy_goal_name: "ปราบปรามประชาธิปไตย"
 suppress_regional_democracy_goal_desc: "ประเทศที่เรียกตนเองวาประชาธิปไตยคือภัยคุกคามที่ใหญที่สุดตออุดมการณของเรา เราตองทําใหแนใจวาพวกเขาควบคุม[ROOT.GetCountryContinent]ไดเพียงสวนนอยเทานั้น"
 between_the_seas_goal_name: "ระหวางทะเล"
 between_the_seas_goal_desc: "ดวยการสรางกําแพงดินแดนพันธมิตรที่แข็งแกรงตั้งแตทะเลดําจรดทะเลบอลติก เราจะสามารถตานทานภัยคุกคามใด ๆ ได"
 little_entente_goal_name: "บังคับใชสนธิสัญญาสันติภาพปารีส"
 little_entente_goal_desc: "สนธิสัญญาสันติภาพปารีสไดกําหนดพรมแดนของ[GER.GetName], [HUN.GetName], [BUL.GetName] และ[AUS.GetName] เปาหมายหลักของเราคือทําใหมั่นใจวาประเทศเหลานี้จะไมเริ่มผนวกดินแดนชายแดนและทําลายสันติภาพในยุโรปอีกครั้ง"
 china_territorial_integrity_goal_name: "บูรณภาพแหงดินแดน"
 china_territorial_integrity_goal_desc: "จีนควรไดรับการปลดปลอยและรวมเปนหนึ่งภายใตพรรคปกครองเดียว ดวยการยึดดินแดนของเราคืนจากศัตรูทั้งภายนอกและภายในเทานั้น เราจึงจะฟนฟูจีนสูความรุงโรจนได"
 china_chinese_consolidation_goal_name: "การรวมจีนใหมั่นคง"

 china_wang_front_expansion_name: "ชัยชนะเหนือจักรวรรดินิยม"
 china_wang_front_expansion_desc: "ถึงเวลาแลวที่จะตอตานอิทธิพลของมหาอํานาจอาณานิคมเหนือเอเชียตะวันออก เราตองสรางกลุมอํานาจของเราเองในภูมิภาค เพื่อที่เราจะไมถูกครอบงําอีกตอไป"
 china_asian_democratic_union_name: "$china_wang_front_expansion_name$"
 china_asian_democratic_union_desc: "$china_wang_front_expansion_desc$"
 strength_in_unity_goal_name: "สามัคคีคือพลัง"
 strength_in_unity_goal_desc: "ประเทศในมุมโลกของเราควรยืนหยัดรวมกัน ดวยการสรางฝายที่แข็งแกรง เราจะมีโอกาสดีที่สุดในการรักษาเอกราชและความเปนกลาง"
 conquest_of_territory_goal_name: "พิชิตและครอบงํา"
 conquest_of_territory_goal_desc: "ในโลกที่เปนปรปกษ การขยายอํานาจคือสิ่งจําเปนตอการอยูรอด การขยายอํานาจสรางเขตกันชนและเปดทางใหเราเขาถึงทรัพยากรไดมากขึ้น"
 spread_of_communism_goal_name: "การปฏิวัติโลก"
 spread_of_communism_goal_desc: "ถึงเวลาแลวที่มวลชนจะลุกขึ้น และที่ใดที่มวลชนไมอาจลุกขึ้นได เราตองชวยพวกเขาดวยกําลังอาวุธ"

 control_of_the_balkans_goal_name: "ความมั่นคงแหงบอลขาน"
 control_of_the_balkans_goal_desc: "มหาอํานาจภายนอกพยายามแผอิทธิพลเขาสูบอลขานมาโดยตลอด เราตองยืนหยัดรวมกันอยางแข็งแกรงและตอตานการรุกลํ้าจากตางชาติใด ๆ ในภูมิภาค"

 african_decolonization_goal_name: "การปลดแอกอาณานิคมแอฟริกา"
 african_decolonization_goal_desc: "ถึงเวลาแลวที่แอฟริกาจะลุกขึ้นตอตานศัตรูและผูกดขี่ เราตองปลดปลอยทวีปนี้ ดวยกําลังหากจําเปน!"

 habsburg_hegemony_goal_name: "ความเปนเจาแหงฮาพสบวรค"
 habsburg_hegemony_goal_desc: "ครอบครัวคือสวนสําคัญที่สุดของการรวมตัวใด ๆ และพันธมิตรของเราก็ไมตางกัน เราตองครองมงกุฎแหงยุโรปและแผอิทธิพลไปทั่ว"

 indifference_is_a_threat_goal_name: "ความเฉยเมยคือภัยคุกคาม"
 indifference_is_a_threat_goal_desc: "เมื่อความขัดแยงครั้งใหญในยุโรปแทบจะหลีกเลี่ยงไมได เราตองแนใจวาจะไมมีเรื่องเหนือความคาดหมาย ประเทศใดที่ปฏิเสธจะเลือกขางตองถูกกําจัด"

 security_through_expansion_goal_name: "ความมั่นคงผานการขยายอํานาจ"
 security_through_expansion_goal_desc: "เราตองสรางโลรอบดินแดนของเราและสรางวงลอมรัฐรอบพรมแดนปจจุบัน"

 an_iron_curtain_goal_name: "มานเหล็ก"
 an_iron_curtain_goal_name_desc: "เพื่อปกปองมาตุภูมิไดดียิ่งขึ้น เราตองสรางมานแหงรัฐหุนเชิดรอบตัวเราเพื่อกันผูมาเยือนที่ไมพึงประสงคออกไป"
 eastern_european_security_goal_name: "ความมั่นคงแหงยุโรปตะวันออก"
 eastern_european_security_goal_desc: "เพื่อปกปองผลประโยชนของเราในยุโรปตะวันออกไดดียิ่งขึ้น เราตองเขาแทรกแซงและตั้งระบอบที่มีแนวคิดเดียวกันทางตะวันตกของเรา"

 mare_nostrum_goal_name: "Mare Nostrum"
 mare_nostrum_goal_desc: "การเปลี่ยนเมดิเตอรเรเนียนใหเปนทะเลในของเราเองเปนความฝนของประชาชนเรามาโดยตลอด ถึงเวลาแลวที่จะทําใหความฝนนั้นเปนจริง!"

 pax_romana_goal_name: "Pax Romana"
 pax_romana_goal_desc: "การฟนฟูความรุงโรจนของจักรวรรดิโรมันเปนความฝนของประชาชนเรามาโดยตลอด ถึงเวลาแลวที่จะทําใหความฝนนั้นเปนจริง!"

 ## Short term Goals
 building_up_guam_goal_name: "ขยายฐานทัพเรือกวม"
 building_up_guam_goal_desc: "เราตองรักษาเสนทางเชื่อมตอกับ[PHI.GetNameDef]ไวในกรณีที่เกิดความขัดแยงกับ[JAP.GetName] นอกจากนี้ การมีจุดเตรียมพลที่ใกลขึ้นสําหรับกองทัพเรือของเราจะเปนประโยชนอยางยิ่งหากเราตองทําสงครามกับฝาย[JAP.GetAdjective] [638.GetName]เหมาะสมอยางยิ่ง"
 the_two_seas_goal_name: "สถาปนาการปรากฏตัวในทะเลบอลติกและทะเลดํา"
 the_two_seas_goal_desc: "เราควรทําใหมั่นใจวามีกําลังทางเรือที่แข็งแกรงทั้งในทะเลบอลติกและทะเลดํา"
 one_germany_goal_name: "รวมรัฐเยอรมัน"
 one_germany_goal_desc: "เพื่อสรางฐานอํานาจที่แข็งแกรงและเปนหนึ่งเดียว เราตองทําใหเยอรมนีแข็งแกรงและเปนปกแผนกอน สนธิสัญญาสันติภาพปารีสหามการรวมชาติเยอรมัน บัดนี้ถึงเวลาพิสูจนแลววาเราไมถูกผูกมัดดวยสนธิสัญญาไรประโยชน"
 guardians_of_peace_goal_name: "ธํารงสันติภาพโลก"
 guardians_of_peace_goal_desc: "เมฆพายุกําลังกอตัวที่ขอบฟา เราตองปองกันไมใหสงครามปะทุขึ้นเร็วเกินไป เพื่อใหพันธมิตรของเรามีเวลาเตรียมพรอมอยางเหมาะสมสําหรับความขัดแยงที่หลีกเลี่ยงไมได"
 growing_the_faction: "ขยายฝาย"
 growing_the_faction_desc: "ฝายของเราตองมีสมาชิกมากขึ้นหากตองการเปนที่ยอมรับบนเวทีภูมิรัฐศาสตร"
 a_large_faction_goal_name: "เชิญประเทศอื่นเขารวมฝายของเรามากขึ้น"
 a_large_faction_goal_desc: "ดวยการเติบโตใหใหญยิ่งขึ้น ฝายของเราจะสามารถแผอิทธิพลไดไกลยิ่งขึ้น"
 preemptive_strike_on_fascism_goal_name: "เปดฉากโจมตีชิงลงมือกอนตอประเทศฟาสซิสต"
 preemptive_strike_on_fascism_goal_desc: "เราไมควรรอใหพวกเขาโจมตีเรา เราตองเปนฝายกุมความริเริ่ม"
 a_great_fortress_goal_name: "สรางปอมปราการที่แข็งแกรงขึ้น"
 a_great_fortress_goal_desc: "ความพรอมคือหัวใจสําคัญ ดวยการรักษาพื้นที่ชายแดนและจุดสําคัญดวยปอมปราการที่ทันสมัยที่สุด เราจะมั่นใจไดวาขาศึกไมอาจเอาชนะเราได"
 aggressive_defense_goal_name: "สรางความเสียหายแกผูรุกราน"
 aggressive_defense_goal_desc: "เราจะไมยอมเสียแผนดินใหขาศึกแมแตนิ้วเดียว ทหารของเราตองเขาใจวาหัวใจสําคัญไมใชการตายเพื่อชาติของเรา แตคือการทําใหขาศึกตายเพื่อชาติของพวกมัน"
 war_on_communism_goal_name: "ประกาศสงครามกับคอมมิวนิสต"
 war_on_communism_goal_desc: "เราตองหยุดยั้งการแพรกระจายของคอมมิวนิสตดวยทุกวิถีทาง"
 war_on_democracy_goal_name: "ประกาศสงครามกับประชาธิปไตย"
 war_on_democracy_goal_desc: "เราตองโจมตีศัตรูทางอุดมการณของเรา"
 defeat_of_communism_goal_name: "เอาชนะคอมมิวนิสต"
 defeat_of_communism_goal_desc: "เพื่อเอาชนะคอมมิวนิสตโลก เราตองเริ่มจากบานของเราเองดวยการกําจัดคอมมิวนิสตในภูมิภาคของเรา"
 defeat_of_fascism_goal_name: "เอาชนะฟาสซิสต"
 defeat_of_fascism_goal_desc: "เพื่อหยุดยั้งการแพรกระจายของฟาสซิสตใหสิ้นซาก เราตองเริ่มจากบานของเราเองดวยการกําจัดฟาสซิสตในภูมิภาคของเรา"
 defeat_of_anti_communists_goal_name: "เอาชนะพวกตอตานการปฏิวัติ"
 defeat_of_anti_communists_goal_desc: "กาวแรกสูการปฏิวัติโลกคือการเปลี่ยนมหาอํานาจระดับภูมิภาคที่ตอตานเรื่องนี้ใหสําเร็จ ดังนั้นเราตองกําจัดภัยคุกคามในทวีปของเราเองกอนเปนอันดับแรก"
 defeat_of_anti_fascists_goal_name: "เผยแพรฟาสซิสตในทวีป"
 defeat_of_anti_fascists_goal_desc: "เราตองมุงทําลายรัฐบาลตอตานฟาสซิสตในทวีปของเรา"
 defeating_our_enemies_goal_name: "ชนะสงคราม"
 defeating_our_enemies_goal_desc: "ยุคสมัยนี้ไมแนนอนและสงครามเปนสิ่งที่หลีกเลี่ยงไมได ไมวาสงครามจะมาในรูปแบบใด เราตองแนใจวาเราจะอยูฝายผูชนะ"
 is_victor_in_pc_tt: "อยูฝายผูชนะในการประชุมสันติภาพ"
 a_military_base_goal_name: "ขยายอุตสาหกรรมการทหาร"
 a_military_base_goal_desc: "สงครามครูเสดตอตานคอมมิวนิสตตองการอาวุธ เพื่อผลิตอาวุธในปริมาณมาก เราตองมีอุตสาหกรรมการทหารที่แข็งแกรง"
 a_military_base_tech_bonus: "โบนัสเปาหมาย $a_military_base_goal_name$"
 resource_control_goal_name: "รักษาทรัพยากรยุทธศาสตร"
 resource_control_goal_desc: "ฝายตองทําใหมั่นใจวามีทรัพยากรที่จําเปนในการรับมือภัยคุกคามใด ๆ ในโลก"
 secure_european_continent_goal_name: "สถาปนาปอมปราการยุโรป"
 secure_european_continent_goal_desc: "เราตองทําใหทวีปยุโรปเขาขางอุดมการณของเรา [faction.GetName]ควรครองอํานาจสูงสุดในยุโรป"
 secure_north_africa_goal_name: "ยึดครองแอฟริกาเหนือ"
 secure_north_africa_goal_desc: "เราควรมุงครองความเปนใหญไมเพียงแคในยุโรป แตยังตองทําใหมั่นใจวาเราจะไดมากกวาแคที่มั่นในแอฟริกาเหนือ"
 an_armored_fist_goal_name: "ขยายกองกําลังยานเกราะของเรา"
 an_armored_fist_goal_desc: "ยุคสมัยใหมสรางโอกาสใหแกการสงครามรูปแบบใหม รถถังคืออนาคต เราตองทําใหมั่นใจวาในฐานะฝาย เรามีรถถังมากพอที่จะครองสนามรบ"
 an_infantry_army_goal_name: "ขยายกองกําลังทหารราบของเรา"
 an_infantry_army_goal_desc: "กระดูกสันหลังของกองทัพใด ๆ คือทหารราบ เราตองการกองทัพทหารราบขนาดใหญเพื่อหนุนหลังขอเรียกรองของเราทั้งบนเวทีการทูตและในสนามรบ"
 high_seas_fleet_goal_name: "ขยายกองเรือหลัก"
 high_seas_fleet_goal_desc: "การทําใหมั่นใจวาศัตรูของเราไมไดควบคุมแอตแลนติกเหนือเปนสิ่งสําคัญยิ่งตอปฏิบัติการของเรา หากเราขัดขวางเรื่องนี้ได ก็หมายความวาเราจะไมไดรับผลกระทบจากการปดลอมทางทะเล และกองเรือของเราจะเคลื่อนไหวไดอยางอิสระ"
 high_seas_fleet_tech_bonus: "โบนัสเปาหมาย $high_seas_fleet_goal_name$"
 control_the_chinese_coast_goal_name: "รักษาการควบคุมแนวชายฝง"
 control_the_chinese_coast_goal_desc: "หากถูกโจมตี เราควรพยายามรักษาการเขาถึงทะเลไวใหนานที่สุด การอยูรอดของเราผูกติดกับความสามารถในการรับสินคาจากประเทศโพนทะเล"
 guerilla_expansion_goal_name: "จัดตั้งขบวนการตอตาน"
 guerilla_expansion_goal_desc: "เราอาจไมสามารถตอกรกับผูรุกรานตามเงื่อนไขของพวกเขาได ดังนั้นเราจะสูกับพวกเขาตามเงื่อนไขของเราเอง"
 industrial_expansion_goal_name: "การขยายตัวทางอุตสาหกรรม"
 industrial_expansion_goal_desc: "วิธีที่ดีที่สุดในการสรางฝายที่แข็งแกรงคือการมีฐานอุตสาหกรรมที่แข็งแกรง เราตองทําใหมั่นใจวามีกําลังทางอุตสาหกรรมเพียงพอที่จะกาวขึ้นเปนมหาอํานาจสําคัญ"
 industrial_domination_goal_name: "ขยายอุตสาหกรรมพลเรือน"
 industrial_domination_goal_desc: "การสงครามสมัยใหมคือเรื่องของขีดความสามารถในการผลิต มาทําใหมั่นใจวาเรามีขีดความสามารถทางอุตสาหกรรมที่ใหญที่สุดเทาที่โลกเคยเห็นกันเถอะ"
 industrial_expansion_tech_bonus: "โบนัสเปาหมาย $industrial_expansion_goal_name$"
 industrial_research_goal_name: "วิจัย $construction4$"
 industrial_research_goal_desc: "เพื่อกาวขึ้นเปนผูเลนที่ครองความเปนใหญ เราตองทําใหมั่นใจวามีความรูความชํานาญดานอุตสาหกรรมทั่วทั้งฝาย"

 secure_chinese_waters_goal_name: "รักษานานนํ้าจีน"
 secure_chinese_waters_goal_desc: "เราอาจครองความเปนใหญบนบกได แตดวยแนวชายฝงที่ยาวไกล การปองกันไมใหใครรุกรานเราไดควรเปนสิ่งสําคัญสูงสุด ความปลอดภัยนี้เริ่มตนตั้งแตกลางทะเลไกลโพน"
 faction_goal_subjugate_the_faction_name: "พิชิตฝายใหอยูใตอํานาจ"
