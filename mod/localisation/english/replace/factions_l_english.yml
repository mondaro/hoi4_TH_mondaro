 asian_dominance_goal_name: "สถาปนาความเปนใหญในเอเชีย"
 asian_dominance_goal_desc: "เมื่อเอเชียสวนใหญอยูใตการควบคุมของเรา ฝายของเราจะกลายเปนกําลังที่ไมอาจมองขามได"
 middle_east_dominance_goal_name: "ควบคุมตะวันออกกลาง"
 middle_east_dominance_goal_desc: "ตั้งแตคาบสมุทรอาหรับและลิแวนตไปจนถึงเทือกเขาอัฟกัน เราตองรวมตัวกันและสถาปนาการควบคุมอยางเบ็ดเสร็จ ภูมิภาคนี้อาจกลายเปนผูเลนสําคัญไดหากเราทําใหทุกฝายทํางานรวมกัน"

 the_arteries_of_trade_goal_name: "ปกปองเสนเลือดใหญแหงการคา"
 the_arteries_of_trade_goal_desc: "เสนทางเดินเรือหลักตองอยูใตการควบคุมของเราเพื่อรับประกันความอยูรอดของประเทศสมาชิก" 
 the_atomic_race_goal_name: "สรางระเบิดปรมาณูลูกแรก"
 the_atomic_race_goal_desc: "เราตองทําใหมั่นใจวาศัตรูของเรา ทั้งในปจจุบันและอนาคต จะไมไดครอบครองอาวุธนิวเคลียรกอนเรา มีเพียงการเปนผูครอบครองรายแรกเทานั้นที่เราจะมั่นใจไดวาไมมีมหาอํานาจใดตอกรกับเราได"
 the_atomic_race_complete_trigger: "สมาชิกของ[ROOT.GetFactionName]เปนประเทศแรกที่ทํา $sp_nuclear_bomb$ สําเร็จ"
 the_atomic_race_complete_trigger_fail: "ประเทศที่ไมใชสมาชิกของ[ROOT.GetFactionName]เปนประเทศแรกที่ทํา $sp_nuclear_bomb$ สําเร็จ"
 rule_the_waves_goal_name: "ครองทองทะเล"
 rule_the_waves_goal_desc: "การจะครองมหาสมุทรไดอยางแทจริงตองมีกองเรือยิ่งใหญ และองคประกอบสําคัญของกองเรือยิ่งใหญก็คือเรือหลัก"
 eliminate_the_twin_threats_goal_name: "กําจัดภัยคุกคามคู"
 eliminate_the_twin_threats_goal_desc: "ตราบใดที่[SOV.GetNameDef]และ[GER.GetNameDef]ยังไมถูกจัดการใหอยูในแถว เราจะไมมีวันปลอดภัย"
 disarm_aggression_central_powers_goal_name: "ลดทอนประเทศผูรุกราน"
 disarm_aggression_central_powers_goal_desc: "ประเทศประชาธิปไตยแทบไมเคยโจมตีประเทศอื่น เพื่อรักษายุโรปไวใหคนรุนหลัง เราตองทําใหประเทศที่กาวราวเหลานี้กลายเปนประชาธิปไตย หรือไมก็กําจัดพวกเขาไปเสียใหสิ้น"
 rule_the_waves_tech_bonus: "โบนัสเปาหมายครองทองทะเล"
 imperial_glory_goal_name: "ปกปองทรัพยสินสําคัญของจักรวรรดิ"
 imperial_glory_goal_desc: "ปอมปราการสําคัญของจักรวรรดิเราและของพันธมิตรตองยืนหยัดไวใหได ดวยการรักษาการควบคุมดินแดนในครอบครองทั่วโลกในยามสงคราม เราจะแสดงใหโลกเห็นวาเรายังคงเปนกําลังที่ไมอาจมองขามได "
 
 production_quotas_goal_name: "บรรลุโควตาการผลิต"
 production_quotas_goal_desc: "เราตองมีคลังอาวุธมหาศาลเพื่อรักษาบูรณภาพของ[ROOT.GetFactionName] และพรอมเผชิญภัยคุกคามใด ๆ ที่เขามา"
 stall_the_fascist_threat_goal_name: "ถวงเวลาภัยคุกคามฟาสซิสต"
 stall_the_fascist_threat_goal_desc: "เราตองชะลอการแพรกระจายของฟาสซิสตในโลก สเปนมีแนวโนมสูงที่จะลมสลาย แตเราตองทําหนาที่ของเราในการถวงเวลาจนกวาเราจะพรอมปองกันตนเองจากภัยคุกคามฟาสซิสตที่กําลังกอตัว การตรึงกําลังทหารขาศึกไวในความขัดแยงในสเปนจะทําใหพวกเขามุงความสนใจไปที่อื่นไดยากขึ้น และซื้อเวลาอันมีคาใหแกเรา"
 the_red_tide_goal_name: "ขยายกองทัพแดง"
 the_red_tide_goal_desc: "ทหารบนภาคพื้นดินคือสิ่งที่สําคัญที่สุด สิ่งที่จําเปนคือกองทัพที่แข็งแกรงสิบลานนาย นั่นคือวิธีที่จะรับประกันการอยูรอดไดอยางแทจริง"
 military_infrastructure_goal_name: "กอสรางโครงสรางพื้นฐานทางทหาร"
 military_infrastructure_goal_desc: "โครงสรางพื้นฐานที่พัฒนาอยางดีมีความสําคัญยิ่งตอการทําใหกองกําลังปองกันชายแดนของเรามีเสนทางสงเสบียงที่ตองการ"
 ensure_military_r_d_goal_name: "สรางสถานวิจัยและพัฒนาทางทหาร"
 ensure_military_r_d_goal_desc: "เราตองทําใหเทคโนโลยีทางทหารของเราทัดเทียมผูอื่น ดวยการสรางสถานที่สําหรับการวิจัยและพัฒนาตนแบบขั้นสูงและแนวคิดใหมโดยเฉพาะ"
 spy_master_goal_name: "แตงตั้งหัวหนาสายลับ"
 spy_master_goal_desc: "เราควรใหสมาชิกรายหนึ่งของเราเชี่ยวชาญดานศิลปะการจารกรรมและการรวบรวมขาวกรอง เพื่อใหพวกเขากํากับดูแลและสั่งการปฏิบัติการของพันธมิตรเรา"
 convoy_sufficiency_goal_name: "ขบวนเรือลําเลียงเพียงพอ"
 convoy_sufficiency_goal_desc: "เพื่อใหมีขีดความสามารถเพียงพอทั้งในการสงเสบียงใหทหารของเราในตางแดนและตอบสนองความตองการวัตถุดิบของอุตสาหกรรมดวยการนําเขาจากโพนทะเล เราตองสรางกองเรือพาณิชยที่ใหญพอ"
 develop_mexican_oil_goal_name: "พัฒนานํ้ามันเม็กซิโก"
 develop_mexican_oil_goal_desc: "การขยายการขุดเจาะแหลงนํ้ามันสํารองของเม็กซิโกจะรับประกันวาจะมีเชื้อเพลิงเพียงพอตอความตองการทางอุตสาหกรรมและการทหาร"
 develop_curacao_oil_goal_name: "พัฒนานํ้ามันกือราเซา"
 develop_curacao_oil_goal_desc: "โรงกลั่นของกือราเซามีบทบาทสําคัญในการแปรรูปนํ้ามันของเวเนซุเอลา การขยายกําลังการผลิตจะชวยรักษาการเขาถึงผลิตภัณฑปโตรเลียมกลั่นของพันธมิตร"
 develop_venezuelan_oil_goal_name: "พัฒนานํ้ามันเวเนซุเอลา"
 develop_venezuelan_oil_goal_desc: "การขุดเจาะปโตรเลียมของเวเนซุเอลาสามารถขยายเพิ่มเติมเพื่อใหพันธมิตรของเราเขาถึงพลังงานที่จําเปนตอการสนับสนุนกิจกรรมทางทหาร"
 develop_guyanan_bauxite_goal_name: "พัฒนาบอกไซตกายอานา"
 develop_guyanan_bauxite_goal_desc: "การพัฒนาแหลงแรบอกไซตของกายอานาเพิ่มเติมจะใหวัตถุดิบที่จําเปนตอการผลิตเครื่องบินขนาดใหญ"
 develop_suriname_bauxite_goal_name: "พัฒนาบอกไซตซูรินาม"
 develop_suriname_bauxite_goal_desc: "การพัฒนาแหลงแรบอกไซตอันอุดมสมบูรณของซูรินามเพิ่มเติมจะใหวัตถุดิบที่อุตสาหกรรมอากาศยานซึ่งกําลังเติบโตของพันธมิตรเราตองการ"
 develop_lappland_metals_goal_name: "พัฒนาโลหะแลปแลนด"
 develop_lappland_metals_goal_desc: "การขยายการขุดความมั่งคั่งทางแรของแลปแลนดจะเสริมความแข็งแกรงใหการจัดหาเหล็กและทังสเตนของพันธมิตร และหลอเลี้ยงอุตสาหกรรมการผลิตอาวุธของเรา"
 develop_ploiesti_oil_fields_goal_name: "พัฒนาแหลงนํ้ามันโปลเยชตี"
 develop_ploiesti_oil_fields_goal_desc: "ในฐานะแหลงนํ้ามันเพียงแหงเดียวในยุโรป แหลงนํ้ามันโปลเยชตีตองถูกใชประโยชนอยางเหมาะสมเพื่อใหพันธมิตรมีเชื้อเพลิงที่จําเปนตอการปฏิบัติการทางทหารอยางตอเนื่อง"
 develop_baku_oil_fields_goal_name: "พัฒนาแหลงนํ้ามันบากู"
 develop_baku_oil_fields_goal_desc: "การพัฒนาภูมิภาคนํ้ามันบากูจะใหผลิตภัณฑปโตรเลียมกลั่นจํานวนมากซึ่งสําคัญยิ่งตอการปฏิบัติการทางทหาร"
 develop_iraqi_oil_goal_name: "พัฒนานํ้ามันอิรัก"
 develop_iraqi_oil_goal_desc: "การขยายกําลังการผลิตนํ้ามันของอิรักอาจมีบทบาทสําคัญในการตอบสนองความตองการเชื้อเพลิงของกองทัพเรา"
 develop_persian_oil_goal_name: "พัฒนานํ้ามันเปอรเซีย"
 develop_persian_oil_goal_desc: "การขยายแหลงนํ้ามันและกําลังการกลั่นของเปอรเซียจะรับประกันการไหลของเชื้อเพลิงอยางตอเนื่องเพื่อความตองการในการปฏิบัติการ"
 develop_chinese_metals_goal_name: "พัฒนาโลหะจีน"
 develop_chinese_metals_goal_desc: "ความมั่งคั่งของจีนในโลหะสําคัญหลากหลายชนิดสามารถขุดไดมากขึ้นเพื่อปอนทรัพยากรที่ฐานอุตสาหกรรมการทหารของพันธมิตรตองการ"
 develop_malayan_riches_goal_name: "พัฒนาความมั่งคั่งของมลายา"
 develop_malayan_riches_goal_desc: "การพัฒนาทรัพยากรทังสเตนและยางของมลายาจะเสริมฐานวัตถุดิบของพันธมิตรอยางมาก รับประกันปจจัยสําคัญสําหรับการผลิตและการสงกําลังบํารุงทางทหาร"
 develop_indonesian_riches_goal_name: "พัฒนาความมั่งคั่งของอินโดนีเซีย"
 expand_newfoundland_bases_goal_name: "ขยายฐานทัพนิวฟนดแลนด"
 expand_newfoundland_bases_goal_desc: "การขยายฐานทัพของเราในนิวฟนดแลนดจะชวยใหเราควบคุมขบวนเรือลําเลียงในแอตแลนติกเหนือไดดีขึ้น และแผขยายกําลังทางอากาศและทางเรือไปทั่วเสนทางเดินเรือสําคัญ"
 expand_bermuda_bases_goal_name: "ขยายฐานทัพเบอรมิวดา"
 expand_bermuda_bases_goal_desc: "การขยายฐานทัพของเราในเบอรมิวดาจะชวยใหเราลาดตระเวนกลางมหาสมุทรแอตแลนติกไดอยางมีประสิทธิภาพมากขึ้น และรักษาเสนทางสงเสบียงระหวางทวีปใหปลอดภัยยิ่งขึ้น"
 expand_bahamas_bases_goal_name: "ขยายฐานทัพบาฮามาส"
 expand_bahamas_bases_goal_desc: "การขยายฐานทัพของเราในบาฮามาสจะชวยใหเฝาติดตามเสนทางเดินเรือในทะเลแคริบเบียนไดอยางมีประสิทธิภาพมากขึ้น และปกปองเสนทางทางทะเลเขาสูอเมริกาเหนือและอเมริกาใต"
 fortify_panama_canal_goal_name: "เสริมปอมปราการคลองปานามา"
 expand_trinidad_bases_goal_name: "ขยายฐานทัพตรินิแดด"
 expand_azores_bases_goal_name: "ขยายฐานทัพอะซอรส"
 expand_iceland_bases_goal_name: "ขยายฐานทัพไอซแลนด"
 expand_iceland_bases_goal_desc: "การขยายฐานทัพในไอซแลนดจะชวยใหเรารักษาชองแคบเดนมารกไดดีขึ้น และแผอิทธิพลเหนือเสนทางแอตแลนติกเหนือไดมากขึ้น"
 expand_faroese_bases_goal_name: "ขยายฐานทัพแฟโร"
 expand_narvik_bases_goal_name: "ขยายฐานทัพนารวิก"
 expand_narvik_bases_goal_desc: "การขยายฐานทัพในนารวิกจะชวยรักษาการเขาถึงการขนสงแรเหล็กที่สําคัญยิ่ง และควบคุมเสนทางสงเสบียงในอารกติกไดดีขึ้น"
 fortify_danish_belts_goal_name: "เสริมปอมปราการชองแคบเดนมารก"
 fortify_danish_belts_goal_desc: "การเสริมปอมปราการที่คัทเทกัตจะชวยใหเราควบคุมการเขาถึงทางทะเลระหวางทะเลบอลติกและทะเลเหนือไดแตเพียงผูเดียวอยางดียิ่งขึ้น"
