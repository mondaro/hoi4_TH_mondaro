 JAP_military_purges: "การกวาดลางในกองทัพ"
 PRC_soviet_tribute: "บรรณาการแกโซเวียต"
 MAN_low_legitimacy: "ความชอบธรรมตํ่า"
 MAN_low_legitimacy_5_desc: "จักรพรรดิผูอี๋เปนผูสืบเชื้อสายโดยชอบธรรมของจักรพรรดิราชวงศชิงซึ่งปกครองจีนมาสามรอยป การปฏิวัติซินไฮที่ถอดพระองคจากราชบัลลังกในป 1911 ไดรับความนิยมอยางมาก เนื่องจากรัฐบาลชิงชวงปลายไรอํานาจทั้งตอชาวตางชาติที่ฉกชิงดินแดนจีน และตอผูวาการภูมิภาคที่ตั้งตนเปนขุนศึก การที่ญี่ปุนสถาปนาจักรพรรดิผูอี๋เปนจักรพรรดิแหงแมนจูกัวยังไมเปนที่ยอมรับของประชาชนแมนจูเรีย ไมตองพูดถึงจีนสวนอื่น\n\nเราจะตองสรางความเปนอิสระขององคจักรพรรดิจากญี่ปุน เพื่อรวมชาติใหอยูภายใตพระองค"
 MAN_low_legitimacy_4_desc: "จักรพรรดิผูอี๋เปนผูสืบเชื้อสายโดยชอบธรรมของจักรพรรดิราชวงศชิงซึ่งปกครองจีนมาสามรอยป การปฏิวัติซินไฮที่ถอดพระองคจากราชบัลลังกในป 1911 ไดรับความนิยมอยางมาก เนื่องจากรัฐบาลชิงชวงปลายไรอํานาจทั้งตอชาวตางชาติที่ฉกชิงดินแดนจีน และตอผูวาการภูมิภาคที่ตั้งตนเปนขุนศึก การที่ญี่ปุนสถาปนาจักรพรรดิผูอี๋เปนจักรพรรดิแหงแมนจูกัวยังไมเปนที่ยอมรับของประชาชนแมนจูเรีย ไมตองพูดถึงจีนสวนอื่น\n\nเราจะตองสรางความเปนอิสระขององคจักรพรรดิจากญี่ปุน เพื่อรวมชาติใหอยูภายใตพระองค"
