 JAP_militarism: "ลัทธิทหาร"
 JAP_militarism_desc: "ลัทธิทหารครอบงําชีวิตทางการเมืองและสังคมของชาติ และความเชื่อที่วาความแข็งแกรงของกองทัพเทากับความแข็งแกรงของชาติก็แพรหลาย เริ่มตนจากการนําระบบเกณฑทหารมาใชในชวงการปฏิรูปเมจิ บัดนี้มันไดกลายเปนหลักการสําคัญในความเชื่อของชาติเรา"
