 CHI_chen_guofu: "เฉิน กั่วฟู"
 CHI_warlord_integration: "การผนวกรวมขุนศึก"
 CHI_chinese_unity_1: "เอกภาพจีน"
 CHI_chinese_unity_1_desc: "ขุนศึกไดประกาศสนับสนุนเรา ทําใหรัฐบาลของเรามุงความสนใจไปที่การตอตานผูรุกรานตางชาติได"
 CHI_camco_1: "CAMCO"
 CHI_camco_2: "CAMCO - แผนกเครื่องบินขับไล"
 CHI_camco_3: "CAMCO - แผนกเครื่องบินทิ้งระเบิด"
 PRC_the_long_march: "ผลพวงจากการเดินทัพทางไกล"
 PRC_the_long_march_desc: "การลาถอยอันยาวไกลเขาสูสานซีทําใหกองกําลังของเรารอยหรอ และฐานที่มั่นเหยียนอานยังไมพรอมจะสนับสนุนการลุกฮือครั้งใหญ จะตองใชเวลาหรือความชวยเหลือจากภายนอกเพื่อฟนตัว"
 PRC_the_long_march_2: "ฟนตัวจากการเดินทัพทางไกล"
 PRC_low_popular_support: "แรงสนับสนุนจากประชาชนตํ่า"
 PRC_low_popular_support_desc: "ชาวนาไดรับความทุกขยากอยางหนักในสงครามกลางเมือง หากเราตองการไดรับการยอมรับในฐานะรัฐบาลอันชอบธรรมของจีน เราตองไดรับการสนับสนุนจากพวกเขา"
 PRC_power_struggles: "การชวงชิงอํานาจ"
 PRC_power_struggles_desc: "ภายในพรรคแตกแยกกันในเรื่องหนทางที่ดีที่สุดที่จะดําเนินตอไป การชวงชิงระหวางกลุมตาง ๆ ไดปะทุขึ้นและจะดําเนินตอไปจนกวากลุมใดกลุมหนึ่งจะขึ้นเปนใหญ"
 PRC_red_army_weakened: "กองทัพแดงออนแอลง"
 PRC_red_army_weakened_desc: "กองทัพแดงของเราออนลาจากการเดินทัพทางไกลและยังไมพรอมรบ เราตองจัดตั้งหนวยใหมและสรางกองทัพปลดปลอยขึ้นใหม"
