 JAP_superior_will: "เจตจํานงที่เหนือกวา"
 JAP_unsanctioned_war: "สงครามที่ไมไดรับพระบรมราชานุญาต"
 JAP_unsanctioned_war_desc: "สงครามในจีนครั้งนี้เริ่มตนขึ้นอยางเรงรีบ และไมไดรับพระบรมราชานุญาตจากองคจักรพรรดิ"
