 MAN_arms_seized_1: "การขาดแคลนกระสุนในแมนจูเรีย"
 MAN_arms_seized_1_desc: "ฝายชิงไดวางแผนโจมตีแบบไมทันตั้งตัว และยึดคลังอาวุธและคลังกระสุนหลายแหงในดินแดนของพวกเขา จะตองใชเวลาสักระยะในการจัดระเบียบสายสงกําลังบํารุงในดินแดนของพวกเขาใหม"
 MAN_underground_gun_shops: "โรงงานใตดิน"
 MAN_underground_gun_shops_desc: "เราไดสรางโรงงานชั่วคราวหลายแหงในสวนหลังบานและหองใตดินเพื่อผลิตยุทโธปกรณเพิ่ม คุณภาพอาจไมดีนัก แตชดเชยดวยปริมาณ"
 MAN_xian_yuan: "เซียน หยวน"
