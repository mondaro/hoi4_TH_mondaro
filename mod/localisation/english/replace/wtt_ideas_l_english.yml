l_english:
 CHI_nine_power_treaty: "สนธิสัญญาเกามหาอํานาจ"
 CHI_nine_power_treaty_desc: "เรายังคงทนทุกขอยูภายใตผลของสนธิสัญญาไมเปนธรรมที่รับรอง "นโยบายเปดประตู" ตอจีน ชาวตางชาติยังคงมีสิทธิสภาพนอกอาณาเขต และเราไมสามารถควบคุมเศรษฐกิจของตนเองไดอยางสมบูรณ"
 CHI_army_corruption: "การทุจริตในกองทัพ"
 CHI_army_corruption_desc: "กองทัพของเราเต็มไปดวยการทุจริตและการเลนพรรคเลนพวก หากเราตองการเปลี่ยนใหเปนกําลังรบที่ทรงพลัง เราตองดําเนินโครงการปฏิรูปกองทัพที่ยาวนานและสิ้นเปลือง"
 CHI_ineffective_bureaucracy: "ระบบราชการไรประสิทธิภาพ"
 CHI_ineffective_bureaucracy_desc: "ความโกลาหลจากสงครามกลางเมืองไดขัดขวางการสรางกลไกรัฐที่มีประสิทธิภาพ กวาหนึ่งในสามของผูที่พรอมเกณฑไมไดถูกเกณฑ เพียงเพราะไมมีใครรูวาพวกเขามีตัวตน การปฏิรูปกระบวนการสอบคัดเลือกจะทําใหเราไดจางคนที่มีความสามารถ"
 CHI_ineffective_bureaucracy_warlord: "ระบบราชการไรประสิทธิภาพ"
 CHI_ineffective_bureaucracy_warlord_desc: "ความโกลาหลจากสงครามกลางเมืองไดขัดขวางการสรางกลไกรัฐที่มีประสิทธิภาพ ภูมิภาคนี้จะไมสามารถปกครองไดอยางเหมาะสมจนกวาเราจะปฏิรูประบบราชการ ดวยการจางคนที่มีความสามารถและแบงเขตการปกครองอยางมีประสิทธิภาพ"
 CHI_warlord_state_idea: "รัฐขุนศึก"
 CHI_warlord_state_idea_desc: "รัฐของเรายังหางไกลจากความหมายของคํานี้ มันเปนเพียงภูมิภาคและผูคนที่ใชชีวิตประจําวันภายใตการคุมครองของกองทัพอิสระที่ไมไดสาบานความภักดีตอรัฐใด สิ่งนี้ทําใหเราทําอะไรไดนอยมากในฐานะรัฐบาล แตก็มีขอดีอยูบาง"
 CHI_warlord_state_idea_tt: "จิตวิญญาณนี้จะถูกลบออกเมื่อแผนยุทธศาสตรใดแผนหนึ่งตอไปนี้สําเร็จ: §Yการชวงชิงอํานาจ§!, §Yอุบัติการณเหยียนอาน§! และ §Yประกาศรัฐบาลคูแขง§!"
 CHI_incompetent_officers: "นายทหารไรความสามารถ"
 CHI_incompetent_officers_desc: "นายทหารของเรายังไมพรอมรับมือกับการบริหารสงครามสมัยใหม พวกเขาตองเรียนรูบทเรียนอันเจ็บปวดกอนที่จะเทียบเทากับนายทหารของชาติอื่นไดอยางแทจริง การใหการศึกษาแกพวกเขาจะเปนสวนหนึ่งของโครงการปฏิรูปกองทัพที่ใหญกวา"
 CHI_hyper_inflation_none: "เศรษฐกิจมั่นคง"
 CHI_hyper_inflation_none_desc: "เศรษฐกิจไมแสดงสัญญาณของปญหาใด ๆ"
 CHI_hyper_inflation_1: "เงินเฟอตํ่า"
 CHI_hyper_inflation_1_desc: "นักเศรษฐศาสตรของเราสังเกตเห็นวาเงินเฟอเพิ่มขึ้นเล็กนอย เราควรจับตาดูเรื่องนี้"
 CHI_hyper_inflation_2: "เงินเฟอปานกลาง"
 CHI_hyper_inflation_2_desc: "เงินเฟอเริ่มสงผลกระทบตอเศรษฐกิจอยางมีนัยสําคัญ เราควรพิจารณามาตรการตอบโตกอนที่สถานการณจะควบคุมไมได"
 CHI_hyper_inflation_3: "เงินเฟอรุนแรง"
 CHI_hyper_inflation_3_desc: "เงินที่รัฐบาลออกมีคานอยลงเรื่อย ๆ อํานาจซื้อลดลง และสินคาบางอยางหาไดเฉพาะผูที่มีเสนสาย"
 CHI_hyper_inflation_4: "ภาวะเงินเฟอรุนแรงขั้นวิกฤต"
 CHI_hyper_inflation_4_desc: "มูลคาของเงินตราเรากําลังระเหยหายไป ราคาสินคาพุงขึ้นอยางมากในแตละวัน เราตองรีบดําเนินมาตรการตอบโตอยางเรงดวนที่สุดกอนที่จะลมสลายโดยสิ้นเชิง"
 CHI_hyper_inflation_5: "เศรษฐกิจลมสลาย"
 CHI_hyper_inflation_5_desc: "ระบบเงินตราของเราลมสลายโดยสิ้นเชิง ในหลายพื้นที่ของประเทศ การคากลับไปใชระบบแลกเปลี่ยนสิ่งของ ความยากจนแพรกระจายไปทั่ว ลูกจางของเรานําธนบัตรที่เราจายใหไปเผาใหความอบอุนในบาน จําเปนตองมีโครงการปฏิรูปการเงินและเศรษฐกิจอยางเขมขนเพื่อแกไขสถานการณ"
 CHI_dai_li: "ไต ลี่"
