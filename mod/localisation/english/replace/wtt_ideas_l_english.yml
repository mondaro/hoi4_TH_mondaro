 MAN_the_kangde_emperor: "จักรพรรดิคังเตอ"
 MAN_the_kangde_emperor_desc: "ในป 1934 ผูอี๋ไดรับการราชาภิเษกเปนจักรพรรดิแหงแมนจูกัว เปลี่ยนตําแหนงจากผูบริหารสูงสุดเปนจักรพรรดิ และดวยเหตุนี้จึงมีการใชชื่อรัชศกใหม จากเดิมที่ปกครองภายใตชื่อตาถง บัดนี้พระองคทรงปกครองแมนจูเรียในฐานะจักรพรรดิคังเตอ"
