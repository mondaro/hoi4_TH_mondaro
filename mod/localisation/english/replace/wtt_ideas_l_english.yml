 MAN_banditry: "โจรผูราย"
 MAN_banditry_desc: "เรากําลังทําสงครามความรุนแรงตํ่ากับพลพรรคกองโจร ผูแปรพักตร และผูกอการรายฝายสาธารณรัฐ เราควรมุงเนนการสรางความสงบในชนบทเพื่อตามลาโจรเหลานี้"
 MAN_kwantung_veto: "อํานาจยับยั้งของคันโต"
 MAN_kwantung_veto_desc: "หลังจากญี่ปุนยึดตาเหลียนจากรัสเซียในป 1905 กองรักษาการณควันตง (คันโตในภาษาญี่ปุน) ที่ประจําอยูที่นั่นก็เขาไปยุงเกี่ยวกับการเมือง โดยนายพลฝายขยายอํานาจเปนผูริเริ่มยึดดินแดนจีนเพิ่มเติมใหญี่ปุน ซึ่งถึงจุดสูงสุดในอุบัติการณมุกเดนในป 1932 เมื่อจักรวรรดิแมนจูกัวถูกแบงแยกออกมาจากดินแดนของขุนศึกเล็ก ๆ ทางตะวันออกเฉียงเหนือ กองทัพคันโตยังคงครอบงําพื้นที่นี้ และใหผลประโยชนของนายพลของตนอยูเหนือความจําเปนของแมนจูกัว\n\nเราจะแกปญหานี้ไดก็ตอเมื่อทําใหกองทัพญี่ปุนยอมรับเราในฐานะผูเทาเทียม หรือขับไลพวกเขาออกไปดวยกําลัง"
