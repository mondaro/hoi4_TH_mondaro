  INS_national_revolution_cat_desc: "หลังจากถูกดัตชกดขี่มา 350 ป เราไดลุกขึ้นกําหนดชะตาตนเองและประกาศเอกราช เนเธอรแลนดไมยอมรับอํานาจของเรา ยังคงปกครองอินดีสในฐานะอาณานิคมของตนและปฏิบัติตอเราเหมือนอาชญากร\n\nเราตองเขาควบคุมภูมิภาคและเมืองสําคัญใหมากขึ้นตอไป และโคนลมรัฐบาลดัตชจากภายใน อยางไรก็ตาม เราควรระวังไมใหกาวราวเกินไปโดยไมมีการวางแผนอยางรอบคอบ เพราะการยกระดับความรุนแรงอยางรวดเร็วอาจยั่วยุใหดัตชใชกําลังทหาร"
  INS_national_revolution_cat_map: "กอการลุกฮือลวง"

  INS_national_revolution_dutch_cat: "กองกําลังปฏิวัติในอินดีส"
  INS_national_revolution_dutch_cat_desc: "นักปฏิวัติในหมูเกาะอินดีสตะวันออกไดประกาศเอกราชอยางผิดกฎหมาย และเขาควบคุมภูมิภาคตางๆ ของอินดีสดวยกองกําลังติดอาวุธ แมเราจะพยายามอยางเต็มที่ แตก็ไมสามารถกลับมาควบคุมภูมิภาคเหลานี้ไดเนื่องจากกองกําลังติดอาวุธมีจํานวนมหาศาล\n\nเราตองหยุดพวกเขากอนที่พวกเขาจะยึดเมืองเพิ่มและบั่นทอนเสถียรภาพของรัฐบาลอินดีสไปมากกวานี้ แมจะสุดโตง แตการใชกําลังทหารอาจจําเปนหากพวกเขายังคงทําเชนนี้ตอไป"
  INS_HOL_revolution_not_going_well_tt: "§Rหากไมมีปตตาเวีย เราจะไมสามารถปกครองอินดีสได และจะไมมีทางเลือกอื่นนอกจากเจรจาขอตกลงสันติภาพกับนักปฏิวัติ§!"

  INS_gradual_escalation_republic: "การยกระดับความรุนแรงทีละขั้น"
  INS_gradual_escalation_HOL: "การยกระดับความรุนแรงทีละขั้น"
  INS_gradual_escalation_republic_desc: "การตอบโตของดัตชหนักหนวงขึ้นหลังการจูโจมแตละครั้งของเรา และหนวยลาดตระเวนของพวกเขาบุกเขาไปในเขตที่ทิ้งรางไปเมื่อหลายเดือนกอน ผูบังคับบัญชาของเรารายงานการสูรบที่หนักขึ้นในพื้นที่ที่เคยคิดวาสงบแลว และความสูญเสียของเราเพิ่มขึ้นเร็วกวาที่ผูเกณฑทหารจะหามาทดแทนได ความขัดแยงไดลุกลามไปยังจังหวัดที่เคยสงบเมื่อปที่แลว"
  INS_gradual_escalation_HOL_desc: "รายงานจากเขตปกครองของเราแยลงทุกสัปดาห พวกกบฏโจมตีในเขตที่ไมคิดวาพวกเขาจะปฏิบัติการ และกองบัญชาการทหารในปตตาเวียเรงเราใหใชมาตรการที่หนักหนวงกวาที่เคยลองมา ในกรุงเฮก ผูที่เคยแนะนําใหอดทนมีจํานวนนอยลงในการประชุมคณะรัฐมนตรีทุกครั้ง"
