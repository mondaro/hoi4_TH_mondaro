  SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "ชักชวนจิร วิชิตสงคราม ใหเขารวมอุดมการณเสรีไทย หากสําเร็จ เขาจะเขาขางเราเมื่อสงครามกลางเมืองเริ่มขึ้น"
