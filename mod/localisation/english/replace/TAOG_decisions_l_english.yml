  SIA_war_fervor_cat: "กระแสคลั่งสงคราม"
  SIA_war_fervor_cat_desc: "ความกระหายสงครามของประชาชนตองไดรับการควบคุมอยางระมัดระวัง หากปลอยไว กระแสคลั่งสงครามจะหันกลับมาทํารายภายใน — รัฐบาลที่ปลุกเราจิตวิญญาณนักรบโดยไมชี้นําทิศทาง ยอมเสี่ยงที่จะกลายเปนเปาหมายรายตอไปเสียเอง"
  SIA_war_fervor_coup_dummy: "กระแสคลั่งสงครามปะทุ"
  SIA_war_fervor_coup_dummy_desc: "หากความกระหายสงครามของประชาชนพลุงพลานโดยไมมีทางระบาย ก็ยอมหันกลับมาลงที่เราอยางหลีกเลี่ยงไมได"
  SIA_urge_restraint: "เรียกรองใหอดกลั้น"
  SIA_war_fervor_coup: "รัฐประหารใกลปะทุ"
  SIA_modify_cultural_mandates: "ปรับ $idea_SIA_thai_cultural_mandates$ ดังนี้:"
  
  SIA_mandate_1: "รัฐนิยมฉบับที่ 1"
  SIA_mandate_1_desc: "ใหเรียกชื่อประเทศ ประชาชน และสัญชาติวา ไทย"
  SIA_mandate_1_tt: "§Y[THIS.GetName]§! จะไดชื่อวา §Y$SIA_thailand$§!"

  SIA_mandate_2: "รัฐนิยมฉบับที่ 2"
  SIA_mandate_2_desc: "คนไทยตองไมประกอบกิจการใด ๆ โดยไมคํานึงถึงประโยชนและความปลอดภัยของประเทศชาติ\n\nคนไทยตองไมแพรงพรายสิ่งใดที่อาจเปนภัยตอประเทศชาติใหชาวตางประเทศลวงรู การกระทําเชนนี้เปนการทรยศตอชาติ\n\nคนไทยตองไมกระทําการเปนตัวแทนหรือเปนปากเสียงใหแกชาวตางประเทศโดยไมคํานึงถึงประโยชนของชาติไทย และตองไมออกความเห็นหรือเขาขางชาวตางประเทศในกรณีพิพาทระหวางประเทศ การกระทําเชนนี้เปนการทรยศตอชาติ\n\nคนไทยตองไมลอบซื้อที่ดินแทนชาวตางประเทศในทางที่อาจเปนภัยตอประเทศชาติ การกระทําเชนนี้เปนการทรยศตอชาติ\n\n เมื่อมีผูใดทรยศตอชาติ เปนหนาที่ของคนไทยที่จะตองชวยกันระงับยับยั้งโดยเร็ว"

  SIA_mandate_3: "รัฐนิยมฉบับที่ 3"
  SIA_mandate_3_desc: "ใหเลิกเรียกชาวไทยแตกตางไปจากชื่อเชื้อชาติ หรือตามความนิยมของหมูเหลา\n\nใหใชคําวา 'ไทย' เรียกชาวไทยทั้งปวง โดยไมแบงแยก"

  SIA_mandate_4: "รัฐนิยมฉบับที่ 4"
  SIA_mandate_4_desc: "เมื่อไดเห็นการชักธงชาติขึ้นหรือลงตามเวลาปกติของทางราชการ หรือไดยินเสียงแตรเดี่ยวหรือนกหวีด หรือไดรับสัญญาณใหชักธงขึ้นหรือลง ใหแสดงความเคารพธงตามระเบียบหรือประเพณี\n\nเมื่อไดยินเพลงชาติ ไมวาจะบรรเลงในทางราชการหรือในงานพิธีใด ๆ ผูที่เขารวมหรืออยูในบริเวณนั้นพึงแสดงความเคารพตามระเบียบหรือประเพณี\n\nเมื่อเห็นผูใดไมแสดงความเคารพอยางเหมาะสม ใหชวยกันวากลาวตักเตือนใหเห็นความสําคัญของการเคารพธงชาติ เพลงชาติ และเพลงสรรเสริญพระบารมี"

  SIA_mandate_5: "รัฐนิยมฉบับที่ 5"
  SIA_mandate_5_desc: "ชาวไทยพึงพยายามบริโภคแตอาหารที่ทําจากผลิตภัณฑของไทย\n\nชาวไทยพึงพยายามใชเครื่องแตงกายที่ทําจากผลิตภัณฑของไทย\n\nชาวไทยพึงชวยกันอุดหนุนกิจการเกษตร พาณิชยกรรม อุตสาหกรรม และอาชีพอื่น ๆ ของชาวไทยดวยกัน\n\nชาวไทยพึงใชและอุดหนุนกิจการสาธารณูปโภคที่รัฐบาลหรือชาวไทยจัดตั้งขึ้น\n\nชาวไทยผูประกอบการเกษตร พาณิชยกรรม อุตสาหกรรม หรืออาชีพอื่นที่ไดรับการอุดหนุนตามรัฐนิยมนี้ ตองพยายามรักษามาตรฐาน ปรับปรุงคุณภาพ และประกอบกิจการดวยความซื่อสัตย"

  SIA_mandate_6: "รัฐนิยมฉบับที่ 6"
  SIA_mandate_6_desc: "ทํานองเพลงชาติใหใชตามที่พระเจนดุริยางคประพันธไว ซึ่งเก็บรักษาไว ณ กรมศิลปากร\n\nเนื้อรองเพลงชาติใหใชตามที่กองทัพบกเสนอ"

  SIA_mandate_7: "รัฐนิยมฉบับที่ 7"
  SIA_mandate_7_desc: "คนไทยทุกคนตองชวยกันสรางชาติ ผูมีรางกายสมบูรณทุกคนตองประกอบอาชีพเปนหลักฐาน ผูไมมีอาชีพยอมไมเปนประโยชนแกชาติ และไมสมควรไดรับความนับถือจากชาวไทย"

  SIA_mandate_8: "รัฐนิยมฉบับที่ 8"
  SIA_mandate_8_desc: "วาดวยเพลงสรรเสริญพระบารมี ใหตัดทอนเนื้อรองใหสั้นลง และเปลี่ยนคําวา สยาม เปนคําวา ไทย"

  SIA_mandate_9: "รัฐนิยมฉบับที่ 9"
  SIA_mandate_9_desc: "ชาวไทยตองยกยอง เทิดทูน และใหเกียรติภาษาไทย และพึงภูมิใจในการพูดภาษาไทย\n\nชาวไทยตองถือวาการศึกษาภาษาประจําชาติเปนหนาที่ของพลเมืองดี อยางนอยตองอานออกเขียนได และตองถือเปนหนาที่สําคัญที่จะชวยเหลือแนะนําพลเมืองที่ยังพูดหรืออานภาษาไทยไมไดใหไดเรียนรู\n\nชาวไทยตองไมถือเอาถิ่นกําเนิด ที่อยู หรือสําเนียงพูดของแตละทองถิ่นเปนเครื่องแบงแยก ทุกคนตองถือวาผูที่เกิดเปนคนไทยยอมมีเลือดไทยเดียวกันและพูดภาษาไทยเดียวกัน ถิ่นกําเนิดหรือสําเนียงหาไดทําใหแตกตางกันไม\n\nชาวไทยตองถือเปนหนาที่ที่จะประพฤติตนเปนพลเมืองดีของชาติ และชวยชักชวนแนะนําผูที่ยังไมรูไมเขาใจใหตระหนักถึงหนาที่ของพลเมืองดีแหงชาติไทย"

  SIA_mandate_10: "รัฐนิยมฉบับที่ 10"
  SIA_mandate_10_desc: "ชาวไทยไมพึงปรากฏตัวในที่ชุมนุมชน ในที่สาธารณะ หรือในเขตเมือง โดยแตงกายไมสมควร การแตงกายไมสมควร ไดแก นุงแตกางเกงชั้นใน ไมสวมเสื้อ หรือนุงผาลอยชาย\n\nการแตงกายที่สมควรสําหรับชาวไทย ไดแก เครื่องแบบตามตําแหนงหนาที่และโอกาส; เครื่องแตงกายแบบสากลนิยมที่สุภาพ; เครื่องแตงกายแบบไทยที่สุภาพ"

  SIA_mandate_11: "รัฐนิยมฉบับที่ 11"
  SIA_mandate_11_desc: "ชาวไทยพึงแบงเวลาในวันหนึ่งออกเปนสามสวน คือ เวลาทํางาน เวลาทํากิจสวนตัว และเวลาพักผอนหลับนอน ใหเปนระเบียบและมีกําหนดจนเปนนิสัย\n\nชาวไทยพึงปฏิบัติกิจสวนตัวตามปกติดังนี้ รับประทานอาหารใหเปนเวลา ไมเกินวันละสี่มื้อ; นอนหลับราว 6-8 ชั่วโมง\n\nชาวไทยพึงปฏิบัติงานในหนาที่ดวยความขยันขันแข็ง ไมทอถอยหรือหลีกเลี่ยงงาน เวลาพักกลางวันและรับประทานอาหารกลางวันไมควรเกินหนึ่งชั่วโมง เมื่อเลิกงานแลวพึงออกกําลังกายดวยการเลนกีฬาอยางนอยหนึ่งชั่วโมง หรือทํากิจกรรมอื่น เชน ทําสวน เลี้ยงสัตว หรือปลูกตนไม แลวจึงอาบนํ้าและรับประทานอาหารคํ่า\n\nชาวไทยพึงใชเวลาวางยามคํ่าคืนทํางานที่จําเปนใหเสร็จ สนทนากับครอบครัวและมิตรสหาย หาความรูดวยการฟงขาววิทยุหรืออานหนังสือ หรือหาความบันเทิงและศิลปะอื่น ๆ ตามโอกาส"

  SIA_mandate_12: "รัฐนิยมฉบับที่ 12"
  SIA_mandate_12_desc: "ในที่สาธารณะหรือตามถนนหนทาง พึงชวยเหลือและคุมครองเด็ก คนชรา และคนพิการ\n\nผูที่ปฏิบัติตามขอ 1 ถือเปนผูมีวัฒนธรรม สมควรไดรับความนับถือจากชาวไทย"  


  SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
  SIA_movie_theater_cat_desc: "จอเงินเปนหนึ่งในเครื่องมือที่ทรงพลังที่สุดของรัฐสมัยใหม ดวยภาพยนตรที่คัดสรรมาอยางดีและการรณรงคโฆษณาชวนเชื่อ รัฐบาลสามารถชี้นําความคิดเห็นของสาธารณชน ปลุกเราความรักชาติ และกลบเสียงของผูเห็นตางได"
