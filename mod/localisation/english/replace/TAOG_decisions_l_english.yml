  INS_soetardjo_petition: "คํารองซูตารโจรอการอนุมัติ"
  INS_soetardjo_petition_desc: "การประชุมโตะกลมที่ซูตารโจเรียกรองไดจัดขึ้นแลว โดยสรุปวา[INS.GetNameDef]ตองบรรลุขอกําหนดทางเศรษฐกิจหลายประการเพื่อใหพึ่งพาตนเองได เราตองแสดงความคืบหนาที่ชัดเจนสูเปาหมายเหลานี้ มิฉะนั้น[HOL.GetNameDef]จะกลับคําตัดสินในที่สุดเพื่อรักษาสถานะเดิม"
  INS_soetardjo_petition_refresh_tt: "เปดภารกิจอีกครั้ง: §Yคํารองซูตารโจรอการอนุมัติ§! เปนระยะเวลา §Y120 วัน§!"
  INS_soetardjo_pending: "โฟลกสรัดอภิปรายคํารองขออํานาจปกครองตนเองของซูตารโจ"
  INS_soetardjo_pending_desc: "ซูตารโจเปนสมาชิกโฟลกสรัดที่มีชื่อเสียงในฐานะผูนําขบวนการชาตินิยมสายสันติ ขณะนี้เขากําลังจัดทําคํารองขอให[INS.GetNameDef]ไดรับอํานาจปกครองตนเองมากขึ้น และใหจัดการประชุมโตะกลมระหวางผูแทนชาวดัตชและชาวอินโดนีเซีย เพื่อหารือถึงความปรารถนาของชาวอินโดนีเซียที่จะปกครองตนเองในฐานะสวนหนึ่งของเครือจักรภพดัตช คํารองนี้กําลังถูกอภิปรายในโฟลกสรัด เมื่อการอภิปรายสิ้นสุดลง เราตองตัดสินใจวาจะตอบสนองอยางไร เพราะผลที่ตามมาของคํารองนี้มีความสําคัญยิ่ง"

  INS_flag_legalized: "แสดงธงแดง-ขาวไดอยางถูกกฎหมาย"

  INS_owned_states_at_game_start_tt: "รัฐทั้งหมดของอินโดนีเซีย"

  INS_win_condition_base_republic_warning: "ทําลายหมูเกาะอินดีสตะวันออก"
  INS_win_condition_base_republic_warning_desc: "เราตองสูตอไป เกณฑพลเรือน และทําใหไฟในจิตวิญญาณของชาวอินโดนีเซียทุกคนยังคงลุกโชน เมื่อเราโคนลมรัฐบาลอินดีสได [HOL.GetNameDef]จะไมมีทางเลือกอื่นนอกจากยอมจํานน"
