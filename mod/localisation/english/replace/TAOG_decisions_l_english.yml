l_english:
  SIA_free_thai_air_network_cat: "เครือขายทางอากาศเสรีไทย"
  SIA_recover_downed_airmen: "ชวยเหลือนักบินที่ถูกยิงตก"
  SIA_recover_downed_airmen_desc: "ขบวนการใตดินของเราจะใหที่หลบซอนและลักลอบพานักบินฝายสัมพันธมิตรที่ถูกยิงตกเหนือแผนดินไทยออกไปอยางปลอดภัย"
  SIA_establish_mountain_weather_posts: "ตั้งสถานีตรวจอากาศบนภูเขา"
  SIA_establish_mountain_weather_posts_desc: "สถานีลับบนที่สูงจะสงรายงานสภาพอากาศทางวิทยุ ซึ่งกองทัพอากาศฝายสัมพันธมิตรตองการอยางยิ่ง"
  SIA_smuggle_radio_sets: "ลักลอบนําเครื่องวิทยุเขาสูภายในประเทศ"
  SIA_smuggle_radio_sets_desc: "เครือขายเครื่องวิทยุที่ปฏิบัติงานอยางเงียบเชียบจะชวยใหขบวนการตอตานติดตอกับมิตรตางชาติไดอยูเสมอ"
  HOL_recall_conrad_helfrich: "เรียกตัวคอนราด เฮลฟริช กลับจากอินดีส"
  HOL_recall_conrad_helfrich_desc: "ในยามคับขันเชนนี้ เราตองใหความสําคัญกับมาตุภูมิเหนือสิ่งอื่นใด คอนราด เฮลฟริช ในฐานะพลเรือเอกที่เกงที่สุดของกองทัพเรือหลวงเนเธอรแลนด ตองกลับสูเนเธอรแลนด"
  INS_is_taking_volksraad: "กําลังผานกฎหมายในโฟลกสรัด"
  INS_volksraad_cat: "โฟลกสรัด"
  INS_volksraad_cat_desc: "สภาประชาชน หรือที่เรียกในภาษาดัตชวาโฟลกสรัด กอตั้งขึ้นในป 1918 เพื่อพยายามนําประชาธิปไตยมาสูหมูเกาะอินดีสตะวันออก ซึ่งเปนสวนหนึ่งของการดําเนิน “นโยบายจริยธรรม” ที่นั่งในสภามีทั้งเจาหนาที่ชาวดัตชและชาวอินโดนีเซีย ซึ่งไดรับคัดเลือกดวยวิธีตางๆ แมเนเธอรแลนดยังคงมีสิทธิยับยั้งอยางไมมีเงื่อนไข แตโฟลกสรัดก็สามารถเสนอญัตติและรางกฎหมายตอรัฐบาลได"
  INS_volksraad_allow_language_in_schools: "อนุญาตใหใชภาษาอินโดนีเซียในโรงเรียน"
  INS_volksraad_allow_language_in_schools_desc: "การเขาถึงการศึกษาขั้นสูงในอินดีสสวนใหญจํากัดอยูเฉพาะชาวดัตชและชาวอินโดนีเซียชนชั้นมั่งคั่งที่พูดภาษาดัตชได เพราะเปนภาษาเดียวที่ใชสอนในระดับอุดมศึกษา ญัตติในโฟลกสรัดที่เสนอใหเปดโรงเรียนภาษาอินโดนีเซียกําลังรอการลงมติจากผูสําเร็จราชการ"
  INS_volksraad_allow_language_in_government: "อนุญาตใหใชภาษาอินโดนีเซียในรัฐบาล"
  INS_volksraad_allow_language_in_government_desc: "ตําแหนงในรัฐบาลของอินดีส รวมถึงโฟลกสรัด ลวนกําหนดใหตองใชภาษาดัตชไดอยางคลองแคลว ทําใหสมาชิกโฟลกสรัดจํานวนมาก โดยเฉพาะผูแทนชุมชนพื้นเมือง ตั้งคําถามถึงความชอบธรรมของประชาธิปไตยนี้ พวกเขาไดรวมกันเสนอญัตติยืนยันวาตําแหนงในรัฐบาลควรเปดใหผูพูดภาษาอินโดนีเซียเขารับไดเมื่อเปนไปได"
  INS_volksraad_remove_education_quotas: "ยกเลิกระบบโควตาการศึกษา"
  INS_volksraad_remove_education_quotas_desc: "ระบบการศึกษาในหมูเกาะอินดีสตะวันออกปจจุบันใชระบบโควตา ซึ่งตองรับนักเรียนชาวอินโดนีเซียและนักเรียนชาวดัตชตามจํานวนที่กําหนด เรื่องนี้เปนที่ถกเถียงในโฟลกสรัดเพราะเชื่อกันโดยทั่วไปวาเอนเอียงเขาขางชาวดัตชอยางไมเปนธรรม แมเราจะปลอยใหโฟลกสรัดถกเถียงเรื่องการปฏิรูปไปอีกหลายปได แตการยกเลิกระบบโควตาไปเลยอาจคุมคากวา"
  INS_volksraad_reduce_rubber_export_tax: "ลดภาษีสงออกยางพาราของเอกชน"
  INS_volksraad_reduce_rubber_export_tax_desc: "ปจจุบันมีการเก็บภาษีบริษัทเอกชนที่สงออกยางพาราในอัตราสูงมาก ทําใหเราผูกขาดตลาดไวได อยางไรก็ตาม สิ่งนี้ทําใหเศรษฐกิจบางภูมิภาคซบเซาเพราะสวนยางเอกชนไมสามารถดําเนินกิจการได ในตอนที่บังคับใชถือวาคุมคา แตการกีดกันทางการคาระหวางประเทศจากภาวะเศรษฐกิจตกตํ่าครั้งใหญทําใหเศรษฐกิจการสงออกยางของเราทํากําไรไดนอยลงมาก การลดภาษีเพื่อกระตุนเศรษฐกิจจึงอาจคุมคา"
  INS_volksraad_knil_rank_limit: "ผานกฎหมายตอตานการเลือกปฏิบัติในยศทหาร"
  INS_volksraad_knil_rank_limit_desc: "แมจะไมมีกฎเกณฑอยางเปนทางการที่หามชาวพื้นเมืองอินโดนีเซียเลื่อนยศใน KNIL แตก็มีกฎที่ไมไดเขียนไวหามเรื่องนี้ ทําใหแมแตบุคลากรทางทหารที่มีผลงานดีเยี่ยมที่สุดก็ไมสามารถกาวหนาเกินยศพันเอกได หลายพรรคในโฟลกสรัดไดกดดันใหรัฐบาลยอมรับความทุมเทของนายทหารชาวอินโดนีเซียที่มีผลงานโดดเดน"
  INS_volksraad_legalize_displaying_flag: "อนุญาตใหแสดงธงแดง-ขาวไดอยางถูกกฎหมาย"
  INS_volksraad_legalize_displaying_flag_desc: "ธงแดง-ขาวของ “อินโดนีเซีย” ปจจุบันเปนสิ่งผิดกฎหมายหากแสดงในที่สาธารณะ เนื่องจากเกี่ยวของกับองคกรชาตินิยมตอตานอาณานิคม การอนุญาตใหแสดงธงไดอยางถูกกฎหมายนาจะเปนการแสดงความเต็มใจที่จะรวมมือของเรา และหยุดยั้งการกลายเปนหัวรุนแรงของกลุมชาตินิยมทั่วหมูเกาะ"
  INS_volksraad_education_subsidies_for_indonesians: "เปดเงินอุดหนุนการศึกษาแกผูอยูอาศัยที่ไมใชชาวดัตช"
  INS_volksraad_education_subsidies_for_indonesians_desc: "มีการถกเถียงอยางตอเนื่องในโฟลกสรัดเกี่ยวกับเงินอุดหนุนและทุนการศึกษาที่มอบใหนักเรียนชาวดัตชในหมูเกาะอินดีสตะวันออก ผูแทนชุมชนพื้นเมืองหลายคนในโฟลกสรัดโตแยงวาระบบนี้ควรขยายไปยังนักเรียนทุกคนโดยไมคํานึงถึงภูมิหลัง ซึ่งจะสรางไมตรีจิตจากประชาชนไดมาก แมจะตองใชเงินไมนอย"
  INS_volksraad_indonesian_national_language: "ทําใหภาษาอินโดนีเซียเปนภาษาราชการ"
  INS_volksraad_indonesian_national_language_desc: "ภาษาอินโดนีเซียไดกลายเปนภาษากลางในหลายพื้นที่ของหมูเกาะ เชื่อมชองวางทางภาษาระหวางหลายวัฒนธรรม เมื่อภาษาอินโดนีเซียไดรับอนุญาตใหใชในการศึกษาและในรัฐบาลแลว ผูแทนในโฟลกสรัดจํานวนมากจึงยื่นคํารองขอใหรับรองภาษานี้ตามกฎหมายเปนภาษาราชการของอาณานิคม โดยมีสถานะเทาเทียมกับภาษาดัตช"
  INS_volksraad_official_flag: "ใชธงอินโดนีเซียอยางเปนทางการ"
  indonesia_volksraad_official_flag_effect_tt: "ธงของเราจะเปลี่ยนเปนธงแดง-ขาว"
  INS_volksraad_official_flag_desc: "ญัตติในโฟลกสรัดที่ผลักดันอํานาจปกครองตนเองประสบความสําเร็จในที่สุด และดินแดนที่เมื่อไมกี่ปกอนยังเรียกวาหมูเกาะอินดีสตะวันออกของดัตช บัดนี้คือประเทศในเครือจักรภพอินโดนีเซีย ธงของเราควรปรับเปลี่ยนเพื่อสะทอนความเปลี่ยนแปลงนี้"
  indonesia_volksraad_passed_6: "ไดผานกฎหมายตอตานการเลือกปฏิบัติในกองทัพแลว"

