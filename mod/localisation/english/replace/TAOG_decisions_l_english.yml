  AST_nationalization: "เริ่มการโอนเปนของรัฐ"
  AST_nationalizing_process_tt: "เปดใชการตัดสินใจ §Yเริ่มการโอนเปนของรัฐ§! ซึ่งจะให §Yการโอนเปนของรัฐกําลังดําเนินอยู§! จําเปนสําหรับแผนยุทธศาสตรดานลาง และจะถูกนําออกเมื่อบรรลุ §Yออสเตรเลียของประชาชน§! §Rแผนยุทธศาสตรที่ไมไดเลือกจะถูกล็อก!§!"
