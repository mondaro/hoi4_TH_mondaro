  INS_take_batavia: "ยึดอํานาจเหนือเกาะชวา"
  INS_take_batavia_desc: "ความโลภของดัตชที่ทําใหพวกเขาลงทุนแทบทั้งหมดในชวาโดยละเลยหมูเกาะทางตะวันออก ทําใหชวากลายเปนจุดออนของทั้งอาณานิคม นี่จะเปนจุดจบของพวกเขา! เราตองสงกองกําลังบุกเขาชวาและทําลายเครือขายการสื่อสารและเสบียงของดัตช ทําใหรัฐบาลอินดีสไมสามารถดําเนินงานได"
  INS_hold_batavia_HOL: "รักษาเกาะชวา"
  INS_hold_batavia_HOL_desc: "กองกําลังฝายสาธารณรัฐไดเริ่มปฏิบัติการยายกําลังสวนใหญเขาสูชวา โดยพยายามเขาควบคุมทั้งเกาะ เราตองตานทานตอไป ปฏิบัติการของพวกเขามีความเสี่ยง และเปดโอกาสใหเราโคนลมรัฐบาลของพวกเขาไดหากพวกเขาลมเหลว"

  INS_militias_moestopo_mission: "มุสโตโปเรียกรองการเลื่อนยศเพื่อตอบแทนความทุมเทของเขา"
  INS_militias_pki_uprising_mission: "การลุกฮือของคอมมิวนิสตหลีกเลี่ยงไมได"

  INS_pacific_revolution_cat: "การปฏิวัติแปซิฟก"
  INS_instigate_in_country: "ปลุกปนการปฏิวัติใน[FROM.GetName]"
  INS_instigate_in_country_desc: "การปฏิวัติของเราไมไดจบลงเมื่อทหารอาณานิคมคนสุดทายถูกขับไลออกจากแผนดิน[ROOT.GetAdjective] กรรมกรและชาวนาแหง[FROM.GetName]ยังทนทุกขอยูใตแอกเดียวกับที่เราสลัดทิ้งไปแลว และบัดนี้พวกเขามองเราเปนขอพิสูจนวาผูกดขี่สามารถถูกโคนได เราจะสงนักปลุกระดมไปอยูทามกลางพวกเขา แจกใบปลิว ใหทุนสหภาพแรงงาน และโหมไฟแหงความไมพอใจจนกวาสภาพการณจะสุกงอมสําหรับการปฏิวัติ"

  INS_launch_revolution: "เรียกรองการปฏิวัติ"
  INS_launch_revolution_desc: "สภาพการณใน[FROM.GetName]สุกงอมแลว สายลับของเรารายงานวาความไมสงบในโรงงานและทองนาเพิ่มขึ้น และหนวยพรรคในทองถิ่นพรอมลงมือ ถึงเวลาเรียกรองใหกรรมกรและชาวนาแหง[FROM.GetName]ลุกขึ้นยึดสิ่งที่เปนของพวกเขาโดยชอบธรรม"

  INS_anti_colonialist_bonus: "เผยแพรแนวคิดตอตานอาณานิคมใน[FROM.GetName]"
  INS_anti_colonialist_bonus_desc: "ประชาชนแหง[FROM.GetName]ตรากตรําทํางานเพื่อประโยชนของนายตางชาติ ถูกบังคับใหรับใชผลประโยชนที่ไมใชของตน เราจะเตือนใหพวกเขารูวาการยอมจํานนเปนทางเลือก และนายของพวกเขาไมไดแข็งแกรงอยางที่แสรงทํา"

  INS_revolutionary_sentiment: "รวมมือกับนักปฏิวัติ[FROM.GetAdjective]"
  INS_revolutionary_sentiment_desc: "ใน[FROM.GetName]มีผูที่ลุกขึ้นตอสูเพื่ออุดมการณนี้ดวยตนเองแลว พวกเขาขาดการจัดตั้งและทรัพยากร แตไมขาดความมุงมั่น ดวยการประสานงานกับกลุมเหลานี้ เราจะเรงการลมสลายของระเบียบเดิมได แมความไรเสถียรภาพที่ตามมาจะทําใหปกครองประเทศไดยากขึ้นในระยะสั้นก็ตาม"

  INS_arm_militias: "ติดอาวุธใหกองกําลังทองถิ่น[FROM.GetAdjective]"
  INS_arm_militias_desc: "ใบปลิวและสุนทรพจนพาการปฏิวัติไปไดเพียงระดับหนึ่ง เมื่อถึงเวลา สหายของเราใน[FROM.GetName]ตองสามารถตอสูได อาวุธและเสบียงสวนเกินจะถูกลักลอบสงไปใหกองกําลังที่เห็นอกเห็นใจ เพื่อใหฝายปฏิกิริยาตองเผชิญกับประชาชนที่มีอาวุธ ไมใชประชาชนที่ไรทางสู"
  INS_arm_militias_tt: "หากเกิดสงครามกลางเมือง ฝายคอมมิวนิสตจะเริ่มตนดวยกองพลเพิ่มเติม"

  INS_propoganda_mission: "เผยแพรลัทธิคอมมิวนิสตทั่ว[FROM.GetName]"
