  AST_union_strike: "จัดการนัดหยุดงาน"
  AST_union_strike_desc: "คนงานของเราผละงานออกจากที่ทํางาน เรียกรองสภาพการทํางานและสิทธิที่ดีขึ้น สิ่งนี้จะกดดันใหรัฐบาลตองออกการปฏิรูปใหมอยางแนนอน"
  AST_veterans_revolt: "การกอกบฏของทหารผานศึก"
  AST_veterans_revolt_desc: "กองทัพมีสมาชิกที่ตอตานคอมมิวนิสตจํานวนมาก หลายคนเคยอยูในกลุมฟาสซิสตมากอน พวกเขาเกลียดชังลัทธิคอมมิวนิสต และยอมจับอาวุธเสียดีกวาปลอยใหมันขึ้นสูอํานาจ\nหากเราใชเวลานานเกินไปในการปฏิวัติ หรือปลอยใหเสถียรภาพตกตํ่าเกินไป พวกเขาจะลงมือเองเพื่อปองกันไมใหมันเกิดขึ้น"
  AST_organize_in_nation: "แทรกซึมสหภาพแรงงานใน §Y[FROM.GetName]§!"
  AST_organize_in_nation_desc: "ขบวนการแรงงานไมมีพรมแดน ดวยการทุมทรัพยากรใหเครือขายของสหายเรา เราสามารถฝงนักจัดตั้งคอมมิวนิสตไวในสหภาพแรงงานของ[FROM.GetName] สรางแรงสนับสนุนระดับรากหญาแกการปฏิวัติจากภายในชนชั้นแรงงาน"
  AST_civil_war_in_nation: "ปลุกปนการปฏิวัติใน §Y[FROM.GetName]§!"
  AST_civil_war_in_nation_desc: "เมล็ดพันธุที่เราหวานไวพรอมผลิดอกออกผลแลว การสนับสนุนคอมมิวนิสตใน[FROM.GetName]เพิ่มขึ้นจนการปฏิวัติอยางเปดเผยอยูแคเอื้อม ดวยเงินทุน นักปลุกระดม และการผลักดันในจังหวะที่เหมาะสม เราสามารถเปลี่ยนความไมพอใจของประชาชนใหเปนการลุกฮือดวยอาวุธ นํา[FROM.GetName]เขาใกลรัฐกรรมกรที่สมควรไดรับอีกกาวหนึ่ง"
  AST_take_it_to_foreign_streets: "จัดการเดินขบวนสมานฉันทแรงงานสากล"
  AST_take_it_to_foreign_streets_desc: "กรรมกรไมมีพรมแดน เราจะเปดการรณรงคระหวางประเทศอยางประสานงาน สงนักจัดตั้งคอมมิวนิสตชาวออสเตรเลียลงสูทองถนนของทุกชาติที่อิทธิพลของเราหยั่งรากแลว ปลุกขบวนการทองถิ่นใหกลับมามีชีวิตชีวา และรักษาเปลวไฟแหงการปฏิวัติใหลุกโชนตอไป"
  AST_take_it_to_foreign_streets_tt: "ขยายระยะเวลาของอิทธิพลคอมมิวนิสตตางชาติออกไป 60 วัน ในทุกชาติที่แทรกซึมอยูในปจจุบัน"
  AST_raj_locked_tt: "จะไมสามารถตั้งเปาหมายที่ราชได จนกวานิวซีแลนด มลายา พมา ฟลิปปนส และอินโดนีเซียจะตกอยูใตการปกครองของคอมมิวนิสตทั้งหมด"
