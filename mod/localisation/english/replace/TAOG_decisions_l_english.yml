  SIA_the_revolution_of_24th_june: "การปฏิวัติ 24 มิถุนายน"
  SIA_suppressing_the_rebellion_of_1933: "ปราบกบฏ พ.ศ. 2476"
  SIA_the_king_of_krung_thon: "พระเจากรุงธนบุรี"
  SIA_blood_of_suphan: "เลือดสุพรรณ"
  SIA_thai_soldiers_blood: "เลือดทหารไทย"
  SIA_undauntedly_love_nation: "รักชาติไมหวั่นภัย"

  #LIMITED WAR
  SIA_limited_war_cat: "สงครามจํากัดขอบเขต"
  SIA_limited_war_cat_desc: "เรายังไมอาจหวังเอาชนะมหาอํานาจในภูมิภาคนี้ในสงครามเปดเต็มรูปแบบได — อยางนอยก็ยังไมใชตอนนี้ แตดวยการทวงสิทธิ์ทีละสวนผานการรบที่กําหนดขอบเขตไวอยางรอบคอบ เราจะคอย ๆ บั่นทอนสถานะของพวกเขา ขณะที่กําลังของเราเองก็เติบโตขึ้นเรื่อย ๆ"
  SIA_start_limited_war_indochina: "เปดสงครามจํากัดขอบเขตในอินโดจีนกับ [FROM.GetName]"
  SIA_start_limited_war_indochina_tt_main: "เริ่ม§Yสงครามจํากัดขอบเขต§!กับ §Y[FROM.GetName]§!\nหากควบคุมรัฐที่ถูกเนนไวทั้งหมดของ §Y[FROM.GetName]§! ได เราจะไดรัฐเหลานั้นมาโดยไมตองยกระดับเปนสงครามเต็มรูปแบบ\n§Rหากความคืบหนาการยอมจํานนของเราเกิน [?var:global.limited_war_surrender_threshold|%.0] เราจะแพสงครามจํากัดขอบเขต§!\n\n§Rการแพสงครามจํากัดขอบเขตอาจทําใหเราตองคืนดินแดนที่ยึดมาไดกอนหนานี้§!"
  SIA_start_limited_war_rejoin_faction: "เราจะออกจากฝายปจจุบันเปนการชั่วคราว และกลับเขารวมฝายอีกครั้งเมื่อ§Yสงครามจํากัดขอบเขต§!สิ้นสุดลง"
  SIA_start_limited_war_can_join_faction: "เราจะสามารถเขารวมฝายไดอีกครั้งหลังจาก§Yสงครามจํากัดขอบเขต§!สิ้นสุดลง"
  is_not_engaged_in_a_limited_war: "ไมไดอยูใน§Yสงครามจํากัดขอบเขต§!"
  SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
  SIA_limited_war_indochina_desc: "ยึดครองรัฐที่ถูกเนนไวทั้งหมดเพื่อชนะ§Yสงครามจํากัดขอบเขต§! และอางสิทธิ์ในรัฐเหลานั้นโดยไมตองยกระดับเปนสงครามเต็มรูปแบบ\n§Rหากความคืบหนาการยอมจํานนของเราเกิน [?var:global.limited_war_surrender_threshold|%.0] เราจะแพสงครามจํากัดขอบเขต§!"
  SIA_limited_war_indochina_target: "§Yสงครามจํากัดขอบเขต§!กับ §Y[?var:limited_war_target.GetName]§!"
  SIA_limited_war_indochina_no_target: "สงครามจํากัดขอบเขตลมเหลว"
  SIA_start_limited_war_malaysia_burma: "เปดสงครามจํากัดขอบเขตกับ [FROM.GetName]"


  SIA_new_territories_administration_cat: "การบริหารดินแดนใหม"
  SIA_new_territories_administration_cat_desc: "การพิชิตเปนเพียงจุดเริ่มตน ดินแดนที่เรายึดมาไดตองไดรับการปกครอง พัฒนา และปองกัน จึงจะกลายเปนสวนหนึ่งของชาติอยางยั่งยืน มิใชภาระที่ลอใหผูอื่นมาชวงชิงคืน"
  SIA_finish_the_triangular_defense_network: "สรางเครือขายปองกันสามเหลี่ยมใหสมบูรณ"
  SIA_finish_the_triangular_defense_network_desc: "เมื่อปอมปราการทั้งสองแหงทางเหนือและทางใตสรางเสร็จแลว เราสามารถเชื่อมเขากับกรุงเทพฯ เปนเครือขายปองกันรูปสามเหลี่ยม หากแหงหนึ่งแตก อีกสองแหงก็ยังคงปฏิบัติการได"
  has_built_fortress_saigon: "ไดสรางปอมปราการไซงอนแลว"
  has_built_fortress_hanoi: "ไดสรางปอมปราการฮานอยแลว"
  SIA_develop_phibunsongkhram: "พัฒนา [1067.GetName]"
  SIA_develop_southern_indochina: "พัฒนาอินโดจีนตอนใต"
  SIA_develop_northern_indochina: "พัฒนาอินโดจีนตอนเหนือ"
  SIA_develop_northern_malaya: "พัฒนาสี่รัฐมาลัย"
  SIA_develop_eastern_burma: "พัฒนาสหรัฐไทยเดิม"
  SIA_use_abandoned_french_tools: "ใชเครื่องมือที่ฝรั่งเศสทิ้งไว"
  SIA_use_abandoned_french_tools_desc: "ฝรั่งเศสทิ้งเครื่องมือหนักบางสวนไวในดินแดนที่เรายึดครอง เราสามารถนํามาใชประโยชนเองได"
  SIA_fortress_saigon: "ปอมปราการไซงอน"
  SIA_fortress_saigon_desc: "ดินแดนทางเหนือของจักรวรรดิใหมของเราจะไดรับการปกปองโดยฮานอย ดวยเทือกเขาทางเหนือและแมนํ้าแดงทางดานหนา ที่ตั้งของเมืองนี้จึงเหมาะอยางยิ่งที่จะตานทานผูรุกราน"
  SIA_fortress_hanoi: "ปอมปราการฮานอย"
  SIA_fortress_hanoi_desc: "ดินแดนทางใตของจักรวรรดิจะไดรับการปกปองโดยไซงอน นครปอมปราการแหงนี้จะเปนปราการพิทักษกรุงเทพฯ ปกปองอาว[ROOT.GetName]จากผูรุกราน"
  
