  SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "ชักชวนพิชิต เกรียงศักดิ์พิชิต ใหเขารวมอุดมการณเสรีไทย หากสําเร็จ เขาจะเขาขางเราเมื่อสงครามกลางเมืองเริ่มขึ้น"
