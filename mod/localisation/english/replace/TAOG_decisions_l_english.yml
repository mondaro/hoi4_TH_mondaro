  SIA_sway_phin_choonhavan_to_seri_thai_desc: "ชักชวนผิน ชุณหะวัณ ใหเขารวมอุดมการณเสรีไทย หากสําเร็จ เขาจะเขาขางเราเมื่อสงครามกลางเมืองเริ่มขึ้น"
  SIA_sway_tiang_sirikhan_to_seri_thai: "โนมนาวเตียง ศิริขันธ"
  SIA_sway_tiang_sirikhan_to_seri_thai_desc: "ชักชวนเตียง ศิริขันธ ใหเขารวมอุดมการณเสรีไทย หากสําเร็จ เขาจะเขาขางเราเมื่อสงครามกลางเมืองเริ่มขึ้น"

  SIA_khana_ratsadon_dummy_military: "ภัยรัฐประหารจากฝายทหาร"
  SIA_khana_ratsadon_dummy_military_tt: "ฝายทหารจะกอรัฐประหารหากเราสรางความไมพอใจใหพวกเขามากเกินไป เพื่อหลีกเลี่ยงสงครามกลางเมือง เราไมควรปลอยใหมี §Y$idea_SIA_military_rebellious$§! นานเกินไป"
  SIA_khana_ratsadon_dummy_military_desc: "ฝายทหารเปนกลุมที่ทรงอิทธิพลในคณะราษฎร พวกเขาจะไมเห็นชอบกับนโยบายที่มองวาขัดตอผลประโยชนของตน แตจะสนับสนุนสิ่งที่สงเสริมการเสริมสรางกําลังทหารของประเทศ"
  SIA_khana_ratsadon_military_coup_mission: "ฝายทหารกําลังวางแผนโคนลมรัฐบาล!"
  SIA_khana_ratsadon_military_coup_mission_desc: "ฝายทหารมองวานโยบายของรัฐบาลปจจุบันเปนภัยคุกคามตอผลประโยชนของตน และกําลังวางแผนอยางจริงจังที่จะโคนรัฐบาล หากสถานะของพวกเขาไมดีขึ้น"

  SIA_khana_ratsadon_dummy_civilian: "ภัยรัฐประหารจากฝายพลเรือน"
  SIA_khana_ratsadon_dummy_civilian_tt: "ฝายพลเรือนจะกอรัฐประหารหากเราสรางความไมพอใจใหพวกเขามากเกินไป เพื่อหลีกเลี่ยงสงครามกลางเมือง เราไมควรปลอยใหมี §Y$idea_SIA_civilian_rebellious$§! นานเกินไป"
  SIA_khana_ratsadon_dummy_civilian_desc: "ฝายพลเรือนเปนกลุมที่ทรงอิทธิพลในคณะราษฎร พวกเขาจะไมเห็นชอบกับนโยบายที่มองวาขัดตอผลประโยชนของตน แตจะสนับสนุนสิ่งที่สงเสริมประชาธิปไตยและพลเรือน"
  SIA_khana_ratsadon_civilian_coup_mission: "ฝายพลเรือนกําลังวางแผนโคนลมรัฐบาล!"
  SIA_khana_ratsadon_civilian_coup_mission_desc: "ฝายพลเรือนมองวานโยบายของรัฐบาลปจจุบันเปนภัยคุกคามตอผลประโยชนของตน และกําลังวางแผนอยางจริงจังที่จะโคนรัฐบาล หากสถานะของพวกเขาไมดีขึ้น"

  SIA_promote_civilian_wing: "เอาใจฝายพลเรือน"
  SIA_promote_civilian_wing_desc: "ดวยการทุมนํ้าหนักของรัฐบาลสนับสนุนวาระของฝายพลเรือน ทั้งการปฏิรูปที่ดิน ระบบศาล และรัฐธรรมนูญ เราจะไดรับความขอบคุณจากกลุมของปรีดี ทวาการลําเอียงเชนนี้ยอมไมรอดพนสายตาใคร เหลานายทหารจะขุนเคือง และความปนปวนตองานบริหารราชการตามปกติจะทําใหเราตองจายราคาแพงกวาทุกอยางจะลงตัว"
  SIA_promote_military_wing: "เอาใจฝายทหาร"
  SIA_promote_military_wing_desc: "ดวยการตามใจขอเรียกรองของเหลานายทหารและการอวดแสนยานุภาพของกองทัพ เราจะไดรับความนิยมจากกลุมของจอมพล ป. ทวาการลําเอียงเชนนี้ยอมไมรอดพนสายตาใคร การปรับขั้วอํานาจจะทําใหกิจวัตรของกองทัพสับสนวุนวาย และความปนปวนตองานบริหารราชการตามปกติจะทําใหเราตองจายราคาแพงกวาทุกอยางจะลงตัว เปนเครื่องมือหยาบ ๆ ที่เหมาะใชเพียงเพื่อฉุดฝายนี้กลับมาจากปากเหวแหงการกบฏเทานั้น"
  SIA_cultivate_civilian_wing: "บมเพาะความสัมพันธกับฝายพลเรือน"
  SIA_cultivate_civilian_wing_desc: "สถานะที่คําสั่งสํานักพระราชวังทําใหเราไดรับจากชนชั้นนํา ไดเปดทางสูการเกี้ยวพาฝายพลเรือนอยางอดทนและตอเนื่อง ไมมีการลําเอียงอยางกะทันหันที่จะกอใหเกิดกระแสตอตาน มีเพียงความพยายามอยางชา ๆ แตมั่นคงในการดึงกลุมของปรีดีมาเปนพวก ดวยการยอมผอนปรนทีละเรื่อง เปนหนทางที่ยาวไกล แตเราจะเดินไปไดไกลเทาที่ตองการ"
  SIA_cultivate_military_wing: "บมเพาะความสัมพันธกับฝายทหาร"
  SIA_cultivate_military_wing_desc: "สถานะที่คําสั่งสํานักพระราชวังทําใหเราไดรับจากชนชั้นนํา ไดเปดทางสูการเกี้ยวพาฝายทหารอยางอดทนและตอเนื่อง ไมมีการลําเอียงอยางกะทันหันที่จะกอใหเกิดกระแสตอตาน มีเพียงความพยายามอยางชา ๆ แตมั่นคงในการดึงเหลานายทหารมาเปนพวก ดวยการยอมผอนปรนทีละเรื่อง เปนหนทางที่ยาวไกล แตเราจะเดินไปไดไกลเทาที่ตองการ"
  SIA_end_factionalism_mission: "ประคับประคองแนวรวม"
  SIA_end_factionalism_mission_desc: "ทั้งสองฝายของคณะราษฎรตางยืนหยัดสนับสนุนรัฐบาลอยางเต็มที่ หากเรารักษาทั้งสองฝายไวที่ระดับ§Gสนับสนุนเต็มที่§!ไดนาน §Y270§! วัน การชิงดีชิงเดนระหวางกันก็จะยุติลงอยางถาวร แตหากความกระตือรือรนของฝายใดฝายหนึ่งสั่นคลอน ก็ตองเริ่มตนใหมทั้งหมด"

  

