  AST_election_approaching_cat: "การเลือกตั้งใกลเขามา"
  AST_election_approaching_cat_desc: "รัฐบาลชุดหนึ่งยังไมทันไดตั้งหลัก การเลือกตั้งครั้งถัดไปก็เริ่มใกลเขามาแลว พรรคการเมืองประชาธิปไตยตางแยงชิงทุกสิ่งที่อาจเพิ่มคะแนนนิยม โดยหวังวาจะเพียงพอใหควาชัยเมื่อหนวยเลือกตั้งเปดและหีบบัตรเต็มไปดวยคะแนนเสียง"
  AST_final_reforms_mission: "การปฏิรูปครั้งสุดทาย"
  AST_final_reforms_mission_desc: "ดวยความเปนผูนําที่มั่นคง แนวโนมอนุรักษนิยม และความภักดีตออังกฤษ UAP ไดเสริมฐานสนับสนุนและทําใหโอกาสไดครองอํานาจอีกสมัยเพิ่มขึ้นเรื่อยๆ เพื่อรักษาการสนับสนุนจากสาธารณชน ผูนําพรรคตองเรงการปฏิรูป\n\n§Yผลขณะมีผล:§!\n§W(แผนยุทธศาสตร§Yประชาธิปไตย§!):\nลดเวลาดําเนินการ §Y7§! วัน§!"
  AST_final_reforms_effect_tt: "\nผลขณะที่ §Y$AST_final_reforms_mission$§! มีผล (§Y180§! วัน):"
  AST_labor_campaign_tour_mission: "การหาเสียงทั่วประเทศของพรรคแรงงาน"
  AST_labor_campaign_tour_mission_desc: "ในภารกิจเปนตัวแทนของพลเมืองทุกคน ALP ไดปรับมุมมองใหมตอจักรวรรดินิยมและความภักดีของออสเตรเลียตอจักรวรรดิ ความตองการภายในประเทศตองมากอน และผลประโยชนตางชาติไมควรมีความสําคัญเหนือกวาอีกตอไป\n\nเพื่อสงสารนี้ไปถึงทั้งพรรครัฐบาลปจจุบันและผูมีสิทธิเลือกตั้ง ALP จะออกเดินสายหาเสียงทั่วประเทศ\n\n§Yผลขณะมีผล:§!\n§Wคะแนนเสียง §YA.L.P§! เพิ่มขึ้นรายวัน: §G+0.05§!§!"
  AST_labor_campaign_tour_effect_tt: "\nผลขณะที่ §Y$AST_labor_campaign_tour_mission$§! มีผล (§Y180§! วัน):\nคะแนนเสียง §YA.L.P§! เพิ่มขึ้นรายวัน: §G+0.05§!\n\nผลในอีก §Y180§! วัน:"

  AST_election_season_cat: "ฤดูเลือกตั้ง"
  AST_election_season_cat_desc: "รัฐบาลชุดหนึ่งยังไมทันไดตั้งหลัก ชุดถัดไปก็เตรียมเขามาแทนที่แลว ณ จุดนี้แทบไมมีอะไรที่จะโนมนาวความนิยมของประชาชนได แตนั่นก็ไมไดหยุดพรรคการเมืองจากการพยายาม ยังไมจบจนกวาจะจบจริง และวันนั้นจะมาถึงที่หีบเลือกตั้ง"
  AST_election_countdown: "นับถอยหลังสูการเลือกตั้ง"
  AST_election_countdown_desc: "เหลือเวลาอีกเพียงไมกี่วันกอนหนวยเลือกตั้งจะเปด\n\n§W$AST_expected_election_winner_tt$§!"
  AST_government_formation_period: "ชวงจัดตั้งรัฐบาล"
  AST_government_formation_period_desc: "ทุกพรรคตองการอํานาจในการกําหนดนโยบายของตนเอง แตหากสถานการณบางอยางบังคับ รัฐบาลเอกภาพแหงชาติอาจเปนทางเลือกที่สมเหตุสมผลที่สุด\n\n§W§Yผลขณะมีผล:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$ อาจจัดตั้ง§Yรัฐบาลเอกภาพแหงชาติ§!\n\nจัดตั้ง§Yรัฐบาลเอกภาพแหงชาติ§!ไดในหนาตางการเลือกตั้งแบบประชาธิปไตย ซึ่งอยูในผังยุทธศาสตรของออสเตรเลีย§!"

  AST_war_is_coming_cat: "สงครามกําลังมา"
  AST_war_is_coming_cat_desc: "ความตึงเครียดเพิ่มสูงขึ้น ทั้งเจาหนาที่และพลเมืองออสเตรเลียเริ่มตระหนักวาสงครามอาจหลีกเลี่ยงไมได ไมวานโยบายหรือผลประโยชนของพวกเขาจะปรารถนาเปนอื่นเพียงใด\n\nเราตองเรียกประชุมคณะรัฐมนตรีเพื่อตัดสินขั้นตอนปฏิบัติในกรณีถูกรุกราน แตกอนจะทําเชนนั้น อาจคุมคาที่จะดําเนินการบางอยางที่คณะรัฐมนตรีทั้งคณะอาจไมเห็นดวย"
  AST_seize_civilian_industry: "ยึดอุตสาหกรรมพลเรือน"
  AST_seize_civilian_industry_desc: "แมสินคาอุปโภคบริโภคจะเปนสิ่งจําเปนทั้งตอพลเมืองและเศรษฐกิจ แตก็ปฏิเสธไมไดวายามสงครามมาพรอมความจําเปนที่ยิ่งใหญกวา สงครามกําลังมา และเราจะพรอมเมื่อมันมาถึง"
  AST_scorch_the_north: "เผาผลาญภาคเหนือ"
  AST_scorch_the_north_desc: "หากเราคาดวาจะถูกรุกรานจากทางเหนือ ก็มีวิธีขัดขวางการรุกคืบเชนนั้น แมจะตองแลกดวยราคาที่ตองจาย แมนโยบายเผาผลาญแผนดินจะทําใหการพัฒนารัฐทางเหนือของเราถดถอย แตอาจเปนสิ่งที่จําเปนในการตานทานผูรุกราน"
  AST_scorch_the_north_tt: "§Yผลเมื่อรัฐทางเหนือถูกยกพลขึ้นบก:§!"
  AST_the_brisbane_line: "แนวบริสเบน"
  AST_the_brisbane_line_desc: "ขีดความสามารถในการปองกันของออสเตรเลียอาจไมแข็งแกรงพอจะตานทานการรุกรานจากตางชาติไดทั้งหมด ดวยการใชนโยบายที่ใหความสําคัญกับการปองกันพื้นที่สําคัญอยางแข็งแกรง แทนที่จะปองกันทุกพื้นที่อยางออนแอ เราจะรักษาพื้นที่ที่พัฒนาแลวและมีผูคนอาศัยมากที่สุดของ[AST.GetName]ไวภายใตการควบคุมของเราได\n\nแมนโยบายเชนนี้จะถูกคัดคานอยางไมตองสงสัยจากผูที่ปฏิเสธการยอมจํานนในทุกระดับ แตรัฐบาลมีหนาที่นํา[AST.GetName]ไปในทิศทางที่สมเหตุสมผล"
  AST_summon_the_cabinet_mission: "เรียกประชุมคณะรัฐมนตรี"
  AST_summon_the_cabinet_mission_desc: "เรียกนักการทูต เจาหนาที่ และนักทฤษฎีมายังแคนเบอรรา ตองมีการหารือถึงความเปนไปไดที่จะถูกรุกราน"
  AST_summon_the_cabinet_tt1: "\nเหตุการณนี้จะสรางความปนปวนแกรัฐบาลชุดปจจุบัน และอาจนําไปสูการ§Yลมสลาย§!"
  AST_australian_accusations_modifier: "ขอกลาวหาของออสเตรเลีย"

  AST_cabinet_trust_cat: "ความไววางใจในคณะรัฐมนตรี"
  AST_cabinet_trust_increase_tt: "\n§Gเพิ่ม§! §Yความไววางใจในคณะรัฐมนตรี§!\n"
  AST_cabinet_trust_decrease_tt: "\n§Rลด§! §Yความไววางใจในคณะรัฐมนตรี§!\n"
  AST_cabinet_trust_remove_tt: "§Gนําออก§! §Yจิตวิญญาณแหงชาติดานความไววางใจในคณะรัฐมนตรี§!"
  AST_australian_comforts_fund: "£BoP_right_texticon  กองทุนบํารุงขวัญออสเตรเลีย"
  AST_australian_comforts_fund_desc: "รัฐบาลจะใหเกียรติผูเสียชีวิตรายหนึ่งจากเหตุเครื่องบินตกที่แคนเบอรรา ดวยการลงทุนในกองทุนบํารุงขวัญออสเตรเลีย ซึ่งภรรยาผูรอดชีวิตของเขาเปนอาสาสมัครที่กระตือรือรน\n\nกองทุนนี้มุงบรรเทาความยากลําบากของทหารออสเตรเลียในสนามรบ ดวยการสงสิ่งของที่เสริมเสบียงและชุดอุปกรณสวนตัวของพวกเขา การลงทุนนี้จึงเปนประโยชนตอความพยายามในสงครามดวย"
  AST_eminent_successors: "£BoP_right_texticon  ผูสืบทอดผูทรงเกียรติ"
  AST_eminent_successors_desc: "ผูเสียชีวิตบางรายจากโศกนาฏกรรมเครื่องบินตกที่แคนเบอรราเปนเจาหนาที่รัฐบาลที่ไดรับความเคารพอยางสูง แมไมมีสิ่งใดชดเชยชะตากรรมอันเลวรายของพวกเขาได แตการแตงตั้งผูสืบทอดผูทรงเกียรติสักไมกี่คนอาจชวยใหรัฐบาลมีเสถียรภาพ และฟนฟูความไววางใจทั้งของประชาชนและรัฐมนตรี"
  AST_critics_to_shame: "£BoP_right_texticon  ประจานผูวิจารณ"
  AST_critics_to_shame_desc: "โศกนาฏกรรมเครื่องบินตกที่แคนเบอรราสงผลกระทบตอคนทั้งชาติ ไมมีชาวออสเตรเลียคนใดที่ไมไดรวมไวอาลัย ในยามเชนนี้ ยอมมีผูที่หาประโยชนอยูเสมอ เราจะเปดโปงผูวิจารณที่สงเสียงดังที่สุดใหเห็นวาคําวิจารณของพวกเขาแทจริงคืออะไร นั่นคือความพยายามบอนทําลายความสงบเรียบรอย" 
  AST_approach_the_independents: "£BoP_left_texticon  เขาหาสมาชิกอิสระ"
  AST_approach_the_independents_desc: "รัฐบาลไรเสถียรภาพ เมื่อความเชื่อมั่นวารัฐบาลจะนําออสเตรเลียฝาความวุนวายครั้งลาสุดไปไดนั้นเลือนหายไปทุกวัน หากเขาหาสมาชิกอิสระ พวกเขาอาจถูกโนมนาวใหตระหนักวาการเปลี่ยนรัฐบาลจะเปนผลดีที่สุด"
  AST_a_sound_voice: "£BoP_left_texticon  เสียงแหงเหตุผล"
  AST_a_sound_voice_desc: "ในชวงความวุนวายทางการเมืองนี้ มีเสียงหนึ่งที่มั่นใจซึ่งดูเหมือนจะสรางความไววางใจในหมูชาวออสเตรเลีย หรือนี่จะเปนเสียงของผูนําคนตอไปของ[AST.GetName]?"
  AST_challenge_government_narrative: "£BoP_left_texticon  ทาทายคําบอกเลาของรัฐบาล"
  AST_challenge_government_narrative_desc: "รายละเอียดที่รัฐบาลเปดเผยเกี่ยวกับโศกนาฏกรรมเครื่องบินตกที่แคนเบอรราดูผิดปกติ ยอมนําไปสูการคาดเดาวาอาจมีขอมูลบางอยางถูกปดบัง นายทหาร RAAF ผูมากประสบการณจะทําเครื่องบินตกในสภาพอากาศที่เหมาะแกการบินไดอยางไร? ตองเรียกรองคําตอบจากรัฐบาล"
  AST_make_a_common_enemy: "สรางศัตรูรวม"
  AST_make_a_common_enemy_desc: "เสียงแหงความไมไววางใจทวีขึ้นหลังการสูญเสียเจาหนาที่ที่เสียชีวิตในโศกนาฏกรรมเครื่องบินตกที่แคนเบอรรา สถานการณผิดปกติของเหตุเครื่องบินตกไมใชปจจัยเดียวที่กระตุนความสงสัยวาตางชาติเขามาเกี่ยวของ เพราะทายที่สุดแลว ไมมีสิ่งใดหลอมรวมผูคนไดดีไปกวาศัตรูรวม"
  AST_make_a_common_enemy_tt: "§Rผลที่อาจเกิดขึ้นจากเหตุการณ:§!"
  AST_ensure_cabinet_loyalty: "รับประกันความภักดีของคณะรัฐมนตรี"
  AST_ensure_cabinet_loyalty_desc: "ภัยจากญัตติไมไววางใจจะไมเปนอันตรายตราบที่เสียงขางมากของคณะรัฐมนตรีลงมติสนับสนุนรัฐบาลชุดปจจุบัน เราจะรับประกันความภักดีของคณะรัฐมนตรี"
  AST_monarchist_intervention: "[GET_AST_MONARCHIST_INTERVENTION]"
  AST_monarchist_intervention_desc: "[GET_AST_MONARCHIST_INTERVENTION_DESC]"
  AST_the_crown_intervenes: "ราชบัลลังกเขาแทรกแซง"
  AST_the_crown_intervenes_desc: "นิวการด ผูพิทักษประเทศและความสงบเรียบรอย ผิดหวังกับความวุนวายในปจจุบัน สมาชิกระดับนําซึ่งยึดถือมรดกอังกฤษและอุดมการณนิยมกษัตริยไดติดตอเจาหนาที่อังกฤษเพื่อขอความชวยเหลือ\n\nบัดนี้ นิวการดรองขอตอรัฐบาล[AST.GetAdjective]ใหตอนรับการเขาแทรกแซงของอังกฤษ"
  AST_a_monarchist_appeal: "คํารองของฝายนิยมกษัตริย"
  AST_a_monarchist_appeal_desc: "นิวการด ผูพิทักษประเทศและความสงบเรียบรอย ผิดหวังกับความวุนวายในปจจุบัน สมาชิกระดับนําซึ่งยึดถือมรดกอังกฤษและอุดมการณนิยมกษัตริยเกรงวาออสเตรเลียอาจเดินซํ้ารอย[ENG.GetNameDef] ที่ความวุนวายทางการเมืองและของชาตินําไปสูจุดจบของเครือจักรภพอังกฤษอยางที่เรารูจัก รวมถึงระบอบกษัตริยดวย\n\nบัดนี้ นิวการดรองขอใหผูสําเร็จราชการนําประเทศฝาวิกฤตรัฐธรรมนูญที่อาจเกิดขึ้นนี้ โดยไมเรงรีบจัดตั้งรัฐบาลใหม และยังไมปลอยใหรัฐบาลเกากลับมาควบคุม บางทีอาจถึงเวลาที่[AST.GetName]จะเชิดชูขนบธรรมเนียมที่[ENG.GetNameDef]ทิ้งไว และใหชาติของเราไดรับการปกครองอยางรุงโรจนและเปนเอกภาพ"
  AST_the_crown_intervenes_trigger_tt: "สมาชิกนิวการดมากกวา §Y15,000§! คน"
  AST_add_the_crown_intervenes_tt: "เปดเผยแผนยุทธศาสตร:\nสาย §Y$AST_for_crown_and_empire$§!\n§Y$AST_the_kings_men$§!"
  AST_remove_the_crown_intervenes_tt: "นําแผนยุทธศาสตรออก:\nสาย §Y$AST_for_crown_and_empire$§!\n§Y$AST_the_kings_men$§!"
  AST_castle_crumbling_mission: "ปราสาทที่กําลังพังทลาย"
  AST_castle_crumbling_mission_desc: "ออสเตรเลียหันไปพึ่งผูนําของตนหลังโศกนาฏกรรมเครื่องบินตกที่แคนเบอรรา รัฐบาลชุดปจจุบันจะยังคูควรกับความไววางใจของประชาชนหลังการสูญเสียรัฐมนตรีหรือไม หรือการเปลี่ยนผูนําจะเปนผลดีที่สุด?"
  AST_castle_crumbling_mission_event_tt: "§Yผลของเหตุการณ:§!"
  AST_castle_crumbling_mission_complete_tt: "ทําภารกิจ §Yปราสาทที่กําลังพังทลาย§! ใหสําเร็จ"
  AST_castle_crumbling_reactivate_tt: "§Lผูสําเร็จราชการกําลังอยูระหวางการเจรจา§! (แผนยุทธศาสตร §Yเพื่อราชบัลลังกและจักรวรรดิ§!)§L การตัดสินขั้นสุดทายเกี่ยวกับรัฐบาลจะถูกเลื่อนออกไป§!\n\n"
  AST_cabinet_trust_complete_1_flag: "ไดดําเนินการตัดสินใจ: §Yสรางศัตรูรวม§!"
  AST_cabinet_trust_complete_2_flag: "ไดดําเนินการตัดสินใจ: §Yรับประกันความภักดีของคณะรัฐมนตรี§!"
  AST_cabinet_trust_complete_crown_flag: "ไดดําเนินการตัดสินใจ: §Y$AST_monarchist_intervention$§!"
  AST_cabinet_trust_complete_not_tt: "ยังไมไดดําเนินแผนยุทธศาสตร §Yออสเตรเลียมากอน§!"
  AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"

  AST_war_angst_cat: "ความกังวลตอสงคราม"
  AST_deteriorating_prime_minister_nerves_mission: "ประสาทของนายกรัฐมนตรีที่ทรุดลง"
  AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader]กําลังตึงเครียดภายใตแรงกดดันจากสงครามที่หลีกเลี่ยงไมได หากไมไดรับการผอนคลายในเร็ววัน ประสาทของเขาอาจรับไมไหว"

  AST_australian_demands_cat: "ขอเรียกรองของออสเตรเลีย"
  AST_aid_australian_military_construction: "ชวยเหลือการกอสรางทางทหารของออสเตรเลีย"
  AST_aid_australian_military_construction_desc: "อังกฤษยังไมพรอมทําสงคราม การชวยเหลือออสเตรเลียดานการกอสรางทางทหารอาจชวยบรรเทาความใจรอนของพวกเขาได"
  AST_japanese_war_mission: "สงครามกับญี่ปุน"
  AST_japanese_war_mission_desc: "ออสเตรเลียไมตองการเผชิญหนาศัตรูที่เหนือกวาอยางทวมทนเพียงลําพัง นั่นคือ[JAP.GetNameDef] พวกเขากําลังกดดันใหเรากาวแรกและยุติความขัดแยงที่ใกลเขามาโดยเร็วที่สุด"

  AST_resource_acquisition_cat: "การจัดหาทรัพยากร"
  AST_request_resource_rights_in_indonesia: "ขอสิทธิ์ในทรัพยากรใน[INS.GetNameDef]"
  AST_request_resource_rights_in_malaya: "ขอสิทธิ์ในทรัพยากรใน[MAL.GetNameDef]"
  AST_request_resource_rights_in_burma: "ขอสิทธิ์ในทรัพยากรใน[BRM.GetNameDef]"
  AST_request_resource_rights_in_indochina: "ขอสิทธิ์ในทรัพยากรในอินโดจีนฝรั่งเศส"
  AST_resource_request_ongoing_flag: "คําขอทรัพยากร§Yกําลังดําเนินอยู§!"

  AST_australia_first_movement_cat: "ขบวนการออสเตรเลียมากอน"
  AST_summons_to_australian_hall: "เรียกชุมนุมที่ออสเตรเลียนฮอลล"
  AST_summons_to_australian_hall_desc: "ในความพยายามขยาย[AST.GetFascistParty] เราตองรวมพลังและระดมผูสนับสนุนของเรา ออสเตรเลียนฮอลลรออยู"
  AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
  AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
  AST_print_the_publicist: "พิมพ The Publicist"
  AST_print_the_publicist_desc: "The Publicist จดหมายขาวของออสเตรเลียมากอน มีบทบาทสําคัญในการเขาถึงผูสนับสนุนที่มีศักยภาพ การตีพิมพอีกฉบับจะชวยเผยแพรสารของเรา"
