  INS_deescalate_the_conflict_2_desc: "การจูโจมของเราไดผลแลว กองรักษาการณอาณานิคมรูแลววาเราเอื้อมไปถึงไดไกลเพียงใด และกรุงเฮกรูวาเราไมไดหวาดกลัว แตการโจมตีแตละครั้งก็ใหขออางใหมแกเนเธอรแลนดในการสงทหารและเรือมาเพิ่ม และเรายังไมพรอมสําหรับสงครามเปด คําสั่งจะถูกสงไปยังผูบังคับบัญชาของเราใหหยุดยิง การโจมตีครั้งตอไปจะเกิดขึ้นเมื่อเราเปนผูกําหนด ไมใชเมื่อชาวดัตชยั่วยุใหเราทํา"

