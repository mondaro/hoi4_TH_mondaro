  AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
  AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
  AST_call_on_fascists_desc: "ในฐานะขบวนการเล็กๆ ที่มีผูสนับสนุนไมมาก ออสเตรเลียมากอนไมไดมีรายไดพอใชจายเสมอไป อยางไรก็ตาม กลุมตางชาติที่มีแนวคิดคลายกันไดแสดงความเต็มใจที่จะใหทุนสนับสนุนความทะเยอทะยานของเรา เปนทางออกที่จะทําใหเรากาวหนาตอไปได"
  AST_call_on_japanese_fascists: "ขอความชวยเหลือจากฟาสซิสตญี่ปุน"
  AST_call_on_foreign_fascists: "ขอความชวยเหลือจากฟาสซิสตตางชาติ"
  AST_a_convenient_disaster: "หายนะที่มาถูกจังหวะ"
  AST_a_convenient_disaster_desc: "ไมวาออสเตรเลียมากอนจะไดรับความนิยมเพียงใด ฝายอนุรักษนิยมก็จะตอตานอุดมการณของกลุมเสมอ เพื่อใหออสเตรเลียมากอนขึ้นสูอํานาจไดสําเร็จ อาจตองมีสิ่งที่รุนแรงกวาการเลือกตั้งตามปกติ สิ่งที่โยนรัฐบาลเขาสูความโกลาหล\n\nขบวนการของเราไมมีขีดความสามารถพอจะกอเหตุการณเชนนั้นเอง แตผูสนับสนุนฟาสซิสตตางชาติของเรามี ดวยการชวยใหเราขึ้นสูอํานาจ ฟาสซิสตตางชาติจะไดมิตรใน[AST.GetName]"
  AST_a_convenient_disaster_tt: "\nเหตุการณนี้จะสรางความปนปวนแกรัฐบาลชุดปจจุบัน และทายที่สุดจะทําให §Y[AST.GetFascistParty]§! ไดเปนพรรครัฐบาล"
  AST_a_convenient_disaster_flag: "§Yโศกนาฏกรรมเครื่องบินตกที่แคนเบอรรา§! ถูกกระตุนผานการตัดสินใจ §Yหายนะที่มาถูกจังหวะ§!"
  AST_insufficient_funds_mission: "กําลังรวบรวมเงินทุนใหเพียงพอ"
  AST_insufficient_funds_mission_tt: "เปดใชการตัดสินใจ: §Y$AST_summons_to_australian_hall$§!, §Y$AST_print_the_publicist$§!\n"
  AST_for_100_days: "เปดภารกิจ: §Y$AST_insufficient_funds_mission$§! เปนเวลา §Y100§! วัน\n"
  AST_for_50_days: "เปดภารกิจ: §Y$AST_insufficient_funds_mission$§! เปนเวลา §Y50§! วัน\n"
  AST_insufficient_funds: "เงินทุนไมเพียงพอ"
  AST_afm_decisions_fascism_upgrade_tt: "\nอัปเกรดการเพิ่มการสนับสนุนฟาสซิสตรายวันของ§Yการตัดสินใจขบวนการออสเตรเลียมากอน§!\n\n"
  AST_afm_decisions_autonomy_upgrade_tt: "\nอัปเกรดการเพิ่มอํานาจปกครองตนเองของ§Yการตัดสินใจขบวนการออสเตรเลียมากอน§!\n\n"

  AST_vichy_out_of_africa_cat: "ขับวิชีออกจากแอฟริกา"
  AST_demand_madagascar: "เรียกรองมาดากัสการ"
  AST_demand_central_africa: "เรียกรองแอฟริกากลาง"
  AST_demand_southwestern_territories: "เรียกรองดินแดนตะวันตกเฉียงใต"
  AST_vichy_req_ongoing_flag: "คําขอดินแดน§Yกําลังดําเนินอยู§!"
  AST_remove_vichy_out_of_africa_decisions: "\nนําการตัดสินใจ §Yขับวิชีออกจากแอฟริกา§! ออก\n"

  AST_naval_efforts_cat: "ความพยายามทางเรือ"
  AST_naval_efforts_cat_desc: "$AST_royal_prestige_desc$"
  AST_refit_a_retired_british_carrier: "ปรับปรุงเรือบรรทุกเครื่องบินอังกฤษที่ปลดประจําการ"
  AST_dockyard_construction: "การกอสรางอูตอเรือ"
  AST_man_the_docks_first: "จัดกําลังคนใหอูตอเรือกอน"
  improved_ship_hull_carrier: "เรือบรรทุกเครื่องบินที่ไดรับการปรับปรุง"
  AST_harland_wolff_mio_trigger: "ไดดําเนินการตัดสินใจ §Y$AST_refit_a_retired_british_carrier$§! ซึ่งปลดล็อกโดยแผนยุทธศาสตร §Y$AST_royal_prestige$§! แลว"

  AST_kingdom_expansions_cat: "การขยายราชอาณาจักร"
  AST_new_zealand_and_clause_6: "นิวซีแลนดและมาตรา 6"
  AST_new_zealand_and_clause_6_desc: "ในระหวางกระบวนการรวมอาณานิคมออสเตรเลียเปนสหพันธรัฐ นิวซีแลนดตัดสินใจไมเขารวมในที่สุด อยางไรก็ตาม นับแตนั้นรัฐธรรมนูญยังคงระบุใหนิวซีแลนดเปนหนึ่งในรัฐที่อาจเขารวมกับออสเตรเลีย และเปดทางใหรับเขาได\n\nเมื่อความมั่นคงของชาติถูกคุกคามอยางหนักในตอนนี้ นิวซีแลนดอาจถูกโนมนาวใหเขารวมราชอาณาจักรของเราเปนครั้งแรกนับตั้งแตมาตรา 6 มีผลบังคับใช"
  AST_new_zealand_and_clause_6_tt: "(§Y[NZL.GetNameWithFlag]§!) เขารวมกับ §Y[AST.GetNameDef]§! โดยนําดินแดนทั้งหมดรวมถึงกองกําลังทางบก ทางเรือ และทางอากาศมาดวย"
  AST_protector_of_the_indies: "ผูพิทักษแหงอินดีส"
  AST_protector_of_the_indies_desc: "นับตั้งแตความขัดแยงปะทุขึ้นในยุโรป [HOL.GetNameDef]ก็วุนอยูกับการปองกันดินแดนของตนเองเกินกวาจะใสใจการปองกันอาณานิคมอินโดนีเซีย การลมสลายที่อาจเกิดขึ้นของ[INS.GetNameDef]อาจตัดสินชะตากรรมของชาติอื่นๆ ทั้งหมดในเอเชียตะวันออกเฉียงใต และไมอาจปลอยไวในมือของอาณานิคมเองได\n\nเมื่อพิจารณาถึงความรายแรงของสถานการณ [HOL.GetNameDefCap]ก็เขาใจเชนกันวา[AST.GetNameDef]จะปองกันอาณานิคมนี้ไดดีกวา"
  AST_protector_of_the_indies_tt: "(§Y[INS.GetNameWithFlag]§!) เขารวมกับ §Y[AST.GetNameDef]§! โดยนําดินแดนทั้งหมดรวมถึงกองกําลังทางบก ทางเรือ และทางอากาศมาดวย"
  AST_the_solomon_islands_protectorate: "รัฐในอารักขาหมูเกาะโซโลมอน"
  AST_the_solomon_islands_protectorate_desc: "หมูเกาะโซโลมอนเปนรัฐในอารักขามาตั้งแตป 1893 อยางไรก็ตาม เมื่อผูคุมครองกําลังถูกสงครามกลืนกิน ก็เปนที่นาสงสัยวาหมูเกาะนี้จะคาดหวังการคุมครองไดมากเพียงใด\n\n[AST.GetNameDefCap]จะพยายามปกปองหมูเกาะนี้เอง และยอมเห็นไดชัดวาชาติเพื่อนบานที่มีสถานะอยางออสเตรเลียเหมาะสมกับภารกิจนี้มากกวา"
  AST_new_hebrides_and_caledonia_under_our_wing: "นิวเฮบริดีสและนิวแคลิโดเนียใตปกของเรา"
  AST_new_hebrides_and_caledonia_under_our_wing_desc: "หมูเกาะนิวเฮบริดีสและนิวแคลิโดเนียมีประวัติการถูกยุโรปยึดครองมายาวนาน เชนเดียวกับออสเตรเลีย บัดนี้เมื่อ[AST.GetNameDef]หลุดพนจากผูตั้งถิ่นฐานไดในที่สุด จึงเปนความรับผิดชอบในฐานะราชอาณาจักรของเราที่จะดูแลดินแดนโดยรอบ โดยเฉพาะดินแดนของผูที่มีภูมิหลังคลายคลึงกับเรา\n\nเมื่อความตึงเครียดของโลกกดดันผูยึดครองหมูเกาะ ในที่สุดก็เปนไปไดที่จะทําใหพวกเขาเขาใจวานิวเฮบริดีสและนิวแคลิโดเนียจะปลอดภัยกวาหากอยูในราชอาณาจักรออสเตรเลีย"
  AST_rejects_request: "[FROM.GetNameWithFlag]ปฏิเสธคําขอตอไปนี้:"

  AST_big_business_pact_cat: "สนธิสัญญากับธุรกิจรายใหญ"
  AST_big_business_request_ongoing_flag: "คําขอจากธุรกิจรายใหญ§Yกําลังดําเนินอยู§!"
  AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
  AST_naval_expansion_desc: "เพื่อแลกกับการที่[ROOT.GetFascistParty]ดําเนินนโยบายที่เปนประโยชนตอพวกเขา บุคคลสําคัญในวงการธุรกิจไดตกลงลงทุนในการปฏิรูปอุตสาหกรรมที่สอดคลองกับเปาหมายของพรรค\n\nกองเรือตองไดรับการขยาย หาก[AST.GetName]จะมีโอกาสสูกับศัตรูที่มีแสนยานุภาพทางเรือเหนือกวา ในชวงเวลาจํากัด ทุกคนจะตองระดมกําลังในอูตอเรือ เพื่อเพิ่มการผลิตเรือ"
  AST_factory_conversions: "การแปลงโรงงาน"
  AST_factory_conversions_desc: "เพื่อแลกกับการที่[ROOT.GetFascistParty]ดําเนินนโยบายที่เปนประโยชนตอพวกเขา บุคคลสําคัญในวงการธุรกิจไดตกลงลงทุนในการปฏิรูปอุตสาหกรรมที่สอดคลองกับเปาหมายของพรรค\n\nอุตสาหกรรมกลาโหมตองมาเปนอันดับแรก ดังนั้นโรงงานของออสเตรเลียจึงตองถูกแปลงเพื่อสนับสนุนอุตสาหกรรมนี้"
  AST_land_development: "การพัฒนาที่ดิน"
  AST_land_development_desc: "เพื่อแลกกับการที่[ROOT.GetFascistParty]ดําเนินนโยบายที่เปนประโยชนตอพวกเขา บุคคลสําคัญในวงการธุรกิจไดตกลงลงทุนในการปฏิรูปอุตสาหกรรมที่สอดคลองกับเปาหมายของพรรค\n\nดินแดนของ[ROOT.GetName]จํานวนมากเกินไปยังไมไดรับการพัฒนาทางอุตสาหกรรมและยังดอยพัฒนา การพัฒนาภูมิภาคเหลานี้จะทําใหเหมาะสมกับการกอสราง"
  AST_electrical_grid_expansions: "การขยายโครงขายไฟฟา"
  AST_electrical_grid_expansions_desc: "เพื่อแลกกับการที่[ROOT.GetFascistParty]ดําเนินนโยบายที่เปนประโยชนตอพวกเขา บุคคลสําคัญในวงการธุรกิจไดตกลงลงทุนในการปฏิรูปอุตสาหกรรมที่สอดคลองกับเปาหมายของพรรค\n\nดวยการขยายโครงขายไฟฟา เราสามารถสงเสริมการผลิตพลังงานภายในประเทศที่ไมตองพึ่งพาการนําเขา"
  AST_factory_investments: "การลงทุนในโรงงาน"
  AST_factory_investments_desc: "เพื่อแลกกับการที่[ROOT.GetFascistParty]ดําเนินนโยบายที่เปนประโยชนตอพวกเขา บุคคลสําคัญในวงการธุรกิจไดตกลงลงทุนในการปฏิรูปอุตสาหกรรมที่สอดคลองกับเปาหมายของพรรค\n\nหากเราตองการใหเสบียงทั้งทางทหารและพลเรือนเพียงพอในยามความขัดแยง เราตองขยายขีดความสามารถทางอุตสาหกรรม"

  AST_develop_port_kemla_steel_medium_decision: "สรางเตาถลุงเหล็กแหงที่สองที่พอรตเค็มบลา"
  AST_develop_port_kemla_steel_medium_decision_desc: "พอรตเค็มบลาดําเนินงานไดดีดวยเตาถลุงเหล็กเพียงเตาเดียว แตความตองการเพิ่มขึ้นจนเราอาจตองสรางเตาที่สอง ซึ่งจะเพิ่มผลผลิตเหล็กกลาของภูมิภาคเปนราวสองเทา"
  AST_prospect_pilbara_iron_decision: "เปดภูมิภาคพิลบาราเพื่อการทําเหมือง"
  AST_prospect_pilbara_iron_decision_desc: "ภูมิภาคพิลบารามีแหลงแรเหล็กสํารองมหาศาล ซึ่งเปนหนึ่งในแหลงใหญที่สุดในโลก อยางไรก็ตาม ในพื้นที่หางไกลอยางยิ่งของประเทศแหงนี้ การลงทุนที่ตองใชเพื่อนําทรัพยากรนี้มาใชจะมหาศาล... แตผลกําไรก็จะมหาศาลเชนกัน"
  AST_scale_up_pilbara_mines_steel_decision: "ขยายขนาดเหมืองพิลบารา"
  AST_scale_up_pilbara_mines_steel_decision_desc: "เมื่อภูมิภาคพิลบาราเปดใหทําเหมืองขนาดใหญแลว ก็ถึงเวลาปลอยใหเงินลงทุนหลั่งไหลเขามา!"
  AST_pilbara_mining_tt: "การเปด §Y$STATE_870$§! ใหสํารวจแรเพิ่มเติมจะปลดล็อกการตัดสินใจที่ทําซํ้าไดเพื่อเพิ่มการผลิตเหล็กกลาอยางไมจํากัด"
  AST_scale_up_middleback_mines_steel_decision_1: "ขยายเหมืองไอรอนน็อบ"
  AST_scale_up_middleback_mines_steel_decision_1_desc: "แมเหมืองไอรอนน็อบจะดําเนินการมาสักระยะแลว แตดวยความตองการแรเหล็กที่เพิ่มขึ้น ถึงเวลาขยายความพยายามของเราที่นี่"
  AST_scale_up_middleback_mines_steel_decision_2: "เปดเหมืองไอรอนมอนารก"
  AST_scale_up_middleback_mines_steel_decision_2_desc: "เหมืองไอรอนน็อบไมเพียงพอตอความตองการของเรา โชคดีที่เทือกเขามิดเดิลแบ็กอุดมไปดวยแรเหล็ก ถึงเวลาสรางเหมืองที่ใหญที่สุดของเรา!"
  AST_scale_up_middleback_mines_steel_decision_3: "เปดเหมืองไอรอนพรินซ"
  AST_scale_up_middleback_mines_steel_decision_3_desc: "ความตองการโลหะในยามสงครามสูงเปนประวัติการณ แตเทือกเขามิดเดิลแบ็กยังคงใหผลผลิตตอไป"
  AST_expand_iron_mining_tt: "การมีทั้ง §Y$AST_exports_for_economic_recovery$§! และ §Y$AST_within_reach$§! จะชวยใหสามารถใชประโยชนจากภูมิภาคพิลบาราของ §Y$STATE_870$§! ปลดปลอยแหลง§Yเหล็กกลา§!ที่แทบไมมีวันหมด ซึ่งเราสามารถใชขับเคลื่อนเศรษฐกิจของเราได"
  AST_develop_port_kemla_steel_tt: "สิ่งนี้จะทําใหเราดําเนินการตัดสินใจ §Yสรางเตาถลุงเหล็กแหงที่สองที่พอรตเค็มบลา§! ได ซึ่งจะเพิ่มผลผลิต§Yเหล็กกลา§!ของเราอยางมาก"
  AST_develop_middleback_tt: "สิ่งนี้จะปลดล็อกการตัดสินใจสามรายการเพื่อพัฒนาการผลิต§Yเหล็กกลา§!ใน §Y$STATE_519$§!"
  AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! จะชวยใหสามารถใชประโยชนจากภูมิภาคพิลบาราของ §Y$STATE_870$§! ปลดปลอยแหลง§Yเหล็กกลา§!ที่แทบไมมีวันหมด ซึ่งเราสามารถใชขับเคลื่อนเศรษฐกิจของเราได"

