  AST_union_control_2_cat: "การควบคุมสหภาพแรงงาน"
  AST_union_control_2_cat_desc: "กรรมกรแหง[ROOT.GetNonIdeologyName]ไมไดโคนลมผูกดขี่เพียงเพื่อเฝาดูมหาอํานาจจักรวรรดินิยมลามโซสหายของเราในตางแดนตอไป การแผขยายลัทธิคอมมิวนิสตออกไปนอกพรมแดนไมใชเพียงเปาหมายทางอุดมการณ แตเปนความจําเปนทางยุทธศาสตร เราตองโหมไฟแหงการปฏิวัติขามมหาสมุทร มอบความหวังและทรัพยากรใหผูที่ตองการสลัดแอกจักรวรรดินิยม จนกวาระเบียบเกาจะไมเหลือที่ยืน"
  AST_union_control_2_foreign_cat: "ปราบปรามคอมมิวนิสต"
  AST_union_control_tt: "สหภาพแรงงานตองตั้งมั่นในรัฐตางๆ ทั่วออสเตรเลีย แตทหารผานศึกนิวการดกําลังพยายามขัดขวางการแพรขยายของลัทธิคอมมิวนิสต"
  AST_seize_local_leadership_in_state_major: "ยึดอํานาจผูนําทองถิ่นใน[FROM.GetName]"
  AST_seize_local_leadership_in_state_mid: "ยึดอํานาจผูนําทองถิ่นใน[FROM.GetName]"
