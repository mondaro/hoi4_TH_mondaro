  AST_union_control_1_cat_desc: "สมาชิกสหภาพแรงงานของเราเริ่มระดมการสนับสนุนจากประชาชนทั่วไปทั่วออสเตรเลีย เราสามารถแทรกซึมเขาสูสภานิติบัญญัติของแตละรัฐ สรางการสนับสนุนรัฐบาลที่นําโดยคอมมิวนิสตจากภายใน ซึ่งจะตองใชอํานาจทางการเมืองจํานวนมากและเสี่ยงตอการบั่นทอนเสถียรภาพของชาติ \n\nทหารผานศึกนิวการดกําลังจับตาความเคลื่อนไหวของเราอยางใกลชิด และหากรัฐบาลไมลงมือใหทันเวลา หรือหากชาติไรเสถียรภาพเกินไป ความขัดแยงนี้อาจฉีกชาติใหแตกเปนเสี่ยง\n\nการสนับสนุนคอมมิวนิสต: [?party_popularity_100@communism|Y]§Y%§!\n\n§Rสงครามกลางเมืองจะปะทุขึ้นหากเสถียรภาพลดตํ่ากวา 40% หรือหากการกอกบฏของทหารผานศึกหมดเวลา§!"
  AST_union_control_1_cat_name: "เลือกพื้นที่ที่จะปลุกระดมสหภาพแรงงานใหสนับสนุนคุณ"
