 PEACE_FOR_OUR_TIME: "สันติภาพในยุคของเรา (Peace for Our Time)"
 THUNDER_AT_OUR_GATES: "อสนีบาตหนาประตูเมือง (Thunder at Our Gates)"

 DLC_DESCRIPTION_dlc018: "ผังยุทธศาสตรและเหตุการณใหมสําหรับแคนาดา ออสเตรเลีย นิวซีแลนด บริติชราช (อินเดีย) และแอฟริกาใต พรอมคําสั่งแผนการรบแบบหัวหอก ที่ชวยใหควบคุมการโอบลอมขนาดใหญและการเจาะทะลวงแนวขาศึกไดมากขึ้น"
 DLC_DESCRIPTION_dlc020: "ผังยุทธศาสตรใหมสี่ผัง: สัมผัสสงครามจากมุมมองอันยากลําบากของฮังการี โรมาเนีย เชโกสโลวาเกีย และยูโกสลาเวีย"
 DLC_DESCRIPTION_dlc022: "ผังยุทธศาสตรที่ปรับปรุงใหมสําหรับเยอรมนีและญี่ปุน: สองมหาอํานาจฝายอักษะหลักมีเสนทางประวัติศาสตรทางเลือกแลว รวมถึงโอกาสโคนลมฮิตเลอร หรือสถาปนาระบอบคอมมิวนิสตหรือประชาธิปไตยในญี่ปุน"
 DLC_DESCRIPTION_dlc023: "รับการออกแบบเรือใหม คุณลักษณะและทักษะใหมสําหรับพลเรือเอก ยานสะเทินนํ้าสะเทินบก ใชทุนระเบิดทางทะเลเพื่อปกปองนานนํ้าของคุณ และกําหนดเสนทางเดินเรือเพื่อหลีกเลี่ยงอันตราย รวมถึงผังยุทธศาสตรใหมสําหรับเนเธอรแลนด สหราชอาณาจักร เม็กซิโก และสหรัฐอเมริกา"
 DLC_DESCRIPTION_dlc028: "La Résistance เพิ่มสายลับ ภารกิจจารกรรม และตัวเลือกใหมสําหรับขบวนการตอตาน สงสายลับเขาไปในดินแดนอันตรายเพื่อถอดรหัสความลับของขาศึก หรือเตรียมพื้นที่สําหรับการรุกรานดวยการคํ้าจุนผูรวมมือที่ยินดีกับอํานาจเพียงเล็กนอย"
 DLC_DESCRIPTION_dlc031: "เพิ่มผังยุทธศาสตรเฉพาะสําหรับประเทศเล็กรอบทะเลดําและทะเลอีเจียน บัลแกเรีย กรีซ และตุรกี ตางสามารถเลือกเสนทางประวัติศาสตรจริงและประวัติศาสตรทางเลือกอันเปนเอกลักษณ ขณะตอตานความพยายามของมหาอํานาจที่จะครอบงําเสนทางเดินเรือยุทธศาสตรของชองแคบบอสพอรัสและดารดะเนลส"
 DLC_DESCRIPTION_dlc034: "No Step Back เพิ่มรายละเอียดใหกับหลายชาติในยุโรปตะวันออก ระบบเกมเฉพาะที่สะทอนการเมืองโซเวียต และการปรับปรุงดานการทหารของเกมอีกมากมาย"
 DLC_DESCRIPTION_dlc036: "สรางจักรวรรดิใหม ตอตานการรุกรานจากตางชาติ หรือสํารวจขีดจํากัดของความเปนกลาง By Blood Alone เพิ่มตัวเลือกประวัติศาสตรทางเลือกและความหลากหลายของการเลนสําหรับอิตาลี เอธิโอเปย และสวิตเซอรแลนด รวมถึงการเปลี่ยนแปลงสําคัญอื่น ๆ"
 DLC_DESCRIPTION_dlc038: "เขียนประวัติศาสตรบทใหมอันนาตื่นเตนของประเทศนอรดิก ขณะที่มหาอํานาจแหงยุโรปตอสูเพื่ออนาคตของโลก ผังยุทธศาสตรใหมสําหรับฟนแลนด สวีเดน เดนมารก และนอรเวย จะเปนจุดเดน ทําใหอุตสาหกรรมอาวุธของคุณมีความเชี่ยวชาญเฉพาะดานเพื่อเนนประสิทธิภาพ แลวนําอาวุธเหลานี้ไปขายในตลาดระหวางประเทศแหงใหม"
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance เพิ่มผังยุทธศาสตรอันครอบคลุมสําหรับบราซิล อารเจนตินา ชิลี อุรุกวัย และปารากวัย เสถียรภาพของทั้งทวีปแขวนอยูบนเสนดาย เปดแนวรบใหมในสงครามขณะที่คุณเกี้ยวพาผูอุปถัมภชาวยุโรปดวยสินคาลํ้าคาที่สุดของคุณ นั่นคือความภักดีของคุณ"
 DLC_DESCRIPTION_dlc043: "พัฒนาเทคโนโลยีและอาวุธตนแบบเพื่อใชตอกรกับศัตรู ดําเนินการจูโจมเพื่อทําลายสถานที่วิจัย เขื่อน และสถานที่สําคัญของศัตรู ผังยุทธศาสตรใหมและที่ปรับปรุงแลวชวยใหคุณใชวงในของเยอรมนีเพื่อบรรลุเปาหมาย ฟนฟูจักรวรรดิฮาพสบวรคในฐานะออสเตรียหรือฮังการี และสํารวจพลวัตของเบลเยียมกับอาณานิคมเบลเจียนคองโก"
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires นําเสนอผังยุทธศาสตรเฉพาะสําหรับอิหราน บริติชราช อิรัก และอัฟกานิสถาน จํากัดอิทธิพลของมหาอํานาจภายนอกที่เขามาแทรกแซง และฟนคืนเกียรติภูมิที่ลมสลายของชาติคุณ ขณะที่มุงครอบงําตะวันออกกลางและเอเชียใต"
 DLC_DESCRIPTION_dlc049: "สรางเสนทางประวัติศาสตรใหมใหญี่ปุน จีน และฟลิปปนสใน No Compromise, No Surrender ภาคเสริมของ Hearts of Iron IV ควบคุมฝายตาง ๆ ไดลึกซึ้งยิ่งขึ้น สรางหลักนิยมทางทหารใหม และกําหนดชะตากรรมของแปซิฟกและดินแดนที่ไกลออกไป"
 DLC_DESCRIPTION_dlc051: "ฟนฟูราชอาณาจักรโบฮีเมีย กอตั้งสหภาพของรัฐในยุโรปกลาง ปกปองตนเองดวยปอมปราการ หรือสรางเครือขายพันธมิตร ดวยผังยุทธศาสตรใหมของเชโกสโลวาเกียใน Peace for Our Time"
 DLC_DESCRIPTION_dlc052: "กาวเขาสูใจกลางการบัญชาการดวยการสงนายพลของคุณไปยังแนวหนา และมอบเหรียญตราใหกัปตันเรือที่ประสบความสําเร็จที่สุด ผลักดันการรุกรานของญี่ปุนทั่วเอเชียตะวันออกเฉียงใตใหถอยกลับในฐานะออสเตรเลีย สรางจักรวรรดิใหมในฐานะสยาม และกําหนดอนาคตของอินโดนีเซีย ไมวาจะอยูใตการปกครองของดัตชหรือไมก็ตาม"