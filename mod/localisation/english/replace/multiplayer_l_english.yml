 OOS_DESC: "$WHO|H$ ไมมีสถานะเกมที่ถูกตองอีกตอไป\n$DUMP_INFO$\nขอมูลทางเทคนิค:\n$INFO$\n\n โฮสตไมสามารถรับประกันไดอีกตอไปวาผูเลนทุกคนมีสถานะเกมที่ถูกตอง แนวทางแกไขที่เปนไปได: \n 1. เซิรฟเวอรสามารถซิงคเกมใหม \n 2. ผูเลนสามารถออกจากเกมแลวเชื่อมตอใหมหากเปดใชการเขารวมระหวางเกม\n 3. เซิรฟเวอรสามารถเปดโฮสตเกมใหม \n 4. เลนตอดวยสถานะเกมที่เสียหาย (ไมแนะนํา มีแนวโนมสูงที่จะทําใหเกมแครชในภายหลัง)"
