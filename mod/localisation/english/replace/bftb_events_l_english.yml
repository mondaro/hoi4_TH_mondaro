 bftb_bulgaria_factions.64.t: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.64.desc: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวางไมไดสําเร็จอยางที่เราคาดไว แมตํารวจจะจับกุมบุคคลสําคัญไดบางคน แตผูนําหลายคนขององคกรหลบหนีไปได และแมจะตองหลบซอนตัว พวกเขาก็ยังคงนํากลุมสังคมนิยมสายกวางตอไป"
 bftb_bulgaria_factions.64.a: "ผลลัพธที่นาผิดหวัง..."
 bftb_bulgaria_factions.65.t: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.65.desc: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวางลมเหลวโดยสิ้นเชิง ตํารวจบุกเขาไปในการประชุมลับ แตเจาหนาที่ซึ่งมีจํานวนนอยกวามากไมสามารถควบคุมตัวผูเขารวมประชุมได พวกเขารีบหลบหนีและขอความชวยเหลือจากเพื่อนชนชั้นกรรมาชีพ จนเกิดการปะทะอยางรุนแรงไปทั่วทองถนนในเมือง และมีพลเมืองผูบริสุทธิ์บาดเจ็บจํานวนมาก เมื่อเห็นความโหดรายของตํารวจเชนนี้ พลเรือนจํานวนมากในพื้นที่อดไมไดที่จะเห็นใจกลุมสังคมนิยมสายกวาง ชวยใหสมาชิกขององคกรหลบหนี และถึงขั้นเขารวมตอสูกับกองกําลังของรัฐ"
