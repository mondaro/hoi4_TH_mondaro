 bftb_bulgaria_fate_of_the_balkans.1.t: "[BUL.GetNameDefCap] เรียกรองใหเราเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.desc: "วันนี้ทูตพิเศษ[BUL.GetAdjective]เดินทางมาถึงเมืองหลวงเพื่อพบ [ROOT.GetLeader] และโดยพื้นฐานแลวคือมาเรียกรองให [ROOT.GetNameDef] เขาเปนสมาชิกของ [BUL.GetFactionName] ตามคํากลาวของ[GetBulgarianLeader] [BUL.GetNameDef] จะพัฒนาโครงการความรวมมือดานการวิจัยและการปองกัน และจะรับประกันความมั่นคงและอธิปไตยของรัฐสมาชิกทั้งหมดของพันธมิตร อยางไรก็ตาม นักการทูตเตือนวาชาติบอลขานใดที่ปฏิเสธเขารวมพันธมิตรจะถูกถือวาเปนศัตรู"
 BUL_leader_is_tsar: "ซาร [BUL.GetLeader]"
 BUL_leader_is_regency_council: "คณะผูสําเร็จราชการบัลแกเรีย"
 BUL_leader_is_a_politician: "[BUL.GetLeader]"
 bftb_bulgaria_fate_of_the_balkans.1.a: "[ROOT.GetNameDefCap] จะเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.b: "เราจะไมยอมจํานนตอคําขูลมๆ แลงๆ!"
 bftb_bulgaria_fate_of_the_balkans.2.t: "[FROM.GetNameDefCap] ยอมเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.2.desc: "ทูตที่สงไปโนมนาวรัฐบาลของ [FROM.GetName] ใหเขารวม [BUL.GetFactionName] ไดกลับมาจากเมืองหลวง[FROM.GetAdjective]ในวันนี้พรอมขาวดี: [FROM.GetLeader] ตกลงตามขอเรียกรองของเรา และในที่สุดประเทศของ[FROM.GetHerHis]ก็เขารวมพันธมิตรของเราแลว"
 bftb_bulgaria_fate_of_the_balkans.2.a: "[BUL.GetFactionName] เติบโตขึ้น!"
 bftb_bulgaria_fate_of_the_balkans.3.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.3.desc: "ทูตที่สงไปเรียกรองให [FROM.GetName] เขารวม [BUL.GetFactionName] รายงานวา [FROM.GetLeader] ตัดสินใจไมเขารวมพันธมิตรของเรา ดูเหมือนวาแมนักการทูตของเราจะเตือนแลว เขาก็ยังไมตระหนักถึงชะตากรรมอันเลวรายที่รอ [FROM.GetNameDef] อยูจากการขัดคําสั่งของ[BUL.GetAdjective]"
 bftb_bulgaria_fate_of_the_balkans.3.a: "[FROM.GetLeader] พิสูจนแลววาเปนคนโง..."
 bftb_bulgaria_fate_of_the_balkans.4.t: "[BUL.GetNameDefCap] เรียกรอง [FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.4.desc: "คณะทูต[BUL.GetAdjective][GetBulgarianLeaderDiplomaticMission] ไดเดินทางมาถึงเมืองหลวงของเราเพื่อเจรจาการโอน [FROM.FROM.GetName] ใหแก [BUL.GetNameDef] ซึ่งพวกเขาอางวาเปนเจาของโดยชอบธรรม"
