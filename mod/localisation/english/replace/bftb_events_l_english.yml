 bftb_bulgaria_equipment_purchases.6.c_tt: "[FROM.GetNameDef] จะตอ§Yเรือลาดตระเวนเบา 1 ลํา§!ใหกองทัพเรือ[ROOT.GetAdjective]"
 bftb_bulgaria_equipment_purchases.8.t: "การตอเรือเสร็จสิ้น - เรือดํานํ้า"
 bftb_bulgaria_equipment_purchases.8.desc: "หลังการตอเรือนานเกือบหนึ่งป เรือดํานํ้า[FROM.GetAdjective]ทั้งสามลําที่เราสั่งตอไดผานการทดลองในทะเลหลายครั้ง และพรอมขึ้นระวางประจําการในกองทัพเรืออยางเปนทางการแลว\n เรือจอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 bftb_bulgaria_equipment_purchases.9.t: "การตอเรือเสร็จสิ้น - เรือพิฆาต"
 bftb_bulgaria_equipment_purchases.9.desc: "หลังการตอเรือนานเกือบหนึ่งป เรือพิฆาต[FROM.GetAdjective]ทั้งสองลําที่เราสั่งตอไดผานการทดลองในทะเลหลายครั้ง และพรอมขึ้นระวางประจําการในกองทัพเรืออยางเปนทางการแลว\n เรือจอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 bftb_bulgaria_equipment_purchases.10.t: "การตอเรือเสร็จสิ้น - เรือลาดตระเวนเบา"
 bftb_bulgaria_equipment_purchases.10.desc: "หลังการตอเรือนานเกือบหนึ่งป เรือลาดตระเวนเบา[FROM.GetAdjective]ที่เราสั่งตอไดผานการทดลองในทะเลหลายครั้ง และพรอมขึ้นระวางประจําการในกองทัพเรืออยางเปนทางการแลว\n เรือจอดเทียบทาอยูที่ทาเรือ[Root.GetAdjective] และลูกเรือกําลังรอคําสั่ง"
 bftb_bulgaria_scw_volunteers.1.t: "อาสาสมัคร[ROOT.GetAdjective]กลับมาจากสเปนแลว"
 bftb_bulgaria_scw_volunteers.1.desc: "เหลาอาสาสมัคร[ROOT.GetAdjective]ผูกลาที่เดินทางไปตอสูเพื่ออิสรภาพของชาวสเปนในกองพลนอยนานาชาติ ไดกลับคืนสูบานเกิด [GetVictoryOrDefeatRepublicans]นักรบ[ROOT.GetAdjective]ผูหาวหาญที่กลับมาในฐานะทหารผานศึก มีซาคารี ซาคารีเยฟ ซึ่งบัดนี้เปนนักบินทหารฝมือฉกาจ ไดรับเครื่องราชอิสริยาภรณจากวีรกรรมมากมายในสงคราม และไดรับการเสนอชื่ออยางยิ่งใหเลื่อนขึ้นเปนผูบัญชาการกองทัพอากาศบัลแกเรีย" #FROM.FROM is SCW loser // #FROM is SCW winner
 bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious: "ดวยความปติยินดีหลังชัยชนะของ [FROM.GetNameDef] ในสงครามกลางเมืองที่สรางความเจ็บปวดมากมายแกชาวสเปน ในบรรดา"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated: "ดวยความโศกเศราตอความพายแพอันเลวรายของ [FROM.GetNameDef] ซึ่งในที่สุดก็ตกอยูใตทรราชยของลัทธิฟาสซิสต... \nอยางไรก็ตาม ในบรรดา"
 bftb_bulgaria_scw_volunteers.1.a: "พวกเขากลับมาในฐานะวีรบุรุษ!"
 bftb_bulgaria_scw_volunteers.1.b: "พวกเขาทําทุกอยางที่ทําไดเพื่อปกปองเสรีภาพแลว..."
 bftb_bulgaria_scw_volunteers.2.t: "อาสาสมัครบัลแกเรียกลับมาจากสเปนแลว"
 bftb_bulgaria_scw_volunteers.2.desc: "เหลาอาสาสมัคร[ROOT.GetAdjective]ผูกลาที่เดินทางไปตอสูกับลัทธิบอลเชวิคและอนาธิปไตยในสเปน ไดกลับคืนสูบานเกิด [GetVictoryOrDefeatNationalists]ไดรับประสบการณการรบอันมีคา และนายทหารผูบังคับบัญชาคนหนึ่งของเราไดรับเครื่องราชอิสริยาภรณและเลื่อนยศจากวีรกรรมอันโดดเดนระหวางสงคราม"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious: "ในฐานะผูชนะอยางภาคภูมิในสงครามกลางเมืองสเปน ซึ่ง [FROM.GetLeader] เองไดยกยองการรวมรบของพวกเขาในแนวหนา \nทหารของเรา"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated: "ดวยความหดหูจากความพายแพอันเลวรายของ [FROM.GetNameDef] ซึ่งบัดนี้ตกอยูใตอํานาจพวกแดงโดยสิ้นเชิง... \nอยางไรก็ตาม ทหารของเรา"
 bftb_bulgaria_scw_volunteers.2.a: "พวกเขากลับมาในฐานะทหารผานศึกตัวจริง!"
 bftb_bulgaria_scw_volunteers.2.b: "สเปนเปนแคสนามทดลอง..."

 bftb_bulgaria_soviet_influence.1.t: "สนธิสัญญาชวยเหลือซึ่งกันและกัน[ROOT.GetAdjective]-[BUL.GetAdjective]"
 bftb_bulgaria_soviet_influence.1.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดพบกับ [ROOT.GetLeader] ที่ [ROOT.Capital.GetName] เพื่อหารือขอเสนอของ[BUL.GetAdjective]ในการลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันระหวางสองประเทศ ดวยสนธิสัญญานี้ รัฐบาล[BUL.GetAdjective]หวังจะกระชับความสัมพันธกับ [ROOT.GetNameDef] พรอมไดรับการสนับสนุนที่จําเปนเพื่อรักษาบูรณภาพของตนในยุคอันปนปวนนี้ และเอาชนะเพื่อนบานที่เปนปรปกษในคาบสมุทรบอลขาน"
 bftb_bulgaria_soviet_influence.1.desc_leader: "[BUL.GetLeader]"
 bftb_bulgaria_soviet_influence.1.desc_diplomat: "นักการทูต[BUL.GetAdjective]"
 bftb_bulgaria_soviet_influence.1.a: "การลงนามสนธิสัญญานี้จะเปนประโยชนตอทั้งสองประเทศ!"
 bftb_bulgaria_soviet_influence.1.b: "สนธิสัญญานี้ไมเปนประโยชนตอเรา"
 bftb_bulgaria_soviet_influence.2.t: "[SOV.GetNameDefCap] ลงนามสนธิสัญญาชวยเหลือซึ่งกันและกัน"
 bftb_bulgaria_soviet_influence.2.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดกลับมายัง [ROOT.Capital.GetName] หลังพบกับ [SOV.GetLeader] เพื่อหารือขอเสนอลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันระหวาง [SOV.GetNameDef] กับ [ROOT.GetNameDef] หลังการประชุมอันยาวนานเพื่อกําหนดเงื่อนไขของสนธิสัญญา รวมถึงมาตรการที่รัฐบาลแตละฝายตองดําเนินการเพื่อรักษาความสัมพันธนี้ ผูแทนระดับสูงของทั้งสองประเทศก็ไดลงนามในสนธิสัญญา"
 bftb_bulgaria_soviet_influence.2.a: "นี่คือจุดเริ่มตนของความสัมพันธที่ออกดอกออกผล!"
 bftb_bulgaria_soviet_influence.3.t: "[SOV.GetNameDefCap] ถอนตัวจากสนธิสัญญาชวยเหลือซึ่งกันและกัน"
 bftb_bulgaria_soviet_influence.3.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดกลับมายัง [ROOT.Capital.GetName] หลังพบกับ [SOV.GetLeader] เพื่อหารือขอเสนอลงนามสนธิสัญญาชวยเหลือซึ่งกันและกันระหวาง [SOV.GetNameDef] กับ [ROOT.GetNameDef] หลังการประชุมอันยาวนานเพื่อกําหนดเงื่อนไขของสนธิสัญญา ดูเหมือนจะไมมีทางโนมนาว [SOV.GetLeader] ใหเห็นความจําเปนของสนธิสัญญานี้ได และ[SOV.GetLeader.GetSheHe]ปฏิเสธที่จะลงนามอยางไมไยดี \nหลังขอเสนอลมเหลวใน [SOV.GetNameDef] ดูเหมือนวา [ROOT.GetLeader] กําลังพิจารณาพันธมิตรที่เปนไปไดรายอื่นสําหรับ [ROOT.GetNameDef] แลว"
 bftb_bulgaria_soviet_influence.3.a: "ถึงเวลาหาพันธมิตรใหม..."
 bftb_bulgaria_soviet_influence.4.t: "[BUL.GetLeader] กดดัน [ROOT.GetLeader] ใหเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_soviet_influence.4.desc: "รัฐบาล[BUL.GetAdjective]เรียกรองใหชาติบอลขานรวมตัวกันปฏิวัติตอตานลัทธิฟาสซิสต จักรวรรดินิยม และทุนนิยม โดยเรงเราให [ROOT.GetLeader] เขารวม [BUL.GetFactionName] เพื่อสรางกลุมอํานาจอันทรงพลังที่ตอตานชาติยุโรปผูกดขี่"
 bftb_bulgaria_soviet_influence.4.a: "เราตองรวมมือกับพี่นองชาวบัลแกเรียและโซเวียต"
 bftb_bulgaria_soviet_influence.4.b: "เราจะไมยอมจํานนตอแรงกดดันของบัลแกเรีย!"
 bftb_bulgaria_soviet_influence.5.t: "[FROM.GetNameDefCap] ยอมจํานนตอแรงกดดันของ[ROOT.GetAdjective]"
 bftb_bulgaria_soviet_influence.5.desc: "หลังการประชุมที่เขมขนเปนพิเศษและการถกเถียงอยางดุเดือดกับสมาชิกรัฐบาล[FROM.GetAdjective] ในที่สุด [FROM.GetLeader] ก็ยอมจํานนตอแรงกดดันของเรา และ [FROM.GetNameDef] ไดเขารวม [ROOT.GetFactionName] ซึ่งเสริมความแข็งแกรงใหกลุมอํานาจของเราในการตอตานลัทธิฟาสซิสต จักรวรรดินิยม และทุนนิยม"
 bftb_bulgaria_soviet_influence.5.a: "พวกเขาทําสิ่งที่ถูกตองแลว"
 bftb_bulgaria_soviet_influence.6.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองของ[ROOT.GetAdjective]"
 bftb_bulgaria_soviet_influence.6.desc: "[FROM.GetLeader] ปฏิเสธที่จะพบนักการทูตของเราที่สงไปยัง [FROM.GetNameDef] เพื่อพูดคุยถึงความจําเปนที่ประเทศของเราตองรวมกันเปนพันธมิตรแทนที่จะแบงแยกกําลัง และรัฐบาล[FROM.GetAdjective]ยังปฏิเสธขอเสนอใหเขารวมพันธมิตรของเรา ซึ่งแสดงใหเห็นชัดวาความรวมมือระหวาง [ROOT.GetNameDef] กับ [FROM.GetNameDef] เปนไปไมได และทําใหชาติใน [ROOT.GetFactionName] เหลือทางเลือกไมมากในการจัดการกับประเทศนี้"
 bftb_bulgaria_soviet_influence.6.a: "การตัดสินใจที่จะนํามาแตความพินาศแก [FROM.GetNameDef]..."

 bftb_bulgaria_yugoslavian_influence.1.t: "สนธิสัญญามิตรภาพนิรันดรของบัลแกเรีย"
 bftb_bulgaria_yugoslavian_influence.1.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดพบกับ [ROOT.GetLeader] ที่ [ROOT.Capital.GetName] เพื่อหารือขอเสนอของ[BUL.GetAdjective]ในการลงนามสนธิสัญญามิตรภาพนิรันดรระหวางสองประเทศ ดวยสนธิสัญญานี้ รัฐบาล[BUL.GetAdjective]หวังจะฝงกลบขอพิพาทในอดีตและกระชับความสัมพันธกับ [YUG.GetNameDef] โดยหวังวาในที่สุดจะกอตั้งพันธมิตรระหวางสองประเทศ ที่เอื้อใหเกิดความรวมมือและการสนับสนุนซึ่งกันและกัน หากฝายใดฝายหนึ่งถูกดึงเขาสูความขัดแยง"
 bftb_bulgaria_yugoslavian_influence.1.a: "การลงนามสนธิสัญญานี้จะเปนประโยชนตอทั้งสองประเทศ!"
 bftb_bulgaria_yugoslavian_influence.1.b: "สนธิสัญญานี้ไมเปนประโยชนตอเรา"
 bftb_bulgaria_yugoslavian_influence.2.t: "[FROM.GetNameDefCap] ลงนามสนธิสัญญามิตรภาพนิรันดร"
 bftb_bulgaria_yugoslavian_influence.2.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดกลับมายัง [BUL.Capital.GetName] หลังพบกับ [YUG.GetLeader] ที่ [YUG.Capital.GetName] เพื่อหารือขอเสนอลงนามสนธิสัญญามิตรภาพนิรันดรระหวาง [YUG.GetNameDef] กับ [ROOT.GetNameDef] เมื่อสิ้นสุดการประชุม ผูแทนระดับสูงของทั้งสองประเทศไดลงนามในสนธิสัญญา แตเปดบางขอไวสําหรับอนาคต ดวยความปรารถนารวมกันที่จะไมเพียงรักษา แตยังขยายความสัมพันธอันเปนประโยชนนี้"
 bftb_bulgaria_yugoslavian_influence.2.a: "นี่จะเสริมความแข็งแกรงใหทั้งสองชาติ!"
 bftb_bulgaria_yugoslavian_influence.3.t: "[FROM.GetNameDefCap] ปฏิเสธสนธิสัญญามิตรภาพนิรันดรของเรา"
 bftb_bulgaria_yugoslavian_influence.3.desc: "วันนี้[GetBulgarianLeaderToMeetStalin]ไดกลับมายัง [BUL.Capital.GetName] หลังพบกับ [YUG.GetLeader] ที่ [YUG.Capital.GetName] เพื่อหารือขอเสนอลงนามสนธิสัญญามิตรภาพนิรันดรระหวาง [YUG.GetNameDef] กับ [ROOT.GetNameDef] นาเสียดายที่ [YUG.GetLeader] ดูไมคอยกระตือรือรนกับความคิดที่จะเปนมิตรกับ [ROOT.GetNameDef] และในที่สุดก็ปฏิเสธขอเสนอของเรา"
 bftb_bulgaria_yugoslavian_influence.3.a: "เสียเวลาเปลา..."

 bftb_bulgaria_balkan_federation.1.t: "โครงการสหพันธรัฐบอลขาน"
 bftb_bulgaria_balkan_federation.1.desc: "เราไดเตรียมโครงการจัดตั้งสหพันธสาธารณรัฐสังคมนิยมบอลขานเสร็จสิ้นแลว เพื่อนําเสนอตอรัฐบาลของชาติบอลขาน และเจรจาการเขารวมของแตละประเทศ โดยเริ่มจาก [YUG.GetNameDef] \nเปาหมายหลักของสหพันธซึ่งจะมี [ROOT.GetNameDef] เปนผูนํา คือความรวมมือของประชาชนทุกชนชาติในบอลขานภายในสหภาพเหนือรัฐ ที่พรอมตอสูกับศัตรูมากมายที่หมายจะกดขี่ประเทศบอลขาน \nแต [ROOT.GetLeader] ฝนถึงสิ่งที่ยิ่งใหญกวานั้น: สหพันธรัฐบอลขานที่เปนหนึ่งเดียว ซึ่งพลเมืองจะไมใชชาวบัลแกเรีย ชาวกรีก หรือชาวยูโกสลาฟอีกตอไป... แตเปนพลเมืองเสรีแหงบอลขาน"
 bftb_bulgaria_balkan_federation.1.a: "ความฝนที่คุมคาแกการตอสู!"
 bftb_bulgaria_balkan_federation.2.t: "โครงการสหพันธรัฐบอลขานของ[BUL.GetAdjective]"
 bftb_bulgaria_balkan_federation.2.desc: "รัฐบาล[BUL.GetAdjective]ไดนําเสนอโครงการจัดตั้งสหพันธสาธารณรัฐสังคมนิยมบอลขานแกเรา โดยสัญญาวา [ROOT.GetNameDef] จะไดรับเกียรติเปนชาติแรกที่ไดรับเชิญเขารวม \nเปาหมายหลักของสหพันธซึ่งจะมี [BUL.GetNameDef] เปนผูนํา คือความรวมมือของประชาชนทุกชนชาติในบอลขานภายในสหภาพเหนือรัฐ ที่พรอมตอสูกับศัตรูมากมายที่หมายจะกดขี่ประเทศบอลขาน \nสื่อสังคมนิยมและคอมมิวนิสตไดปลอยขาวนี้ออกไปแลว และการสนับสนุนสหพันธรัฐบอลขานรวมถึงการที่ [ROOT.GetNameDef] จะเขารวม ก็เริ่มแพรหลายในหมูประชาชน[ROOT.GetAdjective]"
 bftb_bulgaria_balkan_federation.2.a: "โครงการที่ทะเยอทะยาน..."
 bftb_bulgaria_balkan_federation.3.t: "การโฆษณาชวนเชื่อของสหพันธรัฐบอลขาน"
 bftb_bulgaria_balkan_federation.3.desc: "ชาวบัลแกเรียไดเริ่มการรณรงคโฆษณาชวนเชื่อใน [ROOT.GetNameDef] เพื่อโนมนาวประชาชน[ROOT.GetAdjective]วาโครงการเพอฝนในการจัดตั้งสหพันธสาธารณรัฐสังคมนิยมบอลขานของพวกเขาเปนไปได \nสื่อฝายซายไดกระจายขาว และผูคนจํานวนมาก โดยเฉพาะแรงงานอุตสาหกรรมในเมืองและชาวนาในชนบท ตางแสดงการสนับสนุนขอเสนอของ[BUL.GetAdjective]อยางไมมีเงื่อนไขแลว"
 bftb_bulgaria_balkan_federation.3.a: "ความเคลื่อนไหวที่กลาหาญของบัลแกเรีย..."
 bftb_bulgaria_balkan_federation.4.t: "[BUL.GetNameDefCap] กําลังบอนทําลายเสถียรภาพของ [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.4.desc: "นักเคลื่อนไหว[BUL.GetAdjective]ไดขามพรมแดนเขามาในประเทศของเรา เพื่อติดอาวุธใหผูสนับสนุนสหพันธรัฐบอลขานใน [ROOT.GetNameDef] และกอความไมสงบในประเทศ \nเจาหนาที่ตํารวจพยายามทั้งวันทั้งคืนเพื่อจับกุมและคุมขังพวกบอนทําลายเหลานี้ แตจนถึงตอนนี้ความพยายามของพวกเขายังไมคอยไดผล และพลเมือง[ROOT.GetAdjective]จํานวนมาก โดยเฉพาะชนชั้นแรงงาน ไดเขารวมกับกลุมคนที่สนับสนุนโครงการสหพันธรัฐบอลขานของ[BUL.GetAdjective]"
 bftb_bulgaria_balkan_federation.5.t: "การรวมบอลขานเปนหนึ่งเดียว"
 bftb_bulgaria_balkan_federation.5.desc: "รัฐบาล[BUL.GetAdjective]ไดสงขอเสนอใหเรารวมบอลขานเปนหนึ่งเดียวภายใตรัฐบาลรวมศูนย เพื่อสงเสริมความเขาใจและความรวมมือระหวางชนชาติตางๆ ในบอลขาน ตามที่ [BUL.GetLeader] กลาว นี่คือกาวสําคัญขั้นสุดทายของสหพันธรัฐบอลขาน ที่จะชวยใหเราทิ้งความขัดแยงในอดีตไวเบื้องหลัง และรับประกันเอกภาพและสันติภาพระหวางชาติของเราอยางถาวร \n[BUL.GetNameDef] กําลังรอคําตอบจากรัฐบาล[ROOT.GetAdjective] เพื่อดําเนินการรวมชาติของเราตอไป"
 bftb_bulgaria_balkan_federation.5.a: "รวมเปนหนึ่งกับพี่นองชาวบอลขานของเรา!"
 bftb_bulgaria_balkan_federation.5.b: "ขอความชวยเหลือกอนตกลงรวมชาติ"
 bftb_bulgaria_balkan_federation.5.c: "เรียกรองสิทธิปกครองตนเองแบบจํากัด"
 bftb_bulgaria_balkan_federation.5.d: "เราจะไมยอมสละเอกราชและอัตลักษณของ[ROOT.GetAdjective]!"
 bftb_bulgaria_balkan_federation.5.d_consequences_tt: "§Rการปฏิเสธของเราอาจทําให [FROM.GetNameDef] ขับเราออกจาก [FROM.GetFactionName] หรือแมแตสรางเปาหมายสงครามตอเรา!§!"
 bftb_bulgaria_balkan_federation.6.t: "[FROM.GetNameDefCap] ถูกรวมเขากับ [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.6.desc: "รัฐบาล[FROM.GetAdjective]ยอมรับขอเสนอการรวมชาติของเราและเขารวมสหพันธรัฐบอลขานเอกภาพแลว อดีตพลเมือง[FROM.GetAdjective]จะกลายเปนพลเมืองเสรีแหงบอลขาน ผูฝากความไววางใจไวกับความฝนของ [ROOT.GetLeader] ถึงบอลขานที่เปนหนึ่งเดียว"
 bftb_bulgaria_balkan_federation.6.a: "ความฝนเปนจริงแลว!"
 bftb_bulgaria_balkan_federation.7.t: "[FROM.GetNameDefCap] ขอความชวยเหลือดานอุตสาหกรรม"
 bftb_bulgaria_balkan_federation.7.desc: "รัฐบาล[FROM.GetAdjective]ตกลงเขารวมสหพันธรัฐบอลขานเอกภาพของเรา อยางไรก็ตาม กอนดําเนินการรวมชาติ [FROM.GetNameDef] ตองการความชวยเหลือบางอยางเพื่อกระตุนอุตสาหกรรมของชาติที่ยังบกพรอง [FROM.GetLeader] ยืนยันวาเมื่อการพัฒนาอุตสาหกรรมของประเทศไดรับการกระตุนแลว [FROM.GetNameDef] จะยินดีเขารวมสหพันธรัฐบอลขานเอกภาพอันยิ่งใหญ"
 bftb_bulgaria_balkan_federation.7.a: "เราตองใหความชวยเหลือดานอุตสาหกรรมแกฝาย[FROM.GetAdjective]"
 bftb_bulgaria_balkan_federation.8.t: "[FROM.GetNameDefCap] ขอความชวยเหลือทางเศรษฐกิจ"
 bftb_bulgaria_balkan_federation.8.desc: "รัฐบาล[FROM.GetAdjective]ตกลงเขารวมสหพันธรัฐบอลขานเอกภาพของเรา อยางไรก็ตาม กอนดําเนินการรวมชาติ [FROM.GetNameDef] จําเปนตองไดรับความชวยเหลือทางการเงินอยางเรงดวนเพื่อปองกันไมใหเศรษฐกิจที่ยํ่าแยลมสลาย [FROM.GetLeader] ยืนยันวาเมื่อประเทศไดรับแรงกระตุนฟนฟูเศรษฐกิจและสถานการณดีขึ้นแลว [FROM.GetNameDef] จะยินดีเขารวมสหพันธรัฐบอลขานเอกภาพอันยิ่งใหญ"
 bftb_bulgaria_balkan_federation.8.a: "เราตองใหความชวยเหลือทางเศรษฐกิจแกฝาย[FROM.GetAdjective]"
 bftb_bulgaria_balkan_federation.9.t: "[FROM.GetNameDefCap] ขอความชวยเหลือทางทหาร"
 bftb_bulgaria_balkan_federation.9.desc: "รัฐบาล[FROM.GetAdjective]ตกลงเขารวมสหพันธรัฐบอลขานเอกภาพของเรา อยางไรก็ตาม กอนดําเนินการรวมชาติ [FROM.GetNameDef] ตองการความชวยเหลือทางทหารบางสวนเพื่อเสริมกําลังกองทัพที่ยังไมนาไววางใจ กอนดําเนินปฏิบัติการกวาดลางกลุมผูเห็นตางหลายกลุมในเมืองชนบทตางๆ รอบ [FROM.Capital.GetName] [FROM.GetLeader] ยืนยันวาเมื่อปฏิบัติการเสร็จสิ้น [FROM.GetNameDef] จะยินดีเขารวมสหพันธรัฐบอลขานเอกภาพอันยิ่งใหญ"
 bftb_bulgaria_balkan_federation.9.a: "เราตองใหความชวยเหลือทางทหารแกฝาย[FROM.GetAdjective]"
 bftb_bulgaria_balkan_federation.10.t: "[FROM.GetNameDefCap] เรียกรองสิทธิในการกําหนดชะตากรรมตนเองบางประการ"
 bftb_bulgaria_balkan_federation.10.desc: "วันนี้คณะผูแทน[FROM.GetAdjective]ที่นําโดย [FROM.GetLeader] เดินทางมาถึง [ROOT.Capital.GetName] เพื่อหารือกับ [ROOT.GetLeader] ถึงเงื่อนไขการเขารวมสหพันธรัฐบอลขานเอกภาพของ [FROM.GetNameDef] ดูเหมือนวารัฐบาล[FROM.GetAdjective]ตองการคงความเปนอิสระและสิทธิปกครองตนเองบางสวนภายในสหพันธ แตยินดีเขารวมในฐานะสมาชิกสมทบที่มีอํานาจปกครองตนเองในระดับหนึ่ง"
 bftb_bulgaria_balkan_federation.10.a: "อนุมัติ!"
 bftb_bulgaria_balkan_federation.11.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 bftb_bulgaria_balkan_federation.11.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธที่จะเขารวมสหพันธรัฐบอลขานเอกภาพของเรา แมจะตั้งใจรักษาพันธมิตรระหวางชาติของเราไว \nอยางไรก็ตาม [FROM.GetLeader] ไดประกาศตอสาธารณะวา ปฏิกิริยาของรัฐบาลบัลแกเรียตอการปฏิเสธของ[FROM.GetAdjective]จะแสดงใหเห็นวา จุดประสงคที่แทจริงซึ่งซอนอยูของสหพันธคือการขยายพรมแดนบัลแกเรียไปไกลเกินจินตนาการ หรือบัลแกเรียตองการความรวมมือระหวางประเทศบอลขานจริงๆ ไมวาเงื่อนไขการเปนสมาชิกของสหพันธจะเปนอยางไร แตไมวากรณีใด [FROM.GetNameDef] จะไมมีวันสละเอกราชหรืออัตลักษณทางวัฒนธรรมของตน"
 bftb_bulgaria_balkan_federation.11.a: "เราจะเคารพการตัดสินใจของพวกเขา"
 bftb_bulgaria_balkan_federation.11.b: "เราจะรวมมือกับรัฐบาลที่ไมไวใจเราไดอยางไร?"
 bftb_bulgaria_balkan_federation.11.c: "[FROM.GetLeader] พูดเกินเลยไปมากแลว!"
 bftb_bulgaria_balkan_federation.12.t: "[FROM.GetNameDefCap] เรียกรองดินแดน[ROOT.GetAdjective]ในบอลขาน"
 bftb_bulgaria_balkan_federation.12.desc: "รัฐบาล[BUL.GetAdjective]ไดสงคณะทูตมาเรียกรองใหยกดินแดน[ROOT.GetAdjective]ในคาบสมุทรบอลขานใหแกชาติบอลขานที่ดินแดนเหลานั้นเปนของโดยชอบธรรมตามความเห็นของฝาย[BUL.GetAdjective] ผูแทนจาก [BUL.GetNameDef] รักษาทาทีที่เปนมิตรโดยทั่วไป แมนักการทูตของเราบางคนอางวารับรูไดถึงนัยขมขูบางอยาง โดยเฉพาะเมื่อรัฐมนตรี[ITA.GetAdjective]ปฏิเสธในตอนแรก"
 bftb_bulgaria_balkan_federation.12.a: "เราจะทําตามขอเรียกรองของพวกเขาเพื่อรักษาสันติภาพ..."
 bftb_bulgaria_balkan_federation.12.a_state_transfering_tt: "รัฐจะถูกโอนใหแกเจาของชาวบอลขานโดยชอบธรรม"
 bftb_bulgaria_balkan_federation.12.b: "[ROOT.GetNameDef] จะไมยอมจํานนตอแรงกดดันของ[BUL.GetAdjective]!"
 bftb_bulgaria_balkan_federation.12.b_tt: "อาจนําไปสูผลตอไปนี้:"
 bftb_bulgaria_balkan_federation.13.t: "[ITA.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 bftb_bulgaria_balkan_federation.13.desc: "หลังการประชุมที่ยาวนานและเขมขนกับคณะทูตของเราที่สงไปเจรจาให[ITA.GetAdjective]ยกดินแดนในบอลขาน [ITA.GetLeader] ไดยอมจํานนตอแรงกดดันของ[BUL.GetAdjective] และโอนอํานาจควบคุมรัฐ[ITA.GetAdjective]ในคาบสมุทรบอลขานใหแกชาติที่รัฐเหลานั้นเปนของโดยชอบธรรมอยางเปนทางการแลว"
 bftb_bulgaria_balkan_federation.13.a: "การตัดสินใจที่ชาญฉลาดของ [ITA.GetLeader]"
 bftb_bulgaria_balkan_federation.14.t: "การไกลเกลี่ยเรื่องดินแดนบอลขานของ[BUL.GetAdjective]"
 bftb_bulgaria_balkan_federation.14.desc: "รัฐบาล[BUL.GetAdjective]ไดสงคณะทูตไปยัง [ITA.GetNameDef] เพื่อเรียกรองใหยกดินแดน[ITA.GetAdjective]ในคาบสมุทรบอลขาน \nหลังการประชุมอันยาวนาน [ITA.GetLeader] ไดยอมจํานนตอแรงกดดันของ[BUL.GetAdjective] และตกลงโอนอํานาจควบคุมรัฐ[ITA.GetAdjective]ในคาบสมุทรบอลขานใหแกชาติที่รัฐเหลานั้นเปนของโดยชอบธรรม ซึ่งทําให [ROOT.GetNameDef] ไดดินแดนเพิ่มขึ้นบางสวน"
 bftb_bulgaria_balkan_federation.14.a: "เราตองขอบคุณชาวบัลแกเรียสําหรับเรื่องนี้!"
 bftb_bulgaria_balkan_federation.15.t: "[ITA.GetNameDefCap] ปฏิเสธที่จะสละดินแดนบอลขาน"
 bftb_bulgaria_balkan_federation.15.desc: "หลังการประชุมอันยาวนานกับคณะผูแทนของเราที่สงไปเจรจาใหยกดินแดน[ITA.GetAdjective]ในคาบสมุทรบอลขานใหแกชาติที่ดินแดนเหลานั้นเปนของโดยชอบธรรม ในที่สุด [ITA.GetLeader] ก็ปฏิเสธที่จะรับฟงนักการทูต[ROOT.GetAdjective] โดยกลาววาดินแดนทุกตารางนิ้วที่ [ITA.GetNameDef] ยึดครองในบอลขานเปนของประชาชน[ITA.GetAdjective]โดยชอบธรรม"
 bftb_bulgaria_balkan_federation.15.a: "ถาอยางนั้นเราจะยึดดินแดนเหลานั้นเอง!"
 bftb_bulgaria_balkan_federation.15.b: "เราจะจัดการกับพวก[ITA.GetAdjective]ทีหลัง..."
 bftb_bulgaria_balkan_federation.16.t: "[BUL.GetNameDefCap] เรียกรองดินแดน[ROOT.GetAdjective]ทั้งหมดในบอลขาน"
 bftb_bulgaria_balkan_federation.16.desc: "รัฐบาล[BUL.GetAdjective]ไดสงคณะทูตมาเรียกรองใหยกดินแดน[ROOT.GetAdjective]ในคาบสมุทรบอลขาน ซึ่งฝาย[BUL.GetAdjective]อางวาเปนของพวกเขาโดยชอบธรรม \nผูแทนจาก [BUL.GetNameDef] รักษาทาทีที่เปนมิตรโดยทั่วไป แมนักการทูตของเราบางคนอางวารับรูไดถึงนัยขมขูบางอยาง โดยเฉพาะเมื่อรัฐมนตรี[ROOT.GetAdjective]ปฏิเสธในตอนแรก"
 bftb_bulgaria_balkan_federation.16.a: "เราตองหลีกเลี่ยงการปะทุของสงครามบอลขานครั้งใหมไมวาจะตองแลกดวยอะไร..."
 bftb_bulgaria_balkan_federation.16.b: "[BUL.GetLeader] คงกําลังหลงผิดไปแลว!"
 bftb_bulgaria_balkan_federation.17.t: "[TUR.GetNameDefCap] สละดินแดนบอลขาน"
 bftb_bulgaria_balkan_federation.17.desc: "หลังการประชุมที่ตึงเครียดเปนพิเศษกับคณะทูตของเราที่สงไปเจรจาให[TUR.GetAdjective]ยกดินแดนในบอลขาน [TUR.GetLeader] ไดยอมจํานนตอแรงกดดันของ[ROOT.GetAdjective] และโอนอํานาจควบคุมรัฐ[TUR.GetAdjective]ในคาบสมุทรบอลขานใหแก [ROOT.GetNameDef] อยางเปนทางการแลว"
 bftb_bulgaria_balkan_federation.17.a: "เฉลิมฉลองกันเถอะ!"
 bftb_bulgaria_balkan_federation.18.t: "[TUR.GetNameDefCap] ปฏิเสธที่จะสละดินแดนบอลขาน"
 bftb_bulgaria_balkan_federation.18.desc: "หลังการประชุมที่ตึงเครียดเปนพิเศษกับคณะผูแทนของเราที่สงไปเจรจาการโอนดินแดน[TUR.GetAdjective]ในคาบสมุทรบอลขานใหแก [ROOT.GetNameDef] ในที่สุด [TUR.GetLeader] ก็ปฏิเสธที่จะรับฟงนักการทูตของเรา โดยกลาววา [TUR.GetNameDef] ควบคุมดินแดนเหลานั้นมานานหลายศตวรรษ ดังนั้น [TUR.GetNameDef] จึงเปนเจาของโดยชอบธรรม"
 bftb_bulgaria_balkan_federation.18.a: "ถาอยางนั้นเราคงตองยึดมาดวยวิธีที่ยากลําบาก!"

