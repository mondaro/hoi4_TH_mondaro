 bftb_bulgaria_factions.70.desc: "เราปราบปรามสหภาพเกษตรกรแหงชาติไดสําเร็จ โดยจับกุมสมาชิกที่มีรายงานวาพูดตอตานรัฐบาลอยางเปดเผยหรือพยายามยุยงใหประชาชนประทวง"
 bftb_bulgaria_factions.70.a: "พวกมันไดรับสิ่งที่สมควรไดรับแลว"
 bftb_bulgaria_factions.71.t: "ปราบปรามสมาชิกสหภาพเกษตรกร"
 bftb_bulgaria_factions.71.desc: "กองกําลังความมั่นคงของเราไดปฏิบัติการปราบปรามครั้งใหญตอสหภาพเกษตรกรแหงชาติ ตํารวจบุกเขาสลายการชุมนุมของสหภาพเกษตรกรหลายแหงที่จัดขึ้นพรอมกันในเมืองตางๆ ทั่วบัลแกเรีย ซึ่งมีจุดประสงคเพื่อกอความไมสงบในหมูประชาชนในชนบท รายงานทางการของตํารวจอางวาผลลัพธประสบความสําเร็จอยางยิ่ง"
 bftb_bulgaria_factions.71.a: "ขาวดีเยี่ยม!"
 bftb_bulgaria_factions.72.t: "ปราบปรามสมาชิกสหภาพเกษตรกร"
 bftb_bulgaria_factions.72.desc: "นาเสียดายที่ความพยายามปราบปรามสหภาพเกษตรกรแหงชาติของเราลมเหลว ตํารวจบุกเขาไปในสิ่งที่เชื่อวาเปนการชุมนุมลับในชนบท ซึ่งผูนําสหภาพเกษตรกรกําลังเกลี้ยกลอมชาวนาใหหันมาตอตานรัฐบาล แตกลับกลายเปนวางานนั้นเปนเพียงการบรรยายเกี่ยวกับหนังสือ “พรรคการเมืองหรือองคกรฐานันดร” ของอเล็กซานดาร สตัมโบลียสกี ทําใหการแสดงพลังของตํารวจไรประโยชนโดยสิ้นเชิง \nไมตองบอกก็รูวาปฏิบัติการของตํารวจครั้งนี้ไมเปนที่นิยมนักในหมูประชาชนบัลแกเรีย ยิ่งในหมูสหภาพเกษตรกรยิ่งไมตองพูดถึง..."
