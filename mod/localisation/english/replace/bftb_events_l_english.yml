l_english:
 bftb_greece.1.t: "ฝายนิยมกษัตริยชนะการเลือกตั้ง!"
 bftb_greece.1.desc: "ฝูงชนชาวกรีกไมแปลกใจเลยเมื่อไดยินวาฝายอนุรักษนิยมผูภักดีตอพระเจาจอรจที่ 2 ชนะการเลือกตั้งของกรีซในป 1936 คาดวานายกรัฐมนตรีคอนสตันตินอส เดแมรซิสจะดํารงตําแหนงตอไป และองคกษัตริยทรงแสดงความเชื่อสวนพระองควาการดํารงตําแหนงของเดแมรซิสจะยาวนานและประสบความสําเร็จอยางยิ่ง มีเพียงกาลเวลาเทานั้นที่จะบอกไดวาลางสังหรณขององคกษัตริยถูกตองหรือไม..."
 bftb_greece.1.a: "ชัยชนะอันยิ่งใหญของกรีซ..."
 bftb_greece.2.t: "ฝายเวนิเซลอสชนะการเลือกตั้ง!"
 bftb_greece.2.desc: "วันนี้ประชาชนชาวกรีกออกมาเต็มทองถนนทั่วกรีซ เฉลิมฉลองการที่กองทัพเลือกยืนหยัดไมใหฝายนิยมกษัตริยแทรกแซงผลการเลือกตั้ง ฝายเวนิเซลอสที่กลับจากการลี้ภัยในตางแดนไดรับฉันทานุมัติอันหนักแนนใหเปนรัฐบาล แตพวกเขาตองเผชิญศึกหนักในการรวมใจประเทศที่แตกแยกอยางรุนแรง ประเทศที่ยังไมลืมสงครามอันหายนะที่ฝายเวนิเซลอสลากทั้งชาติเขาไปในป 1919 นอกจากนี้ยังมีคําถามวาฝายเวนิเซลอสจะทําอยางไรกับองคกษัตริยกรีกที่ถูกจับกุมไว ไมวาจะเกิดอะไรขึ้น ชวงเวลาที่นาจับตาก็รออยูเบื้องหนาของกรีซ..."
 bftb_greece.2.a: "ในที่สุด เราก็ไดกลับมา!"
 GRE_republican_victory_tt: "£faction_gre_monarchist §Yฝายนิยมกษัตริย§! จะกลายเปน§Yเฉยเมย§! \n£faction_gre_communist §Yฝายคอมมิวนิสต§! จะกลายเปน§Yเฉยเมย§!"
 bftb_greece.3.t: "ฟาสซิสตอนาโตเลียระดมพล"
 bftb_greece.3.desc: "ขบวนการที่อางตัวเปนฟาสซิสตของกรีซไดปรับทิศทางใหสอดรับกับความเปนจริงทางการเมืองใหมของเรา ผูลี้ภัยชาวกรีกที่ถูกขับไลออกจากตุรกีดวยความขมขื่นและไมพอใจเริ่มหลั่งไหลเขาสูขบวนการการเมืองหัวรุนแรงใหมของเกออรกิโอส คอสมิดิส ชาวกรีกอีกคนที่ถูกเนรเทศจากบานเกิด \n\nคอสมิดิสเปนผูสนับสนุนมหาอุดมการณ (เมกาลีอีเดีย) อยางเปดเผย และตองการทวงคืนดินแดนทางประวัติศาสตรที่เสียใหแก[TUR.GetNameDef] แมทัศนะของเขาจะสุดโตงกวาใครในรัฐบาลฝายเวนิเซลอสมาก รายงานบางฉบับระบุวาคอสมิดิสใฝฝนใหพรมแดนของ[ROOT.GetNameDef]ขยายออกไปไกลเกินกวาทะเลอีเจียน และเขาอาจหมายตาอนาโตเลียทั้งหมด อยางไรก็ตาม รายงานเหลานี้ควรฟงหูไวหู คนบาแบบไหนกันจะหมายตา[TUR.GetNameDef]ทั้งประเทศ?"
 bftb_greece.3.a: "ไมมีใครตามอันธพาลคนนั้นหรอก!"
 GRE_anatolian_fascists_in_play_tt: "£faction_gre_fascist §Yฝายฟาสซิสต§! ปรากฏตัวขึ้นและเริ่มตนดวยทาที§Rเปนศัตรู§!"
 GRE_republican_monarchist_alliance_tt: "นายพลและรัฐมนตรีฝายนิยมกษัตริยจะยังคงพรอมรับใชรัฐบาลฝายเวนิเซลอส \n£faction_gre_monarchist §Yฝายนิยมกษัตริย§! กลายเปน§Gฝายมิตร§! \n£faction_gre_communist §Yฝายคอมมิวนิสต§! จะกลายเปน§Rศัตรู§!"
 bftb_greece.6.t: "การเจรจากับ EEE"
 bftb_greece.6.desc: "พวกฟาสซิสตอนาโตเลียอันชั่วชาไดหวานความโกลาหลและทําตัวเปนปฏิปกษกับรัฐบาลมาตั้งแตขบวนการอันเลวรายของพวกเขาถือกําเนิดขึ้น อยางไรก็ตาม สถานการณดูเหมือนกําลังเปลี่ยนไป เราไดรับการทาบทามใหทําขอตกลงแหงศตวรรษ นั่นคือการรวมกําลังกับฟาสซิสตอนาโตเลียเพื่อบรรลุเปาหมายรวมกันในการพิชิต[TUR.GetNameDef] \n\nปฏิเสธไมไดวาคนจํานวนมากในรัฐบาลของเรายินดีทําขอตกลงกับปศาจรายของชาติเพียงเพื่อใหพวกมันหยุดเคลื่อนไหวตอตานรัฐบาล และปฏิเสธไมไดเชนกันวามีอสรพิษบางตัวในหมูขาราชการของเราที่เห็นดวย หรือถึงกับชื่นชมเปาหมายของ EEE โชคดีที่อริสโตเติล โอนาซิส มหาเศรษฐี ไดเสนอทางเลือกอื่นใหเรา: โอนาซิสซึ่งมาจากอนาโตเลียเชนกัน จะตั้งขบวนการคูแขงโดยใชชื่อเสียง ความเฉียบแหลมทางธุรกิจ และทรัพยสินสวนตัวของเขา เพื่อบั่นทอนฐานสนับสนุนของ EEE แนวทางนี้ไมไดรับประกันวาจะบดขยี้ EEE ได แตเรามีหลักฐานมากพอที่จะเชื่อวาโอนาซิสนาจะทําสําเร็จหากเราขอใหเขาลงมือ"
 bftb_greece.6.a: "ผีรายแหงอดีตจะไมกลับมาหลอกหลอนเราอีก"
 bftb_greece.6.b: "ไมมีการตอรองกับพวกฟาสซิสตชั้นตํ่า"
 GRE_ally_the_anatolian_fascists_tt: "£faction_gre_fascist §Yฝายฟาสซิสต§! จะกลายเปน§Gฝายมิตร§!! \nการเปนพันธมิตรกับ §YEEE§! จะสง§Rผลกระทบรายแรง§!เมื่อมีการเรียก§Yการประชุมเฮราคลีออน§!"
 GRE_ally_onassis_tt: "§Yอริสโตเติล โอนาซิส§! จะพรอมรับตําแหนงรัฐมนตรี \n£faction_gre_fascist §Yฝายฟาสซิสต§! จะยังคง§Yเปนศัตรู§!"
 GRE_increased_influence_tt: "สิ่งนี้จะเพิ่มอิทธิพลของเราเหนือรัฐบาล §Y[FROM.GetAdjective]§!"
 bftb_greece.7.t: "การประชุมเฮราคลีออน"
 bftb_greece.7.desc: "ในที่สุดก็ถึงเวลาทบทวนสนธิสัญญาแซฟรและโลซานรวมกับมหาอํานาจแหงยุโรป และหยิบยกเรื่องมหาอุดมการณขึ้นมาพิจารณาอีกครั้ง ชะตากรรมของ[TUR.GetNameDef]ไมอาจตัดสินโดยเราเพียงลําพัง เราจึงตองหาและบมเพาะการยอมรับจาก[ENG.GetNameDef] [FRA.GetNameDef] รวมถึง[ITA.GetNameDef]ผูนารังเกียจดวย หากเราเลือกเชิญพวกเขามารวมประชุม"
 bftb_greece.7.a: "เราจะเชิญผูแทนจาก[FRA.GetAdjective]และ[ENG.GetAdjective]"
 bftb_greece.7.b: "เราจะเชิญประเทศผูลงนามสนธิสัญญาแซฟรดั้งเดิม"
 bftb_greece.8.t: "คําเชิญสูการประชุมเฮราคลีออน"
 bftb_greece.8.desc: "เราเพิ่งไดรับขอเสนอที่นาสนใจจาก[FROM.GetNameDef] ซึ่งเห็นไดชัดวาตองการลากเสนพรมแดนของ[TUR.GetNameDef]ใหม [FROM.GetNameDef]ตองการจัดการหารือระหวางมหาอํานาจผูชนะแหงมหาสงครามในยุโรป เพื่อทบทวนสนธิสัญญาแซฟรและโลซานที่เราเคยพยายามบังคับใชกับ[TUR.GetNameDef] \n\nเจาหนาที่จาก[FROM.GetNameDef]ยืนยันกับเจาหนาที่ของเราวาเราจะไดผลประโยชนทางวัตถุจาก[TUR.GetNameDef]ที่พายแพ และการทําลายลาง[TUR.GetNameDef]ไมใชความประสงคของรัฐบาล[FROM.GetAdjective] บุคคลสําคัญจาก[FROM.GetNameDef]ยืนกรานวาการประชุมครั้งนี้เปนเพียงเรื่องการจัดระเบียบพรมแดนใหม ไมใชการทําฝนแหงการแกแคนใหเปนจริง"
 bftb_greece.8.a: "แลวพบกันที่นั่น"
 bftb_greece.8.b: "พวกทานกําลังทําลายเสถียรภาพของเมดิเตอรเรเนียน!"
 potential_war_with_turkey_tt: "§Rหากเราตกลงเขารวม มีโอกาสสูงที่ในอนาคตอันใกลเราจะถูกลากเขาสูสงครามกับ[TUR.GetNameDef]เพื่อแลกกับดินแดนที่นั่น§!"
 bftb_greece.9.t: "มีเพียง[ENG.GetNameDef]ที่เขารวมการประชุมเฮราคลีออน"
 bftb_greece.9.desc: "คําเชิญสูการประชุมเฮราคลีออนวาดวยการจัดระเบียบพรมแดนของ[TUR.GetNameDef]ใหมไดสงไปยังมหาอํานาจทุกประเทศที่เราตองการแลว แมเราคาดวาทุกชาติที่ไดรับเชิญจะเขารวม แตปรากฏวามีเพียง[ENG.GetNameDef]เทานั้นที่จะเขารวมการประชุมสุดยอดของเรา ความสัมพันธของเรากับ[ENG.GetNameDef]แนนแฟนมาโดยตลอด เจาหนาที่ของเราหลายคนจึงยังมั่นใจวาการประชุมเฮราคลีออนจะไดขอยุติที่เปนประโยชนตอทั้งสองชาติ"
 bftb_greece.9.a: "ชาว[ENG.GetAdjective]ไวใจไดเสมอ!"
 bftb_greece.10.t: "มีเพียง[FRA.GetNameDef]ที่เขารวมการประชุมเฮราคลีออน"
 bftb_greece.10.desc: "คําเชิญสูการประชุมเฮราคลีออนวาดวยการจัดระเบียบพรมแดนของ[TUR.GetNameDef]ใหมไดสงไปยังมหาอํานาจทุกประเทศที่เราตองการแลว แมเราคาดวาทุกชาติที่ไดรับเชิญจะเขารวม แตปรากฏวามีเพียง[FRA.GetNameDef]เทานั้นที่จะเขารวมการประชุมสุดยอดของเรา คําวาผิดหวังนาจะอธิบายอารมณของเจาหนาที่[ROOT.GetAdjective]เมื่อไดยินขาวนี้ไดดีที่สุด ทั้งชนชั้นนําทางการเมืองและผูเชี่ยวชาญทางทหารของเราตางไมมั่นใจวาการประชุมเฮราคลีออนจะออกดอกออกผลอยางที่เคยหวังไว เมื่อมีเพียงชาว[FRA.GetAdjective]อยูขางเรา แตเรายังคงมุงมั่นในแนวทางนี้"
 bftb_greece.10.a: "แคชาว[FRA.GetAdjective]หรือ? รีบจบเรื่องนี้ไปเสียเถอะ"
 bftb_greece.11.t: "มีเพียง[ITA.GetNameDef]ที่เขารวมการประชุมเฮราคลีออน"
 bftb_greece.11.desc: "เจาหนาที่ของเราที่หมดกําลังใจไดไตรตรองขาวรายที่วามีเพียง[ITA.GetNameDef]ที่แสดงความสนใจจะรวมตัดสินชะตากรรมของ[TUR.GetNameDef]ในการประชุมเฮราคลีออน และสุดทายก็ตัดสินวาทางเดียวที่ทําไดคือยกเลิกการประชุมเฮราคลีออนทั้งหมด นี่ไมใชการตัดสินใจที่งายดาย เพราะเจาหนาที่ฝายเวนิเซลอสหลายคนรูดีวาพวกเขาเอาความชอบธรรมทั้งหมดของขบวนการไปเดิมพันกับการลางแคนใหป 1922 และบัดนี้สถานการณไดลุกลามจนปฏิบัติการทั้งหมดตกอยูในอันตราย \n\nประชาชนชาว[ROOT.GetAdjective]เริ่มกระสับกระสายเพราะไมมีขาวคราวใดๆ หลังจากที่งานนี้ถูกโหมประโคมไวมากมาย EEE ฉวยโอกาสโหมกระพือไฟแหงความไมพอใจอยางกระตือรือรน โจมตีรัฐบาลของเราวาออนแอและไมรักษาสัญญา [ROOT.GetLeader]จะนําพาเราออกจากนานนํ้าขุนมัวนี้ไดอยางไร?"
 bftb_greece.11.a: "ไมมีอะไรดีเกิดขึ้นจากเรื่องนี้แน ตองยกเลิกการประชุม"
 bftb_greece.12.t: "[ENG.GetNameDefCap]และ[FRA.GetNameDef]เขารวมการประชุมเฮราคลีออน"
 bftb_greece.12.desc: "เจาหนาที่ที่รวมตัวกันในเมืองหลวงยินดีอยางยิ่งเมื่อทราบวาทั้ง[ENG.GetNameDef]และ[FRA.GetNameDef]จะสงผูแทนมารวมการประชุมเฮราคลีออนของเรา การเตรียมการประชุมสุดยอดเสร็จเรียบรอยแลว และการประชุมจะเริ่มอยางเปนทางการภายในไมกี่วัน \n\nผูแทนของเราจะรวมกันแบงเขตอิทธิพลทางตอนเหนือและตอนใตของ[TUR.GetName] กอนจะตัดสินในทายที่สุดวาเราควรไดรับดินแดนอันชอบธรรมของเราตามแนวทะเลอีเจียนหรือไม ประวัติศาสตรกําลังจะถูกจารึก และ[ROOT.GetNameDef]จะอยูใจกลางของมัน"
 bftb_greece.12.a: "มือของ[ROOT.GetAdjective]จะปนแตงโลก"
 bftb_greece.13.t: "ผูลงนามสนธิสัญญาแซฟรทั้งหมดเขารวมการประชุมเฮราคลีออน"
 bftb_greece.13.desc: "เจาหนาที่ที่รวมตัวกันในเมืองหลวงยินดีอยางยิ่งเมื่อทราบวาทั้ง[ENG.GetNameDef]และ[FRA.GetNameDef]จะสงผูแทนมารวมการประชุมเฮราคลีออนของเรา แตความปติก็ตองสะดุดลงเพราะความกังวลตอการเขารวมของ[ITA.GetNameDef] บุคคลสําคัญทางการเมืองของเราหลายคนแสดงความกังวลเปนการสวนตัววาแผนการของ[ITA.GetAdjective]อาจบอนทําลายการประชุมทั้งหมด แต[ROOT.GetLeader]ยังคงเชื่อมั่นวาการเชิญ[ITA.GetNameDef]เปนการตัดสินใจที่ถูกตอง การเตรียมการประชุมสุดยอดเสร็จเรียบรอยแลว และการประชุมจะเริ่มอยางเปนทางการภายในไมกี่วัน \n\nผูแทนของเราจะรวมกันแบงเขตอิทธิพลทางตอนเหนือและตอนใตของ[TUR.GetName] กอนจะตัดสินในทายที่สุดวาเราควรไดรับดินแดนอันชอบธรรมของเราตามแนวทะเลอีเจียนหรือไม ประวัติศาสตรกําลังจะถูกจารึก และ[ROOT.GetNameDef]จะอยูใจกลางของมัน"
 bftb_greece.13.a: "เรื่องนี้นาจะนาสนใจ..."
 bftb_greece.14.t: "ไมมีใครมารวมการประชุมของเราเลย!"
 bftb_greece.14.desc: "รัฐบาลของเราตองอับอายขายหนาอยางสิ้นเชิงจากขาวที่วาไมมีประเทศใดที่ไดรับเชิญจะสงผูแทนมารวมการประชุมเฮราคลีออน และที่เลวรายกวานั้นคือผูนําของเราถูกมหาอํานาจเหลานั้นวิพากษวิจารณตอสาธารณะวาโหมกระพือความตึงเครียดในภูมิภาค การจะบอกวาเหตุการณตอเนื่องนี้เปนอะไรที่นอยกวาหายนะก็คงเปนการพูดเบาเกินไป เพราะเจาหนาที่ฝายเวนิเซลอสหลายคนรูดีวาพวกเขาเอาความชอบธรรมทั้งหมดของขบวนการไปเดิมพันกับการลางแคนใหป 1922 และบัดนี้สถานการณไดลุกลามจนปฏิบัติการทั้งหมดตกอยูในอันตราย \n\nประชาชนชาว[ROOT.GetAdjective]เริ่มกระสับกระสายเพราะไมมีขาวคราวใดๆ หลังจากที่งานนี้ถูกโหมประโคมไวมากมาย EEE ฉวยโอกาสโหมกระพือไฟแหงความไมพอใจอยางกระตือรือรน โจมตีรัฐบาลของเราวาออนแอและไมรักษาสัญญา [ROOT.GetLeader]จะนําพาเราออกจากนานนํ้าขุนมัวนี้ไดอยางไร?"
 bftb_greece.14.a: "ความทะนงตนไดนําเราสูหายนะ"
 bftb_greece.15.t: "การประชุมเฮราคลีออน - ดินแดนในอาณัติของ[FRA.GetAdjective]ในเคอรดิสถาน?"
 bftb_greece.15.desc: "หัวขอการลงมติรอบแรกคือ ควรอนุญาตให[FRA.GetNameDef]มีดินแดนในอาณัติของ[FRA.GetAdjective]ในเคอรดิสถานของ[TUR.GetAdjective]หรือไม เมื่อ[TUR.GetNameDef]ยอมจํานน เจาหนาที่[FRA.GetAdjective]ที่เขารวมหลายคนเสนอวาการจัดการเชนนี้สมเหตุสมผลอยางยิ่ง เมื่อพิจารณาวา[FRA.GetNameDef]อยูใกลภูมิภาคนี้ และกระแสชาตินิยมในเคอรดิสถานของ[TUR.GetAdjective]ก็คอนขางเดนชัดอยูแลว แมจะยอมรับวาอาจมีการคัดคานแนวคิดนี้ภายในประเทศ เนื่องจากจักรวรรดิ[FRA.GetAdjective]แผขยายเกินกําลังอยูแลว \n\nหากชาว[FRA.GetAdjective]ไดรับสัมปทานใน[TUR.GetNameDef] พวกเขาจะผูกพันตามสนธิสัญญาใหเขาชวยเหลือ[GRE.GetNameDef]เมื่อสงครามกับ[TUR.GetNameDef]เริ่มขึ้น หากญัตตินี้ไมผาน ไมวาผลของการประชุมเฮราคลีออนจะเปนอยางไร [FRA.GetNameDef]จะไมมีพันธะใดตอ[GRE.GetNameDef]เมื่อสงครามของพวกเขาเริ่มขึ้น"
 bftb_greece.15.a: "เราลงมติเห็นดวย!"
 bftb_greece.15.b: "เราลงมติไมเห็นดวย!"
 GRE_french_kurdistan_option_tt: "หากญัตติผานและการประชุมเฮราคลีออนประสบความสําเร็จในทายที่สุด เมื่อ §Y[TUR.GetNameDefCap]§! ยอมจํานน §Y[FRA.GetNameDefCap]§! จะจัดตั้งรัฐหุนเชิด§Yเคิรด§!ในทุกรัฐที่[TUR.GetAdjective]ถือครองซึ่งเปนดินแดนหลักของ§Yเคอรดิสถาน§!"
 bftb_greece.16.t: "การประชุมเฮราคลีออน - [FRA.GetAdjective]ไดดินแดนในอาณัติ!"
 bftb_greece.16.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[FRA.GetNameDef]ควรไดรับดินแดนในอาณัติในเคอรดิสถานเมื่อโคนรัฐ[TUR.GetAdjective]ไดสําเร็จ เจาหนาที่[FRA.GetAdjective]ยกยองผูแทนที่เขารวมวามีวิสัยทัศนทางการเมืองอันชาญฉลาด และไดสงคําสั่งไปยังรัฐบาลกลาง[FRA.GetAdjective]ใหเริ่มวางแผนจัดตั้งการบริหารในภูมิภาคนี้แลว"
 bftb_greece.16.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.17.t: "การประชุมเฮราคลีออน - [FRA.GetAdjective]ถูกปฏิเสธดินแดนในอาณัติ!"
 bftb_greece.17.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[FRA.GetNameDef]ไมควรไดรับดินแดนใดๆ ในเคอรดิสถานเมื่อพิชิตรัฐ[TUR.GetAdjective]ไดสําเร็จ เจาหนาที่[FRA.GetAdjective]เกือบตัดสินใจถอนตัวจากการประชุมโดยสิ้นเชิง โดยเรียกงานนี้วาเปนเรื่องตลก กอนจะไดขอสรุปวาขออยูตอเพื่อยังคงมีอิทธิพลตอการพิจารณาที่เหลือ แมจะไมไดรับคํามั่นใดๆ เลยก็ตาม"
 bftb_greece.17.a: "ฝายไมเห็นดวยชนะ!"
 bftb_greece.18.t: "การประชุมเฮราคลีออน - รัฐในอารักขาของ[ENG.GetAdjective]ในอารมีเนีย?"
 bftb_greece.18.desc: "หัวขอการลงมติรอบนี้คือ ควรให[ENG.GetNameDef]ไดรับรัฐในอารักขาอารมีเนียใน[354.GetName]ของ[TUR.GetAdjective]หรือไม เมื่อ[TUR.GetNameDef]ยอมจํานน ประเด็นวาควรปลดปลอยรัฐอารมีเนียภายในพรมแดน[TUR.GetAdjective]หรือไมนั้นเปนที่ถกเถียงกันอยางมาก เมื่อคํานึงถึงเหตุการณอันนาสลดที่เพิ่งเกิดขึ้นไมนาน แตผูแทน[ENG.GetAdjective]ยืนยันวาการจัดตั้งรัฐอารมีเนียบนพรมแดน[SOV.GetAdjective]ไมเพียงเปนสิ่งที่ถูกตองทางศีลธรรม แตยังเปนจุดยืนที่สมเหตุสมผลอยางยิ่งในทางยุทธศาสตรดวย \n\nหากชาว[ENG.GetAdjective]ไดรับสัมปทานใน[TUR.GetNameDef] พวกเขาจะผูกพันตามสนธิสัญญาใหเขาชวยเหลือ[GRE.GetNameDef]เมื่อสงครามกับ[TUR.GetNameDef]เริ่มขึ้น หากญัตตินี้ไมผาน ไมวาผลของการประชุมเฮราคลีออนจะเปนอยางไร [ENG.GetNameDef]จะไมมีพันธะใดตอ[GRE.GetNameDef]เมื่อสงครามของพวกเขาเริ่มขึ้น"
 bftb_greece.18.a: "เราลงมติเห็นดวย!"
 bftb_greece.18.b: "เราลงมติไมเห็นดวย!"
 GRE_british_armenia_option_tt: "หากญัตติผานและการประชุมเฮราคลีออนประสบความสําเร็จในทายที่สุด เมื่อ §Y[TUR.GetNameDefCap]§! ยอมจํานน §Y[ENG.GetNameDefCap]§! จะจัดตั้งรัฐหุนเชิด§Yอารมีเนีย§!ใน §Y[354.GetName]§!"
 bftb_greece.19.t: "การประชุมเฮราคลีออน - [ENG.GetAdjective]ไดรัฐในอารักขา!"
 bftb_greece.19.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[ENG.GetNameDef]ควรไดรับรัฐในอารักขาอารมีเนียที่แยกออกมาจากซากของ[TUR.GetName]ที่พายแพ เจาหนาที่[ENG.GetAdjective]ยกยองผูแทนที่เขารวมวามีวิสัยทัศนทางการเมืองอันชาญฉลาด และไดสงคําสั่งไปยังรัฐบาลกลาง[ENG.GetAdjective]ใหเริ่มวางแผนจัดตั้งการบริหารในภูมิภาคนี้แลว"
 bftb_greece.19.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.20.t: "การประชุมเฮราคลีออน - [ENG.GetAdjective]ถูกปฏิเสธรัฐหุนเชิด!"
 bftb_greece.20.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[ENG.GetNameDef]ไมควรมีสิทธิ์จัดตั้งรัฐหุนเชิดอารมีเนียใดๆ ทางตอนเหนือของ[TUR.GetNameDef] เจาหนาที่[ENG.GetAdjective]ประณามการตัดสินใจนี้และเรียกการประชุมทั้งหมดวาเละเทะ แตตัดสินใจวาขออยูตอเพื่อยังคงมีอิทธิพลตอการพิจารณาที่เหลือ แมจะไมไดรับการรับประกันใดๆ เลยก็ตาม"
 bftb_greece.20.a: "ฝายไมเห็นดวยชนะ!"
 bftb_greece.21.t: "การประชุมเฮราคลีออน - อาณานิคมของ[ITA.GetAdjective]ใน[342.GetName]และ[345.GetName]"
 bftb_greece.21.desc: "หัวขอการลงมติรอบนี้คือ ควรให[ITA.GetNameDef]ไดรับดินแดนอาณานิคมทางใตของ[TUR.GetNameDef]หลังจากพิชิต[TUR.GetNameDef]ไดแลวหรือไม ผูเขารวมทุกคนตางมีขอกังขาที่จะยกดินแดนในเมดิเตอรเรเนียนใหชาว[ITA.GetAdjective]ไปฟรีๆ แตผูแทน[ITA.GetAdjective]ก็พูดตามคําของ[ITA.GetLeader]อยางหนักแนนวาการไดรับดินแดนนี้เปนเพียงการแกไขความอยุติธรรมบางสวนของ 'ชัยชนะที่ถูกตัดทอน' (vittoria mutilata) เทานั้น \n\nกอนการประชุมเฮราคลีออนจะเริ่มอยางเปนทางการ มหาอํานาจอื่นที่เขารวมไดตัดสินแลววาไมพึงปรารถนาให[ITA.GetAdjective]มีสวนรวมในการบุก[TUR.GetNameDef] แทนที่จะเขารวมสงครามโดยตรง หาก[ITA.GetNameDef]ไดรับสัมปทาน พวกเขาจะผูกพันตามสนธิสัญญาไมรุกรานกับ[GRE.GetNameDef] และสนธิสัญญาไมแทรกแซงในสงครามที่อาจเกิดขึ้นกับ[TUR.GetNameDef] หากญัตตินี้ไมผาน ไมวาผลของการประชุมเฮราคลีออนจะเปนอยางไร [ITA.GetNameDef]จะไมมีพันธะใดตอ[GRE.GetNameDef]เมื่อสงครามของพวกเขาเริ่มขึ้น และอาจถึงขั้นพยายามเขาแทรกแซงดวย"
 bftb_greece.21.a: "เราลงมติเห็นดวย!"
 bftb_greece.21.b: "เราลงมติไมเห็นดวย!"
 bftb_greece.22.t: "การประชุมเฮราคลีออน - [ITA.GetAdjective]ไดดินแดน!"
 bftb_greece.22.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[ITA.GetNameDef]ควรไดรับอาณานิคมที่แบงออกมาจากซากของ[TUR.GetName]ที่ถูกพิชิต เจาหนาที่[ITA.GetAdjective]ปรบมือใหผูแทนที่เขารวมสําหรับการตัดสินใจอันรอบคอบ และสมาชิกคณะผูแทน[ITA.GetAdjective]หลายคนก็รีบกลับบานไปแจงขาวแก[ITA.GetLeader]แลว"
 bftb_greece.22.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.23.t: "การประชุมเฮราคลีออน - [ITA.GetAdjective]ถูกปฏิเสธดินแดน!"
 bftb_greece.23.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[ITA.GetNameDef]ไมควรมีสิทธิ์จัดตั้งอาณานิคมใดๆ ทางตอนใตของ[TUR.GetNameDef] และประณามวาญัตตินี้เปนเพียงการกระหายสงครามอันโงเขลาของ[ITA.GetAdjective]อีกครั้ง เจาหนาที่[ITA.GetAdjective]โจมตีการตัดสินใจนี้ และใชสถานการณทั้งหมดเปนหลักฐานเพิ่มเติมวาประชาชน[ITA.GetAdjective]เชื่อเรื่อง 'ชัยชนะที่ถูกตัดทอน' นั้นถูกตองแลว ไมวาความเห็นสวนตัวจะเปนอยางไร ผูแทน[ITA.GetAdjective]ไดรับคําสั่งใหอยูรวมการประชุมตอไป โดยไมตองสงสัยวาพวกเขาหวังจะยังมีอิทธิพลตอการตัดสินในวาระสุดทายซึ่งสําคัญที่สุด"
 bftb_greece.23.a: "ฝายไมเห็นดวยชนะ!"
 bftb_greece.24.t: "การประชุมเฮราคลีออน - มหาอุดมการณ"
 bftb_greece.24.desc: "หัวขอการลงมติรอบนี้คือ มหาอํานาจที่อยู ณ ที่นี้ควรยอมรับมหาอุดมการณ (เมกาลีอีเดีย) อุดมการณทวงคืนดินแดนเพื่อสรางมหากรีซที่ยึดถือกันมายาวนานหรือไม [GRE.GetLeader] ผูนําแหงชาติ[GRE.GetAdjective] ไดมาเยือนหองประชุมเฮราคลีออนอยางไมคาดฝน และกลาวสุนทรพจนอยางเรารอนวามหาอุดมการณเปนมากกวาการฉวยดินแดนอยางเห็นแกได แตคือการทําใหความฝนอันศักดิ์สิทธิ์ที่ชาว[GRE.GetAdjective]ทั่วโลกยึดมั่นรวมกันมาหลายศตวรรษเปนจริง \n\nไมตองสงสัยเลยวา หากมหาอุดมการณถูกปฏิเสธ ณ ที่นี้และเดี๋ยวนี้ สัมปทานและคํามั่นทั้งหมดที่ใหไวในการประชุมเฮราคลีออนจะเปนโมฆะ อนาคตของประชาธิปไตยและบูรณภาพแหง[GRE.GetNameDef]อาจขึ้นอยูกับการตัดสินใจของผูเขารวมในวันนี้"
 bftb_greece.24.a: "เราลงมติเห็นดวย!"
 bftb_greece.24.b: "เราลงมติไมเห็นดวย!"
 GRE_megali_idea_option_tt: "หากญัตติผาน เมื่อ §Y[TUR.GetNameDefCap]§! ยอมจํานน §Y[GRE.GetNameDefCap]§! จะผนวก§Yอิสตันบูล§!และรัฐ§Y[TUR.GetAdjective]§!อื่นๆ ที่ติดกับ§Yทะเลอีเจียน§! §Rหากกรีซถูกปฏิเสธมหาอุดมการณ ญัตติทั้งหมดที่ผานมาจะเปนโมฆะ!§!"
 bftb_greece.25.t: "การประชุมเฮราคลีออน - มหาอุดมการณถือกําเนิดใหม!"
 bftb_greece.25.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[GRE.GetNameDef]ควรไดรับอนุญาตใหทํามหาอุดมการณใหเปนจริง หากเอาชนะ[TUR.GetNameDef]ในสงครามไดสําเร็จ เจาหนาที่ของเราปลื้มปติอยางยิ่ง และ[ROOT.GetLeader]ไดแถลงตอประชาชนแลววาการประชุมเฮราคลีออนประสบความสําเร็จ แนนอนวานอกวงผูเขารวมของเราแลว ไมมีใครรูจริงๆ วาการประชุมเฮราคลีออนวาดวยเรื่องอะไร แตประชาชนจํานวนมากของเราอนุมานไดวาหัวขอหลักคือการทํามหาอุดมการณใหเปนจริง \n\nเราไดทุกสิ่งที่ตองการจากการประชุมเฮราคลีออนแลว แตตอจากนี้คือสวนที่ยากที่สุด..."
 bftb_greece.25.a: "ขอพรจงมีแดผูกระหายสงคราม!"
 bftb_greece.26.t: "การประชุมเฮราคลีออน - มหาอุดมการณถูกปฏิเสธ!"
 bftb_greece.26.desc: "ผูแทนสวนใหญที่เขารวมลงมติวา[GRE.GetNameDef]ไมควรมีสิทธิ์กอตั้งมหากรีซตามความมุงหวังแหงมหาอุดมการณ เจาหนาที่ของเรายืนยันการตัดสินใจกับผูแทนที่เขารวมดวยความตกตะลึงปนสยดสยอง และสงทุกคนกลับบานพรอมสารวาการประชุมเฮราคลีออนลมเหลว [ROOT.GetLeader]ตองออกมาแถลงตอฝูงชนในเมืองหลวงอยางประหมาวาการประชุมทั้งหมดลมเหลว และไมตองบอกก็รูวาปฏิกิริยาของฝูงชนไมเปนมิตรเลย เราเริ่มเห็นการประทวงผุดขึ้นทั่วประเทศ และสถานการณมีแนวโนมจะหลุดจากการควบคุมของเรา"
 bftb_greece.26.a: "เสียเวลาเปลาแทๆ..."
 ROOT_voted_aye_megali_effect: "ลงมติเห็นดวย!"
 ROOT_voted_nay_megali_effect: "ลงมติไมเห็นดวย!"
 bftb_greece.29.t: "คอมมิวนิสตยึดอํานาจในกรีซ"
 bftb_greece.29.desc: "รายงานขาวกรองลาสุดดูเหมือนจะยืนยันสิ่งที่เลวรายที่สุด: คอมมิวนิสตยึดอํานาจในเอเธนสและบังคับปกครองประชาชนชาว[FROM.GetAdjective] เราตองเตรียมพรอมรับความเปนไปไดของความขัดแยง หาก[SOV.GetNameDef]ไมเชื่อวาเราจะยอมคลอยตามแผนการของพวกเขา พวกเขาก็จะพยายามดึง[FROM.GetNameDef]เขารวมแผนการบอนทําลายหรือถึงขั้นทําลายเราอยางไมตองสงสัย คณะรัฐมนตรีมีมติเด็ดขาด: เราตองปดชองแคบไมให[FROM.GetNameDef]และ[SOV.GetNameDef]ผาน เพื่อหลีกเลี่ยงการโจมตีแบบคีมหนีบตอประเทศที่เปราะบางของเรา สิ่งนี้จะชวยซื้อเวลาไดบาง แตเราตองเตรียมพรอมรับความเปนไปไดของความขัดแยง"
 bftb_greece.29.a: "ความขัดแยงกําลังกอตัวขึ้นอยางแนนอน..."
 bftb_greece.30.desc: "ขาวดีมาถึงเราจากเอเธนส ที่ซึ่งคอมมิวนิสต[GRE.GetAdjective]ไดยึดอํานาจรัฐบาล ตอนนี้พวกเขาตองการทําสนธิสัญญากับเราเพื่อตอตาน[TUR.GetNameDef] เพราะพวกเขาหวังจะรวมกันกดดัน[TUR.GetNameDef]ใหยอมออนขอเกี่ยวกับชองแคบบอสพอรัส ซึ่งจะทําใหพวกนั้นกลายเปนรัฐหุนเชิดของเราโดยปริยาย อยางไรก็ตาม รัฐบาล[TUR.GetAdjective]ตื่นตระหนกและตอบโตดวยการปดกั้นไมใหเราเขาถึงทะเลดํา"
 bftb_greece.30.a: "ตอนนี้เราตอน[TUR.GetNameDef]จนมุมแลว"
 bftb_greece.30.b: "พวกเขาตองเผชิญชะตากรรมตามลําพัง"
 bftb_greece.31.t: "เดิมพันแหงบอสพอรัส"
 bftb_greece.31.desc: "เจาหนาที่โปลิตบูโรจาก[SOV.GetNameDef]ตัดสินใจเปดเผยแผนลับเกี่ยวกับอนาคตของ[TUR.GetNameDef]ใหเราทราบในที่สุด และบทบาทของเราสําคัญยิ่ง แผนนั้นคอนขางงาย: เราจะยื่นคําขาดที่ไมมีทางยอมรับไดตอ[TUR.GetNameDef]ในนามของ[SOV.GetNameDef]และการปฏิวัติสากล แลวใชการปฏิเสธที่หลีกเลี่ยงไมไดของ[TUR.GetAdjective]เปนเหตุแหงสงครามเพื่อจุดชนวนความขัดแยงในทะเลอีเจียน \n\nกองบัญชาการสูงสุดของเราแนะนําใหวางหนวยที่ดีที่สุดตามแนวชายแดนเทรซที่ติดกับ[TUR.GetNameDef] และเตรียมทหารสําหรับโจมตีดินแดน[TUR.GetAdjective]จากชายฝงหมูเกาะของเราในทะเลอีเจียน หลายคนในรัฐบาลและกองทัพของเราสงสัยวาเราจะเอาชนะกองทัพ[TUR.GetAdjective]ในการรบตัวตอตัวไดหรือไม แต[SOV.GetNameDef]ไดใหคํามั่นวาจะสนับสนุนดวยการบุกทางตอนเหนือหากการโจมตีคอนสแตนติโนเปลครั้งแรกของเราลมเหลว"
 bftb_greece.31.a: "โชคเขาขางผูกลา"
 GRE_border_war_possible_tt: "หากสถานการณบานปลาย เราอาจตองรับมือกับ§Rการปะทะตามแนวชายแดน§!ตามพรมแดนที่ติดกับ §Y[TUR.GetNameDef]§!"
 bftb_greece.32.t: "ชาวกรีกยื่นคําขาด"
 bftb_greece.32.desc: "เจาหนาที่ของเราโกรธเกรี้ยวเมื่อไดอานขอเรียกรองอันเพอฝนและไรเหตุผลโดยสิ้นเชิงของพวกมารกซิสตไรนํ้ายาแหง[FROM.GetNameDef] [FROM.GetNameDef]อางวากระทําในนามของ[SOV.GetNameDef] และเรียกรองใหเรากลับไปปฏิบัติตามขอกําหนดทุกขอของสนธิสัญญาโลซาน รวมถึงอนุญาตใหทหาร[SOV.GetAdjective]ประจําการทั่วประเทศของเรา เพื่อใหพวกเขาคํ้าประกันการปฏิบัติตามสนธิสัญญาในฐานะ 'บุคคลที่สามที่เชื่อถือไดและเปนกลาง' \n\nชาว[FROM.GetAdjective]จะหวังไดอะไรจากขอเรียกรองอันนาขันเชนนี้ นอกจากความขัดแยงตามแนวชายแดนของเรา? เราพยายามรักษาสันติภาพภายในประเทศมาทุกทาง แตเห็นไดชัดวาสันติภาพไมเคยเปนทางเลือก หากชาว[FROM.GetAdjective]กระทําในนามของ[SOV.GetNameDef]จริง บางทีความหวังเดียวที่จะรอดคือการยอมจํานน เพื่อหวังจะหยุดยั้งทหาร[SOV.GetAdjective]ไมใหยึดประเทศของเราดวยกําลัง แตเราไมเคยหลีกหนีการตอสูอันชอบธรรมมากอน หากเราไมยอมสูเพื่อคุณคาของเรา เราจะสมควรปกครองหรือ?"
 bftb_greece.32.a: "เราตองยอมจํานน"
 bftb_greece.32.b: "ชาว[FROM.GetAdjective]เดินบนเสนทางมืดมน เราตองแกไขใหถูกตอง"
 bftb_greece.33.t: "[FROM.GetNameDef]ยอมจํานน!"
 bftb_greece.33.desc: "ในความพลิกผันที่สรางความตกตะลึงแกผูสังเกตการณชาว[GRE.GetAdjective]และ[SOV.GetAdjective] [FROM.GetNameDef]ยอมตกลงตามขอเรียกรองทุกขอที่ยื่นตอพวกเขา สิทธิ์การผานชองแคบตุรกีกลับไปเปนตามสถานะกอนป 1936 และทหาร[SOV.GetAdjective]ไดรับเชิญเขาสูผืนแผนดิน[FROM.GetAdjective]เพื่อใหแนใจวา[FROM.GetNameDef]เคารพเงื่อนไขของขอเรียกรองที่ยื่นไวกอนหนานี้ \n\n[SOV.GetLeader]แสดงความยินดีดวยตนเองตอ[GRE.GetLeader]ในความกลาหาญที่ชาติของเขาแสดงใหเห็นจนแผนการนี้สําเร็จ และไดเริ่มรวบรวมกําลังทหารเพื่อเตรียมประจําการทั่ว[TUR.GetNameDef]แลว เมื่อ[TUR.GetNameDef]ไมเปนภัยคุกคามอีกตอไป [GRE.GetNameDef]จึงไดรับแจงใหจับตาสมรภูมิที่อาจเกิดขึ้นแหงอื่นในภูมิภาคใหมากขึ้น"
 bftb_greece.33.a: "นาประหลาดใจจริงๆ แตก็นายินดี!"
 bftb_greece.34.t: "[SOV.GetNameDefCap]จัดตั้งรัฐบาลหุนเชิดใหมทางตอนเหนือ!"
 bftb_greece.34.desc: "เราชางโงเขลานัก! [SOV.GetNameDef]ใชเสรีภาพในการเคลื่อนไหวทั่วพรมแดนของเราในทางมิชอบ จัดตั้งรัฐบาลคอมมิวนิสตคูแขงใกลประเทศของพวกเขา และเห็นไดชัดวาตั้งใจจะพิชิตทั้งชาติของเราในนามของรัฐบาลนั้น! เรานาจะรูตั้งแตแรกวาเรื่องจะลงเอยเชนนี้ สมาชิกบางคนในรัฐบาลของเราถึงกับหนีไปเขารวมรัฐบาลคูแขงทางเหนือ โดยอางวาสถานการณของเราสิ้นหวังแลว บางทีการยอมแพอาจชวยใหชาติของเราสูญเสียชีวิตนอยลงในวันขางหนา..."
 bftb_greece.34.a: "ยอมรับใชและมีชีวิตอยูยอมฉลาดกวา"
 bftb_greece.34.b: "เราไมยอมแพในป 1919 และเราจะไมยอมแพในตอนนี้!"
 bftb_greece.35.t: "ชาวเติรกปฏิเสธคําขาดของเรา!"
 bftb_greece.35.desc: "ตามคาด [FROM.GetNameDef]ปฏิเสธคําขาดที่ยื่นตอพวกเขา เมื่อทหารของเราประจําที่แลว เราจะยั่วยุใหเกิดความขัดแยงที่คอยๆ ทวีความรุนแรง โดยมุงจุดชนวนสงครามเต็มรูปแบบระหวางสองชาติ จะแพหรือชนะก็ตาม ตราบใดที่[SOV.GetNameDef]ยืนเคียงขางเรา เรายอมไมมีทางลมเหลว"
 bftb_greece.35.a: "ทีนี้เรื่องเริ่มนาสนุกแลว!"
 bftb_greece.36.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.36.desc: "ผิดความคาดหมายของกองบัญชาการสูงสุด เราไดรับชัยชนะเหนือกองกําลัง[FROM.GetAdjective]ตามแนวชายแดน ดวยแรงสงจากความสําเร็จอันยิ่งใหญ กองทัพของเราไดเริ่มรุกลึกเขาไปในดินแดน[FROM.GetAdjective]แลว กองบัญชาการสูงสุดซึ่งมีขอมูลลาสุดในมือเชื่อวา[FROM.GetNameDef]จะลมสลายภายในไมกี่วัน"
 bftb_greece.36.a: "เราแคถีบประตูก็เห็นความเนาเฟะขางในแลว!"
 bftb_greece.37.t: "กองกําลัง[FROM.GetAdjective]แตกพาย!"
 bftb_greece.37.desc: "ผูกอความวุนวายชาว[FROM.GetAdjective]ถูกตีถอยกลับไปหลังการโจมตีชายแดนของเราอยางไรสติ แตจากรายงานของผูสังเกตการณ เหตุการณทั้งหมดนี้ยังไมจบ กองกําลัง[FROM.GetAdjective]กําลังรวมพลตามหมูเกาะอีเจียน และเคลื่อนยายอาวุธเขาใกล[339.GetName]อยางนาตกใจ ยังมีขาวรายกวานั้น: เราไดยินวามีความเคลื่อนไหวเพิ่มขึ้นอยางมากตามแนวชายแดน[SOV.GetAdjective] และการสื่อสารที่ดักฟงไดบงชี้วาการโจมตีทางเหนืออาจเกิดขึ้นไดทุกเมื่อ เราตองเตรียมพรอม เราตองอดทน"
 bftb_greece.37.a: "ใหพวกคอมมิวนิสตเขาแถวมา แลวเราจะกวาดลางใหสิ้น"
 TUR_border_conflicts_in_trabzon_tt: "ควรวางกําลังทหารตามแนวชายแดนติดกับ §Y[354.GetName]§! และ §Y[187.GetName]§! กอนที่สถานการณจะเลวรายลงอีกครั้งอยางหลีกเลี่ยงไมได"
 bftb_greece.38.t: "ชาวเติรกเอาชนะกองกําลังของเรา!"
 bftb_greece.38.desc: "นาเสียดายที่ดูเหมือนกองกําลังของเราไมอาจเจาะแนวปองกันของ[FROM.GetAdjective]ที่[341.GetName]ได แนนอนวากองบัญชาการสูงสุดผิดหวังกับผลลัพธแตก็ไมแปลกใจ หากกองกําลัง[FROM.GetAdjective]ไมตอบโต เราก็ตองยกระดับความรุนแรงอีกครั้ง คราวนี้[SOV.GetNameDef]จะโจมตีที่มั่นของ[FROM.GetAdjective]ทางเหนือ ขณะที่เราจะยกพลโจมตีชายฝงสองจุดจาก[187.GetName]ที่[339.GetName]และ[340.GetName] คราวนี้เราจะลมเหลวไดอยางไร?"
 bftb_greece.38.a: "สําหรับ[FROM.GetNameDef] เกมนี้ถูกจัดฉากไวตั้งแตตน..."
 bftb_greece.39.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.39.desc: "กองกําลังของเราซึ่งไมไดเตรียมรับการโจมตีอยางอุกอาจเชนนี้จากกองทัพ[FROM.GetAdjective] ถูกตีถอยที่[341.GetName] นับเปนความสูญเสียครั้งรายแรงของชาติ กองกําลัง[FROM.GetAdjective]ยังไมหยุดรุกคืบ และการประกาศสงครามยอมใกลเขามาแนนอน แมความพายแพจะนาผิดหวัง แตก็ไมถึงขั้นหายนะ สงครามครั้งนี้เพิ่งเริ่มตน และประชาชนของเรายืนหยัดเคียงขางเราอยางมั่นคงในสงครามตอคูปรับเกา"
 bftb_greece.39.a: "ชาว[FROM.GetAdjective]ไมเหลือทางเลือกอื่นใหเราแลว!"
 bftb_greece.40.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.40.desc: "ตามที่กองบัญชาการสูงสุดคาดไว เราไดรับชัยชนะเหนือกองกําลัง[FROM.GetAdjective]ตามแนวชายแดนและทลายแนวปองกันของอิซมีรไดแลว ดวยแรงสงจากความสําเร็จอันยิ่งใหญ กองทัพของเราไดเริ่มบุกเขาไปในดินแดน[FROM.GetAdjective]แลว กองบัญชาการสูงสุดซึ่งฮึกเหิมจากชัยชนะเชื่อวา[FROM.GetNameDef]จะลมสลายภายในไมกี่สัปดาห"
 bftb_greece.40.a: "ผานสเมอรนา เราจะยึดทั้งประเทศ!"
 bftb_greece.41.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.41.desc: "การโจมตี[339.GetName]ของ[FROM.GetAdjective]ลมเหลวสําหรับพวกเขา แตก็ยังเปนความสูญเสียครั้งรายแรงของเรา [ROOT.GetLeader]อดไมไดที่จะนึกเปรียบเทียบเปนการสวนตัวกับป 1919 ซึ่งเปนครั้งลาสุดที่กองกําลัง[FROM.GetAdjective]เปดฉากรุกอยางโหดเหี้ยมใน[339.GetName] \n\nแมเจาหนาที่ในเมืองหลวงจะไวอาลัยแกผูเสียชีวิตในการลอม[339.GetName]อันแสนสั้น แตทั้งชาติกําลังเดือดดาลตอการโจมตีอธิปไตยของเราอยางอุกอาจโดยศัตรูเกา การโจมตีแบบไมทันตั้งตัวที่[341.GetName]นั้นนารังเกียจ แตความสูญเสียที่[339.GetName]นั้นอภัยใหไมได หากรัฐบาล[FROM.GetAdjective]ขี้ขลาดเกินกวาจะประกาศสงครามอยางเปดเผย เราก็จะประกาศใหเอง"
 bftb_greece.41.a: "เราจะลางแคนใหผูวายชนม!"
 bftb_greece.42.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.42.desc: "แผนของเราพังยับเยิน กองบัญชาการสูงสุดคาดไววาเราอาจถูกกองกําลัง[FROM.GetAdjective]ตีถอยไดสักครั้ง แตการถูกตีถอยในการจูโจมทั้งสองครั้งเปนลางรายสําหรับเราอยางแทจริง [ROOT.GetLeader]ยกเลิกการโจมตีที่เตรียมไวทั้งหมด แตความพยายามกอบกูสถานการณดูจะสูญเปลา เพราะเราเพิ่งไดรับการประกาศสงครามจากผูแทน[FROM.GetAdjective] ดูเหมือนสถานการณไดเปลี่ยนไป และไมไดเปนผลดีตอเราเสียดวย"
 bftb_greece.42.a: "เราจะไดชัยชนะ! เพื่อการปฏิวัติ!"
 bftb_greece.43.t: "ศึกชิงบอสพอรัสเริ่มตนขึ้น!"
 bftb_greece.43.desc: "การโจมตี[339.GetName]ของ[FROM.GetAdjective]ประสบความสําเร็จสําหรับพวกเขา และเปนความสูญเสียครั้งรายแรงของเรา [ROOT.GetLeader]อดไมไดที่จะนึกเปรียบเทียบเปนการสวนตัวกับป 1919 ซึ่งเปนครั้งลาสุดที่กองกําลัง[FROM.GetAdjective]ยึด[339.GetName]ได \n\nแมบรรยากาศในเมืองหลวงจะหมนหมอง แตทั้งชาติกําลังเดือดดาลตอการโจมตีอธิปไตยของเราอยางอุกอาจโดยศัตรูเกา การโจมตีแบบไมทันตั้งตัวที่[341.GetName]นั้นนารังเกียจ แตความสูญเสียที่[339.GetName]นั้นอภัยใหไมได หากชาว[FROM.GetAdjective]ตองการสงครามอีกครั้งจริงๆ เราจะมอบสงครามที่พวกเขาไมมีวันลืมให"
 bftb_greece.43.a: "เพื่อ[TUR.GetNameDef]!"
 bftb_greece.44.t: "เราไดชัยชนะใน[FROM.GetNameDef]!"
 bftb_greece.44.desc: "ตามคาด กองทัพแดงจัดการกองรักษาการณ[FROM.GetAdjective]อันนาสมเพชใน[354.GetName]ไดอยางรวดเร็ว และเปดทางใหการบุกเปนไปอยางราบรื่นนาพอใจ ขณะที่เราโจมตีจากทางเหนือ ชาว[GRE.GetAdjective]จะโจมตีจากทางตะวันตก พวกเขาไมมีทางสูได"
 bftb_greece.44.a: "การเขารวมโคมินเทิรนของ[FROM.GetAdjective]เปนขอบังคับ"
 bftb_greece.45.t: "ชาว[FROM.GetAdjective]ถูกตีถอยที่ชายแดน!"
 bftb_greece.45.desc: "เจาหนาที่ตะลึงเมื่อทราบวากองกําลังของเราที่ประจําใน[354.GetName]ขับไลผูรุกราน[FROM.GetAdjective]ที่รุกลํ้าเขามาไดสําเร็จ และรักษาที่มั่นไวไดแมจะเสียเปรียบอยางมาก ไมเพียงเราจะไดรับสาสนดวนจากเอกอัครราชทูต[FROM.GetAdjective]ที่ขออภัยอยางลนเหลือตอเหตุการณทั้งหมด แตพวกเขายังมอบขาวกรองที่ชี้วาระบอบ[GRE.GetAdjective]เปนผูบงการปฏิบัติการทั้งหมดอีกดวย เราไดรับการรับรองวาจะไมมีการตอบโตจาก[FROM.GetAdjective] หากการตอสูของเรากับ[GRE.GetNameDef]บานปลายเปนสงคราม"
 bftb_greece.45.a: "เราไดกอบกูตนเองจากความพินาศแลว"
 bftb_greece.46.t: "กองกําลัง[FROM.GetAdjective]ตีการโจมตีของเราแตกพาย!"
 bftb_greece.46.desc: "มีขาวมาวาการรุก[354.GetName]ลมเหลวอยางสิ้นเชิง เปนการทําลายเกียรติภูมิระหวางประเทศของเราและอัตตาของกองบัญชาการสูงสุดอยางยอยยับ เราไดแสดงความขออภัยอยางจริงใจที่สุดตอรัฐบาล[FROM.GetAdjective] และถอนการสนับสนุนทั้งหมดตอระบอบ[GRE.GetAdjective]ซึ่งยังคงเปนปฏิปกษตอรัฐ[FROM.GetAdjective]ทางตะวันตก"
 bftb_greece.46.a: "ตองมีคนถูกยิงเปาเพราะเรื่องนี้!"
 bftb_greece.47.t: "[FROM.GetNameDefCap]ทลายที่มั่นของเราใน[354.GetName]!"
 bftb_greece.47.desc: "ที่ปรึกษาไมกี่คนแปลกใจที่กองกําลัง[FROM.GetAdjective]ตีกองกําลังของเราทางเหนือแตกพายได แตนั่นก็ไมไดทําใหความผิดหวังลดนอยลง กองกําลัง[FROM.GetAdjective]ยังไมหยุดรุกลํ้าชายแดน[354.GetName]: เราไดรับรายงานการเคลื่อนกําลังพลขนาดใหญอยางไมตองสงสัยเปนระยะๆ ใกลชายแดนของเรา และถึงขั้นมีรายงานวาทหาร[FROM.GetAdjective]ขามเสนแบงเขตใน[800.GetName] นี่หมายถึงการบุกเทานั้น เราตองเตรียมรับสิ่งที่เลวรายที่สุด"
 bftb_greece.47.a: "นี่จะเปนหายนะของปตุภูมิหรือไม?"
 bftb_greece.48.t: "ชาว[FROM.GetAdjective]ยุยงใหเกิดกบฏคอมมิวนิสตทางใต!"
 bftb_greece.48.desc: "ระบอบมารกซิสตอันชั่วรายแหง[FROM.GetNameDef]ไดติดอาวุธใหโยซีป บรอซ ตีโต ผูกอการราย และหนุนใหเขากอกบฏทางใต! อันตรายนี้อาจไมมากนัก หากไมใชเพราะ[FROM.GetAdjective]รวมมืออยางแข็งขันกับระบอบหนาใหมทางใต โดยหวังจะโคนรัฐบาลของเรา ดูเหมือนเราจะไมมีทางเลือกนอกจากบดขยี้พวกกบฏ แลวยกทัพไปยังเมืองหลวงของ[FROM.GetAdjective]เพื่อบีบใหพวกเขายอมสยบ"
 bftb_greece.48.a: "ไอตีโตบัดซบ และพวก[FROM.GetAdjective]เวรนั่น!"
 GRE_tito_backed_guerilla_war_tt: "§Yคอมมิวนิสต§!ซึ่งไดรับการสนับสนุนเต็มที่จาก§Yชาวกรีก§! ไดกอสงครามกลางเมืองขนาดยอมทางตอนใตของประเทศเรา"
 bftb_greece.50.t: "องคกษัตริยทรงยุบรัฐสภากรีก!"
 bftb_greece.50.desc: "สมเด็จพระเจาจอรจที่ 2 ทรงสรางแรงสั่นสะเทือนไปทั่วประเทศดวยพระราชประกาศวาจะทรงเขาควบคุมประเทศโดยตรง เพื่อปองกันไมใหชาติถูกฉีกเปนชิ้นๆ ดวยการทะเลาะเบาะแวงของปรปกษทางการเมือง ดวยเหตุนี้ พระราชกฤษฎีกาฉบับแรกขององคกษัตริยจึงเปนการระงับรัฐสภากรีกอยางไมมีกําหนด สถาบันที่องคกษัตริยทรงประณามวาเปน 'รังของอสรพิษที่เห็นแกตัว' \n\nพระราชกฤษฎีกานี้ไดรับการเฉลิมฉลองจากบางฝาย แตถูกประณามอยางกวางขวางจากกลุมสําคัญอื่นๆ ในสังคม ฝายเวนิเซลอสผูนิยมสาธารณรัฐและพวกคอมมิวนิสตอันนารังเกียจไดรวมตัวกันหลังจากเปนปฏิปกษกันมานานหลายทศวรรษ ดวยความปรารถนารวมกันที่จะเห็น 'กษัตริยแหงชาวเฮลเลนส' ถูกโคนจากราชบัลลังกและกําจัดไปตลอดกาล รายงานขาวกรองในขณะนี้บงชี้วาสงครามกลางเมืองอาจปะทุขึ้นไดในอีกไมกี่สัปดาหหรือไมกี่เดือนขางหนา"
 bftb_greece.50.a: "สิทธิ์ในการปกครองขององคกษัตริยเปนสิ่งศักดิ์สิทธิ์!"
 GRE_absolute_monarch_hostile_factions_tt: "§Rสงครามกลางเมือง§!นาจะใกลเขามาแลว..."
 bftb_greece.51.t: "ฝายนิยมกษัตริยในกรีซขอความชวยเหลือจากเรา!"
 bftb_greece.51.desc: "รัฐบาลฝกใฝ[ROOT.GetAdjective]ในเอเธนสไดขอความชวยเหลือดานยุทโธปกรณจากเรา หลังจากความแตกแยกทางการเมืองทั่วประเทศนําไปสูสงครามกลางเมืองอันหายนะ แนนอนวาพวกเขามีสิทธิ์เต็มที่ที่จะรองขอ แตคําถามวาพวกเขาคุมคากับสิ่งที่ขอหรือไมนั้น มีเพียงเราเทานั้นที่ตอบได"
 bftb_greece.51.a: "พวกเขาตองการปนไรเฟลแนนอน"
 bftb_greece.51.b: "เราพอแบงเสบียงไปชวยไดบาง"
 bftb_greece.51.c: "อยาเขาไปยุงกับกิจการของกรีซจะดีกวา"
 bftb_greece.52.t: "[FROM.GetNameDefCap]สงอาวุธและอาสาสมัครมาใหเรา!"
 bftb_greece.52.desc: "เราเพิ่งขนถายอาวุธและอาสาสมัครจาก[FROM.GetNameDef]ลงจากทาเรือเสร็จ การสนับสนุนนี้เปนที่ยินดีอยางยิ่งและมากเกินกวาที่เราคาดหวังไวมาก ความชวยเหลือนี้จะเปนประโยชนแกเราอยางมากในหลายเดือนขางหนา"
 bftb_greece.52.a: "พันธมิตรแทขององคกษัตริย!"
 bftb_greece.53.t: "[FROM.GetNameDefCap]สงความชวยเหลือมาใหเรา!"
 bftb_greece.53.desc: "เราเพิ่งขนถายเสบียงที่สงมาจาก[FROM.GetNameDef]ลงจากทาเรือเสร็จ การสนับสนุนนี้เปนที่ยินดีอยางยิ่ง และเปนการแสดงมิตรภาพที่นาชื่นใจในยามยากเชนนี้ ความชวยเหลือนี้จะเปนประโยชนแกเราอยางมากในหลายเดือนขางหนา"
 bftb_greece.53.a: "พันธมิตรแทขององคกษัตริย!"
 bftb_greece.54.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะชวยเหลือเรา"
 bftb_greece.54.desc: "เราไดรับแจงจากนักการทูต[FROM.GetAdjective]วาคํารองขอความชวยเหลือของเราไมไดรับการตอบสนอง และเราไมควรคาดหวังความชวยเหลือใดๆ จาก[FROM.GetNameDef] สถานการณนี้นาเสียดาย แตเราจะอดทนตอสูตอไปแมไมมีความชวยเหลือจากตางชาติ"
 bftb_greece.54.a: "นาผิดหวัง"
 bftb_greece.55.t: "[GRE.GetNameDefCap]เสนอเอโนซิส"
 bftb_greece.55.desc: "ผูแทนจาก[FROM.GetNameDef]เสนอใหเรารวมสองชาติเขาเปนหนึ่งเดียว โดยอางถึงประวัติศาสตรและมรดกทางวัฒนธรรมรวมกัน ผูแทน[FROM.GetAdjective]แสดงวาเปนความประสงคของรัฐบาล[FROM.GetAdjective]ที่จะทําใหแนวคิด 'เอโนซิส' อันเปนที่เชิดชูมายาวนานเปนจริง นั่นคือการรวมรัฐของเราเขาเปนหนึ่งเดียวที่ยิ่งใหญกวา"
 bftb_greece.55.a: "ความคิดที่ยอดเยี่ยม!"
 bftb_greece.55.b: "ไซปรัสจะเดินบนเสนทางของตนเอง"
 end_of_cyprus_tt: "§Rสิ่งนี้จะทําใหเกมจบลง!§!"
 bftb_greece.56.t: "[CYP.GetNameDefCap]ยอมรับเอโนซิส"
 bftb_greece.56.desc: "เราไดรับแจงจากชาว[FROM.GetAdjective]วาพวกเขายินดีใหประชาชนทั้งสองของเรารวมเปนรัฐเดียวภายใตการควบคุมของเรา ซึ่งเปนสิ่งที่รอคอยมานาน การเฉลิมฉลองเกิดขึ้นทั่วประเทศ และ[ROOT.GetLeader]เดินทางไปนิโคเซียดวยตนเองเพื่อกลาวสุนทรพจนตอประชาชนที่นั่นเนื่องในวันประวัติศาสตรนี้"
 bftb_greece.56.a: "พี่นองไดรวมเปนหนึ่งในที่สุด!"
 bftb_greece.57.t: "[CYP.GetNameDefCap]ปฏิเสธเอโนซิส!"
 bftb_greece.57.desc: "เจาหนาที่[FROM.GetAdjective]แจงเราวาพวกเขาไมมีเจตนาจะสละอธิปไตยของ[FROM.GetAdjective] หลังจากตองตอสูอยางยาวนานกวาจะไดมา มีการประกาศวา 'เอโนซิส' ไมใชแนวคิดที่รัฐบาล[FROM.GetAdjective]พรอมจะพิจารณาในเวลานี้"
 bftb_greece.57.a: "นั่นไมใชคําขอ"
 bftb_greece.57.b: "ก็ได ถานั่นคือความปรารถนาของพวกเขา..."
 bftb_greece.58.t: "[FROM.GetNameDefCap]ขอเอโนซิสกับไซปรัส"
 bftb_greece.58.desc: "ผูแทน[FROM.GetAdjective]ไดทาบทามเราเพื่อหารือเรื่องอนาคตของอาณานิคมในพระมหากษัตริยไซปรัส ชาว[FROM.GetAdjective]กลาวหาวาความพยายามสรางชาติไซปรัสยอมลงเอยดวยความลมเหลวเสมอ เพราะแทจริงแลวชาวไซปรัสก็คือชาว[FROM.GetAdjective] \n\nชาว[FROM.GetAdjective]ไดมอบจดหมายจาก[FROM.GetLeader] นายกรัฐมนตรี[FROM.GetAdjective] ซึ่งอธิบายประวัติของแนวคิด 'เอโนซิส' อยางละเอียด กอนจะปดทายดวยการวิงวอนอยางหนักแนนใหรวมไซปรัสกับ[FROM.GetNameDef] ผูแทน[FROM.GetAdjective]พยายามยืนยันกับผูแทนของเราวานี่ไมใชเรื่องลัทธิทวงคืนดินแดนอยางหยาบๆ จากฝาย[FROM.GetAdjective] ไซปรัสกับ[FROM.GetNameDef]มีมรดกทางวัฒนธรรมรวมกัน ประวัติศาสตรรวมกัน ภาษารวมกัน และในมุมมองของ[FROM.GetAdjective]: ชะตากรรมรวมกัน \n\nเจาหนาที่ทหารของเราเนนยํ้าความสําคัญของไซปรัสในฐานะฐานทัพทางยุทธศาสตรที่สําคัญในเมดิเตอรเรเนียน แตที่ปรึกษาดานนโยบายตางประเทศเนนวาพันธมิตร[FROM.GetAdjective]ที่เขมแข็งขึ้นอาจใหประโยชนไดมากกวาไซปรัสเพียงลําพังในฐานะฐานทัพอากาศและฐานทัพเรือ การตัดสินใจขั้นสุดทายขึ้นอยูกับคณะรัฐมนตรี[ROOT.GetAdjective] แตเราไมควรปลอยใหผูแทน[FROM.GetAdjective]รอคําตอบนานเกินไป"
 bftb_greece.58.a: "เรายอมรับขอเสนอเพื่อแลกกับการเปนพันธมิตรอยางเปนทางการ"
 bftb_greece.58.b: "ยกใหพวกเขาไปเถอะ ไซปรัสไมมีความสําคัญอะไรกับเรา"
 bftb_greece.58.c: "รัฐบาล[FROM.GetAdjective]ตองแบงปนอํานาจกับทางการ 'ไซปรัส'"
 bftb_greece.58.d: "พวกกรีกจอมโลภจะไมไดอะไรเลย!"
 bftb_greece.59.t: "[FROM.GetNameDefCap]ตกลงใหเอโนซิสเกิดขึ้น!"
 bftb_greece.59.desc: "บรรยากาศในเมืองหลวงคงอธิบายไดดีที่สุดวา 'ปลาบปลื้มยินดี' หลังจาก[ROOT.GetLeader]ประกาศตอประชาชนวาหลังจากผานมาหลายป ความฝนของ[ROOT.GetAdjective]เรื่องเอโนซิสกับไซปรัสจะเปนจริงในที่สุด ทั้งหมดนี้ตองขอบคุณมิตรชาว[FROM.GetAdjective]ของเรา เจาหนาที่บริหารของเรารีบเดินทางไปไซปรัสทันทีเพื่อใหการถายโอนอํานาจเปนไปอยางราบรื่นที่สุด \n\nนี่เปนวันอันยิ่งใหญและเปนประวัติศาสตรอยางแทจริงของ[ROOT.GetNameDef] ไซปรัสเปนสวนหนึ่งของจิตสํานึกรวมของ[ROOT.GetAdjective]มาชานาน และบัดนี้พวกเขาไดกลับบานสูออมอกของอารยธรรมที่ตนถือกําเนิดมาในที่สุด"
 bftb_greece.59.a: "ไดอยูดวยกันเสียที!"
 bftb_greece.59.b: "เราไมอาจสละอํานาจปกครองตนเองเพื่อเอโนซิสได"
 bftb_greece.60.t: "[FROM.GetNameDefCap]ยอมรับเอโนซิสบางสวน"
 bftb_greece.60.desc: "ชาว[FROM.GetAdjective]เสนอทางประนีประนอมที่แปลกประหลาดตอคําขอเดิมของเราใหเกิดเอโนซิส: พวกเขายินดีทําตามคําขอของเรา โดยมีเงื่อนไขวาเราตองรวมมือกับรัฐบาลไซปรัสที่มีสถานะเทียบเทาประเทศในเครือจักรภพของ[FROM.GetAdjective] นี่ไมใชผลลัพธที่ไมนายินดีเสียทีเดียว เพียงแต... ไมคาดคิด \n\nฝายรัฐบาลไซปรัสเองก็ตกลงวา หาก[ROOT.GetNameDef]แสดงความทุมเทตอไซปรัสมากพอดวยการพัฒนาชาติที่เพิ่งตั้งไขของพวกเขา พวกเขาก็ไมขัดของที่จะเกิดเอโนซิสโดยสมบูรณระหวางเรา แตจนกวาจะถึงวันนั้น เราตองพอใจกับพันธมิตรไซปรัสใหมที่ผูกติดกับเราอยางแนบแนน"
 bftb_greece.60.a: "ยินดีตอนรับ พี่นอง!"
 bftb_greece.61.t: "[FROM.GetNameDefCap]ปฏิเสธเอโนซิส!"
 bftb_greece.61.desc: "ความไววางใจและศรัทธาที่เรามีตอพันธมิตรที่รักษามาเนิ่นนานดูจะวางผิดที่ [FROM.GetNameDef]ปฏิเสธที่จะพิจารณาแมแตแนวคิดการโอนเกาะไซปรัสของ[ROOT.GetAdjective]ใหอยูใตการควบคุมของเรา พวกเขาอางความสําคัญทางยุทธศาสตรของเกาะ และความกังวลตอลัทธิทวงคืนดินแดนของ[ROOT>GetAdjective] เปนเหตุผลวาทําไมในสายตาพวกเขา เราจึงไมสมควรไดเกาะนี้ \n\nจะวาเราแปลกใจโดยสิ้นเชิงก็ไมได แตนั่นไมไดทําใหความผิดหวังรวมกันของเราขมขื่นนอยลง เรารอคอยใหไซปรัสกลับคืนสูปตุภูมิมากี่ปแลว? และเราจะตองรออีกกี่ปเพราะอุปสรรคครั้งนี้? ตองยอมรับวาความกระตือรือรนตอความสัมพันธกับ[FROM.GetNameDef]ของเราลดลงอยางมากจากเหตุการณนี้"
 bftb_greece.61.a: "เราจะจดจําเรื่องนี้ไว..."
 bftb_greece.62.t: "[FROM.GetNameDefCap]เสนอใหยื่นสมัครเขารวมฝายอักษะรวมกัน!"
 bftb_greece.62.desc: "เมื่อขาวมาถึงวาระบอบเกาของ[FROM.GetAdjective]ถูกแทนที่ดวยระบอบฟาสซิสต ความหวาดหวั่นอยางใหญหลวงก็ปกคลุมเหลาที่ปรึกษาในเมืองหลวง เรารูสึกวาสงครามกลายเปนสิ่งที่หลีกเลี่ยงไมได และยิ่งขมขื่นขึ้นเมื่อนึกถึงความพยายามรักษาสันติภาพในภูมิภาคทะเลอีเจียนที่ผานมา แตดูเหมือนโชคชะตาจะพิสูจนวาเราคิดผิด \n\nเราไดรับขอเสนอที่ไมเหมือนใคร: รัฐบาลฟาสซิสตแหง[FROM.GetNameDef]เชื่อวาสงครามจะลามมาถึงทั้งสองประเทศอยางหลีกเลี่ยงไมได [FROM.GetLeader]แมจะมีแนวโนมทางอุดมการณเชนนั้น แตก็เห็นพองกับเราวาไมฉลาดนักที่จะทิ้งความพยายามทางการทูตหลายทศวรรษของทั้งสองฝาย เพียงเพื่อสงครามที่ยอมยิ่งใหญและเลวราย ดวยเหตุนี้ รัฐบาลแหง[FROM.GetNameDef]จึงเสนอใหเราผูกตนเขากับมหาอํานาจฟาสซิสตที่กําลังผงาดขึ้นในยุโรปดวยกัน [FROM.GetLeader]เชื่อวาความเปนใหญของฟาสซิสตบนภาคพื้นทวีปเปนสิ่งหลีกเลี่ยงไมได และเราทั้งสองมีพลังพอจะเอียงตาชั่งใหสงครามจบลงเร็วขึ้นและเด็ดขาดยิ่งขึ้น [FROM.GetLeader]เรียกสิ่งนี้วา 'ความเมตตา' แต[ROOT.GetLeader]ไมแนใจนัก"
 bftb_greece.62.a: "ในนามแหงสันติภาพ จงทําสงคราม"
 bftb_greece.62.b: "ชาว[FROM.GetAdjective]บาไปแลวจริงๆ..."
 bftb_greece.63.t: "[FROM.GetNameDefCap]ตกลงในสนธิสัญญามิตรภาพเฮลเลนิก-เติรก!"
 bftb_greece.63.desc: "สําเร็จ! เอกอัครราชทูต[FROM.GetAdjective]ไดแจงความยินยอมของรัฐบาลตอสนธิสัญญามิตรภาพที่เราเสนอ เมื่อทํางานรวมกับมหาอํานาจฟาสซิสตขณะที่ผูกพันกันไวเชนนี้ เราไมมีทางแพแนนอน"
 bftb_greece.63.a: "ขอใบสมัครเขาฝายสองใบดวย!"
 bftb_greece.63.b: "หรือบางที... เราไมจําเปนตองมีพวกเติรกก็ได?"
 GRE_no_turkey_needed: "เราจะใชการปลอมแปลงเอกสารและการหลอกลวงทําลายความสัมพันธของ§Yตุรกี§!กับ§Yมหาอํานาจฟาสซิสต§!"
 bftb_greece.64.t: "[FROM.GetNameDefCap]ปฏิเสธสนธิสัญญามิตรภาพเฮลเลนิก-เติรกอยางเด็ดขาด!"
 bftb_greece.64.desc: "ดูเหมือนรัฐบาล[FROM.GetAdjective]จะขาดวิสัยทัศนอยางเรื้อรัง พวกเขาจะไมเขารวมกับผูชนะที่แนนอนเคียงขางเรา เพราะพวกเขาเปนทั้งคนขี้ขลาดหรือไมก็คนโง ไมสําคัญหรอก เสนทางของเราถูกกําหนดแลว และไมวาอะไรจะเกิดขึ้นกับ[FROM.GetNameDef]ตอจากนี้ สวนหนึ่งก็เปนความผิดของพวกเขาเอง"
 bftb_greece.64.a: "ผูแข็งแกรงจะไดครองโลก ผูออนแอจะตองพินาศ"
 bftb_greece.65.t: "[FROM.GetNameDefCap]และ[TUR.GetNameDef]เสนอความเปนหุนสวนทางยุทธศาสตร"
 bftb_greece.65.desc: "ทุกอยางดูจะลงล็อกเหมือนชิ้นสวนจิ๊กซอว การเปลี่ยนระบอบในเบอรลินเปนเรื่องไมคาดฝน และสรางความกังขามากมายตออนาคตของชาติเรา อนาคตนั้นชัดเจนขึ้นเล็กนอยดวยขอเสนอที่สงมาจากเอเธนส \n\nดูเหมือน[FROM.GetNameDef]และ[TUR.GetNameDef]ปรารถนาจะสรางพันธมิตรทางยุทธศาสตรที่ยั่งยืนกับรัฐบาลของเรา เราขาดแคลนพันธมิตรมานาน และการไดทั้งสองชาตินี้เขารวมสนธิสัญญาเมดิเตอรเรเนียนยอมชวยใหเราบรรลุความทะเยอทะยานในภูมิภาคไดมาก แตใครจะรู ทั้งสองชาตินั้นอาจเปนเปาหมายความทะเยอทะยานอีกแบบหนึ่งของเราก็ได"
 bftb_greece.65.a: "รวมกัน เราจะสรางประวัติศาสตร!"
 bftb_greece.65.b: "แผนของเราสําหรับสองชาตินั้นไมมีที่วางใหกับการเปนพันธมิตรแนนอน"
 bftb_greece.66.t: "[FROM.GetNameDefCap]และ[TUR.GetNameDef]สมัครเปนสมาชิก[GER.GetFactionName]"
 bftb_greece.66.desc: "เราไดพบกับผูแทนจากทั้ง[FROM.GetNameDef]และ[TUR.GetNameDef] และคอนขางประหลาดใจที่ไดยินวาทั้งสองยื่นใบสมัครรวมกันเพื่อเขา[ROOT.GetFactionName] นี่ไมใชเรื่องนาประหลาดใจในทางที่ไมดี แตก็เปนเรื่องนาประหลาดใจอยูดี เราตองพิจารณาวาการมีพวกเขาเปนหุนสวนในพันธมิตรจะชวยสงเสริมหรือขัดขวางเปาหมายของเรา"
 bftb_greece.66.a: "พวกเขาเปนพันธมิตรที่นายินดีในยามวุนวายเชนนี้"
 bftb_greece.66.b: "ไม (Nein) เราไมจําเปนตองมีพวกเขา"
 bftb_greece.67.t: "[FROM.GetNameDefCap]เสนอความเปนหุนสวนทางยุทธศาสตร!"
 bftb_greece.67.desc: "ทุกอยางดูจะลงล็อกเหมือนชิ้นสวนจิ๊กซอว การเปลี่ยนระบอบในเบอรลินเปนเรื่องไมคาดฝน และสรางความกังขามากมายตออนาคตของชาติเรา อนาคตนั้นชัดเจนขึ้นเล็กนอยดวยขอเสนอที่สงมาจากเอเธนส \n\nดูเหมือน[FROM.GetNameDef]ปรารถนาจะสรางพันธมิตรทางยุทธศาสตรที่ยั่งยืนกับรัฐบาลของเรา เราขาดแคลนพันธมิตรมานาน และความชวยเหลือของ[FROM.GetNameDef]ยอมชวยใหเราบรรลุความทะเยอทะยานในภูมิภาคไดมาก แตใครจะรูวานี่ไมใชเพียงความพยายามเฮือกสุดทายอันนาสมเพชเพื่อเอาตัวรอด? บางทีพวกเขาอาจไมไดตองการเปนพันธมิตรของเราจริงๆ บางทีพวกเขาอาจเห็นลางราย และรูวาทุกอยางจะจบลงอยางไรสําหรับพวกเขาหากตอตานเรา... และบางทีความแตกตางนั้นก็ไมไดสําคัญอะไรสําหรับเรา"
 bftb_greece.67.a: "โรมและเอเธนส - ไดกลับมารวมมือกันอีกครั้งในที่สุด!"
 bftb_greece.67.b: "ผูลายอมไมคบหากับเหยื่อ"
 bftb_greece.68.t: "[FROM.GetNameDefCap]สมัครเปนสมาชิก[GER.GetFactionName]!"
 bftb_greece.68.desc: "เราไดพบกับผูแทนจาก[FROM.GetNameDef] และคอนขางโลงใจที่ไดยินวารัฐบาล[FROM.GetAdjective]แสดงความปรารถนาจะให[FROM.GetNameDef]เขารวม[ROOT.GetFactionName] ไมนาแปลกใจเลย เพราะสถานะของ[FROM.GetAdjective]ไมอาจยืนหยัดไดหากไมมีเรา เราตองพิจารณาวาการมีพวกเขาเปนหุนสวนในพันธมิตรจะชวยสงเสริมหรือขัดขวางเปาหมายของเรา"
 bftb_greece.68.a: "ยินดีตอนรับ กรีซ! (Willkommen, Griechenland!)"
 bftb_greece.68.b: "ไม (Nein) ไมมีทาง!"
 bftb_greece.69.t: "[FROM.GetNameDefCap]ปฏิเสธคําขอเปนพันธมิตรของเรา!"
 bftb_greece.69.desc: "นักการทูต[FROM.GetAdjective]แจงเราวา[FROM.GetLeader]เห็นวาการรับเราเขาสูพันธมิตรอันใกลชิดของพวกเขาไมใชการตัดสินใจที่ฉลาด จะบอกวาเราผิดหวังก็ยังนอยไป อยางไรก็ตาม เมื่อไมมีพันธมิตรกับ[FROM.GetNameDef] เราตองหาเสนทางของตนเองฝาวิกฤตครั้งนี้"
 bftb_greece.69.a: "เมื่อทุกอยางจบลง เราจะยังคงยืนหยัดอยู"
 bftb_greece.70.t: "เอเลฟเทริออส เวนิเซลอส ถึงแกกรรมขณะลี้ภัย"
 bftb_greece.70.desc: "เอเลฟเทริออส เวนิเซลอส ผูนําฝายเวนิเซลอสและยักษใหญผูเปนที่เคารพแหงการเมืองกรีก ไดถึงแกกรรมขณะยังลี้ภัยอยู หลังถูกกองทัพขับออกจากอํานาจในป 1935 เวนิเซลอสเปนผูมีสวนสรางระบบหลายพรรคของกรีซอยางแข็งขัน และอาจเปนบุคคลที่ไมมีใครเทียบไดในแงอิทธิพลตอจิตสํานึกแหงชาติกรีก \n\nอยางไรก็ตาม สิ่งที่ผูคนจะจดจําเกี่ยวกับเอเลฟเทริออส เวนิเซลอส ไมใชความสําเร็จ แตเปนความลมเหลวมากมายของเขา เวนิเซลอสคือผูชูพลังทําลายลางของลัทธิสาธารณรัฐในประเทศนี้ และลัทธิแกไขพรมแดนอันไรสติของเวนิเซลอสคือสิ่งที่ทําใหชาติเราเกือบถูกทําลายลางในสงครามกรีก-ตุรกีป 1919 ทุกปญหาที่กรีซเผชิญอยูทุกวันนี้ลวนโทษไดวาเวนิเซลอสเปนตนเหตุหลักแหงความทุกขทั้งปวงของชาติ \n\nเขาเปนนักปฏิวัติ รัฐบุรุษ และผูบุกเบิกทางการเมือง เขาเปนนักปลุกระดม ผูกระหายสงคราม และผูลมเหลว จะมีอะไรใหพูดถึงเอเลฟเทริออส เวนิเซลอสอีก นอกจากวาเรายินดีที่เขาจะไมมีวันโผลหนามาในกรีซอีก หลังจากความเจ็บปวดทั้งหมดที่เขากอไว"
 bftb_greece.70.a: "ไปเสียไดก็ดี"
 bftb_greece.71.t: "เอเลฟเทริออส เวนิเซลอส ถึงแกกรรม"
 bftb_greece.71.desc: "นายกรัฐมนตรีเอเลฟเทริออส เวนิเซลอส ผูนําฝายเวนิเซลอสและยักษใหญผูเปนที่เคารพแหงการเมืองกรีก ไดถึงแกกรรมอยางสงบที่บานของเขา เวนิเซลอสเปนผูมีสวนสรางระบบหลายพรรคของกรีซอยางแข็งขัน และอาจเปนบุคคลที่ไมมีใครเทียบไดในแงอิทธิพลตอจิตสํานึกแหงชาติกรีก \n\nถอยคําเพียงลําพังจะยกยองชายผูอุทิศตนมากมายใหแกประเทศและเพื่อนรวมชาติไดอยางคูควรไดอยางไร? เขาคือสถาปนิกของชาติที่เรามีเกียรติไดรับใชอยูในวันนี้ และมรดกอันยั่งยืนที่เขาทิ้งไวจะคงอยูยาวนานกวาพวกเราทุกคน รอยดางเดียวบนประวัติอันไรที่ติของเวนิเซลอสคือความสูญเสียอันเลวรายที่ชาติเราไดรับหลังสงครามกรีก-ตุรกีป 1919 อันหายนะ เปนรอยดางบนมรดกที่สมบูรณแบบซึ่งเราตั้งใจแนวแนจะลางแคนให \n\nเอเลฟเทริออส เวนิเซลอส เปนนักปฏิวัติ รัฐบุรุษ และผูบุกเบิกทางการเมือง เขาคือเอทนารค (ผูนําแหงชาติ) ของเรา และเราจะจดจําเขาในฐานะผูมีหัวใจสิงหที่ไมยอมประนีประนอม เทมิสโตคลิส โซฟูลิส ไดขึ้นดํารงตําแหนงนายกรัฐมนตรีและหัวหนาพรรคเสรีนิยม และไดประกาศใหเปนวันไวทุกขแหงชาติแดบิดาแหงกรีซสมัยใหมผูเพิ่งจากไป"
 bftb_greece.71.a: "กรีซติดหนี้ทานที่ไมมีวันชดใชไดหมด..."
 bftb_greece.91.t: "EEE เปดศูนยชวยเหลือผูลี้ภัยอนาโตเลีย"
 bftb_greece.91.desc: "ดวยความพยายามอันเจาเลหเพื่อดึงผูติดตามมาสูอุดมการณของตนมากขึ้น เกออรกิโอส คอสมิดิส ไดใชเงินทุนของขบวนการเปดศูนยชวยเหลือผูลี้ภัยจาก[TUR.GetNameDef]เชนเดียวกับตัวเขาเอง นี่คงเปนเรื่องนายกยอง หากเขาไมไดใชศูนยชวยเหลือเหลานี้เปนศูนยรับสมัครสมาชิกของขบวนการวิปลาสของเขา \n\nเราตกอยูในสถานการณลําบาก: เห็นไดชัดวาคอสมิดิสตั้งใจจะคํ้าจุนศูนยเหลานี้ตอไปเพื่อรับสมัครผูลี้ภัยจากอนาโตเลียที่ถูกตัดสิทธิ์ เราจะปดศูนยเพื่อหยุดยั้งพิษรายของเขา หรือจะรักษาชื่อเสียงของเราและปลอยใหศูนยเหลานี้ดําเนินการตอไป? บางคนอาจแยงวาการใหผูลี้ภัยยากไรทํางานในศูนยชวยเหลือของฟาสซิสตยังดีกวาปลอยใหพวกเขาทนทุกขในสลัม"
 bftb_greece.91.a: "เปนโครงการที่ควรคาแกการสนับสนุน!"
 bftb_greece.91.b: "สั่งปดเสีย"
 bftb_greece.92.t: "EEE เรียกรองคาแรงที่สูงขึ้นสําหรับแรงงาน[ROOT.GetAdjective]"
 bftb_greece.92.desc: "EEE ฉวยประโยชนจากความสนใจระดับชาติที่พุงมายังพวกเขา โดยเปดฉากโจมตีอยางรุนแรงตอสิ่งที่พวกเขามองวาเปนแนวทางสวัสดิการที่ออนแอของเรา ความคิดที่วาพวกฟาสซิสตที่โผลมาจากไหนก็ไมรูเหลานี้คิดวาตนมีสิทธิ์มาสั่งสอนเราเรื่องนโยบายการคลังและสังคมนั้นนาขัน แตดูเหมือนสาธารณชนจะเอาจริงเอาจังกับพวกเขามาก"
 bftb_greece.92.a: "บางที... คาแรงขั้นตํ่าเชิงสัญลักษณ?"
 bftb_greece.92.b: "เราไมกมหัวใหการขมขูของฟาสซิสต"
 bftb_greece.93.t: "สมาชิก EEE ปะทะรุนแรงกับตํารวจของเราบนทองถนน!"
 bftb_greece.93.desc: "การตะลุมบอนระหวางสมาชิก EEE กับกองกําลังตํารวจของเราปะทุขึ้นทั่วประเทศ ฉายภาพของยุคแหงความรุนแรงทางการเมืองที่เราหวังวาไดทิ้งไวเบื้องหลังแลว แตดูจากรายงานผูบาดเจ็บเขาโรงพยาบาลและความรุนแรงที่ทวีขึ้น เห็นทีจะยังไมใช \n\nรัฐมนตรีบางคนเสนอใหใชมาตรการแข็งกราวตอความรุนแรงนี้ เพื่อแสดงใหประเทศเห็นวาเราไมยอมทนตอพฤติกรรมอันธพาลเชนนี้ แตรัฐมนตรีคนอื่นเตือนวาการตอบโตฟาสซิสตแบบตาตอตาฟนตอฟนไมใชศึกที่เราจะชนะได ประชาชนโกรธแคนและไมพอใจ แตนั่นไมควรใหสิทธิ์พวกเขากอความรุนแรงอยางไรเหตุผลเชนนี้"
 bftb_greece.93.a: "ความคับของใจของพวกเขามีเหตุผล"
 bftb_greece.93.b: "ความรุนแรงนี้นารังเกียจ ตองสลายฝูงชนวุนวายเสีย"
 bftb_greece.94.t: "สมาชิก EEE ปลนโรงงานของตางชาติและแจกจายสินคาที่ขโมยมา!"
 bftb_greece.94.desc: "ในภาพเหตุการณที่นาเสียดายวาคุนตาเกินไป สาวก EEE บุกเขาโรงงานที่ตางชาติเปนเจาของเพื่อนําสินคาที่ผลิตภายในไปแจกจายแกคนยากจนและผูถูกตัดสิทธิ์ เกออรกิโอส คอสมิดิส และแกนนํา EEE อางวาไมรูเรื่องการกระทําดังกลาว แตก็ออกมาปกปองชายหญิงที่มีสวนรวมในการปลนตอเนื่องที่ดูเหมือนจะทําเพื่อผูอื่นนี้อยางแข็งขัน \n\nพฤติกรรมเชนนี้ไมอาจยอมรับไดจริงๆ เราไดรับคํารองเรียนจากเจาพอธุรกิจตางชาติจากประเทศอยาง[ENG.GetNameDef]และ[FRA.GetNameDef]แลว ถึงกระนั้น หากเราเขาแทรกแซงเพื่อนักอุตสาหกรรม เราก็จะดูเหมือนหุนเชิดของนายทุนตางชาติ แตหากเราปลอยใหความอนาธิปไตยนี้ลุกลาม เราก็จะดูเปนรัฐบาลที่ไรความสามารถในสายตาประชาคมโลก"
 bftb_greece.94.a: "เราไมควรหยุดพวกเขา"
 bftb_greece.94.b: "ความอนาธิปไตยนี้ไมสมกับเรา!"
 bftb_greece.95.t: "EEE ประกาศรวมการตอสูของเรา!"
 bftb_greece.95.desc: "EEE ซึ่งเปนเสี้ยนหนามของเรามาจนถึงบัดนี้ ดูเหมือนพรอมจะรวมมือกับรัฐบาลเพื่อตอตานศัตรูรวม เกออรกิโอส คอสมิดิส เปนหนึ่งในผูสนับสนุนสงครามกับ[TUR.GetNameDef]ที่เสียงดังที่สุด และเมื่อสงครามนั้นมาถึงชายฝงของเราแลว EEE ก็พรอมจะวางการเมืองแบบพรรคพวกไวกอน เพื่อใหศัตรู[TUR.GetAdjective]ตองกมหัวตอหนากองทัพของเรา"
 bftb_greece.95.a: "เมื่อรวมเปนหนึ่ง ไมมีใครหยุดเราได!"
 bftb_greece.95.b: "เราจะชนะโดยไมตองแปดเปอนลัทธิฟาสซิสต"
 bftb_greece.96.t: "อริสโตเติล โอนาซิส กลับสู[ROOT.GetNameDef]"
 bftb_greece.96.desc: "อริสโตเติล โอนาซิส มหาเศรษฐีและบุคคลในแวดวงสังคมชั้นสูงที่เปนที่รักในระดับนานาชาติ ไดกลับสู[ROOT.GetNameDef]เปนครั้งแรกในรอบหลายป เขาไมตอบคําถามของสื่อ และผูสังเกตการณของเราก็ติดตามตัวเขาไดยาก แตรายงานระบุวาเขากําลังผูกมิตรกับประชากรผูลี้ภัยอนาโตเลีย และอาจกําลังเตรียมการเพื่อชิงตําแหนงทางการเมือง"
 bftb_greece.96.a: "เขากําลังวางแผนอะไรอยู?"
 bftb_greece.101.t: "ฝายเวนิเซลอสและคอมมิวนิสตผนึกกําลังตอตานการปกครองแบบเบ็ดเสร็จขององคกษัตริย"
 bftb_greece.101.desc: "หากเคยมีขอสงสัยใดเกี่ยวกับการเปนพันธมิตรระหวางคอมมิวนิสตกับฝายเวนิเซลอส บัดนี้ก็ไมเหลืออีกแลว เราไดรับรายงานวาพวกคอมมิวนิสตลักลอบพาเอเลฟเทริออส เวนิเซลอสกลับเขาประเทศ โดยหวังจะยกเขาขึ้นเปนผูนําชั่วคราวหลังโคนลมสถาบันกษัตริย \n\nชางเปนแผนที่บาบิ่น แมแตสําหรับพวกคนทรยศแดงก็ตาม พวกเขาคิดไดอยางไรวาเวนิเซลอสจะยอมสละอํานาจใหเมื่อไดมันมาแลว? บาไปแลว แตก็นั่นแหละ ทั้งพวกคอมมิวนิสตและฝายเวนิเซลอสไมเคยเปนพวกที่มีเหตุผลที่สุดอยูแลว เราตองเตรียมรับสงครามกลางเมืองที่ดุเดือดอยางแนนอน"
 bftb_greece.101.a: "ศัตรูของเรามุดหัวรวมกันเหมือนหนู!"
 bftb_greece.102.t: "คอมมิวนิสตบุกปลนโรงงาน"
 bftb_greece.102.desc: "เจาหนาที่บังคับใชกฎหมายไมอาจคาดการณและหยุดยั้งการบุกปลนของคอมมิวนิสตเมื่อเร็วๆ นี้ ที่โรงงานแหงหนึ่งซึ่งเราใชผลิตปนไรเฟลใหกองทัพ พวกมารกซิสตขนทุกอยางที่ขนไดไปจากพื้นโรงงาน แลวพยายามเผาโรงงานทิ้ง แตโชคดีที่พวกเขาทําไดเพียงสรางความเสียหายใหอาคาร \n\nไมจําเปนตองคาดเดาวาทําไมผูกอความไมสงบเหลานี้จึงบุกปลนโรงงานผลิตอาวุธอยางอุกอาจเชนนี้: ไมตองสงสัยเลยวาพวกเขาตั้งใจจะใชปนไรเฟลของเราเองยอนกลับมาเลนงานเรา เมื่อพวกเขากลาพอจะออกมาจากเงามืด นี่อาจกลายเปนสงครามกลางเมืองที่เลวรายที่สุดครั้งหนึ่งของ[ROOT.GetNameDef]..."
 bftb_greece.102.a: "เราไมอาจปลอยใหพวกอนาธิปไตยเหลานี้โจมตีเราไดโดยไมตองรับโทษ"
 bftb_greece.103.t: "นายพลฝายเวนิเซลอสถูกลักลอบพากลับเขากรีซ!"
 bftb_greece.103.desc: "ไลหลังผูนําอันนารังเกียจของพวกเขามาติดๆ เราไดรับขาววาอดีตนายพลฝายเวนิเซลอสหลายคนถูกลักลอบพากลับเขาประเทศ ขบวนการลักลอบของคอมมิวนิสตและฝายสาธารณรัฐรวมกันสมคบคิดพาผูนําทหารที่เสื่อมเสียเหลานี้กลับเขาประเทศโดยปลอมตัวมากับสินคาทางเรือ และพาไปซอนตัวกอนที่เราจะรูตัววาเกิดอะไรขึ้น \n\nการรบประจัญบานกับผูกอความไมสงบที่ไรการจัดระเบียบเปนเรื่องหนึ่ง แตสงครามกลางเมืองเต็มรูปแบบที่มีผูนําทางทหารที่มีความสามารถหนุนหลังเปนอีกเรื่องหนึ่งโดยสิ้นเชิง ที่ปรึกษาหลายคนตั้งคําถามวาการที่องคกษัตริยซึ่งไมเปนที่นิยมเลือกแนวทางที่เปดเผยและไมเปนที่นิยมดวยการประกาศตนเปนสมบูรณาญาสิทธิราชยนั้นเปนการตัดสินใจที่ฉลาดจริงหรือ แต[ROOT.GetLeader]ยังคงยืนกรานวาพวกกบฏจะถูกจัดการไดอยางรวดเร็ว"
 bftb_greece.103.a: "จําเปนตองระเบิดทาเรือดวยหรือ?"
 bftb_greece.104.t: "การตอตานอยางเปนระบบทวีความรุนแรงทั้งทางใตและทางเหนือ!"
 bftb_greece.104.desc: "เจาหนาที่แจงรัฐบาลวาเราแทบสูญเสียการควบคุมทางเหนือและทางใตของประเทศไปหมดแลว ผูเห็นใจคอมมิวนิสตและฝายเวนิเซลอสเหิมเกริมอยูบนทองถนน เผยแพรคําใสรายและโฆษณาชวนเชื่อ โดยไมมีเจาหนาที่ทองถิ่นขัดขวาง เพราะพวกเขาเองก็เห็นใจไมแพกันหรือไมก็ไรอํานาจที่จะหยุดยั้งโดยสิ้นเชิง \n\nกองทัพรูดีวามีกับดักรออยู จึงปฏิเสธที่จะเคลื่อนพลเขาไปรักษาความมั่นคงในภูมิภาคเหลานั้น อยางไรก็ตาม กองทัพยังคงเตรียมพรอมเต็มที่ และคณะรัฐมนตรีขององคกษัตริยไดรับคํายืนยันวาเมื่อฝายเวนิเซลอสและคอมมิวนิสตออกมาจากที่ซอนอยางเต็มตัว กองทัพจะไมลังเลที่จะดําเนินมาตรการที่จําเปนเพื่อยึดอํานาจควบคุมประเทศคืน แนนอนวาบุคคลสําคัญทางการเมืองหลายคนยังคงกังขาตอความจริงใจของคํายืนยันนี้ เพราะมีรายงานแพรหลายเรื่องการทุจริตและความภักดีที่ทรยศชาติทั่วกองทัพ"
 bftb_greece.104.a: "สถานการณกําลังเกินควบคุม!"
 bftb_greece.105.t: "สงครามกลางเมือง!"
 bftb_greece.105.desc: "วันแหงชะตากรรมมาถึงในที่สุด: ผูนําฝายเวนิเซลอสไดกาวออกจากเงามืดเพื่อประณามพระราชกฤษฎีกาขององคกษัตริยวาไมชอบธรรม และเปนภัยคุกคามอยางที่ไมเคยมีมากอนตอประชาธิปไตยของ[FROM.GetNameDef] ในสายตาของพวกเขา ไมมีทางเลือกอื่นนอกจากโคนลมสถาบันกษัตริยดวยกําลัง เพื่อฟนฟูสาธารณรัฐเฮลเลนิกที่ถูกลมลางไปแลวถึงสองครั้ง \n\n[ROOT.GetLeader]ประณามพวกกบฏทั้งหมดวาเปนคนทรยศ และสัญญาวาจะถอนรากถอนโคนพวกมารกซิสตและฝายสาธารณรัฐ เพื่อฟนฟูความสงบเรียบรอยใหกลับคืนสู[ROOT.GetNameDef]อีกครั้ง ดูเหมือนวาเวทีการเมืองของ[ROOT.GetNameDef]ไดกลายเปนสนามประลองกลาดิเอเตอรอีกครั้ง ที่ซึ่งมีเพียงผูที่แข็งแกรงที่สุดเทานั้นที่จะเดินออกไปในฐานะผูชนะ"
 bftb_greece.105.a: "จงรวมพลังเคียงขางองคกษัตริย!"

 bftb_greece.166.t: "นักการเมืองของเรากลับจากการเจรจาการลงทุนในเอเธนส"
 bftb_greece.166.desc: "เมื่อชาว[FROM.GetAdjective]เชิญเราไปหารือเพิ่มเติมเรื่องการกระชับความสัมพันธทางเศรษฐกิจ เราก็ไมอาจปฏิเสธได ไมตองบอกก็รูวาพวกเขาใหเหตุผลไดอยางนาเชื่อถือวาทําไมการเสริมความแข็งแกรงทางอุตสาหกรรมของ[FROM.GetAdjective]จึงอาจเปนเรื่องดี การจะลงทุนในประเทศของพวกเขาหรือปลอยศักยภาพทางอุตสาหกรรมของพวกเขาไวตามยถากรรมนั้น เปนเรื่องที่เราเปนผูตัดสิน"
 bftb_greece.166.a: "ใช (Ja) เราจะลงทุน!"
 bftb_greece.166.b: "ครั้งนี้จะไมมีการลงทุน..."
 bftb_greece.166.c: "ไม (Nein) เราจะไมมีวันลงทุนในประเทศอันนาสมเพชของพวกเขา!"
 bftb_greece.167.t: "นักธุรกิจของเรากลับจากงานแสดงสินคาแหงชาติของ[FROM.GetAdjective]"
 bftb_greece.167.desc: "ชาว[FROM.GetAdjective]จัดการแสดงใหเราชมอยางยิ่งใหญ! ความพยายามดึงดูดการลงทุนของเรานั้นนาสนใจไมนอย แตเราเองก็มีลําดับความสําคัญของตนที่ตองคํานึง การตัดสินใจวาจะลงทุนในชาติ[FROM.GetAdjective]หรือไมนั้นขึ้นอยูกับเรา"
 bftb_greece.167.a: "ใช (Ja) เราจะลงทุน!"
 bftb_greece.167.b: "ครั้งนี้จะไมมีการลงทุน..."
 bftb_greece.167.c: "ไม (Nein) เราจะไมมีวันลงทุนในประเทศอันนาสมเพชของพวกเขา!"
 bftb_greece.168.t: "ชาว[FROM.GetAdjective]ใชแผนชัคทรีดไถเรา!"
 bftb_greece.168.desc: "พวกตัวกาฝาก (Schädlinge) จอมเจาเลหใน[FROM.GetNameDef]คิดหาวิธีใชแชรลูกโซของเราเองยอนเลนงานเรา ชองโหวเล็กๆ ที่ปลอดภัยซึ่งออกแบบไวใหเราใชประโยชนจากขอบกพรองของแผนชัคท กลับถูกพลิกมาใชกับเรา ซึ่งไมควรจะเปนไปไดเลย เราจะรักษาหนาและยอมใหชาว[FROM.GetAdjective]ชนะเล็กๆ ครั้งนี้ก็ได หรือจะเลิกเสแสรงวาเลนตามกติกาแลวถอนตัวจากการเจรจากับชาว[FROM.GetAdjective]"
 bftb_greece.168.a: "เพื่อเลี่ยงผลที่ตามมา คราวนี้เราจะยอม..."
 bftb_greece.168.b: "พลิกสถานการณกลับไปเลนงานพวกเขาเถอะ ชัคท!"
 bftb_greece.168.c: "เราจะไมมีวันยอมจํานนตอการแบล็กเมลของ[FROM.GetAdjective]!"
 bftb_greece.168.d: "พวกเขาเลนเกินตัวแลว ตองรับผลที่ตามมา!"
 gott_bless_herr_schacht_tt: "ตัวเลือกนี้ใชไดเพราะปจจุบันคุณมี §Yยัลมาร ชัคท§! เปนรัฐมนตรี"
 bftb_greece.169.t: "ชาว[FROM.GetAdjective]ลงทุน!"
 bftb_greece.169.desc: "เราเพิ่งตอนรับนักลงทุน[FROM.GetAdjective]กลับสูประเทศของเราหลังการเยือนสั้นๆ ครั้งกอน และพวกเขานําขาวดีเรื่องการลงทุนและโอกาสมาดวย! ดวยความชวยเหลือของพวกเขา เราจะสรางเศรษฐกิจที่ทันสมัยอยางแทจริง"
 bftb_greece.169.a: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.169.b: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.169.c: "ทุกคนทําไดยอดเยี่ยมมาก!"
 bftb_greece.170.t: "ชาว[FROM.GetAdjective]ตัดสินใจไมลงทุน"
 bftb_greece.170.desc: "นาเสียดาย เราไดรับแจงวาชาว[FROM.GetAdjective]จะไมลงทุนในเศรษฐกิจของเราในครั้งนี้ เปนผลที่นาผิดหวัง แตผูแทน[FROM.GetAdjective]ก็ไมไดปดประตูการลงทุนในอนาคต ซึ่งเปนสัญญาณที่ดีสําหรับเรา"
 bftb_greece.170.a: "บางทีครั้งหนา"
 bftb_greece.171.t: "ชาว[FROM.GetAdjective]ถอนตัวจากการเจรจาการลงทุนอยางถาวร!"
 bftb_greece.171.desc: "เราอาจกดดันเรื่องการลงทุนหนักเกินไป: ชาว[FROM.GetAdjective]ตัดสินใจแลววาไมสนใจลงทุนในฐานอุตสาหกรรมที่กําลังเติบโตของชาติเรา หากพวกเขาไมตองการชวยเราปนอนาคต เราก็ตองทําโดยไมมีพวกเขา"
 bftb_greece.171.a: "บางที... ชาว[ITA.GetAdjective]อาจยินดีตกลงมากกวา?"
 bftb_greece.172.t: "ยัลมาร ชัคท หลอกเราจนหัวปน!"
 bftb_greece.172.desc: "เราชางโงเขลาที่คิดวาจะใชแผนชัคทรีดไถชาว[FROM.GetAdjective]ได ทั้งที่ชายผูรางขอตกลงนี้ขึ้นมาเองยังเปนรัฐมนตรีอยู! ตอนนี้กลายเปนเราที่ตองจายเงินใหพวกเขา! ชางเปนหายนะ!"
 bftb_greece.172.a: "พอมดแหงการเงินเลนงานอีกแลว!"
 bftb_greece.173.t: "ผูประกอบการของเรากลับจากการเจรจาในเอเธนส!"
 bftb_greece.173.desc: "เมื่อชาว[FROM.GetAdjective]เชิญเราไปหารือเพิ่มเติมเรื่องการกระชับความสัมพันธทางเศรษฐกิจ เราก็ไมอาจปฏิเสธได ไมตองบอกก็รูวาพวกเขาใหเหตุผลไดอยางนาเชื่อถือวาทําไมการเสริมความแข็งแกรงทางอุตสาหกรรมของ[FROM.GetAdjective]จึงอาจเปนเรื่องดี การจะลงทุนในประเทศของพวกเขาหรือปลอยศักยภาพทางอุตสาหกรรมของพวกเขาไวตามยถากรรมนั้น เปนเรื่องที่เราเปนผูตัดสิน"
 bftb_greece.173.a: "เราจะออกใบอนุญาตใหพวกเขาลงทุนได"
 bftb_greece.173.b: "ขณะนี้เรื่องนี้ไมไดอยูในผลประโยชนของบริเตน"
 bftb_greece.173.c: "ขอโทษดวยนะสหาย แตจอหน บูลมีธุระสําคัญกวาที่อื่น!"
 bftb_greece.174.t: "นักการเมืองของเราเขารวมงานแสดงสินคาแหงชาติของ[FROM.GetAdjective] "
 bftb_greece.174.desc: "ชาว[FROM.GetAdjective]จัดการแสดงใหเราชมอยางยิ่งใหญ! ความพยายามดึงดูดการลงทุนของเรานั้นนาสนใจไมนอย แตเราเองก็มีลําดับความสําคัญของตนที่ตองคํานึง การตัดสินใจวาจะลงทุนในชาติ[FROM.GetAdjective]หรือไมนั้นขึ้นอยูกับเรา"
 bftb_greece.174.a: "พวกเขาวางใจในการสนับสนุนของเราได!"
 bftb_greece.174.b: "ครั้งนี้เรื่องนี้ไมไดอยูในผลประโยชนของบริเตน"
 bftb_greece.174.c: "ขอโทษดวยนะสหาย แตจอหน บูลมีธุระสําคัญกวาที่อื่น!"
 bftb_greece.175.t: "ชาว[FROM.GetAdjective]เสนอชิ้นสวนเรือเพื่อแลกกับการลงทุน"
 bftb_greece.175.desc: "ขอเสนอที่นาสนใจจากชาว[FROM.GetAdjective]: พวกเขาตองการเสนอชิ้นสวนเพื่อชวยในการตอเรือของเรา แลกกับการลงทุนที่เพิ่มขึ้นในประเทศของพวกเขา การที่รัฐมาแลกเปลี่ยนสิ่งของกันในระดับพื้นฐานเชนนี้อาจผิดแบบแผน (unorthodox) ไปบาง แตก็นั่นแหละ สิ่งเดียวที่เคยเปนออรโธดอกซอยางแทจริงของชาว[FROM.GetAdjective]ก็คือศาสนาของพวกเขา"
 bftb_greece.175.a: "แลกเปลี่ยนที่ยุติธรรม! เกือบๆ"
 bftb_greece.175.b: "ขณะนี้เราไมตองการชิ้นสวนจาก[FROM.GetAdjective]"
 bftb_greece.175.c: "ขอโทษนะ [FROM.GetNameDef] แตธุระของเรากับพวกคุณจบแลว ตลอดไป!"
 bftb_greece.176.t: "ชาว[FROM.GetAdjective]ตัดสินใจลงทุน!"
 bftb_greece.176.desc: "เราเพิ่งตอนรับนักลงทุน[FROM.GetAdjective]กลับสูประเทศของเราหลังการเยือนสั้นๆ ครั้งกอน และพวกเขานําขาวดีเรื่องการลงทุนและโอกาสมาดวย! ดวยความชวยเหลือของพวกเขา เราจะสรางเศรษฐกิจที่ทันสมัยอยางแทจริง"
 bftb_greece.176.a: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.176.b: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.176.c: "เราพึ่งพาชาว[FROM.GetAdjective]ไดเสมอ!"
 bftb_greece.177.t: "ชาว[FROM.GetAdjective]ตัดสินใจไมลงทุนในครั้งนี้"
 bftb_greece.177.desc: "นาเสียดาย เราไดรับแจงวาชาว[FROM.GetAdjective]จะไมลงทุนในเศรษฐกิจของเราในครั้งนี้ เปนผลที่นาผิดหวัง แตผูแทน[FROM.GetAdjective]ก็ไมไดปดประตูการลงทุนในอนาคต ซึ่งเปนสัญญาณที่ดีสําหรับเรา"
 bftb_greece.177.a: "ชางเถอะ บางทีครั้งหนา"
 bftb_greece.178.t: "ชาว[FROM.GetAdjective]ออกกฎหมายหามเราขอการลงทุนเพิ่มเติม!"
 bftb_greece.178.desc: "เราอาจกดดันเรื่องการลงทุนหนักเกินไป: ชาว[FROM.GetAdjective]ตัดสินใจแลววาไมสนใจลงทุนในฐานอุตสาหกรรมที่กําลังเติบโตของชาติเรา หากพวกเขาไมตองการชวยเราปนอนาคต เราก็ตองทําโดยไมมีพวกเขา"
 bftb_greece.178.a: "เราจะกลาลองทําขอตกลงกับพวกรัสเซียไหม?"
 bftb_greece.179.t: "เจาหนาที่[FROM.GetAdjective]มาพบเราที่เมืองหลวงเพื่อขอการลงทุน"
 bftb_greece.179.desc: "เมื่อชาว[FROM.GetAdjective]เชิญเราไปหารือเพิ่มเติมเรื่องการกระชับความสัมพันธทางเศรษฐกิจ เราก็ไมอาจปฏิเสธได ไมตองบอกก็รูวาพวกเขาใหเหตุผลไดอยางนาเชื่อถือวาทําไมการเสริมความแข็งแกรงทางอุตสาหกรรมของ[FROM.GetAdjective]จึงอาจเปนเรื่องดี การจะลงทุนในประเทศของพวกเขาหรือปลอยศักยภาพทางอุตสาหกรรมของพวกเขาไวตามยถากรรมนั้น เปนเรื่องที่เราเปนผูตัดสิน"
 bftb_greece.179.a: "ได (Oui) เราลงทุนไดเล็กนอย"
 bftb_greece.179.b: "ไมใชครั้งนี้"
 bftb_greece.179.c: "เราไมสนใจกิจการของ[FROM.GetAdjective]เลยแมแตนอย!"
 bftb_greece.180.t: "เจาหนาที่ของเราเขารวมงานแสดงสินคาแหงชาติที่จัดขึ้นใน[FROM.GetNameDef]"
 bftb_greece.180.desc: "ชาว[FROM.GetAdjective]จัดการแสดงใหเราชมอยางยิ่งใหญ! ความพยายามดึงดูดการลงทุนของเรานั้นนาสนใจไมนอย แตเราเองก็มีลําดับความสําคัญของตนที่ตองคํานึง การตัดสินใจวาจะลงทุนในชาติ[FROM.GetAdjective]หรือไมนั้นขึ้นอยูกับเรา"
 bftb_greece.180.a: "ได (Oui) เราจะลงทุนใน[FROM.GetNameDef]"
 bftb_greece.180.b: "ไมใชครั้งนี้"
 bftb_greece.180.c: "เราไมสนใจกิจการของ[FROM.GetNameDef]เลยแมแตนอย!"
 bftb_greece.181.t: "รัฐบาล[FROM.GetAdjective]ติดสินบนสหภาพแรงงานของเรา!"
 bftb_greece.181.desc: "พวกเจาเลหใตดินใน[FROM.GetNameDef]วางแผนบิดแขนบังคับใหเราลงทุนในกองหินที่พวกเขาเรียกวาบาน! สหภาพแรงงานของเราประทวงตอตานเรา กลาวหาวาเราจงใจทําใหปญหาการจางงานเลวรายลงดวยการเมินไมตรีของชาว[FROM.GetAdjective]ผูแสนใจกวาง ไรสาระทั้งเพ การทุจริตของพวกเขาเห็นไดชัดแจง แตพวกเขาก็ถือไพทุกใบไวในมือ เราจะเลือกทางที่งายที่สุดแลวใหสหภาพ และ[FROM.GetNameDef]โดยปริยาย ไดสิ่งที่ตองการ? หรือจะยืนหยัดในหลักการ ในยามที่หลักการอาจนําพาเราทุกคนสูหายนะ?"
 bftb_greece.181.a: "ตอนนี้เราไมอาจรับมือกับการนัดหยุดงานได..."
 bftb_greece.181.b: "คําขูของพวกแกไมทําใหเรากลัวหรอก ไอพวกไมมีไข (Sans-couilles)!"
 bftb_greece.181.c: "อา กรีซ - ราชาแหงคนโง (le roi des cons)! อยูหางๆ เราไว!"
 bftb_greece.182.t: "ชาว[FROM.GetAdjective]ลงทุน!"
 bftb_greece.182.desc: "เราเพิ่งตอนรับนักลงทุน[FROM.GetAdjective]กลับสูประเทศของเราหลังการเยือนสั้นๆ ครั้งกอน และพวกเขานําขาวดีเรื่องการลงทุนและโอกาสมาดวย! ดวยความชวยเหลือของพวกเขา เราจะสรางเศรษฐกิจที่ทันสมัยอยางแทจริง"
 bftb_greece.182.a: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.182.b: "ประสบความสําเร็จอยางงดงาม!"
 bftb_greece.182.c: "มิตรภาพของเรายิ่งใหญจริงๆ!"
 bftb_greece.183.t: "ชาว[FROM.GetAdjective]ตัดสินใจไมลงทุนในครั้งนี้"
 bftb_greece.183.desc: "นาเสียดาย เราไดรับแจงวาชาว[FROM.GetAdjective]จะไมลงทุนในเศรษฐกิจของเราในครั้งนี้ เปนผลที่นาผิดหวัง แตผูแทน[FROM.GetAdjective]ก็ไมไดปดประตูการลงทุนในอนาคต ซึ่งเปนสัญญาณที่ดีสําหรับเรา"
 bftb_greece.183.a: "ชางเถอะ บางทีครั้งหนา"
 bftb_greece.184.t: "ชาว[FROM.GetAdjective]ขับไลผูแทนของเราและปดโอกาสการลงทุน"
 bftb_greece.184.desc: "เราอาจกดดันเรื่องการลงทุนหนักเกินไป: ชาว[FROM.GetAdjective]ตัดสินใจแลววาไมสนใจลงทุนในฐานอุตสาหกรรมที่กําลังเติบโตของชาติเรา หากพวกเขาไมตองการชวยเราปนอนาคต เราก็ตองทําโดยไมมีพวกเขา"
 bftb_greece.184.a: "เราจะกลาลองทําขอตกลงกับพวกรัสเซียไหม?"
 bftb_greece.185.t: "ชาว[FROM.GetAdjective]ขอความชวยเหลือจากเราในการพัฒนาอุตสาหกรรมของประเทศ"
 bftb_greece.185.desc: "เมื่อชาว[FROM.GetAdjective]เชิญเราไปหารือเรื่องการกระชับความสัมพันธทางเศรษฐกิจ เราก็ปฏิเสธไมได อะไรกันที่ผลักใหชาว[FROM.GetAdjective]สิ้นหวังจนตองมาขอความชวยเหลือทางการเงินจากเรา? ไมตองบอกก็รูวาพวกเขาใหเหตุผลไดอยางนาเชื่อถือวาทําไมการเสริมความแข็งแกรงทางอุตสาหกรรมของ[FROM.GetAdjective]จึงอาจเปนเรื่องดี... โดยเฉพาะเมื่อมันอาจชวยยกระดับอุตสาหกรรมของเราเองดวย การจะลงทุนในประเทศของพวกเขาหรือปลอยศักยภาพทางอุตสาหกรรมของพวกเขาไวตามยถากรรมนั้น เปนเรื่องที่เราเปนผูตัดสิน"
 bftb_greece.185.a: "ยังมีทางเลือกอื่นนอกจากการสูรบ!"
 bftb_greece.185.b: "บางทีในภายหลัง"
 bftb_greece.185.c: "จะมีโอกาสพัฒนาอุตสาหกรรมหลังจากพิชิตพวกเขาไดแลว!"
 bftb_greece.186.t: "นักการทูต[FROM.GetAdjective]หวังจะลดทอนความทะเยอทะยานของ[ROOT.GetAdjective]ในเมดิเตอรเรเนียน"
 bftb_greece.186.desc: "เราไดตอนรับผูแทนจาก[FROM.GetNameDef]ซึ่งแจงความกังวลของรัฐบาลของเขาตอการแทรกแซงทางการเมืองของ[ROOT.GetAdjective]ในประเทศของพวกเขาที่เพิ่มขึ้น พวกเขาไดรับอํานาจใหตอรอง: พวกเขาจะมอบสินคาวัตถุใหเรา และเราจะผอนปรนการยึดกลไกรัฐทุกสวนของพวกเขา \n\nแนนอนวาเราปฏิเสธวาไมมีการแทรกแซงใดๆ เกิดขึ้น แมเราทุกคนจะรูวาเปนเรื่องจริง ขอเสนอนี้ใจกวาง ไมตองสงสัยวาความปรารถนาของชาว[FROM.GetAdjective]ที่จะรักษาอธิปไตยของตนนั้นจริงใจ เราอาจใชประโยชนจากวัตถุที่หลั่งไหลเขามาได แตในอีกทางหนึ่ง เราก็อาจใชประโยชนจาก[FROM.GetNameDef]ที่ตกอยูใตอุงมือของเราโดยสมบูรณไดเชนกัน..."
 bftb_greece.186.a: "ความชวยเหลือนี้เปนที่ยินดี"
 bftb_greece.186.b: "บางทีเราอาจตกลงในอนาคต แตไมใชตอนนี้"
 bftb_greece.186.c: "อา การเปนเมืองขึ้นหนีไมพนงายๆ หรอก!"
 bftb_greece.187.t: "ชาว[FROM.GetAdjective]ลงทุน!"
 bftb_greece.187.desc: "เราเพิ่งตอนรับนักลงทุน[FROM.GetAdjective]กลับสูประเทศของเราหลังการเยือนสั้นๆ ครั้งกอน และพวกเขานําขาวดีเรื่องการลงทุนและโอกาสมาดวย! พวกเขายังพาผูสังเกตการณที่ไมไดรับเชิญมาดวย ซึ่งเราคลาดสายตาไปอยางรวดเร็วขณะที่พวกนั้นไปทําอะไรก็ตามที่ถูกสงมาทํา อยางไรก็ตาม ดวยความชวยเหลือของ[FROM.GetAdjective] เราจะสรางเศรษฐกิจที่ทันสมัยอยางแทจริง"
 bftb_greece.187.a: "ทําขอตกลงกับปศาจยังดีกวาความตาย"
 bftb_greece.187.b: "เราตองจายแพงเพื่อรักษาเอกราชของเราไว"
 bftb_greece.188.t: "ชาว[FROM.GetAdjective]ไมลงทุนในครั้งนี้"
 bftb_greece.188.desc: "นาเสียดาย เราไดรับแจงวาชาว[FROM.GetAdjective]จะไมลงทุนในเศรษฐกิจของเราในครั้งนี้ เปนผลที่นาผิดหวัง แตผูแทน[FROM.GetAdjective]ก็ไมไดปดประตูการลงทุนในอนาคต ซึ่งเปนสัญญาณที่ดีสําหรับเรา"
 bftb_greece.188.a: "บางทีนี่อาจเปนโชคดีที่แฝงมา..."
 bftb_greece.189.t: "ชาว[FROM.GetAdjective]เมินผูแทนของเราและขับไลนักการทูตของเรา!"
 bftb_greece.189.desc: "เราอาจกดดันเรื่องการลงทุนหนักเกินไป: ชาว[FROM.GetAdjective]ตัดสินใจแลววาไมสนใจลงทุนในฐานอุตสาหกรรมที่กําลังเติบโตของชาติเรา หากพวกเขาไมตองการชวยเราปนอนาคต เราก็ตองทําโดยไมมีพวกเขา"
 bftb_greece.189.a: "นี่คงเปนลางบอกเหตุของสิ่งเลวรายที่กําลังจะมาถึง"
 bftb_greece.190.t: "เจาหนาที่[FROM.GetAdjective]เสร็จสิ้นการเยือนคณะผูบริหารสูงสุด (เปรซิเดียม)"
 bftb_greece.190.desc: "เราเพิ่งมีเกียรติไดตอนรับเจาหนาที่จาก[FROM.GetNameDef] หนึ่งในนั้นไดกลาวสุนทรพจนตอหนาคณะผูบริหารสูงสุดในฐานะแขกรับเชิญ โดยเนนยํ้าความสัมพันธอันแนนแฟนระหวางสองชาติ เปนชวงเวลาที่นารื่นรมย แตจุดประสงคที่แทจริงของการเยือนของ[FROM.GetAdjective]คือการหารือเรื่องการลงทุนในประเทศที่กําลังประสบปญหาของพวกเขา ทฤษฎีมารกซิสตระบุวาการปฏิวัติจะเกิดขึ้นไดเฉพาะในสังคมอุตสาหกรรมเทานั้น แตประวัติศาสตรของเราเองและประสบการณของชาว[FROM.GetAdjective]บอกเราเปนอยางอื่น \n\nเจาหนาที่หลายคนรูสึกอยางแรงกลาวาเราควรชวยเหลือชาว[FROM.GetAdjective] เพราะเรามีทรัพยากรที่จะทําได อยางไรก็ตาม เราเองก็ตองการทรัพยากรของเราเชนกัน ซึ่งไมมีเจาหนาที่คนใดโตแยง เราจะทําอยางไรดี?"
 bftb_greece.190.a: "[ROOT.GetNameDefCap]จะจัดสรรทรัพยากรบางสวนเพื่อการพัฒนา[FROM.GetNameDef]"
 bftb_greece.190.b: "ไม (Nyet) ขณะนี้จะไมมีการลงทุน"
 bftb_greece.190.c: "ประชาชน[ROOT.GetAdjective]จะไมตองทนทุกขเพียงเพื่อใหชาวนา[FROM.GetAdjective]ไมกี่คนไดทํางานในโรงงาน"
 bftb_greece.191.t: "ขาราชการ[ROOT.GetAdjective]กลับจากการสํารวจ[FROM.GetNameDef]"
 bftb_greece.191.desc: "เมื่อชาว[FROM.GetAdjective]เชิญเราไปหารือเรื่องการกระชับความสัมพันธทางเศรษฐกิจ เราก็ปฏิเสธไมได อะไรกันที่ผลักใหชาว[FROM.GetAdjective]สิ้นหวังจนตองมาขอความชวยเหลือทางการเงินจากเรา? ไมตองบอกก็รูวาพวกเขาใหเหตุผลไดอยางนาเชื่อถือวาทําไมการเสริมความแข็งแกรงทางอุตสาหกรรมของ[FROM.GetAdjective]จึงอาจเปนเรื่องดี... โดยเฉพาะเมื่อมันอาจชวยยกระดับอุตสาหกรรมของเราเองดวย การจะลงทุนในประเทศของพวกเขาหรือปลอยศักยภาพทางอุตสาหกรรมของพวกเขาไวตามยถากรรมนั้น เปนเรื่องที่เราเปนผูตัดสิน"
 bftb_greece.191.a: "การขยายกําลังอาวุธของพวกเขาในนามของการตอสูกับพวกปฏิกิริยาเปนสิ่งที่อนุญาตได"
 bftb_greece.191.b: "ไม (Nyet) ขณะนี้จะไมมีการลงทุน"
 bftb_greece.191.c: "ประชาชน[ROOT.GetAdjective]จะไมตองทนทุกขเพียงเพื่อใหชาวนา[FROM.GetAdjective]ไมกี่คนไดทํางานในโรงงาน"
 bftb_greece.192.t: "เจาหนาที่[FROM.GetAdjective]เสนอแผนแลกเปลี่ยนโดยพวกเขาจะลงทุนในภูมิภาคไซบีเรียที่ถูกละเลยของเรา"
 bftb_greece.192.desc: "เราไดตอนรับผูแทนจาก[FROM.GetNameDef]ซึ่งแจงความกังวลของรัฐบาลของเธอตอการแทรกแซงทางการเมืองของ[ROOT.GetAdjective]ในประเทศของพวกเขาที่เพิ่มขึ้น พวกเขาไดรับอํานาจใหตอรอง: พวกเขาจะลงทุนในภูมิภาคที่ยากจนของเรา และเราจะผอนปรนการยึดกลไกรัฐทุกสวนของพวกเขา \n\nแนนอนวาเราปฏิเสธวาไมมีการแทรกแซงใดๆ เกิดขึ้น แมเราทุกคนจะรูวาเปนเรื่องจริง ขอเสนอนี้ใจกวาง ไมตองสงสัยวาความปรารถนาของชาว[FROM.GetAdjective]ที่จะรักษาอธิปไตยของตนนั้นจริงใจ เราอาจใชประโยชนจากวัตถุที่หลั่งไหลเขามาได แตในอีกทางหนึ่ง เราก็อาจใชประโยชนจาก[FROM.GetNameDef]ที่ตกอยูใตอุงมือของเราโดยสมบูรณไดเชนกัน..."
 bftb_greece.192.a: "แผนของ[FROM.GetAdjective]ไดรับความเห็นชอบจากโปลิตบูโรแลว จะดําเนินการตอไป"
 bftb_greece.192.b: "สตาฟกาเสนอวาอํานาจละมุนที่เราใชกับ[FROM.GetNameDef]ไดนั้นมีประโยชนมากกวา"
 bftb_greece.192.c: "[ROOT.GetNameDefCap]ไดทําธุรกิจกับ[FROM.GetNameDef]เสร็จสิ้นแลว"
 bftb_greece.193.t: "การลงทุนใน[FROM.GetNameDef]!"
 bftb_greece.193.desc: "ผูมีความสามารถที่สุดของเรากลับบานแลวหลังการเดินทางอันนารื่นรมยไปพบมิตรชาว[FROM.GetAdjective]ครั้งลาสุด และพวกเขานําขาวดีเรื่องการลงทุนและโอกาสที่เปนประโยชนรวมกันมาดวย! ความพยายามรวมกันของเราจะยกระดับทั้งประชาชน[ROOT.GetAdjective]และ[FROM.GetAdjective] สรางความเปนหุนสวนที่ไมมีใครมองขามได"
 bftb_greece.193.a: "นํ้าใจครั้งหนึ่งอาจนํามาซึ่งนํ้าใจอีกครั้ง"
 bftb_greece.194.t: "ชาว[FROM.GetAdjective]ไมลงทุนในครั้งนี้"
 bftb_greece.194.desc: "นาเสียดาย เราไดรับแจงวาชาว[FROM.GetAdjective]จะไมลงทุนในเศรษฐกิจของเราในครั้งนี้ เปนผลที่นาผิดหวัง แตผูแทน[FROM.GetAdjective]ก็ไมไดปดประตูการลงทุนในอนาคต ซึ่งเปนสัญญาณที่ดีสําหรับเรา"
 bftb_greece.194.a: "บางทีนี่อาจเปนโชคดีที่แฝงมา..."
 bftb_greece.195.t: "ชาว[FROM.GetAdjective]เมินผูแทนของเราและขับไลนักการทูตของเรา!"
 bftb_greece.195.desc: "เราอาจกดดันเรื่องการลงทุนหนักเกินไป: ชาว[FROM.GetAdjective]ตัดสินใจแลววาไมสนใจลงทุนในฐานอุตสาหกรรมที่กําลังเติบโตของชาติเรา หากพวกเขาไมตองการชวยเราปนอนาคต เราก็ตองทําโดยไมมีพวกเขา"
 bftb_greece.195.a: "ตอนนี้เราตองแกปญหาเศรษฐกิจตามลําพังอยางแทจริงแลว"
 bftb_greece.200.t: "การประชุมเฮราคลีออนเสร็จสิ้น - ประสบความสําเร็จอยางยิ่งใหญ!"
 bftb_greece.200.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางสมบูรณ! ผูเขารวมทุกคนกลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง รวมกัน เราจะลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.200.a: "เราทุกคนตบไหลชื่นชมตัวเองไดเลยสําหรับเรื่องนี้"
 bftb_greece.201.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.201.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางยิ่ง! ผูเขารวมทุกคน ยกเวน[ENG.GetNameDef] กลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง ผูลงนามทั้งหลายจะรวมกันลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.201.a: "ไชโย!"
 bftb_greece.201.b: "ไรสาระสิ้นดี!"
 bftb_greece.202.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.202.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางยิ่ง! ผูเขารวมทุกคน ยกเวน[FRA.GetNameDef] กลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง ผูลงนามทั้งหลายจะรวมกันลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.202.a: "ความริเริ่มที่ยอดเยี่ยม!"
 bftb_greece.202.b: "ชางโงเงา (Quels imbéciles)..."
 bftb_greece.203.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.203.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางลนหลาม! ผูเขารวมทุกคน ยกเวน[ITA.GetNameDef] กลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง ผูลงนามทั้งหลายจะรวมกันลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.203.a: "ผลลัพธที่โดดเดน!"
 bftb_greece.203.b: "จงจดจําชัยชนะที่ถูกตัดทอน (Ricordiamo la Vittoria Mutilata)..."
 bftb_greece.204.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.204.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จ... ในระดับที่ยอมรับได ทั้ง[ENG.GetNameDef]และ[FRA.GetNameDef]จะไมเขารวมสงครามที่กําลังจะมาถึง เพราะไมมีชาติใดไดรับสัญญาวาจะไดดินแดนจาก[TUR.GetNameDef]ที่แตกพาย ดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง หากมีกําลังพอจะโคน[TUR.GetNameDef]ไดเพียงลําพัง..."
 bftb_greece.204.a: "ถึงอยางไรก็เปนชัยชนะ"
 bftb_greece.204.b: "เสียเวลาเปลาแทๆ..."
 bftb_greece.205.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.205.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางพอเหมาะพอดี! ผูเขารวมทุกคน ยกเวน[ENG.GetNameDef]และ[ITA.GetNameDef] กลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง ผูลงนามทั้งหลายจะรวมกันลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.205.a: "มีไดก็มีเสีย!"
 bftb_greece.205.b: "เสียเวลาเปลาแทๆ..."
 bftb_greece.205.c: "เราจะไมทนตอการทรยศครั้งที่สองนี้!"
 bftb_greece.206.t: "การประชุมเฮราคลีออนเสร็จสิ้น"
 bftb_greece.206.desc: "การประชุมเฮราคลีออนสิ้นสุดลงอยางเปนทางการแลว และประสบความสําเร็จอยางพอเหมาะพอดี! ผูเขารวมทุกคน ยกเวน[FRA.GetNameDef]และ[ITA.GetNameDef] กลับไปพรอมการรับประกันวาจะไดดินแดน และดูเหมือน[GRE.GetNameDef]กําลังจะไดขยายพรมแดนอยางกวางขวาง ผูลงนามทั้งหลายจะรวมกันลางแคนใหสนธิสัญญาแซฟรกับ[TUR.GetName]ที่สมควรไดรับยิ่งกวา"
 bftb_greece.206.a: "ถึงอยางไรก็เปนชัยชนะ"
 bftb_greece.206.b: "เสียเวลาเปลาแทๆ..."
 bftb_greece.206.c: "เราจะไมทนตอการทรยศครั้งที่สองนี้!"
 bftb_greece.207.t: "EEE กอรัฐประหาร!"
 bftb_greece.207.desc: "เรานาจะรูวามันจะจบแบบนี้: แกนนํา EEE ประณามวาเราออนแอและไรประสิทธิภาพ และประกาศวาเราคืออุปสรรคเรงดวนที่สุดตอความยิ่งใหญของ[ROOT.GetAdjective] พวกอันธพาลกอความวุนวายครั้งใหญในรัฐสภากรีก ดาทอพวกเราทุกคนวาเปนคนทรยศ และประกาศวาจะทําทุกวิถีทางเพื่อโคนเรา แลวก็เปนไปตามคาด หลังจากเดินออกจากหองประชุมพรอมกันอยางเอิกเกริก พวกเขาก็กลับมาในอีกไมกี่ชั่วโมงพรอมฝูงชนที่ตามหลังมา เรียกรองใหเราลาออกทั้งคณะทันที \n\nมติมหาชนไมไดอยูขางเราอีกตอไป และพูดกันตรงๆ รัฐมนตรีหลายคนหมดศรัทธาวารัฐบาลนี้จะมีสิ่งที่จําเปนเพื่อทําตามที่สัญญาไวกับชาติจนถึงที่สุด มีความรูสึกโดยทั่วไปวาการเดินทัพไปคอนสแตนติโนเปลโดยไมมีการสนับสนุนจากตางชาติหรือประชาชน คือการสงทั้งประเทศไปสูการเดินทัพแหงความตายที่เราจะไมมีวันฟนตัว"
 bftb_greece.207.a: "เราตองรับผิดชอบตอความลมเหลวของเรา"
 bftb_greece.207.b: "เอเธนสจะไมมีวันถูกปกครองโดยหมาฟาสซิสต!"
 byzantinist_coup_tt: "§Yฟาสซิสตฝายไบแซนไทนนิยม§!จะจัดตั้งรัฐบาล!\n"
 byzantinist_civil_war_inevitable_tt: "§Yฝายไบแซนไทนนิยม§!จะพยายามขับเราออกจากรัฐบาลดวยกําลังอีกครั้งในไมชา...\n"
 bftb_greece.209.t: "เราไดทําตามคํามั่นที่ใหไวในการประชุมเฮราคลีออนแลว!"
 bftb_greece.209.desc: "เราไดแบงแยกอดีตรัฐตุรกีและแบงปนผลประโยชนในหมูผูชนะแลว พันธะของเราตอพันธมิตรและตอประชาชนไดรับการปฏิบัติครบถวน และ[ROOT.GetNameDef]ใกลจะบรรลุความยิ่งใหญที่แทจริงมากกวาครั้งใดในรอบหลายศตวรรษ"
 bftb_greece.209.a: "นี่คือชวงเวลาที่รุงโรจนที่สุดของเราอยางแทจริง"
 megali_idea_honoured_greece_tt: "ดินแดนที่สัญญาไวกับพันธมิตรของเราระหวาง§Yการประชุมเฮราคลีออน§!ไดถูกโอนไปแลว\n"
 bftb_greece.210.t: "ชาวกรีกทําตามคํารับประกันจากการประชุมเฮราคลีออน!"
 bftb_greece.210.desc: "ตามที่สัญญาไว จังหวัดที่เราไดรับการรับประกันไดถูกแบงออกจากซากของชาติตุรกีที่พายแพและโอนมาอยูในการควบคุมของเราแลว ลัทธิจักรวรรดินิยมเปนธุรกิจที่สกปรก แตไมมีใครทําไดดีกวาเรา"
 bftb_greece.210.a: "ดําเนินการแมนยําราวกับเครื่องจักร"
 megali_idea_honoured_tt: "ดินแดนที่ §Y[GRE.GetNameDef]§! สัญญาไวกับเราระหวาง§Yการประชุมเฮราคลีออน§!ไดถูกโอนไปแลว"
 bftb_greece.213.t: "ชาว[FROM.GetAdjective]ปฏิเสธที่จะชําระหนี้คืนใหเรา!"
 bftb_greece.213.desc: "พวกโจร[FROM.GetAdjective]จอมตะกละพวกนั้นตัดสินใจเชิดเงินที่ติดคางเราหนีไป! เราเพาะบมและทําใหหนี้นั้นงอกเงยอยางระมัดระวังมาหลายทศวรรษ แลวพวกเขายังกลาเรียกมันวาไมชอบธรรมอีกหรือ? หากพวกเขาคิดวาจะโกงเราไดโดยไมตองรับโทษก็คิดผิดถนัด ตองมีผลที่ตามมา! แตก็ปฏิเสธไมไดวาเราคอนขางกระตือรือรนเกินไปในการปลอยให[FROM.GetNameDef]กอหนี้พอกพูน แลวคอยลงโทษทีหลัง"
 bftb_greece.213.a: "ปรสิตยักยอกเงิน!"
 bftb_greece.213.b: "พวกเขาถูกบีบหนักเกินไป และนี่คือผลที่ตามมา"
 bftb_greece.217.t: "สภาฟาสซิสตใหญแหงฮาลิคารแนสซัส (บูเล)"
 bftb_greece.217.desc: "ลัทธิฟาสซิสตเปนปรากฏการณที่คอนขางเบาบางใน[ROOT.GetNameDef]มาโดยตลอด แตภายใตการนําของ[ROOT.GetLeader] ลัทธินี้เบงบานจนถึงขั้นที่นักคิดฟาสซิสตผูยิ่งใหญทั้งหมดของประเทศสามารถมาประชุมรวมกันเพื่อหารือถึงอนาคตของชาติ [ROOT.GetLeader]เสนอใหนํารูปแบบการปกครองแบบอํานาจนิยมอยางชัดเจนของตนกรองเขาสูแมพิมพฟาสซิสตโดยตรง เพื่อลดความไรเสถียรภาพใหนอยที่สุด จอรจ เมรคูริส นักชาติสังคมนิยมตัวยงของประเทศ เชื่อวาหนทางที่ดีที่สุดสําหรับ[ROOT.GetNameDef]คือการกําจัดองคกษัตริยที่ไมเปนที่นิยม เพื่อนําชาติเขาสูวงการเมืองที่สุดโตงอยางแทจริง \n\n[ROOT.GetLeader]พูดอยางยืดยาวถึงวิสัยทัศนของมหากรีซที่ทอดยาวจากแอลเบเนียถึงไซปรัส แตเมรคูริสก็ไมยอมนอยหนา เขาเชื่อวาประชาชน[ROOT.GetAdjective]จําเปนตองมองยอนไปไกลกวานั้นเพื่อคนหากุญแจสูความยิ่งใหญ เมทาซัสเชื่อวาอารยธรรมเฮลเลนิกที่สามรออยูเบื้องหนาในฐานะชาติเฮลเลนิกใหมที่ยิ่งใหญกวาในอนาคตอันใกล แตเมรคูริสเชื่อวาแรงบันดาลใจของอารยธรรมเฮลเลนิกที่สามจะมาจากอารยธรรมเฮลเลนิกที่หนึ่ง บุคคลทรงอิทธิพลสองคนแสดงความเห็นที่แตกตางกันอยางสิ้นเชิง: อนาคตแบบฟาสซิสตของ[ROOT.GetNameDef] ณ ที่นี่ในซามอส"
 bftb_greece.217.a: "เมทาซัสตองนําราชอาณาจักรฟาสซิสตของเรา!"
 GRE_metaxist_monarchist_fascism_tt: "§Yพระเจาจอรจที่ 2§! จะยังคงเปนกษัตริย และ§Yมหากรีซ§!จะกลายเปนชาติที่สามารถกอตั้งได \n£faction_gre_monarchist §Yฝายนิยมกษัตริย§! จะกลายเปนผูภักดี"
 bftb_greece.217.b: "เมรคูริสจะมอบจักรวรรดิใหแกเรา!"
 GRE_republican_national_socialism_tt: "§Yพระเจาจอรจที่ 2§! จะถูกปลดจากราชบัลลังก และเราจะสามารถสานตอ§Yมรดกแหงราชวงศอารเกียด§!ได \n£faction_gre_monarchist §Yฝายนิยมกษัตริย§! จะหมดความสําคัญ"
 bftb_greece.218.t: "ฟาสซิสตอนาโตเลียกอกบฏ!"
 bftb_greece.218.desc: "ถึงเวลาแลว ในชั่วโมงที่มืดมนที่สุดของเรา เกออรกิโอส คอสมิดิส ผูนารังเกียจไดประกาศเรียกระดมอาวุธ และเรียกรองใหผูภักดีตอ EEE และตอ[ROOT.GetNameDef]ทําลายเราและผูยึดครองขามทะเลอีเจียน สิ่งเดียวที่แนนอนคืออนาคตของ[ROOT.GetNameDef]ไมแนนอนอยางยิ่ง"
 bftb_greece.218.a: "ฟาสซิสตตองไมใชผูกําหนดชะตากรรมของ[ROOT.GetNameDef]!"
 bftb_greece.218.b: "บางทีเราอาจคิดผิด บางที EEE อาจกอบกู[ROOT.GetNameDef]ไดจริงๆ"
 bftb_greece.220.t: "[FROM.GetNameDefCap]ตกลงใหเอโนซิสเกิดขึ้น!"
 bftb_greece.220.desc: "บรรยากาศในเมืองหลวงคงอธิบายไดดีที่สุดวา 'ปลาบปลื้มยินดี' หลังจาก[ROOT.GetLeader]ประกาศตอประชาชนวาหลังจากผานมาหลายป ความฝนของ[ROOT.GetAdjective]เรื่องเอโนซิสกับไซปรัสจะเปนจริงในที่สุด ทั้งหมดนี้ตองขอบคุณมิตรชาว[FROM.GetAdjective]ของเรา เจาหนาที่บริหารของเรารีบเดินทางไปไซปรัสทันทีเพื่อใหการถายโอนอํานาจเปนไปอยางราบรื่นที่สุด \n\nนี่เปนวันอันยิ่งใหญและเปนประวัติศาสตรอยางแทจริงของ[ROOT.GetNameDef] ไซปรัสเปนสวนหนึ่งของจิตสํานึกรวมของ[ROOT.GetAdjective]มาชานาน และบัดนี้พวกเขาไดกลับบานสูออมอกของอารยธรรมที่ตนถือกําเนิดมาในที่สุด"
 bftb_greece.220.a: "ไดอยูดวยกันเสียที!"
 bftb_greece.221.t: "การประชุมเฮราคลีออน - ชาว[FRA.GetAdjective]ไดรับดินแดนในอาณัติ!"
 bftb_greece.221.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติให[FRA.GetNameDef]ไดรับดินแดนในอาณัติที่เคอรดิสถานเมื่อโคนลมรัฐ[TUR.GetAdjective]ไดสําเร็จ เจาหนาที่[FRA.GetAdjective]กลาวชื่นชมผูแทนที่เขารวมประชุมวามีวิสัยทัศนทางการเมืองอันเฉียบแหลม และไดสงคําสั่งไปยังรัฐบาลกลาง[FRA.GetAdjective]ใหเริ่มวางแผนจัดตั้งการปกครองในภูมิภาคนี้แลว"
 bftb_greece.221.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.222.t: "การประชุมเฮราคลีออน - ชาว[FRA.GetAdjective]ถูกปฏิเสธดินแดนในอาณัติ!"
 bftb_greece.222.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติวา[FRA.GetNameDef]ไมควรไดรับดินแดนใด ๆ ในเคอรดิสถานเมื่อปราบรัฐ[TUR.GetAdjective]ลงไดสําเร็จ เจาหนาที่[FRA.GetAdjective]เกือบตัดสินใจถอนตัวออกจากการประชุมไปเลย โดยกลาววาการประชุมครั้งนี้เปนเรื่องตลก กอนจะเห็นพองกันวายังอยากมีอิทธิพลตอการพิจารณาวาระตอ ๆ ไป แมจะไมไดรับคําสัญญาใด ๆ เลยก็ตาม"
 bftb_greece.222.a: "ฝายคัดคานชนะ!"
 bftb_greece.223.t: "การประชุมเฮราคลีออน - ชาว[ENG.GetAdjective]ไดรับรัฐในอารักขา!"
 bftb_greece.223.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติให[ENG.GetNameDef]ไดรับรัฐในอารักขาอารเมเนียที่แบงออกมาจากซากของ[TUR.GetName]ผูพายแพ เจาหนาที่[ENG.GetAdjective]กลาวชื่นชมผูแทนที่เขารวมประชุมวามีวิสัยทัศนทางการเมืองอันเฉียบแหลม และไดสงคําสั่งไปยังรัฐบาลกลาง[ENG.GetAdjective]ใหเริ่มวางแผนจัดตั้งการปกครองในภูมิภาคนี้แลว"
 bftb_greece.223.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.224.t: "การประชุมเฮราคลีออน - ชาว[ENG.GetAdjective]ถูกปฏิเสธรัฐหุนเชิด!"
 bftb_greece.224.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติวา[ENG.GetNameDef]ไมมีสิทธิ์จัดตั้งรัฐหุนเชิดอารเมเนียใด ๆ ทางตอนเหนือของ[TUR.GetNameDef] เจาหนาที่[ENG.GetAdjective]ประณามการตัดสินใจนี้และกลาววาการประชุมทั้งหมดไรระเบียบสิ้นดี แตก็ตัดสินใจวายังอยากมีอิทธิพลตอการพิจารณาวาระตอ ๆ ไป แมจะไมไดรับการรับประกันใด ๆ เลยก็ตาม"
 bftb_greece.224.a: "ฝายคัดคานชนะ!"
 bftb_greece.225.t: "การประชุมเฮราคลีออน - ชาว[ITA.GetAdjective]ไดรับดินแดน!"
 bftb_greece.225.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติให[ITA.GetNameDef]ไดรับอาณานิคมที่แบงออกมาจากซากของ[TUR.GetName]ผูปราชัย เจาหนาที่[ITA.GetAdjective]ปรบมือชื่นชมผูแทนที่เขารวมประชุมในการตัดสินใจอันรอบคอบครั้งนี้ และสมาชิกคณะผูแทน[ITA.GetAdjective]จํานวนมากก็รีบกลับบานไปแจงขาวแก[ITA.GetLeader]แลว"
 bftb_greece.225.a: "ฝายเห็นดวยชนะ!"
 bftb_greece.226.t: "การประชุมเฮราคลีออน - ชาว[ITA.GetAdjective]ถูกปฏิเสธดินแดน!"
 bftb_greece.226.desc: "ผูแทนสวนใหญที่เขารวมประชุมลงมติวา[ITA.GetNameDef]ไมมีสิทธิ์จัดตั้งอาณานิคมใด ๆ ทางตอนใตของ[TUR.GetNameDef] และประณามญัตตินี้วาเปนเพียงการกระหายสงครามอันโงเขลาของ[ITA.GetAdjective]อีกครั้ง เจาหนาที่[ITA.GetAdjective]โจมตีการตัดสินใจนี้และยกสถานการณทั้งหมดขึ้นมาเปนขอพิสูจนอีกครั้งวาประชาชน[ITA.GetAdjective]เชื่อเรื่อง 'vittoria mutilata' (ชัยชนะที่ถูกตัดทอน) อยางถูกตองแลว ไมวาความเห็นสวนตัวจะเปนอยางไร ผูแทน[ITA.GetAdjective]ก็ไดรับคําสั่งใหอยูรวมการประชุมตอไป - ไมตองสงสัยเลยวาพวกเขาหวังจะยังมีอิทธิพลตอคําตัดสินในวาระสุดทายซึ่งสําคัญที่สุด"
 bftb_greece.226.a: "ฝายคัดคานชนะ!"
 bftb_greece.227.t: "การปะทะตามแนวชายแดนระหวาง[GRE.GetAdjective]กับ[TUR.GetNameDef]ทวีความรุนแรงขึ้น"
 bftb_greece.227.desc: "การโจมตี[341.GetName]ของ[GRE.GetAdjective]ลมเหลวตามคาด และเมื่อความขัดแยงในทะเลอีเจียนทวีความรุนแรงขึ้น เราก็ไดโอกาสอันเหมาะเจาะที่จะเขาแทรกแซงเพื่อ[GRE.GetNameDef] เราควรเคลื่อนกําลังไปยังคอเคซัสเพื่อประจําการตามแนวชายแดน[TUR.GetAdjective] เมื่อชาว[GRE.GetAdjective]สงสัญญาณ เราจะตีกระหนาบกองกําลัง[TUR.GetAdjective]และบีบใหเกิดสงครามที่ชอบธรรม"
 bftb_greece.227.a: "เราจะเตรียมพรอม"
 bftb_greece.228.t: "ชาว[SOV.GetAdjective]พายแพ"
 bftb_greece.228.desc: "ขาวนาตกตะลึงมาถึงเมืองหลวงของเรา: กองทัพที่ไมมีวันพายของ[SOV.GetNameDef]ไมอาจทะลวงแนวรบ[TUR.GetAdjective]ได พวกเขาจะไมชวยเราในการรุกราน และไดยกเลิกแผนการและการรุกทั้งหมด ปลอยใหชาว[TUR.GetAdjective]ตัดสินชะตาเราไดตามใจชอบโดยไมตองรับผิด"
 bftb_greece.228.a: "ลางไมดีเสียแลว..."
 bftb_greece.229.t: "[GRE.GetNameDefCap]เรียกรองใหเราทําตามคํามั่น"
 bftb_greece.229.desc: "[GRE.GetNameDefCap]เริ่มทําสงครามกับ[TUR.GetNameDef]แลว และเรียกรองใหเราเขาชวยรบตามที่เคยสัญญาไว ผลประโยชนที่ไดรับสัญญานั้นมากมาย และยังมีโอกาสเรียกรองเพิ่มไดเสมอ แตบางทีเราอาจไมอยูในฐานะที่จะทําตามพันธะไดอีกแลว - แมนั่นจะหมายถึงการสละการอางสิทธิ์ของเราก็ตาม"
 bftb_greece.229.a: "สูสงคราม!"
 bftb_greece.229.b: "สถานการณเปลี่ยนไปแลว"
 bftb_greece.230.t: "[FROM.GetNameDefCap]ทําตามพันธะสัญญา"
 bftb_greece.230.desc: "[FROM.GetNameDefCap]เขารวมสงครามกับ[TUR.GetNameDef]เคียงขางเราตามที่ใหคํามั่นไว เราจะรวมกันโคนลมรัฐ[TUR.GetAdjective]ใหได"
 bftb_greece.230.a: "เราไมมีทางแพ!"
 bftb_greece.231.t: "[FROM.GetNameDefCap]ละทิ้งพันธะสัญญา!"
 bftb_greece.231.desc: "[FROM.GetNameDefCap]ละทิ้งคํามั่นที่จะชวยเรา และสละการอางสิทธิ์ใน[TUR.GetNameDef]แลว! พวกเขาทรยศเรา และทําใหการตอสูทั้งหมดของเราดอยคาลง เราไดแตหวังวาจะมีกําลังพอที่จะชนะไดโดยไมตองพึ่งความชวยเหลือจาก[FROM.GetAdjective]"
 bftb_greece.231.a: "พวกขี้ขลาด!"
 bftb_greece.232.t: "บาซิเลอุสปรากฏตัว..."
 bftb_greece.232.desc: "ปาฏิหาริยบังเกิดแกชาติที่กําลังสิ้นหวังของเรา: การแทรกแซงจากสวรรคที่นักบุญจัสติเนียนประทานลงมา ชายในชุดผาขี้ริ้วขาดวิ่นถูกพบนอนหมดสติอยูริมชายฝงภูเขาอาทอส และไดรับการชวยชีวิตจากความตายโดยผูดูแลศาสนสถานอันศักดิ์สิทธิ์ผูศรัทธา ในตอนแรกเจาหนาที่ที่จับกุมเขาเห็นวาเปนแคคนบาเสียสติที่เดินเทามาจากเยอรมนีจนถึง[ROOT.GetNameDef] แตนักวิชาการคนหนึ่งของ EEE ของเราไดระบุตัวตนวาเขาคือทายาทที่สาบสูญไปนานของราชวงศคอมเนนอส \n\nเราขบคิดกันมานานวาใครควรเปนประมุขของรัฐไบแซนไทนของเรา และดูเหมือนวาพระเจาไดประทานคําตอบมาใหแลว ทายาทไบแซนไทนผูนี้พูดภาษากรีกไมไดสักคํา แตสอนกันไดแนนอน! [ROOT.GetNameDef]ไดรับพระกรุณาจากพระเจาอยางแทจริง"
 bftb_greece.232.a: "บาซิเลอุสอาดอลโฟสที่ 1 จงเจริญ!"
 bftb_greece.232.b: "เออ เดี๋ยวนะ ถาเขาเปนแคคนบาละ?"
 bftb_greece.233.t: "อิโออันนิส เมตาซัส ถึงแกอสัญกรรม"
 bftb_greece.233.desc: "นายกรัฐมนตรีและผูเผด็จการแหง[ROOT.GetNameDef]ถึงแกอสัญกรรมหลังจากปวยมาระยะหนึ่ง เขาเสียชีวิตในตางแดนในฐานะผูลี้ภัยจากชาติที่ถูกพิชิต แมจะไมไดเปนที่รักของประชาชน[ROOT.GetAdjective]นัก แตเขาก็กลายเปนสัญลักษณแหงเอกภาพของชาติและการตอตานในยามวิกฤต เอ็มมานุยล ซูเดรอส ผูเปนศูนยรวมใจและเปนฝายเวนิเซลอส ไดขึ้นดํารงตําแหนงนายกรัฐมนตรีแหง[ROOT.GetNameDef]แทนเมตาซัส"
 bftb_greece.233.a: "สงครามยังดําเนินตอไป"
 bftb_greece.234.t: "แนวคิดเมกาลีไดรับการอนุมัติ"
 bftb_greece.234.desc: "มีขาวจากการประชุมเฮราคลีออนวามหาอํานาจที่เขารวมไดอนุมัติขอเสนอ "แนวคิดเมกาลี" ของ[GRE.GetAdjective]แลว นี่ไมเพียงคุกคามเสถียรภาพของภูมิภาค แตยังเสี่ยงอยางยิ่งที่จะเกิดสงครามเต็มรูปแบบระหวาง[GRE.GetNameDef]กับ[TUR.GetNameDef]ในอนาคตอันใกล\n\nเปนไปไดวา[GRE.GetNameDef]อาจไดรับการสนับสนุนทางทหารจาก[FRA.GetNameDef]หรือ[ENG.GetNameDef] และเมื่อพิจารณาพันธะทางทหารที่เรามีตอ[TUR.GetNameDef]ในปจจุบัน เราอาจพบวาตนเองอยูผิดฝงในสงครามกับมหาอํานาจเหลานี้ฝายใดฝายหนึ่ง หรืออาจทั้งสองฝาย ผูนําทางทหารของเราเรียกรองใหคํานึงถึงเรื่องนี้และทบทวนพันธะในการปกปอง[TUR.GetNameDef]ของเราใหม"
 bftb_greece.234.a: "พวกเติรกตองเอาตัวรอดเอง"
 bftb_greece.234.b: "เรายืนหยัดตามการรับประกันไมวาตองแลกดวยอะไร!"
 bftb_greece.235.t: "[ROM.GetName]เพิกถอนการรับประกัน"
 bftb_greece.235.desc: "การประชุมเฮราคลีออนทําใหผูรับประกันชาว[ROM.GetAdjective]ของเราหวั่นไหวอยางหนัก แทนที่จะเสี่ยงทําสงครามกับมหาอํานาจยุโรป พวกเขาเลือกที่จะเพิกถอนคําสัญญาวาจะใหความชวยเหลือทางทหารในการปองกันประเทศของเรา"
 bftb_greece.235.a: "พวกขี้ขลาด!"
 bftb_greece.236.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะชวยตอตาน[TUR.GetNameDef]"
 bftb_greece.236.desc: "แมจะสนใจขยายอิทธิพลอยางไมตองสงสัย แต[SOV.GetNameDef]ไดตัดสินใจไมชวยแผนการแผอิทธิพลเหนือ[TUR.GetNonIdeologyName]ของเรา โดยตองการมุงความสนใจไปที่เรื่องอื่นแทน"
 bftb_greece.236.a: "เราจะดําเนินการตอไปอยูดี"
 bftb_greece.236.b: "บางทีเราอาจใจรอนเกินไปหนอย"
 bftb_greece.237.t: "[FROM.GetName]สนับสนุนความทะเยอทะยานตอ[TUR.GetNonIdeologyName]"
 bftb_greece.237.desc: "นักการทูตจาก[FROM.GetNameDef]แจงเราวา[FROM.GetLeader]สนับสนุนแผนการของเราตอ[TUR.GetNameDef] รายงานจากหนวยขาวกรองทางทหารของเรายังบงชี้วาพวกเขาเริ่มเคลื่อนทัพไปยังชายแดน[TUR.GetAdjective]แลว"
 bftb_greece.237.a: "ขาวดีมาก!"

 bftb_turkey.1.t: "อนุสัญญามองเทรอซ"
 bftb_turkey.1.desc: "ประธานาธิบดี[TUR.GetLeader]แจงเราวา[TUR.GetNameDef]กําลังเตรียมกลับมาตั้งกองกําลังทหารในชองแคบตุรกีอีกครั้ง รัฐบาล[TUR.GetAdjective]ตองการใหเราสนับสนุนการอางสิทธิ์เหนือนานนํ้าของพวกเขา และแกไขสนธิสัญญาโลซานนเพื่อใหการอางสิทธิ์นั้นชอบธรรม \n\nการสนับสนุนการอางสิทธิ์เหนือชองแคบตุรกีของ[TUR.GetAdjective]ยอมทําใหพวกเขาซาบซึ้งและเปนมิตรกับเรามากขึ้นแนนอน และอาจเปดโอกาสให[TUR.GetNameDef]ทาทาย[ITA.GetNameDef]ในทะเลเมดิเตอรเรเนียนได อยางไรก็ตาม การเขาไปพัวพันกับวิกฤตนี้อาจทําใหเราตองอยูคนละฝงกับ[SOV.GetNameDef] ซึ่งในกรณีเลวรายที่สุดอาจหมายถึงสงคราม"
 bftb_turkey.1.a: "เราจะสนับสนุนพวกเติรกในเรื่องนี้"
 bftb_turkey.1.b: "จักรวรรดิบริติชไมใสใจเรื่องของตุรกี"
 TUR_britain_backs_turkey_tt: "\nเราจะสนับสนุน§Y[TUR.GetNameDef]§!บนหลักการที่วาพวกเขาควรมีอํานาจควบคุมการผานเขาออก§Yชองแคบตุรกี§! \n\n§Rเราจะมีโอกาสถอนการสนับสนุนหากดูเหมือนวาสงครามระหวาง§Y[TUR.GetNameDef]§!กับ§Y[SOV.GetNameDef]§!มีแนวโนมจะเกิดขึ้นอยางกะทันหัน§!"
 TUR_britain_unentangles_itself_tt: "\nเราจะปลอยให§Y[TUR.GetNameDef]§!ตกอยูในความเมตตาของ§Y[SOV.GetNameDef]§! มีแนวโนมวา§Yชองแคบตุรกี§!จะยังคงเปดใหเรือจากทุกที่ในโลกผานไดอยางไมมีขอจํากัด"
 bftb_turkey.2.t: "[ENG.GetName]มอบการสนับสนุน"
 bftb_turkey.2.desc: "[ENG.GetLeader]ออกแถลงการณชี้แจงวา[ENG.GetNameDef]ตั้งใจจะสนับสนุนเราในเปาหมายที่จะยึดอํานาจควบคุมชองแคบของเราเองกลับคืนมา การไดรับการสนับสนุนจาก[ENG.GetNameDef]เปนชัยชนะครั้งใหญของเรา และชวยเสริมความชอบธรรมของเราไปทั่วโลกอยางมาก"
 bftb_turkey.2.a: "ตอนนี้เรารอการตอบสนองจาก[SOV.GetNameDef]"
 bftb_turkey.3.t: "[ENG.GetName]ปฏิเสธที่จะชวยเรา!"
 bftb_turkey.3.desc: "[ENG.GetLeader]เขียนจดหมายยาวถึง[TUR.GetLeader] อธิบายอยางละเอียดวา[ENG.GetNameDef]ไมอาจเขาไปพัวพันกับวิกฤตในตางแดนไดในขณะนี้ [ENG.GetLeader]อางถึงการที่ประชาชนใน[ENG.GetNameDef]ไมสนับสนุนสงคราม และความกังขาสวนตัวตอความพรอมของ[TUR.GetAdjective]ในการทําสงครามกับ[SOV.GetNameDef] เปนเหตุผลที่[ENG.GetNameDef]จะไมเขามาเกี่ยวของ \n\n[ENG.GetName]ยอมรับอํานาจควบคุมชองแคบตุรกีของเรา แตจะไมทําอะไรมากไปกวานั้น"
 bftb_turkey.3.a: "ตอนนี้เรารอการตอบสนองจาก[SOV.GetNameDef]"
 bftb_turkey.4.t: "[TUR.GetNameDef]ยึดอํานาจควบคุมชองแคบบอสพอรัส!"
 bftb_turkey.4.desc: "[TUR.GetLeader]ประกาศวาชองแคบตุรกีจะอยูภายใตการควบคุมโดยสมบูรณของ[TUR.GetNameDef] ซึ่งทําใหรัฐบาล[TUR.GetAdjective]มีอํานาจปดชองแคบไมใหเราผานไดตามใจชอบ! นี่เปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง: หมายความวารัฐบาล[TUR.GetAdjective]ตัดสินใจวาตนมีสิทธิ์กักกองเรือของเราไวในทะเลดําเมื่อใดก็ไดที่เห็นวาเปนประโยชนทางการเมือง"
 bftb_turkey.4.a: "ระดมกองทัพทันที!"
 bftb_turkey.4.b: "ละครตลกนี้แทบไมมีความหมายสําหรับเรา"
 TUR_soviets_oppose_turkey_tt: "\nรัฐบาล§Y[TUR.GetAdjective]§!จะเสนอทางออกแบบประนีประนอมใหเรา หรือไมก็จะยกระดับสถานการณใหตึงเครียดยิ่งขึ้น \n\n§Rเราจะมีโอกาสลดความตึงเครียดของสถานการณหากดูเหมือนวาการปะทะดวยอาวุธมีแนวโนมจะเกิดขึ้น§!"
 TUR_soviets_allow_militarisation_tt: "§Yชองแคบตุรกี§!จะกลับมามีกองกําลังทหารประจําการ และ§Y[TUR.GetNameDef]§!จะไดรับอํานาจควบคุมการเดินเรือทั้งหมดที่ผานชองแคบ"
 bftb_turkey.5.t: "[SOV.GetName]คัดคานการกลับมาตั้งกองกําลังทหารในชองแคบของเรา!"
 bftb_turkey.5.desc: "เจาหนาที่ผูแทนของ[SOV.GetNameDef]แถลงอยางชัดเจนวาการยึดชองแคบตุรกีโดยพลการของเราไมชอบดวยกฎหมาย และพวกเขาตั้งใจจะใชมาตรการขั้นเด็ดขาดเพื่อพลิกการตัดสินใจของเรา แมนักการทูตของเราจะกดดัน แตเจาหนาที่[SOV.GetAdjective]ก็ปฏิเสธที่จะตัดความเปนไปไดของการแทรกแซงทางทหารใน[TUR.GetNameDef]เพื่อบังคับตามเจตจํานงของตน \n\nการคงสถานะเดิมไวเปนสิ่งที่คิดไมได และแมแต[SOV.GetNameDef]ก็ตองเขาใจเรื่องนี้แน หากเราเสนอทางออกแบบประนีประนอมที่เปดใหทุกประเทศในทะเลดําผานไดอยางเสรี [SOV.GetNameDef]ก็จะไมมีทางเลือกอื่นนอกจากยอมรับขอเสนอของเรา เวนแตพวกเขาอยากเปนตัวนารังเกียจของโลก"
 bftb_turkey.5.a: "เราจะเสนอทางประนีประนอม"
 bftb_turkey.5.b: "ไมมีการยอมความ ไมมีการประนีประนอม - เราจะทําสิ่งนี้ใหถูกตอง!"
 TUR_strait_compromise_tt: "§Y[SOV.GetNameDefCap]§!และประเทศอื่น ๆ ทั้งหมดที่มีชายฝงติด§Yทะเลดํา§!จะยังคงมีเอกสิทธิ์ในการผาน§Yชองแคบตุรกี§!ไดอยางเสรี"
 TUR_remaining_defiant_tt: "\nเราจะยังคงเรียกรองสิทธิ์ในการควบคุมการเดินเรือทั้งหมดที่ผาน§Yชองแคบตุรกี§!ตอไป \n\n§Rนี่อาจเปนโอกาสสุดทายที่จะลดความตึงเครียด: หาก[SOV.GetNameDef]กดดันเรื่องนี้ตอ ก็จะนําไปสูสงคราม!§!"
 bftb_turkey.6.t: "[SOV.GetName]ยินยอมใหชองแคบกลับมามีกองกําลังทหาร!"
 bftb_turkey.6.desc: "รัฐบาล[SOV.GetAdjective]ออกแถลงการณสั้น ๆ ที่พาดพิงอยางคลุมเครือถึงผลที่ตามมาและการลงโทษฐานทําลายสันติภาพ แตเปนการสวนตัว เจาหนาที่ของเราไดรับการยืนยันวา[SOV.GetNameDef]จะไมมีการตอบโตใด ๆ \n\n[TUR.GetLeader]กลาวสุนทรพจนอยางเรารอนในอิสตันบูลซึ่งถายทอดทางวิทยุไปทั่วประเทศ ประกาศชัยชนะครั้งยิ่งใหญของ[TUR.GetNameDef] ประชาชนตางหลั่งไหลออกมาแสดงการสนับสนุนรัฐบาลอยางลนหลาม และคาดวาจะมีการเฉลิมฉลองไปทั่วประเทศสําหรับชัยชนะอันเด็ดขาดในเรื่องนี้"
 bftb_turkey.6.a: "ขอใหสันติภาพในบาน และสันติภาพในโลก!"
 bftb_turkey.7.t: "[TUR.GetNameDefCap]ประนีประนอมเรื่องการกลับมาตั้งกองกําลังทหารในชองแคบ"
 bftb_turkey.7.desc: "หลังการเจรจาอยางยืดเยื้อ รัฐบาล[TUR.GetAdjective]ตัดสินใจเขาควบคุมชองแคบ แตยังคงอนุญาตใหทุกประเทศที่ติดทะเลดําผานไดอยางเสรี ขอเสนออันรัดกุมของ[TUR.GetNameDef]แทบไมเปดชองใหคัดคาน และไดรับการอนุมัติอยางรวดเร็วจาก[BUL.GetNameDef]และ[ROM.GetNameDef]แลว ซึ่งทายที่สุดก็มัดมือเราในเรื่องนี้"
 bftb_turkey.7.a: "เอาละ ถือไดวาวิกฤตนี้จบลงแลว"
 bftb_turkey.8.t: "ความขัดแยงกอตัวในทะเลดํา"
 bftb_turkey.8.desc: "[SOV.GetName]คัดคานแผนการของ[TUR.GetNameDef]ที่จะยึดอํานาจควบคุมชองแคบคืน แต[TUR.GetNameDef]ก็ยังคงทาทายตอการขมขูของ[SOV.GetAdjective] สถานการณเสี่ยงจะลุกลามเปนการปะทะดวยอาวุธ ขณะที่[TUR.GetNameDef]พยายามยืนยันอธิปไตยของตน และ[SOV.GetNameDef]ก็เดินเกมเพื่อสถาปนาอํานาจเหนือภูมิภาค \n\nดุลอํานาจอยูในมือเรา: เราตองเลือกวาจะยืนยันการสนับสนุน[TUR.GetNameDef]อยางเปนทางการดวยการรับประกันเอกราชเพื่อยับยั้งสหภาพโซเวียต หรือจะลางมือจากสถานการณนี้และหวังวาทั้งสองประเทศจะถอยออกจากเสนทางที่กําลังจะปะทะกัน"
 bftb_turkey.8.a: "เราตองสนับสนุน[TUR.GetNameDef]ตอตานทรราชบอลเชวิค"
 bftb_turkey.8.b: "การผอนปรนตอลัทธิทวงคืนดินแดนของ[SOV.GetAdjective]เปนราคาเล็กนอยที่ตองจายเพื่อสันติภาพ!"
 TUR_britain_stands_up_for_turkey_tt: "\nเราจะยืนเคียงขาง§Y[TUR.GetNameDef]§!แมจะนําไปสูสงครามก็ตาม §R[SOV.GetNameDefCap]จะมีโอกาสครั้งสุดทายในการลดความตึงเครียดของสถานการณ!§!"
 TUR_britain_abandons_turkey_tt: "\nเมื่อเราถอนการสนับสนุน§Y[TUR.GetNameDef]§! §Yรัฐบาล[TUR.GetAdjective]§!จะมีโอกาสครั้งสุดทายในการลดความตึงเครียดของสถานการณ"
 bftb_turkey.9.t: "ชาว[ENG.GetAdjective]ทอดทิ้งเรา"
 bftb_turkey.9.desc: "นายกรัฐมนตรี[ENG.GetLeader]ประกาศตอสาธารณะวา ดวยความตึงเครียดที่เพิ่มขึ้นระหวางเรากับ[SOV.GetNameDef] [ENG.GetNameDef]ไมอาจเขาไปพัวพันกับสิ่งที่เรียกวา 'ขอพิพาทระดับภูมิภาค' ได [ENG.GetLeader]ยกความสูญเสียของ[ENG.GetAdjective]ในมหาสงครามขึ้นมาอาง และผลักดันนโยบายผอนปรนตอ[SOV.GetNameDef] \n\nประกาศนี้สรางความผิดหวังอยางมากในอังการา และ[TUR.GetLeader]ไดประณามความขี้ขลาดของ[ENG.GetNameDef]"
 bftb_turkey.9.a: "ทุกอยางจบสิ้นแลว เราตองยอมจํานนตอความตองการของ[SOV.GetNameDef]โดยสิ้นเชิง"
 bftb_turkey.9.b: "ไมมีอะไรเปลี่ยนไป เราตองยืนหยัดในแนวทางเดิม"
 TUR_straits_remain_demilitarised_tt: "\n§Yชองแคบตุรกี§!จะยังคงเปนเขตปลอดทหาร และเราจะไมมีอํานาจควบคุมการเดินเรือที่ผาน§Yชองแคบตุรกี§!จนกวาจะเกิดสงคราม \n\n§Rนี่เปนโอกาสสุดทายที่จะลดความตึงเครียด: หาก[SOV.GetNameDef]กดดันเรื่องนี้ตอไปอีก ก็จะนําไปสูสงคราม!§!"
 TUR_we_remain_committed_tt: "\n§R[SOV.GetNameDefCap]จะมีโอกาสครั้งสุดทายในการลดความตึงเครียดของสถานการณ แตหากพวกเขาเลือกที่จะไมทํา ก็จะนําไปสูสงคราม!§!"
 bftb_turkey.10.t: "ชาว[TUR.GetAdjective]ยังคงทาทาย"
 bftb_turkey.10.desc: "แมจะเผชิญกับกําลังที่เหนือกวาอยางทวมทน [TUR.GetLeader]ก็ไมยอมถอยในเรื่องสิทธิ์เหนือชองแคบตุรกีของ[TUR.GetAdjective] ความตึงเครียดทวีขึ้นอยางรวดเร็ว มีการระดมทหารตลอดแนวชายแดน[TUR.GetAdjective]-[SOV.GetAdjective] [TUR.GetLeader]เรียกวิกฤตครั้งนี้วา 'ชวงเวลาแหงชะตากรรมของ[TUR.GetNameDef]' และใหคํามั่นวา[TUR.GetNameDef]จะไมมีวันยอมจํานนตอทรราช[SOV.GetAdjective]"
 bftb_turkey.10.a: "ชองแคบตุรกีไมคุมกับสงครามเต็มรูปแบบ"
 bftb_turkey.10.b: "[TUR.GetNameDefCap]จะตองคุกเขายอมจํานนตอเรา!"
 bftb_turkey.11.t: "[TUR.GetNameDefCap]ยอมตามขอเรียกรองของเรา"
 bftb_turkey.11.desc: "[TUR.GetLeader]ไดรับการตอนรับอยางอบอุนในมอสโก ที่ซึ่งเขาถูกบังคับภายใตการคุมกันดวยอาวุธใหลงนามในสนธิสัญญาฉบับใหม ซึ่งเทากับการสละสิทธิ์ทั้งหมดของ[TUR.GetAdjective]ในการตั้งกองกําลังทหารหรือตรวจตราชองแคบตุรกี ประธานาธิบดี[TUR.GetAdjective]ถูกสงกลับบานพรอมกลองยาสูบของ[SOV.GetLeader]เปนของที่ระลึกจากการเยือน[SOV.GetNameDef] \n\nการแสดงแสนยานุภาพในนานนํ้าของเราไดสําเร็จเปนชัยชนะครั้งใหญ และกองกําลังของเราที่ชายแดน[TUR.GetAdjective]ไดรับอนุญาตใหมีชวงเฉลิมฉลองภาคบังคับเปนเวลาสามวัน โดยตองเฉลิมฉลองใหครึกโครมที่สุดเทาที่จะทําได"
 bftb_turkey.11.a: "โลกควรเกรงกลัวแสนยานุภาพของ[SOV.GetNameDef]"
 bftb_turkey.12.t: "[SOV.GetName]ยอมถอย"
 bftb_turkey.12.desc: "[SOV.GetLeader]โทรศัพทถึง[TUR.GetLeader]ดวยตนเอง เรียกรองอยางใจเย็นใหลดความตึงเครียด และยกยองประธานาธิบดี[TUR.GetAdjective]ในบทบาทตอการตอสูกับจักรวรรดินิยม ทหาร[SOV.GetAdjective]ไดรับคําสั่งใหลดระดับปฏิบัติการตามชายแดน[SOV.GetAdjective] และ[SOV.GetNameDef]ไดถอนขอรองเรียนเรื่องการที่[TUR.GetName]ยึดชองแคบตุรกี \n\nประชาชน[TUR.GetAdjective]ซึ่งไมกระตือรือรนเลยกับความคิดเรื่องสงครามใหญหลังสงครามประกาศอิสรภาพอันโหดราย ตางถอนหายใจโลงอกพรอมกันเมื่อ[TUR.GetLeader]ประกาศตอประชาชาติวาทายที่สุดสันติภาพไดรับชัยชนะ และอธิปไตยของ[TUR.GetAdjective]ไดรับการปกปองไวชั่วนิรันดรดวยความกลาหาญของประชาชน[TUR.GetAdjective]ในยามวิกฤตนี้"
 bftb_turkey.12.a: "เราชนะแลว!"
 bftb_turkey.13.t: "สงคราม[TUR.GetAdjective]-[SOV.GetAdjective]เริ่มตนขึ้น"
 bftb_turkey.13.desc: "เมื่อหกชั่วโมงกอน กองกําลัง[SOV.GetAdjective]เริ่มระดมยิงฐานยุทธศาสตรของ[TUR.GetAdjective]ในทราบซอน และประกาศวากําลังเขาสู[TUR.GetNameDef]เพื่อปลดปลอยกรรมกร[TUR.GetAdjective]ในฐานะสวนหนึ่งของสงครามครูเสดลัทธิมารกซ ไอคนทรยศ เชฟก ฮึสนือ ไดประกาศจัดตั้งสาธารณรัฐประชาชนตุรกีพลัดถิ่นแลว ซึ่งไมตองสงสัยเลยวาจะอยูใตอาณัติของ[SOV.GetNameDef]ไปอีกนาน \n\n[TUR.GetLeader]ขึ้นเวทีในอิสตันบูลและประกาศอยางหมนหมองวาสงครามไดมาถึง[TUR.GetNameDef]แลว แตนํ้าเสียงเศรานั้นอยูไดไมนาน กอนที่ประธานาธิบดีตุรกีจะเปลี่ยนวาทะ: เริ่มกลาวอยางดุเดือดวาประชาชน[TUR.GetAdjective]ถูกโชคชะตาเรียกรองใหลุกขึ้นสูเพื่อเสรีภาพและเอกราชของตนอีกครั้ง แมบาดแผลจากสงครามประกาศอิสรภาพยังคงสดใหม แตประชาชน[TUR.GetAdjective]ก็ถูกปลุกเราจนฮึกเหิมและแหกันเขารวมกองทัพ \n\nแตความกระตือรือรนนั้นจะอยูไดนานแคไหน?"
 bftb_turkey.13.a: "...แลวเราจะยืนหยัดไดนานแคไหน?"
 bftb_turkey.14.t: "ขบวนการฝายคานเริ่มกอตัว"
 bftb_turkey.14.desc: "นักรัฐศาสตร[TUR.GetAdjective]เชื่อวาตองใชเวลาหลายสัปดาหกวาขบวนการฝายคานที่ชอบธรรมจะเริ่มกอตัวหลังยกเลิกการหามพรรคการเมือง แตพวกเขาคิดผิดทั้งหมด อัดนาน เมนเดเรส ไมรอชาในการรวบรวมกลุมผูยึดถือขนบธรรมเนียมที่มีความคิดเดียวกันและไมพอใจสภาพความศรัทธาทางศาสนาใน[TUR.GetNameDef]ภายใตพวกเคมาลิสต ในอดีต เมื่อขบวนการทางการเมืองของ[TUR.GetAdjective]ถูกพวกหัวรุนแรงทางศาสนาชวงชิงไป กระบวนการเปลี่ยนผานสูประชาธิปไตยทั้งหมดก็ถูกระงับ แตไมใชครั้งนี้: ครั้งนี้[TUR.GetLeader]ตั้งใจจะเอาชนะขบวนการคลั่งศาสนานี้ที่หีบเลือกตั้งเมื่อถึงวันเลือกตั้ง \n\nเมนเดเรสและพรรคพวกหัวรุนแรงรวมตัวกันในสิ่งที่เรียกวา 'กลุมอนุรักษประเพณี' ซึ่ง CHP ระบุวาเปนตนกําเนิดของขบวนการอิสลามประชานิยมที่วางแผนจะลงสนามดวยนโยบายอนุรักษนิยมและยึดถือขนบธรรมเนียม กลุมอนุรักษประเพณีจะรณรงคหาเสียงในชนบทของตุรกีในอีกหลายสัปดาหขางหนาเพื่อสรางฐานเสียง และเมื่อรวบรวมผูติดตามที่หลงผิดไดมากพอ ก็ไมตองสงสัยเลยวาพวกเขาจะเปดตัวพรรคฝายคานที่หลีกเลี่ยงไมไดนั้น"
 bftb_turkey.14.a: "การเลือกตั้งที่จะมาถึงคือการตอสูเพื่อจิตวิญญาณของ[TUR.GetName]"
 bftb_turkey.16.t: "กลุมอนุรักษประเพณีระดมพลเมืองในชนบทเพื่อเพิ่มจํานวนผูมาใชสิทธิ์เลือกตั้ง"
 bftb_turkey.16.desc: "ผูยึดถือขนบธรรมเนียมของอัดนาน เมนเดเรส ออกเดินสายกันเปนจํานวนมากทั่วประเทศ เพื่อชักชวนพลเมืองผูเครงศาสนาที่รูสึกถูกรัฐบาลฆราวาสกดขี่ใหออกไปลงคะแนนเสียงใหพรรคของพวกเขาในการเลือกตั้งที่จะมาถึง รายงานระบุวาแมผูมีสิทธิ์เลือกตั้งเหลานี้หลายคนยังคงกังขาวาจะเอาชนะพวกเคมาลิสตได และมีทัศนคติเยยหยันตอประชาธิปไตยโดยรวม แตคนสวนใหญที่ถูกเขาหาก็แสดงความกระตือรือรนตอเมนเดเรสและขบวนการฝายคานของเขา"
 bftb_turkey.16.a: "นี่ขัดรัฐธรรมนูญ! สั่งยุติเสีย!"
 bftb_turkey.16.b: "เจตจํานงประชาธิปไตยของประชาชนจะตองปรากฏ"
 bftb_turkey.17.t: "กลุมอนุรักษประเพณีของเมนเดเรสทาบทามองคกรชาวเคิรดเปนพันธมิตร"
 bftb_turkey.17.desc: "ผูยึดถือขนบธรรมเนียมของอัดนาน เมนเดเรส เดินทางเยือนเคอรดิสถานของ[TUR.GetAdjective]อยางเปนขาวโดงดัง โดยเทศนาเรื่องการปรองดองและผลประโยชนรวมกันในเรื่องสภาพความศรัทธาใน[TUR.GetNameDef]ปจจุบัน ผูนําชนเผาเคิรดยกคัมภีรทางศาสนาขึ้นมาอางและขึ้นเวทีรวมกับเจาหนาที่ของขบวนการฝายคานสายอนุรักษประเพณี เชิญชวนชาวเคิรดใหลงคะแนนใหเมนเดเรสและพวกในวันเลือกตั้ง เพื่อ 'นํา[TUR.GetNameDef]กลับสูออมกอดของพระผูเปนเจา'"
 bftb_turkey.17.a: "นี่เกือบจะเปนการกบฏแลว!"
 bftb_turkey.17.b: "ความรวมมือนี้อาจผลิดอกออกผลในอนาคต!"
 bftb_turkey.18.t: "พบแผนสมคบคิดโกงการเลือกตั้งในภูมิภาคชนบท"
 bftb_turkey.18.desc: "นับเปนวันที่นาเศราสําหรับประชาธิปไตยที่เพิ่งตั้งไขของ[TUR.GetNameDef] เมื่อมีการเปดโปงแผนโกงผลการเลือกตั้งที่จะมาถึงเพื่อเอื้อประโยชนแกขบวนการฝายคานของอัดนาน เมนเดเรส ในบางจังหวัดที่เปนชนบทที่สุดของ[TUR.GetNameDef] แผนการนี้ - ซึ่งเกี่ยวของกับผูนําศาสนา ผูบริหารทองถิ่น และแมแตเจาหนาที่รัฐ - ถูกขัดขวางแลว และผูสมคบคิดถูกจับกุม การสืบสวนของเราไมพบหลักฐานที่เชื่อมโยงเมนเดเรสหรือขบวนการฝายคานของเขากับแผนนี้ แตปฏิกิริยาของเราจะสงผลตอการหาเสียงเลือกตั้งของพวกเขาอยางแนนอน"
 bftb_turkey.18.a: "พิจารณาคดีทั้งหมดอยางเปดเผยและลงโทษใหหนักที่สุด!"
 bftb_turkey.18.b: "เราจะนิรโทษกรรมอยางเงียบ ๆ และหวังวาเรื่องนี้จะถูกลืม"
 bftb_turkey.19.t: "การชุมนุมใหญสนับสนุนขบวนการของเมนเดเรส"
 bftb_turkey.19.desc: "การชุมนุมที่อัดนาน เมนเดเรส จัดขึ้นในพื้นที่หางไกลของประเทศดึงดูดฝูงชนไดมากพอ ๆ กับตอนที่มุสตาฟา เคมาล อตาเติรก กลาวสุนทรพจนใจกลางอิสตันบูล [TUR.GetLeader]ทุกขใจอยางยิ่งเมื่อไดฟงรายงานเรื่องการชุมนุม ซึ่งดําเนินไปอยางราบรื่น และเมนเดเรสไดประกาศวาจะเปดตัวพรรคฝายคานอยางเปนทางการตอประชาชาติในเร็ว ๆ นี้ ผูปราศรัยหลายคนผลัดกันขึ้นเวที แตละคนเทศนาถึงความสําคัญของศาสนาในชีวิตประจําวันและในการเมือง และทุกคนตางสนับสนุนอุดมการณอนุรักษนิยมแบบยึดถือขนบธรรมเนียม - ผูปราศรัยบางคนถึงกับพูดถึงสุลตานและรัฐเคาะลีฟะฮออตโตมันที่ลมสลายไปนานแลวดวยถอยคําอาลัยอาวรณ! เมนเดเรสขึ้นเวทีเปนคนสุดทายและพูดดวยถอยคําที่ระมัดระวังกวาผูปราศรัยกอนหนามาก เขาอธิบายคุณประโยชนของเสรีนิยมแบบปลอยใหตลาดทํางานอยางอารมณดี และยกยองพวกเคมาลิสตสําหรับทุกสิ่งที่ทําเพื่อชาติ กอนจะบั่นทอนคําชมนั้นดวยคําวิจารณมากมาย ผูเขารวมออกจากการชุมนุมดวยความปติยินดีและมั่นใจวาจะชนะการเลือกตั้ง \n\nคณะนายทหารผูภักดีตอลัทธิเคมาลอยางแรงกลาไดเขาพบรัฐบาลและเรียกรองอยางชัดแจงให CHP ทํามากกวานี้เพื่อสกัดอิทธิพลที่เพิ่มขึ้นของเมนเดเรสและขบวนการประชานิยมอนุรักษนิยมของเขา ตัวแทนคณะนายทหารแถลงวานายทหารของประเทศจะไมมีวันรับใชรัฐบาลเมนเดเรส และบอกเปนนัยวาจะดําเนินการขั้นเด็ดขาดดวยตนเองหากเราไมสามารถสกัดสิ่งที่พวกเขามองวาเปนภัยคุกคามพื้นฐานตอระบอบเคมาลิสตได"
 bftb_turkey.19.a: "วันนี้เปนวันมืดมนของสาธารณรัฐ"
 bftb_turkey.20.t: "พรรคประชาธิปไตย (Demokrat Parti)"
 bftb_turkey.20.desc: "เมื่อแปดชั่วโมงกอน อัดนาน เมนเดเรส ประกาศเปดตัวพรรคฝายคานที่ใหมลาสุดและอันตรายที่สุดของ[TUR.GetNameDef]อยางภาคภูมิ: พรรคประชาธิปไตย (Demokrat Parti) เขาประกาศวาพรรคตั้งใจจะโคนการผูกขาดอํานาจของ CHP และจะนําประเทศไปสูทิศทางใหมอยางที่ไมเคยมีมากอน หลักสามประการของพรรคถูกเปดเผยตอหนาฝูงชนที่โหรองยินดี โดยเมนเดเรสใหคํามั่นวารัฐบาลของเขาจะยึดมั่นในศรัทธา มาตุภูมิ และเสรีภาพ - ตามลําดับนั้น ที่นาประหลาดใจยิ่งกวาคือการประกาศของเมนเดเรสวา[TUR.GetName]ภายใตการนําของ DP จะดําเนินนโยบายแทรกแซงอยางแข็งขันกวารัฐบาล[TUR.GetAdjective]ชุดใด ๆ นับตั้งแตกอตั้งประเทศ \n\nการประกาศนี้ทําใหแวดวงเคมาลิสตเดือดดาล และวันนี้[TUR.GetLeader]ใหคํามั่นตอผูสนับสนุนในอิสตันบูลวา แมการเลือกตั้งจะตองตอสูหนักกวาที่คิดไว แต CHP จะผานการเลือกตั้งที่จะมาถึงและยังคงเปนผูนํารัฐบาลของชาติตอไป"
 bftb_turkey.20.a: "ขอใหพรรคที่ดีที่สุดชนะ!"
 bftb_turkey.21.t: "วันเลือกตั้ง"
 bftb_turkey.21.desc: "วันเลือกตั้งที่รอคอยมานานมาถึงแลวในที่สุด ชายหญิงทั่วประเทศไมสนใจสภาพอากาศเลวรายหรืออาการเจ็บปวย ตางเดินทางไปยังคูหาเลือกตั้งที่กําหนดในจังหวัดของตนเพื่อลงคะแนนใหพรรคที่ชื่นชอบ ไมมีใครคาดคิดวาจะมีผูมาใชสิทธิ์มากมายถึงเพียงนี้ โดยเฉพาะเมื่อการเปลี่ยนผานสูประชาธิปไตยดูเหมือนจะเกิดขึ้นรวดเร็วเหลือเกิน การแขงขันเลือกตั้งอาจไมไดใสสะอาดนัก แตผูสนับสนุนประชาธิปไตยคนใดก็ยอมภาคภูมิใจที่เห็นพลเมือง[TUR.GetAdjective]จํานวนมากออกไปลงคะแนนในการเลือกตั้งเสรีครั้งแรกของ[TUR.GetName] \n\nการแขงขันสูสีมาก และตองใชเวลานานในการนับคะแนนทั้งหมดและตัดสินผลสุดทาย ผูชนะในการเลือกตั้งครั้งแรกของ[TUR.GetNameDef]ก็คือ..."
 bftb_turkey.21.a: "...ฝายสาธารณรัฐนิยม!"
 bftb_turkey.21.b: "...พรรคประชาธิปไตย!"
 TUR_republican_victory_tt: "£faction_tur_kemalist §YCHP§! จะไดรับอาณัติแบบ§Yประชาธิปไตย§!ใหปกครองประเทศ"
 TUR_conservative_victory_tt: "£faction_tur_traditionalist §YDP§! จะไดรับอาณัติแบบ§Yประชาธิปไตย§!ใหปกครองประเทศ"
 bftb_turkey.22.t: "สงครามกลางเมือง[TUR.GetAdjective]"
 bftb_turkey.22.desc: "หลังพรรคประชาธิปไตยชนะการเลือกตั้ง ความขัดแยงภายใน[TUR.GetNameDef]ก็แทบจะหลีกเลี่ยงไมได ความตึงเครียดระหวางรัฐบาลกับกองทัพเลวรายลงทุกวันนับแตการเลือกตั้ง และบัดนี้ดูเหมือนทุกอยางจะถึงจุดแตกหัก เหลานายทหารไดยึดอํานาจควบคุมรัฐทางตะวันตกสุดที่มั่งคั่งแลว และเชื่อกันวาพวกเขาไดรับการสนับสนุนจากประชาชนในรัฐที่ลุกฮือเหลานั้น \n\nทางตะวันออก กองกําลังติดอาวุธชาวเคิรดเริ่มจัดตั้งเพื่อเตรียมการตอสูดวยอาวุธโดยมุงหมายจะไดเอกราช เราโงเองที่คิดวาพันธมิตรกับชาวเคิรดจะยืนยาว แตพวกเขาโงยิ่งกวาที่คิดวาเราจะไมบดขยี้ความพยายามอันนาสมเพชที่จะแยงชิงผืนแผนดินอธิปไตยของเราไปตั้งเปนชาติ \n\nการตอสูเพื่อจิตวิญญาณของ[TUR.GetNameDef]เริ่มขึ้นแลว และเราจะแพไมได"
 bftb_turkey.22.a: "ฟ ซะบีลิลลาฮ เราจะสู!"
 bftb_turkey.23.t: "กติกาสัญญาซาอดาบาด"
 bftb_turkey.23.desc: "[TUR.GetLeader]เขาหา[ROOT.GetLeader]พรอมขอเสนอใหลงนามในสนธิสัญญาไมรุกรานซึ่งกันและกัน โดยเปดโอกาสใหรวมมือกันมากขึ้นในอนาคต นักการทูต[TUR.GetAdjective]ทุมเทกับการนําเสนออยางมาก ลงรายละเอียดถึงประวัติศาสตรและผลประโยชนรวมกันของสองชาติ ตามดวยการวิงวอนอยางจริงใจเพื่อสันติภาพระหวางชาติพี่นอง การเจรจาไปมาเปนไปอยางราบรื่น แตทายที่สุดการตัดสินใจวาจะลงนามหรือไมก็ขึ้นอยูกับเรา"
 bftb_turkey.23.a: "แนนอนวาเราจะลงนามในกติกาสัญญาแหงมิตรภาพนี้!"
 bftb_turkey.23.b: "เราไมใชพี่นองกัน [TUR.GetName]: เราไมรูจักพวกเจา"
 bftb_turkey.24.t: "เลือกผูสืบทอดของอตาเติรก"
 bftb_turkey.24.desc: "ไมมีชายหรือหญิงคนใดหวังจะเทียบชั้นความเปนผูนําระดับตํานานของมุสตาฟา เคมาล อตาเติรก ได แตบิดาแหงชาวเติรกก็ยังเปนเพียงมนุษยธรรมดา เราไมไดมองหาผูมาแทนที่กาซีของเรา เพราะไมมีใครแมแตจะฝนเทียบบิดาผูกอตั้งชาติผูเปรียบดั่งพระผูไถได แตเราตองเลือกผูนําที่ไวใจไดวาจะเดินตามรอยอตาเติรก ผูนั้นตองเปนแบบอยางของคุณคาแบบเคมาลิสตและดําเนินตามแบบอยางของอตาเติรกในฐานะผูนําแหง[TUR.GetNameDef]"
 bftb_turkey.24.a: "เจลาล บายาร คือผูสมัครที่เห็นไดชัด"
 bftb_turkey.24.b: "เจลาล บายาร คือผูสมัครที่เห็นไดชัด"
 bftb_turkey.24.c: "อิสเมต อีเนอนู คือผูสืบทอดที่คูควรของอตาเติรก"
 bftb_turkey.24.d: "เฟฟซี ชักมัก คือผูนําที่[TUR.GetNameDef]ตองการ"
 bftb_turkey.24.e: "เฟฟซี ชักมัก จะเปนฟรันซิสโก ฟรังโก ของเราเอง"
 bftb_turkey.24.f: "เรเจป เปเกร คือผูที่จะผสานลัทธิฟาสซิสตเขากับลัทธิเคมาล"
 bftb_turkey.24.g: "อัจฉริยภาพของเชฟเก็ต ซือเรยยา อายเดมีร จะพาเราผานพนไปได"
 bftb_turkey.24.h: "มีเพียงอิสเมต อีเนอนู ที่จะนําสังคมนิยมแบบ[TUR.GetAdjective]โดยเฉพาะมาใชได"
 bftb_turkey.24.i: "คาซึม ออรบาย จะนําคณะรัฐประหารทหารจนกวาเราจะพบหนทางของเรา"
 bftb_turkey.24.j: "เออ... อืม... อดีต... เคาะลีฟะฮ?"
 bftb_turkey.25.t: "[TUR.GetName]กดดันเรื่องฮาทาย"
 bftb_turkey.25.desc: "[TUR.GetLeader]เขียนจดหมายดวยถอยคํารุนแรง เรียกรองใหประชากรชาวเติรกในรัฐฮาทายของซีเรียไดใชสิทธิ์ตามระบอบประชาธิปไตยในการลงประชามติ เพื่อใหประชาชนฮาทายตัดสินใจวาจะเขารวมกับ[TUR.GetNameDef]หรือจะอยูเปนสวนหนึ่งของซีเรียตอไปอยางไมมีกําหนด ตํารวจอาณานิคมของเราพบกิจกรรมผิดกฎหมายที่ชายแดน[TUR.GetAdjective] โดยมีพลเมือง[TUR.GetAdjective]ขามแดนเขามากอความวุนวายในจังหวัดฮาทาย เห็นไดชัดวา[TUR.GetNameDef]วางแผนจะบิดเบือนผลประชามติเพื่อให[TUR.GetAdjective]ชนะ แตการทําให[TUR.GetNameDef]รูสึกดีตอเรายอมดีกวาทางเลือกอื่นแน ใครจะรูไดวา[TUR.GetLeader]จะไปไกลแคไหนเพื่อใหฮาทายรวมเขากับ[TUR.GetNameDef]?"
 bftb_turkey.25.a: "เราจะปลอยใหฮาทายหลุดเขาไปอยูในกํามือของ[TUR.GetNameDef]"
 bftb_turkey.25.b: "ฮาทายจะยังเปนสวนหนึ่งของซีเรีย ไมวาชาว[TUR.GetAdjective]จะตองการอะไร"
 bftb_turkey.26.t: "[FROM.GetNameDefCap]ยกอธิปไตยเหนือฮาทายใหเรา"
 bftb_turkey.26.desc: "[TUR.GetLeader]กลาวสุนทรพจนสั้น ๆ ในอันตาเกีย ตอนรับพลเมืองฮาทายสู[TUR.GetNameDef] และขอบคุณ[FROM.GetLeader]แหง[FROM.GetNameDef]ที่เคารพเจตจํานงประชาธิปไตยของประชาชนฮาทาย แมการเคลื่อนไหวนี้จะสรางความโกรธเกรี้ยวแกเจาหนาที่ซีเรีย แตบรรยากาศโดยรวมในฮาทายและทั่ว[TUR.GetNameDef]เต็มไปดวยความพึงพอใจ และชาว[TUR.GetAdjective]จํานวนมากเดินทางจากบานลงไปยังฮาทายเพื่อรวมเฉลิมฉลองและแลกเปลี่ยนของขวัญ เปนการรับขวัญจังหวัดใหมลาสุดของ[TUR.GetNameDef]"
 bftb_turkey.26.a: "ยินดีตอนรับกลับสูออมอก พี่นองทั้งหลาย"
 bftb_turkey.27.t: "[FROM.GetName]ยังคงควบคุมฮาทายอยางเหนียวแนน"
 bftb_turkey.27.desc: "[TUR.GetLeader]นําการชุมนุมอันดุเดือดในกาซีอันเทป ประณามการกดขี่ชาวเติรกในตางแดนโดย[FROM.GetNameDef] ประชาชน[TUR.GetAdjective]ถูกปลุกเราจนเดือดดาล และตอนนี้แทบไมมีไมตรีหลงเหลือระหวางผูกดขี่ฮาทายกับประชาชน[FROM.GetNameDef]เลย ในตอนนี้ ฮาทายยังอยูนอกเอื้อมของเรา - แตเราจะจดจําการทรยศอันชั่วรายนี้ตลอดไป"
 bftb_turkey.27.a: "ไมทางใดก็ทางหนึ่ง ฮาทายจะไดรับการปลดปลอยกลับสูที่ที่ควรอยู"
 bftb_turkey.29.t: "อดีตผูปฏิเสธการเกณฑทหารอาสาเขารับราชการ"
 bftb_turkey.29.desc: "ดูเหมือนการตัดสินใจใชแนวทางปกครองแบบมาตุภูมิมากอนจะไดผลอยางยิ่ง! จู ๆ ก็มีอาสาสมัครหลั่งไหลมาจากทั่วประเทศเพื่อขอเขารวมกองทัพ กองบัญชาการระดับสูงของเราแทบรับมือไมไหว ปรากฏการณอันนาเวียนหัวนี้ทําใหผูคนจากทุกพื้นเพทางศาสนาและภาษามาสมัครเขารวม จนแทบเปนภาระหนักเกินรับไหวในระดับปฏิบัติการ \n\nโชคดีที่อยางนอยเราก็เตรียมรับสถานการณนี้ไวบาง และการผนวกอดีตผูหลบเลี่ยงการเกณฑทหารทั้งหมดนี้เขาสูกองทัพก็เปนไปอยางคอนขางราบรื่น ที่ปรึกษาของเราเห็นวาอาจมีอาสาสมัครทยอยมาอีกเรื่อย ๆ ไปอีกนาน!"
 bftb_turkey.29.a: "ชางนาชื่นใจที่ไดเห็นชายหญิงผูกลาหาญมากมายมาปกปองชาติของตน"
 bftb_turkey.30.t: "คาชดเชยสําหรับหมูเกาะโอนีกี"
 bftb_turkey.30.desc: "หมูเกาะโอนีกีตั้งอยูในนานนํ้าของเราและครั้งหนึ่งเคยถือเปนสวนสําคัญของจักรวรรดิเรา หมูเกาะโดเดคานีส ตามที่ชาว[ENG.GetAdjective]และ[GRE.GetAdjective]นิยมเรียก จะกลับมาเปนของเราอีกครั้งเมื่อชาว[ITA.GetAdjective]ยอมคืนใหแกเจาของที่ชอบธรรม \n\nเจาหนาที่รัฐบาลไดรวบรวมรายการสิ่งที่เราสามารถเสนอแกชาว[ITA.GetAdjective]เพื่อแลกกับหมูเกาะ เพราะคาดไดแนนอนวาพวกเขาจะเรียกรองคาชดเชย - หากพวกเขายอมตกลงเลยแมแตนอย"
 bftb_turkey.30.a: "เราจะเสนอสิทธิ์ในโครเมียมของเรา"
 bftb_turkey.30.b: "เราจะเสนอคาชดเชยทางอุตสาหกรรม"
 bftb_turkey.30.c: "ขอเสนอแหงมิตรภาพนาจะเพียงพอ"
 bftb_turkey.31.t: "[FROM.GetNameDefCap]เสนอสิทธิ์ในทรัพยากรแตเพียงผูเดียวใน[342.GetName]แกเรา"
 bftb_turkey.31.desc: "รัฐบาล[FROM.GetAdjective]เขาหาเราพรอมขอเสนอที่นาประหลาดใจ พวกเขาตองการมอบผลผลิตแรและโลหะธรรมชาติทั้งหมดรอยเปอรเซ็นตในรัฐ[342.GetName]ใหเรา เพื่อแลกกับหมูเกาะโดเดคานีส \n\nโดยปกติรัฐบาลของเรามักทําธุรกิจไดดินแดนมามากกวาจะสละออกไป แต[TUR.GetNameDef]เสนอแหลงทรัพยากรของเราเองที่เราใชสะสมทรัพยากรซึ่งอาจสําคัญยิ่งตอความพยายามทําสงครามขนาดใหญ เรายังตองพิจารณาดวยวาเปนทรัพยากรที่เราอาจเขาถึงไมไดเมื่อสงครามเริ่มขึ้นจริง ๆ การตัดสินใจวาจะรับขอเสนอของ[FROM.GetAdjective]หรือไมนั้นทายที่สุดขึ้นอยูกับเรา"
 bftb_turkey.31.a: "เรายอมรับสิทธิ์ในทรัพยากรของพวกทานเพื่อแลกกับหมูเกาะโดเดคานีส"
 bftb_turkey.31.b: "เราจะไมยอมเสียดินแดนแมแตนิ้วเดียว! ไมใชตอนนี้ และไมมีวัน!"
 bftb_turkey.32.t: "[FROM.GetNameDefCap]เสนอความชวยเหลือทางอุตสาหกรรมแกเราเพื่อแลกกับหมูเกาะโดเดคานีส"
 bftb_turkey.32.desc: "รัฐบาล[FROM.GetAdjective]เขาหาเราพรอมขอเสนอที่นาสนใจ ชาว[FROM.GetAdjective]สงเอกสารที่ระบุความสําคัญทางประวัติศาสตรและยุทธศาสตรของหมูเกาะโดเดคานีสตอ[FROM.GetNameDef] และรางรายการทรัพยสินและโรงงานผลิตที่พวกเขาตองการขายใหเราเพื่อแลกกับหมูเกาะ \n\nโดยปกติรัฐบาลของเรามักทําธุรกิจไดดินแดนมามากกวาจะสละออกไป แตปฏิเสธไมไดวาอุตสาหกรรมที่เพิ่มขึ้นอาจเปนประโยชนอยางยิ่งตอเครื่องจักรสงครามของ[ROOT.GetAdjective] ทายที่สุด เราตองตัดสินใจวาการเสริมกําลังอุตสาหกรรมนี้มีคาตอชาติเราในทันทีมากกวาหมูเกาะโดเดคานีสหรือไม"
 bftb_turkey.32.a: "ลงนามในสัญญา หากพวกเขายอมจาย ก็เอาหมูเกาะไปได"
 bftb_turkey.32.b: "เราจะไมยอมเสียดินแดนแมแตนิ้วเดียว! ไมใชตอนนี้ และไมมีวัน!"
 bftb_turkey.33.t: "[FROM.GetNameDefCap]ขอใหโอนหมูเกาะโดเดคานีส"
 bftb_turkey.33.desc: "รัฐบาล[FROM.GetAdjective]สงจดหมายยืดยาวที่ลงนามโดย[FROM.GetLeader]มาถึงเรา เนนยํ้าความสําคัญของสายสัมพันธระหวางสองชาติและความชื่นชอบตามธรรมชาติที่ชาว[FROM.GetAdjective]มีตอประเทศของเรา เมื่อตัดคําพูดโออวดทั้งหมดออกไป ชาว[FROM.GetAdjective]เสนอจะลงนาม 'กติกาสัญญาแหงอํานาจ' กับเรา - ขอตกลงที่แทบไมมีความหมาย แตมีเงื่อนไขพวงมาดวย แนบมากับจดหมายแหงมิตรภาพคือแฟมเอกสารพรอมคําแนะนําในการสงมอบอํานาจอยางสันติระหวางผูวาการภูมิภาคของเรากับขาราชการ[FROM.GetAdjective]ที่รอเขารับชวงการปกครองหมูเกาะโดเดคานีส \n\nโดยปกติรัฐบาลของเรามักทําธุรกิจไดดินแดนมามากกวาจะสละออกไป อยางไรก็ตาม ชาว[FROM.GetAdjective]จะเปนพันธมิตรที่มีประโยชนมากในความขัดแยงที่จํากัดอยูในทะเลเมดิเตอรเรเนียน หากจะตองคํานึงถึง ประชากรสวนใหญซึ่งเปนชาวกรีกในหมูเกาะโดเดคานีสไดแสดงความไมพอใจตอความคิดที่[FROM.GetNameDef]จะผนวกหมูเกาะของพวกเขาเปนสวนหนึ่งของชาติ[FROM.GetAdjective] แตก็นั่นแหละ พวกเขาก็มีปฏิกิริยาคลาย ๆ กันตอนที่เราฉกบานของพวกเขามาจากซากจักรวรรดิออตโตมันหลังมหาสงคราม"
 bftb_turkey.33.a: "เรื่องนี้ควรนําไปสูพันธมิตรทางทหารในภายภาคหนานะ..."
 bftb_turkey.33.b: "เราไมกลัวถูกเรียกวาคนหนาไหวหลังหลอก หมูเกาะจะยังเปนของเรา!"
 bftb_turkey.34.t: "[FROM.GetNameDefCap]ยอมรับขอเสนอของเรา!"
 bftb_turkey.34.desc: "ทางการ[FROM.GetAdjective]คืนหมูเกาะโอนีกีใหเราแลวเพื่อแลกกับสิทธิ์ในทรัพยากรแตเพียงผูเดียวใน[342.GetName] แมเจาหนาที่จะแสดงความไมสบายใจเปนการสวนตัวตอการแสดงลัทธิอาณานิคมโดยสมัครใจอยางโจงแจงใน[342.GetName] แตความกังวลเหลานั้นสวนใหญก็ถูกกลบดวยความตื่นเตนทั่วไปตอการผนวกจังหวัดใหมลาสุดของ[TUR.GetNameDef] \n\n[TUR.GetLeader]เดินทางเยือนโรดสดวยตนเอง และรับรองกับพลเมืองที่ถูกกดขี่มานานวาความกังวลทั้งหมดของพวกเขาจะไดรับการรับฟงและดูแลโดยรัฐบาล[TUR.GetAdjective] แมในขณะที่หลักสูตรการศึกษาใหมซึ่งปลุกกระแสเรื่องรากเหงาทางประวัติศาสตรและชาติพันธุของหมูเกาะที่เชื่อมโยงกับ[TUR.GetNameDef]จะเริ่มนํามาใชทั่วหมูเกาะแลวก็ตาม"
 bftb_turkey.34.a: "ชัยชนะครั้งยิ่งใหญ!"
 bftb_turkey.35.t: "[FROM.GetNameDefCap]ยอมรับขอเสนอของเรา!"
 bftb_turkey.35.desc: "ทางการ[FROM.GetAdjective]คืนหมูเกาะโอนีกีใหเราแลวเพื่อแลกกับผลผลิตสวนหนึ่งจากอุตสาหกรรมที่กําลังพัฒนาของเรา แมเจาหนาที่จะแสดงความไมสบายใจเปนการสวนตัวตอแนวคิดที่ตองจายดวยเหล็กกลาและหยาดเหงื่อเพื่อแลกกับสิ่งที่เคยเปนของเรามาหลายศตวรรษ แตความกังวลเหลานั้นสวนใหญก็ถูกกลบดวยความตื่นเตนทั่วไปตอการผนวกจังหวัดใหมลาสุดของ[TUR.GetNameDef] \n\n[TUR.GetLeader]เดินทางเยือนโรดสดวยตนเอง และรับรองกับพลเมืองที่ถูกกดขี่มานานวาความกังวลทั้งหมดของพวกเขาจะไดรับการรับฟงและดูแลโดยรัฐบาล[TUR.GetAdjective] แมในขณะที่หลักสูตรการศึกษาใหมซึ่งปลุกกระแสเรื่องรากเหงาทางประวัติศาสตรและชาติพันธุของหมูเกาะที่เชื่อมโยงกับ[TUR.GetNameDef]จะเริ่มนํามาใชทั่วหมูเกาะแลวก็ตาม"
 bftb_turkey.35.a: "ชัยชนะครั้งยิ่งใหญ!"
 TUR_three_factories_sacrificed: "ลบ§Yโรงงานพลเรือน§!สามแหง"
 bftb_turkey.36.t: "[FROM.GetNameDefCap]ยอมรับขอเสนอของเรา!"
 bftb_turkey.36.desc: "เจาหนาที่[TUR.GetAdjective]หลายคนตองประหลาดใจ เมื่อทางการ[FROM.GetAdjective]คืนหมูเกาะโอนีกีใหเราเพื่อแลกกับการลงนามรวมกันในสนธิสัญญาที่ทายที่สุดไมไดบังคับใหฝายใดตองปฏิบัติตามพันธะอันไรความหมายใด ๆ ในนั้นเลย [TUR.GetLeader]เดินทางเยือนอยางเปนทางการดวยตนเองเพื่อลงนามในสิ่งที่เรียกวากติกาสัญญาแหงอํานาจกับ[FROM.GetLeader] และผูนําทั้งสองตางใหคํามั่นรวมกันที่จะพัฒนาความสัมพันธระหวางสองเพื่อนบานทางทะเลตอไปในโอกาสของการแลกเปลี่ยนดินแดนอันเปนประวัติศาสตรครั้งนี้ ความตื่นเตนแพรกระจายไปทั่ว[TUR.GetNameDef] และมีการเฉลิมฉลองกันอยางยิ่งใหญตอการผนวกจังหวัดใหมลาสุดของ[TUR.GetNameDef] \n\n[TUR.GetLeader]เดินทางเยือนโรดสดวยตนเอง และรับรองกับพลเมืองที่ถูกกดขี่มานานวาความกังวลทั้งหมดของพวกเขาจะไดรับการรับฟงและดูแลโดยรัฐบาล[TUR.GetAdjective] แมในขณะที่หลักสูตรการศึกษาใหมซึ่งปลุกกระแสเรื่องรากเหงาทางประวัติศาสตรและชาติพันธุของหมูเกาะที่เชื่อมโยงกับ[TUR.GetNameDef]จะเริ่มนํามาใชทั่วหมูเกาะแลวก็ตาม \n\nรัฐบาล[GRE.GetAdjective]ประณามการแลกเปลี่ยนดินแดนที่ราบรื่นนี้ และเรียกรองใหมหาอํานาจอื่น ๆ รวมประณามสิ่งที่พวกเขาเรียกวาการละเมิดอธิปไตยของชาว[GRE.GetAdjective]แหงหมูเกาะโอนีกีอยางไมเปนธรรมและผิดกฎหมาย ประชาคมระหวางประเทศสวนใหญเงียบเฉยตอการแลกเปลี่ยนดินแดนครั้งนี้ ซึ่งนาจะเปนเพราะเกรงวาจะทําใหรัฐบาล[TUR.GetAdjective]ขุนเคือง"
 bftb_turkey.36.a: "ไมมีทางออกมาดีไปกวานี้อีกแลว"
 bftb_turkey.37.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา!"
 bftb_turkey.37.desc: "รัฐบาล[FROM.GetAdjective]แถลงตอสาธารณะวา แมพวกปลุกปนและพวกทวงคืนดินแดนชาว[TUR.GetAdjective]จะพยายามเพียงใด หมูเกาะโดเดคานีสจะยังคงเปนดินแดนสําคัญของรัฐ[FROM.GetAdjective]ตลอดไป [FROM.GetLeader]เอยชื่อ[TUR.GetLeader]ในสุนทรพจน เยาะเยยวาแม[TUR.GetLeader]อาจไดรับความเคารพอยางกวางขวางใน[TUR.GetNameDef] แตใน[FROM.GetNameDef]กลับถูกพลเมือง[FROM.GetAdjective]หัวเราะเยาะวาเปนผูนําไรความสามารถ [FROM.GetLeader]ยังเรียก[TUR.GetNameDef]วารัฐลมเหลว และบรรยายยืดยาววาการมีอยูของชาติเราเปนการดูหมิ่นชาติ[FROM.GetAdjective]อยางใหอภัยไมได ในสุนทรพจนอันยืดเยื้อนั้น [FROM.GetLeader]ยกคําสัญญาที่ไมเปนจริงของสนธิสัญญาแซฟรขึ้นมาอางไมนอยกวาสามสิบเจ็ดครั้ง \n\n[TUR.GetLeader]กลาวถึงจุดยืนของ[FROM.GetAdjective]วา 'นาเสียดาย' แตหวังวาจะมีโอกาสเจรจาทางการทูตกันตอในภายหลัง"
 bftb_turkey.37.a: "ก็นะ อาจออกมาดีกวานี้ได"
 bftb_turkey.38.t: "[FROM.GetNameDefCap]เสนอใหรวมกันขุดทรัพยากรในคอเคซัส"
 bftb_turkey.38.desc: "รัฐบาล[FROM.GetAdjective]ยอมรับวาไดสงนักสํารวจและนักสํารวจแรเขาไปในจอรเจียเพื่อประเมินผลผลิตแรจากการทําเหมืองของเรา และเขาหาเราพรอมเอกสารที่เสนอวิธีใหทั้งสองชาติไดประโยชนมากขึ้นจากการรวมกันขุดแร นี่อาจเปนปรากฏการณที่ไมเคยมีมากอนที่ตัวแสดงระดับรัฐจะยอมรับการสอดแนมรูปแบบหนึ่ง แลวพยายามพลิกคําสารภาพนั้นใหเปนแผนกระชับความสัมพันธระหวางสองชาติ แตนั่นคือสถานการณที่เรากําลังเผชิญอยู ไมมีใครปฏิเสธไดวารัฐบาล[FROM.GetAdjective]เปนรัฐบาลที่กลาเสี่ยง \n\nเอกสารของ[FROM.GetAdjective]ครอบคลุมและละเอียดถี่ถวน ชาว[FROM.GetAdjective]จะเปดและขุดสายแรที่พวกเขาคนพบ แลวมอบผลผลิตสวนใหญใหเรา ขณะที่นําสวนหนึ่งไปยัง[354.GetName]เพื่อใชเอง เราคงไมสามารถคนพบสิ่งที่ชาว[FROM.GetAdjective]พบไดอีกหลายป แตเราสามารถใชแผนที่สงมาใหปรับปรุงกระบวนการขุดแรในจอรเจียไดเอง แมจะไดผลผลิตนอยกวา โดยไมตองพึ่งความชวยเหลือจาก[FROM.GetAdjective] การตัดสินใจวาจะทําเองหรือรับขอเสนอความชวยเหลือจากรัฐบาล[FROM.GetAdjective]นั้นขึ้นอยูกับเรา"
 bftb_turkey.38.a: "มารวมมือกันเพื่อประโยชนของทั้งสองฝาย"
 bftb_turkey.38.b: "พวกเขาโงที่คิดวาเราจะยอมใหมากาวกายในเขตแดนของเรา"
 bftb_turkey.39.t: "[FROM.GetNameDefCap]ยอมรับขอเสนอของเรา"
 bftb_turkey.39.desc: "เจาหนาที่[TUR.GetAdjective]ตางชื่นชมผลงานของตนเอง เมื่อรัฐบาล[FROM.GetAdjective]เพิ่งแจงเราวาตองการดําเนินแผนรวมกันขุดโลหะในจอรเจียตามที่วางไวในแถลงการณอันซับซอนที่เรานําเสนอ \n\nกลไกของรัฐกําลังถูกระดมแลว เพื่อวาเมื่อขุดพบแรในจอรเจีย ก็จะเตรียมขนสงไปยัง[354.GetName]ไดทันทีเพื่อถลุงไวใชเอง"
 bftb_turkey.39.a: "ชัยชนะทางการทูต!"
 bftb_turkey.40.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา!"
 bftb_turkey.40.desc: "มีรายงานวาเจาหนาที่[FROM.GetAdjective]แสดงทาทีไมอยากเชื่อตอขอเสนอของเราที่จะทําเหมืองในจอรเจียโดยไดรับอนุญาตจากรัฐบาล[FROM.GetAdjective] คําขอของเราถูกหัวเราะเยาะ และที่นาดูหมิ่นยิ่งกวา ชาว[FROM.GetAdjective]กําลังใชแผนบางสวนที่เราสงไปพรอมเอกสาร เพื่อขุดแรที่เราคนพบโดยไมมีเรา"
 bftb_turkey.40.a: "ไอพวกสารเลว!"
 bftb_turkey.41.t: "[FROM.GetNameDefCap]เชิญเราเขารวม[FROM.GetFactionName]"
 bftb_turkey.41.desc: "[FROM.GetLeader] ประธานาธิบดีแหง[FROM.GetNameDef] ไดริเริ่มโครงการปฏิรูปกติกาสัญญาบอลขานอยางเปนทางการใหเปนพันธมิตรทางยุทธศาสตรที่กวางขวางและครอบคลุมยิ่งขึ้น เรียกวาความตกลงไตรภาคีบอลขาน (Balkan Entente) สมาชิกทุกประเทศของกติกาสัญญาบอลขานไดรับเชิญใหเขารวม[FROM.GetFactionName] รวมถึงเราดวย \n\nเจาหนาที่จาก[FROM.GetNameDef]ยืนยันวาความสัมพันธระหวางชาติตาง ๆ ใน[FROM.GetFactionName]จะไปไกลกวาเรื่องทางทหารลวน ๆ และไดออกสรุปแผนการพัฒนาระบบการเงิน ยุทธศาสตรการปองกัน และอื่น ๆ รวมกันแลว"
 bftb_turkey.41.a: "เมื่อรวมเปนหนึ่ง เราจะปกปองคาบสมุทรบอลขานได"
 bftb_turkey.41.b: "โครงการนี้เปนภาพลวงตาอันบาบิ่นที่เกิดจากลัทธิคลั่งชาติของ[FROM.GetAdjective]"
 bftb_turkey.42.t: "[FROM.GetNameDefCap]เขารวม[ROOT.GetFactionName]!"
 bftb_turkey.42.desc: "[FROM.GetLeader]ประกาศวา[FROM.GetNameDef]ตัดสินใจใหสัตยาบันและเขารวม[ROOT.GetFactionName]แลว มีการเฉลิมฉลองอยางเอิกเกริกและงานฉลองระดับชาติติดตอกันสองครั้ง เพื่อรําลึกถึงการผูกชะตากรรมของสองชาติเขาดวยกันเมื่อความขัดแยงปะทุขึ้นอยางหลีกเลี่ยงไมได"
 bftb_turkey.42.a: "เราจะรวมกันกอบกูคาบสมุทรบอลขาน"
 bftb_turkey.43.t: "[FROM.GetNameDefCap]ปฏิเสธคําเชิญเขารวม[ROOT.GetFactionName]!"
 bftb_turkey.43.desc: "[FROM.GetLeader]เปดเผยกับเราวา[FROM.GetNameDef]จะไมเขารวม[ROOT.GetFactionName] ความผิดหวังของนักการทูตและเจาหนาที่รัฐบาลของเรานั้นยากจะประมาณได และการที่[FROM.GetNameDefCap]ออกจากกติกาสัญญาบอลขานและปฏิเสธ[ROOT.GetFactionName]ไดทําใหโครงการทั้งหมดตกอยูในอันตราย"
 bftb_turkey.43.a: "ความสามัคคีอาจชวยเราไวได แตความแตกแยกกลับอาจทําลายเรา"
 bftb_turkey.44.t: "ขอเสนอเปตรา"
 bftb_turkey.44.desc: "เราไดรับแผนการปองกันจาก[FROM.GetNameDef] ซึ่งเสนอใหรัฐบาล[FROM.GetAdjective]รับผิดชอบปกปองดินแดนของเราในลิแวนตแทน [FROM.GetLeader]โตแยงวาที่ตั้งทางภูมิศาสตรที่ใกลชิดของ[FROM.GetNameDef]ทําใหการปองกันและปกครองดินแดนเหลานี้เปนเรื่องงาย และการยกดินแดนเหลานี้ให[FROM.GetNameDef]จะชวยใหเราโยกยายทรัพยากรไปใชที่อื่นได \n\nขอเสนอนี้ก็มีเหตุผลอยูบาง แตมันทําใหเราอยูในสถานะที่... นาสนใจ เรายึดปาเลสไตน จอรแดน และคาบสมุทรไซนายมาจากจักรวรรดิออตโตมันผูพายแพ: เราพรอมจะคืนมันใหชาว[FROM.GetAdjective]ผูสืบทอดจักรวรรดิออตโตมันหรือไม? นอกจากเรื่องทางประวัติศาสตรแลว เรายังควรพิจารณาดวยวารัฐบาล[FROM.GetAdjective]อาจตอบสนองอยางไรหากเราปฏิเสธ พวกเขาอาจตีความการปฏิเสธวาเราไมไวใจพวกเขา หรือไมเห็นคุณคาของบทบาทพวกเขาในพันธมิตรนี้ [FROM.GetNameDefCap]เคยแสดงใหเห็นวาคาดเดาไมไดมาแลว และนาเสียดายที่เราไมอาจเชื่อใจไดวาทางการ[FROM.GetAdjective]จะไมยกระดับเรื่องนี้หากเราปฏิเสธ"
 bftb_turkey.44.a: "แผนนี้สมเหตุสมผลในทางยุทธศาสตร!"
 bftb_turkey.44.b: "จักรวรรดิออตโตมันลมสลายไปก็ดวยเหตุผล"
 bftb_turkey.45.t: "ชาว[FROM.GetAdjective]ยินยอมตามขอเสนอเปตรา"
 bftb_turkey.45.desc: "เจาหนาที่อาณานิคม[FROM.GetAdjective]กําลังทยอยออกจากตําแหนงและยายไปยังดินแดนในอารักขาที่อยูใกลเคียง เพื่อใหเรารับชวงอดีตอาณานิคมของ[FROM.GetAdjective]ไดอยางราบรื่น [FROM.GetLeader]เขียนจดหมายถึงประธานาธิบดีของเรา ชี้แจงวา[FROM.GetNameDef]เชื่อมั่นเต็มที่ในความสามารถของ[ROOT.GetNameDef]ในการปกปองและปกครองจังหวัดที่ยกใหเรา \n\nพลเมือง[ROOT.GetAdjective]จํานวนมากมองวาการโอนดินแดนครั้งนี้เปนชัยชนะครั้งยิ่งใหญ และเปนการยืนยันวา[ROOT.GetNameDef]กลับมาเปนมหาอํานาจระดับภูมิภาคที่ไดรับความเคารพไปทั่วโลกอีกครั้ง"
 bftb_turkey.45.a: "ตอนนี้เราอยูในลีกใหญแลว"
 bftb_turkey.46.t: "ชาว[FROM.GetAdjective]ปฏิเสธขอเสนอเปตรา"
 bftb_turkey.46.desc: "[FROM.GetLeader] นายกรัฐมนตรีแหง[FROM.GetNameDef] กลาววาการยกดินแดน[FROM.GetAdjective]ในลิแวนตให[ROOT.GetNameDef]เปนสิ่งที่คิดไมได และเตือนวาดวยความรอบคอบ[FROM.GetAdjective]จําเปนตองปกครองภูมิภาคนี้ตอไป กองกําลัง[FROM.GetAdjective]ในลิแวนตถึงกับถูกสั่งใหเตรียมพรอม เพื่อใหสามารถสกัดการรุกลํ้าที่ไมคาดคิดของ[ROOT.GetAdjective]ไดอยางรวดเร็ว \n\nเปนการสวนตัว เจาหนาที่รัฐบาลของเราหลายคนแสดงความผิดหวังตอการตัดสินใจของ[FROM.GetAdjective] โดยยกการปฏิเสธขอเสนอเปนหลักฐานวาชาว[FROM.GetAdjective]ไมไวใจเราในฐานะพันธมิตร [ROOT.GetLeader]ก็แสดงความไมพอใจตอการตัดสินใจของ[FROM.GetAdjective]เชนกัน และขอใหที่ปรึกษาเสนอทางเลือกในการตอบโต"
 bftb_turkey.46.a: "เราพยายามแลวแตลมเหลว ไมมีอะไรที่เราทําไดอีก"
 bftb_turkey.46.b: "เราจะยกระดับเรื่องนี้!"
 bftb_turkey.47.t: "[FROM.GetNameDefCap]แสดงความกังวลเรื่องการปองกันอาว"
 bftb_turkey.47.desc: "[FROM.GetLeader] ประธานาธิบดีแหง[FROM.GetNameDef] ติดตอเราดวยความกังวลเรื่องความมั่นคงของอาณานิคมของเราในอาวตาง ๆ ของอาระเบีย ผูนํา[FROM.GetAdjective]เสนอวา[FROM.GetNameDef]ควรรับผิดชอบการปองกันและการปกครองทั้งภูมิภาคแทน เนื่องจาก[FROM.GetNameDef]มีประวัติศาสตรรวมและอยูใกลภูมิภาคนี้ \n\nเจาหนาที่[ROOT.GetAdjective]บางคนแสดงความตื่นตระหนกตอขอเสนอนี้ เนื่องจาก[FROM.GetNameDef]เพิ่งยื่นขอควบคุมภูมิภาคลิแวนตไปเมื่อไมนานมานี้ นักวิเคราะหกังวลวาการฮุบดินแดนทางการทูตเหลานี้ถูกวางแผนอยางมีกลยุทธโดย[FROM.GetNameDef] เพื่อสรางสถานะใหมในภูมิภาคที่[FROM.GetNameDef]เปนมหาอํานาจที่ไมมีใครทาทายไดเหนืออนุทวีปทั้งหมด ไมวาจะมีความกังวลในอนาคตอยางไร [FROM.GetNameDef]ก็ยังเปนพันธมิตรของเรา และหากเราตองการใหเปนเชนนั้นตอไป ก็อาจเปนการดีที่จะยอมตามคําขอควบคุมอาณานิคมในอาระเบียของเรา"
 bftb_turkey.47.a: "มาดูกันวา[FROM.GetNameDef]พรอมรับผิดชอบหรือไม"
 bftb_turkey.47.b: "ลัทธิอาณานิคมใหมนี้ไมอาจและจะไมไดรับการยอมรับ"
 bftb_turkey.48.t: "ชาว[FROM.GetAdjective]ไววางใจใหเราปองกันอาว"
 bftb_turkey.48.desc: "เรือลําเลียงสําหรับกองรักษาการณและเจาหนาที่ปกครองของเรากําลังเตรียมพรอม เพื่อสงไปยังดินแดนใหมของเราในอาวทั้งสองแหงอาระเบียทันที ชาว[FROM.GetAdjective]ไดสละอํานาจเหนือภูมิภาคนี้และมอบอธิปไตยเหนือดินแดนเหลานี้ใหเราปกปองและปกครอง"
 bftb_turkey.48.a: "ตอนนี้เราเปนมหาอํานาจอยางแทจริงแลว"
 bftb_turkey.49.t: "ชาว[FROM.GetAdjective]ไมยอมยกดินแดนในอาระเบียใหเรา"
 bftb_turkey.49.desc: "เอกอัครราชทูต[FROM.GetAdjective]เรียกแผนการของ[ROOT.GetAdjective]ตอดินแดน[FROM.GetAdjective]ในอาระเบียวา 'ยอมรับไมได' และเรียกรองใหยุติเรื่องนี้ทันที ผูเชี่ยวชาญดานการปองกันของเราผิดหวังที่ไมไดรับสิทธิ์ปกครองดินแดนอาระเบียของ[FROM.GetAdjective] แตเจาหนาที่[FROM.GetAdjective]ยืนยันวาตราบใดที่[ROOT.GetNameDef]ยังเปนสวนหนึ่งของ[FROM.GetFactionName] เราจะยังคงมีเอกสิทธิ์ในการเทียบทาและตั้งฐานทัพในดินแดนเหลานั้น"
 bftb_turkey.49.a: "นาเสียดาย"
 bftb_turkey.50.t: "[FROM.GetNameDefCap]ขอซื้อรถถังเบา"
 bftb_turkey.50.desc: "เจาหนาที่จาก[FROM.GetNameDef]เขาหาเราพรอมแสดงความประสงคจะซื้อรถถังเบาจากคลังของเรา เจาหนาที่[FROM.GetAdjective]แสดงความทึ่งในสิ่งที่พวกเขาเรียกวา 'อัจฉริยภาพของ[ROOT.GetAdjective]' และ 'ความเปนเลิศดานการออกแบบ' และแจงเราวา[FROM.GetNameDef]จําเปนตองมียานเกราะของ[ROOT.GetAdjective]เพื่อปกปองอธิปไตยของตนเอง"
 bftb_turkey.50.a: "เราจะสงรุนที่ดีที่สุดบางสวนไปให!"
 bftb_turkey.50.b: "สงยานเกราะรุนมาตรฐานของเราไปบางสวน"
 bftb_turkey.50.c: "พวกเขาเอารุนเกาของเราไปไดบาง"
 bftb_turkey.50.d: "[FROM.GetNameDefCap]จะไมไดอะไรจากเราเลยแมแตนอย"
 bftb_turkey.51.t: "[FROM.GetNameDefCap]สงรถถังเบารุนปรับปรุงมาให!"
 bftb_turkey.51.desc: "เราเพิ่งไดรับรถถัง[FROM.GetAdjective]ชุดหนึ่งที่สงตรงมาจากคลังของพวกเขา! ยานเกราะเหลานี้ทันสมัย และการทดสอบเบื้องตนแสดงใหเห็นวาใชงานไดหลากหลายมาก พวกมันจะรับใชกองทัพของเราไดดีอยางไมตองสงสัย"
 bftb_turkey.51.a: "ชางเปนความประหลาดใจที่คาดไมถึง!"
 bftb_turkey.52.t: "[FROM.GetNameDefCap]สงรถถังเบามาให"
 bftb_turkey.52.desc: "เราเพิ่งไดรับรถถัง[FROM.GetAdjective]ชุดหนึ่งที่สงตรงมาจากคลังของพวกเขา! ยานเกราะเบาเหลานี้ลาสมัยไปบาง แตจากการทดสอบคุณภาพของเราก็ยังคอนขางทนทาน พวกมันจะรับใชกองทัพของเราไดดีอยางไมตองสงสัย"
 bftb_turkey.52.a: "ประโยชนอันยิ่งใหญ"
 bftb_turkey.53.t: "[FROM.GetNameDefCap]มอบยานเกราะลาสมัยให"
 bftb_turkey.53.desc: "เราเพิ่งไดรับรถถัง[FROM.GetAdjective]ชุดหนึ่งที่สงตรงมาจากคลังของพวกเขา! ยานเกราะเหลานี้ลาสมัยอยางไมตองสงสัย และชาว[FROM.GetAdjective]นาจะปลดประจําการรุนนี้ไปแลวเพราะขอบกพรองมากมาย อยางไรก็ตาม กองทัพของเราจะหาทางใชประโยชนจากมันจนได... สักทางหนึ่ง"
 bftb_turkey.53.a: "ถามันดีพอสําหรับป 1922 ก็ดีพอสําหรับตอนนี้!"
 bftb_turkey.54.t: "[FROM.GetNameDefCap]ไมสงอะไรมาใหเราเลย"
 bftb_turkey.54.desc: "ชาว[FROM.GetAdjective]ปฏิเสธที่จะสงแมแตโครงรถจากรุนที่เกาที่สุดมาใหเรา ดูเหมือนยานเกราะของ[FROM.GetAdjective]จะมีไวให[FROM.GetAdjective]ใชเทานั้น และมีรายงานวาบุคคลสําคัญใน[FROM.GetNameDef]อางเหตุผลดานความมั่นคงของชาติในการไมจัดหายานเกราะใด ๆ ใหเรา"
 bftb_turkey.54.a: "ยังไงรถถังพวกนั้นก็คงพังอยูดี"
 bftb_turkey.55.t: "สัมปทานเชสเตอร"
 bftb_turkey.55.desc: "ในป 1923 สาธารณรัฐตุรกีที่เพิ่งกอตั้งไดใหสัตยาบันและอนุมัติกฎหมายฉบับหนึ่งที่อนุญาตใหเราพัฒนาแหลงนํ้ามันและทางรถไฟของ[FROM.GetNameDef] วุฒิสภาสหรัฐอเมริกาซึ่งคํานึงถึงผลกระทบที่ภาวะเศรษฐกิจตกตํ่าครั้งใหญมีตอเศรษฐกิจอเมริกัน ตัดสินใจไมใหสัตยาบันสนธิสัญญานั้น บัดนี้[FROM.GetNameDef]ไดกลับคําการยกเลิกสนธิสัญญา และขอใหเราปฏิบัติตามเงื่อนไขของสัมปทานที่เรารางขึ้นเองแตแรกอีกครั้ง \n\nปฏิเสธไมไดวาในทางเศรษฐกิจ เราอยูในสถานะที่มั่นคงกวาป 1923 มาก และจะเปนประโยชนอยางยิ่งหากได[FROM.GetNameDef]มาเปนฝายเดียวกับเราทั้งทางอุดมการณและการทหาร อยางไรก็ตาม สงครามกําลังคุกคามไปทั่วโลก และแมจะอยูในสถานะที่แข็งแกรง เราก็ตองใชทรัพยากรอยางประหยัด การมีนํ้ามันใน[FROM.GetNameDef]อาจมีคามากในอนาคตในฐานะเครื่องตอรองกับ[SOV.GetNameDef] แตในระยะสั้นเราตองพิจารณาดวยวาปโตรเลียมที่ขุดขึ้นมาอาจตกไปอยูในมือศัตรู อาจเปนการดีที่จะใชความตองการความชวยเหลือของ[FROM.GetAdjective]เปนเครื่องตอรองเพื่อเปาหมายของเราเอง [FROM.GetNameDef]มีโครเมียมมาก ขณะที่ชาติเรานาเสียดายที่ไมมี การตัดสินใจอยูที่เรา"
 bftb_turkey.55.a: "เราจะชวยเหลือมิตรของประชาธิปไตยทุกคน"
 bftb_turkey.55.b: "เราจะชวยพวกเขา... แบบมีเงื่อนไข"
 bftb_turkey.56.t: "[FROM.GetNameDefCap]ใหสัมปทานโดยไมมีเงื่อนไข"
 bftb_turkey.56.desc: "[FROM.GetNameDefCap]ตกลงที่จะทําตามพันธะที่สัญญาไวกับเราเมื่อกวาสิบปกอนโดยไมเรียกรองคาตอบแทน พวกเขาใชเทคโนโลยีที่เหนือกวาและทรัพยากรทางอุตสาหกรรมที่กวางขวางขุดปโตรเลียมใน[350.GetName]ซึ่งกอนหนานี้เราไมสามารถขุดขึ้นมาไดอยางมั่นคง ชาว[FROM.GetAdjective]ยังทิ้งอุตสาหกรรมบางสวนที่ใชขุดนํ้ามันไวใหเรานําไปปรับใชตามดุลยพินิจ เพื่อทําตามสวนอื่น ๆ ของสัมปทาน \n\nเพื่อแสดงมิตรภาพเพิ่มเติม ชาว[FROM.GetAdjective]ยังมอบเทคนิคและอุปกรณบางสวนที่ใชในกระบวนการขุดใหเรา เพื่อใหเราใชประโยชนจากทรัพยากรธรรมชาติทั่วประเทศไดดียิ่งขึ้น"
 bftb_turkey.56.a: "ชาว[FROM.GetAdjective]นี่ดีที่สุดจริง ๆ"
 bftb_turkey.57.t: "ชาว[FROM.GetAdjective]ตั้งเงื่อนไขสําหรับสัมปทาน"
 bftb_turkey.57.desc: "[FROM.GetNameDefCap]ตกลงที่จะทําตามพันธะที่สัญญาไวกับเราเมื่อกวาสิบปกอน แตตองแลกกับคาตอบแทน พวกเขายินดีใชเทคโนโลยีที่เหนือกวาและทรัพยากรทางอุตสาหกรรมที่กวางขวางขุดปโตรเลียมใน[350.GetName]ซึ่งเราไมสามารถขุดขึ้นมาไดอยางมั่นคง แตในทางกลับกัน ชาว[FROM.GetAdjective]ตองการสิทธิ์ในทรัพยากรแตเพียงผูเดียวใน[343.GetName] เพื่อใหขอตกลงนาสนใจขึ้น ชาว[FROM.GetAdjective]แสดงความยินดีที่จะสอนเทคนิคการขุดขั้นสูงบางอยางและมอบแบบพิมพเขียวของเครื่องมือขุดที่ซับซอนบางชิ้นใหเรา \n\nการขอสัมปทานก็นาอับอายพอแลว แตนี่อาจเกินกวาจะรับได ชาติของเราควรเปนตัวแทนของผลแหงการตอตานจักรวรรดินิยมและลัทธิอาณานิคม หากเรายอมตามขอเรียกรองของ[FROM.GetAdjective] เราก็จะทรยศตอคุณคาของเราเอง ถึงกระนั้น เราจะปฏิเสธประโยชนที่[FROM.GetNameDef]เสนอใหไดหรือ?"
 bftb_turkey.57.a: "ก็ได ใหไอพวกจักรวรรดินิยมไดสิ่งที่ตองการไป"
 bftb_turkey.57.b: "เราจะไมมีวันยอมอยูใตอาณัติของ[FROM.GetAdjective]!"
 bftb_turkey.58.t: "[FROM.GetNameDefCap]ทําตามขอเรียกรองของเรา"
 bftb_turkey.58.desc: "รัฐบาล[FROM.GetAdjective]ยอมตามขอเรียกรองของเราทุกขอเพื่อแลกกับความชวยเหลือ โครเมียมเริ่มเขามาถึงทาเรือของเราจาก[343.GetName]แลว และที่ดียิ่งกวานั้น เรายังไดเรียนรูอะไรหลายอยางจากความพยายามขุดนํ้ามันทางตะวันออกของ[FROM.GetName]"
 bftb_turkey.58.a: "ชางดีจริง ๆ ที่ไดเปนชาว[FROM.GetAdjective]"
 bftb_turkey.59.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา!"
 bftb_turkey.59.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธเงื่อนไขอันยุติธรรมยิ่งที่เราตั้งไวเพื่อแลกกับความชวยเหลือ หากรัฐบาล[FROM.GetAdjective]ยอมลงขันในสวนที่ยุติธรรมของตน ทุกฝายก็คงไดเปนผูชนะ แตกลับกลายเปนวาพวกเขาตองรออีกหลายปกวาจะไดขุดพบทองคําดํานั้น"
 bftb_turkey.59.a: "เราคือ[ROOT.GetNameDef] เรายังคงเดินจากไปอยางผูชนะ"
 bftb_turkey.60.t: "[FROM.GetName]กดดันเรื่องฮาทาย"
 bftb_turkey.60.desc: "[FROM.GetLeader]เขียนจดหมายดวยถอยคํารุนแรง เรียกรองใหประชากรชาวเติรกในรัฐฮาทายของซีเรียไดใชสิทธิ์ตามระบอบประชาธิปไตยในการลงประชามติ เพื่อใหประชาชนฮาทายตัดสินใจวาจะเขารวมกับ[FROM.GetNameDef]หรือจะอยูเปนสวนหนึ่งของ[ROOT.GetNameDef]ตอไปอยางไมมีกําหนด กองทัพของเราตรวจพบกิจกรรมผิดกฎหมายที่ชายแดน[ROOT.GetAdjective]-[FROM.GetAdjective] โดยมีพลเมือง[FROM.GetAdjective]ขามแดนเขามากอความวุนวายในจังหวัดฮาทาย เห็นไดชัดวา[FROM.GetNameDef]ตั้งใจจะโกงผลประชามติเพื่อให[FROM.GetAdjective]ชนะ แตบางทีการยกจังหวัดฮาทายให[FROM.GetNameDef]ไปเลยอาจเปนทางที่ฉลาดที่สุด การมี[FROM.GetNameDef]ที่กาวราวอยูติดชายแดนไมใชสถานการณที่ดีนัก"
 bftb_turkey.60.a: "เรามีทางเลือกอะไรละ?"
 bftb_turkey.60.b: "ถาพวกเขาอยากไดฮาทาย ก็มาเอาไปดวยวิธียากเถอะ"
 bftb_turkey.61.t: "[FROM.GetNameDef]ยกอธิปไตยเหนือฮาทายใหเรา"
 bftb_turkey.61.desc: "[ROOT.GetLeader]กลาวสุนทรพจนสั้น ๆ ในอันตาเกีย ตอนรับพลเมืองฮาทายสู[ROOT.GetNameDef] และขอบคุณ[FROM.GetLeader]แหง[FROM.GetNameDef]ที่เคารพเจตจํานงประชาธิปไตยของประชาชนฮาทาย แมการเคลื่อนไหวนี้จะสรางความโกรธเกรี้ยวแกเจาหนาที่ซีเรียจํานวนมากจากทุกขั้วการเมือง แตบรรยากาศโดยรวมในฮาทายและทั่ว[ROOT.GetNameDef]เต็มไปดวยความพึงพอใจ และชาว[ROOT.GetAdjective]จํานวนมากเดินทางจากบานลงไปยังฮาทายเพื่อรวมเฉลิมฉลองและแลกเปลี่ยนของขวัญ เปนการรับขวัญจังหวัดใหมลาสุดของ[ROOT.GetNameDef] [FROM.GetLeader]ยังคงเงียบในเรื่องนี้ แตแหลงขาวใกลชิดผูนํา[FROM.GetAdjective]เผยวาผูนํา[FROM.GetAdjective]เชื่อวานี่เปนเพียงสถานการณชั่วคราว และไมทางใดก็ทางหนึ่ง ฮาทายจะกลับไปอยูในกํามือของพวกเขาในอนาคต"
 bftb_turkey.61.a: "ยินดีตอนรับกลับสูออมอก พี่นองทั้งหลาย"
 bftb_turkey.62.t: "[FROM.GetName]ยังคงควบคุมฮาทายอยางเหนียวแนน"
 bftb_turkey.62.desc: "[ROOT.GetLeader]นําการชุมนุมอันดุเดือดในกาซีอันเทป ประณามการกดขี่ชาวเติรกในตางแดนโดย[FROM.GetNameDef] ประชาชน[ROOT.GetAdjective]ถูกปลุกเราจนเดือดดาล และที่ปรึกษาเผยวาประชาชน[ROOT.GetAdjective]บางสวนกระตือรือรนที่จะใชสงครามเปนหนทางแกไขสถานการณอันไมเปนธรรมนี้ การที่[FROM.GetNameDef]คิดวาจะขัดขืนเจตจํานงของเราไดนั้นโงเขลาอยางยิ่ง - [ROOT.GetNameDef]จะไมมีวันยอมใหมหาอํานาจที่ดอยกวามารังแก"
 bftb_turkey.62.a: "[FROM.GetNameDef]จะตองพินาศ"
 bftb_turkey.63.t: "[FROM.GetNameDefCap]เชิญเราเขารวม[FROM.GetFactionName]"
 bftb_turkey.63.desc: "[FROM.GetLeader]พบกับ[ROOT.GetLeader]เมื่อวันกอนเพื่อเจรจาพันธมิตรครอบคลุมทั่วเมดิเตอรเรเนียน ที่มีจุดยืนรวมกันในวิกฤตที่ตองใชกําลังทหารเขาแทรกแซง มีขอโตแยงวาการที่[FROM.GetNameDef]สมัครใจผูกพันกับเราในพันธมิตรอาจเพิ่มความชอบธรรมใหเปาหมายระดับภูมิภาคของเรา แมจะหมายความวาเราตองปฏิเสธการสนับสนุนจากมหาอํานาจที่ใหญกวาก็ตาม เราควรพิจารณาดวยวา ตางจากเรา [FROM.GetNameDef]มีชื่อเสียงคอนขางดีในหมูชาติบอลขานและเมดิเตอรเรเนียน พวกเขาอาจใชชื่อเสียงนั้นชวยดึงการสนับสนุนทางการทูตจากชาติที่ไมเชนนั้นคงไมอยากเกี่ยวของกับเราเลย \n\nเราอยูที่ทางแยก: เราจะรับกิ่งมะกอกที่[FROM.GetNameDef]ยื่นมาให และใชปากกาของพวกเขาลับดาบของเราเพื่อตอกรกับมหาอํานาจอื่น หรือเราจะยื่นมือไปหาพวกทิวทันผูนารังเกียจ แลวโคนมหาอํานาจเล็ก ๆ ที่ยื่นมือมาหาเราเหลานี้เหมือนถอนวัชพืชในสวน? เราเทานั้นที่มีอํานาจกําหนดชะตากรรมของชาติบอลขาน - เราจะชวยพวกเขาใหพนจากการครอบงําของ[GER.GetAdjective]และ[SOV.GetAdjective] หรือจะชวยมหาอํานาจเหลานั้นเรงความพินาศของเพื่อนบานเรา การตัดสินใจอยูที่เรา"
 bftb_turkey.63.a: "เรายังไถโทษตัวเองไดดวยการชวยผูอื่น"
 bftb_turkey.63.b: "โลกนี้เย็นชาและไรปรานี และเราก็เชนกัน"
 bftb_turkey.64.t: "[FROM.GetNameDefCap]เขารวม[ROOT.GetFactionName]"
 bftb_turkey.64.desc: "[FROM.GetLeader]ประกาศตอประชาชาติอยางโออาในพิธีอันยิ่งใหญเอิกเกริกวา จิตวิญญาณและชะตากรรมของ[FROM.GetNameDef]บัดนี้ผูกพันกับ[ROOT.GetNameDef]แลว [ROOT.GetLeader]ก็ประกาศในทํานองเดียวกัน แตดวยถอยคําที่สุขุมกวามาก \n\nเจาหนาที่[ROOT.GetAdjective]หวังวาการดึง[FROM.GetNameDef]มาเปนฝายเดียวกันจะชวยควบคุมแนวโนมขยายดินแดนของพวกเขาไวได และใชสถานะมหาอํานาจของพวกเขาปกปองชาติเล็ก ๆ ในเมดิเตอรเรเนียนจากอํานาจครอบงําที่ตองการกลืนกินพวกเขาทั้งหมดแทน"
 bftb_turkey.64.a: "เราตองเรงดึงชาติอื่น ๆ เขารวมกติกาสัญญานี้"
 bftb_turkey.65.t: "[FROM.GetNameDefCap]ปฏิเสธการเปนสมาชิก[ROOT.GetFactionName]"
 bftb_turkey.65.desc: "เราไดรับขาววา[FROM.GetNameDef]จะไมเขารวม[ROOT.GetFactionName] เจาหนาที่[ROOT.GetAdjective]ผิดหวังและกังวลไมนอยวาเรื่องนี้อาจเปนลางบอกเหตุอะไรสําหรับอนาคตของเมดิเตอรเรเนียน [ROOT.GetLeader]เรงเราเจาหนาที่รัฐบาลเปนการสวนตัวใหเรงกระบวนการดึงสมาชิกเขาพันธมิตรเพิ่มขึ้น เพื่อจัดตั้งกลุมที่แข็งแกรงพอจะตานลัทธิทวงคืนดินแดนของ[FROM.GetAdjective]ที่อาจเกิดขึ้น"
 bftb_turkey.65.a: "เราตองเรงดึงชาติอื่น ๆ เขารวมกติกาสัญญานี้"
 bftb_turkey.66.t: "[FROM.GetNameDefCap]เสนอแผนแบงแยก[GRE.GetNameDef]"
 bftb_turkey.66.desc: "[FROM.GetNameDefCap]เสนอวาแมแนวทางนี้จะนาเสียใจ แตดวยเหตุผลดานความมั่นคงของชาติ [GRE.GetNameDef]จะตองถูกทําลาย เจาหนาที่ของเราเห็นดวยกับความเห็นของพันธมิตร[FROM.GetAdjective]อยางกระตือรือรนและสุดหัวใจ พรอมเตือนพวกเขาวานี่คือจุดยืนอยางเปนทางการของเรามาตั้งแตแรก \n\n[FROM.GetNameDefCap]เสนอใหแบง[GRE.GetNameDef]ตามหลักภูมิศาสตร: เราจะได[185.GetName] [186.GetName] และ[182.GetName] ซึ่งจะทําใหเราครองความเปนใหญเหนือทะเลเมดิเตอรเรเนียนตะวันออกและทะเลไอโอเนียน [FROM.GetNameDefCap]จะไดรัฐ[GRE.GetAdjective]ที่เหลือ ซึ่งจะรับประกันการควบคุมทะเลอีเจียนของ[FROM.GetAdjective] ที่หลายรัฐของพวกเขามีพรมแดนติดอยูแลว \n\nขอตกลงนี้โดยรวมแลวยุติธรรม - อยางนอยก็ยุติธรรมกวาที่เราจะคาดหวังไดจากการแยงชิงดินแดนแบบไรกติกา ถึงกระนั้น เราใฝฝนมานานที่จะได[47.Capital.GetName]มาเปนมงกุฎเพชรของจักรวรรดิเรา และแผนนี้ยอมยุติความทะเยอทะยานนั้นไปอีกนาน เราพรอมจะสละรางวัลอยาง[47.Capital.GetName]เพื่อสันติภาพในเมดิเตอรเรเนียนหรือไม?"
 bftb_turkey.66.a: "ขอตกลงที่ยุติธรรมและเปนที่พอใจเรื่องอนาคตของ[GRE.GetNameDef]"
 bftb_turkey.66.b: "เราตองไดทั้งหมด!"
 bftb_turkey.67.t: "รัฐประหารจัตุรัสทองคํา"
 bftb_turkey.67.desc: "ขาวนาตกใจจาก[676.GetName] เมื่ออดีตนายกรัฐมนตรีรอชีด อาลี อัลกัยลานี พยายามกอรัฐประหารตอรัฐบาลของ[ROOT.GetLeader] อัลกัยลานีไดรับการสนับสนุนจากกองทัพสวนใหญและแมแตจากประชาชนบางสวน \n\nเชื่อกันอยางยิ่งวาการแทรกแซงจากตางชาติมีบทบาทสําคัญในการจัดตั้งและสงอาวุธใหพวกทรยศจัตุรัสทองคํา ในบรรดารัฐที่อาจเกี่ยวของทั้งหมด เชื่อกันวา[FROM.GetNameDef]มีบทบาทสําคัญที่สุดในการสนับสนุนความพยายามรัฐประหารของฝายฟาสซิสต \n\nจัตุรัสทองคํายืนหยัดในนโยบายขับไลพวกจักรวรรดินิยม[ENG.GetAdjective]ดวยกําลังโดยขอความชวยเหลือจาก[GER.GetNameDef] และประชาชนของเราจํานวนมากเห็นวานี่เปนจุดยืนที่นายกยองอยางยิ่ง บางทีอาระเบียที่เสรีอาจเปนไปไดดวยลัทธิฟาสซิสตเทานั้น..."
 bftb_turkey.67.a: "มาชาอัลลอฮ เราจะตอสูเพื่อจิตวิญญาณของอิรักตานลัทธิฟาสซิสต!"
 bftb_turkey.67.b: "มีเพียงลัทธิฟาสซิสตที่จะปลดปลอยเราได"
 bftb_turkey.67.c: "กวาดลางพวกฟาสซิสตสวะใหกระเจิง"
 bftb_turkey.68.t: "สงครามกลางเมือง[IRQ.GetAdjective]เริ่มตนขึ้น"
 bftb_turkey.68.desc: "ความพยายามยุยงใหเกิดรัฐประหารฝายฟาสซิสตใน[IRQ.GetNameDef]ของเราดูเหมือนจะไดผลงดงาม ขณะนี้ฝายฟาสซิสต[IRQ.GetAdjective]กําลังสูรบกับรัฐบาลเดิมเพื่อแยงชิงอํานาจควบคุมทั้งประเทศ และไมวาแพหรือชนะ เราจะอยูในตําแหนงที่ไดเปรียบในการสถาปนาอํานาจควบคุมเหนือภูมิภาคอยางมั่นคง"
 bftb_turkey.68.a: "ตอนนี้ เรานั่งรอไปกอน"
 bftb_turkey.69.t: "ฝายฟาสซิสต[IRQ.GetAdjective]มีชัย"
 bftb_turkey.69.desc: "ฝายฟาสซิสต[IRQ.GetAdjective]กวาดลางกลุมผูจงรักภักดี[IRQ.GetAdjective]กลุมสุดทายไดสําเร็จตามที่เราคาดไว พวกเขาจะออนแอเกินกวาจะตานเราไดเมื่อเราบุกเขาไปยึดกลไกรัฐของพวกเขา"
 bftb_turkey.69.a: "ชางแยบยลแบบมาเคียเวลลีเสียจริง!"
 bftb_turkey.70.t: "ฝายฟาสซิสต[IRQ.GetAdjective]ลมเหลว"
 bftb_turkey.70.desc: "ฝายฟาสซิสต[IRQ.GetAdjective]ลมเหลวในการขับไลกลุมผูจงรักภักดี[IRQ.GetAdjective] และกลับถูกกองทัพ[IRQ.GetAdjective]บดขยี้ นี่เปนเรื่องนาโกรธแคนอยางยิ่ง แตตามแผนแลว นักยุทธศาสตรของเราเชื่อวา[IRQ.GetNameDef]จะออนแอเกินกวาจะตานเราไดเมื่อกองกําลังของเราบุกเขาไปยึดกลไกรัฐของพวกเขา"
 bftb_turkey.70.a: "เกมนี้ถูกจัดฉากไวตั้งแตแรก"
 bftb_turkey.71.t: "ฝายฟาสซิสต[IRQ.GetAdjective]ยึดอํานาจใน[IRQ.GetNameDef]"
 bftb_turkey.71.desc: "ฝายฟาสซิสต[IRQ.GetAdjective]ขับไลรัฐบาลเดิมและยึดอํานาจควบคุมทั้งประเทศไดสําเร็จ ฝายฟาสซิสต[IRQ.GetAdjective]ประกาศชัดวาหนึ่งในเปาหมายหลักคือการกําจัดอิทธิพลของ[ENG.GetAdjective]ออกจากอาระเบียไมวาตองแลกดวยอะไร และพวกเขาเชื่อวาการแทรกแซงของ[ROOT.GetAdjective]เปนหนทางที่ดีที่สุดในการบรรลุเปาหมายนั้น"
 bftb_turkey.71.a: "[IRQ.GetName]? แทบไมใชเรื่องของเรา"
 bftb_turkey.71.b: "พวกเขาจะไดรับการสนับสนุนจากเราอยางเต็มที่"
 bftb_turkey.71.c: "พวกเขาพิสูจนแลววาคูควรกับ[ROOT.GetFactionName]"
 bftb_turkey.72.t: "[FROM.GetNameDefCap]สนับสนุนเรา!"
 bftb_turkey.72.desc: "ชาว[FROM.GetAdjective]ตัดสินใจประกาศสนับสนุนรัฐบาลของเรา การประกาศเชนนี้สําคัญอยางยิ่งตอการสถาปนาอธิปไตยของเรา และตอความชอบธรรมในบทบาทของเราในฐานะชาติที่ตอตานจักรวรรดินิยม[ENG.GetAdjective]โดยพื้นฐาน"
 bftb_turkey.72.a: "ความกลาหาญของพวกเขานายกยองและเราซาบซึ้งยิ่ง!"
 bftb_turkey.73.t: "ฝายฟาสซิสต[IRQ.GetAdjective]ยึดอํานาจใน[IRQ.GetNameDef]"
 bftb_turkey.73.desc: "ฝายฟาสซิสต[IRQ.GetAdjective]ขับไลรัฐบาลเดิมและยึดอํานาจควบคุมทั้งประเทศไดสําเร็จ ฝายฟาสซิสต[IRQ.GetAdjective]ประกาศชัดวาหนึ่งในเปาหมายหลักคือการกําจัดอิทธิพลของ[ENG.GetAdjective]ออกจากอาระเบียไมวาตองแลกดวยอะไร และพวกเขาเชื่อวาการแทรกแซงของ[ROOT.GetAdjective]เปนหนทางที่ดีที่สุดในการบรรลุเปาหมายนั้น"
 bftb_turkey.73.a: "[IRQ.GetName]ไมคูควรกับความสนใจของเรา"
 bftb_turkey.73.b: "ก็นะ... เราประกาศตัวเปนดาบแหงอิสลามไปแลวนี่..."
 bftb_turkey.74.t: "[FROM.GetNameDefCap]สนับสนุนเรา!"
 bftb_turkey.74.desc: "ชาว[FROM.GetAdjective]ตัดสินใจประกาศสนับสนุนรัฐบาลของเรา การประกาศเชนนี้สําคัญอยางยิ่งตอการสถาปนาอธิปไตยของเรา และตอความชอบธรรมในบทบาทของเราในฐานะชาติที่ตอตานจักรวรรดินิยม[ENG.GetAdjective]โดยพื้นฐาน"
 bftb_turkey.74.a: "เมื่อชาว[ITA.GetAdjective]อยูขางเรา เราไมมีทางลมเหลว!"
 bftb_turkey.75.t: "ชาว[IRQ.GetAdjective]โอนกิจการนํ้ามันเปนของรัฐ!"
 bftb_turkey.75.desc: "ขาวนาตกใจจาก[IRQ.GetNameDef] เมื่อเจาหนาที่[ROOT.GetAdjective]ที่ดูแลแหลงนํ้ามันสํารองของประเทศถูกคุมตัวดวยอาวุธไปยังชายแดน[IRQ.GetAdjective]และถูกขับออกนอกประเทศ! ที่นากังวลไมแพกันคือขาวลือวารัฐบาล[IRQ.GetAdjective]ชุดใหมวางแผนจะเชิญกองกําลังทหาร[GER.GetAdjective]เขามาประจําในดินแดนของตน \n\nยังไมพอ ขาวกรองยังบงชี้วาทั้งหมดนี้มี[FROM.GetNameDef]เปนผูบงการเพื่อชวยเหลือ[GER.GetFactionName]! เราตองตัดสินใจวาจะเดินหนาอยางไร: ชาว[IRQ.GetAdjective]อาจมีทาทีเปนกลางมากขึ้นหากเราเคารพการตัดสินใจยึดนํ้ามันของพวกเขา แตในอีกดาน เราตองตัดสินใจวาจะยอมรับความเปนไปไดที่นํ้ามันนั้นจะตกไปอยูในมือ[GER.GetAdjective]ไดหรือไม"
 bftb_turkey.75.a: "พวกเขาคือผูพิทักษเปลวไฟศักดิ์สิทธิ์รวมกับเรา"
 bftb_turkey.75.b: "นํ้ามันนั้นตองไมตกไปอยูในมือพวกฟาสซิสต!"
 bftb_turkey.75.c: "เทวสิทธิ์ของกษัตริยตองไดรับการปกปอง"
 bftb_turkey.75.d: "เรื่องนี้ไมมีทางจบเปนอยางอื่นไดอยูแลว"
 bftb_turkey.75.e: "เปนสิทธิ์ของพวกเขาในฐานะชาติที่มีอธิปไตย"
 bftb_turkey.76.t: "ชาว[ENG.GetAdjective]ยอมใหเรา!"
 bftb_turkey.76.desc: "ชาว[FROM.GetAdjective]ยอมมอบอํานาจควบคุมแหลงนํ้ามันทั้งหมดใหเราแลว อธิปไตยเปนของเรา: เราเอาชนะพวกจักรวรรดินิยมในเกมของพวกเขาเองไดแลว!"
 bftb_turkey.76.a: "อัลลอฮุอักบัร เกียรติยศแด[ROOT.GetLeader]!"
 bftb_turkey.77.t: "พันธมิตรแองโกล-[GER.GetAdjective]"
 bftb_turkey.77.desc: "เราตกอยูในชะตากรรมที่พลิกผันอยางโหดรายทารุณ: ชาว[ENG.GetAdjective]และชาว[GER.GetAdjective]เปนพันธมิตรกัน! เราตองการการสนับสนุนอันสําคัญยิ่งจาก[GER.GetFactionName] แตไอหมา[ENG.GetAdjective]ผูทรยศชิงตัดหนาเราไปกอน! \n\nนี่เปนวันมืดมนในประวัติศาสตร[ROOT.GetAdjective]อยางแทจริง เรายืนหยัดอยางโดดเดี่ยว ไมมีใครหนุนหลังนอกจาก[TUR.GetAdjective] - ซึ่งแทบแนนอนวาจะหดหัวหนีเมื่อเผชิญความรวมมือระหวาง[ENG.GetAdjective]-[GER.GetAdjective]ที่จะขัดขวางเรา เราจะโทษพวกเขาไดหรือ? ใครที่มีสติดีจะกลายืนหยัดตอสูกับคูหูทรงพลังเชนนี้? เราจะกลาลองหรือไม?"
 bftb_turkey.77.a: "อินชาอัลลอฮ ชาวยุโรปจะพายแพตอคมดาบ"
 bftb_turkey.77.b: "นี่เราอยูในโลกบาบออะไรกันเนี่ย!?"
 bftb_turkey.79.t: "[FROM.GetNameDefCap]ขอตออายุสนธิสัญญาไมรุกราน"
 bftb_turkey.79.desc: "ในอดีตเรามีความสัมพันธฉันมิตรอยางยิ่งกับ[FROM.GetNameDef] เพราะตางมองกันและกันวาเปนนักตอตานจักรวรรดินิยมที่มีความคิดเดียวกัน แตความสัมพันธก็เย็นชาลงในชวงไมกี่ปที่ผานมา \n\nเพื่อพยายามละลายความเย็นชาระหวางสองประเทศ [FROM.GetLeader]เสนอใหตออายุสนธิสัญญาไมรุกรานที่ถูกละเลยไปซึ่งเราลงนามกันไวเมื่อหลายปกอน เราควรมองกิ่งมะกอกนี้วาเปนสัญญาณที่[FROM.GetNameDef]อาจเปดรับความรวมมือที่ลึกซึ้งยิ่งขึ้นในอนาคตอันใกล อยางไรก็ตาม [ROOT.GetLeader]ก็ไมไดปดบังความปรารถนาที่จะไดชองแคบตุรกี เราตองตัดสินใจวาทางเลือกใดดีกวา: พันธมิตร[FROM.GetAdjective]ที่เต็มใจ หรือรัฐบริวาร[FROM.GetAdjective]"
 bftb_turkey.79.a: "ความสัมพันธฉันมิตรกับ[FROM.GetNameDef]มีแตจะใหผลดี"
 bftb_turkey.79.b: "นาเสียดาย เรามีแผนใหมสําหรับพวกเขา"
 bftb_turkey.80.t: "ชาว[FROM.GetAdjective]ตกลงตออายุสนธิสัญญาไมรุกราน"
 bftb_turkey.80.desc: "เรายินดีที่จะรายงานวามีขาวดีจาก[FROM.GetNameDef] เมื่อเราไดรับแจงวา[FROM.GetAdjective]ตอบรับขอเสนอตออายุสนธิสัญญาไมรุกรานของเราอยางกระตือรือรนยิ่ง เจาหนาที่ของเราเชื่อวาจะสรุปรายละเอียดสุดทายของขอตกลงไดกอนสิ้นสัปดาห"
 bftb_turkey.80.a: "วันอันยิ่งใหญของสันติภาพ"
 bftb_turkey.81.t: "ชาว[FROM.GetAdjective]ปฏิเสธแผนตออายุสนธิสัญญาไมรุกราน"
 bftb_turkey.81.desc: "เราไดรับแจงวา[FROM.GetNameDef]ไมมีเจตนาจะตออายุสนธิสัญญาไมรุกรานฉบับเกาของเรา ตรงกันขาม เจาหนาที่[FROM.GetAdjective]ไดยกเลิกสนธิสัญญาฉบับกอนไปแลว ซึ่งทําลายภาพลวงใด ๆ ที่วาความสัมพันธระหวางเรากับ[FROM.GetNameDef]จะอบอุนในอีกหลายปขางหนาจนสิ้น"
 bftb_turkey.81.a: "นี่มีแตจะหมายถึงเรื่องเลวราย"
 bftb_turkey.82.t: "ยกเลิกการหามพรรคคอมมิวนิสตตุรกี"
 bftb_turkey.82.desc: "เจาหนาที่พลัดถิ่นของพรรคคอมมิวนิสตตุรกีไดรับการตอนรับกลับสู[ROOT.GetNameDef] โดย[ROOT.GetLeader]อภัยโทษขอกลาวหาทั้งหมดที่มีตอพวกเขา เจาหนาที่พรรค TKP ไดรับการตอนรับอยางอบอุนจากสมาชิกรัฐบาลบางคน แตถูกเมินเฉยจากสมาชิกรัฐบาลสายเคมาลิสตดั้งเดิม \n\nแม[ROOT.GetLeader]จะไมไดตอนรับอดีตผูลี้ภัยคนใดดวยตนเอง แตก็มีการเชิญอยางเปดกวางใหเขารวมเปนสมาชิกรัฐบาล การที่เจาหนาที่ TKP คนใดจะไดเขารวมคณะรัฐมนตรีหรือไมนั้น ทายที่สุดขึ้นอยูกับการตัดสินใจของรัฐบาลเอง"
 bftb_turkey.82.a: "เราไมไดสนใจจริง ๆ หรอกวาพวกเขาจะเลือกทําอะไร"
 bftb_turkey.83.t: "การกลับมาของพรรคคอมมิวนิสตตุรกี"
 bftb_turkey.83.desc: "เจาหนาที่พลัดถิ่นของพรรคคอมมิวนิสตตุรกีไดรับการตอนรับกลับสู[ROOT.GetNameDef] โดย[ROOT.GetLeader]อภัยโทษขอกลาวหาทั้งหมดที่มีตอพวกเขา เจาหนาที่พรรค TKP ไดรับการตอนรับอยางอบอุนจากสมาชิกรัฐบาลบางคน แตถูกเมินเฉยจากสมาชิกรัฐบาลสายเคมาลิสตดั้งเดิม \n\nรัฐประหารที่ไมมีใครคาดคิดเกิดขึ้นในงานตอนรับกลับบานอยางเปนทางการที่[ROOT.GetLeader]เปนเจาภาพ เชฟก ฮึสนือ ขึ้นเวทีและประกาศยุบระบอบเคมาลิสตแบบกระฎมพีและลัทธิแก เพื่อเปลี่ยนเปนรูปแบบการปกครองที่คลายกับระบบที่ใชในมอสโก เจาหนาที่และนายทหารสายเคมาลิสตทั่วประเทศถูกกวาดจับภายในไมกี่ชั่วโมง และหากรายงานเปนจริง มีผูลงมือชาว[SOV.GetAdjective]เกี่ยวของตลอดกระบวนการทั้งหมด"
 bftb_turkey.83.a: "เดี๋ยวกอนน-"
 bftb_turkey.84.t: "[FROM.GetNameDefCap]เรียกรองใหเรายอมสยบ"
 bftb_turkey.84.desc: "พวกงูพิษนรกใน[FROM.GetNameDef]สงขอเรียกรองฝายเดียวมาใหเราปลดอาวุธและยินยอมใหทหาร[FROM.GetAdjective]เขามาประจําในดินแดนของเรา เพื่อที่พวกเขาจะได 'รับประกันความปลอดภัยและสิทธิของกรรมกร[ROOT.GetAdjective]' แรงจูงใจเบื้องหลังขอเรียกรองอันนาขันนี้ชัดเจน: [FROM.GetNameDef]ตองการยึดอํานาจควบคุมกิจการและอธิปไตยของเราโดยสมบูรณ \n\nเราไมใชมหาอํานาจระดับกลาง ๆ ที่ไมมีความสําคัญในเวทีโลก เราคือ[ROOT.GetNameDef]! เราจะยอมใหมหาอํานาจที่มุงรายอยางโจงแจง ซึ่งมองเราเปนเพียงเหยื่อที่รอวันถูกขยํ้า มาขมเหงเราเชนนี้ไมได เราตองมองหาพันธมิตรจากภายนอก ตองมีอยางนอยสักประเทศที่จะยืนเคียงขางเราตอตานการกระหายสงครามของ[FROM.GetAdjective]แน! แตอีกดานหนึ่ง ชีวิตของชาว[ROOT.GetAdjective]ที่อาจตองสูญเสียไปคุมคากับความเสี่ยงจริงหรือ?"
 bftb_turkey.84.a: "[SOV.GetNameDefCap]จะไกลเกลี่ยเรื่องนี้อยางยุติธรรม"
 bftb_turkey.84.b: "เราลงมติตามระบอบประชาธิปไตย... ใหขอความชวยเหลือจากผูอื่น!"
 bftb_turkey.84.c: "ตองมีใครสักคนชวยเราจากพวกสวะลัทธิมารกซนี่แน!"
 bftb_turkey.84.d: "มิตรของเราจะรับประกันความปลอดภัยของเรา"
 bftb_turkey.84.e: "ชีวิตชาว[ROOT.GetAdjective]มากอนสิ่งอื่นใด"
 bftb_turkey.85.t: "[FROM.GetNameDefCap]ขอใหไกลเกลี่ยการรุกรานของ[TUR.GetNameDefCap]"
 bftb_turkey.85.desc: "เจาหนาที่จาก[FROM.GetNameDefCap]เขาหาเราดวยความหวังวาเราจะใหความคุมครองพวกเขาจากการรุกรานของ[TUR.GetAdjective] ชาว[FROM.GetAdjective]ไดสงเอกสารอยางละเอียดอธิบายวาการที่[FROM.GetNameDef]ตกอยูในเขตอิทธิพลของ[TUR.GetAdjective]จะเปนผลรายอยางยิ่งตอดุลอํานาจในภาคพื้นทวีป และปกปองสิทธิ์ในการปกครองตนเองอยางแข็งขัน ดวยหวังวาเราจะตัดสินใจใหความชวยเหลือ"
 bftb_turkey.85.a: "[TUR.GetNameDefCap]กําลังพยายามผูกขาดลัทธิคอมมิวนิสต!"
 bftb_turkey.85.b: "[TUR.GetNameDefCap]กําลังคุกคามดุลอํานาจในภาคพื้นทวีป!"
 bftb_turkey.85.c: "จะปลอยใหพวกแดงอาละวาดไมได"
 bftb_turkey.85.d: "ความขัดแยงของ[FROM.GetAdjective]ไมใชเรื่องของเรา"
 bftb_turkey.86.t: "[FROM.GetNameDefCap]รับประกันเอกราชของเรา"
 bftb_turkey.86.desc: "เราไดรับแจงวา[FROM.GetNameDef]ตั้งใจจะรับประกันเอกราชของเราจากการรุกรานของ[TUR.GetAdjective] นี่เปนชัยชนะทางการทูตครั้งใหญของเรา และหวังวาจะทําให[TUR.GetNameDef]ทบทวนขอเรียกรองอันเกินเลยที่ยื่นมาใหเรา"
 bftb_turkey.86.a: "มิตรแทของ[ROOT.GetNameDef]"
 bftb_turkey.87.t: "[BUL.GetNameDefCap]ไดรับการสนับสนุนจากภายนอก"
 bftb_turkey.87.desc: "ชาว[BUL.GetAdjective]จอมเจาเลหหาผูอื่นมาสนับสนุนการแสวงหาเอกราชที่ถึงคราวลมสลายของพวกเขาได! นี่เปนความยุงยากที่เราอยากหลีกเลี่ยงอยางแนนอน เราตองตัดสินใจวาจะเดินหนาใชกําลังเพื่อบังคับตามขอเรียกรอง หรือถึงเวลาที่จะถอยเพื่อปองกันสงครามที่ใหญกวา"
 bftb_turkey.87.a: "เราจะเดินหนาตอไมวาอยางไร"
 bftb_turkey.87.b: "นี่เปนความถดถอยที่เจ็บปวด"
 bftb_turkey.88.t: "[FROM.GetNameDefCap]ยอมถอย!"
 bftb_turkey.88.desc: "บรรยากาศโดยรวมในรัฐบาลของเราเต็มไปดวยความปติยินดี เมื่อเราเพิ่งไดรับแจงวารัฐบาลและกองทัพ[FROM.GetAdjective]ไดถอยออกไปและกําลังเรียกรองใหลดความตึงเครียด นี่เปนชัยชนะอันยิ่งใหญของทั้งรัฐ[ROOT.GetAdjective]และประชาชน[ROOT.GetAdjective].."
 bftb_turkey.88.a: "เราไดรับชัยชนะ!"
 bftb_turkey.89.t: "ไมมีชาติใดสนับสนุนเรา"
 bftb_turkey.89.desc: "[ROOT.GetLeader]เศราโศกจนไมอาจปลอบไดหลังไดรับขาวรายวาไมมีชาติใดเลยที่จะสนับสนุน[ROOT.GetNameDef]ตอตานการรุกรานของ[TUR.GetAdjective] ทาทีเฉยเมยของมหาอํานาจอื่น ๆ ทําใหเราเหลือเพียงทางเลือกอันเลวราย: ยืนหยัดสู หรือยอมจํานนเพื่อรักษาชีวิตผูคน"
 bftb_turkey.89.a: "เราไมมีทางเลือก เราตองยอมจํานน"
 bftb_turkey.89.b: "เราจะไมยอมแพโดยไมสู!"
 bftb_turkey.90.t: "[BUL.GetNameDefCap]ยอมจํานนตอเรา"
 bftb_turkey.90.desc: "เรากาวเขาใกลการปฏิวัติโลกไปอีกขั้น เมื่อมีขาววาทางการ[FROM.GetAdjective]ยอมถอยและมอบอํานาจใหคณะรัฐมนตรีคอมมิวนิสตชุดใหมที่เจาหนาที่พรรคของเราคัดเลือกมาเองกับมือเพื่อนํา[FROM.GetNameDef] การไดควบคุมกองทัพและอุตสาหกรรมของ[FROM.GetAdjective]ทําใหเรามีอํานาจมากยิ่งขึ้นทั้งในภูมิภาคและในยุโรป"
 bftb_turkey.90.a: "การปลดปลอยพวกเขาเสร็จสมบูรณแลว"
 bftb_turkey.91.t: "[BUL.GetNameDefCap]ยืนหยัดทาทาย"
 bftb_turkey.91.desc: "เราไดรับรายงานที่ไมคาดคิดวา[FROM.GetNameDef]ยืนหยัดทาทายขอเรียกรองอันสมเหตุสมผลของเรา รัฐบาล[FROM.GetAdjective]อาจเลือกทางที่ราบรื่นที่สุดได แตกลับตัดสินใจเดินบนเสนทางแหงความเจ็บปวด"
 bftb_turkey.91.a: "ถาเชนนั้น เราจะสั่งสอนใหพวกเขารูสํานึก"
 bftb_turkey.92.t: "[FROM.GetName]ลงนามในกติกาสัญญาซาอดาบาด"
 bftb_turkey.92.desc: "[FROM.GetLeader]กระตือรือรนอยางยิ่งเมื่อไดรับขอเสนอสนธิสัญญาไมตรีและกติกาสัญญาไมรุกรานของเรา และไมรอชาที่จะสงสนธิสัญญาที่ลงนามแลวกลับมาใหเรา ดวยความเห็นพองของพวกเขา เรากาวเขาใกลสันติภาพในบานและสันติภาพในโลกไปอีกขั้น!"
 bftb_turkey.92.a: "ทานจะเปนมิตรที่รักของ[ROOT.GetNameDef]เสมอ"
 bftb_turkey.93.t: "[FROM.GetName]ปฏิเสธกติกาสัญญาซาอดาบาด!"
 bftb_turkey.93.desc: "[FROM.GetLeader]เขียนจดหมายยืดยาวถึง[ROOT.GetLeader] แจงวาขอเสนอสนธิสัญญาไมตรีและกติกาสัญญาไมรุกรานนั้นไมคุมคากระดาษและหมึกที่ใชเขียน [FROM.GetLeader]ยังเขียนตอวาอะไรก็ตามที่นอยกวาพันธมิตรอยางเปนทางการระหวาง[FROM.GetNameDef]กับ[ROOT.GetNameDef]ลวนเสียเวลาเปลา และขอไมของเกี่ยวกับแผนการใด ๆ ของ[ROOT.GetAdjective]นับจากนี้ไป"
 bftb_turkey.93.a: "...แคบอกวา 'ไม' ก็ไดนี่"
 bftb_turkey.94.t: "เศรษฐกิจลมสลาย"
 bftb_turkey.94.desc: "นักเศรษฐศาสตร[ROOT.GetAdjective]ตื่นตระหนกอยางหนักเมื่อคาเงินของประเทศดิ่งลงอยางรุนแรง และชาติของเราเริ่มแสดงอาการของภาวะเศรษฐกิจตกตํ่า เปนโศกนาฏกรรมอันเลวรายที่ชาติของเรา ซึ่งหลบเลี่ยงผลกระทบที่เลวรายที่สุดของภาวะเศรษฐกิจตกตํ่าครั้งใหญมาไดอยางชาญฉลาด กลับตองตกอยูในภาวะวิกฤตเศรษฐกิจในตอนนี้ ขณะที่สวนอื่นของโลกกําลังหลุดพนจากปญหาเศรษฐกิจ \n\nความเชื่อมั่นตอสถาบันของรัฐตกตํ่าที่สุดเปนประวัติการณ และประชาชนตางตระหนักดีวารัฐบาล[ROOT.GetAdjective]ชุดปจจุบันคือผูตองรับผิดชอบตอความทุกขยากของประเทศ"
 bftb_turkey.94.a: "ชาติตองหลั่งเลือดเพราะความโลภของเรา..."
 bftb_turkey.95.t: "นายทหารออตโตมันเสนอโอกาสฟนฟูระบอบสุลตาน"
 bftb_turkey.95.desc: "เราไดรับขอเสนอจากกลุมบุคคลผูมีความคิดเดียวกันซึ่งเห็นพองกับเราอยางสุดใจถึงความสําคัญของศาสนาในการปกครองรัฐ[ROOT.GetAdjective] แตเรารูแนชัดวาผูเสนอเหลานี้ภักดีตอสิ่งอื่นนอกเหนือจากพระผูเปนเจาดวย อดีตนายทหารและนายพลแหงจักรวรรดิออตโตมันไดเขาหาเราพรอมทางเลือกที่จะสงผลกวางไกลตอประวัติศาสตรของเราตอจากนี้: พวกเขาตองการคืนบัลลังกใหแกสุลตาน \n\nขอเสนอนี้ไมไดนาประหลาดใจเสียทีเดียว เพราะรัฐมนตรีและผูสนับสนุนของเราหลายคนเคยแสดงความผิดหวังเปนการสวนตัวตอการลมสลายของระบอบสุลตานออตโตมัน และพูดถึงการติดตอฉันมิตรกับผูลี้ภัยออตโตมันในตางแดนอยางภาคภูมิ ไมตองสงสัยวาผูมีสิทธิ์เลือกตั้งจะสนับสนุนการตัดสินใจของเราไมวาทางใด แตผูบริหารระดับสูงของเรากลับแตกแยก ยังมีความเคารพอยางมากตอสาธารณรัฐและทุกสิ่งที่มุสตาฟา เคมาล อตาเติรก สรางไว และหากเราลงนามในขอตกลงกับเหลาวิญญาณออตโตมันเหลานี้ เราก็จะเปนผูปดฉากสาธารณรัฐของอตาเติรกอยางไมตองสงสัย"
 bftb_turkey.95.a: "ความรุงโรจนในอดีตรอใหเราทวงคืน..."
 bftb_turkey.95.b: "เราภักดีตอสาธารณรัฐและประชาธิปไตย!"
 bftb_turkey.97.t: "[FROM.GetNameDefCap]เรียกรองใหเรายอมอยูใตอํานาจ"
 bftb_turkey.97.desc: "วากันวาประวัติศาสตรมักซํ้ารอยเปนวัฏจักร แตไมมีนักรัฐศาสตรที่เกงกาจคนใดจะคาดการณสิ่งที่กําลังเกิดขึ้นตอนนี้ไดแน หลายคนในรัฐบาลรูสึกเหมือนเคยเจอเหตุการณนี้มากอน เมื่อเราเพิ่งตอนรับทูตจาก[FROM.GetNameDef] และดูเหมือนวา[FROM.GetLeader]เรียกรองใหเรายอมสยบ \n\nสถานการณทั้งหมดนี้ชางไรสาระ! เรื่องแบบนี้เกิดขึ้นไดอยางไรกัน!? ชาวเติรกปลอยใหเปนเชนนี้ไดอยางไร? เราปลอยใหตัวเองตกอยูในสถานะเชนนี้ไดอยางไร!? สถานการณชางพิลึก แตภัยคุกคามนั้นเปนของจริง เราตองตัดสินใจวาพรอมจะลุกขึ้นตอตานภัย[FROM.GetAdjective]อีกครั้งเหมือนเมื่อหลายสิบปกอนหรือไม หรือกาลเวลาเปลี่ยนไปมากจนเราไมกลาตอตานแรงจูงใจอันเขาใจไมไดของพวกเขาและเสี่ยงตอความโกรธเกรี้ยวของพวกเขา"
 bftb_turkey.97.a: "พวกออตโตมันชั่วชาประเมินกําลังตัวเองสูงเกินไป!"
 bftb_turkey.97.b: "ป 1908 ตองไมสูญเปลา!"
 bftb_turkey.97.c: "ตอตานภัยออตโตมันไปก็ไรประโยชน"
 bftb_turkey.98.t: "[FROM.GetNameDefCap]ยังคงมั่นใจในการคุมครองของพันธมิตร"
 bftb_turkey.98.desc: "ชาว[FROM.GetAdjective]ปฏิเสธที่จะยอมรับอํานาจของเราหรือยอมรับความชอบธรรมของขอเรียกรองของเรา แตกลับไปหลบภัยในออมแขนของ[FROM.GetFactionName]อยางพวกขี้ขลาด เราตองตัดสินใจวาจะยอมเสี่ยงขัดแยงกับพันธมิตรของ[FROM.GetNameDef]หรือไม หรือการผงาดขึ้นอยางมีชัยของเราตองเลื่อนออกไปอีกสักพัก"
 bftb_turkey.98.a: "ไมมีผูใดตานทานแสนยานุภาพของเราได!"
 bftb_turkey.98.b: "เราจะปลอยใหป 1913 ซํ้ารอยไมได..."
 bftb_turkey.99.t: "[FROM.GetNameDefCap]ถอนขอเรียกรอง!"
 bftb_turkey.99.desc: "พวก[FROM.GetAdjective]ผูนารําคาญและเนาเฟะไดถอนขอเรียกรองอันนาขันของตนแลว จะเปนความใจดีหากจะกลาววาพวกเขาแสดงความฉลาดอยูบางในการตัดสินใจครั้งใหม แตนั่นจะเปนการยกยองรัฐบาล[FROM.GetAdjective]มากเกินกวาที่พวกเขาเคยพิสูจนวาสมควรไดรับ สันติภาพครอบคลุมระหวาง[ROOT.GetNameDef]กับ[FROM.GetNameDef] ในตอนนี้..."
 bftb_turkey.99.a: "เรารอดพนวิกฤตครั้งใหญมาได!"
 bftb_turkey.100.t: "[FROM.GetNameDefCap]คุกเขาตออํานาจของเรา!"
 bftb_turkey.100.desc: "เรากาวเขาใกลการทวงคืนความรุงโรจนในอดีตไปอีกขั้น ดวยการปราบรัฐ[FROM.GetAdjective]ผูไรศีลธรรมใหสยบ และทําใหพวกเขาสอดคลองกับคุณคาของเรา มีการเฉลิมฉลองไปทั่วประเทศเพื่อระลึกถึงชัยชนะอันยิ่งใหญของเรา"
 bftb_turkey.100.a: "ในที่สุดเราอาจไดลางแคนมหาสงคราม..."
 bftb_turkey.101.t: "[FROM.GetNameDefCap]ยืนหยัดทาทาย"
 bftb_turkey.101.desc: "พวก[FROM.GetAdjective]ชั่วรายปฏิเสธที่จะคุกเขาตอสุลตานผูทรงอานุภาพและทรงปรีชาของเรา และกลับเลือกเสนทางแหงสงคราม หากชาว[FROM.GetAdjective]ตองการสงคราม ก็จะไดสงคราม! จะไมมีวันใหป 1913 ซํ้ารอยอีก!"
 bftb_turkey.101.a: "อัลลอฮทรงนําทางดาบของเรา"
 bftb_turkey.102.t: "คําบัญชาดามัสกัส"
 bftb_turkey.102.desc: "พวกโจรผูหยิ่งผยองที่ปกครอง[FROM.GetNameDef]เรียกรองใหเรายกดินแดนซีเรียใหพวกเขาทันที มิฉะนั้นจะเกิดสงคราม จะวาเราประหลาดใจกับการตัดสินใจของพวกแรง[FROM.GetAdjective]ก็ไมใช แตนั่นไมไดทําใหสถานการณของเราลอแหลมนอยลงเลย \n\nเราตองตัดสินใจวาพรอมจะยกดินแดนใหชาว[FROM.GetAdjective]โดยหวังจะเลี่ยงสงครามหรือไม หรือจะพยายามสง[FROM.GetNameDef]กลับไปอยูในบันทึกประวัติศาสตรตลอดกาลซึ่งเปนที่ที่พวกเขาควรอยู"
 bftb_turkey.102.a: "ไมคุมที่จะสู"
 bftb_turkey.102.b: "ถึงเวลานานแลวที่จะรื้อทําลายอํานาจครอบงําของออตโตมันใหสิ้นซาก"
 bftb_turkey.103.t: "[FROM.GetNameDefCap]ปฏิเสธเรา!"
 bftb_turkey.103.desc: "พวกโงใน[FROM.GetNameDef]ปฏิเสธขอเรียกรองอันสมเหตุสมผลของเราที่ใหคืนดินแดนเดิมแกเจาของที่ชอบธรรม นี่ทําใหเราเหลือทางเดียวเทานั้น: สงคราม!"
 bftb_turkey.103.a: "ความอวดดีของพวกเขาจะตองเจอกับดาบโคงของเรา"
 bftb_turkey.104.t: "ดินแดนของเราเปนของเรา!"
 bftb_turkey.104.desc: "พวกออนแอแหง[FROM.GetNameDef]แสดงความฉลาดอยางผิดวิสัยดวยการคืนซีเรียใหเราโดยไมตองใชความรุนแรง เรากําลังเรงผนวกดินแดนนี้กลับเขาสูเขตการปกครองของจักรวรรดิ และมาถึงทางแยกแลว \n\nแปลกที่ในลิแวนต ผูคนสวนใหญจดจําเราในฐานะจักรวรรดินิยมและคนตางชาติที่เขามาเปนนายเหนือดินแดนที่เราไมมีสิทธิ์อยางไมเปนธรรม แนนอนวานี่เปนเรื่องไรสาระสิ้นดี - แตความรูสึกที่ผิดเพี้ยนนั้นยังคงอยูจนถึงทุกวันนี้ เราอาจไดประโยชนระยะยาวมากกวาหากคํ้าจุนรัฐบริวารของจักรวรรดิที่ปกครองตนเอง ซึ่งเราสามารถผนวกรวมในภายหลังไดหากสถานการณเอื้ออํานวย ในอีกทางหนึ่ง เราก็สามารถผนวกดินแดนกลับเขาสูระบอบสุลตานของเราไดเลย - ทายที่สุดแลวนี่คือสิทธิ์อันศักดิ์สิทธิ์ของเรา"
 bftb_turkey.104.a: "เราจะรวมเอยาเลตดามัสกัสและอาเลปโปเขาดวยกัน!"
 bftb_turkey.104.b: "ยินดีตอนรับกลับสูจักรวรรดิ!"

 bftb_turkey.110.t: "ปราบกบฏใน[TUR_kurdish_state_event_target.GetName]ไดสําเร็จ"
 bftb_turkey.110.desc: "กองทัพของเราไดรับชัยชนะหลังการสูรบยืดเยื้อกับพวกแบงแยกดินแดนใน[TUR_kurdish_state_event_target.GetName] นับแตนั้นมีการจับกุมหลายครั้งในภูมิภาค และกองทัพของเราไดทํางานอยางหนักเพื่อฟนฟูความสงบเรียบรอยในพื้นที่ \n\nความสูญเสียของทั้งสองฝายเปนเรื่องนาเสียใจ แตโดยทั่วไปตางเขาใจดีวาไมมีการเสียสละใดยิ่งใหญเกินไปสําหรับการรักษาเอกภาพของชาติ รัฐบาลไดประกาศใหมีวันไวทุกขทั่วประเทศเพื่อไวอาลัยแดผูเสียชีวิต"
 bftb_turkey.110.a: "สาธารณรัฐเดียว แบงแยกมิได"
 bftb_turkey.111.t: "พวกกบฏเอาชนะกองกําลังของเราใน[TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.111.desc: "หายนะอันเลวรายเกิดขึ้นใน[TUR_kurdish_state_event_target.GetName] เมื่อกองทัพของเราตองถอนออกจากดินแดนหลังการสูรบอันเหนื่อยลากับพวกกบฏแบงแยกดินแดนที่เคลื่อนไหวในพื้นที่ \n\nทั้งผูบริหารรัฐบาลและผูสังเกตการณจากกองบัญชาการระดับสูงตางตกตะลึงและรับไมไดกับเหตุการณที่พลิกผันอยางไมคาดคิด และเรียกรองใหตอบโตอยางหนักหนวงตอกองกําลังกบฏที่กอความเดือดรอนในภูมิภาค [ROOT.GetLeader]ไมไดกลาวถึงเหตุการณนี้ตอสาธารณะ แตไดเรงเราเจาหนาที่ทหารเปนการสวนตัวใหเตรียมปฏิบัติการตอบโตเพื่อลางแคนความสูญเสียจากการรบครั้งนี้"
 bftb_turkey.111.a: "พวกมันยังไมเห็นดีกับเราหรอก"
 bftb_turkey.113.t: "พวกหัวรุนแรงประทวงการผลิตสินคาตองหามทางศาสนา"
 bftb_turkey.113.desc: "การตอบสนองตลาดเสรีเปนหลักสําคัญของนโยบายเคมาลิสตมาโดยตลอด: ที่ใดมีอุปสงค ก็ยอมตองมีผูจัดหาอุปทาน ประชากรบางกลุม - โดยเฉพาะผูเครงศาสนา - ไมคอยสบายใจกับวัฒนธรรมบริโภคนิยมที่คอนขางใหมของ[ROOT.GetNameDef] \n\nการประทวงลุกลามในบางสวนของประเทศเพื่อตอตานการผลิตสินคาบางอยางที่สมาชิกในสังคมเห็นวาเปนสิ่งตองหามตามศาสนา พวกเขาไมเคยเคารพความฝนของเราที่จะสราง[FROM.GetName]แบบฆราวาส และเห็นไดชัดวายังปรับตัวกับแนวคิดทั้งหมดนี้ไมได ถึงกระนั้น การเอาใจฝูงชนอาจเปนทางที่งายกวาการกอความขัดแยงระหวางประชาชนของเราเองโดยไมจําเปน"
 bftb_turkey.113.a: "ก็ได เราจะยอมเพื่อแสดงความเคารพตอขนบธรรมเนียมของพวกเขา"
 bftb_turkey.113.b: "ความกาวหนาของเราไมมีใครหยุดได"
 bftb_turkey.114.t: "พวกหัวรุนแรงประทวงนโยบายรัฐบาลอยางสันติ"
 bftb_turkey.114.desc: "อีกวัน อีกการประทวงจากผูเครงศาสนาในประเทศ การประทวงลาสุดเกิดขึ้นใน[TUR_fundamentalist_state.GetName] เพื่อตอตานสิ่งที่พวกเขามองวาเปนรัฐบาลจอมบงการที่เขามากาวกายในเรื่องที่ไมใชธุระ เรื่องทั้งหมดนี้ชางไรสาระ เราคือรัฐบาล การกาวกายกิจการของพลเมืองก็คือหนาที่ของเรา \n\nการประทวงเปนไปอยางสันติ และเราไมจําเปนตองใชกําลังตอบโตการยั่วยุของพวกเขา ที่จริง ที่ปรึกษารัฐบาลไดรางรายการการผอนปรนที่ไรความหมายซึ่งสามารถใชสงบมวลชนใน[TUR_fundamentalist_state.GetName]ได แตหากเรายอมพวกหัวรุนแรงใน[TUR_fundamentalist_state.GetName] พวกหัวรุนแรงในสวนอื่นของประเทศอาจคิดวาพวกตนก็ทําแบบเดียวกันได บางทีการสงกองทัพเขาไปเพื่อแสดงความมุงมั่นตอคุณคาหลักของเราอาจดีกวา"
 bftb_turkey.114.a: "เสนอการผอนปรนเล็กนอยใหได"
 bftb_turkey.114.b: "กวาดลางพวกตัวกวนหัวดื้อใหกระเจิง"
 bftb_turkey.115.t: "พวกหัวรุนแรงเรียกรองอํานาจปกครองตนเองระดับภูมิภาค"
 bftb_turkey.115.desc: "ความตึงเครียดใน[TUR_fundamentalist_state.GetName]ระหวางพวกหัวรุนแรงทางศาสนากับทางการถึงจุดแตกหักในที่สุด เมื่อพวกหัวรุนแรงเรียกรองอํานาจระดับภูมิภาคและอํานาจปกครองตามกฎหมายของตนเอง นี่เปนการยกระดับครั้งใหญจากความขัดแยงที่สวนใหญเปนเพียงการประทวงอยางสันติและวาทกรรมไรนํ้ายา \n\nเปนความจริงที่สถานการณใน[TUR_fundamentalist_state.GetName]คอย ๆ หลุดจากการควบคุมของเรา แมจะเจ็บปวดที่ตองคิดเชนนี้ แตหากเรามอบอํานาจปกครองตนเองตามที่เรียกรอง อยางนอยก็จะตัดพวกฝูงชนใน[TUR_fundamentalist_state.GetName]ออกจากรายการปญหาปจจุบันของเราได แตอีกดานหนึ่ง แมแตการคิดจะทําเชนนั้นก็อาจถูกบางคนมองวาเปนการกบฏรายแรง..."
 bftb_turkey.115.a: "เปนการเสียสละที่จําเปน"
 bftb_turkey.115.b: "ใหพวกเขาไปถามนายทหารของเราดูวาคิดอยางไรกับ 'ขอเรียกรอง' เหลานี้"
 bftb_turkey.116.t: "เกิดการโจมตีแบบกองโจรใน[TUR_fundamentalist_state.GetName]"
 bftb_turkey.116.desc: "เราไดรับขาวรายวากองรักษาการณแหงหนึ่งของเราใน[TUR_fundamentalist_state.GetName]ตกเปนเปาการโจมตีแบบกองโจรที่วางแผนมาอยางดีและโหดเหี้ยม โดยพวกหัวรุนแรงทางศาสนาที่มีฐานอยูในพื้นที่ ทั้งสองฝายสูญเสียอยางหนัก แตฝายกอความไมสงบก็ขูวาจะโจมตีซํ้าอีกไมวาอยางไร เวนแตเราจะยอมถอนกองทัพออกจากภูมิภาค \n\nนับเปนวันที่นาเศราจริง ๆ เมื่อคนชาติเดียวกันฆากันเองเพราะเรื่องเล็กนอยอยางความศรัทธา แตนั่นคือสถานการณที่เรากําลังเผชิญ คณะนายทหารของเราเสนอใหตอบโตฝายกอความไมสงบดวยกําลังทหารเต็มอัตราเพื่อลางแคนความสูญเสีย แตนักการเมืองบางคนเรงเราวาทางที่ปลอดภัยที่สุดอาจเปนการถอนกําลังออกจากพื้นที่ชั่วคราวจนกวาสถานการณจะสงบลง นี่ไมใชการตัดสินใจที่จะทําไดงาย ๆ"
 bftb_turkey.116.a: "ตอบโตกลับใหหนักกวาสองเทา!"
 bftb_turkey.116.b: "ถอนทหารของเราออกมา"
 bftb_turkey.117.t: "พวกหัวรุนแรงแพรพิษเขาสู[TUR_fundamentalist_state.GetName]"
 bftb_turkey.117.desc: "รายงานจากภาคสนามระบุวาเครือขายพวกหัวรุนแรงทางศาสนาไดแทรกซึมเขาสู[TUR_fundamentalist_state.GetName]ดวยความพยายามรวมกันที่จะโนมนาวประชากรที่นั่นใหหวนกลับสูวิถีชีวิตแบบดั้งเดิม - ซึ่งแนนอนวาขัดแยงอยางรุนแรงกับอุดมการณฆราวาสนิยมของเรา นักการศาสนาผูมีเสนหและแกนนําผูประทวงผูหาวหาญเปนหัวหอกในการเปลี่ยนความคิดของประชากรใน[TUR_fundamentalist_state.GetName]ใหคลอยตาม และจนถึงตอนนี้ความพยายามขับไลพวกเขาดวยอํานาจละมุนก็ลมเหลว \n\nเราเผชิญกับภาวะกลืนไมเขาคายไมออก: เราตองการสนับสนุนเจตจํานงของประชาชน แตหากไมแทรกแซงดวยวิธีที่ตรงไปตรงมากวานี้ เราก็แทบจะตองเสียรัฐนี้ใหพวกหัวรุนแรงอยางแนนอน เราพยายามครั้งแลวครั้งเลาที่จะใหความรูแกประชาชนเพื่อสรางการสนับสนุนตอฆราวาสนิยม แตทุกครั้งพวกคลั่งศาสนาก็ตอสูกับเราอยางสุดกําลังมาตลอดและยังคงทําตอไป เราตองเลือกวาพรอมจะยอมรับเจตจํานงของประชาชนใน[TUR_fundamentalist_state.GetName]หรือไม หรือรัฐบาลตองลงมือโดยตรงเพื่อขัดขวางเปาหมายของพวกหัวรุนแรง"
 bftb_turkey.117.a: "ทุมเทสุดกําลังเพื่อหยุดยั้งพวกเขา"
 bftb_turkey.117.b: "เราตองยอมตามเจตจํานงของประชาชน..."
 bftb_turkey.118.t: "พวกหัวรุนแรงยึดอํานาจควบคุม[TUR_fundamentalist_state.GetName]โดยสมบูรณ!"
 bftb_turkey.118.desc: "หายนะ! เราเพิ่งไดรูวาเราสูญเสียการควบคุมเหนือ[TUR_fundamentalist_state.GetName]ไปจนหมดสิ้น กองโจรหัวรุนแรงทางศาสนาเปดการโจมตีประสานกันตออาคารรัฐบาลและฐานทัพทั้งหมดในรัฐ ในแบบที่แทบไมมีเวลาประสานการโจมตีตอบโตกอนที่สถานการณทั้งหมดจะหลุดจากการควบคุม \n\nนี่เปนความสูญเสียที่ไมเคยเกิดขึ้นมากอนในประเทศของเรา: ศัตรูของรัฐสามารถยึดอํานาจควบคุมดินแดนอธิปไตยของ[ROOT.GetAdjective]ไดโดยสมบูรณ การยึด[TUR_fundamentalist_state.GetName]กลับคืนจะตองแลกดวยราคาแพง แตการปลอยใหหลุดมือไปก็เชนกัน เราหมดเวลาแลว และตองตัดสินใจ"
 bftb_turkey.118.a: "ถลมพวกมันดวยทุกสิ่งที่มี!"
 bftb_turkey.118.b: "เราจะตองคอย ๆ เอาชนะใจประชาชนกลับคืนมา"
 bftb_turkey.119.t: "พวกหัวรุนแรงใน[TUR_fundamentalist_state.GetName]ยอมตอรัฐบาล"
 bftb_turkey.119.desc: "นโยบายการเจรจาอยางโปรงใสและการเขาถึงชุมชนอยางทุมเทของเราไดผลอยางงดงามใน[TUR_fundamentalist_state.GetName] พวกหัวรุนแรงไดออกจากรัฐไปแลว หลังถูกประชากรทองถิ่นขับไล นับเปนชัยชนะอันนาทึ่งของรัฐบาลเรา \n\nประชาชนใน[TUR_fundamentalist_state.GetName]ยังคงรักษาลักษณะทางศาสนาของตน แตจากการพูดคุยกับผูนําชุมชน เราไดรูวาพลเมืองของเราไมเห็นวาหลักการของรัฐบาลขัดแยงกับความเชื่อของตนโดยพื้นฐานอีกตอไป ใน[TUR_fundamentalist_state.GetName] เราไดเห็นวาเอกภาพของ[ROOT.GetAdjective]ในอนาคตจะเปนอยางไร"
 bftb_turkey.119.a: "ขอบคุณสําหรับความรวมมือ"

 bftb_turkey.126.t: "[FROM.GetNameDefCap]สงแผนการลงทุนมาให"
 bftb_turkey.126.desc: "ผูแทนจาก[FROM.GetNameDef]เดินทางเยือนประเทศเราและพบปะนักการเมืองของเราหลายคน ดวยหวังจะไดรับการสนับสนุนแผนการลงทุนของพวกเขา รัฐบาล[FROM.GetNameDef]ตองการใหเราใชทรัพยากรของเราชวยยกระดับขีดความสามารถและผลผลิตทางอุตสาหกรรมของพวกเขา เจาหนาที่[FROM.GetAdjective]บอกเปนนัยวาหากชวยเหลือชาติของพวกเขา เราอาจคาดหวังความชวยเหลือตอบแทนในอนาคตในรูปพันธมิตรทางทหารระหวางสองชาติ"
 bftb_turkey.126.a: "หากพวกเขาตองการความชวยเหลือ ก็จะไดความชวยเหลือ"
 bftb_turkey.126.b: "เราจะไมลงนามในสัญญาขายวิญญาณของพวกเขา"
 bftb_turkey.127.t: "[FROM.GetNameDefCap]ตัดความเปนไปไดในการลงทุน"
 bftb_turkey.127.desc: "เราไดรับขาวรายจาก[FROM.GetNameDef]: แมชาว[FROM.GetAdjective]จะไมไดมีเจตนารายตอเรา แตเราไดรับแจงวา[FROM.GetNameDef]จะไมลงทุนทรัพยากรใด ๆ ในฐานอุตสาหกรรมของเรา เจาหนาที่ยืนกรานหนักแนนในเรื่องนี้ และขอใหเราอยาหยิบยกเรื่องนี้ขึ้นมาพูดกับพวกเขาอีกในอนาคตอันใกล"
 bftb_turkey.127.a: "นาเสียดาย แตเขาใจได"
 bftb_turkey.128.t: "[FROM.GetNameDefCap]ลงทุนเล็กนอย"
 bftb_turkey.128.desc: "เราเพิ่งไดรับแจงจากเจาหนาที่[FROM.GetAdjective]วาโครงการที่พวกเขาลงทุนไดเสร็จสมบูรณแลว ผูตรวจการของเราเองไปตรวจสถานที่กอสรางเพื่อใหแนใจวาทุกอยางเปนไปตามที่เราคาดหวัง และพวกเขาก็ไมผิดหวัง \n\nผูสังเกตการณ[FROM.GetAdjective]กลาวเมื่อโครงการเสร็จสิ้นวา[FROM.GetNameDef]ไมขัดของที่จะสนับสนุนโครงการคลายกันหรือที่ทะเยอทะยานยิ่งกวานี้ใน[ROOT.GetNameDef]ในอนาคต"
 bftb_turkey.128.a: "พวกเขามีนํ้าใจตอเราอยางยิ่ง"
 bftb_turkey.129.t: "[FROM.GetNameDefCap]ลงทุนในภาคอุตสาหกรรมเบาของเรา"
 bftb_turkey.129.desc: "เราเพิ่งไดรับแจงจากเจาหนาที่[FROM.GetAdjective]วาโครงการอุตสาหกรรมที่[FROM.GetAdjective]สนับสนุนเมื่อไมนานมานี้ไดเสร็จสมบูรณแลว ผูตรวจการของเราเองไปตรวจสถานที่กอสรางเพื่อใหแนใจวาทุกอยางเปนไปตามที่เราคาดหวัง และพวกเขาก็ไมผิดหวัง คาดวาโรงงานใหมจะเริ่มการผลิตไดทันที \n\nผูสังเกตการณ[FROM.GetAdjective]กลาวเมื่อโครงการเสร็จสิ้นวา[FROM.GetNameDef]ไมขัดของที่จะสนับสนุนโครงการลับในลักษณะคลายกันหรือที่ทะเยอทะยานยิ่งกวานี้ในอนาคต"
 bftb_turkey.129.a: "ชางเปนขาวที่ยอดเยี่ยม!"
 bftb_turkey.130.t: "[FROM.GetNameDefCap]ลงทุนในอุตสาหกรรมทหารของเรา"
 bftb_turkey.130.desc: "เราเพิ่งไดรับแจงจากเจาหนาที่[FROM.GetAdjective]วาโครงการอุตสาหกรรมลับสุดยอดที่[FROM.GetAdjective]สนับสนุนเมื่อไมนานมานี้ไดเสร็จสมบูรณแลว ผูตรวจการของเราเองไปตรวจสถานที่กอสรางเพื่อใหแนใจวาทุกอยางเปนไปตามที่เราคาดหวัง และพวกเขาก็ไมผิดหวัง คาดวาโรงงานใหมจะเริ่มการผลิตไดทันที \n\nผูสังเกตการณ[FROM.GetAdjective]กลาวเมื่อโครงการเสร็จสิ้นวา[FROM.GetNameDef]ไมขัดของที่จะสนับสนุนโครงการคลายกันในอนาคต"
 bftb_turkey.130.a: "พวกเขาคือมิตรแทของชาว[ROOT.GetAdjective]"
 bftb_turkey.131.t: "[FROM.GetNameDefCap]เห็นชอบการแบงแยก[GRE.GetNameDef]"
 bftb_turkey.131.desc: "เราไดขอตกลงรวมกับ[FROM.GetNameDef]เรื่องวิธีจัดการการแบงแยก[GRE.GetNameDef]แลว [FROM.GetNameDefCap]จะไดรัฐที่ติดทะเลเมดิเตอรเรเนียนตะวันออกและทะเลไอโอเนียน สวนเราจะไดดินแดนใจกลางของ[GRE.GetAdjective]ที่มีทะเลอีเจียนรวมกับเรา นาเสียดายที่เรื่องนี้กลายเปนสิ่งจําเปน แต[GRE.GetNameDef]ไมไดใหทางเลือกอื่นแกเราเลย"
 bftb_turkey.131.a: "ขอพระผูเปนเจาโปรดอภัย แต[GRE.GetNameDef]จะตองถูกทําลาย"
 bftb_turkey.132.t: "[FROM.GetNameDefCap]ปฏิเสธแผนแบงแยก[GRE.GetNameDef]!"
 bftb_turkey.132.desc: "[FROM.GetNameDefCap]ปฏิเสธขอเสนออันสมเหตุสมผลของเราในการแบงแยก[GRE.GetNameDef] และเลือกการแยงชิงดินแดนอยางบาคลั่งโดยไมคํานึงถึงประชากรที่อาศัยอยูในดินแดนเหลานี้ ไมมีสิ่งที่เรียกวาการรุกราน 'อยางนุมนวล' แตอยางนอยก็ควรเปนไปอยางมีระเบียบและยับยั้งชั่งใจ - กลับกลายเปนวาชาว[FROM.GetAdjective]เลือกทําใหการรุกรานครั้งนี้เปนการแขงขันอันโกลาหลวุนวายเพื่อยึดครองดินแดนใหมากที่สุดกอนจะบีบใหชาว[GRE.GetAdjective]ยอมจํานน \n\nนี่ไมใชวิธีที่เราตองการ มันไมควรเปนแบบนี้! มรดกของเราพังพินาศไปตลอดกาลแลว!"
 bftb_turkey.132.a: "การแขงขันเริ่มแลว!"

 bftb_turkey.133.t: "มุสตาฟา เคมาล อตาเติรก ลมปวย"
 bftb_turkey.133.desc: "เมื่อวานนี้ มุสตาฟา เคมาล อตาเติรก ถูกนําตัวสงโรงพยาบาลอยางเรงดวนในสภาพอาการหนัก หลังหมดสติลมลงบนเรือยอชตขณะตอนรับเพื่อนเกา เหตุการณนี้เปนสัญญาณนากังวลลาสุดในหลายครั้งที่บงชี้วาสุขภาพของอตาเติรกทรุดลงอยางรวดเร็ว และที่ปรึกษาไดแสดงความกังวลเปนการสวนตัววาอตาเติรกทํางานหนักเกินไป ขณะที่อาการของเขาคาดเดาไดยากขึ้นเรื่อย ๆ \n\nแมเขาจะยืนกรานวาทุกอยางปกติดี แตรัฐบาลก็ถือเปนหนาที่ในการติดตามสุขภาพของมุสตาฟา เคมาล อตาเติรก และกําลังรวบรวมรายการมาตรการที่อาจตองดําเนินการ หากอตาเติรกไมยอมละจากหนาที่เพื่อดูแลรางกายที่ทรุดโทรม เราอาจตองพิจารณาบังคับใหเขาเกษียณ เพื่อใหเขาไดใชเวลาชวงสุดทายกับครอบครัว"
 bftb_turkey.133.a: "เรากําลังแขงกับเวลา"
 bftb_turkey.134.t: "การถึงแกอสัญกรรมของมุสตาฟา เคมาล อตาเติรก"
 bftb_turkey.134.desc: "\nสาธารณรัฐโศกเศรา \n\nวีรบุรุษสงคราม นักปฏิวัติ ประธานาธิบดี และบิดาแหงชาวเติรก มุสตาฟา เคมาล อตาเติรก ไดจากไปอยางสงบในขณะหลับ \n\nไมมีชายหรือหญิงคนใดหวังจะเทียบชั้นความเปนผูนําระดับตํานานของมุสตาฟา เคมาล อตาเติรก ได แตบิดาแหงชาวเติรกคงไมตองการใหสาธารณรัฐอันเปนที่รักของเขาตกอยูในความโกลาหลเพราะวิกฤตผูนํา \n\nเราไมไดมองหาผูมาแทนที่กาซีของเรา เพราะไมมีใครแมแตจะฝนเทียบบิดาผูกอตั้งชาติผูเปรียบดั่งพระผูไถได แตเราตองเลือกผูนําที่ไวใจไดวาจะเดินตามรอยอตาเติรก ผูนั้นตองเปนแบบอยางของคุณคาแบบเคมาลิสตและดําเนินตามแบบอยางของอตาเติรกในฐานะผูนําแหง[TUR.GetNameDef]"
 bftb_turkey.134.a: "เจลาล บายาร คือผูสมัครที่เห็นไดชัด"
 bftb_turkey.134.b: "เจลาล บายาร คือผูสมัครที่เห็นไดชัด"
 bftb_turkey.134.c: "อิสเมต อีเนอนู คือผูสืบทอดที่คูควรของอตาเติรก"
 bftb_turkey.134.d: "เฟฟซี ชักมัก คือผูนําที่[TUR.GetNameDef]ตองการ"
 bftb_turkey.134.e: "เฟฟซี ชักมัก จะนําความมั่นคงมาสูชาตินี้"
 bftb_turkey.134.f: "เรเจป เปเกร คือผูที่จะผสานลัทธิฟาสซิสตเขากับลัทธิเคมาล"
 bftb_turkey.134.g: "อัจฉริยภาพของเชฟเก็ต ซือเรยยา อายเดมีร จะพาเราผานพนไปได"
 bftb_turkey.134.h: "มีเพียงอิสเมต อีเนอนู ที่จะนําสังคมนิยมแบบ[TUR.GetAdjective]โดยเฉพาะมาใชได"
 bftb_turkey.134.i: "คาซึม ออรบาย จะนําคณะรัฐประหารทหารจนกวาเราจะพบหนทางของเรา"
 bftb_turkey.135.t: "การถึงแกอสัญกรรมของมุสตาฟา เคมาล อตาเติรก"
 bftb_turkey.135.desc: "\nสาธารณรัฐโศกเศรา \n\nวีรบุรุษสงคราม นักปฏิวัติ ประธานาธิบดี และบิดาแหงชาวเติรก มุสตาฟา เคมาล อตาเติรก ไดจากไปอยางสงบในขณะหลับ \n\nเขาปฏิบัติหนาที่ตอชาวเติรกและสาธารณรัฐที่เขากอตั้งจนถึงวาระสุดทาย ผูไวอาลัยนับพันมาแสดงความเคารพที่อิสตันบูล กอนที่รางของเขาจะถูกเคลื่อนยายดวยรถปนใหญ เรือ และรถไฟไปยังอังการา ที่นั่นมีการจัดรัฐพิธีศพโดยมีสมาชิกรัฐสภาทั้งหมดและบุคคลสําคัญจากทั่วโลกเขารวม\n\nเมื่อบิดาแหงชาติตุรกียุคใหมจากไปแลว สาธารณรัฐตองกาวตอไป [ROOT.GetLeader]เปนหนึ่งในผูกลาวสดุดีในพิธีศพของอตาเติรก และในสุนทรพจน เขาใหคํามั่นวาจะสานตอมรดกของบุรุษผูมีบทบาทสําคัญยิ่งในการกอบกูเสรีภาพของชาติ"
 bftb_turkey.135.a: "หลับใหสบายเถิด กาซีของเรา เราจะไมมีวันลืมทาน"
 bftb_turkey.136.t: "โศกนาฏกรรมเกิดแกราชวงศออตโตมัน!"
 bftb_turkey.136.desc: "ความทุกขโศกปกคลุมระบอบสุลตานออตโตมันอันภาคภูมิของเรา เมื่อขาวการสิ้นพระชนมอยางกะทันหันและไมคาดคิดของสุลตานแพรไปถึงหูของประชาชาติ สุลตานและพระโอรสเสด็จเยือนทุงนาอันอุดมสมบูรณแหงนิกซาร และกําลังเดินปาบนเทือกเขาจานิกในซัมซุน เมื่อเกิดแผนดินไหวในจังหวัดนั้น พระศพของราชวงศออตโตมันถูกพบในอีกสามวันตอมา ทําใหราชสํานักตกอยูในความตื่นตระหนกโกลาหล \n\nดวยการแกไขกฎมณเฑียรบาลวาดวยการสืบราชสันตติวงศของออตโตมัน ดูเหมือนวาพระธิดาองคโตของสุลตานจะเปนรัชทายาท พระนางทรงมีพระทัยเด็ดเดี่ยวและทรงพระปรีชาสามารถยิ่ง แตกลุมอนุรักษนิยมจํานวนมากในสถาบันศาสนาของเราอาจคัดคานการใหสตรีขึ้นครองบัลลังกออตโตมัน"
 bftb_turkey.136.a: "สุลตานาองคใหมทรงพระเจริญ!"
 bftb_turkey.136.b: "ผูหญิงหรือ!? รับไมได! เราตองมีผูสําเร็จราชการ!"
 bftb_turkey.137.t: "[FROM.GetNameDefCap]ใชนโยบายตางประเทศที่เปนอันตราย"
 bftb_turkey.137.desc: "รัฐบาล[FROM.GetNameDef]เลือกเปลี่ยนทิศทางนโยบายตางประเทศ: ทิศทางที่ไมเอื้อตอแผนนโยบายตางประเทศของเรา ผูแทนจาก[FROM.GetNameDef]แจงนักการทูตของเราวาพวกเขาไมมีเจตนาจะเปลี่ยนกลับจากเสนทางอันเปนภัยในปจจุบัน"
 bftb_turkey.137.a: "พวกเขากลายเปนสิ่งที่ตนเองเคยสาบานวาจะทําลายเสียเอง"
 bftb_turkey.137.b: "พวกเขาคือผูทรยศตอการปฏิวัติ!"
 bftb_turkey.137.c: "บางทีพวกเขาอาจกําลังทดลองแนวทางสังคมนิยมในประเทศเดียวอยูก็ได?"
 bftb_turkey.137.d: "ตราบใดที่พวกเขาไมยุงกับพันธมิตรของเรา..."
 bftb_turkey.137.e: "เห็นไดชัดวาเราไวใจพวกเขาไมไดอีกตอไป"
 TUR_keeping_turkey_under_observation: "เราจะจับตาการกระทําของ §Y[TUR.GetNameDef]§! อยางใกลชิด และจะขับพวกเขาออกจากฝายของเราในอนาคตหากจําเปน"
 bftb_turkey.138.t: "[FROM.GetNameDefCap] ละเมิดอธิปไตยของสมาชิกฝาย!"
 bftb_turkey.138.desc: "ดังที่ผูเชี่ยวชาญดานนโยบายตางประเทศของเราคาดการณไว [FROM.GetNameDef] หันเปาไปยังพันธมิตรของตนเอง เราไดตําหนิผูแทน[FROM.GetAdjective]อยางรุนแรงถึงการตัดสินใจอันบุมบามของรัฐบาลของพวกเขา แตดูเหมือนจะไมไดผลอะไรเลย"
 bftb_turkey.138.a: "ใหโอกาสพวกเขาอีกครั้งเดียว ครั้งเดียวเทานั้น"
 bftb_turkey.138.b: "การปกปองรัฐอันธพาลนี้ตอไปไมมีอะไรดีเกิดขึ้นแน"
 bftb_turkey.139.t: "[FROM.GetNameDefCap] ละเมิดอธิปไตยของสมาชิกฝายอีกครั้ง!"
 bftb_turkey.139.desc: "เหลาโจรที่กุมอํานาจใน [FROM.GetNameDef] ทรยศความไววางใจของเราอีกครั้ง ละครฉากนี้ไมอาจทนไดอีกตอไป เราไมอาจรักษาความเคารพจากพันธมิตรได หากยังคงปกปองประเทศที่เปนศัตรูอยางชัดแจง"
 bftb_turkey.139.a: "เราเตือนพวกเขาแลว!"
 bftb_turkey.140.t: "[FROM.GetNameDefCap] สงคําเตือน"
 bftb_turkey.140.desc: "รัฐบาล[FROM.GetAdjective]ไดเตือนเราวาอยาละเมิดอธิปไตยของสมาชิกรวมฝายอีก พวกเขายอมอภัยใหการกระทําของเราในครั้งนี้ แตหากเรายังเคลื่อนไหวตอตานพันธมิตรของตนเองอีก [FROM.GetNameDef] จะตองลงมือดําเนินการ"
 bftb_turkey.140.a: "เราจะทําตามที่เราตองการ"
 bftb_turkey.141.t: "[FROM.GetNameDefCap] ขับเราออกจาก [FROM.GetFactionName]!"
 bftb_turkey.141.desc: "นโยบายตางประเทศใหมของเราเปนสิ่งที่ [FROM.GetNameDef] ไมอาจยอมรับได และพวกเขาตัดสินใจวาเราไมใชพันธมิตรอีกตอไป นับแตวันนี้ เราไมไดเปนสวนหนึ่งของ [FROM.GetFactionName] อีกแลว"
 bftb_turkey.141.a: "ก็ตามนั้น"

 TUR_downgrade_fundamentalist_defiance_effect_tt: "กลุม£faction_tur_traditionalist §Yจารีตนิยม§! จะใหความรวมมือกับรัฐบาลมากขึ้นใน §Y[TUR_fundamentalist_state.GetName]§!"
 TUR_upgrade_fundamentalist_defiance_effect_tt: "กลุม£faction_tur_traditionalist §Yจารีตนิยม§! จะเพิ่มความรุนแรงของการตอตานรัฐบาลใน §Y[TUR_fundamentalist_state.GetName]§!"
 TUR_placate_fundamentalist_state_effect_tt: "กลุม£faction_tur_traditionalist §Yจารีตนิยม§! จะยุติวาทกรรมทั้งหมดที่โจมตีรัฐบาลใน §Y[TUR_fundamentalist_state.GetName]§! และหันมาเรียกรองใหรวมมืออยางแข็งขัน"
 TUR_placate_fundamentalist_state_all_targets_effect_tt: "กลุม£faction_tur_traditionalist §Yจารีตนิยม§! จะพรอมใจกันยุติการตอตานรัฐบาล"

 bftb_bulgaria_tsar_boris.1.t: "ซารบอริสที่ 3 เสด็จเยือน [GetDestinationName]"
 bftb_bulgaria_tsar_boris.1.desc_success: "วันนี้ ซารบอริสเสด็จเยือน [GetDestinationName] เสร็จสิ้นแลว ระหวางนั้นพระองคทรงไดสัมผัสความปติยินดีของชาวเมืองที่มารวมตัวกันโหรองตอนรับขบวนเสด็จ ซึ่งเคลื่อนผานถนนสายสําคัญที่สุดหลายสายของเมือง\nแตการเสด็จเยือนครั้งนี้มิไดมีไวเพื่อความบันเทิงของสามัญชนเทานั้น ในหลายวันหลังจากซารเสด็จมาถึง ยังมีงานเลี้ยงอันหรูหรา งานตอนรับอันยิ่งใหญ และการพบปะกับชนชั้นนําสูงสุดของทองถิ่นอีกดวย\n\nโดยรวมแลว การเสด็จเยือนบรรลุจุดประสงคในการกระชับสัมพันธกับสมาชิกผูมั่งคั่งที่สุดของชุมชน และแสดงใหสามัญชนเห็นวาซารทรงเปนผูปกครองที่มีพระเมตตาและใกลชิดกับราษฎร"
 bftb_bulgaria_tsar_boris.1.desc_extra_success: "การเสด็จเยือน [GetDestinationName] ประสบความสําเร็จอยางงดงาม! หลังขบวนเสด็จไปถึงศาลากลางเพื่อพบนายกเทศมนตรีแลว ซารทรงตัดสินพระทัยเสด็จพระราชดําเนินผานยานอันเรียบงายแหงหนึ่งของ [GetDestinationName] เพื่อทรงพบปะกับประชาชน\nชาวเมืองตอนรับบอริสอยางอบอุนที่สุด ทุกคนยินดีที่ไดเห็นผูปกครองของตนเสด็จไปตามทองถนน และไมนอยที่นําของขวัญเรียบงายมาถวายดวยความยินดี ตั้งแตพวงมาลัยดอกไม ผลิตภัณฑทองถิ่น ไปจนถึงงานหัตถกรรมไมและเหล็กชิ้นเล็กๆ\n\nไมแนชัดวาการตอนรับอันจริงใจและเรียบงายนี้ไดกระทบพระราชหฤทัยของซารหรือไม แตที่แนๆ คือในครั้งนี้ แทนที่จะเปนงานเลี้ยงรับรองสวนพระองคและงานเลี้ยงในสวนเฉพาะกลุม ซารทรงตัดสินพระทัยจัดงานเลี้ยงใหญใหประชาชนทุกคนไดสนุกรวมกัน ไมตองบอกก็รูวาชาวเมือง [GetDestinationName] ปลาบปลื้มกับความคิดนี้มาก และทุกคนกลับบานดึกดื่นดวยความพอใจยิ่งหลังงานจบลง"
 bftb_bulgaria_tsar_boris.1.desc_failure: "การเสด็จเยือน [GetDestinationName] กลายเปนหายนะตอความนิยมในตัวซาร ตั้งแตชวงแรกของการเสด็จก็เห็นไดแลววาชาวเมืองซึ่งสวนใหญยากจนที่มารวมตัวตอนรับขบวนเสด็จไมไดมีความยินดีนัก และยังไดยินเสียงโหไลดังขึ้นเปนระยะในฝูงชน\n\nสถานการณเลวรายลงเมื่อประชาชนรวมตัวประทวงรอบศาลากลาง ขณะที่กษัตริยและพระราชวงศกําลังเพลิดเพลินกับงานตอนรับอันโออาและงานเลี้ยงหรูหรารวมกับชนชั้นอภิสิทธิ์ของสังคม ผูคนวิพากษวิจารณความฟุมเฟอยเชนนี้ และกลาวโทษชนชั้นสูงวาเปนตนเหตุของปญหาเศรษฐกิจและสังคมทั้งหมดที่ประเทศเผชิญมาในชวงหลายทศวรรษที่ผานมา\n\nเพื่อตอบโต ตํารวจไดรับคําสั่งใหสลายการชุมนุมทันที แตการใชความรุนแรงกลับยิ่งทําใหสถานการณแยลง และการชุมนุมก็บานปลายกลายเปนการจลาจล"
 bftb_bulgaria_tsar_boris.1.a: "การเสด็จเยือนครั้งถัดไปกําหนดไวเมื่อไร?"
 bftb_bulgaria_tsar_boris.1.b: "คํ่าคืนที่พวกเขาจะจดจําไปอีกนาน!"
 bftb_bulgaria_tsar_boris.1.c: "ถาอยางนั้นก็งดงานเลี้ยงไปสักพัก..."
 bftb_bulgaria_tsar_boris.2.t: "การสวรรคตของซารบอริสที่ 3"
 bftb_bulgaria_tsar_boris.2.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 BUL_context_of_death_basic: "หลังจากทรงประชวรหนักมาหนึ่งสัปดาห ซารบอริสที่ 3 ไดสวรรคตแลวในวันนี้ [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong] ณ [BUL.Capital.GetName] โดยคาดวาเปนเพราะภาวะหัวใจลมเหลว"
 BUL_context_of_death_assassinated: "เมื่อไมกี่ชั่วโมงกอน ขณะซารบอริสที่ 3 กําลังเสด็จออกจากมหาวิทยาลัยโซเฟยหลังทรงรวมการประชุมสมัชชาแหงชาติประจําปวาดวยไบแซนไทนศึกษา มีชายผูหนึ่งพุงเขาหาซารอยางรวดเร็ว ชักอาวุธออกมาและยิงใสบอริสหลายนัด กอนจะถูกเจาหนาที่รักษาความปลอดภัยยิงลมลง ไมกี่นาทีตอมา ทั้งซารบอริสที่ 3 และมือสังหารตางสิ้นชีวิต"
 BUL_context_of_death_ger: "ไมนานหลังเสด็จกลับถึง [BUL.Capital.GetName] จากการพบปะอันตึงเครียดเกินคาดกับ [GER.GetLeader] [GetBorisGermanMeetingLocation] ซารบอริสที่ 3 ก็สวรรคตโดยคาดวาเปนเพราะภาวะหัวใจลมเหลว"
 BUL_boris_german_meeting_location_historical: "ที่กองบัญชาการทหารในปรัสเซียตะวันออก รังหมาปา ณ ราสเตนบวรก"
 BUL_boris_german_meeting_location_capital: "ใน [GER.Capital.GetName]"
 BUL_context_of_death_sov: "หลังซารเสด็จกลับถึง [BUL.Capital.GetName] จากการพบปะกับ [SOV.GetLeader] ใน [SOV.Capital.GetName] ซารบอริสที่ 3 ก็สวรรคตโดยคาดวาเปนเพราะภาวะหัวใจลมเหลว"
 BUL_context_of_death_eng: "หนึ่งสัปดาหหลังเสด็จกลับถึง [BUL.Capital.GetName] จากการพบปะกับ [ENG.GetLeader] ใน [ENG.Capital.GetName] ซารบอริสที่ 3 ก็สวรรคตโดยคาดวาเปนเพราะภาวะหัวใจลมเหลว"
 BUL_popular_suspicions_about_death_basic: "อยางไรก็ตาม สาเหตุการสวรรคตยังไมชัดเจน และมีการคาดเดาวาบอริสถูกวางยาพิษระหวางการพบปะครั้งสุดทาย หลายคนเชื่อวาเปนคําสั่งของ [GER.GetLeader] บางคนก็มั่นใจวาเปนฝมือของ NKVD ที่วางยาซาร มีคนชี้ไปที่ [ENG.GetNameDef] และที่นาหวั่นใจก็คือ บางคนถึงกับกลากลาววารัฐบาล[BUL.GetAdjective]เองมีสวนเกี่ยวของกับการสวรรคตของซาร..."
 BUL_popular_suspicions_about_death_assassinated: "หนวยงานความมั่นคงแหงชาติไดเปดการสอบสวนเพื่อหาตัวผูรับผิดชอบการปลงพระชนมครั้งนี้ ตามรายงานทางการ คนรายมีเอกสารของบัลแกเรีย เยอรมนี และอังกฤษอยูในครอบครอง ซึ่งยิ่งทําใหการสอบสวนซับซอนและโหมกระแสขาวลือ ชาวบัลแกเรียสวนใหญโทษ [GER.GetLeader], NKVD หรือฝาย[ENG.GetAdjective] แตก็มีบางคนกลากลาววารัฐบาลเองมีสวนเกี่ยวของกับการลอบปลงพระชนมซาร..."
 bftb_bulgaria_tsar_boris.2.a: "นาหวั่นใจจริงๆ..."
 bftb_bulgaria_tsar_boris.3.t: "คณะผูสําเร็จราชการ"
 bftb_bulgaria_tsar_boris.3.desc: "ถึงเวลาแตงตั้งสมาชิกคณะผูสําเร็จราชการที่จะปกครอง [ROOT.GetNameDef] แทนรัชทายาทของบอริส คือซีเมียนที่ 2 แลว\n\nเราตองเลือกผูที่เหมาะสมที่สุดจากเชื้อพระวงศและชนชั้นนําทางการเมืองและการทหาร แตตองเลือกอยางรอบคอบ เพราะแตละคนตางมีความภักดีของตนเอง และประเทศของเราเคยประสบหายนะและความพินาศจากการตัดสินใจของผูนํามาแลวในอดีต..."
 bftb_bulgaria_tsar_boris.3.a: "จัดตั้งรัฐบาลที่ฝกใฝฝายอักษะ"
 bftb_bulgaria_tsar_boris.3.b: "จัดตั้งรัฐบาลที่ฝกใฝฝายสัมพันธมิตร"
 bftb_bulgaria_tsar_boris.3.c: "จัดตั้งรัฐบาลที่เปนอิสระ"
 bftb_bulgaria_factions.10.t: "เปดโปงแผนสมคบคิดของซเวโน"
 bftb_bulgaria_factions.10.desc: "แหลงขาวที่เชื่อถือไดแจงเราวา สมาชิกซเวโนบางคนซึ่งเคยวิจารณระบอบอยางเปดเผยมาแลวหลายครั้ง เพิ่งติดตอกับนายทหารจํานวนหนึ่ง แมเราจะไมรูแนชัดวาการพบปะเหลานี้มีจุดประสงคอะไร หรือนายทหารที่พวกเขาเขาหาคือใคร แตไมตองสงสัยเลยวาความเคลื่อนไหวนาสงสัยของซเวโนครั้งนี้เปนสวนหนึ่งของแผนการใหญอันคลุมเครือ..."
 bftb_bulgaria_factions.10.a: "สืบสวนตอไป!"
 bftb_bulgaria_factions.10.b: "รอใหพวกเขาลงมือกอน..."
 bftb_bulgaria_factions.11.t: "เปดโปงผูสมคบคิดซเวโน"
 bftb_bulgaria_factions.11.desc: "หลังการสอบสวนอยางละเอียดและการติดตอสมาชิกซเวโนบางคนที่ภักดีตอระบอบ เราไดเปดโปงแผนการของทหารที่จะโคนลมรัฐบาล \nในรายชื่อผูที่เกี่ยวของกับการสมคบคิดนี้ ปรากฏชื่อของนายพลคนหนึ่งที่เราไววางใจที่สุด: [?BUL_zveno_conspirator.GetName]\n\nตอนนี้เราตองตัดสินใจวาจะทําอยางไรกับบุคคลที่ดูเหมือนไมภักดีผูนี้"
 bftb_bulgaria_factions.11.a: "กําจัดเขาเสียเดี๋ยวนี้!"
 bftb_bulgaria_factions.11.b: "เราไมควรดวนสรุป"
 bftb_bulgaria_factions.12.t: "ซเวโนเตรียมกอรัฐประหาร"
 bftb_bulgaria_factions.12.desc: "มีขาวมาถึงเราวาในที่สุดซเวโนก็กลาเตรียมการขั้นสุดทายสําหรับรัฐประหารที่พวกเขาคอยๆ เตรียมมาเปนเวลานาน\nพวกเขาจะพยายามโคนลมรัฐบาลเหมือนที่ทําเมื่อป 1934 แตคราวนี้เราจะไมปลอยใหพวกเขาสําเร็จ และจะกวาดลางองคกรตัวปญหานี้ใหสิ้นซากเสียที"
 bftb_bulgaria_factions.12.a: "เราจะบดขยี้พวกมัน!"
 bftb_bulgaria_factions.17.t: "ผนวกรวมซเวโนแลว"
 bftb_bulgaria_factions.17.desc: "ในที่สุดเราก็ผนวกรวมซเวโนเขากับรัฐบาลได เปนการเสริมความรวมมือที่กอตัวขึ้นแลวระหวางสมาชิกขององคกรเดิมนี้กับพรรคของเรา ดวยวิธีนี้ เราสามารถสงเสริมความรวมมือในโครงการที่ใหญขึ้น โดยมีผูมีมันสมองชั้นเลิศที่สุดบางคนของประเทศทํางานรวมกัน"
 bftb_bulgaria_factions.17.a: "ใหมันสมองเหลานั้นเริ่มทํางานทันที!"
 bftb_bulgaria_factions.19.t: "ซเวโนถูกทําลายแลว!"
 bftb_bulgaria_factions.19.desc: "ตลอดหลายสัปดาหที่ผานมา ตํารวจไดกวาดลางเศษซากของซเวโน ซึ่งออนแอลงอยางหนักและขาดการจัดระเบียบอยูแลวเพราะไรผูนําที่เขมแข็งหลังการจับกุมที่เราทํากอนปฏิบัติการนี้\nตอนนี้เรากลาวไดอยางมั่นใจวาซเวโนไดสิ้นสภาพไปจาก [ROOT.GetNameDef] แลว ซึ่งมีแตจะเปนประโยชนตอประเทศและรัฐบาล"
 bftb_bulgaria_factions.19.a: "ขาวดีเยี่ยม!"

 bftb_bulgaria_factions.20.t: "การนัดหยุดงานของแรงงาน"
 bftb_bulgaria_factions.20.desc: "สมาชิกกลุมสังคมนิยมสายกวางไดรวมมือกับพวกคอมมิวนิสตในความพยายามจุดชนวนการนัดหยุดงานทั่วประเทศในหมูแรงงานอุตสาหกรรม ผานการประชุมและการชุมนุมลับ พวกเขาสามารถรวบรวมแรงสนับสนุนและความเห็นใจอยางมากในหมูชนชั้นกรรมาชีพบัลแกเรีย\nเราตองระมัดระวังเมื่อจะจัดระเบียบในภูมิภาคที่ผูนัดหยุดงานเหลานี้ไดรับความนิยมมากที่สุด มิฉะนั้นสถานการณอาจบานปลายเปนสิ่งที่รายแรงกวาการนัดหยุดงาน..."
 bftb_bulgaria_factions.20.a: "ความหิวโหยจะตอนพวกเขากลับเขาคอกเอง"
 bftb_bulgaria_factions.20.b: "เราตองบดขยี้พวกมันไมวาจะตองแลกดวยอะไร!"
 bftb_bulgaria_factions.21.t: "การจลาจลกอความเสียหายขางเคียง"
 bftb_bulgaria_factions.21.desc: "หลังกองกําลังของเราเขาแทรกแซงผูนัดหยุดงาน การปะทะอยางรุนแรงและการจลาจลไดลุกลามไปทั่วเขตอุตสาหกรรม ใน [?BUL.BUL_damaged_civs_state.GetName] การจลาจลไดสรางความเสียหายแกโรงงานพลเรือนจํานวนหนึ่ง[GetMilitaryFactoriesDamaged][GetInfrastructureDamaged]"
 bftb_bulgaria_factions.21.a: "ผลลัพธที่นาเสียดาย..."
 BUL_bs_strikes_no_military_factories_damaged: ""
 BUL_bs_strikes_military_factories_damaged_same_state: " ขณะที่กลุมคอมมิวนิสตหลายกลุมพยายามบอนทําลายการผลิตอาวุธของเราดวยการกอวินาศกรรมสิ่งอํานวยการทางทหารในรัฐนี้"
 BUL_bs_strikes_military_factories_damaged_other_state: " สวนใน [?BUL.BUL_damaged_mils_state.GetName] กลุมคอมมิวนิสตหลายกลุมพยายามบอนทําลายการผลิตอาวุธของเราดวยการกอวินาศกรรมสิ่งอํานวยการทางทหาร"
 BUL_bs_strikes_no_infrastructure_damaged: ""
 BUL_bs_strikes_infrastructure_damaged: " การจลาจลยังทําใหถนน ทางรถไฟ และการคมนาคมใน [?BUL.BUL_damaged_infrastructure_state.GetName] เสียหายและถูกปดกั้น"
 bftb_bulgaria_factions.27.t: "ผนวกรวมสังคมนิยมสายกวางแลว"
 bftb_bulgaria_factions.27.desc: "ในที่สุดเราก็ผนวกรวมกลุมสังคมนิยมสายกวางเขากับรัฐบาลได เปนการเสริมความรวมมือที่กอตัวขึ้นแลวระหวางสมาชิกขององคกรเดิมนี้กับพรรคของเรา ดวยวิธีนี้ เราสามารถสงเสริมความรวมมือในโครงการที่ใหญขึ้น โดยมีผูมีมันสมองชั้นเลิศที่สุดบางคนของประเทศทํางานรวมกัน"
 bftb_bulgaria_factions.27.a: "เราตองพึ่งพากันเพื่อไปสูความยิ่งใหญ!"
 bftb_bulgaria_factions.29.t: "สังคมนิยมสายกวางถูกทําลายแลว"
 bftb_bulgaria_factions.29.desc: "ตลอดหลายสัปดาหที่ผานมา ตํารวจไดกวาดลางเศษซากของกลุมสังคมนิยมสายกวาง ซึ่งออนแอลงอยางหนักและขาดการจัดระเบียบอยูแลวเพราะไรผูนําที่เขมแข็งหลังการจับกุมที่เราทํากอนปฏิบัติการนี้\nตอนนี้เรากลาวไดอยางมั่นใจวากลุมสังคมนิยมสายกวางไดสิ้นสภาพไปจาก [ROOT.GetNameDef] แลว ซึ่งมีแตจะเปนประโยชนตอประเทศและรัฐบาล"
 bftb_bulgaria_factions.29.a: "ใชเวลาอยูบาง..."

 bftb_bulgaria_factions.30.t: "ความนิยมของกลุมเกษตรกรรมพุงสูงในชนบท"
 bftb_bulgaria_factions.30.desc: "สหภาพเกษตรกรแหงชาติกําลังดําเนินการรณรงคโฆษณาชวนเชื่ออยางผิดกฎหมายไปทั่วเขตชนบทของประเทศ ซึ่งชาวนานับพันถูกชักจูงใหไมไววางใจรัฐบาลและเขารวมกับพวกเขา\nกลุมเกษตรกรรมวิพากษนโยบายนิยมสงครามในอดีตเปนพิเศษ ซึ่งนําความพินาศและความอัปยศมาสูบัลแกเรีย และพยายามหาความคลายคลึงเพียงเล็กนอยกับนโยบายของรัฐบาลปจจุบัน เพื่อสรางความไมพอใจและความไมแนนอนในหมูประชาชน"
 bftb_bulgaria_factions.30.a: "ยอมรับไมไดโดยสิ้นเชิง!"
 bftb_bulgaria_factions.31.t: "ความแตกแยกภายในสหภาพเกษตรกรแหงชาติ"
 bftb_bulgaria_factions.31.desc: "แมที่ผานมากลุมเกษตรกรรมกับพวกคอมมิวนิสตจะไมคอยมีประวัติความรวมมือกันนัก แตดูเหมือนวาการมีเปาหมายรวมในการโคนลมรัฐบาลไดทําใหบางปกของสหภาพเกษตรกรแหงชาติกับพรรคคอมมิวนิสตรวมตัวกันได\nสมาชิกกลุมเกษตรกรรมบางสวนตัดสินใจออกจากองคกรไปเขารวมกับคอมมิวนิสต ขณะที่อีกสวนซึ่งอนุรักษนิยมกวายังคงยึดมั่นทั้งในการตอสูกับชนชั้นกระฎมพีและการปฏิเสธลัทธิบอลเชวิค และพยายามหาชองทางทางการเมืองเพื่อบรรลุความเขาใจกับรัฐบาล"
 bftb_bulgaria_factions.31.a: "หนูสกปรกพวกนี้!"
 bftb_bulgaria_factions.37.t: "ผนวกรวมสหภาพเกษตรกรแหงชาติแลว"
 bftb_bulgaria_factions.37.desc: "ในที่สุดเราก็ผนวกรวมสหภาพเกษตรกรแหงชาติเขากับรัฐบาลได เปนการเสริมความรวมมือที่กอตัวขึ้นแลวระหวางสมาชิกขององคกรเดิมนี้กับพรรคของเรา ดวยวิธีนี้ เราสามารถสงเสริมความรวมมือในโครงการที่ใหญขึ้น โดยมีผูมีมันสมองชั้นเลิศที่สุดบางคนของประเทศทํางานรวมกัน"
 bftb_bulgaria_factions.37.a: "นี่จะนําประโยชนมหาศาลมาสูประเทศ"
 bftb_bulgaria_factions.39.t: "สหภาพเกษตรกรแหงชาติถูกทําลายแลว"
 bftb_bulgaria_factions.39.desc: "ตลอดหลายสัปดาหที่ผานมา ตํารวจไดกวาดลางเศษซากของสหภาพเกษตรกรแหงชาติ ซึ่งออนแอลงอยางหนักและขาดการจัดระเบียบอยูแลวเพราะไรผูนําที่เขมแข็งหลังการจับกุมที่เราทํากอนปฏิบัติการนี้\nตอนนี้เรากลาวไดอยางมั่นใจวาสหภาพเกษตรกรแหงชาติไดสิ้นสภาพไปจาก [ROOT.GetNameDef] แลว ซึ่งมีแตจะเปนประโยชนตอประเทศและรัฐบาล"
 bftb_bulgaria_factions.39.a: "พวกมันหายไปตลอดกาลแลว!"
 
 bftb_bulgaria_factions.40.t: "เดินขบวนสู [GetMarchDestinationName]"
 bftb_bulgaria_factions.40.desc: "ขบวนการสังคมแหงชาติเลียนแบบวิธีการที่สหภาพกองทหารบัลแกเรียหนุมเคยใชเพิ่มความนิยมเมื่อหลายปกอน ดวยการจัดเดินขบวนจาก [Root.Capital.GetName] ไปยัง [GetMarchDestinationName]\nผูประทวงเดินถือคบเพลิงอยางที่พวกนาซีเคยทํา เรียกรองมาตรการที่เด็ดขาดยิ่งขึ้นในการปราบปรามและกําจัดกลุมบอลเชวิคที่บอนทําลาย การจัดตั้งสหภาพแรงงานแหงชาติเพื่อตอตานการตอสูทางชนชั้น และใหรัฐเขาแทรกแซงเศรษฐกิจและสังคมบัลแกเรียอยางแข็งขันยิ่งขึ้น\nจนถึงตอนนี้ดูเหมือนการเดินขบวนจะไดรับความนิยมไมนอยในหมูคนหนุมสาวในเมือง หากเราตองการหยุดการชุมนุมแบบนี้ ก็ควรลงมือใหเร็วเขาไว"
 bftb_bulgaria_factions.40.a: "นั่นไมใชการประทวงแบบตนฉบับดวยซํ้า!"
 bftb_bulgaria_factions.40.b: "เราตองทําใหพวกมันเงียบกอนจะกลายเปนภัยที่ใหญกวานี้"
 bftb_bulgaria_factions.47.t: "ผนวกรวมขบวนการสังคมแหงชาติแลว"
 bftb_bulgaria_factions.47.desc: "ในที่สุดเราก็ผนวกรวมขบวนการสังคมแหงชาติเขากับรัฐบาลได เปนการเสริมความรวมมือที่กอตัวขึ้นแลวระหวางสมาชิกขององคกรเดิมนี้กับพรรคของเรา ดวยวิธีนี้ เราสามารถสงเสริมความรวมมือในโครงการที่ใหญขึ้น โดยมีผูมีมันสมองชั้นเลิศที่สุดบางคนของประเทศทํางานรวมกัน"
 bftb_bulgaria_factions.47.a: "เราก็พูดกันเรื่อยมาวามันเปนไปเพื่อสิ่งที่ดีกวา..."
 bftb_bulgaria_factions.49.t: "ขบวนการสังคมนิยมแหงชาติถูกทําลายแลว"
 bftb_bulgaria_factions.49.desc: "ตลอดหลายสัปดาหที่ผานมา ตํารวจไดกวาดลางเศษซากของขบวนการสังคมแหงชาติ ซึ่งออนแอลงอยางหนักและขาดการจัดระเบียบอยูแลวเพราะไรผูนําที่เขมแข็งหลังการจับกุมที่เราทํากอนปฏิบัติการนี้\nตอนนี้เรากลาวไดอยางมั่นใจวาขบวนการสังคมแหงชาติไดสิ้นสภาพไปจาก [ROOT.GetNameDef] แลว ซึ่งมีแตจะเปนประโยชนตอประเทศและรัฐบาล"
 bftb_bulgaria_factions.49.a: "ไมมีใครคิดถึงพวกมันหรอก!"

 bftb_bulgaria_factions.50.t: "ปราบปรามสมาชิกซเวโน"
 bftb_bulgaria_factions.50.desc: "เราปราบปรามองคกรซเวโนไดสําเร็จ โดยจับกุมสมาชิกที่มีรายงานวาพูดตอตาน [ROOT.GetLeader] อยางเปดเผย หรือถึงขั้นสมคบคิดโคนลมรัฐบาล"
 bftb_bulgaria_factions.50.a: "พวกมันไดรับสิ่งที่สมควรไดรับแลว"
 bftb_bulgaria_factions.51.t: "ปราบปรามสมาชิกซเวโน"
 bftb_bulgaria_factions.51.desc: "กองกําลังความมั่นคงของเราไดปฏิบัติการปราบปรามครั้งใหญตอองคกรซเวโน หัวหนาปฏิบัติการอางวาเจาหนาที่ตํารวจจับกุมตัวปวนไดจํานวนมากระหวางการประชุมลับขององคกร และถือวาผลของปฏิบัติการครั้งนี้ประสบความสําเร็จอยางยิ่ง"
 bftb_bulgaria_factions.51.a: "ขาวดีเยี่ยม!"
 bftb_bulgaria_factions.52.t: "ปราบปรามสมาชิกซเวโน"
 bftb_bulgaria_factions.52.desc: "นาเสียดายที่ความพยายามปราบปรามองคกรซเวโนของเราลมเหลว ตํารวจบุกเขาไปในสิ่งที่เชื่อวาเปนการประชุมลับซึ่งซเวโนกําลังวางแผนตอตานรัฐบาล แตแมที่นั่นจะมีสมาชิกซเวโนอยูจริง การประชุมนั้นกลับไมเกี่ยวกับองคกรของพวกเขาหรือแมแตการเมืองเลย \nไมตองบอกก็รูวาปฏิบัติการของตํารวจครั้งนี้ไมเปนที่นิยมนักในหมูประชาชนบัลแกเรีย ยิ่งในหมูซเวโนยิ่งไมตองพูดถึง..."
 bftb_bulgaria_factions.52.a: "นาอับอายเสียจริง..."
 bftb_bulgaria_factions.53.t: "ปฏิบัติการจับกุมผูนําซเวโน"
 bftb_bulgaria_factions.53.desc: "ปฏิบัติการจับกุมผูนําซเวโนประสบความสําเร็จ บุคคลสําคัญหลายคน รวมถึงคีมอน เกออรกีเยฟเอง ถูกจับกุม ซึ่งเปนการโจมตีที่รายแรงตอองคกร"
 bftb_bulgaria_factions.53.a: "พวกมันจะไมสามารถกอปญหาไดอีกแลว!"
 bftb_bulgaria_factions.54.t: "ปฏิบัติการจับกุมผูนําซเวโน"
 bftb_bulgaria_factions.54.desc: "ปฏิบัติการจับกุมผูนําซเวโนไมไดสําเร็จอยางที่เราคาดไว แมตํารวจจะจับกุมบุคคลสําคัญไดบางคน แตผูนําองคกรอยางคีมอน เกออรกีเยฟหลบหนีไปได และแมตอนนี้จะตองหลบซอนตัว เขาก็ยังคงนําซเวโนตอไป"
 bftb_bulgaria_factions.54.a: "ผลลัพธที่นาผิดหวัง..."
 bftb_bulgaria_factions.55.t: "ปฏิบัติการจับกุมผูนําซเวโน"
 bftb_bulgaria_factions.55.desc: "ปฏิบัติการจับกุมผูนําซเวโนลมเหลวโดยสิ้นเชิง ตํารวจบุกเขาไปในการประชุมลับ แตเจาหนาที่ซึ่งมีจํานวนนอยกวามากไมสามารถควบคุมตัวผูเขารวมประชุมได พวกเขารีบหลบหนีออกไปโดยมีตํารวจไลตาม จนเกิดการปะทะอยางรุนแรงไปทั่วทองถนนในเมือง และมีพลเมืองผูบริสุทธิ์บาดเจ็บจํานวนมาก เมื่อเห็นความโหดรายของตํารวจเชนนี้ พลเรือนจํานวนมากในพื้นที่อดไมไดที่จะเห็นใจซเวโน ชวยใหสมาชิกขององคกรหลบหนี และถึงขั้นเขารวมตอสูกับกองกําลังของรัฐ"
 bftb_bulgaria_factions.55.a: "ตองมีคนรับผิดชอบความลมเหลวนี้!"
 bftb_bulgaria_factions.60.t: "ปราบปรามกลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.60.desc: "เราปราบปรามกลุมสังคมนิยมสายกวางไดสําเร็จ โดยจับกุมสมาชิกที่มีรายงานวาพยายามยุยงใหเกิดการประทวงหรือปลุกปนการจลาจลในหมูประชาชน"
 bftb_bulgaria_factions.60.a: "พวกมันไดรับสิ่งที่สมควรไดรับแลว"
 bftb_bulgaria_factions.61.t: "ปราบปรามกลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.61.desc: "กองกําลังความมั่นคงของเราไดปฏิบัติการปราบปรามครั้งใหญตอกลุมสังคมนิยมสายกวาง มีรายงานวาเจาหนาที่ตํารวจจับกุมตัวปวนไดจํานวนมากระหวางการประชุมลับ ซึ่งผูนําหลายคนของกลุมสังคมนิยมสายกวางพบปะกับสมาชิกองคกรแรงงานและแมแตพรรคคอมมิวนิสต หัวหนาตํารวจอางวาผลของปฏิบัติการครั้งนี้ประสบความสําเร็จอยางยิ่ง"
 bftb_bulgaria_factions.61.a: "ขาวดีเยี่ยม!"
 bftb_bulgaria_factions.62.t: "ปราบปรามกลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.62.desc: "นาเสียดายที่ความพยายามปราบปรามกลุมสังคมนิยมสายกวางของเราลมเหลว ตํารวจบุกเขาไปอยางรุนแรงในสิ่งที่เชื่อวาเปนการชุมนุมลับ ซึ่งกลุมสังคมนิยมสายกวางพบปะกับสมาชิกองคกรแรงงานและพรรคคอมมิวนิสตเพื่อวางแผนการนัดหยุดงานในภาคอุตสาหกรรมครั้งใหม แตกลับกลายเปนวากลุมสังคมนิยมสายกวางแคมานั่งฟงการบรรยายของโทดอร ปฟลอฟเรื่องวัตถุนิยมวิภาษวิธี ทําใหการแสดงพลังอันอลังการของตํารวจไรประโยชนโดยสิ้นเชิง \nไมตองบอกก็รูวาปฏิบัติการของตํารวจครั้งนี้ไมเปนที่นิยมนักในหมูประชาชนบัลแกเรีย ยิ่งในหมูกลุมสังคมนิยมสายกวางยิ่งไมตองพูดถึง..."
 bftb_bulgaria_factions.62.a: "นาอับอายเสียจริง..."
 bftb_bulgaria_factions.63.t: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวาง"
 bftb_bulgaria_factions.63.desc: "ปฏิบัติการจับกุมผูนํากลุมสังคมนิยมสายกวางประสบความสําเร็จ ตํารวจควบคุมตัวบุคคลสําคัญสวนใหญที่เกี่ยวของกับองคกรได ซึ่งเปนการโจมตีที่รายแรงตอกลุมสังคมนิยมสายกวาง"
