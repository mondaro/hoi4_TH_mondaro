 bftb_bulgaria_factions.81.a: "ขาวดีเยี่ยม!"
 bftb_bulgaria_factions.82.t: "ปราบปรามสมาชิกขบวนการสังคมแหงชาติ"
 bftb_bulgaria_factions.82.desc: "นาเสียดายที่ความพยายามปราบปรามขบวนการสังคมแหงชาติของเราลมเหลว ตํารวจบุกเขาไปในกองบัญชาการขององคกร ซึ่งเชื่อวามีการชุมนุมลับเพื่อวางแผนการเดินขบวนของฟาสซิสตครั้งตอไป แตกลับกลายเปนวางานนั้นเปนเพียงการสัมมนาเรื่องนโยบายเศรษฐกิจสมัยใหม ซึ่งจัดโดยอเล็กซานดาร ซันคอฟเอง ทําใหการแสดงพลังของตํารวจไรประโยชนโดยสิ้นเชิง \nไมตองบอกก็รูวาปฏิบัติการของตํารวจครั้งนี้ไมเปนที่นิยมนักในหมูประชาชนบัลแกเรีย ยิ่งในหมูขบวนการสังคมแหงชาติยิ่งไมตองพูดถึง..."
 bftb_bulgaria_factions.82.a: "นาอับอายเสียจริง..."
 bftb_bulgaria_factions.83.t: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติ"
 bftb_bulgaria_factions.83.desc: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติประสบความสําเร็จ ตํารวจควบคุมตัวบุคคลสําคัญสวนใหญที่เกี่ยวของกับองคกรได รวมถึงอเล็กซานดาร ซันคอฟเอง ซึ่งเปนการโจมตีที่รายแรงตอองคกร"
 bftb_bulgaria_factions.83.a: "พวกมันจะไมสามารถกอปญหาไดอีกแลว!"
 bftb_bulgaria_factions.84.t: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติ"
 bftb_bulgaria_factions.84.desc: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติไมไดสําเร็จอยางที่เราคาดไว แมตํารวจจะจับกุมบุคคลสําคัญไดบางคน แตอเล็กซานดาร ซันคอฟหลบหนีไปได และแมจะตองหลบซอนตัว เขาก็ยังคงนําองคกรตอไป"
 bftb_bulgaria_factions.84.a: "ผลลัพธที่นาผิดหวัง..."
 bftb_bulgaria_factions.85.t: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติ"
 bftb_bulgaria_factions.85.desc: "ปฏิบัติการจับกุมผูนําขบวนการสังคมแหงชาติลมเหลวโดยสิ้นเชิง ตํารวจบุกเขาไปในการประชุมลับ แตเจาหนาที่ซึ่งมีจํานวนนอยกวามากไมสามารถควบคุมตัวผูเขารวมประชุมได พวกเขารีบหลบหนีออกไปโดยมีตํารวจไลตาม จนเกิดการปะทะอยางรุนแรงไปทั่วทองถนนในเมือง และมีพลเมืองผูบริสุทธิ์บาดเจ็บจํานวนมาก เมื่อเห็นความโหดรายของตํารวจเชนนี้ พลเรือนจํานวนมากในพื้นที่อดไมไดที่จะเห็นใจขบวนการสังคมแหงชาติ ชวยใหสมาชิกขององคกรหลบหนี และถึงขั้นเขารวมตอสูกับกองกําลังของรัฐ"
 bftb_bulgaria_factions.85.a: "ตองมีคนรับผิดชอบความลมเหลวนี้!"

 BUL_repress_imro_flag: "ไดปราบปราม IMRO แลว"
 bftb_bulgaria_imro.1.t: "IMRO กลับมาแลว!"
 bftb_bulgaria_imro.1.desc: "แหลงขาวที่เชื่อถือไดแจงเราวาสมาชิก IMRO ไดขามพรมแดนเขามาพรอมอาวุธของบัลแกเรีย และกําลังจัดตั้งขบวนการตอตาน[ROOT.GetAdjective]ในภูมิภาคมาซิโดเนีย"
 bftb_bulgaria_imro.1.a: "ยอนกลับไปยังตนทศวรรษ 1930 อีกแลว..."
 bftb_bulgaria_imro.2.t: "ความรูสึกฝกใฝบัลแกเรียตื่นขึ้นในมาซิโดเนีย"
 bftb_bulgaria_imro.2.desc: "นักเคลื่อนไหว IMRO และชาวมาซิโดเนียที่ฝกใฝบัลแกเรียกลุมอื่นๆ กําลังเผยแพรความรูสึกนิยมบัลแกเรียในหมูประชากรมาซิโดเนีย\nผลที่ตามมาคือ ความไมมั่นคงและการตอตานรัฐบาล[ROOT.GetAdjective]ระลอกใหมกําลังกระหนํ่าภูมิภาคนี้"
 bftb_bulgaria_imro.2.a: "ถึงเวลาจัดการกับ IMRO อีกครั้งแลว..."

 bftb_bulgaria_fatherland_front.1.t: "แนวรวมปตุภูมิ"
 bftb_bulgaria_fatherland_front.1.desc_positive: "ในที่สุดเราก็ไดเก็บเกี่ยวผลจากความพยายามอยางยิ่งใหญในการรวมกลุมการเมืองและอุดมการณที่แตกตางกันอยางสุดขั้วใหเปนแนวรวมเดียว เพื่อตอตานเผด็จการทหารที่ฝกใฝเยอรมนีในบัลแกเรีย\nเราไดกอตั้งแนวรวมปตุภูมิ ซึ่งไมไดมีเพียงพรรคคอมมิวนิสต แตยังรวมอดีตสมาชิกซเวโน กลุมสังคมนิยมสายกวาง กลุมเกษตรกรรม และกลุมอื่นๆ ที่บัดนี้รวมกันตอตานชนชั้นกระฎมพีผูครอบงําประเทศ และจะไมลังเลที่จะทําลายประเทศอีกครั้งเพื่อแสวงหาความมั่งคั่งของตนเอง"
 bftb_bulgaria_fatherland_front.1.desc_negative: "พวกคอมมิวนิสตรวมกับสมาชิกจากองคกรอื่นๆ ไดกอตั้งแนวรวมปตุภูมิ ขบวนการตอตานทางการเมืองที่กําลังไดรับความนิยมในหมูชนชั้นกรรมาชีพอยางนาวิตก และอาจกลายเปนภัยคุกคามที่จะโคนลมรัฐบาลไดในอนาคตอันใกล"
 bftb_bulgaria_fatherland_front.1.a: "สามัคคีกันเราจะแข็งแกรงกวา!"
 bftb_bulgaria_fatherland_front.1.b: "กลอุบายของคอมมิวนิสตอีกครั้งที่ถูกลิขิตใหลมเหลว"
 bftb_bulgaria_fatherland_front.2.t: "แนวรวมปตุภูมิลงมือ!"
 bftb_bulgaria_fatherland_front.2.desc: "วันนี้ องคกรแนวรวมปตุภูมิในทองถิ่นและกองกําลังติดอาวุธของพลพรรคไดเขายึดศาลากลางและที่ทําการเขตทั่วประเทศตามแผนที่วางไวลวงหนา \nฝายกบฏแทบไมพบการตอตานเลยตลอดชายฝงทะเลดําตั้งแตบูรกัสไปจนถึงวารนา[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]"
 bftb_bulgaria_fatherland_front.2.desc_no_support: ""
 bftb_bulgaria_fatherland_front.2.desc_has_bs_support: " สวนในพลอฟดิฟ ชนชั้นแรงงานพากันลงถนนจํานวนมหาศาลเพื่อสนับสนุนการลุกฮือ และควบคุมภูมิภาคไดสําเร็จหลังการสูรบตามทองถนนไมกี่ชั่วโมง"
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support: " \nมีรายงานวาการสนับสนุนของกลุมเกษตรกรรมก็มีสวนสําคัญยิ่งตอความสําเร็จของการรัฐประหารในเขตชนบทของโมเอเซียดวย"
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support: " \nในโซเฟย อดีตนายทหารซเวโนไดยึดสถานที่สื่อสารและรุดไปยังรัฐสภาแหงชาติ บีบใหทหารฝายภักดีที่ไมทันตั้งตัวตองยอมจํานน"
 bftb_bulgaria_fatherland_front.2.desc_has_partisan_support: " \nสุดทายแตไมทายสุด พลพรรค[GetPartisanFfSupportNationalities]หลายกลุมไดเขารวมการรัฐประหารของแนวรวมปตุภูมิ และกําลังทาทายการควบคุมดินแดนที่ถูกยึดครอง"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre: "กรีก"
 bftb_bulgaria_fatherland_front.2.desc_partisans_yug: "ยูโกสลาฟ"
 bftb_bulgaria_fatherland_front.2.desc_partisans_both: "กรีกและยูโกสลาฟ"
 bftb_bulgaria_fatherland_front.2.a: "ถาอยางนั้นก็สงครามกลางเมือง!"


 BUL_zveno_dissidents_tt: "หากเราไมจัดการกับกลุม [GetZvenoName] ใหทันเวลา สมาชิกขององคกรนี้อาจกอรัฐประหารไดในอนาคต"
 BUL_exposed_zveno_conspirator_tt: "การนี้จะชะลอรัฐประหารใดๆ ที่กลุม [GetZvenoName] อาจกําลังวางแผนไวไดเล็กนอย"
 BUL_bs_strikes_no_violence_tt: "โรงงานจํานวนหนึ่งจะไดรับความเสียหายในกระบวนการนี้\nการสนับสนุน§Yคอมมิวนิสต§!ที่สูงและความนิยมของ [GetBsName] ที่สูงอาจทําใหสถานการณเลวรายลง"

 bftb_bulgaria_rearmament.1.t: "การเจรจาฟนฟูกําลังทหาร[BUL.GetAdjective]"
 bftb_bulgaria_rearmament.1.desc: "รัฐบาล[BUL.GetAdjective]ไดประกาศนโยบายสันติภาพที่ [BUL.GetNameDef] จะยึดถือในคาบสมุทรบอลขานตอสาธารณะ และบัดนี้กําลังเรงเราใหเราเจรจายกเลิกขอจํากัดทางทหารอันเขมงวดที่บังคับใชกับประเทศหลังพายแพในมหาสงคราม \nพวกเขาอางวาจําเปนตองเริ่มฟนฟูกําลังทหารทันที หากจะสรางกองทัพสมัยใหมที่สามารถปกปองอธิปไตยและสิทธิในการกําหนดชะตากรรมตนเองของประชาชน[BUL.GetAdjective]"
 bftb_bulgaria_rearmament.1.a: "พวกเขาแคใหคําสัญญาลมๆ แลงๆ"
 bftb_bulgaria_rearmament.1.b: "เราจะเรียกรองสนธิสัญญาอยางเปนทางการเพื่อรักษาสันติภาพ"
 bftb_bulgaria_rearmament.1.c: "เราตองยุติขอจํากัดของพวกเขา!"
 bftb_bulgaria_rearmament.1_refuse_tt: "[BUL.GetNameDefCap] จะยังไมสามารถเริ่มฟนฟูกําลังทหารไดในตอนนี้"
 bftb_bulgaria_rearmament.1_nap_tt: "[BUL.GetNameDefCap] จะสามารถเริ่มฟนฟูกําลังทหารไดทันทีที่ทําสนธิสัญญาไมรุกรานกับ [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] หรือ [TUR.GetFlag][TUR.GetNameDefCap] ประเทศใดประเทศหนึ่ง"
 bftb_bulgaria_rearmament.2.t: "[ENG.GetNameDefCap] ปฏิเสธการฟนฟูกําลังทหาร[ROOT.GetAdjective]"
 bftb_bulgaria_rearmament.2.desc: "รัฐบาล[ENG.GetAdjective]ปฏิเสธที่จะยกเลิกขอจํากัดใดๆ ตอกองทัพของเรา ดูเหมือนจะไมใสใจตอความตึงเครียดที่ทวีขึ้นในยุโรป และโอกาสที่ [ROOT.GetNameDef] จะตกอยูใตอํานาจที่กําลังผงาดขึ้นอยางไรทางสู หากดุลอํานาจอันเปราะบางในคาบสมุทรบอลขานเปลี่ยนแปลงไป"
 bftb_bulgaria_rearmament.2.a: "เราตองหาวิธีโนมนาวทางอื่น..."
 bftb_bulgaria_rearmament.3.t: "[ENG.GetAdjective]ตั้งเงื่อนไขเพื่ออนุญาตให [ROOT.GetNameDef] ฟนฟูกําลังทหาร"
 bftb_bulgaria_rearmament.3.desc: "กอนจะยกเลิกขอจํากัดใดๆ ตอกองทัพของเรา รัฐบาล[ENG.GetAdjective]เรียกรองให [ROOT.GetNameDef] ลงนามในสนธิสัญญาอยางเปนทางการกับเพื่อนบานประเทศใดประเทศหนึ่ง เพื่อเปนจุดเริ่มตนในการพัฒนาการทูตฉันมิตรในคาบสมุทรบอลขานเสียที"
 bftb_bulgaria_rearmament.3.a: "อุปสรรคอีกดานที่ตองฝาไป..."
 BUL_uk_demands_nap_with_balkan_nation_tt: "จิตวิญญาณแหงชาติ §Yขอจํากัดทางทหาร§! จะถูกยกเลิกหลังลงนาม§Yสนธิสัญญาไมรุกราน§!กับ [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] หรือ [TUR.GetFlag][TUR.GetNameDefCap] ประเทศใดประเทศหนึ่ง"
 bftb_bulgaria_rearmament.4.t: "ยกเลิกขอจํากัดทางทหารแลว"
 bftb_bulgaria_rearmament.4.desc: "หลังจากทําตามขอเรียกรองของ[ENG.GetAdjective]และทําสนธิสัญญาไมรุกรานกับ [GetNapTarget] แลว ในที่สุด [ENG.GetNameDef] ก็ยกเลิกขอจํากัดตอกองทัพของเรา และการฟนฟูกําลังกองทัพ[ROOT.GetAdjective]ก็เริ่มตนไดเสียที"
 bftb_bulgaria_rearmament.4.a: "ลงมือทํางานกันเถอะ!"
 BUL_nap_with_greece: "[GRE.GetNameDefCap]"
 BUL_nap_with_yugoslavia: "[YUG.GetNameDefCap]"
 BUL_nap_with_romania: "[ROM.GetNameDefCap]"
 BUL_nap_with_turkey: "[TUR.GetNameDefCap]"
 bftb_bulgaria_rearmament.5.t: "ยกเลิกขอจํากัดทางทหารของ[BUL.GetAdjective]แลว"
 bftb_bulgaria_rearmament.5.desc: "หลังจากทําตามขอเรียกรองของ[ROOT.GetAdjective]และทําสนธิสัญญาไมรุกรานกับ [GetNapTarget] แลว คณะผูแทน[BUL.GetAdjective]ไดเดินทางมาถึงลอนดอนและพรอมลงนามในสนธิสัญญาอยางเปนทางการที่จะอนุญาตให [BUL.GetNameDef] เริ่มฟนฟูกําลังทหาร"
 bftb_bulgaria_rearmament.5.a: "จัดการใหจบๆ ไปเสียที"
 bftb_bulgaria_rearmament.6.t: "[ENG.GetNameDefCap] ยกเลิกขอจํากัดทางทหารของเรา"
 bftb_bulgaria_rearmament.6.desc: "หลังการเจรจาอันยากลําบากในโซเฟยกับคณะผูแทนจาก [ENG.GetNameDef] เราไดลงนามในขอตกลงซึ่งรัฐบาล[ENG.GetAdjective]ยกเลิกขอจํากัดตอกองทัพของเรา และ [ROOT.GetNameDef] สามารถเริ่มฟนฟูกําลังทหารไดในที่สุด"
 bftb_bulgaria_rearmament.6.a: "ไมมีเวลาใหเสียแลว เริ่มฟนฟูกําลังทหาร!"
 bftb_bulgaria_rearmament.7.t: "[BUL.GetNameDefCap] กดดันใหยกเลิกขอจํากัดทางทหาร"
 bftb_bulgaria_rearmament.7.desc: "คณะผูแทน[BUL.GetAdjective]ไดเดินทางมาถึงลอนดอนเพื่อกดดันรัฐบาล[ROOT.GetAdjective]ใหยกเลิกขอจํากัดทางทหารตอ [BUL.GetNameDef] \nเมื่อสงครามกําลังคุกคามคาบสมุทรบอลขานอีกครั้ง พวกเขายืนยันวา [BUL.GetNameDef] จะเริ่มเตรียมการปกปองบูรณภาพแหงดินแดนของตนในไมชา ไมทางใดก็ทางหนึ่ง"
 bftb_bulgaria_rearmament.7.a: "เราจะไมยอมจํานนตอการขมขู!"
 bftb_bulgaria_rearmament.7.b: "ไมมีทางอื่นแลว... ยกเลิกขอจํากัดของพวกเขา!"
 bftb_bulgaria_rearmament.8.t: "[ENG.GetNameDefCap] ไมยอมจํานนตอแรงกดดันของเรา"
 bftb_bulgaria_rearmament.8.desc: "คณะผูแทน[ROOT.GetAdjective]ที่สงไปลอนดอนเพื่อกดดันรัฐบาล[ENG.GetAdjective]ใหยกเลิกขอจํากัดตอกองทัพของเราไดกลับมาพรอมขาวราย: [ENG.GetNameDef] จะไมยอมตามขอเรียกรองของเรา และจะไมอนุญาตให [ROOT.GetNameDef] เริ่มฟนฟูกําลังทหาร"
 bftb_bulgaria_rearmament.8.a: "ถาอยางนั้นพวกเขาก็ไมเหลือทางเลือกใหเรา..."
 bftb_bulgaria_rearmament.9.t: "[BUL.GetNameDefCap] จะไมปฏิบัติตามขอจํากัดทางทหาร"
 bftb_bulgaria_rearmament.9.desc: "นักการทูต[BUL.GetAdjective]ที่ [BUL.GetLeader] สงมาดวยตนเองไดเดินทางมาถึงประเทศของเราเพื่อแจงวา[GetReasonForNotAbiding]"
 bftb_bulgaria_rearmament.9.a: "เราจะจัดการกับพวกเขาทีหลัง..."
 bftb_bulgaria_rearmament.9.b: "พวกเขาตองชดใชเรื่องนี้!"
 bftb_bulgaria_rearmament.9.desc_reason_war: " เนื่องจากความขัดแยงทางทหารที่ตนถูกดึงเขาไปเกี่ยวของ [BUL.GetNameDef] จะเริ่มฟนฟูกําลังทหารทันทีเพื่อรักษาเอกราชของชาติและเสรีภาพของประชาชน"
 bftb_bulgaria_rearmament.9.desc_reason_faction: " เมื่อไดรับการหนุนหลังจาก [BUL.GetFactionName] แลว [BUL.GetNameDef] จะไมปฏิบัติตามขอจํากัดที่บังคับใชกับกองทัพของตนอีกตอไป"

 bftb_bulgaria_nationalization.1.t: "[FROM.GetNameDefCap] ยึดบริษัทในเครือของเรา"
 bftb_bulgaria_nationalization.1.desc: "ดวยการสนับสนุนจาก[GetTsarLoyalistOrPartyName] [GetLeaderNameIfRegencyCouncil]แหง [BUL.GetNameDef] ไดออกกฎหมายใหมที่โอนบริษัทในเครือของตางชาติทั้งหมดในประเทศเปนของรัฐ นับแตนี้ไปใหตกเปนของรัฐ[BUL.GetAdjective] \nการโจมตีผลประโยชนของ[ROOT.GetAdjective]ใน [BUL.GetNameDef] อยางโจงแจงนี้ถือเปนการโจมตีอยางรุนแรงตอชนชั้นนํา โดยเฉพาะเจาพออุตสาหกรรมที่ลงทุนมหาศาลในการพัฒนาโครงสรางพื้นฐานและบริษัทในเครือใน [BUL.GetNameDef] ซึ่งถูกยึดไปอยางชั่วชา"
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists: "เหลารัฐมนตรีผูภักดี"
 bftb_bulgaria_nationalization.1.desc_party_name: "รัฐมนตรีจาก [BUL.GetRulingPartyLong]"
 bftb_bulgaria_nationalization.1.desc_regency_council: "บอกดาน ฟลอฟ และ [BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_regular_leader: "[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.a: "ตอนนี้เราทําอะไรไมไดแลว..."
 bftb_bulgaria_nationalization.1.b: "การควํ่าบาตรทางการคาจะสอนใหพวกเขารูจักเคารพ!"
 bftb_bulgaria_nationalization.1.c: "เราจะสงคณะผูแทนทางการทูต... นําหนาดวยรถถัง!"
 bftb_bulgaria_nationalization.1.d: "ไลพวกทรยศเนรคุณเหลานี้ออกไป!"
 bftb_bulgaria_nationalization.2.t: "[FROM.GetAdjective]ควํ่าบาตรทางการคาบัลแกเรีย"
 bftb_bulgaria_nationalization.2.desc: "เพื่อตอบโตการที่[ROOT.GetAdjective]โอนบริษัทในเครือและสํานักงานสาขาของตางชาติเปนของรัฐ [FROM.GetNameDef] ตัดสินใจควํ่าบาตรประเทศของเรา[GetEmbargoAllies] \nบางคนบอกวาสถานการณอาจบานปลายไปสูสิ่งที่เลวรายกวานี้มาก แตความจริงคือบางภาคสวนที่เนนการนําเขาและสงออกสินคาไดรับผลกระทบอยางหนักจากการควํ่าบาตรนี้"
 bftb_bulgaria_nationalization.2.desc_no_allies: ""
 bftb_bulgaria_nationalization.2.desc_allies: " ซึ่งไดรับการสนับสนุนจากพันธมิตรของพวกเขาดวย"
 bftb_bulgaria_nationalization.2.a: "ชางดรามาเสียจริง..."
 bftb_bulgaria_nationalization.3.t: "[FROM.GetNameDefCap] ขับเราออกจาก [FROM.GetFactionName]"
 bftb_bulgaria_nationalization.3.desc: "รัฐบาล[FROM.GetAdjective]ยอมจํานนตอแรงกดดันของนักลงทุนและเจาพออุตสาหกรรม ซึ่งเพื่อตอบโตการที่[BUL.GetAdjective]โอนบริษัทในเครือของตางชาติเปนของรัฐ ไดเรียกรองให [FROM.GetNameDef] ไมเพียงควํ่าบาตรทางการคาตอ [BUL.GetNameDef] แตยังใหขับประเทศออกจาก [FROM.GetFactionName] ดวย\nการควํ่าบาตร[GetEmbargoAndKickAllies]จะสงผลกระทบอยางหนักตอภาคเศรษฐกิจของชาติหลายภาคสวน แตที่เลวรายยิ่งกวาคือประเทศของเราตกอยูในสภาพเปดรับความทะเยอทะยานทางดินแดนของเพื่อนบาน ซึ่งไมตองสงสัยเลยวาจะฉวยโอกาสจากสถานการณอันยํ่าแยของ [BUL.GetNameDef] ในไมชา"
 bftb_bulgaria_nationalization.3.desc_no_allies: ""
 bftb_bulgaria_nationalization.3.desc_allies: " ซึ่งพันธมิตรของ [FROM.GetNameDef] รวมดวย"
 bftb_bulgaria_nationalization.3.a: "เรานาจะคาดไวแลว!"

 bftb_bulgaria_uranium_mining_concessions.1.t: "สัมปทานเหมืองยูเรเนียมของ[FROM.GetNameDefCap]"
 bftb_bulgaria_uranium_mining_concessions.1.desc: "ความสัมพันธอันดีกับพันธมิตร[FROM.GetAdjective]ของเราเพิ่งใหผลตอบแทน: รัฐบาล[FROM.GetAdjective]ไดมอบสิทธิ์ในการขุดแหลงแรยูเรเนียมใกลเมืองบูโฮโวใหแกเรา พวกเขาอางวาเทคโนโลยีของตนยังหางไกลจากการใชประโยชนจากสารนี้ไดอยางดี จึงเลือกลงนามขอตกลงสัมปทานซึ่งเราจะควบคุมเหมืองที่บูโฮโว แลกกับผลิตภัณฑพื้นฐานสําหรับอุตสาหกรรมและเกษตรกรรมของบัลแกเรีย\nขอตกลงอันเปนประโยชนนี้ไมเพียงใหแหลงยูเรเนียมแหงใหมแกเรา แตยังจะชวยกระชับความสัมพันธระหวาง [GER.GetNameDef] กับ [BUL.GetNameDef] ใหดียิ่งขึ้นอยางไมตองสงสัย"
 bftb_bulgaria_uranium_mining_concessions.1.a: "เราจะนําไปใชใหเกิดประโยชน"

 bftb_bulgarian_claims.1.t: "บัลแกเรียแสวงหาการรับรองการอางสิทธิ์ในบอลขาน"
 bftb_bulgarian_claims.1.desc: "คณะผูแทนจาก [BUL.GetNameDef] ไดเขาหารัฐบาลของเราเพื่อขอการสนับสนุนจาก[ROOT.GetAdjective]ตอการอางสิทธิ์ของพวกเขาในคาบสมุทรบอลขาน และตองการเจรจาลับเพื่อรับประกันการขยายดินแดนของ[BUL.GetAdjective]ในภูมิภาคนี้ในอนาคตอันใกล แลกกับการที่[BUL.GetAdjective]จะเขาขาง [ROOT.GetNameDef] และเขารวม [ROOT.GetFactionName]"
 bftb_bulgarian_claims.1.a: "รับรองการอางสิทธิ์ของบัลแกเรีย"
 bftb_bulgarian_claims.1.b: "เราจะจัดการการขยายดินแดนใดๆ ตามที่เราเห็นสมควร!"
 bftb_bulgarian_claims.1.a_tt: "รัฐที่มีตัวปรับคา §Yการขยายดินแดนบัลแกเรียที่ตกลงไวลวงหนา§! จะถูกโอนให [BUL.GetNameDef] เมื่อพันธมิตรในฝายประเทศใดก็ตามควบคุมรัฐนั้น และ [BUL.GetNameDef] ไดเขารวม [ROOT.GetFactionName] แลว"
 bftb_bulgarian_claims.2.t: "[GER.GetNameDefCap] รับรองการอางสิทธิ์ของเรา"
 bftb_bulgarian_claims.2.desc: "คณะผูแทน[ROOT.GetAdjective]ที่สงไปยัง [FROM.Capital.GetName] เพื่อเจรจาเรื่องการขยายดินแดนของเราในคาบสมุทรบอลขานไดกลับมายัง [ROOT.Capital.GetName] และแจงวาภารกิจประสบความสําเร็จอยางสมบูรณ พวกเขาไดทําขอตกลงลับกับฝาย[FROM.GetAdjective] ซึ่ง [FROM.GetNameDef] รับรองการอางสิทธิ์ของเราและตกลงจะมอบอํานาจควบคุมดินแดนเหลานั้นให [ROOT.GetNameDef] เมื่อเราเขารวม [FROM.GetFactionName] อยางเปนทางการ โดยรับบทบาทผูรักษาสันติภาพในรัฐบอลขานที่ถูกยึดครอง"
 bftb_bulgarian_claims.2.a: "ขอตกลงที่แทบจะดีกวานี้ไมไดอีกแลว!"
 bftb_bulgarian_claims.3.t: "[GER.GetNameDefCap] ปฏิเสธการอางสิทธิ์ของเรา"
 bftb_bulgarian_claims.3.desc: "คณะผูแทน[ROOT.GetAdjective]ที่สงไปยัง [FROM.Capital.GetName] เพื่อเจรจาให[FROM.GetAdjective]รับรองการอางสิทธิ์ของเราในคาบสมุทรบอลขานไดกลับมายัง [ROOT.Capital.GetName] และแจงวาพวกเขาลมเหลวในภารกิจทําขอตกลงกับ [FROM.GetNameDef] เพื่อรับประกันการขยายดินแดนของ[ROOT.GetAdjective]ในคาบสมุทรบอลขาน"
 bftb_bulgarian_claims.3.a: "ถาอยางนั้นเราคงตองขยายดินแดนดวยวิธีที่ไมแนบเนียนนัก..."
 bftb_bulgarian_claims.4.t: "[GER.GetNameDefCap] มอบอํานาจควบคุมใหบัลแกเรีย"
 bftb_bulgarian_claims.4.desc: "ตามที่ตกลงกันไวกอนหนานี้ [GER.GetNameDef] ไดสั่งโอนอํานาจควบคุมดินแดนที่ขณะนี้ถูกยึดครองโดยมหาอํานาจใน [GER.GetFactionName] และถูกอางสิทธิ์โดย [ROOT.GetNameDef] ซึ่งนับแตนี้จะอยูภายใตการบริหารของรัฐบาล[ROOT.GetAdjective]"
 bftb_bulgarian_claims.4.a: "เรากําลังเอาสิ่งที่เปนของเราโดยชอบธรรมคืนมา!"
 bftb_bulgarian_claims.5.t: "อนุมัติการยึดครองของบัลแกเรียแลว"
 bftb_bulgarian_claims.5.desc: "ตามที่ตกลงกันไวกอนหนานี้ เราไดสั่งโอนอํานาจควบคุมดินแดนที่ขณะนี้ถูกยึดครองโดยมหาอํานาจใน [GER.GetFactionName] และถูกอางสิทธิ์โดย [ROOT.GetNameDef] ซึ่งนับแตนี้จะอยูภายใตการบริหารของรัฐบาล[ROOT.GetAdjective]"
 bftb_bulgarian_claims.5.a: "นั่นเปนสวนของเราในขอตกลง"
 bftb_bulgarian_claims.6.t: "[GER.GetNameDefCap] อนุมัติการยึดครองของบัลแกเรีย"
 bftb_bulgarian_claims.6.desc: "ตามที่รัฐบาล[GER.GetAdjective]และรัฐบาล[BUL.GetAdjective]ตกลงกันไวกอนหนานี้ [GER.GetNameDef] ไดสั่งโอนอํานาจควบคุมดินแดนที่ [BUL.GetNameDef] อางสิทธิ์และขณะนี้เรายึดครองอยู ซึ่งนับแตนี้จะอยูภายใตการบริหารของรัฐบาล[BUL.GetAdjective]"
 bftb_bulgarian_claims.6.a: "พวกบัลแกเรียหนาใหมไรหัวนอนปลายเทา!"
 bftb_bulgarian_claims.6.b: "พวกเขาไมมีสิทธิ์!"
 bftb_bulgarian_claims.7.t: "[FROM.GetNameDefCap] ขออํานาจควบคุม [FROM.FROM.GetName]"
 bftb_bulgarian_claims.7.desc: "ในฐานะผูรักษาสันติภาพในดินแดนบอลขานที่ถูกยึดครอง ฝาย[FROM.GetAdjective]เสนอใหเรามอบอํานาจควบคุมทางการบริหารของ [FROM.FROM.GetName] แกพวกเขา เพื่อรักษาความสงบเรียบรอยและเสถียรภาพในดินแดนที่ [ROOT.GetFactionName] ยึดมาได และเพื่อผลัดเปลี่ยนกองรักษาการณ[ROOT.GetAdjective] ใหทหารของเราไปเสริมกําลังแนวรบอื่นได"
 bftb_bulgarian_claims.7.a: "ตกลง เราตองใชทหารที่อื่น!"
 bftb_bulgarian_claims.7.b: "ความทะเยอทะยานทางดินแดนของบัลแกเรียไมมีที่สิ้นสุด!"
 bftb_bulgarian_claims.8.t: "[FROM.GetNameDefCap] โอนอํานาจควบคุม [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.8.desc: "รัฐบาล[FROM.GetAdjective]ตกลงมอบอํานาจควบคุมทางการบริหารของ [FROM.FROM.FROM.GetName] ใหแก [ROOT.GetNameDef] บัดนี้เราจะรับบทบาทผูรักษาสันติภาพในภูมิภาค โดยวางกองรักษาการณที่ไมเพียงรักษาความสงบเรียบรอยและเสถียรภาพในภูมิภาคได แตยังปองกันการรุกของศัตรูไดดวย"
 bftb_bulgarian_claims.8.a: "ดินแดนเพิ่มขึ้นอีกสําหรับบัลแกเรีย!"
 bftb_bulgarian_claims.9.t: "[FROM.GetNameDefCap] ปฏิเสธให[ROOT.GetAdjective]ควบคุม [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.9.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธที่จะมอบอํานาจควบคุมทางการบริหารของ [FROM.FROM.FROM.GetName] ใหแก [ROOT.GetNameDef] พวกเขาอางวาแรงจูงใจที่แทจริงของขอเสนอของเราคือเพียงตองการขยายเขตยึดครองของ[ROOT.GetAdjective] โดยหวังจะไดดินแดนบอลขานเพิ่มอีกหลายสวนเมื่อชนะสงคราม และแมแต [FROM.GetLeader] เองก็ประกาศวาความทะเยอทะยานทางดินแดนของเราเริ่มทําใหเขารําคาญแลว"
 bftb_bulgarian_claims.9.a: "ไวคราวหนาก็แลวกัน..."
 BUL_germany_recognizes_our_claim_tt: "[GER.GetNameDefCap] รับรองการอางสิทธิ์ของเราในรัฐนี้"

 bftb_bulgaria_german_influence.1.t: "[GER.GetNameDefCap] เสนอบริจาคเครื่องบิน"
 bftb_bulgaria_german_influence.1.desc: "[GetFirstDonation]ความสัมพันธระหวางประเทศของเรากับ [GER.GetNameDef] แฮรมันน เกอริงเสนอบริจาคเครื่องบินขับไล[GER.GetAdjective] 12 ลําใหแกเรา เห็นไดชัดวาตองการดึง [ROOT.GetNameDef] เขาหา [GER.GetFactionName] และไดพันธมิตรที่ทรงพลังในคาบสมุทรบอลขานเพื่อปกปองผลประโยชนของ[GER.GetAdjective]ในภูมิภาค"
 bftb_bulgaria_german_influence.1.desc_first_donation: "เพื่อฟนฟูกองกําลังรบทางอากาศ[ROOT.GetAdjective]และกระชับ"
 bftb_bulgaria_german_influence.1.desc_more_donations: "เพื่อกระชับใหแนนแฟนยิ่งขึ้นตอไปซึ่ง"
 bftb_bulgaria_german_influence.1.a: "เรายินดีรับ!"
 bftb_bulgaria_german_influence.1.b: "เราขอปฏิเสธอยางสุภาพ"
 bftb_bulgaria_german_influence.2.t: "[BUL.GetNameDefCap] รับการบริจาคของเรา"
 bftb_bulgaria_german_influence.2.desc: "กองบัญชาการทหารสูงสุด[BUL.GetAdjective]ยินดีรับขอเสนอของเรา และ [BUL.GetLeader] ไดขอบคุณดวยตนเองสําหรับเครื่องบินที่เราบริจาค โดยกลาววาความสัมพันธระหวาง [ROOT.GetNameDef] กับ [BUL.GetNameDef] กําลังแนนแฟน รุงเรือง และเกื้อกูลกันมากขึ้น"
 bftb_bulgaria_german_influence.2.a: "ดี!"
 bftb_bulgaria_german_influence.3.t: "[BUL.GetNameDefCap] ปฏิเสธการบริจาคของเรา"
 bftb_bulgaria_german_influence.3.desc: "กองบัญชาการทหารสูงสุด[BUL.GetAdjective]ปฏิเสธอยางสุภาพตอขอเสนอของเราที่จะบริจาคเครื่องบิน[ROOT.GetAdjective]เพื่อเสริมกําลังกองทัพอากาศ[BUL.GetAdjective] โดยกลาววาการรับบริจาคนี้จะหมายถึงการที่ [BUL.GetNameDef] โนมเขาหานโยบายของ[ROOT.GetAdjective] ซึ่งในเวลานี้ไมเปนประโยชนตอฝาย[BUL.GetAdjective] ผูตั้งใจจะฟนฟูกองทัพอากาศดวยตนเอง"
 bftb_bulgaria_german_influence.3.a: "พวกเขาเปนอะไรไป?"
 bftb_bulgaria_german_influence.4.t: "[GER.GetLeader] เรียกรองใหเราเปลี่ยนตัวคีโอเซอีวานอฟ"
 bftb_bulgaria_german_influence.4.desc: "วันนี้ เราไดรับจดหมายจาก [GER.GetLeader] เอง ระบุวาความไรความสามารถของนายกรัฐมนตรี[ROOT.GetAdjective] เกออรกี คีโอเซอีวานอฟ ทําใหเขาสูญเสียความนาเชื่อถือทั้งหมดในสายตาฝาย[GER.GetAdjective] และควรถูกบีบใหลาออกเพื่อใหคนที่เหมาะสมกวามารับตําแหนงสําคัญนี้ \nฝาย[GER.GetAdjective]เสนอใหเราแทนที่คีโอเซอีวานอฟดวยบอกดาน ฟลอฟ ผูนิยมเยอรมนีที่มีประสบการณทางการเมืองไมมาก ซึ่งหมายความวาเขาจะไมทาทาย[GetLeaderToChallenge]"
 bftb_bulgaria_german_influence.4.desc_tsar: "ซาร"
 bftb_bulgaria_german_influence.4.desc_regency_council: "คณะผูสําเร็จราชการ[ROOT.GetAdjective]"
 bftb_bulgaria_german_influence.4.desc_no_tsar: "[BUL.GetLeader]"
 bftb_bulgaria_german_influence.4.a: "พวกเยอรมันพูดถูก!"
 bftb_bulgaria_german_influence.4.b: "เราจะไมยอมตามอําเภอใจของเยอรมัน!"
 bftb_bulgaria_german_influence.5.t: "[BUL.GetLeader] ยอมเปลี่ยนตัวคีโอเซอีวานอฟ"
 bftb_bulgaria_german_influence.5.desc: "ความไรความสามารถของอดีตนายกรัฐมนตรี[BUL.GetAdjective] เกออรกี คีโอเซอีวานอฟ ทําใหเขาสูญเสียความนาเชื่อถือทั้งหมดในสายตาของ [BUL.GetLeader] ผูเขาใจดีถึงความเสี่ยงจากความไรความสามารถของบุคคลผูนี้ และยอมรับขอเสนอของเราที่จะแทนที่คีโอเซอีวานอฟดวยผูที่มีความสามารถกวาอยางบอกดาน ฟลอฟ ผูนิยมเยอรมนีที่มีประสบการณทางการเมืองไมมาก ซึ่งหมายความวาเขาจะไมทาทาย[GetLeaderToChallenge]หรือขัดขวางผลประโยชนของ[ROOT.GetAdjective]"
 bftb_bulgaria_german_influence.5.a: "[BUL.GetLeader] พิสูจนแลววาฉลาดพอ"
 bftb_bulgaria_german_influence.6.t: "[BUL.GetLeader] ปฏิเสธที่จะเปลี่ยนตัวคีโอเซอีวานอฟ"
 bftb_bulgaria_german_influence.6.desc: "[BUL.GetLeader] ปฏิเสธที่จะเปลี่ยนตัวเกออรกี คีโอเซอีวานอฟ โดยอางวาเหตุผลเดียวที่รัฐบาล[ROOT.GetAdjective]ตองการใหเขาลาออก คือเพื่อกําจัดนักการเมืองผูมีความสามารถที่ภักดีตอ [BUL.GetNameDef] แลวแลกกับหุนเชิดของ[ROOT.GetAdjective]ที่จะคอยดูแลผลประโยชนของ [GER.GetLeader] ใน [BUL.GetNameDef]"
 bftb_bulgaria_german_influence.6.a: "หุนเชิดตัวเดียวที่นี่คือเกออรกี คีโอเซอีวานอฟ!"
 bftb_bulgaria_german_influence.7.t: "[GER.GetNameDefCap] เรียกรองสิทธิ์ผานแดนทางทหาร"
 bftb_bulgaria_german_influence.7.desc: "วันนี้นักการทูตจาก [GER.GetNameDef] เดินทางมาถึง [ROOT.Capital.GetName] เพื่อเรียกรองให [ROOT.GetNameDef] ใหสิทธิ์ผานแดนทางทหารแกกองทัพ[GER.GetAdjective] \nปฏิบัติการทางทหารที่กําลังจะเกิดขึ้นในคาบสมุทรบอลขานจําเปนตองใหทหาร[GER.GetAdjective]เคลื่อนผาน [ROOT.GetNameDef] เพื่อไปวางกําลังตามแนวพรมแดนกับเพื่อนบานของเรา และ [GER.GetLeader] คงไมพอใจนักหากรูวา [ROOT.GetNameDef] ขัดขวางความพยายามทําสงครามของ[GER.GetAdjective]..."
 bftb_bulgaria_german_influence.7.a: "เรายินดีรวมมือกับกองทัพเยอรมัน"
 bftb_bulgaria_german_influence.7.b: "[GER.GetLeader] คงตองหาทางอื่น"
 bftb_bulgaria_german_influence.8.t: "[BUL.GetNameDefCap] ใหสิทธิ์ผานแดนทางทหารแกเรา"
 bftb_bulgaria_german_influence.8.desc: "นักการทูตที่เราสงไปยัง [BUL.Capital.GetName] เพื่อหารือเรื่องการใชดินแดน[BUL.GetAdjective]เปนฐานปฏิบัติการของทหารเรา ไดแจงวาการเจรจาประสบความสําเร็จ และ [BUL.GetLeader] ไดลงนามในขอตกลงใหกองทัพ[ROOT.GetAdjective]มีสิทธิ์ผานแดนทางทหารทั่ว [BUL.GetNameDef] แลว"
 bftb_bulgaria_german_influence.8.a: "ทุกอยางเปนไปตามแผน"
 bftb_bulgaria_german_influence.9.t: "[BUL.GetNameDefCap] ปฏิเสธคําขอสิทธิ์ผานแดนทางทหารของเรา"
 bftb_bulgaria_german_influence.9.desc: "นักการทูตที่เราสงไปยัง [BUL.Capital.GetName] เพื่อเจรจาเรื่องการใชดินแดน[BUL.GetAdjective]เปนฐานปฏิบัติการของกองทัพเรา รายงานวา [BUL.GetLeader] ปฏิเสธที่จะใหสิทธิ์ผานแดนทางทหารแกทหาร[ROOT.GetAdjective] ซึ่งจะขัดขวางปฏิบัติการทางทหารของเราในคาบสมุทรบอลขานในอนาคตอันใกลอยางอันตราย มีรายงานวา [BUL.GetLeader] เชื่อวาการทําตามขอเรียกรองทุกขอของเราจะทําให [BUL.GetNameDef] กลายเปนเพียงรัฐบริวารอีกรัฐของ[ROOT.GetAdjective] และขัดขวางไมใหประเทศกลายเปนมหาอํานาจอิสระในคาบสมุทรบอลขานอยางที่ควรจะเปนโดยชอบธรรม"
 bftb_bulgaria_german_influence.9.a: "[BUL.GetLeader] กําลังเลนกับไฟ..."
 bftb_bulgaria_italian_influence.1.t: "ขอเสนอความตกลงดานการวิจัยของ[BUL.GetAdjective]"
 bftb_bulgaria_italian_influence.1.desc: "วันนี้คณะผูแทน[BUL.GetAdjective]ไดเดินทางมาถึงเมืองหลวงของเราเพื่อขอพบรัฐมนตรีวาการกระทรวงการตางประเทศ[ITA.GetAdjective] และเสนอใหลงนามในความตกลงระหวางสองประเทศ \nสนธิสัญญาที่นักการทูต[BUL.GetAdjective]นําเสนอ ประกอบดวยขอตกลงหลายขอ รวมถึงโครงการความรวมมือทางทหารที่มุงเนนการวิจัยเทคโนโลยี และการบังคับใชกฎระเบียบทางเศรษฐกิจใหมใน [BUL.GetNameDef] ที่จะใหประโยชนอยางมากแกนักลงทุน[ITA.GetAdjective]"
 bftb_bulgaria_italian_influence.1.a: "นี่เปนความตกลงที่เปนประโยชนตอ [ITA.GetNameDef]"
 bftb_bulgaria_italian_influence.1.b: "เราจะไมแบงปนความกาวหนาทางเทคโนโลยีของเรากับพวก[BUL.GetAdjective]!"

 bftb_bulgaria_equipment_purchases.1.t: "ซื้อปนใหญ[FROM.FROM.GetAdjective]"
 bftb_bulgaria_equipment_purchases.1.desc: "เพื่อบรรลุขอตกลงซื้อปนใหญ[FROM.FROM.GetAdjective] เราตองตัดสินใจกอนวาตองการจัดหาปนใหญประเภทใด"
 bftb_bulgaria_equipment_purchases.1.a: "ซื้อปนใหญ"
 bftb_bulgaria_equipment_purchases.1.a_tt: "เราจะซื้อ§Yปนใหญลากจูง§! จํานวน §Y[?BUL_quantity_purchased_artillery]§! หนวย"
 bftb_bulgaria_equipment_purchases.1.b: "ซื้อปนตอสูอากาศยาน"
 bftb_bulgaria_equipment_purchases.1.b_tt: "เราจะซื้อ§Yปนตอสูอากาศยานลากจูง§! จํานวน §Y[?BUL_quantity_purchased_artillery]§! หนวย"
 bftb_bulgaria_equipment_purchases.1.c: "ซื้อปนตอสูรถถัง"
 bftb_bulgaria_equipment_purchases.1.c_tt: "เราจะซื้อ§Yปนตอสูรถถังลากจูง§! จํานวน §Y[?BUL_quantity_purchased_artillery]§! หนวย"
