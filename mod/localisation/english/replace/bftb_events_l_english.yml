 bftb_bulgaria_fate_of_the_balkans.4.a: "เราไมอยูในฐานะที่จะปฏิเสธได..."
 bftb_bulgaria_fate_of_the_balkans.4.b: "ไมมีทางเกิดขึ้นแน!"
 bftb_bulgaria_fate_of_the_balkans.5.t: "[FROM.GetNameDefCap] ยอมรับให[BUL.GetAdjective]ควบคุม [FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.5.desc: "หลังการหารืออันยาวนานกับคณะทูต[BUL.GetAdjective]ที่สงไปยังเมืองหลวง[FROM.GetAdjective] [FROM.GetLeader] ไดตกลงโอน [FROM.FROM.FROM.GetName] ใหแกบัลแกเรีย"
 bftb_bulgaria_fate_of_the_balkans.5.a: "ในที่สุด [FROM.FROM.FROM.GetName] ก็กลับคืนสูที่ที่ควรอยู"
 bftb_bulgaria_fate_of_the_balkans.6.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะโอน [FROM.FROM.FROM.GetName] ใหแก [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.6.desc: "หลังการถกเถียงอยางดุเดือดหลายชั่วโมงกับคณะทูต[BUL.GetAdjective]ที่สงไปยังเมืองหลวง[FROM.GetAdjective] [FROM.GetLeader] ไดปฏิเสธอยางดื้อรั้นที่จะโอน [FROM.FROM.FROM.GetName] ใหแก [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.6.a: "การตัดสินใจอันโงเขลาของ [FROM.GetLeader]..."
 bftb_bulgaria_fate_of_the_balkans.7.t: "[BUL.GetNameDefCap] เรียกรองให[ROOT.GetAdjective]ยอมสยบ"
 bftb_bulgaria_fate_of_the_balkans.7.desc: "ในที่สุด รัฐบาล[BUL.GetAdjective]ก็เผยเจตนาที่แทจริง และสงคณะผูแทนมาเรียกรองใหรับรอง [BUL.GetNameDef] เปนเจาเหนือหัวของ [ROOT.GetNameDef] ซึ่งหมายถึงการที่รัฐบาล[ROOT.GetAdjective]ตองยอมสยบตอการปกครองของ[GetBulgarianLeader]อยางไมมีเงื่อนไข"
 bftb_bulgaria_fate_of_the_balkans.7.a: "เราไมอยูในฐานะที่จะปฏิเสธได..."
 bftb_bulgaria_fate_of_the_balkans.7.b: "[ROOT.GetNameDefCap] จะไมมีวันยอมสยบตอมหาอํานาจตางชาติ!"
 bftb_bulgaria_fate_of_the_balkans.8.t: "[FROM.GetNameDefCap] ยอมสยบตอ [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.8.desc: "นับตั้งแต [FROM.GetNameDef] เขารวม [BUL.GetFactionName] เราไดล็อบบี้รัฐบาลของพวกเขาใหยอมสยบตอ[GetBulgarianLeader] และหลังจากที่เราติดสินบนและบีบบังคับรัฐมนตรี[FROM.GetAdjective]หลายคนเมื่อไมนานมานี้ [FROM.GetLeader] ก็ถูกบีบใหลงนามในสนธิสัญญาที่รับรอง [BUL.GetNameDef] เปนเจาเหนือหัวอยางเปนทางการ ซึ่งทําใหประชาชน[FROM.GetAdjective]ตกอยูใตอํานาจในที่สุด"
 bftb_bulgaria_fate_of_the_balkans.8.a: "พวก[FROM.GetAdjective]รูจักที่ทางของตัวเองดี"
 bftb_bulgaria_fate_of_the_balkans.9.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะยอมสยบตอ [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.9.desc: "อยางไมคาดคิด รัฐบาล[FROM.GetAdjective]ตัดสินใจทาทาย[GetBulgarianLeader] วันนี้ [FROM.GetLeader] ไดประกาศตอสาธารณะวาปฏิเสธที่จะยอมสยบตอรัฐบาล[BUL.GetAdjective] เปนการตัดสินใจที่กลาหาญและไดรับการสนับสนุนจากประชาชน[FROM.GetAdjective]สวนใหญ แตก็บุมบามอยูดี เพราะพวกเขาตองพึ่งการคุมครองของเราหากรัฐอันนาสมเพชของพวกเขาจะอยูรอดผานความขัดแยงที่กําลังจะมาถึง และหลังจากนี้ [GetBulgarianLeader]ก็กําลังพิจารณาสถานะสมาชิกของ[FROM.GetAdjective]ใน [BUL.GetFactionName] ใหมแลว..."
 bftb_bulgaria_fate_of_the_balkans.9.a: "เราตองกดดันพวกเขาตอไป!"
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt: "การตัดสินใจ §Yปราบ [FROM.GetName] ใหอยูใตอํานาจ§! จะใชไดอีกครั้งใน §R365 วัน§!"
 bftb_bulgaria_fate_of_the_balkans.9.b: "การทาทายของพวกเขาจะไมรอดพนการลงโทษ!"
 bftb_bulgaria_fate_of_the_balkans.10.t: "[BUL.GetNameDefCap] บีบบังคับให [FROM.GetNameDef] เขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.10.desc: "หลังไดรับคําขาดจากรัฐบาล[BUL.GetAdjective] [FROM.GetLeader] แหง [FROM.GetNameDef] ซึ่งถูกบีบบังคับอยางชัดเจนดวยการขมขูตอประเทศ รัฐมนตรี และแมแตตัวเขาเอง ไดยอมจํานนตอแรงกดดันของ[BUL.GetAdjective] และประกาศวา [FROM.GetNameDef] จะออกจาก [ROOT.GetFactionName] ทันทีและเขารวม [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.10.a: "[BUL.GetNameDef] ตองชดใชเรื่องนี้!"
 bftb_bulgaria_fate_of_the_balkans.10.b: "ทางเลือกอันนาสมเพชของผูนําที่นาสมเพช..."
 BUL_transferred_bulgarian_state_autonomy_desc: "ไดยกรัฐที่บัลแกเรียอางสิทธิ์ใหแลว"

 bftb_bulgaria_political_leaders.1.t: "การสังหารฮริสโต ลูคอฟ"
 bftb_bulgaria_political_leaders.1.desc: "เมื่อคํ่าวานนี้ [GetLukovLeader] ถูกซุมโจมตีโดย[GetLukovPartisans]สะกดรอยตามเขาจากโรงภาพยนตรรอยัลไปจนถึงบานเลขที่ 1 ถนนอารทิลเลอรี \nขณะที่ผูนําทางการเมืองกําลังจะเขาบาน หนึ่งใน[GetLukovCriminals]ไดยิงเขาในระยะประชิดถูกที่ไหล ลูคอฟควาตัวชายผูนั้นไวและดันเขาติดกําแพง กอนจะพยายามถอยเขาไปในตัวอาคาร แต[GetLukovSecondAssailant] ไดยิงเขาที่หลังของเขา จากนั้นก็พยุง[GetLukovAccomplice]ของเธอหลบหนีไปทางลานบานขางเคียง ทิ้งฮริสโต ลูคอฟที่บาดเจ็บสาหัสปางตายไวที่ทางเขาบาน \n[GetLukovConclusion]"
 bftb_bulgaria_political_leaders.1.a: "แตงตั้งผูนําคนใหมจากสมาชิก UBNL"
 bftb_bulgaria_political_leaders.1.b: "เราตองการคนที่มีอุดมการณหัวรุนแรงกวานี้... แตงตั้งอเล็กซานดาร ซันคอฟ!"
 bftb_bulgaria_political_leaders.1.c: "โลกดีขึ้นเมื่อไมมีเขา!"
 bftb_bulgaria_political_leaders.1.d: "นาเศรา..."
 BUL_hristo_lukov_death_leader_party: "ฮริสโต ลูคอฟ ผูนําสหภาพกองทหารแหงชาติบัลแกเรีย"
 BUL_hristo_lukov_death_leader_country: "ฮริสโต ลูคอฟ ผูนํา[ROOT.GetAdjective]"
 BUL_hristo_lukov_death_partisans_communism: "สมาชิกกลุมรบที่จัดตั้งโดยพรรคคอมมิวนิสตบัลแกเรียสองคน ซึ่ง"
 BUL_hristo_lukov_death_partisans_other: "พลพรรคสองคน ซึ่งมีรายงานวา"
 BUL_hristo_lukov_death_criminals_communism: "พลพรรคสองคน หนึ่งในนั้นคืออีวาน บูรุดจีเยฟ ซึ่ง"
 BUL_hristo_lukov_death_criminals_other: "คนราย"
 BUL_hristo_lukov_death_second_assailant_communism: "วิโอเลตา ยาโควา สายลับคนที่สองที่เหยื่อยังไมทันสังเกตเห็น"
 BUL_hristo_lukov_death_second_assailant_other: "คนรายคนที่สองที่เหยื่อไมทันสังเกตเห็น และตามคําใหการของพยานคือผูหญิง"
 BUL_hristo_lukov_death_accomplice_communism: "สหาย"
 BUL_hristo_lukov_death_accomplice_other: "ผูสมรูรวมคิด"
 BUL_hristo_lukov_death_conclusion_communism: ""
 BUL_hristo_lukov_death_conclusion_other: "หนวยงานความมั่นคงแหงชาติของเรากําลังตามลาตัวฆาตกรอยู แตเราตองดูแลอนาคตของชาติ และแตงตั้งบุคคลใหมขึ้นแทนฮริสโต ลูคอฟในฐานะผูนําของ [ROOT.GetNameDef]"
 bftb_bulgaria_greek_influence.1.t: "[BUL.GetNameDefCap] หยั่งทาทีรัฐบาล[GRE.GetAdjective]"
 bftb_bulgaria_greek_influence.1.desc: "นายกรัฐมนตรี[BUL.GetAdjective] [BUL.GetLeader] ไดพบกับ [ROOT.GetLeader] เพื่อเสนอใหทําใหความสัมพันธฉันมิตรระหวาง [BUL.GetNameDef] กับ [ROOT.GetNameDef] เปนทางการผานขอตกลงสันติภาพ ผูนํา[BUL.GetAdjective]ยังเสนอสิทธิประโยชนทางภาษีบางประการแกนายทุน[ROOT.GetAdjective]ที่ตองการตั้งบริษัทในเครือในประเทศเพื่อนบานดวย"
 bftb_bulgaria_greek_influence.1.a: "[GRE.GetNameDefCap] และ [BUL.GetNameDef] จะรวมมือกันนับแตนี้!"
 bftb_bulgaria_greek_influence.1.b: "เราไวใจพวก[BUL.GetAdjective]ไมได!"
 bftb_bulgaria_greek_influence.2.t: "[FROM.GetNameDefCap] ตกลงตามขอเสนอของเรา"
 bftb_bulgaria_greek_influence.2.desc: "ผูนํา[FROM.GetAdjective] [FROM.GetLeader] ไดตอบรับขอเสนอของเรา และยินดีทําใหความสัมพันธฉันมิตรของเราเปนทางการผานขอตกลงที่รับประกันสันติภาพระหวาง [BUL.GetNameDef] กับ [FROM.GetNameDef]"
 bftb_bulgaria_greek_influence.2.a: "[BUL.GetNameDefCap] และ [GRE.GetNameDef] จะรวมมือกันนับแตนี้!"
 bftb_bulgaria_greek_influence.3.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอของเรา"
 bftb_bulgaria_greek_influence.3.desc: "ผูนํา[FROM.GetAdjective] [FROM.GetLeader] กลาววาเขาไมไววางใจนโยบายสันติภาพใหมของ[BUL.GetAdjective] จึงปฏิเสธขอเสนอของเราที่จะทําใหความสัมพันธฉันมิตรระหวาง [FROM.GetNameDef] กับ [BUL.GetNameDef] เปนทางการ"
 bftb_bulgaria_greek_influence.3.a: "พวกเขาหยิ่งเกินกวาจะเห็นความจําเปนของความรวมมือ!"
 bftb_bulgaria_british_influence.1.t: "รัฐบาล[BUL.GetAdjective]ขอความคุมครองจากเรา"
 bftb_bulgaria_british_influence.1.desc: "นายกรัฐมนตรีบัลแกเรีย [BUL.GetLeader] ไดเดินทางมาถึงประเทศของเราเพื่อเจรจาขอตกลงกับ [ENG.GetNameDef] โดยหวังใหประเทศของเราใหคํามั่นอยางเปนทางการวาจะปกปองดินแดนบัลแกเรีย \nตามคํากลาวของ [BUL.GetLeader] พรรคของเขาตองการกระชับความสัมพันธกับรัฐบาล[ENG.GetAdjective] แตเกรงวาบูรณภาพแหงดินแดนของ [BUL.GetNameDef] จะตกอยูในอันตรายหากปฏิเสธมหาอํานาจอื่นที่มีความทะเยอทะยานอันนาหวั่นเกรงในคาบสมุทรบอลขาน เชน ฝาย[GER.GetAdjective] ฝาย[ITA.GetAdjective] และฝาย[SOV.GetAdjective]"
 bftb_bulgaria_british_influence.1.a: "เราจะให [BUL.GetNameDef] อยูภายใตการคุมครองของ[ENG.GetAdjective]"
 bftb_bulgaria_british_influence.1.b: "เราตกลงลงนามสนธิสัญญาไมรุกราน"
 bftb_bulgaria_british_influence.1.c: "เรามีเรื่องสําคัญกวานี้ตองจัดการ"
 bftb_bulgaria_british_influence.2.t: "[FROM.GetNameDefCap] ตกลงรับประกันเอกราชของ[BUL.GetAdjective]"
 bftb_bulgaria_british_influence.2.desc: "รัฐบาล[FROM.GetAdjective]ตกลงลงนามในสนธิสัญญาที่ [BUL.GetLeader] เสนอ เพื่อรับประกันเอกราชของประเทศเรา และหวังจะพัฒนาความสัมพันธของเราใหดียิ่งขึ้นในอนาคต"
 bftb_bulgaria_british_influence.2.a: "ตอนนี้เราอยูภายใตการคุมครองของ[ENG.GetAdjective]แลว!"
 bftb_bulgaria_british_influence.3.t: "[FROM.GetNameDefCap] ตกลงลงนามสนธิสัญญาไมรุกราน"
 bftb_bulgaria_british_influence.3.desc: "แมรัฐบาล[FROM.GetAdjective]จะตกลงลงนามสนธิสัญญาระหวาง [BUL.GetNameDef] กับ [FROM.GetNameDef] แต [FROM.GetLeader] ปฏิเสธที่จะรับประกันเอกราชของประเทศเราอยางเปนทางการ โดยกลาววาการกระทําเชนนั้นอาจสงผลทางการทูตอยางรายแรง ซึ่งจะทําใหสถานการณเลวรายลงไมเพียงในคาบสมุทรบอลขาน แตทั่วทั้งยุโรป \nอยางไรก็ตาม ผูนํา[FROM.GetAdjective]ดูจะสนใจพัฒนาความสัมพันธฉันมิตรและสงเสริมความรวมมือระหวางประเทศของเรา"
 bftb_bulgaria_british_influence.3.a: "ถือเปนการเริ่มตน!"
 bftb_bulgaria_british_influence.4.t: "[ENG.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 bftb_bulgaria_british_influence.4.desc: "รัฐบาล[FROM.GetAdjective]แสดงใหเห็นวาไมสนใจกระชับความสัมพันธกับชาติของเราเลย และปฏิเสธโดยสิ้นเชิงตอขอเสนอของเราที่จะทําขอตกลงอยางเปนทางการเพื่อสนับสนุนเอกราชของ [BUL.GetNameDef] และพัฒนาความรวมมือระหวางประเทศของเรา"
 bftb_bulgaria_british_influence.4.a: "ไอพวกอังกฤษหัวดื้อ!"
 bftb_bulgaria_democratic_international_policies.1.t: "[BUL.GetNameDefCap] รับประกันเอกราชของ[ROOT.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.1.desc: "วันนี้รัฐบาล[BUL.GetAdjective]ไดประกาศวาเปนหนาที่ของ [BUL.GetNameDef] ที่จะปกปองบูรณภาพแหงดินแดนของชาติบอลขานที่เปนมิตรจากความทะเยอทะยานของมหาอํานาจตางชาติผูกระหายสงคราม \nดวยเหตุนี้ นายกรัฐมนตรี [BUL.GetLeader] จึงประกาศพันธะของ [BUL.GetNameDef] ที่จะปกปองชาติ[ROOT.GetAdjective] พรอมทั้งบังคับใชมาตรการใหมชุดหนึ่งเพื่อเตรียมการปองกันคาบสมุทรบอลขาน"
 bftb_bulgaria_democratic_international_policies.1.a: "ชางมีนํ้าใจเสียจริง!"
 bftb_bulgaria_democratic_international_policies.2.t: "การลงทุนดานอุตสาหกรรมของ[BUL.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.2.desc: "เจาพอธุรกิจ[BUL.GetAdjective]ไดลงทุนหลายโครงการในประเทศของเรา โดยตั้งบริษัทในเครือจํานวนหนึ่งที่จะชวยกระตุนอุตสาหกรรมของชาติ \nไมตองสงสัยเลยวานี่เปนสวนหนึ่งของแผนการใหญที่รัฐบาล[BUL.GetAdjective]คิดขึ้นเพื่อเพิ่มอิทธิพลและเผยแพรแนวคิดทุนนิยมในประเทศของเรา แตสําหรับตอนนี้ เราก็ไดประโยชนจากการขยายตัวทางอุตสาหกรรมเล็กๆ นี้"
 bftb_bulgaria_democratic_international_policies.2.a: "พวกเขาคิดวาจะชักจูงการเมืองของเราไดงายๆ อยางนั้นหรือ?"
 bftb_bulgaria_democratic_international_policies.3.t: "การอัดฉีดเงินทุนของ[BUL.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.3.desc: "รัฐบาล[BUL.GetAdjective]ไดใหการสนับสนุนทางการเงินแกบริษัท[ROOT.GetAdjective]ที่กําลังประสบปญหา เพื่อสรางเสถียรภาพใหภาคการเงินของประเทศเรา \nอยางไรก็ตาม ไมมีรัฐมนตรีคนใดของเราไรเดียงสาพอจะเชื่อแมแตวินาทีเดียววาการกระทํานี้มีแรงจูงใจมาจากความเปนนํ้าหนึ่งใจเดียวหรือความเห็นใจ เห็นไดชัดวาดวยการอัดฉีดเงินทุนนี้ รัฐบาล[BUL.GetAdjective]เพียงตองการเพิ่มการควบคุมเหนือเศรษฐกิจของเรา"
 bftb_bulgaria_democratic_international_policies.3.a: "เราตองระวังตัว..."
 bftb_bulgaria_democratic_international_policies.4.t: "บูรณภาพแหงดินแดนของ[BUL.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.4.desc: "คณะผูแทนจาก [BUL.GetNameDef] ไดเดินทางมาถึงประเทศของเราเพื่อขอให [ROOT.GetLeader] รับรองความชอบธรรมของรัฐบาล[BUL.GetAdjective]ในอดีตดินแดนบัลแกเรียที่ขณะนี้ถูกทหารฝายสัมพันธมิตรยึดครอง และคืนอํานาจควบคุมทางการบริหารของภูมิภาคใหแก [BUL.GetNameDef]"
 bftb_bulgaria_democratic_international_policies.4.a: "รัฐบาล[ROOT.GetAdjective]รับรองบูรณภาพแหงดินแดนของบัลแกเรีย!"
 bftb_bulgaria_democratic_international_policies.4_tt: "§Y[BUL.GetNameWithFlag]§! กลายเปนเจาของและผูควบคุมของ:"
 bftb_bulgaria_democratic_international_policies.4.b: "เปนไปไมได"
 bftb_bulgaria_democratic_international_policies.5.t: "[ENG.GetNameDefCap] รับรองบูรณภาพแหงดินแดนของบัลแกเรีย"
 bftb_bulgaria_democratic_international_policies.5.desc: "คณะผูแทนของเราที่สงไปยัง [ENG.GetNameDef] ไดกลับมาหลังประสบความสําเร็จในการยื่นคํารองตอรัฐบาล[ENG.GetAdjective] ซึ่งตกลงคืนอํานาจควบคุมทางการบริหารของอดีตดินแดนบัลแกเรียที่ถูกทหารฝายสัมพันธมิตรยึดครองใหแก [BUL.GetNameDef]"
 bftb_bulgaria_democratic_international_policies.5.a: "ประชาชนของเราปลื้มปติกับขาวนี้!"
 bftb_bulgaria_democratic_international_policies.6.t: "[ENG.GetNameDefCap] ปฏิเสธที่จะรับรองบูรณภาพแหงดินแดนของบัลแกเรีย"
 bftb_bulgaria_democratic_international_policies.6.desc: "นาเสียดายที่คณะผูแทนของเราที่สงไปยัง [ENG.GetNameDef] ไมสามารถทําใหรัฐบาล[ENG.GetAdjective]มอบอํานาจควบคุมทางการบริหารของอดีตดินแดนบัลแกเรียที่ขณะนี้ถูกทหารฝายสัมพันธมิตรยึดครองใหแกเราได"
 bftb_bulgaria_democratic_international_policies.6.a: "พวกเขากําลังทําลายบูรณภาพแหงดินแดนของเรา!"
 bftb_bulgaria_democratic_international_policies.7.t: "กติกาสัญญา[ENG.GetAdjective]-[BUL.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.7.desc: "รัฐบาล[ENG.GetAdjective]ไดสงคณะทูตมาแจงเราวาไดตกลงคืนอํานาจควบคุมทางการบริหารของอดีตดินแดนบัลแกเรียที่ทหารของเรายึดครองใหแกรัฐบาลของ [BUL.GetNameDef] โดยมีผลทันที \nเมื่อเผชิญกับเหตุการณเชนนี้ และลมเหลวในการพยายามเจรจาเรื่องการตัดสินใจนี้กับฝาย[ENG.GetAdjective] รัฐบาลของเราจึงถูกบีบใหสละอํานาจควบคุมดินแดนที่ยึดครองเหลานี้ เพื่อรักษาความสัมพันธอันดีกับพันธมิตรของเรา"
 bftb_bulgaria_democratic_international_policies.7.a: "นี่เปนการดูหมิ่น [ROOT.GetNameDef]"

 bftb_news.1.t: "รัฐบาล[BUL.GetAdjective]ประณาม IMRO"
 bftb_news.1.desc: "เมื่อชวงตนวันนี้ ผูนํา[BUL.GetAdjective] [BUL.GetLeader] ไดออกแถลงการณอยางเปนทางการแสดงการปฏิเสธองคการปฏิวัติมาซิโดเนียภายใน และประณามกิจกรรมขององคกรนี้อยางเปดเผย \nรัฐมนตรีวาการกระทรวงมหาดไทย[BUL.GetAdjective]ยังประกาศใชมาตรการพิเศษชุดหนึ่ง ซึ่งจะชวยใหรัฐบาลจัดสรรทรัพยากรไดมากขึ้นเพื่อดําเนินการเชิงรุกตอ IMRO และกวาดลางองคกรกอการรายนี้ใหสิ้นซากเสียที \nดวยแถลงการณนี้ ดูเหมือนวาในที่สุดรัฐบาล[BUL.GetAdjective]ก็ตองการยุติหนึ่งในตนตอสําคัญที่สุดของความขัดแยงและความตึงเครียดในคาบสมุทรบอลขาน..."
 bftb_news.1.a: "ถึงเวลาเสียที!"
 bftb_news.1.b: "ถึงเวลาทําลาย IMRO แลว!"
 bftb_news.1.c: "ดูเหมือนวันเวลาของ IMRO จะเหลืออีกไมมากแลว..."
 bftb_news.2.t: "รัฐบาล[BUL.GetAdjective]สนับสนุน IMRO"
 bftb_news.2.desc: "เมื่อชวงตนวันนี้ ผูนํา[BUL.GetAdjective] [BUL.GetLeader] ไดประกาศตอสาธารณะวารัฐบาลจะหาทางเจรจากับอีวาน มีฮายลอฟ หนึ่งในหัวหนาคนสําคัญที่สุดขององคการปฏิวัติมาซิโดเนียภายใน เพื่อยุติการสูรบระหวาง IMRO กับทางการ[BUL.GetAdjective] ตามคํากลาวของรัฐมนตรีวาการกระทรวงมหาดไทย [BUL.GetNameDef] จําเปนตองรวมมือกับองคกรนี้เพื่อปลดปลอยชาวมาซิโดเนีย [BUL.GetNameDef] จํานวนมากที่อาศัยอยูใน [YUG.GetNameDef] และ [GRE.GetNameDef] คําประกาศอันอาจหาญนี้จะจุดชนวนความขัดแยงในบอลขานขึ้นอีกครั้งอยางไมตองสงสัย และเพิ่มความตึงเครียดระหวางมหาอํานาจที่มีผลประโยชนในภูมิภาค..."
 bftb_news.2.a: "ชาวบัลแกเรียกําลังเลนกับไฟ!"
 bftb_news.2.b: "เราทําสิ่งที่ดีที่สุดเพื่อบัลแกเรีย"
 bftb_news.2.c: "ดูเหมือนความขัดแยงในบอลขานกําลังจะปะทุขึ้นอีกครั้ง..."
 bftb_news.3.t: "การสวรรคตของซารบอริสที่ 3 แหงบัลแกเรีย"
 bftb_news.3.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_news.3.a: "บัดนี้พระองคทรงหลับใหลอยางสงบแลว... ตางจากประเทศของพระองค!"
 bftb_news.4.t: "การคืนบัลลังกของซารเฟอรดินานดที่ 1"
 bftb_news.4.desc: "หลังการสวรรคตของซารแหงบัลแกเรีย บอริสที่ 3 รัฐบาลบัลแกเรียไดตัดสินใจอยางไมคาดคิดที่จะเขาพบพระราชบิดาของบอริส อดีตซารเฟอรดินานดที่ 1 เพื่อทูลขอใหพระองคกลับมาปกครองประเทศอีกครั้ง \nหลังการหารืออันยาวนานกับ[GetFormerLeaderBeforeFerdinand] เฟอรดินานดที่ 1 ผูปกครองกระหายสงครามที่ถูกบีบใหสละราชสมบัติแกพระราชโอรสหลังความพายแพอยางยอยยับในสงครามบอลขานครั้งที่สองและมหาสงคราม ก็ทรงตกลงเสด็จกลับโซเฟยเพื่อขึ้นครองราชยเปนซารแหงบัลแกเรียอีกครั้ง"
 bftb_news.4.a: "พระองคคือผูปกครองที่ [BUL.GetNameDef] ตองการ!"
 bftb_news.4.b: "ตาแกชราภาพคนนั้นยังปกครองไหวดวยหรือ?"
 bftb_news.4.c: "เหตุการณพลิกผันอยางไมคาดคิด..."
 BUL_former_leader_before_ferdinand_kyoseivanov: "นายกรัฐมนตรีเกออรกี คีโอเซอีวานอฟ"
 BUL_former_leader_before_ferdinand_filov: "นายกรัฐมนตรีบอกดาน ฟลอฟ"
 BUL_former_leader_before_ferdinand_mushanov: "นายกรัฐมนตรีนีโคลา มูชานอฟ"
 BUL_former_leader_before_ferdinand_lukov: "นายกรัฐมนตรีฮริสโต ลูคอฟ"
 BUL_former_leader_before_ferdinand_tsankov: "นายกรัฐมนตรีอเล็กซานดาร ซันคอฟ"
 BUL_former_leader_before_ferdinand_generic: "นายกรัฐมนตรีบัลแกเรีย"
 bftb_news.5.t: "การรณรงคผนวกรวมบัลแกเรียในบอลขาน"
 bftb_news.5.desc: "รัฐบาล[BUL.GetAdjective]ไดเริ่มการรณรงคผนวกรวมครั้งใหญในดินแดนที่ยึดครองในคาบสมุทรบอลขาน โดยสงเสริมการตั้งถิ่นฐานของชาวบัลแกเรีย เปลี่ยนชื่อเมืองและสถานที่ตางๆ เปนชื่อแบบบัลแกเรียดั้งเดิม และจัดระเบียบการบริหารทองถิ่นใหมตามแบบบัลแกเรีย \nดวยมาตรการเหลานี้ [BUL.GetLeader] หวังจะแสดงใหเห็นถึงความเปนบัลแกเรียของภูมิภาคเหลานี้ และสรางความชอบธรรมใหการผนวกโดย [BUL.GetNameDef] ในอนาคต"
 bftb_news.5.a: "อธิปไตยของ[BUL.GetAdjective]เหนือดินแดนเหลานี้ไมอาจถกเถียงไดอีกตอไป!"
 bftb_news.5.b: "พวกเขากลาทําลายวัฒนธรรม[THIS.GetAdjective]ไดอยางไร?!"
 bftb_news.5.c: "การเคลื่อนไหวที่กลาหาญของชาวบัลแกเรีย..."
 bftb_news.6.t: "การฟนฟูสังฆราชบัลแกเรีย"
 bftb_news.6.desc: "ดวยการสนับสนุนของรัฐบาล เอ็กซารเคตแหงบัลแกเรียไดกดดันใหอัครบิดรแหงคอนสแตนติโนเปลรับรองความเปนอิสระในการปกครองตนเองของคริสตจักรออรโธดอกซบัลแกเรีย \nเมื่อเผชิญกับขอเรียกรองที่มี [BUL.GetLeader] หนุนหลังอยางนาเกรงขาม สังฆราชสากลแหงคอนสแตนติโนเปลจึงถูกบีบใหยอมใหสมัชชาศักดิ์สิทธิ์รับรองธรรมนูญฉบับใหม ซึ่งจะสามารถเลือกประมุขของคริสตจักรบัลแกเรีย และฟนฟูสังฆราชบัลแกเรียหลังผานไปกวาเจ็ดศตวรรษ"
 bftb_news.6.a: "ความสําเร็จนี้นําความปติมาสูชาวบัลแกเรียทุกคน!"
 bftb_news.6.b: "ความคืบหนาที่นาสนใจ..."
 bftb_news.7.t: "จักรวรรดิบัลแกเรียที่สาม"
 bftb_news.7.desc: "เมื่อวานนี้ มีการชุมนุมทางการเมืองครั้งใหญที่จัดโดยรัฐบาลบัลแกเรียในโซเฟย \nระหวางงาน และทามกลางความตะลึงของผูชมสวนใหญ [BUL.GetLeader] ไดประกาศสถาปนาจักรวรรดิบัลแกเรียที่สาม และประกาศการเริ่มตนยุคใหมของชาติบัลแกเรียอันยิ่งใหญ \nสุนทรพจนนี้ตามมาดวยพิธีราชาภิเษกอันโออาแตขรึมขลังเพื่อสถาปนา [BUL.GetLeader] เปนจักรพรรดิแหงบัลแกเรีย ซึ่งผูนําทางการเมืองและการทหารไดปฏิญาณความจงรักภักดีตอจักรวรรดิและผูปกครอง"
 bftb_news.7.a: "นี่เสริมความแข็งแกรงใหชาติบัลแกเรีย!"
 bftb_news.7.b: "ดูเหมือน [BUL.GetLeader] จะหลงผิดคิดวาตนยิ่งใหญ..."
 bftb_news.7.c: "จําเปนตองทําขนาดนี้จริงหรือ?"
 bftb_news.8.t: "แนวรวมปตุภูมิยึดอํานาจในบัลแกเรีย"
 bftb_news.8.desc: "แนวรวมปตุภูมิเปนองคกรการเมืองตอตานฟาสซิสตของบัลแกเรียที่ตอตานระบอบอํานาจนิยมของ [FROM.GetLeader] อยางถึงราก ประกอบดวยสมาชิกจากหลายกลุมการเมืองแตไดรับอิทธิพลจากคอมมิวนิสตอยางมาก และกอตั้งขึ้นเพื่อเผชิญหนากับระบอบเผด็จการที่บังคับใชในบัลแกเรีย \nหลังการลุกฮือที่องคกรนี้วางแผนไว สงครามกลางเมืองอันรุนแรงก็ปะทุขึ้นระหวางทหารที่ภักดีตอรัฐบาลบัลแกเรียกับผูสนับสนุนแนวรวมปตุภูมิ \nในที่สุดสงครามก็สิ้นสุดลง และพวกคอมมิวนิสตไดโคนลมระบอบของ [FROM.GetLeader] และประกาศสถาปนาสาธารณรัฐประชาชนบัลแกเรีย"
 bftb_news.8.a: "ชัยชนะอันยิ่งใหญของประชาชนบัลแกเรีย!"
 bftb_news.8.b: "นากังวล..."
 bftb_news.9.t: "สหพันธสาธารณรัฐสังคมนิยมบอลขาน"
 bftb_news.9.desc: "[BUL.GetNameDefCap] ไดกอตั้ง [BUL.GetFactionName] ซึ่งเปนฉบับปรับปรุงของโครงการที่เคยเสนอไวในทศวรรษ 1920 แตไมคอยประสบความสําเร็จในตอนนั้น \nตามคํากลาวของนายกรัฐมนตรีบัลแกเรีย [BUL.GetLeader] รัฐบาล[BUL.GetAdjective]มุงหวังจะสรางแนวรวมในบอลขานเพื่อเผชิญหนากับชาติตางชาติผูรุกรานที่คุกคามภูมิภาคดวยความทะเยอทะยานทางดินแดน \nโครงการใหมนี้จะสําเร็จหรือไมยังตองรอดู แตที่แนๆ คือการสนับสนุนสหพันธรัฐบอลขานกําลังเพิ่มขึ้นอยางมากในหมูประชาชนของชาติเพื่อนบาน"
 bftb_news.9.a: "นี่คือหนทางสูความกาวหนา!"
 bftb_news.9.b: "นาสนใจ..."
 bftb_news.9.c: "ความพยายามอีกครั้งในการรวมบอลขานที่จะจบลงดวยความลมเหลว..."
 bftb_news.10.t: "การรวมบอลขานเปนหนึ่งเดียว"
 bftb_news.10.desc: "อดีตรัฐบาลของ [BUL.GetOldNameDef] ไดประกาศสถาปนา [BUL.GetNameDef] ซึ่งตั้งใจจะยกระดับ [BUL.GetFactionName] ขึ้นไปอีกขั้น โดยเรียกรองใหสมาชิกพันธมิตรรวมตัวกันภายใตรัฐบาลรวมศูนยเดียว \nตามคํากลาวของ [BUL.GetLeader] [BUL.GetNameDef] ตองการความรวมมืออยางเต็มที่ระหวางชาติบอลขาน ทิ้งความขัดแยงในอดีตไวเบื้องหลัง และสงเสริมเอกภาพในหมูประชาชนแหงบอลขาน"
 bftb_news.10.a: "ความฝนเปนจริงแลว!"
 bftb_news.10.b: "นี่คือสิ่งที่ [THIS.GetNameDef] ตองการจริงๆ หรือ?" #THIS
 bftb_news.10.c: "นั่นคือสิ่งที่บอลขานตองการจริงๆ หรือ?"
 bftb_news.10.d: "ไรสาระ!"
 bftb_news.11.t: "[BUL.GetNameDefCap] หยั่งทาที [GER.GetNameDef]"
 bftb_news.11.desc: "\nรัฐบาล[BUL.GetAdjective]ไดลงนามขอตกลงทางการคากับบริษัท[GER.GetAdjective]หลายแหง เพื่อกระชับความสัมพันธกับ [GER.GetNameDef] พรอมกับกระตุนการไหลเขาของทุนตางชาติสูประเทศ \nภายใตขอตกลงนี้ นักลงทุน[GER.GetAdjective]จะไดรับสิทธิประโยชนทางกฎหมายและการลดหยอนภาษีอยางมากเมื่อดําเนินกิจการใน [BUL.GetNameDef]"
 bftb_news.11.a: "นี่จะชวยใหความสัมพันธของเรากับ [GER.GetNameDef] ดีขึ้น!"
 bftb_news.11.b: "นี่จะจูงใจใหพวก[BUL.GetAdjective]เขาขางเรา!"
 bftb_news.11.c: "ถาอยางนั้น [BUL.GetNameDef] จะเขารวม [GER.GetFactionName] หรือ?"
 bftb_news.11.d: "พวกเขาแคตองการความคุมครองจาก [GER.GetLeader]!"
 bftb_news.12.t: "การแลกเปลี่ยนเทคโนโลยีทางทหาร[ITA.GetAdjective]-[BUL.GetAdjective]"
 bftb_news.12.desc: "\nหลังจากหยั่งทาทีรัฐบาล[GER.GetAdjective]แลว ตอนนี้ [BUL.GetNameDef] ตองการกระชับความสัมพันธกับ [ITA.GetNameDef] \n[BUL.GetLeader] และ [ITA.GetLeader] ไดลงนามในความตกลงดานการวิจัยที่รางโดยผูเชี่ยวชาญจากทั้งสองประเทศ เพื่อเอื้อตอการพัฒนายุทโธปกรณทางทหารสมัยใหมสําหรับกองทัพของตน \nควบคูกับความตกลงนี้ รัฐบาล[BUL.GetAdjective]ยังบังคับใชกฎระเบียบทางเศรษฐกิจใหมเพื่อสงเสริมการลงทุนของทุน[ITA.GetAdjective]ในประเทศ"
 bftb_news.12.a: "นี่จะเปนความสัมพันธที่ออกดอกออกผล!"
 bftb_news.12.b: "พวก[BUL.GetAdjective]ยังตองพิสูจนตัวเองวาเปนพันธมิตรที่ดีของ [ITA.GetNameDef]"
 bftb_news.12.c: "ดูเหมือนชาวบัลแกเรียจะรอนรนหาเพื่อนใหม..."
 bftb_news.12.d: "พวกเขากําลังทําขอตกลงกับปศาจ..."
 bftb_news.13.t: "สนธิสัญญาชวยเหลือซึ่งกันและกัน[SOV.GetAdjective]-[BUL.GetAdjective]"
 bftb_news.13.desc: "\n นายกรัฐมนตรี[BUL.GetAdjective] [BUL.GetLeader] และผูนํา[SOV.GetAdjective] [SOV.GetLeader] ไดลงนามในขอตกลงที่มุงกระชับความสัมพันธระหวางสองประเทศ และสงเสริมความรวมมือดานการทหารและเศรษฐกิจ \nดวยสนธิสัญญานี้ รัฐบาล[BUL.GetAdjective]ยังตั้งใจจะกระตุนการคากับ [SOV.GetNameDef] และใชทุน[SOV.GetAdjective]ในการลงทุนดานอุตสาหกรรมใหมๆ"
 bftb_news.13.a: "สนธิสัญญานี้เปนประโยชนตอ [BUL.GetNameDef] อยางยิ่ง!"
 bftb_news.13.b: "อิทธิพลโซเวียตในบอลขานเติบโตขึ้น!"
 bftb_news.13.c: "ถาอยางนั้น [BUL.GetNameDef] จะเขารวม [SOV.GetFactionName] หรือ?"
 bftb_news.13.d: "พวกเขาแคตองการความคุมครองจาก[SOV.GetAdjective]!"
 bftb_news.14.t: "สนธิสัญญามิตรภาพนิรันดรในบอลขาน"
 bftb_news.14.desc: "ในฐานะกาวแรกของความพยายามฟนฟูความสัมพันธระหวาง [BUL.GetNameDef] กับเพื่อนบานในบอลขาน รัฐบาล[BUL.GetAdjective]ไดลงนามในสนธิสัญญามิตรภาพกับ [YUG.GetNameDef] ซึ่งทั้งสองประเทศใหคํามั่นอยางเปนทางการวาจะพัฒนาความสัมพันธฉันมิตรและสงเสริมความรวมมือทางเศรษฐกิจระหวางกัน \nมีบางคนอางวาเจตนาที่แทจริงของรัฐบาล[BUL.GetAdjective]ไปไกลกวาการสรางความสัมพันธฉันมิตรกับเพื่อนบาน และเปาหมายที่แทจริงคือการกอตั้งสหพันธรัฐบอลขานเพื่อเผชิญหนากับมหาอํานาจยุโรป \nแตสําหรับตอนนี้ คํากลาวเหลานี้ก็เปนเพียงการคาดเดาเทานั้น..."
 bftb_news.14.a: "ในที่สุดนี่จะนําเสถียรภาพมาสูบอลขานบาง!"
 bftb_news.14.b: "ความพยายามอยางสิ้นหวังที่จะหยุดการรุกคืบของเราในสงคราม!"
 bftb_news.15.t: "ขอตกลงซาโลนิกา"
 bftb_news.15.desc: "นายกรัฐมนตรี[BUL.GetAdjective] [BUL.GetLeader] ไดพบกับ [GRE.GetLeader] ที่เมืองหลวง[GRE.GetAdjective] เพื่อหารือการลงนามในสนธิสัญญาที่รัฐบาลของทั้งสองประเทศใหคํามั่นอยางเปนทางการวาจะรักษาความสัมพันธฉันมิตรและสงเสริมความรวมมือทางเศรษฐกิจระหวาง [BUL.GetNameDef] กับ [GRE.GetNameDef] \nตามคํากลาวของ [BUL.GetLeader] นี่เปนเพียงกาวแรกของความพยายามฟนฟูความสัมพันธระหวาง [BUL.GetNameDef] กับเพื่อนบาน ซึ่งอาจใหผลอยางงดงามในอนาคตอันใกล"
 bftb_news.16.t: "[BUL.GetNameDefCap] หยั่งทาที [ENG.GetNameDef]"
 bftb_news.16.desc: "\nรัฐบาล[BUL.GetAdjective]ซึ่งแสวงหาการสนับสนุนจากมหาอํานาจที่สามารถรับประกันเอกราชและบูรณภาพแหงดินแดนของ [BUL.GetNameDef] ไดสงคณะทูตไปยัง [ENG.GetNameDef] เพื่อเจรจาลงนามสนธิสัญญากับรัฐบาล[ENG.GetAdjective] \nนอกจากขอตกลงที่เกี่ยวกับประเด็นทางทหารแลว สนธิสัญญานี้ยังรวมขอตกลงทางเศรษฐกิจที่ใหสิทธิประโยชนทางภาษีอยางมากแกนายทุน[ENG.GetAdjective]เมื่อดําเนินกิจการใน [BUL.GetNameDef]"
 bftb_news.16.a: "นี่จะชวยใหความสัมพันธของเรากับ [ENG.GetNameDef] ดีขึ้น!"
 bftb_news.16.b: "นี่จะจูงใจใหพวก[BUL.GetAdjective]เขาขางเรา!"
 bftb_news.16.c: "ถาอยางนั้น [BUL.GetNameDef] จะเขารวม [ENG.GetFactionName] หรือ?"
 bftb_news.16.d: "พวกเขาแคตองการความคุมครองจาก [ENG.GetLeader]!"

 bftb_news.201.t: "[TUR.GetNameDefCap] ฟนฟูกําลังทหารในชองแคบตุรกี"
 bftb_news.201.desc: "[TUR.GetNameDefCap] และ [SOV.GetNameDef] บรรลุขอตกลงในการแกไขสนธิสัญญาโลซาน ซึ่งลงนามและบังคับใชหลังจากสาธารณรัฐตุรกีที่เพิ่งถือกําเนิดขับไลฝายไตรภาคีไดในสงครามประกาศอิสรภาพ[TUR.GetAdjective] สนธิสัญญานี้ถูกประณามมานานวาเปนการละเมิดอธิปไตยของ[TUR.GetAdjective] แตวันนี้ ในที่สุดสนธิสัญญาก็ไดรับการแกไขโดยใหอนุสัญญามองเทรอซที่เพิ่งมีผลบังคับใชมาแทนที่ \n\nบัดนี้ [TUR.GetNameDefCap] ควบคุมการสัญจรเขาออกชองแคบตุรกีไดอยางสมบูรณ และรัฐรอบชองแคบก็ไดรับการฟนฟูกําลังทหารโดย [TUR.GetNameDef] แลว ผูสังเกตการณ[ENG.GetAdjective]ที่มีสวนรวมในกระบวนการนี้ เพียงพอใจที่หลีกเลี่ยงความขัดแยงในภูมิภาคได"
 bftb_news.201.a: "ก็ตามนั้น"
 bftb_news.201.b: "วันอันยิ่งใหญของสันติภาพ"
 bftb_news.201.c: "สนธิสัญญาแหงมหาสงครามอีกฉบับถูกฉีกทิ้ง"
 bftb_news.201.d: "ดีแลวสําหรับ [TUR.GetNameDef]"

 bftb_news.202.t: "ชองแคบตุรกียังคงเปนเขตปลอดทหาร"
 bftb_news.202.desc: "[TUR.GetNameDefCap] และ [SOV.GetNameDef] ไมสามารถบรรลุขอตกลงในการแกไขสนธิสัญญาโลซาน ซึ่งบังคับใชหลังจากสาธารณรัฐตุรกีที่เพิ่งถือกําเนิดขับไลฝายไตรภาคีไดในสงครามประกาศอิสรภาพ[TUR.GetAdjective] สนธิสัญญาโลซานทําใหชองแคบตุรกีเปนเขตปลอดทหาร และเปดทั้งชองแคบดารดะแนลสและบอสพอรัสใหเรือพลเรือนและเรือทหารผานไดโดยไมจํากัด และดูเหมือนวาสถานะเดิมนี้จะดําเนินตอไปในอนาคตอันใกล \n\n[TUR.GetLeader] ประณามการตัดสินใจนี้ในสุนทรพจนที่ถายทอดไปทั่วประเทศ โดยประณามที่ [TUR.GetNameDef] ยังคงตกเปนเปาของจักรวรรดินิยมที่ไมลดละ ผูสังเกตการณ[ENG.GetAdjective]ที่มีสวนรวมในกระบวนการนี้ เพียงพอใจที่หลีกเลี่ยงความขัดแยงในภูมิภาคได"
 bftb_news.202.a: "พวกเขาคิดถูกแลวที่เกรงกลัวแสนยานุภาพของเรา"
 bftb_news.202.b: "เราจะทําอะไรไดมากกวานี้อีก?"
 bftb_news.202.c: "เราทําไดมากกวานี้หรือเปลา?"
 bftb_news.202.d: "อยางนอยก็หลีกเลี่ยงสงครามได..."
 bftb_news.202.e: "สัญญาณความออนแอจาก [TUR.GetNameDef]..."

 bftb_news.203.t: "สงคราม[TUR.GetAdjective]-[SOV.GetAdjective]"
 bftb_news.203.desc: "สิ่งที่ควรเปนเพียงการเจรจาแกไขสนธิสัญญาอายุหลายทศวรรษอยางไมมีพิษภัย กลับบานปลายเปนสงครามเต็มรูปแบบระหวาง [SOV.GetNameDef] กับ [TUR.GetNameDef] เรื่องสิทธิ์ในชองแคบตุรกี \n\n[TUR.GetLeader] เรียกการลมของการเจรจาและการปะทุของสงครามวา ‘นาเสียดาย’ และเปนสิ่งที่ ‘หลีกเลี่ยงไดโดยสิ้นเชิง’ สวน [SOV.GetLeader] กลาววากองทัพอันไรเทียมทานของ [SOV.GetNameDef] จะไมหยุดยั้งดวยสิ่งใดเลยเพื่อใหสนธิสัญญาเกาแหงมหาสงครามยังคงมีผลบังคับ [SOV.GetLeader] ยังสัญญาดวยวาการปลดปลอยแรงงาน[TUR.GetAdjective]ใกลเขามาแลว และการทําลายลางระบอบ[TUR.GetAdjective]ปจจุบันจะเปนชัยชนะอันยิ่งใหญของอุดมการณคอมมิวนิสตสากล"
 bftb_news.203.a: "อูราาาาา!"
 bftb_news.203.b: "เขามาเลย!"
 bftb_news.203.c: "ใหตายสิ ชางเปนหายนะ..."
 bftb_news.203.d: "การทูตแบบดั้งเดิมดีๆ หายไปไหนหมด!?"
 bftb_news.203.e: "อืม เราควรพิจารณาชวยเหลือความพยายามทําสงครามของ[TUR.GetAdjective]..."
 bftb_news.203.f: "เลวราย"

 bftb_news.204.t: "สงครามกลางเมืองใน [TUR.GetNameDef]!"
 bftb_news.204.desc: "สงครามกลางเมืองไดปะทุขึ้นใน [TUR.GetNameDef] ระหวางรัฐบาลอนุรักษนิยมที่ปกครองอยูกับกลุมเคมาลิสตที่เคยครองอํานาจมากอน กลุมเคมาลิสตผูตอสูและไดมาซึ่งเอกราชของ [TUR.GetNameDef] หลังการลมสลายของจักรวรรดิออตโตมัน อางวาการละเมิดรัฐธรรมนูญอยางโจงแจงหลายครั้งของรัฐบาลปจจุบันเปนเหตุผลเพียงพอที่จะโคนลมระบอบนี้ นายพลผูมีชื่อเสียงและเคมาลิสตตัวยงอยางคาซึม โอรบายไดรับเลือกใหนําคณะทหารที่ตั้งใจจะโคนรัฐบาลอิสลามนิยมปจจุบันของ [TUR.GetLeader] \n\n[TUR.GetLeader] ประณามการเคลื่อนไหวของกลุมเคมาลิสตวาไมสมควรเกิดขึ้นในประเทศประชาธิปไตยที่ทํางานไดจริง และใหคํามั่นวาจะฟนฟูหลักนิติธรรมใหแกชาติที่แตกแยกของเขา"
 bftb_news.204.a: "เราตองชนะ!"
 bftb_news.204.b: "ชางเปนขาวราย..."
 bftb_news.204.c: "นี่คือโอกาส..."
 bftb_news.204.d: "เฮ เรื่องแบบนี้เรารูดีอยูบางนะ!"

 bftb_news.205.t: "รัฐสุลตานออตโตมันฟนคืนชีพ"
 bftb_news.205.desc: "ทามกลางความผิดหวังของทั้งโลก สุลตานออตโตมันไดกลับคืนสูบัลลังกหลังสงครามกลางเมืองอันโหดรายเปนพิเศษระหวางฝายอนุรักษนิยมกับกลุมเคมาลิสตสายฆราวาสนิยม ในพิธีอันฟุมเฟอยที่ดูราวกับหลุดออกมาจากยุคกลาง สุลตานไดกลับคืนสูตําแหนงเดิม และสาธารณรัฐของมุสตาฟา เคมาล อตาเติรกก็ถูกยุบไปตลอดกาล \n\n[TUR.GetLeader] ไดกลาวตอรัฐสุลตานที่เพิ่งฟนคืนชีพ แสดงทั้งความประหลาดใจและความถอมตนที่ไดกลับคืนสูตําแหนงเดิม สุลตานองคใหมเปนคนสุภาพออนโยน แตรายลอมดวยราชสํานักที่เต็มไปดวยพวกกระหายสงครามและพวกนิยมการทวงดินแดนคืน ผูเชี่ยวชาญซึ่งไมเคยเชื่อวาการกลับมาของสุลตานจะเปนไปไดดวยซํ้า ตางไมรูเลยวาอนาคตจะเปนอยางไร"
 bftb_news.205.a: "อัลฮัมดุลิลลาฮ!"
 bftb_news.205.b: "โอไม อีกแลวหรือ!"
 bftb_news.205.c: "เกิดขึ้นไดอยางไร!?"
 bftb_news.205.d: "เอะ นาสนใจ..."
 bftb_news.205.e: "ประหลาด"

 bftb_news.206.t: "รุงอรุณแหงกติกาสัญญาเมดิเตอรเรเนียน"
 bftb_news.206.desc: "[ITA.GetLeader] และ [TUR.GetLeader] ไดประกาศจัดตั้งกลุมพันธมิตรใหมในเมดิเตอรเรเนียน ในชื่อ ‘[TUR.GetFactionName]’ [ITA.GetLeader] ใหคํามั่นวากติกาสัญญาของพวกเขาจะครอบงํากิจการทั้งหมดของยุโรปในฐานะผูนําสูงสุดแหงทวีปยุโรป ขณะที่ [TUR.GetLeader] พูดอยางระมัดระวังกวา โดยยืนยันกับนักการทูตวาพันธมิตรนี้เปนเพียงพันธมิตรเชิงยุทธศาสตรที่มุงเพิ่มความมั่นคงในบอลขานและแกชาติในเมดิเตอรเรเนียน \n\nเจาหนาที่[ENG.GetAdjective]เรียกกองกําลังระดับภูมิภาคใหมนี้วา ‘ไมมีประโยชนและไมเปนที่ตอนรับ’ ขณะที่ผูสังเกตการณ[GER.GetAdjective]พูดอยางฟนธงกวา โดยทํานายวาฝายนี้จะเปนไดแคเชิงอรรถในประวัติศาสตรภายในสิ้นทศวรรษ"
 bftb_news.206.a: "ไชโย!"
 bftb_news.206.b: "ชางโงเขลา!"
 bftb_news.206.c: "Schwächlinge!"
 bftb_news.206.d: "คูแขงอีกรายเขาสูสังเวียน"
 bftb_news.206.e: "นี่มีความหมายอยางไรตอยุโรป?"

 bftb_news.207.t: "[TUR.GetNameDefCap] ใหคํามั่นตอความมั่นคงของบอลขาน"
 bftb_news.207.desc: "วันนี้ [TUR.GetLeader] ไดแถลงตอชาวโลก โดยประกาศวา [TUR.GetNameDef] จะขยายนโยบายตางประเทศที่มุงเนนบอลขาน ดวยการรับประกันเอกราชของทุกชาติในภูมิภาคที่ใหความรวมมือ ในสายตาผูสังเกตการณนานาชาติ ดูเหมือนวา [TUR.GetNameDef] ไดแสดงจุดยืนที่เด็ดขาดยิ่งขึ้นโดยเลือกลดการติดตอกับมหาอํานาจ เพื่อมุงเนนความมั่นคงในภูมิภาค \n\nแมการตัดสินใจของ[TUR.GetAdjective]จะไดรับคําชมจากบางฝาย แตก็สรางความตื่นตระหนกไมนอยแกอีกหลายฝาย โดยเฉพาะเจาหนาที่[ITA.GetAdjective]ที่ตอบสนองดวยความวิตก วิงวอนใหรัฐบาล[TUR.GetAdjective]ถอนจุดยืนหากตองการลดโอกาสที่ความขัดแยงจะปะทุขึ้นในภูมิภาค ฝายรัฐบาล[TUR.GetAdjective]ตอบกลับโดยเรียก [ITA.GetNameDef] วาเปน ‘ปรปกษประจําภูมิภาค’"
 bftb_news.207.a: "ชะตากรรมของเรากําลังรออยู"
 bftb_news.207.b: "ขอบคุณพระเจา"
 bftb_news.207.c: "นี่จะเปนปญหาแน"
 bftb_news.207.d: "อืม"

 bftb_news.208.t: "[TUR.GetNameDefCap] เรียกรองพรมแดนป 1920 คืน"
 bftb_news.208.desc: "[TUR.GetNameDefCap] ไดประกาศเจตนาที่จะขีดเสนพรมแดนของชาติใหมใหกลับไปเปนเหมือนกอนที่ [TUR.GetNameDef] จะใหสัตยาบันปฏิญญาแหงชาติ รัฐบาล[TUR.GetAdjective]ไดอางสิทธิ์เหนือรัฐเพื่อนบานเกือบทั้งหมด และปฏิเสธเสียงเรียกรองใหถอนการอางสิทธิ์อันไรมูลเหลานั้น \n\nประชาคมระหวางประเทศประณามรัฐบาล[TUR.GetAdjective]อยางกวางขวางตอการตัดสินใจนี้ และทั่วโลกตางกังวลวาการกระทําอันบุมบามของผูนํา[TUR.GetAdjective]อาจยิ่งโหมความหายนะที่โลกเผชิญมาตลอดหลายปที่ผานมา [TUR.GetNameDefCap] ดูจะมุงมั่นในเสนทางแหงการทวงแคน แตมีเพียงกาลเวลาที่จะบอกไดวาแนวทางการปกครองของพวกเขาจะนําไปสูผลลัพธเชนไร"
 bftb_news.208.a: "เราไมอาจใสใจกับแผนการของ[TUR.GetAdjective]ได"
 bftb_news.208.b: "การควํ่าบาตรดูจะเหมาะสม"
 bftb_news.208.c: "พวกกระหายสงคราม!"
 bftb_news.208.d: "เราตองการเพียงสิ่งที่เปนของเราโดยชอบธรรม"
 bftb_news.208.e: "พวกเขามีแตจะทําใหทุกอยางแยลง!"

 bftb_news.209.t: "การถือกําเนิดของตูราน"
 bftb_news.209.desc: "การพิชิตของตุรกีรุดหนาไปจนถึงจุดที่รัฐบาลตุรกีเห็นวาสมควรประกาศตนเปน [TUR.GetNameDef] การปรากฏตัวของจักรวรรดิใหมนี้สรางความตกตะลึงไปทั่วโลก เพราะมีผูสังเกตการณนอยมากที่เชื่อวาตุรกีจะสามารถฟนตัวจากสงครามประกาศอิสรภาพไดอยางสมบูรณในหลายทศวรรษตอมา ไมตองพูดถึงการสถาปนาจักรวรรดิใหมที่แผขยายขามทวีป \n\nหากรายงานเปนจริง [TUR.GetAdjective]ที่เพิ่งกอตั้งขึ้นอาจยังไมหยุดการขยายตัวอยางรวดเร็ว โดย [TUR.GetLeader] กลาววาจะไมมีวันหยุดการพิชิตจนกวาชาวเติรกทุกคนในโลกจะไดรับการปลดปลอย โลกทําไดเพียงเฝาดูตอไปดวยใจระทึก"
 bftb_news.209.a: "ไมมีใครหยุดเราได"
 bftb_news.209.b: "เปนไปไดอยางไร...?"

 bftb_news.301.t: "สงครามกลางเมือง[GRE.GetAdjective]!"
 bftb_news.301.desc: "สงครามกลางเมืองไดปะทุขึ้นใน[GRE.GetNameDef] ระหวางกองกําลังที่ภักดีตอกษัตริยผูยุบสภากรีก กับกองกําลังฝายสาธารณรัฐและคอมมิวนิสตที่ยึดมั่นในหลักการประชาธิปไตยของ[GRE.GetNameDef] แมฝายสาธารณรัฐและฝายคอมมิวนิสตจะเคยบาดหมางกันอยางหนัก แตทั้งสองก็รวมมือกันเพื่อโคนลมกษัตริยตางชาติผูไมเปนที่นิยม ซึ่งตั้งตนเปนทรราชเหนือชาติ[GRE.GetAdjective]ทั้งมวล \n\n[GRE.GetLeader] ประกาศวาทั้งตนเองและกองกําลังฝายนิยมกษัตริยที่จงรักภักดีจะไมหยุดสูรบจนกวาจะขับไลกองกําลังตอตานสถาบันกษัตริยทั้งหมดออกไปจากประเทศ"
 bftb_news.301.a: "รวมพลังเคียงขางองคกษัตริย!"
 bftb_news.301.b: "รัฐบาลฝายนิยมกษัตริยอาจเปนประโยชนตอเรา..."
 bftb_news.301.c: "ดี ดีมาก - ฉีกทึ้งกันเองไปเลย!"
 bftb_news.301.d: "กรีซจะไดพักหายใจบางไหมนะ?"

 bftb_news.302.t: "การสถาปนามหากรีซ"
 bftb_news.302.desc: "ผูสังเกตการณทั่วโลกที่เคยสงสัยวาการประชุมเฮราคลิออนอันลึกลับ ซึ่งมีผูเขารวมจํานวนมากจากทั่วยุโรปนั้นมีจุดประสงคใด บัดนี้ไมตองสงสัยอีกตอไป เพราะวันนี้[GRE.GetLeader]ไดประกาศวาความฝนของชาว[GRE.GetAdjective]ที่จะสรางมหากรีซไดกลายเปนจริงในที่สุด \n\nผูเชี่ยวชาญตางแสดงความประหลาดใจตอการขยายตัวอยางรวดเร็วของ[GRE.GetNameDef] โดยอางถึงความวุนวายทางการเมืองและปญหาเศรษฐกิจที่หยั่งรากลึกวาเปนเหตุผลที่การพลิกผันครั้งใหญของ[GRE.GetAdjective]ดูไมนาจะเกิดขึ้น แตเหตุการณลาสุดไดพิสูจนแลววาพวกเขาคิดผิดทั้งหมด"
 bftb_news.302.a: "ความฝนของเราเปนจริงแลวในที่สุด!"
 bftb_news.302.b: "ปกติเราคงไมยอมรับพฤติกรรมแบบนี้หรอก แตวาาา..."
 bftb_news.302.c: "มันจะไมชวยอะไรพวกเขาเลย!"
 bftb_news.302.d: "วาว"

