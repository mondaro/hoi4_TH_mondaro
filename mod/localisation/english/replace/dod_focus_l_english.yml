 YUG_towards_independence_mod: "ยูโกสลาเวียผลักดันสูเอกราช"
 YUGOSLAV_DEFENCE_LEAGUE: "สันนิบาตปองกันบอลขาน"
 YUG_crush_ustasa: "การลุกฮือของอุสตาเชที่ใกลเขามา"
 YUG_crush_ustasa_desc: "การตัดสินใจของรัฐบาลที่จะปราบปรามกลุมฟาสซิสตอุสตาเชไดยั่วยุผูสนับสนุนเอกราชของโครเอเชีย และอุสตาเชกําลังเรงเตรียมการลุกฮือดวยอาวุธตอตานรัฐบาล หากเราไมสามารถทําลายองคกรฟาสซิสตนี้ไดทันการ อุสตาเชอาจโคนลมรัฐบาลทองถิ่นของโครเอเชียและชูธงกบฏตอรัฐของเรา"
 YUG_ustasa_uprising: "การลุกฮือของอุสตาเช"
 YUG_ustasa_uprising_desc: "หากเราไมสามารถสกัดการลุกฮือของอุสตาเชไดทันเวลา เราจะตองเผชิญกับการกบฏครั้งใหญของโครเอเชียตอรัฐของเรา"
 YUG_ustasa_crushed_mission: "สกัดการลุกฮือของอุสตาเช"
 YUG_ustasa_crushed_mission_desc: "หากเราเพิ่มการควบคุมเหนือโครเอเชียได การลุกฮือของอุสตาเชจะถูกสกัดไว และปญหาทั้งหมดกับกลุมชาตินิยมโครเอเชียจะถูกระงับไวในขณะนี้"
 YUG_delay_ustasa_uprising: "ชะลอการลุกฮือ"
 YUG_delay_ustasa_uprising_desc: "เมื่ออุสตาเชกําลังเติบโต รัฐบาลจําเปนตองดําเนินมาตรการเพื่อชะลอการกบฏของโครเอเชีย แมความพยายามเชนนี้จะชะลอปฏิบัติการของเราเองในการยุติลัทธิชาตินิยมโครเอเชียอยางถาวรดวย แตการชะลอการลุกฮืออาจเปนสิ่งจําเปน"
 YUG_croat_concessions: "ขอผอนปรนแกชาวโครแอต"
 YUG_croat_concessions_desc: "การปฏิบัติตอประชาชนชาวโครแอตทั่วไปของเรานับตั้งแตตัดสินใจปราบปรามอุสตาเช ถูกมองอยางกวางขวางวาโหดรายและไรมนุษยธรรม บางทีการผอนปรนใหประชาชนชาวโครแอตบางอาจทําใหพวกเขาเริ่มมองเราในแงดีขึ้นเล็กนอย"
 YUG_croat_concessions_cooldown: "ขอผอนปรนแกชาวโครแอต"
 YUG_croat_concessions_cooldown_desc: "การปฏิบัติตอประชาชนชาวโครแอตทั่วไปของเรานับตั้งแตตัดสินใจปราบปรามอุสตาเช ถูกมองอยางกวางขวางวาโหดรายและไรมนุษยธรรม บางทีการผอนปรนใหประชาชนชาวโครแอตบางอาจทําใหพวกเขาเริ่มมองเราในแงดีขึ้นเล็กนอย"
 YUG_positive_discrimination_croat: "นโยบายใหสิทธิพิเศษแกชาวโครแอต"
 YUG_positive_discrimination_croat_desc: "โครเอเชียเองเปนบานของหลายวัฒนธรรมและหลายชนชาตินอกจากชาวโครแอต บางทีการออกกฎหมายที่เอื้อประโยชนแกชาวโครแอตดานโอกาสในการทํางานและการผอนปรนภาษี อาจมอบภาพลวงของการกําหนดชะตากรรมตนเองที่อุสตาเชสัญญาไวกับพวกเขาได"
 YUG_positive_discrimination_croat_cooldown: "นโยบายใหสิทธิพิเศษแกชาวโครแอต"
 YUG_positive_discrimination_croat_cooldown_desc: "โครเอเชียเองเปนบานของหลายวัฒนธรรมและหลายชนชาตินอกจากชาวโครแอต บางทีการออกกฎหมายที่เอื้อประโยชนแกชาวโครแอตดานโอกาสในการทํางานและการผอนปรนภาษี อาจมอบภาพลวงของการกําหนดชะตากรรมตนเองที่อุสตาเชสัญญาไวกับพวกเขาได"
 YUG_listening_posts_croatia: "ตั้งสถานีดักฟงในโครเอเชีย"
 YUG_listening_posts_croatia_desc: "ขณะนี้อุสตาเชเคลื่อนไหวใตดิน หลบเลี่ยงการตรวจจับและวางแผนกบฏอยูหลังประตูที่ปดสนิท บางทีการโนมนาวผูภักดีตอยูโกสลาเวียบางคนใหเขารวมอุสตาเช อาจทําใหเราดักฟงและขัดขวางปฏิบัติการและการโฆษณาชวนเชื่อของพวกเขาในภูมิภาคได"
 YUG_listening_posts_cooldown: "ตั้งสถานีดักฟงในโครเอเชีย"
 YUG_listening_posts_cooldown_desc: "ขณะนี้อุสตาเชเคลื่อนไหวใตดิน หลบเลี่ยงการตรวจจับและวางแผนกบฏอยูหลังประตูที่ปดสนิท บางทีการโนมนาวผูภักดีตอยูโกสลาเวียบางคนใหเขารวมอุสตาเช อาจทําใหเราดักฟงและขัดขวางปฏิบัติการและการโฆษณาชวนเชื่อของพวกเขาในภูมิภาคได"
 YUG_progress_crushing_decisions: "ปราบปรามอุสตาเช"
 YUG_progress_crushing_decisions_desc: "ถึงเวลากําจัดกลุมฟาสซิสตอุสตาเชแลว แมหลายคนอาจมองวาการกระทําเหลานี้เปนการกระทําแบบฟาสซิสตในตัวเอง แตเรารูดีวามาตรการเหลานี้จําเปนอยางยิ่งตอการรักษาเสถียรภาพของรัฐเราไว"
 YUG_raid_croat_villages: "บุกตรวจคนหมูบานโครเอเชีย"
 YUG_raid_croat_villages_desc: "อุสตาเชอยูทุกหนแหงและไมอยูที่ใดเลยในคราวเดียวกัน และใครก็อาจเปนผูสนับสนุนลัทธิฟาสซิสตของพวกเขาได เราตองบุกตรวจคนทุกเมืองและหมูบานในภูมิภาคโครเอเชียและสืบหาผูทรยศที่ซอนอยู"
 YUG_shut_down_recruitment_centers: "ปดศูนยรับสมัครของอุสตาเช"
 YUG_shut_down_recruitment_centers_desc: "อุสตาเชก็มีศูนยรับสมัครของตนเองเชนกัน คอยฝกและติดอาวุธใหทุกคนที่โงพอจะสูและตายเพื่ออุดมการณของพวกเขา เราตองคนหาและทําลายศูนยรับสมัครเหลานี้ เพื่อใหอุสตาเชไมมีหนทางเพิ่มกําลังคนเขาสูขบวนการ"
 YUG_arrest_ustasa_leaders: "จับกุมผูนําอุสตาเช"
 YUG_arrest_ustasa_leaders_desc: "เรามีรายชื่อบุคคลสําคัญในขบวนการอุสตาเช และถึงเวลาแลวที่เราจะใชประโยชนจากมันและเริ่มจับกุม"
 YUG_croatian_recruitment: "รณรงครับสมัครชาวโครแอต"
 YUG_croatian_recruitment_desc: "คําถามเรื่องเอกราชอยูบนริมฝปากของชาวโครแอตทุกคน แตไมใชทุกคนที่ตองการรัฐบาลอุสตาเชมากกวารัฐบาลยูโกสลาเวีย ถึงเวลาที่เราจะรับสมัครผูภักดีจํานวนหนึ่งเขาสูขบวนของเรา และแสดงใหประชาชนชาวโครแอตเห็นวายังมีผูที่อยากใหโครเอเชียอยูอยางปลอดภัยในออมกอดอันอบอุนของยูโกสลาเวีย"
