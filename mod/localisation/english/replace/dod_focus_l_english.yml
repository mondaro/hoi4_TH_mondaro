l_english:
 HUN_balanced_budget: "งบประมาณสมดุล"
 HUN_balanced_budget_desc: "เราตองใชทรัพยากรที่มีอยูใหดีที่สุด งบประมาณที่วางแผนอยางดีและสมดุลคือหัวใจสูความสําเร็จของรัฐบาลเรา"
 HUN_strengthen_the_monarchists: "เสริมกําลังฝายนิยมกษัตริย"
 HUN_strengthen_the_monarchists_desc: "กาวแรกในการคืนเกียรติภูมิเดิมใหฮังการี คือการเสริมความแข็งแกรงใหพรรคตาง ๆ ที่เรียกรองใหกลับสูระบอบกษัตริย"
 HUN_elect_a_king: "เลือกตั้งกษัตริย"
 HUN_elect_a_king_desc: "บัดนี้เสียงสนับสนุนจากประชาชนใหชาติกลับสูการปกครองระบอบกษัตริยมีมากพอ จนเราเริ่มคิดถึงการเริ่มกระบวนการเลือกกษัตริยองคใหมไดแลว"
 HUN_invite_the_habsburg_prince: "เชิญเจาชายราชวงศฮาพสบวรค"
 HUN_invite_the_habsburg_prince_desc: "ราชวงศฮาพสบวรคปกครองฮังการีมาชานาน และภายใตการปกครองของพวกเขา ประเทศนี้เคยเปนสวนหนึ่งของจักรวรรดิที่ยิ่งใหญที่สุดแหงหนึ่งของยุโรป การนําราชวงศฮาพสบวรคกลับมากุมบังเหียนยอมนําฮังการีสูความยิ่งใหญอีกครั้งอยางแนนอน"
 HUN_demand_a_referendum: "เรียกรองการลงประชามติ"
 HUN_demand_a_referendum_desc: "การแยกสลายของออสเตรีย-ฮังการีเปนความผิดพลาด ออสเตรียและฮังการีแข็งแกรงกวาเมื่ออยูดวยกัน และตองรวมกันจึงจะยิ่งใหญได ชาวออสเตรียตองถูกบีบใหจัดการลงประชามติตอขอเสนอการรวมสองชาติของเราอยางสันติ"
 HUN_take_austria_by_force: "ยึดออสเตรียดวยกําลัง"
 HUN_take_austria_by_force_desc: "กาวแรกในการคืนความรุงโรจนใหฮังการีคือการผนวกดินแดนออสเตรียกลับคืนมา เราไมอาจเสี่ยงใหการทูตลมเหลว จึงตองใชกําลัง"
 HUN_proclaim_the_restoration_of_austria_hungary: "ฟนฟูออสเตรีย-ฮังการี"
 HUN_proclaim_the_restoration_of_austria_hungary_desc: "ดวยการรวมสองชาติของเรากลับเปนหนึ่งและมีราชวงศฮาพสบวรคบนบัลลังก บัดนี้เราสามารถประกาศการฟนฟูออสเตรีย-ฮังการีอยางสมเกียรติ และเตรียมยึดคืนจังหวัดทางประวัติศาสตรอันชอบธรรมของเรา!"
 HUN_protect_czechoslovakia: "ปกปองเชโกสโลวาเกีย"
 HUN_protect_czechoslovakia_desc: "นับตั้งแตไดรับเอกราช เชโกสโลวาเกียเติบโตเปนชาติที่ทรงพลังและอุตสาหกรรมกาวหนา แตดินแดนของพวกเขาก็ถูกเพื่อนบานจองอยางละโมบ เราจะเสนอการคุมครองพวกเขาจากภัยคุกคามเหลานี้ ไมวาจะดวยการตอนรับพวกเขากลับมาเปนสวนสําคัญของจักรวรรดิเราอีกครั้ง หรือการใหสถานะรัฐภาคี"
 HUN_claim_transylvania: "อางสิทธิ์ทรานซิลเวเนีย"
 HUN_claim_transylvania_desc: "ดินแดนซีเบนบือรเกินถูกพรากไปจากเราอยางไมเปนธรรมหลังสงครามครั้งกอน ถึงเวลาทวงคืนแลว"
 HUN_march_to_the_shore: "มุงสูชายฝง"
 HUN_march_to_the_shore_desc: "มหาอํานาจที่แทจริงตองเขาถึงทองทะเลได ชายฝงเอเดรียติกคือสิทธิ์โดยกําเนิดของเรา"
 HUN_reclaim_venetia: "ทวงคืนเวเนเซีย"
 HUN_reclaim_venetia_desc: "การทรยศของชาวอิตาลีในมหาสงครามยังไมถูกลืม ถึงเวลาสั่งสอนพวกเขาใหรูที่ทาง และคืนจักรวรรดิสูพรมแดนตามธรรมชาติ"
 HUN_claim_galicia: "อางสิทธิ์กาลิเซีย"
 HUN_claim_galicia_desc: "รัฐโปแลนดไมใชอะไรอื่นนอกจากสิ่งประดิษฐ ซึ่งสรางขึ้นและรื้อทิ้งไดตามความจําเปน"
 HUN_claim_the_bucovina: "อางสิทธิ์บูโควีนา"
 HUN_claim_the_bucovina_desc: "มันอาจไมใชดินแดนที่สําคัญทางเศรษฐกิจที่สุดในบรรดาดินแดนอันกวางขวางของเรา แตก็ยังเปนสวนหนึ่งของจักรวรรดิเรา และเราจะทวงคืนมัน"
 HUN_reclaim_the_empire: "ทวงคืนจักรวรรดิ"
 HUN_reclaim_the_empire_desc: "เพื่อใหขอเรียกรองดินแดนตามสิทธิ์ทางกฎหมายของเราสมบูรณ เราตองอางสิทธิ์ในตําแหนงตาง ๆ ในเยอรมนี อิตาลี และปาเลสไตนที่พระมหากษัตริยราชวงศฮาพสบวรคของเราทรงครองอยู"
 HUN_elect_a_democratic_king: "เลือกกษัตริยฝายประชาธิปไตย"
 HUN_elect_a_democratic_king_desc: "เราตองหากษัตริยที่จะทรงธํารงหลักการประชาธิปไตยของชาติและสิทธิของประชาชน"
 HUN_responsible_government: "รัฐบาลที่รับผิดชอบตอรัฐสภา"
 HUN_responsible_government_desc: "ตามธรรมเนียมแลว รัฐบาลขึ้นตรงตอกษัตริยในทายที่สุด ทําใหสามารถเพิกเฉยตอเจตจํานงของประชาชนได เราจะแกไขรัฐธรรมนูญเพื่อใหแนใจวาประชาชน ไมใชผูปกครอง เปนผูที่รัฐบาลตองรับผิดชอบ"
 HUN_rapproachement_with_little_entente: "ปรองดองกับความตกลงไตรภาคีนอย"
 HUN_rapproachement_with_little_entente_desc: "อุดมการณที่เปนปรปกษรายลอมเราอยู และเราตองยืนยันสายสัมพันธกับเพื่อนบานในความตกลงไตรภาคีนอยอีกครั้ง เราจะถามพวกเขาวาตองการเห็นเราติดอาวุธใหมหรือไม"
 HUN_join_allies: "เขารวมฝายสัมพันธมิตร"
 HUN_join_allies_desc: "อนาคตของฮังการีและคุณคาประชาธิปไตยของเราอยูกับประชาธิปไตยตะวันตกที่สําคัญและพันธมิตรของพวกเขา ในฐานะสมาชิกของพันธมิตรนี้ เราสามารถเสริมกําลังใหพวกเขา และพึ่งพาการสนับสนุนจากพวกเขาไดเชนกัน"
 HUN_the_balkan_pact: "กติกาสัญญาบอลขาน"
 HUN_the_balkan_pact_desc: "ประชาธิปไตยตะวันตกอยูไกลเกินกวาจะชวยเราได เราจึงตองหาพันธมิตรที่ใกลบานกวา ในฐานะผูนํากติกาสัญญาบอลขาน เราจะเสนอการคุมครองแกพวกเขาและนําพวกเขาสูชัยชนะ!"
 HUN_an_unlikely_alliance: "พันธมิตรที่ไมนาเปนไปได"
 HUN_an_unlikely_alliance_desc: "เราไดเปลี่ยนแปลงประเทศของเราอยางถึงราก เราไมใชผูกระหายสงครามเชนในอดีตอีกตอไป ถึงเวลายื่นมือไปหาศัตรูเกาและสรางชะตากรรมใหม - รวมกัน"
 HUN_joint_oil_exploitation_company: "บริษัทรวมทุนขุดเจาะนํ้ามัน"
 HUN_joint_oil_exploitation_company_desc: "ดวยโอกาสที่อาจมีแหลงนํ้ามันในดินแดนของเรา เราจึงดึงดูดความสนใจจากตางชาติ มหาอํานาจที่เปนมิตรตางกระตือรือรนจะสนับสนุนอุตสาหกรรมนํ้ามันของเราดวยความรูทางเทคนิค และนี่จะเปนโอกาสอันคุมคาที่จะเรียนรูจากความกาวหนาของพวกเขา"
 HUN_elect_a_fascist_king: "เลือกกษัตริยฝายฟาสซิสต"
 HUN_elect_a_fascist_king_desc: "ชาติของเราตองการผูนําที่ทรงพลังเพื่อนําพาผานปอันปนปวนที่กําลังจะมาถึง ผูปกครองของเราตองเปนผูที่ประชาชนเคารพยกยอง และศัตรูหวาดเกรง"
 HUN_economic_intervention: "การแทรกแซงทางเศรษฐกิจ"
 HUN_economic_intervention_desc: "เราตองทุมทรัพยากรทางการเมืองอยางเพียงพอเพื่อชี้นําเศรษฐกิจ แมเศรษฐกิจจะพอใชได แตเรายังทําใหแข็งแกรงและมีประสิทธิภาพมากขึ้นไดอีก"
 HUN_strengthen_fascists: "เสริมกําลังฝายฟาสซิสต"
 HUN_strengthen_fascists_desc: "กลุมฟาสซิสตในประเทศของเราตองไดรับการเสริมความแข็งแกรงและเวทีสาธารณะเพื่อเผยแพรอุดมการณ ทัศนะของพวกเขาตออนาคตของฮังการีมีแนวโนมมากที่สุดที่จะนําประเทศกลับสูความยิ่งใหญอีกครั้ง"
 HUN_renounce_the_treaty_of_trianon: "ประกาศยกเลิกสนธิสัญญาทรียานง"
 HUN_renounce_the_treaty_of_trianon_tt: "§Yมิกโลช โฮรตี§! หรือ §Yฟรีดริช ฟรานซแหงเมคเลนบูรก-ชเวริน§! จะขึ้นเปนผูนําประเทศ\n"
 HUN_renounce_the_treaty_of_trianon_desc: "ความอยุติธรรมที่ถูกยัดเยียดใหชาติเราเมื่อมหาสงครามสิ้นสุด ซึ่งฉีกดินแดนและประชากรสองในสามของชาติที่เคยยิ่งใหญของเราไป เทียบไดกับความอัปยศที่เยอรมนีไดรับจากสนธิสัญญาแวรซาย และจะตองถูกลบลาง"
 HUN_renew_the_rome_protocols: "ตออายุพิธีสารโรม"
 HUN_renew_the_rome_protocols_desc: "ในเมื่อเยอรมนียังคงมุงแกไขสนธิสัญญาอยางตอเนื่อง เราตองตออายุพิธีสารโรมที่รางและลงนามไวในป 1934 ขอตกลงนี้จะไมเพียงชวยโดดเดี่ยวภัยคุกคามจากเยอรมนีและยูโกสลาเวียยิ่งขึ้น แตยังอาจเปนจุดเริ่มตนสูพันธมิตรที่แทจริงดวย"
 HUN_protect_austria: "ปกปองออสเตรีย"
 HUN_protect_austria_desc: "เพื่อยืนหยัดตอตานเยอรมนียิ่งขึ้น เราตองขัดขวางความทะเยอทะยานอยางเปดเผยของพวกเขาที่จะรวมกับออสเตรีย เราสามารถใหการรับประกันแกออสเตรีย มอบพลังทางการเมืองที่รัฐบาลปจจุบันตองการ เพื่อหวังวาจะยืนหยัดตอกลุมนิยมเยอรมันได"
 HUN_alliance_with_italy: "พันธมิตรกับอิตาลี"
 HUN_alliance_with_italy_desc: "การทาบทามเบื้องตนสูการเปนพันธมิตรที่เกิดขึ้นในพิธีสารโรมบัดนี้สามารถตอยอดไดแลว เราจะสงคณะผูแทนไปอิตาลีเพื่อหารือขอตกลงที่มีผลผูกพันสําหรับความรวมมือทางทหารอยางกวางขวาง ทั้งในเชิงรับและเชิงรุก"
 HUN_trade_deal_with_germany: "ขอตกลงการคากับเยอรมนี"
 HUN_trade_deal_with_germany_desc: "ประโยชนตออุตสาหกรรมของเราจากความสัมพันธทางการคากับเยอรมนีที่เพิ่มขึ้นนั้นชัดเจน และขออางที่วาเศรษฐกิจของเราอาจพึ่งพาเยอรมันมากเกินไปก็เกินจริง เราจะเดินหนาลงนามขอตกลงการคาอยางกวางขวาง"
 HUN_joint_aluminum_mining_company: "บริษัทรวมทุนเหมืองอะลูมิเนียม"
 HUN_joint_aluminum_mining_company_desc: "เนื่องจากอะลูมิเนียมเปนสวนสําคัญของอุตสาหกรรมสงครามสมัยใหม เราจึงสามารถขอการสนับสนุนจากเยอรมนีเพื่อขยายเหมืองทางตอนเหนือของประเทศไดโดยงาย"
 HUN_join_axis: "เขารวมฝายอักษะ"
 HUN_join_axis_desc: "ในเมื่อเศรษฐกิจของเราพึ่งพาเยอรมันมากขนาดนี้แลว ก็สมเหตุสมผลที่เราจะติดตามพวกเขาเขาสูสงคราม เราจะสงคําขอเขารวมพันธมิตรฝายอักษะอยางเปนทางการ"
 HUN_reaffirm_territorial_claims: "ยืนยันการอางสิทธิ์ดินแดน"
 HUN_reaffirm_territorial_claims_desc: "เมื่อปฏิเสธสนธิสัญญาทรียานงแลว บัดนี้เราตองดําเนินการยืนยันการอางสิทธิ์เหนือดินแดนที่ถูกขโมยไปจากเรา"
 HUN_demand_transylvania: "เรียกรองทรานซิลเวเนีย"
 HUN_demand_transylvania_desc: "หากเราไดดินแดนคืนมาโดยไมตองนองเลือดไดก็ยิ่งดี โรมาเนียจะไดรับคําขาดเรียกรองใหโอนดินแดนอันชอบธรรมของเราคืน"
 HUN_demand_southern_slovakia: "เรียกรองสโลวาเกียตอนใต"
 HUN_demand_southern_slovakia_desc: "หากเราไดดินแดนคืนมาโดยไมตองนองเลือดไดก็ยิ่งดี เชโกสโลวาเกียจะไดรับคําขาดเรียกรองใหโอนดินแดนอันชอบธรรมของเราคืน"
 HUN_demand_the_vojvodina: "เรียกรองวอยโวดีนา"
 HUN_demand_the_vojvodina_desc: "หากเราไดดินแดนคืนมาโดยไมตองนองเลือดไดก็ยิ่งดี ยูโกสลาเวียจะไดรับคําขาดเรียกรองใหโอนดินแดนอันชอบธรรมของเราคืน"
 HUN_claim_overlordship_over_slovakia: "อางสิทธิ์ความเปนเจาเหนือสโลวาเกีย"
 HUN_claim_overlordship_over_slovakia_desc: "สโลวาเกียสวนที่เหลือก็ตองถูกผนวกกลับเขาสูรัฐฮังการีเชนกัน ไมวาจะโดยตรงหรือดวยการเปนรัฐในอารักขา เราจะสงคําขาดอีกฉบับ"
 HUN_proclaim_greater_hungary: "ประกาศมหาฮังการี"
 HUN_proclaim_greater_hungary_desc: "เมื่อไดดินแดนที่ควรเปนของเราคืนมาแลว ประเทศของเราก็ขยายกลับสูพรมแดนทางประวัติศาสตร บัดนี้เราสามารถประกาศการกอตั้งมหาฮังการีตอชาวโลกอยางมั่นใจเต็มที่ และหมายตาเปาหมายใหม"
 HUN_GREATER_tt: "เปลี่ยนชื่อประเทศเปน §Yมหาฮังการี§!\n"
 HUN_demands_tt: "เมื่อเรียกรองดินแดน อีกฝายมีแนวโนมจะยอมสงมอบโดยไมนองเลือดมากขึ้นหากคุณมีกองทัพที่แข็งแกรง อยางไรก็ตาม พวกเขาอาจยังเชื่อวาจะตานเราไดหากอยูในฝายใดฝายหนึ่ง \n"
 HUN_assassinate_horthy: "ลอบสังหารโฮรตี"
 HUN_assassinate_horthy_desc: "อดีตพลเรือเอกจากมหาสงครามผูนี้ถืออํานาจและอิทธิพลมากเกินไปในฐานะผูสําเร็จราชการแหงราชอาณาจักรฮังการี และจุดยืนตอตานคอมมิวนิสตของเขากําลังเปนอุปสรรคใหญตอความพยายามของสหายเรา เขาตองถูกขจัดออกจากอํานาจหากชาติของเราจะกาวไปสูการปฏิวัติ"
 HUN_council_of_peoples_commissars: "สภาผูแทนราษฎรคอมมิสซาร"
 HUN_council_of_peoples_commissars_desc: "ตองจัดตั้งองคกรปกครองที่สามารถกํากับดูแลการเปลี่ยนผานของฮังการีสูรัฐคอมมิวนิสต เมื่อจัดตั้งแลว สภานี้จะทําหนาที่เทียบเทากับคณะรัฐมนตรีในระบบตะวันตก"
 HUN_the_hungarian_red_army: "กองทัพแดงฮังการี"
 HUN_the_hungarian_red_army_desc: "ผูรักชาติทุกคนที่รักมาตุภูมิตองทําหนาที่ปกปองบานเกิดเมืองนอน เราจะจัดตั้งกองทัพแดงฮังการีตามแบบอยางโซเวียตทางตะวันออก เพื่อปกปองการปฏิวัติที่เพิ่งตั้งไขของเรา"
 HUN_soviet_hungarian_military_academy: "โรงเรียนนายรอยโซเวียต-ฮังการี"
 HUN_soviet_hungarian_military_academy_desc: "กองทัพของเราไรคาหากขาดผูนํา โซเวียตมีประสบการณดานการทหารมากกวาเรามาก จึงอาจเปนประโยชนหากรวมมือกับพวกเขาในการฝกบุคลากรทางทหารที่เกงที่สุดของเรา เพื่อการนี้ เราจะจัดตั้งสถาบันการทหารพรอมครูฝกที่เชี่ยวชาญที่สุดจากทั้งสองชาติ"
 HUN_join_comintern: "เขารวมโคมินเทิรน"
 HUN_join_comintern_desc: "หนทางขางหนาของการปฏิวัติอยูกับโคมินเทิรน เมื่อยืนหยัดรวมกับสหายของเรา เราจะกวาดลางความอยุติธรรมของทุนนิยมและภัยคุกคามฟาสซิสตที่กอตัวอยูทางตะวันตก"
 HUN_the_revolutionary_council: "สภาปฏิวัติ"
 HUN_the_revolutionary_council_desc: "โคมินเทิรนไดละทิ้งการตอสูกับจักรวรรดินิยม แลวหันไปพอใจกับการอยูรวมกัน หากแรงงานทั่วโลกจะไดรับอิสรภาพ เราตองชูคบเพลิงของมารกซและเลนินตอไป - แมตองตอตานสหภาพโซเวียตก็ตาม หากจําเปน"
 HUN_FACTION_COMMIE: "สหภาพโซเวียตคอมมิวนิสต"
 HUN_pressure_romania: "กดดันโรมาเนีย"
 HUN_pressure_romania_desc: "ขณะที่เรามุงความสนใจไปที่ภัยฟาสซิสตทางตะวันตก เราไมอาจปลอยใหภัยคุกคามที่อาจเกิดขึ้นดํารงอยูทางดานหลัง โดยเฉพาะเมื่อมันตั้งอยูระหวางเรากับพันธมิตรทางตะวันออก โรมาเนียตองถูกทําใหเปนรัฐคอมมิวนิสตรวมอุดมการณ หรือไมก็ตองยอมยกเสนทางบกสําคัญที่เชื่อมสูพันธมิตรของเรา เพื่อใหเรารับการสนับสนุนจากพวกเขาได"
 HUN_intervene_in_czechoslovakia: "แทรกแซงในเชโกสโลวาเกีย"
 HUN_intervene_in_czechoslovakia_desc: "ชาวเชโกสโลวักไดรับดินแดนบางสวนที่ถูกพรากไปจากเราในสนธิสัญญาทรียานง ขณะเดียวกัน เราก็รูถึงแผนการของเยอรมนีตอดินแดนของพวกเขา บางทีเราอาจจัดการแลกเปลี่ยนได ดินแดนอันชอบธรรมของเราแลกกับการรับประกันการสนับสนุนทางทหารจากโซเวียตในกรณีที่เยอรมนีรุกราน"
 HUN_industrial_revitalization: "ฟนฟูอุตสาหกรรม"
 HUN_industrial_revitalization_desc: "ฐานอุตสาหกรรมของเราเสื่อมโทรมลงอยางนาเปนหวงในชวงไมกี่ปที่ผานมา เราตองพยายามนําเทคโนโลยีใหมมาใชเพื่อไลตามสวนที่เสียไป"
 HUN_support_urbanization: "สนับสนุนการขยายตัวของเมือง"
 HUN_support_urbanization_desc: "ผูคนจํานวนมากขึ้นเรื่อย ๆ ละทิ้งหมูบานและเมืองเล็กเพื่อยายเขาสูศูนยกลางเมืองใหญ หางานในโรงงานแหงใหม แมเราจะยังไมอาจจัดหางานใหพวกเขาไดทันที แตเราสามารถสรางยานเมืองใหมเพื่อเตรียมทางสําหรับการขยายตัวในภายหลัง"
 HUN_institute_for_industrial_techniques: "สถาบันเทคนิคอุตสาหกรรม"
 HUN_institute_for_industrial_techniques_desc: "การวิจัยอุตสาหกรรมแบบเฉพาะกิจทําใหการเติบโตชาลงและผลิตภาพตํ่าลง เราควรจัดตั้งสถาบันใหมที่รวบรวมงานวิจัยดานวิธีการอุตสาหกรรมใหมทั้งหมดไวดวยกัน"
 HUN_announce_the_gyor_program: "ประกาศโครงการเจอร"
 HUN_announce_the_gyor_program_desc: "กองทัพของเราออนแออยางนาเปนหวง และจําเปนอยางยิ่งที่เราตองเพิ่มขนาดและขีดความสามารถในการรบ ในการนี้เราตองเสริมกําลังอุตสาหกรรมอยางมากเพื่อใหทันกับความตองการยุทโธปกรณที่เพิ่มขึ้น โครงการเจอรหาปจะเพิ่มการใชจายของรัฐบาลไมเพียงแตในกองทัพเอง แตรวมถึงภาคสวนสนับสนุนอยางอุตสาหกรรม เกษตรกรรม โครงสรางพื้นฐาน และการศึกษา"
 HUN_civilian_industry: "อุตสาหกรรมพลเรือน"
 HUN_civilian_industry_desc: "แมจะตองการอุตสาหกรรมการทหารเพิ่มขึ้น แตเราตองไมละเลยความตองการของพลเรือน การขยายอุตสาหกรรมพลเรือนจึงเปนสิ่งจําเปน"
 HUN_reintegrate_the_railroads: "รวมเครือขายรถไฟกลับคืน"
 HUN_reintegrate_the_railroads_desc: "เครือขายทางรถไฟที่ครอบคลุมจักรวรรดิออสเตรีย-ฮังการีเดิมไดแตกเปนสวน ๆ นับตั้งแตจักรวรรดิแยกสลายเปนชาติเอกราช เราควรติดตอรัฐที่เคยเปนสวนหนึ่งของจักรวรรดิและเสนอใหรวมเครือขายทางรถไฟกลับคืน เพื่อพัฒนาโครงสรางพื้นฐานโดยรวม"
 HUN_invite_foreign_investors: "เชิญนักลงทุนตางชาติ"
 HUN_invite_foreign_investors_desc: "ฮังการีตั้งอยูใจกลางยุโรปตะวันออก และเราสามารถใชทําเลที่ตั้งใจกลางนี้ดึงดูดนักลงทุนตางชาติที่สนใจพัฒนาโครงสรางพื้นฐานและอุตสาหกรรมของเราได"
 HUN_expand_the_manfred_weiss_steel_works: "ขยายโรงงานเหล็กกลามันเฟรด ไวส"
 HUN_expand_the_manfred_weiss_steel_works_desc: "โรงงานเหล็กกลามันเฟรด ไวสขนาดมหึมาเปนผูรับเหมาดานกลาโหมที่สําคัญมาตั้งแตมหาสงคราม ซึ่งทําใหโรงงานขยายตัวอยางมหาศาล หากเราจะเพิ่มกําลังทหารเพื่อเตรียมพรอมสําหรับสงครามครั้งหนา ความภาคภูมิใจแหงอุตสาหกรรมชาติของเราจะตองไดรับการขยายอีกครั้ง"
 HUN_expand_the_aluminum_industry: "ขยายอุตสาหกรรมอะลูมิเนียม"
 HUN_expand_the_aluminum_industry_desc: "เราตองการทรัพยากรทั้งหมดที่มี ทั้งเพื่อการสงออกและใชในประเทศ อุตสาหกรรมอะลูมิเนียมของเราแมจะกวางขวางอยูแลว แตยังมีชองทางพัฒนาอีก และเราควรทุมทรัพยากรเพื่อการนี้ทันที"
 HUN_expand_the_technical_university_of_budapest: "ขยายมหาวิทยาลัยเทคนิคบูดาเปสต"
 HUN_expand_the_technical_university_of_budapest_desc: "เราตองการคนหัวกะทิมากขึ้นเพื่อคนพบสิ่งที่จะชวยเราในความขัดแยงขางหนา การขยายมหาวิทยาลัยในเมืองหลวงจะเพิ่มจํานวนวิศวกรและนักวิทยาศาสตรที่มีทักษะสําหรับอุตสาหกรรมการทหารของเรา"
 HUN_support_domestic_industry: "สนับสนุนอุตสาหกรรมในประเทศ"
 HUN_support_domestic_industry_desc: "กองทัพตองการยุทโธปกรณมากขึ้น และอุตสาหกรรมของเราตองตามใหทัน เราจะทุมทรัพยากรใหมเพื่อขยายอุตสาหกรรมอาวุธ"
 HUN_domestic_arms_industry: "อุตสาหกรรมอาวุธในประเทศ"
 HUN_domestic_arms_industry_desc: "อุตสาหกรรมอาวุธของเราตองไดรับการหนุนหลังจากฐานอุตสาหกรรมพลเรือนที่แข็งแกรง ไมเพียงเพื่อผลิตอุปกรณอุตสาหกรรม แตยังเพื่อกอตั้งโรงงานแหงใหมดวย"
 HUN_autarky: "การพึ่งพาตนเองทางเศรษฐกิจ"
 HUN_autarky_desc: "เราพึ่งพาแหลงนํ้ามันจากตางประเทศมากเกินไป เราควรเอาอยางความพยายามของเยอรมนีในการพัฒนานํ้ามันสังเคราะห"
 HUN_synthetic_industry: "อุตสาหกรรมสังเคราะห"
 HUN_synthetic_industry_desc: "เมื่อเราเชี่ยวชาญเทคโนโลยีการทําถานหินเหลวแลว เราสามารถสรางโรงงานนํารองเพื่อเริ่มการผลิตได"
 HUN_synthetic_oil_tt: "เพิ่มโรงกลั่นนํ้ามันสังเคราะหในรัฐแบบสุม ตําแหนงที่ตั้งจะแสดงเมื่อการวิจัยพิสูจนแลววาการผลิตนํ้ามันสังเคราะหเปนไปได\n"
 HUN_aeronautic_technology_institute: "สถาบันเทคโนโลยีการบิน"
 HUN_aeronautic_technology_institute_desc: "ทองฟาไดกลายเปนมิติใหมของการสงคราม และหลายฝายยังประเมินความสําคัญของมันตํ่าเกินไป เราตองเรียนรูที่จะเชี่ยวชาญมิติใหมนี้ และจัดสรรทรัพยากรเพื่อพัฒนาหลักนิยมและยุทโธปกรณใหมที่ทําใหเราทําเชนนั้นได"
 HUN_boost_hungarian_aviation_industry: "สงเสริมอุตสาหกรรมการบินฮังการี"
 HUN_boost_hungarian_aviation_industry_desc: "ฐานอุตสาหกรรมของเราตองไดรับการเสริมใหแข็งแกรง เพื่อใหผลิตเครื่องบินรุนใหมไดในจํานวนมากพอที่จะครองนานฟา"
 HUN_secret_rearmament: "การติดอาวุธใหมอยางลับ ๆ"
 HUN_secret_rearmament_desc: "ขอจํากัดที่สนธิสัญญาทรียานงบังคับใชกับเราหามไมใหเราเพิ่มขนาดกองทัพ ถึงกระนั้น บรรยากาศการเมืองโลกก็ปนปวนยิ่งขึ้นทุกที และความขัดแยงก็กอตัวอยูที่ขอบฟา เราไมอาจอยูอยางไรการปองกัน และตองเริ่มติดอาวุธใหม แมจะหมายถึงการฝาฝนขอกําหนดของสนธิสัญญาสันติภาพที่ถูกบังคับใชกับเราหลังมหาสงครามอยางลับ ๆ ก็ตาม"
 HUN_secret_rearmament_tt: "§Gปลดล็อกกฎหมาย §Yการระดมพลบางสวน§!§!\n"
 HUN_secret_rearmament_tt_2: "§Rจิตวิญญาณนี้จะถูกนําออกเมื่อเพิ่มการเกณฑทหารเกินกวา §Yอาสาสมัครเทานั้น§!§!\n"
 HUN_war_games: "การซอมรบ"
 HUN_war_games_desc: "ดวยการซอมรบขนาดเล็ก เราสามารถคนพบจุดบกพรองในโครงสรางทางทหารปจจุบัน และนําประสบการณที่ไดมาแกไขขอบกพรอง"
 HUN_theoretical_air_efforts: "ความพยายามดานทฤษฎีการรบทางอากาศ"
 HUN_theoretical_air_efforts_desc: "เราตองทุมทรัพยากรอยางเพียงพอในการคิดคนทฤษฎีใหมดานการสงครามทางอากาศ หากเราเขาสูสงคราม ทฤษฎีที่พัฒนาขึ้นจะมีคาอยางประเมินไมได"
 HUN_bled_agreement: "ขอตกลงเบลด"
 HUN_bled_agreement_desc: "การติดอาวุธใหมอยางลับ ๆ ขนาดเล็กไมเพียงพอ เราตองติดตอเพื่อนบานและขอใหแกไขสนธิสัญญาที่บังคับใชกับเราหลังมหาสงคราม ฮังการีมีสิทธิ์เทาเทียมในการติดอาวุธ"
 HUN_bled_agreement_custom_effect_tooltip: "อาจนําไปสูการแทนที่ §Hสนธิสัญญาทรียานง§!"
 HUN_establish_the_air_force: "จัดตั้งกองทัพอากาศ"
 HUN_establish_the_air_force_desc: "เมื่อขอจํากัดทางกฎหมายหมดไปแลว ถึงเวลาจัดตั้งกองทัพอากาศฮังการีอยางเปนทางการ"
 HUN_indigenous_designs: "แบบที่ออกแบบเองในประเทศ"
 HUN_indigenous_designs_desc: "ความเชี่ยวชาญทางเทคนิคของเราเองเพียงพอตอความตองการ การควบคุมสํานักออกแบบของเราเองทําใหเราจัดสรรทรัพยากรใหไดมากขึ้น สงผลใหพัฒนาแบบใหมไดเร็วขึ้น"
 HUN_heavy_fighter_effort: "ความพยายามดานเครื่องบินขับไลหนัก"
 HUN_heavy_fighter_effort_desc: "เครื่องบินขับไลของเราตองสามารถสนับสนุนเครื่องบินทิ้งระเบิดที่เปราะบางกวาได ซึ่งตองการอาวุธที่หนักขึ้นและพิสัยที่ไกลขึ้น แลกกับความเร็วและความคลองตัวบางสวน"
 HUN_light_fighter_effort: "ความพยายามดานเครื่องบินขับไลเบา"
 HUN_light_fighter_effort_desc: "เราตองการเครื่องบินขับไลเพื่อครองความเหนือกวาทางอากาศเฉพาะพื้นที่เหนือกองกําลังของเรา และเพื่อสกัดกั้นเครื่องบินขาศึกที่คุกคามชาติของเรา"
 HUN_cas_focus: "มุงเนน CAS"
 HUN_cas_focus_desc: "กองทัพสมัยใหมตองการการสนับสนุนจากยานรบไมเพียงแคบนภาคพื้นดิน แตรวมถึงบนทองฟาดวย"
 HUN_tac_focus: "มุงเนนเครื่องบินทิ้งระเบิดทางยุทธวิธี"
 HUN_tac_focus_desc: "ชัยชนะจะไดมาดวยการทําลายลางกําลังภาคพื้นดินของศัตรู เราตองมุงสนับสนุนกองทัพของเราดวยการโจมตีทางยุทธวิธีตอเปาหมายทั้งระยะใกลและในเขตลึก"
 HUN_license_foreign_designs: "ซื้อสิทธิบัตรแบบตางชาติ"
 HUN_license_foreign_designs_desc: "กองทัพอากาศตางชาติไดแสดงใหเห็นแลววาพวกเขามีแบบเครื่องบินคุณภาพสูงที่ผานการพิสูจนมาแลว แทนที่จะเสี่ยงโชคพึ่งพาความเชี่ยวชาญดานการบินที่เพิ่งเริ่มตนของเรา เราควรขออนุญาตผลิตเครื่องบินรุนตางชาติเหลานี้ภายใตสิทธิบัตร"
 HUN_fighter_competition: "การประกวดเครื่องบินขับไล"
 HUN_fighter_competition_desc: "เพื่อใหเราเลือกเครื่องบินขับไลรุนที่ดีที่สุดมาผลิตภายใตสิทธิบัตรได เราตองใหผูเขาแขงขันประชันกัน เราจะจัดการประกวดเครื่องบินขับไลและเชิญมหาอํานาจทั้งหมดสงเครื่องบินขับไลรุนทันสมัยที่สุดของตนเขารวม"
 HUN_bomber_competition: "การประกวดเครื่องบินทิ้งระเบิด"
 HUN_bomber_competition_desc: "เพื่อใหเราเลือกเครื่องบินทิ้งระเบิดรุนที่ดีที่สุดมาผลิตภายใตสิทธิบัตรได เราตองใหผูเขาแขงขันประชันกัน เราจะจัดการประกวดเครื่องบินทิ้งระเบิดและเชิญมหาอํานาจทั้งหมดสงเครื่องบินทิ้งระเบิดรุนทันสมัยที่สุดของตนเขารวม"
 HUN_joint_air_development: "การพัฒนาอากาศยานรวมกัน"
 HUN_joint_air_development_desc: "วิธีที่ดีที่สุดในการพัฒนาเครื่องบินรุนใหมคือการรวมมือกับพันธมิตร ดวยการรวมหัวกะทิจากทุกชาติของเราเขาดวยกัน เราจะไดผลลัพธที่ดีที่สุด"
 HUN_army_maneuvers: "การซอมรบของกองทัพบก"
 HUN_army_maneuvers_desc: "กองทัพของเราตองกลับมาอยูในสภาพพรอมรบสําหรับความขัดแยงดวยอาวุธที่อาจเกิดขึ้นในอนาคต เราจะสงพวกเขาออกซอมรบเพื่อพัฒนายุทธวิธีและยุทธศาสตรใหม"
 HUN_mobile_focus: "มุงเนนความคลองตัว"
 HUN_mobile_focus_desc: "กองทัพที่คลองตัว สามารถโจมตีไดทุกที่ทุกเวลาที่จะสรางความเสียหายสูงสุด คือกุญแจสูความสําเร็จทางการทหาร"
 HUN_the_botond: "โบตอนด"
 HUN_the_botond_desc: "เพื่อตอบสนองความตองการดานเสบียงและการขนสงอยางเพียงพอ เราตองการรถบรรทุกแบบใหม ตนแบบรุนแรกของ Rába 38M Botond ไดพิสูจนแลววาประสบความสําเร็จในการทดสอบ และดวยทรัพยากรที่เหมาะสม เราสามารถออกแบบใหเสร็จสมบูรณและเริ่มการผลิตได"
 HUN_develop_tanks: "พัฒนารถถัง"
 HUN_develop_tanks_desc: "ชาติรอบขางเราตางตระหนักถึงความสําคัญของรถถัง และกําลังผลิตออกมาเปนจํานวนมาก เราตองพัฒนาแบบรถถังของเราเองและพยายามตามใหทันทั้งพันธมิตรและคูปรปกษ"
 HUN_assault_gun_focus: "มุงเนนปนจูโจม"
 HUN_assault_gun_focus_desc: "แทนที่จะมุงเนนรถถังเต็มรูปแบบ เราจะพึ่งพาปนจูโจมเพื่อชวยทหารราบในการเจาะแนว เปนทางเลือกที่คุมคากวา"
 HUN_joint_tank_procurement: "การจัดหารถถังรวมกัน"
 HUN_joint_tank_procurement_desc: "เมื่อรวมมือกับพันธมิตร เราสามารถพัฒนารถถังรุนใหมไดอยางมีประสิทธิภาพกวามาก เราจะจัดตั้งสํานักงานจัดหารวมที่วิศวกรของเราสามารถทํางานรวมกันเพื่อคัดเลือกแบบที่ดีที่สุดมาพัฒนาตอ"
 HUN_armored_warfare: "การสงครามยานเกราะ"
 HUN_armored_warfare_desc: "กองพลยานยนตของเราตองการการสนับสนุนจากยานเกราะจึงจะมีประสิทธิภาพอยางแทจริง เราตองทุมทรัพยากรเพิ่มเติมในการพัฒนาแบบยานเกราะใหม"
 HUN_mobile_corps_doctrine: "หลักนิยมกองทัพนอยเคลื่อนที่เร็ว"
 HUN_mobile_corps_doctrine_desc: "เมื่อทั้งหนวยยานยนตและยานเกราะเขาสูสายการผลิตแลว เราตองพิจารณาแนวทางเชิงทฤษฎีใหมวาหนวยเหลานี้จะทํางานรวมกันในสนามรบไดอยางไร"
 HUN_home_defense: "การปองกันมาตุภูมิ"
 HUN_home_defense_desc: "กองกําลังเคลื่อนที่ขนาดเล็กไมอาจปกปองชาติของเราไดหากถูกโจมตี เราตองสรางแนวหนาที่ไมอาจเจาะทะลวงได และพัฒนาหลักนิยมใหมเพื่อเพิ่มประสิทธิภาพของแนวทางนี้"
 HUN_danuvia_submachine_guns: "ปนกลมือดานูเวีย"
 HUN_danuvia_submachine_guns_desc: "ทหารราบของเราตองการอาวุธที่ดีเพื่อเพิ่มประสิทธิภาพ ตนแบบ Danuvia 43M รุนแรกทําผลงานไดดีในการทดสอบ และหากเพิ่มงบประมาณในการพัฒนา เราอาจเริ่มผลิตอาวุธนี้จํานวนมากไดในไมชา"
 HUN_artillery_effort: "ความพยายามดานปนใหญ"
 HUN_artillery_effort_desc: "ปนใหญคือกุญแจสูประสิทธิภาพที่ดีขึ้นของกองกําลังเรา เราจะพัฒนาปนใหญรุนทันสมัยเพื่อใหกองกําลังไดรับการสนับสนุนจากปนใหญที่ดีที่สุดเทาที่เราจะใหได"
 HUN_motorized_logistics: "การสงกําลังบํารุงดวยยานยนต"
 HUN_motorized_logistics_desc: "กุญแจของสงครามเคลื่อนที่คือความสามารถในการเคลื่อนยายกําลังพลและยุทธปจจัยขามระยะทางไกลไดอยางรวดเร็ว แมแตรถถังที่ดีที่สุดก็จะไรประโยชนอยางรวดเร็วหากไมไดรับการเติมเสบียง"
 HUN_light_infantry_divisions_doctrine: "หลักนิยมกองพลทหารราบเบา"
 HUN_light_infantry_divisions_doctrine_tech_tt: "เปดใช §Hหลักนิยมกองพลทหารราบเบา§!\n§Hทหารราบ\n    ปา§!\n      การโจมตี: §G+2%§!\n      การเคลื่อนที่: §G+5%§!\n    §Hเมือง§!\n      การโจมตี: §G+5%§!\n      การเคลื่อนที่: §G+5%§!\n"
 HUN_light_infantry_divisions_doctrine_unit_tt: "\nไดรับหนวย§Yทหารราบ§!ที่มี 6 กองพัน\n"
 HUN_light_infantry_divisions_doctrine_desc: "เราตองใชกําลังพลอันจํากัดที่มีอยูใหคุมคา หากตองการกองพลมากขึ้น กองพลเหลานั้นก็จําเปนตองมีขนาดเล็กลง กองพลทหารราบเบาใหสวนผสมที่เหมาะสมที่สุดระหวางอํานาจการโจมตีและขนาด และเราจะทําใหมันเปนกระดูกสันหลังของกองทัพเรา"
 HUN_form_parachute_battalions: "จัดตั้งกองพันพลรม"
 HUN_form_parachute_battalions_desc: "ทหารราบที่สงลงทางอากาศจะทําใหเรามีขีดความสามารถในการตอบสนองตอภัยคุกคามหรือโอกาสทางยุทธวิธีที่ไมคาดคิดไดอยางรวดเร็ว"
 HUN_naval_warfare: "การสงครามทางทะเล"
 HUN_naval_warfare_desc: "หลังไดชายฝงคืนมาแลว เราตองทุมความพยายามในการสรางกองเรือที่คูควรกับมหาอํานาจขึ้นใหม"
 HUN_restauration: "การฟนฟู"
 HUN_restauration_desc: "เราไมอาจเสียเวลาทดลองกับเทคโนโลยีใหมที่ยังไมผานการพิสูจน เราจะยึดแบบที่ผานการทดสอบมาแลวตั้งแตสมัยจักรวรรดิเกา"
 HUN_reform: "การปฏิรูป"
 HUN_reform_desc: "การสรางกองทัพเรือที่ยึดแนวคิดลาสมัยแทบไมมีเหตุผล เราไดรับโอกาสสรางกองทัพเรือใหมตั้งแตตนโดยไมมีภาระจากอดีต เราควรใชโอกาสนี้สรางกองทัพเรือที่ทันสมัยและมีขีดความสามารถสูงสุดเทาที่ทําได"
 HUN_capital_ships: "เรือหลัก"
 HUN_capital_ships_desc: "หัวใจของกองทัพเรือคือเรือประจัญบาน เราตองชดเชยเวลาที่เสียไปและเริ่มตอเรือลําใหมโดยเร็วที่สุด"
 HUN_destroyer: "เรือพิฆาต"
 HUN_destroyer_desc: "เรือพิฆาตเปนสวนสําคัญยิ่งของกองเรือแตมักถูกมองขาม ประกอบกับตนทุนที่ตํ่า จึงเปนจุดเริ่มตนที่ดีสําหรับโครงการขยายกําลังทางเรือใด ๆ"
 HUN_cruisers: "เรือลาดตระเวน"
 HUN_cruisers_desc: "แมแตกองกําลังที่ทรงพลังที่สุดก็ไรประโยชนหากหาขาศึกไมพบหรือปองกันตนเองจากเครื่องบินไมได การออกแบบเรือลาดตระเวนเบาและเรือลาดตระเวนหนักแบบใหมจะชวยเปลี่ยนเรือที่รวมกันอยูใหกลายเปนกองเรือที่แทจริง"
 HUN_submarines: "เรือดํานํ้า"
 HUN_submarines_desc: "ในสงครามครั้งกอน เรือดํานํ้าเกือบเอาชนะกองทัพเรือที่ทรงพลังที่สุดในโลกได เราไมอาจไดรับการยอมรับในฐานะกองทัพเรือสมัยใหมหากไมมีเรือดํานํ้าเปนของตนเอง"
 HUN_carriers: "เรือบรรทุกเครื่องบิน"
 HUN_carriers_desc: "เรือประจัญบานเปนของตกคางจากยุคที่ผานพนไปนานแลว อนาคตของการสงครามทางทะเลคือเรือบรรทุกเครื่องบินและอากาศยาน เราจะอยูแถวหนาของพัฒนาการนี้"
 fighter_tt: "ตองมีเครื่องบินขับไลรุนทันสมัยที่จะเสนอขายได และไมอยูในภาวะสงครามกับ [Root.GetName]"
 bomber_tt: "ตองมีเครื่องบินทิ้งระเบิดรุนทันสมัยที่จะเสนอขายได และไมอยูในภาวะสงครามกับ [Root.GetName]"
 ROM_preserve_greater_romania: "ธํารงมหาโรมาเนีย"
 ROM_preserve_greater_romania_desc: "ในที่สุดเราก็รวมผูพูดภาษาโรมาเนียทุกคนไวในประเทศของเราได บัดนี้เราตองทําใหแนใจวาลูกหลานของเราจะไดสืบทอดมรดกแหงโรมาเนียเพื่อชาวโรมาเนียทุกคน"
 ROM_a_deal_with_the_devil: "ขอตกลงกับปศาจ"
 ROM_a_deal_with_the_devil_desc: "[SOU.GetNameDefCap] เปนภัยคุกคามตอพรมแดนดานตะวันออกของเรา และขอเรียกรองดินแดนอาจอยูแคเอื้อม บางทีการเขารวมกับชาว[SOU.GetAdjective]อาจดีกวาการสูกับพวกเขา"
 ROM_form_peasant_militias: "จัดตั้งกองกําลังอาสาชาวนา"
 ROM_form_peasant_militias_desc: "พรอมกับอุดมการณคอมมิวนิสตที่เรารับมาจากเพื่อนบาน ยอมมาพรอมหนาที่ของทุกคนที่จะปกปองสหาย ประเทศชาติ และการปฏิวัติ"
 ROM_basing_rights_for_soviet_union: "สิทธิ์ตั้งฐานทัพให [SOU.GetName]"
 ROM_basing_rights_for_soviet_union_desc: "เรารูวาชาว[SOU.GetAdjective]ปรารถนาดินแดนของเรา แตเราอาจปองกันการสูรบใด ๆ ไดดวยการเสนอสิทธิ์ตั้งฐานทัพใหเพื่อนบาน"
 ROM_romanian_volunteer_brigades: "กองพลนอยอาสาสมัครโรมาเนีย"
 ROM_romanian_volunteer_brigades_desc: "เราจะจัดตั้งกองพลนอยอาสาสมัครเพื่อสนับสนุนการปฏิวัติที่เพิ่งตั้งไขในชาติอื่น"
 ROM_join_comintern: "เขารวมโคมินเทิรน"
 ROM_join_comintern_desc: "ในที่สุดก็ถึงเวลายื่นคํารองขอเปนสมาชิกโคมินเทิรน สิ่งนี้จะปกปองดินแดนของเราจากการอางสิทธิ์จากทางตะวันออก และทําใหเราเปนแกนนําผลักดันอุดมการณคอมมิวนิสตทั่วโลกไดอยางแข็งขันยิ่งขึ้น"
 ROM_trade_treaty_with_germany: "สนธิสัญญาการคากับเยอรมนี"
 ROM_trade_treaty_with_germany_desc: "เรารูถึงผลประโยชนทางเศรษฐกิจที่เยอรมนีมีตอประเทศของเรา การจัดสงสินคาอยางนํ้ามันใหมากขึ้นจะทําใหเราขอความชวยเหลือจากเยอรมนีในการปรับปรุงกองทัพใหทันสมัยได"
 ROM_german_romanian_oil_exploitation_company: "บริษัทขุดเจาะนํ้ามันเยอรมัน-โรมาเนีย"
 ROM_german_romanian_oil_exploitation_company_desc: "ความตองการนํ้ามันของเยอรมนีมีมหาศาล ซึ่งเปดโอกาสอันคุมคาใหเราขยายโรงกลั่นนํ้ามัน"
 ROM_invite_german_advisors: "เชิญที่ปรึกษาชาวเยอรมัน"
 ROM_invite_german_advisors_desc: "ความชวยเหลือจากเยอรมนีเปนสิ่งจําเปนหากเราตองการปรับปรุงกองทัพใหทันสมัย พวกเขามีความรูทางเทคนิคที่เราตองการ เราจึงควรขอความชวยเหลือจากที่ปรึกษาของพวกเขา"
 ROM_invite_german_advisors_tt: "อนุญาตใหเยอรมนีตั้งกองกําลังบนแผนดินโรมาเนีย\n"
 ROM_license_german_equipment: "ซื้อสิทธิบัตรยุทโธปกรณเยอรมัน"
 ROM_license_german_equipment_desc: "ยุทโธปกรณของเยอรมนีเหนือกวาของเรา แตบางทีเราอาจไดสิทธิบัตรมาผลิตอาวุธเหลานี้เอง"
 ROM_join_axis: "เขารวมฝายอักษะ"
 ROM_join_axis_desc: "ถึงเวลาเขารวมฝายอักษะ เพื่อที่เราจะไดสรางอนาคตอันรุงโรจนของโรมาเนียเคียงขางเยอรมัน"
 ROM_demand_transnistria: "เรียกรองทรานสนิสเตรีย"
 ROM_demand_transnistria_desc: "บัดนี้เราแข็งแกรงและมีเยอรมนีหนุนหลังแลว ถึงเวลาเรียกรองภูมิภาคทรานสนิสเตรียและผนวกเขากับมหาโรมาเนีย"
 ROM_renew_the_romanian_polish_alliance: "ฟนฟูพันธมิตรโรมาเนีย-โปแลนด"
 ROM_renew_the_romanian_polish_alliance_desc: "สายสัมพันธเกาของเรากับโปแลนดจืดจางลงในชวงไมกี่ปที่ผานมา ในเมื่อภัยคุกคามรอบตัวเรายังไมลดลง และสถานการณการเมืองโลกก็ปนปวนยิ่งขึ้นทุกที ถึงเวลาฟนฟูพันธมิตรกับเพื่อนบานทางเหนือของเรา"
 ROM_the_cordon_sanitaire: "แนวกันชนสุขอนามัย"
 ROM_the_cordon_sanitaire_desc: "เราถูกขนาบดวยอุดมการณอันตรายทั้งทางตะวันออกและตะวันตก รวมกับเพื่อนบานทางเหนือและใต เราจะสรางกําแพงกั้น กักกันลัทธิเหลานี้และปองกันไมใหรุกคืบตอไปได"
 ROM_demand_a_western_guarantee: "เรียกรองการรับประกันจากตะวันตก"
 ROM_demand_a_western_guarantee_desc: "หากเราจะยืนหยัดตอตานทั้งคอมมิวนิสตและฟาสซิสต เราจะตองการความชวยเหลือจากตะวันตก เราจะใชอํานาจตอรองทางการเมืองทั้งหมดที่มีเพื่อใหไดการรับประกันดังกลาว"
 ROM_military_modernization: "ปรับปรุงกองทัพใหทันสมัย"
 ROM_military_modernization_desc: "แมจะมีการสนับสนุนจากตะวันตก เราก็ตองปรับปรุงกองทัพใหทันสมัย เพื่อใหพันธมิตรมีเวลามาชวยเรากอนที่ทุกอยางจะสายเกินไป"
 ROM_join_allies: "เขารวมฝายสัมพันธมิตร"
 ROM_join_allies_desc: "การรับประกันยังไมพอ - ถึงเวลาประกาศเขาขางประชาธิปไตยตะวันตกอยางเต็มตัว และยืนหยัดรวมกับพวกเขาเพื่อปกปองเสรีภาพ"
 ROM_joint_allied_staff_college: "วิทยาลัยเสนาธิการรวมฝายสัมพันธมิตร"
 ROM_joint_allied_staff_college_desc: "ดวยผลประโยชนรวมกัน เราควรรวมมือกับมหาอํานาจตะวันตกในการพัฒนายุทโธปกรณและยุทธวิธีทางทหาร"
 ROM_civil_works: "งานโยธาสาธารณะ"
 ROM_civil_works_desc: "มหาโรมาเนียจะตองการโครงการพัฒนาอุตสาหกรรมอยางกวางขวาง หากจะรองรับการเสริมสรางกําลังทหารขนาดใหญ เราจะเริ่มตั้งแตตอนนี้"
 ROM_national_defense_industry: "อุตสาหกรรมกลาโหมแหงชาติ"
 ROM_national_defense_industry_desc: "เราตองขยายอุตสาหกรรมอาวุธแหงชาติอยางมากหากจะตามความตองการที่เพิ่มขึ้นใหทัน"
 ROM_agrarian_reform: "การปฏิรูปเกษตรกรรม"
 ROM_agrarian_reform_desc: "ภาคเกษตรกรรมของเรายังพัฒนาไดอีกมาก การปรับใหคลองตัวและเพิ่มประสิทธิภาพจะทําใหมีแรงงานวางที่สามารถนําไปใชในภาคสวนอื่น อยางการกอสรางและการผลิตอาวุธ"
 ROM_danubian_transport_network: "เครือขายขนสงลุมแมนํ้าดานูบ"
 ROM_danubian_transport_network_desc: "ขีดความสามารถดานการขนสงตามแนวแมนํ้าดานูบของเราสามารถพัฒนาไดอยางมาก ทั้งดวยการใชประโยชนจากตัวแมนํ้าเองอยางมีประสิทธิภาพยิ่งขึ้น และการเชื่อมตอแมนํ้าเขากับเครือขายถนนและทางรถไฟของเรา"
 ROM_malaxa: "MALAXA"
 ROM_malaxa_desc: "เราตองขยายอุตสาหกรรมยานยนตในประเทศ เพื่อใหสามารถแปลงและนํามาใชเพื่อการทหารไดงายเมื่อจําเปน ในการนี้ เจาพอธุรกิจรายหนึ่งของเรามีความคิดที่คอนขางนาสนใจซึ่งเราอาจนํามาใชได..."
 ROM_invite_foreign_motor_companies: "เชิญบริษัทยานยนตตางชาติ"
 ROM_invite_foreign_motor_companies_desc: "แทนที่จะใชทรัพยากรเพิ่มการผลิตยานยนตแบบในประเทศที่ยังไมผานการพิสูจน เราจะไดประโยชนมากกวาจากการผลิตแบบตางชาติที่ผานการทดสอบมาแลวภายใตสิทธิบัตร"
 ROM_hunedoara_steel_works: "โรงงานเหล็กกลาฮูเนโดอารา"
 ROM_hunedoara_steel_works_desc: "เพื่อปอนความตองการของการผลิตอาวุธ โรงงานเหล็กกลาขนาดใหญในทรานซิลเวเนียตองไดรับการปรับปรุงใหทันสมัยและขยายอยางมาก"
 ROM_invest_in_the_iar: "ลงทุนใน IAR"
 ROM_invest_in_the_iar_desc: "การตามความตองการของกองทัพอากาศสมัยใหมใหทันเปนเรื่องสําคัญยิ่ง อุตสาหกรรมของเราตองสามารถไมเพียงสรางเครื่องจักรที่เราตองการตั้งแตแรก แตยังตองสรางไดเร็วพอจะทดแทนความสูญเสียในการปฏิบัติการ"
 ROM_expand_ploiesti_oil_production: "ขยายการผลิตนํ้ามันที่โพลเยชตี"
 ROM_expand_ploiesti_oil_production_desc: "เรามีแหลงนํ้ามันที่ใหญที่สุดแหงหนึ่งของยุโรปที่โพลเยชตี ซึ่งมีความสําคัญอยางยิ่งไมเพียงตอเรา แตยังตอพันธมิตรและชาติอื่นในภูมิภาคดวย เราควรเพิ่มการผลิตของแหลงนํ้ามันเหลานี้เพื่อตอบสนองความตองการไดดียิ่งขึ้น"
 ROM_expand_the_university_of_bucharest: "ขยายมหาวิทยาลัยบูคาเรสต"
 ROM_expand_the_university_of_bucharest_desc: "ดวยการยกระดับคุณภาพและขีดความสามารถของมหาวิทยาลัย เราจะเพิ่มจํานวนหัวกะทิที่เราพึ่งพาเพื่อความกาวหนาทางเทคโนโลยีได"
 ROM_exploit_the_baita_mines: "ใชประโยชนจากเหมืองบาอิตซา"
 ROM_exploit_the_baita_mines_desc: "เริ่มเปนที่ชัดเจนแลววายูเรเนียมมีความสําคัญยิ่งตอความกาวหนาทางเทคโนโลยีอาวุธที่กาวกระโดดที่สุดบางอยางนับตั้งแตการประดิษฐอาวุธปน เราโชคดีพอที่มีแหลงแรนี้ขนาดใหญอยูในพรมแดนของเรา และเราควรตั้งเหมืองเพื่อนํามาใชประโยชน"
 ROM_balkans_dominance: "ครองความเปนใหญในบอลขาน"
 ROM_balkans_dominance_desc: "กุญแจสูอนาคตอันรุงเรืองของโรมาเนียไมไดอยูกับนักปฏิวัติแหงตะวันออก หรือกับฝายประชาธิปไตยหรือฟาสซิสตแหงตะวันตก แตอยูที่การที่โรมาเนียครองความเปนใหญในบอลขาน"
 ROM_puppet_bulgaria: "ทําใหบัลแกเรียเปนรัฐหุนเชิด"
 ROM_puppet_bulgaria_desc: "บัลแกเรียผูกระหายสงครามเปนหนามยอกอกของเพื่อนบานมานาน เราตองปราบพวกเขาใหสยบเสียทีเดียว"
 ROM_align_hungary: "ดึงฮังการีเขาแนวทาง"
 ROM_align_hungary_desc: "ฮังการีตองถูกทําใหเห็นมุมมองของเรา รัฐบาลของพวกเขานําโดยกลุมที่หลงผิดซึ่งมีแตจะนําประเทศสูความพินาศ พวกเขาจะแข็งแกรงขึ้นหากอยูกับเรา"
 ROM_HUN_aligned: "ฮังการีเขาแนวทางแลว"
 ROM_secure_greece: "ควบคุมกรีซ"
 ROM_secure_greece_desc: "กรีซ - แมในอดีตจะเปนพันธมิตรบอยครั้ง - ตองถูกทําใหยอมรับความเปนใหญของโรมาเนียในภูมิภาค"
 ROM_divide_yugoslavia: "แบงแยกยูโกสลาเวีย"
 ROM_divide_yugoslavia_desc: "การจัดโครงสรางรัฐบอลขานที่ประกอบเปนยูโกสลาเวียในปจจุบันไมอาจคงอยูได เราจะยื่นคําขาดเรียกรองใหปรับโครงสรางรัฐองคประกอบของพวกเขาภายใตการนําของโรมาเนีย"
 ROM_split_czechoslovakia: "แบงเชโกสโลวาเกีย"
 ROM_split_czechoslovakia_desc: "เชโกสโลวาเกียเปนสิ่งประดิษฐที่ไมอาจอยูรอดไดดวยตนเอง เราไมอาจปลอยใหดินแดนสวนนี้ตกสูความโกลาหล และตองแทรกแซงกอนที่สถานการณจะเกินแก"
 ROM_secure_the_bosporus: "ควบคุมชองแคบบอสพอรัส"
 ROM_secure_the_bosporus_desc: "ในขณะนี้การเขาถึงทางทะเลของเราจํากัดอยูแคทะเลดํา ตุรกีซึ่งครอมชองแคบบอสพอรัสอาจปดกั้นทางออกสูทะเลเมดิเตอรเรเนียนของเราในยามสงคราม เราจึงตองรับประกันเสนทางผานโดยเสรีไวสําหรับเวลาที่จําเปน"
 ROM_institute_royal_dictatorship: "สถาปนาเผด็จการโดยกษัตริย"
 ROM_institute_royal_dictatorship_desc: "ถึงเวลาเพิ่มพระราชอํานาจอันกวางขวางอยูแลวของกษัตริยใหมากขึ้นอีก เพื่อนําเสถียรภาพทางการเมืองมาสูชาติ และใหชาติมุงความสนใจไปที่ภัยคุกคามจากภายนอกได"
 ROM_fortify_the_borders: "เสริมปอมปราการตามพรมแดน"
 ROM_fortify_the_borders_desc: "เมื่อสถานการณภายในประเทศอยูภายใตการควบคุมแลว เราตองพิจารณาพัฒนาการปองกันพรมแดนจากภัยคุกคามภายนอก"
 ROM_flexible_foreign_policy: "นโยบายตางประเทศที่ยืดหยุน"
 ROM_flexible_foreign_policy_desc: "เราตองละทิ้งหลักการของเราและสรางความสัมพันธกับใครก็ตามที่เปนประโยชนในทางปฏิบัติมากกวา การอยูรอดของเราขึ้นอยูกับสิ่งนี้"
 ROM_his_majestys_loyal_government: "รัฐบาลผูจงรักภักดีตอพระองค"
 ROM_his_majestys_loyal_government_desc: "ความภักดีภายในประเทศสําคัญที่สุด และตราบใดที่ชาติยังยืนหยัดเบื้องหลังกษัตริย นโยบายตางประเทศแบบยึดผลประโยชนก็ไมจําเปน"
 ROM_militarize_the_sentinels: "ติดอาวุธใหกองยุวชนพิทักษ"
 ROM_militarize_the_sentinels_desc: "กองยุวชนพิทักษซึ่งเปนองคกรกึ่งทหารสามารถเปลี่ยนเปนองคกรทางทหารเต็มรูปแบบไดโดยงาย หากเราจัดสรรทรัพยากรที่เหมาะสมให"
 ROM_all_parties_must_end: "งานเลี้ยงทุกงานตองมีวันเลิกรา"
 ROM_all_parties_must_end_desc: "ไมมีงานเลี้ยงใดอยูไดตลอดไป และสถานการณภูมิรัฐศาสตรในปจจุบันตองการความสนพระทัยอยางเต็มที่ของกษัตริย พระองคอาจจัดงานเลี้ยงสุดอลังการสักงานเมื่อสงครามจบลง แตสําหรับตอนนี้ พระองคตองละทิ้งวิถีสําราญไวเบื้องหลัง"
 ROM_revise_the_constitution: "แกไขรัฐธรรมนูญ"
 ROM_carol_current_leader_trigger: "§Yคาโรลที่ 2§! เปนผูนําประเทศในปจจุบัน"
 ROM_carol_not_leader_trigger: "§Yคาโรลที่ 2§! ไมไดเปนผูนําประเทศ"
 ROM_revise_the_constitution_desc: "ตองเขียนรัฐธรรมนูญใหมเพื่อเสริมความมั่นคงใหสถานะของกษัตริยในฐานะผูนําชาติ นอกจากนี้ ยังสามารถบอนทําลายขบวนการขวาจัดที่อันตรายไดดวยการเสนอทางเลือกที่ปลอดภัยกวา นั่นคือองคกรเยาวชนผูพิทักษมาตุภูมิของกษัตริย"
 ROM_the_royal_foundation: "มูลนิธิหลวง"
 ROM_the_royal_foundation_desc: "กษัตริยทรงพระกรุณาตกลงจัดตั้งมูลนิธิในพระนามของพระองค เพื่อศึกษาวัฒนธรรมโรมาเนียและสรางศาสตรแหงชาติ"
 ROM_appoint_soviet_friendly_government: "แตงตั้งรัฐบาลนิยมโซเวียต"
 ROM_appoint_soviet_friendly_government_desc: "อนาคตของโรมาเนียขึ้นอยูกับความสัมพันธอันดีกับเพื่อนบานคอมมิวนิสตทางตะวันออก เราตองแตงตั้งรัฐบาลที่เขาใจความจริงขอนี้"
 ROM_securitate: "เซคูริตาเต"
 ROM_securitate_desc: "เราตองจัดตั้งองคกรตํารวจลับขนาดใหญเพื่อปราบปรามภัยคุกคามภายในตอรัฐบาลใหมของเรา"
 ROM_appoint_german_friendly_government: "แตงตั้งรัฐบาลนิยมฝายอักษะ"
 ROM_appoint_german_friendly_government_desc: "อนาคตของโรมาเนียขึ้นอยูกับความสัมพันธอันดีกับมหาอํานาจฟาสซิสตที่กําลังผงาดขึ้นทางตะวันตก เราตองแตงตั้งรัฐบาลที่เขาใจความจริงขอนี้"
 ROM_appoint_german_friendly_government_tooltip: "นํา §Yหลักประกันตามรัฐธรรมนูญ§!, §Y$ROM_national_christian_party_in_power$§! และ §Yเซคูริตาเต§! ออก\n"
 ROM_appoint_allied_friendly_government_tooltip: "นํา §Yกองพิทักษเหล็ก§!, §Y$ROM_national_christian_party_in_power$§! และ §Yเซคูริตาเต§! ออก\n"
 ROM_appoint_soviet_friendly_government_tooltip: "นํา §Yหลักประกันตามรัฐธรรมนูญ§!, §Y$ROM_national_christian_party_in_power$§! และ §Yกองพิทักษเหล็ก§! ออก\n"
 ROM_appoint_german_friendly_government_tooltip_ncp: "นํา §Yหลักประกันตามรัฐธรรมนูญ§!, §Yกองพิทักษเหล็ก§! และ §Yเซคูริตาเต§! ออก\n"
 ROM_iron_guard: "กองพิทักษเหล็ก"
 ROM_iron_guard_desc: "ถึงเวลาทบทวนนโยบายของเราตอกองพิทักษเหล็ก ภายใตรัฐบาลใหม ขบวนการนี้มีแนวทางสอดคลองกับจุดยืนอยางเปนทางการของเรามากขึ้น และอาจเปนเครื่องมือชั้นยอดในการเพิ่มเสถียรภาพทางการเมืองของชาติ"
 ROM_force_abdication: "บีบใหสละราชสมบัติ"
 ROM_force_abdication_desc: "พระเจาคาโรลที่ 2 ไมเปนที่ตองการอีกตอไป และแทจริงแลวกําลังกลายเปนตัวปญหามากกวาผูนํา แมพระองคยังทรงควบคุมรัฐบาลและการเงินของชาติอยางกวางขวาง แตพระองคตองถูกบีบใหสละราชสมบัติเพื่อประโยชนระยะยาวของโรมาเนีย"
 ROM_appoint_allied_friendly_government: "แตงตั้งรัฐบาลนิยมฝายสัมพันธมิตร"
 ROM_appoint_allied_friendly_government_desc: "อนาคตของโรมาเนียขึ้นอยูกับความสัมพันธอันดีกับพันธมิตรเกาทางตะวันตก - ฝรั่งเศสและพันธมิตรของเธอ เราตองแตงตั้งรัฐบาลที่สานตอความสัมพันธเหลานี้"
 ROM_constitutional_guarantees: "หลักประกันตามรัฐธรรมนูญ"
 ROM_constitutional_guarantees_desc: "การเปลี่ยนแปลงรัฐธรรมนูญที่กษัตริยทรงดําเนินการตองถูกยกเลิก และตองมีการสรางหลักประกันและการถวงดุลเพื่อปองกันไมใหเกิดขึ้นอีก มิฉะนั้นสิ่งที่เหลืออยูก็เปนเพียงประชาธิปไตยจอมปลอม"
 ROM_handle_the_king: "จัดการเรื่องกษัตริย"
 ROM_handle_the_king_desc: "ตองออกกฎหมายเพื่อจํากัดวิถีชีวิตฟุมเฟอยของกษัตริย ทองพระคลังแผนดินจะไมอาจถูกนําไปใชจายสวนพระองคอีกตอไป"
 ROM_king_michaels_coup: "รัฐประหารของพระเจามีไฮ"
 ROM_king_michaels_coup_desc: "รัฐบาลชุดปจจุบันกําลังนําโรมาเนียไปสูความพินาศ จําเปนตองมีมือที่เด็ดขาดมาคัดทายชาติใหพนจากหายนะ นั่นคือพระหัตถของเจาชายมีไฮ"
 ROM_expand_the_air_force: "ขยายกองทัพอากาศ"
 ROM_expand_the_air_force_desc: "สงครามสมัยใหมไมอาจเอาชนะไดหากไมครองนานฟา เราตองทําทุกวิถีทางเพื่อพัฒนากองทัพอากาศโรมาเนีย!"
 ROM_acquire_licenses: "จัดหาใบอนุญาตการผลิต"
 ROM_acquire_licenses_desc: "เทคโนโลยีการบินของตางชาติเหนือกวาของเรา เราควรหาทางขอใบอนุญาตเพื่อที่จะผลิตเครื่องบินที่มีนวัตกรรมของพวกเขาไดเอง"
 ROM_air_defense: "การปองกันภัยทางอากาศ"
 ROM_air_defense_desc: "เราตองปกปองพรมแดนดวยปนตอสูอากาศยานจํานวนมาก เพื่อแบงเบาภาระของกองทัพอากาศขนาดเล็กของเรา"
 ROM_heavy_interceptors: "เครื่องบินสกัดกั้นหนัก"
 ROM_heavy_interceptors_desc: "ประเทศของเราไมอาจคํ้าจุนกองทัพอากาศขนาดใหญได เราตองรวมอํานาจการยิงใหมากที่สุดเทาที่ทําไดไวในเครื่องบินแตละลําเพื่อทําลายผูรุกรานทุกราย"
 ROM_ground_support: "การสนับสนุนภาคพื้นดิน"
 ROM_ground_support_desc: "การรบแบบผสมเหลาเปนหลักสําคัญของสงครามสมัยใหม กองทัพอากาศตองไดรับการฝกใหสนับสนุนกําลังภาคพื้นดินของเราเมื่อจําเปน"
 ROM_medium_bombers: "เครื่องบินทิ้งระเบิดขนาดกลาง"
 ROM_medium_bombers_desc: "ยุคที่กองทัพจะชนะสงครามไดโดยไมสนใจทองฟานั้นผานพนไปแลว เราตองพัฒนาเครื่องบินทิ้งระเบิดทางยุทธวิธีเพื่อมอบการสนับสนุนทางอากาศที่ทหารของเราตองการ"
 ROM_cas: "CAS"
 ROM_cas_desc: "เราตองการเครื่องบินรุนเฉพาะที่ออกแบบมาเพื่อสนับสนุนทางอากาศโดยใกลชิด หากเราจะใชประโยชนจากกองกําลังผสมของเราไดอยางเต็มที่"
 ROM_acquire_fighters: "จัดหาเครื่องบินขับไล"
 ROM_acquire_fighters_desc: "ความเหนือกวาทางอากาศคือกุญแจสําคัญของการปองกันประเทศ ดังนั้นจึงจําเปนอยางยิ่งที่เราตองขยายกําลังเครื่องบินขับไลดวยทุกวิถีทาง"
 ROM_local_development: "การพัฒนาภายในประเทศ"
 ROM_local_development_desc: "เราจะพึ่งพาอุตสาหกรรมการบินภายในประเทศของโรมาเนียในการผลิตเครื่องบินที่เราตองการ"
 ROM_air_superiority: "ความเหนือกวาทางอากาศ"
 ROM_air_superiority_desc: "การครองนานฟาเปนเงื่อนไขสําคัญของปฏิบัติการทางทหาร และนี่คือดานของสงครามทางอากาศที่เราตองมุงเนน"
 ROM_strategic_bomber_force: "กําลังทิ้งระเบิดทางยุทธศาสตร"
 ROM_strategic_bomber_force_desc: "ปฏิบัติการทางทหารเปนเพียงเรื่องรองจากการทําลายอุตสาหกรรมและโครงสรางพื้นฐานของศัตรู การทิ้งระเบิดทางยุทธศาสตรคือวิธีที่เราจะบรรลุเปาหมายนั้น"
 ROM_heavy_bombers: "เครื่องบินทิ้งระเบิดหนัก"
 ROM_heavy_bombers_desc: "กําลังทิ้งระเบิดทางยุทธศาสตรของเราตองมีพิสัยไกลและบรรทุกระเบิดไดมาก เครื่องบินทิ้งระเบิดขนาดใหญเปนทางเลือกเดียวที่ตอบโจทยนี้ได"
 ROM_nuclear_bomb_project: "โครงการระเบิดนิวเคลียร"
 ROM_nuclear_bomb_project_desc: "เราไมมีวันทิ้งระเบิดไดมากกวาศัตรูที่อาจเกิดขึ้นดวยวิธีแบบดั้งเดิม ดังนั้นเราตองมุงเนนความกาวหนาทางเทคโนโลยีที่จะชวยใหเราสรางความเสียหายไดมากขึ้นดวยทรัพยากรที่นอยลง มากขึ้นอีกหลายเทาตัว"
 ROM_iar_80: "IAR 80"
 ROM_iar_80_desc: "วิศวกรของเรามีแนวคิดยอดเยี่ยมที่พวกเขากระตือรือรนจะทุมลงในแบบเครื่องบินขับไลรุนใหม พวกเขาตองการเพียงงบประมาณและไฟเขียวเทานั้น"
 ROM_army_maneuvers: "การซอมรบของกองทัพ"
 ROM_army_maneuvers_desc: "กองทัพของเราตองกลับมาอยูในสภาพพรอมรบสําหรับความขัดแยงทางอาวุธที่อาจเกิดขึ้นในอนาคต เราจะสงพวกเขาไปซอมรบเพื่อพัฒนายุทธวิธีและยุทธศาสตรใหมๆ"
 ROM_army_war_college: "วิทยาลัยการสงครามของกองทัพ"
 ROM_army_war_college_desc: "เราตองการผูมีสติปญญาเฉียบแหลมที่สุดมาบัญชาการกองทัพ ซึ่งหมายความวาวิทยาลัยการสงครามจะตองไดรับการขยาย"
 ROM_war_college_tt: "นายพล§Yระดับทักษะ 2§! ชื่อ §Yบารบู ปาไรอานู§! จะปรากฏตัว"
 ROM_the_zb_53: "ZB-53"
 ROM_the_zb_53_desc: "ยุทโธปกรณสมัยใหมเปนกุญแจสําคัญในการสงคราม และเราตองพยายามปรับปรุงอาวุธของทหารราบใหทันสมัย"
 ROM_vanatori_de_munte: "วานาโตรี เด มุนเต"
 ROM_vanatori_de_munte_unit_tt: "\nไดรับหนวย§Yทหารภูเขา§!ที่มี 9 กองพัน\n"
 ROM_vanatori_de_munte_desc: "วานาโตรี เด มุนเต หรือพรานภูเขา คือทหารราบภูเขาชั้นยอดของเรา ชื่อเสียงของพวกเขาเลื่องลือไปถึงตางแดน และเราควรเสริมกําลังพวกเขาดวยคนที่ดีที่สุดที่เราหาได"
 ROM_artillery_modernization: "ปรับปรุงปนใหญใหทันสมัย"
 ROM_artillery_modernization_desc: "ทหารราบไมอาจปฏิบัติการไดหากขาดการสนับสนุนจากปนใหญที่เหมาะสม การมีปนใหญที่ทันสมัยและคุณภาพสูงจะชวยเพิ่มประสิทธิภาพของกองกําลังเราไดอยางมาก"
 ROM_modern_at_guns: "ปนตอสูรถถังสมัยใหม"
 ROM_modern_at_guns_desc: "ยุคของรถถังมาถึงแลว และทหารราบของเราตองมีเครื่องมือที่ทันสมัยเพื่อปองกันตนเองจากอสูรเหล็กเหลานี้"
 ROM_mountain_artillery: "ปนใหญภูเขา"
 ROM_mountain_artillery_tech_tt: "ปลดล็อก §Hปนใหญภูเขา§!\n§Hปนใหญ\n    ภูเขา§!: การเคลื่อนที่: §G+15%§!\n§Hตอสูรถถัง\n    ภูเขา§!: การเคลื่อนที่: §G+15%§!"
 ROM_mountain_artillery_desc: "ทหารภูเขาของเราตองไดรับการสนับสนุนจากปนใหญอยางสมควร หากเราจะรักษาความเปนเลิศของพวกเขาไว ดังนั้นปนใหญของเราจึงตองไดรับการดัดแปลงใหใชงานบนภูเขาได"
 ROM_reserve_divisions: "กองพลสํารอง"
 ROM_reserve_divisions_desc: "โรมาเนียเปนชาติเล็ก เราตองจัดสรรกําลังใหกองพลสํารองอยางเหมาะสม หากตองการใหกองทัพของเรามีความทรหดในสนามรบ"
 ROM_royal_guards_divisions: "กองพลราชองครักษ"
 ROM_royal_guards_divisions_tt: "ไดรับหนวยที่มีกองพัน§Yทหารราบ 7§! และ§Yปนใหญ 2§!\n"
 ROM_royal_guards_divisions_desc: "ราชองครักษของเราตองไดรับการขยาย ใหสมพระเกียรติแหงพระมหากษัตริยผูยิ่งใหญของเรา"
 ROM_the_armored_division: "กองพลยานเกราะ"
 ROM_the_armored_division_tt: "ไดรับสองหนวยที่มีกองพัน§Y[ROM_UnlockedArmor]ยานเกราะ 4§! และ§Yยานยนต 4§!\n \n เพิ่ม§Yกองรอยลาดตระเวน§!ใหกองพลหากวิจัยเทคโนโลยีนั้นแลว"
 ROM_the_armored_division_desc: "รถถังคือหนทางสูอนาคต และเราตองจัดตั้งกองพลเฉพาะที่ใชจุดแข็งของอาวุธใหมเหลานี้"
 ROM_acquire_modern_tanks: "จัดหารถถังสมัยใหม"
 ROM_acquire_modern_tanks_desc: "การพัฒนารถถังยังคงกาวไปอยางรวดเร็ว การจัดหารุนที่ลาสมัยจึงไมใชทางเลือก"
 ROM_mobile_tank_destroyers: "รถถังพิฆาตเคลื่อนที่"
 ROM_mobile_tank_destroyers_desc: "เราไมมีอุตสาหกรรมที่จะผลิตรถถังไดมากกวาศัตรู เราจึงตองมุงผลิตอาวุธที่สามารถหักลางความเหนือกวาดานยานเกราะของศัตรูแทน"
 ROM_the_maresal: "มาเรชัล"
 ROM_the_maresal_desc: "วิศวกรของเราเกิดความคิดที่จะติดตั้งปนฮาวอิตเซอร 122 มม. ของโซเวียตไวในปอมปนแบบปด หากปรับปรุงแบบนี้ตอไป เราอาจกําลังมุงสูการสรางรถถังรุนที่ประสบความสําเร็จอยางสูง"
 ROM_expand_the_galati_shipyards: "ขยายอูตอเรือกาลาตส"
 ROM_expand_the_galati_shipyards_desc: "อูตอเรือที่มีอยูแลวของเราที่กาลาตสตองไดรับการขยายอยางมาก หากเราจะแผอํานาจเขาสูทะเลดํา"
 ROM_coastal_defense_navy: "กองทัพเรือปองกันชายฝง"
 ROM_coastal_defense_navy_desc: "ดวยทรัพยากรที่จํากัด เราทําไดอยางมากเพียงรักษาชายฝงของเราใหปลอดภัย ความพยายามทั้งหมดตองมุงไปสูเปาหมายนี้"
 ROM_coastal_defense_ships: "เรือปองกันชายฝง"
 ROM_coastal_defense_ships_tech_tt: "ปลดล็อก §Hเรือปองกันชายฝง§!\n§Hเรือลาดตระเวนหนัก§!\n    เกราะ: §G+20%§!\n    อํานาจการยิงทางเรือ: §G+10%§!\n    ตนทุนการผลิต: §G-10%§!"
 ROM_coastal_defense_ships_desc: "จะตองมีการออกแบบใหมสําหรับเรือที่โดดเดนในภารกิจปองกันชายฝง"
 ROM_modern_destroyers: "เรือพิฆาตสมัยใหม"
 ROM_modern_destroyers_desc: "เรือพิฆาตคือกระดูกสันหลังของกองทัพเรือทุกชาติ และของเราก็ไมมีขอยกเวน กระดูกสันหลังทางเรือของเราตองไดรับการปรับใหทันมาตรฐานยุคปจจุบัน"
 ROM_torpedo_boats: "เรือตอรปโด"
 ROM_torpedo_boats_desc: "ตอรปโดคืออาวุธที่ทําใหทุกฝายเทาเทียมกันในการรบทางเรือ หากเรือทุกลําของเราติดตั้งตอรปโด เราอาจจูโจมและทําลายกองกําลังที่เหนือกวาไดดวยความอาจหาญและปริมาณตอรปโดที่ระดมยิง"
 ROM_modern_submarines: "เรือดํานํ้าสมัยใหม"
 ROM_modern_submarines_desc: "การรบดวยเรือดํานํ้าคือพัฒนาการทางนาวีที่นาตื่นเตนที่สุดนับตั้งแตการประดิษฐเรือตอรปโด เราไมควรเพียงปองกันเรือดํานํ้าเทานั้น แตควรใชมันโจมตีการเดินเรือของศัตรูดวย"
 ROM_black_sea_dominance: "ครองความเปนใหญในทะเลดํา"
 ROM_black_sea_dominance_desc: "การขาดแคลนทรัพยากรในชวงแรกไมควรเปนอุปสรรคตอการที่โรมาเนียจะครองทะเลดําอยางสมบูรณในอนาคต ดวยเจตจํานงทางการเมืองที่เหมาะสม เราจะทําใหสิ่งนี้เปนจริง"
 ROM_capital_ships: "เรือหลัก"
 ROM_capital_ships_desc: "หากเราจะเปนมหาอํานาจทางทะเลที่ผูอื่นใหความสําคัญ เราจําเปนตองมีเรือหลักมานํากองเรือทะเลดําของเรา"
 ROM_torpedo_bombers: "เครื่องบินตอรปโด"
 ROM_torpedo_bombers_desc: "เราสามารถชดเชยความออนแอทางทะเลไดดวยการจัดสรรกําลังทางอากาศสวนหนึ่งไปทําภารกิจทางทะเล ซึ่งจะตองมีเครื่องบินรุนใหมที่บรรทุกตอรปโดได"
 ROM_expand_the_marine_regiment: "ขยายกรมนาวิกโยธิน"
 ROM_expand_the_marine_regiment_desc: "การครองทะเลดําเปดโอกาสใหเกิดเสนทางการโจมตีใหมๆ การยกพลขึ้นบกกลายเปนทางเลือกที่เปนไปได ซึ่งตองการเรือลําเลียงรุนใหมและกองพลนาวิกโยธินโดยเฉพาะที่เชี่ยวชาญการรบรูปแบบนี้"
 CZE_fortification_studies: "ศึกษาการสรางปอมปราการ"
 CZE_fortification_studies_desc: "ความจําเปนในการเสริมปอมปราการตามพรมแดนนั้นชัดเจน แตคําถามคือจะทําอยางไร? ฝรั่งเศสเพิ่งสรางแนวปอมปราการอันนาทึ่งของตนเอง นั่นคือแนวมาจิโนต การสงคณะผูแทนไปศึกษาวิธีการของพวกเขานาจะชวยแกปญหาการปองกันพรมแดนของเราได"
 CZE_fallback_line: "สรางแนวถอยรน"
 CZE_fallback_line_desc: "หากพรมแดนไมอาจตานทานไวได ก็ควรมีแนวปอมปราการชั้นที่สองไวถอยรน กอนที่การโจมตีใดๆ จากทางตะวันตกจะมาถึงใจกลางประเทศ"
 CZE_sudeten_1: "ปอมปราการซูเดเทินลันดระยะแรก"
 CZE_sudeten_1_desc: "ซูเดเทินลันด ดินแดนภูเขาตามพรมแดนติดกับเยอรมนี เปนสถานที่สมบูรณแบบสําหรับปอมปราการชายแดน เมื่อไดศึกษาแนวมาจิโนตของฝรั่งเศสแลว เราสามารถสรางแนวที่คลายกันของเราเองได"
 CZE_sudeten_2: "ปอมปราการซูเดเทินลันดขั้นสูง"
 CZE_sudeten_2_desc: "ขณะนี้ซูเดเทินลันดมีแนวปองกันที่พอใชได แตแคพอใชไดนั้นยังไมดีพอเมื่อความอยูรอดของชาติเปนเดิมพัน"
 CZE_sudeten_3: "ปอมปราการซูเดเทินลันดขั้นสุดทาย"
 CZE_sudeten_3_desc: "ซูเดเทินลันดมีระบบปอมปราการที่แข็งแกรง แตก็ยังแข็งแกรงขึ้นไดอีก!"
 CZE_hungarian_line: "แนวฮังการี"
 CZE_hungarian_line_desc: "ลัทธิทวงดินแดนของฮังการีเปนภัยคุกคามตอชาติของเราอยูเสมอ ระบบปอมปราการตามพรมแดนรวมจะชวยรับประกันความปลอดภัยของเรา"
 CZE_polish_line: "แนวโปแลนด"
 CZE_polish_line_desc: "ความกาวราวของโปแลนดไมมีขอบเขต แตหวังวาพรมแดนที่มีปอมปราการแนนหนาจะทําใหพวกเขาหันไปหาเปาหมายที่งายกวา"
 CZE_internal_redoubts: "ที่มั่นภายใน"
 CZE_internal_redoubts_desc: "ระบบปอมปราการใดๆ ก็อาจถูกตีแตกได เพื่อรับมือกับกรณีนี้ เราสามารถสรางจุดแข็งรอบเมืองสําคัญที่สุดของเรา เพื่อไมใหศัตรูที่ฝาแนวของเราเขามายึดไดงายๆ"
 CZE_industrial_legacy: "มรดกทางอุตสาหกรรมอันยิ่งใหญ"
 CZE_industrial_legacy_desc: "โรงงานสโกดาเคยเปนผูผลิตอาวุธรายใหญที่สุดในออสเตรีย-ฮังการี และนับตั้งแตเราไดรับเอกราช พวกเขาก็ขยายกิจการจนกลายเปนผูนําในอุตสาหกรรมหลายแขนง การมีทั้งความเชี่ยวชาญและอุตสาหกรรมหนักกระจุกตัวอยูมากเชนนี้ชวยสงเสริมกิจการทางอุตสาหกรรมทุกดานไดอยางมาก"
 CZE_favor_czechs_1: "อุตสาหกรรมเช็ก"
 CZE_favor_czechs_1_desc: "ความตึงเครียดระหวางชาวเช็กและชาวสโลวักในชาติของเรามีมาโดยตลอด ไมนอยเพราะอํานาจทางอุตสาหกรรมสวนใหญกระจุกตัวอยูในดินแดนโบฮีเมียและโมราเวียของเช็ก อยางไรก็ตาม อํานาจทางอุตสาหกรรมนั้นทําใหการสรางโรงงานเพิ่มในพื้นที่เหลานั้นงายขึ้นมาก แมวาอาจทําใหชาวสโลวักไมพอใจยิ่งขึ้นก็ตาม"
 CZE_favor_czechs_2: "ดินแดนหัวใจอุตสาหกรรม"
 CZE_favor_czechs_2_desc: "การลงทุนเพิ่มเติมที่มุงไปยังโบฮีเมียและโมราเวียจะชวยพัฒนาอุตสาหกรรมของเราไดมากกวาการลงทุนแบบกระจาย"
 CZE_favor_czechs_3: "เมืองอุตสาหกรรมแหงใหม"
 CZE_favor_czechs_3_desc: "หลังจากพัฒนาพื้นที่อุตสาหกรรมเดิมในโบฮีเมียและโมราเวียแลว ถึงเวลาสรางเมืองใหมเพื่อรองรับแรงงานของอุตสาหกรรมที่กําลังเติบโต"
 CZE_balanced_1: "การลงทุนอุตสาหกรรมอยางสมดุล"
 CZE_balanced_1_desc: "เพื่อบรรเทาความตึงเครียดระหวางชาวเช็กและชาวสโลวัก มีขอเสนอใหแบงการเติบโตทางอุตสาหกรรมในอนาคตอยางเทาเทียมระหวางสองสวนของประเทศ แมวาโดยรวมจะมีประสิทธิภาพนอยกวาก็ตาม"
 CZE_balanced_2: "คณะกรรมการวางแผนรวมเช็ก-สโลวัก"
 CZE_balanced_2_desc: "การจัดตั้งองคกรรวมของนักการเมืองจากทั้งสองสวนของประเทศ จะทําใหทุกคนไดรับสวนแบงจากการเติบโตทางอุตสาหกรรมของชาติอยางเทาเทียมกัน"
 CZE_balanced_3: "ความชํานาญเฉพาะทองถิ่น"
 CZE_balanced_3_desc: "ดวยการลงทุนในอุตสาหกรรมของทุกภูมิภาคอยางตอเนื่อง บางพื้นที่เริ่มชํานาญเฉพาะดานในสินคาและบริการบางประเภท เราสามารถสงเสริมเรื่องนี้ตอไปได"
 CZE_united_population: "ประชาชนที่เปนหนึ่งเดียว"
 CZE_united_population_desc: "ความริเริ่มทางการเมืองหลายประการเมื่อเร็วๆ นี้ ประกอบกับนโยบายการเติบโตทางอุตสาหกรรมอยางสมดุล ทําใหชาวเช็กและชาวสโลวักทั่วประเทศรูสึกเปนนํ้าหนึ่งใจเดียวกันมากขึ้น"
 CZE_arms_exports_1: "การสงออกอาวุธ"
 CZE_arms_exports_1_desc: "โรงงานสโกดาเปนผูจัดหาอาวุธรายใหญทั่วยุโรปมาชานาน ผลิตอาวุธในปริมาณที่สูงเกินกวาความตองการของชาติเราเพียงลําพังมาก การผลิตในขนาดนี้กอใหเกิดประสิทธิภาพการผลิตที่ผูผลิตรายอื่นนอยรายจะฝนถึง"
 CZE_arms_exports_2: "เงินอุดหนุนการสงออก"
 CZE_arms_exports_2_desc: "เมื่อภัยสงครามใกลเขามา ชาติตางๆ ก็หันมาซื้อรถถังมากขึ้นเรื่อยๆ การคํ้าประกันเงินกูโดยรัฐบาลและมาตรการอื่นๆ จะจูงใจใหประเทศอื่นซื้อสินคาเชโกสโลวาเกีย และเพิ่มการประหยัดจากขนาดไดมากยิ่งขึ้น"
 CZE_arms_exports_3: "หลักประกันการเขาถึงอยางเทาเทียม"
 CZE_arms_exports_3_desc: "ความตองการอาวุธสูงเปนประวัติการณ เชนเดียวกับผลผลิตจากสายการผลิตของเรา เพื่อสนับสนุนการขายอาวุธ เราสามารถประกาศตอสาธารณะวาจะขายใหทุกคนที่มีเงินจาย แลวนําเงินนั้นมาลงทุนในการเสริมกําลังอาวุธของเราเอง"
 CZE_political_direction: "ประเมินบรรยากาศทางการเมือง"
 CZE_political_direction_desc: "ประชาธิปไตยของเรายังเยาววัยและยังไมเคยผานบททดสอบหนักหนวง เมื่อทั้งลัทธิฟาสซิสตและคอมมิวนิสตกําลังผงาดขึ้นทั่วยุโรป คําถามที่ตองถามคือ นี่คือทิศทางที่ถูกตองหรือไม และหากไมใช อะไรคือทางที่ถูก?"
 CZE_go_left: "ประชาชนเปนหนึ่งเดียวภายใตเจตจํานงเดียว"
 CZE_go_left_desc: "คอมมิวนิสตคืออนาคต! ความพยายามทั้งหมดตองมุงไปสูการปรับโฉมรัฐบาลและสังคมของเราใหดําเนินตามอุดมคติมารกซิสต"
 CZE_czech_socialism: "สังคมนิยมเช็ก"
 CZE_czech_socialism_desc: "การควบคุมจากสวนกลางยอมดีตอเศรษฐกิจ แตบางทีของดีก็อาจมากเกินไปได การกระจายอํานาจเล็กนอยไปสูสภาโซเวียตของทั้งเช็กและสโลวัก จะทําใหเอกภาพโดยรวมยิ่งแข็งแกรง!"
 CZE_communism_with_a_human_face: "คอมมิวนิสตที่มีใบหนามนุษย"
 CZE_communism_with_a_human_face_desc: "การเรียกรองใหประชาชนมีสวนรวมในการเมืองระดับทองถิ่นและระดับประเทศมากขึ้นภายใตรมเงาของพรรคคอมมิวนิสต จะเปนการเติมชีวิตใหมใหแกอุดมคติคอมมิวนิสต"
 CZE_communist_support: "การสนับสนุนคอมมิวนิสต"
 CZE_communist_support_desc: "การหันซายของเรากําลังไดแรงสง การสนับสนุนลัทธิคอมมิวนิสตกําลังเพิ่มขึ้นทั่วประเทศ และจะยิ่งเร็วขึ้นเมื่อรัฐบาลทุมการสนับสนุนมากขึ้น"
 CZE_join_comintern: "เขารวมโคมินเทิรน"
 CZE_join_comintern_desc: "เราไมอาจพึ่งพาอดีตพันธมิตรที่หัวกาวหนานอยกวาไดอีกตอไป ถึงเวลาลงนามเปนพันธมิตรกับสหภาพโซเวียตเพื่อความมั่นคงจากการรุกรานของฝายฟาสซิสต-จักรวรรดินิยม"
 CZE_the_romanian_question: "ปญหาโรมาเนีย"
 CZE_the_romanian_question_desc: "โรมาเนียขวางกั้นระหวางเรากับมิตรและผูปกปองของเรา สหภาพโซเวียต เมื่อพวกเขาไมยอมใหกองทัพโซเวียตผานแดนมาชวยปองกันเรา ก็ตองพิจารณาทางออกที่เด็ดขาดกวานี้"
 CZE_the_polish_division: "กองพลโปแลนด"
 CZE_the_polish_division_desc: "โปแลนดไมเพียงปฏิเสธไมใหกองทัพโซเวียตผานแดนในกรณีที่เราตองการความชวยเหลือ แตยังคงขุนเคืองที่เราปลดปลอยดินแดนซาโอลซีและอาจหาทางแกแคน การปองกันไวกอนจึงเปนสิ่งที่รอบคอบ"
 CZE_democratic_bastion: "ปอมปราการแหงประชาธิปไตย"
 CZE_democratic_bastion_desc: "เชโกสโลวาเกียคือปอมปราการแหงประชาธิปไตยในยุโรปกลาง และจะยังคงเปนเชนนั้นไมวาจะเกิดอะไรขึ้น!"
 CZE_beacon_of_liberty: "ประภาคารแหงเสรีภาพ"
 CZE_beacon_of_liberty_desc: "ความมุงมั่นตอประชาธิปไตยของเราเปนแรงบันดาลใจทั้งแกพลเมืองของเราเองและผูที่ตองหลบหนีจากระบอบที่กดขี่กวา"
 CZE_healing_a_divided_nation: "เยียวยาชาติที่แตกแยก"
 CZE_healing_a_divided_nation_desc: "บัดนี้ประชาชนของเรารูแลววาเมื่อเปนเรื่องเสรีภาพของพวกเขา คําพูดของเรามาพรอมกับการกระทํา ในที่สุดเราก็สามารถเยียวยาบาดแผลบางสวนที่แบงแยกชาติของเราอยางลึกซึ้งได"
 CZE_defensive_preparations: "การเตรียมการปองกัน"
 CZE_defensive_preparations_desc: "ดูเหมือนวาสงครามจะมาถึงอยางแนนอนไมวาเราจะตองการหรือไม ดังนั้นจึงเปนการดีที่สุดที่เราจะเตรียมพรอมรับมือ"
 CZE_bonus_research_slot_1: "มหาวิทยาลัยเทคนิคเช็ก"
 CZE_bonus_research_slot_1_desc: "เมื่อสงครามใกลเขามา การมุงเนนเทคโนโลยีเชิงปฏิบัติมากขึ้นจะเปนประโยชนตอเราอยางยิ่ง"
 CZE_go_right: "เสริมอํานาจสันนิบาตฟาสซิสตแหงชาติ"
 CZE_go_right_desc: "ชาวเช็กจะผงาดสูความยิ่งใหญไดก็ภายใตลัทธิฟาสซิสตเทานั้น! ประชาธิปไตยในยุโรปถูกลิขิตใหสูญสิ้น และมีเพียงชาติที่เขมแข็ง ชาติฟาสซิสตเทานั้น ที่จะไดที่นั่งบนโตะเจรจาเมื่อรัฐที่ออนแอถูกแบงสรร!"
 CZE_czech_fascism: "ฟาสซิสตเช็ก"
 CZE_czech_fascism_desc: "การสนับสนุนลัทธิฟาสซิสตกําลังเพิ่มขึ้นทั่วประเทศ และเมื่ออํานาจตกอยูในมือฝายฟาสซิสตมากขึ้น ก็จะกดดันผูเห็นตางที่ตอตานไดมากขึ้น"
 CZE_aggressive_wars: "สงครามรุกราน"
 CZE_aggressive_wars_desc: "เมื่อลัทธิฟาสซิสตมีชัย การผงาดขึ้นสูอํานาจของเราก็เริ่มตนได!"
 CZE_the_polish_question: "ปญหาโปแลนด"
 CZE_the_polish_question_desc: "ชาวโปแลนดไมเคยใหอภัยเราเรื่องซาโอลซี และหากเราแสดงความออนแอแมแตนอย พวกเขาจะตะครุบอยางไมตองสงสัย เหตุใดชาติที่ยิ่งใหญอยางเชโกสโลวาเกียตองทนอยูใตภัยคุกคามเชนนี้? ไมอีกแลว! ตองลงมืออยางเด็ดขาด!"
 CZE_exclude_the_slovaks: "รวมศูนยอํานาจเช็ก"
 CZE_exclude_the_slovaks_desc: "นับตั้งแตวันที่ประเทศของเรากอตั้งขึ้น ชาวสโลวักก็ไมพอใจมาตลอด คอยแสวงหาอํานาจทางการเมืองเพิ่มขึ้นเสมอ เรียกรองทรัพยากรของชาติเกินกวาสวนที่ควรไดเสมอ ไมอีกแลว! นับจากนี้อํานาจจะรวมศูนยอยูในมือชาวเช็ก §Rสิ่งนี้จะนําไปสูสงครามกลางเมือง§!"
 CZE_national_fascism: "ฟาสซิสตแหงชาติ"
 CZE_national_fascism_desc: "ทั้งชาวเช็กและชาวสโลวักตางรวมเปนหนึ่งเดียวอยางสมบูรณภายใตธงแหงลัทธิฟาสซิสต เราจะเดินหนาไปดวยกัน! เมื่ออยูดวยกันไมมีใครหยุดเราได!"
 CZE_german_minor_ally: "รัฐบริวารของเยอรมนี"
 CZE_german_minor_ally_desc: "เยอรมนีเปนมหาอํานาจที่กําลังรุงโรจน เปนอํานาจที่เราจะติดตามไปสูความรุงโรจนได ที่ใดที่เยอรมนีนํา เราจะตามไปและบรรลุเปาหมายของเราระหวางทาง"
 CZE_german_minor_ally_tt: "กลายเปนรัฐบริวารของเยอรมนี ไดรับโบนัสในการขอใบอนุญาตเทคโนโลยีเยอรมัน แตก็ใหเยอรมนีมีอํานาจเหนือประเทศของเราดวย"
 CZE_german_ally: "หุนสวนอันมีคาของเยอรมนี"
 CZE_german_ally_desc: "เยอรมนีเปนมหาอํานาจฟาสซิสตเชนเดียวกับเรา เปนสหายรวมทางบนเสนทางสูความรุงโรจน เราจะรวมกันทําใหโลกหมุนรอบอักษะปราก-เบอรลิน!"
 CZE_strategy_decisions: "การตัดสินใจเชิงยุทธศาสตร"
 CZE_strategy_decisions_desc: "พายุกําลังกอตัวเหนือยุโรป ภัยสงครามใกลเขามา แตเชโกสโลวาเกียจะรับมือกับความทาทายที่รออยูขางหนาอยางไร?"
 CZE_german_leanings: "การผอนปรนตอเยอรมนี"
 CZE_german_leanings_desc: "อํานาจของเยอรมนีกําลังเพิ่มขึ้น และเปาหมายที่พวกเขาประกาศไวคือการรวมผูพูดภาษาเยอรมันทั้งหมดไวในไรชเดียว ในฐานะชาติที่มีชนกลุมนอยเชื้อสายเยอรมันจํานวนมาก นี่จึงเปนพัฒนาการที่นากังวล หากเราไมสามารถหาพันธมิตรที่ทรงพลังของเราเองได การรักษาไมตรีกับเยอรมนีไวอาจเปนประโยชน"
 CZE_german_puppet: "รัฐในอารักขาของเยอรมนี"
 CZE_german_puppet_desc: "เราไมอาจผอนปรนใหเยอรมนีพอใจได พวกเขาจะไมหยุดจนกวาจะไดปกครองเรา แตถึงกระนั้น บางทีการยอมคุกเขาอาจชวยรักษาอํานาจปกครองตนเองบางสวนไวได?"
 CZE_hungarian_situation: "สถานการณฮังการี"
 CZE_hungarian_situation_desc: "ฮังการีเปนหนามยอกอกของเรามาชานาน แตเมื่อมีพลังเต็มเปยมของลัทธิฟาสซิสตหนุนหลัง ยุคสมัยของฮังการีก็มาถึงจุดจบแลว"
 CZE_deliver_sudetenland: "มอบซูเดเทินลันด"
 CZE_deliver_sudetenland_desc: "เยอรมนีตองการชาวเยอรมันของเรา ดูเหมือนวาหากเราตองการหลีกเลี่ยงสงคราม ทางเดียวคือการยกซูเดเทินลันดให"
 CZE_german_technology: "เทคโนโลยีเยอรมัน"
 CZE_german_technology_desc: "เมื่อความสัมพันธอันสันติระหวางสองชาติไดรับการรับรองแลว จึงมีขอเสนอวาการแลกเปลี่ยนเทคโนโลยีระหวางกันอาจเปนประโยชนตอทั้งสองฝาย"
 CZE_trust_in_the_west: "ไววางใจตะวันตก"
 CZE_trust_in_the_west_desc: "ฝรั่งเศสและสหราชอาณาจักรจะปกปองสันติภาพในยุโรป อยางไรเสีย พวกเขาไมไดชนะมหาสงครามเพียงเพื่อปลอยใหเยอรมนีขมขูและแบงแยกชาติอธิปไตยในอีกยี่สิบปตอมา!"
 CZE_doctrinal_innovation: "นวัตกรรมหลักนิยม"
 CZE_doctrinal_innovation_desc: "เราไดเรียนรูมากมายจากการแลกเปลี่ยนนายทหารและการประชุมยุทธศาสตรกับพันธมิตร การผสานมุมมองที่แตกตางเชนนี้ทําใหเราใกลจะคนพบสิ่งใหมครั้งสําคัญ"
 CZE_bonus_research_slot_2: "คณะทํางานแบงปนความรู"
 CZE_bonus_research_slot_2_desc: "การแบงปนความรูระหวางพันธมิตรนํามาซึ่งประโยชนมหาศาลจนมีขอเสนอใหจัดตั้งเปนสถาบันถาวร"
 CZE_secret_weapons: "อาวุธลับ"
 CZE_secret_weapons_desc: "อนาคตของการสงครามของเช็กอยูที่การเชี่ยวชาญเทคโนโลยีขั้นสูงหลายดานและใชมันใหเกิดประโยชนสูงสุด"
 CZE_nukes: "อาวุธนิวเคลียร"
 CZE_nukes_desc: "อนาคตของการสงครามของเช็กอยูที่การควบคุมพลังแหงการแตกตัวของอะตอม!"
 CZE_an_entente_of_our_own: "ความตกลงไตรภาคีของเราเอง"
 CZE_an_entente_of_our_own_desc: "'ความตกลงไตรภาคีนอย' เสื่อมลงในชวงหลายปที่ผานมา แตก็ยังอาจฟนคืนไดหากอดีตพันธมิตรของเราเต็มใจ"
 CZE_invite_yugoslavia: "เชิญยูโกสลาเวีย"
 CZE_invite_yugoslavia_desc: "เชิญยูโกสลาเวียเขารวมความตกลงไตรภาคี"
 CZE_invite_romania: "เชิญโรมาเนีย"
 CZE_invite_romania_desc: "เชิญโรมาเนียเขารวมความตกลงไตรภาคี"
 CZE_faction_tech_sharing: "กติกาสัญญาวาดวยการจัดระเบียบ"
 CZE_faction_tech_sharing_desc: "เพื่อใหทํางานรวมกันไดดี กองทัพของชาติในความตกลงไตรภาคีควรมีระดับยุทโธปกรณใกลเคียงกัน เราจึงเสนอใหสมาชิกทุกชาติในฝายของเราแบงปนเทคโนโลยีใหกันอยางเสรี"
 CZE_security_council: "คณะมนตรีความมั่นคงรวม"
 CZE_security_council_desc: "คณะมนตรีความมั่นคงของความตกลงไตรภาคีจะทําใหสมาชิกทุกชาติประสานงานกันเมื่อมีการวางแผนปฏิบัติการทางทหารรวม"
 CZE_deal_with_hungary: "กําจัดภัยคุกคามฮังการี"
 CZE_deal_with_hungary_desc: "เมื่อสันติภาพทั่วยุโรปพังทลาย ความตกลงไตรภาคีไมอาจปลอยใหฮังการีกลับมาเปนภัยคุกคามไดอีก มีเพียงทางออกถาวรเทานั้นที่จะทําใหเราหันไปมุงเนนปญหาที่ใหญกวาได"
 CZE_deal_with_bulgaria: "ยุบบัลแกเรีย"
 CZE_deal_with_bulgaria_desc: "บัลแกเรียไดฟนฟูกําลังอาวุธและคุกคามความมั่นคงของคาบสมุทรบอลขานอีกครั้ง นี่คือภัยคุกคามที่ไมอาจยอมรับได หากความตกลงไตรภาคีจะมุงความสนใจไปยังความขัดแยงใหญในยุโรป"
 CZE_rapprochement_with_hungary: "ปรองดองกับฮังการี"
 CZE_rapprochement_with_hungary_desc: "ลัทธิทวงดินแดนของฮังการีเปนภัยคุกคามอยูเสมอ แตบางทีเราอาจพยายามอีกครั้งสุดทายเพื่อยุติปญหาอยางสันติ?"
 CZE_czechoslovak_legion: "กองทหารเชโกสโลวัก"
 CZE_czechoslovak_legion_desc: "กองทหารเชโกสโลวักเคยรบไปทั่วยุโรปในมหาสงคราม และลึกเขาไปในรัสเซียระหวางสงครามกลางเมืองของพวกเขา บัดนี้เมื่อความขัดแยงลุกลามไปทั่วยุโรป กองทหารนี้อาจไดออกเดินทัพอีกครั้ง"
 CZE_military_research_institute: "สถาบันเทคนิคทางทหาร"
 CZE_military_research_institute_desc: "สถาบันเทคนิคทางทหารมีหนาที่มอบขีดความสามารถดานการวิจัย การพัฒนา และการทดสอบทางทหารใหแกกองทัพเชโกสโลวาเกีย"
 CZE_mountain_bonus: "ทหารภูเขา"
 CZE_mountain_bonus_desc: "เมื่อพรมแดนของเราสวนใหญเปนเนินเขาและภูเขา ความจําเปนที่ตองมีทหารเฉพาะทางเพื่อดูแลและปองกันพื้นที่เหลานั้นจึงชัดเจน"
 CZE_inf_and_artillery_advancement: "พัฒนาทหารราบ"
 CZE_inf_and_artillery_advancement_desc: "ทหารราบเปนหนวยที่สําคัญที่สุดในกองทัพของเรา การปรับปรุงอาวุธของพวกเขาจึงเปนกาวสําคัญสูการปองกันประเทศที่ประสบความสําเร็จ"
 CZE_support_bonus: "หนวยสนับสนุน"
 CZE_support_bonus_desc: "เพื่อใหทหารราบของเราปฏิบัติการไดอยางมีประสิทธิภาพสูงสุด เหลาสนับสนุนก็ตองไดรับการปรับใหทันสมัยดวย"
 CZE_inf_and_artillery_advancement_2: "พัฒนาปนใหญ"
 CZE_inf_and_artillery_advancement_2_desc: "ปนใหญสมัยใหม ราชินีแหงสนามรบ จะเปนตัวทวีกําลังขนาดใหญใหกองทัพของเรา"
 CZE_doctrine_bonus: "การคนพบดานหลักนิยม"
 CZE_doctrine_bonus_desc: "อาวุธเพียงอยางเดียวไมไดทําใหกองทัพทรงพลัง หลักนิยมที่มีประสิทธิภาพก็จําเปนเชนกัน สถาบันเทคนิคทางทหารตระหนักดีในเรื่องนี้และไดเสนอขอแนะนําหลายประการ"
 CZE_motorization_scheme: "แผนการเปลี่ยนเปนยานยนต"
 CZE_motorization_scheme_desc: "แมกองทัพของเราจะไมไดใหญที่สุด แตการใชยานยนตเปดโอกาสใหเรารวมกําลังไปยังพื้นที่หนึ่งไดรวดเร็วยิ่งขึ้น"
 CZE_armour_bonus_1: "LT vz. 38"
 CZE_armour_bonus_1_desc: "กองทัพของเรามีรถถังที่ลํ้าหนาที่สุดบางรุนในโลก แตเทคโนโลยีในดานนี้กาวหนาอยางรวดเร็ว และเราไมอาจปลอยใหตัวเองลาหลังได"
 CZE_mechanization: "การเปลี่ยนเปนยานเกราะลําเลียงพล"
 CZE_mechanization_desc: "ขณะที่ยานยนตมอบความเร็วใหทหารของเรา ยานเกราะลําเลียงพลมอบทั้งความเร็ว การปองกัน และอํานาจการยิง"
 CZE_armour_bonus_ii: "ปรับปรุงยานเกราะใหทันสมัย"
 CZE_armour_bonus_ii_desc: "สถาบันเทคนิคทางทหารยังคงทํางานอยางใกลชิดกับโรงงานสโกดาเพื่อออกแบบรถถังใหมที่ดียิ่งขึ้น"
 CZE_doctrine_bonus_2: "การสงครามเชิงนวัตกรรม"
 CZE_doctrine_bonus_2_desc: "อาวุธเพียงอยางเดียวไมไดทําใหกองทัพทรงพลัง หลักนิยมที่มีประสิทธิภาพก็จําเปนเชนกัน สถาบันเทคนิคทางทหารตระหนักดีในเรื่องนี้และไดเสนอขอแนะนําหลายประการ"
 CZE_war_college: "วิทยาลัยการสงคราม"
 CZE_war_college_desc: "วิทยาลัยการสงครามผลิตผูนําที่ไดรับการฝกฝนมาอยางดีใหกองทัพของเรา เพื่อนําไปสูชัยชนะ"
 CZE_war_college_effect_tt: "§Yหากคุณมีชองการวิจัยครบ 5 ชองแลว คุณจะไมไดรับชองเพิ่ม§!\n"
 CZE_military_aeronautical_institute: "สถาบันการบินทหาร"
 CZE_military_aeronautical_institute_desc: "สถาบันการบินทหารเสนองานวิจัยและแบบการออกแบบใหแกกองทัพอากาศเชโกสโลวาเกีย"
 CZE_import_foreign_fighters: "นําเขาเครื่องบินขับไลตางชาติ"
 CZE_import_foreign_fighters_desc: "การนําเขาเครื่องบินขับไลตางชาติหลากหลายแบบมาทดสอบและประเมินผล จะทําใหนักออกแบบอากาศยานของเราไดบทเรียนอันมีคา"
 CZE_light_fighter_focus: "มุงเนนเครื่องบินขับไลเบา"
 CZE_light_fighter_focus_desc: "สถาบันการบินทหารสรุปวาเครื่องบินขับไลเบามีประโยชนที่สุดและควรเปนแกนหลักของกองทัพอากาศของเรา"
 CZE_heavy_fighter_focus: "มุงเนนเครื่องบินขับไลหนัก"
 CZE_heavy_fighter_focus_desc: "สถาบันการบินทหารสรุปวาเครื่องบินขับไลหนักมีประโยชนที่สุดและควรเปนแกนหลักของกองทัพอากาศของเรา"
 CZE_air_is_our_sea: "ฟาคือทะเลของเรา"
 CZE_air_is_our_sea_desc: "ชาติอื่นพึ่งพากองทัพเรือในการปกปองพรมแดนและแผอํานาจ สําหรับเรา บทบาทนั้นเปนของกองทัพอากาศ"
 CZE_rule_the_air: "ครองนานฟา"
 CZE_rule_the_air_desc: "ความทุมเทใหกองทัพอากาศทําใหเราสรางประสิทธิภาพการผลิตไดอยางโดดเดน"
 CZE_import_foreign_bombers: "นําเขาเครื่องบินทิ้งระเบิดตางชาติ"
 CZE_import_foreign_bombers_desc: "การนําเขาเครื่องบินทิ้งระเบิดตางชาติหลากหลายแบบมาทดสอบและประเมินผล จะทําใหนักออกแบบอากาศยานของเราไดบทเรียนอันมีคา"
 CZE_cas_focus: "มุงเนน CAS"
 CZE_cas_focus_desc: "ผลสรุปการทดสอบของสถาบันการบินทหารชี้วาเราควรมุงเนนเครื่องบินสนับสนุนทางอากาศโดยใกลชิด"
 CZE_tac_focus: "มุงเนนเครื่องบินทิ้งระเบิดทางยุทธวิธี"
 CZE_tac_focus_desc: "ผลสรุปการทดสอบของสถาบันการบินทหารชี้วาเราควรมุงเนนเครื่องบินทิ้งระเบิดทางยุทธวิธี"
 CZE_access_to_the_sea: "ทางออกสูทะเล"
 CZE_access_to_the_sea_desc: "เราไมใชประเทศไรทางออกสูทะเลอีกตอไป! เมื่อเรามีชายฝงแลว เราตองศึกษากิจการทางทะเลและวางแผนจัดตั้งกองทัพเรือ"
 CZE_sudden_shipyard: "อูตอเรือฉับพลัน"
 CZE_sudden_shipyard_desc: "กองทัพเรือตองมีอูตอเรือ เราไมไดวางแผนเรื่องนี้ไว แตโครงการวิศวกรรมขนาดใหญไมใชเรื่องใหมสําหรับเรา หากทุมเทอยางเหมาะสม อูตอเรือก็จะเสร็จไดในเวลาไมนาน"
 CZE_shipbuilding_legacy: "มรดกการตอเรือ"
 CZE_shipbuilding_legacy_desc: "แมการมีกองทัพเรือเปนของตัวเองจะเปนเรื่องใหม แตโรงงานสโกดามีประวัติยาวนานในการสรางชิ้นสวนใหเรือของกองทัพเรือออสเตรีย-ฮังการี บัดนี้พวกเขาสามารถนําประสบการณเดียวกันนั้นมาผลิตเรือใหกองทัพเรือของเราเอง"
 CZE_battleship_catchup_1: "ความกาวหนาดานเรือประจัญบาน"
 CZE_battleship_catchup_1_desc: "ความตองการกองทัพเรือที่เพิ่งเกิดขึ้นทําใหเกิดการออกแบบเรือประจัญบานขึ้นอยางคึกคักในทันที"
 CZE_destroyer_catchup_1: "ความกาวหนาดานเรือพิฆาต"
 CZE_destroyer_catchup_1_desc: "ความตองการกองทัพเรือที่เพิ่งเกิดขึ้นทําใหเกิดการออกแบบเรือพิฆาตขึ้นอยางคึกคักในทันที"
 CZE_cruiser__catchup_1: "ความกาวหนาดานเรือลาดตระเวน"
 CZE_cruiser__catchup_1_desc: "ความตองการกองทัพเรือที่เพิ่งเกิดขึ้นทําใหเกิดการออกแบบเรือลาดตระเวนขึ้นอยางคึกคักในทันที"
 CZE_raiding_focus: "มุงเนนการจูโจม"
 CZE_raiding_focus_desc: "กองทัพเรือของเราตองมุงเนนแนวทางทางออม คือหลีกเลี่ยงการรบและกอกวนการเดินเรือของศัตรู"
 CZE_capital_focus: "มุงเนนเรือหลัก"
 CZE_capital_focus_desc: "กองทัพเรือของเราตองมุงเนนการรบแบบตรงไปตรงมาและชี้ขาด"
 YUG_western_focus: "มุงสูตะวันตก"
 YUG_western_focus_desc: "กุญแจสูอนาคตของยูโกสลาเวียอยูที่มหาอํานาจตะวันตก ซึ่งใกลชิดกับชาติของเราทั้งทางภูมิศาสตรและเศรษฐกิจ"
 YUG_friendship_treaty_with_italy: "สนธิสัญญามิตรภาพกับอิตาลี"
 YUG_friendship_treaty_with_italy_desc: "ในฐานะเพื่อนบานใกลชิดที่ทรงอํานาจที่สุด จําเปนอยางยิ่งที่อิตาลีตองมองเราเปนมิตร เราจะเริ่มการเจรจาเพื่อประกาศมิตรภาพระหวางสองชาติ"
 YUG_reinforce_old_alliances: "กระชับพันธมิตรเกา"
 YUG_reinforce_old_alliances_desc: "นับตั้งแตชาติของเราถือกําเนิด เราไดรับการสนับสนุนจากประชาธิปไตยที่ยิ่งใหญของยุโรปอยางฝรั่งเศสและสหราชอาณาจักร ถึงเวลากระชับความสัมพันธเหลานี้เพื่อเตรียมพรอมสําหรับการเปนพันธมิตรในอนาคต"
 YUG_attract_foreign_capital: "ดึงดูดทุนตางชาติ"
 YUG_attract_foreign_capital_desc: "เราสามารถใชประโยชนจากความสัมพันธทางการทูตที่ใกลชิดดวยการอํานวยความสะดวกใหทุนและการลงทุนจากตางชาติไหลเขามา"
 YUG_ban_slovene_nationalist_parties: "สั่งหามพรรคชาตินิยมสโลวีน"
 YUG_ban_slovene_nationalist_parties_desc: "เสียงเรียกรองเอกราชใดๆ ตองถูกปราบปรามเพื่อประโยชนของชาติ กลุมการเมืองชาตินิยมจะถูกประกาศใหผิดกฎหมาย และผูสนับสนุนจะถูกดําเนินคดี มิฉะนั้นพวกเขาจะบอนทําลายเราจากภายใน"
 YUG_traditional_values: "คานิยมดั้งเดิม"
 YUG_traditional_values_desc: "คานิยมดั้งเดิมตามคําสอนของศาสนาออรโธดอกซคือศิลาฤกษของสังคมเรา การสงเสริมคานิยมเหลานี้ไมเพียงทําใหเราไดรับการสนับสนุนจากศาสนจักรออรโธดอกซ แตยังทําใหประชาชนของเราสามัคคีกันดวย"
 YUG_greater_yugoslavia: "มหายูโกสลาเวีย"
 YUG_greater_yugoslavia_desc: "เราจะไมหยุดจนกวาชาวสลาฟใตทั้งหมดจะรวมเปนหนึ่งภายใตธงของเรา ชาวบัลแกเรียอาจไมถือวาตนเปนสวนหนึ่งของชาติเรา แตเราถือเชนนั้นแนนอน"
 YUG_all_yugoslavian_regiments: "กรมทหารยูโกสลาเวียทั้งมวล"
 YUG_all_yugoslavian_regiments_desc: "แมประชาชนของเราจะหลากหลาย แตทุกคนตองรับใชเพื่อปกปองชาติ เราจะไมแบงแยกเชื้อชาติในการจัดตั้งกรมทหาร"
 YUG_crush_the_ustasa: "บดขยี้อุสตาเช"
 YUG_crush_the_ustasa_desc: "ขบวนการชาตินิยมสุดโตงโครเอเชียอุสตาเชกลายเปนหนามยอกอกที่ทวีความรุนแรงขึ้นเรื่อยๆ มันไมอาจถูกมองเปนอยางอื่นไดนอกจากองคกรกอการราย และตองถูกถอนรากถอนโคนเพื่อประโยชนของชาติ"
 YUG_invite_german_military_mission: "เชิญคณะผูแทนทางทหารเยอรมัน"
 YUG_invite_german_military_mission_desc: "ความไมชอบชาวเยอรมันของกองทัพเราตองถูกขจัดไป การเชิญคณะผูแทนทางทหารจะชวยแสดงใหนายทหารระดับสูงของเราเห็นวาการทํางานรวมกันมีประโยชนมากมาย"
 YUG_join_axis: "ลงนามกติกาสัญญาไตรภาคี"
 YUG_join_axis_desc: "แมหลายคนปรารถนาใหยูโกสลาเวียเขารวมกับฝายสัมพันธมิตรและตอตานฟาสซิสต แตเรารูดีวานี่คือความทะเยอทะยานที่สิ้นหวัง ซึ่งรังแตจะจบลงดวยสงครามและความโกลาหล เราไดรับโอกาสเขารวมกับเยอรมนี อิตาลี และญี่ปุนในกติกาสัญญาความรวมมือทางทหารและเศรษฐกิจ และเราตองควาโอกาสนี้ไวทันที"
 YUG_invite_italian_naval_experts: "เชิญผูเชี่ยวชาญทางเรือชาวอิตาลี"
 YUG_invite_italian_naval_experts_desc: "พันธมิตรในเมดิเตอรเรเนียนของเรามีความรูดานการออกแบบและสรางเรือที่เหนือกวา เราจะเชิญผูเชี่ยวชาญชาวอิตาลีมาถายทอดความรูใหแกเรา"
 YUG_limited_self_government: "การปกครองตนเองแบบจํากัด"
 YUG_limited_self_government_desc: "ความแตกแยกภายในชาติของเรานั้นลึกและมากเกินกวาจะจัดการไดดวยการปฏิรูปธรรมดา มีเพียงการมอบอํานาจปกครองตนเองใหแกชนชาติตางๆ ที่ประกอบกันเปนชาติเราเทานั้น ที่จะรักษาสหภาพไวไดโดยไมตองใชกําลัง"
 YUG_guarantee_religious_liberties: "รับประกันเสรีภาพทางศาสนา"
 YUG_guarantee_religious_liberties_desc: "ทุกคนตองไดรับอนุญาตใหนับถือศาสนาที่ตนเลือก เราจะออกกฎหมายรับประกันในเรื่องนี้"
 YUG_local_militias: "กองกําลังอาสาทองถิ่น"
 YUG_local_militias_desc: "ประชาชนจะไดรับการสนับสนุนใหจัดตั้งกองกําลังอาสาเพื่อปกปองมาตุภูมิ ซึ่งจะทําใหประชากรสวนใหญขึ้นมีคุณสมบัติที่จะถูกเกณฑเขารับราชการทหารในภายหลัง"
 YUG_concessions_for_macedonians: "ขอผอนปรนแกชาวมาซิโดเนีย"
 YUG_concessions_for_macedonians_desc: "ดวยการเขาหากลุมผูนําชาวมาซิโดเนีย เราจะแกไขความคับของใจของพวกเขาและไดรับความจงรักภักดีตอรัฐ"
 YUG_establish_the_banovina_of_croatia: "จัดตั้งบาโนวีนาโครเอเชีย"
 YUG_establish_the_banovina_of_croatia_desc: "ดวยการจัดตั้งบานาเตโครเอเชียที่มีอํานาจปกครองตนเองบางสวน หวังวาเราจะระงับเสียงเรียกรองเอกราชที่แทจริงได"
 YUG_non_discriminating_officer_promotions: "การเลื่อนยศนายทหารโดยไมเลือกปฏิบัติ"
 YUG_non_discriminating_officer_promotions_desc: "นโยบายเลือกปฏิบัติของเราตองถูกยกเลิก และนับจากนี้ทุกเชื้อชาติตองไดรับอนุญาตใหไตเตาในเหลานายทหาร ซึ่งจะทําใหเราไดผูนําทางทหารที่มีความสามารถที่สุดเทาที่จะหาได"
 YUG_join_allies: "พันธมิตรทางราชวงศ"
 YUG_royal_alliance_tt: "เราจะพยายามเขารวมฝายของคูอภิเษกสมรสของเรา\nหากคูอภิเษกคือเจาหญิงอเล็กซานดรา เราจะพยายามเขารวมฝายสัมพันธมิตร"
 carlist_text: "คารลิสต"
 YUG_join_allies_desc: "เมื่อพระมหากษัตริยของเราทรงอภิเษกสมรสอยางมีความสุขแลว เราตองประกาศความภักดีตอสาธารณะ เพื่อที่เราจะพึ่งพากําลังทหารของพวกเขาไดหากเราตกเปนเปาของเพื่อนบาน"
 YUG_reclaim_istria_and_zadar: "ทวงคืนอิสเตรียและซาดาร"
 YUG_reclaim_istria_and_zadar_desc: "อิตาลียังคงยึดครองดินแดนอิสเตรียและซาดาร ถึงเวลานําดินแดนเหลานั้นกลับบานแลว"
 YUG_claim_macedonia: "อางสิทธิ์มาซิโดเนีย"
 YUG_claim_macedonia_desc: "บางสวนของมาซิโดเนียยังคงอยูนอกพรมแดนของเรา เมื่อชาวมาซิโดเนียทั้งหมดเปนชาวสลาฟ พวกเขาจึงควรอยูในชาติของเรา"
 YUG_allied_air_combat_school: "โรงเรียนการรบทางอากาศของสัมพันธมิตร"
 YUG_allied_air_combat_school_desc: "พันธมิตรใหมของเรามีประสบการณการรบทางอากาศอยางกวางขวาง การผลักดันใหมีโรงเรียนการรบทางอากาศรวมของสัมพันธมิตรจะทําใหนักบินฝกหัดของเราไดเรียนรูบทเรียนอันมีคาที่พันธมิตรตองแลกมาดวยเลือดเนื้อ"
 YUG_recognize_the_soviet_union: "รับรองสหภาพโซเวียต"
 YUG_recognize_the_soviet_union_desc: "แมในอดีตเราปฏิเสธที่จะรับรองรัฐบอลเชวิคทางตะวันออก แตบางทีอาจถึงเวลาที่ตองทบทวนจุดยืนในเรื่องนี้ ขณะที่ประชาธิปไตยตะวันตกดูออนแอเกินกวาจะปกปองชาติเล็กๆ สหภาพโซเวียตอาจพิสูจนไดวาเปนมิตรที่พึ่งพาไดมากกวา"
 YUG_form_peasant_councils: "จัดตั้งสภาชาวนา"
 YUG_form_peasant_councils_desc: "ผูใชแรงงานตองมีบทบาทมากขึ้นในการเมืองทองถิ่น การจัดตั้งสภาชาวนาจะชวยใหเสียงของพวกเขาถูกรับฟงอยางมาก"
 YUG_mutual_economic_aid: "ความชวยเหลือทางเศรษฐกิจซึ่งกันและกัน"
 YUG_mutual_economic_aid_desc: "สหภาพโซเวียตและยูโกสลาเวียมีหลายสิ่งที่จะมอบใหกันทางเศรษฐกิจ การจัดทําขอตกลงการคาที่ทํากําไรและการจัดการความชวยเหลือทางเศรษฐกิจ จะเปนประโยชนอยางมากตอทั้งสองฝาย"
 YUG_abolish_the_monarchy: "ลมลางระบอบกษัตริย"
 YUG_abolish_the_monarchy_desc: "ระบอบกษัตริยแทบไมใชรูปแบบการปกครองที่เหมาะกับยุคสมัยใหม ไมตองพูดถึงวามันขัดกับทัศนคติทางสังคมของเราโดยสิ้นเชิง ระบอบนี้ตองถูกลมลาง และแทนที่การปกครองของกษัตริยดวยเสียงของสามัญชน"
 YUG_join_comintern: "เขารวมโคมินเทิรน"
 YUG_join_comintern_desc: "หนทางที่ดีที่สุดในการผลักดันการปฏิวัติคือการยืนหยัดรวมกับรัฐคอมมิวนิสตพี่นองในโคมินเทิรน"
 YUG_yugoslavian_path_to_communism: "หนทางสูคอมมิวนิสตแบบยูโกสลาเวีย"
 YUG_yugoslavian_path_to_communism_desc: "เราไมตองการการชี้นําใดๆ ในการตอสูเพื่อชนชั้นแรงงาน เราจะรวบรวมผูที่ยอมรับการนําของเรา และรวมกันเผยแผการปฏิวัติในแบบของเรา"
 YUG_form_the_federal_republic: "จัดตั้งสาธารณรัฐสหพันธ"
 YUG_form_the_federal_republic_desc: "ถึงเวลาจัดตั้งรัฐสหพันธที่แทจริงซึ่งตอนรับชนชาติสมาชิกทุกกลุม ชาติที่แตกแยกภายในอยางที่เราเปนมาหลายทศวรรษจะไมมีอีกตอไป"
 YUG_pan_slavic_workers_congress: "สภาคนงานสลาฟทั้งมวล"
 YUG_pan_slavic_workers_congress_desc: "คนงานชาวสลาฟตองรวมพลังกันตอสูเพื่ออุดมการณของตน และเมื่อสหภาพโซเวียตไมเขาใจความทุกขยากของคนงานในคาบสมุทรบอลขาน เราจะรับบทผูนําเอง"
 YUG_research_collaboration: "ความรวมมือดานการวิจัย"
 YUG_research_collaboration_desc: "พันธมิตรของเรามีทรัพยากรมากกวาเราอยางมาก เราจึงควรผลักดันความรวมมือดานการวิจัยที่จะทําใหเราไดรวมแบงปนความกาวหนาทางเทคโนโลยีของพวกเขา"
 YUG_federal_defense_council: "สภาปองกันประเทศแหงสหพันธ"
 YUG_federal_defense_council_desc: "ทุกภูมิภาคตองมีสิทธิ์มีเสียงในการปกปองชาติอันยิ่งใหญของเรา สิ่งนี้จะชวยใหเสียงตางๆ ไดรับการรับฟงมากที่สุดเทาที่ทําได และการเลือกปฏิบัติจะไมปดกั้นผูมีความสามารถตั้งแตเริ่มตน"
 YUG_invite_bulgaria: "เชิญบัลแกเรีย"
 YUG_invite_bulgaria_desc: "พี่นองชาวสลาฟของเราในบัลแกเรียตองการการนําของเราเพื่อคนพบหนทางสูคอมมิวนิสต ยิ่งไปกวานั้น เมื่อพวกเขาอยูทางปกตะวันออกของเรา การดึงพวกเขาเขามารวมจะทําใหเราไมตองกังวลกับพรมแดนสวนใหญอีกตอไป และกําลังทหารของพวกเขาจะมีประโยชนอยางมากในการเผยแผการปฏิวัติ"
 YUG_pan_balkan_workers_congress: "ความริเริ่มบอลขานทั้งมวล"
 YUG_pan_balkan_workers_congress_desc: "แมเราจะรักษาอุดมคติสังคมนิยมไวไดในเพื่อนบานทางใตที่ติดกันแลว แตยังมีผูคนนับไมถวนที่ทุกขทนภายใตเผด็จการของฝายกษัตริยนิยมและชนชั้นกระฎมพีทั่วคาบสมุทรบอลขาน มีเพียงการปลดปลอยคนงานในโรมาเนีย ฮังการี และกรีซเทานั้น เราจึงจะกลาวไดวาเราปลดปลอยคนงานแหงบอลขานแลว"
 YUG_invite_albania: "เชิญแอลเบเนีย"
 YUG_invite_albania_desc: "แอลเบเนียครอบครองพื้นที่ที่แมจะเล็ก แตมีความสําคัญทางยุทธศาสตรตอเรา การดึงพวกเขาเขาสูสภาของเราจะทําใหเรารักษาพรมแดนทางใตสวนใหญไวได พรอมเพิ่มกําลังของพวกเขาเขากับของเรา"
 YUG_invite_greece: "เชิญกรีซ"
 YUG_invite_greece_desc: "หนุมสาวชาวกรีกกําลังทุกขทนภายใตรองเทาบูตเหล็กของผูเปนนาย และมีเพียงการติดอาวุธใหคนยากไรและผูถูกกดขี่เทานั้น ที่เราจะทําลายโซตรวนที่พันธนาการพวกเขาได"
 YUG_invite_romania: "เชิญโรมาเนีย"
 YUG_invite_romania_desc: "ชาวโรมาเนียอาศัยอยูในสังคมชนชั้นสูงที่ไดเห็นความเสียหายที่ระบอบชนชั้นสูงและทุนนิยมกอขึ้นกับประเทศ พวกเขาจะไมตองทนทุกขภายใตมือที่เอาแนไมไดของกษัตริยผูฉอฉลอีกตอไป พวกเขาจะเปนนายแหงชะตากรรมของตนเอง!"
 YUG_invite_hungary: "เชิญฮังการี"
 YUG_invite_hungary_desc: "รัฐฮังการีไมมั่นคงและเปลี่ยนแปลงไปมานับตั้งแตการลมสลายของราชวงศฮับสบูรก ดวยความชวยเหลือของเรา ชาวฮังการีจะคนพบรูปแบบที่แทจริงของรัฐตนในเผด็จการคอมมิวนิสตที่เปนหนึ่งเดียว!"
 YUG_invite_turkey: "เชิญตุรกี"
 YUG_invite_turkey_desc: "ชาวตุรกีไดรับการปลดปลอยจากกาหลิบเมื่อกวาทศวรรษกอน แตยังไมไดรับการปลดปลอยจากนายทุนกระฎมพี แมพรรคประชาชนสาธารณรัฐของตุรกีจะอางวาเปน “สังคมประชาธิปไตย” แตในความเปนจริง พวกเขาลมเหลวโดยสิ้นเชิงในการทําลายโซตรวนของประชาชน และมีเพียงการแทรกแซงโดยตรงของยูโกสลาเวียเทานั้น ที่เราจะปลดปลอยคนงานทั้งหมดแหงบอลขานไดอยางแทจริง"
 YUG_united_autonomous_croatia: "โครเอเชียปกครองตนเองที่เปนหนึ่งเดียว"
 YUG_united_autonomous_croatia_desc: "การรวมบาโนวีนาโครเอเชียเปนรัฐปกครองตนเองเปนทางออกที่มีการเสนอมานานสําหรับปญหาการแบงแยกดินแดนของชาวโครแอตที่เพิ่มขึ้น การมอบอํานาจปกครองตนเองระดับหนึ่งใหโครเอเชียอาจเปลี่ยนศัตรูที่อาจเกิดขึ้นใหกลายเปนพันธมิตรที่แข็งแกรง"
 YUG_devolved_croatia: "โครเอเชียแบบกระจายอํานาจ"
 YUG_devolved_croatia_desc: "ในบรรดาผูคัดคานสหภาพ ไมมีใครสงเสียงดังไปกวาชาวโครแอต ปจจุบันโครเอเชียถูกแบงเปนบานาเตซาวาทางเหนือและบานาเตลิตโตรัลทางใต หากเรามอบอํานาจปกครองตนเองแยกกันใหแตละบานาเต เราจะทั้งบรรเทาฝายคานชาวโครแอตและปองกันไมใหชาวโครแอตมีอิทธิพลมากเกินไปในสหภาพ"
 YUG_safeguard_bosnia: "ปกปองบอสเนีย"
 YUG_safeguard_bosnia_desc: "มีหลายชาติตามพรมแดนของเราที่ตองการเห็นชาวบอสเนียถูกยึดครองและกดขี่ เราตองไมปลอยใหเกิดขึ้น และควรสนับสนุนชาวบอสเนียและเฮอรเซโกวีนาในทุกความพยายามที่จะติดอาวุธและพัฒนาอุตสาหกรรมของตน"
 YUG_divide_bosnia: "แบงแยกบอสเนีย"
 YUG_divide_bosnia_desc: "ภูมิภาคบอสเนียมีความแตกแยกทางวัฒนธรรมและศาสนา ทั้งชาวเซิรบ ชาวโครแอต ชาวมุสลิม ชาวคริสต และชนชาติอื่นอีกนับไมถวน หนทางเดียวที่จะปองกันภูมิภาคนี้ไดอยางเหมาะสมคือการแบงเปนรัฐบอสเนียและรัฐเฮอรเซโกวีนาที่แยกจากกันและทํางานรวมกับสหภาพของเราอยางกลมเกลียว"
 YUG_dissolve_serbia: "ยุบบานาเตเซอรเบีย"
 YUG_dissolve_serbia_desc: "ภูมิภาคที่เราเรียกวา “เซอรเบีย” แทจริงแลวเปนบานของผูคนมากมายที่ไมไดถือวาตนเปนชาวเซิรบ ทั้งชาวมาซิโดเนีย ชาวแอลเบเนีย และชาวมอนเตเนโกร ตางอาศัยอยูในพื้นที่ที่เราอางวาเปนของเซอรเบีย เราตองไมปลอยใหตัวเองถูกมองวาเปนผูรุกรานวัฒนธรรมของพวกเขา และตองทบทวนวาสิ่งใดที่เปนของเซอรเบียโดยชอบธรรม"
 YUG_banat_for_support: "แลกบานัตกับการสนับสนุน"
 YUG_banat_for_support_desc: "ไมใชความลับวาฮังการีและโรมาเนียตองการผนวกเซอรเบียตอนเหนือ และเมื่อรัฐของเราขาดการสนับสนุนจากตางชาติ เราอาจยกดินแดนเหลานี้ใหเพื่อแลกกับการรับรองและการสนับสนุนในระดับหนึ่ง"
 YUG_autonomous_transylvania: "อํานาจปกครองตนเองแกทรานซิลเวเนียสลาฟ"
 YUG_autonomous_transylvania_desc: "ภูมิภาคบานัตและวอยวอดีนาเปนบานไมเพียงของชาวเซิรบ แตยังรวมถึงชาวโรมาเนียและชาวฮังการีดวย การมอบอํานาจปกครองตนเองและการปกครองตนเองใหภูมิภาคเหลานี้อาจยุติการอางสิทธิ์ของโรมาเนียและฮังการีเหนือภูมิภาคนี้ได"
 YUG_fortify_banat: "เสริมปอมปราการบานัต"
 YUG_fortify_banat_desc: "ฮังการีและโรมาเนียเขาใกลศัตรูของเราอยางนากังวล การเรงสรางปอมปราการทางเหนือเปนสิ่งจําเปน หากเราจะปกปองเซอรเบียและรัฐในอารักขาที่ปกครองตนเองของเธอ"
 YUG_evolution: "วิวัฒนาการ"
 YUG_evolution_desc: "แมบางคนจะแยงวาชาติของเราเปนสหภาพที่ไมมั่นคงของวัฒนธรรมตางๆ ที่อยูรวมกันดวยความเปนปฏิปกษ แตเรารูแนวามีเพียงการยืนหยัดรวมกันเปนหนึ่งเดียวเทานั้นที่จะขับไลผูรุกรานตางชาติได เราตองพยายามรวมประชาชนใหเปนหนึ่งและบดขยี้ผูที่พยายามแบงแยกเรา"
 YUG_slovenia_for_support: "แลกสโลวีเนียกับการสนับสนุน"
 YUG_slovenia_for_support_desc: "ฝายอักษะวางแผนจะแบงประเทศของเราระหวางกันเอง บางทีการยกสโลวีเนียใหอิตาลีอาจทั้งกําจัดกลุมกอความวุนวายในสโลวีเนียและแสดงไมตรีตออุดมการณของฝายอักษะ"
 YUG_surrender_macedonia: "ยอมยกมาซิโดเนีย"
 YUG_surrender_macedonia_desc: "บัลแกเรียก็มีเหตุผลที่จะเปนคูแขงกับเรา โดยอางสิทธิ์ในภูมิภาคเซอรเบียตอนใตและมาซิโดเนีย การยกดินแดนที่พวกเขาอางสิทธิ์ใหจะทั้งปดฉากภัยคุกคามที่พรมแดนทางใตและทําใหลัทธิชาตินิยมมาซิโดเนียกลายเปนปญหาของบัลแกเรีย"
 YUG_zara_for_axis: "แลกซาราเพื่อเปนสมาชิกฝายอักษะ"
 YUG_zara_for_axis_desc: "อิตาลีอางวารัฐบาลในซาราเปนผูควบคุมดัลเมเชียโดยชอบธรรม แตบางทีการยืนยันกับอิตาลีวาเราตอสูเพื่ออุดมการณเดียวกัน อาจทําใหพวกเขายินดีคืนซาราใหเราและละทิ้งความทะเยอทะยานในบอลขาน อยางนอยก็ในขณะนี้"
 YUG_surrender_italian_claims: "สละการอางสิทธิ์ตออิตาลี"
 YUG_surrender_italian_claims_desc: "ซาราและอิสเตรียยังคงอยูในมืออิตาลี แตเราไมอาจเสี่ยงยั่วยุ [ITA.GetLeader] ดวยการยืนกรานตอไปวาดินแดนเหลานั้นเปนของเราโดยชอบธรรม บางทีเราอาจไดเขารวมฝายอักษะเพื่อแลกกับการสละการอางสิทธิ์นอกพรมแดนของเรา"
 YUG_end_the_regency: "ยุติการสําเร็จราชการ"
 YUG_end_the_regency_desc: "เจาชายพาฟเลไดปฏิบัติหนาที่ตอราชบัลลังกมานานพอแลว เมื่อสงครามใกลเขามา ประชาชนของเราตองการเห็นพระมหากษัตริยของตนยืนหยัดอยางเขมแข็งตอตานฟาสซิสตและคอมมิวนิสตที่หมายจะทําลายชาติของเรา"
 YUG_coronation: "พระราชพิธีบรมราชาภิเษก"
 YUG_coronation_desc: "ประชาชนของเราไมมีพระมหากษัตริยมานาน และถึงเวลาที่เราตองแสดงใหเห็นถึงความยั่งยืนของราชบัลลังก ดวยการประกอบพิธีบรมราชาภิเษกพระมหากษัตริยในมหาวิหารแหงนครขาว เราจะมอบความมั่นใจแกประชาชนวาราชบัลลังกคงอยูชั่วนิรันดร และเราจะไมพายแพตอผูรุกรานตางชาติ"
 YUG_royal_wedding: "พระราชพิธีอภิเษกสมรส"
 YUG_royal_wedding_desc: "การอภิเษกสมรสของราชวงศเปนวิธีสรางพันธมิตรมาชานาน และเมื่อมีเจาหญิงผูสูงศักดิ์หลายพระองคที่ยังไมมีพระสวามี พระเจาปเตอรผูทรงพระเยาวและเหมาะสมของเราอาจนําพันธมิตรกับมหาอํานาจโลกมาสูเราได"
 YUG_enforced_neutrality: "บังคับใชความเปนกลางของยูโกสลาเวีย"
 YUG_enforced_neutrality_desc: "เราไมอาจปลอยใหคาบสมุทรบอลขานกลายเปนสวนหนึ่งของความขัดแยงระดับโลกที่กําลังกอตัว เราตองประกาศความเปนกลางและหลีกเลี่ยงการกระทําใดๆ ที่จะทําใหเราเขาขางมหาอํานาจโลกที่บาดหมางกัน"
 YUG_fortress_yugoslavia: "ปอมปราการยูโกสลาเวีย"
 YUG_fortress_yugoslavia_desc: "เราไมอาจปลอยใหภัยนาซีที่พรมแดนของเราลอยนวล! เมื่ออิตาลีอยูในซาราและเยอรมนีอยูในออสเตรีย เราตองทําใหแนใจวาพรมแดนของเราไดรับการปกปอง และทหารที่นั่นมีทุกสิ่งที่ตองใชในการตอสูกับฟาสซิสต"
 YUG_ban_fascists: "สั่งหามพรรคฟาสซิสต"
 YUG_ban_fascists_desc: "แมในขณะนี้ ยังมีพรรคการเมืองในชาติของเราที่ยกวัฒนธรรมหนึ่งไวเหนือวัฒนธรรมอื่นทั้งหมดและแสวงหาความเปนใหญในสหภาพยูโกสลาเวีย คนเหลานี้ไมมีที่ยืนในชาติของเรา และตองถูกทําใหเงียบเสียง"
 YUG_towards_independence: "สูเอกราช"
 YUG_towards_independence_desc: "เมื่อเราไดแยกสหภาพออกเปนรัฐปกครองตนเองหลายรัฐแลว เราตองกาวไปอีกขั้น นั่นคือเอกราช เราไมอาจปกครองเพื่อนรวมชาติอยางเผด็จการไดอีกตอไป เราตองไวใจใหพวกเขาปกครองตนเอง โดยปราศจากการแทรกแซงจากเซอรเบีย"
 YUG_defence_army_of_yugoslavia: "กองทัพปองกันแหงยูโกสลาเวีย"
 YUG_defence_army_of_yugoslavia_desc: "การขอใหพลเมืองทั่วไปตอสูเพื่อสหภาพเปนเรื่องยาก แตการตอสูเพื่อบานของตนเองเปนหนาที่ของทุกคน เมื่อคํามั่นเรื่องเอกราชใกลเปนจริง สหภาพของเราก็เต็มไปดวยผูคนที่พรอมตอสูกับศัตรู สิ่งที่พวกเขาตองการคือการสนับสนุนจากรัฐบาลเทานั้น"
 YUG_defence_league: "สันนิบาตปองกันยูโกสลาเวีย"
 YUG_defence_league_desc: "สมาชิกของรัฐเราไดรับอํานาจปกครองตนเองในระดับสูงแลว เหลือเพียงขั้นตอนสุดทาย ดวยการรับรองเอกราชของทุกชาติในบอลขานอยางเปนทางการ เราจะเปลี่ยนยูโกสลาเวียจากชาติหนึ่งใหกลายเปนความรวมมือทางเศรษฐกิจและการทหารของหลายชาติ"
 YUG_united_kingdom: "ราชอาณาจักรที่เปนหนึ่งเดียว"
 YUG_united_kingdom_desc: "เมื่อประชาชนของเราไดลิ้มรสเอกราชและรูสึกวาไดรับการเปนตัวแทนอยางเหมาะสมในสหภาพแลว ถึงเวลาที่เราตองสรางความรูสึกชาตินิยมรวมและเอกภาพ ซึ่งขาดหายไปอยางมากในรัฐเดิมของเรา"
 YUG_reunite_the_kingdom: "รวมราชอาณาจักรอีกครั้ง"
 YUG_reunite_the_kingdom_desc: "แมหลายคนกังวลวาการกระทํานี้เสี่ยงที่จะยอนกลับไปสูความแตกแยกและความขัดแยงทางวัฒนธรรมที่เคยเปนลักษณะของยูโกสลาเวีย แตเราตองรวมชาติกลับเปนหนึ่งเดียวเพื่อเผชิญภัยคุกคามที่ใหญกวาตามพรมแดนของเรา"
 YUG_attract_allied_capital: "ดึงดูดทุนจากฝายสัมพันธมิตร"
 YUG_attract_allied_capital_desc: "อังกฤษมีเหตุผลที่จะสนับสนุนชาติของเรา เราเปนพันธมิตรกันมานานตั้งแตกอนมหาสงครามครั้งแรก และการดึงดูดนักลงทุนจากชาติฝายสัมพันธมิตรจะทําใหพวกเขามั่นใจวาความสัมพันธระหวางชาติเราไมอาจตัดขาดได"
 YUG_attract_axis_capital: "ดึงดูดทุนจากฝายอักษะ"
 YUG_attract_axis_capital_desc: "เศรษฐกิจของเราอยูในสภาพยํ่าแย และแมเราจะรูดีวาไมใชความลับที่อิตาลีมีความทะเยอทะยานตอแผนดินของเรา เราก็ตองสงเสริมการคากับเพื่อนบานหากตองการเตรียมพรอมทางเศรษฐกิจเพื่อตอตานพวกเขา"
 YUG_industrialization_program: "โครงการพัฒนาอุตสาหกรรม"
 YUG_industrialization_program_desc: "จําเปนตองมีโครงการพัฒนาอุตสาหกรรมอยางรวดเร็ว หากเราจะตามทันโครงการเสริมกําลังอาวุธของเพื่อนบาน"
 YUG_expand_the_mining_industry: "ขยายอุตสาหกรรมเหมืองแร"
 YUG_expand_the_mining_industry_desc: "เราตองการทรัพยากรจํานวนมากเพื่อหลอเลี้ยงเครื่องจักรสงครามที่กําลังกอตัวของเรา เราควรหาทางขยายอุตสาหกรรมเหมืองแรภายในประเทศ"
 YUG_rare_minerals_exploitation: "การใชประโยชนจากแรหายาก"
 YUG_rare_minerals_exploitation_desc: "แหลงโลหะหายากที่ไมเคยถูกนํามาใชประโยชนไดกลายเปนสิ่งสําคัญยิ่งขึ้นมาในทันที เราตองสรางเหมืองและโครงสรางพื้นฐานที่จําเปนทันทีเพื่อใชประโยชนจากมัน"
 YUG_exploit_the_pannonian_deposits: "ใชประโยชนจากแหลงแรแพนโนเนีย"
 YUG_exploit_the_pannonian_deposits_desc: "เราควรใชประโยชนจากแหลงนํ้ามันในดินแดนของเรา แมปริมาณจะนอยนิด แตเราตองการทุกหยดเทาที่หาไดเพื่อเครื่องจักรสงครามของเรา"
 YUG_develop_civilian_industry: "พัฒนาอุตสาหกรรมพลเรือน"
 YUG_develop_civilian_industry_desc: "อุตสาหกรรมพลเรือนของเราตองกาวทันอุตสาหกรรมทหาร เพื่อปอนเครื่องจักรและสิ่งจําเปนอื่นๆ ให"
 YUG_integrated_rail_network: "เครือขายทางรถไฟแบบบูรณาการ"
 YUG_integrated_rail_network_desc: "เราควรขยายเครือขายทางรถไฟแหงชาติในทุกสวนของประเทศอยางเทาเทียมกัน ไมมีสวนใดของชาติเราที่สําคัญกวาสวนอื่น"
 YUG_improve_light_industry: "ปรับปรุงอุตสาหกรรมเบา"
 YUG_improve_light_industry_desc: "เรามีความไมสงบภายในอยูแลว จึงไมควรปลอยใหอุตสาหกรรมเบาลาหลังจนประชาชนขาดแคลนสิ่งจําเปนในชีวิตประจําวัน"
 YUG_develop_slovenian_industry: "พัฒนาอุตสาหกรรมสโลวีเนีย"
 YUG_develop_slovenian_industry_desc: "แมจะถูกละเลยมานาน แตสโลวีเนียมีพื้นที่เพียงพอที่จะสรางศูนยกลางอุตสาหกรรมแหงใหม ซึ่งจะทําใหชาวสโลวีนพอใจอยางยิ่งดวย"
 YUG_local_self_management: "การบริหารจัดการตนเองระดับทองถิ่น"
 YUG_local_self_management_desc: "การเพิ่มอํานาจบริหารจัดการตนเองระดับทองถิ่นจะชวยใหใชทรัพยากรทองถิ่นไดดีขึ้นและเพิ่มประสิทธิภาพของโครงการกอสรางใหม"
 YUG_expand_the_university_of_ljubljana: "ขยายมหาวิทยาลัยลูบลิยานา"
 YUG_expand_the_university_of_ljubljana_desc: "การขยายมหาวิทยาลัยของเราในสโลวีเนียจะทําใหเรามีอีกหนึ่งสถาบันในการใหการศึกษาแกประชาชน"
 YUG_develop_military_industry: "พัฒนาอุตสาหกรรมทหาร"
 YUG_develop_military_industry_desc: "กองทัพสมัยใหมตองมีฐานอุตสาหกรรมหนักเพื่อรองรับการผลิตอากาศยานใหมที่จําเปน"
 YUG_improve_serbian_rail_network: "ปรับปรุงเครือขายทางรถไฟเซอรเบีย"
 YUG_improve_serbian_rail_network_desc: "เราสามารถละเวนการสรางเครือขายทางรถไฟในจังหวัดหางไกลได พื้นที่ที่สําคัญที่สุดคือภาคกลางและภาคตะวันออก"
 YUG_serbian_steel: "เหล็กกลาเซอรเบีย"
 YUG_serbian_steel_desc: "เราตองเริ่มการผลิตเหล็กกลาในเซอรเบีย เราตองการมันเพิ่มขึ้นเสมอเพื่อการทําสงคราม"
 YUG_expand_the_university_of_belgrad: "ขยายมหาวิทยาลัยเบลเกรด"
 YUG_expand_the_university_of_belgrad_desc: "การขยายมหาวิทยาลัยที่ทรงเกียรติที่สุดของเราจะเพิ่มจํานวนผูมีสติปญญาเฉียบแหลมที่เขาสูทีมวิจัยและพัฒนาของเรา"
 YUG_expand_the_university_of_zagreb: "ขยายมหาวิทยาลัยซาเกร็บ"
 YUG_expand_the_university_of_zagreb_desc: "มหาวิทยาลัยซาเกร็บอันเกาแกเปนหนึ่งในสถาบันอุดมศึกษาชั้นนํามาชานาน งบประมาณเพิ่มเติมจะทําใหมหาวิทยาลัยสามารถผลิตงานวิจัยอันมีคาไดดวย"
 YUG_central_management: "การบริหารจากสวนกลาง"
 YUG_central_management_desc: "การควบคุมจากสวนกลางอยางเขมแข็งในทุกดานของการบริหารจะชวยเพิ่มความสามารถในการรักษาเปาหมายการผลิต"
 YUG_expand_the_sarajevo_arsenals: "ขยายคลังสรรพาวุธซาราเยโว"
 YUG_expand_the_sarajevo_arsenals_desc: "เราตองการกําลังการผลิตเพิ่มขึ้นเพื่อใหทันกับความตองการที่เพิ่มขึ้นของกองทัพ คลังสรรพาวุธซาราเยโวเปนตัวเลือกอันดับตนสําหรับการขยาย เราจะจัดสรรทรัพยากรทันที"
 YUG_modernize_the_air_force: "ปรับปรุงกองทัพอากาศใหทันสมัย"
 YUG_modernize_the_air_force_desc: "กองทัพอากาศของเราลาสมัยอยางรายแรง หากเราตองการมีโอกาสพอสมควรในการปกปองนานฟาเหนือดินแดนของเรา ไมตองพูดถึงการรุกไปหาศัตรู เราจําเปนตองมีโครงการปรับปรุงใหทันสมัยอยางถึงราก"
 YUG_local_developers: "ผูพัฒนาในประเทศ"
 YUG_local_developers_desc: "เราตองเพิ่มการสนับสนุนการพัฒนาอากาศยานในประเทศ ซึ่งจะทําใหเราควบคุมเครื่องบินรุนที่ไดมากขึ้นและกระตุนอุตสาหกรรมของเรา"
 YUG_ikarus: "อิคารุส"
 YUG_ikarus_desc: "โรงงานอิคารุสในโนวีซาด อุตสาหกรรมอากาศยานที่เกาแกที่สุดของเรา ตองไดรับการขยายเพื่อเตรียมรับการผลิตที่เพิ่มขึ้นสําหรับกองทัพอากาศใหมของเรา"
 YUG_designer_tt: "ปลดล็อกบริษัทนี้ในฐานะผูออกแบบอากาศยาน\n"
 YUG_rogozarski: "โรโกชารสกี"
 YUG_rogozarski_desc: "'โรงงานอากาศยานเซอรเบียแหงแรกของชิวอยิน โรโกชารสกี' กอตั้งขึ้นไมนานหลังอิคารุส และจําเปนตองขยายหากจะตามทันความตองการการผลิตในปจจุบัน"
 YUG_zmaj: "ซมาย"
 YUG_zmaj_desc: "โรงงานอากาศยานซมายแหงเบลเกรดตองไดรับการจัดสรรพื้นที่ใหมเพื่อขยายกิจการ แมจะใหมกวาบริษัทอื่นของเรา แตซมายมีศักยภาพเพียงพอที่จะตอบสนองความตองการการผลิตหากไดรับการขยาย"
 YUG_the_ik_3: "IK-3"
 YUG_the_ik_3_desc: "วิศวกรสามคนทํางานอยางลับๆ ในเวลาวาง และไดเสนอแบบเครื่องบินขับไลอันนาทึ่งเพื่อทดแทนเครื่องบินขับไลที่สรางจากตางประเทศที่เราใชอยู หากไดรับการสนับสนุนที่เหมาะสม ก็นาจะเริ่มการผลิตไดในไมชา"
 YUG_heavy_fighter_project: "โครงการเครื่องบินขับไลหนัก"
 YUG_heavy_fighter_project_desc: "เครื่องบินขับไลของเราตองสามารถคุมกันเครื่องบินทิ้งระเบิดที่เปราะบางกวาได ซึ่งตองการอาวุธที่หนักขึ้นและพิสัยที่ไกลขึ้น โดยแลกกับความเร็วและความคลองตัวบางสวน"
 YUG_bomber_project: "โครงการเครื่องบินทิ้งระเบิด"
 YUG_bomber_project_desc: "เพื่อรุกไปหาศัตรู เราตองมีเครื่องบินทิ้งระเบิด วิศวกรของเราตองไดรับมอบหมายใหพัฒนาแบบเครื่องบินประเภทนี้ขึ้นเองในประเทศ"
 YUG_purchase_foreign: "ซื้อจากตางชาติ"
 YUG_purchase_foreign_desc: "มีชาติอื่นที่ทุมทรัพยากรพัฒนาเครื่องบินขับไลชั้นดีมากกวาที่เราจะทําไดมาก เราควรซื้อเครื่องบินของพวกเขาแทนที่จะผานกระบวนการลองผิดลองถูกอันยากลําบากเพื่อพัฒนาของเราเอง"
 YUG_license_production: "การผลิตภายใตใบอนุญาต"
 YUG_license_production_desc: "กระบวนการจัดหาเครื่องบินใหมอาจสะดวกขึ้นหากเราผลิตเองภายใตใบอนุญาต เราจะจัดทําขอตกลงเชนนี้โดยเร็วที่สุด"
 YUG_fighter_license: "ใบอนุญาตเครื่องบินขับไล"
 YUG_fighter_license_desc: "เราตองมุงเนนการผลิตเครื่องบินขับไลภายใตใบอนุญาตใหกองทัพอากาศ เพราะอยางไรเสียเครื่องบินทิ้งระเบิดก็ไรประโยชนหากไมมีเครื่องบินขับไลคุมกัน"
 YUG_bomber_license: "ใบอนุญาตเครื่องบินทิ้งระเบิด"
 YUG_bomber_license_desc: "ทองฟาเปดโอกาสใหมในการรุกไปหาศัตรู ดังนั้นเครื่องบินทิ้งระเบิดจึงเปนสิ่งที่เราตองทุมการผลิตภายใตใบอนุญาตทั้งหมด"
 YUG_army_modernization: "ปรับปรุงกองทัพบกใหทันสมัย"
 YUG_army_modernization_desc: "วิถีแหงสงครามเปลี่ยนไปนับตั้งแตความขัดแยงครั้งกอน และเราตองทําใหกองทัพกาวทันยุคสมัยดวยการปรับปรุงยุทโธปกรณและยุทธวิธีใหทันสมัย"
 YUG_motorize_the_cavalry: "เปลี่ยนทหารมาเปนยานยนต"
 YUG_motorize_the_cavalry_desc: "พัฒนาการใหมทางวิศวกรรมยานยนตไดปฏิวัติศักยภาพดานความเร็วและความคลองตัวของหนวยทหาร หนวยทหารมาของเราตองเลิกใชมาและหันมาใชรถบรรทุกแทน"
 YUG_motorized_logistics: "การสงกําลังบํารุงดวยยานยนต"
 YUG_motorized_logistics_desc: "การใชยานยนตเปดหนทางใหมที่มีแนวโนมดีในการทําใหสิ่งจําเปนพื้นฐานและยุทโธปกรณเฉพาะทางตามทันทหารแนวหนา ซึ่งทําใหกองกําลังของเราอยูในสภาพพรอมรบที่ดีที่สุดเสมอ"
 YUG_armored_cavalry: "ทหารมายานเกราะ"
 YUG_armored_cavalry_desc: "การติดเกราะใหยานลําเลียงพลชวยเพิ่มความอยูรอด กําลังรบ และขวัญกําลังใจไดอยางมาก อยางไรก็ตาม สิ่งนี้ตองการยานพาหนะประเภทใหมที่อยางนอยเปนแบบกึ่งสายพาน ซึ่งรับนํ้าหนักที่เพิ่มขึ้นไดโดยไมติดหลมในภูมิประเทศ และยังติดอาวุธของตัวเองดวย"
 YUG_tank_conversions: "การดัดแปลงรถถัง"
 YUG_tank_conversions_desc: "แมตอนนี้เราอาจตองการรถถัง แตเดือนหนาเราอาจตองการปนใหญอัตตาจรหรือรถถังพิฆาตที่ใชแชสซีเดียวกัน ยุทโธปกรณยานเกราะของเราตองยืดหยุนและปรับตัวไดตามความตองการในขณะนั้น"
 YUG_modern_tanks: "รถถังสมัยใหม"
 YUG_modern_tanks_desc: "ดวยการติดตั้งอาวุธหลักขนาดลํากลองใหญ เทคโนโลยียานเกราะไดพัฒนาไปไกลเกินกวาเจตนาเพียงลําเลียงกําลังพลจากจุด A ไปยังจุด B อยางปลอดภัย เราตองพัฒนารถถังสมัยใหมในแบบของเราเองเพื่อใหแขงขันกับเพื่อนบานได"
 YUG_tank_licenses: "ใบอนุญาตรถถัง"
 YUG_tank_licenses_desc: "แทนที่จะใชทรัพยากรอันจํากัดพัฒนารถถังรุนของเราเอง เราสามารถผลิตรุนของตางชาติภายใตใบอนุญาตไดอยางมีประสิทธิภาพกวามาก"
 YUG_small_arms: "อาวุธประจํากาย"
 YUG_small_arms_desc: "ทหารราบคือกระดูกสันหลังของทุกกองทัพ และเราตองทําใหพวกเขามียุทโธปกรณที่ดีที่สุดเทาที่ทําได เราตองผลักดันการพัฒนาอาวุธรุนใหมที่ทันสมัย"
 YUG_domestic_artillery_production: "การผลิตปนใหญในประเทศ"
 YUG_domestic_artillery_production_desc: "การกระตุนการพัฒนาปนใหญรุนใหมที่ทันสมัยภายในประเทศ จะทําใหกองกําลังของเราไดรับการยิงสนับสนุนที่ดีที่สุดเทาที่เราจะมอบใหได"
 YUG_anti_tank_defenses: "การปองกันรถถัง"
 YUG_anti_tank_defenses_desc: "เมื่อรถถังกลายเปนศูนยกลางของสงครามสมัยใหม จําเปนตองมีพัฒนาการใหมดานปนตอสูรถถังภาคสนาม เพื่อใหทหารราบของเราทําลายอสูรหุมเกราะเหลานี้ได"
 YUG_mountain_brigades: "กองพลนอยภูเขา"
 YUG_mountain_brigades_desc: "พื้นที่สวนใหญของชาติเราเปนภูเขา จึงจําเปนตองจัดตั้งกองพลนอยพิเศษที่เชี่ยวชาญการรบในภูมิประเทศแบบนี้"
 YUG_independent_engineer_regiments: "กรมทหารชางอิสระ"
 YUG_independent_engineer_regiments_desc: "ความคลองตัวคือกุญแจสําคัญของหลักนิยมทางทหารสมัยใหม แมภูมิประเทศอาจไมเอื้ออํานวยเสมอไป กรมทหารชางโดยเฉพาะที่ประจําในกองพลของเราจะชวยใหกองพลเคลื่อนที่ผานภูมิประเทศทุกรูปแบบได"
 YUG_motorized_recon_companies: "กองรอยลาดตระเวนยานยนต"
 YUG_motorized_recon_companies_desc: "เพื่อใหไดขอมูลที่เพียงพอเกี่ยวกับรูปขบวนและที่ตั้งของศัตรู เราตองมีกองรอยลาดตระเวนยานยนตโดยเฉพาะที่ครอบคลุมระยะทางไกลลวงหนากําลังหลักของเรา"
 YUG_form_parachute_battalions: "จัดตั้งกองพันพลรม"
 YUG_form_parachute_battalions_desc: "ดวยการใชมิติที่สาม เราสามารถโจมตีเปาหมายจากทิศทางที่ไมคาดคิด ลึกเขาไปหลังแนวขาศึก การจัดตั้งกองพันสงทางอากาศเฉพาะทางจะทําใหเราใชกําลังทางอากาศไดคุมคาที่สุด"
 YUG_army_maneuvers: "การซอมรบของกองทัพ"
 YUG_army_maneuvers_desc: "เพื่อปลุกกองทัพใหกลับมาอยูในสภาพพรอมรบ ตองจัดการซอมรบครั้งใหม ประสบการณนี้จะนําไปสูความเขาใจใหมเกี่ยวกับสงครามสมัยใหมอยางไมตองสงสัย"
 YUG_supremacy_of_offense: "ความเปนเลิศของการรุก"
 YUG_supremacy_of_offense_desc: "การรุกคือกุญแจสูชัยชนะ ดังนั้นจึงตองเปนตัวกําหนดยุทธศาสตรโดยรวมและการพัฒนาหลักนิยมใหมของเรา"
 YUG_supremacy_of_defense: "ความเปนเลิศของการปองกัน"
 YUG_supremacy_of_defense_desc: "เมื่อถูกศัตรูลอมไวทุกดาน เราตองยืนหยัดนานพอใหพันธมิตรมาชวยแบงเบาแรงกดดัน การพัฒนาหลักนิยมทางทหารใหมตองมุงเนนการปกปองมาตุภูมิ"
 YUG_artillery_regiments: "กรมทหารปนใหญ"
 YUG_artillery_regiments_desc: "การเพิ่มกรมทหารปนใหญอันทรงพลังใหกองพลของเราจะเพิ่มกําลังรบโดยรวมไดอยางมาก"
 YUG_expand_the_split_shipyards: "ขยายอูตอเรือสปลิต"
 YUG_expand_the_split_shipyards_desc: "อุตสาหกรรมตอเรือที่มีอยูเดิมในดัลเมเชียเปนตัวเลือกอันดับตนสําหรับการขยาย และมีสิ่งอํานวยความสะดวกเพียงพอสําหรับเรือรบขนาดใหญ อยางไรก็ตาม เสียงเรียกรองอํานาจปกครองตนเองที่มากขึ้นของชาวโครแอตอาจทําใหเราสูญเสียการควบคุมสิ่งอํานวยความสะดวกเหลานี้โดยตรงในที่สุด"
 YUG_contest_the_adriatic: "ชิงอํานาจในทะเลเอเดรียติก"
 YUG_contest_the_adriatic_desc: "การปกปองชายฝงของเราเริ่มตนในทะเลที่อยูไกลออกไป เราตองพัฒนายุทธวิธีและยุทธศาสตรทางเรือใหมเพื่อแยงชิงการควบคุมหรืออยางนอยก็ทาทายอํานาจในทะเลเอเดรียติก"
 YUG_replace_the_dalmacija: "ทดแทนเรือดัลมาซียา"
 YUG_replace_the_dalmacija_desc: "เรือลาดตระเวนเยอรมันเกาดัลมาซียามีแบบที่ลาสมัย เราตองการเรือลาดตระเวนลําใหมที่ทันสมัยมาทดแทนและเปนกระดูกสันหลังของกองเรือเอเดรียติกของเรา"
 YUG_naval_bombers: "เครื่องบินทิ้งระเบิดทางทะเล"
 YUG_naval_bombers_desc: "ทะเลเอเดรียติกยาวแตแคบ ทําใหเครื่องบินจากสนามบินของเราเขาถึงไดงาย การพัฒนาเครื่องบินทิ้งระเบิดทางทะเลรุนเฉพาะอาจเพิ่มโอกาสของกองทัพเรือเราในการตอกรกับศัตรูที่ทรงพลังกวาไดอยางมาก"
 YUG_heavy_cruiser_project: "โครงการเรือลาดตระเวนหนัก"
 YUG_heavy_cruiser_project_desc: "เพื่อทาทายกองทัพเรือขาศึกไดอยางเพียงพอ เราตองการระวางขับนํ้าที่มากขึ้นและอาวุธที่หนักขึ้น เรือลาดตระเวนหนักจะเปนกาวที่ดีตอจากเรือลาดตระเวนเบาที่เราใชเปนกําลังหลักของกองเรือมาจนถึงตอนนี้"
 YUG_modern_destroyers: "เรือพิฆาตสมัยใหม"
 YUG_modern_destroyers_desc: "เรือพิฆาตคือกระดูกสันหลังของกองทัพเรือทุกชาติ และเราตองทําใหเรือพิฆาตของเราไมดอยกวาของศัตรู"
 YUG_expand_the_serbian_shipyards: "ขยายอูตอเรือเซอรเบีย"
 YUG_expand_the_serbian_shipyards_desc: "แมภูมิภาคนี้จะขาดสิ่งอํานวยความสะดวกสําหรับการผลิตเรือรบขนาดใหญ แตการตั้งอูตอเรือขนาดใหญในภูมิภาคมอนเตเนโกรจะทําใหเรายังควบคุมอูเหลานั้นได ไมวานโยบายเรื่องอํานาจปกครองตนเองของโครเอเชียในอนาคตจะเปนเชนไร"
 YUG_coastal_defense: "การปองกันชายฝง"
 YUG_coastal_defense_effect_tt1: "เพิ่ม§Yปอมชายฝง 2 แหง§!ตามแนวชายฝง\n"
 YUG_coastal_defense_effect_tt2: "เพิ่ม§Yปอมชายฝง 1 แหง§!ในที่ตั้ง§Yฐานทัพเรือ§!\n"
 YUG_coastal_defense_desc: "เราไมอาจหวังจะทาทายกองเรือของศัตรูในทะเลเอเดรียติกได เราตองเตรียมชายฝงใหพรอมขับไลการยกพลขึ้นบกใดๆ ที่พวกเขาอาจพยายามทําแทน"
 YUG_expand_the_submarine_fleet: "ขยายกองเรือดํานํ้า"
 YUG_expand_the_submarine_fleet_desc: "แทนที่จะทาทายศัตรูซึ่งหนาดวยกองทัพเรือที่ดอยกวา เราควรมุงเนนเรือดํานํ้าเพื่อกอกวนศัตรูและโจมตีการเดินเรือพาณิชยของพวกเขา"
 panslavic_workers_congress: "สภาคนงานสลาฟทั้งมวล"
 panbalkan_workers_congress: "สภาคนงานมหาบอลขาน"
