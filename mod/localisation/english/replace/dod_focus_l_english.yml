 YUG_recruitment_flag: "รับสมัครชาวโครแอตไปแลว"
 YUG_royal_party: "ราชวงศคาราจอรเจวิช"
 YUG_peasant_uprisings: "ปลุกปนการลุกฮือของชาวนา"
 YUG_peasant_uprisings_desc: "ประชาชนแหงบอลขานทนทุกขภายใตรองเทาบูตของจักรวรรดินิยมมานานพอแลว! เราจะยื่นมือไปหาชนชั้นลางผูทุกขยากในบอลขาน และจัดตั้งพวกเขาใหนัดหยุดงานและเดินขบวน จนกวาชนชั้นกระฎมพีจะถูกปราบใหสยบอยางชอบธรรม!"
 instigating_a_coup: "กําลังปลุกปนการกบฏของชาวนา"
 YUG_german_military_mission: "การกํากับดูแลทางเทคโนโลยีของเยอรมนี"
 YUG_medal_for_extreme_bravery: "ความกลาหาญอยางยิ่งยวด"
 YUG_medal_for_extreme_bravery_desc: "ความวิริยะอันกลาหาญของทหารเราที่ตรากตรําภายใตการโจมตีจากทุกดาน เปนเหตุใหตองสถาปนาเกียรติยศใหมเพื่อรําลึกถึงจิตวิญญาณอันแนวแนของพวกเขา"
 yug_extreme_bravery_medal: "§Y[ROOT.GetNameDefCap]§! จะสามารถมอบ§Yเหรียญกลาหาญอยางยิ่งยวด§!ใหแก§Yนายทหารภาคสนาม§!ได"
 YUG_brigadistas: "กองพลนานาชาติ"
 YUG_brigadistas_desc: "พลเมืองยูโกสลาเวียผูกลาหาญจํานวนมากเรียกรองที่จะตอสูกับศัตรูรวมของเราในสงครามกลางเมืองสเปนที่กําลังดําเนินอยู"
 ROM_crack_down_on_extremism: "ปราบปรามลัทธิสุดโตง"
 ROM_crack_down_on_extremism_desc: "ภูมิทัศนทางการเมืองของเราเอียงขวาอยางมากภายใตการปกครองของพระมหากษัตริย ถึงกระนั้น กลุมหัวรุนแรงในสังคมยังคงมีอิทธิพลเหนือจิตใจของประชาชน เราตองเคลื่อนไหวตอตานผูแข็งขอเหลานี้เพื่อรับประกันอนาคตที่สายกลางกวาแกประชาชนของเรา"
 ROM_national_christian_party: "พรรคคริสเตียนแหงชาติ"
 ROM_national_christian_party_desc: "นักเขียนออกตาเวียน โกกา มีอิทธิพลอยางมากตอชาติของเราผานพรรคคริสเตียนแหงชาติของเขา พรรคนี้ถือกําเนิดจากอิทธิพลที่สั่งสมมาในฐานะพรรคเกษตรกร จึงมีความเชื่อมโยงอยางแนนแฟนกับชุมชนชนบท การปรับคณะรัฐมนตรีอาจทําใหอิทธิพลของเขาเปนประโยชนตอเรา"
