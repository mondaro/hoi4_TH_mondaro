 AAT_USA_events.01.t: "[USA.GetNameDefCap]ยึดครองกรีนแลนด"
 AAT_USA_events.01.desc: "รัฐบาล[USA.GetAdjective]ภายใตการนําของ[USA.GetLeader]ไดประกาศยึดครองกรีนแลนดในฐานะสวนหนึ่งของหนวยลาดตระเวนกรีนแลนดที่ตั้งขึ้นใหม ซึ่งเปนปฏิบัติการเพื่อปกปองอเมริกาเหนือจากภัยคุกคามและอิทธิพลจากตางชาติตามที่ตกลงกันในการประชุมฮาวานา พวกเขาสัญญาวาจะคืนกรีนแลนดใหเราเมื่อสถานการณโลกสงบลง"
 AAT_USA_events.01.a: "อยางนอยพวกเขาก็จะคืนใหในภายหลัง..."

 AAT_USA_events.02.t: "[FROM.GetNameDefCap]ยึดครองหมูเกาะแฟโร"
 AAT_USA_events.02.desc: "ชาว[FROM.GetAdjective]แถลงวาขณะนี้พวกเขากําลังยึดครองหมูเกาะแฟโร ซึ่งเปนของเดนมารกและเปนจุดยุทธศาสตรที่มีความสําคัญสูง พวกเขาอางวาจะปกปองหมูเกาะแฟโรจากความโหดรายทั้งปวงของสงคราม และจะตั้งมั่นอยูที่นั่นทั้งทางทะเลและทางอากาศจนกวาจะถึงเวลาที่หมูเกาะจะถูกสงคืนใหเรา โดยไดรับการปลดปลอยจากพันธนาการอันโสมมที่การรุกรานของ[?DEN.DEN_overlord_nation.GetAdjective]ไดผลักใหตกลงไป"
 AAT_USA_events.02.a: "อยางนอยประชาชนของเราก็อยูในมือที่ปลอดภัย..."

 AAT_USA_events.03.t: "[FROM.GetName]ตองการหมูเกาะแฟโรคืน"
 AAT_USA_events.03.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]เรียกรองใหเรารักษาคํามั่นสัญญาและคืนหมูเกาะแฟโรใหพวกเขาตามที่ตกลงกันไว ในเมื่อตอนนี้พวกเขาเปนอิสระจากการกดขี่อีกครั้งแลว"
 AAT_USA_events.03.a: "เราสัญญาไวแลว"
 AAT_USA_events.03.b: "ที่จริงแลว เราเปลี่ยนใจแลว"
 AAT_USA_events.04.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา"
 AAT_USA_events.04.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ปฏิเสธคํารองของเรา โดยอางวาหลังการลงประชามติ ประชาชนบนหมูเกาะแฟโรตองการอยูภายใตการปกครองของชาว[FROM.getAdjective]เทานั้นอยางชัดเจน"
 AAT_USA_events.04.a: "ยังไงเราก็ทาทายพวกเขาไมไดอยูแลว"
 AAT_USA_events.04.b: "พวกมันจะตองไดรับผลกรรม"
 AAT_USA_events.05.t: "[FROM.GetName]ตองการกรีนแลนดคืน"
 AAT_USA_events.05.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]เรียกรองใหเรารักษาคํามั่นสัญญาและคืนกรีนแลนดใหพวกเขาตามที่ตกลงกันไว ในเมื่อตอนนี้พวกเขาเปนอิสระจากการกดขี่อีกครั้งแลว"
 AAT_USA_events.06.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา"
 AAT_USA_events.06.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ปฏิเสธคํารองของเรา โดยอางวาหลังการลงประชามติ ประชาชนในกรีนแลนดตองการอยูภายใตการปกครองของชาว[FROM.getAdjective]เทานั้นอยางชัดเจน"

 AAT_USA_events.07.t: "[FROM.GetName]คืนดินแดน"
 AAT_USA_events.07.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ไดรักษาคํามั่นสัญญาและตกลงคืนดินแดนที่พวกเขาดูแลไวให ในเมื่อตอนนี้เราเปนอิสระจากการกดขี่อีกครั้งแลว"
 AAT_USA_events.07.a: "กรีนแลนดกลับคืนมาแลว!"
 AAT_USA_events.07.b: "หมูเกาะแฟโรกลับคืนมาแลว!"

 AAT_USA_events.08.t: "[FROM.GetNameDefCap]เรียกรองดินแดนของเดนมารก"
 AAT_USA_events.08.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]สงคํารองมาใหเราคืนดินแดนของเดนมารกที่ถือครองไวโดยมิชอบใหแกเจาของที่ถูกตอง"
 AAT_USA_events.08.a: "คืนดินแดน"
 AAT_USA_events.08.b: "เราจะไมยอมจํานนตอผูกดขี่!"
 AAT_USA_events.09.t: "[FROM.GetNameDefCap]คืนดินแดนของเดนมารก"
 AAT_USA_events.09.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตกลงคืนดินแดนของเดนมารกที่ถือครองไวโดยมิชอบใหแกเจาของที่ถูกตองแลว"
 AAT_USA_events.09.a: "ชางมีนํ้าใจเสียจริง"







