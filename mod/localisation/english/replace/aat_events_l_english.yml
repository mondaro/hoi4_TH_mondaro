 denmark_expansion_event.220.t: "[FROM.GetNameDefCap] เรียกรองดินแดน[FIN.GetAdjective]ของเรา"
 denmark_expansion_event.220.desc: "[DEN.GetNameDefCap] ดูเหมือนจะเชื่อวาตนมีสิทธิ์ทางประวัติศาสตรเหนือดินแดน[FIN.GetAdjective]ของเรา หากเราตามใจพวกเขา เราก็เสี่ยงจะเสียดินแดนใหกับการขยายอํานาจของ[DEN.GetAdjective] หากเราปฏิเสธ ก็จะเกิดสงครามเต็มรูปแบบ"
