l_english:

#########
        # NORDIC SHARED #
########
 AAT_nordic_shared.1.t: "[FROM.GetName] เชิญเราเขารวม [NORDIC_get_alliance_name] กับพวกเขา" 
 AAT_nordic_shared.1.desc_faction_member: "[FROM.GetNameDefCap] ตองการยกระดับพันธมิตรของเราขึ้นไปอีกขั้น และกระชับความรวมมือในหลายระดับ พวกเขามองวาพันธมิตรทางทหารเปนเพียงกาวแรกสูภูมิภาคนอรดิกที่แข็งแกรงและเปนหนึ่งเดียว"  
 AAT_nordic_shared.1.desc_non_faction_member: "[FROM.GetNameDefCap] กําลังดําเนินการสรางความรวมมืออยางลึกซึ้งระหวางประเทศนอรดิกทั้งหมด พวกเขาตองการกอตั้ง [NORDIC_get_alliance_name] และเชิญเราเขารวมดวย"
 AAT_nordic_shared.1.a: "ความรวมมืออยางใกลชิดคือหนทางรอด" 
 AAT_nordic_shared.1.b: "ฟงดูอันตรายเกินไป เราอยูหาง ๆ ดีกวา" 
 AAT_nordic_shared.2.t: "[FROM.GetName] เสนอการรับประกันรวมกัน"
 AAT_nordic_shared.2.desc: "ขณะที่ความตึงเครียดทั่วโลกเพิ่มสูงขึ้น การหาพันธมิตรที่ไวใจไดยิ่งยากขึ้นเรื่อย ๆ รัฐบาล[FROM.GetAdjective]เสนอวา ในฐานะประเทศนอรดิกดวยกัน เราควรประกาศตอโลกวา [ROOT.GetName] และ [FROM.GetName] จะยืนหยัดเคียงขางกันหากถูกตางชาติรุกราน เราพรอมจะผูกมัดตนเองกับสิ่งนี้หรือไม?"
 AAT_nordic_shared.2.a: "อาจเปนหนทางเดียวที่จะรอด"
 AAT_nordic_shared.2.b: "เราจะไมยอมใหพวกเขาลากเราไปดวย"
 AAT_nordic_shared.3.t: "[FROM.GetName] จะยืนหยัดเคียงขางเรา!"
 AAT_nordic_shared.3.desc: "เราไดรับขาววาประชาชน[FROM.GetAdjective]จะปกปองเอกราชของ [ROOT.GetName] และเราก็จะปกปองเอกราชของพวกเขาเชนกัน ประเทศนอรดิกตองพรอมขับไลการรุกรานใด ๆ ในฐานะกองกําลังที่เปนหนึ่งเดียว แทนที่จะเปนชาติเล็ก ๆ ที่กระจัดกระจาย"
 AAT_nordic_shared.3.a: "ขาวดี!"
 AAT_nordic_shared.4.t: "ขอเสนอของเราถูกปฏิเสธโดย [FROM.GetName]"
 AAT_nordic_shared.4.desc: "ประวัติศาสตรรวมกันหลายศตวรรษดูเหมือนจะไมมีนํ้าหนักพอที่จะโนมนาวรัฐบาล[FROM.GetAdjective]วาประชาชนของเราตองยืนหยัดรวมกันตอตานทรราชตางชาติ หวังวาพวกเขาจะเปลี่ยนใจกอนที่จะสายเกินไป"
 AAT_nordic_shared.4.a: "ขาวราย"
  
 AAT_nordic_cooperation.1.t: "[FROM.GetNameDef] ลํ้าเสนแลว!"
 AAT_nordic_cooperation.1.desc: "ครั้งแลวครั้งเลา เราพบหลักฐานวาความพยายามทางสงครามของเราตอ [?GLOBAL.NORDIC_country_to_defend.GetName] ถูกขัดขวางโดยการสนับสนุนอยางลับ ๆ ของ [FROM.GetName] \n\nบางทีอาจถึงเวลาสั่งสอนพวกเขาวาการทําสงครามที่แทจริงเปนอยางไร"
 AAT_nordic_cooperation.1.a: "เราไมอาจปลอยใหความขัดแยงนี้บานปลายไปมากกวานี้"
 AAT_nordic_cooperation.1.b: "พวกมันตายไปแลว เพียงแตยังไมรูตัว"
 AAT_nordic_cooperation.2.t: "[FROM.GetName] เสนอความชวยเหลือในการทําสงครามของเรา"
 AAT_nordic_cooperation.2.desc: "ในยามอันตรายเชนนี้ สายสัมพันธที่ผูกเราไวกับ [FROM.GetNonIdeologyName] มีคาประมาณไมได พวกเขาไดใหการสนับสนุนในสงครามของเราตอ [?NORDIC_attacker.GetName] และบัดนี้พวกเขายินดีจะทํามากกวานั้น โดยเสนอเขารวมปกปองประเทศของเรา อยางไรเสีย การโจมตีชาติใดชาติหนึ่งของเราก็คือการโจมตีชาตินอรดิกทั้งหมด"
 AAT_nordic_cooperation.2.a: "ยินดีรับความชวยเหลือ"
 AAT_nordic_cooperation.2.b: "เราจัดการเรื่องนี้ไดโดยไมตองพึ่งพวกเขา"
 AAT_nordic_cooperation.3.t: "[FROM.GetName] ปฏิเสธขอเสนอความชวยเหลือของเรา"
 AAT_nordic_cooperation.3.desc: "แมเราจะมีเจตนาดีที่สุด แตดูเหมือนวา [FROM.GetNameDef] ไมตองการหรือไมอยากไดความชวยเหลือของเรา มีเพียงพวกเขาเทานั้นที่รูเหตุผลเบื้องหลังการตัดสินใจอันนาฉงนนี้\n\nนี่ไมไดหมายความวาเราตองหยุดสนับสนุนพวกเขาในทางอื่น หรือวา [?FROM.NORDIC_attacker.GetName] จะตัดสินใจมองวาเราเปนคูสงครามได"
 AAT_nordic_cooperation.3.a: "เอาเถอะ..."
 AAT_nordic_cooperation.4.t: "[FROM.GetName] แสวงหาการลงทุน"
 AAT_nordic_cooperation.4.desc: "เพื่อนบานนอรดิกของเราไดสงคณะผูแทนมาแสวงหาการลงทุนเพื่อพัฒนาเศรษฐกิจของพวกเขาตอไป สิ่งนี้จะเปนประโยชนตอภาคอุตสาหกรรมของเราดวยอยางแนนอน แตเราควรมั่นใจวาเรากําลังสนับสนุนเพื่อนบานที่เปนมิตร ไมใชศัตรูในอนาคต"
 AAT_nordic_cooperation.4.a: "เปนประโยชนตอทั้งสองฝาย"
 AAT_nordic_cooperation.4.b: "ไมคุมที่จะเสี่ยง"
 AAT_nordic_cooperation.5.t: "การลงทุนจาก [FROM.GetName] เริ่มหลั่งไหลเขามาแลว"
 AAT_nordic_cooperation.5.desc: "เพื่อนบานนอรดิกของเรามีนํ้าใจตอบรับคําเชิญใหมาลงทุนในเศรษฐกิจของเรา แนนอนวาพวกเขาจะไดรับผลตอบแทนจากความไววางใจ แตที่สําคัญกวานั้น มันจะชวยใหเศรษฐกิจของเราเติบโตเร็วขึ้น"
 AAT_nordic_cooperation.5.a: "ขาวดี!"
 AAT_nordic_cooperation.6.t: "[FROM.GetName] ปฏิเสธที่จะลงทุนในเศรษฐกิจของเรา"
 AAT_nordic_cooperation.6.desc: "แมเราจะพยายามอยางเต็มที่ เราก็ไมสามารถโนมนาวเพื่อนบานนอรดิกใหชวยพัฒนาเศรษฐกิจของเราตอไปได แนนอนวาเราสามารถลองอีกครั้งกับประเทศอื่นไดเสมอ"
 AAT_nordic_cooperation.6.a: "นาเสียดาย"
 AAT_nordic_cooperation.7.t: "[FROM.GetName] แสวงหาความรวมมือทางเศรษฐกิจ"
 AAT_nordic_cooperation.7.desc: "เพื่อนบานนอรดิกของเราตองการหาจุดรวมเพื่อทําสนธิสัญญาความรวมมือทางเศรษฐกิจและอุตสาหกรรมที่เปนประโยชนรวมกัน หากทําไดอยางเหมาะสมดังที่เราหวัง สิ่งนี้จะกระตุนเศรษฐกิจของทั้งสองฝายเทา ๆ กัน เพราะเราจะเขารวมในฐานะผูเทาเทียมกัน\n\nดวยประวัติศาสตรความเปนศัตรูที่ขึ้น ๆ ลง ๆ ในภูมิภาคของเรา เราตองระวังไมใหกลายเปนการเอื้อประโยชนแกคูแขงในอนาคต หากพวกเขาหันหลังใหเรา"
 AAT_nordic_cooperation.7.a: "ขอตกลงที่ยุติธรรม"
 AAT_nordic_cooperation.7.b: "ดูนาสงสัย"
 AAT_nordic_cooperation.8.t: "[FROM.GetName] ยอมรับขอตกลงของเราแลว"
 AAT_nordic_cooperation.8.desc: "เราเพิ่งไดรับแจงวาผูนํา[FROM.GetAdjective]ตกลงตามขอตกลงที่เปนประโยชนรวมกันของเราแลว นี่จะเปนผลดีอยางยิ่งตอเศรษฐกิจของทั้งสองฝายและตอภูมิภาคนอรดิกโดยรวม"
 AAT_nordic_cooperation.8.a: "ขาวดี!"
 AAT_nordic_cooperation.9.t: "ผูนําของ [FROM.GetName] ปฏิเสธขอเสนอของเรา!" 
 AAT_nordic_cooperation.9.desc: "แมเราตั้งเปาที่จะติดตอกับ [FROM.GetName] อยางเทาเทียม แตพวกเขาแจงเราวาไมสนใจขอตกลงเชนนี้\n\nเราสามารถลองอีกครั้ง หรือลองกับประเทศนอรดิกอื่นไดเสมอ"
 AAT_nordic_cooperation.9.a: "นางุนงง"
  NORDIC_escalation_hostility_reason: "ไดชวยเหลือประเทศนอรดิกที่เปนฝายปองกันแลว"

#########
        # NORWAY #
########
 AAT_norway.1.t: "พวกฟาสซิสตคุกคาม [NOR_lev_trotsky.GetName]"
 AAT_norway.1.desc: "ขณะที่นักปฏิวัติผูเปนที่ถกเถียงออกไปตกปลากับเจาบาน พวกฟาสซิสตที่เกี่ยวของกับพรรคนาสโยนัล ซัมลิงไดบุกเขาไปในบานของคอนราด คนุดเซน ซึ่งเปนที่พํานักของทรอตสกี\n\nพวกโจรกําลังคนหาหลักฐานใด ๆ ที่จะเปนขออางในการกําจัดนักคอมมิวนิสตพลัดถิ่นผูนี้ แตโชคดีที่พวกเขาถูกเยอรดิส ลูกสาวของคนุดเซนไลออกไปจากบานกอนจะไดอะไรที่สําคัญไป"
 AAT_norway.1.a: "ตองกันเขาใหหางจากปญหา"
 AAT_norway.1.b: "เราอาจยิงปนนัดเดียวไดนกสองตัว"
 AAT_norway.1.c: "มอบตําแหนงใหชายผูนี้!"
 AAT_norway.1.d: "อดีตของเขาคือหลักฐานทั้งหมดที่เราตองการ จับเขาเขาคุก!"
  
 AAT_norway.2.t: "ทรอตสกีถูกกักบริเวณที่ฟารม"
 AAT_norway.2.desc: "โดยอางวาเขาละเมิดขอตกลงที่จะไมเขารวมทางการเมืองระหวางลี้ภัย และหลักฐานอันบางเบาที่พวกโจรฟาสซิสตขโมยไป เราไดสง [NOR_lev_trotsky.GetName] ไปยังฟารมแหงหนึ่งในฮูรุม ซึ่งเขาจะอยูภายใตการเฝาระวังของตํารวจและถูกตัดขาดจากโลกภายนอก\n\nนี่เปนการลงโทษที่รุนแรง แตแรงกดดันจาก [SOU.GetNameDef] และพวกฟาสซิสตในประเทศทําใหเขากลายเปนศูนยรวมพลังที่อันตราย"
 AAT_norway.2.a: "นี่คือสิ่งที่ดีที่สุดที่เราทําไดในตอนนี้"
  
 AAT_norway.3.t: "การปราบปรามผูเห็นตางครั้งใหญของ [ROOT.GetLeader.GetName]"
 AAT_norway.3.desc: "หลังเหตุวิวาทที่วิลลาของคนุดเซน เปนที่ชัดเจนวาสถานการณทางการเมืองเต็มไปดวยอันตราย เนื่องจากพวกคอมมิวนิสตและฟาสซิสตตางจองจะขยํ้าคอกัน\n\nการทะเลาะเบาะแวงและความวุนวายทางการเมืองตองไดรับการจัดการ การอยูของทรอตสกีเสี่ยงที่จะทําให [SOU.GetNameDef] โกรธเคือง ขณะเดียวกันพรรคนาสโยนัล ซัมลิงก็พรอมจะยกประเทศให [FGR.GetLeader] ทันทีที่มีโอกาส ดังนั้นตองจํากัดอิทธิพลของพวกเขาไมวาจะตองแลกดวยอะไร\n\nทางเลือกที่ดีที่สุดคือสงเขาไปเม็กซิโก ซึ่ง [MEX.GetLeader] ตกลงที่จะอนุญาตใหเขาเขาประเทศ"
 AAT_norway.3.a: "นี่เพื่อความอยูรอดของนอรเวย"
  
 AAT_norway.4.t: "ทรอตสกีเขารวมรัฐบาลของเรา!"
 AAT_norway.4.desc: "ทางแกความทุกขยากของประชาชน[NOR.GetAdjective]อยูใตจมูกเรามาตลอด [NOR_lev_trotsky.GetName] ไมเพียงเปนหนึ่งในนักเขียนลัทธิมารกซที่ยิ่งใหญที่สุดในยุคของเรา แตยังเปนนักปฏิวัติผูมีเสนหและนายพลผูโดดเดนอีกดวย\n\nสิ่งนี้จะกอใหเกิดความตึงเครียดกับ [SOV.GetNameDef] อยางแนนอน แตก็คุมคา อยางไรเสีย ประสบการณของเขาจะนําชาติที่ยังเยาวของเราและกรรมกรแหงสแกนดิเนเวียไปสูความยิ่งใหญได"
 AAT_norway.4.a: "ผูลี้ภัยของชาติหนึ่งคือผูกอบกูของอีกชาติหนึ่ง!"
  
 AAT_norway.5.t: "[NOR_lev_trotsky.GetName] ถูกจําคุก!"
 AAT_norway.5.desc: "คนอื่นอาจมองวาหลักฐานที่พบในบานของคนุดเซนนั้นบางเบา ไรสาระ หรือแมแตถูกกุขึ้น และพวกเขาอาจพูดถูก แตบางทีในสักวันหนึ่งภายใตสถานการณบางอยาง ผูพิพากษาอาจยอมรับวามันมีผลก็ได นอกจากนี้ ขอเท็จจริงยังคงอยูวาเราไมอาจเสี่ยงทําใหพรรคนาสโยนัล ซัมลิงไมพอใจในตอนนี้ นี่คือเหตุผลที่ [NOR_lev_trotsky.GetName] ถูกควบคุมตัว โดยมีผลทันที\n\nเมื่อไหรหรืออยางไรที่เขาจะไดเห็นเดือนเห็นตะวันอีกครั้งเปนเรื่องที่ไมสําคัญนักในตอนนี้ แตเราจะดูแลใหอยางนอยเขามีที่พักที่ดีกวาตอนอยูไซบีเรีย"
 AAT_norway.5.a: "เขาตองถูกหยุดยั้ง"
  
 AAT_norway.6.t: "ชะตากรรมของทรอตสกี"
 AAT_norway.6.desc: "นับตั้งแตเรากักบริเวณ [NOR_lev_trotsky.GetName] ไวที่ฟารมในฮูรุมก็ผานมาสักระยะแลว และดูเหมือนวานี่ไมใชขอตกลงที่ดีสําหรับฝายใดเลย [SOV.GetNameDefCap] ตองการใหสงตัวเขากลับ พรรคนาสโยนัล ซัมลิงตองการใหแขวนคอเขา และทุกคนที่ไมใชผูศรัทธาทรอตสกีอยางหัวปกหัวปาตางตองการใหเขาออกไป เราตองตัดสินใจวาจะทําอยางไรกับผูลี้ภัยตัวปญหาผูนี้\n\nประธานาธิบดีเม็กซิโก [MEX.GetLeader] เสนอจะรับตัวเขาไวหากเราเลือกใหเขาลี้ภัยตอไป แตเราก็อาจสงเขาไปให [SOV.GetLeader] เปนของกํานัลแหงมิตรภาพแทนได"
 AAT_norway.6.a: "เขาจะไดเพลิดเพลินกับแดดเม็กซิโก"
 AAT_norway.6.b: "สตาลินจะรักเราเพราะเรื่องนี้!" 
  
 AAT_norway.7.t: "[get_trotsky_lastname] เดินทางถึงเม็กซิโก"
 AAT_norway.7.desc: "หลังจากหลายปของการลี้ภัยอันอึดอัดในประเทศของเรา ผูลี้ภัยตัวปญหา [NOR_lev_trotsky] ไดเดินทางถึงเม็กซิโก ซึ่งเขาจะพักอยูกับจิตรกรฟรีดา คาหโลและดิเอโก ริเบรา ผูซึ่งคงจะเขากันไดดีกับเขาและภรรยาอยางแนนอน\n\nเขานาจะปลอดภัยจาก [SOV.GetNameDef] แตที่สําคัญที่สุด เขาจะไมเปนปญหาของเราอีกตอไป"
 AAT_norway.7.a: "ในที่สุดก็สงบเสียที"
  
 AAT_norway.8.t: "[get_trotsky_lastname] เดินทางถึงมอสโก"
 AAT_norway.8.desc_SOV: "เราใฝฝนถึงชวงเวลานี้มาหลายป อสรพิษผูทรยศ [SOV_lev_trotsky.GetName] ตกอยูในมือของเราแลว เขาจะตองชดใชสําหรับอาชญากรรมที่กอตอการปฏิวัติ และที่สําคัญที่สุด ตอสหายสตาลิน ซึ่งในสายตาของชนชั้นกรรมาชีพแลวทั้งสองสิ่งนี้ก็ไมตางกันเลย"
 AAT_norway.8.desc_NOR: "อดีตนักปฏิวัติตัวปญหา [NOR_lev_trotsky.GetName] ถูกนําตัวไปยังมอสโก ซึ่งเขาจะถูกคุมขัง หรืออาจถูกประหาร ขึ้นอยูกับอารมณของ [SOU.GetLeader]\n\nไมวาชะตากรรมของเขาจะเปนอยางไร ในที่สุดเราก็ลางมือจากเรื่องยืดเยื้อนี้ได พรอมผลพลอยไดคือความใกลชิดกับ [SOU.GetNameDef] ที่เพิ่มขึ้น"
 AAT_norway.8.a: "ในที่สุด!"
 AAT_norway.8.b: "ไปไดก็ดี!"
  
 AAT_norway.9.t: "คณะรัฐมนตรีของนีกอรดสโวลด"
 AAT_norway.9.desc: "รัฐบาลที่นําโดยพรรคแรงงาน โดยมี [NOR_johan_nygaardsvold.GetName] เปนผูกุมบังเหียน เปนรัฐบาลที่มีเสถียรภาพและมีเสียงขางมากชัดเจนชุดแรกที่ชาติอันยังเยาวของเราเคยมี คณะรัฐมนตรีทํางานอยางหนักตลอดปที่ผานมา ผลักดันมาตรการที่แมจะชา แตจะชวยให [NOR.GetName] หลุดพนจากวิกฤตเศรษฐกิจอันหนักหนวงที่ประเทศกําลังเผชิญ และรักษาสวัสดิภาพของประชาชน\n\nแนนอนวามาตรการเหลานี้แลกมาดวยการเตรียมพรอมทางทหารใด ๆ ที่เราอาจตองการหากถูกสงครามโอบลอม เราไดแตหวังวาจะไมตองใชมัน"
 AAT_norway.9.a: "ขางหนามีแตสันติภาพและเสถียรภาพ!"
  
 AAT_norway.10.t: "สตอรติงสะดุด"
 AAT_norway.10.desc: "ขณะที่สงครามในยุโรปดูจะหลีกเลี่ยงไมไดมากขึ้นทุกที รัฐสภา[NOR.GetAdjective]หรือสตอรติงก็สั่นคลอนดวยระลอกความโกลาหลและความแตกแยก สัญญาณที่วาคณะรัฐมนตรีของนีกอรดสโวลดจะนํามาซึ่งยุคแหงเสถียรภาพถูกลืมเลือนไปนานแลว เมื่อสมาชิกรัฐสภาดูเหมือนไมอาจตกลงกันไดในมาตรการที่เปนรูปธรรมใด ๆ เพื่อนํา [NOR.GetName] ฝาพายุที่กําลังจะมาถึงไปอยางปลอดภัย\n\nในขณะเดียวกัน ศัตรูของประชาชนก็ลับมีดรอเสพความขัดแยง เติบโตขึ้นจนกระทั่ง [NOR.GetName] ถูกเปลวไฟแหงสงครามกลืนกิน"
 AAT_norway.10.a: "เราจะลมสลายเร็วแคไหน?"
  
 AAT_norway.11.t: "ประชาชนแหง [ROOT.GetName] กําลังตื่นขึ้น!"
 AAT_norway.11.desc: "หลังจากถูกมหาอํานาจสแกนดิเนเวียอื่นกดขี่มาหลายศตวรรษ แลวถูกทิ้งไวใหอยูใตความเมตตาของนายทุนอุตสาหกรรม ประชาชนแหง [ROOT.GetNonIdeologyName] กําลังเรียนรูที่จะยืนหยัดรวมกันตอตานผูกดขี่และปฏิเสธความเปนเจาของพวกเขา\n\nบัดนี้ชาว[ROOT.GetAdjective]กําลังมองหาแรงบันดาลใจสําหรับการปฏิวัติของตน!"
 AAT_norway.11.a: "ประชาชนแหงดินแดนโบราณนี้จะไมหลับใหลอีกตอไป!"
  
 AAT_norway.12.t: "มติไมไววางใจโยฮัน นีกอรดสโวลด"
 AAT_norway.12.desc: "แมจะเริ่มตนอยางมีความหวัง แตดูเหมือนวารัฐบาลที่โยฮัน นีกอรดสโวลดจัดตั้งเมื่อปที่แลวไมเพียงลมเหลวในการทําตามสัญญา แตยังมุงมั่นจะลดอาวุธอยางหัวชนฝา สมาชิกรัฐสภาจํานวนมากเชื่อวา [ROOT.GetName] ควรพัฒนาอุตสาหกรรมในแบบที่เปดทางใหลงทุนในกองทัพ[NOR.GetAdjective]ที่ยังตั้งไข เพื่อยับยั้งไมใหมหาอํานาจตางชาติรุกราน\n\nดังนั้น สมาชิกพรรคอนุรักษนิยม ฮอยเรอ จึงเปดการลงมติไมไววางใจ แมประธานพรรค นักอุตสาหกรรมโยฮัน เอช. อันเดรเซน กําลังคิดจะเกษียณอยูแลว แตเขาก็ควาโอกาสนํานอรเวยไปสูทิศทางใหม โดยนําเสนอตนเองเปนทางเลือกที่ปฏิบัติไดจริงและมีประสิทธิภาพ แทนความฝนดานความกาวหนาทางสังคมของนีกอรดสโวลด"
 AAT_norway.12.a: "นีกอรดสโวลดออก อันเดรเซนเขา"
  
 AAT_norway.13.t: "รัฐประหารของควิสลิง"
 AAT_norway.13.desc: "ขณะที่เรามัวยุงอยูกับการขับเคลื่อนเศรษฐกิจและจับตาดูพวกฟาสซิสตในตางแดน เรากลับปลอยใหลัทธิฟาสซิสตในประเทศเนาเปอยลุกลามอยูใตจมูกเรา แมฐานสนับสนุนของเขาจะลดนอยลง และพรรคนาสโยนัล ซัมลิงของเขาไมเคยไดที่นั่งในสตอรติงเลยแมแตที่เดียว แตวิดคุน ควิสลิงก็ไดจัดตั้งรัฐบาลที่ไดรับการหนุนหลังจาก[?NOR.NOR_cw_fascist_attacker.GetAdjective] และอางวาไดยึดกุมกลไกอํานาจใน [ROOT.GetNonIdeologyName] แลว"
 AAT_norway.13.a: "ในที่สุดเวลาของควิสลิงก็มาถึง!"
 AAT_norway.13.b: "ประชาชนแหง [ROOT.GetNonIdeologyName] จะไมมีวันใหอภัยแก ไอคนทรยศ"
 AAT_norway.13.c: "เราตองทําทุกวิถีทางเพื่อถวงเวลาพวกเขา!"
  
 AAT_norway.14.t: "ผูรวมมือที่มีประโยชน"
 AAT_norway.14.desc: "วิดคุน ควิสลิง ผูซึ่งเปนผูสนับสนุนลัทธิฟาสซิสตตัวยงใน [NOR.GetNonIdeologyName] มาหลายป ไดเสนอความชวยเหลือในการรุกรานปตุภูมิของเขา\n\nเขาตองการกอรัฐประหารในออสโลโดยไดรับการสนับสนุนจากเรา และสถาปนาระบอบที่เปนมิตรกับ [ROOT.GetNameDef] เมื่อตั้งมั่นไดแลว เขาจะปูทางใหการรุกรานของเราและทําใหการยึดครอง [NOR.GetName] ของ[ROOT.GetAdjective]ชอบธรรม"
 AAT_norway.14.a: "เขาจะมีประโยชน"
 AAT_norway.14.b: "ตัวตลกนี่นะหรือ? เราจะจัดการ [NOR.GetNonIdeologyName] เอง"
  
 AAT_norway.15.t: "รัฐประหารของควิสลิงหลีกเลี่ยงไมไดแลว!"
 AAT_norway.15.desc: "แมเราจะพยายามอยางเต็มที่ วิดคุน ควิสลิงก็ไดเริ่มความพยายามยึดอํานาจในออสโลแลว ดวยการสนับสนุนจากพวกฟาสซิสตผูรุกราน เขากําลังออกอากาศประกาศจัดตั้งรัฐบาลใหมที่อุทิศตนใหกับการรวมมือกับศัตรูของเรา\n\nไมมีทางจะพูดใหดูดีได เรากําลังแพอยูแลว และรัฐประหารครั้งนี้มีแตจะทําใหความพยายามทางสงครามของเรายํ่าแยลง"
 AAT_norway.15.a: "อนาคตของ [NOR.GetName] อาจตกเปนของควิสลิงอยางนาเสียดาย"
 AAT_norway.15.b: "เราจะสูตอไป!"
  
 AAT_norway.16.t: "เราลี้ภัย แตไมไดมามือเปลา"
 AAT_norway.16.desc: "แมจะตองถอยออกจาก [NOR.GetName] อยางนาเศรา อยางนอยเราก็ยังอุนใจไดวาผูนําของเรามีวิสัยทัศนในการเตรียมรับมือสิ่งเลวรายที่สุด และไดผันทรัพยากรไวชวยเราในการยึดดินแดน[NOR.GetAdjective]คืน\n\nเครื่องมือเหลานี้นาจะชวยใหการเริ่มตนการเดินทางอันยาวไกลกลับสูชายฝงบานเกิดงายขึ้น"
 AAT_norway.16.a: "เราจะกลับมา!"

 AAT_norway.17.t: "ขอเรียกรองดินแดนของ[NOR.GetAdjective]"
 AAT_norway.17.desc_monarchist: "โดยอางเอกสารเกาแกหลายศตวรรษ ราชบัลลังก[FROM.GetAdjective]อางวาเรากําลังควบคุมดินแดนที่โดยนิตินัยเปนสวนหนึ่งของพระอิสริยยศที่พระเจาฮากอนที่ 7 แหงนอรเวยทรงสืบทอด\n\nกลาวโดยเจาะจง พวกเขาหมายถึง [GetNorwegianClaims]"
 AAT_norway.17.desc_fascist: "ผูนําของ [NOR.GetNameDef] เรียกรองใหเรายกดินแดนบางสวนใหพวกเขา โดยอางวาเปนเรื่องของการทวงคืนดินแดนบรรพบุรุษของประชาชนพวกเขา และดังที่คาดไว พวกเขาขูจะทําสงครามหากเราปฏิเสธ\n\nดินแดนที่เปนปญหาคือ [GetNorwegianClaims]"
 AAT_norway.17.desc_denmark: "ขาราชสํานักของพระเจาฮากอนที่ 7 แหงนอรเวย หรือที่เราเคยรูจักในพระนามเจาชายคารลแหงเดนมารก ไดเขามาพบเราพรอมขอเรียกรองอันจริงจัง ตามที่พวกเขาอาง เอกสารเกาที่มีที่มานาสงสัยชุดหนึ่งพิสูจนวาเดนมารกเปนสวนหนึ่งของราชอาณาจักรนอรเวยโดยชอบธรรม ไมใชของเดนมารก\n\nพวกเขายังบอกเปนนัยวาจะยึดดวยกําลังหากเราปฏิเสธ โดยอางวาเปนไปเพื่อความปลอดภัยของเราเอง"
 AAT_norway.17.a: "เราไมมีทางเลือก"
 AAT_norway.17.b: "ไรสาระสิ้นดี!"

 GetNorwegianClaims_iceland: "ไอซแลนด โดยยืนกรานวาราชบัลลังกเดนมารกยึดไวอยางไมถูกตองเมื่อราชวงศนอรเวยปจจุบันกอตั้งขึ้น"
 GetNorwegianClaims_greenland: "กรีนแลนด หรือที่พวกเขาเรียกวาเอริก เราเดสลันด ตามที่พวกเขาอาง ดินแดนนี้ควรถูกมอบใหพวกเขาเมื่อพระเจาฮากอนขึ้นเปนกษัตริยแหงนอรเวย"
 GetNorwegianClaims_faroes: "หมูเกาะแฟโร ซึ่งพวกเขาถือวาเปนสวนหนึ่งของพระอิสริยยศแหงราชบัลลังกของตน"
 GetNorwegianClaims_sweden: "รัฐบูฮุสเลน ดาลารนา และเยมตลันด ซึ่งพวกเขาอางวาราชบัลลังกสวีเดนขโมยไป"
 GetNorwegianClaims_bjarmeland: "ดินแดนรอบทะเลขาวที่พวกเขาอางวาบรรพบุรุษไวกิงของพวกเขายึดครองเปนกลุมแรก และพวกเขาเรียกมันวาบยารเมลันด"
 GetNorwegianClaims_ireland: "เคานตีเลนสเตอร ซึ่งพวกเขาอางวาบรรพบุรุษไวกิงของพวกเขาตั้งอาณานิคมเปนกลุมแรก"
 GetNorwegianClaims_scotland: "หมูเกาะเชตแลนดและที่ราบสูงสกอตแลนด ซึ่งพวกเขาอางวาเปนของพวกเขาโดยอาศัยการพิชิตของบรรพบุรุษไวกิง"
 GetNorwegianClaims_vinland: "วินแลนด ซึ่งเรารูจักในชื่อนิวฟนดแลนดและแลบราดอร โดยยืนกรานวาการที่บรรพบุรุษไวกิงของพวกเขาคนพบกอนทําใหพวกเขามีสิทธิ์เปนเจาของ"
 GetNorwegianClaims_denmark: "อันที่จริงคือเดนมารกทั้งประเทศ นับเปนขอเรียกรองที่อาจหาญจริง ๆ"
 AAT_norway.18.t: "[FROM.GetName] ยอมรับขอเรียกรองของเราแลว"
 AAT_norway.18.desc_monarchist: "เราประสบความสําเร็จในการแสดงใหรัฐ[FROM.GetAdjective]เห็นวาการอางสิทธิ์ของเราชอบธรรม ดังนั้นพวกเขาจึงตกลงยกดินแดนที่เราอางสิทธิ์ใหแกราชบัลลังกของเรา"
 AAT_norway.18.desc_fascist: "รัฐบาล[FROM.GetAdjective]ที่ออนแอไดหวั่นเกรง และจะยอมใหเราเขาครอบครองดินแดนที่เปนของเราไมวาจะโดยกําลังหรือโดยสิทธิ์"
 AAT_norway.18.a: "ยินดีตอนรับกลับสูออมอก"
 AAT_norway.19.t: "[FROM.GetName] ปฏิเสธขอเรียกรองของเรา!"
 AAT_norway.19.desc_monarchist: "เกียรติภูมิของราชบัลลังกเราไดรับความเสียหายอยางหนัก เมื่อ [FROM.GetName] ปฏิเสธการอางสิทธิ์ในดินแดนอันชอบธรรมของเรา นี่เทากับเปนการดูหมิ่นราชบัลลังก[ROOT.GetAdjective] และจะไมไดรับการอดทนอดกลั้น"
 AAT_norway.19.desc_fascist: "เห็นไดชัดวารัฐ[FROM.GetAdjective]ไมรูเลยวากําลังปฏิเสธใคร เราจะไมนิ่งเฉยขณะที่ดินแดนอันชอบธรรมของเราถูกพวกเขายึดครอง ทางเลือกเดียวของเราตอนนี้คือยึดคืนดวยกําลัง"
 AAT_norway.19.a: "พวกเขาจะตองชดใชความอวดดี"
  
 AAT_norway.20.t: "สมเด็จพระราชินีของเราสวรรคตแลว!"
 AAT_norway.20.desc: "ระหวางเสด็จเยือนพระราชวงศในอังกฤษ พระองคไดสวรรคตอยางนาเศราดวยภาวะหัวใจลมเหลวขณะบรรทม\n\nเดิมทรงดํารงพระอิสริยยศเจาหญิงม็อดแหงเวลส สมเด็จพระราชินีแหงนอรเวยไมเพียงทิ้งพระเจาฮากอนและเจาชายโอลาฟ-ซึ่งกําลังเสด็จไปอังกฤษ-ไวเบื้องหลัง แตยังทิ้งชาวนอรเวยทุกคนไวดวย เพราะพระองคทรงเปนที่รักทั่วทั้งราชอาณาจักร"

 AAT_norway_news.1.desc: "หลังจากหลายปแหงการลี้ภัยอันทรหด นักปฏิวัติผูมีชื่อเสียง เลออน ทรอตสกี ไดเดินทางจาก [NOR.GetNonIdeologyName] มาถึง [MEX.GetNonIdeologyName] แลว เขาไดรับการตอนรับจากจิตรกรชื่อดังฟรีดา คาหโลและสามีของเธอ ดิเอโก ริเบรา ซึ่งจะใหเขาพักที่บานในเม็กซิโกซิตี และคงเขากันไดดีกับทรอตสกีและภรรยาอยางแนนอน\n\nที่สําคัญกวานั้น เขาจะอยูหางไกลจากอันตรายใด ๆ ที่เกิดจากศัตรูใน [SOV.GetNameDef] และอาจไดใชชีวิตลี้ภัยอยางสงบในชาติละตินอเมริกาแหงนี้" 
 AAT_norway_news.1.a: "นาสนใจ..."
 AAT_norway_news.1.sov: "ตองจัดการกับเขา!"

 AAT_norway_news.2.t: "สมเด็จพระราชินีม็อดแหงนอรเวยสวรรคตแลว"
 AAT_norway_news.2.desc: "ระหวางเสด็จเยือนอังกฤษเพื่อพบพระราชวงศและพระเชษฐา สมเด็จพระเจาจอรจที่ 5 แหงสหราชอาณาจักร สมเด็จพระราชินีแหงนอรเวย ซึ่งกอนหนานั้นทรงเปนเจาหญิงแหงเวลส ไดสวรรคตดวยภาวะหัวใจลมเหลวขณะบรรทม เชื่อกันวาสาเหตุคือภาวะแทรกซอนหลังการผาตัดชองทองเมื่อตนสัปดาหนี้\n\nพระองคทรงเปนที่รักในนอรเวย และยอมเปนที่คิดถึงของพระราชโอรส เจาชายโอลาฟ และพระราชสวามี พระเจาฮากอนที่ 7 แหงนอรเวยอยางแนนอน"
 AAT_norway_news.2.a: "ความสูญเสียของพวกเราทุกคน"
 AAT_norway_news.2.b: "เชื้อพระวงศที่ตองจัดการลดลงไปหนึ่งองค!"

 AAT_norway_news.3.t: "สมเด็จพระราชาธิบดีฮากอนที่ 7 แหงนอรเวยสวรรคตแลว"
 AAT_norway_news.3.desc: "หลังการผาตัดที่ดูเหมือนจะสําเร็จดวยดีจากอุบัติเหตุขณะเลนสกี สมเด็จพระราชาธิบดีฮากอนที่ 7 แหงนอรเวยอันเปนที่รักไดสวรรคตจากภาวะแทรกซอนทางการแพทย\n\nบัดนี้นอรเวยกําลังเผชิญชวงเวลาที่มืดมนที่สุดชวงหนึ่งในประวัติศาสตร หวังวาเจาชายโอลาฟจะเสด็จขึ้นครองราชยโดยเร็วที่สุดเพื่อนําพาประเทศสูฝงที่ปลอดภัย" 


 AAT_norway_news.99.t: "พระเจาวอยเทกนํายานไมเอนเขาสูออมอกของพระองค"
 AAT_norway_news.99.desc: "แมจะถูกคนสวนใหญในโลกมองขาม แตพระเจาวอยเทก ผูแบกปนใหญและราชบัลลังก ไดเล็งเห็นศักยภาพของเกาะอารกติกแหงนี้ \n\nดวยความชวยเหลือของหมีขั้วโลกทั้งทองถิ่นและที่เพิ่งยายเขามา ยานไมเอนกําลังถูกเติมประชากรและเปลี่ยนแปลงเปนชาติอยางแทจริงที่พรอมรับมือทุกความทาทาย นับเปนภาพที่ไมเคยเห็นมาตั้งแตยุควิกตอเรีย\n\nในบรรดาพลเมือง มีบุคคลหนึ่งที่โดดเดนและเปนที่ถกเถียง ผูซึ่งชื่อเดิมไมสําคัญอีกตอไป แตนับจากนี้จะเปนที่รูจักในนามจอมพลเรือโยฮัน มาเยน" 
AAT_norway_news.99.a: "เรื่องนี้ชักจะเลยเถิดแลว!" 

 AAT_norway_rikstanken.1.t: "โครงการรถถัง[ROOT.GetAdjective]"
 AAT_norway_rikstanken.1.desc: "รถถังไมเคยเปนสวนหนึ่งของคลังอาวุธ[ROOT.GetAdjective]มากอน และแมอาจสายเกินไปที่เราจะไลตามไดดวยตนเอง แตนั่นไมไดหมายความวาเราควรละทิ้งมันไปโดยสิ้นเชิง\n\nขั้นแรกคือการหาหุนสวนที่เหมาะสม เพื่อจัดซื้อหรือรวมพัฒนากองกําลังยานเกราะของเรา คําตอบที่ชัดเจนคือหนึ่งในมหาอํานาจทางทหารของยุโรป แตบางทีการหาผูจัดหาที่อยูใกลบานกวาอาจมีประโยชนในระยะยาว"
 AAT_norway_rikstanken.1.a: "เพื่อนบานของเรา [?NOR_nordic_tank_seller.GetName]"
 AAT_norway_rikstanken.1.b: "[?NOR_communist_tank_seller.GetName] มีศักยภาพอยางแนนอน"
 AAT_norway_rikstanken.1.c: "รถถัง[?NOR_fascist_tank_seller.GetAdjective]นาสนใจ"

 AAT_norway_rikstanken.2.t: "แนวทางของเราสําหรับโครงการยานเกราะ[NOR.GetAdjective]"
 AAT_norway_rikstanken.2.desc_NORDIC: "[?NOR_nordic_tank_seller.GetName] เพื่อนบานและประเทศนอรดิกดวยกัน มีอุตสาหกรรมทหารที่พัฒนาแลวซึ่งเราสามารถใชจัดหาใหกองกําลังยานเกราะของเราได แตจะมีคาใชจายสูงมากสําหรับชาติเล็ก ๆ อยางเรา\n\nเรายังมีทางเลือกที่จะซื้อรถถังเพียงคันเดียวแลวดูวาจะไปตออยางไร"
 AAT_norway_rikstanken.2.desc_SOV: "[?NOR_communist_tank_seller.GetName] ไดยึดปจจัยการผลิตแลว ซึ่งหมายความวาพวกเขามีกําลังผลิตรถถังไดในปริมาณมาก ซึ่งจะชวยใหเราไลตามศัตรูไดทัน\n\nเรายังสามารถใชโอกาสนี้แสดงใหกรรมกรในชาติของเราเห็นวารัฐคอมมิวนิสตทําอะไรไดบาง และเพิ่มการสนับสนุนลัทธิคอมมิวนิสตใน [ROOT.GetName]"
 AAT_norway_rikstanken.2.desc_GER: "พลังของรถถังแพนเซอร[?NOR_fascist_tank_seller.GetAdjective]เปนที่ปฏิเสธไมได และพลังทางอุตสาหกรรมของพวกเขาจะชวยใหเราสรางกองกําลังรถถังที่ทัดเทียมเปาหมายใดก็ได เรายังสามารถรวมมือกับพวกเขาพัฒนารถถังของเราเอง และชวยวิศวกรของพวกเขาในทุกทางที่ทําได\n\nแนนอนวาพวกเขาจะคาดหวังใหเราเขาขางพวกเขาทางอุดมการณ ไมวาเราจะเลือกแนวทางใดก็ตาม"
 AAT_norway_rikstanken.2.a: "เราจะลองเชิงดวยรถถังคันเดียว"
 AAT_norway_rikstanken.2.b: "เราตองการจํานวนเพื่อแขงขัน"
 AAT_norway_rikstanken.2.c: "สนธิสัญญาการคาจะทําใหประเทศของเราใกลชิดกันทางอุดมการณมากขึ้น"
 AAT_norway_rikstanken.2.d: "ขอความชวยเหลือในการพัฒนารถถังของเราเอง"

 AAT_norway_rikstanken.3.t: "[FROM.GetName] ตองการซื้อรถถัง[ROOT.GetAdjective]"
 AAT_norway_rikstanken.3.desc: "รัฐบาล[FROM.GetName]ไดติดตอเราเพื่อขออนุญาตซื้อรถถัง โดยมีขอแมวาดวยเหตุผลดานงบประมาณ พวกเขาซื้อไดเพียงรถถังเบาคันเดียว... แบบไมมีปอมปน\n\nเปนคําขอที่แปลกพอจะนาสงสัย แตพวกเขาอางวาตองการทดลองใชกอนจะเลือกวาจะสรางกองกําลังยานเกราะอยางไร"
 AAT_norway_rikstanken.3.a: "รถถังคันเดียวไมเสียหายอะไร"
 AAT_norway_rikstanken.3.b: "ไมคุมเวลาของเรา"

 AAT_norway_rikstanken.4.t: "[FROM.GetName] ตองการซื้อรถถังของเรา"
 AAT_norway_rikstanken.4.desc: "รัฐบาล[FROM.GetAdjective]ตองการซื้อรถถังของเราเพื่อกาวแรกสูสงครามยานเกราะ\n\nสิ่งนี้จะดีตอเศรษฐกิจและอุตสาหกรรมอาวุธของเรา แตเราตองคํานึงถึงคลังรถถังของเราเองกอน และพิจารณาวาเราไวใจใหพวกเขามีกองกําลังยานเกราะไดหรือไม"
 AAT_norway_rikstanken.4.a: "จัดทําขอตกลงการคากันเถอะ"
 AAT_norway_rikstanken.4.b: "เราตองการรถถังเหลานี้"

 AAT_norway_rikstanken.5.t: "[FROM.GetName] แสวงหาความสัมพันธที่ใกลชิดขึ้นและรถถัง"
 AAT_norway_rikstanken.5.desc_SOV: "รัฐบาล[FROM.GetAdjective]ไดติดตอเราเพื่อขอซื้อรถถังเบาจํานวนมาก และพวกเขาไมเพียงตองการขอตกลงการคา แตยังตองการความสัมพันธที่ใกลชิดขึ้นระหวางประชาชนของทั้งสองชาติ\n\nนี่เปนโอกาสที่เราจะแสดงใหประชาชนของ [FROM.GetName] เห็นวาจะบรรลุสิ่งใดไดเมื่อยึดปจจัยการผลิต และจะนําไปสูความรวมมือที่ใกลชิดยิ่งขึ้นในอนาคต"
 AAT_norway_rikstanken.5.desc_GER: "ผูแทนจากฝายบริหาร[FROM.GetAdjective]ตองการซื้อรถถังเบาอันเหนือชั้นของเราจํานวนมาก\n\nนอกจากนี้ พวกเขายังแสดงความสนใจในหลักการทางอุดมการณของเรา และตองการแสดงใหประชาชนเห็นวา[ROOT.GetRulingIdeologyNoun]ที่สมบูรณแบบเปนอยางไร เพื่อเผยแพรในประเทศของพวกเขา"
 AAT_norway_rikstanken.5.a: "เรายินดีรับความสนใจของพวกเขา"
 AAT_norway_rikstanken.5.b: "ไมคุมเวลาของเรา"

 AAT_norway_rikstanken.6.t: "[FROM.GetName] ตองการรวมมือวิจัยรถถัง"
 AAT_norway_rikstanken.6.desc: "รัฐบาล[FROM.GetAdjective]กําลังมองหาทางพัฒนาโครงการรถถังของตนเอง และหันมาขอความชวยเหลือจากเรา พวกเขาอางวาไมเพียงพวกเขาจะไดความรูทางเทคโนโลยีและอุดมการณ แตโครงการรถถังของเราเองก็จะไดประโยชนจากขอตกลงนี้ดวย"
 AAT_norway_rikstanken.6.a: "รถถังของพวกเขาจะไมมีใครหยุดยั้งได"
 AAT_norway_rikstanken.6.b: "เราไมตองการสิ่งนี้"

 AAT_norway_rikstanken.7.t: "ยินดีตอนรับรถถังประจําชาติคันใหมของเรา"
 AAT_norway_rikstanken.7.desc: "[FROM.GetName] เพื่อนบานของเรา ไดยอมรับการขายรถถังคันแรกของ [ROOT.GetName] แลว แนนอนวามันมีเกราะไมมากนัก หรือไมมีแมแตปอมปน แตดวยการปรับปรุงอีกเล็กนอย นี่อาจเปนจุดเริ่มตนของกองกําลังรถถัง[ROOT.GetAdjective]"
 AAT_norway_rikstanken.7.a: "ความคิดที่ดีที่สุดของราชอาณาจักร!" 

 AAT_norway_rikstanken.8.t: "[FROM.GetNameDefCap] จะจัดหารถถังใหเรา"
 AAT_norway_rikstanken.8.desc: "รัฐบาล[FROM.GetAdjective]ไดยอมรับขอตกลงขายรถถังจํานวนมากใหชาติของเรา สิ่งนี้จะชวยใหกองทัพของเราแขงขันกับมหาอํานาจไดอยางแทจริง"
 AAT_norway_rikstanken.8.a: "ในที่สุด!"

 AAT_norway_rikstanken.9.t: "ชาติ[ROOT.GetAdjective]และ[FROM.GetAdjective]ใกลชิดกันมากขึ้นดวยรถถัง"
 AAT_norway_rikstanken.9.desc: "ผูนํา[FROM.GetAdjective]ตกลงขายรถถังใหเรา และพรอมกันนั้นก็มีสนธิสัญญาอยางเปนทางการที่จะทําให [ROOT.GetName] สอดคลองกับ[FROM.GetRulingIdeologyNoun]แบบ[FROM.GetAdjective]มากขึ้น และใกลชิดกันยิ่งขึ้น"
 AAT_norway_rikstanken.9.a: "บัดนี้[FROM.GetRulingIdeologyNoun]จะมีชัย"

 AAT_norway_rikstanken.10.t: "[FROM.GetNameDefCap] ยอมรับขอตกลงการวิจัยแลว"
 AAT_norway_rikstanken.10.desc: "ทูต[FROM.GetAdjective]ยืนยันวาพวกเขายินดีชวยเราพัฒนารถถังของเราเอง ตราบใดที่ประเทศของเรายังคงเดินแนวทางอุดมการณเดียวกัน แนนอน เรามั่นใจวาพวกเขาจะไดประโยชนจากแนวทางใหมในการพัฒนารถถังที่ความรวมมือของเราจะนํามาดวย"
 AAT_norway_rikstanken.10.a: "ในที่สุด รถถังนอรเวย!"

 AAT_norway_rikstanken.11.t: "สิ่งที่เราเรียนรูไดจากริกสทังเคน"
 AAT_norway_rikstanken.11.desc: "ราชอาณาจักรของเรามีรถถังมาสักพักแลว ซึ่งไดรับฉายาดวยความเอ็นดูวาริกสทังเคน หรือรถถังของชาติ เราไดเห็นวามันทํางานอยางไรและเราทําอะไรกับมันไดบาง บางทีเราอาจกาวไปอีกขั้นโดยลองแยกชิ้นสวนรถถัง เพื่อที่ในที่สุดจะไดออกแบบและผลิตของเราเอง อยางไรเสีย รถถังคันเดียวก็ไมไดใหความไดเปรียบในการรบมากนัก"
 AAT_norway_rikstanken.11.a: "รถถังเพิ่มอีก!"
 AAT_norway_rikstanken.11.b: "เราไมตองการรถถัง"

 AAT_norway_rikstanken.12.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 AAT_norway_rikstanken.12.desc: "แมเราจะกระตือรือรนที่จะเริ่มโครงการรถถัง[ROOT.GetAdjective]ดวยความชวยเหลือของ [FROM.GetNonIdeologyName] แตพวกเขากลับปฏิเสธคําขอของเรา นี่จะเปนการบั่นทอนความหวังที่จะปรับปรุงกองทัพของเราใหทันสมัย"
 AAT_norway_rikstanken.12.a: "เราจะหาทางอื่น"

 AAT_rikstanken_program_tech_bonus: "โครงการรถถังนอรเวย"


 AAT_norway_allied.1.t: "[FROM.GetName] กําลังแสวงหาการลงทุน" 
 AAT_norway_allied.1.desc: "รัฐบาล[NOR.GetAdjective]กําลังมองหาทางพัฒนาอุตสาหกรรมดวยความชวยเหลือของเรา นี่จะเปนโอกาสอันดีในการทํากําไร และพัฒนาใหพวกเขาเปนพันธมิตรที่เปนไปไดในอนาคต หากสงครามปะทุขึ้นแนนอน" 
 AAT_norway_allied.1.a: "ชวยพันธมิตรในอนาคตไมเสียหายอะไร" 
 AAT_norway_allied.1.b: "อาจเปนอันตราย" 

 AAT_norway_allied.2.t: "[FROM.GetNameDefCap] จะลงทุนในการพัฒนาของเรา"
 AAT_norway_allied.2.desc: "การทาบทามรัฐบาล[FROM.GetAdjective]ของเราประสบความสําเร็จ และพวกเขาตกลงจะลงทุนในเศรษฐกิจของเรา ซึ่งยังหมายความวาเราจะใกลชิดกับพวกเขามากขึ้น และบางทีอาจนับพวกเขาเปนพันธมิตรในอนาคต"
 AAT_norway_allied.2.a: "นี่คือความกาวหนา"

 AAT_norway_allied.3.t: "[FROM.GetName] จะไมลงทุนในเศรษฐกิจของเรา"
 AAT_norway_allied.3.desc: "แมเราจะพยายามแลว ฝายบริหาร[FROM.GetAdjective]จะไมชวยเราพัฒนากําลังการผลิตทางอุตสาหกรรมที่จําเปนตอการปองกันตนเองหากเกิดสงคราม\n\nเราควรจดจําเรื่องนี้ไว" 
 AAT_norway_allied.3.a: "เราตองมองหาที่อื่น"
  
 AAT_norway_allied.4.t: "ผูมาแทนเลาเกอ"
 AAT_norway_allied.4.desc: "คริสเตียน เลาเกอรับราชการในกองทัพ[NOR.GetAdjective]มายาวนาน และไดรับแตงตั้งเปนผูบัญชาการทหารสูงสุดเมื่อเกือบทศวรรษกอนในยามสงบ หลายปกอนที่ภัยตอประเทศของเราจะเห็นไดชัด\n\nเนื่องจากเราสูญสิ้นความเชื่อมั่นในความสามารถของเขาหากตองนําทัพในยามสงคราม เขาจึงตองถูกแทนที่ คําถามคือ ใครจะนํากองกําลังของ [NOR.GetName] ไปสูชัยชนะ?"
 AAT_norway_allied.4.a: "[NOR.NOR_carl_gustav_fleischer.GetName] จะเปนตัวเลือกที่กลาหาญ"
 AAT_norway_allied.4.b: "[NOR.NOR_wilhelm_von_tangen_hansteen.GetName] มีศักยภาพ"
 AAT_norway_allied.4.c: "[NOR.NOR_otto_ruge.GetName] คือตัวเลือกที่ปลอดภัย"


 AAT_norway_fascist.1.t: "พรรคนาสโยนัล ซัมลิงของ [FROM.GetName] ตองการใหเรารุกรานประเทศของพวกเขา!"
 AAT_norway_fascist.1.desc: "แนวรวมของพวกชาตินิยมและฟาสซิสต[FROM.GetAdjective]ที่เขาขางอุดมการณของเรากําลังเสนอความชวยเหลือในการพิชิต [NOR.GetName] พวกเขาไดวางรากฐานสําหรับการยึดรัฐบาลและบริหารดินแดน[FROM.GetAdjective]แทนเรา\n\nหากเปนความจริง นี่อาจเปนโอกาสที่ดีเกินกวาจะปลอยผาน แตเราควรมั่นใจวาเราพรอมจะโจมตี"
 AAT_norway_fascist.1.a: "[FROM.GetName] จะเขารวมกับเรา!"
 AAT_norway_fascist.1.b: "เราจะไมแบงปนอํานาจกับคนทองถิ่น"
  
 AAT_norway_fascist.2.t: "[FROM.GetNameDefCap] ปฏิเสธเรา!"
 AAT_norway_fascist.2.desc: "แมเราจะเสนออยางใจกวาง แตฝาย[FROM.GetAdjective]แจงวาหากพวกเขาจะรุกราน [ROOT.GetName] พวกเขาก็ไมตองการหรือไมอยากไดความชวยเหลือของเรา ดูเหมือนวาเราตองพึ่งตนเองในภารกิจยึดอํานาจควบคุมรัฐบาล [ROOT.GetNameDef]"
 AAT_norway_fascist.2.a: "พวกเขาจะตองเสียใจ!"

 AAT_norway_fascist.3.t: "[FROM.GetNameDefCap] จะชวยเรา!"
 AAT_norway_fascist.3.desc: "ผูแทนจากพรรคฟาสซิสต[FROM.GetAdjective]ไดติดตอมาและรับรองวา [FROM.GetNameDef] จะใหการสนับสนุนที่เราตองการในการยึดอํานาจควบคุมรัฐบาล\n\nสิ่งนี้อาจทําใหเราออกมาจากเงามืดและยึดอํานาจใน [ROOT.GetName] ได"
 AAT_norway_fascist.3.a: "ถึงเวลาแลว!"
 AAT_norway_fascist.5.a: "$AAT_norway_fascist.3.a$"


 AAT_norway_fascist.4.t: "สหาย[NOR.GetAdjective]ของเรารองขอการสนับสนุน"
 AAT_norway_fascist.4.desc: "ผูแทนลัทธิฟาสซิสตใน [NOR.GetName] เลาใหเราฟงถึงการตอสูอยางยากลําบากในการสรางฐานสนับสนุนและยึดอํานาจควบคุมรัฐ[NOR.GetAdjective] แมรัฐบาลของพวกเขาจะออนแอและเงอะงะเพียงใด\n\nเห็นไดชัดวาพวกเขาตองการความชวยเหลือจากเราในการกระชับการกุมกลไกอํานาจในชาติที่อาจเปนพันธมิตรที่มีประโยชนในอนาคต"
 AAT_norway_fascist.4.a: "เราจะชวยเหลือเพื่อนฟาสซิสตของเรา"
 AAT_norway_fascist.4.b: "เราไมไดอะไรจากเรื่องนี้"
  
 AAT_norway_fascist.6.t: "[FROM.GetNameDefCap] ปฏิเสธแลว!"
 AAT_norway_fascist.6.desc: "ผูแทนจากพรรคฟาสซิสต[FROM.GetAdjective]นําขาวรายมาแจง [FROM.GetNameDefCap] ปฏิเสธคําวิงวอนขอความชวยเหลือของเรา\n\nนี่หมายความวาเราตองพึ่งตนเองในการแสวงหาระบอบฟาสซิสตที่เราควบคุมใน [ROOT.GetNonIdeologyName]"
 AAT_norway_fascist.6.a: "เราจะหาทางจนได!"

 AAT_norway_communist.1.t: "[FROM.GetName] ตองการฟนการคาโปมอร!"
 AAT_norway_communist.1.desc: "หลายศตวรรษกอนที่เราจะปฏิวัติสําเร็จ ชาวโปมอรแหงรัสเซียตอนเหนือไดขามทะเลแบเรนตสมาทําการคาสําคัญกับสหาย[NOR.GetAdjective]ทางตอนเหนือของประเทศ\nบัดนี้พวกเขาเสนอใหเราฟนธรรมเนียมอันยาวนานนี้ ซึ่งยอมเปนประโยชนรวมกันอยางแนนอน และนําชาติคอมมิวนิสตของเราใหใกลชิดกันมากขึ้น"
 AAT_norway_communist.1.a: "ทะเลแบเรนตสจะคึกคักไปดวยการเดินเรือ!"
 AAT_norway_communist.1.b: "การคาเปนแนวคิดของพวกกระฎมพี!"  
  
 AAT_norway_communist.2.t: "การคาโปมอรยุคใหม"
 AAT_norway_communist.2.desc: "เชนเดียวกับบรรพบุรุษของพวกเขา สหายของเราใน [FROM.GetNameDef] กระตือรือรนที่จะคาขายกับเราผานชายฝงเหนือสุดของเรา นี่จะเปนขอตกลงที่เปนประโยชนรวมกัน ซึ่งจะแสดงใหกรรมกรของทั้งสองชาติเห็นถึงประโยชนของมิตรภาพแบบสหายคอมมิวนิสต"
 AAT_norway_communist.2.a: "เดินหนา!"

 AAT_norway_communist.3.t: "[FROM.GetName] ปฏิเสธขอเสนอการคาของเรา"
 AAT_norway_communist.3.desc: "แมเราจะมีประวัติศาสตรการคาขามทะเลแบเรนตสรวมกัน แต [FROM.GetNameDef] ไมคิดวามันคุมคาที่จะฟนฟู เราควรลองชองทางอื่นในการพัฒนาชายฝงเหนือสุดของเรา"
 AAT_norway_communist.3.a: "เอาเถอะ..."

 AAT_norway_communist.4.t: "[FROM.GetName] ตองการใหเราชวยพัฒนาอุตสาหกรรมทหารของพวกเขา"
 AAT_norway_communist.4.desc: "สหายของเราใน [FROM.GetName] ตองการความชวยเหลือจากเรา เมื่อการปฏิวัติของพวกเขาทําใหพวกเขาใกลชิดกับเรามากขึ้น ก็สมเหตุสมผลที่เราจะสนับสนุนความพยายามในการปรับปรุงกองทัพของพวกเขาใหทันสมัย\n\nการที่เราถูกมองวาสนับสนุนชาติคอมมิวนิสตดวยกันจะเปนชัยชนะทางการเมือง และแสดงใหกรรมกรของพวกเขาเห็นวา [ROOT.GetNameDef] ทําอยางไร"
 AAT_norway_communist.4.a: "อาวุธของพวกเขาจะตอสูกับศัตรูของเรา!"
 AAT_norway_communist.4.b: "เราไมอาจเสี่ยงใหพวกเขาใชอาวุธนั้นกับเรา"

 AAT_norway_communist.5.t: "[FROM.GetNameDefCap] ยอมรับแลว!"
 AAT_norway_communist.5.desc: "สหายของเรายอมรับคําขอความชวยเหลืออันถอมตนของเรา และบัดนี้พวกเขาจะชวยใหอุตสาหกรรมทหารของเราขยายตัวเพื่อตอบสนองความตองการในการปกปองการปฏิวัติของเรา"
 AAT_norway_communist.5.a: "เราจะใชอาวุธเหลานี้สูกับศัตรูรวมของเรา!"

 AAT_norway_communist.6.t: "[FROM.GetNameDefCap] ปฏิเสธคําวิงวอนขอการสนับสนุนของเรา!"
 AAT_norway_communist.6.desc: "ดูเหมือนวาเราประเมินความไววางใจที่พวกเขามีตอเราสูงเกินไปมาก [FROM.GetName] ดูไมเต็มใจจะชวยเราเพิ่มการผลิตทางทหาร"
 AAT_norway_communist.6.a: "พวกขี้ขลาด!"

 AAT_norway_communist.7.t: "การลมสลายของราชวงศนอรเวย"
 AAT_norway_communist.7.desc: "วันเวลาที่สถาบันกษัตริย[NOR.GetAdjective]เปนหนึ่งในราชวงศที่เปนที่รักที่สุดในทวีปไดผานพนไปนานแลว แมการที่พระเจาฮากอนทรงยืนกรานจะขึ้นครองราชยก็ตอเมื่อผานการลงประชามติ และความมุงมั่นที่จะไมแทรกแซงการเมืองของพระองคจะเปนสิ่งที่สูงสง แตสถาบันกษัตริยก็คือสถาบันกษัตริย และไมมีที่ยืนในสังคมแหงความเทาเทียมที่เราหวังจะสรางขึ้นใน [ROOT.GetNonIdeologyName] \n\nพระเจาฮากอนที่ 7 และเจาชายโอลาฟ พรอมดวยพระราชวงศที่เหลือถูกจับกุมและสงตัวออกไปอยางสันติ ทรัพยสินที่ถูกยึดจะนําไปใชในการกอสรางโครงการคอมมิวนิสตของเรา\n\n[NOR_GetExiledMonarchyLastParagraph]"
 NOR_exiled_monarchy_to_desc_DEN: "พระองคทรงกลับไปใชพระนามเดิมแบบเดนมารกวาเจาชายคารล และจะไดรับการตอนรับใน [DEN.GetName] โดยพระเชษฐา พระเจาเฟรเดอริก ซึ่งพระองคจะทรงทําหนาที่ใดก็ตามที่ราชวงศมีในสังคมเดนมารก"
 NOR_exiled_monarchy_to_desc_ENG: "เนื่องจากการเสด็จกลับสูมาตุภูมิ [DEN.GetName] ไมใชทางเลือก อดีตกษัตริยฮากอนและครอบครัวจึงจําตองยอมรับการลี้ภัยใน [ENG.GetName] ดินแดนที่ครั้งหนึ่งเคยเปนที่จัดพิธีอภิเษกสมรสของเจาชายคารลแหงเดนมารกกับเจาหญิงม็อดแหงเวลส ตัวตนในอดีตของอดีตคูกษัตริยและราชินี"
 NOR_exiled_monarchy_to_desc_SWE: "เมื่อไมสามารถเสด็จกลับสูมาตุภูมิของพระเจาฮากอนหรือพระราชินีม็อดได อดีตพระราชวงศจึงจําตองลี้ภัยไปยังราชอาณาจักรเพื่อนบานที่เห็นอกเห็นใจ ความยอนแยงที่ราชบัลลังกนอรเวยตองพึ่งพาราชวงศสวีเดนในเวลาไมนานหลังไดรับเอกราชนั้นไมไดรอดพนสายตาของชาวโลกเลย"
 NOR_exiled_monarchy_to_desc_NONE: "โลกในวันนี้แตกตางจากเมื่อป 1905 อยางสิ้นเชิง ราชวงศนอรเวยที่เพิ่งกอตั้งไดไมนานพบวาตนไมมีประเทศใหปกครองอีกตอไป และไมมีจุดหมายที่ชัดเจนสําหรับการลี้ภัย ระบอบกษัตริยในโลกกําลังจะถึงกาลอวสานในอีกไมชา"
 AAT_norway_communist.7.a: "ไปเสียไดก็ดี!"
  
 AAT_norway_communist.8.t: "ราชวงศนอรเวยเสด็จมาถึง"
 AAT_norway_communist.8.desc_DEN: "หลังจากเสด็จไปสถาปนาราชวงศของพระองคเองในนอรเวย เจาชายคารลของเรา หรือพระเจาฮากอนที่ 7 ตามพระนามที่ใชมานานหลายป ไดเสด็จกลับมายัง [ROOT.GetName] แลว\n\nพระองคถูกโคนลมและเนรเทศอยางกะทันหันหลังการปฏิวัติคอมมิวนิสตอันโหดราย และบัดนี้ตองทรงยอมรับชีวิตผูลี้ภัยในประเทศของเราพรอมกับพระราชวงศ"
 AAT_norway_communist.8.desc_ENG: "ราชวงศนอรเวยมีความสัมพันธใกลชิดกับราชวงศของเรามาหลายป โดยสมเด็จพระราชินีนาถวิกตอเรียทรงเปนเจาภาพในพิธีอภิเษกสมรสระหวางพระราชนัดดาของพระองค คือเจาหญิงมอด กับพระเจาฮากอนที่ 7 ในอนาคต ซึ่งขณะนั้นคือเจาชายคารลแหงเดนมารก\n\nนาเสียดายที่การปฏิวัติไดโคนลมพวกเขา และเมื่อเดนมารกไมใชทางเลือกอีกตอไป พวกเขาจึงจําตองขอลี้ภัยที่นี่ใน [ROOT.GetName]"
 AAT_norway_communist.8.desc_SWE: "ราชวงศนอรเวยถูกเนรเทศ และเนื่องจากการลี้ภัยไปอยูกับพระญาติในเดนมารกและสหราชอาณาจักรเปนไปไมไดในขณะนี้ พวกเขาจึงเลือกละทิ้งศักดิ์ศรีและขอพํานักกับเรา\n\nแมจะไมมีความเกี่ยวพันทางเครือญาติ แตเปนหนาที่ของเราที่จะปกปองราชวงศสแกนดิเนเวียดวยกันไมใหสูญสิ้น"  
 AAT_norway_communist.8.a: "ยินดีตอนรับพวกเขา!"
 AAT_norway_communist.8.b: "พวกเขาอยูได แตเราไมไดยินดีตอนรับ"

 AAT_norway_monarchist.1.t: "ขอเสนอของสมุหราชมณเฑียร"
 AAT_norway_monarchist.1.desc: "แมพระเจาฮากอนจะทรงยืนกรานใหรักษาความเปนอิสระของสภาสตูรติงและปลอยใหสภาแกไขปญหากันเองภายใน แตสมุหราชมณเฑียรของพระองค เพเดอร อังเคอร เวเดล-ยารลสเบิรก กลับเสนอใหราชบัลลังกนอรเวยเขาแทรกแซงสถานการณที่ไรเสถียรภาพอยางอันตรายนี้\n\nเขาอางถึงภัยคุกคามจากการรุกรานของตางชาติอยางคลุมเครือ และเรียกรองใหประชาชนแหง [ROOT.GetName] แสดงความไววางใจในองคพระมหากษัตริยทั่วทั้งประเทศ พรอมเรียกรองใหเจาเหนือหัวที่พวกเขาถวายสัตยลงมือทําบางสิ่ง\n\nเขาคือผูใกลชิดที่สุดของพระมหากษัตริย และเปนสมาชิกผูมีเสนสายกวางขวางของตระกูลขุนนางที่ทรงอํานาจที่สุดใน [NOR.GetName] ความเคลื่อนไหวครั้งนี้จึงควรไดรับการจับตาอยางระมัดระวัง"
 AAT_norway_monarchist.1.a: "เขามีวาระซอนเรนอะไรกันแน?"

 AAT_norway_monarchist.2.t: "พระมหากษัตริยสวรรคต!"
 AAT_norway_monarchist.2.desc: "สิ่งที่ไมมีใครคาดคิดไดเกิดขึ้นแลว หลังการผาตัดซึ่งดูเหมือนจะสําเร็จดวยดีจากอุบัติเหตุเลนสกี พระเจาฮากอนที่ 7 อันเปนที่รักของเราไดสวรรคตลงจากภาวะแทรกซอนทางการแพทย\n\nบัดนี้ประเทศของเรากําลังเผชิญชวงเวลาที่มืดมนที่สุดชวงหนึ่งในประวัติศาสตร ขอใหเจาชายโอลาฟเสด็จขึ้นครองราชยโดยเร็วที่สุด เพื่อนําพาประเทศของเราสูฝงอันปลอดภัย"
 AAT_norway_monarchist.2.a: "อนาคตจะนําโศกนาฏกรรมใดมาอีก?"
  
 AAT_norway_monarchist.3.t: "การสืบราชสันตติวงศของประเทศเรา"
 AAT_norway_monarchist.3.desc: "ขณะที่ชาติของเราไวทุกขตอการสวรรคตของพระเจาฮากอนที่ 7 อันเปนที่รัก ก็เปนที่ชัดเจนวาเจาชายโอลาฟทรงมุงความสนใจไปที่สนามรบ และถึงแมจะไมเปนเชนนั้น มีรายงานวาพระองคทรงโศกเศราเกินกวาจะทําสิ่งใดนอกจากนําทหารของเราสูชัยชนะ เราจึงไดแตสงสัยวาใครจะนําพา [NOR.GetNameDef] ผานชวงเวลาอันปนปวนนี้ไป อยางนอยเราก็ยังโชคดีที่มีมารกิสยารลสเบิรกคอยประคับประคองอยางมั่นคง"
 AAT_norway_monarchist.3.a: "ยามวิกฤตตองใชมาตรการนอกตํารา"
 AAT_norway_monarchist.3.b: "เราจะสรางความปนปวนไมได"

 AAT_norway_monarchist.4.t: "สมเด็จพระราชินีนาถมาทิลดที่ 1 แหงนอรเวย"
 AAT_norway_monarchist.4.desc: "เราอาจไมมีวันรูวาเกิดอะไรขึ้นหลังประตูที่ปดสนิทในพระราชวัง แตรัฐบาลแหงราชอาณาจักรนอรเวยไดประกาศวาสมเด็จพระราชินีมอด พระราชินีในพระเจาฮากอนผูลวงลับ จะทรงปกครองราชอาณาจักรนับจากนี้ไป โดยใชพระนามวามาทิลดที่ 1 เรื่องนี้ผิดปกติอยางยิ่ง เพราะเจาชายโอลาฟทรงเปนลําดับถัดไปในการสืบราชบัลลังก แตดูเหมือนพระองคจะทรงพอพระทัยกับการจัดการนี้ เพื่อจะไดทุมเทความสนใจใหกับการทําสงครามตอไป อีกทั้งพระนางยังเปนพระราชนัดดาของสมเด็จพระราชินีนาถวิกตอเรีย จึงเทากับเดินตามรอยพระอัยกี และตามกฎการสืบราชสันตติวงศของบานเกิดของพระนางเทานั้น\n\nที่นาสังเกตคือ ไมมีการเอยถึงชื่อของมารกิสเวเด-ยารลสเบิรกในการประกาศตอสาธารณะใด ๆ เลย บทบาทของเขาในระบอบใหมยังไมเปนที่ทราบ เชนเดียวกับที่อยูของเขา"
 AAT_norway_monarchist.4.a: "ทรงพระเจริญ สมเด็จพระราชินีนาถมาทิลด!"

 AAT_norway_monarchist.5.t: "เจตนาของผูสําเร็จราชการ"
 AAT_norway_monarchist.5.desc: "เมื่อผูสําเร็จราชการคนใหมเขารับอํานาจแทนพระมหากษัตริย ก็เกิดคําถามวาแทจริงแลวเขามีเจตนาอยางไรตอชาติ เขาตองการแทนที่พระเจาฮากอนในระยะยาว หรือเพียงตั้งใจชวยเหลือพระองคในการปกครอง? มีเพียงกาลเวลาเทานั้นที่จะบอกไดวาความทะเยอทะยานที่แทจริงของเขาคืออะไร"
 AAT_norway_monarchist.5.a: "ยารลสเบิรกจะนําชาติในฐานะกษัตริยที่แทจริง"
 AAT_norway_monarchist.5.b: "รักษาความสัมพันธอันดีกับเพื่อนบานไวจะดีที่สุด"
 AAT_norway_monarchist.5.c: "เปาหมายสูงสุดคือฟนฟูนอรเวยสูความรุงเรืองในอดีต!"
 illegitimate_norwegian_monarchy: "กษัตริยนอรเวยที่ไมชอบธรรมบนบัลลังก"
 friendly_norwegian_monarchy: "พี่นองชาวนอรดิกของเรา"
 norwegian_imperial_ambitions: "ความทะเยอทะยานเชิงจักรวรรดิของนอรเวย"
 
 Sweden_rearnament.1.t: "งบประมาณกองทัพบก"
 Sweden_rearnament.1.desc: "กองกําลังภาคพื้นดินคือกําลังหลักของกองทัพเรา มีหนาที่ปกปองชายฝง เมือง และพรมแดน\nแตก็สรางภาระทางการเงินตอสังคมอยางมาก ซึ่งสามัญชนอาจรับไมได"
 Sweden_rearnament.1.a: "ปลดอาวุธ"
 Sweden_rearnament.1.b: "งบประมาณตํ่า"
 Sweden_rearnament.1.c: "งบประมาณปานกลาง"
 Sweden_rearnament.1.d: "งบประมาณสูง"
 Sweden_rearnament.2.t: "งบประมาณกองทัพอากาศ"
 Sweden_rearnament.2.desc: "ผูเชี่ยวชาญและนักวิจารณตางกลาววาสงครามในอนาคตจะตอสูกันบนทองฟาไมนอยไปกวาบนบกและในทะเล การทําสงครามรูปแบบใหมนี้ไดรับความสนใจมากขึ้นจากบรรดามหาอํานาจ และยอมมีความสําคัญยิ่งตอการปองกันประเทศในอนาคต\nแมวิธีทําสงครามเชนนี้จะเปนอนาคตอยางแนนอน แตคนงานโรงงานธรรมดาจะเขาใจหรือไมเมื่อขนมปงเริ่มขาดแคลน?"
 Sweden_rearnament.3.t: "งบประมาณกองทัพเรือ"
 Sweden_rearnament.3.desc: "หลายศตวรรษมาแลวที่ประเทศรอบทะเลบอลติกตางแสวงหาการควบคุมทางเขาออกของทะเลแหงนี้ และสวีเดนก็ไมตางกัน ดวยแนวชายฝงยาวตอเนื่องจากทางเหนือสุดไปจนถึงชายฝงตะวันตกที่หันหนาสูมหาสมุทรแอตแลนติกเหนือ\nเราเผชิญภัยคุกคามจากกองเรือแดงในเลนินกราดและครีกสมารีนทางใต\nแมกองทัพเรือที่แข็งแกรงจะสําคัญยิ่งตอการปองกันประเทศ แตตัวเรือเหล็กขนาดใหญที่จําเปนก็มีราคาไมถูก การจัดงบประมาณอยางรอบคอบจึงเปนเรื่องสําคัญ"
 Sweden_rearnament.4.t: "คณะกรรมการการฟนฟูกําลังรบกําลังประชุมอยู"
 Sweden_rearnament.4.desc: "ตามที่ทานไดขอใหแจงเตือนเมื่อคณะกรรมการการฟนฟูกําลังรบประชุมครั้งถัดไป บัดนี้ถึงเวลานั้นแลว และเปนโอกาสของเราที่จะกําหนดนโยบายดานอาวุธยุทโธปกรณสําหรับปหนา\nตองใชความรอบคอบและความคิดที่แจมชัด เพราะสิ่งนี้จะผูกมัดเราไวกับแผนการไปอีกนาน ขณะที่โลกกําลังมุงหนาสูจุดเปลี่ยน"
 Sweden_rearnament.4.desc.a: "แจมชัดจริง ๆ"
 Sweden_rearnament_delta_low: "การเปลี่ยนแปลงที่มีผล: [?folkhemmet_air_part_delta_low_tooltip]"
  Sweden_rearnament_delta_medium: "การเปลี่ยนแปลงที่มีผล: [?folkhemmet_air_part_delta_medium_tooltip]"
  army_budget_event_active: "คณะกรรมการงบประมาณกองทัพบกกําลังดําเนินงาน"
  air_budget_event_active: "คณะกรรมการงบประมาณกองทัพอากาศกําลังดําเนินงาน"
  navy_budget_event_active: "คณะกรรมการงบประมาณกองทัพเรือกําลังดําเนินงาน"

 AAT_Sweden.1.t: "คณะกรรมาธิการของรัฐบาลแนะนําใหฟนฟูกําลังรบ"
 AAT_Sweden.1.desc: "ในป 1930 รัฐไดแตงตั้งคณะกรรมาธิการสอบสวนของรัฐสภาเพื่อใหคําแนะนําเกี่ยวกับงบประมาณกลาโหมของสวีเดนในอนาคต พรรคเกษตรกรรวมกับพรรคสายกลางผลักดันใหเพิ่มงบประมาณ ขณะที่นายกรัฐมนตรีแพร-อัลบิน ฮันสซอน แหงพรรคสังคมประชาธิปไตยคัดคานอยางหนัก โดยกลาววาการกระทําเชนนั้นจะทําลายวิสัยทัศนการปฏิรูปสังคมของเขา\nทามกลางวาทกรรมที่คุกคามมากขึ้นเรื่อย ๆ จากประเทศเพื่อนบาน คณะกรรมาธิการไดยืนขางพรรคฝายขวาอยางแนวแน โดยระบุวา \"การละเลยการปองกันประเทศยอมขัดตอผลประโยชนของรัฐและประชาชน\"\n\nเรื่องนี้กอใหเกิดวิกฤตในรัฐบาล โดยแพร-อัลบิน ฮันสซอน ขูจะลาออกจนกวาเขาจะสรางฐานเสียงใหมั่นคงไดในการเลือกตั้งป 1936 ที่จะมาถึง\nระหวางนี้เราควรแตงตั้งผูนําชั่วคราวจนกวาจะถึงการเลือกตั้ง" 
 AAT_Sweden.1.a: "พรรคเกษตรกรคือทางเลือกที่ดีที่สุด"
 AAT_Sweden.1.c: "พรรคฝายคานฝายขวาอยางไมตองสงสัย"
 AAT_Sweden.1.b: "ไมมีเหตุผลที่แพร-อัลบินจะตองลาออก"
 AAT_Sweden.1.b_tt: "§Rสิ่งนี้จะสงผลเสียทางการเมือง§!"

 AAT_Sweden.2.t: "การลงมติไมไววางใจ"
 AAT_Sweden.2.desc: "ทามกลางการที่แพร-อัลบินไมยอมออนขอเรื่องงบประมาณ และในขณะเดียวกันก็ไมยอมลงจากตําแหนงใหผูสมัครคนอื่น พันธมิตรระหวางพรรคเกษตรกรและพรรคสายกลางจึงตัดสินใจยื่นญัตติไมไววางใจนายกรัฐมนตรี\n\nเมื่อสองพรรคนี้รวมมือกัน แพร-อัลบินจึงไมมีทางเลือกอื่นนอกจากลาออก ทําใหตําแหนงนายกรัฐมนตรีวางลง เหตุการณนี้กอใหเกิดวิกฤตในรัฐบาลที่ไมมีพรรคใดมีอิทธิพลทางการเมืองมากพอจะขึ้นสูอํานาจ\n\nพระมหากษัตริยเองทรงมีพระราชดํารัสตอตานความวุนวายที่เกิดขึ้น ซึ่งเปนการกระทําที่ไมธรรมดาสําหรับพระมหากษัตริยผูไมมีอํานาจทางการเมืองอยางเปนทางการ"
 AAT_Sweden.2.a: "เรื่องนี้จะจบลงอยางไร?"

 AAT_Sweden.3.a: "แพร อัลบิน-ฮันสซอนไดรับฉันทานุมัติจากประชาชน"
  
 AAT_Sweden.3.b: "[AAT_Sweden_3_b_loc]"
 AAT_Sweden.3.axel_is_leader: "อักเซลทําไดดีมาตลอด ใหเขาทําตอไป"
 AAT_Sweden.3.axel_is_not_leader: "พรรคเกษตรกรควรไดรับโอกาส"
  
 AAT_Sweden.3.c: "[AAT_Sweden_3_c_loc]"
 AAT_Sweden.3.bagge_is_leader: "บักเกจะนําเราสูอนาคตอยางแนนอน"
 AAT_Sweden.3.bagge_is_not_leader: "พรรคสายกลาง เราตองการผูนําคนใหมในยามยากลําบากเชนนี้"
  
 AAT_Sweden.3.d: "พี.เอ. เปนตนเหตุของความวุนวายนี้ วิกฟอรสควรนําพรรคสังคมประชาธิปไตยแทน"
 AAT_Sweden.3.t: "การเลือกตั้งทั่วไปของสวีเดน ป 1936"
 AAT_Sweden.3.desc: "วันนี้ ประชาชนทั่ว [ROOT.GetNameDef] พากันออกมาลงคะแนนเสียงในการเลือกตั้งระดับชาติ คาดกันวาพรรคสังคมประชาธิปไตยจะกลับมาผงาด เนื่องจากผลการคาดการณชี้วาพวกเขาจะไดที่นั่งเพิ่มขึ้นหลายที่ในรัฐสภาริกสดัก\nอยางไรก็ตาม ทั้งพรรคบอนเดเฟอรบุนเด็ตและพรรคเฮอเกิรนตางหวังวาการพลิกผันอยางไมคาดคิดจะสงพรรคใดพรรคหนึ่งขึ้นสูอํานาจ แตเมื่อพรรคชายขอบหลายพรรคคาดวาจะไดคะแนนเพิ่มขึ้นเล็กนอยทามกลางสถานการณโลกที่ไมสงบ อะไรก็เกิดขึ้นได"

 AAT_Sweden.4.t: "นักการเมืองกลาวหาคูแขงวา \"ไรความสามารถจนนาอับอาย\""
 AAT_Sweden.4.desc: "การอภิปรายในรัฐสภาริกสดักวันนี้ดุเดือดขึ้น เมื่อการโตเถียงวาใครควรดํารงตําแหนงนายกรัฐมนตรีลุกลามกลายเปนการโจมตีกันสวนตัว คารล เชอบลุม ตําหนิเกลนน แวรเนอร ระหวางการอภิปรายวา \"สิ่งเดียวที่คุณทําไดดีคือพาหมาไปเดินเลน\"\n\nโฆษกของเกลนนไดชี้แจงวาเขาไมเคยเลี้ยงหมาเลย"
 AAT_Sweden.4.a: "หวังวาเราจะไดนายกรัฐมนตรีเร็ว ๆ นี้"

 AAT_Sweden.5.t: "พบนักการเมืองซอนตัวอยูในพุมไม"
 AAT_Sweden.5.desc: "วันนี้มีผูพบเลนนารต ยันสซอน ซอนตัวอยูในพุมไมใกลรัฐสภาริกสดัก เมื่อถูกพบเห็น เขายืนกรานวาไมไดซอนตัวในพุมไม แตกําลังชื่นชมเตาทองตัวหนึ่งที่สวยเปนพิเศษ จากนั้นเขาก็รีบเดินเขารัฐสภาริกสดักไป\nมีการคาดเดาวาเขาซอนตัวอยูในพุมไมจริง ๆ เพื่อหลบเลี่ยงคูปรับทางการเมืองที่เพิ่งเดินเขาไปกอนหนาไมกี่วินาที เพื่อรวมหารือเรื่องนายกรัฐมนตรีตอ"
 AAT_Sweden.5.a: "ชางไรสาระจริง ๆ"

 AAT_Sweden.6.t: "เรื่องอื้อฉาวเรื่องเสียงซดซุป"
 AAT_Sweden.6.desc: "ประธานสภาไดเรียกรองใหออกกฎใหมเกี่ยวกับอาหารในรัฐสภาริกสดัก หลังจากอักดา เซอรลป ซดซุป \"เสียงดังมาก\" ระหวางที่นักการเมืองอีกคนกําลังอภิปรายเรื่องการเลือกนายกรัฐมนตรีคนใหม เขาเรียกการกระทํานี้วา \"การกอกวนโดยเจตนา\" แตคุณนายเซอรลปกลาววาเนื่องจากการหารือยืดเยื้อในชวงหลัง ทําใหไมมีเวลาพอจะรับประทานอาหารกลางวันในเวลาปกติ"
 AAT_Sweden.6.a: "หามซดเสียงดังอีก!"

 AAT_Sweden.7.t: "จับกุม 12 คนหนารัฐสภาริกสดัก"
 AAT_Sweden.7.desc: "วันนี้มีผูถูกจับกุม 12 คนหนารัฐสภาริกสดัก เนื่องจากพยายามบุกเขาไปภายใน เมื่อถูกตํารวจควบคุมตัว พวกเขาแถลงวาเพียงตองการกดดันใหไดขอยุติเร็วขึ้น โดยระบุวาบริการสังคมที่พวกเขาพึ่งพาไดหายไปทามกลางความวุนวายทางการเมือง\nพวกเขาถูกหยุดไวที่ล็อบบี้ เนื่องจากหนึ่งใน 12 คน คือริการด แพรสซอน เปนผูตองหาที่ตํารวจตามจับในขอหาลักลอบขนยาสูบ แพรสซอนตองเขาหองนํ้าสาธารณะ และถูกเจาหนาที่จําไดในหองนํ้า จึงถูกจับกุม\nคาดวาแพรสซอนจะถูกจําคุก 2 ป สวนอีก 11 คนที่เหลือจะถูกจําคุกไมเกิน 6 เดือนพรอมปรับฐานกระทําความผิดลหุโทษ"
 AAT_Sweden.7.a: "โอ ตายจริง"

 AAT_Sweden.8.t: "ปลอยตัว 11 คนที่ถูกจับกุมที่รัฐสภาริกสดัก"
 AAT_Sweden.8.desc: "วันนี้ 11 คนที่ถูกจับกุมฐานพยายามบุกรัฐสภาริกสดักไดรับการปลอยตัวโดยคุมประพฤติ สวนอีก 1 คนยังคงถูกคุมขังในขอหาลักลอบขนสินคา"
 AAT_Sweden.8.a: "หวังวาคนจรจัดพวกนี้จะกลับตัวกลับใจ"

 AAT_Sweden.9.t: "ผูลักลอบขนยาสูบกลับตัวเปนคนดี"
 AAT_Sweden.9.desc: "ริการด แพรสซอน ถูกจับกุมเมื่อเขาพยายามบุกรัฐสภาริกสดักพรอมกับอีก 11 คน และเนื่องจากเปนผูตองหาในคดีลักลอบขนยาสูบ เขาจึงถูกจําคุก 2 ป เราไดติดตามความเปนไปของเขา และยินดีที่จะรายงานวาหลังพนโทษ เขาตัดสินใจกลับตัวกลับใจและเขารวมกองทัพเรือทันที\nผูบังคับบัญชาในกองบัญชาการระดับสูงพบวาเขาเปนคนหนุมที่มีความมุงมั่นโดดเดน และนับแตนั้นเขาก็ไดรับการเลื่อนยศจากความทุมเทและพรสวรรคโดยธรรมชาติ"
 AAT_Sweden.9.a: "ชางเปนแรงบันดาลใจจริง ๆ"

 AAT_Sweden.10.t: "แฮรมัน เอริกสซอน ยื่นหนังสือลาออก"
 AAT_Sweden.10.desc: "วันนี้แฮรมัน เอริกสซอน ยื่นหนังสือลาออก โดยระบุวาเขาประสงคจะเกษียณเพื่อรับตําแหนงประธานเจาหนาที่บริหารของบริษัท Vin och Sprit AB\nแมเขาจะตองการเชนนั้น แตรัฐบาลอาจยังตองการตัวเขาอยู ทวาการมีเขาเปนซีอีโอของผูผลิตสุรารัฐวิสาหกิจก็อาจมีประโยชนเชนกัน"
 AAT_Sweden.10.a: "รัฐบาลยังตองการเขาอยู"
 AAT_Sweden.10.b: "ปลอยเขาไป"

 AAT_Sweden.11.t: "คนงานจาก [GER.GetNameDef] ยึดโรงงานลันดสแวรก"
 AAT_Sweden.11.desc: "หลังจากการสูรบระหวาง [SWE.GetNameDef] และ [GER.GetNameDef] ปะทุขึ้น บุคลากรชาวเยอรมันสามารถยึดโรงงานลันดสแวรกไวชั่วคราวและปดกั้นตัวเองอยูภายในอาคาร แมคาดวากองทัพจะยึดคืนไดในไมชา แตคาดวาจะเกิดความเสียหายบางสวนระหวางการปะทะ ทําใหโรงงานจะยังไมสามารถเดินเครื่องไดเต็มที่ไปอีกระยะหนึ่ง\nยังไมคอยมีใครรูเกี่ยวกับโรงงานลันดสแวรกที่ตั้งอยูในเยอรมนี แตทางการสวีเดนแทบไมสงสัยเลยวารัฐบาล [GER.GetNameDef] จะยึดโรงงานนั้นเพื่อตอบโต"
 AAT_Sweden.11.a: "บางทีการปลอยให [GER.GetNameDef] เปนเจาของโรงงานทางทหารอาจไมใชความคิดที่ดีนัก"

 AAT_Sweden.12.t: "[?ROOT.GetLeader] เสียชีวิตดวยอาการหัวใจวาย"
 AAT_Sweden.12.desc: "วันนี้ทางการ[?SWE.bus_capture_tag.GetAdjective]ไดออกอากาศขาวการจับกุมและการเสียชีวิตที่ตามมาของ [?SWE.GetLeader] โดยระบุวาหนวยคอมมานโด[?SWE.bus_capture_tag.GetAdjective]สามารถโอบลอมกองบัญชาการเคลื่อนที่ของนายกรัฐมนตรีบางสวน ซึ่งติดอยูใกลแนวหนาไวได\nเมื่อเขาประชิดรถบัสที่ [?SWE.GetLeader] และคณะทํางานหลบอยู หนวยคอมมานโดอางวานายกรัฐมนตรีดูเหมือนจะสะดุดและลมลงกับพื้นทันทีที่กาวลงจากรถ แมการสูรบยังคงดําเนินอยู ทางการ[?SWE.bus_capture_tag.GetAdjective]ก็มีนํ้าใจสงรางของอดีตนายกรัฐมนตรีคืนเพื่อประกอบพิธีศพแบบรัฐพิธี ผลการชันสูตรพบวานายกรัฐมนตรีมีอาการหัวใจวายตามดวยภาวะหัวใจหยุดเตน\nทามกลางความโกลาหลที่ตามมา ทาเก แอรลันเดร ไดเขารับตําแหนงนายกรัฐมนตรีฉุกเฉินจนกวาจะจัดการเลือกตั้งไดอยางเหมาะสม"
 AAT_Sweden.12.a: "ชางเปนโศกนาฏกรรมจริง ๆ"

 AAT_Sweden.13.t: "[SWE.GetNameDefCap] ขอควบคุมนอรเวยตอนเหนือ"
 AAT_Sweden.13.desc: "รัฐบาลสวีเดนไดขอควบคุมพื้นที่รอบนารวิก โดยอางวาเปนเพียงเหตุผลดานมนุษยธรรม และเกิดจากความปรารถนาจะปกปองประชาชนชาวนอรเวยจากความขัดแยงที่ยังดําเนินอยู เพื่อเปนหลักประกันความมั่นคง พวกเขาเสนอจะรักษาเขตนี้ใหเปนเขตปลอดทหาร และจะรับหนาที่รักษาความสงบเรียบรอยที่จําเปนทั้งหมดจนกวาความขัดแยงจะยุติ\nประชาชนชาวนอรเวยนาจะมีความสุขกวาภายใตเขตยึดครองของสวีเดน และจะชวยใหเรามีทรัพยากรเหลือสําหรับกองทหารที่แนวหนามากขึ้น"
 AAT_Sweden.13.a: "ฟงดูเปนขอตกลงที่ดี"
 AAT_Sweden.13.b: "ทั้งหมดเปนของ [THIS.GetNameDef]"
 AAT_Sweden.13.tt: "§R[SWE.GetName] อาจยกระดับเปนสงคราม§!"

 AAT_Sweden.14.t: "[FROM.GetNameDefCap] ยอมถอย"
 AAT_Sweden.14.desc: "[FROM.GetNameDefCap] ไดยอมรับขอเสนอของเราเรื่องเขตปลอดทหารรอบนารวิก ทหารของพวกเขาถอนออกจากพื้นที่ทั้งหมดแลว และบัดนี้เราจะประกาศใหเปนเขตปลอดการสูรบ เราคาดวารัฐบาล[NOR.GetAdjective]จะขอดินแดนคืนเมื่อสงครามสิ้นสุด แตในตอนนี้เราจะดูแลประชาชน[NOR.GetAdjective]ใหปลอดภัย"
 AAT_Sweden.14.a: "เริ่มจากสงความชวยเหลือบรรเทาทุกขไปกอน"
 AAT_Sweden.14.a_tt: "§Y[NOR.GetNameDefCap] จะขอใหเราคืนดินแดนของพวกเขาเมื่อสงครามสิ้นสุด§!"

 AAT_Sweden.15.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 AAT_Sweden.15.desc: "[FROM.GetNameDefCap] ไดปฏิเสธขอเสนอของเราเรื่องเขตปลอดทหารรอบนารวิก เราตองตัดสินใจวาจะตอบโตอยางไร จะยืนกรานใหมีเขตดังกลาวเพื่อประโยชนของพี่นองชาวนอรดิก หรือจะปลอยพวกเขาไวในความมืดมิด"
 AAT_Sweden.15.a: "เราไมอาจเสี่ยงประเทศของเราเพื่อเรื่องนี้"
 AAT_Sweden.15.b: "เราจะทอดทิ้ง [NOR.GetName] ไมได"
 AAT_Sweden.15.a_tt: "§Yเราจะไดเปาหมายสงครามตอ [FROM.GetNameDef] หากพวกเขาปฏิเสธ§!"


 AAT_Sweden.16.t: "[SWE.GetNameDef] ขูจะเปดฉากสูรบเรื่องนารวิก"
 AAT_Sweden.16.desc: "หลังจากเราปฏิเสธที่จะมอบพื้นที่รอบนารวิก รัฐบาล[SWE.GetAdjective]ไดขูอยางไมออมคอมวาจะเกิดการสูรบระหวางสองประเทศ หากเราไมยอมมอบดินแดนทางเหนือของ[NOR.GetAdjective]"
 AAT_Sweden.16.a: "เราไมอาจเสี่ยงมีศัตรูเพิ่มอีก"
 AAT_Sweden.16.b: "ใหพวกมันมาเลย"

 AAT_Sweden.17.t: "[FROM.GetNameDefCap] ดื้อรั้นไมยอมมอบนารวิก"
 AAT_Sweden.17.desc: "แมเราจะขูวาจะเปดฉากสูรบเรื่องนารวิก แต [FROM.GetName] ก็ไมยอมออนขอตอขอเรียกรองของเรา เราไมสามารถและจะไมปลอยใหประชาชน[NOR.GetAdjective]ถูกปฏิบัติเยี่ยงวัวควายภายใตสภาพที่ไรมนุษยธรรม เราตองยึดทาเรือของ[NOR.GetAdjective]เพื่อตัดเสนทางของกองกําลังผูรุกรานและปลดปลอยประชาชน[NOR.GetAdjective]"
 AAT_Sweden.17.a: "คราวนี้แกทําเรื่องใหญเขาแลว [FROM.GetName]"

 AAT_Sweden.18.t: "[NOR.GetName] ขอนารวิกคืน"
 AAT_Sweden.18.desc: "รัฐบาล[NOR.GetAdjective]ที่กลับมาบริหารประเทศไดขอใหสงมอบนารวิกและดินแดนใกลเคียงคืน หลังจากที่เราไดปกปองพื้นที่และพลเมืองของพวกเขาไวตลอดสงคราม ในแถลงการณระบุวาพวกเขาซาบซึ้งอยางยิ่งตอสิ่งที่รัฐบาลของเราไดทําในชวงสงคราม และหวังจะไดรวมมือกับเรามากขึ้นในอนาคต จะมีพิธีเฉลิมฉลองเพื่อยกยองเหลาชายผูธํารงเอกราชเพียงเสี้ยวเล็ก ๆ ของ[NOR.GetAdjective]ไวในคืนอันมืดมิดของสงคราม"
 AAT_Sweden.18.a: "แนนอน นารวิกเปนของ [NOR.GetName]"
 AAT_Sweden.18.b: "เราจะอางสิทธิ์นารวิกเปนคาตอบแทนความพยายามของเรา"

 AAT_Sweden.19.t: "[SWE.GetNameDefCap] คืนนารวิก"
 AAT_Sweden.19.desc: "วันนี้เปนวันอันสดใสที่ [Nor.GetName] ไดกลับมารวมเปนหนึ่งอีกครั้ง [SWE.GetName] ไดตอบรับคําขอของเราอยางมีนํ้าใจในการคืนนารวิก พื้นที่ซึ่งรัฐบาล[SWE.GetAdjective]ใหความคุมครองไวในชวงสงคราม เราไดแสดงความขอบคุณอยางสุดซึ้งตอรัฐบาล[SWE.GetAdjective] นี่คือสัญญาณแหงความสัมพันธที่ลึกซึ้งยิ่งขึ้นระหวางสองประเทศของเราที่จะยืนยาวไปอีกนาน"
 AAT_Sweden.19.a: "นอรเวยกลับมาเปนหนึ่งเดียวอีกครั้ง"
 AAT_Sweden.19_tt: "§Y[ROOT.GetNameDefCap]§! จะสามารถมอบ §Yเหรียญกางเขนเกียรติยศกลาโหมแหงนอรเวย§! ใหแก §Yนายทหารภาคสนาม§! ไดแลว"

 AAT_Sweden.20.t: "[SWE.GetNameDefCap] ปฏิเสธที่จะคืนนารวิก"
 AAT_Sweden.20.desc: "ในระหวางสงคราม [SWE.GetNameDef] ไดยึดครองดินแดนบางสวนของประเทศเราอยางอุกอาจ ภายใตขออางวาเพื่อ \"ชวยประชาชนชาวนอรเวยใหพนจากการยึดครองที่เลวรายยิ่งกวา\" แตกลับกลายเปนเพียงอุบายของรัฐบาล[SWE.GetAdjective]เพื่อขยายความทะเยอทะยานทางดินแดนของตน เพราะพวกเขาปฏิเสธที่จะคืนดินแดนที่ยึดครองไว โดยอางถึง \"ปญหาเสถียรภาพและความไมสงบทั่วโลกที่ยังคงดําเนินอยูหลังสงคราม\" เรามองออก นี่คือการฉวยโอกาสอยางโจงแจงที่สุด เปนการหักหลังกันซึ่ง ๆ หนาที่คุกคามเสรีภาพและบูรณภาพของรัฐเรา นารวิกเปนของนอรเวยและจะยังคงเปนเชนนั้น แมจะตองใชกําลังก็ตาม"
 AAT_Sweden.20.a: "ถาเชนนั้นก็สงคราม"

 AAT_Sweden.21.t: "[FROM.GetName] เชิญเราเขารวม $scandinavian_defense_union$"
 AAT_Sweden.21.desc: "ดวยความกังวลตอความตึงเครียดหลังสงครามระหวางมหาอํานาจผูชนะ [FROM.GetName] ใหเหตุผลวาเราไมควรหวนกลับไปใชนโยบายความเปนกลางแบบโดดเดี่ยวที่ลมเหลว แตควรประสานนโยบายทางทหารและการตางประเทศทั่วทั้งภูมิภาค เพื่อใหสามารถยับยั้งการรุกรานในอนาคตไดดียิ่งขึ้น"
 AAT_Sweden.21.a: "ขอเสนอนี้ไมเปนประโยชนตอเรา"
 AAT_Sweden.21.b: "ขอเสนอที่ยอดเยี่ยม"

 AAT_Sweden.22.t: "[FROM.GetName] ปฏิเสธขอเสนอสหภาพปองกัน"
 AAT_Sweden.22.desc: "วันนี้นักการทูต[FROM.GetAdjective]แจงเราวารัฐบาลของพวกเขาไมประสงคจะเขารวม $scandinavian_defense_union$ โดยใหเหตุผลวาการอยูนอกองคกรเชนนี้จะเปนประโยชนตอพวกเขามากกวา อยางนอยก็ในขณะนี้"
 AAT_Sweden.22.a: "นาผิดหวังอยางยิ่ง"

 AAT_Sweden.23.t: "[FROM.GetName] ขอเขารวมพันธมิตร"
 AAT_Sweden.23.desc: "[FROM.GetName] ไดขอเขารวมพันธมิตรของเรา เนื่องจากกังวลเรื่องความตึงเครียดหลังสงครามที่อาจเกิดขึ้นระหวางมหาอํานาจผูชนะ การมี [FROM.GetName] ในพันธมิตรจะชวยขยายอิทธิพลของเราในภูมิภาคของพวกเขา แตแนนอนวาจะผูกมัดใหเราตองปกปองพวกเขาหากเกิดความขัดแยงขึ้นอีก"
 AAT_Sweden.23.a: "พวกเขาจะเปนภาระตอความมั่นคงของเรา"
 AAT_Sweden.23.b: "เรายินดีอยางยิ่งหากพวกเขาเขารวม"

 AAT_Sweden.24.t: "[FROM.GetName] ปฏิเสธการรับเปนสมาชิกพันธมิตร"
 AAT_Sweden.24.desc: "[FROM.GetName] ไดปฏิเสธไมรับเราเปนสมาชิกพันธมิตรของพวกเขาในขณะนี้ โดยแสดงความกังวลวาการขยายพันธมิตรในตอนนี้จะทําใหพวกเขาถูกดึงเขาสูความขัดแยงมากขึ้น ดูเหมือนวาตอนนี้เราตองอยูตามลําพัง"
 AAT_Sweden.24.a: "นาผิดหวังอยางยิ่ง"

 AAT_Sweden.25.t: "ลงทุนในหนวยรบพิเศษ"
 AAT_Sweden.25.desc: "หลังการถกเถียงกันอยางยาวนานในหมูนายทหารระดับสูงวาจะจัดสรรงบประมาณสําหรับหนวยรบพิเศษใหมอยางไร กระบวนการก็หยุดชะงักลง ดูเหมือนทางเดียวที่จะคลี่คลายทางตันไดคือใหรัฐบาลเขามาสนับสนุนขอเสนอใดขอเสนอหนึ่ง"
 AAT_Sweden.25.a: "หนวยเรนเจอรจะมีประสิทธิภาพสูงสุดเมื่อพิจารณาจากภูมิประเทศของเรา"
 AAT_Sweden.25.b: "นาวิกโยธินจะชวยใหเราครองทะเลบอลติก"
 AAT_Sweden.25.c: "พลรมจะเปนกองกําลังที่ใชงานไดหลากหลายที่สุด"

 AAT_Sweden.26.t: "[?195.GetName] เสียแกขาศึกแลว"
 AAT_Sweden.26.desc: "สิ่งที่ไมอาจคาดคิดไดเกิดขึ้นแลว กองทัพของเราสูญเสียการควบคุม [195.GetnameDef] อนุสรณสถานสําคัญของชาวรัสเซียตกอยูในมือขาศึกแลว นี่ไมเพียงเปนความสูญเสียทางยุทธศาสตร แตยังเปนการสูญเสียขวัญกําลังใจครั้งใหญตอความภาคภูมิใจของชาติและกองทัพ  ขวัญกําลังใจของทหารชั้นผูนอยตกตํ่าลงอยางมาก และมีเสียงกระซิบเรื่องการหนีทัพแพรสะพัด หากเรายังทําสงครามตอไป เราก็จะสูดวยทหารที่ไมเชื่ออีกตอไปวาชีวิตของพวกเขาคุมคาที่จะสละใหกับสงครามที่ไรประโยชน"
 AAT_Sweden.26.a: "เราตองขอสงบศึก"
 AAT_Sweden.26.b: "เราไมอาจยอมรับความอับอายเชนนี้ได"

 AAT_Sweden.27.t: "[SOV.GetNameDefCap] ยอมสละการอางสิทธิ์ใน [?146.GetName]"
 AAT_Sweden.27.desc: "หลังจากฝายพันธมิตรของเรายึด [?146.GetName] ได ความเสียหายตอกองทัพแดงก็ยอยยับถึงขั้นที่มอสโกตองทบทวนการรุกรานของตน พวกเขายอมรับสันติภาพโดยไมมีเงื่อนไขและสัญญาวาจะไมอางสิทธิ์อีกตอไป ประชาชนทั้งในสตอกโฮลมและเฮลซิงกิตางโหรองยินดี ใครจะคิดวาหมีแดงจะทําจากกระดาษ?"
 AAT_Sweden.27.a: "เรื่องนี้จะชวยปลุกขวัญกําลังใจของกองทัพไดแนนอน"

 AAT_Sweden.28.t: "[SWE.GetNameDefCap] ขอดินแดนที่สูญเสียไปคืน"
 AAT_Sweden.28.desc: "เมื่อวาทกรรมของ [SWE.GetLeader] มีลักษณะจักรวรรดินิยมมากขึ้นเรื่อย ๆ จึงอาจไมนาแปลกใจที่ [SWE.GetLeader.GetSheHe] เรียกรองใหคืนดินแดนในอดีตจักรวรรดิที่สูญเสียไป การอางสิทธิ์ใด ๆ ที่พอจะมีนั้นหมดอายุไปนานแลวและไรนํ้าหนักอยางยิ่ง แตในยามความขัดแยง เราไมอาจเสียพันธมิตรไปได บางทีการแสดงไมตรีจิตอาจทําใหผูนําของพวกเขาพอใจ?"
 AAT_Sweden.28.a: "ไมมีทางเด็ดขาด"
 AAT_Sweden.28.b: "ราคาที่ตองจายเพื่อพันธมิตร"

 AAT_Sweden.29.t: "[FROM.GetNameDefCap] ปฏิเสธการมอบดินแดน"
 AAT_Sweden.29.desc: "[FROM.GetNameDefCap] ไดปฏิเสธคําขอของเราที่จะใหมอบอาณานิคมเกาคืน โดยระบุวาการอางสิทธิ์ของเราหางไกลจากภูมิรัฐศาสตรสมัยใหมเสียจนหากไมปฏิเสธอยางเด็ดขาด ก็จะเปนการปลอยใหเรื่องตลกนี้ยืดเยื้อนานเกินไป"
 AAT_Sweden.29.a: "เราจะสั่งสอนพวกเขา"

 AAT_Sweden.30.t: "[FROM.GetNameDefCap] มอบอาณานิคม"
 AAT_Sweden.30.desc: "[FROM.GetNameDefCap] ไดยอมรับคําขอของเราและกําลังสงมอบอาณานิคมเกาคืน ซึ่งสรางความประหลาดใจใหรัฐบาลของเราที่คาดวาจะเจอการตอตานมากกวานี้ เรื่องนี้กอใหเกิดการประทวงในดินแดนใหมของเรา แตยอมสงบลงเมื่อเวลาผานไป"
 AAT_Sweden.30.a: "แกไขความผิดใหถูกตอง"

 AAT_Sweden.31.t: "[FROM.GetNameDefCap] ขอเกาะบอรนโฮลม"
 AAT_Sweden.31.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดนําสารอันนาหดหูมาสง พวกเขาเรียกรองใหเราคืนเกาะบอรนโฮลม โดยอางวาเกาะนี้ไมเคยถูกโอนให [DEN.GetName] อยางถูกกฎหมาย เนื่องจากเสียไปจากการกบฏ เรื่องนี้เกิดขึ้นตั้งแตศตวรรษที่ 17 จึงเห็นไดชัดวาเปนเพียงขออางบาง ๆ เพื่อการขยายดินแดนของ[FROM.GetAdjective]"
 AAT_Sweden.31.a: "เราไมอาจสูรบกับ [FROM.GetName] ได"
 AAT_Sweden.31.a_tt: "§Rสิ่งนี้อาจนําไปสูการที่ [FROM.GetName] สามารถทําใหเราเปนรัฐหุนเชิดไดในที่สุด§!"
 AAT_Sweden.31.b: "ชางไรสาระสิ้นดี"

 AAT_Sweden.32.t: "[FROM.GetName] ยอมสละเกาะบอรนโฮลม"
 AAT_Sweden.32.desc: "[FROM.GetNameDefCap] แจงเราวาจะไมโตแยงการอางสิทธิ์ของเราเหนือเกาะบอรนโฮลม แตก็แจงดวยวานี่เปนการกระทําที่ไมเคยมีมากอนและคุกคามเสถียรภาพของกลุมประเทศนอรดิก"
 AAT_Sweden.32.a: "ไมเคยมีมากอนก็ชางมัน"

 AAT_Sweden.33.t: "[FROM.GetName] ปฏิเสธที่จะสละเกาะบอรนโฮลม"
 AAT_Sweden.33.desc: "รัฐบาล[FROM.GetAdjective]แจงเราวาจะไมพิจารณาการอางสิทธิ์ของเราเหนือเกาะบอรนโฮลม โดยระบุวาการอางสิทธิ์ใด ๆ ที่เราทําทีวายังมีอยูนั้นหมดอายุไปหลายศตวรรษแลว หากพวกเขาไมยอมมอบให เราก็ตองยึดมาดวยกําลัง เหมือนที่เคยทําเมื่อหลายศตวรรษกอน"
 AAT_Sweden.33.a: "เราจะขามชองแคบอีกครั้ง"

 AAT_Sweden.34.t: "[FROM.GetName] เรียกรองดินแดนปกครองตนเอง"
 AAT_Sweden.34.desc: "เอกอัครราชทูต[FROM.GetAdjective]แจงเราวา รัฐบาล[SWE.GetAdjective]เห็นวาในขณะที่ระเบียบระหวางประเทศกําลังถูกนิยามใหม รัฐบาล[THIS.GetAdjective]ไมสามารถปกปองดินแดนโพนทะเลของตนไดอยางเหมาะสมอีกตอไป หาก [THIS.GetName] ไมสามารถปกปองดินแดนของตนได รัฐบาลก็ควรยกดินแดนนั้นใหผูที่ทําได และ[FROM.GetAdjective]คือทางเลือกที่เหมาะสมที่สุด"
 AAT_Sweden.34.a: "เราไมมีทางเลือก"
 AAT_Sweden.34.a_tt: "§Rสิ่งนี้จะนําไปสูการที่ [FROM.GetName] สามารถทําใหเราเปนรัฐหุนเชิดได§!"
 AAT_Sweden.34.b: "นั่นเปนสิ่งที่เรายอมไมได" 

 AAT_Sweden.35.t: "[FROM.GetName] มอบดินแดนโพนทะเลของ[DEN.GetAdjective]"
 AAT_Sweden.35.desc: "[FROM.GetName] ตัดสินใจมอบดินแดนปกครองตนเองของตนอยางไมเต็มใจ เรื่องนี้ยอมทําลายความสัมพันธของเรากับ [FROM.GetName] แตในระยะยาวก็ไมสําคัญ เพราะอีกไมนานพวกเขาก็จะถูกกวาดเขามาอยูในเขตอิทธิพลของเรา"
 AAT_Sweden.35.a: "ยอดเยี่ยม"
  
 AAT_Sweden.36.t: "[FROM.GetName] ปฏิเสธที่จะมอบดินแดนโพนทะเลของ[DEN.GetAdjective]"
 AAT_Sweden.36.desc: "[FROM.GetName] แจงเราวาจะไมพิจารณาวิสัยทัศนของเราเรื่องระเบียบโลกใหม แมเราจะกดดันเรื่องการอางสิทธิ์ แตรัฐบาล[FROM.GetAdjective]ก็ดื้อรั้นไมยอมคืนดินแดนอันชอบธรรมของเรา"
 AAT_Sweden.36.a: "ถาเชนนั้นเราจะยึดมาดวยกําลัง"

 AAT_Sweden.37.t: "ชะตากรรมของ [DEN.GetName]"
 AAT_Sweden.37.desc: "รัฐบาล[DEN.GetAdjective]ออนแอลงจนถึงจุดที่ไมสามารถตานทานความพยายามอยางเต็มกําลังของเราในการแสดงอํานาจเหนือพวกเขาไดอีกตอไป ดังที่ครั้งหนึ่งเราเคยอยูใตอํานาจของชาวเดนมารก บัดนี้พวกเขาก็จะตองอยูใตอํานาจของเรา เราเพียงตองตัดสินใจวาจะจัดการกับพวกเขาอยางไรกอนยื่นคําขาด"
 AAT_Sweden.37.a: "เราจะใชพวกเขาเปนเขตกันชน"
 AAT_Sweden.37.b: "$AAT_Sweden.37.a$"

 AAT_Sweden.38.t: "[FROM.GetName] เคลื่อนไหวเพื่อทําให [DEN.GetName] เปนรัฐหุนเชิด"
 AAT_Sweden.38.desc: "ในการเคลื่อนไหวที่ไมเคยมีมากอน [FROM.GetName] ไดเรียกรองใหรัฐบาลของเรายกหนาที่และสถาบันทั้งหมดใหแกพวกเขา ประมุขแหงรัฐของเราไดประทวงตอเอกอัครราชทูตของพวกเขาอยางรุนแรง แตบังเอิญมีผูพบเห็นเรือประจัญบาน[SWE.GetAdjective]อยูไมไกลจากโคเปนเฮเกน รัฐบาล[DEN.GetAdjective]ไมมีอํานาจจะตอบโตภัยคุกคามเชนนี้ได และมีการลงนามยอมจํานนอยางเปนทางการในอีก 6 ชั่วโมงตอมา"
 AAT_Sweden.38.a: "ใหตายสิ"

 AAT_Sweden.39.t: "$AAT_Sweden.38.t$"
 AAT_Sweden.39.desc: "ในการเคลื่อนไหวที่ไมเคยมีมากอน [FROM.GetName] ไดเรียกรองใหรัฐบาลของเรายกหนาที่และสถาบันทั้งหมดใหแกพวกเขา บัดนี้เปนที่ชัดเจนแลววา แทนที่จะพยายามชวยเหลือเรา รัฐบาล[FROM.GetAdjective]กลับคอย ๆ บอนทําลายบูรณภาพของเรา จนกระทั่งมั่นใจพอที่จะประกาศอํานาจควบคุมเหนือเรา"
 AAT_Sweden.39.a: "พวกเขาจะไมมีวันไดขามนํ้าแข็งมาอีก!"
 AAT_Sweden.39.b: "$AAT_Sweden.38.a$"

 AAT_Sweden.40.t: "[FROM.GetName] เรียกรอง [145.GetName]"
 AAT_Sweden.40.desc: "เชนเดียวกับเมื่อป 1919 รัฐบาล[FROM.GetAdjective]กําลังรื้อฟนขอพิพาทเรื่องหมูเกาะโอลันดขึ้นมาอีกครั้ง แมสันนิบาตชาติจะไดตัดสินใหอธิปไตยเหนือหมูเกาะเปนของเราแลว แตดูเหมือน [FROM.GetName] จะไมยอมปลอยวาง บางทีพวกเขาอาจเชื่อวาเราอยูในสถานะที่ออนแอ และเมื่อสันนิบาตชาติลมสลาย พวกเขาก็ไดกลิ่นเลือดในนํ้า ลวนเปนพวกฉวยโอกาสโดยแท"
 AAT_Sweden.40.a: "เราไมอาจสูกับ [FROM.GetName] ได"
 AAT_Sweden.40.b: "เราจะไมมีวันยกให"

 AAT_Sweden.41.t: "[FROM.GetName] ยอมถอย!"
 AAT_Sweden.41.desc: "[FROM.GetName] ยอมถอยและยกหมูเกาะโอลันดใหเราแลว ในที่สุดความอยุติธรรมในอดีตก็ไดรับการแกไข และสถานะที่ถูกตองก็ไดรับการฟนฟู"
 AAT_Sweden.41.a: "ยอดเยี่ยม"

 AAT_Sweden.42.t: "[FROM.GetName] ปฏิเสธที่จะยก [145.GetName]"
 AAT_Sweden.42.desc: "[FROM.GetName] แจงเราวาปฏิเสธอยางแข็งกราวที่จะยก [145.GetName] โดยระบุวาเรื่องนี้ไดรับการตัดสินโดยสันนิบาตชาติแลว เห็นไดชัดวา [FROM.GetName] ประเมินอิทธิพลที่ตนมีอยูจริงสูงเกินไป เราควรแสดงให [FROM.GetName] เห็นถึงความผิดพลาดของพวกเขา"
 AAT_Sweden.42.a: "มันจะเปนของเรา"

 AAT_Sweden.43.t: "[FROM.GetName] เรียกรองใหปลดอาวุธใน [148.GetName]"
 AAT_Sweden.43.desc: "[FROM.GetName] ไดเรียกรองใหเราปลดอาวุธตามแนวพรมแดนทางเหนือ พวกเขากังวลเรื่องภัยคุกคามตอการทําเหมืองแรของตน ขณะเดียวกันก็เนนยํ้าวาภัยคุกคามใด ๆ ที่พอจะคิดไดยอมมาจากทางตะวันออก ไมใชทางตะวันตก การยอมตามจะชวยลดความตึงเครียดระหวาง [FROM.GetName] กับเรา ซึ่งเพิ่มสูงขึ้นมาตลอดนับตั้งแตวิกฤตโอลันด"
 AAT_Sweden.43.a: "การแสดงไมตรีเล็กนอยอาจชวยคลายความตึงเครียด"
 AAT_Sweden.43.b: "นั่นเปนการละเมิดอธิปไตยของเรา"

 AAT_Sweden.44.t: "[FROM.GetName] ยินยอมปลดอาวุธใน [148.GetName]"
 AAT_Sweden.44.desc: "เพื่อแสดงไมตรีจิต [FROM.GetName] ไดยินยอมปลดอาวุธใน [148.GetName] นี่คือกาวสําคัญของเราในการฟนฟูราชอาณาจักรตะวันออก อิทธิพลของเราเหนือ [FROM.GetName] กําลังคอย ๆ เติบโตขึ้น"
 AAT_Sweden.44.a: "เปนไปตามแผน"

 AAT_Sweden.45.t: "[FROM.GetName] ปฏิเสธที่จะปลดอาวุธใน [148.GetName]"
 AAT_Sweden.45.desc: "[FROM.GetName] ปฏิเสธที่จะปลดอาวุธใน [148.GetName] โดยระบุวาเราไมมีอํานาจตัดสินวา [FROM.GetName] จะทําอะไรภายในพรมแดนของตน นี่ยอมหมายความวาพวกเขากําลังวางแผนตอตานเราอยูใชหรือไม? เราจําเปนตองโจมตีกอน"
 AAT_Sweden.45.a: "สมรูรวมคิดหรือ?"

 AAT_Sweden.46.t: "ปญหาเรื่อง [FIN.GetName]"
 AAT_Sweden.46.desc: "ทุกคนตางเห็นชัดวา [FIN.GetName] ไมอาจตานทานภัยคุกคามจาก[SOV.GetAdjective]ได ชาวฟนนพูดถึงอธิปไตยของตน โดยไมตระหนักวาสิ่งที่พวกเขามองวาเปนเอกราชนั้นไมไดมาจากกําลังทางการเมืองหรือการทหารใด ๆ แตเกิดขึ้นจากความโกลาหลของสงครามกลางเมืองรัสเซีย นับแตวันนั้น นาฬกาก็เริ่มนับถอยหลังและจะถึงศูนยในไมชา แลวศัตรูเกาก็จะโผลหนาอันนาเกลียดออกมาอีกครั้ง ดังนั้นจึงจําเปนอยางยิ่งที่เราตองเขาควบคุมกิจการของ[FIN.GetAdjective] กอนที่ชาว[SOV.GetAdjective]จะทําได"
 AAT_Sweden.46.a: "ทําใหพวกเขาเปนรัฐหุนเชิด"
 AAT_Sweden.46.b: "$AAT_Sweden.46.a$"

 AAT_Sweden.47.t: "[FROM.GetName] เคลื่อนไหวเพื่อทําใหเราเปนรัฐหุนเชิด"
 AAT_Sweden.47.desc: "เปนที่ชัดเจนแลววา \"ความกังวล\" ของเพื่อนบานเรื่องความปลอดภัยของตนเปนเพียงอุบาย กองทัพของเราซึ่งไรเจตจํานงและสูญเสียความไดเปรียบทางยุทธศาสตร ไมไดรับการจัดระเบียบใหสอดรับกับความเปนจริงทางภูมิศาสตรใหม เราถูกลอบโจมตีโดยไมทันตั้งตัว มีผูพบเห็นเรือรบ[FROM.GetAdjective]อยูนอกเมืองหลวงของเรา กองทหาร[FROM.GetAdjective]ไดขามเขตปลอดทหารทางเหนือ และคําขาดใหยอมจํานนไดถูกสงมาถึงเรา ประชาคมระหวางประเทศไดทอดทิ้งเราแลว"
 AAT_Sweden.47.a: "ขอใหเจานายคนใหมของเรามีเมตตา"

 AAT_Sweden.48.t: "$AAT_Sweden.47.t$"
 AAT_Sweden.48.desc: "เปนที่ชัดเจนแลววา \"ความกังวล\" ของเพื่อนบานเรื่องความปลอดภัยของตนเปนเพียงอุบาย บัดนี้รัฐบาล [FROM.GetName] เรียกรองใหเราเขาขางพวกเขาเพื่อตอตานศัตรูรวมจากทางตะวันออก การยอมตามขอเรียกรองจะทําใหเราตกอยูในเขตอิทธิพลของ[FROM.GetAdjective]อยางแนนหนาอีกครั้งและบั่นทอนเอกราชของเรา คําถามที่ยังคงอยูคือ ทางเลือกอื่นจะเลวรายกวาหรือไม?"
 AAT_Sweden.48.a: "ชะตากรรมของเราจะไมถูกผูอื่นกําหนดอีกตอไป"
 AAT_Sweden.48.b: "$AAT_Sweden.47.a$"

 AAT_Sweden.49.t: "[FROM.GetName] ไมยอมออนขอ"
 AAT_Sweden.49.desc: "[FROM.GetName] ไดปฏิเสธขอเรียกรองของเราอยางสิ้นเชิง นี่เปนการเพิกเฉยตอความกังวลของเราอยางโจงแจง และในขณะเดียวกันก็คุกคามการทําเหมืองแรของเรา มีทางตอบโตไดเพียงทางเดียว"
 AAT_Sweden.49.a: "เมื่อการทูตลมเหลว..."

 AAT_Sweden.50.t: "[SWE.GetName] เรียกรอง [144.GetName]"
 AAT_Sweden.50.desc: "[SWE.GetName] ไดเรียกรองการควบคุมทาเรือนารวิกอยางสมบูรณ รัฐบาลของพวกเขาอางเหตุผลวากังวลวาศัตรูอาจยกพลขึ้นบกที่นารวิกและโจมตีเหมืองแรเหล็กของสวีเดน การไมยินยอมอาจนําไปสูการยกระดับเปนความขัดแยง"
 AAT_Sweden.50.a: "ไมคุมที่จะตอสูเพื่อมัน"
 AAT_Sweden.50.b: "ไรสาระสิ้นดี"
 AAT_Sweden.50.a_tt: "§Rสิ่งนี้จะนําไปสูการที่ [SWE.GetName] สามารถทําใหเราเปนรัฐหุนเชิดได§!"

 AAT_Sweden.51.t: "[FROM.GetName] ยอมถอย"
 AAT_Sweden.51.desc: "[FROM.GetName] ยอมถอยและยกนารวิกใหเราแลว สิ่งนี้ชวยใหเราไดแรเหล็กจากเยลลิวาเรและคิรุนาอยางมั่นคง ขณะเดียวกันก็ทําให [FROM.GetName] ออนแอลง"
 AAT_Sweden.51.a: "ยอดเยี่ยม"

 AAT_Sweden.52.t: "$AAT_Sweden.49.t$" 
 AAT_Sweden.52.desc: "$AAT_Sweden.49.desc$"
 AAT_Sweden.52.a: "$AAT_Sweden.49.a$"

 AAT_Sweden.53.t: "ปญหาเรื่อง [NOR.GetName]" 
 AAT_Sweden.53.desc: "รัฐบาล[SWE.GetAdjective]ไดเรียกรองโดยไมมีการยั่วยุใด ๆ ใหเราปลดประจําการกองทัพและเขารวมกับรัฐนอรดิกใหม แมพวกเขาจะอางวานี่เปนโครงการความรวมมือ แตก็เห็นไดชัดวาใครจะเปนผูรับใชและใครจะเปนนาย นี่เทากับการหวนกลับสูยุคสหภาพในอดีต"
 AAT_Sweden.53.a: "ไมมีวัน! จับอาวุธขึ้นสู"
 AAT_Sweden.53.b: "เราไมมีอิทธิพลพอจะตอตาน"

 AAT_Sweden_ball_bearing.1.t: "กําหนดเงื่อนไขการคาตลับลูกปนกับ [FROM.FROM.GetName]"
 AAT_Sweden_ball_bearing.1.desc: "ตลับลูกปนของเรามีคุณภาพชั้นยอด และเปนที่ตองการของมหาอํานาจทั่วโลกสําหรับใชในจักรกลสงคราม เรากําลังเขาสูการเจรจากับ [FROM.GetName] เพื่อคาขายสินคาลํ้าคานี้ แตกอนอื่นเราตองตัดสินใจวาตองการอะไรเปนการตอบแทน"
 AAT_Sweden_ball_bearing.1.a: "เราตองจัดหาอาหารใหมั่นคง"
 AAT_Sweden_ball_bearing.1.a_tt: "\n$we_will_gain_tt$\n  เสถียรภาพ: §G+2%§!\n  กําลังพลรายสัปดาห: §G+15§!. \nสามารถซอนทับกันได"
 AAT_Sweden_ball_bearing.1.b: "เราตองการความเชี่ยวชาญทางทหารของพวกเขา" 
 AAT_Sweden_ball_bearing.1.c: "ขอแบงปนองคความรู"
 AAT_Sweden_ball_bearing.1.c_tt: "\nหากไดรับการยอมรับ [SWE.GetNameDef] จะสามารถเลือกโบนัสการวิจัย §G+25%§! สําหรับ §Yเรือ§!, §Yเรดาร§!, §Yทรัพยากรสังเคราะห§! หรือ §Yเทคโนโลยีสนับสนุน§! ได"
 AAT_Sweden_ball_bearing.1.d: "ยุติการเจรจาไวกอน"

 AAT_Sweden_ball_bearing.2.t: "[SWE.GetNameDefCap] ขอแลกอาหารกับตลับลูกปน"
 AAT_Sweden_ball_bearing.2.desc: "[SWE.GetNameDefCap] ไดขอแลกตลับลูกปนอันลํ้าคาของพวกเขา ซึ่งจะเปนทรัพยากรสําคัญยิ่งตอความพยายามในสงครามของเรา กับการนําเขาอาหาร ดูเหมือนรัฐบาล[SWE.GetAdjective]กําลังหาทางรักษาการนําเขาที่สําคัญนี้ไวหากเกิดความขัดแยงในอนาคต เพราะเรื่องนี้เคยเปนปญหาใหญในชวงการปดลอมสมัยมหาสงคราม"
 AAT_Sweden_ball_bearing.2.a: "การคาที่เปนประโยชนรวมกัน"
 AAT_Sweden_ball_bearing.2.b: "เรารับภาระนี้ไมไหว"

 AAT_Sweden_ball_bearing.3.t: "[SWE.GetNameDefCap] ขอแลกความเชี่ยวชาญทางทหารกับตลับลูกปน"
 AAT_Sweden_ball_bearing.3.desc: "[SWE.GetNameDefCap] ไดขอแลกตลับลูกปนอันลํ้าคาของพวกเขา ซึ่งจะเปนทรัพยากรสําคัญยิ่งตอความพยายามในสงครามของเรา กับการแบงปนความเชี่ยวชาญทางทหารของเราใหพวกเขา ดูเหมือนรัฐบาล[SWE.GetAdjective]กําลังหาทางลดชองวางกับมหาอํานาจยุโรปที่กาวหนาทางการทหารกวา หากเกิดความขัดแยงในอนาคต"
 AAT_Sweden_ball_bearing.3.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.3.b: "$AAT_Sweden_ball_bearing.2.b$"

 AAT_Sweden_ball_bearing.4.t: "[SWE.GetNameDefCap] ขอแลกการแบงปนองคความรูกับตลับลูกปน"
 AAT_Sweden_ball_bearing.4.desc: "[SWE.GetNameDefCap] ไดขอแลกตลับลูกปนอันลํ้าคาของพวกเขา ซึ่งจะเปนทรัพยากรสําคัญยิ่งตอความพยายามในสงครามของเรา กับองคความรูและความกาวหนาทางวิทยาศาสตรของเรา ดูเหมือนรัฐบาล[SWE.GetAdjective]กําลังหาทางชิงความไดเปรียบในความขัดแยงที่อาจเกิดขึ้นผานความกาวหนาทางวิทยาศาสตร ซึ่งเปนสิ่งที่เราชวยพวกเขาไดอยางแนนอน"
 AAT_Sweden_ball_bearing.4.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.4.b: "$AAT_Sweden_ball_bearing.2.b$"




 AAT_Sweden_ball_bearing.5.t: "[FROM.GetNameDefCap] ยอมรับการคาตลับลูกปน"
 AAT_Sweden_ball_bearing.5.desc: "$AAT_Sweden.25.desc$\nบัดนี้เราตองมุงพิจารณาวาตองการความรูเชิงลึกดานเทคโนโลยีประเภทใด เพื่อลดชองวางระหวางเรากับมหาอํานาจอื่น ๆ"
 AAT_Sweden_ball_bearing.5.a: "เทคโนโลยีสนับสนุน"
 AAT_Sweden_ball_bearing.5.b: "เทคโนโลยีเรดาร"
 AAT_Sweden_ball_bearing.5.c: "เทคโนโลยีนํ้ามันสังเคราะห"
 AAT_Sweden_ball_bearing.5.d: "เทคโนโลยีเรือ"

 AAT_Sweden_ball_bearing.6.t: "[FROM.GetNameDefCap] ยอมรับการคาตลับลูกปน"
 AAT_Sweden_ball_bearing.6.desc: "[FROM.GetNameDefCap] ไดตอบรับขอเสนอทางการคาของเราอยางมีนํ้าใจ ขอตกลงนี้ยอมนําประโยชนมาสูทั้งสองฝาย ในโลกที่ไมมั่นคงมากขึ้นเรื่อย ๆ การคากลายเปนเครื่องมือสําคัญในการลดความตึงเครียดระหวางรัฐอธิปไตย"
 AAT_Sweden_ball_bearing.6.a: "ขาวดี"

 AAT_Sweden_ball_bearing.7.t: "[FROM.GetNameDefCap] ปฏิเสธการคาตลับลูกปน"
 AAT_Sweden_ball_bearing.7.desc: "[FROM.GetNameDefCap] ไดปฏิเสธขอเสนอใด ๆ เกี่ยวกับขอตกลงการคารวมกัน โดยอางถึงสภาพการเมืองโลกที่เสื่อมถอยลงอยางรวดเร็ว ซึ่งทําใหตองเลื่อนขอตกลงทางทหารที่สําคัญทั้งหมดออกไป"
 AAT_Sweden_ball_bearing.7.a: "นาเสียดาย"

 AAT_Sweden_ball_bearing.8.t: "การคาตลับลูกปนถูกยกเลิกเมื่อสงครามปะทุ"
 AAT_Sweden_ball_bearing.8.desc: "ไมนาแปลกใจเลยที่เมื่อสงครามระหวางสองประเทศปะทุขึ้น การคาตลับลูกปนก็ถูกยกเลิกโดยรัฐบาลทั้งสองฝาย ขอตกลงการคาที่ครั้งหนึ่งเคยไดรับการยกยองวาเปนกาวสําคัญในการชะลอการเดินหนาสูสงครามโลก ไดลมเหลวอยางไมตองสงสัย\nบัดนี้เครื่องมือสําคัญเหลานี้จะถูกเปลี่ยนเปนจักรกลสงคราม ซึ่งทายที่สุดจะไมใหสิ่งใดนอกจากเลือด ความเจ็บปวด และความทุกขทรมาน"
 AAT_Sweden_ball_bearing.8.a: "เปนสิ่งที่หลีกเลี่ยงไมไดหรือเปลา?"


 AAT_Sweden_flashpoints.10.t: "การโจมตีทางอากาศของ[SOV.GetAdjective]ทางตอนเหนือของ [SWE.GetName]"
 AAT_Sweden_flashpoints.10.desc: "วันนี้ชาวบานในปายาลา หมูบานใกลพรมแดน[FIN.GetAdjective] ตองตื่นตระหนกกับเสียงระเบิดตอเนื่องที่ทําลายอาคารและยานพาหนะหลายคัน โชคดีที่ไมมีผูใดบาดเจ็บสาหัส หลักฐานบงชี้ชัดวาการระเบิดเกิดจากเครื่องบินทิ้งระเบิด[SOV.GetAdjective]ที่เขาใจผิดคิดวาพื้นที่นี้เปนเปาหมายใน [FIN.GetName] \n\nเราตองควบคุมสถานการณใหไดกอนที่ความรูสึกของสาธารณชนจะลุกลามจนเกินควบคุม อยางไรก็ตาม เราก็ควรระวังไมยั่วยุใหเกิดความขัดแยงในวงกวางกับ [SOV.GetNameDef]"
 AAT_Sweden_flashpoints.10.a: "โลกตองไดรูถึงการรุกรานครั้งนี้"
 AAT_Sweden_flashpoints.10.b: "เราจะติดตอสถานทูต[SOV.GetAdjective]อยางระมัดระวังเพื่อหลีกเลี่ยงการยกระดับความขัดแยง"
 AAT_Sweden_flashpoints.10.c: "การเผชิญหนากับโซเวียตไมไดประโยชนอะไร"

 AAT_Sweden_flashpoints.11.t: "[SWE.GetName] โกรธแคนตอการทิ้งระเบิดปายาลา"
 AAT_Sweden_flashpoints.11.desc: "นักบิน[SOV.GetAdjective]ไดโจมตีทางอากาศหมูบาน[SWE.GetAdjective]โดยไมตั้งใจ หลังเขาใจผิดวาเปนเปาหมายใน [FIN.GetName] บัดนี้รัฐบาล[SWE.GetAdjective]แสดงความขุนเคือง และดึงความสนใจของโลกมาสูอุบัติเหตุอันนาเศรานี้ \n\nเราอาจยอมรับเหตุการณและเสนอชดใชคาเสียหาย แตนั่นอาจทําใหพลเมืองของเราตั้งคําถามตอปฏิบัติการทางทหารของเราใน [FIN.GetName] และชาติอื่น ๆ อาจมองวาเปนสัญญาณของความออนแอ"
 AAT_Sweden_flashpoints.11.a: "เราไมอาจเสี่ยงถูกดึงเขาสูความขัดแยงในวงกวาง เราจะขอโทษรัฐบาล[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.11.b: "ปฏิเสธการเกี่ยวของและกลาวหาวาชาว[SWE.GetAdjective]จัดฉากการโจมตีเอง"

 AAT_Sweden_flashpoints.12.t: "นักการทูต[SWE.GetAdjective]เรียกรองคําอธิบายเรื่องการทิ้งระเบิดปายาลา"
 AAT_Sweden_flashpoints.12.desc: "นักบิน[SOV.GetAdjective]ไดโจมตีทางอากาศหมูบาน[SWE.GetAdjective]โดยไมตั้งใจ หลังเขาใจผิดวาเปนเปาหมายใน [FIN.GetName] เอกอัครราชทูตจากสถานทูต[SWE.GetAdjective]ไดเขาพบเราเพื่อเรียกรองคําอธิบายตอการโจมตี รวมถึงวาเราจะชดใชใหพวกเขาอยางไร \n\nโชคดีที่ขาวอุบัติเหตุยังไมแพรสะพัด เราจึงมีโอกาสคลี่คลายสถานการณอยางรวดเร็วกอนที่จะบานปลายไปมากกวานี้"
 AAT_Sweden_flashpoints.12.a: "เราจะชดใชคาเสียหายให [SWE.GetName]"
 AAT_Sweden_flashpoints.12.b: "ปฏิเสธการเกี่ยวของและกลาวหาวาชาว[SWE.GetAdjective]จัดฉากการโจมตีเอง"

 AAT_Sweden_flashpoints.13.t: "[SOV.GetNameDefCap] ขอโทษกรณีการทิ้งระเบิดปายาลา"
 AAT_Sweden_flashpoints.13.desc: "เจาหนาที่จาก [SOV.GetNameDef] ไดขอโทษตอการโจมตีที่ปายาลาเมื่อไมนานมานี้ โดยยืนยันวาเปนความผิดพลาดของนักบินจริง ๆ พวกเขายังตกลงจะชดใชคาเสียหายที่เกิดขึ้นดวย ดูเหมือนชาว[SOV.GetAdjective]กําลังพยายามสรางทาทีที่รวมมือกันมากขึ้น ดวยหวังจะหลีกเลี่ยงการยกระดับความขัดแยงระหวางเรา"
 AAT_Sweden_flashpoints.13.a: "เราจะถือวาเรื่องนี้ยุติแลว"

 AAT_Sweden_flashpoints.14.t: "[SOV.GetNameDefCap] ปฏิเสธการเกี่ยวของในเหตุการณปายาลา"
 AAT_Sweden_flashpoints.14.desc: "ความพยายามของนักการทูตเราที่จะติดตามเหตุการณปายาลากับเจาหนาที่[SOV.GetAdjective]ไดรับเพียงการปฏิเสธการเกี่ยวของ ยิ่งไปกวานั้น พวกเขายังพยายามโยนความผิดเรื่องการทิ้งระเบิดมาที่เรา เพื่อใชเปนขออางวาเราแทรกแซงปฏิบัติการทางทหารของพวกเขาใน [FIN.GetName]"
 AAT_Sweden_flashpoints.14.a: "ทาทีที่นาเดือดดาลยิ่ง เราจะทําใหพวกเขาชดใช"
 AAT_Sweden_flashpoints.14.b: "เราไมอาจเสี่ยงทําสิ่งที่จะยกระดับสถานการณ"

 AAT_Sweden_flashpoints.15.t: "[SWE.GetName] สงความชวยเหลือทางทหาร"
 AAT_Sweden_flashpoints.15.desc: "เมื่อไมนานมานี้ มีผูพบเห็นเครื่องบินทิ้งระเบิด[SOV.GetAdjective]บินขามนานฟาของเราเขาไปใน [SWE.GetName] และทิ้งระเบิดหมูบานแหงหนึ่ง โดยเขาใจวาเปนเปาหมายของ[FIN.GetAdjective] นับแตนั้นวิกฤตทางการทูตก็ปะทุขึ้นระหวาง [SOV.GetNameDef] และ [SWE.GetName] และบานปลายจนถึงจุดที่ [SWE.GetName] ตัดสินใจสงอาวุธใหเราอยางเปดเผยเพื่อตอสูกับชาว[SOV.GetAdjective] ยังตองรอดูวาชาว[SOV.GetAdjective]จะตอบโตอยางไร"
 AAT_Sweden_flashpoints.15.a: "นาเศรา เราขอบคุณเพื่อนบาน[SWE.GetAdjective]ของเรา"

 AAT_Sweden_flashpoints.16.t: "ความตึงเครียดกับ [SWE.GetName] ลดลง"
 AAT_Sweden_flashpoints.16.desc: "หลังความตึงเครียดที่ทวีขึ้นตอเนื่องระหวาง [SWE.capital.GetCapitalVictoryPointName] และ [SOV.capital.GetCapitalVictoryPointName] ในที่สุดความตึงเครียดก็ดูเหมือนจะลดลง รัฐบาล[SWE.GetAdjective]ไดถอยจากวาทกรรมแข็งกราวเกี่ยวกับเหตุการณปายาลา และดูเหมือนจะยอมรับวาแทบไมมีทางทําใหเรายอมรับเรื่องนี้ได"
 AAT_Sweden_flashpoints.16.a: "ถึงเวลาที่พวกเขาจะถอยเสียที"

 AAT_Sweden_flashpoints.17.t: "[SWE.GetName] ยกระดับความตึงเครียดดวยการติดอาวุธให [FIN.GetName]"
 AAT_Sweden_flashpoints.17.desc: "เมื่อความพยายามของ [SWE.GetName] ที่จะทําลายชื่อเสียงของเราเรื่องการทิ้งระเบิดปายาลาลมเหลว บัดนี้พวกเขาก็สงยุทโธปกรณทหารราบใหกองทัพ[FIN.GetAdjective]อยางเปดเผย นี่เปนความพยายามแบล็กเมลอยางชัดเจน เพื่อบีบใหเรายอมรับผิดชอบตอการโจมตี มิฉะนั้นทหารโซเวียตจะตองเสียชีวิตเพิ่มขึ้นอีก \n\nเราตองประเมินกาวตอไปอยางรอบคอบ เพื่อปองกันไมใหชาว[SWE.GetAdjective]เขามาพัวพันกับสงครามอยางเต็มตัวในฐานะพันธมิตรของ[FIN.GetAdjective]"
 AAT_Sweden_flashpoints.17.a: " เราจะยกระดับเพื่อลดระดับ ดวยการขูจะทําสงครามหากพวกเขาไมหยุด"
 AAT_Sweden_flashpoints.17.b: " เราตองเอาใจชาว[SWE.GetAdjective]ไวกอน ในตอนนี้"

 AAT_Sweden_flashpoints.18.t: "[SOV.GetNameDefCap] เรียกรองใหยุติการสงอาวุธ"
 AAT_Sweden_flashpoints.18.desc: " การสงอาวุธให [FIN.GetName] ที่เราจงใจยั่วยุไดดึงความสนใจของ [SOV.GetNameDef] นักการทูตจากมอสโกแจงเราวา [SOV.GetLeader] มองการกระทําของเราวาเทากับการเขารวมความขัดแยงเพื่อตอตาน [SOV.GetNameDef] และจะใชมาตรการที่จําเปนทุกอยางตอเรา"
 AAT_Sweden_flashpoints.18.a: "[SOV.GetLeader] กําลังขูลอย ๆ และเราจะไมหลงกล สงอาวุธตอไป"
 AAT_Sweden_flashpoints.18.b: "เราไมอาจเสี่ยงยกระดับความขัดแยงกับโซเวียตอีก"

 AAT_Sweden_flashpoints.19.t: "[SWE.GetName] ปฏิเสธคําขาด"
 AAT_Sweden_flashpoints.19.desc: "นักการทูต[SWE.GetAdjective]ประกาศชัดเจนวาไมมีเจตนาจะหยุดสงอาวุธ จนกวาเราจะยอมรับการเกี่ยวของในการทิ้งระเบิดปายาลาและชดใชคาเสียหาย หากเราไมทําตามคําขู มหาอํานาจอื่นในภูมิภาคอาจมองวาเราเปนเปาหมายงาย ๆ สําหรับการรุกรานของพวกเขาเอง อยางไรก็ตาม การดึงหลายชาติเขามาพัวพันกับปฏิบัติการทางทหารใน[FIN.GetAdjective]อาจทําใหความขัดแยงบานปลายสูระดับโลก"
 AAT_Sweden_flashpoints.19.a: "พวกเขาไมไดใหทางเลือกแกเรา"
 AAT_Sweden_flashpoints.19.b: "เราตองเอาใจชาว[SWE.GetAdjective]ไวกอน ในตอนนี้"

 AAT_Sweden_flashpoints.20.t: "[SWE.GetName] เสนอพันธมิตรตอตาน[SOV.GetAdjective]"
 AAT_Sweden_flashpoints.20.desc: "เมื่อความตึงเครียดระหวาง [SWE.GetName] และ [SOV.GetNameDef] ที่ทวีขึ้นเมื่อไมนานมานี้ไดปะทุเปนความขัดแยงอยางเปดเผย เอกอัครราชทูต[SWE.GetAdjective]จึงเสนอใหรวมมือกันใกลชิดยิ่งขึ้นในพันธมิตรทางทหารเพื่อตอตานศัตรูรวมของเรา"
 AAT_Sweden_flashpoints.20.a: "เมื่อรวมมือกัน เราจะเอาชนะภัยคุกคามจาก[SOV.GetAdjective]ได"
 AAT_Sweden_flashpoints.20.b: "เรารับมือเองได"
  SWE_nordic_defense_pact: "กติกาปองกันรวมนอรดิก"

 AAT_Sweden_flashpoints.21.t: "พันธมิตร[SWE.GetAdjective]-[FIN.GetAdjective]"
 AAT_Sweden_flashpoints.21.desc: "เมื่อความตึงเครียดระหวาง [SWE.GetName] และ [SOV.GetNameDef] ที่ทวีขึ้นเมื่อไมนานมานี้ไดปะทุเปนความขัดแยงอยางเปดเผย นักการทูตจึงเสนอใหเราติดตอฝาย[FIN.GetAdjective]และจัดตั้งพันธมิตรทางทหารเพื่อตอตานศัตรูรวมของเรา"
 AAT_Sweden_flashpoints.21.a: "เราควรสงเสริมความรวมมือระหวางชาติของเราใหมากขึ้น"
 AAT_Sweden_flashpoints.21.b: "เราเอาชนะ [SOV.GetLeader] ไดโดยไมตองพึ่ง[FIN.GetAdjective]"

 AAT_Sweden_flashpoints.22.t: "[FIN.GetName] ปฏิเสธขอเสนอพันธมิตร"
 AAT_Sweden_flashpoints.22.desc: "นักการทูต[FIN.GetAdjective]แจงเราวา แมจะมีศัตรูรวมกันคือ [SOV.GetNameDef] แตวัตถุประสงคทางยุทธศาสตรของรัฐบาลพวกเขาแตกตางจากของเรามากเกินไป ดวยเหตุนี้ พวกเขาจึงจําตองปฏิเสธขอเสนอพันธมิตรของเรา"
 AAT_Sweden_flashpoints.22.a: "เปนการตัดสินใจที่นาเสียดาย"

 AAT_Sweden_flashpoints.30.t: "สิทธิ์การผานแดนใน [SWE.GetName]"
 AAT_Sweden_flashpoints.30.desc: "แมเราจะสรางฐานที่มั่นในสแกนดิเนเวียไดสําเร็จ แตการขนสงทหารและยุทโธปกรณผานชองแคบเดนมารกอาจเปนอันตราย ขบวนเรือลําเลียงมักตกเปนเหยื่อการโจมตีทางอากาศและทางทะเลของขาศึกเมื่ออยูกลางทะเลเปด ดังนั้นการลดการใชเสนทางเดินเรือใหนอยที่สุดจะเปนประโยชนตอความพยายามในสงครามของเรา \n\nดวยเหตุนี้ จึงอาจคุมคาที่จะกดดัน [SWE.GetName] ประเทศเพื่อนบาน ใหอนุญาตเราใชเครือขายรถไฟและการสื่อสารของพวกเขา อยางไรก็ตาม เราตองใชชั้นเชิงและคอย ๆ บอนเซาะความเปนกลางของพวกเขา หากไมตองการใหพวกเขากลายเปนฐานปฏิบัติการของศัตรู"
 AAT_Sweden_flashpoints.30.a: "ติดตอ [SWE.GetName] เพื่อขอผานแดนเพื่อมนุษยธรรมทางเครือขายรถไฟของพวกเขา"
 AAT_Sweden_flashpoints.30.b: "เราไมตองการโครงสรางพื้นฐานของ[SWE.GetAdjective]"

 AAT_Sweden_flashpoints.31.t: "[GER.GetName] ขอสิทธิ์ผานแดนสําหรับทหารบาดเจ็บ"
 AAT_Sweden_flashpoints.31.desc: "สมาชิกรัฐบาล[GER.GetAdjective]ไดติดตอเราเพื่อขอใชเครือขายรถไฟของเราอยางจํากัด เพื่อใหทหารบาดเจ็บและทหารที่ลาพักเดินทางไปกลับ [GER.GetNameDef] ผาน [SWE.GetName] และ [DEN.GetName] แมพวกเขาจะยืนยันวาคําขอนี้เปนไปเพื่อมนุษยธรรมลวน ๆ แตก็ไมยากที่จะคาดเดาวาพวกเขาจะใชสิ่งนี้คอย ๆ กัดกรอนความเปนกลางของเรา"
 AAT_Sweden_flashpoints.31.a: "การอยูรอดสําคัญกวาความเปนกลาง"
 AAT_Sweden_flashpoints.31.b: "ปฏิเสธคําขอและเตือนพวกเขาถึงความเปนกลางของเรา"

 AAT_Sweden_flashpoints.32.t: "[SWE.GetName] ปฏิเสธคําขอ"
 AAT_Sweden_flashpoints.32.desc: "[SWE.GetName] ดื้อรั้นไมยอมใหเราใชโครงสรางพื้นฐานของพวกเขา โดยอางถึงพันธะตอความเปนกลาง บางทีพวกเขาอาจตองไดรับการตอบโตที่หนักแนนกวานี้ เพื่อเตือนวาเอกราชที่ยังคงอยูของพวกเขาเปนเพียงรางวัลจากเราที่พวกเขายอมทําตามในขณะที่เราจัดระเบียบยุโรปใหม"
 AAT_Sweden_flashpoints.32.a: "แจงพวกเขาวา [GER.GetLeader] เริ่มสงสัยในความเปนกลางของพวกเขาแลว"
 AAT_Sweden_flashpoints.32.b: "ปลอยเรื่องนี้ไป เราไมอาจเสี่ยงใหพวกเขาเขารวมกับศัตรู"

 AAT_Sweden_flashpoints.33.t: "[GER.GetLeader] ตั้งคําถามตอความเปนกลางของ[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.33.desc: "เราไดรับโทรเลขที่ใชถอยคํารุนแรงจาก [GER.Capital.GetCapitalVictoryPointName] แจงวา [GER.GetLeader] ไมพอใจที่เราปฏิเสธคําขอลาสุดของพวกเขา ดูเหมือนผูนํา[GER.GetAdjective]เริ่มตั้งคําถามตอความเปนกลางของเรา และเชื่อวาการกระทําของเราเมื่อไมนานมานี้บงชี้วาเรากําลังเอนเอียงไปเขาขางศัตรูของ [GER.GetName] \n\nดูเหมือนพวกเขาอาจพรอมจะยกระดับสถานการณเปนความขัดแยงหากจําเปน ดังนั้นอาจถึงเวลาที่เราตองทบทวนจุดยืนในปจจุบัน"
 AAT_Sweden_flashpoints.33.a: "การอยูรอดสําคัญกวาความเปนกลาง"
 AAT_Sweden_flashpoints.33.b: "เราจะไมยอมถูก [GER.GetLeader] บีบบังคับ เริ่มระดมพลได"

 AAT_Sweden_flashpoints.34.t: "[SWE.GetName] ยกระดับความพรอมรบ"
 AAT_Sweden_flashpoints.34.desc: "กองทัพ[SWE.GetAdjective]ไดยกระดับความพรอมรบอยางจงใจยั่วยุ ซึ่งนาจะเพื่อแสดงใหเห็นวาพวกเขาพรอมตอตานการกดดันของเรา เราตองระมัดระวัง มิฉะนั้นอาจตองพัวพันกับความขัดแยงอีกครั้งในสแกนดิเนเวีย"
 AAT_Sweden_flashpoints.34.a: "เริ่มเตรียมการโจมตี [SWE.GetName] และสงคําขาดไปยังพวกเขา"
 AAT_Sweden_flashpoints.34.b: "ไมคุมที่จะเสี่ยง"

 AAT_Sweden_flashpoints.35.t: "[GER.GetName] ยื่นคําขาด"
 AAT_Sweden_flashpoints.35.desc: "[GER.GetNameDefCap] ไดยื่นคําขาดอยางเขมงวด เรียกรองใหเรายอมตามขอเรียกรองลาสุดในการเขาใชโครงสรางพื้นฐานของเรา โดยระบุวาหากเราไมยอม พวกเขาจะถือวาเราเปนศัตรูของ [GER.GetNameDef] และจะใชกําลังทุกอยางที่จําเปนเพื่อรักษาผลประโยชนของตนในสแกนดิเนเวีย"
 AAT_Sweden_flashpoints.35.a: "การอยูรอดสําคัญกวาความเปนกลาง"
 AAT_Sweden_flashpoints.35.b: "หากสงครามหลีกเลี่ยงไมได เราควรสูตามเงื่อนไขของเราเอง"
 AAT_Sweden_flashpoints.35.c: "เราจะไมยอมละทิ้งความเปนกลาง"

 AAT_Sweden_flashpoints.36.t: "ความตึงเครียดกับ [GER.GetNameDef] ลดลง"
 AAT_Sweden_flashpoints.36.desc: "โชคดีที่ความตึงเครียดกับ [GER.GetNameDef] เมื่อไมนานมานี้เริ่มคลี่คลายลง แมพวกเขาจะขมขูสารพัด แตดูเหมือนเราจะผานพนสถานการณทางการทูตที่ยากลําบากยิ่งมาได อยางไรก็ตาม เราควรระแวดระวังไว เพราะการกระทําของเราเมื่อไมนานมานี้นาจะสรางความขุนเคืองอยางมากตอเราใน [GER.Capital.GetCapitalVictoryPointName]"
 AAT_Sweden_flashpoints.36.a: "หวังวาเราจะรักษาความเปนกลางไวได"

 AAT_Sweden_flashpoints.37.t: "[SWE.GetName] ปฏิเสธคําขาด"
 AAT_Sweden_flashpoints.37.desc: "รัฐบาล[SWE.GetAdjective]ไดปฏิเสธคําขาดของเราอยางหนักแนน โดยระบุวาเราไมควรตีความความเปนกลางของพวกเขาผิดวาเปนการยอมรับความออนแอหรือความไมพรอม พวกเขายังระบุตอไปวากองทัพของเราควรเตรียมรับความสูญเสียชีวิตอยางหนัก หากมีการกระทําอยางบุมบามตอ [SWE.GetName] \n\nนี่อาจเปนเพียงการขูเพื่อยับยั้งการใชกําลังทหาร แตจากการสังเกตการณทหารสวีเดน บงชี้วาพวกเขาพรอมจะสูเพื่อเอกราชของตน"
 AAT_Sweden_flashpoints.37.a: "เราไมอาจเสี่ยงใหกองทัพขยายกําลังเกินตัว"
 AAT_Sweden_flashpoints.37.b: "เริ่มการรุกราน [SWE.GetName]"

 AAT_Sweden_flashpoints.38.t: "[SWE.GetName] เปดฉากโจมตีชิงลงมือกอน"
 AAT_Sweden_flashpoints.38.desc: "ดูเหมือนเราจะประเมินความพรอมจะสูของชาว[SWE.GetAdjective]ผิดไปอยางรายแรง แมจะเปนกลางมากวาศตวรรษ แตวันนี้กองทัพ[SWE.GetAdjective]ไดเปดฉากโจมตีชิงลงมือกอนตอกองกําลังของเราในนอรเวยจนพวกเขาไมทันตั้งตัว แมผลของความขัดแยงยังหางไกลจากขอยุติ แตก็อดไมไดที่จะตองยอมรับอยางไมเต็มใจถึงความกลาบาบิ่นของฝาย[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.38.a: "[SWE.GetName] จะเปนเพียงเชิงอรรถในประวัติศาสตรของเรา"
 
 AAT_Sweden_flashpoints.39.t: "[SWE.GetName] อนุญาตใหทหารบาดเจ็บผานแดน"
 AAT_Sweden_flashpoints.39.desc: "[SWE.GetName] ไดอนุญาตใหทหารบาดเจ็บและทหารที่ลาพักของเราเดินทางผานเครือขายรถไฟของพวกเขากลับไปยัง [GER.GetNameDef] อยางไรก็ตาม พวกเขายืนกรานวาตองเปนบุคลากรที่ไมมีอาวุธเทานั้น และจะมีการกําหนดโควตาอยางเขมงวด เพื่อไมใหมีทหารอยูในสวีเดนมากเกินไปในเวลาใดเวลาหนึ่ง"
 AAT_Sweden_flashpoints.39.a: "ยอดเยี่ยม เราจะหลีกเลี่ยงการทําใหพวกเขาขุนเคืองอีก"
 AAT_Sweden_flashpoints.39.b: "กดดันตอไป เราอาจไดสิทธิ์เขาใชเครือขายการสื่อสารของพวกเขา"

 AAT_Sweden_flashpoints.40.t: "[GER.GetName] ขอใชเครือขายโทรศัพทและโทรเลข"
 AAT_Sweden_flashpoints.40.desc: "ดังที่เรากลัว คําขอของเยอรมนีเมื่อไมนานมานี้ในการเขาใชเครือขายรถไฟของเราไดขยายวงออกไปแลว รัฐบาล[GER.Adjective]ขอใชเครือขายโทรเลขและโทรศัพทของเรา เพื่อสื่อสารโดยตรงระหวาง [NOR.GetName] และ [GER.GetNameDef]\n\nการยอมตามขอเรียกรองนี้จะเปนการบอนทําลายความเปนกลางของเราอีกครั้ง แตเราอาจพิจารณาดักฟงสายสื่อสารเพื่อสอดแนมวากองทัพ[GER.GetAdjective]กําลังวางแผนอะไรอยู"
 AAT_Sweden_flashpoints.40.a: "การอยูรอดสําคัญกวาความเปนกลาง"
 AAT_Sweden_flashpoints.40.b: "เราใชสิ่งนี้ใหเปนประโยชนได"
 AAT_Sweden_flashpoints.40.c: "เราจะละทิ้งความเปนกลางไมได"
  SWE_spying_on_GER: "เรากําลังสอดแนมการสื่อสารของเยอรมันที่ผานเครือขายของเรา"
 AAT_Sweden_flashpoints_tt_arne_beurling: "ปลดล็อก §Yอารเน บอยรลิง§! ($MODIFIER_DECRYPTION_POWER$: §G+15§!) เปนที่ปรึกษา"

 AAT_Sweden_flashpoints.41.t: "[SWE.GetName] อนุญาตใหใชเครือขายโทรศัพทและโทรเลข"
 AAT_Sweden_flashpoints.41.desc: "การสื่อสารระหวาง [GER.Capital.GetCapitalVictoryPointName] และกองกําลังของเราใน [NOR.GetName] สะดวกขึ้นมากดวยความรวมมือของรัฐบาลสวีเดน  บางทีเราควรหลีกเลี่ยงการยั่วยุพวกเขาอีก เพื่อไมใหเสี่ยงสูญเสียสิทธิประโยชนที่ไดมา"
 AAT_Sweden_flashpoints.41.a: "ยอดเยี่ยม เราไดทุกอยางที่ทําไดจากพวกเขาแลว"
 AAT_Sweden_flashpoints.41.b: "เราควรผลักดันครั้งสุดทายเพื่อสิทธิ์ผานแดนทางทหารเต็มรูปแบบ"

 AAT_Sweden_flashpoints.42.t: "[GER.GetName] ขอสิทธิ์ผานแดนทางทหาร"
 AAT_Sweden_flashpoints.42.desc: "รัฐบาลของ [GER.GetNameDef] ยังไมพอใจกับสิทธิประโยชนที่ไดจากเรากอนหนานี้ จึงขอสิทธิ์ผานแดนทางทหารเพื่อแบงเบาภาระปฏิบัติการทางทหารในสแกนดิเนเวีย ดูเหมือนชัดเจนวานี่คือเจตนาของ[GER.GetAdjective]มาตั้งแตตน และการไมยอมสละความเปนกลางชิ้นสุดทายของเราจะถูก [GER.GetLeader] ใชเปนขออางในการรุกราน [SWE.GetName] อยางไรก็ตาม หากเรายอมใหผานแดน เพื่อนบานของเราและศัตรูของ [GER.GetNameDef] ก็นาจะมองวาเราสมรูรวมคิดในการยึดครอง [NOR.GetName]"
 AAT_Sweden_flashpoints.42.a: "เราไมมีกําลังพอจะสูกับ [GER.GetName]"
 AAT_Sweden_flashpoints.42.b: "เราตองตอตานขอเรียกรองนี้หากไมตองการถูกลากเขาสูสงคราม"

 AAT_Sweden_flashpoints.43.t: "[SWE.GetName] อนุญาตสิทธิ์ผานแดนทางทหาร"
 AAT_Sweden_flashpoints.43.desc: "[SWE.GetName] ไดใหสิทธิ์ผานแดนทางทหารเต็มรูปแบบแกเรา สิ่งนี้ไมเพียงชวยปฏิบัติการของเราในสแกนดิเนเวีย แตยังเพิ่มอิทธิพลของเราเหนือ [SWE.GetName] และปองกันไมใหพวกเขาเขารวมกับศัตรูไดงาย ๆ"
 AAT_Sweden_flashpoints.43.a: "พวกเขาอยูใตการควบคุมของเราแลว เวนแตในนามเทานั้น"
  SWE_GER_military_access_tt: "§Y[GER.GetFlag][GER.GetNameDefCap]§! §Rจะไดรับสิทธิ์ผานแดนทางทหารใน§! §Y[SWE.GetFlag][SWE.GetName]§!"

 AAT_Sweden_flashpoints.50.t: "ศัตรูภายใน"
 AAT_Sweden_flashpoints.50.desc: "แมเราจะคอยจับตากิจกรรมของฝายซายจัดมาโดยตลอด แตก็ไมใชเรื่องเปนไปไมไดที่พวกคอมมิวนิสตจะกอวินาศกรรมตอกองทัพหรือปลุกปนความไมพอใจในอุตสาหกรรมสําคัญ เพื่อให[SOV.GetAdjective]บุกรุกเขาสู [SWE.GetName] ไดงายขึ้น ดังนั้นเราควรชิงปองกันดวยการกักกันผูที่รูกันวาเห็นอกเห็นใจ [SOV.GetNameDefCap] หรือมีแนวคิดซายจัดโดยทั่วไป"
 AAT_Sweden_flashpoints.50.a: "เราไมอาจเสี่ยงใหพวกเขากอปญหา จับขังเสีย"
 AAT_Sweden_flashpoints.50.b: "สิ่งนี้รับไมไดในสังคมประชาธิปไตย"

 AAT_Sweden_flashpoints.51.t: "ความโกรธแคนตอการตัดสินใจกักกัน"
 AAT_Sweden_flashpoints.51.desc: "หลังการตัดสินใจเริ่มกักกันฝายซายหัวรุนแรงทั่ว [SWE.GetName] การบุกคนและจับกุมของตํารวจเพื่อใหบรรลุเปาหมายนั้นไดรับการตอตานอยางดุเดือดจากชนชั้นแรงงาน หลายคนถึงขั้นชวยพวกหัวรุนแรงหลบหนีการจับกุม หรือถึงกับทํารายเจาหนาที่ตํารวจ พวกเขาอางวาการจับกุมคุมขังแบบเหมารวมเชนนี้เทากับการสรางรัฐตํารวจ เราควรระมัดระวังในการดําเนินการตอไป มิฉะนั้นสถานการณอาจลุกลามจนควบคุมไมไดอยางรวดเร็ว"
 AAT_Sweden_flashpoints.51.a: "สงกองทัพเขาไปสนับสนุนตํารวจ"
 AAT_Sweden_flashpoints.51.b: "นี่เปนความผิดพลาด เราตองปลอยตัวผูที่ถูกจับไปแลว"

 AAT_Sweden_flashpoints.52.t: "การประทวงใหญและความรุนแรงปะทุขึ้นจากการจับกุมฝายซาย"
 AAT_Sweden_flashpoints.52.desc: "การตัดสินใจใหกองทัพสนับสนุนตํารวจในการจับกุมฝายซายหัวรุนแรงไดกอใหเกิดวงจรความรุนแรงที่คุกคามจะพาชาติเขาสูสงครามกลางเมือง การปะทะระหวางคนงานกับตํารวจทําใหมีผูเสียชีวิตและบาดเจ็บจํานวนหนึ่ง พวกหัวรุนแรงที่เราจับไมไดกําลังปลุกระดมคนงานใหตอตานเรา และเรียกรองใหยุบรัฐบาลทั้งหมด ยิ่งไปกวานั้น ทหารจํานวนหนึ่งปฏิเสธที่จะปฏิบัติตามคําสั่ง หรือถึงขั้นหนีทัพไปเลย นี่อาจเปนสถานการณที่เลวรายที่สุดที่ชาติเคยเผชิญในรอบกวาศตวรรษ"
 AAT_Sweden_flashpoints.52.a: "เราจะไมยอมใหพวกฝูงชนนี้ทําลายชาติของเรา"
 AAT_Sweden_flashpoints.52.b: "เราตองหยุดการจับกุม เรากําลังทําลายชาติ"

 AAT_Sweden_flashpoints.53.t: "สงครามกลางเมือง[SWE.GetAdjective]ปะทุขึ้น"
 AAT_Sweden_flashpoints.53.desc: "ความรุนแรงประปรายในชวงหลายสัปดาหที่ผานมากําลังรวมตัวกันเปนขบวนการที่มีการจัดตั้งทั่วประเทศ ขบวนการสวนใหญเหลานี้สอดคลองกับ $SWE_communism_party_long$ และอาจถึงขั้นมีความเกี่ยวพันกับ [SOV.GetNameDef]\n\nกองกําลังติดอาวุธคอมมิวนิสตไดยึดพื้นที่เขตเมืองหลายแหงและเริ่มจับกุมผูที่เกี่ยวของกับแผนการกักกันฝายซายของเราเมื่อไมนานมานี้ ในขณะเดียวกัน ฝายชาตินิยมก็กําลังจัดตั้งกองกําลังติดอาวุธขึ้นเชนกัน ซึ่งมักไดรับการสนับสนุนจากตํารวจทองถิ่น เพื่อปองกันไมใหเมืองของตนตกเปนของคอมมิวนิสต ความรุนแรงระหวางทั้งสองกลุมและกองทัพของเราไดบานปลายจนถึงจุดที่ไมอาจถือเปนอยางอื่นนอกจากสงครามกลางเมือง"
 AAT_Sweden_flashpoints.53.a: "การปฏิวัตินี้ควรเกิดขึ้นนานแลว"
 AAT_Sweden_flashpoints.53.b: "เราจะบดขยี้สมุนของ [SOV.GetNameDef] เหลานี้"

 AAT_Sweden_flashpoints.54.t: "ความตึงเครียดใน [SWE.GetName] ลดลง"
 AAT_Sweden_flashpoints.54.desc: "ความตึงเครียดระหวางทางการกับผูที่ตอตานการกักกันนักเคลื่อนไหวฝายซายเมื่อไมนานมานี้เริ่มลดลง แมความไววางใจระหวางรัฐบาลกับประชาชนจะสูญเสียไปมาก แตดูเหมือนเราจะไมเสี่ยงที่สถานการณจะลุกลามเปนความขัดแยงระหวางฝกฝายอีกตอไป"
 AAT_Sweden_flashpoints.54.a: "เกือบไปแลว หวุดหวิดหายนะ"

 AAT_Sweden_flashpoints.56.t: "ขอเสนอเกาะกอตลันด"
 AAT_Sweden_flashpoints.56.desc: "หลังจากนายทหารระดับสูงของกองทัพบกหลายนายเขารวมกับฝายปฏิวัติคอมมิวนิสต ความไววางใจตอเหลาทัพใด ๆ ยกเวนกองทัพเรือก็ตกตํ่าที่สุดเปนประวัติการณ เมื่อความเคลื่อนไหวลาสุดทําใหความปลอดภัยขององคพระมหากษัตริยตกอยูในอันตราย จึงมีการเสนอมาตรการเด็ดขาดเพื่อใหพระองคทรงปลอดภัย กองบัญชาการทหารเรือไดเสนอแผนอันกลาหาญเพื่อกูสถานการณ โดยยายพระมหากษัตริยไปยังเกาะกอตลันด และจัดตั้งรัฐบาลทหารของฝายภักดีเพื่อปกครองประเทศอยางมีประสิทธิภาพมากขึ้นและคอนขางปลอดภัย"
 AAT_Sweden_flashpoints.56.a: "เราจะทิ้งแผนดินใหญไมได"
 AAT_Sweden_flashpoints.56.b: "ขอเสนอที่ยอดเยี่ยม"

 AAT_Sweden_flashpoints.57.t: "พระมหากษัตริยสวีเดนทรงบาดเจ็บระหวางการอพยพ"
 AAT_Sweden_flashpoints.57.desc: "ในเชาตรู รัฐบาลสวีเดนตัดสินใจอพยพพระมหากษัตริยออกจากเมืองหลวงไปยังที่ปลอดภัยกวาบนเกาะกอตลันด ขบวนรถถูกพลพรรคดักซุมโจมตี และรถพระที่นั่งถูกยิงจนกระจกหนาแตกละเอียด\nในการยิงตอสูที่ตามมา พระมหากษัตริยทรงไดรับบาดเจ็บสาหัส พระเนตรขางซายเสียหายถาวร ขณะที่รัฐบาลหนีไปยังเกาะ พวกเขาก็ปฏิญาณวาจะกลับมาควบคุมประเทศในฐานะรัฐบาลอันชอบธรรมของสวีเดน แตมีขาวลือหนาหูวาองคพระมหากษัตริยเองไดทรงเขาควบคุมรัฐบาลไวแทบทั้งหมด ดวยพระราชปณิธานอันแรงกลาที่เกิดขึ้นหลังทรงบาดเจ็บ"
 AAT_Sweden_flashpoints.57.a: "ชางยุงเหยิงซับซอนเสียจริง"

 AAT_Sweden_flashpoints_civil_war_tt: "§Rการลดเสถียรภาพของ [SWE.GetFlag][SWE.GetName] อาจนําไปสูสงครามกลางเมือง หากคอมมิวนิสตยังคงไดรับการสนับสนุนสูง!§!"

 AAT_Sweden_flashpoints.60.t: "[SWE.GetName] ยึดบริษัทลันดสแวรก"
 AAT_Sweden_flashpoints.60.desc: "[SWE.GetName] ไดยึดบริษัทลันดสแวรก ซึ่งเราดําเนินกิจการรวมกับฝาย[SWE.GetAdjective]เพื่อพัฒนายานเกราะ แมประโยชนของลันดสแวรกตอเราจะลดลงในชวงไมกี่ปที่ผานมา แตนี่เปนสัญญาณชัดเจนวา [SWE.GetName] ตองการตีตัวออกหางจาก [GER.GetNameDef]"
 AAT_Sweden_flashpoints.60.a: "ถาเชนนั้นเราจะยึดทรัพยสินของ[SWE.GetAdjective]ใน [THIS.GetNameDef]"
 AAT_Sweden_flashpoints.60.b: "อยางไรเสียลันดสแวรกก็หมดประโยชนแลว"

 AAT_Sweden_flashpoints.61.t: "[FROM.GetName] ยึดทรัพยสินของสวีเดน"
 AAT_Sweden_flashpoints.61.desc: "ในการยกระดับความขัดแยงอยางรุนแรงหลังเรายึดลันดสแวรก รัฐบาล [GER.GetNameDef] ไดตอบโตดวยการยึดทรัพยสินหลายรายการในประเทศของพวกเขาที่เกี่ยวของกับพลเมือง[SWE.GetAdjective] แมเราจะตองการคอย ๆ ตีตัวออกหางจาก [GER.GetNameDef] แตการตัดสินใจนี้ไดสรางความโกรธแคนในหมูสาธารณชน[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.61.a: "มาดูกันวาพวกเขาจะอยูอยางไรเมื่อไมมีการคากับเรา"
 AAT_Sweden_flashpoints.61.b: "ไมนาแปลกใจ แตก็นาเสียดาย"

 AAT_Sweden_flashpoints.62.t: "[FROM.GetName] ประกาศควํ่าบาตรทางการคาตอ [GER.GetNameDef]"
 AAT_Sweden_flashpoints.62.desc: "วันนี้ [SWE.GetNameDef] ไดผลักดันความตึงเครียดใหสูงขึ้นอีกระดับดวยการประกาศควํ่าบาตรทางการคาตอ [GER.GetNameDef] การตัดสินใจนี้จะสงผลกระทบอยางมากตอความสามารถในการผลิตเหล็กสําหรับอุตสาหกรรมอาวุธของเรา"
 AAT_Sweden_flashpoints.62.a: "หากพวกเขาไมคาขายกับเรา เราก็จะไมเคารพพรมแดนของพวกเขาอีกตอไป"
 AAT_Sweden_flashpoints.62.b: "การยกระดับเรื่องนี้จะทําใหเราดูเหมือนตองพึ่งพาชาติเล็ก ๆ เทานั้น"

 AAT_Sweden_flashpoints.63.t: "[FROM.GetNameDefCap] ขูจะทําสงคราม"
 AAT_Sweden_flashpoints.63.desc: "การตัดสินใจควํ่าบาตร [GER.GetNameDef] ของเราเมื่อไมนานมานี้ไดรับความโกรธแคนใน [GER.Capital.GetCapitalVictoryPointName] พวกเขานาจะตื่นตระหนกเพราะตองพึ่งพาแรเหล็กจาก[SWE.GetAdjective]มาโดยตลอด จึงไดยื่นคําขาด โดยระบุวาหากเราไมยกเลิกการควํ่าบาตรทันที พวกเขาจะจําตองใชมาตรการเด็ดขาดตอเรา รวมถึงการทําสงคราม"
 AAT_Sweden_flashpoints.63.a: "ปฏิเสธคําขาดของพวกเขา"
 AAT_Sweden_flashpoints.63.b: "เราไมอาจเสี่ยงตอความขัดแยงเชนนั้น"

 AAT_Sweden_flashpoints.64.t: "[FROM.GetNameDefCap] ปฏิเสธคําขาด"
 AAT_Sweden_flashpoints.64.desc: "[SWE.GetNameDef] ไดปฏิเสธคําขาดของเราอยางหนักแนน โดยระบุวาการโจมตีใด ๆ ตอพวกเขาจะไมชวยใหเราเขาถึงแหลงแรของ[SWE.GetAdjective]ไดดีขึ้น เพราะพวกเขาจะทําลายปลองเหมืองไปนานกอนที่กองทัพของเราจะยึดได"
 AAT_Sweden_flashpoints.64.a: "พวกเขาหาเรื่องใสตัวเอง"
 AAT_Sweden_flashpoints.64.b: "เราอยูไดโดยไมตองพึ่งพวกเขา"

 AAT_Sweden_flashpoints.65.t: "[FROM.GetNameDefCap] ยกเลิกการควํ่าบาตร"
 AAT_Sweden_flashpoints.65.desc: "ในที่สุดรัฐบาล[SWE.GetAdjective]ก็ไดสติและตัดสินใจยกเลิกการควํ่าบาตรตอเรา อาจตองใชเวลากวาการคาระหวางสองชาติจะกลับสูภาวะปกติ แตเราไดแสดงใหพวกเขาเห็นชัดแลววาเรายังมีศักยภาพที่จะทําใหพวกเขาตองคุกเขาไดหากจําเปน"
 AAT_Sweden_flashpoints.65.a: "บัดนี้พวกเขาเขาใจที่ทางของตนในโลกแลว"

 AAT_Sweden_flashpoints.70.t: "เรือที่ซื้อมาออกจากทาเรือของ[ITA.GetAdjective]"
 AAT_Sweden_flashpoints.70.desc: "เรือที่เราเพิ่งซื้อจาก [ITA.GetName] ไดออกจากทาแลว จะใชเวลาประมาณหนึ่งเดือนในการเดินทางมายัง [SWE.GetNameDef] เนื่องจากตองแวะเติมเชื้อเพลิงระหวางทาง"
 AAT_Sweden_flashpoints.70.a: "ขอใหเดินทางปลอดภัย"

 AAT_Sweden_flashpoints.71.t: "อดีตเรือของ[ITA.GetAdjective]กําลังมุงหนาไป [SWE.GetName]"
 AAT_Sweden_flashpoints.71.desc: "วันนี้อดีตเรือพิฆาตของ[ITA.GetAdjective]สี่ลําไดมาถึงทาเรือแหงหนึ่งของเรา เรือเหลานี้ถูกซื้อโดยรัฐบาล[SWE.GetAdjective]และอยูระหวางการสงมอบให [SWE.GetName] ระหวางที่เรือกําลังเติมเชื้อเพลิง เราอาจยึดเรือเหลานี้มาใชเองได แมวาการกระทํานี้นาจะทําลายความสัมพันธกับ [SWE.GetName]"
 AAT_Sweden_flashpoints.71.a: "เราใชเรือพวกนั้นใหเกิดประโยชนไดมากกวา"
 AAT_Sweden_flashpoints.71.b: "เราไมตองการทําลายความสัมพันธกับ [SWE.GetName]"

 AAT_Sweden_flashpoints.72.t: "[ENG.GetName] ยึดเรือใหมของเรา"
 AAT_Sweden_flashpoints.72.desc: "ระหวางแวะพักที่ทาเรือซึ่งอยูในการควบคุมของ[ENG.GetAdjective] เรือใหมสี่ลําของเราถูกกองทัพเรือของพวกเขายึดไป ดูเหมือนพวกเขาใช 'สิทธิ์เรียกเกณฑทรัพยสินของคูกรณีกลาง' เปนขออางในการยึด เราตองระมัดระวังหากตองการไดเรือคืนโดยไมกอสงคราม"
 AAT_Sweden_flashpoints.72.a: "นี่คือการกระทําอันเปนสงคราม พวกเขาตองปลอยเรือ มิฉะนั้นจะตองรับผลที่ตามมา"
 AAT_Sweden_flashpoints.72.b: "เราไมอาจเสี่ยงทําสงครามกับ [ENG.GetName]"

 AAT_Sweden_flashpoints.73.t: "[SWE.GetName] เรียกรองใหปลอยเรือ"
 AAT_Sweden_flashpoints.73.desc: "รัฐบาล[SWE.GetAdjective]ประกาศชัดเจนวาถือวาการยึดเรือของพวกเขาเปนการกระทําอันเปนสงคราม และจะจําตองตอบโตในแบบเดียวกันหากเราไมปลอยเรือทันที"
 AAT_Sweden_flashpoints.73.a: "เราไมมีเจตนาจะปลอยเรือ"
 AAT_Sweden_flashpoints.73.b: "การเก็บเรือไวไมไดประโยชนอะไรนัก"

 AAT_Sweden_flashpoints.74.t: "[SWE.GetName] ยอมรับการกักเรือ"
 AAT_Sweden_flashpoints.74.desc: "ดูเหมือนรัฐบาล[SWE.GetAdjective]จะเลิกพยายามเอาเรือคืนแลว หลังการดัดแปลงเล็กนอย เรือเหลานี้ก็พรอมเขาประจําการในกองทัพเรือของเรา"
 AAT_Sweden_flashpoints.74.a: "พวกเขาไมมีทางเลือก"

 AAT_Sweden_flashpoints.75.t: "[ENG.GetName] ปฏิเสธที่จะปลอยเรือ"
 AAT_Sweden_flashpoints.75.desc: "รัฐบาล[ENG.GetAdjective]ดื้อรั้นไมยอมปลอยเรือที่กักไวของเรา ดูเหมือนทางเดียวที่เราจะไดเรือเหลานั้นคืนคือตองสูเพื่อมัน"
 AAT_Sweden_flashpoints.75.a: "พวกเขาไดศัตรูใหมแลว"
 AAT_Sweden_flashpoints.75.b: "เรื่องนี้ไมคุมที่จะทําสงคราม"

 AAT_Sweden_flashpoints.76.t: "[ENG.GetName] ปลอยเรือ"
 AAT_Sweden_flashpoints.76.desc: "ในที่สุดความตึงเครียดระหวาง [ENG.GetName] และ [SWE.GetName] ก็คลี่คลายลงหลังการปลอยเรือของเรา เห็นไดชัดวาชาว[ENG.GetAdjective]ไมตองการพัวพันกับความขัดแยงกับเราเพราะเรือเกาไมกี่ลํา"
 AAT_Sweden_flashpoints.76.a: "เราตั้งตารอที่จะไดเห็นเรือเหลานั้นเสียที"

 AAT_Sweden_flashpoints.77.t: "เรือใหมมาถึงโดยปลอดภัย"
 AAT_Sweden_flashpoints.77.desc: "เรือที่เราซื้อจาก [ITA.GetNameDef] ไดมาถึงโดยไมมีปญหาใหญใด ๆ ระหวางการเดินทาง แมลูกเรือจะรายงานวาถูกตรวจสอบอยางเขมงวดเมื่อแวะเติมเชื้อเพลิงตามทาเรือตาง ๆ ระหวางทาง"
 AAT_Sweden_flashpoints.77.a: "เรือเหลานี้จะมีประโยชนตอเราอยางมาก"

  FIN_agree_peace_with_SWE: "ฟนแลนดตกลงยกหมูเกาะโอลันดใหเราเพื่อแลกกับสันติภาพ"
 AAT_Sweden_flashpoints.78.t: "[SWE.GetName] ขอควบคุมหมูเกาะโอลันด"
 AAT_Sweden_flashpoints.78.desc: "[SWE.GetName] กังวลมากขึ้นเรื่อย ๆ เกี่ยวกับหมูเกาะโอลันดซึ่งตั้งอยูในตําแหนงทางยุทธศาสตรที่อาจใชควบคุมทะเลบอลติกได\nดวยสถานการณปจจุบันของเรา และการที่ประชากรสวนใหญบนหมูเกาะเปนชาว[SWE.GetAdjective] รัฐบาลของพวกเขาจึงสอบถามวาเราจะยินยอมยกหมูเกาะใหจนกวาโลกจะกลับสูความมั่นคงหรือไม โดยอางถึงความตองการปองกันไมใหหมูเกาะตกอยูในมือฝายศัตรู และความจําเปนตองปกปองพลเมือง[SWE.GetAdjective]"
 AAT_Sweden_flashpoints.78.a: "โอลันดเปนของเรา และจะเปนเชนนั้นตลอดไป"
 AAT_Sweden_flashpoints.78.b: "เปนทางเลือกที่ถูกตอง"
 AAT_Sweden_flashpoints.78.c: "หาก [SWE.GetName] จายคาชดเชยใหเรา"
 AAT_Sweden_flashpoints.79.t: "[FIN.GetName] ปฏิเสธ"
 AAT_Sweden_flashpoints.79.desc: "[FIN.GetName] ตอบ ‘ไม’ อยางตรงไปตรงมาตอคําถามเรื่องการโอนการควบคุมหมูเกาะโอลันด"
 AAT_Sweden_flashpoints.79.a: "นาเสียดาย"
 AAT_Sweden_flashpoints.80.t: "[FIN.GetName] ยอมรับ"
 AAT_Sweden_flashpoints.80.desc: "ดวยสถานการณที่ลอแหลม พวกเขาขอใหเราควบคุมหมูเกาะดีกวาปลอยใหผูยึดครองตางชาติเขามา ชาวพื้นเมืองซึ่งสวนใหญพูดภาษา[SWE.GetAdjective]อยูแลวตางยอมรับเรื่องนี้ไดดี และชีวิตของพวกเขาก็ดําเนินไปตามปกติ"
 AAT_Sweden_flashpoints.80.a: "ยอดเยี่ยม"
 AAT_Sweden_flashpoints.81.t: "[FIN.GetName] ยอมรับ แตมีคาตอบแทน"
 AAT_Sweden_flashpoints.81.desc: "[FIN.GetName] ยอมรับวาพรอมจะปลอยหมูเกาะโอลันด แตเนนยํ้าวาขณะนี้พวกเขากําลังขาดแคลนเงินทุนอยางมาก\nพวกเขายินดีใหเราควบคุมหมูเกาะเพื่อแลกกับเงินจํานวนหนึ่งจากทุนสํารองของรัฐเรา เพื่อชดเชยรายไดที่สูญเสียไป"
 AAT_Sweden_flashpoints.81.a: "คุมคา"
 AAT_Sweden_flashpoints.81.b: "ไม"
 AAT_Sweden_flashpoints.82.t: "[SWE.GetName] ตกลง"
 AAT_Sweden_flashpoints.82.desc: "[SWE.GetName] ไดตกลงจายคาชดเชยใหเราสําหรับหมูเกาะโอลันด เมื่อการโอนเริ่มขึ้น ไดมีพิธีเล็ก ๆ จัดขึ้น และแมชาวโอลันดบางสวนจะกังวลถึงอนาคตของตนอยางเขาใจได แตทางการ[SWE.GetAdjective]ไดแถลงวาการเปลี่ยนผานจะเปนไปอยางราบรื่นที่สุด และพวกเขาเคารพวิถีชีวิตของชาวเกาะ"
 AAT_Sweden_flashpoints.82.a: "คาใชจายที่จําเปน"
 AAT_Sweden_flashpoints.83.t: "[SWE.GetName] ปฏิเสธ"
 AAT_Sweden_flashpoints.83.desc: "[SWE.GetName] ตัดสินใจวาไมยินดีจะใชทุนสํารองจํานวนมากขนาดนั้นเพื่อการโอนหมูเกาะโอลันด"
 AAT_Sweden_flashpoints.83.a: "ถาเชนนั้นพวกเขาก็ไมไดอยากไดมากพอ"


 AAT_Sweden_BoP.10.t: "การหาเสียงเลือกตั้ง - นโยบายเศรษฐกิจ"
 AAT_Sweden_BoP.10.desc: "ฤดูการเลือกตั้งเวียนมาถึงอีกครั้ง และบรรดาพรรคการเมืองที่แขงขันกันชิงอํานาจในรัฐสภาริกสดักตางออกหาเสียงกันอยางคึกคัก ประเด็นหลักที่ดูเหมือนจะดึงความสนใจของผูมีสิทธิเลือกตั้งคือเศรษฐกิจ ขณะที่บางฝายสนับสนุนใหดําเนินนโยบายเดิมตอไป อีกฝายตองการการเปลี่ยนแปลงอยางถอนรากถอนโคน แตดูเหมือนจะมีเพียงทางเลือกเดียวที่ไดรับความนิยมในประเด็นนี้"
 AAT_Sweden_BoP.10.a: "เศรษฐกิจตองดําเนินการโดยและเพื่อชนชั้นแรงงาน"
 AAT_Sweden_BoP.10.b: "เราตองหาจุดกึ่งกลางระหวางทุนนิยมสุดโตงกับคอมมิวนิสตสุดโตง"
 AAT_Sweden_BoP.10.c: "ทําไมเราตองบีบคั้นผูประสบความสําเร็จที่สุดในสังคมดวยภาษีที่มากเกินไปเชนนี้?"
 AAT_Sweden_BoP.10.d: "การขยายกองทัพจะชวยลดการวางงานและเพิ่มความมั่นคงของชาติ"

 AAT_Sweden_BoP.11.t: "การหาเสียงเลือกตั้ง - นโยบายสังคม"
 AAT_Sweden_BoP.11.desc: "การหาเสียงเลือกตั้งดูเหมือนจะเปลี่ยนมาสูนโยบายสังคม โดยพรรคตาง ๆ ประกาศวาจะแกไขปญหาของสังคมอยางไร ขณะที่บางพรรคสนับสนุนการปรับโครงสรางรัฐบาลอยางถอนรากถอนโคนเพื่อแกปญหา พรรคอื่น ๆ กลับเลือกแนวทางที่ระมัดระวังกวาดวยการเปลี่ยนแปลงทีละขั้น อยางไรก็ตาม ดูเหมือนจะมีเพียงสารเดียวที่โดนใจผูมีสิทธิเลือกตั้ง"
 AAT_Sweden_BoP.11.a: "จะไมมีความเทาเทียมทางสังคม จนกวาชนชั้นกระฎมพีจะถูกขับออกจากอํานาจ"
 AAT_Sweden_BoP.11.b: "การเขาถึงการศึกษาและการรักษาพยาบาลที่ดีขึ้นจะชวยยกระดับผูคนใหพนจากความยากจน"
 AAT_Sweden_BoP.11.c: "เราตองทํามากกวานี้เพื่อสนับสนุนผูคนนอกเมืองใหญ"
 AAT_Sweden_BoP.11.d: "เราลืมไปแลววาการเปนชาว[ROOT.GetAdjective]หมายถึงอะไร เราตองการการศึกษาที่ปลูกฝงความรักชาติมากขึ้น"

 AAT_Sweden_BoP.12.t: "การหาเสียงเลือกตั้ง - นโยบายตางประเทศ"
 AAT_Sweden_BoP.12.desc: "เมื่อวันเลือกตั้งใกลเขามา การอภิปรายไดเปลี่ยนไปสูเรื่องเรงดวนอยางความมั่นคงของชาติและนโยบายตางประเทศ หลายพรรคสนับสนุนความเปนกลางและนโยบายโดดเดี่ยวเพื่อรักษาความปลอดภัยของชาติ ขณะที่พรรคอื่น ๆ ผลักดันแนวทางนโยบายตางประเทศที่แข็งกราวขึ้น เมื่อโลกอยูในสภาวะอันตรายเชนนี้ ดูเหมือนจะมีเพียงสารเดียวที่มอบความหวังใหผูมีสิทธิเลือกตั้ง"
 AAT_Sweden_BoP.12.a: "กรรมกรทั่วโลกตองรวมพลังตอตานสงครามรุกรานของจักรวรรดินิยม"
 AAT_Sweden_BoP.12.b: "เราตองรักษาความเปนกลางควบคูกับการพัฒนากองทัพที่แข็งแกรงเพื่อยับยั้งศัตรู"
 AAT_Sweden_BoP.12.c: "เราออนแอและเปราะบาง เราตองเตรียมพรอมสําหรับสงครามใหดีกวานี้"
 AAT_Sweden_BoP.12.d: "หนทางเดียวที่จะรักษาสันติภาพในภูมิภาคคือการแสดงอํานาจควบคุมเหนือภูมิภาคนี้"

 AAT_Sweden_BoP.14.t: "ผลการเลือกตั้ง"
 AAT_Sweden_BoP.14.d_socialist: "วันเลือกตั้งมาถึงแลว และผูมีสิทธิเลือกตั้งไดตัดสินใจแลว $SWE_communism_party_long$ จะจัดตั้งรัฐบาลเสียงขางมากในอีกไมกี่วันขางหนา ดูเหมือนนโยบายสุดโตงเรื่องการโอนกิจการเปนของรัฐ ความเปนปกแผนทางชนชั้น และการปฏิเสธการพัวพันกับจักรวรรดินิยมตางชาติ จะชนะใจสาธารณชน ยังตองรอดูวาคําสัญญาของพวกเขาจะเปนจริงไดมากนอยเพียงใด"
 AAT_Sweden_BoP.14.d_democratic: "วันเลือกตั้งมาถึงแลว และผูมีสิทธิเลือกตั้งไดตัดสินใจแลว $SWE_democratic_party_long$ จะจัดตั้งรัฐบาลเสียงขางมากในอีกไมกี่วันขางหนา แมบางคนเชื่อวาคําสัญญาเรื่องฟอลกเฮมเม็ต (บานของประชาชน) ไดกลายเปนเรื่องจืดชืดสําหรับผูมีสิทธิเลือกตั้งไปแลว แตผลลัพธนี้พิสูจนวาพวกเขาคิดผิด สิ่งที่เหลืออยูคือการสานตอสิ่งที่พวกเขาไดเริ่มไวใหสําเร็จ"
 AAT_Sweden_BoP.14.d_non_aligned: "วันเลือกตั้งมาถึงแลว และผูมีสิทธิเลือกตั้งไดตัดสินใจแลว $SWE_neutrality_party_long$ จะจัดตั้งรัฐบาลเสียงขางมากในอีกไมกี่วันขางหนา แผนเสริมสรางการปองกันประเทศและนโยบายเพื่อดึงคะแนนเสียงชาวชนบทของพวกเขาประสบความสําเร็จอยางชัดเจน บัดนี้พวกเขาตองสราง [ROOT.GetName] ในแบบอุดมคติที่ไดโฆษณาไวระหวางการเลือกตั้งใหเปนจริง"
 AAT_Sweden_BoP.14.d_fascist: "วันเลือกตั้งมาถึงแลว และผูมีสิทธิเลือกตั้งไดตัดสินใจแลว $SWE_fascism_party_long$ จะจัดตั้งรัฐบาลเสียงขางมากในอีกไมกี่วันขางหนา และดูเหมือนจะไมมีใครประหลาดใจกับผลลัพธนี้มากเทาตัวพวกเขาเอง ยังไมแนชัดวากลไกประชาธิปไตยของ [ROOT.GetName] จะอยูรอดภายใตระบอบใหมไดนานเพียงใด"
 AAT_Sweden_BoP.14.d_left: "วันเลือกตั้งมาถึงแลว และแมพรรคตาง ๆ จะพยายามอยางเต็มที่ แตไมมีพรรคใดไดที่นั่งเสียงขางมากในรัฐสภาริกสดัก อยางไรก็ตาม พรรคสังคมนิยมและพรรคสังคมประชาธิปไตยสามารถตกลงกันจัดตั้งรัฐบาลผสมได ยังไมแนชัดวารัฐบาลผสมจะอยูครบวาระหรือไม แตบางทีความกลัวฝายขวาอาจชวยใหพวกเขาจับมือกันไวได"
 AAT_Sweden_BoP.14.d_right: "วันเลือกตั้งมาถึงแลว และแมพรรคตาง ๆ จะพยายามอยางเต็มที่ แตไมมีพรรคใดไดที่นั่งเสียงขางมากในรัฐสภาริกสดัก อยางไรก็ตาม พรรคอนุรักษนิยมและพรรคฟาสซิสตสามารถตกลงกันจัดตั้งรัฐบาลผสมได ยังไมแนชัดวารัฐบาลผสมจะอยูครบวาระหรือไม แตบางทีความกลัวฝายซายอาจชวยใหพวกเขาจับมือกันไวได"
 AAT_Sweden_BoP.14.a: "ประชาชนไดสงเสียงแลว"

 SWE_folkhemmet_event_result_tt: "หลังจากใชนโยบายนี้ จิตวิญญาณฟอลกเฮมเม็ตจะมีคาดังนี้:\n"

 AAT_Sweden_strike.1.t: "ความไมสงบใน [?SWE.GetNameDef]"
 AAT_Sweden_strike.1.desc: "ความเปนไปไดที่จะเกิดการปดลอมดานอาหารเหมือนที่เคยเผชิญในชวงมหาสงคราม ไดนําไปสูการประทวงในหมูแรงงาน[SWE.GetAdjective] ดวยการปลุกปนของนักเคลื่อนไหวหัวรุนแรงในทองถิ่น ความไมสงบไดลุกลามจากโรงงานจนกลายเปนปญหาทั่วประเทศ เราตองทําใหสถานการณมีเสถียรภาพ และทําใหรัฐบาลไดรับการมองวาเปนผูนําที่เขมแข็งในยามที่ไมแนนอนเชนนี้"
 AAT_Sweden_strike.1.a: "ตอนนี้เราทําอะไรไมไดนอกจากรอ"
 AAT_Sweden_strike.1.b: "เราตองลงทุนเพื่อปลุกขวัญกําลังใจของประชาชนและสงบสถานการณนี้" 

 AAT_Sweden_strike.2.t: "การจลาจลทั่วประเทศ"
 AAT_Sweden_strike.2.desc: "นาเสียดายที่ความพยายามของเราในการยับยั้งการประทวงลมเหลว ดูเหมือนคนงานโรงงาน ชางเย็บผา และชางไมแทบทุกคนจะออกมาประทวงบนทองถนนเพื่อตอตานนโยบายของรัฐบาล ที่เลวรายยิ่งกวานั้น การประทวงหลายแหงกําลังกลายเปนความรุนแรง ทําใหทั้งพลเรือนและเจาหนาที่ผูบังคับใชกฎหมายไดรับบาดเจ็บ"
 AAT_Sweden_strike.2.a: "เดี๋ยวพวกเขาก็คิดไดเอง"
 AAT_Sweden_strike.2.b: "เราตองหยุดเรื่องนี้ทันที"

 AAT_Sweden_nationalists.1.t: "พรรคชาติสังคมนิยม[SWE.GetAdjective]ขอใหแทรกแซง"  
 AAT_Sweden_nationalists.1.desc: "ตัวแทนจากพรรคชาติสังคมนิยมชั้นนําใน [SWE.GetName] ไดติดตอเรามาพรอมกับโอกาสครั้งหนึ่ง พวกเขากําลังอยูระหวางการโคนลมรัฐบาลปจจุบันและไดรองขอการสนับสนุนจากเรา เพื่อแลกกับการสนับสนุนทางทหาร พวกเขาตกลงจะนําประเทศเขามาอยูในเขตอิทธิพลของเราอยางมั่นคง"
 AAT_Sweden_nationalists.1.a: " เราไมมีทหารเหลือพอจะสงไป แตเราสงความชวยเหลือบางสวนใหได"
 AAT_Sweden_nationalists.1.b: "เราจะสนับสนุนพวกเขา"

 AAT_Sweden_nationalists.2.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอ"  
 AAT_Sweden_nationalists.2.desc: "รัฐบาล[GER.GetAdjective]ไดปฏิเสธขอเสนอของเรา ดวยเหตุผลวาไมตองการสรางแนวหนาใหมใหกองทัพที่ขยายกําลังเกินตัวอยูแลว อยางไรก็ตาม พวกเขาไดสงปนไรเฟลและอาสาสมัครจํานวนหนึ่งมาเพื่อแสดงไมตรีจิต"
 AAT_Sweden_nationalists.2.a: "ดีกวาไมมีอะไรเลย"

 AAT_Sweden_nationalists.3.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอ"  
 AAT_Sweden_nationalists.3.desc: "ผูนํา[GER.GetAdjective]ไดตกลงสนับสนุนเราทางทหารในการยึดอํานาจควบคุมประเทศ เพื่อแลกกับการสนับสนุนนี้ เราตกลงจะเปนสวนหนึ่งของเขตอิทธิพลอันกวางใหญของพวกเขาบนภาคพื้นทวีป หวังวาสักวันหนึ่งพวกเขาจะมองเราอยางเทาเทียม"
 AAT_Sweden_nationalists.3.a: "เราจะผงาดขึ้นจากเถาถาน แข็งแกรงกวาที่เคย!"

 AAT_Sweden_nationalists.4.t: "รวมขบวนการชาติสังคมนิยมเปนหนึ่งเดียว"
 AAT_Sweden_nationalists.4.desc: "ขบวนการชาติสังคมนิยมแตกแยกเกินกวาจะยึดอํานาจใน [SWE.GetName] ได หากตองการเปลี่ยนแปลงสิ่งนี้ ขบวนการตองหยุดทะเลาะกันเองเรื่องหยุมหยิม และรวมพลังอยูเบื้องหลังผูนําที่แทจริงเพียงหนึ่งเดียวของเรา"
 AAT_Sweden_nationalists.4.a: "$SWE_sven_olov_lindholm$ สามารถรวมกลุมชาตินิยมตาง ๆ ใหเปนหนึ่งเดียวได"
 AAT_Sweden_nationalists.4.b: "$SWE_birger_furugard$ ถูกลิขิตใหเปนผูนําของ [SWE.GetName]"

 AAT_Sweden_nationalists.5.t: "การเดินขบวนของหนวยสตอรมทรุปเปอรใน [FROM.FROM.GetName] จบลงอยางหายนะ"
 AAT_Sweden_nationalists.5.desc: "ความกลัววาผูประทวงฝายตรงขามจะกอกวนการเดินขบวนของหนวยสตอรมทรุปเปอรใน [FROM.FROM.GetName] กลายเปนจริงในวันนี้ เมื่อทั้งสองกลุมปะทะกันอยางรุนแรงบนทองถนน มีผูบาดเจ็บและเสียชีวิตจํานวนมากทั้งสองฝาย แตทายที่สุดดูเหมือนความเห็นของสาธารณชนจะเขาขางฝายตอตานฟาสซิสต เมื่อหนวยสตอรมทรุปเปอรตองหลบเขาไปในรานคาทองถิ่นจนกวาตํารวจจะมาถึง"
 AAT_Sweden_nationalists.5.a: "พวกเขากําลังเสียแรงสง"

 AAT_Sweden_nationalists.6.t: "การเดินขบวนของหนวยสตอรมทรุปเปอรใน [FROM.FROM.GetName] ผานไปอยางเงียบเหงา"
 AAT_Sweden_nationalists.6.desc: "การเดินขบวนของหนวยสตอรมทรุปเปอรใน [FROM.FROM.GetName] วันนี้จืดชืดอยางนาประหลาดใจ ผูจัดรวบรวมสมาชิกไดเพียงหยิบมือ และนํากลุมคนจับฉายนี้เดินขบวนไปตามถนนสายหลัก ขณะที่ผูคนยังคงทําธุระของตนตอไป แมจะมีผูเขารวมนอยนิด แตหนวยสตอรมทรุปเปอรก็กําลังกลายเปนสวนหนึ่งที่ขาดไมไดของการเมือง[SWE.GetAdjective]"
 AAT_Sweden_nationalists.6.a: "พวกเขากําลังคอย ๆ สรางแรงสง"

 AAT_Sweden_nationalists.7.t: "การเดินขบวนของหนวยสตอรมทรุปเปอรใน [FROM.FROM.GetName] ประสบความสําเร็จ"
 AAT_Sweden_nationalists.7.desc: "ดวยการสนับสนุนของตํารวจทองถิ่นที่คอยกันผูประทวงฝายตรงขามไว หนวยสตอรมทรุปเปอรสามารถจัดการเดินขบวนครั้งใหญใน [FROM.GetName] ได ขณะเดินผานถนนสายหลักของเมือง ผูเดินขบวนไดรับเสียงเชียรอยางกระตือรือรนจากประชาชนที่ยืนเรียงรายสองขางทาง"
 AAT_Sweden_nationalists.7.a: "พวกเขาจะสราง [SWE.GetName] ขึ้นใหม"


 AAT_Sweden_nationalists.8.t: "ชนชั้นสูงเสนอการสนับสนุน"
 AAT_Sweden_nationalists.8.desc: "ชนชั้นสูงไมพอใจมานานที่อิทธิพลของพวกเขาในกิจการของชาติถูกลดทอนลงเพื่อเอื้อใหเจาหนาที่ที่มาจากการเลือกตั้ง หลายคนจึงตกลงใชทรัพยากรที่เหลืออยูสนับสนุนขบวนการชาตินิยมของเรา เพื่อแลกกับการไดรับสัมปทานทางการเมืองบางอยางเมื่อขบวนการไดควบคุมรัฐสภาริกสดัก"
 AAT_Sweden_nationalists.8.a: " ราคาเพียงเล็กนอยเพื่อฟนฟูชาติสูความยิ่งใหญ"

 AAT_Sweden_nationalists.9.t: "นักอุตสาหกรรมเสนอการสนับสนุน"
 AAT_Sweden_nationalists.9.desc: " อุตสาหกรรม[SWE.GetAdjective]ตองแขงขันกับคูแขงตางชาติอยางยากลําบากมากขึ้นเรื่อย ๆ เนื่องจากการแทรกแซงของพรรคสังคมประชาธิปไตยและสมาพันธแรงงาน (Landsorganisationen) นักอุตสาหกรรมชั้นนําจํานวนหนึ่งจึงตกลงจะสนับสนุนขบวนการชาตินิยมของเรา หากเราตกลงยุบสหภาพแรงงานใหสิ้นซาก"
 AAT_Sweden_nationalists.9.a: "สหภาพแรงงานจะถูกกําจัด"

 AAT_Sweden_nationalists.10.t: "นายทหารเสนอการสนับสนุน"
 AAT_Sweden_nationalists.10.desc: "มีนายทหารไมนอยที่ผิดหวังกับการบริหารการปองกันประเทศที่ลมเหลวภายใตรัฐบาลปจจุบัน นายทหารอาวุโสหลายนายจากกองทัพบกและกองทัพเรือจึงตกลงวาจะชวยเหลือขบวนการชาตินิยม เพื่อแลกกับการเพิ่มงบประมาณกลาโหมเมื่อเราขึ้นสูอํานาจ"
 AAT_Sweden_nationalists.10.a: "[SWE.GetName] จะกลับมาเปนมหาอํานาจอีกครั้ง"

 AAT_Sweden_nationalists.11.t: "แรงสนับสนุนจากชนบทเพิ่มพูน"
 AAT_Sweden_nationalists.11.desc: "ผูคนจํานวนมากนอกเขตเมืองของ [SWE.GetName] รูสึกถูกทอดทิ้งจากนโยบายของพรรคสังคมประชาธิปไตย ยิ่งไปกวานั้น พวกเขารูสึกถูกคุกคามจากการพัฒนาอุตสาหกรรมและกังวลวาวิถีชีวิตดั้งเดิมของตนกําลังถูกกัดกรอน ดวยการหวานเมล็ดพันธุแหงความไมพอใจในหมูพวกเขา เราไดสรางกระแสสนับสนุนอันทวมทนใหแกขบวนการชาตินิยมที่สัญญาจะลงทุนในชนบทและฟนฟูคานิยมดั้งเดิม" 
 AAT_Sweden_nationalists.11.a: "ชาวชนบทคือกระดูกสันหลังของชาติ"

 AAT_Sweden_nationalists.16.t: "การเสด็จเยือน [FROM.FROM.GetName] จบลงอยางหายนะ"
 AAT_Sweden_nationalists.16.desc: "วันนี้กลุมตอตานระบอบกษัตริยหลายกลุมประสบความสําเร็จในการกอกวนการเสด็จเยือน [FROM.FROM.GetName] ของพระมหากษัตริย แมตํารวจจะพยายามอยางเต็มที่ในการควบคุมผูประทวง แตพวกเขาก็สามารถปดกั้นเสนทางเสด็จของรถพระที่นั่งได จนตองยกเลิกการเสด็จเพราะเกรงวาจะถูกนําเขาสูสถานการณที่อันตรายยิ่งกวา"
 AAT_Sweden_nationalists.16.a: "สามัญชนไมมีความเคารพตอผูที่อยูเหนือกวา"

 AAT_Sweden_nationalists.17.t: "การเสด็จเยือน [FROM.FROM.GetName] ผานไปอยางเงียบเหงา"
 AAT_Sweden_nationalists.17.desc: "การเสด็จเยือน [FROM.FROM.GetName] คอนขางจืดชืด แมพระมหากษัตริยทรงหวังวาจะมีฝูงชนมารอรับเสด็จ แตกลับมีผูสนับสนุนเพียงหยิบมือยืนอยูริมถนน มีผูไดยินวาพระองคทรงไมพอพระทัยและทรงรูสึกอับอายกับสถานการณนี้อยางยิ่ง และทรงตั้งพระทัยวาจะไมเขารวมกิจกรรมไรสาระเชนนี้อีกในอนาคต"
 AAT_Sweden_nationalists.17.a: "พระองคตองทําเชนนี้ตอไปเพื่อสรางแรงสนับสนุน"

 AAT_Sweden_nationalists.18.t: "การเสด็จเยือน [FROM.FROM.GetName] ประสบความสําเร็จ"
 AAT_Sweden_nationalists.18.desc: "การเสด็จเยือน [FROM.FROM.GetName] ของพระมหากษัตริยไดชวยเพิ่มความนิยมในองคพระประมุขอยางมาก ผูสนับสนุนตางยืนเรียงรายสองขางทางดวยความปติ โบกธง[SWE.GetAdjective]และโปรยดอกไมนําหนาพระองค แมจะมีผูไมเห็นดวยอยูบาง แตตํารวจทองถิ่นก็กันพวกเขาไวใหหางจากขบวนเสด็จ"
 AAT_Sweden_nationalists.18.a: "ดวยแรงสนับสนุนเชนนี้ เราจะฟนฟูพระราชอํานาจของพระมหากษัตริยได"

 AAT_Sweden_nationalists.19.t: "ฟกากับพระมหากษัตริย"
 AAT_Sweden_nationalists.19.desc: "ระหวางการชุมนุมลับที่พระราชวังใน [SWE.Capital.GetCapitalVictoryPointName] ผูนําขบวนการชาตินิยมตาง ๆ ไดเขาเฝาพระมหากษัตริยเพื่อหารือถึงความปรารถนาที่จะเห็น [SWE.GetName] กลับคืนสูความรุงเรืองในอดีต หลังการหารืออันยาวนานวาจะประสานขบวนการตาง ๆ ใหเปนหนึ่งเดียวอยางไร ก็ไดขอสรุปวาเมื่อถึงเวลาอันเหมาะสม พระเจากุสตาฟควรทรงกลับมาเปนผูปกครองที่แทจริงแทนที่จะเปนเพียงประมุขในนาม พระองคยังทรงลังเลที่จะผูกมัดกับแผนการเชนนี้ แตก็ทรงตกลงจะมีบทบาทในกิจการการเมืองมากขึ้น โดยเริ่มจากการเสด็จเยือนทั่วราชอาณาจักรเพื่อหยั่งเสียงสนับสนุนจากประชาชน"
 AAT_Sweden_nationalists.19.a: "เราตองแสดงใหพระมหากษัตริยเห็นวายังไมสายเกินไปสําหรับชาติอันยิ่งใหญของเรา"

 AAT_Sweden_nationalists.20.t: "[FROM.GetName] ตองการขยายการควบคุม"
 AAT_Sweden_nationalists.20.desc: "[FROM.GetName] รัฐในอารักขาผูภักดีของเรา ไดขอใหเราขยายความรับผิดชอบของพวกเขาดวยการมอบดินแดนทางตอนเหนือของ [SOV.GetName] ให สิ่งนี้จะชวยใหเราถายโอนภาระการยึดครองไปยังรัฐในอารักขาของเรา และทุมเทความพยายามไปที่ศัตรูตัวฉกาจได"
 AAT_Sweden_nationalists.20.a: "เปนแผนที่ดี"
 AAT_Sweden_nationalists.20.b: "ดินแดนทั้งหมดเปนของไรช!"

 AAT_Sweden_nationalists.21.t: "[FROM.GetName] มอบการควบคุมใหเรา"
 AAT_Sweden_nationalists.21.desc: "เบอรลินตัดสินใจมอบความรับผิดชอบเพิ่มเติมใหเรา ดวยการสงมอบดินแดนทางเหนือในสัดสวนที่มากขึ้น ซึ่งเทากับเปนการจัดตั้งไรชสคอมมิสซาเรียตนอรดลันดอยางแทจริง"
 AAT_Sweden_nationalists.21.a: "อิทธิพลของเราเติบโตขึ้น"

 AAT_Sweden_nationalists.22.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 AAT_Sweden_nationalists.22.desc: "เบอรลินตัดสินใจไมอนุมัติคําขอของเรา โดยอางวาเรายังไมพรอมสําหรับความรับผิดชอบมหาศาลที่มาพรอมกับการโอนดินแดนขนาดใหญเชนนี้ บางทีพวกเขาอาจกลัวที่จะใหอํานาจแกไรชสคอมมิสซาเรียตมากเกินไป?"
 AAT_Sweden_nationalists.22.a: "บางทีนี่อาจเปนความผิดพลาด.."

 AAT_Sweden_nationalists.23.t: "มีดในความมืด"
 AAT_Sweden_nationalists.23.desc: "[SWE.GetName] รัฐหุนเชิดของ[GER.GetAdjective] ไดสงทูตมาหาเราในภารกิจลับโดยที่เจาเหนือหัวของพวกเขาไมรู รัฐ[SWE.GetAdjective]มองเห็นลางรายแลว และกําลังหาทางออกจากความขัดแยงนี้ จึงมาหาเราพรอมขอเสนอ ขณะนี้พวกเขากําลังเตรียมการแปรพักตรครั้งใหญ เพื่อพยายามยึดแผนดินใหญของ[GER.GetAdjective]ในขณะที่กองกําลังของพวกเขาติดพันอยูที่อื่น แตพวกเขาเนนยํ้าวาไมสามารถทําสงครามสองแนวรบกับทั้งเราและเจาเหนือหัวได พวกเขาเสนอใหเราแสดงละครตอไปกอน แตเมื่อพวกเขาเปลี่ยนขาง ใหเราลงนามสนธิสัญญาสันติภาพโดยไมมีเงื่อนไขและสูเคียงบาเคียงไหลกัน\nบางครั้งมีดในความมืดก็มีประสิทธิภาพกวาไมกระทุงประตูกลางแสงตะวัน"
 AAT_Sweden_nationalists.23.a: "เปนความคิดที่ยอดเยี่ยม"
 AAT_Sweden_nationalists.23.a_tt: "§Y[SWE.GetName]§! จะกอกบฏตอเจาเหนือหัวของตนเมื่อถึงเวลาอันควร และเขารวมสูรบกับเรา"
 AAT_Sweden_nationalists.23.b: "ฟาสซิสตทุกคนตองถูกลงโทษ"

 AAT_Sweden_nationalists.24.t: "[FROM.GetName] ยอมรับขอเสนอของเรา"
 AAT_Sweden_nationalists.24.desc: "[FROM.GetName] ไดยอมรับขอเสนอของเรา เมื่อถึงเวลาอันเหมาะสม พวกเขาจะตกลงสันติภาพโดยไมมีเงื่อนไข เพื่อที่เราจะไดรวมกันโคน [GER.GetName]"
 AAT_Sweden_nationalists.24.a: "เปนมาตรการที่สิ้นหวังแนนอน แตก็จําเปน"

 AAT_Sweden_nationalists.25.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 AAT_Sweden_nationalists.25.desc: "[FROM.GetName] ไดปฏิเสธขอเสนอของเรา มันเปนความหวังอันริบหรี่ แตก็คุมที่จะลองเมื่อพิจารณาถึงสถานการณอันสิ้นหวังที่เราเผชิญอยู"
 AAT_Sweden_nationalists.25.a: "ดูเหมือนเราจะโดดเดี่ยว"

 AAT_Sweden_nationalists.26.t: "[FROM.GetName] กอกบฏ"
 AAT_Sweden_nationalists.26.desc: "เชาตรูวันนี้เราขาดการติดตอกับผูแทนของเราใน [FROM.GetName] และดูเหมือนกองพลนอยไมกี่หนวยที่ปฏิบัติหนาที่รักษาการณจะยอมจํานนทั้งหมด การโทรศัพทไปขอคําอธิบายจากรัฐบาล[SWE.GetAdjective]ไดรับเพียงความเงียบ บัดนี้เห็นไดชัดวารัฐหุนเชิดที่ดื้อดานของเรามีแผนการที่ยิ่งใหญกวาสําหรับตัวเอง ซึ่งไมมีเราอยูในนั้น"
 AAT_Sweden_nationalists.26.a: "บาเอย"

 AAT_Sweden_nationalists.27.t: "[FROM.GetName] อางสิทธิ์ดินแดนของ[FIN.GetAdjective]"
 AAT_Sweden_nationalists.27.desc: "[FROM.GetName] รัฐในอารักขาผูภักดีของเรา ไดขอใหเราขยายความรับผิดชอบของพวกเขาดวยการมอบดินแดนใน [FIN.GetName] ให สิ่งนี้จะชวยใหเราถายโอนภาระการยึดครองไปยังรัฐในอารักขาของเรา และทุมเทความพยายามไปที่ศัตรูตัวฉกาจได"
 AAT_Sweden_nationalists.27.a: "เปนความคิดที่ยอดเยี่ยม"

 AAT_Sweden_nationalists.28.t: "$AAT_Sweden_nationalists.21.t$"
 AAT_Sweden_nationalists.28.desc: "$AAT_Sweden_nationalists.21.desc$"
 AAT_Sweden_nationalists.28.a: "$AAT_Sweden_nationalists.21.a$"

 AAT_Sweden_nationalists.29.t: "$AAT_Sweden_nationalists.22.t$"
 AAT_Sweden_nationalists.29.desc: "$AAT_Sweden_nationalists.22.desc$"
 AAT_Sweden_nationalists.29.a: "$AAT_Sweden_nationalists.22.a$"

 AAT_Sweden_nationalists.30.t: "[FROM.GetName] อางสิทธิ์ดินแดนของ[FIN.GetAdjective]"
 AAT_Sweden_nationalists.30.desc: "[SWE.GetName] รัฐหุนเชิดของ[GER.GetAdjective] ไดขอใหอดอลฟ ฮิตเลอร รับรองการอางสิทธิ์เหนือดินแดนของเรา เปนการอางสิทธิ์อันไรนํ้าหนักที่มีไวเพียงเพื่อตอบสนองการขยายดินแดนอยางบาคลั่งของทั้งสองฝาย"
 AAT_Sweden_nationalists.30.a: "อุบายอันชั่วราย"
  
 AAT_Sweden_nordic_defense_council.1.t: "สวีเดนเชิญเราเขารวมสภาปองกันนอรดิก"
 AAT_Sweden_nordic_defense_council.1.desc: "ขณะที่โลกเตรียมรับการปะทะที่หลีกเลี่ยงไมไดระหวางมหาอํานาจยุโรป ประเทศนอรดิกก็เสี่ยงที่จะถูกเหยียบยํ่าในการโจมตีอันดุเดือดที่จะตามมา รัฐบาล[FROM.GetAdjective]เสนอใหประเทศนอรดิกของเราจัดตั้งกองทัพรวมกัน เพื่อที่เราจะไดสรางการปองกันที่เปนเอกภาพยิ่งขึ้นรวมกัน"
 AAT_Sweden_nordic_defense_council.1.a: "เรามีแผนอื่น"
 AAT_Sweden_nordic_defense_council.1.b: "เราจะเขารวมในฐานะสมาชิกฝาย"
 AAT_Sweden_nordic_defense_council.1.c:  "เราจะเขารวมในฐานะสมาชิกสภาแบบบูรณาการ"

 AAT_Sweden_nordic_defense_council.2.t: "[FROM.GetName] เขารวมสหภาพปองกันนอรดิก"
 AAT_Sweden_nordic_defense_council.2.desc: "[FROM.GetName] ไดตัดสินใจเขารวมสหภาพของเรา อยางนอยตอนนี้หากเกิดเรื่องที่ไมอาจคาดคิดขึ้น เราก็ไมไดอยูตามลําพัง"
 AAT_Sweden_nordic_defense_council.2.a: "ยอดเยี่ยม"

 AAT_Sweden_nordic_defense_council.3.t: "[FROM.GetName] ปฏิเสธขอเสนอสหภาพปองกันนอรดิก"
 AAT_Sweden_nordic_defense_council.3.desc: "[FROM.GetName] ปฏิเสธที่จะเขารวมสหภาพของเรา แมโลกจะยังตึงเครียดอยูก็ตาม ดูเหมือนพวกเขาจะชอบนโยบายอื่นมากกวา หวังวาจะไมใชนโยบายที่สงผลเสียตอสถานะของเราบนเวทีโลก" 
 AAT_Sweden_nordic_defense_council.3.a: "นาเสียดาย"

 AAT_Sweden_nationalists.12.t: "ชนชั้นสูงตอนรับการปฏิรูป"
 AAT_Sweden_nationalists.12.desc: "นอกจากผูเชี่ยวชาญดานกฎหมายแลว ไมมีใครรูวาการปฏิรูปของเราเมื่อไมนานมานี้แทจริงแลวเทากับการฟนฟูอภิสิทธิ์ของชนชั้นสูง แนนอนวาเมื่อสื่ออยูใตการควบคุมของเรา ผูเชี่ยวชาญเหลานั้นก็ไมมีทางเผยแพรความไมพอใจในหมูสาธารณชนได ในขณะเดียวกัน ชนชั้นสูงตางปติยินดีกับการปฏิรูป และตั้งตารอที่จะแกไขความผิดพลาดในชวงหลายทศวรรษที่ผานมา"
 AAT_Sweden_nationalists.12.a: "หวังวาพวกเขาจะไมมาขวางทางเรา"

 AAT_Sweden_nationalists.13.t: "นักอุตสาหกรรมไดกําลังใจจากการปฏิรูปเศรษฐกิจ"
 AAT_Sweden_nationalists.13.desc: "นักอุตสาหกรรมชั้นนําตางตั้งตารอผลกําไรและเงินปนผลที่ทําลายสถิติในปตอ ๆ ไป หลังการทําใหสหภาพแรงงานเปนสิ่งผิดกฎหมาย เมื่อสหภาพแรงงานถูกสั่งหาม นักอุตสาหกรรมก็จะสามารถตัดผานขั้นตอนระเบียบยุงยากที่พรรคสังคมประชาธิปไตยวางขวางไวในชวงหลายปที่ผานมา และกระตุนการเติบโตทางเศรษฐกิจได"
 AAT_Sweden_nationalists.13.a: "การปฏิรูปเชนนี้ควรเกิดขึ้นนานแลว"

 AAT_Sweden_nationalists.14.t: "กองทัพวางแผนขยายกําลัง"
 AAT_Sweden_nationalists.14.desc: "รัฐมนตรีวาการกระทรวงกลาโหมประกาศวาจะเพิ่มงบประมาณทางทหารตามคําแนะนําของนายทหารชั้นนํา ซึ่งยืนยันมานานวาชาติมียุทโธปกรณไมเพียงพอจะปองกันตนเอง ดวยงบประมาณที่เพิ่มขึ้น ความภักดีของกองทัพตอระบอบใหมของเราดูเหมือนจะยังคงมั่นคง"
 AAT_Sweden_nationalists.14.a: "การรักษาใหกองทัพอยูขางเราจะเปนสิ่งสําคัญอันดับแรกเสมอ"

 AAT_Sweden_nationalists.15.t: "แรงงานชนบทยังคงใหการสนับสนุน"
 AAT_Sweden_nationalists.15.desc: "หลังการลงทุนมหาศาลในโครงสรางพื้นฐานชนบท แรงงานทั่วชนบทไดกลายเปนกลุมที่สนับสนุนรัฐบาลของเราอยางเปดเผยมากที่สุดกลุมหนึ่ง ดวยการสนับสนุนของพวกเขาและอิทธิพลที่มีตอหวงโซอาหารของชาติ บัดนี้เรามีฐานสนับสนุนอันมั่นคงที่จะคอยควบคุมแรงงานในเมืองไดในอนาคต"
 AAT_Sweden_nationalists.15.a: "การสนับสนุนเชนนี้จะทําใหอํานาจของเรามั่นคงยิ่งขึ้น"

 SWE_royal_visit_in_progress: "การเสด็จเยือนกําลังดําเนินอยูแลว"
 SWE_appeal_for_support_in_progress: "กําลังเกี้ยวพาราสีกลุมหนึ่งเพื่อขอการสนับสนุนอยูแลว"

 AAT_Sweden_communism.1.t: "เสียงกระซิบถึงการปฏิวัติซอนของฟาสซิสต"
 AAT_Sweden_communism.1.desc: "ในที่สุดเราก็ไดอํานาจในรัฐบาล และขณะที่ [ROOT.GetDemocraticParty] ยอมรับเจตจํานงของผูมีสิทธิเลือกตั้งอยางสงางามตามวิถีประชาธิปไตย พรรคที่เอนเอียงไปทางขวาจัดกลับยอมรับกระบวนการนี้นอยกวามาก และตั้งคําถามตอความชอบธรรมของการเลือกตั้ง ขณะนี้พวกเขาเปนเพียงผูเห็นตาง แตเราควรระวังไมใหเรื่องนี้ลุกลามออกไป"
 AAT_Sweden_communism.1.a: "นากังวล"

 AAT_Sweden_communism.2.t: "ความไมพอใจในกองทัพ"
 AAT_Sweden_communism.2.desc: "การสอบสวนกองทัพของรัฐบาลไดผลลัพธเปนแฟมเอกสารที่เชื่อมโยงผูบัญชาการระดับสูงหลายนายเขากับขบวนการฟาสซิสตใตดินที่มุงบอนทําลายรัฐบาลที่มาจากการเลือกตั้ง รายงานระบุวาวาทกรรมของฝายทหารเกี่ยวกับทิศทางการเมืองของประเทศยิ่งกลาหาญมากขึ้น และแนะนําใหดําเนินการกับวาทกรรมดังกลาว"
 AAT_Sweden_communism.2.a: "นากังวลยิ่งกวาเดิม"
  
 AAT_Sweden_communism.3.t: "อาวุธในคลังหายไป"
 AAT_Sweden_communism.3.desc: "การสอบสวนของรัฐบาลเปดเผยวาอาวุธทางทหารชั้นดีไดหายไปจากคลังแสงของกองทัพ รายงานระบุวายังไมสามารถชี้ไดวาขณะนี้อาวุธเหลานั้นอยูที่ใด แตมีอาวุธหายไปมากถึง 60% กอนที่จะมีผูพบ"
 AAT_Sweden_communism.3.a: "นี่ตองเปนฝมือคนในระดับสูงเทานั้น"

 AAT_Sweden_communism.4.t: "[ROOT.GetFascistParty] และกองทัพยึดอํานาจในสตอกโฮลม"
 AAT_Sweden_communism.4.desc: "เมื่อวันที่ [?global.date.GetDateStringShortMonth] มีเสียงดังสนั่นหลายครั้งจากรัฐสภาริกสดัก และชายติดอาวุธปริศนาในชุดเสื้อนํ้าตาลปรากฏตัวทั่วเมืองหลวง รัฐบาลถูกอพยพและเรียกรองใหตํารวจทองถิ่นและกองกําลังพิทักษชาติฟนฟูความสงบเรียบรอย แตคํารองขอกลับไดรับเพียงความเงียบ มีขาวลือหนาหูวาพวกเสื้อนํ้าตาลฟาสซิสตไดรวมมือกับนายพลระดับสูงเพื่อจัดตั้งรัฐบาลชั่วคราว ดวยทหารบางนายที่ยังภักดีตอรัฐบาลที่แทจริง คณะทํางานทั้งหมดจึงสามารถหลบหนีออกจากเมืองหลวงที่กําลังลุกไหมได"
 AAT_Sweden_communism.4.a: "เราจะกลับมา"

 AAT_Sweden_communism.5.t: "เปดโปงตัวการ"
 AAT_Sweden_communism.5.desc: "มีการพบคลังอาวุธหนักลับในโกดังทั่วเขตเมืองของ [ROOT.GetName] บันทึกวาใครเปนผูจายคาเชาโกดังเหลานี้ลวนเชื่อมโยงกับ [ROOT.GetFascistParty] และผูนําของกองกําลังกึ่งทหารที่ผูกพันกับพรรค คือพวกเสื้อนํ้าตาล ถูกจับกุมทั้งหมดแลว\nจดหมายที่พบในโกดังแหงหนึ่งยังเปดโปงนายพลที่มีสวนในแผนการนี้ ซึ่งเปนผูยักยอกอาวุธเหลานี้ตั้งแตแรกและปลอมแปลงตัวเลขในบัญชีคลัง เรื่องนี้ตองใชชั้นเชิงอยางยิ่ง เพราะตัวการเหลานี้อาจมีอิทธิพลเหนือกองทัพในสัดสวนที่ไมนอยเลย"
 AAT_Sweden_communism.5.a: "ดําเนินคดีกับพวกเขา"
 AAT_Sweden_communism.5.b: "\"เลื่อนตําแหนง\" ตัวการใหพนจากอํานาจ"

 AAT_Sweden_communism.6.t: "ชะตากรรมของราชวงศแบรนาด็อต"
 AAT_Sweden_communism.6.desc: "ในยุคแหงความรูแจงนี้ ดูแปลกที่ยังคงยึดติดกับระบอบกษัตริย โดยเฉพาะระบอบกษัตริยที่ไรอํานาจ ถึงกระนั้น กษัตริยชราก็ยังไมทรงหยุดยุงเกี่ยวกับการเมือง แมจะมีคําเตือนหลายครั้งวาพฤติกรรมเชนนี้ไมเหมาะสมและขัดตอรัฐธรรมนูญ ที่แยกวานั้นคือพระองคทรงเขาขางฝายขวาจัดมากขึ้นเรื่อย ๆ โดยแสวงหาความยิ่งใหญแบบเกาของซาร ไกเซอร และกษัตริยทั้งหลาย นี่ไมใชอนาคตของสังคม และเราผานพนยุคที่ตองมีพระมหากษัตริยมานานแลว ถึงเวลายึดทรัพยสินของพวกเขาเพื่อประโยชนของประชาชน และใหพวกเขาใชชีวิตอยางคนธรรมดา ซึ่งก็คือสิ่งที่พวกเขาเปน"
 AAT_Sweden_communism.6.a: "ยึดทรัพยสินของพวกเขา พวกเขาทํางานไดเหมือนคนอื่น ๆ"

 AAT_Sweden_communism.7.t: "ชิลบุมเคลื่อนไหวเพื่อโคนฟลีก"
 AAT_Sweden_communism.7.desc: "คารล ชิลบุม กําลังเคลื่อนไหวเพื่อยึดอํานาจควบคุมพรรค ทําใหพรรคแตกออกเปนสองฝาย ฝายหนึ่งสนับสนุนฟลีก อีกฝายสนับสนุนชิลบุม เรื่องนี้เสี่ยงทําใหชัยชนะทางการเมืองที่เราไดมาสั่นคลอน และหากยังดําเนินตอไป เราอาจสูญเสียอํานาจไปทั้งหมด เราตองตัดสินใจวาใครควรเปนผูนํา [SWE.GetName] สูอนาคตอันสดใส"
 AAT_Sweden_communism.7.a: "ชิลบุมจะนําเราสูอนาคต"
 AAT_Sweden_communism.7.b: "ฟลีกคือคําตอบ"
 AAT_Sweden_communism__7_tt_1: "สิ่งนี้จะทําใหเราเขาขางฝายสัมพันธมิตร"
 AAT_Sweden_communism__7_tt_2: "สิ่งนี้จะทําใหเราเขาขางเยอรมัน"
 AAT_Sweden_communism.7.c: "ที่จริงแลว ลัทธิสตาลินอาจไมใชความคิดที่แยนักก็ได"
  #### DENMARK ####
 denmark_political_events.1.t: "ญัตติไมไววางใจ"
 denmark_political_events.1.desc: "การนําของ [Den.GetLeader] ถูกตรวจสอบและวิพากษวิจารณอยางหนักในชวงนี้ และรัฐสภาริกสดักเรียกรองใหนายกรัฐมนตรีลาออก"
 denmark_political_events.1.a: "ลงมติไมไววางใจ"
 denmark_political_events.1.b: "เรียกรองใหมีการเลือกตั้งกอนกําหนด!"
 DEN_available_candidates_tt: "§Yผูสมัครที่มี:§!"
 denmark_political_events.2.t: "ลงคะแนนเลือกผูนําคนใหม"
 denmark_political_events.2.desc: "รัฐสภาริกสดักไดตัดสินใจยื่นญัตติไมไววางใจการนําของนายกรัฐมนตรี [Den.GetLeader] คําถามตอนนี้คือ ใครควรเขามาแทนที่เขา?"
 denmark_political_events.2.a: "สังคมประชาธิปไตย หรือความโกลาหล!"
 denmark_political_events.2.b: "เราตองการรัฐบาลเสรีนิยม"
 denmark_political_events.2.c: "การปฏิวัติของประชาชนโดยไมนองเลือด"
 denmark_political_events.2.d: "เราตองการขนบธรรมเนียมและเสถียรภาพ"
 denmark_political_events.2.e: "เราตองลองสิ่งใหม"
 DEN_prime_minister_resigns_tt: "§Y[DEN.GetLeader]§! ลาออกจากตําแหนง §Yนายกรัฐมนตรี§!" 
 denmark_political_events.3.t: "การวางแผนหาเสียงเลือกตั้ง"
 denmark_political_events.3.desc: "[GetElectionCampaignDesc]"
 denmark_political_events.3.desc_annual_election: "ถึงเวลาที่ [DEN.GetNameDef] ตองจัดการเลือกตั้งอีกครั้ง พรรคตาง ๆ กําลังวางแผนหาเสียงที่จะมาถึงเพื่อรวบรวมผูสนับสนุนและระดมผูมีสิทธิเลือกตั้งใหมาสนับสนุนแนวทางของตน"
 denmark_political_events.3.desc_snap_election: "การเรียกรองใหเลือกตั้งกอนกําหนดทําใหพรรคตาง ๆ ของ [DEN.GetNameDef] ตองเรงรีบจัดการหาเสียงเพื่อโนมนาวผูมีสิทธิเลือกตั้งใหมาสนับสนุนแนวทางของตน"
 denmark_political_events.3.a: "ประชาธิปไตย หรือความโกลาหล"
 denmark_political_events.3.b: "วางแผนหาเสียงของคอมมิวนิสต"
 denmark_political_events.3.c: "วางแผนหาเสียงของพรรคบอนเดพารตีเอ็ต"
 denmark_political_events.3.d: "วางแผนหาเสียงของฟาสซิสต"
 denmark_political_events.4.t: "เริ่มการหาเสียงของฝายประชาธิปไตย"
 denmark_political_events.4.desc: "ดูเหมือนจะมีขอพิพาทรวมกันในพรรคประชาธิปไตยตาง ๆ วาควรจัดการหาเสียงอยางไร บางฝายไมตองการเพิ่มความตึงเครียดที่สูงอยูแลว และตองการรักษาทาทีสุภาพตลอดการหาเสียง บางฝายแยงวานี่คือเหตุผลที่ตองรุกเพื่อชนะอยางถลมทลาย เพื่อสกัดกระแสใตนํ้าอันมืดมนไว สวนอีกฝายแยงวาควรโจมตีคูแขงอยางจริงจังเพื่อกันไมใหพวกเขาไดอํานาจ"
 denmark_political_events.4.a: "รักษาความสุภาพ"
 denmark_political_events.4.b: "เปดฉากรุก"
 denmark_political_events.4.c: "โจมตีคูแขง"
 denmark_political_events.5.t: "เริ่มการหาเสียงของ $DEN_communism_party$"
 denmark_political_events.5.desc: "เกิดขอพิพาทขึ้นภายใน $DEN_communism_party_long$ เกี่ยวกับการหาเสียงเลือกตั้งที่จะมาถึง บางฝายไมตองการเพิ่มความตึงเครียดที่สูงอยูแลว และตองการรักษาทาทีสุภาพตลอดการหาเสียง บางฝายแยงวานี่คือเหตุผลที่เราตองรุก  เพื่อสกัดความชั่วรายที่มีอยูไว สวนอีกฝายแยงวาเราควรโจมตีคูแขงอยางจริงจังเพื่อกันไมใหพวกเขาไดอํานาจ"
 denmark_political_events.6.t: "เริ่มการหาเสียงของ $DEN_neutrality_party$"
 denmark_political_events.6.desc: "เกิดขอพิพาทขึ้นภายใน $DEN_neutrality_party_long$ เกี่ยวกับการหาเสียงเลือกตั้งที่จะมาถึง บางฝายไมตองการเพิ่มความตึงเครียดที่สูงอยูแลว และตองการรักษาทาทีสุภาพตลอดการหาเสียง บางฝายแยงวาเพื่อใหเราทําใหวิสัยทัศนที่มีตอ [DEN.GetNameDef] เปนจริง เราตองรุก และอีกฝายแยงวาการโจมตีคูแขงคือหนทางเดียวที่จะบอนทําลายพวกเขาและเสริมความแข็งแกรงใหเรา"
 denmark_political_events.7.t: "เริ่มการหาเสียงของ $DEN_fascism_party$"
 denmark_political_events.7.desc: "เกิดขอพิพาทขึ้นภายใน $DEN_fascism_party_long$ เกี่ยวกับการหาเสียงเลือกตั้งที่จะมาถึง บางฝายลังเลที่จะเพิ่มความตึงเครียดที่สูงอยูแลว โดยเสนอใหรักษาทาทีสุภาพ บางฝายแยงวาเพื่อใหเราทําใหวิสัยทัศนที่มีตอ [DEN.GetNameDef] เปนจริง เราตองรุก และอีกฝายแยงวาการโจมตีคูแขงคือหนทางเดียวที่จะบอนทําลายพวกเขาและเสริมความแข็งแกรงใหเรา"
 denmark_political_events.8.t: "การจัดตั้งรัฐบาลใหม"
 denmark_political_events.8.desc: "การเลือกตั้งของเดนมารกสิ้นสุดลงแลว พรรคตาง ๆ ไดทําทุกอยางที่ทําไดเพื่อโนมนาวประชาชนใหลงคะแนนใหแนวทางของตน การหาเสียงอาจจบลงแลว แตบางคนอาจแยงวาสวนที่ยากที่สุดเพิ่งเริ่มตน นั่นคือการจัดตั้งรัฐบาล การเลือกนายกรัฐมนตรีจะเปนตัวกําหนดเสนทางของ [DEN.GetNameDef] ไปอีกนาน"
 denmark_political_events.8.a: "เลือกนายกรัฐมนตรีจากฝายประชาธิปไตย"
 denmark_political_events.8.b: "$DEN_aksel_larsen$ จะนําเราสูยุคใหม!"
 denmark_political_events.8.c: "$DEN_knud_bach$ จะนําทางเราอยางมั่นคง"
 denmark_political_events.8.d: "ให $DEN_frits_clausen$ ขึ้นสูอํานาจ"
 denmark_political_events.9.t: "นายกรัฐมนตรีจากฝายประชาธิปไตย"
 denmark_political_events.9.desc: "เมื่อการเลือกตั้งของเดนมารกสิ้นสุดลง ผูชนะที่ชัดเจนคือประชาธิปไตย ตางจากคอมมิวนิสตที่คิดแบบเดียวกันหรือฟาสซิสตที่เหมือนกันทั้งหมด พรรคฝายประชาธิปไตยไมไดเปนกอนเดียวกัน แตละพรรคมีวิสัยทัศนของตนในการนําพา [Den.GetNameDef] ผานชวงเวลาอันปนปวนขางหนา คําถามคือ ใครควรไดจัดตั้งรัฐบาลใหม?"
 denmark_political_events.9.a: "พรรคสังคมประชาธิปไตย (Socialdemokratiet) จะปกปองเราจากความโกลาหล"
 denmark_political_events.9.b: "พรรคเวนสเตร (Venstre) จะทําใหเราเปนอิสระและมีเหตุผล"
 denmark_political_events.9.c: "พรรคประชาชนอนุรักษนิยม (Konservative Folkeparti) จะปกปองเรา"
 denmark_political_events.10.t: "ฝายคานทางการเมือง"
 denmark_political_events.10.desc: "หลังความสําเร็จในการเลือกตั้งครั้งลาสุด คําโกหกอันชั่วรายกําลังแพรสะพัดเพื่อบอนทําลายรัฐบาลของเรา เปนที่ชัดเจนวาใครอยูเบื้องหลังขาวลือเหลานี้ แตเราแทบทําอะไรไมได เราไมควรแปลกใจที่ฝายคานทางการเมืองรวมตัวกันรอบคําโกหกเหลานี้!"
 denmark_political_events.10.a: "คําโกหกของฟาสซิสต!"
 denmark_political_events.10.b: "คําโกหกของคอมมิวนิสต!"
 denmark_political_events.11.t: "ขบวนการนิยมกษัตริย"
 denmark_political_events.11.desc: "มีบางอยางเนาเฟะในรัฐ [ROOT.GetNameDef]! ในที่สุดก็มีรัฐบาลที่บริหารโดยประชาชนและเพื่อประชาชน แตไมใชทุกคนจะพอใจ ขบวนการของผูที่อางตนเปนผูรักชาติไดผุดขึ้น รวมตัวกันสนับสนุนสถาบันที่ลาสมัยอยางระบอบกษัตริย พวกเขาเริ่มไดรับความนิยมบาง แตดูเหมือนจะยังไมเปนภัยคุกคาม ในตอนนี้"
 denmark_political_events.11.a: "กลับไปสูเงามืดที่เจามาเสีย!"
 #Occupation Events
 denmark_occupation_event.1.t: "สูหรือยอม"
 denmark_occupation_event.1.desc: "แมเราจะประกาศความเปนกลางอยางชัดแจง แตสงครามก็มาถึง [DEN.GetNameDef] แลว เรายังอาจปกปองประชาชนจากความโหดรายของสงครามได หากยอมจํานนตั้งแตเนิ่น ๆ ดวยวิธีนี้ เราอาจไดรับขอตกลงที่เปนประโยชนและยังคงดําเนินงานไดอยางกึ่งอิสระ"
 denmark_occupation_event.1.a: "เราไมอาจชนะการตอสูครั้งนี้"
 DEN_denmark_keeps_government_form_tt: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! จะคงรูปแบบการปกครองปจจุบันไว\n\n"
 denmark_occupation_event.1.b: "เราตองยืนหยัดตอสู!"
 denmark_occupation_event.2.t: "[DEN.GetNameDefCap] ยอมจํานน"
 denmark_occupation_event.2.desc: "เราไดรับโทรเลขจากรัฐบาลเดนมารกและ [DEN.GetLeader] ระบุเงื่อนไขการยอมจํานน หากเรายินดีรับรองและเคารพอธิปไตยและบูรณภาพแหงดินแดนของพวกเขา พวกเขาก็ตกลงจะวางอาวุธและกลายเปนรัฐในอารักขาโดยพฤตินัยภายใตเรา"
 denmark_occupation_event.2.a: "เราจะปกปองพวกเขา"
 denmark_occupation_event.2.b: "พวกเขาเปนแคเนินชะลอความเร็วเทานั้น"
 denmark_occupation_event.3.t: "[FROM.GetNameDefCap] ยอมรับการยอมจํานนของเรา"
 denmark_occupation_event.3.desc: "ดวยการลงนามขอตกลงสันติภาพที่เปนประโยชนกับ [FROM.GetNameDef] ตั้งแตตนสงคราม เราจึงรักษาเอกราชบางสวนและรูปแบบการปกครองของเราไวได เพื่อรักษาเสรีภาพสัมพัทธนี้ในฐานะรัฐในอารักขาโดยพฤตินัยของ[FROM.GetAdjective] เราจําตองรวมมือกับพวกเขาและสรางนโยบายการเมืองแหงความรวมมือในวงกวาง ในตอนนี้"
 denmark_occupation_event.3.a: "อยางนอยเราก็รักษาเอกราชไวไดบาง"
 denmark_occupation_event.5.t: "[FROM.GetNameDefCap] ปดตกขอเสนอของเรา"
 denmark_occupation_event.5.desc: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอยอมจํานนอันใจกวางของเรา และเลือกความรุนแรงกับการนองเลือด เราจะทําใหทหาร[FROM.GetAdjective]เสียเลือดจนหมดตัว และแสดงใหเห็นวาเราไมไดถูกพิชิตงาย ๆ!"
 denmark_occupation_event.5.a: "ลุกขึ้นตอตาน ชาวเดนมารกทุกคน!"
 denmark_occupation_event.6.t: "[DEN.GetDanishIndependenceTitle]"
 denmark_occupation_event.6.t_declares_independence: "[DEN.GetNameDefCap] ประกาศเอกราช!"
 denmark_occupation_event.6.t_asks_for_independence: "[DEN.GetNameDefCap] ขอเอกราช"
 denmark_occupation_event.6.desc: "[DEN.GetDanishIndependenceDesc]"
 denmark_occupation_event.6.desc_declares_independence: "ดูเหมือนชาวเดนมารกไดประกาศเอกราช และแถลงวาไมยอมรับอํานาจครอบงําของเราเหนือพวกเขาอีกตอไป  เราใหเสถียรภาพและความมั่นคงแกพวกเขาภายใตการคุมครองของเรา และนี่คือสิ่งที่เราไดรับเปนการตอบแทนหรือ?"
 denmark_occupation_event.6.desc_asks_for_independence: "เราไดรับคณะผูแทนจากรัฐในอารักขาผูภักดีของเรา [FROM.GetNameDef] ซึ่งนําโดย [FROM.GetLeader] เอง ดูเหมือนพวกเขามาพบ [ROOT.GetLeader] โดยตรงเพื่อหารือเรื่องการยุติการอยูใตอํานาจ และขอใหคืนเสรีภาพแกพวกเขา"
 denmark_occupation_event.6.a: "พวกเนรคุณหักหลัง"
 denmark_occupation_event.6.b: "พวกเขาไมมีความสําคัญอะไร"
 denmark_occupation_event.7.t: "สงครามประกาศเอกราชของเดนมารก"
 denmark_occupation_event.7.desc: "[FROM.GetLeader] ปฏิเสธเหตุผลอีกครั้งและไมยอมรับเอกราชของเรา เราตองทวงคืนเสรีภาพและตอสูเพื่อมัน เพราะดูเหมือนจะมีทางออกเพียงทางเดียวจากความเปนทาสนี้ เลือดจะตองหลั่งริน แต [ROOT.GetNameDef] จะเปนอิสระอีกครั้ง!"
 denmark_occupation_event.7.a: "ลุกขึ้นตอตาน ชาวเดนมารกทุกคน!"
 denmark_occupation_event.7.b: "ความชอบธรรมจะมีชัย!"
 denmark_occupation_event.8.t: "เอกราชของเดนมารก"
 denmark_occupation_event.8.desc: "ในที่สุด [FROM.GetLeader] ก็ยอมรับเหตุผลและรับรองเอกราชของเรา ดูเหมือนความเปนทาสของเราจะสิ้นสุดลงโดยไมตองนองเลือด"
 denmark_occupation_event.8.a: "นั่นมัน... งายเกินคาด"
 denmark_occupation_event.10.t: "การนัดหยุดงานตอตานการยึดครองปะทุขึ้น"
 denmark_occupation_event.10.desc: "การนัดหยุดงานไดปะทุขึ้นทั่ว [DEN.GetNameDef] เพื่อประทวงการยึดครอง นี่เปนวิธีสันติในการแสดงความไมพอใจและการตอตาน แตยอมทําลายความสัมพันธของเรากับ [?DEN.DEN_overlord_nation.GetNameDef] อยางแนนอน"
 denmark_occupation_event.10.a: "ชาง... ไมคาดคิด"
 denmark_occupation_event.11.t: "การนัดหยุดงานตอตานการยึดครองสิ้นสุดลง"
 denmark_occupation_event.11.desc: "การนัดหยุดงานทั่วประเทศเพื่อประทวงการยึดครองของ[?DEN.DEN_overlord_nation.GetAdjective]ไดสิ้นสุดลงแลว ชาวเดนมารกไดแสดงใหผูยึดครองเห็นวาความปรารถนาในอิสรภาพและเสรีภาพของเรายังแรงกลาเชนเคย"
 denmark_occupation_event.11.a: "นี่เปนเพียงจุดเริ่มตน"
 denmark_occupation_event.20.t: "การจูโจมคลังอาวุธสําเร็จ"
 denmark_occupation_event.20.desc: "หลังการวางแผนอยางรอบคอบและปฏิบัติการอันกลาหาญ กลุมสมาชิกขบวนการตอตานไดกลับมาจากการจูโจมที่ประสบความสําเร็จ พรอมอาวุธที่เดิมจะสงใหเจาเหนือหัวในนามของเรา การกระทํานี้จะเสริมกําลังการตอสูเพื่ออิสรภาพที่ยังดําเนินอยูของเรา!"
 denmark_occupation_event.20.a: "อาวุธเหลานี้จะมีประโยชน"
 denmark_occupation_event.30.t: "กอวินาศกรรมอุตสาหกรรมพลเรือนสําเร็จ"
 denmark_occupation_event.30.desc: "ปฏิบัติการนี้ผานการวางแผนอยางรอบคอบ แตการเตรียมการทั้งหมดและการรอคอยอันยาวนานใหสถานการณเหมาะสมก็คุมคา เราไดกอวินาศกรรมโครงสรางพื้นฐานทางอุตสาหกรรมสําคัญที่ปอนสินคาเดนมารกให [?DEN.DEN_overlord_nation.GetNameDef] สําเร็จ การกระทําอันกลาหาญนี้จะจํากัดผลผลิตที่เจาเหนือหัวในนามของเราไดรับจากเรา"
 denmark_occupation_event.30.a: "ความสําเร็จอันยิ่งใหญ!"
 denmark_occupation_event.40.t: "กอวินาศกรรมอุตสาหกรรมทหารสําเร็จ"
 denmark_occupation_event.40.desc: "สมาชิกขบวนการตอตานไดวางแผนกอวินาศกรรมตอเนื่องมาหลายเดือน และในที่สุดก็ลงมือตามแผน การกอวินาศกรรมโครงสรางพื้นฐานทางอุตสาหกรรมการทหารที่สําคัญหมายความวา [?DEN.DEN_overlord_nation.GetNameDef] จะไดรับอาวุธที่ผลิตบนแผนดินเดนมารกนอยลง"
 denmark_occupation_event.40.a: "ความสําเร็จอันยิ่งใหญ!"
 denmark_occupation_event.100.t: "การปรับแนวทางของเดนมารก"
 denmark_occupation_event.100.desc: "ดูเหมือนรัฐบาลเดนมารกจะตระหนักแลววาผลประโยชนสูงสุดของตนอยูที่ใด และไดปรับนโยบายใหสอดคลองกับของเรา เราไดรับคําขอจาก [FROM.GetLeader] ใหอนุญาตพวกเขาพัฒนาขีดความสามารถทางทหารและรวมมือกับเรา ซึ่งจะทําใหพวกเขาดําเนินนโยบายตางประเทศที่แข็งกราวขึ้นและเปนอิสระจากเรามากขึ้น"
 denmark_occupation_event.100.a: "ยินดีตอนรับพี่นองรวมรบของเรา!"
 denmark_occupation_event.100.b: "เราอยูไดโดยไมตองพึ่งกองทัพกระจอยรอยของพวกเขา"
 denmark_occupation_event.101.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอพันธมิตรของเรา"
 denmark_occupation_event.101.desc: "[FROM.GetLeader] ผูปราดเปรื่องไดยอมรับเราเปนพันธมิตรอยางมีนํ้าใจ และตระหนักถึงความสามารถของเราในการมีสวนรวมในความพยายามทําสงคราม เรายังไดรับอนุญาตใหพัฒนาขีดความสามารถทางทหาร ทั้งหมดนี้จะทําใหเราดําเนินนโยบายตางประเทศที่แข็งกราวขึ้น และรักษากลุมประเทศนอรดิกไวใหเจาเหนือหัว[FROM.GetAdjective]ของเรา"
 denmark_occupation_event.101.a: "เปนวันอันรุงโรจนจริง ๆ!"
 denmark_occupation_event.102.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอพันธมิตรของเรา"
 denmark_occupation_event.102.desc: "[FROM.GetLeader] ไดปฏิเสธมือที่เรายื่นออกไปอยางโงเขลา ทั้งที่เราขอเริ่มความรวมมือที่ลึกซึ้งยิ่งขึ้นระหวางสองประเทศ ซึ่งเราจะชวยเหลือ [FROM.GetNameDef] ได ดูเหมือนพวกเขาชอบทําทุกอยางเองมากกวาพึ่งพาพันธมิตร"
 denmark_occupation_event.102.a: "พวกเขาประเมินพลังของเราตํ่าเกินไป!"
 denmark_occupation_event.110.t: "[FROM.GetNameDefCap] ปฏิญาณความภักดี"
 denmark_occupation_event.110.desc: "คณะผูแทนเดนมารกซึ่งนําโดย [FROM.GetLeader] เองไดมาถึงเมืองหลวงของเราเพื่อถวายสัตยปฏิญาณตอ [ROOT.GetLeadr] และอุดมการณของ[ROOT.GetAdjective]ดวยตนเอง รัฐบาลเดนมารกดูมุงมั่นที่จะรวมมือกับเราอยางเต็มที่และชวยเหลือใหดีที่สุดเทาที่ทําได"
 denmark_occupation_event.110.a: "ตอนรับพวกเขาดวยออมแขนที่เปดกวาง"
 denmark_occupation_event.110.b: "เราไมตองการความภักดีของพวกเขา"
 denmark_occupation_event.111.t: "[FROM.GetNameDefCap] ตอนรับความภักดีของเรา"
 denmark_occupation_event.111.desc: "[FROM.GetLeader] ตอนรับ [ROOT.GetLeader] ดวยออมแขนที่เปดกวาง และตระหนักถึงคุณคาและสิ่งที่เรานํามาสูความเปนหุนสวน สิ่งนี้จะผูกสองประเทศของเราใหใกลชิดกันยิ่งขึ้น และทําใหทั้งสองฝายแข็งแกรงขึ้น"
 denmark_occupation_event.111.a: "สัญญาณแหงความไววางใจอันยิ่งใหญ"
 denmark_occupation_event.112.t: "[FROM.GetNameDefCap] ปดตกความภักดีของเรา"
 denmark_occupation_event.112.desc: "[FROM.GetLeader] ไดผลักไส [ROOT.GetLeader] อยางไมฉลาดและปฏิเสธความภักดีของเรา พรอมดูแคลนขีดความสามารถและพลังที่เพิ่มขึ้นของเรา นี่จึงเหลือทางเลือกเพียงทางเดียวหากเราตองการไดอิสรภาพคืน นั่นคือสงคราม"
 denmark_occupation_event.112.a: "เราจะสอนบทเรียนเรื่องความถอมตนใหพวกเขา!"
 #Resistance Events
 denmark_resistance_event.1.t: "[DEN.GetNameDefCap] ขอการสนับสนุนจากเรา"
 denmark_resistance_event.1.desc: "เราไดรับสารที่สงมาอยางลับที่สุดจาก [DEN.GetNameDef] พวกเขากําลังแสวงหาพันธมิตรอยางเงียบ ๆ ที่จะสนับสนุนการอางสิทธิ์ในเอกราชเมื่อถึงวันที่พวกเขาจะทวงอธิปไตยคืนจาก [?DEN.DEN_overlord_nation.GetNameDef] เราตองการเลือกขางในความขัดแยงนี้หรือไม?"
 denmark_resistance_event.1.a: "เพื่อ [DEN.GetNameDef] ที่เปนอิสระ!"
 denmark_resistance_event.1.b: "พวกเขาตองโทษตัวเอง"
 DEN_supports_denmark_TT: "เราตกลงสนับสนุนและเปนพันธมิตรกับ [DEN.GetFlag]§Y[FROM.GetNameDef]§! หากพวกเขาประกาศเอกราช"
 denmark_resistance_event.2.t: "[FROM.GetNameDefCap] ตกลงสนับสนุนเรา"
 denmark_resistance_event.2.desc: "[FROM.GetLeader] ผูกลาหาญไดตัดสินใจใหการสนับสนุนจาก[FROM.GetAdjective]อยางลับ ๆ ในการตอสูเพื่อทวงอิสรภาพของเรา! สิ่งนี้ยอมชวยเราไดมากเมื่อถึงเวลาที่เราจะประกาศเอกราชจากเจาเหนือหัวผูโหดราย"
 denmark_resistance_event.2.a: "ยอดเยี่ยม!"
 denmark_resistance_event.3.t: "[FROM.GetNameDefCap] ปฏิเสธคํารองขอความชวยเหลือของเรา"
 denmark_resistance_event.3.desc: "[FROM.GetLeader] ผูขลาดเขลาไดตัดสินใจไมใหการสนับสนุนจาก[FROM.GetAdjective]ในการตอสูเพื่อทวงอิสรภาพของเรา เราตองหันไปหาแรงสนับสนุนที่ตองการจากที่อื่น"
 denmark_resistance_event.3.a: "บาเอย!"
 denmark_resistance_event.4.t: "[DEN.GetNameDefCap] ขออาวุธ"
 denmark_resistance_event.4.desc: "เราไดรับคําขอจาก [DEN.GetNameDef] ใหสงอาวุธไปติดอาวุธใหขบวนการตอตานและชวยการตอสูเพื่อทวงอิสรภาพของพวกเขา"
 denmark_resistance_event.4.a: "สงสิ่งที่เรามีใหพวกเขา"
 denmark_resistance_event.4.b: "เราไมมีอะไรเหลือพอจะให..."
 denmark_resistance_event.5.t: "[FROM.GetNameDefCap] ยอมสงอาวุธให"
 denmark_resistance_event.5.desc: "ชาว[FROM.GetAdjective]ไดตัดสินใจรับฟงคํารองขออาวุธของเรา และกําลังวางแผนทิ้งยุทโธปกรณทางอากาศ สมาชิกขบวนการตอตานไดประสานกับเจาหนาที่หนวยขาวกรอง[FROM.GetAdjective]เรื่องสถานที่และเวลานัดรับของแลว"
 denmark_resistance_event.6.t: "[FROM.GetNameDefCap] ปฏิเสธคําขออาวุธของเรา"
 denmark_resistance_event.6.desc: "คําขออาวุธของเราจากพันธมิตร[FROM.GetAdjective]ถูกปฏิเสธ พวกเขาแจงเราดวยความเสียใจวาขณะนี้ไมมียุทโธปกรณเหลือพอจะให"
 denmark_resistance_event.7.t: "[DEN.GetNameDefCap] เรียกรองการสนับสนุนจากเรา"
 denmark_resistance_event.7.desc: "[DEN.GetNameDefCap] ไดประกาศเอกราชจากเจาเหนือหัวผูกดขี่ ตามรายงาน [?DEN.DEN_overlord_nation.GetLeader] ผูนําของ[?DEN.DEN_overlord_nation.GetAdjective] โกรธจัดและตะโกนคําหยาบคายเมื่อไดรับขาว บัดนี้ชาวเดนมารกเรียกรองใหเราทําตามขอตกลงและรับพวกเขาเขารวมพันธมิตร"
 denmark_resistance_event.7.a: "รวมมือกับพวกเขา!"
 denmark_resistance_event.7.b: "สถานการณเปลี่ยนไปแลว..."
 denmark_resistance_event.7.c: "เราไมอยูในฐานะที่จะตัดสินเรื่องนี้"
 denmark_resistance_event.8.t: "[FROM.GetNameDefCap] เชิญเราเขารวมฝาย"
 denmark_resistance_event.8.desc: "[From.GetLeader] ไดทําตามขอตกลงและสงคําเชิญใหเราเขารวมพันธมิตรของพวกเขา"
 denmark_resistance_event.9.t: "[FROM.GetNameDefCap] ถอนตัวจากขอตกลงกับเรา"
 denmark_resistance_event.9.desc: "[From.GetLeader] ผูไรเกียรติไดผิดขอตกลงและปฏิเสธที่จะเชิญเราเขารวมพันธมิตร!"
 denmark_resistance_event.9.a: "พวกทรยศหักหลัง!"
 denmark_resistance_event.10.t: "[FROM.GetNameDefCap] เรียกรองให [DEN.GetNameDefCap] เขารวมฝายของเรา"
 denmark_resistance_event.10.desc: "เราเพิ่งไดรับขาววา [FROM.GetNameDef] ไดลงนามขอตกลงกับ [DEN.GetNameDef] เพื่อสนับสนุนการประกาศเอกราชและรวมมือกัน บัดนี้ [FROM.GetLeader] ยืนกรานใหเรายอมรับและปฏิบัติตามขอตกลงที่พวกเขาทําไวกับชาวเดนมารก"
 denmark_resistance_event.10.a: "สิ่งนี้จะเสริมความแข็งแกรงใหพันธมิตรทั้งหมด"
 denmark_resistance_event.10.b: "เราไมไดผูกพันที่ตองทําตามขอตกลงของพวกเขา" 
 denmark_resistance_event.11.t: "[DEN.GetNameDefCap] เสนอขาวกรอง"
 denmark_resistance_event.11.desc: "หนวยขาวกรองเดนมารกไดติดตอเจาหนาที่หนวยขาวกรองของเรา เพื่อขอแบงปนขาวกรองระหวางสองประเทศ สิ่งนี้ยอมเสริมปฏิบัติการลับของเราและเปนประโยชนตอทั้งสองชาติ"
 denmark_resistance_event.11.a: "ศัตรูของศัตรู อยางที่เขาวากัน..."
 denmark_resistance_event.11.b: "เราไมตองการความชวยเหลือจากพวกเขา"
 denmark_resistance_event.12.t: "[FROM.GetNameDefCap] ยอมรับการแลกเปลี่ยนขาวกรองกับเรา"
 denmark_resistance_event.12.desc: "หนวยขาวกรอง[FROM.GetAdjective]เล็งเห็นประโยชนของการแบงปนขาวกรองระหวางสองประเทศ และไดตกลงตามขอเสนอของเรา"
 denmark_resistance_event.12.a: "เปนการตัดสินใจที่ชาญฉลาด"
 denmark_resistance_event.13.t: "[FROM.GetNameDefCap] ปฏิเสธการแลกเปลี่ยนขาวกรอง"
 denmark_resistance_event.13.desc: "หนวยขาวกรองของ [FROM.GetNameDef] ทั้งสายตาสั้นและไมฉลาด หัวหนาหนวยขาวกรอง[FROM.GetAdjective]มองไมเห็นประโยชนของการแบงปนขาวกรองระหวางสองประเทศ และไดปฏิเสธขอเสนอของเรา"
 denmark_resistance_event.13.a: "ชางเปนการตัดสินใจที่ไมฉลาดเลย"
 
 denmark_resistance_event.20.t: "เดนมารกสอบถามเรื่องการรับทหารมาพักพิง"
 denmark_resistance_event.20.desc: "เราไดรับการสอบถามอยางลับ ๆ จาก [DEN.GetLeader] เพื่อหยั่งทาทีวาเราสนใจจะรับทหารเดนมารกมาพักบนแผนดิน[ROOT.GetAdjective]หรือไม เพื่อฝกและติดอาวุธใหพวกเขาเตรียมพรอมสําหรับการปลดปลอย [DEN.GetNameDef] อยางสมบูรณ เราสามารถปกปดจํานวนและจุดประสงคที่แทจริงของพวกเขาไดดวยการเรียกพวกเขาวา “สารวัตรทหาร”"
 denmark_resistance_event.20.a: "เราจะรับพวกเขาไว"
 denmark_resistance_event.20.b: "เราไมอาจทําใหเจาเหนือหัวของพวกเขาโกรธได"
 denmark_resistance_event.21.t: "[FROM.GetNameDefCap] ยอมรับทหารของเราไว"
 denmark_resistance_event.21.desc: "[FROM.GetNameDefCap] ไดตกลงอยางมีนํ้าใจที่จะรับกองพลนอยเดนมารกพลัดถิ่นของเราไว เพื่อเตรียมพวกเขาสําหรับการปลดปลอย [DEN.GetNameDef] เมื่อถึงเวลา"
 denmark_resistance_event.22.t: "[FROM.GetNameDefCap] ปฏิเสธทหารของเรา"
 denmark_resistance_event.22.desc: "[FROM.GetNameDefCap] ไดปฏิเสธอยางนาอับอายที่จะรับกองพลนอยเดนมารกพลัดถิ่นของเราไว และจะไมเตรียมพวกเขาสําหรับการปลดปลอย [DEN.GetNameDef] เมื่อถึงเวลาอันเหมาะสม เราตองหาความชวยเหลือที่ตองการจากที่อื่น"
 denmark_resistance_event.23.t: "[DEN.GetAdjective]สอบถามเรื่องการซื้อเรือเกา"
 denmark_resistance_event.23.desc: "คณะผูแทนเดนมารกมาเยือนเราอยางลับ ๆ เพื่อสอบถามวาเรายินดีจะขายเรือพิฆาตรุนเกาบางลําใหพวกเขาหรือไม [DEN.GetNameDefCap] ตกอยูใตอํานาจของ [?DEN.DEN_overlord_nation.GetNameDef] และนี่อาจเปนสัญญาณชัดเจนวาพวกเขากําลังรวบรวมกําลังเพื่อประกาศเอกราช เรายินดีจะชวยใหพวกเขาไดเอกราชคืนหรือไม?"
 denmark_resistance_event.23.a: "ใหเรือพิฆาตเกาแกพวกเขาสักสองสามลํา"
 denmark_resistance_event.23.b: "เราไมอาจทําใหเจาเหนือหัวของพวกเขาโกรธได"
 denmark_resistance_event.24.t: "[FROM.GetNameDefCap] ตกลงขายเรือพิฆาตใหเรา"
 denmark_resistance_event.24.desc: "[FROM.GetNameDefCap] ไดตกลงอยางชาญฉลาดที่จะขายเรือพิฆาตรุนเกาบางลําใหเรา! เราตองซอนเรือเหลานี้ไวใหพนสายตา [?DEN.DEN_overlord_nation.GetNameDef] และนําออกปฏิบัติการเมื่อถึงเวลาโจมตีเทานั้น"
 denmark_resistance_event.25.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะขายเรือพิฆาตใหเรา"
 denmark_resistance_event.25.desc: "[FROM.GetNameDefCap] ไดปฏิเสธคําขอซื้อเรือพิฆาตรุนเกาของเราอยางไมฉลาด การกระทําอันโงเขลาของพวกเขาจะไมขัดขวางเราจากการเสริมกําลังกองเรือเพื่อรักษานานนํ้าของเรา เราจะหาชาติที่เปนมิตรกวานี้จากที่อื่น"
 denmark_resistance_event.30.t: "การทรงมาประจําวันของพระมหากษัตริย"
 denmark_resistance_event.30.desc: "พระมหากษัตริยทรงมาผานกรุงโคเปนเฮเกนทุกวันโดยไมมีราชองครักษติดตาม เพื่อเปนการประทวงอยางเงียบ ๆ ตอผูยึดครอง และพระองคไดกลายเปนสัญลักษณของทั้งชาติในการตอตานการยึดครองของ[?DEN.DEN_overlord_nation.GetAdjective]"
 denmark_resistance_event.30.a: "ชางกลาหาญ!"
 denmark_overlord_events.1.t: "วิกฤตโทรเลข"
 denmark_overlord_events.1.desc: "วิกฤตทางการทูตกําลังกอตัวขึ้นระหวางประเทศของเรากับ [?DEN.DEN_overlord_nation.GetNameDef] มีตนเหตุจากโทรเลขที่พระมหากษัตริยของเราทรงสงไป ขอความเขียนเพียงวา ‘ขอขอบใจเปนอยางยิ่ง’ แตกลาวกันวา [?DEN.DEN_overlord_nation.GetLeader] รูสึกขุนเคืองตอสิ่งที่มองวาเปนการตอบอยางขอไปทีของพระมหากษัตริย ตอคําอวยพรของผูนํา[?DEN.DEN_overlord_nation.GetAdjective]เนื่องในวันคลายวันพระราชสมภพ \nความสัมพันธระหวางสองชาติตึงเครียดมาระยะหนึ่งแลว และนี่อาจเปนขออางที่เจาเหนือหัวของเรารอคอย เพื่อกระชับอํานาจเหนือเอกราชและรัฐบาลของเรา"
 denmark_overlord_events.1.a: "ขออภัยและพยายามกูสถานการณ"
 denmark_overlord_events.1.b: "สงความปรารถนาดีอยางยิ่งถึง [?DEN.DEN_overlord_nation.GetLeader]"
 denmark_overlord_events.2.desc: "[ROOT.GetLeader] ผูนําผูเปยมเมตตาของเราไดสงโทรเลขจากใจจริงเพื่ออวยพรวันเกิดแดกษัตริยแหง [FROM.GetNameDef] แตกลับไดรับคําตอบที่สั้นและเย็นชา บัดนี้ชาวเดนมารกตระหนักถึงความรายแรงของการดูหมิ่นนี้ และเสนอจะสงมกุฎราชกุมารเฟรเดอริกมาขออภัยตอ [ROOT.GetLeader] ดวยตนเอง \nอยางไรก็ตาม เราอาจใชโอกาสนี้กําหนดการควบคุมที่เขมงวดขึ้นเหนือรัฐในอารักขาของเรา ซึ่งไดรับอภิสิทธิ์อยางเสรีมากภายใตอํานาจปกครองของเรา"
 denmark_overlord_events.2.a: "รับคําขอโทษ"
 denmark_overlord_events.2.b: "ลงโทษพวกเขาที่หยาบคาย"
 denmark_overlord_events.3.t: "[FROM.GetLeader] ยอมรับคําขอโทษของเรา"
 denmark_overlord_events.3.desc: "ความพยายามของเราในการเอาใจ [FROM.GetLeader] ดูเหมือนจะไดผล - อยางนอยก็ในตอนนี้"
 denmark_overlord_events.3.a: "วิกฤตที่หลีกเลี่ยงได"
 denmark_overlord_events.4.t: "[FROM.GetLeader] ปฏิเสธคําขอโทษของเรา"
 denmark_overlord_events.4.desc: "[FROM.GetLeader] ไมยอมฟงเหตุผล และถือวาโทรเลขตอบกลับสั้นๆ ของพระราชาตอคําแสดงความยินดีของเขาเปนการดูหมิ่นสวนตัว ดูเหมือนเขาจะมุงมั่นลงโทษเราสําหรับความเขาใจผิดอันนาเสียดายนี้ใหได"
 denmark_overlord_events.4.a: "นาเสียดาย"
 denmark_overlord_events.5.desc: "[ROOT.GetLeader] ผูนําผูทรงเมตตาของเราสงโทรเลขอวยพรวันเกิดอยางจริงใจถึงพระราชาแหง [FROM.GetNameDef] แตกลับไดรับคําตอบที่สั้นและเย็นชา ที่แยยิ่งกวานั้นคือชาวเดนมารกไมยอมรับความผิดพลาดของพระราชาของพวกเขาและขอโทษอยางเหมาะสม \nนี่อาจเปนโอกาสอันดีที่จะสั่งสอนรัฐใตปกครองของเราใหรูที่ทาง และเตือนพวกเขาวาสิทธิพิเศษที่ไดรับภายใตอํานาจของเรานั้นไมใชสิ่งที่ไดมาโดยปริยาย"
 denmark_overlord_events.5.a: "เรามีเรื่องเรงดวนกวานี้ตองจัดการ..."
 denmark_overlord_events.5.b: "ความอวดดีนี้ตองถูกลงโทษ!"
 denmark_overlord_events.6.t: "วิกฤตโทรเลขคลี่คลายไปเอง"
 denmark_overlord_events.6.desc: "ดูเหมือนวาการที่เราปฏิเสธจะขอโทษที่ [FROM.GetLeader] เลือกจะรูสึกถูกดูหมิ่นเปนการสวนตัวจากคําตอบสั้นแตตรงประเด็นของพระราชาของเราตอโทรเลขอวยพรวันเกิดของเขา จะไมมีใครสังเกตเห็นหรือไมก็ถูกเพิกเฉยไป"
 denmark_overlord_events.6.a: "พวกเขาคงยอมรับแลววาความผิดเปนของพวกเขาฝายเดียว"
 denmark_overlord_events.7.t: "[FROM.GetNameDefCap] บังคับใชกฎหมายใหมอันเขมงวด"
 denmark_overlord_events.7.desc: "ผลโดยตรงจากสิ่งที่เรียกกันวา 'วิกฤตโทรเลข' และการที่ [FROM.GetLeader] ไมยอมฟงเหตุผล ทําใหมีการออกกฎหมายใหมอันเขมงวดและบังคับใชกับเรา"
 denmark_overlord_events.7.a: "กฎหมายเหลานี้เปนเพียงชั่วคราว - เราจะทําใหเปนเชนนั้น!"
 denmark_overlord_events.10.t: "[FROM.GetNameDefCap] เรียกรองให [ROOT.GetLeader] ลาออก"
 denmark_overlord_events.10.desc: "ความสัมพันธที่เสื่อมถอยระหวางสองประเทศนําไปสูคําขออยางเปนทางการจากกระทรวงการตางประเทศ[FROM.GetAdjective] ให[ROOT.GetLeader]ลาออก \nแมเราจะไดรับอํานาจปกครองตนเองเปนพิเศษภายใต 'การคุมครอง' ของ[FROM.GetAdjective] แตการทําใหความสัมพันธระหวางสองประเทศยํ่าแยลงไปอีกอาจไมใชเรื่องฉลาด"
 denmark_overlord_events.10.a: "เราตองยอมทําตาม"
 denmark_overlord_events.10.b: "นี่ไมใชเรื่องของพวกเขา!"
 denmark_overlord_events.11.t: "การเลือกนายกรัฐมนตรีคนใหม"
 denmark_overlord_events.11.desc: "ถึงเวลาแลวที่เราตองเลือกไมเพียงแคผูที่จะบริหาร [ROOT.GetNameDef] แตรวมถึงผูที่จะรับมือกับอํานาจยึดครองของ[FROM.GetAdjective]ดวย"
 denmark_overlord_events.11.a: "ผูนําฝายประชาธิปไตย"
 denmark_overlord_events.11.b: "$DEN_knud_bach$"
 denmark_overlord_events.11.c: "$DEN_aksel_larsen$"
 denmark_overlord_events.11.d: "ผูนําฝายฟาสซิสต"
 denmark_overlord_events.12.desc: "ความงดงามของประชาธิปไตยคือทางเลือกมากมายในการเลือกผูนํา"
 denmark_overlord_events.12.a: "นักสังคมประชาธิปไตย"
 denmark_overlord_events.12.b: "นักเสรีนิยม"
 denmark_overlord_events.12.c: "นักอนุรักษนิยม"
 denmark_overlord_events.12.d: "คนนอก"
 denmark_overlord_events.13.desc: "มีเพียงมือที่เด็ดขาดเทานั้นที่จะนํา [ROOT.GetNameDef] กาวไปขางหนาได"
 denmark_overlord_events.13.a: "$DEN_frits_clausen$"
 denmark_overlord_events.13.b: "$DEN_cay_lembcke$"
 denmark_overlord_events.14.t: "[FROM.GetNameDefCap] เลือกนายกรัฐมนตรีคนใหม"
 denmark_overlord_events.14.desc: "รัฐบาลเดนมารกยอมทําตามคําขอของเราและเลือกนายกรัฐมนตรีคนใหมแลว"
 denmark_overlord_events.14.a: "ดีมาก"
 denmark_overlord_events.15.t: "[FROM.GetLeader] ไมยอมลาออก"
 denmark_overlord_events.15.desc: "ดูเหมือนรัฐบาลเดนมารกจะไมยอมฟงคําขออันจริงใจของเราที่ให [FROM.GetLeader] ลงจากตําแหนงนายกรัฐมนตรีเพื่อความรวมมือที่ดีขึ้นระหวางสองประเทศ ความอวดดีเชนนี้เองที่ทําใหความสัมพันธของเรากับชาวเดนมารกเสื่อมถอย! ตองทําอะไรสักอยางเพื่อรักษาความรวมมือระหวางรัฐบาลของเราไว"
 denmark_overlord_events.15.a: "ยังไมใชเวลา"
 denmark_overlord_events.15.b: "สั่งสอนพวกเขาเสียบาง"
 denmark_overlord_events.15.c: "แตงตั้งผูรวมมือที่ภักดี"
 denmark_overlord_events.16.desc: "เพื่อตอบโตการที่เราไมยอมทําตามขอเรียกรองของ[FROM.GetAdjective]ให [ROOT.GetLeader] ลาออก เจาเหนือหัวของเราจึงตัดสินใจบังคับใชกฎหมายชุดใหมเพื่อสั่งสอนใหเรารูจักความถอมตนและการเชื่อฟง"
 denmark_overlord_events.16.a: "สักวันเราจะสอนใหพวกเขารูจักความถอมตนที่แทจริง...."
 denmark_overlord_events.17.t: "[FROM.GetAdjective]วางแผนตั้งรัฐบาลที่ภักดี"
 denmark_overlord_events.17.desc: "[FROM.GetNameDefCap] แสดงชัดเจนวาพวกเขาตั้งใจจะตั้งรัฐบาลที่ฝกใฝ[FROM.GetAdjective]มากขึ้น เพื่อตอบโตการที่ [ROOT.GetLeader] ไมยอมลงจากตําแหนงนายกรัฐมนตรี นี่หมายถึงความเปนอิสระที่ลดลงสําหรับเรา เวนแตเราจะลุกฮือขึ้นเดี๋ยวนี้ - ไมวาเราจะพรอมหรือไมก็ตาม..."
 denmark_overlord_events.17.a: "เราไมมีทางเลือก..."
 denmark_overlord_events.17.b: "Frihed eller død! (อิสรภาพหรือความตาย!)"
 denmark_overlord_events.20.t: "[FROM.GetnameDefCap] เรียกรองรัฐบาลชุดใหม"
 denmark_overlord_events.20.desc: "ไมใชความลับที่ [FROM.GetnameDef] เปนผูสนับสนุน[FROM.GetRulingIdeologyNoun]อยางแข็งขัน และมองลัทธิ[ROOT.GetRulingIdeologyNoun]ดวยความดูแคลนอยางที่สุด จึงไมนาแปลกใจนักที่ตอนนี้พวกเขาไมอาจทนใหรัฐใตปกครองของตนยึดถืออุดมการณนี้ไดอีกตอไป พวกเขาแสดงออกอยางชัดเจนที่สุดวาตองการใหเราละทิ้ง[ROOT.GetRulingIdeologyNoun]"
 denmark_overlord_events.20.a: "เราจําเปนตองทํา - เพื่อประโยชนของประชาชน..."
 denmark_overlord_events.20.b: "เราจะไมมีวันยอม!"
 denmark_overlord_events.21.t: "รัฐบาลชุดใหม"
 denmark_overlord_events.21.desc: "เมื่อไมมีทางเลือกนอกจากตองทําตามความตองการของเจาเหนือหัว เราจึงตองจัดตั้งรัฐบาลชุดใหม"
 denmark_overlord_events.21.a: "ประชาธิปไตยรากหญา"
 denmark_overlord_events.21.b: "เพื่อพระราชาและแผนดิน"
 denmark_overlord_events.21.c: "คอมมิวนิสตที่ปราศจากการปฏิวัติ"
 denmark_overlord_events.21.d: "ฟาสซิสตที่ปราศจากการนองเลือด"
 denmark_overlord_events.22.t: "ประชาธิปไตยและเสรีภาพหมายถึงทางเลือกมากมาย"
 denmark_overlord_events.22.desc: "ความงดงามของประชาธิปไตยคือทางเลือกมากมายในการเลือกผูนํา"
 denmark_overlord_events.23.t: "[FROM.GetNameDefCap] ยอมจํานนและเปลี่ยนรัฐบาล"
 denmark_overlord_events.23.desc: "เราโนมนาวชาวเดนมารกใหละทิ้งแนวทางที่ผิดพลาดและหันมายึดถือ[FROM.GetRulingIdeologyNoun]ไดสําเร็จ"
 denmark_overlord_events.23.a: "ดี ดีมาก!"
 denmark_overlord_events.24.t: "[FROM.GetLeader] ไมยอมสละอํานาจ"
 denmark_overlord_events.24.desc: "[FROM.GetLeader] ผูนํา[FROM.GetRulingIdeology]แหง [FROM.GetNameDef] ไมยอมฟงเหตุผลและทําสิ่งที่ดีที่สุดเพื่อประเทศของตน พฤติกรรมกระหายอํานาจเชนนี้เปนลักษณะของ[FROM.GetRulingIdeologyNoun] และเราไมควรแปลกใจนักกับทาทีของชาวเดนมารก เราอาจตองทําใหพวกเขาเปนเยี่ยงอยาง..."
 denmark_overlord_events.24.a: "เราจะจัดการกับพวกเขาทีหลัง"
 denmark_overlord_events.24.b: "ถาเชนนั้นเราจะบังคับพวกเขา"
 denmark_overlord_events.25.t: "[FROM.GetNameDefCap] วางแผนตั้งรัฐบาล[FROM.GetRulingIdeology]"
 denmark_overlord_events.25.desc: "เราปฏิเสธขอเรียกรองของ[FROM.GetAdjective]ที่ใหละทิ้ง[ROOT.GetRulingIdeologyNoun]อยางหนักแนน แตเราควรเขาใจวาพวกเขาจะไมพอใจกับคําตอบนี้  [FROM.GetRulingIdeologyNoun]แบบ[FROM.GetAdjective]ไมมีขีดจํากัด และจะพยายามบีบบังคับเพื่อขึ้นสูอํานาจเสมอ"
 denmark_overlord_events.25.a: "เราตองยอมทําตาม - เพื่อใหประชาชนรอดพนจากสงคราม"
 denmark_overlord_events.26.t: "[FROM.GetNameDefCap] เรียกรองใหเราสั่งหามลัทธิคอมมิวนิสต"
 denmark_overlord_events.26.desc: "เราไดรับขอเรียกรองจาก [FROM.GetNameDef] ใหสั่งหามกิจกรรมคอมมิวนิสตทุกรูปแบบทั่วประเทศ พวกเขาระบุวาการปลอยใหอุดมการณอันเปนภัยนี้เติบโตนั้นแทบไมตางจากการทรยศ ในขณะที่เจาเหนือหัว[FROM.GetAdjective]ผูเด็ดเดี่ยวของเรากําลังปกปองตนเองและโลกเสรีอยางกลาหาญจากประเทศที่ยึดถือลัทธิคอมมิวนิสตอยางเต็มหัวใจ"
 denmark_overlord_events.26.a: "สั่งหามลัทธิคอมมิวนิสต"
 denmark_overlord_events.26.b: "เราจะไมยอมถูกขมเหงใหสั่งหามเสรีภาพทางความคิด!"
 denmark_overlord_events.27.t: "[FROM.GetNameDefCap] สั่งหามลัทธิคอมมิวนิสต"
 denmark_overlord_events.27.desc: "เราโนมนาวรัฐบาลเดนมารกใหสั่งหามลัทธิคอมมิวนิสตไดสําเร็จ ขณะที่เรากําลังตอสูกับอุดมการณนั้นอยางเปนตาย ผูชนะมีไดเพียงหนึ่งเดียว และเราตองเปนฝายชนะเพื่อความรุงเรืองของชาว[ROOT.GetAdjective]!"
 denmark_overlord_events.27.a: "มุงสูชัยชนะ!"
 denmark_overlord_events.28.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะสั่งหามลัทธิคอมมิวนิสต"
 denmark_overlord_events.28.desc: "แมเราจะรองขอและโนมนาวแลว รัฐบาลเดนมารกก็ยังไมยอมฟงเหตุผลและสั่งหามลัทธิคอมมิวนิสต อุดมการณอันเสื่อมทรามนี้ดูเหมือนจะฝงกรงเล็บลึกลงในหัวใจของชาวเดนมารกแลว ขณะที่เรากําลังตอสูกับแนวคิดคอมมิวนิสตอยางเปนตาย ผูชนะมีไดเพียงหนึ่งเดียว และเราตองเปนฝายชนะเพื่อความรุงเรืองของชาว[ROOT.GetAdjective]!"
 denmark_overlord_events.28.a: "เราจะตองชนะ!"
 denmark_overlord_events.29.t: "[FROM.GetNameDefCap] เรียกรองใหเราสั่งหามลัทธิฟาสซิสต"
 denmark_overlord_events.29.desc: "เราไดรับขอเรียกรองจาก [FROM.GetNameDef] ใหสั่งหามกิจกรรมฟาสซิสตทุกรูปแบบทั่วประเทศ พวกเขาระบุวาการปลอยใหอุดมการณอันเปนภัยนี้เติบโตนั้นแทบไมตางจากการทรยศ ในขณะที่เจาเหนือหัว[FROM.GetAdjective]ผูเด็ดเดี่ยวของเรากําลังปกปองตนเองและโลกเสรีอยางกลาหาญจากประเทศที่ยึดถือลัทธิฟาสซิสตอยางเต็มหัวใจ"
 denmark_overlord_events.29.a: "สั่งหามลัทธิฟาสซิสต"
 denmark_overlord_events.30.t: "[FROM.GetNameDefCap] สั่งหามลัทธิฟาสซิสต"
 denmark_overlord_events.30.desc: "เราโนมนาวรัฐบาลเดนมารกใหสั่งหามลัทธิฟาสซิสตไดสําเร็จ ขณะที่เรากําลังตอสูกับอุดมการณนั้นอยางเปนตาย ผูชนะมีไดเพียงหนึ่งเดียว และเราตองเปนฝายชนะเพื่อความรุงเรืองของชาว[ROOT.GetAdjective]!"
 denmark_overlord_events.31.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะสั่งหามลัทธิฟาสซิสต"
 denmark_overlord_events.31.desc: "แมเราจะรองขอและโนมนาวแลว รัฐบาลเดนมารกก็ยังไมยอมฟงเหตุผลและสั่งหามลัทธิฟาสซิสต อุดมการณอันเสื่อมทรามนี้ดูเหมือนจะฝงกรงเล็บลึกลงในหัวใจของชาวเดนมารกแลว ขณะที่เรากําลังตอสูกับแนวคิดฟาสซิสตอยางเปนตาย ผูชนะมีไดเพียงหนึ่งเดียว และเราตองเปนฝายชนะเพื่อความรุงเรืองของชาว[ROOT.GetAdjective]!"
 denmark_overlord_events.32.t: "[FROM.GetNameDefCap] เรียกรองการสงอาวุธ"
 denmark_overlord_events.32.desc: "ดูเหมือนคลังอาวุธของ[FROM.GetAdjective]กําลังรอยหรอ เมื่อพวกเขาหันมาเรียกรองใหเราสงอาวุธใหในความขัดแยงที่ยังดําเนินอยู \nนี่อาจเปนเพียงอุบายแยบยลเพื่อปลดอาวุธประเทศของเรา ไมใหเราลุกฮือขึ้นโคนลมแอก[FROM.GetAdjective]  ที่เราตกอยูภายใต"
 denmark_overlord_events.32.a: "สงอาวุธให"
 denmark_overlord_events.32.b: "อาวุธเพียงนอยนิดที่เรามี เราตองเก็บไวเผื่อสงครามลามมาถึง..."
 denmark_overlord_events.33.t: "[FROM.GetNameDefCap] จัดหาอาวุธให"
 denmark_overlord_events.33.desc: "คําขอใหเดนมารกสงอาวุธของเราไดรับการตอบสนองแลว และเราไดรับอาวุธล็อตแรก"
 denmark_overlord_events.34.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะจัดหาอาวุธ"
 denmark_overlord_events.34.desc: "คําขอใหเดนมารกสงอาวุธของเราถูกปฏิเสธ รัฐบาลเดนมารกใหคําตอบอยางฟงไมขึ้นวาพวกเขาตองเก็บอาวุธเพียงนอยนิดที่มีไวเผื่อสงครามลามมาถึง พวกเขายังอางอีกวาตนเปนประเทศเปนกลาง และการสงอาวุธจะละเมิดความเปนกลางนั้น..."
 denmark_overlord_events.34.a: "ครั้งนี้เราจะปลอยผานไปกอน..."
 denmark_overlord_events.34.b: "พวกเขาหลอกเรางายๆ ไมไดหรอก!"
 denmark_overlord_events.35.desc: "[FROM.GetNameDefCap] ไมหลงกลเรา และบังคับใชกฎหมายใหมที่กําหนดใหสงอาวุธจากโรงงานของเราไปใหพวกเขาโดยตรงอยางตอเนื่อง"
 denmark_overlord_events.35.a: "เราตองการอาวุธเหลานั้นสําหรับตัวเองอยางยิ่ง"
 denmark_overlord_events.36.t: "[FROM.GetNameDefCap] เรียกรองทหารเกณฑ"
 denmark_overlord_events.36.desc: "ดูเหมือนกําลังพลของ[FROM.GetAdjective]กําลังรอยหรอ เมื่อพวกเขาหันมาเรียกรองใหเราสงคนไปเติมกําลังในความขัดแยงที่ยังดําเนินอยู \nนี่อาจเปนเพียงอุบายแยบยลเพื่อปลดอาวุธประเทศของเรา ไมใหเราลุกฮือขึ้นโคนลมแอก[FROM.GetAdjective]  ที่เราตกอยูภายใต"
 denmark_overlord_events.36.a: "เราตองทําตามคําสั่งของนายเหนือหัว..."
 denmark_overlord_events.36.b: "จะไมมีชาวเดนมารกคนใดตองตายในตางแดน!"
 denmark_overlord_events.37.t: "[FROM.GetNameDefCap] ยอมสงทหารเกณฑให"
 denmark_overlord_events.37.desc: "รัฐบาลเดนมารกยอมรับคําขอทหารเกณฑของเรา และสงทหารชุดแรกมาชวยเราในความขัดแยงที่ยังดําเนินอยู"
 denmark_overlord_events.38.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะสงทหารเกณฑ"
 denmark_overlord_events.38.desc: "คําขอทหารเกณฑจากเดนมารกของเราถูกปฏิเสธ รัฐบาลเดนมารกใหคําตอบอยางฟงไมขึ้นวาพวกเขาไมยอมสงพลเมืองของตนไปตายในการรบเพื่อตางชาติบนแผนดินตางแดน พวกเขายังอางอีกวาตนเปนประเทศเปนกลาง และการสงทหารจะละเมิดความเปนกลางนั้น..."
 denmark_overlord_events.38.b: "ถาเชนนั้นเราจะใชกําลังเอามา!"
 denmark_overlord_events.39.desc: "[FROM.GetNameDefCap] ไมสนใจการปฏิเสธสงชายชาวเดนมารกไปตายในสงครามตางแดนของเรา และบังคับใชกฎหมายใหมที่กําหนดใหชายฉกรรจจํานวนหนึ่งตองเขารับราชการในกองทัพ[FROM.GetAdjective]"
 denmark_overlord_events.39.a: "อุกอาจที่สุด!"
 denmark_overlord_events.40.t: "ผูมีอํานาจเต็มแหง[FROM.GetAdjective]"
 denmark_overlord_events.40.desc: "คําสั่งจากกระทรวงการตางประเทศ[FROM.GetAdjective]แจงใหเราทราบวาผูนํา[FROM.GetAdjective]เบื่อหนายกับความรวมมือที่เปราะบางและความสัมพันธอันตึงเครียดระหวางสองประเทศแลว พวกเขาจึงตัดสินใจแทนที่รัฐบาลอันชอบธรรมของเราดวยผูมีอํานาจเต็ม - ผูวาการที่ภักดีตอ [FROM.GetNameDef] \nสิ่งนี้จะจํากัดอํานาจปกครองตนเองและอธิปไตยที่เหลืออยูของเราอยางรุนแรง และอาจสรางความเสียหายที่ไมอาจแกไขได"
 denmark_overlord_events.40.a: "นี่จะเปนรัฐบาล[FROM.GetAdjective]ในทุกดานยกเวนแคชื่อ"
 denmark_overlord_events.40.b: "ชาว[ROOT.GetAdjective]จะไมมีวันยอมจํานนตอเรื่องนี้!"
 denmark_overlord_events.41.t: "ผูมีอํานาจเต็มแหง[ROOT.GetAdjective]เขารับอํานาจ"
 denmark_overlord_events.41.desc: "เปนไปตามที่เราคาดไว รัฐบาลเดนมารกยอมแพตอแรงกดดันของเรา และเราไดแตงตั้งผูมีอํานาจเต็มเพื่อปกครอง [FROM.GetNameDef] สําเร็จแลว สิ่งนี้จะทําใหเรากุมประเทศนั้นแนนขึ้นและดึงพวกเขาเขาใกลเปาหมายของเรามากขึ้น"
 denmark_overlord_events.41.a: "ทุกอยางเปนไปตามแผน"
 denmark_overlord_events.42.t: "รัฐบาลเดนมารกไมยอมลาออก"
 denmark_overlord_events.42.desc: "แผนการแตงตั้งผูมีอํานาจเต็มที่ภักดีเพื่อปกครอง [FROM.GetNameDef] ของเราลมเหลว เพราะความดื้อรั้นและความโงเขลาของรัฐบาลเดนมารกและประชาชน! การตั้งรัฐบาลที่ภักดีตอเปาหมายของเราจะทําใหเรากุมประเทศนั้นแนนขึ้นและดึงพวกเขาเขาใกลเรามากขึ้น"
 denmark_overlord_events.42.a: "เราจะไมกดดันเรื่องนี้ตอ"
 denmark_overlord_events.42.b: "การเปลี่ยนแปลงมักไมเกิดขึ้นโดยสมัครใจ"
 denmark_overlord_events.43.t: "[FROM.GetNameDefCap] บังคับตั้งรัฐบาลผูมีอํานาจเต็ม"
 denmark_overlord_events.43.desc: "[FROM.GetNameDefCap] แสดงใหเห็นอีกครั้งวาพวกเขาไวใจไมได และตองการยุติเอกราชของเดนมารก [FROM.GetLeader] เพิกเฉยตอการปฏิเสธของเราที่จะใหผูมีอํานาจเต็มเขายึดรัฐบาล และ  แตงตั้งขึ้นมาอยูดี"
 denmark_overlord_events.43.a: "เราไมกลากดดันเรื่องนี้ตอ"
 denmark_overlord_events.43.b: "เราจะสูเพื่ออิสรภาพของเรา!"
 denmark_overlord_events.44.t: "[FROM.GetNameDefCap] ตองการผนวกจัตแลนด!"
 denmark_overlord_events.44.desc: "เราเพิ่งเปดโปงแผนการอุกอาจของ[FROM.GetAdjective]ที่จะผนวกจัตแลนดทั้งหมด เราจะไมยอมใหเกิดขึ้นเด็ดขาด!"
 denmark_overlord_events.45.t: "[FROM.GetNameDefCap] ยกจัตแลนดให"
 denmark_overlord_events.45.desc: "ขอเสนอของเราที่จะเขารับหนาที่คุมครองจัตแลนดดูเหมือนจะทําใหบางอยางในตัว [FROM.GetLeader] แตกสลาย เขาทรุดตัวลงบนเกาอี้หลังไดรับคําขอของเรา แลวเพียงพยักหนา"
 denmark_overlord_events.46.t: "[FROM.GetNameDefCap] ปฏิเสธที่จะยกจัตแลนดให"
 denmark_overlord_events.46.desc: "คําขอของเราที่จะเขารับหนาที่คุมครองจัตแลนดดูเหมือนจะทําให [FROM.GetLeader] โกรธเกรี้ยว กอนจะปฏิเสธขอเสนออันใจกวางของเรา"
 denmark_overlord_events.46.b: "ยึดมาอยูดี"
 denmark_overlord_events.47.t: "[FROM.GetNameDefCap] อางสิทธิ์เหนือดินแดนที่เหลือของเรา!"
 denmark_overlord_events.47.desc: "คณะผูแทนจาก [FROM.GetCapitalVictoryPointName] เดินทางมาถึงแลว พรอมยื่นคําประกาศอยางเปนทางการวา [ROOT.GetNameDef] ทั้งหมดจะถูกผนวกรวมเขาในเขตอิทธิพลของ [FROM.GetNameDef] อยางเปนทางการ"
 denmark_overlord_events.48.t: "[FROM.GetNameDefCap] ปฏิเสธการผนวก"
 denmark_overlord_events.48.desc: "[FROM.GetLeader] สงโทรเลขสั้นๆ มาหาเรา โดยมีเพียงคําเดียว - 'ไมมีวัน' ดูเหมือนพวกเขาจะไมตองการการคุมครองเต็มรูปแบบจากเรา"
 denmark_overlord_events.48.b: "อํานาจอันออนแอของพวกเขาเทียบเราไมได!"
 #Rearmament Events
 denmark_protection_event.1.t: "[FROM.GetNameDefCap] เสนอสนธิสัญญาไมรุกราน"
 denmark_protection_event.1.desc: "เชานี้เราไดตอนรับทูตจากรัฐบาล[FROM.GetAdjective] ซึ่งเสนอใหลงนามสนธิสัญญาไมรุกรานกับพวกเขา การเลือกลงนามในขอตกลงนี้หมายถึงการสรางความเปนหุนสวนที่ใกลชิดยิ่งขึ้นกับ[FROM.GetAdjective]"
 denmark_protection_event.1.a: "เราจะลงนามในสนธิสัญญา"
 denmark_protection_event.1.b: "ตอนนี้เรื่องนี้ไมเปนประโยชนตอเรา"
 denmark_protection_event.2.t: "[FROM.GetNameDefCap] ลงนามสนธิสัญญาไมรุกรานแลว"
 denmark_protection_event.2.desc: "ทูตที่เราสงไปยัง [FROM.GetNameDef] กลับมาพรอมขาวดี! รัฐบาล[FROM.GetAdjective]ตัดสินใจลงนามในสนธิสัญญาของเรา และตอนนี้เราทั้งสองไดเขาสูสนธิสัญญาไมรุกรานแลว นี่เปนวันที่ยิ่งใหญของทั้งสองชาติ"
 denmark_protection_event.2.a: "ยอดเยี่ยม!"
 denmark_protection_event.3.t: "[FROM.GetNameDefCap] ปฏิเสธสนธิสัญญาไมรุกราน"
 denmark_protection_event.3.desc: "ทูตที่เราสงไปยัง [FROM.GetNameDef] กลับมาพรอมขาวราย รัฐบาล[FROM.GetAdjective]เห็นวาสนธิสัญญาไมรุกรานไมเปนประโยชนตอพวกเขาในขณะนี้ นาเสียดาย แตเราไมสามารถทําอะไรเพื่อโนมนาวพวกเขาได"
 denmark_protection_event.3.a: "เสียเวลาเปลา..."
 denmark_protection_event.4.t: "[FROM.GetNameDefCap] เสนอขอตกลงการคา"
 denmark_protection_event.4.desc: "เราไดรับขาวจาก [FROM.GetNameDef] วาพวกเขาตองการเพิ่มการคาระหวางสองประเทศ หากเรารับขอเสนอนี้ เราจะสรางความสัมพันธที่ใกลชิดยิ่งขึ้นกับ[FROM.GetAdjective]อยางไมตองสงสัย"
 denmark_protection_event.4.a: "การคาที่เพิ่มขึ้นจะเปนประโยชนตอทั้งสองฝาย"
 denmark_protection_event.4.b: "เราไมจําเปนตองมีสิ่งนี้"
 denmark_protection_event.5.t: "[FROM.GetNameDefCap] ยอมรับขอตกลงการคา"
 denmark_protection_event.5.desc: "ขอตกลงที่เราเสนอตอรัฐบาล[FROM.GetAdjective]ไดรับการยอมรับแลว! เราจะเริ่มเตรียมการเพื่อนําขอตกลงการคาฉบับใหมนี้มาใช"
 denmark_protection_event.5.a: "เริ่มรางขอตกลงได!"
 denmark_protection_event.6.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงการคา"
 denmark_protection_event.6.desc: "นาเสียดายที่ขอเสนอเพิ่มการคาของเราถูก [FROM.GetNameDef] ปฏิเสธ แมเราจะพยายามอยางเต็มที่แลว ดูเหมือนเราจะตองนําขอเสนอไปยื่นที่อื่น"
 denmark_protection_event.6.a: "นาเสียดายยิ่งนัก"
 denmark_protection_event.7.t: "[FROM.GetNameDefCap] เสนอขอตกลงการวิจัย"
 denmark_protection_event.7.desc: "มีขอเสนอจาก [FROM.GetNameDef] ใหทั้งสองประเทศรวมกันทําขอตกลงการวิจัย ซึ่งหมายความวาเราจะแบงปนความกาวหนาทางเทคโนโลยีใหแกกัน เราควรทําอยางไรดี?"
 denmark_protection_event.7.a: "ลงนามในสนธิสัญญา!"
 denmark_protection_event.7.b: "เราไมมีเวลาสําหรับเรื่องนี้"
 denmark_protection_event.8.t: "[FROM.GetNameDefCap] ยอมรับขอตกลงการวิจัย"
 denmark_protection_event.8.desc: "เชานี้เราไดรับขาวจาก [FROM.GetNameDef] วาพวกเขาตัดสินใจรับขอเสนอขอตกลงการวิจัยรวมของเรา นี่เปนขาวดี และหมายความวาความกาวหนาทางเทคโนโลยีของเราจะยิ่งรุดหนาเร็วขึ้นนับจากนี้"
 denmark_protection_event.8.a: "Dejligt! (ยอดเยี่ยม!)"
 denmark_protection_event.9.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงการวิจัย"
 denmark_protection_event.9.desc: "เชานี้เราไดรับขาวจาก [FROM.GetNameDef] วาพวกเขาตัดสินใจปฏิเสธขอเสนอขอตกลงการวิจัยรวมของเรา นาเสียดายที่นั่นหมายความวาเราจะไมไดรับประโยชนจากการแบงปนเทคโนโลยีกับรัฐบาล[FROM.GetAdjective]"
 denmark_protection_event.9.a: "นาผิดหวัง"
 denmark_protection_event.10.t: "[FROM.GetNameDefCap] เสนอขายดินแดน"
 denmark_protection_event.10.desc: "เพื่อแลกกับการรับประกันความคุมครอง [FROM.GetNameDef] เสนอขายดินแดนบางสวนของพวกเขาใหเรา นี่เปนขอเสนอที่นาสนใจไมนอย และเราควรพิจารณาอยางรอบคอบวาจะดําเนินการกับขอตกลงนี้อยางไร"
 denmark_protection_event.10.a: "รับขอตกลง"
 denmark_protection_event.10.b: "เราไมตองการสิ่งนี้"
 denmark_protection_event.11.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอขายดินแดนของเรา"
 denmark_protection_event.11.desc: "ขาวดีเยี่ยม! [FROM.GetNameDefCap] ยอมรับขอเสนอขายดินแดนแลกกับการรับประกันของเราแลว เราตองทําตามขอตกลงในสวนของเราอยางเต็มที่ และเตรียมโอนกรรมสิทธิ์ใหเปนของรัฐบาล[FROM.GetAdjective]"
 denmark_protection_event.11.a: "Dejligt! (ยอดเยี่ยม!)"
 denmark_protection_event.12.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอขายดินแดนของเรา"
 denmark_protection_event.12.desc: "ดูเหมือนขอเสนอขายดินแดนของเราให [FROM.GetNameDef] จะถูกปฏิเสธ คราวหนาเราอาจตองเพิ่มขอเสนอใหนาสนใจยิ่งขึ้นเพื่อใหการเจรจาสําเร็จ"
 denmark_protection_event.12.a: "พวกเขาเสียเองนั่นแหละ"
 denmark_protection_event.100.t: "[FROM.GetNameDefCap] แสวงหาพันธมิตร" 
 denmark_protection_event.100.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] เขามาหาเราพรอมขอเสนอใหรวมมือกัน โดยอางวาหากเรายืนหยัดรวมกัน เราจะสามารถตอกรไดแมกระทั่งกับมหาอํานาจของโลก เราจะวาอยางไร?"
 denmark_protection_event.100.a: "ดีมาก เรายอมรับ"
 denmark_protection_event.100.b: "มีอะไรไมชอบมาพากล"
 denmark_protection_event.101.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเรา"
 denmark_protection_event.101.desc: "นักการทูตผูแทน [FROM.GetLeader] ไดยื่นคําตอบของ [FROM.GetNameDef] ตอขอเสนอเปนพันธมิตรลาสุดของเรา พวกเขาระบุวาเห็นไดชัดวาหากเราไมเสริมการปองกันและรวมมือกัน เราทั้งคูจะลมสลายเมื่อกระแสสงครามมาถึง"
 denmark_protection_event.101.a: "พวกเขาเลือกถูกแลว"
 denmark_protection_event.102.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 denmark_protection_event.102.desc: "นักการทูตผูแทน [FROM.GetLeader] ไดยื่นคําตอบของ [FROM.GetNameDef] ตอขอเสนอเปนพันธมิตรลาสุดของเรา พวกเขาระบุวาเห็นไดชัดวาหากพวกเขาเขารวมกับเรา เราจะพยายามแทรกแซงการเมืองของพวกเขาอยางไมชอบธรรม และพวกเขาไมไดประโยชนอะไรจากขอเสนอนี้เลย จึงปฏิเสธขอเสนอของเรา"
 denmark_protection_event.102.a: "พวกเขาไมรูหรอกวาการกระทํายอมมีผลตามมา"
 denmark_protection_event.110.t: "การซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.110.desc: "นักการทูต[FROM.GetAdjective]เขามาหาเราพรอมคําขอใหจัดการซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective] เพื่อให [DEN.GetNameDef] เตรียมพรอมสําหรับอนาคตไดดียิ่งขึ้น และเพื่อกระชับความรวมมือระหวางสองชาติ"
 denmark_protection_event.110.a: "เปนเรื่องที่ดี"
 denmark_protection_event.110.b: "เราไมมีเวลาสําหรับเรื่องนี้"
 denmark_protection_event.111.t: "การซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.111.desc: "[FROM.GetNameDefCap] ยอมรับขอเสนอจัดการซอมรบ[ROOT.GetAdjective]-[FROM.GetAdjective]ของเรา และผลที่ตามมาคือเราทั้งคูแข็งแกรงขึ้น"
 denmark_protection_event.111.a: "Perfekt! (สมบูรณแบบ!)"
 denmark_protection_event.112.t: "จะไมมีการซอมรบ[ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.112.desc: "[FROM.GetNameDefCap] ทําลายความหวังของเรา และปฏิเสธการซอมรบรวม[ROOT.GetAdjective]-[FROM.GetAdjective] พวกเขามองวาเราไมสําคัญพอที่จะเสียเวลาและแรงงานใหอีก..."
 denmark_protection_event.112.a: "พวกเขาเสียเองนั่นแหละ"
 denmark_protection_event.120.t: "[FROM.GetLeader] ตองการแบงปนเทคโนโลยี"
 denmark_protection_event.120.desc: "[FROM.GetNameDefCap] อาจตามหลังผูอื่นในหลายดาน แตในบางสาขาพวกเขาโดดเดนยิ่งนัก พวกเขาอางวาความรวมมือที่มากขึ้นระหวางหองปฏิบัติการของเราอาจนําไปสูการคนพบที่เปนประโยชนแกทั้งสองฝาย เราจะยอมรับหรือไม?"
 denmark_protection_event.120.a: "ความริเริ่มที่ยอดเยี่ยม!"
 denmark_protection_event.120.b: "พวกเขาแคอยากเกาะเรากิน"
 denmark_protection_event.121.t: "[FROM.GetName] ยอมรับการแบงปนเทคโนโลยี"
 denmark_protection_event.121.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ผูซาบซึ้งใจ ยินดียอมรับคําขอแบงปนเทคโนโลยีของเรา และนักวิทยาศาสตรของเราก็เริ่มประสานงานกันแลว"
 denmark_protection_event.121.a: "เราแข็งแกรงขึ้นเมื่ออยูดวยกัน"
 denmark_protection_event.122.t: "[FROM.GetName] ปฏิเสธการแบงปนเทคโนโลยี"
 denmark_protection_event.122.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ผูไมรูคุณ ปฏิเสธขอเสนอแบงปนเทคโนโลยีของเรา โดยอางวาพวกเขาไมไดประโยชนอะไรจากการแลกเปลี่ยนนี้ และเราเพียงตองการเกาะกินความเชี่ยวชาญทางวิทยาศาสตรของพวกเขา"
 denmark_protection_event.122.a: "ก็ได เก็บความลับไวเองเถอะ"
 denmark_protection_event.130.t: "[FROM.GetNameDefCap] เชิญเราเขารวมพันธมิตร"
 denmark_protection_event.130.desc: "นักการทูต[FROM.GetAdjective]เขามาหาเราพรอมขอเสนอที่นาสนใจ พวกเขาอางวาเราสามารถรวมกันตั้งฝายขึ้นมา เพื่อธํารงสันติภาพและคุมครองซึ่งกันและกัน และทําใหมั่นใจวาจะไมมีภัยใดมาถึงเรา เราจะวาอยางไร?"
 denmark_protection_event.130.a: "เราจะยืนหยัดรวมกัน"
 denmark_protection_event.130.b: "เราขอเดินบนเสนทางอันโดดเดี่ยว"
 denmark_protection_event.131.t: "[FROM.GetNameDefCap] เขารวมฝายของเรา"
 denmark_protection_event.131.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ยอมรับคําขอใหเขารวมฝายกับเรา และพรอมชวยเหลือเราหากจําเปน โดยมีเงื่อนไขวาเราจะทําเชนเดียวกันใหพวกเขายามคับขัน"
 denmark_protection_event.131.a: "Perfekt! (สมบูรณแบบ!)"
 denmark_protection_event.132.t: "[FROM.GetNameDefCap] ไมเขารวมฝายของเรา"
 denmark_protection_event.132.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ปฏิเสธขอเสนอใหเขารวมฝายของเรา โดยระบุวาพวกเขาไดประโยชนนอยมากจากการทําขอตกลงกับปศาจเชนนี้ พวกเขากําลังบอนทําลายเสถียรภาพของภูมิภาค และตองถูกจัดการโดยเร็ว!"
 denmark_protection_event.132.a: "ก็นะ พวกเขาเสียเองนั่นแหละ" 
 denmark_protection_event.200.t: "การซอมรบของกองทัพบก"
 denmark_protection_event.200.desc: "เมื่อเผชิญหนากับสงคราม การเตรียมกองทัพใหพรอมรับมือทุกสิ่งที่จะถาโถมเขามาเปนเรื่องสําคัญ การซอมรบเหลานี้จะทําใหทหารของเราพรอมยิ่งกวาพรอมที่จะปกปองพรมแดนของ [DEN.GetNameDef] ทุกเมื่อที่จําเปน"
 denmark_protection_event.200.a: "Dejligt! (ยอดเยี่ยม!)"
 denmark_protection_event.201.t: "การซอมรบของกองทัพเรือ"
 denmark_protection_event.201.desc: "เมื่อเผชิญหนากับสงคราม การเตรียมกองทัพเรือใหพรอมรับมือทุกสิ่งที่จะถาโถมเขามาเปนเรื่องสําคัญ การซอมรบเหลานี้จะทําใหทหารเรือของเราพรอมยิ่งกวาพรอมที่จะปกปองนานนํ้าของ [DEN.GetNameDef] ทุกเมื่อที่จําเปน"
 denmark_protection_event.201.a: "Dejligt! (ยอดเยี่ยม!)"
 denmark_protection_event.202.t: "การซอมรบของกองทัพอากาศ"
 denmark_protection_event.202.desc: "เมื่อเผชิญหนากับสงคราม การเตรียมกองทัพอากาศใหพรอมรับมือทุกสิ่งที่จะถาโถมเขามาเปนเรื่องสําคัญ การซอมรบเหลานี้จะทําใหนักบินของเราพรอมยิ่งกวาพรอมที่จะปกปองนานฟาของ [DEN.GetNameDef] ทุกเมื่อที่จําเปน"
 denmark_protection_event.202.a: "Dejligt! (ยอดเยี่ยม!)"
 #Conquest Events
 denmark_expansion_event.1.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมถูกผนวก"
 denmark_expansion_event.1.desc: "รัฐบาล[DEN.GetAdjective]สงคําขาดมาเรียกรองให [ICE.GetNameDef] ยอมจํานนและเขารวมเปนสวนหนึ่งของชาติพวกเขา เราตองระมัดระวัง เพราะคําตอบของเราอาจกําหนดอนาคตของ [ICE.GetNameDefCap] ในฐานะประเทศที่มีอธิปไตย หรือที่เลวรายที่สุดคือพาเราเขาใกลสงคราม"
 denmark_expansion_event.1.a: "เราไมมีทางเลือกนอกจากยอมรับ"
 denmark_expansion_event.1.b: "เราจะยอมจํานนตอชาวเดนมารกไมได!"
 denmark_expansion_event.2.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอการรวมชาติอีกครั้งของเรา"
 denmark_expansion_event.2.desc: "เชานี้เราไดรับขาววารัฐบาล[ICE.GetAdjective]ยอมรับขอเสนอของเราที่จะรวมดินแดนของพวกเขากลับเขาสู [DEN.GetNameDefCap] อยางมีนํ้าใจ สิ่งนี้จะชวยใหทั้งสองชาติยืนหยัดรวมกันอยางแข็งแกรงยิ่งขึ้นตอศัตรู"
 denmark_expansion_event.2.a: "ดีใจที่พวกเขาฟงเหตุผล"
 denmark_expansion_event.3.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอการรวมชาติอีกครั้งของเรา"
 denmark_expansion_event.3.desc: "นาเสียดายที่ดูเหมือนรัฐบาล[ICE.GetAdjective]จะปฏิเสธขอเสนอการรวมชาติอีกครั้งของเรา เปนการตัดสินใจที่โงเขลาอยางยิ่ง แตสิ่งนี้จะไมหยุดเราจากการใชสิทธิ์เหนือเกาะแหงนั้น"
 denmark_expansion_event.3.a: "สูสงคราม..."
 denmark_expansion_event.4.t: "[FROM.GetNameDefCap] เรียกรอง [ICE.GetNameDef]"
 denmark_expansion_event.4.desc: "เชานี้เราไดรับขาววารัฐบาล[DEN.GetAdjective]ตองการใหเราโอนกรรมสิทธิ์ [ICE.GetNameDef] ใหแกพวกเขา ตามที่พวกเขาอาง ดินแดนเกาะแหงนี้ควรอยูภายในพรมแดนของพวกเขาโดยชอบธรรม"
 denmark_expansion_event.4.a: "รับได"
 denmark_expansion_event.4.b: "ยอมรับไมได"
 denmark_expansion_event.5.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรอง [ICE.GetNameDef] ของเรา"
 denmark_expansion_event.5.desc: "ดูเหมือนวา [FROM.GetNameDefCap] จะยอมรับขอเรียกรองอันสมเหตุสมผลของเราในการควบคุม [ICE.GetNameDef] แลว นายินดีที่ไดเห็นชาติรวมภูมิภาคทําตัวอยางมีเหตุผล"
 denmark_expansion_event.5.a: "การอางสิทธิ์ของ[DEN.GetAdjective]เปนที่สุด!"
 denmark_expansion_event.6.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรอง [ICE.GetNameDef] ของเรา"
 denmark_expansion_event.6.desc: "ไมนาเชื่อวา [FROM.GetNameDef] จะปฏิเสธขอเรียกรองของเรา! เรามีสิทธิ์อันชอบธรรมเหนือเกาะนั้น และหากไมยอมสงมอบใหเราโดยสันติ เราก็ตองยึดมาดวยกําลัง!"
 denmark_expansion_event.6.a: "รวมพลกองกําลังของเรา!"
 denmark_expansion_event.10.t: "[FROM.GetNameDefCap] เรียกรองใหเรายอมอยูใตปกครอง"
 denmark_expansion_event.10.desc: "ดูเหมือนรัฐบาล[DEN.GetAdjective]กระหายที่จะเหยียบคอเราไวใตรองเทาบูท 'ขอเสนอ' ของพวกเขาเรียกรองใหเรายอมอยูใตการปกครองของพวกเขาทั้งหมดโดยอางเรื่องการไดมาซึ่งทรัพยากร หากเราตองการหลีกเลี่ยงการนองเลือด เราอาจตองยอมจํานน มิฉะนั้นพวกเขาอาจประกาศสงครามกับเรา"
 denmark_expansion_event.10.a: "เราไมควรถูกลากเขาสูสงครามกับเพื่อนบาน"
 denmark_expansion_event.10.b: "[DEN.GetNameDefCap] ไมมีสิทธิ์ในดินแดนของเรา"
 denmark_expansion_event.11.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอใหอยูใตปกครองของเรา"
 denmark_expansion_event.11.desc: "ขาวดีเยี่ยม! ดูเหมือน [SWE.GetNameDef] จะเขาใจวาทรัพยากรของพวกเขาควรแบงปนกับเรา อยางนอยตอนนี้ประเทศของพวกเขาก็จะไดรับการคุมครองจากกองกําลังทหารสมัยใหมของเรา!"
 denmark_expansion_event.11.a: "[DEN.GetNameDefCap] จะยิ่งใหญขึ้น!"
 denmark_expansion_event.12.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอใหอยูใตปกครองของเรา"
 denmark_expansion_event.12.desc: "พวกโงในรัฐบาล[SWE.GetAdjective]ตัดสินใจปฏิเสธขอเสนออันสมเหตุสมผลของเราใหอยูใตปกครอง! ก็ได ถาพวกเขาไมยอมใหทรัพยากร เราก็ตองยึดมาเอง"
 denmark_expansion_event.12.a: "เตรียมขามชองแคบ!"
 denmark_expansion_event.13.t: "[FROM.GetNameDefCap] เรียกรอง [SWE.GetNameDef]"
 denmark_expansion_event.13.desc: "เชานี้เราไดรับขอเรียกรองจากรัฐบาล[DEN.GetAdjective] ใหเราสงมอบ [SWE.GetNameDef] ใหอยูใตการควบคุมของพวกเขา เรามีความภักดีตอ [DEN.GetNameDef] เนื่องจากความเปนเครือญาติระหวางพระมหากษัตริยของเรา แตเราตองพิจารณาวาการปฏิเสธอาจนําไปสูสงครามกับ [DEN.GetNameDef] ได ไมวาจะมีสายเลือดเกี่ยวพันกันหรือไม"
 denmark_expansion_event.13.a: "อยาทําใหพวกเขาโกรธเลย"
 denmark_expansion_event.13.b: "[SWE.GetNameDefCap] อยูภายใตการคุมครองของเรา!"
 denmark_expansion_event.14.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรอง [SWE.GetNameDef] ของเรา"
 denmark_expansion_event.14.desc: "ชาว[NOR.GetAdjective]ไดสติและยอมทําตามขอเรียกรองของเราแลว [SWE.GetNameDefCap] เปนของเรา และตอนนี้เราสามารถนําทรัพยากรของพวกเขามาใชเพื่อสนับสนุนกองทัพใหมของเรา"
 denmark_expansion_event.14.a: "โลหะ[SWE.GetAdjective]สําหรับโรงหลอ[DEN.GetAdjective]"
 denmark_expansion_event.15.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรอง [SWE.GetNameDef] ของเรา"
 denmark_expansion_event.15.desc: "[NOR.GetNameDefCap] ตัดสินใจปฏิเสธขอเรียกรองใหผนวกดินแดน[SWE.GetAdjective]ของเรา นี่เปนเรื่องนาผิดหวังอยางยิ่ง แตเราจะไมปลอยใหสิ่งนี้ขัดขวางเราจากการอางสิทธิ์ในทรัพยากรเหลานั้นอยางชอบธรรม"
 denmark_expansion_event.15.a: "ถาเชนนั้นก็สงคราม"
 denmark_expansion_event.20.desc: "ขาวรายจากทางใต เมื่อ [DEN.GetNameDef] เรียกรองให [NOR.GetNameDefCap] ยอมอยูใตปกครอง และใหเรากลับไปอยูใตการปกครองของ[DEN.GetAdjective]อีกครั้งเปนครั้งแรกนับตั้งแตป 1814 เราอาจตอสูอยางหนักเพื่อใหไดเอกราชจากชาวสวีเดน แตเราพรอมจริงหรือที่จะยืนหยัดตอสูกับชาวเดนมารก?"
 denmark_expansion_event.20.a: "เราไมมีทางเลือกนอกจากตองคุกเขา"
 denmark_expansion_event.20.b: "เราจะไมยอมใหชาติอื่นปกครองอีกเด็ดขาด!"
 denmark_expansion_event.21.desc: "[NOR.GetNameDefCap] ยอมรับขอเสนอใหกองกําลังของเราเขายึดครองอยางชาญฉลาด เมื่อดินแดนทางเหนือมั่นคงแลว เราก็สามารถมุงขยายพรมแดนไปทางอื่นได"
 denmark_expansion_event.21.a: "แนวรบดานเหนือมั่นคงแลว"
 denmark_expansion_event.22.desc: "ชาว[NOR.GetAdjective]ปฏิเสธขอเสนอผนวกของเรา โดยอางวาตองการรักษาอธิปไตยของตน ขออางนี้จะไมหยุดเราจากการทําสิ่งที่ตองทํา"
 denmark_expansion_event.22.a: "[NOR.GetNameDefCap] จะกลับเปนของ[DEN.GetAdjective]อีกครั้ง!"
 denmark_expansion_event.23.t: "[FROM.GetNameDefCap] เรียกรอง [NOR.GetNameDef]"
 denmark_expansion_event.23.desc: "ในฐานะผูยึดครอง [NOR.GetNameDef] ในปจจุบัน เปนเพียงเรื่องของเวลากอนที่ [DEN.GetNameDef] จะมาหาเราพรอมขอเรียกรองในดินแดนเหลานี้ พวกเขาอางวาในทางเทคนิคแลว [NOR.GetNameDef] เปนดินแดนของ[DEN.GetAdjective] เรามีทางเลือก: ยอมใหชาวเดนมารกได [NOR.GetNameDef] ไป หรือปฏิเสธขอเรียกรองและเตรียมรับมือกับความเปนไปไดที่จะเกิดสงคราม"
 denmark_expansion_event.23.a: "เราไมมีเรื่องบาดหมางกับ [DEN.GetNameDef] ยกใหพวกเขาไป"
 denmark_expansion_event.23.b: "[NOR.GetNameDefCap] เปนของเรา!"
 denmark_expansion_event.24.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรอง [NOR.GetNameDef] ของเรา"
 denmark_expansion_event.24.desc: "ดูเหมือนรัฐบาล[SWE.GetAdjective]จะมีสติ! พวกเขาตกลงโอนกรรมสิทธิ์ [NOR.GetNameDef] ใหเรา เรายินดีที่ไดทราบวาพวกเขาก็มองวาเราเปนผูปกครองอันชอบธรรมของดินแดนเหลานั้นเชนกัน"
 denmark_expansion_event.24.a: "ยอดเยี่ยม"
 denmark_expansion_event.25.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรอง [NOR.GetNameDef] ของเรา"
 denmark_expansion_event.25.desc: "นาเสียดายที่ [SWE.GetNameDef] ปฏิเสธที่จะยอมตามขอเรียกรองของเราในการครอบครอง [NOR.GetNameDef] นี่เปนเรื่องนาผิดหวังอยางยิ่ง โดยเฉพาะเมื่อในอดีตเราเคยโอนประเทศนี้ใหอยูใตการควบคุมของพวกเขา เราหวังวาพวกเขาจะตอบแทนนํ้าใจนั้น"
 denmark_expansion_event.25.a: "อนิจจา ถาเชนนั้นก็สงคราม"
 denmark_expansion_event.100.t: "[FROM.GetNameDefCap] เริ่มกระบวนการผนวกรวมแลว"
 denmark_expansion_event.100.desc: "[DEN.GetLeader] แจงใหเราทราบวาเขาไดเริ่มกระบวนการผนวกรวมประเทศของเราเขากับราชอาณาจักร[DEN.GetAdjective]อยางแทจริงแลว"
 denmark_expansion_event.100.a: "เราไมมีทางเลือกนอกจากตองยอม"
 denmark_expansion_event.200.t: "[FROM.GetNameDefCap] เรียกรองดินแดน[ICE.GetAdjective]ของเรา"
 denmark_expansion_event.200.desc: "[DEN.GetNameDefCap] ดูเหมือนจะเชื่อวาตนมีสิทธิ์ทางประวัติศาสตรเหนือดินแดน[ICE.GetAdjective]ของเรา หากเราตามใจพวกเขา เราก็เสี่ยงจะเสียดินแดนใหกับการขยายอํานาจของ[DEN.GetAdjective] หากเราปฏิเสธ ก็จะเกิดสงครามเต็มรูปแบบ"
 denmark_expansion_event.200.a: "เราตองยอมตามขอเรียกรองของพวกเขา..."
 denmark_expansion_event.200.b: "[ROOT.GetNameDefCap] จะไมมีวันยอมแพชาวเดนมารก!"
 denmark_expansion_event.201.t: "[FROM.GetNameDefCap] ยอมรับการอางสิทธิ์[ICE.GetAdjective]ของเรา"
 denmark_expansion_event.201.desc: "[FROM.GetNameDefCap] ตัดสินใจอยางชาญฉลาดที่ยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือดินแดนของพวกเขา เปนการเดินหมากที่ฉลาดของรัฐบาลพวกเขาจริงๆ"
 denmark_expansion_event.201.a: "การเจรจาจบลงอยางรวดเร็ว"
 denmark_expansion_event.202.t: "[FROM.GetNameDefCap] ปฏิเสธการอางสิทธิ์[ICE.GetAdjective]ของเรา"
 denmark_expansion_event.202.desc: "นาเสียดายสําหรับพวกเขา รัฐบาล[FROM.GetAdjective]ปฏิเสธการอางสิทธิ์ของเรา ดูเหมือนเราไมมีทางเลือกนอกจากนําสงครามไปถึงหนาประตูบานพวกเขา เพื่อยึดคืนสิ่งที่เปนของ[DEN.GetAdjective]โดยชอบธรรม"
 denmark_expansion_event.202.a: "บางทีการใชกําลังอาจทําใหพวกเขายอมงายขึ้น"
 denmark_expansion_event.210.t: "[FROM.GetNameDefCap] เรียกรองดินแดน[SWE.GetAdjective]ของเรา"
 denmark_expansion_event.210.desc: "[DEN.GetNameDefCap] ดูเหมือนจะเชื่อวาตนมีสิทธิ์ทางประวัติศาสตรเหนือดินแดน[SWE.GetAdjective]ของเรา หากเราตามใจพวกเขา เราก็เสี่ยงจะเสียดินแดนใหกับการขยายอํานาจของ[DEN.GetAdjective] หากเราปฏิเสธ ก็จะเกิดสงครามเต็มรูปแบบ"
 denmark_expansion_event.210.a: "เราตองยอมตามขอเรียกรองของพวกเขา..."
 denmark_expansion_event.210.b: "[ROOT.GetNameDefCap] จะไมมีวันยอมแพชาวเดนมารก!"
 denmark_expansion_event.211.t: "[FROM.GetNameDefCap] ยอมรับการอางสิทธิ์[SWE.GetAdjective]ของเรา"
 denmark_expansion_event.211.desc: "[FROM.GetNameDefCap] ตัดสินใจอยางชาญฉลาดที่ยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือดินแดนของพวกเขา เปนการเดินหมากที่ฉลาดของรัฐบาลพวกเขาจริงๆ"
 denmark_expansion_event.211.a: "การเจรจาจบลงอยางรวดเร็ว"
 denmark_expansion_event.212.t: "[FROM.GetNameDefCap] ปฏิเสธการอางสิทธิ์[SWE.GetAdjective]ของเรา"
 denmark_expansion_event.212.desc: "นาเสียดายสําหรับพวกเขา รัฐบาล[FROM.GetAdjective]ปฏิเสธการอางสิทธิ์ของเรา ดูเหมือนเราไมมีทางเลือกนอกจากนําสงครามไปถึงหนาประตูบานพวกเขา เพื่อยึดคืนสิ่งที่เปนของ[DEN.GetAdjective]โดยชอบธรรม"
