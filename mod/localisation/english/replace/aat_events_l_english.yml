 AAT_MIO_events.2.t: "การลงทุนใน$CZE_skoda_works$"
 AAT_MIO_events.2.desc: "นักอุตสาหกรรมที่$CZE_skoda_works$กระตือรือรนที่จะไดรับเงินลงทุน แตเรามีงบประมาณพอจะทุมใหกับเพียงหนึ่งในสามสาขาของบริษัทเทานั้น ซึ่งจะทําใหพวกเขาสามารถใหความสําคัญกับการพัฒนายุทโธปกรณดานเรือ รถถัง หรือปนใหญได"
