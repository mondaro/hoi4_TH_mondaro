 denmark_expansion_event.230.b: "[ROOT.GetNameDefCap] จะไมมีวันยอมแพชาวเดนมารก!"
 denmark_expansion_event.231.t: "[FROM.GetNameDefCap] ยอมรับการอางสิทธิ์[NOR.GetAdjective]ของเรา"
 denmark_expansion_event.231.desc: "[FROM.GetNameDefCap] ตัดสินใจอยางชาญฉลาดที่ยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือดินแดนของพวกเขา เปนการเดินหมากที่ฉลาดของรัฐบาลพวกเขาจริงๆ"
 denmark_expansion_event.231.a: "การเจรจาจบลงอยางรวดเร็ว"
 denmark_expansion_event.232.t: "[FROM.GetNameDefCap] ปฏิเสธการอางสิทธิ์[NOR.GetAdjective]ของเรา"
 denmark_expansion_event.232.desc: "นาเสียดายสําหรับพวกเขา รัฐบาล[FROM.GetAdjective]ปฏิเสธการอางสิทธิ์ของเรา ดูเหมือนเราไมมีทางเลือกนอกจากนําสงครามไปถึงหนาประตูบานพวกเขา เพื่อยึดคืนสิ่งที่เปนของ[DEN.GetAdjective]โดยชอบธรรม"
 denmark_expansion_event.232.a: "บางทีการใชกําลังอาจทําใหพวกเขายอมงายขึ้น"
 denmark_expansion_event.300.t: "[FROM.GetNameDefCap] เสนอสิทธิ์ในทรัพยากร"
 denmark_expansion_event.300.desc: "วันนี้รัฐบาล[DEN.GetAdjective]เขามาหาเราพรอมขอเสนอสิทธิ์ในทรัพยากรของดินแดน $STATE_666$ ที่พวกเขาเพิ่งพิชิตได พื้นที่ดังกลาวอุดมไปดวยแรธาตุ บางทีขอเสนอนี้อาจคุมคาแกการพิจารณา?"
 denmark_expansion_event.300.a: "เรายอมรับขอเสนออันใจกวางนี้!"
 denmark_expansion_event.300.b: "เราไมจําเปนตองมีสิ่งนี้"
 denmark_expansion_event.301.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอสิทธิ์ในทรัพยากรของเรา"
 denmark_expansion_event.301.desc: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเราเกี่ยวกับทรัพยากร[SWE.GetAdjective]ที่เพิ่งไดมาอยางมีนํ้าใจ บางทีนี่อาจหมายความวาสองประเทศของเราจะมีความสัมพันธที่ดีตอกันตอไปในอนาคต"
 denmark_expansion_event.301.a: "ยอดเยี่ยม!"
 denmark_expansion_event.302.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอสิทธิ์ในทรัพยากรของเรา"
 denmark_expansion_event.302.desc: "นาเสียดายที่ [FROM.GetNameDef] ปฏิเสธขอเสนออันใจกวางของเราเรื่องทรัพยากร[SWE.GetAdjective] บางทีเราควรนําการเจรจาไปที่อื่นดีกวา?"
 denmark_expansion_event.302.a: "เสียมารยาทจริงๆ"
 denmark_expansion_event.400.t: "คําถามวาดวยความเปนกลาง"
 denmark_expansion_event.400.desc: "เปนเวลาหลายปแลวที่ [ROOT.GetNameDef] วางตัวเปนกลางมาโดยตลอดในความขัดแยงมากมายที่รุมเราโลก แตเมื่อความตึงเครียดในยุโรปทวีขึ้นอีกครั้ง เราตองตั้งคําถามในที่สุดวาความเปนกลางหมายถึงอะไร สแกนดิเนเวียและทะเลบอลติกเปนจุดศูนยกลางของประเทศเรามาหลายศตวรรษ และเปนเรื่องสําคัญยิ่งที่เราตองตัดสินใจวาจะดําเนินความสัมพันธกับพวกเขาตอไปอยางไร"
 denmark_expansion_event.400.a: "ตอนนี้พวกเขาไมใชฟาสซิสตแลว เราอาจเขาขาง [GER.GetNameDef] ได"
 denmark_expansion_event.400.b: "ตั้งฝายของเราเองและเชิญชาติอื่นเขารวม"
 denmark_expansion_event.400.c: "บางทีตอนนี้เราควรอยูนอกเรื่องนี้ไปกอน..."
 denmark_expansion_event.401.t: "[FROM.GetNameDefCap] แสวงหาพันธมิตร"
 denmark_expansion_event.401.desc: "[FROM.GetNameDefCap] วางตัวเปนกลางในมหาสงครามและคงความเปนกลางนั้นมาตลอดหลายปหลังจากนั้น แตเชานี้เราไดตอนรับคณะผูแทนชาวเดนมารก[FROM.GetAdjective] ซึ่งบงบอกอยางชัดเจนวาพวกเขากําลังพิจารณาละทิ้งจุดยืนนี้ นี่อาจเปนโอกาสเหมาะที่จะดึงพวกเขามาอยูฝายเรา"
 denmark_expansion_event.500.t: "ขอเสนอเปนพันธมิตร"
 denmark_expansion_event.500.desc: "เพื่อแสดงความเปนนํ้าหนึ่งใจเดียวกันและมอบความมั่นคงใหแกชาติเล็กๆ ในยุโรป [FROM.GetNameDef] จึงเขามาหาเราพรอมขอเสนอเปนพันธมิตร เราจะเขารวมกับมิตรสหาย[FROM.GetAdjective]ของเราหรือไม? หรือเราควรยืนหยัดดวยตัวเอง?"
 denmark_expansion_event.500.a: "เราจะเขารวมกับ [FROM.GetNameDef]!"
 denmark_expansion_event.500.b: "วันนี้เรายังไมจําเปนตองมีพันธมิตร"
 denmark_expansion_event.501.t: "[DEN.GetNameDefCap] ไดพันธมิตรใหม"
 denmark_expansion_event.501.desc: "[FROM.GetNameDefCap] ตกลงรับขอเสนอเปนพันธมิตรของเราและลงนามในคําประกาศอยางเปนทางการแลว ขอใหเรายืนหยัดรวมกันฝาพายุ และรับประกันความมั่นคงของกันและกันไปอีกหลายป"
 denmark_expansion_event.501.a: "ยอดเยี่ยม!"
 denmark_expansion_event.502.t: "[FROM.GetNameDefCap] ปฏิเสธการเปนพันธมิตร"
 denmark_expansion_event.502.desc: "นาเสียดายที่ [FROM.GetNameDef] ปฏิเสธขอเสนอเปนพันธมิตรของเรา ดูเหมือนการรับประกันความมั่นคงรวมกันจะไมเปนประโยชนตอพวกเขาเทาใดนัก"
 denmark_expansion_event.502.a: "นาเสียดายยิ่งนัก"
 denmark_expansion_event.600.t: "[FROM.GetNameDefCap] ขอทําขอตกลงการวิจัย"
 denmark_expansion_event.600.desc: "เพื่อเสริมสรางความรวมมือระหวางสองชาติ รัฐบาล[FROM.GetAdjective]ขอใหเราเขารวมขอตกลงการวิจัย เพื่อแบงปนความเชี่ยวชาญทางเทคโนโลยีใหแกกัน"
 denmark_expansion_event.600.a: "ยอมรับ สิ่งนี้มีแตจะชวยใหเราทั้งคูแข็งแกรงขึ้น"
 denmark_expansion_event.600.b: "เราไมมีเวลาสําหรับเรื่องนี้"
 denmark_expansion_event.601.t: "[FROM.GetNameDefCap] เขารวมขอตกลงการวิจัยของเรา"
 denmark_expansion_event.601.desc: "ขาวดี! [FROM.GetNameDefCap] ตกลงเขารวมโครงการแบงปนเทคโนโลยีกับเรา ซึ่งหมายความวาเราจะเขาถึงความกาวหนาทางเทคโนโลยีของพวกเขาได และจะชวยเราไดอยางแนนอนในการดําเนินแผนเพื่ออนาคตของประเทศนี้"
 denmark_expansion_event.601.a: "เราแข็งแกรงขึ้นเมื่ออยูดวยกัน!"
 denmark_expansion_event.602.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 denmark_expansion_event.602.desc: "แมเราจะพยายามอยางเต็มที่ รัฐบาล[FROM.GetAdjective]ก็ตัดสินใจเก็บเทคโนโลยีไวกับตัวเอง นาเสียดาย เพราะหากรวมมือกัน เราอาจพัฒนาขีดความสามารถทางเทคโนโลยีไดไกลกวาที่เปนอยูมาก"
 denmark_expansion_event.602.a: "นาเสียดาย..."
 denmark_expansion_event.700.t: "การแทรกแซงของ[FROM.GetAdjective]"
 denmark_expansion_event.700.desc: "เราพบหลักฐานการบอนทําลายของ[FROM.GetAdjective]ใน [ROOT.GetNameDef] ที่พยายามชักจูงความคิดเห็นของสาธารณชน การปลอยใหชาวเดนมารกดําเนินกิจกรรมนี้ตอไปจะสงผลรายแรงตอเรา"
 denmark_expansion_event.701.t: "[FROM.GetNameDefCap] ขัดขวางแผนของเรา"
 denmark_expansion_event.701.desc: "ชาว[FROM.GetAdjective]ขัดขวางแผนของเราที่จะชักจูงความคิดเห็นของสาธารณชนใหเปนมิตรตอเปาหมายของเรามากขึ้น"
 denmark_expansion_event.800.t: "[FROM.GetNameDefCap] เสนอการคุมครอง"
 denmark_expansion_event.800.desc: "คณะผูแทน[FROM.GetAdjective]เขามาหาเรา เสนอใชแสนยานุภาพทางทหารทั้งหมดของพวกเขาเพื่อคุมครองเรา สิ่งเดียวที่พวกเขาขอตอบแทนคือใหเราคุกเขา..."
 denmark_expansion_event.801.t: "[FROM.GetNameDefCap] ยอมรับการคุมครองของเรา"
 denmark_expansion_event.801.desc: "เราไดรับคําตอบจากรัฐบาล[FROM.GetAdjective]เกี่ยวกับขอเสนอคุมครองพวกเขาอยางเต็มที่ และพวกเขายินดียอมรับการคุมครองเต็มรูปแบบจากเรา!"
 denmark_expansion_event.802.t: "[FROM.GetNameDefCap] ปฏิเสธการคุมครองของเรา"
 denmark_expansion_event.802.desc: "เราไดรับคําตอบจากรัฐบาล[FROM.GetAdjective]เกี่ยวกับขอเสนอคุมครองพวกเขาอยางเต็มที่ และนาเสียดายที่พวกเขาไมยอมคุกเขา เมื่อเวลาผานไปพวกเขาจะรูวานี่เปนความผิดพลาดที่โงเขลาเพียงใด"
 #Fascist Events
 denmark_fascist_event.1.t: "[FROM.GetNameDefCap] ขอการสนับสนุนจากเรา"
 denmark_fascist_event.1.desc: "เชานี้เราไดตอนรับคณะผูแทนจากพรรคฟาสซิสต[FROM.GetAdjective] ซึ่งมาขอการสนับสนุนจากเราในความพยายามชวงชิงอํานาจในประเทศของพวกเขา หากเราชวยเหลือ ก็หมายถึงอีกชาติหนึ่งที่อาจเปนพันธมิตรที่คูควรตอเปาหมายของเรา"
 denmark_fascist_event.1.a: "เราจะสนับสนุนการขึ้นสูอํานาจของพวกเขา!"
 denmark_fascist_event.1.b: "ตอนนี้เรามีเรื่องที่ใหญกวาตองกังวล"
 denmark_fascist_event.2.t: "[FROM.GetNameDefCap] สงการสนับสนุนมาให"
 denmark_fascist_event.2.desc: "ดูเหมือนคําวิงวอนขอการสนับสนุนจากภายนอกของเราจะไดรับการตอบรับ เมื่อ [FROM.GetNameDef] ตกลงยื่นมือชวยเหลือในความพยายามยึดอํานาจในรัฐบาลของเรา นี่เปนกาวที่ถูกทางสําหรับขบวนการทางการเมืองของเรา"
 denmark_fascist_event.2.a: "Dejligt! (ยอดเยี่ยม!)"
 denmark_fascist_event.3.t: "[FROM.GetNameDefCap] ปฏิเสธคําขอของเรา"
 denmark_fascist_event.3.desc: "นาเสียดายที่รัฐบาล[FROM.GetAdjective]ปฏิเสธที่จะสงการสนับสนุนในความพยายามโคนลมรัฐสภาริกสดากของเรา ตามสถานการณตอนนี้ เราอาจตองเผชิญการตอตานดวยอาวุธตอการรัฐประหารของเรา ทําใหการขึ้นสูอํานาจยากลําบากยิ่งขึ้น นี่เปนเรื่องนาผิดหวังอยางยิ่ง"
 denmark_fascist_event.3.a: "Fordømt! (บัดซบ!)"
 denmark_fascist_event.3.b: "เราจะหาหนทางของเราเอง!"
 denmark_fascist_event.20.t: "[FROM.GetNameDefCap] ขอทําขอตกลงการวิจัย" 
 denmark_fascist_event.20.desc: "เพื่อเสริมสรางความรวมมือระหวางสองชาติ รัฐบาล[FROM.GetAdjective]ขอใหเราเขารวมขอตกลงการวิจัย เพื่อแบงปนความเชี่ยวชาญทางเทคโนโลยีใหแกกัน"
 denmark_fascist_event.20.a: "ยอมรับ สิ่งนี้มีแตจะชวยใหเราทั้งคูแข็งแกรงขึ้น"
 denmark_fascist_event.20.b: "เราไมมีเวลาสําหรับเรื่องนี้"
 denmark_fascist_event.21.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอของเรา"
 denmark_fascist_event.21.desc: "ขาวดี! [FROM.GetNameDefCap] ตกลงเขารวมโครงการแบงปนเทคโนโลยีกับเรา ซึ่งหมายความวาเราจะเขาถึงความกาวหนาทางเทคโนโลยีของพวกเขาได และจะชวยเราไดอยางแนนอนในการดําเนินแผนเพื่ออนาคตของประเทศนี้"
 denmark_fascist_event.21.a: "กองทัพของเราจะเปนที่อิจฉาของชาตินอรดิก!"
 denmark_fascist_event.22.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอของเรา"
 denmark_fascist_event.22.desc: "แมเราจะพยายามแสดงไมตรีอยางเต็มที่ รัฐบาล[FROM.GetAdjective]ก็ตัดสินใจเก็บเทคโนโลยีไวกับตัวเอง นาเสียดาย เพราะหากรวมมือกัน เราอาจพัฒนาขีดความสามารถทางเทคโนโลยีไดไกลกวาที่เปนอยูมาก"
 denmark_fascist_event.22.a: "ก็ได เก็บความลับไวเองเถอะ"
#Trade Events
 denmark_trade_deal.1.t: "[FROM.GetNameDefCap] เสนอขอตกลงการคา"
 denmark_trade_deal.1.desc: "คณะผูแทนชาวเดนมารกเขามาหาเราพรอมขอเสนอการคา เดนมารกผลิตอาหารจํานวนมาก ซึ่งในอดีตเรานําเขามาไมนอย เมื่อไมนานมานี้พวกเขาลดคาเงินโครนของตน ทําใหสินคาเกษตรของพวกเขามีความสามารถในการแขงขันสูงขึ้นมาก ขอตกลงการคานี้อาจเปนประโยชนอยางยิ่งตอเรา เพราะจะชวยประกันอาหารใหประชาชนและเสริมความแข็งแกรงใหเสนทางเสบียงของเรา"
 denmark_trade_deal.1.a: "เรื่องนี้อาจเปนประโยชน"
 denmark_trade_deal.1.b: "เราไมจําเปนตองใชสินคาเดนมารก"
 denmark_trade_deal.2.t: "[FROM.GetNameDefCap] ยอมรับขอเสนอการคาของเรา"
 denmark_trade_deal.2.desc: "คณะผูแทนการคาของเรากลับมาจาก [FROM.GetName] พรอมผลลัพธที่ดี! ชาว[FROM.GetAdjective]ลงนามในขอตกลงการคาที่เสนอแลว ซึ่งจะชวยเสริมความแข็งแกรงใหภาคเกษตรกรรมของเรา และสรางงานและโอกาสใหมๆ"
 denmark_trade_deal.2.a: "การตัดสินใจที่ยอดเยี่ยมสําหรับทั้งสองฝาย!"
 denmark_trade_deal.3.t: "[FROM.GetNameDefCap] ปฏิเสธขอเสนอการคาของเรา"
 denmark_trade_deal.3.desc: "คณะผูแทนการคาของเรากลับมาจาก [FROM.GetName] อยางผิดหวัง ดูเหมือนชาว[FROM.GetAdjective]จะไมเห็นประโยชนของขอเสนอการคาของเรา - ทั้งที่มีอยูมากมาย นี่จะเปนความถดถอยสําหรับภาคเกษตรกรรม แตก็ไมใชสิ่งที่เรารับมือไมได"
 denmark_trade_deal.3.a: "ถาอยางนั้นก็ปลอยใหพวกเขาหิวไปเถอะ!"
 denmark_trade_deal.4.t: "คําขอขยายขอตกลงการคา"
 denmark_trade_deal.4.desc: "[FROM.GetLeader] สงคณะผูแทนการคามาหาเรา ขอขยายขอตกลงการคาสินคาเกษตรที่มีอยูแลว ดูเหมือนพวกเขาจะตองการผลผลิตของเราไมรูจักพอ การขยายขอตกลงนี้จะสรางงานเพิ่มและทําใหเกษตรกรของเราเขมแข็งยิ่งขึ้น"
 denmark_trade_deal.4.a: "ขอเสนอที่ยอดเยี่ยม!"
 denmark_trade_deal.4.b: "เรามีสิ่งที่ตองการอยูแลว"
 denmark_trade_deal.5.desc: "คณะผูแทนการคาของเรากลับมาจาก [FROM.DetName] พรอมขาวดีเยี่ยม! หัวหนาคณะผูแทนแจงเราวา [FROM.GetLeader] กระตือรือรนอยางยิ่งที่จะลงนามในขอเสนอขยายขอตกลงการคาของเรา"
 denmark_trade_deal.6.desc: "คณะผูแทนการคาของเรากลับมาจาก [FROM.DetName] พรอมขาวที่นากังวล หัวหนาคณะผูแทนแจงเราวา [FROM.GetLeader] คอนขางไมใสใจเรื่องการขยายขอตกลงการคาที่มีอยู และไมเห็นประโยชนของการกระชับความสัมพันธระหวางสองประเทศ"
 denmark_trade_deal.6.a: "ชางเปนโอกาสที่สูญเปลา!"
 denmark_trade_deal.7.t: "[FROM.GetNameDefCap] ยกเลิกขอตกลงการคา"
 denmark_trade_deal.7.desc: "[ROOT.GetLeader] ไดรับโทรเลขสวนตัวจาก [FROM.GetLeader] แจงวาขอตกลงการคาสินคาเกษตรระหวางสองประเทศจะสิ้นสุดลง โดยไมมีคําอธิบายใดๆ ทําใหทุกคนตองคาดเดาความหมายเบื้องหลังการตัดสินใจกะทันหันนี้"
 denmark_trade_deal.7.a: "ถาอยางนั้นก็เหลือใหเรามากขึ้น!"
 denmark_trade_deal.7.b: "เราจะอยูไดโดยไมตองพึ่งสินคาของพวกเขา"
 denmark_trade_deal.8.t: "[GetCanceledTradeTitle]"
 denmark_trade_deal.8.t_subjugation_cancelation: "การยึดครองทําใหการคากับเดนมารกหยุดชะงัก"
 denmark_trade_deal.8.t_war_cancelation_partner: "สงครามทําใหการคากับเดนมารกหยุดชะงัก"
 denmark_trade_deal.8.t_war_cancelation_denmark: "สงครามทําใหการคากับ[FROM.GetAdjective]หยุดชะงัก"
 denmark_trade_deal.8.desc: "[GetCanceledTradeDesc]"
 denmark_trade_deal.8.desc_subjugation_cancelation: "การคาผลผลิตจากเดนมารกทั้งหมดยุติลงเนื่องจากการรุกรานและการเขาครอบงํา [DEN.GetNameDef] โดย[?DEN.DEN_overlord_nation.GetAdjective]"
 denmark_trade_deal.8.desc_war_cancelation_partner: "ขอตกลงการคากับ [DEN.GetNameDef] ยุติลงเนื่องจากความเปนปรปกษระหวางสองประเทศเมื่อไมนานมานี้"
 denmark_trade_deal.8.desc_war_cancelation_denmark: "ขอตกลงการคากับ [FROM.GetNameDef] ยุติลงเนื่องจากความเปนปรปกษระหวางสองประเทศเมื่อไมนานมานี้"
 denmark_trade_deal.8.a: "เหตุการณอันนาเสียดาย"
 denmark_trade_deal.8.b: "อยางไรเสียขอตกลงนี้ก็ถึงคราวสิ้นสุดอยูแลว"
 denmark_trade_deal.8.c: "พวกเขาไมคูควรกับผลผลิตของเรา!"

 denmark_events.1.t: "สิ้นสุดยุควิกฤต"
 denmark_events.1.desc: "ในที่สุด หลังจากความยากลําบากทางเศรษฐกิจมาหลายป ความทุกขยากที่ภาวะเศรษฐกิจตกตํ่าครั้งใหญนํามาก็ผานพนไปแลว ตลอดยุควิกฤต เราทํางานหนักเพื่อสรางเสถียรภาพใหเศรษฐกิจ[DEN.GetAdjective] และชดเชยความเสียหายที่วิกฤตการณนํามาสูประเทศของเรา"
 denmark_events.1.a: "เรากําลังมุงไปในทิศทางที่ถูกตอง"
 DEN_end_of_crisis_consumer_goods_modifier_tt: "$DEN_modify_industrial_capability_dynamic_modifier$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10.0%§!\n\n"
 denmark_events.2.t: "ประชาชนรูสึกปลอดภัย"
 denmark_events.2.desc: "นับตั้งแตเราทุมงบประมาณเสริมปอมปราการตามแนวพรมแดน เราไดรับรายงานจากประชาชนวาพวกเขาเริ่มรูสึกปลอดภัยขึ้น โดยเฉพาะเมื่อพายุในยุโรปกอตัวรุนแรงขึ้น หวังวาแนวปองกันเหลานี้จะตานทานผูใดก็ตามที่อาจวางแผนยึดครอง [DEN.GetNameDef] ในอนาคตได"
 denmark_events.2.a: "ความปลอดภัยตองมากอน"
 denmark_events.100.t: "พระราชาเดนมารกเสด็จมาขอลี้ภัย!"
 denmark_events.100.desc: "หลังการปฏิวัติครั้งใหญที่กวาดไปทั่ว [DEN.GetNameDef] เราไดรับขาววาพระราชาเดนมารกและพระราชวงศทรงขอลี้ภัยในประเทศของเรา การใหที่พักพิงแกกษัตริยที่ถูกเนรเทศไมใชการตัดสินใจที่งาย ดังนั้นเราควรชั่งนํ้าหนักทางเลือกกอนตัดสินใจเรื่องสําคัญเชนนี้ เราจะชวยพระราชาเดนมารกหรือไม? หรือจะสงพระองคไปที่อื่น?"
 denmark_events.100.a: "รับพระองคไว เราสามารถชวยฟนฟูราชอาณาจักรของพระองคได"
 denmark_events.100.b: "ที่นี่ไมมีใครรักพระราชา"
 denmark_events.200.t: "ทอรวัลด สเตานิง ถึงแกอสัญกรรม"
 denmark_events.200.desc: "ทอรวัลด สเตานิง นักการเมืองคนสําคัญ ไดถึงแกอสัญกรรมแลว เขาดํารงตําแหนงนายกรัฐมนตรีเดนมารกหลายสมัยและเปนที่ชื่นชมของผูคนมากมาย ในชวงบั้นปลายชีวิต เขากังวลมากขึ้นเรื่อยๆ เกี่ยวกับอนาคตของสังคมประชาธิปไตยในยุโรป"
 denmark_events.200.a: "สงเขาสูสุคติ"
 denmark_events.201.t: "พระเจาคริสเตียนที่ 10 สวรรคต"
 denmark_events.201.desc: "พระเจาคริสเตียนที่ 10 ผูทรงปกครองพสกนิกรชาวเดนมารกมาสามสิบหาป และทรงนําประเทศผานชวงเวลาที่ปนปวนที่สุดชวงหนึ่งของยุโรป ไดเสด็จสวรรคตอยางสงบเมื่อคืนนี้ พระราชโอรส พระเจาเฟรเดอริกที่ 9 ทรงสืบราชสมบัติตอ"
 denmark_events.201.a: "ขอพระราชาทรงพระเจริญ"
 denmark_events.300.t: "บริษัทใหมๆ ถูกกอตั้งขึ้น"
 denmark_events.300.desc: "เราคอยๆ ฟนฟูเศรษฐกิจทีละกาว และบริษัทใหมๆ ถูกกอตั้งขึ้นแทบทุกวัน ประเทศกําลังเจริญรุงเรือง การเปลี่ยนแปลงทางเทคโนโลยีก็กําลังเกิดขึ้นเชนกัน เมื่อบางบริษัทเริ่มทดลองวาจะทําอะไรไดบางกับพลาสติก"
 denmark_events.300.a: "Leg Godt (เลนใหสนุก)"
 denmark_events.666.t: "มหาเดนมารกผงาด"
 denmark_events.666.desc: "เราดํารงอยูอยางเลือนรางมาเนิ่นนาน โดยเชื่อวาวันเวลาอันยิ่งใหญที่สุดของเราไดผานพนไปแลว  เราปดตกความฝนถึงความยิ่งใหญใดๆ โดยไมเคยคิดทบทวน - แตไมอีกตอไป ยุคทองใหมอยูตรงหนาเราแลว! อํานาจและอิทธิพลของเราเติบโตขึ้นทุกวัน และถึงเวลาแลวที่จะประกาศสถาปนามหาเดนมารก"
 denmark_events.666.a: "ใหโลกไดชื่นชมความรุงโรจนของเรา!"
 denmark_events.666.b: "ดูจะเกินไปหนอยนะ..."

  # Iceland
 iceland_events.1.t: "เดนมารกถูกโจมตี"
 iceland_events.1.desc: "กองกําลัง[?ICE.overlord_attacker.GetAdjective]โจมตีเดนมารก [ROOT.getName] ไดออกแถลงการณประกาศความเปนกลาง ซึ่งหวังวาทุกฝายจะเคารพ\n$ICE_sveinn_bjornsson$ ไดรับการประกาศใหเปนผูสําเร็จราชการแทนพระองคในยามที่ไมมีพระราชา และเขารับผิดชอบนโยบายตางประเทศของ [ROOT.GetName] โดยพฤตินัย แนนอนวานี่ถือเปนมาตรการชั่วคราว จนกวาสถานการณจะมีเสถียรภาพและโลกจะสงบสุขขึ้น แตในตอนนี้ [ROOT.GetName] ดําเนินการในฐานะชาติที่มีอธิปไตยในทุกความหมายของคํา"
 iceland_events.1.a: "ชั่วคราวหรือไม คอยดูกัน"

  # News Events
 aat_news.1.t: "ไอซแลนดประกาศความเปนกลาง"
 aat_news.1.desc: "รัฐสภาอัลติงของไอซแลนดออกแถลงการณประกาศความเปนกลางของไอซแลนดในความขัดแยงระหวางเดนมารกและ [?ICE.overlord_attacker.GetName] \nรัฐสภายังประกาศให $ICE_sveinn_bjornsson$ เปนผูสําเร็จราชการแทนพระองคในยามที่ไมมีพระราชา และ $ICE_sveinn_bjornsson$ จะดูแลนโยบายตางประเทศของไอซแลนด แถลงการณระบุวานี่เปนมาตรการชั่วคราว และความสัมพันธกับเดนมารกแบบกอนสงครามจะกลับคืนมาเมื่อความขัดแยงยุติลง อยางไรก็ตาม จนกวาจะถึงวันนั้น ไอซแลนดก็เปนเอกราชโดยพฤตินัย"
 aat_news.1.a: "ความเปนกลางไมไดชวยเดนมารกไว"

 aat_news.2.t: "ความรวมมือ[ICE.GetAdjective]-[USA.GetAdjective]"
 aat_news.2.desc: "ในความเคลื่อนไหวที่คอนขางนาประหลาดใจ รัฐบาล[USA.GetAdjective]ประกาศให [ICE.GetName] อยูในเขตผลประโยชนของตน และตามคํารองขอของรัฐบาล[ICE.GetAdjective] ไดตกลงสงทหารมาคุมครอง [ICE.GetName] นโยบายตางประเทศทั้งหมดของไอซแลนดจะอยูภายใตการดูแลของรัฐบาล[USA.GetAdjective]นับจากนี้ ทําให [ICE.GetName] กลายเปนรัฐหุนเชิดของ[USA.GetAdjective]โดยพฤตินัย"
 aat_news.2.a: "ความเคลื่อนไหวที่นาสนใจ"


 iceland_events.2.t: "[FROM.GetName] ขอการคุมครองจาก[ROOT.GetAdjective]"
 iceland_events.2.desc: "เอกอัครราชทูต[ICE.GetAdjective]ประจํา [ROOT.Capital.GetCapitalVictoryPointName] ขอใหเราสงทหารไปยัง [FROM.GetName] โดยสรุปคือพวกเขาขอการคุมครองจาก[ROOT.GetAdjective]เพื่อรับมือกับการรุกรานที่อาจเกิดขึ้น และเสนอมอบการดูแลนโยบายตางประเทศใหเราเปนการตอบแทน"
 iceland_events.2.a: "โอกาสอันยิ่งใหญ"
 iceland_events.2.b: "ไม พวกเขาตองจัดการปญหาของตัวเอง"
 iceland_events.2.c: "อยาทําใหความสัมพันธ[ROOT.GetAdjective]-[FROM.OVERLORD.GetAdjective]เสียหายเลย"

 iceland_events.3.t: "[FROM.GetNameDefCap] ตอบรับ"
 iceland_events.3.desc: "รัฐบาล[FROM.GetAdjective]ยอมรับคําขอของเราใหเขารับผิดชอบการปองกัน [ROOT.GetName] หวังวาประเทศของเราจะไดรับประโยชนจากเรื่องนี้ ไมเพียงแคไมตองเสี่ยงถูกรุกราน แตยังไดประโยชนทางการเงินจากผลที่การมาประจําการของ[FROm.GetAdjective]จะมีตอเกาะแหงนี้ดวย"
 iceland_events.3.a: "ตอนนี้เรานาจะปลอดภัยแลว"

 iceland_events.4.t: "[FROM.GetNameDefCap] ปฏิเสธ"
 iceland_events.4.desc: "นาเสียดายที่ [FROM.GetLeader] ไมตองการยืนหยัดเพื่อ [ROOT.GetName] โดยอางเหตุผลหลักวา [FROM.GetNameDef] มีปญหาของตัวเองมากพออยูแลว [FROM.GetLeader] จึงไมกลาประกาศให [FROM.GetNameDef] เปนผูคุมครอง [ROOT.GetNameDef]"
 iceland_events.4.a: "ถาอยางนั้นเราตองหาทางออกอื่น"
 iceland_events.5.t: "สงครามสเปน"
 iceland_events.5.desc: "การปะทุของสงครามในสเปนทําใหการสงออกของไอซแลนดไปยังภูมิภาคนั้นลดลงอยางมาก สเปนเคยเปนผูนําเขาปลาแหงรายใหญของไอซแลนด นี่เปนเรื่องนาเสียดายไมเพียงสําหรับอุตสาหกรรมประมง แตสําหรับไอซแลนดทั้งประเทศ เพราะเปนหนึ่งในไมกี่ภาคสวนที่เริ่มฟนตัวหลังสงครามและภาวะเศรษฐกิจตกตํ่าครั้งใหญ"
 iceland_events.5.a: "นี่คือลางราย"
 iceland_events.5.b: "วันสิ้นโลกใกลมาถึงแลว!"
 iceland_events.5.c: "เศรษฐกิจตางหากเลา เจาพวกโง!"
 iceland_events.5.d: "อยากเกิดในยุคที่ผูคนรูแจงกวานี้จัง"
 iceland_events.6.t: "หุนสวนที่เทาเทียม"
 iceland_events.6.desc: "[FROM.GetLeader] ออกประกาศอยางเปนทางการวา เนื่องจาก [FROM.GetName] กําลังทําสงครามรวมกับเดนมารกและแบกรับภาระของตนเองได จึงไมจําเปนตองมีการชี้นําจากเดนมารกในดานนโยบายตางประเทศ - หรือเรื่องอื่นใดเกี่ยวกับการเมือง[FROM.GetAdjective]อีกตอไป นี่คือการประกาศเอกราชโดยพฤตินัยอยางชัดเจน"
 iceland_events.6.a: "พูดกันตามตรง เราทําอะไรไดไมมากนัก"
 iceland_events.6.b: "ชางอวดดี เราจะจัดการพวกเขาเมื่อสงครามนี้จบลง"
 iceland_events.7.t: "[FROM.GetName] ยอมรับเอกราชของเรา"
 iceland_events.7.desc: "นอกจากเสียงบนพึมพําเล็กนอยในรัฐสภาเดนมารก คําประกาศความเทาเทียมกับเดนมารกของเราก็ไมพบการตอตานอยางจริงจัง ชาวเดนมารกเขาใจจุดยืนของเรา และเมื่อพิจารณาวาเรากําลังทําสงครามรวมกัน พวกเขาเห็นวาความรวมมือในอนาคตสําคัญกวาสถาบันศักดินาเกาแกและความภาคภูมิใจชาตินิยม พระเจาคริสเตียนทรงสละราชสมบัติในฐานะพระมหากษัตริยแหงไอซแลนดตามที่เรารองขอ ตอนนี้เราเปนชาติที่มีอธิปไตยอยางสมบูรณ อยางไรก็ตาม เราตองตัดสินใจวาจะจัดการกับปญหาเรื่องสถาบันกษัตริยอยางไร ตอนนี้เราเปนราชอาณาจักรที่ไมมีพระราชา ..."
 iceland_events.7.a: "เราไมตองการพระราชา"
 iceland_events.7.b: "เดนมารกยังมีเจานายอีกหลายพระองค..."
 iceland_events.8.t: "คําขอจากไอซแลนด"
 iceland_events.8.desc: "นองเล็กกลางทะเลของเราตระหนักไดวาราชอาณาจักรที่ไมมีพระราชานั้นดูแปลกประหลาด พวกเขาจึงกลับมาหาเราพรอมคําขอใหเจาชายพระองคหนึ่งของราชวงศเดนมารกขึ้นครองราชยเปนพระมหากษัตริยแหงไอซแลนด เพื่อเปนสัญลักษณแหงมิตรภาพในอนาคต ตามที่พวกเขาวา"
 iceland_events.8.a: "อีกสักครั้ง - เพื่อเจาชายคนุด"
 iceland_events.8.b: "ฉันวาไมใชความคิดที่ดีนัก"
 iceland_events.9.t: "พระราชาชาวเดนมารกอีกครั้ง"
 iceland_events.9.desc: "การเจรจาของเรากับราชสํานัก[FROM.GetAdjective]ประสบผลสําเร็จ เจาชายคนุดไดรับการทูลเชิญใหขึ้นครองราชบัลลังกไอซแลนดและทรงตอบรับแลว"
 iceland_events.9.a: "ทรงพระเจริญ พระเจาคนุด ผูปกครองแหง [ROOT.GetName]!"
 iceland_events.9.b: "ดี เราตองทําใหแนใจวาพระราชอํานาจของพระองคมีขอบเขตจํากัด"
 iceland_events.10.t: "การเจรจาไมเปนผล"
 iceland_events.10.desc: "การหารือของเรากับราชสํานักเดนมารกไมเปนผล พวกเขายังคงเจ็บปวดกับการที่ [ROOT.GetName] ไมตองการอยูใตการปกครองของ [DEN.GetName] อีกตอไป บางทีอาจถึงเวลาที่ตองกาวตอไปแลว"
 iceland_events.10.a: "ถาอยางนั้นก็เปนสาธารณรัฐละกัน"
 iceland_events.11.t: "[FROM.GetName] ไมพอใจ"
 iceland_events.11.desc: "แมเราจะพยายามอยางเต็มที่ [FROM.GetName] ก็ไมยอมรับความจริงที่วา [ROOT.GetName] ไมตองการถูกปกครองจาก [FROM.Capital.GetCapitalVictoryPointName] อีกตอไป พวกเขาถึงขั้นขูจะใชกําลังกับเรา อยางไรก็ตาม พวกเขาไมนาจะทําสําเร็จ ในเมื่อ [ROOT.GetName] เริ่มสรางกองกําลังปองกันแลว"
 iceland_events.11.a: "หนทางขางหนาของเรายังคงแนวแน"
 iceland_events.12.t: "[FROM.GetLeader] ตองการคาชดเชย"
 iceland_events.12.desc: "[FROM.GetLeader] เรียกรองคาชดเชยสําหรับความพยายามของ[FROM.GetAdjective]ในการชวยเหลือ [ROOT.GetName] ตลอดหลายปที่ผานมา โดยเฉพาะในชวงยากลําบากเมื่อเร็วๆ นี้ ตามที่ [FROM.GetLeader] กลาว สิ่งนี้จะชวยให [FROM.GetNameDef] เติบโตและคงความสามารถในการสนับสนุน [ROOT.GetName] ในอนาคต รวมถึงทําให [FROM.GetName] อยูในสถานะที่ดีขึ้นในการปกปองหมูเกาะเหลานี้"
 iceland_events.12.a: "ยกทั้ง [101.GetName] และ [337.GetName] ใหพวกเขา"
 iceland_events.12.b: "ไม พวกเขายังทําไมมากพอที่จะสมควรไดรับสิ่งนี้"
 iceland_events.12.c: "ยกใหสักเกาะหนึ่งคงไมเสียหายอะไร"
 iceland_events.13.t: "[101.GetName] และ [337.GetName] จะเปนของ[ROOT.GetAdjective]"
 iceland_events.13.desc: "[FROM.GetLeader] เขาใจและสนับสนุนคําขอคาชดเชยอันชอบธรรมของเราอยางเต็มที่ [FROM.GetName] ตัดสินใจสงมอบทั้ง [101.GetName] และ [337.GetName] ใหแก [ROOT.GetName] พวกเขาเห็นพองวาเราอยูในสถานะที่ดีกวาในการปกปองหมูเกาะเหลานี้ และการสราง [ROOT.GetName] ที่แข็งแกรงขึ้นเปนประโยชนสูงสุดตอทุกฝาย"
 iceland_events.13.a: "จักรวรรดิของเราขยายตัว"
 iceland_events.14.t: "[FROM.GetLeader] ปฏิเสธ"
 iceland_events.14.desc: "นาเสียดายที่คําขอคาชดเชยอันชอบธรรมและนอบนอมของเรา สําหรับความชวยเหลือทั้งหมดที่เรามอบให [FROM.GetName] ตลอดหลายป ไมไดรับความสนใจเลย [FROM.GetLeader] ปฏิเสธที่จะใหอะไรเราทั้งสิ้น ทั้งที่การทําเชนนั้นจะเปนประโยชนสูงสุดตอ [FROM.GetName] เอง"
 iceland_events.14.a: "เราจะตองใชกําลังเอาสิ่งที่เปนของเรามา"
 iceland_events.15.t: "คาชดเชยจาก [FROM.GetName]"
 iceland_events.15.desc: "โชคดีที่รัฐบาล[FROM.GetAdjective]เขาใจความตองการของเรา และอนุมัติคําขอคาชดเชยเปนดินแดน แนนอนวา [ROOT.GetName] จะตองจายเงินจํานวนเล็กนอยเพื่อชดเชยให [FROM.GetName] แตในตอนนี้นั่นเปนเรื่องเล็กนอย"
 iceland_events.15.a: "วันนี้เปนวันแหงความภาคภูมิใจของ [ROOT.GetName]"
 iceland_events.17.t: "[FROM.GetNameDefCap] ประกาศเอกราช"
 iceland_events.17.desc_kingdom: "รัฐสภา[FROM.getAdjective]ประกาศใหความสัมพันธกับพระเจาคริสเตียนที่ 10 เปนโมฆะ พวกเขาไมถือวาพระมหากษัตริยแหงเดนมารกเปนพระมหากษัตริยแหงไอซแลนดอีกตอไป ผลที่ตามมาคือพวกเขาประกาศวาเดนมารกไมมีอิทธิพลใดๆ ตอการเมืองของ [FROM.getName] อีกแลว ไมวาจะเปนกิจการภายในหรือตางประเทศ"
 iceland_events.17.desc_generic: "รัฐสภา[FROM.getAdjective]ประกาศให [FROM.GetNameDef] เปนประเทศที่เปนเอกราชและมีอธิปไตยโดยสมบูรณ ไมผูกพันกับชาติใดๆ ซึ่งหมายความวาพวกเขาตัดขาดจากเราอยางเปนทางการและประกาศเอกราชฝายเดียว"
 iceland_events.17.a: "เรามีเรื่องเรงดวนกวานี้"
 iceland_events.17.b: "เราจะจัดการเรื่องนี้เมื่อถึงเวลาที่เหมาะสม"
 iceland_events.18.t: "[FROM.GetNameDefCap] ยอมรับเอกราชของ[ROOT.GetAdjective]"
 iceland_events.18.desc: "[FROM.GetNameDefCap] เพียงแคประทวงเล็กนอย พวกเขาไมกลายั่วยุชาว[ROOT.GetAdjective]ไปมากกวานี้ ตอนนี้ [ROOT.GetNameDefCap] สามารถมุงความสนใจไปยังปญหาที่เรงดวนกวาความสัมพันธกับ [FROM.GetName] ไดแลว"
 iceland_events.18.a: "ดีมาก"
 iceland_events.19.t: "[FROM.GetNameDefCap] ไมยอมรับเอกราชของ[ROOT.GetAdjective]"
 iceland_events.19.desc: "พวกกระหายสงครามแหง [FROM.GetNameDefCap] ตัดสินใจไมใหสัตยาบันสนธิสัญญามอบเอกราชใหเราที่ไดรับเสนอไป แตกลับยืนกรานวา [ROOT.GetName] เปนสวนหนึ่งของ [FROM.GetName] และขูจะใชกําลังบังคับใหกลับมาสวามิภักดิ์ ตอนนี้เราตองเตรียมรับมือกับพายุที่กําลังจะมาถึง"
 iceland_events.19.a: "ก็ลองดูสิ"

 iceland_events.20.t: "[ICE.GetName] เรียกรองใหเราคืนกรีนแลนด"
 iceland_events.20.desc: "[ICE.GetLeader] แหง [ICE.GetNameDef] ประกาศสถาปนาจักรวรรดิทะเลเหนือแหงใหม โดยอิงจากพรมแดนของชาวไวกิงในอดีต เนื่องจากกรีนแลนดเคยเปนสวนหนึ่งของดินแดนนี้ ตอนนี้เราจึงถูกขอใหชวยสงมอบเกาะนี้ใหแกพวกเขา"
 iceland_events.20.a: "ไมคุมที่จะสูรบเพื่อมัน..."
 iceland_events.20.b: "พวกเขาไมมีเหตุผลอันสมควรที่จะเรียกรอง!"

 iceland_events.21.t: "กรีนแลนดกลับคืนมาแลว!"
 iceland_events.21.desc: "ผูนําอันออนแอของ [FROM.GetNameDef] ตัดสินใจมอบการควบคุมกรีนแลนดใหเรา เพราะดูเหมือนพวกเขาไมตองการเสี่ยงขัดแยงกับเรา นี่พิสูจนวายุคแหงความรุงโรจนของเราไดหวนคืนมาอีกครั้ง!"
 iceland_events.21.a: "นี่เปนขาวดี"

 iceland_events.22.t: "[FROM.GetName] ยังคงแข็งขอ"
 iceland_events.22.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ยืนหยัดแข็งขอในประเด็นกรีนแลนด ในเมื่อพวกเขาดูเหมือนจะตองการพินาศดวยคมดาบของเรา ก็จงไดตามที่ปรารถนา"
 iceland_events.22.a: "พวกเขาจะตองพินาศ!"

 iceland_events.23.t: "[ICE.GetName] ประกาศตนเปน "ผูพิทักษเสนทางทะเลเหนือ""
 iceland_events.23.desc: "[ICE.GetLeader] ประกาศตอสาธารณะให [ICE.GetNameDef] เปนผูพิทักษทะเลเหนือ [ICE.GetNameDefCap] จะทําหนาที่เปนผูรับประกันความปลอดภัยของประชากรบนหมูเกาะในทะเลเหนือ\nดังนั้น ตามที่ [ICE.GetLeader] กลาว [ROOT.GetNameDef] ควรยกการควบคุมดินแดนในทะเลเหนือของเราใหแก [ICE.GetName]"
 iceland_events.23.a: "ไมคุมที่จะสูรบเพื่อเกาะแหงแลงไมกี่เกาะ"
 iceland_events.23.b: "ไมมีทางเปนเชนนั้น"

 iceland_events.24.t: "[FROM.GetNameDefCap] ยอมตามขอเรียกรองของเรา"
 iceland_events.24.desc: "ผูนําอันออนแอของ [FROM.GetNameDef] ตัดสินใจมอบการควบคุมดินแดนในทะเลเหนือของพวกเขาใหเรา เพราะดูเหมือนพวกเขาไมตองการเสี่ยงขัดแยงกับเรา"
 iceland_events.24.a: "จักรวรรดิของเราขยายตัว"

 iceland_events.25.t: "[FROM.GetName] ยังคงแข็งขอ"
 iceland_events.25.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ปฏิเสธที่จะสงมอบดินแดนในทะเลเหนือใหเรา พวกเขาเยาะเยยคําขอของเรา และบอกวาถาเราตองการหมูเกาะนั้น ก็ตองใชกําลังยึดเอาเอง"
 iceland_events.25.a: "ถาเชนนั้นก็ตองใชกําลัง"

 iceland_events.45.t: "การเลือกตั้งประธานาธิบดี"
 iceland_events.45.desc: "ถึงเวลาแลวที่ [ROOT.GetName] จะสลัดพันธนาการของระบอบกษัตริย หนทางขางหนาอยูที่ประชาชน และประธานาธิบดีที่พวกเขาเลือกตั้งขึ้นมา"
 iceland_events.45.a: "$ICE_sveinn_bjornsson$ คือผูนําที่สมบูรณแบบ"
 iceland_events.45.b: "$ICE_hermann_jonasson$ ไดทําคุณประโยชนอันยิ่งใหญใหประเทศมาแลวในอดีต"
 iceland_events.45.c: "$ICE_olafur_thors$ สามารถนําเราสูอนาคตได"
 iceland_events.45.d: "$ICE_brynjolfur_bjarnason$ คือผูที่สามารถรวมประชาชนเปนหนึ่งเดียว"
 iceland_events.45.e: "$ICE_gisli_sigurbjornsson$ จะนําความรุงโรจนมาสู [ROOT.GetName]"

 iceland_events.26.t: "นํ้ามันของเราหมดแลว!"
 iceland_events.26.desc: "โรงกลั่นนอกชายฝงของเรารายงานวาไมพบนํ้ามันรอบ [ICE.GetName] อีกแลว แหลงนํ้ามันเหือดแหง และคาดวาจะไมพบแหลงนํ้ามันหรือกาซอีกในอนาคต การดําเนินการตอไปจะเปนเพียงการสิ้นเปลืองทรัพยากร"
 iceland_events.26.a: "ก็นะ มันเปนอยางนี้แหละ..."




 ###############
 ### FINLAND ###
 ###############

 AAT_finland_motti.01.t: "ยุทธวิธีมอตติของ[FROM.GetAdjective]"
 AAT_finland_motti.01.desc: "กองทหาร[FROM.GetAdjective]เริ่มใชยุทธวิธีมอตติในพื้นที่ [FROM.FROM.GetName] แลว ยุทธวิธีมอตติเปนเทคนิคที่รายกาจ โดยกองกําลัง[FROM.GetAdjective]จะโอบลอมทหารขาศึกและตัดเสนทางเสบียง ทําใหขาศึกเปดชองใหถูกโจมตี สิ่งนี้ทําใหกองกําลังผูรุกรานเสี่ยงอยางยิ่งตอการรุกของ[FROM.GetAdjective] และเราตองดําเนินการอยางรวดเร็วเพื่อไมใหพวกเขาไดเปรียบ หากเราตองการบุกเขาฟนแลนด"
 AAT_finland_motti.01.a: "เฝาระวังและเตรียมพรอมรบ!"
 AAT_finland_motti_tt: "\n§Rนับจากนี้ [FROM.GetNameDefCap] จะสามารถเตรียมยุทธวิธีมอตติในรัฐที่เปนดินแดนหลักอื่นๆ ได§!"

 AAT_finland_national_defense.01.t: "คลังอาวุธลับของ[FROM.FROM.GetAdjective]ใน [?FIN_state_with_weapon_caches.GetName]"
 AAT_finland_national_defense.01.desc: "หนวยขาวกรองของเรารายงานวามีคลังอาวุธลับของฟนแลนดซอนอยูใน [?FIN_state_with_weapon_caches.GetName] เราคาดไดวาปฏิบัติการทางทหารที่นั่นจะถูกขัดขวางอยางมาก และตองระวังยุทธวิธีที่ดุดันขึ้นของขบวนการตอตานในทองถิ่น ขึ้นอยูกับวาพวกเขามองวาปฏิบัติการเหลานี้สําเร็จเพียงใด เราอาจเจอเรื่องไมคาดฝนแบบเดียวกันในรัฐอื่นๆ ของฟนแลนด" 
 AAT_finland_national_defense.01.a: "มาตรการที่ไรประโยชน"
 AAT_finland_national_defense.02.t: "ยึดคลังอาวุธลับของ[FIN.GetAdjective]ใน [FROM.FROM.GetName] ไดแลว"
 AAT_finland_national_defense.02.desc: "หลังไดรับรายงานวามีคลังอาวุธลับของฟนแลนดซอนอยูใน [FROM.FROM.GetName] ทหารของเราไดกวาดลางพื้นที่ พวกเขารายงานวาพบคลังอาวุธฝงอยูใตอาคาร ซุกซอนในตนไมลม และจมอยูในทะเลสาบโดยหอดวยถุงชุบนํ้ามัน เรายึดทั้งหมดที่พบแลว และเชื่อวาไมมีเหลืออีก อยางนอยก็ไมมากพอที่ตองใสใจ"
 AAT_finland_national_defense.02.a: "ขาวดีเยี่ยม"
 AAT_finland_national_defense.02.b: "ดี แตอยามารบกวนฉันดวยรายงานเรื่องคลังอาวุธอีก"
 AAT_finland_national_defense.03.t: "[FROM.GetName] ยึดคลังอาวุธลับของเราใน [FROM.FROM.FROM.GetName]"
 AAT_finland_national_defense.03.desc: "แมเราจะพยายามอยางเต็มที่ในการซอนคลังอาวุธลับจากศัตรูใน [FROM.FROM.GetName] แตสายลับของขาศึกก็สามารถคนพบและยึดไปได อาจยังเหลืออยูบาง แตไมมากพอที่จะสรางความแตกตางอยางมีนัยสําคัญในพื้นที่นี้"
 AAT_finland_national_defense.03.a: "ขาวรายแรง!"
 AAT_finland_national_defense.03.b: "เรามีเรื่องที่สําคัญกวาตองจัดการ"
 FIN_weapon_caches_in_state_tt: "\nคลังอาวุธลับจะถูกลบออกหลังจากมีอยูครบ §Y4 ป§! \nปลดล็อกหมวดการตัดสินใจ §Y$FIN_finnish_resistance_category$§! ซึ่งทําใหเราสามารถออกคนหาและยึดคลังอาวุธลับได"
 FIN_weapon_caches_seized_event_spam_tt: "\nเราจะยังคงไดรับเหตุการณเกี่ยวกับการยึดคลังอาวุธลับในรัฐอื่นๆ ของฟนแลนด"
 FIN_weapon_caches_seized_event_no_spam_tt: "\nเราจะไมไดรับเหตุการณเกี่ยวกับการยึดคลังอาวุธลับในรัฐอื่นๆ ของฟนแลนดอีก"
 FIN_weapon_caches_seized_by_enemy_event_spam_tt: "\nเราจะยังคงไดรับเหตุการณเกี่ยวกับการที่ขาศึกยึดคลังอาวุธลับของเราในรัฐอื่นๆ"
 FIN_weapon_caches_seized_by_enemy_event_no_spam_tt: "\nเราจะไมไดรับเหตุการณเกี่ยวกับการที่ขาศึกยึดคลังอาวุธลับของเราในรัฐอื่นๆ อีก"

 AAT_finland_misc_events.01.t: "การอพยพเด็ก"
 AAT_finland_misc_events.01.desc: "ขณะที่[GetFinnishWinterWarOrNot]ยังคงดําเนินไปอยางดุเดือด รัฐบาล[ROOT.GetAdjective]ไดตัดสินใจอยางยากลําบากที่จะอพยพเด็กๆ ของชาติไปยัง[GetFinnishChildrenDestination]เพื่อความปลอดภัย การตัดสินใจอันแสนปวดใจนี้เกิดขึ้นเพราะอันตรายที่พลเรือนตองเผชิญอยูตลอดเวลาในความขัดแยง\n\nการอพยพครั้งนี้เปนภารกิจขนาดใหญ มีครอบครัวนับไมถวนตองพลัดพราก และเด็กๆ ตองทิ้งบานของตนไวเบื้องหลัง แตเราตองระลึกวาความปลอดภัยของพวกเขาสําคัญที่สุด และเราตองทําทุกอยางที่ทําไดเพื่อปกปองพวกเขาจากภยันตราย\n\nขณะที่ชาว[ROOT.GetAdjective]ตองอดทนตอความโหดรายของสงคราม เราตองยึดมั่นในความหวังและเชื่อมั่นวาลูกหลานของเราจะปลอดภัยและไดรับการดูแลในชวงเวลายากลําบากนี้ หนทางขางหนาอาจยาวไกลและทาทาย แตเราตองอดทนและยืนหยัดอยางเขมแข็งเมื่อเผชิญกับความทุกขยาก"
 FIN_winter_war_name: "สงครามฤดูหนาวกับ [SOV.GetNameDef]"
 FIN_normal_war: "สงคราม"
 FIN_children_destination_sweden: "[SWE.GetNameDef]"
 FIN_children_destination_norway: "[NOR.GetNameDef]"
 FIN_children_destination_denmark: "[DEN.GetNameDef]"
 FIN_children_destination_iceland: "[ICE.GetNameDef]"
 FIN_children_destination_other: "ประเทศเปนกลางที่ไมไดเขารวมความขัดแยงทางทหาร"
 AAT_finland_misc_events.01.a: "ชวยลูกหลานของเรา!"

 AAT_finland_misc_events.02.t: "การหามเตนรํา"
 AAT_finland_misc_events.02.desc: "ขณะที่สงครามยังดําเนินตอไป นักการเมืองและบุคคลชั้นนําจํานวนมากขึ้นเรื่อยๆ ผลักดันใหหามการเตนรําในที่สาธารณะ เพื่อแสดงความเคารพและความเปนนํ้าหนึ่งใจเดียวกันกับทหารของเราที่สูรบอยูในแนวหนา\n\nบุคคลเหลานี้มองวาการเตนรําในยามวิกฤตเชนนี้ไมเหมาะสม พวกเขากลาววาเปนหนาที่ของเราที่จะสนับสนุนทหารและแสดงความทุมเทตอความพยายามในสงครามดวยการงดกิจกรรมเชนนี้ และอางวาผูฝาฝนควรถูกปรับหรือแมกระทั่งจําคุก\n\nอยางไรก็ตาม อีกหลายคนแสดงความรังเกียจตอขอเสนอนี้ โดยอางวาในประเทศอื่น การเตนรํายังไดรับการสงเสริมเพื่อชวยใหผูคนทนตอสภาพอันโหดรายของสงคราม"
 AAT_finland_misc_events.02.a: "เราทุกคนตองเสียสละในยามยากลําบากเชนนี้ ไมวามันจะดูโงเขลาเพียงใด"
 AAT_finland_misc_events.02.b: "นี่มันโงชัดๆ"

 AAT_finland_misc_events.03.t: "ความชวยเหลือจาก[?FIN_faction_leader_recieving_resource_rights.GetAdjective]สําหรับโครงการพัฒนา"
 AAT_finland_misc_events.03.desc: "การลงทุนตอเนื่องในโครงสรางพื้นฐานดานการทําเหมืองแรใหผลตอบแทนเพิ่มขึ้นเรื่อยๆ แตเราอดคิดไมไดวาเราจะไดมากกวานี้อีก หากขอความชวยเหลือดานทรัพยากรและความเชี่ยวชาญจากชาติที่ใหญกวา \n\nเราควรติดตอ [?FIN_faction_leader_recieving_resource_rights.GetNameDef] และเสนอสวนแบงของวัตถุดิบที่ได หากพวกเขาชวยเราดานการลงทุนและผูเชี่ยวชาญ เพื่อยกระดับการทําเหมืองของเราขึ้นไปอีกขั้น การทําเชนนี้จะเปนประโยชนตอทั้งสองฝาย"

 AAT_finland_misc_events.03.a: "ใช เราควรติดตอ [?FIN_faction_leader_recieving_resource_rights.GetNameDef] เพื่อขอการลงทุนเพิ่ม"
 AAT_finland_misc_events.03.b: "ไม เราไมตองการเปนหนี้บุญคุณผูอื่น"
 AAT_finland_misc_events.03_tt: "เพิ่ม +1"
 AAT_finland_misc_events.04.t: "ตอบแทนความชวยเหลือ"
 AAT_finland_misc_events.04.desc: "หลังการเจรจากับ [?FIN_faction_leader_recieving_resource_rights.GetNameDef] ในชวงแรกคืบหนาไปดวยดี ตอนนี้กลับหยุดชะงักที่ประเด็นสําคัญ นั่นคือ พวกเขาจะไดอะไรตอบแทน? [?FIN_faction_leader_recieving_resource_rights.GetNameDef] หมายตากิจการหลายแหงทั่วประเทศของเรา เราเพียงตองเสนอวาพวกเขาจะไดกิจการใด\n\nเราอาจเสนอสวนแบงผลผลิตจากเหมืองมาโกลาในโอวลุ จัดหานิกเกิลจากเหมืองเปตซาโม เปลี่ยนเสนทางวัตถุดิบบางสวนที่สงไปยังอูตอเรือตุรกุ หรือมอบสิทธิ์สํารวจแรในลัปป"
 AAT_finland_misc_events.04.a: "มอบสิทธิ์ทําเหมืองใน [929.GetName]"
 AAT_finland_misc_events.04.b: "มอบสิทธิ์ทําเหมืองนิกเกิลใน [722.GetName]"
 AAT_finland_misc_events.04.c: "เปลี่ยนเสนทางสิทธิ์วัตถุดิบใน [926.GetName]"
 AAT_finland_misc_events.04.d: "มอบสิทธิ์สํารวจแรใน [148.GetName]"
 AAT_finland_misc_events.05.t: "[FROM.GetName] มอบสิทธิ์ในทรัพยากรใหเรา"
 AAT_finland_misc_events.05.desc: "ขาวดี! บริษัทอุตสาหกรรมหลายแหงรวมกันลงทุนทั้งเงิน อุปกรณ และผูเชี่ยวชาญในภาคเหมืองแรของ[FROM.GetAdjective] และการลงทุนนี้เริ่มใหผลตอบแทนในรูปของสิทธิ์ในการใชประโยชน เราไดรับสวนแบงผลผลิตจาก [?FROM.FIN_state_given_for_resource_rights.GetName] \n\nเราควรนําทรัพยากรใหมเหลานี้ไปใชใหเกิดประโยชนโดยเร็วที่สุด!"
 AAT_finland_misc_events.05.a: "เยี่ยม"
 AAT_finland_misc_events.06.t: "การลงทุนทางทหารของ[FROM.GetAdjective]ใน [ROOT.GetName]"
 AAT_finland_misc_events.06.desc: "[FROM.GetName] ตระหนักวายิ่งภูมิภาคนอรดิกพัฒนามากเทาไร ประชาชนของเราก็ยิ่งมั่งคั่งขึ้น และเราทุกคนก็ยิ่งไดประโยชนจากการปองกันและการคารวมกัน กาวแรกสูความฝนนี้คือการเพิ่มขีดความสามารถในการปองกันรวมกันเพื่อรับมือภัยคุกคามจากตางชาติ \n\nดวยเหตุนี้ [FROM.GetName] จึงเสนอยุทโธปกรณอุตสาหกรรมและผูเชี่ยวชาญใหเราอยางใจกวาง เพื่อชวยเพิ่มการผลิตทางทหารของเรา"
 AAT_finland_misc_events.06.a: "เราจะใชสิ่งนี้ใหเกิดประโยชน!"
 AAT_finland_misc_events.07.t: "โครงการวิจัยและพัฒนาของ[FROM.GetAdjective]"
 AAT_finland_misc_events.07.desc: "ในโลกที่จมดิ่งสูความมืดมิดและความไมแนนอนมากขึ้นเรื่อยๆ [FROM.GetName] ไดหันไปหาประภาคารแหงวิทยาศาสตรและเทคโนโลยีเพื่อสองทาง ชาติเล็กๆ นี้กาวหนาไปอยางกาวกระโดดในชวงไมกี่ปที่ผานมา เชนเดียวกับเรา พวกเขาเสนอใหรวมประชาคมวิทยาศาสตรของเราและแบงปนความรู เพื่อประโยชนของเราทุกคน ขอใหเราสองแสงเปนประทีปแหงโชคชะตาใหผูอื่นเดินตามฝาความมืดมิด"
 AAT_finland_misc_events.07.a: "ความริเริ่มที่ยอดเยี่ยม!"

 AAT_finland_diplomacy.01.t: "ขอเสนอการรวมชาติของ[FROM.GetAdjective]"
 AAT_finland_diplomacy.01.desc: "นักการทูตจาก [FROM.GetNameDef] เขามาหาเรา และเพื่อการคุมครองและความมั่งคั่งรวมกัน พวกเขาไดเสนอแนวคิดเรื่องการรวมชาติ ซึ่งหมายถึงการรวมรัฐบาล กองทัพ และอุตสาหกรรมของเราเขาดวยกัน เพื่อสรางแนวรวมที่แข็งแกรงและเปนปกแผนยิ่งขึ้นตอผูที่อาจคุกคามความมั่นคงของเรา \n\nการรวมตัวกันในยามที่โลกไรเสถียรภาพเชนนี้อาจมีขอดีอยูบาง แตทายที่สุดแลว เราเปนผูตัดสินใจ"
 AAT_finland_diplomacy.01.a: "ฟงดูเปนความคิดที่ดี!"
 AAT_finland_diplomacy.01.b: "เรารวมมือกันไดโดยยังคงอํานาจปกครองตนเองไว"
 #I couldn't get option b to appear in testing
 AAT_finland_diplomacy.01.c: "ไมสนใจ"
 AAT_finland_diplomacy.02.t: "สหภาพ[FROM.GetAdjective]-[ROOT.GetAdjective]"
 AAT_finland_diplomacy.02.desc: "นักการทูตของเรากลับจากภารกิจที่ [FROM.capital.GetCapitalVictoryPointName] อยางผูมีชัย พรอมนําขาวมาวา [FROM.GetName] เห็นความจําเปนที่จะตองสรางแนวรวมที่เปนปกแผนยิ่งขึ้นตอคูแขงรวมของเรา ขอเสนอการรวมเปนสหภาพของเราจึงไดรับการยอมรับ \n\nเจาหนาที่รัฐบาลกําลังเดินทางมายังเมืองหลวงของเราแลว เพื่อเตรียมการผนวกรวมดินแดนใหมเหลานี้อยางราบรื่น"
 AAT_finland_diplomacy.02.a: "เมื่ออยูดวยกัน เราแข็งแกรงยิ่งขึ้น!"
 AAT_finland_diplomacy.03.t: "[FROM.GetName] เขารวม [ROOT.GetFactionName]"
 AAT_finland_diplomacy.03.desc: "นักการทูตของเรากลับจากภารกิจที่ [FROM.GetName] แลว แมพวกเขาจะยอมรับถึงความจําเปนของแนวรวมที่เปนปกแผนยิ่งขึ้น แตก็ไมยอมสละอธิปไตยทั้งหมดเพื่อการนี้ การหารือในชวงแรกเปนไปดวยดี แตเมื่อพิจารณาถึงการตอสูเพื่อเอกราชในประวัติศาสตรของ [FROM.GetName] แลว [GetDiplomacyDescriptionNiceNotNice] \n\nแทนที่จะรวมเปนสหภาพ พวกเขาตัดสินใจเขารวมฝายของเราในฐานะรัฐเอกราช"

 FIN_not_nice_desc: "เห็นไดชัดวาพวกเขาไมไดเรียนรูจากความผิดพลาดของตน"
 FIN_nice_desc: "ความลังเลของพวกเขาก็เปนเรื่องที่เขาใจได"

 AAT_finland_diplomacy.03.a: "ก็ดีพอแลว..."
 AAT_finland_diplomacy.04.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 AAT_finland_diplomacy.04.desc: "นักการทูตของเรากลับจากภารกิจที่ [FROM.GetName] แลว แตดูเหมือนพวกเขาไมสามารถทําใหรัฐบาล[FROM.GetAdjective]เห็นความสําคัญของการยืนหยัดรวมกันได พวกเขาใหเหตุผลของการตัดสินใจไวนอยมาก ทําใหเจาหนาที่ของเราตองสงสัยวาเรื่องนี้จะสงผลอยางไร \n\nบางทีเราควรเริ่มดูแลการปองกันของตัวเอง เผื่อพวกเขามีเจตนาราย หรืออาจหาวิธีการอื่นของเราเองเพื่อใหไดมาซึ่ง... ความรวมมือของพวกเขา"
 AAT_finland_diplomacy.04.a: "เราจะเคารพการตัดสินใจของพวกเขา"
 AAT_finland_diplomacy.04.b: "พวกเขาเลือกชะตากรรมของตัวเองแลว"

 AAT_finland_diplomacy.05.t: "คํารองของ[FROM.GetAdjective]เพื่อปกปกรักษาซาปมี"
 AAT_finland_diplomacy.05.desc: "ดูเหมือน [FROM.GetName] จะรับเอาภาระในการปกปกรักษาเสรีภาพและวัฒนธรรมของชาวซามี ชนพื้นเมืองแหงยุโรปเหนือ \n\n[FROM.GetNameDefCap] ยื่นคํารองขอใหเรามอบดินแดนที่ชาวซามีครอบครองมาแตเดิมใหแกพวกเขา เพื่อที่จะไดปกปองกลุมชนนี้ในฐานะประชาชนที่เปนหนึ่งเดียวไดดียิ่งขึ้น"
 AAT_finland_diplomacy.05.a: "การเสียสละเพื่อเปาหมายอันสูงสง!"
 AAT_finland_diplomacy.05.b: "ผูนํา[FROM.GetAdjective]เสียสติไปแลว"
 AAT_finland_diplomacy.06.t: "[FROM.GetAdjective]ยกดินแดนชาวซามีให"
 AAT_finland_diplomacy.06.desc: "ขาวดีเยี่ยม! [FROM.GetNameDefCap] ตกลงมอบมาตุภูมิทางประวัติศาสตรของชาวซามีใหอยูในความดูแลของเรา นับจากนี้เปนความรับผิดชอบของเราที่จะปกปองและทะนุบํารุงประชาชนในดินแดนเหลานี้ เราไดรับจดหมายแสดงความยินดีจากผูนําชาวซามีแลว ซึ่งยํ้าถึงความหวังของพวกเขาวาเราจะปฏิบัติตอวัฒนธรรมและประเพณีของพวกเขาดวยความเคารพตอไป"
 AAT_finland_diplomacy.06.a: "ประชาชนสรรเสริญการตัดสินใจของ [FROM.GetLeader]"

 AAT_finland_diplomacy.07.t: "[FROM.GetName] ปฏิเสธคํารองของเรา"
 AAT_finland_diplomacy.07.desc: "พวกจักรวรรดินิยมแหง [From.GetNameDef] ปฏิเสธคํารองอันรูแจงของเราที่จะรวมดินแดนของชาวซามีเขาดวยกัน ในคําตอบอยางเปนทางการ พวกเขาอางถึงความกังวลตอเจตนาของเราในการธํารงวัฒนธรรมและศักดิ์ศรีของประชากรทองถิ่น แตเรารูดีวาแรงจูงใจที่แทจริงเบื้องหลังการปฏิเสธนี้คือตองการใหประเทศของตนดูใหญขึ้นบนแผนที่"
 AAT_finland_diplomacy.07.a: "เราทําอะไรไมได"
 AAT_finland_diplomacy.07.b: "เราตองดูแลชาวซามี!"
 
 AAT_finland_diplomacy.08.t: "แรงกดดันจาก[FROM.GetAdjective]ใหควบคุมการไหลของแรเหล็ก"
 AAT_finland_diplomacy.08.desc: "[FROM.GetNameDefCap] กดดันเราเรื่องการผลิตแรเหล็ก พวกเขากังวลกับความตึงเครียดของโลกที่สูงขึ้น และมองวาตนเปนชาติที่มีศักยภาพทางทหารสูงสุดในกลุมประเทศนอรดิก ดังนั้นพวกเขาจึงขอควบคุมรัฐทางเหนือที่อุดมดวยทรัพยากร ทั้งเพื่อจะไดปกปองรัฐเหลานั้น และเพื่อนําทรัพยากรในพื้นที่ไปใชในสงครามใหเกิดประโยชนสูงสุด"
 AAT_finland_diplomacy.08.a: "เราไมมีทางตานขอเรียกรองของพวกเขาได"
 AAT_finland_diplomacy.08.b: "เราจะปกปองอธิปไตยของ[ROOT.GetAdjective]เหนือดินแดนเหลานั้น"
 
 AAT_finland_diplomacy.09.t: "[FROM.GetName] ยกดินแดนที่รองขอให"
 AAT_finland_diplomacy.09.desc: "เราไดรับขาวดีวา [From.GetName] ตัดสินใจอยางชาญฉลาดที่มอบการควบคุมโดยตรงในรัฐที่อุดมดวยทรัพยากรของพวกเขาใหแกเรา กองทัพของเรากําลังเตรียมเขาไปตั้งกองรักษาการณในภูมิภาค และผูนําอุตสาหกรรมของเราเริ่มรางแผนวาจะผนวกวัตถุดิบจากพื้นที่นี้เขากับระบบการผลิตของเราอยางไรใหดีที่สุด"
 AAT_finland_diplomacy.09.a: "ผูนํา[FROM.GetAdjective]ทําสิ่งที่ดีที่สุดเพื่อประชาชนของตน"
 
 AAT_finland_diplomacy.10.t: "[FROM.GetName] ปฏิเสธขอเรียกรองของเรา"
 AAT_finland_diplomacy.10.desc: "นาเสียดายที่ดูเหมือน [FROM.GetLeader] ผูนํา[FROM.GetAdjective] จะสายตาสั้นเกินไป และยังคงไมใสใจตอฝูงฉลามที่วนเวียนวางแผนจะฮุบความมั่งคั่งของสแกนดิเนเวียไปเปนของตน เราไดรับคําตอบจากรัฐบาลของ[FROM.GetLeader.GetHerHis]อยางชัดเจนวากองทหารของเราตองอยูฝงพรมแดนของเรา และยังเตือนไมใหกดดันในเรื่องนี้ตอไป \n\nแนนอนวาเปาหมายของเรายังคงไมเปลี่ยนแปลง และไมวาพวกเขาจะอางอยางไร เรายังคงตองการวัตถุดิบในพื้นที่เพื่อประกันความมั่นคงของเราเองและของทุกคนในภูมิภาค"
 AAT_finland_diplomacy.10.a: "พวกเขาใจแคบจนมองไมเห็นความผิดพลาดรายแรงของตัวเอง"
 AAT_finland_diplomacy.10.b: "เราตองใชกําลังเขาควบคุม ระดมพล!"
 
 AAT_finland_diplomacy.11.t: "ขอเสนอของ[FROM.GetAdjective]เพื่อผนวกรวมโคลาและคาเรเลีย"
 AAT_finland_diplomacy.11.desc: "ชาติ[FIN.GetAdjective]ยังเยาววัย และประชาชนของพวกเขากระจัดกระจายอาศัยอยูในพรมแดนของหลายประเทศ ในความพยายามที่จะรวมชนชาติฟนนิกใหมากขึ้น ตอนนี้พวกเขาจึงเขามาหาเราพรอมคําขอใหผนวกรวมคาเรเลียตะวันออกและคาบสมุทรโคลาเขากับชาติ[FIN.GetAdjective]"
 AAT_finland_diplomacy.11.a: "เราจะยกดินแดน[ROOT.GetAdjective]ใหเพื่อเปาหมายอันสูงสงนี้"
 AAT_finland_diplomacy.11.b: "ดินแดน[ROOT.GetAdjective]จะยังคงเปนของ[ROOT.GetAdjective]!"
 AAT_finland_diplomacy.12.t: "[FROM.GetName] ยอมรับขอเรียกรองดินแดนของเรา"
 AAT_finland_diplomacy.12.desc: "[FROM.GetLeader] ผูยิ่งใหญตกลงตามขอเสนอของเราในการรวมชาติกับชาวคาเรเลียตะวันออก และไดสงมอบดินแดนของพวกเขาในภูมิภาคนั้นใหแกเรา ชาว[FROM.GetAdjective]ผูยิ่งใหญคือมิตรแทของชาวฟนน!"
 AAT_finland_diplomacy.12.a: "[FROM.GetLeader] ทําสิ่งที่ดีที่สุดเพื่อชาวโคลาและคาเรเลีย"
 AAT_finland_diplomacy.13.t: "[FROM.GetLeader] ปฏิเสธขอเรียกรองของเรา"
 AAT_finland_diplomacy.13.desc: "[FROM.GetLeader] ประกาศวาจะไมสงมอบดินแดนคาเรเลียตะวันออกใหเรา และอางวาคําขอดินแดนของเราไมไดใหสิ่งใดตอบแทนแกพวกเขา มีแตจะนําความพินาศมาสูชาว[FROM.GetAdjective]ที่อาศัยอยูในพื้นที่นั้น"
 AAT_finland_diplomacy.13.a: "ตอนนี้เรายังยั่วยุ [FROM.GetLeader] ไมได..."
 AAT_finland_diplomacy.13.b: "ไอตัวตลกนั่นจะตองชดใช!"
 AAT_finland_diplomacy.14.t: "[FROM.GetAdjective]เรียกรองใหผนวกรวม [ROOT.GetName]"
 AAT_finland_diplomacy.14.desc: "[FIN.GetNameDef] เจาเหนือหัวของเรา เรียกรองใหเราผนวกรวมเขากับชาติของพวกเขาโดยสมบูรณ พวกเขาอางวาดินแดนบอลติกเปนของตน และอางวาลัทธิภูมิภาคนิยมของเราจะนําไปสูความไรเสถียรภาพของอาณาจักรของพวกเขาในที่สุด"
 AAT_finland_diplomacy.14.a: "ถาพวกเขาวาอยางนั้น..."
 AAT_finland_diplomacy.14.b: "พวกเขาคิดวาตัวเองเปนใคร?"
 AAT_finland_diplomacy.15.t: "[FROM.GetName] กลายเปนสวนหนึ่งของ [ROOT.GetNameDef]"
 AAT_finland_diplomacy.15.desc: "รัฐบาล[FROM.GetAdjective]ตกลงตามขอเสนอของเราที่จะผนวกรวมเขากับรัฐของเรา และไดเริ่มแกไขกฎหมายของตนใหเหมาะกับการเปนเขตปกครองตนเอง แทนที่จะเปนประเทศเอกราช"
 AAT_finland_diplomacy.15.a: "ทางเลือกที่ชาญฉลาด"
 AAT_finland_diplomacy.16.t: "ผูนํา[FROM.GetAdjective]ปฏิเสธขอเรียกรองของเรา"
 AAT_finland_diplomacy.16.desc: "รัฐบาล[FROM.GetAdjective]แถลงวาขอเสนอใหมของเราละเมิดขอตกลงที่ทั้งสองชาติเคยลงนามไว และอางถึงกฎหมายระหวางประเทศวาแนวคิดการรวมชาติใหมของเรานั้นผิดกฎหมายและไมชอบธรรม"
 AAT_finland_diplomacy.16.a: "เราจะเคารพการตัดสินใจของพวกเขา"
 AAT_finland_diplomacy.16.b: "พวกเขาทําใหตัวเองเสื่อมเสียเกียรติ!"
 AAT_finland_diplomacy_nordic: "นอรดิก"
 AAT_finland_diplomacy_baltic: "บอลติก"
 AAT_finland_diplomacy.17.t: "[FROM.GetAdjective]เรียกรองดินแดน[GetBalticOrNordic]"
 AAT_finland_diplomacy.17.desc: "[FIN.GetNameDefCap] เรียกรองใหเราสงมอบดินแดนทั้งหมดที่เราถือครองในประเทศ[GetBalticOrNordic]ดั้งเดิมใหแกพวกเขา ซึ่งเปนสวนหนึ่งของวาระใหมในการครอบครองและพิทักษภูมิภาค[GetBalticOrNordic] ในฐานะสวนหนึ่งของสหพันธประชาชาติ[FIN.GetAdjective]อันยิ่งใหญ"
 AAT_finland_diplomacy.17.a: "ไดเลย"
 AAT_finland_diplomacy.17.b: "พวกเขาชักจะไดใจเกินไปแลว"
 AAT_finland_diplomacy.18.t: "[FROM.GetName] โอนดินแดน[GetBalticOrNordic]"
 AAT_finland_diplomacy.18.desc: "[FROM.GetLeader] ตกลงอยางชาญฉลาดที่จะสงมอบดินแดน[GetBalticOrNordic]ของพวกเขาใหเรา เพราะพวกเขาเห็นวาไมคุมเวลาที่จะโตแยงการอางสิทธิ์ของเรา"
 AAT_finland_diplomacy.18.a: "พวกเขาเลือกถูกแลว"
 AAT_finland_diplomacy.19.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเรียกรองของเรา"
 AAT_finland_diplomacy.19.desc: "[FROM.GetLeader] ปฏิเสธที่จะโอนดินแดน[GetBalticOrNordic]ของพวกเขาใหเรา โดยระบุวาเห็นไดชัดวาเราไมไดมีสิทธิ์เหนือพื้นที่นั้นมากไปกวาผูอื่น เราควรตอบโตการตัดสินใจอันนาอัปยศนี้อยางไร"
 AAT_finland_diplomacy.19.a: "เราทําอะไรไมได"
 AAT_finland_diplomacy.19.b: "บอกใหพวกเขารูวาเรากําลังไป"
 AAT_finland_diplomacy.20.t: "ขอเสนอของ[FROM.GetAdjective]เพื่อสนธิสัญญาฟนน-[ROOT.GetAdjective]"
 AAT_finland_diplomacy.20.desc: "[FIN.GetLeader] ขอใหเราลงนามในสนธิสัญญาไมรุกรานและสันติภาพถาวรระหวางสองชาติ ขอเสนอนี้เปนสวนหนึ่งของแนวทางใหมของรัฐบาล[FIN.GetAdjective]ในการคืนดีกับเพื่อนบานและกลับมาเขาหาชาติของเราอีกครั้ง"
 AAT_finland_diplomacy.20.a: "เรื่องนี้ไมมีอะไรเสียหาย"
 AAT_finland_diplomacy.20.b: "พวกเขาไมรูหรอกวาเราวางแผนอะไรไวสําหรับพวกเขา"
 AAT_finland_diplomacy.21.t: "[FROM.GetName] ตกลงลงนามสนธิสัญญาฟนน-[FROM.GetAdjective]"
 AAT_finland_diplomacy.21.desc: "[FROM.GetLeader] ผูยิ่งใหญแหง [FROM.GetNameDef] ใหคํามั่นวาจะมุงสรางสันติภาพถาวรและยั่งยืนระหวางสองชาติไปอีกหลายปขางหนา พวกเขาคือมิตรแทของชาว[FIN.GetAdjective]โดยแท"
 AAT_finland_diplomacy.21.a: "อนาคตที่สดใสกวารอเราอยู"
 AAT_finland_diplomacy.22.t: "[FROM.GetLeader] ปฏิเสธขอเสนอสนธิสัญญาฟนน-[FROM.GetAdjective]ของเรา"
 AAT_finland_diplomacy.22.desc: "[FROM.GetLeader] ผูไมนาไววางใจ แถลงวาไมสามารถรับประกันสันติภาพระหวางสองชาติได เห็นไดชัดวากําลังวางแผนโจมตีชาติของเรา ซึ่งเราควรเตรียมพรอมรับมือใหมากที่สุด"
 AAT_finland_diplomacy.22.a: "พวกเขากลาดียังไง!"
 AAT_finland_diplomacy.23.t: "[FROM.GetNameDefCap] ขอการคุมครองจาก [SOV.GetNameDef]"
 AAT_finland_diplomacy.23.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ขอใหเราชวยปองกันการรุกรานใดๆ ที่อาจเกิดขึ้นจาก [SOV.GetNameDef] พวกเขาระบุวารูตัวดีวาอาจถูกโจมตีในเร็วๆ นี้ และเราคือความหวังเดียวที่จะอยูรอดหากวันนั้นมาถึง"
 AAT_finland_diplomacy.23.a: "เราจะรับพวกเขาไวใตปกของเรา"
 AAT_finland_diplomacy.23.b: "แลวทําไมเราตองทําเชนนั้นดวย?"
 AAT_finland_diplomacy.24.t: "รัฐบาล[FROM.GetAdjective]ใหคํามั่นวาจะปกปอง [ROOT.GetNameDef]"
 AAT_finland_diplomacy.24.desc: "รัฐบาล[FROM.GetAdjective]ตกลงตามคําขอของเรา และใหคํามั่นวาจะปกปองเราหากถูกรุกรานโดยชาว[SOV.GetAdjective] ในที่สุดเราก็ถอนหายใจไดอยางโลงอก"
 AAT_finland_diplomacy.24.a: "ผูกอบกูของเรา"
 AAT_finland_diplomacy.25.t: "[FROM.GetNameDef] ปฏิเสธคําขอการคุมครองของเรา"
 AAT_finland_diplomacy.25.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธคําขอใหคุมครองเราจากชาว[SOV.GetAdjective] เมื่อสถานการณที่เราหวาดกลัวเกิดขึ้นแลว เราตองเตรียมแนวปองกันเพื่อตานทานอยางกลาหาญที่สุด"
 AAT_finland_diplomacy.25.a: "โชคชะตาทอดทิ้งเราแลว!"
 AAT_finland_diplomacy.26.t: "[FROM.GetName] ขอการคุมครองจาก[ROOT.GetAdjective]"
 AAT_finland_diplomacy.26.desc: "[FIN.GetLeader] แหง [FIN.GetNameDef] กําลังขอความคุมครองจาก [SOV.GetNameDef] ซึ่งเมื่อไมนานมานี้เริ่มจับตาเพื่อนบานอีกครั้ง เปนครั้งแรกอยางจริงจังนับตั้งแตสงครามกลางเมืองรัสเซีย เพื่อแลกกับการคุมครองจากภัยคุกคามนี้ พวกเขาเสนอจายเราดวยสิทธิ์ในทรัพยากรธรรมชาติตางๆ ของ[FIN.GetAdjective]"
 AAT_finland_diplomacy.26.a: "เราจะไปชวยพวกเขา!"
 AAT_finland_diplomacy.26.b: "ไมใชปญหาของเรา"
 AAT_finland_diplomacy.27.t: "[FROM.GetNameDefCap] จะปกปองเรา"
 AAT_finland_diplomacy.27.desc: "[GER.GetNameDefCap] ยอมรับขอเสนอแลกทรัพยากรกับการคุมครองของเรา และสัญญาวาจะมาชวยเราหากสงครามมาเยือน ในที่สุดประชาชนของเราก็ถอนหายใจไดอยางโลงอก เพราะอนาคตของพวกเขาปลอดภัยขึ้นมาก"
 AAT_finland_diplomacy.27.a: "เราจะยืนหยัดรวมกัน!"
 AAT_finland_diplomacy.28.t: "[ROOT.GetName] พึ่งพาการคุมครองจาก[FROM.GetAdjective]ไมได"
 AAT_finland_diplomacy.28.desc: "[GER.GetLeader] แหง [GER.GetNameDef] ผูทรยศ ปฏิเสธขอเสนอแลกทรัพยากรกับการคุมครองของเรา และกําหนดชะตาอนาคตของเราใหดับสูญตามอําเภอใจ เราจะคอยดูวาธาตุแทอันเห็นแกตัวและหลงตัวเองของพวกเขาจะสงผลตอพวกเขาอยางไรในอนาคต"
 AAT_finland_diplomacy.28.a: "ถาอยางนั้นเราก็ตองพึ่งตัวเอง!"

 AAT_finland_winter_war.02.t: "ขอเรียกรองสันติภาพของ[ROOT.GetAdjective]"
 AAT_finland_winter_war.02.desc: "เรามีขาวดีจากแนวหนา! กองกําลังของเราเพิ่งไดชัยในการลอมเมือง [195.GetName] และยึดเมืองไวได ดวยการโจมตีครั้งเด็ดขาดตอ [SOV.GetNameDef] นี้ เราจึงอยูในสถานะที่แข็งแกรงที่จะเปดการเจรจาสันติภาพ \n\nหนึ่งในเปาหมายที่ประกาศไวของการรุกรานของ[SOV.GetAdjective]คือการขยายพื้นที่กันชนรอบ [195.GetName] และตอนนี้พวกเขาไมเพียงลมเหลวในเปาหมายนี้อยางปฏิเสธไมได แตยังเสียเมืองนั้นไปดวย เราจึงคาดวาพวกเขาคงกระหายที่จะถอนตัวจากความขัดแยงนี้ \n\nตอนนี้ขึ้นอยูกับเราวาจะเริ่มเจรจาเมื่อใด เราอาจสูตอไปเพื่อดูวาจะยึดไดมากกวานี้หรือไม หรือมุงสูสันติภาพแบบไมมีฝายใดไดเปรียบโดยเร็วที่สุด" 
 AAT_finland_winter_war.02.a: "อาจถึงเวลาแหงสันติภาพแลว..."

 AAT_finland_winter_war.03.t: "ขอเรียกรองสันติภาพของ[FROM.GetAdjective]"
 AAT_finland_winter_war.03.desc: "เราเพิ่งไดรับขาวจากศัตรูของเราใน [FROM.GetNameDef] พวกเขาเสนอเงื่อนไขสันติภาพแบบไมมีฝายใดไดเปรียบ โดยกองกําลังของเราตองยุติการรุกทุกรูปแบบทันทีและถอนกลับมายังฝงพรมแดนของเรา ในดานดินแดน ดูเหมือน [FROM.GetNameDef] จะพอใจที่จะใหพรมแดนกลับไปอยูในตําแหนงกอนสงคราม โดยไมมีฝายใดไดประโยชน \n\nเมื่อพิจารณาความสูญเสียที่เพิ่งเกิดขึ้น เราไมแนใจวาประชาชนจะสนับสนุนการสูรบตอไปมากเพียงใด เราอาจโนมนาวพวกเขาไดในระยะสั้นวาชัยชนะใกลมาถึง แตหากสถานการณยังคงเลวรายลง เราอาจตองเผชิญความไมพอใจที่เพิ่มขึ้นตอการปกครองของเรา"
 AAT_finland_winter_war.03.a: "เราไมมีทางเลือกอื่นนอกจากยอมรับความพายแพ..."
 AAT_finland_winter_war.03.b: "เราจะพลิกสถานการณสงคราม!"

 AAT_finland_winter_war.04.t: "[FROM.GetNameDefCap] ยอมรับขอเรียกรองสันติภาพของเรา"
 AAT_finland_winter_war.04.desc: "พวกเขายอมรับขอตกลงสันติภาพแลว! ผูคนออกมาเฉลิมฉลองกันตามทองถนนโดยไมไดนัดหมายเมื่อขาวชัยชนะของเราแพรสะพัด ทหาร[FROM.GetAdjective]เริ่มถอนตัวออกจากดินแดนของเราแลว กลับบานไปอยางทุกขระทม \n\nนี่เปนวันแหงความภาคภูมิใจของชาติเราอยางแนนอน แตเราตองไมปลอยใหตัวเองชะลาใจ เพราะยังมีงูซอนอยูในพงหญาอีกมาก"
 AAT_finland_winter_war.04.a: "พวกเขาอยาไดลองดีกับเราอีกเลย"

 AAT_finland_winter_war.05.t: "[FROM.GetNameDefCap] ปฏิเสธขอเรียกรองสันติภาพของเรา"
 AAT_finland_winter_war.05.desc: "พวกโงใน [FROM.GetNameDef] ปฏิเสธขอเสนอสันติภาพอันมีนํ้าใจของเรา พวกเขาอางอยางหลงผิดวาความสูญเสียที่กองกําลังของตนเพิ่งไดรับเปนเพียงความพลิกผันชั่วคราวที่จะเอาชนะไดในไมชา เรารูดีวานี่เปนเรื่องแตงขึ้นทั้งสิ้นเพื่อปกปองรัฐบาลของพวกเขาจากความโกรธแคนของประชาชน แตอีกไมนานความจริงจะปรากฏ  \n\nทหารของเรายังคงอยูในสนามรบ ขวัญกําลังใจยังสูงสง มั่นใจวาพวกเขากําลังตอสูเพื่อความชอบธรรม และเตรียมพรอมสําหรับการสูรบที่จะตามมา"
 AAT_finland_winter_war.05.a: "พวกโงจะตองชดใช!"

 AAT_finland_winter_war.06.t: "ขอเรียกรองดินแดนเพื่อสันติภาพของ[FROM.GetAdjective]"
 AAT_finland_winter_war.06.desc: "เราเพิ่งไดรับขอเรียกรองใหยอมจํานนจากคูปรับ[FROM.GetAdjective]ของเรา ในฐานะสวนหนึ่งของเงื่อนไขสันติภาพ พวกเขาตองการใหเราสงมอบดินแดนหลายแหงในภูมิภาคคาเรเลีย-โคลา และยืนกรานใหเราออกจากดินแดนเหลานี้โดยเร็วที่สุด"
 AAT_finland_winter_war.06.a: "เราไมมีทางเลือกอื่นนอกจากยอมรับความพายแพ..."
 AAT_finland_winter_war.06.b: "พวกเขากลาดียังไง!?"

 AAT_finland_winter_war.07.desc: "พวกเขายอมรับขอตกลงสันติภาพแลว! ผูคนออกมาเฉลิมฉลองกันตามทองถนนโดยไมไดนัดหมายเมื่อขาวชัยชนะของเราแพรสะพัด ทหาร[FROM.GetAdjective]เริ่มถอนตัวออกจากดินแดนของเราแลว กลับบานไปอยางทุกขระทม \n\nนี่เปนวันแหงความภาคภูมิใจของชาติเราอยางแนนอน เพราะเราไมเพียงเอาชนะผูรุกรานได แตยังชนะอยางเด็ดขาดจนสามารถขยายดินแดนของเราเองโดยแลกกับความสูญเสียของพวกเขา!"
 AAT_finland_winter_war.07.a: "หวังวาในที่สุดพวกเขาจะไดบทเรียนเสียที"

 AAT_finland_winter_war.08.desc: "พวกโงใน [FROM.GetNameDef] ปฏิเสธขอเสนอสันติภาพอันมีนํ้าใจของเรา รัฐบาลที่สิ้นหวังขึ้นทุกทีของพวกเขายังคงยึดติดกับความเชื่อลมๆ แลงๆ วายังชนะได โดยรูดีวาหากความจริงเกี่ยวกับสภาพสงครามเล็ดลอดออกไป พวกเขาจะตองเผชิญการลุกฮือครั้งใหญและอาจถึงขั้นการปฏิวัติภายในประเทศ \n\nทหารของเรายังคงอยูในสนามรบ ขวัญกําลังใจยังสูงสง มั่นใจวาพวกเขากําลังตอสูเพื่อความชอบธรรม และเตรียมพรอมสําหรับการสูรบที่จะตามมา ดวยความมั่นใจวาชัยชนะอยูแคเอื้อม"
 AAT_finland_winter_war.08.a: "พวกโงจะตองชดใช!"

 FIN_winter_war_push_back_tt: "\nการผลักดันชาว[SOV.GetAdjective]กลับไปและยึดครอง §Y[195.GetName]§! จะทําใหเราสามารถเรียกรองการเจรจาสันติภาพได \nหากควบคุม §Y[213.GetName]§!, §Y[215.GetName]§! หรือ §Y[216.GetName]§! ไวไดดวย เราจะสามารถเรียกรองรัฐเหลานั้นเปนการยกดินแดนใหจาก [SOV.GetNameDef]"

 AAT_finland_continuation_war.01.t: "ขอเสนอของ[FROM.GetAdjective]สําหรับสงครามตอเนื่อง"
 AAT_finland_continuation_war.01.desc: "สมาชิกในกลุมผูปกครองของ [FROM.GetName] ติดตอเรามาเกี่ยวกับความเปนไปไดในการรวมมือทางทหารเพื่อตอตานภัยคุกคามจาก[SOV.GetAdjective]ทางตะวันออก ขอเสนอของพวกเขาจะอนุญาตใหเราตั้งกําลังทางทหารภายใน [FROM.GetName] โดยมีเงื่อนไขวาเราจะปกปองพรมแดนของกันและกัน และรวมมือกันในการรุกเขาสูดินแดน[SOV.GetAdjective]"
 AAT_finland_continuation_war.01.a: "ได แตตองแนใจวาไมมีบันทึกใดเกี่ยวกับขอตกลงนี้!"
 AAT_finland_continuation_war.01.b: "เรื่องจุกจิกของ[FROM.GetAdjective]ไมใชเรื่องที่เราตองสนใจ"
 AAT_finland_continuation_war.02.t: "สนธิสัญญาฟนน-[FROM.GetAdjective]เพื่อสงครามตอเนื่อง"
 AAT_finland_continuation_war.02.desc: "[FROM.GetLeader] ไดใหการรับรองตอขอเสนอความรวมมือทางทหารของเราเพื่อตอตาน [SOV.GetNameDef] ในนามของ[FROM.GetLeader.GetHerHis] ขณะนี้นายทหารของกองทัพเรากําลังไดรับเชิญไปยัง [FROM.Capital.GetCapitalVictoryPointName] เพื่อเริ่มประสานงานกองกําลังผสมของเรา"
 AAT_finland_continuation_war.02.a: "ตองแนใจวาไมมีบันทึกใดเกี่ยวกับขอตกลงนี้!"
 AAT_finland_continuation_war.03.t: "[FROM.GetName] ปฏิเสธขอเสนอของเรา"
 AAT_finland_continuation_war.03.desc: "[FROM.GetLeader] ปฏิเสธขอเสนอความรวมมือทางทหารของเราอยางโงเขลา อาจเปนเพราะชาว[FROM.GetAdjective]ไมตองการเสี่ยงกับขอตกลงอันเปราะบางที่มีอยูกับชาว[SOV.GetAdjective] แตก็อาจบงบอกวาพวกเขามีแผนอื่นสําหรับเรา ไมวาทางใด เราควรดําเนินการอยางระมัดระวังและเริ่มมองหาการสนับสนุนจากที่อื่น"
 AAT_finland_continuation_war.03.a: "ชางเปนโอกาสที่สูญเปลา..."
 AAT_finland_continuation_war.04.t: "สนธิสัญญาเพื่อสงครามตอเนื่องถูกยกเลิก"
 AAT_finland_continuation_war.04.desc: "แผนความรวมมือกับ [FROM.GetNameDef] เพื่อตอตาน [SOV.GetNameDef] พังทลายลงเนื่องจากการเปลี่ยนแปลงทางภูมิรัฐศาสตรเมื่อไมนานมานี้ เราทุมเทความพยายามอยางมากในการวางแผนปฏิบัติการรวม แตตอนนี้เราตองกลับไปเริ่มตนใหมทั้งในดานการทหารและนโยบายตางประเทศ"
 AAT_finland_continuation_war.04.a: "เราจะผานพนเรื่องนี้ไปได"
 AAT_finland_continuation_war.05.t: "สงครามตอเนื่องของ[FIN.GetAdjective]"
 AAT_finland_continuation_war.05.desc: "ผลจากการเดินหมากทางการทูตและการวางแผนทางทหารอยางรอบคอบของเรากําลังจะปรากฏ เมื่อ [GER.GetNameDef] เปดปฏิบัติการบารบารอสซา การรุกราน [SOV.GetNameDef] ในที่สุด ตอนนี้เราตองทําตามพันธะสัญญาและดําเนินการตามแผนในสวนของเรา"
 AAT_finland_continuation_war.05.a: "เขารวมกับพี่นองรวมรบของเรา!"
 AAT_finland_continuation_war.06.desc: "กองกําลังทหาร[FIN.GetAdjective]เปดฉากโจมตีที่มั่นของ[SOV.GetAdjective]ตามแผนที่วางไวในขอตกลงความรวมมือของเรา ดวยความชวยเหลือจากพี่นองรวมรบชาว[FIN.GetAdjective] เราสามารถยืดแนวรบของโซเวียตใหยาวขึ้นไปอีก ผลักดันพวกเขาจนถึงจุดแตกหัก"
 AAT_finland_continuation_war.06.a: "ชัยชนะอยูแคเอื้อม!"
 AAT_finland_continuation_war.07.desc: "แมเราจะพยายามอยางเต็มที่ทางการทูตเพื่อหามปราม [GER.GetNameDef] และ [FIN.GetNameDef] ไมใหรวมมือกัน แตความพยายามของเราดูจะสูญเปลา กองทัพ[FIN.GetAdjective]เปดฉากโจมตีเราพรอมกับชาว[GER.GetAdjective]อยางแมนยําจนตองประสานงานปฏิบัติการนี้มาเปนเวลานานแนนอน"
 AAT_finland_continuation_war.07.a: "อยางที่เรากลัวไวไมมีผิด..."
 FIN_pact_for_continuation_war_ger_tt: "ผลเมื่อ [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! ประกาศสงครามกับ [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! จะเขารวมสงครามตอตาน [SOV.GetFlag]§Y[SOV.GetNameDef]§!"
 FIN_pact_for_continuation_war_fin_tt: "ผลเมื่อ [FROM.GetFlag]§Y[FROM.GetNameDef]§! ประกาศสงครามกับ [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! จะเขารวมสงครามตอตาน [SOV.GetFlag]§Y[SOV.GetNameDef]§!"
 FIN_pact_for_continuation_war_broken_tt: "สนธิสัญญาถูกยกเลิกแลว และทั้งสองประเทศไมมีพันธะตองชวยเหลือกันอีกตอไปในกรณีที่เกิดสงครามกับ [SOV.GetFlag]§Y[SOV.GetNameDef]§!"
 FIN_the_lone_wolf_no_faction_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! §Rไมสามารถเขารวมฝายใดไดขณะที่มีจิตวิญญาณแหงชาติ§! '§Y$FIN_the_lone_wolf$§!'"

 AAT_finland_continuation_war.08.t: "[FROM.GetName] ตองการสงบศึก"
 AAT_finland_continuation_war.08.desc: "รัฐบาลใน [FROM.GetNameDef] ติดตอเรามาเพื่อขอใหลงนามสงบศึก โดยสัญญาวาจะยกดินแดนใหเพิ่มเติมและตัดความสัมพันธทั้งหมดกับ [GER.GetNameDef] หากเรายอมรับ เราจะสามารถทุมความสนใจทั้งหมดไปที่ชาว[GER.GetAdjective] และผลักดันพวกเขากลับไปยังที่ที่พวกเขาจากมา"
 AAT_finland_continuation_war.08.a: "ลงนามในการสงบศึกมอสโก"
 AAT_finland_continuation_war.08.b: "คราวนี้พวกเขาจะไมรอดไปงายๆ!"

 AAT_finland_continuation_war.09.t: "[FROM.GetNameDef] ปฏิเสธขอเสนอสันติภาพของเรา"
 AAT_finland_continuation_war.09.desc: "[FROM.GetLeader] แหง [FROM.GetNameDef] ปฏิเสธคําขอของเรา และแถลงวาเราควรเตรียมรับความพินาศ เพราะกองทัพ[FROM.GetAdjective]จะไมปลอยเราไปงายๆ ในครั้งนี้ นี่คือสถานการณที่เลวรายที่สุด!"
 AAT_finland_continuation_war.09.a: "โชคชะตาทอดทิ้งเราแลว!"

 aat_news.120.t: "ลงนามการสงบศึกมอสโกแลว"
 aat_news.120.desc: "หลังการเจรจาอันยาวนาน นายทหารและเจาหนาที่ผูแทน [FIN.GetLeader] และ [SOV.GetLeader] ตกลงลงนามสงบศึกโดยมีผลทันที อยางไรก็ตาม การสงบศึกครั้งนี้มาพรอมกับราคาที่แสนแพงสําหรับ [FIN.GetNameDef] และพันธมิตรของ [FIN.GetName] ยอมรูสึกไดเพียงการถูกทรยศ"
 aat_news.120.a: "มันจําเปนตองทํา..."
 aat_news.120.b: "ขอบใจที่ไมแสดงนํ้าใจพี่นองรวมรบนะ!"
 aat_news.120.c: "เรารุกตอไป!"
 aat_news.120.d: "เปนพัฒนาการที่นาสนใจจริงๆ..."

 AAT_finland_continuation_war.10.t: "โซเวียตบังคับใหเราขับไลทหาร[GER.GetAdjective]"
 AAT_finland_continuation_war.10.desc: "ผูแทนโซเวียตสังเกตเห็นวาเราไมปฏิบัติตามขอตกลงสงบศึก ซึ่งระบุชัดเจนวาเราตองขับไลทหารขาศึกทั้งหมด และชาว[GER.GetAdjective]กําลังขนอาวุธและทรัพยากรที่เราตองสงมอบใหสหภาพออกไป เมื่อทหารของเราเริ่มพยายามปลดอาวุธทหาร[GER.GetAdjective] การยิงปะทะก็เริ่มขึ้น และชาว[GER.GetAdjective]กําลังใชนโยบายเผาทําลายแผนดินของเราและวางทุนระเบิดในนานนํ้าของเรา"
 AAT_finland_continuation_war.10.a: "เราตองทําตาม มิฉะนั้นจะตองเผชิญสงครามอีกครั้ง"

 AAT_finland_continuation_war.11.t: "นายทหารของเราเริ่มถอนตัวจาก [FIN.GetNameDef]"
 AAT_finland_continuation_war.11.desc: "แมจะลังเลในตอนแรก แตตอนนี้รัฐบาล[FIN.GetAdjective]ภายใตแรงกดดันจากโซเวียตไดเริ่มขับไลและปลดอาวุธทหารของเราที่ประจําการอยูที่นั่นแลว นายทหารของเราจึงเริ่มดําเนินแผนที่รางไวสําหรับสถานการณนี้โดยเฉพาะ แตยังลังเลวาจะใชแผนฉบับใด อะไรสําคัญกวากัน?"
 AAT_finland_continuation_war.11.a: "เริ่มปฏิบัติการบีรเคอ"
 AAT_finland_continuation_war.11.b: "เริ่มปฏิบัติการนอรดลิชท"

 aat_news.121.t: "สงครามลัปแลนด"
 aat_news.121.desc: "การสูรบปะทุขึ้นระหวาง [FIN.GetNameDef] และ [GER.GetNameDef] เมื่อกองกําลัง[FIN.GetAdjective]พยายามปลดอาวุธและขับไลทหาร[GER.GetAdjective]ออกจากประเทศ ตามสนธิสัญญาที่ลงนามกับ [SOV.GetNameDef] ในการสงบศึกมอสโก ไมตองสงสัยเลยวาชาว[GER.GetAdjective]จะถูกไลออกจาก [FIN.GetName] ในที่สุด แตคําถามคือจะตองแลกดวยราคาเทาใด"
 aat_news.121.a: "เราจะไลพวกเขาออกไป!"
 aat_news.121.b: "พวกเขาเผยธาตุแทออกมาแลว..."
 aat_news.121.c: "ชัยชนะอีกครั้งของเรา"
 aat_news.121.d: "สถานการณพลิกผันแลว"

 AAT_finland_continuation_war.12.t: "[FIN.GetName] ตองการเปลี่ยนขาง"
 AAT_finland_continuation_war.12.desc: "วันนี้ [FIN.GetLeader] แหง [FIN.GetNameDef] เขามาหาเราพรอมขอเสนอที่นาสนใจยิ่ง เขาอางวา [FIN.GetName] พรอมยุติสงครามกับ [SOV.GetNameDef] เนื่องจากสงครามเริ่มพลิกกลับมาเปนผลรายตอพวกเขามากขึ้นเรื่อยๆ และเสนอใหเรายกพลขึ้นบกที่เปตซาโม พรอมเขารวมฝายของเราเพื่อรวมกันขับไลชาว[GER.GetAdjective]ออกจากสแกนดิเนเวีย และปดฉาก [GER.GetNameDef] ใหสิ้นซาก เราจะวาอยางไร?"
 AAT_finland_continuation_war.12.a: "ก็ได หวังแควา [SOV.GetLeader] จะไมวาอะไร..."
 AAT_finland_continuation_war.12.b: "เราเสี่ยงยั่วยุสหภาพโซเวียตไมได!"

 AAT_finland_continuation_war.13.t: "[FIN.GetName] กําลังหาทางเขารวมฝายสัมพันธมิตร"
 AAT_finland_continuation_war.13.desc: "ดูเหมือนผูแทนจาก [FIN.GetNameDef] ไดเขาหาบรรดาชาติประชาธิปไตยรายใหญ พยายามดิ้นหลุดจากสงครามกับเราดวยการเสนอเขารวมกับพวกเขาในสงครามตอตานชาว[GER.GetAdjective] ซึ่งก็คือการเปลี่ยนขางนั่นเอง หากฝายสัมพันธมิตรตกลง เราก็ทําอะไรไดไมมากนอกจากบนและเรียกรองคาชดเชย แตอยางนอยก็หมายถึงหุนสวนใหมในการตอสูกับลัทธิฟาสซิสต"
 AAT_finland_continuation_war.13.a: "ก็ได แตตองไดรับคาชดเชย"

 AAT_finland_political.01.t: "ญัตติไมไววางใจ [ROOT.GetLeader]"
 AAT_finland_political.01.desc: "วันนี้ [Root.GetLeader] ไมสามารถหาเสียงสนับสนุนที่[ROOT.GetLeader.GetSheHe]ตองการเพื่อใหรอดพนจากการลงมติไมไววางใจในเอดุสกุนตา รัฐสภา[ROOT.GetAdjective] \n\nแมจะดํารงตําแหนงประธานาธิบดีมาตั้งแตป 1931 และมีประวัติการปกครองที่ไดรับความนิยมมายาวนาน แตสถานะของ[ROOT.GetLeader.GetHerHis]ก็ลดลงอยางมาก เนื่องจากปฏิเสธที่จะใหพรรคสังคมประชาธิปไตยเขารวมคณะรัฐมนตรี ซึ่งเปนการผิดคําสัญญาของ[ROOT.GetLeader.GetHerHis] ความผิดพลาดทางการเมืองครั้งนี้ลุกลามกลายเปนวิกฤตการเมือง ซึ่ง[ROOT.GetLeader.GetSheHe]ไดตกเปนเหยื่อในที่สุด"
 AAT_finland_political.01.a: "คัลลิโอมีงานตองทําแลว!"

 AAT_finland_political.02.t: "วาระประธานาธิบดีสิ้นสุดลง"
 AAT_finland_political.02.desc: "วันนี้เปนวันที่ [ROOT.GetLeader] ผูกําลังเผชิญมรสุม ตองรักษาตําแหนงประธานาธิบดีไวใหไดอีกครั้ง \n\nแมจะดํารงตําแหนงประธานาธิบดีมาตั้งแตป 1931 และมีประวัติการปกครองที่ไดรับความนิยมมายาวนาน แตสถานะของ[ROOT.GetLeader.GetHerHis]ก็ลดลงอยางมาก เนื่องจากปฏิเสธที่จะใหพรรคสังคมประชาธิปไตยเขารวมคณะรัฐมนตรี ซึ่งเปนการผิดคําสัญญาของ[ROOT.GetLeader.GetHerHis] ความผิดพลาดทางการเมืองครั้งนี้บั่นทอนโอกาสในการไดรับเลือกตั้งอีกครั้งของ[ROOT.GetLeader.GetHerHis]อยางรุนแรง และวันนี้เราจะไดรูวานั่นเพียงพอที่จะโคน [GetPoliticsDescriptionOldManPete]"
 FIN_reelection_old_man_pete: "ตาแกพีท"
 FIN_reelection_other_leader: "[ROOT.GetLeader]."
 AAT_finland_political.02.a: "สวินฮุฟวุดตองไดรับความไววางใจจากมวลชน"
 AAT_finland_political.02.b: "แตงตั้งเคียวสติ คัลลิโอ เขาไดรับการสนับสนุนจากฝายสายกลางและฝายประชาธิปไตย!"

 AAT_finland_political.03.desc: "นาเสียดายที่เราตองเผชิญความจริงวา [ROOT.GetLeader] สุขภาพไมดีเลย [ROOT.GetLeader] เคยปวยดวยโรคหลอดเลือดสมองจนแขนขวาของ[ROOT.GetLeader.GetHerHis]เปนอัมพาต และแพทยเกรงวาสุขภาพของ[ROOT.GetLeader.GetHerHis]จะทรุดลงอยางรวดเร็ว เวนแต[ROOT.GetLeader.GetSheHe]จะพนจากตําแหนงทันที \n\nดวยเหตุนี้ เอดุสกุนตา รัฐสภาฟนแลนด จึงเรียกประชุมฉุกเฉินเพื่อเสนอญัตติไมไววางใจใหประธานาธิบดีพนจากตําแหนงเพื่อสุขภาพของเขาเอง  นายกรัฐมนตรีริสโต รีติ ไดรับชวงหนาที่หลายอยางของประธานาธิบดีไปแลว และพรอมเขารับตําแหนงตอ"
 AAT_finland_political.03.a: "แตงตั้งริสโต รีติ เขารับหนาที่ของคัลลิโออยูแลว!"

 AAT_finland_political.04.t: "การถึงแกอสัญกรรมของ [ROOT.GetLeader]"
 AAT_finland_political.04.desc: "เรามีขาวราย [ROOT.GetLeader] ประธานาธิบดีผูเปนที่รักยิ่งแหง [ROOT.GetName] ไดถึงแกอสัญกรรมแลว [ROOT.GetLeader.GetSheHeCap]มีสุขภาพไมดีมาระยะหนึ่ง โดยเคยปวยดวยโรคหลอดเลือดสมองจนแขนขวาของ[ROOT.GetLeader.GetHerHis]เปนอัมพาต \n\n[ROOT.GetLeader.GetSheHeCap]กําลังเดินทางกลับบานหลังจากเพิ่งยื่นใบลาออกของ[ROOT.GetLeader.GetHerHis]ดวยเหตุผลดานสุขภาพ เมื่อ[ROOT.GetLeader.GetSheHe]เกิดอาการหัวใจวายเฉียบพลันและเสียชีวิตลง ณ สถานีรถไฟกลางเฮลซิงกิ ขณะนั้นกองทหารเกียรติยศกําลังบรรเลงเพลงมารชรักชาติของฟนแลนด Porilaisten marssi เพื่อสงเขาลาจากตําแหนง"
 AAT_finland_political.04.a: "ขอใหไปสูสุคติ!"

 AAT_finland_political.05.t: "การลาออกของ [ROOT.GetLeader]"
 AAT_finland_political.05.desc: "วันนี้เราไดรับจดหมายลาออกของ [ROOT.GetLeader] ในจดหมาย[ROOT.GetLeader.GetSheHe]ระบุวายังมีความกังวลตอเนื่องเกี่ยวกับสุขภาพของ[ROOT.GetLeader.GetHerHis] ดังนั้น[ROOT.GetLeader.GetSheHe]จึงตัดสินใจอยางรอบคอบที่จะยื่นใบลาออกของ[ROOT.GetLeader.GetHerHis] \n\n[GetPoliticsDescriptionKallioWinterWar]"
 FIN_politics_kallio_winter_war: "[ROOT.GetLeader] ก็คุนเคยกับสงครามเปนอยางดี และ[ROOT.GetLeader.GetSheHe]ไดแสดงความกังวลตอความตึงเครียดของโลกที่ทวีขึ้น คําเตือนของ[ROOT.GetLeader.GetHerHis]ไดรับความสนใจอยางจริงจังจากสาธารณชน เพราะ[ROOT.GetLeader.GetSheHe]คือผูนําประเทศของเราฝาชวงเวลาที่มืดมนที่สุดของสงครามฤดูหนาว"
 FIN_politics_no_kallio_winter_war: "[ROOT.GetLeader.GetSheHeCap]ยังแสดงความกังวลตอความตึงเครียดที่ทวีขึ้นทั่วโลก และแสดงความปรารถนาอยางลึกซึ้งและจริงใจใหชาว[ROOT.GetAdjective]ปลอดภัยในชวงเวลาอันยากลําบากนี้"
 AAT_finland_political.05.a: "$FIN_risto_ryti$ คือผูสืบทอดลําดับถัดไป!"

 AAT_finland_political.06.desc: "รัฐบาลคอนขางประหลาดใจเมื่อเพิ่งไดรับจดหมายลาออกจาก [ROOT.GetLeader] โดยอางเหตุผลดานสุขภาพ ทั้งที่[ROOT.GetLeader.GetSheHe]ดูมีสุขภาพแข็งแรงดี จึงมีบางคนสงสัยวาอาจมีแรงจูงใจอื่น \n\nประธานาธิบดีเพิ่งพัวพันกับเรื่องอื้อฉาวทางการเมือง เมื่อมีการคนพบวา[ROOT.GetLeader.GetSheHe]สงจดหมายสวนตัวถึง [GER.GetLeader] โดย[ROOT.GetLeader.GetSheHe]วิงวอนขอความชวยเหลือทางทหารเพื่อตอตานศัตรูของเรา ทั้งที่มีอยูจริงและที่คิดไปเอง \n\nเปนที่เขาใจไดวาฝายชาตินิยมบางสวนในคณะรัฐมนตรีประณามการลวงละเมิดอธิปไตยของเราอยางโจงแจงนี้ และพวกเขาอาจกดดันให[ROOT.GetLeader.GetHerHim]ลาออก"
 AAT_finland_political.06.a: "ประเทศไมตองการคนอยางรีติอีกตอไปแลว"

 AAT_finland_political.07.t: "$FIN_carl_mannerheim$ ไดรับแตงตั้งเปนประธานาธิบดี"
 AAT_finland_political.07.desc: "เมื่อสงครามครั้งนี้คุกคามความอยูรอดของ [ROOT.GetName] เราตองตัดสินใจอยางยากลําบากที่จะแทนที่ [ROOT.GetLeader] ดวยรัฐบาลทหารที่นําโดยวีรบุรุษแหงสงครามปลดปลอย[ROOT.GetAdjective] จอมพลคารล กุสตาฟ มันเนอรไฮม เราตองการประสบการณทางทหารของเขา หากเราหวังจะสลัดแอกของผูรุกรานและกอบกูมาตุภูมิ \n\nมันเนอรไฮมรับหนาที่ใหมอยางกระตือรือรน โดยประกาศวา 'สงครามนี้ไมใชอื่นใดนอกจากความตอเนื่องและองกสุดทายของสงครามประกาศอิสรภาพของเรา เรากําลังตอสูเพื่อบานของเรา ศรัทธาของเรา และประเทศของเรา'"
 AAT_finland_political.07.a: "มันเนอรไฮมจะจัดการสถานการณเอง"

 AAT_finland_political.08.t: "มันเนอรไฮมปฏิบัติหนาที่สําเร็จลุลวง"
 AAT_finland_political.08.desc: "เราขอแสดงความขอบคุณตอความสําเร็จของ [ROOT.GetLeader] เพราะแนนอนวาหากปราศจากการนําของ[ROOT.GetLeader.GetHerHis] เราคงฝาพายุมาไมไดและชาติของเราคงลมสลายไปแลว \n\nอยางไรก็ตาม เราตองตัดสินใจเรื่องยาก เราควรขอใหจอมพลดํารงตําแหนงตอไป หรือใหเขาสละตําแหนง ยอมตามเจตจํานงของประชาชน และฟนฟูรัฐบาลพลเรือนขึ้นมาใหม?"
 AAT_finland_political.08.a: "ชาว[ROOT.GetAdjective]ขอบคุณสําหรับการรับใชของทาน จอมพลบารอนมันเนอรไฮม!"
 AAT_finland_political.08.b: "ตําแหนงนี้ยังตองการมันเนอรไฮม!"

 AAT_finland_political.09.desc: "เราขอแสดงความขอบคุณตอความสําเร็จของ [ROOT.GetLeader] เพราะแนนอนวาหากปราศจากการนําของ[ROOT.GetLeader.GetHerHis] เราคงฝาพายุมาไมไดและชาติของเราคงลมสลายไปแลว \n\nแตบัดนี้ถึงเวลาที่เราตองมองไปไกลกวาสงคราม สูสันติภาพและการฟนฟูที่ตองตามมา เพื่อเยียวยาบาดแผลและเผชิญอนาคตอยางแทจริง เราตองฟนฟูรัฐบาลพลเรือน"
 AAT_finland_political.09.a: "ชาว[ROOT.GetAdjective]ขอบคุณสําหรับการรับใชของทาน จอมพลบารอนมันเนอรไฮม!"

 AAT_finland_kinship_war.01.t: "ผูปลุกปนชาว[FROM.GetAdjective]ในคาเรเลียตะวันออก"
 AAT_finland_kinship_war.01.desc: "ทามกลางกระแสตอตานโซเวียตที่ทวีขึ้นในคาเรเลีย พลเมืองผูภักดีของเราที่นั่นแสดงความกลัววาเราอาจกําลังมุงไปสูการซํ้ารอยไฮโมโซดัตและการลุกฮือคาเรเลียตะวันออก ไมวาเปาหมายจะเปนคาเรเลียที่เปนเอกราช การรวมชนชาติฟนนิก ลัทธิชนเผา หรือแมแตความฝนจักรวรรดินิยมของฟนแลนด ก็เห็นไดชัดวาการปลุกปนของฟนแลนดคือตนเหตุ"
 AAT_finland_kinship_war.01.a: "ผูกอการกําเริบทุกคนจะถูกจัดการ!"
 AAT_finland_kinship_war.02.t: "การลุกฮือคาเรเลียตะวันออก!"
 AAT_finland_kinship_war.02.desc: "ความพยายามของเราในการปลุกปนความไมพอใจตอ [SOU.GetName] ประสบความสําเร็จอยางงดงาม ชาวคาเรเลียตะวันออก 20,000 คนอพยพหนีมายังฟนแลนดระหวางการลุกฮือคาเรเลียตะวันออก และพวกเขาทํางานอยางขยันขันแข็งในสมาคมคาเรเลียวิชาการเพื่อรักษาความทรงจําถึงสิ่งที่พวกเขาสูญเสียไป ไฮโมโซดัตไมเคยถูกลืม เชนเดียวกับการปฏิบัติตอชาวคาเรเลียโดยเจาหนาที่โซเวียต \n\nผลที่ตามมาคือประชาชนในคาเรเลียตะวันออกเริ่มพูดกันอยางเปดเผยถึงการลุกฮือตอตานผูกดขี่ อาวุธและเสบียงหลั่งไหลเขาสูภูมิภาคมาระยะหนึ่งแลว แตตอนนี้พวกเขาเรียกรองใหผูที่ถูกขับไลออกไปกลับมาจับอาวุธ \n\nคําถามตอนนี้คือ [ROOT.GetName] จะเขารวมการตอสูของพวกเขาอีกครั้งหรือไม?"
 AAT_finland_kinship_war.02.a: "เราสนับสนุนพี่นองชาวคาเรเลียอยางเต็มที่!"
 AAT_finland_kinship_war.02.b: "เราจะยอมใหผูปลุกปนชาวฟนแลนดขามพรมแดนไป"
 AAT_finland_kinship_war.03.desc: "เสียงปนนัดแรกดังขึ้นเมื่อเชานี้ เมื่อกบฏในคาเรเลียตะวันออก ซึ่งถูกกลุม[FIN.GetAdjective]ยุยงใหลงมือขั้นเด็ดขาด ไดโจมตีที่มั่นของรัฐบาล ความวุนวายกอตัวในพื้นที่มาระยะหนึ่งแลว เพราะมีการลักลอบนําอาวุธเขามาจากเพื่อนบานตัวปญหาของเราเพื่อสนับสนุนกลุมกบฏที่นี่ [FIN.GetName] ไมเคยพอใจกับสนธิสัญญาสันติภาพทารตูที่ลงนามในป 1920 และสนับสนุนกลุมกบฏในคาเรเลียตะวันออกมาโดยตลอด \n\nจนถึงตอนนี้ นั่นคือขอบเขตการมีสวนรวมของพวกเขา แตดูเหมือนในที่สุด [FIN.GetName] กําลังเขามาเกี่ยวของโดยตรงมากขึ้น สถานการณยิ่งบานปลายเมื่อกองกําลัง[FIN.GetAdjective]ขามพรมแดนเขามา ขยายความขัดแยง และนําสองชาติของเราเขาสูภาวะสงคราม"
 AAT_finland_kinship_war.03.a: "พวกเขาไมมีทางสูกองกําลังของเราได!"
 AAT_finland_kinship_war.04.t: "การกบฏคาเรเลียตะวันออกถูกปราบปราม!"
 AAT_finland_kinship_war.04.desc: "ในชวงสองสามเดือนที่ผานมา กองกําลัง[FROM.GetAdjective]ไดหยั่งเชิงเมืองตางๆ ในคาเรเลียตะวันออก พยายามหาทางบอนทําลายเสถียรภาพของภูมิภาคและทําใหกองรักษาการณทองถิ่นตกอยูในความโกลาหล แตการตอตานจากทหาร[SOV.GetAdjective]ฝายปองกันนั้นแข็งแกรงเกินไป \n\nผูปลุกปนชาวฟนแลนดและกบฏคาเรเลียตะวันออกจํานวนมากถูกจับกุม เนรเทศ หรือถูกบีบใหหนีกลับฟนแลนดกอนที่จะวางแผนการลุกฮือไดจริง ประชาชนหวาดกลัว และการลุกฮือก็ไมอาจเกิดขึ้นไดอีกตอไป"
 AAT_finland_kinship_war.04.a: "เราจะตองปลดปลอยคาเรเลียตะวันออกดวยวิธีอื่น"
 AAT_finland_kinship_war.05.desc: "ในชวงสองสามเดือนที่ผานมา กองกําลัง[FIN.GetAdjective]ไดหยั่งเชิงเมืองตางๆ ในคาเรเลียตะวันออก พยายามหาทางบอนทําลายเสถียรภาพของภูมิภาคและทําใหกองรักษาการณทองถิ่นของเราตกอยูในความโกลาหล แตแนนอนวาการตอตานอยางกลาหาญจากทหาร[SOV.Adjective]ฝายปองกันนั้นแข็งแกรงเกินไป \n\nผูปลุกปนชาวฟนแลนดและกบฏคาเรเลียตะวันออกจํานวนมากถูกจับกุม เนรเทศ หรือถูกบีบใหหนีกลับฟนแลนดกอนที่จะยั่วยุใหเกิดการลุกฮือไดจริง ประชาชนตางยินดีที่ในที่สุดสันติภาพก็กลับคืนสูภูมิภาค!"
 AAT_finland_kinship_war.05.a: "หวังวาจะเปนสงครามเครือญาติครั้งสุดทาย คราวนี้ของจริง..."
 AAT_finland_kinship_war_dynamic_modifier_tt: "ขณะที่ตัวปรับคารัฐ §Y$FIN_anti_soviet_sentiment$§! มีผลอยูใน §Y[215.GetName]§!, §Y[216.GetName]§!, §Y[146.GetName]§! หรือ §Y[147.GetName]§! [FROM.GetNameDef] จะสามารถยุยงใหเกิดการลุกฮือในคาเรเลียได"
 AAT_finland_kinship_war_rebellion_crushed_fin_tt: "§Rกลุมกอการกําเริบชาวคาเรเลียถูกปราบปรามกอนที่จะจัดตั้งการลุกฮือได§!"
 AAT_finland_kinship_war_rebellion_crushed_sov_tt: "§Gกลุมกอการกําเริบชาวคาเรเลียถูกปราบปรามกอนที่จะจัดตั้งการลุกฮือได§!"

 AAT_finland_kinship_war.06.t: "ไฮโมโซดัตครั้งที่สอง"
 AAT_finland_kinship_war.06.desc: "ขณะที่สถาบันพลเรือนในสหภาพโซเวียตกําลังลมสลาย รัฐบาลชาตินิยมทองถิ่นหลายแหงก็ประกาศเอกราช ซึ่ง [KAR.GetNameDef] ก็เปนหนึ่งในนั้น กลุมผูตองการรวมดินแดนคาเรเลียและกลุมนิยมทหารประกาศวาเรากําลังเผชิญสงครามเครือญาติครั้งที่สอง ขณะที่ฝายสายกลางและฝายสังคมนิยมอางวาเราไมควรเขาไปยุงเกี่ยวกับกิจการของโซเวียต"
 AAT_finland_kinship_war.06.a: "เราควรสงคนและยุทโธปกรณไปใหพวกเขา"
 AAT_finland_kinship_war.06.b: "ไมควรปลุกหมีที่กําลังหลับ..."

 AAT_finland_the_white_death.1.t: "พลซุมยิงของเราพิสูจนวามีประสิทธิภาพสูง"
 AAT_finland_the_white_death.1.desc: "มีรายงานเขามาวาพลซุมยิงของเรามีประสิทธิภาพสูงอยางยิ่งในการตอสูกับกองกําลังขาศึกที่รุกลํ้าเขามาในปาของเรา นี่เปนโอกาสดีสําหรับโฆษณาชวนเชื่อในสงคราม เพราะคําวามัจจุราชสีขาวเริ่มแพรหลายในหมูทหารขาศึก ซึ่งหมายถึงอันตรายจากธรรมชาติและผูคนของฟนแลนด และเราอาจผูกคํานี้เขากับบุคคลใดบุคคลหนึ่งเพื่อปลุกขวัญประชาชน หากมีใครโดดเดนขึ้นมา"
 AAT_finland_the_white_death.1.a: "Erinomaista! (ยอดเยี่ยม!)"
 AAT_finland_the_white_death.1.b: "เราควรแจกจายอาวุธใหนักลาสัตวมากขึ้น"
 FIN_our_snipers_will_be_more_deadly_tt: "§Yพลซุมยิง§!ของเราจะรายกาจยิ่งขึ้น"

 aat_news.105.t: "มัจจุราชสีขาว"
 aat_news.105.desc: "เมื่อสงครามมาถึง [FIN.GetNameDef] นักลาสัตว กองกําลังอาสาซูโอเยลุสกุนตา และนักแมนปนจากชมรมยิงปนจํานวนมากไดจับอาวุธขึ้นตอสูกับผูกดขี่ จิตวิญญาณซิซูของ[FIN.GetAdjective]ไหลเวียนในตัวพวกเขา ขณะที่พวกเขาสกัดกั้นการโจมตีของขาศึกโดยใชธรรมชาติของ[FIN.GetAdjective]ใหเปนประโยชน สิ่งที่ทหารขาศึกเรียกขานกันวามัจจุราชสีขาว"
 aat_news.105.a: "นี่เปนโอกาสดีสําหรับการโฆษณาชวนเชื่อ!"
 aat_news.105.b: "ความตายมาพรากชีวิตทหารของเรา แตเราจะไมยอมแพโดยไมสู!"
 aat_news.105.c: "พวกเขารูวิธีสูจริงๆ"

 AAT_finland_the_white_death.2.t: "พลซุมยิง[FIN.GetAdjective]สรางความหวาดกลัวในใจทหารของเรา"
 AAT_finland_the_white_death.2.desc: "ทหารของเรารายงานวาทั้งขบวนทหารถูกจูโจมโดยไมทันตั้งตัวและถูกยิงจนแหลกเหลวในปาของ [FIN.GetNameDef] พวกเขาเริ่มพูดถึงมัจจุราชสีขาว ซึ่งเปนตัวแทนของความหนาวเหน็บอันแข็งกราวของ [FIN.GetNameDef] และนักแมนปนอันรายกาจของกองทัพ[FIN.GetAdjective] หากตองการ เราอาจทุมเทความพยายามอยางมากเพื่อกําจัดอุปสรรคเหลานี้กอนที่จะสรางความเสียหายมากขึ้นไปอีก"
 AAT_finland_the_white_death.2.a: "ไมจําเปนตองกังวลเรื่องพวกเขา"
 AAT_finland_the_white_death.2.b: "ตามลาพวกมัน!"
 FIN_we_will_be_more_likely_to_put_down_the_finnish_snipers_tt: "เราจะมีโอกาสสําเร็จมากขึ้นในการตามลา§Yพลซุมยิงฟนแลนด§!"

 AAT_finland_the_white_death.4.t: "ซิโม เฮอูเฮอ ไดรับการยกยองเปนมัจจุราชสีขาว"
 AAT_finland_the_white_death.4.desc: "ซิโม เฮอูเฮอ พลซุมยิงจากวีปูรี ซึ่งเพื่อนทหารมักเรียกเขาวา ไทกา-อัมปูยา หรือนักแมนปนผูวิเศษ จากฝมือการยิงอันนาทึ่ง ตอนนี้ยังไดรับการยกยองวาเปนมัจจุราชสีขาว ซึ่งกอนหนานี้ศัตรูของเราใชหมายถึงความโหดรายของธรรมชาติและผูคนของฟนแลนด และสื่อกําลังผลักดันเรื่องเลาใหมนี้อยางหนัก จุดยืนอยางเปนทางการของเราควรเปนอยางไร?"
 AAT_finland_the_white_death.4.a: "เราควรเผยแพรเรื่องราวของวีรบุรุษฟนแลนดยุคใหมผูนี้"
 AAT_finland_the_white_death.4.b: "มัจจุราชสีขาวคือตัวแทนของฟนแลนด ไมใชบุคคลใดคนหนึ่ง!"
 AAT_finland_the_white_death.5.t: "ซิโม เฮอูเฮอ ไดรับการยกยองเปนมัจจุราชสีขาว"
 AAT_finland_the_white_death.6.t: "ซิโม เฮอูเฮอ ไดรับการยกยองเปนมัจจุราชสีขาว"

 AAT_finland_the_white_death.7.t: "มัจจุราชสีขาวโอบรัดเรา!"
 AAT_finland_the_white_death.7.desc: "แมทหารของเราจะพยายามอยางเต็มที่ มัจจุราชสีขาวก็ยังหางไกลจากการถูกจับ และสรางความหวาดผวาใหทหารของเรามาหลายสัปดาห โดยนายทหารของเราไมมีผลงานใดๆ ใหเห็น ยิ่งเปนเชนนี้นานไป ทหารของเราก็ยิ่งหวั่นไหวและขวัญกําลังใจก็ดิ่งลง..."
 AAT_finland_the_white_death.7.a: "แยแลว..."

 AAT_finland_the_white_death.8.t: "แมจะสูญเสียหนัก แตทหารของเราก็ทําใหมัจจุราชสีขาวบาดเจ็บไดสําเร็จ"
 AAT_finland_the_white_death.8.desc: "นายทหารของเราใน [FIN.GetNameDef] รายงานเขามาวาทําใหมัจจุราชสีขาวบาดเจ็บไดสําเร็จ อยางไรก็ตาม ตองแลกมาดวยราคาที่แพงมาก เพราะทหารจํานวนมากถูกสังหาร และอีกมากไดรับบาดเจ็บระหวางทาง ถึงกระนั้น เราก็ไมนาจะตองเจอเขาในสนามรบอีก"
 AAT_finland_the_white_death.8.a: "เรากําจัดแมลงวันนารําคาญไปไดแลว!"

 AAT_finland_the_white_death.9.t: "แมจะสูญเสียหนัก แตทหารของเราก็สังหารมัจจุราชสีขาวไดสําเร็จ!"
 AAT_finland_the_white_death.9.desc: "รายงานจากนายทหารของเราใน[FIN.GetNameDef]แจงวาไดกําจัดพลซุมยิงชาว[FIN.GetAdjective]ที่ไดฉายาวามัจจุราชสีขาวสําเร็จแลว แมจะตองแลกมาดวยความสูญเสียอยางหนัก แตศัตรูตัวฉกาจของ[ROOT.GetNameDef]ก็ถูกกําจัดไปแลว และทหารของเราก็สามารถพักผอนไดอยางสบายใจ"
 AAT_finland_the_white_death.9.a: "ที่จริงแลว เขาไมมีทางสูเราไดเลย"

 AAT_finland_the_white_death.10.t: "มัจจุราชสีขาวยังคงตามลาเหยื่อตอไป"
 AAT_finland_the_white_death.10.desc: "แมจะรอดหวุดหวิดหลายครั้งและมีขาวลือผิด ๆ มากมาย แตซิโม แฮยแฮก็ยังไมมีแมแตรอยขีดขวน และจะสูตอไปตราบเทาที่ยังจําเปน มัจจุราชสีขาวกําลังโอบกอดศัตรูของเรา!"
 AAT_finland_the_white_death.10.a: "พวกมันจะไดรูจักความหวาดกลัวที่แทจริง"

 AAT_finland_the_white_death.11.t: "ซิโม แฮยแฮไดรับบาดเจ็บและถูกนําตัวออกจากสนามรบ"
 AAT_finland_the_white_death.11.desc: "มีรายงานวาแฮยแฮไดรับบาดเจ็บสาหัสหลังถูกกระสุนระเบิดที่ทหารฝายศัตรูยิงเขาที่ขากรรไกรลางดานซาย และแมจะถูกเขาใจวาเสียชีวิตไปแลว เขาก็ยังกลับมาถึงคายฐานที่อยูใกลเคียงเพื่อรายงานวาปลอดภัย อยางไรก็ตาม เขาไมสามารถสูรบตอไดอีก แตสิ่งที่เขาทําไปก็มากพอที่จะไดรับความกตัญูจากชาว[FIN.GetAdjective]ไปชั่วนิรันดร"
 AAT_finland_the_white_death.11.a: "ถึงอยางไร เขาก็คือวีรบุรุษแหงฟนแลนดที่แทจริง!"

 AAT_finland_the_white_death.12.t: "ซิโม แฮยแฮถูกสังหารแลว!"
 AAT_finland_the_white_death.12.desc: "มีรายงานวาแฮยแฮถูกสังหารหลังถูกกระสุนระเบิดที่ทหารฝายศัตรูยิงเขาใสระหวางการสูรบ ทหารเยเกอรของเราไดนํารางของเขากลับมาไดสําเร็จ และนํากลับมายังเมืองหลวงแลว ประชาชนแหง[FIN.GetNameDef]ผูซาบซึ้งในบุญคุณจะจดจําเขาไปตลอดกาล"
 AAT_finland_the_white_death.12.a: "ขอใหดวงวิญญาณของเขาไดสถิตอยูเคียงขางเหลาวีรชนในอดีต"

 generic_could_lead_to_tt: "อาจนําไปสู:"

 ###################
 ### NEWS EVENTS ###
 ###################
 aat_news.100.t: "สงครามตอเนื่องของ[FIN.GetAdjective]"
 aat_news.100.desc: "หลังพายแพในสงครามครั้งกอนกับรัฐบาล[SOV.GetAdjective] บัดนี้ชาว[FIN.GetAdjective]ไดระดมพลและพรอมที่จะยึดดินแดนที่เสียไปคืน และปลดปลอยชาว[FIN.GetAdjective]และชาว[KAR.GetAdjective]จากการกดขี่ของตางชาติ โดยถือเปนผูสืบทอดเจตนารมณของสงครามประกาศเอกราช[FIN.GetAdjective]และสงครามไฮมอโซดัต"
 aat_news.100.a: "มุงหนาสูชัยชนะอันสมบูรณ!"
 aat_news.100.b: "และพวกเขาจะไมไดสูเพียงลําพัง!"
 aat_news.100.c: "พวกฟนนจะตองชดใช!"
 aat_news.100.d: "หุนเชิดอีกรายของ[GER.GetLeader]เขารวมสงคราม..."

 aat_news.101.t: "การฟนฟูกําลังทหารบนหมูเกาะโอลันด" 
 aat_news.101.desc: "หลังรัสเซียพายแพในสงครามไครเมีย หมูเกาะโอลันดถูกปลอดทหาร และผูอยูอาศัยไดรับการยกเวนจากการเกณฑทหารทุกรูปแบบ แมสถานะนี้จะถูกโตแยงหลายครั้ง แตมหาอํานาจหลายชาติของโลกก็ยังคงบังคับใชอยู อยางไรก็ตาม บัดนี้หลังปฏิบัติการคิลปาปูรเยฮดุสของ[FIN.GetAdjective] หมูเกาะแหงนี้ก็ไดกลับมามีกําลังทหารอีกครั้ง"
 aat_news.101.a: "มันเปนมาตรการที่จําเปน"
 aat_news.101.b: "นั่นหยุดเราไมไดหรอก"
 aat_news.101.c: "สันติภาพคงอยูไดไมนาน..."

 aat_news.666.t: "การฟนฟูจักรวรรดิทะเลเหนือ" 
 aat_news.666.desc: "หลังยึดดินแดนทั้งหมดที่ครั้งหนึ่งเคยอยูใตการปกครองของพระเจาคนุตมหาราชกลับคืนมาได รัฐบาล[From.GetOldAdjective]ก็เริ่มเรงดําเนินการผนวกรวมดินแดนที่เพิ่งพิชิตไดมากขึ้นเรื่อย ๆ ผลที่ตามมาคือ เพื่อปลุกใหประชาชนสนับสนุนรัฐ โฆษณาชวนเชื่อแนวชาตินิยมรวมชาติจึงเพิ่มขึ้น โดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\n[FROM.GetLeader] ผูนํา[FROM.GetOldAdjective] ไดประกาศวานับจากนี้ราชอาณาจักร[DEN.GetOldNameDef] [NOR.GetOldNameDef] และอังกฤษที่รวมเปนหนึ่งเดียว จะเปนที่รูจักในนาม '[From.GetNameDef]'"
 aat_news.666.a: "ดูเหมือนพวกไวกิ้งจะกลับมาแลว"

 aat_news.777.t: "การสถาปนาจักรวรรดิทะเลบอลติก" 
 aat_news.777.desc: "หลังพิชิตภูมิภาคทะเลบอลติกไดเกือบทั้งหมด รัฐบาล[From.GetOldAdjective]ก็เริ่มเรงดําเนินการผนวกรวมดินแดนที่เพิ่งพิชิตไดมากขึ้นเรื่อย ๆ ผลที่ตามมาคือ เพื่อปลุกใหประชาชนสนับสนุนรัฐ โฆษณาชวนเชื่อแนวชาตินิยมรวมชาติจึงเพิ่มขึ้น โดยไดรับการสนับสนุนจากรัฐบาลอยางชัดเจน\n\n[FROM.GetLeader] ผูนํา[FROM.GetOldAdjective] ไดกลาวสุนทรพจนวา[FROM.GetOldNameDef]ทําในสิ่งที่ไมมีประเทศใดเคยทําได และนําทะเลบอลติกมาอยูใตการปกครองของตน [FROM.GetSheHeCap]ปดทายสุนทรพจนดวยการประกาศสถาปนา '[From.GetNameDef]'"
 aat_news.777.a: "อํานาจเหนือทะเลบอลติก (Dominium maris baltici)"


#######################
###  NARVIK EVENTS  ###
#######################

 AAT_britain_narvik.1.t: "เหมืองของ[SWE.GetAdjective]ถูกระเบิดทําลายแลว"
 AAT_britain_narvik.1.desc: "เราระเบิดเหมืองของ[SWE.GetAdjective]ไดสําเร็จ และตัดแหลงทรัพยากรนําเขาที่สําคัญที่สุดแหลงหนึ่งของ[GER.GetNameDef]ไป แมคําสัญญาวาจะชวยเหลือ[FIN.GetName]จะเปนแรงจูงใจหลักของภารกิจนี้ แตการปะทะโดยตรงกับ[SOV.GetNameDef]ไมเคยเปนทางเลือกที่ทําไดจริง และเราก็ไดสรางความเสียหายครั้งใหญใหแกศัตรูหลักของเราแลว เราไมไดมีศัตรูที่แทจริงใน[SWE.GetNameDefCap] และตอนนี้ตองตัดสินใจวาจะทําอะไรตอไป"
 AAT_britain_narvik.1.a: "ถอนกําลัง"
 AAT_britain_narvik.1.b: "เดินหนาการทัพตอ"
 AAT_britain_narvik.2.t: "[ENG.GetName]บุก[SWE.GetName]"
 AAT_britain_narvik.2.desc: "ทหาร[ENG.GetAdjective]ไดขามพรมแดนเขาสู[SWE.GetName]แลว โดยไมมีการประกาศสงครามและรัฐบาล[ENG.GetAdjective]ก็เงียบเฉย ทางการ[SWE.GetAdjective]โกรธแคนตอการไมเคารพอธิปไตยของ[SWE.GetAdjective] คําอธิบายที่นาจะเปนไปไดมากที่สุดคือทหาร[ENG.GetAdjective]พยายามไปใหถึงเหมืองที่เยลลิวาเรและคีรูนาเพื่อกอวินาศกรรม เพื่อปองกันไมใหแรคุณภาพสูงไปถึง[GER.GeName] ซึ่งจะเปนความเสียหายครั้งใหญตอเศรษฐกิจของทั้ง[GER.GetAdjective]และ[SWE.GetAdjective] และเปนการละเมิดความเปนกลางของ[SWE.GetAdjective]อยางรายแรง"
 AAT_britain_narvik.2.a: "พวกมันกลาดียังไง?!"
 AAT_britain_narvik.2.b: "เราตองหยุดพวกมัน!"

 AAT_britain_narvik.3.t: "[ENG.GetName]กอวินาศกรรมเหมืองของ[SWE.GetAdjective]"
 AAT_britain_narvik.3.desc: "[ENG.GetNameDefCap]ไดบุก[SWE.GetName]อยางผิดกฎหมายและทําลายเหมืองของพวกเขา โดยไมมีการประกาศสงครามอยางถูกตอง กลไกขับเคลื่อนสําคัญของเศรษฐกิจ[SWE.GetAdjective]บัดนี้เหลือเพียงบอหินที่พังพินาศ รัฐบาล[ENG.GetAdjective]แกตางการกระทําของตนวาการคาขายกับ[GER.GetNameDefCap]ก็เลวรายไมตางจากการเขาขางพวกเขา และการกระทํานี้ชอบธรรมแลว แตดูเหมือนวาแมแตประชาชนในประเทศของพวกเขาเองก็ยังรูสึกไมสบายใจกับคําอธิบายของรัฐบาล"
 AAT_britain_narvik.3.a: "นี่มันเรื่องอุกอาจ"

 AAT_britain_narvik.4.t: "[ENG.GetName]ถอนกําลังออกจาก[SWE.GetName]"
 AAT_britain_narvik.4.desc: "[ENG.GetName]ประกาศวาบรรลุเปาหมายทางยุทธศาสตรใน[SWE.GetName]แลวและกําลังถอนทหารออก รัฐบาลของพวกเขายังยํ้าวาไมไดมีความเปนศัตรูใด ๆ ตอรัฐ[SWE.GetAdjective] และการกระทําใน[SWE.GetName]เปนไปเพื่อปกปองประชาธิปไตยเทานั้น ทั้งสถานทูต[GER.GetAdjective]และ[SWE.GetAdjective]ตางยื่นหนังสือประทวง ฝาย[GER.GetAdjective]โตแยงวา[ENG.GetName]ละเมิดความเปนกลางและบุกรุกชาติอื่นในเขตสูรบ สวนฝาย[SWE.GetAdjective]ก็โจมตีรัฐบาล[ENG.GetAdjective]อยางรุนแรงวา แมจะอางเปาหมายอันสูงสงในการชวยเหลือ[FIN.GetName] แตบัดนี้ก็ชัดเจนแลววามันเปนเพียงแผนการอันหยาบ ๆ เพื่อผลประโยชนของตนเอง โดยแลกดวยชีวิตของชาว[SWE.GetAdjective]"
 AAT_britain_narvik.4.a: "นี่ก็ยังเปนเรื่องอุกอาจอยูดี"
