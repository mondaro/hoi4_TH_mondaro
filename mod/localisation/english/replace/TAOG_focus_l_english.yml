 ABDA_expand_the_command_tt: "ขยายสมาชิกภาพ ABDACOM ไปยัง[SIA.GetName] [NZL.GetName] และ[MAL.GetName] หากพวกเขาอยูในฝายของเรา โดยมอบตัวปรับคา§Y$ABDA_supreme_command$§!เต็มรูปแบบตามระดับความแข็งแกรงในปจจุบัน"
