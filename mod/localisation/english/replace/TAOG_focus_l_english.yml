  idea_SIA_joint_military_command: "กองบัญชาการทหารรวม"
  idea_SIA_joint_military_command_desc: "โครงสรางการบังคับบัญชาที่เปนเอกภาพชวยใหเหลาทัพประสานงานกันไดดีขึ้น เรงการสรางนายทหารผูมีประสบการณและหลักนิยมในสนามรบ"
