  AST_cannot_campaign_for_two_parties_at_once: "ไม: กําลังหาเสียงใหพรรคอื่น"
  AST_election_campaign_pp_cost_hidden_idea: "การหาเสียงเลือกตั้ง"
  AST_uap_election_campaign_tt: "§Yการหาเสียงเลือกตั้งของ U.A.P§!\n§Lระดมชนชั้นกลาง เจาของธุรกิจ และผูภักดีตอจักรวรรดิ พรรคยูไนเต็ดออสเตรเลียจะเปดการหาเสียงทางการเมือง§!\n\n§Yผล:§!\nอํานาจทางการเมืองที่ใชตอวัน: §R1.00§!\nคะแนนเสียง §YU.A.P§! เพิ่มขึ้นตอวัน: §G+0.05%§!"
  AST_alp_election_campaign_tt: "§Yการหาเสียงเลือกตั้งของ A.L.P§!\n§Lระดมชนชั้นแรงงาน สมาชิกสหภาพแรงงาน และนักปฏิรูปที่มุงเนนภายในประเทศ พรรคแรงงานออสเตรเลียจะเปดการหาเสียงทางการเมือง§!\n\n§Yผล:§!\nอํานาจทางการเมืองที่ใชตอวัน: §R1.00§!\nคะแนนเสียง §YA.L.P§! เพิ่มขึ้นตอวัน: §G+0.05%§!"

  AST_uap_win_count_trigger_tt: "§YU.A.P§! ชนะการเลือกตั้งอยางนอย $COUNT|Y$ ครั้ง"
  AST_alp_win_count_trigger_tt: "§YA.L.P§! ชนะการเลือกตั้งอยางนอย $COUNT|Y$ ครั้ง"

  AST_natunity_desc: "§Yรัฐบาลเอกภาพแหงชาติ§!\n§Lในยามวิกฤต การตอสูเล็ก ๆ ยอมหลีกทางใหการตอสูที่ใหญกวา ชาติรอบตัวเราเผชิญความขัดแยงครั้งแลวครั้งเลา และแมปญหาภายในประเทศจะมีความเรงดวนในตัวเอง แตความเรงดวนนั้นก็จางลงเมื่อภัยแหงการนองเลือดใกลเขามาทุกที พรรคประชาธิปไตยของ [AST.GetName] ตองวางความขัดแยงลงและเผชิญโลกอยางเปนหนึ่งเดียว§!"
  AST_uap_becomes_ruling_party: "§Yพรรคยูไนเต็ดออสเตรเลีย§! กลายเปนพรรครัฐบาล"
  AST_alp_becomes_ruling_party: "§Yพรรคแรงงานออสเตรเลีย§! กลายเปนพรรครัฐบาล"
  AST_increased_focuses_become_available: "แผนยุทธศาสตรที่ระบุไวจะ§Gพรอมใชงาน§!"
  effect_tt: "\n§Yผล§!:"
  AST_natunity_becomes_ruling_party: "\n[GET_AST_RULING_PARTY] จะเชิญ [GET_AST_NON_RULING_PARTY] เขารวมรัฐบาลเอกภาพแหงชาติ\n\n[GET_AST_NON_RULING_PARTY] ไดรับชัยชนะการเลือกตั้ง §Y1§! ครั้ง\n\n"
  AST_natunity_effect_update_tt: "รายการแผนยุทธศาสตรจะอัปเดตตาม §Yพรรคที่ไมไดเปนรัฐบาล§! ในปจจุบันและกลุมแผนยุทธศาสตรที่ปลดล็อกแลวของพรรคนั้น"
  AST_change_democratic_flag_tt: "ธง §Y[AST.GetAdjective]§! จะถูกเปลี่ยนใหม"

