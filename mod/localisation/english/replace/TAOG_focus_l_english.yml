  HOL_taog_guarantee_colonial_loyalty: "รับประกันความจงรักภักดีของอาณานิคม"
  HOL_taog_guarantee_colonial_loyalty_desc: "ลัทธิชาตินิยมกําลังเติบโตในหมูเกาะอินเดียตะวันออก และเห็นไดชัดวาการปฏิวัติครั้งใหมกําลังกอตัว แมการปฏิวัติที่เราเผชิญในป 1927 จะถูกบดขยี้ไดอยางงายดาย แตแหลงขาวของเราบอกวาเราอาจตองรับมือกับกลุมนักปฏิวัติที่เตรียมพรอมมากกวามาก บางทีหากเรายอมผอนปรนบางอยางใหขบวนการชาตินิยมสายสันติของซูตารจโจ เราอาจดึงความสนใจของพลเรือนออกจากการปฏิวัติ และหันไปหาซูตารจโจแทน?"
  HOL_taog_guarantee_colonial_loyalty_tt: "§Wรับประกันวา [INS.GetNameDef] จะไมเกิดการปฏิวัติ§!\n[INS.GetNameDefCap] จะพยายามประกาศเอกราชอยางสันติ ซึ่งสามารถหยุดยั้งไดดวยการทําแผนยุทธศาสตร §Y$INSHOL_industrialized_colony$§! ใหสําเร็จ ซึ่งตองลงทุนในอาณานิคมอยางหนัก"



