  AST_uap_candidate_text: "§Yพรรคยูไนเต็ดออสเตรเลีย§!\n[AST_GET_UAP_LEADER_TEXT]\n\n§Lเสถียรภาพในบาน ความแข็งแกรงทั่วจักรวรรดิ§!\n\n[GET_AST_UAP_RULING]"
