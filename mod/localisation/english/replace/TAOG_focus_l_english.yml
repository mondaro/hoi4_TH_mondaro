  AST_australian_military_forces: "กองกําลังทหารออสเตรเลีย"
  AST_australian_military_forces_desc: "กองทัพออสเตรเลียผานการหลอมดวยไฟในมหาสงคราม ไดพิสูจนความแกรงบนชายฝงอันไกลโพน ยืนหยัดมั่นคงในยุทธการที่โหดรายที่สุดบางยุทธการของสงคราม ในหลายปตอมา กองทัพถูกลดขนาดและปรับโฉมเปนกองกําลังปองกัน โดยมีภารกิจหลักคือปกปองแผนดินแม บทเรียนที่ไดมาอยางยากลําบากในอดีตยังคงอยู พรอมจะถูกเรียกใชอีกครั้ง"
  AST_permanant_military_forces: "กองกําลังทหารประจําการ"
  AST_permanant_military_forces_desc: "กองกําลังทหารหลักของออสเตรเลียคือทหารอาสา ซึ่งมีหนาที่ปกปองแผนดินใหญ อยางไรก็ตาม ในยามที่ความตึงเครียดของโลกทวีขึ้น การจัดตั้งแกนกลางนายทหารและทหารอาชีพยอมเปนการรอบคอบ ซึ่งหลายคนไดรับประสบการณในมหาสงคราม แมในตอนแรกจะทําหนาที่เปนกองหนุน กองกําลังนี้จะใหความตอเนื่องและมาตรฐานการฝกที่เปนแบบแผน"
  AST_invoke_the_1903_defence_act: "บังคับใชพระราชบัญญัติกลาโหม 1903"
  AST_invoke_the_1903_defence_act_desc: "ตามธรรมเนียม ออสเตรเลียพึ่งพาทหารอาสาในการปองกันประเทศ แตในยามที่มีภัยคุกคามรายแรง เราสามารถบังคับใชพระราชบัญญัติกลาโหมป 1903 ซึ่งเปดใหเราเรียกระดมกําลังพลเพิ่มเติมเพื่อการปองกันได"
  AST_lithgow_small_arms_factory: "โรงงานอาวุธเล็กลิธโกว"
  AST_lithgow_small_arms_factory_desc: "โรงงานอาวุธเล็กลิธโกวกอตั้งขึ้นในป 1912 เพื่อลดการพึ่งพาอาวุธและยุทโธปกรณที่ผลิตในอังกฤษในยามสงคราม เมื่อความตึงเครียดของโลกทวีขึ้นอีกครั้ง เราควรขยายการผลิตเพื่อรองรับความตองการที่เพิ่มขึ้นของกองทัพ"
  AST_dingo_scout_car: "รถลาดตระเวนดิงโก"
  AST_dingo_scout_car_desc: "ออสเตรเลียไมมีประเพณีการพัฒนายานเกราะที่แข็งแกรง แตกองทัพของเราเรียกรองการเสริมกําลังดานนี้มากขึ้นเรื่อย ๆ ดังนั้นเราควรนําแบบที่พัฒนาในประเทศ เชน รถลาดตระเวนดิงโก มาใชอยางจริงจังยิ่งขึ้น"
  AST_volunteer_defence_corps_taog: "กองปองกันอาสาสมัคร"  
  AST_volunteer_defence_corps_taog_desc: "กองปองกันอาสาสมัครกอตั้งขึ้นในลักษณะคลายกองรักษาดินแดนของอังกฤษ เปนกองกําลังพลเมืองที่ไมไดรับคาตอบแทน ประกอบดวยผูที่ไมมีคุณสมบัติรับราชการทหารประจําการ แมจะมีขอจํากัดเหลานี้ แตความรูเรื่องภูมิประเทศทองถิ่นทําใหพวกเขาเหมาะกับสงครามกองโจรหากเกิดเหตุรายที่สุดขึ้น" 
  AST_war_carriers: "ลูกหาบสงคราม"
  AST_war_carriers_desc: "การสงกําลังบํารุงเปนตัวตัดสินสงคราม และภูมิประเทศสวนใหญที่ออสเตรเลียปฏิบัติการไมเหมาะกับการขนสงแบบดั้งเดิมอยางรถบรรทุกหรือรถไฟ เราควรพึ่งพากําลังคนทองถิ่นซึ่งปรับตัวเขากับสภาพไดดีและคุนเคยกับเสนทางลับและทางลัดแทน"
  AST_anzac_spirit: "จิตวิญญาณแอนแซค"
  AST_anzac_spirit_desc: "กองทัพบกออสเตรเลียและนิวซีแลนดสรางชื่อเสียงอันนาเกรงขามในมหาสงคราม ทุมเทความพยายามและเลือดเนื้อมหาศาลเพื่อชัยชนะของจักรวรรดิ คุณสมบัติของพวกเขาเปนที่ประจักษแกทุกคน: ความอดทน ความกลาหาญ ความเฉลียวฉลาด และอารมณขัน — ผสานกับการทาทายอยางไมยี่หระเมื่อเผชิญอันตรายและความยากลําบาก"
  AST_lee_enfield_no1_mark3: "Lee-Enfield No.1 Mk III*"
  AST_lee_enfield_no1_mark3_desc: "ดาวดวงเล็กนั้นมีความหมาย — Lee-Enfield No. 1 Mk III* หมายถึงการดัดแปลงในยามสงครามเพื่อใหผลิตไดเร็วขึ้นและถูกลง เมื่อความตองการยังแซงหนาแมแตผลที่ไดนี้ เราตองใช 'แผนกระจายการผลิต' โดยใหบริษัทขนาดเล็กผลิตชิ้นสวนแลวนํามาประกอบที่ลิธโกวเพื่อเพิ่มผลผลิต"
  AST_new_south_wales_government_railways: "การรถไฟรัฐบาลนิวเซาทเวลส"
  AST_new_south_wales_government_railways_desc: "โรงซอมของการรถไฟรัฐบาลนิวเซาทเวลสมีขีดความสามารถพิเศษ: ชิ้นสวนเหล็กกลาขนาดใหญที่หลอเปนชิ้นเดียว ในฐานะหนึ่งในไมกี่ชาติเครือจักรภพที่ผลิตตัวถังและปอมปนรถถังแบบหลอทั้งชิ้นได เราควรใชขีดความสามารถนี้ใหเกิดประโยชน"
  AST_second_australian_imperial_force: "กองกําลังจักรวรรดิออสเตรเลียที่สอง"
  AST_second_australian_imperial_force_desc: "ออสเตรเลียสงกองกําลังจักรวรรดิออสเตรเลียที่หนึ่งไปรบในตางแดนระหวางมหาสงคราม เมื่อสงครามคุกคามจะกลืนกินโลกอีกครั้ง เราควรจัดตั้งกองกําลังจักรวรรดิที่สองเพื่อแสดงแสนยานุภาพของออสเตรเลียในตางแดน"
  AST_expeditionary_leader: "§Yนายพล§! จะไดรับคุณลักษณะ §Yผูนํากองกําลังสํารวจ§! ซึ่งเพิ่มขีดความสามารถในตางแดน แตจะจํากัดจํานวนกองพลที่บัญชาการได"
  AST_expeditionary_leader_plural: "§Yนายพล§! ทั้งสองจะไดรับคุณลักษณะ §Yผูนํากองกําลังสํารวจ§! ซึ่งเพิ่มขีดความสามารถในตางแดน แตจะจํากัดจํานวนกองพลที่บัญชาการได"
  AST_larrikinism: "ลารริกินนิสม"
  AST_larrikinism_desc: "ลารริกินนิสม ซึ่งนิยามวา ‘คนไมขัดเกลา เสียงดังโวยวาย แตจิตใจดี’ ไดกลายมาเปนภาพแทนของวัฒนธรรมออสเตรเลีย ทั้งความทรหดอดทน การไมเกรงกลัวผูมีอํานาจ และการทาทายอันตรายอยางมีอารมณขัน ทหารออสเตรเลียมีชื่อเสียงในมหาสงครามวาเผชิญความยากลําบากอยางเหนียวแนนและรับมือทุกอยางไดอยางสบาย ๆ"
  AST_diggers: "ดิกเกอร"
  AST_diggers_desc: "“ขุด ขุด ขุด จนกวาจะปลอดภัย” คือคําสั่งถึงนายพลวิลเลียม เบิรดวูด เมื่อกองทหารแอนแซคยกพลขึ้นบกที่กัลลิโพลี ถอยคําที่กลายเปนสัญลักษณของวิถีการรบแบบออสเตรเลีย ทวาจิตวิญญาณของดิกเกอรลึกซึ้งกวานั้น มันผูกพันทหารออสเตรเลียและนิวซีแลนดไวดวย ‘มิตรภาพแบบเมต’: สายสัมพันธอันยั่งยืนของการสูเคียงขางและสูเพื่อสหายรวมรบ"
  AST_owen_gun: "ปนโอเวน"
  AST_owen_gun_desc: "ปนโอเวนที่คิดคนขึ้นในประเทศอยางสรางสรรคไดรับชื่อเสียงดานความทนทานและเชื่อถือได ไมตางจากทหารของเรา ขณะที่กองกําลังของเราสูรบทั่วโลก เราควรยึดถืออาวุธนี้ไมเพียงเปนสัญลักษณของความเฉลียวฉลาดและการออกแบบของออสเตรเลีย แตเปนสัญลักษณของจิตวิญญาณแหงการรบของเราดวย"
  AST_department_of_supply_and_development_taog: "กระทรวงการจัดหาและพัฒนา"
  AST_department_of_supply_and_development_taog_desc: "เมื่อความตองการของสงครามผลักดันระบบการผลิตและการสงกําลังบํารุงของเราจนถึงขีดจํากัด เราตองรวมศูนยความพยายามไวภายใตองคกรเฉพาะที่รับผิดชอบการประสานงานและคํ้าจุนระบบเหลานั้น"
  AST_sentinel_tank_development: "พัฒนารถถังเซนทิเนล"
  AST_sentinel_tank_development_desc: "ที่ผานมาเราพึ่งพาแบบรถถังนําเขา แมในยามที่ผลิตเองในประเทศ เราควรตอยอดบทเรียนจากยานเหลานี้ และดวยนวัตกรรมแบบออสเตรเลีย พัฒนารถถังของเราเองที่ออกแบบใหเขากับขีดความสามารถและทรัพยากรของเรา"
  AST_establish_training_camps: "จัดตั้งคายฝก"
  AST_establish_training_camps_desc: "เชนเดียวกับในมหาสงคราม กองกําลังจักรวรรดิที่สองอาจถูกเรียกไปรบที่ใดก็ไดในโลก เราจึงตองพัฒนาโครงการฝกที่ครอบคลุมเพื่อเตรียมทหารใหพรอมสําหรับทุกสภาพแวดลอม ตั้งแตทะเลทรายในแอฟริกาเหนือไปจนถึงปาดิบในแปซิฟกใต"
  AST_jungle_tanks_if_sentinel_tank_development: "หากเราทํา 'พัฒนารถถังเซนทิเนล' เสร็จสิ้นแลว:"
  jungle_heavy_tanks: "รถถังหนักปาดิบ"
  AST_anti_malaria_campaign: "รณรงคตอตานมาลาเรีย"
  AST_anti_malaria_campaign_desc: "กองกําลังของเราอาจถูกเรียกไปรบในปาดิบทั่วแปซิฟก ที่ซึ่งภัยคุกคามที่รายแรงกวากระสุนของขาศึกรออยู: มาลาเรีย เราตองลงมืออยางเด็ดขาดเพื่อปกปองทหารของเราจากศัตรูที่มองไมเห็นนี้"
  AST_defence_citizen_military_forces_act: "พระราชบัญญัติกองกําลังทหารพลเมืองเพื่อการปองกัน"
  AST_defence_citizen_military_forces_act_desc: "จนถึงบัดนี้ มีเพียงทหารอาชีพอาสาสมัครเทานั้นที่สงไปประจําการตางแดนได เมื่อความขัดแยงยังคงทวีความรุนแรง เราตองวางกรอบกฎหมายเพื่อใหหนวยทหารอาสาไปปฏิบัติหนาที่ในตางแดนไดหากจําเปน"
  AST_call_that_a_knife: "ไมตองหวง!"
  AST_call_that_a_knife_desc: "'นั่นไมใชมีด… นี่ตางหากถึงจะเรียกวามีด!' ความหาวกับอารมณขันเล็กนอยชวยไดมาก ทหารของเราเผชิญอันตรายดวยความมั่นใจ ความทรหด และทาทีกรางไมมีขาดมือ"
  AST_army_inventions_directorate_taog: "กรมสิ่งประดิษฐกองทัพบก"
  AST_army_inventions_directorate_taog_desc: "ขอดีไมกี่ขอของสงคราม หากจะเรียกเชนนั้นได คือนวัตกรรมทางเทคโนโลยีที่กาวไปอยางรวดเร็วเพราะความจําเปน เราควรจัดตั้งองคกรรวมศูนยเพื่อพัฒนา ขัดเกลา และใชประโยชนจากความกาวหนาเหลานี้"
  AST_yeramba: "เยรัมบา"
  AST_yeramba_desc: "ตอยอดจากความสําเร็จของยานที่ออสเตรเลียพัฒนาเองอยางเซนทิเนล เราไดกาวไปอีกขั้นดวยเยรัมบา สวนเพิ่มใหมอันทรงพลังในคลังอาวุธของเรา ปนใหญ 25 ปอนดติดตั้งบนแชสซีรถถัง มอบอํานาจการยิงที่คลองตัวและทําลายลางใสศัตรูของเรา"
  AST_alice_springs: "อลิซสปริงส"
  AST_alice_springs_desc: "เอาตแบ็กนั้นกวางใหญ...กวางใหญจริง ๆ ใจกลางของมันคือเมืองเล็ก ๆ ชื่ออลิซสปริงส ซึ่งสามารถเปนศูนยกลางการสงกําลังบํารุงสําหรับปฏิบัติการทั่วออสเตรเลีย เราควรพัฒนาเมืองนี้และตั้งฐานทัพบกเพื่อฝกทหารใหพรอมสําหรับทุกสภาพแวดลอม"
  AST_australian_regular_army: "กองทัพบกประจําการออสเตรเลีย"
  AST_australian_regular_army_desc: "เราไดเรียนรูบทเรียนมากมาย ตั้งแตชายหาดกัลลิโพลีถึงทะเลทรายแอฟริกาเหนือ เทือกเขาของกรีซ และปาดิบของเอเชียตะวันออกเฉียงใต ประสบการณที่ไดมาอยางยากลําบากนี้ไดหลอมกองทัพที่ยืดหยุนและปรับตัวไดดีกวากองทัพใด"

  AST_no1_flying_training_school: "โรงเรียนการบินที่ 1"
  AST_no1_flying_training_school_desc: "โรงเรียนการบินกอตั้งขึ้นในป 1921 พรอมกับการจัดตั้งกองทัพอากาศออสเตรเลีย และถูกเปดปดตามความตองการบุคลากรทางอากาศที่ขึ้นลง เมื่อความตึงเครียดของโลกทวีขึ้น เราควรเปดโรงเรียนอีกครั้งเพื่อฝกนักบินและลูกเรืออากาศยานรุนใหม"
  AST_empire_air_training_scheme_taog: "โครงการฝกนักบินแหงจักรวรรดิ"
  AST_empire_air_training_scheme_taog_desc: "แผนการฝกนักบินแหงเครือจักรภพบริติชมอบเงินทุนและความเชี่ยวชาญจํานวนมากใหแกชาติในเครือจักรภพ เพื่อฝกนักบินและลูกเรืออากาศยานจํานวนมาก การแขงขันเพื่อเปนเจาภาพนั้นดุเดือด โดยมีออสเตรเลียและแคนาดาเปนตัวเต็ง เราไดยื่นขอเสนอของเราเองภายใตโครงการฝกนักบินแหงจักรวรรดิ"
  AST_volunteer_air_corps: "หนวยอาสาสมัครเฝาตรวจการณทางอากาศ"
  AST_volunteer_air_corps_desc: "นานฟาของออสเตรเลียกวางใหญเกินกวาที่หนวยงานทางการเพียงลําพังจะเขาถึงได เราควรพึ่งพาอาสาสมัครในทองถิ่น ใหประจําจุดสังเกตการณนับพันแหงที่กระจายอยูทั่วประเทศ เพื่อเฝาระวังทองฟาของเรา"
  AST_improved_ground_crews: "ปรับปรุงเจาหนาที่ภาคพื้นดิน"
  AST_improved_ground_crews_desc: "นักบินทุกคนตองมีทีมเจาหนาที่ภาคพื้นดินทั้งทีม เพื่อดูแลการซอมบํารุงอากาศยาน การประสานงานการบิน และการปฏิบัติการในฐานทัพอยางเหมาะสม ไมตองพูดถึงตนหน พลปน และพลทิ้งระเบิดที่ขึ้นบินไปดวย เราตองจัดตั้งสถานฝกอบรมที่เหมาะสม เพื่อใหกองทัพอากาศของเราปฏิบัติการไดอยางมีประสิทธิภาพสูงสุด"
  AST_advanced_pilot_training: "การฝกนักบินขั้นสูง"
  AST_advanced_pilot_training_desc: "เมื่ออากาศยานซับซอน เร็ว และลํ้าสมัยขึ้น ทักษะของนักบินของเราก็ตองพัฒนาตามไปดวย เพื่อใชประโยชนจากเทคโนโลยีเหลานี้ไดอยางเต็มที่"
  AST_advanced_pilot_training_tt: "ความเร็วในการไดรับความเชี่ยวชาญ§G+10%§!สําหรับ§Yหลักนิยมทางอากาศ§!"
  AST_commonwealth_aircraft_corporation_taog: "บริษัทอากาศยานเครือจักรภพ"
  AST_commonwealth_aircraft_corporation_taog_desc: "ดวยความสนใจที่เพิ่มขึ้นในสงครามแยงชิงทองฟา เราตองทําใหมั่นใจวาเราจะไมถูกทิ้งไวขางหลัง ผูที่หลงใหลการบินและนักประดิษฐภาคพลเรือนเริ่มมองเห็นศักยภาพของอุตสาหกรรมการบินแลว การมอบเงินทุนเริ่มตนใหพวกเขาจะชวยบมเพาะและขยายภาคสวนที่กําลังเกิดใหมนี้"
  AST_reestablish_central_flying_school: "ฟนฟูโรงเรียนการบินกลาง"
  AST_reestablish_central_flying_school_desc: "โรงเรียนการบินกลางเปนโรงเรียนการบินอีกแหงของออสเตรเลีย ที่ดําเนินการควบคูไปกับโรงเรียนฝกการบินที่ 1 และจะชวยตอบสนองความตองการที่เพิ่มขึ้นของกองทัพอากาศสมัยใหม เมื่อความตึงเครียดทวีขึ้น เราตองทําใหมั่นใจวาบุคลากรของเรามีสิ่งอํานวยความสะดวกที่จําเปน"
  AST_aerodrome_of_democracy_democracy: "สนามบินแหงประชาธิปไตย"
  AST_aerodrome_of_democracy_fascism: "สนามบินแหงการครอบงํา"
  AST_aerodrome_of_democracy_communism: "สนามบินแหงการปลดแอก"
  AST_aerodrome_of_democracy_neutrality: "สนามบินแหงความแข็งแกรง"
  AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
  AST_aerodrome_of_democracy_desc: "เมื่อกาวขึ้นสูแถวหนาของขีดความสามารถดานการบิน กองทัพอากาศออสเตรเลียจึงไดรับสมญานามวา '[GET_AERODOME_NAME]' นักบินของเราเขาตอสูทางอากาศทั่วโลก ขณะที่เครื่องบินทิ้งระเบิดของเราทอดเงามรณะเหนืออุตสาหกรรมของศัตรู"
  AST_government_aircraft_factories: "โรงงานอากาศยานของรัฐบาล"
  AST_government_aircraft_factories_desc: "ดวยระยะทางที่หางไกลจากยุโรป เราไมอาจพึ่งพาแหลงจัดหาอากาศยานแบบดั้งเดิมในยามสงครามได จึงจําเปนอยางยิ่งที่เราจะตองพัฒนาขีดความสามารถในการผลิตภายในประเทศของเราเอง เพื่อใหสามารถผลิตโครงเครื่องบินและเครื่องยนตตามขอกําหนดของเราเอง"
  AST_death_from_down_under_taog: "มัจจุราชจากแดนใต"
  AST_death_from_down_under_taog_desc: "จากสุดขอบซีกโลกใต เราไดหลอหลอมกองทัพอากาศที่ไมมีใครเทียบได อากาศยานของเราบินไปทั่วโลก โจมตีอยางแมนยําและรุนแรงยอยยับ ไมวาศัตรูจะซอนอยูที่ใด ความตายจะมาจากแดนใต"
  AST_ride_the_lightning: "ขี่สายฟา"
  AST_ride_the_lightning_desc: "นักบินขับไลของเราคือหัวหอกของกําลังทางอากาศ รวดเร็ว ดุดัน และไมลดละ พวกเขาขี่สายฟาเขาสูสมรภูมิ ยึดครองทองฟา สกัดกั้นอากาศยานของศัตรู และทําใหมั่นใจวาไมวากองกําลังของเราจะไปที่ใด ความเหนือกวาทางอากาศจะตามติดไปเสมอ"
  AST_the_gathering_storm: "พายุที่กอตัว"
  AST_the_gathering_storm_desc: "พายุกําลังกอตัวขึ้นที่ขอบฟา กําลังทางอากาศที่เติบโตขึ้นของเราสรางแรงกดดันจากเบื้องบนมากขึ้นเรื่อย ๆ โจมตีจุดที่ศัตรูออนแอที่สุดและสนับสนุนการรุกของเรา สิ่งที่เริ่มตนเปนเสียงครืนครางแตไกล จะปะทุเปนพายุแหงการทําลายลางที่ไมหยุดหยอนในไมชา"
  AST_hear_the_thunder: "จงฟงเสียงฟาคําราม"
  AST_hear_the_thunder_desc: "ไดยินไหม ไดยินเสียงฟารองไหม? จากแผนดินแดนใต เครื่องบินทิ้งระเบิดทางยุทธศาสตรของเรานําพาอานุภาพของออสเตรเลียไปทั่วโลก เมื่อทองฟาคํารามและแผนดินสั่นสะเทือน ศัตรูของเราจะรูวา พายุไดมาถึงแลว และมันนําพาการทําลายลางมาดวย"
  AST_department_of_aircraft_production: "กรมการผลิตอากาศยาน"
  AST_department_of_aircraft_production_desc: "การขยายตัวอยางรวดเร็วของกองทัพอากาศออสเตรเลียสรางภาระหนักใหแกกําลังการผลิตของเรา เราตองคิดการใหญยิ่งขึ้น ขยายและประสานฐานอุตสาหกรรมของเราใหทันกับความตองการ และทําใหมั่นใจวาเราจะทําใหทองฟามืดมิดดวยอากาศยานของเราได"

  AST_royal_australian_navy: "ราชนาวีออสเตรเลีย"
  AST_royal_australian_navy_desc: "ราชนาวีออสเตรเลียกอตั้งขึ้นหลังการรวมเปนสหพันธรัฐ ดวยการรวมกองเรือของอาณานิคมตาง ๆ เขาดวยกัน และไดปฏิบัติการในแทบทุกเขตสงครามในมหาสงคราม นับแตนั้นก็ถูกลดขนาดลงเพราะงบประมาณที่จํากัด แตเมื่อความตึงเครียดของโลกเพิ่มสูงขึ้น ก็ถึงเวลาที่กองเรือจะกลับสูทองทะเล"
  AST_coast_watchers: "ผูเฝาระวังชายฝง"
  AST_coast_watchers_desc: "ขณะที่กองกําลังสวนใหญของเรายังคงมุงอยูที่แผนดินใหญ เสนทางเขาสูทางเหนือของเราเปนเครือขายเตือนภัยลวงหนาที่สําคัญยิ่ง การสงสายลับขาวกรองทองถิ่นไปประจําทั่วหมูเกาะรอบนอกเหลานี้ จะชวยใหเราตรวจจับการเคลื่อนไหวทางอากาศและทางทะเลของศัตรูไดนานกอนที่จะคุกคามชายฝงออสเตรเลีย"
  AST_marines: "นาวิกโยธิน"
  AST_marines_desc: "ในฐานะเกาะที่ใหญที่สุดในมหาสมุทรแหงหมูเกาะ เราตองทําใหมั่นใจวาเรามีขีดความสามารถในการยกพลขึ้นบก เพื่อแผอํานาจไปไกลกวาชายฝงของเรา หากเราจําเปนตองเปลี่ยนจากการตั้งรับเปนการรุก กองกําลังเหลานี้จะทําใหปฏิบัติการกระโดดขามเกาะเปนไปอยางมีประสิทธิภาพ"
  AST_naval_auxiliary_patrol_taog: "หนวยลาดตระเวนสมทบทางเรือ"
  AST_naval_auxiliary_patrol_taog_desc: "เมื่อกองกําลังอาชีพของเราติดภารกิจอื่น เราสามารถหันไปพึ่งอาสาสมัครทองถิ่นที่กระตือรือรนใหคุมกันทาเรือและสิ่งอํานวยความสะดวกตามชายฝง ความรูอันลึกซึ้งเกี่ยวกับนานนํ้าทองถิ่นทําใหพวกเขามีคาอยางยิ่ง และไมมีใครสงสัยวาชาวประมงทองถิ่นจะทํางานใหเรา"
  AST_cockatoo_island_shipyards_taog: "อูตอเรือเกาะค็อกคาทู"
  AST_cockatoo_island_shipyards_taog_desc: "อูตอเรือเกาะค็อกคาทูทําหนาที่เปนศูนยซอมบํารุงของจักรวรรดิมาชานาน คอยสนับสนุนปฏิบัติการของราชนาวีอังกฤษในตางแดน บัดนี้เมื่อเปนเสาหลักของราชนาวีออสเตรเลียแลว เราตองขยายขีดความสามารถของมัน เพื่อตอบสนองความตองการที่เพิ่มขึ้นของกองเรือและรักษากําลังทางเรือของเราไว"
  AST_kangaroo_point_dry_dock_taog: "อูแหงแคงการูพอยต"
  AST_kangaroo_point_dry_dock_taog_desc: "แมอีแวนส ดีกิน แอนด คอมพานี จะเปนบริษัทวิศวกรรมเปนหลัก แตพวกเขาก็มองเห็นอยางถูกตองถึงความจําเปนในการขยายกําลังการตอเรือเมื่อความตึงเครียดของโลกเพิ่มขึ้น และไดหมายตาแคงการูพอยตไว เราควรอํานวยความสะดวกใหพวกเขาเขาครอบครองที่ดินผืนนี้ เพื่อสนับสนุนการเติบโตอยางตอเนื่องของกองเรือ"
  AST_scrap_iron_flotilla_taog: "กองเรือเศษเหล็ก"
  AST_scrap_iron_flotilla_taog_desc: "แมจะถูกนักวิจารณปรามาสวาลาสมัยและทรุดโทรม แตเรือพิฆาตรุนเกาของเราจํานวนหนึ่งก็ไดถูกรวมเขาเปนหมูเดียวกัน แมจะขาดเกียรติภูมิแบบเรือสมัยใหม แตเรือเหลานี้ก็แสดงถึงการใชสิ่งที่เรามีอยูแลวอยางชาญฉลาด"
  AST_cruising_for_a_bruising: "ลองหาเรื่อง"
  AST_cruising_for_a_bruising_desc: "กองทัพเรือของเราใชเรือลาดตระเวนไดอยางชํานาญมาชานาน และเปนประเพณีที่ควรคาแกการขยายตอ เรือเหลานี้รวดเร็ว คลองตัว และโจมตีหนักหนวง จะสรางชื่อเสียงไปทั่วโลกในไมชา ศัตรูใดที่ขวางทางจะพบวาตัวเองตองเจ็บตัวหนักแนนอน"
  AST_strike_from_down_under: "จูโจมจากแดนใต"
  AST_strike_from_down_under_desc: "ใตคลื่นพวกมันรอนไป ไรเสียงฟารองใด หากพบเจาเมื่อไร เรือของเจาจะถูกปลนไป ไดยินไหม ไดยินเรื่องเรือดํานํ้าจากแดนใตไหม? รีบหนีไปเสีย ไมงั้นกองเรือเจาจะสูญไป เย-อา!"
  AST_hmas_sydney: "HMAS Sydney"
  AST_hmas_sydney_desc: "ยุคของเรือประจัญบานสิ้นสุดลงแลว อนาคตของกําลังทางทะเลอยูบนทองฟาเหนือกองเรือ และออสเตรเลียจะไมถูกทิ้งไวขางหลัง หลังจากหลายปของการฟนฟูและปรับปรุงกองทัพเรือใหทันสมัย เราพรอมแลวที่จะกาวขั้นสุดทาย นั่นคือเรือบรรทุกเครื่องบินที่จะกําหนดนิยามของกําลังทางทะเลของออสเตรเลียไปอีกชั่วรุน"

  AST_conscription_level_allowed_tt: "เจตจํานงทางการเมืองเพื่อการเกณฑทหารที่มากขึ้น (มองหาไอคอนกําลังพลบนแผนยุทธศาสตร)"
  AST_conscription_level_allowed_limited_conscription_tt: "ปลดล็อก§Yกฎหมายการเกณฑทหาร§!เพิ่มอีกหนึ่งระดับ ซึ่งจะเปดใช§Yการเกณฑทหารแบบจํากัด§!"
  AST_conscription_level_allowed_extensive_conscription_tt: "ปลดล็อก§Yกฎหมายการเกณฑทหาร§!เพิ่มอีกหนึ่งระดับ ซึ่งจะเปดใช§Yการเกณฑทหารแบบขยาย§!"
  AST_conscription_level_allowed_service_by_requirement_tt: "ปลดล็อก§Yกฎหมายการเกณฑทหาร§!เพิ่มอีกหนึ่งระดับ ซึ่งจะเปดใช§Yการรับราชการตามความจําเปน§!"
  AST_conscription_level_allowed_all_adults_serve_tt: "ปลดล็อก§Yกฎหมายการเกณฑทหาร§!เพิ่มอีกหนึ่งระดับ ซึ่งจะเปดใช§Yผูใหญทุกคนตองรับราชการ§!"
  AST_conscription_level_allowed_scraping_the_barrel_tt: "ปลดล็อก§Yกฎหมายการเกณฑทหาร§!เพิ่มอีกหนึ่งระดับ ซึ่งจะเปดใช§Yกวาดกนถัง§!"
  AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"

  ############
  ### MISC ###
  ############
  add_random_stat_to_general_tt: "เพิ่มคาทักษะแบบสุมอีกหนึ่งคาใหแกนายพลผูนี้"
  generic_unlock_industrial_concern_tt: "พรอมใชงานในฐานะกลุมอุตสาหกรรม: \n"
  NZL_rail_standardization_tt: "§Y$NZL_train_equipment_1$§!จํานวน§Y[?NZL_train_var]§!หนวยถูกเพิ่มเขาคลังยุทโธปกรณแหงชาติ"

  NZL_ministry_of_public_works: "กระทรวงโยธาธิการ"
  NZL_ministry_of_public_works_desc: "ดวยการวางแผนที่ประสานกันและการลงทุนอยางมีวินัย ถนน ทางรถไฟ และโครงการไฟฟาจะไดรับการพัฒนาตามยุทธศาสตรชาติที่สอดคลองกัน แทนที่จะเปนความพยายามแบบกระจัดกระจาย"
  NZL_abolish_the_railways_board: "ยุบคณะกรรมการการรถไฟ"
  NZL_abolish_the_railways_board_desc: "คณะกรรมการการรถไฟของรัฐไรประสิทธิภาพในการปรับปรุงเครือขายใหทันสมัย ถึงเวลาแลวที่เราจะยุบหนวยงานที่ผิดเพี้ยนนี้ และนําการรถไฟกลับมาอยูใตการควบคุมของกระทรวง"
  NZL_rail_standardization: "มาตรฐานหัวรถจักร"
  NZL_rail_standardization_desc: "[ROOT.GetName]มีโรงงานหลายแหงทั่วประเทศที่ผลิตหัวรถจักรซึ่งมีคุณภาพแตกตางกันไป เพื่อใหระบบรถไฟมีประสิทธิภาพยิ่งขึ้น เราจะกําหนดหัวรถจักรมาตรฐานจํานวนหนึ่งใหโรงงานเหลานั้นผลิต โดยแตละแบบจะออกแบบมาเฉพาะสําหรับภารกิจหนึ่ง ๆ"
  NZL_full_employment: "การจางงานเต็มที่"
  NZL_full_employment_desc: "ดวยงานสาธารณะที่ตอเนื่อง การวางแผนอยางรอบคอบ และการขยายตัวทางอุตสาหกรรมอยางสมํ่าเสมอ ในที่สุดการวางงานก็ไดหลีกทางใหแกโอกาส โรงงานที่เคยวางเปลาในยุคเศรษฐกิจตกตํ่ากลับมาคึกคักอีกครั้ง และแรงงานของชาติก็ไดทํางานในกิจการที่กอผลผลิตอยางเต็มที่ เมื่อฟนฟูความเชื่อมั่นและเสถียรภาพแลว เราไมเพียงฟนตัว แตยังแข็งแกรงขึ้นเพื่อรับมือความทาทายขางหนา"
  NZL_direct_the_coal_industry: "กํากับอุตสาหกรรมถานหิน"
  NZL_direct_the_coal_industry_desc: "เมื่อถานหินมีความสําคัญยิ่งขึ้นเรื่อย ๆ ตอการรถไฟ อุตสาหกรรม และโรงไฟฟา รัฐบาลตองเขามาประสานการผลิตและการกระจายเพื่อผลประโยชนของชาติ"
  NZL_establish_the_ncb: "จัดตั้งคณะกรรมการถานหินแหงชาติ"
  NZL_establish_the_ncb_desc: "การจัดตั้งคณะกรรมการถานหินแหงชาติจะชวยใหเรานําเหมืองที่กระจัดกระจายทั่วประเทศมาอยูใตการกํากับที่ประสานกัน และรับประกันอุปทานเชื้อเพลิงที่มั่นคงสําหรับการรถไฟ อุตสาหกรรม และการผลิตไฟฟา การกํากับดูแลจากสวนกลางจะชวยใหเราจัดระบบการผลิต ปรับปรุงประสิทธิภาพ และทําใหความตองการทางยุทธศาสตรมากอนผลประโยชนสวนตน"
  NZL_electrification: "ขยายการผลิตไฟฟา"
  NZL_electrification_desc: "การใชประโยชนจากแมนํ้าและขยายการผลิตไฟฟาพลังนํ้า จะชวยวางรากฐานสําหรับความแข็งแกรงทางอุตสาหกรรมที่ยั่งยืน เขื่อนและระบบสายสงใหมจะเพิ่มกําลังการผลิตทั่วประเทศ ทําใหมั่นใจวาโรงงาน ทางรถไฟ และทาเรือมีพลังงานที่ตองการ"
  NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
  NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
