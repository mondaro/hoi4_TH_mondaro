  # Alternative Communist Focus
  SIA_the_peoples_war_in_asia: "สงครามประชาชนในเอเชีย"
  SIA_the_peoples_war_in_asia_desc: "การตอสูกับจักรวรรดินิยม[JAP.GetAdjective]มิใชเพียงการชิงชัยระหวางรัฐ หากแตเปนสงครามของกรรมกร ชาวนา และทหาร ที่ลุกขึ้นตอตานการครอบงําจากตางแดน ดวยการยืนเคียงขางกองกําลังคอมมิวนิสตในจีน [ROOT.GetNameDef]ไดอุทิศตนใหแกสงครามประชาชนที่กวางใหญทั่วเอเชีย"


  SIA_peoples_war_in_asia_idea: "สงครามประชาชนในเอเชีย"
  SIA_peoples_war_in_asia_idea_desc: "สงครามครั้งนี้ดํารงอยูไดดวยมากกวากองกําลังประจําการ คณะกรรมการทองถิ่น ผูนําทางของกองโจร และขบวนลําเลียงเสบียงของชาวนา ลวนรับใชกองทัพในสนามรบ ทุกหมูบานกลายเปนคลังเสบียง ทุกเสนทางอาจเปนจุดซุมโจมตี และทุกการถอยรนคือโอกาสลอขาศึกใหลึกเขามาในแผนดิน"

  # Alternative Nationalist Focus
  SIA_national_defense_in_asia: "การปองกันประเทศในเอเชีย"
  SIA_national_defense_in_asia_desc: "การปองกันเอเชียตองอาศัยวินัย ลําดับชั้นการบังคับบัญชา และเปาหมายทางยุทธศาสตรรวมกัน ดวยการยืนเคียงขางรัฐบาลชาตินิยมของจีน [ROOT.GetNameDef]ไดเขารวมแนวรวมที่มุงมั่นตานทานการขยายอํานาจของ[JAP.GetAdjective]ดวยกองทัพที่มีระเบียบและการบัญชาการที่ประสานกัน"
  SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! เขารวมกับกองกําลังชาตินิยมในแนวรวม\nเพิ่ม §Y$SIA_national_defense_in_asia_idea$§! ซึ่งให:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
  SIA_stronger_together: "รวมกันเราแข็งแกรง"
  SIA_stronger_together_desc: "สงครามไดทําใหคํามั่นสัญญาอันหางไกลและพันธมิตรที่ซอนกันอยูกลายเปนเพียงอุปสรรค หาก[ROOT.GetNameDef]จะกําหนดทิศทางของเอเชีย เราตองขอใหพันธมิตรผนวกฝายของตนเขากับฝายของเรา และยอมรับการบัญชาการเดียวในการตอสูที่รออยูเบื้องหนา"
  idea_SIA_national_defense_in_asia: "การปองกันประเทศในเอเชีย"

  SIA_directorate_of_aeronautical_engineering_desc: "อนาคตของกําลังทางอากาศของ[ROOT.GetNameDef]จะมั่นคงไดดวยนักบินเพียงอยางเดียวไมได หากตองอาศัยวิศวกร ผูตรวจสอบ โรงซอม และหนวยงานกลางที่สามารถเปลี่ยนเครื่องบินที่ซื้อจากตางประเทศใหพรอมใชงาน กรมชางอากาศจะเปนรากฐานของความพยายามนี้"

  idea_SIA_aeronautical_engineering_directorate: "กรมชางอากาศ"

  SIA_standardize_aircraft_maintenance: "กําหนดมาตรฐานการซอมบํารุงอากาศยาน"
  SIA_standardize_aircraft_maintenance_desc: "เครื่องบินของเรามาจากหลายแหลง แตละแบบมีชิ้นสวน เครื่องมือ และวิธีซอมเปนของตนเอง การกําหนดขั้นตอนการซอมบํารุงใหเปนมาตรฐานเดียวภายใตกรมชางอากาศจะชวยให[ROOT.GetNameDef]มีเครื่องบินขึ้นบินไดมากขึ้น และลดความสิ้นเปลืองจากความสับสนบนภาคพื้นดิน"

  SIA_expand_aircraft_workshops: "ขยายโรงซอมอากาศยาน"
  SIA_expand_aircraft_workshops_desc: "กรมชางอากาศตองการมากกวาสํานักงานและเอกสารตรวจสอบ โรงซอมแหงใหม เครื่องมือกล และชางเครื่องที่ผานการฝกจะทําใหซอมเครื่องบินที่เสียหายไดภายในประเทศ ขณะเดียวกันก็ผลิตชิ้นสวนงาย ๆ ไดเองโดยไมตองรอการสงมอบจากตางประเทศ"

  SIA_license_modern_airframes: "ซื้อสิทธิบัตรผลิตโครงเครื่องบินสมัยใหม"
  SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap]ยังไมสามารถออกแบบเครื่องบินทุกแบบที่ตองการไดเอง ทางที่ปฏิบัติไดจริงกวาคือซื้อสิทธิ์ผลิตแบบเครื่องบินตางประเทศ ศึกษาโครงสราง แลวดัดแปลงใหเขากับภูมิอากาศ สนามบิน และสภาพการสงกําลังบํารุงของเรา ภายใตการกํากับดูแลของกรมชางอากาศ"

  SIA_tropical_air_operations: "ปฏิบัติการทางอากาศในเขตรอน"
  SIA_tropical_air_operations_desc: "ความรอน ความชื้น ฝนมรสุม และสนามบินสวนหนาที่ขรุขระ ลวนเปนภาระเฉพาะตอเครื่องบินและลูกเรือ การปรับเครื่องยนต ตารางการซอมบํารุง และหลักนิยมของนักบินใหเขากับสภาพเหลานี้ จะทําใหกองทัพอากาศของเราเชื่อถือไดมากขึ้นในนานฟาเอเชียตะวันออกเฉียงใต"

  SIA_thai_french_liaison: "การประสานงานไทย-ฝรั่งเศส"
  SIA_thai_french_liaison_no_indochina_tt: "เราไมไดยึดครองสวนใดของอินโดจีนฝรั่งเศส (ลาว กัมพูชา หรือเวียดนาม)"
  SIA_thai_french_liaison_desc: "สายสัมพันธที่กอตัวขึ้นเมื่อนักบินรุนแรกของเราไปฝกที่ฝรั่งเศสยังคงแนนแฟน ตราบใดที่ปารีสและกรุงเทพฯ ยังอยูอยางสันติ การประสานงานถาวรจะทําใหความเชี่ยวชาญทางเทคนิค คูมือ และไมตรีจิตจากฝรั่งเศสไหลมาสูกําลังทางอากาศของเราอยางตอเนื่อง"
  SIA_expand_don_mueang: "ขยายฐานทัพอากาศดอนเมือง"
  SIA_expand_don_mueang_desc: "ดอนเมืองคือหัวใจที่เตนอยูของกําลังทางอากาศของเรา ทางวิ่ง โรงเก็บเครื่องบิน และคลังแหงใหมจะทําใหที่นี่เปนฐานทัพที่คูควรกับกองทัพอากาศสมัยใหม และเปนทั่งตีเหล็กที่หลอหลอมฝูงบินของเรา"
  SIA_hawk_iii_production_line: "สายการผลิต Hawk III"
  SIA_hawk_iii_production_line_desc: "Hawk III เปนที่คุนเคยของนักบินและโรงซอมของเราอยูแลว การใชเครื่องบินขับไลที่พิสูจนแลวและผลิตไดภายใตสิทธิบัตรเปนมาตรฐาน จะชวยซื้อเวลาระหวางที่เราตัดสินใจวาการปรับปรุงใหทันสมัยควรมีหนาตาอยางไร"
  SIA_mixed_inventory_standardization: "จัดมาตรฐานคลังอากาศยานที่หลากหลาย"
  SIA_mixed_inventory_standardization_desc: "แนวปฏิบัติแบบอเมริกัน ญี่ปุน และแบบเกาที่สืบมาจากฝรั่งเศส ไมอาจหลอมรวมเปนกองทัพอากาศที่เปนเอกภาพไดดวยตัวเอง อะไหล เครื่องหมาย วิทยุ และวินัยการซอมบํารุงตองไดรับการจัดใหเปนมาตรฐานกอนที่สงครามครั้งหนาจะมาถึง"
  SIA_womens_auxiliary_air_force: "กองทัพอากาศหญิงสนับสนุน"
  SIA_womens_auxiliary_air_force_desc: "ชางเครื่อง เสมียน และพนักงานวิทยุทุกคนที่ปลดออกจากงานภาคพื้นได ก็เทากับนักบินอีกหนึ่งคนบนฟา สตรีไทยไดพิสูจนตนเองแลวในโรงพยาบาลและกระทรวงตาง ๆ สนามบินดอนเมืองก็จะไมตางกัน"
  SIA_air_defense_of_the_kra: "การปองกันภัยทางอากาศคอคอดกระ"
  SIA_air_defense_of_the_kra_desc: "ภาคใตของไทยคือบานพับระหวางมลายูกับพมา มหาอํานาจใดที่เคลื่อนทัพผานคาบสมุทรจะตองเผชิญกับสนามบิน ที่ตั้งเตือนภัย และเครื่องบินสกัดกั้นของไทย เราจะครองนานฟาเหนือแผนดินของเราเอง แทนที่จะเอื้อมไปแยงนานฟาของผูอื่น"
  SIA_the_interceptor_force: "กําลังสกัดกั้นทางอากาศ"
  SIA_the_interceptor_force_desc: "การลาดตระเวนประจําและเครือขายผูตรวจการณภาคพื้นดินจะเปลี่ยนเครื่องบินขับไลของเราใหเปนกําลังสกัดกั้นอยางแทจริง เรดารและการขึ้นบินฉุกเฉินอยางรวดเร็วจะสกัดผูจูโจมกอนถึงเมืองของเรา"
  SIA_hardened_air_defenses: "การปองกันภัยทางอากาศที่แข็งแกรง"
  SIA_hardened_air_defenses_desc: "ทางวิ่งที่กระจายตัว คันดินกําบัง และปนตอสูอากาศยานที่ตั้งอยางหนาแนน ทําใหกําลังทางอากาศของเรารับแรงปะทะไดและยังบินตอไปได สิ่งที่รอดจากการโจมตีครั้งแรกจะยังคงอยูรับมือครั้งที่สอง"
  SIA_forward_strike_wings: "กองบินโจมตีสวนหนา"
  SIA_forward_strike_wings_desc: "แทนที่จะรอใหถูกโจมตี เราจะฝกกองบินใหชวงชิงนานฟาเหนือแนวหนาและบุกเขาใสขาศึกทันทีที่สงครามเริ่มตน"
  SIA_increase_air_crews: "เพิ่มเจาหนาที่ภาคพื้นอากาศ"
  SIA_increase_air_crews_desc: "เราจะขยายกําลังเจาหนาที่ภาคพื้นที่ดูแลเครื่องบินของเรา แมตองใชกําลังพลเพื่อเติมอัตรา แตเครื่องบินที่ไดรับการบํารุงรักษาอยางดีและไดรับการปกปองดีกวาจะกลับขึ้นบินไดอีก ในขณะที่เครื่องที่ถูกละเลยคงตองสูญเสียไป"
  SIA_conserve_air_crews: "ประหยัดเจาหนาที่ภาคพื้นอากาศ"
  SIA_conserve_air_crews_desc: "ชางเครื่องทุกคนในสนามบินคือพลปนเล็กยาวที่ไมไดอยูแนวหนา เราจะบริหารกําลังทางอากาศอยางกระชับ ปลดกําลังพลสวนนั้นใหกองทัพบก และยอมรับวาเครื่องบินของเราจะเสียบอยขึ้น"
  SIA_tropical_operations: "ปฏิบัติการในเขตรอน"
  SIA_tropical_operations_desc: "ความรอน มรสุม และเรือนยอดปาทึบ ลงโทษนักบินที่ประมาทยิ่งกวาปนของขาศึก เราจะออกแบบกําลังทางอากาศใหเขากับภูมิอากาศของภูมิภาคเราเอง เพื่อโจมตีขาศึกภาคพื้นดินอยางหนักหนวงแมสภาพอากาศจะเลวราย"
  SIA_veteran_jungle_aviators: "นักบินปาดงผูชํ่าชอง"
  SIA_veteran_jungle_aviators_desc: "การบินในภูมิอากาศเชนนี้ทําลายทั้งนักบินมือใหมและเครื่องยนตที่สึกหรอ การซอมบํารุงที่ดีขึ้นและประสบการณที่ไดมาอยางยากลําบาก จะเปลี่ยนการเอาตัวรอดใหเปนทักษะ และเปลี่ยนทักษะใหเปนยอดนักบิน"
  SIA_long_range_strike_wings: "กองบินโจมตีพิสัยไกล"
  SIA_long_range_strike_wings_desc: "แทนที่จะสรางกําลังเพื่อปาดงตรงหนา เราจะสรางเพื่อระยะทางที่ไกลออกไป ฝูงเครื่องบินทิ้งระเบิดพิสัยไกลที่จัดหาและผลิตโดยปราศจากความสิ้นเปลืองตามปกติ จะทําใหเราโจมตีไดไกลเลยพรมแดนของเราออกไป"
  SIA_lightweight_airframes: "โครงเครื่องบินนํ้าหนักเบา"
  SIA_lightweight_airframes_desc: "ถอดถังเชื้อเพลิงสํารองและนํ้าหนักที่มีไวเพื่อบินระยะไกลออก สิ่งที่เหลือจะเลี้ยวไดแคบขึ้น ไตระดับเร็วขึ้น และมีอํานาจการโจมตีเหนือเปาหมายหนักหนวงขึ้น กองบินของเราอาจไปไดไมไกล แตสิ่งใดที่อยูในระยะจะไมมีวันปลอดภัย"
  SIA_tactical_bombing_school: "โรงเรียนการทิ้งระเบิดทางยุทธวิธี"
  SIA_tactical_bombing_school_desc: "โรงเรียนเฉพาะสําหรับลูกเรือเครื่องบินทิ้งระเบิดจะเปลี่ยนเครื่องบินทิ้งระเบิดทางยุทธวิธีของเราจากเครื่องมือทื่อ ๆ ใหกลายเปนเครื่องมือที่แมนยํา โจมตีไดหนักและตรงเปายิ่งขึ้นตอทุกสิ่งที่ขวางทาง"
  SIA_reinforced_platings: "แผนเกราะเสริม"
  SIA_reinforced_platings_desc: "แผนเกราะและถังเชื้อเพลิงเสริมทําใหเครื่องบินขับไลคุมกันของเรารับการยิงไดและยังไปถึงเปาหมายที่ไกลจากบานได นํ้าหนักที่เพิ่มขึ้นทําใหเปลืองเชื้อเพลิงมากขึ้นระหวางทาง แตกองบินคุมกันที่ฝกมาอยางดียอมคุมคา"
  SIA_destroy_the_indochinese_ports: "ทําลายทาเรืออินโดจีน"
  SIA_destroy_the_indochinese_ports_desc: "ทาเรือของอินโดจีนคือบานพับที่การทัพใด ๆ ของขาศึกตอเราจะหมุนรอบ เราจะกําหนดใหการทําลายทาเรือเหลานี้เปนภารกิจประจําของกําลังทางอากาศ ไมวาจะดวยการสงเครื่องบินทิ้งระเบิดเขาโจมตีทันทีที่สงครามปะทุ หรือดวยการลอบวางระเบิดไวอยางเงียบเชียบนานกอนกระสุนนัดแรกจะลั่น"
  SIA_destroy_the_indochinese_ports_tt: "ปลดล็อกปฏิบัติการขาวกรอง §Yบอนทําลายทาเรืออินโดจีน§!"
  SIA_destroy_the_indochinese_ports_raid_tt: "ปลดล็อกการโจมตีทางอากาศ §Yจูโจมทาเรืออินโดจีน§!"
  SIA_destroy_the_indochinese_ports_planes_bba_tt: "ไดรับ §YB-17 Flying Fortress§! §Y30§! ลํา และ §YP-38 Lightning§! §Y20§! ลํา เขาคลังยุทโธปกรณแหงชาติ"
  SIA_destroy_the_indochinese_ports_planes_legacy_tt: "ไดรับ §Y$strat_bomber_equipment_1$§! §Y30§! ลํา และ §Y$heavy_fighter_equipment_1$§! §Y20§! ลํา เขาคลังยุทโธปกรณแหงชาติ"
  SIA_accept_a_japanese_technical_mission: "รับคณะผูเชี่ยวชาญทางเทคนิคจากญี่ปุน"
  SIA_accept_a_japanese_technical_mission_desc: "โตเกียวเสนอครูฝก คูมือทางเทคนิค และเครื่องบินที่เราจัดหาไดอยางรวดเร็ว หากเรายอมรับ เราจะไดความรวดเร็ว แตก็จะไดการพึ่งพาตามมาดวย"
  SIA_fighter_type_12_conversion: "การฝกเครื่องบินแบบ 12"
  SIA_fighter_type_12_conversion_desc: "Nakajima Ki-27 หรือเครื่องบินแบบ 12 ของเรา เปนเครื่องบินที่คลองแคลวและใหรางวัลแกนักบินที่บินอยางดุดัน วงรอบการฝกอยางหนักกับเครื่องแบบนี้จะลับคมนักบินของเราและขัดเกลายอดนักบินทุกคนในบัญชี แมความเขมขนเชนนี้จะคงไวตลอดไปไมได"
  SIA_preserve_american_procurement_channels: "รักษาชองทางจัดซื้อจากอเมริกา"
  SIA_preserve_american_procurement_channels_desc: "กําลังทางอากาศของไทยสรางขึ้นจากการจัดซื้ออยางรอบคอบจาก Curtiss และ Vought การรักษาชองทางกับอเมริกาไวคือการรักษาเสนทางสูเครื่องบินที่ดีกวา และลดการพึ่งพาญี่ปุน"
  SIA_free_thai_air_liaison: "การประสานงานทางอากาศของเสรีไทย"
  SIA_free_thai_air_liaison_desc: "กําลังทางอากาศไมไดมีเพียงเครื่องบินบนฟา วิทยุ รายงานสภาพอากาศ สนามบินลับ และนักบินที่ไดรับการชวยเหลือ อาจมีความหมายมากกวาฝูงบินเพิ่มอีกหนึ่งฝูง ขบวนการเสรีไทยจะสรางเครือขายเงียบนี้ขึ้น"
  idea_SIA_kra_air_defense: "การปองกันภัยทางอากาศคอคอดกระ"
  idea_SIA_kra_air_defense_desc: "ที่ตั้งลับตามแนวเทือกเขากลางคาบสมุทรรายงานสภาพอากาศและการพบเห็นผูบุกรุกครั้งแรกทางวิทยุ ฝูงบินของเราจึงขึ้นบินโดยรูวาอะไรรออยูเบื้องหนา"
  idea_SIA_fighter_type_12: "การฝกเครื่องบินแบบ 12"
  idea_SIA_fighter_type_12_desc: "วงรอบการฝกเขมขนกับเครื่องบินแบบ 12 อันคลองแคลว ทําใหนักบินของเราบินไดเฉียบคมที่สุด โดยมียอดนักบินนําหนา แตจังหวะเชนนี้คงไวไดไมตลอดไป"
  SIA_air_cooperation_japan: "ความรวมมือทางอากาศ"
  SIA_air_cooperation_usa: "ความรวมมือทางอากาศ"
  SIA_air_cooperation_france: "ความรวมมือทางอากาศ"
  SIA_free_thai_rescued_airmen: "ใหที่หลบซอนแกนักบินที่ถูกยิงตกของเรา"
  SIA_free_thai_air_network_unlock_tt: "ปลดล็อกการตัดสินใจ §Yเครือขายทางอากาศเสรีไทย§!"
  SIA_reverse_engineer_french_airplanes: "ถอดแบบเครื่องบินฝรั่งเศส"
  SIA_reverse_engineer_french_airplanes_desc: "สนามบินและโรงซอมในอินโดจีนตกอยูในมือเราพรอมเครื่องบินฝรั่งเศสที่สวนใหญยังสมบูรณ วิศวกรของเราจะรื้อมันออกจนถึงหมุดยํ้าตัวสุดทาย และเรียนรูทุกความลับที่ซอนอยู"
  SIA_specialized_airframe_construction: "การสรางโครงเครื่องบินเฉพาะทาง"
  SIA_specialized_airframe_construction_desc: "แทนที่จะไลตามทุกแบบพรอมกัน โรงงานของเราจะเชี่ยวชาญโครงเครื่องบินขับไลเพียงแบบเดียว และสรางมันไดดีกวาใครในภูมิภาค"
  SIA_license_equipment: "ผลิตยุทโธปกรณตามสิทธิบัตร"
  SIA_license_equipment_desc: "เมื่อครองอินโดจีนไดแลว เรายอมเจรจาจากจุดที่เหนือกวา แบบยุทโธปกรณตางประเทศจะถูกผลิตภายใตสิทธิบัตรในโรงงานของเราเอง ดวยตนทุนตํ่าและในปริมาณมาก"
  SIA_controls_all_indochina_tt: "เราควบคุม§Yอินโดจีน§!ทั้งหมด"
  SIA_hawk_iii_max_efficiency_tt: "เพิ่มสายการผลิตที่ประสิทธิภาพสูงสุดที่มีอยู"
  idea_SIA_increase_air_crews: "เพิ่มเจาหนาที่ภาคพื้นอากาศแลว"
  idea_SIA_increase_air_crews_desc: "เจาหนาที่ภาคพื้นที่ขยายเพิ่มชวยใหเครื่องบินของเราขึ้นบินไดตอไป ตองใชกําลังพลเจาหนาที่ภาคพื้นมากขึ้น แตเครื่องบินเชื่อถือไดและมีเกราะดีขึ้น"
  idea_SIA_conserve_air_crews: "ประหยัดเจาหนาที่ภาคพื้นอากาศแลว"
  idea_SIA_conserve_air_crews_desc: "กําลังทางอากาศที่กระชับชวยปลดกําลังพลไปสูแนวหนา ใชกําลังพลเจาหนาที่ภาคพื้นนอยลงและมีประชากรที่เกณฑไดมากขึ้น แลกกับความเชื่อถือไดของเครื่องบิน"
  idea_SIA_specialized_airframe_construction_conserve: "โครงเครื่องบินขับไลเฉพาะทาง"
  idea_SIA_specialized_airframe_construction_conserve_desc: "โรงงานของเราปรับมาเพื่อโครงเครื่องบินขับไลเพียงแบบเดียว ดูแลโดยหนวยภาคพื้นที่กระชับ เครื่องบินคลองตัวขึ้น บินไดไกลขึ้น และสรางไดถูกลง แลกกับความเชื่อถือได สวนชางเครื่องที่เราไมไดจางก็ไปรับใชที่แนวหนาแทน โครงเครื่องบินรุนหลังที่เราไมไดเตรียมการไวจะไดรับผลกระทบ"
  idea_SIA_specialized_airframe_construction_increase: "โครงเครื่องบินขับไลเฉพาะทาง"
  idea_SIA_specialized_airframe_construction_increase_desc: "โรงงานของเราปรับมาเพื่อโครงเครื่องบินขับไลเพียงแบบเดียว และเจาหนาที่ภาคพื้นเต็มอัตราชวยใหมันอยูบนฟาได เครื่องบินคลองตัวขึ้น บินไดไกลขึ้น และสรางไดถูกลง ขณะที่การซอมบํารุงที่ดีขึ้นชวยชดเชยความเปราะบางของแบบที่ถูกเคนถึงขีดสุดเชนนี้ โครงเครื่องบินรุนหลังที่เราไมไดเตรียมการไวจะไดรับผลกระทบ"
  idea_SIA_specialized_airframe_construction_legacy_conserve: "โครงเครื่องบินขับไลเฉพาะทาง"
  idea_SIA_specialized_airframe_construction_legacy_conserve_desc: "โรงงานของเราปรับมาเพื่อโครงเครื่องบินขับไลเพียงแบบเดียว ดูแลโดยหนวยภาคพื้นที่กระชับ เครื่องบินคลองตัวขึ้น บินไดไกลขึ้น และสรางไดถูกลง แลกกับความเชื่อถือได สวนชางเครื่องที่เราไมไดจางก็ไปรับใชที่แนวหนาแทน โครงเครื่องบินรุนหลังที่เราไมไดเตรียมการไวจะไดรับผลกระทบ"
  idea_SIA_specialized_airframe_construction_legacy_increase: "โครงเครื่องบินขับไลเฉพาะทาง"
  idea_SIA_specialized_airframe_construction_legacy_increase_desc: "โรงงานของเราปรับมาเพื่อโครงเครื่องบินขับไลเพียงแบบเดียว และเจาหนาที่ภาคพื้นเต็มอัตราชวยใหมันอยูบนฟาได เครื่องบินคลองตัวขึ้น บินไดไกลขึ้น และสรางไดถูกลง ขณะที่การซอมบํารุงที่ดีขึ้นชวยชดเชยความเปราะบางของแบบที่ถูกเคนถึงขีดสุดเชนนี้ โครงเครื่องบินรุนหลังที่เราไมไดเตรียมการไวจะไดรับผลกระทบ"
  idea_SIA_license_equipment_conserve: "เครือขายการผลิตตามสิทธิบัตร"
  idea_SIA_license_equipment_conserve_desc: "การควบคุมอุตสาหกรรมของอินโดจีนทําใหเราผลิตแบบตางประเทศภายใตสิทธิบัตรไดถูกและเร็วกวาเดิมมาก โดยมีหนวยภาคพื้นที่กระชับคอยดูแล เหลือกําลังพลไวใหกองทัพบก"
  idea_SIA_license_equipment_increase: "เครือขายการผลิตตามสิทธิบัตร"
  idea_SIA_license_equipment_increase_desc: "การควบคุมอุตสาหกรรมของอินโดจีนทําใหเราผลิตแบบตางประเทศภายใตสิทธิบัตรไดถูกและเร็วกวาเดิมมาก และเจาหนาที่ภาคพื้นเต็มอัตราชวยใหเครื่องบินเหลานี้ขึ้นบินไดตอเนื่อง"
  idea_SIA_bomber_procurement_program: "โครงการจัดหาเครื่องบินทิ้งระเบิด"
  idea_SIA_bomber_procurement_program_desc: "สัญญาที่คลองตัวขึ้นและการผลิตภายใตสิทธิบัตรชวยลดตนทุนฝูงเครื่องบินทิ้งระเบิดทางยุทธวิธีของเราลงอยางมาก แตเงื่อนไขอันเปนประโยชนนี้จะคงอยูตราบเทาที่สัญญาปจจุบันยังมีผลเทานั้น"
  SIA_mio_trait_japanese_air_mission_unlock_tt: "ปลดล็อกคุณลักษณะ §Yคณะผูเชี่ยวชาญทางเทคนิคจากญี่ปุน§! ใหแก§Yกรมชางอากาศ§!"
  SIA_mio_trait_american_procurement_unlock_tt: "ปลดล็อกคุณลักษณะ §Yชองทางจัดซื้อจากอเมริกา§! ใหแก§Yกรมชางอากาศ§!"

