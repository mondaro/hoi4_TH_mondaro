  idea_SIA_weather_broadcasts_desc: "การกระจายเสียงพยากรณอากาศเปนประจําชวยใหกําลังทางอากาศและทางเรือของเราเห็นสภาพอากาศไดชัดเจนขึ้น เพิ่มประสิทธิภาพและลดความเสี่ยงในการปฏิบัติการทามกลางสภาพอากาศเลวราย"
  idea_SIA_seri_thai_contacts: "การติดตอกับเสรีไทย"
  idea_SIA_seri_thai_contacts_desc: "การติดตอกับเครือขายขบวนการเสรีไทยพิสูจนคุณคาแลว ทั้งนํานักรบผูชํ่าชองเขามาและกระชับความสัมพันธกับฝายสัมพันธมิตร"
