  INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
  INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
  INSHOL_investments_in_civ_railways_tt: "หาก [HOL.GetFlag]§Y[HOL.GetName]§! ทําแผนยุทธศาสตรสําเร็จ:\n         ([INS.GetFlag]§Y[INS.GetName]§!: เพิ่ม §Y£autonomy_texticon -250.00§!)\n   หาก [INS.GetFlag]§Y[INS.GetName]§! ทําแผนยุทธศาสตรสําเร็จ:\n         เพิ่ม §Y£autonomy_texticon 250.00§!"
  INSHOL_investments_in_civ_railways: "ลงทุนในทางรถไฟพลเรือน"
  INSHOL_investments_in_civ_railways_desc: "การจะชนะใจประชาชนในหมูเกาะอินเดียตะวันออกตองลงทุนในโครงสรางพื้นฐานพลเรือน ปจจุบันทางรถไฟของเราใชขนสงสินคาเปนหลัก เราควรซื้อรถไฟโดยสารมาวิ่งบนทางรถไฟที่มีอยูแลวในชวาและสุมาตรา"
  INSHOL_continue_exclusive_rights: "สิทธิพิเศษแกธนาคารยาวาสเชอ"
  INSHOL_continue_exclusive_rights_desc: "กิลเดอรอินเดียตะวันออกสูญเสียมูลคาไปเกือบหมดในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ และการเติบโตทางเศรษฐกิจของเราก็หยุดชะงัก เราอาจพยายามรักษาเสถียรภาพของกิลเดอรดวยการมอบสิทธิ์ในการพิมพธนบัตรแตเพียงผูเดียวแกธนาคารแหงชวา ซึ่งเคยมีสิทธิ์นี้จนถึงป 1922"
  INSHOL_peg_indies_guilder_to_dutch_guilder: "ผูกคากิลเดอรอินเดียตะวันออกกับกิลเดอรดัตช"
  INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "กิลเดอรอินเดียตะวันออกสูญเสียมูลคาไปเกือบหมดในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ และการเติบโตทางเศรษฐกิจของเราก็หยุดชะงัก ทางออกที่งายที่สุดคือผูกคากิลเดอรอินเดียตะวันออกกับกิลเดอรดัตช ซึ่งเปนสกุลเงินที่มีเสถียรภาพกวามาก สิ่งนี้ยังจะผูกเราไวใกลชิดกับเจาอาณานิคมมากขึ้นดวย"
  INSHOL_peg_indies_guilder_to_us_dollar: "ผูกคากิลเดอรอินเดียตะวันออกกับดอลลารสหรัฐ"
  INSHOL_peg_indies_guilder_to_us_dollar_desc: "กิลเดอรอินเดียตะวันออกสูญเสียมูลคาไปเกือบหมดในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ และการเติบโตทางเศรษฐกิจของเราก็หยุดชะงัก แมเราจะผูกคากิลเดอรอินเดียตะวันออกกับกิลเดอรดัตชได แตดอลลารสหรัฐเปนสกุลเงินที่มีเสถียรภาพกวามาก การผูกคากิลเดอรกับดอลลารยังทําใหเรามีอิสระทางเศรษฐกิจมากขึ้น ทําใหการปกครองตนเองเปนเปาหมายที่บรรลุไดงายขึ้น"
  indonesia_currency_pegged_to_dollar_modifier: "กิลเดอรอินเดียตะวันออกผูกคากับดอลลารสหรัฐแลว"
  INS_direct_rule_tt: "ปลดล็อกกฎหมายการยึดครอง §Y$INS_direct_rule_occupation_law$§! ในรัฐเจาผูครองของอินโดนีเซีย\nผล:\n     §Gเพิ่ม§!โรงงานและทรัพยากรจากรัฐ\n     §Rลด§!การเติบโตของการยอมรับปกครอง\n     §Rเพิ่ม§!การเติบโตของการตอตาน"
  INS_local_autonomy_tt: "ปลดล็อกกฎหมายการยึดครอง §Y$INS_local_autonomy_occupation_law$§! ในรัฐเจาผูครองของอินโดนีเซีย\nผล:\n     ใหโบนัส§Yเล็กนอย§!ในทุกดาน\n     §Gเพิ่ม§!การเติบโตของการยอมรับปกครอง"
  INS_invest_in_batavian_education_req_tt: "ทําภารกิจโฟลกสราดสําเร็จอยางนอย §Y3§! ภารกิจ"
  INS_invest_in_batavian_education_req_2_tt: "ทําภารกิจโฟลกสราดสําเร็จอยางนอย §Y6§! ภารกิจ"
  INSHOL_eventual_autonomy_req_tt: "ทําภารกิจโฟลกสราดสําเร็จอยางนอย §Y4§! ภารกิจ"
  indonesia_volksraad_passed_12: "ธงชาติอินโดนีเซียไดรับการรับรองอยางเปนทางการแลว"
  INS_stronghold_java_tt: "รัฐใดก็ไดของอินโดนีเซีย: ไมถูกยึดครองโดย [ROOT.GetFlag][ROOT.GetNameDefCap]"
  INSHOL_request_east_timor: "เรียกรองใหคืนติมอรตะวันออก"
  INSHOL_request_east_timor_desc: "โปรตุเกสไมมีสิทธิ์ใดที่จะยึดครองติมอร มันเปนเศษซากของประวัติศาสตรอาณานิคมที่เราไมอาจยอมทนไดอีกตอไป เพราะมันเปนดินแดนอันชอบธรรมของอินโดนีเซีย เราจะยื่นขอเรียกรองอยางเปนทางการตอโปรตุเกสใหคืนติมอรแกเราโดยทันที"

  INS_resist_occupation: "ตอตานการยึดครอง"
  INS_resist_occupation_desc: "ความโกรธแคนที่ชาวอินโดนีเซียจํานวนมากมีตอเนเธอรแลนดตองไมทําใหเราพายแพตอลัทธิฟาสซิสต เราตองทําทุกสิ่งที่ทําไดเพื่อตอตานการรุกรานของญี่ปุนและปกปองมาตุภูมิ"
  INS_local_resistance: "การตอตานในทองถิ่น"
  INS_local_resistance_desc: "เราจะจัดตั้งหนวยตอตานในดินแดนที่ยังไมถูกยึดครอง เพื่อใหมั่นใจวาหากดินแดนนั้นถูกยึด เราจะพรอมยึดคืนเมื่อถึงเวลาอันเหมาะสม"
  INS_stronghold_java: "ปอมปราการชวา"
  INS_stronghold_java_desc: "หมูเกาะอินเดียตะวันออกเปนหมูเกาะกวางใหญที่เปนบานของผูคนมากมายและมีภูมิประเทศที่ทุรกันดารอยางยิ่ง การพยายามปกปองทุกเกาะ ทุกผืนปา และทุกภูเขาจากกองทัพที่ใหญกวาเรามากยอมลมเหลวอยางแนนอน แมการทอดทิ้งเพื่อนรวมชาติจะไมใชเรื่องงาย แตการอพยพออกจากทุกเกาะยกเวนชวา เพื่อใหเราวางกําลังกองทัพทั้งหมดไวที่นั่น อาจเปนทางเลือกที่ดีที่สุดสําหรับประเทศชาติโดยรวม"
  INS_silence_nationalists: "ปดปากผูเห็นใจฝายชาตินิยม"
  INS_silence_nationalists_desc: "การรุกรานของญี่ปุนทําใหขบวนการชาตินิยมปฏิวัติเริ่มสนับสนุนผูรุกรานญี่ปุน เพราะมีศัตรูรวมกันคือเนเธอรแลนด ความไรเสถียรภาพที่เกิดจากการรุกรานทําใหขบวนการเหลานี้เติบโตอยางรวดเร็วอยางไมเคยปรากฏมากอน หากเราไมทําอะไรสักอยางตอนนี้ มันอาจเติบโตจนพนการควบคุมของเราโดยสิ้นเชิง"
  INS_east_indies_exile_government: "รัฐบาลพลัดถิ่นหมูเกาะอินเดียตะวันออก"
  INS_east_indies_exile_government_desc: "อนิจจา แมเราจะพยายามอยางเต็มที่ หมูเกาะอินเดียตะวันออกก็ลมสลายแลว อยางไรก็ตาม เรายังไมอาจสิ้นหวังได เราตองทําทุกสิ่งที่ทําไดตอไปดวยทรัพยากรอันจํากัดที่มี เราอาจแพการรบ แตเรายังไมแพสงคราม"
  INS_establish_nefis: "จัดตั้ง NEFIS"
  INS_establish_nefis_desc: "เราจะจัดตั้งหนวยขาวกรองกองกําลังเนเธอรแลนดอินเดียตะวันออกรวมกับฝายสัมพันธมิตร โดยตั้งฐานที่ออสเตรเลีย ผานหนวยงานนี้ เราจะดําเนินปฏิบัติการลับเพื่อบอนทําลายกองกําลังยึดครองของญี่ปุน ทุกชัยชนะเล็ก ๆ จะพาเราเขาใกลการกลับคืนสูมาตุภูมิ"
  INS_evacuate_soldiers_to_australia: "อพยพทหารไปออสเตรเลีย"
  INS_evacuate_soldiers_to_australia_desc: "เราจะสรางฐานทัพใกลฐาน NEFIS ในออสเตรเลียตอนเหนือ ที่นั่นเราจะวางกําลังทหาร KNIL ที่รอดพนจากการถูกจับระหวางการยึดครอง เพื่อใหเราสูตอไปได"
  INS_australian_weapons: "อาวุธจากออสเตรเลีย"
  INS_australian_weapons_desc: "ปฏิบัติการลับไมใชเรื่องงาย และเราตองการยุทโธปกรณที่เหมาะสมเพื่อใหสําเร็จ เราสามารถใหสิทธิ์โรงงานในออสเตรเลียและดัดแปลงใหผลิตอาวุธสําหรับ NEFIS"

  INS_defenders_of_homeland: "ผูพิทักษมาตุภูมิ"
  INS_defenders_of_homeland_tt: "แผนยุทธศาสตรนี้จะเสร็จสิ้นโดยอัตโนมัติหากมีการจัดตั้งผูพิทักษมาตุภูมิ"
  INS_resist_occupation_tt: "แผนยุทธศาสตรนี้จะเสร็จสิ้นโดยอัตโนมัติหากเราถูกรุกรานและไมยอมจํานน"
  INS_defenders_of_homeland_desc: "รัฐบาลหมูเกาะอินเดียตะวันออกลมสลายแลว และระบอบใหมไดเขามาแทนที่ ภายใตการนําของฝายชาตินิยมและรัฐบาลญี่ปุน เราจะสรางกองทัพใหมที่เหนือกวา KNIL และชนะสงคราม อยางไรก็ตาม ไมอาจปฏิเสธไดวาพันธมิตรระหวางฝายชาตินิยมกับฝายจักรวรรดินิยมนี้เปราะบาง พันธมิตรนี้จะยั่งยืน หรือจะจบลงดวยการนองเลือด?"
  INS_embrace_co_prosp_sphere: "โอบรับวงไพบูลยรวมกัน"
  INS_embrace_co_prosp_sphere_desc: "ในที่สุดเราก็ยุติการปกครองของดัตชได และแมเราจะเพียงเปลี่ยนเจาอาณานิคมคนหนึ่งเปนอีกคนหนึ่ง แตคําสัญญาเรื่องความรุงเรืองทางเศรษฐกิจและลัทธิพานเอเชียก็นาดึงดูดใจยิ่งนัก เราจะชวยเหลือการสงครามของญี่ปุนตอไป เพื่อใหมั่นใจวาเนเธอรแลนดจะไมมีวันพยายามกลับมายึดอินโดนีเซียอีก"
  INS_seize_oppurtunity: "ควาโอกาส"
  INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] กําลังพายแพ และรัฐบาลยึดครองของพวกเขาก็ออนแอ เปนครั้งแรกในรอบหลายศตวรรษที่เรามีโอกาสจริง ๆ ที่จะทําลายพันธนาการรอบอินโดนีเซียไปตลอดกาล และสรางชาติที่เปนเอกราช หากเราไมใชโอกาสนี้ประกาศเอกราชตอนนี้ ไมมีใครรูวาจะตองรออีกนานเทาใดกวาจะมีโอกาสครั้งตอไป"
  INS_japanese_resource_infrastructure: "ทุมทุนเพื่อมหาสงคราม"
  INS_japanese_resource_infrastructure_desc: "การมอบอํานาจควบคุมโครงสรางพื้นฐานการสกัดทรัพยากรหลักของเราให [JAP.GetNameDef] เปนขั้นตอนที่จําเปนตอการชนะสงคราม เพราะสิ่งที่สําคัญที่สุดคือหนวย[JAP.GetAdjective]ตองไดรับเสบียงเต็มที่ตลอดเวลา [JAP.GetNameDefCap] จะพัฒนาโครงสรางพื้นฐานทองถิ่นของเราดวย เพื่อเพิ่มประสิทธิภาพการสงออกทรัพยากร"
  INS_japanese_army_training: "ปฏิรูปกองทัพ"
  INS_japanese_army_training_desc: "เรามีอะไรอีกมากที่ตองเรียนรูจากเจาอาณานิคม[JAP.GetAdjective]ของเรา และเมื่อ KNIL ถูกยุบแลว เราควรสรางกองทัพใหมที่ฝกโดยกองทัพบกจักรวรรดิญี่ปุน พรอมปกปองอินโดนีเซียจากภัยคุกคามภายนอก"

  INS_governor_general_de_jonge: "ผูสําเร็จราชการเดอ ยองเงอ"
  INS_governor_general_de_jonge_desc: "โบนีฟาซีอุส กอรเนลิส เดอ ยองเงอ ขึ้นชื่อเรื่องการปกครองดวยกําปนเหล็ก ตอตานลัทธิชาตินิยมทุกรูปแบบ และมักเพิกเฉยตอความตองการของโฟลกสราด การปกครองหมูเกาะอินเดียตะวันออกของเขายาวนานมาก และประสบการณของเขายอนไปถึงมหาสงครามที่เขาดํารงตําแหนงรัฐมนตรีวาการกระทรวงกลาโหมของหมูเกาะอินเดียตะวันออก"
  INS_governor_general_tjarda: "ผูสําเร็จราชการชารดา"
  INS_tjarda_explain_tt: "วาระของ§Yโบนีฟาซีอุส กอรเนลิส เดอ ยองเงอ§!สิ้นสุดลงแลว และ§Yอาลีดีอุส ชารดา ฟน สตารเคินบอรค สตาเคาเวอร§!ไดรับเลือกเปนผูสําเร็จราชการคนใหมในเดือนกันยายน 1936"
  INS_governor_general_tjarda_desc: "อาลีดีอุส ชารดา ฟน สตารเคินบอรค สตาเคาเวอร มีวิสัยทัศนตอหมูเกาะอินเดียตะวันออกตางจากผูดํารงตําแหนงกอนหนาเล็กนอย แมเขาจะยังตอตานลัทธิชาตินิยม แตก็มีนโยบายเสรีนิยมกวาเล็กนอย และเต็มใจรับฟงความตองการของโฟลกสราดมากกวา"
  INS_electrical_investments: "การลงทุนดานไฟฟา"
  INS_electrical_investments_desc: "ทุกชาติอุตสาหกรรมในยุโรปมีโครงขายไฟฟาที่แข็งแกรงรองรับอุตสาหกรรม หากเราตองการเลิกพึ่งพาการสงออกวัตถุดิบและสรางอุตสาหกรรมการผลิตของเราเองเหมือนพวกเขา เราควรสรางโครงขายไฟฟาขนาดใหญที่ครอบคลุมทั่วทั้งชวา"
  INS_reduce_land_taxes: "ลดภาษีที่ดิน"
  INS_reduce_land_taxes_desc: "ภาษีที่สูงตอการถือครองที่ดินทําใหชาวอินโดนีเซียพื้นเมืองเปนเจาของสวนเกษตรและธุรกิจไดยาก แมสิ่งนี้จะทําใหเราผูกขาดอุตสาหกรรมยางไดงาย แตก็กอปญหาทางเศรษฐกิจทั่วประเทศ เราควรพิจารณาลดภาษีเหลานี้กลับสูอัตราเดิม เพื่อใหสวนยางขนาดเล็กของเอกชนสามารถดําเนินกิจการได"
  INS_invest_in_batavian_education: "ลงทุนในการศึกษาของบาตาเวีย"
  INS_invest_in_batavian_education_desc: "โฟลกสราดแสดงใหเห็นชัดแลววาเจตจํานงของชาวอินโดนีเซียคือตองการใหการศึกษาเขาถึงไดงายขึ้น เพราะปจจุบันผูที่มีกําลังจายสวนใหญคือชาวดัตชอินโดนีเซียและชนชั้นนําอินโดนีเซียกลุมเล็ก ๆ เพื่อใหเปนไปตามญัตติของโฟลกสราด เราควรสรางโรงเรียนประถมและมัธยมหลายแหงในและรอบบาตาเวีย"
  INS_javanese_education_investments: "การลงทุนดานการศึกษาในชวา"
  INS_javanese_education_investments_desc: "นอกเหนือจากโครงการสรางโรงเรียนประถมและมัธยมที่ดําเนินอยู เราอาจสรางวิทยาลัยชุมชนและโรงเรียนอาชีวะเฉพาะทาง ซึ่งจะทําใหครอบครัวชนชั้นกลางเขาถึงการศึกษาขั้นสูงไดงายขึ้นมาก"

  INS_allow_local_autonomy: "อนุญาตใหปกครองตนเองในทองถิ่น"
  INS_allow_local_autonomy_desc: "ระบบฟอรสเตินลันเดินที่ใหรัฐเจาผูครองปกครองตนเองไดทําใหการจัดการขบวนการชาตินิยมงายขึ้นมาก และเพิ่มเสถียรภาพของประเทศโดยรวม เราควรเพิ่มระดับอํานาจปกครองตนเองใหรัฐเจาผูครองมากยิ่งขึ้น เพื่อใหรัฐบาลมุงความสนใจไปที่เรื่องที่สําคัญกวา"
  INS_direct_rule: "การปกครองโดยตรง"
  INS_direct_rule_desc: "ระบบฟอรสเตินลันเดินที่ใหรัฐเจาผูครองปกครองตนเองไดเพิ่มความยุงยากในการบริหาร ตองใชระบบราชการเพิ่มเติมและเสียเวลา ถึงเวลาแลวที่จะยกเลิกระบบนี้ทั้งหมดและบังคับใชการปกครองโดยตรงทั่วทั้งหมูเกาะ"

  INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§! ถูกผลักถอยกลับไป และควบคุมรัฐนอยกวา §Y[?var:temp_states_plus_more]§! รัฐ (ปจจุบัน: §Y[?var:JAP.num_controlled_states]§!)"
  INS_seize_oppurtunity_refuse_warn_tt: "§Rการปฏิวัติแหงชาติจะเริ่มขึ้น ซึ่งอาจนําไปสูสงครามกับ [HOL.GetNameDef]§!"

  INS_economic_stabilization: "การรักษาเสถียรภาพทางเศรษฐกิจ"
  INS_economic_stabilization_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญและนโยบายกีดกันการคาทั่วโลกทําใหเศรษฐกิจของเรางอยเปลี้ย และชาวอินโดนีเซียจํานวนมากที่เคยทํางานในอุตสาหกรรมวัตถุดิบก็ตกงาน เราตองใชมาตรการเด็ดขาดและจัดตั้งโครงการแรงงานที่จะจัดหางานใหพลเมืองที่ไมมีงานทํา"
  INS_restore_order_in_indies: "ฟนฟูความสงบเรียบรอยในหมูเกาะ"
  INS_restore_order_in_indies_desc: "ขบวนการชาตินิยมที่กําลังกอตัวในหมูเกาะอินเดียตะวันออกไดทําใหหลายภูมิภาคไรเสถียรภาพ และอาจลุกลามจนควบคุมไมไดหากเราไมหยุดยั้ง เราตองใหการฟนฟูความสงบเรียบรอยและเสถียรภาพเปนลําดับความสําคัญสูงสุด"
  INS_detangle_supply_chains: "คลี่คลายหวงโซอุปทาน"
  INS_detangle_supply_chains_desc: "เศรษฐกิจสงออกของเราทําใหสินคาตองผานพอคาคนกลางหลายสิบทอดกวาจะถึงปลายทาง แตละทอดลวนตองจายคาธรรมเนียม ภาษี หรือขออางอื่นใดใหพวกเขาไดหักสวนแบงไป เราควรคลี่คลายความยุงเหยิงนี้และควบคุมหวงโซอุปทานสวนใหญโดยตรง"
  INS_prioritize_industrial_growth: "ใหความสําคัญกับการเติบโตทางอุตสาหกรรม"
  INS_prioritize_industrial_growth_desc: "เศรษฐกิจสงออกของเราผันผวนเกินไปและทําใหเราตองพึ่งพาความรวมมือจากดัตช เราควรสรางอุตสาหกรรมการผลิตดวยการสรางโรงงานทั่วบาตาเวีย เราอาจกลายเปนประเทศที่มีอุตสาหกรรมมากที่สุดในแปซิฟก"
  INS_closer_economic_ties_to_netherlands: "กระชับความสัมพันธทางเศรษฐกิจกับเนเธอรแลนด"
  INS_closer_economic_ties_to_netherlands_desc: "เรามีอะไรอีกมากที่ตองเรียนรูจากเจาอาณานิคม โดยเฉพาะดานเศรษฐกิจ หากเราผนวกเศรษฐกิจสงออกของเราเขากับเนเธอรแลนดมากขึ้น เราจะสามารถใชโครงสรางพื้นฐานและเสนสายของพวกเขาเพื่อใหไดขอตกลงการคาที่ทํากําไรมากขึ้น"

  INS_prioritize_dutch_companies: "ใหความสําคัญกับบริษัทดัตช"
  INS_prioritize_dutch_companies_desc: "บริษัทดัตชอยาง Shell และ Fokker เปนกระดูกสันหลังของเศรษฐกิจเรามาหลายศตวรรษแลว โดยการสงออกวัตถุดิบของเราผูกพันกับ Shell อยางแนนแฟน สิ่งนี้นําความมั่งคั่งมหาศาลมาสูหมูเกาะอินเดียตะวันออก และเราควรใหความสําคัญกับพวกเขาเหนือธุรกิจทองถิ่นขนาดเล็ก เพื่อใหความรวมมือของเรายังคงแข็งแกรง"

  INSHOL_java_factories: "เปดโรงงานอาวุธในชวา"
  INSHOL_java_factories_desc: "แมจะเปนเรื่องพื้นฐาน แตไมอาจปฏิเสธไดวาการสรางโรงงานอาวุธเพิ่มขึ้นชวยเพิ่มความแข็งแกรงของกองทัพไดมาก ในฐานะศูนยกลางอุตสาหกรรมของอาณานิคม ชวาจึงเปนทําเลที่ชัดเจนในการสรางโรงงานเหลานี้"
  INSHOL_license_dutch_weapon_blueprints: "ซื้อสิทธิ์พิมพเขียวอาวุธดัตช"
  INSHOL_license_dutch_weapon_blueprints_desc: "แทนที่จะลงทุนสรางกระบวนการผลิตภายในประเทศทั้งหมดและออกแบบเทคโนโลยีของเราเอง เราควรรวมมือกับบริษัทดัตชเพื่อซื้อพิมพเขียวอาวุธของพวกเขา"
  INSHOL_bangka_production_lines: "สายการผลิตบังกา"
  INSHOL_bangka_production_lines_desc: "การพัฒนาโครงสรางพื้นฐานของบังกาแบบกาวกระโดดอันเปนผลจากโครงการบังกา ไดเปลี่ยนเกาะเล็ก ๆ ที่เคยแทบไมมีความสําคัญนี้ใหกลายเปนทําเลที่สมบูรณแบบสําหรับโครงการอุตสาหกรรมใหม เรามีโอกาสเสริมความแข็งแกรงให KNIL ดวยการสรางโรงงานอาวุธแหงใหมในบังกา ซึ่งดวยถนน ทางรถไฟ และทาเรือที่หนาแนนของเกาะ จะทํางานไดมีประสิทธิภาพกวาการสรางที่อื่น"
  INSHOL_artillerie_inrichtingen: "อารทิลเลอรี อินริชทิงเงิน"
  INSHOL_artillerie_inrichtingen_desc: "อารทิลเลอรี อินริชทิงเงิน ผลิตปนใหญและอาวุธอื่น ๆ ในเนเธอรแลนดมากวา 250 ป และดําเนินกิจการในหมูเกาะอินเดียตะวันออกมาหลายทศวรรษ การขยายขีดความสามารถการผลิตดวยการเปดโรงงานใหมในหมูเกาะจะยกระดับขีดความสามารถของ KNIL อยางมาก พรอมทั้งเสริมเศรษฐกิจของพื้นที่ที่ขาดงบประมาณดวยการสรางงานใหม"
  INSHOL_ai_pyrotechnische: "อารทิลเลอรี อินริชทิงเงิน ไพโรเทคนิสเชอ"
  INSHOL_ai_pyrotechnische_desc: "เพื่อขยายโรงงานผลิตของอารทิลเลอรี อินริชทิงเงิน ในหมูเกาะอินเดียตะวันออกตอไป เราควรสนับสนุนงบประมาณจัดตั้งแผนกหมูเกาะอินเดียตะวันออกของบริษัทในเครือดานดอกไมเพลิงและวัตถุระเบิดของอารทิลเลอรี อินริชทิงเงิน"
  INSHOL_bio_pharma: "ไบโอฟารมา"
  INSHOL_bio_pharma_desc: "การขยายอุตสาหกรรมยาในหมูเกาะอินเดียตะวันออกเปนขั้นตอไปที่ชัดเจนในการปฏิรูป KNIL เพื่อใหทหารที่บาดเจ็บไดรับการรักษาอยางเพียงพอและฟนตัวอยางปลอดภัย การที่ควินินมีอยูมากในหมูเกาะทําใหตนทุนของโครงการนี้ตํ่ากวาปกติอยางมาก"
  INSHOL_develop_fighters: "พัฒนาเครื่องบินขับไลรุนใหม"
  INSHOL_develop_fighters_desc: "เราจะสงวิศวกรจากบาตาเวียไปอัมสเตอรดัมเพื่อศึกษาการผลิตเครื่องบินขับไลของ Fokker โดยตรง และเขาถึงความลับการผลิตที่ถูกปกปดอยางเขมงวด พวกเขาจะกลับมาพรอมความรูและความเชี่ยวชาญทางเทคนิคที่จําเปนตอการสรางอุตสาหกรรมเครื่องบินขับไลสมัยใหมภายในหมูเกาะอินเดียตะวันออก"
  INSHOL_develop_bombers: "พัฒนาเครื่องบินทิ้งระเบิดรุนใหม"
  INSHOL_develop_bombers_desc: "เราจะสงวิศวกรจากบาตาเวียไปอัมสเตอรดัมเพื่อศึกษาการผลิตเครื่องบินทิ้งระเบิดของ Fokker โดยตรง และเขาถึงความลับการผลิตที่ถูกปกปดอยางเขมงวด พวกเขาจะกลับมาพรอมความรูและความเชี่ยวชาญทางเทคนิคที่จําเปนตอการสรางอุตสาหกรรมเครื่องบินทิ้งระเบิดสมัยใหมภายในหมูเกาะอินเดียตะวันออก"
  INSHOL_bandung_aircraft_facility: "โรงงานผลิตอากาศยานบันดุง"
  INSHOL_bandung_aircraft_facility_desc: "แมพิมพเขียวและความลับการผลิตจะมีประโยชน แตก็ไรคาจนกวาเราจะสรางเครื่องบินจากมัน เราจะเปดโรงงานอากาศยานแหงใหมในบันดุงเพื่อตอบสนองความตองการในปจจุบันของ ML-KNIL"
  INSHOL_netherlands_indies_air_doctrine: "หลักนิยมทางอากาศเนเธอรแลนด-อินเดียตะวันออก"
  INSHOL_netherlands_indies_air_doctrine_desc: "เราจะศึกษากองทัพอากาศของชาติที่เผชิญความทาทายคลายกับเรา โดยใชประสบการณที่พวกเขาไดมาอยางยากลําบากมาหลอหลอมหลักนิยมที่เหมาะกับสภาพความเปนจริงของหมูเกาะอินเดียตะวันออก โดยไมซํ้ารอยความผิดพลาดในประวัติศาสตรเหลานั้น"
  INSHOL_manado_military_academy: "โรงเรียนนายรอยมากัสซาร"
  INSHOL_manado_military_academy_desc: "การจัดตั้งโรงเรียนนายรอยนอกชวาจะชวยบรรเทาปญหาขาดแคลนกําลังพลไดอยางมาก ดวยการทําใหการเกณฑทหารในหมูเกาะทางตะวันออกเปนไปได มากัสซารซึ่งตั้งอยูราวกึ่งกลางหมูเกาะอินเดียตะวันออกคือทําเลที่สมบูรณแบบ"
  INSHOL_infantry_training_in_borneo: "การฝกทหารราบในบอรเนียว"
  INSHOL_infantry_training_in_borneo_desc: "หมูเกาะอินเดียตะวันออกโดดเดนดวยปาดิบทึบ ภูเขาขรุขระ และภูมิประเทศที่โหดราย ทหารของเราซึ่งสวนใหญประจําอยูในชวาไมพรอมเลยที่จะรบในสภาพเชนนี้ เราตองขยายการฝกทหารออกนอกชวาและฝกซอมในสภาพแวดลอมที่โหดรายกวา มีไมกี่แหงบนโลกที่เทียบไดกับปาและภูเขาของบอรเนียว ทําใหที่นี่เปนจุดที่สมบูรณแบบในการฝกหนวยจูโจมพิเศษระดับโลก"
  INSHOL_knil_engineers: "กองทหารชาง"
  INSHOL_knil_engineers_desc: "เราตองไมทุมความพยายามทั้งหมดไปที่ทหารราบและการผลิตปนเล็กยาว และตองจําไววาการสงกําลังบํารุงและการสื่อสารมีบทบาทสําคัญตอการชนะศึก เราควรฝกทหารชางและสนับสนุนงบประมาณโรงเรียนอาชีวะในบาตาเวีย เพื่อใหกองทัพของเราไมติดขัดเพราะการสงกําลังบํารุงที่ยํ่าแย"
  INSHOL_work_with_oil_barons: "รวมมือกับเจาพอนํ้ามัน"
  INSHOL_work_with_oil_barons_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญทําใหเศรษฐกิจที่พึ่งพาการสงออกของเราตกอยูในสภาพนาหดหู อาจถึงเวลาพิจารณาโอนการเจรจาการคาบางสวนใหเจาพอนํ้ามันแหงสุมาตรา เพื่อรับประกันวานํ้ามันจะขายได อยางไรก็ตาม สิ่งนี้มีตนทุน เพราะการจะใหพวกเขายอมรับขอตกลงนี้ เราตองขายนํ้ามันในราคาตํ่ากวาราคาตลาดอยางมาก"
  INSHOL_rubber_taxation: "การเก็บภาษียาง"
  INSHOL_rubber_taxation_desc: "การลงทุนและความเชี่ยวชาญของดัตชไดเปลี่ยนสวนยางในหมูเกาะอินเดียตะวันออกใหเปนหนึ่งในทรัพยสินที่มีคาที่สุดของจักรวรรดิ จึงเปนการยุติธรรมที่ราชบัลลังกจะเรียกรองสวนแบงอันชอบธรรมจากความมั่งคั่งที่ตนสรางขึ้น แมนักการเมืองทองถิ่นบางคนจะประทวง แตผลประโยชนของจักรวรรดิไมอาจถูกกําหนดโดยการปลุกปนของคนในจังหวัด"
  INSHOL_padang_port: "ทาเรือนานาชาติปาดัง"
  INSHOL_padang_port_desc: "ทรัพยากรที่ผลิตในปาดังตองสงผานชวากอนจะไปถึงตลาดนานาชาติ เพราะภูมิภาคนี้ขาดสิ่งอํานวยความสะดวกที่รองรับขบวนเรือลําเลียงขนาดใหญได การออมเสนทางที่ไมจําเปนนี้สรางภาระใหหวงโซอุปทานและจํากัดศักยภาพทางเศรษฐกิจของสุมาตรา การสรางทาเรือสินคาขนาดใหญในปาดังจะชวยใหเราตัดเสนทางออมนี้ออก และเพิ่มผลกําไรของสวนเกษตรในปาดัง"
  INSHOL_subsidize_bauxite: "อุดหนุนโครงการบอกไซต"
  INSHOL_subsidize_bauxite_desc: "โครงการที่ดําเนินอยูในหมูเกาะอินเดียตะวันออกเพื่อพัฒนาหมูเกาะบังกา-เบลีตุงที่อุดมดวยบอกไซตใหทันสมัยนั้นมีอนาคตสดใส และมีศักยภาพทํากําไรระยะยาวสูง เราควรสนับสนุนรัฐบาลหมูเกาะดวยเงินอุดหนุนทางเศรษฐกิจเพื่อเรงโครงการ"
  INSHOL_agricultural_subsidies: "แปรรูปภาคเกษตรใหเอกชน"
  INSHOL_agricultural_subsidies_desc: "การอนุญาตใหจัดตั้งฟารมเอกชนหลากหลายขนาด จะชวยเรงการพัฒนาโครงสรางพื้นฐานในพื้นที่ชนบทที่ขาดงบประมาณ ขณะเดียวกันก็เพิ่มรายไดของรัฐบาล เพื่อใหบรรลุผลนี้ เราจะวางกรอบภาษีที่เปนระบบ โดยรายไดภาษีทั้งหมดจากฟารมเหลานี้จะสงตรงไปยังเนเธอรแลนด แทนที่จะผานหมูเกาะอินเดียตะวันออกกอน"
  INSHOL_import_sugar: "นําเขานํ้าตาล"
  INSHOL_import_sugar_desc: "เราจะบังคับใชการควบคุมราคาในภาคเกษตรที่กําลังเติบโตในหมูเกาะอินเดียตะวันออก เพื่อนําเขานํ้าตาลทั้งหมดของประเทศจากสวนเกษตรในหมูเกาะ ในราคาที่ไมมีรัฐบาลอื่นใดเทียบได และสถาปนาการผูกขาดนํ้าตาลโดยรัฐ"
  INSHOL_import_lumber: "นําเขาไมซุง"
  INSHOL_import_lumber_desc: "เราจะบังคับใชการควบคุมราคาในภาคเกษตรที่กําลังเติบโตในหมูเกาะอินเดียตะวันออก เพื่อนําเขาไมซุงทั้งหมดของประเทศจากสวนปาในหมูเกาะ ในราคาที่ไมมีรัฐบาลอื่นใดเทียบได และสถาปนาการผูกขาดไมซุงโดยรัฐ"
  INSHOL_industrialized_colony: "อาณานิคมอุตสาหกรรม"
  INS_no_peta_tt: "อินโดนีเซียจะไมสามารถรวมมือกับผูรุกรานตางชาติได"
  INSHOL_industrialized_colony_desc: "หมูเกาะอินเดียตะวันออก ซึ่งครั้งหนึ่งเคยเปนอาณานิคมเล็ก ๆ ไดกลายเปนหนึ่งในภูมิภาคที่มีอุตสาหกรรมมากที่สุดและมั่งคั่งที่สุดในเอเชีย นี่คือชวงเวลาสําคัญยิ่งในประวัติศาสตรของเนเธอรแลนดและของมนุษยชาติ ความพยายามของเราไดผลแลว และเราจะลงทุนในการพัฒนาอาณานิคมตอไป และสถาปนาเนเธอรแลนดใหเปนมหาอํานาจโลกอีกครั้ง"
  INSHOL_economic_integration: "การบูรณาการทางเศรษฐกิจ"
  INSHOL_economic_integration_desc: "หมูเกาะอินเดียตะวันออกของดัตชคือเพชรเม็ดงามแหงจักรวรรดิของเรา ความรุงเรืองไดรับการคํ้าประกันผานการนําอันมั่นคงของสมเด็จพระราชินี นายกรัฐมนตรี และผูสําเร็จราชการ เสถียรภาพนี้ตองไมถูกคุกคามดวยการเรียกรองเอกราชอยางไรความยั้งคิด ซึ่งจะนํามาแตความวุนวายและความเสื่อมถอย เราจะผูกเศรษฐกิจของเนเธอรแลนดและหมูเกาะอินเดียตะวันออกใหแนนแฟนยิ่งขึ้น เพื่อรักษาเสถียรภาพและความยิ่งใหญตอไป"

  INSHOL_republic_of_indonesia: "สาธารณรัฐอินโดนีเซีย"
  INSHOL_republic_of_indonesia_desc: "เมื่อเนเธอรแลนดยอมรับคํารองของซูตารจโจอยางไมเต็มใจ กฎหมายที่ตามมาไดผูกเอกราชของอินโดนีเซียไวกับเงื่อนไขยืดยาวที่ตองผานเพื่อใหถือวาพึ่งพาตนเองไดทางเศรษฐกิจ ถึงกระนั้น บัดนี้เงื่อนไขเหลานี้ไดรับการบรรลุอยางครบถวนแลว ดวยความมุงมั่นของชาวอินโดนีเซีย และเนเธอรแลนดก็ไมมีทางเลือกนอกจากยอมรับการประกาศเอกราชอยางเปนทางการของเรา"
  INSHOL_propose_malay_unification: "เสนอการรวมชาติมลายู"
  INSHOL_propose_malay_unification_desc: "อินโดนีเซียเปนหมูเกาะที่เปนบานของวัฒนธรรม ภาษา และชาติพันธุนับรอย บางกลุมคลายคลึงกัน บางกลุมแตกตางกันอยางชัดเจน แตผานการตอสูรวมกันภายใตการปกครองอาณานิคม เราไดพบเอกภาพภายใตชาติเดียว คืออินโดนีเซีย บางทีเราควรถามตัวเองวาเหตุใดเอกภาพนี้จึงตองหยุดอยูแคนี้ ในเมื่อฝงตรงขามชองแคบ ประชาชนแหงมลายามีประวัติศาสตรและความใฝฝนแทบเหมือนกับเรา?"
  INSHOL_singapore_compromise: "การประนีประนอมเรื่องสิงคโปร"
  INSHOL_singapore_compromise_desc: "สิงคโปรเปนดินแดนอินโดนีเซียทั้งในทางประวัติศาสตรและวัฒนธรรม และเปนเรื่องธรรมดาที่ควรรวมอยูในอินโดนีเซียที่เปนเอกภาพ แตอังกฤษไมยอมสละสิงคโปรเพราะความสําคัญเชิงยุทธศาสตรและความจําเปนในฐานะฐานทัพ เราควรเสนอการประนีประนอมใหสิงคโปรเขารวมสหภาพ โดยมีเงื่อนไขวาอังกฤษยังคงมีสิทธิ์วางกําลังบนเกาะ"
  INSHOL_request_ceylon: "ขอใหโอนซีลอน"
  INSHOL_request_ceylon_desc: "อาณานิคมซีลอนของอังกฤษมีความผูกพันทางวัฒนธรรมและภาษาอยางลึกซึ้งกับโลกมลายูในวงกวาง เมื่อสหพันธพานมลายูแหงมาฟลินโดเติบโตขึ้น จึงเปนเรื่องธรรมดาที่เกาะนี้ก็ควรมีที่ทางในสมาพันธรัฐดวย"
  INSHOL_papua_referendum: "การลงประชามติปาปว"
  INSHOL_papua_referendum_desc: "ทุกวันนี้เกาะปาปวถูกแบงระหวางอินโดนีเซียกับออสเตรเลีย แมการลงทุนและการพัฒนาของเราจะเปลี่ยนครึ่งเกาะของเราใหเปนภูมิภาคที่เติบโตและรุงเรือง แตดินแดนที่ออสเตรเลียปกครองยังคงถูกละเลยและดอยพัฒนา อนาคตของเกาะควรอยูในมือของประชาชน ดังนั้นเราตองเรียกรองใหมีการลงประชามติอยางเปนทางการเรื่องการรวมปาปว"
  INSHOL_invite_phillipines: "เสนอมาฟลินโด"
  INSHOL_invite_phillipines_desc: "ผูคนมากมายในสหภาพของเราพูดภาษาตางกันและยึดถือขนบธรรมเนียมตางกัน แตเกือบทั้งหมดสืบรากเหงาไปถึงโลกมลายู เราควรปฏิรูปรัฐสหภาพของเราเปนสมาพันธรัฐพานมลายู และเชิญฟลิปปนสเขาเปนรัฐสมาชิก สิ่งที่เคยเปนอาณานิคมเล็ก ๆ ไรความสําคัญหลายแหง จะยืนหยัดอยางแข็งแกรงในฐานะมหาอํานาจระดับภูมิภาคของเอเชียตะวันออกเฉียงใต"

  INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! จะลดเวลาที่ตองใชสําหรับแผนยุทธศาสตรนี้ลง 70 วัน"
  INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! จะลดเวลาที่ตองใชสําหรับแผนยุทธศาสตรนี้ลง 70 วัน"
  INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! จะลดเวลาที่ตองใชสําหรับแผนยุทธศาสตรนี้ลง 35 วัน"
  INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§! จะลดเวลาที่ตองใชสําหรับแผนยุทธศาสตรนี้ลง 35 วัน"
  INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§! จะลดเวลาที่ตองใชสําหรับแผนยุทธศาสตรนี้ลง 35 วัน"

