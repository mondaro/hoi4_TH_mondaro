  the_thunder_at_our_gates_artillery: "ฟาคํารามหนาประตูเมือง"
  SIA_siamese_tankettes: "รถถังขนาดเล็กของสยาม"
  SIA_siamese_tankettes_desc: "กองทัพบกของเราคุนเคยกับรถถังขนาดเล็กที่มีอยูมากขึ้นแลว ทําใหรถเหลานี้เชื่อถือไดมากขึ้นและลดคาใชจายในการคงไวในสนามรบ"

  #Ideas
  idea_SIA_the_army_of_siam: "กองทัพสยาม"
  idea_SIA_the_army_of_siam_tt: "ปรับเปลี่ยน §Y$idea_SIA_the_army_of_siam$§!:"
  idea_SIA_the_thunder_at_our_gates: "อัสนีบาตที่ประตูเมือง"
  idea_SIA_yielded_the_air_war: "ยอมสละสงครามทางอากาศ"
  idea_SIA_yielded_the_air_war_desc: "เมื่อยอมเสียการควบคุมนานฟาไปแลว ทรัพยากรจึงถูกโยกไปใชกับการปองกันภัยทางอากาศ แทนที่จะชวงชิงความเหนือกวาทางอากาศโดยตรง"
  idea_SIA_steel_arteries: "เสนเลือดเหล็กกลา"
  idea_SIA_unconventional_tank_construction: "การสรางรถถังนอกแบบแผน"
  idea_SIA_short_war: "การวางแผนสงครามระยะสั้น"
  idea_SIA_short_war_temp_buff: "ความฮึกเหิมในสงครามระยะสั้น"
  idea_SIA_short_war_temp_debuff: "ความออนลาจากสงครามระยะสั้น"
  SIA_no_supply_grace_tt: " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ ชั่วโมง"
  idea_SIA_standing_our_ground_mission_temp_buff: "ยืนหยัดไมถอย"
  idea_SIA_german_tank_studies: "การศึกษารถถังเยอรมัน"
  idea_SIA_german_tank_studies_desc: "นายทหารของเราไดใชเวลาศึกษาหลักนิยมและการออกแบบยานเกราะของตางชาติ แลวนําความรูทางเทคนิคกลับมาใชพัฒนากําลังยานเกราะของเราเองโดยตรง"
  idea_SIA_american_tank_studies: "การศึกษารถถังอเมริกัน"
  idea_SIA_american_tank_studies_desc: "$idea_SIA_german_tank_studies_desc$"
  idea_SIA_british_tank_studies: "การศึกษารถถังอังกฤษ"
