  ################
  SIA_the_khana_ratsadon: "คณะราษฎร"
  SIA_the_khana_ratsadon_desc: "คณะราษฎรไดยุติระบอบสมบูรณาญาสิทธิราชยและเปดทางสูการปกครองตามรัฐธรรมนูญ มรดกของคณะราษฎรถูกชวงชิง ถูกทรยศ และเปอนเลือด แตยังคงเปนรากฐานที่จะใชสราง[SIA.GetName]สมัยใหมได"
  SIA_the_khana_ratsadon_tt: "\n§Yคณะราษฎร§!เริ่มมีบทบาท\n\n§Yคณะราษฎร§!เปนพรรคชั้นนําใน[ROOT.GetName] ซึ่งแบงออกเปน§Yสายทหาร§!และ§Yสายพลเรือน§!\n\n§Yสายพลเรือน§!โดยทั่วไปชื่นชอบนโยบายที่สนับสนุนประชาธิปไตยและเนนอุตสาหกรรมพลเรือน ขณะที่§Yสายทหาร§!โดยทั่วไปชื่นชอบนโยบายที่โนมเอียงไปทางฟาสซิสตและการแปรอุตสาหกรรมใหเปนอุตสาหกรรมทหาร\n\nการตัดสินใจของเราจะทําใหพวกเขาชื่นชอบเรามากขึ้นหรือนอยลง ซึ่งใหผลดีหรือผลเสียที่แตกตางกัน\nหากพวกเขากลายเปนกบฏ พวกเขาอาจพยายามกอรัฐประหาร\n\nระดับการสนับสนุนแบงเปน §Yกระดางกระเดื่อง§!, §Yฝายคาน§!, §Yเปนกลาง§!, §Yสนับสนุนเล็กนอย§! และ§Yสนับสนุนเต็มที่§!"
  SIA_shuffle_pridi_to_the_minister_of_interior: "เสริมสถานะของสายพลเรือน"
  SIA_shuffle_pridi_to_the_minister_of_interior_desc: "การโยกยายปรีดีไปดํารงตําแหนงรัฐมนตรีวาการกระทรวงมหาดไทยแทนรัฐมนตรีวาการกระทรวงการตางประเทศ จะทําใหเขาควบคุมการจัดสรรทรัพยากรของรัฐบาลไดอยางมีประสิทธิภาพยิ่งขึ้น และทําหนาที่เปนหามลอตานอิทธิพลของฝายทหารที่กําลังรุกคืบเขามา"
  SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! จะเพิ่มความพึงพอใจของ§Yสายพลเรือน§! และลดความพึงพอใจของ§Yสายทหาร§!"
  SIA_civil_nationalism: "ชาตินิยมพลเมือง"
  SIA_civil_nationalism_desc: "คนไทยทุกคนไมวาจะมีฐานะใด พึงรูวาความภักดีของตนไมควรมอบใหแกรัฐบาลใดหรือบุคคลใดเพียงผูเดียว หากแตควรยึดมั่นในคุณคาแหงเสรีภาพ อิสรภาพ และความเสมอภาค ไมวาใครจะครองบัลลังกแหงอํานาจอยูในขณะนั้นก็ตาม"
  SIA_the_true_heirs_of_1932: "ทายาทที่แทจริงแหง 2475"
  SIA_the_true_heirs_of_1932_desc: "ฝายทหารชอบนําเสนอการปฏิวัติ 2475 วาเปนผลงานของพวกตนแตฝายเดียว โดยปดทิ้งขอเท็จจริงที่วานั่นคือชัยชนะของประชาชน เพียงแคเตือนใหประชาชนระลึกถึงขอเท็จจริงนี้ เราก็จะไดพลังจากพวกเขา"
  SIA_thammasat_university: "มหาวิทยาลัยธรรมศาสตร"
  SIA_thammasat_university_desc: "มหาวิทยาลัยวิชาธรรมศาสตรและการเมืองซึ่งเพิ่งกอตั้งขึ้นใหม สามารถและสมควรไดรับการขยายใหใหญขึ้น เพื่อปูทางสูยุคใหมแหงนวัตกรรมของไทย"
  SIA_defenders_of_constitutional_liberty: "ผูพิทักษเสรีภาพตามรัฐธรรมนูญ"
  SIA_defenders_of_constitutional_liberty_desc: "ครู นายธนาคาร พยาบาล ชนชั้นกลางผูมีการศึกษาสามารถถูกปลุกเราและระดมพลังเพื่อปกปองเสรีภาพ หากสายทหารทําเกินเลยไป"
  SIA_dominate_public_symbols: "ครองสัญลักษณสาธารณะ"
  SIA_dominate_public_symbols_desc: "สายทหารครองสัญลักษณสาธารณะมาชานาน ทั้งสรางอนุสาวรียและประกาศวันหยุดราชการเพื่อเฉลิมฉลองตนเอง เราตองตอบโตดวยการสรางสัญลักษณของเราเอง ที่เฉลิมฉลองสิทธิของประชาชนในการกําหนดชะตากรรมของตนเอง และชัยชนะเหนือระบอบอัตตาธิปไตยแบบเกา"
  SIA_civil_service_heroism: "วีรกรรมของขาราชการพลเรือน"
  SIA_civil_service_heroism_desc: "คนไทยทุกคนตองไดรับการปลูกฝงใหมีหนาที่โดยกําเนิดในการปกปองหลักนิติธรรม หากมีอํานาจใดไมวาจากภายนอกหรือภายในพยายามยึดอํานาจนั้นไวเปนของตน เราไมเพียงตองการการสนับสนุนจากประชาชนเมื่อมีผูคิดพรากเสรีภาพของเราไป แตเรายังตองการใหประชาชนเปนผูถือธงนําดวยตนเอง"
  SIA_spread_democratic_sentiment_in_universities: "เผยแพรจิตสํานึกประชาธิปไตยในมหาวิทยาลัย"
  SIA_spread_democratic_sentiment_in_universities_desc: "นักวิชาการคือผูกุมทิศทางในอนาคตของ[SIA.GetName] สิ่งที่พวกเขาเรียนรูวันนี้จะกองกังวานไปถึงอนาคต และดวยการปลูกฝงสํานึกในหนาที่ตอประชาธิปไตยอยางแรงกลาใหแกปญญาชนในวันนี้ เราอาจเผยแพรมันออกไปไกลเกินกวากําแพงของสถาบันการศึกษา"
  SIA_sideline_disloyal_officers: "กันนายทหารที่ไมภักดีออกไป"
  SIA_sideline_disloyal_officers_desc: "เหลานายทหารในกองทัพบกมิใชกลุมกอนเดียวกัน ในหมูพวกเขามีผูที่ภักดีตออดีตผูอุปถัมภ กลุมอํานาจคูแขง หรือความทะเยอทะยานของตนเอง มากกวาภักดีตอรัฐบาล ดวยการโยกยายอยางรอบคอบและแรงกดดันทางการบริหาร บุคคลเหลานี้จะถูกยายไปประจําตําแหนงที่ไมอาจเปนภัย ขณะที่ผูที่พิสูจนความไววางใจไดแลวจะไดรับความรับผิดชอบที่สมควร"
  SIA_sideline_disloyal_officers_tt: "นายพลสองคนที่สุมเลือกจะไดรับคุณลักษณะ§Yถูกโยกยาย§!เปนเวลา 4 ป ทําใหไมใหโบนัสใดๆ\nนายพลสองคนที่สุมเลือกซึ่งไมมีคุณลักษณะ§Yถูกโยกยาย§!จะไดรับคาสถานะเพิ่มและคุณลักษณะเชิงบวกเพิ่มอีกหนึ่งอยาง"
  SIA_direct_funds_from_the_military_towards_development: "ผันงบประมาณจากกองทัพไปสูการพัฒนา"
  SIA_direct_funds_from_the_military_towards_development_desc: "แมสายทหารจะไมพอใจที่งบประมาณของตนถูกผันไปใชเพื่อการพัฒนา แตก็เปนหนาที่ของพวกเขา มิใชของเรา ที่จะตองอธิบายตอสาธารณชนวาเหตุใดการลงทุนที่ขาดหายไปนี้จึงเปนประโยชนตอประชาชนในทายที่สุด"

  SIA_as_the_eyes_turn_towards_southeast_asia: "เมื่อสายตาหันมาสูเอเชีย"
  SIA_as_the_eyes_turn_towards_southeast_asia_desc: "เอเชียตะวันออกเฉียงใตมิใชสมรภูมิอันไกลโพนอีกตอไป หากเปนทางแยกของจักรวรรดิ การปฏิวัติ และสงคราม [SIA.GetName]ตองตัดสินใจวาจะเปนเพียงเบี้ยในการตอสูครั้งนี้ หรือเปนมหาอํานาจที่มีแผนการของตนเอง"
  SIA_support_songsuradets_military_clique: "สนับสนุนกลุมทหารของพระยาทรงสุรเดช"
  SIA_support_songsuradets_military_clique_desc: "มิใชนายทหารทุกคนจะเปนศัตรูของชาติ พระยาทรงสุรเดชและผูภักดีของทานคือทางเลือกทางทหารที่มีวินัย แทนที่เหลานายพลฉอฉลผูนําพาสยามไปสูปากเหว ดวยการสนับสนุนของพวกเขา ความสงบเรียบรอยจะกลับคืนมาไดโดยไมตองปลอยรัฐใหตกอยูในความโกลาหล"
  SIA_support_songsuradets_military_clique_tt: "หากเกิด§Yสงครามกลางเมือง§! พระยาทรงสุรเดชจะสนับสนุนเรา โดยใหกองพลเพิ่ม §Y3§! กองพล\n§Rหากเราเสริมอํานาจพระยาทรงสุรเดชแลวพยายามจับกุมทานผาน $SIA_the_songsuradet_rebellion$ ทานอาจตอตาน§!"
  SIA_the_royal_police_counterweight: "ตํารวจหลวง"
  SIA_the_royal_police_counterweight_desc: "ตํารวจหลวงทําหนาที่เปนกําลังที่เปนอิสระ และสามารถใชเปนเครื่องมือตอกรกับฝายตรงขามของเรา หากพวกเขาพยายามยึดอํานาจเปนของตน"
  SIA_the_royal_police_counterweight_tt: "หากเกิด§Yสงครามกลางเมือง§! ตํารวจหลวงจะสนับสนุนเรา โดยใหกองพลเพิ่ม §Y2§! กองพล"
  SIA_for_the_preservation_of_siamese_independence: "รวบอํานาจของสายทหาร"
  SIA_for_the_preservation_of_siamese_independence_desc: "ตลอดศตวรรษที่ผานมา มหาอํานาจของโลกไดรุกลํ้าบูรณภาพแหงดินแดน[SIA.GetAdjective] และศตวรรษนี้ก็ดูไมตางกัน เราตองลงมือเด็ดขาดหากจะรักษาวิถีชีวิตของเราไว มิฉะนั้นเราจะเหลือเพียงรัฐเศษเสี้ยวที่พิการ แตกแยก และถูกฉีกทึ้งเปนชิ้นๆ"
  SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! จะเพิ่มความพึงพอใจของ§Yสายทหาร§! และลดความพึงพอใจของ§Yสายพลเรือน§!"
  SIA_the_peoples_day: "วันประชาชน"
  SIA_the_peoples_day_desc: "แทนที่จะเนนยํ้าบทบาทของกองทัพในการโคนลมระบอบสมบูรณาญาสิทธิราชยมากขึ้นไปอีก เราควรยกยองบทบาทของประชาชนเอง การกําหนดวันประชาชนจะปลุกพลังของชาติ และสอนใหพลเมืองของเราไมยอมรับสิ่งใดที่นอยไปกวานี้"
  SIA_hold_military_parades: "จัดสวนสนามทหาร"
  SIA_hold_military_parades_desc: "เพื่อปลุกขวัญกําลังใจของทหาร ตอบแทนนายพลผูภักดี และเตือนใหพลเมืองระลึกถึงแสนยานุภาพของกองทัพ[SIA.GetAdjective] เราจะจัดสวนสนามครั้งใหญผานกรุงเทพฯ ใหหนังสือพิมพมีเรื่องที่ควรคาแกการตีพิมพบาง!"
  SIA_embed_technocrats_in_civilian_institutions: "ฝงเทคโนแครตในสถาบันพลเรือน"
  SIA_embed_technocrats_in_civilian_institutions_desc: "เราสามารถผูกมิตรกับเหลาเทคโนแครตในรัฐบาล ใชพวกเขาเปนแขนที่ยื่นตอออกไปของสายพลเรือน เพื่อเอื้อมไปไดไกลขึ้นและถวงดุลอิทธิพลของฝายทหาร"
  SIA_military_academies_indoctrination: "ปลูกฝงอุดมการณในโรงเรียนทหาร"
  SIA_military_academies_indoctrination_desc: "โรงเรียนทหารของเราเปนเปาหมายที่เหมาะสมที่สุดสําหรับการอบรมทางอุดมการณ ที่นั่นมีอาวุธพรอมสรรพ และนักเรียนนายรอยหนุมก็ถูกครูผูสอนชักจูงไดงาย ชนะใจครูได ก็ชนะใจทหารรุนเยาวได กองทัพที่เขมแข็งและภักดีตอชนชั้นปกครองคือรากฐานของรัฐที่ทรงพลัง และเราจะทรงพลัง"
  SIA_the_king_of_the_white_elephant: "พระเจาชางเผือก"
  SIA_the_king_of_the_white_elephant_desc: "กระแสคลั่งการเรียกรองดินแดนที่เสียไปคืนกําลังจะกวาดชาติใหลอยไป และโลกกําลังจับตามองอยู เพื่อบรรเทาความคลั่งไคลนี้ เราจะสรางภาพยนตรตอตานสงคราม ซึ่งเปนภาพยนตรไทยเรื่องแรกที่ถายทําเปนภาษาอังกฤษ เพื่อแสดงใหโลกเห็นตัวตนที่แทจริงของ[SIA.GetName]"
  SIA_the_king_of_the_white_elephant_tt: "ปลดล็อกการรณรงคโฆษณาชวนเชื่อ §Y$SIA_the_king_of_the_white_elephant$§! เมื่อทําแผนยุทธศาสตร §Y$SIA_sala_chaloem_thai_movie_theater$§! สําเร็จ ซึ่งใหผล:\nเสถียรภาพรายสัปดาห: §G+0.45%§! เปนเวลา 180 วัน"
  SIA_drum_up_irredentism: "ปลุกกระแสเรียกรองดินแดน"
  SIA_drum_up_irredentism_desc: "การไดรับการสนับสนุนจากกองทัพสําหรับสงครามในอนาคตยังไมเพียงพอ เราตองไดรับแรงหนุนจากประชาชนทั่วไปดวย ผานบทกวี ภาพยนตร และสุนทรพจน เราจะเตรียม[SIA.GetName]ใหพรอมสําหรับการชําระบัญชีกับมหาอํานาจจักรวรรดินิยมที่ปลนชิงดินแดนในประวัติศาสตรของเราไป"
  SIA_sell_privy_purse_lands: "ขายที่ดินของพระคลังขางที่"
  SIA_sell_privy_purse_lands_desc: "พระราชวงศทรงถือครองที่ดินผืนใหญจํานวนมาก ซึ่งบัดนี้อยูภายใตการควบคุมของเรา ที่ดินเหลานี้จะเพิ่มพูนทองพระคลังไดอยางมาก และบางสวนอาจขายในราคาพิเศษแกนายทหารที่คัดเลือกไว เพื่อซื้อความภักดีของพวกเขา"
  SIA_sell_privy_purse_lands_tt: "เมื่อจิตวิญญาณหมดอายุ §Y[SIA_phraya_phahon.GetName]§! จะพัวพันกับเรื่องอื้อฉาว ทําใหคุณขามเงื่อนไขฟาสซิสตสําหรับ §Y$SIA_phibuns_premiership$§! ได"
  SIA_war_fervor: "ไฟสงคราม"
  SIA_war_fervor_desc: "เสียงกลองดังกระหึ่มรอคอยความขัดแยงที่ใกลเขามา ประชาชนพรอมแลว ไมขีดถูกจุดแลว และไฟสงครามจะลุกโชนถึงขีดสุดในไมชา เราตองระวังนําพลังนี้ไปสูเปาหมายที่คูควร"
  SIA_war_fervor_tt: "การสนับสนุนสงครามจะเพิ่มขึ้นถาวรจนกวาเราจะประกาศสงครามกับประเทศใดก็ตาม ซึ่งเมื่อนั้นจิตวิญญาณนี้จะถูกนําออก\n\nหาก§Yการสนับสนุนสงคราม§!อยูเหนือ §Y95%§! โดยไมมีการประกาศสงครามนานเกินไป สงครามกลางเมืองจะปะทุขึ้น\nเมื่อประกาศสงคราม:"
  SIA_the_midnight_meeting: "การประชุมยามเที่ยงคืน"
  SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName]จะยึดอํานาจใน[SIA.GetNameDef]และเปนผูนํารัฐบาล เราจําเปนตองโคนเขาลงเพื่อฟนฟูสถาบันพระมหากษัตริยอยางแทจริง"
  SIA_the_midnight_meeting_desc: "จอมพล พระยาทรงสุรเดช เฝามองหลวงพิบูลสงครามสะสมอํานาจมากขึ้นทุกที และเห็นวานั่นคือสัญญาณของการเผชิญหนาที่จะมาถึง หากสถาบันพระมหากษัตริยและพระยาทรงสุรเดชจะอยูรอด ฝายนิยมเจา นายทหารชั้นผูใหญ และบุคคลสําคัญฝายพลเรือนตองประชุมกันอยางลับๆ และตกลงที่จะกําจัดหลวงพิบูลสงครามกอนที่เขาจะลงมือกับพวกตนกอน"
  SIA_meet_with_king_prajadhipok: "เขาเฝาพระบาทสมเด็จพระปกเกลาเจาอยูหัว"
  SIA_meet_with_king_prajadhipok_desc: "การสมคบคิดที่ปราศจากพระมหากษัตริยก็เปนเพียงแผนการรายของทหารอีกครั้งหนึ่งเทานั้น ดวยการเขาเฝาพระบาทสมเด็จพระปกเกลาเจาอยูหัวซึ่งประทับอยูตางแดน เราจะวางอุดมการณของพวกเขาไวใตรมแหงความชอบธรรมของพระมหากษัตริย และไดรับพระราชทานพรจากบุคคลเพียงพระองคเดียวที่การเสด็จนิวัตอาจรวมใจผูลังเลและทําใหระบอบแตกแยก"
  SIA_prajadhipok_audience_with_churchill: "พระปกเกลาฯ ทรงพบ[ENG.GetLeader]"
  SIA_prajadhipok_audience_with_churchill_desc: "การที่พระบาทสมเด็จพระปกเกลาเจาอยูหัวประทับอยูใน[ENG.GetName]ใหประโยชนมากกวาเพียงเกียรติยศ หากพระองคทรงโนมนาว[ENG.GetLeader]ไดวาการลุกฮือของฝายนิยมเจาเปนประโยชนตออังกฤษในเอเชีย อาวุธจากมลายูก็อาจตกไปถึงมือของผูที่ยังจงรักภักดีตอราชบัลลังก"
  SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName]จะมอบสิ่งตอไปนี้ใหแกเรา"
  SIA_prajadhipok_audience_with_churchill_tt2: "เมื่อสงครามกลางเมืองเริ่มตนขึ้น"
  SIA_facilitate_prajadhipoks_move_to_japan: "จัดการใหพระปกเกลาฯ เสด็จไปญี่ปุน"
  SIA_facilitate_prajadhipoks_move_to_japan_desc: "อังกฤษมิใชมหาอํานาจเดียวที่อาจไดประโยชนจากความวุนวายใน[ROOT.GetNameDef] ดวยการจัดเตรียมการเสด็จของพระบาทสมเด็จพระปกเกลาเจาอยูหัวไปยังญี่ปุน เราอาจไดรับความโปรดปรานจากโตเกียว และบางทีอาจไดคํามั่นวาจะมีกองพลพรอมสนับสนุน หากการลุกฮือของฝายนิยมเจาลุกลามเปนสงครามกลางเมือง"
  SIA_facilitate_prajadhipoks_move_to_japan_tt: "กองพลทหารพราน 3 กองพลจาก[JAP.GetNameDef]จะสนับสนุนเราระหวางสงครามกลางเมือง"
  SIA_the_kings_gambit: "เดิมพันของพระมหากษัตริย"
  SIA_the_kings_gambit_desc: "พระบาทสมเด็จพระปกเกลาเจาอยูหัวจะเสด็จนิวัตกรุงเทพฯ โดยทรงคาดไวเต็มที่วาระบอบจะจับกุมพระองค การกระทํานั้นจะมอบความโกรธแคน ความชอบธรรม และอํานาจที่ฝายนิยมเจาตองการ เพื่อละทิ้งความลังเลและลุกขึ้นสูในพระปรมาภิไธย เมื่อพระมหากษัตริยผูลี้ภัยถูกควบคุมพระองค สัญญาณจะถูกสงออกไป และการตอสูเพื่อ[ROOT.GetName]จะเริ่มตนขึ้น"
  SIA_the_kings_gambit_tt: "การสนับสนุนที่เราไดรับจะขึ้นอยูกับจํานวนกลุมอํานาจที่อยูฝายเรา"
  SIA_restore_order: "ฟนฟูความสงบเรียบรอย"
  SIA_restore_order_desc: "สงครามกลางเมืองจบลงดวยชัยชนะ แตชัยชนะเพียงอยางเดียวไมอาจเยียวยาราชอาณาจักรได ซากปรักหักพังตองไดรับการบูรณะ ฝายอํานาจเกาตองถูกทําใหสงบ และระบบบริหารตองสรางขึ้นใหม เพื่อให[ROOT.GetName]กาวพนจากความวุนวาย โดยราชบัลลังกมั่นคงและชีวิตสาธารณะกลับคืนสูครรลองที่ควรเปน"
  SIA_ananda_age_trigger_12: "ในหลวงอานันทมหิดลมีพระชนมายุอยางนอย §Y12§! พรรษา (ปจจุบัน §Y[?var:SIA_anandas_age]§!) วันพระราชสมภพคือวันที่ 20 กันยายน"
  SIA_ananda_age_trigger_15: "ในหลวงอานันทมหิดลมีพระชนมายุอยางนอย §Y15§! พรรษา (ปจจุบัน §Y[?var:SIA_anandas_age]§!) วันพระราชสมภพคือวันที่ 20 กันยายน"
  SIA_ananda_trait_tt: "เมื่อในหลวงอานันทมหิดลเสด็จขึ้นครองราชย จะไดรับ:"
  SIA_to_forge_a_king: "หลอหลอมพระมหากษัตริย"
  SIA_to_forge_a_king_desc: "ในหลวงอานันทมหิดลยังคงประทับอยูไกลถึงสวิตเซอรแลนด และยังทรงพระเยาวพอที่พระดําริและพระอุปนิสัยจะยังอยูระหวางการหลอหลอม หากเราวางแนวทางการศึกษาของพระองคอยางรอบคอบ เราอาจหลอหลอมไดมิใชเพียงประมุขในนาม แตเปนผูปกครองที่เหมาะสมกับชะตากรรมที่เรามุงหวังไวให[ROOT.GetNameDef]"
  SIA_to_forge_a_king_tt: "ยุวกษัตริย อานันทมหิดล ยังทรงพระเยาวและกําลังทรงศึกษาอยูใน[SWI.GetName] เราสามารถมีอิทธิพลตอการศึกษาและความสนพระทัยของพระองคในอนาคต เพื่อใหพระองคทรงเปนพระมหากษัตริยผูยิ่งใหญ\n\nทุกปในวันคลายวันพระราชสมภพ จนกวาจะมีพระชนมายุ 15 พรรษา เราจะสามารถเลือกวิชาที่พระองคจะทรงศึกษา ซึ่งจะใหโบนัสที่แตกตางกันเมื่อพระองคเสด็จขึ้นครองราชยในที่สุด\n\nวันพระราชสมภพคือวันที่ 20 กันยายน และพระชนมายุปจจุบันคือ §Y[?var:SIA_anandas_age]§!"
  SIA_ascend_the_throne: "เสด็จขึ้นครองราชย"
  SIA_ascend_the_throne_desc: "ชวงเวลาแหงการสําเร็จราชการไมอาจดําเนินไปตลอดกาล บัดนี้ในหลวงอานันทมหิดลทรงบรรลุนิติภาวะที่จะรับพระราชภาระแหงพระมหากษัตริยดวยพระองคเอง และการเสด็จขึ้นครองราชยอยางเปนทางการจะทําใหสถาบันพระมหากษัตริยที่ไดรับการฟนฟู กาวพนจากการอยูใตผูพิทักษและแผนการลับ ไปสูรัชสมัยใหมที่ชอบธรรม"
  SIA_the_provincial_council_of_state: "สภาแหงรัฐชั่วคราว"
  SIA_the_provincial_council_of_state_desc: "การสูรบทําใหกลไกการปกครองพังทลายและอํานาจไมแนนอน จนกวายุวกษัตริยอานันทมหิดลจะทรงปกครองไดในพระนามของพระองคเอง สภาแหงรัฐชั่วคราวตองทําหนาที่เปนรัฐบาลรักษาการ และประกาศวาฝายจงรักภักดีมิไดสูเพื่อตนเอง แตเพื่อฟนฟูสถาบันพระมหากษัตริยอันชอบธรรม"
  SIA_the_regency_of_boworadet: "การสําเร็จราชการของพระองคเจาบวรเดช"
  SIA_the_regency_of_boworadet_desc: "พระองคเจาบวรเดชทรงมีบารมีแหงระเบียบเกา และไมมีผูใดสงสัยในความจงรักภักดีของพระองค ดวยการแตงตั้งพระองคเปนผูสําเร็จราชการแทนพระองคในพระปรมาภิไธยของในหลวงอานันทมหิดล เราจะวางรัฐไวในมือของฝายอนุรักษนิยม และแสดงใหชัดวาการฟนฟูครั้งนี้มิใชเพียงการเปลี่ยนตัวรัฐมนตรี"
  SIA_the_sacred_hierarchy: "ลําดับชั้นอันศักดิ์สิทธิ์"
  SIA_the_sacred_hierarchy_desc: "พระองคเจาบวรเดชทรงถือวาราชอาณาจักรจะเขมแข็งที่สุดเมื่อทุกชนชั้นรูที่ทางของตน และราชบัลลังกอยูเหนือความทะเยอทะยานทางโลกทั้งปวง สถาบันพระมหากษัตริย ศาสนา และลําดับชั้นตามธรรมชาติของ[ROOT.GetNameDef] ตองกลับมาไดรับการเคารพในฐานะเสาหลักอันศักดิ์สิทธิ์อีกครั้ง มิใชโบราณวัตถุที่จะนําไปตอรองแลกเปลี่ยน"
  SIA_the_regency_of_songsuradet: "การสําเร็จราชการของพระยาทรงสุรเดช"
  SIA_the_regency_of_songsuradet_desc: "พระยาทรงสุรเดชมิใชนักเสรีนิยม แตก็มิไดมืดบอดตอความตองการของรัฐสมัยใหม ในฐานะผูสําเร็จราชการแทนพระองค ทานสามารถรักษาพระราชอํานาจไวได ขณะที่ฝากอนาคตของ[ROOT.GetNameDef]ไวกับวินัย การวางแผน และโครงการพัฒนาชาติที่นําโดยกองทัพ"
  SIA_order_discipline_and_unity: "ระเบียบ วินัย และเอกภาพ"
  SIA_order_discipline_and_unity_desc: "ความโกลาหลของการเมืองแบบแบงฝกฝายและสงครามกลางเมืองเกือบทําลายราชอาณาจักรจนสิ้น คําตอบของพระยาทรงสุรเดชนั้นเรียบงาย คือ ระเบียบในการปกครอง วินัยในสังคม และเอกภาพในเปาหมาย เพื่อใหราชอาณาจักรไดรับการสรางใหมเปนรัฐที่เขมแข็งและทันสมัยยิ่งขึ้น"
  SIA_the_regency_of_rangsit: "การสําเร็จราชการของพระองคเจารังสิตประยูรศักดิ์"
  SIA_the_regency_of_rangsit_desc: "พระองคเจารังสิตประยูรศักดิ์ทรงเขาพระทัยวาสถาบันพระมหากษัตริยจะดํารงอยูไดก็ตอเมื่อปรองดองกับการปกครองแบบมีผูแทน การสําเร็จราชการของพระองคจึงเปนการฟนฟูราชบัลลังกที่อนุรักษศักดิ์ศรีไว แตใชวิธีการแบบประชาธิปไตย และพรอมมอบอนาคตแบบรัฐสภาที่มั่นคงใหแก[ROOT.GetNameDef]"
  SIA_constitutional_virtue: "คุณธรรมแหงรัฐธรรมนูญ"
  SIA_constitutional_virtue_desc: "สถาบันพระมหากษัตริยที่เคารพกฎหมายยอมโคนลมไดยากกวาและปกปองไดงายกวา ภายใตการชี้นําของพระองคเจารังสิตฯ เราจะฟนฟูการปกครองตามรัฐธรรมนูญ จํากัดอํานาจตามอําเภอใจ และสอนใหชาติรูวาราชบัลลังกจะมั่นคงที่สุดเมื่อทรงเปนผูพิทักษเสรีภาพภายใตกฎหมาย"
  SIA_an_absolute_monarchy: "สมบูรณาญาสิทธิราชย"
  SIA_an_absolute_monarchy_desc: "การทดลองระบอบราชาธิปไตยภายใตรัฐธรรมนูญนํามาซึ่งความอัปยศ การรัฐประหาร และการที่นายทหารผูทะเยอทะยานชวงชิงพระราชอํานาจเทานั้น หากราชบัลลังกจะไดรับความจงรักภักดีอีกครั้ง พระมหากษัตริยตองทรงไดพระราชอํานาจอันสมบูรณคืนมา และทรงปกครองโดยไมตองอยูใตพรรคการเมืองหรือรัฐสภา"
  SIA_a_constitutional_monarchy: "ระบอบราชาธิปไตยภายใตรัฐธรรมนูญ"
  SIA_a_constitutional_monarchy_desc: "ราชบัลลังกไมจําเปนตองครอบงํารัฐเพื่อรักษาราชอาณาจักรไว ดวยการฟนฟูสถาบันพระมหากษัตริยภายใตขอตกลงทางรัฐธรรมนูญที่ยั่งยืน เราจะผูกพระมหากษัตริยและประชาชนเขาดวยกัน และทําใหพระเกียรติยศดํารงอยูควบคูกับรัฐบาลที่รับผิดชอบได"
  SIA_to_lay_the_bait: "วางเหยื่อลอ"
  SIA_to_lay_the_bait_tt: "เราจะปลอยแผนเศรษฐกิจปลอมใหรั่วไหลออกไปเพื่อยั่วยุฝายทหาร\nยิ่งเราชะลอ §Y$SIA_and_spring_the_trap$§! นานเทาไร กระแสตีกลับตอฝายทหารก็จะยิ่งรุนแรง และแรงสนับสนุนของเราก็จะยิ่งเพิ่มขึ้น\n\n$SIA_dem_event_count_cw_scale_tt$\n\nทุกครั้งที่ฝายทหารวิจารณรางปลอม แรงสนับสนุนของเราในสงครามกลางเมืองจะเพิ่มขึ้น สูงสุด §Y75%§! และสามารถไดแรงสนับสนุนในสงครามกลางเมืองเพิ่มอีก §Y25%§! จากแรงสนับสนุนประชาธิปไตยทั้งหมดของเรา (ปรับตามสัดสวนจาก §Y0%-100%§!)"
  SIA_dem_event_count_cw_scale_tt: "§Yแรงสนับสนุนที่คาดการณในปจจุบัน§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
  SIA_to_lay_the_bait_desc: "สมุดปกเหลืองเรียกรองการปฏิรูปเศรษฐกิจ แตฝายทหารจะเรียกมันวาคอมมิวนิสต ดวยการปลอยรางฉบับปลอมที่สุดโตงออกไปกอน เราจะยั่วใหพวกเขาเดือดดาล แลวทําลายความนาเชื่อถือของพวกเขาเมื่อฉบับจริงที่ประนีประนอมกวาถูกเผยแพร"
  SIA_and_spring_the_trap: "และตลบหลังกับดัก"
  SIA_and_spring_the_trap_desc: "เหลานายพลติดเหยื่อแลว ความเดือดดาลของพวกเขากลายเปนการกบฏ การกบฏเปดโปงความทะเยอทะยานของพวกเขา และรัฐบาลพลเรือนก็เตรียมพรอมไวแลว บัดนี้กับดักกําลังงับปด และอนาคตของ[ROOT.GetName]จะถูกกําหนดโดยผูที่จงรักภักดีตอรัฐธรรมนูญ"
  SIA_and_spring_the_trap_tt: "หากแรงสนับสนุนทั้งหมดของเราเกิน §Y80%§! เราจะหลีกเลี่ยงสงครามกลางเมืองและปลดฝายทหารออกจากอํานาจไดทันที"
  SIA_rebuild_the_war_torn_economy: "ฟนฟูเศรษฐกิจที่บอบชํ้าจากสงคราม"
  SIA_rebuild_the_war_torn_economy_desc: "สงครามกลางเมืองไดฉีกทําลายถนน โรงงาน ทองนา และเสนทางการคา การบูรณะตองเริ่มขึ้นทันที คาแรง ขาว ทางรถไฟ และสินเชื่อ จะชวยสรางเสถียรภาพให[ROOT.GetName]ไดมากกวาสุนทรพจนใดๆ จากกรุงเทพฯ"
  SIA_end_military_grift: "ยุติการฉอฉลในกองทัพ"
  SIA_end_military_grift_desc: "เปนเวลานานเกินไปแลวที่งบประมาณทหารถูกใชหลอเลี้ยงความมั่งคั่งสวนตัว เครือขายอุปถัมภ และโครงการหนาตาที่ไรประโยชน สงครามไดเปดโปงความเนาเฟะนี้ ทุกสัญญาที่ฉอฉล ทุกหนวยผี และทุกสินคาที่ถูกยักยอก ตองถูกสอบสวนและริบคืนจากกลุมอํานาจเกา"
  SIA_the_purge: "การกวาดลาง"
  SIA_the_purge_desc: "กลุมทหารไดทําใหชาติจมอยูในกองเลือด แทนที่จะยอมอยูใตการปกครองของพลเรือน ไมอาจมีการประนีประนอมกับผูทรยศ นายทหาร ผูสมรูรวมคิด และผูเห็นอกเห็นใจ ตองถูกปลดออกจากทุกตําแหนงบังคับบัญชากอนที่จะคุกคามรัฐไดอีกครั้ง"
  SIA_achieve_foreign_legitimacy: "สรางความชอบธรรมในสายตาตางชาติ"
  SIA_achieve_foreign_legitimacy_desc: "มหาอํานาจตางชาติเฝามองวิกฤตของเราดวยความระแวง รอดูวาสยามจะลมสลายไปสูการปกครองของคณะทหารหรือการปฏิวัติ เราตองพิสูจนวารัฐบาลพลเรือนมีเสถียรภาพ ชอบดวยกฎหมาย และสามารถปกปองประเทศได"
  SIA_achieve_foreign_legitimacy_trigger: "มหาอํานาจใดก็ตามมีทัศนคติตอเรามากกวา §Y75§!"
  SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! ลดตนทุน §G50%§! สําหรับ: §Yหลักนิยมทางบก§!"
  SIA_achieve_foreign_legitimacy_tt: "ไดรับเสถียรภาพ §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! ตอมหาอํานาจทุกประเทศที่มีทัศนคติตอเรามากกวา §Y75§!\n\nหากมีมหาอํานาจเขาเงื่อนไขมากกวา §Y3§! ประเทศ เราจะไดรับ §Y1x§! ลดตนทุน §G50%§! สําหรับ: §Yหลักนิยมทางบก§! เพิ่มเติม ตอมหาอํานาจที่เขาเงื่อนไขแตละประเทศที่เกินจากจํานวนนั้น\n\nหากมีมหาอํานาจเขาเงื่อนไขตั้งแต §Y6§! ประเทศขึ้นไป เราจะไดรับ§Yโรงงานพลเรือน§! §G+2§!"
  SIA_secure_the_state: "รักษาความมั่นคงของรัฐ"
  SIA_secure_the_state_desc: "ชัยชนะในสงครามกลางเมืองมิไดหมายถึงเสถียรภาพ ทางรถไฟ ทาเรือ คลังอาวุธ และศูนยกลางการสื่อสาร ตองไดรับการควบคุมไวกอนที่นายทหารฝายปฏิกิริยาจะรวมตัวกันไดอีก กรุงเทพฯ ตองสงบ ติดตอสื่อสารได และอยูภายใตการควบคุมของพลเรือนอยางมั่นคง"
  SIA_expand_upon_the_dossier: "ตอยอดสมุดปกเหลือง"
  SIA_expand_upon_the_dossier_desc: "สมุดปกเหลืองถูกเขียนขึ้นในหวงเวลาที่เปราะบาง บัดนี้หวงเวลานั้นผานพนไปแลว เมื่อกลุมทหารพายแพ เราสามารถกาวไปไกลกวาเดิม ทั้งการปฏิรูปที่ดินที่ลึกซึ้งขึ้น การคุมครองแรงงานที่เขมแข็งขึ้น และรัฐที่สามารถปรับโฉมสยามไดตั้งแตรากฐาน"
  SIA_military_oversight_bureau: "สํานักงานกํากับดูแลกองทัพ"
  SIA_military_oversight_bureau_desc: "จะปลอยใหกองทัพกลายเปนรัฐซอนรัฐอีกไมได สํานักงานกํากับดูแลที่นําโดยพลเรือนจะติดตามการแตงตั้ง งบประมาณ และกิจกรรมทางการเมืองภายในกองทัพ เพื่อใหคายทหารตองรับผิดชอบตอกรุงเทพฯ มิใชในทางกลับกัน"
  SIA_military_oversight_bureau_tt: "§Yสํานักงานกํากับดูแลกองทัพ§!จะสอบสวนนายพลทุก 5-9 เดือน ในชวงเวลาดังกลาว นายพลที่ไดรับผลกระทบจะปฏิบัติงานไดมีประสิทธิภาพลดลง เพราะตองระแวงการตรวจสอบที่เขมงวดขึ้น"
  SIA_the_yellow_dossier: "สมุดปกเหลือง"
  SIA_the_yellow_dossier_desc: "รางฉบับปลอมที่สุดโตงไดทําหนาที่ของมันแลว บัดนี้สมุดปกเหลืองฉบับจริงจะไดนํามาปฏิบัติ ทั้งการปฏิรูปอยางพอประมาณ การปรับเศรษฐกิจใหทันสมัย และกลไกปองกันทางการเมืองที่ออกแบบมาเพื่อทลายการครอบงําของทหาร โดยไมปลอยชาติใหตกอยูในความโกลาหล"
  SIA_achieve_domestic_legitimacy: "สรางความชอบธรรมภายในประเทศ"
  SIA_achieve_domestic_legitimacy_desc: "รัฐบาลอยูรอดมาไดดวยกําลังอาวุธ แตบัดนี้ตองชนะดวยกฎหมาย ปากทอง และความสงบเรียบรอย ความเชื่อมั่นของสาธารณชนตองไดรับการฟนฟู มาตรการฉุกเฉินตองมีเหตุผลรองรับ และประชาชนตองไดเห็นวาการปกครองโดยพลเรือนใหมากกวาแคการอยูรอด"
  SIA_achieve_domestic_legitimacy_tt: "§Yระบบคณะราษฎร§!จะถูกปดใชงาน\n§Yสายทหาร§!จะถูกยุบอยางถาวร โดยนําจิตวิญญาณของสายนี้ออกทั้งหมด\n\n§Yสายพลเรือน§!จะถูกปรับโครงสรางอยางถาวรเปน §Y$idea_SIA_unwavering_civilian_support$§!"
  SIA_allies_integration: "บูรณาการกับฝายสัมพันธมิตร"
  SIA_allies_integration_desc: "กองกําลังของเราตองเรียนรูการรบเคียงขางฝายสัมพันธมิตร โครงสรางการบังคับบัญชา การสื่อสาร ขั้นตอนการสงเสบียง และมาตรฐานยุทโธปกรณ ตองปรับใหสอดคลองกันกอนที่สยามจะเปนไดมากกวาหุนสวนในเชิงสัญลักษณ"
  SIA_prepare_for_a_pacific_war: "เตรียมพรอมสําหรับสงครามแปซิฟก"
  SIA_prepare_for_a_pacific_war_desc: "สายตาของเหลาจักรวรรดิกําลังหันไปยังแปซิฟก ความทะเยอทะยานของญี่ปุน อาณานิคมของยุโรป และยุทธศาสตรของฝายสัมพันธมิตร ลวนบงชี้ถึงพายุที่กําลังกอตัว สยามตองเตรียมพรอมกอนที่กระสุนนัดแรกจะมาถึงชายฝงของเรา"
  SIA_the_end_of_gunboat_diplomacy: "จุดจบของการทูตเรือปน"
  SIA_the_end_of_gunboat_diplomacy_desc: "จะไมมีวันอีกแลวที่เรือรบตางชาติจะมากําหนดเงื่อนไขจากปากแมนํ้าเจาพระยา สยามตองมีปนใหญ อูเรือ ทุนระเบิด และแนวปองกันชายฝงที่จําเปน เพื่อใหการขมขูกรุงเทพฯ ใดๆ กลายเปนการกระทําที่บาบิ่น"
  SIA_preemtive_strike: "ชิงโจมตีกอน"
  SIA_preemtive_strike_desc: "การรอใหญี่ปุนเลือกเวลาเปดฉากสงครามคือความโงเขลา หากจักรวรรดินั้นตั้งใจจะบุกทะลวงไปทั่วเอเชีย [SIA.GetName]ก็ตองโจมตีกอนที่กองทัพและกองเรือของมันจะทุมกําลังไปที่อื่นจนหมด"
  SIA_the_siamese_armada: "ราชนาวี[SIA.GetAdjective]"
  SIA_the_siamese_armada_desc: "[SIA.GetName]สมัยใหมตองการกองเรือสมัยใหม ดวยเรือลําใหม ลูกเรือที่ผานการฝก และโครงสรางพื้นฐานทางเรือที่ขยายตัว ราชนาวี[SIA.GetAdjective]จะกลายเปนกําลังที่สามารถปกปองชายฝงของเราและแผอํานาจออกไปไกลกวานั้น"
  SIA_asian_democratic_compact: "กติกาสัญญาประชาธิปไตยแหงเอเชีย"
  SIA_a_more_moderate_option: "ทางเลือกที่สายกลางกวา"
  SIA_a_more_moderate_option_desc: "การปฏิรูปตองยั่งยืน มิใชมอดไหมไปในพายุแหงการตอตาน ดวยการรักษาสมุดปกเหลืองไวในกรอบที่พอประมาณ เราจะโดดเดี่ยวพวกหัวรุนแรง สงบใจชนชั้นกลาง และสรางระเบียบพลเรือนที่อยูรอดหลังชัยชนะครั้งแรกได"
  SIA_asian_democratic_compact_desc: "เอเชียไมอาจพึ่งพาจักรวรรดิที่อยูหางไกลหรือคํามั่นของมหาอํานาจไปไดตลอดกาล ชาติประชาธิปไตยในภูมิภาคตองยืนหยัดรวมกัน ปกปองซึ่งกันและกัน และพิสูจนวาเอกราชและเสรีภาพสามารถอยูรอดไดในเอเชีย"
  SIA_asian_democratic_compact_tt: "ปลดล็อกความสามารถในการเรียกรองเอกราชใหแกรัฐในอารักขาในเอเชีย และสามารถเชิญพวกเขาเขารวมฝายของเราได"
  SIA_asian_democratic_compact_modify: "ปรับ §Y$SIA_asian_democratic_compact$§! ดังนี้:"
  SIA_southeast_asia_joint_command: "กองบัญชาการรวมเอเชียตะวันออกเฉียงใต"
  SIA_southeast_asia_joint_command_desc: "กติกาสัญญาของเราตองเปนมากกวาคํามั่นทางการทูต กองบัญชาการรวมจะประสานยุทธศาสตร เสบียง ขาวกรอง และการวางแผนปองกันทั่วเอเชียตะวันออกเฉียงใต เปลี่ยนกองทัพที่แยกกันใหกลายเปนโลรวมกัน"
  SIA_pan_asian_weapon_standardization: "การจัดมาตรฐานอาวุธรวมทั่วเอเชีย"
  SIA_pan_asian_weapon_standardization_desc: "พันธมิตรแตละชาติที่ใชปนเล็กยาว ขนาดลํากลอง วิทยุ และยานพาหนะตางกัน คือการเชื้อเชิญความลมเหลวดานการสงกําลังบํารุง อาวุธมาตรฐานเดียวกันและแผนการผลิตรวมกันจะทําใหแนวรวมของเราแข็งแกรงขึ้น ประหยัดขึ้น และติดอาวุธไดเร็วขึ้น"
  SIA_united_against_aggression: "รวมใจตานการรุกราน"
  SIA_united_against_aggression_desc: "จะไมมีสมาชิกใดในกติกาสัญญาของเราตองยืนหยัดตามลําพัง ไมวาภัยคุกคามจะมาจากจักรวรรดินิยม ฟาสซิสต ลัทธิทหาร หรือเพื่อนบานที่ฉวยโอกาส ชาติตางๆ ในเอเชียจะตอบโตรวมกัน"
  SIA_the_hammers_that_strike: "คอนที่พรอมทุบ"
  SIA_the_hammers_that_strike_desc: "พันธมิตรของเรามิใชกลุมรัฐเล็กๆ ที่หวังเพียงเอาตัวรอดอีกตอไป หากเปนอาวุธ แตละชาติคือคอน และเมื่อรวมกันเราจะทุบทุกอํานาจที่คิดจะครอบงําเอเชีย"
  SIA_mobilize_the_defenders_of_siam: "ระดมผูพิทักษสยาม"
  SIA_mobilize_the_defenders_of_siam_desc: "กองทัพเกาทําใหชาติผิดหวัง แตสยามยังตองการผูพิทักษ อาสาสมัคร นายทหารผูภักดี กองรักษาการณประจําจังหวัด และพลเมืองผูรักชาติ ตองถูกจัดตั้งเปนกําลังที่ปกปองรัฐธรรมนูญจากศัตรูทั้งภายในและภายนอก"
  SIA_join_the_allies: "เขารวมฝายสัมพันธมิตร"
  SIA_join_the_allies_desc: "[ROOT.GetName]ไมอาจยืนหยัดตามลําพังขณะที่โลกถูกสงครามกลืนกิน ฝายสัมพันธมิตรมอบอาวุธ การรับรอง และที่ยืนในหมูชาติที่ตอตานการรุกราน การเขารวมกับพวกเขาจะผูกความอยูรอดของสยามเขากับการตอสูครั้งใหญเพื่อโลกเสรี"
  SIA_the_malay_peninsular_defense_plan: "แผนปองกันคาบสมุทรมลายู"
  SIA_the_malay_peninsular_defense_plan_desc: "หากสงครามมาถึงเอเชียตะวันออกเฉียงใต มลายูจะเปนหนึ่งในสมรภูมิแรกๆ ปอมปราการ คลังเสบียง และการวางแผนรวมกับอังกฤษ จะเปลี่ยนคาบสมุทรแหงนี้ใหเปนโลปองกันการรุกราน"
  SIA_the_malay_peninsular_defense_plan_tt: "สรางทางรถไฟระหวางกรุงเทพฯ และสิงคโปร\n\nทุกจุดชัยชนะใน[MAL.GetName] สิงคโปร [724.GetName] [289.GetName] และ[1076.GetName]\nเพิ่ม§Yปอมชายฝง§! §G2§!\nเพิ่ม§Yปอมภาคพื้นดิน§! §G2§!\nแตละรัฐเหลานี้:\nเพิ่ม§Yปนตอสูอากาศยานประจําที่§! §G1§!"
  SIA_join_the_united_front: "เขารวมแนวรวม"
  SIA_join_the_united_front_desc: "จีนเลือดตกยางออกภายใตการรุกรานของ[JAP.GetAdjective] แตก็ยังคงสูตอ ดวยการเขารวมแนวรวม [SIA.GetName]จะชวยเปลี่ยนสงครามภาคพื้นดินใหเปนสุสานของความทะเยอทะยานแหงจักรวรรดิ"
  SIA_a_land_war_in_asia_desc: "สงครามจะไมไดชัยดวยการประกาศเพียงอยางเดียว ทหารสยามตองเดินทัพ สูรบ และอดทนขามภูมิประเทศอันทุรกันดารของเอเชีย ความมุงมั่นของเราตอแนวรวมตองวัดกันที่การกระทํา"
  SIA_death_to_the_communists: "ปราบคอมมิวนิสตใหสิ้นซาก"
  SIA_death_to_the_communists_desc: "ความพายแพของกลุมทหารตองไมเปดประตูสูทรราชอีกรูปแบบหนึ่ง พวกปลุกระดมคอมมิวนิสตเชื่อวาวิกฤตไดบั่นทอนรัฐใหออนแอ ไมนานพวกมันจะไดรูวาประชาธิปไตยแบบพลเรือนมิไดไรทางปองกันตนเอง"
  SIA_death_to_the_nationalists: "ปราบฝายชาตินิยมใหสิ้นซาก"
  SIA_death_to_the_nationalists_desc: "ญี่ปุนถูกขับไลถอยกลับไปแลว แตคําถามถึงอนาคตของเอเชียยังคงอยู ระเบียบชาตินิยมแบบเกาจะเพียงแคแทนที่ลําดับชั้นหนึ่งดวยอีกลําดับชั้นหนึ่ง หากเอเชียจะถูกสรางขึ้นใหม คอมมิวนิสตตองเปนฝายมีชัย"
  SIA_a_new_dawn_over_asia: "รุงอรุณใหมเหนือเอเชีย"
  SIA_a_new_dawn_over_asia_desc: "จักรวรรดิญี่ปุนลมสลายแลว และกองกําลังฉอฉลที่หวังจะสืบทอดซากปรักหักพังของมันก็ถูกกวาดทิ้งไป ทั่วทั้งเอเชีย รุงอรุณใหมกําลังทอแสงเหนือชาติตางๆ ที่มุงมั่นสรางอนาคตของตนใหเปนอิสระจากการครอบงําของจักรวรรดินิยม"
  SIA_phibuns_premiership: "หลวงพิบูลสงครามขึ้นเปนนายกรัฐมนตรี"
  SIA_phibuns_premiership_desc: "เมื่อวาระนายกรัฐมนตรีของ[SIA_phraya_phahon.GetName]ใกลสิ้นสุดลง ผูสืบทอดที่คณะเลือกไว คือ แปลก พิบูลสงคราม ก็พรอมจะขึ้นกุมอํานาจ สิ่งนี้จะทําใหฝายทหารพอใจเราอยางมาก แตจะทําใหสายพลเรือนกระสับกระสายดวยความวิตก\nสําหรับเรา มีเพียงหนทางเดียวที่จะกาวไปในยุคใหมนี้ นั่นคือดวยความมุงมั่นอันแรงกลา!"
  SIA_siamese_youth_movement: "ขบวนการยุวชน[THIS.GetAdjective]"
  SIA_siamese_youth_movement_desc: "คนหนุมสาวของ[THIS.GetName]ตองไดรับการหลอหลอม ดั่งเหล็กกลาที่ถูกเผาบนเปลวไฟรอนแรง พวกเขาจะเรียนรูที่จะเคารพรัฐ รูวิธีปกปองมาตุภูมิ และกลายเปนสมาชิกอันมีคาของสังคมไทย"
  SIA_territorial_defense_student: "ยุวชนทหาร"
  SIA_territorial_defense_student_desc: "ตอยอดจากขบวนการยุวชน ผูที่มีแววที่สุดจะถูกสงเขาคายฝกยุวชนทหาร เพื่อชวยปองกัน[SIA.GetNameDef] พวกเขาจะไดรับการฝกทางทหารอยางเหมาะสม และเปนเครื่องมือเสริมที่กองทัพสามารถใชได"
  SIA_expand_domestic_arms_workshops: "ขยายโรงงานผลิตอาวุธภายในประเทศ"
  SIA_expand_domestic_arms_workshops_desc: "ขีดความสามารถในการผลิตยุทธปจจัยภายในประเทศของเราลาหลังประเทศพัฒนาแลวอื่นๆ อยางนาอนาถ เราตองมุงขยายการผลิตทางทหารบนแผนดินของเราเอง เพื่อใหกองกําลังของเราไดรับยุทโธปกรณใหมอยางตอเนื่อง"
  SIA_look_to_european_fascism: "มองไปยังฟาสซิสตยุโรป"
  SIA_look_to_european_fascism_desc: "เรามีโอกาสที่จะปฏิรูปประเทศนี้ เมื่อหลุดพนจากพันธนาการของอดีต เราจะมองไปสูอนาคตใหม โดยไดแรงบันดาลใจจากสิ่งที่เกิดขึ้นในโลกตะวันตก เห็นไดชัดวาระเบียบโลกเกากําลังถูกรื้อถอน และผูที่ถูกทิ้งไวขางหลังจะตองรับผลจากการขาดวิสัยทัศนของตน"
  SIA_the_songsuradet_rebellion: "กบฏพระยาทรงสุรเดช"
  SIA_the_songsuradet_rebellion_desc: "นายทหารชั้นผูใหญอยางพระยาทรงสุรเดชเปนภัยตอระบอบปจจุบัน หากทานตองการจะเปน ภัยตอระบอบเชนนี้ไมอาจปลอยไวได และในฐานะคูแขงคนสําคัญที่สุดของหลวงพิบูลสงคราม ทานตองไป\nยอมมีหลักฐานที่สรางความเสียหายมากพอที่จะใชเลนงานพระยาทรงสุรเดชและผูสนับสนุน ซึ่งจะชวยรวบอํานาจของเราและกําจัดฝายตรงขามภายในประเทศได"
  SIA_the_songsuradet_rebellion_historical_tt: "พระยาทรงสุรเดชจะถูกกลาวหาวาสมคบคิดเปนกบฏตอรัฐ ตัวเขาและที่ปรึกษา §Y[SIA_rangsit_prayurasakdi.GetName]§! จะถูกกวาดลาง\n\nเราจะไดรับ\n"
  SIA_the_songsuradet_rebellion_historical_tt2: "เมื่อหมดเวลาจะไดรับ:"
  SIA_the_songsuradet_rebellion_historical_tt3: "เปนเวลา §Y[?var:SIA_purged_military_timer]§! วัน"
  SIA_the_songsuradet_rebellion_alt_tt: "พระยาทรงสุรเดชจะถูกกลาวหาวาสมคบคิดเปนกบฏตอรัฐ\n\nทวาเมื่อเราเคยเสริมกําลังใหกลุมทหารของเขาไว เขาอาจไดใจจนปฏิเสธหมายเรียก นําไปสูการเผชิญหนาหรือแมแตสงครามกลางเมือง"
  SIA_sue_the_king_in_exile: "ฟองรองอดีตพระมหากษัตริยผูประทับในตางแดน"
  SIA_sue_the_king_in_exile_desc: "มีขาวลือวาอดีตพระมหากษัตริยผูประทับในตางแดนทรงนําทรัพยสินมีคาจํานวนมากติดพระองคไปยัง[ENG.GetNameDefCap]ดวย เราควรเรียกทรัพยสินเหลานั้นคืน และหากจําเปนตองฟองรองพระองคและพระมเหสีเพื่อการนั้น ก็ตองทํา"
  SIA_suspend_ordinary_legal_procedures: "ระงับกระบวนการยุติธรรมตามปกติ"
  SIA_suspend_ordinary_legal_procedures_desc: "กบฏพระยาทรงสุรเดชเปดโอกาสใหเราปฏิรูปครั้งใหญในนามของความมั่นคงแหงชาติ กลไกถวงดุลอํานาจของศาลและองคกรทางการเมืองอื่น ๆ จะถูกลดทอนลง ทําใหเรามีเวลามากพอที่จะรวมศูนยอํานาจ"
  SIA_the_duty_of_the_thai_people_during_the_war_act: "พระราชบัญญัติกําหนดหนาที่ของคนไทยในเวลารบ"
  SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
  SIA_recognize_manchukuo: "รับรองแมนจูกัว"
  SIA_recognize_manchukuo_desc: "TODO_CM"
  SIA_press_censorship: "ควบคุมสื่อสิ่งพิมพ"
  SIA_press_censorship_desc: "สื่อที่เสรีเกินไปอาจบอนทําลายเสถียรภาพของรัฐ แมจะตองเปดชองใหบาง แตเราตองทําใหเสียงและเจตจํานงของรัฐบาลมากอนในหนาสื่อ"
  SIA_department_of_publicity: "กรมโฆษณาการ"
  SIA_department_of_publicity_desc: "กลไกโฆษณาชวนเชื่อเปนสิ่งจําเปนสําหรับทุกรัฐ โดยเฉพาะรัฐที่มีความทะเยอทะยานทางดินแดนอยางเรา การจัดสรรงบประมาณใหกรมโฆษณาการจะชวยใหเราบรรลุเปาหมายนี้"
  SIA_thai_cultural_mandates: "รัฐนิยม"
  SIA_thai_cultural_mandates_desc: "เราสามารถปลุกเราประชาชนชาวไทยและสรางวัฒนธรรมแหงชาติที่เขมแข็งไดดวยการประกาศรัฐนิยม เสริมสรางความสามัคคีของประชาชน และหลอมรวมอัตลักษณใหเปนหนึ่งเดียว"
  SIA_thai_cultural_mandates_tt: "ปลดล็อกการตัดสินใจเพื่อประกาศรัฐนิยม ซึ่งใหผลเสริมตาง ๆ แลกกับ§Yอํานาจทางการเมือง§! รัฐนิยมฉบับที่ 1 และรัฐนิยมฉบับแรกที่เลือกนอกจากนั้นไมเสียคาใชจาย"
  SIA_relocate_the_capital_to_phetchabun: "ยายเมืองหลวงไปเพชรบูรณ"
  SIA_relocate_the_capital_to_phetchabun_desc: "รัฐบาลกําลังตกอยูในอันตราย! ประวัติศาสตรไดพิสูจนแลววากรุงเทพฯ เปราะบางตอการโจมตีทางทะเล แมการยายเมืองหลวงเขาไปในแผนดินจะไมเปนที่นิยมอยางแนนอน แตก็เปนการตัดสินใจที่ตองทํา"
  SIA_relocate_the_capital_to_phetchabun_tt: "ยาย§Yโรงงานทหาร§!สูงสุด §G3§! แหงจาก §Y[1076.GetName]§! ไปยัง §Y[1077.GetName]§!\nยาย§Yโรงงานพลเรือน§! §G3§! แหงจาก §Y[1076.GetName]§! ไปยัง §Y[1077.GetName]§!\nสรางปอมปราการระดับ §G3§! รอบเพชรบูรณ"
  SIA_relocate_the_capital_to_phetchabun_tt2: "เมื่อจิตวิญญาณหมดเวลา - ไดรับเสถียรภาพพื้นฐาน: §R-25%§!"
  SIA_radio_propaganda: "โฆษณาชวนเชื่อทางวิทยุ"
  SIA_radio_propaganda_desc: "วิทยุกําลังกลายเปนสื่อหลักเมื่อ[SIA.GetName]มีไฟฟาใชทั่วถึงขึ้น และเชนเดียวกับที่เราควบคุมหนังสือพิมพ เราก็ตองควบคุมสิ่งที่ออกอากาศดวย"
  SIA_sala_chaloem_thai_movie_theater: "ศาลาเฉลิมไทย"
  SIA_sala_chaloem_thai_movie_theater_tt: "ปลดล็อกการตัดสินใจเพื่อสรางภาพยนตรโฆษณาชวนเชื่อ ซึ่งใหผลเสริมตาง ๆ เชน:\n"
  SIA_sala_chaloem_thai_movie_theater_desc: "ภาพยนตรเปนสื่อใหมในประเทศของเรา แตศักยภาพของมันประจักษแกทุกคน เชนเดียวกับบทกวี หนังสือ และวิทยุ ภาพยนตรสามารถเขาถึงจิตใจของทั้งสามัญชนและชนชั้นนํา เราจะใชสื่อนี้ปลุกความมุงมั่นของพลเมืองใหไดเห็น[SIA.GetName]ที่ยิ่งใหญผงาดขึ้น"
  SIA_pan_thaiism: "ลัทธิรวมชาติไทย"
  SIA_pan_thaiism_desc: "เพียงแคอยูรอดนั้นไมพอสําหรับ[ROOT.GetName] แตตองรุงเรืองดวย อนาคตของชาว[ROOT.GetAdjective]ไมไดอยูที่การยอมจํานนเปนเพียงรัฐชั้นสาม แตอยูที่การเปนผูเลนที่แข็งขันในเวทีโลก กอนอื่นตองปลุกจิตใจประชาชนใหลุกขึ้นตอตานจักรวรรดินิยมที่พรากสิ่งที่เคยเปนของเราไป และยํ้าเตือนใหทุกคนจดจําสิ่งที่ถูกชวงชิงไป"
  vichy_exist_trigger: "§Yฝรั่งเศสวิชี§! มีอยู"
  vichy_exist_not_trigger: "§Yฝรั่งเศสวิชี§! ไมมีอยู"
  SIA_retake_lost_british_states: "ทวงคืนดินแดนที่เสียใหอังกฤษ"
  SIA_retake_lost_british_states_tt: "ปลดล็อกความสามารถในการเปดสงครามจํากัดขอบเขตกับดินแดนของอังกฤษใน§Yพมา§!และ§Yมลายู§!"
  INS_retake_lost_british_states_tt: "ปลดล็อกความสามารถในการเปดสงครามจํากัดตอดินแดนของอังกฤษใน§Yมาเลเซีย§!"
  SIA_retake_lost_british_states_desc: "ไมใชเพียงชาว[FRA.GetAdjective]เทานั้นที่แบงแยกราชอาณาจักรอันยิ่งใหญของเรา ชาว[ENG.GetAdjective]เองก็ถูกความทะเยอทะยานผลักดันใหฉวยทุกโอกาสเขามาเอาสวนแบงของตน บัดนี้เมื่อความสนใจของพวกเขาจดจออยูกับคูแขงที่ใหญกวา ก็ถึงเวลาที่เราจะลงมือแลว"
  SIA_recover_indochina: "ทวงคืนอินโดจีน"
  SIA_recover_indochina_desc: "ในศตวรรษที่ผานมา ประเทศของเราถูก[FRA.GetAdjective]แบงแยกเปนเสี่ยง ๆ รัฐบาลจากอีกฟากโลกที่ไมมีสิทธิ์ใดมาบอกวาเราตองทําอะไรหรือใชชีวิตอยางไร แตกลับใชเรือปนและอาวุธยึดเอาสิ่งที่เปนของเราไป ในศตวรรษนี้ อํานาจของ[FRA.GetAdjecive]กําลังเสื่อมถอย ศตวรรษนี้เปนของเรา"
  SIA_recover_indochina_tt: "ปลดล็อกความสามารถในการเปดสงครามจํากัดขอบเขตกับดินแดน§Yอินโดจีน§!"
  SIA_demand_the_return_of_lost_territory: "เรียกรองดินแดนที่เสียไปคืน"
  SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap]ไดแสดงความออนแอออกมาแลว เปนเพียงเสือกระดาษที่เกาะกุมอิทธิพลอันริบหรี่ที่ยังเหลืออยู เมื่อกองทัพลมสลาย ก็ไมอาจแสดงแสนยานุภาพไดดังเดิม และไมอยูในฐานะที่จะคัดคานขอเรียกรองของเรา"
  SIA_demand_the_return_of_lost_territory_tt: "เราจะขอใหเจาของ§Yอินโดจีน§!และบางสวนของ§Y[MAL.GetName]§!คืน §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! และ §Y[670.Getname]§! ใหแกเรา\n\nปจจัยที่มีผล:\n-กําลังรบอยางนอย 30% เมื่อเทียบกับเจาของ\n-เจาของกําลังทําสงครามกับมหาอํานาจ\n-เจาของไมไดอยูในฝายใด\n-เจาของคือ§Yฝรั่งเศสวิชี§!\n-เราอยูในฝาย\n-เจาของไมชอบเรา"
  SIA_the_greater_thai_empire: "มหาอาณาจักรไทย"
  SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§! ควบคุมทุกรัฐในอินโดจีน\nการยอมรับปกครองของทุกรัฐในอินโดจีนมากกวา: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nนอกจากนี้ยังตอง:"
  SIA_the_greater_thai_empire_desc: "ถึงเวลาแหงการผงาดของเราแลว สิ่งที่เคยถูกพรากไปไดกลับคืนมา และเมื่อประชาชนยอมรับเราเปนผูมีอํานาจโดยพฤตินัย เราก็ไดสถาปนาความชอบธรรมอยางมั่นคงในฐานะผูนําโดยชอบธรรมแหงมหาอาณาจักรไทยที่ฟนคืนขึ้นใหมนี้"
  SIA_crack_down_of_foreign_merchants: "ปราบปรามพอคาตางชาติ"
  SIA_crack_down_of_foreign_merchants_desc: "การคาของเราถูกผลประโยชนภายนอกกําหนดทิศทางมาชานาน กอใหเกิดจุดออนที่อาจกระทบตอความเขมแข็งของชาติ เพื่อปกปองความมั่นคงทางเศรษฐกิจ เราตองควบคุมการคาของเราเองได เพื่อใหความมั่งคั่งและเสถียรภาพตั้งอยูบนรากฐานที่เราควบคุมเอง"
  SIA_royal_palace_bureau_directive_no_1523: "คําสั่งสํานักพระราชวังที่ 1523"
  SIA_royal_palace_bureau_directive_no_1523_desc: "ดวยกระแสชาตินิยมที่พุงสูงทั่วประเทศ แมแตราชสํานักก็ออกมาสนับสนุนรัฐบาล โดยขอใหขาราชบริพารทุกคนในสํานักพระราชวังบริจาครายได 10% เพื่อจัดซื้ออาวุธที่ทันสมัย"
  SIA_end_factionalism: "ยุติความแตกแยกระหวางกลุม"
  SIA_end_factionalism_desc: "รอยราวระหวางสายทหารและสายพลเรือนของคณะราษฎรไดทอดเงาเหนือทุกการตัดสินใจนับตั้งแตการปฏิวัติ หากเรารักษาใหทั้งสองกลุมสนับสนุนรัฐบาลอยางมั่นคงไดนานพอ ในที่สุดเราก็จะหลอมรวมทั้งสองเปนคณะราษฎรที่เปนเอกภาพ และฝงเงาของรัฐประหารไปตลอดกาล"
  SIA_end_factionalism_available_tt: "ทั้ง§Yสายพลเรือน§!และ§Yสายทหาร§!อยูในระดับ§Gสนับสนุนเต็มที่§!ติดตอกันเปนเวลา §Y270§! วัน"
  SIA_end_factionalism_tt: "การแขงขันระหวางกลุมภายในคณะราษฎรไดยุติลง:\n   สาย§Yพลเรือน§!และสาย§Yทหาร§!ถูกยุบรวมเปน§Gคณะราษฎรที่เปนเอกภาพ§!\n   ไดรับจิตวิญญาณ §Y$idea_SIA_unified_khana_ratsadon$§!"
  SIA_turn_off_the_khana_ratsadon: "คณะราษฎรถูกยุติบทบาท"

  SIA_factionalism_overcome: "ความแตกแยกระหวางกลุมไดรับการแกไขแลว"
  SIA_new_territories_administration: "การบริหารดินแดนใหม"
  SIA_new_territories_administration_tt: "ปลดล็อกการตัดสินใจเพื่อบริหารดินแดน§Yอินโดจีน§! ซึ่งเพิ่มการยอมรับปกครอง อุตสาหกรรม และปอมปราการ"
  SIA_new_territories_administration_desc: "การทวงคืนดินแดนที่เสียไปเปนเพียงจุดเริ่มตน เราตองแสดงใหผูคนที่นั่นเห็นวาเราเปนทางเลือกที่ดีกวา โครงการอยางรอบดานจะถูกดําเนินการเพื่อยกระดับความเปนอยูของทุกคน ใหพลเมืองทุกคนรูสึกเทาเทียมกันภายใน[ROOT.GetName]ที่ยิ่งใหญขึ้นนี้"
  SIA_new_territories_administration_available_trigger: "รัฐใดก็ไดใน§Yอินโดจีน§!\n   อยูในการควบคุมของ §Y[ROOT.GetName]§!"
  SIA_industrialization_drive: "เรงรัดการพัฒนาอุตสาหกรรม"
  SIA_industrialization_drive_desc: "หลายชั่วอายุคนที่ความมั่งคั่งของ[ROOT.GetName]ตั้งอยูบนทองนาและหมูบานชนบท แตโลกสมัยใหมถูกขับเคลื่อนดวยโรงงานและเครื่องจักร หาใชคันไถไม หากเราจะรักษาเอกราชทามกลางมหาอํานาจ เราตองเปลี่ยนราชอาณาจักรเกษตรกรรมของเราใหเปนชาติอุตสาหกรรม"
  SIA_industrialization_drive_trigger: "§Yคณะราษฎร§!ยังมีบทบาทอยู"
  SIA_asian_financial_compact: "ความตกลงทางการเงินแหงเอเชีย"
  SIA_asian_financial_compact_desc: "ทุนยุโรปยังคงครอบงําการคาในเอเชียเปนสวนใหญ ทําใหเศรษฐกิจของเราเปดรับแรงกดดันจากตางชาติ การแสวงหาความรวมมือทางการเงินที่ใกลชิดขึ้นกับเพื่อนบานจะชวยขยายการเขาถึงสินเชื่อ ตลาด และการลงทุน โดยไมตองสละเอกราชของเรา"
  SIA_revision_of_unequal_treaties: "แกไขสนธิสัญญาที่ไมเปนธรรม"
  SIA_revision_of_unequal_treaties_desc: "ขอตกลงเกาที่ลงนามในยามออนแอยังคงใหอภิสิทธิ์แกผลประโยชนตางชาติ ซึ่งไมมีรัฐสมัยใหมใดควรยอมรับ เราตองแกไขสนธิสัญญาที่ไมเปนธรรมเหลานี้ และฟนฟูอํานาจเต็มของ[ROOT.GetNameDef]เหนือการคา ศาล และสัมปทานของตน"
  SIA_renegotiate_teak_control: "เจรจาการควบคุมไมสักใหม"
  SIA_renegotiate_teak_control_desc: "ปาไมทางภาคเหนือสรางความรํ่ารวยใหผูรับสัมปทาน ขณะที่รัฐไดรับผลตอบแทนเพียงนอยนิด การเจรจาการควบคุมไมสักใหมจะชวยใหเราเรียกรายไดคืน กํากับการทําไม และทําใหไมสยามรับใชการพัฒนาของสยาม"
  SIA_a_fledgling_tobacco_industry: "อุตสาหกรรมยาสูบที่เพิ่งตั้งไข"
  SIA_a_fledgling_tobacco_industry_desc: "ยาสูบยังเปนการคาขนาดเล็กที่กระจัดกระจายและขาดการจัดการที่ดี ดวยการคุมครองพอประมาณและการลงทุนอยางรอบคอบ พืชเล็ก ๆ ชนิดนี้จะกลายเปนแหลงรายไดภาษีสรรพสามิต รายไดของชาวชนบท และงานในโรงงานที่พึ่งพาได"
  SIA_a_fledgling_tobacco_industry_tt: "หากใช §Y$limited_exports$§! หรือ §Y$closed_economy$§! จะไดรับ§Yโรงงานพลเรือน§!เพิ่มอีก 1 แหง"
  SIA_all_weather_roads: "ถนนใชไดทุกฤดูกาล"
  SIA_all_weather_roads_desc: "ถนนจํานวนมากหายไปกับสายฝน ทําใหหัวเมืองถูกตัดขาดจากเมืองหลวงและตลาด เครือขายถนนที่ใชไดทุกฤดูกาลจะเชื่อมราชอาณาจักรใหเปนหนึ่งเดียว และทําใหสินคาและทหารเคลื่อนที่ไดทุกฤดู"
  SIA_the_bank_of_siam: "ธนาคารชาติสยาม"
  SIA_the_bank_of_siam_desc: "การเติบโตทางอุตสาหกรรมไมอาจดําเนินไปไดดวยธรรมเนียมและความเอื้อเฟอสวนตัวเพียงอยางเดียว ธนาคารแหงชาติที่เขมแข็งขึ้นจะใหรัฐมีอํานาจกํากับสินเชื่อ เงินตรา และการหมุนเวียนของทุนไดมากขึ้น"
  SIA_thai_rice_company: "บริษัทขาวไทย"
  SIA_thai_rice_company_desc: "ขาวยังคงเปนเสนเลือดใหญของ[ROOT.GetName] แตการคาขาวสวนใหญยังกระจัดกระจาย เต็มไปดวยการเก็งกําไร และเปราะบางตอแรงกดดันจากตางชาติ บริษัทขาวแหงชาติจะชวยใหรัฐกํากับการสงออก รักษาเสถียรภาพราคา และเปลี่ยนผลผลิตจากทองนาของเราใหเปนรากฐานที่มั่นคงยิ่งขึ้นของความแข็งแกรงแหงชาติ"
  SIA_uk_japan_focus_tt: "ซึ่งใหเลือกระหวาง[ENG.GetNameDef]และ[JAP.GetNameDef] โดยมีผลดังนี้:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
  SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
  SIA_send_bureaucrats_abroad: "สงขาราชการไปศึกษาดูงานตางประเทศ"
  SIA_send_bureaucrats_abroad_desc: "ชาติอื่น ๆ ไดสรางกระทรวง โรงเรียน และหนวยงานดานเทคนิคที่เราตองการในตอนนี้ไวแลว การสงขาราชการที่มีแววไปตางประเทศจะทําใหเรานําเขาประสบการณดานการบริหารได โดยไมตองนําเขาการปกครองของตางชาติ"
  SIA_baht_stabilization_act: "พระราชบัญญัติรักษาเสถียรภาพเงินบาท"
  SIA_baht_stabilization_act_desc: "เศรษฐกิจสมัยใหมตองมีเงินตราที่พอคาเชื่อถือและนักลงทุนยอมรับ การรักษาเสถียรภาพเงินบาทจะลดความไมแนนอนทางการคา และทําให[ROOT.GetNameDef]มีจุดยืนที่มั่นคงขึ้นในตลาดระหวางประเทศ"
  SIA_siamese_development_cooperative: "สหกรณเพื่อการพัฒนาสยาม"
  SIA_siamese_development_cooperative_desc: "ทุนเอกชนยังระมัดระวัง และรัฐก็ไมอาจสรางทุกอยางไดเพียงลําพัง สหกรณเพื่อการพัฒนาแหงชาติจะเปดโอกาสใหขาราชการ พอคา และเจาของที่ดินรวมกันลงขันในโครงการที่เปนประโยชนตอเศรษฐกิจสวนรวม"
  SIA_boon_rawd_brewery: "บริษัทบุญรอดบริวเวอรี่"
  SIA_boon_rawd_brewery_desc: "อุตสาหกรรมการตมกลั่นในประเทศเปนมากกวาเรื่องของการบริโภค กิจการอยางบุญรอดแสดงใหเห็นวาทุน เครื่องจักร และการจัดการของชาวสยามสามารถสรางอุตสาหกรรมสมัยใหมบนผืนแผนดินสยามได"
  SIA_national_savings_bond: "พันธบัตรออมทรัพยแหงชาติ"
  SIA_national_savings_bond_desc: "ความมั่งคั่งของชาติไมควรถูกเก็บนิ่งอยูในหีบและเครื่องประดับ ขณะที่ถนนและโรงงานยังไมถูกสราง พันธบัตรออมทรัพยแหงชาติจะเปลี่ยนการออมของเอกชนใหเปนการลงทุนของรัฐ"
  SIA_national_savings_bond_tt: "ไดรับจิตวิญญาณ $SIA_national_savings_bond$ ซึ่งมีผลแรงขึ้นหรือออนลงตาม§Yกฎหมายเกณฑทหาร§!ของคุณ ยิ่งกฎหมายเกณฑทหารอยูในระดับตํ่า ผลดานบวกก็ยิ่งแรง ในทางกลับกัน ยิ่งอยูในระดับสูง ผลก็ยิ่งแยลง\n\nที่ระดับ §Y$disarmed_nation$§! ไดรับ:"
  SIA_national_savings_bond_scraping_the_barrel: "ที่ระดับ §Y$scraping_the_barrel$§! ไดรับ:"
  SIA_national_savings_bond_volunteer_only: "ที่ระดับ §Y$volunteer_only$§! ไดรับ:"
  SIA_national_savings_bond_limited_conscription: "ที่ระดับ §Y$limited_conscription$§! ไดรับ:"
  SIA_national_savings_bond_extensive_conscription: "ที่ระดับ §Y$extensive_conscription$§! ไดรับ:"
  SIA_national_savings_bond_service_by_requirement: "ที่ระดับ §Y$service_by_requirement$§! ไดรับ:"
  SIA_national_savings_bond_all_adult_serve: "ที่ระดับ §Y$all_adults_serve$§! ไดรับ:"
  SIA_national_savings_bond_current: "กฎหมายระดมพลปจจุบันของเราจะให:"
  SIA_deficit_spending: "การใชจายแบบขาดดุล"
  SIA_deficit_spending_desc: "การทําบัญชีแบบอนุรักษนิยมจะไมสามารถสรางเศรษฐกิจสมัยใหมไดทันรับมือกับโลกที่อันตราย รัฐตองยอมใชจายลวงหนากอนรายไดที่มีอยู โดยใชโครงการสาธารณะและการจัดซื้อจัดจางผลักดันใหอุตสาหกรรมเติบโต"
  SIA_deficit_spending_tt: "เมื่อจิตวิญญาณหมดเวลาจะไดรับ:"
  SIA_acquire_light_tools: "จัดหาเครื่องมือเบา"
  SIA_acquire_light_tools_desc: "กอนที่เราจะผลิตเครื่องจักรขนาดใหญได เราตองเชี่ยวชาญเครื่องมือพื้นฐานของอุตสาหกรรมเสียกอน การนําเขาเครื่องมือเบาและอุปกรณโรงชางจะทําใหโรงงานขนาดเล็กและรานซอมผุดขึ้นทั่ว[ROOT.GetName]"
  SIA_railway_and_port_extensions: "ขยายทางรถไฟและทาเรือ"
  SIA_railway_and_port_extensions_desc: "ขาว ไม และดีบุกไรคาหากไปไมถึงตลาด การขยายทางรถไฟและทาเรือจะดึงหัวเมืองเขาสูการคาของชาติ และเชื่อม[ROOT.GetNameDef]เขากับโลกกวาง"
  SIA_mechanization_of_agriculture: "การใชเครื่องจักรในการเกษตร"
  SIA_mechanization_of_agriculture_desc: "แรงงานจํานวนมากยังผูกติดอยูกับการเพาะปลูกแบบดั้งเดิม ซึ่งใหผลผลิตสวนเกินแกอุตสาหกรรมเพียงเล็กนอย การนําเครื่องมือและเครื่องจักรสมัยใหมเขาสูชนบทจะเพิ่มผลผลิตและปลดปลอยแรงงานสูโรงงาน"
  SIA_irrigation: "การชลประทาน"
  SIA_irrigation_desc: "ชะตาชีวิตของชาวนายังขึ้นลงตามนํ้าทวมและภัยแลง ระบบชลประทานที่กวางขวางขึ้นจะทําใหผลผลิตมั่นคง ขยายพื้นที่เพาะปลูก และทําใหชนบทเปนฐานที่มั่นคงยิ่งขึ้นสําหรับการพัฒนาชาติ"
  SIA_siam_cement_group: "เครือซิเมนต[ROOT.GetName]"
  SIA_siam_cement_group_desc: "เครือซิเมนต[ROOT.GetName]ซึ่งกอตั้งขึ้นภายใตพระบรมราชูปถัมภ เปนหนึ่งในกิจการอุตสาหกรรมที่สําคัญที่สุดของ[ROOT.GetNameDef] ดวยการลงทุนอยางตรงจุดและการสนับสนุนจากรัฐบาล บริษัทนี้จะเปลี่ยนจากผูผลิตปอนตลาดในประเทศใหกลายเปนเสาหลักของกําลังการผลิตทางอุตสาหกรรมของเรา — วางรากฐานใหอนาคตของชาติอยางแทจริงตามตัวอักษร"
  SIA_chemical_imports: "นําเขาเคมีภัณฑ"
  SIA_chemical_imports_desc: "ทั้งการเกษตรและอุตสาหกรรมสมัยใหมลวนตองพึ่งพาสารประกอบที่เรายังผลิตไดไมเพียงพอ การนําเขาเคมีภัณฑจะชวยจัดหาปุย ยารักษาโรค สียอม และวัตถุระเบิด จนกวาอุตสาหกรรมในประเทศจะรับหนาที่นี้ได"
  SIA_chemical_imports_tt: "เพิ่ม§Yโรงงานพลเรือน§!นอกแผนที่ §G+1§! แหง หากความสัมพันธสูงกวา §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! เมื่อแผนยุทธศาสตรนี้เสร็จสิ้น"

  INS_chemical_imports_stolen_tt: "เพิ่มยุทโธปกรณทหารราบ §G[?var:ROOT.INS_guns_from_seek_help_focus]§! หนวย หากความสัมพันธสูงกวา §Y75§! เมื่อแผนยุทธศาสตรนี้เสร็จสิ้น"

  SIA_foreign_currency_exchange: "การแลกเปลี่ยนเงินตราตางประเทศ"
  SIA_foreign_currency_exchange_desc: "การพัฒนาอุตสาหกรรมตองอาศัยเครื่องจักร ยารักษาโรค และเชื้อเพลิงจากตางประเทศ ซึ่งซื้อไดดวยเงินตราตางประเทศอันมีจํากัดเทานั้น ระบบควบคุมการแลกเปลี่ยนเงินตราจะชี้นําเงินทุนตางประเทศไปสูอุตสาหกรรมที่สําคัญยิ่งตอรัฐ"
  SIA_farmers_into_the_city: "ชาวนาเขาเมือง"
  SIA_farmers_into_the_city_desc: "เศรษฐกิจสมัยใหมไมอาจอยูไดดวยแรงงานในหมูบานเพียงอยางเดียว เมื่ออุตสาหกรรมขยายตัว รัฐตองสงเสริมการยายถิ่นอยางเปนระเบียบจากทองนาสูเมือง เพื่อกอรางแรงงานในเมืองกลุมใหม"
  SIA_textile_mills: "โรงงานทอผา"
  SIA_textile_mills_desc: "ผาเปนสิ่งจําเปนในชีวิตประจําวัน แตสวนใหญกลับทอในตางประเทศแลวขายกลับมาใหเรา โรงงานทอผาจะทดแทนสินคานําเขา สรางงานใหแรงงานในเมือง และมอบอุตสาหกรรมพื้นฐานแหงชีวิตสมัยใหมใหแก[ROOT.GetNameDef]"
  SIA_public_credit: "สินเชื่อภาครัฐ"
  SIA_public_credit_desc: "ทั้งพอคา เกษตรกร และผูผลิตลวนถูกจํากัดดวยการเขาถึงเงินทุนที่มีนอย การขยายสินเชื่อภาครัฐจะทําใหรัฐบาลปลอยกูในที่ที่เงินทุนเอกชนลังเล และผลักดันการพัฒนาเขาสูภาคสวนที่ถูกละเลย"
  SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ มีผลมาแลวอยางนอย §Y180 วัน§!"
  SIA_a_modern_economy: "เศรษฐกิจสมัยใหม"
  SIA_a_modern_economy_desc: "ระเบียบสังคมเกษตรแบบเกาไมไดหายไปในวันเดียว แตก็ไมอาจกําหนดอนาคตของ[ROOT.GetNameDef]ไดอีกตอไป เมื่อธนาคาร โรงเรียน โรงงาน และโครงสรางพื้นฐานเริ่มเปนรูปเปนราง เราก็เริ่มสรางเศรษฐกิจที่คูควรกับชาติสมัยใหมที่มีเอกราช"
  SIA_reduction_of_agricultural_yield_taxes: "ลดภาษีผลผลิตทางการเกษตร"
  SIA_reduction_of_agricultural_yield_taxes_tt: "ลด§Yสินคาอุปโภคบริโภค§!จาก $idea_SIA_agricultural_tax_reduction$ ลง §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! ทุกเดือน และเพิ่ม§Yเสถียรภาพ§! §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! ทุกเดือน จนกวาผลลบดาน§Yสินคาอุปโภคบริโภค§!จะเหลือ §Y0%§!\n\nเมื่อจิตวิญญาณถูกนําออกจะไดรับ:\n"
  SIA_reduction_of_agricultural_yield_taxes_desc: "เราไมอาจขอใหชาวนาเลี้ยงดูทั้งราชอาณาจักร แบกภาระการคลังของรัฐ และอดทนตอความยากลําบากทุกอยางโดยไมมีการบรรเทาเลย การลดภาษีผลผลิตทางการเกษตรจะเหลือผลผลิตสวนเกินไวในชนบทมากขึ้น เสริมความจงรักภักดีของชาวนา และกระตุนใหผืนดินใหผลผลิตมากขึ้น"
  SIA_fuel_oil_act: "พระราชบัญญัตินํ้ามันเชื้อเพลิง"
  SIA_fuel_oil_act_desc: "การคมนาคม อุตสาหกรรม และการปองกันประเทศสมัยใหมลวนพึ่งพาเชื้อเพลิง แตการเขาถึงเชื้อเพลิงอาจถูกตัดขาดในยามสงคราม พระราชบัญญัตินํ้ามันเชื้อเพลิงจะทําใหการบริโภค การเก็บสํารอง และการจัดสรรในยามฉุกเฉินอยูภายใตการกํากับของรัฐอยางเขมงวดขึ้น เพื่อไมใหเสบียงอันมีจํากัดถูกใชอยางสิ้นเปลือง"
  SIA_siam_electricity_company: "บริษัทไฟฟาสยาม"
  SIA_siam_electricity_company_desc: "ไมมีเศรษฐกิจใดทนแรงกดดันของยุคสมัยใหมไดหากปราศจากไฟฟาที่เชื่อถือได การเสริมความแข็งแกรงใหบริษัทไฟฟาสยามจะชวยขยายกําลังการผลิตไฟฟา ปรับปรุงการประสานงาน และทําใหโรงชาง คลังสินคา และเมืองตาง ๆ มีไฟฟาใชแมในยามยากลําบาก"
  SIA_revise_the_taxation_system: "ปรับปรุงระบบภาษีอากร"
  SIA_revise_the_taxation_system_desc: "โครงสรางภาษีในปจจุบันไมเหมาะกับรัฐที่กําลังเตรียมพรอมรับความยากลําบากและพึ่งพาตนเอง ระบบที่ปรับปรุงใหมจะจัดเก็บรายไดอยางทั่วถึงขึ้น ลดความสิ้นเปลือง และกระจายภาระดานการปองกันประเทศและการพัฒนาอยางมีวินัยยิ่งขึ้น"
  SIA_census_the_hill_tribes: "สํารวจสํามะโนประชากรชาวเขา"
  SIA_census_the_hill_tribes_desc: "พื้นที่สูงยังอยูนอกเหนือการเขาถึงของการปกครอง การจัดเก็บภาษี และการสงกําลังบํารุงอยางเต็มที่ การสํารวจสํามะโนประชากรอยางถูกตองจะใหขอมูลที่รัฐบาลจําเปนตองใชในการปกครองภูมิภาคเหลานี้อยางมีประสิทธิภาพยิ่งขึ้น และดึงผูคนและทรัพยากรของพวกเขาเขาสูวิถีชีวิตของชาติ"
  SIA_increase_rice_exports: "เพิ่มการสงออกขาว"
  SIA_increase_rice_exports_desc: "ขาวคือแหลงรายไดจากตางประเทศที่แนนอนที่สุดของ[ROOT.GetNameDef] การขยายการสงออกขณะที่ตลาดยังเปดอยูจะชวยใหเราสะสมทุนสํารอง จัดหาเงินซื้อสินคานําเขาทางยุทธศาสตร และเตรียมทองพระคลังใหพรอมรับความปนปวนที่อาจมาถึง"
  SIA_pad_thai: "ผัดไทย"
  SIA_pad_thai_desc: "ชาติสมัยใหมไมไดยืนหยัดอยูไดดวยกระทรวงและโรงงานเทานั้น แตยังรวมถึงวิถีปฏิบัติรวมกันที่ผูกพันประชาชนเขาดวยกัน การสงเสริมอาหารประจําชาติที่ทําจากเสนขาวและวัตถุดิบของสยามจะกระตุนการบริโภคภายในประเทศ สนับสนุนชาวนาของเรา และลดการพึ่งพาอาหารตางชาติในยามที่ไมแนนอน"
  SIA_rice_husk_steam_turbines: "กังหันไอนํ้าเชื้อเพลิงแกลบ"
  SIA_rice_husk_steam_turbines_desc: "สิ่งที่ชาวตางชาติมองวาเปนของเหลือทิ้ง ความจําเปนไดสอนใหเราเห็นคุณคา การเผาแกลบเพื่อผลิตไอนํ้าจะทําใหเราไดพลังงานจากผลผลิตของเราเอง และลดการพึ่งพาถานหินและนํ้ามันนําเขา"
  SIA_domestic_tin_smelters: "โรงถลุงดีบุกในประเทศ"
  SIA_domestic_tin_smelters_desc: "เพียงขุดแรจากดินแลวสงไปตางประเทศนั้นไมเพียงพออีกตอไป การสรางโรงถลุงดีบุกในประเทศจะเก็บมูลคาของทรัพยากรไวในบานเรามากขึ้น และทําใหเรามีโลหะทางอุตสาหกรรมที่จําเปนทั้งตอการคาและการสงคราม"
  SIA_use_ships_as_generators: "ใชเรือเปนเครื่องกําเนิดไฟฟา"
  SIA_use_ships_as_generators_tt: "การจอด§Yเรือหลัก§!ของเราไวใน§Yทาเรือของรัฐที่เปนดินแดนหลัก§! จะใหโบนัสการใชพลังงานของโรงงาน §G-2%§! ตอ§Yเรือหลัก§! 1 ลํา สูงสุดรวม §G-15%§!\n\nหากเรือเหลานี้ออกจากทา โบนัสจะลดลงในจํานวนเทากัน และจะไดคืนเมื่อนําเรือกลับเขาทาอีกครั้ง"
  SIA_use_ships_as_generators_desc: "แมแตเรือเกาที่ไมเหมาะแกการรบหรือการคาแลวก็ยังรับใชชาติได การจอดเรือไวเปนโรงไฟฟาลอยนํ้าจะชวยจายไฟฟาฉุกเฉินใหทาเรือและอุตสาหกรรมชายฝง พรอมกับประหยัดเชื้อเพลิงและโครงสรางพื้นฐานอันมีคา"
  SIA_diversity_foreign_reserves: "กระจายทุนสํารองระหวางประเทศ"
  SIA_diversity_foreign_reserves_desc: "เปนเรื่องอันตรายที่[ROOT.GetNameDef]จะฝากความมั่นคงทางการเงินไวกับเงินตราหรือเครดิตของมหาอํานาจตางชาติเพียงชาติเดียว การกระจายทุนสํารองจะลดความเสี่ยงจากแรงกระแทกภายนอก และรักษาเสรีภาพในการดําเนินการดานการคาและการทูตไดมากขึ้น"
  SIA_diversity_foreign_reserves_tt: "เพิ่ม§Yโรงงานทหาร§!นอกแผนที่อีก §G2§! แหงเมื่อเขาสูสงคราม\nเพิ่มกําลังผลิตเหล็กกลา §G8§! ในรัฐที่เปนดินแดนหลักแบบสุมเมื่อเขาสูสงคราม"
  SIA_exclusivity_resource_contract: "สัญญาสัมปทานทรัพยากรแตเพียงผูเดียว"
  SIA_exclusivity_resource_contract_desc: "หุนสวนตางชาติรายหนึ่งเสนอเงินทุนและรับประกันการรับซื้อ แลกกับสิทธิพิเศษในการเขาถึงทรัพยากรของเรา สัญญาผูกขาดเชนนี้อาจเรงการพัฒนาใหเร็วขึ้น แตก็ผูกอนาคตสวนหนึ่งของ[ROOT.GetNameDef]ไวกับความตองการของชาติอื่น"
  SIA_maintain_resource_independence: "รักษาความเปนอิสระดานทรัพยากร"
  SIA_maintain_resource_independence_desc: "สัญญากับตางชาติอาจนําผลกําไรมาอยางรวดเร็ว แตการพึ่งพาก็ตามมาติด ๆ การรักษาอํานาจควบคุมทรัพยากรของเราไวจะทําใหเรามีอิสระในการใชทรัพยากรตามความจําเปนของสยาม มิใชตามความตองการของตางชาติ"
  SIA_kasetsart_university: "มหาวิทยาลัยเกษตรศาสตร"
  SIA_kasetsart_university_desc: "หากการเกษตรจะมีผลิตภาพมากขึ้น ก็ตองอาศัยวิทยาศาสตรเปนแนวทาง มิใชเพียงความรูที่สืบทอดกันมา มหาวิทยาลัยเกษตรศาสตรจะผลิตนักวิชาการเกษตร สัตวแพทย และผูเชี่ยวชาญดานเทคนิคเพื่อพัฒนาผืนแผนดินใหทันสมัย"
  SIA_mahidol_university: "มหาวิทยาลัยมหิดล"
  SIA_mahidol_university_desc: "รัฐสมัยใหมตองการแพทย นักวิจัย และนักบริหาร ไมนอยไปกวาทหารและวิศวกร มหาวิทยาลัยมหิดลจะเสริมความเขมแข็งใหการอุดมศึกษา และผลิตบุคลากรที่ผานการฝกฝนซึ่งจําเปนตอการปฏิรูปประเทศ"
  SIA_silpakorn_university: "มหาวิทยาลัยศิลปากร"
  SIA_silpakorn_university_desc: "TODO_CM"
  SIA_contingency_funds: "กองทุนสํารองฉุกเฉิน"
  SIA_contingency_funds_desc: "ความรุงเรืองในยามสงบมีคานอยนิดหากรัฐเผชิญวิกฤตโดยไมไดเตรียมพรอม การกันเงินไวเปนกองทุนสํารองฉุกเฉินตั้งแตวันนี้จะทําใหการปดลอม พืชผลเสียหาย หรือสงครามที่ปะทุขึ้นอยางกะทันหัน ไมทําใหกลไกของรัฐบาลหยุดชะงักในทันที"
  SIA_contingency_funds_tt: "เราจะสะสมกองทุนสํารองฉุกเฉินในยามสงบ ระหวางสะสมกองทุนนี้ เราจะไดรับ§Yสัดสวนสินคาอุปโภคบริโภค§!ในระดับปานกลาง\n\nในยามสงคราม เราสามารถเลือกปลอยกองทุนนี้ออกมาเพื่อรับโบนัสการผลิตขนาดใหญ\nกองทุนจะอยูไดนานเพียงใดขึ้นอยูกับระยะเวลาที่เราสะสมไวกอนปลอยออกมา"
  SIA_prepare_for_the_next_blockade: "เตรียมรับการปดลอมครั้งตอไป"
  SIA_prepare_for_the_next_blockade_desc: "หากทองทะเลกลายเปนปรปกษ [ROOT.GetNameDef]อาจถูกตัดขาดจากตลาด เครื่องจักร และเชื้อเพลิง ดังนั้นเราตองเตรียมรับการปดลอมครั้งตอไปตั้งแตบัดนี้ ดวยการสะสมเสบียง วางแผนฉุกเฉิน และหาสิ่งทดแทน กอนที่ความจําเปนจะบีบบังคับเรา"
  SIA_domestic_arms_industry: "อุตสาหกรรมอาวุธในประเทศ"
  SIA_domestic_arms_industry_desc: "ราชอาณาจักรที่ตองนําเขาปนเล็กยาวและกระสุนปนใหญทุกนัดไมอาจเรียกตนเองวามั่นคงได แมจะเริ่มตนอยางเรียบงายเพียงใด อุตสาหกรรมอาวุธในประเทศจะทําให[ROOT.GetNameDef]ติดอาวุธใหทหารจากโรงงานของตนเอง และยืนหยัดไดเมื่อการสงกําลังจากตางชาติขาดหาย"
  SIA_war_material_substitutions: "วัสดุทดแทนยุทธปจจัย"
  SIA_war_material_substitutions_desc: "ในยามถูกปดลอม วัสดุที่สมบูรณแบบมีคานอยกวาวัสดุที่หาได เราตองศึกษาสิ่งทดแทนโลหะ สารเคมี และชิ้นสวนนําเขา เพื่อใหการผลิตดําเนินตอไปไดแมสินคาจากตางประเทศจะไมมาถึงชายฝงของเราอีก"
  SIA_royal_thai_ordnance_factory: "โรงงานสรรพาวุธหลวง"
  SIA_royal_thai_ordnance_factory_desc: "รัฐที่มั่นคงตองมีมากกวาอาวุธนําเขาและโรงซอมที่กระจัดกระจาย โรงงานสรรพาวุธหลวงจะรวมความชํานาญ เครื่องจักร และการกํากับดูแลไวภายใตองคพระมหากษัตริย ทําให[ROOT.GetNameDef]มีศูนยกลางถาวรสําหรับการผลิตอาวุธและกระสุน"
  SIA_built_to_withstand_every_flame: "สรางใหทนทานตอเปลวไฟทุกชนิด"
  SIA_built_to_withstand_every_flame_desc: "โรงงานที่มอดไหมในคืนเดียวยอมรับใชชาติไมไดในเชาวันรุงขึ้น คลังสินคา โรงสี และโรงชางของเราตองสรางโดยคํานึงถึงการกระจายที่ตั้ง การปองกันอัคคีภัย และการปองกันในยามฉุกเฉิน เพื่อไมใหการกอวินาศกรรม การทิ้งระเบิด หรืออุบัติเหตุทําใหการผลิตหยุดชะงักไดงาย ๆ"
  SIA_the_army_of_siam: "กองทัพสยาม"
  SIA_the_army_of_siam_desc: "โครงสรางเดิมของกองทัพเราไมตอบสนองความตองการของยุคสมัยอีกตอไป หาก[ROOT.GetName]จะปกปองอธิปไตยและแสดงผลประโยชนของตนในตางแดน เราตองสรางกองทัพสมัยใหมที่มีอาวุธ การฝก และการจัดระเบียบพรอมสําหรับสงครามที่กําลังกอตัวขึ้นทั่วโลก"
  SIA_plan_for_a_short_war: "วางแผนสําหรับสงครามระยะสั้น"
  SIA_plan_for_a_short_war_desc: "ทรัพยากรของเรามีจํากัด แตศัตรูของเราอาจมีมากมาย [ROOT.GetNameDefCap]ไมอาจแบกรับการสูรบยืดเยื้อแบบบั่นทอนกําลังได หากสงครามมาถึง ก็ตองรวดเร็ว เด็ดขาด และจบลงกอนที่ศัตรูจะรวบรวมกําลังได"
  SIA_plan_for_a_short_war_tt: "ครั้งแรกที่ §Y[SIA.GetName]§! โจมตีประเทศอื่นจะไดรับ"
  SIA_plan_for_a_short_war_tt2: "เปนเวลา §Y90 วัน§!\n\nเมื่อจิตวิญญาณนี้หมดเวลาจะไดรับ:"
  SIA_plan_for_a_short_war_tt3: "เปนเวลา §Y90 วัน§!"
  SIA_intermediate_war_preparation: "เตรียมพรอมสงครามระยะกลาง"
  SIA_intermediate_war_preparation_desc: "การเตรียมพรอมเพียงสําหรับการรบแบบสายฟาแลบเปนเรื่องอันตราย แตการจัดทุกอยางไวสําหรับการตอสูไมรูจบก็สิ้นเปลือง หลักนิยมที่สมดุลจะทําให[ROOT.GetName]โจมตีไดอยางดุดัน ขณะที่ยังคงความอดทนที่จําเปนตอการเผชิญศัตรูที่ดื้อรั้นกวา"
  SIA_prepare_for_a_long_war: "เตรียมพรอมสงครามยืดเยื้อ"
  SIA_prepare_for_a_long_war_desc: "มหาอํานาจอาจตัดสินสงครามไดภายในไมกี่เดือน แตชาติเล็กมักถูกบีบใหตองทนสูนานหลายป ดังนั้นเราตองเตรียมกองทัพ อุตสาหกรรม และการขนสงของ[ROOT.GetAdjective]ใหพรอมสําหรับความขัดแยงยืดเยื้อที่ความอดทนและความยืดหยุนสําคัญไมแพความกลาหาญ"
  SIA_specialized_warfare: "การสงครามเฉพาะทาง"
  SIA_specialized_warfare_desc: "ภูมิประเทศในภูมิภาคของเราไมเอื้อตอกองทัพที่เหมือนกันทั้งหมด ภูเขา ปาดงดิบ และที่ราบลุมแมนํ้าตางตองการทักษะที่แตกตางกัน การพัฒนาหนวยทหารเฉพาะทางจะทําให[ROOT.GetNameDef]เผชิญหนาศัตรูดวยกําลังที่เหมาะสมในทุกสมรภูมิ"
  SIA_artillery_reigns_supreme: "ปนใหญคือราชันแหงสนามรบ"
  SIA_artillery_reigns_supreme_desc: "การรบสมัยใหมไมอาจชนะไดดวยขวัญกําลังใจเพียงอยางเดียว ปนใหญยังคงเปนราชาแหงสนามรบ ทําลายที่มั่นแข็งแรง บดขยี้การบุก และเปดทางใหทหารราบของเรา หากเราจะไดชัย อํานาจการยิงของ[ROOT.GetAdjective]ตองทั้งมากมายและแมนยํา"
  SIA_yield_the_air_war: "ยอมถอยในสงครามทางอากาศ"
  SIA_yield_the_air_war_desc: "เราไมอาจหวังทาทายมหาอํานาจบนทองฟาอยางเทาเทียมได แทนที่จะสิ้นเปลืองทรัพยากรอันมีคาไปกับการแขงขันที่เราไมนาจะชนะ เราจะเสริมการปองกันภัยทางอากาศ และไมปลอยใหอากาศยานขาศึกโจมตีทหารและเมืองของเราไดโดยไมตองจายราคา"
  SIA_camouflage: "การพรางตัว"
  SIA_camouflage_desc: "หากเราครองทองฟาไมได เราก็จะไมใหขาศึกพบสิ่งใดที่คุมคาแกการโจมตีเบื้องลาง ตาขายพราง การกระจายกําลัง และวินัยในการเคลื่อนพลยามคํ่าคืน จะซอนขบวนทหารของเราจากสายตาเบื้องบน และพลปนที่เราฝกไปพรอมกันจะทําใหทุกเที่ยวบินของขาศึกตองจายแพง"
  SIA_the_thunder_at_the_gates: "อสนีบาตหนาประตูเมือง"
  SIA_the_thunder_at_the_gates_desc: "มีปอมปราการที่ปนธรรมดาทําลายไมได และมีการบุกที่ตองประกาศดวยกําลังอันทวมทน ปนใหญหนัก ปนใหญลอมเมือง และปนใหญรถไฟจะใหพลังแก[ROOT.GetNameDef]ในการทุบประตูเมืองของศัตรูใดก็ตามที่เขาใจผิดวาความยับยั้งชั่งใจของเราคือความออนแอ"
  SIA_night_time_training: "การฝกรบเวลากลางคืน"
  SIA_night_time_training_desc: "การบุกอยางอาจหาญกลางวันแสก ๆ นํามาซึ่งหายนะเมื่อเผชิญศัตรูที่เตรียมพรอม การฝกทหารใหแทรกซึม เคลื่อนที่ และโจมตีภายใตความมืด จะทําใหเราชวงชิงความริเริ่มไดในยามที่ศัตรูมองไมเห็น สับสน และพรอมตอบโตนอยที่สุด"
  SIA_steel_arteries: "เสนเลือดเหล็กกลา"
  SIA_steel_arteries_desc: "ไมมีกองทัพใดเดินทัพไดไกลหากไมมีทางรถไฟและถนนคอยหลอเลี้ยง เสนเลือดเหล็กกลาของชาติตองไดรับการเสริมใหแข็งแรง เพื่อใหลําเลียงทหาร เสบียง และปนใหญไปยังทุกพรมแดนที่ถูกคุกคามไดอยางรวดเร็ว ในงานนี้ ความมั่นคงทางทหารและการพัฒนาชาติดําเนินไปควบคูกัน"
  SIA_prepare_northern_infrastructure_for_war: "เตรียมโครงสรางพื้นฐานภาคเหนือสําหรับสงคราม"
  SIA_prepare_northern_infrastructure_for_war_desc: "เสนทางเขาสูภาคเหนือจะกลายเปนจุดสําคัญยิ่งในการตอสูกับพมาและผูที่หนุนหลังพมา ถนน ทางรถไฟ และคลังเสบียงในภูมิภาคนั้นตองขยายโดยทันที เพื่อใหกองกําลังของ[ROOT.GetAdjective]รุกหรือตั้งรับที่นั่นไดโดยไมชักชา"
  SIA_unconventional_tank_construction: "การสรางรถถังนอกแบบ"
  SIA_unconventional_tank_construction_desc: "เราไมอาจลอกเลียนโครงการยานเกราะของมหาอํานาจไดทุกกระเบียดนิ้ว หาก[ROOT.GetNameDef]จะมีรถถังประจําการไดเลย เราตองหาวิธีสรางที่ถูกกวาและปรับใชไดงายกวา โดยยอมสละความยิ่งใหญเพื่อแลกกับจํานวนและประโยชนใชสอย"
  SIA_conventional_tank_construction: "การสรางรถถังตามแบบแผน"
  SIA_conventional_tank_construction_desc: "ยานเกราะไดกลายเปนเหลาทัพที่ไดรับการยอมรับในสงครามสมัยใหมแลว และวิธีแกขัดเฉพาะหนาจะพาเราไปไดไมไกลนัก ดังนั้นเราควรสรางอุตสาหกรรมรถถังที่แทจริงบนหลักการที่ถูกตอง แบบมาตรฐาน และวิธีการผลิตที่เชื่อถือได สมกับกองทัพสมัยใหม"
  SIA_reverse_engineer_allied_tanks: "ศึกษายอนกลับรถถังของฝายสัมพันธมิตร"
  SIA_reverse_engineer_allied_tanks_desc: "ชาติอื่นไดแบกรับคาใชจายในการทดลองไปแลว รถถังที่ยึดไดและเครื่องจักรนําเขาสามารถถูกถอดชิ้นสวน ศึกษา และลอกเลียนแบบได การเรียนรูจากแบบของตางชาติจะชวยให[ROOT.GetName]ยนเสนทางสูการมีกองกําลังยานเกราะของตนเอง"
  SIA_tankettes: "รถถังขนาดเล็ก"
  SIA_tankettes_desc: "รถถังขนาดเล็กมีนํ้าหนักเบา ราคาถูก และผลิตงาย แมลําพังมันอาจไมไดตัดสินการรบครั้งใหญ แตก็ยังใชลาดตระเวน รบในสงครามอาณานิคม และสนับสนุนทหารราบได สําหรับชาติที่มีทรัพยากรไมมากนัก ยานเกราะขนาดเล็กเชนนี้คือประตูสูสงครามยานยนตที่ใชไดจริง"
  SIA_jungle_armor: "ยานเกราะปาดงดิบ"
  SIA_jungle_armor_desc: "ปาดงดิบในภูมิภาคของเราไมเหมาะกับเครื่องจักรอุยอายที่ออกแบบมาสําหรับที่ราบของยุโรป หากยานเกราะจะรับใช[ROOT.GetNameDef]ได ก็ตองปรับใหเขากับทางแคบ พื้นดินที่ยํ่าแย และอากาศที่รอนชื้นอบอาว โดยแลกนํ้าหนักกับความคลองตัวในจุดที่ปาดงดิบตองการ"
  SIA_mountain_tanks: "รถถังภูเขา"
  SIA_mountain_tanks_desc: "เนินเขาสูงชันและชองเขาไมอาจปลอยใหเปนภาระของทหารราบเพียงฝายเดียว การพัฒนายานเกราะขนาดกะทัดรัดที่เหมาะกับภูมิประเทศขรุขระ จะทําใหกองทัพของเรานําอํานาจการยิงที่มีเกราะคุมกันเขาไปในพื้นที่ที่รถถังทั่วไปไปไมถึงได"
  SIA_reluctant_submission: "จํายอมอยางฝนใจ"
  SIA_reluctant_submission_desc: "หาก[ROOT.GetNameDef]ถูกศัตรูที่แข็งแกรงกวารุกราน อาจมีสักชวงเวลาที่การตอตานอยางเปดเผยนํามาซึ่งความพินาศเทานั้น การโอนออนนั้นขมขื่น แตบางครั้งรัฐบาลก็ตองยอมเพื่อรักษาชาติไวจากความหายนะ และรอคอยโอกาสที่ดีกวา"
  SIA_reluctant_submission_trigger: "แผนยุทธศาสตรนี้จะเสร็จสิ้นโดยอัตโนมัติหากเราถูกโจมตีและเลือกตัวเลือก§Yจํายอม§!ในเหตุการณ"
  SIA_reluctant_submission_tt: "เราจะสามารถทําสันติภาพกับประเทศมหาอํานาจที่โจมตีเราได แตพวกเขาจะคาดหวังใหเราพิมพเงินให\n§Yสัดสวนโรงงานสินคาอุปโภคบริโภค§!ของเราจะเพิ่มขึ้น §Y[?idea_SIA_printing_money_monthly_change|%]§! ตอเดือน สูงสุด §Y[?idea_SIA_printing_money_monthly_change_max|%]§!\n\nการทําแผนยุทธศาสตร §Y$SIA_thai_rice_company$§! จะลดอัตราการเพิ่มลง §G50%§!\n\nการทําแผนยุทธศาสตร §Y$SIA_demand_repatriation$§! จะทําใหไมตองพิมพเงินอีกตอไป"
  SIA_seri_thai: "เสรีไทย"
  SIA_seri_thai_desc: "การจํายอมไมจําเปนตองหมายถึงการยอมสละจิตวิญญาณของชาติ ภายใตเปลือกนอกของการยึดครองและการยอมตาม ขบวนการใตดินผูจงรักภักดีสามารถจัดตั้งขึ้นเพื่อธํารงอุดมการณแหงเอกราช รวบรวมขาวกรอง และเตรียมพรอมสําหรับวันที่[ROOT.GetName]จะลุกขึ้นอีกครั้ง"
  SIA_contact_the_south_east_asia_command: "ติดตอกองบัญชาการภาคพื้นเอเชียตะวันออกเฉียงใต"
  SIA_contact_the_south_east_asia_command_desc: "หากการตอตานจะเปนมากกวาทาทีอันกลาหาญ ก็ตองผูกเขากับยุทธศาสตรที่กวางกวา การติดตอกับกองบัญชาการฝายสัมพันธมิตรในเอเชียตะวันออกเฉียงใตจะทําใหผูรักชาติแหง[ROOT.GetName]ไดรับคําแนะนํา เสบียง และที่ยืนในการตอสูครั้งใหญ"
  SIA_broadcast_weather_reports_to_the_allies: "สงรายงานสภาพอากาศใหฝายสัมพันธมิตร"
  SIA_broadcast_weather_reports_to_the_allies_desc: "ทองฟาและทองทะเลในภูมิภาคนี้ถูกกําหนดดวยสภาพอากาศไมนอยไปกวากองเรือและกองทัพ รายงานที่เชื่อถือไดจาก[ROOT.GetNameDef]จะชวยการวางแผนของฝายสัมพันธมิตร ปกปองปฏิบัติการของพวกเขาจากการถูกจูโจมโดยไมคาดคิด และทําใหมาตุภูมิของเราเปนหุนสวนที่เงียบงันแตมีคุณคาในสงครามของพวกเขา"
  SIA_american_investment_aid: "ความชวยเหลือดานการลงทุนจากอเมริกา"
  SIA_american_investment_aid_desc: "สหรัฐอเมริกามีความมั่งคั่งเหนือกวาสิ่งใดที่หาไดในภูมิภาคของเรา หากเราไดรับความชวยเหลือและการลงทุนจากอเมริกาสําหรับภารกิจลับและภารกิจของชาติ [ROOT.GetNameDef]จะมีปจจัยทางวัตถุที่จะอดทนตอความยากลําบากและเตรียมพรอมสูการปลดปลอย"
  SIA_thai_students_in_the_oss: "นักเรียนไทยใน OSS"
  SIA_thai_students_in_the_oss_desc: "คนหนุมสาวรุนใหมผูรักชาติสามารถไปฝกฝนในตางแดนดานการจารกรรม การกอวินาศกรรม และการสงครามนอกแบบ การสงนักเรียนไทยที่ไววางใจไดเขาสูเครือขายหนวยขาวกรองของฝายสัมพันธมิตร จะเตรียมผูรับใชชาติที่มีความสามารถไวสําหรับสงครามลับที่รออยูขางหนา"
  SIA_prepare_to_drop: "เตรียมการกระโดดรม"
  SIA_prepare_to_drop_desc: "เมื่อชั่วโมงแหงการปลดปลอยมาถึง ฝายสัมพันธมิตรอาจลงสูมาตุภูมิของเราจากฟากฟา ดังนั้นเราตองกําหนดพื้นที่สงลง เตรียมผูประสานงาน และจัดเครือขายสนับสนุน เพื่อใหรับกองกําลังสงทางอากาศและนําไปยังจุดที่ตองการมากที่สุดได"
  SIA_unseat_the_government: "โคนลมรัฐบาล"
  SIA_unseat_the_government_desc: "ระบอบที่ผูก[ROOT.GetNameDef]ไวกับการครอบงําของตางชาติไมอาจปลอยใหดํารงอยูตลอดไป ดวยการตอตาน การวางแผนลับ และการลงมือในจังหวะที่เหมาะสม เราจะขจัดผูที่ทําใหชาติเสื่อมเสีย และฟนฟูรัฐบาลที่คูควรกับสยามยิ่งกวา"
  SIA_unseat_the_government_tt: "[ROOT.GetName]จะออกจากฝายปจจุบันและเปลี่ยนขางในสงคราม โดยเขารวมกับ§Yฝายสัมพันธมิตร§!\n\nฝายภักดีตอรัฐบาลเดิมจะลุกฮือตอตานการเปลี่ยนแปลงนี้ จนเกิดสงครามกลางเมือง\n\nหากแรงสนับสนุนรวมของเรา§Yมากกวา 80%§! เราจะโคนรัฐบาลไดและหลีกเลี่ยงสงครามกลางเมือง แรงสนับสนุนรวมของเราได §Y5%§! ตอนายพลที่โนมนาวไดแตละคน บวกกับแรงสนับสนุนฝายประชาธิปไตย\n\nแรงสนับสนุนจากนายพลที่โนมนาวไดของเราคือ §Y[?var:SIA_seri_thai_cw_scale|%]§! และแรงสนับสนุนฝายประชาธิปไตยคือ §Y[?var:party_popularity@democratic|%]§!"
  SIA_choose_new_leader_tt: "เมื่อระบอบเกาลมสลาย ผูชนะตองเลือกวาใครจะเปนผูนํารัฐบาลใหม"
  SIA_the_phayap_army: "กองทัพพายัพ"
  SIA_the_phayap_army_desc: "หากเราฝากชะตากรรมไวกับผูรุกราน กองทัพของเราก็ตองมีที่ทางในระเบียบสงครามใหม กองบัญชาการสนามสําหรับปฏิบัติการทางตะวันตกและทางเหนือโดยเฉพาะ จะทําให[ROOT.GetName]รุกคืบเคียงขางหุนสวนผูทรงพลัง และแสวงหาผลประโยชนของตนเอง"
  SIA_securing_the_rubber_islands: "ยึดครองหมูเกาะยางพารา"
  SIA_securing_the_rubber_islands_desc: "ยางคือเสนเลือดใหญของสงครามสมัยใหม ใชทํายางรถ ปะเก็น และอุปกรณนับไมถวนในสงครามยานยนต ดินแดนที่อุดมดวยทรัพยากรทางใตของเราเปนทั้งโอกาสและความจําเปน เราควรเคลื่อนไหวเพื่อยึดครองไวกอนผูอื่น"
  SIA_breaking_the_burmese_line: "ทลายแนวรบพมา"
  SIA_breaking_the_burmese_line_desc: "พมาเปนกําแพงกั้นระหวางความทะเยอทะยานของเรากับดินแดนที่อยูไกลออกไป หากกองทัพของ[ROOT.GetAdjective]จะพิสูจนคุณคาของตน แนวรบของขาศึกที่นั่นตองถูกทลายดวยความมุงมั่น การวางแผน และการใชกําลังอยางรวมศูนย"
  SIA_pacific_war: "สงครามมหาเอเชียบูรพา"
  SIA_pacific_war_desc: "ความขัดแยงในเอเชียตะวันออกไมอาจถือเปนเรื่องไกลตัวไดอีกตอไป สงครามในแปซิฟกกําลังกําหนดชะตากรรมของทุกชาติในภูมิภาค และ[ROOT.GetNameDef]ตองตัดสินใจวาจะยืนอยูตรงไหนในการตอสูครั้งนี้ ไมวาจะในฐานะผูตาม หุนสวน หรือเหยื่อ"
  SIA_joint_asian_military_command: "กองบัญชาการทหารรวมแหงเอเชีย"
  SIA_joint_asian_military_command_desc: "ความพยายามของเราจะแข็งแกรงขึ้นหากประสานกับหุนสวนในภูมิภาค โครงสรางกองบัญชาการรวมใหคํามั่นถึงประสิทธิภาพที่มากขึ้น การวางแผนที่ชัดเจนขึ้น และทิศทางรวมกันสําหรับการทัพที่มิฉะนั้นอาจสูญเปลาไปกับการแขงขันและความสับสน"
  SIA_demand_repatriation: "เรียกรองคาชดใช"
  SIA_demand_repatriation_desc: "ผูที่เขามาในแผนดินของเราโดยอางความจําเปนไดติดหนี้[ROOT.GetNameDef]ไว เมื่อโชคชะตาของเราดีขึ้น เราควรเรียกรองสิ่งที่ถูกเอาไปคืน และกดดันใหผูยึดครองชดใชคาเสียหายจากการรุกลํ้าของตน"
  SIA_standing_our_ground: "ยืนหยัดไมถอย"
  SIA_standing_our_ground_desc: "ถึงจุดหนึ่ง การถอยและการเจรจามีแตจะนําความอัปยศมาเพิ่ม [ROOT.GetNameDefCap]ตองแสดงใหเห็นวายังมีเจตจํานงที่จะยืนหยัด ตอสู และขับไลผูที่คิดวาจะกําหนดชะตากรรมของเราไดดวยปลายกระบอกปน"
  SIA_standing_our_ground_trigger: "แผนยุทธศาสตรนี้จะเสร็จสิ้นโดยอัตโนมัติหากเราถูกโจมตีและเลือกตัวเลือก§Yตอตาน§!ในเหตุการณ"
  SIA_ask_for_the_release_of_american_commodities: "ขอใหปลอยสินคาของอเมริกา"
  SIA_ask_for_the_release_of_american_commodities_desc: "คลังสินคา เครื่องจักร และสินคาของอเมริกาอาจเปนชองหายใจที่ชาติของเราตองการ ดวยการทูตอยางรอบคอบ เราสามารถขอใหปลอยสินคาเหลานั้น เพื่อบรรเทาการขาดแคลนและเสริมรากฐานทางวัตถุของความพยายามในสงคราม"
  SIA_japanese_fighters: "เครื่องบินขับไลญี่ปุน"
  SIA_japanese_fighters_desc: "แมอุตสาหกรรมการบินของเราเองจะยังเล็กนอย แตอากาศยานตางชาติชวยอุดชองวางได เครื่องบินขับไลญี่ปุนในมือของ[ROOT.GetAdjective]อยางนอยก็จะใหกําลังทางอากาศสมัยใหมแกเราในระดับหนึ่ง แมจะอยูในขีดจํากัดที่ความออนแอทางอุตสาหกรรมของเรากําหนดไว"
  SIA_get_off_our_shores: "ออกไปจากแผนดินของเรา"
  SIA_get_off_our_shores_desc: "การมีทหารตางชาติอยูบนผืนแผนดินสยามเปนการหยามเกียรติที่ไมมีขออางใดทําใหเบาลงได ไมวาจะดวยกําลังอาวุธหรือแรงกดดันจากเหตุการณในตางแดน เราตองยืนกรานใหผูรุกรานออกไปจากแผนดินของเรา และคืนศักดิ์ศรีแก[ROOT.GetNameDef]\n\nพวกมันคือคนขลาด เหมือนคนโหดรายทั้งปวง บัดนี้ จงออกไปจากแผนดินของเรา"
  SIA_singaporean_reinforcements: "กําลังเสริมจากสิงคโปร"
  SIA_singaporean_reinforcements_desc: "การตอสูในมลายูและดินแดนที่ไกลออกไปแยกไมออกจากความมั่นคงของเราเอง กําลังเสริมจากกองกําลังที่รวมตัวอยูรอบสิงคโปรจะชวยหนุนแนวรบของเรา ขยายความรวมมือกับฝายสัมพันธมิตร และผูกพื้นที่การรบนี้เขาดวยกันภายใตจุดมุงหมายรวม"
  modify_SIA_directorate_of_aeronautical_engineering: "ปรับ§Yกรมชางอากาศ§!ดังนี้:"
  SIA_aid_for_resources: "ความชวยเหลือแลกทรัพยากร"
  SIA_aid_for_resources_desc: "ชาติของเรามีทรัพยากรที่มหาอํานาจตางชาติตองการ แตขาดเครื่องมือบางอยางที่พวกเขาจัดหาใหได การแลกเปลี่ยนความชวยเหลือกับวัตถุดิบอยางรอบคอบจะทําให[ROOT.GetNameDef]มีเสบียงเพียงพอ และทําใหความมั่งคั่งของเราชวยรักษาตัวเราเอง"
  SIA_aid_for_resources_tt: "เราจะขอให[JAP.GetNameDef]เขารวมสงครามของเรา แลกกับการใหสิทธิ์ในทรัพยากรยางใน §Y[724.GetName]§!"
  SIA_how_quickly_the_tables_turn: "สถานการณพลิกผันรวดเร็วเพียงใด"
  SIA_how_quickly_the_tables_turn_desc: "ผูที่เคยมองวา[ROOT.GetNameDef]ออนแอและวานอนสอนงาย อาจไดพบวาดุลอํานาจกลับตาลปตร โชคชะตาในสงครามพลิกผันไดรวดเร็ว และเราตองพรอมควาโอกาสเมื่อผูกดขี่ของเราเพลี่ยงพลํ้า และสถานการณพลิกกลับไปเลนงานพวกเขาในที่สุด"
  SIA_how_quickly_the_tables_turn_trigger: "เราถูกมหาอํานาจโจมตี และทําใหมหาอํานาจนั้นยอมจํานนได"
  SIA_royal_thai_navy: "กองทัพเรือ"
  SIA_royal_thai_navy_desc: "การปองกัน[ROOT.GetNameDef]ไมไดสิ้นสุดที่ชายฝง ชายฝง แมนํ้า และการคาทางทะเลของเราตองการกองเรือที่คูควรกับราชอาณาจักร การเสริมความแข็งแกรงใหกองทัพเรือจะทําใหสยามยังคงเปนเจาแหงนานนํ้าของตนเอง"
  modify_royal_thai_navy: "ปรับ §Y$idea_SIA_thai_royal_navy$§! ดังนี้:"
  SIA_direct_army_fundings_towards_the_navy: "โอนงบประมาณกองทัพบกใหกองทัพเรือ"
  SIA_direct_army_fundings_towards_the_navy_desc: "กองทัพบกไดรับสวนแบงงบประมาณทางทหารกอนใหญมาชานาน ทวาความตองการทางยุทธศาสตรของ[ROOT.GetNameDef]ไมไดอยูบนแผนดินเพียงอยางเดียว การโยกงบประมาณไปใหกองเรือจะชวยแกความไมสมดุลนี้ และปกปองทองทะเลที่คุมครองการคาและชายฝงของเรา"
  SIA_thonburi_class_coastal_defense_ship: "เรือปนยามฝงชั้นธนบุรี"
  SIA_thonburi_class_coastal_defense_ship_desc: "กองเรือขนาดเล็กก็ยังมีเขี้ยวเล็บที่คมกลาได หากออกแบบใหเหมาะกับสภาพทองถิ่น เรือชั้นธนบุรีให[ROOT.GetNameDef]มีเครื่องมือปองกันชายฝงที่ใชไดจริง ดวยอํานาจการยิงที่นาเกรงขามและบทบาทที่เหมาะกับนานนํ้าที่เราตองปกปองอยางเรงดวนที่สุด"
  SIA_acquire_submarines: "จัดหาเรือดํานํ้า"
  SIA_acquire_submarines_desc: "เรือดํานํ้าเปดโอกาสใหกองทัพเรือขนาดเล็กโจมตีไดเกินตัว เรือดํานํ้าซอนอยูใตคลื่น สามารถคุกคามการเดินเรือ ยับยั้งกองเรือที่แข็งแกรงกวา และขัดขวางแผนการใด ๆ ของขาศึกที่มุงตอชายฝงของเรา [ROOT.GetNameDefCap]ไมควรละเลยอาวุธเชนนี้"
  SIA_submarine_day: "วันเรือดํานํ้า"
  SIA_submarine_day_desc: "การนําการสงครามใตนํ้าเขาสูกองเรือของเราสมควรไดรับการยกยองจากสาธารณชนและความกระตือรือรนของชาติ การเฉลิมฉลองหมวดเรือดํานํ้าจะสงเสริมการรับสมัครกําลังพล ยกระดับเกียรติภูมิ และตรึงความคิดไวในใจประชาชนวาสยามกําลังกาวเขาสูยุคใหมทางนาวี"
  SIA_the_thonburi_dockyard_project: "โครงการอูตอเรือธนบุรี"
  SIA_the_thonburi_dockyard_project_desc: "กองทัพเรือไมอาจดํารงอยูไดดวยตัวเรือนําเขาเพียงอยางเดียว หาก[ROOT.GetNameDef]จะบํารุงรักษาและขยายกําลังทางทะเล ก็ตองลงทุนในอูตอเรือ โรงงาน และแรงงาน ซึ่งเปนรากฐานที่แทจริงของแสนยานุภาพทางทะเล"
  SIA_expand_the_slipways: "ขยายคานเรือ"
  SIA_expand_the_slipways_desc: "สิ่งอํานวยความสะดวกในปจจุบันของเราคับแคบเกินไปสําหรับความทะเยอทะยานที่กําลังกอตัว การขยายคานเรือจะเพิ่มขีดความสามารถในการตอและซอมเรือ ทําใหกองเรือเติบโตทั้งขนาดและความพรอมรบ"
  SIA_a_new_drydock: "อูแหงแหงใหม"
  SIA_a_new_drydock_desc: "การซอมบํารุงเรือรบอยางจริงจังตองมีอูแหงที่ทันสมัย หากไมมี การบํารุงรักษาเรือขนาดใหญจะลาชา ไรประสิทธิภาพ และตองพึ่งพาความชวยเหลือจากตางชาติ อูแหงแหงใหมจะทําให[ROOT.GetNameDef]กุมอนาคตทางนาวีของตนไดมั่นคงยิ่งขึ้น"
  SIA_install_heavy_cranes_and_power_plant: "ติดตั้งปนจั่นหนักและโรงไฟฟา"
  SIA_install_heavy_cranes_and_power_plant_desc: "การตอเรือไมใชเพียงเรื่องของไมและเหล็กกลา แตเปนเรื่องของเครื่องจักรและพลังงาน ปนจั่นหนักและไฟฟาที่เชื่อถือไดจะเปลี่ยนอูของเราจากสถานที่แบบหยาบ ๆ ใหเปนเครื่องมือของอุตสาหกรรมสมัยใหมอยางแทจริง"
  SIA_establish_the_foundry_and_machine_shop: "จัดตั้งโรงหลอและโรงกลึง"
  SIA_establish_the_foundry_and_machine_shop_desc: "กองทัพเรือของรัฐอธิปไตยตองการมากกวาตัวเรือที่ประกอบจากชิ้นสวนนําเขา การกอตั้งโรงหลอและโรงกลึงของเราเองจะเสริมกําลังอุตสาหกรรมที่ทําให[ROOT.GetNameDef]หลอ ขึ้นรูป และซอมชิ้นสวนสําคัญของเรือรบไดภายในประเทศ"
  SIA_the_thonburi_arsenal: "คลังสรรพาวุธธนบุรี"
  SIA_the_thonburi_arsenal_desc: "อูตอเรือที่ไมมีอาวุธยังไมสมบูรณ การจัดตั้งคลังสรรพาวุธที่ธนบุรีจะทําใหผลิตและเก็บรักษาปนเรือ กระสุน และยุทโธปกรณที่เกี่ยวของได ผูกกองเรือของเราใหใกลชิดกับอุตสาหกรรมของชาติยิ่งขึ้น"
  SIA_focus_on_commercial_civilian_ships: "มุงเนนเรือพาณิชยพลเรือน"
  SIA_focus_on_commercial_civilian_ships_desc: "ใชวากระดูกงูเรือทุกลําที่วางลงจะตองมีไวเพื่อการรบ เรือสินคา เรือขนสง และเรือพลเรือนอื่น ๆ คือระบบไหลเวียนโลหิตของเศรษฐกิจชาติ การสงเสริมการตอเรือพาณิชยจะชวยให[ROOT.GetNameDef]ทั้งมั่งคั่งและพรอมรับมือยามสงคราม"
  SIA_empower_the_coastguard: "เสริมอํานาจหนวยยามฝง"
  SIA_empower_the_coastguard_desc: "กองเรือไมอาจอยูไดทุกแหงในคราวเดียว และภารกิจรักษาความปลอดภัยชายฝงหลายอยางก็เหมาะกับหนวยงานขนาดเบามากกวา หนวยยามฝงที่เขมแข็งขึ้นจะคุมครองแหลงประมง ตรวจตราชายฝง และปลดภาระใหกองทัพเรือไปรับมือภัยคุกคามที่รายแรงกวา"
  SIA_river_patrols: "หนวยลาดตระเวนลํานํ้า"
  SIA_river_patrols_desc: "แมนํ้าของ[ROOT.GetNameDef]เปนทั้งเสนทางคมนาคม พรมแดน และเสนเลือดใหญในคราวเดียวกัน เรือตรวจการณบนลํานํ้าเหลานี้จะชวยรักษาความสงบเรียบรอย สนับสนุนกองรักษาการณในทองถิ่น และขยายอํานาจรัฐเขาไปถึงภูมิภาคที่เมืองหลวงอันหางไกลมักเอื้อมไปถึงไดชา"
  SIA_sell_bangkok_dock_co: "ขายบริษัทอูกรุงเทพ"
  SIA_sell_bangkok_dock_co_desc: "ทุนเอกชนอาจทําสิ่งที่การบริหารของรัฐทําไดเชื่องชาใหสําเร็จได การขายบริษัทอูกรุงเทพใหอยูในมือผูมีความสามารถจะชวยดึงดูดการลงทุน กระตุนประสิทธิภาพ และนํางบประมาณแผนดินไปใชกับความจําเปนทางทหารที่เรงดวนกวา"
  SIA_a_race_against_time: "แขงกับเวลา"
  SIA_a_race_against_time_desc: "กองทัพเรือของเราลาสมัย งบประมาณไมพอ และไมพรอมสําหรับสงครามสมัยใหม ตองโยกงบประมาณมาใชกับการตอเรือ การปรับปรุงเรือ การปองกันชายฝง และการฝกทหารเรือโดยทันที เวลากําลังเดินเร็วกวาอูตอเรือของเรา"
  SIA_a_race_against_time_tt: "เมื่อจิตวิญญาณนี้หมดเวลา เราจะไดรับ:"
  SIA_a_race_against_time_tt2: "เปนเวลา §Y280§! วัน"
