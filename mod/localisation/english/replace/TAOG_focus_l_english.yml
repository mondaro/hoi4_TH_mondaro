  NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
  NZL_women_in_the_workforce: "สตรีในกําลังแรงงาน"
  NZL_women_in_the_workforce_desc: "เมื่อการขาดแคลนกําลังคนทวีความรุนแรงขึ้น สตรีตางกาวออกมารับบทบาทสําคัญในโรงงาน ไรนา และบริการสาธารณะ ทําใหการผลิตไมสะดุดภายใตความกดดันในยามสงคราม การขยายโอกาสดานการฝกอบรมและการจางงานจะชวยใหเรารักษาผลผลิตทางอุตสาหกรรมไวได ขณะเดียวกันก็รักษาการปองกันประเทศไวดวย"
  NZL_restart_the_onekaka_ironworks: "เดินเครื่องโรงถลุงเหล็กโอเนกากาอีกครั้ง"
  NZL_restart_the_onekaka_ironworks_desc: "โรงถลุงเหล็กโอเนกากาเคยเปนตัวแทนความทะเยอทะยานของเราในการผลิตเหล็กและเหล็กกลาภายในประเทศ เพื่อลดการพึ่งพาอุปทานจากตางประเทศ เพื่อกระตุนเศรษฐกิจและเสริมความมั่นคงของชาติ จึงมีความสนใจที่จะจุดเตาหลอมของโอเนกากาขึ้นอีกครั้ง"
  NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
  NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
  NZL_scrap_metal_recycling: "รณรงครีไซเคิล"
  NZL_scrap_metal_recycling_desc: "เศรษฐกิจที่พึ่งพาการนําเขาอยางหนักเชนของเราไมอาจใชทรัพยากรทางยุทธศาสตรอยางสิ้นเปลืองได เพื่อเสริมความยืดหยุนทางเศรษฐกิจ เราจะจัดตั้งโรงงานรีไซเคิลเศษวัสดุเพื่อแปรรูปและนําโลหะและยางกลับมาใชใหม"
  NZL_domestic_car_industry: "ลงทุนในโรงงานประกอบยานยนต"
  NZL_domestic_car_industry_desc: "การผลิตยานยนตใน[ROOT.GetName]จํากัดอยูเพียงการประกอบชิ้นสวนจากผูผลิตตางชาติที่ขนสงมาประกอบขั้นสุดทายที่นี่ ดวยการลงทุนในการผลิตเหล็กกลาภายในประเทศเมื่อเร็ว ๆ นี้ เราอาจเริ่มผลิตชิ้นสวนไดเอง"
  NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
  NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
  NZL_project_seal_taog: "$NZL_project_seal$"
  NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
  NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
  NZL_think_big_taog: "$NZL_think_big$"
  NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
  NZL_think_big_taog_desc: "$NZL_think_big_desc$"
  NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
  NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
  NZL_national_broadcasting_service: "บริการกระจายเสียงแหงชาติ"
  NZL_national_broadcasting_service_desc: "หลังจากการแทรกแซงการเลือกตั้งป 1935 โดยกรมไปรษณีย และการกํากับดูแลบริการกระจายเสียงของรัฐโดยหนวยงานดังกลาว ดูเหมือนชัดเจนวาเราจําเปนตองปฏิรูปการบริหารองคกรนี้ เราควรลงทุนปรับปรุงอุปกรณกระจายเสียงที่ใชอยูดวย"
  NZL_support_allies_with_meat: "ใชประโยชนจากอุตสาหกรรมเนื้อสัตว"
  NZL_support_allies_with_meat_desc: "พันธมิตรของเราในแปซิฟกมักตองยืดเสนทางสงเสบียงจนถึงขีดจํากัด เพื่อลดภาระและใหทหารของพวกเขาอิ่มทอง เราจะเริ่มสงเนื้อสัตวใหแกพวกเขา"
  NZL_support_allies_with_meat_tt: "พันธมิตรทุกชาติจะไดรับ§Yโรงงานพลเรือนนอกแผนที่§! §G1§! แหง"

  AST_COMINWEALTH_FACTION: "เครือจักรภพแดง"
  AST_cominwealth_tech_sharing_tt: "เราจะเขารวม§Yขอตกลงแบงปนเทคโนโลยี§!กับสมาชิกทุกชาติในฝายของเรา"
  AST_modify_offshore_advancements_spirit_tt: "ปรับคา§Y$AST_offshore_advancements_spirit$§!ดังนี้:"
  AST_gain_claims_on_japan_tt: "เราจะไดรับการอางสิทธิ์เหนือ§Yหมูเกาะหลักของญี่ปุน§!"
