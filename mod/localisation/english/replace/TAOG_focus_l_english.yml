  AST_through_the_barricades_tt: "หาก§Y[ENG.GetNameDef]§!มีการสนับสนุนคอมมิวนิสตอยางนอย§Y10%§! เมื่อสงครามเริ่มขึ้น คนงานทาเรือแหง§Y[132.GetCapitalVictoryPointName]§!จะลุกฮือขึ้นสนับสนุนเรา!"
  AST_end_the_kingdom_ireland_join_tt: "เนื่องจาก[IRE.GetName]ไดลงนามในกติกาตอตานอังกฤษ พวกเขาจะเขารวมสงครามฝายเราทันทีที่เราประกาศสงครามกับ[ENG.GetNameDef]"
 ###########################
 ##### FABDA BRANCH ########
 ###########################

 # Root
 ABDA_abdacom: "จัดตั้ง ABDACOM"
 ABDA_abdacom_desc: "เมื่อมหาอํานาจฝายศัตรูรุกคืบอยางรวดเร็วทั่วเอเชียตะวันออกเฉียงใตและแปซิฟก กองกําลังพันธมิตรในภูมิภาคตองรวมเปนหนึ่งเพื่อตานทานพวกเขา การจัดตั้งกองบัญชาการสูงสุดรวมจะชวยใหเรารวมทรัพยากร ประสานกําลังทางเรือ และแสดงแนวรวมที่เปนเอกภาพตอศัตรู"

 # Tier 1 - country-locked
 ABDA_fortress_singapore: "ปอมปราการสิงคโปร"
 ABDA_fortress_singapore_desc: "สิงคโปรคือหัวใจของยุทธศาสตรการปองกันของเราในภูมิภาค การเสริมปอมปราการและวางกองรักษาการณที่แข็งแกรงจะชวยซื้อเวลาอันสําคัญยิ่งใหแกความพยายามโดยรวมของ ABDACOM และไมใหศัตรูไดชัยชนะทางยุทธศาสตรอยางรวดเร็ว"

 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "อินโดจีนฝรั่งเศสตั้งอยูที่ปกดานเหนือของแนวปองกัน ABDACOM ดวยการสงกองกําลังสํารวจฝรั่งเศสแหงตะวันออกไกล (Corps Expéditionnaire Français en Extrême-Orient) เขาปฏิบัติการอยางจริงจัง [FRA.GetNameDef]จะนํากําลังพลและประสบการณอันสําคัญยิ่งจากกองกําลังอาณานิคมมาสูกองบัญชาการรวม"

 ABDA_maintain_strategic_flexibility: "รักษาความยืดหยุนทางยุทธศาสตร"
 ABDA_maintain_strategic_flexibility_desc: "สหรัฐอเมริกาตองไมทุมกําลังมากเกินไปในเขตสงครามใดเขตหนึ่ง ดวยการบริหารกองหนุนทางยุทธศาสตรอยางรอบคอบ เราจะมั่นใจไดวาอานุภาพทางอุตสาหกรรมและการทหารของอเมริกาจะถูกนําไปใชในที่ที่ตองการมากที่สุดทั่วแปซิฟก"

 # Tier 2
 ABDA_the_malay_barrier: "แนวกั้นมลายู"
 ABDA_the_malay_barrier_desc: "หมูเกาะที่ทอดยาวจากมลายูผาน[INS.GetNonIdeologyName]กอตัวเปนแนวกั้นปองกันตามธรรมชาติ กองกําลัง ABDA ตองใชประโยชนจากภูมิศาสตรนี้ โดยจัดตั้งแนวปองกันทางทะเลและภาคพื้นดินที่ประสานกันเพื่อชะลอการรุกของศัตรู"

 ABDA_develop_naval_infrastructure: "พัฒนาโครงสรางพื้นฐานทางทะเล"
 ABDA_develop_naval_infrastructure_desc: "ปฏิบัติการทางทะเลอยางตอเนื่องในแปซิฟกตองอาศัยฐานทัพ คลังเชื้อเพลิง และสิ่งอํานวยความสะดวกดานการซอมบํารุง การลงทุนในโครงสรางพื้นฐานของทาเรือและที่ทอดสมอจะขยายระยะปฏิบัติการและความอึดของกองกําลังทางเรือ ABDA"

 # Tier 3
 ABDA_unified_naval_command: "กองบัญชาการทางเรือแบบรวม"
 ABDA_unified_naval_command_desc: "เมื่อแนวปองกันทางบกและโครงสรางพื้นฐานพรอมแลว ABDA สามารถนํากองกําลังทางเรือทั้งหมดมาอยูใตกองบัญชาการเดียวกัน สัญญาณที่เปนมาตรฐานเดียว ขาวกรองที่แบงปนกัน และเสนทางลาดตระเวนที่ประสานกัน จะทวีประสิทธิภาพของเรือทุกลําในเขตสงคราม"

 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "โควตาจมเรือวันละลํา"
 ABDA_ship_a_day_sinking_quotas_desc: "เสนทางสงเสบียงของศัตรูที่ทอดยาวขามแปซิฟกคือจุดออนทางยุทธศาสตรของพวกเขา ดวยการกําหนดโควตาการจมเรือที่ดุดันและประสานกันสําหรับกองกําลังเรือดํานํ้าและเรือผิวนํ้าของเรา ABDACOM จะทําใหศัตรูเสียเลือดทางการสงกําลังบํารุง และบีบใหพวกเขาตองตั้งรับ"

 ABDA_naval_procurement: "การจัดหายุทโธปกรณทางเรือ"
 ABDA_naval_procurement_desc: "ความสูญเสียที่เกิดขึ้นแลวตองไดรับการทดแทนอยางเรงดวน โครงการจัดหาที่ประสานกันของ ABDACOM จะใหความสําคัญกับเรือพิฆาต เรือดํานํ้า และเรือลาดตระเวนที่เหมาะสมที่สุดกับเขตสงครามแปซิฟก เพื่อใหกองเรือผสมของเราทัดเทียมกับการขยายตัวของศัตรู"

 ABDA_keep_trade_open: "รักษาเสนทางการคาใหเปดอยู"
 ABDA_keep_trade_open_desc: "ยางและนํ้ามันของ[INS.GetNonIdeologyName]มีความสําคัญยิ่งตอความพยายามในสงครามของฝายสัมพันธมิตร ABDACOM ตองพิทักษเสนทางเดินเรือที่ขนสงทรัพยากรสําคัญเหลานี้ ปกปองขบวนเรือลําเลียงจากการสกัดกั้นของศัตรู และรักษาการคาใหไหลเวียนสูอุตสาหกรรมของเรา"

 # Tier 5 - capstone
 ABDA_expand_the_command: "ขยายกองบัญชาการ"
 ABDA_expand_the_command_desc: "ABDACOM ไดพิสูจนคุณคาของตนแลว บัดนี้เราตองตอยอดจากรากฐานนั้น ขยายการเปนสมาชิกไปยังชาติสัมพันธมิตรอื่น ๆ ในภูมิภาค และกระชับการแบงปนการวิจัยและขาวกรองใหลึกซึ้งยิ่งขึ้น เพื่อนําหนาศัตรูอยูเสมอ"

