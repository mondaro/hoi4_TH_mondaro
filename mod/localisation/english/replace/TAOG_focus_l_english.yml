  INS_the_jewel_in_the_crown: "เพชรเม็ดงามบนมงกุฎ"
  INS_the_jewel_in_the_crown_desc: "หมูเกาะอินเดียตะวันออกคือเพชรเม็ดงามที่สุดบนมงกุฎอาณานิคมของดัตช และเราตั้งใจจะรักษาไวเชนนั้น ผานโฟลกสราด เสียงของเราจะสงไปถึงกรุงเฮก"
  INSHOL_java: "$HOL_java$"
