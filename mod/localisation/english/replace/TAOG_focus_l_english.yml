  jungle_tanks_tt: "ปลดล็อก §Yรถถังปาดิบ§!\n§Yกองพลรถถังทั้งหมด (ปาดิบ)§!:\nการโจมตี §G+15%§!\nการเคลื่อนที่: §G+15%§!"
  jungle_heavy_tanks_tt: "ปลดล็อก §Yรถถังหนักปาดิบ§!\n§Yกองพลรถถังหนัก รถถังหนักพิเศษ และรถถังสมัยใหม (ปาดิบ)§!:\nการโจมตี §G+15%§!\nการเคลื่อนที่: §G+15%§!"

