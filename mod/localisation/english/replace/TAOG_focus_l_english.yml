  effects_of_event_tt: "\n§Yผลของเหตุการณ§!:"
  AST_war_is_coming: "สงครามกําลังมา"
  AST_war_is_coming_desc: "ตลอดสามทศวรรษที่ผานมา เราเผชิญความทาทายครั้งแลวครั้งเลา ทวาบททดสอบสุดทายดูจะตั้งเคาอยูเบื้องหนา เพื่อพิสูจนความแข็งแกรงของประชาธิปไตยออสเตรเลียใหรูกันไปเลย อดีตนายกรัฐมนตรีบิลลี ฮิวส ยืนยันชัดเจนในเรื่องนี้ และคงเปนการขาดความรับผิดชอบหากเราจะเพิกเฉยตอคําเตือนของเขาที่วา — ไมวาเราจะชอบหรือไม — สงครามกําลังมา"
  AST_war_is_coming_tt: "\nปลดล็อก §Yการเลือกตั้งแบบประชาธิปไตย§!"
  AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
  AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
  AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
  AST_war_is_coming_advisors_tt: "\nปรับที่ปรึกษาทางการเมืองโดย:"
  AST_advance_pacific_initiatives: "รุกคืบความริเริ่มแปซิฟก"
  AST_advance_pacific_initiatives_desc: "ดวยสนธิสัญญาไมรุกรานที่เราจัดทําไดสําเร็จ ความสัมพันธกับเพื่อนบานในเอเชียจึงดีขึ้น เราจะใชประโยชนจากความสัมพันธเหลานี้ตอไปใหเต็มที่ และเรียกรองใหพันธมิตรใหมชวยเหลือการพัฒนาอุตสาหกรรมของเรา"
  AST_advance_pacific_initiatives_tt: "\nทําสนธิสัญญาไมรุกรานกับ:"
  AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§! เพื่อเพิ่ม §Yอูตอเรือ§! นอกแผนที่ §G2§! แหงในผล"
  AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§! เพื่อเพิ่ม §Yโรงกลั่นสังเคราะห§! นอกแผนที่ §G1§! แหงในผล"
  AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§! เพื่อเพิ่ม §Yโรงงานพลเรือน§! นอกแผนที่ §G2§! แหงในผล"
  AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! เสนอ:"
  AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! เสนอ:"
  AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! เสนอ:"
  AST_advance_pacific_initiatives_2_tt: "\nสิ่งกอสรางจะถูกนําออกหากทําสงครามกับประเทศที่เกี่ยวของ"
  AST_pacific_initiatives_modifier: "ความริเริ่มทางการทูต"
  AST_domestic_industry: "อุตสาหกรรมภายในประเทศ"
  AST_domestic_industry_desc: "เราไมอาจพึ่งพาอุตสาหกรรมกลาโหมของพันธมิตรใหสงเสบียงแกเราไดหากสงครามมาถึง เราตองขยายอุตสาหกรรมของเราเอง เพื่อใหพรอมรับมือกับทุกสิ่งที่กําลังจะมา"
  AST_a_democratic_bulwark: "ปราการแหงประชาธิปไตย"
  AST_a_democratic_bulwark_desc: "เพื่อยืนหยัดตานภัยคุกคามทั้งจากฟาสซิสตและคอมมิวนิสต ประชาธิปไตยตองเปนผูนําทาง รัฐบาลจะใชนโยบายเชิงรุกเพื่อใหพลเมืองมีผูแทนในกลไกการปกครอง และใหความไมพอใจของนักการเมืองไดรับการตอบสนองดวยการเขารวมพรรคประชาธิปไตยตาง ๆ แทนที่จะหันไปหาอุดมการณที่เปนภัย"
  AST_the_pacific_pact: "กติกาแปซิฟก"
  AST_the_pacific_pact_desc: "ความริเริ่มแปซิฟกของไลออนสในป 1934 ไดสรางการติดตอระหวางออสเตรเลียกับชาติมหาอํานาจในเอเชีย ทําใหเราไมตองพึ่งเจาหนาที่อังกฤษเปนตัวแทนผลประโยชนของเราอีกตอไป หากเราใชความสัมพันธเหลานี้ใหมหาอํานาจเอเชียรับประกันวาจะไมรุกรานออสเตรเลียได นั่นคือเปาหมายสูงสุดของความพยายามทางการทูตของเรา อาจเปนภารกิจที่ทาทาย แตก็คุมคา"
  AST_a_collapsing_league_of_nations: "สันนิบาตชาติที่กําลังลมสลาย"
  AST_a_collapsing_league_of_nations_desc: "สันนิบาตชาติกําลังลมสลาย — ความริเริ่มที่มีเจตนาดี แตนาเศราที่ตั้งอยูบนความหวังอันเลื่อนลอย นโยบายควํ่าบาตรกลายเปนเพียงทาทีวางเปลาไดงาย ๆ ยิ่งเมื่อไมมีกองกําลังติดอาวุธคอยยับยั้งชาติที่ดื้อดาน การฟนฟูกําลังรบของเราตองเริ่มขึ้น"
  AST_department_of_munitions: "กระทรวงยุทธภัณฑ"
  AST_department_of_munitions_desc: "เพื่อสงเสบียงใหทหารของเราที่แนวหนาไดอยางเหมาะสม เราตองเรงการผลิตยุทธภัณฑ การจัดตั้งกระทรวงยุทธภัณฑจะชวยใหเรากํากับดูแลการผลิตชิ้นสวนดานกลาโหมไดมากขึ้น"
  AST_call_for_a_referendum: "เรียกรองใหลงประชามติ"
  AST_call_for_a_referendum_desc: "เราตองการเพิ่มอํานาจควบคุมของรัฐบาลกลาง แตตองไดรับความเห็นชอบจากผูมีสิทธิเลือกตั้งกอน การจัดลงประชามติจะเปดทางใหเราขอความยินยอมจากพวกเขา"
  AST_rural_concessions: "การผอนปรนแกชนบท"
  AST_rural_concessions_desc: "ผูแทนชนบทของพรรคคันทรีไดคะแนนเสียงนอยเกินกวาจะปกครองเพียงลําพัง แตหากเราในฐานะพรรครัฐบาลปจจุบันเปดรับอิทธิพลของพวกเขาในการเมืองออสเตรเลีย เราอาจไดแรงสนับสนุนเพิ่มเติม"
  AST_rural_concessions_tt: "\n§Y$AST_country_party_influence_uap$§! จะเพิ่มคะแนนเสียงใหพรรคที่อยูในอํานาจเมื่อแผนยุทธศาสตรนี้เสร็จสิ้น"
  AST_solidarity_by_the_empire: "เอกภาพเคียงขางจักรวรรดิ"
  AST_solidarity_by_the_empire_desc: "จนถึงบัดนี้ จักรวรรดิบริติชไดนําทางเราผานทั้งยามสงครามและยามสงบ เราจะยังคงใหคุณคาแกคําแนะนําของจักรวรรดิ และรวมมือกันเตรียมพรอมรับความขัดแยงที่อาจเกิดขึ้น"
  AST_solidarity_by_the_empire_modifier: "เอกภาพเคียงขางจักรวรรดิ"
  AST_wool_agreement: "ขอตกลงขนแกะ"
  AST_wool_agreement_desc: "ขนแกะเปนหนึ่งในสินคาเชิงพาณิชยที่ยิ่งใหญที่สุดของออสเตรเลีย การสงออกไมเพียงสรางกําไร แตยังชวยกระชับความสัมพันธกับชาติผูนําเขา อยางไรก็ตาม อังกฤษตองการทั้งหมด สวนหนึ่งเพื่อใชทําเครื่องแบบทหาร และอีกสวนเพื่อใชตอรองกับมหาอํานาจที่ขาดแคลนขนแกะ เราจะยอมตามขอเรียกรองของอังกฤษ"
  AST_australian_war_cabinet: "คณะรัฐมนตรีสงครามออสเตรเลีย"
  AST_australian_war_cabinet_desc: "ตามคําวิงวอนของสหราชอาณาจักร เราจะจัดตั้งคณะรัฐมนตรีสงครามของเราเอง การทําเชนนี้จะชวยใหการตัดสินใจมีประสิทธิภาพและเปนยุทธศาสตร เพราะองคกรนี้จะมุงเนนเฉพาะความมั่นคงของชาติเทานั้น"
  AST_singapore_strategy: "ยุทธศาสตรสิงคโปร"
  AST_singapore_strategy_desc: "ยุทธศาสตรสิงคโปรเปนองคประกอบหลักของนโยบายกลาโหมออสเตรเลีย และในฐานะฐานทัพของเรือราชนาวีที่ประจําการในแปซิฟก ดินแดนสิงคโปรเองจึงมีความสําคัญสูงสุด เราจะโนมนาวใหอังกฤษลงมือกอสรางแนวปองกันเพิ่มเติม ขณะที่เราเสริมสรางขีดความสามารถทางทะเลของออสเตรเลียเอง"
  AST_singapore_strategy_tt: "หลังจาก §Y180§! วัน (§Yสิงคโปร§!):\n เพิ่ม §Yฐานทัพอากาศ§! §G2§! แหง\n เพิ่ม §Yฐานทัพเรือ§! §G2§! แหง\n เพิ่ม §Yปอมชายฝง§! §G1§! แหง"
  AST_british_war_cabinet: "คณะรัฐมนตรีสงครามอังกฤษ"
  AST_british_war_cabinet_desc: "สงครามปะทุขึ้นแลว และสหราชอาณาจักรไดจัดตั้งคณะรัฐมนตรีสงครามเพื่อดําเนินความพยายามทําสงครามของฝายสัมพันธมิตรอยางมีประสิทธิภาพ พวกเขาเชิญเราไปแสดงความเห็นในเรื่องนี้ดวย นายกรัฐมนตรีจึงจะเดินทางไปเปนตัวแทนผลประโยชนของออสเตรเลีย"
  potential_consequence_tt: "§Yผลที่อาจเกิดขึ้น§!:\n"
  AST_british_pacific_fleet: "กองเรือแปซิฟกอังกฤษ"
  AST_british_pacific_fleet_desc: "การปรากฏตัวของอังกฤษในแปซิฟกจะมีความสําคัญยิ่ง ทั้งเพื่อยับยั้งและปองกันเรือขาศึกที่ขยายอํานาจทางทะเลลงมาทางใต ในฐานะสวนหนึ่งของ [Root.GetFactionName] เราจะดําเนินการจัดตั้งโครงสรางกองบัญชาการรวมเพื่อปกปองนานนํ้าชายฝงของเรา"
  AST_all_dressed_up: "แตงองคทรงเครื่อง"
  AST_all_dressed_up_desc: "หากทหารออสเตรเลียตองไปรบในสงครามของอังกฤษ โรงงานของอังกฤษก็ตองจัดหายุทโธปกรณใหพวกเขา"
  AST_overseas_loyalties: "ความภักดีโพนทะเล"
  AST_overseas_loyalties_desc: "เราจะยังคงมีสวนรวมในสงครามโพนทะเลตอไป พิสูจนอีกครั้งวาไมมีดินแดนใดแปลกหนาสําหรับทหารออสเตรเลีย สงครามไมไดเกิดขึ้นกับเรา — เราตางหากที่เกิดขึ้นกับสงคราม"
  AST_the_ultimate_overseas_duty: "หนาที่โพนทะเลขั้นสูงสุด"
  AST_the_ultimate_overseas_duty_desc: "นายกรัฐมนตรีอังกฤษบริหารความรับผิดชอบผิดพลาดจนความไมไววางใจลุกลามไปในหมูรัฐมนตรีของเขาเอง เมนซีสสรางความประทับใจอยางแรงกลาระหวางการเยือนเพื่อเขารวมคณะรัฐมนตรีสงครามอังกฤษ และบัดนี้มีบางคนเสนอวาเขาอาจเปนตัวเลือกที่ดีกวาสําหรับอังกฤษ หากเขากุมบังเหียนเครือจักรภพ เราจะใชความภักดีที่เมนซีสมีตอ [AST.GetName] ยกระดับอํานาจของเราได"
  AST_the_ultimate_overseas_duty_tt: "\nเมื่อ §Y$AST_robert_menzies$§! เปนผูนําของ §Y[ENG.GetNameDef]§! เราจะสามารถกลายเปน §Y$autonomy_associated_dominion$§! ไดผานแผนยุทธศาสตร §Y$AST_a_change_of_authority$§!"
  AST_pleading_britain: "วิงวอนอังกฤษ"
  AST_pleading_britain_desc: "สงครามกําลังมาแนนอน และมันทําใหเราขาสั่น ดวยความเคารพตอจิตวิญญาณแอนแซคและชื่อเสียงของเหลาดิกเกอร ขีดความสามารถในการทําสงครามของออสเตรเลียคงจะเหือดแหงอยางรวดเร็วหาก [ENG.GetName] ไมมาชวยเหลือเรา นายกรัฐมนตรีจะสงโทรเลขถึง [ENG.GetLeader] โดยเร็วที่สุด"
  AST_bound_once_more: "ผูกพันกันอีกครา"
  AST_bound_once_more_desc: "เสนทางของเราแยกจากกัน แตจะบรรจบกันอีกครั้ง [ENG.GetNameDefCap] และ [AST.GetName] ตางกําลังเผชิญความเปลี่ยนแปลงระดับชาติ แตระยะหางระหวางเราที่เกิดจากสิ่งนี้เปนเพียงผลขางเคียงที่ไมไดตั้งใจและไมพึงประสงค อยางนอยก็ในฝงของเรา เราจะเปนพันธมิตรกันอีกครั้ง และรวมกันฝาฟนอุปสรรคของชาติที่กําลังเปลี่ยนแปลงไปดวยกัน"
  AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! และรัฐในอารักขาเขารวม §Y[AST.GetFactionName]§!"
  AST_faction_leader_tt: "ตั้งเปนผูนําของฝาย §Y[AST.GetFactionName]§!"
  AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
  AST_australian_command: "กองบัญชาการออสเตรเลีย"
  AST_australian_command_desc: "เมื่อความสําคัญของการปองกันและความมั่นคงของออสเตรเลียเปนที่ประจักษแมแตใน [ENG.GetNameDef] การปรับโครงสรางกองกําลังรวมของเราจึงจําเปน ดวยกองกําลังอังกฤษที่อยูภายใตการบัญชาการของออสเตรเลียมากขึ้น ความพยายามทําสงครามจะมีประสิทธิภาพยิ่งขึ้น"
  AST_taking_the_helm: "กุมหางเสือ"
  AST_taking_the_helm_desc: "ขณะที่อิทธิพลของเราขยายไปทั่วเอเชียตะวันออกเฉียงใต ขีดความสามารถทางทะเลของเราตองเติบโตตามเพื่อปกปองมัน เราจะใหความสําคัญกับการลงทุนในราชนาวีออสเตรเลียตอไป และสถาปนาการควบคุมเหนือทะเลตะวันออก"
  AST_eastern_focus: "มุงสูตะวันออก"
  AST_eastern_focus_desc: "หากสงครามของอังกฤษคือสงครามของออสเตรเลีย สงครามของออสเตรเลียก็ตองเปนสงครามของอังกฤษดวย การรุกรานของญี่ปุนตั้งเคามานานจนปฏิเสธไมได และเราจะไมยอมรับความเฉื่อยชาที่รอใหความขัดแยงหลนลงมาใสตักเราอีกตอไป เราจะแสดงใหญี่ปุนเห็นวาความมุงมั่นของออสเตรเลียหมายถึงอะไร ขณะที่อังกฤษพิสูจนความภักดีดวยการประกาศที่กลาหาญที่สุด นั่นคือการประกาศสงคราม"
  AST_eastern_focus_tt: "\nภารกิจนี้จะทําให §Y[ENG.GetNameDef]§! ประกาศสงครามกับ §Y[JAP.GetNameDef]§! ไดทันที และบังคับใหตองประกาศหากยังไมไดทําภายใน 180 วัน §Y[ENG.GetNameDefCap]§! สามารถเลื่อนกําหนดเสร็จสิ้นของภารกิจไดดวยการใหทุนการกอสรางแนวปองกันของออสเตรเลีย"
  AST_holding_the_battlefield: "ยึดครองสนามรบ"
  AST_holding_the_battlefield_desc: "ทหารออสเตรเลียจํานวนมากลมตายในตางแดน แตความพยายามของพวกเขากลับถูกนับเปนของอังกฤษ ออสเตรเลียเรียกรองอิทธิพลที่มากขึ้นบนโตะเจรจาเคียงขาง [ENG.GetNameDef] ในการประชุมสันติภาพ มิฉะนั้นการมีสวนรวมของเราอาจยุติลง"
  AST_holding_the_battlefield_tt: "§Yลดตนทุน§! สําหรับการกระทํา §Yรัฐหุนเชิด§! และ §Yยึดรัฐ§! ในการประชุมสันติภาพรวมกับ §Y[ENG.GetNameDef]§!"
  AST_a_change_of_authority: "การเปลี่ยนผานอํานาจ"
  AST_a_change_of_authority_desc: "จากรัฐในอารักขาที่วานอนสอนงาย ออสเตรเลียไดเติบโตเปนชาติที่ไดรับความเคารพและกลาแสดงจุดยืน ถึงเวลาแลวที่จะกาวขั้นสุดทายสูการเปนหนึ่งในมหาอํานาจโลก ในฐานะผูนําของ [AST.GetFactionName] มิตรจะเคารพเรา และศัตรูจะเกรงกลัวเรา ดวยการปกหลักและยืนหยัดมั่นคง ออสเตรเลียจะไมยอมถอย"
  AST_a_change_of_authority_tt: " §Y[ROOT.GetName]§! สามารถประกาศสงครามไดแลว\n §Y[ROOT.GetName]§! สามารถปฏิเสธการเรียกรวมสงครามไดแลว\n §Y[ROOT.GetName]§! จะไมโอนคะแนนสันติภาพใด ๆ ใหเจาอาณานิคมอีกตอไป"
  AST_reinforcements: "กําลังเสริม"
  AST_reinforcements_desc: "เราจะเตรียมดินแดนทางเหนือที่สวนใหญยังไมไดรับการพัฒนาดวยสิ่งกอสรางปองกันและฐานทัพอากาศ"
  AST_weekly_stability_tt: " เสถียรภาพรายสัปดาห: §G+1.00%§!"
  AST_ending_overseas_conscription: "ยุติการเกณฑทหารไปโพนทะเล"
  AST_ending_overseas_conscription_desc: "ทหารของเราตองถอนตัวจากฝงตางแดนโดยทันที ที่นี่ตองการพวกเขา"
  AST_unlocking_conscription_1903_tt: "จําเปนตอการปลดล็อก §Yกฎหมายการเกณฑทหาร§!"
  AST_unlocking_further_conscription_tt: "สําหรับ §Yการเกณฑทหารอยางกวางขวาง§! หรือ §Yการรับราชการตามความจําเปน§! คุณจะตองมีแผนยุทธศาสตรใดแผนหนึ่งตอไปนี้ดวย: §Y$AST_british_pact$§! (ฟาสซิสต), §Y$AST_refuse_british_wars$§! (ฟาสซิสต), §Y$AST_toe_the_line$§! (ฟาสซิสต), §Y$AST_from_picket_line_to_front_line$§! (คอมมิวนิสต) หรือ §Y$AST_part_with_colonizer$§! (คอมมิวนิสต)"
  AST_unlocking_conscription_tt: "หากคุณมี §Y$AST_invoke_the_1903_defence_act$§! ดวย คุณจะปลดล็อก §Yกฎหมายการเกณฑทหาร§! ที่เหลือทั้งหมด"
  AST_an_uncle_for_father_figure: "ลุงผูเปนดั่งบิดา"
  AST_an_uncle_for_father_figure_desc: "เรายังขาดอาวุธยุทโธปกรณสมัยใหม จึงจะขอให [USA.GetName] จัดหาใหแกเรา"
  AST_seven_million_britishers: "ชาวบริเตนเจ็ดลานคน"
  AST_seven_million_britishers_desc: "แม [ENG.GetLeader] จะลังเลที่จะใหคํามั่นใด ๆ แกเรา แตเราจะเชื่อมั่นในพันธะของเขาและของอังกฤษที่มีตอ [AST.GetNameDef] เมื่อถึงคราวคับขัน อยางไรเสียเราก็คือชาวบริเตนเจ็ดลานคน"
  AST_seven_million_britishers_reinforcements_tt: "\n§Yหาก $AST_reinforcements$ ยังไมเสร็จสิ้น§!:"
  AST_seven_million_britishers_conscription_tt: "\n§Yหาก $AST_ending_overseas_conscription$ ยังไมเสร็จสิ้น§!:"
  AST_seven_million_britishers_uncle_tt: "\n§Yหาก $AST_an_uncle_for_father_figure$ ยังไมเสร็จสิ้น§!:"
  AST_we_endured: "เราอดทนผานมาได"
  AST_we_endured_desc: "คําทํานายถึงความขัดแยงที่กําลังมาอาจทวมทนในตอนแรก แตดวยการใชมันเรงขยายขีดความสามารถดานกลาโหม มันก็มีประโยชนในที่สุด เราอดทนผานมาได และเราจะยืนหยัดตอไป บัดนี้ทุมเทเต็มที่ใหภารกิจสูงสุดของเรา นั่นคือการชนะสงคราม"
  AST_under_the_rule_of_canberra: "ภายใตการปกครองของแคนเบอรรา"
  AST_under_the_rule_of_canberra_desc: "ความตึงเครียดที่เพิ่มขึ้นในหมูชาติแปซิฟกนาวิตก และเมื่ออังกฤษติดพันอยูกับการรบของตนเอง โอกาสที่จะมาชวยเราก็ดูริบหรี่ หากเราสรางเครือจักรภพบริติชขึ้นใหมใหชาติในมหาสมุทรแปซิฟกและมหาสมุทรอินเดียบริหารโดยตรงจากแคนเบอรรา เราอาจรวมกันเปนแนวรวมเดียวได — แมไมมี [ENG.GetNameDef]"
  AST_its_fight_work_or_perish: "รบ ทํางาน หรือดับสูญ"
  AST_its_fight_work_or_perish_desc: "สงครามเริ่มขึ้นแลว และเหลือเพียงสิ่งเดียว คือการพิสูจนวาเราพรอมสําหรับมัน"
  AST_no_foreign_battlefields: "ไมรบในสมรภูมิตางแดน"
  AST_no_foreign_battlefields_desc: "รอคอยมานาน แตในที่สุดรัฐบาลจะประกาศวาจะไมมีการบังคับพลเมืองคนใดใหไปรับราชการในสมรภูมิตางแดน"
  AST_no_foreign_battlefields_modifier: "ไมรบในสมรภูมิตางแดน"
  AST_platypus_modifier: "ตุนปากเปดของขวัญ"
  AST_aerial_defense: "การปองกันทางอากาศ"
  AST_aerial_defense_desc: "หากเราไมมีกําลังพอจะสรางกองทัพเรือเทียบเทามหาอํานาจโลก — ซึ่งเราไมมีจริง ๆ — เราก็ยังสามารถรักษากองเรืออากาศที่ทัดเทียมกับกองกําลังใด ๆ ที่อาจถูกสงมาโจมตีเราได"
  AST_ratify_westminster_adoption_act: "ใหสัตยาบันพระราชบัญญัติรับรองธรรมนูญเวสตมินสเตอร"
  AST_ratify_westminster_adoption_act_desc: "แมการเปลี่ยนนโยบายที่ใชมายาวนานอาจกอใหเกิดขอโตแยง แตถึงเวลานานแลวที่เราจะใหสัตยาบันพระราชบัญญัติรับรองธรรมนูญเวสตมินสเตอร เราจะเลือกเองวาสงครามใดเปนของเรา"
  AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no สามารถปฏิเสธการเรียกรวมสงคราม"
  AST_administer_the_mandate: "บริหารดินแดนในอาณัติ"
  AST_administer_the_mandate_desc: "ดวยการปกครองนิวกินีภายใตอาณัติของสันนิบาตชาติมาตั้งแตป 1920 และปาปวเปนดินแดนภายนอกของ [AST.GetName] มาเกือบตั้งแตการรวมสหพันธรัฐ ภาคตะวันออกของปาปวนิวกินีจึงเปนสวนเพิ่มโดยธรรมชาติของดินแดนหลักของ [AST.GetName] บัดนี้เมื่อสันนิบาตชาติสลายตัวแลว โอกาสในการปรับโครงสรางสหพันธเชนนี้จึงเปดกวาง"
  AST_a_rational_request: "คําขออันสมเหตุสมผล"
  AST_a_rational_request_desc: "ยุทธศาสตรสิงคโปรใชไดในทางทฤษฎี แตก็เพียงในทางทฤษฎีเทานั้น เฮนรี วินเทอรและเสียงคัดคานอันแข็งกราวอื่น ๆ ถูกตองมาตลอด หากสงครามแปซิฟกปะทุขึ้น อังกฤษนาจะติดพันอยูในทวีปของตนเอง ยุทธศาสตรที่สรางขึ้นบนความชวยเหลือจากอังกฤษจึงใชไมได เราจะขอควบคุมสิงคโปร เพื่อที่เราจะรับผิดชอบการปองกันนานนํ้าของเราเอง"
  add_trait_to_theorist_tt: "เพิ่มคุณลักษณะให §Yนักทฤษฎี§!:"
  AST_volunteers: "อาสาสมัคร"
  AST_volunteers_desc: "สิ่งสําคัญคือการมีทางเลือก ความสามารถในการปฏิเสธการเรียกรวมสงครามไมไดหมายความวาออสเตรเลียจะปฏิเสธเสมอไป ชาวออสเตรเลียจะมีสิทธิ์เต็มที่ที่จะสูเพื่อสิ่งที่ถูกตอง ทั้งบนแผนดินของตนเองและแผนดินตางแดน"
  AST_until_the_tide_of_battle_swings: "จนกวากระแสสงครามจะพลิกผัน"
  AST_until_the_tide_of_battle_swings_desc: "เราจะแถลงตอสาธารณะใหชัดเจนวา เวลาที่จะเพิกเฉยตอภัยคุกคามที่กอตัวในหลังบานของเราไดหมดลงแลว เราปฏิเสธนโยบายที่มองวาการตอสูในแปซิฟกเปนเพียงสวนรองของความขัดแยงโดยรวม ออสเตรเลียจะเตรียมรับการรุกรานโดยทันที"
  AST_walls_and_whispers: "กําแพงและเสียงกระซิบ"
  AST_walls_and_whispers_desc: "กําแพงที่ไมอาจทะลวงได ควบคูกับการแนบหูฟงเสียงจากพื้นดิน สรางศักยภาพอันยิ่งใหญใหความมั่นคงของชาติ เราจะดําเนินการวางแนวปองกันทางบกและชายฝงทั่วแผนดินของเราใหมั่นคงยิ่งขึ้น และจัดตั้งกองบัญชาการขาวกรองภายในประเทศ"
  AST_united_states_as_our_keystone: "สหรัฐฯ คือศิลาหลัก"
  AST_united_states_as_our_keystone_desc: "เรารูถึงปญหาที่สหราชอาณาจักรเผชิญ เรารูถึงอันตรายของการกระจายกําลัง แตเราก็รูเชนกันวาออสเตรเลียอาจลมสลายได ขณะที่อังกฤษยังยืนหยัดอยู ดังนั้นเราจึงตั้งมั่นวาออสเตรเลียจะไมลมสลาย และเราจะทุมกําลังทั้งหมดเพื่อวางแผนที่มีสหรัฐอเมริกาเปนศิลาหลัก"
  AST_liberty_loans: "พันธบัตรเสรีภาพ"
  AST_liberty_loans_desc: "จากประสบการณในฐานะรัฐมนตรีคลัง — บางคนถึงกับกลาววายิ่งใหญที่สุดของชาติ — เบน ชิฟลียไดพิสูจนความสามารถในการบริหารเศรษฐกิจยามสงคราม ตามคําแนะนําของเขา เราจะสงเสริมใหพลเมืองโอนรายไดสวนเกินไปเปนเงินออม และลงทุนในพันธบัตรสงคราม"
  AST_inevitably_independent: "เอกราชที่เลี่ยงไมได"
  AST_inevitably_independent_desc: "แมพรรคยูไนเต็ดออสเตรเลียจะใหคุณคากับสัญชาติบริติชมาโดยตลอด แตความเฉยเมยของ [ENG.GetNameDef] ตอผลประโยชนของออสเตรเลียบีบใหเราตองประกาศเอกราชและใหความสําคัญกับการปองกันตนเอง บัดนี้เมื่อการรับราชการโพนทะเลในสงครามของอังกฤษกลายเปนเรื่องไมจําเปนไปโดยปริยาย แมแตผูตอตานฝายภักดีก็มีแนวโนมจะยอมตามมากขึ้น การเกณฑทหารที่กวางขวางขึ้นจึงจะเผชิญแรงตานนอยลง"
  AST_bring_on_the_giant: "เรียกยักษใหญมาเลย"
  AST_bring_on_the_giant_desc: "ในที่สุดเมื่อเปนชาติที่เปนเอกภาพและปกครองตนเองแลว ความกลาหาญของเราจะถูกทดสอบในไมชา อีกฟากหนึ่งของแปซิฟกดูจะมีผลประโยชนรวมกับเรา และดวยอุตสาหกรรมทหารที่พัฒนาแลว  [USA.GetNameDef] สามารถสรางประโยชนมหาศาลแกทั้งตนเองและออสเตรเลียดวยการใหเชาเสบียงอันลนเหลือบางสวนแกกองทหารของเรา"
  AST_bring_on_the_giant_tt: "  หาก §Y[USA.GetNameDefCap]§! ตกลง:\n §Yขบวนเรือลําเลียง§! §Y+50§! หนวยจะถูกเพิ่มเขาคลังสํารองของชาติ"
  AST_allied_after_all: "สุดทายก็ยังเปนพันธมิตร"
  AST_allied_after_all_desc: "แมเอกราชของออสเตรเลียจะเปนสิ่งจําเปน แตความรวมมือทั้งหมดกับเจาอาณานิคมเกาจะไมยุติลง เราจะยังคงภักดีตอ [ENG.GetFactionName] เชนที่เคยเปนมาเสมอ แตจะมุงแสวงหาอิทธิพลที่มากขึ้นภายในฝาย"
  AST_the_pacific_resistance: "ขบวนการตอตานแปซิฟก"
  AST_the_pacific_resistance_desc: "ในที่สุดออสเตรเลียก็ไดเอกราช และเปนการสมควรที่เราจะแยกตัวออกจากความพยายามทําสงครามของอังกฤษดวย การแสวงหาความเปนเอกภาพกับ [USA.GetNameDef] แทน จะชวยใหเราวางยุทธศาสตรกองบัญชาการรวมที่ใหคุณคาแกผลประโยชนของออสเตรเลีย ขณะที่เราควบคุมอุตสาหกรรมกลาโหมและการขยายตัวของมันไดอยางเบ็ดเสร็จดวยตนเอง"
  AST_the_pacific_resistance_tt1: "§Yออสเตรเลีย§! เขารวม §Y[USA.GetFactionName]§!"
  AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§! เขารวม §Yขบวนการตอตานแปซิฟก§!"
  AST_conscription_at_last: "ในที่สุดก็เกณฑทหาร"
  AST_conscription_at_last_desc: "เอกราชชางหอมหวาน เมื่อเราตระหนักวาบัดนี้เรามีอํานาจที่จะใหความสําคัญกับการปองกันของเราเอง — แตอํานาจนั้นก็มาพรอมความรับผิดชอบ การเกณฑทหารภาคบังคับไมควรเพิ่มขึ้นอยางงายดาย แตเมื่อสงครามมาถึงตัวเราแลว มันจึงกลายเปนสิ่งจําเปน"
  AST_equal_training: "การฝกที่เทาเทียม"
  AST_equal_training_desc: "ความรวมมือกับพันธมิตรตองไดรับการขัดเกลา ไมใชแคสันนิษฐานวาจะทํางานไดเองโดยไมตองคิด ออสเตรเลียจะริเริ่มจัดคายฝกรวมสําหรับชาติตาง ๆ ใน [ROOT.GetFactionName] และทําใหแนใจวาทหารทุกนายไดรับการฝกที่เขมงวดเทาเทียมกัน"
  AST_a_northern_barrier: "ปราการแหงทิศเหนือ"
  AST_a_northern_barrier_desc: "ขาศึกกําลังมาจากทางเหนือ และเบื้องหนาพวกมันคือชาติเล็ก ๆ ที่ไมพรอมรับมือ ซึ่งพวกมันจะโจมตีไดตามใจชอบกอนจะมาถึงหนาประตูบานเรา หากเรารวมกับ [INS.GetNameDef] เปนปราการเดียวกัน เราอาจยังมีโอกาสตานพวกมันไวได"
  AST_demand_resources: "เรียกรองทรัพยากร"
  AST_demand_resources_desc: "ผูรุกรานที่มุงขยายดินแดนหมายตาอินโดจีนไมเพียงเพราะตัวดินแดน แตยังเพราะทรัพยากรที่มีอยูดวย หากความมั่งคั่งเหลานี้ตกไปอยูในมือขาศึก ก็จะยิ่งยืดสงครามออกไป แตหากอยูในมือเรา ก็อาจชวยยุติสงครามได เราจะขอควบคุมทรัพยากรเหลานี้ หากผูถือครองไมยอมรวมมือ พวกเขาก็ไมตางจากขาศึก"
  AST_demand_resources_tt: "ปลดล็อกการตัดสินใจ §Y$AST_resource_acquisition_cat$§! เพื่อขอสวนแบงทรัพยากรจากชาติในเอเชียตะวันออกเฉียงใต"
  AST_reclaim_the_lost_territory: "ทวงคืนดินแดนที่สูญเสีย"
  AST_reclaim_the_lost_territory_desc: "ระหวางกระบวนการรวมอาณานิคมออสเตรเลียเปนสหพันธรัฐ นิวซีแลนดตัดสินใจไมเขารวมในทายที่สุด อยางไรก็ตาม นับแตนั้นมารัฐธรรมนูญยังคงระบุใหนิวซีแลนดเปนหนึ่งในรัฐที่อาจเขารวมเครือรัฐออสเตรเลีย และเปดชองใหรับเขามาได เราจะเตือนความจําเพื่อนบานทางตะวันออกถึงเรื่องนี้ และชี้วาสถานการณโลกในปจจุบันเรียกรองความเปนเอกภาพ"
  AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) โอนกองกําลังทางบก ทางทะเล และทางอากาศทั้งหมดให §Y[AST.GetNameDef]§!"

  AST_australia_first: "ออสเตรเลียตองมากอน"
  AST_australia_first_desc: "ความฮึกเหิมขวาจัดของพรรคเซ็นเตอรอยูไดไมนาน และจบลงดวยการยุบพรรคในป 1935 แตบางสิ่งใหมกําลังเริ่มคุกรุน ซึ่งมีที่มาจากแนวคิดของนักธุรกิจและนักเคลื่อนไหวทางการเมือง วิลเลียม จอหน ไมลส ทวาหากไมมีการดําเนินการเพื่อระดมความรูสึกเหลานี้ มันอาจมอดดับลงเร็วพอ ๆ กับที่ลุกขึ้นมา ดังนั้นเราจะลงมือ"
  AST_pankhurst_walsh: "อเดลา แพงกเฮิสต วอลช"
  AST_pankhurst_walsh_desc: "ในการกอตั้งขบวนการออสเตรเลียตองมากอนอยางเปนทางการ เราจะแตงตั้งอเดลา แพงกเฮิสต วอลชเปนประธาน ในฐานะผูกอตั้งสมาคมสตรีแหงจักรวรรดิออสเตรเลีย แพงกเฮิสต วอลช — ซึ่งรักษาสายสัมพันธใกลชิดกับสมาคมสตรีในลอนดอน — ไดสนับสนุนคุณคาของสัญชาติบริติชมาชานาน คุณคานั้นจะเปนหลักการสําคัญของขบวนการเรา: สายสัมพันธกับอังกฤษที่ตอเนื่อง"
  AST_stephensen: "พี.อาร. สตีเฟนเซน"
  AST_stephensen_desc: "ในการกอตั้งขบวนการออสเตรเลียตองมากอนอยางเปนทางการ เราจะแตงตั้งพี.อาร. สตีเฟนเซนเปนประธาน ในฐานะที่ปรึกษาดานวรรณกรรมของวิลเลียม จอหน ไมลส สตีเฟนเซนมีมุมมองแบบโดดเดี่ยวนิยมและชาตินิยมเชนเดียวกับผูเปนอาจารย มุมมองเหลานี้จะเปนสองหลักการสําคัญในธรรมนูญของขบวนการ: เอกราชจากอังกฤษ และการหลอมรวมวัฒนธรรมออสเตรเลีย"
  AST_stephensen_tt: "\nการเลือกประธานของ §Yขบวนการออสเตรเลียตองมากอน§! จะกําหนดการดําเนินการที่เปนไปไดในอนาคต"
  AST_leave_eng_faction_tt: "เมื่อเพิ่มระดับอํานาจปกครองตนเองเปน §Yเสรี§! ในฐานะรัฐในอารักขาของ §Y[ENG.GetNameDef]§! [AST.GetName] จะออกจาก §Y[ENG.GetFactionName]§!"
  AST_a_growing_womens_guild: "สมาคมสตรีที่เติบโต"
  AST_a_growing_womens_guild_desc: "นับแตกอตั้งในป 1928 สมาคมสตรีแหงจักรวรรดิออสเตรเลียไดสนับสนุนความรวมมือทางอุตสาหกรรมเพื่อแกปญหาเศรษฐกิจของชาติ เพื่อประโยชนของชาติ พลเมืองจะชวยเหลือรัฐบาล ไมใชตอตาน เมื่อแพงกเฮิสต วอลชเปนประธานของออสเตรเลียตองมากอน เราจะเผยแพรสารนี้ใหกวางไกลยิ่งขึ้นผานขบวนการทางการเมือง"
  AST_realize_the_value_of_british_citizenship: "ตระหนักถึงคุณคาของสัญชาติบริติช"
  AST_realize_the_value_of_british_citizenship_desc: "การเปนเจาอาณานิคมของ [ENG.GetNameDefCap] เหนือ [AST.GetName] เปนทั้งโลปกปองและแสงนําทางใหชาติเรามาชานาน เรามาจากอังกฤษ และเราจะยังเปนสวนหนึ่งของอังกฤษ — ตราบเทาที่มันยังเปนประโยชนแกเรา"
  AST_the_bolsheviks_counterforce: "พลังตานบอลเชวิค"
  AST_the_bolsheviks_counterforce_desc: "สํานักงานสืบสวนไดดําเนินการสอบสวนกิจกรรมของกลุมบอนทําลายมานานหลายทศวรรษ งานปราบปรามภัยคุกคามฝายซายของสํานักงานมีคุณคาสูง และไมควรถูกละเลยเพียงเพราะฝายตรงขามของออสเตรเลียตองมากอนหันมาตอตานการเติบโตของเราแทน เราจะแสวงหาตําแหนงในสํานักงานขาวกรองออสเตรเลีย และทําใหแนใจวาภัยคุกคามที่แทจริงตอความมั่นคงของชาติไดรับความสําคัญเปนอันดับแรก"
  AST_public_meetings_tt: "ปลดล็อกการตัดสินใจ §Yขบวนการออสเตรเลียตองมากอน§! เพื่อระดมสมาชิกและเพิ่มการสนับสนุนฟาสซิสต"
  AST_rile_up_veterans: "ปลุกระดมทหารผานศึก"
  AST_rile_up_veterans_desc: "เมื่อเริ่มเกิดภาวะเศรษฐกิจตกตํ่าครั้งใหญ ทหารผานศึกสงครามโลกครั้งที่ 1 ไดรวมตัวกันเปนกลุมกึ่งทหารขวาจัดเพื่อตอตานการผงาดของคอมมิวนิสต แมกลุมเหลานั้นจะสลายตัวไปแลว แตการผงาดของออสเตรเลียตองมากอนอาจเพียงพอที่จะนําพวกเขากลับมา และทําใหคบเพลิงแหงการตอตานคอมมิวนิสตลุกโชนกวาที่เคย"
  AST_eureka_stockade_monument_rally: "ชุมนุมที่อนุสาวรียยูรีกาสต็อกเคด"
  AST_eureka_stockade_monument_rally_desc: "ในป 1854 ในยุทธการยูรีกาสต็อกเคด คนงานเหมืองทองชาวออสเตรเลียไดตอสูอยางดุเดือดกับกองกําลังอาณานิคม เพราะคาใบอนุญาตทําเหมืองที่ไมสมเหตุสมผลและการเก็บภาษีเหมืองทอง ความไมพอใจตอการปกครองของอังกฤษปรากฏชัดในตอนนั้น และในตอนนี้ก็เชนกัน เราจะรวมตัวกันที่อนุสาวรียของยุทธการนั้นและชุมนุมเพื่อแยกตัวจากอังกฤษ"
  AST_australian_pivot_modifier: "จุดหมุนของออสเตรเลีย"
  AST_well-being_of_the_community: "ความผาสุกของชุมชน"
  AST_well-being_of_the_community_desc: "อุดมคติแบบคริสเตียนวาดวยชีวิตและครอบครัวควรไดรับการยกยองอยางสูงจากประชาชนออสเตรเลีย แตดวยอัตราการเกิดที่ตํ่าในชวงหลายปที่ผานมา อุดมคติเหลานี้ไมไดรับการเคารพมากพออยางปฏิเสธไมได เพื่อความผาสุกของชุมชน เราจะเปดตัวแคมเปญสงเสริมชีวิตครอบครัว"
  AST_for_crown_and_empire: "เพื่อมงกุฎและจักรวรรดิ"
  AST_for_crown_and_empire_desc: "ในฐานะอดีตอาณานิคมของเครือจักรภพ ขนบธรรมเนียมของ [ENG.GetNameDef] ก็คือของเรา แมจะทําใหสถาบันอังกฤษหลายแหงมีสถาบันคูขนานแบบ [AST.GetAdjective] แตก็ไมใชทั้งหมด ในฐานะผูแทนพระมหากษัตริยอังกฤษ ผูสําเร็จราชการแผนดินของ [AST.GetName] ไดนําเอกภาพแบบบริติชมาสูทวีปของเรา แต [AST.GetName] ตองการสัญลักษณแหงความรักชาติเปนของตนเอง"
  AST_for_crown_and_empire_trigger_tt: "สมาชิกนิวการดมากกวา §Y25,000§! คน"
  AST_royal_prestige: "เกียรติภูมิแหงราชวงศ"
  AST_royal_prestige_desc: "อัตลักษณของชาติที่แข็งแกรงสรางขึ้นบนคุณคารวม และธํารงไวดวยเกียรติและความภาคภูมิใจ เพื่อใหแตกตางจากอังกฤษและชาติอื่น ๆ ในเครือจักรภพ [AST.GetName] ตองสรางเกียรติภูมิของชาติ และลงทุนในกิจการที่ควรคาแกความเคารพ: กองเรือที่ใหญพอจะทัดเทียมแมกระทั่งของอังกฤษ"
  AST_reform_the_state: "ปฏิรูปรัฐ"
  AST_reform_the_state_desc: "เพื่อปกปอง [AST.GetName] จากวิกฤตรัฐบาลและนโยบายที่ทําลายมากกวาเสริมสรางชาติ รัฐ [AST.GetAdjective] ตองไดรับการปรับโครงสราง วุฒิสภาจะกลายเปนสภามงกุฎ และคณะรัฐมนตรีจะกลายเปนกระทรวงหลวง ทั้งสองขึ้นตรงตอประมุขแหงรัฐคนใหม ซึ่งอํานาจจะแผไปทุกมุมของราชอาณาจักร"
  AST_reform_the_state_tt: "การเลือกประธานจะกําหนด §Yผล§! ของแผนยุทธศาสตรถัดไป §Y$AST_the_councils_advice$§!"
  AST_council_president_tt: "ประธาน: §Y[GET_AST_COUNCIL_PRESIDENT]§!"
  AST_council_president_tbd_tt: "ยังไมไดแตงตั้ง"
  AST_glory_of_the_fleet: "ความรุงโรจนแหงกองเรือ"
  AST_glory_of_the_fleet_desc: "ดวยความมุงมั่นอันไมยอทอ กองเรือของ [AST.GetName] เติบโตใหญกวากอนสนธิสัญญานาวีวอชิงตันและการรื้อถอนเรือรบหลังสงครามโลกครั้งที่ 1 เสียอีก เราพรอมจะรบและชนะในทะเลอีกครั้ง และดวยการลงทุนเพิ่มเติม ในที่สุดเราจะครองมหาสมุทรเปนของเรา"
  AST_glory_of_the_fleet_capital_trigger: "มีเรือหลักหรือเรือบรรทุกเครื่องบินอยางนอย §Y4§! ลํา"
  AST_glory_of_the_fleet_screen_trigger: "มีเรือคุมกันอยางนอย §Y20§! ลํา"
  AST_the_councils_advice: "คําแนะนําของสภา"
  AST_the_councils_advice_desc: "ภายใตการนําของประธาน สภามงกุฎกําลังใหคําแนะนําเกี่ยวกับลําดับความสําคัญใหมของชาติ [GET_AST_THE_COUNCILS_ADVISE_DESC]"
  AST_the_councils_advice_pankhurst_walsh_desc: "ประธานแพงกเฮิสต วอลช ซึ่งเปนผูอพยพจากอังกฤษเอง ใหคุณคากับความรวมมือในเครือจักรภพมาโดยตลอด แม [AST.GetName] จะเริ่มแตกตางจากอังกฤษในหลายดาน แพงกเฮิสตเสนอใหเราบํารุงความสัมพันธออสเตรเลีย-อังกฤษ เพื่อจูงใจใหอังกฤษชวยเหลือการแยกตัวของเรา"
  AST_the_councils_advice_hughes_desc: "หลายปกอนสงครามปะทุ บิลลี ฮิวสมองเห็นความขัดแยงลวงหนาและสนับสนุนการฟนฟูกําลังรบมาตลอดนับแตนั้น กระนั้นประธานยังเห็นวาความตองการทางทหารของ [AST.GetName] ยังไมไดรับการตอบสนองเต็มที่ สภามงกุฎจึงแนะนําใหลงทุนเพิ่มเติม"
  AST_the_councils_advice_hore_ruthven_desc: "การปกปองราชอาณาจักรตองมาเหนือสิ่งอื่นใด หากเราไมมีแผนดินใหปกปอง กําลังทหารก็ไรคา สภามงกุฎมีมติเปนเอกฉันทวาพรมแดนของเราตองไดรับการเสริมปอมปราการ"
  AST_president_pankhurst_walsh_flag: "§Y$AST_adela_walsh$§! เปนประธานสภามงกุฎ"
  AST_president_pankhurst_walsh_effect_tt: "หาก $AST_adela_walsh$ เปนประธานสภามงกุฎ:"
  AST_president_hughes_effect_tt: "หาก $AST_billy_hughes$ เปนประธานสภามงกุฎ:"
  AST_president_hore_ruthven_effect_tt: "หาก $AST_alexander_hore_ruthven$ เปนประธานสภามงกุฎ:"
  AST_no_king_without_kingdom: "ไมมีกษัตริยหากไรราชอาณาจักร"
  AST_no_king_without_kingdom_desc: "หากชาวออสเตรเลียจะรักชาติอยางแทจริง ชาตินั้นตองรวมเปนหนึ่งในอธิปไตย ดวยกองเรือที่ขยายตัวอยางรวดเร็ว และสถาบันการปกครองที่รับใชรัฐอยางเหมาะสม ความโดดเดี่ยวและการเปนเอกราชไมอาจขมขวัญ [AST.GetName] ไดอีกตอไป ในที่สุด [AST.GetName] จะกลายเปนราชอาณาจักร"
  AST_heavy_is_the_head: "ศีรษะที่ทรงมงกุฎยอมหนักอึ้ง"
  AST_heavy_is_the_head_desc: "อํานาจมาพรอมความรับผิดชอบ และดวยกําลังทหารที่เติบโตของ [AST.GetNameDef] จึงดูไมสมเหตุสมผลอีกตอไปที่ดินแดนโดยรอบจะไดรับการปกปองจากชาติที่เห็นไดชัดวาขาดศักยภาพ เราจะถามพันธมิตรของเราวาพวกเขาปกปองดินแดนในเอเชียตะวันออกเฉียงใตไดจริงหรือไม หรือดินแดนเหลานั้นจะไดรับการดูแลดีกวาภายในราชอาณาจักรออสเตรเลีย"
  AST_enemy_of_the_realm: "ศัตรูแหงราชอาณาจักร"
  AST_enemy_of_the_realm_desc: "การขยายอํานาจของญี่ปุนดูจะไรขีดจํากัด เพิกเฉยตออธิปไตยและบูรณภาพของราชอาณาจักรทุกแหงที่แผไปถึง [AST.GetNameDefCap] จะไมยอมทน หาก [JAP.GetNameDef] คุกคามราชอาณาจักรของออสเตรเลีย ออสเตรเลียก็จะคุกคามของพวกเขาเชนกัน เพื่อมงกุฎและมาตุภูมิ [AST.GetNameDef] จะเขาสูสงคราม"
  AST_enemy_of_the_realm_at_peace_tt: "\nหากไมไดทําสงครามกับ §Y[JAP.GetName]§!:"
  AST_enemy_of_the_realm_at_war_tt: "หากทําสงครามกับ §Y[JAP.GetName]§! อยูแลว:"
  AST_a_throne_upon_the_seas: "บัลลังกเหนือทองทะเล"
  AST_a_throne_upon_the_seas_desc: "ถึงเวลาแลวที่ราชอาณาจักรจะพิสูจนตนเองวาคูควรกับทองทะเล มหาอํานาจทางทะเลไมอาจปดปากเราไดอีกตอไป ไมใชเมื่อคลื่นกําลังเรียกหาและใบเรือของเรากําลังตึงลม ในที่สุด มหาสมุทรจะเปนของเรา"
  AST_a_throne_upon_the_seas_tt: "ทุกประเทศศัตรูที่มีอัตราสวนกําลังทางเรือโดยประมาณ §Y100%§! ขึ้นไปเมื่อเทียบกับออสเตรเลีย:\n(§Yไมมีประเทศใด§!):"
  AST_refuse_british_wars: "ปฏิเสธสงครามของอังกฤษ"
  AST_refuse_british_wars_desc: "ยุทธการกัลลิโพลีในมหาสงครามแสดงใหเห็นถึงความบุมบามที่ [ENG.GetNameDef] ปฏิบัติตอกองกําลังสํารวจของเรา ทําใหความคิดที่จะออกรบในตางแดนในนามของอังกฤษอีกครั้งเปนสิ่งที่คิดไมไดเลย ชาวออสเตรเลียเรียกรองวาเลือดจะตองไมหลั่งภายใตการบัญชาการของอังกฤษอีก บีบใหรัฐบาลตองลงมือ ธรรมนูญเวสตมินสเตอรจะไดรับการใหสัตยาบัน"
  AST_walls_like_uluru: "กําแพงดั่งอูลูรู"
  AST_walls_like_uluru_desc: "ออสเตรเลียเปนทวีปในตัวเอง หากเราไมอยากไรกําลังเมื่อปราศจากโลของจักรวรรดิ เราตองหลอมโลของเราเอง แนวชายฝงจะถูกเสริมใหแข็งแกรง ทาเรือจะถูกสรางปอมปราการ และเสนทางเขาออกจะกลายเปนกับดักอันตรายสําหรับผูใดที่คิดวาชาตินี้เปนรางวัลที่ไดมางาย ๆ"
  AST_at_the_gates: "ณ ประตูเมือง"
  AST_at_the_gates_desc: "โลกกําลังมุงสูสงคราม และออสเตรเลียตองไมถูกจับไดขณะไมพรอม โรงงานและอูตอเรือของชาติตองเรงเครื่องขึ้นอีกระดับ นี่ไมใชการเตรียมพรอมสําหรับความขัดแยงของผูอื่น แตเปนการเตรียมพรอมเพื่อความอยูรอดของเราเอง"
  AST_at_the_gates_hidden: "$AST_at_the_gates$"
  AST_at_the_gates_hidden_desc: "$AST_at_the_gates_desc$"
  AST_the_guild_for_the_war_effort: "สมาคมสตรีเพื่อความพยายามทําสงคราม"
  AST_the_guild_for_the_war_effort_desc: "สมาคมสตรีแหงจักรวรรดิออสเตรเลียกอตั้งขึ้นเพื่อรับใชมงกุฎ บัดนี้เปาหมายของสมาคมกําลังถูกเปลี่ยนทิศทางทั้งหมด เครือขายองคกรอันกวางใหญที่สรางไวจะทุมพลังใหแกอุตสาหกรรมสงคราม โรงพยาบาล และหวงโซอุปทานของออสเตรเลียที่พึ่งพาตนเอง"
  AST_for_the_southern_cross: "เพื่อกางเขนใต"
  AST_for_the_southern_cross_desc: "กางเขนใตไมไดโบกสะบัดเหนืออังกฤษ แตโบกสะบัดเหนือเรา อัตลักษณออสเตรเลียเปนสิ่งที่มีอยูจริง เปนสิ่งที่ไดมาดวยความพยายาม และเปนสิ่งที่ควรคาแกการปกปอง ความภาคภูมิใจแหงชาติแบบใหมกําลังถูกหลอมขึ้น ไมไดหยิบยืมมาจากลอนดอนหรือถูกนิยามโดยสถาบันอันหางไกล แตงอกงามขึ้นที่นี่ จากผืนดินนี้ ใตดวงดาวเหลานี้"
  AST_through_the_gates: "ผานประตูเมือง"
  AST_through_the_gates_desc: "การเตรียมพรอมไดเปลี่ยนเปนความเรงดวน โครงการปองกันประเทศกําลังขยายตัวโดยมีอุตสาหกรรมออสเตรเลียทั้งหมดหนุนหลัง สิ่งอํานวยความสะดวกใหมผุดขึ้นเคียงขางของเดิม เปาหมายการผลิตถูกปรับสูงขึ้น และเสนแบงระหวางการผลิตพลเรือนกับความจําเปนทางทหารถูกลบเลือนไปอยางเงียบ ๆ"
  AST_toe_the_line: "ทําตามระเบียบ"
  AST_toe_the_line_desc: "ความสะดวกสบายที่ชาวออสเตรเลียคุนเคยในยุครุงเรืองตองถูกพักไวกอน การปนสวน ชั่วโมงทํางานที่ยาวขึ้น และการเรียกเขารับราชการคือราคาของเอกราช ผูที่ตอบรับจะพบชาติที่พรอมยืนหยัดอยูเบื้องหลังพวกเขา แตรัฐจะมีความอดทนนอยนิดตอผูที่เชื่อวาการเสียสละเปนภาระของคนอื่น"
  AST_crush_the_gates: "ทลายประตูเมือง"
  AST_crush_the_gates_desc: "การสะสมกําลังเสร็จสมบูรณ อุตสาหกรรมออสเตรเลียบัดนี้ดําเนินงานเต็มรูปแบบในภาวะสงคราม ผลผลิตทั้งหมดมุงสูการปองกันและการแผขยายอํานาจของชาติ ไมวาพายุใดจะมา ออสเตรเลียจะเผชิญหนามันโดยไมใชในฐานะประเทศในเครือจักรภพที่ลังเลและตะเกียกตะกายระดมพล"
  AST_national_defense: "การปองกันประเทศ"
  AST_national_defense_desc: "ดวยการลงทุนอยางตั้งใจและทิศทางระดับชาติ ออสเตรเลียไดสรางฐานอุตสาหกรรมที่สามารถคํ้าจุนการปองกันของตนเองได โรงงานและอูตอเรือดําเนินงานภายใตการกํากับดูแลของรัฐ ผลผลิตไมไดวัดดวยกําไร แตวัดดวยความตองการของชาติ"
  modify_AST_national_defense_tt: "ปรับ §Y$AST_national_defense$§! โดย:"
  AST_nauru_pact: "กติกานาอูรู"
  AST_nauru_pact_desc: "เมื่ออุปสรรคแรกคือการยึดอํานาจยังอยูเบื้องหนา เรื่องเอกราชจึงดูหางไกล อยางไรก็ตาม อํานาจปกครองตนเองของออสเตรเลียไมไดเปนผลประโยชนของเราเพียงฝายเดียว เพื่อแลกกับการที่ [GER.GetNameDef] รับประกันอธิปไตยของเราในกรณีที่อังกฤษตอตานออสเตรเลียตองมากอน หรือเมื่อเราแยกตัวออกจากเครือจักรภพในที่สุด เมื่อขึ้นสูอํานาจ เราจะคืนเกาะแปซิฟกที่พวกเขาสูญเสียไปหนึ่งเกาะ: นาอูรู"
  AST_australian_culture_investments: "ลงทุนในวัฒนธรรมออสเตรเลีย"
  AST_australian_culture_investments_desc: "ดวยความเรียงเรื่อง The Foundations of Culture in Australia ของเขา สตีเฟนเซนไดมีอิทธิพลตอการกอตัวของขบวนการกวีจินดีวอโรแบก และทําใหสิ่งหนึ่งชัดเจน: วัฒนธรรมออสเตรเลียตองมากอน รัฐบาลดูจะละเลยคุณคาของศิลปนและนักเขียนโดยสิ้นเชิง แตเราจะไมทําเชนนั้น ดวยการระดมผูสนับสนุนทั้งจินดีวอโรแบกและออสเตรเลียตองมากอน เราจะกระตุนการพัฒนาทางวัฒนธรรม"
  AST_australian_culture_investments_tt: "\nหลังจาก §Y365§! วัน:"
  AST_australia_first_party_focus: "พรรคออสเตรเลียตองมากอน"
  AST_australia_first_party_focus_desc: "สมาชิกของออสเตรเลียตองมากอนเพิ่มจํานวนขึ้นจนไมอาจยับยั้งการรุกคืบของขบวนการไดอีกตอไป ถึงเวลาที่สาธารณชนออสเตรเลียจะตอนรับเสียงชาตินิยมที่ดังที่สุดซึ่งเพิ่งจดทะเบียนใหม: พรรคออสเตรเลียตองมากอน"
  AST_australia_first_party_req_tt: "§Yพรรคออสเตรเลียตองมากอน§! ไดรับการกอตั้งแลว"
  AST_in_from_the_cold: "ออกจากเงามืด"
  AST_in_from_the_cold_desc: "พลเมืองผูตอตานประชาธิปไตยไมตองหลบซอนอีกตอไป การปฏิบัติอยางไมเปนธรรมที่ชาติเราตองทนภายใตรัฐบาลชุดกอน ๆ มายาวนานไดถูกเปดโปงในที่สุด และถึงเวลาที่เสียงใหมจะไดรับการรับฟง"
  AST_absorb_the_uap: "กลืนพรรค UAP"
  AST_absorb_the_uap_desc: "แมพรรคยูไนเต็ดออสเตรเลียจะยึดแนวเสรีนิยมมาโดยตลอด แตก็ดึงดูดผูเห็นตางทางการเมืองทุกประเภท อยางไรก็ตาม เมื่อพรรคการเมืองใหมกุมบังเหียน สมาชิก UAP — ไมวาจะเต็มใจหรือไม — อาจแทบไมมีทางเลือกนอกจากหันมาสนับสนุนแนวทางของรัฐบาลปจจุบันแทน เราจะดึงตัวสมาชิกที่โดดเดนที่สุดมา"
  AST_big_business_pact: "กติการวมกับธุรกิจใหญ"
  AST_big_business_pact_desc: "ในความพยายามปกปองอุตสาหกรรมภายในประเทศ เราไดพบผูสนับสนุนมากมายในหมูผูนําธุรกิจระดับสูง พวกเขาจะสนับสนุนเปาหมายทางการเมืองและการทหารของเรา เพื่อแลกกับนโยบายที่เพิ่มกําไรใหพวกเขา"
  AST_big_business_pact_tt: "\nปลดล็อกการตัดสินใจ §Yกติการวมกับธุรกิจใหญ§! เพื่อสงผลตอเปาหมายดานอุตสาหกรรมและการกอสราง"
  AST_autarky: "อัตตาธิปไตยทางเศรษฐกิจ"
  AST_autarky_desc: "การพึ่งพาการคาตางประเทศเปนเรื่องเสี่ยง โดยเฉพาะในยามขัดแยง อุตสาหกรรมออสเตรเลียตองมากอน ไมใชถูกสินคานําเขาแยงตลาด มีเพียงการจํากัดกฎหมายการคาเทานั้นที่จะปกปองเศรษฐกิจภายในประเทศ และทําใหออสเตรเลียพึ่งพาตนเองได"
  AST_energy_independence: "เอกราชทางพลังงาน"
  AST_energy_independence_desc: "การพึ่งพาการคาตางประเทศเปนเรื่องเสี่ยง โดยเฉพาะในยามขัดแยง เอกราชทางพลังงานเปนสิ่งสําคัญยิ่งเพื่อใหออสเตรเลียดําเนินไปไดแมในยามคับขันที่สุด การลงทุนในโรงกลั่นจะชวยสงเสริมการผลิตพลังงานภายในประเทศ"
  AST_the_kings_men: "ทหารของพระราชา"
  AST_the_kings_men_desc: "แมนิวการดจะมีชื่อเสียงวาเปนพวกโอนออนตอฟาสซิสต แตความจริงซับซอนกวานั้น แมกลุมแยกยอยบางกลุมรวมถึงผูกอตั้งขบวนการเองจะยึดถืออุดมคติฟาสซิสต แตสมาชิกสวนใหญไมไดเปนเชนนั้น ดวยความรักชาติอยางแรงกลาและความจงรักภักดีตอสถาบันกษัตริย เหลาการดยินดีจะสูเพื่อมงกุฎ"
  AST_the_kings_men_tt: "สรางหนวยทหารราบ §Y[GET_AST_NG_INF_UNITS] [AST.GetAdjective]§! หนวย"
  AST_ng_inf_units_tt: "ไดรับหนวยทหารราบ §Y1§! หนวยตอสมาชิกนิวการดทุก §Y10,000§! คน"
  AST_campbells_men: "คนของแคมปเบลล"
  AST_campbells_men_desc: "ดวยการเติบโตอยางรุงเรือง ขบวนการออสเตรเลียตองมากอนไดปลุกอีกขบวนการหนึ่งที่หลับใหลมานาน นิวการดกลับมาบนทองถนนอีกครั้ง แตโชคดีที่คราวนี้สมาชิกอยูฝายรัฐบาล เราจะดูดซับพวกเขาเขาสูพรรคและใหพวกเขาตอสูเพื่อออสเตรเลีย เชนที่เคยทํามาเสมอ"
  AST_campbells_men_tt: "สรางหนวยทหารอาสา §Y[GET_AST_NG_MIL_UNITS] [AST.GetAdjective]§! หนวย"
  AST_ng_mil_units_tt: "ไดรับหนวยทหารอาสา §Y1§! หนวยตอสมาชิกนิวการดทุก §Y5,000§! คน"
  AST_the_commander_returns: "ผูบัญชาการคืนสูสนาม"
  AST_the_commander_returns_desc: "สายลมที่คุนเคยพัดเถาถานของตํานานที่ยังมีชีวิตและคืบคลานอยูใตขี้เถา บิดาแหงนิวการดไดเรียนรูอยางเจ็บปวดวาหุนสวนไมใชพันธมิตรเสมอไปเมื่อความแตกตางทางอุดมการณมากเกินไป และความเปนเอกภาพของพลเรือนสําคัญตอการปองกันประเทศพอ ๆ กับกําลังทหาร หากไดรับมอบบังเหียนของออสเตรเลียตองมากอน เขาจะทุมเทการดที่ภักดีที่สุดเพื่อจัดการผูเห็นตางทางการเมือง"
  AST_the_commander_returns_trigger_tt: "สมาชิกนิวการดมากกวา §Y15,000§! คน"

  remove_2_offsite_dockyard: "นํา §Yอูตอเรือ§! นอกแผนที่ออก §R2§! แหง"
  AST_british_pact: "กติการวมกับอังกฤษ"
  AST_british_pact_desc: "แม [AST.GetName] จะเพิ่งเปลี่ยนแปลงทางการเมือง แตการรวมมือกับมาตุภูมิเกาตอไปยังคงเปนผลประโยชนของเรา เมื่อพิจารณาวา [ENG.GetNameDef] ตองกระจายกําลังบาง ๆ ไปทั่วโลก ความเต็มใจของเราที่จะแบงเบาภาระดวยการเสนอความรวมมือทางทหารยอมควรไดรับการชื่นชม"
  AST_naurus_return_to_german_hands: "นาอูรูคืนสูมือเยอรมนี"
  AST_naurus_return_to_german_hands_desc: "บัดนี้เมื่อออสเตรเลียตองมากอนกุมบังเหียนของชาติอยางเต็มที่ ถึงเวลาที่คําสัญญาเรื่องนาอูรูจะเปนจริง และพันธมิตรเยอรมันจะทําตามขอตกลงในสวนของตน [AST.GetName] จะหลุดพนจากพันธนาการของเครือจักรภพในที่สุด โดยที่อังกฤษไมมีสิทธิ์มีเสียงใด ๆ ในเรื่องนี้"
  AST_naurus_return_to_german_hands_tt: "'§Yกติกานาอูรู§!' มีผลบังคับใช"
  AST_naurus_return_to_german_hands_tt_2: "'§Yกติกานาอูรู§!' กําลังมีผลบังคับใช"
  AST_the_winner_takes_it_all: "ผูชนะกินรวบ"
  AST_the_winner_takes_it_all_desc: "แมการสละเกาะนาอูรูเพื่อแลกกับความรวมมือจากเยอรมนีจะเคยดูสมเหตุสมผล แตตอนนี้ไมใชอีกแลว เมื่อขีดความสามารถของเราไดรับการพิสูจนวาแข็งแกรง เราจะแสวงหาการขยายตัวสูหมูเกาะโซโลมอนและนิวซีแลนด แมอยางแรกอาจเพิ่มการทรยศตอกติกานาอูรูก็ตาม อยางไรเสีย หมูเกาะโซโลมอนก็จะกลายเปนดินแดนเยอรมันอีกแหงที่ตกอยูในมือออสเตรเลีย"
  AST_resist_western_intruders: "ตานผูบุกรุกจากตะวันตก"
  AST_resist_western_intruders_desc: "ชาติตะวันตกดูจะถูกบีบใหเขามากาวกายกิจการในแปซิฟก แตสิ่งนั้นจะไมเกิดขึ้นอีกตอไป กอนที่พวกเขาจะมาถึงชายฝงของเรา เราจะไปถึงชายฝงของพวกเขากอน พิสูจนวา [AST.GetName] ไมใชชาติที่ยอมจํานนตอขอเรียกรอง"
  AST_invasion_preparation_tt: "เวลาเตรียมการยกพลขึ้นบก: §G-20.0%§!"
  AST_naval_invasion_penalty_tt: "บทลงโทษการยกพลขึ้นบก: §G-20.0%§!"
  AST_expand_the_fort: "ขยายปอมปราการ"
  AST_expand_the_fort_desc: "แปซิฟกตะวันตกไมใชที่ที่ [USA.GetNameDef] จะสั่งการ หมูเกาะที่อเมริกาอางสิทธิ์เปนของชาติในเอเชียตะวันออก และเมื่ออิทธิพลของออสเตรเลียเติบโตขึ้น เราจะเปนผูอางสิทธิ์ในหมูเกาะเหลานั้นเอง"
  AST_integrate_the_fort: "ผนวกรวมปอมปราการ"
  AST_integrate_the_fort_desc: "ดวยการปกครองนิวกินีภายใตอาณัติของสันนิบาตชาติมาตั้งแตป 1920 และปาปวเปนดินแดนภายนอกของ [AST.GetName] มาเกือบตั้งแตการรวมสหพันธรัฐ ภาคตะวันออกของปาปวนิวกินีจึงเปนสวนเพิ่มโดยธรรมชาติของดินแดนหลักของ [AST.GetName] ในฐานะสวนหนึ่งของความพยายามหลอมรวมวัฒนธรรมออสเตรเลีย นี่จะเปนกาวตอไป"
  AST_defying_american_interference: "ทาทายการแทรกแซงของอเมริกา"
  AST_defying_american_interference_desc: "เงาของ [USA.GetNameDefCap] ทอดทับเรา พรอมจะแทรกแซงทุกครั้งที่การกระทําของเราไมสอดคลองกับผลประโยชนของมัน ตราบใดที่มหาอํานาจโลกขนาดนั้นกําหมัดเหล็กรอบ [PHI.GetNameDef] ชาติในเอเชียตะวันออกจะไมมีวันเปนของเอเชียตะวันออกอยางแทจริง [AST.GetName] จะไมยอมจํานนตออํานาจใดของผูบุกรุกตางชาติ — ฟลิปปนสจะเปนของเรา"
  AST_the_pacific_garrison: "กองรักษาการณแปซิฟก"
  AST_the_pacific_garrison_desc: "แมการปกปองเอเชียตะวันออกเฉียงใตและแปซิฟกจะเปนผลประโยชนของอังกฤษ แตภูมิภาคนี้ก็อยูหางไกลจากหมูเกาะบริเตน เพื่อแลกกับการสนับสนุนดานเสบียง เราจะเสนอรับหนาที่บัญชาการการปองกันดินแดนนี้ เพื่อให [ENG.GetNameDef] หันความสนใจไปที่อื่นได"
  AST_vichy_out_of_africa: "ขับวิชีออกจากแอฟริกา"
  AST_vichy_out_of_africa_desc: "การลมสลายหรือการยอมรวมมือของฝรั่งเศสเขตวิชีเปนหนึ่งในเปาหมายหลักของ [ENG.GetNameDef] เพื่อแสดงไมตรีจิต [AST.GetName] จะเขารวมและไลลาอาณานิคมฝรั่งเศสในแอฟริกาจนกวาจะสยบลง"
  AST_vichy_out_of_africa_tt1: "เพิ่มการอางสิทธิ์ในดินแดนของ §Yฝรั่งเศสเขตวิชี§! ใน §Yแอฟริกา§! ผานแผนยุทธศาสตร §Yขับวิชีออกจากแอฟริกา§!\n"
  AST_vichy_out_of_africa_tt2: "เพิ่มการอางสิทธิ์ในดินแดนของ §Yฝรั่งเศสเขตวิชี§! ใน §Yแอฟริกา§! ผานการตัดสินใจ §Yขับวิชีออกจากแอฟริกา§!\n"
  AST_vichy_africa_claim_flag: "การอางสิทธิ์ของ [AST.GetFlag]§Y[AST.GetName]§! ในดินแดนทั้งหมดของ §Yฝรั่งเศสเขตวิชี§! ใน §Yแอฟริกา§! จะถูกเพิ่มเขา §Yของเราอยางปฏิเสธไมได§!"
  AST_vichy_claim_tt: "การอางสิทธิ์ของ [AST.GetFlag]§Y[AST.GetName]§! จะถูกเพิ่มเขา §Yของเราอยางปฏิเสธไมได§!"
  vichy_in_africa_trigger: "§Yฝรั่งเศสเขตวิชี§!: รัฐใดก็ไดที่ควบคุมอยู:\n    อยูใน §Yแอฟริกา§!"
  vichy_wargoal: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอ §Yฝรั่งเศสเขตวิชี§!"
  AST_britain_supplying_ships: "อังกฤษจัดหาเรือ"
  AST_britain_supplying_ships_desc: "จากการแบกภาระคุมกันชายฝงของพันธมิตรอังกฤษ ชัดเจนแลววากองเรือของ [ROOT.GetName] จําเปนตองขยาย เปนการสมควรแลวที่ [ENG.GetNameDefCap] จะจัดหาเรือใหเรา"
  AST_hand_in_glove: "สนิทชิดเชื้อ"
  AST_hand_in_glove_desc: "การขยายตัวขึ้นเหนือจะชวยเพิ่มอิทธิพลของออสเตรเลียตอการทูตและความขัดแยงในเอเชียตะวันออกเฉียงใต เราไดพิสูจนแลววาสามารถปกปองผลประโยชนของอังกฤษควบคูกับของเราเองได ดังนั้น [ENG.GetNameDef] ตองเขาใจวาทําไมดินแดนหางไกลของพวกเขาจึงควรอยูในมือเรามากกวา"
  AST_claim_french_indochina: "อางสิทธิ์อินโดจีนฝรั่งเศส"
  AST_claim_french_indochina_desc: "เมื่อชะตากรรมของฝรั่งเศสยังไมแนนอน ชะตากรรมของอาณานิคมก็ยังไมถูกกําหนดเชนกัน ชาติอื่นอาจพยายามยื่นมืออันละโมบเขาหาอินโดจีนฝรั่งเศส แตพวกเขาจะเอาชนะเราไมได"
  AST_undeniably_ours: "ของเราอยางปฏิเสธไมได"
  AST_undeniably_ours_desc: "ไมวาการทูตจะมอบสิ่งใดใหเรา ก็ไมมีวันมอบใหทั้งหมด ในสภาพที่เปราะบาง พรมแดนของฝรั่งเศสเขตวิชีเปนเพียงขอเสนอแนะ และการปลอยโอกาสที่จะยึดครองดินแดนของพวกเขาทั้งหมดใหหลุดลอยไปคงไมฉลาดเลย อยางหลีกเลี่ยงไมได ถึงเวลาทําสงครามแลว"
  AST_done_meddling: "พอกันทีกับการแทรกแซง"
  AST_done_meddling_desc: "ดวยความภักดีตอประเทศเกาเสมอมา [AST.GetName] ยังคงสูรบในสงครามของอังกฤษอยางเชิดหนา ชาวออสเตรเลียเปนคนที่พึ่งพาได แตไมไดหมายความวาควรถูกมองขาม ขณะที่ [AST.GetName] สูเพื่อ [ENG.GetNameDef]  [ENG.GetNameDef] ก็ตองสูเพื่อ [AST.GetName] เชนกัน"
  AST_northern_advancement: "รุกคืบขึ้นเหนือ"
  AST_northern_advancement_desc: "แมออสเตรเลียอยากจะใสใจกิจการการเมืองของตนเองมากกวา แตเราไมอาจคาดหวังใหใครปลอยเราไวตามลําพัง เวนแตเราจะทําตัวใหเปนภัยคุกคาม [INS.GetNameDefCap] เปนชาติเชนเดียวกับเรา เปนเหยื่อของผูบุกรุกชาวยุโรปที่ไมยอมจากไป ดวยการอางสิทธิ์ในดินแดนนั้นเอง เราจะสงสัญญาณที่ชัดเจน: ชาติในแปซิฟกตองถูกปลอยไวตามลําพัง"
  AST_soothing_australian_fears: "คลายความหวาดกลัวของชาวออสเตรเลีย"
  AST_soothing_australian_fears_desc: "แมเจาหนาที่รัฐบางคนจะเชื่อในความเปนไปไดของความรวมมือระหวางออสเตรเลียกับญี่ปุน แตสาธารณชนออสเตรเลียไมเชื่อ หลังจากหวาดกลัวการรุกรานของญี่ปุนมานาน ความคิดที่จะจับมือกับผูรุกรานที่อาจเปนไปไดรายเดียวกันนั้นเปนเรื่องยากจะยอมรับสําหรับคนสวนใหญ ดังนั้นเราจะคลายความหวาดกลัวของพวกเขาดวยการเตรียมพรอมสําหรับสงคราม"
  AST_soothing_australian_fears_tt: "\nหลังจาก §Y180§! วัน:"
  AST_dividing_the_pacific: "แบงแปซิฟก"
  AST_dividing_the_pacific_desc: "ออสเตรเลียตองมากอนสนับสนุนสันติภาพกับ [JAP.GetNameDef] โดยมองชาตินั้น — ตางจากพลเมืองออสเตรเลียสวนใหญ — วาเปนพันธมิตรที่เปนไปไดในแปซิฟก แทนที่จะเปนภัยคุกคามที่ตั้งเคาอยูตลอดเวลา เมื่ออํานาจของ [AST.GetName] ขยายตัว ก็สมเหตุสมผลที่ [JAP.GetName] จะเห็นดวย และความขัดแยงที่อาจเกิดขึ้นระหวางสองชาติของเราจะไดรับการยุติกอนที่จะมีโอกาสปะทุขึ้น"
  AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
  AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
  AST_dividing_the_pacific_tt1: "§Gเราไดรับ§!:"
  AST_dividing_the_pacific_tt2: "§Rพวกเขาไดรับ§!:"
  AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§! โอนดินแดนที่ควบคุมอยูตอไปนี้:"

  AST_against_war_and_fascism: "ตอตานสงครามและฟาสซิสต"
  AST_against_war_and_fascism_desc: "ขบวนการตอตานสงครามและฟาสซิสตเปนสาขาออสเตรเลียของความพยายามระดับนานาชาติที่คอมินเทิรนใหการสนับสนุน เพื่อระดมกรรมกรตอตานกองกําลังปฏิกิริยา แมจะสูญเสียแรงขับเคลื่อนไปในชวงไมกี่ปที่ผานมา แตเปนหนาที่ของเราที่จะชูธงนําหนาอีกครั้ง"
  AST_world_peace: "สันติภาพโลก"
  AST_world_peace_desc: "ขบวนการตอตานสงครามและฟาสซิสตทํางานอยางหนักในการผลิตนิตยสารชื่อ 'สันติภาพโลก' ซึ่งเปดโปงความชั่วรายของขบวนการฟาสซิสตในเยอรมนีและอิตาลี โดยเฉพาะในชวงสงครามกลางเมืองสเปน ดวยแรงกระตุนจากบทความในนั้น อาสาสมัครตางกระตือรือรนที่จะเขารวมตอสูกับฟาสซิสต"
  AST_red_fred: "เฟรดแดง"
  AST_red_fred_desc: "เฟรด 'แดง' แพเทอรสัน ซึ่งดํารงตําแหนงสมาชิกสภาเมืองทาวนสวิลล ไดพิสูจนตนเองวาเปนผูนําที่มีความสามารถและเปนที่นิยม เมื่อคนจํานวนมากในพรรคหันมาสนับสนุนการนําของเขามากกวาแจ็ก ไมลส แพเทอรสันจึงกลายเปนตัวเลือกโดยธรรมชาติที่จะนําออสเตรเลียสูอนาคตแบบสังคมนิยม"
  AST_workers_defence_corps_sparks_anew: "กองปองกันกรรมกรลุกโชนอีกครั้ง"
  AST_workers_defence_corps_sparks_anew_desc: "กองปองกันกรรมกรเดิมตั้งขึ้นเพื่อปกปองแนวประทวงและการนัดหยุดงาน เมื่อกลุมอยางนิวการดแสดงความกาวราวมากขึ้น กองนี้จึงไดรับการรวมตัวขึ้นใหมเพื่อเปนโลปองกันใหผูที่ประทวงเรียกรองสิทธิและโอกาสที่ดีกวาอีกครั้ง"
  AST_a_controversial_recruitment: "การดึงตัวที่เปนขอถกเถียง"
  AST_a_controversial_recruitment_desc: "มอริซ แบล็กเบิรน เปนทนายความสังคมนิยมชื่อดัง มีชื่อเสียงจากการปกปองสิทธิของกรรมกรในการตอสูทางกฎหมายกับนายจางผูกดขี่ ในฐานะสมาชิกพรรคแรงงาน ความภักดีของเขาถูกตั้งคําถามเพราะมีความเชื่อมโยงกับขบวนการตอตานสงครามและฟาสซิสตที่หัวรุนแรงกวา"
  AST_from_picket_line_to_front_line: "จากแนวประทวงสูแนวหนา"
  AST_from_picket_line_to_front_line_desc: "ขณะที่กลยุทธขมขูของผูตอตานการปลดปลอยชนชั้นแรงงานกาวราวมากขึ้น การปองกันของเราก็ตองพัฒนาตอบโต ทุกเหตุการณทําใหกรรมกรมุงมั่นยิ่งขึ้น และมีผูกาวออกมาเขารวมกองปองกันเพิ่มขึ้นเรื่อย ๆ"
  AST_pig_iron_protests: "ประทวงเหล็กถลุง"
  AST_pig_iron_protests_desc: "คนงานทาเรือของเราไมเห็นดวยกับรัฐบาลในหลายกรณี โดยเฉพาะกรณีขายเหล็กถลุงใหประเทศคูสงคราม ชาวออสเตรเลียไมมีความประสงคจะมีสวนรวมในการรุกรานหรือขนสงยุทโธปกรณที่ใชทํารายพลเรือนผูบริสุทธิ์ และ [AST.GetName] ก็จะไมทําเชนกัน ประกาศนัดหยุดงาน"
  AST_part_with_colonizer: "แยกทางกับเจาอาณานิคม"
  AST_part_with_colonizer_desc: "รากเหงาของความทุกขยากของเราอยูที่จักรวรรดิบริติชและระบบทุนนิยมที่บังคับใชจากแดนไกล ไมอีกตอไปแลว เมื่ออังกฤษวุนอยูกับวิกฤตใกลบาน บัดนี้คือเวลาที่จะควาชะตากรรมของเราและกําหนดเสนทางของเราเองในฐานะชาติที่เสรีและเปนเอกราช"
  AST_take_it_to_the_streets: "ลงสูทองถนน"
  AST_take_it_to_the_streets_desc: "การเคลื่อนไหวทางอุตสาหกรรมเปนหนึ่งในเครื่องมือทรงพลังที่สุดที่เรามีเพื่อบังคับใหสังคมเปลี่ยนแปลง และเราตองใชมันตอสูกับระบบที่ออกแบบมาเพื่อขูดรีดเทานั้น ถึงเวลายึดปจจัยการผลิตคืน กรรมกรแหงออสเตรเลีย จงสามัคคีกัน!"
  AST_workers_educational_association: "สมาคมการศึกษากรรมกร"
  AST_workers_educational_association_desc: "สมาคมการศึกษากรรมกรเปนองคกรระหวางประเทศที่มุงทําใหผูใชแรงงานเขาถึงการศึกษาได เราควรตั้งสาขาของเราเอง เพราะความเทาเทียมทางโอกาสที่แทจริงเริ่มตนในหองเรียน"
  AST_off_leash: "ปลดสายจูง"
  AST_off_leash_desc: "คนงานทาเรือคือกระดูกสันหลังของการเคลื่อนไหวสหภาพแรงงานในออสเตรเลีย ในฐานะเกาะขนาดทวีป ไมนาแปลกใจที่แรงงานทางทะเลมีบทบาทสําคัญยิ่งตอเศรษฐกิจของเรา ถึงเวลาถอดปลอกคอ และปลดปลอยสุนัขทะเลแหงอุตสาหกรรม"
  AST_a_national_housing_commission: "คณะกรรมการที่อยูอาศัยแหงชาติ"
  AST_a_national_housing_commission_desc: "ที่อยูอาศัยเปนประเด็นถกเถียงมานาน ทุกคนสมควรมีหลังคาคุมหัว แตบอยครั้งความจําเปนพื้นฐานนี้ถูกใชเลนงานกรรมกร คาใชจายกลายเปนรูปแบบหนึ่งของการกดขี่ทางเศรษฐกิจ ไมอีกตอไปแลว เราจะเรียกรองการเขาถึงที่อยูอาศัยอยางเปนธรรมสําหรับทุกคน"
  AST_guaranteed_employment: "ประกันการจางงาน"
  AST_guaranteed_employment_desc: "สังคมนิยมมักถูกปดตกดวยขอกลาวหาวาผูขัดสนขี้เกียจหรือพึ่งพาผูอื่น สิ่งนี้ตองยุติ สิ่งที่เราตองการคือโอกาสทํางานอยางเปนธรรม และคาจางที่เปนธรรมเพื่อเลี้ยงดูครอบครัว"
  AST_equal_pay: "คาจางเทาเทียม"
  AST_equal_pay_desc: "เปนความเชื่อผิด ๆ ที่ฝงรากวาผูถือครองปจจัยการผลิตสมควรไดมากกวาผูใชแรงงานในนั้น เจาของและผูจัดการไมไดทํางานหนักกวา ทั้งไมไดมีทักษะมากกวาโดยกําเนิด ดวยการทําใหคาจางเทาเทียม ผลของแรงงานจะถูกแบงปนอยางเปนธรรมยิ่งขึ้นทั่วสังคม"
  AST_all_for_one_one_for_all: "หนึ่งเพื่อทุกคน ทุกคนเพื่อหนึ่ง"
  AST_all_for_one_one_for_all_desc: "'หนึ่งเพื่อทุกคน และมากกวาเพื่อฉัน' เปนคําขวัญของชนชั้นกระฎมพีมาชานาน ความโลภของพวกเขาเรียกรองมากขึ้นเรื่อย ๆ ขณะที่ตอบแทนกลับมานอยลงทุกที คําสัญญาที่วาความมั่งคั่งจะไหลลงสูเบื้องลางเปนเรื่องโกหก มันตองถูกแบงปนอยางเทาเทียม โดยทุกคนและเพื่อทุกคน"
  AST_abolition_of_private_property: "ยกเลิกกรรมสิทธิ์สวนบุคคล"
  AST_abolition_of_private_property_desc: "ฟนเฟองแหงอุตสาหกรรมถูกหลอลื่นดวยเลือดของกรรมกร เราตองยุติความโหดรายของการสะสมทุน และยกเลิกกรรมสิทธิ์สวนบุคคลโดยสิ้นเชิง ทุกสิ่งจะถูกแบงปน จากแตละคนตามความสามารถ สูแตละคนตามความจําเปน"
  AST_centralized_production: "การผลิตแบบรวมศูนย"
  AST_centralized_production_desc: "กลไกตลาดนั้นวุนวายและไมเทาเทียม หากเราจะสรางสังคมที่เปนธรรมอยางแทจริง รัฐตองมีบทบาทหลักในการกําหนดวาจะผลิตอะไร โดยใคร และที่ไหน ระบบราชการของเราเก็บบันทึกอยางพิถีพิถัน และอยูในตําแหนงที่ดีที่สุดในการกําหนดโควตาการผลิต"
  AST_public_institutions: "สถาบันสาธารณะ"
  AST_public_institutions_desc: "สังคมตองการบริการที่จําเปนมากมายเพื่อใหดําเนินไปได ตั้งแตการรักษาพยาบาลและที่อยูอาศัย ไปจนถึงการดูแลเด็กและการคมนาคม รัฐตองจัดหาสิ่งเหลานี้อยางทั่วถึง ใหทุกคนเขาถึงไดโดยไมมีขอจํากัด เมื่อหลุดพนจากความจําเปนที่ตองสรางกําไรใหเอกชน ระบบเหลานี้จะทํางานไดอยางมีประสิทธิภาพเพื่อตอบสนองความตองการของประชาชนทั้งหมด"
  AST_planned_extraction: "การสกัดทรัพยากรตามแผน"
  AST_planned_extraction_desc: "เราโชคดีที่มีแผนดินอุดมดวยทรัพยากรเชนนี้ เราตองทําใหแนใจวาความมั่งคั่งนี้ถูกสกัดอยางเปนระบบ และสงไปยังอุตสาหกรรมที่ตองการมากที่สุด"
  AST_maritime_commission: "$USA_maritime_commission$"
  AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
  AST_state_research_funding: "ทุนวิจัยของรัฐ"
  AST_state_research_funding_desc: "เพื่อใหสถาบันวิจัยของเรามีประสิทธิภาพสูงสุด รัฐตองเปนแหลงทุนหลัก ชี้นําความพยายามไปยังจุดที่ตองการมากที่สุด และทําใหขอมูลอยูภายใตการควบคุมอยางเขมงวด อยางไรเสีย เราไมอาจเสี่ยงใหพลเมืองของเราตองหนักใจกับความคิดที่ผิด ๆ"
  AST_graziers_to_industry: "จากคอกปศุสัตวสูอุตสาหกรรม"
  AST_graziers_to_industry_desc: "ในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ เมืองของเราวางเปลาเมื่อกรรมกรไปแสวงหาความมั่นคงในชนบท บัดนี้เมื่อเราควบคุมปจจัยการผลิต เราจะดึงพวกเขากลับสูภาคอุตสาหกรรมได เราตองปลูกฝงใหพวกเขาเขาใจความตองการของชาติ: เตาหลอมแหงอุตสาหกรรมตองไดรับการปอนดวยหยาดเหงื่อของมนุษย"
  AST_free_school_policy: "นโยบายเรียนฟรี"
  AST_free_school_policy_desc: "เพื่อหลอหลอมพลเมืองตนแบบ เราตองหลอหลอมความคิดของพวกเขา ตั้งแตเปลจนถึงมหาวิทยาลัย รัฐจะชี้นําสิ่งที่ลูกหลานของเราไดเรียนรู ดวยวิธีนี้ คนรุนตอไปจะเขาใจความสําคัญของอุดมคติสังคมนิยม และอันตรายของตลาดเสรี... และความคิดเสรี"
  AST_free_healthcare_policy: "นโยบายรักษาพยาบาลฟรี"
  AST_free_healthcare_policy_desc: "ประชาชนของเราสมควรปลอดจากโรคภัยและการบาดเจ็บ และหากเกิดเรื่องรายที่สุดขึ้น พวกเขาตองไมตกยากเพราะเคราะหรายเหมือนที่เกิดในสังคมอื่น เราจะใหทุกคนเขาถึงการรักษาพยาบาล โรงพยาบาล และแพทยไดอยางทั่วถึง- เพราะประชาชนที่แข็งแรงคือประชาชนที่สรางผลผลิต"
  AST_the_publics_australia: "ออสเตรเลียของมหาชน"
  AST_the_publics_australia_desc: "เราไดละทิ้งระเบียบเกาและสรางชาติที่ดํารงอยูเพื่อคนสวนมาก ไมใชคนสวนนอย อุตสาหกรรม แรงงาน และทรัพยากรบัดนี้รับใชประชาชนทั้งมวล นี่คือออสเตรเลียของมหาชน เทาเทียม เปนหนึ่งเดียว และไมอาจแตกหัก"
  # 'Cominwealth' over 'Commonwealth' is intentional
  AST_the_australian_commonwealth: "เครือมิตรภาพออสเตรเลีย"
  AST_the_australian_commonwealth_desc: "ครั้งหนึ่งอังกฤษเคยอางตนเปนผูนําเครือจักรภพ แตวิสัยทัศนของมันถูกผลประโยชนทุนนิยมกัดกรอน เราจะยึดบทบาทนั้นและนําชาติตาง ๆ สูยูโทเปยสังคมนิยมรวมกัน"
  AST_union_control_commonwealth: "ปลดล็อกการตัดสินใจ §Yการควบคุมสหภาพ§! \nเปดใหคอมมิวนิสตแทรกซึมนิวซีแลนด มาเลเซีย พมา และทายที่สุดคืออินเดีย"
  AST_a_comrade_emancipated: "ปลดปลอยสหาย"
  AST_a_comrade_emancipated_desc: "ทั่วโลก หลายชาติยังคงถูกพันธนาการดวยโซตรวนของทุนนิยม ประชาชนถูกปฏิเสธเสรีภาพที่แทจริง ในฐานะรัฐสังคมนิยมเสรี เปนหนาที่ของเราที่จะชวยปลดปลอยพวกเขา กรรมกรทั่วโลก จงสามัคคีกัน แลวเราจะสลัดโซตรวนเหลานี้ทิ้งไปดวยกัน"
  AST_union_control_local: "ปลดล็อกการตัดสินใจ §Yการควบคุมสหภาพ§! \nเปดใหคอมมิวนิสตแทรกซึมอินโดนีเซียและฟลิปปนส"
  AST_comintern: "ความตกลงเครือมิตรภาพ-คอมินเทิรน"
  AST_comintern_desc: "แมบางครั้งจะคลาดเคลื่อนจากหลักการมารกซิสตที่แทจริง แตสหภาพโซเวียตยังคงเปนผูถือธงนําของสากลกรรมกร ดวยการเขารวมคอมินเทิรน เราจะผนึกกําลังกันชูคบเพลิงแหงสังคมนิยมไปทั่วโลก"
  AST_comintern_tt: "หาก §Y[AST.GetName]§! เปนผูนําฝาย ฝายนั้นจะรวมเขากับคอมินเทิรน มิฉะนั้น §Y[AST.GetName]§! จะเขารวมคอมินเทิรนเพียงลําพัง"
  AST_southern_academy_of_sciences: "สถาบันวิทยาศาสตรแหงซีกใต"
  AST_southern_academy_of_sciences_desc: "คบเพลิงแหงความกาวหนากําลังริบหรี่ในสายลม ถูกกลบดวยความหวาดระแวงของคนใจแคบ เราควรกอตั้งสถาบันวิทยาศาสตรแหงซีกใตและจุดประภาคารแหงความรูแจง เพื่อนําทางโลกสูยูโทเปยสังคมนิยมของเรา"
  AST_for_greater_good: "เพื่อประโยชนที่ยิ่งใหญกวา"
  AST_for_greater_good_desc: "วิสัยทัศนการปฏิวัติโลกของเราตองการเลือดเนื้อและการเสียสละ ในหลายแหงเหลือเกิน คบเพลิงแหงสังคมนิยมกําลังริบหรี่ เราตองตอบรับเสียงเรียกและสงการสนับสนุนไปเพื่อไมใหมันดับลง อยางไรเสีย นี่ก็เพื่อประโยชนที่ยิ่งใหญกวา (ประโยชนที่ยิ่งใหญกวา)"
  AST_make_common_cause: "รวมอุดมการณเดียวกัน"
  AST_make_common_cause_desc: "ภายใตการนําของเรา เครือจักรภพเริ่มรุงเรือง ไดรับการนําทางดวยแสงแหงสังคมนิยมออกจากความมืดมิดของการกดขี่แบบทุนนิยม ในหวงเวลาวิกฤตนี้ เราตองทําใหแนใจวาเจตจํานงของเราจะไมแตกสลาย และเราจะเดินหนาไปดวยกันสูวันพรุงนี้ที่ดีกวา"
  AST_the_red_pacific: "แปซิฟกสีแดง"
  AST_the_red_pacific_desc: "แปซิฟกตองไดรับการสรางขึ้นใหมตามแบบของการปฏิวัติ ทั่วหมูเกาะและชายฝงในภูมิภาคของเรา เราจะสนับสนุนการผงาดของรัฐบาลสังคมนิยม และทําใหธงแดงโบกสะบัดจากฝงสูฝง"
  AST_the_irish_anti-britain_pact: "กติกาตอตานอังกฤษของไอรแลนด"
  AST_the_irish_anti-britain_pact_desc: "อังกฤษยืนหยัดเปนปอมปราการของทุนนิยมมานานเกินไป ไดรับการปกปองดวยที่ตั้งบนเกาะและแสนยานุภาพทางทะเล ดวยการปลุกปนความไมสงบในหมูคนงานทาเรือในไอรแลนดและไอรแลนดเหนือ เราจะเจาะแนวปองกันของมันและเปดทางขามทะเลไอริชใหกองกําลังของเรา"
  AST_stretch_the_fleet: "ขยายกองเรือ"
  AST_stretch_the_fleet_desc: "อังกฤษยังคงยืนหยัดเปนปอมปราการของทุนนิยม ไดรับการปกปองดวยกองเรืออันเกรียงไกร ถึงเวลาขยายขีดความสามารถทางทะเลของเราเอง บุกไปสูถึงถิ่น และแสดงใหโลกเห็นวาเกาะไหนใหญกวากัน"
  AST_chinese_relations: "ความสัมพันธกับจีน"
  AST_chinese_relations_desc: "สหายของเราในจีนกําลังดิ้นรนเพื่อความอยูรอด เรามีกําลังจะชวยเหลือพวกเขา แตตองลงมืออยางรวดเร็วกอนที่พวกเขาจะถูกกองกําลังจักรวรรดินิยมที่ประจันหนาอยูบดขยี้"
  AST_westward_battles: "ศึกทางตะวันตก"
  AST_westward_battles_desc: "กองกําลังฟาสซิสตครอบงําทางตะวันตก คุกคามรากฐานแหงความอยูรอดของเรา บัดนี้เมื่ออยูฝายเดียวกับคอมินเทิรน เราตองบุกไปสูกับพวกมัน และยืนหยัดตอตานผูที่จะทําลายยูโทเปยของกรรมกรที่เรากําลังสราง"
  AST_strongholds: "ฐานที่มั่น"
  AST_strongholds_desc: "เพื่อรักษาตําแหนงของเราในสมรภูมิใหมนี้ เราตองสนับสนุนสหายชาวไอริชตอสูกับหัวใจจักรวรรดินิยมของทุนนิยม การตอสูเพื่อเอกราชกอนหนานี้ของพวกเขาใหบทเรียนอันมีคา ขณะที่เราเตรียมพรอมรวมกันสําหรับขั้นตอไปของความขัดแยงระดับโลก"
  AST_out_of_the_den: "ออกจากถํ้า"
  AST_out_of_the_den_desc: "ชาวไอรแลนดจํานวนมากยังคงเคียดแคนการปกครองของอังกฤษอยางลึกซึ้ง ถึงเวลาแสดงพลังของเราและดึงพวกเขาออกจากเงามืด รวบรวมพวกเขาเขารวมอุดมการณของเราเพื่อตอสูกับศัตรูรวม"
  AST_end_the_kingdom: "ยุติราชอาณาจักร"
  AST_end_the_kingdom_desc: "ถึงเวลาแลว รากเหงาของทุนนิยมจักรวรรดินิยมจะถูกแทงเขาที่หัวใจอันเนาเฟะ การปลดปลอยกรรมกรทั่วจักรวรรดิบริติชใกลเขามาแลว ยุติระบอบกษัตริย ยุติราชอาณาจักร ยุติการกดขี่ กรรมกรแหงเครือจักรภพ จงสามัคคีกัน!"
  AST_red_solidarity: "ภราดรภาพแดง"
  AST_red_solidarity_desc: "การตอสูในจีนยังคงดุเดือด ผูคนนับลานทุกขทรมานและลมตาย การตอสูของพวกเขาคือการตอสูของเรา และเราไมอาจนิ่งเฉย เราสามารถเขาแทรกแซง แบงเบาภาระของพวกเขา และทําใหเปลวไฟแหงการปฏิวัติไมมอดดับ"
  AST_red_solidarity_tt: "§Y[AST.GetName]§! เขารวมสงครามของ §Y[PRC.GetNameDef]§! ตอ §Y[CHI.GetNameDef]§! ฝายที่เล็กกวาจะถูกรวมเขากับอีกฝาย หรือ §Y[AST.GetName]§! จะเขารวมสงครามโดยตรงหากทั้งสองเปนพันธมิตรกันอยูแลว"
  AST_free_the_colonies: "ปลดปลอยอาณานิคม"
  AST_free_the_colonies_desc: "ไฟแหงการปฏิวัติกําลังลุกไหมไปทั่วจักรวรรดิบริติชที่กําลังพังทลาย อาณานิคมจะไมเปนอาณานิคมอีกตอไป แตจะเปนชาติเสรี ลุกขึ้นเถิดสหาย! สลัดโซตรวนทิ้งและเขารวมการปฏิวัติ!"
  AST_free_the_colonies_tt: "§Y[AST.GetName]§! ลดสถานะอดีตอาณานิคมอังกฤษทั้งหมดที่อยูในความควบคุมลงเปนรัฐหุนเชิดที่ถูกผนวกรวม"
  AST_battle_of_the_ocean: "ศึกแหงมหาสมุทร"
  AST_battle_of_the_ocean_desc: "มหาสมุทรเปนเสนเลือดใหญของการคาโลกมาชานาน บัดนี้ถึงเวลานําการตอสูสูแปซิฟก และตัดขาดระบบที่มันคํ้าจุนอยู ทองนํ้าจะแดงฉานดวยเลือดของทั้งนายทุนฉอฉลและวีรชนแหงการปฏิวัติ"
  AST_borderless_solidarity: "ภราดรภาพไรพรมแดน"
  AST_borderless_solidarity_desc: "ภราดรภาพ คําที่หลอมรวมกรรมกรทั่วโลก ไมมีพรมแดนใดแบงแยกเราได ไมมีชาติใดยืนหยัดไดเพียงลําพัง ไมวาการตอสูจะลุกโชนที่ใด เราจะตอบรับเสียงเรียก และยืนหยัดรวมกันในการตอสูระดับโลกเพื่อการปลดปลอย"
  AST_an_equal_union: "สหภาพแหงความเทาเทียม"
  AST_an_equal_union_desc: "แมเราจะถือธงนําการปฏิวัติ แตทุกผูที่เขารวมกับเราลวนเทาเทียมกัน ในสหภาพนี้ ทรัพยากร แรงงาน และความคิดถูกแบงปนอยางเสรี หลอมสรางอนาคตที่ความรุงเรืองเปนของสวนรวม และไมมีชาติใดอยูเหนือชาติอื่น"
  AST_expanding_influence: "ขยายอิทธิพล"
  AST_expanding_influence_desc: "เมื่อยืนอยูบนฝงที่ถูกตองของประวัติศาสตร ความคิดของเรายอมพูดแทนตัวเอง คําสัญญาถึงสวรรคของกรรมกรไมใชความฝน แตเปนความจริงที่กําลังกอราง เราสามารถแผวิสัยทัศนนี้ออกไป เชิญชวนผูอื่นใหมารวมสรางอนาคตรวมกัน"

  AST_public_works: "งานโยธาสาธารณะ"
  AST_public_works_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญทิ้งใหเศรษฐกิจออสเตรเลียอยูในสภาพยํ่าแย เราจะริเริ่มโครงการงานโยธาสาธารณะหลากหลายเพื่อใหผูคนกลับมามีงานทําและฟนฟูการใชจายของผูบริโภค"
  AST_lang_plan: "แผนแลง"
  AST_lang_plan_desc: "แมจะมีขอถกเถียงและฝายคานทางการเมืองที่สงเสียงดัง แจ็ก แลง ไดกาวขึ้นมาเปนแถวหนาของนโยบายเศรษฐกิจ เขาปฏิเสธที่จะชําระหนี้ตางประเทศ โดยอางวาการนําเงินเหลานั้นไปใชกับโครงการสาธารณะจะกระตุนการเติบโตภายในประเทศ อยางไรเสีย จะรีดเลือดจากปูก็ไมได"
  AST_exports_for_economic_recovery: "สงออกเพื่อฟนฟูเศรษฐกิจ"
  AST_exports_for_economic_recovery_desc: "ฝายที่คัดคานแนวคิดของแลงเสนอใหใชตลาดและหนี้ตางประเทศเปนคานงัดเพื่อกระตุนการลงทุนและยอดขายในตางประเทศแทน โดยมุงสูเศรษฐกิจที่เนนการสงออก เพื่อเพิ่มการผลิตภายในประเทศ การจางงาน และทายที่สุดคือการใชจายของผูบริโภค"
  AST_the_phosphate_commision: "คณะกรรมาธิการฟอสเฟต"
  AST_the_phosphate_commision_desc: "หลังมหาสงคราม นาอูรูถูกวางไวภายใตภาวะทรัสตีรวมของออสเตรเลีย นิวซีแลนด และสหราชอาณาจักร ในป 1919 สิทธิ์ในการขายฟอสเฟตทั้งหมดบนเกาะถูกโอนใหแกผูดูแลเหลานี้ โดยมีออสเตรเลียเปนผูนํา ดวยตําแหนงผูนํา เราจะสามารถมีอิทธิพลตอการกําหนดราคา และไดอัตราที่แขงขันไดสูงสําหรับตลาดภายในประเทศ"
  AST_goods_standard: "มาตรฐานสินคา"
  AST_goods_standard_desc: "หลักการสําคัญของทฤษฎีเศรษฐกิจของแจ็ก แลง คือการยกเลิกมาตรฐานทองคําในออสเตรเลีย และแทนที่ดวยมาตรฐานสินคา ซึ่งผูกปริมาณเงินกับปริมาณสินคาที่ผลิตไดจริง ทําใหการไหลเวียนของทุนผูกโดยตรงกับผลิตภาพภายในประเทศแทนปจจัยภายนอก"
  AST_standard_gauge_line_to_darwin: "ทางรถไฟรางมาตรฐานสูดารวิน"
  AST_standard_gauge_line_to_darwin_desc: "เราขาดเสนทางเชื่อมตอที่เหมาะสมไปยังดินแดนทางเหนือมานานเกินไป ในฐานะสวนหนึ่งของโครงการงานโยธาสาธารณะที่กวางขึ้นเพื่อนําเงินกลับเขาสูระบบเศรษฐกิจ เราสามารถสรางทางรถไฟเชื่อมเมืองทางใตกับทางเหนือได"
  AST_lang_is_right: "แลงพูดถูก"
  AST_lang_is_right_desc: "เอาละ ปรากฏวาแลงพูดถูก! ดวยการปฏิเสธที่จะใหเจาหนี้ตางชาติมากอน และใชระบบธนาคารของเราเองอยางจริงจังยิ่งขึ้น เราจะปลดล็อกเงินทุนไดมหาศาล ซึ่งสามารถนําไปใชกับเศรษฐกิจภายในประเทศ เปนการลงทุนที่จําเปนอยางยิ่งและกระตุนการเติบโต"
  AST_within_reach: "อยูแคเอื้อม"
  AST_within_reach_desc: "ใกลแคนี้แตก็ไกลเหลือเกิน ออสเตรเลียเปนชาติที่อุดมดวยทรัพยากร และหากเราขุดลึกลงไปอีกนิด ความมั่งคั่งมหาศาลก็รออยูใตฝาเทา ดวยการขยายโครงสรางพื้นฐาน แมแตเหมืองหางไกลก็เขาถึงได และเรากําลังยืนอยูบนธรณีประตูของยุคแหงความรุงเรืองของออสเตรเลียที่ขับเคลื่อนดวยความมั่งคั่งจากแร"
  AST_a_domestic_supply_chain: "หวงโซอุปทานภายในประเทศ"
  AST_a_domestic_supply_chain_desc: "ผลพลอยไดอยางหนึ่งจากการมุงเนนเศรษฐกิจภายในประเทศคือการพัฒนาระบบการผลิตที่ยืดหยุนทนทานเปนพิเศษ เมื่อการผลิตทุกระดับตั้งอยูในประเทศ เราจึงแทบไมไดรับผลกระทบจากแรงกระแทกภายนอก"
  AST_broken_hill_propietary_company: "บริษัทโบรกเคนฮิลลโพรพรายเอทารี"
  AST_broken_hill_propietary_company_desc: "บริษัทโบรกเคนฮิลลโพรพรายเอทารีเปนหนึ่งในผูผลิตแรและเหล็กกลาชั้นนําของออสเตรเลีย ชาวบานขนานนามวา 'ยักษใหญแหงออสเตรเลีย' และครองอุตสาหกรรมนี้ ดวยความตองการวัตถุดิบที่เพิ่มขึ้นอยางมาก บริษัทจึงอยูในตําแหนงที่พรอมเติบโตไดรวดเร็วยิ่งขึ้นไปอีก"
  AST_radium_hill: "เรเดียมฮิลล"
  AST_radium_hill_desc: "มีการคนพบยูเรเนียมในเซาทออสเตรเลีย และเหมืองเรเดียมฮิลลมีศักยภาพในการขยายอยางมาก แมเรายังคนหาความเปนไปไดทั้งหมดของเทคโนโลยีเกิดใหมเหลานี้อยู แตชัดเจนวาเรากําลังยืนอยูบนธรณีประตูของยุคปรมาณู และนี่อาจเปนประตูสูยุคนั้นของเรา"
  AST_industrial_expansion: "ขยายอุตสาหกรรม"
  AST_industrial_expansion_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญไดบั่นทอนผลผลิตทางเศรษฐกิจของชาติเรามาเกือบตลอดทศวรรษที่ผานมา บัดนี้เมื่อเรามีเจตจํานงทางการเมืองที่จะลงมืออยางตรงไปตรงมามากขึ้น เราควรทุมมันไปที่การขยายฐานอุตสาหกรรมอยางกลาหาญ สรางงาน เพิ่มความตองการทรัพยากร และผลิตสินคาออกสูตลาดมากขึ้น"
  AST_income_tax_assessment_act: "พระราชบัญญัติการประเมินภาษีเงินได"
  AST_income_tax_assessment_act_desc: "ระบบภาษีของเราอยูในสภาพยํ่าแยและยากที่ประชาชนจะเขาใจ ตองอาศัยการกํากับดูแลจากรัฐบาลอยางหนักหนวงซึ่งเราแทบแบกรับไมไหว ดวยการปฏิรูปและปรับบทบัญญัติที่เกี่ยวของใหกระชับ เราจะทําใหการจัดเก็บภาษีมีประสิทธิภาพขึ้นอยางมาก"
  AST_council_for_scientific_and_industrial_research: "สภาวิจัยวิทยาศาสตรและอุตสาหกรรม"
  AST_council_for_scientific_and_industrial_research_desc: "สภาวิจัยวิทยาศาสตรและอุตสาหกรรมไดรับการเสริมความแข็งแกรงหลังการประชุมจักรวรรดิป 1923 เพื่อชวยขยายฐานเศรษฐกิจของอาณานิคมและประเทศในเครือจักรภพตาง ๆ แมคุณูปการของสภาจะมีความสําคัญ แตถึงเวลาใหองคกรนี้มีจุดมุงเนนใหม: การพัฒนาภาคการผลิตและอุตสาหกรรมทุติยภูมิ"
  AST_bring_home_the_farmers: "พาชาวนากลับบาน"
  AST_bring_home_the_farmers_desc: "ในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ ประชากรในเมืองใหญของเราลดลงอยางหนักเมื่อกรรมกรยายไปชนบทเพื่อหางานเกษตร บัดนี้เมื่อสถานการณเริ่มดีขึ้น เราควรจูงใจใหแรงงานกลับมา เพื่อใหโรงงานกลับมาเดินเครื่องและเริ่มการผลิตอีกครั้ง"
  AST_reverse_wage_cuts: "ยกเลิกการลดคาจาง"
  AST_reverse_wage_cuts_desc: "เพื่อใหธุรกิจมีโอกาสอยูรอด เราไดลดคาจางหลายครั้งทั่วทั้งระบบเศรษฐกิจ บัดนี้เมื่อเห็นสัญญาณการฟนตัว เราควรกลับลํา คาจางที่สูงขึ้นนําไปสูกําลังซื้อที่มากขึ้น ชวยขับเคลื่อนการบริโภคและการเติบโตทางเศรษฐกิจ"
  AST_the_manpower_directorate: "กรมกําลังพล"
  AST_the_manpower_directorate_desc: "เมื่อเศรษฐกิจของเราซับซอนขึ้นเรื่อย ๆ เราเผชิญความทาทายดานกําลังพลที่ทวีขึ้น กรมนี้จะทําใหแนใจวาคนที่ใชไดอยูในบทบาทที่ใช ดวยทักษะที่ใช ในเวลาที่ใช"
  AST_recovery: "การฟนตัว"
  AST_recovery_desc: "เปนครั้งแรกที่ผลิตภัณฑมวลรวมในประเทศของเราแซงหนาระดับกอนภาวะเศรษฐกิจตกตํ่า นี่คือชวงเวลาแหงการเฉลิมฉลอง เพราะเสนทางเดียวของเศรษฐกิจเราตอนนี้คือขาขึ้น เรากําลังเขาสูชวงเติบโตอยางแข็งแกรง และถึงเวลาเก็บเกี่ยวผลแหงความรุงเรืองที่กลับคืนมา"
  AST_devalued_currency: "ลดคาเงิน"
  AST_devalued_currency_desc: "วิธีที่ไดผลที่สุดวิธีหนึ่งในการเพิ่มการสงออกคือคาเงินที่ออนลง หากผูซื้อตางชาติซื้อสินคาของเราไดมากขึ้นเพราะเงินของพวกเขามีคามากกวา เราก็จะแขงขันในระดับสากลไดดีขึ้น อยางไรก็ตาม นี่เปนดาบสองคม เพราะสินคานําเขาจากชาติอื่นก็จะแพงขึ้นดวย"
  AST_reverse_industry_tariffs: "ยกเลิกภาษีศุลกากรอุตสาหกรรม"
  AST_reverse_industry_tariffs_desc: "ในอดีต เราใชภาษีศุลกากรเปนเกราะปองกันอุตสาหกรรมภายในประเทศจากการแขงขันของตางชาติ แตสิ่งนี้นําไปสูสงครามการคาและภาษีตอบโตสินคาสงออกของเรา ทําใหราคาสูงขึ้น เราควรลดกําแพงเหลานี้และสงเสริมใหอีกฝายลดตามเพื่อชวยขยายการคา"
  AST_foreign_competition: "การแขงขันจากตางชาติ"
  AST_foreign_competition_desc: "การแขงขันเปนผลดีตอธุรกิจ มันกระตุนนวัตกรรมและประสิทธิภาพ พรอมขจัดความนิ่งนอนใจ โลกภายนอกคือสนามที่หมากัดหมา และเราตองทําใหแนใจวาหมาของเราตัวใหญที่สุด และไดถอดปลอกคอออกแลวเพื่อใหมันแขงขันไดอยางเสรีเต็มที่"
  AST_expanding_into_new_markets: "ขยายสูตลาดใหม"
  AST_expanding_into_new_markets_desc: "ขอไดเปรียบของการพึ่งพาตลาดตางประเทศมากกวาตลาดภายในประเทศนั้นเรียบงาย ตลาดโลกกวางใหญไพศาล จะมีตลาดใหมใหเจาะอยูเสมอ เราเพียงตองหาจุดแข็งของเราและแสดงใหเห็นถึงความเหนือกวาของสินคาและแนวปฏิบัติทางธุรกิจของออสเตรเลีย"

  AST_populate_or_perish: "เพิ่มประชากรหรือดับสูญ"
  AST_populate_or_perish_desc: "เมื่อภาวะเศรษฐกิจตกตํ่าครั้งใหญมาเยือน อัตราการเกิดลดลงอยางรวดเร็วและดิ้นรนจะฟนตัวมาตลอดนับแตนั้น เพื่อการพัฒนาภายในประเทศอยางตอเนื่อง เราจะจัดตั้งกระทรวงตรวจคนเขาเมืองระดับสหพันธ เพื่อดําเนินการและกํากับดูแลโครงการรับผูอพยพใหม"
  AST_recruitment_drive: "รณรงครับสมัครทหาร"
  AST_recruitment_drive_desc: "เจตจํานงที่ออนแอของรัฐบาลชุดกอน ๆ รวมถึงการพึ่งพาอังกฤษมากเกินไป สงผลใหกองทัพออสเตรเลียถูกละเลยมาเปนเวลานาน สิ่งนี้จะไมเปนเชนนั้นอีกตอไป เมื่อเราเปดตัวแคมเปญรณรงครับสมัครเขากองกําลังปองกันออสเตรเลีย"
  AST_new_deal: "ขอตกลงใหม"
  AST_new_deal_desc: "การประทวงที่เกิดขึ้นในวาระครบรอบ 150 ปของ [AST.GetName] ทําใหเห็นชัดวากฎหมายของเราเกี่ยวกับพลเมืองชนพื้นเมืองตองไดรับการทบทวน ตามคําขอของนักเคลื่อนไหวดานสิทธิชาวอะบอริจิน เราจะพบปะกับพวกเขาเพื่อรวมกันกําหนดเสนทางสูการเปนพลเมืองโดยสมบูรณของชนพื้นเมือง"
  AST_the_1938_sesquicentenary_flag: "เหตุการณ §Yวาระครบรอบ 150 ป ค.ศ. 1938§! ไดเกิดขึ้นแลว"
  AST_the_1938_sesquicentenary_tt: "แผนยุทธศาสตร '§Yขอตกลงใหม§!' ใน §Yสายเพิ่มประชากรหรือดับสูญ§! พรอมใชงาน"
  AST_repeal_immigration_restrictions: "ยกเลิกขอจํากัดการเขาเมือง"
  AST_repeal_immigration_restrictions_desc: "กระทรวงตรวจคนเขาเมืองถูกจํากัดดวยกฎหมายลาสมัยที่กําหนดวาใครไดรับอนุญาตใหอพยพเขา [AST.GetName] แมจะเสี่ยงกอใหเกิดขอถกเถียง เราจะยกเลิกกฎหมายเหลานี้และสรางระบบโควตาเพื่อควบคุมการไหลเขาของผูอพยพแทน"
  AST_womens_armed_services: "หนวยทหารหญิง"
  AST_womens_armed_services_desc: "แมจะมีการคัดคานอยางรุนแรง การจัดตั้งหนวยทหารหญิงจะดําเนินตอไป ทุกมือที่ยื่นมาชวยจะไดรับการตอนรับเพื่อปกปอง [AST.GetName] จากผูรุกราน โดยไมคํานึงถึงเพศ เพื่อกระตุนการรับสมัครและการฝก การเลือกผูอํานวยการของหนวยเหลานี้จึงสําคัญยิ่ง"
  AST_northern_territory_reconnaissance_unit: "หนวยลาดตระเวนนอรเทิรนเทรริทอรี"
  AST_northern_territory_reconnaissance_unit_desc: "เรืออากาศโทและนักมานุษยวิทยา โดนัลด ทอมสัน ไดเรียกรองใหรับชาวอะบอริจินเขาสูกองทัพของ [AST.GetName] และในที่สุดเสียงของเขาจะไดรับการรับฟง เราจะมอบหมายใหทอมสันจัดตั้งหนวยลาดตระเวนดวยตนเอง ประกอบดวยผูชายที่มีความรูทองถิ่นและทักษะการเอาตัวรอดในปา เพื่อสอดแนมแมแตดินแดนที่หางไกลและทุรกันดารที่สุดของเรา"
  AST_northern_territory_reconnaissance_unit_tt: "ปลดล็อกกองรอยสนับสนุน §Yหนวยลาดตระเวนนอรเทิรนเทรริทอรี§!"
  AST_torres_strait_battalion: "กองพันชองแคบทอรเรส"
  AST_torres_strait_battalion_desc: "กองรอยชองแคบทอรเรสทําหนาที่กองรักษาการณไดดี แตทหารของกองรอยมีศักยภาพที่จะสรางผลงานดานอื่น เนื่องจากสมาชิกมาจากหมูเกาะนอกชายฝงทางเหนือของ [AST.GetName] หนวยนี้จึงมีความรูกวางขวางเกี่ยวกับชองแคบทอรเรส เราจะฝกทหารเหลานี้เปนนาวิกโยธินและเรียกรองอาสาสมัครเพิ่มเติมเพื่อจัดตั้งเปนกองพัน"
  AST_department_of_aboriginal_affairs: "กระทรวงกิจการชาวอะบอริจิน"
  AST_department_of_aboriginal_affairs_desc: "เราจะทําตามขอเสนอของกลุมนักเคลื่อนไหวดานสิทธิชาวอะบอริจินในการจัดตั้งกระทรวงกิจการชาวอะบอริจินขึ้นใหม กระทรวงจะไดรับคําแนะนําจากคณะกรรมการที่มีเชื้อสายอะบอริจิน และมีเปาหมายเพื่อใหชนพื้นเมืองเขาถึงอาหารและการรักษาพยาบาลที่เหมาะสม"
  AST_immediate_rights: "สิทธิทันที"
  AST_immediate_rights_desc: "จะไมมีกลุมประชากรใดใน [AST.GetName] ถูกควบคุมโดยสหพันธ และไมมีเชื้อสายใดจํากัดการไดรับสิทธิพลเมือง ดวยการตรากฎหมายสัญชาติของเราเองและละทิ้งความคิดที่วาประชากรของเราเปนเพียงคนในบังคับอังกฤษ สิทธิของชาวออสเตรเลียจะไมมีเงื่อนไขอีกตอไป"
  AST_diverse_army: "กองทัพที่หลากหลาย"
  AST_diverse_army_desc: "การปกปองประเทศของตนไมไดเปนเพียงเอกสิทธิ์ แตเปนสิทธิ ชาวออสเตรเลียทุกคนที่เต็มใจจะสามารถสมัครเปนทหารได และทหารผูมีความทะเยอทะยานทุกคนควรเลื่อนยศได"

