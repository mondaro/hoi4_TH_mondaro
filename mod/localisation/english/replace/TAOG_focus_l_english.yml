  AST_alp_discount: "\n\nเพิ่มคะแนนเสียงใหเกิน §Y50%§! เพื่อลดเวลาดําเนินการของกลุมแผนยุทธศาสตร §YA.L.P§! ลง §Y5§! วัน"
  AST_uap_50_discount: "\n\n§Yผลของการมีคะแนนเสียงประชาธิปไตย >50%§!:\n(กลุมแผนยุทธศาสตร §YU.A.P§!):\nลดเวลาดําเนินการ §Y5§! วัน\n\nเพิ่มคะแนนเสียงใหเกิน §Y70%§! เพื่อลดเวลาดําเนินการของกลุมแผนยุทธศาสตร §YU.A.P§! ลง §Y10§! วัน"
  AST_alp_50_discount: "\n\n§Yผลของการมีคะแนนเสียงประชาธิปไตย >50%§!:\n(กลุมแผนยุทธศาสตร §YA.L.P§!):\nลดเวลาดําเนินการ §Y5§! วัน\n\nเพิ่มคะแนนเสียงใหเกิน §Y70%§! เพื่อลดเวลาดําเนินการของกลุมแผนยุทธศาสตร §YA.L.P§! ลง §Y10§! วัน"
