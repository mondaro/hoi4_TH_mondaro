l_english:
  INS_nationalize_companies_tt: "องคกรอุตสาหกรรมทางทหารและกิจการอุตสาหกรรมทั้งหมดจะถูกโอนเปนของรัฐและไดรับชื่อใหม"
  available_focus_tt: "แผนยุทธศาสตรที่§Gพรอมใชงาน§!:\n"

  INS_is_union_tt: "ไดกอตั้งสหภาพเนเธอรแลนด-อินโดนีเซียแลว"
  INS_is_union_tt_NOT: "ยังไมไดกอตั้งสหภาพเนเธอรแลนด-อินโดนีเซีย"

  INS_denounce_soetardjo: "ประณามซูตารจโจ"
  INS_denounce_soetardjo_tt: "เราจะเริ่มวางแผนการปฏิวัติใตดิน แทรกซึมเขาสูรัฐบาล และจัดตั้งหนวยกองโจรทั่วหมูเกาะ เมื่อเราเตรียมพรอมเพียงพอแลว เราจะเริ่มสงครามกองโจรเพื่อเอกราชตอตานดัตช"
  INS_soetardjo_petition_debate_done_tt: "การอภิปรายในโฟลกสราดวาดวยคํารองขออํานาจปกครองตนเองของซูตารจโจไดสิ้นสุดลงแลว"
  INS_tkr_tt: "ปรับ §Yกองทัพความมั่นคงประชาชน§! ดังนี้:"
  INS_commander_sudirman_tt: "§Yซูดีรมัน§!([INS.GetFlag]) ไดรับการเลื่อนยศเปน§Yจอมพล§!"
  INS_the_declaration_of_independence: "การประกาศเอกราช"
  INS_the_declaration_of_independence_desc: "เราไมอาจเสี่ยงรอตอไปไดอีกแลว ตองตีเหล็กเมื่อยังรอน! เราควรสงกองกําลังอาสาเขายึดทาเรือ เมือง และศูนยอุตสาหกรรมอยางรวดเร็วจนทางการดัตชไมมีเวลาตอบโต จากนั้นเราจะประกาศเอกราช สถาปนาสาธารณรัฐอินโดนีเซีย"
  INS_the_declaration_of_independence_tt: "เราจะประกาศ§Yเอกราช§! ทุกรัฐที่เราไดตั้ง§Yฐานกองกําลังอาสา§!หรือ§Yกองบัญชาการ§!ไวจะอยูภายใตการควบคุมของเรา สวนที่เหลือจะยังคงอยูกับ [HOL.GetNameDef]\n\n[HOL.GetNameDefCap] จะไมรับรองอธิปไตยของเรา และความขัดแยงระดับตํ่าจะเริ่มขึ้น ซึ่งอาจบานปลายเปน§Rสงคราม§!ได\n\nปลดล็อกการจูโจมภาคพื้นดินเพื่อยึดครองรัฐ"
  INSHOL_the_declaration_of_independence: "การปฏิวัติแหงชาติ"
  INS_laskar_rakjat: "ลัสการ รักยัต"
  INS_laskar_rakjat_desc: "การปฏิวัติประกอบดวยกองกําลังอาสามากมายหลายกลุมทั่วอินโดนีเซีย ทั้งใหญและเล็ก การจัดระเบียบกองกําลังอาสาเปนขั้นตอนจําเปนสูชัยชนะ อยางไรก็ตาม เราตองไมใจรอนเกินไป เพราะการเพิ่มอํานาจใหกองกําลังอาสาที่มีความเชื่อมโยงกับคูแขงทางการเมืองของเราอาจนํามาซึ่งหายนะ"
  INS_militia_tt: "สรางแมแบบกองพลกองกําลังอาสา§Yนักสูเพื่ออิสรภาพ§!ใหม และปลดล็อกการตัดสินใจเพื่อบริหารจัดการพวกเขา"
  INS_militia_warning_tt: "กองกําลังอาสาคือกลุมนักสูเพื่ออิสรภาพที่§Yกึ่งอิสระ§! พวกเขาจะสูเพื่อเรา แตความชวยเหลือของพวกเขาไมไดมาฟรี พวกเขาจะคาดหวังคาตอบแทนสําหรับความพยายามของตน §Rเสถียรภาพจะไดรับผลกระทบอยางรุนแรงหากไมตอบสนองขอเรียกรอง!§!"
  INS_usa_tanks_opinion_mod: "ซื้อรถถังของเราแลว"
  INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) ไดเปนนายพล"
  INS_big_militia_presence_tt: "จะถูกควบคุมโดยกองกําลังอาสาของเราเมื่อประกาศเอกราช"

  INS_prepare_raiding_bases: "เตรียมฐานจูโจม"
  INS_prepare_raiding_bases_desc: "เราจะใชเครือขายสายลับของเราสรางบังเกอรทั่วทั้งหมูเกาะอยางลับ ๆ เพื่อใหมั่นใจวาเราพรอมจะลงมือทันทีที่การปฏิวัติเริ่มขึ้น"

  # <Joint Tree - Central Milestones>
  INSHOL_dutch_east_indies: "หมูเกาะอินเดียตะวันออกของดัตช"
  INSHOL_dutch_east_indies_desc: "อาณานิคมแหงนี้กอตั้งขึ้นเมื่อเกือบ 500 ปกอน และเปลี่ยนรูปแบบไปหลายครั้งนับแตนั้น โลกกําลังเปลี่ยนแปลงอยางรวดเร็ว และการกระทําของเราในตอนนี้จะกําหนดอนาคตของความสัมพันธดัตช-อินโดนีเซียไปอีกยาวไกล"
  INSHOL_the_war_in_europe: "สงครามในยุโรป"
  INSHOL_the_war_in_europe_desc: "ความขัดแยงในยุโรปกําลังบานปลายอยางรวดเร็ว และเนเธอรแลนดก็เขาสูสงครามแลว เราไมอาจพึ่งพาใหพวกเขาปกปองเราไดอีกตอไป และตองยืนหยัดดวยตนเอง มิฉะนั้นเราเสี่ยงจะถูกมหาอํานาจตางชาติยึดครอง"

  # <Joint Tree - Military Equipment Contracts>
  INSHOL_military_equipment_contracts: "สัญญาจัดซื้อยุทโธปกรณทางทหาร"
  INSHOL_military_equipment_contracts_desc: "หมูเกาะอินเดียตะวันออกเปนหมูเกาะกวางใหญที่มีพลเมืองหลายสิบลานคน เรายังหางไกลจากการมีขีดความสามารถทางอุตสาหกรรมที่จําเปนตอการปองกันตนเอง อยางไรก็ตาม เรามีทรัพยากรมากพอจะทําการคาไดทั่วโลก ดวยการทําสัญญากับประเทศประชาธิปไตยทั่วโลก ปญหาของเราก็จะคลี่คลายได"
  INSHOL_hawk_75a7: "Hawk 75a-7"
  INSHOL_hawk_75a7_desc: "เครื่องบินขับไล Hawk 75A-7 ของอเมริกาเปนเครื่องบินที่เหมาะกับหมูเกาะอินเดียตะวันออกอยางยิ่ง ทั้งราคายอมเยาและทรงพลัง เราสามารถทําขอตกลงกับผูผลิตเพื่อยกระดับกองทัพอากาศของเราซึ่งจําเปนอยางยิ่ง"
  INSHOL_purchase_american_tanks: "ซื้อรถถังอเมริกัน"
  INSHOL_purchase_american_tanks_desc: "แมหมูเกาะอินเดียตะวันออกจะขาดอุตสาหกรรมที่จําเปนตอการผลิตรถถัง แตเราสามารถซื้อรถถังโดยตรงจากสหรัฐอเมริกา โดยใชเงินทุนจากอุตสาหกรรมยางของหมูเกาะ"
  INSHOL_purchase_british_artillery: "ซื้อปนใหญอังกฤษ"
  INSHOL_purchase_british_artillery_desc: "เราสามารถจางสหราชอาณาจักรผลิตปนใหญให ทําใหเราสามารถใหความสําคัญกับยุทโธปกรณอื่น ๆ ได"
  INSHOL_produce_own_goods: "ผลิตสินคาของเราเอง"
  INSHOL_produce_own_goods_desc: "แมเราจะมีขอตกลงการคาที่ทํากําไรไดมากมาย แตเราตองไมลืมสายการผลิตและบริษัทอุตสาหกรรมทางทหารของเราเอง เราควรอุดหนุนบริษัทเหลานี้เพื่อลดการพึ่งพาการนําเขาจากตางประเทศ"

  # <Joint Tree - East Indies Investments>
  INSHOL_east_indies_investments: "การลงทุนในหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_investments_desc: "เจาอาณานิคมที่ดียอมลงทุนในการพัฒนาอาณานิคมของตน การลงทุนในการพัฒนาเศรษฐกิจของหมูเกาะอินเดียตะวันออกเปนประโยชนสูงสุดตอเรา และเปนผลดีตอพลเมืองของอาณานิคมดวย"
  INSHOL_east_indies_student_exchange: "โครงการแลกเปลี่ยนนักศึกษาหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_student_exchange_desc: "การสรางระบบที่ชาวอินโดนีเซียสามารถยายมาศึกษาในมหาวิทยาลัยของเนเธอรแลนดได อาจเปนคุณูปการสําคัญตอเศรษฐกิจทั้งของเนเธอรแลนดและหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_fokker_division: "จัดตั้งแผนก Fokker หมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_fokker_division_desc: "กองทัพอากาศหมูเกาะอินเดียตะวันออกไดรับใบอนุญาตผลิตจาก Fokker มากพอที่ควรพิจารณากอตั้งบริษัทในเครือโดยเฉพาะ ซึ่งใหความสําคัญกับกองทัพอากาศหมูเกาะอินเดียตะวันออก"
  INSHOL_expand_shell: "ขยายโครงสรางพื้นฐานของ Shell"
  INSHOL_expand_shell_desc: "Shell กําลังกลายเปนสวนสําคัญของเศรษฐกิจเรามากขึ้นเรื่อย ๆ เห็นไดชัดวาเราตองขยายโครงสรางพื้นฐานดานนํ้ามันในหมูเกาะอินเดียตะวันออกใหทันกับขีดความสามารถในการสงออกของ Shell"
  INSHOL_increase_funding_for_tix: "เพิ่มงบประมาณโครงการเครื่องบิน T.IX"
  INSHOL_increase_funding_for_tix_desc: "วิศวกรของ Fokker กําลังพัฒนาเครื่องบินทิ้งระเบิดสองเครื่องยนตรุนใหม เพื่อแทนที่รุนลาสมัยที่กองทัพอากาศหมูเกาะอินเดียตะวันออกใชอยู โครงการนี้มีงบประมาณตํ่ามากและนาจะใชเวลาอีกนานกวาจะเสร็จ เราสามารถเพิ่มงบประมาณเพื่อเรงความคืบหนาไดอยางมาก"
  INSHOL_reduce_land_ownership_taxes: "ลดภาษีการถือครองที่ดิน"
  INSHOL_reduce_land_ownership_taxes_desc: "เราควรลดภาษีที่เก็บจากพลเมืองอินโดนีเซียผูถือครองที่ดิน เพื่อสงเสริมการพัฒนาฟารมและธุรกิจ"
  INSHOL_coffee_plantations: "ไรกาแฟ"
  INSHOL_coffee_plantations_desc: "เราควรมุงเนนการไดมาซึ่งที่ดินของรัฐในหมูเกาะทางตะวันออกใหมากขึ้น และใชที่ดินนี้สรางไรกาแฟ"
  INSHOL_overallwagen: "โอเฟอรฟาลวาเคิน"
  INSHOL_overallwagen_desc: "รถถังไมจําเปนตองเปนคําตอบสําหรับกองทัพหมูเกาะอินเดียตะวันออกเสมอไป เราขาดกําลังทางอุตสาหกรรมที่จําเปนในการผลิต และภูมิประเทศที่ทุรกันดารก็ทําใหรถถังใชไดเฉพาะบางสถานการณ เราอาจลงทุนสรางรถหุมเกราะใหอินโดนีเซียเพื่อเติมเต็มชองวางนี้"
  INSHOL_indonesian_cheap_labor: "แรงงานราคาถูกชาวอินโดนีเซีย"
  INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
  INSHOL_eastern_development_fund: "กองทุนพัฒนาหมูเกาะทางตะวันออก"
  INSHOL_eastern_development_fund_desc: "เรามุงลงทุนในชวาและสุมาตรามากเกินไป จนละเลยดินแดนสวนใหญของอาณานิคม เราตองทุมเทพัฒนาโครงสรางพื้นฐานทางตะวันออกเพื่อเปดทางสูการพัฒนาอุตสาหกรรมในอนาคต"
  INSHOL_increase_rubber_taxes: "ขึ้นภาษียาง"
  INSHOL_increase_rubber_taxes_desc: "บริษัทยางหลายแหงในหมูเกาะอินเดียตะวันออกกําลังสรางความมั่งคั่งมหาศาลจากทรัพยากรของอาณานิคม จึงเปนการยุติธรรมที่เราจะเก็บภาษีอยางหนักจากกิจการเหลานี้"

  INSHOL_reform_knil: "ปฏิรูป KNIL"
  INSHOL_reform_knil_desc: "นับแตหมูเกาะอินเดียตะวันออกพิชิตหมูเกาะทั้งหมดไดสําเร็จ กองทัพบกหลวงเนเธอรแลนดอินเดียตะวันออกก็หยุดนิ่งและขาดงบประมาณอยางรุนแรง เมื่อความตึงเครียดทั่วโลกเพิ่มสูงขึ้น เราตองเริ่มติดอาวุธใหหมูเกาะอินเดียตะวันออกใหมโดยเร็ว"
  INSHOL_fund_ml_knil: "สนับสนุนงบประมาณ ML-KNIL"
  INSHOL_fund_ml_knil_desc: "หากเราตองการตามใหทันกองทัพของชาติอื่น ๆ ในโลก เราตองสรางกองทัพอากาศที่เหมาะสมของเราเอง มิฉะนั้นเราจะเสียเปรียบอยางมาก"
  INSHOL_bandung_aircraft_facility_tt: "§Yชวาตะวันตก:§!\n    เพิ่มชองอาคาร §G1§! ชองและ§Yโรงงานทหาร§! §G1§! แหง ตอแผนยุทธศาสตรที่เปนเงื่อนไขกอนหนาที่เสร็จสิ้นแตละแผน"
  INSHOL_rangers: "หนวยจูโจมพิเศษ"
  INSHOL_rangers_desc: "หมูเกาะอินเดียตะวันออกเปนหมูเกาะกวางใหญที่มีสภาพแวดลอมหลากหลาย เราควรฝกหนวยจูโจมพิเศษที่ปรับตัวใหรบไดในสภาพแวดลอมอันโหดรายเหลานี้ เพื่อใหมั่นใจวาเราพรอมจะปกปองดินแดน"
  INSHOL_mountaineers: "ทหารภูเขา"
  INSHOL_mountaineers_desc: "เราควรฝกทหารภูเขาที่พรอมรบในภูมิประเทศอันทุรกันดารของหมูเกาะเรา"
  INSHOL_elevate_elite_infantry: "เดปอต สเปเซียเล ทรูเพิน"
  INSHOL_elevate_elite_infantry_desc: "เราไมอาจพึ่งพายุทธศาสตรแบบมหาสงครามไดตลอดไป เราตองปรับตัวรับเทคโนโลยีใหมและมั่นใจวาจะไมลาหลัง เราควรจัดตั้งกองพลทหารราบชั้นยอดหลายกองพลที่พรอมปองกันในทุกสภาพแวดลอม"
  INSHOL_modernize_knil: "ปรับปรุง KNIL ใหทันสมัย"
  INSHOL_modernize_knil_desc: "เราจะศึกษายุทธศาสตรและหลักนิยมใหม ๆ สําหรับกองทัพหมูเกาะอินเดียตะวันออก เพื่อใหมั่นใจวาเราจะยังคงไดเปรียบเหนือขาศึก"
  INSHOL_transfer_of_henri_winkelman: "การโยกยายอ็องรี วิงเคิลมัน"
  INSHOL_transfer_of_henri_winkelman_desc: "อ็องรี วิงเคิลมัน เคยรับราชการใน KNIL มาหลายป เห็นไดชัดวาหมูเกาะอินเดียตะวันออกตองการเขาอีกครั้ง และเราควรจัดการโยกยายเขาอยางเปนทางการมายังหมูเกาะอินเดียตะวันออก"
  INSHOL_eastern_conscription: "ระดมกองกําลังเสริม"
  INSHOL_eastern_conscription_desc: "บนเกาะชวาและมาดูรามีกองกําลังเสริมของชาวพื้นเมืองหลายกองที่อยูใตการควบคุมของเจาผูครองทองถิ่น ในยามคับขันเชนนี้ เราอาจเจรจาขอตกลงกับเจาผูครองทองถิ่นใหกองกําลังเหลานี้มาอยูภายใตอํานาจของเรา"
  INSHOL_establish_vk_knil: "จัดตั้ง VK-KNIL"
  INSHOL_establish_vk_knil_desc: "เราจะจัดตั้งกองอาสาสมัครสตรีสําหรับ KNIL การมีสวนรวมของพวกเธอจะมีบทบาทสําคัญในการพัฒนาการสงกําลังบํารุงและการสื่อสารของเรา"
  INSHOL_emergency_dockyard_construction: "เรงสรางอูตอเรือฉุกเฉิน"
  INSHOL_emergency_dockyard_construction_desc: "ภัยคุกคามจากการยกพลขึ้นบกนั้นไมอาจประเมินตํ่าได เราตองใหการปองกันทางทะเลเปนลําดับความสําคัญสูงสุด"
  INSHOL_emergency_powers_gov_general: "อํานาจฉุกเฉินแกผูสําเร็จราชการ"
  INSHOL_emergency_powers_gov_general_desc: "สงครามที่ดําเนินอยูตองการการตัดสินใจที่ยากลําบากโดยไมลาชา ซึ่งเปนไปไมไดเมื่อการตัดสินใจทุกอยางในหมูเกาะอินเดียตะวันออกตองผานเนเธอรแลนดกอน เราควรมอบอํานาจฉุกเฉินให [INS.GetLeader] เพื่อใหเขาสามารถดําเนินการไดทันที"
  INSHOL_emergency_naval_purchases: "จัดซื้อเรือรบฉุกเฉิน"
  INSHOL_emergency_naval_purchases_desc: "ชายฝงของเราไมปลอดภัยและมีการปองกันไมเพียงพอ เวลาเปนสิ่งสําคัญยิ่ง เราตองมีกองทัพเรือที่แข็งแกรงขึ้น มิฉะนั้นเราจะพินาศอยางแนนอน เราจะกูเงินซื้อเรือจากบริษัทเอกชน แลวดัดแปลงเปนเรือพิฆาต"

  INSHOL_east_indies_navy: "กองทัพเรือหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] ไมมีกองทัพเรืออยางเปนทางการ ทําใหเนเธอรแลนดตองรับผิดชอบการปองกันอาณานิคม เมื่อความตึงเครียดในยุโรปและเอเชียเพิ่มขึ้น สิ่งนี้จะใชการไมไดอีกตอไป เราตองกาวแรกสูการกอตั้งกองทัพเรือ[INS.GetAdjective]โดยเฉพาะ"
  INSHOL_marines: "นาวิกโยธิน"
  INSHOL_marines_desc: "เราควรจัดตั้งกองนาวิกโยธินหมูเกาะอินเดียตะวันออกโดยเฉพาะภายใตกองทัพเรือใหม และสงนาวิกโยธินฝกหัดไปเรียนรูบนเรือของดัตช"
  INSHOL_domestic_ship_production: "การตอเรือภายในประเทศ"
  INSHOL_domestic_ship_production_desc: "หากเราตองการใหกองทัพเรือของเรายืนหยัดตอกรกับเพื่อนบานได เราตองเริ่มเรงการตอเรือภายในประเทศ"
  INSHOL_destroyers: "เรือพิฆาต"
  INSHOL_destroyers_desc: "เรือรบขนาดหนักของเราไมอาจปฏิบัติการในนานนํ้าแคบของหมูเกาะไดหากไมมีเรือคุมกัน ดวยการวางกระดูกงูเรือพิฆาตสมัยใหม กองทัพเรือ[ROOT.GetAdjective]จะสามารถคุมครองเสนทางเดินเรือและขับไลเรือตอรปโดทั่วชองแคบได"
  INSHOL_cruisers: "เรือลาดตระเวน"
  INSHOL_cruisers_desc: "กองเรือที่ไมมีเรือประจัญบานตองฝากนํ้าหนักไวกับเรือลาดตระเวน การสรางหมูเรือลาดตระเวนที่แข็งแกรงจะทําใหกองทัพเรือ[ROOT.GetAdjective]มีแกนหลักที่แข็งแกรง สามารถลาดตระเวนระยะทางไกลระหวางหมูเกาะ และตอบโตเรือจูโจมใดก็ตามที่ลวงลํ้านานนํ้าของเรา"
  INSHOL_submarines: "เรือดํานํ้า"
  INSHOL_submarines_desc: "ชองแคบของหมูเกาะอินเดียตะวันออกเหมาะแกการซุมโจมตี และเรือดํานํ้ามีราคาถูกกวาเรือรบที่มันสงลงกนทะเลมาก หนวยเรือดํานํ้าที่แข็งแกรงจะทําใหกองทัพเรือ[ROOT.GetAdjective]ครองเสนทางเดินเรือและโจมตีการเดินเรือของขาศึกไดโดยไมตองเผยตัวเลย"
  INSHOL_outsourced_navy: "วาจางบริษัทเอกชนผลิต"
  INSHOL_outsourced_navy_desc: "คาใชจายของเราก็มากพออยูแลว เราไมอาจโยกงบประมาณอาณานิคมไปใหกองทัพเรือมากขึ้นเรื่อย ๆ ไดอีก เราสามารถจายเงินใหบริษัทเอกชนรับหนาที่ผลิตแทนเราได"
  INSHOL_divert_civilian_to_navy: "โยกงบพลเรือนและกองทัพบกไปใหกองทัพเรือ"
  INSHOL_divert_civilian_to_navy_desc: "ดวยสถานการณโลกในปจจุบัน ความเสี่ยงของการยกพลขึ้นบกสูงกวาที่เคยเปนมา เราไมอาจประหยัดไดอีกแลว เราตองโยกงบประมาณจากทุกภาคสวนของรัฐบาลไปใหกองทัพเรือ"

  INS_netherlands_can_remove_autonomy_tt_50: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -50.00§!"
  INS_netherlands_can_remove_autonomy_tt_75: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -75.00§!"
  INS_netherlands_can_remove_autonomy_tt_100: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -100.00§!"
  INS_netherlands_can_remove_autonomy_tt_150: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -150.00§!"
  INS_netherlands_can_remove_autonomy_tt_200: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -200.00§!"
  INS_netherlands_can_remove_autonomy_tt_250: "\nหาก [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ทําแผนยุทธศาสตรนี้สําเร็จกอน:\n    ([INS.GetFlag]§Y[INS.GetName]§!): เพิ่ม §Y£autonomy_texticon -250.00§!"

  INSHOL_begin_negotiations_soetardjo: "เริ่มเจรจากับซูตารจโจ"
  INSHOL_begin_negotiations_soetardjo_desc: "คํารองขออํานาจปกครองตนเองของซูตารจโจดูมีอนาคต และเปดโอกาสใหเราประนีประนอมระหวางฝายชาตินิยมกับฝายจงรักภักดี เราควรเริ่มการเจรจาอยางเปนทางการกับพรรคของเขา"
  INSHOL_urge_gov_veto: "เรงเราใหผูสําเร็จราชการใชสิทธิ์ยับยั้ง"
  INSHOL_urge_gov_veto_desc: "คํารองของซูตารจโจเปนแผนการของฝายชาตินิยมที่รัฐบาลหมูเกาะอินเดียตะวันออกกําลังหลงกล เราตองเรงเราใหผูสําเร็จราชการยับยั้งคํารองนี้ทันที มิฉะนั้นเราเสี่ยงจะเสียอาณานิคมไป"
  INSHOL_eventual_autonomy: "ยอมรับอํานาจปกครองตนเองในอนาคต"
  INSHOL_eventual_autonomy_desc: "ความปรารถนาเอกราชของชาวอินโดนีเซียแรงกลาและไมมีทีทาจะลดลง เราจะยอมรับใหหมูเกาะอินเดียตะวันออกมีอํานาจปกครองตนเองในอนาคต แตก็ตอเมื่ออาณานิคมพิสูจนไดวาพึ่งพาตนเองได และจะยังคงยึดมั่นในอุดมการณประชาธิปไตย"
  INSHOL_autonomous_dominion: "รัฐบัญญัติซูตารจโจ ค.ศ. [GetYear]"
  INSHOL_autonomous_dominion_desc: "แมเนเธอรแลนดจะกําหนดนิยาม 'การพึ่งพาตนเอง' อยางไมสมเหตุสมผล ซึ่งเราตองบรรลุใหไดเพื่อใหเงื่อนไขของคํารองซูตารจโจมีผล แตความปรารถนาเอกราชของชาวอินโดนีเซียแรงกลาพอที่เราจะบรรลุขอกําหนดเหลานี้ได ตามขอตกลง เราจะประกาศเอกราชอยางสมบูรณและไมมีเงื่อนไขจากราชบัลลังกดัตช"
  INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! จะ§Rถูกปดกั้นจากการไดรับเอกราชอยางถาวร§!หากไมมีการแทรกแซงจากตางชาติ§!"

  INSHOL_sideline_the_volksraad: "กันโฟลกสราดออกไป"
  INSHOL_sideline_the_volksraad_desc: "คํารองที่ซูตารจโจยื่นนั้นละเมิดมาตรา 1 ของรัฐธรรมนูญดัตชอยางชัดแจง และจะสรางแตความยุงยากใหกับการบริหารหมูเกาะอินเดียตะวันออก คํารองนี้ตองถูกยับยั้ง"
  INSHOL_prioritize_dutch_profits: "ใหความสําคัญกับผลกําไรของดัตช"
  INSHOL_prioritize_dutch_profits_desc: "เราจะทุมเทความพยายามเพื่อเพิ่มผลกําไรใหกับมาตุภูมิ เสถียรภาพทางเศรษฐกิจของพวกเขาเปนผลดีตอราชอาณาจักรโดยรวม"
  INSHOL_development_loans_netherlands: "เงินกูเพื่อการพัฒนาจากเนเธอรแลนด"
  INSHOL_development_loans_netherlands_desc: "เราสามารถกูเงินจากบริษัทดัตชเพื่อเรงการพัฒนาอุตสาหกรรม แมเราจะใชสถานะอาณานิคมกําลังพัฒนาเพื่อรับประกันอัตราดอกเบี้ยตํ่า แตเราก็ยังตองจายดอกเบี้ยอยูดี"
  INSHOL_request_economic_dev_subsidy: "ขอเงินอุดหนุนเพื่อการพัฒนาเศรษฐกิจ"
  INSHOL_request_economic_dev_subsidy_desc: "เราไดพิสูจนคุณคาของเราตอเจาอาณานิคมแลวในฐานะอาณานิคมที่ทํากําไร เราสามารถใชสิ่งนี้เปนขอตอรองเพื่อขอเงินอุดหนุนการพัฒนาอุตสาหกรรม"
  INSHOL_loyalty_to_crown: "ความจงรักภักดีตอราชบัลลังก"
  INSHOL_loyalty_to_crown_desc: "หมูเกาะอินเดียตะวันออกเปนหลายสิ่ง แตเหนือสิ่งอื่นใด เราคืออาณานิคมดัตชผูจงรักภักดี สมเด็จพระราชินีวิลเฮลมินาจะทรงนําเราสูชัยชนะ เราตองไมปลอยใหลัทธิชาตินิยมยุติประวัติศาสตรเกือบ 500 ป และตองยืนยันความจงรักภักดีอยางสมบูรณตอราชบัลลังกตอไป"
  INS_loans_timer: "\nใน §Y365§! วัน:"
  INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: ตัวปรับคาความเร็วการวิจัยอยางนอย §G1.00%§!"
  INS_subsidize_local_business: "อุดหนุนธุรกิจทองถิ่น"
  INS_subsidize_local_business_desc: "เราควรใหเงินอุดหนุนแกธุรกิจทองถิ่นเพื่อกระตุนการเติบโตทางเศรษฐกิจ ซึ่งจะเสริมเศรษฐกิจของเราในระยะยาว"
  INSHOL_education_reforms: "ปฏิรูปการศึกษา"
  INSHOL_education_reforms_desc: "พลเมืองจํานวนมากของหมูเกาะอินเดียตะวันออกไมมีโอกาสไดรับการศึกษา และมีนอยคนนักที่จบชั้นมัธยม หากเราตองการใหหมูเกาะอินเดียตะวันออกเปนรัฐอุตสาหกรรมที่มั่งคั่ง เราตองทําใหประชาชนเขาถึงการศึกษาไดอยางแทจริง"
  INS_expand_batavia_med_school: "ขยายโรงเรียนแพทยบาตาเวีย"
  INS_expand_batavia_med_school_desc: "การขยายโรงเรียนแพทยบาตาเวียดวยการสรางวิทยาเขตใหมและจางอาจารยเพิ่ม จะทําใหการศึกษาขั้นสูงเขาถึงไดงายขึ้นมาก ซึ่งสําคัญยิ่งตอการเติบโตทางเศรษฐกิจในระยะยาวของเรา"
  INS_prepare_for_policy_shift: "เตรียมพรอมสําหรับการเปลี่ยนนโยบาย"
  INS_prepare_for_policy_shift_desc: "ภูมิทัศนทางการเมืองในหมูเกาะอินเดียตะวันออกไดรับผลกระทบจากการตื่นตัวของชาติในชวงหลายทศวรรษที่ผานมา และนโยบายปจจุบันของเราก็ลาสมัยอยางเห็นไดชัด เราควรพิจารณาปรับเปลี่ยนโครงสรางการปกครองบางประการ"
  INS_reallocate_rubber_industry_funding: "จัดสรรงบอุตสาหกรรมยางใหม"
  INS_reallocate_rubber_industry_funding_desc: "การพึ่งพาการขายยางสงผลรายแรงตอเศรษฐกิจของเรา เราควรกระจายความเสี่ยงทางเศรษฐกิจดวยการสํารวจหาทรัพยากรและเปดเหมืองกับโรงงานทั่วหมูเกาะ ความพยายามนี้ไมใชเรื่องถูก ๆ เราจึงตองลดงบประมาณการดูแลสวนยางลง"
  INS_reallocate_rubber_industry_funding_tt: "ปลดล็อกการตัดสินใจเพื่อ§Yนํายางออกจากรัฐ§! และแทนที่ดวย§Yทรัพยากรอื่น§!ในปริมาณที่นอยกวา"

  INSHOL_nationalist_coallition: "แนวรวมชาตินิยม"
  INSHOL_nationalist_coallition_desc: "โฟลกสราดพูดดวยเสียงเดียวมานานเกินไป และเสียงนั้นก็เบาเกินไป ยุคของการยื่นคํารองและการผัดผอนอยางอดทนไดผานพนไปแลว แนวรวมของสมาชิกฝายชาตินิยมในสภาจะละทิ้งความขัดแยงและเรียกรองเอกราชโดยไมมีเงื่อนไข เสียงอาวุโสจากนอกสภา บุคคลที่ดัตชเคยคิดวากันออกไปไดอยางปลอดภัย จะไดรับการตอนรับกลับคืนสูขบวนการ"

  INSHOL_volksraad_compromises: "การประนีประนอมในโฟลกสราด"
  INSHOL_volksraad_compromises_desc: "การปฏิรูปภายในสภาพาเรามาไกลถึงเพียงนี้ และไมมีเหตุผลที่จะละทิ้งเสนทางนี้ในตอนนี้ โฟลกสราดจะยังคงทํางานอยางรอบคอบ แลกเปลี่ยนการยอมผอนปรนทีละขั้นกับกรุงเฮก แสวงหาการปกครองตนเองดวยความอดทนแทนการแตกหัก อนาคตภายในเครือจักรภพดัตชใหประโยชนมากกวาอนาคตที่ใชไปกับการตอสูเพื่อออกไปอยูนอกเครือจักรภพ"

  INSHOL_establish_the_princely_council: "จัดตั้งสภาเจาผูครอง"
  INSHOL_establish_the_princely_council_desc: "สุลตานและราชาแหงหมูเกาะครองความภักดีที่ไมเคยมีสภาใดในบาตาเวียทําได ราชสํานักของพวกเขาเกาแกกวาบริษัทอินเดียตะวันออก และเกาแกกวาสาธารณรัฐที่สืบตอมา สภาอยางเปนทางการของราชวงศเจาผูครองจะใหผูปกครองเหลานี้มีที่นั่งบนโตะเจรจาของชาติใหม และผูกอํานาจของพวกเขาไวกับอํานาจของเรา"

  INSHOL_nationalize_dutch_companies: "โอนกิจการดัตชเปนของรัฐ"
  INSHOL_nationalize_dutch_companies_desc: "บริษัทการคาใหญ สายการเดินเรือ กิจการสวนเกษตร และธนาคาร ลวนใชชื่อดัตชมานานเทาที่ใครจะจําได นับจากนี้ไปพวกมันจะใชชื่ออินโดนีเซีย คณะกรรมการจะถูกจัดใหม ปายจะถูกปลดลง และทุนที่ถูกสูบออกไปจากหมูเกาะเหลานี้ตลอดสามศตวรรษจะกลับมาเปนของหมูเกาะเองในที่สุด"

  INSHOL_democracy: "อินโดนีเซียประชาธิปไตย"
  INSHOL_democracy_desc: "โฟลกสราดถือกําเนิดขึ้นในฐานะมาตรการครึ่ง ๆ กลาง ๆ เปนเพียงองคกรที่ปรึกษาซึ่งถูกจํากัดเขี้ยวเล็บไวอยางรอบคอบ ออกแบบมาใหดูเหมือนมีผูแทนแตไมใหสาระที่แทจริง บัดนี้มันเติบโตเกินกวาผูสรางแลว สภาจะถูกจัดตั้งใหมเปนสภานิติบัญญัติที่แทจริง มีสมาชิกที่ไดรับเลือกจากประชาชนที่สภาอางวาเปนตัวแทน และมีมติที่ผูกพันรัฐบาลซึ่งเคยจูงสภาไวดวยสายจูงสั้น ๆ"

  INSHOL_princely_authority: "อํานาจของเจาผูครอง"
  INSHOL_princely_authority_desc: "สภาที่ปรึกษาก็ดีในบทบาทของมัน แตบรรดาสุลตานที่ใหยืมนามของตนแกการกอตั้งชาตินี้อาจใหมากกวานั้น รัฐสภาจะไมขวางทางผูที่ตองการเห็นหนึ่งในพวกเขาไดรับการยกขึ้นเหนือผูอื่น ราชสํานักเกาแกรอคอยมานานแลวที่จะไดรับคําถามนี้อีกครั้ง"

  INSHOL_encourage_further_investment: "สงเสริมการลงทุนเพิ่มเติม"
  INSHOL_encourage_further_investment_desc: "ขอตกลงที่โฟลกสราดไดยุติปญหาทางการเมืองไปแลวในตอนนี้ และทุนดัตชก็สังเกตเห็น ภาษีศุลกากรจะผอนคลายลง การคํ้าประกันจะขยายออกไป และหอการคาในอัมสเตอรดัมกับรอตเทอรดามจะไดรับความมั่นใจวาหมูเกาะยังคงเปดรับธุรกิจ สิ่งที่เคยทํากําไรภายใตขอตกลงเดิมจะยังทํากําไรภายใตขอตกลงใหม"

  # <Joint Tree - ABDACOM>
  INSHOL_east_indies_artillery: "การผลิตปนใหญในหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_artillery_desc: "การเปดโรงงานผลิตปนใหญในชวาจะชวยใหเราพึ่งพาการคาตางประเทศเพื่อการทหารนอยลง"
  INSHOL_recall_gerardus_johannes_berenschot: "เรียกตัวนายพลเบเรินสโคตกลับ"
  INSHOL_recall_gerardus_johannes_berenschot_desc: "เครารดึส โยฮันเนส เบเรินสโคต เปนหนึ่งในนายพลที่มีความสามารถที่สุดในเครือจักรภพ เขาใชชีวิตราชการสวนใหญในหมูเกาะอินเดียตะวันออก แตก็เคยประจําอยูในเนเธอรแลนดหลายป ในยามคับขันเชนนี้ เราตองเรียกตัวเขากลับมายังหมูเกาะเพื่อชวยในความพยายามทางสงคราม"
  INSHOL_east_indies_cruiser_manufacturing: "การผลิตเรือลาดตระเวนในหมูเกาะอินเดียตะวันออก"
  INSHOL_east_indies_cruiser_manufacturing_desc: "การตอเรือลาดตระเวนเองแทนที่จะสั่งซื้อจากดัตชโดยตรง คือกาวแรกสูการสรางกองทัพเรือที่แทจริง ซึ่งเปนความพยายามที่จําเปนเมื่อพิจารณาถึงภัยคุกคามจากญี่ปุน"
  INSHOL_transfer_of_conrad_helfrich: "โยกยายคอนราด เฮลฟริช มายังหมูเกาะ"
  INSHOL_transfer_of_conrad_helfrich_desc: "การโยกยายพลเรือเอกคอนราด เฮลฟริช มายังหมูเกาะอินเดียตะวันออกโดยตรงจะยกระดับการปฏิบัติการทางทะเลในหมูเกาะไดอยางมาก"

  # <Joint Tree - Naval Program>
  INSHOL_naval_program: "โครงการทางทะเลเนเธอรแลนด-อินโดนีเซีย"
  INSHOL_naval_program_desc: "กองทัพเรือหมูเกาะอินเดียตะวันออกลาหลังกองทัพเรืออื่น ๆ อยางมาก แมแตกองทัพเรืออาณานิคมดวยกัน เปนประโยชนสูงสุดตอทุกฝายที่เราจะชวยพัฒนากองทัพเรือใหมนี้ เพื่อใหกาวหนาไดอยางรวดเร็ว"

  INSHOL_naval_program_transfer_25_tt: "โอน §Y25%§! ของกําลังทางเรือของเราให [INS.GetNameDef]"
  INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! จะโอน §Y25%§! ของกําลังทางเรือให §Y[INS.GetNameDefCap]§!"
  INSHOL_naval_program_transfer_100_tt: "โอน§Rกองทัพเรือทั้งหมดของเรา§!ให [INS.GetNameDef]"
  INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! จะโอนกองทัพเรือทั้งหมดให §Y[INS.GetNameDefCap]§!"
  INSHOL_naval_program_rejected_tt: "ปลดล็อกแผนยุทธศาสตร §Y$INSHOL_naval_secondchance$§!"

  INSHOL_hybrid_navy: "กองทัพเรือแบบผสม"
  INSHOL_hybrid_navy_desc: "กองทัพเรือของเราไมอาจพึ่งพาเพียงการรับชวงกองเรือแปซิฟกของ [HOL.GetNameDef] ได เราตองเริ่มตอเรือของเราเอง มิฉะนั้นความผิดพลาดเพียงครั้งเดียวอาจตัดการจัดหาเรือทั้งหมดของเรา"
  INSHOL_request_naval_control: "หมูเรือหมูเกาะอินเดียตะวันออก"
  INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap] ลมสลายแลวและไมอยูในสถานะที่จะปฏิบัติการกองทัพเรือทั้งหมดได เราควรเขาควบคุมกองทัพเรือนั้นไปจนสิ้นสงคราม"
  INSHOL_naval_secondchance: "แผนทางทะเลหมูเกาะอินเดียตะวันออก"
  INSHOL_naval_secondchance_desc: "แม [HOL.GetNameDef] จะปฏิเสธที่จะโอนอํานาจควบคุมกองทัพเรือ แตเรายังคงตองปองกันแปซิฟก หากไมตองการถูกยึดครอง แมผลลัพธอาจไมดีเทากับหากพวกเขายอมรับขอเสนอของเรา แตเราจะหาทางเลือกที่ดีพอใชได"

  # <Joint Tree - Netherlands in Exile>
  INSHOL_netherlands_in_exile: "เนเธอรแลนดพลัดถิ่น"
  INSHOL_netherlands_in_exile_desc: "การลมสลายอันนาเศราของราชอาณาจักรเราไดกลายเปนความจริงแลว เราตองไมจมลงสูความสิ้นหวัง เราตองยอมรับสิ่งที่เกิดขึ้นและมุงความสนใจไปยังสิ่งที่เรายังกอบกูได"
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
  INSHOL_relocate_our_generals: "ยายกองทัพของเราไปยังชวา"
  INSHOL_relocate_our_generals_desc: "นายพล ผูบัญชาการ และทหารที่ยังหลงเหลือซึ่งลี้ภัยอยู ตองถูกยายไปยัง [1058.GetName] เปนลําดับความสําคัญสูงสุด กอนที่จะสายเกินไป"
  #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
  INSHOL_netherlands_indonesia_union: "สหภาพเนเธอรแลนด-อินโดนีเซีย"
  INSHOL_netherlands_indonesia_union_desc: "แนวคิดเรื่องรัฐสหภาพที่เทาเทียมกันระหวาง [HOL.GetNameDef] กับ [INS.GetNameDef] เปนเรื่องนาขันสําหรับหลายคน แตดวยวิกฤตที่เราเผชิญอยู นี่ดูจะเปนหนทางเดียวที่จะเพิ่มโอกาสรักษาอธิปไตยของเราใหไดมากที่สุด"

  # <Sukarno Shared Branch - Resistance Buildup>
  INS_underground_revolution: "การปฏิวัติใตดิน"
  INS_underground_revolution_desc: "เราจะเริ่มวางแผนการปฏิวัติจากเงามืด คอย ๆ เพิ่มสมาชิกและกิจกรรมของกองกําลังอาสาจนกวาเราจะพรอมลงมือ"
  INS_infiltrate_the_media: "แทรกซึมสื่อ"
  INS_infiltrate_the_media_desc: "ขบวนการของเราไดดึงบุคคลระดับสูงหลายคนในองคกรสื่อของหมูเกาะอินเดียตะวันออกเขามาเปนสมาชิก เราสามารถใชขอไดเปรียบนี้ปลูกฝงความรูสึกสนับสนุนการปฏิวัติในใจพลเมืองอยางแนบเนียน"
  INS_infiltrate_the_army: "แทรกซึมกองทัพ"
  INS_infiltrate_the_army_desc: "สมาชิกของเราจํานวนมากรับราชการใน KNIL ตั้งแตพลทหารชั้นผูนอยไปจนถึงพันตรี เราควรรวบรวมความลับใหไดมากที่สุด พรอมกับผลักดันคนของเราขึ้นสูตําแหนงสูง เมื่อเราลั่นไก เราจะสามารถกอความโกลาหลใน KNIL ได"
  INS_privately_owned_military_industry: "อุตสาหกรรมทหารภาคเอกชน"
  INS_privately_owned_military_industry_desc: "เราจะจัดตั้งบริษัทเงาหลายแหงในภาคอุตสาหกรรมทหาร เพื่อใหมั่นใจวาเราจะยังคงควบคุมอุตสาหกรรมทหารไดเมื่อการปฏิวัติเริ่มขึ้น"
  INS_privately_owned_military_industry_tt: "เพิ่ม§Yโรงงานทหาร§! §G2§! แหงในกองบัญชาการของคุณ"
  INS_instigate_chaos_sulawesi: "กอความโกลาหลในสุลาเวสี"
  INS_instigate_chaos_sulawesi_desc: "เราจะรวมมือกับกลุมชาตินิยมทองถิ่นในสุลาเวสี จัดการนัดหยุดงาน การจลาจล และปลุกปนประชาชนใหหัวรุนแรง"
  INS_instigate_chaos_sulawesi_tt: "เมื่อเราประกาศเอกราช เราจะได§Gดินแดนหลัก§!ใน §Y[673.GetName]§! และ §Y[1056.GetName]§! ซึ่งจะยังคงไมเปนดินแดนหลักของหมูเกาะอินเดียตะวันออกของดัตชตอไป"
  INS_instigate_chaos_medan: "กอความโกลาหลในเมดาน"
  INS_instigate_chaos_medan_desc: "เราจะรวมมือกับกลุมชาตินิยมทองถิ่นในเมดานและเรียว จัดการนัดหยุดงาน การจลาจล และปลุกปนประชาชนใหหัวรุนแรง"
  INS_instigate_chaos_medan_tt: "เมื่อเราประกาศเอกราช เราจะได§Gดินแดนหลัก§!ใน §Y[1049.GetName]§! ซึ่งจะยังคงไมเปนดินแดนหลักของหมูเกาะอินเดียตะวันออกของดัตชตอไป"
  INS_embezzlement_scheme_in_batavia: "แผนยักยอกในบาตาเวีย"
  INS_embezzlement_scheme_in_batavia_desc: "เราจะวางแผนยายการผลิตของเราจากบาตาเวียไปยังดินแดนของฝายสาธารณรัฐเมื่อประกาศเอกราช"
  INS_embezzlement_scheme_in_batavia_tt: "เมื่อประกาศเอกราช โรงงานครึ่งหนึ่งใน §Y[1058.GetName]§! จะถูกยายไปยัง§Yกองบัญชาการปฏิวัติ§!ของเรา"
  INS_volksraad_rumors: "ขาวลือในโฟลกสราด"
  INS_volksraad_rumors_desc: "เราจะเริ่มหารือเรื่องการปฏิวัติอยางลับ ๆ ภายในโฟลกสราด หากสําเร็จ เราจะสามารถโนมนาวสมาชิกโฟลกสราดชาวอินโดนีเซียใหเขารวมอุดมการณของเราได"
  INS_volksraad_rumors_tt: "ที่ปรึกษาโฟลกสราด§Yชาวอินโดนีเซีย §!ทั้งหมดจะ§Gยังคงอยู§!หลังประกาศเอกราช"

  INS_railway_youth_force: "รวมมือกับกองกําลังยุวชนรถไฟ"
  INS_railway_youth_force_desc: "กองกําลังยุวชนรถไฟเปนกลุมกองกําลังอาสายุวชนมุสลิมที่เคลื่อนไหวสวนใหญในชวากลาง ไดชื่อมาจากยุทธวิธียึดทางรถไฟ พวกเขาจะเปนพันธมิตรที่มีคา แตพวกเขาก็กระตือรือรนและอยากเขาสูรบ หากเราหยุดยิงนานเกินไป พวกเขาจะไมพอใจรัฐบาล"
  INS_sleeper_informant_network: "[GetInformantNetworkName]"
  INS_Sleeper_Informant_Network_name: "เครือขายสายขาวแฝงตัว"
  INS_KNIL_Informant_Network_name: "เครือขายสายขาวใน KNIL"
  INS_sleeper_informant_network_desc: "เราจะสรางเครือขายสายขาวที่ฝงตัวอยูทั่วกลไกการบริหารของ KNIL เพื่อใหเราไดรับคําเตือนลวงหนาถึงแผนการของขาศึก"
  INS_sleeper_informant_network_tt: "§Rเมื่อประกาศเอกราช:§!\n"

  # <Sukarno Shared Branch - Peoples Security Army>
  INS_the_peoples_security_army: "กองทัพความมั่นคงประชาชน"
  INS_the_peoples_security_army_desc: "สมาชิกของเรา ซึ่งสวนใหญเปนคนหนุมสาวชาวอินโดนีเซีย กําลังหมดความอดทน กระตือรือรนที่จะมีสวนรวมและตอสูเพื่อเอกราช เราควรจัดตั้งกองทัพปฏิวัติและเริ่มฝกทหารในอนาคตของเรา"
  INS_commander_sudirman: "กองทัพของซูดีรมัน"
  INS_commander_sudirman_desc: "แมซูดีรมันจะยังหนุมและเพิ่งเริ่มมีชื่อเสียง แตเขาแสดงศักยภาพอันยิ่งใหญและเปนที่นิยมอยางมากในหมูสมาชิกรุนเยาวของขบวนการตอตาน เขาควรเปนผูกําหนดทิศทางของกองทัพความมั่นคงประชาชนและนําเราสูชัยชนะ"
  INS_commander_oerip: "กองทัพของอูรีป"
  INS_commander_oerip_desc: "อูรีปรับราชการในกองทัพมาหลายทศวรรษ และเปนชาวอินโดนีเซียเพียงคนเดียวที่เคยไดเลื่อนยศเปนพันตรีใน KNIL ความรูและประสบการณของเขาเหนือกวาสมาชิกคนอื่นใดอยางเทียบไมติด เขาควรเปนผูกําหนดทิศทางของกองทัพความมั่นคงประชาชนและนําเราสูชัยชนะ"
  INS_sudirmans_promotion: "การเลื่อนยศของซูดีรมัน"
  INS_sudirmans_promotion_desc: "ซูดีรมันแสดงทักษะความเปนผูนําอันยอดเยี่ยม และวางแผนการบุกที่ประสบความสําเร็จหลายครั้ง ถึงเวลาแลวที่เราจะยกยองความพยายามของผูบัญชาการของเราดวยการมอบยศนายพลที่เขาสมควรไดรับ"
  INS_tkr_steal_general: "ดึงตัวนายพล KNIL"
  INS_tkr_steal_general_desc: "หากเราโนมนาวนายทหารระดับสูงของกองทัพหมูเกาะอินเดียตะวันออกใหเขารวมอุดมการณของเราได เราจะทั้งพัฒนากองทัพของเราและบอนทําลายกองทัพของพวกเขาไปพรอมกัน"
  INS_tkr_supply: "นักปฏิวัติทุกคนตองจับอาวุธ"
  INS_tkr_supply_desc: "เราจะทําใหมั่นใจวาสมาชิกทุกคนในขบวนการไดรับการฝกทหารอยางเปนทางการ ไมมีขอยกเวน"
  INS_tkr_professional_army: "กองทัพอาชีพ"
  INS_tkr_professional_army_desc: "เราตองไมพึ่งพาเพียงกองกําลังอาสา เราควรพัฒนากองทัพอาชีพของสาธารณรัฐเพื่อรักษาความสงบเรียบรอย"

  INS_arm_the_revolutionaries: "ติดอาวุธนักปฏิวัติ"
  INS_arm_the_revolutionaries_desc: "เราตองเริ่มจากนักปฏิวัติและนักชาตินิยมผูเปยมพลังและพรอมจะสละทุกสิ่งเพื่ออินโดนีเซีย เราจะมอบการฝกและยุทโธปกรณที่พวกเขาตองใชในการตอสูเพื่อประเทศ"
  INS_arm_the_youth: "ติดอาวุธเยาวชน"
  INS_arm_the_youth_desc: "นอกเหนือจากนักปฏิวัติ เราตองติดอาวุธใหเยาวชน พวกเขายังเปยมดวยพลังและความหวัง และจะเปนผูแบกคบเพลิงแหงการปฏิวัติ เราตองฝกและจัดยุทโธปกรณใหคนหนุมสาวชาวอินโดนีเซียใหไดมากที่สุด หากการสูรบลามมาถึงบานของพวกเขา พวกเขาจะพรอมลงมือ"
  INS_arm_the_students: "ติดอาวุธนักศึกษา"
  INS_arm_the_students_desc: "นักศึกษาไดวางรากฐานของการปฏิวัติมาตั้งแตหลายทศวรรษกอน และพวกเขาจะยังคงนําการปฏิวัติกาวไปขางหนาตอไป"
  INS_guerilla_industry: "อุตสาหกรรมกองโจร"
  INS_guerilla_industry_desc: "เราจะใชกองกําลังกองโจรทั่วหมูเกาะเขายึดโรงงาน ทําใหเราสามารถผลิตปนใหมมาติดอาวุธใหกองกําลังอาสาของเรา"
  INS_indonesian_assault_doctrine: "หลักนิยมการบุกแบบอินโดนีเซีย"
  INS_indonesian_assault_doctrine_desc: "สงครามไมไดมีแคทหาร คนนับลานไมมีความหมายหากไมมีปนใหสู เราตองใหความสําคัญกับการจัดหาปนใหญคุณภาพสูง เพื่อรุกลึกเขาไปในดินแดนที่ขาศึกควบคุม"
  INS_tighter_tkr_integration: "ผนึก TKR กับลัสการใหแนนแฟนขึ้น"
  INS_tighter_tkr_integration_desc: "กองทัพความมั่นคงประชาชนและกองกําลังอาสาตาง ๆ ไมไดปฏิบัติการอยางเปนเอกภาพ และการประสานงานก็มีจํากัด สิ่งนี้จะยิ่งกอปญหามากขึ้นเรื่อย ๆ เมื่อสงครามดําเนินตอไป เราตองหลอมรวมกองทัพและกองกําลังอาสาใหเปนองคกรเดียว แมจะตองเผชิญการประทวงที่หลีกเลี่ยงไมไดจากนายทหารของกองกําลังอาสาก็ตาม" 
  INS_quality_over_quantity: "คุณภาพเหนือปริมาณ"
  INS_quality_over_quantity_desc: "ทหารที่ไดรับการฝกมาอยางดีหนึ่งนาย พรอมยุทธศาสตรที่ไตรตรองมาแลวและยุทโธปกรณทันสมัย จะเอาชนะนักศึกษาถือปนพกหาคนได เราตองใหความสําคัญกับทหารและหนวยรบพิเศษคุณภาพสูงที่มีอาวุธครบมือ มากกวาการระดมทหารใหไดมากที่สุด"
  INS_add_militia_cap_1_tt: "ขีดจํากัดกองพล§Yนักสูเพื่ออิสรภาพ§!เพิ่มขึ้น §Y1§!\n"
  INS_add_militia_cap_2_tt: "ขีดจํากัดกองพล§Yนักสูเพื่ออิสรภาพ§!เพิ่มขึ้น §Y2§!\n"
  INS_add_militia_cap_3_tt: "ขีดจํากัดกองพล§Yนักสูเพื่ออิสรภาพ§!เพิ่มขึ้น §Y3§!\n"
  INS_add_3_militia_unit_tt: "สรางหนวย§Yนักสูเพื่ออิสรภาพ§!สามหนวย ซึ่งใชใน§Yการจูโจม§!เพื่อเพิ่ม§Gการแผอิทธิพลของกองกําลังอาสา§!ในรัฐของดัตชได"
  INS_add_fully_trained_militia_unit_tt: "สรางหนวย§Yนักสูเพื่ออิสรภาพ§!ที่ผานการฝกหนึ่งหนวย\n"

  # <Sukarno Shared Branch - Expand Resistance Membership>
  INS_expand_resistance_membership: "ขยายสมาชิกขบวนการตอตาน"
  INS_expand_resistance_membership_desc: "การรวมศูนยขบวนการทั้งหมดไวที่ฐานเดียวยอมนําไปสูความลมเหลวอยางแนนอน เราจะเกณฑสมาชิกเขากลุมกองกําลังอาสาเพื่อสงไปเปนผูแทน ซึ่งจะเพิ่มความนิยมและการควบคุมของเราในภูมิภาคตาง ๆ"

  # <Central Independence Branch - Militias>
  INS_deploy_the_kris: "หนวยบริการประชาชนอินโดนีเซียแหงสุลาเวสี"
  INS_deploy_the_kris_desc: "หนวยบริการประชาชนอินโดนีเซียแหงสุลาเวสี หรือที่รูจักในภาษาอินโดนีเซียวา KRIS เปนกลุมกองกําลังอาสาที่เคลื่อนไหวอยางแข็งขัน และเปนกองกําลังอาสาสวนใหญในสุลาเวสีและมานาโด เราควรเกณฑพวกเขาใหมาสูรบเคียงขาง TKR อยางเปนทางการ"
  INS_assist_the_pemuda: "ชวยเหลือเปอมูดา"
  INS_assist_the_pemuda_desc: "ชวาเต็มไปดวยกองกําลังอาสานักศึกษาเปอมูดาหลากหลายกลุม การรวมมือกับพวกเขาและใหความชวยเหลือทางทหารในภารกิจตอตานดัตชอาจทําใหเราไดพันธมิตรที่มีประโยชน"
  INS_mobilize_the_pemuda: "ระดมเปอมูดา"
  INS_mobilize_the_pemuda_desc: "เมื่อเราไดรับความไววางใจจากกลุมเปอมูดาที่ใหญที่สุดแลว เราควรเริ่มวางแผนระดมพวกเขาเขาสู TKR"
  INS_organize_jakarta_pemuda: "จัดระเบียบเปอมูดาจาการตา"
  INS_organize_jakarta_pemuda_desc: "ชวามีกลุมเปอมูดาหลายกลุมทุกขนาด แมเราจะระดมและเกณฑสวนใหญมาไดแลว แตยังมีกลุมเล็ก ๆ อีกหลายสิบกลุมในจาการตาที่ยังเคลื่อนไหวอยางอิสระ เราตองติดตอพวกเขาและสรางความรวมมือ"
  INS_recognize_moestopos_batallion: "รับรองกองพันของมุสโตโป"
  INS_recognize_moestopos_batallion_desc: "นักปฏิวัติชื่อมุสโตโปไดประกาศตนเปน 'รักษาการรัฐมนตรีวาการกระทรวงกลาโหม' ในสุราบายา และคุมกองกําลังอาสาในสุราบายาไว ความพยายามของเขาสมควรไดรับการรับรองอยางเปนทางการ เราควรเลื่อนยศเขาเปนพลตรีแหง TKR อยางเปนทางการ"
  INS_darul_islam_focus: "ดารุลอิสลาม"
  INS_darul_islam_focus_desc: "กองกําลังฮิซบุลลอฮของการโตซูวีรโยไดพิสูจนตนแลวบนเนินเขาแหงชวาตะวันตก และเราไมอาจปลอยนักรบเชนนี้ไวนอกแถวของเรา จงใหทหารนอกแบบของเขายืนเคียงขางทหารของเรา และใหตัวเขาเองไดรับยศที่สมควรไดรับ อีกไมนานผูศรัทธาก็จะผลักดันขอเรียกรองของตนในสาธารณรัฐ"

  # <Central Independence Branch - Navy>
  INS_just_a_fisherman: "แคชาวประมง"
  INS_just_a_fisherman_desc: "การทําสงครามในหมูเกาะโดยไมมีกองทัพเรือเปนเรื่องยาก และเราไมอาจประคองไวไดนานกวานี้ เราจะลองยุทธวิธีที่อาจดูไรเดียงสา คือสงกองกําลังอาสาลงเรือประมงปลอมตัวเปนชาวประมงไปยังทาเรือที่ดัตชควบคุม"
  INS_a_cheap_navy: "กองทัพเรือราคาประหยัด"
  INS_a_cheap_navy_desc: "เราไมมีเวลาหรือเงินพอจะสรางกองทัพเรือสมัยใหมขนาดใหญ เราตองใชสิ่งที่มีอยู และรวบรวมทุกอยางที่หาได"
  INS_divert_army_funds_to_navy: "โยกงบกองทัพบกไปใหกองทัพเรือ"
  INS_divert_army_funds_to_navy_desc: "อินโดนีเซียเปนหมูเกาะ ทหารราบของเราไรความหมายหากไมมีเรือขนสง การโยกงบประมาณจาก TKR ไปใหกองทัพเรือใหมของเราเปนการเสียสละที่คุมคา"
  INS_indonesian_naval_doctrine: "หลักนิยมทางเรือของอินโดนีเซีย"
  INS_indonesian_naval_doctrine_desc: "เมื่อเรากําลังสรางกองทัพเรือของเราเอง สิ่งสําคัญคือตองพิจารณาหลักนิยมที่เราจะใชรบและฝก เราควรใหความสําคัญกับการกําหนดและนําหลักนิยมทางเรือมาใชโดยเร็วที่สุด"
  INS_domestic_shipbuilding: "การตอเรือภายในประเทศ"
  INS_domestic_shipbuilding_desc: "เราไมอาจพึ่งพาเรือที่ยึดมาหรือซื้อมาไดตลอดไป อีกไมนานก็จะไมเหลือเรือดัตชใหเรายึดอีก เราควรเริ่มตอเรือของเราเองแตเนิ่น ๆ"
  INS_acquire_modern_blueprints: "จัดหาพิมพเขียวสมัยใหม"
  INS_acquire_modern_blueprints_desc: "เราจะซื้อพิมพเขียวจากประเทศอื่นและบริษัทเอกชนเพื่อนํามาใชสรางกองทัพเรือใหมของเรา"
  INS_reclaiming_the_dutch_navy: "ทวงคืนกองทัพเรือหมูเกาะอินเดียตะวันออกของดัตช"
  INS_reclaiming_the_dutch_navy_desc: "ดัตชทิ้งเรือไวมากมายในทาเรือที่เรายึดครองอยูตอนนี้ เราควรยึดเรือเหลานี้มาเปนของเราในขณะที่ยังมีโอกาส"
  INS_admiral_mas_pardi: "พลเรือเอกมัส ปารดี"
  INS_admiral_mas_pardi_desc: "กองทัพเรือที่ดียอมตองมีพลเรือเอกไวบัญชาการ มัส ปารดี คือตัวเลือกที่ชัดเจน"
  INS_akademi_angkatan_laut: "สรางอากาเดมี อังกาตัน ลาอุต"
  INS_akademi_angkatan_laut_desc: "เราจะสรางโรงเรียนนายเรือที่มีสิ่งอํานวยความสะดวกสําหรับการวิจัยทางเรือ พรอมทั้งใหการศึกษาแกพลเมืองใหเปนวิศวกรและนายทหารเรือมากขึ้น"

  # <Central Independence Branch - Militia Logistics>
  INS_pki_militia_tt: "ตัน มาลากา มีกองกําลังอาสาที่ทรงพลังอยางยิ่ง แตพวกเขาไมไดสูเพียงเพื่อเจตจํานงของอินโดนีเซีย หากยังสูเพื่อเจตจํานงของ§Rคอมมิวนิสต§!และโซเวียต §Rในที่สุด พวกเขาจะตอตานรัฐบาลที่ไมใชคอมมิวนิสตดวยความรุนแรง§!"
  INS_increase_laskar_funding_tt: "§Wไดรับ§!§Yโรงงานทหาร§! 1 แหง ตอทุกขอเรียกรองที่มอบใหกองกําลังอาสาสําเร็จ (สูงสุด §G6§!)" 
  INS_subsidize_laskar_armament: "อุดหนุนอาวุธของลัสการ"
  INS_subsidize_laskar_armament_desc: "กองกําลังอาสาที่สูดวยหอกไมไผจะไมรอดไดนานเมื่อเผชิญหนวยที่มีอาวุธหนัก เราตองใหความสําคัญกับการผลิตปนและกระสุนใหกองกําลังอาสาเหลานี้มากขึ้น"
  INS_loot_knil_weapons_caches: "ปลนคลังอาวุธของ KNIL"
  INS_loot_knil_weapons_caches_desc: "มีคลังอาวุธมากมายที่ KNIL เก็บไวกอนการปฏิวัติ สมาชิกของเราจํานวนมากเคยเปนทหาร KNIL และเราอาจคนหาและปลนคลังอาวุธเหลานี้ได"
  INS_utilize_tan_malakas_militia: "ใชกองกําลังอาสาของตัน มาลากา"
  INS_utilize_tan_malakas_militia_desc: "กองกําลังอาสาแดงของตัน มาลากา อาจเปนกองกําลังอาสากลุมเดียวที่แข็งแกรงที่สุดในอินโดนีเซียทั้งหมด และการระดมพวกเขาเขาสู TKR จะเปนประโยชนมหาศาล แตก็มีความเสี่ยง การใหอิทธิพลมากขนาดนี้แกกองกําลังอาสาทรงพลังที่มีแรงจูงใจทางการเมืองแรงกลา จะทําใหพวกเขายึดอํานาจไวเองไดงายขึ้นมาก"
  INS_increase_laskar_funding: "เพิ่มงบประมาณลัสการ"
  INS_increase_laskar_funding_desc: "กองกําลังอาสาคือกําลังสวนใหญของเรา เราตองยอมรับความจริงขอนี้และจัดสรรงบประมาณใหเหมาะสม แมพวกเขาจะไมไดจงรักภักดีตอ [INS.GetLeader] อยางสมบูรณก็ตาม"
  INS_develop_a_functioning_airforce: "พัฒนากองทัพอากาศที่แทจริง"
  INS_develop_a_functioning_airforce_desc: "กองทัพอากาศมีผลอยางมากตอกองทัพ เราควรใหความสําคัญกับการสรางกองทัพอากาศ"

  INS_political_stabilization: "คณะกรรมการแหงชาติอินโดนีเซียสวนกลาง"
  INS_political_stabilization_desc: "เพื่อยุติการตอสูภายในระหวางกลุมการเมืองมากมายในอินโดนีเซีย เราตองยอมผอนปรนใหกลุมอื่น ๆ เพื่อใหเราสามารถมุงความสนใจไปที่ความขัดแยงที่ดําเนินอยู เราจะจัดตั้งคณะกรรมการกึ่งประชาธิปไตยภายใตการกํากับของประธานาธิบดี ทําหนาที่เปนองคกรรัฐสภาของอินโดนีเซีย"

  INS_nationalize: "โอนเปนของรัฐ!"
  INS_nationalize_desc: "สาธารณรัฐที่เพิ่งไดรับเอกราชของเรายังคงถูกรุมเราดวยเศษซากของการปกครองดัตช บริษัทอุตสาหกรรมทหาร บริษัทนํ้ามัน บริษัทเกษตร และอื่น ๆ อีกมากมาย ลวนผูกติดกับเนเธอรแลนด ไมทางตรงก็ทางออม เพื่อใหสาธารณรัฐของเราเปนอิสระอยางแทจริง เราตองจัดตั้งสถาบันแหงชาติของเราเองเพื่อรับชวงทรัพยสินในอินโดนีเซียจากบริษัทเหลานี้"

  # <Vice Presidential Edict - Intro>
  INS_restore_order: "ฟนฟูความสงบเรียบรอย"
  INS_restore_order_desc: "ประเทศของเรายิ่งไรเสถียรภาพมากขึ้นทุกวัน หากเราไมตอบสนองโดยเร็ว สงครามกลางเมืองแทบจะหลีกเลี่ยงไมได เราตองเริ่มการเจรจาระหวางคณะกรรมการแหงชาติ ประธานาธิบดี และผูนํากองกําลังอาสาเพื่อหาทางออก"
  INS_vice_presidential_edict: "ลงนามในประกาศรองประธานาธิบดีฉบับที่ X"
  INS_vice_presidential_edict_desc: "คณะกรรมการแหงชาติแทบเปนเอกฉันทในการเรียกรองอํานาจนิติบัญญัติที่แทจริง มีการยื่นคํารองตอประธานาธิบดีเสนอระบบผสม ซึ่งคณะกรรมการแหงชาติจะกลายเปนรัฐสภาอิสระ ใชอํานาจนิติบัญญัติรวมกับประธานาธิบดี ขอเสนอนี้นาสนใจ แตก็มีความเสี่ยงที่อํานาจของประธานาธิบดีจะเหลือเพียงนอยนิด"
  INS_local_cooperatives: "จัดตั้งสหกรณทองถิ่น"
  INS_local_cooperatives_desc: "เราไมควรสรางระบบทุนนิยมแบบตะวันตก แตก็ไมควรมองขามประโยชนทางเศรษฐกิจที่การแปรรูปใหเอกชนมอบให เราจะอนุญาตใหจัดตั้งสหกรณทองถิ่น ซึ่งความสําเร็จจะนําความมั่งคั่งมาสูเจาของ อยางไรก็ตาม สหกรณจะอยูภายใตการกํากับของรัฐบาล และหามขยายกิจการออกนอกทองถิ่นของตน"
  INS_local_unity: "อํานาจปกครองตนเองบางสวนแกรัฐเจาผูครอง"
  INS_local_unity_desc: "เราจะมอบอํานาจปกครองตนเองบางสวนแกรัฐเจาผูครอง เปนมาตรการชั่วคราวเพื่อลดการตอสูภายในในชวงเวลาที่วุนวายอยูแลวเชนนี้"
  INS_education_subsidies: "เงินอุดหนุนการศึกษา"
  INS_education_subsidies_desc: "การลงทุนในอนาคตของเยาวชนของชาติเปนสิ่งจําเปนอยางยิ่ง หากเราตองการเปนรัฐที่ประสบความสําเร็จทางเศรษฐกิจ เราจะสรางโรงเรียนที่คาใชจายไมแพงทั่วสาธารณรัฐ"
  INS_land_reform: "ปฏิรูปที่ดิน"
  INS_land_reform_desc: "เนเธอรแลนดถือครองที่ดินจํานวนมากโดยตรงกอนที่เราจะประกาศเอกราช เราควรกระจายที่ดินนี้ในราคาตํ่าใหชาวอินโดนีเซียทุกคนที่จะใชประโยชนจากมัน เพื่อสงเสริมการเติบโตทางเศรษฐกิจ"
  INS_dominion_of_atjeh: "ดินแดนปกครองตนเองอาเจะห"
  INS_dominion_of_atjeh_desc: "ขบวนการแบงแยกดินแดนในอาเจะหมีขนาดใหญและกําลังเติบโต ไมมีเหตุผลที่จะทําใหสถานการณบานปลาย เราควรเจรจาประนีประนอมใหพวกเขายังคงเปนสวนหนึ่งของอินโดนีเซีย ขณะที่มีอํานาจปกครองตนเองเปนสวนใหญ"

  # <Vice Presidential Edict - Presidential Balance>
  INS_dissolve_national_party: "ยุบพรรคแหงชาติ"
  INS_dissolve_national_party_desc: "ระบบผสมถูกสรางขึ้นเปนการประนีประนอมที่จําเปนเพื่อหลีกเลี่ยงความโกลาหล เราไมควรปลอยใหประธานาธิบดีกุมอํานาจมากขนาดนี้อยางไมเปนประชาธิปไตย ประธานาธิบดีตองถูกรัฐสภาถอดถอน มิฉะนั้นเราจะไมมีวันบรรลุประชาธิปไตย"
  INS_womens_sufferage: "สิทธิเลือกตั้งของสตรี"
  INS_womens_sufferage_desc: "การใหสิทธิเลือกตั้งแกสตรีจะนําไปสูความไมมีเสถียรภาพในระยะสั้น แตจําเปนตอเสถียรภาพและประชาธิปไตยในระยะยาว"
  INS_women_in_military: "สตรีในกองทัพ"
  INS_women_in_military_desc: "การอนุญาตใหสตรีรับราชการทหารเปนสิ่งจําเปนเพื่อใหกองทัพของเราแข็งแกรงที่สุดเทาที่จะเปนไปได"
  INS_fair_election: "การเลือกตั้งที่เปนธรรม"
  INS_fair_election_desc: "เมื่อประธานาธิบดีถูกถอดถอนและการปฏิวัติสิ้นสุดลง ในที่สุดเราก็สามารถจัดการเลือกตั้งที่เปนธรรมอยางแทจริงครั้งแรกได โดยปราศจากอิทธิพลเผด็จการ"

  # < Hybrid Politics >
  INS_continue_hybrid_politics: "ดําเนินการเมืองแบบผสมตอไป"
  INS_continue_hybrid_politics_desc: "การเมืองแบบผสมเปนความชั่วรายที่จําเปน แมเปาหมายสุดทายคือประชาธิปไตยที่แทจริง แตอินโดนีเซียยังเยาววัยและไรเสถียรภาพเกินกวาจะมอบอํานาจทั้งหมดใหประชาชน ประธานาธิบดีและรัฐสภาจะคอยถวงดุลกันและกัน เพื่อไมใหฝายใดมีอํานาจมากเกินไป"
  INS_guided_economy: "เศรษฐกิจชี้นํา"
  INS_guided_economy_desc: "เราจะกํากับเศรษฐกิจของอินโดนีเซียโดยตรงเพื่อใหมั่นใจวาเรายังคุมอํานาจไวได เราจะโอนธนาคารทั้งหมด รวมถึงภาคนํ้ามันและภาคเกษตรเปนของรัฐ"
  INS_reform_education_system: "การศึกษาอุดมการณภาคบังคับ"
  INS_reform_education_system_desc: "การปฏิวัติพิสูจนแลววานักศึกษาและเยาวชนที่ไมพอใจระเบียบสังคมจะเปนผูนําการกบฏเสมอ เพื่อความปลอดภัยของรัฐบาลและประเทศชาติ เราจะกําหนดใหโรงเรียนสอนตามอุดมการณของรัฐบาล"
  INS_reform_education_system_2: "ปฏิรูปการศึกษา"
  INS_reform_education_system_2_desc: "หากเราตองการใหอินโดนีเซียเปนชาติที่มั่งคั่งในอนาคต ชาวอินโดนีเซียทุกคนไมวาเกิดที่ใดตองมีสิทธิไดรับการศึกษา"
  INS_three_year_plan: "แผนสามป"
  INS_three_year_plan_desc: "เราสามารถจัดทําแผนสามปเพื่อสรางโครงสรางพื้นฐานทั่วหมูเกาะและเชื่อมโยงเกาะตาง ๆ เขาดวยกัน"

  INS_destroy_pacific_colonialism: "ทําลายลัทธิอาณานิคมในแปซิฟก"
  INS_destroy_pacific_colonialism_desc: "การปฏิวัติอาจสิ้นสุดลงแลว แตยังมีการตอสูที่ตองทําอยู ยังมีผูคนมากมายที่อยูใตการกดขี่ของเจาอาณานิคมใกลประตูบานเรา เราไมอาจนั่งดูอยูเฉย ๆ เราตองลงมือปลดปลอยพวกเขาจากเจาอาณานิคม!"
  INS_rapid_mobilization: "การระดมพลอยางรวดเร็ว"
  INS_rapid_mobilization_desc: "ชาติที่แข็งแกรงยอมมีกองทัพที่แข็งแกรงเปนที่พึ่ง หากเราตองการเปนมหาอํานาจระดับภูมิภาคที่ยืนหยัดไดดวยตนเอง เราตองเริ่มจากการทําใหกองทัพแข็งแกรงกวาทุกวันนี้อยางมาก"
  INS_greater_indonesia: "ประกาศมหาอินโดนีเซีย"
  INS_greater_indonesia_desc: "จักรวรรดินูซันตาราโบราณเคยรวมโลกมลายูเปนหนึ่งเดียว เปนประชาชนเดียวกัน เมื่อเราไดปลดปลอยมลายาจากการกดขี่ของเจาอาณานิคมแลว เราควรทําเชนเดียวกับบรรพบุรุษแหงนูซันตารา ประกาศใหโลกมลายูทั้งหมดเปนชาติเดียวที่เปนเอกภาพ"

  # < State Religion >
  INS_secularism: "ฆราวาสนิยม"
  INS_secularism_desc: "อินโดนีเซียเปนบานของผูคนมากมายหลากหลายศาสนา การผสมศาสนาเขากับการเมืองจะกอใหเกิดแตการตอสูภายใน ดังนั้นเราควรหามพรรคการเมืองที่ยึดโยงกับศาสนา"
  INS_integrate_sarekat_islam: "ผนวกรวมซาเรกัตอิสลาม"
  INS_integrate_sarekat_islam_desc: "พรรคการเมืองอิสลามขนาดใหญไดรับการสนับสนุนจากประชาชนอยางมาก เปนประโยชนสูงสุดตอเราที่จะผนวกพวกเขาเขาสูรัฐบาล"

  # <Vice Presidential Edict - Sjahrir>
  INS_sjahrirs_continued_tenure: "ชาหรีรดํารงตําแหนงตอ"
  INS_sjahrirs_continued_tenure_desc: "นายกรัฐมนตรีชาหรีรพิสูจนแลววาเปนผูนําที่ยอดเยี่ยม นําพาเราผานการปฏิวัติ พัฒนาเศรษฐกิจ และสถาปนาประชาธิปไตย เราควรเลือกเขาเปนนายกรัฐมนตรีอีกสมัย"
  INS_unity_in_diversity: "เอกภาพในความหลากหลาย"
  INS_unity_in_diversity_desc: "ตลอดหลายศตวรรษ ถอยคําวาเอกภาพในความหลากหลายไดสะทอนจิตวิญญาณแหงหมูเกาะของเรา ระหวางการปฏิวัติ แนวคิดนี้กลายเปนเสียงเรียกรวมพล เตือนใจชาวอินโดนีเซียวาแมเราจะพูดหลายภาษาและยึดถือขนบธรรมเนียมแตกตางกัน แตเรายืนหยัดรวมกันในฐานะประชาชนหนึ่งเดียว เราควรบรรจุวลีนี้ไวในรัฐธรรมนูญ เพื่อใหเอกภาพของเราคงอยูไปอีกหลายชั่วรุน"

  INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
  INS_timor_issue_scripted_name_issue: "ปญหาติมอร"
  INS_timor_issue_scripted_name_attack: "โจมตีติมอรตะวันออก"
  INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
  INS_timor_issue_scripted_desc_issue: "ติมอรตะวันออกเปนดินแดนอันชอบธรรมของอินโดนีเซียอยางชัดเจน และแมการปฏิวัติจะสิ้นสุดลงแลว แตที่นั่นก็ยังอยูใตการปกครองอาณานิคม เราจะสงคําขาดถึง [721.OWNER.GetName] เรียกรองใหโอนติมอรตะวันออกมาโดยทันที"
  INS_timor_issue_scripted_desc_attack: "ติมอรตะวันออกเปนดินแดนอันชอบธรรมของอินโดนีเซียอยางชัดเจน กลุมกบฏบนเกาะอาจอางเอกราช แตพวกเขาไมไดเปนตัวแทนของประชากรทั้งหมดอยางแนนอน เศษซากของลัทธิอาณานิคมโปรตุเกสตองถูกผนวกรวมเขากับสาธารณรัฐ"

  INS_pledge_to_allies: "ใหคํามั่นตอฝายสัมพันธมิตร"
  INS_pledge_to_allies_desc: "เราเสี่ยงที่จะถูกรุกรานในฐานะสวนหนึ่งของความขัดแยงที่ขยายตัวไปทั่วโลก แมความสัมพันธของเรากับฝายสัมพันธมิตรจะไมมั่นคงนัก แตเราไดสถาปนาตนเปนมหาอํานาจประชาธิปไตยในแปซิฟกแลว และควรเขาขางมหาอํานาจประชาธิปไตยรายใหญ"
  INS_mixed_economy_system: "ระบบเศรษฐกิจแบบผสม"
  INS_mixed_economy_system_desc: "อินโดนีเซียเปนประเทศที่มีเอกลักษณ และจะไมรุงเรืองภายใตทุนนิยมหรือคอมมิวนิสตแบบดั้งเดิม เราควรจัดตั้งระบบเศรษฐกิจแบบผสม ที่มีองคประกอบของทั้งทุนนิยมและคอมมิวนิสต"
  INS_social_democracy: "สังคมประชาธิปไตย"
  INS_social_democracy_desc: "เศรษฐกิจ[INS.GetAdjective]เติบโตอยางมหาศาลนับตั้งแตนํานโยบายเศรษฐกิจของชาหรีรมาใช เราควรประกาศใหอินโดนีเซียเปนรัฐสังคมประชาธิปไตยเต็มรูปแบบ และพัฒนานโยบายเศรษฐกิจในอนาคตตามหลักการสังคมประชาธิปไตย"

  # <Vice Presidential Edict - Sjarifuddin>
  INS_prime_minister_sjarifuddin: "นายกรัฐมนตรีชารีฟุดดิน"
  INS_prime_minister_sjarifuddin_desc: "ชารีฟุดดินคือผูสมัครที่ดีที่สุดสําหรับอินโดนีเซีย นโยบายสายกลางของเขาเปดทางใหเกิดการประนีประนอมระหวางฝายคอมมิวนิสตกับฝายสังคมนิยม"
  INS_concessions_to_communists: "ยอมผอนปรนใหฝายคอมมิวนิสต"
  INS_concessions_to_communists_desc: "PKI มีที่นั่งในรัฐสภาเปนจํานวนมาก เราควรมอบตําแหนงรัฐมนตรีบางตําแหนงใหผูนํา PKI เพื่อรักษาเสถียรภาพ"
  INS_sjarifuddin_focus_2: "เศรษฐกิจสงออกที่บริหารเอง"
  INS_sjarifuddin_focus_2_desc: "ดวยเอกราชที่เพิ่งไดมา เราควรทบทวนระบบเศรษฐกิจสงออกและจัดระบบใหมใหไมตองคํานึงถึงผลกําไรของดัตชอีกตอไป แมเศรษฐกิจที่พึ่งพาการสงออกจะยังมีความเสี่ยง แตเราสามารถทําใหมันนาเชื่อถือกวาในปกอน ๆ ไดมาก"

  # <Vice Presidential Edict - Hatta>
  INS_prime_minister_hatta: "นายกรัฐมนตรีฮัตตา"
  INS_prime_minister_hatta_desc: "โมฮัมหมัด ฮัตตา ผูไดรับการขนานนามวาเปนผูประกาศการปฏิวัติ เคยดํารงตําแหนงรองประธานาธิบดีของซูการโน และโดยทั่วไปเปนผูที่โนมเอียงไปทางประชาธิปไตยมากกวาในสองคนนี้ เขาจะเปนนายกรัฐมนตรีที่เหมาะสมซึ่งพรรคการเมืองสวนใหญยอมรับรวมกันได"
  INS_hatta_focus_2: "กาวตอไป"
  INS_hatta_focus_2_desc: "การปฏิวัติสิ้นสุดลงแลว และแมบุคคลทางการเมืองบางคนจะยืนกรานวาการปฏิวัติตองดําเนินตอ เสียงเหลานี้ควรถูกเพิกเฉย เราควรมองไปขางหนาแทน เราตองสรางอินโดนีเซียใหคนรุนตอไปไดอยูอยางรุงเรือง"
  INS_hatta_princely_advisors: "ผนวกรวมรัฐเจาผูครอง"
  INS_hatta_princely_advisors_desc: "เราพบเอกภาพผานความหลากหลายที่มีรวมกัน เราไดสรางชาติบนหลักการนี้ แตการสิ้นสุดของการปฏิวัติไดสรางแรงกดดันตอแนวคิดนี้ เพราะขาดการตอสูรวมกัน เพื่อปองกันความขุนเคืองและการลุกฮือของชนกลุมนอย เราควรจัดตั้งสภาเพิ่มเติมที่ผูปกครองทองถิ่นจากรัฐเจาผูครองมีสิทธิ์มีเสียงโดยตรงในการเมืองระดับชาติ"
  INS_prime_minister_tt: "การเลือกตั้งทั่วไปครั้งแรกของอินโดนีเซียไดจัดขึ้นแลว"

  # < Guided Democracy >
  INS_guided_democracy: "ประกาศกฎอัยการศึก"
  INS_guided_democracy_desc: "บัดนี้เปนที่ชัดเจนแลววาการแบงอํานาจผานการจัดตั้งคณะกรรมการแหงชาติเปนความผิดพลาด และนํามาซึ่งความไรเสถียรภาพเทานั้น เราตองไมปลอยใหเปนเชนนี้ตอไป เวนแตเราตองการสงครามกลางเมืองอีกครั้ง เราตองประกาศกฎอัยการศึกและเขาควบคุมคณะกรรมการชั่วคราวจนกวาความสงบเรียบรอยจะกลับคืนมา"
  INS_centralization: "การรวมศูนยอํานาจ"
  INS_centralization_desc: "อํานาจจะรวมศูนยอยูที่ชวา โดยเกาะอื่น ๆ มีอํานาจปกครองตนเองอยางจํากัด การตัดสินใจทุกอยางตองผานชวาเพื่อรักษาความสงบเรียบรอยและเสถียรภาพ ประธานาธิบดีจะเปนผูกํากับดูแลประชาธิปไตย"
  INS_abolish_national_committee: "ยกเลิกคณะกรรมการแหงชาติ"
  INS_abolish_national_committee_desc: "คณะกรรมการแหงชาติจะถูกยกเลิกและแทนที่ดวยคณะกรรมการทํางานที่อยูภายใตประธานาธิบดี ประธานาธิบดีจะดํารงตําแหนงตลอดชีพเพื่อรักษาความสงบเรียบรอย คณะกรรมการทํางานจะไดรับอํานาจเพิ่มขึ้นทีละนอย แทนที่จะไดรับทั้งหมดในคราวเดียว"
  INS_abolish_national_committee_tt: "การสนับสนุน §Y[ROOT.GetNeutralParty]§! จะถูกตั้งเปน §Y100%§!"
  INS_pancasila_achieved: "บรรลุปญจศีล"
  INS_pancasila_achieved_desc: "เมื่อเรากอตั้งประเทศนี้ เราไดวางรากฐานไวบนหลักหาประการแหงปญจศีล ไดแก ความเชื่อในพระเจาองคเดียว มนุษยธรรมที่ยุติธรรมและมีอารยะ เอกภาพของอินโดนีเซีย ประชาธิปไตยที่นําโดยปญญา และความยุติธรรมทางสังคมสําหรับประชาชนอินโดนีเซียทุกคน แมเราจะไมไดดําเนินการตามหลักการเหลานี้สําเร็จเสมอไป แตในที่สุดเราก็บรรลุเอกภาพตามที่หลักการดั้งเดิมวาดไว และสามารถเริ่มตนขั้นตอไปแหงความรุงเรืองของสาธารณรัฐไดอยางเปนทางการ"
  INS_the_co_prosperity_sphere: "วงไพบูลยรวมกัน"
  INS_the_co_prosperity_sphere_tt: "ปลดล็อกการตัดสินใจ §Y$INS_request_membership$§! และการตัดสินใจ §Y$INS_assume_complete_power$§! เพื่อพลิกประเทศใหเปน§Y$INS_sukarno$ ฟาสซิสต§!"
  INS_the_co_prosperity_sphere_desc: "แมจะมีการตอตานอยางมากตอการรวมมือกับญี่ปุน แตในยามที่ไรเสถียรภาพเชนนี้ การผนึกกําลังกับมหาอํานาจที่แข็งแกรงกวาเพื่อยืนหยัดตานฝายสัมพันธมิตรตะวันตกเปนประโยชนสูงสุดตอเรา"
  INS_strengthen_ins_jap_trade: "เสริมการคา[ROOT.GetAdjective]-[JAP.GetAdjective]"
  INS_strengthen_ins_jap_trade_desc: "เราควรพัฒนาความสัมพันธทางการคาระหวางเรากับพันธมิตรใหม หากเราขายทรัพยากรสวนเกินในราคาตํ่าลงอยางมาก เราจะพิสูจนคุณคาของเราและไดอํานาจตอรองเพิ่มเติมหลังสงคราม"
  INS_seek_recognition_of_mal_claims: "ขอการรับรองการอางสิทธิ์มลายูของเรา"
  INS_seek_recognition_of_mal_claims_desc: "มลายาและบอรเนียวเหนือมีตนกําเนิดเดียวกับเรา ถูกแบงแยกเพียงดวยเสนพรมแดนอาณานิคมบาง ๆ เราควรขอให [JAP.GetNameDef] รับรองสิทธิ์ของเราในดินแดนนี้ และสัญญาวาจะมอบใหเราเมื่อเราเอาชนะอังกฤษไดแลว"
  INS_demand_northern_malay: "เรียกรองมลายูตอนเหนือ"
  INS_demand_northern_malay_desc: "มลายูตอนเหนือทุกวันนี้เปนของสยาม แมผูคนจะเปนชาวมลายูโดยเชื้อชาติ เราจะไมยอมใหสิ่งที่เรียกวา “พันธมิตร” ยึดครองดินแดนของเรา เราตองเรียกรองใหญี่ปุนเขาแทรกแซง"
  INS_siam_agreement: "ความตกลงสยาม"
  INS_siam_agreement_desc: "สยามเปนชาติที่ออนแอ ไมอาจยืนหยัดปกปองตนเองได เราไดพิสูจนคุณคาของเราตอญี่ปุนแลว และพวกเขาก็ยอมออนขอตอแรงกดดันเรื่อยมา ไมตองสงสัยเลยวาทุกฝายจะดีขึ้นหากสยามกลายเปนรัฐหุนเชิดของอินโดนีเซีย"
  INS_local_autonomy: "อํานาจปกครองตนเองทองถิ่น"
  INS_local_autonomy_industry_tt: "§Rนํา§!โรงงานพลเรือน §Y1§! แหงออกจาก §Y[1051.GetName]§!, §Y[335.GetName]§! และ §Y[1058.GetName]§!\n§Gเพิ่ม§!โรงงานพลเรือน §Y1§! แหงใหกับ§Yรัฐที่ครอบครองแบบสุม 4 รัฐ§!"
  INS_local_autonomy_desc: "หมูเกาะมากมายที่ประกอบกันเปนอินโดนีเซียมีวัฒนธรรม ภาษา และความตองการแตกตางกัน เปนเรื่องไมสมเหตุสมผลที่จะคิดวารัฐบาลเดียวจะดูแลไดทั้งหมดอยางประสบความสําเร็จ เราจะเริ่มปฏิรูปอินโดนีเซียใหเปนสหพันธรัฐ ที่แตละจังหวัดมีอํานาจปกครองตนเองในระดับสูง"
  INS_union_of_ins_states: "สหภาพจังหวัด[ROOT.GetAdjective]"
  INS_union_of_ins_states_desc: "เราควรใหจังหวัดตาง ๆ มีอํานาจปกครองตนเองมากยิ่งขึ้น ลดบทบาทของรัฐบาลกลางใหเหลือเพียงกิจการระหวางจังหวัดและกิจการตางประเทศเปนหลัก เราจะเลือกประธานาธิบดีแหงสหพันธคนใหมตามความตองการของจังหวัดตาง ๆ ผูปกครองทองถิ่นจะมีอิสระในการวางโครงสรางผูนําของตนตามที่เลือก"
  INS_union_of_ins_states_tt: "\nปลดปลอย §Y[ATJ.GetName]§!, §Y[BLI.Getname]§!, §Y[SSI.GetName]§!, §Y[TNE.GetName]§!, §Y[POK.GetName]§! และ §Y[GOW.GetName]§! ใหเปน §Y$autonomy_taog_indonesian_union_state$s§!"
  INS_indonesian_inter_province_trade_agreement: "ขอตกลงการคาระหวางจังหวัด[ROOT.GetAdjective]"
  INS_indonesian_inter_province_trade_agreement_tt: "ทุกประเทศ§Yอินโดนีเซีย§!ไดรับ:"
  INS_indonesian_inter_province_trade_agreement_desc: "การคาระหวางจังหวัดตองรวดเร็วและราคาถูก เราจะทําใหการซื้อขายกับจังหวัดอื่นคุมคากวาการซื้อขายกับประเทศอื่นเกือบทุกครั้ง ดวยการลดภาษีการคาลงอยางมาก และสรางโครงสรางพื้นฐานระหวางจังหวัดใหม"
  INS_expanding_the_union: "ขยายสหภาพ"
  INS_expanding_the_union_desc: "ประชาชนในบอรเนียวเหนืออยูใตการกดขี่มานานเกินไปแลว เราจะใชสงครามกองโจรบีบใหอังกฤษถอนตัว เพื่อใหบรูไน ซาบาห และรัฐราชาซาราวักกลายเปนจังหวัดของอินโดนีเซีย"
  INS_expanding_the_union_tt: "ปลดล็อกการตัดสินใจเพื่อเริ่ม§Yสงครามจํากัด§!สําหรับรัฐใดก็ตามบน§Yเกาะบอรเนียว§!ที่เรายังไมไดควบคุม"
  INS_dismantle_indonesia: "รื้อถอน [ROOT.GetName]"
  INS_dismantle_indonesia_tt: "§Yยุบสหพันธรัฐ§! และเลือกรัฐที่จะปกครอง จังหวัดที่เหลือจะไดรับอิสรภาพ"
  INS_dismantle_indonesia_desc: "เราไดลองรูปแบบการปกครองมาหลายแบบ และทุกแบบลวนจบลงดวยความไรเสถียรภาพ การปฏิวัติสิ้นสุดลงแลว และเจาอาณานิคมดัตชก็พายแพไปแลว เราไมจําเปนตองยืนหยัดรวมกันเปนแนวรวมเดียวอีกตอไป เราจะยุบสหพันธรัฐทั้งหมด ใหสุลตานทองถิ่นมีอิสระเต็มที่ในการกอตั้งประเทศเอกราชของตนเอง"
  INS_all_toward_the_war_effort: "ทุกสิ่งเพื่อการสงคราม"
  INS_all_toward_the_war_effort_desc: "แนวรบมลายูและ[AST.GetAdjective]ที่เรานําอยูจะกําหนดผลลัพธของเอกภาพมลายูไปอีกหลายป เราไมอาจเก็บทรัพยากรใดไวได ทุกสิ่งตองมอบใหแกทหารผูกลาที่ตอสูเพื่ออิสรภาพของมลายู"
  INS_enact_militarism: "ประกาศลัทธิทหารนิยม"
  INS_enact_militarism_desc: "เราควรเรียนรูบทเรียนบางประการจาก [JAP.GetNameDefCap] และนโยบายทหารนิยมของพวกเขา การนําหลักการคลายกันมาใชจะเปนประโยชนตอรัฐบาลใหมของเรา"
  INS_sukarnos_industrialization: "เสริมพลังอุตสาหกรรมชวา"
  INS_sukarnos_industrialization_desc: "อุตสาหกรรมของชวาเปนกระดูกสันหลังของเศรษฐกิจและกองทัพของเรา ทุกเสนทางตองมุงสูโรม"
  INS_sukarnos_industrialization2: "ทุกคนตองทําหนาที่ของตน"
  INS_sukarnos_industrialization2_desc: "การสงครามคือลําดับความสําคัญอันดับหนึ่งของชาตินี้ ดังนั้นจึงเปนหนาที่อันดับหนึ่งของชาวอินโดนีเซียทุกคนที่จะมีสวนรวม ความฟุมเฟอยคือศัตรู กลไกอุตสาหกรรมทางทหารตองเติบโต"
  INS_japanese_military_lessons: "บทเรียนทางทหารจากญี่ปุน"
  INS_japanese_military_lessons_desc: "เราควรศึกษาหลักนิยมทางทหารของญี่ปุนและปรับกองทัพของเราใหสอดคลอง"

  # < Support Tan Malaka's Coup>
  INS_support_tan_malakas_coup: "สนับสนุนรัฐประหารของตัน มาลากา"
  INS_support_tan_malakas_coup_desc: "ซูการโนประกาศเอกราชของเรา แตเขาไดพิสูจนแลววาเปนคนครึ่ง ๆ กลาง ๆ ที่ชอบผอนปรนทางการทูต ตัน มาลากา และเปอรซาตวน เปอรจวงงัน ของเขาเรียกรองสิ่งที่ประชาชนเรียกรอง คือเอกราชรอยเปอรเซ็นต ไมมีการเจรจา ไมมีการประนีประนอม หากซูการโนไมยอมสูเพื่อการปฏิวัติอยางเต็มที่ การปฏิวัติก็ตองหาผูนําที่จะสู"
  INS_minimum_program: "โครงการขั้นตํ่า"
  INS_minimum_program_desc: "เปอรซาตวน เปอรจวงงัน ไดวางขอเรียกรองไวแลว ไดแก รัฐบาลของประชาชน กองทัพของประชาชน และการโอนสวนเกษตรกับอุตสาหกรรมที่ตางชาติเปนเจาของทั้งหมดเปนของรัฐ เราตองการบุคคลที่มีความสามารถมาผลักดันโครงการนี้ นโยโนพูดแทนกรรมกร เซตยาจิตพูดแทนปญญาชนของพรรค ทั้งสองจะรวมกันทําใหการปฏิวัติถูกจัดระเบียบตั้งแตพื้นโรงงานไปจนถึงหองโถงรัฐบาล"
  INS_agrarian_reform: "ปฏิรูปที่ดินเกษตรกรรม"
  INS_agrarian_reform_desc: "ตลอดสามศตวรรษ ผืนดินอินโดนีเซียไดหลอเลี้ยงสวนเกษตรของคนแปลกหนา ชาวนาผูทํางานบนผืนดินแทบไมรูจักสิ่งอื่นใด การปฏิวัติที่ปลอยใหสิ่งนี้เปนอยูอยางเดิมไมใชการปฏิวัติเลย เราจะทําใหที่ดินตกเปนของผูที่ไถหวานมัน"
  INS_soviet_aid: "ความชวยเหลือจากโซเวียต"
  INS_soviet_aid_desc: "สหภาพโซเวียตไดรับรองการปฏิวัติของเราและพรอมสนับสนุนเสบียง ไมวาแนวทางของเราจะแตกตางจากมอสโกเพียงใด เราก็ไมอาจปฏิเสธสิ่งที่เสนอมาได เราควรรับอาวุธและเดินหนาตอไป"
  INS_pacific_revolution: "การปฏิวัติแปซิฟก"
  INS_pacific_revolution_desc: "มหาอํานาจอาณานิคมไมไดถอยออกจากเอเชีย ถอยเพียงจากอินโดนีเซียเทานั้น ระเบียบเกายังคงอยูในที่ตาง ๆ เชนมลายาและฟลิปปนส และในแตละแหงก็มีชายหญิงที่ปรารถนาจะโคนลมมัน การปฏิวัติของเราทําใหเรามีทั้งสถานะและพันธะที่จะชวยเหลือพวกเขา เราตองทํา"
  INS_purge_oppurtunists_tt: "ปลดล็อก §Y$INS_launch_revolution$§! ในประเทศที่มีการสนับสนุนคอมมิวนิสต §Y60%§! ขึ้นไป ประเทศที่เราปลุกปนใหเกิดการปฏิวัติจะกลายเปน§Yรัฐหุนเชิด§!ของเรา"
  INS_purge_oppurtunists: "กวาดลางพวกฉวยโอกาส"
  INS_purge_oppurtunists_desc: "มุสโซใชเวลายี่สิบปในมอสโกเรียนรูการรับคําสั่ง เขากลับมาพรอมคําสั่งของโซเวียตในกระเปา และแผนที่จะเปลี่ยนสาธารณรัฐของเราใหเปนหุนเชิดของโคมินเทิรน เราไมไดสลัดแอกดัตชออกไปเพียงเพื่อคุกเขาตอหนานายตางชาติคนใหม พวกฉวยโอกาสที่จะขายการปฏิวัติของเราใหมอสโกตองถูกถอนรากถอนโคน และประชาชนที่เราปลดปลอยจะมองมายังจาการตา ไมใชเครมลิน"
  INS_the_maphilindo_speech: "สุนทรพจนมาฟลินโด"
  INS_the_maphilindo_speech_desc: "หากชาวเบอตาวีกับชาวบันจารตางเปนชาวอินโดนีเซียได แมมีความแตกตางทางวัฒนธรรม ผานการตอสูรวมกันกับการกดขี่ ก็ไมมีเหตุผลใดที่ชาวมลายาและชาวฟลิปปนสจะไมเปนชาวอินโดนีเซียเชนกัน เราตองรวมดินแดนเหลานี้เปนรัฐเดียวที่เปนเอกภาพ!"
  INS_the_maphilindo_speech_tt: "อนุญาตใหทําดินแดนหลักและผนวกรัฐในอารักขา§Yมลายู§!"
  INS_pan_asian_union: "สหภาพพานเอเชีย"
  INS_pan_asian_union_desc: "การปฏิวัติแปซิฟกเพิ่งเริ่มตน และเรายังไมปลอดภัย เราตองยืนหยัดรวมกันและรวมมือกันปกปองกันและกันจากมหาอํานาจของโลก เมื่อรวมกันเราแข็งแกรง"
  INS_federation_of_aslia: "สหพันธรัฐอัสเลีย"
  INS_federation_of_aslia_trigger_tt: "ไดทําการตัดสินใจ §Y$form_maphilindo$§! สําเร็จแลว"
  INS_federation_of_aslia_desc: "ชาติที่เราปลดปลอยไมจําเปนตองยืนอยูอยางโดดเดี่ยว ตัน มาลากา ใฝฝนถึงสิ่งที่ยิ่งใหญกวาสาธารณรัฐเดียวมาโดยตลอด สหพันธรัฐที่ทอดยาวจากแผนดินใหญถึงแปซิฟก รวมพลังตอตานมหาอํานาจอาณานิคมใดก็ตามที่กลาหวนกลับมา เราจะเสนอสมาชิกภาพเต็มรูปแบบในรัฐของเราแกพวกเขา" 
  INS_aslia_tt: "อนุญาตใหทําดินแดนหลักและผนวกรัฐในอารักขา§Yแปซิฟก§!"
  INS_pan_economic_area: "เขตเศรษฐกิจพานเอเชีย"
  INS_pan_economic_area_desc: "ความรวมมือทางเศรษฐกิจภายในสหภาพเปนสิ่งจําเปนตอความรุงเรืองรวมกันของเรา เราตองเอื้อใหเกิดการคาปลอดภาษีระหวางรัฐสมาชิกทั้งหมด เพื่อลดการพึ่งพาชาติภายนอก"
  INS_pan_economic_area_tt: "สมาชิกฝายทั้งหมดที่เปนรัฐในอารักขาของ §Y[ROOT.GetNameDef]§!"
  INS_musso_ascends: "มุสโซขึ้นสูอํานาจ"
  INS_musso_ascends_tt: "ปลดล็อก §Y$INS_launch_revolution$§! ในประเทศที่มีการสนับสนุนคอมมิวนิสต §Y30%§! ขึ้นไป ประเทศที่เราปลุกปนใหเกิดการปฏิวัติจะยังคงเปนเอกราช"
  INS_musso_ascends_desc: "ตัน มาลากา เปนนักฝน มุสโซนําสิ่งที่นักฝนใหไมไดมาดวย นั่นคือการหนุนหลังเต็มที่จากสหภาพโซเวียตและความเปนปกแผนของขบวนการคอมมิวนิสตสากล การปฏิวัติของเราไมจําเปนตองยืนอยูอยางโดดเดี่ยว"
  INS_utilize_comintern_connections: "ใชเสนสายโคมินเทิรน"
  INS_utilize_comintern_connections_desc: "เสนสายของมุสโซกับเจาหนาที่ระดับสูงของโคมินเทิรนทําใหการเขารวมโคมินเทิรนเปนเรื่องงาย เราควรสงเขาไปยัง [SOV.GetNameDef] เพื่อเจรจาโดยไมชักชา"
  INS_united_against_japan: "รวมกันตอตาน [JAP.GetNameDef]"
  INS_united_against_japan_desc: "แมจะไมมีใครอยากเขาขางฝายสัมพันธมิตร และบาดแผลที่ดัตชทิ้งไวก็ยังไมถูกลืม แตเราตองวางความขัดแยงไวชั่วคราวเพื่อตอสูกับศัตรูรวม มิฉะนั้นเราเสี่ยงที่จะมีเจาอาณานิคมรายใหมมายึดครอง [ROOT.GetName]"
  INS_revolutionary_economic_cooperation: "ความรวมมือทางเศรษฐกิจของฝายปฏิวัติ"
  INS_revolutionary_economic_cooperation_desc: "เราไดชวยชีวิตผูคนนับลานที่ไมตองอยูใตการกดขี่อีกตอไป บัดนี้เราตองสรางรวมกัน ดวยความรวมมือและการคา เราจะสรางเศรษฐกิจและกองทัพที่แข็งแกรง ปกปองเราจากมหาอํานาจตางชาติไปอีกหลายป"
  INS_revolutionary_economic_cooperation_tt: "ไดรับ §Y$INS_revolutionary_economic_cooperation_modifier$§! ซึ่งมอบ:\nเสถียรภาพ §Y4%§! §Yตอประเทศ§!ที่เราได§Yกอการปฏิวัติ§!\nความเร็วการกอสราง §Y4%§! §Yตอประเทศ§!ที่เราได§Yกอการปฏิวัติ§!\nการไดรับอํานาจทางการเมือง §Y4%§! §Yตอประเทศ§!ที่เราได§Yกอการปฏิวัติ§!\nสินคาอุปโภคบริโภค §Y-4%§! §Yตอประเทศ§!ที่เราได§Yกอการปฏิวัติ§!\n\nขณะนี้เราไดกอการปฏิวัติแลวใน §Y[?INS_communist_revolts_succeeded]§! ประเทศ"
  INS_soviet_economic_integration: "การบูรณาการทางเศรษฐกิจกับโซเวียต"
  INS_soviet_economic_integration_desc: "การปฏิวัติไดมอบอิสรภาพแกเรา แตอิสรภาพเพียงอยางเดียวไมไดสรางโรงงานหรือเลี้ยงดูมวลชน สหภาพโซเวียตเสนอสิ่งที่ไมมีมหาอํานาจทุนนิยมใดจะให ทั้งความเชี่ยวชาญทางอุตสาหกรรม สินเชื่อเพื่อการพัฒนา และการคาในเงื่อนไขที่ไมมีพันธนาการแบบอาณานิคมพวงมาดวย เราคงโงเขลาหากปฏิเสธ"
  INS_the_three_year_plan: "แผนสามป"
  INS_the_three_year_plan_desc: "เราจะประกาศแผนสามปสําหรับเศรษฐกิจ ซึ่งจะชี้นําเราในระยะยาวและลดเวลาที่เสียไปกับระบบราชการ"
  INS_the_three_year_plan_tt: "§Yจิตวิญญาณแหงชาติ§!จะดีขึ้น §G1%§! ทุกเดือนจนกวาจะถึงศักยภาพเต็มที่ §Y26%§!"
  INS_realign_export_markets: "ปรับทิศตลาดสงออก"
  INS_realign_export_markets_desc: "เราตองเสริมสรางความสัมพันธทางการคาระดับโลก ลดการพึ่งพามหาอํานาจรายใหญเพียงไมกี่ราย และหันมาคาขายรายยอยจํานวนมากกับชาติและบริษัทขนาดเล็กแทน"
  INS_divert_javanese_education_funding_the_east: "โยกงบการศึกษาของชวาไปทางตะวันออก"
  INS_divert_javanese_education_funding_the_east_desc: "ไมตองสงสัยเลยวาอดีตเจาอาณานิคมลงทุนเฉพาะในการพัฒนาชวาและพื้นที่อุดมทรัพยากรของสุมาตรา ขณะที่ปลอยสวนที่เหลือของอาณานิคมใหเสื่อมโทรม เราสามารถแกไขความผิดนี้ไดดวยการนํางบประมาณการศึกษาบางสวนของชวาไปจัดสรรใหมเพื่อสรางโรงเรียนในภาคตะวันออก"
  INS_eastern_universities: "มหาวิทยาลัยภาคตะวันออก"
  INS_eastern_universities_desc: "การสรางมหาวิทยาลัยใหมในภาคตะวันออกจะทําใหพลเมืองเขาถึงการศึกษาระดับสูงไดมากขึ้น และจูงใจใหนักศึกษายายจากชวาไปเรียนในสถาบันที่หางไกล ลดชองวางทางวัฒนธรรมระหวางชวากับสวนที่เหลือของ [ROOT.GetName]"

  # <National Revolution - Reasserting Control>
  INSHOL_revolution_ongoing_tt: "การปฏิวัติอินโดนีเซียกําลังดําเนินอยู"

  INSHOL_reasserting_control: "ทวงคืนการควบคุมหมูเกาะอินเดียตะวันออก"
  INSHOL_reasserting_control_desc: "เราไมอาจยืนดูอยูเฉย ๆ ขณะที่พวกฉวยโอกาสเหลานี้พยายามทําลายสิ่งที่เราใชเวลาหลายศตวรรษสรางขึ้น พรอมกับทําลายโครงสรางพื้นฐานและปลุกปนเยาวชนใหหัวรุนแรง เราตองลงมือ!"
  INSHOL_request_british_support: "ขอการสนับสนุนจากอังกฤษ"
  INSHOL_request_british_support_desc: "[ENG.GetNameDefCap] ในฐานะมหาอํานาจอาณานิคมดวยกันนาจะเห็นใจสถานการณของเรา โดยเฉพาะเมื่อหากฝายปฏิวัติประสบความสําเร็จ อาจเกิดปรากฏการณโดมิโนในเอเชียตะวันออก เราควรขอความชวยเหลือทางเศรษฐกิจและการทหารจากพวกเขา"

  INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! จะประกาศเขาขางเราในความขัดแยงนี้อยางเปนทางการและใหความชวยเหลืออยางมาก หากสงครามจบลงดวยชัยชนะ §Y[ENG.GetNameDefCap]§! จะมีสิทธิ์ไดรับบอรเนียว"
  INS_eng_treaty_engside_tt: "เราจะเขาขาง §Y[HOL.GetNameDefCap]§! อยางเปนทางการในความขัดแยงหมูเกาะอินเดียตะวันออก หาก §Y[HOL.GetNameDefCap]§! ชนะ เราจะมีสิทธิ์ครอบครองบอรเนียว"
  INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! จะประกาศเขาขางเราในความขัดแยงนี้อยางเปนทางการและใหความชวยเหลืออยางมาก หากสงครามจบลงดวยชัยชนะ §Y[FRA.GetNameDefCap]§! จะมีสิทธิ์ไดรับสุมาตราตะวันออกเฉียงเหนือ"
  INS_fra_treaty_fraside_tt: "เราจะเขาขาง §Y[HOL.GetNameDefCap]§! อยางเปนทางการในความขัดแยงหมูเกาะอินเดียตะวันออก หาก §Y[HOL.GetNameDefCap]§! ชนะ เราจะมีสิทธิ์ครอบครองสุมาตราตะวันออกเฉียงเหนือ"

  INSHOL_franco_dutch_accord: "ความตกลงฝรั่งเศส-ดัตช"
  INSHOL_franco_dutch_accord_desc: "แมทหารของเราจะมียุทโธปกรณและการจัดระเบียบดีกวากองกําลังอาสาฝายสาธารณรัฐ แตจํานวนอันมหาศาลของพวกเขาไดพลิกสถานการณความขัดแยงใหเราเสียเปรียบ เพื่อใหไดชัยชนะ เราตองการการสนับสนุนจากภายนอกมากกวาที่ใครสวนใหญจะให ฝรั่งเศสอาจยอมเขาแทรกแซง หากเราเสนอดินแดนในหมูเกาะอินเดียตะวันออกใหเพื่อขยายอิทธิพลในแปซิฟก"
  INSHOL_london_batavia_accord: "ความตกลงลอนดอน-บาตาเวีย"
  INSHOL_london_batavia_accord_desc: "แมทหารของเราจะมียุทโธปกรณและการจัดระเบียบดีกวากองกําลังอาสาฝายสาธารณรัฐ แตจํานวนอันมหาศาลของพวกเขาไดพลิกสถานการณความขัดแยงใหเราเสียเปรียบ เพื่อใหไดชัยชนะ เราตองการการสนับสนุนจากภายนอกมากกวาที่ใครสวนใหญจะให [ENG.GetNameDefCap] อาจมีผลประโยชนเนื่องจากมีฐานอํานาจในมลายา บางทีพวกเขาอาจถูกโนมนาวไดหากเราเสนอบางสิ่งเปนการตอบแทน?"
  INSHOL_australian_divisions: "สงทหารราบออสเตรเลียไปชวา"
  INSHOL_australian_divisions_desc: "ตามความตกลงลอนดอน-บาตาเวีย อังกฤษตองสงกองพลเพิ่มเติมมายังหมูเกาะอินเดียตะวันออกผานออสเตรเลียเมื่อเรารองขอ เนื่องจากออสเตรเลียอยูใกลหมูเกาะ จึงเหมาะอยางยิ่งที่จะเปนที่ตั้งฐานทัพนอกหมูเกาะ"
  INSHOL_indian_divisions: "กองพลกองทัพบริติชอินเดีย"
  INSHOL_indian_divisions_desc: "แมอังกฤษนาจะไมเต็มใจสงทหารของตนเองมายังหมูเกาะอินเดียตะวันออก แตการโนมนาวใหสงกองพลอินเดียนั้นงายกวามาก โดยเฉพาะเพราะอยูใกลบาตาเวีย"
  INSHOL_undermine_the_militias: "บอนทําลายกองกําลังอาสา"
  INSHOL_undermine_the_militias_desc: "สื่อกําลังขยายความรายแรงของสถานการณเกินจริง กองกําลังอาสาเปนเพียงกลุมเยาวชนนอกคอกที่พยายามไขวควาสิ่งที่เอื้อมไมถึง เราไมจําเปนตองทุมทรัพยากรทั้งหมดเพื่อหยุดพวกเขา เราเพียงตองรักษาแนวไวและรอใหพวกเขาหมดแรง"
  INSHOL_flag_will_fly_again: "ธงจะโบกสะบัดอีกครั้ง"
  INSHOL_flag_will_fly_again_desc: "ธงดัตชโบกสะบัดในหมูเกาะอินเดียตะวันออกมาหลายศตวรรษ ไมมีทางที่เราจะยอมใหมันถูกลดลง หากการรักษาอาณานิคมอันเปนดั่งเพชรเม็ดงามบนมงกุฎตองสงรถถังและเครื่องบินทิ้งระเบิดเขาไป ก็จะสงไป!"
  INSHOL_flag_will_fly_again_tt: "§Yเมื่อการปฏิวัติสิ้นสุดลง จิตวิญญาณนี้จะถูกนําออกและการเปลี่ยนแปลงกฎจะถูกยอนกลับ§!"

  # <National Revolution - Escalation>
  INSHOL_mass_mobilization: "การระดมพลครั้งใหญ"
  INSHOL_mass_mobilization_desc: "เราไมอาจชนะความขัดแยงนี้และบดขยี้สาธารณรัฐไดหากไมมีกองทัพที่มียุทโธปกรณพรอม เราตองติดอาวุธใหหมูเกาะอินเดียตะวันออกอีกครั้ง และโยกงบประมาณจากภาคพลเรือนไปให KNIL"
  INSHOL_batavia_storm_operation: "บุกยึดบาตาเวีย"
  INSHOL_instigate_infighting: "ยุยงใหเกิดการตอสูภายในสาธารณรัฐ"
  INSHOL_ultimatum_to_republic: "คําขาดถึงสาธารณรัฐ"
  INSHOL_comite_rijkseenheid: "กอมีเต ไรกสเอนไฮด"
  INSHOL_comite_rijkseenheid_desc: "ธงกําลังถูกลดลงในหมูเกาะอินเดียตะวันออก แตผูคนกลับเพียงยืนดู เราไมอาจปลอยใหเปนเชนนี้ เราตองโนมนาวฝายบริหารหมูเกาะอินเดียตะวันออกวาชาวดัตชตองการใหหยุดยั้งการปฏิวัติ!"

  INSHOL_increase_esclation_placeholder: "การยกระดับความรุนแรงอยางรวดเร็ว"
  INSHOL_increase_esclation_placeholder_desc: "กองกําลังอาสาของเราไดยึดทาเรือ เมือง และศูนยอุตสาหกรรมสําคัญจํานวนมาก เราจะไมรอใหเนเธอรแลนดลงมือกอนอีกตอไป เราจะเปดการรุกทางทหารครั้งใหญเอง!"
  INS_take_batavia_explination_tt: "หากเรายึดครองชวาไดทั้งหมด เราจะทําลายรัฐบาลอาณานิคมจากภายในและ§Gชนะสงคราม§! อยางไรก็ตาม หากเราทําไมไดภายใน §Y730 วัน§! เราจะ§Rพินาศ§!"

  INSHOL_linggadjati_agreement: "การเจรจาขอตกลงหยุดยิง"
  INSHOL_linggadjati_agreement_desc: "การบุกชวาพิสูจนแลววายากลําบาก และฝายบริหารของเราก็เริ่มไรเสถียรภาพ เราตองถอยกลับมาตั้งรับ เพื่อไมใหเสี่ยงตอการลมสลายของสาธารณรัฐทั้งหมด เราควรเจรจาหยุดยิงในระดับทองถิ่นกับเนเธอรแลนด เพื่อใหเราจัดระเบียบกองกําลังใหมกอนจะหันกลับไปมุงที่ชวาอีกครั้ง"
  INSHOL_increase_esclation_placeholder_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเจรจาหยุดยิงในระดับทองถิ่น และ§Yเพิ่มเวลา§!ในการยึดครองชวา"

  # <National Revolution - Peace Negotiation>
  INSHOL_seek_foreign_help: "แสวงหาความชวยเหลือจากตางชาติ"
  INSHOL_seek_foreign_help_desc: "ไมใชความลับเลยวาการพยายามเอาชนะสงครามกับมหาอํานาจอาณานิคมที่มีอุตสาหกรรมแข็งแกรง ในฐานะชาติเกิดใหมที่ไมมีเศรษฐกิจมั่นคง เปนภารกิจที่แทบเปนไปไมได เราควรติดตอประเทศอื่น ๆ ที่สนับสนุนอุดมการณของเรา เพื่อดูวาพวกเขาเต็มใจชวยเหลือเราหรือไม"
  INSHOL_renville_agreement: "ขอตกลงเรนวิลล"
  INSHOL_renville_agreement_desc: "การรุกรานอยางไมเคยมีมากอนของเนเธอรแลนดไดดึงความสนใจของนานาชาติมาสูการปฏิวัติ แตเนเธอรแลนดก็ยังคงละเมิดขอตกลงหยุดยิงและยั่วยุใหเราตอบโต เราตองพยายามติดตอ [USA.GetNameDef] เพราะหากเราโนมนาวใหพวกเขายืนหยัดเพื่ออินโดนีเซียได เนเธอรแลนดจะไมมีทางเลือกนอกจากตองถอย"
  INSHOL_no_compromise: "ไมประนีประนอม ไมยอมจํานน"
  INSHOL_no_compromise_desc: "ความโลภของดัตชที่ทําใหพวกเขาลงทุนแทบจะเฉพาะในชวา โดยละเลยหมูเกาะทางตะวันออก ไดทําใหชวากลายเปนจุดออนรายแรงของอาณานิคมทั้งหมด นี่จะเปนจุดจบของพวกเขา!"
  INSHOL_end_to_bloodshed: "ทางออกสองรัฐ"
  INSHOL_end_to_bloodshed_desc: "ความขัดแยงนี้ยืดเยื้อมานานเกินไปแลว โดยแทบไมมีความคืบหนาทั้งสองฝาย มีแตชีวิตที่สูญเสียมากขึ้นทุกวัน ไมมีใครตองการใหเปนเชนนี้ตอไป ถึงเวลาแลวที่เราจะหารือกับผูนําดัตชบนโตะเจรจา"
  INSHOL_reorganize_colonies: "จัดระเบียบอาณานิคมใหม"

  INS_we_will_need_another_tt: "เนื่องจากเราควบคุมชวาทั้งหมดแลว เราจะตองควบคุมอีกหนึ่งรัฐเพิ่มเติมนอกเหนือจากชวา"

  # Industry Branch - New
  INS_centralize_the_state: "รวมศูนยอํานาจรัฐ"
  INS_centralize_the_state_desc: "จากสุมาตราถึงสุลาเวสี จากบอรเนียวถึงบังกา โครงการพัฒนาของเราไดนําถนน โรงงาน และสถาบันตาง ๆ ไปสูดินแดนที่ [1058.GetName] เคยปกครองเพียงในนาม ภูมิภาคเหลานี้ไมใชจังหวัดหางไกลอีกตอไป พวกมันคือ [INS.GetNameDefCap]"
  INS_centralize_the_state_1_tt: "รัฐที่เปนเงื่อนไขกอนหนาซึ่ง§Yเปนดินแดนหลัก§!:"
  INS_centralize_the_state_2_tt: "รัฐที่เปนเงื่อนไขกอนหนาซึ่ง§Yไมเปนดินแดนหลัก§!:"
  INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
  INS_fate_of_de_javasche_bank_scripted_name_colony: "ชะตากรรมของธนาคารยาวาสเชอ"
  INS_fate_of_de_javasche_bank_scripted_name_independent: "ชะตากรรมของธนาคารอินโดนีเซีย"
  INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
  INS_fate_of_de_javasche_bank_scripted_desc_colony: "กิลเดอรอินเดียตะวันออกดิ่งลงอยางหนักนับตั้งแตภาวะเศรษฐกิจตกตํ่า และธนาคารยาวาสเชอก็ขาดเครื่องมือที่จะหยุดยั้งการตกตํ่านี้ เราตองตัดสินใจวาจะรักษาเสถียรภาพคาเงินอยางไร กอนที่ความเชื่อมั่นของนักลงทุนที่ยังเหลืออยูจะระเหยหายไปจนหมด"
  INS_fate_of_de_javasche_bank_scripted_desc_independent: "เราไดรับมรดกเปนคาเงินที่อยูในภาวะวิกฤต กิลเดอรยุคอาณานิคมเดิมก็งอนแงนอยูแลว และการเปลี่ยนไปใชรูเปยหก็ไมไดชวยใหตลาดมั่นคงขึ้นเลย ธนาคารอินโดนีเซียตองการทิศทางที่ชัดเจนจากรัฐบาล มิฉะนั้นเศรษฐกิจอันออนเยาวของเราจะไดรับความเสียหาย"

  INS_finish_the_bauxite_project: "ทําโครงการบังกาใหเสร็จสิ้น"
  INS_finish_the_bauxite_project_desc: "เมื่อถนน ทาเรือ และทางรถไฟสายใหมเปดใชงานทั่วบังกา-เบลีตุงแลว คณะสํารวจรายงานวาพบแหลงทังสเตนและโครเมียมมากกวาที่คาดไวแตแรก หมูเกาะเหลานี้จะพิสูจนคุณคาเต็มที่ตอสาธารณรัฐในไมชา"
  INS_australian_contracts: "สัญญากับออสเตรเลีย"
  INS_australian_contracts_desc: "ปริมาณยางสํารองของเราเพิ่มขึ้นเกินความตองการภายในประเทศไปมาก ออสเตรเลียซึ่งหิวกระหายวัตถุดิบปอนอุตสาหกรรมของตนอยูเสมอ จึงเปนคูคาโดยธรรมชาติ การทําสัญญาระยะยาวกับบริษัทออสเตรเลียจะนํารายไดที่มั่นคงมาให และเสริมสถานะของเราในเศรษฐกิจระดับภูมิภาค"
  INS_coopereate_with_chinese_businessmen: "รวมมือกับนักธุรกิจชาวจีน"
  INS_coopereate_with_chinese_businessmen_desc: "ชนชั้นพอคาที่มั่งคั่งและมีเสนสายกวางขวางไดเอื้ออํานวยการคาทั่วหมูเกาะมาชานาน แทนที่จะกันเครือขายที่มั่นคงเหลานี้ออกไป เราควรรวมมือกับพวกเขา ทุนและความเชี่ยวชาญทางการคาของพวกเขาอาจมีคายิ่งในการดึงเศรษฐกิจของเราออกจากภาวะซบเซาในปจจุบัน"

  INS_oil_decisions_unlock_tt: "ปลดล็อกการตัดสินใจ §Y$INS_realign_supply_chains_cat$§! ใหมเพื่อขาย§Yนํ้ามัน§!"
  INS_negotiate_new_contracts_unlock_tt: "ปลดล็อกการตัดสินใจ §Y$INS_realign_supply_chains_cat$§! ใหม"
  INS_realign_supply_chains_explain_tt: "ปลดล็อกการตัดสินใจ §Y$INS_realign_supply_chains_cat$§! เพื่อขายทรัพยากรใหบริษัทเอกชนดวยสัญญาเชา 2 ป"

  INS_negotiate_new_contracts: "เจรจาสัญญาใหม"
  INS_negotiate_new_contracts_desc: "ชื่อเสียงที่เพิ่มขึ้นในฐานะผูจัดหาที่ไวใจไดไดเปดประตูที่เคยปดสําหรับเรา ผูซื้อรายใหมกําลังวนเวียนเขามา และเราควรรีบผูกพวกเขาไวดวยขอตกลงระยะยาวกอนที่คูแขงจะตัดราคาเรา"
  INS_all_in_on_rubber: "ทุมหมดหนาตักกับยาง"
  INS_all_in_on_rubber_desc: "ยางคือไพที่แข็งแกรงที่สุดของเรา และเราตั้งใจจะเลนไพใบนี้ พื้นที่สวนทุกตารางนิ้วที่มีจะถูกเปลี่ยนเปนสวนยาง และกลไกการสงออกของเราจะถูกจัดระบบใหมใหสงยางไดเร็วกวาและถูกกวาใครในภูมิภาค"
  INS_more_market_resources: "ขายสูภาวะเศรษฐกิจตกตํ่าครั้งใหญ"
  INS_more_market_resources_desc: "โลกอาจจมอยูในวิกฤตเศรษฐกิจ แตวิกฤตยอมใหกําเนิดโอกาสแกผูกลาพอจะความันไว ดวยการทุมสินคาเขาสูตลาดในราคาที่ไมมีคูแขงรายใดสูได เราจะทําใหมั่นใจวาเมื่อโลกฟนตัว สินคาอินโดนีเซียจะวางอยูบนทุกชั้นวางและในทุกโกดังแลว"

  # <Industry Branch - Trade Policy>
  INS_recovering_from_the_great_depression: "ฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ"
  INS_recovering_from_the_great_depression_desc: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญสงผลรายแรงตอ [INS.GetNameDef] ดวยเศรษฐกิจที่พึ่งพาการสงออกเปนหลัก นโยบายกีดกันการคาทั่วโลกจึงทําใหเรางอยเปลี้ย ขณะที่การคาโลกดูเหมือนพรอมจะเปดกวางอีกครั้ง เราตองแสวงหาตลาดใหม และฟนฟูเสนทางการคาเดิมของเรา"
  INS_first_come_first_serve: "มากอนไดกอน"
  INS_first_come_first_serve_desc: "แมนโยบายกีดกันการคาจากภาวะเศรษฐกิจตกตํ่าครั้งใหญจะเริ่มผอนคลายลง แตการผลิตที่เพิ่มขึ้นและคาเงินกิลเดอรที่สูงเกินจริงไดทําใหตลาดสงออกของดัตชยอยยับ เพราะคูคาเกาในตะวันตกหันไปพึ่งอเมริกาใตแทน แทนที่จะไลตามพวกเขาเพื่อทําขอตกลงการคาใหม เราอาจใชโอกาสนี้ขยายไปสูตลาดใหมในเอเชีย"
  INS_oil_export: "เพิ่มการสงออกนํ้ามัน"
  INS_oil_export_desc: "เราจะพัฒนาโครงสรางพื้นฐานดานนํ้ามันในสุมาตราและกาลีมันตัน เพื่อใหไดขอตกลงการคากับคูคารายใหมของเรา"
  INS_increased_trade_with_japan: "เพิ่มการคากับญี่ปุน"
  INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] เปนคูคาที่มีคุณคามากขึ้นเรื่อย ๆ และไมเคยทําใหเราผิดหวัง เราควรเจรจาขอตกลงการคาใหมเพื่อกระชับความรวมมือทางเศรษฐกิจระหวางสองชาติ และชวยใหเราสลัดรองรอยของภาวะเศรษฐกิจตกตํ่าครั้งใหญ สิ่งนี้อาจทําใหพันธมิตรในตะวันตกไมพอใจ โดยเฉพาะเนเธอรแลนด อยางไรก็ตาม หากเราตองการมีสิทธิ์มีเสียงในการกําหนดชะตากรรมของตนเอง เราตองสรางเสนทางการคาของเราเอง"
  INS_asian_trade_investments: "การลงทุนทางการคาในเอเชีย"
  INS_asian_trade_investments_desc: "ความเสียหายจากภาวะเศรษฐกิจตกตํ่าครั้งใหญแสดงใหเห็นวาเราพึ่งพาคูคาระยะยาวในตะวันตกมากเกินไปเพียงใด ดวยเศรษฐกิจที่พึ่งพาการสงออกเปนหลัก ตอนนี้จึงสําคัญยิ่งกวาที่เคยที่เราจะพัฒนาและขยายตลาดใหมในเอเชียตะวันออกเฉียงใต เพื่อใหเศรษฐกิจของเราไมตองพึ่งพาประเทศใดประเทศหนึ่ง"
  INS_asian_trade_investments_tt: "ทุก §Y420§! วัน บทลงโทษทรัพยากรสูตลาดจาก§Yภาวะเศรษฐกิจตกตํ่าครั้งใหญ§!จะ§Gดีขึ้น§! §Y5%§! จนกวาตัวปรับคาเชิงลบจะหมดไป"
  INS_declare_free_trade: "ประกาศการคาเสรี"
  INS_declare_free_trade_desc: "เราไมควรผูกตัวเองไวกับประเทศใดประเทศหนึ่งเทานั้น เราจะปลอยใหตลาดตัดสินใจสิ่งที่ดีที่สุดให [INS.GetNameDef] ไปตามธรรมชาติ"
  INS_japanese_export_contracts: "สัญญาการคาฉบับเดียวครองทุกสิ่ง"
  INS_japanese_export_contracts_desc: "เราจะเจรจาขอตกลงการคาครั้งใหญกับ [JAP.GetNameDef] โดยขายยางทั้งหมดใน [1049.GetName] และ [672.GetName] แมเราจะขายในราคาตํ่ามาก แตเราจะไดรับประกันวาขายไดทั้งหมด"
  INS_realign_supply_chains: "ปรับหวงโซอุปทานใหม"
  INS_realign_supply_chains_desc: "แมนโยบายกีดกันการคาจากภาวะเศรษฐกิจตกตํ่าครั้งใหญจะเริ่มผอนคลายลง แตการผลิตที่เพิ่มขึ้นและคาเงินกิลเดอรที่สูงเกินจริงไดทําใหตลาดสงออกของดัตชยอยยับ เพราะคูคาเกาในตะวันตกหันไปพึ่งอเมริกาใตแทน เราตองดําเนินการโนมนาวพันธมิตรของเราใหกลับมาคาขายกับเราอีกครั้ง"
  INS_invite_foreign_companies: "สนับสนุนกิจการนํ้ามันอเมริกัน"
  INS_invite_foreign_companies_desc: "ตั้งแตป 1930 Standard Oil California ไดดําเนินกิจการในประเทศของเราผานบริษัทในเครือของดัตช Nederlandsche Pacific Petroleum Maatschappij การสํารวจของพวกเขาในเรียวดูมีอนาคต เราควรสนับสนุนการดําเนินงานตนนํ้าของพวกเขาในทุกทางที่ทําได การคนพบครั้งใหญจะทั้งเพิ่มรายไดของเราและจูงใจใหบริษัทตางชาติอื่น ๆ เขามาลงทุนในประเทศของเรา"
  INS_expand_sea_routes: "ขยายเสนทางเดินเรือ"
  INS_expand_sea_routes_desc: "ประเทศของเราอุดมดวยทรัพยากรธรรมชาติ แตอุตสาหกรรมการสกัดทรัพยากรของเราเฉพาะทางเกินไป และเราขาดโครงสรางพื้นฐานที่จําเปนในการสกัดแรหายากบางชนิด เชน โครเมียมและทังสเตน หากตองการพัฒนาขีดความสามารถการผลิตทางทหาร เราตองนําเขาแรเหลานี้จากที่อื่น เพื่อใชประโยชนจากเครือขายการคาที่เติบโตของเราอยางเต็มที่ เราตองเพิ่มขีดความสามารถของกองเรือพาณิชย"
  INS_ship_contracts: "ทําสัญญาจัดหาเรือ"
  INS_ship_contracts_desc: "การสรางกองทัพเรือเปนสิ่งจําเปนเพื่อรักษาเสนทางการคาในยามสงคราม เราสามารถใชความสัมพันธทางการคาที่เพิ่งสรางขึ้นเพื่อใหไดสัญญาตอเรือรบ"

  # <Industry Branch - Sumatra>
  INS_developing_sumatra: "พัฒนาสุมาตรา"
  INS_developing_sumatra_desc: "สุมาตราเปนเกาะที่อุดมดวยทรัพยากรมากที่สุดในหมูเกาะ แตโครงสรางพื้นฐานกลับยํ่าแยจนทรัพยากรที่สกัดไดจํานวนมากไมเคยไปถึงบาตาเวียเลย การขนสงพึ่งพาถนนดินที่ปะติดปะตอกันกับทางรถไฟที่ไมเชื่อมตอกัน ซึ่งไมเพียงพอโดยสิ้นเชิงตอการรองรับแผนการของเราสําหรับเกาะนี้ เราไมอาจปลอยใหเปนเชนนี้ตอไป"
  INS_sumatra_railway: "ทางรถไฟสุมาตรา"
  INS_sumatra_railway_desc: "ในฐานะสวนหนึ่งของความพยายามพัฒนาโครงสรางพื้นฐานของสุมาตรา เราควรสรางทางรถไฟสายใหญทอดยาวจากอาเจะหทางเหนือไปจนถึงทาเรือใตสุดของสุมาตรา ซึ่งเชื่อมกับบาตาเวียทางเรือไดอยางรวดเร็ว ดวยวิธีนี้ ทรัพยากรจะตองขนสงไปเพียงสถานีรถไฟที่ใกลที่สุด แลวเราจะสงตอไปยังบาตาเวียไดภายในไมกี่วัน"
  INS_develop_borneo: "พัฒนากาลีมันตัน"
  INS_develop_borneo_desc: "กาลีมันตันมีศักยภาพที่จะสรางความมั่งคั่งมหาศาล แตเกาะนี้ยังพัฒนานอยมาก และผูคนก็ประสบความยากจน การขนสงสินคาพึ่งพาแมนํ้าและลํานํ้ามากมายของเกาะเปนหลัก และการสื่อสารระยะไกลก็ติดขัดเพราะขาดไฟฟา การสรางสายไฟฟาและถนนจะชวยปูทางสูการสํารวจและการสกัดทรัพยากรในอนาคต"
  INS_kalimantan_mic: "อุตสาหกรรมทหารกาลีมันตัน"
  INS_kalimantan_mic_desc: "ความพยายามพัฒนาโครงสรางพื้นฐานในกาลีมันตันไดผลแลว การขยายไฟฟาและการสื่อสารทําใหเราไดติดตอกับชุมชนที่เคยอยูไกลเกินมือรัฐบาลเอื้อมถึง เราสามารถใชโอกาสนี้ตอบสนองความตองการเพิ่มการผลิตทางทหาร ดวยการสรางโรงงานใหมในภูมิภาคและใชแรงงานกลุมใหมนี้"
  INS_pontianak_to_balikpapan: "จากปนตีอานักถึงตันจุงเซอลอร"
  INS_pontianak_to_balikpapan_desc: "แนวคิดการสรางทางรถไฟในกาลีมันตันถูกหารือมาอยางยาวนาน แตภูมิประเทศที่ทุรกันดารและสวนใหญยังไมไดสํารวจตรงใจกลางเกาะทําใหเปนภารกิจที่ยากลําบาก ทางออกเดียวคือทางรถไฟรูปตัว U จากชายฝงถึงชายฝง มันจะไมถูก แตในระยะยาวจะคุมทุนในตัวเอง"
  INS_develop_sulawesi: "พัฒนาสุลาเวสี"
  INS_develop_sulawesi_desc: "สุลาเวสีเปนศูนยกลางของหมูเกาะ จึงเปนทําเลยุทธศาสตรที่สําคัญ เราควรสรางถนน สายไฟฟา และระบบสื่อสาร เพื่อใหมั่นใจวาจะใชเปนศูนยกลางทางทหารไดในยามสงคราม"

  # <Industry Branch - Bangka Project>
  INS_the_bangka_project: "โครงการบังกา"
  INS_the_bangka_project_desc: "หมูเกาะบังกา-เบลีตุงแมจะเล็ก แตเปนรากฐานสําคัญของเศรษฐกิจอินโดนีเซีย เนื่องจากมีแหลงแรบอกไซต เราตองสรางถนน ทาเรือ และทางรถไฟบนบังกา-เบลีตุง เพื่อใหมั่นใจวาเราจะเก็บเกี่ยวผลประโยชนจากความมั่งคั่งทางแรธาตุของหมูเกาะไดอยางเต็มที่"
  INS_aluminium_factory: "โรงงานอะลูมิเนียมปงกัลปนัง"
  INS_aluminium_factory_desc: "การสกัดแรบอกไซตดิบของเรากําลังเติบโต แตการขาดการผลิตอะลูมิเนียมภายในประเทศจํากัดผลกําไรของเรา ในฐานะเมืองหลักของจังหวัดหมูเกาะบังกา-เบลีตุง ปงกัลปนังจะเปนทําเลที่เหมาะในการตั้งโรงงานของเราเอง ซึ่งจะชวยใหเราตัดพอคาคนกลางและไดผลตอบแทนสูงสุด"
  INS_bauxite_export: "ทุมสุดตัวกับการสงออกบอกไซต"
  INS_bauxite_export_desc: "ความสําเร็จของโครงการบังกาทําใหเรามีแรบอกไซตดิบมากเกินกวาจะรูวาจะทําอะไรกับมัน แมการพยายามขายทั้งหมดจะเปนเรื่องยาก แตเราสามารถเสนอราคาบอกไซตที่ตํ่ากวาใครในตลาดอยางมาก เพื่อใหมั่นใจวาขายไดทุกกรัม ดวยปริมาณบอกไซตมหาศาลที่เราขายได สิ่งนี้จะยังคงใหผลกําไรเติบโตตามสัดสวนเมื่อเทียบกับการสงออกในปจจุบัน"
  INS_tin_mining: "ลงทุนในการทําเหมืองดีบุก"
  INS_tin_mining_desc: "ประวัติศาสตรการทําเหมืองดีบุกในหมูเกาะบังกา-เบลีตุงมีมากอนที่ชาวยุโรปจะเขามาในหมูเกาะเสียอีก จึงไมนาแปลกใจที่อุตสาหกรรมดีบุกบนเกาะเหลานี้ถึงเวลาตองปรับปรุงใหทันสมัยนานแลว การยกเครื่องขีดความสามารถการผลิตเปนงานที่ใชเงินมาก และอุตสาหกรรมดีบุกที่มีอยูจะหยุดดําเนินการไประยะหนึ่งระหวางการสรางใหม อยางไรก็ตาม มีศักยภาพทํากําไรในระยะยาวอยางมาก"
  in_240_days_tt: "§Yใน 240 วัน:§!\n"
  INS_tin_to_usa: "ขายดีบุกให [USA.GetNameDef]"
  INS_tin_to_usa_desc: "[USA.GetNameDefCap] เต็มไปดวยบริษัทและหนวยงานรัฐที่ซื้อดีบุก เมื่อเรามีการทําเหมืองที่เปนระบบแลว เราจึงมีโอกาสทํากําไรไดมากจากที่นี่"
  INS_tin_to_japan: "ขายดีบุกให [JAP.GetNameDef]"
  INS_tin_to_japan_desc: "[JAP.GetNameDefCap] มีเรือจํานวนมากที่ปจจุบันถือวาลาสมัยและเปลี่ยนทดแทนได ทั้งที่เหมาะกับกองทัพเรือ[INS.GetAdjective]อยางยิ่ง เราควรซื้อเรือเหลานี้ดวยเงินจากการผลิตดีบุกของเรา"
  INS_tin_to_japan_tt: "[JAP.GetNameDefCap] จะสงเรือพิฆาตรุนเกา §Y9§! ลํามาใหเรา"
  INS_new_bauxite_routes: "เสนทางบอกไซตใหม"
  INS_new_bauxite_routes_desc: "กลยุทธตัดราคาตลาดเพื่อเพิ่มปริมาณการสงออกบอกไซตประสบความสําเร็จ และเราไดเพิ่มรายไดรวมอยางมาก อยางไรก็ตาม เราตองไมหยุดเพียงเทานี้ เราควรขยายเครือขายการคา ปรับหวงโซอุปทานใหมีประสิทธิภาพ และมองหาโอกาสอื่นใดที่จะเพิ่มผลตอบแทนใหสูงสุดตอไป"
  INS_bangka_bauxite_export_flag: "ทําแผนยุทธศาสตร §Y$INS_bauxite_export$§! สําเร็จแลว:"
  INS_not_industry: "วางแผนเพื่ออนาคต"
  INS_not_industry_desc: "ชวาคือหัวใจที่เตนอยูของชาติเรา เปนที่อยูของประชากรสวนใหญและที่ตั้งของรัฐบาล กอนที่เราจะพัฒนาอุตสาหกรรมบนเกาะนี้อยางจริงจัง เราตองเตรียมพื้นที่กอน การสํารวจที่ดิน การจัดสรรเขตผังเมือง และการเคลียรพื้นที่ จะทําใหมั่นใจวาเมื่อโรงงานมาถึง จะถูกสรางในที่ที่เกิดประโยชนสูงสุด"
  INS_construction_focus: "อุตสาหกรรมเฟองฟู"
  INS_construction_focus_desc: "ทุนตางชาติกําลังไหลเขา รายไดจากการสงออกกําลังเพิ่มขึ้น และเปนครั้งแรกในรอบหลายปที่มีเงินจริง ๆ ใหลงทุนในอุตสาหกรรมภายในประเทศ เราตองควาโอกาสนี้ไวและสรางในขณะที่สถานการณเปนใจ"

  # <Industry Branch - Java>
  INS_developing_java: "ขยายโครงสรางพื้นฐานของชวา"
  INS_developing_java_desc: "ชวาเปนเกาะที่มีอุตสาหกรรมมากที่สุดในหมูเกาะอยางเทียบไมติด และเปนแหลงความมั่งคั่งสวนใหญของเรา อยางไรก็ตาม บางเมือง เชน บาตาเวีย กําลังแออัดขึ้นเรื่อย ๆ จากการเพิ่มของประชากร เราควรขยายเมืองเหลานี้ดวยบานเรือน ยานการคา รถราง รถไฟ และโรงงานใหม เพื่อรองรับประชากรที่เพิ่มขึ้น"
  INS_prioritize_sugar_economy: "ใหความสําคัญกับเศรษฐกิจนํ้าตาล"
  INS_prioritize_sugar_economy_desc: "เราควรลดงบประมาณรัฐบาลสําหรับการพัฒนาอุตสาหกรรมในบาตาเวีย เพราะที่นั่นมีอุตสาหกรรมมากกวาเมืองอื่นใดในหมูเกาะไปไกลแลว เราควรใชเงินนี้จัดตั้งสวนปาลมขนาดเล็กจํานวนมากทั่วประเทศแทน สวนเหลานี้จะผลิตนํ้าตาลปาลม ซึ่งเปนสินคาที่มีความตองการสูงในตลาดโลก"
  INS_all_cards_into_industry: "ทุมไพทั้งหมดใหอุตสาหกรรม"
  INS_all_cards_into_industry_desc: "การพัฒนาอุตสาหกรรมสงผลอยางมหาศาลตอเศรษฐกิจของ [1058.GetName] หากเราพัฒนาอุตสาหกรรมทั่วทั้งเกาะซึ่งมีพลเมืองหลายสิบลานคน เราอาจกลายเปนผูมีอิทธิพลในระดับโลก"
  INS_expand_batavia_technical_institute: "ขยายสถาบันเทคโนโลยีบาตาเวีย"
  INS_expand_batavia_technical_institute_desc: "การขยายสถาบันเทคโนโลยีบาตาเวียจะทําใหนักศึกษาไดรับการศึกษามากขึ้น และเพิ่มอัตราการพัฒนาเทคโนโลยีของเรา"
  INS_quinine_export: "ขอตกลงควินินที่ทํากําไรมากขึ้น"
  INS_quinine_export_desc: "สํานักงานซิงโคนาในอัมสเตอรดัมแทบผูกขาดการสงออกควินิน ซึ่งทํากําไรไดมากเปนพิเศษเพราะควินินเปนที่ตองการสูงทั่วโลกในฐานะยารักษามาลาเรีย สํานักงานจัดหาควินินสวนใหญจากหมูเกาะอินเดียตะวันออก แตเรากลับไดสวนแบงกําไรเพียงนอยนิด เราควรใชการผลิตควินินของเราเปนขอตอรองเพื่อเจรจาขอตกลงที่เปนธรรมกวานี้"
  INS_spend_profits_on_rural: "ใชกําไรพัฒนาชนบท"
  INS_spend_profits_on_rural_desc: "เมื่อขอตกลงควินินฉบับใหมไดขอยุติแลว เราจึงมีโอกาสใชรายไดเพิ่มเติมพัฒนาโครงสรางพื้นฐานดานการคมนาคมและการสื่อสารในพื้นที่ชนบท ปูทางสูการพัฒนาอุตสาหกรรมในอนาคต"
  INS_spend_profits_on_urban: "ใชกําไรพัฒนาเมือง"
  INS_spend_profits_on_urban_desc: "เมื่อขอตกลงควินินฉบับใหมไดขอยุติแลว เราจึงมีโอกาสใชรายไดเพิ่มเติมขยายอุตสาหกรรมการผลิตในบาตาเวีย ซึ่งจะกระจายความหลากหลายทางเศรษฐกิจและลดการพึ่งพาการสงออกวัตถุดิบ"
  INS_spend_profits_on_military: "ใชกําไรพัฒนาการทหาร"
  INS_spend_profits_on_military_desc: "เมื่อขอตกลงควินินฉบับใหมไดขอยุติแลว เราจึงมีโอกาสพัฒนากองทัพอยางมาก ดวยการใชรายไดเพิ่มเติมสรางและบํารุงรักษาโรงงานอาวุธแหงใหมในยอกยาการตาและเซอมารัง"

  INS_end_to_bloodshed_tt: "สงครามจะยุติลง โดยมีการขีดเสนพรมแดนใหมตามการยึดครองในปจจุบัน ชวา สุมาตรา และบอรเนียว จะถูก§Yผนวก§!โดยฝายที่ควบคุมพื้นที่นั้นไดมากที่สุดในขณะนั้น"  
  HOL_british_light_support: "[ENG.GetNameDefCap] ไดตกลงชวยเหลือในการปฏิวัติแลว"

