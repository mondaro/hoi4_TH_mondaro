  INS_add_revolution_point_tt: "ไดรับผูแทนกองกําลังอาสาเพิ่ม §Y1§! คน"
  INS_no_more_political_chaos_tt: "เหตุการณความโกลาหลทางการเมืองจะหยุดเกิดขึ้น"

  INS_is_noncore_but_indonesian_trigger_tt: "เปนรัฐของอินโดนีเซียที่เปนดินแดนหลัก"
  INS_is_noncore_but_indonesian_trigger_tt_NOT: "เปนรัฐของอินโดนีเซียที่ไมเปนดินแดนหลัก"
  INS_soetardjo_petition_supported_tt: "คํารองของซูตารจโจไดรับการสนับสนุนจากโฟลกสราด"
