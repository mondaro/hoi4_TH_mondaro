 scientist_trait_genius_desc: "จิตใจผูมีวิสัยทัศนที่ผลักดันขอบเขตของวิทยาศาสตรและเทคโนโลยีดวยนวัตกรรมที่ไมมีใครเทียบ นี่คือพรสวรรคที่ปรากฏขึ้นเพียงครั้งเดียวในหนึ่งชั่วอายุคน"
 scientist_trait_gifted_engineer: "วิศวกรผูมีพรสวรรค"
 scientist_trait_gifted_engineer_desc: "วิศวกรผูมีพรสวรรคโดยธรรมชาติ เชี่ยวชาญการแกปญหาทางเทคนิคที่ซับซอนในหลากหลายสาขา"
 scientist_trait_brilliant_theorist: "นักทฤษฎีผูปราดเปรื่อง"
 scientist_trait_brilliant_theorist_desc: "ผูเชี่ยวชาญแนวคิดและทฤษฎีนามธรรม สามารถปฏิวัติยุทธศาสตรทางทหารและการวิจัยทางวิทยาศาสตรได"
 scientist_trait_bright: "หัวไว"
 scientist_trait_bright_desc: "นักวิทยาศาสตรที่เฉียบแหลมและคิดเร็ว เกงในการทําความเขาใจแนวคิดใหมและนําไปใชอยางมีประสิทธิภาพ"
 scientist_trait_fast_learner: "เรียนรูไว"
 scientist_trait_fast_learner_desc: "ปรับตัวเขากับความทาทายใหมไดอยางรวดเร็ว เรียนรูไดเร็วกวาเพื่อนรวมงาน และโดดเดนในสาขาวิทยาศาสตรที่หลากหลาย"
 scientist_trait_resourceful: "มีไหวพริบ"
 scientist_trait_resourceful_desc: "หาทางออกที่สรางสรรคไดเสมอ แมในยามที่ทรัพยากรขาดแคลนหรือสถานการณเลวราย"
 scientist_trait_schrodingers_trait: "คุณลักษณะของชเรอดิงเงอร"
 scientist_trait_schrodingers_trait_tt: "ประสบการณที่นักวิทยาศาสตรไดรับ: §G+10%§!\nประสบการณที่นักวิทยาศาสตรไดรับ: §R-10%§!"
 scientist_trait_schrodingers_trait_desc: "กอนที่ผูสังเกตจะเปดกลอง ฟงกชันคลื่นที่อธิบายคุณลักษณะนี้อยูในสถานะซอนทับของ ''ดี'' และ ''แย''"

 scientist_trait_aircraft_specialist: "ผูเชี่ยวชาญดานอากาศยาน"
 scientist_trait_aircraft_specialist_desc: "ผูเชี่ยวชาญดานอากาศพลศาสตรและการออกแบบอากาศยาน สามารถพัฒนาโครงสรางอากาศยาน เครื่องยนต และแบบที่เหนือกวาเพื่อครองนานฟา"
 scientist_trait_rocketry_specialist: "ผูเชี่ยวชาญดานจรวด"
 scientist_trait_rocketry_specialist_desc: "เชี่ยวชาญเทคโนโลยีจรวด มุงเนนหลักการขับดันในโครงการจรวดขีปนาวุธและจรวดนําวิถี"
 scientist_trait_electronics_specialist: "ผูเชี่ยวชาญดานอิเล็กทรอนิกส"
 scientist_trait_electronics_specialist_desc: "เชี่ยวชาญระบบสื่อสาร เรดาร และคอมพิวเตอร ซึ่งจําเปนตอการสงครามสมัยใหม"
 scientist_trait_helicopter_expert: "ผูเชี่ยวชาญดานเฮลิคอปเตอร"
 scientist_trait_helicopter_expert_desc: "ผูบุกเบิกอากาศยานปกหมุน เชี่ยวชาญกลไกการบินในแนวดิ่ง ระบบใบพัดหมุน และเฮลิคอปเตอรรุนแรกๆ"
 scientist_trait_jet_expert: "ผูเชี่ยวชาญดานเครื่องบินไอพน"
 scientist_trait_jet_expert_desc: "ผูทรงความรูดานการขับเคลื่อนดวยไอพน ผลักดันการวิจัยเครื่องยนตไอพนยุคแรกและการนําไปใชในอากาศยานทางทหาร"
 scientist_trait_bombs_expert: "ผูเชี่ยวชาญดานระเบิด"
 scientist_trait_bombs_expert_desc: "มีทักษะในการพัฒนาอุปกรณระเบิดและระเบิดนําวิถีแมนยําที่สามารถใชในยุทธศาสตรการทิ้งระเบิดทางอากาศแบบใหมที่ประณีตยิ่งขึ้น"
 scientist_trait_guidance_systems_expert: "ผูเชี่ยวชาญดานระบบนําวิถี"
 scientist_trait_guidance_systems_expert_desc: "ผูเชี่ยวชาญดานการพัฒนาเทคโนโลยีนําวิถียุคแรก มีประสบการณในการปรับปรุงระบบควบคุมสําหรับอุปกรณระเบิดไรคนขับพิสัยไกล"
 scientist_trait_armored_specialist: "ผูเชี่ยวชาญดานยานเกราะ"
 scientist_trait_armored_specialist_desc: "วิศวกรผูชํ่าชองซึ่งเชี่ยวชาญการออกแบบและปรับปรุงรถถังและยานเกราะอื่นๆ"
 scientist_trait_artillery_specialist: "ผูเชี่ยวชาญดานปนใหญ"
 scientist_trait_artillery_specialist_desc: "ผูเชี่ยวชาญระบบปนใหญ มีประสบการณในการปรับปรุงอํานาจการยิงระยะไกลและปนลํากลองใหญ"
 scientist_trait_submarine_specialist: "ผูเชี่ยวชาญดานเรือดํานํ้า"
 scientist_trait_submarine_specialist_desc: "ผูเชี่ยวชาญดานการสงครามเรือดํานํ้า มุงเนนการพัฒนาเทคโนโลยีเรือดํานํ้าใหมเพื่อยกระดับบทบาทในการปฏิบัติการทางทะเลแบบลับ"
 scientist_trait_surface_ship_specialist: "ผูเชี่ยวชาญดานเรือผิวนํ้า"
 scientist_trait_surface_ship_specialist_desc: "เชี่ยวชาญการออกแบบ พัฒนา และนําเรือรบผิวนํ้าขนาดใหญเขาประจําการ รวมถึงการวิจัยเทคโนโลยีใหมเพื่อติดตั้งใหเรือรบ"
 scientist_trait_nuclear_specialist: "ผูเชี่ยวชาญดานนิวเคลียร"
 scientist_trait_nuclear_specialist_desc: "นักฟสิกสแถวหนาของการวิจัยปรมาณู ทุมเทอยางลึกซึ้งใหกับการศึกษานิวเคลียรฟชชันและปฏิกิริยาลูกโซ"
 scientist_trait_nuclear_warfare_expert: "ผูเชี่ยวชาญดานสงครามนิวเคลียร"
 scientist_trait_nuclear_warfare_expert_desc: "ผูเชี่ยวชาญดานการประยุกตฟสิกสนิวเคลียรในการพัฒนาอาวุธ เชี่ยวชาญทฤษฎีเบื้องหลังการออกแบบระเบิดปรมาณู"
 scientist_trait_nuclear_power_expert: "ผูเชี่ยวชาญดานพลังงานนิวเคลียร"
 scientist_trait_nuclear_power_expert_desc: "ผูทรงความรูชั้นนําดานฟสิกสนิวเคลียร ชํ่าชองในสาขานิวเคลียรฟชชันโดยมุงเนนการผลิตพลังงาน"


 ############# EVENTS #############
 # Nuclear Projects
 sp_nuclear_project_events.1.t: "ขอมูลรั่วไหล"
 sp_nuclear_project_events.1.desc: "แมจะเปนเรื่องบังเอิญโดยสิ้นเชิง แตสายลับของเราใน [FROM.GetNameDef] ไดรับขอมูลเกี่ยวกับสิ่งที่ดูเหมือนเปนโครงการลับ คนงานคนหนึ่งที่เกี่ยวของกับการพัฒนาอาวุธลับ ซึ่งก็คือระเบิดปรมาณู ไดพูดถึงงานของเขาในงานสังสรรคเล็กๆ ที่สายลับของเราคนหนึ่งเขารวมอยูดวย"
 sp_nuclear_project_events.1.a: "สิ่งนี้อาจเปนประโยชน"








 ### OLD DEPRECATED STRINGS (Already translated)

 sp_land_generic_reward_scientist_xp_1_desc: "[Character.GetName] ไดสรางการคนพบสําคัญ เรงความคืบหนาและตอกยํ้าบทบาทของ[Character.GetHerHis]ในฐานะผูบุกเบิกดานอาวุธขั้นสูง ทุกการคนพบทําใหความเชี่ยวชาญดานวิศวกรรมของ[Character.GetHerHis]เติบโตขึ้น และกําหนดอนาคตของเทคโนโลยีทางทหาร"
 sp_land_generic_reward_option_scientist_xp: "ความรูคือพลัง!"
 sp_land_generic_reward_option_scientist_xp_desc: "[Character.GetName] ไดสรางการคนพบสําคัญ เรงความคืบหนาและตอกยํ้าบทบาทของ[Character.GetHerHis]ในฐานะผูบุกเบิกดานอาวุธขั้นสูง"
 sp_land_generic_reward_army_xp_1_desc: "[Character.GetName] ไดพบปะกับกลุมนายทหารที่คัดสรรมาเพื่อหารือถึงศักยภาพของ [SpecialProject.GetName] และไดรับขอคิดสําคัญเกี่ยวกับการใชเทคโนโลยีใหมในการสงครามภาคพื้นดิน ความรวมมือของพวกเขาชวยยกระดับขีดความสามารถทางทหารของเรา และทําใหมั่นใจไดถึงความพรอมสําหรับการรบในอนาคต"
 sp_land_generic_reward_option_army_xp_desc: "[Character.GetName] ไดพบปะกับกลุมนายทหารที่คัดสรรมาเพื่อหารือถึงศักยภาพของ [SpecialProject.GetName] และไดรับขอคิดสําคัญเกี่ยวกับการใชเทคโนโลยีใหมในการสงครามภาคพื้นดิน ความรวมมือของพวกเขาไดยกระดับขีดความสามารถทางทหารของเรา และทําใหมั่นใจไดถึงความพรอมสําหรับการรบในอนาคต"
 sp_land_generic_reward_major_progress_1_desc: "[Character.GetName] ไดสรางการคนพบสําคัญครั้งใหญ ผลักดันโครงการใหกาวหนาไปอยางมาก พิสูจนความเชี่ยวชาญของ[Character.GetHerHis] และปลุกพลังใหทีมวิจัย ดวยความคืบหนานี้ โครงการเขาใกลเปาหมายมากขึ้น ตอกยํ้ามรดกของ [Character.GetName] ในฐานะผูบุกเบิก"
 sp_land_generic_reward_option_major_breakthrough_desc: "[Character.GetName] ไดสรางการคนพบสําคัญครั้งใหญ ผลักดันโครงการใหกาวหนาไปอยางมาก พิสูจนความเชี่ยวชาญของ[Character.GetHerHis] และปลุกพลังใหทีมวิจัย ดวยความคืบหนานี้ โครงการไดเขาใกลเปาหมายมากขึ้น ตอกยํ้ามรดกของ [Character.GetName] ในฐานะผูบุกเบิก"
 sp_land_generic_reward_test_failure_1_desc: "เกิดอุปสรรคเล็กนอยระหวางการทดสอบ เผยใหเห็นขอบกพรองที่ไมคาดคิดในตนแบบของ [Character.GetName] ความติดขัดนี้กระตุนใหประเมินแนวทางใหมและปรับปรุงเทคนิค แมจะทําใหความคืบหนาลาชาชั่วคราว แตบทเรียนที่ไดรับจะชวยใหโครงการแข็งแกรงและยืดหยุนยิ่งขึ้นในระยะยาว"
 sp_land_generic_reward_option_test_failure_desc: "เกิดอุปสรรคเล็กนอยระหวางการทดสอบ เผยใหเห็นขอบกพรองที่ไมคาดคิดในตนแบบของ [Character.GetName] ความติดขัดนี้กระตุนใหมีการประเมินแนวทางใหมและปรับปรุงเทคนิค แมจะทําใหความคืบหนาลาชาชั่วคราว แตบทเรียนที่ไดรับชวยใหโครงการแข็งแกรงและยืดหยุนยิ่งขึ้นในระยะยาว"
 sp_land_generic_reward_armor_tech_1_desc: "พัฒนาการลาสุดในโครงการ [SpecialProject.GetName] ซึ่งนําโดย [Character.GetName] ไดทําใหเกิดความกาวหนาสําคัญในสาขาที่เกี่ยวของ การคนพบสําคัญเหลานี้กําลังปฏิวัติขีดความสามารถทางทหาร ปูทางสูยุทธศาสตรการสงครามภาคพื้นดินที่มีประสิทธิภาพและนาเกรงขามยิ่งขึ้น"
 sp_land_generic_reward_option_armor_tech_desc: "พัฒนาการลาสุดในโครงการ [SpecialProject.GetName] ซึ่งนําโดย [Character.GetName] ไดทําใหเกิดความกาวหนาสําคัญในสาขาที่เกี่ยวของ การคนพบสําคัญเหลานี้ไดปฏิวัติขีดความสามารถทางทหาร ปูทางสูยุทธศาสตรการสงครามภาคพื้นดินที่มีประสิทธิภาพและนาเกรงขามยิ่งขึ้น"
 sp_land_generic_reward_armor_bonus_1_desc: "[Character.GetName] เปนหัวหอกในการวิจัยลํ้าสมัย เผยการคนพบที่พลิกโฉมดานโลหะผสมชนิดใหมซึ่งจะปฏิวัติเกราะรถถัง ผลการคนพบเหลานี้ใหคํามั่นถึงความกาวหนาสําคัญในการสงครามยานเกราะ และแสดงใหเห็นถึงบทบาทสําคัญของนักวิทยาศาสตรผูนี้ในการกําหนดอนาคตของการสงครามยานเกราะ"
 sp_land_generic_reward_option_armor_bonus_desc: "นําโลหะผสมชนิดใหมนี้เขาสูสายการผลิตของเรา"
 sp_land_generic_reward_engine_bonus_1_desc: "การปรับแตงลาสุดของเครื่องยนตทดลองสําหรับตนแบบ [SpecialProject.GetName] สงผลใหสมรรถนะเครื่องยนตรถถังโดยรวมดีขึ้นอยางมาก งานอันละเอียดถี่ถวนของ [Character.GetName] และทีมของ[Character.GetHerHis]ไดผลักดันขีดจํากัดของวิศวกรรม และใหคํามั่นถึงขีดความสามารถที่สูงขึ้นหากเรานํานวัตกรรมเหลานี้ไปใชกับเครื่องยนตรถถังทั่วไป"
 sp_land_generic_reward_option_engine_bonus_desc: "เริ่มผลิตเครื่องยนตที่ปรับปรุงแลวเหลานี้!"
 sp_land_generic_reward_resource_scarcity_desc: "ทีมของ [Character.GetName] กําลังเผชิญการขาดแคลนวัสดุสําคัญสําหรับการพัฒนาโครงการ [SpecialProject.GetName] ทําให[Character.GetHerHim]ตองหาแหลงทดแทนและพัฒนาวิธีการผลิตใหมเพื่อตอบสนองความตองการ"
 sp_land_generic_reward_option_resource_scarcity_desc: "ทีมของ [Character.GetName] เผชิญการขาดแคลนวัสดุสําคัญสําหรับการพัฒนาโครงการ [SpecialProject.GetName] ทําให[Character.GetHerHim]ตองหาแหลงทดแทนและพัฒนาวิธีการผลิตใหมเพื่อตอบสนองความตองการ"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc: "ปนใหญ [SpecialProject.GetName] เพิ่งผานการทดสอบยิงครั้งสําคัญไดสําเร็จ แสดงใหเห็นถึงพิสัยและความแมนยําอันนาประทับใจ ความสําเร็จนี้ชวยปลุกขวัญกําลังใจของทีมวิจัยและดึงดูดความสนใจจากเจาหนาที่ระดับสูง สรางแรงผลักดันใหโครงการและความหวังครั้งใหมตอความสําเร็จ"
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc: "ปนใหญ [SpecialProject.GetName] ผานการทดสอบยิงครั้งสําคัญไดสําเร็จ แสดงใหเห็นถึงพิสัยและความแมนยําอันนาประทับใจ ความสําเร็จนี้ไดปลุกขวัญกําลังใจของทีมวิจัยและดึงดูดความสนใจจากเจาหนาที่ระดับสูง สรางแรงผลักดันใหโครงการและความหวังครั้งใหมตอความสําเร็จ"
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc: "ระหวางการทดสอบที่สําคัญ เกิดการระเบิดครั้งรายแรงสั่นสะเทือนพื้นที่ทดสอบ ปนใหญระเบิดเปนเสี่ยงๆ และสรางความเสียหายอยางมากตอโครงสรางพื้นฐานใกลเคียง ทีมของ [Character.GetName] กําลังสอบสวนสาเหตุของการระเบิดและรับมือกับผลกระทบจากเหตุการณ รวมถึงการจับตาของสาธารณชนและความลาชาที่อาจเกิดขึ้นกับกําหนดการของโครงการ"
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc: "ระหวางการทดสอบที่สําคัญ เกิดการระเบิดครั้งรายแรงสั่นสะเทือนพื้นที่ทดสอบ ปนใหญระเบิดเปนเสี่ยงๆ และสรางความเสียหายอยางมากตอโครงสรางพื้นฐานใกลเคียง ทีมของ [Character.GetName] ตองสอบสวนสาเหตุของการระเบิดและรับมือกับผลกระทบจากเหตุการณ รวมถึงการจับตาของสาธารณชนและความลาชาที่อาจเกิดขึ้นกับกําหนดการของโครงการ"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "[Character.GetName] ไดสรางการคนพบสําคัญดานเทคโนโลยีขับดัน เพิ่มความเร็วและพลังของกระสุนของ [SpecialProject.GetName] อยางมาก ความกาวหนานี้เปดความเปนไปไดใหมใหกับประสิทธิภาพของอาวุธในสนามรบ และเรงความคืบหนาสูการเสร็จสิ้นโครงการ"
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "[Character.GetName] ไดสรางการคนพบสําคัญดานเทคโนโลยีขับดัน เพิ่มความเร็วและพลังของกระสุนของ [SpecialProject.GetName] อยางมาก ความกาวหนานี้ไดเปดความเปนไปไดใหมใหกับประสิทธิภาพของอาวุธในสนามรบ และเรงความคืบหนาสูการเสร็จสิ้นโครงการ"
 sp_naval_generic_failure_nuclear_accident: "อุบัติเหตุนิวเคลียรที่ควบคุมได"

