 sp_land_reward_land_cruiser_engine: "กําลังเครื่องยนตไมเพียงพอ"
 sp_land_reward_land_cruiser_engine_desc: "การทดสอบชวงแรกแสดงใหเห็นวาโครงสรางมหึมาของตนแบบกําลังสรางภาระใหเครื่องยนตปจจุบัน ทําให [SpecialProject.GetName] เชื่องชาและตอบสนองไมดี ทีมเสนอทางเลือกสองทาง: พัฒนาเครื่องยนตใหมที่ทรงพลังกวา หรือพยายามดัดแปลงเพื่อเพิ่มกําลังของเครื่องยนตเดิมโดยเสี่ยงตอเครื่องยนตขัดของ"
