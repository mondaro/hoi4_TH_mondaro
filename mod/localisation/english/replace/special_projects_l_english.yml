 sp_naval_fleet_submarine_unique_reward_a: "หลักการออกแบบ"
 sp_naval_fleet_submarine_unique_reward_a_desc: "เราตองรูวาควรทุมความพยายามไปที่ใดในการออกแบบเรือดํานํ้าพิสัยไกลแบบใหม เรือดํานํ้าของเราควรเปนนักลาที่เงียบเชียบและรายกาจ หรือเราตองการใหมันเชื่อถือไดและทนทานตออันตรายมากกวา"
 sp_naval_fleet_submarine_preference_a: "ขีดความสามารถในการโจมตี"
 sp_naval_fleet_submarine_preference_b: "โครงสรางที่แข็งแรงกวา"

 sp_naval_nuclear_submarine_unique_reward_a: "ขอกังวลดานตนทุน"
 sp_naval_nuclear_submarine_unique_reward_a_desc: "ขณะที่เรากําลังพัฒนาเรือดํานํ้าแบบใหมทั้งหมด มีความกังวลเพิ่มขึ้นวาตนทุนการผลิตเรือจะสูงเกินไปในทายที่สุด เราควรดําเนินการออกแบบอยางไร? "
 sp_naval_nuclear_submarine_preference_a: "ลดมาตรฐานบางสวน"
 sp_naval_nuclear_submarine_preference_b: "แผนปจจุบัน"
 sp_naval_nuclear_submarine_preference_c: "คุณภาพสูงสุด"
 
 sp_naval_rocket_launching_submarine_unique_reward_a: "คําถามเรื่องการนําสงหัวรบ"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc: "เราตองตอบคําถามเรงดวนขอหนึ่ง วิธีใดดีที่สุดที่จะทําใหมั่นใจวาขีปนาวุธที่ยิงจากเรือดํานํ้าของเราจะไปถึงศัตรู?"
 sp_naval_rocket_launching_submarine_preference_a: "พิสัย"
 sp_naval_rocket_launching_submarine_preference_b: "ความนาเชื่อถือ"
 sp_naval_rocket_launching_submarine_preference_c: "การพรางตัว"

 sp_naval_nuclear_missile_submarine_unique_reward_a: "หนีการไลลา"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "หากขอมูลเกี่ยวกับแผนการโจมตีนิวเคลียรของเราไปถึงศัตรู พวกเขาจะเริ่มการคนหาเรือดํานํ้าขีปนาวุธนิวเคลียรของเราครั้งใหญ เพื่อหนีนักลา เราตอง..."
 sp_naval_nuclear_missile_submarine_preference_a: "หลบซอนตัว"
 sp_naval_nuclear_missile_submarine_preference_b: "สงบนิ่ง"
 sp_naval_nuclear_missile_submarine_preference_c: "ฝาพายุ"
 
 sp_naval_nuclear_torpedo_unique_reward_a: "แนวทางใหมของตอรปโด"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "เมื่อตอรปโดนิวเคลียรใกลบรรลุเปาหมายสุดทายของโครงการ เราตองมุงไปที่..."
 sp_naval_nuclear_torpedo_preference_a: "หัวรบทรงพลัง"
 sp_naval_nuclear_torpedo_preference_b: "การจัดเก็บที่ปลอดภัยกวา"

 sp_naval_midget_submarine_unique_reward_a: "อัดเพิ่มเขาไปอีก"
 sp_naval_midget_submarine_unique_reward_a_desc: "เราไดตระหนักวาเราอาจปรับชิ้นสวนของเรือดํานํ้าขนาดเล็กใหเฉพาะทางได แมจะตองแลกกับบางสิ่ง"
 sp_naval_midget_submarine_preference_a: "พรางตัวไดดีขึ้นอีกนิด"
 sp_naval_midget_submarine_preference_b: "ระเบิดงายนอยลงอีกนิด"
 sp_naval_midget_submarine_preference_c: "พิสัยไกลขึ้นอีกนิด"
 

 sp_naval_aip_engine_unique_reward_a: "การปรับปรุงแยกสวน"
 sp_naval_aip_engine_unique_reward_a_desc: "นักวิทยาศาสตรที่ทํางานกับเทคโนโลยีนี้ไดแบงปนผลการคนพบกับเพื่อนรวมงานที่ทํางานปรับปรุงเครื่องยนตแบบดั้งเดิม แตอยาเพิ่งตั้งตารอ เพราะผลการปรับปรุงที่ไดนาจะไมไดนาตื่นตะลึงนัก"
 sp_naval_aip_engine_preference_a: "เครื่องยนตที่เงียบกวา"
 sp_naval_aip_engine_preference_b: "เครื่องยนตที่เร็วกวา"
 sp_naval_aip_engine_preference_c: "เครื่องยนตที่ประหยัดเชื้อเพลิงกวา"
  
 sp_naval_anechoic_tiles_unique_reward_a: "บทเรียนใหม - การสรางตัวเรือดํานํ้า"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "ระหวางพัฒนาแผนกันสะทอนเสียง เราตระหนักวาสามารถปรับผลการคนพบไปใชกับการสรางเรือดํานํ้าแบบดั้งเดิมเพื่อเพิ่มขีดความสามารถในการพรางตัว หรือประหยัดตนทุนไดเล็กนอยโดยยังคงระดับการมองเห็นในปจจุบัน"
 sp_naval_anechoic_tiles_preference_a: "รูปแบบการลาดตระเวนเชิงรุก"
 sp_naval_anechoic_tiles_preference_b: "ลดเสียงที่ตรวจจับได"
 sp_naval_anechoic_tiles_preference_c: "ลดตนทุนตัวเรือ"
  
 sp_naval_torpedo_cruiser_unique_reward_a: "โอกาสครั้งที่สอง - เรือลาดตระเวนตอรปโด"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "เมื่อฟนแนวคิดเกาของเรือลาดตระเวนตอรปโดขึ้นมาใหม เราตองตัดสินใจครั้งสําคัญเกี่ยวกับบทบาทของมันในกองเรือ: เราควรมุงเนนจุดแข็งของมันคือตอรปโด หรือแกไขจุดออนหลักคือการรบกับเรือพิฆาต?"
 sp_naval_torpedo_cruiser_preference_a: "จุดแข็ง - ตอรปโด"
 sp_naval_torpedo_cruiser_preference_b: "จุดออน - เรือพิฆาต"
 
 sp_naval_super_heavy_battleship_unique_reward_a: "เรื่องของลําดับความสําคัญ - การโจมตี"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "การออกแบบเรือประจัญบานชั้นใหมเปดโอกาสใหเรามุงเนนการเพิ่มขีดความสามารถในการครองสนามรบทางทะเล เราควรใหความสําคัญกับสิ่งใด?" 
 sp_naval_super_heavy_battleship_preference_a_a: "ปนใหญหนัก"
 sp_naval_super_heavy_battleship_preference_b_a: "ความเร็ว"
 sp_naval_super_heavy_battleship_preference_c_a: "ปนใหญเบา"
 sp_naval_super_heavy_battleship_unique_reward_b: "เรื่องของลําดับความสําคัญ - การปองกัน"
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "ผูบัญชาการทหารเรือระดับสูงของเรามอบภารกิจที่เปนไปไมไดให คือทําใหเรือลํานี้แทบไรเทียมทาน - และแมเราจะรูวาเปนไปไมได อยางนอยเราก็พยายามได ครั้งนี้เราควรใหความสําคัญกับสิ่งใด?" 
 sp_naval_super_heavy_battleship_preference_a_b: "เสริมเกราะและตัวเรือ"
 sp_naval_super_heavy_battleship_preference_b_b: "ปนใหญตอสูอากาศยาน"
 sp_naval_super_heavy_battleship_preference_c_b: "มาตรการตอตานตอรปโด"
  
 sp_naval_modern_battleship_unique_reward_a: "เรือประจัญบานสมัยใหม - ความหวัง"
 sp_naval_modern_battleship_unique_reward_a_desc: "แมหลายคนจะอางวายุคของเรือประจัญบานสิ้นสุดลงแลว แตเรายังคงเชื่อมั่นในมัน เรือลํานี้มีโอกาสที่จะเปนความหวังใหมของเรา เราควรมุงเนนดานใดเพื่อทําใหความฝนเปนจริง?"
 sp_naval_modern_battleship_preference_a_a: "อํานาจการยิงลวนๆ"
 sp_naval_modern_battleship_preference_b_a: "ความคลองตัว"
 sp_naval_modern_battleship_preference_c_a: "ความแมนยํา"
 sp_naval_modern_battleship_unique_reward_b: "เรือประจัญบานสมัยใหม - การโตกลับ!"
 sp_naval_modern_battleship_unique_reward_b_desc: "เพื่อพิสูจนจุดยืนและรักษาสถานะของเรา เราตองทนรับการโจมตีของขาศึกใหได เราควรปรับปรุงสิ่งใดเพื่อใหสามารถโตกลับผูที่กลาขวางทางเรา?"
 sp_naval_modern_battleship_preference_a_b: "โครงสราง"
 sp_naval_modern_battleship_preference_b_b: "การตอสูอากาศยาน"
 sp_naval_modern_battleship_preference_c_b: "การปองกันตอรปโด"
  
 sp_naval_modern_carrier_unique_reward_a: "เรือบรรทุกเครื่องบินสมัยใหม - จุดประสงค"
 sp_naval_modern_carrier_unique_reward_a_desc: "ดวยเรือบรรทุกเครื่องบินรุนใหม เราสามารถมุงเนนบางดานของเรือเพื่อใหตอบสนองความตองการของเราไดดียิ่งขึ้น เราควรทุมความพยายามไปที่ใด?"
 sp_naval_modern_carrier_preference_a_a: "การรับรูสถานการณ"
 sp_naval_modern_carrier_preference_b_a: "ความเร็วและการทนสภาพอากาศ"
 sp_naval_modern_carrier_preference_c_a: "การยับยั้งเรือเบา"
 sp_naval_modern_carrier_unique_reward_b: "เรือบรรทุกเครื่องบินสมัยใหม - ความปลอดภัย"
 sp_naval_modern_carrier_unique_reward_b_desc: "เรือบรรทุกเครื่องบินคือราชาแหงการสงครามทางทะเลอยางไมตองสงสัย แตเราจําเปนตองใหการปกปองและความปลอดภัยที่เหมาะสมแกมัน ขอกังวลหลักของเราควรเปนอะไร?"
 sp_naval_modern_carrier_preference_a_b: "ปนใหญขาศึก"
 sp_naval_modern_carrier_preference_b_b: "อากาศยานขาศึก"
 sp_naval_modern_carrier_preference_c_b: "ตอรปโดขาศึก"

 sp_naval_ice_carrier_unique_reward_a: "เสริมความแข็งแรงเรือบรรทุกเครื่องบินนํ้าแข็ง"
 sp_naval_ice_carrier_unique_reward_a_desc: "ขณะที่ทุมเวลามหาศาลในการสรางเรือบรรทุกเครื่องบินยักษลํานี้ เราตองแนใจวาไดมอบการปกปองที่ดีที่สุดเทาที่ทําไดใหแกมัน ขอกังวลที่ใหญที่สุดของเราคืออะไร?"
 sp_naval_ice_carrier_preference_a: "พลังธรรมชาติ"
 sp_naval_ice_carrier_preference_b: "กองกําลังขาศึก"
  
 sp_naval_underway_replenishment_unique_reward_a: "ขนาดของการสงเสบียง"
 sp_naval_underway_replenishment_unique_reward_a_desc: "ขณะที่เรายังคงทํางานใหระบบสงกําลังบํารุงกลางทะเลดําเนินไปอยางราบรื่นที่สุด เราตองตัดสินใจอีกเรื่องหนึ่ง - เราตองการปรับการประมาณการเดิมหรือไม?"
 sp_naval_underway_replenishment_preference_a: "พิสัยไกลขึ้น"
 sp_naval_underway_replenishment_preference_b: "ใชขบวนเรือลําเลียงนอยลง"
 sp_naval_underway_replenishment_preference_c: "หาจุดสมดุล"
 
 sp_naval_proximity_fuzes_unique_reward_a: "ประสิทธิภาพหรือประสิทธิผล"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "ชนวนตรวจจับระยะใกลชวยลดจํานวนกระสุนที่ตองใชเพื่อยิงถูกอากาศยานขาศึกไดอยางมาก ขณะที่เราเตรียมนําไปใชในหนวยตอสูอากาศยานเคลื่อนที่ เราสามารถปรับปริมาณกระสุนที่สงใหไดโดยยังคงอัตรา 'ยิงถูก' รายวันตามที่คาดไว"
 sp_naval_proximity_fuzes_preference_a: "ปรับปริมาณการสงกระสุน"
 sp_naval_proximity_fuzes_preference_b: "คงปริมาณการสงกระสุนปจจุบัน"

 sp_naval_support_ships_unique_reward_a: "เรือชวยรบ - จุดเนนการสนับสนุน"
 sp_naval_support_ships_unique_reward_a_desc: "แมคุณคาของเรือสนับสนุนจะไมเปนที่โตแยง แตเราตองตัดสินใจวาจะใหปฏิบัติการมุงเนนดานใด: การเติมเสบียงอยางเจาะจงใหเรือจํานวนนอย หรือการเติมคลังเสบียงทั่วไปใหทั้งกองเรือ"
 sp_naval_support_ships_preference_a_a: "ความตองการของคนสวนนอย"
 sp_naval_support_ships_preference_b_a: "หาจุดสมดุล"
 sp_naval_support_ships_preference_c_a: "ความตองการของคนสวนมาก"
 sp_naval_support_ships_unique_reward_b: "เรือชวยรบ - ความพยายามดานการซอมบํารุง"
 sp_naval_support_ships_unique_reward_b_desc: "คําถามสําคัญสําหรับการจัดหนวยเรือซอมบํารุงของเรา: จะใชทีมซอมขนาดเล็กจํานวนมากที่สามารถซอมเรือจํานวนมากไดอยางชาๆ หรือใชทีมจํานวนนอยที่มีอุปกรณครบครันซึ่งซอมเรือไดนอยลํากวาแตละเอียดกวา"
 sp_naval_support_ships_preference_a_b: "ครอบคลุมกวางขึ้น"
 sp_naval_support_ships_preference_b_b: "หาจุดสมดุล"
