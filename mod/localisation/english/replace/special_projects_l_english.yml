 sp_land_reward_land_cruiser_turret_desc: "การออกแบบปอมปนหลายปอมขนาดมหึมาทําใหเกิดปญหาการจัดแนวและการเล็งอยางรุนแรง ทําใหการติดตั้งอาวุธลาชา ทีมวิศวกรแนะนําใหลดความซับซอนของการจัดวางปอมปนเพื่อเพิ่มความนาเชื่อถือ แตการทําเชนนั้นจะลดอํานาจการยิงตามแผนของ [SpecialProject.GetName]"
