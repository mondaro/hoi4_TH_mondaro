 sp_land_reward_land_cruiser_communication_desc: "ขนาดอันมหึมาของ [SpecialProject.GetName] ตองอาศัยระบบสื่อสารภายในที่ซับซอนเพื่อประสานงานลูกเรือ ระบบปจจุบันพิสูจนแลววาไมเพียงพอ คําสั่งลาชาหรือสูญหาย ทีมเสนอใหออกแบบผังภายในใหมเพื่อใหการสื่อสารลื่นไหลขึ้น หรือติดตั้งระบบที่ทันสมัยกวาแตยังไมผานการทดสอบ"
