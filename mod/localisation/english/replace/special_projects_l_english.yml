 sp_land_reward_land_cruiser_chassis_desc: "ระหวางการทดสอบความเคน พบวาแชสซีของ [SpecialProject.GetName] ไมสามารถรับนํ้าหนักมหาศาลได ทําใหเกิดการผิดรูปของโครงสราง ทีมออกแบบมีความเห็นแตกออกเปนสองฝาย วาจะเสริมความแข็งแรงเพิ่มเติมซึ่งจะทําใหยานหนักยิ่งขึ้น หรือใชวัสดุที่เบากวาซึ่งอาจลดความทนทาน"
