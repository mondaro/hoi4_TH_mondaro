l_english:
 autonomous_state: "รัฐปกครองตนเอง"
 semi_autonomous_state: "รัฐกึ่งปกครองตนเอง"
 SPA_a_great_spain: "สเปนอันยิ่งใหญ"
 SPA_a_great_spain_desc: "สาธารณรัฐที่สองซึ่งเพิ่งตั้งไขลมเหลวในหนาที่ปกปองศาสนา ครอบครัว และทรัพยสิน ขณะที่ฝายซายรุมเราอารยธรรมคริสเตียนของเรา สมาพันธฝายขวาอิสระแหงสเปน (Confederación Española de Derechas Autónomas) จะยืนหยัดปกปองมัน และมอบเอกภาพที่แทจริงและจิตวิญญาณใหมใหแกสเปน รัฐสภาจะตองยอมตามเจตจํานงของประชาชน มิฉะนั้นเราจะกําจัดมันเสีย"
 SPA_hand_over_the_ceda_campaign_chest: "มอบกองทุนหาเสียงของ CEDA"
 SPA_hand_over_the_ceda_campaign_chest_desc: "เรายังมีเงินทุนเหลืออยูมากหลังการรณรงคหาเสียงเลือกตั้ง หากรัฐสภาปฏิเสธเสียงของเรา เราตองเตรียมการกําจัดมัน เราจะมอบกองทุนหาเสียงของสมาพันธฝายขวาอิสระแหงสเปน (Confederación Española de Derechas Autónomas) ใหแกฝายที่รูแจงในกองทัพ เพื่อใหพวกเขาเตรียมการลุกฮือตอตานฝายซาย"
 SPA_negotiate_carlist_support: "เจรจาขอแรงสนับสนุนจากคารลิสต"
 SPA_negotiate_carlist_support_desc: "อุดมการณของเรามีพันธมิตรที่เราเพียงตองยื่นมือไปหา กระแสตอตานศาสนจักรของฝายซายไดสรางความเปนปรปกษกับพวกคารลิสต ซึ่งเตรียมพรอมเผชิญหนากับสาธารณรัฐมานานแลว หากเราไดแรงสนับสนุนจากพวกเขา การลุกฮือของเราจะแข็งแกรงขึ้นมาก"
 SPA_negotiate_carlist_support_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ฝกมาอยางดี 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน\n"
 SPA_negotiate_carlist_support_tt_2: "§Rหนวยเหลานี้จะถูกนําออกเมื่อสงครามกลางเมืองสิ้นสุด หากสเปนไมไดกลายเปนคารลิสต!§!\n"
 SPA_the_army_of_africa: "กองทัพแหงแอฟริกา"
 SPA_the_army_of_africa_desc: "กุญแจสูชัยชนะในการตอสูที่กําลังจะมาถึงคือกองทัพแหงแอฟริกาที่ชํ่าชองการรบ เราตองทําใหมั่นใจวาพวกเขาภักดีตออุดมการณของเรา วางแผนยึดครองแอฟริกาเหนือแบบสายฟาแลบ แลวเตรียมการลําเลียงทหารผูผานศึกเหลานี้ขึ้นสูแผนดินใหญ ที่ซึ่งพวกเขาจะพลิกดุลใหเปนประโยชนตอเรา"
 SPA_the_army_of_africa_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ฝกมาอยางดี 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 7§! และ§Yปนใหญ 2§! กองพัน พรอมหนวยสนับสนุน§Yลาดตระเวน§!และ§Yทหารชาง§! รวมถึงการควบคุม§Y[290.GetName]§!อยางแนนอน\n"
 SPA_secure_the_northern_garrisons: "รักษากองรักษาการณภาคเหนือ"
 SPA_secure_the_northern_garrisons_desc: "ดวย 'การโนมนาว' ที่เหมาะสม เราจะไดแรงสนับสนุนจากผูบัญชาการกองรักษาการณทางภาคเหนือ ดวยการลุกฮือพรอมกันในจังหวะที่เหมาะสม นี่จะมอบฐานอํานาจอันมั่นคงใหเราใชทําสงครามกับฝายซาย หากความพยายามรัฐประหารครั้งแรกของเราลมเหลว"
 SPA_secure_the_northern_garrisons_tt: "เพิ่ม§Yการควบคุมกองรักษาการณ§!เปน§Gเบ็ดเสร็จ§!ใน§Y[171.GetName]§! §Y[174.GetName]§! §Y[788.GetName]§! §Y[791.GetName]§! §Y[176.GetName]§! §Y[166.GetName]§! และ§Y[172.GetName]§!\n\nฝายชาตินิยมจะเริ่มสงครามกลางเมืองโดยควบคุมจังหวัดเหลานี้ ตราบใดที่§Yการควบคุมกองรักษาการณ§!ในจังหวัดนั้นอยูในระดับ§Oออน§!เปนอยางนอย\n"
 SPA_sin_paquito: "ไมมีปากีโต"
 SPA_sin_paquito_desc: "รัฐบาลซึ่งหวาดระแวงวาเขาอาจไมภักดี ไดสงฟรันซิสโก ฟรังโก ไปบัญชาการกองกําลังในหมูเกาะคานารี อยางไรก็ตาม แมเราจะเชื้อเชิญ เขาก็ไมไดใหคํามั่นวาจะสนับสนุนเรา และเอาแตถวงเวลาเราดวยความลังเล หาก "นางงามหมูเกาะคานารี 1936" ไมยอมตัดสินใจเขารวมกับเรา เราก็จะเดินหนาตอไปโดยไมมีเขา"
 SPA_con_paquito: "มีปากีโต"
 SPA_con_paquito_desc: "อุดมการณของเราตองการผูนําที่เขมแข็ง และฟรันซิสโก ฟรังโก ครองความภักดีของกองทัพแหงแอฟริกาอันเลื่องชื่อ เพื่อใหการลุกฮือของเราสําเร็จ แมเขาจะรีรอไมยอมตัดสินใจ เราก็ตองดึงแรงสนับสนุนจากเขามาใหได แมนั่นอาจตองแลกดวยราคาบางอยาง..."
 SPA_con_paquito_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น §Yฟรันซิสโก ฟรังโก§! จะกลายเปนจอมพลฝายชาตินิยม\n"
 SPR_the_popular_front: "แนวรวมประชาชน"
 SPR_the_popular_front_desc: "ภัยที่ฟาสซิสตและความงมงายทางศาสนามีตอเสรีภาพสวนบุคคลของเรานั้นรายแรงยิ่ง และเราตองสรางแนวรวมกวางขวางของพรรคการเมืองที่ผนึกกําลังกันตอตานฝายขวา มีเพียงการรวมพลังกันเทานั้นที่จะหยุดยั้งการรุกคืบของพวกเขาและรักษาสาธารณรัฐของเราไวได"
 SPR_secure_the_guardia_de_asalto: "ยึดกุมกวารเดียเดอาซัลโต"
 SPR_secure_the_guardia_de_asalto_desc: "สังคมแตกขั้วมากขึ้นเรื่อย ๆ และความรุนแรงก็เพิ่มขึ้นตาม เราตองทําใหมั่นใจในความภักดีของตํารวจจูโจม (Assault Guards) กองหนุนตํารวจหนักที่ฝกมาอยางดีของเรา พวกเขาจะมีคาอยางยิ่งหากความรุนแรงยังคงลุกลาม"
 SPR_secure_the_guardia_de_asalto_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ผานการฝก 3 หนวย ซึ่งมีกองพัน§Yทหารราบ 6§! กองพัน ฝายชาตินิยมจะไดรับหนวยที่ฝกมาไมดี 6 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน\n"
 SPR_secure_the_guardia_de_asalto_tt_2: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ผานการฝก 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 6§! กองพัน ฝายชาตินิยมจะไดรับหนวยที่ฝกมาไมดี 10 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน\n"
 SPR_secure_the_guardia_get_both_types_tt: "§Rหากไมไดเลือกแผนยุทธศาสตรใดเลย ฝายชาตินิยมจะไดรับทั้งสองแบบแทน!§!\n"
 SPR_secure_the_guardia_civil: "ยึดกุมกวารเดียซีบิล"
 SPR_secure_the_guardia_civil_desc: "กลุมหัวรุนแรงยังคงกอความวุนวายตอความสงบเรียบรอยของสาธารณะ และดานหนาในการตอสูกับความไมสงบทางสังคมก็คือกวารเดียซีบิล การทําใหมั่นใจในความภักดีของกองกําลังตํารวจแหงชาติตองเปนสิ่งสําคัญอันดับแรก หากเราหวังจะยับยั้งความรุนแรงและรักษาการควบคุมไว"
 SPR_secure_the_guardia_civil_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ฝกมาไมดี 6 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน ฝายชาตินิยมจะไดรับหนวยที่ผานการฝก 3 หนวย ซึ่งมีกองพัน§Yทหารราบ 6§! กองพัน\n"
 SPR_secure_the_guardia_civil_tt_2: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ฝกมาไมดี 10 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน ฝายชาตินิยมจะไดรับหนวยที่ผานการฝก 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 6§! กองพัน\n"
 SPR_train_the_union_youth: "ฝกยุวชนสหภาพแรงงาน"
 SPR_train_the_union_youth_desc: "เสียงกระซิบถึงความไมภักดีดังมาจากกองทัพ และเราตองเตรียมรับสิ่งเลวรายที่สุด เราจะจัดหลักสูตรเรงรัดการใชอาวุธและยุทธวิธีทางทหารขั้นพื้นฐานใหแกผูสนับสนุนรุนเยาวที่ทุมเทและมุงมั่น เพื่อใหพวกเขาจับอาวุธไดทันทีหากเกิดเหตุรายที่สุดขึ้น"
 SPR_train_the_union_youth_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ฝกมาอยางดี 5 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน\n"
 SPR_enlarge_the_weapon_caches: "ขยายคลังอาวุธลับ"
 SPR_enlarge_the_weapon_caches_desc: "ตั้งแตกอนการนัดหยุดงานของคนงานเหมืองอัสตูเรียสในป 1934 เสียอีก คลังอาวุธลับไดถูกตั้งขึ้นอยางลับ ๆ ทั่วประเทศ เพื่อเตรียมรับความจําเปนที่หลีกเลี่ยงไมไดในการปกปองเสรีภาพของเราดวยกําลังอาวุธ ในยามวิกฤตเชนนี้ เราควรขยายคลังเหลานี้ใหใหญขึ้นอีก"
 SPR_enlarge_the_weapon_caches_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะคงยุทโธปกรณไว §Y80%§! แทนที่จะเปน §Y50%§!\n"
 SPR_distribute_arms_to_the_people: "แจกจายอาวุธใหประชาชน"
 SPR_distribute_arms_to_the_people_desc: "ความไมภักดีในกองทัพแทบเปนที่แนนอนแลว และชัดเจนวาเราไมอาจพึ่งพวกเขาใหปกปองคุณคาของสาธารณรัฐได เราควรเริ่มแจกจายอาวุธใหผูที่มีผลประโยชนสูงสุดของสาธารณรัฐอยูในใจ เพื่อใหพวกเขาเปนแนวปองกันแรกตอการกบฏที่อาจเกิดขึ้น"
 SPR_distribute_arms_to_the_people_tt: "เมื่อสงครามกลางเมืองเริ่มขึ้น จะไดรับหนวยที่ไมผานการฝก 10 หนวย ซึ่งมีกองพัน§Yทหารราบ 3§! กองพัน\n"
 SPR_disband_the_army: "ยุบกองทัพ"
 SPR_disband_the_army_desc: "เราไมอาจเพิกเฉยตอสัญญาณความไมภักดีในกองทัพไดอีกตอไป แมนี่อาจกระตุนใหผูคบคิดลงมือ แตเราไมมีทางเลือกอื่นนอกจากพยายามยุบกองทัพโดยมีผลทันที และชิงความไดเปรียบไวกอน"
 SPR_disband_the_army_tt: "§Gลดสัดสวนของกองทัพที่จะเขาขางฝายชาตินิยมเมื่อสงครามกลางเมืองเริ่มขึ้นจาก §Y50%§! เหลือ §Y20%§! และลดจํานวนกองพลกองทัพแหงแอฟริกาของพวกเขาจาก §Y5§! เหลือ §Y3§!§!\nสวนที่ภักดี §Y80%§! จะถูก§Rยุบ§! แตยุทโธปกรณจะถูกสงคืนเขาคลัง\n\nหากไมไดเลือกแผนยุทธศาสตรนี้ รัฐบาลจะยุบกองทัพเพื่อตอบโตเมื่อสงครามกลางเมืองเริ่มขึ้น โดยไมมีผลประโยชนเพิ่มเติม\n\n§Rกองทัพที่เหลือซึ่งไมภักดีจะจุดชนวนใหสงครามกลางเมืองเริ่มขึ้นทันที!§!\n"
 SPA_the_phalanx_ascendant: "ฟาลังซผงาด"
 SPA_the_phalanx_ascendant_desc: "บัดนี้คือการผงาดขึ้นของฟาลังเฆ สาธารณรัฐที่ลมเหลวกําลังอยูในวาระสุดทาย และแมการตอสูจะยาวนานและยากลําบาก เราก็ไดกาวแรกบนเสนทางสูการเกิดใหมของจักรวรรดิสเปนแลว"
 SPA_bolster_offensive_infrastructure: "เสริมโครงสรางพื้นฐานเพื่อการรุก"
 SPA_bolster_offensive_infrastructure_desc: "คอขวดที่ใหญที่สุดในการวางแผนรุกของเราคือการที่เราไมสามารถสงเสบียงใหหนวยแนวหนาไดเพียงพอ ดวยการมุงปรับปรุงโครงสรางพื้นฐานในพื้นที่เหลานี้ ปฏิบัติการรุกของเรานาจะแข็งแกรงขึ้นอยางมาก"
 SPA_bolster_offensive_infrastructure_tt: "ตองอยูในสงครามกลางเมืองสเปน\nเพิ่ม§Yโครงสรางพื้นฐาน 1§! ระดับใหรัฐแนวหนาแบบสุม 3 รัฐ\n"
 SPA_the_fifth_column: "แนวที่หา"
 SPA_the_fifth_column_desc: "ตามคํากลาวของเอมิลิโอ โมลา: "ขณะที่สี่แถวทัพของขาพเจาเคลื่อนเขาใกลมาดริด แนวที่หาของผูสนับสนุนจะลุกขึ้นจากภายในเมืองและบอนทําลายแนวปองกันของฝายสาธารณรัฐจากขางใน" เราจะจัดตั้ง 'แนวที่หา' เหลานี้ในทุกเมืองที่เราเขาใกล ซึ่งจะมอบความไดเปรียบชี้ขาดแกเรา"
 SPA_the_fifth_column_tt: "ปลดล็อกการตัดสินใจ§Yปลุกระดมแนวที่หา§! ซึ่งชวยใหกอการลุกฮือขนาดเล็กในดินแดนขาศึกได\n"
 SPA_emergency_munitions_corporations: "บรรษัทอาวุธยุทธภัณฑฉุกเฉิน"
 SPA_emergency_munitions_corporations_desc: "ความพยายามทําสงครามตองไดรับการเสริมกําลังโดยดวน หากเราจะรักษาระดับเสบียงใหเพียงพอแกทหารผูกลาของเรา เราจะจัดผูที่ไมไดออกรบใหทํางานในโรงงานชั่วคราว ผลิตสิ่งจําเปนขั้นพื้นฐานที่สุดใหแกทหารของเรา"
 SPA_the_corpo_truppe_volontarie: "กองทหารอาสาสมัคร (Corpo Truppe Volontarie)"
 SPA_the_corpo_truppe_volontarie_desc: "ผูสนับสนุนของเราใน[ITA.GetNameDef]ไดสงกองทหารอาสาสมัคร (Corpo Truppe Volontarie) มาชวยเราสูรบ แตหากเราจะไดชัย กองกําลังนี้ตองขยายใหใหญขึ้นอีกมาก เราจะสงทูตไปยัง[ITA.GetNameDef]เพื่อสนับสนุนอุดมการณของเราและขอความชวยเหลือทางทหารเพิ่มเติมแทนเรา"
 SPA_the_condor_legion: "กองทหารคอนดอร"
 SPA_the_condor_legion_desc: "ผูสนับสนุนของเราใน[GER.GetNameDef]ไดสงกองทหารคอนดอรมาชวยเราสูรบ แตหากเราจะไดชัย กองกําลังนี้ตองขยายใหใหญขึ้นอีกมาก เราจะสงทูตไปยัง[GER.GetNameDef]เพื่อสนับสนุนอุดมการณของเราและขอความชวยเหลือทางทหารเพิ่มเติมแทนเรา"
 SPA_equipment_shipments: "การขนสงยุทโธปกรณ"
 SPA_equipment_shipments_desc: "ทหารไมใชสิ่งเดียวที่เราตองการเพื่อควาชัยชนะ เราตองทําใหผูสนับสนุนในตางแดนเขาใจถึงความตองการยุทโธปกรณอยางเรงดวนของเรา และพวกเขาจะชวยเราในเรื่องนี้ไดอยางไร"
 SPA_obtain_training_staff: "ขอครูฝกทางทหาร"
 SPA_obtain_training_staff_desc: "แมอาจกระทบศักดิ์ศรี แตเราตองยอมรับวาผูสนับสนุนตางชาติของเรามีประสบการณในศิลปะการสงครามเหนือกวา เราควรเชิญผูเชี่ยวชาญทางทหารของพวกเขามายังสเปนเพื่อสอนนายทหารและชวยฝกทหารของเรา ซึ่งจะมอบความไดเปรียบที่จําเปนเหนือฝายสาธารณรัฐ"
 SPA_doctrinal_advancements: "ความกาวหนาทางหลักนิยม"
 SPA_doctrinal_advancements_desc: "ผูสนับสนุนตางชาติของเราไดพัฒนาแนวคิดทางทหารและหลักนิยมไปมากในชวงหลายทศวรรษที่ผานมา บางทีเราอาจโนมนาวใหพวกเขาแบงปนแนวคิดกับเรา เพื่อที่เราจะไดทดสอบมันในสงครามครั้งนี้"
 SPA_secure_the_national_defense_council: "ยึดกุมสภาปองกันแหงชาติ"
 SPA_secure_the_national_defense_council_desc: "เมื่อไรผูนํา อุดมการณของเราจึงถูกนําโดยคณะรัฐบาลทหาร (ฆุนตา) ที่ประกอบดวยผูนําทหารและพลเรือนซึ่งมีเปาหมายสอดคลองกันอยางหลวม ๆ หากเราจะผลักดันเจตจํานงของเราและบรรลุการเกิดใหมที่สเปนสมควรไดรับ เราตองครองอํานาจเหนือองคกรที่หลากหลายและบางครั้งก็ทะเลาะเบาะแวงกันนี้ใหได"
 SPA_suspend_the_constitution: "ระงับรัฐธรรมนูญ"
 SPA_suspend_the_constitution_desc: "เราจะไมมีวันกาวหนาตราบใดที่ยังยึดถือรัฐธรรมนูญที่พิสูจนครั้งแลวครั้งเลาวาบกพรองและออนแอ เราจะระงับมันเสีย เพื่อปูทางสูรัฐบาลเฉพาะกาลของทหารที่จะนําเราผานสงครามพี่นองฆากันอันจําเปนนี้ ซึ่งทายที่สุดจะเปดทางใหรัฐบาลอํานาจนิยมใหมที่เขมแข็ง"
 SPA_primo_de_rivera_prisoner_exchange: "แลกเปลี่ยนนักโทษปรีโม เด ริเบรา"
 SPA_primo_de_rivera_prisoner_exchange_desc: "ผูกอตั้งฟาลังเฆ โฆเซ อันโตนิโอ ปรีโม เด ริเบรา บุตรชายของอดีตผูเผด็จการมิเกล ปรีโม เด ริเบรา ถูกจําคุกตั้งแตกอนสงครามกลางเมืองจะเริ่มขึ้น ฝายสาธารณรัฐไดสงสัญญาณวายินดีแลกเปลี่ยนนักโทษกับเรา และหากเราตองการผูนําทางอุดมการณของเรากลับคืนมา เราตองตกลง"
 SPA_eliminate_the_carlists: "กําจัดพวกคารลิสต"
 SPA_eliminate_the_carlists_desc: "วิสัยทัศนของเราตอสเปนไปดวยกันไมไดกับของพวกคารลิสต ดวยการยึดติดกับราชวงศที่กําลังลมสลาย ผูนําที่ออนแอ และความคลั่งศาสนา พวกเขาเปนภัยตออนาคตของสเปนเอง เราตองถอนรากถอนโคนผูเห็นตางเหลานี้ เพื่อใหผูนําที่เขมแข็งอยางแทจริงไดกาวขึ้นมาและรวมประเทศดวยกําปนเหล็ก"
 SPR_carlist_uprising_flag: "พวกคารลิสตไดลุกฮือขึ้นแลว"
 SPA_absorb_carlist_remnants: "ดูดกลืนคารลิสตที่หลงเหลือ"
 SPA_absorb_carlist_remnants_desc: "เมื่อลัทธิคารลิสตแทบถูกปราบสิ้นแลว กลุมที่คลั่งนอยกวาในฝายนั้นอาจยังมีประโยชนบางในแนวหนา เราไมควรปลอยโอกาสนี้ใหหลุดลอยไป ทุกคนที่มีรางกายพรอมรบที่เราระดมไดจะชวยสงเสริมเปาหมายของฟาลังเฆโดยรวม"
 SPA_establish_the_directory: "กอตั้งคณะผูอํานวยการ"
 SPA_establish_the_directory_desc: "เอมิลิโอ โมลา สถาปนิกใหญของการลุกฮือ ไดรับแรงสนับสนุนเพียงพอจากคณะรัฐบาลทหารและผูนําทางการเมืองของฟาลังเฆ ที่จะเริ่มขั้นตอไปของแผนการ: การกอตั้งคณะผูอํานวยการซึ่งจะบริหารทุกดานของสงครามกลางเมือง จนกวาประเทศจะอยูในความควบคุมอยางมั่นคง"
 SPA_establish_the_directory_tt: "§Y[ROOT.GetName]§! จะเปนที่รูจักในชื่อ §Yคณะผูอํานวยการสเปน§!\n"
 SPA_a_one_party_state: "รัฐพรรคเดียว"
 SPA_a_one_party_state_desc: "ประชาธิปไตยไมใชเปาหมายในตัวเองอยางที่ฝายสาธารณรัฐอยากใหเราเชื่อ แทจริงแลวมันเปนเพียงเครื่องมือในการชวงชิงอํานาจควบคุมรัฐทั้งหมดจากผูที่ออนแอและไมคูควร เราจะยกเลิกพรรคการเมืองอื่นทั้งหมด เพื่อใหผูมีวิสัยทัศนอันแข็งแกรงไมถูกขัดขวางในการแสวงหาสเปนอันยิ่งใหญ"
 SPA_a_one_party_state_tt: "ครึ่งหนึ่งของการสนับสนุน§Yที่ไมใชฟาสซิสต§!รวมกันในปจจุบันจะถูกนํามาเปนบทลงโทษ§Rเสถียรภาพ§!:\n"
 SPA_expand_conscription: "ขยายการเกณฑทหาร"
 SPA_expand_conscription_desc: "สงครามกลางเมืองกําลังสรางความบอบชํ้าแกประเทศของเรา แตเราไมอาจผอนแรงกดดันตอฝายสาธารณรัฐได จําเปนตองมีการรุกครั้งใหม ที่ขับเคลื่อนดวยการเกณฑพลครั้งใหม"
 SPA_safeguard_the_freedom_of_worship: "ปกปองเสรีภาพในการนับถือศาสนา"
 SPA_safeguard_the_freedom_of_worship_desc: "ฝายสาธารณรัฐคุกคามแมกระทั่งศรัทธาในพระเจา และเราตองแสดงใหทุกคนเห็นชัดวาเราคือปอมปราการสุดทายของคริสตศาสนา เราจะปกปองสิทธิและเสรีภาพในการนับถือศาสนาของชาวคริสตทุกคน และทุกคนที่ปรารถนาสามารถรวมการตอสูของเราเพื่อปกปองสิ่งนี้ได"
 SPA_prepare_the_pyrenees_defenses: "เตรียมแนวปองกันพิเรนีส"
 SPA_prepare_the_pyrenees_defenses_desc: "มีขาวลือมาถึงเราวาฝายสาธารณรัฐไดติดตอ[FRA.GetNameDef]เพื่อขอความชวยเหลือ แมไมนาเปนไปได แตเราไมอาจเสี่ยงปลอยใหพรมแดนดานเหนือไรการปองกันหากเรื่องนี้เปนจริง ตองเริ่มเตรียมการปองกันทันทีเผื่อกรณีที่[FRA.GetAdjective]เขาแทรกแซง"
 SPA_prepare_the_pyrenees_defenses_tt: "สราง§Yปอมปราการ§!ระดับ 2 ในจังหวัดที่ติดพรมแดนฝรั่งเศสใน§Yแควนบาสก§! §Yนาวาร§! §Yอารากอนตะวันตก§! §Yอารากอนตะวันออก§! และ§Yกาตาลุญญา§!\n"
 SPA_develop_all_talent: "พัฒนาบุคลากรผูมีพรสวรรคทั้งปวง"
 SPA_develop_all_talent_desc: "ทุกคนที่สมควรไดรับจะไดรับการรับรองวาเขาถึงการศึกษาระดับสูงไดอยางพรอมเพรียง ตลอดจนเงินทุนที่จําเปนในการพัฒนาแนวคิดที่อาจเปนประโยชนตอรัฐ การลงทุนสรางสถานวิจัยและพัฒนาแหงใหมจะใหผลตอบแทนมากมายแกเราในหลากหลายสาขาอยางไมตองสงสัย"
 SPA_regional_agrarian_commissions: "คณะกรรมาธิการเกษตรประจําภูมิภาค"
 SPA_regional_agrarian_commissions_desc: "ชนบทถูกสงครามทําลายยอยยับ เพื่อไมใหประชาชนอดอยาก เราจะตั้งคณะกรรมาธิการเกษตรขึ้นในแตละภูมิภาคโดยมีผลทันที ซึ่งจะเพิ่มผลผลิตของที่ดินเพาะปลูกที่ไมไดรับความเสียหายใหสูงสุด และชวยใหเราเลี้ยงดูประชาชนได"
 SPA_the_national_syndicalist_state: "รัฐชาตินิยม-สหการนิยม"
 SPA_the_national_syndicalist_state_desc: "สงครามกลางเมืองจบลงแลว และถึงเวลาที่รัฐบาลทหารชั่วคราวจะสละอํานาจ ใหผูนําที่แทจริงของฟาลังเฆกาวขึ้นมาและนําสเปนเขาสูยุคใหม"
 SPA_the_national_syndicalist_state_tt: "§Y[ROOT.GetName]§! จะเปนที่รูจักในชื่อ §Yจักรวรรดิสเปน§!\n"
 SPA_syndicalize_production: "จัดการผลิตแบบสหการ"
 SPA_syndicalize_production_desc: "ขบวนการของเราแตกตางทั้งจากทุนนิยมและคอมมิวนิสต เราจะสรางสหการแหงชาติที่ลูกจางและนายจางสามารถทํางานรวมกันเพื่อเพิ่มผลผลิตสูงสุดเพื่อความเจริญของสเปนทั้งมวลแทน"
 SPA_strengthen_the_supreme_reality_of_spain: "เสริมความจริงสูงสุดแหงสเปน"
 SPA_strengthen_the_supreme_reality_of_spain_desc: "ลัทธิแบงแยกดินแดน ความเห็นตาง และอํานาจปกครองตนเองของทองถิ่นไดบั่นทอนรัฐสเปนมานานเกินไปแลว เราจะยกเลิกแนวคิดไรสาระเหลานี้ และนําเสนอความจริงใหมของสเปนที่เปนเอกภาพ ซึ่งทุกคนไมวาจะอยูกลุมหรือชนชั้นใดสามารถเชื่อมโยงและมีสวนรวมได"
 SPR_recovering_from_civil_war_focus_tt: "ปลดล็อกการตัดสินใจ§Yฟนฟูจากสงครามกลางเมือง§! ซึ่งทําใหสามารถคืนสถานะรัฐของสเปนที่ครอบครองอยูใหเปน§Yรัฐดินแดนหลัก§!ได หากมี§Yการยอมรับปกครอง§!สูงเพียงพอ\n"
 SPA_glory_and_wealth_on_the_sea_lanes: "เกียรติยศและความมั่งคั่งบนเสนทางเดินเรือ"
 SPA_glory_and_wealth_on_the_sea_lanes_desc: "ชะตากรรมของสเปนอยูเหนือมหาสมุทรเสมอมา เกียรติยศและความมั่งคั่งรอเราอยู เราเพียงตองฟนอํานาจควบคุมเสนทางเดินเรือเหมือนที่เคยทําในอดีต"
 SPA_improve_domestic_naval_facilities: "ปรับปรุงสิ่งอํานวยการทางเรือภายในประเทศ"
 SPA_improve_domestic_naval_facilities_desc: "กองทัพเรืออันยิ่งใหญตองการโครงสรางพื้นฐานอันยิ่งใหญ จําเปนตองมีอูตอเรือและสิ่งอํานวยการใหม และเราตองเริ่มกอสรางตั้งแตบัดนี้"
 SPA_a_great_maritime_power: "มหาอํานาจทางทะเล"
 SPA_a_great_maritime_power_desc: "ครั้งหนึ่งพลานุภาพของสเปนเปนที่เกรงขามทั่วมหาสมุทร แมโชคชะตาของเราจะถดถอยลงตลอดหลายศตวรรษ แตความผูกพันกับทองทะเลยังคงอยู เราจะโอบรับมรดกทางทะเลของเราและฟนการปรากฏตัวบนนานนํ้าทั่วโลกอีกครั้ง"
 SPA_commerce_protection: "การคุมครองการพาณิชย"
 SPA_commerce_protection_desc: "การคาโลกเปนกุญแจสูเศรษฐกิจที่แข็งแรงมากกวาที่เคยเปนมา ความสามารถในการคุมครองเรือพาณิชยของเราเองจะเสริมสถานะของเราในความขัดแยงใด ๆ ที่เราอาจตองเผชิญในอนาคต"
 SPA_exemplify_the_art_and_science_of_warfare: "แบบอยางแหงศิลปะและวิทยาศาสตรการสงคราม"
 SPA_exemplify_the_art_and_science_of_warfare_desc: "การสงครามเปนทั้งวิทยาศาสตรและศิลปะ และเราตองมอบเครื่องมือและสิ่งอํานวยการที่จําเปนใหผูที่มุงศึกษามันไดสํารวจแนวคิดของตน"
 SPA_the_will_to_empire: "เจตจํานงสูจักรวรรดิ"
 SPA_the_will_to_empire_desc: "เรามีความมุงมั่นที่จะสรางจักรวรรดิ เรายืนยันวาความสมบูรณทางประวัติศาสตรของสเปนอยูที่จักรวรรดิ เราเรียกรองสถานะอันโดดเดนในยุโรปใหแกสเปน และประกาศวาสเปนจะยังคงเปนแกนทางจิตวิญญาณที่ผูกโลกฮิสแปนิกไวดวยกัน"
 SPA_unite_iberia: "รวมไอบีเรีย"
 SPA_unite_iberia_desc: "โปรตุเกสและสเปนเคยรวมกันมากอน และบางคนวาควรรวมกันอีกครั้ง เราเห็นดวย การรวมไอบีเรียจะเสริมสถานะของเราในโลกไดอยางประมาณคามิได"
 SPA_absorb_the_portuguese_empire: "ดูดกลืนจักรวรรดิโปรตุเกส"
 SPA_absorb_the_portuguese_empire_desc: "ถึงเวลาแลวที่เราจะไมเพียงควบคุมแผนดินใหญของโปรตุเกส แตตองหลอมรวมชาติของเราใหเปนหนึ่งเดียวอยางแทจริง ขั้นแรกคือการผนวกรวมพวกเขาเขาสูอาณาจักรของเราโดยสมบูรณ และขั้นที่สองคือการพิชิตจักรวรรดิอาณานิคมโปรตุเกส ซึ่งเปนสวนหนึ่งของอํานาจครอบงําไอบีเรียใหมของเราดวย แมพวกเขาอาจยังไมมองเชนนั้น เรื่องนี้แกไขไดไมยาก"
 SPA_claim_the_aragonese_possessions: "อางสิทธิ์ในดินแดนของอารากอน"
 SPA_claim_the_aragonese_possessions_desc: "ราชอาณาจักรอารากอนเคยแผขยายไปทั่วทะเลเมดิเตอรเรเนียน สเปนในฐานะผูสืบทอดทางประวัติศาสตรของราชอาณาจักรอารากอน ยอมสมควรไดดินแดนเหลานี้กลับคืนมาอยูใตการควบคุมโดยชอบธรรม เราจะยืนยันสิทธินี้"
 SPA_reclaim_spanish_africa: "ขยายแอฟริกาของสเปน"
 SPA_reclaim_spanish_africa_desc: "ไมมีเหตุผลใดที่พรมแดนปจจุบันของดินแดนในแอฟริกาเหนือของเราจะตองตายตัว ดวยความออนแอของฝรั่งเศสในขณะนี้ บางทีอาจไมมีเวลาใดดีไปกวาตอนนี้ที่จะประกาศอางสิทธิ์ในพื้นที่นั้น"
 SPA_reassert_american_dominance: "ฟนอํานาจครอบงําในทวีปอเมริกา"
 SPA_reassert_american_dominance_desc: "ตลอดศตวรรษนับตั้งแตไดเอกราช ชาติตาง ๆ ในละตินอเมริกาไดแตทะเลาะเบาะแวงกันเอง พวกเขาลืมพลังที่อยูในเอกภาพทางวัฒนธรรมของเรา เราจึงจะเตือนใหพวกเขาจําวาเราคือแกนกลางที่พวกเขาโคจรรอบ"
 SPA_reassert_american_dominance_tt: "ปลดล็อกการตัดสินใจ§Yฟนอํานาจครอบงําในทวีปอเมริกา§! ซึ่งชวยใหปราบประเทศในทวีปอเมริกาที่ออนแอกวาใหสยบไดอยางสันติ\n"
 SPA_retake_the_americas: "ยึดทวีปอเมริกาคืน"
 SPA_retake_the_americas_desc: "มหาอํานาจที่ใหญกวาในละตินอเมริกาไมมีเจตนาจะยอมรับการนําของเราโดยดี - และเราก็จะไมไดดินแดนเกาคืนจาก[USA.GetNameDef]โดยไมตองสูรบ แมความทาทายจะยิ่งใหญ แตความทะเยอทะยานแหงจักรวรรดิของเราใกลเปนจริงแลว หากเพียงเรากาวขามมันไปได"
 SPA_embrace_the_spanish_destiny: "โอบรับชะตากรรมของสเปน"
 SPA_embrace_the_spanish_destiny_desc: "สเปนมีชะตากรรมอันเปนเอกลักษณรออยู: มอบเสรีภาพใหชาวสเปนทุกคนไดเปนสวนหนึ่งของชาติที่เขมแข็งและเสรี กลับมาครองสถานะอันโดดเดนในโลกแมศัตรูจะคัดคาน และปกปองวิถีชีวิตแบบคริสเตียน"
 SPA_the_national_and_popular_army_of_spain: "กองทัพแหงชาติและประชาชนของสเปน"
 SPA_the_national_and_popular_army_of_spain_desc: "พลานุภาพทางทหารของชาติสเปนใหมจะถูกจัดเปนกองทัพแหงชาติและประชาชน ซึ่งชายผูมีรางกายสมบูรณทุกคนจะไดรับเกียรติใหเขาประจําการ"
 SPA_mandatory_pre_military_training: "การฝกกอนเขารับราชการทหารภาคบังคับ"
 SPA_mandatory_pre_military_training_desc: "เพื่อเตรียมพรอมเขาประจําการในกองทัพ ชายทุกคนจะตองไดรับการฝกกอนเขารับราชการทหารภาคบังคับ"
 SPA_all_shall_serve: "ทุกคนตองรับใชชาติ"
 SPA_all_shall_serve_desc: "สเปนใหมคือการแสดงออกถึงเจตจํานงของชาวสเปนทุกคน ดังนั้นทุกคนจึงตองไดทําหนาที่ปกปองมัน เกณฑการรับสมัครจึงตองขยายใหกวางขึ้นตามนั้น"
 SPA_the_army_of_africa_model: "ตนแบบ "กองทัพแหงแอฟริกา""
 SPA_the_army_of_africa_model_desc: "ความสําเร็จของกองทัพแหงแอฟริกาในสงครามกลางเมืองเปนที่ประจักษ กองทัพใหมของเราตองไดมาตรฐานที่พวกเขาวางไว เราจึงจะสรางกองทัพตามแบบอยางของพวกเขา"
 SPA_equipment_modernization: "ปรับปรุงยุทโธปกรณใหทันสมัย"
 SPA_equipment_modernization_desc: "กองทัพใหมของเราคูควรกับอาวุธที่ดีที่สุดเทานั้น และเราตองพัฒนาอาวุธใหมใหสอดคลองกัน"
 SPA_artillery_modernization: "ปรับปรุงปนใหญใหทันสมัย"
 SPA_artillery_modernization_desc: "ปนใหญเปนสวนสําคัญของการสงครามสมัยใหม เราจึงควรปรับปรุงปนเกาของเราดวยรุนใหมที่ทรงพลังกวา"
 SPA_expand_the_air_branch: "ขยายเหลาทัพอากาศ"
 SPA_expand_the_air_branch_desc: "สงครามกลางเมืองแสดงใหเราเห็นชัดถึงบทบาทสําคัญของแสนยานุภาพทางอากาศ หากเราจะเปนกองกําลังที่ใครก็ตองเกรงขาม นี่คือดานที่เราตองขยาย"
 SPA_expand_the_special_forces: "ขยายหนวยรบพิเศษ"
 SPA_expand_the_special_forces_desc: "ผูเชี่ยวชาญเพียงหยิบมือสามารถทําสิ่งที่ทหารราบปกตินับสิบทําไมได เราจะเริ่มการฝกเฉพาะทางสําหรับภารกิจเฉพาะ เพื่อใหมั่นใจวาเรามีเครื่องมือที่จําเปนพรอมใชหากมีความจําเปน"
 SPA_motorization: "การปรับเปนยานยนต"
 SPA_motorization_desc: "การปรับกองทัพเปนยานยนตขนานใหญเปดโอกาสทางยุทธวิธีและยุทธศาสตรใหม ๆ มากมาย นี่คือความไดเปรียบที่เราปลอยผานไปไมได"
 SPA_an_armored_corps: "กองพลยานเกราะ"
 SPA_an_armored_corps_desc: "สเปนตองมีกองพลยานเกราะ หากไมตองการถูกเพื่อนบานแซงหนา"
 SPA_join_the_axis: "เขารวมฝายอักษะ"
 SPA_join_the_axis_desc: "อนาคตของสเปนอยูที่การโคนลมระเบียบโลกที่เปนอยู เราตองเปนพันธมิตรกับผูที่มีแนวคิดเดียวกัน เพื่อรวมพลังของเราเขากับพวกเขา"
 SPA_fascist_economic_aid: "ความชวยเหลือทางเศรษฐกิจจากฟาสซิสต"
 SPA_fascist_economic_aid_desc: "สงครามกลางเมืองไดทําลายชาติของเรายอยยับ แตบางทีพันธมิตรใหมของเราอาจยินดีชวยเหลือโครงการฟนฟูของเรา"
 SPA_facilitate_pyrenees_freight_transports: "อํานวยความสะดวกการขนสงสินคาขามพิเรนีส"
 SPA_facilitate_pyrenees_freight_transports_desc: "การลําเลียงวัสดุใหมจากทางเหนือตองไดรับการอํานวยความสะดวกยิ่งขึ้นเพื่อใหทันกับความตองการ เราจึงจะขยายทางรถไฟที่ผานเทือกเขาพิเรนีส"
 SPA_facilitate_pyrenees_freight_transports_tt: "เพิ่ม§Yโครงสรางพื้นฐาน§!สูงสุดใน§Yมาดริด§! §Yกวาดาลาฮารา§! §Yอารากอนตะวันออก§! §Yกาตาลุญญา§! §Yบูรโกส§! และ§Yแควนบาสก§!"
 SPA_improve_cross_country_railways: "ปรับปรุงทางรถไฟขามประเทศ"
 SPA_improve_cross_country_railways_desc: "การขยายเครือขายทางรถไฟแหงชาติไมเพียงสรางงานที่จําเปนอยางยิ่ง แตยังอํานวยความสะดวกในการเคลื่อนยายทหาร เสบียง และเปนความภาคภูมิใจของชาติสําหรับชาวสเปนทุกคน"
 SPA_support_the_war_industry: "สนับสนุนอุตสาหกรรมสงคราม"
 SPA_support_the_war_industry_desc: "กอนที่เราจะขยายอุตสาหกรรมสงครามได เราตองขยายอุตสาหกรรมสนับสนุนที่อุตสาหกรรมสงครามตองพึ่งพาเสียกอน"
 SPA_italian_shipbuilding_expertise: "ความเชี่ยวชาญการตอเรือของอิตาลี"
 SPA_italian_shipbuilding_expertise_desc: "ดวยการเชิญผูเชี่ยวชาญชาวอิตาลี เรานาจะปรับปรุงขีดความสามารถในการตอเรือได ทําใหขยายกองทัพเรือไดงายขึ้น โดยเฉพาะเรือขนาดใหญที่สุด"
 SPA_the_duty_to_work: "หนาที่ในการทํางาน"
 SPA_the_duty_to_work_desc: "ชาวสเปนทุกคนมีหนาที่ตอรัฐ หากหนาที่นั้นไมไดกําหนดใหพวกเขาออกรบในแนวหนา ก็จะกําหนดใหพวกเขาทําทุกอยางที่ทําไดเพื่อสงเสบียงและติดอาวุธใหแกผูที่ออกรบ"
 SPA_expand_the_war_industry: "ขยายอุตสาหกรรมสงคราม"
 SPA_expand_the_war_industry_desc: "รัฐที่ทรงอํานาจตองมีอุตสาหกรรมสงครามขนาดใหญหากจะแสดงพลังนั้นออกมา - และของเราก็ใหญกวานี้ไดอีก"
 SPA_national_recovery: "การฟนฟูชาติ"
 SPA_national_recovery_desc: "ถึงเวลาแลวที่ตองรวมแรงรวมใจกันทั้งชาติเพื่อฟนตัวจากความพินาศของสงครามกลางเมือง"
 SPA_autarky: "อัตตาธิปไตยทางเศรษฐกิจ"
 SPA_autarky_desc: "เพื่อไมใหสถานะของเราถูกผูอื่นคุกคาม เราตองทําใหเศรษฐกิจของเราพึ่งพาตนเองไดอยางสมบูรณ"
 SPA_spanish_austerity: "มาตรการรัดเข็มขัดของสเปน"
 SPA_spanish_austerity_desc: "แมไมมีใครตองการ แตนโยบายรัดเข็มขัดก็จําเปนเพื่อปลดปลอยเงินทุนที่เราตองใชในการฟนฟูชาติ"
 SPA_reduce_reliance_on_foreign_resources: "ลดการพึ่งพาทรัพยากรตางชาติ"
 SPA_reduce_reliance_on_foreign_resources_desc: "การพึ่งพาผูอื่นเปนจุดออนที่มีแตศัตรูที่อาจเกิดขึ้นจะฉวยประโยชนได เราตองผลักดันการพึ่งพาตนเองในทรัพยากรทุกอยางที่ทําได"
 SPA_reduce_reliance_on_foreign_resources_tt: "ปลดล็อกการตัดสินใจเฉพาะ§Yสํารวจหาทรัพยากร§! ซึ่งชวยใหขยายแหลงทรัพยากรที่มีอยูและพัฒนาแหลงทรัพยากรใหมบนแผนดินใหญได\n"
 SPA_expand_the_axis_gold_trade: "ขยายการคาทองคํากับฝายอักษะ"
 SPA_expand_the_axis_gold_trade_desc: "ฝายอักษะตองการการคาอยางสิ้นหวัง เพราะถูกการปดลอมของฝายสัมพันธมิตรบีบรัด ทองคําของพวกเขาไหลเขาสูชาติของเรา ซึ่งพวกเขาใชซื้อทรัพยากรธรรมชาติทั้งจากเราและจากประเทศเปนกลางอื่น ๆ เราไดกําไรมหาศาลจากเรื่องนี้ บางทีเราควรสงเสริมมันใหมากยิ่งขึ้นไปอีก..."
 SPA_ensure_agricultural_self_sufficiency: "ทําใหเกษตรกรรมพึ่งพาตนเองได"
 SPA_ensure_agricultural_self_sufficiency_desc: "เราตองปลดตัวเองจากการนําเขาอาหารจากตางประเทศ - เกษตรกรรมของเราตองขยายจนเลี้ยงดูคนทั้งชาติได"
 SPA_unify_the_nationalist_front: "รวมแนวรวมชาตินิยม"
 SPA_unify_the_nationalist_front_desc: "ฝายกบฏ หรือ "ฝายชาตินิยม" ตามที่พวกเขาเริ่มเรียกตัวเอง เปนการรวมตัวกันอยางหลวม ๆ ของกลุมตาง ๆ ที่มีจุดรวมเพียงความปรารถนาจะโคนลมสาธารณรัฐ หนทางสูความสําเร็จอยูที่การหลีกเลี่ยงการแตกคอกันเองและมุงตอสูกับศัตรูรวมของเรา"
 SPA_save_the_alcazar: "กอบกูอัลกาซาร!"
 SPA_save_the_alcazar_desc: "ปอมอัลกาซารในโตเลโดยังอยูในมือของกองกําลังที่ภักดีตออุดมการณของเรา แตพวกเขากําลังถูกลอม! การปลดปลอยพวกเขา แมไมสําคัญทางยุทธศาสตร ก็จะเปนชัยชนะครั้งใหญทางการโฆษณาชวนเชื่อ และตอกยํ้าสถานะของฟรันซิสโก ฟรังโก ในฐานะผูนําโดยพฤตินัยของคณะรัฐบาลทหาร"
 SPA_martyrdom_for_primo_de_rivera: "ความเปนมรณสักขีของปรีโม เด ริเบรา"
 SPA_martyrdom_for_primo_de_rivera_desc: "โฆเซ อันโตนิโอ ปรีโม เด ริเบรา ผูกอตั้งพรรคฟาลังเฆ ถูกจําคุกตั้งแตกอนสงครามกลางเมืองเริ่มขึ้น แมเราจะไดรับขอเสนอแลกเปลี่ยนนักโทษ แตบางทีคูแขงทางการเมืองที่อาจเกิดขึ้นผูนี้จะรับใชอุดมการณของเราไดดีกวาในฐานะมรณสักขีที่ถูกประหาร... เราจะทําใหแนใจวาการเจรจาแลกเปลี่ยนนักโทษจะ 'ลมเหลว'"
 SPA_caudillo_of_spain: "เกาดิโยแหงสเปน"
 SPA_caudillo_of_spain_desc: "ความสําเร็จของฟรันซิสโก ฟรังโก พิสูจนตัวเองแลว และคูแขงที่อาจเกิดขึ้นของเขาตางพบจุดจบกอนเวลาอันควร แรงสนับสนุนในคณะรัฐบาลทหารใหแตงตั้งเขาเปนผูนําอยางเปนทางการกําลังเพิ่มขึ้น และที่เหลือก็เพียงการประกาศอยางเปนทางการเทานั้น"
 SPA_extol_the_martyrs_of_the_war: "ยกยองวีรชนแหงสงคราม"
 SPA_extol_the_martyrs_of_the_war_desc: "ผูที่สละชีพเพื่ออุดมการณของเราควรไดรับการรําลึกถึงและยกยองในการเสียสละ การกระทําของพวกเขาควรเปนแบบอยางแกเราทุกคน"
 SPA_consolidate_the_north: "รวบรวมภาคเหนือ"
 SPA_consolidate_the_north_desc: "กาวแรกบนเสนทางสูชัยชนะควรเปนการพิชิตและรวบรวมดินแดนทางเหนือใหมั่นคง เมื่อสําเร็จแลว เราก็จะเคลื่อนไปยังพื้นที่ออนแออื่น ๆ บนแนวรบของฝายสาธารณรัฐได"
 SPA_foment_a_carlist_split: "ยุยงใหคารลิสตแตกแยก"
 SPA_foment_a_carlist_split_desc: "พวกคารลิสตแตกแยกภายในไมตางจากแนวรวมชาตินิยมเอง ดวยการยุใหผูนําคารลิสตแตละคนขัดแยงกันเอง เราจะบั่นทอนอํานาจของพวกเขา และเปดทางใหเราทําขอตกลงแยกกับกลุมคารลิสตตาง ๆ ได"
 SPA_a_methodical_approach: "แนวทางที่เปนระบบ"
 SPA_a_methodical_approach_desc: "กุญแจสูความสําเร็จในสงครามกลางเมืองนี้ไมไดอยูที่การดําเนินกลยุทธอยางกลาบาบิ่นและการโจมตีอยางสะเพรา แตอยูที่การวางแผนอยางรอบคอบเปนระบบ และการโจมตีอยางจงใจและแมนยํา"
 SPA_tackle_the_vulnerable_fronts: "จัดการแนวรบที่ออนแอ"
 SPA_tackle_the_vulnerable_fronts_desc: "มีการพบจุดออนในบางสวนของแนวหนาขาศึก เราควรมุงที่พื้นที่เหลานี้เพื่อใหการรุกของเราไดผลสูงสุด"
 SPA_tackle_the_vulnerable_fronts_tt: "อัปเกรดการตัดสินใจ§Yการรุกในสงครามกลางเมือง§! โดยใหโบนัสการรบชั่วคราวตอขาศึกเมื่อเริ่มการรุก\n"
 SPA_integrate_the_requetes: "ผนวกรวมหนวยเรเกเต"
 SPA_integrate_the_requetes_desc: "หนวยเรเกเตของคารลิสตที่เปดรับแนวคิดของเรามากกวาควรถูกผนวกรวมเขากับกองทัพของเราใหใกลชิดยิ่งขึ้น ประสบการณและการฝกฝนของพวกเขาจะมีคาอยางยิ่งในการตอสูขางหนา"
 SPA_portuguese_aid: "ความชวยเหลือจากโปรตุเกส"
 SPA_portuguese_aid_desc: "เราตองรับความชวยเหลือไมวาจะมาจากที่ใด โปรตุเกสซึ่งเคยใหที่พักพิงแกผูนําหลายคนของเราที่ตองลี้ภัยหลังการกบฏที่ลมเหลวในป 1932 อาจยินดีใหความชวยเหลือดานวัตถุแกเราหากเราขอ และนี่อาจเปนรากฐานของความรวมมือที่ใกลชิดยิ่งขึ้นในอนาคต"
 SPA_the_iberian_pact: "กติกาสัญญาไอบีเรีย"
 SPA_the_iberian_pact_desc: "ความมั่นคงของสองชาติเราขึ้นอยูกับความสัมพันธอันดีระหวางกัน เราควรเสนอกติกาสัญญาวาทั้งสเปนและโปรตุเกสจะอยูขางเดียวกันเสมอในสงครามโลกใด ๆ ที่เขารวม หรือพันธมิตรใด ๆ ที่เขาเปนสมาชิก ไอบีเรียที่เปนหนึ่งเดียวคือไอบีเรียที่แข็งแกรง!"
 SPA_the_iberian_pact_tt: "ขอตกลงนี้ผูกมัดใหแตละฝายตองเขารวมฝายใด ๆ หรือเขาขางเดียวกันในสงครามใด ๆ ที่อีกฝายเขารวม\n"
 SPA_the_iberian_pact_tt_2: "§R[POR.GetNameDefCap]ตองอนุมัติขอตกลงกอนโบนัสจึงจะมีผล§!\n"
 SPA_the_latin_bloc: "กลุมละติน"
 SPA_the_latin_bloc_desc: "กลุมมหาอํานาจกําลังกอตัวขึ้นทั่วโลก แทนที่จะเขาไปพัวพันกับความตึงเครียดที่เพิ่มขึ้นระหวางพวกเขา เราควรตั้งกลุมอํานาจของเราเองรวมกับชาติที่มีวัฒนธรรมและอุดมการณคลายเรา นั่นคือประเทศละตินรอบทะเลเมดิเตอรเรเนียน"
 SPA_utilize_the_intellectuals: "ใชประโยชนจากปญญาชน"
 SPA_utilize_the_intellectuals_desc: "ผูมีสติปญญาเหนือคนทั่วไปควรไดรับทรัพยากรที่จําเปน เพื่อรับใชประเทศไดดีที่สุดในแบบที่ทหารของเราทําไมได"
 SPA_banish_the_party_leaders: "เนรเทศผูนําพรรค"
 SPA_banish_the_party_leaders_desc: "ผูนําพรรคของฟาลังเฆและคารลิสตตางพยายามผลักดันวาระของตนเองมากขึ้นเรื่อย ๆ จนกลายเปนหนามยอกอก ดวยการฉวยประโยชนจากความไมเปนเอกภาพของพวกเขาเพื่อบอนทําลายสถานะ เราจะมีความชอบธรรมในการเนรเทศผูนําที่แข็งขอเหลานี้ออกนอกประเทศ แลวแทนที่ดวยหุนเชิดที่ภักดีตอฟรังโก"
 SPA_fuse_the_parties: "หลอมรวมพรรค"
 SPA_fuse_the_parties_desc: "การปูพื้นฐานที่จําเปนไดเสร็จสิ้นแลว และถึงเวลารวมฟาลังเฆและคารลิสตเปนพรรคเดียว โดยมีฟรันซิสโก ฟรังโก เปนผูนํา"
 SPA_fuse_the_parties_tt: "§Gนําภารกิจ§! §Yการลุกฮือของคารลิสตที่ใกลเขามา§! §Gออก§!\n"
 SPA_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 SPA_join_the_allies_desc: "เราเห็นชัดแลววาลูกตุมกําลังแกวงไปทางใด - เราจะเขารวมฝายสัมพันธมิตร รับความชวยเหลือทางเศรษฐกิจอันทรงพลังจากพวกเขา และทําใหแนใจวาเราอยูในฝงที่พวกเขาพอใจเมื่อพวกเขาชนะสงครามอยางหลีกเลี่ยงไมได"
 SPA_the_stabilization_plan: "แผนสรางเสถียรภาพ"
 SPA_the_stabilization_plan_desc: "เราตองหันออกจากความฝนอันไรเหตุผลของฟาลังเฆเรื่องอัตตาธิปไตยทางเศรษฐกิจ และนโยบายเศรษฐกิจที่ไปไมรอดซึ่งถูกนํามาใชเพื่อไลตามมัน เพื่อใหเศรษฐกิจทัดเทียมกับสวนอื่นของโลก เราตองหันไปหาการเปดเสรีทางเศรษฐกิจแทน ซึ่งหวังวาจะจุดประกายการเฟองฟูทางเศรษฐกิจที่เปนประโยชนตอชาวสเปนทุกคน"
 SPA_expand_spanish_bases: "ขยายฐานทัพสเปน"
 SPA_expand_spanish_bases_desc: "เหลาจักรวรรดินิยมที่เราเปนพันธมิตรดวยตองการใชฐานทัพของเราเพื่อแผอิทธิพลไปทั่วโลก เพื่อรองรับพวกเขา เราตองขยายฐานทัพอากาศและฐานทัพเรือบนภาคพื้นทวีปของเรา"
 SPA_capitalist_economic_aid: "ความชวยเหลือทางเศรษฐกิจจากโลกทุนนิยม"
 SPA_capitalist_economic_aid_desc: "ความชวยเหลือทางเศรษฐกิจจากตะวันตกจะมีคาอยางยิ่งตอการฟนฟูประเทศของเราหลังผานพนความทุกขยาก"
 SPA_improve_living_standards: "ยกระดับคุณภาพชีวิต"
 SPA_improve_living_standards_desc: "ทุกคนตองไดรับสวนแบงจากผลประโยชนของการฟนตัวทางเศรษฐกิจของชาติ ไมวาจะมีสถานะใดก็ตาม"
 SPA_domestic_industrial_developments: "พัฒนาอุตสาหกรรมภายในประเทศ"
 SPA_domestic_industrial_developments_desc: "นวัตกรรมของตะวันตกสามารถปรับใชใหเหมาะกับแรงงานสเปน โดยเลือกสิ่งที่ดีที่สุดจากทั้งสองโลก เพื่อเรงการฟนฟูประเทศ"
 SPA_the_spanish_miracle: "ปาฏิหาริยสเปน"
 SPA_the_spanish_miracle_desc: "แผนสรางเสถียรภาพประสบผลสําเร็จเกินกวาที่เราเคยวาดฝนไว ความเฟองฟูทางเศรษฐกิจที่เรากําลังเผชิญอยูนี้เรียกไดวาเปนปาฏิหาริยโดยแท!"
 SPA_adopt_the_26_points: "รับหลักการ 26 ขอ"
 SPA_adopt_the_26_points_desc: "เมื่อตัดขอกําหนดที่หามการรวมพรรคการเมืองออกจาก "หลักการ 27 ขอ" ของฟาลังเฆไดอยางสะดวกเหมาะเจาะแลว "หลักการ 26 ขอ" ที่ไดออกมาก็กลายเปนแถลงการณพรรคชั้นดีที่เราสามารถหยิบยืมมาเปนแรงบันดาลใจในการกําหนดนโยบายรัฐบาลได"
 SPA_direct_the_universities: "กํากับทิศทางมหาวิทยาลัย"
 SPA_direct_the_universities_desc: "ผูมีความสามารถในแวดวงวิชาการยอมถูกใชประโยชนไดดีกวานี้ หากนําไปทําการวิจัยที่มุงเปาเพื่อการทหาร เราจะสั่งการมหาวิทยาลัยตาง ๆ ใหเปนไปตามนั้น"
 SPA_dictator_for_life: "ผูนําเผด็จการตลอดชีพ"
 SPA_dictator_for_life_desc: "ฟรังโกรับใชชาติมาเปนอยางดี เราไมเห็นความจําเปนที่จะตองเปลี่ยนแปลงสภาพการณนี้ และยิ่งไมควรหวนกลับไปสูระบอบกษัตริยอันออนแอแบบเกา"
 SPA_invest_in_naval_infrastructure: "ลงทุนโครงสรางพื้นฐานทางทะเล"
 SPA_invest_in_naval_infrastructure_desc: "สเปนตองการสิ่งอํานวยความสะดวกทางทะเลแหงใหมเพื่อรองรับการขยายกองเรือของเรา"
 SPA_expand_the_slipways: "ขยายคานเรือ"
 SPA_expand_the_slipways_desc: "ที่ผานมาเราตองซื้อเรือขนาดใหญที่สุดจากชาติอื่น เราควรขยายคานเรือของเราเองใหใหญขึ้น เพื่อใหมีอิสระในการตอเรือเหลานี้ไดดวยตนเอง"
 SPA_the_plan_imperial: ""แผนจักรวรรดิ""
 SPA_the_plan_imperial_desc: "เราจะเริ่มโครงการอันยิ่งใหญเพื่อฟนสถานะของกองทัพเรือสเปนใหกลับมาเปนหนึ่งในกองทัพเรือที่ใหญที่สุดในโลก"
 SPA_restart_small_scale_shipbuilding: "ฟนการตอเรือขนาดเล็ก"
 SPA_restart_small_scale_shipbuilding_desc: "กองทัพเรือของเราตองการเรือคุมกันจํานวนมากในขนาดที่อูตอเรือขนาดเล็กภายในประเทศสามารถสรางได เราควรสงเสริมใหอูเหลานี้พัฒนาแบบเรือใหม ๆ"
 SPA_la_division_azul: "กองพลสีนํ้าเงิน"
 SPA_la_division_azul_desc: "แมเราจะกําจัดภัยคุกคามคอมมิวนิสตบนคาบสมุทรไอบีเรียไดแลว แตตนตอแหงความชั่วรายยังคงคุกคามอยูทางตะวันออก ขณะที่ผูอื่นตองรับภาระหนักในการสูรบ เราควรสงกองพลอาสาสมัครไปรวมทําหนาที่ของเราในการตอตานภัยคุกคามนี้"
 SPA_the_tangiers_enclave: "ดินแดนแทนเจียร"
 SPA_the_tangiers_enclave_desc: "นครแทนเจียรถูกจัดตั้งเปนเขตนานาชาติในป 1923 ภายใตการบริหารรวมกันของฝรั่งเศส สเปน และสหราชอาณาจักร เมื่อผูบริหารรวมอีกสองชาติกําลังพัวพันอยูในสงคราม เราจึงตองกาวเขามารับผิดชอบการปกปองนครแหงนี้แตเพียงผูเดียว"
 SPA_the_tangiers_enclave_tt: "§Rการกระทํานี้อาจทําใหผูบริหารรวมของเขตนานาชาติไมพอใจ!§!\n"
 SPA_demand_french_north_africa: "เรียกรองแอฟริกาเหนือของฝรั่งเศส"
 SPA_demand_french_north_africa_desc: "อาณานิคม[FRA.GetAdjective]ออนแอลงหลังจากประเทศแมลมสลาย เราควรเสนอการคุมครองให โดยเขาใจกันโดยนัยวาการปฏิเสธไมใชทางเลือก"
 SPA_restore_the_monarchy: "ฟนฟูระบอบกษัตริย"
 SPA_restore_the_monarchy_desc: "รัฐบาลเฉพาะกาลไดทําหนาที่ขับไลพวกคอมมิวนิสตและยุติสาธารณรัฐที่สองเสร็จสิ้นแลว บัดนี้ถึงเวลาฟนฟูราชบัลลังกสเปน!"
 SPA_restore_the_monarchy_tt: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yราชอาณาจักรสเปน§!\n"
 SPA_stamp_out_the_maquis: "กวาดลางมากี"
 SPA_stamp_out_the_maquis_desc: "มากี ซึ่งเปนเศษซากของศัตรูเรา ยังคงทําสงครามกองโจรอยางตอเนื่องเพื่อทาทายอํานาจการควบคุมแผนดินใหญสเปนของเรา เมื่อเวลาผานไป อิทธิพลของพวกเขาเสื่อมถอยลง และบัดนี้ถึงเวลาเหมาะที่จะถอนรากถอนโคนพวกเขาใหสิ้นซาก"
 SPA_defenses_against_strategic_bombing: "การปองกันการทิ้งระเบิดทางยุทธศาสตร"
 SPA_defenses_against_strategic_bombing_desc: "หากเราเขารวมความขัดแยงระดับโลก เราตองมั่นใจวาเมืองตาง ๆ ไดรับการปกปองอยางเพียงพอจากการทิ้งระเบิดทางยุทธศาสตรขนาดใหญที่ศัตรูในอนาคตยอมนํามาใชกับเราอยางหลีกเลี่ยงไมได"
 SPA_defenses_against_invasion: "การปองกันการรุกราน"
 SPA_defenses_against_invasion_desc: "แนวชายฝงของสเปนทอดยาวกวางไกล เราตองทําทุกวิถีทางเพื่อใหศัตรูเห็นวาการรุกรานเปนเรื่องไมนาพิสมัย ปอมปราการที่แข็งแกรงนาจะทําใหรางวัลที่ไดไมคุมกับราคาที่ตองจาย"
 SPA_defenses_against_invasion_tt: "สราง §Yปอม 1 แหง§! และ §Yปอมชายฝง 2 แหง§! ในจังหวัดดินแดนหลักบนภาคพื้นทวีปที่มี §Yฐานทัพเรือ§!\n"
 SPA_retake_gibraltar: "ยึดยิบรอลตารคืน"
 SPA_retake_gibraltar_desc: "เปนเวลากวาสองศตวรรษแลวที่ยิบรอลตารถูกพรากไปจากออมอกอันอบอุนของสเปน แผลเปนของอังกฤษบนใบหนาแหงไอบีเรียนี้จะคงอยูตอไปไมไดอีกแลว"
 SPA_claim_west_africa: "อางสิทธิ์แอฟริกาตะวันตก"
 SPA_claim_west_africa_desc: "การครอบงําแอฟริกาตะวันตกของฝรั่งเศสนั้นไมชอบธรรมโดยสิ้นเชิง ดินแดนนี้เปนจุดเชื่อมตอทางภูมิศาสตรตามธรรมชาติกับอาณานิคมของเราในอิเควทอเรียลกินี จึงควรถือวาเปนสวนหนึ่งของจักรวรรดิอาณานิคมสเปนในทุกแงมุม"
 SPA_supremacy_of_the_communion: "อํานาจสูงสุดแหงคอมมูนิออน"
 SPA_supremacy_of_the_communion_desc: "ประหนึ่งที่พระเจาทรงสรางฟาและแผนดิน คอมมูนิออนจารีตนิยมก็ถือกุญแจสูอนาคตอันเปนเอกภาพของสเปนฉันนั้น การลุกฮือของฝายคารลิสตในศตวรรษที่ 19 อาจถูกขัดขวาง แตจิตวิญญาณของพวกเขาไมเคยแตกสลาย ผูที่ศรัทธามั่นในพระศาสนาพรอมจะลุกขึ้นตอตานสาธารณรัฐอีกครั้ง"
 SPA_prepare_the_carlist_insurrection: "เตรียมการลุกฮือของคารลิสต"
 SPA_prepare_the_carlist_insurrection_desc: "พันธมิตรของเรากับฟาลังเฆเกิดขึ้นจากความจําเปน และอายุขัยของมันนับถอยหลังไดเปนสัปดาหแลว เราตองโจมตีพันธมิตรจอมปลอมของเรากอนที่พวกเขาจะโจมตีเรา และกําจัดอุดมการณอันบกพรองของพวกเขากอนที่มันจะไดหยั่งรากในจิตใจของสามัญชน"
 SPA_prepare_the_carlist_insurrection_tt: "ปลดล็อกการตัดสินใจ §Yเตรียมการลุกฮือของคารลิสต§! ซึ่งชวยใหยึดรัฐที่ควบคุมอยูไวเปนของฝายคารลิสตในการลุกฮือ\n\nนอกจากนี้ ยังยึด §Yบูรโกส§! และ §Yนาวารรา§! ไวใหฝายคารลิสต หากควบคุมรัฐเหลานี้อยู"
 SPA_contact_the_union_militar_espanola: "ติดตอสหภาพทหารสเปน"
 SPA_contact_the_union_militar_espanola_desc: "สหภาพทหารสเปน (Unión Militar Española) สมาคมลับขนาดใหญของเหลานายทหารที่สมคบคิดตอตานสาธารณรัฐ มีสมาชิกหลายคนที่อาจเห็นใจอุดมการณของเรา เราควรติดตอพวกเขาและหาการสนับสนุนจากผูนําเหลานี้ใหไดมากที่สุดเทาที่จะทําได เพื่อรอวันที่เวลานั้นมาถึง"
 SPA_head_the_junta_nacional: "นําคณะกรรมการแหงชาติ"
 SPA_head_the_junta_nacional_desc: "องคกรบริหารสูงสุดในยามสงครามของกลไกสงครามคารลิสต คือ คณะกรรมการสงครามแหงชาติคารลิสต (Junta Nacional Carlista de Guerra) ตองการผูนําที่จะรวมคณะกรรมการคารลิสตระดับภูมิภาคตาง ๆ ใหเปนหนึ่งเดียว มานูเอล ฟล กอนเด สามารถเปนผูนําคนนั้นได"
 SPA_unite_the_requetes: "รวมกองกําลังเรเกเต"
 SPA_unite_the_requetes_desc: "คณะกรรมการคารลิสตระดับภูมิภาคปฏิบัติการอยางเปนอิสระจากกันมานานเกินไปแลว เราตองรวมพวกเขาและกองกําลังติดอาวุธของพวกเขา คือ เรเกเต ใหเปนหนึ่งเดียว เพื่อจัดระเบียบความพยายามทางสงครามของคารลิสตใหดีขึ้นและขจัดความแตกแยกภายใน"
 SPA_the_war_in_the_north: "สงครามทางภาคเหนือ"
 SPA_the_war_in_the_north_desc: "ภาคเหนือเปนหัวใจของขบวนการคารลิสตมาโดยตลอด การลุกฮือใด ๆ ตองมุงยึดพื้นที่นี้ไวเปนฐานปฏิบัติการของเรา"
 SPA_revive_the_spirit_of_the_carlist_wars: "ปลุกจิตวิญญาณแหงสงครามคารลิสต"
 SPA_revive_the_spirit_of_the_carlist_wars_desc: "สงครามคารลิสตในศตวรรษที่ 19 อาจเปนความพายแพอันนาเสียดายตออุดมการณของเรา แตจิตวิญญาณแหงการตอตานยังคงอยูจนถึงทุกวันนี้ เราจะไมหยุดพักจนกวารัชทายาทผูชอบธรรมจะไดประทับบนราชบัลลังกสเปนและพิทักษศรัทธาคริสตใหแกชาวสเปนทุกคน"
 SPA_arms_modernization: "ปรับปรุงอาวุธใหทันสมัย"
 SPA_arms_modernization_desc: "ทหารของเราอาจเปนผูที่ทุมเท ภักดี เครงศาสนา แรงกลา และไดรับการฝกมาดีที่สุด แตพวกเขายังตองการอาวุธที่เพียงพอเพื่อปกปองคริสตศาสนา เราจะทําใหแนใจวาพวกเขามีสิ่งที่จําเปน"
 SPA_no_compromise_on_carlist_ideals: "ไมประนีประนอมอุดมการณคารลิสต"
 SPA_no_compromise_on_carlist_ideals_desc: "แมเราจะรวมมือกับฟาลังเฆในการลุกฮือครั้งแรก แตบัดนี้เปนที่ชัดเจนแลววาการประนีประนอมอุดมการณของเราก็ไมตางจากการทรยศ หากฟาลังเฆไมยอมรับขอเรียกรองของเรา เราก็ไมมีทางเลือกอื่นนอกจากกําจัดพวกเขาเชนกัน"
 SPA_no_compromise_on_carlist_ideals_tt_2: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yสเปนคารลิสต§!\n"
 SPA_no_compromise_on_carlist_ideals_tt: "§Rผูสนับสนุนฟาสซิสตจะกอสงครามกลางเมือง!§!\n"
 SPA_the_crusade_against_democracy: "สงครามครูเสดตอตานประชาธิปไตย"
 SPA_the_crusade_against_democracy_desc: "มีเพียงรัชทายาทคารลิสตผูชอบธรรมเทานั้นที่ไดรับสิทธิอันศักดิ์สิทธิ์ในการปกครองจากพระเจาโดยตรง ประชาธิปไตยไมเพียงเปนการดูหมิ่นกษัตริย แตยังเปนการลบหลูพระประสงคของพระเจา ความเสื่อมทรามนี้จะตองไมไดรับอนุญาตใหดํารงอยูบนโลกนี้อีกตอไป"
 SPA_the_crusade_against_democracy_timer_tt: "ผานไปอยางนอย 70 วันนับตั้งแต §Yสงครามครูเสดตอตานประชาธิปไตย§! ถูกปรับเปลี่ยนครั้งลาสุด\n"
 SPA_expand_the_requetes: "ขยายกองกําลังเรเกเต"
 SPA_expand_the_requetes_desc: "ที่ผานมาเราพึ่งพากองกําลังจูโจมที่มีขนาดคอนขางเล็กแตไดรับการฝกมาคอนขางดี ทวาความทะเยอทะยานของเราตองการมากกวานั้น เราตองขยายกองกําลังเรเกเตและมอบการฝกที่จําเปนใหแกทุกคนที่ตอบรับเสียงเรียก"
 SPA_militarize_the_masses: "ติดอาวุธใหมวลชน"
 SPA_militarize_the_masses_desc: "คุณคาที่เรายึดถือไมอาจปกปองไดดวยกองกําลังเรเกเตเพียงลําพัง ทุกคนที่ภักดีตอราชบัลลังกและมีความรักในพระเจาอยูในใจตองทําหนาที่ทางทหารเพื่อปกปองอุดมการณของตน"
 SPA_defenders_of_catholicism: "ผูพิทักษคาทอลิก"
 SPA_defenders_of_catholicism_desc: "ดังเชนเมื่อสี่รอยปกอน สเปนตองกลับมาเปนผูพิทักษศรัทธาคาทอลิกอีกครั้ง และดวยเหตุนี้ ทหารทุกนายตองเปนทั้งดาบและโลแหงศรัทธาของตน และระลึกถึงหนาที่อันศักดิ์สิทธิ์นี้ไวเสมอไมวากษัตริยจะสงเขาไปรบที่ใด"
 SPA_battle_rites: "พิธีกรรมในสนามรบ"
 SPA_battle_rites_desc: "การทําสงครามเพื่อปกปองชาติเปนหนาที่อันศักดิ์สิทธิ์ อนุศาสนาจารยของเราจะติดตามทหารไปยังสนามรบ และประกอบพิธีเจิมครั้งสุดทายในทันทีใหแกผูที่สละชีพเพื่อกษัตริยและศรัทธา เพื่อใหมั่นใจวาทุกคนจะไดรับรางวัลในสวรรค"
 SPA_cultivate_fanaticism: "ปลูกฝงความคลั่งศรัทธา"
 SPA_cultivate_fanaticism_desc: "คุณลักษณะที่นายกยองที่สุดของทหารคารลิสตคือความเหนียวแนนและความเด็ดเดี่ยวไมหวั่นไหวเมื่อเผชิญอันตรายและความยากลําบาก ดวยรูวาพระเจาจะประทานรางวัลแกพวกเขาหากตองพลีชีพในหนาที่ ความทุมเทและการเสียสละของผูวายชนมควรถูกยกขึ้นเปนแบบอยางใหทหารใหมทุกคนยึดถือ"
 SPA_the_third_dimension_of_warfare: "มิติที่สามแหงการสงคราม"
 SPA_the_third_dimension_of_warfare_desc: "จิตวิญญาณอันไมยอทอของคารลิสตครองความเปนใหญบนผืนดินแลว บัดนี้ตองพิชิตทองฟาดวยเชนกัน"
 SPA_a_modern_fighter_fleet: "กองบินขับไลสมัยใหม"
 SPA_a_modern_fighter_fleet_desc: "นักบินของเราตองไดรับเครื่องบินที่ดีที่สุดเทาที่รัฐจะจัดหาได สิ่งที่เราขาดในดานจํานวน เราตองชดเชยดวยทักษะ ความกลาหาญ และยุทโธปกรณ"
 SPA_confirm_the_fueros: "รับรองสิทธิฟูเอโร"
 SPA_confirm_the_fueros_desc: "การปกครองประเทศอยูในพระราชอํานาจของกษัตริย แตเอกสิทธิ์โบราณไดคุมครองสิทธิในการปกครองตนเองของภูมิภาคตาง ๆ ที่รวมกันเปนราชอาณาจักร สิทธิเหลานี้ หรือที่เรียกวาฟูเอโร ตองไดรับการรับรอง หากตองการรักษาความภักดีของภูมิภาคตาง ๆ ไว"
 SPA_encourage_local_industrialization: "สงเสริมอุตสาหกรรมทองถิ่น"
 SPA_encourage_local_industrialization_desc: "รัฐบาลระดับภูมิภาคควรสงเสริมการพัฒนาอุตสาหกรรม เพราะการริเริ่มในทองถิ่นเชนนี้ยอมชวยเสริมความแข็งแกรงใหแกประเทศโดยรวมอยางไมตองสงสัย"
 SPA_encourage_local_mining: "สงเสริมการทําเหมืองในทองถิ่น"
 SPA_encourage_local_mining_desc: "อุตสาหกรรมของเราตองการทรัพยากร และเคยชินกับบทบาทผูนําเขาสุทธิมานานเกินไป เราควรผลักดันใหเกิดกิจการเหมืองแรอยางแพรหลายในประเทศ เพื่อใชประโยชนจากความมั่งคั่งของคาบสมุทรไอบีเรียและลดการพึ่งพาผูจัดหาจากตางประเทศ"
 SPA_settle_the_succession_question: "ยุติปญหาการสืบราชสันตติวงศ"
 SPA_settle_the_succession_question_desc: "ฝายคารลิสตแตกออกเปนหลายกลุมที่สนับสนุนผูอางสิทธิ์ในราชบัลลังกตางกัน อัลฟอนโซ การโลส รัชทายาทของคารลิสต สิ้นพระชนมโดยไมมีทายาทในปลายป 1936 แตกอนหนานั้นไดแตงตั้งซาเวียรแหงบูรบง-ปารมาเปนรัชทายาท อยางไรก็ตาม ยังมีบางกลุมที่สนับสนุนการอางสิทธิ์ของอัลฟอนโซที่ 13 กษัตริยภายใตรัฐธรรมนูญองคเกาที่ถูกเนรเทศ"
 SPA_dios_patria_rey: "พระเจา ปตุภูมิ และกษัตริย!"
 SPA_dios_patria_rey_desc: "คําขวัญปลุกใจของคารลิสตกองกังวานผานประวัติศาสตรและเปนแบบอยางของความเชื่อที่เรายึดถือวาเปนจริง มันเตือนใจเราวาเราทุกคนเปนเพียงสวนเล็ก ๆ ในการปกปองคาทอลิก ชุมชนทองถิ่น และชาติสเปนโดยรวม ตลอดจนอธิปไตยสูงสุดของกษัตริย พระเจา ปตุภูมิ และกษัตริย!"
 SPA_restore_the_empire: "ฟนฟูจักรวรรดิ"
 SPA_restore_the_empire_desc: "จักรวรรดิของเรารออยู! เราเพียงแคตองสรางอุตสาหกรรมทางทหารที่จะชวยใหเราความันมาได"
 SPA_strengthen_the_empire: "เสริมความแข็งแกรงใหจักรวรรดิ"
 SPA_strengthen_the_empire_desc: "เศรษฐกิจของจักรวรรดิสเปนใหมที่เพิ่งตั้งไขยังคงดิ้นรน ควรจัดสรรงบประมาณแผนดินมากขึ้นเพื่อใหอุตสาหกรรมของเราฟนตัวจากความเสียหายของสงครามกลางเมืองไดเร็วยิ่งขึ้น"
 SPA_prosperity_of_the_empire: "ความรุงเรืองของจักรวรรดิ"
 SPA_prosperity_of_the_empire_desc: "การฟนตัวและความรุงเรืองของจักรวรรดิเปนสิ่งสําคัญยิ่ง ดวยการทุมเทเพิ่มเติมในการปรับปรุงโครงสรางพื้นฐานของประเทศ ซึ่งจะสงเสริมการคาและการพัฒนาอุตสาหกรรม เราจะบรรลุเปาหมายนี้ไดในเวลาอันสั้น"
 SPA_press_the_gibraltar_claim: "เรงอางสิทธิ์ยิบรอลตาร"
 SPA_press_the_gibraltar_claim_desc: "การดํารงอยูของดินแดนยิบรอลตารซึ่งเปนการหยามเกียรติกษัตริยของเรานั้นตองไดรับการชําระแคน"
 SPA_claim_the_french_throne: "อางสิทธิ์ราชบัลลังกฝรั่งเศส"
 SPA_claim_the_french_throne_desc: "ราชบัลลังกสเปนและฝรั่งเศสมีความเชื่อมโยงทางราชวงศมากวาครึ่งศตวรรษ กษัตริยองคปจจุบันของเราก็ไมตางกัน และยังบังเอิญเปนผูอางสิทธิ์ฝายเลจิติมิสตในราชบัลลังกฝรั่งเศสดวย นี่คือสถานการณที่เราตองฉวยใชประโยชนใหได"
 SPA_retake_the_spanish_netherlands: "ยึดเนเธอรแลนดของสเปนคืน"
 SPA_retake_the_spanish_netherlands_desc: "ครั้งหนึ่งจักรวรรดิของเราเคยแผไปจนจรดพรมแดนเยอรมนี ไมมีเหตุผลใดที่จะไมเปนเชนนั้นอีกครั้ง และยังเปดโอกาสใหเราชําระแคนสงครามแปดสิบปไปพรอมกัน"
 SPA_restore_the_iberian_union: "ฟนฟูสหภาพไอบีเรีย"
 SPA_restore_the_iberian_union_desc: "เกือบสี่ศตวรรษผานไปแลวนับตั้งแตสเปนและโปรตุเกสรวมชะตากรรมเดียวกันครั้งลาสุด ซึ่งคงอยูเพียงชวงเวลาสั้น ๆ เทานั้น ไอบีเรียจะแข็งแกรงกวาเมื่อรวมกัน ดังนั้นเราจะทําใหแนใจวาจะมีการ 'คนพบ' สิทธิ์ใหมในราชบัลลังกโปรตุเกส..."
 SPA_the_war_of_vengeance: "สงครามแหงการลางแคน"
 SPA_the_war_of_vengeance_desc: "สงครามสเปน-อเมริกาในป 1898 ยังคงอยูในความทรงจําของผูคน และผลกระทบอันลึกซึ้งตอจิตใจของชาวสเปนสะทอนใหเห็นไดชัดที่สุดในงานเขียนของคนรุนป '98 ความอัปยศของชาติจากการสูญเสียอาณานิคมตองไดรับการชําระแคน อเมริกาตองถูกปราบใหสยบ"
 SPA_found_the_academia_vazquez_de_mella: "กอตั้งสถาบันบัซเกซ เด เมลยา"
 SPA_found_the_academia_vazquez_de_mella_desc: "เราตองจัดตั้งศูนยกลางทางความคิดจารีตนิยมอันยิ่งใหญ ซึ่งนักคิดคารลิสตสามารถใชสรางความกาวหนาและพัฒนาการใหม ๆ ที่เปนประโยชนตอราชาธิปไตยสเปนใหมไดดวย"
 SPA_a_fleet_worthy_of_a_king: "กองเรือที่คูควรแกกษัตริย"
 SPA_a_fleet_worthy_of_a_king_desc: "กองทัพเรือของเราตองขยายตัวอยางมาก หากกษัตริยจะทรงแผพระราชอํานาจขามมหาสมุทรได โครงสรางพื้นฐานทางทะเลแหงใหมจะตองถูกสรางขึ้นโดยทันที"
 SPA_rebuild_the_battlefleet: "สรางกองเรือรบขึ้นใหม"
 SPA_rebuild_the_battlefleet_desc: "ตลอดสี่ทศวรรษหลังสงครามสเปน-อเมริกา กองทัพเรือของเราเฉื่อยชาและขลาดเขลา การเพิ่มเรือรบขนาดใหญลําใหมที่สามารถรับมือกับศัตรูใดก็ไดจะปลุกความรูสึกแหงการเกิดใหมในหมูกําลังพล อีกทั้งยังชวยใหเราชวงชิงนานนํ้ากับเพื่อนบานได"
 SPA_imperial_security: "ความมั่นคงของจักรวรรดิ"
 SPA_imperial_security_desc: "ความมั่นคงของจักรวรรดิไมไดอยูที่เรือหลักขนาดใหญ แตอยูที่เรือลาดตระเวนในจํานวนที่เพียงพอ การพัฒนาแบบเรือใหมและหลักนิยมการคุมครองการคาใหมตองเริ่มขึ้นทันที เพื่อใหเรารักษาการสงเสบียงไปยังดินแดนโพนทะเลได"
 SPR_regional_defense_council_of_aragon: "สภาปองกันภูมิภาคอารากอน"
 SPR_regional_defense_council_of_aragon_desc: "เพื่อจุดประสงคในการทําสงคราม และดวยความจําเปนเทานั้น ชุมชนอนาธิปไตยปกครองตนเองที่เกิดขึ้นจากสงครามกลางเมืองตองรวมกันภายใตสภาปองกันเพียงหนึ่งเดียวที่สามารถประสานความพยายามของเรา เราจะเริ่มดวยการจัดตั้งสภาขึ้นที่อารากอน"
 SPR_appropriate_the_means_of_production: "ยึดปจจัยการผลิต"
 SPR_appropriate_the_means_of_production_desc: "วันเวลาที่เราทํางานใหคนรํ่ารวยไดผานพนไปแลว วันเวลาที่แรงงานของเราไมไดรับผลตอบแทนไดผานพนไปแลว เราจะยึดโรงงานและโรงชาง ไรนาและรานคา ขจัดชนชั้น และใหคนงานเปนผูกําหนดชะตากรรมของตนเอง"
 SPR_autogestion: "การจัดการตนเอง"
 SPR_autogestion_desc: "เราจะเพิ่มผลผลิตใหสูงสุดดวยการใหคนงานจัดการสถานที่ทํางานดวยตนเองตามหลักการเอาโตเฆสติออน (autogestión) ซึ่งจะเกิดประโยชนมากมายทั้งในดานความเปนอิสระของคนงาน ขวัญกําลังใจ และสงผลใหผลิตภาพโดยรวมสูงขึ้น"
 SPR_collectivization_and_workers_control: "การรวมเปนกลุมสวนรวมและการควบคุมโดยคนงาน"
 SPR_collectivization_and_workers_control_desc: "สําหรับงานที่จําเปนของการปกครองทองถิ่น เราจะหันไปพึ่งสภาคนงาน ซึ่งใหคนงานทุกคนมีสิทธิ์มีเสียง และยังเอื้อใหเกิดความรวมมือในวงกวางขึ้น"
 SPR_arm_the_people: "ติดอาวุธใหประชาชน"
 SPR_arm_the_people_desc: "กองทัพแหงชาติสามารถถูกรัฐบาลใชเปนเครื่องมือควบคุมประชาชนไดงาย จึงไมใชทางออกสําหรับการปองกันชุมชน ประชาชนเองตางหากที่ตองไดรับอาวุธเพื่อปกปองชุมชนของตน"
 SPR_the_maximum_concession: "การยอมออนขอขั้นสูงสุด"
 SPR_the_maximum_concession_desc: "ดวยเจตนารมณแหงการตอสูกับฟาสซิสต เราไดยอมออนขอมากที่สุดเทาที่จะทําได นั่นคือการรวมมือกับพวกนายทุนและคอมมิวนิสตเผด็จการ การยอมออนขอนี้คือขีดสุดที่เรายอมได และไมอาจคงอยูตลอดไป เราจะใชประโยชนจากมันใหมากที่สุดในขณะที่ยังเปนไปได"
 SPR_seize_public_transport: "ยึดระบบขนสงสาธารณะ"
 SPR_seize_public_transport_desc: "ทุกคนตางอยากมีสวนรวมในการตอสูเพื่อเสรีภาพ พันธมิตรของเรามีจํานวนมากที่ทํางานในภาคขนสงสาธารณะ และพวกเขากระตือรือรนที่จะนํายานพาหนะของตนมารับใชเหลาทหารผูกลาของเรา สิ่งนี้อาจมอบความไดเปรียบทางยุทธวิธีที่แหวกแนวเหนือศัตรู"
 SPR_seize_public_transport_tt: "§Rจิตวิญญาณนี้จะถูกนําออกเมื่อสงครามกลางเมืองสิ้นสุดลง!§!\n"
 SPR_agrarian_collectivization: "การรวมเกษตรกรรมเปนของสวนรวม"
 SPR_agrarian_collectivization_desc: "การจัดระเบียบเกษตรกรรมแบบรวมหมูจะทําใหทุกคนที่อาศัยอยูในชุมชนมีอาหารเพียงพอ แทนที่จะนําผลผลิตไปขายในที่ที่ไดกําไรมากที่สุด"
 SPR_mujeres_libres: "สตรีเสรี"
 SPR_mujeres_libres_desc: "การปฏิวัติทางสังคมประสบความสําเร็จเพียงบางสวน ขั้นตอไปคือการปลดปลอย การเสริมพลัง และการใหการศึกษาแกสตรีชนชั้นแรงงาน ความเทาเทียมจะเปนประโยชนตอชุมชนโดยรวม"
 SPR_literacy_programs: "โครงการสงเสริมการรูหนังสือ"
 SPR_literacy_programs_desc: "การไมรูหนังสือแพรหลายในหมูประชากรผูใชแรงงาน แตดวยโครงการที่เหมาะสม ปญหานี้จะดีขึ้นไดอยางรวดเร็ว และยอมชวยใหพรสวรรคที่ซอนอยูไดปรากฏออกมา"
 SPR_shared_burdens: "แบกรับภาระรวมกัน"
 SPR_shared_burdens_desc: "การตอสูเพื่อเสรีภาพจากอํานาจนิยม ทุนนิยม และความเชื่องมงายทางศาสนาจะยาวนานและยากลําบาก เราทุกคนตองชวยกันแบกรับความยากลําบากที่รออยูขางหนาอยางแนนอน กอนที่เราทุกคนจะไดเก็บเกี่ยวผลจากแรงงานของเรา"
 SPR_international_brigades: "กองพลนอยนานาชาติ"
 SPR_international_brigades_desc: "อุดมการณของเราไดรับความสนใจจากนานาชาติอยางมาก ผูคนเดินทางมาจากทั่วโลกเพื่อรวมตอสูกับภัยคุกคามฟาสซิสตไปกับเรา จะไมมีใครถูกปฏิเสธ ตราบใดที่พวกเขาทําหนาที่ของตนเพื่อความผาสุกของชุมชน เราจะจัดพวกเขาเปนกองพลนอยนานาชาติ"
 SPR_international_brigades_tt: "§Yมาเต ซอลกอ§! พรอมรับตําแหนง §Yจอมพล§! ระดับ 2"
 SPR_seize_the_gold_reserves: "ยึดทองคําสํารอง"
 SPR_seize_the_gold_reserves_desc: "ทองคําสํารองของสาธารณรัฐเสี่ยงที่จะตกอยูในมือของฟาสซิสต หรืออาจเลวรายกวานั้นคือพวกสตาลินนิสต การยึดทองคําเหลานี้ยอมเสี่ยงตอการถูกรัฐบาลขุนเคือง แตก็อาจชวยใหเรามีเงินทุนสําหรับความพยายามทางสงครามดวยการซื้ออาวุธจากตางประเทศผานตลาดมืด"
 SPR_gold_reserves_flag: "ทองคําสํารองถูกยึดหรือเคลื่อนยายไปแลว"
 SPR_foreign_arms_purchases: "การซื้ออาวุธจากตางประเทศ"
 SPR_foreign_arms_purchases_desc: "ทองคําสํารองที่เรา 'ปลดปลอย' มาสามารถใชจัดหาอาวุธจากตางประเทศซึ่งเราตองการอยางยิ่ง ความเห็นของนานาชาติไมไดสนับสนุนเราเสมอไป ดังนั้นเราอาจตองอาศัยชองทางที่ไมปกติเพื่อใหไดอาวุธเหลานี้มา อยางไรก็ตาม..."
 SPR_foreign_arms_purchases_tt: "ปลดล็อกการตัดสินใจ §Yการซื้ออาวุธจากตางประเทศ§! ซึ่งชวยใหซื้อยุทโธปกรณประเภทตาง ๆ ได\n"
 SPR_masters_of_our_own_fate: "เปนนายแหงชะตากรรมของตนเอง"
 SPR_masters_of_our_own_fate_desc: "พวกสตาลินนิสตและหุนเชิดฝายสาธารณรัฐของพวกเขาลวงละเมิดเสรีภาพของเรามากขึ้นเรื่อย ๆ บอนทําลายความพยายามของเราอยางเปนระบบ และกําจัดผูสนับสนุนคนสําคัญของอุดมการณเรา พอกันที เราคือนายแหงชะตากรรมของตนเอง แมวาจะตองตอสูกับพวกเขาดวยก็ตาม"
 SPR_anarchist_uprising_flag: "พวกอนาธิปไตยไดลุกฮือขึ้นแลว"
 SPR_masters_of_our_own_fate_tt_2: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yสภาปองกันภูมิภาคอารากอน§!\n"
 SPR_masters_of_our_own_fate_tt_3: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yคอมมูนสเปน§!\n"
 SPR_masters_of_our_own_fate_tt_4: "รัฐมนตรีจาก POUM §Gพรอมใหแตงตั้ง§! แตรัฐมนตรีฝายประชาธิปไตยและสตาลินนิสตจะถูก§Rถอดออก§!\n"
 SPR_masters_of_our_own_fate_tt: "§Rผูสนับสนุนคอมมิวนิสตและประชาธิปไตยจะกอสงครามกลางเมือง!§!\n"
 SPR_all_must_bear_the_torch: "ทุกคนตองชูคบเพลิง"
 SPR_all_must_bear_the_torch_desc: "ทุกคนคือการปฏิวัติในตัวเอง หากปราศจากความกลาหาญและความดุดันของปจเจกบุคคล สวนรวมยอมพายแพตอหนาศัตรู สารนี้ตองสงไปถึงผูสนับสนุนของเราทุกคน เราทุกคนตองชวยกันชูคบเพลิงแหงอนาธิปไตยใหสูงตระหงาน"
 SPR_the_threats_abound: "ภัยคุกคามรอบดาน"
 SPR_the_threats_abound_desc: "เห็นไดชัดวาโลกไมยอมรับการมีอยูของเรา ไมวาเราจะหันไปทางใดก็พบแตความเมินเฉย หรือกระทั่งความเปนปฏิปกษอยางเปดเผย บัดนี้ชัดเจนแลววาเราไมมีพันธมิตรใหพึ่งพา เราตองเตรียมพรอมทําสงครามกับรัฐชาติที่ลาสมัยเหลานี้ทุกรัฐ"
 SPR_portuguese_anarchism: "อนาธิปไตยโปรตุเกส"
 SPR_portuguese_anarchism_desc: "สงครามเพื่อเสรีภาพของเราลุกลามขามพรมแดนโปรตุเกส และรัฐบาลของพวกเขากําลังสั่นคลอน ดวยการสนับสนุนที่เหมาะสม การลุกฮือของฝายอนาธิปไตยเต็มรูปแบบภายในพรมแดนของพวกเขาก็ไมใชเรื่องเกินคาดหมาย เราตองจุดเปลวไฟนี้ขึ้น!"
 SPR_regional_defense_council_of_iberia: "สภาปองกันภูมิภาคไอบีเรีย"
 SPR_regional_defense_council_of_iberia_desc: "ดวยการปลดปลอยดินแดนที่ครั้งหนึ่งเคยเปนโปรตุเกส เราสามารถจัดตั้งสภาปองกันใหมที่เปนตัวแทนเจตจํานงของทุกชุมชนบนคาบสมุทรไอบีเรีย"
 SPR_regional_defense_council_of_iberia_tt: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yสภาปองกันภูมิภาคไอบีเรีย§!\n"
 SPR_a_new_way_of_warfare: "วิถีใหมแหงการสงคราม"
 SPR_a_new_way_of_warfare_desc: "ความกลาหาญของทหารราบของเรานั้นไมตองสงสัย แตความเปนจริงของสงครามไดกาวไกลเกินกวาที่ทหารราบจะเอาชนะได เราตองเริ่มพัฒนาเครื่องจักรสงครามแบบใหม ทั้งบนภาคพื้นดินและบนทองฟา เพื่อปกปองชุมชนของเรา"
 SPR_communal_military_strategies: "ยุทธศาสตรทางทหารแบบชุมชน"
 SPR_communal_military_strategies_desc: "การจัดระเบียบสงครามขนาดใหญโดยยังคงยึดมั่นในหลักการอนาธิปไตยเปนความทาทายอันยิ่งใหญ และเปนสิ่งที่เราตองลุกขึ้นรับมือ เพราะหากปราศจากมัน ทุกสิ่งที่เราตอสูมาจะสูญสิ้น"
 SPR_maintaining_the_fire: "รักษาเปลวไฟไว"
 SPR_maintaining_the_fire_desc: "ความเหนื่อยลาจากสงครามคือลางแหงความลมสลาย เราตองเขมแข็งไวและปลุกไฟในใจประชาชนที่ผลักดันใหพวกเขาทุมเทอยางสุดกําลังขึ้นมาใหม"
 SPR_freedom_of_thought: "เสรีภาพทางความคิด"
 SPR_freedom_of_thought_desc: "ความใจแคบไมมีที่ยืนในชุมชนของเรา ทุกคนไดรับการตอนรับไมวาจะมีความคิดเชนใด ตราบเทาที่พวกเขายอมรับรากฐานพื้นฐานของสังคมเรา"
 SPR_torchbearers_of_tomorrow: "ผูถือคบเพลิงแหงวันพรุงนี้"
 SPR_torchbearers_of_tomorrow_desc: "ผูที่ทําหนาที่ของตนในการสนับสนุนอุดมการณของเรา ไมวาจะทางสติปญญาหรือการทหาร คือภาพสะทอนของอนาคตโดยแท การตระหนักถึงสิ่งนี้อาจเปนแรงผลักดันอันทรงพลัง ดังนั้นเราตองทําใหพวกเขารูถึงความสําคัญของงานที่ทํา"
 SPR_the_inevitable_counterblow: "การโตกลับที่หลีกเลี่ยงไมได"
 SPR_the_inevitable_counterblow_desc: "ความเปนปฏิปกษของนานาชาติตอวิถีชีวิตแบบชุมชนของเรากําลังเพิ่มขึ้น เปนเพียงเรื่องของเวลากอนที่การโจมตีจะมาถึง และเราตองพรอมรับมือ"
 SPR_improve_military_infrastructure: "ปรับปรุงโครงสรางพื้นฐานทางทหาร"
 SPR_improve_military_infrastructure_desc: "เพื่อเขาถึงชุมชนที่ถูกปดลอมไดทันเวลา เราตองปรับปรุงโครงสรางพื้นฐานระหวางชุมชนอยางมาก ซึ่งจะชวยใหสภาปองกันโดยรวมสามารถตอบสนองตอภัยคุกคามจากภายนอกที่ชุมชนใดชุมชนหนึ่งอาจรับมือไมไหวไดอยางรวดเร็ว"
 SPR_fortify_the_pyrenees: "เสริมปอมปราการเทือกเขาพิเรนีส"
 SPR_fortify_the_pyrenees_desc: "เสนทางบุกที่ชัดเจนที่สุดคือจากทางเหนือ จําเปนอยางยิ่งที่ตองเสริมปอมปราการเทือกเขาพิเรนีสเพื่อรับมือการโจมตีใด ๆ ที่ผานเขามาทางเทือกเขาหรือตามแนวชายฝง"
 SPR_fortify_the_pyrenees_tt: "สราง §Yปอม§! ระดับ 3 ในจังหวัดที่ติดพรมแดนฝรั่งเศสใน §Yแควนบาสก§!, §Yนาวาร§!, §Yอารากอนตะวันตก§!, §Yอารากอนตะวันออก§! และ §Yกาตาลุญญา§!\n"
 SPR_fortify_la_linea_de_la_concepcion: "เสริมปอมปราการลาลีเนียเดลาคอนเซปซีออน"
 SPR_fortify_la_linea_de_la_concepcion_desc: "ลาลีเนียเดลาคอนเซปซีออนคือปอมปราการดานแรกที่เผชิญหนากับศัตรูที่อยูเบื้องหลัง ดวยการปองกันที่เพียงพอ เรานาจะสามารถรับมือการโจมตีใด ๆ ที่มาจากยิบรอลตารไดแบบซึ่งหนา"
 SPR_fortify_la_linea_de_la_concepcion_tt: "สราง §Yปอม§! ระดับ 3 ในจังหวัดที่ติดพรมแดนยิบรอลตารใน §Yเซบิยา§! และ §Yกรานาดา§!\n"
 SPR_fortify_the_coastlines: "เสริมปอมปราการแนวชายฝง"
 SPR_fortify_the_coastlines_desc: "เราไมอาจมองขามความเปนไปไดของการยกพลขึ้นบก การขยายการปองกันจะทําใหศัตรูไมอยากเสี่ยงมากกวาการที่เราปลอยแนวรบนี้ไวโดยไรการปองกัน"
 SPR_fortify_the_coastlines_tt_1: "สราง §Yปอมชายฝง 1 แหง§! ในจังหวัดชายฝงของ §Yกาลิเซีย§!, §Yอัสตูเรียส§! และ §Yแควนบาสก§!\n"
 SPR_fortify_the_coastlines_tt_2: "สราง §Yปอม 1 แหง§! และ §Yปอมชายฝง 2 แหง§! ในจังหวัดดินแดนหลักบนภาคพื้นทวีปที่มี §Yฐานทัพเรือ§!\n"
 SPR_militarize_the_industry: "เปลี่ยนอุตสาหกรรมเปนการทหาร"
 SPR_militarize_the_industry_desc: "ตองสนับสนุนใหชุมชนตาง ๆ เพิ่มการผลิตยุทธปจจัย มิฉะนั้นเราเสี่ยงที่จะทําใหทหารผูกลาของเราขาดแคลนเครื่องมือที่จําเปนในการปกปองบานเรือนของเรา"
 SPR_communal_autarky: "การพึ่งตนเองของชุมชน"
 SPR_communal_autarky_desc: "โลกไดเมินหนาหนีเรา ดังนั้นเราตองอยูใหไดดวยทรัพยากรธรรมชาติที่พบในดินแดนของเราเอง นี่คือแบบฝกหัดในการใชทรัพยากรอยางคุมคาที่สุด ซึ่งเราจะเรียนรูจนเชี่ยวชาญ"
 SPR_faith_in_the_cause: "ศรัทธาในอุดมการณ"
 SPR_faith_in_the_cause_desc: "ความคิดแบบพายแพไมมีที่ยืนเมื่อทั้งโลกตอตานคุณ เราจะตองยึดมั่นในความเชื่ออันไมสั่นคลอนวาจะไปถึงอนาคตที่สันติ มิฉะนั้นเราก็จะลมสลาย"
 SPR_militarize_the_people: "ติดอาวุธใหประชาชนทั้งมวล"
 SPR_militarize_the_people_desc: "เราไมมีความหรูหราที่จะรักษามือใหสะอาดปราศจากเลือด ทุกคนตองไดรับการสอนใหใชอาวุธเพื่อปองกันตนเอง เพื่อที่เมื่อถึงเวลา พวกเขาจะไดตอสูเพื่ออนาคตของตน"
 SPR_anarchism_knows_no_borders: "อนาธิปไตยไรพรมแดน"
 SPR_anarchism_knows_no_borders_desc: "หากประชาชาติทั้งหลายในโลกไมยอมใหเราอยูรวม หนทางเดียวสูอนาคตที่เราจะรวมกันเปนชุมชนไดอยางสันติก็คือการลมลางรัฐชาติทั้งปวง"
 SPR_plant_the_seeds_of_revolution: "หวานเมล็ดพันธุแหงการปฏิวัติ"
 SPR_plant_the_seeds_of_revolution_desc: "ผูที่มีความรูสึกนึกคิดคลายเราถูกรัฐบาลกดขี่ปดปากมาชานาน เราจะมอบอาวุธที่จําเปนใหกลุมเหลานี้ เพื่อใหพวกเขาโคนลมประเทศของตนจากภายใน และเขารวมกับเราเมื่อเราตีศัตรูแตกพายและเชื่อมตอกับพวกเขาได"
 SPR_plant_the_seeds_of_revolution_tt: "ปลดล็อกการตัดสินใจ §Yเมล็ดพันธุแหงการปฏิวัติ§! ซึ่งชวยใหกอการลุกฮือของฝายอนาธิปไตยในประเทศศัตรูที่อยูใกลเคียงได\n"
 SPR_global_defense_council: "สภาปองกันโลก"
 SPR_global_defense_council_desc: "พรมแดนของเราขยายออกไปไกลเกินขอบเขตทางภูมิศาสตรของคาบสมุทรไอบีเรีย และชื่อที่เราตั้งใหสภาปองกันชั่วคราวของเราก็ไมอาจเปนตัวแทนของทุกคนที่เปนสวนหนึ่งไดอีกตอไป เราจะเปลี่ยนชื่อองคกรของเราใหครอบคลุมผูคนทั้งหมดบนโลกใบนี้อยางเหมาะสม"
 SPR_global_defense_council_tt: "§Y[ROOT.GetName]§! จะไดรับการเรียกวา §Yสภาปองกันโลก§!\n"
 SPR_global_defense_council_tt_2: "ปลดล็อกการตัดสินใจ §Yเมล็ดพันธุแหงการปฏิวัติ§! ซึ่งชวยใหโอนและสรางดินแดนหลักในรัฐที่ตางชาติควบคุมซึ่งมี §Yการยอมรับปกครอง§! สูงเพียงพอ\n"
 SPR_the_anti_fascist_workers_revolution: "การปฏิวัติของคนงานตอตานฟาสซิสต"
 SPR_the_anti_fascist_workers_revolution_desc: "บัดนี้ถึงเวลาที่คนงานสเปนจะลุกขึ้นตอตานศัตรูฟาสซิสต! เราจับมือกับชนชั้นกระฎมพี แตเพียงเทาที่จําเปนเพื่อจัดการภัยคุกคามนี้เทานั้น การปฏิวัติเริ่มตนขึ้นแลว!"
 SPR_strengthen_the_euzko_gudarostea: "เสริมกําลังกองทัพบาสก"
 SPR_strengthen_the_euzko_gudarostea_desc: "แควนบาสกมีอุตสาหกรรมที่สําคัญยิ่ง และตองไดรับการปองกันที่ดีกวานี้ การขยายกองทัพที่รัฐบาลทองถิ่นจัดตั้งขึ้นจะชวยเสริมความแข็งแกรงใหแนวหนาที่นั่นไดอยางมาก"
 SPR_strengthen_the_euzko_gudarostea_tt: "ไดรับหนวย 6 หนวยที่มีกองพัน §Yทหารราบ 3§! กองพันใน §Yแควนบาสก§!\n"
 SPR_remove_after_civil_war_tt: "§Rหนวยเหลานี้จะถูกนําออกเมื่อสงครามกลางเมืองสิ้นสุดลง!§!\n"
 SPR_fortify_the_iron_ring: "เสริมปอมปราการวงแหวนเหล็ก"
 SPR_fortify_the_iron_ring_desc: "บิลบาโอ เมืองที่ใหญที่สุดในแควนบาสก จะไดรับ 'วงแหวนเหล็ก' แนวปอมปราการของตนเอง ซึ่งจะเปนอุปสรรคอันนาเกรงขามใหชาวบาสกใชปองกันเมืองจากศัตรูฟาสซิสต"
 SPR_arm_the_workers_militias: "ติดอาวุธใหกองกําลังกรรมกร"
 SPR_arm_the_workers_militias_desc: "เราไดจัดตั้งกองกําลังติดอาวุธจากแรงงานแลว และบัดนี้ตองทําใหแนใจวาพวกเขามียุทโธปกรณเพียงพอ เพื่อเปนกองหนาตอตานศัตรูฟาสซิสตและกองทัพที่ไมจงรักภักดี"
 SPR_hinder_nkvd_interference: "ขัดขวางการแทรกแซงของ NKVD"
 SPR_hinder_nkvd_interference_desc: "NKVD ของโซเวียตแทรกแซงกิจการภายในของสเปนมานานเกินไปแลว ผูที่วิจารณสตาลินอยางเปดเผยหายตัวไป นักการเมืองของเราถูกโดดเดี่ยว และความพยายามตอสูกับพวกฟาสซิสตของเราบางครั้งถูกขัดขวางโดยพันธมิตรจอมปลอมของเรามากกวาศัตรูเสียอีก พอกันที เราจะตอบโตพวกสตาลินนิสต"
 SPR_hinder_nkvd_interference_tt: "แทนที่ภารกิจ §Yการลุกฮือของอนาธิปไตยที่ใกลเขามา§! ดวยภารกิจ §Yการปราบปรามของรัฐบาลที่ใกลเขามา§!\n"
 SPR_demand_ministerial_positions: "เรียกรองตําแหนงรัฐมนตรี"
 SPR_demand_ministerial_positions_desc: "หากสาธารณรัฐตองการใหเราสนับสนุนตอไป พวกเขาตองมอบตําแหนงในรัฐบาลใหนักการเมืองของเรา เมื่อนั้นจึงจะเปนที่ชัดเจนวาพวกเขาเห็นเราเปนพันธมิตรที่มีคาในการตอสูรวมกัน"
 SPR_the_stalinist_doctrine: "หลักนิยมสตาลิน"
 SPR_the_stalinist_doctrine_desc: "ในบรรดากลุมตอตานฟาสซิสตที่รวมตัวกันอยางหลวม ๆ ของเรา มีบางกลุมที่ตีความคําสอนของมารกซอยางเปนอิสระจากสตาลิน นี่คือหนามยอกอกของสังคมนิยมทั้งมวล และจะปลอยใหดําเนินตอไปไมได เพื่อไมใหการตอสูของกรรมกรตกอยูในอันตราย เราตองกําจัดเสียงคัดคานเหลานี้และรวมกันภายใตผูนําเพียงหนึ่งเดียว"
 SPR_subvert_the_stalinists: "บอนทําลายพวกสตาลินนิสต"
 SPR_subvert_the_stalinists_desc: "เราไมไดเปนผูเริ่มความขัดแยงนี้ แตหากพวกสตาลินนิสตยืนกราน เราก็จะเลนเกมของพวกเขา เราจะบั่นทอนฐานอํานาจของพวกเขาจากภายในดวยการชักจูงผูสนับสนุนและแอบดึงเสบียงของพวกเขา ไมวาพวกเขาจะไปที่ใดก็จะพบเราขวางอยู"
 SPR_class_war: "สงครามชนชั้น"
 SPR_class_war_desc: "แนวคิดแนวรวมประชาชนนั้นมีขอบกพรอง กรรมกรไมมีวันเปนอิสระอยางแทจริงตราบใดที่ยังถูกบังคับใหทํางานรวมกับชนชั้นกระฎมพี มีเพียงสงครามชนชั้นเต็มรูปแบบที่ไมประนีประนอมเทานั้นที่จะนําเสรีภาพที่เราปรารถนามาให แมจะหมายถึงการตอสูกับทั้งนายทุนและฟาสซิสตไปพรอมกันก็ตาม"
 SPR_secularize_the_new_state: "ทําใหรัฐใหมเปนรัฐฆราวาส"
 SPR_secularize_the_new_state_desc: "สังคมใหมที่เรากําลังสรางไมมีที่วางใหศาสนา สิ่งเหลานี้มีไวเพียงตอกยํ้าโครงสรางชนชั้นหรือกลอมใหกรรมกรเชื่อฟง มีเพียงการปลดปลอยจิตใจจากความเชื่องมงายเหลานี้เทานั้น เราจึงจะเปนอิสระอยางแทจริง"
 SPR_appropriate_church_riches: "ยึดทรัพยสินของศาสนจักร"
 SPR_appropriate_church_riches_desc: "ความมั่งคั่งที่ศาสนจักรคาทอลิกสะสมไวสามารถนํามาใชสนับสนุนอุดมการณของเราไดดีกวามาก เราจะใชมันปรับปรุงโรงงานที่มีอยูและสรางโรงงานใหม ซึ่งลวนมีสวนชวยใหเราบรรลุเปาหมายสุดทาย"
 SPR_an_army_of_all_classes: "กองทัพของทุกชนชั้น"
 SPR_an_army_of_all_classes_desc: "เมื่อเผชิญภัยคุกคามฟาสซิสต ชนชั้นไมใชเรื่องสําคัญ เราจะจัดตั้งกองทัพที่ทุกคนสามารถเขารวมรับใชได และในขณะเดียวกันก็ใหพวกเขาไดซึมซับคุณคาสังคมนิยมอันดีงามที่เพื่อนรวมชาติยึดถือ"
 SPR_relocate_the_gold_reserves: "ยายทองคําสํารอง"
 SPR_relocate_the_gold_reserves_desc: "ทองคําสํารองของเราเปนกุญแจสําคัญในการซื้อยุทธปจจัยจากตางประเทศ เราตองมั่นใจวามันถูกเก็บไวในที่ปลอดภัย ซึ่งนาเสียดายที่จําเปนตองยายไปไวตางประเทศ"
 SPR_relocate_the_gold_reserves_tt: "§Rทองคําสํารองของเราจะตกอยูในความเมตตาของประเทศเจาบาน!§!\n"
 SPR_reaffirm_the_popular_front_strategy: "ยืนยันยุทธศาสตรแนวรวมประชาชน"
 SPR_reaffirm_the_popular_front_strategy_desc: "จําเปนอยางยิ่งที่ความแตกตางระหวางเรากับพันธมิตรจะตองถูกลืมไปกอนในตอนนี้ เพื่อใหเราทุกคนมุงไปที่การตอสูที่สําคัญกวา นั่นคือการตอสูกับพวกฟาสซิสต"
 SPR_anti_fascist_unity: "เอกภาพตอตานฟาสซิสต"
 SPR_anti_fascist_unity_desc: "ความขัดแยงระหวางเรากับพันธมิตรฝายอนาธิปไตยและฝายตอตานสตาลินกําลังเลวรายลง เราไมอาจปลอยใหมันบานปลายเกินควบคุม เราตองหันกลับมามุงความสนใจไปที่ศัตรูที่แทจริง แมวาราคาของสันติภาพภายในคือการยอมออนขอในระดับรัฐบาลใหแกพันธมิตรที่ดื้อรั้นของเราก็ตาม"
 SPR_anti_fascist_unity_tt: "ปลดล็อกการตัดสินใจ §Yเอกภาพตอตานฟาสซิสต§! ซึ่งชวยใหชะลอการลุกฮือของฝายอนาธิปไตยไดโดยแลกกับการยอมออนขอ\n"
 SPR_crush_the_revolution: "บดขยี้การปฏิวัติ"
 SPR_crush_the_revolution_desc: "การที่ชุมชนอนาธิปไตยดําเนินการอยางเปนอิสระนั้นเปนหนามยอกอกของเรา และพูดกันตรง ๆ การปองกันอันออนแอของพวกเขาเปนจุดออนรายแรงในแนวหนาของเรา เราจะดีกวาหากไมมีพวกเขา ดังนั้นถึงเวลาแลวที่จะบดขยี้การปฏิวัตินี้ใหสิ้นซาก"
 SPR_crush_the_revolution_tt: "§Rผูสนับสนุนฝายไมฝกใฝฝายใดจะกอสงครามกลางเมือง!§!\n"
 SPR_united_under_socialism: "รวมเปนหนึ่งภายใตสังคมนิยม"
 SPR_united_under_socialism_desc: "แมเราจะมาจากภูมิภาคและภูมิหลังที่หลากหลาย แตเราตองละทิ้งความแตกตางเหลานี้และมุงไปสูสังคมนิยมรวมกัน"
 SPR_wealth_redistribution: "กระจายความมั่งคั่ง"
 SPR_wealth_redistribution_desc: "เมื่อทรัพยสินของคนรํ่ารวยถูกยึดแลว เราจะทําใหทุกคนไดมีสวนรวมในชัยชนะนี้ดวยการกระจายความมั่งคั่ง เพื่อใหประชาชนทุกคนไดรับผลประโยชนอยางเทาเทียม"
 SPR_collective_recovery_efforts: "ความพยายามฟนฟูรวมกัน"
 SPR_collective_recovery_efforts_desc: "ประชาคมสเปนทั้งมวลตองรวมพลังในความพยายามครั้งใหญเพียงหนึ่งเดียวเพื่อซอมแซมความเสียหายจากสงครามกลางเมืองอันรุนแรง โรงงานของเราตองถูกสรางขึ้นใหมเพื่อใหประชาชนไดกลับไปทํางาน และตองสรางโครงสรางพื้นฐานใหมเพื่อเอื้อใหชุมชนทองถิ่นติดตอกันไดสะดวกขึ้น"
 SPR_repair_and_expand_the_dockyards: "ซอมแซมและขยายอูตอเรือ"
 SPR_repair_and_expand_the_dockyards_desc: "อูตอเรือขนาดใหญก็ไมรอดพนจากความเสียหายของสงครามกลางเมือง ขณะซอมแซม เราควรพิจารณาขยายอูเหลานี้ไปพรอมกัน เพื่อเตรียมพรอมสําหรับโครงการขยายกองทัพเรือในอนาคต"
 SPR_the_peoples_fleet: "กองเรือของประชาชน"
 SPR_the_peoples_fleet_desc: "เจตจํานงของประชาชนปรากฏทั้งบนผืนดินและในทองทะเล เจตจํานงนี้ตองไดรับการหนุนหลังดวยกองเรือใหมที่เราจะเริ่มสรางทันที"
 SPR_land_redistribution: "การปฏิรูปที่ดิน"
 SPR_land_redistribution_desc: "ทุกคนที่ตองการทํากินบนที่ดินตองไดรับอนุญาตใหทําได ที่ดินที่กอนสงครามอยูในมือของผูที่ไมสามารถใชประโยชนไดอยางเหมาะสม บัดนี้จะถูกจัดสรรใหแกผูที่สามารถใชประโยชนได"
 SPR_expand_the_means_of_production: "ขยายปจจัยการผลิต"
 SPR_expand_the_means_of_production_desc: "ความผาสุกของสวนรวมขึ้นอยูกับความแข็งแกรงของอุตสาหกรรม การขยายอุตสาหกรรมของเราจะชวยรักษาเสถียรภาพภายในและเสริมการปองกันจากศัตรูภายนอก"
 SPR_invite_socialist_intellectuals: "เชิญปญญาชนสังคมนิยม"
 SPR_invite_socialist_intellectuals_desc: "สังคมของเราจะเปนสวรรคสําหรับปญญาชนทุกคนที่ทุมเทใหแกอุดมการณสังคมนิยมเชนเดียวกับเรา บุคคลเหลานี้ตองไดรับเชิญมาจากทุกสารทิศ เพื่อใหอัจฉริยภาพของพวกเขาสรางความกาวหนาที่เราทุกคนไดรับประโยชน"
 SPR_solidify_government_control: "กระชับอํานาจควบคุมของรัฐบาล"
 SPR_solidify_government_control_desc: "รัฐปกครองตนเองทั่วประเทศตองถูกจํากัดเสรีภาพลงเพื่อประโยชนของสวนรวม เราไมอาจปลอยใหพวกเขาบั่นทอนเอกภาพของเราขณะเผชิญภัยคุกคามฟาสซิสตจากตางแดน"
 SPR_reeducate_the_bourgeoisie: "ปรับทัศนคติชนชั้นกระฎมพี"
 SPR_reeducate_the_bourgeoisie_desc: "แนวรวมประชาชนหมดบทบาทแลว ถึงเวลาที่ชนชั้นกระฎมพีจะไดรับการอบรมใหมและหลุดพนจากความเขาใจผิดทางเศรษฐกิจและสังคม เราจะเปลี่ยนพวกเขาใหเปนพลเมืองที่ดีของรัฐใหจงได"
 SPR_the_spanish_red_army: "กองทัพแดงสเปน"
 SPR_the_spanish_red_army_desc: "กองทัพใหมที่ภักดีจะถูกจัดตั้งขึ้นเพื่อปกปองผลประโยชนของกรรมกรสเปนจากภัยคุกคามตางชาติ เราจะจําลองแบบจากกองทัพของสหภาพโซเวียต"
 SPR_expand_soviet_aid: "ขยายความชวยเหลือจากโซเวียต"
 SPR_expand_soviet_aid_desc: "เราไมอาจรับมือสงครามนี้ไดดวยตัวเอง เราตองไดรับความชวยเหลือจากนานาชาติ ตองทําให[SOV.GetNameDefCap]เขาใจวาการตอสูอันสําคัญยิ่งกับฟาสซิสตอยูที่นี่ในไอบีเรีย และที่นี่คือที่ที่ตองหยุดยั้งการรุกคืบของฟาสซิสต"
 SPR_expand_soviet_aid_tt: "\n§Rความชวยเหลือจากโซเวียตจะมาพรอมราคาที่สูง ซึ่งตองชดใชหลังสงครามกลางเมืองสิ้นสุดลง!§!\n"
 SPR_soviet_equipment_shipments: "การขนสงยุทโธปกรณจากโซเวียต"
 SPR_soviet_equipment_shipments_desc: "สิ่งที่อุตสาหกรรมภายในประเทศของเราจัดหาใหไมได ตองชดเชยดวยอาวุธที่ขนสงมาจาก[SOV.GetNameDef]"
 SPR_soviet_military_advisors: "ที่ปรึกษาทางทหารโซเวียต"
 SPR_soviet_military_advisors_desc: "ที่ปรึกษาทางทหารโซเวียตอาจมอบความไดเปรียบที่ทหารและผูนําของเราตองการเพื่อเอาชนะศัตรู"
 SPR_soviet_industrial_aid: "ความชวยเหลือทางอุตสาหกรรมจากโซเวียต"
 SPR_soviet_industrial_aid_desc: "การขนสงอาวุธเพียงอยางเดียวไมอาจเติมเต็มโควตาที่ทหารแนวหนาของเราตองการ ความชวยเหลือจากโซเวียตในการขยายอุตสาหกรรมภายในประเทศอาจชวยชดเชยสวนตางนี้ไดในตอนนี้ และบางทีอาจถึงขั้นพึ่งพาตนเองไดอยางสมบูรณในที่สุด"
 SPR_soviet_technological_advancements: "ความกาวหนาทางเทคโนโลยีของโซเวียต"
 SPR_soviet_technological_advancements_desc: "[SOV.GetNameDefCap]มีเทคโนโลยีที่เราไมมี ดวยเปาหมายรวมกันในการเอาชนะฟาสซิสต พวกเขาคงยินดีแบงปนความกาวหนาเหลานี้กับเราเปนแน?"
 SPR_soviet_recovery_aid: "ความชวยเหลือฟนฟูจากโซเวียต"
 SPR_soviet_recovery_aid_desc: "เมื่อชนะสงครามแลว [SOV.GetNameDef]พรอมชวยเหลือเราในการฟนฟูประเทศ"
 SPR_all_must_do_their_part: "ทุกคนตองทําหนาที่ของตน"
 SPR_all_must_do_their_part_desc: "เพื่อใหอุดมการณสังคมนิยมประสบความสําเร็จ ทุกคนตองมีสวนรวม เราไมมีที่วางใหความแตกแยกภายในระหวางชุมชนตาง ๆ"
 SPR_the_red_tide: "กระแสแดง"
 SPR_the_red_tide_desc: "ประชาชนของเรารูวาอุดมการณของเราชอบธรรมและถูกตอง สิ่งที่เราตองทํามีเพียงใชความรูสึกนี้เพื่อใหมีทหารใหมที่มุงมั่นไหลเขาสูกองทัพอยางตอเนื่อง ดุจกระแสนํ้าสีแดง กองกําลังของเราจะถาโถมเขาใสทุกคนที่ตอตานเรา"
 SPR_arm_the_tide: "ติดอาวุธใหกระแสแดง"
 SPR_arm_the_tide_desc: "หากปราศจากยุทโธปกรณที่เพียงพอ ความกระตือรือรนของกรรมกรสังคมนิยมแตละคนก็ไมอาจประสบความสําเร็จในสนามรบ เราจะมอบเครื่องมือในการทําสงครามที่พวกเขาตองการ"
 SPR_against_fascism: "ตอตานฟาสซิสต"
 SPR_against_fascism_desc: "ศัตรูฟาสซิสตอาจพายแพบนคาบสมุทรไอบีเรียแลว แตยังคงดํารงอยูนอกพรมแดนของเรา เราตองเขารวมการตอสูระดับนานาชาติเพื่อดับมันใหสิ้นซาก"
 SPR_doctrinal_advancements: "ความกาวหนาทางหลักนิยม"
 SPR_doctrinal_advancements_desc: "บทเรียนที่เราไดรับจากสงครามกลางเมืองสามารถพัฒนาตอยอดเปนหลักนิยมทางทหารใหมที่เหมาะสมกับความเปนจริงของการสงครามในปจจุบันยิ่งขึ้น"
 SPR_lessons_from_the_civil_war: "บทเรียนจากสงครามกลางเมือง"
 SPR_lessons_from_the_civil_war_desc: "การตอสูในสงครามกลางเมืองไดสอนบทเรียนมากมายเกี่ยวกับศิลปะแหงการสงคราม เราคงโงเขลาหากไมนําบทเรียนเหลานี้มาใชกับกองทัพรูปแบบใหมของเรา"
 SPR_nationalize_the_industry: "โอนอุตสาหกรรมเปนของรัฐ"
 SPR_nationalize_the_industry_desc: "แทนที่จะปลอยใหอุตสาหกรรมของเราทรุดโทรมอยูในมือของนักลงทุนและบริษัท เราจะนํามันมาอยูภายใตการควบคุมของรัฐ เพื่อกํากับและจัดระเบียบการผลิตใหดีขึ้น"
 SPR_beacon_of_socialism: "ประภาคารแหงสังคมนิยม"
 SPR_beacon_of_socialism_desc: "ประเทศของเราคือประภาคารอันเจิดจาแหงสังคมนิยม ซึ่งยอมดึงดูดนักวิทยาศาสตรที่มีความคิดเหมือนกันและปรารถนาจะรับใชอุดมการณของกรรมกร"
 SPR_increase_arms_production: "เพิ่มการผลิตอาวุธ"
 SPR_increase_arms_production_desc: "เพื่อปกปองอุดมการณคอมมิวนิสต กองทัพของเราตองการอาวุธ ขีดความสามารถทางอุตสาหกรรมของประเทศอันยิ่งใหญของเราตองไดรับการปรับปรุงเพื่อใหเราจัดหาอาวุธเหลานี้ได"
 SPR_exploit_spains_riches: "ใชประโยชนจากความมั่งคั่งของสเปน"
 SPR_exploit_spains_riches_desc: "คาบสมุทรไอบีเรียอุดมไปดวยทรัพยากรธรรมชาติ การนําทรัพยากรเหลานี้มาใชจะเสริมความแข็งแกรงใหอุตสาหกรรมสงครามของเราอยางมาก และยังสรางความมั่งคั่งที่นําไปใชฟนฟูประเทศได"
 SPR_unify_the_london_bureau: "รวมสํานักงานลอนดอน"
 SPR_unify_the_london_bureau_desc: "เพื่อตอบโตการกอตั้งองคการสากลที่สามและการแยงชิงอํานาจระหวางทรอตสกีกับสตาลิน สํานักงานระหวางประเทศเพื่อเอกภาพสังคมนิยมปฏิวัติจึงถูกกอตั้งขึ้น โดยปฏิเสธการตีความลัทธิมารกซของทั้งสองฝาย เราจะติดตอเครือขายของเราที่นั่นเพื่อสรางแนวรวมสังคมนิยมตอตานลัทธิทรอตสกีและลัทธิสตาลิน"
 SPR_against_trotskyism_and_stalinism: "ตอตานลัทธิทรอตสกีและลัทธิสตาลิน"
 SPR_against_trotskyism_and_stalinism_desc: "การทะเลาะเบาะแวงระหวางทรอตสกีกับสตาลินและผูสนับสนุนของพวกเขาไดบอนทําลายเอกภาพและความเปนหนึ่งเดียวของอุดมการณสังคมนิยมมานานเกินไปแลว หากพวกเขาไมอาจละทิ้งความแตกตางได เราก็ตองกําจัดอิทธิพลของพวกเขาออกจากอุดมการณของเรา"
 SPR_against_trotskyism_and_stalinism_tt: "ไดรับเปาหมายสงคราม §Y$puppet_wargoal_focus$§! ตอ §Yสหภาพโซเวียตฝายสตาลิน§! หรือ §Yสหภาพโซเวียตฝายทรอตสกี§! หรือ §Yเม็กซิโก§!"
 SPR_red_bulwark_in_the_west: "ปราการแดงแหงตะวันตก"
 SPR_red_bulwark_in_the_west_desc: "ที่ตั้งทางภูมิศาสตรของเราโดดเดี่ยวจากพันธมิตร หากเราถูกโจมตี โดยเฉพาะจากมหาอํานาจทางทะเลที่แข็งแกรง เราจะไมสามารถพึ่งพาความชวยเหลือจาก[SOV.GetNameDef]ได ดังนั้นเราตองทําใหแนวปองกันของเราแข็งแกรงพอจะเปนปอมปราการแหงสังคมนิยม เปนหลักยึดทางตะวันตกในยุโรป"
 SPR_appeal_for_increased_autonomy: "รองขออํานาจปกครองตนเองเพิ่มขึ้น"
 SPR_appeal_for_increased_autonomy_desc: "ราคาของความชวยเหลือจาก[SOV.GetAdjective]ที่ทําใหเราไดรับชัยชนะคือการยอมอยูใตอํานาจ เราไดพิสูจนแลววาเปนผูพิทักษสังคมนิยมที่ภักดีและมีความสามารถ ซึ่งมอสโกยอมรับรูเปนแน บางทีเราอาจโนมนาวใหพวกเขาผอนบังเหียนลงได"
 SPR_modernize_the_armed_forces: "ปรับปรุงกองทัพใหทันสมัย"
 SPR_modernize_the_armed_forces_desc: "สถานะอันเปราะบางของเราทางตะวันตกของยุโรปจะแข็งแกรงขึ้นอยางมาก ดวยการพัฒนาอาวุธและยุทโธปกรณใหมใหแกกองทัพของเรา"
 SPR_a_red_iberia: "ไอบีเรียสีแดง"
 SPR_a_red_iberia_desc: "ถึงเวลาแลวที่จะรวมคาบสมุทรไอบีเรียทั้งหมดใหเปนหนึ่งเดียวภายใตธงแหงสังคมนิยม"
 SPR_support_french_communists: "สนับสนุนคอมมิวนิสตฝรั่งเศส"
 SPR_support_french_communists_desc: "[FRA.GetNameDefCap]มีกระแสความนิยมคอมมิวนิสตในประวัติศาสตรชวงหลัง หากพวกเขาเห็นคุณคาของความรวมมือกับเราในการผลักดันเปาหมายของกรรมกร เราจะรวมมือกัน แตหากพวกเขายังไมตาสวาง เราตองนําสังคมนิยมไปสูพวกเขาดวยกําลัง"
 SPR_avenge_foreign_interference: "ชําระแคนการแทรกแซงของตางชาติ"
 SPR_avenge_foreign_interference_desc: "มหาอํานาจตางชาติเขาแทรกแซงสงครามกลางเมืองเพื่อตอตานเรา โดยสนับสนุนศัตรูฟาสซิสตของเรา เรายังไมลืมเรื่องนี้ และบัดนี้ถึงเวลาตอบโตแลว"
 SPR_avenge_foreign_interference_tt: "ไดรับเปาหมายสงครามตอทุกประเทศที่สงอาสาสมัครไปชวยฝายชาตินิยมในสงครามกลางเมือง\n"
 SPR_provide_for_the_people: "เลี้ยงดูประชาชน"
 SPR_provide_for_the_people_desc: "ภารกิจแรกคือการรับประกันการจัดหาอาหารใหแกประชาชน ชัยชนะของเราตองไมถูกบดบังดวยหายนะแหงความอดอยาก"
 SPR_collectivize_industry: "รวมอุตสาหกรรมเปนของสวนรวม"
 SPR_collectivize_industry_desc: "การรวมอุตสาหกรรมเปนของสวนรวมจะชวยเพิ่มผลิตภาพและขวัญกําลังใจของกรรมกรยิ่งขึ้น"
 SPR_connect_the_country: "เชื่อมโยงประเทศ"
 SPR_connect_the_country_desc: "โครงการโครงสรางพื้นฐานครั้งใหญที่ครอบคลุมทั่วประเทศจะชวยใหขนสงสินคาระหวางพื้นที่หางไกลที่สุดของคาบสมุทรไดอยางรวดเร็ว ซึ่งจะเปนประโยชนตอเราในระยะยาว"
 SPR_transplant_soviet_industry: "ยายอุตสาหกรรมโซเวียตมาตั้ง"
 SPR_transplant_soviet_industry_desc: "โซเวียตไดแสดงใหเห็นวาพวกเขาเชี่ยวชาญเปนพิเศษในการยายโรงงานทั้งโรงงาน แมในระยะทางหลายพันกิโลเมตร เพื่อเรงการเริ่มตนอุตสาหกรรมทหารภายในประเทศของเรา เราจะขอใหยายโรงงานที่มีความสําคัญนอยกวาบางแหงของพวกเขามายังคาบสมุทรไอบีเรีย"
 SPR_the_five_year_plan: "แผนหาป"
 SPR_the_five_year_plan_desc: "แผนใหมอันกลาหาญจะเปลี่ยนรัฐสเปนใหกลายเปนขุมพลังทางอุตสาหกรรมของภูมิภาคภายในระยะเวลาไมเกินหาป"
 SPR_slipway_enlargement: "ขยายคานเรือ"
 SPR_slipway_enlargement_desc: "เพื่อตอเรือรบขนาดใหญขึ้น เราตองพิจารณาขยายสิ่งอํานวยความสะดวกของอูตอเรือ"
 SPR_a_red_fleet: "กองเรือแดง"
 SPR_a_red_fleet_desc: "จําเปนตองมีกองทัพเรือที่ทรงพลังเพื่อทําหนาที่ของเราในการเผยแพรสังคมนิยมไปทั่วโลก การสรางกองเรือแดงของเราเริ่มตนขึ้นในวันนี้"
 SPR_maintain_the_second_republic: "ธํารงสาธารณรัฐที่สอง"
 SPR_maintain_the_second_republic_desc: "กองทัพผูกอกบฏไมประสบความสําเร็จในการพยายามกอรัฐประหาร และรัฐบาลของเรายังคงปกครองไดอยางเสรี สาธารณรัฐที่สองจะมีชัยเหนือภัยคุกคามจากฝายขวา ดังที่เคยมีชัยเหนือการนัดหยุดงานของคนงานเหมืองในป 1934"
 SPR_new_leadership: "ผูนําชุดใหม"
 SPR_new_leadership_desc: "สาธารณรัฐตองการผูนําชุดใหมเพื่อใหอยูรอดผานชวงเวลาอันยากลําบากนี้ เราจะนําที่ปรึกษาและรัฐมนตรีที่มีมุมมองใหมในการตอสูกับภัยคุกคามฟาสซิสตเขามา เพื่อใหเราปกปองหลักการและความเชื่อของเราไดดียิ่งขึ้น"
 SPR_the_future_of_the_republic: "อนาคตของสาธารณรัฐ"
 SPR_the_future_of_the_republic_desc: "การตอสูในปจจุบันยอมถูกมองวาเปนจุดชี้ชะตาอนาคตของสาธารณรัฐอยางไมตองสงสัย เราตองไมยอทอและไมเสียดายคาใชจายใด ๆ เพื่อกําหนดอนาคตนี้อยางเหมาะสม"
 SPR_petition_for_french_aid: "รองขอความชวยเหลือจากฝรั่งเศส"
 SPR_petition_for_french_aid_desc: "เพื่อนบานทางเหนือของเรายังลังเลที่จะใหความชวยเหลือ ดวยเกรงวาจะเกิดความไมสงบภายในหากพวกเขาลงมือทําสิ่งใด เราไมอาจปลอยใหพวกเขาลังเลเชนนี้ตอไป การอยูรอดของเราขึ้นอยูกับความเต็มใจที่จะลงมือของพวกเขา"
 SPR_petition_for_french_aid_tt: "§R[FRA.GetNameDefCap]ตองยอมรับขอตกลงเพื่อใหโบนัสมีผล§!\n"
 SPR_ensure_loyalty: "สรางความมั่นใจในความภักดี"
 SPR_ensure_loyalty_desc: "รัฐบาลถูกกองทัพของตนทรยศอยางโหดรายที่สุด กาวแรกในการเยียวยาบาดแผลนี้คือการทําใหมั่นใจวานายทหารทุกนายที่เราแตงตั้งนับจากนี้มีความภักดี"
 SPR_enlist_the_carabineros: "เกณฑการาบิเนโรส"
 SPR_enlist_the_carabineros_desc: "ในฐานะมาตรการชั่วคราวเพื่อสงกําลังพลไปประจําแนวหนา เราตองหันไปใชวิธีที่แหวกแนว เมื่อไมมีกองทัพ การาบิเนโรส ซึ่งเปนกองกําลังกึ่งทหารรักษาชายแดนและศุลกากร ก็เปนกําลังที่ดีพอจะประจําสนามเพลาะได"
 SPR_enlist_the_carabineros_tt: "ไดรับหนวย 1 หนวยที่มีกองพัน §Yทหารราบ 3§! กองพันใน 5 รัฐแบบสุม\n"
 has_hired_juan_negrin_tt: "§Yฮวน เนกริน§!: ไดรับการแตงตั้งเปนที่ปรึกษา"
 SPA_embrace_pan_hispanism: "ยอมรับชาตินิยมแพนฮิสแปนิก"
 SPA_embrace_pan_hispanism_desc: "ในชวงไมกี่ปที่ผานมา กระแสแพนฮิสแปนิกไดพุงสูงขึ้นทั่วอดีตอาณานิคมของเรา และบัดนี้เมื่อการรณรงคยึดคืนของเราประสบความสําเร็จ ถึงเวลาที่จะยอมรับแนวคิดของพวกเขา เพื่อใหจักรวรรดิสเปนยืนหยัดตอไปอีกพันป!"
 SPA_embrace_pan_hispanism_tt: "เราควบคุมรัฐดินแดนหลักทุกแหงของ §Y[CHL.GetName]§!, §Y[ARG.GetName]§!, §Y[ECU.GetName]§!, §Y[PRU.GetName]§!, §Y[URG.GetName]§!, §Y[PAR.GetName]§!, §Y[BOL.GetName]§!, §Y[COL.GetName]§!, §Y[VEN.GetName]§!, §Y[PAN.GetName]§!, §Y[COS.GetName]§!, §Y[NIC.GetName]§!, §Y[HON.GetName]§!, §Y[ELS.GetName]§!, §Y[GUA.GetName]§!, §Y[MEX.GetName]§!, §Y[DOM.GetName]§!, §Y[CUB.GetName]§! และ §Y[PUE.GetName]§!"
 SPA_absorb_the_portuguese_empire_tt: "เราจะไดรับดินแดนหลักในดินแดนหลักของ §Yโปรตุเกส§! ทั้งหมดที่เราควบคุม"
 SPR_the_popular_army: "กองทัพประชาชน"
 SPR_the_popular_army_desc: "กองทัพใหมของเราจะประกอบดวยผูที่ไมแปดเปอนการทรยศของกองทัพ คือประชาชนผูแรงกลาในการปกปองหลักการที่สาธารณรัฐยึดถือ แมอาจไมเคยรับราชการทหารมากอน ควบคูกับการปรับโครงสรางนี้ เราจะพัฒนาอาวุธและหลักนิยมใหมเพื่อชวยกองทัพใหมในการตอสูดวย"
 SPR_take_the_initiative: "ชวงชิงความริเริ่ม"
 SPR_take_the_initiative_desc: "เราไมอาจนิ่งเฉยขณะที่ศัตรูเลือกไดวาจะโจมตีเราเมื่อใดและที่ใด สงครามจะชนะไดดวยการแสดงความริเริ่ม และนั่นคือสิ่งที่เราตองทํา"
 SPR_no_pasaran: "¡No Pasarán!"
 SPR_no_pasaran_desc: "ใหปณิธานของผูตอตานฟาสซิสตกองกังวานจากทุกบานในทุกเมือง จากทุกหลังคาสูทุกถนน จากทุกเครื่องกีดขวางสูทุกคูเพลาะ: "¡No Pasarán!" - พวกมันจะผานไปไมได!"
 SPR_no_pasaran_tt: "สราง §Yปอม 1 แหง§! ในทุกจังหวัดที่มี §Yจุดชัยชนะ 1 แตม§! ในรัฐที่ควบคุม\nสราง §Yปอม 2 แหง§! ในทุกจังหวัดที่มี §Yจุดชัยชนะ 3 แตม§! ในรัฐที่ควบคุม\nสราง §Yปอม 3 แหง§! ในทุกจังหวัดที่มี §Yจุดชัยชนะ 10 แตม§! ในรัฐที่ควบคุม\nสราง §Yปอม 4 แหง§! ในทุกจังหวัดที่มี §Yจุดชัยชนะ 30 แตม§! ขึ้นไปในรัฐที่ควบคุม\n"
 SPR_a_frontline_suited_for_intellectuals: "แนวหนาที่เหมาะกับปญญาชน"
 SPR_a_frontline_suited_for_intellectuals_desc: "การใหผูมีสติปญญาเฉียบแหลมที่สุดของเราไปสูกับฟาสซิสตที่แนวหนานั้นเปนการสูญเปลา - พวกเขาจะมีประโยชนมากกวามากหากอยูหางไกลหลังแนวรบ คอยสรางเครื่องมือสงครามใหม ๆ ที่เปนประโยชนตอการตอสูของเรามากกวาทหารเพิ่มอีกไมกี่นาย"
 SPR_strengthen_the_anti_fascist_coalition: "เสริมความแข็งแกรงแนวรวมตอตานฟาสซิสต"
 SPR_strengthen_the_anti_fascist_coalition_desc: "เราไดกําจัดฝายที่เห็นตางในแนวรวมของเราแลว - หวังวานี่จะหมายความวาในที่สุดเราก็สามารถมุงเสริมความมุงมั่นรวมกันในการถอนรากถอนโคนฟาสซิสตได"
 SPR_oppose_the_communists: "ตอตานคอมมิวนิสต"
 SPR_oppose_the_communists_desc: "พวกคอมมิวนิสตเปนเพียงพันธมิตรที่จําเปนในการตอสูกับฟาสซิสตเทานั้น เมื่อการตอสูนั้นจบลง เราตองจัดการกับพวกเขาดวยวิธีของเราเอง"
 SPR_fortify_the_central_government: "เสริมความแข็งแกรงรัฐบาลกลาง"
 SPR_fortify_the_central_government_desc: "เราตองเสริมความแข็งแกรงใหรัฐบาลเพื่อตานทานอิทธิพลคอมมิวนิสต มิฉะนั้นพวกเขาอาจแอบยึดอํานาจควบคุมสาธารณรัฐจากภายในได"
 SPR_secure_democratic_principles: "ปกปองหลักการประชาธิปไตย"
 SPR_secure_democratic_principles_desc: "เราไมอาจปลอยใหอิทธิพลคอมมิวนิสตเปลี่ยนแปลงหรือกระทั่งทําลายหลักการที่สาธารณรัฐที่สองกอตั้งขึ้นมา - ไมวาความสัมพันธของเรากับคอมมิวนิสตหรือ[SOV.GetNameDef]จะเปนเชนไร หลักการเหลานี้ตองถูกเก็บไวในใจเรา แมจะไมไดแสดงออกอยางเปดเผยก็ตาม"
 SPR_subvert_soviet_control: "บอนทําลายการควบคุมของโซเวียต"
 SPR_subvert_soviet_control_desc: "ราคาของความชวยเหลือจาก[SOV.GetAdjective]ที่ทําใหเราไดรับชัยชนะคือการยอมอยูใตอํานาจ ดูเหมือนวาความทุกขยากของเรายังไมจบสิ้น เราจะเริ่มบอนทําลายความพยายามของ[SOV.GetAdjective]ในการแผอิทธิพลคอมมิวนิสตเหนือประเทศของเรา เพื่อเตรียมพรอมสําหรับการตอสูครั้งสุดทายเพื่อเสรีภาพและเอกราชของเรา"
 SPR_subvert_soviet_control_tt: "\n§R[SOV.GetNameDefCap]มีแนวโนมจะลงโทษเราจากการไมเชื่อฟง!§!\n"
 SPR_war_of_independence: "สงครามประกาศอิสรภาพ"
 SPR_war_of_independence_desc: "ถึงเวลาแลวที่เราจะหันหลังใหพันธมิตรเกา มิฉะนั้นเราจะถูกเปลี่ยนเปนรัฐสมาชิกอีกรัฐหนึ่งของสหภาพ ประชาชนของเราตองทุมเทครั้งสุดทายครั้งใหญเพื่อใหไดมาซึ่งรางวัลสูงสุด คืออิสรภาพจากอํานาจนิยมทั้งฝายซายและฝายขวา"
 SPR_war_of_independence_tt: "§Rหากพวกเขาไมยอมรับขอเรียกรองของเรา สิ่งนี้จะนําไปสูสงคราม!§!"
 SPR_those_who_would_not_help_us: "ผูที่ไมยอมชวยเหลือเรา"
 SPR_those_who_would_not_help_us_desc: "เราถูกโลกตะวันตกทอดทิ้งในการตอสูกับฟาสซิสต แตสิ่งตาง ๆ เปลี่ยนไปแลวนับตั้งแตนั้น และพวกเขาก็พบวาตนเองอยูในสงครามเชนกัน บัดนี้เราตองการความชวยเหลือจากพวกเขาอีกครั้ง และบางทีครั้งนี้พวกเขาอาจไดเรียนรูที่จะใสใจเราเมื่อเราเปนกองหนาตอตานศัตรูรายใหม"
 SPR_those_who_would_not_help_us_tt: "§Rประเทศตาง ๆ ตองยอมรับขอตกลงเพื่อใหโบนัสมีผล§!\n"
 SPR_ideological_allies: "พันธมิตรทางอุดมการณ"
 SPR_ideological_allies_desc: "สเปนถูกหลอมขึ้นใหมในเบาหลอมแหงสงครามกลางเมือง - เราจะยืนหยัดเคียงขางพันธมิตรทางอุดมการณตอตานลัทธิสุดโตงทั้งของฝายขวาและฝายซาย"
 SPR_enemies_of_our_enemy: "ศัตรูของศัตรูเรา"
 SPR_enemies_of_our_enemy_desc: "แมพวกเขาจะเคยชวยเหลือศัตรูของเราในสงครามกลางเมือง แตบัดนี้เรามีศัตรูรวมกัน บางทีถึงเวลาที่จะละทิ้งความแตกตางไวกอน จนกวาการตอสูที่ยิ่งใหญกวาจะไดรับชัยชนะ"
 SPR_deal_with_the_devil: "ทําขอตกลงกับปศาจ"
 SPR_deal_with_the_devil_desc: "ชาวเยอรมันมีประสบการณมากมายในการรบกับโซเวียต และแมเราจะไมมีวันตกลงเปนพันธมิตรอยางเปนทางการ แตการแลกเปลี่ยนความรูทางทหารของพวกเขาอาจมอบความไดเปรียบที่ชัดเจนในการทําสงครามกับศัตรูรวมของเรา"
 SPR_deal_with_the_devil_tt: "§R[GER.GetNameDefCap]ตองยอมรับขอตกลงเพื่อใหโบนัสมีผล§!\n"
 SPR_foreign_industrial_aid: "ความชวยเหลือทางอุตสาหกรรมจากตางชาติ"
 SPR_foreign_industrial_aid_desc: "เมื่อสนธิสัญญาใหมของเรามีผลแลว เราจะจูงใจใหธุรกิจตางชาติมาลงทุนในประเทศและชวยฟนฟูประเทศของเรา"
 SPR_stabilize_the_nation: "สรางเสถียรภาพใหประเทศ"
 SPR_stabilize_the_nation_desc: "เราผานพนสงครามกลางเมืองมาไดอยางมีชัย แตบัดนี้เราตองทําใหเสถียรภาพกลับคืนมา และใหแนใจวาสิ่งนี้จะไมเกิดขึ้นอีก"
 SPR_end_fascism_at_all_costs: "กําจัดฟาสซิสตไมวาตองแลกดวยอะไร"
 SPR_end_fascism_at_all_costs_desc: "ไมมีสิ่งใดสําคัญไปกวาการทําลายลางพวกฟาสซิสตใหสิ้นซาก - หากเราตองขายวิญญาณใหคอมมิวนิสตเพื่อบรรลุเปาหมายนี้ ก็ใหเปนเชนนั้น"
 SPR_communists_in_the_government: "คอมมิวนิสตในรัฐบาล"
 SPR_communists_in_the_government_desc: "อิทธิพลคอมมิวนิสตในรัฐบาลเพิ่มขึ้นจนถึงขั้นที่พวกเขาเรียกรองใหเปลี่ยนผูนําทั้งหมดเพื่อสะทอนความเปนจริงใหมของสาธารณรัฐ"
 SPR_communists_in_the_government_tt: "รัฐมนตรีฝายสตาลินนิสต§Gพรอมใหแตงตั้ง§! แตรัฐมนตรีฝายประชาธิปไตยจะถูก§Rถอดออก§!\n"
 SPR_restore_higher_education: "ฟนฟูการอุดมศึกษา"
 SPR_restore_higher_education_desc: "สถาบันอุดมศึกษาที่เสียหายระหวางสงครามควรไดรับการสรางขึ้นใหมและขยายใหใหญขึ้น เพื่อใหมีผูมีสติปญญาเฉียบแหลมปอนเขาสูอุตสาหกรรมอยางตอเนื่อง"
 SPR_engineering_advances: "ความกาวหนาทางวิศวกรรม"
 SPR_engineering_advances_desc: "ความกาวหนาใหมทางวิศวกรรมชวยใหสรางอุตสาหกรรมที่ดีขึ้นได ตลอดจนอากาศยานและยานเกราะแบบใหม"
 SPR_rebuild_the_nation: "สรางชาติขึ้นใหม"
 SPR_rebuild_the_nation_desc: "หลังความสยดสยองของสงครามกลางเมือง เสถียรภาพไดกลับคืนมา และเรากําลังคอย ๆ ตั้งหลักทางอุตสาหกรรมไดอีกครั้ง ชวงเวลาแหงการลงทุนอยางกวางขวางในโครงการขยายอุตสาหกรรมยอมเปนแรงกระตุนที่เศรษฐกิจของเราตองการเพื่อกลับมาเดินหนาไดอีกครั้ง"
 SPR_reprofessionalize_the_military: "ฟนความเปนมืออาชีพใหกองทัพ"
 SPR_reprofessionalize_the_military_desc: "ดวยความจําเปน กองทัพของเราถูกสรางขึ้นใหมจากผูที่ไมไดรับการอบรมดานวินัยเครงครัดของชีวิตทหาร เพื่อเปลี่ยนกองทัพของเราจากกองกําลังฉุกเฉินชั่วคราวใหเปนกองทัพแหงชาติที่แทจริง เราตองฟนความเปนมืออาชีพและปลูกฝงวินัยและโครงสรางการบังคับบัญชาที่เหมาะสม"
 SPR_experiences_from_the_civil_war: "ประสบการณจากสงครามกลางเมือง"
 SPR_experiences_from_the_civil_war_desc: "ประสบการณของกองทัพเราในสงครามกลางเมืองนําไปสูความกาวหนาครั้งใหญในแนวคิดทางทหารและการพัฒนายุทโธปกรณ"
 SPR_a_new_military_academy: "โรงเรียนนายรอยแหงใหม"
 SPR_a_new_military_academy_desc: "เพื่อบรรลุเปาหมายในการมีกองทัพแหงชาติที่เปนมืออาชีพอยางแทจริง เราตองจัดตั้งโรงเรียนนายรอยแหงใหม เพื่อใหนายทหารของเราดีที่สุดเทาที่จะเปนได"
 SPR_revive_the_republican_navy: "ฟนฟูกองทัพเรือสาธารณรัฐ"
 SPR_revive_the_republican_navy_desc: "กองทัพเรือของเราแตกแยกไมตางจากกองทัพบกเมื่อสงครามกลางเมืองเริ่มตน และการสรางขึ้นใหมควรเปนสิ่งสําคัญลําดับตนเพื่อความมั่นคงของชาติ ซึ่งตองจัดตั้งโครงสรางพื้นฐานใหมที่เราจะเริ่มดําเนินการทันที"
 SPR_navy_modernization: "ปรับปรุงกองทัพเรือใหทันสมัย"
 SPR_navy_modernization_desc: "ขอดีประการหนึ่งของความสูญเสียที่เราไดรับคือ เราไมมีเหตุผลที่จะไมตอเรือรุนใหมที่ทันสมัย เราควรสอบถามหาแบบเรือที่เหมาะสมและเริ่มตอทันที"
 SPR_expand_the_naval_academy: "ขยายโรงเรียนนายเรือ"
 SPR_expand_the_naval_academy_desc: "สงครามกลางเมืองไดแสดงใหเห็นขอบกพรองในการนําของกองทัพเรือ การยกระดับคุณภาพของโรงเรียนนายเรือรวมถึงการขยายขนาด จะทําใหความผิดพลาดทางยุทธวิธีและยุทธศาสตรที่มีราคาแพงเหลานี้เกิดขึ้นนอยลงมากในอนาคต"
 SPR_prepare_for_the_next_war: "เตรียมพรอมสําหรับสงครามครั้งหนา"
 SPR_prepare_for_the_next_war_desc: "อุตสาหกรรมทหารของเราตองขยายตัวหากเราจะยืนหยัดตอภัยคุกคามจากตางชาติตอประเทศที่บอบชํ้าจากสงครามของเรา เราตองพรอมรับมือกับทุกสิ่งที่อาจเกิดขึ้น"
 SPR_wartime_industry: "อุตสาหกรรมยามสงคราม"
 SPR_wartime_industry_desc: "เราตกอยูในภาวะสงครามอีกครั้ง ดังนั้นเราตองทําใหการขยายอุตสาหกรรมมุงตอบสนองความตองการทางทหารมากกวาความตองการของพลเรือน"
 SPR_fuel_for_the_war_machine: "เชื้อเพลิงสําหรับเครื่องจักรสงคราม"
 SPR_fuel_for_the_war_machine_desc: "ทรัพยากรมีความสําคัญสูงสุดตออุตสาหกรรมสงครามของเรา และยิ่งเราพึ่งพาตนเองในดานนี้ไดมากเทาใดก็ยิ่งดี การสรางเหมือง โรงถลุงเหล็กกลา และโรงถลุงอะลูมิเนียมแหงใหมทั่วประเทศจะชวยใหเรากาวไปสูการพึ่งพาตนเองไดอยางมาก"
 SPR_join_the_global_fight_against_fascism: "รวมตอสูกับฟาสซิสตทั่วโลก"
 SPR_join_the_global_fight_against_fascism_desc: "เราไดเอาชนะฟาสซิสตในสเปนแลว แตฟาสซิสตยังคงดํารงอยูในชาติอื่น ๆ ทั่วโลก เปนหนาที่ของเราที่จะตองสูจนถึงที่สุด"
 SPR_the_anti_fascist_crusade: "สงครามครูเสดตอตานฟาสซิสต"
 SPR_the_anti_fascist_crusade_desc: "ชาวสเปนตอสูกับพวกฟาสซิสตมากอนที่ใครจะตระหนักถึงภัยอันตรายเสียอีก การตอสูนี้คือการตอสูของเรา และเราจะไมหยุดจนกวาจะไดรับชัยชนะ"
 FRA_devalue_the_franc_desc: "ขณะที่ประเทศอื่น ๆ ยอมใหคาเงินของตนลดลงเพื่อชวยเศรษฐกิจ เรากลับปฏิเสธมาอยางแนวแน ผลก็คือเศรษฐกิจของเราลาหลังประเทศอื่น หากเราตองการแขงขันไดมากขึ้นและฝาพายุที่กําลังจะมาถึง เราตองไมปดตกการลดคาเงินโดยไมไตรตรอง แมวามันจะเปนมาตรการที่ไมเปนที่นิยมก็ตาม"
 FRA_autoroutes: "ทางหลวงพิเศษ"
 FRA_autoroutes_desc: "ชาวเยอรมันทําใหโลกตะลึงดวยแนวคิดถนนความเร็วสูงที่ควบคุมทางเขาออก ซึ่งเชื่อมตอสวนตาง ๆ ของประเทศ เราสามารถแสดงใหโลกเห็นวาเราทําไดดีไมแพกัน"
 FRA_invest_in_the_metropole: "พัฒนาประเทศแม"
 FRA_invest_in_the_metropole_desc: "กาวแรกในการฟนฟูอุตสาหกรรมของเราตองเปนการปรับปรุงฐานอุตสาหกรรมในดินแดนบนภาคพื้นทวีป"
 FRA_invest_in_the_colonies: "พัฒนาอาณานิคม"
 FRA_invest_in_the_colonies_desc: "ศูนยกลางอุตสาหกรรมของเราในยุโรปไมมีประชากรและทรัพยากรเพียงพอที่จะรองรับการขยายอุตสาหกรรมขนาดใหญ หากเศรษฐกิจของเราจะแขงขันกับสวนอื่นของโลกได เราตองใชประโยชนจากอาณานิคม"
 FRA_colonial_industry_effect_tt: "เพิ่ม §Yโรงงานพลเรือน§! สองแหงในทุกรัฐอาณานิคมที่เคยลงทุนไว\n"
 FRA_industrial_expansion_effect_tt: "เพิ่ม §Yโรงงานพลเรือน§! สองแหงในรัฐของประเทศแมที่เคยลงทุนไว\n"
 FRA_military_factories_effect_tt: "เพิ่ม §Yโรงงานทหาร§! สองแหงในทุกรัฐที่เคยลงทุนไว\n"
 FRA_invest_in_west_africa: "ลงทุนในแอฟริกาตะวันตก"
 FRA_invest_in_west_africa_desc: "แรงงานและทรัพยากรจํานวนมหาศาลในแอฟริกาตะวันตกทําใหที่นี่เหมาะอยางยิ่งสําหรับการลงทุน"
 FRA_invest_in_indochina: "ลงทุนในอินโดจีน"
 FRA_invest_in_indochina_desc: "ระยะทางอันไกลโพนระหวางดินแดนในอินโดจีนกับประเทศแมอาจดูเปนขอเสีย แตก็ชวยปกปองอุตสาหกรรมที่นั่นจากการโจมตีของศัตรูดวย"
 FRA_invest_in_syria: "ลงทุนในซีเรีย"
 FRA_invest_in_syria_desc: "ซีเรียตั้งอยูในตําแหนงที่เหมาะสมอยางยิ่งในการสงเสบียงใหเราหากเกิดสงครามในยุโรปหรือแอฟริกา การเพิ่มศักยภาพทางอุตสาหกรรมของซีเรียยังชวยเสริมสถานะของเราในภูมิภาคนี้ดวย"
 FRA_global_integration: "การบูรณาการระดับโลก"
 FRA_global_integration_desc: "จักรวรรดิอังกฤษเปนระบบที่ไดรับการปรับแตงอยางประณีต ซึ่งแตละสวนคอยคํ้าจุนซึ่งกันและกัน ไมมีอะไรบอกวาเราจะทําไดดีเทากันกับอาณานิคมของเราไมได"
 FRA_begin_rearmament: "เริ่มการฟนฟูกําลังรบ"
 FRA_begin_rearmament_desc: "การพักรบ 20 ปที่จอมพลฟอชทํานายไวในป 1919 กําลังจะสิ้นสุดลงอยางรวดเร็ว และโลกดูมีแนวโนมมากขึ้นทุกทีที่จะปะทุเปนสงครามในอีกไมกี่ปขางหนา เราตองเตรียมพรอม"
 FRA_firepower_kills: "อํานาจการยิงคือผูสังหาร"
 FRA_firepower_kills_desc: "บทเรียนจากมหาสงครามนั้นเรียบงายพอ ๆ กับที่โหดราย ยุคที่ทหารสูกันโดยเล็งศูนยเปดไดจบสิ้นลงแลว ทุกวันนี้การสังหารเกิดขึ้นในระดับมหาศาลดวยอาวุธที่ทันสมัยที่สุดจากระยะไกล"
 FRA_methodical_battle: "การรบแบบมีระเบียบแบบแผน"
 FRA_methodical_battle_desc: "บางคนอางวาการรบคือความโกลาหล แตพวกเขาโงเขลา การรบไมใชอะไรอื่นนอกจากการใชเครื่องมือที่เหมาะสมอยางเปนระบบตามแผนการโดยรวม หากวางแผนดี เจตนาของศัตรูก็อาจกลายเปนแคเชิงอรรถในประวัติศาสตร"
 FRA_division_cuirassee: "กองพลยานเกราะหนัก"
 FRA_division_cuirassee_desc: "นายทหารผูมีความคิดริเริ่มนามวา เดอ โกล ไดเสนอกองพลรูปแบบใหม ซึ่งผสานยานเกราะหนักเขากับทหารราบและรถถังขนาดกลางเพื่อรบเปนหนวยเดียวกัน"
 FRA_infantry_tanks: "รถถังสนับสนุนทหารราบ"
 FRA_infantry_tanks_desc: "ไมวาอยางไรก็ตาม หนาที่แรกและหนาที่สุดทายของรถถังคือการชวยใหทหารราบยึดและรักษาพื้นที่ได ดังนั้นเราตองจัดรถถังที่ทันสมัยและมีขีดความสามารถใหหนวยทหารราบของเราเสมอ"
 FRA_special_forces: "หนวยรบพิเศษ"
 FRA_special_forces_desc: "ในอนาคต สงครามจะเกิดขึ้นในพื้นที่ที่ทหารราบทั่วไปไปถึงขีดจํากัดมากขึ้นเรื่อย ๆ เราตองสรางหนวยรูปแบบใหมที่มีขีดความสามารถสูงขึ้นซึ่งปฏิบัติการในสภาพเชนนี้ได"
 FRA_fusiliers_marine: "ฟูซิลีเยรมาแร็ง"
 FRA_fusiliers_marine_desc: "ยุคที่ชายฝงเปนแนวปองกันที่ไมอาจทะลวงไดจบลงแลว ในอนาคต เราตองสามารถนําการรบไปหาศัตรูไดไมวาพวกเขาจะอยูที่ใด และยึดหัวหาดไดแมจะเผชิญการตอตานใดก็ตาม"
 FRA_battle_of_maneuver: "การรบแบบดําเนินกลยุทธ"
 FRA_battle_of_maneuver_desc: "แนวคิดเกาที่มองสนามรบเปนพื้นที่เล็ก ๆ ที่กองทัพปะทะกันนั้นตายไปแลว ดวยการใชยานยนตอยางแพรหลาย เครื่องบิน และการสื่อสารทางวิทยุที่รวดเร็ว การรบเคลื่อนไหวอยางรวดเร็วไปไกลหลายรอยกิโลเมตร ยิ่งเราเตรียมพรอมเร็วเทาใดก็ยิ่งดี"
 FRA_air_dominance_desc: "การพัฒนาเครื่องบินไดสรางปกที่สามที่กองทัพตองกังวล เราตองรักษาปกนี้ไวใหมั่นคง มิฉะนั้นจะตองเผชิญหายนะ"
 FRA_air_ground_cooperation: "ความรวมมือทางอากาศ-ภาคพื้นดิน"
 FRA_air_ground_cooperation_desc: "การรบทางอากาศจะใหผลทางทหารที่แทจริงก็ตอเมื่อเปนไปเพื่อบรรลุวัตถุประสงคบนภาคพื้นดินเทานั้น ยิ่งเราผสานการรบทางอากาศเขากับการรบภาคพื้นดินไดดีเทาใด เราก็ยิ่งมีประสิทธิภาพมากขึ้นเทานั้น"
 FRA_flying_artillery_desc: "ในการรบที่เคลื่อนไหวอยางรวดเร็วในปจจุบัน ปนใหญที่เชื่องชาบนภาคพื้นดินอาจตามไมทัน เครื่องบินที่บรรทุกระเบิดสามารถรับบทบาทนั้นแทนได"
 FRA_form_the_popular_front: "จัดตั้งแนวรวมประชาชน"
 FRA_form_the_popular_front_desc: "ดวยการผงาดขึ้นของฟาสซิสตในเยอรมนีและอิตาลี เปนที่ชัดเจนแลววาการตอสูกันเองในฝายซายตองยุติลง หากอุดมการณของเราจะอยูรอด แนวรวมประชาชนอันกวางขวางที่ประกอบดวยพรรคฝายซายทุกพรรคจะไดรับอาณัติจากประชาชนใหแกไขสภาพเศรษฐกิจที่กอใหเกิดฟาสซิสตไดในที่สุด"
 FRA_ban_communism_desc: "แมจะเปนเรื่องที่คิดไมถึงวาจะมีใครตองการนําความโกลาหลและการนองเลือดของการปฏิวัติคอมมิวนิสตมาสูมาตุภูมิของตนเองอยางจริงจัง แตดูเหมือนวาในหมูพวกเรามีบางคนที่พรอมจะทําเชนนั้น เราไมอาจปลอยใหพวกเขาสมคบคิดตอตานรัฐไดอีกตอไป ตองใชมาตรการที่เด็ดขาดที่สุด"
 FRA_invite_communist_ministers: "เชิญรัฐมนตรีคอมมิวนิสต"
 FRA_invite_communist_ministers_desc: "ความหวาดกลัวการตอบโตจากฝายขวาจัดทําใหคอมมิวนิสตไมไดเขารวมในรัฐบาลจริง แตความกลัวเปนที่ปรึกษาที่เลว หากเราตองปะทะกัน ก็ใหมันมา"
 FRA_strengthen_the_unions: "เสริมความแข็งแกรงสหภาพแรงงาน"
 FRA_strengthen_the_unions_desc: "สิทธิของคนงานแตละคนที่จะรวมตัวกับสหายเพื่อเจรจาตอรองรวมกันถูกปลอยใหถูกโจมตีมานานเกินไปแลว จะไมเปนเชนนั้นอีกตอไป"
 FRA_celebrate_the_commune: "เฉลิมฉลองคอมมูน"
 FRA_celebrate_the_commune_desc: "แมจะดํารงอยูไดไมนาน แตคอมมูนปารีสคือความพยายามครั้งแรกในการสรางสังคมคอมมิวนิสตบนแผนดินฝรั่งเศส"
 FRA_womens_suffrage_desc: "เปนเรื่องทั้งไรสาระและนาละอายที่สตรีผูขยันขันแข็งแหงฝรั่งเศส ซึ่งไดตอสูบนเครื่องกีดขวางครั้งแลวครั้งเลาเพื่อใหไดมาซึ่งสิทธิของตน ไมไดรับอนุญาตใหลงคะแนนเสียงในการเลือกตั้ง เราจะขจัดความอยุติธรรมนี้"
 FRA_legal_equality: "ความเทาเทียมทางกฎหมาย"
 FRA_legal_equality_desc: "ในทุกแงมุมที่สําคัญ สตรียังคงถูกมองวาเปนพลเมืองชั้นสองที่ตองอยูใตเจตจํานงของบุรุษเสมอ เรื่องไรสาระนี้ตองจบลงเดี๋ยวนี้"
 FRA_industrial_collectivization: "การรวมอุตสาหกรรมเปนของสวนรวม"
 FRA_industrial_collectivization_desc: "เศรษฐกิจฝรั่งเศสในปจจุบันประกอบดวยบริษัทขนาดจิ๋วที่มีลูกจางไมกี่คน แขงขันกันเองไมรูจบและสิ้นเปลืองทรัพยากรไปกับการผลิตขนาดเล็กที่ไรประสิทธิภาพ เราจะรวมบริษัทเล็ก ๆ เหลานี้เขาดวยกันเพื่อสรางบริษัทที่สามารถแขงขันบนเวทีโลกไดในที่สุด"
 FRA_agricultural_collectivization_desc: "สิ่งที่ใชกับอุตสาหกรรมก็ใชไดกับเกษตรกรทั่วฝรั่งเศสเชนกัน ฟารมขนาดจิ๋วไมมีกําลังซื้อเครื่องมือสมัยใหม และสวนใหญยังทํางานแบบเดียวกับรุนทวด การรวมฟารมเหลานี้เปนหนวยการผลิตทางการเกษตรจะชวยเพิ่มประสิทธิภาพและผลผลิต"
 FRA_force_the_issue: "บีบใหตัดสินใจ"
 FRA_force_the_issue_desc: "เรากาวมาไกลแลวนับตั้งแตจัดตั้งแนวรวมประชาชน แตเราไมอาจทิ้งงานไวครึ่งทาง ถึงเวลาที่ทุกคนในฝายซายตองเลือกและแสดงจุดยืน - จะอยูฝายการปฏิวัติหรือตอตานมัน"
 FRA_force_the_issue_tt: "บทลงโทษดานเสถียรภาพขึ้นอยูกับความนิยมของพรรคฝาย§Yประชาธิปไตย§!\n"
 FRA_reconciliation: "การปรองดอง"
 FRA_reconciliation_desc: "ในอดีต การปฏิวัติของฝรั่งเศสบอยครั้งเกินไปที่โยนประเทศเขาสูวังวนไมสิ้นสุดของความหวาดกลัวจากฝายปฏิวัติและฝายตอตานการปฏิวัติ บางทีถึงเวลาที่จะสรางสาธารณรัฐที่ทุกคนมีที่ยืน ไมวาจะสนับสนุนการปฏิวัติหรือไมก็ตาม"
 FRA_constitutional_convention: "สภารางรัฐธรรมนูญ"
 FRA_constitutional_convention_desc: "การเปลี่ยนแปลงพื้นฐานในธรรมชาติของสาธารณรัฐเราไมอาจทําไดในชั่วขามคืน และไมอาจทําไดโดยไมเจรจารางรัฐธรรมนูญฉบับใหม"
 FRA_anti_fascist_coalition: "แนวรวมตอตานฟาสซิสต"
 FRA_anti_fascist_coalition_desc: "ภัยคุกคามที่ใหญที่สุดตอการเดินหนาสูความกาวหนาคือการแพรขยายของฟาสซิสตหัวปฏิกิริยา เราตองยืนเคียงขางทุกประเทศที่เต็มใจตอสูกับภัยคุกคามนี้ มิฉะนั้นจะไมมีวันพรุงนี้สําหรับพวกเราคนใดเลย"
 FRA_invite_anti_fascist_emigrants: "เชิญผูอพยพตอตานฟาสซิสต"
 FRA_invite_anti_fascist_emigrants_desc: "กาวแรกที่ทุกระบอบฟาสซิสตทําคือการเนรเทศผูวิจารณและผูที่อาจนําเสนอวิสัยทัศนทางเลือกในการบริหารประเทศ อยางไรก็ตาม คนเหลานี้ก็เหมาะอยางยิ่งที่จะจัดตั้งรัฐบาลพลัดถิ่นเพื่อเตรียมพรอมสําหรับวันที่ประเทศของพวกเขาไดรับการปลดปลอย"
 FRA_reconnect_to_the_balkans: "ฟนสัมพันธกับคาบสมุทรบอลขาน"
 FRA_reconnect_to_the_balkans_desc: "ฝรั่งเศสพยายามถวงดุลอํานาจของยุโรปกลางมาชานานดวยการผูกสัมพันธกับประเทศในคาบสมุทรบอลขาน ความสัมพันธนี้ยังคงอยู แมจะถูกปลอยใหเลือนรางไปในระยะหลัง"
 FRA_pre_empt_the_fascist_attack: "ชิงโจมตีฟาสซิสตกอน"
 FRA_pre_empt_the_fascist_attack_desc: "ทําไมเราตองปลอยใหศัตรูเตรียมตัวอยางสงบและเลือกชวงเวลาที่เหมาะกับพวกมันที่สุดสําหรับการโจมตีที่หลีกเลี่ยงไมได? เราจะโจมตีกอน และบดขยี้ภัยคุกคามนี้กอนที่มันจะมีเวลาเตรียมพรอม"
 FRA_loyalty_to_moscow: "ภักดีตอมอสโก"
 FRA_loyalty_to_moscow_desc: "รูปแบบสังคมนิยมที่ปฏิบัติในสหภาพโซเวียตอาจไมสมบูรณแบบ แตไมตองสงสัยเลยวาสหภาพโซเวียตไดนําแนวคิดสังคมนิยมไปปฏิบัติไดในระดับสูงสุด เราคงโงเขลาหากพยายามหาหนทางของเราเอง"
 FRA_league_of_french_bolshevist_volunteers_desc: "เมื่อประเทศสังคมนิยมหนึ่งถูกคุกคามโดยผูรุกรานตางชาติ ประเทศสังคมนิยมทุกประเทศก็ถูกคุกคามเชนกัน เราตองไมนิ่งดูดายขณะที่สหายของเราตอสูเพื่อเอาชีวิตรอด"
 FRA_host_the_german_exiles: "ใหที่พักพิงแกผูลี้ภัยชาวเยอรมัน"
 FRA_host_the_german_exiles_desc: "เยอรมนี บานเกิดของมารกซและเองเงิลส เคยเปนแนวหนาของแนวคิดและการปฏิบัติแบบคอมมิวนิสต คอมมิวนิสตชาวเยอรมันจํานวนมากหลบหนีออกมาเมื่อนาซีขึ้นสูอํานาจ หากเราใหที่พักพิงแกพวกเขา พวกเขาจะชวยเราจัดตั้งรัฐบาลในดินแดนที่ไดรับการปลดปลอยไดอยางมีประสิทธิภาพยิ่งขึ้น"
 FRA_revolution_to_the_utmost: "ปฏิวัติจนถึงที่สุด"
 FRA_revolution_to_the_utmost_desc: "การปฏิวัติที่คางไวครึ่งทางไมใชการปฏิวัติเลย เราตองไมหยุดจนกวาภารกิจจะสําเร็จและระบบการเมืองใหมจะปลอดภัย ไมวาจะตองแลกดวยอะไรก็ตาม"
 FRA_destroy_the_counter_revolution: "ทําลายฝายตอตานการปฏิวัติ"
 FRA_destroy_the_counter_revolution_desc: "แมแตตอนนี้ ก็ยังมีคนบางกลุมในฝรั่งเศสที่เตรียมแทงขางหลังประชาชนของตนเองทันทีที่พวกเขาแสดงความออนแอแมเพียงชั่ววินาที เราจะไมปลอยใหพวกเขาทํา และจะโจมตีกอน"
 FRA_revolutionary_zeal_desc: "ชาวฝรั่งเศสมีความกระตือรือรนเปนพิเศษเสมอมาในการกวาดลางระเบียบเกาและสถาปนาระเบียบใหม ไมควรไปบั่นทอนสิ่งนี้"
 FRA_loyalty_to_the_cause: "ภักดีตออุดมการณ"
 FRA_loyalty_to_the_cause_desc: "ประเทศอื่นอาจสรางวิสัยทัศนคอมมิวนิสตของตนเอง แตไมมีเหตุผลที่เราตองประนีประนอมกับวิสัยทัศนของเรา พวกเขาอาจหยุดอยูครึ่งทาง ถูกรุมเราดวยความสงสัยวาเปาหมายจะชอบธรรมพอใหใชวิธีการเชนนั้นหรือไม แตเราจะไมหยุด"
 FRA_carry_the_revolution_north: "นําการปฏิวัติขึ้นเหนือ"
 FRA_carry_the_revolution_north_desc: "อีกฟากของชองแคบอังกฤษคือแหลงกําเนิดของการปฏิวัติอุตสาหกรรม และพรอมกันนั้นคือบานของทุนนิยมสมัยใหม เราไมอาจปลอยใหที่นั่นกลายเปนฐานกระโดดของศัตรูฝายตอตานการปฏิวัติ"
 FRA_carry_the_revolution_west: "นําการปฏิวัติไปตะวันตก"
 FRA_carry_the_revolution_west_desc: "ระบอบการปกครองบนคาบสมุทรไอบีเรียกําลังหอยอยูบนเสนดาย พรอมจะถูกกวาดลางไปโดยการปฏิวัติของประชาชน เราจะตัดเสนดายนั้นเสีย"
 FRA_carry_the_revolution_east: "นําการปฏิวัติไปตะวันออก"
 FRA_carry_the_revolution_east_desc: "ที่พรมแดนดานตะวันออกของเราคือภัยคุกคามที่ใหญที่สุดตอระเบียบใหมของเรา กองกําลังหัวปฏิกิริยาที่รวมตัวอยูที่นั่นจะโจมตีเมื่อเราเปราะบางที่สุด - แตก็ตอเมื่อเราใหเวลาพวกมันเตรียมตัวเทานั้น"
 FRA_carry_the_revolution_south: "นําการปฏิวัติลงใต"
 FRA_carry_the_revolution_south_desc: "ประเทศแรกที่ตกเปนของฟาสซิสตคืออิตาลี ดวยเหตุนี้ อุดมการณดังกลาวจึงฝงรากลึกอยูในอิตาลี โลกทัศนของเราไมอาจอยูรวมกันไดอยางสันติ พวกเขารูดีพอ ๆ กับเรา และยอมเตรียมลงมืออยางแนนอน เราก็ตองเตรียมเชนกัน"
 FRA_egalite_liberte_solidarite_desc: "การปฏิวัติฝรั่งเศสครั้งแรกไดกวาดลางระบอบการปกครองที่ดํารงอยูมานับพันป และเปลี่ยนโฉมหนาของยุโรปไปตลอดกาล เราจะสานตอสิ่งที่พวกเขาเริ่มไวใหสําเร็จ"
 FRA_reform_the_labour_laws: "ปฏิรูปกฎหมายแรงงาน"
 FRA_reform_the_labour_laws_desc: "คนงานฝรั่งเศสทํางานภายใตสภาพที่ยากลําบาก คาจางตํ่าและสวัสดิการนอย ถึงเวลาแลวที่จะดําเนินการปฏิรูปอยางรอบดานเพื่อยกระดับชีวิตของพวกเขา"
 FRA_nationalize_key_industry: "โอนอุตสาหกรรมสําคัญเปนของรัฐ"
 FRA_nationalize_key_industry_desc: "ในสถานการณปจจุบัน เราตองไมลังเลที่จะปรับโครงสรางเศรษฐกิจอยางถอนรากถอนโคนเพื่อรับมือภัยคุกคามที่กําลังมาถึง เวลาเหลือนอย - เราไมอาจรอใหตลาดเสรีแกปญหาเอง"
 FRA_reorganize_the_aviation_industry: "ปรับโครงสรางอุตสาหกรรมการบิน"
 FRA_reorganize_the_aviation_industry_desc: "อุตสาหกรรมการบินของเราแตกออกเปนบริษัทเล็ก ๆ นับสิบแหง และลาหลังอุตสาหกรรมในเยอรมนีและสหรัฐอเมริกาหลายทศวรรษ จําเปนตองปรับโครงสรางอยางถึงราก"
 FRA_form_the_state_arsenals: "จัดตั้งคลังอาวุธของรัฐ"
 FRA_form_the_state_arsenals_desc: "เพื่อจัดหาอาวุธสมัยใหมใหกองทัพ เราไมอาจรอจนกวาบริษัทเอกชนจะพัฒนากําลังการผลิตที่จําเปนได"
 FRA_general_work_council: "สภาแรงงานทั่วไป"
 FRA_general_work_council_desc: "เราจะจัดตั้งหนวยงานระดับชาติเพื่อจัดการขอพิพาทระหวางนายจางและลูกจาง และเพื่อใหมั่นใจวาคนงานของเราไดรับการจางงานอยางมีประสิทธิภาพสูงสุด"
 FRA_national_champions: "แชมเปยนแหงชาติ"
 FRA_national_champions_desc: "ดวยการคัดเลือกบริษัทไมกี่แหงที่มีศักยภาพจะแขงขันในระดับโลกและสนับสนุนพวกเขาอยางเต็มที่ เราจะสรางเศรษฐกิจสมัยใหมที่ทัดเทียมกับประเทศใด ๆ ได"
 FRA_dirigisme_desc: "แมเศรษฐกิจแบบวางแผนจากสวนกลางเต็มรูปแบบตามแบบโซเวียตจะเปนมาตรการที่สุดโตงเกินไปอยางชัดเจน แตการวางแผนและการกํากับทิศทางในระดับหนึ่งก็จําเปนตอการทําใหเศรษฐกิจของเรามีประสิทธิภาพสูงสุด"
 FRA_ban_the_leagues: "สั่งหามสันนิบาตขวาจัด"
 FRA_ban_the_leagues_desc: "สันนิบาตฝายขวาจัดถูกปลอยใหรวมตัวกันไดโดยไมมีการควบคุม แมตอนนี้พวกเขาจะออนแอเกินกวาจะพยายามกอรัฐประหาร แตไมมีใครบอกไดวาในอนาคตพวกเขาจะทําอะไรไดบาง ทางที่ดีที่สุดคือยุบพวกเขาเสียตั้งแตตอนนี้"
 FRA_the_blum_viollette_proposal: "ขอเสนอบลูม-วียอแล็ต"
 FRA_the_blum_viollette_proposal_desc: "สัญชาติของสาธารณรัฐฝรั่งเศสควรเปดกวางใหแกทุกคนที่มีคุณสมบัติ ประชาชนผูภักดีจํานวนมากของเราในแอลจีเรียตองการเปนพลเมืองโดยสมบูรณ แตยังไมไดรับอนุญาต การใหพวกเขาเปนพลเมืองโดยสมบูรณจะผูกแอลจีเรียไวกับฝรั่งเศสแนนแฟนยิ่งขึ้น"
 FRA_expand_the_citizenship: "ขยายสิทธิความเปนพลเมือง"
 FRA_expand_the_citizenship_desc: "เปนเรื่องที่สาธารณรัฐไมอาจยอมรับไดที่ผูคนบางสวนซึ่งอาศัยอยูในดินแดนของตนไมไดรับอนุญาตใหเปนพลเมือง แตสภาพการณเชนนี้กลับถูกปลอยใหคงอยูในประเทศของเราเอง เราตองแกไขเรื่องนี้โดยทันที"
 FRA_france_undividable_desc: "ฝรั่งเศสตองหลอมรวมเปนหนวยเดียวภายใตธงผืนเดียว ถึงเวลาที่เราจะยอมรับเรื่องนี้อยางเปดเผย แมเพียงเพื่อคลายความหวาดกลัวเรื่องการแบงแยกก็ตาม"
 FRA_french_union: "สหภาพฝรั่งเศส"
 FRA_french_union_desc: "ถึงเวลาประกาศฝรั่งเศสใหม ฝรั่งเศสที่แผไพศาลไปทั่วโลก ซึ่งทุกสวนของอาณาจักรเรารวมเปนหนึ่งเดียว เราจะจัดการลงประชามติในทุกสวนเพื่อยืนยันเจตจํานงของประชาชนที่จะเปนสวนหนึ่งของฝรั่งเศสใหมที่ยิ่งใหญกวาเดิมนี้"
 FRA_french_union_tt: "จะมีการลงประชามติในสวนตาง ๆ ของจักรวรรดิอาณานิคม บางสวนอาจเลือกที่จะเปนเอกราชโดยสมบูรณแทน"
 FRA_encourage_immigration: "สงเสริมการอพยพเขาเมือง"
 FRA_encourage_immigration_desc: "มาตุภูมิของเราตองการแรงงานอยางยิ่งเพื่อชดเชยความสูญเสียจากมหาสงคราม การทําใหการตั้งถิ่นฐานในฝรั่งเศสงายขึ้นจะชวยดึงดูดผูอพยพที่มีทักษะซึ่งสามารถชดเชยการขาดแคลนนี้ได"
 FRA_review_foreign_policy: "ทบทวนนโยบายตางประเทศ"
 FRA_review_foreign_policy_desc: "ระเบียบภาคพื้นทวีปที่สถาปนาขึ้นในป 1919 ดูเหมือนจะถูกคุกคามมากขึ้นเรื่อย ๆ ถึงเวลาที่เราจะทบทวนทางเลือกดานนโยบายตางประเทศเพื่อสรางพันธมิตรใหมใหฝาพายุที่กําลังจะมาถึง"
 FRA_intervention_in_spain: "แทรกแซงในสเปน"
 FRA_intervention_in_spain_desc: "สงครามกลางเมืองในสเปนไดนําความขัดแยงทางอุดมการณมาถึงหนาประตูบานเรา เราตองเดินอยางระมัดระวัง มิฉะนั้นความขัดแยงอาจลุกลามเขามาในประเทศของเรา"
 FRA_support_the_finns: "สนับสนุนชาวฟนน"
 FRA_support_the_finns_desc: "ชาวฟนแลนดกําลังตอสูเพื่อเอาชีวิตรอด เราตองชวยเหลือพวกเขา"
 FRA_confirm_eastern_commitments: "ยืนยันพันธกรณีทางตะวันออก"
 FRA_confirm_eastern_commitments_desc: "หลังมหาสงคราม เราไดสรางเครือขายพันธมิตรในยุโรปตะวันออกเพื่อถวงดุลเยอรมนีที่กําลังฟนคืนและสหภาพโซเวียตที่มุงขยายดินแดน พันธมิตรของเราในภูมิภาคนี้กําลังสงสัยวาเราจะไปชวยพวกเขาจริงหรือไมหากถูกรองขอ เราควรสรางความมั่นใจใหพวกเขากอนที่พวกเขาจะตัดสินใจหันไปขอความชวยเหลือจากที่อื่น"
 FRA_strengthen_the_little_entente: "เสริมความแข็งแกรงความตกลงไตรภาคีนอย"
 FRA_strengthen_the_little_entente_desc: "ความตกลงไตรภาคีนอยผูกมัดใหเราตองชวยเหลือพันธมิตรในยุโรปตะวันออกและคาบสมุทรบอลขาน เราปลอยใหพันธมิตรนี้เสื่อมคลายไป แตบัดนี้มันจําเปนยิ่งกวาที่เคย ถึงเวลาฟนฟูมันขึ้นมาใหม"
 FRA_invest_in_our_weaker_allies: "ลงทุนในพันธมิตรที่ออนแอกวา"
 FRA_invest_in_our_weaker_allies_desc: "หากเราตองการพันธมิตรที่มีขีดความสามารถในยามสงคราม เราตองชวยใหพวกเขาตอบสนองความตองการทางทหารของตนเองได โครงการลงทุนในระดับปานกลางในอุตสาหกรรมของพวกเขาจะชวยใหผลิตยุทธภัณฑที่ตองการไดภายในประเทศ"
 FRA_invest_in_our_weaker_allies_trigger_tt: "มีโรงงานทหารนอยกวาเรา"
 FRA_coordinate_rearmament: "ประสานการฟนฟูกําลังรบ"
 FRA_coordinate_rearmament_desc: "เพื่อใหทัดเทียมกับกระบวนการพัฒนาที่เปนเอกภาพของชาวเยอรมันและฝายตรงขามอื่น ๆ เราตองประสานความพยายามกับพันธมิตรดวยเชนกัน"
 FRA_foreign_guest_workers: "แรงงานรับเชิญจากตางชาติ"
 FRA_foreign_guest_workers_desc: "การขาดแคลนแรงงานเปนคอขวดสําคัญในการขยายอุตสาหกรรมและเพิ่มขนาดกองทัพของเรา การเชิญแรงงานที่มีทักษะจากพันธมิตรมาทํางานในโรงงานของเราจะชวยปลดกําลังพลใหสงเขากองทัพได"
 FRA_join_the_ententes: "รวมความตกลงไตรภาคี"
 FRA_join_the_ententes_desc: "ฝรั่งเศสไมอาจแบกรับพันธกรณีปองกันรวมกันสองฉบับพรอมกันได หากเราไมสามารถทําใหอังกฤษตกลงที่จะเคารพพันธกรณีของเราดวย เราก็จําเปนตองเลือก การรวมเครือขายพันธมิตรที่แยกกันอยูของเราใหเปนหนึ่งเดียวจะเพิ่มพลังปองปรามของพันธมิตรไดอยางมหาศาล"
 unlocks_espionage_operation_tt: "ปลดล็อก §Yปฏิบัติการจารกรรม§!:\n"
 FRA_revive_the_franco_polish_alliance: "ฟนฟูพันธมิตรฝรั่งเศส-โปแลนด"
 FRA_revive_the_franco_polish_alliance_desc: "ฝรั่งเศสสนับสนุนโปแลนดที่เปนเอกราชมาโดยตลอด ในชวงไมกี่ปที่ผานมา ความสัมพันธระหวางสองประเทศเย็นชาลงเล็กนอย เมื่อภัยคุกคามจากเยอรมนีปรากฏอยูบนขอบฟา ถึงเวลาที่จะจุดประกายสนธิสัญญาของเราขึ้นใหม"
 FRA_revive_the_franco_polish_alliance_tt: "\nโปแลนดจะไดรับเชิญเขารวมฝายของเรา หากเราเปนผูนําฝายของตนเอง"
 FRA_buy_time: "ซื้อเวลา"
 FRA_buy_time_desc: "เรายังไมพรอมจะเผชิญหนากับเยอรมันในสนามรบ พันธมิตรของเราออนแอ กองทัพของเราลาสมัย เราอาจตองยอมเสียสละบางอยางหากตองการอยูรอด"
 FRA_arms_purchases_in_the_us: "ซื้ออาวุธจากสหรัฐอเมริกา"
 FRA_arms_purchases_in_the_us_desc: "อุตสาหกรรมทหารของเราไมสามารถจัดหาอาวุธสมัยใหมที่จําเปนใหกองทัพได อยางไรก็ตาม สหรัฐอเมริกามีกําลังการผลิตเหลือเฟอ หากพวกเขาไมหวนกลับไปสูนโยบายโดดเดี่ยวตนเอง ก็ดูเหมือนวาจะโนมนาวใหขายอาวุธที่เราตองการได"
 FRA_france_leads: "ฝรั่งเศสเปนผูนํา"
 FRA_france_leads_desc: "ชาติที่มีประวัติศาสตรอันนาภาคภูมิใจอยางฝรั่งเศสไมอาจปลอยใหประเทศอื่นกําหนดนโยบายตางประเทศของตน เราจะตัดสินใจเองโดยยึดผลประโยชนของเราเปนที่ตั้ง"
 FRA_concessions_to_italy: "ยอมออนขอใหอิตาลี"
 FRA_concessions_to_italy_desc: "อิตาลียังคงฝนถึงจักรวรรดิในแอฟริกา หากเรายอมออนขอใหบาง - และรับรองการพิชิตเอธิโอเปยของอิตาลี - เราอาจปองกันไมใหเกิดฝายอักษะระหวางโรมกับเบอรลินได"
 FRA_ratify_the_stresa_front: "ใหสัตยาบันแนวรวมสเตรซา"
 FRA_ratify_the_stresa_front_desc: "อิตาลีแสดงทาทีวาจะเขารวมฝายของเราเพื่อแลกกับดินแดนในแอฟริกา ถึงเวลาลงนามและใหสัตยาบันสนธิสัญญาที่จําเปน"
 FRA_franco_soviet_treaty: "สนธิสัญญาฝรั่งเศส-[SOV.GetAdjective]"
 FRA_franco_soviet_treaty_desc: "ชาว[SOV.GetAdjective]กังวลเรื่องการผงาดขึ้นของฟาสซิสตในยุโรปไมตางจากเรา บางทีเราอาจโนมนาวใหพวกเขาสนับสนุนเราเมื่อถึงเวลา"
 FRA_revive_the_national_bloc: "ฟนฟูกลุมชาตินิยม"
 FRA_revive_the_national_bloc_desc: "ภูมิทัศนทางการเมืองกําลังสุดโตงขึ้นทุกวัน ฝายซายกระซิบกระซาบเรื่องการรวมมือกับคอมมิวนิสต สิ่งที่จําเปนในตอนนี้คือการนําที่เขมแข็งและมีเสถียรภาพ"
 FRA_laissez_faire: "ปลอยใหตลาดทํางานเสรี"
 FRA_laissez_faire_desc: "พวกคอมมิวนิสตพูดอยางเปดเผยถึงการปรับโครงสรางเศรษฐกิจของประเทศเราอยางถอนรากถอนโคน และการริบทรัพยสินอันชอบธรรมของผูที่ทํางานหนัก เราจะตอตานสิ่งนี้ดวยแนวคิดเรียบงายเรื่องเสรีภาพ เศรษฐกิจที่มีพลวัตจะเหนือกวาฝนรายของฝายซายที่เต็มไปดวยระเบียบราชการรัดคอเสมอ"
 FRA_protect_the_rights_of_man: "ปกปองสิทธิมนุษยชน"
 FRA_protect_the_rights_of_man_desc: "พวกเขาอาจไมเคยพูดออกมาตรง ๆ แตใครที่มีตายอมเห็นไดชัด การจํากัดสิทธิในทรัพยสินเปนเพียงกาวแรกของการกําจัดสิทธิทั้งปวงที่บรรพบุรุษผูภาคภูมิของเราตอสูมาอยางยากลําบาก เราจะไมยอม!"
 FRA_freedom_front: "แนวรวมเสรีภาพ"
 FRA_freedom_front_desc: "เมื่อเผชิญกับความโกลาหลและความปนปวนที่พวกคอมมิวนิสตสัญญาไว เราตองเต็มใจสรางพันธมิตรกับพรรคอื่น แมกระทั่งพรรคที่เราอาจรังเกียจเปนการสวนตัว"
 FRA_stimulate_the_dynamic_market: "กระตุนตลาดที่มีพลวัต"
 FRA_stimulate_the_dynamic_market_desc: "ตลาดที่มีพลวัตไดรับการพิสูจนแลววาเปนรูปแบบการจัดระเบียบทางเศรษฐกิจที่มีประสิทธิภาพที่สุด แตมันยังขับเคลื่อนโดยมนุษย และบางครั้งมนุษยก็ตองการความมั่นใจวาการทํางานหนักของตนจะไมสูญเปลา ดวยการยกเลิกขอจํากัดบางประการทางกฎหมายและใหหลักประกัน เราจะชวยใหนักลงทุนกาวขามความกลัวและกระตุนเศรษฐกิจของเรา"
 FRA_agricultural_protectionism_desc: "เศรษฐกิจโลกเปนปฏิปกษตอวิถีการผลิตแบบดั้งเดิมของเรามากขึ้นเรื่อย ๆ หากเราไมใชมาตรการปกปองเกษตรกร เราจะตองเผชิญวิกฤตครั้งใหญหลวงในไมชา เมื่อเกษตรกรไมสามารถแขงขันกับอาหารที่ผลิตแบบอุตสาหกรรมซึ่งนําเขามาจากโพนทะเลได"
 FRA_economic_devolution: "กระจายอํานาจทางเศรษฐกิจ"
 FRA_economic_devolution_desc: "เปนเรื่องไรสาระที่จะคิดวาขาราชการบางคนในปารีสรูดีที่สุดวาอะไรดีสําหรับบริษัทในบอรโดซ เราตองไววางใจผูประกอบการและใหอํานาจพวกเขาในการหาทางออกของตนเอง"
 FRA_promote_entrepeneurship: "สงเสริมการเปนผูประกอบการ"
 FRA_promote_entrepeneurship_desc: "หัวใจที่เตนอยูของตลาดที่มีพลวัตคือปจเจกบุคคลที่เมื่อเห็นโอกาสก็รีบควาไวทันที ในชวงไมกี่ปที่ผานมา จิตวิญญาณนี้ถูกกดทับดวยกฎระเบียบที่ไมจําเปน เราควรยกเลิกกฎระเบียบเหลานั้น"
 FRA_utilize_the_leagues: "ใชประโยชนจากสันนิบาตขวาจัด"
 FRA_utilize_the_leagues_desc: "เปนความจริงอันนาเศราที่ความรุนแรงทางการเมืองกลายเปนเรื่องปกติในฝรั่งเศส หากประเทศจะรอดพนจากภัยคุกคามของการปฏิวัติคอมมิวนิสต เราตองไมลังเลที่จะรับความชวยเหลือจากผูที่สามารถและพรอมจะเผชิญหนากับอันธพาลคอมมิวนิสตบนทองถนนหากถึงคราวจําเปน"
 FRA_national_regeneration: "การฟนฟูชาติ"
 FRA_national_regeneration_desc: "ประชาธิปไตยที่มากเกินไปและแนวคิดสาธารณรัฐนิยมที่หลงทางไดเปนพิษตอประเทศและแบงแยกประชาชนของเรา ตองใชเวลานานในการเยียวยาบาดแผลเหลานี้ แตในที่สุดกาวแรกก็ไดเริ่มขึ้นแลว"
 FRA_national_regeneration_trigger_tt: "แรงสนับสนุนรวมของฝายไมฝกใฝฝายใดและฟาสซิสตมากกวา 50%"
 FRA_destroy_decadence: "ทําลายความเสื่อมทราม"
 FRA_destroy_decadence_desc: "ไมมีประเทศใดเคยยิ่งใหญไดหากปลอยใหตนเองถกเถียงแมในประเด็นเล็กที่สุดเปนเวลาหลายเดือน บางประเทศที่ปลอดภัยอยูหลังมหาสมุทรและมีจักรวรรดิระดับโลกหนุนหลังอาจเชื่อวาตนมีความหรูหราเชนนั้นได แตเราทําไมได"
 FRA_integralism: "ลัทธิบูรณภาพนิยม"
 FRA_integralism_desc: "อุดมการณบูรณภาพนิยมระบุวาทุกภาคสวนของสังคมตองรวมกันและทํางานราวกับเปนชิ้นสวนเล็ก ๆ ของสิ่งที่ใหญกวา สังคมนี้ตองมีระเบียบเรียบรอย เพื่อใหทุกสวนทํางานรวมกันอยางกลมกลืน"
 FRA_work: "งาน"
 FRA_work_desc: "ชางฝมือคือองคประกอบที่สําคัญที่สุดของเศรษฐกิจ เมื่อไดรับการชี้นําจากผูที่เหมาะสม ไมมีหนาที่ใดสูงสงไปกวาการทุมเทแรงกายรับใชประเทศชาติ"
 FRA_family: "ครอบครัว"
 FRA_family_desc: "หนวยที่เล็กที่สุดของสังคมไมใชปจเจกบุคคล - แตคือครอบครัว การโตแยงขอเท็จจริงอันเรียบงายและชัดแจงนี้คือขอบกพรองที่ใหญที่สุดของสาธารณรัฐเกา"
 FRA_fatherland: "ปตุภูมิ"
 FRA_fatherland_desc: "หนาที่ของชาย หญิง และเด็กชาว[FRA.GetAdjective]ทุกคนคือการปกปองและชวยเหลือเพื่อนบาน หนทางเดียวที่จะบรรลุสิ่งนี้ไดคือผานความมีระเบียบและความภักดีตอชาติอยางไมมีเงื่อนไข ไมอาจมีขอกังขาในเรื่องนี้ มิฉะนั้นเราจะประสบชะตากรรมเดียวกับสาธารณรัฐเกา เราจะทําทุกอยางที่จําเปนเพื่อรักษาความสงบเรียบรอยและความมั่นคงของชาติ ในทายที่สุด ประชาชนจะเขาใจวานี่คือประโยชนสูงสุดของพวกเขา"
 FRA_political_unity: "เอกภาพทางการเมือง"
 FRA_political_unity_desc: "ประวัติศาสตรฝรั่งเศสนับตั้งแตการลมสลายของระบอบสมบูรณาญาสิทธิราชยคือเรื่องราวของการตอสูทางการเมืองภายใน เมื่อมีเอกภาพ - ฝรั่งเศสไดรับชัยชนะ เมื่อมีความขัดแยงภายใน - ฝรั่งเศสพายแพ ดวยเหตุนี้ เราไมอาจปลอยใหความทะเยอทะยานของคนสวนนอยทํารายความเปนอยูของคนสวนมาก"
 FRA_diplomatic_freedom: "เสรีภาพทางการทูต"
 FRA_diplomatic_freedom_desc: "รัฐบาลสาธารณรัฐไดพันธนาการตนเองไวกับรัฐประดิษฐในยุโรปตะวันออกที่จะลมสลายทันทีที่เราถอนความชวยเหลือ พวกเขาเปนภาระ ไมใชทรัพยสิน ดังนั้นเราจะสลัดพวกเขาทิ้ง"
 FRA_latin_entente: "ความตกลงละติน"
 FRA_latin_entente_desc: "ภราดรภาพระหวางรัฐผูสืบทอดจักรวรรดิโรมันเปนสิ่งที่ปฏิเสธไมได ชนชาติเจอรแมนิกแหงยุโรปปกครองภาคพื้นทวีปมานานเกินไปแลว ถึงเวลาที่เราจะทวงคืนสิทธิโดยกําเนิดของชาติเรา"
 FRA_reach_out_to_spain: "ผูกสัมพันธกับสเปน"
 FRA_reach_out_to_spain_desc: "สเปนซึ่งเพิ่งฟนตัวจากสงครามกลางเมือง คือพันธมิตรโดยธรรมชาติของเราในการพยายามปรับโฉมภาคพื้นทวีปใหม"
 FRA_invite_portugal: "เชิญโปรตุเกส"
 FRA_invite_portugal_desc: "แมจักรวรรดิอาณานิคมของโปรตุเกสจะหดเล็กลงไปมาก แตเปลวไฟแหงการสํารวจและการพิชิตยังคงลุกโชนอยูในหัวใจของชาวโปรตุเกสทุกคน"
 FRA_compensate_italy: "ชดเชยใหอิตาลี"
 FRA_compensate_italy_desc: "ในอดีต ความขัดแยงเรื่องผืนทะเลทรายเล็ก ๆ เคยดึงสองชาติของเราเขาสูความขัดแยง เรื่องไรสาระเชนนี้หยุดไดงาย ๆ และหาขอยุติที่ทั้งสองฝายพอใจไดอยางรวดเร็ว"
 FRA_intervention_in_greece: "แทรกแซงในกรีซ"
 FRA_intervention_in_greece_desc: "กรีซควบคุมดินแดนที่มีคาที่สุดแหงหนึ่งในทะเลเมดิเตอรเรเนียน เราไมอาจปลอยใหรัฐบาลที่เปนปฏิปกษควบคุมดินแดนนั้น ดังนั้นเราตองลงมือกอน"
 FRA_the_congress_of_paris: "การประชุมแหงปารีส"
 FRA_the_congress_of_paris_desc: "ในการประชุมแหงเบอรลิน พรมแดนของแอฟริกาไดถูกกําหนดขึ้น แตแผนที่ในปจจุบันดูราวกับผาปะชุน ถึงเวลาวาดแผนที่ใหม และวางรากฐานสําหรับจักรวรรดิอาณานิคมใหม"
 FRA_the_natural_borders_of_france: "พรมแดนธรรมชาติของฝรั่งเศส"
 FRA_the_natural_borders_of_france_desc: "เปนเรื่องธรรมดาที่ประเทศหนึ่งจะคํานึงถึงผลประโยชนของตนกอน เราไมอาจอยูรวมกับชาวเยอรมันอยางสันติในการตอสูของเรา ดังนั้นเราตองยึดพรมแดนธรรมชาติไวเพื่อปกปองดินแดนใจกลางของเรา"
 FRA_towards_a_new_europe: "สูยุโรปใหม"
 FRA_towards_a_new_europe_desc: "ฝรั่งเศสอยูบนทางแยก เราจะพันธนาการตนเองไวกับระเบียบเกา หรือจะยอมรับระเบียบใหม เมื่อชาวเยอรมันพรอมจะสรางภาคพื้นทวีปขึ้นใหม การอยูขางเดียวกับพวกเขายอมเปนประโยชนตอเรา"
 FRA_establish_spheres_of_influence: "กําหนดเขตอิทธิพล"
 FRA_establish_spheres_of_influence_desc: "หลายศตวรรษที่ผานมา ประชาชนของเราเชื่อวาเราเปนศัตรูคูอาฆาตโดยกําเนิด ความเชื่อนี้ตั้งอยูบนแนวคิดวาผลประโยชนของเราไปดวยกันไมได แตเรายอมตกลงกันไดแนหากเพียงกําหนดเขตอิทธิพลของแตละฝายและงดเวนการแทรกแซงอยางระมัดระวัง"
 FRA_split_belgium: "แบงแยกเบลเยียม"
 FRA_split_belgium_desc: "เมื่อเบลเยียมอยูในเขตอิทธิพลของเราแลว ถึงเวลานําดินแดนที่พูดภาษาฝรั่งเศสกลับคืนสูมาตุภูมิ สวนที่เหลือจะถูกจัดตั้งเปนรัฐใหม"
 FRA_align_belgium: "ดึงเบลเยียมเขาขาง"
 FRA_align_belgium_desc: "ชาวเบลเยียมเปนหนี้การดํารงอยูของตนตอเรา และเราไมอาจปลอยใหพวกเขาลืมขอเท็จจริงนั้น หากเราปลอยใหพวกเขาเปนเอกราชตอไป อยางนอยที่สุดเราจะทําใหแนใจวาไดรัฐบาลที่เปนมิตรขึ้นปกครอง"
 FRA_grow_the_empire: "ขยายจักรวรรดิ"
 FRA_grow_the_empire_desc: "เปนเรื่องไรสาระที่ประเทศขนาดเทาเบลเยียมจะไดรับอนุญาตใหครอบครองอาณานิคมที่ใหญกวาตนหลายเทา เราเหมาะสมกวามากที่จะบริหารดินแดนเชนนั้น"
 FRA_bring_home_quebec: "นําควิเบกกลับบาน"
 FRA_bring_home_quebec_desc: "แควนที่สูญเสียไปนานแลวจะกลับมาเปนของเราอีกครั้งในเวลาอันควร ผูคนที่พูดภาษาฝรั่งเศสทั่วโลกจะไดกลับมารวมกับปตุภูมิในที่สุด"
 FRA_expand_to_the_suez: "ขยายไปถึงคลองสุเอซ"
 FRA_expand_to_the_suez_desc: "การแบงอํานาจควบคุมลิแวนตระหวางเรากับอังกฤษเปนการประนีประนอมที่ใชการไมได ซึ่งโชคดีที่บัดนี้เราไมตองยึดถืออีกตอไป"
 FRA_dominate_the_middle_east: "ครอบงําตะวันออกกลาง"
 FRA_dominate_the_middle_east_desc: "ประเทศในตะวันออกกลางเปนรัฐประดิษฐที่ถูกแกะสลักออกมาจากซากศพของจักรวรรดิออตโตมัน พวกเขามีอธิปไตยไมมากไปกวาหมูบานฝรั่งเศสทั่วไป และถึงเวลาเตือนใหพวกเขาระลึกถึงขอเท็จจริงนั้น"
 FRA_the_council_of_rambouillet: "สภาร็องบุยเย"
 FRA_the_council_of_rambouillet_desc: "เมื่อประเทศตกอยูในความวุนวาย ประชาชนตางมองหาผูนําที่เขมแข็ง เปนที่ชัดเจนแลววาระบอบสาธารณรัฐลมเหลวตอชาวฝรั่งเศส และถึงเวลาที่ผูปกครองโดยธรรมชาติของฝรั่งเศสจะกลับมา แตกอนอื่น ตองวางรากฐานสําหรับการฟนฟูระบอบกษัตริย"
 FRA_revise_the_constitution: "แกไขรัฐธรรมนูญ"
 FRA_revise_the_constitution_desc: "รัฐธรรมนูญแบบสาธารณรัฐถูกออกแบบมาเปนมาตรการชั่วคราวเสมอ แตกลับถูกปลอยใหใชอยูนานเกินไป บัดนี้เราจะเขียนใหมเพื่อใหกษัตริยเสด็จกลับมาได"
 FRA_repeal_the_law_of_exile: "ยกเลิกกฎหมายเนรเทศ"
 FRA_repeal_the_law_of_exile_desc: "ประมุขแหงราชวงศฝรั่งเศสหรือรัชทายาทไมไดรับอนุญาตใหเหยียบแผนดินฝรั่งเศสโดยไมไดรับอนุญาตอยางชัดแจง กอนที่ระบอบกษัตริยจะไดหวนคืนอยางภาคภูมิ เราตองกําจัดอุปสรรคเล็ก ๆ อันนารําคาญนี้เสียกอน"
 FRA_orleanist_restoration: "ฟนฟูราชวงศออรเลอ็อง"
 FRA_orleanist_restoration_desc: "ราชวงศออรเลอ็องไดรับการสนับสนุนอยางมากในหมูฝายนิยมกษัตริยในฝรั่งเศส แมผูคัดคานบางคนจะตองการผูสมัครชิงราชบัลลังกคนอื่น แตแทบไมตองสงสัยเลยวารัชทายาทฝายออรเลอ็องมีโอกาสดีที่สุดในการรวมประเทศใหอยูเบื้องหลังพระองคอยางสันติ"
 FRA_guarantee_the_constitution: "รับประกันรัฐธรรมนูญ"
 FRA_guarantee_the_constitution_desc: "กอนที่สื่อฝายสาธารณรัฐจะทันเปดฉากโจมตีอยางไรมูลตอความชอบธรรมของการปกครองโดยกษัตริย เราตองบั่นทอนสถานะของพวกเขาดวยการใหหลักประกันอยางหนักแนนวาจะเคารพสิทธิสวนบุคคลของประชาชน"
 FRA_the_first_citizen_of_the_state: "พลเมืองคนแรกแหงรัฐ"
 FRA_the_first_citizen_of_the_state_desc: "แมกษัตริยจะทรงมีพระราชอํานาจมาก แตตองไมถูกมองวาเปนทรราชหรือผูปกครองแบบสมบูรณาญาสิทธิ์อยางในอดีต กษัตริยสมัยใหมตองเคารพกฎหมายและเปนปราการดานแรกตอผูที่คิดจะชวงชิงอํานาจโดยมิชอบ"
 FRA_counter_action_desc: "อักซียงฟร็องแซซเปนผูสนับสนุนการฟนฟูระบอบกษัตริยที่แข็งขันที่สุดมาชานาน นาเสียดายที่ทัศนะของพวกเขาในเรื่องอื่น ๆ ยากจะยอมรับได ถึงเวลาแจงใหพวกเขารูวาหมดหนาที่แลว และกําจัดพวกเขาเสีย"
 FRA_no_further_humiliations: "ไมยอมถูกหยามอีกตอไป"
 FRA_no_further_humiliations_desc: "หลายปมาแลวที่รัฐบาลสาธารณรัฐชุดแลวชุดเลาปลอยใหชาวเยอรมันเหยียบยํ่าสนธิสัญญาระหวางประเทศ บางฉบับถูกละเมิดอยางหนาดาน ๆ กอนที่หมึกจะแหงเสียดวยซํ้า เรื่องนี้ตองจบลงเดี๋ยวนี้"
 FRA_slum_clearing: "รื้อถอนชุมชนแออัด"
 FRA_slum_clearing_desc: "แมจะอยูในหนึ่งในมหาอํานาจของโลก แตกรรมกรฝรั่งเศสธรรมดามักอาศัยอยูในสภาพที่สกปรกโสโครกนาสยดสยอง ไมมีกษัตริยองคใดที่คูควรกับพระอิสริยยศจะทรงยอมใหราษฎรของพระองคอยูในสภาพเชนนี้ได"
 FRA_public_welfare: "สวัสดิการสาธารณะ"
 FRA_public_welfare_desc: "กษัตริยที่ไมทรงงานเพื่อราษฎรผูตํ่าตอยที่สุดของพระองค ก็ไมใชกษัตริยเลย"
 FRA_the_legitimate_heir: "รัชทายาทผูชอบธรรม"
 FRA_the_legitimate_heir_desc: "ฝายเลจิติมิสตถือวาสายคารลิสตคือรัชทายาทผูชอบธรรมแหงราชบัลลังกฝรั่งเศส การแตงตั้งผูสมัครของพวกเขาขึ้นครองราชยเปดโอกาสอันนาดึงดูดที่จะปกครองสเปนและฝรั่งเศสในระบอบราชาธิปไตยคู"
 FRA_secure_the_crown_of_spain: "ยึดมงกุฎแหงสเปน"
 FRA_secure_the_crown_of_spain_desc: "กาวแรกในการทวงสิทธิโดยกําเนิดของกษัตริยคือการยึดสเปนคืนจากรัฐบาลของผูอางสิทธิ์ตาง ๆ ที่ผุดขึ้นมา การทะเลาะเบาะแวงอันไรสาระของพวกเขาเคยโยนประเทศเขาสูสงครามกลางเมืองอันนองเลือดมาแลวครั้งหนึ่ง - เราตองไมปลอยใหเกิดขึ้นอีก"
 FRA_unite_the_crowns: "รวมมงกุฎ"
 FRA_unite_the_crowns_desc: "เมื่อยึดสเปนไดแลว เราสามารถรวมมงกุฎทั้งสองและสรางราชอาณาจักรใหม นั่นคือราชอาณาจักรฝรั่งเศส-สเปน"
 FRA_two_countries_two_crowns: "สองประเทศ สองมงกุฎ"
 FRA_two_countries_two_crowns_desc: "ไมมีวิธีใดที่เปนไปไดในการรวมสองประเทศโดยที่ฝายหนึ่งจะไมรูสึกวาตนตกเปนขาของอีกฝาย เราจะถวายคําแนะนําใหกษัตริยทรงปกครองทั้งสองประเทศในรูปแบบรัฐรวมประมุข ไมใชการรวมทางกฎหมาย"
 FRA_proclaim_the_third_empire: "ประกาศจักรวรรดิที่สาม"
 FRA_proclaim_the_third_empire_desc: "ฝายโบนาปารตอาจถูกมองวาเปนตัวสอดแทรกในการชิงราชบัลลังก แตพวกเขานํามาซึ่งความฝนถึงยุคที่ทั่วทั้งยุโรปกมหัวใหจักรพรรดิแหงฝรั่งเศส"
 FRA_avenge_waterloo: "ชําระแคนวอเตอรลู"
 FRA_avenge_waterloo_desc: "ประวัติศาสตรของนโปเลียนที่ 1 จะถูกนิยามดวยความพายแพครั้งยิ่งใหญที่สุดของพระองคไปตลอดกาล หากเราตองการประสบความสําเร็จ เราตองแสดงใหเห็นวาเราชนะไดในที่ที่พระองคพายแพ"
 FRA_reorganize_the_dutch: "ปรับโครงสรางเนเธอรแลนด"
 FRA_reorganize_the_dutch_desc: "ชาวดัตชเองก็เคยเปนสวนหนึ่งของจักรวรรดิฝรั่งเศส บัดนี้เมื่อพวกเขาพายแพแลว ถึงเวลากลับคืนสูสภาพการณตามธรรมชาตินี้"
 FRA_retribution_for_sedan: "ชําระแคนเซอดาน"
 FRA_retribution_for_sedan_desc: "กวาครึ่งศตวรรษที่ชาวเยอรมันเฉลิมฉลองยุทธการที่เซอดานและชัยชนะเหนือนโปเลียนที่ 3 ณ ที่แหงนั้น ในอนาคต ชาวเยอรมันทุกคนจะตองเรียนรูที่จะสาปแชงชื่อของสถานที่นั้น"
 FRA_disunite_germany: "แยกสลายเยอรมนี"
 FRA_disunite_germany_desc: "ชัยชนะเหนือฝรั่งเศสทําใหปรัสเซียรวมรัฐเยอรมันขนาดเล็กเขาไวภายใตธงของตน เปนการสมควรแลวที่กระบวนการนี้จะถูกยอนกลับ เมื่อชาวเยอรมันพายแพแลว"
 FRA_disunite_germany_tt: "เปลี่ยนชื่อ §Yระบบภาคพื้นทวีป§! เปน §Yสมาพันธรัฐไรน§!"
 FRA_return_to_borodino: "หวนคืนสูโบโรดีโน"
 FRA_return_to_borodino_desc: "ที่โบโรดีโน นโปเลียนเขาใกลชัยชนะในยุโรปมากที่สุด กองทัพรัสเซียแทบถูกทําลายจนสิ้น และหากพระองคเร็วกวานี้อีกเพียงเล็กนอย ก็คงบีบใหรัสเซียยอมเจรจาได เราจะแสดงใหโลกเห็นวามันเปนไปได"
 FRA_je_suis_la_deluge: "ขาคือมหาอุทกภัย"
 FRA_je_suis_la_deluge_desc: "การปฏิวัติฝรั่งเศสคืออุทกภัยที่กวาดลางระบอบการปกครองเกาอันออนแอที่ครอบงํายุโรปมาเนิ่นนาน บัดนี้ อุทกภัยครั้งใหมไดมาถึงแลว"
 FRA_coordinate_rearmament_tt: "ลดตนทุนใบอนุญาตการผลิตสําหรับสมาชิกในฝายของเรา"
 invite_to_faction_tt: "ไดรับเชิญเขารวมฝายของเรา"
 VIC_emergency_powers_to_petain: "มอบอํานาจฉุกเฉินแกเปแต็ง"
 VIC_emergency_powers_to_petain_desc: "เมื่อพายแพในยุทธการแหงฝรั่งเศส เปนที่ชัดเจนวาตองใชมาตรการที่เด็ดขาดเพื่อรักษารัฐไว ประธานาธิบดีตองไมถูกจํากัดในการทําสิ่งที่จําเปน"
 VIC_the_national_revolution: "การปฏิวัติแหงชาติ"
 VIC_the_national_revolution_desc: "ความพายแพของเราเกิดจากขอบกพรองพื้นฐานในชาติของเราอยางไมตองสงสัย ตองใชเวลานานในการแกไขขอบกพรองนี้ แตบางทีความตกตะลึงจากความพายแพอาจทําใหเรากลับมาแข็งแกรงยิ่งขึ้น"
 VIC_long_term_economic_planning: "การวางแผนเศรษฐกิจระยะยาว"
 VIC_long_term_economic_planning_desc: "แมจะนาคิดวาสถานการณปจจุบันสําคัญจนอยูเหนือเรื่องอื่นใดทั้งหมด แตเราตองไมลืมวามีบางสิ่งที่ตองใชเวลานานในการดําเนินการ การจัดทําแผนเศรษฐกิจเปนชุดจะชวยใหเราขยายเศรษฐกิจไดอยางมีประสิทธิภาพ"
 VIC_aid_small_businesses: "ชวยเหลือธุรกิจขนาดเล็ก"
 VIC_aid_small_businesses_desc: "บริษัทขนาดเล็กจํานวนมากที่เปนสวนประกอบของเศรษฐกิจเราไดรับผลกระทบอยางหนักจากการปนสวนและมาตรการสงครามอื่น ๆ เราควรพยายามแกไขเพื่อชวยใหพวกเขาอยูรอด"
 VIC_venerate_the_craftsman: "ยกยองชางฝมือ"
 VIC_venerate_the_craftsman_desc: "การถกเถียงเรื่องแรงงานมุงไปที่กรรมกรอุตสาหกรรมซึ่งทํางานในโรงงานขนาดใหญของบริษัทใหญมานานเกินไปแลว ถึงเวลาแสดงใหเห็นผลงานของชางฝมือผูชํานาญ ซึ่งทํางานในโรงชางของตนเองเพื่อเลี้ยงดูครอบครัว"
 VIC_down_with_marianne: "ลมลางมารีอาน"
 VIC_down_with_marianne_desc: "การบูชามารีอาน สัญลักษณของสาธารณรัฐนิยมฝรั่งเศส ราวกับเปนศาสนา ไดบิดเบือนจิตใจของประชาชนเรา เชนเดียวกับสาธารณรัฐไรคาที่เธอเปนตัวแทน รองรอยทั้งหมดของเธอตองถูกลบลาง"
 VIC_up_with_jean_darc: "เชิดชูฌาน ดารก"
 VIC_up_with_jean_darc_desc: "ฌาน ดารก ตอสูอยางกลาหาญกับศัตรูที่ดูเหมือนจะเหนือกวาอยางทวมทน สละทุกสิ่งที่มีเพื่อปตุภูมิ และรวบรวมชาติไวใตธงของเธอเพื่อขับไลผูรุกราน เธอเปนสัญลักษณที่เยาวชนของเราควรใฝฝนจะเปนไดดีกวามารีอานมิใชหรือ?"
 VIC_celebrate_motherhood: "เชิดชูความเปนแม"
 VIC_celebrate_motherhood_desc: "เปนที่ชัดแจงโดยธรรมชาติวาที่ทางของสตรีคือในบาน เชนเดียวกับที่ที่ทางของบุรุษคือที่โตะชางหรือในไรนา ประชาชนของเราตองไดรับการเตือนใจวางานของสตรีมีความสําคัญตอการอยูรอดของชาติไมนอยไปกวางานของบุรุษ"
 VIC_prosecute_the_losers: "ดําเนินคดีกับผูทําใหพายแพ"
 VIC_prosecute_the_losers_desc: "ฝรั่งเศสตานทานกองทัพของไกเซอรไดนานหลายป แตกลับลมพับในสงครามครั้งนี้ ตองมีเหตุผลบางอยาง และเราตองไมหยุดจนกวาจะเปดโปงมันออกมาและนําผูรับผิดชอบมาลงโทษ"
 VIC_concessions_to_the_germans: "ยอมออนขอใหเยอรมัน"
 VIC_concessions_to_the_germans_desc: "ความเปนจริงของสถานการณบังคับใหเราตองหาขอตกลงกับอดีตศัตรู ตองมีหนทางที่จะลดภาระอันหนักอึ้งที่ถูกโยนมาใหเรา"
 VIC_mandatory_work_service: "การเกณฑแรงงานภาคบังคับ"
 VIC_mandatory_work_service_desc: "เราไดรับคํามั่นจากเยอรมันวาจะลดคาใชจายการยึดครองให หากเราสงแรงงานไปให อยางไรก็ตาม ดูเหมือนวามีประชาชนเพียงไมกี่คนที่เต็มใจทํางานที่จําเปนเพื่อชวยปตุภูมิในยามคับขัน เมื่อการจูงใจลมเหลว เราจําตองใชการบังคับอยางนาเสียดาย"
 VIC_a_nation_reborn: "ชาติที่เกิดใหม"
 VIC_a_nation_reborn_desc: "ที่ปลายทางของกระบวนการอันยาวนานและเจ็บปวดในการสรางชาติที่ถูกหยามเหยียดและพายแพขึ้นใหม คือฝรั่งเศสที่เกิดใหม ปลอดจากมะเร็งรายแหงสาธารณรัฐนิยมและความแตกแยกภายใน"
 VIC_end_the_occupation: "ยุติการยึดครอง"
 VIC_end_the_occupation_desc: "เมื่อการปฏิวัติแหงชาติของเราสิ้นสุดลง เราพรอมจะยืนเคียงขางอดีตศัตรูและตอสูเพื่อยุโรปใหม ยุโรปที่ปลอดภัยจากภัยคุกคามของบอลเชวิค และเปนอิสระจากสิ่งยั่วยุที่สรางความแตกแยกของสาธารณรัฐนิยม"
 VIC_the_national_bureau_of_statistics: "สํานักงานสถิติแหงชาติ"
 VIC_the_national_bureau_of_statistics_desc: "หากเราจะนําประชาชนไปสูอนาคตที่ดีกวา เราตองมีขอมูลที่แนนหนาเปนฐานในการตัดสินใจ เราควรจัดตั้งหนวยงานใหมที่มีหนาที่ผลิตขอมูลนี้"
 VIC_the_legionary_service_order: "หนวยบริการกองทหารผานศึก"
 VIC_the_legionary_service_order_desc: "เมื่อกองทัพของเราถูกปลดอาวุธเกือบทั้งหมด และอยางไรก็ตามก็มีกําลังนอยเกินกวาจะปกปองฝรั่งเศสไดทั้งประเทศ เราจําเปนตองมีองคกรใหมของเหลาผูรักชาติเพื่อสนับสนุนระบอบการปกครอง"
 VIC_form_the_milice: "จัดตั้งมีลิซ"
 VIC_form_the_milice_desc: "เมื่อขบวนการตอตานแข็งแกรงขึ้นเรื่อย ๆ ทั่วฝรั่งเศส เราจําเปนตองสรางกองกําลังที่สามารถบุกไปจัดการพวกเขาได เราจะรับสมัครเฉพาะผูที่รักชาติที่สุด และใหอิสระอยางกวางขวางในการดําเนินการตามที่เห็นสมควรเพื่อปราบผูกอการรายเหลานี้ใหสยบ"
 VIC_anti_bolshevist_volunteers: "อาสาสมัครตอตานบอลเชวิค"
 VIC_anti_bolshevist_volunteers_desc: "การตอสูครั้งยิ่งใหญที่สุดในประวัติศาสตรมนุษยชาติกําลังเกิดขึ้นในขณะนี้ ระหวางกองกําลังแหงอารยธรรมตะวันตกกับกองกําลังคอมมิวนิสต เราไมอาจนิ่งดูดายขณะที่ศึกมหึมานี้กําลังดําเนินอยู"
 VIC_rebuild_the_military: "สรางกองทัพขึ้นใหม"
 VIC_rebuild_the_military_desc: "กองทัพฝรั่งเศสพายแพและถูกหยามอยางสิ้นเชิง ตองใชความพยายามอันยาวนานในการฟนฟูใหกลับมามีกําลังรบเต็มที่"
 VIC_finish_the_naval_buildup: "สานตอการเสริมกําลังทางเรือใหเสร็จ"
 VIC_finish_the_naval_buildup_desc: "สาธารณรัฐที่เพิ่งลมสลายไดวางกระดูกงูเรือหลายลําเพื่อปรับปรุงกองเรือใหทันสมัย แตเริ่มชาเกินไปและดําเนินการลาชาเกินไป จึงไมอาจแลวเสร็จไดทันเวลา ถึงกระนั้นมันก็ยังอาจเปนแกนกลางของกองทัพเรือฝรั่งเศสใหมได"
 VIC_hidden_materials: "ยุทธปจจัยที่ซอนไว"
 VIC_hidden_materials_desc: "ชาวเยอรมันคงไมอาจสรางกองทัพขึ้นใหมไดรวดเร็วเทาที่ทํา หากพวกเขาไมโกงขอกําหนดในสนธิสัญญา ดังนั้นจึงยุติธรรมและสมควรแลวที่เราจะทําเชนเดียวกัน"
 VIC_analyze_our_defeat: "วิเคราะหความพายแพของเรา"
 VIC_analyze_our_defeat_desc: "ความพายแพของเราไมใชสิ่งที่หลีกเลี่ยงไมได ผูคนมากมายบกพรองในหนาที่ ในหวงโซอันยาวเหยียดของความประมาทเลินเลออันนารังเกียจ เราจะคนหาสาเหตุที่แทจริง และทําใหแนใจวาเราจะเตรียมพรอมไดดีกวานี้ในอนาคต"
 VIC_modernize_the_airforce: "ปรับปรุงกองทัพอากาศใหทันสมัย"
 VIC_modernize_the_airforce_desc: "บางทีสวนที่นาอับอายที่สุดของความพายแพคือการที่เราไมอาจแขงขันไดบนทองฟา เรามีเครื่องบินสมัยใหมนอยเกินไป ขณะที่สงครามยังคงดําเนินไปรอบตัวเรา เครื่องบินแบบใหมถูกนําเขาสายการผลิตอยางรวดเร็ว เราตองไมปลอยใหเรื่องเชนนี้เกิดขึ้นอีก"
 VIC_learn_from_the_enemy: "เรียนรูจากศัตรู"
 VIC_learn_from_the_enemy_desc: "วิธีที่เร็วที่สุดในการเขาใจวาเราลมเหลวอยางไรและเพราะเหตุใด คือการทําความเขาใจวาฝายตรงขามทําอะไรถูกตอง"
 VIC_buy_from_the_enemy: "ซื้อจากศัตรู"
 VIC_buy_from_the_enemy_desc: "อุตสาหกรรมทหารของเราไมสามารถจัดหาอาวุธสมัยใหมใหเราไดเพียงพอ และตอนนี้ก็ยังทําไมได เราตองมองหาทางจัดหาอาวุธสมัยใหมจากทุกแหลงที่มี"
 FRA_appeal_to_the_french_nation: "เรียกรองตอชาติฝรั่งเศส"
 FRA_appeal_to_the_french_nation_desc: "ฝรั่งเศสอาจแพศึก แตยังไมแพสงคราม เปนหนาที่ของชาวฝรั่งเศสผูรักชาติทุกคนที่จะตองตอตาน"
 FRA_appeal_to_overseas_territories: "เรียกรองตอดินแดนโพนทะเล"
 FRA_appeal_to_overseas_territories_desc: "แมดินแดนประเทศแมของฝรั่งเศสอาจตกอยูในมือศัตรูแลว แตจักรวรรดิสวนใหญยังคงเปนอิสระ หากเราระดมพวกเขามาชวยเหลือได เราจะนําการตอสูกลับไปหาศัตรูได"
 FRA_appeal_to_overseas_territories_tt: "ดินแดนอาณานิคมในสวนตาง ๆ ของโลกมีโอกาสที่จะเปลี่ยนมาอยูฝายเรา"
 FRA_intervention_in_north_africa: "แทรกแซงในแอฟริกาเหนือ"
 FRA_intervention_in_north_africa_desc: "แอฟริกาเหนือเปนฐานเตรียมการที่ดีที่สุดสําหรับการบุกยึดมาตุภูมิคืน การดึงที่นี่มาเปนฝายเรามีความสําคัญยิ่งตอการรณรงคปลดปลอยของเรา"
 FRA_intervention_in_west_africa: "แทรกแซงในแอฟริกาตะวันตก"
 FRA_intervention_in_west_africa_desc: "แอฟริกาตะวันตกมีประชากรนับลาน ๆ คน ซึ่งสามารถเกณฑเขากองทัพใหมเพื่อยึดมาตุภูมิของเราคืนได"
 FRA_intervention_in_syria: "แทรกแซงในซีเรีย"
 FRA_intervention_in_syria_desc: "การกีดกันไมใหศัตรูไดดินแดนยุทธศาสตรในซีเรียจะชวยปกปองคลองสุเอซและปรับปรุงสถานการณของเราในเมดิเตอรเรเนียนตะวันออกไดอยางมาก"
 FRA_intervention_in_indochina: "แทรกแซงในอินโดจีน"
 FRA_intervention_in_indochina_desc: "อาณานิคมของเราในอินโดจีนซึ่งอยูหางไกลจากการสูรบในยุโรป เปนพื้นที่ที่เหมาะอยางยิ่งในการชวยเราปกปองผลประโยชนในภูมิภาคนั้น"
 FRA_intervention_in_central_africa: "แทรกแซงในแอฟริกากลาง"
 FRA_intervention_in_central_africa_desc: "แอฟริกากลางมีความสําคัญยิ่งตอความพยายามทางสงครามของฝายสัมพันธมิตร และอาจถูกยึดเพื่อเปนชัยชนะทางการโฆษณาชวนเชื่อครั้งสําคัญของเรา"
 FRA_intervention_in_madagascar: "แทรกแซงในมาดากัสการ"
 FRA_intervention_in_madagascar_desc: "หากปลอยใหศัตรูยึดและเสริมปอมปราการมาดากัสการได เราจะเผชิญหายนะในมหาสมุทรอินเดีย การลงมืออยางรวดเร็วและเด็ดขาดจะชวยใหเกาะนี้ยังคงอยูฝายเรา"
 FRA_form_the_national_committee: "จัดตั้งคณะกรรมการแหงชาติ"
 FRA_form_the_national_committee_desc: "มีไมกี่คนที่เชื่อวาอุดมการณของเราจะประสบความสําเร็จ แตบัดนี้ในที่สุดเราก็แข็งแกรงพอจะประกาศจัดตั้งรัฐบาลพลัดถิ่นที่ทํางานไดเต็มรูปแบบ พรอมเขาควบคุมดินแดนฝรั่งเศสใด ๆ ที่ไดรับการปลดปลอยจากศัตรู"
 FRA_form_the_provisional_government_of_the_republic: "จัดตั้งรัฐบาลเฉพาะกาล"
 FRA_form_the_provisional_government_of_the_republic_desc: "ดวยการปลดปลอยปารีส เราไมใชรัฐบาลพลัดถิ่นอีกตอไป ถึงเวลาเริ่มงานอันยากลําบากในการฟนฟูประเทศของเรา"
 FRA_continue_the_fight: "สูตอไป"
 FRA_continue_the_fight_desc: "จนถึงตอนนี้มีทหารเพียงไมกี่นายที่เลือกเขารวมกับเรา แตผูที่เรามีอยูจะตองไดรับอาวุธและยุทโธปกรณ"
 FRA_the_free_french_navy: "กองทัพเรือฝรั่งเศสเสรี"
 FRA_the_free_french_navy_desc: "พันธมิตรของเรากําลังติดอยูในการตอสูอยางสิ้นหวังเพื่อเอาชีวิตรอด ซึ่งเสนทางเดินเรือมีความสําคัญยิ่ง เราตองทําหนาที่ของเราเพื่อชวยเหลือพวกเขา"
 FRA_colonial_recruitment_desc: "เมื่อไมอาจเกณฑทหารจากมาตุภูมิได เราตองหันไปขอความชวยเหลือจากอาณานิคม ราษฎรของเราหลายคนเต็มใจจับอาวุธตอสูเพื่อเรา"
 FRA_the_regiment_normandie: "กรมทหารนอรม็องดี"
 FRA_the_regiment_normandie_desc: "เปนเรื่องสําคัญยิ่งที่ชาวฝรั่งเศสตองปรากฏวากําลังสูรบอยูในทุกแนวรบ เมื่อโซเวียตกําลังรบกับศัตรูรวมของเรา เราสามารถสงนักบินขับไลกลุมเล็ก ๆ ไปชวยเหลือพวกเขาได"
 FRA_refus_absurde: "การปฏิเสธอันไรเหตุผล"
 FRA_refus_absurde_desc: "แมในยามพายแพ ความมุงมั่นที่จะตอตานยังคงแข็งแกรงในหัวใจของบางคน พวกเขาจะเปนรากฐานของขบวนการตอตานในดินแดนที่ถูกยึดครอง"
 FRA_the_maquis: "มากี"
 FRA_the_maquis_desc: "ชนบทของฝรั่งเศสเปนที่หลบซอนใหแกทุกคนที่ตองการหลบหนีผูยึดครองหรือสมุนผูสมรูรวมคิดของพวกเขา เราควรสนับสนุนผูที่ไมยอมใชแรงงานรับใชศัตรูในฐานะการตอตาน เพื่อที่ในเวลาตอมาเราจะเปลี่ยนพื้นที่เหลานั้นใหเปนแหลงบมเพาะการตอตาน"
 FRA_reach_out_to_trade_unions: "ผูกสัมพันธกับสหภาพแรงงาน"
 FRA_reach_out_to_trade_unions_desc: "หากเราจะโจมตีอุตสาหกรรมที่บัดนี้ถูกศัตรูบังคับใชงาน การติดตอสื่อสารที่ดีกับคนงานที่นั่นดูจะเปนวิธีที่ดีที่สุด พวกเขาสามารถถวงหรือกอวินาศกรรมการผลิตใด ๆ ไดอยางมีประสิทธิภาพกวากองกําลังภายนอกใด ๆ มาก"
 FRA_cooperation_with_the_communists: "รวมมือกับคอมมิวนิสต"
 FRA_cooperation_with_the_communists_desc: "ในการตอสูรวมกันของเรา เราตองไมปฏิเสธพันธมิตรใดที่ยื่นมือเขามา - แมวาพวกเขาจะเรียกตัวเองวาสหายก็ตาม"
 FRA_connections_to_industrialists: "เชื่อมโยงกับนักอุตสาหกรรม"
 FRA_connections_to_industrialists_desc: "แมความรวมมือกับคนงานในอุตสาหกรรมสงครามจะเปนประโยชน แตความรวมมือกับผูบริหารโรงงานก็มีประโยชนในตัวของมันเองเชนกัน"
 FRA_the_civil_and_military_organization: "องคการพลเรือนและทหาร"
 FRA_the_civil_and_military_organization_desc: "กลุมเล็ก ๆ จํานวนมากที่ดําเนินการตอตานกําลังรวมตัวกันเปนองคกรที่ใหญขึ้น เราควรใหการรับรองแกพวกเขา"
 FRA_national_council_of_the_resistance_desc: "ขบวนการตอตานแข็งแกรงขึ้นเรื่อย ๆ ในฝรั่งเศส และมีพลังมากจนจําเปนตองมีคณะกรรมการชี้นําชุดใหมเพื่อประสานงานกิจกรรมตาง ๆ"
 FRA_national_uprising_desc: "ถึงเวลาแลว บัดนี้คือเวลาที่จะจับอาวุธและกาวออกมาจากเงามืดที่ปกคลุมพวกทานมาหลายป!"
 FRA_french_forces_of_the_interior: "กองกําลังภายในฝรั่งเศส"
 FRA_french_forces_of_the_interior_desc: "ขบวนการตอตานมีกําลังพลติดอาวุธนับพันคนทั่วฝรั่งเศส เมื่อเราและพันธมิตรรุกคืบผานประเทศ เราจะรวบรวมพวกเขาและเปลี่ยนใหเปนทหารในกองทัพของเรา"
 FRA_french_forces_of_the_interior_tt: "สรางหนวยทหารราบที่ออนแอในทุกรัฐดินแดนหลักที่ไดรับการปลดปลอย"
 FRA_naval_rearmament: "ฟนฟูกําลังรบทางเรือ"
 FRA_naval_rearmament_desc: "อุตสาหกรรมตอเรือของเราถูกปลอยใหซบเซาขณะที่เรามุงตามใหทันพัฒนาการในดานอื่น ผลก็คือบัดนี้เราเสี่ยงอยางยิ่งที่จะถูกคูแขงในทะเลเมดิเตอรเรเนียนและมหาสมุทรแอตแลนติกแซงหนา เราตองลงทุนมากขึ้นเพื่อชดเชยเวลาที่เสียไป"
 FRA_colonial_naval_bases: "ฐานทัพเรือในอาณานิคม"
 FRA_colonial_naval_bases_desc: "กุญแจสูการแผอํานาจระดับโลกคือความสามารถในการรักษากองเรือไวหางไกลจากนานนํ้าบานเกิด เรามีดินแดนอาณานิคมขนาดใหญอยูแลว บัดนี้เราตองพัฒนาใหเปนฐานเติมเชื้อเพลิงและซอมบํารุงสําหรับกองเรือ"
 FRA_develop_colonial_dockyards: "พัฒนาอูตอเรือในอาณานิคม"
 FRA_develop_colonial_dockyards_desc: "เมื่อฐานทัพเรือในสวนตาง ๆ ของจักรวรรดิไดรับการขยายและปรับปรุงใหทันสมัยแลว เราสามารถพิจารณาตั้งอุตสาหกรรมหนักที่จําเปนและสรางอูขนาดใหญเพื่อตอเรือในโพนทะเลได"
 FRA_the_old_school: "สํานักคิดเกา"
 FRA_the_old_school_desc: "แมเทคโนโลยีทางเรือจะกาวหนาไปมาก แตองคประกอบสําคัญของแสนยานุภาพทางทะเลยังคงเปนเรือหลักที่ปฏิบัติการโดยมีหนวยอื่นในกองเรือคอยสนับสนุน ไมวาเรือหลักนี้จะยังคงเปนเรือประจัญบานหรือเปนเรือบรรทุกเครื่องบินแบบใหม เราตองขยายอุตสาหกรรมตอเรือใหใหญขึ้นอีกเพื่อใหตามทันมหาอํานาจทางทะเลอื่น ๆ"
 FRA_carrier_planes: "เครื่องบินประจําเรือบรรทุกเครื่องบิน"
 FRA_carrier_planes_desc: "เรือบรรทุกเครื่องบินจะดีไดเพียงเทาเครื่องบินที่บรรทุก หากไมมีเครื่องบินสมัยใหม เรือบรรทุกเครื่องบินลําใดก็เปนการลงทุนที่สูญเปลา"
 FRA_rush_the_richelieus: "เรงสรางเรือชั้นริชลีเยอ"
 FRA_rush_the_richelieus_desc: "เมื่อสถานการณในยุโรปสิ้นหวังขึ้นเรื่อย ๆ เราไมมีเวลาสรางเรือผิวนํ้าแบบใหมดวยวิธีปกติ เราตองจัดลําดับความสําคัญของวัตถุดิบเพื่อนําเรือประจัญบานลําใหมเขาประจําการใหเร็วที่สุด"
 FRA_prioritize_the_joffre: "ใหความสําคัญกับเรือฌอฟร"
 FRA_prioritize_the_joffre_desc: "กองเรือบรรทุกเครื่องบินปจจุบันของเราลาสมัยอยางสิ้นหวังและสูศัตรูที่อาจเกิดขึ้นใด ๆ ไมได เราตองใหโครงการเรือบรรทุกเครื่องบินลําใหมไดรับความสําคัญสูงสุด"
 FRA_the_young_school: "สํานักคิดใหม"
 FRA_the_young_school_desc: "พัฒนาการดานการบิน เรือดํานํ้า และตอรปโดทําใหเรือหลักลาสมัย ดวยอุตสาหกรรมทางเรือที่จํากัด เราไมอาจเสียเวลาและเงินไปกับการสรางปอมปราการลอยนํ้าขนาดมหึมาที่ไรทางสูตอภัยคุกคามในสมรภูมิทางทะเลสมัยใหม เราควรมุงปรับปรุงประสิทธิภาพเพื่อใหสรางเรือขนาดเล็กไดมากขึ้นแทน"
 FRA_undersea_combat: "การรบใตนํ้า"
 FRA_undersea_combat_desc: "เรือดํานํ้าไดพัฒนาจนเติบโตเต็มที่ในทศวรรษที่ผานมา บัดนี้มันเปนภัยคุกคามถึงชีวิตตอเรือผิวนํ้าทุกลํา ในขณะที่ตรวจจับและทําลายไดยากขึ้นเรื่อย ๆ"
 FRA_surface_combat: "การรบผิวนํ้า"
 FRA_surface_combat_desc: "ดวยความกาวหนาดานการยิงปนเรือ แทบเปนไปไมไดแลวที่จะสรางเรือซึ่งหวังจะรอดจากการดวลปนอันยืดเยื้อกับเรือหลักลําอื่น การมีกองเรือพิฆาตสมัยใหมและเรือตอรปโดเพื่อถลมศัตรูดวยการยิงตอรปโดระดมชุดใหญจึงดีกวามาก"
 FRA_prioritize_the_joffre_tt: "เพิ่ม §Yเรือบรรทุกเครื่องบิน§! สมัยใหมที่สรางเสร็จแลว 40% เขาคิวการกอสราง"
 POR_infrastructure_in_angola_tt: "เพิ่ม §Yฐานทัพเรือ 2 ระดับ§! ในจังหวัดกาบินดาในแองโกลา\n   เพิ่ม §Yฐานทัพเรือ 3 ระดับ§! ในจังหวัดลูอันดาในแองโกลา\n"
 FRA_SNCAN_formed: "จัดตั้ง SNCAN แลว"
 FRA_SNCAO_formed: "จัดตั้ง SNCAO แลว"
 FRA_SNCASE_formed: "จัดตั้ง SNCASE แลว"
 FRA_SNCASO_formed: "จัดตั้ง SNCASO แลว"
 vichy_french_focus: "ผังยุทธศาสตรฝรั่งเศสวีชี"
 POR_colonial_assimilation_policy_desc: "ชาติโปรตุเกสตางจากประเทศอื่นตรงที่ไมไดถูกนิยามดวยเชื้อชาติ แตดวยวัฒนธรรมรวมและพันธกิจในการสรางอารยธรรม แทนที่จะมีอคติทางเชื้อชาติ เราตองการการผสมผสานระหวางเชื้อชาติ"
 POR_colonial_army_desc: "เพื่อใหเปนชาติที่เขมแข็ง เราไมอาจพึ่งพาเพียงกองทัพของประเทศแม เราตองจัดตั้งหนวยทหารอาณานิคม ติดอาวุธ และฝกใหรบในสงครามสมัยใหมได"
 POR_luso_tropicalism: "ลัทธิลูโซ-ทรอปคัล"
 POR_luso_tropicalism_desc: "เราตองยอมรับธรรมชาติความเปนพหุวัฒนธรรมของโปรตุเกสนับตั้งแตศตวรรษที่ 15 และเนนยํ้าเอกภาพของชาติ ผนวกอาณานิคมในแอฟริกาเขากับดินแดนของเราและมอบสัญชาติใหแกประชากรทองถิ่น ยอมมีผูคัดคานแนนอน แตเราตองทําสิ่งที่ถูกตองสําหรับผูคนที่อาศัยอยูในดินแดนของเรา"
 POR_limited_self_rule: "การปกครองตนเองแบบจํากัด"
 POR_limited_self_rule_desc: "การเพิ่มอํานาจปกครองตนเองใหอาณานิคมในแอฟริกาโดยใหจัดตั้งรัฐบาลของตนเอง จะชวยใหเรามุงความสนใจไปยังเรื่องเรงดวนกวาได การปลดปลอยอาณานิคมนี้อาจทําใหเราใกลชิดกับประเทศประชาธิปไตยทั่วโลกมากขึ้น"
 POR_restart_investment_into_timor: "ฟนการลงทุนในติมอร"
 POR_restart_investment_into_timor_desc: "ติมอรถูกมองวาเปนภาระทางเศรษฐกิจในชวงภาวะเศรษฐกิจตกตํ่าครั้งใหญ จึงไดรับการสนับสนุนหรือการบริหารจากเราเพียงเล็กนอยนับตั้งแตวิกฤตเริ่มตน เมื่อบริษัทพัฒนานันโย โคฮัตสึของญี่ปุนเขามาลงทุนในภูมิภาค บางทีถึงเวลาที่เราจะกลับมาลงทุนที่นั่นดวยเชนกัน"
 POR_revert_the_local_autonomy_policies: "ยกเลิกนโยบายการปกครองตนเองระดับทองถิ่น"
 POR_revert_the_local_autonomy_policies_desc: "หลังการกบฏมานูฟาฮีในป 1911 นโยบายอาณานิคมของเราหันกลับไปใชผูปกครองพื้นเมืองเปนเพียงหุนเชิด และละทิ้งความพยายามกอนหนาในการผนวกภูมิภาคใหกลมกลืนยิ่งขึ้น บางทีเราควรยกเลิกสิ่งนี้ และยอมรับความเปนพหุวัฒนธรรมของรัฐเรา" 
 POR_invest_in_sandalwood_and_coffee_production: "ลงทุนในการผลิตไมจันทนและกาแฟ"
 POR_invest_in_sandalwood_and_coffee_production_desc: "บริษัทเพาะปลูกหลักของเราในติมอร คือ SAPT จะไดรับประโยชนอยางมากจากการลงทุนเพิ่มเติมของรัฐบาล หากเราใหทุนพวกเขาตอนนี้ ผลผลิตของพวกเขาอาจสรางผลตอบแทนมหาศาลใหเราในอนาคตอันใกล"
 POR_haven_of_neutrality_macau: "มาเกา สวรรคแหงความเปนกลาง"
 POR_haven_of_neutrality_macau_desc: "ดวยจุดยืนเปนกลางของเราในปจจุบันและความขัดแยงที่กําลังลุกโชนไปทั่วเอเชีย มาเกาไดกลายเปนประภาคารแหงความหวังและเสถียรภาพในชวงเวลาอันปนปวนนี้ เราควรลงทุนขยายจังหวัดนี้"
 POR_infrastructure_in_angola: "โครงสรางพื้นฐานในแองโกลา"
 POR_infrastructure_in_angola_desc: "แองโกลามีทรัพยากรลํ้าคามากมายที่ยังไมไดสํารวจ เราตองพัฒนาโครงสรางพื้นฐานในภูมิภาคเพื่อนําทรัพยากรมาใชประโยชนในอนาคต"
 POR_develop_north_angola: "พัฒนาแองโกลาตอนเหนือ"
 POR_develop_north_angola_desc: "เราไดคนพบแหลงแรเหล็กในแองโกลาตอนเหนือ เราควรสรางอุตสาหกรรมสกัดแรที่จําเปนเพื่อใชประโยชนจากทรัพยากรอันมีคานี้"
 POR_develop_south_angola: "พัฒนาแองโกลาตอนใต"
 POR_develop_south_angola_desc: "การสํารวจหาทรัพยากรในแองโกลาตอนใตประสบความสําเร็จ บัดนี้เราสามารถพัฒนาอุตสาหกรรมที่จําเปนสําหรับการใชประโยชนไดแลว"
 POR_portuguese_oil: "นํ้ามันโปรตุเกส"
 POR_portuguese_oil_desc: "ชาติที่ไมมีนํ้ามันไมอาจประคองเศรษฐกิจไดเมื่อเกิดความขัดแยง เราตองสํารวจหาแหลงนํ้ามันที่คุมคาเชิงพาณิชยในแองโกลา"
 POR_develop_mozambique: "พัฒนาโมซัมบิก"
 POR_develop_mozambique_desc: "การพัฒนาโครงสรางพื้นฐานและอุตสาหกรรมในโมซัมบิกจะชวยใหเราใชประโยชนจากแหลงอะลูมิเนียมที่นั่นได"
 POR_continue_the_public_works: "สานตอโครงการสาธารณูปโภค"
 POR_continue_the_public_works_desc: "ดวยกฎระเบียบของรัฐที่รัฐบาลของเรานํามาใชหลังจากสถานะการเงินงอนแงนมาหลายป เราสามารถทําใหเศรษฐกิจมีเสถียรภาพได และเราควรลงทุนในโครงการสาธารณะตอไปเพื่อกระตุนการพัฒนาโครงสรางพื้นฐาน"
 POR_instituto_superior_tecnico: "สถาบันเทคนิคชั้นสูง"
 POR_instituto_superior_tecnico_desc: "โปรตุเกสตองการโรงเรียนวิศวกรรมชั้นสูงที่มีสิ่งอํานวยความสะดวกดานการเรียนการสอนและการวิจัยที่ทันสมัยที่สุด เพื่อไมใหลาหลังในการตอสูที่ใกลเขามา"
 POR_ogme: "OGME"
 POR_ogme_desc: "ดวยการลงทุนในโรงงานกลางยุทโธปกรณวิศวกรรม (Oficinas Gerais de Material de Engenharia) เราจะสามารถจัดหายุทโธปกรณที่ทันสมัยและมีคุณภาพสูงใหกองทัพไดรวดเร็วยิ่งขึ้นมาก"
 POR_ogma: "OGMA"
 POR_ogma_desc: "การยกระดับสิ่งอํานวยความสะดวกของโรงงานกลางยุทโธปกรณการบิน (Oficinas Gerais de Material Aeronáutico) จะชวยปรับปรุงการผลิตอากาศยานของเราไดอยางมาก"
 POR_roads_bridges_and_dams: "ถนน สะพาน และเขื่อน"
 POR_roads_bridges_and_dams_desc: "เราควรลงทุนในโครงการกอสรางสาธารณะที่มุงปรับปรุงโครงสรางพื้นฐานและระบบถนนของเรา"
 POR_extraction_industries: "อุตสาหกรรมสกัดแร"
 POR_extraction_industries_desc: "ความมั่งคั่งจํานวนมากของเราอยูใตผืนดิน แตเหมืองของเรายังเกาและใชวิธีแบบหัตถกรรม เราตองสรางอุตสาหกรรมสกัดแรสมัยใหม"
 POR_hydroelectricity: "ไฟฟาพลังนํ้า"
 POR_hydroelectricity_desc: "ดวยการลงทุนขนาดใหญในภาคเหนือและภาคกลางของโปรตุเกส บัดนี้เราสามารถสรางเครือขายเขื่อนที่จะผลิตไฟฟาและควบคุมการไหลของแมนํ้าได"
 POR_military_vehicles: "ยานพาหนะทางทหาร"
 POR_military_vehicles_desc: "กองทัพของเราตองการยานพาหนะสมัยใหมสําหรับการรบที่จะมาถึง หากเราจะมีชัยในความขัดแยงในอนาคต เราตองทําใหแนใจวาพวกเขาไดรับยานพาหนะคุณภาพสูงสุดอยางเพียงพอ"
 POR_portuguese_artillery: "ปนใหญโปรตุเกส"
 POR_portuguese_artillery_desc: "ปนใหญสนามมีความสําคัญยิ่งในสมรภูมิสมัยใหม เราตองลงทุนสรางโรงงานใหมที่ชวยใหเพิ่มการผลิตปนใหญได"
 POR_advanced_artillery: "ปนใหญขั้นสูง"
 POR_advanced_artillery_desc: "เราตองพัฒนาปนใหญแบบใหมและฝกทหารใหยิงระดมและสนับสนุนการรุกของทหารราบไดอยางมีประสิทธิภาพยิ่งขึ้น"
 POR_military_research_facilities: "สถานวิจัยทางทหาร"
 POR_military_research_facilities_desc: "ความพยายามในการปรับปรุงอุตสาหกรรมอาวุธของเราตองควบคูไปกับการลงทุนดานการวิจัยอยางเพียงพอ หากเราตองการรักษากองทัพที่ทันสมัยและมีขีดความสามารถ"
 POR_armor_focus: "มุงเนนยานเกราะ"
 POR_armor_focus_desc: "เพื่อครองสนามรบ เราตองการเครื่องจักรสงครามที่ดีที่สุด เราตองขยายโรงงานผลิตยานเกราะและลงทุนในการวิจัยเพิ่มเติม"
 POR_mechanized_focus: "มุงเนนยานเกราะลําเลียงพล"
 POR_mechanized_focus_desc: "ยานเกราะลําเลียงพลเหมาะกวายานลอแบบอื่นมากในการปกปองทหารราบของเราเมื่อถูกขาศึกระดมยิง การวิจัยและการผลิตยานประเภทนี้อาจมีความสําคัญอยางยิ่ง"
 POR_light_aircraft_focus: "มุงเนนเครื่องบินเบา"
 POR_light_aircraft_focus_desc: "การบินมีวิวัฒนาการอยูตลอดเวลา และเราตองพัฒนาอุตสาหกรรมอากาศยานที่เหมาะสมเพื่อสนับสนุนกองทัพ"
 POR_advanced_light_aircraft: "เครื่องบินเบาขั้นสูง"
 POR_advanced_light_aircraft_desc: "การประสานงานระหวางการบินกับเหลาทัพอื่นมีความสําคัญยิ่ง การพัฒนาอากาศยานสมัยใหมเพื่อสนับสนุนทหารของเราจะชวยเพิ่มความสําเร็จในการรบไดอยางมาก"
 POR_jet_research: "การวิจัยเครื่องยนตไอพน"
 POR_jet_research_desc: "หากเราตองการครองนานฟา เราตองนําความกาวหนาลาสุดมาใชกับอากาศยาน การวิจัยวิธีขับเคลื่อนเครื่องบินแบบใหม เชน เครื่องยนตไอพน ดูเหมือนจะเปนเสนทางที่มีอนาคตที่สุด"
 POR_industrial_modernization: "ปรับปรุงอุตสาหกรรมใหทันสมัย"
 POR_industrial_modernization_desc: "อุตสาหกรรมพลเรือนสวนใหญของเรายังลาสมัย มันอาจมีประสิทธิภาพมากขึ้นอยางมากหากเราสละเวลาและทรัพยากรลงทุนปรับปรุง"
 POR_a_new_industry_desc: "ดวยความกาวหนาทางเทคโนโลยีลาสุดดานการผลิตแบบอัตโนมัติ เราสามารถปรับปรุงและขยายโรงงานพลเรือนตอไปเพื่อใหบรรลุประสิทธิภาพระดับใหม"
 POR_food_industries: "อุตสาหกรรมอาหาร"
 POR_food_industries_desc: "ถึงเวลาที่โปรตุเกสจะกาวไปขางหนาและปลุกพลังใหอุตสาหกรรมการผลิต เราสามารถเริ่มตนดวยการพัฒนาโรงงานอาหารทางตอนเหนือของประเทศ"
 POR_textile_industry: "อุตสาหกรรมสิ่งทอ"
 POR_textile_industry_desc: "เพื่อใหอุตสาหกรรมสิ่งทอของเราบรรลุศักยภาพสูงสุด เราตองสรางโรงงานใหมที่ชวยใหแปรรูปฝายจํานวนมากที่ผลิตในดินแดนของเราได"
 POR_second_navy_reequipment: "การจัดหายุทโธปกรณกองทัพเรือระยะที่สอง"
 POR_second_navy_reequipment_desc: "โครงการจัดหายุทโธปกรณกองทัพเรือระยะแรกเสร็จสิ้นแลว เราควรดําเนินการระยะที่สองตอไป โดยปรับปรุงอูตอเรือของกองทัพเรือและเปดประมูลซื้อเรือสมัยใหมจํานวนหนึ่งจากตางประเทศ"
 POR_a_powerful_merchant_marine: "กองเรือพาณิชยที่ทรงพลัง"
 POR_a_powerful_merchant_marine_desc: "เราจําเปนตองสรางกองเรือพาณิชยขนาดใหญที่สามารถขนสงทรัพยากรทั้งหมดที่เศรษฐกิจของเราตองการ ซึ่งทําไดดวยการตอเรือสินคาในอูตอเรือขนาดเล็ก"
 POR_merchant_marine_protection: "คุมครองกองเรือพาณิชย"
 POR_merchant_marine_protection_desc: "ประสบการณในมหาสงครามสอนเราวาเรือสินคาตองไดรับการคุมครองจากภัยคุกคามของเรือดํานํ้า"
 POR_submarine_effort: "ทุมเทใหเรือดํานํ้า"
 POR_submarine_effort_desc: "เราควรเริ่มการวิจัยและผลิตเรือดํานํ้าสมัยใหม ซึ่งจะมอบความไดเปรียบอันทรงพลังเมื่อเราเขาสูสงครามใตนํ้า"
 POR_fuzileiros: "ฟูซีไลรุช"
 POR_fuzileiros_desc: "กองกําลังนาวิกโยธินที่ไดรับการฝกมาอยางดีเปนพื้นฐานสําคัญตอความมั่นคงของดินแดนโพนทะเลของเรา"
 POR_naval_research_institute: "สถาบันวิจัยทางเรือ"
 POR_naval_research_institute_desc: "ดวยการลงทุนที่เหมาะสม โรงเรียนนายเรือ (Escola Naval) ของเราจะสามารถปรับปรุงงานวิจัยและใหการศึกษาที่มีคุณภาพสูงขึ้นแกนายทหารในอนาคต"
 POR_air_naval_research: "การวิจัยการบินนาวี"
 POR_air_naval_research_desc: "เราตองรวบรวมนักบินและนายทหารเรือที่ดีที่สุดเพื่อคิดคนวิธีใหมในการประสานงานระหวางกองทัพอากาศและกองทัพเรือที่กําลังเติบโต"
 POR_arsenal_do_alfeite: "อารเซนัลดูอัลไฟต"
 POR_arsenal_do_alfeite_desc: "สิ่งสําคัญอันดับแรกของเราคือการสรางกองทัพเรือที่แข็งแกรงซึ่งสามารถปกปองจักรวรรดิที่กวางใหญไพศาล เราตองมีขีดความสามารถและความรูในการตอเรือขนาดใหญขึ้น อูตอเรือหลักของกองทัพเรือในลิสบอนควรไดรับการขยาย และวาจางผูเชี่ยวชาญดานการตอเรือ"
 POR_national_cruiser_production: "การผลิตเรือลาดตระเวนในประเทศ"
 POR_national_cruiser_production_desc: "เราควรมุงเนนการสรางเรือขนาดใหญตอไป เรือลาดตระเวนสมัยใหมจะมอบอํานาจการยิงมหาศาลใหกองทัพเรือของเรา"
 POR_battleship_effort: "ทุมเทใหเรือประจัญบาน"
 POR_battleship_effort_desc: "หากเราตองการครองทองทะเล เราตองเรงการผลิตเรือประจัญบานสมัยใหมอันทรงพลังที่จะทําใหกองทัพเรือของหลายประเทศสั่นสะทานเมื่อไดเห็น"
 POR_carrier_effort: "ทุมเทใหเรือบรรทุกเครื่องบิน"
 POR_carrier_effort_desc: "ดวยภัยคุกคามที่เพิ่มขึ้นจากอากาศยานสมัยใหม เรือบรรทุกเครื่องบินจึงมีความสําคัญมากขึ้นเรื่อย ๆ ในการชวงชิงทองทะเล"
 POR_atlantic_defense_strategy: "ยุทธศาสตรปองกันแอตแลนติก"
 POR_atlantic_defense_strategy_desc: "หมูเกาะของเราซึ่งโดดเดี่ยวอยูกลางมหาสมุทรอาจถูกยึดทีละเกาะไดโดยงาย อยางไรก็ตาม ดวยการลงทุนที่เหมาะสม หมูเกาะเหลานี้จะกลายเปนเรือบรรทุกเครื่องบินที่ไมมีวันจม!"
 POR_endless_sea_desc: "ดินแดนสวนแยกของเราในเอเชียเผชิญความเปนปฏิปกษจากจักรวรรดิที่รายลอม เราตองมุงเสริมการปองกันเพื่อใหตานทานการรุกรานใด ๆ ที่อาจเกิดขึ้นได"
 POR_popular_front: "แนวรวมประชาชน"
 POR_popular_front_desc: "แนวรวมประชาชนของสเปนกําลังชี้ทาง เราตองรวมคอมมิวนิสต สังคมนิยม และอนาธิปไตยเขาเปนแนวรวมกวางขวางที่จะเปนหัวหอกในการตอตานฟาสซิสตและนําการปฏิวัติโลก"
 POR_nation_in_arms_desc: "ประชาชนโปรตุเกสตองเตรียมพรอมตอสูกับความชั่วรายของฟาสซิสตและจักรวรรดินิยม เราตองมอบอาวุธใหพวกเขาและเริ่มการฝกทางทหาร เพื่อที่เมื่อถึงเวลา ชาติของเราจะพรอมตอสู!"
 POR_unify_leftist_youth_wings: "รวมฝายเยาวชนฝายซาย"
 POR_unify_leftist_youth_wings_desc: "เราจะกอตั้งฝายเยาวชนของพรรคคอมมิวนิสตโปรตุเกส (PCP) โดยรวมองคกรที่มีอยูเขาดวยกันและเชิญชวนผูที่อาจเปนสมาชิกใหเขารวม สิ่งนี้จะสรางเวทีที่สมาชิกรุนเยาวของเราไดพบปะ ถกเถียง และกาวแรกสูกิจกรรมทางการเมืองของเรา"
 POR_nationalize_industry: "โอนอุตสาหกรรมเปนของรัฐ"
 POR_nationalize_industry_desc: "ทุนเอกชนสูบเลือดเศรษฐกิจและฉุดรั้งความกาวหนาของสังคมเรามานานเกินไปแลว เราตองกําจัดมันดวยการโอนบริษัทเอกชนเปนของรัฐ และเขาควบคุมการผลิตของโรงงานทุกแหง เพื่อประโยชนของประชาชนชาวโปรตุเกส"
 POR_reorganization_of_the_communist_party: "ปฏิรูปโครงสรางพรรคคอมมิวนิสต"
 POR_reorganization_of_the_communist_party_desc: "ในชวงระบอบเผด็จการของซาลาซาร สมาชิกพรรคของเราจํานวนมากถูกจับกุม เราจะนําพวกเขากลับมาและจัดโครงสรางพรรคใหม ใหทุกฝายงานไดรับการบริหารโดยผูที่มีคุณสมบัติดีที่สุด"
 POR_potential_civil_war_low_requirement_tt: "§Rหาก §Yเสถียรภาพ§! §Rตํ่ากวา §Y40%§R ในขณะที่แผนยุทธศาสตรนี้เสร็จสิ้น สงครามกลางเมืองจะปะทุขึ้น!§!§!§!§!"
 POR_potential_civil_war_high_requirement_tt: "§Rหาก §Yเสถียรภาพ§! §Rตํ่ากวา §Y60%§R ในขณะที่แผนยุทธศาสตรนี้เสร็จสิ้น สงครามกลางเมืองจะปะทุขึ้น!§!§!§!§!"
 POR_join_the_comintern: "เขารวมโคมินเทิรน"
 POR_join_the_comintern_desc: "สหภาพโซเวียตไดปูทางใหประเทศอื่น ๆ เดินตามแนวทางสังคมนิยม การรวมมือกับสหายโซเวียตจะเปนประโยชนตอเรา เพราะเราลวนมุงสูเปาหมายเดียวกัน"
 POR_research_collaboration: "ความรวมมือดานการวิจัย"
 POR_research_collaboration_desc: "สหายของเราในสหภาพโซเวียตมีโครงการวิจัยและพัฒนาที่ทะเยอทะยานและมีงบประมาณมหาศาล ขอตกลงแบงปนความกาวหนาทางเทคโนโลยีกับเราจะเปนประโยชนรวมกันในสงครามของชนชั้นกรรมาชีพ"
 POR_support_the_spanish_republic: "สนับสนุนสาธารณรัฐสเปน"
 POR_support_the_spanish_republic_desc: "ประชาชนชาวสเปนกําลังดิ้นรนตอสูกับรัฐประหารของฝายชาตินิยมที่จองจะยึดครองทั้งประเทศ เราตองสนับสนุนฝายสาธารณรัฐเดี๋ยวนี้ เพราะหากพวกเขาพายแพ เราจะพบศัตรูใหมที่อาจมาจออยูหนาประตูบาน"
 POR_workers_of_iberia_unite: "กรรมกรแหงไอบีเรีย จงสามัคคีกัน!"
 POR_workers_of_iberia_unite_desc: "เราตองประกาศความเปนหนึ่งเดียวของชนชั้นกรรมาชีพไอบีเรียตอตานการกดขี่ทุกรูปแบบ และรวมกับสหายชาวสเปนในสงครามกลางเมือง กลายเปนปอมปราการตอตานฟาสซิสต\nการเสียสละของเราจะไมถูกลืมเลือน เพราะเราตอสูเพื่อความยุติธรรม!"
 POR_workers_of_iberia_unite_civil_war_tt: "§Rผูสนับสนุนฝาย §Yไมฝกใฝฝายใด§! จะกอสงครามกลางเมือง§!"
 POR_the_iberian_socialist_union: "สหภาพสังคมนิยมไอบีเรีย"
 POR_the_iberian_socialist_union_desc: "การตอสูรวมกับฝายสาธารณรัฐสเปนในสงครามแสดงใหเห็นวาถึงเวลาแลวที่จะรวมคาบสมุทรไอบีเรียภายใตรัฐบาลสังคมนิยมของประชาชน\nเราจะรวมกันพิชิตศัตรูใหสิ้นซาก!"
 POR_visit_the_front: "เยือนแนวหนา"
 POR_visit_the_front_desc: "นายทหารโปรตุเกสหลายนายจะถูกสงไปเยือนแนวหนาในสเปน เพื่อตรวจสอบการใชเทคนิคใหม ๆ ของกองทัพอากาศ"
 POR_they_need_our_help: "พวกเขาตองการความชวยเหลือ"
 POR_they_need_our_help_desc: "สถานการณในสเปนวิกฤตยิ่ง เราตองลงมือเดี๋ยวนี้หากจะปองกันไมใหฝายชาตินิยมไดชัยชนะ เราจะรวมตอสูเคียงขางพี่นองชาวสเปน แลวเราจะรวมกันปราบกบฏใหได!"
 POR_intervention_in_spain: "แทรกแซงสเปน"
 POR_intervention_in_spain_desc: "แนวทางของรัฐบาลสเปนเปนสิ่งที่เรายอมรับไมได ความทะเยอทะยานของพวกเขากลายเปนภัยตออุดมการณและประชาชนของเรา เราจึงตองลงมือขจัดทาทีเปนปรปกษนี้ดวยกําลัง"
 POR_intervention_in_spain_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nไดรับเปาหมายสงคราม §Yโคนลมรัฐบาล§! ตอ [GetSpanishRepublicFlagAndNameDef]"
 POR_securing_the_free_world: "ปกปองโลกเสรี"
 POR_securing_the_free_world_desc: "หากเราจะเปนมหาอํานาจ ก็ควรเริ่มทําตัวใหสมฐานะ เราจะปกปองชาติเล็ก ๆ ที่มีอุดมการณและผลประโยชนรวมกับเราจากภัยคุกคามตางชาติใด ๆ"
 portugal_guarantees_freedom_tt: "รับประกันเอกราชของชาติเล็กที่เปนเอกราชทั้งหมดในยุโรปที่เปน §Yประชาธิปไตย§! หรือ §Yไมฝกใฝฝายใด§!"
 POR_protect_chinese_civilians: "ปกปองพลเรือนชาวจีน"
 POR_protect_chinese_civilians_desc: "รายงานการซอมรบของกองทัพตางชาติใกลดินแดนโปรตุเกสในมาเกาเริ่มสรางความหวาดหวั่นในหมูพลเรือน เราจะไมยอมใหมีภัยใดคุกคามพลเมืองหรือแผนดินของเรา เราตองลงมือเดี๋ยวนี้เพื่อชาติอันรุงโรจนของเรา!"
 POR_strict_neutrality_in_the_spanish_civil_war: "วางตัวเปนกลางอยางเครงครัดในสงครามกลางเมืองสเปน"
 POR_strict_neutrality_in_the_spanish_civil_war_desc: "สงครามกลางเมืองสเปนปะทุขึ้นแลว แตในเวลานี้เราไมอาจปลอยใหตนเองถูกลากเขาสูความขัดแยงระหวางประเทศได เราตองประกาศนโยบายเปนกลางอยางเครงครัด ขณะเสริมสรางความแข็งแกรงของชาติและปรับปรุงความสัมพันธทางการทูต"
 POR_british_investment_in_mines: "การลงทุนเหมืองแรจากอังกฤษ"
 POR_british_investment_in_mines_desc: "รัฐบาลอังกฤษแสดงความสนใจที่จะลงทุนในการแสวงประโยชนจากทรัพยากรในประเทศของเรา นี่อาจเปนโอกาสอันมีคาในการพัฒนาสิ่งอํานวยความสะดวกดานการสกัดทรัพยากรและความกาวหนาดานการวิจัยและพัฒนา"
 POR_british_industrial_investments: "การลงทุนดานอุตสาหกรรมจากอังกฤษ"
 POR_british_industrial_investments_desc: "อุตสาหกรรมพลเรือนของเราจําเปนตองขยายตัวเพื่อรองรับความตองการของเศรษฐกิจที่กําลังเติบโต รัฐบาลอังกฤษสนใจจะลงทุนใหมในประเทศของเรา ตราบใดที่เราโนมเอียงเขาหาอุดมการณของพวกเขามากขึ้น..."
 POR_allow_free_elections: "อนุญาตใหมีการเลือกตั้งเสรี"
 POR_allow_free_elections_desc: "อิทธิพลจากสหราชอาณาจักรเบงบานในโปรตุเกสในที่สุด และประชาชนของเราเรียกรองสิทธิในการเลือกรัฐบาลที่เปนตัวแทนผลประโยชนของพวกเขาไดดีที่สุด"
 POR_join_the_allies: "เขารวมฝายสัมพันธมิตร"
 POR_join_the_allies_desc: "ถึงเวลาแลวที่จะเดินตามแนวทางของประเทศประชาธิปไตยมหาอํานาจในยุโรปและรวมตอสูเคียงขางพวกเขา เราจะรวมกันยืนหยัดตานศัตรูทุกผู!"
 POR_research_sharing: "แบงปนการวิจัย"
 POR_research_sharing_desc: "พี่นองรวมรบของเราจากสหราชอาณาจักรลํ้าหนาเราไปมากในดานการวิจัยเทคโนโลยี ขอตกลงแบงปนการวิจัยจะทําใหเราแข็งแกรงขึ้น และสงผลใหพันธมิตรของเราแข็งแกรงขึ้นดวย"
 POR_oppose_germany: "ตอตานเยอรมนี"
 POR_oppose_germany_desc: "ความกาวราวของเยอรมนีเปนสิ่งที่ไมอาจทนได ทวาจนถึงบัดนี้ยังไมมีใครหยุดยั้งพวกเขาได เมื่อกองทัพของเราพรอมรบแลวในที่สุด โปรตุเกสจะเขารวมการตอสูและเผชิญหนากับทุกผูที่หมายจะพรากเสรีภาพของชาติตาง ๆ"
 POR_british_guns: "อาวุธอังกฤษ"
 POR_british_guns_desc: "อุตสาหกรรมทหารของเรายังไมพรอมผลิตอาวุธสําหรับสงครามสมัยใหม เราอาจลงนามสนธิสัญญาเพื่อซื้ออาวุธเหลานั้นจากสหราชอาณาจักร"
 POR_estado_novo_desc: "เรายึดถือหลักบรรษัทนิยมและการพึ่งพาตนเองทางเศรษฐกิจมาตั้งแตรัฐธรรมนูญป 1933 หนทางที่แนนอนที่สุดสูการเสริมสรางความแข็งแกรงของชาติคือการเนนแนวทางนี้ใหมากยิ่งขึ้น เพื่อสรางรัฐใหมที่ทรงพลังกวาเดิม"
 POR_support_the_spanish_nationalists: "สนับสนุนฝายชาตินิยมสเปน"
 POR_support_the_spanish_nationalists_desc: "เราตองแสดงการสนับสนุนตอฝายชาตินิยมสเปน ผูกําลังตอสูเพื่อเกียรติภูมิของประเทศตนตอตานภัยคอมมิวนิสตและอนาธิปไตย"
 POR_portuguese_legion: "กองทหารลีเจียนโปรตุเกส"
 POR_portuguese_legion_desc: "เพื่อรับมือกับการปะทุของสงครามกลางเมืองสเปน ตํารวจทหารถูกสงไปประจําชายแดน เราตองจัดตั้งกองกําลังอาสาสมัครผูรักชาติที่สามารถรับหนาที่รักษาความสงบแทนได"
 POR_observation_mission: "คณะผูสังเกตการณ"
 POR_observation_mission_desc: "คณะผูสังเกตการณทางทหารจะถูกสงไปยังสเปนเพื่อตรวจสอบยุทธวิธีและระบบอาวุธใหม ๆ ที่ใชในสงคราม"
 POR_send_assistance: "สงความชวยเหลือ"
 POR_send_assistance_desc: "ชะตากรรมของฝายชาตินิยมในสงครามกลางเมืองสเปนแขวนอยูบนเสนดาย เมื่อแนวรบดูเหมือนจะหยุดนิ่ง เราตองเขารวมการตอสูและชวยฝายกบฏโคนรัฐบาลสาธารณรัฐ ขจัดภัยคอมมิวนิสตในไอบีเรียใหสิ้นซาก"
 POR_nationalist_intervention: "การแทรกแซงของฝายชาตินิยม"
 POR_nationalist_intervention_desc: "ความทะเยอทะยานของรัฐบาลสเปนคุกคามผลประโยชนของเรา และเราไมอาจยอมทนได หากเพื่อนบานไมเต็มใจเขารวมแนวทางของเรา เราก็ตองบีบบังคับพวกเขาดวยวิธีที่โนมนาวไดมากกวา"
 POR_nationalist_intervention_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nไดรับเปาหมายสงคราม §Yโคนลมรัฐบาล§! ตอ [SPA.GetFlag][SPA.GetNameDefCap]"
 POR_national_syndicalism_desc: "เราจะแกไขความผิดพลาดของซาลาซารที่ยุบขบวนการสหการนิยมแหงชาติและเนรเทศฟรันซิชกู โรเลา เปรตู เราตองคืนความชอบธรรมใหขบวนการอีกครั้งและนําเปรตูกลับมา"
 POR_camisas_azuis: "กามีซัส อาซุยช"
 POR_camisas_azuis_desc: "กามีซัส อาซุยช (เสื้อนํ้าเงิน) เคยเปนกองกําลังติดอาวุธของฝายสหการนิยมแหงชาติ แตกลุมนี้ถูกประณามและยุบไปเพราะอุดมการณของพวกเขา เราตองอนุญาตใหจัดตั้งองคกรนี้ขึ้นอีกครั้ง เพราะการระดมพลเสื้อนํ้าเงินจะเปนแหลงกําลังพลอันมีคาใหกองทัพของเรา"
 POR_join_the_axis: "เขารวมฝายอักษะ"
 POR_join_the_axis_desc: "เราตองเขาขางเยอรมนีและสนับสนุนพวกเขาในความขัดแยงที่จะมาถึง เยอรมนีอาจเปนมหาอํานาจในยุโรปกลาง แตโปรตุเกสจะกลายเปนจักรวรรดิโพนทะเลที่ทรงพลังที่สุด!"
 POR_research_agreements: "ขอตกลงดานการวิจัย"
 POR_research_agreements_desc: "เราตองทําขอตกลงกับเยอรมนีเพื่อเขาถึงเทคโนโลยีทางทหารขั้นสูงของพวกเขา ซึ่งจะเรงการวิจัยของเราและทําใหเรานํายุทโธปกรณที่ดีกวาออกสูสนามรบได"
 POR_the_fifth_empire_desc: "จักรวรรดิที่หาคือการหลอมรวมขั้นสูงสุดของความรูทางปญญาและจิตวิญญาณ ศรัทธาและจักรวรรดิ มีเพียงชาติโปรตุเกสเทานั้นที่จะนําทางสูความจริงนี้ได โดยรวมโลกทั้งใบเปนหนึ่งเดียว ไมเพียงแตในดานดินแดน แตยังรวมถึงจิตวิญญาณและวัฒนธรรมดวย"
 POR_expand_the_chinese_territories: "ขยายดินแดนในจีน"
 POR_expand_the_chinese_territories_desc: "บัดนี้ชาติตาง ๆ ในเอเชียออนแอลงเพราะสงคราม ถึงเวลาแลวที่เราจะขยายดินแดนจากมาเกาเขาไปในจีน กองทัพจีนและญี่ปุนที่ออนลาจะไมอาจตานทานเราได!"
 POR_expand_the_chinese_territories_tt: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอชาติใดก็ตามที่ครอบครอง:\n[592.GetName] ([592.Owner.GetFlag]§Y[592.Owner.GetName]§!)\n[594.GetName] ([594.Owner.GetFlag]§Y[594.Owner.GetName]§!)\n[325.GetName] ([325.Owner.GetFlag]§Y[325.Owner.GetName]§!)\n[613.GetName] ([613.Owner.GetFlag]§Y[613.Owner.GetName]§!)\n[622.GetName] ([622.Owner.GetFlag]§Y[622.Owner.GetName]§!)\n[604.GetName] ([604.Owner.GetFlag]§Y[604.Owner.GetName]§!)\n[615.GetName] ([615.Owner.GetFlag]§Y[615.Owner.GetName]§!)\n[611.GetName] ([611.Owner.GetFlag]§Y[611.Owner.GetName]§!)\n[328.GetName] ([328.Owner.GetFlag]§Y[328.Owner.GetName]§!)"
 POR_deal_with_the_japanese_threat: "จัดการภัยคุกคามจากญี่ปุน"
 POR_deal_with_the_japanese_threat_desc: "กองทัพญี่ปุนกําลังคุกคามดินแดนของเราในแปซิฟก ยึดครองดินแดนแทรกใกลเคียงและตัดขาดอาณานิคมของเรา เราตองชิงลงมือกอนที่พวกเขาจะเปดฉากรุกราน ดวยการนําสงครามไปสูแผนดินแมของญี่ปุนในขณะที่พวกเขาไมทันตั้งตัว"
 POR_refuse_the_naval_blockade: "ปฏิเสธการปดลอมทางทะเล"
 POR_refuse_the_naval_blockade_desc: "เราสามารถฉวยประโยชนจากการปดลอมทางทะเลที่บังคับใชกับประเทศที่ทําสงครามกับ [ENG.GetNameDef] นักการทูตของเราจะเจรจาขอตกลงที่เปนประโยชนเพื่อใหยืมกําลังการขนสงทางเรือแกประเทศที่ตอสูกับฝาย[ENG.GetAdjective] แลกกับการสนับสนุนทางเศรษฐกิจจากพวกเขา"
 POR_mapa_cor_de_rosa: "แผนที่สีชมพู"
 POR_mapa_cor_de_rosa_desc: "ถึงเวลาแลวที่จะแกแคนความอัปยศที่เราไดรับจากคําขาดของอังกฤษในป 1890 อาณานิคมของเราในแอฟริกาตะวันตกและแอฟริกาตะวันออกจะเชื่อมตอกันในที่สุด!"
 POR_recover_the_east_indies: "ทวงคืนหมูเกาะอินเดียตะวันออก"
 POR_recover_the_east_indies_desc: "เราตองอางสิทธิ์ในสิ่งที่เปนของเราโดยชอบธรรม หมูเกาะอินเดียตะวันออกจะกลับมาอยูใตการควบคุมของโปรตุเกสอีกครั้ง"
 POR_recover_brazil: "ทวงคืนบราซิล"
 POR_recover_brazil_desc: "เพื่อฟนฟูความรุงโรจนของจักรวรรดิโปรตุเกสในอดีต เราตองมุงความสนใจไปที่อดีตอาณานิคมในทวีปอเมริกา แผนดินบราซิลเปนของโปรตุเกส ดังนั้นจะตองยึดคืนดวยกําลัง"
 POR_army_reorganization: "การปฏิรูปกองทัพ"
 POR_army_reorganization_desc: "เราจําเปนตองปฏิรูปกองทัพ ลดจํานวนนายทหารที่ลนเกินและหนวยที่ไรประสิทธิภาพ และจัดตั้งระบบเกณฑทหารที่เหมาะสม สิ่งนี้จะวางรากฐานของกองทัพสมัยใหม"
 POR_metropolitan_army: "กองทัพแผนดินแม"
 POR_metropolitan_army_desc: "ภัยรายแรงที่สุดตอโปรตุเกสคือการถูกลากเขาสูสงครามในยุโรปและแผนดินแมถูกรุกราน มีเพียงกองทัพสมัยใหมที่แข็งแกรงเทานั้นที่จะยับยั้งศัตรูของเราได!"
 POR_standardization: "การจัดมาตรฐาน"
 POR_standardization_desc: "เราจําเปนตองนําระบบมาตรฐานมาใช เพื่อใหยุทโธปกรณของเรามีความเขากันไดสูงและผลิตไดอยางมีประสิทธิภาพ"
 POR_defend_the_borders: "ปองกันชายแดน"
 POR_defend_the_borders_desc: "ภัยจากการรุกรานมีอยูเสมอ และเรามีชายแดนยาวเหยียดที่ตองปองกันทั่วดินแดนของเรา เราจําเปนตองสรางปอมปราการที่เพียงพอเพื่อตานทานการรุกรานใด ๆ ที่อาจเกิดขึ้น"
 POR_rebuild_the_lines_of_torres_vedras: "สรางแนวปองกันตอรรึช เวดรัชขึ้นใหม"
 POR_rebuild_the_lines_of_torres_vedras_desc: "นายทหารระดับสูงจํานวนหนึ่งอางวาชายแดนของเรายาวเกินกวาจะปองกันได และเสนอใหสรางแนวปองกันตอรรึช เวดรัช (Linhas de Torres Vedras) ขึ้นใหม โดยปรับปรุงปอมปราการเกาใหเหมาะกับสงครามสมัยใหม หากศัตรูตีฝาแนวของเราได เราจะถอยกลับไปยังลิสบอน ตามยุทธศาสตรเดียวกับที่เคยใชไดผลดีในการตอตานการรุกรานของฝรั่งเศสในสงครามนโปเลียน"
 POR_corpo_do_estado_maior: "กองเสนาธิการทหาร"
 POR_corpo_do_estado_maior_desc: "การปฏิรูปทางทหารไดฟนฟูกองเสนาธิการทหารบก (Corpo do Estado Maior) ขึ้นอีกครั้งในฐานะสถาบันชั้นนําสําหรับศึกษาการสงครามสมัยใหม เราตองลงทุนในสิ่งอํานวยความสะดวกใหมเพื่อเพิ่มประสิทธิภาพ"
 POR_staff_wargames: "การซอมรบบนโตะของฝายเสนาธิการ"
 POR_staff_wargames_desc: "เราตองมุงเตรียมนายทหารของเราใหสามารถใชประโยชนจากหลักนิยม การจัดระเบียบ การฝก และยุทโธปกรณสมัยใหมไดอยางเต็มที่"
 POR_a_royal_wedding: "การอภิเษกสมรสแหงราชวงศ"
 POR_a_royal_wedding_desc: "การอภิเษกสมรสระหวางดง ดูอารตึ นูนู แหงบรากังซา รัชทายาทโดยชอบธรรมแหงราชบัลลังกโปรตุเกส กับเจาหญิงมาเรีย ฟรันซิสกาแหงออรเลอ็อง พระธิดาของผูอางสิทธิ์ในราชบัลลังกบราซิล จะสรางความพอใจแกกลุมนิยมกษัตริยทั้งในโปรตุเกสและบราซิล"
 POR_the_return_of_duarte: "การเสด็จกลับของดูอารตึ"
 POR_the_return_of_duarte_desc: "การอนุญาตใหดง ดูอารตึ นูนู แหงบรากังซาเสด็จกลับโปรตุเกสจะไมเปนที่ยอมรับของฝายสาธารณรัฐ แตเปนกาวที่จําเปนสูการฟนฟูระบอบกษัตริย"
 POR_support_a_spanish_monarchy_in_the_war: "สนับสนุนฝายกษัตริยสเปนในสงคราม"
 POR_support_a_spanish_monarchy_in_the_war_desc: "ไมใชวาเราจะนิยมชมชอบฝายคารลิสตนัก แตแนนอนวาระบอบกษัตริยในสเปนยอมดีกวาการมีระบอบฟาสซิสตหรือคอมมิวนิสตอยูบนคาบสมุทรมาก เราตองเลือกสิ่งที่เลวรายนอยกวา..."
 POR_assist_the_requetes: "ชวยเหลือกองกําลังเรเกเต"
 POR_assist_the_requetes_desc: "สมาชิกกองทัพบกและกองทัพอากาศโปรตุเกสหลายนายจะถูกสงไปยังสเปนเพื่อกํากับดูแลความพยายามทางสงครามของฝายคารลิสตและใหคําปรึกษาแกผูนําของพวกเขา ระหวางนั้น พวกเขาจะรวบรวมขอมูลเกี่ยวกับยุทธวิธีการรบที่แตละฝายใชดวย"
 POR_join_the_carlist_fight: "รวมรบกับฝายคารลิสต"
 POR_join_the_carlist_fight_desc: "หนทางที่ดีที่สุดที่จะประกันชัยชนะของฝายคารลิสตในสงครามกลางเมืองสเปน คือการสูรบเคียงขางกองกําลังเรเกเตและปราบฝายอื่น ๆ ในสเปนดวยตัวเราเอง"
 POR_the_royal_iberian_alliance: "พันธมิตรราชอาณาจักรไอบีเรีย"
 POR_the_royal_iberian_alliance_desc: "เราตองแสวงหาความรวมมือจากระบอบกษัตริยสเปนเพื่อเผชิญภัยคุกคามที่มีอยูในยุโรปและที่อื่น ๆ มีเพียงความสามัคคีเทานั้นที่จะนําเราสูชัยชนะในยุคแหงความปนปวนนี้"
 POR_monarchist_uprising_in_brazil: "การลุกฮือของฝายนิยมกษัตริยในบราซิล"
 POR_monarchist_uprising_in_brazil_desc: "การโนมนาวฝายนิยมกษัตริยในบราซิลจะชวยปูทางสูการฟนฟูราชบัลลังกบราซิล เราตองทําใหแนใจวาพวกเขาจะเอาชนะฝายตอตานทั้งปวงได"
 POR_the_empire_of_brazil: "จักรวรรดิบราซิล"
 POR_the_empire_of_brazil_desc: "ทุกอยางพรอมแลวสําหรับเจาชายเปดรูที่จะอางสิทธิ์ในราชบัลลังกบราซิลและขึ้นครองราชยเปนจักรพรรดิแหงบราซิล"
 POR_the_empire_of_brazil_potential_civil_war_tt: "§Rหาก §Yบราซิล§R §Rไมได §Yไมฝกใฝฝายใด§R และมี §Yเสถียรภาพตํ่ากวา 50%§R หรือ §Yความเปนกลางตํ่ากวา 70%§R เมื่อแผนยุทธศาสตรนี้เสร็จสิ้น ฝายนิยมกษัตริยบราซิลจะกอสงครามกลางเมืองและลากเราเขาไปดวย!§!§!§!§!§!§!§!§!§!§!"
 POR_restoration_of_the_monarchy: "ฟนฟูระบอบกษัตริย"
 POR_restoration_of_the_monarchy_desc: "เราจะประกาศฟนฟูระบอบกษัตริยโปรตุเกส ภายใตการปกครองของดง ดูอารตึ นูนู แหงบรากังซา \nทรงพระเจริญ กษัตริยแหงโปรตุเกส!"
 POR_the_kingdom_reunited: "ราชอาณาจักรที่รวมเปนหนึ่งอีกครั้ง"
 POR_the_kingdom_reunited_desc: "หลังการฟนฟูราชบัลลังกโปรตุเกสและบราซิล เราตองดําเนินการรวมประเทศทั้งสองเขาดวยกันกอนที่ความทรงจําแหงการตอสูรวมกันจะเลือนหายไป \nเราจะยื่นขอเสนอตอรัฐบาลบราซิล และแจงใหชัดเจนวาหากพวกเขาไมยอมลงนามโดยสมัครใจ เราจําตองผลักดันเรื่องนี้ดวยวิธีอื่น..."
 POR_remember_olivenca: "จดจําโอลีเวนซา"
 POR_remember_olivenca_desc: "ชาวสเปนปฏิเสธอธิปไตยของเราเหนือโอลีเวนซามานานแลว บัดนี้เราจะยึดมันคืน รวมถึงดินแดนอื่น ๆ ในละแวกนั้นดวย..."
 POR_deal_with_fascism: "จัดการกับลัทธิฟาสซิสต"
 POR_deal_with_fascism_desc: "ลัทธิฟาสซิสตคือโรครายที่นําความโศกเศราและความทุกขยากมาสูมนุษยชาติ ถึงเวลาแลวที่เราจะตอตานมัน โดยโจมตีตรงไปยังตนตอ เมื่อเราไดชัยชนะ เราจะปรับเปลี่ยนโลกตามความตองการของเรา และโลกจะดีขึ้นกวาเดิม"
 POR_deal_with_fascism_tt: "ไดรับเปาหมายสงคราม §Yผนวก§! ตอชาติฟาสซิสตที่เปนมหาอํานาจหรือเปนเพื่อนบาน:"
 POR_latin_america: "ละตินอเมริกา"
 POR_latin_america_desc: "เมื่อจักรวรรดิของเรามั่นคงแลว เราสามารถหันไปมองดินแดนรอบดินแดนในทวีปอเมริกาของเรา และทวงคืนแผนดินที่จักรวรรดิบราซิลเคยครอบครอง"
 POR_the_communist_threat: "ภัยคอมมิวนิสต"
 POR_the_communist_threat_desc: "พวกคอมมิวนิสตกําลังแพรอุดมการณหลอกลวงของตนในหมูประชาชนอยางแนบเนียน ไมเพียงในโปรตุเกสแตทั่วโลก เราตองมุงกําจัดภัยระดับโลกนี้กอนที่มันจะกัดกินเราจากภายใน"
 POR_the_communist_threat_tt: "ไดรับเปาหมายสงคราม §Y[GetWargoalBasedOnGovernment]§! ตอชาติคอมมิวนิสตที่เปนมหาอํานาจหรือเปนเพื่อนบาน:"
 POR_puppet_wargoal: "รัฐหุนเชิด (แผนยุทธศาสตร)"
 POR_topple_government_wargoal: "โคนลมรัฐบาล"
 POR_annex_wargoal: "ผนวก"
 POR_promote_the_monarchist_cause_in_portugal: "สงเสริมแนวทางนิยมกษัตริยในโปรตุเกส"
 POR_promote_the_monarchist_cause_in_portugal_desc: "เราตองสนับสนุนและสงเสริมฝายนิยมกษัตริยในการเผยแพรความรูสึกนิยมกษัตริยในหมูประชาชนชาวโปรตุเกส"
 POR_kingdom_reunited_tooltip_tt: "§Y[POR.GetNameDefCap]§! และ §Y[BRA.GetNameDef]§! จะเปนที่รูจักในนาม §Yจักรวรรดิโปรตุเกสและบราซิล§!"
 POR_spr_tooltip_country_exist_tt: "[SPR.GetFlag]§Yสเปนฝายสาธารณรัฐ§! ยังคงอยู"
 POR_spr_tooltip_at_peace_tt: "อยูในสันติภาพกับ [SPR.GetFlag]§Yสเปนฝายสาธารณรัฐ§!"
 POR_fascist_portugal_joins_scw_tt: "§Yโปรตุเกสฟาสซิสต§! เขารวมกับ [SPA.GetFlag]§Y[SPA.GetNameDef]§! ในสงครามตอตาน [GetSpanishRepublicFlagAndNameDef]"
 POR_iberian_workers_effect_tooltip_tt: "[POR.GetFlag]§Y[POR.GetNameDef]§! และ [GetSpanishRepublicFlagAndNameDef] ไดรับเหตุการณ §Y'กรรมกรไอบีเรียผนึกกําลัง'§!"
 POR_spanish_republic_tt: "[GetSpanishRepublicFlagAndNameDef]:"
 POR_support_the_spanish_republic_effect_tooltip_tt: "สง §Yยุทโธปกรณทหารราบ§! จํานวน §Y2000§! ให [GetSpanishRepublicFlagAndNameDef] โดยสงของเกากอน"
 POR_Spanish_Republic_SPD: "[SPD.GetFlag]§Y[SPD.GetNameDef]§!"
 POR_Spanish_Republic_SPR: "[SPR.GetFlag]§Yสเปนฝายสาธารณรัฐ§!"
 POR_republican_spain_exists_tooltip_tt: "[SPR.GetFlag]§Yสเปนฝายสาธารณรัฐ§! ยังคงอยู"
 POR_the_iberian_socialist_union_tt: "([SPR.GetFlag]§Yสเปนฝายสาธารณรัฐ§!) ไดรับเหตุการณ §Y'สหภาพสังคมนิยมไอบีเรีย'§!"
 POR_the_iberian_socialist_union_cores_tt: "§Yสหภาพสังคมนิยมไอบีเรีย§! ไดรับดินแดนหลักทั่วทั้งไอบีเรีย หมูเกาะคานารี และหมูเกาะแบลีแอริก"
 POR_the_iberian_socialist_union_annex_puppets_tt: "รัฐหุนเชิดทั้งหมดของสเปนจะถูกผนวก"
 POR_the_iberian_socialist_union_cosmetic_name_tt: "§Yโปรตุเกส§! จะเปนที่รูจักในนาม §Yสหภาพสังคมนิยมไอบีเรีย§!"
 POR_the_popular_front_bloc: "กลุมแนวรวมประชาชน"
 POR_the_popular_front_bloc_desc: "เมื่อเราเนนยํ้าอัตลักษณไอบีเรียและสรางความมั่นคงใหชาติในฐานะ [Root.GetNameDef] แลว เราตองเผยแพรลัทธิคอมมิวนิสตไปยังตางแดน และแสวงหาพันธมิตรที่พรอมรวมอุดมการณและตอสูไปดวยกันเพื่อตอตานทรราชและการกดขี่"
 POR_the_popular_front_bloc_tt: "ไดรับเหตุการณ §Y'โปรตุเกสเชิญเราเขารวมกลุมแนวรวมประชาชน'§!"
 POR_the_popular_front_bloc_explanatory_tt: "ชาติ §Yคอมมิวนิสต§! ที่เปนเอกราชทุกชาติในยุโรปจะไดรับเหตุการณ §Y'โปรตุเกสเชิญเราเขารวมกลุมแนวรวมประชาชน'§!"
 POR_latin_american_communism: "คอมมิวนิสตละตินอเมริกา"
 POR_latin_american_communism_desc: "เราตองเขาถึงประชาชนในละตินอเมริกา ดวยการโนมนาวกลุมคอมมิวนิสตที่นั่นและสนับสนุนความพยายามในการเผยแพรแนวคิดกลุมประเทศสากลที่เปนหนึ่งเดียว เราจะวางรากฐานของพันธมิตรระหวางนักสังคมนิยมในทวีปอเมริกาและยุโรป"
 POR_our_comrades_overseas: "สหายของเราในโพนทะเล"
 POR_our_comrades_overseas_desc: "เราจะจัดการประชุมระหวางชาติละตินอเมริกาที่พรอมเปนสวนหนึ่งของกลุมเรา ถึงเวลาแลวที่จะแสดงใหโลกเห็นความเปนหนึ่งเดียวระหวางประชาชนละตินอเมริกาและไอบีเรีย"
 POR_our_comrades_overseas_tt: "ชาติ §Yคอมมิวนิสต§! ที่เปนเอกราชทุกชาติในละตินอเมริกาจะไดรับเหตุการณ §Y'โปรตุเกสเชิญเราเขารวมกลุมแนวรวมประชาชน'§!"
 POR_cooperate_with_french_militants: "รวมมือกับนักรบฝรั่งเศส"
 POR_cooperate_with_french_militants_desc: "สหายของเราในฝรั่งเศสตองการความชวยเหลืออยางยิ่งในการตอสูกับชาติฟาสซิสตที่รุกรานประเทศของพวกเขา เราตองสงอาวุธ ยุทโธปกรณ และกระสุนใหพวกเขา เพื่อใหพวกเขามีโอกาสสูได"
 POR_anti_fascism: "ตอตานฟาสซิสต"
 POR_anti_fascism_desc: "ลัทธิฟาสซิสตเปนภัยใหญหลวงตออุดมการณของเราและตองถูกจัดการ เราตองตอสูดวยทุกวิถีทางเพื่อปลดปลอยโลกจากกรงเล็บอันชั่วรายของมัน"
 POR_anti_fascism_tt: "ไดรับเปาหมายสงคราม §Yโคนลมรัฐบาล§! ตอชาติฟาสซิสตที่เปนมหาอํานาจหรือเปนเพื่อนบาน:"
 french_focus: "ผังยุทธศาสตรฝรั่งเศส"
 free_french_focus: "ผังยุทธศาสตรฝรั่งเศสเสรี"
 POR_strengthen_the_regime: "เสริมความแข็งแกรงใหระบอบ"
 POR_strengthen_the_regime_desc: "ยังมีผูเห็นตางอีกมากที่วางแผนตอตานระบอบ เราจะเสริมกําลังตํารวจลับ และมอบเครื่องมือใหพวกเขากวาดลางองคกรบอนทําลาย"
 POR_the_capital_of_espionage: "เมืองหลวงแหงการจารกรรม"
 POR_the_capital_of_espionage_desc: "ลิสบอนเต็มไปดวยสายลับและแผนสมคบคิดนับไมถวน ทั้งสายลับที่รวบรวมขอมูลการขนสงขามมหาสมุทรแอตแลนติก ผูทรยศที่รวมมือกับอดีตศัตรู และสายลับสองหนาที่สงขาวกรองเท็จใหศัตรู เราสามารถฉวยประโยชนจากสถานการณนี้ ดวยการเก็บเศษเสี้ยวขอมูลที่ไหลผานดินแดนของเรา และพัฒนาการตอตานขาวกรองของเราเอง"
 POR_appease_monarchists: "เอาใจฝายนิยมกษัตริย"
 POR_appease_monarchists_desc: "เพื่อใหไดการสนับสนุนจากกลุมนิยมกษัตริยในประเทศ เราตองดึงพวกเขาเขารวมรัฐบาลและสรางภาพวาการฟนฟูระบอบกษัตริยเปนไปไดในอนาคต การประนีประนอมเหลานี้จะมอบเสถียรภาพและการสนับสนุนที่ระบอบตองการ"
 POR_national_gold_reserves: "ทุนสํารองทองคําแหงชาติ"
 POR_national_gold_reserves_desc: "สงครามครั้งนี้มีกําไรใหเก็บเกี่ยวหากเรายังคงเปนกลาง ทั้งสองฝายตางแขงขันกันเพื่อมิตรภาพและสินคาของเรา และหากเราตอบสนองความตองการของพวกเขาได ทุนสํารองทองคําของเราจะเพิ่มขึ้นอยางมาก"
 POR_concordat_with_the_holy_see: "ความตกลงกับสันตะสํานัก"
 POR_concordat_with_the_holy_see_desc: "เราจะเจรจาขอตกลงกับวาติกัน สงเสริมบทบาททางสังคมของศาสนจักร และปองกันไมใหศาสนจักรเขามาแทรกแซงกิจการการเมืองของโปรตุเกส\n\n"พระเจา ปตุภูมิ และครอบครัว" - อันโตนียู ดึ โอลีไวรา ซาลาซาร"
 POR_honor_anglo_portuguese_alliance: "ใหเกียรติพันธมิตรอังกฤษ-โปรตุเกส"
 POR_honor_anglo_portuguese_alliance_desc: "พันธมิตรอังกฤษ-โปรตุเกสซึ่งมีมาตั้งแตคริสตศตวรรษที่ 14 เปนพันธมิตรที่เกาแกที่สุดในโลก ในหวงเวลาแหงชะตากรรมนี้ เราจะใหเกียรติสนธิสัญญานี้และชวยเหลือ [ENG.GetNameDef] ในสงคราม\nเราจะรวมกันไดรับชัยชนะ!"
 POR_proudly_alone: "โดดเดี่ยวอยางภาคภูมิ"
 POR_proudly_alone_desc: "การเขารวมสงครามอาจสงผลใหประเทศของเราถูกรุกรานและสูญเสียดินแดนโพนทะเล ยิ่งไปกวานั้น การเขาสูความขัดแยงจะบอนทําลายเสถียรภาพของคาบสมุทรไอบีเรีย และทําใหโปรตุเกสเสี่ยงตอการถูกสเปนยึดครองดวย เราตองคงความเปนกลางและรักษาความปลอดภัยของแผนดินเรา เพราะยังมีภัยอื่นซุมรออยู..."
 POR_the_eastern_menace: "ภัยคุกคามจากตะวันออก"
 POR_the_eastern_menace_desc: "ความสําเร็จของ [JAP.GetNameDef] ในจีนและเอเชียตะวันออกเฉียงใตสวนใหญมาจากสภาพอันยํ่าแยของกองทหารฝายตรงขาม เราตองปองกันไมใหสิ่งเดียวกันเกิดขึ้นกับดินแดนทางตะวันออกของเรา เราจะเสริมความแข็งแกรงใหอาณานิคมและชิงโจมตีกอนที่ฝาย[JAP.GetAdjective]จะลงมือ"
 POR_ditadura_militar: "เผด็จการทหาร"
 POR_ditadura_militar_desc: "ในที่สุดเราก็ไดรับการสนับสนุนที่จําเปนในการปลดซาลาซารออกจากอํานาจและฟนฟูระบอบเผด็จการทหาร เราจะทิ้งรัฐใหมไวเบื้องหลัง และดําเนินมาตรการที่โปรตุเกสตองการเพื่อความรุงเรืองในหวงเวลาแหงชะตากรรมนี้"
 POR_field_maneuvers: "การซอมรบภาคสนาม"
 POR_field_maneuvers_desc: "กองเสนาธิการทหาร (Corpo do Estado Maior) ไดพัฒนาการซอมรบรูปแบบใหมที่จะชวยประเมินและปรับปรุงหลักนิยมเกาแกของเรา ซึ่งเปนกาวที่จําเปนในการสรางกองทัพสมัยใหม"
 POR_tropas_paraquedistas: "หนวยพลรม"
 POR_tropas_paraquedistas_desc: "เราจะจัดตั้งหนวยจูโจมทหารราบชั้นยอดที่สามารถสงลงไปยังแนวหลังของขาศึก มอบความไดเปรียบทางยุทธวิธีอันประเมินคามิได"
 POR_regimento_de_comandos: "กรมทหารคอมมานโด"
 POR_regimento_de_comandos_desc: "เราตองการหนวยรบชั้นยอดที่ฝกมาสําหรับสถานการณการรบที่หลากหลายและปฏิบัติการไดในสภาพที่โหดรายที่สุด\n\n"โชคเขาขางผูกลา""
 FRA_laissez_faire_tt: "เศรษฐกิจของเราจะมีประสิทธิภาพมากขึ้นหลังจากผานไปประมาณสองป"
 FRA_carry_the_revolution_west_tt: "ไดรับเปาหมายสงคราม §Yโคนลมรัฐบาล§! ตอ §Yสเปน§! หรือฝายที่ไมใชคอมมิวนิสตที่ยังเหลืออยูในสงครามกลางเมืองสเปน"
 nationalist_victory: "สเปนฝายชาตินิยมชนะสงครามกลางเมืองสเปน"
 republican_victory: "สเปนฝายสาธารณรัฐชนะสงครามกลางเมืองสเปน"
