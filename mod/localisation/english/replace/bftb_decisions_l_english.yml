 GRE_attend_talks_with_the_presidium_desc: "เราจะสงผูแทนของชาติไปยังคณะเปรซิเดียมใน[FROM.GetNameDefCap] เพื่อหารือถึงศักยภาพของชาติเราและโนมนาวใหพวกเขาลงทุนเล็กนอยในอุตสาหกรรมทหารของเรา"
