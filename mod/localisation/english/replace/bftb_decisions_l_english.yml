 GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc: "[FROM.GetNameDef]ตกเปนทาสของสหภาพแรงงานมานานแลว ดังนั้นการชวยใหสหภาพแรงงานปลุกปนความไมมั่นคง จะทําใหเรามีอํานาจตอรองดีขึ้นดวยการแบล็กเมล"
