 BUL_ff_root_out_sympathizers: "ถอนรากผูเห็นใจแนวรวมปตุภูมิ"
 BUL_ff_root_out_sympathizers_desc: "ผูที่แสดงความเห็นใจแนวรวมปตุภูมิอยางเปดเผยและสนับสนุนอุดมการณของพวกเขาตองถูกไลลาและนําตัวมาลงโทษ"
 BUL_ff_massive_arrests: "การจับกุมครั้งใหญ"
 BUL_ff_massive_arrests_desc: "จําเปนตองใชมาตรการที่เด็ดขาดยิ่งขึ้นเพื่อยุติภัยคุกคามจากแนวรวมปตุภูมิ เราจะดําเนินการกวาดลางครั้งใหญ จับกุมทุกคนที่เกี่ยวของกับองคกร"
 BUL_ff_deal_the_final_blow: "ปดฉากครั้งสุดทาย"
 BUL_ff_deal_the_final_blow_desc: "เราไดบั่นทอนพวกคอมมิวนิสตจนออนแออยางหนัก และชะตากรรมของการปฏิวัติแนวรวมปตุภูมิก็แขวนอยูบนเสนดาย... เสนดายที่เราจะตัดขาดเดี๋ยวนี้!"
 BUL_ff_approaching_faction_timer_effects_tt: "กลุมการเมืองนี้จะเขารวมแนวรวมปตุภูมิ ทําใหจํานวนวันของภารกิจ§Yรัฐประหารของแนวรวมปตุภูมิใกลเขามา§!ลดลงตาม§Yความนิยมของกลุมการเมือง§! ทั้งนี้§Yความภักดีของกลุมการเมือง§!ตอรัฐบาลจะชวยลดผลนี้ลงเล็กนอย"
