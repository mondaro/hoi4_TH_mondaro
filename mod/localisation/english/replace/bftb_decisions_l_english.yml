 TUR_repeal_the_faith_tax: "ยกเลิกภาษีศาสนา"
 TUR_repeal_the_faith_tax_desc: "ภาษีที่เก็บจากสถาบันศาสนานี้ไมยั่งยืน และแมเปาหมายของเราจะสูงสง แตความจริงคือ[ROOT.GetNameDef]ยังไมพรอมสําหรับนโยบายที่รุนแรงเชนนี้ ทางเลือกที่สมเหตุสมผลคือยกเลิกภาษีนี้"
 TUR_abolish_etatism: "ยกเลิกรัฐนิยมทางเศรษฐกิจ"
 TUR_abolish_etatism_desc: "รัฐนิยมทางเศรษฐกิจคือความสําเร็จอันรุงโรจนของระบอบเคมาลและเปนการทดลองที่ใหผลดี แตนาเสียดายที่การทดลองนี้อาจตองปดฉากลงอยางถาวรเพื่อประโยชนสวนรวม"
 TUR_absorb_the_tpda: "ผนวกรวม T.P.D.A."
 TUR_absorb_the_tpda_desc: "องคการบริหารหนี้สาธารณะตุรกีฝงตัวอยูในภาคอุตสาหกรรมของเราราวกับเนื้องอก แตเราสามารถผนวกองคกรนี้กลับเขามาเปนกระบวนการระดับชาติ เพื่อขจัดองคการบริหารหนี้ซึ่งเปนอุปสรรคตอการพัฒนาตอไปของเรา"
 TUR_pay_off_our_debts: "ชําระหนี้ของเรา"
