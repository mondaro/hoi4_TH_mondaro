 BUL_uranium_concession_agreement: "ขอตกลงสัมปทานยูเรเนียมกับ[FROM.GetNameDef]"
 BUL_uranium_concession_agreement_desc: "เราไมอาจใชประโยชนจากแหลงแรยูเรเนียมในแผนดินของเราไดอยางเต็มที่ การลงนามสัญญามอบสิทธิ์การขุดคนใหแกพันธมิตรชาว[FROM.GetAdjective]เพื่อแลกกับวัตถุดิบและสินคาที่เปนประโยชนตออุตสาหกรรมและเกษตรกรรมภายในประเทศ จะเปนผลดีทั้งตอเราและตอพวกเขา"

 BUL_negotiate_claims_in_the_balkans: "เจรจาการอางสิทธิ์ของเราในคาบสมุทรบอลขาน"
 BUL_negotiate_claims_in_the_balkans_desc: "กอนจะเขาขางมหาอํานาจใด เราตองเจรจาขอเรียกรองทางดินแดนของเรากับเยอรมนีเสียกอน ความตึงเครียดระหวางประเทศกําลังทวีขึ้น และบัลแกเรียจะสนับสนุนเฉพาะชาติที่เสนอขอตกลงทางดินแดนที่ดีที่สุดเทานั้น"
 BUL_demand_our_historical_claims: "เรียกรองดินแดนทางประวัติศาสตรของเรา"
 BUL_secure_occupation_in_balkan_state: "รักษาความมั่นคงของการยึดครองใน[FROM.GetName]"
 BUL_secure_occupation_in_balkan_state_desc: "เราตองรับบทบาทผูรักษาสันติภาพในคาบสมุทรบอลขาน และเสนอใหพันธมิตรมอบอํานาจการบริหารดินแดนที่พวกเขายึดครองในภูมิภาคนี้แกเรา เพื่อปลดกองรักษาการณตางชาติของ[ROOT.GetFactionName]ใหไปเสริมกําลังในแนวรบอื่น"
 BUL_secure_occupation_in_balkan_state_tt: "(ประเทศที่มี§Yกําลังพล§!และ§Yยุทโธปกรณทหารราบ§!ตํ่าจะมีแนวโนมยอมรับมากกวา)"
 BUL_bulgarian_reintegration_campaign: "การรณรงคผนวกรวมบัลแกเรียใน[FROM.GetName]"
 bulgarian_territorial_expansion_arranged: "การขยายดินแดนของบัลแกเรียตามที่ตกลงไวลวงหนา"
 BUL_bulgarian_territorial_expansion_arranged_tt: "รัฐที่มีตัวปรับคา §Yการขยายดินแดนของบัลแกเรียตามที่ตกลงไวลวงหนา§! จะถูกโอนใหบัลแกเรียเมื่อพันธมิตรในฝายใดๆ ควบคุมรัฐนั้น และบัลแกเรียไดเขารวมฝายเดียวกับเยอรมนีแลว"

 BUL_align_bulgaria: "ดึงบัลแกเรียเขาขาง"
 BUL_align_bulgaria_desc: "ความสัมพันธทางการทูตระหวางเรากับบัลแกเรียเปนไปอยางฉันมิตรมานานหลายทศวรรษ และดวยความชวยเหลือทางการเงินของเรา รัฐบาลบัลแกเรียจึงสามารถจัดการกับหนี้สินมหาศาลได บัดนี้ถึงเวลาโนมนาวใหพวกเขาเปนพันธมิตรของ[GER.GetNameDef]อยางเปนทางการแลว"
 BUL_germany_donate_fighters: "มอบเครื่องบินขับไลใหบัลแกเรีย"
 BUL_germany_donate_fighters_desc: "เราจะมอบเครื่องบินจํานวนหนึ่งใหแกกองทัพอากาศบัลแกเรียที่เพิ่งกอตั้งขึ้นใหม"
 BUL_germany_demand_military_access: "เรียกรองสิทธิ์ผานแดนทางทหารผานบัลแกเรีย"
 BUL_germany_demand_military_access_desc: "เราตองเรียกรองสิทธิ์ผานแดนทางทหารผานบัลแกเรีย แมพวกเขาจะไมเขารวมการรุกในคาบสมุทรบอลขานกับเราก็ตาม เพื่อใหกองทัพของเราใชชายแดนบัลแกเรียเปนฐานปฏิบัติการในการบุกกรีซ"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister: "เรียกรองใหเปลี่ยนตัวนายกรัฐมนตรีบัลแกเรีย"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister_desc: "เกออรกี คีออเซอีวานอฟ นายกรัฐมนตรีบัลแกเรีย ไดพิสูจนแลววาเปนนักการเมืองที่ไรความสามารถ เราควรเสนอแนะตอ[BUL.GetLeader]ใหเปลี่ยนตัวเขาเปนผูที่มีความสามารถมากกวาและมีแนวคิดใกลชิดกับเรามากกวา เชน บอกดัน ฟลอฟ"
 BUL_donate_aircraft_tt: "หาก[BUL.GetNameDef]ยอมรับสิ่งที่เรามอบให ความเห็นที่พวกเขามีตอเราจะดีขึ้นและจะเอื้อตอความรวมมือระหวางสองประเทศ"

 BUL_the_balkan_federation_dream: "ความฝนแหงสหพันธบอลขาน"
 BUL_the_balkan_federation_dream_desc: "[ROOT.GetNameDefCap]ตองเปนหัวเรือใหญในการกอตั้งสหพันธบอลขานที่เขมแข็งเพื่อเผชิญหนากับศัตรูมากมายของชนชั้นกรรมาชีพ และทําใหชาติบอลขานทั้งหลายเขาใจวาหนทางเดียวที่จะชนะในการตอสูของเราคือการพัฒนาความรวมมือและความสมานฉันทระหวางประชาชนของเรา ซึ่งทายที่สุดจะนําไปสูการรวมบอลขานเปนหนึ่งเดียว..."
 BUL_develop_balkan_federation_project: "โครงการสหพันธบอลขาน"
 BUL_develop_balkan_federation_project_desc: "เราตองรวบรวมผูเชี่ยวชาญดานตางๆ ทั้งเศรษฐกิจ อุตสาหกรรม การเมือง และสังคม มาวิเคราะหวาเหตุใดโครงการสหพันธบอลขานจึงลมเหลวในทศวรรษ 1920 และพัฒนาโครงการใหมที่ครอบคลุมและดีกวาเดิม ซึ่งทุกชาติในบอลขานจะไดรับการปฏิบัติอยางเปนธรรมและเทาเทียม"
 BUL_balkan_federation_propaganda: "โฆษณาชวนเชื่อสหพันธบอลขาน"
 BUL_balkan_federation_propaganda_desc: "เราจะจัดการรณรงคโฆษณาชวนเชื่อครั้งใหญใน[FROM.GetNameDef] เพื่อเรียกการสนับสนุนจากมวลชนกรรมาชีพชาว[FROM.GetAdjective]ใหแกโครงการสหพันธบอลขานของเรา"
 BUL_destabilize_country: "บอนทําลายเสถียรภาพของ[FROM.GetNameDef]"
 BUL_destabilize_country_desc: "เราตองแทรกซึมสายลับชาว[ROOT.GetAdjective]เขาไปใน[FROM.GetNameDef] เพื่อรวบรวมนักเคลื่อนไหวทองถิ่นที่สนับสนุนโครงการสหพันธของเรา ใหการฝกขั้นพื้นฐาน และจัดตั้งกลุมกองโจรติดอาวุธเพื่อบอนทําลายเสถียรภาพของประเทศ"
 BUL_fight_alongside_country_comrades: "รวมรบเคียงขางสหายชาว[FROM.GetAdjective]"
 BUL_fight_alongside_country_comrades_desc: "เราตองสนับสนุนการตอสูของสหายใน[FROM.GetNameDef] และเขารวมฝายของพวกเขาในสงครามกลางเมือง[FROM.GetAdjective]"
 BUL_fight_alongside_country_comrades_join_cw_tt: "§Y[ROOT.GetNameWithFlag]§! จะเขารวมกับ §Y[FROM.GetNameWithFlag]§! ในสงครามกลางเมืองของพวกเขา"
 BUL_balkan_federation_industrial_aid: "ความชวยเหลือทางอุตสาหกรรมแก[FROM.GetNameDef]"
 BUL_balkan_federation_industrial_aid_desc: "ขณะนี้เรากําลังใหความชวยเหลือแกรัฐบาล[FROM.GetAdjective]เพื่อยกระดับอุตสาหกรรมแหงชาติที่ยังบกพรองของ[FROM.GetNameDef] กอนที่พวกเขาจะเขารวม[ROOT.GetFactionName]"
 BUL_balkan_federation_economic_aid: "ความชวยเหลือทางเศรษฐกิจแก[FROM.GetNameDef]"
 BUL_balkan_federation_economic_aid_desc: "ขณะนี้เรากําลังใหความชวยเหลือทางการเงินแกรัฐบาล[FROM.GetAdjective]เพื่อปองกันไมใหเศรษฐกิจที่ยํ่าแยของ[FROM.GetNameDef]ลมสลาย กอนที่พวกเขาจะเขารวม[ROOT.GetFactionName]"
 BUL_balkan_federation_military_aid: "ความชวยเหลือทางทหารแก[FROM.GetNameDef]"
