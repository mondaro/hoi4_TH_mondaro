 BUL_macedonian_revolutionary_organizations_desc: "[GetImroDecisionCategoryDesc]"
 BUL_macedonian_revolutionary_organizations_cooperation_desc: "เราตองแสวงหาความรวมมือจากชาวมาซิโดเนียในชวงที่บัลแกเรียอาจเขายึดครองในอนาคตอันใกล IMRO อาจกลายเปนเครื่องมือที่สมบูรณแบบในการสงเสริมความรูสึกฝกใฝบัลแกเรียในภูมิภาค ซึ่งจะเอื้อตอการผนวกมาซิโดเนียในระยะยาว"
 BUL_macedonian_revolutionary_organizations_hostile_desc: "IMRO เปนภัยรายทั่วคาบสมุทรบอลขานมานานเกินไปแลว เราตองจัดการกับเซลลที่ยังเคลื่อนไหวอยูในบัลแกเรีย จับกุมสมาชิกซึ่งดูเหมือนพวกอันธพาลมากกวานักปฏิวัติ และยุติการปกครองดวยความหวาดกลัวของพวกเขาเสียที"
 BUL_repress_imro_propaganda: "โฆษณาชวนเชื่อตอตาน IMRO"
 BUL_repress_imro_propaganda_desc: "เราจะดําเนินการรณรงคโฆษณาชวนเชื่อระดับชาติตอตาน IMRO โดยประณามองคกรนี้อยางเปดเผยผานสุนทรพจน การประชุม และการชุมนุม"
 BUL_repress_imro_persecute_activists: "ไลลานักเคลื่อนไหว IMRO"
 BUL_repress_imro_persecute_activists_desc: "เราจะไลลาและนําตัวผูปลุกปนหรือนักเคลื่อนไหวปฏิวัติทุกคนที่ปฏิบัติการภายในพรมแดนของเรามาลงโทษตามกฎหมาย"
 BUL_repress_imro_destroy_organization: "ทําลายเศษซาก IMRO"
 BUL_repress_imro_destroy_organization_desc: "เราจะดําเนินปฏิบัติการทางทหารตามแนวชายแดนมาซิโดเนียเพื่อถอนรากถอนโคน IMRO ใหสิ้นซาก"
 BUL_support_imro_make_contacts: "ติดตอกับสมาชิก IMRO"
 BUL_support_imro_make_contacts_desc: "เราจะลอบติดตอ IMRO และแจงผูนําของพวกเขาวาความรวมมือระหวางองคกรของพวกเขากับรัฐบาลบัลแกเรียจะเปนประโยชนอยางยิ่งตอทั้งสองฝาย"
 BUL_support_imro_supply_activists: "สงเสบียงใหนักเคลื่อนไหว IMRO"
 BUL_support_imro_supply_activists_desc: "เราจะจัดหาอาวุธให IMRO เพื่อใหพวกเขาแทรกซึมเขาไปในมาซิโดเนียของยูโกสลาเวียและกรีซ และบั่นทอนเสถียรภาพของภูมิภาค"
 BUL_support_imro_prepare_bulgarian_occupation: "เตรียมการยึดครองของบัลแกเรีย"
 BUL_support_imro_prepare_bulgarian_occupation_desc: "IMRO ตองจัดตั้งคณะกรรมการปฏิบัติการบัลแกเรียที่จะเขาควบคุมหนวยงานทองถิ่นทันทีหากบัลแกเรียเขายึดครองภูมิภาคนี้"
 BUL_support_imro_militias: "ผนวกกองกําลังติดอาวุธ IMRO"
 BUL_support_imro_militias_desc: "เราตองใชประโยชนจากประสบการณของนักปฏิวัติมาซิโดเนีย และจัดตั้งกองพลกองกําลังติดอาวุธ IMRO เพื่อรับใชในกองทัพของเรา"
 BUL_support_imro_garrisons: "ภารกิจรักษาการณของ IMRO"
 BUL_support_imro_garrisons_desc: "สมาชิก IMRO จะรักษาความสงบไดดีกวาในภูมิภาคของตนเอง พวกเขาจึงจะไดรับมอบหมายใหเปนกองรักษาการณในเขตยึดครองของเราทั่วมาซิโดเนีย"
 BUL_macedonian_revolutionary_organizations_foreign: "$BUL_macedonian_revolutionary_organizations$"
 BUL_macedonian_revolutionary_organizations_foreign_desc: "IMRO องคกรฝกใฝบัลแกเรียที่เปนภัยรายในคาบสมุทรบอลขานมานานเกินไป บัดนี้กําลังไดรับการสนับสนุนและติดอาวุธจากบัลแกเรีย ดวยเจตนาจะบั่นทอนเสถียรภาพของประเทศเราและเผยแพรความรูสึกฝกใฝบัลแกเรียในภูมิภาค เราตองยุติองคกรนี้และการปกครองดวยความหวาดกลัวของมันใหสิ้นซาก"
 BUL_repress_imro_foreign: "ไลลานักเคลื่อนไหว IMRO"
 BUL_repress_imro_foreign_desc: "เราจะไลลาและนําตัวผูปลุกปนหรือนักเคลื่อนไหวปฏิวัติทุกคนที่ปฏิบัติการภายในพรมแดนของเรามาลงโทษตามกฎหมาย"
 BUL_destroy_imro_foreign: "ทําลาย IMRO"
 BUL_destroy_imro_foreign_desc: "เราตองดําเนินปฏิบัติการทางทหารทั่วมาซิโดเนียเพื่อถอนรากถอนโคน IMRO ใหสิ้นซาก"
