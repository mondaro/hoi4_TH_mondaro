l_english:
 GRE_1936_election_category: "การเลือกตั้งป 1936"
 GRE_1936_election_category_desc: "การเลือกตั้งครั้งแรกนับตั้งแตพระเจาจอรจที่ 2 เสด็จกลับคืนสูราชบัลลังกมีกําหนดจัดขึ้นกอนสิ้นเดือนนี้ พระเจาจอรจที่ 2 ทรงตั้งพระทัยแนวแนวาจะไมยอมถูกบีบใหสละราชบัลลังกอีก และวากันวาทรงพรอมจะทําทุกวิถีทางเพื่อรักษาการปกครองของพระองค \n\nอยางไรก็ตาม บางสวนในกองทัพของเรายังคงแอบภักดีตอเอเลฟเทริออส เวนิเซลอส ผูลี้ภัยที่ไดรับความนิยม และพวกเขาอาจทําใหกรีซไดการเลือกตั้งที่เสรีและเปนธรรมดวยการใชวิธีการที่คอนขาง... แข็งกราว"
 GRE_the_election_of_1936: "การเลือกตั้งสมาชิกรัฐสภากรีซป 1936"
 GRE_the_election_of_1936_desc: "การเลือกตั้งครั้งแรกนับตั้งแตพระเจาจอรจที่ 2 เสด็จกลับคืนสูราชบัลลังกมีกําหนดจัดขึ้นกอนสิ้นเดือนนี้ พระเจาจอรจที่ 2 ทรงตั้งพระทัยแนวแนวาจะไมยอมถูกบีบใหสละราชบัลลังกอีก และวากันวาทรงพรอมจะทําทุกวิถีทางเพื่อรักษาการปกครองของพระองค"
 GRE_1936_election_tt: "หาก §Yพระเจาจอรจที่ 2§! ไมถูกจับกุม พระองคจะแทรกแซงการเลือกตั้งเดือนมกราคม และทําใหฝายนิยมกษัตริยยังคงครองอํานาจรัฐบาลตอไป\n"
 GRE_put_the_king_under_house_arrest: "กักบริเวณพระมหากษัตริย"
 GRE_put_the_king_under_house_arrest_desc: "หากเราหยุดพระเจาจอรจที่ 2 ไมใหแทรกแซงกระบวนการประชาธิปไตยของกรีซได ฝายเวนิเซลอสที่ไดรับความนิยมมากกวายอมชนะการเลือกตั้งอยางแนนอน"
 GRE_1936_arrest_the_king_tt: "พระมหากษัตริยจะถูกจับกุม และ§Yฝายเวนิเซลอส§!จะชนะการเลือกตั้ง\n"
 GRE_king_arrested: "พระมหากษัตริยถูกกักบริเวณ"
 GRE_civil_war_imminent: "สงครามกลางเมืองใกลปะทุ!"
