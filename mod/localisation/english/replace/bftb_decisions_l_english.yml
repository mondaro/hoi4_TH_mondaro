 BUL_the_fatherland_front_dec_cat: "แนวรวมปตุภูมิ"
 BUL_the_fatherland_front_dec_cat_desc: "[GetFfDecisionCategoryDesc]"
 BUL_the_fatherland_front_desc_planning: "ผูนําของ§Yแนวรวมปตุภูมิ§!กําลังเตรียมการกอรัฐประหาร\nในที่สุดพวกเขาจะแสวงหาการสนับสนุนจาก[GetZvenoName], [GetBsName] และ[GetBznsName]\nเราสามารถดําเนินการหลายอยางเพื่อขัดขวางการเตรียมการและบั่นทอนความพยายามโคนลมรัฐบาลของพวกเขา:\n-ถอนรากและจับกุมผูเห็นใจและผูนํา§Yแนวรวมปตุภูมิ§!\n-ทําลายหรือผนวกกลุมการเมืองใด ๆ ที่พวกเขาอาจเขาหา\n-การมี§Yการสนับสนุนคอมมิวนิสต§!นอยกวา 1 จะทําใหเราปดฉาก§Yแนวรวมปตุภูมิ§!ได"
 BUL_the_fatherland_front_desc_coup: "ผูนําของแนวรวมปตุภูมิไดวางแผนรัฐประหารแลว และกําลังรอจังหวะที่เหมาะสมจะลงมือ\nโอกาสที่รัฐประหารจะเกิดขึ้น:\nพื้นฐาน §Y10%§! [GetAtWarFfPercentage] [GetAllyAtWarFfPercentage] [GetSovNeighborFfPercentage] [GetCommunistSovFfPercentage]"
