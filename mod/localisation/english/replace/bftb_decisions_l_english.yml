 BUL_ZVENO_TOOLTIP: "£faction_bul_zveno §Yซเวโน§! เปนองคกรชาตินิยมที่กอตั้งโดยนายทหาร และปจจุบันนําโดยคีมอน เกออรกีเยฟ \n£faction_bul_zveno §Yซเวโน§! จะชักชวนนายทหารใหเขารวมองคกร และเมื่อเวลาผานไปอาจถึงขั้นพยายามรัฐประหารและสถาปนาเผด็จการทหาร"
 BUL_BS_TOOLTIP: "£faction_bul_bs §Yกลุมสังคมนิยมกวาง§! เปนพวกสังคมประชาธิปไตยที่สนับสนุนการรวมมือระหวางชนชั้นในวงกวาง \n£faction_bul_bs §Yกลุมสังคมนิยมกวาง§! มีอิทธิพลอยางมากในหมูคนงานอุตสาหกรรมและสหภาพแรงงาน และจะเรียกรองใหนัดหยุดงานทั่วไปหากไมภักดีตอรัฐบาล"
 BUL_BZNS_TOOLTIP: "£faction_bul_bzns §Yสหภาพเกษตรกร§! เปนองคกรการเมืองที่ถูกสั่งหามในป 1934 และทุมเทใหกับประเด็นดานเกษตรกรรม \n£faction_bul_bzns §Yสหภาพเกษตรกร§! มีอิทธิพลอยางมากในชนบทของประเทศ และจะพยายามเพิ่มความนิยมในหมูเกษตรกร"
 BUL_NSM_TOOLTIP: "£faction_bul_nsm §Yขบวนการสังคมแหงชาติ§! เปนองคกรขวาจัดที่นําโดยอเล็กซานดาร ซันคอฟ อดีตสมาชิกซเวโน \n£faction_bul_nsm §Yขบวนการสังคมแหงชาติ§! จะพยายามเพิ่มความนิยมในหมูมวลชนดวยการจัดการชุมนุมและการประทวงทั่วประเทศ"
 BUL_LOYALTY_TOOLTIP: "§Yความภักดี§! แสดงถึงความตองการของกลุมการเมืองที่จะรวมมือกับรัฐบาล \nยิ่ง§Yความภักดี§!สูง กลุมการเมืองก็ยิ่งมีโอกาสนอยที่จะเผชิญหนากับรัฐบาล \nกอนจะผนวกกลุมการเมืองเขาสูรัฐบาล จําเปนตองดําเนินการตัดสินใจบางอยางเพื่อใหสมาชิกของกลุมเขาขางรัฐบาล และเพิ่ม§Yความภักดี§!ใหถึง 100"
 BUL_POPULARITY_TOOLTIP: "§Yความนิยม§! แสดงถึงการสนับสนุนที่กลุมการเมืองไดรับจากประชากรบางภาคสวน (ไมวาจะเปนทหาร ชนชั้นกรรมาชีพ ชาวนา หรือพวกขวาจัด) \nยิ่ง§Yความนิยม§!สูง กลุมการเมืองก็ยิ่งมีแนวโนมจะเผชิญหนากับรัฐบาล \nกอนจะทําลายกลุมการเมือง จําเปนตองดําเนินการตัดสินใจบางอยางเพื่อบั่นทอนกลุมนั้น และลด§Yความนิยม§!ใหเหลือ 0"

