 GRE_invest_back_into_neglected_siberian_regions: "ลงทุนกลับในมณฑลไซบีเรียที่ถูกละเลย"
 GRE_invest_back_into_neglected_siberian_regions_desc: "เราจะเสนอลงทุนในภูมิภาคที่ถูกละเลยมากที่สุดของ[FROM.GetNameDefCap] เพื่อแสดงการตอบแทนซึ่งกันและกัน ซึ่งจะชวยลดอิทธิพลที่ชาว[FROM.GetAdjective]มีเหนือเรา"
