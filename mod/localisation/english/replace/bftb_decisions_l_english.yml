 BUL_the_fate_of_the_balkans_dec_cat: "ชะตากรรมแหงบอลขาน"
 BUL_the_fate_of_the_balkans_dec_cat_desc: "บัลแกเรียตกอยูใตผลประโยชนและความเอาแตใจของมหาอํานาจตางชาติมานาน... \nแตกาลเวลาเปลี่ยนไปแลว ประเทศของเราแข็งแกรงขึ้น และบัดนี้[ROOT.GetNameDef]อยูในฐานะที่จะประกาศความเปนใหญเหนือคาบสมุทรบอลขานได"
