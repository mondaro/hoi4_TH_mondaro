 BUL_internal_factions_desc: "สังคมและการเมืองบัลแกเรียแบงออกเปนหลายกลุม ซึ่งตางพยายามเอาใจรัฐบาลหรือปลุกระดมมวลชนตอตานรัฐบาล รัฐบาลบัลแกเรียตองตัดสินวากลุมใดจะรับใชผลประโยชนของตนได และกลุมใดเปนภัยคุกคามที่ตองกําจัดเพื่อประโยชนของชาติ"
