 GRE_pay_back_debt_to_the_ifc_category: "จัดการหนี้ตอ I.F.C."
 GRE_pay_back_debt_to_the_ifc_category_desc: "กรีซตองทนทุกขกับภาระหนี้สินนับตั้งแตสงครามประกาศเอกราชในป 1829 และมหาสงครามก็ไมไดชวยบรรเทาปญหาการคลังของเราเลย หากเราชําระหนี้ไดหมด ยอมชวยสรางเสถียรภาพทางเศรษฐกิจใหกรีซไดไมมากก็นอย อีกทางหนึ่ง ขบวนการหัวรุนแรงบางกลุมก็ขึ้นชื่อวาทาทายขนบทั้งทางการเมืองและเศรษฐกิจ หากเราโอนออนใหขบวนการเหลานี้ หรือเพียงปลอยใหโลกคลี่คลายไปตามกาลเวลา ทางเลือกที่รุนแรงกวาก็อาจปรากฏขึ้นมาเอง...\n\n§Yหนี้§!ตอ§Yอังกฤษ§!: [ROOT.GetDebtPercentageBritain]\n\n§Yหนี้§!ตอ§Yฝรั่งเศส§!: [ROOT.GetDebtPercentageFrance] \n\n§Yหนี้§!ตอ§Yอิตาลี§!: [ROOT.GetDebtPercentageItaly] \n\n§Yหนี้§!ที่ชําระแลวทั้งหมด: [ROOT.GetDebtPercentagePaidTotal]"
