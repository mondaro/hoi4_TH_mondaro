 move_capital_to_thessaloniki_desc: "เอเธนสคือเมืองหลวงของอารยธรรมกรีกที่หนึ่ง คอนสแตนติโนเปลคือเมืองหลวงของอารยธรรมกรีกที่สอง แตเทสซาโลนิกิ - 'เมืองหลวงรวม' ชั่วนิรันดรของประวัติศาสตรกรีก - จะเปนเมืองหลวงใหมของอารยธรรมกรีกที่สาม"
 rename_antalya: "เปลี่ยนชื่ออันทัลยา"
 rename_gjirokaster: "เปลี่ยนชื่อจีโรคัสตรา"
 GRE_appoint_aristotle_onassis_as_prime_minister: "แตงตั้งอริสโตเติล โอนาสซิสเปนนายกรัฐมนตรี"
 GRE_appoint_aristotle_onassis_as_prime_minister_desc: "อริสโตเติล โอนาสซิสมีบทบาทสําคัญยิ่งในการชวยใหความฝนของฝายเวนิเซลอสเรื่องเมกาลีไอเดียกลายเปนจริง ในฐานะพลเมือง[ROOT.GetAdjective]ที่เกิดใน[339.GetName] บางทีมหาเศรษฐีหนุมผูมีเสนหคนนี้อาจเปนผูที่จะรวมเราใหเปนชาติเดียวกัน"

 form_macedonian_empire_category: "ฟนฟูจักรวรรดิมาซิโดเนีย"
 form_macedonian_empire_category_desc: "บางคนอาจวาเปนเรื่องบาที่จะหวนกลับไปหายุคจักรวรรดิของอเล็กซานเดอรมหาราช แตเพื่อสถาปนาอารยธรรมกรีกที่สามใหมั่นคงอยางแทจริง เราตองหวนคืนสูอารยธรรมแรกอันเปนตนกําเนิดของเราโดยสมบูรณ"
 form_macedonian_empire: "เชิดชูมรดกแหงราชวงศอารกีด"
 form_macedonian_empire_desc: "ถึงเวลาที่จะรวบรวมแควนซาแทรปที่เราไดมาใหเปนอภิรัฐรวมศูนยหนึ่งเดียว ซึ่งการรวมชาตินี้จะแสดงใหโลกเห็นวากรีซไมใชชาติที่ใครจะเยยหยันหรือรังแกไดอีกตอไป แตเปนจักรวรรดิที่ตองเกรงขาม"
