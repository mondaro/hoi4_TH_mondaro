 GRE_investment_decisions_category: "แผนการลงทุน"
 GRE_investment_decisions_category_desc: "การบริหารเศรษฐกิจที่ผิดพลาดของรัฐบาลชุดกอน ๆ มาหลายทศวรรษ และการเอารัดเอาเปรียบอยางหนักจากมหาอํานาจตางชาติ ทําใหประเทศของเราขาดรากฐานอุตสาหกรรมที่แข็งแกรง ความจริงอันนาเศราคือ เพื่อจะบรรลุศักยภาพสูงสุด เราอาจตองขอความชวยเหลือจากประเทศเดียวกันกับที่ทําใหเราตกอยูในสภาพนี้ตั้งแตแรก"
 GRE_invite_politicians_for_investment_talks_in_capital: "เชิญนักการเมืองมาเจรจาการลงทุน"
 GRE_invite_politicians_for_investment_talks_in_capital_desc: "การเชิญมาเยือนชาติอันทรงเกียรติของเรา ซึ่งเราจะไดอวดศักยภาพมหาศาลของประชาชนและภาคการผลิต นาจะใหผลตอบแทนอยางงดงามหากเราติดตอถูกคน!"
 GRE_hold_national_showcase_for_investors_ger: "จัดงานแสดงศักยภาพแหงชาติใหนักลงทุน[FROM.GetAdjective]"
 GRE_hold_national_showcase_for_investors_ger_desc: "เราจะจัดงานแสดงศักยภาพอันยิ่งใหญ ณ แหลงกําเนิดอารยธรรมตะวันตกแหงนี้ ดวยความหวังวาจะดึงดูดการลงทุนเขาสูภาคอุตสาหกรรมที่ยากจนของเรา"
 GRE_exploit_errata_in_schachtplan: "ใชประโยชนจากชองโหวในแผนชัคท"
