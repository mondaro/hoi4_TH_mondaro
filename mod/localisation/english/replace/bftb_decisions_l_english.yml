 BUL_balkan_confederation_industrial_investment: "การลงทุนทางอุตสาหกรรมใน[FROM.GetNameDef]"
 BUL_balkan_confederation_industrial_investment_desc: "เพื่อแผอิทธิพลตอรัฐบาล[FROM.GetAdjective] เราจะสนับสนุนใหเจาพออุตสาหกรรมชาว[BUL.GetAdjective]ลงทุนหลายโครงการเพื่อพัฒนาบริษัทสาขา[BUL.GetAdjective]ใน[FROM.GetNameDef] ซึ่งจะชวยกระตุนอุตสาหกรรมแหงชาติของพวกเขา และในขณะเดียวกันก็เพิ่มการควบคุมของเราเหนืออุตสาหกรรมนั้นดวย"
 BUL_balkan_confederation_capital_injection: "อัดฉีดเงินทุนใน[FROM.GetNameDef]"
 BUL_balkan_confederation_capital_injection_desc: "เราจะใหการสนับสนุนทางการเงินแกบริษัท[FROM.GetAdjective]ที่กําลังประสบปญหา เพื่อสรางเสถียรภาพใหภาคการเงินของประเทศ และเพิ่มการควบคุมของ[BUL.GetAdjective]เหนือเศรษฐกิจของ[FROM.GetNameDef]"
 BUL_balkan_confederation_balkan_summit: "จัดการประชุมสุดยอดบอลขาน"
 BUL_balkan_confederation_balkan_summit_desc: "เราจะเชิญทุกชาติเสรีในคาบสมุทรบอลขานมารวมการประชุมสุดยอดบอลขาน งานนี้จะเปดโอกาสใหเราเผยแพรแนวคิดของเราอยางแนบเนียน และเพิ่มอิทธิพลของบัลแกเรียในชาติตางๆ ของภูมิภาค"
