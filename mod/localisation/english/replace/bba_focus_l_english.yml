 ITA_european_democracies_tt: "§Yประเทศในยุโรป§!จะมีแนวโนมยอมรับคําขอทางการทูตจากอิตาลีมากขึ้น"
 ITA_european_democracies_bonus_per_ally_tt: "\nไดรับเสถียรภาพ §G+2.00%§! และอํานาจทางการเมือง §G+25§! ตอประเทศประชาธิปไตยที่เปนเอกราชหนึ่งประเทศในฝายของ [ROOT.GetName] (สูงสุดเสถียรภาพ §Y+10.00%§! และอํานาจทางการเมือง §Y+125§!)\n\n"
 ITA_peace_preservation_guarantees_tt: "รับประกันเอกราชใหทุกประเทศ§Yประชาธิปไตย§!ในยุโรปที่เปนเอกราชหรือเปนพันธมิตรกับ §Y[ROOT.GetNameWithFlag]§!:"
 ITA_peace_preservation_ns_tt: "\nไดรับจิตวิญญาณแหงชาติ §Y$ITA_peace_keepers_of_europe$§! ซึ่งให (โรงงานสินคาอุปโภคบริโภค: §Y-2.0%§! ตอประเทศที่รับประกันหนึ่งประเทศ (สูงสุด §Y-10.0%§!), การสนับสนุนสงคราม: §G+1.00%§! ตอประเทศที่รับประกันหนึ่งประเทศ (สูงสุด §Y+10.00%§!), กําลังพลรายสัปดาห: §G+100§! ตอประเทศที่รับประกันหนึ่งประเทศ (สูงสุด §Y+1000§!))"
 ITA_scientific_cooperation_allies_ns_tt: "เพิ่มจิตวิญญาณแหงชาติ §Y$ITA_scientific_cooperation$§! ใหแก §Y[ROOT.GetNameDef]§! และ§Yพันธมิตร[ROOT.GetAdjective]ทุกประเทศ§!"
 ITA_secure_the_borders_forts_tt: "เพิ่ม §Y$bunker$ 2 ระดับ§! ในทุกจังหวัดที่ติดพรมแดนประเทศที่ไมเปนมิตร \nผลปจจุบัน:"
 ITA_scientific_cooperation_research_sharing_group_tt: "ทุกประเทศพันธมิตรเขารวม §Y$ITA_program_for_scientific_cooperation_name$§!"
 ITA_secure_the_borders_re_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§! \n\n"
 ITA_bring_down_fascist_strongholds_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! ไดรับเปาหมายสงครามตอประเทศฟาสซิสตใด ๆ ในยุโรป"
 ITA_reestablish_old_alliances_tt: "สงเหตุการณไปยัง §Y[ENG.GetFlag][ENG.GetNameDef]§! หรือ §Y[FRA.GetFlag][FRA.GetNameDef]§! เพื่อขอเขารวมฝายของพวกเขา \nหากประเทศที่ไดรับคําขออยูในภาวะสงคราม:"
 ITA_abolish_the_colonies_decision_effects_tt: "\nผลของการตัดสินใจภายใน [?ITA_abolish_the_colonies_days] วัน:\n"
 ITA_cooperate_with_the_mafia_dm_tt: "\nทุกรัฐที่ควบคุมอยูซึ่งมีตัวปรับคา '§Y$ITA_mafia_on_the_rise$§!':"
 ITA_is_constitutional_monarchy_tt: "เปน§Yระบอบราชาธิปไตยภายใตรัฐธรรมนูญ§!"
 ITA_is_not_constitutional_monarchy_tt: "ไมไดเปน§Yระบอบราชาธิปไตยภายใตรัฐธรรมนูญ§!"
 ITA_antifascist_civil_war_triggered_flag: "สงครามกลางเมืองตอตานฟาสซิสตของอิตาลีไดเกิดขึ้นแลว"
 ITA_production_lines_factories_tt: "เพิ่ม§Yชองสิ่งกอสราง 2 ชอง§!และ§Yโรงงานทหาร 2 แหง§! ในรัฐดินแดนหลักสูงสุดสองรัฐ"
 ITA_industrial_socialization_factories_tt: "เพิ่ม§Yชองสิ่งกอสราง 2 ชอง§!และ§Yโรงงานพลเรือน 2 แหง§! ในรัฐดินแดนหลักสูงสุดสองรัฐ \nเพิ่ม§Yชองสิ่งกอสราง 2 ชอง§!และ§Yโรงงานทหาร 2 แหง§! ในรัฐดินแดนหลักอีกสูงสุดสองรัฐ"
