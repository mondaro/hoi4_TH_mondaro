 ETH_the_heir_of_solomon: "รัชทายาทแหงโซโลมอน"
 ETH_the_heir_of_solomon_desc: "[ENG.GetName] ไดสรางถังดินปนแหงความตึงเครียดในปาเลสไตน จนแรงสนับสนุนตออาณัติการปกครองของสันนิบาตชาติที่พวกเขาถืออยูพังทลายลง บางทีพวกเขาอาจยินดีโอนการปกครองภูมิภาคนี้ใหผูอื่น? และจะมีใครเหมาะสมกับภารกิจนี้ไปกวารัชทายาทแหงโซโลมอน [ETH.GetLeader]"
