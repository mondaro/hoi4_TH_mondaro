 ETH_reintegrate_aussa_desc: "รัฐสุลตานอาวซาผูทรยศไดหักหลังเราซํ้าแลวซํ้าเลาดวยการเขาขางชาว[ITA.GetAdjective] ถึงเวลาแลวที่เราจะยุบรัฐสุลตานและผนวกภูมิภาคนี้เขากับ[ETH.GetName]"
 ETH_communist_tax_exemption_title: "สนับสนุนผูชํานาญการ"
 ETH_communist_tax_exemption_desc: "เพื่อปองกัน ‘ภาวะสมองไหล’ อยางที่สหภาพโซเวียตประสบหลังการปฏิวัติ เราตองสรางระบบภาษีที่จูงใจใหผูชํานาญการอยูใน[ETH.GetNameDef]ตอไป อยางนอยก็จนกวาเราจะสรางผูชํานาญการรุนใหมจากชนชั้นกรรมาชีพได..."
 ETH_communist_seize_assets_desc: "ขณะที่ประชาชนดิ้นรนหาเชากินคํ่า ชนชั้นนําของ[ETH.GetName]กอนการปฏิวัติกลับยักยอกทรัพยสินจํานวนมหาศาลไวในรูปของเงินตราตางประเทศ งานศิลปะ และแนนอน ที่ดิน เราตองยึดทรัพยสินเหลานี้ในนามของประชาชนและกระจายความมั่งคั่งใหม"
 ETH_communist_seize_assets_title: "ยกเลิกกรรมสิทธิ์สวนบุคคล"

 ETH_tax_exemption_default_desc: "เราตองทําใหขุนนางพอใจเพื่อปองกันไมให[ETH.GetName]แตกแยก เราจึงจะตอบแทนความภักดีอยางตอเนื่องของพวกเขาดวยการขยายการยกเวนภาษี ใหพวกเขาเก็บความมั่งคั่งไวไดมากขึ้น"
 ETH_seize_assets_default_desc: "ในฐานะที่เปนกลุมคนที่มั่งคั่งที่สุดใน[ETH.GetName] จึงไมสมเหตุสมผลทางเศรษฐกิจเลยที่ขุนนางจะหลีกเลี่ยงการเสียภาษีไดอยางอิสระผานกฎหมายโบราณและชองโหวตาง ๆ เราตองเก็บภาษีขุนนางอยางเหมาะสม และนํารายไดไปใชพัฒนาอุตสาหกรรมของจักรวรรดิตอไป"
 ETH_tax_exemption_default_title: "ขยายการยกเวนภาษี"
 ETH_seize_assets_default_title: "เก็บภาษีขุนนาง"


 # ITALY
 ITA_italian_highways_bba: "ทางหลวงอิตาลี"
 ITA_italian_highways_bba_desc: "ชาวโรมันโบราณสรางถนนที่ทั้งโลกตางอิจฉา บัดนี้พวกเยอรมันหนาใหมกลับเชื่อวาออโตบาหนของพวกเขาเหนือกวาสิ่งใดที่เราจะสรางได เราจะพิสูจนวาพวกเขาคิดผิด"
 ITA_develop_libya: "พัฒนาลิเบีย"
 ITA_develop_libya_desc: "ลิเบียคืออาณานิคมที่ใกลเราที่สุดและมีศักยภาพสูงสุด กอนที่เราจะเริ่มเก็บเกี่ยวผลตอบแทนเต็มที่จากการทํางานอยางยาวนานและหนักหนวงในการสรางความสงบในพื้นที่ เราตองปรับปรุงโครงสรางพื้นฐานของที่นั่นกอน"
 ITA_develop_eritrea: "พัฒนาเอริเทรีย"
 ITA_develop_eritrea_desc: "เอริเทรียคืออาณานิคมที่เกาแกที่สุดของเราบนทวีปแอฟริกา และเปนหนึ่งในอาณานิคมที่มีคาที่สุดอยางไมตองสงสัย ดวยทําเลยุทธศาสตรที่ยอดเยี่ยม จึงสามารถพัฒนาใหเปนเสาหลักของจักรวรรดิอาณานิคมของเราไดโดยงาย"
 ITA_develop_somaliland: "พัฒนาโซมาลิแลนด"
 ITA_develop_somaliland_desc: "เมื่อมองแวบแรก ภูมิภาคจะงอยแอฟริกาดูเหมือนไมมีศักยภาพทางเศรษฐกิจหรือยุทธศาสตรมากนัก แตดวยการลงทุนที่ถูกจุดเพียงเล็กนอย เราก็เปลี่ยนพื้นที่นี้ใหเปนฐานกระโดดสําหรับการรุกคืบสูมหาสมุทรอินเดียตอไปได"
 ITA_regional_development: "การพัฒนาภูมิภาค"
 ITA_regional_development_desc: "การลงทุนกอนหนานี้ในพื้นที่ตาง ๆ ของจักรวรรดิไดปูทางสูการเพิ่มผลผลิตทางเศรษฐกิจครั้งใหญในภูมิภาคเหลานั้น เพียงเราออกคําสั่ง ก็จะเก็บเกี่ยวผลตอบแทนไดในเวลาอันสั้น"
 ITA_ministry_of_italian_africa: "กระทรวงแอฟริกาของอิตาลี"
 ITA_ministry_of_italian_africa_desc: "ชนเผาและผูคนหลากหลายในแอฟริกาไมอาจจัดการไดเหมือนที่เราจัดการกับผูอยูใตปกครองกลุมอื่น การบริหารพื้นที่เหลานี้ตองใชแนวทางที่แตกตางออกไป"
 ITA_develop_ethiopia: "พัฒนาเอธิโอเปย"
 ITA_develop_ethiopia_desc: "ชาวเอธิโอเปยผูดื้อรั้นไดทาทายและหยามเกียรติเรามานาน บัดนี้เมื่อพวกเขาถูกปราบใหสยบไดในที่สุด เราก็สามารถพัฒนาประเทศของพวกเขา และแสดงใหเห็นวาการรุกรานของเรานั้นเพื่อประโยชนของพวกเขาเอง"
 ITA_ethiopian_railways: "การรถไฟเอธิโอเปย"
 ITA_ethiopian_railways_desc: "เครือขายทางรถไฟเอธิโอเปยที่ดอยพัฒนาฉุดรั้งการพัฒนาเศรษฐกิจของอาณานิคม ดวยการสงผูเชี่ยวชาญชาวอิตาลีไป เราจะยกระดับใหไดมาตรฐานอิตาลีอยางรวดเร็ว และทําใหรถไฟวิ่งตรงเวลาเสมอไมวาที่ใดในจักรวรรดิ"
 ITA_polizia_dell_africa_italiana: "ตํารวจแอฟริกาของอิตาลี"
 ITA_polizia_dell_africa_italiana_desc: "ตํารวจอาณานิคมของเราแสดงใหเห็นวาเปนกําลังที่มีความสามารถมาจนถึงตอนนี้ ดวยการปฏิรูปเพิ่มเติมอีกเล็กนอย จะสามารถรับประกันไดวาเราจะไดผลตอบแทนจากอาณานิคมคุมคากับที่ลงทุนไป"
 ITA_strengthen_ascari_corps: "เสริมกําลังกองทหารอัสการี"
 ITA_strengthen_ascari_corps_desc: "ทหารของเราจากดินแดนยุโรปของจักรวรรดิมักลําบากในสภาพอากาศอันโหดรายของแอฟริกา แนนอนวาชาวพื้นเมืองไมประสบปญหาเชนนั้น เราควรวาจางพวกเขาบางสวนมาสนับสนุนทหารของเราเมื่อตองรบในภูมิอากาศรอน"
 ITA_comandante_diavolo: "ผูบัญชาการปศาจ"
 ITA_comandante_diavolo_desc: "ระหวางการพิชิตเอริเทรียและสงครามในเอธิโอเปย เรามักถูกรังควานดวยความรวดเร็วและความทรหดของทหารมาพื้นเมือง เมื่อเคยตอสูกับพวกเขามาแลว เรายอมไดประโยชนมากหากดึงพวกเขามาอยูฝายเราได และนายทหารหนุมผูกลาไดกลาเสียอาจกลายเปน ‘ผูบัญชาการปศาจ’ ของเราเอง"
 ITA_prospect_for_oil: "สํารวจหานํ้ามัน"
 ITA_prospect_for_oil_desc: "นักธรณีวิทยาของเราเชื่อวาอาจมีแหลงนํ้ามันสํารองจํานวนมากหลับใหลอยูใตทะเลทรายลิเบีย เราควรสํารวจอยางละเอียดเพื่อดูวาพวกเขาคิดถูกหรือไม"
 ITA_libyan_refineries: "โรงกลั่นลิเบีย"
 ITA_libyan_refineries_desc: "เมื่อพบแหลงนํ้ามันขนาดใหญในทะเลทรายลิเบียแลว ขั้นตอไปของเราคือการเพิ่มขีดความสามารถในการกลั่นนํ้ามันในภูมิภาค"
 ITA_libyan_infrastructure_bba: "โครงสรางพื้นฐานลิเบีย"
 ITA_libyan_infrastructure_bba_desc: "ดวยความสําคัญของลิเบียในฐานะฐานปฏิบัติการในแอฟริกาเหนือ เราตองพยายามปรับปรุงโครงสรางพื้นฐานของที่นั่นอยางตอเนื่อง เพื่อใหสามารถใชกองกําลังขนาดใหญปฏิบัติการที่นั่นไดหากจําเปน"
 ITA_litoranea_balbo: "[GetAppropriateLitoraneaBalboName]"
 ITA_litoranea_balbo_default: "ทางหลวงชายฝงบัลโบ"
 ITA_litoranea_balbo_alt: "ทางหลวงชายฝงลิเบีย"
 ITA_litoranea_balbo_desc: "ถนนในลิเบียยํ่าแยอยางยิ่ง แมแตใกลชายฝง เครือขายถนนก็ไมสมกับเปนประเทศสมัยใหมเลย ยังมีงานอีกมากที่ตองทําเพื่อปรับปรุง รวมถึงทางหลวงสายใหญเลียบชายฝง"
 ITA_via_della_vittoria: "ถนนแหงชัยชนะ"
 ITA_via_della_vittoria_desc: "โครงสรางพื้นฐานที่ยํ่าแยยังคงขัดขวางปฏิบัติการของเราในแอฟริกาเหนือ การทุมเทครั้งใหญใหกับ ‘ถนนแหงชัยชนะ’ เพียงสายเดียวอาจพลิกสถานการณไดอยางมาก และทําใหเราปฏิบัติการรอบพรมแดนอียิปตไดอยางอิสระยิ่งขึ้น"
 ITA_libyan_railway: "ทางรถไฟลิเบีย"
 ITA_libyan_railway_desc: "การลงทุนในเครือขายถนนของลิเบียมีคุณคาอยางแนนอน แตสําหรับการเคลื่อนยายกําลังพล ทรัพยากร และเสบียงขนาดใหญ เครือขายทางรถไฟสมัยใหมเปนสิ่งที่ขาดไมได"
 ITA_steel_industry_in_terni: "อุตสาหกรรมเหล็กกลาในแตรนี"
 ITA_steel_industry_in_terni_desc: "โรงงานเหล็กกลาแตรนีเปนกระดูกสันหลังของการผลิตเหล็กกลาของอิตาลีมาชานาน ในสงครามที่จะมาถึง เราจะตองพึ่งพามันมากยิ่งขึ้น การลงทุนเพียงเล็กนอยในตอนนี้จะใหผลตอบแทนมหาศาลในภายหลังอยางไมตองสงสัย"
 ITA_power_plants_in_terni: "โรงไฟฟาในแตรนี"
 ITA_power_plants_in_terni_desc: "โรงไฟฟาที่มีอยูในแตรนีไมเพียงพอและตองขยาย หากเราตองการพัฒนาภูมิภาคนี้ใหเปนศูนยกลางอุตสาหกรรมที่ใหญยิ่งขึ้น"
 ITA_industria_della_gomma_sintetica: "อุตสาหกรรมยางสังเคราะห"
 ITA_industria_della_gomma_sintetica_desc: "ที่ตั้งทางภูมิศาสตรใจกลางทะเลเมดิเตอรเรเนียนทําใหเราเสี่ยงเปนพิเศษตอการถูกปดลอมโดยมหาอํานาจที่เปนปรปกษ หากเราจะครองที่อันชอบธรรมในโลก เราตองหลอเลี้ยงอุตสาหกรรมไดโดยไมตองพึ่งการนําเขาจากตางประเทศ"
 ITA_strengthen_northern_industry: "เสริมความแข็งแกรงอุตสาหกรรมภาคเหนือ"
 ITA_strengthen_northern_industry_desc: "อิตาลีตอนเหนือเปนหัวใจทางอุตสาหกรรมของประเทศเรามาชานาน ทั้งภูมิภาคมีทําเลยอดเยี่ยมที่จะเติบโตตอไปไดอีก เพียงลงทุนเวลาและทรัพยากรเล็กนอย"
 ITA_modernize_the_mezzogiorno: "ปรับปรุงเมซโซจอรโนใหทันสมัย"
 ITA_modernize_the_mezzogiorno_desc: "ภาคใตของอิตาลีเปนลูกที่สรางปญหามาตลอดนับตั้งแตเรารวมชาติ แตดวยความปรารถนาจะเปนมหาอํานาจที่ครอบงําทะเลเมดิเตอรเรเนียน ศักยภาพที่ยังไมไดใชทั้งหมดนั้นตองถูกระดมมาใช"
 ITA_new_industrialization_program: "โครงการพัฒนาอุตสาหกรรมใหม"
 ITA_new_industrialization_program_desc: "การกาวใหทันสวนอื่นของโลกตองอาศัยนวัตกรรมและการพัฒนาอยางตอเนื่อง เราไมอาจคาดหวังวาจะยังแขงขันไดหากหลงระเริงกับความสําเร็จ แตตองมุงมั่นไขวควาสิ่งที่มากกวาอยูเสมอ"
 ITA_railway_innovations: "นวัตกรรมการรถไฟ"
 ITA_railway_innovations_desc: "แมในยุคของรถยนต เครือขายทางรถไฟที่แข็งแกรงยังคงเปนกระดูกสันหลังของเศรษฐกิจที่เขมแข็ง การขยายทางรถไฟในอิตาลีเพิ่มเติมจะวางรากฐานสําหรับการเติบโตในอนาคต"
 ITA_expand_foggia_farm_fields: "ขยายไรนาฟอจจา"
 ITA_expand_foggia_farm_fields_desc: "ภูมิภาคฟอจจาเปนยุงฉางที่เลี้ยงทั้งอิตาลีมาชานาน เมื่อสงครามเริ่มขึ้น เราจะตองเกณฑชายจํานวนมากที่ทํางานในไรนาเขากองทัพ เราตองปรับปรุงการเกษตรในพื้นที่ใหทันสมัยและขยายออกไป หากตองการใหประชาชนมีอาหารเพียงพอ"
 ITA_investments_in_edison: "ลงทุนในเอดิสัน"
 ITA_investments_in_edison_desc: "อิตาลีมีโรงไฟฟาแหงแรกในยุโรป และอยูแถวหนาของเทคโนโลยีเสมอมา ดวยการลงทุนในบริษัทเอดิสัน เราจะมั่นใจไดวาเราจะยังคงเปนผูนําตอไป"
 ITA_expand_national_universities: "ขยายมหาวิทยาลัยแหงชาติ"
 ITA_expand_national_universities_desc: "สําหรับชาติที่กาวหนาทางเทคโนโลยีอยางเรา ยอมตองการวิศวกรเพิ่มขึ้นอยูเสมอ เราพบวามหาวิทยาลัยของเราคือคอขวดที่ใหญที่สุดในการผลิตผูเชี่ยวชาญรุนใหมใหมากพอจะรักษาความสามารถในการแขงขันของประเทศ"
 ITA_fiocchi_munizioni: "กระสุนฟออคคี"
 ITA_fiocchi_munizioni_desc: "ฟออคคีจัดสงกระสุนคุณภาพสูงใหกองทัพของเรามาชานาน การจัดสงกระสุนอยางสมํ่าเสมอมีความสําคัญยิ่งในสงครามที่จะมาถึง เราจึงควรทําใหมั่นใจวาโรงงานฟออคคีพรอมรับภารกิจนี้"
 ITA_brescia_small_arms_industry: "อุตสาหกรรมอาวุธเบาแหงเบรชชา"
 ITA_brescia_small_arms_industry_desc: "อาวุธเบาของอิตาลีขึ้นชื่อไปทั่วโลกในดานคุณภาพสูง แตเราก็ตองมั่นใจดวยวาเรามีอาวุธแบบทันสมัยที่สุดอยางเพียงพอ หากตองการใหทหารของเราเอาชนะขาศึกใดก็ไดในสนามรบ"
 ITA_milan_comms_industry: "อุตสาหกรรมสื่อสารแหงมิลาน"
 ITA_milan_comms_industry_desc: "สาขาใหมดานการตรวจจับและหาระยะดวยคลื่นวิทยุมีโอกาสมากมาย และจะกลายเปนดานสําคัญของเทคโนโลยีทางทหารอยางไมตองสงสัย เราตองทําใหมั่นใจวาเราจะกาวทันพัฒนาการในดานนี้"
 ITA_redirect_alfa_romeo_production: "เปลี่ยนทิศทางการผลิตของอัลฟา โรเมโอ"
 ITA_redirect_alfa_romeo_production_desc: "หลายทศวรรษที่ผานมา รถสปอรตอิตาลีอยูบนจุดสูงสุดของเทคโนโลยีอยางแทจริง แตเมื่อเมฆหมอกแหงสงครามคืบใกลเขามา ทุกคนในอิตาลีตองทําหนาที่ของตน เราไมอาจเก็บความหรูหราที่ไรประโยชนไวได และเครื่องจักรในโรงงานอัลฟา โรเมโออาจนําไปใชเพื่อการทหารไดดีกวา"
 ITA_increase_production: "เพิ่มการผลิต"
 ITA_increase_production_desc: "สงครามแบบอุตสาหกรรมตองการสิ่งเดียวเปนหลัก นั่นคือปริมาณ กระสุนปนใหญมหาศาล ปนไรเฟลมหาศาล เครื่องบินมหาศาล สิ่งที่สําคัญที่สุดคือการมีของมากกวาขาศึก"
 ITA_keep_specialization: "คงความชํานาญเฉพาะทาง"
 ITA_keep_specialization_desc: "แมสวนอื่นของโลกอาจลืมคุณคาของทักษะ ความแมนยํา และคุณภาพไปแลว แตพวกเราในอิตาลียังไมลืม ชางฝมือของเราจะใสใจรายละเอียดที่เล็กที่สุดเสมอ และสรางสรรคยุทโธปกรณทุกชิ้นที่พวกเขาทําออกมาเปนแบบอยางที่ดีที่สุดอยางไรขอกังขา"
 ITA_thermojet_research: "การวิจัยเทอรโมเจ็ต"
 ITA_thermojet_research_desc: "วิศวกรของเราเชื่อวาในอนาคต เครื่องบินจะไมถูกขับเคลื่อนดวยใบพัดหรือเครื่องยนตลูกสูบอีกตอไป แตเทคโนโลยีใหมจะทําใหเครื่องบินเร็วขึ้นมากและเปดทางใหกับการออกแบบเครื่องบินที่แตกตางไปอยางสิ้นเชิง อิตาลีตองอยูแถวหนาของการพัฒนานี้"
 ITA_army_primacy_bba: "ความเปนเลิศของกองทัพบก"
 ITA_army_primacy_bba_desc: "ทายที่สุดแลว สงครามจะชนะไดดวยการสงทหารเหยียบแผนดินขาศึกและยึดสิ่งที่ขาศึกตองใชทําสงคราม แมกองทัพเรือและกองทัพอากาศจะเปนองคกรที่มีประโยชนอยางไมตองสงสัย แตกองทัพบกคือผูที่จะเอาชนะสงคราม"
 ITA_preserve_army_traditions: "รักษาขนบของกองทัพบก"
 ITA_preserve_army_traditions_desc: "ทุกวันนี้มีแนวคิดมากมายเกี่ยวกับวิธีการทําสงครามแบบใหม แมบางแนวคิดอาจมีขอดีอยูบาง แตรากฐานของกองทัพที่ประสบความสําเร็จไมเคยเปลี่ยนแปลงนับตั้งแตสมัยซีซาร นั่นคือ วินัย ความกลาหาญของปจเจก และการนําที่มีความสามารถ"
 ITA_increase_artillery_production: "เพิ่มการผลิตปนใหญ"
 ITA_increase_artillery_production_desc: "มหาสงครามเปนสงครามของปนใหญเปนหลัก เราตองสันนิษฐานวาสงครามครั้งหนาก็จะสูรบกันดวยปนใหญเปนหลักเชนกัน เราตองไมปลอยใหตนเองลาหลังในดานนี้"
 ITA_vallo_alpino_del_littorio: "กําแพงแอลปแหงลิตตอริโอ"
 ITA_vallo_alpino_del_littorio_desc: "พรมแดนทางบกของเราเกือบทั้งหมดถูกปกคลุมดวยเทือกเขาแอลป แมภูเขาเหลานั้นจะเปนอุปสรรคที่นาเกรงขามอยูในตัว แตเราไดเรียนรูจากสงครามครั้งกอนวามันไมไดแข็งแกรงจนไมอาจผานได การสรางแนวปอมปราการหลายแหงจะชวยใหเรายึดแนวไวตานทานการรุกรานทางบกของขาศึกได"
 ITA_moschettieri_del_duce: "[GetAppropriateMoschetieridelDuceName]"
 ITA_moschettieri_del_duce_default: "ทหารปนคาบศิลาแหงดูเช"
 ITA_moschettieri_del_duce_king: "ทหารปนคาบศิลาแหงกษัตริย"
 ITA_moschettieri_del_duce_alt: "ทหารปนคาบศิลาแหงสาธารณรัฐ"
 ITA_moschettieri_del_duce_pope: "ทหารปนคาบศิลาแหงพระสันตะปาปา"
 ITA_moschettieri_del_duce_desc: "[GetAppropriateMoschetieridelDuceDesc]"
 ITA_moschettieri_del_duce_desc_default: "ดูเชมีหนวยพลแมนปนชั้นยอดอยูใตบังคับบัญชาเพื่อคุมกันตนเอง แมความปลอดภัยของดูเชยอมมีความสําคัญสูงสุด แตทหารผูเปนแบบอยางเหลานี้ยังสามารถนํามาใชฝกกําลังรบประจําการของเราใหดีขึ้น เพิ่มประสิทธิภาพในสนามรบไดดวย"
 ITA_moschettieri_del_duce_desc_king: "กษัตริยทรงมีหนวยพลแมนปนชั้นยอดอยูใตพระบังคับบัญชาเพื่อถวายอารักขา แมความปลอดภัยขององคกษัตริยยอมมีความสําคัญสูงสุด แตทหารผูเปนแบบอยางเหลานี้ยังสามารถนํามาใชฝกกําลังรบประจําการของเราใหดีขึ้น เพิ่มประสิทธิภาพในสนามรบไดดวย"
 ITA_moschettieri_del_duce_desc_pope: "องคสันตะปาปาทรงมีหนวยพลแมนปนชั้นยอดอยูใตพระบังคับบัญชาเพื่อถวายอารักขา แมความปลอดภัยของพระสันตะปาปายอมมีความสําคัญสูงสุด แตทหารผูเปนแบบอยางเหลานี้ยังสามารถนํามาใชฝกกําลังรบประจําการของเราใหดีขึ้น เพิ่มประสิทธิภาพในสนามรบไดดวย"
 ITA_moschettieri_del_duce_desc_alt: "ทหารปนคาบศิลาแหงสาธารณรัฐเปนหนวยพลแมนปนชั้นยอดที่สาบานวาจะปกปองสาธารณรัฐจากทุกภัยคุกคาม ไมวาจะมาจากภายนอกหรือภายในรัฐ ทหารผูเปนแบบอยางเหลานี้ยังสามารถนํามาใชฝกกําลังรบประจําการของเราใหดีขึ้น เพิ่มประสิทธิภาพในสนามรบไดดวย"
 ITA_a_bandits_war: "สงครามแบบโจร"
 ITA_a_bandits_war_desc: "วิธีทําสงครามแบบเกาควรจะตายไปในสนามเพลาะริมแมนํ้าอีซอนโซแลว นายพลรุนเกาบางคนของเรายังเชื่อวาสงครามสมัยใหมจะชนะไดดวยการโยนทหารจํานวนมหาศาลเขาเครื่องบดเนื้อ แตบัดนี้เรารูดีกวานั้น สงครามสมัยใหมชนะไดดวยการดําเนินกลยุทธอยางรวดเร็วและองคกรที่ยืดหยุนซึ่งตอบสนองไดฉับไว เราตองเตรียมกองทัพใหพรอมสําหรับสงครามแบบนี้"
 ITA_carica_di_isbuscenskij: "การตีโตแหงอิสบุสเชนสกี"
 ITA_carica_di_isbuscenskij_desc: "บางคนวายุคของมาและผูขี่ในสนามรบไดจบสิ้นแลว วาบทบาทของทหารมาถูกรถถังและเครื่องบินเขามาแทนที่ แตพวกเขาคิดผิด มาไมตองใชเชื้อเพลิง ไมตองมีลูกเรือภาคพื้นดิน ไมตองใชอะไหลนอกจากเกือกมาใหมเปนครั้งคราว สิ่งนี้ทําใหทหารมามีความไดเปรียบชัดเจนแมในสนามรบสมัยใหม"
 ITA_army_leaders: "ผูนํากองทัพ"
 ITA_army_leaders_desc: "กองทัพของเราตองไดรับการนําโดยนายทหารที่มีความสามารถที่สุดเสมอ เราจําเปนตองสรางนายทหารรุนใหมที่มีความสามารถอยางตอเนื่องเพื่อรักษาความไดเปรียบ"
 ITA_superesercito: "กองบัญชาการทหารบกสูงสุด"
 ITA_superesercito_desc: "การประสานกองทัพขนาดใหญไมใชเรื่องงาย เราตองสรางโครงสรางกองบัญชาการสูงสุดที่สามารถชี้นําและสนับสนุนกําลังรบในสนามได"
 ITA_italian_tankettes: "รถถังขนาดเล็กอิตาลี"
 ITA_italian_tankettes_desc: "ขณะที่ประเทศอื่นอาจพัฒนารถถังที่ใหญและหนักขึ้นเรื่อย ๆ เพื่อแสวงหาซูเปอรรถถังที่จะทําใหรถถังอื่นทั้งหมดลาสมัย เรารูดีวารถถังที่ดีที่สุดคือรถถังที่อยูในสนามรบจริง รถถังตองเร็วพอจะไปถึงทุกที่ที่ตองการไดทันเวลา และจริง ๆ แลวตองการเกราะหนาพอจะทนกระสุนไรเฟลเทานั้น ยานพาหนะเชนนี้จะมีราคาถูกและผลิตไดรวดเร็ว"
 ITA_bersaglieri: "แบรซัลเยรี"
 ITA_bersaglieri_desc: "แบรซัลเยรี ทหารราบเบาชั้นยอดของเรา ไดสรางชื่อในการรบมาชานาน แมอนาคตของการสงครามอาจเปนแบบยานยนต แตคุณภาพของทหารแตละคนยังคงเปนปจจัยชี้ขาด"
 ITA_divisioni_alpine: "กองพลอัลปเน"
 ITA_divisioni_alpine_desc: "ความทรงจําของเราเกี่ยวกับมหาสงครามจะรวมถึงการรบอันโหดรายบนเทือกเขาแอลปสูงตลอดไป หากเราตองปกปองประเทศจากการรุกรานของตางชาติอีกครั้ง มันจะมาจากทางเหนืออยางแนนอน และตองรบในภูเขาอันทุรกันดารอีก เราตองมีทหารที่สามารถรบไดอยางมีประสิทธิภาพในภูมิประเทศเชนนั้น"
 ITA_fanti_dell_aria: "ทหารราบแหงเวหา"
 ITA_fanti_dell_aria_desc: "ภาวะชะงักงันอันนองเลือดที่แนวรบอีซอนโซในมหาสงครามบีบใหเราตองบุกตะลุยเขาใสขาศึกที่เตรียมพรอมอยางดี หนทางเดียวที่จะเจาะแนวไดคือการขามดินแดนไรเจาของและยึดสนามเพลาะขาศึก เครื่องบินสมัยใหมสามารถบรรทุกทหารกลุมหนึ่งลึกเขาไปในพื้นที่สวนหลังของขาศึกไดอยางรวดเร็ว เมื่อลงดวยรมชูชีพ พวกเขาสามารถยึดเปาหมายยุทธศาสตรเพื่อทําใหแนวหนาของขาศึกระสํ่าระสาย"
 ITA_self_propelled_guns: "ปนอัตตาจร"
 ITA_self_propelled_guns_desc: "รถถังอาจปฏิวัติการสงคราม แตในหลายแงมุม ปนอัตตาจรคือยานพาหนะที่มีคาที่สุดในสนามรบ การยิงสนับสนุนจากยานพาหนะที่คอนขางถูกและเรียบงายมีคาอยางยิ่งเมื่อตองตีฝาปอมปราการหรือรบกับรถถังขาศึก"
 ITA_end_fiat_ansaldo_duopoly: "ยุติการผูกขาดคูของเฟยต-อันซัลโด"
 ITA_end_fiat_ansaldo_duopoly_desc: "ภาควิศวกรรมเครื่องกลและยานยนตของเราถูกครอบงําโดยสองบริษัทมาชานาน คือเฟยตและอันซัลโด แมทั้งสองบริษัทจะเปนบริษัทวิศวกรรมระดับโลกอยางแทจริง แตก็ทําใหการเติบโตชะงักไปบาง เพราะไมมีคูแขงรายใดอยูรอดในตลาดได เราตองทลายการผูกขาดคูนี้หากตองการภาควิศวกรรมที่แข็งแรงในระยะยาว"
 ITA_modernize_ansaldo_facilities: "ปรับปรุงโรงงานอันซัลโดใหทันสมัย"
 ITA_modernize_ansaldo_facilities_desc: "ภาวะเศรษฐกิจตกตํ่าหลังมหาสงครามทําใหอันซัลโดประสบปญหาทางการเงินจนแทบไมสามารถปรับปรุงโรงงานใหทันสมัยไดอยางเหมาะสม มีเพียงสถานะอันสูงสงที่ชวยใหรอดพนจากการลมละลาย หากเราตองการใหอันซัลโดยังคงเปนสวนสําคัญของภาควิศวกรรมเครื่องกล เราตองทําใหมั่นใจวาพวกเขาใชเครื่องจักรและเทคนิคที่ทันสมัย"
 ITA_ferrea_mole_ferreo_cuore: "รางเหล็ก ใจเหล็ก"
 ITA_ferrea_mole_ferreo_cuore_desc: "กองพลรถถังของเราจะถูกเรียกใชในปฏิบัติการทางทหารอันหาวหาญอยางไมตองสงสัย สําหรับสิ่งนี้ แคขับตัวถังเหล็กไปมาไมเพียงพอ พวกเขาตองมีหัวใจเหล็กดวย"
 ITA_air_innovations_bba: "นวัตกรรมทางอากาศ"
 ITA_air_innovations_bba_desc: "สงครามทางอากาศไดกลายเปนหนึ่งในสนามชี้ขาดของการสงครามสมัยใหม เราไมอาจปลอยใหตนเองลาหลังในดานที่สําคัญยิ่งนี้"
 ITA_citta_dell_aria: "นครแหงเวหา"
 ITA_citta_dell_aria_desc: "ความพยายามดานการวิจัยของเรากระจัดกระจายอยูในหลายพื้นที่ทั่วประเทศมานาน ทําใหขาดประสิทธิภาพอยางมาก เราควรรวมความพยายามดานการวิจัยและกอตั้ง ‘นครแหงเวหา’ ที่นักวิทยาศาสตรและวิศวกรจากหลากหลายสาขาสามารถทํางานรวมกันเพื่อสรางเครื่องบินรุนใหม"
 ITA_citta_dell_aria_tt: "หากไมมี§Yสถานที่ทดลอง§!อื่นใน §Y[2.GetName]§! เราจะไดรับ§Yสถานที่วิจัยอากาศพลศาสตรและอากาศยานอิเล็กทรอนิกส§! §G1§! แหงใน §Y[2.GetName]§!"
 ITA_expand_rome_flying_school: "ขยายโรงเรียนการบินแหงโรม"
 ITA_expand_rome_flying_school_desc: "เมื่อเครื่องบินสมัยใหมซับซอนขึ้น ความเสี่ยงที่จะเกิดอุบัติเหตุหากนักบินฝกไมเพียงพอก็เพิ่มขึ้นดวย เราตองทําใหมั่นใจวาโรงเรียนการบินของเรากาวทันพัฒนาการทางเทคนิคทั้งในดานคุณภาพการฝก และกาวทันความตองการนักบินใหมที่เพิ่มขึ้นจากการขยายกองทัพ"
 ITA_reggianes_exports: "การสงออกของเรจจาเน"
 ITA_reggianes_exports_desc: "บริษัทเรจจาเนไดพัฒนาเครื่องบินขับไลที่มีขีดความสามารถสูงหลายรุน ซึ่งดึงดูดความสนใจของกองทัพตางชาติที่ตองการปรับปรุงกองทัพอากาศใหทันสมัย หากเราอนุญาตใหพวกเขาสงออกเครื่องบิน ประสบการณจากการดัดแปลงแบบพื้นฐานใหตรงตามขอกําหนดที่แตกตางกันจะมีคามากสําหรับโครงการพัฒนาของเราเองอยางไมตองสงสัย"
 ITA_diving_bombers: "เครื่องบินทิ้งระเบิดแบบดิ่ง"
 ITA_diving_bombers_desc: "หัวขอการสนับสนุนทางอากาศโดยใกลชิดไดรับความสําคัญอยางมากในวงการทหาร แมเครื่องบินจะถูกใชทิ้งระเบิดมานานแลว แตดูเหมือนหลายประเทศเริ่มพัฒนาเครื่องบินเฉพาะทางที่สามารถทิ้งระเบิดไดแมนยําอยางไมมีใครเทียบ ดวยการดิ่งลงจากระดับสูง แมอุตสาหกรรมของเราจะผลิตเครื่องบินเชนนี้ไดในเวลาไมชา แตก็มีประเทศอื่นที่มีแบบสําหรับจุดประสงคนี้อยูแลว"
 ITA_superaereo: "กองบัญชาการทหารอากาศสูงสุด"
 ITA_superaereo_desc: "ยุคที่เครื่องบินกลุมเล็ก ๆ บินไปมาไดผานพนไปนานแลว การทัพทางอากาศสมัยใหมมีความซับซอนในหลายดานไมตางจากปฏิบัติการภาคพื้นดิน ดวยเหตุนี้ เราตองมีคณะวางแผนเฉพาะทางเพื่อประสานฝูงบินตาง ๆ ใหปฏิบัติการรวมกันจนบรรลุภารกิจ"
 ITA_officers_of_the_service_role: "นายทหารของเหลาทัพ"
 ITA_officers_of_the_service_role_desc: "การนํานายทหารจากกองทัพบกมาสอนการบินไมเพียงพออีกตอไป กองทัพอากาศของเราตองการนายทหารพันธุใหม ผูที่เติบโตและถูกหลอหลอมโดยเหลาทัพนี้ แทนที่จะเพียงยายเขามา"
 ITA_standardization: "การสรางมาตรฐาน"
 ITA_standardization_desc: "สงครามทางอากาศ ยิ่งกวาสงครามทางทะเลและทางบก คือสงครามระหวางอุตสาหกรรมกับอุตสาหกรรม ปริมาณและปริมาณเทานั้นที่ชี้ขาด เราตองทําใหมั่นใจวาเราผลิตเครื่องบินไดมากที่สุดเทาที่จะทําได แมจะหมายความวาการเปลี่ยนแบบในภายหลังจะยากขึ้นก็ตาม"
 ITA_specialization: "ความชํานาญเฉพาะทาง"
 ITA_specialization_desc: "ไมวาจะพยายามเพียงใด เราก็ไมมีวันเทียบมหาอํานาจที่ใหญกวาไดในดานปริมาณการผลิต หนทางเดียวที่เราจะแขงขันบนทองฟาไดคือการสรางเครื่องบินที่ดีกวาใคร เครื่องบินแตละลําตองสามารถชนะการตอสูไดแมจะถูกรุมดวยจํานวนสามหรือสี่ตอหนึ่ง"
 ITA_multirole_aircraft: "อากาศยานหลายบทบาท"
 ITA_multirole_aircraft_desc: "ดวยการพัฒนาโครงอากาศยานที่สามารถปฏิบัติบทบาทตาง ๆ ในการรบได เราจะลดตนทุนการผลิตและเวลาฝกลูกเรือไดอยางมาก เราจะใหวิศวกรเริ่มออกแบบโครงอากาศยานอเนกประสงคเชนนี้ทันที"
 ITA_long_range_aircraft: "อากาศยานพิสัยไกล"
 ITA_long_range_aircraft_desc: "ฐานทัพ อุตสาหกรรม และเสนทางสงกําลังบํารุงของขาศึกมักอยูลึกหลังแนวหนา เราตองพัฒนาและปรับปรุงอากาศยานพิสัยไกลเพื่อใหเขาถึงและโจมตีเปาหมายสําคัญเหลานี้ได"
 ITA_fighter_designs: "แบบเครื่องบินขับไล"
 ITA_fighter_designs_desc: "เครื่องบินขับไลคือกระดูกสันหลังของกองทัพอากาศทุกแหง เราตองทําใหมั่นใจวาเครื่องบินขับไลของเรามีศักยภาพจะสรางความเหนือกวาทางอากาศบนทองฟา และคุมกันเครื่องบินทิ้งระเบิดของเราระหวางมุงหนาสูเปาหมาย"
 ITA_bomber_designs: "แบบเครื่องบินทิ้งระเบิด"
 ITA_bomber_designs_desc: "ดวยแบบเครื่องบินทิ้งระเบิดใหม กองทัพอากาศของเราจะสามารถสนับสนุนกําลังรบทั้งทางบกและทางทะเล พรอมคุกคามกองทหารขาศึกและเสนทางสงกําลังบํารุงของพวกเขา"
 ITA_supremacy_in_the_skies: "ความเปนเจาแหงเวหา"
 ITA_supremacy_in_the_skies_desc: "กองทัพสมัยใหมไมอาจปฏิบัติการไดสําเร็จหากปราศจากการสนับสนุนของกองทัพอากาศที่ทรงพลัง เปนเรื่องสําคัญยิ่งที่ประเทศของเราตองมีอากาศยานและเทคโนโลยีลํ้าสมัยเพื่อครองนานฟา"
 ITA_naval_power_projection: "การแผแสนยานุภาพทางทะเล"
 ITA_naval_power_projection_desc: "เพื่อสืบสานมรดกของบรรพบุรุษ เราตองทําใหมั่นใจวามีอุตสาหกรรมที่จําเปนตอการพัฒนากองกําลังทางเรือที่นาเกรงขาม ซึ่งสามารถรักษาความเปนเจาของอิตาลีในทะเลเมดิเตอรเรเนียนเหนือกองทัพเรืออื่นใด"
 ITA_intensify_torpedo_manufacturing: "เรงการผลิตตอรปโด"
 ITA_intensify_torpedo_manufacturing_desc: "ตอรปโดของอิตาลีเปนหนึ่งในตอรปโดที่นาเชื่อถือที่สุดในโลก ฟอูเมคือแหลงกําเนิดของตอรปโด และดวยโรงงานที่นั่นกับโรงงานซิลูริฟชีโอ อิตาลีอาโนที่เนเปลส เราจึงมีรากฐานที่ดีในการขยายการใชอาวุธทางทะเลอันรายกาจนี้ตอไป"
 ITA_expand_naval_facilities: "ขยายสิ่งอํานวยการทางเรือ"
 ITA_expand_naval_facilities_desc: "กองทัพเรือชั้นหนึ่งไมไดตองการเพียงกองเรือรบที่แข็งแกรง แตยังตองการทาเรือและอูตอเรือเพื่อรองรับ ดวยการลงทุนในโครงสรางพื้นฐานทางเรือ กองทัพเรือของเราจะมีฐานทัพ รวมถึงขีดความสามารถในการตอและซอมเรือที่จําเปนเมื่อสงครามปะทุ"
 ITA_oto_naval_guns: "ปนเรือ OTO"
 ITA_oto_naval_guns_desc: "อิตาลีพึ่งพาบริษัทอันซัลโดและโอเดโร-แตรนี-ออรลันโดในการผลิตปนใหญขนาดใหญสําหรับเรือหลัก ดวยการลงทุนอยางตรงจุดในขีดความสามารถของพวกเขา เราจะทําใหเรือประจัญบานของเราเปนที่อิจฉาของทั้งโลก"
 ITA_improve_overseas_naval_bases: "ปรับปรุงฐานทัพเรือโพนทะเล"
 ITA_improve_overseas_naval_bases_desc: "การยกระดับทาเรือในดินแดนโพนทะเลจะเปนรากฐานที่แข็งแกรงใหกองทัพเรือของเราปกปองจักรวรรดิที่กําลังเติบโต และคุกคามเสนทางการคาของขาศึก"
 ITA_milizia_marittima_di_artiglieria: "กองกําลังอาสาปนใหญชายฝง"
 ITA_milizia_marittima_di_artiglieria_desc: "อิตาลีมีแนวชายฝงยาวไกลและทาเรือบนเกาะที่โดดเดี่ยว ซึ่งเปราะบางตอการรุกราน ดวยการปฏิรูปกองกําลังอาสาชายฝงและลงทุนในการปองกันชายฝง เราจะทําใหผูรุกรานทุกรายตองจายราคาแพง"
 ITA_supermarina: "กองบัญชาการทหารเรือสูงสุด"
 ITA_supermarina_desc: "ควรจัดตั้งศูนยปฏิบัติการสมัยใหมสําหรับผูบัญชาการทหารสูงสุดแหงราชนาวีอิตาลี เพื่อประสานปฏิบัติการของกองกําลังทางเรือทั่วทะเลเมดิเตอรเรเนียนและไกลออกไป"
 ITA_stockpile_fuel: "สํารองเชื้อเพลิง"
 ITA_stockpile_fuel_desc: "นํ้ามันคือเลือดที่ไหลเวียนในเสนเลือดของเรือรบ หากขาดนํ้ามัน กองเรือก็จะเปนอัมพาต เมื่ออิตาลีขาดแหลงนํ้ามันในประเทศที่มากพอ จึงสําคัญยิ่งที่ตองสรางถังเก็บนํ้ามันและเติมใหเต็ม เพื่อหลอเลี้ยงกําลังรบแมความขัดแยงในอนาคตจะตัดเราขาดจากการนําเขา"
 ITA_forza_navale_especiale: "กองกําลังนาวีพิเศษ"
 ITA_forza_navale_especiale_desc: "ขีดความสามารถในการยกพลขึ้นบกนาจะมีคายิ่งในความขัดแยงใด ๆ ในทะเลเมดิเตอรเรเนียน ดวยการจัดตั้งกองกําลังนาวีพิเศษที่ไดรับการฝกและติดอาวุธสําหรับปฏิบัติการสะเทินนํ้าสะเทินบก เราจะสามารถแผอํานาจจากทะเลไปยังจุดใดก็ไดตลอดแนวชายฝงเมดิเตอรเรเนียนอันยาวไกล"
 ITA_naval_air_coordination: "การประสานงานทางเรือ-อากาศ"
 ITA_naval_air_coordination_desc: "จนถึงตอนนี้ กองบัญชาการสูงสุดของกองทัพอากาศยึดถือหลักนิยมของตนเองและไมไดประสานงานกับกองทัพเรืออยางดีนัก สิ่งนี้จํากัดขีดความสามารถของราชนาวีในการลาดตระเวนอยางมีประสิทธิภาพ ดวยการพัฒนาหลักนิยมรวมทางเรือ-อากาศและปรับปรุงการสื่อสารระหวางหนวยเรือกับหนวยบินใหคลองตัว เรือของเราจะคนหาและโจมตีขาศึกไดดียิ่งขึ้น"
 ITA_decima_flottiglia_mas: "กองเรือเล็กที่สิบ MAS"
 ITA_decima_flottiglia_mas_desc: "เตเซโอ เตเซย และเอลีโอส ทอสกี แหงกรมชางนาวี ไดออกแบบตอรปโดขับเคลื่อนดวยตนเองที่ใชแทรกซึมเขาทาเรือขาศึกได ดวยการใหทุนพัฒนาอาวุธนี้และอาวุธพิเศษอื่น ๆ พรอมฝกหนวยปฏิบัติการพิเศษใหใชงาน เราอาจไดชัยชนะอันนาตื่นตะลึงและเหนือความคาดหมายเหนือขาศึก"
 ITA_incrociatori_leggeri: "เรือลาดตระเวนเบา"
 ITA_incrociatori_leggeri_desc: "เร็วและทรงพลังพอจะรับมือเรือลาดตระเวนเบาลําอื่นและกวาดลางเรือพิฆาต แตราคาถูกพอจะสรางไดจํานวนมาก เรือลาดตระเวนเบาจึงสําคัญในการปกปองเสนทางเดินเรือของเรา และในการบุกโจมตีขบวนเรือลําเลียงขาศึก ดวยการตอยอดประสบการณจากชั้นคอนดอตติเอรี มอนเตกุกโกลี และการิบัลดี เราจะสรางกองเรือลาดตระเวนที่ครองทะเลระหวางยุโรปกับแอฟริกาได"
 ITA_incrociatori_pesanti: "เรือลาดตระเวนหนัก"
 ITA_incrociatori_pesanti_desc: "ขณะนี้อิตาลียังขาดฐานอุตสาหกรรมที่จะสรางเรือประจัญบานใหมากพอจะอยูทุกที่ที่ตองการไดพรอมกัน ดวยการสรางเรือลาดตระเวนที่ทรงพลังและหุมเกราะอยางดีอยางชั้นซารา เราจะมีเรือที่จะชวงชิงการควบคุมทะเลในหลายพื้นที่ปฏิบัติการ"
 ITA_expand_naval_intelligence: "ขยายขาวกรองทางทะเล"
 ITA_expand_naval_intelligence_desc: "ขาวกรองทางสัญญาณของอิตาลีดําเนินงานดวยงบประมาณนอยนิดมาหลายป โดยพึ่งพาความสามารถอันโดดเดนของจอรโจ เวริตา โปเอตา และลุยจี โดนีนี แตก็ไปไดเพียงเทานั้น ดวยการเพิ่มบุคลากรใหพวกเขา และดึงคนเกงหนาใหมอยางเรือโทเอลีโซ ปอรโต เราจะมีโอกาสถอดรหัสของขาศึกและคนพบที่ตั้งกําลังรบของพวกเขาไดดีขึ้น"
 ITA_cooperation_programs: "โครงการความรวมมือ"
 ITA_cooperation_programs_desc: "อุตสาหกรรมตอเรือและอาวุธที่แข็งแกรงของเรามีประวัติเมื่อไมนานมานี้ในการสรางเรือรบใหชาติอื่น เชน เรือพิฆาตชั้นไฮดราของกรีซ หรือการชวยออกแบบ เชนที่ใหแกสหภาพโซเวียตสําหรับเรือโครงการ 7 การแสวงหาโอกาสในลักษณะเดียวกันจะชวยพัฒนาฐานอุตสาหกรรมของเราใหพรอมรับบททดสอบที่รออยูขางหนา"
 ITA_cruiser_submarines: "เรือดํานํ้าลาดตระเวน"
 ITA_cruiser_submarines_desc: "เพื่อโจมตีเสนทางเดินเรือของขาศึกที่อยูนอกทะเลเมดิเตอรเรเนียน เราตองมีเรือดํานํ้าพิสัยไกลที่ทองไปในมหาสมุทรได การสนับสนุนโครงการเรือดํานํ้าขนาดใหญหลังสงครามโลกครั้งที่ 1 ของเราเพิ่มเติม ซึ่งสวนใหญอิงจากงานของวิศวกรกาวัลลีนีและแบรนารดิส จะชวยใหเราบรรลุเปาหมายนี้"
 ITA_midget_submarines: "เรือดํานํ้าขนาดเล็ก"
 ITA_midget_submarines_desc: "นานนํ้าใสของทะเลเมดิเตอรเรเนียนเปนอันตรายตอเรือดํานํ้าขนาดใหญ การสรางเรือขนาดเล็ก พิสัยสั้น และตรวจจับไดยาก จะเพิ่มโอกาสรอดในสภาพแวดลอมเมดิเตอรเรเนียน และใหกําลังที่เราตองการในการลาดตระเวนจุดคอขวดสําคัญอยางชองแคบซิซิลี"
 ITA_cacciatorpediniere_di_scorta: "เรือพิฆาตคุมกัน"
 ITA_cacciatorpediniere_di_scorta_desc: "หนึ่งในภารกิจหลักของ[GetAppropriateRegiaMarinaNsName]คือการปกปองเสนทางเดินเรือระหวางอิตาลี แอฟริกาเหนือ และหมูเกาะเมดิเตอรเรเนียนของเรา ดวยการสรางเรือพิฆาตขนาดเล็กที่เนนการปราบเรือดํานํ้าและฝกลูกเรืออยางมีประสิทธิภาพ เราจะรักษาการลําเลียงเสบียงไปยังกําลังรบโพนทะเลไดดียิ่งขึ้น"
 ITA_ispettorato_dei_mezzi_antisommergibili: "สํานักตรวจการยุทโธปกรณปราบเรือดํานํ้า"
 ITA_ispettorato_dei_mezzi_antisommergibili_desc: "การจัดตั้งมาเรียนติซอมเปนกองบัญชาการสงครามปราบเรือดํานํ้า จะเพิ่มขีดความสามารถดานองคกรในการประสานเรือคุมกันของเรา และผลักดันนวัตกรรมทางเทคโนโลยีเพื่อใหเราไดเปรียบในการรบกับเรือดํานํ้าขาศึก"
 ITA_navi_da_battaglia: "เรือประจัญบาน"
 ITA_navi_da_battaglia_desc: "เรือประจัญบานชั้นลิตตอริโอเปนตัวอยางของเรือหลักที่ทั้งเร็วและทรงพลัง การสรางเรือเหลานี้เพิ่มและปรับปรุงหลักนิยมใหใชงานไดอยางมีประสิทธิภาพยิ่งขึ้น จะยกระดับแนวรบทางเรือของเราอยางมาก"
 ITA_proper_carriers: "เรือบรรทุกเครื่องบินที่แทจริง"
 ITA_proper_carriers_desc: "นักออกแบบหัวกาวหนาอยางลุยจี กัญโญตโต ไดสรางแบบเรือบรรทุกเครื่องบินประจํากองเรือมาตลอดทศวรรษที่ผานมา ดวยการใชความเชี่ยวชาญนี้รวมกับตัวเรือของเรือโดยสารความเร็วสูงโรมาที่มีอยู (แตติดเครื่องยนตใหมที่ทรงพลังกวา) เราจะไดเรือบรรทุกเครื่องบินที่พรอมปฏิบัติการเร็วกวาการสรางใหมตั้งแตกระดูกงู"
 ITA_refit_civilian_ships: "ดัดแปลงเรือพลเรือน"
 ITA_refit_civilian_ships_desc: "แมเรือบรรทุกเครื่องบินประจํากองเรือที่แทจริงจะมีขีดความสามารถสูงกวามาก แตหากเราตองการเรือบรรทุกเครื่องบินอยางรวดเร็วก็ตองยอมลดบางอยางลง ดวยการดัดแปลงเรือโดยสารที่มีอยูอยางเร็กซและกอนเต ดี ซาวอยา เราจะไดการคุมกันทางอากาศใหกองเรืออยางรวดเร็ว"
 ITA_flotta_d_evasione: "กองเรือฝาวงลอม"
 ITA_flotta_d_evasione_desc: "อิตาลีพอใจที่จะจํากัดความทะเยอทะยานทางทะเลไวแคทะเลเมดิเตอรเรเนียนและทะเลแดงมานานเกินไปแลว ดวยการทุมเทใหกับ ‘กองเรือฝาวงลอม’ และสรางเรือที่ออกแบบมาสําหรับมหาสมุทรแอตแลนติกและมหาสมุทรอินเดีย เราจะสามารถแผอิทธิพลไปทั่วมหาสมุทรของโลก"

 ITA_ethiopian_war_logistics_bba: "การสงกําลังบํารุงในสงครามเอธิโอเปย"
 ITA_ethiopian_war_logistics_bba_desc: "จากความคืบหนาที่ไมมีเลยในเอธิโอเปย เห็นไดชัดขึ้นเรื่อย ๆ วาเราประเมินปริมาณเสบียงที่กองทัพสมัยใหมตองการตํ่าเกินไป เราตองทุมเทปรับปรุงถนนและทาเรือในดินแดนของเราในแอฟริกาตะวันออก เพื่อใหเสบียงที่จําเปนไปถึงแนวหนาได"
 ITA_the_abyssinian_fiasco: "ความลมเหลวในอะบิสซิเนีย"
 ITA_the_abyssinian_fiasco_desc: "การรุกรานเอธิโอเปยของเรากลายเปนหายนะ อีกครั้งที่เราตองเผชิญภาพอันนาอัปยศของกองทัพอิตาลีที่ไมอาจเอาชนะกองทัพเอธิโอเปยได เชนเดียวกับบรรพบุรุษของเราที่อัดวา เราพายแพแลว เราไดแตคาดเดาวาความพายแพขนาดนี้จะมีความหมายอยางไรตออนาคตของระบอบฟาสซิสตในอิตาลี"
 ITA_solid_progress: "ความคืบหนาอยางมั่นคง"
 ITA_solid_progress_desc: "เรามีความคืบหนาอยางตอเนื่องในเอธิโอเปย โดยไมขยายแนวรบเกินกําลังหรือเปดชองใหกําลังรบของเราถูกตีโตจากเอธิโอเปย แมยังไมไดชัยชนะ แตก็เปนเพียงเรื่องของเวลาเทานั้น"
 ITA_struggle_in_ethiopia: "การดิ้นรนในเอธิโอเปย"
 ITA_struggle_in_ethiopia_desc: "ความคืบหนาของเราในเอธิโอเปยลาชากวากําหนดมาก แตเราไมอาจปลอยใหอุปสรรคเล็กนอยเชนนี้บั่นทอนขวัญกําลังใจ กองทัพอิตาลีและระบอบฟาสซิสตจะไดชัยชนะ ไมวาตองแลกดวยอะไรก็ตาม"
 ITA_undermine_the_duce: "บอนทําลายดูเช"
 ITA_undermine_the_duce_desc: "ความปรารถนาอันบาคลั่งของมุสโสลินีที่จะพิชิตเอธิโอเปยไดนําเรามาสูขอบเหวแหงความพายแพอีกครั้ง แมชัยชนะยังเปนไปไดอยางแนนอน แตตองเปนที่ชัดเจนวาชัยชนะครั้งนี้จะไมใชของมุสโสลินี"
 ITA_conspiracies_in_the_shadows: "การสมคบคิดในเงามืด"
 ITA_conspiracies_in_the_shadows_desc: "เสียงกระซิบในโถงแหงอํานาจแสดงความไมพอใจตอมุสโสลินีมากขึ้นเรื่อย ๆ แผนสมคบคิดถูกถักทอ และพันธมิตรกอตัวขึ้นระหวางผูคนที่ปกติแทบไมมีอะไรเหมือนกัน เวลาแหงการเปลี่ยนแปลงกําลังใกลเขามาอยางรวดเร็ว"
 ITA_servizio_informazione_militare: "หนวยขาวกรองทหาร"
 ITA_servizio_informazione_militare_desc: "กองทัพของเราตองการขอมูลที่แมนยําเพื่อวางแผนปฏิบัติการ ดวยเหตุนี้ เราจึงตองมีองคกรกลางที่รวบรวมและวิเคราะหขอมูลเหลานี้ รวมถึงปฏิบัติการเชิงรุกตอเปาหมายที่เลือกไวหากจําเปน"
 ITA_triumph_in_africa_bba: "ชัยชนะในแอฟริกา"
 ITA_triumph_in_africa_bba_desc: "ความอัปยศแหงอัดวาถูกลบลางแลว ราว 40 ปหลังความอัปยศที่เราไดรับจากนํ้ามือชาวเอธิโอเปย ในที่สุดเราก็ไดแกแคน กําลังรบของเราพิสูจนความสามารถอยางไรขอสงสัย และทั้งโลกตองยอมรับในแสนยานุภาพของเรา!"
 ITA_defeat_in_ethiopia_flag: "[ITA.GetNameDefCap]พายแพใน[ETH.GetNameDef]"
 ITA_devaluate_the_lire: "ลดคาเงินลีรา"
 ITA_devaluate_the_lire_desc: "สงครามมีคาใชจายสูงกวาที่เราตองการมาก เศรษฐกิจของเราดิ้นรนภายใตผลกระทบที่ตามมา การลดคาเงินจะทําใหสินคาของเราแขงขันในตลาดโลกไดมากขึ้น แตจะทําใหชีวิตของชาวอิตาลีทั่วไปลําบากขึ้นเล็กนอย เปนการเสียสละที่จําเปนซึ่งพวกเขาจะยินดีทํา"
 ITA_anglo_italian_agreements: "ขอตกลงอังกฤษ-อิตาลี"
 ITA_anglo_italian_agreements_desc: "ดวยความเปนจริงใหมในแอฟริกาตะวันออก มหาอํานาจอาณานิคมอื่น ๆ ตองยอมรับเรา เราตองการใหพวกเขาอนุญาตใหเราผานคลองสุเอซ แตพวกเขาตองการเรามากกวานั้นมาก หากพวกเขาปฏิเสธ เราอาจตองหันไปหาการสนับสนุนจากที่อื่น"
 ITA_topple_amhara_rulers: "โคนลมผูปกครองอัมฮารา"
 ITA_topple_amhara_rulers_desc: "เอธิโอเปยเปนประเทศที่หลากหลายและแตกแยกมากกวาที่คนสวนใหญเชื่อ มีหลายกลุมที่ไมไดสนับสนุนระบอบเอธิโอเปยเกาอยางแข็งขัน การใหสัมปทานเล็กนอยแกพวกเขาจะดึงพวกเขามาเขาขางเราไดงาย ทําใหการสรางความสงบในภูมิภาคงายขึ้นมาก"
 ITA_the_new_emperor_of_ethiopia: "จักรพรรดิองคใหมแหงเอธิโอเปย"
 ITA_the_new_emperor_of_ethiopia_desc: "ประชาชนเอธิโอเปยอาศัยอยูภายใตจักรพรรดิมานานหลายศตวรรษ ภารกิจของเราจะงายขึ้นมากอยางไมตองสงสัย หากเราเพียงมอบจักรพรรดิองคใหมใหแทนองคเกา ดวยการสวมมงกุฎใหกษัตริยของเราเปนจักรพรรดิองคใหม"
 ITA_ministero_della_cultura_popolare: "กระทรวงวัฒนธรรมประชาชน"
 ITA_ministero_della_cultura_popolare_desc: "ประชาชนของเราตองเขาถึงขอมูลที่ถูกตองไดเสมอ ในยามสงคราม สายลับของขาศึกสามารถแพรขอมูลเท็จไดงาย และเราตองตอบโตดวยการมอบเหตุการณฉบับที่เปนจริงแทใหประชาชน"
 ITA_culto_del_duce: "ลัทธิบูชาดูเช"
 ITA_culto_del_duce_desc: "เบนิโต มุสโสลินี ผูพิชิตแอฟริกา ผูลางแคนแหงอัดวา คือรัฐบุรุษอิตาลีที่สําคัญที่สุดนับตั้งแตสมัยจักรพรรดิโรมันอยางไมตองสงสัย เขาคือจุดสูงสุดแหงความเปนชายชาตรี ปราศจากความกลัวโดยสิ้นเชิง เราควรทําใหชาวอิตาลีทุกคนรูวาพวกเขาควรมุงมั่นตลอดไปที่จะเปนเหมือนมุสโสลินีใหมากที่สุดเทาที่มนุษยจะทําได"
 ITA_devotion: "ความภักดีอยางสุดใจ"
 ITA_devotion_desc: "ประชาชนอิตาลีเปนหนี้บุญคุณมุสโสลินีอยางมหาศาล ดวยพลังใจอันแรงกลาลวน ๆ เขาไดทําใหพวกเขาดีขึ้นในทุกดานที่มีความหมาย พวกเขากลาหาญขึ้น มั่งคั่งขึ้น และมีศีลธรรมสมบูรณขึ้น สิ่งนอยที่สุดที่ประชาชนอิตาลีจะตอบแทนไดคือการแสดงความขอบคุณและปฏิบัติตามคําสั่งของเขา"
 ITA_legge_bottai: "กฎหมายบอตไต"
 ITA_legge_bottai_desc: "ศิลปะและวัฒนธรรมโรมันเปนรากฐานของวัฒนธรรมสมัยใหมทั้งหมดในยุโรป เราไมอาจปลอยใหสมบัติทางประวัติศาสตรเหลานี้ถูกแทนที่ดวยลัทธิสมัยใหมได แมอิตาลีจะตองมองไปขางหนาเสมอ แตก็ตองไมลืมอดีตของตนเชนกัน"
 ITA_boost_the_grand_council_of_fascism: "เสริมอํานาจสภาใหญฟาสซิสต"
 ITA_boost_the_grand_council_of_fascism_desc: "เบนิโต มุสโสลินีไดทําประโยชนมากมายใหอิตาลี แตทายที่สุดแลว เขาก็ยังเปนเพียงมนุษยคนหนึ่ง หากเขานําประเทศไปผิดทางเมื่อใด สภาใหญฟาสซิสตจะอยูตรงนั้นเพื่อหยุดยั้งเขา"
 ITA_to_live_as_a_lion: "ใชชีวิตดั่งราชสีห"
 ITA_to_live_as_a_lion_desc: "ประชาชนอิตาลีไมไดเกิดมาเปนแกะ พวกเขาไมไดถูกสรางมาเพื่อนั่งเงียบ ๆ และพอใจอยูแถวที่สองของประวัติศาสตร พวกเขาถูกสรางมาเพื่อกําหนดชะตากรรมของตนเอง! เบนิโต มุสโสลินีคือผูที่จะทําใหพวกเขาทําเชนนั้น และเตือนใจพวกเขาวา มีชีวิตอยูหนึ่งวันอยางราชสีห ดีกวามีชีวิตอยูรอยปอยางแกะ"
 ITA_la_battaglia_del_grano: "ยุทธการแหงธัญพืช"
 ITA_la_battaglia_del_grano_desc: "ประเทศจะไมอาจนับวายิ่งใหญอยางแทจริงได หากตองพึ่งพาประเทศอื่นในการเลี้ยงดู อิตาลีตองพึ่งตนเองไดในดานอาหารพื้นฐาน หากตองการใหผูอื่นใหความสําคัญ เพื่อจุดประสงคนี้ เราตองสู และสูอยางหนักเหมือนที่เราสูในศึกอื่นใด มีเพียงชัยชนะในยุทธการแหงธัญพืชเทานั้น ที่เราจะหวังชัยชนะในสงครามได"
 ITA_la_battaglia_per_la_terra: "ยุทธการเพื่อผืนแผนดิน"
 ITA_la_battaglia_per_la_terra_desc: "รากฐานของสังคมฟาสซิสตที่เขมแข็งคือผืนแผนดินและผูคนที่ทํากินบนแผนดินนั้น ยังมีอีกหลายพื้นที่ในอิตาลีที่เราสามารถไดที่ดินที่ใชประโยชนได ดวยการระบายนํ้าออกจากหนองบึงและทําระบบชลประทานใหไรนา"
 ITA_la_battaglia_per_le_nascite: "ยุทธการเพื่อการเกิด"
 ITA_la_battaglia_per_le_nascite_desc: "หากเราตองการครองที่อันชอบธรรมในโลก เราตองมีกําลังทหารที่จะยึดมาดวยกําลัง สําหรับสิ่งนี้ เราตองมีทหาร คูสามีภรรยาจะมีลูกเพียงหนึ่งหรือสองคนไมเพียงพอ กอนที่เราจะชนะสงคราม เราตองชนะยุทธการเพื่อการเกิดเสียกอน"
 ITA_strengthen_the_regime: "เสริมความแข็งแกรงใหระบอบ"
 ITA_strengthen_the_regime_desc: "ยุทธการเพื่อการพึ่งพาตนเองทางเศรษฐกิจไดแสดงใหเห็นวาฟาสซิสตไมใชอุดมการณที่ออนแอและออนปวกเปยกเหมือนระบอบเสรีนิยมที่มีมากอน เราควรทําใหประชาชนไมมีวันลืมสิ่งนี้"
 ITA_the_man_of_providence: "บุรุษแหงพรหมลิขิต"
 ITA_the_man_of_providence_desc: "มุสโสลินีไมไดเพียงอยูในที่ที่ใชในเวลาที่ใช ทุกยางกาวไดรับการชี้นํา ราวกับดวยพระประสงคของพระเจา เพื่อใหมุสโสลินีไดกุมบังเหียนอิตาลีในเวลานั้น"
 ITA_believe_obey_fight: "เชื่อมั่น เชื่อฟง ตอสู"
 ITA_believe_obey_fight_desc: "พรรคของเรากอตั้งขึ้นบนหลักการงาย ๆ ประการแรก การจะยึดอํานาจไดตองเชื่อวาเปนไปได ประการที่สอง การจะยึดอํานาจไดตองเชื่อฟงผูที่มีอํานาจสั่งการ ประการที่สาม การจะยึดอํานาจไดตองตอสู และการยึดอํานาจคือจุดประสงคที่แทจริงเพียงประการเดียวของขบวนการทางการเมืองใด ๆ ที่สมชื่อ"
 ITA_banda_carita: "กองกําลังการิตา"
 ITA_banda_carita_desc: "สงครามไมไดรุงโรจนเสมอไป แมสาธารณชนอาจสนใจการรบในแนวหนา แตเรารูดีวาแนวหลังในประเทศก็สําคัญไมแพกัน และการกวาดลางการตอตานในแนวหลังก็จําเปนไมแพกัน"
 ITA_banda_koch: "กองกําลังค็อค"
 ITA_banda_koch_desc: "สงครามสมัยใหมมักเปนเรื่องของประชาชนทั้งชาติที่ทําสงคราม หมายความวาแนวหนาไมใชที่เดียวที่เกิดการสูรบอีกตอไป เราตองพรอมรักษาเสนทางคมนาคมของเราดวยการใชกําลังรบดวย"
 ITA_security_militias: "กองกําลังอาสารักษาความมั่นคง"
 ITA_security_militias_desc: "การแบงทหารแนวหนามารักษาความปลอดภัยพื้นที่สวนหลังคือการสิ้นเปลืองทหารดี ๆ เราควรจัดตั้งหนวยเฉพาะสําหรับคุมกันแนวหลังของกองทัพ เพื่อใหมีทหารเหลือไปสูรบกับขาศึกมากขึ้น"
 ITA_battaglioni_d_assalto: "กองพันจูโจม"
 ITA_battaglioni_d_assalto_desc: "หนวยเสื้อดําของเราสืบทอดขนบอันนาภาคภูมิใจของกลุมจูโจมในมหาสงคราม ดวยการผนวกพวกเขาเขากับกองทัพบก เราจะมอบพลังรุกอันทรงพลังใหกองทัพในการรบ"
 ITA_strengthen_the_blackshirts: "เสริมกําลังหนวยเสื้อดํา"
 ITA_strengthen_the_blackshirts_desc: "กองทัพบกหลวงยึดติดกับวิถีของระบอบเกามากเกินไป และแสดงใหเห็นซํ้าแลวซํ้าเลาถึงการขาดความกระตือรือรนแบบฟาสซิสตอยางนากังวล เห็นไดชัดวาเราตองมีกองพลทั้งกองพลที่ประกอบดวยหนวยเสื้อดําผูภักดีของเราเอง"
 ITA_milizia_coloniale: "กองกําลังอาสาอาณานิคม"
 ITA_milizia_coloniale_desc: "เราตองเสริมกําลังและขยายกองกําลังอาสาฟาสซิสตของเรา คือหนวยเสื้อดํา ดวยทหารเกณฑจากอาณานิคมที่ภักดีตอระบอบของเรามากขึ้น การเกณฑไมเพียงจากผูตั้งถิ่นฐานชาวอิตาลีแตรวมถึงประชากรทองถิ่นดวย จะทําใหเราเพิ่มจํานวนพวกเขาไดอยางมาก"
 ITA_towards_a_greater_italy: "สูมหาอิตาลี"
 ITA_towards_a_greater_italy_desc: "ลัทธิทวงคืนดินแดนของอิตาลีคือผลโดยธรรมชาติของการทรยศที่ฝายสัมพันธมิตรไตรภาคีกระทําตอประชาชนอิตาลีหลังมหาสงคราม โดยชอบธรรมแลว อิตาลีควรมีอํานาจปกครองเหนือทะเลเมดิเตอรเรเนียนอยางสมบูรณ และเพื่อการนั้น เราตองขยายพรมแดน"
 ITA_heroes_of_the_nation: "วีรบุรุษของชาติ"
 ITA_heroes_of_the_nation_desc: "เราตองยกยองและตอบแทนคุณงามความดีของวีรบุรุษผูยิ่งใหญของชาติ แมเราตองไมลืมวา หากปราศจากการนําอันชาญฉลาดของดูเช ศักยภาพของพวกเขาคงสูญเปลาโดยสิ้นเชิง"
 ITA_capo_supremo: "ผูนําสูงสุด"
 ITA_capo_supremo_desc: "มีเพียงบุคคลเดียวในอิตาลีที่สามารถนําความรุงโรจนและอํานาจที่ชาติอันยิ่งใหญของเราสมควรไดรับมาให ยุคของระบอบกษัตริยอันเสื่อมโทรมไดสิ้นสุดลงแลว ถึงเวลาที่ดูเชผูแข็งแกรงของเราจะเปนผูนําสูงสุดแหงอิตาลี"
 ITA_bend_the_bars: "ดัดลูกกรง"
 ITA_bend_the_bars_desc: "อิตาลีตกอยูในคุกที่อังกฤษสรางขึ้นหลังมหาสงคราม และยิ่งอิตาลีมีประชากรมากและทรงอํานาจขึ้นเทาใด ก็ยิ่งทุกขทรมานจากการถูกจองจํามากขึ้นเทานั้น ถึงเวลาดัดลูกกรงของคุกนั้น และขยายการควบคุมของอิตาลีออกไปอีก"
 ITA_subdue_the_sentinels: "ปราบผูเฝาประตู"
 ITA_subdue_the_sentinels_desc: "กาวตอไปสูเสรีภาพและความรุงโรจนที่ประชาชนอิตาลีสมควรไดรับ คือการปราบผูเฝาประตูที่กักขังเราไวในทะเลเมดิเตอรเรเนียน นั่นคือ ยิบรอลตารและสุเอซ"
 ITA_a_colonial_empire: "จักรวรรดิอาณานิคม"
 ITA_a_colonial_empire_desc: "แมศัตรูและคูแขงจะพยายามขัดขวาง อิตาลีก็ไดกลายเปนจักรวรรดิอาณานิคมอันเกรียงไกร เราตองทําใหมั่นใจไมเพียงวาเราใชประโยชนจากดินแดนไดสูงสุด แตยังตองขยายการควบคุมของอิตาลีในแอฟริกาตอไป"
 ITA_by_blood_alone: "ดวยเลือดเทานั้น"
 ITA_by_blood_alone_desc: "ดวยพลังของกองทัพและความคลั่งไคลอยางไรขีดจํากัดของนักทวงคืนดินแดนชาวอิตาลีที่ภักดีตอระบอบ ในที่สุดอิตาลีจะจารึกนามไวในพงศาวดารแหงประวัติศาสตร ไมใชในฐานะตัวประกอบ แตในฐานะตัวเอก \nมีเพียงเลือดเทานั้นที่ขับเคลื่อนกงลอแหงประวัติศาสตร!"
 ITA_masters_of_the_aegean: "เจาแหงทะเลอีเจียน"
 ITA_masters_of_the_aegean_desc: "หากเราตองการควบคุมทะเลเมดิเตอรเรเนียน เราตองสรางความเปนเจาอยางเบ็ดเสร็จของอิตาลีเหนือทะเลอีเจียนกอน ดวยสิ่งนี้ เราจะไมเพียงควบคุมทางเขาสูทะเลดําและชายฝงบอลขานสวนใหญ แตยังจะมีฐานทัพเรือแหงใหมสําหรับยึดครองคลองสุเอซดวย"
 ITA_masters_of_the_mediterranean: "เจาแหงเมดิเตอรเรเนียน"
 ITA_masters_of_the_mediterranean_desc: "อํานาจของรัฐแปรผันตามสถานะทางทะเล ถึงเวลาแลวที่จะอางสิทธิ์ควบคุมทะเลเมดิเตอรเรเนียนทั้งหมด เพราะเปนสิทธิ์ของประชาชนอิตาลีที่จะครองทะเลโบราณอันเปนแหลงกําเนิดอารยธรรมของเรา"

 ITA_convene_the_grand_council: "เรียกประชุมสภาใหญ"
 ITA_convene_the_grand_council_desc: "เราตองเรียกประชุมสภาใหญฟาสซิสตเพื่อหารือวาจะทําอยางไรกับมุสโสลินี การบุกเอธิโอเปยครั้งลาสุดและความไมเต็มใจที่จะแบงปนอํานาจหรือความรับผิดชอบ ทําใหหลายคนตั้งคําถามตอความสามารถในการเปนผูนําของเขา เขารับใชประเทศมาอยางดีและเปนภาพลักษณของฟาสซิสตโดยแท แตอาจถึงเวลาสําหรับผูนําคนใหมแลว…"

 ITA_foreign_affairs: "การตางประเทศ"
 ITA_foreign_affairs_desc: "มหาอํานาจทุกชาติตองกําหนดเปาหมายนโยบายตางประเทศที่ชัดเจน และตองมีบุคลากรที่มีความสามารถซึ่งไดรับการฝกใหดําเนินการทูตเพื่อบรรลุเปาหมายเหลานั้น"
 ITA_balkan_ambition: "ความทะเยอทะยานในบอลขาน"
 ITA_balkan_ambition_desc: "ถึงเวลาขยายพรมแดนอิตาลีไปทางตะวันออกสูสโลวีเนีย และที่สําคัญกวานั้นคือชายฝงดัลเมเชีย เราจะเนนยํ้ามรดกทางวัฒนธรรมเวนิสของดัลเมเชีย และทําใหโลกเห็นวาการปกครองของเวนิสไมเพียงเปนประโยชนตอชาวดัลเมเชียในอดีต แตยังเปนที่ยอมรับจากพวกเขาอยางมากดวย"
 ITA_potential_allies_in_the_balkans: "พันธมิตรที่เปนไปไดในบอลขาน"
 ITA_potential_allies_in_the_balkans_desc: "เพื่อควบคุมบอลขาน เราไมจําเปนตองกดขี่และครอบงําทุกชาติในภูมิภาค ถึงเวลาใชการทูตเพื่อหาพันธมิตรที่เปนประโยชนในบอลขาน แลวจึงกดขี่สวนที่เหลือ"
 ITA_albanian_occupation: "ยึดครองแอลเบเนีย"
 ITA_albanian_occupation_desc: "แอลเบเนียเปนเปาหมายงาย ๆ ใหทหารของเรายึดครอง เราไมนาจะเจอการตอตานมากนัก เราตองแสดงใหโลกเห็นแสนยานุภาพของอิตาลีและฟนฟูความรุงโรจนในอดีต!"
 ITA_albanian_oil: "นํ้ามันแอลเบเนีย"
 ITA_albanian_oil_desc: "ถึงเวลาเปลี่ยนอุปกรณลาสมัยที่ใชในสัมปทานนํ้ามันเกาในแอลเบเนีย และเปลี่ยนใหเปนอุตสาหกรรมขุดเจาะนํ้ามันที่แข็งแกรง เมื่อเราควบคุมประเทศนี้ไดอยางสมบูรณแลว"
 ITA_support_albanian_irredentism: "สนับสนุนลัทธิทวงคืนดินแดนของแอลเบเนีย"
 ITA_support_albanian_irredentism_desc: "เราตองพยายามทําใหการปกครองแอลเบเนียของอิตาลีมีความชอบธรรม การสนับสนุนลัทธิทวงคืนดินแดนของแอลเบเนียในภูมิภาคโคโซโวและอีพิรัส และไกลกวานั้น จะทําใหเราไดรับการสนับสนุนอยางมากจากประชากรทองถิ่นอยางแนนอน และเปดโอกาสใหเราขยายเขตอิทธิพลออกไปอีก"
 ITA_albanian_fascist_militia: "[GetAppropriateAlbanianFascistMilitiaName]"
 ITA_albanian_fascist_militia_default: "กองกําลังอาสาฟาสซิสตแอลเบเนีย"
 ITA_albanian_fascist_militia_alt: "กองกําลังอาสาเลกาลิเตติ"
 ITA_albanian_fascist_militia_desc: "เราจะจัดตั้งปกใหมของหนวยเสื้อดําอิตาลีในแอลเบเนีย โดยเกณฑไมเพียงผูตั้งถิ่นฐานชาวอิตาลีในประเทศ แตรวมถึงอาสาสมัครชาวแอลเบเนียดวย"
 ITA_guarantee_austrian_independence: "รับประกันเอกราชของออสเตรีย"
 ITA_guarantee_austrian_independence_desc: "เราไมอาจยอมใหเยอรมนีแทรกแซงออสเตรียได เพราะเปนภัยคุกคามใหญหลวงตอชาติอิตาลีและดุลอํานาจในยุโรป เราจะรับประกันเอกราชของออสเตรีย และจะตอตานการเคลื่อนไหวทางการทูตใด ๆ ที่เยอรมนีตั้งใจจะใชเพื่อมีอิทธิพลตอประเทศนี้"
 ITA_negotiate_italian_claims: "เจรจาการอางสิทธิ์ของอิตาลี"
 ITA_negotiate_italian_claims_desc: "การตอตานเยอรมนีของเราทําใหเราอยูในฐานะไดเปรียบเหนือชาติฝายสัมพันธมิตรไตรภาคีเดิม ซึ่งกําลังพยายามอยางสุดกําลังใหระบอบอิตาลีและเยอรมนีแตกหักกัน เราตองใชสถานการณนี้ใหเปนประโยชนและทวงคืนดินแดนอาณานิคมที่เราถูกปฏิเสธหลังมหาสงคราม"
 ITA_peace_with_ethiopia_tt: "หลังการเจรจาสันติภาพกับ §Y[ETH.GetNameWithFlag]§!:"
 ITA_ENG_must_control_necessary_states_tt: "§Y[ENG.GetNameWithFlag]§! ไมไดควบคุมอาณานิคมอังกฤษตามประวัติศาสตรในจะงอยแอฟริกาและมอลตา"
 ITA_FRA_must_control_necessary_states_tt: "§Y[FRA.GetNameWithFlag]§! ไมไดควบคุมอาณานิคมฝรั่งเศสตามประวัติศาสตรในจิบูตีและตูนิเซีย"
 ITA_ratify_the_stresa_front: "ใหสัตยาบันแนวรวมสเตรซา"
 ITA_ratify_the_stresa_front_desc: "อิตาลีไดรับสัมปทานดินแดนแลว ถึงเวลาเริ่มกระบวนการนําอิตาลีและฝรั่งเศสเขาสูพันธมิตรทางทหารที่เรียกวาแนวรวมสเตรซา"
 ITA_joint_military_programs: "โครงการทางทหารรวม"
 ITA_joint_military_programs_desc: "เราตองสงเสริมความรวมมือระหวางอิตาลีกับพันธมิตรใหม ทั้งดานการทหารและวิทยาศาสตร เนื่องจากทั้งสองดานเกี่ยวของกันอยางใกลชิด"
 ITA_italys_destiny: "ชะตากรรมของอิตาลี"
 ITA_italys_destiny_desc: "เราจะกําหนดบทบาทที่อิตาลีตองมีในพันธมิตรนี้ นั่นคือมหาอํานาจทางทะเลสูงสุดในทะเลเมดิเตอรเรเนียน กาวสําคัญตอไปในการบรรลุเปาหมายนี้คือการสรางความเปนใหญในบอลขาน"
 ITA_the_eastern_threat: "ภัยคุกคามจากตะวันออก"
 ITA_the_eastern_threat_desc: "ไมใชความลับที่สหภาพโซเวียตซึ่งกําลังผงาดขึ้นเปนภัยคุกคามไมเพียงตอผลประโยชนของเรา แตตอผลประโยชนของมหาอํานาจตะวันตกทั้งหมด เราจะบั่นทอนความสามารถในการขยายตัวของประเทศนี้ ดวยการตัดพวกเขาออกจากหนึ่งในภูมิภาคที่มั่งคั่งที่สุดที่พวกเขาเขาถึงได นั่นคือทะเลดํา"
 ITA_german_military_cooperation: "ความรวมมือทางทหารกับเยอรมนี"
