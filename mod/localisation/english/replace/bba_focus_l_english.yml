 # Horn of Africa
 HOA_develop_capitalstate: "พัฒนา [Root.Capital.GetName]"
 HOA_develop_capitalstate_desc: "เราตองเรงการพัฒนาอุตสาหกรรมเพื่อความเปนอยูที่ดีขึ้นของประชาชนและการปกปอง [ROOT.GetNameDef] ดังนั้น เราจะลงทุนในพื้นที่รอบ [ROOT.Capital.GetCapitalVictoryPointName] เปลี่ยนใหเปนศูนยกลางอุตสาหกรรมของชาติ"
 HOA_the_state_bank_of_name: "ธนาคารแหงรัฐของ [ROOT.GetNameDef]"
 HOA_the_state_bank_of_name_desc: "ดวยการขยายทรัพยากรของธนาคารกลางแหง [ROOT.GetNameDef] เราจะเปดสินเชื่อใหมใหประชาชน และเปนดั่งยาขับเคลื่อนทางการเงินใหแกเศรษฐกิจ[ROOT.GetAdjective]ที่กําลังซบเซา"
 HOA_pave_the_roads: "ลาดยางถนน"
 HOA_pave_the_roads_desc: "การขนสงผูคนและสินคาทั่ว [ROOT.GetNameDef] ในปจจุบันไรประสิทธิภาพเกินไป การลงทุนในถนนไมเพียงเปนประโยชนตอเศรษฐกิจ แตยังทําใหเราปลอดภัยขึ้นดวยการเคลื่อนยายกําลังทางทหารไดงายขึ้นดวย"
 HOA_the_steam_locomotive: "หัวรถจักรไอนํ้า"
 HOA_the_steam_locomotive_desc: "แมรถยนตและรถบรรทุกจะมีประโยชนในการขนสงระยะสั้นหรือปริมาณนอย แตรถไฟมีประสิทธิภาพกวามากในการขนสงสินคาและผูคนจํานวนมหาศาล การลงทุนในเครือขายทางรถไฟจะชวยกระตุนเศรษฐกิจของชาติไดอยางมาก"
 HOA_the_adjective_regional_development_fund: "กองทุนพัฒนาภูมิภาค[ROOT.GetAdjective]"
 HOA_state_owned_industry_tt: "ปรับ §Y$ETH_state_development_dynamic_modifier$§! โดย:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+15%§!"
 HOA_the_adjective_regional_development_fund_desc: "ภูมิภาคตาง ๆ ของ [ROOT.GetNameDef] กําลังซบเซาและตองการการลงทุนอยางเรงดวน การจัดตั้งกองทุนพัฒนาภูมิภาคจะทําใหมั่นใจวารัฐบาลทองถิ่นมีเครื่องมือที่จําเปนในการพัฒนาภูมิภาคของตนใหทันสมัย"
 HOA_the_adjective_industrial_fund: "กองทุนอุตสาหกรรม[ROOT.GetAdjective]"
 HOA_the_adjective_industrial_fund_desc: "[ROOT.GetNameDefCap] ยังพัฒนาอุตสาหกรรมไดนอยอยางนาเศรา หากเราตองการยกระดับชีวิตประชาชนและมีขีดความสามารถในการปกปองพวกเขาจากการรุกรานของตางชาติ เราตองเรงพัฒนาอุตสาหกรรมของชาติอยางรวดเร็ว"
 HOA_exploit_national_resources: "ใชประโยชนจากทรัพยากรของชาติ"
 HOA_exploit_national_resources_desc: "[ROOT.GetNameDefCap] อุดมไปดวยทรัพยากรธรรมชาติที่รอการนํามาใช ดวยการลงทุนเพียงเล็กนอย ในที่สุดเราก็จะเริ่มใชประโยชนจากมันได"
 HOA_support_the_agrarians: "สนับสนุนเกษตรกร"
 HOA_support_the_agrarians_desc: "ประชากรชนบทของ [ROOT.GetNameDef] ที่ทํางานดานเกษตรกรรมคือกระดูกสันหลังของชาติ ดังนั้นเราควรทํามากขึ้นเพื่อสนับสนุนพวกเขาในงานสําคัญที่พวกเขาทํา"
 HOA_support_the_agrarians_tt: "ปรับ §Y$ETH_state_development_dynamic_modifier$§! โดย:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 HOA_promote_local_crafts: "สงเสริมหัตถกรรมทองถิ่น"
 HOA_promote_local_crafts_desc: "[ROOT.GetNameDefCap] มีชางฝมือจํานวนมากที่ทํางานขนาดเล็กเพื่อผลิตสินคาใหชาติ เราควรตอยอดความเชี่ยวชาญของพวกเขาและทําใหพวกเขาขยายกิจการและการผลิตสินคาดังกลาวไดงายขึ้น"
 HOA_use_the_natural_harbors: "ใชทาเรือธรรมชาติ"
 HOA_use_the_natural_harbors_desc: "ดวยดินแดนชายฝงที่เพิ่งไดมา เรามีโอกาสเพิ่มการเขาถึงตลาดระหวางประเทศอยางมีนัยสําคัญดวยการสรางทาเรือของเราเอง ซึ่งจะทําใหการนําเขาและสงออกสินคางายขึ้นมาก ชวยเศรษฐกิจของเราไดอยางมหาศาล"
 HOA_the_capital_city_airport: "ทาอากาศยาน [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_city_airport_desc: "การขนสงทางอากาศกําลังเชื่อมเมืองตาง ๆ ของโลกเขากับเศรษฐกิจโลกมากขึ้นเรื่อย ๆ เราควรสรางทาอากาศยานของเราเองเพื่อใชประโยชนจากแนวโนมนี้"
 HOA_a_steamboat_fleet: "กองเรือกลไฟ"
 HOA_a_steamboat_fleet_desc: "เพื่อปกปองชายฝงและเสนทางเดินเรือ เราตองสรางกองเรือชายฝงที่สามารถยับยั้งการรุกรานของตางชาติได"
 HOA_improved_irrigation_systems: "ปรับปรุงระบบชลประทาน"
 HOA_improved_irrigation_systems_desc: "เราไมอาจมีความมั่นคงของชาติไดหากปราศจากกําลังการผลิตอาหารที่แข็งแกรง เพื่อเพิ่มผลผลิตพืชผล เราจะลงทุนในโครงการชลประทานขนาดใหญทั่วพื้นที่เพาะปลูกของเรา"
 HOA_improved_irrigation_systems_tt: "ปรับ §Y$ETH_state_development_dynamic_modifier$§! โดย:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+15%§!"
 HOA_the_adjective_air_fleet: "กองบิน[ROOT.GetAdjective]"
 HOA_the_adjective_air_fleet_desc: "สงครามทางอากาศกําลังกลายเปนสมรภูมิหลักที่ตัดสินผูชนะของความขัดแยงอยางรวดเร็ว ดังนั้นเราตองจัดตั้งกองทัพอากาศของเราเองและเตรียมพรอมปกปองนานฟาของ [ROOT.GetNameDef]"
 HOA_state-funded_projects: "โครงการที่รัฐใหทุน"
 HOA_state-funded_projects_desc: "เศรษฐกิจของเราซบเซาเนื่องจากขาดโครงสรางพื้นฐานและอุตสาหกรรม เพื่อบรรเทาปญหานี้ เราจะลงทุนอยางหนักในโครงการใหมทั่ว [ROOT.GetNameDef]"
 HOA_the_grand_university_of_capital: "มหาวิทยาลัยใหญแหง [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_grand_university_of_capital_desc: "การถายทอดความรูจากรุนสูรุนมีความสําคัญยิ่งตอความมั่นคงและการเติบโตของทุกชาติ ดังนั้น เราจะกอตั้งมหาวิทยาลัยใหญแหงใหมใน [ROOT.Capital.GetCapitalVictoryPointName] เพื่อใหการศึกษาที่ดีขึ้นแกนักวิทยาศาสตร นักประวัติศาสตร และศิลปนรุนตอไป"

 HOA_the_adjective_armed_forces: "กองทัพ[ROOT.GetAdjective]"
 HOA_the_adjective_armed_forces_desc: "โลกไรเสถียรภาพมากขึ้นเรื่อย ๆ ขณะที่ความตึงเครียดระหวางมหาอํานาจกอตัว หากเราตองการรักษาเอกราช กองทัพ[ROOT.GetAdjective]ตองพรอมสําหรับสงคราม"
 HOA_warrior_tradition: "ธรรมเนียมนักรบ"
 HOA_warrior_tradition_desc: "[ROOT.GetNameDefCap] มีประวัติศาสตรอันยาวนานของนักรบผูกลาที่ปกปองบานเรือนจากผูหมายพิชิต บัดนี้ยิ่งกวาที่เคย เราตองดึงธรรมเนียมนั้นมาใชเพื่อปกปองมาตุภูมิ"
 HOA_strengthen_the_irregulars: "เสริมกําลังทหารนอกแบบ"
 HOA_strengthen_the_irregulars_desc: "ระบบทหารนอกแบบและกองกําลังเกณฑรับใชเรามาอยางดีหลายศตวรรษ แทบไมมีเหตุผลที่จะเปลี่ยนสิ่งที่พิสูจนแลววาไดผล"
 HOA_every_man_a_warrior: "ชายทุกคนคือนักรบ"
 HOA_every_man_a_warrior_desc: "หาก [ROOT.GetNameDef] จะยืนหยัดตอผูรุกรานตางชาติไดสําเร็จ เราตองทําใหสังคมเปนทหารจนถึงขั้นที่ทุกคนสามารถจับอาวุธไดเมื่อจําเปนตอการปองกันประเทศ"
 HOA_names_finest: "ยอดฝมือแหง [ROOT.GetName]"
 HOA_names_finest_desc: "ทหารของเรารูดีวาพวกเขาคืออุปสรรคเดียวที่ขวางไมใหชาติของเราตกเปนเมืองขึ้นของมหาอํานาจตางชาติ ความรูนั้นนํามาซึ่งความมุงมั่นแนวแนในการปกปองมาตุภูมิและรักษาเสรีภาพของ[ROOT.GetAdjective]"
 HOA_utilize_our_strengths: "ใชจุดแข็งของเรา"
 HOA_utilize_our_strengths_desc: "แมกองทัพของเราอาจไมไดกวางขวางหรือเปนระบบเหมือนของชาติอื่น แตก็มีความเชี่ยวชาญนอกแบบแผนมากมายที่นํามาใชประโยชนในสนามรบได"
 HOA_reform_the_conscription: "ปฏิรูปการเกณฑทหาร"
 HOA_reform_the_conscription_desc: "เมื่อสถานการณโลกตึงเครียดขึ้นเรื่อย ๆ ถึงเวลาแลวที่จะขยายโครงการเกณฑทหาร เพื่อใหเราพรอมรับมือการรุกรานจากตางชาติทุกรูปแบบ"
 HOA_eyes_on_the_imperialists: "จับตาพวกจักรวรรดินิยม"
 HOA_eyes_on_the_imperialists_desc: "มหาอํานาจจักรวรรดินิยมในภูมิภาคตางมองเอกราชของ[ROOT.GetNameDef]ดวยความดูแคลน เราตองตื่นตัวอยูเสมอและไมยอมตกเปนเหยื่อความทะเยอทะยานของพวกเขา"
 HOA_encourage_local_arms_production: "สงเสริมการผลิตอาวุธในประเทศ"
 HOA_encourage_local_arms_production_desc: "หากเราไมสามารถจัดหายุทโธปกรณที่จําเปนใหแกกองทหารได พวกเขาก็จะไมมีทางปองกันประเทศไดอยางเพียงพอ ดังนั้นเราตองขยายกําลังการผลิตของอุตสาหกรรมอาวุธ"
 HOA_metal_beasts: "อสูรเหล็ก"
 HOA_metal_beasts_desc: "เปนที่ชัดเจนขึ้นทุกทีวาสงครามยานเกราะจะมีบทบาทในสนามรบมากขึ้นเรื่อย ๆ กองทัพตองเรียนรูวิธีใชและรับมือยานพาหนะเหลานี้ใหดีที่สุด"
 HOA_the_roars_of_thunder: "เสียงคํารามแหงสายฟา"
 HOA_the_roars_of_thunder_desc: "บางครั้งในสนามรบ วิธีเดียวที่จะขับไลขาศึกไดคืออํานาจการยิงที่ทวมทน และวิธีปลดปลอยอํานาจนั้นที่ไดผลที่สุดก็คือปนใหญ"
 HOA_develop_indigenous_models: "พัฒนาแบบอาวุธของตนเอง"
 HOA_develop_indigenous_models_desc: "การพึ่งพาแบบยุทโธปกรณทหารราบจากตางชาติทําใหเราเสี่ยงที่จะลาหลังทางเทคโนโลยี ความเสี่ยงดานความมั่นคงนี้จะแกไขไดอยางเหมาะสมก็ตอเมื่อเราเพิ่มความเชี่ยวชาญภายในประเทศดานการพัฒนาอาวุธเบา"
 HOA_the_steel_lions: "สิงหเหล็ก"
 HOA_the_steel_lions_desc: "ยุคของสงครามสนามเพลาะที่หยุดนิ่งไดผานพนไปแลว ถึงเวลาที่เราจะเริ่มสงหนวยยานเกราะเฉพาะทางของเราเองเขาสูสนามรบ และเริ่มเรียนรูวิธีการทําสงครามเคลื่อนที่"
 HOA_warfare_from_afar: "สงครามจากระยะไกล"
 HOA_warfare_from_afar_desc: "ปนใหญไดพิสูจนคุณคาของตนในสนามรบครั้งแลวครั้งเลา เราควรใชมันใหเกิดประโยชนมากขึ้นโดยผนวกหนวยปนใหญเฉพาะทางเขากับกองพลทหารราบอยางใกลชิดยิ่งขึ้น"
 HOA_modern_infantry: "ทหารราบสมัยใหม"
 HOA_modern_infantry_desc: "การปฏิรูปกองทัพของเราชวยเพิ่มประสิทธิภาพของกองทัพไปไดมาก เราควรตอยอดพัฒนาการนี้ดวยการเพิ่มจํานวนกองพลในสนามรบ"

 HOA_the_first_album: "[ROOT.GetNameDefCap]"
 HOA_the_first_album_desc: "โลกดูอันตรายยิ่งขึ้นเรื่อย ๆ ขณะที่ความตึงเครียดระหวางมหาอํานาจกอตัว แตนั่นก็เปดโอกาสมากมายใหแกชาติที่เต็มใจและพรอมจะฉวยจังหวะนี้"
 HOA_a_loyal_subject: "รัฐในอารักขาผูภักดี"
 HOA_a_loyal_subject_desc: "ขณะที่สถานการณบนเวทีโลกไรเสถียรภาพมากขึ้นทุกที บางทีการอยูภายใตการคุมครองของชาติที่แข็งแกรงกวาอาจเปนทางเลือกที่ดีกวา อยางนอยก็ในตอนนี้..."
 HOA_political_stability: "เสถียรภาพทางการเมือง"
 HOA_political_stability_desc: "เราไมอาจหวังจะคงความเปนชาติเอกราชไดหากภายในประเทศยังแตกแยก มีเพียงการสรางแนวรวมที่เปนหนึ่งเดียวเทานั้นที่จะทําใหเราตานทานกระแสลมแหงการเปลี่ยนแปลงที่กําลังโหมกระหนํ่าโลกอยูนี้ได"
 HOA_the_capital_railroad: "ทางรถไฟ[Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_railroad_desc: "การเชื่อมโครงขายทางรถไฟของเรากับเพื่อนบานจะชวยใหเราสงออกสินคาและทรัพยากรไปยังพวกเขาไดดีขึ้น ซึ่งนาจะชวยกระตุนเศรษฐกิจของเราไปดวย"
 HOA_invite_foreign_settlers: "เชิญชวนผูตั้งถิ่นฐานตางชาติ"
 HOA_invite_foreign_settlers_desc: "เรายังตองเดินอีกไกลในการพัฒนาประเทศใหทันสมัย เราควรใชประโยชนจากทักษะของชาวอาณานิคมผูไรเดียงสา ดวยการสรางแรงจูงใจใหพวกเขายายมาอยูที่[ROOT.GetNameDef]"
 HOA_countryleader: "[ROOT.GetLeader]"
 HOA_countryleader_desc: "[ROOT.GetLeader] คือบุคคลเดียวที่จะประคองชาติใหเปนหนึ่งเดียวผานชวงเวลาอันยากลําบากนี้ได ประชาชนจึงตองรวมกันสนับสนุน[ROOT.GetLeader.GetHerHim]"
 HOA_securing_the_adjective_future: "สรางความมั่นคงใหอนาคตของชาว[ROOT.GetAdjective]"
 HOA_securing_the_adjective_future_desc: "[ROOT.GetNameDefCap]เปนชาติเล็กที่มีมิตรนอยมากบนเวทีโลก การเปลี่ยนแปลงสิ่งนี้จะชวยรักษาเสรีภาพและเอกราชของเราในอนาคตไดอยางมาก"
 HOA_improving_the_educational_system: "ปรับปรุงระบบการศึกษา"
 HOA_improving_the_educational_system_desc: "เด็ก ๆ ของเราคือผูกุมชะตากรรมของชาติ ดังนั้นการมอบการศึกษาที่ดีที่สุดใหแกพวกเขาจะชวยสรางความมั่นคงใหอนาคตของ[ROOT.GetNameDef]ไดอยางมาก"
 HOA_construct_great_monuments: "สรางอนุสรณสถานอันยิ่งใหญ"
 HOA_construct_great_monuments_desc: "ชาว[ROOT.GetAdjective]มีเรื่องใหภาคภูมิใจมากมาย เรามีประวัติศาสตรอันยาวนานที่ควรไดรับการรําลึกดวยอนุสรณสถานซึ่งปลุกแรงบันดาลใจใหมุงสูความยิ่งใหญยิ่งขึ้นไป"
 HOA_the_adjective_volunteer_force: "กองกําลังอาสาสมัคร[ROOT.GetAdjective]"
 HOA_the_adjective_volunteer_force_desc: "การปะทะกันเล็ก ๆ ตามชายแดนในอีกทวีปหนึ่งอาจจุดชนวนความขัดแยงใหญโตที่ลุกลามไปทั่วโลก เราตองทําหนาที่ของเราในการดับประกายไฟเหลานี้กอนที่มันจะกอใหเกิดมหาสงครามอีกครั้ง"
 HOA_military_cooperation: "ความรวมมือทางทหาร"
 HOA_military_cooperation_desc: "แมเราจะกาวหนาไปมากในการปรับปรุงกองทัพ แตยังมีบทเรียนบางอยางที่เราเรียนรูไดจากมิตรประเทศผานการซอมรบรวมและการเพิ่มความรวมมือทางทหาร"
 HOA_that_which_is_rightfully_ours: "สิ่งที่ควรเปนของเรา"
 HOA_that_which_is_rightfully_ours_desc: "[ROOT.GetNameDefCap]ในวันนี้เปนเพียงเงาของสิ่งที่ควรจะเปน ประวัติศาสตรแสดงใหเห็นวาบรรพบุรุษของเราเคยมีอํานาจเหนือดินแดนที่กวางใหญกวาที่รัฐบาลปจจุบันปกครองอยูมาก แตดินแดนสวนใหญถูกชวงชิงไปจากเราตลอดหลายชั่วอายุคน ถึงเวลาแลวที่เราจะทวงคืนสิ่งที่เปนของเราโดยชอบธรรม"
 HOA_commandos: "หนวยคอมมานโด"
 HOA_commandos_desc: "บางครั้งในสงคราม ทหารกลุมเล็ก ๆ ที่ไดรับการฝกมาอยางดีสามารถสรางชัยชนะหลังแนวขาศึกไดยิ่งใหญกวาที่กองทัพมหึมาทําไดในสนามรบ"
 HOA_a_jagged_alliance: "พันธมิตรขรุขระ"
 HOA_a_jagged_alliance_desc: "แมเราจะไมไดเห็นพองกับชาติอื่นเสมอไป แตเรามักเผชิญภัยคุกคามเดียวกัน การมุงเนนปญหารวมเหลานั้นอาจเปนรากฐานของพันธมิตรที่ยั่งยืนและความมั่นคงของชาติที่เพิ่มขึ้น"
 HOA_observe_and_learn: "สังเกตและเรียนรู"
 HOA_observe_and_learn_desc: "การสงครามวิวัฒนอยูตลอดเวลาตามความกาวหนาทางเทคโนโลยีและความคิดสรางสรรค เพื่อรักษากองทัพที่แข็งแกรง เราตองเรียนรูบทเรียนจากสงครามและไมหยุดมองหาหนทางพัฒนา"
 HOA_foreign_investors: "นักลงทุนตางชาติ"
 HOA_foreign_investors_desc: "หากเราตองการเจริญรุงเรือง เราจําเปนตองมีการลงทุนในอุตสาหกรรมและโครงสรางพื้นฐาน โชคดีที่ไมขาดแคลนชาวตางชาติที่มองหาผลกําไร"
 HOA_research_exchange_programmes: "โครงการแลกเปลี่ยนงานวิจัย"
 HOA_research_exchange_programmes_desc: "อุตสาหกรรมของเราตองการการปรับใหทันสมัยอยางเรงดวน ดวยการตั้งโครงการแลกเปลี่ยน เราจะไดรับความรูจากตางประเทศวาจะนําความกาวหนาทางเทคโนโลยีใหม ๆ มาใชในโรงงานไดดีที่สุดอยางไร"
 HOA_foreign_trained_officials: "เจาหนาที่ที่ผานการฝกจากตางประเทศ"
 HOA_foreign_trained_officials_desc: "ยังมีอีกมากที่เราเรียนรูไดจากความเชี่ยวชาญของชาวตางประเทศ ถึงเวลาที่เราจะใชประโยชนจากพวกเขาใหดีขึ้นโดยมอบตําแหนงที่มีอํานาจภายในประเทศให"
 HOA_countryadjective_loyalist_advisors: "ที่ปรึกษาผูภักดีชาว[ROOT.GetAdjective]"
 HOA_countryadjective_loyalist_advisors_desc: "เราไมอาจปลอยใหชาติและวัฒนธรรมของเราถูกพวกจักรวรรดินิยมกลืนกิน เราตองนําผูที่ภักดีตอ[ROOT.GetNameDef]ขึ้นสูตําแหนงที่มีอํานาจ และเริ่มกระบวนการทวงคืนเสรีภาพของเรา"
 HOA_lay_claim_to_the_danakil: "อางสิทธิ์เหนือดานากิล"
 HOA_lay_claim_to_the_danakil_desc: "[ROOT.GetNameDefCap]จะเปราะบางตอการยกพลขึ้นบกเสมอ หากไมยึดครองภูมิภาคดานากิลทางตอนเหนือไวใหมั่น"
 HOA_push_for_the_highlands: "รุกสูที่ราบสูง"
 HOA_push_for_the_highlands_desc: "หัวใจทางเศรษฐกิจของแอฟริกาตะวันออกอยูบนที่ราบสูง การยึดครองไวให[ROOT.GetNameDef]จะชวยขยายศักยภาพทางเศรษฐกิจของเราไดอยางมาก"
 HOA_secure_the_ogaden: "ยึดครองโอกาเดน"
 HOA_secure_the_ogaden_desc: "การยึดครองโอกาเดนจะทําใหเรามีปราการธรรมชาติหลายชั้นกั้นระหวางเรากับผูรุกรานใด ๆ ขณะเดียวกันก็เปดเศรษฐกิจของเราสูการคาขามมหาสมุทรอินเดีย"
 HOA_rallying_the_adjective_people: "ปลุกระดมชาว[ROOT.GetAdjective]"
 HOA_rallying_the_adjective_people_desc: "โลกกําลังถูกความขัดแยงทําลายลาง สิ่งเดียวที่กั้นระหวางเสรีภาพของเราในวันนี้กับหวงเหวแหงการถูกกดขี่ คือความเต็มใจของชาว[ROOT.GetAdjective]ที่จะลุกขึ้นสู รวมกันเราอยู แยกหมูเราตาย"
 HOA_the_capital_school_of_technology: "โรงเรียนเทคโนโลยี[Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_school_of_technology_desc: "สิ่งที่เคยลํ้าสมัยในสนามรบและในโรงงานเมื่อไมกี่ปกอน วันนี้มักลาสมัยไปโดยสิ้นเชิง หากเราตองการกาวทันการพัฒนาเทคโนโลยีใหม ๆ เราตองลงทุนในการศึกษาของคนรุนตอไป"
 HOA_promote_countryadjective_nationalism: "สงเสริมชาตินิยม[ROOT.GetAdjective]"
 HOA_promote_countryadjective_nationalism_desc: "ประชาชนของ[ROOT.GetNameDef]จะไมทนตอการกดขี่จากมหาอํานาจตางชาติอีกตอไป เราตองฉวยจังหวะนี้และเรงแผนการสูเอกราชของเรา"
 HOA_crowning_of_the_negusa_nagast: "ราชาภิเษกเนกูซา นากาสต"
 HOA_crowning_of_the_negusa_nagast_desc: "เมื่อเรากาวขึ้นเปนมหาอํานาจที่ครอบงําภูมิภาคมากขึ้นเรื่อย ๆ ถึงเวลาที่จะรับบทบาทนี้ดวยการเจิมผูนําของเราเปนเนกูซา นากาสตองคใหม ทุกคนตองสนับสนุน[ROOT.GetLeader.GetHerHim] มิฉะนั้นจะตองเผชิญความพิโรธของเรา"
 HOA_control_ethiopia_tt: "ควบคุมดินแดนเอธิโอเปยทั้งหมด"
 HOA_proclaim_east-african_hegemony: "ประกาศความเปนเจาแหงแอฟริกาตะวันออก"
 HOA_proclaim_east-african_hegemony_desc: "สถานการณที่ปนปวนอยูเสมอในจะงอยแอฟริกาจะสงบลงไดก็ภายใตการปกครองของจักรพรรดิผูเกรียงไกรของเรา [ROOT.GetName] เทานั้น ถึงเวลาที่จะรวมภูมิภาคใหเปนหนึ่งแลว"
