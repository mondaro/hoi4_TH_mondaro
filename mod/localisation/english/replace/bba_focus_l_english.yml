 ETH_strengthen_the_black_lions: "เสริมกําลังสิงหดํา"
 ETH_strengthen_the_black_lions_desc: "แมเราจะเสียดินแดนใหขาศึก แตการตอสูตองดําเนินตอไป ขบวนการสิงหดํากําลังตอตานชาวอิตาลีอยางดุเดือด เราจึงควรสนับสนุนพวกเขาทุกวิถีทาง"
 ETH_supporting_the_arbegnoch: "สนับสนุนอารเบญโญช"
 ETH_supporting_the_arbegnoch_desc: "ทั่วทั้ง [ROOT.GetName] มีผูรักชาติที่พรอมจับอาวุธตอสูกับผูรุกราน [ITA.GetAdjective] เราตองทําทุกวิถีทางเพื่อสนับสนุนชายหญิงผูกลาหาญเหลานี้ในการบอนทําลายจักรกลสงครามของ [ITA.GetAdjective]"
 ETH_ecole_militaire_haile_selassie_1er: "[GetEthiopianMilitaryAcademyName]"
 ETH_ecole_militaire_haile_selassie_1er_desc: "กองทัพของเรากําลังแสดงใหเห็นวาลาสมัยอยางยิ่งเมื่อเทียบกับมหาอํานาจอื่นในภูมิภาค ทั้งดานยุทโธปกรณและแนวคิด เราจะกอตั้งโรงเรียนนายรอยของเราเองเพื่อฝกนายทหารรุนใหมใหรูวิธีทําสงครามสมัยใหม"
 ETH_ecole_militaire_haile_selassie_1er_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§! "
 ETH_unlock_academy_tt: "ปลดล็อก §Y$academy_spirit$§!"
 ETH_university_of_capital: "มหาวิทยาลัย[ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_university_of_capital_desc: "ครั้งหนึ่ง ความดุดันของกองทหารเคยเปนตัวกําหนดผลของการรบ แตบัดนี้การรบสามารถเกิดขึ้นในระยะไกลโดยที่ทหารไมเคยเห็นหนากันเลย เราตองลงทุนในสถาบันการศึกษา เพื่อพัฒนาเทคโนโลยีใหมสําหรับทําสงครามและผลิตเครื่องมือที่ใชในการนั้น"
 ETH_university_of_capital_tt: "ปรับ §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! โดย:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5%§! "
 ETH_scavenging_tactics: "ยุทธวิธีเก็บกูยุทโธปกรณ"
 ETH_scavenging_tactics_desc: "ระหวางที่เราขยายฐานอุตสาหกรรม เราควรฝกทหารใหรูจักมองหาสิ่งที่มีประโยชนและเก็บกูไดในสนามรบ วิธีนี้จะชวยใหพวกเขามีเสบียงเพียงพอไดมาก จนกวาเราจะผลิตและขนสงยุทโธปกรณของเราเองไดอยางสมํ่าเสมอ"
 ETH_scavenger_random_generals_tt: "ผูนํากองทัพ §Yสาม§! คนที่สุมเลือกจะไดรับ §Y$scavenger$§!: \n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$: §G+3%§! "
 ETH_keep_the_chitet: "คงไวซึ่ง [GetChitetName]"
 ETH_keep_the_chitet_desc: "[GetChitetName] รับใชเรามาเปนอยางดี ในฐานะชาติที่คอนขางเปนเกษตรกรรม เราคงลําบากที่จะสงกองทัพอาชีพประจําการไวตลอดเวลา จึงดีที่สุดที่จะยึดสิ่งที่เรารูจักดี"
 ETH_keep_the_chitet_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n $modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5%§!\n เพิ่มกองพัน §Y2 $irregular_infantry$§! ใหกองพลชิเตต เซฟารี"
 ETH_expand_the_mehal_sefari: "ขยาย [ETH_GetSefariName]"
 ETH_expand_the_mehal_sefari_desc: "กองทหารของ [ETH_GetSefariName] แสดงใหเห็นถึงความจําเปนของทหารอาชีพที่ไดรับการฝกอยางดี ยุคที่เพียงเกณฑชาวนามาเปนกองทัพในยามวิกฤตไดผานพนไปนานแลว ดังนั้นเราจะจัดระเบียบกองทัพใหมเปนกองกําลังประจําการถาวร"
 ETH_chitet_sefari_no_recruiting_tt: "ไมสามารถเกณฑกองพล §Yชิเตต เซฟารี§! ไดอีกตอไป"
 ETH_expand_the_mehal_sefari_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+25%§! \n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!"
 ETH_the_ethiopian_air_force: "กองทัพอากาศ[ROOT.GetAdjective]"
 ETH_the_ethiopian_air_force_desc: "ไมวาจะเปนการสนับสนุนทหารในสนามรบหรือการทําลายโครงสรางพื้นฐานของขาศึก เครื่องบินไดพิสูจนแลววาเปนกําลังอันลํ้าคา เราตองกอตั้งกองทัพอากาศของเราเอง หากจะปกปองประชาชนและทําลายศัตรู"
 ETH_the_ethiopian_air_force_tt: "ปลดล็อก §Y$air_force_command_spirit$§!"
 ETH_establish_a_naval_base: "กอตั้งฐานทัพเรือ"
 ETH_establish_a_naval_base_desc: "เมื่อเราไดทาเรือมาเมื่อเร็ว ๆ นี้ เราก็เปดตัวเองสูสมรภูมิอีกแหงหนึ่ง เราตองกอตั้งฐานทัพเรือของเราเองและเริ่มสรางกองทัพเรือเพื่อปกปองชายฝงใหมของเรา"
 ETH_improve_the_administration: "ปรับปรุงการบริหาร"
 ETH_improve_the_administration_desc: "ยังมีการทุจริตอยูมากในแวดวงการศึกษา นี่เปนเรื่องที่ยอมรับไมไดสําหรับสถาบันที่อางวาภาคภูมิใจในระบบคุณธรรม เราตองกําจัดการทุจริตนี้ออกจากโรงเรียนและมหาวิทยาลัยของเราอยางไมปรานี"
 ETH_improve_the_administration_tt: "ปรับ §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! โดย:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+5%§!"
 ETH_mounted_levies: "[GetChitetName] ทหารมา"
 ETH_mounted_levies_desc: "จากทะเลทรายทางตะวันออกถึงเทือกเขาทางตะวันตก มาตุภูมิของเราประกอบดวยภูมิประเทศหลากหลายที่ยากตอการสัญจร จึงไมเหมาะกับยานพาหนะลอยางหรือสายพาน อยางไรก็ตาม อูฐและมาไดพิสูจนมานับพันปแลววาทําหนาที่นี้ไดเกินพอ"
 ETH_mounted_levies_tt: "เกณฑกองพล §Y$cavalry$§! และ §Y$camelry$§!"
 ETH_regional_training_centers: "ศูนยฝกประจําภูมิภาค"
 ETH_regional_training_centers_desc: "[GetChitetName] ยังหางไกลจากความสมบูรณแบบ ทหารของเราจะมีประสิทธิภาพยิ่งขึ้นมากหากมีศูนยฝกประจําภูมิภาคที่สอนวิธีรบและคิดเชิงยุทธวิธี วิธีนี้ยังชวยใหเราจัดการฝกทหารใหเปนมาตรฐานเดียวกันไดโดยไมตองมีกองทัพประจําการ"
 ETH_regional_training_centers_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n $modifier_army_sub_unit_irregular_infantry_defence_factor$: §G+5%§! \n $modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+10%§! \n $modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+15%§!"
 ETH_expand_the_kebur_zabagna: "ขยาย [ETH_GetGuardsName]"
 ETH_expand_the_kebur_zabagna_desc: "[ETH_GetGuardsName] พิสูจนแลววาเปนยอดฝมือในกองทัพของเรา เราควรใชความสามารถของพวกเขาใหมากขึ้น ดวยการเพิ่มการเขาถึงยุทโธปกรณและกําลังพล"
 ETH_expand_the_kebur_zabagna_tt: "เกณฑกองพล §Yเกบูร ซาบัญญา§! เพิ่มอีกหนึ่งกองพล \nเพิ่มกองพัน §Y$infantry$§! และ §Y$cavalry$§! ใหแมแบบ §Yเกบูร ซาบัญญา§!\nเพิ่ม §Y$recon$§! และ §Y$artillery$§! หากวิจัยเทคโนโลยีที่เกี่ยวของแลว"
 ETH_tactical_training: "มาตรฐานการฝกยุทธวิธี"
 ETH_tactical_training_desc: "บอยครั้งเหลือเกินที่การฝกของกองทัพเราไมสมํ่าเสมอและลาสมัย เราจําเปนตองทําใหการฝกยุทธวิธีของทหารทุกนายเปนมาตรฐานเดียวกัน เพื่อใหมีประสิทธิภาพยิ่งขึ้นในสนามรบ"
 ETH_tactical_training_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§! "
 ETH_peacekeeping_forces: "กองกําลังรักษาสันติภาพ"
 ETH_peacekeeping_forces_desc: "กุญแจสูความมั่นคงของเราคือการทําใหแนใจวาวิกฤตใด ๆ ในตางแดนจะไดรับการจัดการอยางรวดเร็วกอนลุกลามจนเกินควบคุม การรักษากองกําลังรักษาสันติภาพที่พรอมสงไปทั่วโลกไดทุกเมื่อจึงมีความสําคัญยิ่ง"
 ETH_copy_plane_designs: "ลอกแบบเครื่องบิน"
 ETH_copy_plane_designs_desc: "แทบไมมีประโยชนที่จะคิดคนสิ่งที่คนอื่นพัฒนาไวแลวขึ้นใหม เราจะผลิตเครื่องบินตามแบบของชาติอื่น และใชประโยชนจากการลงทุนวิจัยของพวกเขา"
 ETH_copy_light_plane_tt: "สรางรุนยอยของ §Y$iw_small_airframe$: [ITA.GetFlag]CR.32§!"
 ETH_copy_medium_plane_tt: "สรางรุนยอยของ §Y$iw_medium_airframe$: [ITA.GetFlag]Ca.101§!"
 ETH_asmera_naval_college: "[GetNavalCollegeName]"
 ETH_asmera_naval_college_desc: "การผลิตและบํารุงรักษาเรือเพียงอยางเดียวไมเพียงพอที่จะเปนกองทัพเรือ เราตองการนายทหารและผูเชี่ยวชาญที่ไดรับการฝกอยางดีในการใชกําลังทางเรือในการรบ ดังนั้นเราจะกอตั้งโรงเรียนนายเรือแหงแรกของ [ETH.GetName]"
 ETH_asmera_naval_college_tt: "ปรับ §Y[GetEthiopianNavySpiritName]§! โดย:\n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$: §G-30%§!"
 unlock_spirit_of_naval_academy_tt: "ปลดล็อก §Yจิตวิญญาณแหงโรงเรียนนายเรือ§!"
 ETH_naval_college_reduction: "การวิจัยวิทยาลัยการทัพเรือ"
 ETH_capital_school_of_technology: "โรงเรียนเทคโนโลยี[ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_capital_school_of_technology_desc: "การปฏิรูปการศึกษาของเรากําลังประสบความสําเร็จและคุมคากับการลงทุน เราควรเรงความกาวหนาดวยการรวบรวมวิศวกรผูเชี่ยวชาญของชาติไวในโรงเรียนเทคโนโลยีแหงเดียว"
 ETH_regional_supply_depots: "คลังเสบียงประจําภูมิภาค"
 ETH_regional_supply_depots_desc: "ทหารของเราจะไมสามารถปกปองมาตุภูมิไดหากไมมีกระสุนหรืออาหาร อยางไรเสีย กองทัพเดินดวยทอง เราควรทําใหแนใจวาพวกเขามีเสบียงพรอมเสมอ ดวยการตั้งคลังเสบียงทางทหารประจําภูมิภาคทั่ว [ETH.GetName]"
 ETH_expand_the_levy: "ขยาย [GetChitetName]"
 ETH_expand_the_levy_desc: "ดวยการสนับสนุนและการฝกที่ดีขึ้น [GetChitetName] ไดกลายเปนกองกําลังทหารที่แข็งแกรงและยืดหยุน ดวยฐานอันมั่นคงนี้ เราจะขยาย [GetChitetName] เพื่อยับยั้งผูรุกรานตางชาติ"
 ETH_expand_the_levy_tt: "เพิ่มจํานวนกองพลชิเตต เซฟารีที่สงเขาสนามไดเปน §Y48§!\nเพิ่มกองพัน §Y3 $irregular_infantry$§! ใหกองพลชิเตต เซฟารี เพิ่ม §Y$engineer$§!, §Y$military_police$§! และ §Y$field_hospital$§! หากวิจัยเทคโนโลยีที่เกี่ยวของแลว"
 ETH_the_junior_officer_corps: "คณะนายทหารชั้นผูนอย"
 ETH_the_junior_officer_corps_desc: "กองทัพถูกครอบงําโดยชนชั้นสูงมานานหลายศตวรรษ หากเราตองการใหกองทัพมีประสิทธิภาพในสนามรบยิ่งขึ้น เราตองตั้งโรงเรียนนายทหารและโครงการฝกที่สงเสริมระบบคุณธรรมมากกวาระบบอุปถัมภ กาวแรกสูเปาหมายนั้นคือการจัดตั้งคณะนายทหารชั้นผูนอย"
 ETH_camouflage: "การพรางตัว"
 ETH_camouflage_desc: "เมื่ออากาศยานเขามามีบทบาทในสนามรบ การสรางความจูโจมก็ยากขึ้นเรื่อย ๆ เพื่อลดการมองเห็นเจตนาทางยุทธวิธีของเรา ทหารของเราจําเปนตองฝกการพรางตัวและการซอนพราง"
 ETH_camouflage_army_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n $MODIFIER_CAS_DAMAGE_REDUCTION$: §G+10%§! \n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§!"
 ETH_camouflage_air_tt: "ปรับ §Y[GetEthiopianAirforceSpiritName]§! โดย:\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-15%§! "
 ETH_the_fetno-derash: "เฟตโน-เดราช"
 ETH_the_fetno-derash_desc: "งานขาวกรองกําลังกลายเปนปจจัยชี้ขาดมากขึ้นเรื่อย ๆ ไมเพียงในสนามรบ แตยังรวมถึงการรักษาความปลอดภัยของผูนําทางการเมืองดวย ดังนั้นเราจะจัดตั้งหนวยขาวกรองโดยเฉพาะเพื่อรักษาความมั่นคงและเขาใจศัตรูไดดียิ่งขึ้น"
 ETH_debre_zeyit_air_force_training_center: "ศูนยฝกกองทัพอากาศ [ETHGetAirBaseName]"
 ETH_debre_zeyit_air_force_training_center_desc: "การบังคับเครื่องบินนั้นยากอยูแลวในตัวเอง การบินเขาสูการรบยอมตองอาศัยความเชี่ยวชาญยิ่งกวานั้น เพื่อใหมั่นใจวานักบินของเราพรอมปฏิบัติภารกิจ เราจะกอตั้งศูนยฝกกองทัพอากาศโดยเฉพาะและเริ่มทําใหการฝกเปนมาตรฐาน"
