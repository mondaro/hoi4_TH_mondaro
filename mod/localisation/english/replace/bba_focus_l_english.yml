 ETH_support_anti-colonialist_resistance: "สนับสนุนการตอตานลัทธิอาณานิคม"
 ETH_support_anti-colonialist_resistance_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเพิ่มการตอตานในรัฐอาณานิคมใน§Yแอฟริกาตะวันออก§!"
 ETH_support_anti-colonialist_resistance_desc: "ภัยแหงความขัดแยงจะแขวนอยูเหนือหัวเราไปตลอดหากมหาอํานาจอาณานิคมยังคงยึดที่มั่นในแอฟริกาตะวันออก เราตองผลักพวกเขาออกจากภูมิภาคดวยการปลุกมวลชนและมอบหนทางใหพวกเขาไดเอกราชคืน"
 ETH_empower_the_ras: "เพิ่มอํานาจใหเหลาราส"
 ETH_empower_the_ras_desc: "การเพิ่มอํานาจใหชาวนาผูไรการศึกษาของจักรวรรดิมากไปกวานี้ จะนําไปสูการลมสลายของระบอบจักรวรรดิในระยะยาวเทานั้น เราจะเพิ่มอํานาจใหเหลาราสแทน เพื่อแลกกับความภักดีตอจักรพรรดิอยางตอเนื่อง"
 ETH_re-convene_the_parliament: "เรียกประชุมรัฐสภาอีกครั้ง"
 ETH_re-convene_the_parliament_desc: "ถึงเวลาฟนฟูรัฐธรรมนูญป 1931 และสานตอกระบวนการปรับปรุงสถาบันของ [ETH.GetName] ใหทันสมัย เราจะเรียกประชุมรัฐสภาจักรวรรดิอีกครั้งและเพิ่มจํานวนผูแทน เพื่อปกครองภูมิภาคอันหลากหลายของจักรวรรดิไดดียิ่งขึ้น  "
 ETH_unite_the_afar: "รวมชาวอะฟาร"
 ETH_unite_the_afar_desc: "เมื่อยุโรปหันไปสนใจทวีปของตนเอง เราอาจไดรับการสนับสนุนจากชาวอะฟารทางเหนือดวยการซื้อภูมิภาค [DJI.GetName] และรวมชาวอะฟารเขาดวยกันอีกครั้งหลังการแบงแยกมาหลายทศวรรษ"
 ETH_lord_of_lords: "เจาเหนือเจาทั้งปวง"
 ETH_lord_of_lords_desc: "แมจักรวรรดิของเราจะประกอบดวยหลายวัฒนธรรม แตทุกคนลวนกมคํานับตอเจาเหนือเจาองคเดียวกัน แมแตขุนนางผูสูงศักดิ์ที่สุดก็รูวาหนาที่ของตนคือรับใชจักรพรรดิ พระองคทรงเปนผูปกครองดินแดนเหลานี้โดยไมมีผูใดโตแยงได"
 ETH_elect_of_god: "ผูที่พระเจาทรงเลือก"
 ETH_elect_of_god_desc: "เราเห็นพระเจาในพระราชกรณียกิจของจักรพรรดิ จะอธิบายความสําเร็จของพระองคในสนามรบและในการปกครองจักรวรรดิอันยิ่งใหญของเราไดอยางไรอีกเลา? ประชาชนรูดีวาการทําตามพระบัญชาของจักรพรรดิ คือการกระทําตามพระประสงคของพระผูเปนเจา"
 ETH_restore_the_empire_of_axum: "ฟนฟูจักรวรรดิอักซุม"
 ETH_restore_the_empire_of_axum_desc: "ตั้งแตดินแดนซูดานไปจนถึงคาบสมุทรอาหรับ ครั้งหนึ่งลวนอยูใตการปกครองของบรรพบุรุษเรา อาณาจักรของเราถูกกัดกรอนลงเรื่อย ๆ ตลอดหลายศตวรรษ ทําใหเราตกอยูใตอําเภอใจของชาวยุโรป ถึงเวลาพลิกสถานการณแลว เราจะโอบรับมรดกของเราดวยการสถาปนาจักรวรรดิอักซุมขึ้นใหมและทวงคืนดินแดนของบรรพบุรุษ"
 ETH_restore_the_empire_of_axum_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอตั้งจักรวรรดิอักซุมเมื่อควบคุมรัฐไดมากพอ"
 ETH_a_federal_empire: "จักรวรรดิสหพันธ"
 ETH_a_federal_empire_desc: "ระบอบการปกครองแบบจักรวรรดิมอบเสถียรภาพไดมากกวาความโกลาหลของประชาธิปไตยแบบรัฐสภาอยางเทียบไมได ตราบใดที่เจาผูครองแควนตาง ๆ ยังคงถวายสัตยปฏิญาณตอองคจักรพรรดิ [ETH.GetLeader] เราก็ไมสนใจวาพวกเขาจะปกครองดินแดนของตนอยางไร"
 ETH_a_federal_empire_tt: "นําตัวปรับคา §Y$ETH_state_decentralization_dynamic_modifier$§! ออกจากทุกรัฐ"
 ETH_federal_factories_tt: "เพิ่ม §Y1 ชองสิ่งกอสราง§! และ §Y$industrial_complex$ 1 แหง§! ในรัฐหุนเชิดที่ไดรับการปลดปลอยแตละรัฐ"
 ETH_empower_the_chambers: "เสริมอํานาจสภา"
 ETH_empower_the_chambers_desc: "รัฐธรรมนูญป 1931 ยังไมไดบัญญัติบทบาทขององคจักรพรรดิไวอยางชัดเจนพอ ทั้งยังไมไดใหประชาชนมีสวนรวมในกระบวนการตัดสินใจของรัฐบาลอยางเพียงพอ เราตองเสริมอํานาจใหสภาผูแทนราษฎรโดยมอบอํานาจควบคุมกิจการของรัฐที่มากขึ้น ขณะเดียวกันก็ธํารงบทบาทอันศักดิ์สิทธิ์ขององคจักรพรรดิไว"
 ETH_empower_the_chambers_tt: "ปรับ §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! โดย:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!"
 ETH_the_african_union: "สูเอกภาพแหงแอฟริกา"
 ETH_the_african_union_desc: "เราเรียกรองใหยุติลัทธิอาณานิคม เพราะการที่ชนชาติหนึ่งครอบงําอีกชนชาติหนึ่งนั้นเปนสิ่งผิด การรวมมือกันของชาวแอฟริกันทั้งปวงในการแกปญหารวมเปนสิ่งจําเปนยิ่ง หากเราตองการใหความเห็นของเราไดรับการใหนํ้าหนักอยางสมควร  ดวยเหตุนี้ เราจะยืนหยัดดวยความซื่อตรงและความเชื่อมั่นอันหยั่งรากลึกที่สุดของเรา โดยตอสูเพื่อปลดปลอยทวีปแอฟริกาทั้งทวีป"
 ETH_african_independence_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเพิ่มการตอตานและเรงการเพิ่มอํานาจปกครองตนเองในประเทศแอฟริกา"
 ETH_arabian_independence_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเพิ่มการตอตานและเรงการเพิ่มอํานาจปกครองตนเองในประเทศบนคาบสมุทรอาหรับ"
 ETH_african_independence_join_tt: "อนุญาตให §Y[ROOT.GetNameDef]§! เขาแทรกแซงสงครามประกาศเอกราชในแอฟริกา"
 ETH_african_union_faction: "สหภาพแอฟริกา"
 ETH_pan-africanism: "ลัทธิรวมแอฟริกา"
 ETH_pan-africanism_desc: "เปาหมายแหงความเสมอภาคที่เราแสวงหาคือขั้วตรงขามของการขูดรีดที่ชนชาติหนึ่งกระทําตออีกชนชาติหนึ่ง ซึ่งหนาประวัติศาสตรแอฟริกาในยุคหลังไดบันทึกไวอยางยืดยาว ไมวาความชั่วรายนี้จะแฝงมาในรูปใด ที่ใดยังไมมีก็ตองปองกันไว ที่ใดมีอยูก็ตองบดขยี้ใหสิ้น เปนหนาที่อันศักดิ์สิทธิ์ของเราที่จะทําใหความฝนแหงความเสมอภาคเปนจริงในที่สุดสําหรับทุกคนที่ยังถูกปฏิเสธสิทธินั้น"
 ETH_the_one_true_heir_of_solomon: "รัชทายาทที่แทจริงเพียงหนึ่งเดียวแหงโซโลมอน"
 ETH_the_one_true_heir_of_solomon_desc: "องคจักรพรรดิ [ETH.GetLeader] ทรงสืบสายพระโลหิตยอนกลับไปไดถึงกษัตริยโซโลมอนผูยิ่งใหญ ขณะที่หลายชาติหันหลังใหพระเจา พวกเราชาว[ETH.GetAdjective]ยังคงยึดมั่นในศรัทธาอยางมั่นคง ในยุคแหงความโกลาหลนี้ เปนการสมควรแลวที่รัชทายาทที่แทจริงเพียงหนึ่งเดียวแหงโซโลมอนจะครองดินแดนศักดิ์สิทธิ์ เพื่อปกปองจากอิทธิพลอันเสื่อมทรามของอุดมการณที่มนุษยสรางขึ้น"
 ETH_the_one_true_heir_of_solomon_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอตั้งจักรวรรดิโซโลมอน"
 ETH_jah: "จาห"
 ETH_jah_desc: "ขบวนการราสตาฟารีไดสรางเครือขายผูสนับสนุน[ETH.GetName]ที่คาดไมถึงไปทั่วโลก หลายคนถือวาองคจักรพรรดิ [ETH.Getleader] ของเรามีความสําคัญทางศาสนาอยางยิ่ง บางคนถึงขั้นอางวาพระองคคือรางทรงของพระเจา หรือใหถูกตองกวานั้นคือ จาห บางทีเราควรใชแรงสนับสนุนจากนานาชาตินี้ดวยการโอบรับขบวนการราสตาฟารี"
 ETH_jah_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอตั้งจักรวรรดิไซออน"
 ETH_military_communism: "คอมมิวนิสตทหาร"
 ETH_military_communism_desc: "ความสําเร็จเพียงนอยนิดที่เรามีในแนวหนานั้นมาจากความเฉลียวฉลาดและความกลาหาญของพลทหารสามัญ หาใชผูนําที่สืบทอดตําแหนงทางสายเลือดไม เสียงบนแหงความไมพอใจดังขึ้นเรื่อย ๆ ลัทธิจักรวรรดินิยมไดมาถึงจุดจบแลว  บัดนี้ถึงเวลาแหงการกระจายความมั่งคั่งใหม ดวยกําลัง"
 ETH_defending_our_homes: "ปกปองบานของเรา"
 ETH_defending_our_homes_desc: "กลุมชนชั้นนําของราชสํานักใน[ROOT.Capital.GetCapitalVictoryPointName]สนใจแตความปลอดภัยของตนเอง ขณะที่บานและครอบครัวของพวกเราคือสิ่งที่ถูกทําลาย เราไมอาจปลอยใหเปนเชนนี้ตอไปไดอีกแลว เราจะปกปองมาตุภูมิทุกตารางนิ้ว ไมใชเพื่อองคจักรพรรดิ แตเพื่อตัวเราเอง"
 ETH_anti_imperialist_agitation: "ปลุกระดมตอตานจักรวรรดินิยม"
 ETH_anti_imperialist_agitation_desc: "ความภักดีของประชาชนตอ [ROOT.GetLeader] กําลังสั่นคลอน ดวยความลมเหลวในหนาที่ที่สําคัญที่สุด คือการปกปองประชาชน บรรดาผูนําจอมปลอมของเราไดแสดงใหเห็นถึงความไรความสามารถอยางสิ้นเชิง ทั้งในแนวหนาและบนทองถนน สิ่งที่ครั้งหนึ่งไมอาจจินตนาการไดกลับถูกพูดถึงอยางเปดเผย นั่นคือชาติที่ไรจักรพรรดิ"
 ETH_in_the_name_of_the_people: "ในนามของประชาชน"
 ETH_in_the_name_of_the_people_desc: "ในนามของประชาชน เราจะลมลางทรราชแหงราชวงศที่ปกครอง[ROOT.GetName]มานานหลายศตวรรษ  และสรางสาธารณรัฐของกรรมกรขึ้นแทนที่ ปลอดจากพันธนาการแหงระบบศักดินา และดวยพลังรวมของเรา เราจะเอาชนะฟาสซิสตในแอฟริกา"
 EHT_in_the_name_of_the_people_tt: "สรางกองพลชั้นยอด§Yเรดการด§!ฝายคอมมิวนิสต §Yสอง§!กองพล และกองพลชั้นยอด§Yสิงหดํา§!ฝายอนาธิปไตย §Yสาม§!กองพล ใน[ETH.Capital.GetCapitalVictoryPointName] \n\n§R$ETH_seyoum_mengesha$ จะไมสามารถใชงานไดอีกตอไป!§!"
 ETH_callout_to_the_world: "เสียงเรียกถึงชาวโลก"
 ETH_callout_to_the_world_desc: "การตอสูกับฟาสซิสตของเรามิไดเกิดขึ้นเฉพาะในประเทศของเรา แตเปนสวนหนึ่งของการตอสูระดับโลกกับลัทธิอํานาจนิยม เราจะรวบรวมพลังตอตานฟาสซิสตจากทั่วโลกมารวมอุดมการณของเรา เพราะวันนี้เราคือผูถูกกระทําอยางโหดราย พรุงนี้ก็จะเปนทั้งโลก"
 ETH_callout_to_the_world_tt: "§Y$ENG_sylvia_pankhurst$§! และ §Y$IA_emma_goldman$§! สามารถแตงตั้งเปนที่ปรึกษาได"
 ETH_soviet_aid: "ความชวยเหลือจากโซเวียต"
 ETH_soviet_aid_desc: "เราไดสลัดพันธนาการแหงความภักดีแบบศักดินาออกไปไดสําเร็จ บัดนี้เราตองเอาชนะพวกฟาสซิสตและเริ่มสรางสาธารณรัฐของกรรมกร หากมีใครที่จะเห็นอกเห็นใจอุดมการณของเรา ก็ยอมตองเปนประชาชนแหง[SOV.Getname]อยางแนนอน"
 ETH_soviet_aid_tt: "§R\n[SOV.GetNameDefCap]จะคาดหวังอํานาจควบคุมกิจการของเรามากขึ้นเพื่อแลกกับความชวยเหลือ! §!"
 ETH_humanitarian_aid: "ความชวยเหลือดานมนุษยธรรม"
 ETH_humanitarian_aid_desc: "ศัตรูไมสนใจเลยวาจะสรางความทุกขทรมานแกประชาชนของเรามากเพียงใด หากเปนเชนนี้ตอไป ก็จะไมเหลือประเทศใหปกปองอีก โลกตองไดเห็นความนาสยดสยองที่เกิดขึ้นที่นี่ และเราตองการใหพวกเขาสงความชวยเหลือดานมนุษยธรรมมาโดยทันที"
 ETH_humanitarian_aid_tt: "ปรับ §Y$ETH_international_red_cross_dynamic_modifier$§! โดย:\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!"
 ETH_support_from_the_japanese_communists: "อนาธิปไตย-คอมมิวนิสตญี่ปุน"
 ETH_support_from_the_japanese_communists_desc: "ชาว[JAP.GetAdjective]และชาว[ETH.GetAdjective]ตางใหความเคารพซึ่งกันและกันมาชานาน ในฐานะหนึ่งในไมกี่ชนชาติที่ตานทานการลาอาณานิคมของยุโรปไดสําเร็จ ขณะที่เรากาวพนยุคศักดินาใน[ETH.GetNameDef] ก็มีผูคนใน[JAP.GetNameDef]ที่มีอุดมการณรวมกับเรา และสามารถชวยเราสรางสังคมอนาธิปไตย-คอมมิวนิสตตนแบบได"
 ETH_support_from_the_japanese_communists_tt: "§Y$IA_sakutaro_iwasa$§! และ §Y$IA_sanshiro_ishikawa$§! สามารถแตงตั้งเปนที่ปรึกษาได"
 ETH_support_from_the_japanese_communists_fascist_tt: "§Rอาจทําให [JAP.GetFlag][JAP.GetName] ประกาศควํ่าบาตรทางการคาตอ [ETH.GetFlag][ETH.GetName]!§!"
 ETH_raise_from_the_ranks: "เลื่อนขั้นจากพลทหาร"
 ETH_raise_from_the_ranks_desc: "ชนชั้นขุนนางจะไมไดบัญชาการกองทัพอีกตอไป ทหารผูกลาหาญของเราหลายคนไดพิสูจนตนแลววาเปนผูนําที่มีความสามารถ ถึงเวลาแลวที่เราจะตอบแทนความกลาหาญและทักษะในสนามรบ แทนที่จะเปนเสนสายทางราชวงศหรือความมั่งคั่งสวนตัว"
 ETH_raise_from_the_ranks_tt: "เพิ่มนายทหารใหม §Yสอง§!นายในยศ§Yนายพล§!"
 ETH_soviet_rifles: "ปนไรเฟลโซเวียต"
 ETH_soviet_rifles_desc: "เราเตรียมพรอมไวนอยอยางนาเศราเมื่อ[ITA.GetName]โจมตีเรา บัดนี้อุตสาหกรรมของเราไมอาจรองรับความตองการดานการสงกําลังบํารุงของสงครามสมัยใหมได เราตองมีปนไรเฟลและกระสุนอยูในมือของทุกคนที่ถือมันได บางทีมิตรของเราใน[SOV.Capital.GetCapitalVictoryPointName]อาจชวยได"
 ETH_soviet_rifles_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับยุทโธปกรณทหารราบ §G10,000§! หนวย"
 ETH_military_advisors: "นายพลโซเวียต"
 ETH_military_advisors_desc: "แมนายทหารของเราหลายคนจะปรับตัวเขากับความตองการของสงครามสมัยใหมได แตก็เห็นไดชัดวาสวนใหญตองดนสดอยางดีที่สุดเทาที่ทําได เราสามารถเรียนรูไดมากจากสหายของเราในกองทัพ[SOV.GetAdjective]"
 ETH_military_advisors_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับจอมพล (§Y$SOV_semyon_budyonny$§!) และนายพล (§Y$SOV_vasily_kuznetsov$§!)"
 ETH_international_brigades_communist: "กองพลนานาชาติ"
 ETH_soviet_rejection_tt: "\n[SOV.GetFlag]§Y[SOV.GetNameDefCap]§! §Rมีแนวโนมจะปฏิเสธขอเสนอนี้หากไมไดเปนคอมมิวนิสตอีกตอไปหรือกําลังเผชิญสงครามกลางเมือง!§!"
 ETH_international_brigades_communist_desc: "มีผูคนมากมายทั่วโลกที่เห็นใจการตอสูของเรากับชาว[ITA.GetAdjective] เราควรใชความเห็นใจนี้ใหเปนประโยชน และเปดโอกาสใหพวกเขาจับอาวุธตอสูกับฟาสซิสตเคียงขางเรา"
 ETH_peoples_army_focus: "กองทัพประชาชน"
 ETH_peoples_army_focus_desc: "แมในชวงแรกเราจะออนแอในการทําสงครามสมัยใหม แตเราก็สามารถชะลอการรุกรานของ[ITA.GetAdjective]ไดดวยยุทธวิธีนอกแบบ เราสามารถบรรจุสิ่งนี้ไวในหลักนิยมทางทหาร และฝกนายทหารใหรูวิธีทําสงครามอสมมาตรได"
 ETH_the_new_administration: "การบริหารชุดใหม"
 ETH_the_new_administration_desc: "ทามกลางความวุนวายที่ผานมา มีหลายคนที่ทุมเทเกินหนาที่เพื่อปกปองประเทศของเรา บางคน เชน เซเนดู เกบรู ยังมีทักษะและความรูที่จะพัฒนาสังคมไดอยางกาวกระโดด บัดนี้เราจะมอบโอกาสใหพวกเขาไดทําเชนนั้น"
 ETH_the_new_administration_tt: "§Yเซเนดู เกบรู§! สามารถแตงตั้งเปนที่ปรึกษาทางการเมืองได\n   $rebellious_educator_tt$ \nบุคคลแบบ§Yสุม§!อีกสองคนจะสามารถแตงตั้งเปนที่ปรึกษาทางการเมืองไดเชนกัน"
 ETH_clearing_the_skies: "กวาดลางนานฟา"
 ETH_clearing_the_skies_desc: "ทหารของเราตกเปนเปาของเครื่องบินขาศึกโดยไมมีทางปองกันตนเองเลย ที่แยไปกวานั้น ศัตรูยังรูตําแหนงวางกําลังและการเคลื่อนไหวของเราอยูเสมอ เราตองมีกองทัพอากาศและมาตรการตอบโตของเราเองหากหวังจะไดชัยชนะ ดวยเหตุนี้ เราควรสงอาสาสมัครไปฝกกับกองทัพอากาศ[SOV.GetAdjective]"
 ETH_clearing_the_skies_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับเครื่องบินขับไล[SOV.GetAdjective] §G100§! ลํา และเทคโนโลยี§Yเครื่องบินขับไลยุคแรก§!"
 ETH_counter_the_armored_threat: "รับมือภัยคุกคามจากยานเกราะ"
 ETH_counter_the_armored_threat_desc: "การสงครามดวยยานเกราะกําลังเขามาแทนที่บทบาทของทหารมาในสนามรบอยางชัดเจน นาเสียดายที่เราไมมีวิธีรับมือยานเกราะของ[ITA.GetAdjective]อยางเพียงพอ และอุตสาหกรรมของเราก็ยังไมพรอมจะผลิตยานเกราะเอง บางที[SOV.GetName]อาจยินดีสละยานเกราะรุนเกาบางสวนของพวกเขาใหเรา?"
 ETH_counter_the_armored_threat_LaR_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับเทคโนโลยี§Yรถหุมเกราะยุคระหวางสงคราม§! และรถหุมเกราะ[SOV.GetAdjective] §G480§! คัน"
 ETH_counter_the_armored_threat_NoLaR_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับเทคโนโลยี§Yรถถังยุคระหวางสงคราม§! และรถถัง[SOV.GetAdjective] §G200§! คัน"
 ETH_counter_the_armored_threat_NoNSB_tt: "\nหาก [SOV.GetFlag]§Y[SOV.GetName]§! ตกลง [ETH.GetFlag]§Y[ETH.GetName]§! จะไดรับเทคโนโลยี§Yรถถังยุคมหาสงคราม§! และรถถัง[SOV.GetAdjective] §G200§! คัน"
 ETH_peace_negotiations: "การเจรจาสันติภาพ"
 ETH_peace_negotiations_desc: "ประชาชนของเราเสียสละอยางมากเพื่อหยุดยั้งการรุกรานของ[ITA.GetAdjective] บัดนี้เมื่อเราไดพิสูจนใหชาว[ITA.GetAdjective]เห็นแลววาเราจะไมลมสลายตอหนาพวกเขา เราจึงมีโอกาสสรางสันติภาพ หรืออยางนอยที่สุดก็ขอตกลงหยุดยิง"
 ETH_soviet_mediation: "การไกลเกลี่ยของโซเวียต"
 ETH_soviet_mediation_desc: "แมประชาชนของเราจะทุมเทอยางกลาหาญในการหยุดยั้งการรุกรานของ[ITA.GetAdjective] แตเรายังหางไกลจากการไดชัยชนะเหนือพวกเขาอยางเบ็ดเสร็จ สันนิบาตชาติไดแสดงใหเห็นแลววาไมเต็มใจจะชวยเหลือเรา ความหวังเดียวของเราจึงอยูที่[SOV.GetNameDefCap]"
 ETH_soviet_mediation_tt: "§R\n[SOV.GetNameDefCap]อาจพยายามเขาควบคุมเราเพื่อแลกกับการเจรจากับ[ITA.GetName]! §!"
 ETH_support_spain: "สนับสนุนสเปน"
 ETH_support_spain_desc: "สเปนตองทนทุกขในเงื้อมมือของพวกฟาสซิสตในประเทศ ถึงกระนั้น ก็ยังมีผูที่เชื่อเชนเดียวกับเรา วาฟาสซิสตตองเผชิญการตอตานอยางแข็งขัน และประชาชนสามารถปกครองตนเองได เราจะใชบทเรียนจากสงครามกับชาว[ITA.GetAdjective]เพื่อชวยเหลือขบวนการตอตานของ[SPC.GetAdjective]"
 ETH_local_committees: "คณะกรรมการทองถิ่น"
 ETH_local_committees_desc: "เรามีโอกาสสรางระบบการปกครองใหม ปลอดจากลําดับชั้นที่ไรประโยชนซึ่งยอมกอใหเกิดการทุจริตและกดทับเจตจํานงของประชาชน เราควรใชโอกาสนี้กอตั้งสหพันธคอมมูน ซึ่งแตละแหงยึดถือหลักการอนาธิปไตย-คอมมิวนิสต"
 ETH_a_guiding_hand: "มือนําทาง"
 ETH_a_guiding_hand_desc: "แนวรวมคอมมูนอยางหลวม ๆ ที่ไรอํานาจเหนือกวานั้นเปนอุดมคติเกินไป เราตองมีคณะรัฐมนตรีที่ประกอบดวยผูแทนและผูเชี่ยวชาญเพื่อกําหนดทิศทางนโยบายเศรษฐกิจและรับมือเหตุฉุกเฉินไดอยางรวดเร็ว เราจะไมยอมใหตนเองซํ้ารอยความลมเหลวของการบริหารแบบจักรวรรดิในยามวิกฤตอีกเด็ดขาด"
 ETH_transformation_of_nature: "เปลี่ยนแปลงธรรมชาติ"
 ETH_transformation_of_nature_desc: "[ETH.GetNameDefCap]อุดมไปดวยทรัพยากรธรรมชาติที่รอการนํามาใช ดวยการสรางเขื่อนไฟฟาพลังนํ้าบนแมนํ้าของเรา เราจะนําไฟฟาไปสูทุกครัวเรือนในแผนดิน ขณะเดียวกัน เราก็สามารถใชทางนํ้าเพื่อขยายศักยภาพการเกษตรใหรองรับประชากรที่เพิ่มขึ้น"
 ETH_transformation_of_nature_tt: "(§Yรัฐที่ครอบครองซึ่งสุมเลือก 4 รัฐ§!): เพิ่มชองสิ่งกอสราง §G1§! ชอง"
 ETH_laying_the_tracks: "วางรางรถไฟ"
 ETH_laying_the_tracks_desc: "ประชากรและอุตสาหกรรมสวนใหญกระจุกตัวอยูทางตะวันตกของประเทศ ดังนั้น เพื่อใชทรัพยากรธรรมชาติอันอุดมสมบูรณใหคุมคายิ่งขึ้น เราตองขยายเครือขายทางรถไฟครั้งใหญเพื่อขนสงทรัพยากรไปยังโรงงานของเรา"
 ETH_red_army_engineers: "วิศวกรกองทัพแดง"
 ETH_red_army_engineers_desc: "โครงสรางพื้นฐานของชาติเราเสียหายอยางหนักระหวางการรุกรานของ[ITA.GetAdjective] หากเราตองการสรางสาธารณรัฐของกรรมกรที่แทจริง เราไมเพียงตองซอมแซมสิ่งที่เคยมี แตตองเริ่มโครงการอุตสาหกรรมอยางรวดเร็ว เราควรใชทักษะของสหายในกองทัพแดงเพื่อจุดประกายกระบวนการนี้"
 ETH_liberate_aussa: "นําการปฏิวัติสูอาฟาร"
 ETH_liberate_aussa_desc: "[AFA.GetNameDefCap]ถูกปกครองโดยคณาธิปไตยทรยศที่เขาขางศัตรูของเรามาหลายครั้ง ภัยคุกคามตอ[ETH.GetNameDef]เชนนี้ไมอาจเพิกเฉยไดอีกตอไป เราจะปลดปลอยประชาชน[AFA.GetAdjective]และผนวกภูมิภาคนี้เขากับสาธารณรัฐของกรรมกร"
 ETH_demand_DJI: "ปลดปลอย[268.GetName]"
 ETH_demand_DJI_desc: "เมื่อปลดปลอย[AFA.GetName]แลว บัดนี้เราปกครองชาวอาฟารจํานวนไมนอย ทวาชาวอาฟารยังคงถูกแบงแยกเนื่องจากการยึดครอง[DJI.GetName]ของ[FRA.GetAdjective] ดวยการเรียกรองใหปลดปลอยชาวอาฟารจากการปกครองของจักรวรรดินิยม เราอาจไดรับความภักดีจากชาวอาฟารและไดเมืองทายุทธศาสตรมาดวย"
 ETH_the_rif: "ริฟ"
 ETH_the_rif_desc: "พวกฟาสซิสตหลายคนที่กําลังแยงชิงอํานาจในสเปน เคยเปนทหารที่บดขยี้สาธารณรัฐริฟในโมร็อกโกตอนเหนือมากอน เราควรใชความสัมพันธใกลชิดกับ[SPC.GetName]ผลักดันใหปลดปลอยดินแดนอาณานิคมในแอฟริกาของพวกเขา หากพวกเขาเปนสหายของเราจริง ยอมตองเห็นดวย และหากไม เราก็รูอยูแลววาจะจัดการกับลัทธิอาณานิคมอยางไร"
 #ETH_social_reforms: "Social Reforms"
 #ETH_social_reforms_desc: "Without the threat of a common enemy to unite us, we often find ourselves divided due to historic, cultural and religious grievances. We need a wave of social reforms to overcome these divisions so that we can remain united and continue the process of building a better [ETH.GetName]."
 #ETH_social_reforms_tt: "Unlock anarcho-communist social reform decisions."
 ETH_communal_education: "การศึกษาของชุมชน"
 ETH_communal_education_desc: "การทําใหทุกชุมชนใน[ETH.GetNameDef]เขาถึงการศึกษาผานโรงเรียนและหองสมุดเปนสิ่งจําเปน หากเราตองการยกระดับคุณภาพชีวิตของประชากร"
 ETH_african_wildfire: "ไฟลามทุงแอฟริกา"
 ETH_african_wildfire_desc: "เราเอาชนะการรุกรานของ[ITA.GetAdjective]ไดสําเร็จ แตเราไมควรหยุดพักจนกวาแอฟริกาทั้งทวีปจะหลุดพนจากความโหดรายของลัทธิอาณานิคม เราควรใชทักษะและทรัพยากรของเราโหมไฟแหงการตอตานไปทั่วทวีป และบีบใหพวกจักรวรรดินิยมถอนตัวออกไป"
 ETH_flames_across_the_sea: "เปลวไฟขามทะเล"
 ETH_flames_across_the_sea_desc: "ไมใชเพียงแอฟริกาเทานั้นที่ทนทุกขภายใตอํานาจครอบงําของยุโรป เพื่อนบานของเราอีกฟากทะเลแดงแทบไมมีเอกราชที่แทจริงจากขอเรียกรองของพวกจักรวรรดินิยมเลย เราควรแผเปลวไฟแหงการตอตานไปยังคาบสมุทรอาหรับ เพื่อใหประชาชนที่นั่นมีโอกาสไดปกครองตนเองอยางสมบูรณในสักวัน"
 ETH_heavy_industry: "อุตสาหกรรมหนัก"
 ETH_heavy_industry_desc: "เราตองเดินหนาสรางอุตสาหกรรมอยางรวดเร็วตอไป หากตองการหลุดพนจากเงื้อมมือของเศรษฐกิจแบบศักดินา การสรางอุตสาหกรรมหนักจะดึงดูดแรงงานเขาสูเมือง และสรางชนชั้นกรรมาชีพตนแบบขึ้นแทนที่ชาวนาที่มีอยูเดิม"
 ETH_arms_production: "การผลิตอาวุธ"
 ETH_arms_production_desc: "จุดสูงสุดของการพัฒนาอุตสาหกรรมคือการสรางอุตสาหกรรมอาวุธของเราเอง เราจะไมตองพึ่งพาชาติอื่นเพื่อยุทโธปกรณปองกันประเทศอีกตอไป"
 ETH_mytishchi-ababa_plant: "โรงงานมิติชชี-อาบาบา"
 ETH_mytishchi-ababa_plant_desc: "เราควรใชความสัมพันธใกลชิดกับสหภาพโซเวียตเพื่อรับความเชี่ยวชาญในการผลิตเครื่องจักรสําหรับพลเรือนและการทหาร โครงการโรงงานรวมทุนจะเปนกลไกที่สมบูรณแบบในการไดมาซึ่งความรูนี้ และจะมีใครเหมาะเปนหุนสวนไปกวาโรงงานสรางเครื่องจักรมิติชชีอีกเลา"
 ETH_send_home_advisors: "สงที่ปรึกษากลับบาน"
 ETH_send_home_advisors_desc: "แมเราจะไดประโยชนจากการสนับสนุนของ[SOV.GetName]ระหวางสงครามกับ[ITA.GetName] แตเราไมเคยคาดคิดวาพวกเขาจะบีบใหเราตองตกอยูในฐานะผูรับใชเชนนี้ ขณะที่เราสรางขีดความสามารถทางอุตสาหกรรมและการทหารของตนเอง เราก็มีกําลังมากขึ้นเรื่อย ๆ ที่จะตานทานขอเรียกรองของ[SOV.GetAdjective] ดวยเหตุนี้ ถึงเวลาแลวที่เราจะประกาศใหชัดวาใครคือผูมีอํานาจใน[ETH.Capital.GetCapitalVictoryPointName]"
 ETH_send_home_advisors_tt: "สงที่ปรึกษาทางทหาร[SOV.GetAdjective]ทั้งหมดกลับไปยัง[SOV.GetNameDef]"
 ETH_soviet-ethiopian_trade_agreement: "ขอตกลงการคาโซเวียต-เอธิโอเปย"
 ETH_soviet-ethiopian_trade_agreement_desc: "หลายประเทศทั่วโลกลังเลที่จะคาขายกับเราเพราะตอตานสาธารณรัฐของกรรมกรในเชิงอุดมการณ อยางไรก็ตาม เรามีโอกาสทําขอตกลงการคาที่เปนประโยชนรวมกันกับชาว[SOV.GetAdjective] ซึ่งจะทําใหเราแลกเปลี่ยนทรัพยากรและสินคาไดโดยไมมีกําแพงการคาตามปกติ"
 ETH_seek_new_trading_partners: "แสวงหาคูคารายใหม"
 ETH_seek_new_trading_partners_desc: "ผูคนทั่วโลกตางปรารถนาความมั่งคั่งที่ประเทศของเรามีให ทวาเรากลับติดอยูกับการคาขายเฉพาะกับชาว[SOV.GetAdjective] เราควรติดตอชาติอื่น ๆ เพื่อแสดงใหเห็นวาเรามิใชเพียงสวนตอขยายของ[SOV.GetName] และเริ่มดึงความมั่งคั่งกลับคืนสูประชาชน[ETH.GetAdjective]"
 ETH_freedom_at_gunpoint: "เสรีภาพจากปลายกระบอกปน"
 ETH_freedom_at_gunpoint_desc: "เราสามารถขับไลชาว[ITA.GetAdjective]ที่พยายามกดขี่ประชาชนของเราไดหลายครั้งแลว ทวาเพื่อนบานของเรากลับไมโชคดีเชนนั้นในการตานทานพวกเจาอาณานิคม ถึงเวลาแลวที่เราจะนําประสบการณสงครามและพลังทางเศรษฐกิจที่เพิ่งไดมาไปใชปลดปลอยแอฟริกา ดวยภาษาเดียวที่มหาอํานาจอาณานิคมเขาใจ นั่นคือกําลังอันดิบเถื่อน"
 ETH_freedom_at_gunpoint_tt: "ปลดล็อกการตัดสินใจ§Yเสรีภาพจากปลายกระบอกปน§!เพื่อปลดปลอยชาติแอฟริกา"
 ETH_boots_on_the_shore: "ยกพลขึ้นฝง"
 ETH_boots_on_the_shore_desc: "เรามีประวัติศาสตรอันยาวนานในการคาขายและแลกเปลี่ยนวัฒนธรรมกับผูคนบนคาบสมุทรอาหรับ นาเสียดายที่พวกเขายังติดอยูในระบอบการปกครองแบบศักดินา หากเราปลดปลอยประชาชนบนคาบสมุทรได เราจะควบคุมเสนทางการคาสําคัญตามทะเลแดง และแผอิทธิพลลึกเขาไปในตะวันออกกลางได"
 ETH_request_soviet_hulls: "ขอตัวเรือประจัญบานโซเวียต"
 ETH_request_soviet_hulls_desc: "หากเราตองการหลีกเลี่ยงการถูกปดลอมทางทะเลในความขัดแยงครั้งตอไป เราตองเรียนรูวิธีตอเรือของเราเอง [SOV.GetNameDefCap]เพิ่งยกเลิกโครงการเรือประจัญบานบางสวน และอาจยินดีขายตัวเรือที่ยังสรางไมเสร็จใหเรา เราสามารถเรียนรูไดมากมายจากการซื้อครั้งนี้"
 ETH_organization_of_african_unity: "องคการเอกภาพแอฟริกา"
 ETH_organization_of_african_unity_desc: "ที่ผานมา การหลุดพนจากการลาอาณานิคมของยุโรปถูกมองวาเปนเพียงเรื่องของการไดรับเอกราช ทวาดูเหมือนเราทุกคนยังคงเปนเปาหมายที่อาจถูกพิชิตไดในสายตาของผูนําหลายคนนอกแอฟริกา มีเพียงการยืนหยัดรวมกันและรวมมือกันเทานั้น ประชาชนแหงแอฟริกาจึงจะหวังตานทานไมใหตกเปนเมืองขึ้นอีกครั้งได"
 ETH_organization_of_african_unity_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญประเทศแอฟริกาที่เปนเอกราชเขารวม§Yองคการเอกภาพแอฟริกา§!"
 ETH_pan-africanism_liberate_tt: "ไดรับ§Yเปาหมายสงครามปลดปลอย§!ตอมหาอํานาจอาณานิคมทั้งหมดในแอฟริกา:"
 ETH_executive_council: "คณะมนตรีบริหาร"
 ETH_executive_council_desc: "เราควรผลักดันความรวมมือที่มากขึ้นในองคการเอกภาพแอฟริกา ดวยการจัดตั้งองคกรบริหารที่ดําเนินการตามเจตจํานงของประชาชน และสามารถรับมือภัยคุกคามตอเสถียรภาพในภูมิภาคไดอยางรวดเร็ว"
 ETH_executive_council_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญสมาชิก§Yองคการเอกภาพแอฟริกา§!เขารวมคณะมนตรีบริหาร"
 ETH_african_union: "สหภาพแอฟริกา"
 ETH_african_union_desc: "ถึงเวลาแลวที่ประชาชนแหงแอฟริกาจะรวมเปนหนึ่งเดียวในสหภาพแอฟริกา เราจะไมถูกคุกคามโดยพวกจักรวรรดินิยมหรือฟาสซิสตอีกตอไป ขณะที่เรามุงมั่นเปนมหาอํานาจแหงแรกของแอฟริกา"
 ETH_african_union_tt: "ปลดล็อกการตัดสินใจเพื่อผนวกสมาชิก§Yคณะมนตรีบริหาร§!เขาสู§Yสหภาพแอฟริกา§!"
 ETH_african_central_bank: "[ETH_GetCentralBankName]"
 ETH_african_central_bank_desc: "ดวยการจัดตั้ง[ETH_GetCentralBankName] เราสามารถเริ่มกระบวนการบูรณาการเศรษฐกิจภายในองคการเอกภาพแอฟริกาได ซึ่งจะทําใหเราใชทรัพยากรและโครงสรางพื้นฐานไดอยางมีประสิทธิภาพยิ่งขึ้นเพื่อประโยชนของรัฐสมาชิกทั้งหมด"
 ETH_african_central_bank_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญสมาชิก§Yองคการเอกภาพแอฟริกา§!เขารวม[ETH_GetCentralBankName]"
 ETH_african_central_bank_2_tt: "$MODIFIER_STABILITY_FACTOR$: §G5%§! \n$modifier_production_speed_industrial_complex_factor$: §G10%§! \n$modifier_production_speed_infrastructure_factor$: §G10%§!"
 ETH_mass_transit: "ขนสงมวลชนแบบรวมหมู"
 ETH_mass_transit_desc: "โครงสรางพื้นฐานดานการขนสงของเราสวนใหญลาสมัยและตองจัดระเบียบใหมเพื่อใหใชงานไดอยางมีประสิทธิภาพยิ่งขึ้น ผูที่เหมาะสมที่สุดที่จะดําเนินการปฏิรูปนี้ คือเหลากรรมกรที่ปฏิบัติงานกับโครงสรางพื้นฐานนั้นเอง"
 ETH_mutual_defense: "การปองกันรวมกัน"
 ETH_mutual_defense_desc: "ประชาชนแหงแอฟริกาจะไมมีวันไดรับสันติภาพที่ยั่งยืน จนกวาชาติตาง ๆ ในโลกจะตระหนักวาราคาของการพยายามลาอาณานิคมเรานั้นสูงเกินไป เพื่อบรรลุเปาหมายนี้ สมาชิกองคการเอกภาพแอฟริกาควรทําขอตกลงปองกันรวมกัน โดยสัญญาวาจะปกปองกันและกันหากผูใดในหมูเราถูกโจมตี"
 ETH_mutual_defense_tt: "ปลดล็อกการตัดสินใจเพื่อเชิญสมาชิก§Yองคการเอกภาพแอฟริกา§!เขารวมขอตกลงปองกันรวมกัน"
 ETH_our_own_path: "เสนทางของเราเอง"
 ETH_our_own_path_desc: "เราออนแอเกินกวาจะตานทานชาว[SOV.GetAdjective]เมื่อพวกเขาทรยศเราดวยการเขาควบคุมกิจการของเรา บัดนี้เราอยูในสถานะที่แข็งแกรงกวามาก และในที่สุดก็สามารถเคลื่อนไหวเพื่อทวงคืนเอกราชได อยางไรก็ตาม เราควรเตรียมพรอมรับการตอบโตที่อาจเกิดขึ้นจากชาว[SOV.GetAdjective]"
 ETH_our_own_path_tt: "§R[SOV.GetNameDefCap]จะโกรธเคืองตอการกระทํานี้ และอาจพยายามนําเอธิโอเปยกลับมาอยูใตการควบคุมของ[SOV.GetAdjective]!§!"
 ETH_communal_agriculture: "เกษตรกรรมของชุมชน"
 ETH_communal_agriculture_desc: "ดวยการทําเกษตรกรรมแบบรวมหมูและนําวิธีการเพาะปลูกแบบใหมมาใช เราจะเพิ่มผลผลิตทางการเกษตรไดมหาศาลและรับประกันวาทุกคนจะเขาถึงอาหารได อีกทั้งยังทําใหชาวนาที่ไดรับการปลดปลอยหางานอื่นทําในเมืองได แทนที่จะทําเกษตรเพียงเพื่อยังชีพ"
 ETH_communal_agriculture_industry_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"
 ETH_communal_agriculture_consumer_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5%§!"
 ETH_seize_the_means: "ยึดปจจัยการผลิต"
 ETH_seize_the_means_desc: "กรรมกร[ETH.GetAdjective]หลายชั่วรุนไดไถหวานไรนาและสรางอุตสาหกรรมของเมือง เลือดของพวกเขาซึมอยูในผืนดิน ดังนั้น เราจะไมยอมใหกลุมคนมั่งคั่งอางกรรมสิทธิ์ในทรัพยสินเหลานั้นอีกตอไป ทรัพยสินทั้งหมดจะถูกสงคืนแกประชาชน"
 ETH_preparing_for_the_inevitable: "เตรียมรับสิ่งที่หลีกเลี่ยงไมได"
 ETH_preparing_for_the_inevitable_desc: "ผูมีอํานาจทั่วโลกจะไมยอมทนตอการปฏิรูปอยางถึงรากของเราใน[ETH.GetNameDef] ดวยเกรงวาประชาชนของพวกเขาจะเรียกรองแบบเดียวกัน เราตองเตรียมพรอมรับความพยายามที่หลีกเลี่ยงไมไดของพวกเขาในการบดขยี้วิถีชีวิตของเรา"
 ETH_refuge_for_the_spanish_exiles: "ที่พักพิงแกผูลี้ภัยชาวสเปน"
 ETH_refuge_for_the_spanish_exiles_desc: "สหายรวมอุดมการณของเราในสเปนไดเห็นความฝนแหงอนาธิปไตยถูกบดขยี้โดยความรวมมือของพวกฟาสซิสต พวกสตาลินนิสต และพวกนายทุนจากทั่วโลก เราตองเปดพรมแดนตอนรับมิตรสหายที่ตองพลัดถิ่น และมอบโอกาสครั้งที่สองใหพวกเขาไดสรางอนาคตที่ดีกวา"

 ETH_the_lion_and_the_sun: "สิงหและดวงอาทิตย"
 ETH_the_lion_and_the_sun_desc: "องคจักรพรรดิ [ETH.GetLeader] และจักรพรรดิญี่ปุน [JAP.GetLeader] ทรงพบจุดรวมมากมายระหวางจักรวรรดิอันยิ่งใหญของทั้งสอง  [JAP.GetLeader] ถึงกับทรงเสนอวารัฐบาลของพระองคจะลงทุนใน[ETH.GetName] เมื่อเรายึดมาตุภูมิคืนไดในที่สุด"
 ETH_japanese_investments_tt: "ปลดล็อก§Yการตัดสินใจ§!สําหรับการลงทุนของญี่ปุนใน[ROOT.GetName] เมื่อ[ROOT.GetName]ไดรับการปลดปลอยแลว"
 ETH_an_ethiopian_navy_in_exile: "กองทัพเรือเอธิโอเปยพลัดถิ่น"
 ETH_an_ethiopian_navy_in_exile_desc: "หลังจากไดทอดพระเนตรการแสดงแสนยานุภาพทางเรือของ[JAP.GetAdjective] องคจักรพรรดิ [ETH.GetLeader] ทรงขอความชวยเหลือจากเจาบานผูมีนํ้าใจของเราในการสรางกองทัพเรือ[ETH.GetAdjective] เพื่อชวยปลดปลอยมาตุภูมิและปกปองจากการโจมตีใด ๆ ในอนาคต"
 ETH_an_arabic_base: "ฐานที่มั่นในอาหรับ"
 ETH_an_arabic_base_desc: "เปนที่ชัดเจนขึ้นเรื่อย ๆ วา[JAP.GetName]ตั้งใจจะปรับโฉมภูมิภาคเอเชีย-แปซิฟกในอีกไมกี่ปขางหนา เมื่อเราผูกตนเองเขากับ[JAP.GetAdjective]มากขึ้นทุกที ก็สมเหตุสมผลที่เราจะแบงชิ้นสวนมาเปนของตนบาง เริ่มแรก เราควรขอควบคุมดินแดนของบรรพบุรุษเราบนคาบสมุทรอาหรับ"
 ETH_uk_arabia_tt: "รัฐ§Yอาหรับ§!ใดก็ตามถูกครอบครองโดย §Y[ENG.GetNameWithFlag]§! หรือ§Yพันธมิตร§!ของ §Y[ENG.GetNameDef]§!"
 ETH_an_empire_in_the_shade_of_the_sun: "จักรวรรดิใตรมเงาอาทิตย"
 ETH_an_empire_in_the_shade_of_the_sun_desc: "องคจักรพรรดิ [ETH.GetLeader] ทรงเปนจักรพรรดิที่ไรจักรวรรดิ สิ่งนี้ไมเพียงเปนความอัปยศตอองคจักรพรรดิ แตยังจํากัดความสามารถของเราในการเตรียมการปลดปลอย[ETH.GetName] บางทีมิตรของเราใน[JAP.Capital.GetCapitalVictoryPointName]อาจยินดีใหเราควบคุมเกาะสักแหง เพื่อใชเปนฐานปฏิบัติการสําหรับการปลดปลอยมาตุภูมิในที่สุด"
 ETH_japan_has_island_tt: "ญี่ปุนควบคุมรัฐที่เปนเกาะซึ่งไมใชดินแดนหลักอยางนอยหนึ่งรัฐ"
 ETH_japan_joins_tt: "§Y[JAP.GetNameDefCap]§! จะเขารวมสงครามของ §Y[ROOT.GetName]§! กับ[ITA.GetName]\n§Y[ROOT.GetName]§! จะกลายเปนรัฐหุนเชิดของ §Y[JAP.GetName]§!"

 ETH_an_audience_with_countryleadertitle: "เขาเฝา[GetGermanCountryLeaderTitle]"
 ETH_an_audience_with_countryleadertitle_desc: "[GER.GetLeader]มีแผนการอันทะเยอทะยานที่จะจัดระเบียบใหม ไมเพียงแต[GER.GetNameDef] แตรวมถึงทั้งโลก ดวยการไดพบผูนํา[GER.GetAdjective] โลกจะยังคงมององคจักรพรรดิ [ETH.GetLeader] วาเปนผูปกครองที่แทจริงเพียงหนึ่งเดียวของ[ETH.GetName]"
 GER_fascism_leader_title: "ฟอเรอร"
 GER_male_kaiser_title: "ไกเซอร"
 GER_female_kaiser_title: "ไกเซอริน"
 GER_chancellor_title: "นายกรัฐมนตรี"
 GER_generalfeldmarshall_title: "จอมพล"

 ETH_befriend_goring: "ผูกมิตรกับเกอริง"
 ETH_befriend_goring_desc: "รัฐบาลเยอรมนีเปนใยแมงมุมแหงการวางแผนทางการเมืองและการแทงขางหลัง ใครก็ตามที่ไดรับความไววางใจจาก[GER.GetLeader]ในชวงเวลาใดก็ตาม ยอมมีศักยภาพจะชี้นําการตัดสินใจเชิงนโยบายของ[GER.GetAdjective]ไดอยางมาก บางทีเราอาจไดอิทธิพลบางดวยการผูกมิตรกับสมาชิกชนชั้นปกครอง เชน $GER_hermann_goring$"
 ETH_steel_lions: "สิงหเหล็ก"
 ETH_steel_lions_desc: "[GER.GetNameDefCap]กําลังบุกเบิกวิธีการทําสงครามแบบใหม ยุคของทหารมาหรือสงครามสนามเพลาะไดจบสิ้นแลว อนาคตเปนของรถถัง เราควรใชเวลาที่อยูใน[GER.GetNameDef]เรียนรูวิธีใชอาวุธสงครามสมัยใหม และเตรียมพรอมสําหรับการปลดปลอยมาตุภูมิ"
 ETH_armor_officers_tt: "นายทหาร[ROOT.GetAdjective]สูงสุดสองนายจะไดรับคุณลักษณะ §Y$armor_officer$§!"
 ETH_german_mediation: "การไกลเกลี่ยของ[GER.GetAdjective]"
 ETH_german_mediation_desc: "ขณะที่ความทะเยอทะยานของ[GER.GetAdjective]และ[ITA.GetAdjective]เริ่มสอดคลองกัน ปญหา[ETH.GetName]ยังคงเปนอุปสรรคตอความรวมมือที่แนนแฟนขึ้นของทั้งสองชาติ บางที[GER.GetLeader]อาจโนมนาว[ITA.GetLeader]ใหยุติการยึดครองอันไรเหตุผล และยอมใหองคจักรพรรดิเสด็จกลับสูที่อันชอบธรรมใน[ETH.GetName]"
 ETH_ger_and_ita_have_same_dieology_tt: "[GER.GetFlag]§Y[GER.GetName]§! มีอุดมการณเดียวกับ [ITA.GetFlag]§Y[ITA.GetName]§!"
 ETH_sabotage_italo-german_relations: "บอนทําลายความสัมพันธอิตาลี-เยอรมนี"
 ETH_sabotage_italo-german_relations_desc: "เราไมอาจปลอยให[GER.GetNameDef]และ[ITA.GetName]มองกันและกันเปนพันธมิตรที่เปนไปได เราตองทําทุกวิถีทางเพื่อบอนทําลายความสัมพันธระหวางทั้งสอง มิฉะนั้น เราอาจไดเห็นองคจักรพรรดิตกเปนเชลยของ[ITA.GetLeader] และความฝนถึง[ETH.GetName]ที่เปนอิสระตองพังทลาย"
 ETH_unlock_false_flag_tt: "ปลดล็อกการตัดสินใจเพื่อเริ่มปฏิบัติการจัดฉากใสราย [ITA.GetFlag] §Y[ITA.GetName]§!"

 ETH_joint_swedish-ethiopian_intelligence_program: "โครงการขาวกรองรวมสวีเดน-เอธิโอเปย"
 ETH_joint_swedish-ethiopian_intelligence_program_desc: "การชวยเหลือ[ETH.GetName]โดยตรงจะทําใหเกิดคําถามตอความเปนกลางของ[SWE.GetName] อยางไรก็ตาม พวกเขาอาจยินดีใหการสนับสนุนอยางลับ ๆ เพื่อรักษาชองทางปฏิเสธความเกี่ยวของไว ดวยการใชเครือขายของเราในภูมิภาคและทรัพยากรของ[SWE.GetName] เราจะคอย ๆ บั่นทอนการปกครองอาณานิคมของ[ITA.GetAdjective]ในแอฟริกาได"
 ETH_anti-tank_guns: "ปนตอสูรถถัง"
 ETH_anti-tank_guns_desc: "[SWE.GetName]มีคลังอาวุธที่ดีที่สุดแหงหนึ่งของโลก แมในทางเทคนิคจะวางตัวเปนกลางในการตางประเทศ แตชาว[SWE.GetAdjective]อาจยินดีสละปนตอสูรถถังบางสวนให หากชวยสกัดกั้นเขตอิทธิพลของฟาสซิสตที่กําลังขยายตัว"
 ETH_a_libyan_revolt: "การลุกฮือในลิเบีย"
 ETH_a_libyan_revolt_desc: "ชาว[ITA.GetAdjective]กําลังดิ้นรนรักษาการควบคุมดินแดนที่เพิ่งไดมาในแอฟริกาตะวันออก เมื่อความสนใจของพวกเขาเบนไป เราจะพยายามอยางสุดกําลังหวานเมล็ดพันธุแหงการกบฏในดินแดน[LBA.GetAdjective]อันลํ้าคาของพวกเขา"
 ETH_ethiopias_cause_is_ours: "อุดมการณของเอธิโอเปยคืออุดมการณของเรา"
 ETH_ethiopias_cause_is_ours_desc: "รัฐบาล[SWE.GetAdjective]กําลังเคลื่อนหางจากความเปนกลาง เมื่อเริ่มตระหนักวาความสําเร็จของฟาสซิสตในแอฟริกาจะสงผลกระทบถึงยุโรปดวย เปาหมายของเราในเรื่องการกําหนดชะตากรรมตนเองและการเคารพกฎหมายระหวางประเทศสอดคลองกัน จึงสมเหตุสมผลที่เราจะกระชับความรวมมือดานนโยบายตางประเทศใหลึกซึ้งยิ่งขึ้น"
 ETH_SWE_join_war_tt: "หากประเทศมหาอํานาจทําสงครามกับ §Y[ITA.GetFlag][ITA.GetName]§! และ §Y[SWE.GetFlag][SWE.GetName]§! ตกลงตามคําขอเขาฝายรวมกัน พวกเขาจะพยายามเขารวมฝายและเขารวมสงคราม\n §Rหากไมมีฝายใหเขารวม [SWE.GetFlag][SWE.GetName] จะไมทําสงครามกับ [ITA.GetFlag][ITA.GetName] เพียงลําพัง!§!"

 ETH_reach_out_to_the_italians: "ติดตอชาวอิตาลี"
 ETH_reach_out_to_the_italians_desc: "เปนที่ชัดเจนวาเราไมมีความหวังที่จะเอาชนะชาว[ITA.GetAdjective]ในสนามรบไดอีกแลว ทวา[ETH.GetLeader]ยังคงสงทหารของเราไปตายในการรุกที่ไรผล ถึงเวลาแลวสําหรับการนําแบบใหมภายใตผูนําที่แข็งแกรงกวา ผูที่สามารถรวมมือกับชาวอิตาลีและนําสันติภาพกลับสูมาตุภูมิได"
 ETH_reach_out_to_the_italians_tt: "ขอเสนอความรวมมือจะถูกสงไปยัง §Y[ITA.GetNameDef]§! เพื่อเสนอสันติภาพแลกกับดินแดน"
 ETH_can_start_a_civil_war_tt: "[ROOT.GetName]สามารถเริ่มสงครามกลางเมืองไดโดยทําแผนยุทธศาสตร §Y$ETH_declare_for_italy$§! ใหสําเร็จ"
 ETH_sway_the_warlords: "โนมนาวขุนศึก"
 ETH_sway_the_warlords_desc: "แมเราจะโนมนาวราสผูทรงอํานาจคนใดใหประกาศตอตาน $ETH_haile_selassie$ อยางเปดเผยไมได อยางนอยเราก็หวานเมล็ดพันธุแหงความรวมมือในอนาคตได นอกจากนี้ เราควรพยายามโนมนาวขุนศึกรายยอยบางคนใหเห็นประโยชนของการรวมมือกับชาวอิตาลี แทนที่จะตอตาน"
 ETH_sway_the_warlords_tt: "เพิ่มขนาดของการลุกฮือ \nนายพลฝายจงรักภักดีบางคนจะสามารถเกณฑไดหลังสงคราม"
 ETH_expand_the_bodyguard: "ขยายกองราชองครักษ"
 ETH_expand_the_bodyguard_desc: "การตัดสินวาใครไวใจไดยากขึ้นเรื่อย ๆ ขณะที่โครงสรางอํานาจของ[ETH.GetName]เริ่มแตกราว ในยามยากลําบากเชนนี้ ผูนําในอนาคตของชาติอันยิ่งใหญของเราจําเปนตองมีองครักษประจําตัวที่ภักดีตอเขาเพียงผูเดียว เพื่อปกปองจากพวกทรยศ"
 ETH_expand_the_bodyguard_tt: "เพิ่มหนวยพิเศษเมื่อสงครามกลางเมืองเริ่มขึ้น"
 ETH_declare_for_italy: "ประกาศเขาขางอิตาลี"
 ETH_declare_for_italy_desc: "หลายคนจะมองวาเปนการทรยศและหันหลังใหความจริง แตนั่นคือเหตุผลที่เราถูกลิขิตใหปกครองดินแดนนี้ เพราะเรารูวามีเพียงเราที่มีความแนวแนพอจะทําสิ่งที่จําเปนเพื่อประโยชนของชาติ ถึงเวลาโคนลม[ETH.GetLeader]แลว"
 ETH_restore_the_country: "ฟนฟูประเทศ"
 ETH_restore_the_country_desc: "เมื่อสันติภาพกลับคืนสู[ETH.GetName]ในที่สุด ก็ถึงเวลาเริ่มกระบวนการฟนฟูความสงบเรียบรอยทั่วประเทศ เราจะสรางบานเรือนและโครงสรางพื้นฐานขึ้นใหมใหดีกวาเดิม และแสดงใหเห็นวาอนาคตอันสดใสรอประชาชนของเราอยูภายใตการปกครองของ[ETH.GetLeader]"
 ETH_invite_italian_settlers: "เชิญผูตั้งถิ่นฐานชาวอิตาลี"

 ETH_invite_italian_settlers_desc: "การเห็นชาติอันยิ่งใหญของเรากลายเปนอีกจุดหมายหนึ่งของการลาอาณานิคมของยุโรปจะเปนยาขมที่หลายคนตองกลืน แตประวัติศาสตรที่ผานมาไมนานไดแสดงใหเห็นความออนแอของอุตสาหกรรมและโครงสรางพื้นฐานของเรา และเราจําเปนตองใชมาตรการขั้นเด็ดขาดเพื่อปรับปรุง ดังนั้นเราจะฉวยโอกาสนี้ใชประโยชนจากความเชี่ยวชาญและความมั่งคั่งของชาว[ITA.GetAdjective]ผูไรเดียงสา ดวยการเชิญพวกเขามาตั้งถิ่นฐานที่นี่"
 ETH_invite_italian_settlers_tt: "§Yรัฐที่ครอบครอง 2 รัฐ§! จะไดรับผูตั้งถิ่นฐานจํานวนหนึ่งจาก[ITA.GetName] เปลี่ยนจากรัฐชนบทหรือรัฐเลี้ยงสัตว และไดรับ§Yชองสิ่งกอสรางใหม§!"
 ETH_replace_the_abuna: "[Get_ETH_replace_the_abuna_name]"
 ETH_replace_the_abuna_desc: "[Get_ETH_replace_the_abuna_desc]"
 abuna_abraham_gojjam_tt: "§Y$ETH_abuna_abraham$§!:"
 ETH_replace_the_abuna_original: "แทนที่อาบูนา"
 ETH_change_state_religion: "เปลี่ยนศาสนาประจํารัฐ"
 ETH_replace_the_abuna_desc_ethiopia: "ผูนําศาสนจักรออรโธดอกซ $ETH_abuna_qerellos_iv$ มีความใกลชิดกับ $ETH_haile_selassie$ มากเกินไป เราตองแทนที่เขาดวยผูที่ภักดีตออุดมการณของเรามากกวา"
 ETH_replace_the_abuna_desc_gojjam: "ผูนําศาสนจักรออรโธดอกซ $ETH_abuna_qerellos_iv$ มีความใกลชิดกับ $ETH_haile_selassie$ มากเกินไป $ETH_abuna_abraham$ คือผูที่เหมาะสมที่สุดจะมาแทนที่ ซึ่งจะทําใหกอจจามเปนทั้งศูนยกลางทางการเมืองและศาสนาของจักรวรรดิ"
 ETH_replace_the_abuna_desc_jimma: "ศาสนจักรออรโธดอกซเตวาเฮโดมีอิทธิพลตอการเมืองของประเทศนี้มานานเกินไปแลว ถึงเวลาตัดความสัมพันธระหวางจักรวรรดิกับศาสนจักรอยางเปนทางการ เราควรแสวงหาความสัมพันธที่ใกลชิดยิ่งขึ้นกับพี่นองของเราอีกฟากทะเลแคบแทน"
 ETH_the_capital_victory_parade: "ขบวนพาเหรดฉลองชัยแหง[ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_the_capital_victory_parade_desc: "แมผูนําผูยิ่งใหญจะชวยเราใหรอดพนจากความพินาศที่แนนอน แตประชาชนจํานวนมากยังคงระแวงเจตนาของ[ETH.GetLeader] และโหยหาวันเวลาของราชวงศเกา เราตองเตือนใหพวกเขาระลึกวาควรสํานึกในบุญคุณของ[ETH.GetLeader]เพียงใด และแสดงใหเห็นอนาคตอันรุงโรจนที่รอ[ETH.GetName]อยู"
 ETH_amedeos_feast_of_maskal: "งานเลี้ยงฉลองเทศกาลมัสกัลของอเมเดโอ"

 ETH_amedeos_feast_of_maskal_desc: "เพื่อรักษาเสถียรภาพของ[ETH.GetName]ตอไป เราจะรวบรวมบรรดาราสที่เหลืออยูมารวมงานเลี้ยงฉลองเทศกาลมัสกัลของเจาชายอเมเดโอใน[ETH.Capital.GetCapitalVictoryPointName] ที่นั่นเราจะพบกับอุปราชแหงแอฟริกาตะวันออกของ[ITA.GetAdjective]และหารือถึงอนาคตของภูมิภาค"
 ETH_amedeos_feast_of_maskal_tt: "หากทํา §Y$ETH_sway_the_warlords$§! สําเร็จแลว: \n§Y$ETH_seyoum_mengesha$§!, §Y$ETH_ayalew_birru$§! และ §Y$ETH_ras_kassa$§! จะกลายเปนผูจงรักภักดี"
 ETH_assertiveness: "[Get_ETH_assertiveness_name]"
 ETH_assertiveness_autonomy_effect: "เนกุสผูเด็ดขาด"

 ETH_assertiveness_desc: "เราตกลงรวมมือกับชาว[ITA.GetAdjective]เพื่อปกปองชาติอันยิ่งใหญของเราจากความพินาศ แตบัดนี้พวกเขากลับตองการลบลางอัตลักษณและวัฒนธรรมของเรา ใหเราเปนเพียงอาณานิคม เราไมอาจปลอยใหเปนเชนนั้น เราจะทําใหพวกเขาเขาใจวาเราเปนใคร และตอตานการลาอาณานิคมของพวกเขาทุกยางกาว"
 ETH_assertiveness_tt: "หากทํา §Y$ETH_sway_the_warlords$§! สําเร็จแลว และประเทศคือ §Y$jimma$§!:\n§Y$ETH_balcho_safo$§! และ §Y$ETH_tadesse_birru$§! จะกลายเปนผูจงรักภักดี"
 ETH_assertiveness_gojjam: "เนกาชแหงกอจจาม"
 ETH_assertiveness_jimma: "การัดแหงจิมมา"
 ETH_assertiveness_ethiopia: "เนกุสแหงเชวา"
 ETH_exploit_french_weakness: "ฉวยโอกาสจากความออนแอของฝรั่งเศส"
 ETH_exploit_french_weakness_desc: "ขณะที่ชาว[FRA.GetAdjective]มัวทะเลาะกันเหนือซากจักรวรรดิของตน เรามีโอกาสผนวกดินแดนโซมาลิแลนดของฝรั่งเศสเขากับจักรวรรดิอันยิ่งใหญของเรา ไมนาเปนไปไดที่ชาว[FRA.GetAdjective]จะมีกะจิตกะใจสูรบอีกครั้ง แตเราตองพรอมรับทุกสถานการณ"
 ETH_exploit_french_weakness_tt: "ปลดล็อกการตัดสินใจเพื่อยึดครอง§Yโซมาลิแลนดของฝรั่งเศส§! \n§Rการตัดสินใจเหลานี้เสี่ยงตอการทําสงครามกับฝรั่งเศสเขตวีชี!§!"
 ETH_france_divided_tt: "ฝรั่งเศสถูกแบงแยกแลว"
 ETH_invite_italian_investors: "เชิญนักลงทุนชาวอิตาลี"
 ETH_invite_italian_investors_desc: "เราควรใชประโยชนจากเจาเหนือหัวคนใหมดวยการชักชวนนักลงทุนของพวกเขามาเยือน[ETH.GetName] เงินลงทุนที่หลั่งไหลเขามาจะชวยไดมาก ไมเพียงในการซอมแซมความเสียหายจากสงคราม แตยังชวยขยายขีดความสามารถทางอุตสาหกรรมของเราอยางมหาศาล"
 ETH_italian_general_staff: "เสนาธิการชาวอิตาลี"

 ETH_italian_general_staff_desc: "กองทัพของเรายังตองเดินอีกไกลในดานการปรับใหทันสมัย แมเราจะกาวหนาอยางมากในการผลิตหรือจัดหายุทโธปกรณสมัยใหมใหกองทัพ แตนายทหารของเรายังมีแนวคิดลาสมัยหลายอยางในการใชงาน บางทีเราอาจเรียนรูการทําสงครามสมัยใหมไดดวยการเชิญนายทหาร[ITA.GetAdjective]มารวมในคณะเสนาธิการของเรา"
 ETH_italian_general_staff_tt: "หากความสัมพันธกับอิตาลีเปนบวกและพวกเขาตกลง §Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! และ §Y$ITA_alessandro_pirzio_biroli$§! จะถูกโอนยายมายังเอธิโอเปย"
 ETH_cooperation: "[Get_ETH_cooperation_name]"

 ETH_cooperation_desc: "ชะตากรรมของเราอยูที่การครอบงําแอฟริกาตะวันออก ทวาเรายังหางไกลจากการบรรลุเปาหมายนั้น ดังนั้นเราตองรวมมือกับโครงสรางอํานาจที่มีอยูในภูมิภาค และพยายามแสวงหาความไดเปรียบทุกอยางที่ทําได"
 ETH_cooperation_sud_tt: "ไดรับที่ปรึกษาทางการเมืองชาวซูดาน:\n§Y$economic_organizer$:§! \n   โรงงานสินคาอุปโภคบริโภค: §G-5%§!\n   เสถียรภาพ: §G+5%§!"
