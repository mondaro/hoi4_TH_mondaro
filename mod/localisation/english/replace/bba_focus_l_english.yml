######################################################################

#########   Historical ####################
 SWI_swiss_guiding_principles: "หลักการชี้นําของสวิส"
 SWI_swiss_guiding_principles_desc: "[ROOT.GetNameDefCap] เปนประชาธิปไตยที่เกาแกที่สุดในทวีป แตความเปลี่ยนแปลงอยางฉับพลันในยุโรปกําลังทําใหสิ่งนี้ตกอยูในความเสี่ยง เราควรเดินตามแนวทางที่สมาพันธรัฐ (Eidgenossenschaft) และรัฐธรรมนูญป 1848 วางไวตอไป หรือจะมีเสนทางใหมเผยตัวแกเรา?"
 SWI_increase_defense_budget: "เพิ่มงบประมาณกลาโหม"
 SWI_increase_defense_budget_desc: "แมเราจะรักษาความเปนกลางและอธิปไตยไวไดในมหาสงคราม แตเราจะหลงระเริงกับชัยชนะในอดีตไมได มีความเปนไปไดจริงที่มหาอํานาจรอบตัวเราสักชาติจะบุกประเทศเราเพื่อออมแนวปอมปราการที่สรางไวระหวางกัน และงบประมาณปจจุบันของเราไมเพียงพอจะปองกันเรื่องนี้"
 SWI_national_defense_fund: "กองทุนปองกันประเทศ"
 SWI_national_defense_fund_desc: "การปองกันประเทศตองการมากกวาหยาดเหงื่อและแรงงาน เรายังตองมีเงินทุนเพื่อนําเขายุทโธปกรณและวัตถุดิบที่จําเปนเพื่อเตรียมพรอมรับมือสถานการณเลวรายที่สุด การจัดตั้งและสงเสริมกองทุนที่พลเมือง[ROOT.GetAdjective]สามารถบริจาคไดโดยสมัครใจจะชวยชดเชยงบประมาณทางทหารที่เพิ่มขึ้น และยังแสดงใหเห็นถึงจิตวิญญาณแหงการมีสวนรวมของชาว[ROOT.GetAdjective]"
 SWI_reaffirm_spiritual_defense: "ยํ้าการปองกันทางจิตวิญญาณ"
 SWI_reaffirm_spiritual_defense_desc: "สมาพันธรัฐของเรามุงมั่นปกปองคุณคาแหงชาติสวิสมาตั้งแตป 1932 เพื่อตอบโตภัยคุกคามจากลัทธิเผด็จการที่เพิ่มขึ้นรอบตัว บัดนี้ภัยดังกลาวยิ่งทอดเงาใหญกวาที่เคย เราจึงตองใหคํามั่นใหมที่จะปกปองวิถีชีวิตของเราทั้งทางกายและทางจิตวิญญาณ"
 SWI_fortify_border_with_germany: "เสริมปอมพรมแดนติดเยอรมนี"
 SWI_fortify_border_with_germany_desc: "[GER.GetNameDefCap] เปนภัยคุกคามตอการดํารงอยูของสมาพันธรัฐ[ROOT.GetAdjective] หากสงครามปะทุระหวาง [GER.GetName] และ [FRA.GetName] ชาว[GER.GetAdjective]อาจเดินทัพผาน [ROOT.GetName] แทนที่จะผานพรมแดนที่มีปอมปราการแนนหนากับ [FRA.Getname] หรือผาน [HOL.GetName] และ [BEL.Getname] เราสามารถสรางปอมปราการระหวางสองประเทศเพื่อยับยั้ง [GER.GetNameDef]"
 SWI_fortify_border_with_italy: "เสริมปอมพรมแดนติดอิตาลี"
 SWI_fortify_border_with_italy_desc: "ความทะเยอทะยานในการขยายดินแดนของ[ITA.GetAdjective]อาจลุกลามมาถึง [ROOT.GetName] ไดทุกเมื่อ อยางไรเสีย ประชากรสวนสําคัญของเราพูดภาษาอิตาลี และแคสุนทรพจนครั้งเดียวจาก [ITA.GetLeader] ก็อาจทําให [ROOT.GetName] ตกเปนเปาหมาย เราตองแสดงใหพวกเขาเห็นวาเราไมใชเปาหมายงาย ๆ"
 SWI_fortify_border_with_france: "เสริมปอมพรมแดนติดฝรั่งเศส"
 SWI_fortify_border_with_france_desc: "แมพวกเขาจะยึดมั่นในคุณคาประชาธิปไตยและมีความสัมพันธฉันมิตรกับเรามายาวนาน แตเราไมอาจเพิกเฉยตอความเปนไปไดที่ [FRA.GetName] อาจรุกลํ้าดินแดน[ROOT.GetAdjective]เพื่อเปดฉากโจมตีแบบลอบกัด [GER.GetNonIdeologyName] หรือ [ITA.GetNonIdeologyName]"
 SWI_ban_foreign_nazi_propaganda: "หามโฆษณาชวนเชื่อนาซีจากตางชาติ"
 SWI_ban_foreign_nazi_propaganda_desc: "เราไมอาจปลอยใหชองทางโฆษณาชวนเชื่อของตางชาตินี้ดํารงอยูได ลัทธินาซีขัดตอคุณคาทุกประการที่นิยามความเปนสหพันธ[ROOT.GetAdjective] ดวยเหตุนี้ จึงไมอาจยอมรับไดในประเทศที่สรางขึ้นบนประชาธิปไตยและความอดกลั้นอยางเรา มิฉะนั้นเราเสี่ยงที่จะถูกพวกเขาใชทําลายเราจากภายใน"
 SWI_buero_ha: "Buero Ha"
 SWI_buero_ha_desc: "เราไมอาจใหเพื่อนบานรูวาเรากําลังพยายามรวบรวมขาวกรองเกี่ยวกับพวกเขา จึงตองพึ่งหนวยขาวกรองกึ่งอิสระใหรับปฏิบัติการลับแทน นี่คือจุดที่ฮันส เฮาสซามันน นักธุรกิจการถายภาพผูผันตัวมาเปนหัวหนาเครือขายสายลับเขามามีบทบาท ดวยสํานักงานขาวกรองขนาดเล็กที่คลองตัว เขาสามารถทํางานที่จําเปนโดยที่เราไมตองเปอนมือ"
 SWI_federal_police: "ฝายขาวกรองตํารวจสหพันธรัฐ"
 SWI_federal_police_desc: "คงเปนเรื่องโงเขลาหากเราปกปอง [ROOT.GetName] จากศัตรูภายนอก แตปลอยใหพายแพตอศัตรูภายใน เราตองเสริมอํานาจใหตํารวจสหพันธรัฐในการกวาดลางภัยคุกคามที่อาจมีภายในพรมแดน และปองกันกลุมตางชาติบนแผนดินของเรา"
 SWI_spab_counter_intelligence_agency: "SpAb"
 SWI_spab_counter_intelligence_agency_desc: "เราทราบวา [GER.GetNameDef] ไดตั้งศูนยฝกนักกอวินาศกรรมแนวที่หาขึ้นที่ชตุทการท เรียกกันวาพาโนรามาไฮม ดวยเหตุนี้ เราตองเสริมอํานาจใหตํารวจสหพันธรัฐดวยหนวยตอตานจารกรรม (Spionage Abwehr) เพื่อรับมือภัยคุกคามเหลานี้และตอสูกับการจารกรรมและการกอวินาศกรรมจากตางชาติ"
 SWI_armed_neutrality: "ความเปนกลางติดอาวุธ"
 SWI_armed_neutrality_desc: "ความเปนกลางอันยาวนานของเราเปนสวนสําคัญของอัตลักษณ[ROOT.GetAdjective] แตความเปนกลางเพียงอยางเดียวไมอาจรับประกันอธิปไตยของเราได อยางไรเสีย มันชวย [BEL.GetNonIdeologyName] ในมหาสงครามไดมากแคไหนเลา? เครื่องยับยั้งที่ดีที่สุดคือทั้งชาติที่พรอมจับอาวุธตอสูกับผูรุกรานทุกผู"
 SWI_promote_guisan: "เลื่อนยศอองรี กีซ็อง"
 SWI_promote_guisan_desc: "ระบบการเมืองของเรายอมใหมีนายพลและผูบัญชาการทหารสูงสุดเพียงคนเดียวเฉพาะในยามจําเปนอยางยิ่ง เมื่อสมาพันธรัฐตกอยูในความเสี่ยง นี่คือหนึ่งในสถานการณเชนนั้นแนนอน และผูที่เหมาะสมก็ชัดเจน อองรี กีซ็อง ไมเพียงมีคุณสมบัติเหมาะสมที่สุด แตยังไดรับความนิยมอยางกวางขวางทั่ว [ROOT.GetNameDef]"
 SWI_national_redoubt: "ปอมปราการแหงชาติ (Réduit National)"
 SWI_national_redoubt_desc: "อองรี กีซ็อง เสนอแนวทางที่แตกตางในการปองกัน [SWI.GetName] แทนที่จะพยายามปองกันพรมแดนประเทศโดยไมคํานึงถึงราคาที่ตองจาย เราสามารถยอมสละที่ราบสูงสวิสอยางมีกลยุทธและถอยไปยังเทือกเขาแอลป ซึ่งจะทําใหศัตรูตองจายราคาแพงในการยึดครองเรา"
 SWI_expedite_mobilization: "เรงการระดมพล"
 SWI_expedite_mobilization_desc: "บทบาทของกองทัพประจําการขนาดเล็กของเราคือการตรึงศัตรูไวขณะที่ประชาชนแหง [ROOT.GetName] จับอาวุธและจัดตั้งกองกําลังอาสาพลเมือง ซึ่งเปนกําลังหลักในการปองกันของเรา เราจึงตองทําใหแนใจวาพวกเขาพรอมไดเร็วที่สุด เพื่อลดความเสี่ยงที่กองทัพประจําการจะถูกบดขยี้"
 SWI_fortify_the_jura: "เสริมปอมเทือกเขาจูรา"
 SWI_fortify_the_jura_desc: "มีการเตรียมการมากมายเพื่อเสริมปอมปราการในเทือกเขาแอลป แตเรายังเสริมปอมเทือกเขาจูราไดดวย แมจะไมสูงชันหรือปองกันงายเทา แตก็อาจเปนประโยชนในฐานะแนวรบที่สองสําหรับโจมตีที่ราบสูงเมื่อตกอยูในมือศัตรู"
 SWI_rig_infrastructure_to_blow: "วางระเบิดโครงสรางพื้นฐาน"
 SWI_rig_infrastructure_to_blow_desc: "หากเราจะปลอยใหผูรุกรานเขามาในพรมแดน เราก็ไมอาจประเคนทุกอยางใหพวกเขาบนถาดเงิน สิ่งสําคัญที่สุดคือเตรียมโครงสรางพื้นฐานใหศัตรูใชงานไมได ชะลอการรุกคืบของพวกเขาและบีบใหตองใชทรัพยากรอันมีคาในการสรางทดแทน"
 SWI_emergency_industry: "อุตสาหกรรมฉุกเฉิน"
 SWI_emergency_industry_desc: "เมื่อเราจําตองทําลายกําลังการผลิตทางอุตสาหกรรมของตนเองเมื่อศัตรูบุกเขามาในรัฐของเรา เราตองมีแผนสํารองไวใชฟนฟูจากสิ่งที่เหลืออยูและขับไลผูรุกราน อุโมงคและโรงงานลับจะกระจายอยูใจกลางขุนเขาและหุบเขาของเรา บางแหงอาจอยูนอกพรมแดนดวยซํ้า"
 SWI_flood_the_valleys: "ปลอยนํ้าทวมหุบเขา"
 SWI_flood_the_valleys_desc: "เราคาดวากองกําลังรุกรานขนาดใหญจะผานเขามาทางพื้นที่รอบทะเลสาบคอนสแตนซ ซึ่งเปนจุดเหมาะในการสรางคลองและเขื่อนกั้นนํ้าเพื่อปลอยนํ้าทวมไรนาและทําใหผูบุกรุกติดหลม ขณะที่พวกเขาพยายามขามบึงอันตรายนี้ เราจะฉวยโอกาสระดมยิงพวกเขาดวยทุกสิ่งที่เรามี พวกเขาจะตองเสียใจที่คิดบุกเรา"
 SWI_defend_the_skies: "ปกปองนานฟา"
 SWI_defend_the_skies_desc: "สงครามสมัยใหมพึ่งพาความเหนือกวาทางอากาศและการสนับสนุนทางอากาศอยางมาก [ROOT.GetName] ยังไมพรอมสําหรับความจริงใหมนี้ เราจึงตองเตรียมทุกแคนทอนใหพรอมปกปองนานฟาของตนจากเครื่องบินขาศึก"
 SWI_attack_from_the_mountains: "โจมตีจากขุนเขา"
 SWI_attack_from_the_mountains_desc: "เมื่อเขาประจําที่มั่นที่เสริมปอมไวบนเทือกเขาแอลปและจูราแลว เราจะสรางความหายนะใหกองทหารขาศึกที่อยูในหุบเขาเบื้องลางได เราตองทําใหพวกเขารูวาทุกนาทีที่อยูในดินแดนของเราหมายถึงการสูญเสียกําลังพลและยุทธภัณฑที่มากขึ้น"
 SWI_frontier_defense_plan: "แผนปองกันชายแดน"
 SWI_frontier_defense_plan_desc: "หากเราปลอยใหพวกเขาเขามาในพรมแดน [ROOT.GetNameDef] ก็เทากับตายแลว เราจะยอมเสียดินแดนแมแตนิ้วเดียวไมได พรมแดนของเราศักดิ์สิทธิ์ ดวยเหตุนี้เราตองเสริมปอมพรมแดนและเตรียมพรอมปกปองมัน"
 SWI_fight_until_death: "สูจนตัวตาย"
 SWI_fight_until_death_desc: "สถานการณไมเปนใจใหเรา [ROOT.GetNAme] มีกําลังพลนอยกวา อาวุธดอยกวา และไมพรอมสําหรับสิ่งที่กําลังจะมาถึง ดวยเหตุนี้พลเมือง[ROOT.GetAdjective]ทุกคนตองพรอมสละชีพเพื่อแคนทอนและสมาพันธรัฐของตน"
 SWI_total_defense: "การปองกันเบ็ดเสร็จ"
 SWI_total_defense_desc: "สงครามเบ็ดเสร็จหมายความวาเราตองการการปองกันแบบเบ็ดเสร็จ หากกองกําลังอาสาทุกหนวยพรอมและทุมสุดตัวตอสูกับผูรุกราน เราอาจมีโอกาสรอด"
 SWI_the_army_position: "ที่มั่นของกองทัพ"
 SWI_the_army_position_desc: "เราจะวางกําลังกองกําลังอาสาพลเมืองและกองทัพประจําการไวตามพรมแดนของ [ROOT.GetName] พวกเขาจึงตองมีปอมปราการเพื่อเสริมความสามารถในการสกัดกั้นผูบุกรุก"
 SWI_prolonged_service: "ขยายระยะเวลารับราชการ"
 SWI_prolonged_service_desc: "ระยะเวลารับราชการทหารภาคบังคับในปจจุบันไมเพียงพอสําหรับสงครามยืดเยื้อ เราตองใหรัฐบาลสหพันธรัฐมีเครื่องมือที่จะคงพลเมืองไวในกองทัพไดนานขึ้น แมจะตองแลกดวยเสรีภาพบางประการก็ตาม"
 SWI_enhanced_training: "ยกระดับการฝก"
 SWI_enhanced_training_desc: "สงครามเปลี่ยนไปมากนับตั้งแตครั้งลาสุดที่ [ROOT.GetName] เสี่ยงตอความขัดแยง เราตองปรับปรุงและพัฒนาการฝกขั้นพื้นฐานที่พลเมืองทุกคนที่มีความสามารถไดรับ พวกเขาคือทรัพยสินที่ดีที่สุดในการปกปองประเทศของเรา"
 SWI_integrate_refugees_into_the_army: "รวมผูลี้ภัยเขากองทัพ"
 SWI_integrate_refugees_into_the_army_desc: "ในฐานะโอเอซิสแหงสันติภาพและประชาธิปไตยทามกลางมหาสมุทรแหงลัทธิฟาสซิสตและสงคราม ผูคนมากมายหลั่งไหลมายัง [ROOT.GetName] เพื่อแสวงหาที่พักพิงอันปลอดภัย บางคนหวังจะรวมความพยายามในการปราบผูที่บีบใหพวกเขาตองหนีจากบานเกิด และหลายคนยังเปนทหารอาชีพ เราสามารถใหพวกเขาเขารวมการตอสูเพื่อสวิตเซอรแลนดและอนาคตที่ดีกวา"
 SWI_expanded_military_support: "ขยายการสนับสนุนทางทหาร"
 SWI_expanded_military_support_desc: "กองกําลังอาสาของเราไมไดประกอบดวยทหารเพียงอยางเดียว ยังตองมีบทบาทอื่นอีกมากเพื่อใหทํางานไดราบรื่นดุจเครื่องจักรที่ไดรับการหลอลื่นอยางดี เราตองเกณฑ ฝก และสงกําลังบํารุงใหกองรอยสนับสนุนของกองกําลังอาสา หากตองการปกปอง [ROOT.GetName] ไดสําเร็จ"
 SWI_all_adults_training: "ฝกผูใหญทุกคน"
 SWI_all_adults_training_desc: "สภาพโลกในปจจุบันไมเปดชองใหกับความบังเอิญ ผูใหญทุกคนที่มีความสามารถตองพรอมจับอาวุธตอตานกองกําลังรุกรานใด ๆ สวิตเซอรแลนดเปนของพวกเราทุกคน จึงตองไดรับการปกปองโดยพวกเราทุกคน"
 SWI_anti_tank_divisions: "กองพลตอสูรถถัง"
 SWI_anti_tank_divisions_desc: "รถถังคือหัวหอกของสงครามสมัยใหม ภูมิประเทศของเราใหความไดเปรียบตอรถถังอยูแลว แตหากเราติดอาวุธตอสูรถถังใหกองกําลัง เราจะตัดปลายและทําใหหัวหอกนั้นทื่อได"
 SWI_reduce_military_training_age: "ลดอายุเกณฑทหาร"
 SWI_reduce_military_training_age_desc: "โดยปกติชาว[ROOT.GetAdjective]จะเริ่มฝกรบเมื่ออายุ 20 ป แตเพื่อใหมีกําลังพลมากพอที่จะอยูรอด พลเมืองของเราจะตองเริ่มฝกเร็วขึ้นหนึ่งป หวังวาจะเพียงพอ"
 SWI_veteran_sharpshooter_divisions: "กองพลพลแมนปนทหารผานศึก"
 SWI_veteran_sharpshooter_divisions_desc: "พลแมนปนทหารผานศึกหลายพันคนขออนุญาตเขารวมกองทัพในฐานะกําลังเสริม เพื่อทําหนาที่ปกปองประเทศและประชาธิปไตยของตน ประสบการณและความกระตือรือรนของพวกเขาจะเปนประโยชนยิ่งตอกองกําลังอาสาของเรา"
 SWI_fortify_ticino: "ปอมปราการตีชีโน"
 SWI_fortify_ticino_desc: "ในฐานะประเทศเปนกลางที่อยูระหวางสามชาติที่ชอบสงครามมาโดยตลอด ความตายอาจมาจากทุกทิศทาง เราจะลดการปองกันไมได [ITA.GetName] มีโอกาสโจมตีเราพอ ๆ กับ [GER.GetNameDef] หรือ [FRA.GetName] และเมื่อพวกเขาลงมือ ก็จะตองผาน [846.GetName] ดวยเหตุนี้ เราตองทําใหที่นั่นเปนปอมปราการที่ไมอาจเจาะทะลวงไดเพื่อ [SWI.GetNameDef]"
 SWI_fortify_sargans_gotthard_and_st_maurice: "เสริมปอมซารกันส ก็อทธารด และแซ็งมอริส"
 SWI_fortify_sargans_gotthard_and_st_maurice_desc: "เทือกเขาแอลปคือความภาคภูมิใจของ [ROOT.GetName] และในยามที่ไมแนนอนนี้ เราสามารถเสริมปอมปราการที่นั่นเพื่อชวยรับประกันความปลอดภัยของสมาพันธรัฐ"
 SWI_defend_against_paratroopers: "ปองกันพลรม"
 SWI_defend_against_paratroopers_desc: "เราไดเห็นแลววาพลรมสามารถใชหลบเลี่ยงปอมปราการใด ๆ และทําใหการเตรียมการทั้งหมดไรความหมายไดอยางไร สิ่งสําคัญยิ่งคือเราตองพรอมรับมือพวกเขากอนที่จะสรางความหายนะตอแนวปองกันของเรา"
 SWI_expand_special_forces: "ขยายกองกําลังพิเศษ"
 SWI_expand_special_forces_desc: "กองทัพประจําการของเราเตรียมพรอมดี แตมีขนาดเล็กมากเมื่อเทียบกับชาติอื่น และอาจไมเพียงพอที่จะพลิกการปองกัน [ROOT.GetName] ใหเปนฝายไดเปรียบ เราตองการพวกเขาเพิ่มขึ้นเพื่อนําชาว[ROOT.GetAdjective]สูชัยชนะ!"
 SWI_purchase_german_planes: "[SWI_purchase_fascist_planes_name]"
 SWI_purchase_german_planes_default: "ซื้อเครื่องบินเยอรมัน"
 SWI_purchase_german_planes_alt: "ซื้อเครื่องบินจากเพื่อนบานฟาสซิสต"
 SWI_purchase_german_planes_desc: "ดวยกองทัพอากาศที่ลาสมัย และขาดทั้งอุตสาหกรรมและเทคโนโลยีที่จะผลิตอากาศยานไดในจํานวนมากพอ เราจําตองพึ่งการซื้อจากเพื่อนบาน การซื้อเครื่องบินที่ตองการจาก [GER.GetName] ไมเพียงใหยุทโธปกรณที่เราตองการ แตยังชวยใหเราอยูในสายตาที่ดีของพวกเขาดวย"
 SWI_ban_the_communist_party: "สั่งหามพรรคคอมมิวนิสตสวิส"
 SWI_ban_the_communist_party_desc: "พรรคคอมมิวนิสตเปนภัยอันตรายรายแรงตอ [SWI.GetNameDef] แมจะอยูหางไกลจาก [SOU.GetNameDef] แตอิทธิพลปฏิวัติของพวกเขาก็ลอยมาตามอากาศ เราไมอาจเสี่ยงใหประเทศไรเสถียรภาพในยามอันตรายเชนนี้ จึงตองลงมืออยางรวดเร็วและสั่งหามพรรคใดก็ตามที่มุงลมลางและบอนทําลายรัฐบาลของเรา"
 SWI_withdraw_from_the_league_of_nations: "ถอนตัวจากสันนิบาตชาติ"
 SWI_withdraw_from_the_league_of_nations_desc: "การเปนสมาชิกสันนิบาตชาติขัดกับความเปนกลางที่เราปรารถนาให [ROOT.GetName] มี จึงจําเปนที่เราตองละทิ้งองคกรที่กําลังจะลมสลายนี้ ซึ่งยังจะสงสัญญาณถึงความมุงมั่นในความเปนกลางอยางแทจริงตอเพื่อนบาน หวังวาจะโนมนาวใหพวกเขาเชื่อวา [ROOT.GetName] ไมใชเปาหมาย"
 SWI_limited_censorship_of_the_press: "เซ็นเซอรสื่ออยางจํากัด"
 SWI_limited_censorship_of_the_press_desc: "กองกําลังที่ตองการเห็น [ROOT.GetName] ลมสลายจะใชทุกอยางเปนขออางในการรุกรานเรา เสรีภาพสื่อแมจะสําคัญยิ่งตอประชาธิปไตยที่แข็งแรง แตก็ตองถอยไปกอนในตอนนี้ เพื่อใหมั่นใจวาเราจะไมสงกระสุนใหความทะเยอทะยานของเพื่อนบาน"
 SWI_tighten_press_censorship: "เขมงวดการเซ็นเซอรสื่อ"
 SWI_tighten_press_censorship_desc: "ไมมีที่วางสําหรับความผิดพลาด คําพูดเพียงคําเดียวอาจเปนตัวชี้ขาดระหวางการอยูรอดของสมาพันธรัฐกับการดิ่งสูความลมสลาย เราไมอาจปลอยใหสื่อเสรีทําใหอนาคตของเราตกอยูในอันตราย พวกเขาตองถูกควบคุมอยางเขมงวดตามที่ [?SWI.SWI_biggest_fascist.GetNameDef] เรียกรอง"
 SWI_seek_trade_agreement_with_germany: "ขอตกลงการคากับเยอรมนี"
 SWI_seek_trade_agreement_with_germany_desc: "ลัทธิฟาสซิสตยังคงผงาดขึ้นอยางนาสะพรึงกลัว และแมจะเปนยาขมที่กลืนยาก แตการยอมรวมมือทางเศรษฐกิจบางสวนอาจเปนสิ่งที่เราตองทําเพื่อใหพวกเขาไมเล็งเปามาที่เรา"
 SWI_axis_gold: "ทองคําฝายอักษะ"
 SWI_axis_gold_desc: "การเปนประเทศเปนกลางหมายความวาตลาดของเราเปดกวางสําหรับทุกประเทศ ซึ่งเปนขอไดเปรียบที่เราใชได การเปดตลาดทองคําให [SWI_biggest_fascist.GetNameDef] จะผูกเศรษฐกิจของเราเขาดวยกันเพื่อเอาใจพวกเขาและยกระดับเศรษฐกิจของทั้งสองฝาย"
 SWI_spirit_of_resistance: "จิตวิญญาณแหงการตอตาน"
 SWI_spirit_of_resistance_desc: "จิตใจของประชาชนแหง [ROOT.GetName] คือแนวรบที่สําคัญที่สุดในการตอสูเพื่อความอยูรอด เราตองทําใหแนใจวาพลเมือง[ROOT.GetAdjective]ทุกคนพรอมสูจนถึงที่สุด แมในยามที่ทุกอยางดูเหมือนจะสิ้นหวัง"
 SWI_pro_helvetia: "โปรเฮลเวเทีย"
 SWI_pro_helvetia_desc: "การปองกันทางจิตวิญญาณของ [ROOT.GetName] ตองการใหวัฒนธรรม[ROOT.GetAdjective]เปนหนึ่งเดียว แบงแยกไมได และแตกตางจากเพื่อนบาน องคกรใหมนี้ โปรเฮลเวเทีย จะอนุรักษและสงเสริมคุณคารวมของชาวสวิสที่ผูกพันแนนแฟนกับประชาธิปไตยของเรา และรับประกันการอยูรอดของเราทามกลางอุปสรรคมหาศาล"
 SWI_spirit_of_saint_bernard: "จิตวิญญาณแหงเซนตเบอรนารด"
 SWI_spirit_of_saint_bernard_desc: "นับแตโบราณกาล เราภาคภูมิใจในธรรมเนียมทางการแพทยและความเต็มใจที่จะชวยเหลือผูตกทุกขไดยาก สถานพักพิงเกรตเซนตเบอรนารดและองคการกาชาดคือขอพิสูจน บัดนี้จิตวิญญาณนั้นสามารถนํามาใชเปนอาวุธและปรับมาใชกับกองกําลังอาสาเพื่อเสริมความพยายามในการปองกันของเรา"
 SWI_adopt_romansh: "ใชภาษาโรมานช"
 SWI_adopt_romansh_desc: "[ROOT.GetName] ไมใชประเทศที่ประกอบดวยภูมิภาค[GER.GetAdjective] [FRA.GetAdjective] และ[ITA.GetAdjective] ที่รอใหเพื่อนบานผูละโมบมาอางสิทธิ์ [ROOT.GetName] คือชาติพหุวัฒนธรรมที่เปนหนึ่งเดียวและแบงแยกไมได การใชภาษาโรมานช ภาษาที่พูดกันเฉพาะในเขตภูเขาของเทือกเขาแอลป[ROOT.GetAdjective] จะแสดงใหพวกเขาเห็นวาวัฒนธรรมและคุณคาของเราแตกตางจากของพวกเขา ไมวาจะพูดภาษาใด"
 SWI_patriotic_shooting_clubs: "ชมรมยิงปนผูรักชาติ"
 SWI_patriotic_shooting_clubs_desc: "[ROOT.GetName] มีธรรมเนียมอันยาวนานของชมรมและการแขงขันยิงปน นักยิงปนสมัครเลนบางคนของเรามีฝมือดียิ่งกวาพลซุมยิงอาชีพของชาติอื่นเสียอีก เราสามารถใชประโยชนจากชมรมเหลานี้และรวมเขากับกองกําลังอาสาเพื่อยกระดับขีดความสามารถในการปองกัน"
 SWI_aktion_nationaler_widerstand: "ขบวนการตอตานแหงชาติ (Aktion Nationaler Widerstand)"
 SWI_aktion_nationaler_widerstand_desc: "มีพลเรือนกลุมเล็ก ๆ ในทุกภาคสวนของสังคม[ROOT.GetAdjective]ที่เต็มใจรวมมือกันอยางลับ ๆ เพื่อโนมนาวประชาชน เปาหมายของพวกเขาคือตอสูกับความพายแพในใจ ปลุกความเปนหนึ่งเดียว และวางรากฐานการตอตานใน [ROOT.GetName] หากถูกรุกราน"
 SWI_heer_und_haus: "กองทัพและบานเรือน (Heer und Haus)"
 SWI_heer_und_haus_desc: "ประชาชนชาวสวิส และกองทัพของสวิสดวย จําเปนตองไดรับการปลุกใจจากภายในใหตอตานและตอสูเพื่อปกปองมาตุภูมิ เพื่อเตือนใจถึงสิ่งที่เปนเดิมพัน โปรเฮลเวเทียโดยความชวยเหลือของกลุมขบวนการตอตานแหงชาติคือกุญแจสําคัญที่จะทําใหพวกเขาคิดและทําอยางชาว[ROOT.GetAdjective]"
 SWI_ortswehren: "กองปองกันทองถิ่น (Ortswehren)"
 SWI_ortswehren_desc: "สงครามเบ็ดเสร็จหมายความวาพลเมือง[ROOT.GetAdjective]ทุกคนตองพรอมปกปองแคนทอนของตน แตไมใชทุกคนที่จะเขารวมกองกําลังอาสาได เราสามารถจัดตั้งกองรักษาการณทองถิ่นเพื่อเปนกระดูกสันหลังที่กองกําลังอาสาพึ่งพาไดในการปกปอง [SWI.GetName]"
 SWI_luftschutz: "การปองกันภัยทางอากาศ (Luftschutz)"
 SWI_luftschutz_desc: "สงครามไดเปลี่ยนไปแลว ทองฟาคือสมรภูมิใหมและเราไมอาจปลอยใหมันกลายเปนจุดออนของเรา ตองจัดตั้งกองกําลังปองกันภัยทางอากาศทองถิ่นที่มีพลเรือนประจําการ และจัดหาเครื่องมือในการตรวจจับและรับมือภัยคุกคามจากอากาศ จะปองกันภูเขาไปทําไม หากพวกเขาบินขามภูเขาไปได!"
 SWI_train_swiss_women: "ฝกสตรีชาวสวิส"
 SWI_train_swiss_women_desc: "หากเราตองการปกปองประเทศอยางสุดกําลัง ก็คงเปนเรื่องไรเหตุผลที่จะกันประชากรครึ่งหนึ่งออกจากความพยายามนี้ สตรีชาว[ROOT.GetAdjective]ควรไดรับการฝกเพื่อรวมตอสูเพื่อความอยูรอดของเรา"
 SWI_ban_national_movement_for_switzerland: "สั่งหามขบวนการแหงชาติเพื่อสวิตเซอรแลนด"
 SWI_ban_national_movement_for_switzerland_desc: "พวกฟาสซิสตก็เหมือนแมลงสาบ มักซอนตัวตามซอกมุมของสังคม อาศัยความประมาทของเราเพื่อสะสมกําลังจนสายเกินกวาจะตอตาน ไมอีกแลว! รูปโฉมและชื่อใหมของพวกมันหลอกเราไมได เราตองโจมตีอยางเด็ดขาดหากตองการรักษาประชาธิปไตยไว"
 SWI_fortify_austrian_border: "เสริมปอมพรมแดนติดออสเตรีย"
 SWI_fortify_austrian_border_desc: "เมื่อออสเตรียตกอยูในมือของศัตรูที่อาจเกิดขึ้น เราไมอาจเสี่ยงใหมีแนวปกที่เปดโลงใหศัตรูฉวยโอกาสไดในยามสงคราม เชนเดียวกับพรมแดนติด [GER.GetNonIdeologyName] เราตองเสริมปอมแนวรบนี้"
 SWI_seek_allied_trade: "แสวงหาการคากับฝายสัมพันธมิตร"
 SWI_seek_allied_trade_desc: "ดวยศัตรูที่รายลอมรอบตัว เราตองรักษาการคาที่สําคัญกับฝายสัมพันธมิตรเพื่อความอยูรอด หากโชคดี เราอาจเลี่ยงการยั่วโทสะเพื่อนบานอื่น ๆ จากการกระชับการคากับคูปรับของพวกเขาได"
 SWI_case_north: "แผนกรณีเหนือ"
 SWI_case_north_desc: "เราไมอาจตัดความเปนไปไดของสงครามกับ [?SWI.SWI_biggest_fascist.GetNameDef] ได เราตองพรอมรับมือ ตองรางแผน จัดสรรเสบียง ขุดสนามเพลาะ และติดอาวุธใหทหาร"
 SWI_freeze_german_assets: "อายัดทรัพยสินเยอรมัน"
 SWI_freeze_german_assets_desc: "หลายปมาแลวที่ [?SWI.SWI_biggest_fascist.GetNameDef] อาศัยความเปนกลางและชองโหวในระบบธนาคารของเราเพื่อเก็บรักษาทรัพยสินที่ไดมาโดยมิชอบและพยุงเศรษฐกิจของตน หนาที่ทางศีลธรรมตองมากอนความเปนกลางแบบสมบูรณ แมเราจะแนใจวาสิ่งนี้จะสงผลตามมาก็ตาม"
 SWI_fund_resistance_groups: "สนับสนุนทุนกลุมตอตาน"
 SWI_fund_resistance_groups_desc: "ชาติยุโรปรบพุงกันเองและกดขี่ผูคนในทุกทวีปมาหลายศตวรรษแลว เปนหนาที่ของชาว[ROOT.GetAdjective]ที่จะชวยเหลือเหยื่อของสงครามไมรูจบในทวีปของเรา ดวยการมอบเครื่องมือใหพวกเขาทําลายพันธนาการและกําหนดอนาคตของตนเอง"
 SWI_citizen_supply_mandate: "คําสั่งใหพลเมืองสํารองเสบียง"
 SWI_citizen_supply_mandate_desc: "เราไมรูวาการรุกรานจะเปนไปในรูปใด และแมเราจะพึ่งพาเครือขายเสบียงแบบรวมศูนยได ก็ไมสอดคลองกับโครงสรางการบังคับบัญชาของเรา ดวยเหตุนี้ทุกครัวเรือน[ROOT.GetAdjective]ตองเก็บเสบียงไวในบานอยางนอย 2 เดือน ทั้งสําหรับตนเองและสําหรับกองกําลังอาสาในทองถิ่น"
 SWI_prepare_infrastructure_and_industry: "เตรียมโครงสรางพื้นฐานและอุตสาหกรรม"
 SWI_prepare_infrastructure_and_industry_desc: "การปองกันประเทศไมใชแคการสรางปอม เรายังตองเสริมโครงสรางพื้นฐานในเทือกเขาแอลปเพื่อเคลื่อนยายทหารและสินคาพลเรือนไดอยางมีประสิทธิภาพยิ่งขึ้น พรอมกับฐานอุตสาหกรรมที่ใหญขึ้นในที่ราบสูงเพื่อพัฒนาตอไป"
 SWI_build_up_military_readiness: "สรางความพรอมทางทหาร"
 SWI_build_up_military_readiness_desc: "ภารกิจการเตรียมความพรอมของประชากรสวิสไมมีวันสิ้นสุด เราไมอาจหยุดพักจนกวาภัยคุกคามจากการรุกรานจะหมดไป และมันอาจไมมีวันหมดไป เราตองมุงใหประเทศเตรียมการปองกันโดยไมชักชา"
 SWI_support_active_militias_continuous_focus: "สนับสนุนกองกําลังอาสาที่ปฏิบัติการ"
 SWI_support_active_militias_continuous_focus_desc: "พลเมืองของเราติดอาวุธและประจําการในกองกําลังอาสาทองถิ่นแลว เปนหนาที่ของคนอื่น ๆ ทุกคนที่จะสนับสนุนพวกเขาเทาที่ทําได เพื่อใหเราสกัดกั้นศัตรูของสมาพันธรัฐไวได"

 SWI_rig_infrastructure_to_blow_TT: "เมื่อรัฐดินแดนหลักรัฐใดของเราถูกศัตรูยึด §Yโครงสรางพื้นฐาน§! §Yทางรถไฟ§! §Yศูนยเสบียง§! และ§Yบังเกอร§!ทั้งหมดจะเสียหายอยางสิ้นเชิง §Yโรงงานทหาร§!และ§Yโรงงานพลเรือน§!จะเสียหายบางสวน"
 SWI_create_anti_tank_template_TT: "จะมีการสรางแมแบบสําหรับ§Yกองกําลังอาสาตอสูรถถังสวิส§!"

##### Submit to Germany #####

 SWI_closer_ties_with_germany: "กระชับสัมพันธกับ [SWI_get_fascist_neighbor_cap]"
 SWI_closer_ties_with_germany_desc: "เรามีเพื่อนบานที่ทรงพลังและอันตรายอยูทางเหนือ หากตองการอยูรอด การรักษาสัมพันธที่ดีกับพวกเขาอาจเปนความคิดที่ดี ดังนั้นการเขาหาพวกเขาเพื่อปรับปรุงความสัมพันธ ขณะที่ยังคงจุดยืนเปนกลาง จะเปนสิ่งสําคัญยิ่ง"
 SWI_panoramaheim_branch: "พาโนรามาไฮม"
 SWI_panoramaheim_branch_desc: "มีบานหลังหนึ่งในชตุทการท พวกเขาเรียกมันวา 'บานพาโนรามา' และเปนแหลงกําเนิดของสายลับแนวที่หาจํานวนมาก ซึ่งมีเปาหมายบอนทําลายเสถียรภาพของรัฐบาล[ROOT.GetAdjective] และเปดทางใหระบอบที่นําโดยฟาสซิสต"
 SWI_the_national_front: "แนวรวมแหงชาติ"
 SWI_the_national_front_desc: "แนวรวมแหงชาติคือพรรคฟาสซิสตชั้นนําใน [ROOT.GetNonIdeologyName] หากจะมีใครขึ้นสูอํานาจในชาติที่โนมเอียงไปทางประชาธิปไตยนี้ ก็คือพวกเขา สมาชิกระดับสูงบางคนมีความสัมพันธใกลชิดกับ [GER.GetNameDef] อยูแลว ซึ่งอาจนําไปสูการคุมครองบางรูปแบบจากพวกเขา หากหรือเมื่อสงครามเริ่มขึ้น"
 SWI_infiltrate_federal_police: "แทรกซึมตํารวจสหพันธรัฐ"
 SWI_infiltrate_federal_police_desc: "ดวยอํานาจหนาที่ในการกวาดลางโฆษณาชวนเชื่อของตางชาติและกองกําลังที่ไมเปนประชาธิปไตย ตํารวจสหพันธรัฐจึงเปนเปาหมายที่เหมาะในการแทรกซึมเพื่อปองกันไมใหฝายของเราตกเปนเปา ในที่สุดสิ่งนี้ยังจะชวยใหเรากําจัดศัตรูภายใตขออางความมั่นคงของชาติไดดวย"
 SWI_the_petition_of_the_200: "คํารองของ 200 คน"
 SWI_the_petition_of_the_200_desc: "สมาชิก 200 คนจากหลากหลายพรรคที่เปนตัวแทนของลัทธิฟาสซิสตและอํานาจนิยม[ROOT.GetAdjective] ไดยื่นคํารองนี้ตอสภา เรียกรองใหเราเริ่มยอมรับและรวมมือกับ [GER.GetNameDef] เพื่อความอยูรอดของตนเอง"
 SWI_case_west: "แผนกรณีตะวันตก"
 SWI_case_west_desc: "เราตองเตรียมพรอมสําหรับทุกสถานการณที่เปนไปได [FRA.GetName] เปนภัยคุกคามไมแพ [GER.GetNameDef] และตองรับมืออยางเหมาะสม เราตองเตรียมกองทัพและประเทศใหพรอมทําสงครามกับชาว[FRA.GetAdjective] มิฉะนั้นเราเสี่ยงตอการลมสลายของ [ROOT.GetNonIdeologyName]"
 SWI_german_industrial_investments: "การลงทุนทางอุตสาหกรรมจาก[SWI_get_fascist_neighbor_adjective]"
 SWI_german_industrial_investments_desc: "ความยิ่งใหญทางอุตสาหกรรมของ [?SWI.SWI_biggest_fascist.GetNonIdeologyName] เปนที่ประจักษ หากเราตองการอยูรอดจากสงครามที่กําลังจะมาถึง เราตองมีฐานอุตสาหกรรมของตนเองเพื่อแขงขันและใชเปนขอตอรอง การที่ [?SWI.SWI_biggest_fascist.GetNameDefCap] ลงทุนในประเทศเรายังหมายความวาพวกเขาจะมีเหตุผลที่จะรักษา [ROOT.GetNonIdeologyName] ไวใหคงอยู"
 SWI_complete_siegfried_line: "สรางแนวซีกฟรีดใหสมบูรณ"
 SWI_complete_siegfried_line_desc: "[GER.GetNameDefCap] ไดสรางแนวกําบังอันนาประทับใจไวปองกัน [FRA.GetName] และเรามีเหตุผลเชื่อวาเราก็ตองปองกันพวกเขาเชนกัน โดยเฉพาะเมื่อเราใกลชิดกับ [GER.GetNonIdeologyName] มากขึ้น ดวยเหตุนี้เราจึงตองประสานงานและสรางแนวปองกันเสริมกัน"
 SWI_military_exercises_with_germany: "ซอมรบรวมกับ [SWI_get_fascist_neighbor]"
 SWI_military_exercises_with_germany_desc: "แมจะมีทาทีเปนปรปกษตอคุณคาประชาธิปไตยดั้งเดิมของเรา แต [SWI_get_fascist_neighbor] อาจเปนพันธมิตรที่มีคาเมื่อถึงเวลาตองปองกันตนเอง และยิ่งไปกวานั้น ยังลดโอกาสที่พวกเขาจะบุกเราดวย"
 SWI_abandon_neutrality: "ละทิ้งความเปนกลาง"
 SWI_abandon_neutrality_desc: "ทั่วยุโรปกําลังเลือกขาง เราจะถูกจับไดโดยไมทันตั้งตัวไมได ทางออกเดียวที่เห็นไดชัดคือละทิ้งจุดยืนเปนกลางทางประวัติศาสตรและแสวงหาความคุมครองจาก [SWI_get_fascist_neighbor] มิฉะนั้นเราเสี่ยงจะติดอยูระหวางหินกับที่แข็ง"
 SWI_promote_tobler: "สนับสนุนท็อบเลอร"
 SWI_promote_tobler_desc: "ในฐานะสมาชิกพรรคฟาสซิสตเพียงคนเดียวที่ไดรับเลือกเขาสูรัฐสภา[ROOT.GetAdjective] และผูนําแนวรวมแหงชาติ โรแบรท ท็อบเลอร คือผูสมัครที่ชัดเจนที่จะนํา [ROOT.GetNonIdeologyName] ผานการเปลี่ยนผานที่ชาแตมั่นคง จากชาติประชาธิปไตยพหุนิยมไปสูพันธมิตรของ[SWI_get_fascist_neighbor_adjective]ที่ปกครองดวยกําปนเหล็ก แนนอนวาหมายถึงการขับรอลฟ เฮนเนอ ออกจากพรรค เพราะฟอเรอรมีไดเพียงคนเดียว"
 SWI_promote_henne: "สนับสนุนเฮนเนอ"
 SWI_promote_henne_desc: "ในฐานะผูสนับสนุนลัทธิฟาสซิสตและความรวมมือกับ [SWI_get_fascist_neighbor] อยางแข็งขัน รอลฟ เฮนเนอ คือผูสมัครชั้นยอดที่จะนําแนวรวมแหงชาติและ [ROOT.GetName] ไปเปนรัฐบริวารของ[SWI_get_fascist_neighbor_adjective] ซึ่งยอมมาพรอมผลประโยชน ไมนอยไปกวาความปลอดภัยและการอยูรอดของเรา แนนอนวาหมายถึงการขับโรแบรท ท็อบเลอร ออกจากพรรค เพราะเขาไมเต็มใจทําสิ่งที่จําเปน"
 SWI_propagandize_swiss_military_tradition: "โฆษณาธรรมเนียมทหารสวิส"
 SWI_propagandize_swiss_military_tradition_desc: "นี่ไมใชเวลารําลึกถึงอดีตประชาธิปไตยของเรา เราตองมุงไปที่ธรรมเนียมการรบของเราแทน ทหารราบและพลหนาไม[ROOT.GetAdjective]เคยเลื่องชื่อในดานวินัยและประสิทธิภาพ ถูกวาจางทั่วโลกในฐานะทหารรับจางที่เปนที่ตองการ หากเราตองการอยูรอดในสงครามที่กําลังมาถึง เราตองเตือนใหประชาชนระลึกถึงประวัติศาสตรทางทหารของตน"
 SWI_ban_democratic_party: "สั่งหามพรรคประชาธิปไตย"
 SWI_ban_democratic_party_desc: "พรรคประชาธิปไตยของเรากําลังเปนอุปสรรคตอการเขาหา [SWI_get_fascist_neighbor] หากเราตองการเขาขางพวกเขามากขึ้น ก็หมายความวาเราตองทําสิ่งที่เมื่อไมกี่ปกอนคิดไมถึง นั่นคือกําจัดพรรคการเมืองประชาธิปไตย หากนี่คือการเสียสละที่ตองทํา ก็ตองเปนเชนนั้น"
 SWI_centralize_switzerland: "รวมศูนยอํานาจสวิตเซอรแลนด"
 SWI_centralize_switzerland_desc: "[ROOT.GetNonIdeologyName] ที่เรากําลังมุงไปนั้นหางไกลจากสมาพันธรัฐสวิสเกาที่เรามีมาเกือบศตวรรษ เราจะไมเปนสมาพันธรัฐอีกตอไป แตเปนประเทศรวมศูนยที่อํานาจมาจากเบื้องบนและไหลลงสูมวลชน"
 SWI_german_military_collaboration: "ความรวมมือทางทหารกับ[SWI_get_fascist_neighbor_adjective]"
 SWI_german_military_collaboration_desc: "เราขาดประสบการณดานการสงครามที่จําเปนตอการเติบโตของกองทัพในโลกสมัยใหม นี่คือจุดที่ [?SWI.SWI_biggest_fascist.GetName] เขามามีบทบาท กองทัพของพวกเขาเปนกําลังที่ตองเกรงขาม และการรวมมือกับพวกเขาจะชวยใหเราปองกันตนเองได และอาจถึงขั้นโจมตีชาติอื่นกอนไดดวย"
 SWI_join_the_axis: "เขารวมฝายอักษะ"
 SWI_join_the_axis_desc: "นี่แหละคือเดิมพันของเราเพื่อความอยูรอดของ [ROOT.GetNonIdeologyName] ในพายุที่กําลังจะมาถึง เราจะเขาสูพายุนั้นภายใตธงของฝาย [?SWI.SWI_biggest_fascist.GetName] ขอใหเราตัดสินใจถูก"
 SWI_become_german_puppet: "เปนรัฐหุนเชิดของ[SWI_get_fascist_neighbor_adjective]"
 SWI_become_german_puppet_desc: "เฮนเนอทุมเทชีวิตการงานทั้งหมดเพื่อชวงเวลานี้ อันชลุสสในแบบของ [ROOT.GetNonIdeologyName] เอง แมเราจะสูญเสียอธิปไตยอันยาวนาน แตเราอาจไดเศษเสี้ยวจากพวกเขาบาง เราไดแตหวังวานี่จะไมใชจุดจบของเรา"
 SWI_ask_for_vorarlberg: "ขอ [848.GetName]"
 SWI_ask_for_vorarlberg_desc: "เมื่อเราอยูใตปกของ [?SWI_fascist_overlord.GetName] มาระยะหนึ่งและพิสูจนความภักดีแลว ถึงเวลาที่พวกเขาจะไววางใจมอบสิ่งที่เปนของเราโดยชอบธรรม [848.GetName] เคยลงคะแนนขอเขารวมกับเราตั้งแตครั้งที่ [ROOT.GetNonIdeologyName] ยังเปนสมาพันธรัฐประชาธิปไตย จึงไมตองสงสัยเลยวาพวกเขายอมตองการเขารวมกับเราในรูปแบบปจจุบัน"
 SWI_size_and_opinion_chance_tooltip: "\nพวกเขามีแนวโนมจะยอมรับมากขึ้นตาม§Yขนาด§!ของกองทัพเราและ§Yความเห็น§!ที่มีตอเรา"
 SWI_request_austrian_occupation: "ขอยึดครอง[AUS.GetAdjective]"
 SWI_request_austrian_occupation_desc: "การที่ [ROOT.GetNonIdeologyName] ผนวก [848.GetName] ไมใชรูปแบบสุดทายของเราอยางแนนอน เราสามารถพิสูจนให [?SWI_fascist_overlord.GetName] เห็นวาเราบริหารดินแดนที่ใหญขึ้นได แบงเบาภาระของพวกเขา และทําให [ROOT.GetFactionName] เปนจักรกลสงครามที่มีประสิทธิภาพยิ่งขึ้น"
 SWI_request_italian_alps_occupation: "ขอยึดครอง[ITA.GetAdjective]"
 SWI_request_italian_alps_occupation_desc: "ดวยสวนหนึ่งของประเทศเราประกอบดวยพลเมืองที่พูดภาษา[ITA.GetAdjective] เราจึงเปลี่ยนผานไปบริหาร [ITA.GetName] ไดอยางราบรื่น และใชประชาชนและทรัพยากรของที่นั่นเพื่อสานตอความพยายามในการเอาชนะสงครามครั้งนี้"
 SWI_request_french_alps_occupation: "ขอยึดครอง[FRA.GetAdjective]"
 SWI_request_french_alps_occupation_desc: "[FRA.GetNonIdeologyName] หมายปองดินแดนของเรามาหลายชั่วอายุคน จึงสมควรแลวที่บัดนี้เราอยูในฐานะที่จะเขาควบคุมดินแดนของพวกเขาและบริหารเพื่ออนาคตของทั้งสองฝาย"
 SWI_the_alpine_supremacy: "อํานาจสูงสุดแหงแอลป"
 SWI_the_alpine_supremacy_desc: "[SWI.GetNonIdeologyName] ชาติที่ออนแอและไรทิศทางซึ่งดํารงอยูในความเลื่อนลอยของการทูตไดสิ้นสุดลงแลว บัดนี้เราจะเปนที่รูจักในนามอํานาจสูงสุดแหงแอลป เพื่อแสดงถึงอํานาจของเราเหนือเทือกเขาแอลป ผูคน และดินแดนที่ไกลออกไป"

 SWI_professionalize_militias: "ยกระดับกองกําลังอาสาสูมืออาชีพ"
 SWI_professionalize_militias_desc: "ดวยสถานการณที่เปนอยู กองกําลังอาสาลําลองที่ประกอบดวยทหารกองหนุนจะไมเพียงพอ เราตองฝกทุกคนที่มีรางกายพรอมสําหรับความขัดแยงที่กําลังจะมาถึง และสรางพวกเขาใหเปนกองทัพอาชีพที่นาเกรงขาม"
 SWI_modernize_airforce: "ปรับปรุงกองทัพอากาศใหทันสมัย"
 SWI_modernize_airforce_desc: "บัดนี้เปนที่ชัดเจนวาสงครามสมัยใหมไมไดถูกกําหนดเพียงสิ่งที่เกิดขึ้นในสนามรบ แตยังรวมถึงเหนือสนามรบ บนทองฟากวางที่เราหวังจะปกปองและครอบครอง"
 SWI_swiss_airplane_designs: "การออกแบบเครื่องบินสวิส"
 SWI_swiss_airplane_designs_desc: "เราไมอาจพึ่งพาเพื่อนบานในเรื่องเครื่องจักรที่จะทําใหเราครองฟาได เพราะเราไมอาจไวใจวาพวกเขาจะยอมมอบเครื่องมือที่จะใชเอาชนะพวกเขาเองใหแกเราโดยดี"
 SWI_license_axis_plane_designs: "ขอสิทธิ์แบบเครื่องบินฝายอักษะ"
 SWI_license_axis_plane_designs_desc: "วิธีที่เร็วที่สุดในการผลิตเครื่องบินขึ้นสูฟาคือการจัดหาแบบเครื่องบินจากชาติฟาสซิสต มีเพียงพวกเขาที่มีประสบการณการรบลาสุดที่จําเปนตอการรูวาอะไรที่ชนะการรบไดจริง และยังทําใหเราใกลชิดกับพวกเขามากขึ้น ซึ่งอาจยับยั้งไมใหพวกเขาบุกเรา"
 SWI_airspace_surveillance: "การเฝาระวังนานฟา"
 SWI_airspace_surveillance_desc: "หากเราหวังจะปกปอง [ROOT.GetName] และขุนเขาของเรา เราตองจับตาทองฟาเพื่อคนหาขาศึก เครื่องมือใหมจะชวยใหเราพบขาศึกและสงพวกเขาเขาสูศูนยเล็งของเครื่องบินขับไลและปนตอสูอากาศยานของเรา"

 SWI_professionalize_militias_TT: "กองพล§Yกองกําลังอาสาพลเมืองสวิส§!ทั้งหมดจะกลายเปนกองพล§Yทหารราบประจําการ§! และการตัดสินใจ §Y$SWI_military_readiness_decisions_category$§! จะถูกปดใชงาน"
 SWI_neutrality_decisions_disabled_TT: "การตัดสินใจ §Y$SWI_absolute_neutrality_decisions_category$§! จะถูกปดใชงาน"
 SWI_has_fascist_neighbor_trigger_TT: "มีเพื่อนบานฟาสซิสตที่เหมาะสม"

 SWI_crack_down_on_dissent: "ปราบปรามผูเห็นตาง"
 SWI_crack_down_on_dissent_desc: "[ROOT.GetNonIdeologyName] จะแตกแยกไมไดในยามที่รอยราวเพียงจุดเดียวในสังคมอาจนําไปสูการลมสลายของรัฐบาล[ROOT.GetAdjective]"
 SWI_military_police: "สารวัตรทหาร"
 SWI_military_police_desc: "สถาบันของสหพันธรัฐที่มีมายาวนานจะไมเพียงพอตอการรักษาความสงบเรียบรอยในยามไมแนนอนเชนนี้ เราจําเปนตองมีสารวัตรทหารหากตองการรักษาเอกภาพไว"
 SWI_expand_federal_police_intelligence: "ขยายฝายขาวกรองตํารวจสหพันธรัฐ"
 SWI_expand_federal_police_intelligence_desc: "ศัตรูซุมอยูในเงามืดและอาจอยูในรูปใดก็ได รวมถึงในรูปของประชาชนของเราเอง ดวยเหตุนี้ ฝายขาวกรองของตํารวจสหพันธรัฐตองมีเครื่องมือในการบดขยี้ผูเห็นตางไมวาจะอยูที่ใด"
 SWI_martial_law: "กฎอัยการศึก"
 SWI_martial_law_desc: "บางสถานการณตองใชมีดผาตัด แตยุคสมัยของเราไมใชเชนนั้น [ROOT.GetNameDef] ตองการคอนที่ไวใจไดเพื่อควบคุมทั้งศัตรูและประชาชนของเรา"
####### Weapons Industry Sub Branch ####### 
 
 SWI_expand_weapons_industry: "ขยายอุตสาหกรรมอาวุธ"
 SWI_expand_weapons_industry_desc: "กําลังการผลิตทางอุตสาหกรรมทหารอันนอยนิดของเราจะไมเพียงพอในสงครามเต็มรูปแบบ สงครามสมัยใหมตัดสินแพชนะกันที่วาใครกระสุนหมดเปนคนสุดทาย เราจึงตองทําใหแนใจวาเราผลิตยุทโธปกรณสงครามไดในอัตราที่เร็วขึ้นและยาวนานขึ้น"
 SWI_swiss_armored_divisions: "กองพลยานเกราะสวิส"
 SWI_swiss_armored_divisions_desc: "ในอดีตเราภาคภูมิใจในทหารราบอันยอดเยี่ยม แตนั่นไมเพียงพอเมื่อตองสูกับยานเกราะมหึมาของศัตรู เราตองสรางอสูรยานยนตของเราเอง"
 SWI_alpine_specialization: "ความเชี่ยวชาญแหงแอลป"
 SWI_alpine_specialization_desc: "เรายึดถือธรรมเนียมแหงขุนเขาไดมากกวาชาติใด และฝกกองกําลังที่ไมมีใครหยุดยั้งได ซึ่งปองกันและโจมตีบนภูเขาไดอยางที่ไมมีใครเทียบ พวกเขาจะเปนหิมะถลมที่กวาดลางศัตรู"
 SWI_tank_development: "การพัฒนารถถัง"
 SWI_tank_development_desc: "เราจะประมาทในการพัฒนารถถังรุนใหมที่ดีกวาเดิมไมได มิฉะนั้นเราเสี่ยงจะสูญเปลาเหล็กกลาไปกับเตาเหล็กที่ไรประโยชนและลาสมัย"
 SWI_mechanized_support: "การสนับสนุนยานเกราะลําเลียงพล"
 SWI_mechanized_support_desc: "ทหารของเราตองไปถึงสนามรบไดเร็วกวาที่เคย และหนวยสนับสนุนที่พวกเขาตองการก็เชนกัน มิฉะนั้นความรวดเร็วทั้งหมดนั้นก็สูญเปลา"
 SWI_artillery: "ปนใหญสวิส"
 SWI_artillery_desc: "ปลอยใหกระสุนปนใหญถลมใสศัตรูขณะที่กองกําลังเรารุกคืบ ปนใหญจะชวยให [ROOT.GetNonIdeologyName] ปองกันจากขุนเขาและบุกไปขางหนาไดอยางมีประสิทธิภาพที่สุด บดขยี้ฝายตรงขามภายใตหาตะกั่ว"
 SWI_industrial_production: "การผลิตทางอุตสาหกรรม"
 SWI_industrial_production_desc: "เราจะละเลยแนวหลังไมได ทุกคนที่มีรางกายพรอมในแคนทอนตาง ๆ ของ [ROOT.GetNonIdeologyName] ตองเต็มใจเสียสละเพื่อจักรกลสงครามของเรา"
 SWI_swiss_heavy_planes: "เครื่องบินหนักสวิส"
 SWI_swiss_heavy_planes_desc: "จากฐานทัพใน [ROOT.GetNonIdeologyName] เราสามารถเปดปฏิบัติการไปยังดินแดนหางไกลได หากเรามีเครื่องบินหนักที่จําเปนสําหรับการเดินทางเชนนั้น แตเราตองออกแบบมันกอน"
 SWI_air_research: "การวิจัยทางอากาศ"
 SWI_air_research_desc: "เราพรอมเรงการวิจัยและพัฒนาเทคโนโลยีอากาศยานใหม หากตองการตามทันความกาวหนาของศัตรูและครองนานฟาไดในที่สุด"
 SWI_air_production: "การผลิตอากาศยาน"
 SWI_air_production_desc: "การมีแบบเครื่องบินที่บินไดเปนเพียงชิ้นแรกของปริศนา ชิ้นตอไปคือการผลิตใหมากพอเพื่อใหนักบินของเราอยูบนฟาไดเสมอ ตอสูกับศัตรูทั้งบนบกและบนฟา"
 SWI_mountaneer_paratroopers: "พลรมภูเขา"
 SWI_mountaneer_paratroopers_desc: "[ROOT.GetNonIdeologyName] เปนที่รูจักทั่วโลกในดานยอดเขาตระหงาน และประชากรจํานวนมากของเราอาศัยอยูบนขุนเขา เราสามารถใชขอไดเปรียบนี้ฝกพลรมชั้นเยี่ยม กองกําลังที่สามารถโดดรมจากฟาตางแดนและยึดขุนเขาตางแดนเพื่อความรุงโรจนของ [ROOT.GetNameDef]"

####### Allied/Aggrocratic ####### 
 
 SWI_purchase_american_planes: "[SWI_purchase_democratic_planes_title]"
 SWI_purchase_american_planes_usa: "ซื้อเครื่องบินอเมริกัน"
 SWI_purchase_american_planes_other: "ซื้อเครื่องบินจากชาติประชาธิปไตย"
 SWI_purchase_american_planes_desc: "กองทัพอากาศของเราขาดทั้งจํานวนและเทคโนโลยีที่จําเปนตอการปองกันตนเองอยางมีประสิทธิภาพ เราจึงตองมองหายุทโธปกรณจากที่อื่น [SWI_purchase_american_planes_second_paragraph]"
 SWI_american_planes_desc_usa: "หากเราจะซื้อเครื่องบินจากชาติอื่น [USA.GetNameDef] ซึ่งมีธรรมเนียมประชาธิปไตย ความเปนกลางในระดับหนึ่ง และวิศวกรรมการบินอันยอดเยี่ยม คือตัวเลือกที่เหมาะสมที่สุด"
 SWI_american_planes_desc_other: "เนื่องจากเราไมอาจละทิ้งคุณคาประชาธิปไตยเพื่อแลกกับเครื่องบินไมกี่ลํา จึงสําคัญที่เราตองจัดหายุทโธปกรณจากประเทศประชาธิปไตยอื่น และ [?SWI.SWI_best_dem_ally.GetNameDef] ดูจะเปนตัวเลือกที่ดีที่สุด"
 SWI_allied_gold: "ทองคําฝายสัมพันธมิตร"
 SWI_allied_gold_desc: "ความปนปวนและการควํ่าบาตรที่ปกคลุมสถานการณปจจุบันทําใหการคาทองคําถูกจํากัดและยากลําบากขึ้น แตดวยจุดยืนเปนกลาง เราสามารถเปดโอกาสเพิ่มการคาทองคํากับชาติประชาธิปไตยอื่น ๆ คํ้าจุนเศรษฐกิจประชาธิปไตยเพื่อสกัดกั้นลัทธิฟาสซิสต"
 SWI_closer_democratic_ties: "กระชับสัมพันธประชาธิปไตย"
 SWI_closer_democratic_ties_desc: "ขณะที่ระบอบอัตตาธิปไตยทอดเงาทั่วยุโรป เราอาจไมสามารถปกปองตนเองไดลําพัง แตดวยการรวมมือกับชาติประชาธิปไตยอื่น เราอาจหยุดยั้งการรุกคืบของมันได กาวแรกคือการกระชับความสัมพันธกับพวกเขาและพิสูจนวาเรามีสวนชวยอุดมการณนี้ได"
 SWI_connect_to_the_maginot_line: "เชื่อมตอแนวมาฌิโน"
 SWI_connect_to_the_maginot_line_desc: "ลมแหงสงครามกําลังพัดไปทาง [FRA.GetName] และมีโอกาสสูงที่ศัตรูของเธอจะตองโจมตีแนวที่เรียกวาแนวมาฌิโน ซึ่งทําใหเราตกอยูในสถานการณอันตราย เพราะ [?SWI.SWI_biggest_fascist.GetNonIdeologyName] อาจถูกลอใจใหออมแนวนี้ดวยการบุกเรา ดวยเหตุนี้เราตองประสานงานกับ [FRA.GetName] และสรางแนวรวมที่เปนหนึ่งเดียว"
 SWI_american_industrial_investments: "การลงทุนทางอุตสาหกรรมจากอเมริกา"
 SWI_american_industrial_investments_desc: "มหาสงครามแสดงใหเห็นชัดวาพลังทางอุตสาหกรรมของ[USA.GetAdjective]สามารถพลิกสถานการณใด ๆ ใหเปนประโยชนแกพวกเขาได หากเราเขาหาและไดรับการลงทุนทางอุตสาหกรรมจากพวกเขา เราจะเสริมฐานะของเราและทําใหแนใจวาการปกปองเอกราชของเราเปนผลประโยชนสูงสุดของพวกเขา"
 SWI_take_a_stance: "แสดงจุดยืน"
 SWI_take_a_stance_desc: "[?SWI_biggest_fascist.GetNonIdeologyName] ฝายฟาสซิสตมีระบบการเมืองที่นารังเกียจและเลวทรามที่สุด [?SWI_biggest_fascist.GetNameDefCap] คือศัตรูคูอาฆาตของ [SWI.GetName] ใหม ดวยเหตุนี้เราตองยืนหยัดและปกปองประชาธิปไตยดวยทุกวิถีทาง"
 SWI_join_france: "เขารวมกับฝรั่งเศส"
 SWI_join_france_desc: "แมความสัมพันธจะไมไดราบรื่นเสมอไป แต [ROOT.GetName] และ [FRA.GetName] มีคุณคาประชาธิปไตยรวมกันและยังใชภาษาเดียวกันดวย หากเราตองเลือกขางในความขัดแยงที่กําลังจะมาถึง ความคุมครองของพวกเขายอมนาปรารถนากวาทางเลือกอื่นอยางไมตองสงสัย"
 SWI_the_second_helvetic_republic: "สาธารณรัฐเฮลเวติกที่สอง"
 SWI_the_second_helvetic_republic_desc: "ยอนไปในป 1798 จอมเผด็จการผูฉาวโฉ นโปเลียน โบนาปารต ไดพิชิต [ROOT.GetName] และตั้งสาธารณรัฐเฮลเวติกขึ้นเปนเครื่องมือกดขี่ประชาชนของเรา โชคดีที่วันเวลาเหลานั้นผานพนไปแลว และเรามั่นใจไดวาในครั้งที่สองนี้ เราจะไดรวมตัวกับเพื่อนบานเกาแกอยางเทาเทียมกวาเดิม"
 SWI_alpine_aspirations: "ความใฝฝนแหงแอลป"
 SWI_alpine_aspirations_desc: "รัฐบาลกลางของ [ROOT.GetNonIdeologyName] ไดขยายตัวและเติบโตเปนสาธารณรัฐเฮลเวติก บัดนี้เรามีทรัพยากรที่จะบริหารพื้นที่ที่ใหญขึ้น เราควรขอให [FRA.GetNameDef] ขยายเขตควบคุมของเราเพื่อเขาใกลการรวมเทือกเขาแอลปไวใตธงเดียว"
 SWI_support_allied_espionage: "สนับสนุนการจารกรรมของฝายสัมพันธมิตร"
 SWI_support_allied_espionage_desc: "การที่เรายึดนโยบายตางประเทศแบบเปนกลางไมไดขัดขวางเราจากการสนับสนุนชาติประชาธิปไตยอื่นอยางลับ ๆ ในความพยายามปราบลัทธิฟาสซิสตในยุโรป อันที่จริง ความเปนกลางและความใกลชิดกับ [?SWI.SWI_biggest_fascist.GetNameDef] ทําใหเรามีความสําคัญยิ่งในการตอสูกับลัทธิฟาสซิสตในระดับนานาชาติ"
 SWI_expand_spy_networks: "ขยายเครือขายสายลับ"
 SWI_expand_spy_networks_desc: "ศัตรูอยูขางนอกนั่น เราตองยื่นมือออกไปเพื่อปกปองพรมแดนและแนวหลังกอนที่อันตรายจะมาถึง เครือขายจารกรรมของเราสามารถเปนรากฐานของการปองกันที่ภายนอกยังดูเปนกลางและไมมีพิษภัย"
 SWI_share_spy_networks: "แบงปนเครือขายสายลับ"
 SWI_share_spy_networks_desc: "เปาหมายของ [?SWI.SWI_best_dem_ally.GetNameDefCap] เหมือนกับของเรา คือสกัดกั้นลัทธิฟาสซิสต และเราไมจําเปนตองเปนปฏิปกษกับ [?SWI.SWI_biggest_fascist.GetNameDef] เพื่อบรรลุเปาหมายนี้ [ROOT.GEtName] มีสายลับที่มีประสบการณซึ่งกลมกลืนเขากับสังคม[GER.GetAdjective] [ITA.GetAdjective] และ[FRA.GetAdjective]ได เราสามารถมอบความไดเปรียบนี้ให [?SWI.SWI_best_dem_ally.GetNonIdeologyName]"
 SWI_secret_pact_with_the_allies: "กติกาลับกับฝายสัมพันธมิตร"
 SWI_secret_pact_with_the_allies_desc: "[ROOT.GetName] ยังไมพรอมสําหรับสงครามเต็มรูปแบบ หรือแมแตการเขารวมฝายอยางเปดเผย แตเรามั่นใจไดวาเราจะไมปลอดภัยหากไมมีมิตร เพื่อปกปองประชาธิปไตยในกรณีถูกรุกรานแบบไมทันตั้งตัว เราสามารถพบกับ [?SWI.SWI_best_dem_ally.GetNameDef] อยางลับ ๆ และทําขอตกลง เราจะสัญญาวาจะสนับสนุนพวกเขาอยางลับ ๆ และเริ่มเตรียมเขารวมสงคราม แลกกับการที่พวกเขาจะปกปองเราหากเราถูกโจมตี"
 SWI_oasis_of_democracy: "โอเอซิสแหงประชาธิปไตย"
 SWI_oasis_of_democracy_desc: "ศัตรูของประชาธิปไตยรายลอม [ROOT.GetName] ในยามปนปวนเชนนี้ เราตองยืนหยัดมั่นคงในความยึดมั่นตอคุณคาของเรา [ROOT.GetName] และประชาธิปไตยแยกจากกันไมได จึงไมมีความหมายที่จะอยูรอดในฐานะประเทศ หากประชาธิปไตยตองดับสูญไปเพื่อปกปองมัน"
 SWI_oasis_of_democracy_tt: "เมื่อแผนยุทธศาสตร §Y$SWI_axis_gold$§! เสร็จสิ้นและมีประเทศฟาสซิสตอยางนอย §Y1§! ประเทศที่มีจิตวิญญาณ §Y$SWI_gold_trade$§!:"
 SWI_volunteer_force: "กองกําลังอาสาสมัคร"
 SWI_volunteer_force_desc: "เรายังไมไดอยูในภาวะสงคราม แตชาว[ROOT.GetAdjective]พรอมตอสูเพื่อประชาธิปไตยแลว เราจะถูกมองวาละเมิดความเปนกลางไมได แตในฐานะประชาธิปไตย เราไมอาจควบคุมไดวาประชาชนจะไปที่ใดและตอสูที่ใด เราจึงสามารถสนับสนุนอยางเงียบ ๆ ใหจับอาวุธตอตานทรราช เพื่อเตรียมพรอมให [ROOT.GetName] สวนที่เหลือเขารวมความพยายามอยางเปดเผย"
 SWI_export_saboteurs: "สงออกนักกอวินาศกรรม"
 SWI_export_saboteurs_desc: "เราไมจําเปนตองเขารวมสงครามหากทําลายศัตรูไดจากภายใน หนวยขาวกรองของเราสามารถขัดเกลาปฏิบัติการใหเชี่ยวชาญดานการปลุกปนและเสริมการตอตานในดินแดนที่ถูกผูกดขี่ยึดครอง คอย ๆ กัดกรอนอํานาจของพวกเขา"
 SWI_lay_the_groundwork: "วางรากฐาน"
 SWI_lay_the_groundwork_desc: "เพื่อเตรียมพรอมสําหรับสงครามเต็มรูปแบบ เราตองมีรากฐานที่ดีกอน โครงสรางพื้นฐานและเครือขายคมนาคมของ [ROOT.GetName] ตองไดรับการปรับปรุงใหทันสมัย เมื่อนั้นพลเมืองของเราจึงจะระดมพลไปยังแนวหนาไดอยางมีประสิทธิภาพ"
 SWI_arsenal_of_the_alps: "คลังแสงแหงแอลป"
 SWI_arsenal_of_the_alps_desc: "ยอดเขาสูงชัน ปอมปราการแนนหนาที่เราสรางไว และความรูเรื่องภูมิประเทศ ทําใหเทือกเขาแอลปเปนสถานที่สมบูรณแบบในการเพิ่มขีดความสามารถทางทหารอยางกาวกระโดดและรักษาไวหากเราตองถอยรน"
 SWI_thunder_in_the_valleys: "อสนีบาตในหุบเขา"
 SWI_thunder_in_the_valleys_desc: "สงครามยานเกราะไมมีที่ทางในขุนเขาที่เราคุนเคย แตหากเราตองการเปนฝายรุกและโจมตีศัตรูกอนที่พวกเขาจะมาถึงเรา เราตองเรงไลตามใหทันและพัฒนายานพาหนะของเราเอง"
 SWI_fighting_for_the_hills: "สูเพื่อเนินเขา"
 SWI_fighting_for_the_hills_desc: "ทายที่สุดแลว ทหารราบคือองคประกอบที่อเนกประสงคที่สุดของกองทัพ และแม [ROOT.GetNonIdeologyName] จะภาคภูมิใจในทหารราบมาโดยตลอด แตเราไมไดทําสงครามมาเกือบศตวรรษแลว การทบทวนเทคโนโลยีและหลักนิยมทหารราบจึงสําคัญอยางยิ่ง"
 SWI_fly_over_the_mountains: "บินขามขุนเขา"
 SWI_fly_over_the_mountains_desc: "ขุนเขาของเราสูงเสียดฟามาโดยตลอด แตในโลกปจจุบัน เราตองเรียนรูที่จะอยูเหนือมัน การนําการตอสูไปหาศัตรูบนทองฟาตองเปนเรื่องเรงดวนตั้งแตตอนนี้"
 SWI_weapons_of_democracy: "อาวุธแหงประชาธิปไตย"
 SWI_weapons_of_democracy_desc: "กอนที่ศัตรูจะทําสิ่งที่เกินจินตนาการ เราตองพรอมทําสิ่งที่จําเปนเพื่อหยุดพวกเขา แมจะหมายถึงการใชอาวุธทําลายลางสูงแบบไมเลือกเปาที่สามารถโปรยนรกใสศัตรูได สิ่งนั้นยอมยับยั้งพวกเขาจากการกอความโหดรายเพิ่มเติมไดอยางแนนอน"
 SWI_jump_into_action: "กระโจนเขาสูสมรภูมิ"
 SWI_jump_into_action_desc: "เพียง 10 ปกอนสิ่งนี้คงเปนไปไมได แต [ROOT.GetNameDef] ไดเตรียมการทุกอยางเพื่อเขารวมความพยายามในสงครามอยางแข็งขันและเปดเผย เราไดเตรียมโครงสรางพื้นฐาน อุตสาหกรรม และสถาบันวิทยาศาสตรสําหรับความขัดแยงเต็มรูปแบบที่ไมเคยเห็นมากอน เครื่องจักรสงคราม[ROOT.GetAdjective]กําลังกระหึ่ม พรอมคํารามเขาสูสมรภูมิ"
 SWI_exiled_government: "รัฐบาลพลัดถิ่น"
 SWI_exiled_government_desc: "แมเราจะพยายามอยางดีที่สุด แตดูเหมือนเราจะลมเหลวในการปกปองมาตุภูมิ จึงไมมีทางเลือกอื่นนอกจากตอสูเพื่อทวงคืนจากแดนไกล คุณคาประชาธิปไตยของ[ROOT.GetAdjective]คือสิ่งที่ทําใหประเทศของเรารุงเรืองมายาวนาน และจะเปนแสงนําทางใหเราทวงคืนมา อยางไรเสีย [ROOT.GetName] ไมไดถูกนิยามดวยดินแดนหรือภาษาที่ผูอยูอาศัยพูด แตดวยความเคารพและการสนับสนุนซึ่งกันและกัน"
 SWI_join_the_allies: "เขารวมพันธมิตร"
 SWI_join_the_allies_desc: "การเสียสละทางวัตถุและการประนีประนอมทางศีลธรรมที่การรักษาความเปนกลางตองการกําลังกลายเปนสิ่งที่ทนไมไหว ไมมีที่วางสําหรับความเปนกลางอีกตอไป โดยเฉพาะกับสภาพการเมืองในยุโรปปจจุบัน แมจะมีขอบกพรอง แตฝายสัมพันธมิตรคือทางเลือกที่ดีที่สุดหากเราตองการรักษาแผนดินและสมาพันธรัฐของเรา นี่คือชวงเวลาที่ไมเหมือนครั้งใดอยางแทจริง"
 
 SWI_gotthardbund_party_name: "สันนิบาตก็อทธารด"
 SWI_gotthardbund_party_name_long: "สันนิบาตก็อทธารด"
   

 SWI_the_alpine_confederation: "สมาพันธรัฐแอลป"
 SWI_the_alpine_confederation_desc: "ประเทศอันยิ่งใหญของเราไดขยายเกินพรมแดนทางประวัติศาสตร และแมแคนทอนใหมภายใตปกของเราจะไดรับสถานะเดียวกับชวีซ เราก็ตองยอมรับสถานะใหมในฐานะผูพิทักษเทือกเขาแอลป มหาอํานาจประชาธิปไตยใหมไดถือกําเนิดขึ้น: สมาพันธรัฐแอลป!"
 SWI_the_alpine_confederation_chance_TT: "\nพวกเขามีแนวโนมจะมอบเอกราชใหเรามากขึ้นตาม§Yขนาด§!ของกองทัพเรา และยังเพิ่มโอกาสที่พวกเขาจะมอบดินแดนแอลปเพิ่มเติมใหเรา ตาม§Yความเห็น§!ที่พวกเขามีตอเราดวย"
 SWI_gotthard_union: "สันนิบาตก็อทธารด"
 SWI_gotthard_union_desc: "เวลาแหงการทะเลาะเบาะแวงและการแบงฝกแบงฝายสิ้นสุดแลว ถึงเวลาที่ [ROOT.GetNonIdeologyName] จะรวมเปนหนึ่งภายใตประชาธิปไตยเดียว พรอมอํานาจเด็ดขาดในการออกมาตรการครอบคลุมทุกดาน ทั้งหมดนี้ในนามของการอยูรอดของธรรมเนียมและคุณคา[ROOT.GetAdjective] เราจะตอตานและไดชัย!"
 SWI_press_for_vorarlberg: "กดดันเรื่องโฟรารลแบรก"
 SWI_press_for_vorarlberg_desc: "ขณะที่รัฐบาล[AUS.GetAdjective]ยังอยูในสภาพยอยยับ เราตองทําตามเจตจํานงประชาธิปไตยของ [848.GetName] ที่แสดงออกในการลงประชามติป 1919 และผนวกพวกเขาเขาสูประชาธิปไตยของเรา เปนหนาที่ของ [ROOT.GetNameDef] ที่จะปกปองพวกเขาจากลัทธิฟาสซิสตและระบอบอัตตาธิปไตย"
 SWI_pre_empt_anschluss: "ชิงตัดหนาอันชลุสส"
 SWI_pre_empt_anschluss_desc: "มีขาวลือวา [GER.GetNameDef] กําลังหมายจะผนวก [AUS.GetName] ในนามของเอกภาพแหง[GER.GetAdjective] นี่ไมใชสิ่งที่ [ROOT.GetNAmeDef] จะยอมใหเกิดขึ้นได เพราะจะทําให [GER.GetNameDef] กลาอางสิทธิ์แบบเดียวกันเหนือแคนทอนที่พูดภาษาเยอรมันของเรา เราตองรีบเตรียมการปองกัน [AUS.GetName] ทั้งหมด"
 SWI_pre_empt_anschluss_tt: "§Yหาก [AUS.GetNameDef] ยอมรับ เราจะไดดินแดนหลักในรัฐดินแดนหลักของพวกเขา§! \n\nพวกเขามีแนวโนมจะยอมรับมากขึ้นตาม§Yขนาด§!ของกองทัพเรา §Yความเห็น§!ที่มีตอเรา และหาก§Y[GER.GetNameDef] กําลังเตรียมการ§!ผนวก [AUS.GetName]"
 SWI_demand_italian_alps: "เรียกรองแอลปอิตาลี"
 SWI_demand_italian_alps_desc: "หลายทศวรรษที่ [ITA.GetName] อางสิทธิ์เหนือแคนทอนที่พูดภาษา[ITA.GetAdjective]ของเราอยางไรยางอาย หากพวกเขาทําเชนนั้นได เราก็เรียกรองใหเทือกเขาแอลปของพวกเขาเขารวมสังคมประชาธิปไตยของเราไดเชนกัน อยางไรเสีย ดินแดนเหลานั้นเปนของ [ROOT.GetNameDef] พอ ๆ กับที่ตีชีโนเปนของ [ITA.GetNameDef]"
 SWI_demand_french_alps: "เรียกรองแอลปฝรั่งเศส"
 SWI_demand_french_alps_desc: "เปนเพียงเรื่องของเวลากอนที่ [FRA.GetNameDef] จะพังทลายภายใตแรงกดดันทั้งภายในและภายนอก เราตองมีจุดยืนเชิงรุกในการปกปองเทือกเขาแอลป มิฉะนั้นศัตรูอันตรายอาจยึดที่มั่นที่ปองกันไดงายและใชเปนฐานเตรียมบุกดินแดนของเรา"
 SWI_alpine_redoubt: "ที่มั่นสุดทายแหงแอลป"
 SWI_alpine_redoubt_desc: "ตราบใดที่เรามีพื้นที่เสริมปอมไวถอยรน เราก็จะเปนกองกําลังที่ไมมีใครหยุดยั้งไดตอผูรุกราน เราตองทําใหเทือกเขาแอลปยากตอการตีแตกยิ่งขึ้นและแผขยายอิทธิพลออกไปจากที่นั่น เมื่อนั้นเราจึงจะสรางระยะหางระหวางเรากับศัตรูได ไมวาศัตรูจะอยูที่ใด.."
 SWI_the_alpine_protectorate: "รัฐในอารักขาแหงแอลป"
 SWI_the_alpine_protectorate_desc: "ไมเคยมีมากอนที่เทือกเขาแอลปจะรวมเปนหนึ่งภายใตระบอบเดียว จนกระทั่งวันนี้ ดวยพลังที่ผสานกัน เราจะปองกันตนเองจากภัยคุกคามใด ๆ และขยายการปองกันนั้นออกไปนอกเทือกเขาแอลป โดยมียอดเขาของเราเปนปอมปราการที่ไมอาจเจาะทะลวงได ซึ่งการบัญชาการของเราจะไมมีวันสั่นคลอน"
 SWI_bring_democracy_to_germany: "นําประชาธิปไตยสูเยอรมนี"
 SWI_bring_democracy_to_germany_desc: "ไรชที่สามหางไกลจากประชาธิปไตยแทบที่สุดเทาที่จะเปนได สาธารณรัฐไวมารกอนหนานั้นก็เปนเพียงตัวประกันของมหาอํานาจผูชนะในมหาสงคราม และระบอบกระหายสงครามของ [GER.GetNonIdeologyName] เกาก็เปนเพียงภาชนะรองรับความทะเยอทะยานอันละโมบของไกเซอร ถึงเวลาแลวที่เพื่อนบานทางเหนือของเราจะไดรูวาประชาธิปไตยหมายถึงอะไร"
 SWI_liberate_italy: "ปลดปลอยอิตาลี"
 SWI_liberate_italy_desc: "ตลอดหลายศตวรรษ [ROOT.GetNonIdeologyName] ไดเห็นนครรัฐเล็ก ๆ และราชอาณาจักรเล็ก ๆ ทางใตรบพุงกันเองและในที่สุดถูกรวมเขาเปนระบอบกษัตริยที่ออนแอ จึงสมควรแลวที่ [ITA.GetNonIdeologyName] จะไดรับการปลดปลอยจากพันธนาการของอัตตาธิปไตยและลัทธิฟาสซิสตโดยพี่ใหญของเธอ"
 SWI_take_over_france: "ปกปองฝรั่งเศส"
 SWI_take_over_france_desc: "[FRA.GetNonIdeologyName] เปนชาติที่เปลี่ยนแปลงงายมาโดยตลอด มีความปนปวนบอยครั้งจนการโยนเหรียญเปนตัวตัดสินวาผลของการปฏิวัติประจําวันจะออกมาเปนประชาธิปไตยที่ออนแอหรือระบอบทหารนิยม ภายใตความคุมครองของ[ROOT.GetAdjective] ชาว[FRA.GetAdjective]จะเจริญรุงเรืองไดภายใตเสถียรภาพแหงประชาธิปไตยของเรา"
 SWI_the_new_eidgenossenschaft: "ไอดเกนอสเซนชาฟทใหม"
 SWI_the_new_eidgenossenschaft_desc: "ในศตวรรษที่ 13 ผูนําของสามแคนทอนผูกอตั้งไดใหคําสัตยสาบานเปนพันธมิตรนิรันดรที่เราเรียกวาไอดเกนอสเซนชาฟท บัดนี้ถึงเวลาที่จะตออายุคําสาบานนั้น เพื่อขยายใหแคนทอนอื่น ๆ ไดสัมผัสสมาพันธรัฐประชาธิปไตยของเรา"
 SWI_expand_the_confederation: "ขยายสมาพันธรัฐ"
 SWI_expand_the_confederation_desc: "ไมมีชาติใดปลอดภัยจากการรุกคืบอยางรวดเร็วของลัทธิเผด็จการเบ็ดเสร็จ หลายภูมิภาคในชาติรอบตัวเราจะไดประโยชนจากความคุมครองที่ธรรมเนียมความเปนกลางของเรามอบให และหากสงครามปะทุ ก็จะไดประโยชนจากขีดความสามารถในการปองกันอันนาเกรงขามของเรา"
 SWI_empower_the_council: "เสริมอํานาจสภา"
 SWI_empower_the_council_desc: "อันตรายซุมอยูรอบตัวเรา และเมื่อมันจูโจม เราจะไรพลังหากเริ่มทะเลาะกันเอง ศัตรูจะลบ [ROOT.GetName] ออกจากแผนที่ รัฐบาลรวมศูนยที่เขมแข็งยอมเปนหนทางเดียวในยามผันผวนเชนนี้"
 SWI_switzerland_on_the_offense: "สวิตเซอรแลนดเปดฉากรุก"
 SWI_switzerland_on_the_offense_desc: "เราจะนั่งพักบนขุนเขารอใหถูกโจมตีไมได เราตองเปนฝายริเริ่มและนําการตอสูไปหาศัตรูกอนที่พวกเขาจะบุกเรา เมื่อนั้นเราจึงจะมั่นใจไดวาการอยูรอดของ [ROOT.GetNameDef] ไดรับการรับประกัน อยางไรเสีย การปองกันที่ดีที่สุดคือการรุกที่แข็งแกรง"
 SWI_neutral_entente: "ภาคีแหงชาติเปนกลาง"
 SWI_neutral_entente_desc: "เราไมใชชาติเปนกลางเพียงชาติเดียวในโลก และดวยความเสี่ยงของสงครามและมหาอํานาจคูสงครามที่ลวงลํ้าความปรารถนาของเราที่จะอยูนอกความขัดแยง เราตองยับยั้งพวกเขาใหมากขึ้น เราตองแสวงหาความชวยเหลือซึ่งกันและกันจากชาติเปนกลางอื่น ๆ ทั้งหมด เพื่อใหสงครามตอชาติเปนกลางหนึ่งหมายถึงสงครามตอชาติเปนกลางทั้งหมด"
 SWI_plains_warfare: "การรบในที่ราบ"
 SWI_plains_warfare_desc: "[ROOT.GetName] มีโอกาสมากมายในการฝกในหุบเขา ภูเขา เนินเขา และปา แตหากเราจะตองรบในตางแดน เราตองปรับตัวใหเขากับหลักนิยมการสงครามสมัยใหม เราไดเห็นแลววาทหารราบยานเกราะลําเลียงพลที่เคลื่อนที่เร็วสามารถสรางความตกตะลึงใหแนวปองกันและนํามาซึ่งชัยชนะอยางรวดเร็ว เราจึงเรียนรูจากสิ่งนี้และนํากองทัพ[ROOT.GetAdjective]เขาสูศตวรรษที่ 20 ได"
 SWI_multipurpose_tanks: "รถถังอเนกประสงค"
 SWI_multipurpose_tanks_desc: "เชนเดียวกับมีดพกอเนกประสงคที่เราแจกจายใหทหารราบ เราตองการเครื่องจักรที่อุดชองวางใด ๆ และทําภารกิจใดก็ตามที่จําเปนตอความพยายามในสงคราม เรายังตองไลตามอีกมากในดานสงครามรถถัง จึงตองพัฒนาหลากหลายรูปแบบเพื่อใหมีกองกําลังที่ครบถวน"
 SWI_rolling_fortresses: "ปอมปราการเคลื่อนที่"
 SWI_rolling_fortresses_desc: "รถถังของเราสามารถเปนสวนหนึ่งของหลักนิยมการปองกันในปจจุบัน เปนดั่งที่มั่นสวนหนาของปอมปราการที่ปกปองขุนเขาของเรา หากศัตรูผานแนวหนาที่เสริมปอมของเราไมได พวกเขาก็จะไมมีวันไปถึงแคนทอนของเรา"
 SWI_extended_supply_lines: "ขยายเสนทางเสบียง"
 SWI_extended_supply_lines_desc: "ในโลกแหงการรุกอยางรวดเร็วและปฏิบัติการยืดเยื้อ การสงกําลังบํารุงสําคัญยิ่งกวาที่เคย และเมื่อเราออกไปไกลจากแคนทอนของเรามากขึ้น ความตองการเสนทางเสบียงใหมที่ดีกวาก็เกิดขึ้น เราตองเรียนรูวิธีปรับปรุงการสงกําลังบํารุงเพื่อยืดเสนทางเสบียงออกไปไดไกลขึ้น และสรางเสนทางใหมไดเร็วขึ้น"
 SWI_dissolve_the_federal_council: "ยุบสภาสหพันธ"
 SWI_president_for_life: "ประธานาธิบดีตลอดชีพ"
 SWI_president_for_life_desc: "สภาสหพันธมีความเปนเอกลักษณในหมูประเทศยุโรป และรับใช [ROOT.GetNonIdeologyName] มาอยางดีในยามสงบ แตบัดนี้เมื่อเห็นชัดวา [?SWI.SWI_confederation_president.GetName] กําลังนําทั้งสภาและประเทศโดยรวม จึงมีเหตุผลหนักแนนที่การปกครองของ [?SWI.SWI_confederation_president.GetHerHis] จะดําเนินตอไปอยางไมมีกําหนด ในฐานะเสาหลักแหงเสถียรภาพของ [ROOT.GetNameDef]"
 SWI_guisans_coup: "รัฐประหารของกีซ็อง"
 SWI_guisans_coup_desc: "[?SWI.SWI_confederation_president.GetName] ไดนําประเทศที่ยิ่งใหญและสงบสุขของเราเขาสูสงครามและความทุกขยาก นี่ไมใช [ROOT.GetNonIdeologyName] ที่เรารูจักและรัก มันถูกทําใหเสื่อมทรามในนามของการรักษาตัวรอด มีเพียงชายคนเดียวที่เปนที่นิยมและมีความสามารถพอที่จะยุติสงครามนี้ใหสิ้นซาก และหวังวาจะนําชาติที่เคยเปนกลางนี้กลับสูรากเหงา นั่นคืออองรี กีซ็อง"
 SWI_return_to_the_old_switzerland: "กลับสูสวิตเซอรแลนดเดิม"
 SWI_return_to_the_old_switzerland_desc: "บัดนี้เมื่อสงครามใกลสิ้นสุด ในที่สุดเราก็ดําเนินการนํา [ROOT.GetNonIdeologyName] กลับไปเปนอยางที่เคยเปน คือชาติประชาธิปไตยที่เปนกลาง กอตั้งบนหลักการแหงความเคารพซึ่งกันและกันและการกําหนดชะตากรรมของตนเอง เมื่อสงครามจบลง ในที่สุดเราจะสามารถบังคับใชประชาธิปไตยและความเปนกลางรอบตัวเราได"
 SWI_a_swiss_navy: "กองทัพเรือสวิส"
 SWI_a_swiss_navy_desc: "เปนครั้งแรกในประวัติศาสตร[ROOT.GetAdjective]ที่เรามีชายฝงทะเล ซึ่งหมายความวาเราใชมันทําสงครามในทะเลได แตก็หมายความวาเรามีแนวรบใหมที่ตองปองกัน เราตองเรงความพยายามในการสรางกองทัพเรือให [ROOT.GetName]"
 SWI_buy_foreign_surplus_ships: "ซื้อเรือสวนเกินจากตางชาติ"
 SWI_buy_foreign_surplus_ships_desc: "สวนเกินของประเทศหนึ่งคือกองทัพเรือของอีกประเทศหนึ่ง มหาอํานาจทางทะเลหลายชาติในโลกมีกองเรือที่เต็มไปดวยเรือใหมเอี่ยม ซึ่งหมายความวาเรือเกาแทบจะลาสมัยแตยังตองเสียคาบํารุงรักษา หากเราตองการสรางแสนยานุภาพทางทะเลอยางรวดเร็ว ไมมีวิธีใดดีไปกวาการซื้อเรือที่พวกเขาไมตองการแลว"
 SWI_swiss_ship_designs: "การออกแบบเรือสวิส"
 SWI_swiss_ship_designs_desc: "เราอาจมีประสบการณไมมากในการออกแบบและสรางเรือรบเดินสมุทร แตยิ่งเริ่มเร็วเทาไร เราก็จะยืนหยัดไดทัดเทียมมหาอํานาจทางทะเลเกาแกอยาง [ENG.GetNameDef] และ [ITA.GetName] ไดเร็วเทานั้น"
 SWI_submarine_raiders: "เรือดํานํ้าจูโจม"
 SWI_submarine_raiders_desc: "ปลอยใหมหาอํานาจทางทะเลเกาแกมีกองเหล็กมหึมาของพวกเขาไป ขณะที่พวกเขาสูดวยกําลังดิบบนผิวนํ้า เราจะสูดวยเลหเหลี่ยมใตผิวนํ้าดวยเรือดํานํ้า คอย ๆ กัดกรอนแสนยานุภาพทางทะเลอันเกาครํ่าคราของพวกเขา"
 SWI_floating_fortresses: "ปอมปราการลอยนํ้า"
 SWI_floating_fortresses_desc: "เรารูวิธีสรางปอมปราการปกปองขุนเขาและหุบเขาของเรา บัดนี้เมื่อเรามีชายฝงแลว สิ่งสําคัญที่สุดคือการขยายความรูนี้ลงสูทะเล เรือของเราจะไมมีวันถูกทําลาย"
 SWI_naval_industry: "อุตสาหกรรมการตอเรือ"
 SWI_naval_industry_desc: "แมชายฝงใหมที่เราไดมาจะมีอุตสาหกรรมการตอเรือหลงเหลืออยูบาง เราตองเรงขยายอยางครอบคลุมและสรางใหเปนระบบที่สอดประสานสําหรับการผลิตและบํารุงรักษาที่คูควรกับกองทัพเรือสวิสที่ทรงพลังอยางแทจริง"
 SWI_naval_industry_tt: "เพิ่มชองสิ่งกอสราง §G1§! ชอง และ§Yอูตอเรือ 1 แหง§!ในทุกรัฐชายฝง (สูงสุด 10)"
 SWI_build_naval_bases: "สรางฐานทัพเรือ"
 SWI_build_naval_bases_desc: "ฐานทัพที่เรายึดมาไดยังไมเพียงพอ และเราไมสามารถสรางฐานใหมไดเร็วพอที่จะตามทันความตองการ ตองมีความพยายามครั้งใหมเพื่อบรรลุเปาหมายทางทะเลของเรา"
 SWI_build_naval_bases_tt: "เพิ่ม§Yฐานทัพเรือ 2 ระดับ§!ในทุก§Yฐานทัพเรือ§!ที่มีอยู (สูงสุด 15)"
 SWI_train_navy_staff: "ฝกบุคลากรกองทัพเรือ"
 SWI_protect_liechtenstein: "คุมครองลิกเตนสไตน"
 SWI_protect_liechtenstein_desc: "ราชรัฐลิกเตนสไตนอันจิ๋วที่ถูกขนาบดวยแคนทอนของเราสามแหงตองไดรับการคุมครองเพื่อปกปองประชาชนของพวกเขา อยางไรเสีย พวกเขาไมมีทางสูกองทัพตางชาติใดได รวมถึงกองทัพของเราดวย เราสามารถยื่นความชวยเหลือดวยการเขายึดครองดินแดนของพวกเขา แลวพวกเขาก็จะเขารวมคําสาบานของเราและกลายเปนแคนทอนใหมลาสุดของเรา"
 SWI_train_navy_staff_desc: "โครงสรางพื้นฐานทางทะเลไมไดสรางจากเหล็กกลาและคอนกรีตเทานั้น แตยังตองการชายหญิงที่มีความกลาและผานการฝกมาเพื่อนําชัยชนะในทองทะเลและมหาสมุทร"



 SWI_reduce_militia_activation_time_TT: "เวลาในการระดมพล§Yกองกําลังอาสาพลเมือง§!อยางเต็มที่จะลดลง §G$RIGHT|0$§! วัน"
