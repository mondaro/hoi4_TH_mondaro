 ETH_promote_the_war_heroes_desc: "อิสรภาพที่เรายังคงมีอยูเปนหนี้วีรบุรุษผูเสี่ยงชีวิตในสนามรบ เพื่อรักษาขวัญกําลังใจและการสนับสนุนตอกองทัพใหอยูในระดับสูง เราจะเลื่อนวีรบุรุษสงครามของเราขึ้นสูตําแหนงที่มีเกียรติยิ่งขึ้น"
 ETH_expand_the_officer_corps: "ขยายคณะนายทหาร"
