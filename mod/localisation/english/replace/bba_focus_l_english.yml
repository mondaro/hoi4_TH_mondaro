 ETH_together_for_victory: "รวมกันสูชัยชนะ"

 ETH_together_for_victory_desc: "เวลาที่เราจะกอบกูเกียรติยศและทําลายโซตรวนแหงการกดขี่ของอิตาลีใกลเขามาทุกที เพื่อใหแผนของเราไมลมเหลว เราตองเสริมกําลังและไดรับการสนับสนุนจากทั่วแอฟริกาตะวันออก มีเพียงการรวมมือกันเทานั้นที่จะรับประกันชัยชนะได"
 ETH_together_for_victory_tt: "นักรบกบฏจะลุกฮือขึ้นหลังแนวขาศึกเมื่อสงครามประกาศเอกราชเริ่มขึ้น"
 ETH_our_enemys_enemy: "ศัตรูของศัตรู"
 ETH_our_enemys_enemy_desc: "มีหลายชาติที่ตอตานการขยายดินแดนของ[ITA.GetAdjective]ดวยเหตุผลทางอุดมการณหรือยุทธศาสตร เราควรติดตอชาติเหลานั้นเพื่อขอการสงอาวุธ เพื่อที่เราจะไดโคนลมกองกําลัง[ITA.GetAdjective]ในภูมิภาคของเรา"
 ETH_our_enemys_enemy_tt: "หากชาติใดตกลงสงอาวุธ [ETH.GetFlag][ETH.GetName] จะไดรับ§Gยุทโธปกรณทหารราบ 1000 หนวย§!จากชาตินั้น"
 ETH_raid_italian_depots: "จูโจมคลังแสงอิตาลี"

 ETH_raid_italian_depots_desc: "กองทัพอิตาลีไดรวมยุทโธปกรณจํานวนมากไวในคลังแสงทั่วประเทศของเรา ขณะที่เราเตรียมรับการเผชิญหนาที่หลีกเลี่ยงไมได เราสามารถตัดยุทโธปกรณเหลานี้จากพวกเขาและนํามาเสริมกําลังของเราเองไดดวยการจูโจมคลังแสง"
 ETH_raid_italian_depots_tt: "การจูโจมจะเกิดขึ้นเปนระยะตลอด§Yหนึ่งป§!ขางหนา โดยเพิ่มยุทโธปกรณของ [ITA.GetFlag]§Y[ITA.GetAdjective]§! เขาคลังของ [ETH.GetFlag]§Y[ETH.GetName]§! ทุกครั้ง"
 ETH_the_italian_language: "ภาษาอิตาลี"
 ETH_the_italian_language_desc: "ภาษายังคงเปนหนึ่งในอุปสรรคใหญที่สุดตอความรวมมือที่ลึกซึ้งยิ่งขึ้นกับชาว[ITA.GetAdjective] เราจึงจะใชภาษา[ITA.GetAdjective]เปนภาษาที่สองทั่วทั้งฝายบริหาร รวมถึงกองทัพ หวังวาสิ่งนี้จะเรงการแลกเปลี่ยนทางวัฒนธรรมระหวางเรา และทําใหการวางแผนยุทธศาสตรมีประสิทธิภาพยิ่งขึ้น"
 ETH_compensation: "คาชดเชย"

 ETH_compensation_desc: "แมชวงแรกจะมีความตึงเครียดระหวางชาติอันยิ่งใหญทั้งสอง แตเราก็พิสูจนความภักดีตอ[ITA.GetName]ครั้งแลวครั้งเลา ทวาสิ่งนี้แทบไมไดทําใหประชาชนชื่นชอบรัฐบาลของเราเลย บางทีชาว[ITA.GetAdjective]อาจยินดีชดเชยใหเราดวยการมอบการควบคุมดินแดนอื่นบางสวนของพวกเขา เพื่อที่เราจะไดเสริมแรงสนับสนุนตอระบอบของเรา"
 ETH_negusa_nagast: "เนกุสสา นากาสต"

 ETH_negusa_nagast_desc: "ถึงเวลาแลวที่จะขจัดอิทธิพลของ[ITA.GetAdjective]ออกจาก[ETH.GetName]ดวยการประกาศเอกราช อีกไมนานเราจะเปนนายแหงชะตากรรมของตนเองอีกครั้ง ดวยการนําของ[ETH.GetLeader]"
 ETH_negusa_nagast_tt: "§Y[ROOT.GetNameWithFlag]§! ประกาศเอกราช"
 ETH_the_italo-ethiopian_empire: "จักรวรรดิอิตาลี-[ETH.GetAdjective]"
 ETH_the_italo-ethiopian_empire_desc: "ขณะที่เราผงาดขึ้นจากซากของจักรวรรดิเกา จักรวรรดิอิตาลี-[ETH.GetAdjective]แหงใหมก็เริ่มกอตัวขึ้น แมเมื่อไมนานมานี้เราจะยังสูรบกันอยู แตก็เห็นไดชัดขึ้นเรื่อย ๆ วาทั้ง[ITA.GetName]และ[ETH.GetName]แข็งแกรงกวาเมื่ออยูดวยกัน บัดนี้เปนหนาที่ของเราที่จะขยายอาณาเขตของจักรวรรดิรวมของเรา"
 ETH_the_italo-ethiopian_empire_tt: "ปลดล็อกการตัดสินใจ§Yจักรวรรดิอิตาลี-[ETH.GetAdjective]§!เพื่อรับดินแดนหลักในดินแดนที่อางสิทธิ์เมื่อยึดไดแลว\nดินแดนจะถูกโอนหากไมมีกองพลขาศึกในรัฐที่อางสิทธิ์หรือรัฐใกลเคียงใด ๆ"
 ETH_reclaim_the_empire: "ทวงคืนจักรวรรดิ"
 ETH_reclaim_the_empire_desc: "ภายใตการปกครองของผูนําผูยิ่งใหญ [ETH.GetLeader] เราไดปฏิเสธอิทธิพลอันกัดกรอนของ[ITA.GetName]ที่มีตอชาติอันยิ่งใหญของเรา และคนพบพลังอันไรเทียมทานของประชาชนอีกครั้ง บัดนี้ ภารกิจอันยิ่งใหญตรงหนาคือการทวงคืนดินแดนอันชอบธรรมและการรวมประชาชน[ETH.GetAdjective]เปนหนึ่งเดียว"
 ETH_reclaim_the_empire_tt: "ปลดล็อกการตัดสินใจ§Yทวงคืนจักรวรรดิ§!เพื่อรับดินแดนหลักคืนในดินแดนที่ยกให [ITA.GetFlag][ITA.GetName] เมื่อกลับมาอยูใตการควบคุมของ [ETH.GetFlag][ETH.GetAdjective] อีกครั้ง"
 ETH_the_liberator_of_country_short: "[Get_ETH_the_liberator_of_country_short_name]"

 ETH_the_liberator_of_country_short_desc: "[ETH.GetLeader]ไดนําเราสูเอกราชอยางกลาหาญ ใหหลุดพนจากอิทธิพลอันเสื่อมทรามของ[ITA.GetName] เราไมรูวาอนาคตจะเปนอยางไร แตเรารูวามันจะรุงโรจน ตราบใดที่ผูปลดปลอย[ETH.GetName]ยังนําทางเราไป"
