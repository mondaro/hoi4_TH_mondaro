 ETH_bring_in_foreign_advisors: "นําที่ปรึกษาตางชาติเขามา"
 ETH_bring_in_foreign_advisors_desc: "แมเราจะมีความกาวหนาอยางตอเนื่องในการสรางกองทัพอากาศ [ETH.GetAdjective] แตเรายังขาดประสบการณตรงที่สําคัญยิ่งในการใชนักบินใหเกิดประโยชนสูงสุด ดังนั้นเราจะนํานายทหารจากตางประเทศเขามาใหคําแนะนําในการปรับปรุง"
