 ITA_italian_irredentism: "ลัทธิทวงคืนดินแดนของอิตาลี"
 ITA_italian_irredentism_desc: "ลัทธิทวงคืนดินแดนของอิตาลีกาวราวขึ้นเรื่อย ๆ หลังมหาสงคราม ดวยระบอบฟาสซิสตของเรา ถึงเวลาแลวที่อิตาลีจะไปถึงพรมแดนตามธรรมชาติและรวมดินแดนทั้งหมดที่เปนของประชาชนอิตาลีโดยชอบธรรม!"
 add_faction_goal_secure_north_africa_tt: "เพิ่มเปาหมาย §Y$secure_north_africa_goal_name$§! หาก[ROOT.GetName]อยูในฝาย"
