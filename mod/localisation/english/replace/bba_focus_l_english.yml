 ITA_monarchia_d_italia: "ราชอาณาจักรอิตาลี"
 ITA_monarchia_d_italia_desc: "วิตโตรีโอ เอมานูเอเลไมควรเปดประตูการเมืองอิตาลีใหฟาสซิสตตั้งแตแรก ถึงเวลาแกไขความผิดพลาดนี้และทําใหพวกฟาสซิสตถอยไปเปนรองในรัฐบาล"
 ITA_new_corporations: "บรรษัทใหม"
 ITA_new_corporations_desc: "เราตองนําแนวคิดเรื่องบรรษัทที่ระบอบฟาสซิสตเคยใชมาปรับใหเขากับความตองการของรัฐบาลใหม"
 ITA_extraction_industry: "อุตสาหกรรมสกัดทรัพยากร"
 ITA_extraction_industry_desc: "เราตองขยายอุตสาหกรรมสกัดทรัพยากรใหทันความตองการของสายการผลิต เราไมอาจปลอยใหการขาดแคลนวัตถุดิบเปนภัยตอการผลิตทางทหาร"
 ITA_prepare_for_the_coming_wars: "เตรียมรับสงครามที่กําลังมา"
 ITA_prepare_for_the_coming_wars_desc: "สงครามกําลังกอตัวอยูรอบตัวเรา และเราตองมีอุตสาหกรรมทหารที่แข็งแกรงเพื่อตอบสนองความตองการของกองทัพ"
 ITA_mobilize_the_railway_guns: "ระดมปนใหญรถไฟ"
 ITA_mobilize_the_railway_guns_desc: "สถานการณสิ้นหวังตองใชมาตรการสิ้นหวัง ถึงเวลานําปนใหญรถไฟเกาของเรากลับมาใชงานอีกครั้ง"
 ITA_bring_back_old_glories: "ปลุกความรุงโรจนเกา"
 ITA_bring_back_old_glories_desc: "เรามีเรือเกาจํานวนมากจอดอยูตามทาเรือตาง ๆ รอการแยกชิ้นสวน วิศวกรและนายทหารเรือบางคนของเราอางวาดวยการปรับแตงเล็กนอย เราจะนําความรุงโรจนเกาเหลานี้กลับมาปฏิบัติการไดอีก"
 ITA_new_forms_of_weaponry: "อาวุธรูปแบบใหม"
 ITA_new_forms_of_weaponry_desc: "หากอิตาลีจะเปนหนึ่งในมหาอํานาจทางทหารที่ยิ่งใหญที่สุดของโลก เราตองศึกษาอาวุธรูปแบบใหม นักวิทยาศาสตรของเรามั่นใจวาการพัฒนาโครงการวิจัยพลังงานปรมาณูอันเปนการบุกเบิกอาจใหผลอันนาหวังอยางยิ่ง"
 ITA_revoke_the_acerbo_law: "ยกเลิกกฎหมายอาแชรโบ"
 ITA_revoke_the_acerbo_law_desc: "กฎหมายอาแชรโบมอบอํานาจควบคุมอิตาลีอยางมั่นคงที่มุสโสลินีและพรรคฟาสซิสตของเขาปรารถนายิ่ง ถึงเวลายกเลิกกฎหมายนี้เพื่อปองกันไมใหเกิดเหตุการณเชนนี้ขึ้นอีก"
 ITA_christian_democracy: "คริสเตียนประชาธิปไตย"
 ITA_christian_democracy_desc: "พรรคคริสเตียนประชาธิปไตยเปนองคกรการเมืองสายกลางอนุรักษนิยม นําโดยอัลชีเด เด กัสเปรี ซึ่งไดรับการสนับสนุนจากประชาชนดวยการผสานอุดมคติคริสเตียนเขากับแนวคิดเสรีภาพ เราควรอนุญาตใหพวกเขาจัดตั้งรัฐบาล ตราบใดที่ยังภักดีตอสถาบันกษัตริย"
 ITA_democratic_king: "กษัตริยประชาธิปไตย"
 ITA_democratic_king_desc: "ถึงเวลาแลวที่สถาบันกษัตริยอิตาลีจะกาวไปขางหนาสูรัฐที่เปนประชาธิปไตยมากขึ้น ขณะที่ยังคงองคกษัตริยไวในฐานะผูนําหลัก"
 ITA_cooperate_with_moderates: "รวมมือกับสายกลาง"
 ITA_cooperate_with_moderates_desc: "ไมมีเหตุผลที่จะไมรวมมือกับกลุมที่หัวรุนแรงนอยกวาของระบอบฟาสซิสตเดิม มีบุคคลที่มีความสามารถมากมายซึ่งชวยผลักดันรัฐอิตาลีที่ฟนคืนใหมนี้ใหกาวหนาได"
 ITA_expand_intelligence_services: "ขยายหนวยขาวกรอง"
 ITA_expand_intelligence_services_desc: "ในยุคใหมนี้ ความรูคืออํานาจ เราตองขยายหนวยขาวกรองสาขาตาง ๆ เพื่อใหแขงขันกับหนวยสืบราชการลับตางชาติได"
 ITA_crush_opposition: "บดขยี้ฝายคาน"
 ITA_crush_opposition_desc: "ยังมีผูสนับสนุนระบอบฟาสซิสตเกาอีกมากที่ตอตานนโยบายของเราและขัดขวางการทํางานของรัฐบาลใหม ถึงเวลาจัดการกับพวกเขาแลว"
 ITA_power_to_the_king: "อํานาจสูองคกษัตริย"
 ITA_power_to_the_king_desc: "ในยามที่ความตึงเครียดทางสังคมและการเมืองรุนแรงเชนนี้ หนทางเดียวที่จะมั่นใจไดวาไมมีระบอบสุดโตงใด ไมวาฟาสซิสตหรือคอมมิวนิสต จะครองอิตาลี คือการรวมศูนยอํานาจไวในพระหัตถขององคกษัตริย ผูซึ่งเหมาะสมที่สุดที่จะนําพาประเทศของเราอยางแนนอน"
 ITA_disband_the_blackshirts: "ยุบหนวยเสื้อดํา"
 ITA_disband_the_blackshirts_desc: "หนวยเสื้อดําเปนองคกรที่อันตรายอยางยิ่งซึ่งรับใชฟาสซิสต จึงถึงเวลาที่พวกเขาตองหายไปเชนเดียวกับระบอบฟาสซิสตของพวกเขา เราจะยุบหนวยที่ยังประจําการทั้งหมดทันที"
 ITA_utilize_the_blackshirts: "ใชประโยชนจากหนวยเสื้อดํา"
 ITA_utilize_the_blackshirts_desc: "แมในทางประวัติศาสตรหนวยเสื้อดําจะภักดีตอระบอบฟาสซิสตและดูเช แตหากเราแสดงใหเห็นวาองคกรของพวกเขายังมีที่ทางใหเติบโตในระบอบใหม เราอาจใชพวกเขาเพื่อผลประโยชนของเราได ทายที่สุดแลว ทั้งสองระบอบแตกตางกันมากขนาดนั้นจริงหรือ?"
 ITA_expand_the_royal_guard: "ขยายราชองครักษ"
 ITA_expand_the_royal_guard_desc: "เราจะเสริมกําลังและขยายกองราชองครักษ เพื่อใหมีกองกําลังที่ไวใจได ภักดีตอสถาบันกษัตริยอิตาลี และสามารถปฏิบัติบทบาทตาง ๆ ในปฏิบัติการทางทหารทุกรูปแบบหากจําเปน"
 ITA_gloria_al_regno_d_italia: "เกียรติยศแดราชอาณาจักรอิตาลี"
 ITA_gloria_al_regno_d_italia_desc: "ผูที่อางวาระบอบกษัตริยเปนระบบการปกครองที่ลาสมัยคือคนโงที่มองไมเห็นวา ภายใตพระหัตถอันสูงสงและมั่นคง ชาติที่ตํ่าตอยก็สามารถกลายเปนหนึ่งในมหาอํานาจที่ยิ่งใหญที่สุดของโลกได \nกษัตริยจงทรงพระเจริญ!"
 ITA_paramilitary_training: "การฝกกึ่งทหาร"
 ITA_paramilitary_training_desc: "ถึงเวลาขยายองคกรกองกําลังอาสาสมัครและยกระดับการศึกษาทางทหารของพวกเขา เราจะใชนายทหารผูโดดเดนจากกองพลชั้นยอดของเรามาฝกทหารใหมและนําหนวยเสื้อดํา"
 ITA_seek_papal_support: "แสวงหาการสนับสนุนจากพระสันตะปาปา"
 ITA_seek_papal_support_desc: "เพื่อรับมือกับความไมมั่นคงทางสังคมและการเมืองที่กําลังเพิ่มขึ้นในประเทศ เราจําเปนตองพึ่งพาศาสนจักร ซึ่งมีอิทธิพลตอประชาชนอิตาลีอยางมากมาโดยตลอดในประวัติศาสตร เราตองเขาหาพระสันตะปาปาเพื่อขอความเห็นชอบและการสนับสนุน"
 ITA_agents_of_the_church: "สายลับของศาสนจักร"
 ITA_agents_of_the_church_desc: "ศาสนจักรมีผูแทนนับไมถวนทั่วโลก หากเราดึงวาติกันมาอยูฝายเราได เราจะมีสายลับใหมไวใชงาน พรอมฉากบังหนาที่สมบูรณแบบในฐานะทูตของศาสนจักร ซึ่งจะชวยพัฒนาเครือขายขาวกรองของเรา"
 ITA_strengthen_the_papacy: "เสริมอํานาจพระสันตะปาปา"
 ITA_strengthen_the_papacy_desc: "เห็นไดชัดวาอิทธิพลของพระสันตะปาปาในสังคมอิตาลีนั้นแข็งแกรงจริง ๆ หนทางเดียวที่จะรักษาเสถียรภาพของชาติคือการเสริมอํานาจใหศาสนจักรภายในราชอาณาจักรอิตาลี"
 ITA_setting_course: "กําหนดเสนทาง"
 ITA_setting_course_desc: "ราชอาณาจักรอิตาลีพรอมแลวที่จะบรรลุชะตากรรมของตน ความยิ่งใหญและความรุงโรจนรอประชาชนอิตาลีผูภาคภูมิอยู ถึงเวลาตัดสินใจวาจะกาวตอไปอยางไร"
 ITA_mare_nostrum_bba: "ทะเลของเรา"
 ITA_mare_nostrum_bba_desc: "โรมโบราณเอาชนะคารเธจไดเปนครั้งแรกดวยแสนยานุภาพทางทะเล ดวยการลงทุนในแสนยานุภาพทางทะเล อิตาลีจะมุงสูการควบคุมทะเลเมดิเตอรเรเนียน และทําใหมันกลับมาเปน 'มาเร นอสตรุม' ทะเลของเรา อีกครั้ง"
 ITA_auxiliaries: "ทหารสมทบ"
 ITA_auxiliaries_desc: "เชนเดียวกับในสมัยบรรพบุรุษชาวโรมันของเรา ทหารสมทบยังคงมีบทบาทสําคัญในปจจุบันในการสนับสนุนหนวยทหารประจําการ ลาดตระเวนภูมิประเทศ และกอกวนขาศึก เราตองขยายกองกําลังอาสากึ่งทหารเหลานี้เพื่อเสริมความแข็งแกรงใหกองทัพ"
 ITA_the_italian_legions: "กองทหารลีเจียนอิตาลี"
 ITA_the_italian_legions_desc: "กองทัพของเราอาจไมไดแสดงศักยภาพสมกับสถานการณในอดีตที่ผานมาไมนาน แตบัดนี้เมื่อประชาชนอิตาลีภาคภูมิใจในมรดกโรมันมากกวาที่เคย เราตองกําหนดหลักนิยมใหมใหกองทัพ เพื่อใหกองทหารลีเจียนของเรานาเกรงขามในวันนี้เหมือนเมื่อหลายพันปกอน"
 ITA_new_roman_citizens: "พลเมืองโรมันใหม"
 ITA_new_roman_citizens_desc: "การมอบสถานะพลเมืองแกชาวพื้นเมืองในอาณานิคมของเราจะชวยใหเราไดรับการยอมรับและความรวมมือจากคนในทองถิ่นอยางแนนอน"
 ITA_all_roads_lead_to_rome: "ทุกเสนทางมุงสูโรม"
 ITA_all_roads_lead_to_rome_desc: "ในอดีต กองทหารโรมันเลื่องชื่อในดานความรวดเร็วและประสิทธิภาพในการสรางถนนและโครงสรางพื้นฐานที่กองทัพจําเปนตองใช หลายพันปตอมา การสงกําลังบํารุงและเสนทางเสบียงยิ่งทวีความสําคัญเมื่อตองทําสงคราม"
 ITA_the_king_of_the_skies: "ราชันแหงเวหา"
 ITA_the_king_of_the_skies_desc: "ตางจากบรรพบุรุษชาวโรมันของเรา กองทัพของเราตองครองนานฟาเพื่อปฏิบัติการไดอยางเต็มประสิทธิภาพทั้งบนบกและในทะเล เครื่องบินอิตาลีขึ้นชื่ออยูแลวในดานความอเนกประสงคและคุณภาพ แตถึงเวลาแลวที่วิศวกรอากาศยานของเราจะตองกาวขึ้นอีกขั้นและพัฒนาปอมปราการบินไดอยางแทจริง"
 ITA_modern_musculus: "มุสคูลุสยุคใหม"
 ITA_modern_musculus_desc: "เชนเดียวกับที่ชาวโรมันเคยทํา เราตองพัฒนาจักรกลสงครามทรงพลังที่ทําใหเราครองสนามรบได เราจะออกแบบรถถังสุดยอดที่จะบุกทะลวงแนวหนาและสรางความหวาดกลัวใหแกศัตรูของเรา"
 ITA_caligulas_pride: "ความภาคภูมิใจแหงคาลิกูลา"
 ITA_caligulas_pride_desc: "ถึงเวลาแลวที่จะพัฒนาเรือรบที่ยิ่งใหญที่สุดเทาที่เคยมีมา วิศวกรเรือชั้นยอดของเราไดขัดเกลาแบบและทดสอบตนแบบมาอยางตอเนื่อง และบัดนี้มั่นใจวาเนปทูนุสจะกลายเปนราชาไมเพียงแคแหงทะเลเมดิเตอรเรเนียน แตไกลยิ่งกวานั้น"
 ITA_iberian_protection: "คุมครองไอบีเรีย"
 ITA_iberian_protection_desc: "ชาติตาง ๆ ในคาบสมุทรไอบีเรียไดรับความมั่นคงในระดับหนึ่งมาในชวงที่ผานมา แตเห็นไดชัดวาในตอนนี้พวกเขาไมอาจปองกันตนเองจากมหาอํานาจศัตรูไดดวยกําลังของตนเองเพียงลําพัง เราตองยื่นความคุมครองใหพวกเขากอนที่จะสายเกินไป"
 ITA_south_american_alliances: "พันธมิตรอเมริกาใต"
 ITA_south_american_alliances_desc: "ถึงเวลาขยายขอบเขตของฝายเราแลว เราจะติดตอชาติตาง ๆ ในละตินอเมริกาและโนมนาวใหพวกเขาเห็นความสําคัญของการกอตั้งพันธมิตรที่แข็งแกรงเพื่อรับมือภัยคุกคามมากมายที่รายลอมพวกเราทุกคน"
 ITA_the_papacy_reborn: "การคืนชีพของสันตะปาปา"
 ITA_the_papacy_reborn_desc: "เมื่อสมเด็จพระสันตะปาปาทรงโคนลมกษัตริยและยึดอํานาจควบคุมอิตาลีไดทั้งหมดแลว ถึงเวลาที่ชาวอิตาลีจะตองดําเนินตามวิสัยทัศนและเปาหมายของศาสนจักร"
 ITA_deus_vult: "Deus Vult"
 ITA_deus_vult_desc: "ศาสนจักรคาทอลิกเปนประภาคารแหงความหวังและเสถียรภาพในยุโรปมานานหลายศตวรรษ และเมื่อเรากําลังเผชิญกับชวงเวลามืดมนที่รออยูเบื้องหนา เราตองกลับมาเปนประภาคารแหงแสงสวางนี้อีกครั้ง \nพระเจาทรงประสงคเชนนั้น!"
 ITA_catholic_action: "คาทอลิกแอคชัน"
 ITA_catholic_action_desc: "องคกรเยาวชนคาทอลิกของเราพิสูจนแลววาเปนเครื่องมือที่มีประสิทธิภาพยิ่งในการกวาดลางพวกคอมมิวนิสต สงเสริมหลักความยุติธรรมทางสังคมแบบคาทอลิก และเติมเต็มกองทัพของเราดวยทหารเกณฑใหมที่กระตือรือรน"
 ITA_a_time_for_war: "ถึงเวลาแหงสงคราม"
 ITA_a_time_for_war_desc: "ตราบใดที่ความนอกรีตยังคงอยูในยุโรป สันติภาพยอมไมอาจเกิดขึ้น ถึงเวลาแลวสําหรับสงครามศักดิ์สิทธิ์ครั้งใหม จักรกลสงครามรุนใหมจะคํารามในพระนามของพระองค พรอมฟาดฟนพวกนอกรีตดวยความเกรี้ยวกราดอันชอบธรรม จงอยามีสันติภาพจนกวาการพิพากษาจะมาถึงผูไมศรัทธาทุกคนจากลํากลองปนใหญ 105 มม."
 ITA_the_holy_lands: "ดินแดนศักดิ์สิทธิ์"
 ITA_the_holy_lands_desc: "ดินแดนที่สําคัญตอศาสนาคริสตอยางปาเลสไตนยอมเปนของอาณาจักรแหงพระเจาโดยชอบธรรม เราตองทําใหแนใจวาดินแดนศักดิ์สิทธิ์จะถูกสงคืนแกเราโดยไมชักชา"
 ITA_the_catholic_dominion: "อาณาจักรคาทอลิก"
 ITA_the_catholic_dominion_desc: "เมื่อสันตะปาปาผงาดขึ้นเปนมหาอํานาจที่ตองเกรงขามอีกครั้ง ถึงเวลาแลวที่เราจะยื่นมือไปยังชาวคริสตผูศรัทธาทั้งปวง และเปนดั่งมือที่นําทางประชาชน ดุจผูเลี้ยงแกะที่นําทางฝูงแกะและปกปองพวกมันจากความชั่วราย นี่คือพระบัญชาของพระเจา!"

 ITA_unite_the_opposition: "รวมพลังฝายคาน"
 ITA_unite_the_opposition_desc: "รากเหงาของลัทธิฟาสซิสตฝงลึกในอิตาลี และตองใชความพยายามอยางมากในการถอนรากถอนโคนมัน เราตองหาเปาหมายรวมระหวางกลุมตาง ๆ ที่ตอตานระบอบฟาสซิสต เพราะมีเพียงการรวมตัวกันเทานั้นที่เราจะโคนลมดูเชผูนารังเกียจได"
 ITA_liberate_gramsci: "ปลดปลอยกรัมชี"
 ITA_liberate_gramsci_desc: "สหายของเรา อันโตนีโอ กรัมชี นักปรัชญามารกซิสต ถูกรัฐบาลฟาสซิสตคุมขังมานานกวาสิบป และบัดนี้สุขภาพของเขากําลังทรุดลงอยางรวดเร็ว เราตองจัดปฏิบัติการลับเพื่อชวยเขาออกมาและรักษาชีวิตของเขาไว เพราะเขาจะกลายเปนบุคคลสําคัญในการปฏิวัติของชนชั้นแรงงานอยางแนนอน"
 ITA_organize_strikes_in_the_north: "ปลุกการนัดหยุดงานในภาคเหนือ"
 ITA_organize_strikes_in_the_north_desc: "กอนที่เราจะลงมือ เราจะทุมความพยายามทั้งหมดเพื่อใหไดรับการสนับสนุนจากแรงงานอุตสาหกรรมในอิตาลี และทําใหแนใจวาพื้นที่อุตสาหกรรมทางเหนือจะยืนหยัดเคียงขางเราตอตานระบอบฟาสซิสต"
 ITA_the_southern_farmlands: "ไรนาแหงภาคใต"
 ITA_the_southern_farmlands_desc: "แมระบอบฟาสซิสตจะทุมเทความพยายามอยางสูญเปลา อิตาลียังคงเปนประเทศเกษตรกรรมโดยแท เราตองพึ่งพาชาวนาเพื่อใหการปฏิวัติของเราสําเร็จ และแนนอนวาทางใตของอิตาลีคือที่ที่ชาวนามีพลังมากที่สุด"
 ITA_defy_the_duce: "ทาทายดูเช"
 ITA_defy_the_duce_desc: "ถึงเวลาแลวที่จะลุกขึ้นตอตานระบอบฟาสซิสตและกําจัดภัยรายที่มันมีตอชาวอิตาลี \nกรรมกรและชาวนาแหงอิตาลี จงจับอาวุธ!"
 ITA_appeal_to_the_bourgeoisie: "เรียกรองชนชั้นกลาง"
 ITA_appeal_to_the_bourgeoisie_desc: "เราตองติดตอกลุมชนชั้นกลางที่ตองการเห็นระบอบฟาสซิสตลมสลาย ดวยทรัพยากรที่พวกเขามีและความกลาหาญของนักปฏิวัติของเรา เราจะยุติสงครามนองเลือดนี้ไดอยางรวดเร็ว!"
 ITA_seize_old_equipment: "ยึดยุทโธปกรณเกา"
 ITA_seize_old_equipment_desc: "มียุทโธปกรณทางทหารเกาจํานวนมากเก็บไวในคลังอาวุธตาง ๆ ทั่วประเทศ แมจะเกาแก แตการยึดยุทโธปกรณเหลานี้มาแจกจายใหกองกําลังของเราจะชวยไดมากในการเอาชนะสงคราม"
 ITA_the_italian_republic: "สาธารณรัฐอิตาลี"
 ITA_the_italian_republic_desc: "ระบอบกษัตริยเปนระบบเกาครํ่าคราและเนาเฟะที่มีแตจะขัดขวางการปฏิวัติของเรา ถึงเวลากําจัดราชวงศและจัดการกับเหลาผูติดตามของพวกเขาแลว"
 ITA_the_popular_front: "แนวรวมประชาชน"
 ITA_the_popular_front_desc: "สงครามกลางเมืองไดแสดงใหเห็นวาพวกคอมมิวนิสตไมเพียงสามารถนําชาวอิตาลีไปสูชัยชนะเหนือลัทธิฟาสซิสต แตยังนําไปสูความกาวหนาทางสังคมและอุตสาหกรรมที่ประเทศของเราตองการอยางยิ่ง"
 ITA_the_garibaldi_legion: "กองพลอาสาการิบัลดี"
 ITA_the_garibaldi_legion_desc: "เราจะจัดตั้งหนวยอาสาสมัครเพื่อไปรบเคียงขางสหายของเราในสาธารณรัฐสเปน ในฐานะสวนหนึ่งของกองพลนอยนานาชาติในสงครามกลางเมืองสเปน"
 ITA_gruppi_di_difesa_della_donna: "กลุมปองกันสตรี"
 ITA_gruppi_di_difesa_della_donna_desc: "สตรีนักปฏิวัติจากกลุมการเมืองตาง ๆ เสนอใหกอตั้งกลุมปองกันสตรี เพื่อการมีสวนรวมอยางแข็งขันและการระดมกําลังจากทุกชนชั้นและทุกระดับของสังคมในยามสงคราม"
 ITA_a_new_era_for_the_red_shirts: "ยุคใหมของเสื้อแดง"
 ITA_a_new_era_for_the_red_shirts_desc: "เราจะเดินตามรอยจูเซปเป การิบัลดี และกองเสื้อแดงของเขา เสริมความแข็งแกรงใหกองกําลังอาสาเหลานี้และฝกฝนใหปฏิบัติหนาที่ไดอยางดีที่สุด ทั้งในฐานะสวนหนึ่งของกองทัพอิตาลีหรือในฐานะกองพลนอยอาสาสมัครในตางแดน"
 ITA_pugno_alzato: "กําปนชูฟา"
 ITA_pugno_alzato_desc: "ถึงเวลากําจัดภัยรายแหงลัทธิฟาสซิสตและภัยคุกคามที่มันมีตอมวลมนุษยชาติแลว เราจะชูกําปนขึ้นอยางเปนหนึ่งเดียวในการตอสูอันชี้ชะตานี้!"
 ITA_a_leader_steps_forward: "ผูนํากาวออกมา"
 ITA_a_leader_steps_forward_desc: "ถึงเวลาตัดสินใจวาใครจะเปนผูนําของสาธารณรัฐอิตาลีใหม โชคดีที่เรามีผูสมัครที่มีคุณสมบัติสูงใหเลือก"
 ITA_the_path_to_progress: "เสนทางสูความกาวหนา"
 ITA_the_path_to_progress_desc: "เราจะติดตอรัฐบาลคอมมิวนิสตและสังคมนิยมทั่วโลกที่อาจเต็มใจรวมมือกับเราและชวยใหเราฟนตัวจากสงครามกลางเมืองอันหายนะที่เราถูกบีบใหตองเผชิญ"
 ITA_industrial_socialization: "อุตสาหกรรมสังคมนิยม"
 ITA_industrial_socialization_desc: "ถึงเวลายึดโรงงานขนาดใหญมาจากมือของนักธุรกิจรายใหญและชนชั้นกลาง เพื่อใหใชประโยชนสูงสุดแกชาวอิตาลีทั้งมวล"
 ITA_institute_the_five_year_plan: "ประกาศใชแผนหาป"
 ITA_institute_the_five_year_plan_desc: "เชนเดียวกับที่สหายโซเวียตของเราไดทํา เราตองทําใหประเทศเกษตรกรรมของเรากลายเปนอุตสาหกรรมเพื่อแขงขันกับมหาอํานาจโลก เราจะวางแผนหาปที่ไมเพียงชวยใหเรากลับสูระดับอุตสาหกรรมกอนสงครามกลางเมือง แตยังกาวขามไปไกลยิ่งกวา"
 ITA_new_ricostruzione_industriale: "สถาบันฟนฟูอุตสาหกรรมใหม"
 ITA_new_ricostruzione_industriale_desc: "สถาบันฟนฟูอุตสาหกรรม (Instituto per la Ricostruzione Industriale) มีบทบาทสําคัญมาโดยตลอดในการกอบกู ปรับโครงสราง และใหเงินทุนแกธนาคารและบริษัทเอกชนที่ลมละลาย ดวยการปรับเปลี่ยนบางประการ เราจะทําใหแนใจวาสถาบันนี้จะยังดําเนินงานตอไปโดยปราศจากกลิ่นอายฟาสซิสตแบบในอดีต"
 ITA_political_commissars: "ผูตรวจการการเมือง"
 ITA_political_commissars_desc: "เพื่อรักษาความยึดมั่นตอลัทธิคอมมิวนิสตและปลุกความกระตือรือรนทางอุดมการณในหมูทหาร เราจะจัดตั้งตําแหนงผูตรวจการการเมืองในกองทัพ ซึ่งรับผิดชอบการศึกษาทางการเมืองและการจัดระเบียบหนวยที่ตนสังกัด"
 ITA_common_ground: "จุดรวม"
 ITA_common_ground_desc: "เราตองละทิ้งความแตกตางกับกลุมการเมืองอื่น ๆ ซึ่งแทจริงแลวมีเปาหมายเดียวกับเรา ถึงเวลารวมมือกันนํารัฐอิตาลีใหมไปสูความกาวหนา"
 ITA_appease_the_military: "เอาใจฝายทหาร"
 ITA_appease_the_military_desc: "นายทหารจํานวนมากในกองทัพไมพอใจรัฐบาลใหมหรือสถานะของตนหลังสงครามกลางเมือง จึงควรทําใหแนใจวาความไมพอใจในกองทัพจะถูกขจัดไป และนายทหารรูสึกวาบทบาทของพวกเขาในสงครามไดรับการยอมรับ"
 ITA_crush_the_mafia: "บดขยี้มาเฟย"
 ITA_crush_the_mafia_desc: "มาเฟยและแกงลักลอบขนของ แกงรีดไถ และอาชญากรอีกมากมายไดหวนกลับมาในชวงสงครามกลางเมือง เปนหนาที่ของเราตอชาวอิตาลีที่จะกวาดลางพวกมันและฟนฟูความปลอดภัยและเสถียรภาพใหแกประเทศ"
 ITA_empower_the_carabinieri: "เสริมอํานาจคาราบินิเอรี"
 ITA_empower_the_carabinieri_desc: "คาราบินิเอรีมีบทบาทสําคัญในการกวาดลางมาเฟยและรักษาสันติภาพและความปลอดภัยในประเทศ ถึงเวลาเสริมความแข็งแกรงใหกองกําลังตํารวจนี้และใหอํานาจปฏิบัติหนาที่เพิ่มเติม"
 ITA_army_modernization: "ปรับปรุงกองทัพใหทันสมัย"
 ITA_army_modernization_desc: "กองทัพของเราจะไดประโยชนจากยุทโธปกรณใหมและเทคนิคการฝกที่ชวยใหตามทันกองทัพและหลักนิยมของมหาอํานาจอื่น ๆ"
 ITA_union_in_the_party: "เอกภาพในพรรค"
 ITA_union_in_the_party_desc: "เอกภาพภายในพรรคคือปจจัยสําคัญที่สุดในการพัฒนาประเทศของเราไปสูลัทธิคอมมิวนิสต เราตองทําใหแนใจวาสมาชิกทุกคนมีวิสัยทัศนเดียวกัน มีเปาหมายเดียวกัน และปฏิบัติตามกระบวนการที่พรรควางไวเพื่อบรรลุเปาหมายนั้น"
 ITA_follow_the_soviet_union: "เดินตามสหภาพโซเวียต"
 ITA_follow_the_soviet_union_desc: "สหภาพโซเวียตไดปูเสนทางสูลัทธิคอมมิวนิสตไวอยางชัดเจนแลว เราตองเดินตามหากตองการใหความพยายามที่ทุมเทใหสาธารณรัฐใหมเกิดผลและบรรลุรัฐคอมมิวนิสตที่แทจริง"
 ITA_military_cooperation: "ความรวมมือทางทหาร"
 ITA_military_cooperation_desc: "เราตองทําขอตกลงความรวมมือทางทหารกับพันธมิตรหากตองการอยูรอดในโลกนี้ เพราะมหาอํานาจที่รายลอมเราอยูนั้นเปนศัตรูของชนชั้นกรรมาชีพอยางไมตองสงสัย"
 ITA_defense_against_capitalism: "ปองกันทุนนิยม"
 ITA_defense_against_capitalism_desc: "ลัทธิฟาสซิสตคือศัตรูทางอุดมการณอันดับแรกและยิ่งใหญที่สุดของเรา แตก็ไมใชเพียงศัตรูเดียว พวกนายทุนเปนภัยคุกคามรายแรงตอประเทศของเราและตอการปฏิวัติของชนชั้นกรรมาชีพ เราตองเตรียมพรอมรับมือพวกเขา"
 ITA_combined_research_effort: "รวมกันวิจัย"
 ITA_combined_research_effort_desc: "ความกาวหนาทางเทคโนโลยีเปนสิ่งจําเปนหากเราตองการใหกองทัพมียุทโธปกรณทันสมัยไวเผชิญหนากับศัตรู เราตองรวมมือกับพันธมิตรเพื่อใหมั่นใจวาเราจะกาวหนาทางวิทยาศาสตรอยางตอเนื่อง โดยเฉพาะในดานการทหาร"
 ITA_special_brigades: "กองพลนอยพิเศษ"
 ITA_special_brigades_desc: "เราจะจัดตั้งกองพลนอยจูโจมพิเศษที่สามารถสนับสนุนหนวยทหารของเราในการรบระหวางการรุกครั้งใหญ กองพลนอยเหลานี้จะประกอบดวยทหารอาสาที่โดดเดนในหนวยของตน"
 ITA_defend_the_land: "ปกปองผืนแผนดิน"
 ITA_defend_the_land_desc: "สหภาพโซเวียตและนโยบายของมันไดทรยศตอชนชั้นกรรมาชีพและอุดมการณมารกซิสต ชาวอิตาลีจะเดินบนเสนทางของตนเองสูลัทธิคอมมิวนิสต เสนทางที่เต็มไปดวยอุปสรรคและภัยคุกคามที่เราตองฝาฟน แตก็หวังวาจะมีสหายและพันธมิตรคอยชวยเหลือกันและกัน"
 ITA_united_anarchist_confederations: "สมาพันธอนาธิปไตยแหงสหภาพ"
 ITA_united_anarchist_confederations_desc: "เราตองแสวงหาความรวมมือจากนักอนาธิปไตยชาวสเปนและนักอนาธิปไตยทั่วโลกในการตอสูกับลัทธิฟาสซิสตและทุนนิยม เราจะจัดตั้งคณะกรรมาธิการความรวมมือใหญเพื่อรวบรวมนักเคลื่อนไหว ปญญาชน และนักสูเพื่ออิสรภาพจากทั่วโลก"
 ITA_the_fight_against_stalinism: "[GetAppropriateRussianGovernmentIdeology]"
 ITA_russian_government_ideology_default: "ตอสูกับผูที่ตอตานเรา"
 ITA_russian_government_ideology_alt: "ตอสูกับลัทธิสตาลิน"
 ITA_russian_government_ideology_alt2: "ตอสูกับผูที่แบงแยกเรา"
 ITA_the_fight_against_stalinism_desc: "[GetAppropriateRussianGovernmentIdeologyDesc]"
 ITA_russian_government_ideology_desc_default: "กอนที่เราจะจัดการกับภัยคุกคามจากลัทธิสตาลินได มันก็ถูกแทนที่ดวยสิ่งที่เลวรายยิ่งกวาเสียแลว เมื่อพิจารณาสิ่งที่ผูนําชุดปจจุบันเคยพิสูจนแลววาทําไดในอดีต เราจะรอใหพวกเขาโจมตีอยูเฉย ๆ ไมได เราตองเปนฝายลงมือกอน!"
 ITA_russian_government_ideology_desc_alt: "นาเสียดายที่ทุนนิยมและฟาสซิสตไมใชศัตรูเพียงกลุมเดียวที่เราตองเผชิญ สาวกของลัทธิสตาลินมองรัฐบาลและประเทศของเราวาเปนภัยตอผลประโยชนของพวกเขา และพรอมจะทําลายเราดวยทุกวิถีทาง เราจะรอใหพวกเขาโจมตีอยูเฉย ๆ ไมได เราตองเปนฝายลงมือกอน!"
 ITA_russian_government_ideology_desc_alt2: "นาเสียดายที่มีทั้งประเทศที่กําลังทุมเทพยายามแบงแยกเรา แมเราจะไมไดชื่นชอบสตาลินและรัฐบาลของเขานัก แตสถานการณปจจุบันก็ไมไดดีกวากันมาก ประเทศเหลานี้เปนภัยคุกคาม เราจะรอใหพวกเขาโจมตีอยูเฉย ๆ ไมได เราตองเปนฝายลงมือกอน!"
 ITA_raise_the_peoples: "ปลุกมวลชน"
 ITA_raise_the_peoples_desc: "มีชาวนาอิตาลีผูกลาหาญจํานวนมากที่พรอมตอสูเพื่ออุดมการณของเรา ดวยพวกเขา เราสามารถจัดตั้งหนวยเสื้อแดงเพิ่มเติมเพื่อเสริมกําลังใหกองทัพของเรา"
 ITA_il_sol_dell_avvenire: "ดวงตะวันแหงอนาคต"
 ITA_il_sol_dell_avvenire_desc: "ถึงเวลาประกาศรัฐอิตาลีใหม สหภาพแหงชาติอิตาลี ซึ่งพลเมืองทุกคนมีเสรีภาพและเทาเทียมกันตอหนารัฐ \nดวงตะวันแหงอนาคตจะขึ้นเหนืออิตาลี!"
 ITA_italian_socialism: "สังคมนิยมอิตาลี"
 ITA_italian_socialism_desc: "เสนทางสูสังคมนิยมเปดออกตอหนาเราแลว ถึงเวลากาวเดินดวยความมุงมั่นที่จะสรางสังคมที่เปนธรรมภายในพรมแดนของเรา และสถานะระหวางประเทศที่สาธารณรัฐอิตาลีสมควรไดรับภายนอกพรมแดน"
 ITA_cooperate_with_the_mafia: "รวมมือกับมาเฟย"
 ITA_cooperate_with_the_mafia_desc: "องคกรมาเฟยที่แพรขยายในชวงสงครามกลางเมืองอาจเปนโอกาสในการเพิ่มประสิทธิภาพของธุรกิจเอกชนและรัฐวิสาหกิจในเขตอิทธิพลของพวกเขา หากเรายินยอมมอบสิทธิพิเศษและสัมปทานบางประการให"
 ITA_mafia_abroad: "มาเฟยในตางแดน"
 ITA_mafia_abroad_desc: "อิทธิพลของตระกูลมาเฟยที่เรามีขอตกลงดวยกําลังเติบโตไมเพียงในอิตาลี แตยังรวมถึงตางประเทศ เราตองสงสายงานที่เกี่ยวของกับพวกเขาไปยังมหาอํานาจทุนนิยม ซึ่งธุรกิจของพวกเขาจะเจริญรุงเรืองเพื่อรับใชผลประโยชนของเรา"
 ITA_empower_the_unions: "เสริมอํานาจสหภาพแรงงาน"
 ITA_empower_the_unions_desc: "ชนชั้นกรรมาชีพของอิตาลีมีศักยภาพมหาศาล เราตองทําใหแนใจวาสหภาพแรงงานมีทั้งเครื่องมือและอํานาจในการควบคุมและบริหารแรงงานของประเทศใหมีประสิทธิภาพสูงสุด"
 ITA_production_lines: "สายการผลิต"
 ITA_production_lines_desc: "ถึงเวลาขยายและปรับปรุงสายการผลิตหลักของเราใหทันสมัย เพื่อใหมั่นใจวากองทัพจะไดรับเสบียงและยุทโธปกรณที่จําเปนในการปฏิบัติการไดอยางเต็มประสิทธิภาพตอไป"
 ITA_the_republics_leadership: "ผูนําแหงสาธารณรัฐ"
 ITA_the_republics_leadership_desc: "เราตองเลือกพรรคและผูนําทางการเมืองที่เหมาะสมเพื่อนําสาธารณรัฐอิตาลีอันเยาววัยไปสูสังคมสังคมนิยมที่ประชาชนของเราสมควรไดรับ ทั้งแฟรรุชโช ปารรี และอีวาโนเอ โบโนมี ลวนเปนผูสมัครที่คูควรและมีคุณสมบัติสูงในการทําหนาที่นี้"
 ITA_bring_back_exiled_intellectuals: "นําปญญาชนพลัดถิ่นกลับบาน"
 ITA_bring_back_exiled_intellectuals_desc: "ระบอบฟาสซิสตบีบใหพลเมืองอิตาลีจํานวนนับไมถวนตองลี้ภัย รวมถึงนักปรัชญา ปญญาชน และนักวิทยาศาสตรผูยิ่งใหญ ถึงเวลามอบโอกาสใหผูลี้ภัยเหลานี้ทั้งหมดไดกลับบานแลว"
 ITA_social_stability: "เสถียรภาพทางสังคม"
 ITA_social_stability_desc: "เราไดทิ้งความโหดรายของสงครามกลางเมืองไวเบื้องหลัง สังคมของเราเปนธรรมและเสมอภาคมากขึ้น และแมเราจะยังมีหนทางอีกยาวไกลกวาจะบรรลุสังคมนิยม แตเราก็กลาวไดอยางภาคภูมิวาชาวอิตาลีไดรับสันติสุขทางสังคมในที่สุด"
 ITA_aid_for_the_spanish_republic: "ชวยเหลือสาธารณรัฐสเปน"
 ITA_aid_for_the_spanish_republic_desc: "เราตองชวยเหลือสหายชาวสเปนในสงครามกลางเมือง สาธารณรัฐสังคมนิยมของพวกเขากําลังถูกปดลอมโดยนายพลสเปนกระหายเลือดที่เคยสาบานตนจงรักภักดีตอรัฐที่พวกเขากําลังยํ่ายีอยูในขณะนี้ โดยมีมหาอํานาจฟาสซิสตแหงยุโรปหนุนหลัง"
 ITA_italia_libera: "อิตาลีเสรี"
 ITA_italia_libera_desc: "เราตองเปนฝายริเริ่มและเสนอตอรัฐบาลเพื่อนบานที่เปนมิตรใหกอตั้งพันธมิตรในยุโรป ที่จะชวยใหเรารวมมือกันและปองกันตนเองจากภัยคุกคามมากมายที่รายลอมเราอยู"
 ITA_european_democracies: "ประชาธิปไตยแหงยุโรป"
 ITA_european_democracies_desc: "เราตองสานตอนโยบายความเปนปกแผนและความรวมมือระหวางประเทศประชาธิปไตยในยุโรป ดวยการทูต เราจะสรางพันธมิตรอันทรงพลังที่สามารถรับมือกับพันธมิตรใดก็ได"
 ITA_peace_preservation: "ธํารงสันติภาพ"
 ITA_peace_preservation_desc: "ในยามที่ความไรเสถียรภาพและความขัดแยงระหวางประเทศปะทุขึ้นเชนนี้ มีเพียงชาวอิตาลีเทานั้นที่พรอมรับภาระในการธํารงและบังคับใชสันติภาพในยุโรป"
 ITA_scientific_cooperation: "ความรวมมือทางวิทยาศาสตร"
 ITA_scientific_cooperation_desc: "เราตองพัฒนาโครงการความรวมมือทางวิทยาศาสตรเพื่อใหมั่นใจวาเราจะกาวทันความกาวหนาทางเทคโนโลยีของมหาอํานาจโลกอื่น ๆ"
 ITA_secure_the_borders: "รักษาพรมแดน"
 ITA_secure_the_borders_desc: "ดวยความตึงเครียดระหวางประเทศที่เพิ่มขึ้นทั่วโลก ชาติใดที่ไมใชพันธมิตรของเราตองถือวาอาจเปนศัตรูได เราตองเสริมความแข็งแกรงและวางกําลังรักษาการณตามพรมแดนโดยเร็วเพื่อปองกันและหยุดยั้งการรุกรานใด ๆ"
 ITA_bring_down_fascist_strongholds: "ทลายฐานที่มั่นฟาสซิสต"
 ITA_bring_down_fascist_strongholds_desc: "ดวยสถานการณวิกฤตในยุโรป เราไมอาจรอใหมหาอํานาจฟาสซิสตผูกาวราวเปดฉากรุกโจมตีเราได ผูที่ลงมือกอนยอมไดเปรียบ เราจึงจะทําใหแนใจวาเราจะโจมตีพวกฟาสซิสตกอนและอยางหนักหนวง"
 ITA_reestablish_old_alliances: "ฟนพันธมิตรเกา"
 ITA_reestablish_old_alliances_desc: "เราตองพยายามสรางพันธมิตรที่เราเคยกอตั้งในมหาสงครามขึ้นใหม เพราะมีเพียงการผนึกกําลังกับมหาอํานาจประชาธิปไตยแหงยุโรปเทานั้นที่เราจะเอาชนะภัยคุกคามมากมายที่รอเราอยูได"
 ITA_military_agreements: "ขอตกลงทางทหาร"
 ITA_military_agreements_desc: "เรามีสิ่งที่ตองเรียนรูจากพันธมิตรอีกมาก เราตองเขาหาพวกเขาพรอมขอเสนอในการพัฒนาโครงการความรวมมือทางทหารและเทคโนโลยี"
 ITA_the_enemies_of_capitalism: "ศัตรูของทุนนิยม"
 ITA_the_enemies_of_capitalism_desc: "คอมมิวนิสตโซเวียตเปนภัยคุกคามใหญหลวงตอทั่วทั้งยุโรป และยอมรวมถึงรัฐอิตาลีดวย ถึงเวลาจัดการกับพวกมันแลว"
 ITA_the_ethiopian_question: "ปญหาเอธิโอเปย"
 ITA_the_ethiopian_question_desc: "สงครามในเอธิโอเปยเปนเรื่องโหดรายและอยุติธรรม เราตองชดใชความโหดรายที่พวกฟาสซิสตกอไวในประเทศนั้น และติดตอเจาหนาที่ทองถิ่นเพื่อแสวงหาการคืนดี"
 ITA_abolish_the_colonies: "ยกเลิกอาณานิคม"
 ITA_abolish_the_colonies_desc: "เราจะพัฒนาและนําเสนอแผนการปฏิวัติเพื่อยกเลิกสถานะอาณานิคมของทุกภูมิภาคของอิตาลี เปนครั้งแรกในประวัติศาสตรของประเทศเราที่พลเมืองทองถิ่นในภูมิภาคเหลานั้นจะมีโอกาสกําหนดชะตากรรมของตนเอง เปนหนาที่ของเราที่จะทําใหพวกเขาเห็นประโยชนของการเปนจังหวัดโดยชอบธรรมของรัฐอิตาลี"
 ITA_cooperatives_for_intensive_exploitation: "สหกรณเพื่อการแสวงประโยชนอยางเขมขน"
 ITA_cooperatives_for_intensive_exploitation_desc: "แอฟริกาเปนทวีปที่อุดมสมบูรณดวยแหลงทรัพยากรขนาดใหญ เราควรลงทุนพัฒนาวิธีการใชประโยชนจากแหลงเหลานี้ใหไดมากที่สุด"
 ITA_condemn_colonialism: "ประณามลัทธิอาณานิคม"
 ITA_condemn_colonialism_desc: "ถึงเวลาประณามลัทธิอาณานิคมและเรียกรองตอมหาอํานาจยุโรปที่กดขี่ชาวแอฟริกันมานับปไมถวน และหากถึงคราวจําเปน เราจะตอสูกับพวกเขาเพื่อประโยชนของชาวแอฟริกัน"
 ITA_new_colonial_policies: "นโยบายอาณานิคมใหม"
 ITA_new_colonial_policies_desc: "ระบอบฟาสซิสตปฏิบัติตอประชากรทองถิ่นในอาณานิคมอยางเลวรายมานานเกินไปแลว ถึงเวลาทบทวนนโยบายอาณานิคม มอบอํานาจปกครองตนเองบางสวนแกภูมิภาคเหลานี้ และแกไขความอยุติธรรมที่เกิดขึ้นในอดีต"
 ITA_negotiations_with_albania: "เจรจากับแอลเบเนีย"
 ITA_negotiations_with_albania_desc: "ประวัติศาสตรของแอลเบเนียไดรับอิทธิพลจากอิตาลีอยางมากในชวงหลายทศวรรษที่ผานมา เมื่อเราทิ้งระบอบเผด็จการฟาสซิสตไวเบื้องหลังแลว เราควรเสนอตอรัฐบาลแอลเบเนียใหกระชับความสัมพันธระหวางสองชาติ และอาจถึงขั้นรวมการบริหารของแอลเบเนียเขากับของเรา เพื่อรวมสองประเทศเปนหนึ่งเดียวอยางเปนทางการ"
 ITA_enlist_the_bashkimi_kombetar: "เกณฑ Bashkimi Kombëtar"
 ITA_enlist_the_bashkimi_kombetar_desc: "มีพลเมืองแอลเบเนียจํานวนมากที่เห็นอกเห็นใจรัฐบาลและอุดมการณของเรา และปรารถนาจะเขารวมหนวยเสื้อแดง เราควรตั้งสาขาใหมของกองกําลังอาสาสมัครเพื่อจัดหนวยใหมที่ประกอบดวยทหารใหมเหลานี้"
 ITA_the_italian_confederation: "สมาพันธอิตาลี"
 ITA_the_italian_confederation_desc: "หลังจากทบทวนนโยบายอาณานิคมแลว กาวตอไปคือการกอตั้งสมาพันธที่รวมทุกรัฐที่เกิดจากกระบวนการปลดปลอยอาณานิคมนี้ เพื่อเปนกรอบที่ชาติตาง ๆ ของเราจะรวมมือกันและไดประโยชนรวมกัน"
 ITA_planned_economy: "เศรษฐกิจแบบวางแผน"
 ITA_planned_economy_desc: "ผูแทนของสมาพันธใหมของเราไดเสนอโครงการริเริ่มทางเศรษฐกิจ ซึ่งพวกเขากลาววาจะชวยควบคุมและกระตุนเศรษฐกิจของรัฐสมาชิกทั้งหมดไดอยางมีประสิทธิภาพและยั่งยืน"
 ITA_the_fight_overseas: "การรบโพนทะเล"
 ITA_the_fight_overseas_desc: "ถึงเวลาเสริมแนวปองกันและเตรียมการสงกําลังบํารุงเพื่อสนับสนุนการทัพครั้งใหญในทวีปแอฟริกา เราจะพัฒนาเทคนิคการฝกเฉพาะทางใหกองทหารและกองทัพเรือของเรา เพื่อใหปฏิบัติการไดอยางดีที่สุดในสภาพอันยากลําบากที่จะตองเผชิญ"
 ITA_irregulars: "ทหารนอกแบบ"
 ITA_irregulars_desc: "ทหารนอกแบบมีบทบาทสําคัญในการทัพแอฟริกา เราตองเพิ่มการเกณฑในหมูประชากรทองถิ่นและปรับปรุงการฝกที่หนวยเหลานี้ไดรับ"
 ITA_liberate_the_workers_of_africa: "ปลดปลอยแรงงานแหงแอฟริกา"
 ITA_liberate_the_workers_of_africa_desc: "ถึงเวลาปลดปลอยชาวแอฟริกันจากรัฐบาลตาง ๆ ที่กดขี่พวกเขาใหสิ้นซากแลว!"
 ITA_ascari: "อัสการี"
 ITA_ascari_desc: "กองพลประจําการที่ประกอบดวยทหารทองถิ่นจากแอฟริกาพิสูจนแลววามีประสิทธิภาพสูงในหลากหลายบทบาท ไมเพียงในฐานะกองรักษาการณหรือกองหนุน แตยังรวมถึงปฏิบัติการทางทหารในภูมิประเทศยากลําบากที่กองพลอื่นจะตองดิ้นรน"

