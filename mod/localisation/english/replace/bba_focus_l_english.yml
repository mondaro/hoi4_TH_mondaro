 banda_carita_tt: "ปองกันไมใหเยอรมนีทําแผนยุทธศาสตร §Y$GER_assassinate_mussolini$§! สําเร็จ"
 ITA_demand_ticino: "เรียกรองตีชีโน"
 ITA_demand_ticino_desc: "รัฐแหงขุนเขาอยางสวิตเซอรแลนดมีหลายชาติพันธุอาศัยอยู และหนึ่งในนั้นคือชาวอิตาลี ซึ่งสวนใหญอยูในแคนตันทางใตของประเทศ เชน ตีชีโน เพื่อสรางรัฐอิตาลีอันยิ่งใหญ เราตองทําใหประชาชนของเราทุกคนอยูในประเทศเดียวกันได"
 ITA_austrian_guarantees_tt: "หากเยอรมนีพยายามทําอันชลุส อิตาลีจะไดรับตัวเลือกใหเขาแทรกแซง"
 ITA_all_eth_initial_states_controlled_tt: "รัฐเริ่มตนทั้งหมดของเอธิโอเปยถูกควบคุมโดย §Y[ROOT.GetFlag][ROOT.GetNameDef]§! หรือ§Yพันธมิตร[ROOT.GetAdjective]§!"
 ITA_fronte_militare_clandestino_modifier_tt: "เพิ่ม §Y$ITA_fronte_militare_clandestino_modifier$ (อิตาลี)§! (§Y730§! วัน) ซึ่งให: \n   $MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G+10%§! \n   $MODIFIER_REQUIRED_GARRISON_FACTOR$: §R+15%§! \n\n"
 ITA_flotta_d_evasione_admiral_traits_tt: "พลเรือเอกสุมสองนายจะไดรับคุณลักษณะ §Y$bold$§!: \n- $MODIFIER_NAVAL_SPEED$: §G+10%§! \n- $MODIFIER_NAVAL_DAMAGE_FACTOR$: §G+5.00%§! \n\n"
 ITA_heroes_of_the_nation_general_traits_tt: "\nนายพลสุมสามนายจะไดรับคุณลักษณะ §Y$war_hero$§!: \n- $MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-50.0%§! \n- $MODIFIER_REASSIGNMENT_DURATION_FACTOR$: §R+50.0%§! \n\n"
 ITA_mussolini_becomes_field_marshal_tt: "$ITA_benito_mussolini$ ไดเปนจอมพล"

 ITA_the_italian_liberation_war: "สงครามปลดปลอยอิตาลี"
 ITA_the_italian_liberation_war_desc: "ถึงเวลาลุกขึ้นตอตานพวกฟาสซิสตและโคนลมระบอบอันเนาเฟะของพวกมัน! พลพรรคตอตานฟาสซิสตจากทั่วอิตาลีพรอมสูและสละชีพในสงครามปลดปลอยชาติครั้งนี้!"
 ITA_fronte_militare_clandestino: "แนวรวมทหารใตดิน"
 ITA_fronte_militare_clandestino_desc: "เราจะจัดตั้งองคกรทหารลับที่ผูกกับเซลลขบวนการตอตานในทุกเมืองของอิตาลี และเชื่อมโยงกับกองทัพของเรา เพื่อประสานปฏิบัติการทางทหารและปฏิบัติการของพลพรรคหลังแนวหนา"
 ITA_corpo_volontari_della_liberta: "กองอาสาสมัครเพื่อเสรีภาพ"
 ITA_corpo_volontari_della_liberta_desc: "คณะกรรมการปลดปลอยแหงชาติมุงมั่นจะเสริมความแข็งแกรงใหโครงสรางการประสานงานทางทหารของเรา คือกองอาสาสมัครเพื่อเสรีภาพ เพื่อบริหารและประสานพลพรรคและกองกําลังติดอาวุธจํานวนมากขึ้นไดอยางมีประสิทธิภาพ"
 ITA_the_carabinieri: "คาราบินิเอรี"
 ITA_the_carabinieri_desc: "ดวยบทบาทของคาราบินิเอรีในการลมสลายของระบอบฟาสซิสต บัดนี้พวกเขาจึงถูกพวกฟาสซิสตโจมตี ทําใหหลายคนเขารวมขบวนการตอตานของอิตาลี เราควรผนวกหนวยเหลานี้เขากับกองปลดปลอยอิตาลี"
 ITA_gappisti: "กัปปสตี"
 ITA_gappisti_desc: "เราจะจัดตั้งกลุมปฏิบัติการรักชาติ หนวยพลพรรคขนาดเล็กที่ปฏิบัติการในเมืองเปนหลัก คลายกับขบวนการตอตานของฝรั่งเศส กัปปสตีของเราจะโจมตีขาศึกอยางหนักหลังแนวหนา บั่นทอนขวัญกองรักษาการณและไดรับการสนับสนุนจากคนทองถิ่น"
 ITA_partisan_republics: "สาธารณรัฐพลพรรค"
 ITA_partisan_republics_desc: "เราจะสงเสริมการกอตั้งหนวยรัฐชั่วคราวในรูปแบบสาธารณรัฐพลพรรคในพื้นที่ที่พลพรรคปลดปลอยได เพื่อเปนแหลงรวมพลนักสูฝายตอตาน และตรึงขาศึกไวหลังแนวหนา"
 ITA_the_kings_finest: "ยอดทหารแหงกษัตริย"
 ITA_the_kings_finest_desc: "เราจะจัดตั้งกองพลพิเศษที่ประกอบดวยทหารและนายทหารผูภักดีตอราชบัลลังกอิตาลี และจะฝกพวกเขาใหเปนกําลังชั้นยอดของกองทัพปลดปลอย"
 ITA_grande_rivolta_rurale: "การลุกฮือครั้งใหญของชาวชนบท"
 ITA_grande_rivolta_rurale_desc: "ถึงเวลาที่ชาวนาอิตาลีจะรวมอุดมการณของเราและจับอาวุธตอสูกับผูกดขี่ฟาสซิสต ขาศึกจะไมมีโอกาสในพื้นที่ชนบทอีกตอไป!"
 ITA_liberation_or_death: "ปลดปลอยหรือตาย!"
 ITA_liberation_or_death_desc: "เราตอสูอยางหนักเพื่อปลดปลอยประชาชนอิตาลีจากการกดขี่ของฟาสซิสต เราสูญเสียอยางใหญหลวง แตไมสูญเปลา บัดนี้ถึงเวลาผลักดันครั้งสุดทายเพื่อถอนรากถอนโคนฟาสซิสตในอิตาลีใหสิ้นซาก!"
 ITA_independence_rds: "เอกราชของอิตาลี"
 ITA_independence_rds_desc: "พอกันทีกับการกดขี่ที่พันธมิตรจอมปลอมของเรากระทําตอเรา นับจากนี้ชาติอิตาลีจะกําหนดชะตากรรมของตนเอง หากตองหลั่งเลือดอีกครั้งเพื่อบรรลุเปาหมายนี้ ประชาชนอิตาลีผูภาคภูมิก็พรอมแลว"
 ITA_the_italian_social_republic: "สาธารณรัฐสังคมอิตาลี"
 ITA_the_italian_social_republic_desc: "พวกนิยมกษัตริยและกลุมตอตานฟาสซิสตอื่น ๆ ในอิตาลีไดลุกฮือตอตานระบอบของเราอยางทรยศ เราไดปฏิรูปพรรคเปนพรรคฟาสซิสตสาธารณรัฐที่ตอตานระบอบกษัตริย และกอตั้งสาธารณรัฐสังคมอิตาลี รางใหมของรัฐฟาสซิสตอิตาลี เราจะตานทานการโจมตีของขาศึกและรวมแผนดินของเราอีกครั้ง!"
 ITA_guardia_nazionale_repubblicana: "กองรักษาการณแหงชาติสาธารณรัฐ"
 ITA_guardia_nazionale_repubblicana_desc: "ดวยบทบาทของคาราบินิเอรีหลวงในความพยายามโคนลมระบอบฟาสซิสต เราจะเปลี่ยนกองกําลังติดอาวุธนี้ทันที เรามีแผนอยูแลวที่จะฟนฟูหนวยเสื้อดําและจัดตั้งกองรักษาการณแหงชาติสาธารณรัฐเพื่อปฏิบัติหนาที่ทั้งดานตํารวจและการทหาร"
 ITA_integrate_polizia_dell_africa_italiana: "ผนวกตํารวจแอฟริกาของอิตาลี"
 ITA_integrate_polizia_dell_africa_italiana_desc: "เราตองผนวกตํารวจอาณานิคมของเราขณะที่หนวยเหลานี้ยังภักดีตออิตาลีและระบอบของเรา พวกพลพรรคยอมพยายามดึงกองกําลังเหลานี้ไปในไมชาอยางไมตองสงสัย..."
 ITA_anti_partisan_measures: "มาตรการปราบพลพรรค"
 ITA_anti_partisan_measures_desc: "พลพรรคฝายขาศึกเคลื่อนไหวอยางผิดปกติในชวงหลัง คอยกอกวนกองหนุนและคุกคามเสนทางสงกําลังบํารุงของเรา เราตองสงหนวยใหมที่เชี่ยวชาญการรบปราบพลพรรคเพื่อสกัดแกงสาปแชงเหลานี้ไว"
 ITA_all_within_the_state: "ทุกสิ่งอยูในรัฐ"
 ITA_all_within_the_state_desc: "หากเราจะชนะสงครามนองเลือดนี้ ทุกคนจําเปนตองมีสวนรวมในความพยายามทางสงคราม แตไมใชทุกอยางจะเปนการสูรบกับขาศึกโดยตรง แนวหนาของเราตองไดรับการหนุนหลังจากอุตสาหกรรมและการสงกําลังบํารุงที่แข็งแกรง พอ ๆ กับทหารที่ประจําแนว"
 ITA_battaglioni_m: "กองพัน M"
 ITA_battaglioni_m_desc: "เราตองมีหนวยชั้นยอดใหมเพื่อสกัดการโจมตีของขาศึก เราตองปรับเปลี่ยนและเสริมกําลังกองพันเสื้อดําที่สรางชื่อในการรบ และใชกองกําลังเหลานี้เสริมจุดออนที่สุดในแนวหนาของเรา แลวผลักขาศึกกลับไปยังที่ที่พวกมันจากมา"
 ITA_reinforce_the_gustav_line: "เสริมแนวกุสตาฟ"
 ITA_reinforce_the_gustav_line_desc: "เราตองเสริมความแข็งแกรงใหแนวปองกันเพื่อสกัดการรุกคืบของหนวยขาศึกใด ๆ สาธารณรัฐสังคมอิตาลีจะตองไมลมลงในตอนนี้!"
 ITA_the_social_republic_prevails: "สาธารณรัฐสังคมมีชัย!"
 ITA_the_social_republic_prevails_desc: "เราหลั่งเลือดมามากเกินไปในสงครามอันขมขื่นที่เริ่มโดยกลุมคนทรยศจอมบงการ แตบัดนี้ถึงเวลายุติมันแลว รัฐอิตาลีจะเกิดใหมอีกครั้ง แข็งแกรงกวาที่เคย!"
