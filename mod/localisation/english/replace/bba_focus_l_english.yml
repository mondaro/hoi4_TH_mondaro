 ETH_falling_back: "ถอยรน"
 ETH_falling_back_desc: "แนวหนาของเรากําลังกลายเปนที่ตั้งรับไมไดอยางรวดเร็ว และเสนทางสงเสบียงก็ยืดยาวจนบางเฉียบ การถอยอยางเปนระเบียบไปยัง [ROOT.Capital.GetCapitalVictoryPointName] อาจเปนทางที่ฉลาด แตเราตองระวังไมใหแตกพายหนีออกจากสนามรบโดยสิ้นเชิง"
 ETH_falling_back_tt: "หนวยทหารอิตาลีจะไดรับบทลงโทษดานการเคลื่อนที่และการโจมตีในรัฐชายแดนที่เอธิโอเปยควบคุมเปนเวลา 60 วัน"
 ETH_northern_thrust: "บุกขึ้นเหนือ"
 ETH_northern_thrust_desc: "ลําดับความสําคัญแรกของเราควรเปนการยึดเอริเทรีย หากเราตัดชาวอิตาลีออกจากทาเรือทางเหนือได พวกเขาจะสงเสบียงใหกองกําลังไดยากขึ้นมาก แลวเราจึงคอยจัดการแนวรบดานใตที่ออนแอกวา"
 ETH_victory_in_the_desert: "ชัยชนะในทะเลทราย"
 ETH_victory_in_the_desert_desc: "โอกาเดนเปนจุดที่ออนแอที่สุดของแนวรบอิตาลี เราควรทุมความพยายามเอาชนะพวกเขาที่นั่น แลวตามดวยการยึดทาเรือทางใตของพวกเขา วิธีนี้นาจะทําใหเราไมตองหวงแนวหลัง และสามารถมุงหนาสูเอริเทรียได"
 ETH_the_defense_of_addis_ababa: "การปองกันแอดดิสอาบาบา"
 ETH_the_defense_of_addis_ababa_desc: "แอดดิสอาบาบาคือเมืองหลวงตามประวัติศาสตร และยังเปนศูนยกลางอุตสาหกรรมของเอธิโอเปยดวย หากเมืองนี้แตก อุดมการณของเราก็สิ้นหวัง เราตองทําทุกวิถีทางเพื่อรักษาเมืองไว"
