 ETH_the_abuna: "อาบูนา"
 ETH_the_abuna_desc: "การตอตานผูรุกราน [ITA.GetAdjective] ไมใชเพียงเรื่องความภักดีตอจักรพรรดิ แตเปนเรื่องศีลธรรม ดวยการปรึกษากับ $ETH_abuna_qerellos_iv$ เราจะแสดงใหประชาชนเห็นถึงความชอบธรรมของอุดมการณของเรา และความจําเปนที่พวกเขาตองทําหนาที่ในนามของพระเจาของเรา"
