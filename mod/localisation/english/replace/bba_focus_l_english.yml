 ITA_il_vento_aureo: "สายลมทองคํา"
 ITA_il_vento_aureo_desc: "สันตะปาปาถูกกดขี่โดยกองกําลังตางชาติมาชานาน อยางไรก็ตาม เราสามารถปรับปรุงกองทัพอากาศและโครงการฝกนักบินขับไลใหไดนักบินที่ราคาถูกกวามากแตกลาหาญยิ่งกวา นําอาณาจักรทองคําแหงศาสนจักรคาทอลิกไปสูศัตรูของเราจากฟากฟา นี่จะเปนเพลงบรรเลงสงวิญญาณอันยิ่งใหญที่สุดของเรา!"
 form_greater_italy_tt: "ปลดล็อกการตัดสินใจ: §Yประกาศมหาอาณาจักรอิตาลี§!"
 ITA_papal_faction: "อาณาจักรคาทอลิก"
 ITA_roman_faction: "จักรวรรดิโรมัน"
 ITA_latin_initiatives: "โครงการริเริ่มละติน"

 ITA_depose_mussolini: "โคนมุสโสลินี"
 ITA_depose_mussolini_desc: "ถึงเวลาขับมุสโสลินีออกจากอํานาจแลว! เขาพิสูจนตัวเองแลววาเปนผูนําไรความสามารถที่ลากอิตาลีอันเปนที่รักของเราผานความยากลําบากที่ไมจําเปนมากมาย และทดสอบความอดทนของประเทศจนเกินขีดจํากัด แมเงาของเขาอาจยังทอดทับเราอยูอีกระยะหนึ่ง แตอิตาลีและประชาชนจะตองผานพนไปได!"
 ITA_italo_balbo_focus: "อิตาโล บัลโบ"
 ITA_italo_balbo_focus_desc: "เราตองการผูนําทางทหารที่มีความสามารถเพื่อพาเราผานชวงเวลาอันปนปวนที่รออยูขางหนา อิตาโล บัลโบ ไมไดเปนเพียงผูนําทางทหาร แตยังเปนวีรบุรุษดานการบินที่เคยปฏิบัติภารกิจทางการทูตหลายครั้ง และปกครองดินแดนลิเบียของเราไดอยางมีประสิทธิภาพ เขาจะยกระดับกองทัพที่อยูในสภาพยํ่าแยของเราและนําความรุงโรจนมาสูอิตาลีอยางแนนอน!"
 ITA_remove_balbo_as_advisor_tt: "§Yอิตาโล บัลโบ§! จะไมสามารถเปน§Yที่ปรึกษา§!หรือ§Yจอมพล§!ไดอีกตอไป"
 ITA_dino_grandi_focus: "ดีโน กรันดี"
 ITA_dino_grandi_focus_desc: "หากเราตองการความรุงเรือง เราตองการผูที่เชี่ยวชาญการทูตและไมกลัวที่จะปรับโครงสรางสถาบันเกาแก ดีโน กรันดี เคยดํารงตําแหนงรัฐมนตรีตางประเทศและปฏิรูปวงการทูต เปดโอกาสใหคนอื่นนอกจากชนชั้นขุนนางไดเขามา เขาจะไมลังเลที่จะปฏิรูปอยางที่จําเปนและผลักดันอิตาลีสูอนาคตใหมที่สดใส!"
 ITA_remove_grandi_as_advisor_tt: "§Yดีโน กรันดี§! จะไมสามารถเปน§Yที่ปรึกษา§!ไดอีกตอไป"
 ITA_has_new_duce_flag: "ถูกโคนอํานาจโดย§Yสภาใหญ§!"
 ITA_stop_the_squandering: "หยุดการใชจายฟุมเฟอย"
 ITA_stop_the_squandering_desc: "มุสโสลินีใชเงินและทรัพยากรที่อิตาลีแทบไมมีปญญาจายมานานเกินไปแลว ถึงเวลายุติการผลาญอยางไรความรับผิดชอบนี้! เราตองควบคุมคาใชจายและมุงใชเงินทุนไปพัฒนาดานอื่น ๆ"
 ITA_consolidate_power: "รวบอํานาจ"
 ITA_consolidate_power_desc: "การกุมอํานาจของเราเหนือพรรคและประเทศโดยรวมยังคงออนแอ เราตองรวบรวมอํานาจที่มีและเสริมความมั่นคงใหระบอบดวยการแสดงใหสาธารณชนเห็นวาเรายังเขมแข็งและพึ่งพาไดเหมือนเชนเคย!"
 ITA_purge_the_party: "กวาดลางพรรค"
 ITA_purge_the_party_desc: "มีเสียงกระซิบมาถึงหูเราวาบางคนปรารถนาเพียงอยางเดียวคือเห็นระบอบเกากลับคืนมา แมมุสโสลินีจะถูกขับและปลดออกจากอํานาจแลว แตเงาของเขายังคงปรากฏอยูทั่วรัฐบาลและในจิตใจของประชาชน เราตองแสดงพลังและกวาดลางพรรคจากกลุมคนที่ไมไดภักดีตอเราอยางแทจริงแตยังคงจงรักตอดูเชคนเกา"
 ITA_the_fate_of_mussolini: "ชะตากรรมของมุสโสลินี"
 ITA_the_fate_of_mussolini_desc: "ขณะที่มุสโสลินียังถูกกักบริเวณในบาน เราไมอาจกาวไปขางหนาไดอยางแทจริงในขณะที่เขายังคงเปนเงาทะมึนเหนือเรา เราไดยึดตําแหนงผูกุมอํานาจที่แทจริงในพรรคไวแลว ถึงเวลาตัดสินชะตากรรมของอดีตดูเชแลว!"
 ITA_divino_duce: "ดูเชผูศักดิ์สิทธิ์"
 ITA_divino_duce_desc: "สิ่งที่เห็นไดชัดคืออิทธิพลที่คนเพียงคนเดียวมีตอประเทศและประชาชน บางทีนั่นอาจเปนสิ่งที่เราใชและปรับใหเขากับเราได ดวยการใชชองทางของรัฐ เราสามารถสงเสริมดูเชคนใหมของเราใหเปนผูนําที่เขมแข็งและมีความสามารถซึ่งจะรวมอิตาลีเปนหนึ่งเดียว เราจะมอบบุคคลผูยิ่งใหญเหนือมนุษยใหประชาชนไดเชื่อมั่น ผูศักดิ์สิทธิ์ที่พวกเขาจะฝากศรัทธาไวได!"
 ITA_blackshirt_loyalty: "ชนะใจกองเสื้อดํา"
 ITA_blackshirt_loyalty_desc: "กองเสื้อดํามีสถานะพิเศษในลัทธิฟาสซิสตของอิตาลีมาชานาน และหากเราตองการปลุกแรงบันดาลใจในหมูประชาชน การไดรับความภักดีจากองคกรนี้จะเปนประโยชนอยางยิ่ง พวกเขาจะมีประโยชนมากในการเผยแพรภาพลักษณอันศักดิ์สิทธิ์ของดูเชคนใหมผูรุงโรจนไปทั่วกองทัพ และไกลกวานั้น"
 ITA_a_greater_purpose: "จุดมุงหมายที่ยิ่งใหญกวา"
 ITA_a_greater_purpose_desc: "ความขัดแยงภายในพรรคเมื่อไมนานมานี้แสดงใหเราเห็นขอบกพรองของการผูกแนวคิดฟาสซิสตไวกับบุคคลใดบุคคลหนึ่งมากเกินไป เราควรมุงสงเสริมลัทธิฟาสซิสตในฐานะแนวคิดที่ยิ่งใหญกวา สิ่งที่อยูเหนือชีวิตอันจํากัดของมนุษยคนใดคนหนึ่ง เปนอุดมการณที่ผูคนจะรวมพลังอยูเบื้องหลัง"
 ITA_spreading_the_eagles_wings: "สยายปกอินทรี"
 ITA_spreading_the_eagles_wings_desc: "อุดมการณอื่น ๆ รอบตัวเรากําลังลมสลายและลมเหลว ดูเหมือนวามีเพียงลัทธิฟาสซิสตเทานั้นที่ยืนหยัดตานทานความปนปวนเหลานี้ไดอยางเหนียวแนน และถึงกับเจริญรุงเรือง เปนหนาที่ของเราที่จะนําเสถียรภาพนี้ไปสูชาติอื่นดวย มอบประภาคารแหงแสงสวางใหพวกเขาในยามมืดมนนี้!"
 ITA_italian_hegemony: "อํานาจนําของอิตาลี"
 ITA_italian_hegemony_desc: "ในโลกที่ถูกสงครามฉีกทึ้งรอบตัวเรา เราตองสรางแรงบันดาลใจและรวมชาติและวัฒนธรรมตาง ๆ ไวภายใตอํานาจนําของเรา แสดงใหพวกเขาเห็นวาลัทธิฟาสซิสตและ [ROOT.GetNameDefCap] เปนประโยชนตอพวกเขาอยางไร เราตองนําทางสูอนาคตที่สดใสกวา!"
 ITA_reorganize_regio_esercito: "ปรับโครงสราง Regio Esercito"
 ITA_reorganize_regio_esercito_desc: "ผูนําใหมยอมนํามาซึ่งมุมมองใหม ใครก็ตามที่ใสใจพิจารณายอมเห็นชัดวากองทัพผูมีชัยของเรายังมีจุดที่ปรับปรุงไดอีก ดวยทรัพยากรที่เพิ่งไดคืนมา เราควรลงทุนในการฝกมากขึ้นและปรับโครงสรางกองทัพเพื่อไมใหสิ่งใดขวางทางได!"
 ITA_reinforce_regia_aeronautica: "เสริมกําลัง Regia Aeronautica"
 ITA_reinforce_regia_aeronautica_desc: "Regia Aeronautica เปนที่เคารพและอิจฉาไปทั่วโลก แตก็ยังมีชองวางใหพัฒนา ดวยทรัพยากรที่พรอมใชมากขึ้น เราควรลงทุนในยุทโธปกรณและการฝกเพื่อทําใหเปนกองทัพอากาศที่นาเกรงขามที่สุด!"
 ITA_compagnie_auto_avio_sahariane: "ขยาย Compagnie Auto Avio Sahariane"
 ITA_compagnie_auto_avio_sahariane_desc: "กองรอยยานยนตทะเลทรายซาฮาราในลิเบียพิสูจนแลววามีประสิทธิภาพอยางยิ่งเมื่อทํางานรวมกับเครื่องบินลาดตระเวนของตนเอง การตอยอดแนวทางนี้จะทําใหกองกําลังของเรานาเกรงขามยิ่งขึ้นและทําใหศัตรูหวาดผวา!"
 ITA_combined_land_and_air_warfare: "สงครามผสานภาคพื้นดินและอากาศ"
 ITA_combined_land_and_air_warfare_desc: "การที่ Regia Aeronautica ชวยสนับสนุน Regio Esercito ไดแสดงใหเห็นศักยภาพของกองทัพอิตาลีแลว แตก็ยังพัฒนาไดอีก! การกระชับความรวมมือนี้จะทําลายลางศัตรูในสนามรบและนําความรุงโรจนนิรันดรมาสูอิตาลี!"
 ITA_the_fourth_shore: "ชายฝงที่สี่"
 ITA_the_fourth_shore_desc: "ลิเบียมักถูกเรียกวาชายฝงที่สี่ของอิตาลีและเปนสวนสําคัญยิ่งตออนาคตของชาติเรา เปนอาณานิคมที่อยูใกลที่สุดและมีคาที่สุดแหงหนึ่ง เพราะเปนจุดเชื่อมตอกับทวีปแอฟริกาสวนที่เหลือ การลงทุนทรัพยากรที่นี่คือการรักษาดินแดนโพนทะเลของเราและจะใหผลตอบแทนมหาศาลในอนาคต"
 ITA_oil_in_tripoli: "นํ้ามันในตริโปลี"
 ITA_oil_in_tripoli_desc: "เราเจอขุมทองในลิเบียแลว - ขุมทองคําดํานั่นเอง! เราไดคนพบแหลงนํ้ามันสํารองมหาศาลในทะเลทรายนอกเมืองตริโปลี เราไมอาจปลอยโอกาสเชนนี้ใหหลุดมือ แตควรใชประโยชนจากทรัพยสินนี้เพื่อความรุงโรจนของอิตาลี!"
 ITA_steel_in_tripoli: "เหล็กกลาในตริโปลี"
 ITA_steel_in_tripoli_desc: "ดูเหมือนจะมีแรเหล็กจํานวนมหาศาลฝงอยูในทะเลทรายนอกเมืองตริโปลี รอใหเราขุดขึ้นมาแปรรูป หากสรางโรงงานเหล็กกลาใกล ๆ เราจะนําเหล็กกลามาใชพัฒนากองกําลังอันเกรียงไกรของเราตอไปได!"
 ITA_novus_ordo: "ระเบียบใหม"
 ITA_novus_ordo_desc: "ชะตากรรมของอิตาลีผูกพันแนนแฟนกับลิเบีย ดังนั้นเราตองผนวกลิเบียเขากับอาณาจักรของเราใหแนบแนนยิ่งขึ้น ซึ่งทําไดโดยมอบ 'สัญชาติพิเศษ' ใหชาวลิเบียทุกคนที่เต็มใจตอสูเพื่อเรา และดวยวิธีนี้ เราจะกุมอํานาจเหนือทะเลเมดิเตอรเรเนียนและแอฟริกาเหนือไดมั่นคง"
 ITA_seek_british_military_cooperation: "แสวงหาความรวมมือทางทหารกับอังกฤษ"
 ITA_seek_british_military_cooperation_desc: "แมเราจะถูกอดีตพันธมิตรทรยศในสงครามครั้งกอน แตการมองขามความแคนและยื่นกิ่งมะกอกใหก็อาจยังสมเหตุสมผลอยูบาง เรามีสิ่งที่ตองเรียนรูจากอังกฤษอีกมาก โดยเฉพาะเรื่องกองทัพเรือและกองทัพอากาศ"
 ITA_anglo_italian_pact: "ลงนามกติกาอังกฤษ-อิตาลี"
 ITA_anglo_italian_pact_desc: "ความรวมมือทางทหารกับอังกฤษเปนประโยชนตอเราอยางมาก และสนธิสัญญาไมรุกรานก็จะเปนประโยชนเชนกัน กติกาเชนนี้จะรักษาดินแดนในแอฟริกาของเราไวไดเปนบริเวณกวาง ทําใหเราหันไปสนใจที่อื่นได"
 ITA_invite_france_to_military_partnership: "เชิญฝรั่งเศสเปนหุนสวนทางทหาร"
 ITA_invite_france_to_military_partnership_desc: "ฝรั่งเศสเปนเพื่อนบานใกลชิดที่แข็งแกรงที่สุดและเปนพันธมิตรเกาแกของเรา แมเราจะไมลืมการทรยศของพวกเขาในสงครามครั้งกอน แตเราใหอภัยได บางทีอาจถึงเวลาทิ้งความแคนเกาไวเบื้องหลังและเสริมความแข็งแกรงทางทหารผานความเปนหุนสวนที่ใกลชิด"
 ITA_franco_italian_pact: "ลงนามกติกาฝรั่งเศส-อิตาลี"
 ITA_franco_italian_pact_desc: "ความรวมมือทางทหารกับฝรั่งเศสมีคุณคายิ่ง และสนธิสัญญาไมรุกรานก็จะมีคุณคาเชนกัน ไมเพียงรักษาแนวปกตะวันตกของเราในยุโรป แตยังรวมถึงดินแดนในแอฟริกาสวนใหญ ทําใหเรามีอิสระที่จะมุงความสนใจไปที่อื่น"
 ITA_proclaim_the_italian_empire: "ประกาศจักรวรรดิอิตาลี"
 ITA_proclaim_the_italian_empire_desc: "ดวยดินแดนที่เพิ่งไดมาในแอฟริกา รุงอรุณวันใหมไดมาเยือนเรา ดวยจักรวรรดิที่กําลังเติบโตและการลงทุนอยางชาญฉลาดในกองทัพ เราไมไดเปนเพียงราชอาณาจักรอีกตอไป ในที่สุดเราก็มั่นใจพอที่จะประกาศรุงอรุณแหงจักรวรรดิอิตาลี! เรารอคอยชวงเวลานี้มานานแสนนาน!"
 ITA_italy_will_guarantee_tt: "[GetItalyGuaranteesMajor]"
 ITA_italy_will_guarantee_tt_standard: "§Y[ROOT.GetNameDefCap]§! จะ§Yรับประกันเอกราช§!ให§Yประเทศมหาอํานาจ§!ใดก็ตามที่รับประกันเอกราชให §Y[ROOT.GetNameDefCap]§!"
 ITA_italy_will_guarantee_tt_fulfilled: "§Y[ROOT.GetNameDefCap]§! จะ§Yรับประกันเอกราช§!ให§Yประเทศมหาอํานาจ§!ใดก็ตามที่รับประกันเอกราชให §Y[ROOT.GetNameDefCap]§! ผลปจจุบัน:"
 ITA_african_conquests_tt: "ดวยจักรวรรดิที่กําลังกอตัว การ§Yผนวก§!ดินแดนใน§Yทวีปแอฟริกา§!จะ§Yมีคาใชจายนอยลง§!"
 ITA_economic_reforms: "ปฏิรูปเศรษฐกิจ"
 ITA_economic_reforms_desc: "เศรษฐกิจซบเซาอยางมากภายใตระบอบเกา แตดวยพรรคชาติฟาสซิสต (Partito Nazionale Fascista) ที่ไดรับการฟนฟู เราพรอมยิ่งกวาพรอมที่จะรับมือภารกิจสําคัญนี้! บัดนี้เรามีอิสระที่จะแตงตั้งผูมีความสามารถและคุณสมบัติเหมาะสมมาฟนฟูเศรษฐกิจ"
 ITA_improve_the_industries: "พัฒนาอุตสาหกรรม"
 ITA_improve_the_industries_desc: "ดวยเศรษฐกิจที่ฟนคืนชีวิต บัดนี้เรามีทรัพยากรที่จะหันมาใสใจอุตสาหกรรมและปฏิรูปอยางกวางขวางในดานนี้ดวย อุตสาหกรรมที่มีประสิทธิภาพมากขึ้นยอมหมายถึงยุทโธปกรณที่สงถึงกองกําลังผูมีชัยของเราไดมากและเร็วขึ้นอยางแนนอน"
 ITA_reorganize_the_party: "ปรับโครงสรางพรรค"
 ITA_reorganize_the_party_desc: "พรรคชาติฟาสซิสตกลายเปนสถาบันที่เฉื่อยชาและเทอะทะ เต็มไปดวยการวางแผนรายและการยกยองตนเอง เมื่อเรากุมพรรคไดมั่นคงขึ้น บัดนี้เราเริ่มปรับโครงสรางพรรคใหมตั้งแตรากฐานได ทําใหมีประสิทธิภาพและคลองตัวยิ่งขึ้น"
 ITA_meritocracy: "ระบบคุณธรรม"
 ITA_meritocracy_desc: "เมื่อปราบปรามฝายคานภายในไดแลว บัดนี้เรามีอิสระที่จะเปดสถาบันหลายแหงใหสมาชิกนอกพรรคฟาสซิสตไดเขามา ซึ่งนาจะนํามาซึ่งแนวคิดใหมที่นาตื่นเตนและโอกาสใหม ๆ ดวย"
 ITA_expanded_corporatism: "ขยายบรรษัทนิยม"
 ITA_expanded_corporatism_desc: "บรรษัทนิยมเปนแนวคิดพื้นฐานของลัทธิฟาสซิสต และเปนสิ่งที่เราควรนําไปใชในดินแดนที่ไดมาใหมทั้งหมดใหมากที่สุดเทาที่ทําได แตการจะทําเชนนั้น เราตองพึ่งพาชนชั้นนําและผูมีความสามารถในทองถิ่น และเปดทางใหพวกเขากาวหนาในลําดับชั้นของฟาสซิสต นี่เปนวิธีงาย ๆ ในการปลูกฝงความภักดีและประสิทธิภาพในดินแดนใหมของเรา"


