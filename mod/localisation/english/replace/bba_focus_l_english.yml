 ETH_medal_gain_tt: "เพิ่มคาประสบการณที่ผูบัญชาการกองพลไดรับเมื่อไดรับเหรียญตรา §G+75%§!"
 ETH_officer_promotion_boost_tt: "§Yนายทหาร§! ทุกคนที่ไดเลื่อนยศเปน §Yนายพล§! ในอนาคตจะไดรับ §Gการโจมตี +1§! และ §Gการปองกัน +1§!"
 ETH_the_common_soldier: "ทหารสามัญ"
