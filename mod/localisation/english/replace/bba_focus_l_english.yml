 ETH_reinforce_dynamic_identity_desc: "ประชาชนยังคงสับสนเรื่องอัตลักษณของชาติภายใตการบริหารชุดใหม ไมวาจะมีขอขุนเคืองเล็กนอยเพียงใด บัดนี้พวกเขาคือชาว[ETH.GetAdjective] และถึงเวลาที่พวกเขาตองเรียนรูวาชาว[ETH.GetAdjective]ที่ดียอมภักดีตอ[ETH.GetLeader]และรัฐ"
 ETH_reinforce_ethiopian_identity: "เสริมสรางอัตลักษณเอธิโอเปย"
 ETH_reinforce_gojjam_identity: "เสริมสรางอัตลักษณกอจจาม"
 ETH_reinforce_jimman_identity: "เสริมสรางอัตลักษณจิมมา"
 ETH_reinforced_identity: "อัตลักษณที่เขมแข็งขึ้น"
 ETH_underground_wargames: "การซอมรบใตดิน"
 ETH_underground_wargames_desc: "เราดิ้นรนขับไลชาว[ITA.GetAdjective]ในสงครามครั้งกอน เพราะขาดความเขาใจวาการสงครามเปลี่ยนไปมากเพียงใดในชวงหลายทศวรรษที่ผานมา เพื่อไมใหผิดพลาดซํ้าอีก นายทหารของเราจําเปนตองเริ่มซอมรบและวางแผนโคนลมกองกําลัง[ITA.GetAdjective] แนนอนวาเราตองหลีกเลี่ยงไมใหเปนที่สงสัยในระหวางนั้น..."
 ETH_adopt_the_lira: "ใชเงินลีรา"

 ETH_adopt_the_lira_desc: "คาเงินของเราดิ่งลงอยางหนักจากความปนปวนทางเศรษฐกิจที่เกิดจากสงครามกับ[ITA.GetName]และคาใชจายในการฟนฟู แทนที่จะพยายามพยุงคาเงินที่มัวหมอง เราควรใชโอกาสนี้เพิ่มการบูรณาการทางเศรษฐกิจกับชาว[ITA.GetAdjective]ดวยการใชเงินลีรา"
 ETH_request_italian_equipment: "ขอยุทโธปกรณจากอิตาลี"
 ETH_request_italian_equipment_desc: "แมเราจะกาวหนาอยางมากในการปฏิรูปเศรษฐกิจและเสริมสรางกองทัพ แตเรายังไดประโยชนจากการสนับสนุนในภารกิจเหลานี้ไดอีก ดวยความสัมพันธที่แนนแฟนขึ้นกับชาว[ITA.GetAdjective] พวกเขาอาจยินดีสงยุทโธปกรณสวนเกินบางสวนมาใหเรา"
 ETH_request_italian_equipment_tt: "หาก [ITA.GetFlag][ITA.GetName] ตกลง [ETH.GetFlag][ETH.GetName] จะไดรับ §G$artillery_equipment$ 500§! หรือ §G$infantry_equipment_1$ 2500 §!"
 ETH_recruit_mercenaries: "เกณฑทหารรับจาง"
 ETH_recruit_mercenaries_desc: "ขณะนี้มีความตึงเครียดอยางมากภายในกองทัพระหวางทหารที่มีภูมิหลังตางกัน หลายคนภักดีตอระบอบเกาและไวใจไมได จนกวาเราจะกําจัดพวกไมภักดีเหลานี้ได เราตองมีกองกําลังที่ภักดีตอเราอยางไมมีขอกังขา และวิธีที่งายที่สุดในการสรางความภักดีก็คือเงินสด"
 ETH_askari_tt: "เกณฑ§Yอัสการีเอริเทรีย§! §G4 กองพล§!"
 ETH_sudanese_mercs_tt: "เกณฑ§Yทหารรับจางซูดาน§! §G4 กองพล§!"
 ETH_arab_mercs_colab_tt: "เกณฑ§Yทหารรับจางอาหรับ§! §G4 กองพล§!"
 ETH_set_up_a_customs_barrier: "ตั้งกําแพงศุลกากร"

 ETH_set_up_a_customs_barrier_desc: "ยิ่งเราปลอยใหเศรษฐกิจของเราพัวพันกับ[ITA.GetName]นานเทาใด ก็จะยิ่งยากที่จะหลุดพนจากอิทธิพลอันเสื่อมทรามของพวกเขา แมจะทําใหการเติบโตทางเศรษฐกิจชาลง เราก็ควรตั้งกําแพงศุลกากรเพื่อใหการคาระหวางสองชาติยากขึ้น ระบอบ[ITA.GetAdjective]จะโกรธเคือง แตเราจะหาเหตุผลทางเศรษฐกิจมาอางไดหากจําเปน"
 ETH_contact_the_exiles: "ติดตอผูลี้ภัย"
 ETH_contact_the_exiles_desc: "เมื่อสงครามกับ[ITA.GetName]ใกลยุติ หลายคนไดหนีไปยังภูมิภาคใกลเคียงดวยความหวาดกลัววาระบอบใหมจะนําสิ่งใดมา ขณะที่เราเริ่มดําเนินแผนทวงคืนเอกราช เราอาจโนมนาวชาวพลัดถิ่นกลุมใหญนี้ใหมารวมกับเราได แมเราจะเคยมีความขัดแยงกันในอดีต แตบัดนี้คือเวลาที่ตองรวมมือกันเพื่อมาตุภูมิ"
 ETH_outsourced_production: "จางผลิตจากภายนอก"
 ETH_outsourced_production_desc: "อุตสาหกรรมของเรายังเล็กและขาดประสบการณในการผลิตเครื่องมือสงคราม ทวาเมื่อเราอยูในเขตอิทธิพลของ[ITA.GetAdjective]อยางมั่นคงแลว เราก็สามารถใชสถานการณนี้ใหเกิดประโยชนสูงสุด ดวยการจางภายนอกผลิตตามความตองการของเราและใชความเชี่ยวชาญของผูผลิตอาวุธของพวกเขา"
 ETH_outsourced_production_tt: "ขอผูออกแบบกองทัพบกหรือกองทัพอากาศจาก [ITA.GetFlag]§Y[ITA.GetAdjective]§!:"
