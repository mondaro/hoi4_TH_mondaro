 ETH_purchase_obsolete_ships: "ซื้อเรือที่ลาสมัย"
 ETH_purchase_obsolete_ships_tt: "ปลดล็อกการตัดสินใจเพื่อซื้อเรือรุนเกาจากมหาอํานาจ"
 ETH_purchase_obsolete_ships_desc: "แมเราจะมีความกาวหนาในการพัฒนากองทัพเรือ แตเรายังไมสามารถสงกองเรือที่ปองกันชายฝงไดอยางเพียงพอ อยางไรก็ตาม เราอาจจัดหาเรือรุนเกาจากชาติอื่นมาเสริมกําลังกองเรือได"
 ETH_new_weapons_and_tactics: "อาวุธและยุทธวิธีใหม"
 ETH_new_weapons_and_tactics_desc: "การตามใหทันความกาวหนาทางเทคโนโลยีของกองทัพอื่นจําเปนตองลงทุนในกองทัพของเราอยางตอเนื่อง เพื่อใหมียุทโธปกรณและการฝกพรอมรับมือภัยคุกคามลาสุดเสมอ"
 ETH_old_reliable: "ของเกาที่ไวใจได"
 ETH_old_reliable_desc: "อาวุธที่เรียบงาย เชื่อถือได และซอมแซมได เปนที่ตองการในแนวหนามากกวากลไกซับซอนเกินเหตุที่หลายกองทัพใชกันอยูในตอนนี้ จะเสียเวลาและทรัพยากรฝกทหารดวยปนไรเฟลใหมไปทําไม ในเมื่อพวกเขารูวิธีใชปนเกาอยูแลว?"
