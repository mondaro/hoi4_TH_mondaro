 ETH_consolidate_east_africa: "รวบรวมแอฟริกาตะวันออก"

 ETH_consolidate_east_africa_desc: "ระเบียบโลกกําลังเปลี่ยนแปลงไปรอบตัวเรา ขณะที่จักรวรรดิเกาเริ่มลมสลาย หนทางเดียวที่จะรักษาที่ทางใหประชาชนของเราในระเบียบใหมนี้ คือการพิชิตและแสดงความสามารถในการเอาชนะทุกอุปสรรค ดวยเหตุนี้ เราจะรวบรวมแอฟริกาตะวันออกใหอยูใตการควบคุมของเรา และแสดงใหโลกเห็นแสนยานุภาพของ[ETH.GetName]"
