 ETH_the_hindenburg_wall: "กําแพงฮินเดนบูรก"
 ETH_the_hindenburg_wall_desc: "$ETH_wehib_pasha$ ที่ปรึกษาชาวตุรกีของเรา ตองการสรางปอมปราการเทียบเทาของเยอรมนีในสงครามครั้งกอนรอบเมืองฮารารและดิเรดาวา การยึดภูมิภาคนี้ไวจะทําใหชาวอิตาลีเชื่อมแนวรบเขาหากันไมได และรักษาการเขาถึงทะเลของเราผานทาเรือในจิบูตี"
 ETH_the_hindenburg_wall_tt_1: "§Y$VICTORY_POINTS_7980$§!:\n"
 ETH_the_hindenburg_wall_tt_2: "§Y$VICTORY_POINTS_13249$§!:\n"
 ETH_mercenaries: "ทหารรับจาง"
 ETH_mercenaries_desc: "มีชาวตางชาติมากมายที่ตองการรวมรบกับเราดวยเหตุผลตาง ๆ สวนใหญเปนนักผจญภัยไรคาที่หวังแตเงินของเรา แตเราอาจเกณฑทหารรับจางบางสวนจากคองโกของเบลเยียมและจากอาระเบียได การไดนักรบผูชํ่าชองเหลานี้มาอยูฝายเรายอมชวยพลิกดุลใหเปนประโยชนตอเราไดแนนอน"
 ETH_mercenaries_congo_tt: "เพิ่ม§Yหนวยทหารรับจางคองโก 3 หนวย§! หาก §Y[838.GetName]§! หรือ §Y[837.GetName]§! อยูใตการควบคุมของฝายเรา"
 ETH_mercenaries_arabia_tt: "เพิ่ม§Yหนวยทหารรับจางอาหรับ 2 หนวย§! หาก §Y[843.GetName]§! หรือ §Y[835.GetName]§! อยูใตการควบคุมของฝายเรา"
 ETH_reach_out_to_the_world: "สงเสียงถึงชาวโลก"
 ETH_reach_out_to_the_world_desc: "โลกตองรูวาเกิดอะไรขึ้นที่นี่ใน [ROOT.GetName] เราตานทานกองกําลังที่มีจํานวนเหนือกวามาไดนานเกินกวาที่มนุษยจะทําได และสูกับมหาอํานาจยุโรปจนชะงักงัน ประชาคมระหวางประเทศตองเห็นวาเราตองการความชวยเหลือเพื่อตานการรุกรานอันผิดกฎหมายนี้!"
 ETH_a_last_stand: "การยืนหยัดครั้งสุดทาย"
 ETH_a_last_stand_desc: "เราตองไมปลอยใหความพายแพหยุดเรา ทางเลือกสุดทายคือถอยไปยัง $VICTORY_POINTS_13244$ และเตรียมการปองกันที่นั่น ชาวอิตาลีจะลําบากในการสงเสบียงใหกองทัพไปไกลถึงตะวันตกสุดของ [ROOT.GetName]"
 ETH_the_lessons_of_war: "บทเรียนจากสงคราม"
 ETH_the_lessons_of_war_desc: "ไมมีใครรูวาตนจะรับมือกับแรงกดดันในสนามรบไดอยางไร ไมตองพูดถึงวาจักรวรรดิหรือชาติจะรับมืออยางไร แมเราจะเตรียมพรอมไมเพียงพอตอความตึงเครียดของสงครามสมัยใหม แตกองทัพของเราไดเรียนรูบทเรียนอันยากลําบากจากสงครามและแข็งแกรงขึ้นเพราะมัน"
 ETH_the_lessons_of_war_tt: "ปรับ §Y[GetEthiopianArmySpiritName]§! โดย:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§! \n$MODIFIER_MAX_DIG_IN$: §G+2§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+10%§!"
 ETH_arms_purchases: "จัดซื้ออาวุธ"
 ETH_arms_purchases_desc: "สันนิบาตชาติลมเหลวในการหยุดยั้งการรุกรานของอิตาลี กลับเพียงลงมติหามขายอาวุธใหทั้งสองประเทศ พวกเขายอมตองตระหนักวาสิ่งนี้ทํารายเรามากกวา [ITA.GetName] เรามีเหตุผลพอที่จะโตแยงวา ในฐานะผูปองกันอันชอบธรรม เราตองไดรับอนุญาตใหซื้ออาวุธจากนานาชาติ"
 ETH_arms_purchases_tt: "ปลดล็อกการตัดสินใจเพื่อซื้ออาวุธจากพอคาอาวุธระหวางประเทศ"
 ETH_request_embargo: "รองขอการควํ่าบาตร"
 ETH_request_embargo_desc: "การควํ่าบาตร [ITA.GetName] เปนเพียงพิธีกรรมที่ไมไดทํารายพวกเขาเลย สันนิบาตชาติพรอมรับฟงคํารองของเรา เราควรมุงโนมนาวคณะมนตรีใหควํ่าบาตรอยางเขมงวดขึ้นจนทํารายอิตาลีไดจริง โดยรวมถึงนํ้ามันและเหล็กกลา ซึ่งทั้งสองอยางจําเปนตอจักรกลสงครามของพวกเขา"
 ETH_international_brigades: "กองพลนอยนานาชาติ"
 ETH_international_brigades_desc: "ถึงเวลาแลวที่สันนิบาตชาติจะไมเพียงยกเลิกขอหามการสงกองกําลังมาสนับสนุนการตอสูของเรา แตตองสนับสนุนใหชาติสมาชิกลุกขึ้นตอตานผูรุกรานอยางแทจริง!"
 ETH_league_of_nations_volunteer_resolution: "ขอมติสันนิบาตชาติวาดวยกองพลนอยนานาชาติ"
 ETH_closing_the_suez: "ปดคลองสุเอซ"
 ETH_closing_the_suez_desc: "สันนิบาตชาติควรบังคับให [453.Owner.GetNameDef] ปดคลองสุเอซตอการเดินเรือของ [ITA.GetAdjective] สิ่งนี้จะทํารายจักรกลสงครามของ [ITA.GetAdjective] อยางหนัก และทําใหเราทําสงครามไดอยางเทาเทียม"
 ETH_international_mediation: "การไกลเกลี่ยระหวางประเทศ"
 ETH_international_mediation_desc: "สันนิบาตชาติไมอาจปลอยใหความขัดแยงระหวางรัฐสมาชิกสองรัฐยืดเยื้อนานขนาดนี้ได พวกเขาตองลงมือและบังคับให [ITA.GetName] ถอนกําลังกลับไปยังพรมแดนกอนสงคราม!"
 ETH_international_mediation_tt: "[ITA.GetName] และ [ETH.GetName] จะลงนามสันติภาพแบบไมมีเงื่อนไข\n "
 ETH_rally_around_the_emperor: "รวมพลังเคียงขางจักรพรรดิ"
 ETH_rally_around_the_emperor_desc: "สมเด็จพระจักรพรรดิ [ETH.GetLeader] ทรงเปนแกนหลักที่ยึดจักรวรรดิอันหลากหลายของเราไวดวยกัน ในยามวิกฤตนี้ เราตองละทิ้งความขัดแยงเล็กนอยและรวมพลังเคียงขางพระองค เพราะความอยูรอดของ [ETH.GetName] และประชาชนกําลังตกอยูในความเสี่ยง"
 ETH_rally_around_the_emperor_tt: "ปลดล็อกการตัดสินใจเพื่อกําหนด§Yประเทศเจาภาพ§!ที่เปนไปไดสําหรับ§Yรัฐบาลพลัดถิ่น§!ของเอธิโอเปย"
 ETH_support_spain_static_modifier: "สนับสนุนสเปน"

 ETH_boarding_the_train: "ขึ้นรถไฟ"
 ETH_boarding_the_train_desc: "แนวปองกันของเราเริ่มงอนแงน และหากไมมีการเปลี่ยนแปลงครั้งใหญ [ETH.GetName] จะสิ้นชาติ แมที่ปรึกษาหลายคนจะทูลแยงถึงผลเสียของการที่ราชบัลลังกวางลง แตสมเด็จพระจักรพรรดิ [ETH.GetLeader] ทรงตัดสินพระทัยเสด็จไปเจนีวา โดยมุงหมายจะรวบรวมแรงสนับสนุนจากนานาชาติตอเราที่สันนิบาตชาติ"
 ETH_boarding_the_train_tt: "§Y$ETH_haile_selassie$§! เสด็จออกจาก [ROOT.GetName] ไปยังสันนิบาตชาติ หากเอธิโอเปยยอมจํานน $ETH_haile_selassie$ จะจัดตั้ง§Yรัฐบาลพลัดถิ่น§!"
 ETH_has_host_nation_tt: "ไดกําหนด§Yประเทศเจาภาพ§!ที่เปนไปไดสําหรับรัฐบาลพลัดถิ่นแลว\n"
 ETH_the_emperor_stays: "จักรพรรดิประทับอยู"
 ETH_the_emperor_stays_desc: "แมที่ปรึกษาจะทูลวิงวอน แตสมเด็จพระจักรพรรดิ [ETH.GetLeader] ทรงตัดสินพระทัยอยางกลาหาญที่จะประทับอยูใน [ETH.GetName] และสูรบตอไปเคียงขางเหลานักรบผูกลา หวังวาพระองคจะทรงนําชัยชนะมาสูเราในชั่วโมงที่มืดมนที่สุดของจักรวรรดิ"
 ETH_the_american_radio_address: "พระราชดํารัสทางวิทยุถึงชาวอเมริกัน"
 ETH_the_american_radio_address_desc: "กฎของสันนิบาตชาติถูกละเมิดอยูเสมอ เมื่อการรุกรานเกิดขึ้นครั้งแลวครั้งเลา เพื่อมิใหจิตวิญญาณแหงความชั่วรายครอบงํามวลมนุษยชาติ ผูรักสันติทั้งปวงพึงรวมมือกัน เพื่อยืนหยัดรักษาไวซึ่งหลักนิติธรรมและสันติภาพ"
 ETH_the_patriots: "เหลาผูรักชาติ"
 ETH_the_patriots_desc: "แมผูรักชาติแหงก็อจจัมเคยเปนอุปสรรคตอแผนการของรัฐบาลจักรวรรดิ [ETH.GetName] ในภูมิภาคนี้ แตบัดนี้พวกเขากําลังชวยเราดวยการขัดขวางไมใหชาว [ITA.GetAdjective] ปกครองภูมิภาคนี้ไดเลย เราควรทําทุกอยางที่ทําไดเพื่อชวยเหลือผูรักชาติ เพื่อรักษาที่มั่นในประเทศและไมใหชาว [ITA.GetAdjective] อยูอยางสบายใจเกินไป "
 ETH_the_patriots_tt: "ปลดล็อกแผนยุทธศาสตรตอเนื่อง §Y$ETH_supporting_the_arbegnoch$§!\nเพิ่มเปาหมายการตอตาน §G+10§! ในรัฐที่ถูกขาศึกยึดครองทางตอนเหนือและตอนกลางของเอธิโอเปย"
 ETH_allow_fundraising_campaigns_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อเริ่มรณรงคระดมทุนเพิ่มเงินในทองพระคลังจักรวรรดิ"
