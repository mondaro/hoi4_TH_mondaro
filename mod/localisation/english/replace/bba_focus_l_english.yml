 ETH_a_port_of_our_own_desc: "เมื่อเราไดดินแดนชายฝงมาเมื่อเร็ว ๆ นี้ เราก็มีโอกาสเพิ่มการเขาถึงตลาดระหวางประเทศอยางมีนัยสําคัญดวยการสรางทาเรือของเราเอง สิ่งนี้จะทําใหการนําเขาและสงออกสินคางายขึ้นมาก และชวยเศรษฐกิจของเราไดอยางมหาศาล"
 ETH_expanding_the_railway_network: "ขยายเครือขายทางรถไฟ"
 ETH_expanding_the_railway_network_desc: "ทางรถไฟมีความสําคัญยิ่งตอการขนสงทรัพยากรไปยังโรงงานและตอไปยังตลาดในประเทศหรือตางประเทศ ดวยการขยายเครือขายทางรถไฟ เราจะสามารถสงทรัพยากรไปยังจุดหมายที่ตองการไดดียิ่งขึ้น นอกจากนี้ยังจะเปดโอกาสใหผูคนทั่ว [ETH.GetName] ยายถิ่นไปยังเมืองอุตสาหกรรมที่กําลังเติบโตไดมากขึ้น"
 ETH_taxing_the_nobility: "[ETH_GetSeizeAssetsTitle]"
 ETH_taxing_the_nobility_desc: "[ETH_GetTaxNobilityDesc]"
 ETH_expand_tax_exemptions: "[ETH_GetTaxExemptionTitle]"
 ETH_expand_tax_exemptions_desc: "[ETH_GetTaxExemptionDesc]"
 ETH_expand_tax_exemptions_tt: "ปรับ §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! โดย:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §R-5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R-5%§!"
 ETH_reform_the_currency: "ปฏิรูปเงินตรา"
 ETH_reform_the_currency_desc: "แมธนบัตร [ETH.GetAdjective] จะหมุนเวียนมากขึ้นในชวงไมกี่ปที่ผานมา แตหลายคนยังนิยมใชเงินตราของชาติอื่นในการคาขายใน [ETH.GetName] เราจําเปนตองปฏิรูปเงินเบอรใหเปนที่ยอมรับมากขึ้นทั้งในประเทศและตางประเทศ"
 ETH_increased_factory_output: "เพิ่มผลผลิตของโรงงาน"
 ETH_increased_factory_output_desc: "เมื่อโลกดูอันตรายขึ้นเรื่อย ๆ เราจําเปนตองใหโรงงานเพิ่มการผลิตยุทโธปกรณ เพื่อใหกองทัพยังคงเปนเครื่องยับยั้งที่นาเกรงขามตอผูรุกรานตางชาติ"
 ETH_increased_factory_output_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+10%§!"
 ETH_adapt_and_improve: "ปรับตัวและพัฒนา"
 ETH_adapt_and_improve_desc: "ดวยการปรึกษากับกองทัพ ผูนําภาคอุตสาหกรรมจะไดความรูวาสิ่งใดจําเปนจริง ๆ ในสนามรบ และสงตอขอมูลนี้ใหวิศวกรของตน วิธีนี้จะปองกันไมใหยุทโธปกรณที่ไมเหมาะสมถูกสงไปถึงทหาร และชวยใหทหารเสนอแนะการปรับปรุงไดอยางรวดเร็ว"
 ETH_adapt_and_improve_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_LAND_EQUIPMENT_UPGRADE_XP_COST$: §G-25%§!\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-25%§!"
 ETH_the_state_court: "ศาลแหงรัฐ"
 ETH_the_state_court_desc: "ระบบกฎหมายของ [ETH.GetName] หยั่งรากอยูในธรรมเนียมโบราณที่ยอนไปหลายศตวรรษ ดวยคลื่นการปฏิรูปลาสุดของเรา บัดนี้ถึงเวลาที่เหมาะสมที่จะประมวลกฎหมายใหสอดคลองกับรัฐธรรมนูญมากขึ้น และจัดตั้งศาลแหงรัฐสมัยใหมเพื่อพิจารณาคดีที่มีความสําคัญระดับชาติ"
 ETH_the_state_court_tt: "ปรับ §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! โดย:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+10%§!"
 ETH_ethiopian_shipbuilding: "การตอเรือของ [ROOT.GetAdjective]"
 ETH_ethiopian_shipbuilding_desc: "เมื่อเรามีทาเรือของเราเองแลว ก็ควรวางรากฐานสําหรับการสรางและบํารุงรักษากองทัพเรือของเราเอง เรายอมตองมีเรือของตนเองอยางไมตองสงสัย หากตองการรักษาการเขาถึงเสนทางเดินเรือของโลก"
 ETH_connecting_the_south: "เชื่อมตอภาคใต"
 ETH_connecting_the_south_desc: "พื้นที่ทางใตของ [ETH.GetName] ถูกตัดขาดจากภูมิภาคเมืองหลวงดวยภูมิประเทศที่เปนภูเขา เพื่อผนวกพื้นที่นี้เขากับเศรษฐกิจที่กําลังขยายตัวอยางรวดเร็วของเราอยางสมบูรณ เราจําเปนตองเชื่อมตอดวยทางรถไฟสูใจกลางอุตสาหกรรม"
 ETH_bomb_proofing: "ปองกันการทิ้งระเบิด"
 ETH_bomb_proofing_desc: "การรักษากําลังการผลิตทางอุตสาหกรรมใหเพียงพอตอการสนับสนุนกองทัพสมัยใหมเปนสิ่งสําคัญยิ่งในยามสงคราม ดวยเหตุนี้ สงครามทางอากาศนาจะมีบทบาทชี้ขาดในความขัดแยงใด ๆ ในอนาคต เมื่ออากาศยานมุงโจมตีใจกลางอุตสาหกรรมของชาติศัตรู ดังนั้นเราตองทําใหแนใจวาโรงงานของเราจะรอดพนจากการโจมตีเชนนั้นได"
 ETH_bomb_proofing_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$: §G-10%§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!"
 ETH_rapid_industrial_expansion: "ขยายอุตสาหกรรมอยางรวดเร็ว"
 ETH_rapid_industrial_expansion_desc: "แมประชาชนในแนวหลังจะทุมเทอยางกลาหาญ แตเรายังตองการกําลังการผลิตทางอุตสาหกรรมมากกวานี้ หากตองการรอดพนจากการยึดครองของตางชาติ ดังนั้นเราจะเรงแผนเศรษฐกิจและมุงขยายอุตสาหกรรมใหรวดเร็วยิ่งขึ้น"
 ETH_rapid_industrial_expansion_tt: "ปรับ §Y$ETH_industrialization_dynamic_modifier$§! โดย:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_develop_the_horn_of_africa: "พัฒนาจะงอยแอฟริกา"
 ETH_develop_the_horn_of_africa_desc: "จะงอยแอฟริกามีผูคน ทรัพยากร และศักยภาพมากมาย หากเรารวมมือกับรัฐบาลในภูมิภาคในประเด็นทางเศรษฐกิจ เราจะเริ่มใชศักยภาพนั้นในทางที่เปนประโยชนรวมกันได"
 ETH_develop_the_horn_of_africa_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อพัฒนาประเทศเอกราชหรือรัฐในอารักขาของ [ROOT.getAdjective] ในจะงอยแอฟริกา และอาจผนวกรวมประเทศเหลานั้น"
 ETH_horn_of_africa_tt: "ปลดล็อก§Yการตัดสินใจ§!เพื่อกอตั้งจะงอยแอฟริกา"
 ETH_invest_tt: "ปลดล็อก§Yการตัดสินใจ§!ดานการลงทุนในรัฐ"
 ETH_invest_in_the_north: "ลงทุนในภาคเหนือ"
 ETH_invest_in_the_north_desc: "การผลิตเครื่องจักรเริ่มเกิดขึ้นทางตอนเหนือของ [ETH.GetName] เราควรสนับสนุนการพัฒนานี้ดวยการลงทุนเพิ่มขึ้น เพื่อชวยขยายอุตสาหกรรมที่กําลังเติบโตนี้"
 ETH_invest_in_the_east: "ลงทุนในภาคตะวันออก"
 ETH_invest_in_the_east_desc: "ดวยการลงทุนในภาคตะวันออก เราจะใชประโยชนจากเครือขายการคาเกาแกของภูมิภาค และเปลี่ยนพื้นที่ใหเปนศูนยกลางอุตสาหกรรมสําหรับแปรรูปทรัพยากรของ [ETH.GetName] พรอมสงออก"
 ETH_invest_in_the_west: "ลงทุนในภาคตะวันตก"
 ETH_invest_in_the_west_desc: "ภูมิภาคตาง ๆ ของ [ETH.GetName] เขาถึงทรัพยากรที่หลากหลาย ดวยการลงทุนในภาคตะวันตก เราจะเรงการพัฒนาอุตสาหกรรมเครื่องนุงหมไดอยางรวดเร็ว และใชประโยชนจากความเชี่ยวชาญที่มีอยูแลวในดานนี้"
 ETH_expand_the_coffee_industry: "ขยายอุตสาหกรรมกาแฟ"
 ETH_expand_the_coffee_industry_desc: "ผูคนทั่วโลกที่ตองการกาแฟมีอยูไมขาดสาย ในฐานะหนึ่งในแหลงหลักของเครื่องดื่มกระตุนแสนอรอยนี้ เราควรใชประโยชนจากความตองการนี้ดวยการลงทุนในอุตสาหกรรมกาแฟและเพิ่มการสงออก "
 ETH_modernizing_the_industry: "ปรับปรุงอุตสาหกรรมใหทันสมัย"
 ETH_modernizing_the_industry_desc: "เราไดกาวหนาอยางมากในการเพิ่มกําลังการผลิตทางอุตสาหกรรมในชวงไมกี่ปที่ผานมา อยางไรก็ตาม งานนี้ตองดําเนินตอไปเรื่อย ๆ เมื่อความตองการของเศรษฐกิจเปลี่ยนไปและมีวิธีการผลิตใหม ๆ เกิดขึ้น ดังนั้นเราจะมุงนําไฟฟาและการพัฒนาทางอุตสาหกรรมอื่น ๆ ไปสูทั่วทั้ง [ETH.GetName] และสานตอการปรับปรุงเศรษฐกิจใหทันสมัย"
 ETH_modernizing_the_industry_tt: "สําหรับทุกรัฐในภูมิภาคที่ไดรับการลงทุน:\n เพิ่ม §G1§! §Yชองอาคาร§!\nหนึ่งรัฐในแตละภูมิภาคที่ไดรับการลงทุน:\n เพิ่ม §G1§! §Y$industrial_complex$§!"
 ETH_animal_husbandry: "การเลี้ยงสัตว"
 ETH_animal_husbandry_desc: "มาและอูฐยังคงมีบทบาทสําคัญในการกระจายสินคาและการขนสงผูคนทั่ว [ETH.GetNameDef] เราควรเพิ่มการลงทุนในการเลี้ยงสัตว เพื่อใหแนใจวาจํานวนและคุณภาพของสัตวเหลานี้จะไมลดลง"
 ETH_ethiopian_industrial_research_institute: "สถาบันวิจัยอุตสาหกรรม[ROOT.GetAdjective]"
 ETH_ethiopian_industrial_research_institute_desc: "หากเราไมตองการตามหลังชาติอื่นทางอุตสาหกรรมอยูหนึ่งกาวเสมอ เราตองปรับปรุงสถาบันวิจัยภายในประเทศ ดวยวิธีนี้ เราจะเริ่มสรางนวัตกรรมของเราเองแทนการนําเขาความคิดจากตางประเทศ"
 ETH_invite_foreign_prospectors: "เชิญนักสํารวจแรตางชาติ"
 ETH_invite_foreign_prospectors_desc: "แทนที่จะพยายามลอกเลียนความกาวหนาทางการวิจัยจากตางประเทศ เราควรใชความเชี่ยวชาญของรัฐบาลและภาคธุรกิจตางชาติ เพื่อชวยใหเราใชประโยชนจากทรัพยากรธรรมชาติอันอุดมสมบูรณไดดียิ่งขึ้น"
 ETH_invite_foreign_prospectors_tt: "ปลดล็อกการตัดสินใจ §Y$ETH_prospect_for_resources$§! ใน [ROOT.GetName] ตอนเหนือ ตองมี §Y$excavation2$§! และ§Yโรงงานพลเรือน§!วางมากกวา §Y2§! แหงจึงจะใชการตัดสินใจสํารวจแรได\n\n"
 ETH_invite_foreign_industrialists: "เชิญ[ETH_GetInvestorName]ตางชาติ"
 ETH_invite_foreign_industrialists_desc: "เราไดปรับปรุงโครงสรางพื้นฐานและอุตสาหกรรมอยางมหาศาลในชวงไมกี่ปที่ผานมา ทําใหการใชทรัพยากรธรรมชาติมีประสิทธิภาพมากขึ้นอยางยิ่ง อยางไรก็ตาม เราสามารถเรงการพัฒนาอุตสาหกรรมไดดวยการเชิญผูเชี่ยวชาญและนักอุตสาหกรรมตางชาติมาดําเนินงานใน [ETH.GetName]"
 ETH_invite_foreign_industrialists_tt: "ผูออกแบบจากชาติอื่นจะพรอมใชงาน หากประเทศเปาหมายมี§Yความเห็นตอ [ETH.GetFlag][ETH.GetNameDef] สูงกวา§! §G75§! \n\n§Rผูออกแบบที่เลือกไวจะถูกปดใชงาน หากประเทศบานเกิดของพวกเขาทําสงครามกับ [ETH.GetNameDef]!§! \n\nประเทศที่เปนไปได ไดแก: §Y[ENG.GetFlag][ENG.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§!, §Y[GER.GetFlag][GER.GetName]§!, §Y[JAP.GetFlag][JAP.GetName]§!, §Y[CZE.GetFlag][CZE.GetName]§!, §Y[SWE.GetFlag][SWE.GetName]§!"
 ETH_the_second_italo-ethiopian_war: "สงครามอิตาลี-เอธิโอเปยครั้งที่สอง"
 ETH_the_second_italo-ethiopian_war_desc: "การรุกวันคริสตมาสไมไดนําชัยชนะที่เราหวังและตองการมาให ถึงเวลาที่ [ETH.GetLeader] ตองเสด็จออกจากเมืองหลวงและบัญชาการกองทัพดวยพระองคเอง สงครามกับชาวอิตาลีตองยุติลงใหได!"
 ETH_the_second_italo-ethiopian_war_tt: "§Y$ETH_haile_selassie$§! พรอมรับตําแหนงจอมพล"
 ETH_renewed_offensive: "รุกใหมอีกครั้ง"
 ETH_renewed_offensive_desc: "ชาวอิตาลีอาจกําลังพยายามชวงชิงความริเริ่มกลับคืน แตนั่นหมายความวาพวกเขาไมไดคาดคิดวากองกําลังของเราจะโจมตี แทนที่จะเพียงยันไว เราควรนําการรบไปหาพวกเขา"
 ETH_renewed_offensive_tt: "การโจมตีของทหารราบ §G+10%§!\nการโจมตีของทหารราบนอกแบบ §G+10%§!\nการปองกันของกองพล §R-5%§!"
