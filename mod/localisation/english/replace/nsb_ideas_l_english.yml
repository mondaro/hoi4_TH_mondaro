 SOV_purged_junior_army_officers_1: "กวาดลางนายทหารชั้นผูนอยของกองทัพบก"
 SOV_purged_junior_army_officers_1_desc: "นายทหารชั้นผูนอยของกองทัพบกจํานวนมากถูก NKVD จับกุมในขอหาปลุกปน กอวินาศกรรม และมีแนวคิดตอตานโซเวียต การสูญเสียนายทหารผูมีประสบการณและทหารผานศึกจากสงครามในอดีตจํานวนมากเชนนี้ทําใหกองทัพแดงตกอยูในความระสํ่าระสายอยางอันตราย"
 SOV_anti_soviet_military_thinking_banned_navy: "หามแนวคิดทางทหารที่ตอตานโซเวียต"
 SOV_anti_soviet_military_thinking_banned_navy_desc: "การศึกษาและการอภิปรายเอกสารและแนวคิดของนักทฤษฎีที่เสื่อมเสียและหัวปฏิกิริยา บัดนี้เปนสิ่งตองหามสําหรับนายทหารกองทัพเรือในโรงเรียนนายเรือ และผูสําเร็จการศึกษาใหมจะถูกตรวจสอบอยางถี่ถวน เพื่อใหแนใจวาไมมีศัตรูของประชาชนคนใดเขามาในกองเรือแดงได"
 SOV_shipyard_staff_purged: "กวาดลางเจาหนาที่อูตอเรือ"
 SOV_shipyard_staff_purged_desc: "หลังการสอบสวนครั้งใหญในขอกลาวหาหลายกรณีเกี่ยวกับการกอวินาศกรรมและกิจกรรมนาสงสัยอื่น ๆ ในกองทัพเรือ NKVD ไดจับกุมผูคนจํานวนมาก ทําใหอูตอเรือและฐานทัพเรือบางแหงขาดแคลนบุคลากรอยางหนัก"
 SOV_purged_junior_navy_officers_1: "กวาดลางนายทหารชั้นผูนอยของกองทัพเรือ"
 SOV_purged_junior_navy_officers_1_desc: "นายทหารชั้นผูนอยของกองทัพเรือจํานวนมากถูก NKVD จับกุมในขอหาปลุกปน กอวินาศกรรม และมีแนวคิดตอตานโซเวียต การสูญเสียนายทหารผูมีประสบการณและทหารผานศึกจากสงครามในอดีตจํานวนมากเชนนี้ทําใหกองเรือแดงตกอยูในความระสํ่าระสายอยางอันตราย"
 SOV_anti_soviet_military_thinking_banned_airforce: "หามแนวคิดทางทหารที่ตอตานโซเวียต"
 SOV_anti_soviet_military_thinking_banned_airforce_desc: "การศึกษาและการอภิปรายเอกสารและแนวคิดของนักทฤษฎีที่เสื่อมเสียและหัวปฏิกิริยา บัดนี้เปนสิ่งตองหามสําหรับนายทหารกองทัพอากาศในโรงเรียนนายเรืออากาศ และผูสําเร็จการศึกษาใหมจะถูกตรวจสอบอยางถี่ถวน เพื่อใหแนใจวาไมมีศัตรูของประชาชนคนใดเขามาในกองทัพอากาศโซเวียตได"
 SOV_ground_based_training: "การฝกภาคพื้นดิน"
 SOV_ground_based_training_desc: "หลังจากมีรายงานเครื่องบินตกและอุบัติเหตุหลายครั้งระหวางการฝกซอม NKVD ไดเริ่มตรวจสอบกองทัพอากาศ และตามคําสั่งของเจาหนาที่ที่ไดรับมอบหมายคดีนี้ จะไมมีการฝกบินอีกจนกวาการสอบสวนจะเสร็จสิ้น"

