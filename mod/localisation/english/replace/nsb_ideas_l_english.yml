 SOV_popular_speeches_poum_desc: "ดวยความชวยเหลือจากองคกรทองถิ่นและสมาชิกผูมีอิทธิพลของฝายคานตอตานสตาลินในตางแดน เรากําลังดําเนินการรณรงคใหขอมูลและปลุกระดมครั้งใหญในดินแดนที่เราควบคุม เพื่อจุดไฟแหงการปฏิวัติในหมูมวลชนขึ้นอีกครั้ง"
 SOV_agents_in_the_stalinist_command_poum: "สายลับในกองบัญชาการสตาลินนิสต"
 SOV_agents_in_the_stalinist_command_poum_desc: "ฝายคานขวาโซเวียตสามารถแทรกซึมสายลับหลายคนเขาไปในที่ปรึกษาทางทหารชุดลาสุดที่ [SOU.GetLeader] สงไปยังสาธารณรัฐสเปน สายลับเหลานี้ไดสรางเครือขายผูใหขอมูลที่ชวยใหเรารูแผนการของศัตรูกอนที่จะลงมือ"
 
 SOV_organized_wreckers_idea: "ผูบอนทําลาย"
 SOV_organized_wreckers_idea_desc: "ศัตรูของรัฐไดเกณฑผูบอนทําลายจากชนชั้นแรงงาน ซึ่งกําลังกอกวนอุตสาหกรรมสําคัญ ทําใหการผลิตบรรลุเปาหมายไดยากขึ้น"
 SOV_organized_wreckers_idea_tt: "ศัตรูสามารถปฏิบัติภารกิจกอวินาศกรรมได"
 SOV_arms_purchases_idea: "การจัดซื้ออาวุธ"
 SOV_arms_purchases_idea_desc: "การติดอาวุธใหฝายคานโซเวียตจะทําใหเราเสียคาใชจายอยูบาง แตในระยะยาวผลตอบแทนจะคุมคากวาตนทุนชั่วคราวนี้มาก"
 SOV_covert_military_buildup_idea: "การเสริมสรางกําลังทหารอยางลับ ๆ"
 SOV_covert_military_buildup_idea_desc: "ขณะนี้เรากําลังชวยเหลือฝายคานโซเวียตอยางลับ ๆ ดวยการตั้งโรงงานผลิตอาวุธและกระสุนลับ"
 SOV_covert_ukrainian_military_buildup_idea: "การฝกกองกําลังอาสายูเครนอยางลับ ๆ"
 SOV_covert_ukrainian_military_buildup_idea_desc: "เรากําลังใชคายฝกลับฝกกองกําลังอาสายูเครน เพื่อกอการลุกฮือตอตานพวกสตาลินนิสต"
 SOV_the_fourth_international_idea: "สากลที่สี่"
 SOV_the_fourth_international_idea_desc: "ในฐานะผูนําที่แทจริงของสากล บัดนี้เราสามารถชี้นําอุดมการณคอมมิวนิสตทั่วโลกไดแลว"

 SOV_foreign_funds_idea: "เงินทุนจากตางชาติ"
 SOV_foreign_funds_idea_desc: "เงินบริจาคอยางเอื้อเฟอจากบุคคลและองคกรตางชาติชวยเปนทุนใหการปฏิวัติของเรา"
 SOV_support_from_farmers: "การสนับสนุนจากเกษตรกรเจาของที่ดิน"
 SOV_support_from_farmers_desc: "เมื่อไดรับการสนับสนุนจากเกษตรกรแลว เราจะสนับสนุนกองทัพของเราไดดียิ่งขึ้น"
 SOV_system_decentralization_idea: "การกระจายอํานาจของระบบ"
 SOV_system_decentralization_idea_desc: "อํานาจถูกโยกออกจากโปลิตบูโรโดยรวมและจากเลขาธิการโดยเฉพาะ กลับคืนสูตัวพรรคเอง"
 SOV_the_local_soviets_idea: "โซเวียตทองถิ่น"
 SOV_the_local_soviets_idea_desc: "โซเวียตระดับภูมิภาคและทองถิ่นไดรับอํานาจบางสวนคืนมา ทําใหสามารถตัดสินใจในเรื่องเรงดวนของตนไดงายขึ้น แลกกับการที่โปลิตบูโรสูญเสียการควบคุมทางการเมืองไปบาง"
 SOV_strong_trade_unions_idea: "สหภาพแรงงานที่เขมแข็ง"
 SOV_strong_trade_unions_idea_desc: "สหภาพแรงงานที่เขมแข็งหมายความวาคนงานมีอิทธิพลตอการผลิตไดมากขึ้น"
 SOV_the_peoples_revolution_idea: "การปฏิวัติของประชาชน"
 SOV_the_peoples_revolution_idea_desc: "การปฏิวัติตองขับเคลื่อนโดยประชาชนจึงจะประสบความสําเร็จอยางแทจริง"
 SOV_puppet_international_of_soviet_republics_idea: "สาธารณรัฐโซเวียตสากล"
 SOV_puppet_international_of_soviet_republics_idea_desc: "การเปนสวนหนึ่งของสิ่งที่ยิ่งใหญกวาเปนประโยชนมหาศาลตอประเทศของเรา"

 SOV_support_of_the_peasants_idea: "การสนับสนุนจากชนชั้นชาวนา"
 SOV_support_of_the_peasants_idea_desc: "การสนับสนุนอยางแข็งขันจากเกษตรกรทั่วประเทศทําใหเราสามารถเกณฑและดํารงกองทัพที่ใหญขึ้นได"
 SOV_curtailment_collective_farms_idea: "การลดขนาดนารวม"
 SOV_curtailment_collective_farms_idea_desc: "ฟารมขนาดเล็กและขนาดกลางใหผลผลิตมีประสิทธิภาพสูงกวาฟารมขนาดใหญมาก"
 SOV_administrative_reforms_idea: "การปฏิรูปการบริหาร"
 SOV_administrative_reforms_idea_desc: "การบริหารแบบโซเวียตเดิมถูกถวงดวยความไรประสิทธิภาพ สวนหนึ่งเพราะขนาดที่ใหญโต แตสาเหตุหลักคือกลไกควบคุมที่เขมงวดเกินไป เพียงลดทอนลงเล็กนอยก็ไดประโยชนมากมาย"
 SOV_local_organizations_idea: "องคกรทองถิ่น"
 SOV_local_organizations_idea_desc: "การดึงองคกรทองถิ่นเขามามีสวนในการปกครองประเทศไดดียิ่งขึ้น ทําใหเราเขาถึงคนเกงทุกคนที่มีอยูในประเทศนี้"
 SOV_enemies_of_the_people_idea: "ศัตรูของประชาชน"
 SOV_enemies_of_the_people_idea_desc: "ยอมมีผูที่ตองการโคนลมรัฐบาลของประชาชนอยูเสมอ เราตองเฝาระวังภัยคุกคามทั้งจากภายในและภายนอกอยางไมลดละ"
 SOV_soviet_hegemony_idea: "ความเปนเจาโลกของโซเวียต"
 SOV_soviet_hegemony_idea_desc: "ระบอบการปกครองของเราไดพิสูจนแลววาเหนือกวาระบอบอื่นทั้งปวง เราตองใชโอกาสนี้เผยแพรแนวคิดของเรา เพื่อปลุกใหตื่นรูทั้งผูที่ถูกกดขี่ภายใตระบอบอื่น และผูที่โชคดีไดเปนสวนหนึ่งของสหภาพ"

 SOV_fascist_womens_movement_idea: "ขบวนการสตรีฟาสซิสต"
 SOV_fascist_womens_movement_idea_desc: "หัวใจของขบวนการชาตินิยมคือสตรี[ROOT.GetAdjective] ทั้งมารดา ภรรยา และบุตรสาวของเหลาทหารผูกลา ที่รวมตัวกันพรอมสนับสนุนการตอสูเพื่อความยิ่งใหญ"
 SOV_the_true_tsars_idea: "ซารที่แทจริง"
 SOV_the_true_tsars_idea_desc: "ซารคือผูนําโดยชอบธรรมของ [ROOT.GetNameDef] การรวมพลังอยูเบื้องหลังซาร แทนที่จะเปนบุคคลหรืออุดมการณอื่น ชวยดึงดูดผูสนับสนุนมาสูอุดมการณของเราไดมากขึ้น"

