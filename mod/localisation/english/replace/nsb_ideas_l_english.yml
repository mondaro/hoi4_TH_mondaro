 SOV_factionalism_modifier: "การแบงฝกแบงฝาย"
 SOV_factionalism_modifier_tt: "§Lการแบงฝกแบงฝายภายในพรรคเปนปญหามาโดยตลอด และเมื่อฝายคานสงเสียงดังขึ้น ความเห็นที่แตกตางก็ทําใหพรรคทํางานไดไมมีประสิทธิภาพ อยางไรก็ตาม หากจัดการอยางเหมาะสม ความเห็นตางก็อาจกลายเปนจุดแข็งแทนที่จะเปนจุดออนในระยะยาว§!\n\n"

 SOV_opposition_popular_support: "ประชาชนสนับสนุนฝายคาน"
 SOV_opposition_popular_support_tt: "§Lเมื่อสมาชิกพรรคและมติมหาชนสวนใหญสนับสนุนฝายคาน การดําเนินสงครามที่กําลังพายแพตอไปก็ยากลําบากยิ่งขึ้นมาก§!\n\n"

 SOV_workers_government_idea: "รัฐบาลของกรรมกร"
 SOV_workers_government_idea_desc: "รัฐบาลของกรรมกรจงเจริญ ชนชั้นปกครองถูกโคนลงจากอํานาจแลว กรรมกรกลับมาปกครองประเทศอีกครั้ง"
 SOV_revolutionary_spirit_idea: "จิตวิญญาณแหงการปฏิวัติ"
 SOV_revolutionary_spirit_idea_desc: "ชัยชนะเหนือสตาลินไดจุดไฟความกระตือรือรนในการปฏิวัติขึ้นอีกครั้ง ถึงเวลาแลวที่จะนําเปลวไฟแหงการปฏิวัติไปสูกรรมกรทั่วโลก"

 SOV_trotskyist_revolutionary_agitation: "การปลุกระดมปฏิวัติของพวกทรอตสกี"
 SOV_trotskyist_revolutionary_agitation_desc: "ผูเห็นใจทรอตสกีและกลุมคอมมิวนิสตอื่น ๆ ที่ฝกใฝพรรคบอลเชวิค[SOV.GetAdjective] กําลังปลุกปนมวลชน[ROOT.GetAdjective] เผยแพรอุดมการณมารกซิสตในหมูชนชั้นแรงงาน และเรียกรองใหลุกขึ้นตอสูดวยอาวุธตอรัฐบาลของเรา"
 SOV_trotskyist_revolutionary_agitation_tt: "การเปดใชการตัดสินใจ §Y$ban_communist_party$§! จะลดผลกระทบของจิตวิญญาณแหงชาตินี้"
 SOV_politicized_military: "กองทัพที่ถูกทําใหเปนการเมือง"
 SOV_politicized_military_desc: "ผูแทนการเมืองประจํากองทัพมักกลาวสุนทรพจนเชิงอุดมการณอยางรอนแรงและจัดการอภิปรายทางการเมืองในหมูทหาร แตหลายครั้งก็ยุงกับงานธุรการมากเกินไป ตรวจสอบนายทหารอยางเขมงวดเกินเหตุ และถึงขั้นขัดขวางคําสั่งของผูบังคับหนวย"
 SOV_politicized_military_swap: "ที่ปรึกษาการเมืองประจํากองทัพ"
 SOV_politicized_military_swap_desc: "แมเราไมควรปลอยใหการเมืองมากําหนดการตัดสินใจทางทหาร แตเราก็ยังตองแนใจวาไดคํานึงถึงขอพิจารณาทางการเมืองเหลานี้แลวเมื่อตัดสินใจ"
 SOV_politicized_military_battle_priests: "นักบวชสนามรบในกองทัพ"
 SOV_politicized_military_battle_priests_desc: "คณะนักบวชไดรับบทบาทเปนนักบวชสนามรบประจําหนวยทหารของเรา มีหนาที่รักษาขวัญกําลังใจของทหารใหสูงอยูเสมอ และทําใหทหารมั่นใจวาศาสนจักรและพระเจาอยูขางเรา"
 SOV_for_the_common_good_allies: "เพื่อประโยชนสวนรวม"
 SOV_for_the_common_good_allies_desc: "ทุกการตัดสินใจของเราหรือพันธมิตรตองมุงกาวไปขางหนาสูประโยชนสวนรวม"
 SOV_for_the_common_good_subjects: "$SOV_for_the_common_good_allies$"
 SOV_for_the_common_good_subjects_desc: "ทุกการตัดสินใจของพันธมิตรเรามุงกาวไปขางหนาสูประโยชนสวนรวม ดังนั้นเราตองสนับสนุนการตัดสินใจเหลานี้และปฏิบัติตามแนวทางที่ไดรับ แมการเสียสละของเราจะยังไมเห็นผลดีขึ้นในทันทีก็ตาม"

