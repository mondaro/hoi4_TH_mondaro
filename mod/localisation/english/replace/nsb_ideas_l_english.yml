l_english:
 independent_air_force_spirit: "กองทัพอากาศอิสระ"
 independent_air_force_spirit_desc: "กองทัพอากาศเปนเหลาทัพอิสระ และมีความสําคัญไมแพกองทัพบกหรือกองทัพเรือ"
 industrial_destruction_spirit: "การทําลายอุตสาหกรรม"
 industrial_destruction_spirit_desc: "เครื่องบินทิ้งระเบิด 1000 ลําสามารถเปลี่ยนทิศทางของสงครามไดในการโจมตีเพียงครั้งเดียว"
 dive_bombing_spirit: "การทิ้งระเบิดแบบดิ่ง"
 dive_bombing_spirit_desc: "จัดการเรือบรรทุกเครื่องบินไปหนึ่งลํา"
 material_destruction_spirit: "การทําลายยุทธภัณฑ"
 material_destruction_spirit_desc: "การทําลายยุทโธปกรณและตัดเสนทางคมนาคมของศัตรูจะนําชัยชนะมาไดเร็วกวาการสรางความสูญเสียไมวาจะมากเพียงใด"
 air_modernizers_spirit: "ผูปรับปรุงกองทัพอากาศใหทันสมัย"
 air_modernizers_spirit_desc: "ผานมาไมนานนักตั้งแต Fokker E.III เปนเครื่องบินขับไลที่ดีที่สุดในโลก สิ่งตาง ๆ เปลี่ยนแปลงเร็ว"
 industry_liasons_spirit: "ผูประสานงานอุตสาหกรรม"
 industry_liasons_spirit_desc: "มีเพียงความรวมมืออยางราบรื่นระหวางอุตสาหกรรมอากาศยาน กองทัพ และรัฐบาลเทานั้นที่จะรับประกันคุณภาพสูงสุด"
 air_crew_surveys_spirit: "การสํารวจความเห็นลูกเรืออากาศยาน"
 air_crew_surveys_spirit_desc: "ทายที่สุดแลว พวกเขาคือผูใชยุทโธปกรณ แลวทําไมไมถามพวกเขาละ?"
 maritime_patrol_spirit: "การลาดตระเวนทางทะเล"
 maritime_patrol_spirit_desc: "ถามันลอยนํ้าได เราก็หามันเจอ"
 long_range_patrol_spirit: "การลาดตระเวนพิสัยไกล"
 long_range_patrol_spirit_desc: "ครองนานฟาที่หางไกลจากบาน"
 efficient_ground_crews_spirit: "จิตวิญญาณเจาหนาที่ภาคพื้นที่มีประสิทธิภาพ"
 efficient_ground_crews_spirit_desc: "นักบินเอซก็ดีอยูหรอก แตสิ่งที่สําคัญจริง ๆ คือการพาเครื่องบินขึ้นฟาใหเร็วที่สุดเทาที่จะทําได"
 effective_training_programs_spirit: "โครงการฝกที่มีประสิทธิผล"
 effective_training_programs_spirit_desc: "ไมมีอะไรเหนือกวาการศึกษาที่ดี"
 branch_independence_spirit: "จิตวิญญาณเหลาทัพอิสระ"
 branch_independence_spirit_desc: "ไมมีทหารบกหรือทหารเรือคนไหนมาสั่งเราได เราทําตามวิถีของเรา"
 air_theory_spirit: "จิตวิญญาณทฤษฎีการรบทางอากาศ"
 air_theory_spirit_desc: "การรบทางอากาศมีหลักวิทยาศาสตรของมัน"
 subservience_to_army_spirit: "ขึ้นตรงตอกองทัพบก"
 subservience_to_army_spirit_desc: "ลักษณะงานงาย ๆ จริง ๆ คือทิ้งระเบิดตรงที่นายพลสั่งใหทิ้ง"
 subservience_to_navy_spirit: "ขึ้นตรงตอกองทัพเรือ"
 subservience_to_navy_spirit_desc: "อากาศยานมีประโยชนจริง ๆ แคเปนอาวุธสนับสนุนทางเรือและการลาดตระเวนเทานั้น"
 no_focus_on_training_spirit: "ไมเนนการฝก"
 no_focus_on_training_spirit_desc: "ฝกซอม? จะทําไปทําไม? นี่มันงายจะตาย! แถมยังประหยัดเชื้อเพลิงดวย"
 disorganized_ground_crews_spirit: "เจาหนาที่ภาคพื้นไรระเบียบ"
 disorganized_ground_crews_spirit_desc: "เจาหนาที่ภาคพื้น? พวกเขาเปนใคร? ทําไมตองสนใจพวกเขาดวย?"
 conflicting_branches_spirit: "เหลาทัพขัดแยงกัน"
 conflicting_branches_spirit_desc: "แตพวกเขาบอกวา..."
 elite_fighter_pilots_spirit: "นักบินขับไลชั้นยอด"
 elite_fighter_pilots_spirit_desc: "จําไวนะหนุม ๆ ที่สองไมมีแตมให"
 long_range_navigation_spirit: "การนํารองพิสัยไกล"
 long_range_navigation_spirit_desc: "พวกมันวิ่งได แตซอนไมพน"
 dogfighting_training_spirit: "การฝกรบประชิดทางอากาศ"
 dogfighting_training_spirit_desc: "นั่นไมใชทาอิมเมลมันน นั่นแคครึ่งลูป"
 expert_marksmen_spirit: "พลแมนปนผูเชี่ยวชาญ"
 expert_marksmen_spirit_desc: "หัวใจสําคัญคือรูวาจะเล็งตรงไหนและเหนี่ยวไกเมื่อไร"
 battlefield_air_interdiction_spirit: "การสกัดกั้นทางอากาศในสนามรบ"
 battlefield_air_interdiction_spirit_desc: "ความรวมมืออยางใกลชิดระหวางกําลังทางอากาศและภาคพื้นดิน"
 cag_night_fighting_spirit: "การรบกลางคืนของกองบินประจําเรือ"
 cag_night_fighting_spirit_desc: "คิดวาแคบินในความมืดก็ยากแลวเหรอ? ลองลงจอดบนเรือบรรทุกเครื่องบินกลางดึกดูสิ!"
 veteran_air_instructors_spirit: "ครูการบินผูชํ่าชอง"
 veteran_air_instructors_spirit_desc: "ใหคนเกงที่สุดฝกคนที่เหลือ"
 steel_wings_steel_hearts_spirit: "ปกเหล็ก ใจเหล็ก"
 steel_wings_steel_hearts_spirit_desc: "ตองใชความกลาหาญแบบพิเศษในการทําสงครามที่ความสูง 10,000 ฟุต\n\n§Gจิตวิญญาณนี้ใชไดเพราะอุดมการณของเรา§!"
 home_defence_spirit: "วีรบุรุษแหงเวหา"
 home_defence_spirit_desc: "ทองฟาอันกวางใหญไพศาลเปยมดวยโอกาสมากมายสําหรับผูที่ตองการสรางตํานาน"
 centralized_control_spirit: "การควบคุมแบบรวมศูนย"
 centralized_control_spirit_desc: "การบริหารทรัพยากรอยางมีประสิทธิภาพทําใหเครื่องบินไปถึงพื้นที่ที่ตองการมากที่สุดได"
 air_power_projection_spirit: "การแผขยายแสนยานุภาพทางอากาศ"
 air_power_projection_spirit_desc: "การรบไกลบานตองอาศัยความกลาบาบิ่นเปนพิเศษ"
 massed_strike_spirit: "การโจมตีแบบรวมกําลัง"
 massed_strike_spirit_desc: "การกอกวนกําลังภาคพื้นดินของขาศึกคือหนทางที่ดีที่สุดในการเอาชนะพวกมัน"
 continuous_strike_spirit: "การโจมตีตอเนื่อง"
 continuous_strike_spirit_desc: "การทําลายยุทโธปกรณสําคัญของขาศึกเปนเรื่องจําเปนยิ่ง"
 strategic_strike_spirit: "การทําลายลางสิ้นซาก"
 strategic_strike_spirit_desc: "การโจมตีทางยุทธศาสตรขนาดมหึมาใสใจกลางดินแดนหลักของขาศึกจะบดขยี้ความสามารถในการรบของพวกมัน"
 duelling_obsession_spirit: "หมกมุนกับการดวล"
 duelling_obsession_spirit_desc: "การสูกันตัวตอตัวคือวิธีรบบนฟาเพียงหนึ่งเดียวที่มีเกียรติและสมเปนสุภาพบุรุษ"
 lax_safety_regulations_spirit: "กฎความปลอดภัยหละหลวม"
 lax_safety_regulations_spirit_desc: "ก็นะ ไมมีใครทําตามคูมือจริง ๆ อยูแลว แลวจะมีไปทําไมละ?"
 officers_clique_spirit: "กลุมกอนนายทหาร"
 officers_clique_spirit_desc: "ถึงจะเปนนักบิน แตก็ยังเปนแคพลทหารอยูดีใชไหมละ?"
 not_worth_the_risk_spirit: "ไมคุมเสี่ยง"
 not_worth_the_risk_spirit_desc: "รูไหมวาเครื่องบินมันแพงมากนะ"

 merchant_mariners_spirit: "ชาวเรือพาณิชย"
 merchant_mariners_spirit_desc: "การเดินเรือเปนสิ่งที่อยูในสายเลือดของเรา"
 naval_wargames_spirit: "การฝกจําลองยุทธนาวี"
 naval_wargames_spirit_desc: "การฝกยุทธวิธีภาคทฤษฎีชวยรักษาทั้งชีวิตและเชื้อเพลิง"
 instilled_aggression_spirit: "ปลูกฝงความดุดัน"
 instilled_aggression_spirit_desc: "บุก บุก และบุก!"
 instilled_aggression_spirit_tt: "พลเรือเอก: §Gมีโอกาส 50%§! ที่จะไดรับ §Y+1 การโจมตี§! เมื่อเลื่อนระดับ"
 calculated_restraint_spirit: "ความยับยั้งชั่งใจอยางรอบคอบ"
 calculated_restraint_spirit_desc: "หลังจากไตรตรองอยางถี่ถวนแลว..."
 calculated_restraint_spirit_tt: "พลเรือเอก: §Gมีโอกาส 50%§! ที่จะไดรับ §Y+1 การปองกัน§! เมื่อเลื่อนระดับ"
 signals_training_spirit: "การฝกการสื่อสารสัญญาณ"
 signals_training_spirit_desc: "หากจะใหทุกคนทําหนาที่ของตน เขาตองรูกอนวาหนาที่ของตนคืออะไร"
 signals_training_spirit_tt: "พลเรือเอก: §Gมีโอกาส 50%§! ที่จะไดรับ §Y+1 การดําเนินกลยุทธและการประสานงาน§! เมื่อเลื่อนระดับ"
 fleet_in_being_academy_spirit: "กองเรือใหญ"
 fleet_in_being_academy_spirit_desc: "การฝกยุทธวิธีขนาดใหญ"
 fleet_in_being_academy_spirit_tt: "พลเรือเอกคนใหม: §Gมีโอกาส 50%§! ที่จะเริ่มตนดวยคุณลักษณะ §Y"ผูเชี่ยวชาญการยิงปนใหญเรือ"§!"
 merchant_mariners_spirit_tt: "พลเรือเอกคนใหม: §Gมีโอกาส 50%§! ที่จะเริ่มตนดวยคุณลักษณะ §Y"สายเลือดนาวี"§!"
 trade_interdiction_academy_spirit: "สงครามขบวนเรือลําเลียง"
 trade_interdiction_academy_spirit_desc: "ขบวนเรือสินคาตองอาศัยยุทธวิธีและการฝกเปนพิเศษ"
 trade_interdiction_academy_spirit_tt: "พลเรือเอกคนใหม: §Gมีโอกาส 50%§! ที่จะเริ่มตนดวยคุณลักษณะ §Y"หมาปาทะเล"§! หรือ §Y"นักฝาการปดลอม"§!"
 base_strike_academy_spirit: "กําลังทางอากาศแบบบูรณาการ"
 base_strike_academy_spirit_desc: "ความรวมมืออยางใกลชิดระหวางหนวยทางอากาศและทางทะเลเปนสิ่งจําเปน!"
 base_strike_academy_spirit_tt: "พลเรือเอกคนใหม: §Gมีโอกาส 50%§! ที่จะเริ่มตนดวยคุณลักษณะ §Y"ผูหลงใหลการบิน"§!"
 damage_control_training_spirit: "การควบคุมความเสียหาย"
 damage_control_training_spirit_desc: "ลูกเรือที่ฝกมาอยางดีหมายถึงความสูญเสียฝายเราที่นอยลง"
 damage_control_training_spirit_tt: "พลเรือเอกคนใหม: §Gมีโอกาส 50%§! ที่จะเริ่มตนดวยคุณลักษณะ §Y"หัวหนาชางกล"§!"
 best_of_the_best_naval_academy_spirit: "ที่สุดของที่สุด"
 best_of_the_best_naval_academy_spirit_desc: "การแขงขันที่ดุเดือดและการคัดเลือกที่เขมงวดจะหลอหลอมผูบังคับการเรือที่เราตองการ\n\n§Gจิตวิญญาณนี้เปดใชไดเนื่องจากอุดมการณของเรา§!"
 best_of_the_best_naval_academy_spirit_tt: "พลเรือเอกคนใหม: เริ่มตนโดยไมมีคุณลักษณะสวนตัวใด ๆ"
 naval_academy_scholarships_spirit: "ทุนการศึกษาของสถาบัน"
 naval_academy_scholarships_spirit_desc: "ทั้งหมดก็เพื่อใหคนที่เหมาะสมไดมีโอกาสเฉิดฉาย"
 naval_academy_scholarships_spirit_tt: "พลเรือเอกคนใหม: เริ่มตนโดยไมมีคุณลักษณะสวนตัวใด ๆ"
 underfunded_naval_academy_spirit: "โรงเรียนนายเรือขาดงบประมาณ"
 underfunded_naval_academy_spirit_desc: "อยางนอยเราก็ยังมีสักแหง..."
 traditionalism_naval_academy_spirit: "ลัทธิจารีตนิยม"
 traditionalism_naval_academy_spirit_desc: "เราทําแบบนี้มาตลอด จะเปลี่ยนตอนนี้ทําไม?"
 traditionalism_naval_academy_spirit_tt: "เพิ่มโอกาสที่พลเรือเอกคนใหมจะมีคุณลักษณะ §Y"ทหารรุนเกา"§!\n§Gมีโอกาส 50%§! ที่พลเรือเอกคนใหมจะไดรับแตมทักษะเพิ่มในสองดาน"
 political_appointments_naval_academy_spirit: "การแตงตั้งทางการเมือง"
 political_appointments_naval_academy_spirit_desc: "สิ่งสําคัญคือตองใหเฉพาะครูที่มีทัศนคติถูกตองเทานั้นสอนในสถาบันของเรา"
 nepotism_naval_academy_spirit: "ระบบเสนสาย"
 nepotism_naval_academy_spirit_desc: "พอผมเคยเปนครูที่โรงเรียนนายเรือ เหมือนกับปูผมกอนหนานั้น แลวก็ลุงผมดวย..."
 nepotism_naval_academy_spirit_tt: "ลดโอกาสที่พลเรือเอกคนใหมจะไดรับคุณลักษณะสวนตัวที่เปนประโยชน"
 jeune_ecole_spirit: "ฌูน เอกอล"
 jeune_ecole_spirit_desc: "เรือพิฆาตคืออนาคต!"
 big_gun_club_spirit: "ชมรมปนใหญ"
 big_gun_club_spirit_desc: "เรือประจัญบานไมไดครองแคทองทะเล แตยังครองการเมืองดวย"
 aviation_enthusiasts_spirit: "ผูหลงใหลการบิน"
 aviation_enthusiasts_spirit_desc: "การรบทางทะเลในอนาคตจะตัดสินกันบนฟา"
 cruiser_warfare_spirit: "สงครามเรือลาดตระเวน"
 cruiser_warfare_spirit_desc: "เรือลาดตระเวนคือเรือประเภทที่ดีที่สุด ทําไดทุกภารกิจ"
 wolfpacks_spirit: "ฝูงหมาปา"
