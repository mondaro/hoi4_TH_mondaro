 SOV_soviet_german_trade_agreement_desc: "ตามที่ตกลงไวในสนธิสัญญาการคากับ [SOU.GetNameDef] พวกเขากําลังสงวัตถุดิบใหเรา เชน ธัญพืช ฝาย นํ้ามัน สินแรโลหะ และยาง"
