 SOV_face_western_fascism_ns_tt: "โบนัสการโจมตีตอ§Yประเทศฟาสซิสตมหาอํานาจในยุโรป§!: §G+10.0%§!, โบนัสการปองกันตอ§Yประเทศฟาสซิสตมหาอํานาจในยุโรป§!: §G10.0%§!"
