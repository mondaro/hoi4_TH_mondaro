 AI_MESSAGE_CAT3_MES3: "เฮอะ ยังกับวาฉันไมมีอะไรทําดีกวามานั่งเลนเกมโง ๆ นี่งั้นแหละ"
 AI_MESSAGE_CAT3_MES4: "ฉันคงไมแพ $OTHER$ หรอก ถา Paradox ไมจงใจเขียนโคดใหพันธมิตรของฉันโงกวาหินแกรนิตสองตัน สวนศัตรูมีญาณหยั่งรูอนาคตแบบนั้น!"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlvไปตายซะ $OTHER$ ฉันจะไมเลนกับแกอีกแลว!!!1"
 AI_MESSAGE_CAT3_MES6: "gg $OTHER$ คราวหนาลองทําใหมันเปนการตอสูที่ยุติธรรมดูบางดีไหม?"
 AI_MESSAGE_CAT3_MES7: "วาว กลไกเกมอันนั้นทําฉันพังไมเปนทาเลย ไมแปลกใจที่ฉันแพ $OTHER$"
 AI_MESSAGE_CAT3_MES8: "วาว! ถาพวกเขาไมทําให $OTHER$ ไมสมดุลอยางสุดโตงในแพตชลาสุดละก็ นี่คงเปนสงครามที่ยุติธรรมไปแลว!"
