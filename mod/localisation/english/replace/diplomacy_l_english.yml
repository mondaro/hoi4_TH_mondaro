 AI_MESSAGE_CAT1_MES2: "ฮาฮาฮาฮา $OTHER$ เลนเกมนี้หวยแตกสุด ๆ"
 AI_MESSAGE_CAT1_MES3: "ไปหัดเลนใหมซะ ไอมือใหม $OTHER_ADJ$"
 AI_MESSAGE_CAT1_MES4: "ถลุง $OTHER$ ซะเละ จนเกือบจะสงสารแลว"
 AI_MESSAGE_CAT1_MES5: "เกมนี้อาจจะฮารดคอรเกินไปสําหรับคุณนะ $OTHER$ ลองไปเลนเกมกระจอก ๆ อยาง Europa Universalis ดูสิ"
 AI_MESSAGE_CAT1_MES6: "พนันไดเลยวา $OTHER$ ไมไดใชเวลาแมแต 2 ชั่วโมงจัด OOB ของตัวเองดวยซํ้า กระจอก!"
 AI_MESSAGE_CAT1_MES7: "ดูสิ ดินแดน $OTHER_ADJ$ ทั้งหมดนี้เปนของฉันแลว คงไมไดตองการมันละมั้ง!"
 AI_MESSAGE_CAT1_MES8: "เฮ $OTHER$ คราวหนาลองสูกลับบางดีไหม? เพราะถาครั้งนี้สูแลว ก็ไมเห็นจะมีวี่แววเลย!"
 AI_MESSAGE_CAT1_MES9: "ทําไม $OTHER$ ถึงรองไหละ? ก็เพราะเพิ่งโดนตบหนาหงายไงละ!"
 AI_MESSAGE_CAT1_MES10: "ไดขยายเลเบินสเรามนี่รูสึกดีจริง ๆ วาไหม $OTHER$?"
 AI_MESSAGE_CAT2_MES1: "ฉันจะบลิทซครีกของแกใหราบเปนหนากลองเลย $OTHER$!"
 AI_MESSAGE_CAT2_MES2: "อีกไมนานทุกคนใน $OTHER$ จะตองพูดภาษา $US_ADJ$"
 AI_MESSAGE_CAT2_MES3: "ดูไอกระจอก $OTHER_ADJ$ นี่สิ พยายามจะเอาชนะทหาร $US_ADJ$ ผูเหนือกวาของฉัน คงตลกถามันไมนาสมเพชขนาดนี้!"
 AI_MESSAGE_CAT2_MES4: "นี่เรียกวาสงครามเหรอ $OTHER$? ฉันวามันหมูชัด ๆ"
 AI_MESSAGE_CAT2_MES5: "ดูแลโรงงาน $OTHER_ADJ$ ใหสะอาดเอี่ยมไวนะ อีกไมนานฉันจะไดใชมัน!"
 AI_MESSAGE_CAT2_MES6: "ไดยินไหม $OTHER$? นั่นคือเสียงที่ฉันกําลังขยี้แกอยูตอนนี้"
 AI_MESSAGE_CAT2_MES7: "เฮ $OTHER$ บางทีแกอาจไมแยขนาดนี้ ถาเลิกวิ่งหนีแลวลองสูจริง ๆ ดูบาง?"
 AI_MESSAGE_CAT2_MES8: "ฮา ๆ ดู $COUNTRY$ พยายามสูกับฉันสิ! เหมือนมีใครเอาเฟอรเร็ตโคมามาคุมกองทัพเลย!"
 AI_MESSAGE_CAT2_MES9: "วิวใน $COUNTRY$ ชวงนี้ของปสวยจริง ๆ กองทัพของฉันเพลิดเพลินกันใหญเลย!"
 AI_MESSAGE_CAT2_MES10: "กดยอมแพไดแลว $COUNTRY$! แกแคทําใหฉันเสียเวลาเปลา ๆ"
