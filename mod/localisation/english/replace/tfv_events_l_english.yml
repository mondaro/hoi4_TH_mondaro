 tfv_south_africa.64.c: "สถานการณยังไมเอื้ออํานวยในตอนนี้"
 tfv_new_zealand.1.t: "[From.GetNameDefCap]ขอเขาเปนสมาชิกโคมินเทิรน"
 tfv_new_zealand.1.desc: "การปฏิวัติประสบความสําเร็จใน[From.GetNameDef]แลว! รัฐบาลคอมมิวนิสตชุดใหมไดขึ้นมาปกครองประเทศและขอเขาเปนสมาชิกโคมินเทิรน"
 tfv_new_zealand.1.a: "ทุกคนยินดีตอนรับใหเขารวมการตอสู"
 tfv_new_zealand.1.b: "การรับพวกเขาเขามามีแตจะทําใหเราเสี่ยงตอความขัดแยงในพื้นที่หางไกล"
 tfv_new_zealand.2.t: "อนุมัติการเปนสมาชิกโคมินเทิรนแลว"
 tfv_new_zealand.2.desc: "หลังจากพิจารณาอยางรอบคอบ คณะกรรมการกลางแหงโคมินเทิรนไดอนุมัติคําขอเขาเปนสมาชิกของเรา"
 tfv_new_zealand.2.a: "[Root.GetNameDefCap]และ[From.GetFactionName]จะเดินหนาเคียงบาเคียงไหลกัน!"
 tfv_new_zealand.3.t: "ปฏิเสธการเปนสมาชิกโคมินเทิรน"
 tfv_new_zealand.3.desc: "คณะผูแทนของเราตองทนฟงการบรรยายยืดยาวจากประธานโคมินเทิรน ซึ่งอธิบายวาประเทศเล็กๆ อยางเราไมมีทางเปนชาติอุตสาหกรรมที่พัฒนาแลวซึ่งจะกอใหเกิดการปฏิวัติคอมมิวนิสตได เห็นไดชัดวาเราเปนอะไรอยางอื่น ไมวาอยางไรก็ตาม เราไมสามารถเปนสวนหนึ่งของโคมินเทิรนได"
 tfv_new_zealand.3.a: "บางทีพวกเขาตางหากที่เขาใจผิด?"
 tfv_new_zealand.4.t: "[From.GetNameDefCap]ตองการเขารวมอุดมการณของเรา"
 tfv_new_zealand.4.desc: "เมื่อเห็นความเกรียงไกรของกองทัพอันไรพายของเรา รัฐบาล[NZL.GetName]จึงตัดสินใจวาพวกเขาขออยูฝงเดียวกับเราในความขัดแยงนี้ดีกวา คําถามคือเราควรอนุญาตหรือไม"
 tfv_new_zealand.4.a: "ตราบใดที่พวกเขารูที่ทางของตัวเอง"
 tfv_new_zealand.4.b: "จะเอาดวยการทูตไปทําไม ในเมื่อยึดไดดวยสงคราม?"
 tfv_new_zealand.5.t: "ญี่ปุนอนุมัติ"
 tfv_new_zealand.5.desc: "คําขอเปนพันธมิตรกับญี่ปุนของเราไดรับการอนุมัติแลว"
 tfv_new_zealand.5.a: "สิ่งนี้จะทําใหเราปลอดภัย"
 tfv_new_zealand.6.t: "ญี่ปุนปฏิเสธการเปนพันธมิตร"
 tfv_new_zealand.6.desc: "รัฐบาล[JAP.GetAdjective]ไมแมแตจะใสใจใหคําตอบอยางเปนทางการตอคําขอของเรา มีขาวลือวาเรื่องนี้กลายเปนเรื่องตลกขบขันอยางมากในแวดวงรัฐบาล[JAP.GetAdjective]"
 tfv_new_zealand.6.a: "เสียมารยาท"
 tfv_new_zealand.7.t: "ไมเคิล โจเซฟ ซาเวจ ถึงแกอสัญกรรม"
 tfv_new_zealand.7.desc: "ในเหตุการณอันนาเศรา ไมเคิล โจเซฟ ซาเวจ นายกรัฐมนตรีนิวซีแลนดผูเปนที่รักยิ่ง ไดถึงแกอสัญกรรมดวยโรคมะเร็ง ทั้งประเทศไวอาลัยแดบุรุษผูซึ่งหลายคนยกยองวาเปนผูกอตั้งระบบสวัสดิการของนิวซีแลนด ประวัติศาสตรจะจดจําความกลาหาญและความเมตตาที่เขามีตอผูคนรอบตัว"
 tfv_new_zealand.7.a: "เราจะคิดถึงเขา"
 tfv_raj.1.t: "กองทุนเครื่องบินขับไล"
 tfv_raj.1.desc: "ทั่วทั้งจักรวรรดิ ชุมชนทองถิ่นไดตั้ง "กองทุนเครื่องบินขับไล" ขึ้นเพื่อระดมเงินซื้อเครื่องบินขับไลใหมใหกองทัพอากาศอังกฤษ บรรดาเศรษฐีก็รวมสมทบเงินซื้อเครื่องบินใหกองทัพเชนกัน นิซามแหงไฮเดอราบาดไดบริจาคเงินมากพอที่จะซื้อเครื่องบินไดถึง 2 ฝูงบินเต็ม คําถามคือควรประจําการพวกมันไวที่ใด"
 tfv_raj.1.a: "ควรสงไปยังสหราชอาณาจักร"
 tfv_raj.1.b: "เราตองการพวกมันเพื่อปองกันมาตุภูมิ!"
 tfv_raj.2.t: "เจาชายอินเดียบริจาคเครื่องบินขับไล"
 tfv_raj.2.desc: "นิซามแหงไฮเดอราบาด เจาชายแหงอินเดีย ไดบริจาคเงินอยางใจกวางเพื่อซื้อเครื่องบินขับไลที่ทันสมัยที่สุดของเราสองฝูงบินเต็มใหกองทัพอากาศอังกฤษ รัฐบาลไดแสดงความขอบคุณและประกาศวาเครื่องบินลําแรกจะไดรับการตั้งชื่อวา "Spirit of Hyderabad""
 tfv_raj.2.a: "พวกมันจะพิสูจนวามีประโยชนอยางยิ่ง"
 tfv_raj.21.t: "ทุพภิกขภัยเบงกอล"
 tfv_raj.21.desc: "เบงกอลเคยประสบทุพภิกขภัยมากอน แตครั้งนี้เหตุการณตางๆ ประจวบกันทําใหสถานการณเลวรายกวาปกติมาก ฝายบริหารอาณานิคมที่ไรความสามารถอยางนาตกตะลึงไดแสดงใหเห็นวาไมสามารถ - หรือบางทีอาจไมเต็มใจดวยซํ้า - ที่จะรับมืออยางเหมาะสมกับพายุไซโคลนที่ทําลายผลผลิตขาวสวนใหญในเบงกอล ดวยผูลี้ภัยที่หลั่งไหลเขามาจากภูมิภาคที่ไดรับผลกระทบจากสงคราม ความตองการอาหารจึงเพิ่มขึ้นทุกวัน ขณะที่อุปทานกลับไมเพียงพอ \n\nราคาอาหารพุงสูงขึ้นอยางมาก ทําใหผูคนไมไปทํางานที่คาจางไมพอเลี้ยงครอบครัวอีกตอไป จํานวนผูสมัครเปนทหารก็ลดลงอยางมากเชนกัน เมื่อผูคนมากขึ้นเรื่อยๆ ปฏิเสธที่จะทิ้งบานไปสูเพื่อรัฐบาลที่ไมชวยเหลืออะไรพวกเขาเลย"
 tfv_raj.21.a: "นี่คือหายนะ!"
 tfv_raj.30.t: "คอมมิวนิสตอินเดียขอการสนับสนุน"
 tfv_raj.30.desc: "สุภาษ จันทระ โพส ผูนํากลุมฟอรเวิรดบล็อกแหงอินเดียทั้งปวง ไดเดินทางมายังมอสโกเพื่อขอความชวยเหลือจากเราในการตอสูเพื่อเสรีภาพของอินเดีย โดยยกความขัดแยงดั้งเดิมระหวางรัสเซียกับอังกฤษในอินเดียที่ยอนกลับไปถึงยุคเกรตเกม เขาเชื่อวาเราเปนตัวเลือกโดยธรรมชาติที่จะชวยชาวอินเดียใหไดรับเอกราชจากอังกฤษ"
 tfv_raj.30.a: "มายุติจักรวรรดิอังกฤษใหสิ้นซากกันเถอะ"
 tfv_raj.30.b: "ชางเปนความคิดที่ไรสาระ"
 tfv_raj.31.t: "[SOV.GetNameDefCap]สนับสนุนเอกราชของอินเดีย"
 tfv_raj.31.desc: "วันนี้เอกอัครราชทูต[SOV.GetAdjective]ไดมาเยือนกระทรวงการตางประเทศเพื่อหารือประเด็นเอกราชของอินเดีย ระหวางการประชุม เขาแสดงใหชัดเจนอยางยิ่งวา[SOV.GetNameDef]ถือวาการปกครองอินเดียตอไปของเราเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง ดูเหมือนวาคําพูดของโพสไดเขาหู[SOV.GetLeader] และโนมนาวรัสเซียใหหันมาสนับสนุนอุดมการณของเขา \n\nในตอนนี้ ชาว[SOV.GetAdjective]ดูเหมือนจะจํากัดตนเองอยูแคการฝกอาสาสมัครชาวอินเดียในประเทศของพวกเขา แตพวกเขาอาจเขาแทรกแซงความขัดแยงใดๆ ที่ปะทุขึ้นในอนุทวีปก็ได"
 tfv_raj.31.a: "ถาเชนนั้นพวกเขาก็ไมเหลือทางเลือกใหเรา เราตองปลอยอินเดียไป"
 tfv_raj.31.b: "ถาพวกเขาอยากเลนเกรตเกมอีกครั้ง ก็มาเลนกัน"
 tfv_raj.32.t: "[SOV.GetNameDefCap]รับอุดมการณของเราไว"
 tfv_raj.32.desc_SOV_helps: "การเจรจาของเราในมอสโกประสบความสําเร็จอยางนาทึ่ง วันนี้พาดหัวขาวของปราฟดาระบุวา "การตอสูเพื่อเสรีภาพของประชาชนอินเดียคือการตอสูของเรา!" สหาย[SOV.GetLeader]เองไดพบกับจันทระ โพส และสัญญาวาจะใหการสนับสนุนอยางเต็มที่"
 tfv_raj.32.desc_SOV_helps_ENG_reject: "ความหวังที่จะไดเอกราชโดยงายของเราถูกสํานักงานอาณานิคมอังกฤษดับลงอยางโหดราย เมื่อเอกอัครราชทูต[SOV.GetAdjective]ยื่นคําขอใหเราไดกําหนดชะตากรรมของตนเอง เขาก็ไดรับคําตอบอยางรวดเร็ววาไมมีอะไรตองหารือ รัฐบาล[ENG.GetAdjective]อางวาประเด็นเอกราชของเราเปนเรื่องภายในที่ไมมีมหาอํานาจตางชาติใดเขาแทรกแซงได"
 tfv_raj.32.a: "การตอสูยังดําเนินตอไป"
 tfv_raj.33.t: "ชาว[SOV.GetAdjective]ปฏิเสธที่จะชวยเหลือ"
 tfv_raj.33.desc: "สุภาษ จันทระ โพส พยายามโนมนาวรัฐบาล[SOV.GetAdjective]ใหชวยเหลือการตอสูของเรา แตความพยายามของเขาไมประสบผล หลังจากรอหลายวันเพื่อพูดคุยกับ[SOV.GetLeader] เขาก็ไดโอกาสเขาพบซึ่งกินเวลาเพียงสิบนาทีเศษ \n\nแม[SOV.GetLeader]จะแสดงความชื่นชมอยางยิ่งตอการตอสูปฏิวัติของประชาชนเรา แตเขาก็แสดงใหชัดเจนวาเขาไมเชื่อวาประเทศของเราพรอมสําหรับขั้นตอไปบนเสนทางสูคอมมิวนิสตโดยสมบูรณ"
 tfv_raj.33.a: "บางทีเราควรไปขอชาวเยอรมัน?"
 tfv_raj.34.t: "เสรีภาพแดอินเดีย"
 tfv_raj.34.desc: "วันนี้คือจุดเริ่มตนของยุคใหมในประวัติศาสตรอินเดีย หลังจากอยูใตการปกครองของตางชาติมาหลายศตวรรษ ในที่สุดเราก็ไดรับเอกราชโดยสมบูรณ ขาราชการ[ENG.GetAdjective]ในทองถิ่นไดรับคําสั่งใหชวยเหลือการเปลี่ยนผานสูการปกครองตนเองของ[RAJ.GetAdjective] และจะถูกสงกลับบานภายในไมกี่เดือนขางหนา \n\nดวยความชวยเหลือจากสหาย[SOV.GetAdjective]คนใหมของเรา บัดนี้เราสามารถมุงสูภารกิจขางหนา - การสรางชาติเพื่อประชาชนของเรา"
 tfv_raj.34.a: "มีชัย!"
 tfv_raj.40.t: "กลุมชาตินิยมอินเดียขอการสนับสนุน"
 tfv_raj.40.desc: "สุภาษ จันทระ โพส ผูนํากลุมฟอรเวิรดบล็อกแหงอินเดียทั้งปวง ไดเดินทางมายังเบอรลินเพื่อขอความชวยเหลือจากเราในการตอสูเพื่อเสรีภาพของอินเดีย ในจดหมายถึง[GER.GetLeader] เขาแสดงความชื่นชมและเสนอวาอินเดียที่เปนเอกราชจะเปนพันธมิตรอันมีคาในความพยายามของเราที่จะฟนฟู[GER.GetNameDef]กลับสูที่ทางอันชอบธรรมในโลก"
 tfv_raj.40.a: "อังกฤษยึดอาณานิคมของเราไป ตอนนี้เราจะยึดของพวกเขาบาง"
 tfv_raj.40.b: "ชางเปนความคิดที่ไรสาระ"
 tfv_raj.41.t: "[GER.GetNameDefCap]สนับสนุนเอกราชของอินเดีย"
 tfv_raj.41.desc: "วันนี้เอกอัครราชทูต[GER.GetAdjective]ไดมาเยือนกระทรวงการตางประเทศเพื่อหารือประเด็นเอกราชของอินเดีย ระหวางการประชุม เขาแสดงใหชัดเจนอยางยิ่งวา[GER.GetLeader]ถือวาการปกครองอินเดียตอไปของเราเปนสิ่งที่ยอมรับไมไดโดยสิ้นเชิง ดูเหมือนวาโพสไดสัญญาวาอินเดียที่เปนเอกราชจะสนับสนุนผลประโยชนของ[GER.GetAdjective]ในภูมิภาคนี้ \n\nเอกอัครราชทูตปฏิเสธที่จะบอกชัดวารัฐบาลของเขาพรอมจะทําอะไรหากเราปฏิเสธ แตเราตองสันนิษฐานวาพวกเขาอาจถึงขั้นใชสงคราม"
 tfv_raj.41.a: "ถาเชนนั้นพวกเขาก็ไมเหลือทางเลือกใหเรา เราตองปลอยอินเดียไป"
 tfv_raj.41.b: "เราเคยเลนเกรตเกมในอินเดียมาแลว มาดูกันวาชาวเยอรมันจะเลนไดดีแคไหน"
 tfv_raj.42.t: "[GER.GetNameDefCap]รับอุดมการณของเราไว"
 tfv_raj.42.desc_GER_helps: "หลังจากไดพบรัฐมนตรีวาการกระทรวงการตางประเทศ[GER.GetAdjective]และชี้แจงอุดมการณของตน สุภาษ จันทระ โพส ก็สามารถโนมนาวชาว[GER.GetAdjective]ใหสนับสนุนเราได โพสยังไดพบกับ[GER.GetLeader]ผูนําเยอรมนี และหารือเรื่องผลประโยชนรวมกันอยูหลายชั่วโมง รวมถึงการจัดตั้งหนวยอาสาสมัครอินเดียจากเชลยศึกอังกฤษ"
 tfv_raj.42.desc_GER_helps_ENG_reject: "ความหวังที่จะไดเอกราชโดยงายของเราถูกสํานักงานอาณานิคมอังกฤษดับลงอยางโหดราย เมื่อเอกอัครราชทูต[GER.GetAdjective]ยื่นคําขอใหเราไดกําหนดชะตากรรมของตนเอง เขาก็ไดรับคําตอบอยางรวดเร็ววาไมมีอะไรตองหารือ รัฐบาล[ENG.GetAdjective]อางวาประเด็นเอกราชของเราเปนเรื่องภายในที่ไมมีมหาอํานาจตางชาติใดเขาแทรกแซงได"
 tfv_raj.42.a: "การตอสูยังดําเนินตอไป"
 tfv_raj.43.t: "ชาว[GER.GetAdjective]ปฏิเสธที่จะชวยเหลือ"
 tfv_raj.43.desc: "สุภาษ จันทระ โพส พยายามโนมนาวรัฐบาล[GER.GetAdjective]ใหชวยเหลือการตอสูของเรา แตความพยายามของเขาไมประสบผล หลังจากรอหลายวันเพื่อพูดคุยกับ[GER.GetLeader] เขาก็ไดโอกาสเขาพบซึ่งกินเวลาเพียงสิบนาทีเศษ \n\nแม[GER.GetLeader]จะแสดงความชื่นชมอยางยิ่งตอสถานการณและจิตวิญญาณการตอตานอันแรงกลาของเรา แตเขาก็แสดงใหชัดเจนวาเขาไมเชื่อวาประเทศของเราคุมคาที่จะทุมทรัพยากรให"
 tfv_raj.43.a: "ใหตายสิ"
 tfv_raj.44.t: "เสรีภาพแดอินเดีย"
 tfv_raj.44.desc: "วันนี้คือจุดเริ่มตนของยุคใหมในประวัติศาสตรอินเดีย หลังจากอยูใตการปกครองของตางชาติมาหลายศตวรรษ ในที่สุดเราก็ไดรับเอกราชโดยสมบูรณ ขาราชการ[ENG.GetAdjective]ในทองถิ่นไดรับคําสั่งใหชวยเหลือการเปลี่ยนผานสูการปกครองตนเองของ[RAJ.GetAdjective] และจะถูกสงกลับบานภายในไมกี่เดือนขางหนา \n\nดวยความชวยเหลือจากมิตร[GER.GetAdjective]คนใหมของเรา บัดนี้เราสามารถมุงสูภารกิจขางหนา - การสรางชาติเพื่อประชาชนของเรา"
 tfv_raj.44.a: "มีชัย!"
 AST_CREATE_FACTION: "เราจะกอตั้งฝายของเราเอง"
 SAF_colonies_tt: "ปลดปลอย§Yเคนยา§!และ§Yซิมบับเว§!ในฐานะรัฐหุนเชิด"
 SAF_soviet_research_tt: "ทําขอตกลงการวิจัยกับแอฟริกาใต"
 tfv_raj_focus_paratrooper_tt: "พลรมของ Battaglione Azad Hindoustan จะถูกสงไปประจําการในอิตาลี"
 tfv_raj.201.t: "Battaglione Azad Hindoustan"
 tfv_raj.201.desc: "ทหารของ Battaglione Azad Hindoustan ซึ่งเกณฑมาจากเชลยศึก ไดสาบานวาจะสละชีวิตเพื่อเสรีภาพของอินเดีย ทหารชั้นยอดเหลานี้ไดรับการฝกดานการกอวินาศกรรมและการแทรกซึม และยังสามารถกระโดดรมลงไปสรางความปนปวนหลังแนวขาศึกไดอีกดวย"
 tfv_raj.201.a: "จูโจมจากฟากฟา พี่นองทั้งหลาย!"
 tfv_raj.210.t: "การกอวินาศกรรม?"
 tfv_raj.210.desc: "คนงานในทองถิ่นเพิ่งพักกินขาวกลางวันเมื่อเกิดระเบิดรุนแรงสะเทือนโรงงานแหงหนึ่งของเรา ตัวอาคารไดรับความเสียหายอยางมาก และคนงานหลายคนไดรับบาดเจ็บจากเศษกระจกที่ปลิววอน โชคดีที่เครื่องจักรกลดูเหมือนจะยังอยูในสภาพดีเปนสวนใหญ ตํารวจและหนวยทหารไดตั้งแนวปดลอม ขณะที่เจาหนาที่สืบสวนคนหาเบาะแสสาเหตุของการระเบิดในซากปรักหักพัง\n\nมีขาวลือหนาหูวานี่เปนฝมือของกลุมตอตานจากขบวนการออกไปจากอินเดีย ที่เปลี่ยนการประทวงเปนความรุนแรงในการตอสูเพื่อเสรีภาพ"
 tfv_raj.210.a: "นาวิตก"
 tfv_raj.211.t: "การกอวินาศกรรม!"
 tfv_raj.211.desc: "เพียงไมกี่สัปดาหหลังการระเบิดครั้งแรก โรงงานแหงที่สองก็ถูกทําลายอยางกะทันหัน อีกครั้งหลังจากคนงานเพิ่งออกจากอาคารหลักไปกินขาวกลางวัน แทบไมตองสงสัยเลยวานี่คือฝมือของกลุมตอตานที่มีการจัดตั้ง ซึ่งดําเนินการกอวินาศกรรมและกอการรายอยางมีแบบแผน การโจมตีอยางอุกอาจกลางวันแสกๆ แสดงใหเห็นวาผูโจมตีดูมั่นใจในตัวเองอยางมาก"
 tfv_raj.211.a: "จะไมมีใครหยุดพวกมันไดเลยหรือ?"
 tfv_raj.212.t: "ศัตรูภายใน"
 tfv_raj.212.desc: "การระเบิดครั้งที่สามไดทําลายโรงงานแหงหนึ่งในรัฐของเรา คราวนี้ดูเหมือนผูโจมตีจะกําหนดเวลาผิดพลาด เพราะระเบิดเกิดขึ้นกลางกะทํางาน คนงานหลายสิบคนเสียชีวิต และอีกหลายสิบคนยังสูญหาย เจาหนาที่สืบสวนกําลังติดตามเบาะแสหลายทาง และไดคนบานไปแลวจํานวนหนึ่ง ผลที่ไดนาวิตกอยางยิ่ง ตั้งแตใบปลิวโฆษณาชวนเชื่อของขบวนการออกไปจากอินเดีย ไปจนถึงเครื่องมือที่ใชประกอบระเบิดแบบงายๆ ได \n\nอยางไรก็ตาม ดูเหมือนวาไมมีผูถูกจับกุมคนใดเปนแกนนํา และพวกเขายังคงปฏิเสธที่จะใหการ"
 tfv_raj.212.a: "สถานการณกําลังเกินควบคุม"
 tfv_raj_quit_india_unrest_tt: "คาดวาผูสนับสนุนขบวนการจะเรียกรองการเปลี่ยนแปลง"
 tfv_new_zealand.9.t: "[From.GetNameDefCap]ขอควบคุมโพลินีเซียของ[Root.GetAdjective]"
 tfv_new_zealand.9.desc: "[From.GetNameDefCap]ไดยื่นคําขอทางการทูตตอ[Root.GetNameDef]เพื่อขอควบคุมดินแดนในแปซิฟก โดยอางถึงความสัมพันธใกลชิดระหวางรัฐบาลของตนกับชาวเมารี รัฐมนตรีจาก[From.GetNameDef]อางวาพวกเขามีความเขาใจและความสัมพันธสวนตัวอันลึกซึ้งกับชนชาวแปซิฟก ซึ่งจะทําใหผูคนเหลานั้นรูสึกถึงความเปนสวนหนึ่งและมีกําลังใจตอสูเพื่ออุดมการณของ[From.GetFactionName] หลายคนเชื่อวา[From.GetLeader]มีความทะเยอทะยานที่จะเปลี่ยน[From.GetNameDef]ใหเปนรัฐโพลินีเซียที่เปนหนึ่งเดียว และเรื่องนี้จะเปนประโยชนตอ[Root.GetNameDef]หรือไมนั้นยังตองรอดูกันตอไป"
 tfv_new_zealand.9.a: "เปนคําขอที่สมเหตุสมผล"
 tfv_new_zealand.9.b: "หมูเกาะเหลานี้มีคาเกินไป"
 tfv_new_zealand.91.t: "[From.GetNameDefCap]ตอบรับ!"
 tfv_new_zealand.91.desc: "คําขออันสมเหตุสมผลของเราในการควบคุมรัฐโพลินีเซียที่[From.GetNameDefCap]ยึดครองอยูไดรับการตอบรับแลว และบัดนี้เราไดควบคุมดินแดนหมูเกาะใหมจํานวนหนึ่ง"
 tfv_new_zealand.91.a: "ยอดเยี่ยม"
 tfv_new_zealand.92.t: "[From.GetNameDefCap]ปฏิเสธ"
 tfv_new_zealand.92.desc: "คณะผูแทน[Root.GetAdjective]ที่ไปยัง[From.GetNameDefCap]ไดกลับมาพรอมขาวนาผิดหวังวา[Root.GetNameDefCap]จะไมไดรับดินแดนโพลินีเซียใดๆ ของ[From.GetNameDefCap]เลย"
 tfv_new_zealand.92.a: "ใหตายสิ!"
