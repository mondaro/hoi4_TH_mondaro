l_english:
 tfv_australia.1.t: "ขอเสนอของ[From.GetAdjective]เกี่ยวกับยุทธศาสตรสิงคโปร"
 tfv_australia.1.d: "ยุทธศาสตรสิงคโปรเปนรากฐานของนโยบายการยับยั้ง[JAP.GetNameDef]ของเรามาตั้งแตมหาสงครามสิ้นสุดลง อยางไรก็ตาม การโยกยายกองเรือหลักไปยังสิงคโปรในกรณีถูกโจมตีนั้นตองพึ่งพาการสนับสนุนจากพันธมิตรของเราใน[From.GetNameDef] ดวยภัยคุกคามตอดินแดนของอังกฤษในตะวันออกไกลที่เพิ่มขึ้นทุกวัน กองบัญชาการระดับสูงของ[From.GetAdjective]จึงไดเสนอกลยุทธใหมที่จะใหออสเตรเลียมีบทบาทควบคุมการปองกันภูมิภาคนี้มากขึ้นอยางมาก\n\nนี่เปนแผนที่ดี คําถามเดียวคือเราเชื่อหรือไมวาพวกเขาจะใหความมั่นคงที่เราตองการได"
 tfv_australia.1.a: "ออสเตรเลียควรเปนแนวปองกันดานแรกในเอเชียตะวันออกเฉียงใต"
 tfv_australia.1.b: "ยุทธศาสตรสิงคโปรจะคงอยูเชนเดิม"
 tfv_australia.2.t: "[From.GetNameDefCap]โอนดินแดนอาณานิคม"
 tfv_australia.2.d: "[From.GetAdjective]ไดผานกฎหมายที่จะโอนการควบคุมดินแดนอาณานิคมทั้งหมดของ[From.GetAdjective]ใกลสิงคโปรและบอรเนียวใหแก[Root.GetNameDef]\n\nในที่สุดความปลอดภัยของชาติเราก็อยูในมือของเราเอง"
 tfv_australia.2.a: "เราจะไมทําใหผิดหวัง"
 tfv_australia.3.t: "[From.GetNameDefCap]ปฏิเสธการปรับยุทธศาสตร"
 tfv_australia.3.d: "แมเราจะมีขอกังวลที่สมเหตุสมผลเกี่ยวกับความเปนไปไดของยุทธศาสตรสิงคโปร ขอเสนอใหเปลี่ยนแปลงของเรากลับถูกรัฐสภา[From.GetAdjective]ปฏิเสธ \nดูเหมือนจะเปนผลจากแนวคิดอนุรักษนิยมทางทหารที่ครอบงํากองบัญชาการระดับสูงของ[From.GetAdjective] แตความจริงก็คือ หากสิ่งที่เรากลัวเกิดขึ้นจริง เราอาจตองเผชิญกับกองกําลังศัตรูบนชายฝงของเราเอง"
 tfv_australia.3.a: "ไมวาจะมีหรือไมมีการสนับสนุนจาก[From.GetAdjective] [Root.GetNameDef]จะยืนหยัดอยางสงางาม!"
 tfv_australia.10.t: "[From.GetNameDefCap]เสนอคุมครองอาณานิคมของเรา"
 tfv_australia.10.d: "[From.GetNameDefCap]ไดเริ่มเจรจากับนักการทูต[Root.GetAdjective]เพื่อโอนความรับผิดชอบในการคุมครองดินแดน[Root.GetAdjective]ในเอเชียตะวันออกเฉียงใต\n\nเมื่อพิจารณาถึงความทาทายในการปองกันดินแดนดังกลาว การเปนหุนสวนกันอาจไมใชความคิดที่เลวรายนัก นั่นหมายความวาในอนาคตอันใกล ดินแดนดังกลาวจะเปนของ[Root.GetAdjective]เพียงในนาม แตการเปนเจาของในนามยอมดีกวาการสูญเสียไปทั้งหมดอยางแนนอน"
 tfv_australia.10.a: "[From.GetNameDefCap]จะเปนผูดูแลผลประโยชนของ[Root.GetAdjective]ในภูมิภาคนี้"
 tfv_australia.10.b: "ดินแดน[Root.GetAdjective]จะยังคงอยูในมือของ[Root.GetAdjective]!"
 tfv_australia.11.t: "[From.GetNameDefCap]ยกดินแดนในอารักขาให"
 tfv_australia.11.d: "ทหาร[Root.GetAdjective]เตรียมพรอมรับหนาที่คุมครองดินแดนทั้งหมดของ[From.GetAdjective]ในเอเชียตะวันออกเฉียงใตทันทีที่[From.GetLeader]อนุมัติขอตกลง\n\nแมจะมีการตอตานจากคนทองถิ่นบางระหวางการโอน แตความหวาดกลัวการรุกรานจากตางชาติทําใหคนสวนใหญตระหนักถึงความจําเปนของการปองกันโดย[Root.GetAdjective]"
 tfv_australia.11.a: "[Root.GetNameDefCap]จะทําสิ่งที่จําเปนตองทํา"
 tfv_australia.12.t: "[From.GetAdjective]ขัดขวางมาตรการความมั่นคงในภูมิภาค"
 tfv_australia.12.d: "ดวยความเชื่อวาตนมีความสามารถเพียงพอที่จะปกปองดินแดน[From.GetAdjective]ในเอเชียตะวันออกเฉียงใต [From.GetNameDef]จึงปฏิเสธขอเสนอยุทธศาสตรการปองกันรวมของเรา\n\nการกระทําของพวกเขาเปนที่เขาใจได เพราะยอมมีแรงจูงใจมาจากความกังวลเรื่องการควบคุมอาณานิคม อยางไรก็ตาม หากพวกเขาไมสามารถปกปองดินแดนของตนไดอยางที่เรากลัว ดินแดนนั้นอาจถูกใชเปนฐานยิงสําหรับการโจมตีทวีปออสเตรเลีย"
 tfv_australia.12.a: "เราทําไดเพียงหวังวาพวกเขาจะตานทานได"
 tfv_australia.20.t: "[From.GetNameDefCap]เรียกรองใหผนวกเรา!"
 tfv_australia.20.d: "เราติดตามการเติบโตของกระแสชาตินิยมใน[From.GetNameDef]ดวยความกังวลมานาน และดูเหมือนวาวันที่มันลนทะลักออกนอกพรมแดนของพวกเขาไดมาถึงแลว\nโดยอางถึงมรดกรวมกันในฐานะ "ชาติผูบุกเบิก" มีการเสนอแนวคิดเรื่องรัฐโอเชียเนียที่เปนหนึ่งเดียว อยางไรก็ตาม วาทกรรมกลับรุนแรงขึ้นเรื่อยๆ เมื่อเผชิญกับการตอตานของ[Root.GetAdjective]\n\nบัดนี้การคาดเดาทางการเมืองไดกลายเปนความเปนปรปกษอยางเปดเผย และ[From.GetLeader]เรียกรองตอสาธารณะใหผนวกดินแดนทั้งหมดของ[Root.GetAdjective]เขากับรัฐ[From.GetNameDef]\nหากเราปฏิเสธ การรุกรานดวยกําลังดูจะเปนไปไดอยางยิ่ง"
 tfv_australia.20.a: "เราไมมีทางเลือกนอกจากยอมรับสถานะใหมในฐานะมณฑลหนึ่งของ[From.GetNameDef]"
 tfv_australia.20.b: "ถาพวกเขาอยากไดหมูเกาะของเรา ก็มาสูเอาเองสิ!"
 tfv_australia.21.t: "[From.GetNameDefCap]ยอมรับการผนวก"
 tfv_australia.21.d: "[From.GetAdjective]ยอมทําตามคําขาดของเราและยอมรับสถานะใหมในฐานะมณฑลหนึ่งของ[Root.GetNameDef] แมนายกรัฐมนตรี[From.GetLeader]ของ[From.GetAdjective]จะโศกเศรากับการสูญเสีย "เอกราช" ของ[From.GetAdjective] แตชวงเวลานี้คือจุดเริ่มตนของยุคใหมแหงโอเชียเนีย\n\n[From.GetNameDef]ก็เหมือนกับเรา ที่เลิกเปนสุนัขรับใชของจักรวรรดิที่ไมเคยใสใจผลประโยชนของเราแลว"
 tfv_australia.21.a: "[Root.GetNameDefCap]และนิวซีแลนด รวมกันมุงสูอนาคตที่แข็งแกรงยิ่งขึ้น!"
 tfv_australia.22.t: "[From.GetNameDefCap]ปฏิเสธขอเสนอการรวมชาติของเรา"
 tfv_australia.22.d: "รัฐบาล[From.GetAdjective]ไมยอมรับสถานะอันลอแหลมของตนในภูมิรัฐศาสตรแปซิฟก และปฏิเสธขอเสนอของเราที่จะใหนิวซีแลนดเปนหนึ่งในมณฑลแถวหนาของ[Root.GetNameDef]\nโดยไมรูตัววาเปนเพียงสุนัขรับใชของอังกฤษ นายกรัฐมนตรี[From.GetLeader]ของ[From.GetAdjective]ไดอางหลักการ "เสรีภาพและเอกราช" ของ[From.GetAdjective]\n\nดูเหมือนวาเราจะตองเตือนให[From.GetNameDef]เขาใจอยางแทจริงวาที่เราบอกวาสถานะของพวกเขา "ลอแหลมทางภูมิรัฐศาสตร" นั้นหมายความวาอยางไร"
 tfv_australia.22.a: "จับอาวุธขึ้น ชาว[Root.GetAdjective]ทั้งหลาย!"
 tfv_australia.31.t: "[Root.GetNameDefCap]ในฐานะผูนําระดับโลก"
 tfv_australia.31.d: "หลังจากนโยบายตีตัวออกหางจากจักรวรรดิเมื่อไมนานมานี้ ยอมสมเหตุสมผลที่ประเทศซึ่งมีอิทธิพลเหนือขอบเขตของตนอยางเราจะกาวขึ้นเปนผูนํา แทนที่จะเปนผูตาม\nเราจะรวบรวมมหาอํานาจระดับภูมิภาคอื่นๆ มารวมอุดมการณของเรา และทําใหมั่นใจวาผลประโยชนรวมกันของเราจะไดรับการปกปองบนเวทีโลก\n\nเมื่อไมตองเปนขารับใชของมหาอํานาจอาณานิคมแหงยุโรปอีกตอไป เราจะสรางดุลอํานาจใหมที่ยุติธรรมยิ่งขึ้น"
 tfv_australia.31.a: "[Root.GetNameDefCap]นําทางสูอนาคต!"
 tfv_australia.32.t: "[From.GetNameDefCap]ขอความรวมมือทางการเมือง"
 tfv_australia.32.d: "หลังจาก[From.GetNameDef]ออกจากเครือจักรภพอยางเปนทางการ รัฐบาล[From.GetAdjective]ก็กําลังมองหาพันธมิตรใหม ดวยยุโรปที่ดูเหมือนจะอยูบนขอบเหวของความขัดแยงครั้งใหมที่มีราคาแพง และคุณคาทางยุทธศาสตรของ[From.GetNameDef]ตอความขัดแยงใดๆ ที่อาจเกิดขึ้นในแปซิฟก การเปนหุนสวนกันอาจเปนประโยชนสูงสุดตอเรา\n\nสิ่งนี้จะตอกยํ้าวาเอเชียตะวันออกเฉียงใต ตะวันออกไกล และแปซิฟกเปนสวนหนึ่งของเขตอิทธิพลของเราอยางแนนอน และทําใหมั่นใจวาไมวาจะเกิดอะไรขึ้นในยุโรป ผลประโยชนของ[Root.GetAdjective]จะไมถูกลวงลํ้า"
 tfv_australia.32.a: "เรายินดีที่จะเรียกพวกเขาวาพันธมิตร!"
 tfv_australia.32.b: "เราปกปองผลประโยชนของตนเองไดดีกวาดวยตัวเราเอง"
 tfv_australia.33.t: "[From.GetNameDefCap]ตกลงรวมมือในแปซิฟก"
 tfv_australia.33.d: "เมื่อเห็นประโยชนชัดเจนของการเปนหุนสวนขามแปซิฟก [From.GetNameDef]จึงตกลงตามขอเสนอพันธมิตรระดับภูมิภาคของเรา"
 tfv_australia.33.a: "นายเกาตายไปแลว บัดนี้เราทุกคนเทาเทียมกัน"
 tfv_australia.34.t: "[From.GetNameDefCap]ปฏิเสธโครงการความรวมมือ"
 tfv_australia.34.d: "ไมวาจะเปนเพราะไมยอมรับประวัติศาสตรรวมกันของเรา หรือเปนเพียงเรื่องของการฉวยโอกาสทางการเมือง [From.GetNameDef]ไดปฏิเสธขอเสนอการเปนหุนสวนขามแปซิฟกของเรา\n\nแมการเขารวมของพวกเขาจะเปนประโยชนอยางมาก แตเราควรเดินหนาตามวาระของเราเอง มุงสูเปาหมายของเราเอง"
 tfv_australia.34.a: "เราจะยังคงทําทุกอยางที่ทําไดเพื่อมุมโลกของเรา"
 tfv_australia.34.b: "เราลมเหลว"
 tfv_australia.41.t: "เพื่อเสรีภาพของ[INS.GetAdjective]"
 tfv_australia.41.d: "ดวยความวุนวายที่ลุกลามไปทั่วอดีตอาณานิคม[HOL.GetAdjective] เห็นไดชัดวา[INS.GetNameDef] เพื่อนบานที่เราไววางใจ ตองการความชวยเหลือเพื่อรักษาอํานาจที่ไดมาอยางยากลําบาก ตราบใดที่พวกเขายังตองการการสนับสนุน [Root.GetNameDef]จะอยูเคียงขางเพื่อสนับสนุนรัฐบาล[INS.GetAdjective]\n\nวันหนึ่ง[INS.GetNameDef]จะสามารถยืนหยัดตอกรกับกองกําลังอาณานิคมยุโรปในฐานะพี่นองแปซิฟกของเรา จนกวาจะถึงวันนั้น เราจะทําใหมั่นใจวาพวกเขาจะยืนหยัดอยางแข็งแกรงเคียงขางเรา"
 tfv_australia.41.a: "รวมรบดวยกัน แมตองตอสูกับทั้งโลกก็ตาม!"
 tfv_australia.50.t: "[From.GetNameDefCap]ขอเขาเปนสมาชิก[Root.GetFactionName]"
 tfv_australia.50.d: "ดวยการนิยามตนเองเปนชาติของกรรมกรที่ปลอดจากชนชั้นกระฎมพียุโรปเกา [From.GetNameDef]ไดคอยๆ เคลื่อนเขาสูขอบเขตทางการเมืองของ[Root.GetAdjective] รัฐบาล[From.GetAdjective]ไดรองขออยางเปนทางการเพื่อเขาเปนสมาชิก[Root.GetFactionName]\n\nเมื่อการปฏิวัติโลกอยูในสายตา [From.GetLeader]ไดเสนอวิสัยทัศนให[Root.GetNameDef]และ[From.GetNameDef]เปนสองขั้วอํานาจหลักในระเบียบโลกสังคมนิยมใหม โดยตอยอดจากความเปนใหญของ[From.GetNameDef]ในโอเชียเนีย และของ[Root.GetNameDef]ในยูเรเชีย"
 tfv_australia.50.a: "ชาติปฏิวัติใดๆ ยอมไดรับการตอนรับดวยออมแขนที่เปดกวาง!"
 tfv_australia.50.b: "เราไมอาจแบกรับความขัดแยงที่ชาว[From.GetAdjective]จะลากเราเขาไปอยางแนนอน"
 tfv_australia.51.t: "พี่นองแหงการปฏิวัติ"
 tfv_australia.51.d: "[From.GetNameDefCap]ไดพิจารณาคําขอเขาเปนสมาชิก[From.GetFactionName]ของเรา และประกาศใหเราเปนพันธมิตรอันมีคาของอุดมการณ!"
 tfv_australia.51.a: "การปฏิวัติโลกรออยู!"
 tfv_australia.52.t: "เดินหนาเพียงลําพัง"
 tfv_australia.52.d: "หลังจากการเจรจาที่หยุดชะงักและพิธีการทางราชการนานหลายสัปดาห เห็นไดชัดวา[From.GetNameDef]ไมสนใจจะใหคําตอบที่ชัดเจนเรื่องการเขารวม[From.GetFactionName]ของเรา\nเนื่องจากเราหวังวาการเจรจาจะรวดเร็วและไดขอสรุป [Root.GetNameDef]จึงตองเตรียมนําเสรีภาพที่แทจริงไปสูกรรมกรทั่วโลกดวยตัวเอง"
 tfv_australia.52.a: "เราตอสูเพื่อผูถูกกดขี่ในทุกมุมโลก!"
 tfv_australia.60.t: "[From.GetNameDefCap]บังคับใชอํานาจเหนือ"
 tfv_australia.60.d: "โดยอางถึงสิทธิของกรรมกรทุกคนในเสรีภาพและการกําหนดชะตากรรมตนเอง รัฐบาล[From.GetAdjective]กําลังเรียกรองใหรัฐ[Root.GetAdjective]ยอมจํานนตอกระแส "สังคมนิยมโอเชียเนีย" ที่กําลังถาโถมเขาสูภูมิภาคของเรา\n\nไมวาประชาชนของ[Root.GetNameDef]จะสนใจจริงหรือไม ภัยคุกคามจาก[From.GetNameDef]นั้นเปนของจริง และแทบไมตองสงสัยเลยวาพวกเขามีแนวโนมจะผลักดันขอเรียกรองดวยทุกวิถีทางที่มี..."
 tfv_australia.60.a: "เราไมมีทางเลือกจริงๆ เพื่อการปฏิวัติ เพื่อนเอย"
 tfv_australia.60.b: "[Root.GetNameDefCap]จะไมมีวันยอมจํานน!"
 tfv_australia.61.t: "[From.GetNameDefCap]เขารวมการตอสูปฏิวัติ!"
 tfv_australia.61.d: "ดวยการยอมรับความจริงและความชอบธรรมของอุดมการณคอมมิวนิสต [From.GetNameDef]จึงเห็นพองถึงความจําเปนที่จะรวมพลังของเราภายใตธงโอเชียเนียรวมกัน"
 tfv_australia.61.a: "กระแสสีแดงจะผงาดขึ้นจากเบื้องลางเพื่อกลืนกินโลก!"
 tfv_australia.62.t: "[From.GetNameDefCap]พยายามขัดขวางการปฏิวัติ"
 tfv_australia.62.d: "หลังจากกดขี่ประชาชน[From.GetAdjective]ไวใตอุงมือกระฎมพีมานาน พวกเศรษฐีอวนพีที่ควบคุมรัฐบาล[From.GetNameDef]ไดประกาศวาจะไมรวมมือกับรัฐ[Root.GetAdjective]ไมวาในกรณีใดๆ ทั้งสิ้น\nนาเสียดายสําหรับพวกเขา เพราะเราไมไดตองการความรวมมือจากพวกเขา แตตองการจากผูที่ทํางานหนักดั่งทาสใตนํ้าหนักความอวนฟุงเฟอของพวกเขาตางหาก!"
 tfv_australia.62.a: "เราจะนําเสรีภาพที่แทจริงมาสู[From.GetNameDef]!"
 tfv_australia.70.t: "[From.GetNameDefCap]เรียกรองสิทธิควบคุมดินแดนในอารักขา"
 tfv_australia.70.d: "โดยอางวาความลมเหลวของ[Root.GetNameDef]ในการปองกันดินแดนอาณานิคมในเอเชียตะวันออกเฉียงใตจะสงผลรายแรงตอการปองกันประเทศของ[From.GetNameDef] [From.GetLeader]จึงรองขอใหรัฐบาล[From.GetAdjective]ไดรับความรับผิดชอบอยางเต็มที่และเปนอิสระในการปองกันภูมิภาคนี้\nแมจะไมใชขอเรียกรองโดยตรง แตอิทธิพลทางยุทธศาสตรและการทหารของ[From.GetAdjective]ที่เติบโตขึ้นในภูมิภาคทําใหขอโตแยงนี้ฟงดูมีเหตุผลอยูบาง สิ่งที่ถวงดุลคือการที่[From.GetNameDef]ตีตัวออกหางจากเราทางการเมืองเมื่อไมนานมานี้\nนี่จะเปนขอตกลงกับหุนสวนที่มีศักยภาพ ไมใชรัฐในอารักขา และจะทําใหอาณานิคมหลุดจากมือเราโดยพฤตินัย หาก[From.GetNameDef]เลือกที่จะทําเชนนั้น"
 tfv_australia.70.a: "ใช เสถียรภาพของเอเชียตะวันออกเฉียงใตเปนเรื่องสําคัญอันดับแรก"
 tfv_australia.70.b: "ไม เราจะเปนผูควบคุมดินแดนอาณานิคมของเราแตเพียงผูเดียว!"
 tfv_australia.71.t: "คณะกรรมาธิการปองกัน"
 tfv_australia.71.d: "หลังจากการทาบทามจากกองบัญชาการทหาร[Root.GetAdjective] [From.GetNameDef]ไดตัดสินใจมอบ "การควบคุมระดับกลาง" ของดินแดนอาณานิคมทั้งหมดของ[From.GetAdjective]ในเอเชียตะวันออกเฉียงใตใหแกเรา\n\nขณะที่มหาอํานาจเกาแหงแปซิฟกยังไมรูตัว ความพยายามของเราที่จะสรางความเปนใหญของ[Root.GetNameDef]เหนือภูมิภาคนี้ก็ดําเนินตอไป"
 tfv_australia.71.a: "เราจะทําใหประเทศแมภาคภูมิใจ"
 tfv_australia.72.t: "[From.GetNameDefCap]ปฏิเสธ "โครงการปองกัน""
 tfv_australia.72.d: "แมจะมีการทาบทามจากกองบัญชาการระดับสูงของ[Root.GetAdjective] [From.GetNameDef]ก็ปฏิเสธคําขอของเราในการควบคุมอาณานิคมของพวกเขาในภูมิภาคเอเชียตะวันออกเฉียงใต\n\nอยางไรก็ตาม ความทะเยอทะยานของเรายังไมลดลง เราจะยังคงหาหนทางสรางความโดดเดนของ[Root.GetAdjective]ในแปซิฟกตอไป"
 tfv_australia.72.a: "[Root.GetNameDefCap]ยังคงยืนหยัดอยางแข็งแกรง แมจะเผชิญความลมเหลวครั้งนี้"
 tfv_australia.80.t: "ขอเสนอจากโพนทะเล"
 tfv_australia.80.d: "เมื่อเวลาผานไป [From.GetNameDefCap]ก็เริ่มเห็นใจความทะเยอทะยานแบบจักรวรรดิของ[Root.GetNameDef]มากขึ้น ในฐานะกองกําลังทหารสําคัญอีกเพียงหนึ่งเดียวในภูมิภาคนี้ ชาว[From.GetAdjective]จึงตัดสินใจวาการยืนหยัดเปนพันธมิตรผูภาคภูมิของเรานั้นดีกวาการเปนขารับใชผูตํ่าตอย\n\nเพื่อดึงความสนใจของเรา ขอเสนอพันธมิตรแปซิฟกตะวันตกไดระบุอยางชัดเจนวาเขตอิทธิพลของ[Root.GetAdjective]จะรวมถึงดินแดนหลายแหงที่ศัตรูของ[From.GetNameDef]ควบคุมอยูในปจจุบันดวย"
 tfv_australia.80.a: "รวมกัน เราจะครองซีกโลกตะวันออกอยางสมบูรณ!"
 tfv_australia.80.b: "ความทะเยอทะยานของเราไมมีที่วางใหพวกชาวนาบานนอกเหลานั้น!"
 tfv_australia.81.t: "[From.GetNameDefCap]อนุมัติพันธมิตร"
 tfv_australia.81.d: "คณะผูแทนของเราที่ไปญี่ปุนไดกลับมาอยางมีชัย เราไดลงนามเปนพันธมิตรอยางเปนทางการกับ[JAP.GetName] เอกสารไดกําหนดเขตผลประโยชนของแตละประเทศอยางชัดเจน ซึ่งอีกฝายจะไมสามารถเขาแทรกแซงได"
 tfv_australia.81.a: "ชาว[Root.GetAdjective]และชาว[From.GetAdjective]ทั่วแปซิฟกตะวันตกจะไดรับประโยชนจากสิ่งนี้"
 tfv_australia.82.t: "รัฐบาล[From.GetAdjective]ตอตานการเปนหุนสวน!"
 tfv_australia.82.d: "แมเราจะกาวขึ้นสูแถวหนาของเวทีโลกแลว [From.GetNameDef]ก็ยังปฏิเสธที่จะยอมรับความสําคัญของเราในภูมิภาคแปซิฟกตะวันตก \nไมเพียงแต[From.GetAdjective]จะปฏิเสธเราอยางไมไยดี พวกเขายังแสดงออกอยางชัดแจงวาหลักนิยมนันชินรนของพวกเขาอาจพาพวกเขาไปไกลเกินอินโดนีเซีย มุงหนาสูทวีปออสเตรเลียเลยทีเดียว"
 tfv_australia.82.a: "หากพวกเขาไมยืนเคียงขางเรา เราจะทําใหพวกเขาคุกเขาตอหนาเรา"
 tfv_australia.90.t: "การเยือนในพิธีบรมราชาภิเษก"
 tfv_australia.90.desc: "[AST.GetLeader]ไดเดินทางไปยังอังกฤษเพื่อรวมพิธีบรมราชาภิเษกของพระเจาจอรจที่ 6 และสมเด็จพระราชินีเอลิซาเบธ หลังจากมื้อกลางวัน มื้อคํ่า งานเลี้ยงในสวน งานเลี้ยงรับรอง และมื้อคํ่าอีกหลายตอหลายมื้อตลอดหลายสัปดาห ในที่สุดเขาก็ไดเขาเฝาพระมหากษัตริยองคใหมเปนการสวนพระองค หลังจากการทักทายและสนทนาเรื่องสัพเพเหระ หัวขอก็เปลี่ยนมาเปนเรื่องการเมือง และพระมหากษัตริยทรงถามวาพระองคจะชวยเหลือ[AST.GetNameDef]ไดอยางไร"
 tfv_australia.90.a: "ทูลขอใหพระมหากษัตริยเสด็จเยือนออสเตรเลียเพื่อเสริมขวัญกําลังใจ"
 tfv_australia.90.b: "ทูลขอใหพระมหากษัตริยสนับสนุนการรณรงคเกณฑทหาร"
 tfv_australia.90.c: "ทูลขอใหพระมหากษัตริยสนับสนุนรัฐบาลตอสาธารณะ"
 tfv_australia.92.t: "พระเจาเอ็ดเวิรดที่ 8 เสด็จเยือนออสเตรเลีย"
 tfv_australia.92.desc: "[AST.GetLeader]ไดเดินทางไปยังอังกฤษเพื่อรวมพิธีอภิเษกสมรสระหวางพระเจาเอ็ดเวิรดที่ 8 และวอลลิส ซิมปสัน หลังจากมื้อกลางวัน มื้อคํ่า งานเลี้ยงในสวน งานเลี้ยงรับรอง และมื้อคํ่าอีกหลายตอหลายมื้อตลอดหลายสัปดาห ในที่สุดเขาก็ไดเขาเฝาพระมหากษัตริยองคใหมเปนการสวนพระองค \n\nหลังจากการทักทายและสนทนาเรื่องสัพเพเหระ หัวขอก็เปลี่ยนมาเปนเรื่องการเมือง พระมหากษัตริยทรงตรัสยืดยาวเรื่องความเปนปกแผนของเครือจักรภพและความภักดีตอประเทศแม และเมื่อพระองคทรงเริ่มกลาวถึงการเมืองภาคพื้นทวีป [AST.GetLeader]ก็อดรูสึกอึดอัดเล็กนอยไมได พระมหากษัตริยทรงถามวาพระองคจะชวยเหลือ[AST.GetNameDef]และทําใหประชาชนที่นั่นรักใครพระองคไดอยางไร"
 tfv_australia.92.a: "ทูลขอใหพระมหากษัตริยเสด็จเยือนออสเตรเลียเพื่อเสริมขวัญกําลังใจ"
 tfv_australia.92.b: "ทูลขอใหพระมหากษัตริยสนับสนุนการรณรงคเกณฑทหาร"
 tfv_australia.92.c: "ทูลขอใหพระมหากษัตริยสนับสนุนรัฐบาลตอสาธารณะ"
 tfv_australia.95.t: "กลุมชาตินิยมกําลังผงาดในอินโดนีเซีย"
 tfv_australia.95.desc: "ในชวงหลายสัปดาหที่ผานมา การปลุกระดมของกลุมชาตินิยมทั่วอินโดนีเซียเพิ่มขึ้นอยางเห็นไดชัด ขาวกรองประเมินวาจํานวนผูเห็นใจกลุมชาตินิยมเพิ่มขึ้นจนนาตกใจ ที่นากังวลเปนพิเศษคือรายงานวาผูนําชาตินิยมบางคนกําลังพูดคุยอยางเปดเผยถึงการกอกบฏดวยอาวุธ เมื่อวานนี้เอง เรือรบลําหนึ่งไดสกัดเรือประมงตองสงสัยทางใตของเกาะชวา พบอาวุธและกระสุนที่ไมมีเครื่องหมายทางการอยูบนเรือ การสอบสวนลูกเรือยังไมไดผลใดๆ แตดูเหมือนวามีใครบางคนกําลังพยายามกอความวุนวาย"
 tfv_australia.95.a: "นากังวลอยางยิ่ง"
 tfv_australia.96.t: "สงครามกลางเมือง!"
 tfv_australia.96.desc: "กลุมชาตินิยมติดอาวุธออกมาเคลื่อนไหวตามทองถนนทั่วอินโดนีเซีย ปฏิบัติการของทหารและตํารวจเพื่อปราบปรามการลุกฮือยังไมประสบผลสําเร็จจนถึงขณะนี้ การกอกบฏดวยอาวุธครั้งนี้เกิดขึ้นตามหลังกระแสชาตินิยมที่พุงสูงขึ้นอยางฉับพลัน ซึ่งบัดนี้หมายความวาเรากําลังอยูในสงครามกลางเมืองเต็มรูปแบบ"
 tfv_australia.96.a: "ตอตานพวกชาตินิยมสารเลว!"
 tfv_australia.96.b: "เขารวมการลุกฮือ!"
 tfv_canada.1.t: "[From.GetNameDefCap]ขอจัดตั้งพันธมิตรอเมริกาเหนือ"
 tfv_canada.1.d: "ดวยผลประโยชนทางการทูตทั่วทวีปอเมริกาเหนือที่สอดคลองกัน และยุโรปที่วุนวายยิ่งขึ้นทุกวัน [From.GetNameDef]จึงเสนอการเคลื่อนไหวทางการเมืองครั้งสําคัญ\nดวยการทําสนธิสัญญาปองกันรวมกัน เราจะสามารถรับประกันความปลอดภัยและบูรณภาพของทวีปอเมริกา พรอมทั้งขยายทางเลือกทางการเมืองและการทหารของเราไดอยางมากในทุกสถานการณ [From.GetLeader]กลาววานี่เปน "ทางเลือกที่ชัดเจน" เพื่อความรุงเรืองของทั้ง[Root.GetNameDef]และ[From.GetNameDef] และ[Root.GetLeader]ก็ดูจะเห็นดวยวายากที่จะโตแยงเปนอยางอื่น"
 tfv_canada.1.a: "นี่เปนยุทธศาสตรที่ดี เราจะรวมมือกับ[From.GetNameDef]!"
 tfv_canada.1.b: "เราจะไมยอมเสี่ยงที่จะถูกลากเขาไปพัวพันกับปญหานอกพรมแดนของเรา"
 tfv_canada.2.t: "กอตั้งพันธมิตรอเมริกาเหนือแลว"
 tfv_canada.2.d: "วันนี้คือวันลงนามสนธิสัญญาฉบับใหม เพื่อเฉลิมฉลองมิตรภาพและการสนับสนุนซึ่งกันและกันระหวาง[Root.GetNameDef]และ[From.GetNameDef] สองประเทศของเราสัญญาวาจะชวยเหลือกันในเรื่องนโยบายตางประเทศ รวมถึงการปองกันทวีปของเรา\n\nเมื่อชาติของเรารวมมือกัน ผูรุกรานตางชาติในโลกนี้ก็ไมมีทางสูเราได"
 tfv_canada.2.a: "จากทะเลสูทะเล!"
 tfv_canada.3.t: "[From.GetNameDefCap]ปฏิเสธพันธมิตรอเมริกาเหนือ"
 tfv_canada.3.d: "แมจะมีประโยชนจากมาตรการความรวมมือทางทหารอยางเปนทางการระหวางสองประเทศของเรา ดังที่เห็นไดจากคณะกรรมการปองกันรวม แต[From.GetAdjective]ก็ปฏิเสธการเจรจาเพื่อเปนพันธมิตรถาวรกับเรา\nสนธิสัญญานี้จะรับประกันบูรณภาพของทวีปอเมริกาเหนือได แตบัดนี้ดูเหมือนเราจะตองหาวิธีอื่นในการปองกันมาตุภูมิ"
 tfv_canada.3.a: "เรายังมีทางเลือกอื่น"
 tfv_canada.10.t: "[From.GetNameDefCap]ขอเขาเปนสมาชิก[Root.GetFactionName]"
 tfv_canada.10.d: "หลังจากละทิ้งเครือจักรภพ [From.GetNameDef]กําลังเจรจาเพื่อเปนหนึ่งในพันธมิตรของเราใน[Root.GetFactionName] ความเชื่อมั่นในลัทธิคอมมิวนิสตของพวกเขาแข็งแกรง และปฏิเสธไมไดวาพันธมิตรในทวีปอเมริกาจะเปนประโยชนอยางยิ่งตออุดมการณการปฏิวัติโลก...\nแมแนวคิดสังคมนิยมรักชาติ ธรรมชาติที่เปนอิสระ และความพยายามสรางปาฏิหาริยทางอุตสาหกรรมของ[From.GetLeader]อาจกอปญหาในอนาคต แตนี่ดูเปนโอกาสที่ดีเกินกวาจะปลอยผาน"
 tfv_canada.10.a: "เรายินดีตอนรับนักปฏิวัติที่แทจริงทุกคนดวยออมแขนที่เปดกวาง!"
 tfv_canada.10.b: "ตอนนี้ยังเสี่ยงเกินไป"
 tfv_canada.11.t: "การปฏิวัติอเมริกาที่แทจริง"
 tfv_canada.11.d: "หลังจากสลัดเศษซากชนชั้นกระฎมพีที่คํ้าจุนดวยความรุนแรงแบบอาณานิคมมานานหลายศตวรรษ ในที่สุดเราก็ไดกาวขึ้นสูเวทีโลก เรายืนเคียงขาง[From.GetNameDef]ใน[From.GetFactionName] ขณะที่เรามุงเผยแพรการปฏิวัติโลกไปยังทุกมุมของโลก!"
 tfv_canada.11.a: "เราจะแสดงใหทวีปนี้เห็นวาการปฏิวัติที่แทจริงหมายถึงอะไร!"
 tfv_canada.12.t: "[From.GetNameDefCap]ปฏิเสธการเขาเปนสมาชิก[From.GetFactionName]"
 tfv_canada.12.d: "ดวยความกังวลถึงผลกระทบตอ "เสถียรภาพของโลก" [From.GetLeader]จึงปฏิเสธคําขอเขาเปนสมาชิก[From.GetFactionName]ของเราตอสาธารณะ\nเมื่อเห็นวา[From.GetNameDef]ยังไมพนจากการเลนการเมืองอันคับแคบของโลกเกา ความพยายามปฏิวัติของเราก็คงสูญเปลากับพวกเขาอยูดี\n\nแม[Root.GetNameDef]จะตองยืนหยัดเพียงลําพังในโลกแหงฟาสซิสต เราจะไมยอมแพจนกวาสังคมนิยมที่แทจริงจะไปถึงกรรมกรทุกคนในทุกดินแดนของโลก!"
 tfv_canada.12.a: "เพื่อความเปนธรรม ความเขาใจ และวิถีแคนาดา!"
 tfv_canada.20.t: "[From.GetNameDefCap]แสวงหาพันธมิตร"
 tfv_canada.20.d: "หลังจากกระแสชาตินิยมอนุรักษผงาดขึ้นในการเมือง[From.GetAdjective] [From.GetNameDef]ก็แสวงหาพันธมิตรใหมที่มีศักยภาพจะชวยเหลืออุดมการณของพวกเขาไดจริง แทนที่จะเปน "ประชาธิปไตย" อันออนแอของเครือจักรภพ\n\nการเปนหุนสวนกับ[From.GetNameDef]ไมเพียงเปนเรื่องธรรมชาติทางอุดมการณ แตยังจะรับประกันการมีอยูของรัฐที่แข็งแกรงซึ่งสามารถ... ดําเนินการตามผลประโยชนของเราในทวีปอเมริกาเหนือได"
 tfv_canada.20.a: "เปนเรื่องธรรมดาที่ชาว[From.GetAdjective]และชาว[Root.GetAdjective]จะรวมมือกัน!"
 tfv_canada.20.b: "ผลประโยชนของเราอยูที่ยุโรป [From.GetNameDef]ตองยืนหยัดดวยตนเอง"
 tfv_canada.21.t: "พันธมิตรแหงอํานาจ"
 tfv_canada.21.d: "[From.GetNameDefCap]ไดตอบรับขอเสนอพันธมิตรของเรา โดยเห็นประโยชนชัดเจนจากความสัมพันธกับรัฐอเมริกาที่แข็งแกรง\nดวยการเคลื่อนไหวทางการทูตครั้งนี้ เราจะสามารถแผอํานาจในอเมริกาเหนือไดมากขึ้นอยางมาก และไมใชเรื่องบังเอิญที่แกนเบอรลิน-ออตตาวาพาดผานลอนดอนพอดี"
 tfv_canada.21.a: "เรายืนหยัดในฐานะมหาอํานาจระดับโลก"
 tfv_canada.22.t: "ความเนาเฟะแหงยุโรป"
 tfv_canada.22.d: "[From.GetName]ของ[From.GetLeader]ซึ่งไมอาจมองไปไกลกวาพรมแดนอันเล็กจิ๋วของตนได ไดปฏิเสธขอเสนอพันธมิตรของเรา\nแนนอนวา ดวยรัฐ[From.GetAdjective]และยุโรปทั้งหมดที่นาจะลมสลายภายใตนํ้าหนักของประชาชนตนเอง เราอาจจะดีกวาหากไมมีพวกเขา"
 tfv_canada.22.a: "เราจะแสดงใหพวกเขาเห็นวาความยิ่งใหญที่แทจริงหมายถึงอะไร"
 tfv_canada.30.t: "การปฏิวัติของกลุมซินารคิสต"
 tfv_canada.30.d: "ขณะที่กลุมซินารคิสตมีอิทธิพลเพิ่มขึ้น ขอเรียกรองของพวกเขาก็หนักแนนขึ้นเรื่อยๆ ดูเหมือนวารัฐบาลของเราอาจไมสามารถสกัดกั้นการเมืองฝายขวาของพวกเขาไดอีกตอไป เนื่องจากมีรายงานการปะทะระหวางกลุมซินารคิสตกับผูสนับสนุนรัฐบาลทั่ว[Root.GetNameDef] ซึ่งรวมถึงการใชอาวุธรายแรงของทั้งสองฝาย\nแมจะยังไมชัดเจนวาพรรคซินารคิสตติดอาวุธขึ้นมาเมื่อใดและอยางไร แตพวกเขาคือภัยคุกคามที่แทจริงและเฉพาะหนาตอรัฐบาลปจจุบัน\n\nสงครามกลางเมืองใกลเขามาแลว"
 tfv_canada.30.a: "สนับสนุนฝายชาตินิยม"
 tfv_canada.30.b: "สนับสนุนฝายสาธารณรัฐ"
 tfv_canada.30.c: "ยอมมอบอํานาจปกครองใหฝายชาตินิยม"
 tfv_canada.40.t: "แผนการครองความเปนใหญ"
 tfv_canada.40.d: "แมความแข็งแกรงของรัฐ[Root.GetAdjective]ที่เพิ่งปฏิรูปใหมจะเปนที่ปฏิเสธไมได แตความเปนจริงของการเมืองในภูมิภาคก็ปฏิเสธไมไดเชนกัน ศัตรูเกาของเรา [USA.GetNameDef] ครองความเปนใหญเหนือทวีป และพิสูจนแลววาไมอาจหามตัวเองจากการยุงเกี่ยวกับเรื่องนอกพรมแดน\nสิ่งนั้นทําใหขอเสนอความรวมมือกับ[From.GetNameDef]ยิ่งมีคามากขึ้น ลําพังประเทศใดประเทศหนึ่งของเราอาจไมมีกําลังพอจะปองกันการแทรกแซงของ[USA.GetAdjective] แตเมื่อตองเผชิญทั้งทางเหนือและทางใต [USA.GetLeader]จะตองคิดใหรอบคอบกอนลงมือ\n\nและบางทีพวกเขาอาจยอมคืนดินแดนที่เปนของ[Root.GetAdjective]โดยชอบธรรมมากขึ้น..."
 tfv_canada.40.a: "เราจะบีบคั้นเพื่อนบานที่เนาเฟะของเราจนสิ้นลม!"
 tfv_canada.40.b: "เราไมอาจเสี่ยงที่จะถูกมองวาเปนผูรุกราน"
 tfv_canada.41.t: "เม็กซิโกตกลง"
 tfv_canada.41.d: "รัฐบาล[MEX.GetAdjective]เห็นพองอยางเต็มที่เกี่ยวกับภัยคุกคามตอประเทศของเราจากนโยบายกาวราวของเพื่อนบานทางใต หนทางเดียวที่เราจะอยูรอดคือทําลายการบีบคั้นที่พวกเขามีตอทวีป เราตองโจมตีในเร็ววัน กอนที่พวกเขาจะติดอาวุธใหมเสร็จ แนนอนวาเราตองยอมยกดินแดนบางสวนใหมิตรใหมของเรา แตรวมกันแลว เราจะยุติความเปนเจาของอเมริกา!"
 tfv_canada.41.a: "ทําเนียบขาวจะลุกเปนไฟอีกครั้ง!"
 tfv_canada.42.t: "เม็กซิโกปฏิเสธ"
 tfv_canada.42.desc: "รัฐบาล[MEX.GetAdjective]ไดปฏิเสธขอเสนอของเราที่จะรวมมือกันตอตานศัตรูรวม ดูเหมือนพวกเขาจะเชื่อวาสามารถเพิกเฉยตองูหางกระดิ่งที่พรอมจะฉกพวกเขาได โดยหวังวามันจะปลอยพวกเขาไวตามลําพังตราบใดที่พวกเขาไมทําทาคุกคาม ดูเหมือนวาเราตองพึ่งการปองกันของเราเองเพียงลําพัง"
 tfv_canada.42.a: "พวกโง! พวกขี้ขลาด! พวกทรยศ!"
 tfv_canada.50.t: "ศัตรูภายใน"
 tfv_canada.50.d: "วันนี้เกิดระเบิดสะเทือนโรงงานแหงหนึ่งของเรา และแมในตอนแรกดูเหมือนจะเปนอุบัติเหตุทางอุตสาหกรรม แตการสอบสวนเผยวามีการวางระเบิดไวตามสายการผลิตอยางจงใจ\nแมเราจะไวอาลัยตอการสูญเสียชีวิต แตการโจมตีตอความพยายามในการทําสงครามเปนสิ่งที่ไมอาจเพิกเฉยได\n\nใครก็ตามที่อยูเบื้องหลังการโจมตีนี้คือภัยคุกคามตอ[Root.GetNameDef]ทั้งหมด!"
 tfv_canada.50.a: "เราจะไมยอมใหศัตรูโคนลมเรา!"
 tfv_canada.51.t: "การโจมตีอีกครั้ง"
 tfv_canada.51.d: "เกิดการโจมตีอีกครั้งบนแผนดิน[Root.GetAdjective] คราวนี้มุงเปาไปที่โรงงานทหารแหงหนึ่งของเราโดยตรง!\nการผลิตถูกระงับขณะเริ่มการซอมแซม แตผูกระทําผิดยังคงลอยนวล\n\nอยางนอยก็ชัดเจนแลววานี่เปนฝมือของกลุมคน ไมใชบุคคลคนเดียว"
 tfv_canada.51.a: "ยิ่งกลุมของพวกมันใหญเทาไร ก็ยิ่งตามตัวไดงายเทานั้น"
 tfv_canada.52.t: "กลุมควิเบก"
 tfv_canada.52.d: "หนวยบังคับใชกฎหมายไดรวมมือกับสารวัตรทหารจนมีความคืบหนาอยางมากในคดีการกอวินาศกรรมโรงงานตอเนื่อง เมื่อมีการโจมตีโรงงานอีกแหง ก็เห็นไดชัดวาการกอวินาศกรรมนี้ไมไดเปนฝมือของสายลับตางชาติ แตเปนกลุมที่ประทวงการเกณฑทหารภาคบังคับที่ประกาศใชในควิเบก!\n\nไมวาพวกเขาจะมีขอกังวลทางการเมืองอยางไร ประเทศของเรากําลังอยูในภาวะสงคราม และพวกเขาคือผูทรยศขั้นรายแรงที่สุด"
 tfv_canada.52.a: "พวกมันตองถูกหยุดยั้ง!"
 tfv_canada.53.t: "จุดจบของเสนทาง"
 tfv_canada.53.d: "กับดักถูกวางไวสําหรับกลุมควิเบกในโรงงานที่คาดวานาจะเปนเปาหมายการกอวินาศกรรมครั้งตอไปของพวกเขามากที่สุด ในยามดึกสงัด เจาหนาที่บังคับใชกฎหมายเฝารอผูแทรกซึม\nเมื่อผูกอวินาศกรรมมาถึง กลับกลายเปนกลุมที่ใหญกวาที่คาดไวมาก และมีอาวุธหนักกวา ดวยยุทโธปกรณที่ขโมยมาจากกองทัพ การยิงตอสูปะทุขึ้น สรางความเสียหายแกสายการผลิตมากพอๆ กับที่แผนของกลุมควิเบกจะทําได\nอยางไรก็ตาม หลังการตอสูอันดุเดือด ไมมีผูกอวินาศกรรมรอดชีวิตแมแตคนเดียว กลุมควิเบกถึงกาลอวสานแลว"
 tfv_canada.53.a: "นี่คือชัยชนะ ไมใชความสูญเสียของ[Root.GetNameDef]!"
 tfv_canada.60.t: "[From.GetNameDefCap]เรียกรองลาบราดอรและนิวฟนดแลนด"
 tfv_canada.60.d: "หลังจากแสดงความปรารถนามานานที่จะ "นํากลับคืน" ดินแดนอาณานิคมลาบราดอรและนิวฟนดแลนดมาเปนสวนหนึ่งของประเทศ บัดนี้[From.GetNameDef]ไดกาวไปถึงขั้นเรียกรองดินแดนเหลานั้นแลว\n[From.GetLeader]ไดแสดงใหชัดเจนวา[From.GetNameDef]ถือวาที่นั่นเปนแผนดิน[From.GetAdjective] และพวกเขาจะ "ดําเนินขั้นตอนที่จําเปนเพื่อใหไดมา""
 tfv_canada.60.a: "ใหสิ่งที่พวกเขาตองการไป ตอนนี้[Root.GetNameDef]ไมอาจทะเลาะกันเรื่องนี้ได"
 tfv_canada.60.b: "เราจะไมยอมเสียแผนดิน[ENG.GetAdjective]แมแตนิ้วเดียว!"
 tfv_canada.61.t: "โชคชะตาที่สมบูรณ"
 tfv_canada.61.d: "เมื่อ[From.GetNameDef]ยกลาบราดอรและนิวฟนดแลนดให [Root.GetNameDef]ก็เปนหนึ่งเดียวอยางสมบูรณในที่สุด จากทะเลสูทะเลอยางแทจริง ชาว[Root.GetAdjective]ที่แทจริงทุกคนอยูภายในพรมแดนของเราแลว ที่ซึ่งพวกเขาควรอยู\nขั้นตอไปของเราคือการรับประกันความปลอดภัยและความมั่นคงของรัฐ[Root.GetAdjective]!"
 tfv_canada.61.a: "ชายฝงทะเลคือพรมแดนเดียวที่ปลอดภัย!"
 tfv_canada.62.t: "ความโอหังแหงจักรวรรดิ"
 tfv_canada.62.d: "โดยอาง "สิทธิแหงจักรวรรดิ" ที่กําลังพังทลาย และอางสถานะของลาบราดอรและนิวฟนดแลนดในฐานะดินแดนอาณานิคมที่ตองไดรับการคุมครอง [From.GetNameDef]ไดปฏิเสธที่จะยกดินแดนที่เปนของเราโดยชอบธรรม! ผูคนเหลานี้เปนชาว[Root.GetAdjective] และนิวฟนดแลนดกับลาบราดอรก็มีทรัพยากรของ[Root.GetAdjective] แตพวกเขากลับตองขึ้นตรงตอนายชาว[From.GetAdjective]\nนี่เปนสภาพการณที่ยอมรับไมได แตก็ชัดเจนวาไมอาจโนมนาว[From.GetNameDef]ใหยอมรับทางออกทางการทูตได..."
 tfv_canada.62.a: "[ROOT.GetNameDefCap]จะเปนหนึ่งเดียว!"
 tfv_canada.70.t: "[FROM.GetNameDefCap]ปรารถนารวมกับนิวฟนดแลนด"
 tfv_canada.70.desc: "[FROM.GetLeader]ไดติดตอเรามาหลังการลงมติในรัฐสภาแคนาดา เพื่อขอใหเราลงนามแกไขพระราชบัญญัติบริติชนอรทอเมริกาฉบับกอนหนา และผานการแกไขนั้นประกาศการรวมกันระหวาง[FROM.GetNameDef]กับอาณานิคมนิวฟนดแลนดและลาบราดอร"
 tfv_canada.70.a: "เราไมเห็นวาจะเสียหายอะไร"
 tfv_canada.70.b: "ไมมีทางเด็ดขาด!"
 tfv_canada.71.t: "[FROM.GetNameDefCap]ลงนามพระราชบัญญัตินิวฟนดแลนด"
 tfv_canada.71.desc: "มิตรผูยิ่งใหญของเราใน[FROM.GetName]ไดตอบรับคําขอของเรา และลงนามในพระราชบัญญัตินิวฟนดแลนดที่เสนอไป ซึ่งเทากับเปนการมอบอธิปไตยเหนือนิวฟนดแลนดและลาบราดอรใหแกเรา นี่เปนวันยิ่งใหญของแคนาดา!"
 tfv_canada.71.a: "ยอดเยี่ยม!"
 tfv_canada.72.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะลงนามในปฏิญญา"
 tfv_canada.72.desc: "ผูที่เราคิดวาเปนมิตรผูยิ่งใหญของเราอยาง[FROM.GetAdjective] ไดปฏิเสธขอเสนอการรวมกับนิวฟนดแลนดและลาบราดอรของเรา บรรดาสมาชิกสภาและนักการเมืองหัวดื้อของพวกเขาไดแสดงจุดยืนในเรื่องนี้ใหเราเห็นแลว และเรารูวาตอจากนี้เราตองปฏิบัติตอพวกเขาอยางไร"
 tfv_canada.72.a: "พวกเขารูตัวไหมวานี่ทําลายความสัมพันธของเรา?"
 tfv_canada.73.t: "อังกฤษมอบนิวฟนดแลนดและลาบราดอรให[CAN.GetName]"
 tfv_canada.73.desc: "หลังจากลงนามในพระราชบัญญัตินิวฟนดแลนด อธิปไตยเหนือนิวฟนดแลนดและลาบราดอรจะถูกมอบใหแก[CAN.GetNameDef]พันธมิตรของเรา แมพวกเขาจะยืนยันวาเรื่องนี้ไมอาจตอรองได แตอยางนอยพวกเขาก็ยอมรับวาเราควรไดรับคาชดเชยทางเศรษฐกิจจากการสละฐานทัพในพื้นที่นั้น"
 tfv_canada.73.a: "อยางนอยเราก็ไดคาชดเชย..."
 mex_nationalists_chosen: "เขาขางฝายชาตินิยม"
 mex_republicans_chosen: "เขาขางฝายสาธารณรัฐ"
 tfv_south_africa.1.t: "[From.GetNameDefCap]ขอดินแดนในอาณัติในแอฟริกา"
 tfv_south_africa.1.d: "ขณะที่เรากําลังดิ้นรนกับการคุมครองทางทหารทั่วทั้งจักรวรรดิ [From.GetNameDef]ไดติดตอเราเรื่องขอตกลงทางการบริหาร อาณานิคมของเราในแอฟริกาตอนใตและตอนกลางควรถูกโอนใหพวกเขา พรอมสิทธิและความรับผิดชอบเต็มที่ในการปองกัน"
 tfv_south_africa.1.a: "เราตองทุมกําลังไปที่ยุโรป"
 tfv_south_africa.1.b: "เรารักษาอาณานิคมเหลานี้ไดดีอยูแลว"
 tfv_south_africa.1.c: "อาณานิคมควรปองกันตนเอง"
 tfv_south_africa.2.t: "[From.GetNameDefCap]อนุมัติ"
 tfv_south_africa.2.d: "ดวยภาระผูกพันที่เพิ่มขึ้นใกลบาน [From.GetNameDef]จึงตกลงวาอาณานิคมในแอฟริกาของเธอควรอยูภายใตการบริหารของเราไปกอนในตอนนี้"
 tfv_south_africa.2.a: "เราจะเปนเจาเหนือหัวผูมีเมตตา"
 tfv_south_africa.3.t: "[From.GetNameDefCap]ปฏิเสธ"
 tfv_south_africa.3.d: "โดยอางวาไมมีภัยคุกคามโดยตรงตออาณานิคมของเธอในแอฟริกา [From.GetNameDef]ไดแสดงใหชัดเจนอยางยิ่งวาพวกเขาไมมีเจตนาจะโอนการบริหารดินแดนของเธอใหเรา"
 tfv_south_africa.3.a: "พวกเขาไมไวใจเราหรือ?"
 tfv_south_africa.4.t: "การประนีประนอมเรื่องแอฟริกา"
 tfv_south_africa.4.d: "หลังจากใครครวญอยูนาน รัฐบาลอังกฤษไดเสนอทางประนีประนอมเกี่ยวกับการปองกันอาณานิคมในแอฟริกา ภายใตแผนใหมนี้ อาณานิคมจะรับผิดชอบการปองกันตนเอง แตจะไดรับอิสระในการจัดการกิจการของตนเองมากขึ้น"
 tfv_south_africa.4.a: "การประนีประนอมที่ดี - ไมมีใครพอใจเลย"
 tfv_south_africa.10.t: "ความชวยเหลือจากตางชาติเพื่อการตอสูของเรา"
 tfv_south_africa.10.desc: "สงครามครั้งยิ่งใหญเพื่ออนาคตของประเทศเรามาถึงแลวในที่สุด บัดนี้เราตองหาการสนับสนุนทุกเศษเสี้ยวที่หาได เพื่อใหมั่นใจวาเราจะมีชัยในการตอสูครั้งนี้ การอยูรอดของวัฒนธรรม[From.GetAdjective]และวิถีชีวิตของเรากําลังเปนเดิมพัน!"
 tfv_south_africa.10.a: "เราควรติดตอชาวเยอรมัน"
 tfv_south_africa.10.b: "ชาวดัตชจะชวยเรา"
 tfv_south_africa.11.t: "[SAF.GetNameDefCap]รองขอความชวยเหลือ!"
 tfv_south_africa.11.desc: "การตอสูอันรุนแรงไดปะทุขึ้นใน[From.GetName] ขณะที่พวกเขาสูเพื่อการอยูรอดของวิถีชีวิตตน พวกเขาตองการการสนับสนุนทุกรูปแบบที่เราพอจะใหไดอยางสิ้นหวัง นี่ยังเปนโอกาสที่จะทดสอบอาวุธใหมของเราบางชนิด และไดพันธมิตรอันมีคาในแอฟริกาใต"
 tfv_south_africa.11.a: "สงเครื่องบินขับไลไปให"
 tfv_south_africa.11.b: "สงรถถังไปให"
 tfv_south_africa.11.c: "สงปนไรเฟลและปนใหญไปให"
 tfv_south_africa.11.e: "พวกเขาตองสูดวยตัวเอง"
 tfv_south_africa.12.t: "[From.GetNameDefCap]วิงวอนขอความชวยเหลือจากเรา"
 tfv_south_africa.12.desc: "การสูรบอยางหนักไดปะทุขึ้นในแอฟริกาใตระหวางฝายชาตินิยมและฝายสหภาพนิยม ฝายชาตินิยมซึ่งดอยกวาอยางมากทั้งจํานวนคนและกําลังอาวุธ ไดหันมาขอการสนับสนุนจากเรา ซึ่งเปนบานเกิดของบรรพบุรุษพวกเขา"
 tfv_south_africa.12.a: "สงเครื่องบินขับไลไปให"
 tfv_south_africa.12.b: "สงรถถังไปให"
 tfv_south_africa.12.c: "สงปนไรเฟลและปนใหญไปให"
 tfv_south_africa.12.e: "พวกเขาตองสูดวยตัวเอง"
 tfv_south_africa.13.t: "คําตอบของเยอรมนี"
 tfv_south_africa.13.desc.a: "คณะผูแทนของเราที่ไป[GER.GetNameDef]กลับมามือเปลา แมรัฐบาล[GER.GetAdjective]จะกลาวถอยคําอบอุน แตก็ไมอาจใหคํามั่นสัญญาที่แนนอนวาจะสนับสนุน ดูเหมือนวาเราไมอาจพึ่งพารัฐบาลเยอรมนีใหชวยเหลือการตอสูของเราไดอีกตอไป"
 tfv_south_africa.13.desc.b: "โดยอางวาขาดแคลนวัสดุ รัฐบาล[GER.GetAdjective]ไดตัดสินใจวาการสงการสนับสนุนเพิ่มเติมใหเราไมเปนประโยชนตอพวกเขาอีกตอไป ความพยายามทั้งหมดมุงไปที่การสรางกองทัพของตนเองแทน สิ่งนี้ทําใหเราตกอยูในสถานการณยากลําบาก"
 tfv_south_africa.13.a: "ติดตอมิตรชาวดัตชของเรา"
 tfv_south_africa.13.b: "เราจะประสบความสําเร็จดวยตัวเอง หรือไมก็พินาศไปในความพยายามนั้น"
 tfv_south_africa.14.t: "คําตอบของ[HOL.GetAdjective]"
 tfv_south_africa.14.desc.a: "คณะผูแทนของเราที่ไป[HOL.GetNameDef]ตองผิดหวังกับการขัดขวางและความลาชาไมรูจบ การประชุมกับเจาหนาที่และผูบริหารอุตสาหกรรมของ[HOL.GetAdjective]ถูกยกเลิกในนาทีสุดทาย โทรไปก็ไมมีใครโทรกลับ โทรเลขก็ไมไดรับคําตอบ ดูเหมือนวารัฐบาล[HOL.GetAdjective]ไมไดสนใจจะชวยเหลือความพยายามของเราจริงๆ"
 tfv_south_africa.14.desc.b: "แมจะสนับสนุนในตอนแรก แตการเจรจารอบลาสุดกับรัฐบาล[HOL.GetAdjective]เรื่องยุทโธปกรณใหมไดลมลง ดูเหมือนวาชาว[HOL.GetAdjective]จะไมยอมรับการชําระเงินเปนเพชรอีกตอไป โดยอางปญหาในการแปลงเปนสกุลเงินที่แลกเปลี่ยนได"
 tfv_south_africa.14.a: "ติดตอมิตรชาวเยอรมันของเรา"
 tfv_south_africa.14.b: "เราจะประสบความสําเร็จดวยตัวเอง หรือไมก็พินาศไปในความพยายามนั้น"
 tfv_south_africa.15.t: "[From.GetNameDefCap]สงยุทโธปกรณมาให"
 tfv_south_africa.15.desc.a: "เครื่องบินล็อตหนึ่งไดมาถึงจากเยอรมนี นักบินของเรากระตือรือรนอยางยิ่งที่จะไดลองขับ และการแขงขันอันดุเดือดไดเริ่มขึ้นเพื่อแยงตําแหนงในฝูงบินใหม"
 tfv_south_africa.15.desc.b: "หลังจากหารือกันนานกับมิตรชาว[GER.GetAdjective] พวกเขาก็ตกลงสงรถถังเบาล็อตหนึ่งมาใหเรา แมจะมีจํานวนไมมาก แตก็อาจเปนสิ่งที่พลิกดุลใหเปนฝายเราอยางเด็ดขาด"
 tfv_south_africa.15.desc.c: "เรือลําหนึ่งจาก[GER.GetNameDef]ไดมาถึงเรา ในระวางเรือบรรทุกปนไรเฟลหลายตันและปนใหญหนักหลายกระบอก สําหรับอาสาสมัครจากเยอรมนีที่เดินทางมาหาเราดวยวิธีอื่น"
 tfv_south_africa.15.a: "สิ่งเหลานี้จะมีประโยชนอยางยิ่ง"
 tfv_south_africa.15.b: "พวกมันจะเปนกระดูกสันหลังของกองทัพเรา"
 tfv_south_africa.15.c: "การสนับสนุนของพวกเขาเปนที่ยินดีอยางยิ่ง"
 tfv_south_africa.16.t: "[From.GetNameDefCap]สงยุทโธปกรณมาให"
 tfv_south_africa.16.desc.a: "เครื่องบินล็อตหนึ่งไดมาถึงจาก[HOL.GetNameDef] ดวยความเอื้อเฟอจากการบริจาคอยางใจกวางของบุคคลชั้นนําหลายคนในอุตสาหกรรมการบินของ[HOL.GetAdjective] นักบินของเรากระตือรือรนอยางยิ่งที่จะไดลองขับ และการแขงขันอันดุเดือดไดเริ่มขึ้นเพื่อแยงตําแหนงในฝูงบินใหม"
 tfv_south_africa.16.desc.b: "หลังจากหารือกันนานกับมิตรชาว[HOL.GetAdjective] พวกเขาก็ตกลงสงรถถังเบารุนทดลองล็อตหนึ่งมาใหเรา แมจะมีจํานวนไมมาก แตก็อาจเปนสิ่งที่พลิกดุลใหเปนฝายเราอยางเด็ดขาด"
 tfv_south_africa.16.desc.c: "เรือลําหนึ่งจาก[HOL.GetNameDef]ไดมาถึงเรา ในระวางเรือบรรทุกปนไรเฟลหลายตันและปนใหญหนักหลายกระบอก สําหรับอาสาสมัครจาก[HOL.GetNameDef]ที่เดินทางมาหาเราดวยวิธีอื่น"
 tfv_south_africa.16.a: "สิ่งเหลานี้จะมีประโยชนอยางยิ่ง"
 tfv_south_africa.16.b: "พวกมันจะเปนกระดูกสันหลังของกองทัพเรา"
 tfv_south_africa.16.c: "การสนับสนุนของพวกเขาเปนที่ยินดีอยางยิ่ง"
 tfv_south_africa.20.t: "[From.GetNameDefCap]ขอเขาเปนสมาชิกโคมินเทิรน"
 tfv_south_africa.20.d: "การปฏิวัติประสบความสําเร็จใน[From.GetNameDef]แลว! รัฐบาลคอมมิวนิสตชุดใหมไดขึ้นมาปกครองประเทศและขอเขาเปนสมาชิกโคมินเทิรน"
 tfv_south_africa.20.a: "เรายินดีตอนรับสหายใหมในการตอสูกับจักรวรรดินิยม!"
 tfv_south_africa.20.b: "การรับพวกเขาเปนสมาชิกในตอนนี้มีแตจะทําใหเราเสี่ยงตอความขัดแยงในพื้นที่หางไกล"
 tfv_south_africa.21.t: "อนุมัติการเปนสมาชิกโคมินเทิรนแลว"
 tfv_south_africa.21.d: "หลังจากพิจารณาอยางรอบคอบ คณะกรรมการกลางแหงโคมินเทิรนไดอนุมัติคําขอเขาเปนสมาชิกของเรา"
 tfv_south_africa.21.a: "เคียงบาเคียงไหล [Root.GetNameDef]และ[From.GetFactionName]จะเดินหนาสูอนาคต!"
 tfv_south_africa.22.t: "ปฏิเสธการเปนสมาชิกโคมินเทิรน"
 tfv_south_africa.22.d: "โดยอางถึงความแตกตางที่ไมอาจแกไขไดระหวางมุมมองเฉพาะของเราตอคําสอนของมารกซกับการตีความแบบจารีต โคมินเทิรนไดปฏิเสธใบสมัครของเรา แมจะไมถึงขั้นตราหนาเราวาเปนพวกฟาสซิสตสังคมหรือเลวรายกวานั้น แตพวกเขาก็แสดงใหชัดเจนวาเราไมอาจคาดหวังความชวยเหลือใดๆ จากพวกเขา"
 tfv_south_africa.22.a: "บางทีพวกเขาตางหากที่เขาใจผิด?"
 tfv_south_africa.30.t: "[From.GetNameDefCap]เรียกรองมาดากัสการ"
 tfv_south_africa.30.d: "หลังความวุนวายในยุโรป รัฐบาล[From.GetAdjective]ไดตั้งคําถามอยางเปดเผยตอสิทธิอธิปไตยของเราในมาดากัสการ รวมถึงความสามารถของเราในการปกปองประชากรที่อาศัยอยูที่นั่น พฤติกรรมนี้ไดเลยเถิดเกินกวาแควาทกรรมแลว โดยฝายบริหาร[From.GetAdjective]เรียกรองใหเรายกการควบคุมเกาะนี้ใหพวกเขา"
 tfv_south_africa.30.a: "เราไมมีทางเลือก ยังมีเรื่องสําคัญกวาที่ตองจัดการ"
 tfv_south_africa.30.b: "แผนดิน[Root.GetAdjective]ทุกตารางเมตรลวนศักดิ์สิทธิ์ เราจะไมยอม!"
 tfv_south_africa.31.t: "[From.GetNameDef]ยอมถอย"
 tfv_south_africa.31.d: "รัฐบาล[From.GetAdjective]ไดตัดสินใจอยางชาญฉลาดที่จะยอมใหเรายึดครองมาดากัสการโดยสันติ"
 tfv_south_africa.31.a: "อีกกาวหนึ่งในการรื้อถอนระบบอาณานิคมของจักรวรรดินิยม!"
 tfv_south_africa.32.t: "[From.GetAdjective]ปฏิเสธ"
 tfv_south_africa.32.d: "ฝายบริหาร[From.GetAdjective]ปฏิเสธอยางดื้อรั้นแมแตจะหารือเรื่องการสงมอบมาดากัสการใหเรา ตามคํากลาวของผูแทนของพวกเขา พวกเขาถือวาตนเองมีความสามารถ ความเต็มใจ และความพรอมเกินพอที่จะปองกันเกาะนี้"
 tfv_south_africa.32.a: "ถาอยางนั้นเราตองใชกําลัง"
 tfv_south_africa.32.b: "ปลอยใหพวกเขาเก็บดินผืนไรคานั่นไวเถอะ"
 tfv_south_africa.40.t: "สนธิสัญญาการวิจัยกับ[From.GetNameDef]"
 tfv_south_africa.40.d: "หลังภารกิจทางทหารไปยัง[From.GetNameDef]ที่ประสบความสําเร็จ รัฐบาลของพวกเขาไดเสนอขอตกลงการวิจัยอยางเปนทางการระหวางสองชาติของเรา"
 tfv_south_africa.40.a: "เรายินดีใหความชวยเหลือเทาที่ทําได"
 tfv_south_africa.40.b: "การเปดเผยความลับของเราใหพวกเขาจะเปนภัยตอความมั่นคงของชาติ"
 tfv_south_africa.41.t: "[SOV.GetNameDefCap]ตกลง"
 tfv_south_africa.41.d: "โซเวียตไดตกลงใหเราศึกษาวิธีการและแนวทางของพวกเขา นักวิทยาศาสตร[SOV.GetAdjective]จํานวนหนึ่งไดมาถึงเพื่อสอนในโรงเรียนและมหาวิทยาลัยของเรา"
 tfv_south_africa.41.a: "การเรียนรูจาก[SOV.GetNameDef]คือการเรียนรูจากผูชนะแหงประวัติศาสตร!"
 tfv_south_africa.42.t: "[SOV.GetNameDefCap]ปฏิเสธ"
 tfv_south_africa.42.d: "หลังการเจรจาหลายรอบ คณะผูแทนจาก[SOV.GetNameDef]ไดเดินออกจากที่ประชุม โดยอางวาสงสัยในความสามารถของเราที่จะรักษาความลับงานวิจัยของพวกเขา ดูเหมือนวาเราจะไมไดรับอนุญาตใหแบงปนเทคโนโลยีกับพันธมิตรของเรา"
 tfv_south_africa.42.a: "นาเสียดายอยางยิ่ง"
 tfv_south_africa.50.t: "การสนับสนุนสเปน"
 tfv_south_africa.50.d: "การสูรบไดปะทุขึ้นในสเปนระหวางรัฐบาลฝายชาตินิยมกับรัฐบาลฝายสาธารณรัฐที่ชอบธรรม มีการถกเถียงอยางมากในหมูประชาชนวารัฐบาลของเรามีจุดยืนอยางไร"
 tfv_south_africa.50.a: "บางทีทหารของเราบางคนอาจสนใจไปพักรอนที่สเปน?"
 tfv_south_africa.50.b: "หากประชาชนตองการเขารวมการตอสู เราจะไมหาม"
 tfv_south_africa.50.c: "ทําไมเราตองไปรบในสงครามที่อยูอีกซีกโลกดวย?"
 tfv_south_africa.51.t: "อาสาสมัครจากแอฟริกาใตมาถึงแลว"
 tfv_south_africa.51.d: "แมรัฐบาล[SAF.GetAdjective]จะยังไมผูกมัดตนอยางเปนทางการ แตก็อนุญาตใหพลเมืองจํานวนมากเขารวมอุดมการณของเราในฐานะอาสาสมัคร"
 tfv_south_africa.51.a: "ยินดีอยางยิ่ง"
 tfv_south_africa.52.t: "อาสาสมัครจากสงครามกลางเมืองสเปนกลับมาแลว"
 tfv_south_africa.52.d: "เมื่อการสูรบในสเปนสิ้นสุดลง อาสาสมัครที่รอดชีวิตจากสงครามไดเดินทางกลับบาน พวกเขานําประสบการณอันมีคาเกี่ยวกับการสงครามสมัยใหมกลับมาดวย"
 tfv_south_africa.52.a: "พวกเขาจะชวยเราในสงครามครั้งหนา"
 tfv_south_africa.60.t: "เสรีภาพแดแองโกลา"
 tfv_south_africa.60.d: "เมื่อไดรับการปลดปลอยจากเงื้อมมือของผูกดขี่อาณานิคมแลว ประชาชนของ[ANG.GetName]ก็พรอมที่จะกําหนดชะตากรรมของตนเอง พวกเขาไดจัดตั้งรัฐบาลเฉพาะกาลและรางรัฐธรรมนูญขึ้น สิ่งเดียวที่เหลืออยูคือการโอนอํานาจจากผูวาการทหารของเราไปยังรัฐบาล[ANG.GetAdjective]ชุดใหม"
 tfv_south_africa.60.a: "ชาติใหมทุกชาติตองไดรับการชี้นําอยางระมัดระวัง มิฉะนั้นฝายตอตานการปฏิวัติจะไดชัย!"
 tfv_south_africa.60.b: "เรายินดีตอนรับพวกเขาดวยออมแขนที่เปดกวาง!"
 tfv_south_africa.60.c: "สถานการณยังไมเอื้ออํานวยในตอนนี้"
