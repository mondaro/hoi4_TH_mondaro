 CHI_corruption_in_the_administration: "การทุจริตในฝายบริหาร"
 CHI_corruption_in_the_administration_desc: "ลอที่หยอดนํ้ามันยอมหมุนงายกวา แตนั่นไมไดหมายถึงประสิทธิภาพ บุคคลเพียงไมกี่คนใชอํานาจอยางไมไดสัดสวน ซึ่งสงผลกระทบตอรัฐชาติ"
 CHI_reorganized_administration: "การบริหารที่จัดระเบียบใหม"
 CHI_reorganized_administration_desc: "เราไดหลอลื่นกลไกการบริหารใหทํางานไดอยางมีประสิทธิภาพยิ่งขึ้น ดวยการขจัดอุปสรรคที่ขวางทางเรา"
 CHI_switch_administration_modifiers_tt: "ยกระดับ §Y$CHI_corruption_in_the_administration$§! เปน §Y$CHI_reorganized_administration$§!"
 CHI_illicit_trade: "การคาผิดกฎหมาย"
 CHI_illicit_trade_desc: "ตลาดมืดและเครือขายลักลอบขนสินคาบอนทําลายอํานาจรัฐและรบกวนเสถียรภาพทางเศรษฐกิจ ความพยายามปราบปรามกิจกรรมเหลานี้ยังคงเปนไปอยางไรระบบ และอิทธิพลของการคาผิดกฎหมายยังคงขัดขวางความเปนเอกภาพของชาติและการปฏิรูป"
 CHI_inefficient_economy: "เศรษฐกิจที่ไรประสิทธิภาพ"
 CHI_inefficient_economy_desc: "อุตสาหกรรมของเรายังอยูในระยะเริ่มตน เพราะรัฐบาลชุดกอน ๆ ไมไดสนับสนุนการเติบโตอยางเหมาะสม อยางไรก็ตาม เราสามารถแกไขปญหานี้ไดดวยมาตรการทั้งภายในและภายนอก ศักยภาพของเรานั้นไรขีดจํากัดอยางแทจริง"
 CHI_neglected_countryside: "ชนบทที่ถูกละเลย"
 CHI_neglected_countryside_desc: "ทศวรรษหนานจิงไดนําความเปลี่ยนแปลงอันนาประทับใจมาสูสังคมของเรา แตความทันสมัยสวนใหญจํากัดอยูในเขตเมือง สวนชนบทถูกมองขาม ซึ่งอาจกลายเปนแหลงเพาะความคิดหัวรุนแรงได"
 CHI_corruption_in_the_armed_forces: "การทุจริตในกองทัพ"
 CHI_corruption_in_the_armed_forces_desc: "กองทัพปฏิวัติแหงชาติกําเนิดมาจากสมาชิกพรรค จึงแบกรับปญหาเดียวกับที่พรรคมี ระบบเสนสาย การติดสินบน และการยักยอกทรัพยแพรระบาด และหากเราจะเอาชนะ สิ่งเหลานี้ตองถูกกําจัดใหหมดสิ้น"
 CHI_blue_shirt_society: "สมาคมเสื้อนํ้าเงิน"
 CHI_blue_shirt_society_desc: "สมาคมปฏิบัติตามหลักไตรราษฎร หรือกลุมเสื้อนํ้าเงิน จะสองสวางเสนทางพิเศษของเรา และจะโคนลมผูที่ขวางทาง"
 CHI_ROCAF: "คณะกรรมาธิการกิจการการบิน"
 CHI_ROCAF_desc: "นับตั้งแตกอตั้งขึ้นในทศวรรษที่แลว คณะกรรมาธิการกิจการการบินคือองคกรที่เราจะใชยึดครองนานฟาของเรา แมจะยังไมใชกองทัพอากาศแบบรวมศูนย แตความกาวหนายังคงเดินหนาตอไป และดวยความวิริยะอุตสาหะ เราจะมีชัย"
 CHI_an_appropriate_design_tt: "[GetAppropriateDesign]"
 CHI_appropriate_design_offensive_idea: "การออกแบบเชิงรุก"
 CHI_appropriate_design_defensive_idea: "การออกแบบเชิงรับ"
 CHI_protracted_warfare_idea: "สงครามยืดเยื้อ"
 CHI_protracted_warfare_idea_desc: "กองทัพบางแหงเชื่อวาการโจมตีอยางรวดเร็วชนะไดทุกสงคราม แตบางแหงเขาใจวาการไมยอมใหพวกเขาไดสิ่งนั้นจะทําใหขวัญกําลังใจของพวกเขาพังทลาย ดวยการยืนหยัดใหนานกวาในทาทีตั้งรับ ผูรุกรานใดก็จะถูกตีถอยกลับไป"
 CHI_decisive_battle_idea: "ยุทธการชี้ขาด"
 CHI_decisive_battle_idea_desc: "ไมเคยมีชาติใดไดประโยชนจากสงครามยืดเยื้อ เราจึงตองเอาชนะศัตรูอยางรวดเร็วดวยการหาจุดที่จะทุมกําลังรุก การโจมตีจะตองรวดเร็วและหนักหนวง"
 CHI_gung_ho_idea: "ขบวนการกงเหอ"
 CHI_gung_ho_idea_desc: "ทรัพยากรอยางหนึ่งที่เรามีคือผูคน และเราไดจัดตั้งพวกเขาเปนสหกรณอุตสาหกรรมขนาดเล็ก องคกรระดับรากหญาเหลานี้จะใหความไดเปรียบทางเศรษฐกิจแกเราในความขัดแยงปจจุบัน"
 CHI_ROCN: "กองทัพเรือสาธารณรัฐจีน"
 CHI_ROCN_desc: "ดวยธรรมเนียมที่สืบยอนไปถึงสมัยราชวงศชิง กองทัพเรือกลางซึ่งหันมาสวามิภักดิ์ตอกกมินตั๋งหลังการยกทัพขึ้นเหนือ บัดนี้จะชวยใหเราแผอํานาจออกไปนอกแผนดินใหญได"
