stay_at_your_posts_navy_spirit_desc: "ตราบใดที่ใบจักรยังหมุนอยูหนึ่งใบและปนยังพนนํ้าอยูหนึ่งกระบอก เราก็ยังอยูในการรบ"
selective_engagement_navy_spirit: "การเลือกเขาปะทะ"
selective_engagement_navy_spirit_desc: "คนโงจะยืนนิ่งตอหนาศัตรูที่เหนือกวาและปลอยใหตนถูกทําลาย จงปฏิเสธการรบที่ไมอาจชนะ"
sea_lane_denial_navy_spirit: "การปดกั้นเสนทางเดินเรือ"
sea_lane_denial_navy_spirit_desc: "ไมมีอะไรกินเมนทะเล และมีเหตุผลที่ดีดวย"
underdog_mentality_navy_spirit: "จิตใจของผูเสียเปรียบ"
underdog_mentality_navy_spirit_desc: "ถาครั้งแรกไมสําเร็จ ก็ยิงตอรปโดอีกครั้ง"
cult_of_heroism_army_spirit: "ลัทธิบูชาวีรกรรม"
cult_of_heroism_army_spirit_desc: "ตลอดประวัติศาสตรจนถึงปจจุบัน ทั้งทหารและพลเมืองตางเชิดชูการเสียสละของสหายรวมรบ"