 wtt_border_conflict_won_attacker.1.t: "ชัยชนะใน [their_state.GetName]"
 wtt_border_conflict_won_attacker.1.desc: "การปะทะในเขตชายแดนระหวาง [our_state.GetName] และ [their_state.GetName] จบลงดวยชัยชนะอยางชัดเจนของกองกําลังเราเหนือกองกําลังของ [their_country.GetLeader] กองกําลัง[their_country.GetAdjective]ถอยกลับไปรวมพล และกองกําลังของเราไดเขาควบคุมพื้นที่พิพาทแลว"
 wtt_border_conflict_won_attacker.1.a: "เราไดแสดงพลังใหพวกเขาเห็นแลว!"
 wtt_border_conflict_won_defender.1.t: "ชัยชนะใน [their_state.GetName]"
 wtt_border_conflict_won_defender.1.desc: "การปะทะในเขตชายแดนระหวาง [our_state.GetName] และ [their_state.GetName] จบลงดวยชัยชนะอยางชัดเจนของกองกําลังเราเหนือกองกําลังของ [their_country.GetLeader] กองกําลัง[their_country.GetAdjective]ถอยกลับไปรวมพล และกองกําลังของเราไดเขาควบคุมพื้นที่พิพาทแลว"
 wtt_border_conflict_won_defender.1.a: "เราไดแสดงพลังใหพวกเขาเห็นแลว!"
 wtt_border_conflict_lost_attacker.1.t: "ความพายแพใน [our_state.GetName]"
 wtt_border_conflict_lost_attacker.1.desc: "กองกําลังภายใตการบัญชาการของ [their_country.GetLeader] ผลักดันเราออกจากพื้นที่พิพาทระหวาง [our_state.GetName] และ [their_state.GetName] ไดสําเร็จ กองกําลังของเราถอยรนอยางเปนระเบียบและกําลังจัดกําลังใหม เผื่อเราตองการกลับมาสูรบอีกครั้งในอนาคต"
 wtt_border_conflict_lost_attacker.1.a: "เราตองโจมตีตอบโตโดยเร็วที่สุด!"
 wtt_border_conflict_lost_defender.1.t: "ความพายแพใน [our_state.GetName]"
 wtt_border_conflict_lost_defender.1.desc: "กองกําลังภายใตการบัญชาการของ [their_country.GetLeader] ผลักดันเราออกจากพื้นที่พิพาทระหวาง [our_state.GetName] และ [their_state.GetName] ไดสําเร็จ กองกําลังของเราถอยรนอยางเปนระเบียบและกําลังจัดกําลังใหม เผื่อเราตองการกลับมาสูรบอีกครั้งในอนาคต"
 wtt_border_conflict_lost_defender.1.a: "เราตองโจมตีตอบโตโดยเร็วที่สุด!"
 wtt_border_conflict_canceled_attacker.1.t: "ภาวะชะงักงันใน [their_state.GetName]"
 wtt_border_conflict_canceled_attacker.1.desc: "การสูรบในพื้นที่ [our_state.GetName]-[their_state.GetName] หยุดชะงักลง เนื่องจากทั้งสองฝายไมสามารถผลักอีกฝายออกไปได ตางฝายตางไดดินแดนเพิ่มเพียงเล็กนอย หนวยลาดตระเวนรายงานวาทหาร[their_country.GetAdjective]อีกฝงกําลังขุดที่มั่นบนภูมิประเทศที่เหมาะแกการตั้งรับ ดูเหมือนพวกเขาตั้งใจจะรักษาดินแดนที่ยึดไดไว แตคงไมรุกเขามาที่แนวของเรา"
 wtt_border_conflict_canceled_attacker.1.a: "เราจะกลับมา"
 wtt_border_conflict_canceled_defender.1.t: "ภาวะชะงักงันใน [their_state.GetName]"
 wtt_border_conflict_canceled_defender.1.desc: "การสูรบในพื้นที่ [our_state.GetName]-[their_state.GetName] หยุดชะงักลง เนื่องจากทั้งสองฝายไมสามารถผลักอีกฝายออกไปได ตางฝายตางไดดินแดนเพิ่มเพียงเล็กนอย หนวยลาดตระเวนรายงานวาทหาร[their_country.GetAdjective]อีกฝงกําลังขุดที่มั่นบนภูมิประเทศที่เหมาะแกการตั้งรับ ดูเหมือนพวกเขาตั้งใจจะรักษาดินแดนที่ยึดไดไว แตคงไมรุกเขามาที่แนวของเรา"
 wtt_border_conflict_canceled_defender.1.a: "เราจะกลับมา"
 wtt_border_incident_defender_warning.1.t: "[From.GetNameDefCap]คุกคามพรมแดนของเรา"
 wtt_border_incident_defender_warning.1.desc: "เมื่อวานนี้ มีผูพบเห็นทหาร[their_country.GetAdjective]ขามพรมแดนจาก [attacker_state.GetName] เขามายัง [defender_state.GetName] ตลอดคืนที่ผานมา กองกําลัง[their_country.GetAdjective]หลั่งไหลเขามาในพื้นที่มากขึ้นและตั้งที่มั่นปองกันภายในดินแดนของเรา \n\nเหตุการณนี้เกิดขึ้นตอจากการปะทะยอยและการละเมิดพรมแดนหลายครั้งโดยกองกําลังภายใตการบัญชาการของ [their_country.GetLeader] ตลอดแนวพรมแดนรวมของเรา\n\nแตครั้งนี้เห็นไดชัดวากองกําลัง[their_country.GetAdjective]ตั้งใจจะอยูถาวร เราตองสงกําลังเขาไปในภูมิภาคโดยเร็วที่สุดเพื่อสกัดการรุกของพวกเขา"
 wtt_border_incident_defender_warning.1.a: "ระดมกําลังทั้งหมดที่มี!"
 wtt_border_conflict_escalate_to_war.1.t: "[From.GetNameDefCap]กําลังระดมพลเพื่อทําสงคราม"
 wtt_border_conflict_escalate_to_war.1.desc: "รายงานการลาดตระเวนระบุวากองกําลัง[From.GetAdjective]กําลังรวมพลใน [their_state.GetName] เพื่อปฏิบัติการใหญที่จะรุกลึกเขามาใน [our_state.GetName] เมื่อพิจารณาจากทรัพยากรที่ [From.GetLeader] ยอมทุมใหกับการผจญภัยครั้งนี้ ก็ชัดเจนวานี่ไมใชแคขอพิพาทเรื่องตําแหนงของเสนแบงเขตอีกตอไป\n\nสงครามเต็มรูปแบบกําลังใกลเขามา"
 wtt_border_conflict_escalate_to_war.1.a: "เราตองพรอมรับมือพวกเขา!"
