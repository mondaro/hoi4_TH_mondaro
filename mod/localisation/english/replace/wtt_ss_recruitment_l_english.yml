 ss_recruitment_event.10.t: "เหลานายพลประทวง"
 ss_recruitment_event.10.desc: "ในการประชุมกับ [GER.GetLeader] วันนี้ นายทหารระดับสูงของแวรมัคทจํานวนหนึ่งในกองบัญชาการสูงสุดแหงกองทัพแวรมัคท (Oberkommando der Wehrmacht) ไดแสดงความกังวลตอสิ่งที่พวกเขาเรียกวา "การเลือกที่รักมักที่ชังทางการเมือง" ที่เอื้อประโยชนให SS โดยเฉพาะอยางยิ่ง พวกเขาจับตาการเติบโตของกองกําลังติดอาวุธคูขนานอยางวาฟเฟน-SS ดวยความกังวลอยางลึกซึ้ง \n\nพวกเขาโตแยงตอไปวา กองพล SS ที่ไดรับยุทโธปกรณอยางฟุมเฟอยนั้นมีแตจะดึงทรัพยากรที่กองทัพปกติตองการอยางยิ่งออกไป \n\nทายที่สุด การรับสมัครแยกอิสระอาจนําไปสูสายการบังคับบัญชาที่แยกจากกัน ทําใหความพยายามแตกกระจาย ในขณะที่ตองรวมกําลังทั้งหมดเขาดวยกันเพื่อใหไดชัยชนะครั้งสุดทาย"
 ss_recruitment_event.10.a: "การแทรกแซงเรื่องการเมืองเชนนี้ไมสมควรกับนายทหารเยอรมัน"
 ss_recruitment_event.10.b: "ใหคํามั่นวา OKW มีอํานาจบัญชาการสูงสุดเหนือกองกําลัง SS ทั้งหมด"
 ss_recruitment_event.11.t: "นายพลลาออกเพื่อประทวง"
 ss_recruitment_event.11.desc: "[GER_SS_general_resigns.GetName] ลาออกจากตําแหนงทันทีโดยอางเหตุผลดานสุขภาพ อยางไรก็ตาม เปนความลับที่ใคร ๆ ก็รูวา [GER_SS_general_resigns.GetName] วิจารณนโยบายของรัฐบาลเกี่ยวกับวาฟเฟน-SS อยางเปดเผย โดยเฉพาะการตัดสินใจอนุญาตใหอาสาสมัครตางชาติรับราชการในกองพล SS มีรายงานวา [GER_SS_general_resigns.GetName] ยืนกรานที่จะกลาวอําลาทานผูนําดวยตนเอง ซึ่งนําไปสูการโตเถียงอยางดุเดือดระหวางทั้งสองเรื่องการจัดสรรทรัพยากรในความพยายามทําสงคราม \n\nนายทหารคนอื่น ๆ ในแวรมัคทอีกหลายคนไดแสดงความกังวลในทํานองเดียวกัน และบางคนบอกเปนนัยวาอาจพิจารณาลาออกตามเขาไป"
 ss_recruitment_event.11.a: "ดีแลว เขาไปกอนที่จะแพรความออนแอใหคนอื่น"
 ss_recruitment_event.11.b: "พยายามโนมนาวเขาวาหนาที่สําคัญเหนือสิ่งอื่นใด"
 ss_recruitment_event.12.t: "ขาวลือแผนสมคบคิดของแวรมัคท"
 ss_recruitment_event.12.desc: "เกสตาโปไดจัดทํารายงานฉบับใหมที่นาวิตกอยางยิ่ง ดูเหมือนวานายทหารระดับสูงของแวรมัคทกลุมหนึ่งไดเริ่มประชุมกันเปนประจําที่คฤหาสนหางไกลแหงหนึ่งในปรัสเซียตะวันออก \n\nการประชุมเหลานี้อําพรางเปนวงเลนไพบริดจธรรมดา และดําเนินมาอยางนอยหลายเดือนแลว โดยดูเหมือนจะมีเพียงนายทหารวงในที่คัดสรรมาเปนพิเศษ หนวยความมั่นคงยังไมสามารถสงคนเขาไปแทรกซึมได แตนายทหารทุกคนที่ยืนยันไดวาเกี่ยวของกับ "วงปรัสเซีย" นี้ ตางก็แสดงความรังเกียจรัฐบาลนาซีอยางเปดเผย โดยเฉพาะการตัดสินใจขยายวาฟเฟน-SS\n\nขณะนี้ยังมีขอบงชี้นอยมากวาเปาหมายสูงสุดของแผนสมคบคิดนี้คืออะไร หรือแทจริงแลวมีเปาหมายอยูหรือไม"
 ss_recruitment_event.12.a: "ก็แคทหารแก ๆ ไมกี่คนบนกันเทานั้น"
 ss_recruitment_event.12.b: "อบรม OKW ถึงความสําคัญของความภักดีในการตอสูเพื่อความอยูรอดของชาติ"
 ss_recruitment_event.13.t: "การลอบสังหาร [GER.GetLeader]"
 ss_recruitment_event.13.desc: "รายงานที่ยังไมไดรับการยืนยันจากกองบัญชาการทานผูนําระบุวามีผูจุดชนวนระเบิดระหวางการประชุมสถานการณที่ [GER.GetLeader] เขารวม ขอมูลยังมีนอย และเกิดความสับสนอยางมากทั้งในแวรมัคทและ SS โดยนายทหารทั้งสองฝายตางกลาวหาอีกฝายวาพยายามกอรัฐประหาร\n\nเราตองรอขอมูลเพิ่มเติม"
 ss_recruitment_event.13.a: "เราไดแตหวัง"
 ss_recruitment_event.14.t: "ปฏิบัติการวาลคิรี"
 ss_recruitment_event.14.desc: "กองกําลังบางสวนของแวรมัคทไดดําเนินปฏิบัติการวาลคิรี ซึ่งเปนแผนฉุกเฉินรับมือความไมสงบครั้งใหญในเยอรมนี หนวยทหารบกไดลอมกระทรวงตาง ๆ ของรัฐบาลหลายแหง และพยายามจับกุมเจาหนาที่ระดับสูงของพรรค มีรายงานการปะทะและยิงตอสูขนาดเล็กระหวางหนวยอารักขาของ SS กับหนวยทหารบกทั่วกรุงเบอรลิน ดูเหมือนวาแวรมัคทไดเรียกรองใหหนวย SS ทั้งหมดยุติการปฏิบัติการทันทีและสงมอบอาวุธ ซึ่งผูนํา SS ปฏิเสธอยางสิ้นเชิง\n\nทั้งสองฝายกําลังแยงชิงการควบคุมกรุงเบอรลิน บางสวนของแวรมัคทไดประกาศความภักดีตอ [GER.GetLeader] และจับอาวุธตอสูกับฝายกบฏ \n\nไฟสงครามครั้งนี้มีแตจะลุกลามออกไป"
 ss_recruitment_event.14.a: "ไอพวกทรยศ! ไอพวกไรนํ้ายา!"
 ss_recruitment_event.15.t: "[GER.GetLeader] รอดชีวิตจากการลอบสังหาร"
 ss_recruitment_event.15.desc: "โชคชะตา - หรือพระเจา - ดูเหมือนจะเขาขาง [GER.GetLeader] เพราะแรงระเบิดในกองบัญชาการทําใหเขาบาดเจ็บเพียงเล็กนอย แตผูอื่นหลายคนที่อยูใกลเขาไมโชคดีเชนนั้น\n\nหลังไดรับการรักษาแผลไฟไหมเล็กนอยและบาดแผลถลอก [GER.GetLeader] ไดพบกับตัวแทนของพรรค SS และเกสตาโปทันทีเพื่อหารือถึงขั้นตอนตอไป"
 ss_recruitment_event.15.a: "คนทรยศตองตายอยางคนทรยศ"
 ss_recruitment_event.15.b: "ใหพวกเขาไถโทษดวยการรับใชชาติ"
 ss_recruitment_event.20.t: "ฮิมมเลอรประทวง"
 ss_recruitment_event.20.desc: "มีรายงานวาในการประชุมสวนตัวระหวางไฮนริช ฮิมมเลอร กับ [GER.GetLeader] ไรชสฟอเรอร-SS ไดบนเสียงดังซํ้าแลวซํ้าเลาวาองคกรของเขาไมไดรับการสนับสนุนที่จําเปนตอการปฏิบัติหนาที่ปกปองพรรคและรัฐ เขายังเตือน [GER.GetLeader] ไมใหไวใจวาแวรมัคทจะจงรักภักดีตอไป \n\nมีเพียง SS เทานั้นที่ไววางใจไดวาจะสรางเยอรมนีใหมขึ้นมาได"
 ss_recruitment_event.20.a: "เขาลืมไปแลววาตัวเองอยูในฐานะอะไร"
 ss_recruitment_event.20.b: "กองกําลังที่เล็กลงจะทําใหมีเพียงคนที่ดีที่สุดของเราเทานั้นที่ไดสวมเสื้อคลุมแหงเกียรติยศนี้"
 ss_recruitment_event.21.t: "อัศวินแหงเวเวลสบวรก"
 ss_recruitment_event.21.desc: "มีรายงานวาฮิมมเลอรไดเรียกผูนําระดับสูงของ SS ไปยังปราสาทเวเวลสบวรกเพื่อปรึกษาหารือเรื่องเรงดวน ไมมีใครรูเนื้อหาที่แนชัดของการหารือ แตก็สมเหตุสมผลที่จะคิดวาเกี่ยวของกับความคับของใจที่ฮิมมเลอรมีตอผูนําพรรคอยางตอเนื่อง [GER.GetLeader] ดูเหมือนจะยังคงทําตามคําแนะนําของแวรมัคทในเรื่องการทหาร และขัดขวางความพยายามของฮิมมเลอรที่จะสรางและขยายกองกําลังติดอาวุธอิสระเพื่อเปนตัวถวงดุล\n\nมีขาวลือวาฮิมมเลอรหันไปมุงสรางสิ่งที่เขาเรียกวา "ภาคีอัศวินทิวทอนิกใหมเพื่อเยอรมนีใหม" แทน "อัศวิน" เหลานี้สาบานตนวาจะจงรักภักดีอยางคลั่งไคลและเชื่อฟงฮิมมเลอรเปนการสวนตัวโดยไมตั้งคําถาม และแตละคนจะไดรับดาบที่ทําตามแบบของฮิมมเลอร จากเหล็กกลาที่ผานการปลุกเสกดวยพิธีกรรมเจอรแมนิกโบราณ - ซึ่งคาดวาไวสําหรับสังหารศัตรูของเยอรมนีใหม"
 ss_recruitment_event.21.a: "ไรสาระสิ้นดี!"
 ss_recruitment_event.21.b: "เตือนฮิมมเลอรวาเขาควรจะจงรักภักดีตอใคร"
 ss_recruitment_event.22.t: "SS แทรกแซงเศรษฐกิจสงคราม"
 ss_recruitment_event.22.desc: "รัฐบาลไดรับคํารองเรียนจากผูจัดการโรงงานหลายแหง พวกเขาไดรับคําสั่งซื้อวัสดุจาก 'สํานักงานกอสรางและจัดซื้อของ SS' เมื่อสงมอบสินคาแลว พวกเขาถูกสงไปยัง 'สํานักงานกิจการการเงินของ SS' ซึ่งควรเปนผูจายเงิน แตกลับถูกสงตอไปยัง 'สํานักงานความรวมมือทางเศรษฐกิจของ SS' อีกทอดหนึ่ง ที่ซึ่งพวกเขาไดรับแจงวาสํานักงานแรกควรเปนผูจายเงินใหโดยตรง\n\nที่นาวิตกยิ่งกวานั้นคือวัสดุที่สั่งซื้อ - เครื่องจักรความแมนยําสูง สารเคมีปริมาณมากที่ใชผลิตปุย รวมถึงเหล็กกลาและแผนโลหะจํานวนหนึ่ง\n\nฮิมมเลอรปฏิเสธที่จะหารือเรื่องนี้กับเจาหนาที่รัฐบาล แตมีผูไดยินเขาพูดกับนายทหารประสานงานระดับสูงของ SS ในกระทรวงเศรษฐกิจวา 'ถา [GER.GetLeader] ไมยอมใหปนแกฉัน ฉันก็ตองสรางเอง ไมสนวาจะไดสิ่งที่ตองการมาจากไหนหรือดวยวิธีใด'"
 ss_recruitment_event.22.a: "นี่คงเปนแคความผิดพลาดทางบัญชีเทานั้น"
 ss_recruitment_event.22.b: "บังคับใหฮิมมเลอรสอบสวนอยางละเอียดและรายงานผลดวยตนเอง"
 ss_recruitment_event.23.t: "แผนสมคบคิดของฮิมมเลอร"
 ss_recruitment_event.23.desc: "แหลงขาวนิรนามระดับสูงภายใน SS ไดสงบันทึกภายในฉบับหนึ่งรั่วไหลมาถึงรัฐบาล เนื้อหาของมันไมตางอะไรกับระเบิด ตลอดหลายสิบหนา บันทึกนี้ระบุรายละเอียดวา SS จะใชอํานาจที่ลดลงแตยังคงมีอยูมากเพื่อยึดอํานาจรัฐบาลไดอยางไร 'ในกรณีที่ [GER.GetLeader] ทรยศตออุดมการณนาซี' บันทึกกลาวตอไปวา หลักฐานของการทรยศดังกลาวคือการขาดความมุงมั่นที่จะแทนที่องคกรเกาที่ลาสมัย เชน กองทัพบก ดวยกองกําลังใหมที่สรางขึ้นตามลักษณะนาซีที่ถูกตอง\n\nบันทึกนี้มีลายมือชื่อของไฮนริช ฮิมมเลอร"
 ss_recruitment_event.23.a: "เราไมอาจทาทาย SS ได"
 ss_recruitment_event.23.b: "ครั้งนี้เขาทําเกินไปแลว"
 ss_recruitment_event.23.c: "บางทีอาจหาทางประนีประนอมกันได?"
 ss_recruitment_event.24.desc: "มีรายงานจากกองบัญชาการทานผูนําวาเกิดความวุนวายบางอยางขึ้นระหวางการประชุมสวนตัวระหวาง [GER.GetLeader] กับไฮนริช ฮิมมเลอร รายละเอียดยังมีนอย แตหนวยขาวกรองทางทหาร อับแวร อางวาไดสกัดจับผูสงสารลับที่นําคําสั่งไปยังหนวย SS หลายหนวยทั่วเยอรมนี ใหเตรียมพรอมสําหรับสิ่งที่เรียกวา 'Fall Schwarz' ซึ่งกลาวกันวาเปนปฏิบัติการยึดจุดสื่อสารและโครงสรางพื้นฐานสําคัญในกรณีที่มีความพยายามกอรัฐประหารโดยกองทัพ"
 ss_recruitment_event.24.a: "ชะตากรรมของเยอรมนีแขวนอยูบนเสนดาย"
 ss_recruitment_event.25.desc: "โชคชะตาไดปกปอง [GER.GetLeader] ใหพนจากอันตรายอีกครั้ง ตามที่ทานผูนําเลาเอง ฮิมมเลอรชักปนออกมาจอเขาระหวางการประชุมสวนตัว พรอมตะโกนดาทอและสบถคําหยาบคาย ไรชสฟอเรอร-SS ซึ่งเห็นไดชัดวาถูกความกระหายอํานาจครอบงํา พยายามสังหาร [GER.GetLeader] แตปนขัดลํากลองและไมลั่น ในจังหวะชุลมุนนั้น ทานผูนําสามารถสยบฮิมมเลอรและตะโกนเรียกความชวยเหลือได มีรายงานวาตองใชทหารองครักษถึงสี่นายจึงจะควบคุมตัวฮิมมเลอรไวได\n\nขณะเดียวกันในสวนอื่น ๆ ของไรช เกิดการเผชิญหนาอยางตึงเครียดหลายครั้งระหวางหนวย SS กับหนวยทหารบกปกติ เมื่อฝายแรกพยายามยึดจุดสื่อสารสําคัญ แตทายที่สุดก็ถอนตัวออกไปหลังไดยินวา [GER.GetLeader] รอดชีวิต\n\nหนวยแวรมัคทไดลอมที่ทําการหลักและทรัพยสินของ SS ไว และกําลังรอคําสั่งจากเบอรลิน"
 ss_recruitment_event.25.a: "นาจะยิงทิ้งใหหมดตั้งแตหลายปกอน อยางที่สตาลินทํา!"
 ss_recruitment_event.25.b: "ถึงกระนั้น ก็ยังไมมีใครแตะตองพวกเขาได"
 ss_recruitment_event.26.t: "รัฐประหารของฮิมมเลอร"
 ss_recruitment_event.26.desc: "เมื่อควันในกองบัญชาการทานผูนําจางลง ไฮนริช ฮิมมเลอร กาวออกมาจากการยิงตอสูอันโกลาหลในฐานะผูรอดชีวิตเพียงคนเดียว ตามคําใหการของเขา ทานผูนําซึ่งเห็นไดชัดวาเสียสติ ไดประณามวาเขาเปนคนและทหารที่ลมเหลวโดยสิ้นเชิง เปนคนทรยศและสายลับที่ตองถูกยิงเปาตอนรุงสาง เมื่อตระหนักวาตนตองเลือกระหวางเกียรติสวนตัวกับความอยูรอดของชาติ ฮิมมเลอรจึงตัดสินใจลงมือทันทีและยิงเขา หลังจากนั้น ทหารองครักษของทานผูนําพยายามสังหารฮิมมเลอรในฐานะมือสังหาร มีเพียงการมาถึงอยางทันทวงทีของบอดี้การดของฮิมมเลอรเองเทานั้นที่ชวยชีวิตไรชสฟอเรอร-SS ไวได\n\n ทั่วทั้งเยอรมนี ขาวการเสียชีวิตของทานผูนํากลายเปนสัญญาณใหนําแผนที่เตรียมไวนานแลวมาปฏิบัติ ทั้งหนวย SS และหนวยทหารบกปกติตางเรงรุดเขายึดสะพาน ชุมสายโทรศัพท และทางแยก ขณะที่พลรมของลุฟทวัฟเฟอระดมพลอยางรวดเร็วเพื่อยึดสนามบินทั่วไรช\n\nเยอรมนียืนอยูบนปากเหวของสงครามกลางเมือง และทั้งสามฝายจะตองพึ่งพารัฐบาลพลเรือนในการบริหารประเทศจริง ๆ"
 ss_recruitment_event.26.a: "รัฐบาลจะหนุนหลังฮิมมเลอร"
 ss_recruitment_event.26.b: "รัฐบาลจะหนุนหลังเกอริง"
 ss_recruitment_event.26.c: "ขอใหแวรมัคทฟนฟูความสงบเรียบรอย"
