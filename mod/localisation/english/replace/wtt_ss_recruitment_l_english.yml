 ss_recruitment_event.7.desc: "ในการตอสูอันยิ่งใหญเพื่อความอยูรอดของชาติครั้งนี้ เราตองใชทุกทรัพยากรและทุกความไดเปรียบที่มี หนวย SS เชื่อวามีผูคนมากมายในลัตเวียที่ยินดีจับอาวุธขึ้นสูเคียงขางเราเพื่อตอตานภัยคุกคามของลัทธิบอลเชวิคสากล\n\nแมกองทัพแวรมัคทจะเห็นดวยในหลักการวาการรับสมัครอาสาสมัครที่เหมาะสมจํานวนหนึ่งอาจเปนประโยชน แตบรรดานายพลใน OKW ยืนกรานอยางหนักแนนวาอาสาสมัครตางชาติทั้งหมดควรอยูภายใตการบังคับบัญชาของกองทัพ - ไมใชของ SS"
