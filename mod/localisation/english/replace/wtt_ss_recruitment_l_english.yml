 ss_recruitment_event.1.t: "การรณรงครับสมัครในเดนมารก"
 ss_recruitment_event.1.desc: "ในการตอสูอันยิ่งใหญเพื่อความอยูรอดของชาติครั้งนี้ เราตองใชทุกทรัพยากรและทุกความไดเปรียบที่มี หนวย SS เชื่อวามีผูคนมากมายในเดนมารกที่ยินดีจับอาวุธขึ้นสูเคียงขางเราเพื่อตอตานภัยคุกคามของลัทธิบอลเชวิคสากล\n\nแมกองทัพแวรมัคทจะเห็นดวยในหลักการวาการรับสมัครอาสาสมัครที่เหมาะสมจํานวนหนึ่งอาจเปนประโยชน แตบรรดานายพลใน OKW ยืนกรานอยางหนักแนนวาอาสาสมัครตางชาติทั้งหมดควรอยูภายใตการบังคับบัญชาของกองทัพ - ไมใชของ SS"
 ss_recruitment_event.1.a: "ประนีประนอมดวยการรณรงครับสมัครในระดับปานกลาง"
 ss_recruitment_event.1.b: "ทุมทุนใหการรณรงครับสมัครครั้งใหญของ SS"
 ss_recruitment_event.1.c: "อนุญาตให OKW รับสมัครผูเชี่ยวชาญและบุคลากรสนับสนุนจํานวนเล็กนอย"
