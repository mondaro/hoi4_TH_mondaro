 SS_recruitment: "อาสาสมัครตางชาติ"
 SS_recruitment_desc: "หนวย SS ภายใตการนําของฮิมมเลอรเชื่อวาพวกเขาควรเปนผูรับผิดชอบการรับสมัครอาสาสมัครตางชาติเพื่อตอสูกับลัทธิบอลเชวิคสากล แตกองทัพแวรมัคทไมเห็นดวยอยางยิ่งและจะไมยอมใหมีสายการบังคับบัญชาซอนกัน การกดดันฝายใดฝายหนึ่งมากเกินไปอาจนําไปสูผลรายแรง\n\n§Yอารมณ§!ใน OKW ขณะนี้: [Root.GetWehrmachtAngerLevel] ([?GER.wehrmacht_anger|-0])\n\n§Yอารมณ§!ในหมูผูนํา SS ขณะนี้: [Root.GetSSAngerLevel] ([?GER.SS_anger|-0])"
