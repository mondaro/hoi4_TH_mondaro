 CAPITAL_BOX_TOOLTIP: "§Yแนวรบหลัก§!เปนกําลังยิงโดยตรงหลักของกองเรือ มักประกอบดวยเรือประจัญบานและเรือลาดตระเวนหนัก ทั้งยังปองกันไมใหเรือหลักของขาศึกยิงใส§Yเรือบรรทุกเครื่องบิน§!ฝายเราได"
 CARRIER_BOX_TOOLTIP: "§Yกลุมเรือบรรทุกเครื่องบิน§!เปนกําลังโจมตีระยะไกลหลักของกองเรือ เมื่อไดรับการคุมกันจากทั้ง§Yกลุมเรือคุมกัน§!และ§Yแนวรบหลัก§! เรือบรรทุกเครื่องบินก็สามารถสงเครื่องบินโจมตีขาศึกไดโดยไมถูกรบกวน หากมี§Yขบวนเรือลําเลียง§!อยูในการรบ ก็จะปรากฏในพื้นที่นี้ดวย"
