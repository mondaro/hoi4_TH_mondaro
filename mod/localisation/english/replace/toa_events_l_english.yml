l_english:
 
 south_american_news.1.t: "สงครามในอเมริกาใต"
 south_american_news.1.d: "ขอพิพาทในภูมิภาคนาโป ปาสตาซา และซานเตียโก ซาโมรา บนชายแดนเปรูกับเอกวาดอร ซึ่งยืดเยื้อมาตั้งแตกรานโกลอมเบียลมสลาย ไดนําไปสูการปะทะกันระหวางกองกําลังของสองประเทศ หลังการตกลงเรื่องพรมแดนกับโคลอมเบียเมื่อไมนานมานี้ ทหารเปรูมีความมั่นใจที่จะผลักดันการอางสิทธิ์ตอรัฐเอกวาดอรที่ออนแอกวา และการปะทะไดลุกลามเปนความขัดแยงเปดเผยแลว นี่จะเปนบททดสอบเสถียรภาพของภูมิภาค เพราะประเทศอื่นอาจพยายามเขาแทรกแซง"
 south_american_news.1.a: "อเมริกาใตจะเปนอยางไรตอไป?"
 south_american_news.1.b: "นี่จะเปนจุดเริ่มตนยุคใหมของรัฐเปรู!"
 south_american_news.1.c: "¡No pasarán!"

 south_american_events.1.t: "เตรราจัดการเลือกตั้งทั่วประเทศ"
 south_american_events.1.desc: "แมจะเปนผูเผด็จการที่กุมการเมืองของประเทศไวแนนหนา กาเบรียล เตรรา ไดประกาศจัดการเลือกตั้งอีกครั้ง อยางไรก็ตาม หลายคนรูผลลวงหนาแลว เพราะพรรคโกโลราโดจะไมยอมสละอํานาจ และอัลเฟรโด บัลโดมีร นองเขยของเตรรา คือผูสืบทอดตัวจริงเพียงคนเดียวในพรรค ถึงกระนั้น ประชาชนก็ออกไปลงคะแนนเพื่ออนาคตใหมของอุรุกวัย"
 south_american_events.1.a: "อัลเฟรโด บัลโดมีร จะสืบทอดตอจากเตรรา"
 south_american_events.1.b: "ไมรูอยางไร พรรคชาติกลับไดเปรียบ"
 south_american_events.1.c: "ประชาชนไดตัดสินแลว!"
 south_american_events.1.d: "เรามีแผนอื่นในใจ..."

 south_american_news.2.t: "ประธานาธิบดีคนใหมในอุรุกวัย"
 south_american_news.2.d: "กาเบรียล เตรรา ประธานาธิบดีแหงอุรุกวัย ประกาศเมื่อสัปดาหกอนวาจะจัดการเลือกตั้งและลงจากอํานาจ ซึ่งเปนการปกครองที่เขาขยายออกไปผานการรัฐประหารในป 1933 อํานาจจะสงตอใหนองเขยของเตรรา อัลเฟรโด บัลโดมีร เฟรรารี นักการเมืองผูนิยมฝายสัมพันธมิตร"
 south_american_news.2.a: "ดีสําหรับพวกเขา"
 south_american_news.2.b: "เราจะคิดถึงเขา"

 south_american_news.3.t: "ประธานาธิบดีคนใหมในอุรุกวัย"
 south_american_news.3.d: "กาเบรียล เตรรา ประธานาธิบดีแหงอุรุกวัย ประกาศเมื่อสัปดาหกอนวาจะจัดการเลือกตั้งและลงจากอํานาจ ซึ่งเปนการปกครองที่เขาขยายออกไปผานการรัฐประหารในป 1933 อํานาจจะสงตอใหหลุยส อัลแบรโต เด เอรเรรา ผูนําพรรคชาติแหงอุรุกวัย"
 south_american_news.3.a: "นาสนใจ"
 south_american_news.3.b: "นาประหลาดใจจริง ๆ แตก็นายินดี"

 south_american_news.4.t: "การปฏิวัติของประชาชนในอุรุกวัย"
 south_american_news.4.d: "กาเบรียล เตรรา ประธานาธิบดีแหงอุรุกวัย ประกาศเมื่อสัปดาหกอนวาจะจัดการเลือกตั้งและลงจากอํานาจ ซึ่งเปนการปกครองที่เขาขยายออกไปผานการรัฐประหารในป 1933 แตสิ่งที่เขาไมคาดคิดคือการสนับสนุนมหาศาลตอพรรคคอมมิวนิสต ซึ่งนําไปสูการรัฐประหารลมรัฐบาลที่เพิ่งตั้งขึ้นของอัลเฟรโด บัลโดมีร เฟรรารี ผูสืบทอดที่เขาแตงตั้งไว"
 south_american_news.4.a: "นี่สินะสิ่งที่ประชาชนทําได"
 south_american_news.4.b: "สาธารณรัฐประชาชนจงเจริญ!"

 south_american_news.5.t: "สมาพันธรัฐเปรู-โบลิเวียฟนคืนชีพแลว"
 south_american_news.5.d: "เปนครั้งแรกนับแตสงครามสมาพันธรัฐ ที่รัฐรวมเปรู-โบลิเวียลมสลายและเชื่อกันวาจะไมมีวันกลับมาอีก บัดนี้มันไดกลับมาแลว บางคนอางวานี่เปนเพียงฉากบังหนาเพื่อซอนความทะเยอทะยานแบบจักรวรรดินิยมของผูปกครองตัวจริง แตหลายคนก็หวังวาสมาพันธรัฐจะรวมประชาชนเปนหนึ่งไดอยางที่ไมเคยมีมากอน ที่แนนอนคือ สหภาพนี้จะคงอยูตอไป"
 south_american_news.5.a: "นี่จะเปลี่ยนดุลอํานาจในภูมิภาคอยางแนนอน"
 south_american_news.5.b: "เรายืนหยัดเปนหนึ่งเดียวอีกครั้ง!"

 south_american_news.6.t: "ฮิสปนโยลารวมเปนหนึ่ง"
 south_american_news.6.d: "แมจะมีประวัติศาสตรที่ยาวนานและคลายคลึงกัน แตฮิสปนโยลาฝงตะวันตกและตะวันออกไมไดรวมกันมานานแลว บัดนี้รัฐเฮติและสาธารณรัฐโดมินิกันไดรวมกันดวยเปาหมายรวมเพื่อความมั่งคั่งของเกาะ และกอตั้งรัฐฮิสปนโยลาขึ้น"
 south_american_news.6.a: "นั่นไมชวยพวกเขาหรอก"
 south_american_news.6.b: "ฮิสปนโยลาจงเจริญ!"

 south_american_events.2.t: "ทําใหกรมปนหนักแหงชาติมีความเชี่ยวชาญเฉพาะทาง"
 south_american_events.2.desc: "จากความพยายามลาสุดในการปรับปรุงการผลิตปนหนักใหทันสมัย ผูเชี่ยวชาญของเราไดขอสรุปแลว เราตองทําใหกรมอาวุธหนักมีความเชี่ยวชาญเฉพาะทาง หากไมตองการใหสายการผลิตไรประสิทธิภาพอยางยิ่งและเปนภัยตอความมั่นคงของชาติ เราควรเลือกอะไร?"
 south_american_events.2.a: "ปนใหญตองปรับปรุงใหทันสมัยอยูแลว"
 south_american_events.2.b: "เราตองปองกันตนเองจากศัตรูบนฟาได!"
 south_american_events.2.c: "เราตองหยุดรถถังใหตายคาที่ได"

 south_american_news.7.t: "เกียนารวมเปนหนึ่ง!"
 south_american_news.7.d: "ภูมิภาคเกียนาถูกแบงแยกโดยมหาอํานาจอาณานิคมผูยึดครองมานาน ครอบครองภูมิภาคยอยกาแยน กายอานา อามาปา ซูรินาม และกวายานา บัดนี้ประชาชนในภูมิภาคไดรวมตัวกันในการตอสูรวมกับจักรวรรดินิยม และประกาศวาจะทําลายทุกคนที่ขัดขวางการรวมชาติและเอกราชของพวกเขา"
 south_american_news.7.a: "ชวงเวลาที่นาสนใจ"
 south_american_news.7.b: "ในที่สุด เราก็หลุดพนจากพันธนาการของจักรวรรดินิยม!"

 south_american_events.10.t: "[FROM.GetName] ประกาศขยายกองทัพเรือ"
 south_american_events.10.d: "เมื่อรัฐบาล[FROM.GetAdjective]ประกาศวาตั้งใจจะขยายกองเรือดวยเรือหลักเพิ่มเติม ดูเหมือนวาดุลอํานาจอันเปราะบางในทวีปไดพังทลายลงแลว บัดนี้เราตองตัดสินใจวาจะรับมือกับภัยคุกคามที่กลับมาจากเพื่อนบานผูกาวราวของเราอยางไร"
 south_american_events.10.a: "เราจะไมยอมใหชาว[FROM.GetAdjective]เหนือกวาเรา!"

 south_american_news.10.t: "[FROM.GetName] จุดชนวนการแขงขันสะสมอาวุธทางทะเล"
 south_american_news.10.d: "แมจะไมมีสนธิสัญญาอยางเปนทางการที่หามการขยายกองทัพเรือ[BRA.GetAdjective] [CHL.GetAdjective] หรือ[ARG.GetAdjective] แตก็มีขอตกลงอยางไมเปนทางการมาตั้งแตมหาสงครามที่ปองกันการขยายกําลังครั้งใหญไว อยางไรก็ตาม เมื่อรัฐบาล[FROM.GetAdjective]ประกาศวาตั้งใจจะขยายขีดความสามารถทางเรือดวยเรือหลักเพิ่มเติม การแขงขันสะสมอาวุธครั้งใหมในอเมริกาใตก็ดูจะหลีกเลี่ยงไมได \n\nยังตองรอดูวาสิ่งนี้จะสงผลตอสถานการณภูมิรัฐศาสตรในวงกวางอยางไร แตคาดไดวาผูนําของมหาอํานาจทั้งหลายก็จะจับตาดูสถานการณอยางใกลชิดเชนกัน"
 south_american_news.10.a: "สิ่งนี้อาจทําใหภูมิภาคไรเสถียรภาพ"
 south_american_news.10.b: "นี่อาจเปนโอกาสขยายอิทธิพลของเราในภูมิภาค"

 south_american_events.11.t: "ความพยายามรัฐประหารโดยทหาร"
 south_american_events.11.d: "แมประธานาธิบดีเอวเซบิโอ อายาลา จะนําประเทศสูชัยชนะในสงครามกับโบลิเวียรวมกับโฆเซ เฟลิกซ เอสติการริเบีย มือขวาของเขา แตเขาและรัฐบาลก็ตองรับผิดชอบอยางมากที่ทําใหสงครามเกิดขึ้นตั้งแตแรก และความไมพอใจตอเขาก็แผไปทั่วประเทศ บัดนี้นายทหารจํานวนมากประกาศตนเปนปฏิปกษตอรัฐบาลเสรีนิยมที่นิ่งนอนใจและออนแอ และพันโทเฟเดริโก เวนมัน สมิธ กับคามิลโด เรกัลเด ไดยึดอะซุนซิออน และเรียกรองใหเอวเซบิโอ อายาลา ลาออกทันที!"
 south_american_events.11.a: "อายาลาตองลงจากตําแหนง เราปลอยใหเรื่องบานปลายไมได..."
 south_american_events.11.b: "ทําใหพวกมันชดใชที่คุกคามสาธารณรัฐของเรา!"
 higinio_and_estigarrabia_wont_cooperate: "นายพล §Yโฆเซ เฟลิกซ เอสติการริเบีย§! และ §Yอีฮินิโอ โมรินิโก§! จะ§Rไมใหความรวมมือ§!กับรัฐบาลใหมของเรา!"
 rafael_franco_is_exiled: "นายพล §Yราฟาเอล ฟรังโก§! ถูกเนรเทศ"

 south_american_news.8.t: "การปฏิวัติเดือนกุมภาพันธ"
 south_american_news.8.d: "เอวเซบิโอ อายาลา ประธานาธิบดีปารากวัย ไดลาออกอยางเปนทางการตามขอเรียกรองของนายทหารที่ยึดอะซุนซิออน เมืองหลวงของปารากวัย และอํานาจไดสงตอใหกลุมเฟเบรริสตาผูปฏิวัติ ภายใตการนําของนายพลราฟาเอล ฟรังโก หลังสงครามกับโบลิเวียหลายป ดูเหมือนชาวปารากวัยจะเบื่อหนายรัฐบาลที่ออนแอ เพราะผูคนจํานวนมากออกมาเฉลิมฉลองผูนําคนใหมบนทองถนน"
 south_american_news.8.a: "พวกเขายังรบกันไมพออีกหรือ?"
 south_american_news.8.b: "บัดนี้เรามีอิสระที่จะมุงสูอนาคตที่ดีกวา!"

 south_american_news.9.t: "การกบฏของนายทหารปารากวัยถูกปราบ"
 south_american_news.9.d: "เอวเซบิโอ อายาลา ประธานาธิบดีปารากวัย ประกาศวาเขาและกองรักษาการณสาธารณรัฐ ภายใตการนําของโฆเซ เฟลิกซ เอสติการริเบีย มือขวาของเขา ไดปราบปรามการกบฏและความพยายามรัฐประหารของนายทหารที่สนับสนุนกลุมเฟเบรริสตาผูปฏิวัติและผูนําของพวกเขา นายพลราฟาเอล ฟรังโก ไดสําเร็จ อยางไรก็ตาม ขณะนี้ประเทศอยูในสภาพที่ยํ่าแยยิ่งกวาเมื่อไมกี่เดือนกอนตอนที่สงครามชาโกสิ้นสุดลง และดูเหมือนประเทศยังอีกยาวไกลกวาจะกลับมาเปนปกแผน"
 south_american_news.9.a: "ไมรูวาประชาชนของพวกเขารูสึกอยางไรกับเรื่องนี้?"
 south_american_news.9.b: "หวังวานี่จะเปนครั้งสุดทายที่เราเห็นพวกกบฏเหลานั้น..."

 south_american_events.12.t: "เฆรมัน บุช เคลื่อนไหวโคนลมรัฐบาล"
 south_american_events.12.d: "หลังขบวนการนัดหยุดงานครั้งใหญที่สุดเทาที่ประเทศเคยมีมา กองทัพภายใตพันโทหนุมเฆรมัน บุช ไดเคลื่อนกําลังโคนลมรัฐบาลของเตฆาดา พวกเขาอางวา ตางจากเตฆาดา พวกเขายืนอยูขางประชาชนโบลิเวียและอุดมคติสังคมนิยมของพรรคสังคมนิยมรวมและสหภาพแรงงาน จะมีอะไรหยุดพวกเขาไดหรือไม หรือสายเกินไปแลว เมื่อพิจารณาถึงหายนะของสงครามชาโก?"
 south_american_events.12.a: "เตฆาดา ซอรซาโน ตองประกาศลาออกตอสาธารณชน"
 south_american_events.12.b: "ปราบการกบฏของพวกมันเดี๋ยวนี้!"
 german_busch_and_gualberto_imprisoned: "นายพล §Yเฆรมัน บุช§! และ §Yกวาลเบรโต บิยารโรเอล โลเปซ§! ถูกจําคุก"

 south_american_news.11.t: "การปฏิวัติสังคมนิยมโบลิเวียป 1936"
 south_american_news.11.d: "หลังขบวนการนัดหยุดงานครั้งใหญที่สุดเทาที่โบลิเวียเคยมีมา กองทัพภายใตพันโทหนุมเฆรมัน บุช ไดเคลื่อนกําลังโคนลมรัฐบาลพรรครีพับลิกันแทของโฆเซ ลุยส เตฆาดา ซอรซาโน พวกเขาอางวา ตางจากเตฆาดา พวกเขายืนอยูขางประชาชนโบลิเวียและอุดมคติสังคมนิยม และบัดนี้เมื่อเตฆาดาลาออกแลว พวกเขาก็เขาควบคุมโบลิเวียอยางเบ็ดเสร็จ"
 south_american_news.11.a: "เผด็จการทหารเปนสังคมนิยมตรงไหน?"
 south_american_news.11.b: "เราจะควาโอกาสนี้ไว!"

 south_american_news.12.t: "นายพลโบลิเวียทํารัฐประหารพลาด"
 south_american_news.12.d: "หลังขบวนการนัดหยุดงานครั้งใหญที่สุดเทาที่โบลิเวียเคยมีมา กองทัพภายใตพันโทหนุมเฆรมัน บุช ไดเคลื่อนกําลังโคนลมรัฐบาลพรรครีพับลิกันแทของโฆเซ ลุยส เตฆาดา ซอรซาโน พวกเขาอางวา ตางจากเตฆาดา พวกเขายืนอยูขางประชาชนโบลิเวียและอุดมคติสังคมนิยม แตเมื่อยึดลาปาซไมสําเร็จ ตํารวจและทหารที่เหลืออยูก็ตามลากลุมของพวกเขาและจับกุมผูนําเขาคุก"
 south_american_news.12.a: "ถาเปนขาคงไมทําแบบนั้น"
 south_american_news.12.b: "เราไดยุติการกอรัฐประหารอันชั่วชาของพวกมันแลว!"

 south_american_events.13.t: "แผนดินไหวครั้งใหญที่ชิยัน"
 south_american_events.13.d: "เมื่อเวลา 23:32 น. ของเมื่อวาน แผนดินใตเมืองชิยันเริ่มสั่นสะเทือนอยางรุนแรง ทําลายเมืองไปกวาครึ่ง เวลา 23:35 น. กอนเซปซิออนก็ถูกถลมอยางรุนแรง อาคารเกือบทั้งหมดพังทลายราบคาบ คาดวาแผนดินไหวครั้งนี้มีขนาดคลื่นพื้นผิว 8.3 และความรุนแรงเมรกัลลีสูงสุดระดับ X มีผูเสียชีวิตราว 28000 คน และอีกมากมายที่ไรที่อยูหรือไดรับบาดเจ็บ วันนี้เปนวันอันมืดมนของประชาชนชิลี"
 south_american_events.13.a: "เราตองชวยเหลือประชาชน!"
 south_american_events.13.b: "เรามีปญหาที่ใหญกวานี้"

 south_american_news.13.t: "ผลพวงจากแผนดินไหวที่ชิยัน"
 south_american_news.13.d: "แผนดินไหวขนาด 8.3 ความรุนแรงเมรกัลลีสูงสุดระดับ X ทําใหเมืองชิยันและกอนเซปซิออนของชิลีพังพินาศสิ้นเชิง มีผูเสียชีวิตกวา 28000 คน การฟนฟูและบรรเทาทุกขกําลังดําเนินไป แตผูคนจํานวนมากไรที่อยูแลว และประเทศตาง ๆ ในภูมิภาคยังไมแนใจวาจะแกปญหาที่ยังคงอยูนี้อยางไรดีที่สุด"
 south_american_news.13.a: "นาสยดสยอง"

 south_american_events.14.t: "การเลือกตั้งประธานาธิบดีป 1938"
 south_american_events.14.d: "การเลือกตั้งประธานาธิบดีมาถึงในที่สุด และวาระสุดทายของประธานาธิบดีอารตูโร อาเลสซันดรี ก็สิ้นสุดลง ประเทศยังคงเผชิญความไมพอใจและลัทธิหัวรุนแรงที่เพิ่มขึ้นทั้งฝายขวาและฝายซาย และไมมีใครรูคําตอบที่แนชัดในการกอบกูประเทศจากหายนะทางเศรษฐกิจ ใครควรรับชวงตอจากอาเลสซันดรีและนําประเทศสูอนาคต?"
 south_american_events.14.a: "เปโดร อากีรเร เซรดา"
 south_american_events.14.b: "กุสตาโว รอสส"
 south_american_events.14.c: "การโลส อิบาเญซ เดล กัมโป"
 south_american_events.14.e: "เอเลียส ลาแฟรเต กาบิโญ"

 south_american_events.15.t: "กองทัพกอกบฏ"
 south_american_events.15.desc: "หลังราฟาเอล ฟรังโก ลงนามคําสั่งฝายบริหารหลายฉบับเพื่อเพิ่มอํานาจประธานาธิบดี รวมถึงสละที่มั่นแนวหนาในพื้นที่ชาโกโบเรอัลสวนที่นานาชาติรับรองวาเปนของโบลิเวีย กองทัพบางสวนไดกอกบฏตอรัฐบาลและพยายามโคนเขาลง สิ่งที่พวกเขาทํานั้นชอบธรรมหรือไม?"
 south_american_events.15.a: "พยายามหยุดพวกเขาไปก็ไรประโยชน..."
 south_american_events.15.b: "ทําลายพวกมัน!"

 south_american_news.14.t: "อีฮินิโอ โมรินิโก ยึดอํานาจในปารากวัย"
 south_american_news.14.desc: "หลังความไมพอใจตอผูนําประเทศที่เพิ่มขึ้น กองทัพไดลงมือและแตงตั้งนายพลอีฮินิโอ โมรินิโก เปนประธานาธิบดีคนใหมของปารากวัย เขาเห็นอกเห็นใจฝายฟาสซิสต และมีแนวโนมจะเขาหาอารเจนตินาเพื่อการคุมครองและชวยเหลือซึ่งกันและกัน ซึ่งก็นาจะทําใหบราซิลพยายามกระชับพันธมิตรของตนเพื่อความมั่นคง ในกรณีที่ปารากวัยหรืออารเจนตินารุกราน"
 south_american_news.14.a: "สุนัขรับใชฟาสซิสตอีกตัว"
 south_american_news.14.b: "อนาคตของเราอยูกับเยอรมัน"

 south_american_events.16.t: "การเฉลิมฉลองวันแหงทะเล"
 south_american_events.16.desc: "ตามธรรมเนียมนับตั้งแตเสียจังหวัดลิโตรัลใหชิลีในสงครามแปซิฟกชวงปลายคริสตศตวรรษที่ 19 วันนี้มีการจัดงานเฉลิมฉลองวันแหงทะเลประจําป เพื่อรําลึกถึงวีรบุรุษโบลิเวียที่เคยสูกับชิลี หลายคนมองวานี่เปนโอกาสยํ้าการอางสิทธิ์ในการเขาถึงมหาสมุทรแปซิฟก ซึ่งเราเสียไปเมื่อกลายเปนประเทศไรทางออกทะเลหลังสงคราม เราควรปลอยใหประชาชนประทวงหรือไม?"
 south_american_events.16.a: "ปลอยใหประชาชนทําตามที่ตองการ"
 south_american_events.16.b: "เราตองปราบปรามความโงเขลานี้"
 south_american_events.16.c: "พวกเขาคิดถูกแลว"
 south_american_events.17.t: "[PRU.GetNameDefCap] เสนอสันติภาพขาวแลกกับปาสตาซา"
 south_american_events.17.desc: "เมื่อไมนานมานี้มีหนังสือแจงที่ไมคาดคิดมาจากนักการทูต[PRU.GetAdjective] ในนั้นมีขอเสนอสันติภาพแบบมีเงื่อนไข เรายกปาสตาซาให และพวกเขาจะถอนกําลังออกจากสวนที่เหลือของประเทศเรา เราตองพิจารณาเรื่องนี้อยางรอบคอบ วาจะสูตอเพื่อแผนดินของเรา หรือรับสันติภาพแตตองยกดินแดนบางสวน"
 south_american_events.17.a: "ประเทศของเราตองการสันติภาพ!"
 south_american_events.17.b: "เราจะสูเพื่อปาสตาซา!"
 south_american_events.18.t: "[ECU.GetNameDefCap] ยกปาสตาซาแลกสันติภาพ"
 south_american_events.18.desc: "เปนที่พอใจของเรายิ่งนักที่ [ECU.GetNameDef] ตัดสินใจยกปาสตาซาแลกกับสันติภาพขาว เราไดผนวกรัฐนี้อยางคอนขางสันติ และเริ่มดําเนินการผนวกรวมแลว นี่คือจุดเริ่มตนใหมของรัฐปาสตาซา!"
 south_american_events.18.a: "ในที่สุด!"
 south_american_events.19.t: "[ECU.GetNameDefCap] ปฏิเสธที่จะยกดินแดน"
 south_american_events.19.desc: "[ECU.GetNameDefCap] ตอบปฏิเสธขอเสนอสันติภาพของเรา โดยอางวาบูรณภาพแหงดินแดนของพวกเขาไมใชเรื่องที่จะตอรองได และเลือกจะสูตอทั้งที่สถานการณในสงครามเปนอยูเชนนี้ พวกเขาไมเหลือทางเลือกใหเรานอกจากตองสูตอ"
 south_american_events.19.a: "นาเสียดายจริง..."
 south_american_events.20.t: "[PRU.GetNameDefCap] เสนอโลเรโตแลกกับสันติภาพ"
 south_american_events.20.desc: "เมื่อไมนานมานี้มีหนังสือแจงที่ไมคาดคิดมาจากนักการทูต[PRU.GetAdjective] ในนั้นมีขอเสนอสันติภาพแบบมีเงื่อนไข พวกเขายกโลเรโตใหเรา และเราถอนกําลังออกจากสวนที่เหลือของประเทศพวกเขา เราตองพิจารณาเรื่องนี้อยางรอบคอบ วาจะพอใจกับสิ่งที่มีอยูตอนนี้ หรือจะสูตอดวยหวังวาจะไดดินแดนเพิ่มอีก"
 south_american_events.20.a: "ขอตกลงที่ยุติธรรม พวกเขาไดบทเรียนแลว"
 south_american_events.20.b: "ทําไมตองพอใจแคนี้ ในเมื่อเรายึดดินแดนของพวกเขาไดมากกวานี้?"
 south_american_events.21.t: "[ECU.GetNameDefCap] ยอมรับขอเสนอสันติภาพของเรา"
 south_american_events.21.desc: "[ECU.GetNameDefCap] ตอบรับขอเสนอสันติภาพขาวของเรา นาเสียดายที่ตองแลกมาดวยราคาสูง เพราะเราตองยกโลเรโตใหผูนํา[ECU.GetAdjective]"
 south_american_events.21.a: "เราเลือกทางที่เลวรายนอยกวา"
 south_american_events.22.t: "[ECU.GetNameDefCap] ปฏิเสธขอเสนอสันติภาพของเรา"
 south_american_events.22.desc: "[ECU.GetNameDefCap] ตอบปฏิเสธขอเสนอสันติภาพขาวของเรา จากสถานการณปจจุบัน ชาว[ECU.GetAdjective]ไมเห็นเหตุผลที่จะหยุดสู พวกเขาไมเหลือทางเลือกใหเรานอกจากตองสูตอ"
 south_american_events.22.a: "นั่นไมคอยดีนัก..."

 south_american_events.30.t: "แรงกดดันใหโดดเดี่ยว [FROM.GetNonIdeologyName]"
 south_american_events.30.desc: "หลังรัฐบาล[FROM.GetAdjective]ถูกกองกําลังคอมมิวนิสตโคนลมเมื่อไมนานมานี้ แรงกดดันใหตอบโตอยางเด็ดขาดก็ทวีขึ้นทั่วประเทศของเรา สื่อเต็มไปดวยรายงานเกินจริงเรื่องภัยแดงและภัยคุกคามที่ [FROM.GetNonIdeologyName] มีตอผลประโยชนของเรา ขณะเดียวกัน เจาของธุรกิจก็เรียกรองการชดใชสําหรับเงินลงทุนที่สูญไปในประเทศนั้น \n\nเราตองลงมืออยางรวดเร็วเพื่อสงบประชาชน และสงสารที่ชัดเจนถึง [FROM.GetNonIdeologyName] วาเราจะไมยอมใหมีคอมมิวนิสตในซีกโลกนี้"
 south_american_events.30.a: "โดดเดี่ยวพวกเขาทั้งทางเศรษฐกิจและการทูต"
 south_american_events.30.b: "ตัดความสัมพันธทางการทูต"
 south_american_events.30.c: "เรามีเรื่องเรงดวนกวานี้"

 south_american_events.31.t: "[FROM.GetNameDefCap] พยายามโดดเดี่ยว [ROOT.GetNonIdeologyName]"
 south_american_events.31.desc.a: "วันนี้นักการทูต[FROM.GetAdjective]ออกจากสถานทูตใน [ROOT.Capital.GetCapitalVictoryPointName] หลังออกแถลงการณอยางแข็งกราวจากรัฐบาลของพวกเขา ระบุวาจะไมใหความชวยเหลือเราอีกตอไปหากเราเกิดความขัดแยงกับชาติอื่น และไมยอมรับเราเปนรัฐบาลโดยชอบธรรมของประเทศ\n\nยิ่งไปกวานั้น พวกเขายังควํ่าบาตรเราเพื่อบั่นทอนเศรษฐกิจของเรา แมจะเห็นไดชัดอยูแลววา [FROM.GetNameDef] จะเปนปฏิปกษตอระบอบของเรา แตความรวดเร็วและความแข็งกราวของการกระทําครั้งนี้ก็สรางความตกตะลึงใหหลายคน"
 south_american_events.31.desc.b: "วันนี้นักการทูต[FROM.GetAdjective]ออกจากสถานทูตใน [ROOT.Capital.GetCapitalVictoryPointName] หลังออกแถลงการณอยางแข็งกราวจากรัฐบาลของพวกเขา ระบุวาจะไมใหความชวยเหลือเราอีกตอไปหากเราเกิดความขัดแยงกับชาติอื่น และไมยอมรับเราเปนรัฐบาลโดยชอบธรรมของประเทศ \n\nแมจะเห็นไดชัดอยูแลววา [FROM.GetNameDef] จะเปนปฏิปกษตอระบอบของเรา แตความรวดเร็วและความแข็งกราวของการกระทําครั้งนี้ก็สรางความตกตะลึงใหหลายคน"
 south_american_events.31.a: "พวกจักรวรรดินิยมผูโอหัง!"

 south_american_events.32.t: "สนับสนุนฝายตอตานคอมมิวนิสตใน [FROM.GetNonIdeologyName]"
 south_american_events.32.desc: "ขณะที่ [FROM.GetNonIdeologyName] เพิ่งลมสลายเขาสูสงครามกลางเมือง นักอุตสาหกรรมและพลเมืองของเราจํานวนมากกําลังรวบรวมความชวยเหลือใหรัฐบาล[FROM.GetAdjective]ที่กําลังลําบาก ขณะที่พยายามสกัดภัยคอมมิวนิสต\n\nบรรดาผูตอตานคอมมิวนิสตที่แข็งขันในกองทัพบางคนเสนอใหใชโอกาสนี้ติดอาวุธและสงอาสาสมัครทหารไปชวยในความขัดแยง โดยที่รัฐบาลยังสามารถปฏิเสธความเกี่ยวของไดอยางแนบเนียน"
 south_american_events.32.a: "เราจะทําเปนมองไมเห็นอาสาสมัครที่มียุทโธปกรณครบครันซึ่งเดินทางไปยัง[FROM.GetNonIdeologyName]"
 south_american_events.32.b: "เราไมอาจเขาไปแทรกแซงได"
 south_american_events_32_tt: "§Rเราจะสงอาสาสมัครไดยากเนื่องจากนโยบาย§! §Y$undisturbed_isolation$§! §Rและเกณฑความตึงเครียดของโลก!§!"

 south_american_events.50.t: "[FROM.FROM.GetNameDefCap]ถูกโจมตี"
 south_american_events.50.desc: "พันธสัญญาของเราตอลัทธิมอนโรกําลังถูกตั้งคําถาม หลังจากที่มีการประกาศสงครามกับ[FROM.FROM.GetNameDef]เมื่อไมนานมานี้ แมพลเมืองของเราจํานวนมากจะไมกระตือรือรนนักกับการถูกสงไปสูรบเพื่อปกปอง[FROM.FROM.GetNonIdeologyName] แตผูเชี่ยวชาญดานนโยบายตางประเทศของเราแสดงความกังวลวา หากเราไมลงมือปกปองพวกเขา อาจเกิดปฏิกิริยาลูกโซที่มหาอํานาจตางชาติเขามาแทรกแซงในซีกโลกของเรา"
 south_american_events.50.a: "เรียกรองใหยุติการสูรบกับ[FROM.FROM.GetNonIdeologyName]"
 south_american_events.50.b: "ทําไมทหารของเราตองไปตายเพื่อ[FROM.FROM.GetNonIdeologyName]ดวย?"
 south_american_events_50_war_tt: "§Rจะนําไปสูสงครามกับ[FROM.GetName]หากพวกเขาปฏิเสธ!§!"

 south_american_events.51.t: "[USA.GetNameDefCap]บังคับใชลัทธิมอนโร"
 south_american_events.51.desc: "นักการทูตของเราหวังวา[USA.GetNameDef]จะทําเปนมองไมเห็นกิจกรรมของเราในทวีปอเมริกา แตดูเหมือนเราจะไมโชคดีขนาดนั้น บัดนี้เราไดรับสาสนดวนจาก[USA.Capital.GetCapitalVictoryPointName] เรียกรองใหเรายุติการกระทําที่เปนปฏิปกษทั้งหมดในซีกโลกนี้ มิฉะนั้นพวกเขาจะถือวาเปนการประกาศสงครามตอ[USA.GetNameDef] เราจะตองเดินหมากอยางระมัดระวังหากตองการหลีกเลี่ยงไมใหความขัดแยงนี้บานปลาย"
 south_american_events.51.a: "เราไมประสงคจะขัดแยงกับ[USA.GetNameDef]"
 south_american_events.51.b: "เรื่องนี้ไมเกี่ยวกับพวกเขา ลองดูวาพวกเขาแคขูหรือไม"

 south_american_events.52.t: "[FROM.GetNameDefCap]ยอมยุติการสูรบ"
 south_american_events.52.desc: "นักการทูต[FROM.GetAdjective]แจงเราวาพวกเขาพรอมยุติการสูรบในซีกโลกตะวันตก และหันกลับมาใชวิถีทางการทูตเพื่อแกไขปญหาไปพลางกอน สวนสันติภาพที่เราเปนตัวกลางนี้จะยั่งยืนหรือไม ยังตองรอดูกันตอไป"
 south_american_events.52.a: "โลกจะตองคิดใหดีกอนบุกรุกหลังบานของเรา"
 south_american_events.52.b: "ขอบคุณลุงแซม"

 south_american_events.53.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะยุติการสูรบ"
 south_american_events.53.desc: "นักการทูต[FROM.GetAdjective]แจงเราวา[USA.GetNameDef]ไมมีสิทธิ์เขามาแทรกแซงขอพิพาทที่พวกเขาอางวาชอบธรรมของรัฐบาลพวกเขา ดวยเหตุนี้ พวกเขาจึงประกาศวาจะยังคงดําเนินการตามผลประโยชนของตนในซีกโลกตะวันตกตอไปตราบเทาที่เห็นวาจําเปน"
 south_american_events.53.a: "ถาอยางนั้นก็ตองเปนสงคราม..."

 south_american_events.54.t: "[FROM.GetNameDefCap]บังคับใชลัทธิมอนโร"
 south_american_events.54.desc: "เราไดรับสาสนดวนจาก[FROM.Capital.GetCapitalVictoryPointName] ระบุวาพวกเขาจะไมยอมใหมีการรุกรานตอเรา และกําลังเจรจากับศัตรูของเราเพื่อใหยุติการสูรบ หากไมสําเร็จ พวกเขาใหคํามั่นวาจะเขามาปกปองเรา"
 south_american_events.54.a: "ยอดเยี่ยม!"

 south_american_events.55.t: "[FROM.GetNameDefCap]เพิกเฉยตอความขัดแยง"
 south_american_events.55.desc: "สถานทูต[FROM.GetNameDefCap]ใน[ROOT.Capital.GetCapitalVictoryPointName]ไดอพยพออกไปเมื่อชวงเชาวันนี้ เนื่องจากการสูรบที่เกิดขึ้นในภูมิภาค นักการทูตของสถานทูตแจงเราวารัฐบาลของพวกเขาไมประสงคจะเขาไปพัวพันกับสงครามตางแดนอีกครั้ง"
 south_american_events.55.a: "งั้นเราก็ตองสูตามลําพังสินะ..."

 south_american_news.60.t: "กองทัพ[BRA.GetAdjective]กอรัฐประหาร"
 south_american_news.60.desc: "แมประธานาธิบดี$BRA_getulio_vargas$จะพยายามเอาใจกลุมตางๆ ในกองทัพและขบวนการอินเตกราลิสตา แตฝายทหารก็หมดความอดทนกับความลาชาในการปฏิรูปของประธานาธิบดีผูกําลังลําบาก และตัดสินใจลงมือเอง ในปฏิบัติการทางทหารอันรวดเร็ว โครงสรางพื้นฐานและระบบสื่อสารสําคัญทั่วประเทศถูกยึดไวได กอนที่ทหารจะบุกเขาทําเนียบกาเตชีในรีโอเดจาเนโร และจับกุมตัว$BRA_getulio_vargas$ได\n\nแมยังตองรอดูวาการเมืองของประเทศภายใตการปกครองของทหารจะเปลี่ยนแปลงไปอยางไร แตสิ่งหนึ่งที่แนนอนคือรัฐบาลใหมจะใชไมแข็งกับทุกความเคลื่อนไหวของฝายคอมมิวนิสตในหมูประชาชน"
 south_american_news.60.a: "บราซิลจะมีวันสงบสุขบางไหม?"

#### Chile #####

 CHL_political_events.1.t: "[CHL.GetNameDefCap]เสนอพันธมิตรรวมกัน"
 CHL_political_events.1.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]เสนอใหยื่นสมัครเขารวมฝายสัมพันธมิตรรวมกัน เพื่อปกปองนานนํ้าและดินแดนของเรา โดยที่ไมตองตีตัวออกหางจากความเปนพันธมิตรใกลชิดของกันและกัน และไมทําลายความสัมพันธอันดีระหวางสองประเทศ การตอบรับคําขอของพวกเขานาจะเปนทางเลือกที่ฉลาด"
 CHL_political_events.1.a: "เราไมเห็นวาจะเสียหายตรงไหน"
 CHL_political_events.1.b: "พวกเขาบาไปแลวหรือ!?"

 CHL_political_events.2.t: "คําขอรวมของอารเจนตินาและชิลี"
 CHL_political_events.2.desc: "ชิลีและอารเจนตินา สองประเทศแหงอเมริกาใต ไดยื่นคําขอรวมกันเพื่อเขารวมฝายของเรา พวกเขาระบุวาตองการชวยเหลือเรา ขณะเดียวกันก็ปกปองผลประโยชนของตนเองไปดวย เราจะวาอยางไร?"
 CHL_political_events.2.a: "ยินดีตอนรับพวกเขา"
 CHL_political_events.2.b: "ไม เราขอปฏิเสธ!"

 CHL_political_events.3.t: "[ARG.GetName]ปฏิเสธคําขอของเรา"
 CHL_political_events.3.desc: "[ARG.GetLeader]ผูชั่วรายไดปฏิเสธคําขออันชอบธรรมและสมเหตุสมผลของเราในการยื่นสมัครเขารวมฝายสัมพันธมิตรรวมกัน ถึงเวลาที่เขาตองตระหนักแลววาตนไดพลาดอะไรไป อยางไรเสียเราก็แข็งแกรงพอดวยตัวเอง และไมเคยตองพึ่งพวกเขาตั้งแตแรกอยูแลว..."
 CHL_political_events.3.a: "ถาเชนนั้นพวกเขาก็คือศัตรูของเราอยางไมตองสงสัย"

 CHL_political_events.4.t: "[CHL.GetName]เคลื่อนกําลังเขายึดครอง[953.GetName]"
 CHL_political_events.4.desc: "กองทหารของรัฐ[CHL.GetAdjective]เริ่มรุกขามพรมแดนที่เคยกําหนดไวใน[953.GetName] และกองทัพอากาศกับกองทัพเรือของพวกเขาก็ระดมพลพรอมแลว ดูเหมือนพวกเขาจะเอาจริงกับการยึดเกาะพิพาทแหงนี้ และไมแนชัดวา ณ จุดนี้เราจะยับยั้งเรื่องนี้ดวยการไกลเกลี่ยไดหรือไม เราควรทําอยางไรดี?"
 CHL_political_events.4.a: "สูกับพวกเขาไปก็ไรประโยชน"
 CHL_political_events.4.b: "แนจริงก็มาเอาไปสิ!"

 CHL_political_events.5.t: "[ARG.GetName]ถอนตัวออกจาก[953.GetName]"
 CHL_political_events.5.desc: "[ARG.GetName]ตัดสินใจวาการยึด[953.GetName]ไวตอหนาแสนยานุภาพของเรานั้นไมคุมกับความเจ็บปวด และมีผูพบเห็นวาพวกเขากําลังถอนทหารออกจากพื้นที่ ทําใหดินแดนพิพาทตกอยูในมือเราเปนครั้งแรก และสามารถเริ่มการรณรงคผนวกรวมไดทันที"
 CHL_political_events.5.a: "วันนี้คือชัยชนะของชาวชิลี!"

 CHL_political_events.6.t: "[ARG.GetName]ปฏิเสธที่จะถอนตัวออกจาก[953.GetName]"
 CHL_political_events.6.desc: "[ARG.GetName]ยังคงยืนกรานในการเปนเจาของเกาะพิพาท และอางวาหากเราตองการ ก็ตองใชกําลังเขายึดเอาเอง ประชาชนของเราพากันรวมพลังสนับสนุนเรื่องนี้ และนักการเมืองเริ่มออกมาพูดถึงการลมสลายของรัฐอารเจนตินา"
 CHL_political_events.6.a: "ถึงตอนนี้เราถอยไมไดแลว"

 CHL_political_events.7.t: "เสียงบนตอตานสังคมนิยมในกองทัพ"
 CHL_political_events.7.d: "เราไดรับทราบวามีบางคนในกองทัพที่กําลังทําใหชื่อเสียงดานความเปนกลางทางการเมืองของกองทัพมัวหมอง ดวยการวิจารณประชาชนอยางเปดเผยถึงการเลือกประธานาธิบดี และประกาศชัดวาสังคมนิยมนั้นชั่วรายโดยกําเนิด คนเหลานี้หลงผิดอยางเห็นไดชัด แตเราตองเฝาระวังไว หากไมอยากใหรัฐประหารอีกครั้งกลายเปนมากกวาฝนราย"
 CHL_political_events.7.a: "นี่ไมใชลางดีเลย"

 CHL_political_events.8.t: "อาริโอสตาโซ"
 CHL_political_events.8.d: "เมื่อชวงเชาวันนี้ เกิดการกอกบฏชวงสั้นๆ ของกรมทหารปนใหญตักนา นําโดยนายพลอาริโอสโต เอรเรรา ผูเปนที่รูกันวาสนับสนุนอดีตประธานาธิบดีการโลส อิบาเญซ เดล กัมโป และดูเหมือนจะไดรับอิทธิพลอยางมากจากชวงที่เคยเปนผูชวยทูตฝายทหารประจําอิตาลี เมื่อวันที่ 21 พฤษภาคม 1939 ขณะที่นายพลเอรเรรากําลังเดินทางมาถึงทําเนียบประธานาธิบดีเพื่อรวมพิธี เขาเห็นธงแดงแขวนอยูที่ระเบียงแหงหนึ่ง และดวยความหุนหันพลันแลนจึงความันกระชากลงมา นั่นเปนครั้งแรกที่เขาเริ่มถูกสงสัยอยางจริงจัง อยางไรก็ตาม เขาไมไดรับการสนับสนุนในวงกวาง และตอนนี้ทุกอยางก็กลับสูภาวะปกติแลว"
 CHL_political_events.8.a: "อยางนอยความสงบเรียบรอยก็กลับคืนมา"

 CHL_political_events.9.t: "การจมของเรือ SS Tolten"
 CHL_political_events.9.d: "เรือ SS Tolten กําลังแลนอยูนอกชายฝงบารนีแกต รัฐนิวเจอรซีย เมื่อถูกตอรปโดจากเรือดํานํ้าเยอรมันโจมตีเมื่อวานนี้ เรือสินคาลํานี้ซื้อมาจากเดนมารก แตลูกเรือทั้ง 27 คนเปนชาวชิลี และรอดชีวิตเพียงคนเดียว รัฐมนตรีตางประเทศของเราประกาศวาไมประสงคจะพูดคุยกับรัฐมนตรีตางประเทศเยอรมัน และประชาชนในซานติอาโกก็ออกมาประทวงตอตานเยอรมันตามทองถนน เราจะรับมือกับสถานการณนี้อยางไร?"
 CHL_political_events.9.a: "ประณามการกระทําของพวกเขา"
 CHL_political_events.9.b: "เรียกรองคาชดเชย"
 CHL_political_events.9.c: "นี่หมายถึงสงคราม!"
 CHL_sunk_the_tolten: "จมเรือ SS Tolten"

 CHL_political_events.10.t: "[CHL.GetName]เรียกรองคาชดเชยกรณีเรือ SS Tolten"
 CHL_political_events.10.desc: "[CHL.GetLeader] ผูนํา[CHL.GetAdjective] ไดติดตอเรามาอยางเปนทางการ เรียกรองคําขอโทษพรอมคาชดเชยจากการจมเรือสินคา SS Tolten ของชิลีเมื่อสัปดาหกอน เขาระบุวาเปนความรับผิดชอบของเราที่ตองยึดถือมาตรฐานสากล และทบทวนการกระทําอันไมเหมาะสมในการทําสงครามเรือดํานํ้าของเรา"
 CHL_political_events.10.a: "ถาพวกเขาตองการคาชดเชย ก็ใหไป"
 CHL_political_events.10.b: "เราไมกมหัวใหพวกออนแออยางนั้น"

 CHL_political_events.11.t: "[GER.GetName]มอบคาชดเชยใหเรา"
 CHL_political_events.11.desc: "[GER.GetLeader]ไดกลาวขอโทษอยางเปนทางการ แมจะดูไมนาเปนไปได และยังตกลงจายคาชดเชยทางเศรษฐกิจเพื่อทดแทนเรือ รวมถึงชีวิตชาวชิลีที่สูญเสียไปในกรณีเรือ Tolten"
 CHL_political_events.11.a: "บางทีพวกเขาก็มีเหตุผลอยูบาง"

 CHL_political_events.12.t: "[GER.GetName]ปฏิเสธที่จะจายคาชดเชยใหเรา"
 CHL_political_events.12.desc: "[GER.GetLeader]พนวาทะดุเดือดตามเคย อางวารัฐบาลชิลีนั้นออนแอและเปราะบาง และไมมีความจําเปนตองจายคาชดเชยใหประเทศที่แทบไมมีคุณคาอะไรเลย ตอนนี้เราไมมีกําลังพอจะโตแยงคํากลาวอางนี้ได และการทําใหเรื่องบานปลายก็เปนเรื่องไรวุฒิภาวะ..."
 CHL_political_events.12.a: "ก็ชางมันเถอะ"

 CHL_political_events.13.t: "การสังหารหมูที่เซกูโรโอเบรโร"
 CHL_political_events.13.desc: "ขบวนการชาติสังคมนิยมแหงชิลีพยายามกอรัฐประหาร แตไมเปนผล ตํารวจการาบิเนโรสของเราปราบปรามการกอการกําเริบได โดยมีผูเสียชีวิตไมมากนัก จากการยิงตอสูและการเผชิญหนาหนามหาวิทยาลัยชิลีที่ถูกยึดไว ออสการ โนบัว ฟวยนเตส และอุมแบรโต อารริอากาดา บัลดิเบียโซ เปนผูบัญชาการกองกําลังของเราในการสูรบครั้งนี้ และจะไดรับบําเหน็จอยางสมควร"
 CHL_political_events.13.a: "พวกเขาไมนาจะมากวนใจเราอีก"

 CHL_political_events.14.t: "การกอการกําเริบของนาซิสตา"
 CHL_political_events.14.desc: "ขบวนการชาติสังคมนิยมแหงชิลีพยายามกอรัฐประหาร แตไมเปนผล ขณะถูกไลลาออกจากเมืองหลวง พวกเขาไดอาศัยความนิยมในวงกวางประกาศสงครามกับระบอบของเรา และดวยเหตุนี้ สงครามกลางเมืองจึงปะทุขึ้น แมจะไมไดรุนแรงอยางที่บางคนหวาดกลัวก็ตาม"
 CHL_political_events.14.a: "เตรียมสูแมกับเพื่อนที่ใกลชิดที่สุด!"

 CHL_political_events.15.t: "การสูรบที่เซกูโรโอเบรโร"
 CHL_political_events.15.desc: "ขบวนการชาติสังคมนิยมแหงชิลีพยายามกอรัฐประหาร แตไมเปนผล ตํารวจการาบิเนโรสของเราปราบปรามการกอการกําเริบได แตตองสูญเสียอยางหนักในสิ่งที่กลายเปนการสูรบขนาดใหญเพื่อแยงชิงพื้นที่มหาวิทยาลัยชิลี หลังจากที่พวกนาซิสตาเขายึดไว ตอนนี้พวกเขาลาถอยไปแลว แตยังไมแนวาจะพยายามกอการเชนนี้อีกในภายหลังหรือไม"
 CHL_political_events.15.a: "เฉียดฉิวเกินไปแลว..."
 nacista_coup_attempt_happened: "ความพยายามกอรัฐประหารของนาซิสตาเกิดขึ้นไปแลว"

 CHL_political_events.16.t: "การเลือกตั้งประธานาธิบดีป 1942"
 CHL_political_events.16.d: "การเลือกตั้งประธานาธิบดีเวียนมาถึงอีกครั้ง และวาระของ[ROOT.GetLeader]ก็สิ้นสุดลง วิกฤตสวนใหญไดรับการจัดการไปแลว แตดวยสงครามที่ลุกลามไปทั่วโลก เสถียรภาพก็ยังหาไดยาก ใครควรรับชวงตอจากอเลสซานดรีในวาระนี้ และนําประเทศไปสูอนาคตอันยิ่งใหญ?"
 CHL_political_events.16.a: "ฆวน อันโตนิโอ ริโอส"
 CHL_political_events.16.b: "เอดูอารโด ครูซ-โกเก"
 CHL_political_events.16.c: "การโลส อิบาเญซ เดล กัมโป"
 CHL_political_events.16.e: "เอเลียส ลาเฟรเต กาบิญโญ"

 CHL_political_events.17.t: "การเลือกตั้งประธานาธิบดีป 1946"
 CHL_political_events.17.desc: "การเลือกตั้งประธานาธิบดีเวียนมาถึงอีกครั้ง และวาระของ[ROOT.GetLeader]ก็สิ้นสุดลง ความขัดแยงระดับโลกกําลังใกลยุติ แตก็ยังไมจบสิ้น คําถามที่ทุกคนคิดอยูในตอนนี้คือ ใครควรรับชวงตอจากอเลสซานดรีในวาระถัดไป และนําประเทศฝาชวงเวลาอันหนาวเหน็บนี้?"
 CHL_political_events.17.a: "กาบริเอล กอนซาเลซ บิเดลา"
 CHL_political_events.17.b: "เอดูอารโด ครูซ-โกเก"
 CHL_political_events.17.c: "เฟรนันโด อเลสซานดรี"
 CHL_political_events.17.e: "มารมาดุก โกรฟ บาเยโฆ"

 CHL_political_events.18.t: "การเลือกผูบัญชาการทหารบกคนใหม"
 CHL_political_events.18.desc: "ในกองทัพของเรามีผูคนมากมายที่พรอมรับภาระและความรับผิดชอบในการนําทัพ และยังมีอีกมากที่พรอมสูเพื่อชาติจนลมหายใจสุดทาย เนื่องจากเรามีประธานาธิบดีคนใหม เราจึงตองเลือกผูสืบทอดตําแหนงตอจากออสการ โนบัว ฟวยนเตส ผูดํารงตําแหนงนี้มาเกือบหาปแลว ใครจะเปนผูบัญชาการสูงสุดที่นํากองทัพของเรา?"
 CHL_political_events.18.a: "การโลส ฟวยนเตส ราเบ"
 CHL_political_events.18.b: "เอสกูเดโร ออสการ โอตาโรลา"
 CHL_political_events.18.c: "กิเยรโม บารริโอส ติราโด"
 CHL_political_events.18.d: "อัลเฟรโด ปอรตาเลส มูรเกส"

 CHL_political_events.19.t: "สายลมแหงการเปลี่ยนแปลง"
 CHL_political_events.19.desc: "หลังถูกวิพากษวิจารณไปทั่วประเทศ อารตูโร อเลสซานดรี ไดลาออกและประกาศการเลือกตั้งกอนกําหนด และครั้งนี้ดูเหมือนกระแสลมจะพัดไปทางฝายซาย เมื่อประชาชนพากันแหไปยังคูหาเลือกตั้ง ใครจะไดเปนผูนํา และเหตุการณนี้จะหลอหลอมสาธารณรัฐใหมอยางไร?"
 CHL_political_events.19.a: "เอเลียส ลาเฟรเต กาบิญโญ จะนําสาธารณรัฐใหม"
 CHL_political_events.19.b: "เปโดร อากีรเร เซรดา คือขวัญใจประชาชน"
 CHL_wont_becocme_communist_tt: "คุณจะ§Rไม§!สามารถเปลี่ยนเปนคอมมิวนิสตผานแผนยุทธศาสตร§Yเพิ่มอํานาจประธานาธิบดี§!ได"
 CHL_can_becocme_communist_tt: "คุณ§Gสามารถ§!เปลี่ยนเปนคอมมิวนิสตผานแผนยุทธศาสตร§Yเพิ่มอํานาจประธานาธิบดี§!ได"

 CHL_political_events.20.t: "การประชุมซานติอาโก"
 CHL_political_events.20.desc: "วันนี้พรรคคอมมิวนิสตไดเปดประชุมโดยมีจุดประสงคเดียวคือกําหนดเสนทางที่ประเทศตองเดินในอีกหลายปขางหนา รวมถึงเลือกบุคคลที่จะชวยนําประเทศไปสูความกาวหนา เนื่องจากแนวรวมกวางขวางในปจจุบันไมอาจเห็นพองกันไดในทุกประเด็น และตองการใครสักคนที่จะลงมือและชี้นําทาง ขณะนี้ตัวเลือกอยูระหวางเอเลียส ลาเฟรเต กาบิญโญ ผูนิยมมารกซ มารมาดุก โกรฟ บาเยโฆ ผูนิยมสังคมนิยม การโลส กอนเตรราส ลาบารกา ผูนิยมสตาลิน และมานูเอล อิดัลโก ปลาซา ผูนิยมทรอตสกี"
 CHL_political_events.20.a: "เอเลียส ลาเฟรเต กาบิญโญ"
 CHL_political_events.20.b: "มารมาดุก โกรฟ บาเยโฆ"
 CHL_political_events.20.c: "การโลส กอนเตรราส ลาบารกา"
 CHL_political_events.20.d: "มานูเอล อิดัลโก ปลาซา"

 CHL_political_events.21.t: "[PRU.GetName]รุกขามเขาสูปสตาซา"
 CHL_political_events.21.desc: "ตั้งแตเมื่อวานนี้ กองทหารของ[PRU.GetNameDef]เริ่มรุกขามเขาสูภูมิภาคนาโป-ปสตาซา ซึ่งเปนรัฐที่ไมไดเปนของพวกเขา หลังสงครามแปซิฟก เราเพิ่งตองยอมสละตักนาคืนใหเปรูตามขอตกลงเมื่อไมนานมานี้ แตในเมื่อพวกเขาไมเคารพพรมแดนระหวางประเทศ เราก็ไมจําเปนตองเคารพเชนกัน"
 CHL_political_events.21.a: "เราควรเดินหนาอางสิทธิ์เหนือตักนา"
 CHL_political_events.21.b: "ไมคุมที่จะไปยั่วยุพวกเขา"

 CHL_political_events.22.t: "[CHL.GetNameDefCap]ตองการเขารวมฝายของเรา"
 CHL_political_events.22.desc: "[CHL.GetLeader]ติดตอมาดวยความหวังวาเราจะยอมให[CHL.GetNameDef]เขารวมฝายของเรา เพื่อที่เราจะไดตอสูในนามของการปฏิวัติโลกรวมกันในฐานะสหายรวมรบ เราจะวาอยางไร?"
 CHL_political_events.22.a: "เรายินดีตอนรับสหายใหมของเรา"
 CHL_political_events.22.b: "ทําไมเราตองสนใจอเมริกาใตดวย?"

 CHL_political_events.23.t: "โซเวียตยอมใหเราเขารวม"
 CHL_political_events.23.desc: "วันนี้[SOV.GetLeader]ประกาศตอคณะกรรมการกรมการเมืองวาสหภาพไดพันธมิตรใหมคือ[CHL.GetNameDef] ซึ่งเปนชองทางเชื่อมตอกับอเมริกาใตและเปนฐานที่มั่นสําหรับตอกรกับชาวอเมริกันหากจําเปน ดวยเหตุนี้ เราจึงเปนสวนหนึ่งของฝายพวกเขา และเราจะเจริญรุงเรืองไปดวยกันอยางแนนอน"
 CHL_political_events.23.a: "เราจะแข็งแกรงขึ้นเมื่ออยูดวยกัน"

 CHL_political_events.24.t: "โซเวียตปฏิเสธการรับเราเขารวม"
 CHL_political_events.24.desc: "วันนี้[SOV.GetLeader]ประกาศตอคณะกรรมการกรมการเมืองวาสหภาพไดปฏิเสธคําขอของเราที่จะเขารวมฝาย โดยระบุวาจะเปนภัยตอความมั่นคงของโลก และทําใหดุลอํานาจระหวางพวกเขากับศัตรูเสียไปในทางที่ไมเปนผลดี"
 CHL_political_events.24.a: "เราถูกหลอก ถูกแทงขางหลัง และอาจถูกตมจนเปอยดวย..."

 CHL_political_events.25.t: "[CHL.GetName]เสนอใหเรารวมเปนหนึ่งเดียวกับพวกเขา"
 CHL_political_events.25.desc: "[CHL.GetLeader]เขามาพรอมขอเรียกรองใหเรารวมเขากับพวกเขาเปนหนึ่งเดียว เพื่อกอตั้งสาธารณรัฐกรรมกรฮิสแปนิก เขาระบุวาเราจําเปนตองเขารวม หากหวังจะยืนหยัดตอสูกับมหาอํานาจจักรวรรดินิยมตางชาติได"
 CHL_political_events.25.a: "เราตองเขารวมกับพวกเขา!"
 CHL_political_events.25.b: "ตองรวมมือกันใหใกลชิดยิ่งขึ้น"
 CHL_political_events.25.c: "เราไมจําเปนตองพึ่งพวกเขา"
 CHL_we_will_be_annexed_tt: "เราจะถูก§Rผนวก§!โดย§Y[CHL.GetNameDef]§!"
 CHL_we_will_be_puppeted_tt: "เราจะกลายเปน§Rรัฐหุนเชิด§!ของ§Y[CHL.GetNameDef]§!"

 CHL_political_events.26.t: "[FROM.GetName]ยอมรับการผนวก"
 CHL_political_events.26.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจยอมรับขอเสนอการผนวกของเรา และประเทศของพวกเขาจะกลายเปนสวนหนึ่งที่แยกไมออกจากเรา การปฏิวัติจงเจริญ!"
 CHL_political_events.26.a: "สมบูรณแบบ"

 CHL_political_events.27.t: "[FROM.GetName]ยอมรับการครอบงํา"
 CHL_political_events.27.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจยอมรับขอเสนอการครอบงําของเรา และประเทศของพวกเขาจะกลายเปนหุนสวนที่ขาดไมไดของเรา การปฏิวัติจงเจริญ!"
 CHL_political_events.27.a: "ก็ดีพอแลว"

 CHL_political_events.28.t: "[FROM.GetName]เลือกตอตานเรา"
 CHL_political_events.28.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจปฏิเสธขอเสนอการผนวกของเรา เราควรจัดการกับพวกเขาอยางไร?"
 CHL_political_events.28.a: "เราจะทําลายพวกเขา!"
 CHL_political_events.28.b: "คอยจัดการพวกเขาทีหลัง"

 CHL_political_events.29.t: "ฟาสซิสตชิลีตองการการสนับสนุนจากเรา"
 CHL_political_events.29.desc: "กลุมฟาสซิสตจากพรรค Movimiento Nacional-Socialista ของชิลีไดติดตอเรา พรอมเลาถึงแผนกอรัฐประหารโคนรัฐบาลชิลีชุดปจจุบัน พวกเขาขอใหเราสนับสนุนภารกิจนี้ ทั้งในรูปของกําลังคน ยุทโธปกรณ และความชวยเหลือทางการเมือง เราควรชวยพวกเขาหรือไม?"
 CHL_political_events.29.a: "เราตองชวยพวกเขา"
 CHL_political_events.29.b: "พวกเขาไมจําเปนตองใหเราชวย"

 CHL_political_events.30.t: "[FROM.GetName]จะชวยเหลือเรา"
 CHL_political_events.30.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ใหคํามั่นวาจะชวยเหลือความพยายามของเราในการรัฐประหารโคนรัฐบาลปจจุบัน และสถาปนาระบอบเผด็จการที่สามารถยืนหยัดตอกรกับชาวอเมริกันได"
 CHL_political_events.30.a: "สมบูรณแบบ"

 CHL_political_events.31.t: "[FROM.GetName]เลือกที่จะไมชวยเหลือเรา"
 CHL_political_events.31.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]เลือกที่จะไมใหความชวยเหลือแกความพยายามของเราในการรัฐประหารโคนรัฐบาลปจจุบัน และสถาปนาระบอบเผด็จการที่สามารถยืนหยัดตอกรกับชาวอเมริกันได"
 CHL_political_events.31.a: "เราถูกหักหลัง"

 CHL_political_events.32.t: "[CHL.GetName]ตองการเขารวมฝายอักษะ"
 CHL_political_events.32.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]มาขอเขารวมฝายของเรา เขาอางวาเราจะแข็งแกรงขึ้นมากเมื่ออยูดวยกัน และดวยความชวยเหลือของพวกเขา เราจะสามารถโคนอํานาจครอบงําของอเมริกาได"
 CHL_political_events.32.a: "เราจะอนุญาต"
 CHL_political_events.32.b: "เราแข็งแกรงกวาเมื่อไมมีพวกเขา"

 CHL_political_events.33.t: "[GER.GetLeader]ตอบรับคําขอของเรา"
 CHL_political_events.33.desc: "[GER.GetLeader]แหง[GER.GetNameDef]ประกาศวานับแตวันนี้เปนตนไป [CHL.GetNameDef]จะเปนพันธมิตรสําคัญที่ชวยใหพวกเขาเขาควบคุมทวีปอเมริกาไดทั้งหมด เขากลาววาวันนี้คือวันที่เปนจุดเริ่มตนแหงจุดจบของประชาธิปไตยในอเมริกา และวันนี้คือวันอันรุงโรจน"
 CHL_political_events.33.a: "เปนวันอันรุงโรจนจริงๆ!"

 CHL_political_events.34.t: "[GER.GetLeader]ปฏิเสธคําขอของเรา"
 CHL_political_events.34.desc: "[GER.GetLeader]แหง[GER.GetNameDef]ประกาศวาเราจะไมไดรับอนุญาตใหเขารวมฝายของพวกเขา เนื่องจากเราไมไดอยูในแผนที่พวกเขาวางไวสําหรับอนาคตของโลกนี้ พวกเขากําลังวางแผนอะไรกันแน?"
 CHL_political_events.34.a: "พวกเขาจะตองเสียใจ..."

 CHL_political_events.35.t: "[CHL.GetNameDefCap]เชิญเราเขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.35.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]ไดติดตอมา เชิญเราเขารวมฝายใหมของพวกเขา คือพันธมิตรฮิสแปนิก เราจะวาอยางไร?"
 CHL_political_events.35.a: "รวมมือกัน แลวเราจะควาชัย"
 CHL_political_events.35.b: "อนาคตเปนของเราเพียงผูเดียว"

 CHL_political_events.36.t: "[FROM.GetNameDefCap]เขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.36.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ไดกรุณาตอบรับขอเสนอของเราใหมารวมกัน และบัดนี้เรายืนหยัดเคียงขางกันในหนาประวัติศาสตร"
 CHL_political_events.36.a: "อนาคตดูสดใส"

 CHL_political_events.37.t: "[FROM.GetNameDef]ปฏิเสธที่จะเขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.37.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจอยางโงเขลาที่จะปฏิเสธขอเสนอใหเขารวมฝายของเรา พันธมิตรฮิสแปนิก พระเจาจะทรงพิพากษาพวกเขาเมื่อถึงเวลา"
 CHL_political_events.37.a: "พวกเขาไมกลัวเราหรือ?"

 CHL_political_events.38.t: "[CHL.GetName]เชิญเราเขารวมฝาย[GER.GetAdjective]"
 CHL_political_events.38.desc: "[CHL.GetLeader]เชิญเราเขารวมกับพวกเขาในฐานะสวนหนึ่งของฝาย[GET.GetNameDef] เพื่อสกัดกั้นการแทรกแซงของอเมริกาในกิจการของชาติฮิสแปนิก พวกเขาอางวาแมเราจะออนแอกวาและแตกแยกกวา แตเราก็เอาชนะสหรัฐอเมริกาได ตราบใดที่เรารวมมือกัน"
 CHL_political_events.38.a: "รวมมือกัน เราจะโคนสหรัฐอเมริกาได!"
 CHL_political_events.38.b: "มันเสี่ยงเกินไป..."

 CHL_political_events.39.t: "[FROM.GetName]เขารวมฝายของเรา!"
 CHL_political_events.39.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]เปนคนมีเหตุผล และไดขอสรุปวาการรวมมือกับเราเปนทางเลือกที่ฉลาดที่สุด เขาลงนามในเอกสารทุกฉบับที่เรายื่นให และบัดนี้จะชวยปกปองซีกโลกของเรา"
 CHL_political_events.39.a: "เราจะปกปองทวีปของเรา!"

 CHL_political_events.40.t: "[FROM.GetName]ตัดสินใจไมเขารวมฝายของเรา"
 CHL_political_events.40.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]เปนคนโงเขลา และไดขอสรุปวายอมทนถูกกดขี่โดยจักรวรรดินิยมอเมริกันดีกวาเสี่ยงทําสงครามกับพวกเขา อยางไรก็ตาม เราทําอะไรกับจุดยืนนี้ไมไดมากนัก จึงตองปลอยเรื่องนี้ไวแคนั้น"
 CHL_political_events.40.a: "ชางเถอะ..."

 CHL_political_events.41.t: "[CHL.GetName]เรียกรองใหเรายอมสยบตอ[GER.GetNameDef]"
 CHL_political_events.41.desc: "[CHL.GetLeader]และ[GER.GetLeader]ออกมาเรียกรองรวมกันใหอุรุกวัยยอมสยบตอพวกเขา ดูเหมือนพวกเขากําลังเรียกรองใหเรากลายเปนรัฐในอารักขาของ[GER.GetAdjective] เราจะยอมจํานนตอแรงกดดันนี้หรือไม?"
 CHL_political_events.41.a: "เราไมมีทางเลือก"
 CHL_political_events.41.b: "เราตองตอตานพวกฟาสซิสต!"

 CHL_political_events.42.t: "[URG.GetName]ยอมสยบตอ[GER.GetNameDef]"
 CHL_political_events.42.desc: "วันนี้[URG.GetLeader]ประกาศลาออกจากตําแหนงประธานาธิบดีแหง[URG.GetNameDef]อยางเปนทางการ และสงมอบอํานาจใหแกอารนูลฟ ฟูรมันน ผูไดรับการสนับสนุนจาก[GER.GetAdjective]"
 CHL_political_events.42.a: "ยอดเยี่ยม"

 CHL_political_events.43.t: "[URG.GetName]ยอมสยบตอเรา"
 CHL_political_events.43.desc: "ดวยแรงกดดันจากรัฐบาล[CHL.GetAdjective] ประเทศ[URG.GetNameDef]ถูกบีบใหยอมสยบตอเรา ตามแผนอาณานิคมลับที่รางไวเมื่อหลายปกอน สิ่งนี้จะชวยขยายอิทธิพลของเราในทวีปอเมริกา และชวยกันไมใหสหรัฐอเมริกายื่นมือเขามาในอเมริกาใต"
 CHL_political_events.43.a: "Das ist gut"

 CHL_political_events.44.t: "[URG.GetName]ปฏิเสธที่จะยอมสยบ"
 CHL_political_events.44.desc: "[URG.GetLeader]ผูโงเขลาตัดสินใจลุกขึ้นตอตานระเบียบโลกใหมที่นักคิดและนักการเมือง[CHL.GetAdjective]และ[GER.GetAdjective]วาดฝนไว เขามองไมเห็นกระแสนํ้าที่กําลังโหมมา และจะไมมีชีวิตอยูถึงวันที่คลื่นซัดเขาฝง"
 CHL_political_events.44.a: "บังอาจนัก!"

 CHL_political_events.45.t: "พี่นองของเราใน[CHL.GetNameDef]เชิญเราเขารวมฝายอักษะ"
 CHL_political_events.45.desc: "พี่นองชาวฮิสแปนิกและละตินของเราในอเมริกาใต ชาว[CHL.GetAdjective] ไดขอใหเราเขารวมฝายเดียวกับ[GER.GetNameDef] เพื่อสรางระเบียบโลกใหมอยางแทจริง ขณะที่ยังปกปองผลประโยชนของเราเองใหดีที่สุดเทาที่ทําได เราจะวาอยางไร?"
 CHL_political_events.45.a: "ดวยความยินดี"
 CHL_political_events.45.b: "เรามีแผนอื่น"

 CHL_political_events.46.t: "[FROM.GetName]เขารวมฝายอักษะ"
 CHL_political_events.46.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจรับขอเสนอของเรา และเขารวมเปนพันธมิตรกับเราและ[GER.GetNameDef] พี่นองที่พลัดพรากกันมานานไดกลับมารวมกันอีกครั้ง แตครั้งนี้อยูบนเงื่อนไขที่เทาเทียมและยุติธรรมยิ่งขึ้น!"
 CHL_political_events.46.a: "ยอดเยี่ยม"
 
 CHL_political_events.47.t: "[CHL.GetName]ตองการเชิญ[FROM.GetName]เขารวมฝายอักษะ"
 CHL_political_events.47.desc: "[CHL.GetName]เปนตัวกลางทําขอตกลงกับ[FROM.GetName] พวกเขาโนมนาว[FROM.GetName]ไดวาอนาคตอยูกับฝายอักษะ เราเพียงแคลงนามรับรองการเขารวมของพวกเขาเทานั้น" 
 CHL_political_events.47.a: "ลงนามประทับตราเรียบรอย"
 CHL_political_events.47.b: "ยังไมใชตอนนี้"
 
 #CHL_political_events.98.t: "[FROM.GetName] joins the Axis"
 #CHL_political_events.98.desc: "Thanks to a proposal handed over by their Hispanic brothers in [CHL.GetNameDef], [FROM.GetLeader] of [FROM.GetNameDef] has decided to join our faction to help us make a stronger future, and fight against our every enemy. We are stronger together!"
 #CHL_political_events.98.a: "Sehr Gut"

 CHL_political_events.48.t: "[FROM.GetName]ไมเขารวมฝายอักษะ"
 CHL_political_events.48.desc: "นาเสียดาย แมเราจะวิงวอนดวยอารมณความรูสึกแลวก็ตาม [FROM.GetLeader]และประชาชนของพวกเขาก็ตัดสินใจวาอยูโดยไมมีเราดีกวา และไมไดอธิบายรายละเอียดวาเหตุใดจึงตัดสินใจเชนนั้น ตอนนี้เราจะยังไมไดกลับมารวมกับ[FROM,GetNameDef]"
 CHL_political_events.48.a: "ถาอยางนั้นเราก็ตองทําเองตามลําพัง"

 CHL_political_events.49.t: "[CHL.GetNameDefCap]เชิญเราเขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.49.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]ไดติดตอมา เชิญเราเขารวมฝายใหมของพวกเขา คือพันธมิตรฮิสแปนิก เราจะวาอยางไร?"
 CHL_political_events.49.a: "รวมมือกัน แลวเราจะควาชัย"
 CHL_political_events.49.b: "อนาคตเปนของเราเพียงผูเดียว"

 CHL_political_events.50.t: "[FROM.GetNameDefCap]เขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.50.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ไดกรุณาตอบรับขอเสนอของเราใหมารวมกัน และบัดนี้เรายืนหยัดเคียงขางกันในหนาประวัติศาสตร"
 CHL_political_events.50.a: "ยอดเยี่ยม"

 CHL_political_events.51.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะเขารวมพันธมิตรฮิสแปนิก"
 CHL_political_events.51.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตัดสินใจอยางโงเขลาที่จะปฏิเสธขอเสนอใหเขารวมฝายของเรา พันธมิตรฮิสแปนิก พระเจาจะทรงพิพากษาพวกเขาเมื่อถึงเวลา"
 CHL_political_events.51.a: "พวกเขาไมกลัวเราหรือ?"

 CHL_political_events.52.t: "[CHL.GetName]เรียกรองใหเราสงมอบ[947.GetName]"
 CHL_political_events.52.desc: "หลังจากการระดมพลขนาดใหญที่ชายแดนของเราเมื่อไมนานมานี้ และการประทวงยาวนานนับสัปดาหของประชาชน[CHL.GetAdjective] [CHL.GetLeader]ไดประกาศวาถึงเวลาแลวที่[CHL.GetNameDef]จะทวงคืนการควบคุมดินแดน[947.GetName] ซึ่งพวกเขาเคยยกใหตามสนธิสัญญาลิมา และบัดนี้อางวาสนธิสัญญานั้นไมเปนธรรมและเปนโมฆะ"
 CHL_political_events.52.a: "เราไมอยากเสี่ยงทําสงครามอีก"
 CHL_political_events.52.b: "นี่คือโอกาสที่เราจะทวงอาริกาคืน!"

 CHL_political_events.53.t: "[FROM.GetName]ยอมรับขอเรียกรองของเรา"
 CHL_political_events.53.desc: "รัฐบาลปจจุบันของ[FROM.GetNameDef]ออนแอ และเราทุกคนรูดี เห็นไดชัดวาพวกเขาไมอาจตอกรกับเราได และพวกเขาเองก็ตระหนักถึงขอนี้ ดวยเหตุนี้ วันนี้พวกเขาจึงไดลงนามในความตกลงฉบับใหม สงมอบจังหวัด[947.GetName]ใหเราอยางเปนทางการ!"
 CHL_political_events.53.a: "เรายิ่งใหญขึ้น"

 CHL_political_events.54.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา"
 CHL_political_events.54.desc: "รัฐบาล[FROM.GetAdjective]ยังคงยึดติดกับสนธิสัญญาลิมาจอมปลอมอยางดื้อรั้น และปฏิเสธที่จะสงมอบ[947.GetName]ใหเรา เราตองหันไปใชการแสดงแสนยานุภาพ และยึดภูมิภาคนั้นมาจากพวกเขาดวยทุกวิถีทางที่จําเปน..."
 CHL_political_events.54.a: "เราจะทําใหพวกเขาชดใชความอวดดี!"

 CHL_political_events.55.t: "[CHL.GetName]เรียกรองใหเรายอมยก[953.GetName]"
 CHL_political_events.55.desc: "หลังจากการระดมพลขนาดใหญที่ชายแดนของเราเมื่อไมนานมานี้ และการประทวงยาวนานนับสัปดาหของประชาชน[CHL.GetAdjective] [CHL.GetLeader]ไดประกาศวาถึงเวลาแลวที่[CHL.GetNameDef]จะเขายึดครอง[953.GetName]เปนของตน เราควรพยายามตอตานพวกเขาหรือไม?"
 CHL_political_events.55.a: "เราไมอยากเสี่ยงทําสงครามกับพวกเขา"
 CHL_political_events.55.b: "ตองใหเรายํ้าอีกกี่ครั้ง?"

 CHL_political_events.56.t: "[FROM.GetName]ยอมตามขอเรียกรองของเรา"
 CHL_political_events.56.desc: "รัฐบาลของ[ARG.GetNameDef]ตัดสินใจอยางมีเหตุผลและสงมอบดินแดนใหเราโดยดี บัดนี้ถึงเวลาเดินหนาตอ และผลักดันการอางสิทธิ์ของเราจนกวาจะสรางรัฐ[CHL.GetAdjective]ที่สมบูรณแบบได"
 CHL_political_events.56.a: "วันนี้เราตอนรับชาวชิลีใหมแปดหมื่นคน"

 CHL_political_events.57.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา"
 CHL_political_events.57.desc: "[ARG.GetLeader]แหง[ARG.GetNameDef]คิดวาการลุกขึ้นตอตานเราเปนเรื่องฉลาด ดวยเหตุนี้เราตองแสดงใหเขาเห็นวาเขากําลังหาเรื่องผิดคน เดินหนา บุรุษและสตรีแหงชิลี!"
 CHL_political_events.57.a: "ถาอยางนั้นเราตองใชกําลังยึดมา"

 CHL_political_events.58.t: "ทหารของเราปะทะกันรอบลากูนาเดลเดซิเอรโต"
 CHL_political_events.58.desc: "ทหารของเรารายงานวาเกิดการปะทะกับทหาร[CHL.GetAdjective]รอบทะเลสาบลาโกเดลเดซิเอรโตในซานตาครูซ พวกเขาระบุวาทหาร[CHL.GetAdjective]กําลังรุกคืบไปทางตะวันออกเรื่อยๆ ดูเหมือนพยายามจะยึดครองทั้งจังหวัด"
 CHL_political_events.58.a: "ถอนกําลัง มันไมคุมที่จะทําสงคราม"
 CHL_political_events.58.b: "ยืนหยัดไว ทหารทั้งหลาย!"

 CHL_political_events.59.t: "[FROM.GetName]ถอนตัวออกจาก[954.GetName]"
 CHL_political_events.59.desc: "ทหาร[ARG.GetAdjective]ผูขลาดเขลาลาถอยไปหลังถูกยั่วยุโดยทหารรักษาชายแดนของเรา และทหารของเราเริ่มเคลื่อนเขาสูจังหวัดซานตาครูซที่แทบถูกทิ้งราง เรากําลังไดชัยชนะในทุกแนวรบ และตองภาวนาวาทุกอยางจะไมพังทลายลงในอนาคตอันใกล"
 CHL_political_events.59.a: "เราเขาใกลเปาหมายสูงสุดอีกกาวหนึ่ง"

 CHL_political_events.60.t: "[FROM.GetName]ยืนหยัดไมถอย"
 CHL_political_events.60.desc: "ทหาร[ARG.GetAdjective]ผูกลาหาญแตโงเขลาตัดสินใจยืนหยัดอยูรอบลากูนาเดลเดซิเอรโต ทหารของเรายังคงยิงใสพวกเขาอยู แตกําลังรอคําสั่งวาจะดําเนินการอยางไรตอไป"
 CHL_political_events.60.a: "เคลื่อนกําลังเขายึดพื้นที่"
 CHL_political_events.60.b: "เราจะยึดมันทีหลัง"

 CHL_political_events.61.t: "[CHL.GetName]เรียกรองใหปลอดทหารในปาตาโกเนีย"
 CHL_political_events.61.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]ประกาศวาเราคุกคามความปลอดภัยของประชาชน[CHL.GetAdjective]มานานเกินไปแลว และถึงเวลาที่เรื่องนี้ตองยุติลง โดยอางวาเราจําเปนตองทําใหภูมิภาคปาตาโกเนียเปนเขตปลอดทหาร เราจะตอบโตอยางไร?"
 CHL_political_events.61.a: "เปนสิ่งที่สมเหตุสมผล"
 CHL_political_events.61.b: "แลวทําไมเราตองทําแบบนั้นดวย?"

 CHL_political_events.62.t: "[FROM.GetName]ทําใหปาตาโกเนียเปนเขตปลอดทหาร"
 CHL_political_events.62.desc: "รัฐบาล[FROM.GetAdjective]ยอมตามขอเรียกรองของเรา และทําใหปาตาโกเนียเปนเขตปลอดทหาร พรอมสัญญาวาจะไมทํารายประชาชนของเราอีก พวกเขายังไมรูตัววาเหตุใดเราจึงยื่นขอเรียกรองเหลานี้"
 CHL_political_events.62.a: "พวกเขาจะไมทันตั้งตัว"

 CHL_political_events.63.t: "[FROM.GetName]ไมยอมทําใหปาตาโกเนียเปนเขตปลอดทหาร"
 CHL_political_events.63.desc: "[FROM.GetLeader]ประณามการยั่วยุอยางโจงแจงของเรา และระบุวาเห็นไดงายวาเจตนาของเราคือการโจมตีสายฟาแลบอยางรวดเร็วและงายดายในยามที่พวกเขาไมระวังตัว อยางไรก็ตาม เราไมจําเปนตองอาศัยเชนนั้นก็ชนะได"
 CHL_political_events.63.a: "มันจะไมขัดขวางความกาวหนาของเรา"

 CHL_political_events.64.t: "[From.GetAdjective]ยึดคลองปานามา"
 CHL_political_events.64.desc: "[From.GetLeader] จอมเผด็จการแหง[FROM.GetNameDef] บังอาจเปดฉากโจมตีครั้งใหญตอกองกําลังประจําคลองปานามาของเราจากฐานที่มั่นใกลเคียง ปฏิบัติการของพวกเขาประสบความสําเร็จ และทหารของเรากําลังถอยรนอยางสับสนอลหมาน ชาว[FROM.GetAdjective]ไมไดรุกขามเขามาในดินแดนอื่นของเรา ดังนั้นนี่จึงไมใชการโหมโรงสูการรุกรานเต็มรูปแบบ แตการโจมตีครั้งนี้ไดบั่นทอนความสามารถของเราในการแผแสนยานุภาพไปทั่วโลก และทําใหเราอับอายบนเวทีระหวางประเทศ"
 CHL_political_events.64.a: "นาเสียดายที่เรามีเรื่องเรงดวนกวานี้ การควํ่าบาตรนาจะเพียงพอ"
 CHL_political_events.64.b: "อธิปไตยของเราถูกคุกคาม เรื่องนี้ตองตอบโตดวยกําลังทหาร"

 CHL_political_events.65.t: "[From.GetAdjective]ยึด[311.GetName]"
 CHL_political_events.65.desc: "[From.GetLeader] จอมเผด็จการแหง[FROM.GetNameDef] บังอาจเปดฉากโจมตีครั้งใหญตอกองกําลังประจํา[311.GetName]ของเราจากฐานที่มั่นใกลเคียง ปฏิบัติการของพวกเขาประสบความสําเร็จ และทหารของเรากําลังถอยรนอยางสับสนอลหมาน ชาว[FROM.GetAdjective]ไมไดรุกขามเขามาในดินแดนอื่นของเรา ดังนั้นนี่จึงไมใชการโหมโรงสูการรุกรานเต็มรูปแบบ แตการโจมตีครั้งนี้ไดบั่นทอนความสามารถของเราในการแผแสนยานุภาพไปทั่วโลก และทําใหเราอับอายบนเวทีระหวางประเทศ"
 CHL_political_events.65.a: "นาเสียดายที่เรามีเรื่องเรงดวนกวานี้ การควํ่าบาตรนาจะเพียงพอ"
 CHL_political_events.65.b: "อธิปไตยของเราถูกคุกคาม เรื่องนี้ตองตอบโตดวยกําลังทหาร"

 CHL_political_events.66.t: "[CHL.GetName]เรียกรองการควบคุมดินแดนกายอานาของเรา"
 CHL_political_events.66.desc: "วันนี้[CHL.GetLeader]กลาวสุนทรพจนครั้งใหญ ประณามสิ่งที่เขาอางวาเปนการยึดครองดินแดนกายอานาอยางผิดกฎหมายและไมเปนธรรมของเรา เขาเรียกรองใหเราสงมอบภูมิภาคนี้ใหพวกเขาในทันที เพื่อที่เขาจะไดปลดปลอยประชาชนจากการกดขี่ของจักรวรรดินิยม"
 CHL_political_events.66.a: "ไมคุมที่จะสูรบเพื่อมัน"
 CHL_political_events.66.b: "ขามศพขาไปกอน!"

 CHL_political_events.67.t: "[FROM.GetName]ยอมรับขอเรียกรองของเรา"
 CHL_political_events.67.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ติดตอมาแจงวากองรักษาการณประจําภูมิภาคกําลังถอนกําลังออกจากกายอานา และจะมีพิธียกพื้นที่นี้ใหแกเรา เนื่องจากในสายตาพวกเขามันไมคุมที่จะสูรบ"
 CHL_political_events.67.a: "บัดนี้พวกเขาเปนอิสระจากการกดขี่แลว"

 CHL_political_events.68.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา"
 CHL_political_events.68.desc: "[FROM.GetLeader]ยังคงยืนกรานในจุดยืนวาภูมิภาคกายอานาเปนของพวกเขาและพันธมิตร ไมใชของมหาอํานาจอื่นใด ดูเหมือนการเจรจาและกลเม็ดหลังฉากจะไรประโยชนอีกตอไป..."
 CHL_political_events.68.a: "ยังมีวิธีที่ตรงไปตรงมากวานี้เสมอ"

 CHL_political_events.69.t: "[CHL.GetName]สถาปนาการควบคุมเหนือกายอานา"
 CHL_political_events.69.desc: "หลังจากถูก[CHL.GetNamDef]ยึดครองไดทั้งหมด ประชาชนทองถิ่นในดินแดนกายอานาของเราก็หันไปเขาขางฝายผูชนะ และเราไมอาจทําอะไรไดมากนักเพื่อทําใหการอางสิทธิ์ของเราชอบธรรม"
 CHL_political_events.69.a: "โอ ชางนาเศรา"
 CHL_political_events.69.b: "เราไมยอมรับเรื่องนี้!"

 CHL_political_events.70.t: "ขอพิพาทเรื่องผูนํารุมเราพรรค"
 CHL_political_events.70.desc: "หลังจากไดอํานาจในชิลีดวยการรวมตัวกันภายใตธงผืนเดียว บรรดาฟาสซิสตหลากหลายกลุมก็กลับมาดําเนินตามแนวคิดและอุดมการณของตนเองอีกครั้ง โดยไมมีการกํากับดูแลหรือควบคุมที่เหมาะสมจากรัฐบาล ถึงเวลาแลวที่ชาติจะตองเลือกวาใครจะเปนผูนํา เพราะกลไกรัฐจะอยูรอดไดก็ดวยผูนําที่เขมแข็งเทานั้น! ใครจะรับบทบาทนี้?"
 CHL_political_events.70.a: "ฆอรเฆ กอนซาเลซ ฟอน มาเรส"
 CHL_political_events.70.b: "การโลส เคลเลอร รูเอฟฟ"
 CHL_political_events.70.c: "ฆวน โกเมซ มิยาส"

 CHL_political_events.71.t: "รัฐประหารของนายพลการโลส อิบาเญซ เดล กัมโป"
 CHL_political_events.71.desc: "ทหารที่เห็นอกเห็นใจแนวรวมกวางขวางของฝายอนุรักษนิยมและฟาสซิสตไดลอมทําเนียบปาลาซิโอเดลาโมเนดา ที่ซึ่งอารตูโร อเลสซานดรี และคณะรัฐมนตรีของเขาอยูภายใน พวกเขาสั่งใหประธานาธิบดีลาออกเพื่อเปดทางใหอดีตประธานาธิบดีและนายพลการโลส อิบาเญซ เดล กัมโป ผูสัญญาวาจะนําประเทศกลับสูคานิยมดั้งเดิม และแกไขปญหาที่อเลสซานดรีแกไมได เมื่อเขามีกองทัพหนุนหลัง ก็ไมมีใครทําอะไรไดมากนัก"
 CHL_political_events.71.a: "ถึงเวลาหมุนนาฬกายอนกลับ"

 CHL_political_events.72.t: "การประชุมสมัยแรกของสภาอาเราคาเนีย"
 CHL_political_events.72.desc: "ระหวางการประชุมสมัยแรกของสภาอาเราคาเนียแหงใหม ไดเกิดขอพิพาทขึ้น แมทุกฝายจะเห็นพองวาการตอตานจักรวรรดินิยมตองเปนหลักการสําคัญของรัฐมาปูเชใดๆ แตก็ยังมีความเห็นไมตรงกันวาจะไวใจผูที่มีอุดมการณเดียวกัน เชน คอมมิวนิสตและสังคมนิยม ใหเขามาเปนสวนหนึ่งของรัฐบาลมาปูเชไดหรือไม บางคนอางวาพวกเขาอาจเปนพันธมิตรที่มีประโยชน ขณะที่บางคนอางวาพวกเขาจะแทงเราขางหลังทันทีที่มีโอกาส ใครคือฝายที่ถูก?"
 CHL_political_events.72.b: "เราจะไมประนีประนอมกับอุดมการณของเรา!"
 CHL_political_events.72.a: "ยังมีอีกหลายคนที่พรอมสูเพื่ออุดมการณตอตานจักรวรรดินิยม"
 CHL_mapuche_commuist_cultural_cross_pollination: "ชาวมาปูเชพรอมรวมมือกับคอมมิวนิสต"
 CHL_unlocks_various_communist_advisors: "§Yที่ปรึกษาฝายคอมมิวนิสตหลายคนจะเริ่มรวมมือกับชาวมาปูเช และพรอมใหแตงตั้ง§!"

 CHL_political_events.73.t: "การเลือกผูถือขวาน"
 CHL_political_events.73.desc: "ในที่สุดก็ถึงเวลาที่องคกรและกลุมตางๆ ของชาวมาปูเชจะตัดสินใจเลือกบุคคลที่จะรวมพวกเขาไวเปนหนึ่ง ผูที่จะนําพวกเขาไปสูชัยชนะเหนือศัตรูชาวสเปน สมกับจิตวิญญาณแหงสงครามตอตานชาวอินคา และเปนผูสืบทอดมรดกของเกาโปลิกัน พวกเขาจึงมารวมตัวกันเพื่อเลือกโตกีคนใหม หัวหนาเผายามสงคราม ผูจะรวมและนําประชาชนของตนไปสูอิสรภาพ"
 CHL_political_events.73.a: "ควรเปนมานูเอล มานกีเลฟ"
 CHL_political_events.73.b: "เอสเตบัน โรเมโร ซันโดบัล ไดรับเสียงสนับสนุนจากประชาชน"
 CHL_political_events.73.c: "เบนันซิโอ โกูเอปน เวนชูอัล นําเราได"

 CHL_political_events.74.t: "พิธีราชาภิเษกของอ็องตวนที่ 3"
 CHL_political_events.74.desc: "ขณะที่ประชาชนรวมตัวกันหนาทําเนียบประธานาธิบดีในซานติอาโก ทามกลางสงครามที่กําลังฉีกชาติออกเปนเสี่ยงๆ ประธานาธิบดีการโลส อิบาเญซ เดล กัมโป ประกาศวาเขาและรัฐสภาไดเลือกฌัก อ็องตวน แบรนาร เปนกษัตริยองคใหม ฟนคืนพระอิสริยยศที่ราชสกุลของพระองคสูญเสียไปตั้งแตป 1862 อิบาเญซระบุวาอ็องตวนที่ 3 คือหนทางรอดเดียวของชาติในตอนนี้ และเปนผูที่จะเชื่อมสังคมที่บอบชํ้าจากสงครามของเราใหกลับมาเปนหนึ่งเดียว"
 CHL_political_events.74.a: "ทรงพระเจริญ กษัตริยผูไดรับเลือก อ็องตวนที่ 3!"

 CHL_political_events.75.t: "[CHL.GetNameDefCap]ตองการขายอาริกาคืนใหเรา"
 CHL_political_events.75.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]ไดยื่นขอเสนอมา เนื่องจากวิกฤตเศรษฐกิจใน[CHL.GetName]ยังไมมีทีทาวาจะจบลง เขาจึงตองการเงินทุนอยางเรงดวน และขอใหเราซื้อรัฐอาริกาคืน ซึ่งพวกเขายึดไปจากเราตามสนธิสัญญาสันติภาพหลังสงครามแปซิฟก เราจะรับขอเสนอนี้หรือไม?"
 CHL_political_events.75.a: "นี่คือวันที่เรารอคอย!"
 CHL_political_events.75.b: "เราไมอยากเสี่ยงทําสงครามในอนาคต..."

 CHL_political_events.76.t: "[PRU.GetName]เลือกซื้ออาริกาจากเรา"
 CHL_political_events.76.desc: "[PRU.GetLeader]ระบุวาประเทศ[PRU.GetName]ยินดีรับขอเสนอขายอาริกาของเรา และไดสงทูตพรอมเงินทุนตามที่เราเรียกรองมาแลกเปลี่ยน"
 CHL_political_events.76.a: "การเสียสละที่จําเปนตองทํา"

 CHL_political_events.77.t: "[PRU.GetName]เลือกไมซื้ออาริกาจากเรา"
 CHL_political_events.77.desc: "[PRU.GetLeader]ระบุวาประเทศ[PRU.GetName]จะไมมีวันรับขอเสนอขายอาริกาของเรา เพราะดินแดนนี้สมควรกลับคืนสูพวกเขาโดยไมตองจายเงิน โดยอางวาการที่เรายึดภูมิภาคนี้ไปหลังสงครามแปซิฟกนั้นไมเปนธรรมและผิดกฎหมาย"
 CHL_political_events.77.a: "ชางอกตัญู!"

 CHL_news_events.1.t: "รัฐประหารฟาสซิสตใน[CHL.GetNameDef]"
 CHL_news_events.1.d: "มีรายงานวา Movimiento Nacional-Socialista ที่นําโดย[CHL.GetLeader] ไดกอรัฐประหารสําเร็จ และสถาปนา[CHL.GetNameDef]เปนรัฐพรรคการเมืองเดียวภายใตการปกครองของพวกเขา พวกเขามีความเชื่อมโยงกับขบวนการฟาสซิสตทั่วโลก แตยังไมแนชัดวาจะเขารวมกับมหาอํานาจใด หรือจะจํากัดตัวอยูแคในทวีปของตน"
 CHL_news_events.1.a: "เปนพัฒนาการที่นาสนใจจริงๆ"
 CHL_news_events.1.b: "เราจะทวงคืนความรุงโรจนของเรา!"

 CHL_news_events.2.t: "ชิลีประกาศฟนฟูราชอาณาจักรเกา"
 CHL_news_events.2.d: "[CHL.GetLeader]ประกาศฟนฟูราชอาณาจักรชิลีเกา แนวคิดการรวมดินแดนของชาวชิลีที่อางสิทธิ์เหนือพื้นที่สวนใหญของอารเจนตินามาตั้งแตสมัยอุปราชแหงเปรูของสเปน และ[CHL.GetNameDef]ไดเริ่มผนวกรวมดินแดนที่อางสิทธิ์แลว ทวาความทะเยอทะยานของพวกเขาไมไดหยุดแคนั้น เพราะพวกเขายังอางสิทธิ์เหนือภูมิภาคริโอเดลาปลาตาเพิ่มเติมอีก"
 CHL_news_events.2.a: "เพอฝนเกินไปแนๆ..."
 CHL_news_events.2.b: "ไมมีใครตานทานเราได!"

 CHL_news_events.3.t: "การกอตั้ง[CHL.GetNameDefCap]"
 CHL_news_events.3.d: "นับแตวันนี้ [CHL.GetLeader]ประกาศกอตั้ง[CHL.GetNameDef] และอางวาเปนมหาอํานาจโลกใหม พวกเขาระบุวาเปาหมายคือการปลดปลอยชาวฮิสแปนิกและละตินอเมริกาทั้งหมดที่อยูภายใตการกดขี่ของตางชาติ และภารกิจของพวกเขายังไมสิ้นสุด"
 CHL_news_events.3.a: "พวกเขาคิดวาตัวเองเปนใคร?"
 CHL_news_events.3.b: "เราคือมหาอํานาจโลกใหม!"

 CHL_political_events.78.t: "[FROM.GetNameDefCap]ขอความชวยเหลือจากเรา"
 CHL_political_events.78.desc: "[FROM.GetLeader] กษัตริยผูไดรับเลือกแหง[FROM.GetNameDef] ขอความชวยเหลือจากเราในสงครามตอตานพวกฟาสซิสตและคอมมิวนิสตชิลีที่ตองการโคนลมพระองค พระองคตองการอาวุธและอาสาสมัครมาชวยเหลือ เราจะตอบรับการเรียกรองใหจับอาวุธนี้หรือไม?"
 CHL_political_events.78.a: "ก็ได เราจะชวยพวกเขา"
 CHL_political_events.78.b: "แลวทําไมเราตองชวยพวกเขาดวย?"
 CHL_political_events.78.c: "เราจะชวยพวกเขา แตตองมีคาตอบแทน..."
 CHL_we_will_aid_for_a_price: "หากพวกเขาตอบรับ เราจะไดคาตอบแทนทางเศรษฐกิจจากความชวยเหลือ แตพวกเขาก็อาจปฏิเสธขอเสนอของเราได"

 CHL_political_events.79.t: "[FROM.GetName]เลือกชวยเหลือเรา"
 CHL_political_events.79.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตอบรับการเรียกรองใหจับอาวุธของเรา และใหคํามั่นวาจะสงอาวุธและอาสาสมัครมาใหมากที่สุดเทาที่จะทําได"
 CHL_political_events.79.a: "ก็ได"

 CHL_political_events.80.t: "[FROM.GetName]เลือกไมชวยเหลือเรา"
 CHL_political_events.80.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ไมฟงการเรียกรองใหจับอาวุธของเรา แถมยังอวยพรใหเราโชครายที่สุด ชางนารังเกียจ!"
 CHL_political_events.80.a: "ก็ชางมันเถอะ..."

 CHL_political_events.81.t: "[FROM.GetName]บอกวาจะชวยเหลือเรา แตตองมีคาตอบแทน"
 CHL_political_events.81.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef]ตอบรับการเรียกรองใหจับอาวุธของเรา และใหคํามั่นวาจะสงอาวุธและอาสาสมัครมาใหมากที่สุดเทาที่จะทําได อยางไรก็ตาม พวกเขาระบุวาความชวยเหลือนี้ไมไดมาฟรีๆ หากเราตองการ ก็ตองจายตอบแทนพวกเขา"
 CHL_political_events.81.a: "เราคงตองยอมรับ"
 CHL_political_events.81.b: "เราไมตองการพวกเขา!"

 CHL_news_events.4.t: "ชาวมาปูเชประกาศสงครามครูเสดตอตานจักรวรรดินิยม"
 CHL_news_events.4.d: "[CHL.GetLeader]แหง[CHL.GetNameDef]ประกาศวารัฐจะทําสงครามครูเสดตอตานจักรวรรดินิยม เพื่อปลดปลอยประชาชนในทวีปอเมริกาจากการกดขี่ของยุโรป หลายคนสงสัยวายุคอาณานิคมสิ้นสุดลงจริงๆ หรือนี่เปนเพียงอุปสรรคเล็กๆ อีกครั้งบนเสนทางของมหาอํานาจโลก"
 CHL_news_events.4.a: "นากังวล..."
 CHL_news_events.4.b: "เราจะนําเสรีภาพและความรุงเรืองไปสูผูที่ตองการ!"

 CHL_political_events.82.t: "เมืองหลวงแหงราชอาณาจักร"
 CHL_political_events.82.desc: "เมื่อราชอาณาจักรอาเราคาเนียและปาตาโกเนียแหงใหมของเราไดกอตั้งขึ้น ก็เกิดคําถามเกี่ยวกับสถานะของเรา ปจจุบันซานติอาโกยังคงเปนเมืองหลวง ซึ่งหมายความวาเราแทบไมตางอะไรจากรัฐชิลีเกาอันเสื่อมโทรม อยางไรก็ตาม ยังมีเมืองอื่นๆ ที่เหมาะจะเปนเมืองหลวงใหมของราชอาณาจักร พระประสงคของอ็องตวนที่ 3 กษัตริยสูงสุดของเราคืออะไร?"
 CHL_political_events.82.a: "ซานติอาโกจะยังคงเปนเมืองหลวงของเรา"
 CHL_political_events.82.b: "เปรเกนโกเคยเปนเมืองหลวงเกา"
 CHL_political_events.82.c: "เราตองมีเมืองหลวงที่อยูใตสุดของโลก!"
 CHL_political_events.82.d: "รอวสันเปนตัวเลือกที่ดีทางตะวันออก"

 CHL_political_events.83.t: "ความพยายามรัฐประหารของแนวรวมตอตานอิบาเญซ"
 CHL_political_events.83.d: "หลังการประทวงและนัดหยุดงานหลายวัน ฝายสังคมนิยม คอมมิวนิสต และฟาสซิสตก็ตัดสินใจลงมือโจมตีรัฐบาลของเราในที่สุด เมื่อเห็นโอกาสเปดอยูตรงหนา พวกเขาเรียกรองใหการโลส อิบาเญซ เดล กัมโป สงมอบอํานาจใหฆอรเฆ กอนซาเลซ ฟอน มาเรส โดยเร็วที่สุด แตเราจะไมยอมแพโดยไมสู มีรายงานการปะทะทั่วประเทศ และมีแนวโนมวาสงครามกลางเมืองกําลังจะปะทุขึ้น..."
 CHL_political_events.83.a: "ระดมกองกําลังพิทักษชาติทันที!"
 CHL_political_events.83.b: "ยึดดินแดนไวใหไดมากที่สุด!"
 CHL_fascist_and_communist_joint_civil_war_started: "สงครามกลางเมืองตอตานอิบาเญซไดเริ่มขึ้นแลว"
 CHL_secures_araucania_for_the_cw_tt: "§Yอาเราคาเนีย§!จะถูกกองกําลังของเรายึดไว"
 CHL_approached_by_mysterious_frenchman: "ไดรับการติดตอจากฌัก อ็องตวน แบรนาร ระหวางสงครามกลางเมืองชิลี"

 CHL_political_events.84.t: "ชายแปลกหนาลึกลับติดตอรัฐบาล"
 CHL_political_events.84.desc: "เมื่อชวงเชาวันนี้ ขณะที่ขาวสงครามกลางเมืองของเราเริ่มแพรไปทั่วโลก ประธานาธิบดีการโลส อิบาเญซ เดล กัมโป ไดรับสาสนจากฝรั่งเศส ชายลึกลับผูหนึ่งอางวาเปนทายาทของราชวงศเกาแกในชิลี สืบเชื้อสายมาจากออเรลี-อ็องตวนที่ 1 กษัตริยแหงอาเราคาเนียและปาตาโกเนีย เขาระบุวาไดรับไฟเขียวจากพอคาและทหารรับจางชาวฝรั่งเศสใหมาชวยเหลือเรา แตอางวาตองมีคาตอบแทน สถานการณดูเลวราย และอาจตองใชมาตรการเด็ดขาดในไมชา"
 CHL_political_events.84.a: "ถึงตอนนี้ เขาอาจเปนความหวังเดียวของเราจริงๆ..."

 CHL_political_events.85.t: "[RAP.GetNameDefCap]ประกาศเอกราช"
 CHL_political_events.85.desc: "เกาะอีสเตอร ที่ชาวพื้นเมืองเรียกวาราปานุย อยูภายใตการควบคุมโดยตรงของเรามาตั้งแตการผนวกราชอาณาจักรราปานุยในป 1910 โดยรัฐนี้ดํารงอยูตั้งแตปที่ 10 จนถึงตอนนั้น บัดนี้พวกเขาไดรวมตัวกันอีกครั้งภายใตอาริกิชาวพื้นเมือง วาเลนติโน ริโรโรโก ตูกี และคณะผูสําเร็จราชการที่ดูแลเขา รัฐโพลินีเชียนี้ตองการตัดความสัมพันธทั้งหมดกับเรา จึงประกาศเอกราช เราจะยอมรับเรื่องนี้หรือไม?"
 CHL_political_events.85.a: "ตอนนี้เราไมมีกําลังพอจะจัดการพวกเขา"
 CHL_political_events.85.b: "นี่หมายถึงสงคราม!"
 CHL_political_events.85.c: "ถึงเวลาที่โพลินีเชียจะผงาด!"

 CHL_political_events.86.t: "[FROM.GetName]ขอเปนพันธมิตร"
 CHL_political_events.86.desc: "[FROM.GetLeader] กษัตริยผูมีอธิปไตยแหง[FROM.GetNameDef] และพลเมืองของรัฐฝรั่งเศส ไดขอใหเรารวมตัวกันและชวยเหลือกันในการแผขยายอํานาจครอบงําของฝรั่งเศสไปทั่วโลก เราจะวาอยางไร?"
 CHL_political_events.86.a: "เราแข็งแกรงกวาเมื่ออยูดวยกัน"
 CHL_political_events.86.b: "เราไมจําเปนตองพึ่งพวกเขา"

 CHL_political_events.87.t: "[FROM.GetName]ตอบรับคําขอของเรา"
 CHL_political_events.87.desc: "[FROM.GetLeader]ผูยิ่งใหญแหง[FROM.GetNameDef]ไดตอบรับคําขอของเราใหเขารวมเปนพันธมิตรอยางเปนทางการ และเราขอขอบคุณพระองค เราแข็งแกรงกวาเมื่ออยูดวยกัน!"
 CHL_political_events.87.a: "สองยอมดีกวาหนึ่ง"

 CHL_political_events.88.t: "[FROM.GetName]ปฏิเสธคําขอของเรา"
 CHL_political_events.88.desc: "[FROM.GetLeader]ผูทรยศแหง[FROM.GetNameDef]ไดปฏิเสธคําขอของเราใหเขารวมเปนพันธมิตรอยางเปนทางการ แมเราจะมีผลประโยชนและมรดกรวมกันก็ตาม"
 CHL_political_events.88.a: "เราถูกหักหลัง..."
 united_french_monarhcist_faction: "อํานาจครอบงําของโลกฝรั่งเศส"

 CHL_news_events.5.t: "ราชอาณาจักรอาเราคาเนียและปาตาโกเนียใหม"
 CHL_news_events.5.desc: "แมราชอาณาจักรนี้จะเคยดํารงอยูเพียงสองปสั้นๆ ในทศวรรษ 1860 แตฌัก อ็องตวน แบรนาร ผูอางสิทธิ์ในราชบัลลังกเกา ไดกลับมายังชิลีทามกลางความโกลาหล และทวงคืนราชอาณาจักรที่สูญหายไปนาน มีเพียงเวลาเทานั้นที่จะบอกไดวาเรื่องนี้จะลงเอยอยางไร..."
 CHL_news_events.5.a: "อะไรนะ?"
 CHL_news_events.5.b: "เรากลับมาแลว และแข็งแกรงกวาที่เคย!"

 CHL_news_events.6.t: "การจมของเรือ SS Tolten"
 CHL_news_events.6.desc: "เรือ SS Tolten ของชิลีซึ่งเปนกลาง กําลังแลนโดยไมมีเรือคุมกันจากบัลติมอรไปยังนครนิวยอรก เมื่อถูกตอรปโดจากเรือดํานํ้าเยอรมันโจมตีบริเวณใกลสะพานเดินเรือ นอกชายฝงบารนีแกต รัฐนิวเจอรซีย เรือจมลงภายในหกนาที และหลังจากเรือจมแลวเทานั้น ลูกเรือ U-boat จึงยืนยันไดวาเปนเรือของชิลี เรื่องนี้อาจกลายเปนหายนะทางการทูตของเยอรมนี"
 CHL_news_events.6.a: "ประกายไฟถูกจุดขึ้นแลว"
 CHL_news_events.6.b: "ชางเปนโศกนาฏกรรมโดยแท"

 CHL_news_events.7.t: "[CHL.GetNameDefCap]ประกาศใชการปองกันเชิงรุก"
 CHL_news_events.7.desc: "[CHL.GetLeader]แหง[CHL.GetNameDef]ประกาศวาประเทศจะใชนโยบายปองกันเชิงรุกเพื่อพิทักษอธิปไตยของ[CHL.GetAdjective]และ[RAP.GetAdjective] ดวยการประกาศสงครามอยางเปนทางการกับชาติที่มองวาเปนภัยคุกคามในสมรภูมิแปซิฟก โดยเลือกนําสงครามไปสูผูรุกรานที่อาจเกิดขึ้น แทนที่จะสูรบในดินแดนของตนเอง"
 CHL_news_events.7.a: "การตัดสินใจที่นาสนใจ"
 CHL_news_events.7.b: "ราปานุยตองไดรับการปกปอง"

 CHL_political_events.89.t: "[FROM.GetNameDefCap]เสนอปกปอง[270.GetName]"
 CHL_political_events.89.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef] พันธมิตรของเรา ไดยื่นคําของายๆ มา คือใหสละการควบคุม[270.GetName]แกพวกเขา เนื่องจากอยูใกลดินแดนใจกลางของพวกเขามากกวาและปกปองไดงายกวา เพื่อไมใหกลายเปนชองโหวทางยุทธศาสตรที่ศัตรูอาจใชโจมตีพวกเขาได"
 CHL_political_events.89.a: "ใหพวกเขาไปเถอะ"
 CHL_political_events.89.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 CHL_political_events.90.t: "[FROM.GetName]สงมอบ[270.GetName]ใหเรา"
 CHL_political_events.90.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef] พันธมิตรของเรา ไดสงมอบ[270.GetName]ใหเราตามคําขอ ในที่สุดประชาชนของเราก็รูสึกปลอดภัยจากภัยคุกคามตางชาติ และเก็บพลังไวจัดการปญหาภายในได"
 CHL_political_events.90.a: "ถึงเวลารับหนาที่ปกปองพิตแครนแลว!"

 CHL_political_events.91.t: "[FROM.GetName]ปฏิเสธที่จะสงมอบ[270.GetName]ใหเรา"
 CHL_political_events.91.desc: "[FROM.GetLeader]แหง[FROM.GetNameDef] พันธมิตรของเรา ไมยอมสงมอบ[270.GetName]ใหเรา พวกเขาอางวามันอันตรายเกินไป และเราก็แคเกาะกินจักรวรรดิของพวกเขา"
 CHL_political_events.91.a: "เอาเถอะ เราคงตองทําเทาที่มี..."
 CHL_political_events.91.b: "เราตองลงมือจัดการเอง!"

 CHL_political_events.92.t: "ซาปาอินคาองคใหม"
 CHL_political_events.92.desc: "เมื่อเราไดสรางราชอาณาจักรบริวารใหม คือจักรวรรดิอินคาแลว เราจําเปนตองเลือกนายพลคนหนึ่งใหนําพวกเขาในฐานะซาปาอินคา ตามแนวทางของหลักนิยมนโปเลียน ใครควรไดรับตําแหนงอันทรงเกียรตินี้?"
 CHL_political_events.92.a: "เราจะมอบตําแหนงใหผูที่ดีที่สุดของเรา!"
 CHL_political_events.92.b: "นายทหารหนุมผูปราดเปรื่องก็นาจะเหมาะ"
 CHL_political_events.92.c: "มอบตําแหนงใหชาวมาปูเช"

 CHL_political_events.93.t: "กษัตริยแหงเอลโดราโด"
 CHL_political_events.93.desc: "บัดนี้เมื่อเราไดสถาปนารัฐที่จําลองแบบราชอาณาจักรเอลโดราโดในตํานานแลว เราควรมอบตําแหนงกษัตริยผูเรืองรองใหแกนายพลผูภาคภูมิและภักดีคนหนึ่งของเรา ใครสมควรไดรับบทบาทนี้?"
 CHL_political_events.93.a: "บารโตโลเม บลังเช รูวิธีนําทัพ!"
 CHL_political_events.93.b: "เกรโกริโอ โรดริเกซ ตัสกอน สมควรไดรับตําแหนง!"
 CHL_political_events.93.c: "กินตีน ลาเม ควรปกครองรัฐนี้!"

 CHL_political_events.94.t: "องคอธิปตยแหงฮิสปนโยลา"
 CHL_political_events.94.desc: "บัดนี้เมื่อเรารวมเกาะฮิสปนโยลาไวภายใตการปกครองของเราแลว ถึงเวลาที่จะมอบตําแหนงกษัตริยแหงเกาะใหแกนายพลผูภักดีคนหนึ่งของเรา ใครจะไดรับตําแหนงอันทรงเกียรตินี้?"
 CHL_political_events.94.a: "ออสการ เอสกูเดโร โอตาโรลา รับตําแหนงไปได"
 CHL_political_events.94.b: "เปโดร ดารตเนลล รับใชเราอยางดีมาเปนเวลานาน"
 CHL_political_events.94.c: "แคริบเบียนจะกลับมาอยูภายใตการปกครองของชนพื้นเมืองอีกครั้ง!"

 CHL_political_events.95.t: "Movimiento Nacional-Socialista เพิ่มความเคลื่อนไหว"
 CHL_political_events.95.desc: "มีรายงานใหมจากผูอํานวยการใหญของ Carabineros de Chile เสนอใหดําเนินการกับกระแสนิยมฟาสซิสตที่กําลังเพิ่มขึ้นในหมูประชาชนทั่วไป และใหสืบสวนเพิ่มเติมถึงความเคลื่อนไหวที่เพิ่มขึ้นเมื่อไมนานมานี้ของพรรค Movimiento Nacional-Socialista ของฆอรเฆ กอนซาเลซ ฟอน มาเรส เชื่อกันวาพวกเขาอาจกําลังวางแผนโคนลมรัฐบาลของเรา ดังนั้นเราตองเฝาระวัง"
 CHL_political_events.95.a: "เรารับมือได"

 CHL_political_events.96.t: "การยึดอํานาจที่ปาลาซิโอเดลาโมเนดา"
 CHL_political_events.96.desc: "ทหารผูภักดีของเราดําเนินการตามแผนไดโดยไมมีผูใดขัดขวาง และเขายึดปาลาซิโอเดลาโมเนดา ที่ซึ่งอารตูโร อเลสซานดรี และคณะรัฐมนตรีของเขาอยูภายใน พวกเขาสั่งใหประธานาธิบดีลาออกเพื่อเปดทางใหฆอรเฆ กอนซาเลซ ฟอน มาเรส บัดนี้รัฐบาลเสรีนิยมไมอาจทําอะไรเพื่อหยุดยั้งเราไดอีกแลว!"
 CHL_political_events.96.a: "วันนี้เราคือผูชนะ!"

 CHL_political_events.97.t: "การตอตานของประชาชนกอตัวขึ้น และทหารรับจางผานศึกเดินทางมาถึง"
 CHL_political_events.97.desc:  "เมื่อกษัตริยของเราขึ้นครองราชย ประชาชนบางสวนในประเทศดูเหมือนจะไมพอใจ และเกิดการตอตานของประชาชนขึ้น ขณะเดียวกัน ทหารรับจางผานศึกก็หลั่งไหลเขามาในประเทศเพื่อเสนอความชวยเหลือแกรัฐบาลที่เพิ่งกอตั้งของเรา"
 CHL_political_events.97.a: "ทั้งความวุนวายและโชคลาภ"

 CHL_political_events.98.t: "[GER.GetName]ปฏิเสธการรับเขาฝายอักษะ"
 CHL_political_events.98.desc: "[GER.GetName]ปฏิเสธแนวคิดที่จะรับสมาชิกใหมเขาสูฝายอักษะ อยางนอยก็ในตอนนี้ เปนความเสียหายทางการทูตเล็กนอย แตไมมีอะไรที่เรารับมือไมได"
 CHL_political_events.98.a: "นาผิดหวัง"

 CHL_political_events.99.t: "[GER.GetName]ยอมรับการเขารวมฝายอักษะ"
 CHL_political_events.99.desc: "[GER.GetName]ตอบรับขอเสนอแลว นี่คือยุคใหมที่ปกครองโดยผูแข็งแกรง และเปนชัยชนะทางการทูตของรัฐบาลเรา"
 CHL_political_events.99.a: "มุงสูอนาคต!"

#### Brazil ####

JUNO_brazil_events.10.t: "การชุมนุมอินเตกราลิสตาขนาดเล็กใน[FROM.FROM.GetName]"
JUNO_brazil_events.10.desc: "แมจะมีการวางแผนมาอยางดีสําหรับการชุมนุมครั้งลาสุดใน[FROM.FROM.GetName] แตงานกลับคอนขางกรอย ฝูงชนผูสนับสนุนที่คาดไวไมปรากฏตัว สวนผูที่มาก็เปนกลุมคนจับฉายที่แทบไมเขาใจนโยบายของพรรคเลย ผูชมหลายคนดูงุนงงกับการที่สมาชิกในเครื่องแบบของเราเดินขบวนผานถนนของพวกเขา"
JUNO_brazil_events.10.a: "งานเล็กจนนาอาย"

JUNO_brazil_events.11.t: "การชุมนุมอินเตกราลิสตาใน[FROM.FROM.GetName]"
JUNO_brazil_events.11.desc: "แมจะมีการปะทะกับนักปลุกระดมฝายสังคมนิยมและเสรีนิยมในทองถิ่น แตการชุมนุมอินเตกราลิสตาใน[FROM.FROM.GetName]ก็ดึงดูดผูสนับสนุนไดจํานวนมาก ผูนําพรรคกลาวสุนทรพจนหลายครั้งเกี่ยวกับอนาคตของชาติ ซึ่งไดรับเสียงเชียรและเสียงโหรองจากฝูงชน สาขาพรรคในทองถิ่นประกาศแลววาจํานวนสมาชิกเพิ่มขึ้นมากหลังการชุมนุม"
JUNO_brazil_events.11.a: "เรากําลังไดรับแรงสนับสนุนจากมวลชน"

JUNO_brazil_events.12.t: "การชุมนุมอินเตกราลิสตาครั้งใหญใน[FROM.FROM.GetName]"
JUNO_brazil_events.12.desc: "มีรายงานวาผูคนเดินทางนานหลายวันจากทั่วประเทศเพียงเพื่อมารวมการชุมนุมอินเตกราลิสตาครั้งลาสุดใน[FROM.FROM.GetName] สมาชิกในเครื่องแบบหลายรอยคนพยายามรักษาความเปนระเบียบของฝูงชนเมื่อผูนําพรรคที่ดูงุนงงเล็กนอยมาถึง และแทบไมมีใครไดยินสุนทรพจนของพวกเขาทามกลางเสียงโหรองชื่นชมของผูฟง ดูเหมือนมวลชนที่ไมพอใจจะทนกับสภาพการเมืองแบบเดิมๆ ไมไหวอีกตอไป"
JUNO_brazil_events.12.a: "ประชาชนจะพาเราขึ้นสูอํานาจ"

JUNO_brazil_events.13.t: "ปฏิบัติการโบลีบารในบราซิลถูกขัดขวาง"
JUNO_brazil_events.13.desc: "หนวยขาวกรองของเราแจงวาสายลับและผูใหขอมูลจํานวนหนึ่งในบราซิลขาดการติดตอไปเมื่อไมนานมานี้ ดูเหมือนมีบางอยางเกิดขึ้นจนขัดขวางปฏิบัติการของเราในประเทศนั้น อาจเปนการตอตานขาวกรองที่รวมมือกับศัตรูของเรา ไมวาสาเหตุจะเปนอะไร นี่ก็บงชี้ถึงการเปลี่ยนแปลงนโยบายของ[BRA.GetAdjective]ที่เปนผลเสียตอเรา และเราควรคาดวาพวกเขาจะเคลื่อนไหวในลักษณะเดียวกันอีกในอนาคต"
JUNO_brazil_events.13.a: "เปนพัฒนาการที่นาเปนหวง"

JUNO_brazil_events.14.t: "นโยบายเพื่อนบานที่ดีของ[FROM.GetAdjective]"
JUNO_brazil_events.14.desc: "[FROM.GetLeader] ประธานาธิบดี[FROM.GetAdjective] ประกาศวารัฐบาลของตนตั้งใจจะแสวงหาความรวมมือที่มากขึ้นกับชาติตางๆ ในอเมริกาใต ภายใตสิ่งที่เรียกกันวานโยบาย ‘เพื่อนบานที่ดี’ ความรวมมือนี้จะออกมาในรูปแบบใดยังตองรอดูกันตอไป แตนี่เปนการเปลี่ยนแปลงครั้งสําคัญจากความสัมพันธที่เคยเปนปฏิปกษระหวางชาติที่พูดภาษาสเปนและโปรตุเกสในทวีปนี้"
JUNO_brazil_events.14.a: "เปนพัฒนาการที่นายินดี"
JUNO_brazil_events.14.b: "นี่เปนกลอุบายบอนทําลายเราอยางชัดเจน"

JUNO_brazil_events.15.t: "ความตกลง[ROOT.Capital.GetCapitalVictoryPointName]"
JUNO_brazil_events.15.desc: "ในชวงหลายเดือนที่ผานมา รัฐบาล[BRA.GetAdjective]ไดเขารวมการหารือรวมกับสมาชิกรัฐบาลของเราหลายครั้ง เกี่ยวกับการที่พวกเขาจะมีบทบาทเชิงรุกมากขึ้นในการสนับสนุนความพยายามทําสงครามของเรา แมพวกเขาจะยังไมสามารถสงกองกําลังทหารมาได แตก็ขอการสนับสนุนทางเศรษฐกิจโดยแลกกับคํามั่นวาจะสงกําลังมาในอนาคตอันใกล"
JUNO_brazil_events.15.a: "เรายินดีกับขอตกลงที่เปนประโยชนตอทั้งสองฝายนี้"
JUNO_brazil_events.15.b: "คํารับประกันของพวกเขาไรคา"

JUNO_brazil_events.16.t: "ความตกลง[FROM.Capital.GetCapitalVictoryPointName]"
JUNO_brazil_events.16.desc: "การหารือของเรากับรัฐบาล[USA.GetName]ประสบความสําเร็จ เราไดขอตกลงวา[BRA.GetNameDef]จะไดรับความชวยเหลือทางเศรษฐกิจจาก[USA.GetName] โดยแลกกับการจัดหาทรัพยากรใหพวกเขา และคํามั่นวาจะเขารวมสงครามเมื่อกองทัพของเราพรอม"
JUNO_brazil_events.16.a: "รวมกัน เราจะฟนฟูสันติภาพใหซีกโลกของเรา"

JUNO_brazil_events.17.t: "ความตกลง[FROM.Capital.GetCapitalVictoryPointName]ถูกปฏิเสธ"
JUNO_brazil_events.17.desc: "[USA.GetName]ตัดสินใจปฏิเสธขอตกลงที่จะผูกมัดใหเราสนับสนุนพวกเขาทางทหารโดยแลกกับความชวยเหลือทางเศรษฐกิจ บางทีจังหวะเวลาอาจไมเหมาะสําหรับประธานาธิบดี หรืออาจเปนสัญญาณการเปลี่ยนแปลงนโยบายตางประเทศตอบราซิล ไมวาอยางไร นี่คือการบั่นทอนความนาเชื่อถือของ[BRA.GetLeader]"
JUNO_brazil_events.17.a: "ตอนนี้เราควรเดินหมากอยางระมัดระวัง"

JUNO_brazil_events.18.t: "[FROM.GetNameDefCap]เรียกรองคํามั่นทางทหาร"
JUNO_brazil_events.18.desc: "[FROM.GetNameDefCap]เรียกรองใหเราปฏิบัติตามขอตกลงที่จะเขารวมกับพวกเขาทางทหารในสงครามที่กําลังดําเนินอยู เราไดรับประโยชนจากการลงทุนของพวกเขาในเศรษฐกิจของเรา แตจนถึงตอนนี้เรายังทําตามขอตกลงในสวนของเรานอยมาก หากเรายังไมทําในตอนนี้ อาจเกิดผลรายแรงตามมา"
JUNO_brazil_events.18.a: "เราจะรักษาคํามั่นของเรา"
JUNO_brazil_events.18.b: "เราจะไมหลั่งเลือด[BRA.GetAdjective]เพื่อ[FROM.GetNameDef]"
BRA_war_embargo_with_usa_tt: "§Rสิ่งนี้อาจทําให[USA.GetNameDef]ประกาศสงครามหรือควํ่าบาตรเรา!§!"

JUNO_brazil_events.19.t: "[FROM.GetNameDefCap]ไมยอมเขารวมสงคราม"
JUNO_brazil_events.19.desc: "นักการทูต[FROM.GetAdjective]แจงเราวาพวกเขายังไมพรอมจะเขารวมสงครามทางทหาร แมเราจะใหความชวยเหลือทางเศรษฐกิจแกพวกเขามาหลายปแลว ยังไมชัดเจนนักวาพวกเขาแคพยายามบิดพลิ้วคํามั่น หรือมีเหตุผลที่แทจริงที่ยังไมอาจทําตามได เราตองตัดสินใจอยางรอบคอบวาจะตอบโตอยางไร" 
JUNO_brazil_events.19.a: "บางทีถึงเวลาแลวที่จะแตงตั้งผูนําที่เปนมิตรกวานี้ใน[FROM.Capital.GetCapitalVictoryPointName]"
JUNO_brazil_events.19.b: "การไมทําตามสัญญาของพวกเขาควรถูกลงโทษ"
JUNO_brazil_events.19.c: "พวกเขาไมใชเรื่องที่เราตองสนใจอีกตอไป"

JUNO_brazil_events.20.t: "การประชุมแมนํ้าโปเตงจี"
JUNO_brazil_events.20.desc: "ระหวางการพบปะครั้งลาสุดของประธานาธิบดี[BRA.GetAdjective]และ[USA.GetAdjective]ทางตะวันออกเฉียงเหนือของบราซิล ฝายแรกไดตกลงที่จะปฏิบัติตามคํามั่นที่วางไวในความตกลง[USA.Capital.GetCapitalVictoryPointName] ซึ่งหมายความวาพวกเขาจะสงกองกําลังทหารเขารวมสงครามตอตานทรราชทั่วโลกที่เรากําลังทําอยู"
JUNO_brazil_events.20.a: "การเดินหมากทางการทูตของเราไดผลแลว"

JUNO_brazil_news.1.t: "[BRA.GetNonIdeologyName]ดําเนินนโยบายตางประเทศเชิงรุกราน"
JUNO_brazil_news.1.d: "ระยะหลังมานี้ รัฐบาล[BRA.GetAdjective]มีทาทีแข็งกราวและกาวราวขึ้นเรื่อยๆ ในประเด็นนโยบายตางประเทศ หลังความวุนวายมาหลายทศวรรษ ดูเหมือนระบอบลาสุดจะมั่นคงพอที่จะมองออกไปนอกพรมแดนเพื่อหาโอกาสที่เปนประโยชนตอ[BRA.GetName]โดยที่เพื่อนบานตองเสียประโยชน สิ่งนี้มีความหมายอยางไรตอความสัมพันธของเรากับรัฐบาลบราซิล ยังตองรอดูกันตอไป"
JUNO_brazil_news.1.a: "นี่เปนแควาทศิลปใชไหม?"

JUNO_brazil_news.2.t: "[BRA.GetNameDefCap]สวมมงกุฎกษัตริยองคใหม"
JUNO_brazil_news.2.d: "หลังจากแรงสนับสนุนที่ลดนอยถอยลง ประกอบกับกระแสนิยมของขบวนการฟนฟูจักรวรรดิที่พุงสูงขึ้นเมื่อไมนานมานี้ สภาแหงชาติ[BRA.GetAdjective]จึงยอมประนีประนอมกับประชาชน จะมีการราชาภิเษกพระมหากษัตริยภายใตรัฐธรรมนูญ แตสภาแหงชาติยังคงกุมอํานาจทางการเมืองเหนือประเทศไวดังเดิม พระราชภารกิจเชิงพิธีการจะถูกมอบใหแกกษัตริยพระองคใหม เพื่อหวังใหสถานการณกลับมามีเสถียรภาพ"
JUNO_brazil_news.2.a: "ทรงพระเจริญ"

JUNO_brazil_news.3.t: "[BRA.GetNonIdeologyName]และ[POR.GetNonIdeologyName]ประกาศรวมชาติ"
JUNO_brazil_news.3.d: "หลังจากกระแสนิยมกษัตริยที่เพิ่มสูงขึ้นทั้งใน[BRA.GetNameDef]และ[POR.GetNameDef] ทั้งสองประเทศไดตัดสินใจรวมเปนหนึ่งเดียวภายใตกษัตริยและธงผืนเดียวกันอีกครั้ง โดยอางถึงความปรารถนาที่จะใชความรูและทรัพยากรของกันและกัน บัดนี้ทั้งสองชาติมุงมั่นที่จะเติบโตไปดวยกันในฐานะหนึ่งเดียว"
JUNO_brazil_news.3.a: " ดีใจดวย!"

JUNO_brazil_news.4.t: "[BRA.GetNonIdeologyName]และ[POR.GetNonIdeologyName]กอตั้งเครือจักรภพ"
JUNO_brazil_news.4.d: "หลังจากความสัมพันธและความรวมมือที่แนนแฟนยิ่งขึ้นระหวาง[BRA.GetNameDefCap]และ[POR.GetNameDefCap] ทั้งสองประเทศไดตัดสินใจรวมกันกอตั้งเครือจักรภพเพื่อยกระดับความรวมมือใหมากยิ่งขึ้น"
JUNO_brazil_news.4.a: "เปนพลิกผันที่ไมมีใครคาดคิด"

JUNO_brazil_news.5.t: "การปฏิวัติคอมมิวนิสต[BRA.GetAdjective]"
JUNO_brazil_news.5.d: "ความวุนวายที่ดําเนินอยูใน[BRA.GetNonIdeologyName]ไดบานปลายจนเกินควบคุมในชวงไมกี่วันที่ผานมา และนําไปสูสงครามกลางเมืองอันนองเลือด รัฐบาลเคยสกัดแผนการของขบวนการคอมมิวนิสตที่จะโคนลมระบอบไดในป 1935 แตก็ไมอาจตานกระแสแดงที่โหมแรงกวาเดิมได แมกองทัพสวนใหญยังคงจงรักภักดีตอรัฐบาลกลาง แตนายทหารชั้นผูนอยจํานวนมากกลับเขาขางฝายคอมมิวนิสต หลายฝายในภูมิภาคกังวลวา[BRA.GetNonIdeologyName]ที่เปนคอมมิวนิสตจะกอใหเกิดปรากฏการณโดมิโนไปทั่วทวีปอเมริกาใต"
JUNO_brazil_news.5.a: "นาเศราที่ตองมาถึงจุดนี้"

JUNO_brazil_news.6.t: "รัฐประหารคอมมิวนิสตใน[ROOT.GetNonIdeologyName]"
JUNO_brazil_news.6.d: "ความวุนวายที่ดําเนินอยูใน[BRA.GetNonIdeologyName]ไดบานปลายจนเกินควบคุมในชวงไมกี่วันที่ผานมา และนําไปสูการรัฐประหารของฝายคอมมิวนิสต รัฐบาลเคยสกัดแผนการของขบวนการคอมมิวนิสตที่จะโคนลมระบอบไดในป 1935 แตก็ไมอาจตานกระแสแดงที่โหมแรงกวาเดิมได แมกองทัพสวนใหญยังคงจงรักภักดีตอรัฐบาลกลาง แตนายทหารชั้นผูนอยจํานวนมากกลับเขาขางฝายคอมมิวนิสต หลายฝายในภูมิภาคกังวลวา[BRA.GetNonIdeologyName]ที่เปนคอมมิวนิสตจะกอใหเกิดปรากฏการณโดมิโนไปทั่วทวีปอเมริกาใต"
JUNO_brazil_news.6.a: "แตรัฐบาลใหมจะอยูไดนานแคไหน?"

JUNO_brazil_news.7.t: "การสวรรคตของเปดรู ดี อัลกันตารา"
JUNO_brazil_news.7.desc: "จักรพรรดิผูเฒาของเรา ดง เปดรู ดี อัลกันตารา แหงออรเลอ็อง-บรากังซา เจาชายแหงกรางปารา และจักรพรรดิแหงบราซิล ไดสวรรคตแลว ตลอดรัชสมัยอันสั้นของพระองค ทรงเปนสัญลักษณแหงสันติภาพและเสถียรภาพของประชาชน และเปนศูนยรวมใจของชาว[FROM.GetAdjective]ในหวงเวลาอันปนปวนนี้ ประชาชนผูโศกเศราพากันออกมาบนทองถนนเพื่อแสดงความซาบซึ้งและความจงรักภักดีตอจักรพรรดิผูลวงลับ \n\n ประเทศชาติตางหวังวารัชทายาทและผูสืบราชสมบัติของจักรพรรดิผูเฒา เจาชายเปดรู กัสตาง จะทรงเปนหลักชัยอันมั่นคงของชาว[FROM.GetAdjective]เชนเดียวกัน อีกไมนานเจาชายจะไดรับการราชาภิเษกเปนจักรพรรดิดง เปดรูที่ 4 ขอใหทรงครองราชยยืนนาน!"
JUNO_brazil_news.7.a: "ทรงพระเจริญ เปดรู กัสตาง แหงออรเลอ็อง-บรากังซา!"

JUNO_brazil_events.30.t: "[FROM.GetNameDefCap]เสนอความรวมมือ"
JUNO_brazil_events.30.desc: "นักการทูตจาก[FROM.GetNameDef]ไดเขาพบเราพรอมขอเสนอความรวมมือทางทหารและเศรษฐกิจ พวกเขาระบุวากังวลอยางยิ่งตอสถานการณโลก และเชื่อวาหนทางเดียวสูสันติภาพที่ยั่งยืนคือการผนึกกําลังกับเรา และกําจัดศัตรูทางภูมิรัฐศาสตรที่เรามีรวมกันใหสิ้นซาก"
JUNO_brazil_events.30.a: "เรายอมรับขอเสนอนี้"
JUNO_brazil_events.30.b: "เราไมตองการตัวถวงเชนนี้"

JUNO_brazil_events.31.t: "[BRA.GetNameDefCap]ชวยเหลือปฏิบัติการขาวกรอง"
JUNO_brazil_events.31.desc: "หนวยขาวกรองของเรารายงานวาไดสรางความสัมพันธการทํางานอันใกลชิดกับหนวยงาน[BRA.GetAdjective]แลว สิ่งนี้นําไปสูการขยายเครือขายการรวบรวมขาวกรองในอเมริกาใตของเรา ซึ่งรูจักกันในชื่อปฏิบัติการโบลิวาร ดูเหมือนวาความรวมมือในระยะแรกกับ[BRA.GetName]เริ่มผลิดอกออกผลแลว" 
JUNO_brazil_events.31.a: "เราจะรวมกันครองอเมริกาใต"

JUNO_brazil_events.32.t: "[BRA.GetNameDefCap]เรียกรองดินแดนในเกียนา"
JUNO_brazil_events.32.desc: "พวกแรงที่ปกครอง[BRA.GetNameDef]กําลังพยายามใชความขัดแยงระดับโลกในขณะนี้เปนโอกาสในการแบล็กเมลใหเรายกดินแดนในเกียนาให พวกเขาเรียกรองใหเราสงมอบดินแดน มิฉะนั้นจะยึดเอาดวยกําลัง การรักษาดินแดนไวอาจเปนเรื่องยากหากถึงขั้นทําสงคราม แตการยอมก็จะสรางบรรทัดฐานอันตรายใหแกดินแดนพิพาทอื่น ๆ ทั่วโลก" 
JUNO_brazil_events.32.a: "เกียนาไมคุมที่จะทําสงครามดวย"
JUNO_brazil_events.32.b: "เราจะไมยอมให[BRA.GetNameDef]แบล็กเมล"

JUNO_brazil_events.33.t: "[FROM.GetName]ยอมโอนดินแดน"
JUNO_brazil_events.33.desc: "รัฐบาล[FROM.GetName]ยอมโอนกรรมสิทธิ์ดินแดนของพวกเขาในเกียนาใหแกเราอยางไมเต็มใจ หลังจากที่เรายื่นขอเรียกรองไป ดูเหมือนวายุทธวิธีการทูตแบบเสี่ยงถึงขอบเหวที่เราเพิ่งคนพบจะประสบผลสําเร็จ" 
JUNO_brazil_events.33.a: "พวกเขาแทบไมมีทางเลือกนอกจากยอมเรา"

JUNO_brazil_events.34.t: "[FROM.GetName]ปฏิเสธการโอนดินแดน"
JUNO_brazil_events.34.desc: "รัฐบาล[FROM.GetName]ปฏิเสธที่จะโอนกรรมสิทธิ์ดินแดนของพวกเขาในเกียนาใหแกเรา หลังจากที่เรายื่นขอเรียกรองไป บัดนี้เราตองตัดสินใจวาจะทําตามคําขูและยึดดินแดนดวยกําลัง หรือจะยอมเสียหนาทางการทูตดวยการถอย" 
JUNO_brazil_events.34.a: "พวกเขาจับไดวาเราขู เราตองถอย"
JUNO_brazil_events.34.b: "เราจะทําใหพวกเขาเสียใจกับการตัดสินใจนั้น"

JUNO_brazil_events.35.t: "[FROM.GetName]ยอมถอย"
JUNO_brazil_events.35.desc: "แมจะมีวาทกรรมกราวราวเรื่องดินแดนของเราในเกียนา แตดูเหมือนความพรอมที่จะทําสงครามกับเราจริง ๆ ของฝาย[BRA.GetAdjective]จะไมเกิดขึ้น นักการทูตจาก[BRA.GetNameDef]แจงเราวาพวกเขาจะหาวิธีอื่นเพื่อใหไดดินแดนมา แตจะทําอยางสันติ อยางนอยก็ในตอนนี้" 
JUNO_brazil_events.35.a: "ถึงอยางไรเราก็ควรจับตาดูพวกเขาไว"

JUNO_brazil_events.36.t: "[FROM.GetName]เตรียมทําสงคราม"
JUNO_brazil_events.36.desc: "ดูเหมือนวาเรากําลังอยูบนปากเหวของความขัดแยงที่มากขึ้นอีก หลังจากที่เราปฏิเสธจะสงมอบดินแดนใหแก[FROM.GetNameDef] แมเราจะหวังวาพวกเขาแคขู แตขาวกรองจากภูมิภาคบงชี้วากองทัพ[BRA.GetAdjective]กําลัง  เตรียมการยึดดินแดนดวยกําลัง" 
JUNO_brazil_events.36.a: "การนองเลือดที่ไรความจําเปนอีกแลว..."

JUNO_brazil_events.37.t: "ความเคลื่อนไหวนาสงสัยใน[BRA.GetNameDef]"
JUNO_brazil_events.37.desc: "มีรายงานเขามาวาความเคลื่อนไหวทางทหารในบราซิลตอนใตเพิ่มขึ้น ความสัมพันธระหวางสองชาติในระยะหลังเย็นชาเปนอยางดีที่สุด และวาทกรรมแข็งกราวของพวกเขาทําใหหลายคนคาดการณวาเราอาจใกลถูกรุกราน ฝายทหารจํานวนมากตางเรงเตรียมแนวปองกันเผื่อกรณีเลวรายที่สุด แตก็มีบางสวนที่ผลักดันใหโจมตีกอนที่ฝาย[BRA.GetAdjective]จะเตรียมพรอมเต็มที่" 
JUNO_brazil_events.37.a: "นี่ตองเปนกลลวงแน"
JUNO_brazil_events.37.b: "การรุกคือการปองกันที่ดีที่สุด"

JUNO_brazil_events.38.t: "[ARG.GetNameDefCap]ติดกับ"
JUNO_brazil_events.38.desc: "[ARG.GetNameDefCap]ดูเหมือนกําลังเตรียมกองกําลังเพื่อโจมตีเรา หลังจากการยั่วยุของเราตามแนวชายแดนเมื่อไมนานนี้ พวกเขาหารูไมวากําลังตกหลุมพรางของเรา อีกไมนานเราจะไดโอกาสบดขยี้พวกเขา และพวกเขาจะตองรับคําประณามจากนานาชาติในฐานะผูกอสงคราม" 
JUNO_brazil_events.38.a: "งายเกินไป"

JUNO_brazil_events.39.t: "[ARG.GetNameDefCap]ไมติดกับ"
JUNO_brazil_events.39.desc: "จนถึงตอนนี้ยังไมมีสัญญาณวาชาว[ARG.GetAdjective]เตรียมจะบุกขามพรมแดนของเรา อยางมากที่สุดพวกเขาดูเหมือนกําลังเสริมการปองกันของตนเอง ซึ่งทําใหการดําเนินการใด ๆ ของเรายากขึ้น ถึงอยางไร สักวันหนึ่งเราจะตองเลือกระหวางโจมตีกอนหรือถอยออกมา" 
JUNO_brazil_events.39.a: "ถึงเวลาถอยแลว"
JUNO_brazil_events.39.b: "เราแคตองการเวลาอีกหนอย"

JUNO_brazil_events.40.t: "[BRA.GetNameDefCap]ยื่นคําขาด"
JUNO_brazil_events.40.desc: "เอกอัครราชทูต[BRA.GetAdjective]ประจํา[ROOT.Capital.GetCapitalVictoryPointName]ไดยื่นแถลงการณจากรัฐบาลของตน ในแถลงการณนั้น เราถูกสั่งใหเปดพรมแดนแก[BRA.GetNameDef]และวางอาวุธโดยทันที แถลงการณยังอธิบายโดยละเอียดวาชาติของเราจะถูกรวมเขาเปนรัฐหนึ่งของ[BRA.GetNameDef]โดยมีผลทันที หากเราไมยอมทําตาม พวกเขาระบุวาจะดําเนินการตามแผนดวยกําลัง" 
JUNO_brazil_events.40.a: "เราไมมีทางเลือกนอกจากยอมจํานน"
JUNO_brazil_events.40.b: "เราจะทําใหพวกเขาชดใชทุกตารางนิ้วของแผนดินเรา"

JUNO_brazil_events.41.t: "[FROM.GetNameDefCap]ยอมรับการผนวก"
JUNO_brazil_events.41.desc: "รัฐบาล[FROM.GetNameDefCap]ไดยอมรับขอเสนอใหเขาเปนรัฐของเราแลว นั่นหมายความวาไมจําเปนตองใชกําลังทหารเพื่อยึดชาติเล็ก ๆ แหงนี้อีกตอไป" 
JUNO_brazil_events.41.a: "พวกเขาไมมีทางเลือกจริง ๆ นอกจากยอมรับ"

JUNO_brazil_events.42.t: "[FROM.GetNameDefCap]ปฏิเสธการผนวก"
JUNO_brazil_events.42.desc: "รัฐบาล[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอใหเขาเปนรัฐหนึ่งของ[ROOT.GetNameDef]อยางโงเขลา ดูเหมือนวาเราจะตองเลือกระหวางทําตามคําขูดวยการทําสงคราม หรือถอยและปลอยใหพวกเขาปกครองตนเองตอไปในตอนนี้" 
JUNO_brazil_events.42.a: "เรื่องนี้ไมคุมที่จะทําสงคราม"
JUNO_brazil_events.42.b: "พวกเขาจะไดรับรูถึงความพิโรธของเรา"

JUNO_brazil_events.43.t: "[FROM.GetName]ยอมถอย"
JUNO_brazil_events.43.desc: "แมจะมีวาทกรรมกราวราวและความตองการผนวกเราเขาเปนสวนหนึ่งของชาติพวกเขา แตดูเหมือนความพรอมที่จะทําสงครามกับเราจริง ๆ ของฝาย[BRA.GetAdjective]จะไมเกิดขึ้น นักการทูตจาก[BRA.GetNameDef]แจงเราวาพวกเขาจะหาวิธีอื่นเพื่อใหไดดินแดนของเรา แตจะทําอยางสันติ อยางนอยก็ในตอนนี้" 
JUNO_brazil_events.43.a: "ถึงอยางไรเราก็ควรจับตาดูพวกเขาไว"

JUNO_brazil_events.44.t: "[FROM.GetName]เตรียมทําสงคราม"
JUNO_brazil_events.44.desc: "ดูเหมือนวาเรากําลังอยูบนปากเหวของความขัดแยงที่มากขึ้นอีก หลังจากที่เราปฏิเสธจะสงมอบดินแดนใหแก[FROM.GetNameDef] แมเราจะหวังวาพวกเขาแคขู แตขาวกรองจากภูมิภาคบงชี้วากองทัพ[BRA.GetAdjective]กําลัง  เตรียมการยึดดินแดนดวยกําลัง" 
JUNO_brazil_events.44.a: "เราจะทําใหประวัติศาสตรซํ้ารอยอีกครั้ง"

JUNO_brazil_events.45.t: "[BRA.GetNameDefCap]ยื่นคําขาด"
JUNO_brazil_events.45.desc: "เอกอัครราชทูต[BRA.GetAdjective]ประจํา[ROOT.Capital.GetCapitalVictoryPointName]ไดยื่นแถลงการณจากรัฐบาลของตน ดูเหมือนรัฐบาลของพวกเขากังวลเรื่องความไมมั่นคงที่นี่ และตองการใชกองทัพของตนมาสรางเสถียรภาพใหชาติของเรา แตในความเปนจริง นี่ก็คือการเปลี่ยนระบอบภายใตหนากากของความชวยเหลือ" 
JUNO_brazil_events.45.a: "เราตานพวกเขาไมไหว"
JUNO_brazil_events.45.b: "เราจะไมลงนามสละอธิปไตยของเรา"

JUNO_brazil_events.46.t: "[FROM.GetName]ยอมรับขอเสนอ"
JUNO_brazil_events.46.desc: "[FROM.GetNameDefCap]เลือกอยางชาญฉลาดที่จะยอมตอกองทัพของเรา แทนที่จะเสี่ยงตอความขัดแยง บัดนี้เรากําลังดําเนินการจัดตั้งระบอบใหมในประเทศนั้นที่สอดคลองกับแนวทางของเรามากขึ้น" 
JUNO_brazil_events.46.a: "พวกเขาจะเปนรัฐกันชนที่มีคา"

JUNO_brazil_events.47.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอ"
JUNO_brazil_events.47.desc: "รัฐบาล[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเราที่จะสรางเสถียรภาพใหชาติของพวกเขา ดูเหมือนวาหากเราตองการเปลี่ยนระบอบที่นั่น เราจะตองใชแสนยานุภาพทางทหาร" 
JUNO_brazil_events.47.a: "สงครามอาจบานปลายจนควบคุมไมได"
JUNO_brazil_events.47.b: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

JUNO_brazil_events.48.t: "[FROM.GetNameDefCap]ยอมถอย"
JUNO_brazil_events.48.desc: "กองทัพ[FROM.GetAdjective]ดูเหมือนกําลังถอนกําลัง แมเราจะปฏิเสธขอเสนอ 'สรางเสถียรภาพ' ของพวกเขา ดูเหมือนเราจะจับไดวาพวกเขาแคขู และแทจริงแลวพวกเขาไมไดอยากทําสงครามสักเทาไร" 
JUNO_brazil_events.48.a: "ถึงอยางนั้นพวกเขาก็ทําใหภูมิภาคไรเสถียรภาพไปแลว"

JUNO_brazil_events.49.t: "ความตึงเครียดกับ[FROM.GetNameDef]ทวีความรุนแรง"
JUNO_brazil_events.49.desc: "หลังจากที่เราปฏิเสธขอเสนอของ[FROM.GetNameDef]ที่จะ 'สรางเสถียรภาพ' ใหชาติของเรา กองทัพของพวกเขาดูเหมือนกําลังเตรียมทําสงคราม เราไมรูวาพวกเขาจะโจมตีเมื่อใด แตคาดไดอยางปลอดภัยวาเราจะเปนเปาหมาย นักการทูตจากสถานทูตของพวกเขาดูเหมือนจะถูกอพยพออกไปแลวดวย ยิ่งเพิ่มความหวาดกลัววาสงครามอาจเลี่ยงไมได" 
JUNO_brazil_events.49.a: "เราตองยืนหยัดสู"

JUNO_brazil_events.50.t: "[FROM.GetNameDefCap]เสนอใหเขารวมเมรโกซูล"
JUNO_brazil_events.50.desc: "นักการทูตจาก[FROM.GetNameDef]ไดเขาพบเราพรอมขอเสนอใหเขาเปนสมาชิกขององคกรเหนือรัฐ ซึ่งรัฐสมาชิกจะประสานการตัดสินใจดานเศรษฐกิจและนโยบายตางประเทศรวมกัน แมจะเห็นประโยชนชัดเจนตอเศรษฐกิจของเราจากการประสานนโยบาย และสถานการณดานความมั่นคงอาจดีขึ้น แตก็มีบางฝายแยงวาการสูญเสียอธิปไตยไมคุมกับประโยชนที่ไดรับ" 
JUNO_brazil_events.50.a: "เรามีแตไดกับได เสียนอยนิด"
JUNO_brazil_events.50.b: "อธิปไตยสําคัญกวาความมั่งคั่ง"

JUNO_brazil_events.51.t: "[FROM.GetNameDefCap]ยอมรับการเขารวมเมรโกซูล"
JUNO_brazil_events.51.desc: "หลังจากการเจรจาและหารือกันอยางยาวนาน ในที่สุดรัฐบาล[FROM.GetNameDef]ก็ตกลงเขารวมเมรโกซูล นับจากนี้เราจะรวมมือกันในเรื่องเศรษฐกิจและนโยบายตางประเทศ เพื่อใหเกิดสันติภาพและความรุงเรืองทั่วทั้งภูมิภาค" 
JUNO_brazil_events.51.a: "เราแข็งแกรงขึ้นเมื่อรวมมือกัน"

JUNO_brazil_events.52.t: "[FROM.GetNameDefCap]ปฏิเสธการเขารวมเมรโกซูล"
JUNO_brazil_events.52.desc: "แมจะเจรจาและหารือกันอยางยาวนาน รัฐบาล[FROM.GetNameDef]ก็ปฏิเสธการเขาเปนสมาชิกเมรโกซูล แมจะมีคํามั่นเรื่องสันติภาพและความรุงเรือง แตพวกเขาดูไมเชื่อมั่นในความเปนไปไดขององคกร ถึงขั้นกลาวหาวาเปนชองทางใหเราควบคุมพวกเขาผานประตูหลัง" 
JUNO_brazil_events.52.a: "ไรสาระสิ้นดี"

JUNO_brazil_events.53.t: "[FROM.GetName]ปฏิเสธขอเสนอ"
JUNO_brazil_events.53.desc: "เอกอัครราชทูตจาก[FROM.GetNameDef]แจงเราวารัฐบาลของพวกเขาไมเชื่อวาความรวมมือทางทหารกับเราในตอนนี้จะเปนประโยชนสูงสุดตอชาติของตน ยังไมชัดเจนวาพวกเขามีแผนการของตนเองตอภูมิภาคของเรา หรือเพียงแคมองวาเราเปนภาระสําหรับพวกเขา" 
JUNO_brazil_events.53.a: "ชางสายตาสั้นเสียจริง"

south_american_news.50.t: "บราซิลประกาศภาวะฉุกเฉิน"
south_american_news.50.d: "เชานี้ ประธานาธิบดี[FROM.GetLeader]แหง[FROM.GetName]ประกาศทางวิทยุวาประเทศกําลังเขาสูภาวะฉุกเฉินอีกครั้ง เนื่องจากความเสี่ยงที่พรรคคอมมิวนิสตจะกอรัฐประหาร ตามคํากลาวของประธานาธิบดี มีการพบเอกสารที่บงชี้วาฝายคอมมิวนิสตอยูในขั้นสุดทายของการวางแผนโคนลมรัฐบาล หลายฝายตั้งขอสงสัยในความถูกตองของเอกสารเหลานี้ แตสมาชิกพรรคฝายคานตางพากันหลบซอนตัวใตดินเพราะเกรงจะถูกจับกุม ประธานาธิบดีประกาศวาจะสถาปนารัฐใหม พรอมรัฐธรรมนูญฉบับใหมที่มอบอํานาจใหตนเองมากขึ้น อนาคตของประชาธิปไตยใน[FROM.GetName]จะเปนอยางไรยังคงตองติดตามกันตอไป"
south_american_news.50.a: "พวกบอลเชวิคผูทรยศไดรับสิ่งที่สมควรแลว"
south_american_news.50.b: "สถานการณที่นากังวล"
south_american_news.50.c: "เราจะลางแคนใหสหายของเรา!"

south_american_news.51.t: "บราซิลระงับประชาธิปไตย"
south_american_news.51.d: "เชานี้ ประธานาธิบดี[FROM.GetLeader]แหง[FROM.GetName]ประกาศทางวิทยุวาประเทศกําลังเขาสูภาวะฉุกเฉินอีกครั้ง เนื่องจากความเสี่ยงที่พรรคคอมมิวนิสตจะกอรัฐประหาร ตามคํากลาวของประธานาธิบดี มีการพบเอกสารที่บงชี้วาฝายคอมมิวนิสตอยูในขั้นสุดทายของการวางแผนโคนลมรัฐบาล ดวยการสนับสนุนจากพรรคอินเตกราลิสตาฝายขวา [BRA.GetLeader]ไดบีบใหพรรคฝายคานตองลงใตดิน ประธานาธิบดีประกาศวาจะสถาปนารัฐใหม พรอมรัฐธรรมนูญฉบับใหมรวมกับพรรคอินเตกราลิสตา ผูซึ่งกอบกูชาติจากลัทธิบอลเชวิคอยางกลาหาญ เมื่อพิจารณาจากวาทกรรมและการกระทําในอดีตของฝายอินเตกราลิสตาแลว ดูเหมือนวาประชาธิปไตยเสรีนิยมในบราซิลไดสิ้นสุดลงแลว เหลือไวเพียงชื่อเทานั้น"
south_american_news.51.a: "พวกบอลเชวิคผูทรยศไดรับสิ่งที่สมควรแลว"
south_american_news.51.b: "สถานการณที่นากังวล"
south_american_news.51.c: "เราจะลางแคนใหสหายของเรา!"

JUNO_brazil_events.60.t: "[BRA.GetNameDefCap]เสนอใหรวมชาติ"
JUNO_brazil_events.60.desc: "[BRA.GetNameDefCap]ไดติดตอรัฐบาลของเรา เสนอใหสองประเทศกลับมารวมเปนหนึ่งเดียวอีกครั้ง โดยอางถึงความคลายคลึงทางวัฒนธรรม และการอภิเษกสมรสเมื่อไมนานนี้ระหวางดง ดูอารตี นูนู ดยุกแหงบรากังซา กับเจาหญิงมาเรีย ฟรันซิสกาแหงออรเลอ็อง-บรากังซา เปนเหตุผลของขอเสนอนี้ และยืนยันกับเราวาเราจะแข็งแกรงยิ่งขึ้นเมื่ออยูรวมกันภายใตการปกครองของ[BRA.GetLeader]"
JUNO_brazil_events.60.a: "เราแข็งแกรงขึ้นเมื่ออยูรวมกัน!"
JUNO_brazil_events.60.b: "ที่จริงเราอยากใหเปนเครือจักรภพมากกวา"
JUNO_brazil_events.60.c: "เราไมประสงคจะเขารวมกับพวกเขา"

JUNO_brazil_events.61.t: "[POR.GetNameDefCap]ยอมรับการรวมชาติ"
JUNO_brazil_events.61.desc: "ขอเสนอรวมชาติกับ[POR.GetNameDef]ของเราไดรับการตอบรับอยางกระตือรือรน นี่คือจุดเริ่มตนของยุคใหมอันยิ่งใหญสําหรับประเทศของเรา!"
JUNO_brazil_events.61.a: "ยอดเยี่ยม"

JUNO_brazil_events.62.t: "[POR.GetNameDefCap]เสนอใหตั้งเครือจักรภพ"
JUNO_brazil_events.62.desc: "ขอเสนอลาสุดของเราตอ[POR.GetNameDef]ไดรับการตอบสนองที่นาประหลาดใจ [POR.GetNameDefCap]ปฏิเสธแนวคิดการรวมชาติ แตเสนอใหสองชาติตั้งเครือจักรภพขึ้นแทน ซึ่งจะทําใหเราไดประโยชนบางสวนจากการรวมชาติ มีขอเสียนอยกวา และทั้งสองชาติยังคงรักษาอัตลักษณอันเปนเอกลักษณของตนไวได"
JUNO_brazil_events.62.a: "แนนอน นี่ก็เปนประโยชนตอเราไดไมแพกัน!"
JUNO_brazil_events.62.b: "เครือจักรภพกับอดีตเจาอาณานิคมของเรานะหรือ? ไมมีทางเด็ดขาด"

JUNO_brazil_events.63.t: "[POR.GetNameDefCap]ปฏิเสธการรวมชาติ"
JUNO_brazil_events.63.desc: "ขอเสนอรวมชาติของเราตอ[POR.GetNameDef]ถูกปฏิเสธอยางไมใยดี แมเราจะพยายามอยางเต็มที่ใหพวกเขาเห็นประโยชนของขอตกลงนี้ แตชาว[POR.GetAdjective]ก็ไมมีความสนใจที่จะรวมสองประเทศเขาดวยกันอีกครั้ง"
JUNO_brazil_events.63.a: "พวกเขามองไมเห็นหรือวาจะไดอะไรมากมายจากเรื่องนี้?"

JUNO_brazil_events.64.t: "[BRA.GetNameDefCap]ตกลงกอตั้งเครือจักรภพ"
JUNO_brazil_events.64.desc: "ขอเสนอโตกลับของเราใหกอตั้งเครือจักรภพแทนการเขารวมกับ[BRA.GetNameDef]โดยสมบูรณ ไดรับการตอบรับอยางดีจากผูนํา[BRA.GetAdjective] พวกเขาลมเลิกแนวคิดการรวมชาติ และเห็นพองวาเครือจักรภพจะเปนผลดีอยางยิ่งตอทั้งสองฝาย"
JUNO_brazil_events.64.a: "ยอดเยี่ยม!"

JUNO_brazil_events.65.t: "[BRA.GetNameDefCap]ปฏิเสธขอเสนอเครือจักรภพ"
JUNO_brazil_events.65.desc: "ขอเสนอโตกลับของเราใหกอตั้งเครือจักรภพแทนการเขารวมกับ[BRA.GetNameDef]โดยสมบูรณ ไดรับการตอบรับอยางไมดีจากผูนํา[BRA.GetAdjective] พวกเขาปฏิเสธแนวคิดเครือจักรภพ โดยอางความกังวลวาจะตกอยูใตการควบคุมของเราในฐานะอาณานิคมอีกครั้ง"
JUNO_brazil_events.65.a: "พวกเขาเสียเอง"

JUNO_brazil_events.70.t: "[FROM.GetNameDefCap]เรียกรองดินแดนโพนทะเล"
JUNO_brazil_events.70.desc: "นักการทูต[FROM.GetAdjective]ไดยื่นคําขาดตอนักการทูตของเรา โดยระบุวาดวยสถานการณโลกที่ลอแหลม พวกเขาไมเชื่อวาเราจะสามารถปกปองดินแดนโพนทะเลของเราได แตดวยความเชื่อมโยงทางประวัติศาสตร พวกเขาเชื่อวาตนเหมาะสมที่จะทําหนาที่นี้ ดังนั้นพวกเขาจึงเรียกรองใหเราสงมอบการควบคุมดินแดนเหลานั้นโดยทันที"
JUNO_brazil_events.70.a: "ดินแดนเหลานั้นไมคุมที่จะทําสงคราม"
JUNO_brazil_events.70.b: "ขอเรียกรองที่อุกอาจ!"

JUNO_brazil_events.71.t: "[FROM.GetNameDefCap]ยอมโอนอาณานิคม"
JUNO_brazil_events.71.desc: "รัฐบาล[FROM.GetNameDef]เลือกอยางชาญฉลาดที่จะสงมอบการควบคุมดินแดนโพนทะเลของตนใหแกเรา สิ่งนี้จะเปดทางใหอุตสาหกรรมของเราเขาถึงทรัพยากรทั่วโลกโดยปลอดภาษีศุลกากร และจะทําใหมหาอํานาจทั้งหลายใหความสําคัญกับเรามากขึ้นในเวทีระหวางประเทศ"
JUNO_brazil_events.71.a: "ยอดเยี่ยม!"

JUNO_brazil_events.72.t: "[FROM.GetNameDefCap]ปฏิเสธการโอนอาณานิคม"
JUNO_brazil_events.72.desc: "รัฐบาล[FROM.GetNameDef]ปฏิเสธอยางโงเขลาที่จะสงมอบการควบคุมดินแดนโพนทะเลของตนใหแกเรา ความอับอายครั้งนี้ไมไดรอดพนสายตาของแวดวงการทูต ขณะที่สายตาของโลกจับจองมาที่เรา เราตองตัดสินใจวาจะตอบโตอยางไร"
JUNO_brazil_events.72.a: "เรื่องนี้ไมคุมที่จะทําสงครามขามมหาสมุทร"
JUNO_brazil_events.72.b: "ถาเชนนั้นเราจะยึดดินแดนดวยกําลัง"

JUNO_brazil_events.73.t: "คําขาดของ[FROM.GetAdjective]"
JUNO_brazil_events.73.desc: "ทามกลางความตึงเครียดทั่วโลก ขาวสารอันนาตกตะลึงไดสงมาจากอีกฟากของมหาสมุทรแอตแลนติก [FROM.GetNonIdeologyName] อดีตอาณานิคมของเราซึ่งบัดนี้กลายเปนมหาอํานาจที่กําลังผงาดขึ้นดวยตัวเอง ไดยื่นคําขาดอยางอาจหาญ พวกเขาเรียกรองให[FROM.GetName]ยอมอยูใตอํานาจและถูกรวมเขาเปนสวนหนึ่งของจักรวรรดิ[FROM.GetAdjective] ประชาชนของเราตางตกตะลึง หลายคนโกรธแคนตอความอุกอาจของชาว[FROM.GetAdjective] แตบางสวนที่หวาดเกรงตอแสนยานุภาพที่เพิ่มขึ้นของ[FROM.GetNonIdeologyName]และจุดออนของเราเอง กลับพิจารณาที่จะยอมตาม เราจะตอบโตอยางไร?"
JUNO_brazil_events.73.a: "เราไมมีกําลังพอจะตอตาน"
JUNO_brazil_events.73.b: "เราจะไมมีวันยอมสละเอกราช!"

JUNO_brazil_events.74.t: "[FROM.GetNameDefCap]ยอมอยูใตอํานาจ"
JUNO_brazil_events.74.desc: "ตามที่คาดไว [FROM.GetNonIdeologyName]ไดยอมตามขอเรียกรองใหอยูใตอํานาจของเรา เมื่อขาวแพรออกไป บรรยากาศหมนหมองไดแผปกคลุมทั่วอดีตประเทศ[FROM.GetNonIdeologyName] หลายคนกําลังพยายามทําใจยอมรับความจริงใหม ขณะเดียวกัน กระแสรักชาติอันรอนแรงไดครอบงําประชาชนของ[ROOT.GetNonIdeologyName]"
JUNO_brazil_events.74.a: "ไดกลับมารวมกันในที่สุด!"

JUNO_brazil_events.75.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรองใหอยูใตอํานาจ"
JUNO_brazil_events.75.desc: "ดวยทาทีทาทาย รัฐบาล[FROM.GetNonIdeologyName]ไดปฏิเสธคําขาดของเราอยางแข็งกราว โดยอางถึงประวัติศาสตรอันยาวนานและความภาคภูมิใจของชาติ กระแสรักชาติไดปะทุไปทั่วเมืองตาง ๆ และกองทัพเริ่มระดมพล เตรียมพรอมสําหรับความขัดแยงขามมหาสมุทรแอตแลนติกที่อาจเกิดขึ้น"
JUNO_brazil_events.75.a: "เราทําอะไรไดไมมากนัก"
JUNO_brazil_events.75.b: "พวกเขาจะตองเสียใจกับการตัดสินใจนี้"

JUNO_brazil_events.80.t: "[FROM.GetNameDefCap]เสนอการรับประกันรวมกัน"
JUNO_brazil_events.80.desc: "[FROM.GetNameDefCap]ไดยื่นขอเสนอใหรับประกันการคุมครองซึ่งกันและกัน พวกเขาใหเหตุผลวาสันติภาพในอเมริกาใตเปราะบางลง และหนทางเดียวที่จะรักษาไวไดคือการกระชับความสัมพันธระหวางชาติของเรา หากเราตกลงตามขอเสนอนี้ พวกเขาจะคาดหวังใหเรายื่นมือชวยเหลือหากพวกเขาถูกโจมตี"
JUNO_brazil_events.80.a: "เราตกลงตามขอเสนอของพวกเขา"
JUNO_brazil_events.80.b: "เราจะไมผูกมัดตัวเองกับเรื่องนี้"

JUNO_brazil_events.81.t: "[FROM.GetNameDefCap]ยอมรับขอตกลง"
JUNO_brazil_events.81.desc: "[FROM.GetNameDefCap]ไดยอมรับขอเสนอรับประกันการคุมครองซึ่งกันและกันของเรา หวังวานี่จะเปนกาวแรกสูสันติภาพระยะยาวบนทวีปนี้"
JUNO_brazil_events.81.a: "ยอดเยี่ยม!"

JUNO_brazil_events.82.t: "[FROM.GetNameDefCap]ปฏิเสธขอตกลง"
JUNO_brazil_events.82.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนออันเอื้ออารีของเราในการรับประกันการคุมครองซึ่งกันและกัน สิ่งนี้บงบอกอะไรตอความมั่นคงระยะยาวของชาติเรายังคงตองติดตามกันตอไป"
JUNO_brazil_events.82.a: "ลางไมดีเสียแลว..."

JUNO_brazil_events.83.t: "[FROM.GetNameDefCap]เชิญเราเขารวมองคการรัฐอเมริกัน"
JUNO_brazil_events.83.desc: "รัฐบาล[FROM.GetAdjective]ไดติดตอเราพรอมคําเชิญใหเขารวมองคการรัฐอเมริกัน พวกเขามุงหวังใหทุกประเทศในทวีปอเมริการวมตัวกันในองคการนี้ องคการดังกลาวมีขึ้นเพื่อดูแลผลประโยชนรวมกันของเรา รวมทั้งรับประกันความสัมพันธอันดีระหวางสมาชิกทุกประเทศ"
JUNO_brazil_events.83.a: "ความคิดที่ยอดเยี่ยม เราจะเขารวม!"
JUNO_brazil_events.83.b: "เราไมเห็นความจําเปน"

JUNO_brazil_events.84.t: "[FROM.GetNameDefCap]ปฏิเสธคําเชิญของเรา"
JUNO_brazil_events.84.desc: "คําตอบของ[FROM.GetNameDefCap]ตอคําเชิญของเราเพิ่งมาถึง นาเสียดายที่พวกเขาเลือกไมเขารวมองคการรัฐอเมริกัน แมเราจะพยายามอยางเต็มที่ใหพวกเขาทบทวนแลวก็ตาม"
JUNO_brazil_events.84.a: "นาเสียดายจริง ๆ"

JUNO_brazil_events.85.t: "[FROM.GetNameDefCap]ตอบรับคําเชิญของเรา"
JUNO_brazil_events.85.desc: "คําตอบของ[FROM.GetNameDefCap]ตอคําเชิญของเราเพิ่งมาถึง ผูนํา[FROM.GetAdjective]เห็นคุณคาของการเขารวมองคการรัฐอเมริกันดังที่เราหวังไว นับจากนี้เราจะทํางานรวมกัน!"
JUNO_brazil_events.85.a: "การตัดสินใจที่ถูกตอง!"

JUNO_brazil_events.86.t: "คอมมิวนิสตใน[BRA.GetNameDef]ขอความชวยเหลือจากเรา"
JUNO_brazil_events.86.desc: "ผูนําของ[BRA.GetCommunistParty]ใน[BRA.GetNameDef]ไดติดตอมาขอความชวยเหลือจากเราอีกครั้ง แมขณะนี้พวกเขาจะยังไมไดอยูในการสูรบ แตความลมเหลวในการยึดอํานาจเมื่อป 1935 ยังคงฝงใจทุกคน พวกเขาตองการใหเราเขามาเคียงขางอยางจริงจังยิ่งขึ้น เพื่อไมใหความลมเหลวครั้งนั้นซํ้ารอย" 
JUNO_brazil_events.86.a: "เราตองชวยสหายของเราอีกครั้ง!"
JUNO_brazil_events.86.b: "การลุกฮือที่ลมเหลวในบราซิลครั้งเดียวก็พอแลว"

JUNO_brazil_events.87.t: "[SOV.GetNameDefCap]ตกลงสนับสนุนเรา!"
JUNO_brazil_events.87.desc: "ดังที่เราหวังไว ผูนํา[SOV.GetAdjective]ไดเสนอการสนับสนุนแกเราในยามยากลําบากนี้ แนนอนวาเราไมอาจพึ่งพาพวกเขาใหแกปญหาทั้งหมดของเราได แตการไดรับการสนับสนุนจากพวกเขาอีกครั้งก็เปนความชวยเหลือที่นายินดียิ่ง"
JUNO_brazil_events.87.a: "เรารูอยูแลววาพึ่งพาสหาย[SOV.GetAdjective]ของเราได!"
JUNO_brazil_events.87.tt: "หากเกิดสงครามกลางเมือง [SOV.GetFlag]§Y[SOV.GetNameDef]§! มีแนวโนมมากขึ้นที่จะสงอาสาสมัครและยุทโธปกรณแบบใหยืม-เชามาใหเรา"

JUNO_brazil_events.88.t: "[SOV.GetNameDefCap]ปฏิเสธคําขอความชวยเหลือของเรา"
JUNO_brazil_events.88.desc: "เราประหลาดใจที่[SOV.GetNameDef]ปฏิเสธที่จะสนับสนุนเรา แมจะมีความเชื่อมโยงทางอุดมการณก็ตาม พวกเขาอางวา "ความลมเหลว" เมื่อป 1935 ทําใหพวกเขาลังเลที่จะสนับสนุนเราอีก"
JUNO_brazil_events.88.a: "เราจะแสดงใหพวกเขาเห็น!"
JUNO_brazil_events.88.tt: "เราไดรับ §Yความสัมพันธลดลง§! (ความสัมพันธของ [SOV.GetFlag]§Y[SOV.GetName]§! §R-25§!)"

JUNO_brazil_events.120.t: "[FROM.GetNameDefCap]เสนอใหแบงปนเทคโนโลยี"
JUNO_brazil_events.120.desc: "[FROM.GetNameDefCap]เสนอความรวมมือเพื่อเรียนรูความเชี่ยวชาญทางวิทยาศาสตรของกันและกัน แมนักวิทยาศาสตรของเราสวนใหญจะสนับสนุนการเปดกวางทางความรู แตฝายทหารยังระแวดระวังเรื่องการมอบขอมูลที่อาจสงผลเสียตอความมั่นคงของชาติในทายที่สุด"
JUNO_brazil_events.120.a: "ความรูไมมีพรมแดน" 
JUNO_brazil_events.120.b: "เราจะเสนอความชวยเหลือทางเศรษฐกิจใหพวกเขาแทน"

JUNO_brazil_events.121.t: "[FROM.GetNameDefCap]สนับสนุนการแลกเปลี่ยนเทคโนโลยี"
JUNO_brazil_events.121.desc: "[FROM.GetNameDefCap]ตกลงเขารวมโครงการแลกเปลี่ยนเทคโนโลยีที่เราเสนอ แวดวงวิทยาศาสตรของเราตางยินดีปรีดากับขาวนี้ และเริ่มวางแผนเดินทางไปเยือนมหาวิทยาลัยและโรงงานตาง ๆ ใน[FROM.GetNameDef]แลว"
JUNO_brazil_events.121.a: "ขอตกลงที่ไดประโยชนทั้งสองฝาย!" 

JUNO_brazil_events.122.t: "[FROM.GetNameDefCap]ปฏิเสธการแลกเปลี่ยนเทคโนโลยี"
JUNO_brazil_events.122.desc: "[FROM.GetNameDefCap]ปฏิเสธโครงการแลกเปลี่ยนเทคโนโลยีที่เราเสนอ ดวยเหตุผลวาความลับทางทหารของพวกเขาอาจตกไปอยูในมือศัตรูทางภูมิรัฐศาสตร อยางไรก็ตาม กระทรวงการคลังของเรายินดีอยางยิ่งที่ไดทราบวา[FROM.GetNameDef]ตกลงจะลงทุนในเศรษฐกิจของเรามากขึ้น"
JUNO_brazil_events.122.a: "ดีกวาไมไดอะไรเลย" 

JUNO_brazil_events.130.t: "มีการใชสนธิสัญญาองคการรัฐอเมริกัน"
JUNO_brazil_events.130.desc: "[FROM.GetNameDefCap] สมาชิกรวมขององคการรัฐอเมริกัน ถูกโจมตีและจึงไดอางใชขอบทการปองกันที่องคการเพิ่งรับรอง ภายใตขอบทนี้ รัฐสมาชิกทุกรัฐตองเขาชวยเหลือรัฐสมาชิกที่ถูกโจมตี หากเราผิดคํามั่น เราอาจสูญเสียสถานะสมาชิก"
JUNO_brazil_events.130.a: "แนนอนวาเราจะเขาชวยเหลือพวกเขา!"
JUNO_brazil_events.130.b: "องคการนี้เคยทําอะไรใหเราบาง?"

JUNO_brazil_events.131.t: "[FROM.GetNameDefCap]เขามาชวยเหลือเรา"
JUNO_brazil_events.131.desc: "[FROM.GetNameDefCap]ไดรักษาพันธกรณีตอองคการรัฐอเมริกันดวยการเขามาชวยเหลือเราในสถานการณอันไมเคยเกิดขึ้นมากอนนี้ หวังวาสมาชิกอื่น ๆ ทั้งหมดจะเอาเปนแบบอยาง"
JUNO_brazil_events.131.a: "เราซาบซึ้งใจตลอดไป"

JUNO_brazil_events.132.t: "[FROM.GetNameDefCap]ผิดคํามั่น"
JUNO_brazil_events.132.desc: "[FROM.GetNameDefCap]ไมไดรักษาพันธกรณีตอองคการรัฐอเมริกัน ดวยการปฏิเสธที่จะเขามาชวยเหลือเรา พวกเขาจึงถูกขับออกจากองคการ"
JUNO_brazil_events.132.a: "หวังวาความขลาดเขลาเชนนี้จะไมแพรออกไป"

JUNO_brazil_events.133.t: "ถูกขับออกจากองคการรัฐอเมริกัน"
JUNO_brazil_events.133.desc: "ดังที่คาดไว หลังจากที่เราโจมตีรัฐสมาชิกอีกรัฐหนึ่งขององคการรัฐอเมริกันเมื่อไมนานนี้ เราจึงถูกขับออกจากองคการ รัฐสมาชิกที่เหลือจะตอบสนองตอสถานการณนี้อยางไรยังคงตองติดตามกันตอไป"
JUNO_brazil_events.133.a: "อยางไรเสียเราก็อยูดวยตัวเองไดดีกวาอยูแลว"

JUNO_brazil_events.134.t: "[BRA.GetNameDefCap]ขอทําขอตกลงผลิตภายใตใบอนุญาต"
JUNO_brazil_events.134.desc: "เราไดรับคําขอผลิตภายใตใบอนุญาตจากสหายของเราใน[BRA.GetNameDef] พวกเขาตองการทําขอตกลงระยะยาวในการผลิตภายใตใบอนุญาตจากเรา แตขอสวนลดเปนการตอบแทน เราจะไดรับนอยกวาปกติสําหรับแบบที่ใหใบอนุญาตแตละแบบ แตจะไดรับความไววางใจและไมตรีจากผูนํา[BRA.GetAdjective]"
JUNO_brazil_events.134.a: "เรายอมขาดทุนเล็กนอยเพื่อสหายได"
JUNO_brazil_events.134.b: "ขอตกลงนี้ดูไมยุติธรรมหรือเปนประโยชนตอเราเลย"
JUNO_brazil_events.134.tt: "\n การเลือกตัวเลือกนี้จะลดจํานวนโรงงานที่เราไดรับจากการผลิตภายใตใบอนุญาตใน[BRA.GetFlag]§Y[BRA.GetNameDef]§! ลง §R-30%§!"

JUNO_brazil_events.135.t: "[SOV.GetNameDefCap]ตกลงทําขอตกลง"
JUNO_brazil_events.135.desc: "เราเพิ่งไดรับขาววา[SOV.GetNameDef]ตกลงตามขอตกลงที่เราเสนอ นับจากนี้เราจะสามารถผลิตยุทโธปกรณของพวกเขาภายใตใบอนุญาตดวยตนทุนที่ตํ่าลง!"
JUNO_brazil_events.135.a: "ขาวดีเยี่ยม!"
JUNO_brazil_events.135.tt: "เราไดรับ §Yความสัมพันธเพิ่มขึ้น§! (ความสัมพันธของ [SOV.GetFlag]§Y[SOV.GetName]§! §G+25§!)"

JUNO_brazil_events.136.t: "[SOV.GetNameDefCap]ปฏิเสธขอตกลงที่เราเสนอ"
JUNO_brazil_events.136.desc: "[SOV.GetNameDefCap]ตอบกลับขอเสนอของเราอยางรวดเร็วดวยการปฏิเสธ เราตองขอผลิตภายใตใบอนุญาตเชนเดียวกับประเทศอื่น ๆ และราคาก็จะเทากับทุกคน ไมมีสวนลด"
JUNO_brazil_events.136.a: "ก็คุมที่จะลองขอดู..."
JUNO_brazil_events.136.tt: "เราไดรับ §Yความสัมพันธลดลง§! (ความสัมพันธของ [SOV.GetFlag]§Y[SOV.GetName]§! §R-50§!)"

JUNO_brazil_events.137.t: "[BRA.GetNameDefCap]เรียกรองใหเราปลดปลอยอาณานิคมในอเมริกาใต"
JUNO_brazil_events.137.desc: "เราไดรับสารที่ใชถอยคําคอนขางรุนแรงจาก[BRA.GetNameDef] พวกเขาเรียกรองใหเราปลดปลอย[BRA_country_to_be_liberated.GetNameDef] และคืนดินแดนใหแกเจาของที่ชอบธรรม"
JUNO_brazil_events.137.a: "อยางไรเสียอาณานิคมพวกนั้นก็ไมคอยมีประโยชนกับเราอยูแลว"
JUNO_brazil_events.137.b: "เจาของที่ชอบธรรมก็คือเรานี่แหละ"
JUNO_brazil_events.137.b.tt: "§Rสิ่งนี้จะทําใหพวกเขาไดเปาหมายสงครามตอเรา!§!"

JUNO_brazil_events.138.t: "[FROM.GetNameDefCap]ตกลงปลดปลอย[BRA_country_to_be_liberated.GetNameDef]"
JUNO_brazil_events.138.desc: "คําตอบตอขอเรียกรองให[FROM.GetNameDef]ปลดปลอย[BRA_country_to_be_liberated.GetNameDef]ของพวกเขาเพิ่งมาถึง คอนขางนาประหลาดใจที่พวกเขาเห็นพองวาการปลอยใหเปนชาติเอกราชคือทางออกที่ดีที่สุด"
JUNO_brazil_events.138.a: "ผลลัพธที่นาพอใจยิ่ง"

JUNO_brazil_events.139.t: "[FROM.GetNameDefCap]ปฏิเสธการปลดปลอยอาณานิคม"
JUNO_brazil_events.139.desc: "คําตอบตอขอเรียกรองให[FROM.GetNameDef]ปลดปลอย[BRA_country_to_be_liberated.GetNameDef]ของพวกเขาเพิ่งมาถึง พวกเขาระบุวากิจการตางประเทศของตนไมใชเรื่องของเรา และปฏิเสธแนวคิดที่จะมอบเอกราชอันชอบธรรมให"
JUNO_brazil_events.139.a: "เราตองปลดปลอยพวกเขา ไมวาจะตองแลกดวยอะไร"
JUNO_brazil_events.140.t: "การทูตเสือจากัวร"
JUNO_brazil_events.140.desc: "คณะผูแทนทางการทูต[FROM.GetAdjective]ไดเดินทางมาถึงพรอมของขวัญอันไมเหมือนใครเพื่อแสดงไมตรี นั่นคือเสือจากัวร สัญลักษณแหงวัฒนธรรมและความแข็งแกรงของชาติพวกเขา พรอมกับของขวัญอันพิเศษนี้ยังมีขอเสนอใหขยายการคาและความรวมมือดานนโยบายตางประเทศ ทูต[FROM.GetAdjective]แสดงความปรารถนาที่จะสรางสายสัมพันธที่แนนแฟนยิ่งขึ้นระหวางสองชาติ \n\nแมเสือจากัวรจะดึงดูดจินตนาการของสาธารณชนและสรางไมตรีไดมาก แตนัยที่กวางกวาของการทาบทามครั้งนี้ตองพิจารณาอยางรอบคอบ"
JUNO_brazil_events.140.a: "ตอนรับไมตรีและกระชับความสัมพันธ"
JUNO_brazil_events.140.b: "ปฏิเสธขอเสนออยางสุภาพ"

JUNO_brazil_events.141.t: "ภารกิจทางการทูตประสบความสําเร็จ"
JUNO_brazil_events.141.desc: "คณะทูตของเรากลับมาพรอมขาวดี [FROM.GetNameDefCap]ไดนอมรับเสือจากัวรของขวัญจากเราอยางยินดี ในพิธีอันยิ่งใหญที่ดึงดูดความสนใจจากนานาชาติ พวกเขาตอนรับไมตรีของเราและตกลงตามขอเสนอใหขยายการคาและความรวมมือดานนโยบายตางประเทศ"
JUNO_brazil_events.141.a: "ขาวดีเยี่ยม!"
BRA_jaguar_diplomacy_in_progress: "การตัดสินใจการทูตเสือจากัวรกําลังดําเนินอยู"

JUNO_brazil_events.142.t: "ความอับอายทางการทูต"
JUNO_brazil_events.142.desc: "รายงานลาสุดจากคณะผูแทนทางการทูตของเรานําขาวรายมา เสือจากัวรที่เรามอบให อันเปนสัญลักษณแหงความปรารถนาในมิตรภาพและไมตรี ถูก[FROM.GetNameDef]ปฏิเสธอยางไมคาดคิด นอกจากการปฏิเสธของขวัญอันลํ้าคานี้แลว ขอเสนอใหขยายการคาและความรวมมือดานนโยบายตางประเทศของเราก็ถูกปดตกไปดวย"
JUNO_brazil_events.142.a: "เราตองดําเนินการอยางระมัดระวัง"

JUNO_brazil_events.143.t: "ขบวนการซายจัดกําลังไดรับความนิยม"
JUNO_brazil_events.143.desc: "ขบวนการหัวรุนแรงที่อางวาเปนตัวแทนของชนชั้นแรงงานในเมืองตาง ๆ ของเรามีความเคลื่อนไหวเพิ่มขึ้น หนวยงานความมั่นคงของเราเชื่อวาขบวนการเหลานี้ไดรับการสนับสนุนจากระบอบคอมมิวนิสตของ[BRA.GetNonIdeologyName] ดังนั้นพวกเขาจึงกําลังวางแผนปราบปรามพวกหัวรุนแรงหากเราสั่งการ"
JUNO_brazil_events.143.a: "เราตองตรวจสอบเรื่องนี้กอนที่จะบานปลาย"

JUNO_brazil_events.144.t: "ปฏิบัติการใน[FROM.GetNameDef]ถูกขัดขวาง"
JUNO_brazil_events.144.desc: "ปฏิบัติการของเราใน[FROM.GetNameDef]เพื่อเพิ่มแรงสนับสนุนใหพรรคคอมมิวนิสต เผชิญการตอตานอยางหนักจากตํารวจทองถิ่นและหนวยงานความมั่นคง เราจะตองลองใชยุทธวิธีแทรกซึมแบบใหมหากตองการความคืบหนาในดานนี้"
JUNO_brazil_events.144.a: "นาเสียดาย"
brazil_promoting_communism_tt: "ปลดล็อกการตัดสินใจ §Yปราบปรามลัทธิคอมมิวนิสต§! เพื่อตอตานอิทธิพล[FROM.GetAdjective]ที่มีตอการเมืองของเรา"

JUNO_brazil_events.150.t: "กังกาซูกอเหตุ"
JUNO_brazil_events.150.desc.a: "กลุมโจรแหงบราซิลตะวันออกเฉียงเหนือที่รูจักกันในชื่อกังกาซู ไดบุกปลนชุมชนแหงหนึ่งในภูมิภาค เจาหนาที่บังคับใชกฎหมายประสบความยากลําบากในการสืบสวน เนื่องจากชาวบานในทองถิ่นคอยปกปองสมาชิกของกลุม ดูเหมือนวาการตามลาตัวผูกระทําผิดจะตองอาศัยการวางกําลังรักษาความปลอดภัยที่เขมแข็งกวานี้มากในพื้นที่"
JUNO_brazil_events.150.desc.b: "กลุมโจรแหงบราซิลตะวันออกเฉียงเหนือที่รูจักกันในชื่อกังกาซู กําลังขยายปฏิบัติการไปยังพื้นที่อื่น ๆ ของภูมิภาค แมเจาหนาที่บังคับใชกฎหมายทองถิ่นและเจาของที่ดินจะโกรธแคนตอความเคลื่อนไหวเชนนี้ แตชาวบานยากจนจํานวนมากกลับไมใสใจเทาไร หรือถึงขั้นยินดีกับขาวนี้ ดูเหมือนวาการตามลาตัวผูกระทําผิดจะตองอาศัยการวางกําลังรักษาความปลอดภัยที่เขมแข็งกวานี้มากในพื้นที่"
JUNO_brazil_events.150.a: "พวกเขาก็แคตัวกอกวน"
JUNO_brazil_events.150.b: "เราจะไมยอมทนการปลนสะดมเชนนี้อีกตอไป!"
JUNO_brazil_events.150.c: "ตองตามลาและจับกุมพวกมันโดยทันที!"

JUNO_brazil_events.151.t: "ปฏิบัติการตอตานกังกาซูประสบความสําเร็จ"
JUNO_brazil_events.151.desc: "ปฏิบัติการลาสุดของเราในบราซิลตะวันออกเฉียงเหนือประสบความสําเร็จในการขัดขวางปฏิบัติการของกังกาซู พื้นที่ปฏิบัติการของพวกเขาลดลงอยางมากในขณะนี้ แตเราจําเปนตองลงทุนดานการบังคับใชกฎหมายอยางตอเนื่อง หากตองการปองกันไมใหพวกเขากลับมาผงาดอีกในอนาคต"
JUNO_brazil_events.151.a: "ยอดเยี่ยม!"

JUNO_brazil_events.152.t: "ลัมเปยงถูกสังหารในการยิงปะทะ"
JUNO_brazil_events.152.desc: "ระหวางปฏิบัติการบังคับใชกฎหมายครั้งลาสุดในบราซิลตะวันออกเฉียงเหนือ ลัมเปยง ผูมีชื่อเสียงที่สุดในหมูกังกาซู ถูกสังหารในการยิงปะทะกับตํารวจ สมาชิกคนหนึ่งในกลุมโจรของลัมเปยงไดทรยศเขา ทําใหตํารวจสามารถซุมโจมตีกลุมนี้ที่แหลงกบดานได แมกลุมโจรขนาดเล็กจํานวนมากยังคงตระเวนอยูตามชนบท แตเหตุการณนี้ดูเหมือนจะเปนจุดสิ้นสุดของปฏิบัติการขนาดใหญของกังกาซู"
JUNO_brazil_events.152.a: "เสียทีนะ"
BRA_end_of_cangaco_tt: "§Y$BRA_cangaceiro_mission$§! จะถูกปดใชงานถาวร ทําใหกังกาซูไมสามารถแพรขยายไปยังรัฐอื่นไดอีก"

JUNO_brazil_events.153.t: "ภัยคุกคามกังกาซู"
JUNO_brazil_events.153.desc: "บราซิลตะวันออกเฉียงเหนือถูกรังควานมาหลายปโดยกลุมโจรที่รูจักกันในชื่อกังกาซู ดวยความไรเสถียรภาพในเมืองหลวงและนักการเมืองที่สนใจแตจะรักษาอํานาจของตน กังกาซูจึงอาละวาดอยางไรการควบคุม มีเพียงความพยายามรวมกันของเจาหนาที่บังคับใชกฎหมายเทานั้นที่จะหวังลดทอนอิทธิพลของพวกเขาในภูมิภาคได"
JUNO_brazil_events.153.a: "เราจะจัดการพวกเขาเมื่อถึงเวลา"
JUNO_brazil_events_153_tt: "การตัดสินใจ §Y$BRA_cangaceiro_decision_cat$§! และ §Y$BRA_cangaceiro_mission$§! จะยังคงมีผลจนกวากังกาซูจะถูกกําจัดออกจากทุกรัฐที่ไดรับผลกระทบ \n\nแผนยุทธศาสตร §Y$BRA_deal_with_the_cangaceiro$§! จะปลดล็อกการตัดสินใจเพื่อกําจัดกังกาซู"

JUNO_brazil_events.160.t: "เชิญบรรษัทมายัง[FROM.GetNameDefCap]"
JUNO_brazil_events.160.desc: "นักการทูต[FROM.GetAdjective]ไดติดตอเราเกี่ยวกับแผนจูงใจใหบรรษัทตางชาติเขามาตั้งบริษัทสาขาในประเทศของพวกเขา พวกเขาตองการทราบวาเราจะหามบรรษัทของเราทําเชนนั้นหรือไม หากเราตกลงใหบริษัทของเราขยายกิจการเขาสูตลาดเกิดใหมนี้ เราเองก็อาจไดรับประโยชนทางเศรษฐกิจ"
JUNO_brazil_events.160.a: "เราเปนใครจะไปขวางตลาดเสรี?"
JUNO_brazil_events.160.b: "นี่คือกลอุบายเพื่อขโมยทรัพยสินทางปญญาของเรา"
JUNO_brazil_events_160_tt: "§Y[FROM.GetNameDefCap]จะปลดล็อกหนึ่งในรายการตอไปนี้:§!"

JUNO_brazil_events.161.t: "[FROM.GetNameDefCap]ตกลงรวมมือดานการผลิต"
JUNO_brazil_events.161.desc: "รัฐบาล[FROM.GetNameDefCap]อนุญาตใหบรรษัทของตนตั้งบริษัทสาขาใน[ROOT.GetNonIdeologyName]ได หากบรรษัทเหลานั้นเลือกจะทํา เหลือเพียงตองตัดสินวาเราตองการสงเสริมอุตสาหกรรมประเภทใด"
JUNO_brazil_events.161.a: "สงเสริมการผลิตรถถัง"
JUNO_brazil_events.161.b: "สงเสริมการผลิตอากาศยาน"
JUNO_brazil_events.161.c: "สงเสริมการตอเรือ"
JUNO_brazil_events.161.d: "สงเสริมการผลิตรถหุมเกราะ"

JUNO_brazil_events.162.t: "[FROM.GetNameDefCap]ปฏิเสธความรวมมือดานการผลิต"
JUNO_brazil_events.162.desc: "นักการทูต[FROM.GetAdjective]แจงเราวารัฐบาลของพวกเขาจะไมอนุญาตใหบรรษัทของตนตั้งบริษัทสาขาใน[ROOT.GetNonIdeologyName]ในอนาคตอันใกล โดยอางความกังวลเรื่องสิทธิในทรัพยสินทางปญญา และความเสี่ยงที่ความลับทางทหารจะรั่วไหลไปถึงชาติปรปกษ"
JUNO_brazil_events.162.a: "เราจะหาพันธมิตรทางธุรกิจที่อื่น"

JUNO_brazil_events.163.t: "การแกไขขอพิพาทแรงงาน"
JUNO_brazil_events.163.desc: "ขอพิพาทระหวางแรงงานกับนายจางเกือบฉีกชาติใหแตกเปนเสี่ยงในชวงหลายปที่ผานมา ถึงเวลาแลวที่เราจะออกกฎหมายยุติเรื่องนี้เสียที ฝงหนึ่งของสภาแหงชาติ พรรคแรงงาน (Partido Trabalhista) สนับสนุนกฎหมายที่เอื้อตอแรงงาน ซึ่งจะทําใหกิจกรรมสหภาพแรงงานถูกกฎหมาย รับประกันสิทธิของคนงาน และใหสิทธิวันหยุดพักรอนตามจํานวนที่กําหนดในแตละป อีกฝงหนึ่ง พรรครีพับลิกัน (Partido Republicano) สนับสนุนการปฏิรูปที่ไมรุนแรงนัก และใหแตละรัฐตัดสินใจเรื่องนี้เอง พวกเขาใหเหตุผลวาสถานการณความมั่นคงโลกในปจจุบันทําใหเราตองใหความสําคัญกับงบประมาณปองกันประเทศ มากกวาการยอมจํานนตอฝายซายจัด"
JUNO_brazil_events.163.a: "ตรากฎหมายของพรรคแรงงาน"
JUNO_brazil_events.163.b: "ตรากฎหมายของพรรครีพับลิกัน"

JUNO_brazil_events.170.t: "[FROM.GetNameDefCap]เสนอใหรวมชาติ"
JUNO_brazil_events.170.desc: "[FROM.GetNameDefCap]เสนอใหรวมชาติของเราเขาเปนสวนหนึ่งของสหพันธรัฐของพวกเขา แมเราจะทํางานใกลชิดกับ[FROM.GetNameDef]มาตลอดในระยะหลัง แตคนรุนเกาจํานวนมากยังลังเลที่จะวางความขุนเคืองทางประวัติศาสตรลงเพื่อแลกกับเสถียรภาพทางเศรษฐกิจและการเมือง ไมวาเราจะตัดสินใจอยางไร ก็มีแนวโนมจะสงผลไปอีกหลายป"
JUNO_brazil_events.170.a: "ถึงเวลาวางความแตกตางไวขางหลังแลว"
JUNO_brazil_events.170.b: "เราไมมีวันยอมตกลงเชนนั้น!"

JUNO_brazil_events.171.t: "[FROM.GetNameDefCap]ยอมรับการรวมชาติ"
JUNO_brazil_events.171.desc: "[FROM.GetNameDefCap]ตกลงตามขอเสนอรวมชาติของเรา หลังการหารืออันยืดเยื้อเกี่ยวกับสถานะของพวกเขาในระบบการเมืองของเรา และการคุมครองผลประโยชนสําคัญของประชาชนของพวกเขา"
JUNO_brazil_events.171.a: "นี่คือชวงเวลาทางประวัติศาสตร!"

JUNO_brazil_events.172.t: "[FROM.GetNameDefCap]ปฏิเสธการรวมชาติ"
JUNO_brazil_events.172.desc: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอรวมชาติของเรา เนื่องจากนโยบายนี้ไมเปนที่นิยมในหมูประชาชน แมเราจะอธิบายวาขอตกลงนี้จะเปนประโยชนตอทั้งสองฝาย แตดูเหมือนวายังไมถึงเวลาของการรวมชาติ"
JUNO_brazil_events.172.a: "พวกโงใจแคบ"

JUNO_brazil_events.180.t: "$BRA_henry_ford$ เดินทางมาถึง[ROOT.GetNonIdeologyName]"
JUNO_brazil_events.180.desc: "เนื่องจากความวุนวายเมื่อไมนานนี้ในสหรัฐอเมริกาและการที่รัฐบาลถูกฝายมารกซิสตโคนลม ชาว[USA.GetAdjective]จํานวนหนึ่งไดเดินทางมายัง[ROOT.GetNonIdeologyName]เพื่อแสวงหาชีวิตใหม บุคคลที่มีชื่อเสียงที่สุดที่มาถึงจนถึงตอนนี้คงเปนนักอุตสาหกรรมผูโดงดัง $BRA_henry_ford$ เขาเสนอจะขยายกิจการในฟอรดแลนเดีย เพื่อแลกกับที่นั่งในรัฐบาล เพื่อชวยไมใหเราตกเปนเหยื่อของอิทธิพลคอมมิวนิสตเชนเดียวกับบานเกิดของเขา"
JUNO_brazil_events.180.a: "เราตองการความเชี่ยวชาญของเขา"
JUNO_brazil_events.180.b: "เขาเสี่ยงเกินกวาจะใหมีสวนรวมในการตัดสินใจของเรา"

JUNO_brazil_events.190.t: "[FROM.GetNameDefCap]เผยแพรแนวคิดนิยมกษัตริยใน[ROOT.GetNonIdeologyName]"
JUNO_brazil_events.190.desc: "เราไดรับรายงานหลายฉบับวาสายลับ[FROM.GetAdjective]กําลังพยายามปลุกกระแสนิยมกษัตริยใน[ROOT.GetNonIdeologyName] ขึ้นอยูกับวาเราวางแผนระยะยาวสําหรับประเทศไวอยางไร เราควรจะโอบรับขบวนการนี้ หรือไมก็ปราบปรามใหสิ้นกอนที่จะควบคุมไมได"
JUNO_brazil_events.190.a: "เราจะโอบรับมรดกแหงจักรวรรดิของเรา!"
JUNO_brazil_events.190.b: "เราตองบดขยี้ขบวนการนี้โดยทันที"
BRA_rejected_monarchism: "§R ไดสั่งหามขบวนการนิยมกษัตริยแลว§!"

JUNO_brazil_events.191.t: "[FROM.GetNameDefCap]สั่งหามขบวนการนิยมกษัตริย"
JUNO_brazil_events.191.desc: "[FROM.GetNameDefCap][BRA.GetFlag]ไดปราบปรามการเผยแพรแนวคิดนิยมกษัตริยทุกรูปแบบอยางรุนแรง ไมนาแปลกใจที่สิ่งนี้ทําใหผลงานของสายลับของเราในประเทศนั้นซบเซาลง"
JUNO_brazil_events.191.a: "เราตองใชวิธีอื่นในอนาคต"

JUNO_brazil_events.200.t: "ฤดูเลือกตั้ง"
JUNO_brazil_events.200.desc: "ฤดูเลือกตั้งไดเวียนมาถึงอีกครั้ง และชาว[ROOT.GetAdjective]ตางรอคอยอยางใจจดใจจอวาใครจะเปนประธานาธิบดีคนตอไป"
JUNO_brazil_events.200.a: "$BRA_anisio_teixeira$"
JUNO_brazil_events.200.b: "$BRA_armando_de_sales_oliveira$"
JUNO_brazil_events.200.c: "$BRA_minervino_de_oliveira$"
JUNO_brazil_events.200.d: "$BRA_lindolfo_collor$"
JUNO_brazil_events.200.e: "$BRA_eurico_gaspar_dutra$"

south_american_news.52.t: "งดจัดงานคารนิวัล"
south_american_news.52.desc: "เมื่อโลกถูกฉุดเขาสูความขัดแยงระดับโลกอีกครั้ง นครรีโอเดจาเนโรจึงตัดสินใจระงับการเฉลิมฉลองงานคารนิวัลประจําปอันลือชื่อ เมื่อสันติภาพกลายเปนเพียงความทรงจําอันเลือนราง จึงไมแนชัดวางานรื่นเริงจะกลับมาเมื่อใด อยางไรก็ตาม หลายคนกังวลมากกวาวาสงครามจะลุกลามมาถึง[BRA.GetNonIdeologyName]เองดวยหรือไม"
south_american_news.52.a: "ชวงเวลาอันเศราหมองสําหรับพวกเราทุกคน"
south_american_news.52.b: "การแสดงอันฟุงเฟอเชนนี้ไมมีใครคิดถึงหรอก"

### Argentina ###

ARG_political_events.1.t: "กองทัพหันมาตอตานเรา!"
ARG_political_events.1.desc: "เชานี้ ยามรุงสาง ทหาร 8,000 นายเดินทัพจากฐานทัพกัมโปเดมาโยในบัวโนสไอเรสมุงหนาสูทําเนียบประธานาธิบดี 'กาซาโรซาดา' นําโดยอารตูโร รอวสัน และเปโดร ปาโบล รามีเรซ นายพลทั้งสองเรียกรองให[FROM.GetLeader]ลาออกและสงมอบการปกครอง[FROM.GetName]ใหแกกองทัพ เราจะยอมทําตามคําขาดของพวกเขา หรือเตรียมสูขับไลพวกเขาก็ได"
ARG_political_events.1.a: "เราทําอะไรไมไดแลว"
ARG_political_events.1.b: "เราจะปลอยใหพวกเขาลอยนวลไมได!"

ARG_political_events.2.t: "[USA.GetName]เรียกรองใหควํ่าบาตร[GER.GetAdjective]!"
ARG_political_events.2.desc: "แมเราจะตั้งใจอยูนอกความขัดแยงนี้ แตนักการทูต[USA.GetAdjective]ยังคงกดดันใหเราตัดสัมพันธกับมิตร[GER.GetAdjective]ของเรา เชานี้เราถูกขออยางหนักแนนใหประกาศควํ่าบาตร[GER.GetName] เพื่อรักษาสันติภาพในทวีปอเมริกา เรื่องนี้ทําใหเราตกที่นั่งลําบาก และการอยูนอกสงครามก็ยากขึ้นทุกวัน"
ARG_political_events.2.a: "เราแทบไมมีทางเลือก"
ARG_political_events.2.b: "เรายังไมอยากตัดสัมพันธตอนนี้"

ARG_political_events.3.t: "[ARG.GetName]เสนอเขารวมฝายสัมพันธมิตร"
ARG_political_events.3.desc: "วันนี้ประธานาธิบดี[ARG.GetLeader]แหง[ARG.GetName]ไดยื่นคําขอเขารวมฝายสัมพันธมิตรในการตอสูกับศัตรูของเรา ดูเหมือนคําเรียกรองของเราใหทวีปอเมริกาสามัคคีกันเมื่อเผชิญความยากลําบากเชนนี้จะไดรับการรับฟงในที่สุด"
ARG_political_events.3.a: "เปนเพียงเรื่องของเวลาเทานั้น"

ARG_political_events.4.t: "[USA.GetName]ควํ่าบาตรเรา"
ARG_political_events.4.desc: "เชานี้เราไดรับประกาศควํ่าบาตรอยางเปนทางการจาก[USA.GetName] ระบุวาการตัดสินใจคงความเปนกลางในความขัดแยงระดับโลกของเรานั้นขัดกับทุกสิ่งที่ลัทธิมอนโรยึดถือ ดวยเหตุนี้ มาตรการลงโทษนี้จะมีผลกับเราจนกวาจะมีประกาศเปลี่ยนแปลง ดูเหมือนความมุงมั่นในความเปนกลางของเราจะทําใหเพื่อนบานทางเหนือโกรธเคือง"
ARG_political_events.4.a: "นาเสียดาย"

ARG_political_events.5.t: "[ARG.GetName]ขอกรรมสิทธิ์หมูเกาะแอตแลนติกใต"
ARG_political_events.5.desc: "เปนเวลาหลายปที่หมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียเปนดินแดนภายใตอธิปไตยของ[ENG.GetAdjective] อยางไรก็ตาม ดูเหมือนรัฐบาล[ARG.GetAdjective]ไดขออยางเปนทางการใหหมูเกาะเหลานี้อยูในความดูแลของพวกเขาแทน เพื่อใหรักษาความมั่นคงของแอตแลนติกใตไดดีขึ้นในชวงเวลาอันยากลําบากนี้"
ARG_political_events.5.a: "หมูเกาะเปนของพวกเขา"
ARG_political_events.5.b: "เราจะยกใหฟรีๆ ไมได..."
ARG_political_events.5.c: "ไมมีทางเด็ดขาด"

ARG_political_events.6.t: "[FROM.GetName]ตกลงตามขอเสนอของเรา!"
ARG_political_events.6.desc: "รัฐบาล[FROM.GetAdjective]ไดตอบรับขอเสนอของเราในการเขาควบคุมหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียแลว บัดนี้เมื่อหมูเกาะเปนของอารเจนตินาโดยชอบธรรม เราก็เริ่มปกปองนานนํ้าของเราในความขัดแยงครั้งนี้ได"
ARG_political_events.6.a: "ยอดเยี่ยม!"

ARG_political_events.7.t: "[FROM.GetName]ขอใหเราจายเงินแลกหมูเกาะ"
ARG_political_events.7.desc: "แมเราจะพยายามโนมนาวฝาย[FROM.GetAdjective]วาหมูเกาะควรเปนของ[ARG.GetName] แตรัฐบาลของพวกเขาเสนอจะสงมอบดินแดนโดยแลกกับเงิน นี่จะกระทบเศรษฐกิจของเราเล็กนอย แตการไดครอบครองดินแดนนี้จะเปนประโยชนมากกวาในระยะยาว"
ARG_political_events.7.a: "ไมคอยดีนัก แตเรายอมรับ"

ARG_political_events.8.t: "[FROM.GetName]ปฏิเสธที่จะสละหมูเกาะ"
ARG_political_events.8.desc: "นาเสียดายที่ขอเสนอของเราไมมีใครฟง รัฐบาล[FROM.GetAdjective]ตัดสินใจวาหมูเกาะควรอยูภายใตการคุมครองของพวกเขาตอไป แมจะนาผิดหวัง แตอยางนอยเราก็รูวาพันธมิตรของเราอยูไมไกล"
ARG_political_events.8.a: "นาผิดหวัง"

ARG_political_events.9.t: "สงครามกลางเมืองมาถึงแลว"
ARG_political_events.9.desc: "การที่รามอน กัสติโยรวบอํานาจในรัฐบาลไดเติมเชื้อไฟใหความไมพอใจที่ลุกลามขึ้นเรื่อยๆ ในหมูผูนําทางทหารของประเทศ พวกเขาตัดสินใจวาพอกันที และหลังจากรวบรวมอํานาจไดมากที่สุดเทาที่ทําได ก็สงกองกําลังกบฏเดินทัพสูบัวโนสไอเรส! ดูเหมือนสงครามกลางเมือง[ARG.GetAdjective]ไดเริ่มขึ้นแลว"
ARG_political_events.9.a: "รวบรวมทหารที่เหลืออยู!"

ARG_political_events.10.t: "ปราบปรามความไมพอใจในกองทัพ"
ARG_political_events.10.desc: "เชานี้ ประธานาธิบดี[ARG.GetLeader]เรียกประชุมที่ปรึกษาและสรุปพระราชบัญญัติ Intervenciones Federales ดวยเหตุนี้ ในที่สุดรัฐบาลก็ปราบปรามผูที่ยุยงใหกอกบฏในกองทัพได อาจตองใชเวลาสักพักกวาจะฟนความภักดีของกองทัพกลับมา แตก็คุมคาที่หลีกเลี่ยงหายนะระดับชาติอยางสงครามกลางเมืองได"
ARG_political_events.10.a: "เฉียดฉิวจริงๆ..."

ARG_political_events.11.t: "การกบฏของกองทัพใกลปะทุ"
ARG_political_events.11.desc: "เราไดรับขาววานายทหารระดับสูงสุดของเราแยกตัวออกจากรัฐบาล และรวบรวมผูสนับสนุนเพื่อพยายามยึดอํานาจการเมือง[ARG.GetAdjective] เราจะปลอยใหพวกเขาไปถึงบัวโนสไอเรสไมได ถึงเวลาเตรียมรับมือสงครามกลางเมือง[ARG.GetAdjective]แลว"
ARG_political_events.11.a: "เตรียมปกปอง[ARG.GetName]จากพวกกบฏ!"

ARG_political_events.12.t: "[ARG.GetNameDefCap]ตองการเขารวมฝายอักษะ"
ARG_political_events.12.desc: "วันนี้เราไดรับขาวจากนักการทูต[ARG.GetAdjective]วารัฐบาลของพวกเขาตองการยื่นคําขอเขารวมฝายอักษะ หากเราตอบรับ นี่จะเปนฐานที่มั่นในทวีปอเมริกาใต เราจะตอบอยางไร?"
ARG_political_events.12.a: "เรายินดีตอนรับพันธมิตรใหม"
ARG_political_events.12.b: "ขอเสนอของพวกเขาไมมีความหมายสําหรับเรา"

ARG_political_events.13.t: "[GER.GetNameDefCap]ตอบรับคําขอของเรา!"
ARG_political_events.13.desc: "เราไดรับคําตอบจากสถานทูต[GER.GetAdjective]แลว และยินดีประกาศวาพวกเขารับเราเขาสูฝายอักษะ นี่คือจุดเริ่มตนของพันธมิตรอันทรงพลัง"
ARG_political_events.13.a: "Excelente!"

ARG_political_events.14.t: "[GER.GetNameDefCap]ปฏิเสธคําขอของเรา!"
ARG_political_events.14.desc: "แมเราจะพยายามอยางเต็มที่ รัฐบาล[GER.GetAdjective]ก็ปฏิเสธคําขอเขารวมฝายอักษะของเรา ดูเหมือนเราตองเผชิญโลกตามลําพัง"
ARG_political_events.14.a: "Lamentable..."

ARG_political_events.15.t: "[ARG.GetNameDefCap]ยื่นคําขาด"
ARG_political_events.15.desc: "ตามที่เอกอัครราชทูต[ARG.GetAdjective]ประจํา[ROOT.Capital.GetCapitalVictoryPointName]แจง รัฐบาลปจจุบันของเราตองสละอํานาจและถูกแทนที่ดวยรัฐบาลหุนเชิดของ[ARG.GetAdjective] มีโอกาสสูงที่การปฏิเสธของเราจะนําไปสูการประกาศสงคราม เราตองเลือกอยางชาญฉลาด" 
ARG_political_events.15.a: "เราตานพวกเขาไมไหว"
ARG_political_events.15.b: "เราจะไมลงนามยกอธิปไตยของเราใหใคร"

ARG_political_events.16.t: "[PAR.GetNameDefCap]ยอมรับเงื่อนไขในคําขาด"
ARG_political_events.16.desc: "รัฐบาล[PAR.GetAdjective]ตัดสินใจยอมรับเงื่อนไขที่เราวางไวในคําขาด เราจะทําใหดินแดนของพวกเขาเปนรัฐหุนเชิดทันที และสถาปนาการปกครองของ[ARG.GetAdjective]โดยเร็วที่สุด" 
ARG_political_events.16.a: "Excelente!"

ARG_political_events.17.t: "[PAR.GetNameDefCap]ปฏิเสธเงื่อนไขในคําขาด"
ARG_political_events.17.desc: "รัฐบาล[PAR.GetAdjective]ตัดสินใจปฏิเสธเงื่อนไขที่เราวางไวให นี่เปนสิ่งที่ยอมรับไมได เราจะถอยและปลอยไวอยางนั้น หรือเตรียมทหารเพื่อทําสงครามก็ได" 
ARG_political_events.17.a: "ถอยเถอะ ไมคุมหรอก..."
ARG_political_events.17.b: "พวกเขาจะตองเสียใจที่ปฏิเสธเรา!"

ARG_political_events.18.t: "[ARG.GetNameDefCap]ยอมถอย"
ARG_political_events.18.desc: "หลังจากที่เรายืนหยัดไมถอย ดูเหมือนรัฐบาล[ARG.GetAdjective]จะตัดสินใจวาการเดินหนาตอไมคุมคา ตอนนี้เราวางใจไดแลววาภัยคุกคามสงบลงไปกอน"
ARG_political_events.18.a: "โลงอกไปที..."

ARG_political_events.19.t: "[ARG.GetNameDefCap]ยื่นคําขาด"
ARG_political_events.19.desc: "ตามที่เอกอัครราชทูต[ARG.GetAdjective]ประจํา[ROOT.Capital.GetCapitalVictoryPointName]แจง รัฐบาลปจจุบันของเราตองลงจากอํานาจและถูกแทนที่ดวยรัฐบาลหุนเชิดของ[ARG.GetAdjective] มีโอกาสสูงที่การปฏิเสธของเราจะนําไปสูการประกาศสงคราม เราตองเลือกอยางชาญฉลาด"
ARG_political_events.19.a: "เราตานพวกเขาไมไหว"
ARG_political_events.19.b: "เราจะไมลงนามยกอธิปไตยของเราใหใคร"

ARG_political_events.20.t: "[URG.GetNameDefCap]ยอมรับเงื่อนไขในคําขาด"
ARG_political_events.20.desc: "รัฐบาล[URG.GetAdjective]ตัดสินใจยอมรับเงื่อนไขที่เราวางไวในคําขาด บัดนี้เราสามารถดําเนินแผนอาณานิคมที่พันธมิตร[GER.GetAdjective]ของเราวางไวเมื่อหลายปกอนไดอยางเปนทางการ พวกเขาจะตองพอใจกับพัฒนาการนี้อยางแนนอน"
ARG_political_events.20.a: "Excelente!"

ARG_political_events.21.t: "[URG.GetNameDefCap]ปฏิเสธเงื่อนไขในคําขาด"
ARG_political_events.21.desc: "รัฐบาล[URG.GetAdjective]ตัดสินใจปฏิเสธเงื่อนไขที่เราวางไวให หากเราเห็นวาการเดินหนาตอไมคุมคา ก็แคถอยออกมา มิฉะนั้นก็เตรียมทหารเพื่อการบุกรุกกันเถอะ"
ARG_political_events.21.a: "ถอยเถอะ ไมคุมหรอก..."
ARG_political_events.21.b: "พวกเขาจะตองเสียใจที่ปฏิเสธเรา!"

ARG_political_events.22.t: "[ARG.GetNameDefCap]ดําเนินแผนอาณานิคมสําเร็จ"
ARG_political_events.22.desc: "เชานี้เอกอัครราชทูต[ARG.GetAdjective]ประจํา[GER.capital.GetCapitalVictoryPointName]ไดเขาพบเราพรอมขาววา[ARG.GetNameDef]ไดทําใหประเทศ[URG.GetNameDef]เปนรัฐหุนเชิด ในนามของแผนอาณานิคมที่เราเคยวางไวสําหรับประเทศนั้น นี่เปนขาวดี เพราะจะทําให[GER.GetAdjective]มีอิทธิพลในทวีปนี้มากขึ้น"
ARG_political_events.22.a: "พวกเขาพิสูจนแลววาเปนพันธมิตรที่คูควร"

ARG_political_events.23.t: "[ARG.GetNameDefCap]ยอมถอย"
ARG_political_events.23.desc: "หลังจากที่เรายืนหยัดไมถอย ดูเหมือนรัฐบาล[ARG.GetAdjective]จะตัดสินใจวาการเดินหนาตอไมคุมคา ตอนนี้เราวางใจไดแลววาภัยคุกคามสงบลงไปกอน"
ARG_political_events.23.a: "โลงอกไปที..."

ARG_political_events.24.t: "[ARG.GetNameDefCap]ขอเปนพันธมิตร"
ARG_political_events.24.desc: "เราไดรับขาวจาก[ARG.GetNameDef]วาพวกเขาตองการเชิญเราเขารวมเปนพันธมิตร โดยเสนอจะยกเตียรราเดลฟวยโกและซานตาครูซใหเราหากเราตอบรับ เปนขอเสนอที่ยั่วใจยิ่งนัก..."
ARG_political_events.24.a: "การเขารวมกับพวกเขานาจะเปนประโยชน"
ARG_political_events.24.b: "เราจะไมมีวันเขาขาง[ARG.GetNameDef]!"

ARG_political_events.25.t: "[CHL.GetNameDefCap]ตกลงเขารวมฝายของเรา"
ARG_political_events.25.desc: "ขาวดี! รัฐบาล[CHL.GetAdjective]ตัดสินใจเขารวมเปนพันธมิตรกับเรา ดวยกันเราจะยืนหยัดฉันพี่นองตอตานภัยคุกคามทางเหนือได นี่คือวันสําคัญยิ่งและเปนกาวที่ถูกทางสูอเมริกาใตที่เปนหนึ่งเดียว"
ARG_political_events.25.a: "[ARG.GetNameDef]และ[CHL.GetNameDef]ยืนหยัดเคียงขางกัน!"

ARG_political_events.26.t: "[CHL.GetNameDefCap]ปฏิเสธที่จะเขารวมฝายของเรา"
ARG_political_events.26.desc: "รัฐบาล[CHL.GetAdjective]ปฏิเสธอยางดื้อรั้นที่จะรวมเปาหมายพิชิตทั่วทวีปกับเรา แมเราจะบังคับพวกเขาในเรื่องนี้ไมได แตเราก็ยังอาจนําสงครามอันชอบธรรมของเราไปถึงหนาประตูบานพวกเขาแทน ไมวาอยางไร นี่คือวันอันนาเศราสําหรับความสัมพันธระหวางสองชาติของเรา"
ARG_political_events.26.a: "ชางนาผิดหวัง..."

ARG_political_events.27.t: "[ARG.GetNameDefCap]ยื่นคําขาด"
ARG_political_events.27.desc: "ตามที่เอกอัครราชทูต[ARG.GetAdjective]ประจํา[ROOT.Capital.GetCapitalVictoryPointName]แจง รัฐบาลปจจุบันของเราตองสละอํานาจและถูกแทนที่ดวยรัฐบาลหุนเชิดของ[ARG.GetAdjective] มีโอกาสสูงที่การปฏิเสธของเราจะนําไปสูการประกาศสงคราม เราตองเลือกอยางชาญฉลาด"
ARG_political_events.27.a: "เราตานพวกเขาไมไหว"
ARG_political_events.27.b: "เราจะไมลงนามยกอธิปไตยของเราใหใคร"

ARG_political_events.28.t: "[CHL.GetNameDefCap]ยอมรับเงื่อนไขในคําขาด"
ARG_political_events.28.desc: "รัฐบาล[CHL.GetAdjective]ตัดสินใจยอมรับเงื่อนไขที่เราวางไวในคําขาด เราจะทําใหดินแดนของพวกเขาเปนรัฐหุนเชิดทันที และสถาปนาการปกครองของ[ARG.GetAdjective]โดยเร็วที่สุด" 
ARG_political_events.28.a: "Excelente!"

ARG_political_events.29.t: "[CHL.GetNameDefCap]ปฏิเสธเงื่อนไขในคําขาด"
ARG_political_events.29.desc: "รัฐบาล[CHL.GetAdjective]ตัดสินใจปฏิเสธเงื่อนไขที่เราวางไวให เมื่อพิจารณาขนาดและกําลังของประเทศพวกเขา เราอาจเลือกถอยได มิฉะนั้นเราก็รวบรวมทหารและเริ่มเตรียมการบุกรุก" 
ARG_political_events.29.a: "ถอยเถอะ ไมคุมหรอก..."
ARG_political_events.29.b: "พวกเขาจะตองเสียใจที่ปฏิเสธเรา!"

ARG_political_events.30.t: "[ARG.GetNameDefCap]ยอมถอย"
ARG_political_events.30.desc: "หลังจากที่เรายืนหยัดไมถอย ดูเหมือนรัฐบาล[ARG.GetAdjective]จะตัดสินใจวาการเดินหนาตอไมคุมคา ตอนนี้เราวางใจไดแลววาภัยคุกคามสงบลงไปกอน"
ARG_political_events.30.a: "โลงอกไปที..."

ARG_political_events.31.t: "ปญหาเรื่องออสมาร เฮลมุท"
ARG_political_events.31.desc: "ภายใตรัฐบาลชุดกอน ชาย[ARG.GetAdjective]เชื้อสาย[GER.GetAdjective]คนหนึ่งถูกจับกุมบนเรือ หลังถูกสงไปปฏิบัติภารกิจลับที่[GER.GetNameDef] เราสามารถตอรองใหปลอยตัวเขา และใหเขาเขารวมหนวยขาวกรองที่เพิ่งกอตั้งของเรา หรือจะขังเขาไวในคุกและยืนหยัดในจุดยืนเรื่องการปฏิบัติตอสายลับก็ได"
ARG_political_events.31.a: "ปลอยตัวเฮลมุท เราใชประโยชนจากทักษะของเขาได"
ARG_political_events.31.b: "ขังเขาไว ยืนหยัดในจุดยืนของเรา"

ARG_political_events.32.t: "[ARG.GetNameDefCap]เรียกรองใหเรายอมยกหมูเกาะ"
ARG_political_events.32.desc: "เชานี้เราไดรับขาวจากเอกอัครราชทูต[ARG.GetAdjective]ประจํา[ENG.Capital.GetCapitalVictoryPointName]วารัฐบาล[ARG.GetAdjective]ไดยึดครองหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียอยางเปนทางการแลว ดวยเหตุนี้ พวกเขาจึงขอใหเรายกดินแดนนี้ใหและยุติสงครามครั้งนี้"
ARG_political_events.32.a: "ยอมรับเงื่อนไข เรามีภัยคุกคามที่ใหญกวาตองจัดการ"
ARG_political_events.32.b: "เราจะไมมีวันยอมยกหมูเกาะ!"

ARG_political_events.33.t: "[ENG.GetNameDefCap]ตกลงยกหมูเกาะ"
ARG_political_events.33.desc: "วันนี้หมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียตกอยูในมือ[ARG.GetAdjective]ในที่สุด [ENG.GetNameDefCap]ไดลงนามยกทั้งสองแหงใหเพื่อแลกกับสันติภาพ เราใหสิ่งนั้นได โดยเฉพาะตอนนี้ที่ดินแดนอันชอบธรรมของ[ARG.GetAdjective]เปนของเราในที่สุด"
ARG_political_events.33.a: "ชัยชนะเปนของเรา!"

ARG_political_events.34.t: "[ENG.GetNameDefCap]ปฏิเสธที่จะยอมจํานน"
ARG_political_events.34.desc: "ฝาย[ENG.GetAdjective]ปฏิเสธอยางดื้อรั้นที่จะยกหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจียใหเรา ดูเหมือนแมจะสูญเสียไปมาก พวกเขาก็ยังกระหายจะนองเลือดตอไป นั่นเปนสิทธิ์ของพวกเขา หากจําเปน เราจะผลักดันพวกเขากลับไปถึง[ENG.Capital.GetCapitalVictoryPointName]"
ARG_political_events.34.a: "สงครามดําเนินตอไป"

ARG_political_events.35.t: "[ENG.GetNameDefCap]เสนอยกหมูเกาะ"
ARG_political_events.35.desc: "วันนี้เอกอัครราชทูต[ENG.GetAdjective]ไดเขาพบเราพรอมขอเสนอที่จะยกหมูเกาะแอตแลนติกใตให หากเรารับประกันไดวาจะยุติสงครามครั้งนี้ เนื่องจากเปาหมายของเราคือการยึดหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจีย ขอเสนอนี้จึงเปนผลดีตอเราอยางยิ่ง"
ARG_political_events.35.a: "เราไดสิ่งที่ตองการแลว ลงนามในสนธิสัญญา"
ARG_political_events.35.b: "เราจะนําสงครามไปถึง[ENG.Capital.GetCapitalVictoryPointName]!"

ARG_political_events.36.t: "[ARG.GetNameDefCap]ตกลงสงบศึก"
ARG_political_events.36.desc: "โชคดีที่รัฐบาล[ARG.GetAdjective]ตกลงยุติสงครามภายใตเงื่อนไขที่เราเสนอ นาเสียดายที่ตองสละหมูเกาะฟอลกแลนดและเกาะเซาทจอรเจีย แตเราตองทุมกําลังไปที่อื่น"
ARG_political_events.36.a: "โลงอกไปที..."

ARG_political_events.37.t: "[ARG.GetNameDefCap]ปฏิเสธที่จะยุติการสูรบ"
ARG_political_events.37.desc: "ขาวราย รัฐบาล[ARG.GetAdjective]ปฏิเสธขอเสนอของเราที่จะยกหมูเกาะใหแลกกับสันติภาพ เราตองเตรียมรับการสูรบตอไป และตอนนี้ตองใชทรัพยากรปองกันอีกแนวรบหนึ่ง"
ARG_political_events.37.a: "บังอาจนัก!"

ARG_political_events.38.t: "[ARG.GetNameDef]เรียกรองอิเควทอเรียลกินีเปนคาตอบแทน"
ARG_political_events.38.desc: "ผูนําของ[ARG.GetNameDefCap]ไดติดตอมาและเรียกรองใหเราสงมอบการควบคุมดินแดนของเราในอิเควทอเรียลกินี เพื่อตอบแทนการสนับสนุนของพวกเขาในสงครามกับฝายสาธารณรัฐที่เพิ่งผานมา เราอาจตองพิจารณาทางเลือกอยางรอบคอบ"
ARG_political_events.38.a: "ไมมีทางเด็ดขาด"
ARG_political_events.38.a.tt: "สิ่งนี้อาจกระทบความสัมพันธของเรากับ§Y[ARG.GetName]§!..."
ARG_political_events.38.b: "เปนราคาเล็กนอยเมื่อเทียบกับสิ่งที่เราไดรับ"
ARG_political_events.38.b.tt: "โอน§Yอิเควทอเรียลกินี§!ใหแก§Y[ARG.GetName]§!"

ARG_political_events.39.t: "[SPA.GetNameDefCap]ปฏิเสธขอเรียกรองของเรา"
ARG_political_events.39.desc: "ขอเรียกรองของเราถูก[SPA.GetNameDef]ปฏิเสธอยางหยิ่งยโส ผูนํา[SPA.GetAdjective]อางวาขอเรียกรองของเราสูงเกินไป และไมสมกับความพยายามของเราในสงคราม"
ARG_political_events.39.a: "ชางนาเสียดาย..."

ARG_political_events.40.t: "[SPA.GetNameDefCap]ยอมตามขอเรียกรองของเรา"
ARG_political_events.40.desc: "ขาวดีเพิ่งมาถึง [SPA.GetNameDef]ตกลงตามขอเรียกรองของเรา และเราไดรับกรรมสิทธิ์ในอิเควทอเรียลกินีเปนรางวัลตอบแทนความชวยเหลือในสงครามกลางเมืองที่ผานมาของพวกเขา"
ARG_political_events.40.a: "เทานี้เราก็มีที่มั่นในแอฟริกาแลว!"


ARG_political_events.41.t: "โรดอลโฟ กิโอลดี กลับสู[ARG.GetNameDef]"
ARG_political_events.41.desc: "ในป 1931 โรดอลโฟ กิโอลดี หลบหนีออกจาก[ARG.GetNameDef]หลังถูกขูเอาชีวิตเพราะแนวคิดเอียงซายแบบสังคมนิยม ระหวางนั้นเขาไดชวยสนับสนุนการลุกฮือของคอมมิวนิสตใน[BRA.GetNameDef] เพื่อพยายามโคนเจตูลิอู วารกัส ออกจากตําแหนงในรัฐบาล บัดนี้เมื่อภูมิทัศนทางการเมืองใน[ARG.GetNameDef]เอนไปทางซายมากขึ้น กิโอลดีแจงวาเขาสบายใจที่จะกลับบานเกิดเพื่อรับตําแหนงผูนําพรรค PCA"
ARG_political_events.41.a: "สิ่งนี้จะชวยปูทางสูการปฏิวัติของเรา!"

ARG_political_events.42.t: "[ARG.GetNameDefCap]ยื่นมือมาหา"
ARG_political_events.42.desc: "เราไดรับขาวจากสหายใน[ARG.GetNameDef]ที่ติดตอมาดวยความหวังวาเราจะสนับสนุนขบวนการปฏิวัติที่กําลังเติบโตของพวกเขา หากเกิดสงครามกลางเมือง พวกเขาตองการใหเราสงอาสาสมัครไปชวยโคนรัฐบาลอันกาวราวของพวกเขา"
ARG_political_events.42.a: "สงความชวยเหลือใหสหายสังคมนิยมของเรา"
ARG_political_events.42.b: "ตอนนี้เราไมมีใครใหแบงไปไดเลย..."

ARG_political_events.43.t: "[SOV.GetNameDefCap]ตกลงสงความชวยเหลือ"
ARG_political_events.43.desc: "ขาวดีสหาย! [SOV.GetNameDefCap]ตกลงสงกองกําลังอาสาสมัครมาหากเกิดสงครามกลางเมืองขึ้นเมื่อเราประกาศการปฏิวัติอันรุงโรจน! เทานี้เราก็อุนใจขึ้นบางหากเหตุการณเชนนั้นเกิดขึ้น"
ARG_political_events.43.a: "ยอดเยี่ยม!"

ARG_political_events.44.t: "[SOV.GetNameDefCap]ปฏิเสธที่จะสงความชวยเหลือ"
ARG_political_events.44.desc: "ขาวรายสหาย [SOV.GetNameDefCap]ปฏิเสธที่จะสงกองกําลังอาสาสมัครมาหากเกิดสงครามกลางเมืองในประเทศของเรา ดูเหมือนวาหากการปฏิวัติอันรุงโรจนของเรากลายเปนความรุนแรง เราก็ตองยืนหยัดตอสูกับผูกดขี่ชนชั้นกระฎมพีตามลําพัง..."
ARG_political_events.44.a: "เราตองสูตามลําพัง..."

ARG_political_events.50.t: "การนัดหยุดงานของกรรมกรขนาดเล็กใน[FROM.FROM.GetName]"
ARG_political_events.50.desc: "นาเสียดายที่ความพยายามปลุกระดมใหกรรมกรนัดหยุดงานใน[FROM.FROM.GetName]ไมเปนไปตามแผนทั้งหมด ผูปราศรัยของเราดึงความสนใจไดเพียงไมกี่คนที่กําลังเดินทางไปทํางาน แมเราจะดึงคนบางสวนมารวมอุดมการณได แตก็ยังตองทํางานหนักเพื่อโนมนาวประชาชนใหลุกขึ้นตอตานชนชั้นสูงผูกดขี่"
ARG_political_events.50.a: "ครั้งหนาจะดีกวานี้..."

ARG_political_events.51.t: "การนัดหยุดงานของกรรมกรใน[FROM.FROM.GetName]"
ARG_political_events.51.desc: "แมจะมีการปะทะกับผูจัดการโรงงานและนักปลุกระดมฟาสซิสต แตการนัดหยุดงานของกรรมกรใน[FROM.FROM.GetName]ก็ดึงดูดผูสนับสนุนไดจํานวนมาก ผูนําพรรค PCA กลาวสุนทรพจนหลายครั้งเกี่ยวกับอนาคตของชาติที่ปราศจากการแบงชนชั้น ซึ่งไดรับเสียงเชียรและเสียงโหรองจากฝูงชน สาขาพรรคในทองถิ่นประกาศแลววาจํานวนสมาชิกเพิ่มขึ้นมากหลังการชุมนุม"
ARG_political_events.51.a: "เรากําลังไดรับแรงสนับสนุนจากมวลชน"

ARG_political_events.52.t: "การนัดหยุดงานของกรรมกรครั้งใหญใน[FROM.FROM.GetName]"
ARG_political_events.52.desc: "เสียงตะโกนและโหรองของฝูงชนกรรมกรผูคับแคนไดดึงกระแสสนับสนุนมหาศาลมาสูพรรค PCA โรงงานวางเปลา สํานักงานถูกทิ้งราง และเกษตรกรในชนบทตางรวมตัวกันเพื่อเรียกรองสิทธิและแสดงความโกรธแคนตอชนชั้นปกครอง ขาวเรื่องอิทธิพลของเราแพรสะพัดไปขณะที่แรงสนับสนุนการปฏิวัติเพิ่มขึ้นทุกวัน..."
ARG_political_events.52.a: "อีกไมนานเปาหมายของเราจะเปนจริง!"

ARG_political_events.60.t: "[ARG.GetNameDefCap]เชิญเราเขารวมฝายของพวกเขา"
ARG_political_events.60.desc: "[ARG.GetNameDefCap]ไดติดตอมา เชิญเราเขารวมสหภาพคอมมิวนิสตของพวกเขา เราจะจับมือกับพี่นองนักปฏิวัติของเราหรือไม?"
ARG_political_events.60.a: "ยืนหยัดเคียงขางกัน!"
ARG_political_events.60.b: "เราตองเดินหนาตามลําพัง"

ARG_political_events.61.t: "[FROM.GetNameDefCap]ตอบรับขอเสนอของเรา"
ARG_political_events.61.desc: "[FROM.GetNameDefCap]ไดกรุณาตอบรับขอเสนอของเราใหเขารวมสหภาพ และบัดนี้เรายืนหยัดเคียงขางกันในหนาประวัติศาสตร"
ARG_political_events.61.a: "รวมกัน เราจะธํารงอุดมการณแหงการปฏิวัติ"

ARG_political_events.62.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
ARG_political_events.62.desc: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเราที่จะรวมกันเปนสหภาพสาธารณรัฐสังคมนิยม พวกเขาไมรูหรือวาใครกุมอํานาจในทวีปนี้? บางทีเมื่อถึงเวลา เราจะแสดงใหพวกเขาเห็น"
ARG_political_events.62.a: "รอจังหวะไวกอน..."

ARG_political_events.70.t: "การประชุมบัวโนสไอเรสเริ่มตนขึ้น"
ARG_political_events.70.desc: "ในที่สุด รัฐบาลคอมมิวนิสตชุดใหมของเราก็มีเสถียรภาพถึงระดับที่สามารถเปดการประชุมบัวโนสไอเรสครั้งแรกได ที่นี่เราจะตัดสินอนาคตของพรรค PCA และเลือกผูที่เหมาะสมจะบริหารประเทศในอีกหลายปขางหนา ปนี้เรามีผูสมัครที่แข็งแกรงสองคนซึ่งมีแนวคิดตางกันสําหรับอนาคตของ[ARG.GetNameDef] แฟนนี เอเดลมัน ผูนําคนปจจุบันของเรา จะรักษาแนวทางเดิม มอบเสถียรภาพ และมุงเนนบทบาทของ[ARG.GetNameDef]บนเวทีโลก สวนอันโตนิโอ โซโต อดีตกบฏชาวปาตาโกเนีย เชื่อวาเราควรผลักดันให[ARG.GetNameDef]เดินตามแนวทางอนาธิปไตย-สหการนิยม ใครควรรับตําแหนงนายกรัฐมนตรีแหง[ARG.GetNameDef]?"
ARG_political_events.70.a: "แฟนนี เอเดลมัน ควรครองอํานาจตอไป"
ARG_political_events.70.b: "อันโตนิโอ โซโต เปนตัวเลือกที่ดีกวามาก"

ARG_political_events.71.t: "แฟนนี เอเดลมัน ดํารงตําแหนงนายกรัฐมนตรีตอ"
ARG_political_events.71.desc: "ดวยคะแนนเสียงทวมทน แฟนนี เอเดลมัน สามารถรักษาตําแหนงในรัฐบาลไวได ดูเหมือนเสนทางที่ตองการสําหรับ[ARG.GetNameDef]คือเสนทางที่ตั้งอยูบนเสถียรภาพและการเติบโต อันโตนิโอ โซโต ผูสมัครคูแขง ไดกลับไปยังปาตาโกเนีย และตกลงจะทําตามแผนของเอเดลมันไปกอน"
ARG_political_events.71.a: "ยินดีตอนรับกลับ นายกรัฐมนตรีเอเดลมัน!"

ARG_political_events.72.t: "อันโตนิโอ โซโต สถาปนาอนาธิปไตย-สหการนิยมแบบอารเจนตินา"
ARG_political_events.72.desc: "ผิดความคาดหมาย อันโตนิโอ โซโต สามารถเอาชนะใจที่ประชุมได และไดรับการสถาปนาเปนผูนําคนใหมของ[ARG.GetNameDef] ตําแหนงที่เขาอยากเห็นถูกยุบไปเมื่อถึงเวลา โซโตตองการนําประเทศไปสูเสนทางใหม ตามแนวทางอนาธิปไตย-สหการนิยม และทายที่สุดจะลมลางลําดับชั้นทุกรูปแบบในประเทศ"
ARG_political_events.72.a: "อนาคตใหมที่ไมแนนอน"

ARG_political_events.80.t: "เสริมทุนการศึกษา"
ARG_political_events.80.desc: "นโยบายที่สําคัญที่สุดอยางหนึ่งของรัฐบาลที่เพิ่งไดรับเลือกคืออนาคตของการศึกษาใน[ARG.GetNameDef] ไมใชความลับที่งบประมาณดานวิชาการของเราคอนขางขาดแคลนในระยะหลัง ดังนั้นจึงขึ้นอยูกับเราที่จะตัดสินวาจะทุมทุนไปที่ใด และทายที่สุดระบบโรงเรียนของเราจะมุงพัฒนาดานใด"
ARG_political_events.80.a: "ใหทุนการศึกษาดานอิเล็กทรอนิกส"
ARG_political_events.80.b: "ใหทุนการศึกษาดานอุตสาหกรรม"
ARG_political_events.80.c: "ใหทุนการวิจัยวัสดุสังเคราะห"

ARG_political_events.81.t: "ทุนการศึกษาดานอิเล็กทรอนิกส"
ARG_political_events.81.desc: "เมื่อเราเปดทุนการศึกษาใหมลาสุด ก็ไดรับเสียงชื่นชมอยางกึกกองจากนักวิชาการทั่วประเทศ เนื่องจากเราเลือกมุงเนนใหความรูแกประชาชนเรื่องความมหัศจรรยของเทคโนโลยีอิเล็กทรอนิกส เราจึงคาดหวังไดวาหนวยงานวิจัยของเราจะกาวหนาอยางตอเนื่อง"
ARG_political_events.81.a: "เงินที่ใชไดคุมคา"

ARG_political_events.82.t: "ทุนการศึกษาดานอุตสาหกรรม"
ARG_political_events.82.desc: "เมื่อเราเปดทุนการศึกษาใหมลาสุด ก็ไดรับเสียงชื่นชมอยางกึกกองจากนักวิชาการทั่วประเทศ เนื่องจากเราเลือกมุงเนนใหความรูแกประชาชนเรื่องประสิทธิภาพของพัฒนาการทางอุตสาหกรรมใหมๆ เราจึงคาดหวังไดวาหนวยงานวิจัยของเราจะกาวหนาอยางตอเนื่อง"
ARG_political_events.82.a: "เงินที่ใชไดคุมคา"

ARG_political_events.83.t: "ทุนการวิจัยวัสดุสังเคราะห"
ARG_political_events.83.desc: "เมื่อเราเปดทุนการศึกษาใหมลาสุด ก็ไดรับเสียงชื่นชมอยางกึกกองจากนักวิชาการทั่วประเทศ เนื่องจากเราเลือกมุงเนนใหความรูแกประชาชนเรื่องกระบวนการกลั่นสังเคราะหสมัยใหม เราจึงคาดหวังไดวาหนวยงานวิจัยของเราจะกาวหนาอยางตอเนื่อง"
ARG_political_events.83.a: "เงินที่ใชไดคุมคา"

ARG_political_events.90.t: "การฝกซอมรบรวมกับ[ARG.GetNameDef]"
ARG_political_events.90.desc: "เพื่อกระชับความสัมพันธกับเรา [ARG.GetLeader]แหง[ARG.GetNameDef]เสนอเปนเจาภาพจัดการฝกซอมรบรวมเพื่อฝกกองทัพเรือและกองทัพอากาศของเรา ไมตรีอันอบอุนนี้เปนที่ยินดียิ่งในยามที่สถานการณมืดมนลงเรื่อยๆ"
ARG_political_events.90.a: "กองกําลังของเราแข็งแกรงกวาที่เคย"

ARG_political_events.100.t: "[ARG.GetNameDefCap]เชิญเราเขารวมฝายของพวกเขา"
ARG_political_events.100.desc: "[ARG.GetNameDefCap]ไดติดตอมา เชิญเราเขารวมพันธมิตรของพวกเขา เราจะจับมือกันและชวยปกปองประชาธิปไตยในทวีปอเมริกาใตหรือไม?"
ARG_political_events.100.a: "ยืนหยัดเคียงขางกัน!"
ARG_political_events.100.b: "เราตองเดินหนาตามลําพัง"

ARG_political_events.101.t: "[FROM.GetNameDefCap]ตอบรับขอเสนอของเรา"
ARG_political_events.101.desc: "[FROM.GetNameDefCap]ไดกรุณาตอบรับขอเสนอของเราใหเขารวมพันธมิตร และบัดนี้เรายืนหยัดเคียงขางกันในฐานะปราการแหงสันติภาพและประชาธิปไตยในอเมริกาใต"
ARG_political_events.101.a: "รวมกัน เราจะรักษาแนวรบและปกปองประชาชนของเรา!"

ARG_political_events.102.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
ARG_political_events.102.desc: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเราที่จะเขารวมพันธมิตร พวกเขาไมรูหรือวาเมื่ออยูดวยกันเราจะแข็งแกรงกวา หวังวาพวกเขาจะไมเสียใจในวันที่ปฏิเสธเรา"
ARG_political_events.102.a: "ไวโอกาสหนา..."

ARG_political_events.110.t: "[FROM.GetNameDefCap]เคลื่อนไหวอยางกาวราวตอ[URG.GetNameDef]"
ARG_political_events.110.desc: "ดูเหมือนความกลัวของเราจะกลายเปนจริง เมื่อ[FROM.GetNameDef]แสดงทาทีกาวราวตอ[URG.GetNameDef] เนื่องจากพวกเขาเปนเพื่อนบานใกลชิด เราไมอาจเสี่ยงใหพวกเขาตกเปนเหยื่อการรุกรานจากตางชาติ หากเราไมระวัง [FROM.GetNameDef]อาจมาเคาะประตูบานเราแทน"
ARG_political_events.110.a: "เราควรยกระดับเรื่องนี้!"
ARG_political_events.110.b: "การลงมือเสี่ยงเกินไป..."

ARG_political_events.111.t: "[FROM.GetNameDefCap]เรียกรองใหเราถอนตัวจาก[URG.GetNameDef]"
ARG_political_events.111.desc: "เพื่อตอบโตปฏิบัติการของเราใน[URG.GetNameDef] [FROM.GetNameDef]เรียกรองใหเราถอนทหารออกทันทีและยุติการสูรบ หากเราปฏิเสธ มีความเสี่ยงที่เรื่องนี้จะบานปลายเปนสงครามเต็มรูปแบบกับ[FROM.GetNameDef]"
ARG_political_events.111.a: "ใหพวกเขามาเลย!"
ARG_political_events.111.b: "เราไมมีทางเลือกนอกจากถอนตัว"

ARG_political_events.120.t: "ผูมาเยือนแปลกหนา"
ARG_political_events.120.desc: "เชานี้ ชายชาวเยอรมันแปลกหนาคนหนึ่งที่พูดภาษาสเปนไดแบบพอถูไถ เดินเขามาในกาซาโรซาดา พรอมประกาศวาเขามีแผนการยิ่งใหญสําหรับอนาคตของ[ARG.GetNameDef] ดูเหมือนเขาจะมีคุณสมบัติเหมาะกับงาน และนาเชื่อถือมาก เราจะมอบรัฐบาลใหเขาหรือไม?"
ARG_political_events.120.a: "ไดสิ! จะมีอะไรผิดพลาดไดละ?"
ARG_political_events.120.b: "ไมมีทางเด็ดขาด"

ARG_news_events.1.t: "[ARG.GetNonIdeologyName]ดําเนินนโยบายตางประเทศเชิงรุกราน"
ARG_news_events.1.d: "ระยะหลังมานี้ รัฐบาล[ARG.GetAdjective]มีทาทีแข็งกราวและกาวราวขึ้นเรื่อยๆ ในประเด็นนโยบายตางประเทศ เมื่อทศวรรษอันอื้อฉาวสิ้นสุดลงพรอมการเปลี่ยนระบอบอยางรวดเร็ว ดูเหมือน[ARG.GetNonIdeologyName]กําลังเตรียมพรอมสําหรับความเปนไปไดในการขยายดินแดน เชานี้ [ARG.GetLeader] ผูนํา[ARG.GetAdjective] ไดกลาวตอประชาชนทั้งชาติและใหความมั่นใจวายุคแหงความยิ่งใหญกําลังมาถึง พรอมเปาหมายในการรวมอเมริกาใตไวภายใตธงผืนเดียวที่แข็งแกรงและมั่นคง"
ARG_news_events.1.a: "นี่เปนแควาทศิลปใชไหม?"

ARG_political_events.73.t: "[FROM.GetNameDefCap]ตองการความรวมมือที่ใกลชิดขึ้น"
ARG_political_events.73.desc: "นักการทูต[ARG.GetAdjective]เพิ่งติดตอมาขอความรวมมือที่ใกลชิดขึ้น หลังจากขอตกลงการคาลาสุดกับพวกเขา รวมถึงอุดมการณของพวกเขาที่ใกลเคียงกับของเรามากขึ้นเรื่อยๆ คําขอในตอนนี้คือใหลงนามสนธิสัญญาไมรุกรานระหวางสองประเทศ และรับประกันเอกราชของพวกเขา"
ARG_political_events.73.a: "เราชื่นชมความมุงหวังของพวกเขา แนนอนวาพวกเขาจะไดทั้งสนธิสัญญาและการรับประกัน!"
ARG_political_events.73.b: "เราเสนอสนธิสัญญาไมรุกรานใหได แตไมมากกวานั้น"
ARG_political_events.73.c: "นี่ออกจะเกินไปหนอย"

ARG_political_events.74.t: "[FROM.GetNameDefCap]ตกลงทั้งรับประกันเอกราชของเราและทําสนธิสัญญาไมรุกราน"
ARG_political_events.74.desc: "\nเราเพิ่งไดรับคําตอบจาก[FROM.GetNameDef] พวกเขาชื่นชมความพยายามของเราในการพลิกฟนประเทศและหวนคืนสูระบอบประชาธิปไตย จึงตัดสินใจตอบรับคําขอของเรา ดวยเหตุนี้ประเทศของเราจึงแข็งแกรงขึ้น และโอกาสที่จะถูกประกาศสงครามใสก็นาจะลดลงอยางมาก"
ARG_political_events.74.a: "ยอดเยี่ยม!"
ARG_political_events.74.tt: "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!รับประกันเอกราชของเราแลว! \nเราไดทํา§Yสนธิสัญญาไมรุกราน§!กับ[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!แลว!"

ARG_political_events.75.t: "[FROM.GetNameDefCap]ตกลงทําสนธิสัญญาไมรุกราน"
ARG_political_events.75.desc: "เราเพิ่งไดรับคําตอบจาก[FROM.GetNameDef] พวกเขาชื่นชมความพยายามของเราในการพลิกฟนประเทศและหวนคืนสูระบอบประชาธิปไตย จึงตัดสินใจตอบรับคําขอของเรา แตเพียงบางสวน สนธิสัญญาไมรุกรานไดรับการลงนามแลว แตนาเสียดายที่ตอนนี้พวกเขาจะยังไมรับประกันเอกราชของเรา"
ARG_political_events.75.a: "ดีกวาไมไดอะไรเลย..."
ARG_political_events.75.tt: "เราไดทํา§Yสนธิสัญญาไมรุกราน§!กับ[FROM.GetFlag]§Y[FROM.GetNameDefCap]§!แลว!"

ARG_political_events.76.t: "[FROM.GetNameDefCap]ปฏิเสธคําขอความรวมมือที่ใกลชิดขึ้นของเรา"
ARG_political_events.76.desc: "เราเพิ่งไดรับคําตอบจาก[FROM.GetNameDef] พวกเขาชื่นชมความพยายามของเราในการฟนฟูระบอบประชาธิปไตย แตไมเห็นวาการรับประกันเอกราชของเรา หรือการทําสนธิสัญญาไมรุกรานกับเรา จะเปนประโยชนตอพวกเขา"
ARG_political_events.76.a: "ชางนาเสียดาย"

ARG_news_events.2.t: "ยุทธนาวีที่ริโอเดลาปลาตา"
ARG_news_events.2.d: "เชานี้ เรือลาดตระเวนหนัก 'Admiral Graf Spee' ของครีกสมารีเนอไดปะทะกับหมูเรือของราชนาวีอังกฤษนอกปากแมนํ้าริโอเดลาปลาตาในมหาสมุทรแอตแลนติกใต ในการรบที่ตามมา เรือ[ENG.GetAdjective]หลายลําไดรับความเสียหายหนักและตองถอนตัว มุงหนาไปยังหมูเกาะฟอลกแลนด สวนเรือ 'Graf Spee' ไดรับความเสียหายเพียงเล็กนอย ยกเวนการถูกยิงเขาระบบเชื้อเพลิงอยางรุนแรงจนพิการ เรือ[GER.GetAdjective]ไดหนีเขาทามอนเตวิเดโอใน[URG.GetNameDef]เพื่อซอมแซมอยางเรงดวน หลายแหลงขาวอางวานี่คือยุทธนาวีครั้งแรกของความขัดแยงนี้ และดูเหมือนสงครามไดลุกลามมาถึงทวีปอเมริกาใตแลวในที่สุด"
ARG_news_events.2.a: "หวังวาฝาย[ENG.GetAdjective]จะหนีไปดวยเชนกัน"
ARG_news_events.2.b: "ชาว[GER.GetAdjective]ไมมีสิทธิ์มาอยูที่นี่"
ARG_news_events.2.c: "ขาวนากังวล"

ARG_news_events.3.t: "การปฏิวัติคอมมิวนิสต[ARG.GetAdjective]"
ARG_news_events.3.d: "ความวุนวายที่ดําเนินอยูใน[ARG.GetNonIdeologyName]ไดลุกลามจนควบคุมไมอยูในชวงไมกี่วันที่ผานมา นําไปสูสงครามกลางเมือง ภายใตการนําของโรดอลโฟ กิโอลดี ผูเคยถูกเนรเทศ และไดรับการหนุนหลังจากสมาชิกรัฐสภา[ARG.GetAdjective]ฝายซายจํานวนมาก บัดนี้ฝายคอมมิวนิสตไดแยกตัวออกจากรัฐบาลเพื่อพยายามแยงชิงอํานาจและสรางการเปลี่ยนแปลงอยางถอนรากถอนโคนทั่วประเทศ หลายฝายในภูมิภาคกังวลวา[ARG.GetNonIdeologyName]ที่เปนคอมมิวนิสตจะกอใหเกิดปฏิกิริยาลูกโซไปทั่วทวีปอเมริกาใต"
ARG_news_events.3.a: "นาเศราที่มันมาถึงจุดนี้"

#GUAY
JUNO_guay_events.1.t: "นายทหารสนับสนุนรัฐบาล"
JUNO_guay_events.1.desc: "เหลานายทหารไดแสดงการสนับสนุนรัฐบาลที่ปกครองอยู ยุทธศาสตรการเอาใจไดผล และดูเหมือนงบประมาณที่ทุมลงไปในกองทัพจะใหประโยชนเพิ่มเติมดวย"
JUNO_guay_events.1.a: "ยอดเยี่ยม"

JUNO_guay_events.2.t: "[FROM.GetNameDefCap]ตองการใหเราลงทุนสรางเขื่อน"
JUNO_guay_events.2.desc: "[FROM.GetName]ตองการพัฒนาอุตสาหกรรม ในฐานะประเทศที่มีแมนํ้ามากมาย เขื่อนจึงเปนตัวเลือกที่ชัดเจนสําหรับการผลิตไฟฟา หากเราตัดสินใจลงทุน ก็คาดวาจะไดรับเงินคืนภายใน 2 ป"
JUNO_guay_events.2.a: "เปนการลงทุนที่ดี"
JUNO_guay_events.2.tt: "[FROM.GetName]จะตองชําระเงินคืนใหเราภายใน 2 ป เวนแตฝายใดฝายหนึ่งจะทําสงครามกัน"
JUNO_guay_events.2.b: "ไมสนใจ"

JUNO_guay_events.3.t: "[FROM.GetName]ตอบรับ!"
JUNO_guay_events.3.desc: "[FROM.GetName]ตอบรับการลงทุนในประเทศของเราแลว สิ่งนี้จะทําใหเราใกลชิดกันมากขึ้นอยางแนนอน!"
JUNO_guay_events.3.a: "ยอดเยี่ยม!"

JUNO_guay_events.4.t: "[FROM.GetName]ปฏิเสธ!"
JUNO_guay_events.4.desc: "[FROM.GetName]ปฏิเสธแนวคิดที่จะลงทุนในประเทศของเรา เรื่องนี้ไมอาจมองเปนอยางอื่นไดนอกจากความลมเหลวทางการทูต"
JUNO_guay_events.4.a: "เปนความถดถอยอยางแนนอน"

JUNO_guay_events.5.t: "การชําระคืนเงินลงทุนเขื่อน"
JUNO_guay_events.5.desc: "ถึงเวลาชําระหนี้ให[?var:old_world_power.GetName]แลว แมจะกระทบเศรษฐกิจของเราไปสักพัก แตนักเศรษฐศาสตรที่ดีทุกคนจะบอกวาหนี้ไมไดเลวรายเสมอไปหากนําไปลงทุน ซึ่งเราก็ไดทําเชนนั้น"
JUNO_guay_events.5.a: "ทุกสิ่งมีราคาที่ตองจาย"

JUNO_guay_events.6.t: "ความกาวหนาทางทหารของ[FROM.GetAdjective]"
JUNO_guay_events.6.desc: "แมกองทัพ[FROM.GetAdjective]จะมีขนาดเล็กกวา แตก็รุกคืบไดดินแดนและไดเปรียบทางทหารเหนือกองกําลังของเราอยางมาก ขณะนี้ดินแดนพิพาทตกอยูในมือ[FROM.GetName]ทั้งหมดแลว ทําใหความชอบธรรมของเราเหนือภูมิภาคนี้ลดลงอยางมาก เราตองเลือกระหวางทําสงครามตอ ซึ่งจะบั่นทอนขวัญกําลังใจทหารของเราอยางแนนอน หรือยอมยกดินแดนที่เสียไป"
JUNO_guay_events.6.a: "เราทําสงครามที่ไรผลนี้ตอไปไมได"
JUNO_guay_events.6.b: "ดินแดนนี้เปนของเราโดยชอบธรรม"

JUNO_guay_events.7.t: "[FROM.GetName]ยอมแพ"
JUNO_guay_events.7.desc: "ทหารผูมีชัยของเราไดขับไลศัตรูออกจากดินแดนอันชอบธรรมของเรา [FROM.GetName]ตัดสินใจยอมแพและยกดินแดนใหเรา แทนที่จะสูในศึกที่แพแนนอน นี่คือชัยชนะอันทรงเกียรติของเรา พวกเขาไมรูเลยวานี่เปนเพียงจุดเริ่มตนเทานั้น"
JUNO_guay_events.7.a: "ใกลการครอบงําเขาไปอีกกาว"
JUNO_guay_events.7.b: "ที่จริงทุกอยางกําลังไปไดสวย สูตอเถอะ"

JUNO_guay_events.8.t: "[FROM.GetName]ไมยอมออนขอ"
JUNO_guay_events.8.desc: "[FROM.GetName]แจงเราวาการเสนอใหพวกเขาสละดินแดนหลักของตนเปนเรื่องดูหมิ่น และแจงวาพวกเขาจะสูตอไปจนกวารัฐบาลของเราจะลมและกองทัพของเราจะถูกสลาย" 
JUNO_guay_events.8.a: "ยุติละครฉากนี้เสียที"

JUNO_guay_events.9.t: "[FROM.GetName]ชําระคืนเงินลงทุนเขื่อน"
JUNO_guay_events.9.desc: "[FROM.GetName]ไดชําระหนี้จากการที่เราลงทุนในโครงสรางพื้นฐานของพวกเขาแลว การรักษาขอตกลงนี้ทําใหสองประเทศใกลชิดกันมากขึ้น"
JUNO_guay_events.9.a: "เปนประโยชนอยางยิ่ง"

JUNO_guay_events.10.t: "[FROM.GetNameDef]ตัดสินใจรุกตอไป"
JUNO_guay_events.10.desc: "[FROM.GetNameDefCap]แจงเราวาจะไมมีสันติภาพ เห็นไดชัดวา[FROM.Getname]ตั้งใจจะผนวกประเทศของเราทั้งหมด นี่คือสงครามเบ็ดเสร็จ จนกวาจะเหลือคนสุดทาย"
JUNO_guay_events.10.a: "ถาอยางนั้นก็สูจนตาย"

TOA_ven_blockade.1.t: "[FROM.GetName]ปดลอมการขนสงนํ้ามัน"
TOA_ven_blockade.1.desc: "[FROM.GetName]ไดนําเรือรบมาประจําการนอกชายฝงของเรา เพื่อปดลอมการขนสงนํ้ามันที่สงไปยังฝายตรงขามของพวกเขา รัฐบาล[FROM.GetAdjective]ประกาศวาไมไดตองการความขัดแยงโดยตรง แตเปนมาตรการกดดันศัตรู นี่เปนการยกระดับสถานการณอยางแนนอน และแมจะยังไมมีใครไดรับบาดเจ็บ แตการปรากฏตัวของเรือรบในพื้นที่ก็ทําใหบรรยากาศในการากัสตึงเครียด"
TOA_ven_blockade.1.a: "เราตานทาน[FROM.GetName]ไมได"
TOA_ven_blockade.1.b: "นี่คือการประกาศสงคราม!"

TOA_ven_blockade.2.t: "$TOA_ven_blockade.1.t$"
TOA_ven_blockade.2.desc: "[FROM.GetName]ไดดําเนินการอยางอุกอาจและอาจหาญดวยการปดลอม[Ven.GetName]อยางสมบูรณ มีผูพบเห็นเรือรบหลักนอกการากัส และมีรายงานวารัฐบาล[VEN.GetAdjective]ไดรับแจงวามีการปดลอมเต็มรูปแบบเพื่อหยุดการคานํ้ามันระหวางประเทศของเรา"
TOA_ven_blockade.2.a: "เปนการละเมิดความเปนกลางอยางชัดแจง!"

paraguay.1.t: "โอกาสเพิ่มงบประมาณปอมปราการ"
paraguay.1.desc: "การบูรณะอูไมตาเปดโอกาสใหเราเพิ่มงบประมาณดานการปองกันและเสริมปอมปราการในพื้นที่โดยรอบ รวมถึงปอมขนาดเล็กอีกแหงเพื่อปองกันปากแมนํ้าที่นําสูเมืองหลวง"
paraguay.1.a: "ความคิดที่ยอดเยี่ยม"
paraguay.1.b: "ไมอยูในงบประมาณ"
paraguay.1.tt: "เมื่อ§Y$PAR_rebuild_humaita$§!เสร็จสมบูรณ จะเพิ่มเติม:"

south_american_events.60.t: "[MEX.GetNameDefCap]ปลุกกระแสคอมมิวนิสต"
south_american_events.60.desc: "มีผูพบเห็นคอมมิวนิสตจาก[MEX.GetNameDef]ยุยงใหเกิดการเดินขบวนภายในพรมแดนของเรา เราควรรับมืออยางไร?"
south_american_events.60.a: "ปลอยใหพวกเขาทําตอไป"
south_american_events.60.b: "ปราบปรามนักปลุกระดมสังคมนิยมพวกนี้!"

south_american_events.61.t: "ยุทธนาวีที่ริโอเดลาปลาตา"
south_american_events.61.desc: "ครีกสมารีเนอและราชนาวีอังกฤษไดปะทะกันอยางดุเดือดนอกมอนเตวิเดโอ เรือ[GER.GetAdjective]ที่เสียหายหนักไดทอดสมอในทาเรือของเราราว 00.10 น. เพื่อขอซอมแซม ขณะที่นักการทูตอังกฤษกดดันใหเราบังคับเรือลํานี้ออกสูทะเล ซึ่งจะถูกราชนาวีอังกฤษทําลายอยางหลีกเลี่ยงไมได"
south_american_events.61.a: "เรียกรองใหเรือออกจากทาของเรา"
south_american_events.61.b: "ปลอยใหเรืออยูในทาและซอมแซม"

south_american_events.62.t: "ยุทธนาวีที่ริโอเดลาปลาตา"
south_american_events.62.desc: "ราว 06:18 น. เรือของครีกสมารีเนอและราชนาวีอังกฤษไดปะทะกันนอกมอนเตวิเดโอ มีรายงานวาเรือเยอรมันเสียหายหนักและเขาหลบภัยในทาเรือเมืองหลวงของอุรุกวัย นักการทูตอังกฤษกําลังกดดันรัฐบาลอุรุกวัยใหบังคับเรือออกจากทาตามอนุสัญญากรุงเฮก ซึ่งกองกําลังราชนาวีอังกฤษที่รออยูจะทําลายมันไดอยางแนนอน"
south_american_events.62.a: "นาสนใจ"

south_american_news.20.t: "แอนทิลลีสรวมเปนหนึ่ง"
south_american_news.20.d: "สมาพันธรัฐแอนทิลลีสเปนแนวคิดอันแรงกลาของรามอน เอเมเตริโอ เบตันเซส วาดวยความจําเปนที่ชาวพื้นเมืองแคริบเบียนตองรวมตัวกันเปนหนวยระดับภูมิภาค เพื่อรักษาอธิปไตยและความผาสุกของชาติแอนทิลลีส แนวคิดนี้ไดรับการสนับสนุนมากที่สุดตั้งแตทศวรรษ 1850 จนถึงสงครามสเปน-อเมริกา และหลังจากนั้นก็จางหายไปเกือบหมด อยางไรก็ตาม หลังจาก[FROM.GetLeader]รวมภูมิภาคนี้เปนหนึ่ง แนวคิดนี้ก็กลับมามีชีวิตอีกครั้ง และบัดนี้เมื่อสมาพันธรัฐแอนทิลลีสไดรับการประกาศ ก็ชัดเจนยิ่งกวาที่เคยวาแอนทิลลีสเปนของชาวแอนทิลลีสอยางแทจริง!"
south_american_news.20.a: "แนวคิดที่ถึงคราวลมสลาย"
south_american_news.20.b: "แอนทิลลีสเพื่อชาวแอนทิลลีส!"

south_american_events.63.t: "[MEX.GetNameDefCap]ปลุกกระแสฟาสซิสต"
south_american_events.63.desc: "มีผูพบเห็นฟาสซิสตจาก[MEX.GetNameDef]ยุยงใหเกิดการเดินขบวนภายในพรมแดนของเรา เราควรรับมืออยางไร?"
south_american_events.63.a: "ปลอยใหพวกเขาทําตอไป"
south_american_events.63.b: "ปราบปรามนักปลุกระดมฟาสซิสตพวกนี้!"