 # Ribbons
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE: "การรุกคือการปองกันที่ดีที่สุด"
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_DESCRIPTION: "ภายในระยะเวลา 2 ป ทําการรบเชิงรุกใหไดเปนสองเทาของการรบเชิงรับ โดยมีการรบอยางนอย 100 ครั้ง"
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_QUOTE: "\n"หากคุณพบวาตัวเองอยูในการตอสูที่สูสี แปลวาคุณวางแผนภารกิจไดไมดีพอ"\n\n- พันเอกเดวิด แฮ็กเวิรท"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND: "ทะลวงผาน ไมออมไป"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_DESCRIPTION: "โจมตีและยึดครองพื้นที่ที่มีปอมปราการระดับ 10 ไดสําเร็จ"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_QUOTE: ""ในทุก ๆ หนึ่งรอยคน สิบคนไมควรอยูตรงนั้นดวยซํ้า แปดสิบคนเปนเพียงเปา เกาคนเปนนักสูตัวจริง และเราโชคดีที่มีพวกเขา เพราะพวกเขาคือผูสรางการรบ อา แตคนหนึ่งคนนั้น คนหนึ่งคนนั้นคือนักรบ และเขาจะพาคนอื่น ๆ กลับมา"\n\n- จดหมายของนักปรัชญาซีนิก"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS: "ทางนี้ปดแลว"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_DESCRIPTION: "ไดโบนัสการปองกันถึง 400%"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_QUOTE: ""การรบไมใชที่ที่คุณอาจตาย -- แมวาจะเกิดขึ้นได -- แตเปนที่ที่คุณจะไดรูวาคุณจะไดมีชีวิตอยูตอไปหรือไม อยาประเมินพลังของการตระหนักรูนั้นตํ่าไป อยาประเมินตํ่าไปวาชายหนุมจะยอมเดิมพันดวยอะไรบางเพื่อไดเลนเกมนั้นอีกสักครั้ง"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS: "พันดวงตะวันอันเจิดจา"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_DESCRIPTION: "จุดระเบิดปรมาณู 3 ลูก โดยแตละลูกหางกันไมเกิน 12 ชั่วโมง"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_QUOTE: ""จนถึงบัดนี้ มนุษยตองอยูกับความคิดเรื่องความตายในฐานะปจเจกบุคคล นับจากนี้ไป มนุษยชาติจะตองอยูกับความคิดเรื่องความตายของตนในฐานะเผาพันธุ"\n\n- อารเทอร เคิสตเลอร"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST: "ปนใหญแหงเดือนสิงหาคม"
