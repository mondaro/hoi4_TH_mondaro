 CAREER_PROFILE_THE_GUNS_OF_AUGUST_QUOTE: ""การหาคนที่อาสาจะตายนั้นงายกวาการหาคนที่เต็มใจอดทนตอความเจ็บปวดอยางใจเย็น"\n\n- จูเลียส ซีซาร"
 CAREER_PROFILE_LEARNING_ON_THE_JOB: "เรียนรูจากการทํางาน"
 CAREER_PROFILE_LEARNING_ON_THE_JOB_DESCRIPTION: "มีผูบัญชาการ (ไมรวมผูบัญชาการกองพล) เพิ่มระดับทักษะสี่ครั้ง"
 CAREER_PROFILE_LEARNING_ON_THE_JOB_QUOTE: ""ตองสูญเสียทหาร 15,000 นาย จึงจะฝกพลตรีไดหนึ่งคน"\n\n- แฟรดีนอง ฟอช"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE: "พวกเขามาจากฟากฟา"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_DESCRIPTION: "ดําเนินแผนสงพลรมโดยใชกองพลพลรม 15 กองพล"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_QUOTE: ""พวกเขาหวานลม และบัดนี้พวกเขากําลังจะเก็บเกี่ยวพายุหมุน"\n\n- คัมภีรไบเบิล, โฮเชยา บทที่ 8 ขอ 7"
 CAREER_PROFILE_COORDINATED_INVASION: "การยกพลขึ้นบกแบบประสานกัน"
 CAREER_PROFILE_COORDINATED_INVASION_DESCRIPTION: "ดําเนินการยกพลขึ้นบกพรอมกัน 4 ครั้ง ในพื้นที่ยกพลขึ้นบก 4 แหงที่แตกตางกัน"
 CAREER_PROFILE_COORDINATED_INVASION_QUOTE: ""การรบเอาชนะไดดวยการเขนฆาและการดําเนินกลยุทธ ยิ่งนายพลยิ่งใหญเทาใด เขาก็ยิ่งอาศัยการดําเนินกลยุทธมากขึ้น และเรียกรองการเขนฆานอยลงเทานั้น"\n\n- วินสตัน เอส. เชอรชิลล, "The World Crisis""
 CAREER_PROFILE_NOT_SO_FAST: "ชากอน"
 CAREER_PROFILE_NOT_SO_FAST_DESCRIPTION: "บดขยี้กองพลศัตรูหนึ่งกองพล"
 CAREER_PROFILE_NOT_SO_FAST_QUOTE: ""เมื่อภาษาทองถิ่นคือความรุนแรง ก็จงพูดใหคลอง"\n\n- ไมทราบผูกลาว"
 CAREER_PROFILE_TANKS_NO_THANKS: "รถถังหรือ ไมละขอบคุณ"
 CAREER_PROFILE_TANKS_NO_THANKS_DESCRIPTION: "บดขยี้กองพลรถถังของศัตรูหนึ่งกองพล"
 CAREER_PROFILE_TANKS_NO_THANKS_QUOTE: ""วากันตามจริงแลว รถถังก็คือกลองเหล็กเล็ก ๆ ที่อัดแนนไปดวยสารไวไฟหรือวัตถุระเบิด ซึ่งกลายเปนเตาเผาศพเคลื่อนที่สําหรับลูกเรือผูเชี่ยวชาญของมันไดอยางงายดาย"\n\n- พลจัตวาเชลฟอรด บิดเวลล"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE: "เราจะสูในรมเงา"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_DESCRIPTION: "สงเครื่องบินมากกวา 5000 ลําเขาประจําการในภูมิภาคนานฟาเดียว"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_QUOTE: ""เครื่องบินมีขอบกพรองทางเทคนิคมากมายเสียจนเปนเพียงเรื่องของเวลา กอนที่คนมีเหตุผลทุกคนจะตระหนักวามันไรประโยชน!"\n\n- อางวามาจากบทความใน "Scientific American", (1910)"
 CAREER_PROFILE_ACES_HIGH: "เหลาเอซเหนือฟา"
 CAREER_PROFILE_ACES_HIGH_DESCRIPTION: "มีนักบินเอซ 20 คนใชสนามบินเดียวกันเปนฐานประจําการ"
 CAREER_PROFILE_ACES_HIGH_QUOTE: ""ฟากฟาคือสมรภูมิของพวกเขา พวกเขาคือทหารมาแหงหมูเมฆ "\n\n- เดวิด ลอยด จอรจ"
 CAREER_PROFILE_BEHIND_ENEMY_LINES: "หลังแนวขาศึก"
 CAREER_PROFILE_BEHIND_ENEMY_LINES_DESCRIPTION: "ยึดเมืองหลวงของศัตรูโดยใชคําสั่งสงพลรม"
 CAREER_PROFILE_BEHIND_ENEMY_LINES_QUOTE: ""เราเปนพลรมนะ รอยโท เราควรจะถูกลอมอยูแลว"\n\n- พันตรีวินเทอรส, Band of Brothers"

# First Startup Splash Screen Text
 SUB_MESSAGE_SPLASHSCREEN_TITLE: "รับเหรียญตราและแพรแถบจากผลงานโดดเดนในสนามรบ!"
 SUB_MESSAGE_SPLASHSCREEN_DESC: "เหรียญตราและแพรแถบเปนรูปแบบใหมของความทาทายและรางวัลที่สามารถไดรับในเกมที่ไมใชโหมดไอรอนแมน ตรวจสอบรายการไดในประวัติการเลนของคุณ และเปรียบเทียบสถิติและเหรียญตรากับเพื่อน ๆ \n\n นอกจากนี้ ประวัติการเลนยังรองรับการเก็บสถิติสําหรับม็อดแลว!"

# Backup Flavor Texts
 CAREER_PROFILE_BACKUP_QUOTE_01: ""ขาคือแสแหงพระเจา หากพวกเจาไมไดกอบาปมหันต พระเจาคงไมสงการลงทัณฑอยางขามาลงโทษพวกเจา"\n\n- เจงกิสขาน"
 CAREER_PROFILE_BACKUP_QUOTE_02: ""มนุษยมีสามประเภท: ผูที่ไมอาจขยับได ผูที่ขยับได และผูที่ขยับพวกเขา"\n\n- อางวาเปนคํากลาวของเบนจามิน แฟรงคลิน"
 CAREER_PROFILE_BACKUP_QUOTE_03: ""...เหลาบุรุษผูสงบพายุและขี่สายฟา"\n\n- เท็ดดี รูสเวลต"
 CAREER_PROFILE_BACKUP_QUOTE_04: ""ตีอีกฝายใหเร็วที่สุดเทาที่ทําได และแรงที่สุดเทาที่ทําได ตรงจุดที่เจ็บที่สุด ตอนที่เขาไมทันมอง"\n\n- เซอรวิลเลียม สลิม"
 CAREER_PROFILE_BACKUP_QUOTE_05: ""เมื่อทานกลับบาน จงเลาถึงพวกเราและบอกวา เพื่อวันพรุงนี้ของพวกเขา เราไดสละวันนี้ของเรา"\n\n- จอหน แม็กซเวลล เอดมอนส"
 CAREER_PROFILE_BACKUP_QUOTE_06: ""สิ่งใดที่คุมคาแกการตอสู ก็คุมคาแกการสูแบบสกปรก"\n\n- ไมทราบผูกลาว"
 CAREER_PROFILE_BACKUP_QUOTE_07: ""ขาจะกลับมาใหเร็วที่สุดพรอมกําลังใหมากที่สุดเทาที่ทําได ระหวางนี้ พวกทานตองยันไวใหได!"\n\n- อางวาเปนคํากลาวของดักลาส แมกอาเธอร"
 CAREER_PROFILE_BACKUP_QUOTE_08: ""ปนใหญของขาศึกตื่นขึ้นจากที่ใดสักแหง และกระสุนก็พุงขามมา- คุณนับมันไดขณะที่มันพุงมา แลวคุณก็นับไมไหวอีกตอไป มันตกลงมาอยางไรระเบียบ หนึ่ง-สอง-สาม แตราวกับรูดีวาพวกเราอยูตรงไหน- ซาย ขวา ขางหนา ขางหลัง กระแทกลงมาเหมือนถังขยะยักษที่ถูกยักษขวางใส ดินที่แตกกระจายตกลงบนตัวเรา หินที่แตกราวกระเด็นใสหินที่ยังไมแตกบนไหลเขา ราตรีที่คืบคลานเขามาดังกึกกองในหูของเรา"\n\n- แอลวา เบสซี, Men in Battle: A Story of American in Spain (1939)"
 CAREER_PROFILE_BACKUP_QUOTE_09: ""โอ เจาจะไปที่ใดเมื่อแสงวาบอันบาดตา โปรยเมล็ดพันธุแหงดวงตะวันนับลาน? และเจาจะทําสิ่งใดในสายฝนแหงเถาธุลี? แตจะเปนเชนไรเมื่อแสงวาบอันบาดตา รบกวนโครงขายอันแนบแนนของรางกายเจา เผยใหเห็นกระดูกอันงดงามของเจา? เจาจะสวมใสสิ่งใดในสายฝนแหงเถาธุลี?"\n\n- ขอความตอนหนึ่งจาก "Terminal Colloquy" ของชาลส มารติน"
 CAREER_PROFILE_BACKUP_QUOTE_10: ""จงอานการทัพของอเล็กซานเดอร ฮันนิบาล ซีซาร กุสตาวัส ตูแรน เออแฌน และเฟรเดอริก ซํ้าแลวซํ้าเลา นี่คือหนทางเดียวที่จะเปนนายพลผูยิ่งใหญและเขาถึงความลับแหงศิลปะการสงคราม"\n\n- นโปเลียน โบนาปารต"
 CAREER_PROFILE_BACKUP_QUOTE_11: ""ขาพเจาตองศึกษาการเมืองและการสงคราม เพื่อใหลูกชายของขาพเจามีเสรีภาพที่จะศึกษาคณิตศาสตรและปรัชญา... เพื่อใหลูกหลานของพวกเขามีสิทธิ์ที่จะศึกษาจิตรกรรม กวีนิพนธ และดนตรี"\n\n- จอหน แอดัมส"
 CAREER_PROFILE_BACKUP_QUOTE_12: ""นํ้าทั้งมหาสมุทรไมอาจทําใหเรือจมได เวนแตนํ้าจะเขาไปขางใน"\n\n- ไมทราบผูกลาว"
 CAREER_PROFILE_BACKUP_QUOTE_13: ""แลนเรือเหมือนขโมยมันมา"\n\n- ไมทราบผูกลาว"
 CAREER_PROFILE_BACKUP_QUOTE_14: ""พวกมันมากมายเหลือเกิน และพวกเรามีนอยนิด แลวเราจะฝงพวกมันใหหมดไดอยางไร?"\n\n- สํานวนฟนแลนดสมัยสงครามฤดูหนาว"
 CAREER_PROFILE_BACKUP_QUOTE_15: ""ตองเปนคนกลาหาญจึงจะเปนคนขี้ขลาดในกองทัพแดงได"\n\n- โจเซฟ สตาลิน"
 CAREER_PROFILE_BACKUP_QUOTE_16: ""นามของทานไมมีผูใดรูจัก วีรกรรมของทานเปนอมตะ"\n\n- อนุสรณทหารนิรนาม"
 CAREER_PROFILE_BACKUP_QUOTE_17: ""การตายเพื่อองคจักรพรรดิคือการมีชีวิตอยูชั่วนิรันดร"\n\n- ไมทราบผูกลาว"
 CAREER_PROFILE_BACKUP_QUOTE_18: ""ซุนวูกลาววา: ในศิลปะการสงครามเชิงปฏิบัติ สิ่งที่ดีที่สุดคือการยึดประเทศของศัตรูไวทั้งหมดโดยไมเสียหาย การทําลายลางประเทศนั้นไมดีเทา"\n\n- ซุนวู, ตําราพิชัยสงคราม"
 CAREER_PROFILE_BACKUP_QUOTE_19: ""มนุษยทั้งปวงลวนเปนพี่นองกัน ดุจทองทะเลทั่วโลก แลวเหตุใดลมและคลื่นจึงปะทะกันอยางดุเดือดไปทุกหนแหง?"\n\n- ฮิโรฮิโตะ"
 CAREER_PROFILE_BACKUP_QUOTE_20: ""Facta non-Verba."\n\n- ภาษาละตินแปลวา "การกระทํา ไมใชคําพูด""
 CAREER_PROFILE_BACKUP_QUOTE_21: ""สงครามคือชีวิตที่คูณดวยตัวเลขที่ไมเคยมีใครไดยินมากอน"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_22: ""อุดมการณไมจําเปนตองชอบธรรม และการรบไมจําเปนตองชนะได แตครั้งแลวครั้งเลาตลอดประวัติศาสตร ผูคนเลือกที่จะตายในสนามรบพรอมกับเพื่อนพอง มากกวาจะหนีเอาตัวรอดเพียงลําพัง"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_23: ""แตปญหาของความกลัวก็คือ มันไมใชสิ่งใดสิ่งหนึ่งเพียงอยางเดียว ความกลัวมีการจําแนกประเภททั้งระบบ—ความวิตก ความหวาดหวั่น ความตื่นตระหนก ลางสังหรณราย—และคุณอาจเตรียมใจรับรูปแบบหนึ่งไว แตกลับพังทลายโดยสิ้นเชิงเมื่อเผชิญอีกรูปแบบหนึ่ง"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_24: ""พลเรือนไมยอมรับวาสิ่งที่สรางบาดแผลทางใจมากที่สุดอยางหนึ่งของการรบ คือการตองละทิ้งมันไป สงครามเลวรายและผิดอยางเห็นไดชัด จนความคิดที่วามันอาจมีอะไรดีอยูบางแทบจะรูสึกเหมือนเปนการหมิ่นศักดิ์สิทธิ์"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_25: ""การรบอัดอะดรีนาลีนเขาสูรางกายมากเสียจนความกลัวแทบไมเปนปญหา สิ่งที่บงบอกถึงความกลาหาญที่แทจริงไดดีกวามาก คือความรูสึกของคุณกอนปฏิบัติการใหญ เมื่อความหมายของการสูญเสียชีวิตไดมีโอกาสซึมซับเขามาจริง ๆ จุดออนสวนตัวของผมไมใชความกลัวเทากับการรอคอยมัน"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_26: ""แนวมาฌีโนปลอดภัยแลว การสงบศึกไดรับความเห็นชอบแลว และผมไดรับคําสัญญาจากเธอแลววาจะไมรุกรานโปแลนด"\n\n- แฟรดีนอง ฟอช"
 CAREER_PROFILE_BACKUP_QUOTE_27: ""สิ่งเดียวที่ยากกวาการใสความคิดใหมเขาไปในหัวของทหาร คือการเอาความคิดเกาออกมา"\n\n- รอยเอกเซอรบาซิล ลิดเดลล ฮารต, Thoughts on War, 1944"
 CAREER_PROFILE_BACKUP_QUOTE_28: ""สงครามมีหลายแงมุม และการแสรงทําเปนวาความตื่นเตนไมใชหนึ่งในนั้นก็ไรประโยชน"\n\n- เซบาสเตียน ยังเงอร, War"
 CAREER_PROFILE_BACKUP_QUOTE_29: ""นักปรัชญาและนักวิทยาศาสตรไดแสดงใหเห็นวาการปรับตัวคือเคล็ดลับแหงการดํารงอยู อยางไรก็ตาม ประวัติศาสตรคือบัญชีรายชื่อแหงความลมเหลวในการเปลี่ยนแปลงใหทันความจําเปน และกองทัพ ซึ่งดวยบทบาทของมันควรเปนสถาบันที่ปรับตัวไดดีที่สุด กลับเปนสถาบันที่แข็งทื่อที่สุด - ซึ่งตองแลกมาดวยความเสียหายตออุดมการณที่พวกเขายึดถือ"\n\n- รอยเอกเซอรบาซิล ลิดเดลล ฮารต, Thoughts on War, 1944"
 CAREER_PROFILE_BACKUP_QUOTE_30: ""การเปลี่ยนแปลงคือลักษณะของโลกสมัยใหม คุณจะจัดการกับการเปลี่ยนแปลง หรือไมการเปลี่ยนแปลงก็จะจัดการกับคุณ"\n\n- นายพลกอรดอน อาร. ซัลลิแวน"

