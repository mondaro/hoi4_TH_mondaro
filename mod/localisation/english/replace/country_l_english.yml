 NATIONAL_UNITY_DESC: "เอกภาพแหงชาติแสดงถึงความมุงมั่นของผูนําระดับสูงที่จะทําสงครามจนถึงที่สุด ยิ่งคานี้สูงเทาใด พวกเขาก็จะยิ่งสูตอไปไดนานขึ้นกอนจะพิจารณายอมแพ"
 STABILITY_DESC: "เสถียรภาพแสดงถึงการสนับสนุนของประชาชนตอรัฐบาลปจจุบัน เสถียรภาพที่สูงจะทําใหผลักดันการเปลี่ยนแปลงทางการเมืองไดงายขึ้น และชวยใหเศรษฐกิจดําเนินไปอยางราบรื่น"
 WAR_SUPPORT_DESC: "การสนับสนุนสงครามแสดงถึงความเต็มใจของประชาชนที่จะทําสงครามจนถึงที่สุด การประกาศใชกฎหมายหลายฉบับและการเตรียมประเทศใหพรอมเขาสูสงครามอยางมีประสิทธิภาพจําเปนตองมีการสนับสนุนสงครามในระดับสูง"
