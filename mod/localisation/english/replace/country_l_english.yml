 ARMY_EXPERIENCE_GAIN_TRAINING: "จาก§Hการซอมรบของกองทัพบก§!: $VALUE|=+3$ ตอวัน"
 ARMY_EXPERIENCE_GAIN_COMBAT: "จาก§Hการรบของกองทัพบก§!: $VALUE|=+3$ ตอวัน"
 ARMY_EXPERIENCE_DESC: "เมื่อยุทโธปกรณของคุณถูกใชในการรบ คุณจะไดรับประสบการณกองทัพบก นั่นหมายความวาคุณจะไดรับประสบการณกองทัพบกเมื่อ§Hกองพล§!ของคุณเขาสูการรบ หรือเมื่อคุณ§Hใหยืม-เชา§!ยุทโธปกรณแกสงครามของพันธมิตร\nคุณยังไดรับประสบการณจากการจัด§Hการซอมรบของกองทัพบก§!ดวยกําลังพลที่อยูในระดับ $UNIT_TRAINING_LEVEL|Y$ ขึ้นไป และจาก§Hแผนยุทธศาสตร§!บางรายการ §Hรัฐมนตรี§!บางคนสามารถเพิ่มประสบการณที่ไดรับได\n\nตองใชประสบการณกองทัพบกในการสรางและแกไข§Hแมแบบกองพล§!ของคุณ และปลดล็อก§Hหลักนิยม§!"
 NAVY_EXPERIENCE: "ประสบการณกองทัพเรือ"
 NAVY_EXPERIENCE_GAIN_TRAINING: "จาก§Hการฝกซอมทางทะเล§!: $VALUE|=+3$ ตอวัน"
 NAVY_EXPERIENCE_GAIN_COMBAT: "จาก§Hการรบทางทะเล§!: $VALUE|=+3$ ตอวัน"
 NAVY_EXPERIENCE_GAIN_MISSIONS: "จาก§Hภารกิจทางทะเล§!: $VALUE|=+3$ ตอวัน"
 NAVY_EXPERIENCE_DESC: "เมื่อเรือของคุณถูกใชในการรบและใน§Hการฝกซอมทางทะเล§! คุณจะไดรับประสบการณกองทัพเรือ §Hแผนยุทธศาสตร§!บางอยางใหประสบการณเพิ่มเติม และ§Hรัฐมนตรี§!บางคนสามารถเพิ่มประสบการณที่ไดรับได\n\nประสบการณกองทัพเรือใชสําหรับพัฒนารุนยอยที่ดีขึ้นของเรือที่มีอยู ออกแบบเรือใหม และปลดล็อก§Hหลักนิยม§!"
 AIR_EXPERIENCE: "ประสบการณกองทัพอากาศ"
 AIR_EXPERIENCE_GAIN_TRAINING: "จาก§Hการฝกนักบิน§!: $VALUE|=+3$ ตอวัน"
 AIR_EXPERIENCE_GAIN_COMBAT: "จาก§Hการรบทางอากาศ§!: $VALUE|=+3$ ตอวัน"
 AIR_EXPERIENCE_GAIN_MISSIONS: "จาก§Hภารกิจทางอากาศ§!: $VALUE|=+3$ ตอวัน"
 AIR_EXPERIENCE_DESC: "เมื่อเครื่องบินของคุณเขาปะทะขาศึกในภารกิจหรือฝกซอมใน§Hการฝกนักบิน§! คุณจะไดรับประสบการณกองทัพอากาศ หมายความวาคุณสามารถไดรับประสบการณกองทัพอากาศเมื่อ§Hกองบิน§!ของคุณเขารวมการรบ หรือหากคุณ§Hใหยืม-เชา§!ยุทโธปกรณแกพันธมิตรที่กําลังทําสงคราม\n§Hแผนยุทธศาสตร§!บางอยางใหประสบการณเพิ่มเติม และ§Hรัฐมนตรี§!บางคนสามารถเพิ่มประสบการณที่ไดรับได\n\nประสบการณกองทัพอากาศใชสําหรับพัฒนารุนยอยที่ดีขึ้นของเครื่องบินที่มีอยู ออกแบบเครื่องบินใหม และปลดล็อก§Hหลักนิยม§!"
