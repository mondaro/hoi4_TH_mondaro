 FRA_full_employment: "การจางงานเต็มที่"
 FRA_full_employment_desc: "เราอยูในสถานะที่นาอิจฉาเพราะมีอัตราการวางงานตํ่ามาก สวนหนึ่งเปนผลจากการนองเลือดมหาศาลในมหาสงคราม อยางไรก็ตาม สิ่งนี้ทําใหบริษัทตาง ๆ หาแรงงานฝมือไดยาก และกองทัพก็แขงขันกับตลาดแรงงานเพื่อหาทหารใหมไดลําบาก การขยายการเกณฑทหารจะยิ่งทําใหปญหาเลวรายลง เราควรหาแหลงกําลังพลอื่นมาชดเชยการขาดแคลน ไมวาจะในดานการเกณฑหรือดานเศรษฐกิจ"
 FRA_worker_shortage: "การขาดแคลนแรงงาน"
 FRA_worker_shortage_desc: "ความตองการของกองทัพไดรับความสําคัญเหนือความกังวลเรื่องการขาดแคลนแรงงาน บริษัทจํานวนมากรายงานวาขาดแคลนแรงงานฝมือจนเริ่มสงผลตอผลผลิต การผอนปรนกฎหมายการเกณฑทหารจะทําใหผูคนกลับเขาโรงงานได แตจะไมแกปญหาที่ตนเหตุ"
 FRA_inefficient_economy_1: "เศรษฐกิจที่ไรประสิทธิภาพ"
 FRA_inefficient_economy_1_desc: "แมฝรั่งเศสจะยังเปนประเทศอุตสาหกรรมชั้นนํา แตก็ลาหลังในดานการรวมศูนยขีดความสามารถในการผลิต จําเปนตองมีการปฏิรูปครั้งใหญเพื่อใหเศรษฐกิจของเราแขงขันไดในระดับโลก"
