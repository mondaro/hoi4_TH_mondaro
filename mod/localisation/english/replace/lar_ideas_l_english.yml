 SPA_awaiting_the_rebellion: "รอการกบฏ"
 SPA_awaiting_the_rebellion_desc: "การรัฐประหารไดรับการวางแผนอยางพิถีพิถัน และเราพรอมจะลงมือไดทุกเมื่อ อยางไรก็ตาม เราไดเรียนรูจากความลมเหลวในอดีต แทนที่จะซํ้ารอยความลมเหลวของซานคูรคาดาในป 1932 เราจะรอจนกวากระแสสาธารณะจะสนับสนุนเปาหมายของเราอยางเพียงพอ เพื่อใหแนใจวาเราจะไมถูกขับออกไปไดงาย ๆ"
 SPA_carlism: "ลัทธิคารลิสต"
 SPA_carlism_desc: "ในป 1830 พระเจาเฟรนันโดที่ 7 ทรงประกาศพระราชกฤษฎีกาปราจมาติก และทรงตั้งพระธิดา ซึ่งตอมาคือสมเด็จพระราชินีนาถอิซาเบลที่ 2 เปนรัชทายาทโดยสันนิษฐาน พระราชบัญญัตินี้ไดตัดอินฟนเตการโลส พระอนุชาของพระองคออกจากลําดับการสืบราชสันตติวงศ ดังนั้นเมื่อพระมหากษัตริยสวรรคต ผูสนับสนุนอินฟนเตการโลสจึงกอสงครามกลางเมืองหลายครั้ง โดยรวมตัวกันภายใตธงของลัทธิคารลิสต และตอสูเพื่อฟนฟูกฎการสืบราชสันตติวงศแบบซาลิก\n\nหนึ่งศตวรรษตอมา ขบวนการคารลิสตยังคงมีชีวิตชีวา และกองกําลังของพวกเขาที่เรียกวาเรเกเตก็ฝกฝนไมหยุดหยอน เพื่อเตรียมพรอมสําหรับวันที่พวกเขาจะถูกเรียกใชอีกครั้งเพื่อปกปองศาสนาคริสตและนําพระมหากษัตริยผูชอบธรรมกลับคืนบัลลังก"
 SPR_government_power_struggle: "การแยงชิงอํานาจในรัฐบาล"
 SPR_government_power_struggle_desc: "แมจะไดชัยชนะในการเลือกตั้งครั้งลาสุด แตพรรคการเมืองฝายซายก็แตกแยกเปนเสี่ยง ๆ เมื่อแตละพรรคตางแยงชิงความเปนใหญในรัฐบาลใหม ตําแหนงประธานาธิบดีเองตกเปนเปาโจมตีเปนพิเศษ เมื่อความบาดหมางที่ยืดเยื้อระหวางประธานาธิบดีกับฝายซายกลุมตาง ๆ กําลังถึงจุดแตกหัก นักการเมืองผูกระหายและทะเยอทะยานตางจับจองตําแหนงนี้อยางหิวกระหาย"
 SPR_death_before_surrender: "ตายดีกวายอมแพ"
 SPR_political_violence: "ความรุนแรงทางการเมือง"
 SPR_political_violence_desc: "การเมืองสเปนแบงขั้วและรุนแรงขึ้นเรื่อย ๆ ผานไปเพียงสองปนับจากการลุกฮือครั้งใหญครั้งลาสุด คือการนัดหยุดงานของคนงานเหมืองอัสตูเรียส และบรรยากาศทางการเมืองในขณะนี้ดูจะมีองคประกอบครบถวนสําหรับการลุกฮือครั้งใหมที่ใหญกวาและลุกลามกวางขวางกวาเดิมมาก ดูไมนาเปนไปไดที่การเลือกตั้งที่กําลังจะมาถึงจะยุติวังวนแหงความไมสงบทางสังคมนี้ได"
 SPR_national_strikes: "การนัดหยุดงานทั่วประเทศ"
 SPR_national_strikes_desc: "ประเทศดูเหมือนจะตกอยูในขั้นเริ่มตนของการปฏิวัติของกรรมกร การนัดหยุดงานครั้งแลวครั้งเลาทําใหอุตสาหกรรมและชีวิตประจําวันเปนอัมพาต ขณะที่คนงานเรียกรองใหทํางานนอยลงและไดคาจางมากขึ้น และชาวนาผูเชาที่ดินยากจนก็เขายึดที่ดินทํากินมากขึ้นเรื่อย ๆ โดยที่รัฐบาลทําเปนมองไมเห็น"
