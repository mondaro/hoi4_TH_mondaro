l_english:
 SPR_military_disloyalty: "ความไมภักดีของกองทัพ"
 SPR_military_disloyalty_desc: "ความลมเหลวของความพยายามรัฐประหาร "ซานคูรคาดา" ในป 1932 ยังคงทอดเงามืดเหนือกองทัพสเปนจนถึงทุกวันนี้ ภายหลังเหตุการณ ผูบัญชาการทหารที่ไมภักดีหลายคน รวมถึงโคเซ ซานคูรโค ผูนําการรัฐประหาร ไดหลบหนีไปลี้ภัยในโปรตุเกสและยังคงวางแผนสมคบคิดอยูจนถึงบัดนี้\n\nทวาความลมเหลวครั้งนี้ก็ไมไดทําใหนายทหารที่ไมภักดีทอถอย เพราะแมในสเปนเองก็ยังมีหลายคนปรารถนาจะเห็นการกลับมาของระบอบกษัตริย หรือแมแตเผด็จการฟาสซิสตที่เขมแข็ง หากรัฐบาลแทรกแซงกิจการภายในของกองทัพมากเกินไป ก็อาจจุดชนวนการลุกฮืออีกครั้ง ซึ่งจะรุนแรงและนองเลือดยิ่งกวาครั้งกอน"
 SPR_military_disloyalty_tt: "§Rไมสามารถฝกหนวย ยุบหนวย หรือแกไขแมแบบหนวยได§!\n"
 SPR_disbanded_army: "กองทัพที่ถูกยุบ"
 SPR_disbanded_army_desc: "กองทัพไดแสดงใหเห็นถึงความไมภักดีและถูกรัฐบาลยุบไปแลว จนกวาเราจะมั่นใจในความภักดีของนายทหาร เราตองพึ่งพากองกําลังอาสาของประชาชนแทนกองทัพอาชีพ"
