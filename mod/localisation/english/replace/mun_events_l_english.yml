l_english:
##CZECHOSLOVAKIA##
MUN_czech_skoda_priority.t: "โรงงานชโกดา"
MUN_czech_skoda_priority.d: "บริษัทโรงงานชโกดาผลิตสินคาหลากหลาย ตั้งแตปนใหญไปจนถึงรถถัง รถไฟ และปนเรือ ทําใหมีความคลองตัวสูงในการโยกยายทรัพยากรไปยังจุดที่มีความตองการสูงสุด ซึ่งบัดนี้เราสามารถกําหนดทิศทางไดบางสวน"
MUN_czech_skoda_priority.1.a: "นาสนใจ"
MUN_czech.2.t.1: "กองกําลังกึ่งทหารซูเดเทินลันดขอความชวยเหลือ"
MUN_czech.2.t.2: "กองอาสาเสรีซูเดเทินลันดขอความชวยเหลือ"
MUN_czech.2.t.3: "กองกําลังกรรมกรซูเดเทินขอความชวยเหลือ"
MUN_czech.2.d.1: "จากขาวลาสุดเกี่ยวกับแผนการของเราตอ [CZE.getname] พรรคการเมืองหลายพรรคในซูเดเทินลันดไดรีบจัดตั้งกองกําลังกึ่งทหารขึ้นทั่วภูมิภาค โดยหวังจะบอนทําลายรัฐบาล[CZE.GetAdjective] บัดนี้พวกเขากําลังขอการสนับสนุนจากเราในการบุกโจมตีขามพรมแดนและกอวินาศกรรมเพื่อชวยความพยายามของเราตอ [CZE.getname]"
MUN_czech.2.d.2: "จากขาวลาสุดเกี่ยวกับแผนการของเราตอ [CZE.getname] พรรคการเมืองในซูเดเทินลันดไดรีบระดมกองกําลังกึ่งทหารของตน นั่นคือกองอาสาเสรีซูเดเทิน หนวยกองอาสาเสรีทั่วซูเดเทินลันดไดจัดตั้งหนวยและเริ่มโจมตีทรัพยสินของรัฐบาล[CZE.GetAdjective]ในซูเดเทินลันด บัดนี้พวกเขากําลังขอการสนับสนุนเต็มที่จากเราในการบุกโจมตีขามพรมแดนและกอวินาศกรรมตอ [CZE.getname]"
MUN_czech.2.d.3: "จากขาวลาสุดเกี่ยวกับแผนการของเราตอ [CZE.getname] พรรคคอมมิวนิสตทองถิ่นไดรีบระดมกองกําลังกรรมกร กองกําลังกรรมกรเหลานี้เริ่มโจมตีทรัพยสินของรัฐบาล[CZE.GetAdjective]ในภูมิภาค บัดนี้พวกเขากําลังขอการสนับสนุนเต็มที่จากเราในการบุกโจมตีขามพรมแดนและกอวินาศกรรมตอ [CZE.getname] และพวกตอตานการปฏิวัติอื่นๆ"
MUN_czech.2.a: "เราชวยแนนอน"
MUN_czech.2.b: "อยาสนับสนุนพวกเขาไปมากกวานี้ดีกวา"
MUN_czech.3.t: "ความเคลื่อนไหวของกองโจรในซูเดเทินลันด"
MUN_czech.3.d: "หลังจากที่ [FROM.getname] แสดงความสนใจที่จะผนวกซูเดเทินลันดเมื่อเร็วๆ นี้ กองกําลังกึ่งทหารก็เริ่มปะทะกับเรา พวกเขาเริ่มโจมตีอาคารของรัฐบาลและบอนทําลายการปองกันของเราในบางพื้นที่ หากเราหวังจะปรับปรุงสถานการณทางทหารในพื้นที่ เราตองจัดการกับกลุมกองกําลังกึ่งทหารเหลานี้"
MUN_czech.3.a: "มันจะแยไปกวานี้ไดอีกหรือ?"
MUN_czech.4.t: "วิกฤตความเชื่อมั่น"
MUN_czech.4.d: "ขาวลาสุดเรื่องการรุกรานทางทหารตอเราไดสั่นคลอนรัฐบาลถึงแกน [CZE.GetLeader] สูญสิ้นความเชื่อมั่นในความสามารถของรัฐบาลที่จะนําประเทศฝาวิกฤตนี้ไปได เขาเรียกรองให $CZE_jan_syrovy$ เขาควบคุมสถานการณและนําประเทศ $CZE_jan_syrovy$ กลาววาเขาลังเลที่จะรับหนาที่ผูนํา แตดวยสถานการณเชนนี้ [CZE.GetLeader] จึงบอกเขาวาไมมีทางเลือกอื่นนอกจากรับตําแหนงและนําเราฝาวิกฤตนี้ไป"
MUN_czech.4.a: "เราตองการคุณมากกวาที่เคย"
MUN_czech.4.b: "เราตองไมเสียสติ"
MUN_czech.5.t: "โตมาช มาซาริก ถึงแกอสัญกรรม"
MUN_czech.5.d: "มาซาริกเปนบุคคลที่ชวยสรางเสถียรภาพในการเมืองเชโกสโลวาเกียมานานกวาสองทศวรรษ ยามที่เชื่อกันวาไมอาจจัดตั้งรัฐบาลผสมไดและทางตันทางการเมืองใหญเกินจะกาวขาม มาซาริกก็สามารถสรางปาฏิหาริยทางการเมืองไดครั้งแลวครั้งเลา เพื่อชวยเสริมความแข็งแกรงและพัฒนาเชโกสโลวาเกียจนเปนอยางทุกวันนี้ การจากไปของเขาจะเปนที่อาลัยอยางยิ่งและจะรูสึกไดทั่วทั้งชาติ"
MUN_czech.5.a: "ยักษใหญทางการเมืองที่ไมมีใครแทนที่ได"
MUN_czech.7.t: "ทบทวนพันธะตอ[CZE.getnamedef]"
MUN_czech.7.d: "เมื่อไมนานมานี้มีขาวมาถึงเราวา[GER.getnamedef]ตองการผนวกซูเดเทินลันด และพรอมจะทําสงครามกับ[CZE.getnamedef]เพื่อบรรลุเปาหมายนี้ ปจจุบันเรามีขอตกลงปองกันรวมกับ[CZE.getnamedef] ซึ่งหมายความวาหากพวกเขาทําสงครามกับ[GER.getnamedef] เราจะมีพันธะตองเขาชวยเหลือ หากเราตองการหลีกเลี่ยงผลลัพธนี้ เราตองถอนตัวจากขอตกลงปองกันกับ[CZE.getnamedef]ทันที"
MUN_czech.7.a: "เรายืนเคียงขางมิตรของเรา"
MUN_czech.7.b: "เราไมมีทางสู[GER.getnamedef]ได"
MUN_czech.1001.t: "[FROM.GetNameDefCap]เรียกรองฉนวนเชื่อมตอกับ[SOV.GetNameDef]"
MUN_czech.1001.d: "ดวยหวังจะประสานปฏิบัติการทางทหารกับ[SOV.GetNameDef] [FROM.GetNameDef]จึงเรียกรองใหเรายกพื้นที่ชายแดน [89.GetName] และ [91.GetName] ใหพวกเขา"
MUN_czech.1002.t: "[FROM.GetNameDefCap]เรียกรองอิทธิพลเหนือสันนิบาตยูโกสลาฟ"
MUN_czech.1002.d: "หลังจากขยายอํานาจลงใต [FROM.GetName] ไดยื่นขอเรียกรองที่ไมธรรมดา พวกเขาไมไดเรียกรองดินแดน แตตองการควบคุมสันนิบาตปองกันยูโกสลาฟ เพื่อเปนผูคุมครองและเจาเหนือหัวของประเทศบอลขานตอนเหนือที่ปจจุบันอยูใตอารักขาของเรา พวกเขาอางวาจะเปนผูคุมครองที่มีความสามารถมากกวาเรา แตแนนอนวานั่นอาจเปนเพียงขออาง"
MUN_czech.1002.a: "บางทีพวกเขาอาจพูดถูก"
MUN_czech.1002.b: "ไม พวกเขาอยูใตการคุมครองของเรา!"
MUN_czech.1003.t: "[FROM.GetName] ปฏิเสธขอเรียกรอง"
MUN_czech.1003.d: "แมนักการทูตของเราจะใหเหตุผลอยางนาเชื่อถือ [FROM.GetNameDef]ก็ยังปฏิเสธที่จะยอมตามขอเรียกรองของเรา"
MUN_czech.1003.a: "พวกเขาไมเหลือทางเลือกอื่นใหเรา"
MUN_czech.1004.t: "[FROM.GetName] เคลื่อนไหวตอตานฮังการี"
MUN_czech.1004.d: "มีขาวมาถึง[ROOT.capital.GetCapitalVictoryPointName]วาทหาร[FROM.GetAdjective]กําลังรุกคืบเขาหาชายแดน[HUN.GetAdjective] แมผูแทน[HUN.GetAdjective]จะติดตอเรามาในไมชาอยางไมตองสงสัย แตเราควรตัดสินใจไวกอนวาจะชวย[HUN.GetNameDef]และไดพันธมิตรที่อาจเปนประโยชน หรือจะปลอยให[FROM.GetNameDef]ดําเนินแผนการตอไป"
MUN_czech.1004.a: "เราควรปกปองผลประโยชนของเรา"
MUN_czech.1004.b: "เราอยายุงดีกวา"
MUN_czech.1005.t: "[FROM.GetName] เรียกรองดินแดนชายฝง"
MUN_czech.1005.d: "ขณะที่[FROM.GetNameDef]ขยายอาณาเขตอยางตอเนื่อง ผูแทนของพวกเขาไดมาเรียกรองใหเรายกดินแดนที่ขุนนาง[FROM.GetAdjective]เคยครอบครองใหแกพวกเขา พวกเขาอางวาสิ่งนี้จะทําใหพวกเขาเขาถึงทะเลเอเดรียติกได และดูเหมือนจะไมสนใจความเห็นของเราในเรื่องนี้นัก"
MUN_czech.1006.t: "[FROM.GetName] เสนอความเปนหุนสวน"
MUN_czech.1006.d: "[FROM.GetNameDef]ไดยื่นสนธิสัญญาปองกันรวมกันแกเรา โดยหวังจะยับยั้งผูรุกรานดวยพลังรวมของกองทัพทั้งสอง แตที่นาสนใจคือ สนธิสัญญานี้ยังมีภาคผนวกลับที่ระบุถึงการขยายอิทธิพลของ[ROOT.GetAdjective]ที่อาจเกิดขึ้น และวิธีที่[FROM.GetNameDef]จะใหความชวยเหลือได"
MUN_czech.1007.t: "[FROM.GetName] เรียกรองใหเขารวมฝาย"
MUN_czech.1007.d: "ความไมไววางใจระหวางเรากับ[FROM.GetNameDef]นับแตพวกเขากอตั้งขึ้น ทําใหบัดนี้พวกเขาเรียกรองใหเราเขารวมฝายกับพวกเขา มิฉะนั้นจะเสี่ยงตอการถูกรุกราน แตที่นาสนใจคือ[FROM.GetNameDef]ยังเอาใจความทะเยอทะยานดานดินแดนของเรา โดยสัญญาวาหากเราเลิกอางสิทธิ์ในดินแดนของพวกเขา พวกเขาอาจชวยใหเราไดดินแดนอื่นที่เราอางสิทธิ์"
MUN_czech.1007.b: "เราตองรักษาอธิปไตยของเรา!"
MUN_czech.1008.t: "[FROM.GetName] เสนอใหเปนพันธมิตรกับ [CZE_invited_country.GetName]"
MUN_czech.1008.d: "ผูแทนจาก[FROM.GetNameDef] สะพานเชื่อมของเรากับยุโรปกลาง ไดเสนอใหขยายพันธมิตรดวยการเชิญ [CZE_invited_country.GetName]"
MUN_czech.1008.a: "เพิ่มการยับยั้งไมใหใครกลาโจมตีเรา"
MUN_czech.1008.b: "ใครจะคาดหวังใหเราปกปองทั้งยุโรปได"
MUN_czech.1009.t: "[FROM.GetName] เชิญเราเขารวม [CZE.GetFactionName]"
MUN_czech.1009.d: "นักการทูตจาก[FROM.GetNameDef]แจงวาพวกเขายินดีตอนรับเราเขาสูพันธมิตร แตในอดีต การอางสิทธิ์ในดินแดนของเราเคยเปนจุดขัดแยงในความสัมพันธกับ[FROM.GetNameDef] บัดนี้เราตองตัดสินใจวาจะยังคงยืนยันการอางสิทธิ์เหลานั้น หรือมุงสรางความสัมพันธที่เปนมิตรมากขึ้น"
MUN_czech.1009.a: "แดพันธมิตรใหมของเรา!"
MUN_czech.1009.b: "เราจะเขารวมหลังจากการอางสิทธิ์ของเราไดรับการยอมรับ"
MUN_czech.1009.c: "เราไมสนใจ"
MUN_czech.1010.t: "[FROM.GetName] เชิญเราเปนผูนํา [CZE.GetFactionName]"
MUN_czech.1010.d: "หลังจากเพิ่งพยายามเปลี่ยนขอตกลงความตกลงไตรภาคีนอยใหเปนพันธมิตรที่แทจริง [FROM.GetNameDef]ไดยื่นขอเสนอ คือตองการใหเราเปนผูนําฝายใหมนี้ พวกเขาจะยอมสละตําแหนงผูนํา และแลกกับการไดเราเปนผูคุมครองอันมีคา ขอตกลงนี้จะขยายเขตอิทธิพลของเรา แตอาจรวมถึงชาติที่กําลังถูกคุกคามดวย"
MUN_czech.1010.a: "พวกเขาจะเปนพันธมิตรที่มีคา"
MUN_czech.1010.b: "ปกปอง[ROOT.GetNameDef]ก็พอแลว"
MUN_czech.1011.t: "[FROM.GetName] เสนอขอตกลงคุมครอง"
MUN_czech.1011.d: "ในฐานะสวนหนึ่งของความพยายามยับยั้งการรุกรานตอ[FROM.GetNameDef] นักการทูตของพวกเขาไดนํารางสนธิสัญญาปองกันรวมกันมาเสนอเรา เพื่อแลกกับการหนุนหลังจากเรา พวกเขาจะใหการคุมครองแบบเดียวกันแกเรา ซึ่งจะบีบใหผูรุกรานใดๆ ตองรบสองแนวรบ"
MUN_czech.1011.a: "คุมคาที่จะเสี่ยง"
MUN_czech.1011.b: "ความเปนกลางปลอดภัยกวา"
MUN_czech.1012.t: "[FROM.GetName] เรียกรองใหเรายอมอยูใตอํานาจ"
MUN_czech.1012.d: "ดวยความฮึกเหิมจากพันธมิตรที่เพิ่งกอตั้ง [FROM.GetNameDef]ไดยื่นขอเรียกรองชุดหนึ่งที่เทากับการสูญเสียอธิปไตยของเรา ดวยการหนุนหลังจาก [SOV.GetName] ที่สนใจภูมิภาคนี้ บัดนี้เราตองตัดสินใจวาเราจะปฏิเสธไดหรือไม"
MUN_czech.1012.a: "การตอตานมีแตจะสูญเสียชีวิตชาว[ROOT.GetAdjective]โดยเปลาประโยชน"
MUN_czech.1012.b: "ยอมตายดีกวาเสียเกียรติ!"
MUN_czech.1013.t: "[FROM.GetName] เสนอพันธมิตรแบบมีเงื่อนไข"
MUN_czech.1013.d: "หลังจากไตรตรองอยางรอบคอบ รัฐบาลของ[FROM.GetNameDef]ประกาศวาเห็นพองวาการเปนพันธมิตรจะเปนประโยชน แตก็ประกาศดวยวาพวกเขาไมอาจมองขามการอางสิทธิ์ในดินแดนของตนได พวกเขาจึงยื่นขอเสนอวาจะเขารวมฝายของเรา แตตองใหเรายกดินแดนที่พวกเขาอางสิทธิ์ใหกอน"
MUN_czech.1013.a: "การเสียสละที่คุมคา"
MUN_czech.1013.b: "เรากําลังพยายามปกปองดินแดนของเรา!"
MUN_czech.1014.t: "[FROM.GetName] ขอการคุมครอง"
MUN_czech.1014.d: "นักการทูตผูมีอิทธิพลจาก[FROM.GetNameDef]ไดเขาพบรัฐมนตรีตางประเทศ เพื่อขอใหเราทําใหคําสัญญาคุมครองอันคลุมเครือในสนธิสัญญาเชโกสโลวาเกีย-โซเวียตป 1935 มีความชัดเจนเปนรูปธรรม"
MUN_czech.1014.a: "บางทีเราควรพยายามปกปองพันธมิตรของเรา"
MUN_czech.1014.b: "ใหเปนแคคําสัญญาคลุมเครือตอไป"
MUN_czech.1015.t: "[FROM.GetName] เสนอรวมฝายของเราเขาดวยกัน"
MUN_czech.1015.d: "เมื่อเรามีศัตรูรวมกันแลว [FROM.GetName] จึงยื่นขอเสนอที่จะกระชับความรวมมือดวยการรวมฝายของเราเขากับฝายของพวกเขา"
MUN_czech.1015.a: "ความพยายามที่ประสานกันจะชวยรักษาชีวิตผูคน"
MUN_czech.1015.b: "เราตองเปนผูควบคุม"
MUN_czech.1016.t: "[FROM.GetName] เสนอสนธิสัญญาไมรุกราน"
MUN_czech.1016.d: "โดยตอยอดจากการเจรจาครั้งกอนที่ถูกยกเลิกไปหลังการเปลี่ยนแผนนโยบายตางประเทศ [FROM.GetNameDef]ไดเสนอใหเจรจาเรื่องสนธิสัญญาไมรุกรานตอ"
MUN_czech.1016.a: "พรมแดนที่ตองปกปองลดลงหนึ่งแหง"
MUN_czech.1016.b: "สิ่งนี้จะขัดขวางความทะเยอทะยานของเรา"
MUN_czech.1017.t: "รวมกันบุก[GER.GetNameDef]?"
MUN_czech.1017.d: "[FROM.GetNameDef]ไดนําแผนลับในการบุก[GER.GetNameDef]มาเสนอตอผูนําระดับสูงของ[ROOT.GetAdjective] หลังจากแสดงใหเห็นวามุงมั่นเพียงใดที่จะกําจัดภัยคุกคามจาก[GER.GetAdjective] พวกเขาขอใหเราชวยเหลือเพื่อรวมกันบดขยี้กองทัพ[GER.GetAdjective]อันเกรียงไกร"
MUN_czech.1017.a: "เราจะรวมโจมตี[GER.GetNameDef]กับพวกเขา"
MUN_czech.1017.b: "นี่อันตรายเกินไป"
MUN_czech.1018.t: "สูกับ[GER.GetNameDef]เพียงลําพัง?"
MUN_czech.1018.t.2: "รวมกันบุก[GER.GetNameDef]"
MUN_czech.1018.d: "แมเราจะพยายามทางการทูตอยางเต็มที่ เราก็ไมสามารถหาการสนับสนุนจากตางชาติสําหรับการชิงบุก [GER.GetName] กอนไดเลย คําถามตอนนี้คือเราจะดําเนินแผนโจมตีตอไปหรือไม"
MUN_czech.1018.d.FRA_POL: "ขาวดีมาถึงจากทั้ง[FRA.GetNameDef]และ[POL.GetNameDef] นักการทูตของเรารายงานวาทั้งสองชาติใหคํามั่นวาจะชวยเราบุก[GER.GetNameDef]"
MUN_czech.1018.d.FRA: "นักการทูตของเรากลับมาจาก[FRA.GetNameDef]พรอมขาวดีวาพวกเขายินดีรวมบุก[GER.GetNameDef] บัดนี้เราตองประเมินวากําลังรวมของเราจะเพียงพอหรือไม"
MUN_czech.1018.d.POL: "นักการทูตของเรากลับมาจาก[POL.GetNameDef]พรอมขาวดีวาพวกเขายินดีรวมบุก[GER.GetNameDef] บัดนี้เราตองประเมินวากําลังรวมของเราจะเพียงพอหรือไม"
MUN_czech.1018.a: "พวกมันไมมีทางรูตัว"
MUN_czech.1018.b: "มาคิดดูอีกที มันเสี่ยงเกินไป"
MUN_czech.1019.t: "[FROM.GetName] เรียกรอง [762.GetName]"
MUN_czech.1019.d: "โดยอางความตองการฟนฟูพรมแดนโบฮีเมียเดิม และเพื่อสรางความชอบธรรมในการควบคุม [72.GetName] ผูแทน[FROM.GetAdjective]ไดยื่นคําขาดเรียกรองใหเรายก [762.GetName] ให"
MUN_czech.1019.a: "บางทีนี่อาจทําใหเราปลอดภัย"
MUN_czech.1020.t: "[FROM.GetName] เสนอการลงทุนแบบมีเงื่อนไข"
MUN_czech.1020.a: "ขอตกลงที่ดีเยี่ยม!"
MUN_czech.1020.b: "เงื่อนไขเหลานี้ยอมรับไมได"
MUN_czech.1020.d: "นักการทูตจาก[FROM.GetNameDef]ไดเดินทางมา พรอมเสนอขอตกลงที่ประเทศของพวกเขาจะลงทุนในอุตสาหกรรมและโครงสรางพื้นฐานของเรา เพื่อแลกกับขอตกลงดานทรัพยากร การเคลื่อนไหวครั้งนี้ซึ่งเกิดขึ้นหลังการลงทุนที่ลมเหลวในปกอนๆ บงบอกถึงความพยายามครั้งใหมในการปรับปรุงความสัมพันธ"
CZE_investment_effects_tt: "ใน §Y100 วัน§! เราจะไดรับ:\n§Yโครงสรางพื้นฐาน§! ใน §Y3§! รัฐแบบสุม\n§Yโรงงานพลเรือน§! ใน §Y1§! รัฐแบบสุม\n"
MUN_czech.1021.t: "การกลับมาของสหภาพศุลกากรออสเตรีย-ฮังการี?"
MUN_czech.1021.d: "[CZE.GetNameDefCap]ไดนํารางขอตกลงการคาระหวางชาติที่เคยเปนสวนหนึ่งของออสเตรีย-ฮังการีมาเสนอเรา แมจะพอใจกับเอกราชของตน แตรัฐบาล[CZE.GetAdjective]ชุดใหมดูจะเต็มใจเปนพิเศษที่จะฟนฟูองคประกอบที่เปนประโยชนของชาติออสเตรีย-ฮังการี"
MUN_czech.1021.a: "การคาที่มากขึ้นฟงดูนาสนใจ"
MUN_czech.1021.b: "เราตองปกปองผูผลิตในประเทศ"
MUN_czech.1022.t: "[CZE.GetName] ยึดไซลีเซีย"
MUN_czech.1022.d: "หลังการสูรบอยางดุเดือดรอบเทือกเขาของ [69.GetName] ทหาร[CZE.GetAdjective]ก็เจาะแนวไดสําเร็จ และเขาควบคุมไซลีเซียทั้งหมด กอนที่กองทหารที่พวกเขาปะทะดวยจะฟนตัวพอจะตอตานอยางจริงจังได"
MUN_czech.1022.a: "เราตองเขาแทรกแซง"
MUN_czech.1022.b: "เราไมอาจสรางศัตรูเพิ่มอีก"
MUN_czech.1022.c: "ชัยชนะครั้งยิ่งใหญ!"
MUN_czech.1023.t: "[CZE.GetName] เริ่มการตอสูเพื่อไซลีเซีย"
MUN_czech.1023.d: "โดยอางเหตุผลลาสมัยเกี่ยวกับราชอาณาจักรและจักรวรรดิในยุคกลาง [FROM.GetNameDef]ไดยกระดับการปะทะตามชายแดนใหกลายเปนสงครามจํากัดขอบเขต เพื่อพยายามเขาควบคุมไซลีเซียของ[ROOT.GetAdjective]"
MUN_czech.1023.a: "เตรียมทหารใหพรอม"
MUN_czech.1024.t: "[CZE.GetName] เสนอขอตกลงสันติภาพ"
MUN_czech.1024.d: "หลังจากการปะทะตามชายแดนในไซลีเซียลุกลามเปนสงครามเต็มรูปแบบ บัดนี้[FROM.GetNameDef]ไดแสดงความพรอมที่จะยุติความขัดแยงหากไดรับดินแดนที่อางสิทธิ์"
MUN_czech.1024.a: "บางทีเราควรมุงไปที่พื้นที่อื่น"
MUN_czech.1024.b: "สถานการณยังเปนตอเราอยู"
MUN_czech.1024.c: "เรื่องนี้ไมมีการตอรอง!"
MUN_czech.1025.t: "สิ้นสุดภารกิจอาสาสมัครในสเปน"
MUN_czech.1025.d.1: "ทหาร[ROOT.GetAdjective]ที่สงไปชวย [CZE_supported_spanish_faction.GetName] กําลังเดินทางกลับบานหลังจากชวยใหพวกเขาไดชัยชนะ การสูรบไดใหความรูใหมแกทหารของเรา โดยเฉพาะหนวยแพทย"
MUN_czech.1025.d.2: "แมกองกําลัง[ROOT.GetAdjective]จะสูรบอยางกลาหาญในสงครามกลางเมืองสเปน แตฝายที่เราสนับสนุนก็พายแพในที่สุด ถึงกระนั้น ทหารของเราโดยเฉพาะทีมแพทยก็ไดรับบทเรียนอันมีคา"
MUN_czech.1025.a: "หวังวาเราจะไมตองนําบทเรียนเหลานี้มาใชในบานเรา"
MUN_czech.1026.t: "[FROM.GetName] ปฏิเสธขอเสนอ"
MUN_czech.1026.a: "พวกเขาเสียเอง"
MUN_czech.1026.b: "พัฒนาการที่นากังวล"
MUN_czech.1026.france_refuses_to_lead: "แม [FROM.GetAdjective] จะไดรับขอเสนอตําแหนงผูนําเพื่อแลกกับการเขารวมพันธมิตรของเรา แตพวกเขาก็ตัดสินใจไมเขารวม ดูเหมือนวา [FROM.GetAdjective] กําลังพยายามวางตัวเปนกลาง หรือรอจังหวะอยู"
MUN_czech.1026.sphere_of_influence: "แมสมาชิกรัฐบาล[FROM.GetAdjective]จะยืนยันกับเราวาซาบซึ้งในการมีสวนรวมของเราใน [ROOT.GetFactionName] แตพวกเขากลาววาการขยายอิทธิพลของเราเขาสูคาบสมุทรบอลขานนั้นเกินเลยไป และอาจทําใหพันธมิตรที่มีศักยภาพหวาดกลัว"
MUN_czech.1026.guarantee: "นักการทูตของเรารายงานวาแมจะพยายามอยางเต็มที่ [FROM.GetNameDef]ก็ไมเห็นดวยกับขอเสนอขอตกลงปองกันรวมกันของเรา ดูเหมือนพวกเขาประเมินวาเราเสี่ยงมากกวาพวกเขา หวังวาพวกเขาจะคิดผิด"
MUN_czech.1026.faction_merge: "แมเราจะพยายามอยางดีที่สุด นักการทูตของเราและของ[FROM.GetAdjective]ก็ไมสามารถตกลงกันเรื่องการรวม [ROOT.GetFactionName] และ [FROM.GetFactionName] เขาดวยกันได"
MUN_czech.1026.non_aggression: "แมจะยืนยันถึงเจตนาสันติ แตนักการทูต[FROM.GetAdjective]ก็ปฏิเสธที่จะลงนามสนธิสัญญาไมรุกรานกับชาติของเรา สวนเหตุผลนั้นยังตองรอดูกันตอไป"
MUN_czech.1026.trade_deal: "โดยอางความตองการรักษาความเปนอิสระทางเศรษฐกิจ [FROM.GetNameDef]ไดปฏิเสธขอเสนอขอตกลงการคาของเรา"
MUN_czech.1026.faction_invite: "แมนักการทูตของเราจะชี้แจงเหตุผลวา[FROM.GetNameDef]จะไดประโยชนจากการเปนพันธมิตรกับเราอยางไร แตสุดทายก็ไมสามารถดึงพวกเขามารวมฝายได"
MUN_czech.1026.weapons_sale: "แมเราจะยื่นขอเสนออยางใจกวาง [FROM.GetNameDef]ก็ตัดสินใจไมซื้ออาวุธจากเราในขณะนี้"
MUN_czech.1026.unification: "แมจะยอมรับประโยชนที่สหพันธรัฐจะนํามา [FROM.GetNameDef]ก็เลือกที่จะใหรัฐบาลพลัดถิ่นของตนเปนรัฐบาลชอบธรรมเพียงหนึ่งเดียวของดินแดนของตน"
MUN_czech.1026.white_peace: "วันนี้ผูแทนของเรากลับมาพรอมขาวรายวา แมเราจะยึดครอง [66.GetName] ได แตผูนํา[FROM.GetAdjective]ก็ไมยอมลงนามสนธิสัญญาสันติภาพ ดูเหมือนเราจะตองพิชิตตอไปใหไกลกวานี้ หรือหวังวาพวกเขาจะหมดแรงไปเอง"
MUN_czech.1027.t: "ทําขอตกลงการคา[FROM.GetAdjective]-[ROOT.GetAdjective]?"
MUN_czech.1027.d: "แมในตอนแรกจะมีความแตกตางทางอุดมการณ แต[FROM.GetNameDef]ก็เขาหาเราเพื่อทําขอตกลงการคาโดยอาศัยความเปนนักปฏิบัตินิยมของเรา เพื่อแลกกับการที่[FROM.GetAdjective]ไดรับอนุญาตใหขุดทรัพยากรใน [202.GetName] พวกเขาจะชวยจัดหาเครื่องมือกลที่เราตองการอยางยิ่งเพื่อขยายศักยภาพทางอุตสาหกรรม"
MUN_czech.1027.a: "ขอตกลงดีเยี่ยมเลย"
MUN_czech.1027.b: "เราไมควรใหทรัพยากรเหลานั้นแกพวกเขา"
MUN_czech.1028.t: "ความลาชาในการสรางปอมปราการ"
MUN_czech.1028.d: "หลายคนในประเทศกําลังตั้งคําถามวาทําไมรัฐบาลจึงไมดําเนินโครงการสรางปอมปราการที่เริ่มไวเมื่อปลายปที่แลวตอ รัฐบาลไดจัดสรรเงินทุนสําหรับโครงการสรางปอมเพิ่มเติมผานสภาปอมปราการ เมื่อโครงการไมมีความคืบหนา ประชาชนจึงเรียกรองใหดําเนินโครงการตอหรือคืนเงินทุน หากเราตองการดําเนินโครงการสรางปอมปราการตอ ก็ไมมีเวลาใหเสียแลวในการเริ่มโครงการใหมเพื่อใหเสร็จทันเวลา"
MUN_czech.1028.a: "เราไมมีเวลาใหเสีย!"
CZE_no_time_to_lose_tt: "ชวงเวลาที่เราจะทําโครงการสรางปอมปราการใหเสร็จกอนภัยคุกคามจะปรากฏขึ้นนั้นแคบมากแลว"
MUN_czech.1029.t: "โครงการสรางปอมปราการเสร็จสิ้นแลว"
MUN_czech.1029.d: "โครงการสรางปอมปราการลาสุดของเราเสร็จสมบูรณแลว และมีทรัพยากรพรอมเริ่มโครงการใหม วิศวกรของเราพรอมเคลื่อนยายไปยังพื้นที่อื่นไดทันทีเพื่อวางรากฐานแนวปอมปราการแหงใหม"
MUN_czech.1029.a: "ทําไดดีมาก ทานทั้งหลาย"
MUN_czech.1030.t: "[FROM.GetName] เรียกรองการรวมชาติ"
MUN_czech.1030.d: "[FROM.GetNameDefCap]เรียกรองใหเราเขาเปนสวนหนึ่งของสหภาพของพวกเขาขณะที่พวกเขาพยายามขยายสหภาพ แมพวกเขาจะเรียกรองตอประเทศตางๆ ในภูมิภาคดวยเหตุผลที่แตกตางกัน ทั้งลัทธิรวมชาติสลาฟ ลัทธิรวมบอลขาน และประวัติศาสตรรวมในจักรวรรดิออสเตรีย-ฮังการีสําหรับบางชาติ แตคําเรียกรองนี้ก็แฝงการขมขูอยางชัดเจนหากเราปฏิเสธ"
MUN_czech.1030.a: "บางทีมันอาจไมเลวรายนัก"
MUN_czech.1030.b: "ไมคอยนาเชื่อถือ"
MUN_czech.1031.t: "[FROM.GetName] เสนอการรวมเปนสหภาพ"
MUN_czech.1031.d: "แม[ROOT.GetNameDef]จะยอมจํานนแลว แตรัฐบาล[FROM.GetAdjective]ไดยื่นขอเสนอที่รุนแรงซึ่งจะทําใหเราสูตอไปได นั่นคือการรวมสวนที่เหลือของชาติเราเขากับชาติของพวกเขา"
MUN_czech.1031.a: "เมื่อรวมกันเราจะปกปองมาตุภูมิไดดีกวา"
MUN_czech.1031.b: "ความแตกตางของเรามากเกินไป"
MUN_czech.1032.t: "การเชื่อมรอยราว"
CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ในซูเดเทินลันด"
CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$กับกรรมกรชาวเช็ก"
CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ใน [72.GetName]"
CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ใน [SLO.GetNonIdeologyName]"
CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ใน [664.GetName]"
CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ใน [73.GetName]"
MUN_czech.1032.d: "ความพยายามเมื่อเร็วๆ นี้ในการแกไขปญหาใน [FROM.getname] ประสบความสําเร็จในการบรรเทาความโกรธแคนตอรัฐบาลกลาง อยางนอยก็ในตอนนี้ บัดนี้ทรัพยากรของรัฐบาลวางพอที่จะทุมใหกับโครงการทางสังคมหรือเศรษฐกิจอื่นๆ เพื่อตอสูกับปญหาที่กําลังแบงแยกประเทศของเราตอไป"
MUN_czech.1032.a: "ลุยกันตอ"
MUN_czech.1033.t: "รัฐบาลพลัดถิ่น[FROM.GetAdjective]ขอการรับรอง"
MUN_czech.1033.d: "รัฐบาลพลัดถิ่น[FROM.GetAdjective]ภายใตการนําของ $CZE_edvard_benesh$ กําลังขอใหเราใหที่พํานักแกคณะผูแทนของพวกเขา ขณะที่พวกเขาตอสูเพื่อกอบกูอธิปไตยของ [CZE.GetNonIdeologyName] กลับคืนมา"
MUN_czech.1033.a: "พันธมิตรอีกรายเพื่อตอตานชาว[GER.GetAdjective]"
MUN_czech.1033.b: "พวกเขาไมมีความชอบธรรม"
MUN_czech.1034.t: "ความไมสงบในสโลวาเกีย"
MUN_czech.1034.d: "เนื่องจากเรายอมออนขอใหกับกระแสชาตินิยมของกลุมอื่นๆ สมาชิกพรรคประชาชนสโลวักจึงไดจัดตั้งกองกําลังกึ่งทหารของตนเอง ซึ่งบัดนี้มุงแสวงหาเอกราชหรืออยางนอยก็อํานาจปกครองตนเองใหสโลวาเกีย คําถามตอนนี้คือเราจะมุงรักษาภาพแหงความเปนเอกภาพดวยการปองกันสิ่งนี้ หรือจะบรรลุเอกภาพดวยการปลอยใหเปนไปและมุงเนนดินแดนที่ภักดีตอรัฐบาล"
MUN_czech.1034.a: "สงกองทัพเขาสโลวาเกีย!"
MUN_czech.1034.b: "จับกุมพวกเขาแตใหอํานาจปกครองตนเองบางสวน"
MUN_czech.1034.c: "เขาควบคุมโดยตรง"
MUN_czech.1034.c_tt: "§Rเราจะตองขึ้นอยูกับการตัดสินใจของ[GER.GetNameDef]เกี่ยวกับชะตากรรมของเชโกสโลวาเกีย§!"
MUN_czech.1035.t: "[FROM.GetName] เสนอผลิตอาวุธใหเรา"
MUN_czech.1035.d: "ความเปนหุนสวนอันแนบแนนของเรากับ[CZE.GetNameDef]ทําใหพวกเขาเสนอขอตกลงพิเศษ พวกเขาจะผลิตอาวุธที่ปจจุบันเราผลิตเองในประเทศใหแกเรา แนนอนวาตองมีคาตอบแทน ซึ่งจะทําใหเรามุงเนนภาคสวนอื่นของอุตสาหกรรมได"
MUN_czech.1035.a: "นี่หมายถึงการลดงานที่ซํ้าซอน"
MUN_czech.1035.b: "เราไมอาจทําใหกองทัพตองพึ่งพายุทโธปกรณตางชาติ"
#MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
MUN_czech.1036.d: "ภาวะเศรษฐกิจตกตํ่าครั้งใหญไมไดเปนผลดีตอชาติเราเลยทั้งทางเศรษฐกิจและการเมือง ปญหาทางเศรษฐกิจและการเมืองระดับภูมิภาคมากมายรุมเราเรา และดูเหมือนจะเลวรายลงแมเราจะฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญไดอยางนาอัศจรรย เราตองจัดการกับปญหาเหลานี้กอนที่มันจะแบงแยกชาติเรามากไปกวานี้"
MUN_czech.1036.a: "เราตองเยียวยาชาติของเรา"
CZE_divided_nation_event_onbroad_tt: "ปลดล็อก§Yการตัดสินใจ§!ที่ชวยใหเรา§Yลบ§!§Yตัวปรับคาของรัฐ§!เชิงลบในรัฐที่เปนดินแดนหลักของเรา\n\nการทํา§Yการตัดสินใจ§!เหลานี้ใหสําเร็จจะลดตัวปรับคาเชิงลบของจิตวิญญาณแหงชาติ §Y$CZE_a_divided_nation_dynamic_modifier$§! ลงดวยจนกวาจะถูก§Yลบ§!"
MUN_czech.1037.t: "[GER.GetName] ปกปอง [HUN.GetName]"
MUN_czech.1037.d: "หลังจากสังเกตเห็นการสรางขออางทําสงครามตอ[HUN.GetNameDef]ที่เกิดขึ้นอยางโจงแจงในประเทศของเรา ผูแทน[GER.GetAdjective]ไดแจงอยางชัดเจนวาการทําสงครามกับชาว[HUN.GetAdjective]จะหมายถึงการทําสงครามกับ[GER.GetNameDef]ดวย จะเดินหนาตอหรือไมนั้นขึ้นอยูกับเรา"
MUN_czech.1037.a: "ตองยกเลิกแผนของเรา"
MUN_czech.1037.b: "นี่ไมไดเปลี่ยนแปลงอะไร"
MUN_czech.1038.t.1: "[FROM.GetName] เสนอใหสิทธิ์แบบรถถังของตน"
MUN_czech.1038.t.2: "[FROM.GetName] เสนอขายปน"
MUN_czech.1038.t.3: "[FROM.GetName] เสนอขายปนใหญ"
MUN_czech.1038.t.4: "[FROM.GetName] เสนอขายรถถังเบา"
MUN_czech.1038.t.5: "[FROM.GetName] เสนอขายเครื่องบินขับไล"
MUN_czech.1038.d: "ผูแทนจากรัฐบาล[FROM.GetAdjective]และบริษัทอาวุธของพวกเขาไดเขามาเสนอขายอาวุธแกเรา ราคาดูคอนขางปกติ และ[FROM.GetNameDef]ยังเสนออาวุธบางชนิดที่ทันสมัยมากดวย"
MUN_czech.1038.a: "ฟงดูเปนขอตกลงที่ดี"
MUN_czech.1039.t: "[RUT.getname] ตองการขอตกลงการปกครองตนเอง"
MUN_czech.1039.d: "ในเมื่อเราใหขอตกลงการปกครองตนเองแก [SLO.getname] $RUT_augustin_voloshyn$ จึงสอบถามวาภูมิภาคของเขาจะไดรับขอตกลงสหพันธรัฐแบบเดียวกันกับเราหรือไม เรื่องนี้ดูไรสาระ แตดวยสถานการณเชนนี้ เราตองรับขอเรียกรองเหลานี้ไวพิจารณาอยางจริงจัง"
MUN_czech.1039.a: "เดี๋ยวคอยวากัน"
MUN_czech.1040.t: "[CZE.getname] เสนอสนธิสัญญาสหภาพศุลกากรแกเรา"
MUN_czech.1040.d: "เมื่อไมนานมานี้[CZE.getnameDEFCAP]ไดรื้อฟนการเจรจาทางการทูตเรื่องสหภาพศุลกากรระหวางสองชาติของเรา ขอตกลงที่พวกเขาพยายามทําดูเปนธรรม แตอาจมีขอเรียกรองอื่นตามมาในภายหลังที่เราอาจไมไดเตรียมรับมือ สนธิสัญญานี้และสิ่งที่แลกเปลี่ยนกันดูเล็กนอยและเปนเพียงสัญลักษณ ดังนั้นการลงนามจึงไมนาจะเสียหายอะไร"
MUN_czech.1040.a: "ดูไมมีพิษภัย"
MUN_czech.1040.b: "เรื่องนี้ไวใจไมได"
MUN_czech.1041.t: "[FROM.getname] ปฏิเสธสนธิสัญญาสหภาพศุลกากร"
MUN_czech.1041.d: "โดยอางเหตุผลบางประการวาสนธิสัญญานี้อาจกระทบเศรษฐกิจของตน [From.getname] จึงปฏิเสธที่จะลงนามสนธิสัญญาสหภาพศุลกากรระหวางสองชาติของเรา เหตุผลเหลานี้ดูเปนขออางที่ไรมูลและไมมีนํ้าหนัก"
MUN_czech.1041.a: "นาผิดหวัง"
MUN_czech.1042.t: "[FROM.getname] ยอมรับสนธิสัญญาสหภาพศุลกากร"
MUN_czech.1042.d: "เมื่อเห็นวาสนธิสัญญาเปนที่นาพอใจ [FROM.getname] จึงตกลงตามเงื่อนไข หวังวานี่จะเปนกาวแรกสูความสัมพันธที่ใกลชิดยิ่งขึ้นระหวางสองชาติของเรา"
MUN_czech.1042.a: "ยอดเยี่ยม"
MUN_czech.1043.t: "[FROM.getname] เรียกรองใหเราเขารวมสหพันธรัฐของพวกเขา"
MUN_czech.1043.d: "โดยอางถึงความสัมพันธที่ใกลชิดยิ่งขึ้นระหวางสองชาติและสถานการณลาสุดทั่วโลก [FROM.getname] กลาววาเราจะดีกวาหากอยูใตการคุมครองของพวกเขามากกวาอยูลําพัง นี่ดูเหมือนเปนแผนการที่จะยึดครองดินแดนของเราเสียมากกวา เราควรทําอยางไร?"
MUN_czech.1043.a: "เรายอมรับ"
MUN_czech.1043.b: "ความคิดที่เลวราย"
MUN_czech.1044.t: "[FROM.getname] ปฏิเสธการเขารวมสหพันธรัฐ"
MUN_czech.1044.d: "ดวยเห็นวาพวกเขาอยูลําพังจะดีกวาอยูใตเรา [FROM.getname] จึงปฏิเสธโอกาสเขารวมสหพันธรัฐของเรา นี่เปนการกระทบตอเปาหมายในการเสริมสถานะของเราในยุโรป เราควรทําอยางไรตอไปในเมื่อ [FROM.getname] ไมยอมคิดได"
MUN_czech.1044.a: "นาเสียดาย"
MUN_czech.1044.b: "เราคงตองลองวิธีอื่น"
MUN_czech.1045.t: "[FROM.getname] ตกลงเขารวมสหพันธรัฐ"
MUN_czech.1045.d: "ดวยเห็นวาพวกเขาจะไดรับการคุมครองที่ดีกวาภายใตเรามากกวาอยูลําพัง [FROM.getname] จึงเขารวมสหพันธรัฐของเราอยางชาญฉลาด สิ่งนี้จะเสริมสถานะของเราในยุโรปอยางมาก"
MUN_czech.1045.a: "ยอดเยี่ยม"
MUN_czech.1046.t: "การเยียวยารอยราว"
MUN_czech.1046.d: "เมื่อจัดการกับปญหามากมายภายในประเทศแลว ความตึงเครียดภายในชาติของเราก็ดูจะบรรเทาลง หลังจากโครงการทางเศรษฐกิจและสังคมมากมายเสร็จสิ้น ประเทศของเราก็ดูจะเริ่มเยียวยาตัวเองไดแลว"
MUN_czech.1046.a: "ขาวดีมาก"
#MUN_czech.1047 is hidden
MUN_czech.1048.t: "[FROM.GetName] ยอมรับขอเรียกรอง"
MUN_czech.1048.t2: "[FROM.GetName] ตกลงตามขอเสนอ"
MUN_czech.1048.d: "เจาหนาที่[FROM.GetAdjective]แจงเราอยางไมเต็มใจวาพวกเขาตั้งใจจะยอมตามขอเรียกรองดานดินแดนของเรา ขณะนี้ทหาร[FROM.GetAdjective]กําลังถอนกําลังออกจากดินแดนแลว"
MUN_czech.1048.d2: "หลังการหารืออยางยาวนาน เจาหนาที่ของเราและของ[FROM.GetNameDef]ไดตกลงกันสําเร็จเรื่องบทบาทใหมของเศรษฐกิจ[FROM.GetAdjective]ในฐานะสวนหนึ่งของสหภาพของเรา การจัดการนี้ยอมนําความมั่งคั่งมาสูพลเมืองของทั้งสองฝายอยางแนนอน"
MUN_czech.1048.d3: "ขอเสนอสนธิสัญญาไมรุกรานของเราไดรับการตอบรับอยางกระตือรือรนทันทีจากผูแทน[FROM.GetAdjective] ดูเหมือนวาความทะเยอทะยานของพวกเขาจะมุงไปที่อื่นในขณะนี้"
MUN_czech.1048.d4: "เมื่อตกอยูใตภัยคุกคามรายแรง [FROM.GetNameDef]จึงยอมตามขอเรียกรองใหเขารวมฝายของเรา"
MUN_czech.1048.d5: "หลังการหารืออยางยาวนาน เจาหนาที่ของเราและของ[FROM.GetNameDef]ไดบรรลุขอตกลงที่อุตสาหกรรมทหารสวนหนึ่งของเราจะทุมเทใหกับการผลิตยุทโธปกรณใหพวกเขา เพื่อแลกกับสินคาสําหรับตลาดและการผลิตของเรา"
#MUN_czech.1049 is a faction joining event so largely reuses generic loc
MUN_czech.1049.d: "รัฐบาลใหมของ[FROM.GetNameDef]ไดเขามาเสนอเปนพันธมิตรกับเรา แมรัฐบาลทหารชุดใหมจะมีจุดยืนตอตานเยอรมันในตอนแรก แตดูเหมือนพวกเขาจะเปนนักปฏิบัตินิยมและตระหนักวาหุนสวนระหวางประเทศเดิมของตนพึ่งพาไมได"
MUN_czech.1050.d: "นักการทูตของเรากลับมาจาก[FROM.GetNameDef]พรอมขาวนาผิดหวังวาคําขอเขารวมพันธมิตรของพวกเขาถูกปฏิเสธ แมเหตุผลจะไมชัดเจน แตบัดนี้เราตกอยูในสถานการณลําบาก เพราะไดเปดเผยความกังวลตอพันธมิตรดั้งเดิมของเราไปแลวโดยไมไดพันธมิตรใหม"
MUN_czech.1050.a: "ถาเชนนั้นเราควรเสนอเงื่อนไขที่ดีกวานี้"
MUN_czech.1050.b: "ไปหาพันธมิตรที่ดีกวากันเถอะ"
MUN_czech.1051.t: "[FROM.GetName] ขอเขตอิทธิพล"
MUN_czech.1051.d: "[FROM.GetNameDef] พันธมิตรใหมของเรา ไดแสดงความสนใจที่จะขยายอิทธิพลขามพรมแดนของตน ผูแทน[FROM.GetAdjective]จึงมาขออนุญาตและการสนับสนุนสําหรับการขยายนี้ โดยจะกําหนดเสนแบงที่ชัดเจนระหวางพื้นที่ภายใตอิทธิพลของ[ROOT.GetAdjective]และ[FROM.GetAdjective]"
MUN_czech.1051.a: "เราควรเสริมความแข็งแกรงใหพันธมิตร[FROM.GetAdjective]คนสําคัญของเรา"
MUN_czech.1052.t: "[FROM.GetName] ขอใหเราอนุญาตใหทหาร[SOV.GetAdjective]ผานแดน"
MUN_czech.1052.d: "หลังจากมีขอตกลงทางการทูตฉบับใหมระหวาง[FROM.GetNameDef]และ[SOV.GetNameDef] [FROM.GetNameDef]ก็มั่นใจวา[SOV.GetNameDef]จะคุมครองพวกเขาหากเกิดความขัดแยง อุปสรรคเดียวคือการไมมีเสนทางทางบกเชื่อมระหวางทั้งสอง นักการทูต[FROM.GetAdjective]จึงเขาพบรัฐบาลของเรา เพื่อขอใหเราอนุญาตใหทหาร[SOV.GetAdjective]ผานดินแดนของเราไปยัง[FROM.GetNameDef]หากเกิดความขัดแยงขึ้น"
MUN_czech.1052.a: "การสูรบของพวกเขาจะปกปองเราดวย"
MUN_czech.1053.t: "[FROM.GetName] กดดันเราดวยการอางสิทธิ์ของ[HUN.GetAdjective]"
MUN_czech.1053.d: "หลังจากเปลี่ยน[HUN.GetNameDef]ใหเปนรัฐบริวาร [FROM.GetNameDef]ก็เรียกรองใหเรายอมรับชะตากรรมเดียวกัน พวกเขาขูวาหากเราปฏิเสธ พวกเขาจะสนับสนุนการอางสิทธิ์ของ[HUN.GetAdjective]ในดินแดน[ROM.GetAdjective] บัดนี้เราตองเลือกระหวางการสูญเสียอธิปไตยหรือการเสี่ยงตอบูรณภาพแหงดินแดน"
CZE_cancel_anti_hungary_focus_tt: "ยกเลิกแผนยุทธศาสตร §Y$CZE_neutralize_the_hungarian_threat$§!"
MUN_czech.1054.t: "รวมกันบุก [LIT.GetName]?"
MUN_czech.1054.d: "ตามที่ตกลงกันไวกอนหนานี้ [FROM.GetNameDef]ไดยื่นขอเสนอที่จะชวยเสริมความแข็งแกรงใหชาติเรา นั่นคือการรวมกับ[LIT.GetNameDef]โดยใชกําลัง ซึ่งจะทําใหเราเขาถึงทรัพยากรเพิ่มเติม และตัดโอกาสที่ศัตรูจะโจมตีเราผาน[LIT.GetNameDef]"
MUN_czech.1054.a: "เราตองขยายตัวเพื่อตานการขยายตัวของผูอื่น"
MUN_czech.1055.t: "อาสาสมัคร[SOV.GetAdjective]มาถึงแลว"
MUN_czech.1055.d: "ดวยปฏิบัติการสงกําลังบํารุงทางอากาศที่ไมเคยมีมากอน [SOV.GetNameDef]ไดใชกองทัพอากาศสงกองพลอาสาสมัครหลายกองพลมายังทาอากาศยานของเราใน [73.GetName] เพื่อสนับสนุนความพยายามทางสงครามของเราในขณะนี้"
MUN_czech.1056.t: "[FROM.GetName] เรียกรอง [975.GetName]"
MUN_czech.1056.d: "เชนเดียวกับที่เคยเสนอไวในการประชุมสันติภาพปารีสหลังมหาสงคราม [CZE.GetNameDef]ประกาศวาเห็นวาฉนวนเชื่อมตอกับพันธมิตรของตน [YUG.GetNameDef] เปนสิ่งจําเปนตอความปลอดภัยของพันธมิตร เพื่อบรรลุเปาหมายนั้น ผูแทน[FROM.GetAdjective]ไดยื่นคําขาดเรียกรองใหเรายก [975.GetName] ให"
#THE FALL OF THE REPUBLIC EVENTS#
MUN_the_fall_of_the_republic.1.t: "การประทวงปะทุขึ้นทั่วประเทศ"
MUN_the_fall_of_the_republic.1.d: "การตัดสินใจลาสุดของ [ROOT.GetLeader] ที่จะยอมสละซูเดเทินลันดไดนําไปสูการประทวงที่ปะทุขึ้นทั่วประเทศ แมผูนําทางการเมืองและทหารตองการหลีกเลี่ยงการนองเลือดในสิ่งที่พวกเขาเห็นวาเปนการตอตานที่ไรประโยชนเมื่อเผชิญกับความเสียเปรียบที่ไมอาจเอาชนะได แตผูคนจํานวนมากทั่วประเทศรูสึกวาพวกเขาตัดสินใจผิด ขบวนการทางการเมืองบางกลุมกําลังเขามาฉวยประโยชนจากความวุนวายเพื่อผลักดันเปาหมายของตนเอง"
MUN_the_fall_of_the_republic.1.a: "เราไมมีทางเลือก!"
MUN_the_fall_of_the_republic.2.t.1: "การลมสลายของสาธารณรัฐที่หนึ่ง"
MUN_the_fall_of_the_republic.2.t.2: "ความโกลาหลภายในรัฐบาล"
MUN_the_fall_of_the_republic.2.d: "หลังจากรัฐบาลเลือกที่จะยอมยกซูเดเทินลันด คลื่นการลาออกครั้งใหญของผูนําระดับลางในกองทัพและรัฐบาลก็ถาโถมเขาใสประเทศ มีรายงานวาบางคนหลบหนีออกนอกประเทศภายในคืนเดียว จําเปนตองมีการเปลี่ยนแปลงครั้งใหญภายในรัฐบาลเพื่อหยุดยั้งการไหลออกของเจาหนาที่ และฟนฟูความเชื่อมั่นในความสามารถของเราในการนําประเทศ"
MUN_the_fall_of_the_republic.2.a: "เราตองการการเปลี่ยนแปลงแบบถึงราก"
MUN_the_fall_of_the_republic.2.b: "เราตองยืนหยัดในแนวทางเดิม!"
MUN_the_fall_of_the_republic.3.t: "[RUT.getname] ขออํานาจปกครองตนเอง"
MUN_the_fall_of_the_republic.3.d: "ดวยความโกลาหลทางการเมืองที่เพิ่งเกิดขึ้นกับชาติเรา ภูมิภาคเล็กๆ อยางคารเพเทียนยูเครนตองการปกครองตนเองเปนอิสระจาก[9.GetCapitalVictoryPointName]มากขึ้น โดยอางถึงความแตกตางที่มีมายาวนานระหวางภูมิภาคนี้กับสวนอื่นของ [ROOT.getname] อยางไรก็ตาม คําขอนี้ดูเหมือนผูนําทองถิ่นฉวยโอกาสเสริมอํานาจใหตนเอง การปฏิเสธคําขอนี้จะทําใหเสียทุนทางการเมืองมากในชวงเวลาที่เราไมมีเหลือใหเสีย"
MUN_the_fall_of_the_republic.3.a: "ไดสิ ทําไมจะไมได?"
MUN_the_fall_of_the_republic.3.b: "ไมมีทาง!"
MUN_the_fall_of_the_republic.3.c: "ปลอยพวกเขาไป"
MUN_the_fall_of_the_republic.4.t: "ชะตากรรมของ [RUT.getname]"
MUN_the_fall_of_the_republic.4.d: "ภายหลังความโกลาหลที่เพิ่งเกิดขึ้นกับ [CZE.getname] ภูมิภาคเล็กๆ อยาง [RUT.getname] ไดหลุดออกนอกพรมแดนของทุกประเทศ ภูมิภาคเล็กๆ นี้อางตนเปนประเทศเอกราชและกําลังติดตอทางการทูตกับเพื่อนบาน หลายคนในรัฐบาลของเรากังวลวาภูมิภาคที่มีความสําคัญทางยุทธศาสตรเชนนี้บนพรมแดนของเราจะตกไปอยูในมือผูอื่น กองทัพเสนอใหยื่นคําขาดตอภูมิภาคที่แยกตัวนี้ทันทีเพื่อเรียกรองใหยอมถูกผนวก"
MUN_the_fall_of_the_republic.4.a: "สงคําขาดไปเดี๋ยวนี้!"
MUN_the_fall_of_the_republic.4.b: "นี่อาจเสี่ยง รอดูทาทีพวกเขาไปกอน"
MUN_the_fall_of_the_republic.5.t: "[FROM.getname] เรียกรองใหผนวกเรา!"
MUN_the_fall_of_the_republic.5.d: "หลังจากเราไดเอกราช ก็เปนเพียงเรื่องของเวลากอนที่ประเทศเพื่อนบานจะหมายผนวกเราเขากับดินแดนของตน [FROM.getname] ดูจะเปนรายแรกที่ทําเชนนั้น และกําลังเรียกรองใหเรายอมจํานน เราควรทําอยางไร?"
MUN_the_fall_of_the_republic.5.a: "เราจะสูจนคนสุดทาย!"
MUN_the_fall_of_the_republic.5.b: "เราไมมีทางเลือกนอกจากตอบตกลง"
MUN_the_fall_of_the_republic.6.t: "[FROM.getname] ปฏิเสธคําขาดของเรา!"
MUN_the_fall_of_the_republic.6.d: "[FROM.getname]ไดปฏิเสธคําขาดของเราอยางไมคาดคิด และเลือกจะตอตานเราดวยกําลังอาวุธแทน พวกเขาไมเหลือทางเลือกใหเรานอกจากบุกเขาไป แผนการรบและเสนทางโจมตีถูกวางไวแลว เราเพียงแคตองออกคําสั่งโจมตีเทานั้น"
MUN_the_fall_of_the_republic.6.a: "เราเตือนพวกเขาแลว"
MUN_the_fall_of_the_republic.6.a_tt: "ปฏิบัติการนี้จะไมสงผลตอ §Y$HUN_pal_teleki$§! เวนแต[RUT.GetNameDef]จะมีพันธมิตร"
MUN_the_fall_of_the_republic.6.b: "นี่อาจยอนกลับมาทํารายเรา รอไวกอนดีกวา"
MUN_the_fall_of_the_republic.7.t: "[FROM.getname] ยอมตามขอเรียกรองของเรา"
MUN_the_fall_of_the_republic.7.d: "อยางที่ไมมีใครแปลกใจ [FROM.getname]ไดยอมรับขอเรียกรองของเราและพรอมจะถูกผนวกเขากับประเทศของเราเพื่อแลกกับเงื่อนไขเล็กๆ นอยๆ ภูมิภาคเล็กๆ นี้ไมมีโอกาสตอตานชาติที่ทรงพลังอยางเราไดเลย บัดนี้พรมแดนทางเหนือของเราไดรับการปกปองดีกวาเดิม และรัฐบาลก็พอใจอยางยิ่งกับชัยชนะอันงายดายนี้"
MUN_the_fall_of_the_republic.7.a: "ขาวดีเยี่ยม"
#BOP EVENTS#
MUN_czech_bop.1.t: "ความพรอมของกองทัพ"
MUN_czech_bop.1.d: "ความพยายามปฏิรูปในชวงครึ่งแรกของทศวรรษเริ่มออกดอกออกผล ขณะนี้กองทัพของเราเปนหนึ่งในกองทัพที่ทันสมัยที่สุดในยุโรป แตความรูสึกพึงพอใจในตนเองก็เริ่มกอตัวขึ้นในหมูนักการเมืองและผูนํากลุมบริษัทอุตสาหกรรมหลายแหง หากกองทัพของเราจะคงความพรอมสูงสุดไวได เราตองตอสูกับความกังขาที่อาจเกิดขึ้นตอขีดความสามารถในการรบของกองทัพ และกับผูที่พยายามบอนทําลายกองทัพเพื่อผลประโยชนสวนตน"
MUN_czech_bop.1.a: "เราจะพรอม"
MUN_czech_bop.2.t.1: "ภัยคุกคามจากการเสริมกําลังอาวุธของเยอรมนี"
MUN_czech_bop.2.t.2: "การขยายกําลังทหารของประเทศเพื่อนบาน"
MUN_czech_bop.2.d.1: "การที่[GER.getnameDEFcap]เพิ่งนํากําลังทหารกลับเขาไรนลันดไดทําใหผูนําทางทหารและการเมืองบางสวนของเราหวาดหวั่น แมหลายคนจะมีความเชื่อมั่นในพันธมิตรที่ประเทศไดสรางไวและการเตรียมพรอมของกองทัพเพื่อรับมือกับภัยคุกคามจากเยอรมันที่อาจเกิดขึ้น แตบางคนก็ไมมั่นใจนักวาเราจะตานทานภัยคุกคามจาก[GER.GetAdjective]ได"
MUN_czech_bop.2.d.2: "ขาวลาสุดที่วาเพื่อนบานบางประเทศไดเริ่มโครงการขยายกองทัพอยางมหาศาล ทําใหผูนําทางทหารและการเมืองบางสวนของเราหวาดหวั่น หลายคนมีความเชื่อมั่นในพันธมิตรที่ประเทศไดสรางไวกับชาติอื่นและการเตรียมพรอมของกองทัพเพื่อรับมือกับภัยคุกคามจากตางชาติที่อาจเกิดขึ้น แตบางคนก็ไมมั่นใจนักวาเราจะยืนหยัดตานการรุกรานจากตางชาติได"
MUN_czech_bop.2.a: "เราจะเตรียมพรอม"
MUN_czech_bop.2.a_tt: "ความพยายามเสริมกําลังอาวุธของเพื่อนบานทําใหบางคนในกองทัพเริ่มสงสัยในความสามารถของเราที่จะตานทานการรุกรานที่อาจเกิดขึ้น เราตองสรางความมั่นใจใหกองทัพดวยการกระทําของเรา"
MUN_czech_bop.3.t: "[CZE.getname] สงผูสังเกตการณมายังประเทศของเรา"
MUN_czech_bop.3.d: "เมื่อไมนานมานี้ [CZE.getname] ไดสงบุคคลมายังประเทศของเราเพื่อสังเกตการณความขัดแยงที่กําลังดําเนินอยู ในเวลาเดียวกัน ผูผลิตอาวุธเบารายหนึ่งของพวกเขาไดติดตอนักการทูตของเราผานชองทางลับเพื่อสอบถามวาเราสนใจซื้ออาวุธเบาจากพวกเขาหรือไม ซึ่งจะตองลักลอบสงอาวุธเขาประเทศเนื่องจากขอจํากัดที่เราถูกกําหนดไว"
MUN_czech_bop.3.a: "ลองดูวาจะไปทางไหน"
MUN_czech_bop.3.b: "เราไมอาจปลอยใหพวกเขาทําอะไรมากกวาแคสังเกตการณ"
MUN_czech_bop_3_tt: "ผูผลิตปนของ §Y[CZE.getname]§! §Y$CZE_zbrojovka_brno_organization$§! อาจพยายามลักลอบสงปนมาใหเรา"
MUN_czech_bop.4.t: "แผนการของ $CZE_zbrojovka_brno_organization$"
MUN_czech_bop.4.d: "[ETH.getname] ไดติดตอกับผูแทนของผูผลิตอาวุธ $CZE_zbrojovka_brno_organization$ และสนใจจะลักลอบนําปนของเราเขาประเทศ แมสันนิบาตชาติจะควํ่าบาตร[ETH.GetNameDef] แต $CZE_zbrojovka_brno_organization$ ก็พรอมจะดําเนินแผนการนี้ การละเมิดขอกําหนดของสันนิบาตชาติจะทําใหเราเสื่อมความนิยมในเวทีนานาชาติหากถูกจับได"
MUN_czech_bop.4.a: "ลงมือเลย"
MUN_czech_bop.4.b: "ไมคุมกับกระแสตอบโตที่อาจเกิดขึ้น"
CZE_gun_smuggling_tt: "ลักลอบนําอาวุธเขาประเทศ"
CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! ถูกจับได"
CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! ไมถูกจับได"
MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ ตกลงตามแผนการลักลอบ"
MUN_czech_bop.5.d: "หลังจากหารือกับผูแทนรัฐบาลเช็ก $CZE_zbrojovka_brno_organization$ ไดรับไฟเขียวอยางลับๆ ใหเริ่มลักลอบนําอาวุธเบาจํานวนเล็กนอยเขาประเทศ ความเชี่ยวชาญของพวกเขาก็จะพรอมใหเราใชผานชองทางลับของเราดวย"
MUN_czech_bop.5.a: "เราจะใชมันใหเกิดประโยชน"
MUN_czech_bop_5_tt: "§Yผูผลิต§!รายนี้จะถูก§Rลบออก§!หลังสงครามสิ้นสุด"
##SLOVAKIA##
MUN_slovakia_little_war.1.t: "ชัยชนะใน [71.Getname]"
MUN_slovakia_little_war.1.d: "กองทัพของเราแสดงฝมือไดดีใน [71.Getname] ดวยการเอาชนะกองกําลังศัตรูในพื้นที่ ผูบัญชาการของเราไดรับขอมูลและบทเรียนอันลํ้าคาจากการรบที่จะนําไปใชตอไปได"
MUN_slovakia_little_war.1.a: "ทําไดดีมาก"
MUN_slovakia_little_war.2.t: "ความพายแพใน [71.Getname]"
MUN_slovakia_little_war.2.d: "แมเราจะพยายามอยางดีที่สุด กองกําลังของเราก็พายแพใน [71.Getname] การไมสามารถรวบรวมกระสุนและยุทโธปกรณยานยนตไดเพียงพอทันการปะทะเปนปจจัยสําคัญที่ทําใหเราพายแพ แมจะพบความลมเหลวนี้ แตผูบัญชาการที่เกี่ยวของกับการรบก็ไดรับบทเรียนที่สําคัญยิ่ง"
MUN_slovakia_little_war.2.a: "ผลงานนาผิดหวัง"
MUN_slovakia_little_war.3.t: "การปะทะชายแดนใน [71.Getname]"
MUN_slovakia_little_war.3.d: "แมจะไดดินแดนของเราไปใน $GER_first_vienna_award$ แลว  [HUN.getnamedef]ก็ยังตองการปรับพรมแดนกับเราเพิ่มเติมใน [71.getname] เราตองตอบโตความทาทายนี้ดวยกําลังเพื่อแสดงใหเห็นวาเราจะไมยอมเสียดินแดนโดยไมสู"
MUN_slovakia_little_war.3.a: "พวกมันกลาดียังไง!"
MUN_slovakia_little_war.4.t: "ภาวะชะงักงันใน [71.Getname]"
MUN_slovakia_little_war.4.d: "แมเราจะพยายามอยางดีที่สุด กองกําลังของเราก็ไมสามารถเอาชนะการปะทะใน [71.Getname] ได การไมสามารถรวบรวมกระสุนและยุทโธปกรณยานยนตไดเพียงพอทันการปะทะเปนปจจัยสําคัญที่ทําใหเราไมไดชัยชนะ แมจะพบความลมเหลวนี้ แตผูบัญชาการที่เกี่ยวของกับการรบก็ไดรับบทเรียนที่สําคัญยิ่ง"
MUN_slovakia_little_war.4.a: "นาผิดหวัง"
##Exile##
MUN_czech_exile.1.t: "ผูลี้ภัยชาว[CZE.GetAdjective]มาถึง[ROOT.GetNameDef]"
MUN_czech_exile.1.d: "ภายหลังที่[GER.GetNameDef]ยุบประเทศของพวกเขาหลังการประชุมมิวนิก  ผูลี้ภัยชาว[CZE.GetAdjective]ไดเดินทางมาถึงหลายประเทศ รวมถึงประเทศของเรา พวกเขาพรอมจะจับอาวุธเพื่อชวยเรา ดวยความหวังวาวันหนึ่งจะปลดปลอยประเทศของตนไดดวยความชวยเหลือของเรา"
MUN_czech_exile.1.a: "ยินดีตอนรับ"
##NEWS EVENTS##
MUN_czech.news.1.t: "วิกฤตซูเดเทินลันด"
MUN_czech.news.1.desc: "ประชาชนในซูเดเทินลันดไดเริ่มกอกบฏดวยอาวุธตอ[CZE.getnameDef] มีรายงานเขามาวากองกําลังกึ่งทหารเริ่มโจมตีสถานีตํารวจและอาคารของรัฐบาลทั่วภูมิภาค ชนวนเหตุคือขาวลาสุดที่วา [FROM.getname] ตองการผนวกภูมิภาคนี้\n\nการกบฏเหลานี้ดูเหมือนเปนโหมโรงของความขัดแยงครั้งใหญระหวาง [FROM.getname] และ[CZE.GetNameDef] ความขัดแยงที่บัดนี้ดูจะหลีกเลี่ยงไมได"
MUN_czech.news.1.a: "นี่ไมใชลางดีสําหรับยุโรป"
MUN_czech.news.1.b: "ความโกลาหลคือบันได"
MUN_czech.news.1.c: "เราจะตองชนะ!"
MUN_czech.news.1.d: "หวังวาการทูตจะชนะ"
MUN_czech.news.2.t: "[FROM.GetNameDefCap]บุก[RUT.GetNameDef]"
MUN_czech.news.2.desc: "\nทามกลางเหตุการณตอเนื่องที่ตามมาหลังความโกลาหลทางการเมืองใน [CZE.getname] ภูมิภาคเล็กๆ อยาง [RUT.getname] ไดหลุดออกนอกพรมแดนของทุกประเทศ รัฐเล็กๆ ที่แยกตัวนี้จึงประกาศตนเปนชาติเอกราชและเริ่มจัดตั้งกองกําลังติดอาวุธเพื่อพยายามปกปองความเปนรัฐที่เพิ่งไดมา\n\n[FROM.getnamedefcap]หมายตาภูมิภาคนี้มานาน และเมื่อเห็นโอกาสก็บุกรัฐเล็กๆ ที่แยกตัวนี้ทันที ผูสังเกตการณหลายคนเห็นวาชัยชนะเหนือ [RUT.getname] ของพวกเขาเปนเรื่องที่รูผลลวงหนาแลว"
MUN_czech.news.2.a: "คารเพเทียอะไรนะ?"
MUN_czech.news.2.b: "งานนี้งายแน"
MUN_czech.news.2.c: "แนจริงก็เขามา!"
MUN_slovakia.news.1.t: "การปะทะตามชายแดนใน [71.Getname]"
MUN_slovakia.news.1.desc: "แมจะได [664.Getname] คืนมาภายหลัง $GER_first_vienna_award$ แต[HUN.getnamedef]ก็ยังตองการปรับพรมแดนกับ[SLO.getnamedef]เพิ่มเติมใน [71.Getname]\n\nความขัดแยงนี้ดูเหมือนเปนขออางให[HUN.getnamedef]ทดสอบวากองทัพของตนแข็งแกรงเพียงใดเมื่อเทียบกับฝายตรงขามที่ออนแอกวามาก กองทัพอันออนเยาวของ[SLO.getnamedef]อาจยังไมพรอมรับมือกับความทาทายที่อยูตรงหนา"
MUN_slovakia.news.1.a: "เด็กทะเลาะกัน"
MUN_slovakia.news.1.b: "เราพรอมสําหรับภารกิจนี้"