 #### INDUSTRIAL EVENTS ####
 ###########################

 PER_industrial_events.1.t: "[FROM.GetNameDefCap]เสนอสิทธิ์ในทรัพยากร"
 PER_industrial_events.1.desc: "วันนี้รัฐบาล[PER.GetAdjective]เขามาเสนอสิทธิ์ในทรัพยากรนํ้ามันที่พวกเขาเพิ่งไดมาใน$STATE_413$ พื้นที่ดังกลาวอุดมไปดวยทรัพยากรสําคัญนี้ บางทีขอเสนอนี้อาจคุมคาแกการพิจารณา?"
 PER_industrial_events.1.a: "ฟงดูเปนขอตกลงทางธุรกิจที่ดี"
 PER_industrial_events.1.b: "เราไมมีความจําเปนตองใช"

 PER_industrial_events.2.t: "[FROM.GetNameDefCap]ตอบรับขอเสนอการคาของเรา"
 PER_industrial_events.2.desc: "[FROM.GetNameDefCap]ไดกรุณาตอบรับขอเสนอของเราเกี่ยวกับนํ้ามันที่เพิ่งไดมา ซึ่งจะยิ่งขยายจักรวรรดิปโตรเลียมอันกวางใหญของเรา"
 PER_industrial_events.2.a: "ก็แคธุรกิจที่ดี!"
 PER_resource_rights_on_war_tt: "§Rหากเกิดสงครามระหวางสองประเทศ สิทธิ์ในทรัพยากรและโรงงานนอกแผนที่จะถูกยกเลิก!§!"

 PER_industrial_events.3.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอการคาของเรา"
 PER_industrial_events.3.desc: "นาเสียดายที่[FROM.GetNameDef]ปฏิเสธขอตกลงการคานํ้ามัน[PER.GetAdjective]อันใจกวางของเรา บางทีเราควรไปทําธุรกิจที่อื่นดีกวา?"
 PER_industrial_events.3.a: "พวกเขาเสียเองแหละ!"

 #########################
 #### IMPERIAL EVENTS ####
 #########################

 PER_imperial_events.1.t: "[FROM.GetNameDefCap]ตองการเจรจาไมรุกราน"
 PER_imperial_events.1.desc: "เชานี้ ทูตจาก[PER.Capital.GetCapitalVictoryPointName]เดินทางมาถึง[SOU.Capital.GetCapitalVictoryPointName]พรอมขอเสนอจากชาหแหง[PER.GetNameDef]ใหลงนามสนธิสัญญาไมรุกรานเพื่อความปลอดภัยของทั้งสองชาติ ดวยความที่[PER.GetNameDef]อยูใกลพรมแดนทางใตของเรา นี่จึงเปนเรื่องที่เราควรพิจารณา"
 PER_imperial_events.1.a: "เราเห็นดวย นี่เปนทางที่ดีที่สุด"
 PER_imperial_events.1.b: "เราตกลงเรื่องนี้ไมได"

 PER_imperial_events.2.t: "[SOU.GetNameDefCap]ตกลงทําสนธิสัญญาไมรุกราน"
 PER_imperial_events.2.desc: "ขาวดี! นักการทูตของเรากลับจาก[SOU.Capital.GetCapitalVictoryPointName]พรอมขาววา[SOU.GetNameDef]ตองการรวมทําสนธิสัญญาไมรุกรานกับเรา ซึ่งจะทําใหเราวางแผนสงครามตอไปไดโดยไมตองมีพวก[SOU.GetAdjective]จอมยุงเขามาเกี่ยวของ"
 PER_imperial_events.2.a: "ขาวดียิ่งนัก"

 PER_imperial_events.3.t: "[SOU.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 PER_imperial_events.3.desc: "นาเสียดายที่เราไมสามารถโนมนาว[SOU.GetNameDef]ใหลงนามสนธิสัญญาไมรุกรานได หมายความวาเราตองระวังภัยคุกคามจากทางเหนือหากเดินหนาตามแผนขยายดินแดนตอไป"
 PER_imperial_events.3.a: "เหตุการณพลิกผันที่นาเสียดาย..."

 PER_imperial_events.10.t: "[FROM.GetNameDefCap]เรียกรองดินแดนบาลูจิสถาน"
 PER_imperial_events.10.desc: "วันนี้เราไดรับสารจากชาหแหง[PER.GetNameDef] เรียกรองใหเราสละการควบคุมภูมิภาคบาลูจิสถานใหแกพวกเขา ตามที่รัฐบาล[PER.GetAdjective]อาง ดินแดนนี้เปนของพวกเขาโดยสิทธิ์อันศักดิ์สิทธิ์ เราตองระวัง หากยั่วยุพวกเขา พวกเขาอาจประกาศสงครามกับเรา"
 PER_imperial_events.10.a: "เราไมมีทางเลือกนอกจากตองยอมพวกเขา"
 PER_imperial_events.10.b: "บางทีเราอาจใหพวกเขาจายเงินซื้อได?"
 PER_imperial_events.10.c: "ถาจะเอาไป ก็ตองขามศพเราไปกอน"

 PER_imperial_events.11.t: "[FROM.GetNameDefCap]ตกลงสละบาลูจิสถาน"
 PER_imperial_events.11.desc: "ขาวดี [FROM.GetNameDefCap]ตัดสินใจอยางชาญฉลาดที่จะสละดินแดนบาลูจิสถานใหอยูใตการควบคุมของเรา ในที่สุดเราก็มีที่มั่นในภูมิภาคสินธุ"
 PER_imperial_events.11.a: "ทําไดยอดเยี่ยม"

 PER_imperial_events.12.t: "[FROM.GetNameDefCap]เสนอขายบาลูจิสถาน"
 PER_imperial_events.12.desc: "ดูเหมือนวารัฐบาล[RAJ.GetAdjective]ไมกระตือรือรนที่จะปลอยบาลูจิสถานออกจากดินแดนของตนโดยไมไดรับคาชดเชยบางอยาง เราอาจทําตามขอเรียกรองของพวกเขา หรือประกาศสงครามไปเลย ทางเลือกเปนของทาน"
 PER_imperial_events.12.a: "ก็ได ถาจําเปน"
 PER_imperial_events.12.b: "ถาเชนนั้นเราจะยึดมันดวยกําลัง"
 PER_imperial_events.12.c: "ทั้งหมดนี้เสี่ยงเกินไป ยกเลิกการเจรจา"

 PER_imperial_events.13.t: "[FROM.GetNameDefCap]ตกลงซื้อบาลูจิสถาน"
 PER_imperial_events.13.desc: "ขาวดียิ่ง! ชาหแหง[PER.GetNameDef]ตกลงจายเงินใหเราเพื่อแลกกับการโอนบาลูจิสถานไปอยูใตการควบคุมของพวกเขา เราอาจเสียดินแดนไปเล็กนอย แตเงินนี้จะชวยความพยายามของเราเอง"
 PER_imperial_events.13.a: "วิเศษมาก!"

 PER_imperial_events.14.t: "[FROM.GetNameDefCap]ขูจะทําสงคราม"
 PER_imperial_events.14.desc: "เกรงวาการเดิมพันของเราจะไมไดผล เพราะเมื่อไดรับหนังสือของเรา ชาหแหง[PER.GetNameDef]ก็ขูจะทําสงครามกับชาติของเราอยางเปนทางการ ทหารของพวกเขากําลังเตรียมบุกสินธุและยึดสิ่งที่ตองการดวยกําลัง นับเปนสถานการณที่นาเศรา"
 PER_imperial_events.14.a: "รวบรวมกําลังทหารของเรา!"

 PER_imperial_events.15.t: "[FROM.GetNameDefCap]ถอยกลับ"
 PER_imperial_events.15.desc: "ดูเหมือนวา[PER.GetNameDef]ตัดสินใจแลววาการพยายามใชกําลังแยงภูมิภาคบาลูจิสถานไปจากเรานั้นไมคุมเสี่ยง อยางนอยเราก็มีสันติภาพไดในตอนนี้"
 PER_imperial_events.15.a: "ขอบคุณพระเจา"

 PER_imperial_events.16.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะสละบาลูจิสถาน"
 PER_imperial_events.16.desc: "ดูเหมือนวารัฐบาล[RAJ.GetAdjective]ปฏิเสธอยางไมไยดีที่จะยอมสละดินแดนบาลูจิสถาน ถึงเวลาที่เราจะยืนหยัดตามที่ลั่นวาจาไวและประกาศสงครามกับ[RAJ.GetNameDef]!"
 PER_imperial_events.16.a: "ถาเชนนั้นก็สงคราม"

 PER_imperial_events.20.t: "เรซา ชาห ปาหลาวี ถูกลอบสังหาร!"
 PER_imperial_events.20.desc: "เสียงปนดังขึ้นกลางกรุงเตหะรานบายวันนี้ ระหวางที่เรซา ชาห ปาหลาวี กําลังกลาวสุนทรพจนตอประชาชน พระองคถูกกระสุนและอาการสาหัส แมหนวยปฐมพยาบาลจะพยายามอยางสุดความสามารถ แตนาเศราที่ชาหสวรรคตจากพระอาการบาดเจ็บ ผูกอเหตุถูกเปดเผยวาเปนนายทหารในกองทัพ[PER.GetAdjective]ที่ไมเห็นดวยกับการนําของชาห โมฮัมหมัด เรซา ปาหลาวี พระราชโอรสของเรซา ชาห ปาหลาวี มีกําหนดจะขึ้นครองราชยเปนชาหองคใหมแหง[PER.GetNameDef] ขอใหรัชสมัยของพระองควุนวายนอยกวานี้"
 PER_imperial_events.20.a: "วันอันนาเศราของ[PER.GetNameDef]..."

 PER_imperial_events.30.t: "การเฉลิมฉลองจักรวรรดิเปอรเซีย"
 PER_imperial_events.30.desc: "เพื่อเฉลิมฉลองการสถาปนาจักรวรรดิอะคีเมนิดโบราณโดยพระเจาไซรัสมหาราช ชาหแหง[PER.GetNameDef]ไดจัดงานอันหรูหราตระการตาเพื่อเชิดชูอารยธรรมและประวัติศาสตรอันเกาแกของ[PER.GetNonIdeologyName] พรอมทั้งแสดงความกาวหนารวมสมัยภายใตการปกครองของพระองค ผูนําคนสําคัญจากชาติมหาอํานาจทั่วโลกไดรับเชิญมารวมงานเฉลิมฉลอง แตความไมพอใจก็แพรกระจายอยางรวดเร็วในหมูคนยากจนใน[PER.GetNameDef] ซึ่งเห็นวางานนี้เปนการสิ้นเปลืองเงิน อยางไรก็ตาม แขกทุกคนตางมีชวงเวลาที่วิเศษ ไดลิ้มรสอาหารชั้นเลิศและชมขบวนพาเหรดทางทหารอันยิ่งใหญ"
 PER_imperial_events.30.a: "ชางเปนชวงเวลาที่วิเศษเหลือเกิน!"

 PER_imperial_events.40.t: "การเลือกชาหบานู"
 PER_imperial_events.40.desc: "ในชวงที่เตรียมพระองคเพื่อขึ้นเปนชาหในที่สุด โมฮัมหมัด เรซา ปาหลาวี มีโอกาสมากมายในการแสวงหาความรัก มีสตรีสามคนที่ตองตาพระองค แตมีเพียงคนเดียวที่จะไดรับการสวมมงกุฎเปนชาหบานูและปกครองเคียงขางพระองคในฐานะผูสําเร็จราชการแหง[PER.GetNameDef] ไดแก เฟาซียะหแหงอียิปต เจาหญิงธิดาของสุลตาน อีราน เตยมูรตาช รักแรกของชาห และอีรานดุคท อดีตเจาหญิงราชวงศกาจารที่พบกับชาหในสวิตเซอรแลนด"
 PER_imperial_events.40.a: "ชาหจะอภิเษกสมรสกับเฟาซียะหแหงอียิปต"
 PER_imperial_events.40.b: "ชาหจะอภิเษกสมรสกับอีราน เตยมูรตาช"
 PER_imperial_events.40.c: "ชาหจะอภิเษกสมรสกับอีรานดุคท กาจาร"

 PER_imperial_events.50.t: "เรซา ชาห ปาหลาวี รอดจากการลอบสังหาร!"
 PER_imperial_events.50.desc: "เสียงปนดังขึ้นกลางกรุงเตหะรานบายวันนี้ ระหวางที่เรซา ชาห ปาหลาวี กําลังกลาวสุนทรพจนตอประชาชน พระองคเกือบถูกกระสุนในการลอบสังหารที่ลมเหลว ผูกอเหตุถูกจับกุมไดทันทีและถูกเปดเผยวาเปนนายทหารในกองทัพ[PER.GetAdjective]ที่ไมเห็นดวยกับการนําของชาห ชาหไดใชเหตุลอบปลงพระชนมครั้งนี้เปนโอกาสปลุกระดมประชาชนใหสนับสนุนพระองค"
 PER_imperial_events.50.a: "ขอบคุณพระเจา!" 

 PER_imperial_events.60.t: "[FROM.GetNameDefCap]ตองการเจรจาไมรุกราน"
 PER_imperial_events.60.desc: "เชานี้ ทูตจาก[PER.Capital.GetCapitalVictoryPointName]เดินทางมาถึง[GER.Capital.GetCapitalVictoryPointName]พรอมขอเสนอจากชาหแหง[PER.GetNameDef]ใหลงนามสนธิสัญญาไมรุกรานเพื่อความปลอดภัยของทั้งสองชาติ ดวยความที่[PER.GetNameDef]ผลิตทรัพยากรสําคัญอยางนํ้ามันไดมหาศาล นี่จึงเปนเรื่องที่เราควรพิจารณา"
 PER_imperial_events.60.a: "เราเห็นดวย นี่เปนทางที่ดีที่สุด"
 PER_imperial_events.60.b: "เราตกลงเรื่องนี้ไมได"

 PER_imperial_events.61.t: "[GER.GetNameDefCap]ตกลงทําสนธิสัญญาไมรุกราน"
 PER_imperial_events.61.desc: "ขาวดี! นักการทูตของเรากลับจาก[GER.Capital.GetCapitalVictoryPointName]พรอมขาววา[GER.GetNameDef]ตองการรวมทําสนธิสัญญาไมรุกรานกับเรา เมื่อพิจารณาเปาหมายของ[GER.GetNameDef]แลว นี่คือสิ่งที่ดีที่สุดที่เราจะทําไดเพื่อรับประกันความปลอดภัยของประเทศ"
 PER_imperial_events.61.a: "ขาวดียิ่งนัก"

 PER_imperial_events.62.t: "[GER.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 PER_imperial_events.62.desc: "นาเสียดายที่เราไมสามารถโนมนาว[GER.GetNameDef]ใหลงนามสนธิสัญญาไมรุกรานได เปนเรื่องนาเสียดาย แตก็อาจยังเปดโอกาสใหเราเขารวมฝายของพวกเขาไดในอนาคต"
 PER_imperial_events.62.a: "เหตุการณพลิกผันที่นาเสียดาย..." 

 PER_imperial_events.70.t: "เรซา ชาห ปาหลาวี ประสงคจะเยือน[GER.GetNameDef]"
 PER_imperial_events.70.desc: "เชานี้เราไดรับจดหมายที่สงตรงมาจากพระราชวังซาดาบาดในเตหะราน [PER.GetNameDef] เปนสารแสดงไมตรีจากเรซา ชาห ปาหลาวี เอง ซึ่งแสดงความสนพระทัยจะเยือนเบอรลินดวยหวังจะกระชับความสัมพันธระหวางสองชาติ ทานผูนํากระตือรือรนที่จะรักษาความสัมพันธอันดีกับ[PER.GetNameDef]ไว เราควรทําอยางไร?"
 PER_imperial_events.70.a: "ขอเสนอที่นายินดี สงคําเชิญไป"
 PER_imperial_events.70.b: "เราไมมีเวลาสําหรับเรื่องไรสาระเชนนี้"

 PER_imperial_events.71.t: "[GER.GetNameDefCap]สงคําเชิญใหไปเยือน"
 PER_imperial_events.71.desc: "เพื่อตอบจดหมายแสดงไมตรีที่เราสงถึง[GER.GetNameDef] [GER.GetLeader]แสดงความสนใจที่จะใหเราไปเยือนเบอรลินดวยหวังจะกระชับความสัมพันธระหวางสองชาติ การเดินทางครั้งนี้ตองสั้น เพราะเรามีภารกิจมากมายรออยูที่เตหะราน แตก็คุมคาที่จะรักษา[GER.GetNameDef]ไวเปนพวก ในสถานการณโลกที่ตึงเครียดเชนนี้"
 PER_imperial_events.71.a: "ไดยินวาประตูบรันเดินบวรคงดงามมากในชวงนี้ของป!"

 PER_imperial_events.72.t: "[GER.GetNameDefCap]ไมวางตอนรับ"
 PER_imperial_events.72.desc: "เพื่อตอบจดหมายแสดงไมตรีที่เราสงถึง[GER.GetNameDef] นาเสียดายที่[GER.GetLeader]ปฏิเสธขอเสนอของเราที่จะไปเยือนเบอรลิน เปนเรื่องนาเสียดาย เพราะนี่อาจเปนโอกาสดีที่จะไดใกลชิดกับผูนําผูทรงอํานาจ แตนาเสียดายที่ไมเปนดังหวัง"
 PER_imperial_events.72.a: "เอาเถอะ กลับไปทํางานตอดีกวา"

 PER_imperial_events.80.t: "สถานการณใน[PER.GetNameDef]"
 PER_imperial_events.80.desc: "นาเสียดายที่การรุกลาสุดของกองทัพ[PER.GetAdjective]ทําใหฝายเราสูญเสียอยางหนัก โดยเฉพาะเมื่อพวกเขาเขาควบคุมภูมิภาคหลายแหงของเรา สถานการณใน[PER.GetNameDef]พัฒนาไปในทางที่ไมเปนผลดีตอเรา และเราอาจตองพิจารณาจํากัดความสูญเสียและถอนทหารออกจากภูมิภาค อยางไรก็ตาม การนี้จะทําใหเราตองยกดินแดนบางสวนที่เสียไปใหแกชาว[PER.GetAdjective]"
 PER_imperial_events.80.a: "เรามีปญหาใหญกวาที่อื่น ถอนทหารของเรา"
 PER_imperial_events.80.b: "ไม! เราตองรุกตอไป!"

 PER_imperial_events.100.t: "สนธิสัญญาเตหะราน"
 PER_imperial_events.100.desc: "หลังจากผลักดันผูรุกรานออกไปและไลตอนพวกเขากลับเขาไปในดินแดนของตนได เราก็สามารถติดตอศัตรูเพื่อเชิญนักการทูตของพวกเขามาเตหะรานเพื่อเริ่มการเจรจาสันติภาพ โชคดีที่พวกเขาตอบรับขอเสนอ และหลังการหารือหลายชั่วโมง เราไดตกลงกันวาพวกเขาจะยุติการโจมตี[PER.GetNameDef] และยกดินแดนชายแดนของตนใหเปนการชดใช"
 PER_imperial_events.100.a: "ขอใหพวกเขาไมคิดโจมตีอีกเลย"

 PER_imperial_events.101.t: "การเจรจาลมเหลว"
 PER_imperial_events.101.desc: "หลังจากผลักดันผูรุกรานออกไปและไลตอนพวกเขากลับเขาไปในดินแดนของตนได เราก็สามารถติดตอศัตรูเพื่อเชิญนักการทูตของพวกเขามาเตหะรานเพื่อเริ่มการเจรจาสันติภาพ นาเสียดายที่พวกเขาไมตอบรับการเจรจาสันติภาพของเรา และผลก็คือสงครามยังคงดําเนินตอไป"
 PER_imperial_events.101.a: "เราจะรุกไลพวกเขาไปถึงเมืองหลวง!"

 PER_imperial_events.110.t: "$PER_imperial_events.80.t$"
 PER_imperial_events.110.desc: "$PER_imperial_events.80.desc$"
 PER_imperial_events.110.a: "$PER_imperial_events.80.a$"
 PER_imperial_events.110.b: "$PER_imperial_events.80.b$"

 PER_imperial_events.111.t: "รักษารัฐกันชนของเรา"
 PER_imperial_events.111.desc: "หลังจากผลักดันชาว[SOV.GetAdjective]ออกไปและไลตอนพวกเขากลับเขาไปในดินแดนของตนได เราก็สามารถติดตอศัตรูเพื่อเชิญนักการทูตของพวกเขามาเตหะรานเพื่อเริ่มการเจรจาสันติภาพ โชคดีที่พวกเขาตอบรับขอเสนอ และหลังการหารือหลายชั่วโมง เราไดตกลงกันวาพวกเขาจะยกดินแดนชายแดนของตนให เปนการประนีประนอมแทนการทําสงครามยืดเยื้อ"
 PER_imperial_events.111.a: "แผนของเราไดผล!"

 PER_imperial_events.112.t: "การเจรจาลมเหลว"
 PER_imperial_events.112.desc: "หลังจากผลักดันชาว[SOV.GetAdjective]ออกไปและไลตอนพวกเขากลับเขาไปในดินแดนของตนได เราก็สามารถติดตอศัตรูเพื่อเชิญนักการทูตของพวกเขามาเตหะรานเพื่อเริ่มการเจรจาสันติภาพ นาเสียดายที่พวกเขาไมตอบรับการเจรจาสันติภาพของเรา และผลก็คือสงครามยังคงดําเนินตอไป"
 PER_imperial_events.112.a: "เราจะรุกไลพวกเขาไปถึงเมืองหลวง!"

 PER_imperial_events.120.t: "[PER.GetNameDefCap]เจรจาขอยอมแพ"
 PER_imperial_events.120.desc: "เชานี้เราไดรับขาวจากรัฐบาล[PER.GetAdjective]วาตั้งใจจะยอมแพและเริ่มกระบวนการยอมจํานน โดยพวกเขายินยอมใหเรายึดครองดินแดนของพวกเขา ขณะที่ยังคงระบอบกษัตริยไวในฐานะผูนําหุนเชิด เราจะตอบอยางไร?"
 PER_imperial_events.120.a: "ได ฟงดูยอมรับได"
 PER_imperial_events.120.b: "ไมมีทาง รุกตอไปถึงเมืองหลวง"

 PER_imperial_events.121.t: "[ENG.GetNameDefCap]ยอมรับขอเสนอของเรา"
 PER_imperial_events.121.desc: "โชคดีที่รัฐบาล[ENG.GetAdjective]ตกลงใหเราบริหาร[PER.GetNameDef]ตอไปภายใตการจับตาของพวกเขา หวังวาสิ่งนี้จะยุติการนองเลือดและความตายลงได"
 PER_imperial_events.121.a: "โลงอกไปที..."

 PER_imperial_events.122.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 PER_imperial_events.122.desc: "นาเสียดายที่รัฐบาล[ENG.GetAdjective]ปฏิเสธขอเสนอยอมแพของเรา หมายความวาเราตองสูรบตอไป แตหากเราพายแพ ก็เปนไปไดสูงวาเราจะตองยอมแพตามเงื่อนไขของพวกเขา"
 PER_imperial_events.122.a: "ชางเปนยุคมืดเสียจริง..."

 PER_imperial_events.130.t: "[PER.GetNameDefCap]เจรจาขอยอมแพ"
 PER_imperial_events.130.desc: "เชานี้เราไดรับขาวจากรัฐบาล[PER.GetAdjective]วาตั้งใจจะยอมแพและเริ่มกระบวนการยอมจํานน โดยพวกเขายินยอมยกดินแดนทางเหนือใหเราและใหผนวกเขากับดินแดนของเรา เราควรทําอยางไร?"
 PER_imperial_events.130.a: "ได ฟงดูยอมรับได"
 PER_imperial_events.130.b: "ไมมีทาง รุกตอไปถึงเมืองหลวง"

 PER_imperial_events.131.t: "[SOU.GetNameDefCap]ยอมรับขอเสนอของเรา"
 PER_imperial_events.131.desc: "โชคดีที่รัฐบาล[SOU.GetAdjective]ตกลงตามขอเสนอของเรา เราอาจเสียดินแดนทางเหนือไป แตอยางนอยเราก็หยุดการรุกคืบของกองทัพ[SOU.GetAdjective]ไวได..."
 PER_imperial_events.131.a: "โลงอกไปที..."

 PER_imperial_events.132.t: "[SOU.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 PER_imperial_events.132.desc: "นาเสียดายที่รัฐบาล[SOU.GetAdjective]ปฏิเสธขอเสนอยอมแพของเรา หมายความวาเราตองสูรบตอไป แตหากเราพายแพ ก็เปนไปไดสูงวาเราจะตองยอมแพตามเงื่อนไขของพวกเขา"
 PER_imperial_events.132.a: "ชางเปนยุคมืดเสียจริง..."

 PER_imperial_events.140.t: "[FROM.GetNameDefCap]ประกาศเอกราช"
 PER_imperial_events.140.desc: "[FROM.GetLeader]ประกาศวา[FROM.GetNameDef]จะไมยอมรับการเปนเจาเหนือหัวของ[ROOT.GetAdjective]อีกตอไป [FROM.GetNameDefCap]ตองการรักษาความสัมพันธอันดีกับ[ROOT.GetNameDef]หากเปนไปได แต[FROM.GetLeader]ระบุวาพวกเขาพรอมจับอาวุธตอสูเพื่อเอกราชหากจําเปน"
 PER_imperial_events.140.a: "พวกเขาตองไดรับบทเรียน"
 PER_imperial_events.140.b: "เรามีเรื่องสําคัญกวานี้ตองคิด"

 PER_imperial_events.142.t: "เกียรติภูมิของ[PER.GetAdjective]ไดรับการฟนฟู"
 PER_imperial_events.142.desc: "ในความพลิกผันที่นาประหลาดใจ [FROM.GetLeader]ยอมรับการประกาศเอกราชของ[ROOT.GetAdjective] นับจากนี้ไป [FROM.GetNameDef]จะไมมีอิทธิพลใด ๆ เหนือการเมืองของ[ROOT.GetAdjective] ทั้งภายในและภายนอก ฝูงชนมหาศาลที่เฉลิมฉลองการนําของ[ROOT.GetLeader]ไดมารวมตัวกันที่จัตุรัสใหญของ[ROOT.Capital.GetCapitalVictoryPointName]"
 PER_imperial_events.142.a: "แอกไดถูกปลดออกแลว"

 PER_imperial_events.141.t: "การตอสูเริ่มตนอีกครั้ง"
 PER_imperial_events.141.desc: "ตามคาด [FROM.getLeader]ปฏิเสธคําขอเอกราชอยางเปนทางการจาก[ROOT.GetLeader] เนื่องจากเปนสิ่งที่คาดการณไวแลว กองทัพ[ROOT.GetAdjective]จึงกําลังยึดจุดยุทธศาสตรสําคัญในประเทศ ครั้งนี้ชาติของเราเตรียมพรอมไดดีกวามาก"
 PER_imperial_events.141.a: "อาซาดี! เราจะสูจนคนสุดทาย!"

 PER_imperial_events.150.t: "[FROM.GetNameDefCap]เรียกรองสันติภาพโดยไมมีเงื่อนไข"
 PER_imperial_events.150.desc: "ขณะที่สงครามดําเนินไป เราไมสามารถบรรลุเปาหมายไดภายในเวลาที่กําหนด ดวยเหตุนี้ เมื่อไมนานมานี้เราจึงไดรับขาวจากรัฐบาล[FROM.GetAdjective]ที่เรียกรองใหยุติการสูรบ เราอาจรุกตอไปได แตก็ตองคํานึงถึงความสูญเสียของเราเองดวย"
 PER_imperial_events.150.a: "สถานการณไมเปนใจใหเรา..."
 PER_imperial_events.150.b: "เราตองรุกตอไป! เราจะชนะ!"

 PER_imperial_events.151.t: "[FROM.GetNameDefCap]ถอนกําลัง"
 PER_imperial_events.151.desc: "ขาวดี! [FROM.GetNameDefCap]ตกลงตามขอเรียกรองสันติภาพของเรา และเริ่มถอนทหารออกจากพรมแดนของเราแลว เราสูรบอยางยาวนานและหนักหนวงเพื่อสกัดพวกเขาไว และนี่คือวันที่ควรไดรับการเฉลิมฉลองไปอีกหลายป!"
 PER_imperial_events.151.a: "นี่ถือเปนชัยชนะ!"

 PER_imperial_events.152.t: "[FROM.GetNameDefCap]ไมยอมลดละ"
 PER_imperial_events.152.desc: "วันนี้เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกเขามาในดินแดนของเราตอไป แมจะสูญเสียและแมเราจะเรียกรองสันติภาพแลวก็ตาม หากพวกเขาตองการการตอสู ก็จะไดการตอสู"
 PER_imperial_events.152.a: "พวกเขาจะเสียใจที่ไมควาโอกาสถอนตัว!"

 PER_imperial_events.153.t: "[FROM.GetNameDefCap]เรียกรองสันติภาพ"
 PER_imperial_events.153.desc: "เชานี้เราไดรับขาวจากคณะรัฐมนตรีสงครามวา พันธมิตรของเราที่นําการรุกตอ[PER.GetNameDef]เรียกรองใหเรายุติการสูรบระหวางรอการเจรจาสันติภาพกับศัตรู เนื่องจากเราเขารวมความขัดแยงเพื่อชวยรัฐบาล[FROM.GetAdjective] การสูรบตอไปจึงไมมีเหตุผล"
 PER_imperial_events.153.a: "ถอนทหารทั้งหมดทันที"

 PER_imperial_events.160.t: "[FROM.GetNameDefCap]เรียกรองใหเรายอมแพ"
 PER_imperial_events.160.desc: "ขณะที่สงครามดําเนินไป เราไมสามารถบรรลุเปาหมายไดภายในเวลาที่กําหนด อันที่จริง ฝายที่เราพยายามรุกรานกลับผลักดันเราถอยกลับเขามาในดินแดนของเราเอง ดวยเหตุนี้ เมื่อไมนานมานี้เราจึงไดรับขาวจากรัฐบาล[FROM.GetAdjective]ที่เรียกรองใหยุติการสูรบ หากเรายอมแพ [PER.GetNameDef]เรียกรองใหเรายกดินแดนชายแดนใหเปนคาปฏิกรรมสงคราม เราอาจรุกตอไปได แตก็ตองคํานึงถึงความสูญเสียของเราเองดวย"
 PER_imperial_events.160.a: "สถานการณไมเปนใจใหเรา..."
 PER_imperial_events.160.b: "เราตองรุกตอไป! เราจะชนะ!"

 PER_imperial_events.161.t: "[FROM.GetNameDefCap]ถอนกําลัง"
 PER_imperial_events.161.desc: "ขาวดี! [FROM.GetNameDefCap]ตกลงตามขอเรียกรองสันติภาพของเรา และเริ่มถอนทหารออกจากพรมแดนของเราแลว พวกเขายังเริ่มรางกระบวนการยกดินแดนชายแดนที่ติดกับเราใหแกเราดวย เราสูรบอยางยาวนานและหนักหนวงเพื่อสกัดพวกเขาไว และนี่คือวันที่ควรไดรับการเฉลิมฉลองไปอีกหลายป!"
 PER_imperial_events.161.a: "นี่ถือเปนชัยชนะ!"

 PER_imperial_events.162.t: "[FROM.GetNameDefCap]ไมยอมลดละ"
 PER_imperial_events.162.desc: "วันนี้เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกเขามาในดินแดนของเราตอไป แมจะสูญเสียและแมเราจะเรียกรองสันติภาพแลวก็ตาม การที่พวกเขาไมยอมชดใชความผิดที่กอไวเปนการดูหมิ่นทุกสิ่งที่เกิดขึ้นที่นี่ หากพวกเขาตองการการตอสู ก็จะไดการตอสู"
 PER_imperial_events.162.a: "พวกเขาจะเสียใจที่ไมควาโอกาสถอนตัว!"

 PER_imperial_events.170.t: "[FROM.GetNameDefCap]เรียกรองใหเรายอมแพ"
 PER_imperial_events.170.desc: "ขณะที่สงครามดําเนินไป เราไมสามารถบรรลุเปาหมายไดภายในเวลาที่กําหนด อันที่จริง ฝายที่เราพยายามรุกรานกลับผลักดันเราถอยกลับเขามาในดินแดนของเราเอง ดวยเหตุนี้ เมื่อไมนานมานี้เราจึงไดรับขาวจากรัฐบาล[FROM.GetAdjective]ที่เรียกรองใหยุติการสูรบ หากเรายอมแพ เรานาจะตองลําบากไปอีกหลายประหวางชดใชคาปฏิกรรมสงคราม เราอาจรุกตอไปได แตก็ตองคํานึงถึงความสูญเสียของเราเองดวย"
 PER_imperial_events.170.a: "สถานการณไมเปนใจใหเรา..."
 PER_imperial_events.170.b: "เราตองรุกตอไป! เราจะชนะ!"

 PER_imperial_events.171.t: "[FROM.GetNameDefCap]ถอนกําลัง"
 PER_imperial_events.171.desc: "ขาวดี! [FROM.GetNameDefCap]ตกลงตามขอเรียกรองสันติภาพของเรา และเริ่มถอนทหารออกจากพรมแดนของเราแลว ความผิดที่พวกเขากอไวในสงครามครั้งนี้ทําใหเราเรียกคาปฏิกรรมสงครามจากการรุกรานได เราสูรบอยางยาวนานและหนักหนวงเพื่อสกัดพวกเขาไว และนี่คือวันที่ควรไดรับการเฉลิมฉลองไปอีกหลายป!"
 PER_imperial_events.171.a: "นี่ถือเปนชัยชนะ!"

 PER_imperial_events.172.t: "$PER_imperial_events.162.t$"
 PER_imperial_events.172.desc: "$PER_imperial_events.162.desc$"
 PER_imperial_events.172.a: "$PER_imperial_events.162.a$"

 PER_imperial_events.180.t: "[FROM.GetNameDefCap]เสนอสาบานความภักดี"
 PER_imperial_events.180.desc: "เชานี้เราไดรับขาวจากรัฐบาล[PER.GetAdjective]พรอมขอเสนอใหยุติการสูรบ โดยแลกกับการยอมใหตนถูกปกครองเปนรัฐหุนเชิดภายใตการดูแลของเรา การนี้จะยุติสงครามไดอยางรวดเร็ว และทําใหเรามุงความสนใจไปที่เปาหมายที่ใหญกวาได"
 PER_imperial_events.180.a: "เปนผลดีตอทุกฝาย"
 PER_imperial_events.180.b: "นี่ไมใชทางเลือก ทําสงครามตอไป"

 PER_imperial_events.181.t: "[FROM.GetNameDefCap]ตกลงตามเงื่อนไขของเรา"
 PER_imperial_events.181.desc: "ดูเหมือนวาฝาย[FROM.GetAdjective]ไดตกลงตามขอเสนอของเรา และเริ่มรางเงื่อนไขการยอมแพของเราแลว แมนี่จะไมใชสถานการณที่ดีที่สุด แตเราจะรักษาชีวิตผูคนนับไมถวนไวไดดวยการยอมอยูใตแอกของ[FROM.GetNameDef]"
 PER_imperial_events.181.a: "ชัยชนะที่ตองแลกดวยราคาแพง แตก็ดีที่สุดเทาที่เรามี"

 PER_imperial_events.182.t: "[FROM.GetNameDefCap]ปฏิเสธเงื่อนไขของเรา"
 PER_imperial_events.182.desc: "วันนี้เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกเขามาในดินแดนของเราตอไป แมจะสูญเสียและแมเราจะเรียกรองสันติภาพแลวก็ตาม การที่พวกเขาไมยอมใหเรายุติสงครามดวยชัยชนะของพวกเขาเปนเรื่องนาผิดหวัง และเราไมมีทางเลือกนอกจากตองสูตอไป"
 PER_imperial_events.182.a: "นาเสียดาย..."

 PER_imperial_events.190.t: "[FROM.GetNameDefCap]ตองการเจรจาเงื่อนไขการยอมแพ"
 PER_imperial_events.190.desc: "เชานี้เราไดรับขาวจากรัฐบาล[PER.GetAdjective]พรอมขอเสนอใหยุติการสูรบ โดยแลกกับการเปดใหฝายของเราเขาถึงทรัพยากรธรรมชาติจํานวนมหาศาลของพวกเขา การนี้จะยุติสงครามไดอยางรวดเร็ว และทําใหเรามุงความสนใจไปที่เปาหมายที่ใหญกวาได ไมเพียงเทานั้น เรายังจะอยูในฐานะที่ดีที่จะดําเนินความพยายามในสงครามครั้งตอ ๆ ไปดวยสัมปทานนํ้ามันของพวกเขา"
 #PER_imperial_events.190.desc: "[GetROOTMainInvaderOrNot190]"
 MainInvader190: "เชานี้ เราไดรับขาวจากรัฐบาล[PER.GetAdjective]ซึ่งเสนอใหยุติการสูรบ และเปนการตอบแทน พวกเขาจะยอมใหเราเขาถึงทรัพยากรธรรมชาติจํานวนมหาศาลของพวกเขา ขอเสนอนี้จะทําใหสงครามจบลงอยางรวดเร็ว และเปดโอกาสใหเรามุงไปสูเปาหมายที่ยิ่งใหญกวาได ไมเพียงเทานั้น สัมปทานนํ้ามันของพวกเขายังจะทําใหเราอยูในฐานะที่ดีสําหรับการทําสงครามในอนาคตอีกดวย"
 NotMainInvader190: "เชานี้ เราไดรับขาวจากรัฐบาล[PER.GetAdjective]ซึ่งเสนอใหยุติการสูรบ แมจะไมมีผลประโยชนหรือคาชดเชยใดตอบแทนเราในทันที แตขอเสนอนี้จะทําใหสงครามจบลงอยางรวดเร็ว และเปดโอกาสใหเรามุงไปสูเปาหมายที่ยิ่งใหญกวาได"
 PER_imperial_events.190.a: "เรายอมรับเงื่อนไขเหลานี้ได"
 PER_imperial_events.190.b: "ขอเสนอนี้ไมเปนผลดีตอเรา สูตอไป"

 PER_imperial_events.191.t: "[FROM.GetNameDefCap]ยอมรับเงื่อนไขของเรา"
 PER_imperial_events.191.desc: "ดูเหมือนวาฝาย[FROM.GetAdjective]ไดยอมรับขอเสนอของเรา และเริ่มรางเงื่อนไขการยอมแพของเราแลว นั่นหมายความวาเราจะตองสูญเสียทรัพยากรธรรมชาติไปบางสวน แตก็ยังดีกวาการตกเปนรัฐในอารักขาภายใตการควบคุมของ[FROM.GetNameDef]โดยสมบูรณอยูมาก"
 #PER_imperial_events.191.desc: "[GetROOTMainInvaderOrNot191]"
 MainInvader191: "ดูเหมือนวาฝาย[FROM.GetAdjective]ไดยอมรับขอเสนอของเรา และเริ่มรางเงื่อนไขการยอมแพของเราแลว นั่นหมายความวาเราจะตองสูญเสียทรัพยากรธรรมชาติไปบางสวน แตก็ยังดีกวาการตกเปนรัฐในอารักขาภายใตการควบคุมของ[FROM.GetNameDef]โดยสมบูรณอยูมาก"
 NotMainInvader191: "ดูเหมือนวาฝาย[FROM.GetAdjective]ไดยอมรับขอเสนอของเรา และเริ่มรางเงื่อนไขการยอมแพของเราแลว เราเคยหวังวาเรื่องจะไมตองลงเอยเชนนี้ แตเมื่อพิจารณาจากสถานการณแลว ผลลัพธนี้ก็ดีที่สุดเทาที่จะเปนไปได"
 PER_imperial_events.191.a: "นี่คือสิ่งที่ดีที่สุดที่เราทําไดเพื่อ[PER.GetNameDef]"

 PER_imperial_events.192.t: "[FROM.GetNameDefCap]ปฏิเสธเงื่อนไขของเรา"
 PER_imperial_events.192.desc: "นี่เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกคืบเขามาในดินแดนของเราตอไป ทั้งที่พวกเขาสูญเสียอยางหนักและทั้งที่เราเรียกรองสันติภาพ การที่พวกเขาไมยอมใหเรายุติสงครามและมอบทรัพยากรของเราใหนั้นนาผิดหวัง และเราไมมีทางเลือกอื่นนอกจากตองสูตอไป"
 #PER_imperial_events.192.desc: "[GetROOTMainInvaderOrNot192]"
 MainInvader192: "นี่เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกคืบเขามาในดินแดนของเราตอไป ทั้งที่พวกเขาสูญเสียอยางหนักและทั้งที่เราเรียกรองสันติภาพ การที่พวกเขาไมยอมใหเรายุติสงครามและมอบทรัพยากรของเราใหนั้นนาผิดหวัง และเราไมมีทางเลือกอื่นนอกจากตองสูตอไป"
 NotMainInvader192: "นี่เปนวันอันมืดมน ศัตรูของเราตัดสินใจรุกคืบเขามาในดินแดนของเราตอไป ทั้งที่พวกเขาสูญเสียอยางหนักและทั้งที่เราเรียกรองสันติภาพ การที่พวกเขาไมยอมใหเรายุติสงครามนั้นนาผิดหวัง และตอนนี้เราไมมีทางเลือกอื่นนอกจากตองสูตอไป"
 PER_imperial_events.192.a: "นาเสียดายจริง..."

 PER_imperial_events.200.t: "กติกาสัญญาซาดาบาด"
 PER_imperial_events.200.desc: "[SSB_leader.GetLeader]ไดเขาหา[ROOT.GetLeader]พรอมขอเสนอใหลงนามในสนธิสัญญาไมรุกรานซึ่งกันและกัน โดยเปดทางสําหรับความรวมมือที่มากขึ้นในอนาคต คณะทูต[event_target:SSB_leader.GetAdjective]ทุมเทอยางหนักในการนําเสนอ โดยกลาวถึงประวัติศาสตรและผลประโยชนรวมกันของสองชาติอยางละเอียด ตามดวยการวิงวอนอยางจริงใจเพื่อสันติภาพระหวางชาติพี่นอง การเจรจาตอรองที่ผานมาเปนไปอยางราบรื่น แตทายที่สุดแลว การตัดสินใจวาจะลงนามหรือไมก็ขึ้นอยูกับเรา"
 PER_imperial_events.200.a: "แนนอน เราจะลงนามในกติกาสัญญาแหงมิตรภาพนี้!"
 PER_imperial_events.200.b: "เราไมใชพี่นองกัน [SSB_leader.GetLeader] เราไมรูจักทาน"

 PER_imperial_events.210.t: "[FROM.GetName]เรียกรองดินแดนชายแดนของเรา!"
 PER_imperial_events.210.desc: "[FROM.GetLeader]ไดเขียนจดหมายยืดยาวถึง[ROOT.GetLeader] แจงขอเรียกรองของ[FROM.GetAdjective]ใหยกดินแดนชายแดนบางสวนใหแกพวกเขา แมนี่จะเปนความพยายามอันโจงแจงที่จะลบหลูอธิปไตยของเรา แตก็อาจหมายความวา[FROM.GetNameDef]อาจใชมาตรการรุนแรงเพื่อยึดดินแดนเหลานี้หากเราปฏิเสธ เราควรทําอยางไรดี?"
 PER_imperial_events.210.a: "ยกดินแดนให..."
 PER_imperial_events.210.b: "พวกเขาจะไมมีวันไดดินแดนของเราไป"

 PER_imperial_events.211.t: "[FROM.GetName]ยอมตามขอเรียกรองของเรา!"
 PER_imperial_events.211.desc: "เชานี้เราไดรับขาวจาก[FROM.GetNameDef]วาพวกเขายอมตามขอเรียกรองของเราอยางไมเต็มใจ และไดเริ่มกระบวนการโอนดินแดนชายแดนใหแกเราแลว พวกเขาหารูไมวาสิ่งนี้จะยิ่งชวยเกื้อหนุนแผนการของเราในภายภาคหนา"
 PER_imperial_events.211.a: "พวกโงเขลา..."

 PER_imperial_events.212.t: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา!"
 PER_imperial_events.212.desc: "เชานี้เราไดรับขาวจาก[FROM.GetNameDef]วาพวกเขาปฏิเสธขอเรียกรองของเราอยางแข็งกราว แมนี่จะเปนเพียงปญหาเล็กนอยสําหรับแผนการของเรา แตก็หมายความวาเราจะตองยึดดินแดนนั้นมาดวยวิธีแบบดั้งเดิม"
 PER_imperial_events.212.a: "พวกเขาจะตองเสียใจ"

 PER_imperial_events.220.t: "ฤดูการเลือกตั้ง"
 PER_imperial_events.220.desc: "เนื่องจากการปรับโครงสรางรัฐบาล[PER.GetAdjective]ครั้งใหญ จึงมีการประกาศจัดการเลือกตั้งเพื่อใหประชาชนของ[PER.GetNameDef]ไดเลือกนายกรัฐมนตรีคนใหม ขณะที่พลเมืองจํานวนมากหลั่งไหลไปยังหนวยเลือกตั้งทั่วประเทศ มีผูสมัครสองคนที่โดดเดนเปนพิเศษ คือ โมฮัมหมัด โมซัดเดก และโมฮัมหมัด อาลี โฟรูกี ทายที่สุดแลวประชาชาติจะลงคะแนนอยางไร?"
 PER_imperial_events.220.a: "โมซัดเดกคือตัวเลือกที่ชัดเจน"
 PER_imperial_events.220.b: "บางทีโฟรูกีอาจเปนตัวเลือกที่ดีกวา?"
 PER_imperial_events.220.c: "กาชานีจะเพิ่มแรงสนับสนุนจากนักบวช"

 PER_imperial_events.201.t: "[FROM.GetName]ลงนามในกติกาสัญญาซาดาบาด"
 PER_imperial_events.201.desc: "[FROM.GetLeader]กระตือรือรนอยางยิ่งเมื่อไดรับขอเสนอของเราเรื่องสนธิสัญญาไมตรีและสนธิสัญญาไมรุกราน และไมรอชาที่จะสงสนธิสัญญาที่ลงนามแลวกลับมายังเรา ดวยความเห็นชอบของพวกเขา เรากาวเขาใกลสันติภาพในบานและสันติภาพในโลกไปอีกขั้น!"
 PER_imperial_events.201.a: "ทานจะเปนมิตรอันเปนที่รักของ[ROOT.GetNameDef]ตลอดไป"

 PER_imperial_events.202.t: "[FROM.GetName]ปฏิเสธกติกาสัญญาซาดาบาด!"
 PER_imperial_events.202.desc: "[FROM.GetLeader]ไดเขียนจดหมายยืดยาวถึง[ROOT.GetLeader] แจงวาขอเสนอเรื่องสนธิสัญญาไมตรีและสนธิสัญญาไมรุกรานนั้นไมคุมคาแมแตกระดาษและหมึกที่ใชเขียน [FROM.GetLeader]ยังเขียนตอไปวาอะไรก็ตามที่นอยกวาพันธมิตรอยางเปนทางการระหวาง[FROM.GetNameDef]และ[ROOT.GetNameDef]ลวนเปนการเสียเวลา และพวกเขาขอไมเกี่ยวของกับแผนการใด ๆ ของ[ROOT.GetAdjective]อีกตอไปนับจากนี้"
 PER_imperial_events.202.a: "...แคบอกวา 'ไม' ก็ไดนี่"

 PER_imperial_events.230.t: "การกลับมาของราชวงศกาจาร"
 PER_imperial_events.230.desc: "หลังจากลี้ภัยอยูใน[ENG.GetNameDef]มาหลายป โมฮัมหมัด ฮัสซัน มีรซา รัชทายาทโดยสันนิษฐานแหงราชวงศกาจาร ก็กระตือรือรนที่จะกลับคืนสูบัลลังกแหง[PER.GetNameDef] การปกครองของราชวงศปาหลาวีไมเปนไปตามความคาดหวังของรัฐบาล[ENG.GetAdjective] และหวังกันวาการนําราชวงศเดิมกลับคืนสูอํานาจจะชวยรักษาผลประโยชนของ[ENG.GetAdjective]ในภูมิภาคนี้ได"
 PER_imperial_events.230.a: "จะรอทําไม? เตรียมพิธีราชาภิเษก!"
 PER_imperial_events.230.b: "เปนการรอบคอบที่เราจะโคนราชวงศปาหลาวีลง"
 PER_imperial_events.230.c: "เนรเทศราชวงศปาหลาวีไปยัง[SAF.GetNameDef]"

 PER_imperial_events.231.t: "ราชวงศปาหลาวีถูกถอดจากอํานาจ"
 PER_imperial_events.231.desc: "หลังจากการพิจารณาอยางรอบคอบ ราชวงศปาหลาวีถูกบีบใหลงจากบัลลังกแหง[PER.GetNameDef] แมพวกเขาจะรับใชประเทศมาหลายทศวรรษ แตสิ่งสําคัญคือเราตองดําเนินการใหเปนที่พอใจของรัฐบาล[ENG.GetAdjective] แมพวกเขาจะไมมีที่ยืนในสถาบันกษัตริย[PER.GetAdjective]อีกตอไป แตพวกเขาก็ยังตั้งใจจะมีบทบาทในแวดวงการเมืองภายในประเทศ"
 PER_imperial_events.231.a: "ยอดเยี่ยม บัดนี้เราตองสวมมงกุฎใหชาหองคใหมแหงราชวงศกาจาร"

 PER_imperial_events.232.t: "ราชวงศปาหลาวีถูกเนรเทศไปยัง[SAF.GetNameDef]"
 PER_imperial_events.232.desc: "ตามแผนการฟนฟูราชวงศกาจารสูบัลลังกแหง[PER.GetNameDef] ไดมีการตัดสินวาผลลัพธที่ดีที่สุดสําหรับอนาคตของประเทศคือการเนรเทศราชวงศปาหลาวีไปยัง[SAF.GetNameDef] การทําเชนนี้จะทําใหเราไดรับความโปรดปรานจาก[ENG.GetNameDef] ซึ่งเราอาจโนมนาวใหยอมใหเรามีอํานาจปกครองตนเองมากขึ้นในอนาคตได"
 PER_imperial_events.232.a: "นาเสียดาย แตบัดนี้เราตองสวมมงกุฎใหชาหองคใหมแหงราชวงศกาจาร"

 PER_imperial_events.233.t: "พิธีราชาภิเษกของโมฮัมหมัด ฮัสซัน มีรซา"
 PER_imperial_events.233.desc: "เชานี้ ในพิธีราชาภิเษกอันหรูหราที่จัดขึ้น ณ [FROM.Capital.GetCapitalVictoryPointName] โมฮัมหมัด ฮัสซัน มีรซา ไดรับการสวมมงกุฎเปนชาหองคใหมแหง[PER.GetNameDef] หลังการปกครองของราชวงศปาหลาวีมาหลายทศวรรษ บัดนี้กษัตริยจากราชวงศกาจารไดกลับมาเปนประมุขของชาติอันยิ่งใหญนี้อีกครั้ง ความพยายามในการฟนฟูราชวงศกาจารของเราเปนที่พอใจของรัฐบาล[ENG.GetAdjective] ซึ่งหวังวาสิ่งนี้จะชวยใหพวกเขากุมผลประโยชนใน[PER.GetNameDef]ไดมั่นคงยิ่งขึ้น"
 PER_imperial_events.233.a: "แดชาหองคใหมของเรา!"

 PER_islamic_revolution_events.1.t: "ความไมมั่นคงในหมูนักบวช"
 PER_islamic_revolution_events.1.desc: "ดูเหมือนวาการตัดสินใจบางอยางของเราเกี่ยวกับการพัฒนาประเทศไดเริ่มสรางความไมพอใจแกนักบวชจํานวนหนึ่ง ขณะที่ความไมพอใจของพวกเขายังคงคุกรุน เราตองระมัดระวังเพื่อไมใหพวกเขาแปลกแยกไปมากกวานี้"
 PER_islamic_revolution_events.1.a: "เราควรระมัดระวังในการดําเนินการตอไป"

 PER_islamic_revolution_events.2.t: "นักปฏิวัติอิสลามเริ่มเคลื่อนไหว"
 PER_islamic_revolution_events.2.desc: "การกระทําของเรายังคงผลักไสนักบวชออกไป และผลที่ตามมาคือผูนําศาสนาอิสลามระดับสูงหลายคนเริ่มไดรับแรงสนับสนุนจากประชาชนของ[PER.GetNameDef] เวลาของเรากําลังจะหมดลง และเรากําลังเผชิญกับการปฏิวัติที่อาจเกิดขึ้น เราควรทําอยางไรดี?"
 PER_islamic_revolution_events.2.a: "ปราบปรามนักปฏิวัติเหลานี้"
 PER_islamic_revolution_events.2.b: "เอาใจนักบวชโดยทันที"
 PER_islamic_revolution_events.2.c: "ใหพวกมันลองดู!"

 PER_foreign_policy_events.1.t: "แรงกดดันจาก[FROM.GetNameDef]"
 PER_foreign_policy_events.1.desc: "ดูเหมือนวารัฐบาล[FROM.GetAdjective]จะกังวลมากขึ้นเรื่อย ๆ เกี่ยวกับสถานการณทางการทูตของเรา ตลอดสัปดาหที่ผานมา เอกอัครราชทูต[FROM.GetAdjective]ไดพบกับ[THIS.GetLeader]ไมตํ่ากวาหกครั้ง และแทบจะยื่นคําขาดในการเจรจารอบลาสุด\n\nเราจะตองเขารวมกติกาสัญญาปองกันรวมกับ[FROM.GetNameDef]และยอมรับ "การปรึกษาหารือในระดับหนึ่งในกิจการภายใน" มิฉะนั้น[FROM.GetNameDef]ก็อาจหันไปใชการแทรกแซงทางทหารในประเทศของเรา"
 PER_foreign_policy_events.1.a: "การตอสูคงไรประโยชน"
 PER_foreign_policy_events.1.b: "ใหพวกมันมาเลย!"

 PER_foreign_policy_events.2.t: "[FROM.GetNameDefCap]ปฏิเสธ"
 PER_foreign_policy_events.2.desc: "ความพยายามของเราที่จะแกไขปญหาคางคากับ[FROM.GetNameDef]ทางการทูตดูเหมือนจะลมเหลว เมื่อเอกอัครราชทูตของเราเขาพบ[FROM.GetLeader]เพื่อเจรจาอีกรอบ เขากลับไดรับคําตอบหวน ๆ วาฝาย[FROM.GetAdjective]ไดแสดงจุดยืนชัดเจนแลว และไมมีอะไรจะตองหารือกันอีก"
 PER_foreign_policy_events.2.a: "เราจะไมกดดันพวกเขาตอ... ในตอนนี้"
 PER_foreign_policy_events.2.b: "เตรียมการบุก[FROM.GetNameDef]!"
 PER_foreign_policy_events.2.c: "เราตองเตรียมการบุกรวมกับฝาย[SOU.GetAdjective]"

 PER_foreign_policy_events.3.t: "การบุกอิหรานของอังกฤษ-[SOV.GetAdjective]"
 PER_foreign_policy_events.3.desc: "เราไดรับบันทึกทางการทูตจาก[FROM.GetNameDef] เสนอใหดําเนินปฏิบัติการทางทหารรวมกันตอ[PER.GetNameDef] กองบัญชาการ[FROM.GetAdjective]ยืนยันวาปฏิบัติการนี้จะชวยใหเรายึดครองแหลงนํ้ามันของอิหรานและเสนทางสงเสบียงของเราไปยัง[FROM.GetNameDef]ได พรอมทั้งปองกันการรุกคืบของขาศึกที่อาจเกิดขึ้นจาก[TUR.GetNameDef]ผาน[PER.GetName]ไปยังแหลงนํ้ามันบากูและ[RAJ.GetNameDef]"
 PER_foreign_policy_events.3.a: "เราตองยึดระเบียงเปอรเซียใหได!"
 PER_foreign_policy_events.3.b: "เราจะเคารพเอกราชของ[PER.GetAdjective]"

 PER_foreign_policy_events.4.t: "การบุกอิหรานของอังกฤษ-[SOV.GetAdjective]"
 PER_foreign_policy_events.4.desc: "เอกอัครราชทูต[FROM.GetAdjective]ไดสงบันทึกซึ่ง[FROM.GetNameDef]ตกลงที่จะจัดและดําเนินปฏิบัติการทางทหารรวมกันตอ[PER.GetNameDef] ทั้งกองบัญชาการ[ROOT.GetAdjective]และ[FROM.GetAdjective]ตางมั่นใจวานี่จะเปนปฏิบัติการที่รวดเร็วและมีประสิทธิภาพตอขาศึกที่มีกําลังนอยกวาและลาหลังทางเทคโนโลยี ซึ่งจะชวยใหเรายึดครองแหลงนํ้ามันของอิหรานและเสนทางสงเสบียงของ[FROM.GetAdjective]ไปยัง[ROOT.GetNameDef]ได พรอมทั้งปองกันการรุกคืบของขาศึกที่อาจเกิดขึ้นจาก[TUR.GetNameDef]ผาน[PER.GetName]ไปยังแหลงนํ้ามันบากูและ[RAJ.GetNameDef]"
 PER_foreign_policy_events.4.a: "เริ่มการเตรียมการ!"

 PER_foreign_policy_events.5.t: "รัฐบาล[FROM.GetAdjective]ปฏิเสธ"
 PER_foreign_policy_events.5.desc: "หลังการประชุมอันนาเหนื่อยหนายหลายครั้งระหวางนักการทูต[ROOT.GetAdjective]และ[FROM.GetAdjective] [FROM.GetNameDef]ไดตัดสินใจไมเขาไปเกี่ยวของกับแผนการของเราตอ[PER.GetNameDef] [FROM.GetLeader]เองถึงกับกลาบอกเปนนัยวาขอเสนอนี้เปนเพียงความพยายามที่จะสรางความชอบธรรมใหกับความทะเยอทะยานทางดินแดนของเรา\nดูเหมือนวาเราจะตองจัดการกับ[PER.GetNameDef]ดวยตัวเอง"
 PER_foreign_policy_events.5.a: "ไวใจไมไดเลยทุกครั้ง..."

 PER_revolution_events.1.t: "รัฐประหารใกลเกิดขึ้น"
 PER_revolution_events.1.desc: "เชานี้ พรรคฝายคานไดรวมตัวกันเปนแนวรวม และหลังจากแทรกซึมเขาไปในกองทัพของเรา บัดนี้พวกเขาไดจับอาวุธลุกขึ้นตอตานเรา! กองกําลังของพวกเขากําลังเตรียมเคลื่อนพลไปยังพระราชวังซาดาบาด! เราตองเตรียมตอบโตเพื่อปกปองอธิปไตยของ[PER.GetNameDef]!"
 PER_revolution_events.1.a: "รวมพลทหาร!"

 PER_communist_events.1.t: "ความเคลื่อนไหวของพวกหัวรุนแรงเพิ่มขึ้น"
 PER_communist_events.1.desc: "พวกหัวรุนแรงที่เรียกรองเอกราชจากเราเคลื่อนไหวมากขึ้นในชวงไมกี่วันที่ผานมา ยังไมชัดเจนวาอะไรเปนชนวนใหเกิดความเคลื่อนไหวที่เพิ่มขึ้นนี้ แตเจาหนาที่ทองถิ่นแสดงความกังวลตอวาทกรรมชาตินิยมและสังคมนิยมที่โหมกระพืออยูบนทองถนน หากเราตองการปองกันไมใหสถานการณบานปลาย เราคงตองเริ่มการปราบปราม"
 PER_communist_events.1.a: "พัฒนาการที่นากังวล"
 PER_communist_events_1_tt: "ปลดล็อกการตัดสินใจ §Y$PER_anti_gulf_decisions_cat$§! เพื่อปราบปรามการตอตาน"

 PER_communist_events.2.t: "ปราบปรามขบวนการเรียกรองเอกราชชาวเคิรด"
 PER_communist_events.2.desc: "ทางการ[FROM.GetAdjective]ไดดําเนินการปราบปรามขบวนการเรียกรองเอกราชชาวเคิรดทั่วทั้งภูมิภาค ผูติดตอของเราในพื้นที่จึงตองหลบซอนตัวหรือหนีขามชายแดนเขามายัง[ROOT.GetNameDef]"
 PER_communist_events.2.a: "เราจะทุมเทความพยายามเปนสองเทา"

 PER_communist_events.3.t: "การกบฏของชาวเคิรดอาจใกลเกิดขึ้น"
 PER_communist_events.3.desc: "ความเคลื่อนไหวของกลุมแบงแยกดินแดนและนักสังคมนิยมชาวเคิรดไดทวีความรุนแรงถึงขีดสุดในชวงไมกี่วันที่ผานมา อีกทั้งยังมีหลักฐานเพิ่มขึ้นเรื่อย ๆ วามีการกระจายอาวุธไปทั่วประเทศเพื่อเตรียมกอกบฏในอีกไมกี่สัปดาหขางหนา หากเราไมลงมือโดยเร็ว สงครามเต็มรูปแบบอาจหลีกเลี่ยงไมได"
 PER_communist_events.3.a: "เราตองปองกันไมใหสถานการณบานปลาย!"
 PER_communist_events_3_tt: "§Rเราตองเริ่มปราบปรามผูเห็นตาง หากตองการหลีกเลี่ยงการลุกฮือของชาวเคิรดและสงคราม!§!"

 PER_communist_events.4.t: "การตอตานที่ชายแดน[PER.GetAdjective]เพิ่มขึ้น"
 PER_communist_events.4.desc: "ในชวงไมกี่วันที่ผานมา การตอตานการยึดครองดินแดนรอบชายแดน[PER.GetAdjective]ของเราเพิ่มขึ้นอยางเห็นไดชัด แมชนวนเหตุยังไมแนชัด แตก็มีความกังวลเพิ่มขึ้นวามีใครบางคนกําลังปลุกปนกระแสตอตาน[ROOT.GetAdjective] โดยหวังจะบั่นทอนอิทธิพลของเราในพื้นที่"
 PER_communist_events.4.a: "ใครอยูเบื้องหลังเรื่องนี้?"
 PER_communist_events_4_tt: "§Rรัฐของเราในอาวเปอรเซียอาจเผชิญการตอตานที่เพิ่มขึ้นในอีกไมกี่เดือนขางหนา!§!"

PER_communist_events.5.t: "วิกฤตการณอาวเปอรเซีย"
PER_communist_events.5.desc: "ดูเหมือนวาความวุนวายสวนใหญในอาวเปอรเซียและพื้นที่โดยรอบเมื่อเร็ว ๆ นี้นาจะมีตนตอมาจาก[FROM.GetNameDef] ดวยชัยชนะทางยุทธศาสตรหลายครั้งในภูมิภาค ดูเหมือนวาตอนนี้พวกเขารูสึกฮึกเหิมพอที่จะเดินหมากครั้งใหญที่สุด ในคําเตือนอันเครงขรึมถึงรัฐบาลของเรา ระบอบ[FROM.GetAdjective]ไดเรียกรองใหเราถอนตัวออกจากคาบสมุทรอาหรับและอาวเปอรเซียโดยสิ้นเชิง ถึงขั้นแสดงทาทีวาพรอมจะปดลอมอาวหากเราไมปฏิบัติตาม" 
PER_communist_events.5.a: "เราจะถอนตัว พรอมยื่นประทวง"
PER_communist_events.5.b: "พวกเขากับกองทัพเรือของใครกัน?"

PER_communist_events.6.t: "[FROM.GetNameDefCap]ตกลงถอนตัว"
PER_communist_events.6.desc: "แมจะมีการขมขูทางการทูตมากมาย แตกองกําลัง[FROM.GetAdjective]ก็ไดเริ่มถอนตัวออกจากภูมิภาคแลว นี่เปนชัยชนะทางยุทธศาสตรครั้งใหญของรัฐบาลเรา และไดรับการตอนรับจากผูคนมากมายทั่วโลกในฐานะสัญญาณแหงความเสื่อมถอยของลัทธิอาณานิคม" 
PER_communist_events.6.a: "งานของเรายังไมจบ!"

PER_communist_events.7.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะถอนตัว"
PER_communist_events.7.desc: "ไมนาแปลกใจ พวกหัวดื้อโงเขลาใน[FROM.Capital.GetCapitalVictoryPointName]ปฏิเสธที่จะถอนตัวออกจากพื้นที่พิพาททั่วอาวเปอรเซียและอาระเบีย ดูเหมือนพวกเขาคิดวาเราไมมีความเด็ดเดี่ยวพอที่จะทําตามคําขูปดลอมเสนทางเดินเรือเพื่อตอบโตการกระทําของพวกเขา" 
PER_communist_events.7.a: "ถาเชนนั้นเราจะแสดงใหเห็นถึงความเด็ดเดี่ยวของเรา"
PER_communist_events.7.b: "เราไมอาจปลอยใหเรื่องนี้บานปลายได"

PER_communist_events.8.t: "[FROM.GetNameDefCap]ปดลอมอาวเปอรเซีย"
PER_communist_events.8.desc: "วิกฤตการณอาวทวีความรุนแรงขึ้นอยางเห็นไดชัด เมื่อ[FROM.GetNameDef]ทําตามคําขูและเริ่มปดกั้นไมใหเรือพาณิชยและอากาศยานพลเรือนปฏิบัติการในพื้นที่ ยิ่งไปกวานั้น ขาวกรองยังบงชี้วากองทัพของพวกเขาไดยกระดับความพรอมรบเพื่อรับมือกับการปะทะกับกองกําลังของเรา" 
PER_communist_events.8.a: "เตรียมเรือปน"
PER_communist_events.8.b: "พวกเขาแสดงจุดยืนชัดแลว ออกคําสั่งถอนตัว"

PER_communist_events.9.t: "[FROM.GetNameDefCap]ลดนํ้าเสียงลง"
PER_communist_events.9.desc: "ดูเหมือนความกรางของ[FROM.GetNameDef]เมื่อไมนานมานี้จะถูกทําลายลงดวยความมุงมั่นอันแนวแนของเราในการปกปองผลประโยชนในพื้นที่ ในสุนทรพจนอันถอมตน [FROM.GetLeader]ยืนยันความปรารถนาอันแนวแนที่จะรักษาสันติภาพในภูมิภาค พันธมิตรของพวกเขาคงตกตะลึงกับการที่[FROM.GetAdjective]ดูเหมือนจะละทิ้งหลักการของตน" 
PER_communist_events.9.a: "คงไดบทเรียนแลวสินะ"

PER_communist_events.10.t: "[FROM.GetNameDefCap]สงกองทัพเรือมา"
PER_communist_events.10.desc: "โอกาสใด ๆ ที่จะหาทางออกทางการทูตสําหรับวิกฤตการณอาวที่กําลังคลี่คลายไดมลายหายไปแลว หลังจาก[FROM.GetNameDef]ตัดสินใจสงหมูเรือเฉพาะกิจมาทําลายการปดลอมของเราในภูมิภาค หากเราตองการรักษาความไดเปรียบในการจูโจมไว เราควรเปดฉากโจมตีชิงลงมือกอนในทันที มิฉะนั้นเราก็ควรลดระดับความขัดแยงลง" 
PER_communist_events.10.a: "เราจะโจมตีขณะที่ยังไดเปรียบ"
PER_communist_events.10.b: "ถึงเวลากลืนเลือดแลว"

PER_communist_events.11.t: "[FROM.GetNameDefCap]ขอเทคโนโลยีทางทหาร"
PER_communist_events.11.desc: "รัฐบาล[FROM.GetNonIdeologyName]ไดขอการสนับสนุนดานวิศวกรรมในการพัฒนาเทคโนโลยีตอตานเรือ เพื่อใหพวกเขาสามารถพัฒนามาตรการตอบโตภัยคุกคามจากมหาอํานาจอาณานิคมในอาวเปอรเซียไดอยางเหมาะสม พวกเขาใหคํามั่นวาจะแบงปนความกาวหนาใด ๆ ในอนาคตกับเรา"
PER_communist_events.11.a: "ความมั่นคงของพวกเขาสําคัญตอความมั่นคงของเราเอง"
PER_communist_events.11.b: "เราจะไมแลกเปลี่ยนความลับของรัฐ"

PER_communist_events.12.t: "[FROM.GetNameDefCap]ตกลงถายทอดเทคโนโลยี"
PER_communist_events.12.desc: "วิศวกรของเรากําลังตั้งตารอผลงานวิจัยและแบบลับของ[FROM.GetAdjective]อยางใจจดใจจอ หลังจากที่ฝาย [FROM.GetAdjective]ตัดสินใจแบงปนเทคโนโลยีทางทหารบางสวนกับเรา สิ่งนี้จะชวยเรงการออกแบบของเราเองไดอยางมาก"
PER_communist_events.12.a: "ยอดเยี่ยม!"

PER_communist_events.13.t: "[FROM.GetNameDefCap]ปฏิเสธการถายทอดเทคโนโลยี"
PER_communist_events.13.desc: "รัฐบาล[FROM.GetAdjective]ไดปฏิเสธคําขอเทคโนโลยีของเราที่จะชวยใหเราปองกันอาวเปอรเซียจากมหาอํานาจทางทะเลภายนอกไดดีขึ้น นี่เปนการกระทบกระเทือนตอวิศวกรของเรา แตพวกเขาก็ตั้งใจจะพัฒนาตอไปดวยตนเอง"
PER_communist_events.13.a: "เราจะประสบความสําเร็จไดโดยไมตองพึ่งพวกเขา"

PER_communist_events.14.t: "[FROM.GetNameDefCap]สงมอบแบบอาวุธ"
PER_communist_events.14.desc: "ตามขอตกลงกับ[FROM.GetNameDef] พวกเขาไดสงมอบแบบอาวุธที่เชื่อวาจะสามารถผลักดันพวกจักรวรรดินิยมออกจากอาวเปอรเซียได สวนแบบนี้จะมีประสิทธิภาพตามความตองการของเราหรือไมนั้นยังตองรอดูกันตอไป"
PER_communist_events.14.a: "ดีที่พวกเขารักษาคําพูด"

PER_communist_events.20.t: "ชาว[KUR.GetAdjective]เรียกรองอํานาจปกครองตนเอง"
PER_communist_events.20.desc: "ในความพยายามที่จะตอตานนโยบายสลายระบบชนเผาและเรียกรองอํานาจปกครองตนเองที่มากขึ้นโดยรวม พรรคประชาธิปไตยแหงเคอรดิสถานที่เพิ่งกอตั้งขึ้นไดยื่นคําขออยางเปนทางการใหพวกเขาดําเนินการในฐานะสาธารณรัฐสังคมนิยมที่แยกตางหากภายใน[SOU.GetNameDef] เรามีทางเลือกที่ตองตัดสินใจ เราจะคงการควบคุมภูมิภาคนี้ไวเอง หรือจะมอบใหแกชาว[KUR.GetAdjective]"
PER_communist_events.20.a: "มอบอํานาจปกครองตนเองใหพวกเขา"
PER_communist_events.20.b: "ดินแดนเหลานี้ควรอยูในเขตอํานาจของเรา"

PER_fascist_events.1.t: "สภาจักรวรรดิเปดประชุม"
PER_fascist_events.1.desc: "สภาจักรวรรดิไดเปดประชุมเพื่อตัดสินวาผูใดจะไดรับตําแหนงชาหอันทรงเกียรติ บางสวนสนับสนุนการฟนฟูราชวงศกาจาร บางเสนอใหคงเชื้อสายปาหลาวีไวบนบัลลังกเพื่อรักษาความชอบธรรมในสายตาประชาชน ขณะที่ผูภักดีตอพรรคสนับสนุนใหสถาปนาราชวงศใหม"
PER_fascist_events.1.a: "ปาหลาวีหุนเชิดก็เหมาะกับเราดีแลว"
PER_fascist_events.1.b: "ราชวงศใหมสําหรับอิหรานใหม"



### Iraq Events ###

 IRQ_political_events.10.t: "[FROM.GetNonIdeologyName]ยกเลิกสนธิสัญญา"
 IRQ_political_events.10.desc: "สนธิสัญญาอังกฤษ-อิรักไดรับการเจรจาในป 1930 เพื่อใหชาติที่ยังเยาววัยนี้มีอํานาจปกครองตนเองมากขึ้น ขณะเดียวกันก็ผูกมัดพวกเขาไวกับนโยบายตางประเทศของเราโดยพื้นฐาน อยางไรก็ตาม รัฐบาลของพวกเขาไดยกเลิกสนธิสัญญาและเรียกรองใหเราถอนตัวออกจากดินแดน[FROM.GetAdjective]โดยสิ้นเชิง เนื่องจากเราพึ่งพานํ้ามันจากภูมิภาคนี้ สิ่งนี้อาจเปนอันตรายตอความมั่นคงของชาติทั้งหมดของเรา หากรัฐบาล[FROM.GetAdjective]ตัดสินใจตัดการสงนํ้ามันใหเรา"
 IRQ_political_events.10.a: "เราจะแทรกแซงและคืนอํานาจใหมิตรของเรา"
 IRQ_political_events.10.b: "ยื่นประทวงทางการทูต"

 IRQ_political_events.11.t: "[FROM.GetNameDef]ยื่นประทวงทางการทูต"
 IRQ_political_events.11.desc: "เปนที่นาประหลาดใจ รัฐบาล[FROM.GetAdjective]ทําเพียงยื่นหนังสือประทวงทางการทูตดวยถอยคํารุนแรงตอเอกอัครราชทูตของเรา เกี่ยวกับการที่เราถอนตัวจากสนธิสัญญาอังกฤษ-อิรัก ดูเหมือนวาในตอนนี้เราไมจําเปนตองกลัวผลกระทบรายแรงใด ๆ จากฝาย[FROM.GetAdjective]"
 IRQ_political_events.11.a: "ชัยชนะของโลกอาหรับ!"
 
 IRQ_political_events.12.t: "[FROM.GetNameDefCap]เรียกรองดินแดน"
 IRQ_political_events.12.desc: "รัฐบาล[FROM.GetNameDef]ไดเรียกรองใหเรายกดินแดนทางตะวันตกที่มีชนกลุมนอยชาวอาหรับจํานวนมากใหแกพวกเขา โดยอางวาเพื่อปกปองชาวอาหรับในพื้นที่ อยางไรก็ตาม พื้นที่เดียวกันนี้ยังมีโครงสรางพื้นฐานดานนํ้ามันจํานวนมากซึ่งนาจะเปนประโยชนตอเศรษฐกิจของพวกเขา หากเราปฏิเสธคําขาดนี้ ดูเหมือนวาพวกเขาจะพยายามยึดดินแดนดวยกําลัง"
 IRQ_political_events.12.a: "เราจะปกปองดินแดนของเรา"
 IRQ_political_events.12.b: "เรื่องนี้ไมคุมที่จะทําสงคราม"
 
 IRQ_political_events.13.t: "[FROM.GetNameDefCap]ตกลงโอนดินแดน"
 IRQ_political_events.13.desc: "รัฐบาล[FROM.GetNameDefCap]ไดตกลงโอนดินแดนที่เราเรียกรองจากพวกเขาแลว แมกองทัพของเราจะพรอมทําสงครามเพื่อภูมิภาคนี้ แตดูเหมือนเราจะไดชัยชนะโดยไมตองรบ"
 IRQ_political_events.13.a: "ชัยชนะอีกครั้งของโลกอาหรับ"
 
 IRQ_political_events.14.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะโอนดินแดน"
 IRQ_political_events.14.desc: "รัฐบาล[FROM.GetNameDefCap]ไดปฏิเสธที่จะโอนดินแดนที่เราเรียกรองจากพวกเขา ดูเหมือนวาเราจะตองพึ่งพากองทัพหากตองการปลดปลอยภูมิภาคนี้จากการปกครองของ[FROM.GetAdjective]"
 IRQ_political_events.14.a: "ถาเชนนั้นเราจะยึดมันดวยกําลัง"
 IRQ_political_events.14.b: "พวกเขาจับไดวาเราขูเปลา"
 
 IRQ_political_events.15.t: "ความตึงเครียดกับ[FROM.GetNameDef]ผอนคลายลง"
 IRQ_political_events.15.desc: "ดูเหมือนวากองทัพ[FROM.GetAdjective]กําลังลดระดับความพรอมรบตามแนวชายแดนลง แมเราจะเตรียมพรอมปกปองดินแดนของเราแลว แตก็นาโลงใจที่สงครามถูกหลีกเลี่ยงไปไดในตอนนี้"
 IRQ_political_events.15.a: "โลงใจจริง ๆ"
 
 IRQ_political_events.16.t: "[FROM.GetNameDefCap]ขอควบคุม[455.GetName]"
 IRQ_political_events.16.desc: "หลังจากพิสูจนความภักดีตอเราดวยการกําจัดนายทหารที่ฝกใฝ[GER.GetAdjective]ออกจากกองทัพแลว รัฐบาล[FROM.GetAdjective]ไดขอโอกาสในการผนวกรวมรัฐเพื่อนบานอยาง[455.GetName] ราชวงศของทั้งสองชาติมีความสัมพันธกันอยูแลว และยังชวยลดภาระดานการบริหารของเราไดบาง"
 IRQ_political_events.16.a: "เราจะใหรางวัลพวกเขา ตราบใดที่คนทองถิ่นไมมีปญหา"
 IRQ_political_events.16.b: "พวกเขาไวใจไมได"
 
 IRQ_political_events.17.t: "[FROM.FROM.GetNonIdeologyName]ตองการปกครองเรา"
 IRQ_political_events.17.desc: "[FROM.FROM.GetNonIdeologyName]กําลังพยายามขยายบทบาทภายในเขตอิทธิพลของ[FROM.GetAdjective] ดวยการเขามาบริหาร[ROOT.GetNameDef] หากเรายินยอม เราจะไมตองขึ้นตรงตอฝาย[FROM.GetAdjective]โดยตรงอีกตอไป แตเราก็ยังคงไมมีหนทางที่จะดําเนินการอยางอิสระบนเวทีโลก"
 IRQ_political_events.17.a: "นี่เปนการเปลี่ยนแปลงที่นายินดี"
 IRQ_political_events.17.b: "เราพอใจกับการจัดการในปจจุบัน"
 
 IRQ_political_events.18.t: "[FROM.GetNameDefCap]ตกลงโอนอํานาจ"
 IRQ_political_events.18.desc: "วันนี้เปนวันแหงความปติยินดีของชาติเรา เมื่อเราเขารับการบริหาร[455.GetName]อยางเปนทางการ นี่ถือเปนกาวสําคัญสูการรวมโลกอาหรับอันกวางใหญไวภายใตการปกครองของเรา"
 IRQ_political_events.18.a: "ถึงเวลาเฉลิมฉลอง!"
 
 IRQ_political_events.19.t: "[FROM.GetNameDefCap]ปฏิเสธการโอนอํานาจ"
 IRQ_political_events.19.desc: "ดวยปญหายุงยากนานัปการ [FROM.GetNameDef]ไดปฏิเสธแผนของเราที่จะรับผิดชอบดูแล[455.GetName] ดูเหมือนวาแมเราจะพยายามเอาใจฝาย[FROM.GetAdjective]เพียงใด พวกเขาก็ยังคงมองเราดวยความดูแคลนและไมไววางใจ"
 IRQ_political_events.19.a: "วันอันเลวรายสําหรับ[ROOT.GetNonIdeologyName]และ[455.GetName]"
 
 IRQ_political_events.20.t: "ฝายบริหารของ[FROM.GetNameDef]ปฏิเสธขอเสนอ"
 IRQ_political_events.20.desc: "รัฐบาล[FROM.GetAdjective]ไดปฏิเสธแผนการโอนความรับผิดชอบดูแลชาติของพวกเขาใหแก[IRQ.GetNonIdeologyName] แมเราคิดวาเรื่องนี้จะทําใหพวกเขาพอใจ แตดูเหมือนพวกเขาจะยอมอยูกับปศาจที่รูจักดีกวา"
 IRQ_political_events.20.a: "นาประหลาดใจจริง ๆ"
 
 IRQ_political_events.21.t: "[FROM.GetNameDefCap]เรียกรองการควบคุม[454.GetName]"
 IRQ_political_events.21.desc: "รัฐบาล[FROM.GetNameDef]ไดเรียกรองใหเราถอนตัวออกจาก[PAL.GetName]โดยทันที หลังเกิดเหตุรุนแรงปะทุขึ้นในดินแดนนี้เมื่อเร็ว ๆ นี้ พวกเขาอางวาตนเหมาะสมกวาในการปกครองดินแดนในอาณัตินี้ และการจัดการของเรากําลังทํารายพี่นองชาวอาหรับของพวกเขา แมการถอนตัวจะเปนประโยชนตอกองทัพของเรา แตความเสียหายดานนโยบายตางประเทศอาจกวางขวาง"
 IRQ_political_events.21.a: "เตรียมการโอนอํานาจ แตปรึกษาคนทองถิ่นกอน"
 IRQ_political_events.21.b: "พวกเขาลืมไปแลววาตัวเองเปนใคร"
 
 IRQ_political_events.22.t: "[FROM.FROM.GetNonIdeologyName]วางแผนเขายึดอํานาจ"
 IRQ_political_events.22.desc: "รัฐบาล[FROM.GetAdjective]กําลังวางแผนถอนตัวออกจาก[ROOT.GetName]และมอบการบริหารใหแก[IRQ.GetNameDef] หากเราไมวางแผนขัดขวางกระบวนการนี้โดยทันที อีกไมกี่วันเราจะตองรับคําสั่งจาก[IRQ.Capital.GetCapitalVictoryPointName]"
 IRQ_political_events.22.a: "การจัดการในปจจุบันไมอาจดํารงอยูได..."
 IRQ_political_events.22.b: "เรามีวาระของเราเอง"
 
 IRQ_political_events.23.t: "[ENG.GetNameDefCap]ตกลงโอนอํานาจ"
 IRQ_political_events.23.desc: "ดวยความเขาใจวาสถานการณนั้นยากจะตานทานสําหรับกองกําลังของพวกเขา รัฐบาล[ENG.GetAdjective]จึงตกลงถอนตัวออกจาก[454.GetName]และมอบอํานาจปกครองภูมิภาคนี้ใหแกเรา"
 IRQ_political_events.23.a: "วันนี้ความเปนปกแผนของชาวอาหรับไดรับชัยชนะ"
 
 IRQ_political_events.24.t: "[FROM.GetNameDefCap]ปฏิเสธการโอนอํานาจ"
 IRQ_political_events.24.desc: "ดวยปญหายุงยากนานัปการ [FROM.GetNameDef]ไดปฏิเสธแผนของเราที่จะรับผิดชอบดูแล[454.GetName] แมเราจะเสนอทางเลือกที่จะเปดโอกาสใหฝาย[ENG.GetAdjective]ถอนตัวออกจากภูมิภาคอยางสันติ แตพวกเขากลับเลือกที่จะยึดครองพื้นที่อันนองเลือดและสิ้นเปลืองตอไปไมวาจะตองแลกดวยอะไร"
 IRQ_political_events.24.a: "วันนี้โลกอาหรับหลั่งนํ้าตา"
 IRQ_political_events.24.b: "เราจะไมยอมทนเรื่องนี้ ความรวมมือของเรากับ[FROM.GetNameDefCap]สิ้นสุดลงแลว"

 IRQ_political_events.25.t: "ฝายบริหารของ[FROM.GetNameDef]ปฏิเสธขอเสนอ"
 IRQ_political_events.25.desc: "รัฐบาล[FROM.GetAdjective]ไดปฏิเสธแผนการโอนความรับผิดชอบดูแลชาติของพวกเขาใหแก[IRQ.GetNonIdeologyName] แมเราคิดวาเรื่องนี้จะทําใหพวกเขาพอใจ แตดูเหมือนพวกเขาจะยอมอยูกับปศาจที่รูจักดีกวา"
 IRQ_political_events.25.a: "สมุนจักรวรรดินิยม"
 
 IRQ_political_events.26.t: "[FROM.GetNameDefCap]เสนอการเปนสมาชิกสหพันธรัฐ"
 IRQ_political_events.26.desc: "คณะทูตจาก[FROM.GetNameDef]ไดเขาหาเราพรอมขอเสนอใหเขาเปนสมาชิกสหพันธรัฐของพวกเขา แมการเขารวมจะนํามาซึ่งประโยชนดานเศรษฐกิจและความมั่นคงอยางไมตองสงสัย แตเราก็จะตองสละอํานาจปกครองตนเองไปเปนสวนใหญ"
 IRQ_political_events.26.a: "เราแข็งแกรงกวาเมื่ออยูดวยกัน"
 IRQ_political_events.26.b: "ตอนนี้เรายังไมสนใจ"
 IRQ_political_events.26.c: "เราจะไมมีวันสละอธิปไตยของเรา!"
 
 IRQ_political_events.27.t: "[FROM.GetNameDefCap]ตกลงเปนสมาชิกสหพันธรัฐ"
 IRQ_political_events.27.desc: "[FROM.GetNameDefCap]ตัดสินใจอยางชาญฉลาดที่จะยอมรับการเปนสมาชิกสหพันธรัฐ ขาราชการและนักการทูตของเรากําลังจัดเตรียมทุกอยางเพื่อกระบวนการผนวกรวมอยางเรงดวน"
 IRQ_political_events.27.a: "เราแข็งแกรงกวาเมื่ออยูดวยกัน"
 
 IRQ_political_events.28.t: "[FROM.GetNameDefCap]ปฏิเสธการเปนสมาชิกสหพันธรัฐ"
 IRQ_political_events.28.desc: "[FROM.GetNameDefCap]ตัดสินใจอยางโงเขลาที่จะปฏิเสธการเปนสมาชิกสหพันธรัฐ อยางไรก็ตาม พวกเขาไมไดแสดงทาทีวาจะคัดคานการเขารวมในอนาคต ในเวลาที่ประชาชนของพวกเขาอาจเปดรับมากกวานี้"
 IRQ_political_events.28.a: "บางทีพวกเขาอาจเปลี่ยนใจ?"

 IRQ_political_events.29.t: "[FROM.GetNameDefCap]คัดคานสหพันธรัฐ"
 IRQ_political_events.29.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอการเปนสมาชิกสหพันธรัฐของเราอยางแข็งกราว พวกเขายืนยันวาจะไมมีวันยอมรับการจัดการเชนนี้โดยสมัครใจ เนื่องจากกังวลถึงผลกระทบตอประเทศของตน"
 IRQ_political_events.29.a: "ชางสายตาสั้นเสียจริง..."
 rejected_hashemite_federation_tt: "§Rเราจะไมสามารถเชิญ[FROM.GetNameDef]เขารวมสหพันธรัฐของเราไดอีกตอไป!§!"
 IRQ_regent_turned_down_absolute_powers: "§Yอับดุลอิลาฮ§! ไดปฏิเสธโอกาสในการฟนฟูระบอบสมบูรณาญาสิทธิราชย"

# Demand Leb
 IRQ_political_events.30.t: "[FROM.GetNameDef]เรียกรองการควบคุม[553.GetName]"
 IRQ_political_events.30.desc: "รัฐบาล[FROM.GetNameDef]ไดยื่นขอเรียกรองอยางอุกอาจใหเราสละการควบคุมเลบานอน โดยอางถึงหนาที่ในการปกปองและรวมชาวอาหรับในภูมิภาคใหเปนหนึ่งเดียว แมพวกเขาจะหอหุมขออางดวยวาทกรรมลัทธิรวมชาติอาหรับ แตก็ชัดเจนวาที่ตั้งทางยุทธศาสตรและศักยภาพทางเศรษฐกิจของดินแดนนี้ รวมถึงทาเรือและโครงสรางพื้นฐานอันมีคา คือหัวใจของความทะเยอทะยานของพวกเขา หากเราปฏิเสธขอเรียกรอง ก็ไมนาเปนไปไดที่พวกเขาจะปลอยเรื่องนี้ไปอยางสงบ"
 IRQ_political_events.30.a: "เราไมอาจรับมือกับสงครามอีกครั้งได"
 IRQ_political_events.30.b: "พวกเขาแคขู"
 
