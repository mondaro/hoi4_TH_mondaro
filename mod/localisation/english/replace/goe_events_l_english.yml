 # NEWS
 GOE_RAJ_news.1.t: "การกลับมาของบริษัทอินเดียตะวันออก[?event_target:EIC_FORMER.GetAdjective]"
 GOE_RAJ_news.1.desc: "ขณะที่ความตึงเครียดใน[RAJ.GetNonIdeologyName]มีแตจะทวีขึ้น คําถามวา[?event_target:EIC_FORMER.GetNonIdeologyName]จะสรางเสถียรภาพในภูมิภาคไดอยางไรก็กลายเปนประเด็นถกเถียงสําคัญในรัฐสภา เชานี้ [?event_target:EIC_FORMER.GetLeader]ไดกลาวสุนทรพจนประกาศแผนของ[?event_target:EIC_FORMER.GetLeader.GetHerHis]ในการกอตั้งรัฐบรรษัทแหงใหมใน[429.GetName] เพื่อสงเสริมการเติบโตทางเศรษฐกิจทั้งใน[RAJ.GetNonIdeologyName]และ[?event_target:EIC_FORMER.GetNonIdeologyName] [?event_target:EIC_FORMER.GetLeader.GetSheHeCap]อางวารัฐนี้จะดําเนินงานอยางเปนอิสระจากราชบัลลังก แตก็ยังผูกพันทางเศรษฐกิจกับ[?event_target:EIC_FORMER.GetNonIdeologyName]ผานการเก็บภาษี [?event_target:EIC_FORMER.GetSheHeCap]บรรยายวาเปน 'ผูสืบทอดทางจิตวิญญาณของบริษัทอินเดียตะวันออกแหงศตวรรษที่ 19' \n\n [?event_target:EIC_FORMER.GetLeader]กลาววาแมเรื่องนี้อาจนําไปสูความสับสนชั่วคราวและความไรเสถียรภาพที่เพิ่มขึ้น แตจะปูทางไปสูความมั่นคงทางเศรษฐกิจรูปแบบใหมและการคืนเสถียรภาพใหภูมิภาคทีละนอย"
 GOE_RAJ_news.1.a: "ครั้งที่สองตองสําเร็จ"

 GOE_RAJ_news.2.t: "การกอกบฏในราชนาวีอินเดีย"
 GOE_RAJ_news.2.desc: "กระแสคอมมิวนิสตที่พุงสูงอยางรวดเร็วใน[RAJ.GetNonIdeologyName]มาถึงจุดเปลี่ยนสําคัญในวันนี้ เมื่อราชนาวีอินเดียประกาศกอกบฏ สงผลใหฝายบริหารอาณานิคมที่ออนแออยูแลวสูญเสียอิทธิพลอันนอยนิดที่เหลืออยูเหนือ[RAJ.GetNonIdeologyName] ผลที่ตามมาคือ[RAJ.GetLeader]ไดประกาศสถาปนาสาธารณรัฐประชาชนอินเดียขึ้นใหม\n\nเพื่อหลีกเลี่ยงความขัดแยงที่ไมอาจเลี่ยงได [RAJ.GetLeader]ไดบรรลุขอตกลงใหอํานาจปกครองตนเองแก[PAK.GetAdjective] ดวยการกอตั้งรัฐ[PAK.GetAdjective]อิสระที่นําโดย[PAK.GetLeader] พรอมการสงบศึกระหวางสองชาติซึ่งมีผลทันที"
 GOE_RAJ_news.2.a: "ราชลมสลายแลว"

 GOE_RAJ_news.3.t: "เสียงระฆังมรณะของราช"
 GOE_RAJ_news.3.desc: "การตัดสินใจฟนฟูบริษัทอินเดียตะวันออกใน[RAJ.GetNonIdeologyName]เกิดขึ้นโดย[?event_target:EIC_FORMER.GetNonIdeologyName]เมื่อหลายปกอน เพื่อสรางเสถียรภาพใหเศรษฐกิจ[RAJ.GetAdjective]ที่กําลังถดถอย เมื่อนักเศรษฐศาสตร[?event_target:EIC_FORMER.GetAdjective]โดยทั่วไปถือวาความเคลื่อนไหวนี้ประสบความสําเร็จ รัฐบาล[?event_target:EIC_FORMER.GetAdjective]จึงประกาศวา ดินแดนที่เหลือซึ่งราชควบคุมอยูจะถูกโอนให[RAJ.GetNameDefCap]โดยมีผลทันที ฝายบริหารของราชจะถูกยุบ และให[RAJ.GetNameDefCap]ดูแลอนุทวีปทั้งหมด"
 GOE_RAJ_news.3.a: "นาสนใจ"

 currentStateResistance: "  ขณะนี้มีการตอตาน §R[?var:THIS.resistance|1]%§!"
 currentStateCompliance: "  ขณะนี้มีการยอมรับปกครอง §Y[?var:THIS.compliance|1]%§!"

 GOE_RAJ_news.4.t: "ฮินดูสถานรวมเปนหนึ่ง"
 GOE_RAJ_news.4.desc: "มีรายงานวา[FROM.GetLeader]แหง[FROM.GetNameDef]ไดประกาศรวมประชาชนทั้งหมดบนอนุทวีปอินเดียเปนหนึ่งเดียว นับเปนการเปดบทใหมในประวัติศาสตรของเอเชียและของโลกทั้งใบ นักวิเคราะหหลายคนกลาวแลววาการรวมฮินดูสถานอาจสงผลอยางรุนแรงตอการเมืองโลก และหมายถึงการผงาดขึ้นของมหาอํานาจใหม"
 GOE_RAJ_news.4.a: "มหาอํานาจใหมจริง ๆ"
 GOE_RAJ_news.4.b: "นาสะพรึงกลัว"

