 AFG_political_events.158.desc: "$AFG_faqir_of_ipi$ ผูนําชนเผาสายจารีตนิยมใน[FROM.GetNonIdeologyName] ไดสงสารลับติดตอมายังรัฐบาลของเราเพื่อขอการสนับสนุนใหเขาไดขึ้นครองบัลลังก เขาสัญญาวาหากไดรับการหนุนหลังจากเรา เขาจะสรางชาติที่เขมแข็งซึ่งสอดคลองกับผลประโยชนของเรา"
 AFG_political_events.158.a: "เราตองการพันธมิตรเพิ่มในภูมิภาคนั้น"
 AFG_political_events.158.b: "จะไปยุงกับดินแดนที่หางไกลขนาดนั้นทําไม?"

 AFG_political_events.159.t: "[FROM.GetNameDefCap]ปฏิเสธแผนการ"
 AFG_political_events.159.desc: "รัฐบาล[FROM.GetAdjective]ตอบกลับคําขอของเราวาเสียใจที่ไมอาจใหการสนับสนุนการขึ้นครองบัลลังกของ $AFG_faqir_of_ipi$ ได โดยอางถึงความกังวลเรื่องการถูกดึงเขาไปพัวพันและสภาพภูมิรัฐศาสตรในปจจุบัน [FROM.GetAdjective]จึงตัดสินใจมุงไปที่ลําดับความสําคัญทางยุทธศาสตรอื่น"
 AFG_political_events.159.a: "กลาดีอยางไรถึงทรยศเรา!"

 AFG_political_events.160.t: "[FROM.GetNameDefCap]ตกลงสนับสนุนเรา"
 AFG_political_events.160.desc: "รัฐบาลของ[FROM.GetName]ตอบรับคําขอของเรา และตกลงสนับสนุนการขึ้นครองบัลลังกแหง[ROOT.GetNonIdeologyName]ของ $AFG_faqir_of_ipi$ การหนุนหลังนี้จะรวมถึงการสนับสนุนทางทหารและยุทโธปกรณ เพื่อใหภารกิจของเราประสบความสําเร็จ"
 AFG_political_events.160.a: "อนาคตของ[AFG.GetNonIdeologyName]เปนของเรา!"

 AFG_political_events.170.t: "พิธีราชาภิเษกของเจาชายโมกุล"
 AFG_political_events.170.desc: "มีรซา คูรชิด จาห บาฮาดูร เดินทางมาถึงประเทศของเราเมื่อไมกี่วันกอน และบัดนี้กําลังมีพิธีอันยิ่งใหญเพื่อรับรองการอางสิทธิ์ของเขาเหนือจักรวรรดิโมกุลและจักรวรรดิติมูริด พรอมทั้งสวมมงกุฎใหเขาเปนเอมีรองคใหมแหงอัฟกานิสถาน เมื่อถึงเวลาอันควร บางทีเราอาจอางสิทธิ์ในความรุงโรจนของจักรวรรดิเกาแกเหลานี้ได"
 AFG_political_events.170.a: "เอมีรองคใหมจงเจริญ!"

 AFG_political_events.171.t: "พิธีราชาภิเษกของเอมีรแหงบูคารา"
 AFG_political_events.171.desc: "ซัยยิด มีร มูฮัมหมัด อาลิม ขาน พํานักอยูในคาบูลนับตั้งแตถูกโซเวียตเนรเทศออกจากบูคารา เมื่อเขาไดรับการสวมมงกุฎเปนเอมีรองคใหมแหงอัฟกานิสถาน บางทีเราอาจใชการอางสิทธิ์ของเขาเพื่อทวงคืนเอเชียกลางจากภัยคุกคามของ[SOV.GetAdjective]ได"
 AFG_political_events.171.a: "เอมีรองคใหมจงเจริญ!"

 AFG_political_events.172.t: "[FROM.GetNameDefCap]ยึดครองวาซิริสถาน!"
 AFG_political_events.172.desc: "\nตนสัปดาหนี้ กองกําลังของ[FROM.GetNameDef]ไดเคลื่อนเขายึดครองดินแดนวาซิริสถานของเรา โดยอางวากําลังปฏิบัติภารกิจปกปองภูมิภาคจากการถูกศัตรูของพวกเขายึดครอง นี่เปนการกระทําที่เขาขายสงครามอยางชัดเจน แตเราก็อาจเลือกที่จะเพิกเฉยได เพราะพวกเขาคงไมไดตองการหาเรื่องกับเรา หากแตตองการรวมชาวปาทานที่กระจัดกระจายใหเปนหนึ่งเดียวอีกครั้ง"
 AFG_political_events.172.a: "ไมคุมที่จะสูรบกันเพราะเรื่องนี้"
 AFG_political_events.172.b: "พวกเขาคิดวาตัวเองเปนใคร?"

 AFG_political_events.173.t: "นายกรัฐมนตรีจากราชวงศคนใหม"
 AFG_political_events.173.desc: "เนื่องจากมีผูตั้งคําถามตอการตัดสินใจของ $AFG_mohammad_hashim_khan$ เปนจํานวนมาก จึงมีการตัดสินใจรักษาการปกครองของราชวงศไวดวยการแตงตั้งพี่นองคนหนึ่งของเขาเปนผูนําคนใหม ซึ่งอยูใตบังคับของ $AFG_mohammed_zahir_shah$ ใครจะไดรับแตงตั้งมาแทนเขา?"
 AFG_political_events.173.a: "$AFG_shah_mahmud_khan$ ผูมั่นคงเสมอตนเสมอปลาย"
 AFG_political_events.173.b: "$AFG_sardar_shah_wali_khan$ ผูปราดเปรื่องดานการทหาร"
 AFG_political_events.173.c: "$AFG_mohammed_daoud_khan$ ผูมีแนวคิดกาวหนากวา"

 #RAJ
 #India wants to invade Bhutan
 GOE_RAJ.1.t: "[FROM.GetName]ขออนุญาตบุก[BHU.GetName]"
 GOE_RAJ.1.desc: "[FROM.GetNameDef]รัฐในอารักขาของเรามองเห็นโอกาสขยายอิทธิพลของเราในอนุทวีปอินเดียดวยการพิชิตราชอาณาจักรฤๅษี[BHU.GetAdjective] ซึ่งอาจเปดประตูสูเอเชียตอนในได"
 GOE_RAJ.1.a: "ความคิดที่ยอดเยี่ยม"
 GOE_RAJ.1.b: "นั่นกาวราวเกินไป"

 GOE_RAJ.2.t: "[FROM.GetName]อนุมัติ"
 GOE_RAJ.2.desc: "[FROM.GetName]อนุมัติคําขอขยายดินแดนของเรา คงมีการตอตานขวางทางเราไมมากนัก"
 GOE_RAJ.2.a: "ยอดเยี่ยม"

 GOE_RAJ.3.t: "[FROM.GetName]ปฏิเสธ"
 GOE_RAJ.3.desc: "[FROM.GetName]ปฏิเสธคําขอขยายดินแดนของเรา โดยระบุวาการทําใหอนุทวีปไรเสถียรภาพในเวลานี้ไมเปนประโยชนตอราชบัลลังก"
 GOE_RAJ.3.a: "นาเสียดาย"

 #India demands Bhutan protectorate
 GOE_RAJ.4.t: "[FROM.GetName]เรียกรองใหยอมสยบ"
 GOE_RAJ.4.desc: "ขณะที่สถานการณความมั่นคงในภูมิภาคทรุดลงอยางรวดเร็ว [FROM.GetNameDef]ไดเรียกรองใหราชอาณาจักรของเราเขาไปอยูในเขตอิทธิพลของพวกเขาอยางมั่นคง\nรัฐบาล[FROM.GetAdjective]เนนยํ้าวาเราจะยังคงมีเอกราชอยูบาง แตพวกเขาไมอาจยอมรับความเสี่ยงดานความมั่นคงที่อาจเกิดขึ้นตอรัฐไดอีกตอไป"
 GOE_RAJ.4.a: "เงื่อนไขที่รับไมได"
 GOE_RAJ.4.b: "เราตองยอม"

 GOE_RAJ.5.t: "[FROM.GetName]ปฏิเสธ"
 GOE_RAJ.5.desc: "[FROM.GetName]ปฏิเสธขอเรียกรองของเรา โดยยํ้าวาตนเปนราชอาณาจักรที่เปนเอกราช มีกฎเกณฑและความกังวลเปนของตนเอง"
 GOE_RAJ.5.a: "รับไมได"
 
 GOE_RAJ.6.t: "[FROM.GetName]ยอมจํานน"
 GOE_RAJ.6.desc: "[FROM.GetName]ยอมรับขอเรียกรองของเรา ซึ่งเทากับทําใหประเทศของพวกเขากลายเปนรัฐในอารักขา"
 GOE_RAJ.6.a: "ยอดเยี่ยม!"

 GOE_RAJ.7.t: "สุภาษ จันทรา โบส เสนอใหโคนลมรัฐบาล[GetRajAdjective]"
 GOE_RAJ.7.desc: "ในความพยายามเรียกรองเอกราชให[GetRajName] สุภาษ จันทรา โบส ผูนําชาตินิยม ไดเขามาเสนอแผนบอนทําลายเสถียรภาพของอนุทวีป[GetRajAdjective] หากเราตอบรับ เราจะถูกเรียกใหชวยโคนลมการยึดครองของจักรวรรดิใน[GetRajAdjective]เมื่อถึงเวลาอันเหมาะสม"
 GOE_RAJ.7.a: "เราจะชวยเหลือเขา"
 GOE_RAJ.7.a_tt: "§Yเราจะถูกเรียกใหทําสงครามกับ[RAJ.GetName]เมื่อจันทรา โบส เริ่มการปฏิวัติ§!"
 GOE_RAJ.7.b: "เรามีแผนอื่น"

 GOE_RAJ.8.t: "[FROM.GetName]ตกลงชวยเหลือเรา"
 GOE_RAJ.8.desc: "[FROM.GetName]สงสัญญาณวาจะสนับสนุนเราในการตอสูเพื่อเอกราช"
 GOE_RAJ.8.a: "ใกลเอกราชเขาไปอีกกาว"
 
 GOE_RAJ.9.t: "[FROM.GetName]ปฏิเสธที่จะชวยเหลือเรา"
 GOE_RAJ.9.desc: "[FROM.GetName]แถลงวาตนมีแผนการที่จะเสียหายหากเขาไปพัวพันในสงครามกับ[ENG.GetAdjective] จึงจะงดเวนการชวยเหลือเรา"
 GOE_RAJ.9.a: "ยังไงเราก็ไมตองการความชวยเหลืออยูแลว" 
 
 GOE_RAJ.10.t: "[FROM.GetName]เรียกรองให[JAP.GetName]ทําตามคําสัตย"
 GOE_RAJ.10.desc: "สุภาษ จันทรา โบส เริ่มการปฏิวัติแลว โทรเลขฉบับหนึ่งมาถึงพรอมขอความวา หากเราตั้งใจจะรักษาคํามั่นสัญญา บัดนี้ถึงเวลาแลว \nนี่เปนโอกาสที่จะกําจัดศัตรูสําคัญในเอเชียใหสิ้นซากได"
 GOE_RAJ.10.a: "เราจะสู"
 GOE_RAJ.10.b: "เราจําตองผิดคําสัตย"
 
 GOE_RAJ.11.t: "[FROM.GetName]รักษาคํามั่นสัญญา"
 GOE_RAJ.11.desc: "[FROM.GetName]กําลังระดมพลเต็มอัตราและพรอมชวยเหลือเราในการตอสู"
 GOE_RAJ.11.a: "เลือดและเสรีภาพ!"
 
 GOE_RAJ.12.t: "[FROM.GetName]ผิดคํามั่นสัญญา"
 GOE_RAJ.12.desc: "ไมมีทหาร[FROM.GetAdjective]สักนายที่พรอมมาชวยเรา ความชวยเหลือที่สัญญาไวไมปรากฏใหเห็น และโตเกียวก็เงียบงัน เราไดแตสันนิษฐานวาเราตองสูเพียงลําพัง"
 GOE_RAJ.12.a: "พวกผิดคําสัตย!"
  
 GOE_RAJ.13.t: "ยกหมูเกาะอันดามันให[GetRajName]หรือไม?"
 GOE_RAJ.13.desc: "รัฐบาลอาซาด ฮินด ตองการเมืองหลวงเฉพาะสําหรับงานบริหาร ซึ่งอยูหางไกลจากแนวหนาจนกวาชัยชนะของพวกเขาจะมั่นคง\nหมูเกาะอันดามันที่เราเพิ่งพิชิตไดอาจเหมาะสมอยางยิ่งสําหรับเรื่องนี้" 
 GOE_RAJ.13.a: "มอบใหพวกเขา"
 GOE_RAJ.13.b: "ที่จริงเราตองใชมัน"
 
 GOE_RAJ.14.t: "[JAP.GetName]มอบหมูเกาะอันดามันให"
 GOE_RAJ.14.desc: "[JAP.GetAdjective]บุกยึดหมูเกาะอันดามันไดสําเร็จ และตัดสินใจโอนการควบคุมใหแกเรา เพื่อใหเราจัดตั้งรัฐบาลที่เหมาะสมขึ้นที่นั่น" 
 GOE_RAJ.14.a: "ยอดเยี่ยม"
 GOE_RAJ.14.tt: "เราสามารถยายเมืองหลวงไปยังหมูเกาะอันดามันไดดวยการทําแผนยุทธศาสตร §Y$RAJ_shaheed_and_swara$j§! ใหสําเร็จ"
 
 GOE_RAJ.15.t: "[RAJ.GetNameDefCap]ยังคงควบคุม[992.GetName]"
 GOE_RAJ.15.desc: "[RAJ.GetNameDefCap]แจงเราวาตั้งใจจะคงการควบคุมทาเรือเอเดนไว แมกอนหนานี้จะมีแผนสงมอบการควบคุมใหแกราชบัลลังก\nตามคาด เรื่องนี้สรางความปนปวนในรัฐสภาไมนอย โดยเฉพาะจากวินสตัน เชอรชิลล แตในตอนนี้ยังไมมีแผนดําเนินการทางวินัยใด ๆ"
 GOE_RAJ.15.a: "พวกเขากําลังวางแผนอะไรอยู?"
 
 GOE_RAJ.16.t: "[FROM.GetNameDefCap]สงมอบ[992.GetName]" 
 GOE_RAJ.16.desc: "ตามที่วางแผนไวภายใตพระราชบัญญัติรัฐบาลอินเดีย ค.ศ. 1935 ฝายบริหาร[GetRajAdjective]ไดสงมอบความรับผิดชอบดานการบริหาร[992.GetName]ใหแกเรา"
 GOE_RAJ.16.a: "ภาระงานบริหารลดลง"
 
 GOE_RAJ.17.t: "[RAJ.GetName]เคลื่อนไหวตอตาน[TIB.GetName]"
 GOE_RAJ.17.desc: "[RAJ.GetName]แสดงทาทีกาวราวตามแนวพรมแดนกับ[TIB.GetName] โดยประกาศเจตนาจะขยายเขตความมั่นคงเพื่อปกปองดินแดนใจกลางของตน ซึ่งขัดตอผลประโยชนของเราในภูมิภาคโดยสิ้นเชิง"
 GOE_RAJ.17.a: "เสนอการรับประกันแก[TIB.GetName]"
 GOE_RAJ.17.b: "เราไมอาจเปดแนวรบใหมไดอีก"
 
 GOE_RAJ.18.t: "[RAJ.GetLeader]เรียกรองใหคืนดินแดนอาณานิคม"
 GOE_RAJ.18.desc: "ขณะที่[RAJ.GetNameDefCap]สลัดแอกแหงอดีตทิ้ง [RAJ.GetLeader]ก็กลาบาบิ่นถึงขั้นเรียกรองใหเราคืนดินแดนอาณานิคมในพื้นที่ การรวมอนุทวีปเปนรัฐเดียวที่เขมแข็งดูจะเปนเรื่องสําคัญที่สุดสําหรับประเทศที่เพิ่งถือกําเนิดนี้"
 GOE_RAJ.18.a: "พวกเขาจะตองยึดมันไปดวยกําลัง"
 GOE_RAJ.18.b: "เราไมอาจรับภาระสงครามที่หางไกลบานเกิดขนาดนี้ได"
 
 GOE_RAJ.19.t: "[FROM.GetName]ปฏิเสธที่จะสงมอบอาณานิคม"
 GOE_RAJ.19.desc: "รัฐบาล[FROM.GetAdjective]ดื้อดึงปฏิเสธที่จะสงมอบดินแดนอันชอบธรรมของ[GetRajAdjective] แมจะถูกเตือนซํ้าแลวซํ้าเลาวาสถานะเดิมเปนสิ่งที่ยอมรับไมได"
 GOE_RAJ.19.a: "ถาเชนนั้นเราคงตองยึดมันดวยกําลัง"
 
 GOE_RAJ.20.t: "[FROM.GetName]สงมอบอาณานิคม"
 GOE_RAJ.20.desc: "[FROM.GetName]ยอมรับขอเรียกรองของเราอยางไมเต็มใจ พวกเขาแสดงชัดเจนวาการเมืองแบบใชอํานาจบีบบังคับเชนนี้จะไมอยูไดนาน และที่ยอมไดก็เพียงในฐานะคาชดเชยเล็กนอยเทานั้น"
 GOE_RAJ.20.a: "ความยุติธรรมไดรับการชําระ"
 
 GOE_RAJ.21.t: "โซตรวนที่ขาดสะบั้น"
 GOE_RAJ.21.desc: "รัฐบาลเกาภายใตแอกของจักรวรรดินิยมอังกฤษไดยอมจํานน และคณะรัฐบาลไดหนีออกนอกประเทศไปแลว ขณะที่เรากําลังสรางความมั่นคงในการควบคุมอนุทวีป เราตองตัดสินใจวาจะจัดการกับเจาเหนือหัวเกาของเราอยางไร"
 GOE_RAJ.21.a: "เสนอสันติภาพใหพวกเขา"
 GOE_RAJ.21.b: "จะไมมีสันติภาพสําหรับพวกจักรวรรดินิยม"
 
 GOE_RAJ.22.t: "บริติชราชลมสลายแลว"
 GOE_RAJ.22.desc: "โทรเลขอันรอนรนจากลอรดลินลิธโกวแจงเราวาฝายกบฏที่นําโดย[RAJ.GetLeader]ไดยึดอํานาจควบคุมประเทศแลว\nลินลิธโกวกําลังเดินทางกลับมาพรอมขอเสนอสันติภาพโดยไมมีเงื่อนไขจาก[RAJ.GetLeader] โดยมีขอแมวาเราตองสละการอางสิทธิ์ทั้งหมดเหนืออินเดีย"
 GOE_RAJ.22.a: "ไมมีการประนีประนอม"
 GOE_RAJ.22.b: "ตะวันออกลมสลายแลว"
 
 GOE_RAJ.23.t: "[ENG.GetName]ปฏิเสธขอเสนอสันติภาพ"
 GOE_RAJ.23.desc: "[ENG.GetName]ปฏิเสธขอเสนอสันติภาพของเรา ชาว[ENG.GetAdjective]ตั้งใจจะทําสงครามนี้ตอไปจนกวาจะไดไขมุกของตนกลับคืน"
 GOE_RAJ.23.a: "ก็ตามนั้น"

 GOE_RAJ.24.t: "[ENG.GetName]ยอมรับขอเสนอสันติภาพ"
 GOE_RAJ.24.desc: "[ENG.GetName]ยอมรับขอเสนอสันติภาพของเราอยางไมเต็มใจ [GetRajName]เปนอิสระที่จะกําหนดชะตากรรมของตนเองแลว"
 GOE_RAJ.24.a: "เลือดไดหลั่งรินไปแลว"
 
 GOE_RAJ.25.t: "[RAJ.GetName]ทําสันติภาพโดยไมมีเงื่อนไขกับ[ENG.GetName]"
 GOE_RAJ.25.desc: "[RAJ.GetAdjective]ไดลงนามสันติภาพกับอดีตเจาเหนือหัว และไดรับเอกราชโดยสมบูรณจากการปกครองของจักรวรรดิในที่สุด ตอนนี้เรามีทางเลือกที่จะทําเชนเดียวกัน และถอนตัวออกมาพรอมชัยชนะทางขวัญกําลังใจครั้งใหญ"
 GOE_RAJ.25.a: "ลงนามสันติภาพ"
 GOE_RAJ.25.b: "เรายังไมจบ"

 GOE_RAJ.26.t: "สุภาษ จันทรา โบส ไดรับการปลดปลอยจากคุก"
 GOE_RAJ.26.desc: "เราปลดปลอยผูนําของเราออกจากคุกไดสําเร็จ นับเปนพรอันยิ่งใหญที่จะทําใหขบวนการของเรามีระบบระเบียบ"
 GOE_RAJ.26.a: "ยอดเยี่ยม!"

 GOE_RAJ.27.t: "[RAJ.GetNameDefCap]ตองการสันติภาพโดยไมมีเงื่อนไข"
 GOE_RAJ.27.desc: "เมื่อหลุดพนจากโซตรวนของผูกดขี่แลว [RAJ.GetNameDefCap]ก็ไมตองการใหประเทศของเราทั้งสองทําสงครามที่ไรผลอีกตอไป" 
 GOE_RAJ.27.a: "ไม สงครามตองดําเนินตอไป"
 GOE_RAJ.27.b: "ฟงดูเขาทา"

 GOE_RAJ.28.t: "[FROM.GetName]ปฏิเสธที่จะลงนามสันติภาพโดยไมมีเงื่อนไข"
 GOE_RAJ.28.desc: "[FROM.GetName]ปฏิเสธความพยายามถอนตัวจากความขัดแยงของเรา นี่จะเปนจุดจบของเรา หรือของพวกเขากันแน?" 
 GOE_RAJ.28.a: "ลางราย"

 GOE_RAJ.29.t: "อุปราชคนใหมแหง[RAJ.GetName]"
 GOE_RAJ.29.desc: "ขณะที่วาระการดํารงตําแหนงอุปราชแหงอินเดียของฟรีแมน ฟรีแมน-โทมัส ใกลสิ้นสุดลง เราตองตัดสินใจวาจะแตงตั้งผูที่เหมาะสมมาแทน หรือจะขยายวาระของมารควิสแหงวิลลิงดันตอไป"
 GOE_RAJ.29.a: "วิกเตอร โฮป จะรับตําแหนงแทนทานเอิรล"
 GOE_RAJ.29.b: "คงฟรีแมน-โทมัสไว"

 GOE_RAJ.30.t: "การบริหารของบริติชราชลมสลาย"
 GOE_RAJ.30.desc: "หลังปกครองมาหลายศตวรรษ ในที่สุดฝายบริหาร[ENG.GetAdjective]ก็กําลังถอนตัวออกจากอินเดีย เจาหนาที่เก็บขาวของในสํานักงาน ผูบริหารอาณานิคมรางรายงานฉบับสุดทาย และธงยูเนียนแจ็กถูกเชิญลงจากอาคารรัฐบาล อยางไรก็ตาม การเปลี่ยนผานไมไดราบรื่นนัก ปญหาเรื่องพรมแดนและการควบคุมกองทัพยังไมไดขอยุติ ทําใหเอกราชโดยสมบูรณลาชาออกไปบาง"
 GOE_RAJ.30.a: "ในที่สุด เราก็จะเปนอิสระ"
 GOE_RAJ.30.b: "ไมละ เราชอบอยูที่นี่"
 GOE_RAJ.30_we_are_leaving_tt: "§Y[RAJ.GetName]§!จะยังอยูใตการควบคุมของเราชั่วคราวระหวางที่พวกเขาจัดระบบบริหารของตนใหเรียบรอย อยางไรก็ตาม สุดทายพวกเขาจะแยกตัวเปนอิสระ"

 GOE_RAJ.31.t: "ราคาโกลาหลใน[RAJ.GetName]"
 GOE_RAJ.31.desc: "ขณะที่[RAJ.GetName]พยายามฟนตัวจากภาวะเศรษฐกิจตกตํ่าครั้งใหญ การควบคุมราคาของพวกเขาดูเหมือนจะทําใหประเทศไรเสถียรภาพ การผูกคาเงินรูปไวกับเงินสเตอรลิงเสี่ยงจะทําใหทั้งสองประเทศตกอยูในความปนปวนทางเศรษฐกิจ\nกลุมเอกชนกลุมหนึ่งเขามาเสนอใหแบงราชออกเปนสองสวนเพื่อบรรเทาภาระทางการเงินของรัฐ สวนหนึ่งอยูใตการควบคุมของเอกชน และอีกสวนยังอยูใตการควบคุมของราชบัลลังก\nการอยูเฉยอาจเสี่ยงตอผลลัพธที่เลวรายยิ่งกวา"
 GOE_RAJ.31.a: "เราตองทํา"
 GOE_RAJ.31.a_tt: "บริษัทอินเดียตะวันออกจะถูกกอตั้งขึ้น และเขายึดครองบางสวนของอินเดีย"
 GOE_RAJ.31.b: "ไมมีวัน"

 GOE_RAJ.32.t: "ปญหาเรื่องเอเดน"
 GOE_RAJ.32.desc: "ตามแผนของรัฐบาล[ENG.GetAdjective] เราจะตองสงมอบจังหวัดเอเดนใหแกพวกเขา แตหากตองการ เราก็นาจะผลักดันเพื่อเก็บมันไวได"
 GOE_RAJ.32.a: "สงมอบให"
 GOE_RAJ.32.b: "เก็บไว"
 GOE_RAJ.32.b_tt: "เราจะคงการควบคุม§Yจังหวัดเอเดน§!ไว ทําใหเราสามารถทําแผนยุทธศาสตร §Yเมืองทาการคา§! ใหสําเร็จได"

 GOE_RAJ.33.t: "การลุกฮือในอินเดียตะวันตกเฉียงเหนือ!"
 GOE_RAJ.33.desc: "กลุมหนึ่งที่อางตนเปนทายาทโดยชอบธรรมของจักรวรรดิที่ลมสลายไปนานแลว ไดประกาศสงครามเพื่อเอกราชในดินแดนตะวันตกเฉียงเหนือสุด รวบรวมกลุมที่ไมพอใจมาอยูใตธงของตน แมอินเดียสวนใหญยังอยูในการควบคุม แตการกบฏครั้งนี้คุกคามเสถียรภาพ นี่จะเปนเพียงเชิงอรรถในประวัติศาสตร หรือการกลับมาของจักรวรรดิ?"
 GOE_RAJ.33.a: "เราจะไมยอมใหเปนเชนนี้"
 GOE_RAJ.33.b_tt: "การเสียการควบคุมคุชราตและเดลีจะบีบใหตองทําสันติภาพโดยไมมีเงื่อนไข"
 GOE_RAJ.33.b: "เรามีเรื่องอื่นตองกังวล"
 GOE_RAJ.33.c: "สูชัยชนะ!"
 GOE_RAJ_33_c_tt: "§Rเราตองอยูรอดใหได 255 วันจนกวาจะมีขอเสนอหยุดยิง หากเรายึดครองรัฐทั้งหมดในอินเดียตะวันตก ตะวันออก กลาง ใต หรือเหนือไดในขณะหยุดยิง เราจะไดรับดินแดนเพิ่มขึ้นมากกวาเดิม!§!"

 GOE_RAJ.34.t: "การบริหารของ[UK_INDIA.GetName]ลมสลาย"
 GOE_RAJ.34.desc: "หายนะใน[UK_INDIA.GetName]! ฝายบริหารทองถิ่นลมสลายเพราะสงครามที่ยืดเยื้อทางตะวันตก เพื่อรักษาการควบคุมประเทศไว พวกเขาจึงเสนอประนีประนอมดานดินแดนแกฝายกบฏ เราอาจไมยอมรับกบฏเหลานี้ แตในตอนนี้ สงครามไดพายแพไปแลว"
 GOE_RAJ.34.a: "หายนะ!"

 GOE_RAJ.35.t: "[ENG.GetName]ปลอยเราไป"
 GOE_RAJ.35.desc: "บริติชราชสิ้นสุดลงโดยไมมีการยิงแมแตนัดเดียว เราไดสรางความมั่นคงในการควบคุมอินเดีย และรัฐบาลของสมเด็จพระราชาธิบดีซึ่งเหนื่อยหนายกับภาระของจักรวรรดิก็เลือกที่จะไมแทรกแซง"
 GOE_RAJ.35.a: "ไมคาดคิดเลย"

 GOE_RAJ.37.t: "คําเตือนจากไวตฮอลล"
 GOE_RAJ.37.desc: "นโยบายการยึดครองลาสุดของเราทําใหกิจกรรมตอตานพุงสูงขึ้นอยางที่คาดไว และดูเหมือนจะเรียกความสนใจจากรัฐบาลของสมเด็จพระราชาธิบดีได จดหมายที่ใชถอยคํารุนแรงฉบับหนึ่งมาถึง ชี้แจงอยางชัดแจงวาลอนดอนไมเห็นดวยกับแนวทางการปกครองอันไมรอบคอบของเรา ขอความเต็มไปดวยถอยคําที่เลือกสรรอยางระมัดระวัง แตก็ยังแฝงความขมขูอยางชัดเจน กลาวโดยไมออมคอมคือ เราไดรับคําแนะนําใหทบทวนจุดยืน มิฉะนั้นเราอาจพบวาตนเองถูกชวยเหลือใหฟนฟูความสงบเรียบรอยดวยวิธีที่เราอาจไมชอบใจนัก"
 GOE_RAJ.37.a: "เราควรทาดูวาพวกเขาแคขูหรือไม?"

 GOE_RAJ.38.t: "จักรวรรดิโตกลับ"
 GOE_RAJ.38.desc: "ดูเหมือนรัฐบาล[ENG.GetAdjective]จะทนแนวทางการปกครองทองถิ่นของเราไมไหวอีกตอไป กองกําลังอังกฤษไดเดินทางมาถึงอยางเต็มกําลังภายใตขออางวาเปนปฏิบัติการสรางเสถียรภาพ เครือขายการตอตานถูกถอนรากถอนโคน กลุมกอความวุนวายถูกปราบจนสงบ และอิทธิพลของเราเองก็ถูกปดทิ้งไปอยางเรียบรอย\nสหราชอาณาจักรยืนยันวาทั้งหมดนี้เปนเพียงการชั่วคราว เปนการแทรกแซงที่จําเปนเพื่อปกปองบูรณภาพของภูมิภาค แตสารนั้นชัดเจน: พวกเขาเปนผูมีอํานาจที่นี่ และหากเราตองการปกครอง เราตองทําตามเงื่อนไขของพวกเขา"
 GOE_RAJ.38.a: "เราจะทําตัวดี ๆ ไปกอน"

 GOE_RAJ.39.t: "การเจรจากับสหภาพแรงงาน"
 GOE_RAJ.39.desc: "ในหองใตดินที่มืดสลัว ผูนําสหภาพแรงงานตกลงพบกับเรา หางไกลจากสายตาสอดรูสอดเห็นของรัฐบาล พวกเขามีอิทธิพลเหนือชาวนา คนงานโรงงาน และพอคาปลา ซึ่งก็คือคนธรรมดาสามัญ พวกเขายินดีจะสนับสนุนความพยายามโคนลมรัฐบาลปจจุบันของเรา แตตองการขอแลกเปลี่ยนบางอยางเปนการตอบแทน"
 GOE_RAJ.39.a: "รับประกันความปลอดภัยของคนงาน"
 GOE_RAJ.39.a_tt: "เมื่อเราไดอํานาจ เราจะตองยกระดับความปลอดภัยของคนงานภายใน §Y6 เดือน§! หากไมทําจะทําใหสหภาพแรงงานไมพอใจ การยกระดับความปลอดภัยของคนงานจะใหผล: "
 GOE_RAJ.39.b: "รับประกันคาแรงขั้นตํ่า"
 GOE_RAJ.39.b_tt:  "เมื่อเราไดอํานาจ เราจะตองรับประกันคาแรงขั้นตํ่าภายใน §Y6 เดือน§! หากไมทําจะทําใหสหภาพแรงงานไมพอใจ การรับประกันคาแรงขั้นตํ่าจะใหผล: "
 GOE_RAJ.39.c: "ยุติการประชุม" 
 GOE_RAJ.39.c_tt: "เราจะสามารถพบกับพวกเขาไดอีกจนกวาเราจะทํา §Y$RAJ_royal_indian_navy_mutiny$§! สําเร็จ"

 GOE_RAJ.40.t: "การปะทะที่ชายแดนทางเหนือของเดลี"
 GOE_RAJ.40.desc: "กองกําลังอินเดียไดขามเขามาในดินแดนพิพาทใกล[986.GetName] การปะทะเล็ก ๆ กําลังปะทุขึ้นทั่วเนินเขาและที่ราบทางเหนือของเดลี พวกเขาอางวาดินแดนนี้เปนของการปฏิวัติตามสิทธิทางประวัติศาสตร ในสุนทรพจนทางวิทยุ นายกรัฐมนตรีเรียกปากีสถานวาเปนซากของการแบงแยกยุคอาณานิคม ความตึงเครียดกําลังทวีขึ้นและการปะทะดูจะใกลเขามาแลว"
 GOE_RAJ.40.a: "กลาดีอยางไร?"

 GOE_RAJ.41.t: "[RAJ.GetName]ยึด[986.GetName]"
 GOE_RAJ.41.desc: "ทหารอินเดียยึดดินแดนชายแดนไดแลว กองกําลังปากีสถานถอยรนหลังการสูรบอยางหนัก และบัดนี้ธงคอมมิวนิสตก็โบกสะบัดเหนือภูมิภาค การกระจายเสียงของอินเดียเรียกสิ่งนี้วาชัยชนะของประชาชน"
 GOE_RAJ.41.a: "การปฏิวัติเดินหนาตอไป"
 GOE_RAJ.41.b: "ความสูญเสียอันขมขื่น"

 GOE_RAJ.42.t: "การปะทะที่ชายแดนใน[431.GetName]"
 GOE_RAJ.42.desc: "กองกําลังอินเดียไดขามเขามาในดินแดนพิพาทใกล[431.GetName] การปะทะเล็ก ๆ กําลังปะทุขึ้นทั่วที่ราบทางเหนือของกัลกัตตา พวกเขาอางวาดินแดนนี้เปนของการปฏิวัติตามสิทธิทางประวัติศาสตร ในสุนทรพจนทางวิทยุ นายกรัฐมนตรีเรียกปากีสถานวาเปนซากของการแบงแยกยุคอาณานิคม ความตึงเครียดกําลังทวีขึ้นและการปะทะดูจะใกลเขามาแลว"
 GOE_RAJ.42.a: "กลาดีอยางไร?"

 GOE_RAJ.43.t: "[RAJ.GetName]ยึด[431.GetName]"
 GOE_RAJ.43.desc: "ทหารอินเดียยึดกัลกัตตาไดแลว กองกําลังปากีสถานถอยรนหลังการสูรบอยางหนัก และบัดนี้ธงคอมมิวนิสตก็โบกสะบัดเหนือภูมิภาค การกระจายเสียงของอินเดียเรียกสิ่งนี้วาชัยชนะของประชาชน"
 GOE_RAJ.43.a: "การปฏิวัติเดินหนาตอไป"
 GOE_RAJ.43.b: "ความสูญเสียอันขมขื่น"

 GOE_RAJ.44.t: "การปะทะที่ชายแดนใน[433.GetName]"
 GOE_RAJ.44.desc: "กองกําลังอินเดียไดขามเขามาในดินแดนพิพาทใกล[433.GetName] ทหารอินเดียยึดทัชมาฮาลไวได พวกเขาอางวาดินแดนนี้เปนของการปฏิวัติตามสิทธิทางประวัติศาสตร ในสุนทรพจนทางวิทยุ นายกรัฐมนตรีเรียกปากีสถานวาเปนซากของการแบงแยกยุคอาณานิคม ความตึงเครียดกําลังทวีขึ้นและการปะทะดูจะใกลเขามาแลว"
 GOE_RAJ.44.a: "กลาดีอยางไร?"

 GOE_RAJ.45.t: "[RAJ.GetName]ยึด[433.GetName]"
 GOE_RAJ.45.desc: "ทหารอินเดียยึด[433.GetName]ไดแลว กองกําลังปากีสถานถอยรนหลังการสูรบอยางหนัก และบัดนี้ธงคอมมิวนิสตก็โบกสะบัดเหนือภูมิภาค การกระจายเสียงของอินเดียเรียกสิ่งนี้วาชัยชนะของประชาชน"
 GOE_RAJ.45.a: "การปฏิวัติเดินหนาตอไป"
 GOE_RAJ.45.b: "ความสูญเสียอันขมขื่น"

 GOE_RAJ.46.t: "การลุกฮือของประชาชน"
 GOE_RAJ.46.desc: "ความไมสงบในชนบทปะทุถึงขีดสุด เมื่อนักปลุกระดมคอมมิวนิสตที่เคลื่อนไหวอยูในเงามืดมานานไดเรียกรองใหประชาชนจับอาวุธ หมูบานตาง ๆ ลุกขึ้นตอตานเจาที่ดิน และธงรูปคอนเคียวก็โบกสะบัดเหนือศาลาวาการเมือง\n\nการลุกฮือครั้งนี้มีรองรอยของ[FROM.GetName]อยูทั่วไป ทั้งคําขวัญและอาวุธที่ใช\n\n สงครามครั้งใหมเพื่อหัวใจและจิตวิญญาณของชาติเราไดเริ่มตนขึ้นแลว"
 GOE_RAJ.46.a: "ขับไลพวกแดงออกไป!"
 GOE_RAJ.46.b: "เราทานแรงกดดันไมไหว"
 GOE_RAJ.46.c: "เรากําลังมุงหนาสูคอมมิวนิสตอยูแลว!"

 GOE_RAJ.47.t: "อิทธิพลอินเดียแผขยาย"
 GOE_RAJ.47.desc: "สาธารณรัฐประชาชนอินเดียเริ่มแผอิทธิพลทางอุดมการณออกไปนอกพรมแดน\n\nในชวงไมกี่สัปดาหที่ผานมา เสียงที่สนับสนุนอินเดียดังขึ้นเรื่อย ๆ ในแวดวงการเมืองของเรา สิ่งพิมพตาง ๆ ยกยองรูปแบบสังคมนิยมแบบกระจายอํานาจของพวกเขา การตอตานอิทธิพลตางชาติ และความสําเร็จที่เห็นไดชัดในการเปลี่ยนแปลงรัฐหลังยุคอาณานิคม\n\nยังไมชัดเจนวานี่เปนสวนหนึ่งของความพยายามอยางเปนระบบของ[From.GetNameDef]ในการเปลี่ยนทิศทางการเมืองภายในของเราหรือไม แตการมีอยูของพวกเขาก็เปนที่รูสึกได"
 GOE_RAJ.47.a: "เราจะจับตาพวกเขาอยางใกลชิด"

 GOE_RAJ.48.t: "อิทธิพลของการปฏิวัติอินเดียใน[This.GetNameDef]"
 GOE_RAJ.48.desc: "หลังจากสิ่งพิมพและการกระจายเสียงหลายครั้งที่ไดแรงบันดาลใจจาก[RAJ.GetNameDef] สังคม[This.GetAdjective]สวนหนึ่งที่เพิ่มขึ้นเรื่อย ๆ กําลังหันไปหารูปแบบสังคมนิยมเกษตรกรรมแบบอินเดีย สารเรื่องการปฏิรูปที่ดิน การปกครองตนเอง และเอกภาพตอตานจักรวรรดินิยม กําลังไดรับเสียงตอบรับจากทั้งกรรมกรและชาวนา\n\nแมจะยังเปนขบวนการชายขอบ แตผูนํา[This.GetAdjective]หลายคนเกรงวาหากไมตอบโตอยางหนักแนน ความรูสึกเหลานี้อาจลุกลามกลายเปนการนัดหยุดงานครั้งใหญ หรือเลวรายกวานั้น คือการปลุกระดมดวยอาวุธที่สอดคลองกับเปาหมายการปฏิวัติของ[From.GetNameDef]"
 GOE_RAJ.48.a: "นากังวล"



 GOE_RAJ.51.t: "[PAK.GetName]ยังคงควบคุม[986.GetName]"
 GOE_RAJ.51.desc: "ทหารปากีสถานยังคงยึดดินแดนชายแดนไวได กองกําลังอินเดียถอยรนหลังการสูรบอยางหนัก และปากีสถานยังคงครองภูมิภาคนี้ตอไป การกระจายเสียงของอินเดียกําลังเซ็นเซอรความลมเหลวนี้เพื่อเลี่ยงความอับอายของชาติ"
 GOE_RAJ.51.a: "ความสูญเสียอันขมขื่น"
 GOE_RAJ.51.b: "[986.GetName]เปนของเราโดยชอบธรรม"

 GOE_RAJ.49.t: "[PAK.GetName]ยังคงควบคุม[431.GetName]"
 GOE_RAJ.49.desc: "ทหารปากีสถานยังคงยึดกัลกัตตาไวได กองกําลังอินเดียถอยรนหลังการสูรบอยางหนัก และปากีสถานยังคงครองภูมิภาคนี้ตอไป การกระจายเสียงของอินเดียกําลังเซ็นเซอรความลมเหลวนี้เพื่อเลี่ยงความอับอายของชาติ"
 GOE_RAJ.49.a: "ความสูญเสียอันขมขื่น"
 GOE_RAJ.49.b: "[431.GetName]เปนของเราโดยชอบธรรม"

 GOE_RAJ.50.t: "[PAK.GetName]ยังคงควบคุม[433.GetName]"
 GOE_RAJ.50.desc: "ทหารปากีสถานยังคงยึด[433.GetName]ไวได กองกําลังอินเดียถอยรนหลังการสูรบอยางหนัก และปากีสถานยังคงครองภูมิภาคนี้ตอไป การกระจายเสียงของอินเดียกําลังเซ็นเซอรความลมเหลวนี้เพื่อเลี่ยงความอับอายของชาติ"
 GOE_RAJ.50.a: "ความสูญเสียอันขมขื่น"
 GOE_RAJ.50.b: "[433.GetName]เปนของเราโดยชอบธรรม"

 GOE_RAJ_famine.1.t: "โรคใบจุดสีนํ้าตาลระบาดใน[?global.famine_state.GetName]"
 GOE_RAJ_famine.1.desc: "พบโรคใบจุดสีนํ้าตาลใน[?global.famine_state.GetName] เจาหนาที่กังวลวาโรคเชื้อราชนิดนี้อาจแพรกระจายออกไปและสงผลกระทบตอผลผลิตฤดูหนาว"
 GOE_RAJ_famine.1.a: "แยแลว"
 
 GOE_RAJ_famine.2.t: "พายุไซโคลนถลม[?global.famine_state.GetName]"
 GOE_RAJ_famine.2.desc: "พายุไซโคลนลูกใหญตามดวยพายุอีกหลายลูกไดถลม[?global.famine_state.GetName] นอกจากความเสียหายที่กวางขวางแลว ยังทําใหโรคใบจุดสีนํ้าตาลแพรกระจายเปนวงกวางขึ้น ซํ้าเติมผลกระทบของเชื้อราใหหนักขึ้นอีก"
 GOE_RAJ_famine.2.a: "คงจบแคนี้แหละนา"
 
 GOE_RAJ_famine.3.t: "การพยากรณผลผลิตที่ไมนาเชื่อถือ"
 GOE_RAJ_famine.3.desc: "การพยากรณผลผลิตพืชผลอยางเปนทางการในปนี้คาดวาจะขาดแคลนอยางมาก แตก็เปนที่รูกันดีวาการพยากรณเหลานี้เคยผิดพลาดมาแลวในอดีต"
 GOE_RAJ_famine.3.a: "หวังวาคราวนี้จะผิดอีก"
 
 GOE_RAJ_famine.4.t: "กําแพงการคาระหวางจังหวัด"
 GOE_RAJ_famine.4.desc: "จังหวัดและรัฐมหาราชาตาง ๆ ของอินเดียเริ่มตั้งกําแพงกีดกันการคาระหวางจังหวัด เนื่องจากความวิตกเรื่องราคาอาหารที่สูงขึ้น กําแพงการคาเหลานี้เสี่ยงจะทําใหราคาอาหารพุงสูงยิ่งขึ้นเมื่อแตละจังหวัดถูกตัดขาดจากกันมากขึ้นเรื่อย ๆ"
 GOE_RAJ_famine.4.a: "เครือขายการกระจายอาหารกําลังถูกบีบรัด"
 
 GOE_RAJ_famine.5.t: "ราคาโกลาหลใน[?global.famine_state.GetName]"
 GOE_RAJ_famine.5.desc: "เมื่อราคาธัญพืชสูงขึ้น รัฐบาลทองถิ่นพยายามควบคุมราคาเพื่อชวยประชาชนในพื้นที่ แตนาเสียดายที่ผลที่ไดคือธัญพืชจํานวนมากหายเขาไปในตลาดมืด หรือถูกกักตุนไวในโกดังขนาดใหญ\nรัฐบาลทองถิ่นไดผอนคลายมาตรการลงแลว แตยังมีความเชื่ออยางกวางขวางวาธัญพืชขาดแคลนอยางหนัก สงผลใหเงินเฟอพุงสูงอยางควบคุมไมอยู"
 GOE_RAJ_famine.5.a: "สถานการณเริ่มเลวรายแลว"
 
 GOE_RAJ_famine.6.t: "การจัดสรรตามลําดับความสําคัญใน[?global.famine_state.GetName]"
 GOE_RAJ_famine.6.desc: "รัฐบาลทองถิ่นอนุมัติโครงการจัดสรรสิ่งของจําเปนพื้นฐานใหประชากรชนชั้นสูงและชนชั้นกลางกอน ซึ่งเปนกลุมที่สําคัญตออุตสาหกรรมหนักในรัฐและนิยมคุณคาแบบตะวันตกและความทันสมัย เรื่องนี้ยิ่งทําใหราคาอาหารพุงสูงขึ้นอีก"
 GOE_RAJ_famine.6.a: "..."
 
 
 GOE_RAJ_famine.7.t: "ภาวะทุพภิกขภัยใน[?global.famine_state.GetName]"
 GOE_RAJ_famine.7.desc: "ความไมสงบครั้งใหญของประชาชนปะทุขึ้นใน[?global.famine_state.GetName] การขาดแคลนสิ่งของจําเปนพื้นฐานบีบใหประชากรชนบทจํานวนมากหลั่งไหลเขาสูเมืองที่แออัดเพื่อแสวงหาความชวยเหลือ\nสถานการณลุกลามจนควบคุมไมอยูอยางรวดเร็ว เมื่อฝูงชนเริ่มรวมตัวและปะทะกันเอง"
 GOE_RAJ_famine.7.a: "นี่ไมดีเลย"
 GOE_RAJ_famine.7.tt: "§Yทุพภิกขภัยอาจลุกลามไปยังรัฐขางเคียงทุกเดือน เวนแตจะมีมาตรการปองกัน\nปลดล็อกหมวดการตัดสินใจทุพภิกขภัย§!"
 
 GOE_RAJ_famine.9.t: "[FROM.Getname]ขอความชวยเหลือดานทุพภิกขภัย"
 GOE_RAJ_famine.9.tt: "เปดใชการตัดสินใจ§Yทุพภิกขภัย§!"
 GOE_RAJ_famine.9.desc: "[FROM.Getname]กําลังเผชิญสถานการณที่ทรุดหนักลง โดยบางสวนของประเทศตกอยูในภาวะทุพภิกขภัย รัฐบาลของพวกเขาวิงวอนขอความชวยเหลือใด ๆ ที่ประชาคมระหวางประเทศพอจะใหได เพื่อบรรเทาความทุกขยากและยุติภาวะฉุกเฉิน"
 GOE_RAJ_famine.9.a: "ขอโทษนะสหาย เราไมมีอะไรจะใหเลย"
 GOE_RAJ_famine.9.b: "เราจะสงความชวยเหลือจํานวนมาก"
 GOE_RAJ_famine.9.c: "เราจะสงความชวยเหลือจํานวนเล็กนอย"
 
 GOE_RAJ_famine.10.t: "[FROM.GetName]ปฏิเสธที่จะชวยเหลือเรา"
 GOE_RAJ_famine.10.desc: "[FROM.GetName]แจงเราวาจะไมใหความชวยเหลือใด ๆ แกเรา โดยระบุวาปฏิเสธแนวคิดที่วาตนมีพันธะใด ๆ ตอรัฐของเราในชวงวิกฤตการณระดับโลกเชนนี้"
 GOE_RAJ_famine.10.a: "พวกโงใจดํา"
 
 GOE_RAJ_famine.11.t: "[FROM.GetName]มอบความชวยเหลือชุดใหญ"
 GOE_RAJ_famine.11.desc: "[FROM.GetName]มอบความชวยเหลือชุดใหญใหเราอยางใจกวาง ชวยบรรเทาทุพภิกขภัยและปองกันไมใหลุกลามไปยังรัฐขางเคียง"
 GOE_RAJ_famine.11.a: "ยอดเยี่ยม!"
 
 GOE_RAJ_famine.12.t: "[FROM.GetName]มอบความชวยเหลือชุดเล็ก"
 GOE_RAJ_famine.12.desc: "[FROM.GetName]มอบความชวยเหลือชุดเล็กใหเรา ชวยบรรเทาทุพภิกขภัยและปองกันไมใหลุกลามไปยังรัฐขางเคียง แมพวกเขาจะทําไดมากกวานี้แนนอน แตก็ยังดีกวาไมมีเลย"
 GOE_RAJ_famine.12.a: "ดีมาก!"
 
 GOE_RAJ_famine.13.t: "ทุพภิกขภัยใน[?global.famine_state.GetName]คอย ๆ คลี่คลาย"
 GOE_RAJ_famine.13.desc: "ชวงที่เลวรายที่สุดของทุพภิกขภัยดูจะผานพนไปแลว ผลผลิตที่ดีชวยบรรเทาความทุกขยากที่หนักที่สุด และราคาอาหารก็เริ่มลดลง แมจะตองใชเวลาสักพักกวาทุกอยางจะกลับสูภาวะปกติ แตนี่ก็เปนกาวแรกของการเยียวยาพื้นที่\nดวยโศกนาฏกรรมครั้งใหญที่เกิดขึ้น เราตองถามตัวเองวา ราคาที่แทจริงของชัยชนะคืออะไร?"
 GOE_RAJ_famine.13.a: "ทุกกาวที่ไดมาลวนแลกดวยความเจ็บปวดของสามัญชน"
 
 goe_japan.1.t: "โบสเสนอสนับสนุนการทัพพมา"
 goe_japan.1.desc: "สุภาษ จันทรา โบส ผูนํากองทัพแหงชาติอินเดีย เขามาพรอมขอเสนอวากองกําลังของเขาพรอมชวยการรุกคืบของเราเขาสู[BRM.GetName] เขามองวานี่เปนกาวแรกสูการปลดปลอยอินเดียจากการปกครองของ[ENG.GetAdjective] และเชื่อวาการโจมตีพมาจะชวยบั่นทอนบริติชราชได ทหารของเขาเปนนักชาตินิยมที่ผานศึกมาอยางโชกโชน และความรูเรื่องภูมิประเทศของพวกเขาอาจมีคาอยางยิ่ง เราจะตอบรับหรือไม?"
 goe_japan.1.a: "แนนอน"
 goe_japan.1.b: "ไม"
 #FAMINE
 RAJ_famine_scripted_timeframe_reveal: "[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
 RAJ_famine_scripted_timeframe_reveal_desc: "เราประเมินวาทุพภิกขภัยจะดําเนินตอไปอีก §Y[?RAJ_famine_spread_times]§! เดือน"
 RAJ_famine_scripted_timeframe_non_reveal_desc: "เราคาดวาทุพภิกขภัยจะดําเนินตอไปอีก §Y[?RAJ_famine_spread_times_min]§! - §Y[?RAJ_famine_spread_times_max]§! เดือน"
 RAJ_famine_risk_scripted_gui_desc: "โอกาสที่มาตรการปองกันจะหยุดการลุกลามของทุพภิกขภัยไปยังรัฐขางเคียง: §G[?RAJ_famine_shield]%§!\nความเสี่ยงที่ทุพภิกขภัยจะลุกลาม: §R[?RAJ_famine_spreads]%§!"
 RAJ_famine_prevention_stats: "มาตรการปองกันของเราได\n-หยุดการลุกลามของทุพภิกขภัยได: §Y[?RAJ_times_shield_has_blocked_spread]§! ครั้ง\n-ลดระยะเวลาของทุพภิกขภัยลง: §Y[?RAJ_famine_reduction_from_shield]§! เดือน"
 RAJ_famine_shield_tt: "โอกาสที่มาตรการปองกันจะหยุดการลุกลามของทุพภิกขภัย: §G+$RIGHT|0$%§!"
 
 #Raj Partition 
 RAJ_partition_1.t: "การประทวงใน[FROM.GetName]กลายเปนความรุนแรง"
 RAJ_partition_1.desc: "สิ่งที่เริ่มตนจากการประทวงอยางสงบกลับกลายเปนความรุนแรง เมื่อตํารวจทองถิ่นเขาปะทะกับประชาชนผูถูกลิดรอนสิทธิ์ ตํารวจ[ENG.GetAdjective]อางวาพวกเขาปฏิบัติการภายใตการขมขูวาจะใชความรุนแรง ขณะที่ผูประทวงยืนกรานวาพวกเขายึดมั่นในหลักอหิงสาอยางเครงครัด\nไมมีผูเสียชีวิต แตเจาหนาที่ทองถิ่น 2 นายไดรับบาดเจ็บเล็กนอย และผูประทวง 1 คนถูกสงตัวไปโรงพยาบาลทองถิ่นหลังไดรับการกระทบกระเทือนทางสมอง"
 RAJ_partition_1.a: "ยอมรับไมได"
 
 GOE_RAJ_partition.2.t: "การประทวงลุกลามใน[?unrest_target_state.GetName]"
 GOE_RAJ_partition.2.desc: "การประทวงตอตานการปกครองของ[ENG.GetAdjective]ปะทุขึ้นใน[?unrest_target_state.GetName] โดยเจาหนาที่บังคับใชกฎหมายทองถิ่นรายงานวาการปะทะอยางรุนแรงระหวางผูชุมนุมกับเจาหนาที่ทวีความรุนแรงขึ้น"
 GOE_RAJ_partition.2.a: "ตํารวจตองถอยออกมา"
 GOE_RAJ_partition.2.b: "สลายฝูงชน"
 
 GOE_RAJ_partition.3.t: "การจลาจลใน[?unrest_target_state.GetName]"
 GOE_RAJ_partition.3.desc: "ความตึงเครียดใน[?unrest_target_state.GetName]มาถึงระดับวิกฤต ขณะที่ตํารวจทองถิ่นดิ้นรนควบคุมฝูงชนที่กระสับกระสายยิ่งขึ้นทุกที โรงงานที่เกี่ยวของกับรัฐบาลกลายเปนเปาหมายหลักของผูปลุกระดม และถูกกอวินาศกรรมบอยครั้งทามกลางความไมสงบที่ทวีขึ้น"
 GOE_RAJ_partition.3.a: "สงกองกําลังรักษาดินแดนเขาไป"
 GOE_RAJ_partition.3.b: "พยายามไกลเกลี่ยกับผูปลุกระดม"
 
 GOE_RAJ_partition.4.t: "ความรุนแรงทางศาสนา"
 GOE_RAJ_partition.4.desc: "ขณะที่กระแสเรียกรองเอกราชทวีแรงขึ้น ความแตกแยกที่ลึกและขยายตัวก็ปรากฏขึ้น ชาวฮินดูที่มุงมั่นจะรักษาอินเดียใหเปนหนึ่งเดียว ขัดแยงกับชาวมุสลิมมากขึ้นเรื่อย ๆ ซึ่งดวยความกลัวจะถูกกีดกันในรัฐที่ชาวฮินดูเปนเสียงขางมาก จึงเรียกรองใหจัดตั้งมาตุภูมิแยกตางหาก ความตึงเครียดที่ทวีขึ้นนี้จุดชนวนการปะทะอยางรุนแรงระหวางกลุมหัวรุนแรงของทั้งสองชุมชน ทําใหเสถียรภาพของประเทศตกอยูในความเสี่ยงรายแรง"
 GOE_RAJ_partition.4.a: "นี่เปนความผิดของเราหรือ?"
 GOE_RAJ_partition.4.b: "รณรงคลดความตึงเครียด" 
 GOE_RAJ_partition.4.c: "จับกุมผูปลุกระดม"
 GOE_RAJ_partition_become_free_to_stop_the_chaos_tt: "เราคาดไดวาความไรเสถียรภาพจะดําเนินตอไปจนกวาเราจะไดรับเอกราช"
 
 GOE_RAJ_partition.5.t: "การปะทะระหวางชาวฮินดูกับชาวมุสลิม"
 GOE_RAJ_partition.5.desc: "ขณะที่เสียงของชาวมุสลิมใน[GetRajName]เรียกรองใหมีมาตุภูมิแยกจากอินเดียดังขึ้นเรื่อย ๆ นักชาตินิยมฮินดูก็ออกมาเดินขบวนประทวงตอบโตอิทธิพลที่เพิ่มขึ้นของชาวมุสลิมในประเทศ ซึ่งมักนําไปสูการปะทะอยางรุนแรง"
 GOE_RAJ_partition.5.a: "สถานการณกําลังพัฒนาไป ..."
 GOE_RAJ_partition.5.b: "เพิ่มการรักษาความสงบเรียบรอย"
 
 GOE_RAJ_partition.6.t: "นัดหมายกับโชคชะตา"
 GOE_RAJ_partition.6.desc: "เมื่อหลายปกอน เราไดนัดหมายกับโชคชะตาไว และบัดนี้ถึงเวลาที่เราจะทําตามคํามั่นนั้น แมมิใชทั้งหมดหรือเต็มตามที่หมายไว แตก็เปนสวนสําคัญยิ่ง เมื่อนาฬกาตีบอกเวลาเที่ยงคืน ขณะที่โลกหลับใหล อินเดียจะตื่นขึ้นสูชีวิตและเสรีภาพ ชวงเวลาหนึ่งมาถึง ซึ่งนาน ๆ ครั้งจะเกิดขึ้นในประวัติศาสตร เมื่อเรากาวออกจากสิ่งเกาสูสิ่งใหม เมื่อยุคสมัยหนึ่งสิ้นสุดลง และเมื่อจิตวิญญาณของชาติที่ถูกกดขี่มาเนิ่นนานไดเปลงเสียงออกมา"
 GOE_RAJ_partition.6.a: "พวกเราทุกคน ไมวาจะนับถือศาสนาใด ลวนเปนลูกหลานของอินเดียอยางเทาเทียมกัน"
 
 GOE_RAJ_partition.7.t: "ปญหาเรื่องผูนํา"
 GOE_RAJ_partition.7.desc: "ขณะที่ชาติของเราปดฉากบทหนึ่งที่ถูกครอบงําดวยการกดขี่ บทใหมแหงการกําหนดชะตากรรมของตนเองก็เปดขึ้น "
 GOE_RAJ_partition.7.a: "เนหรูคือตัวเลือกที่ชัดเจน"
 GOE_RAJ_partition.7.b: "ผูที่เสียสละมามากมาย คานธี"
 GOE_RAJ_partition.7.c: "จินนาหสมควรไดรับโอกาส"
 GOE_RAJ_partition.7.d: "หลุยส เมานตแบตเทน เรายังตองการความชวยเหลือจากพวกเขา"

 GOE_RAJ_partition.8.t: "คานธีรอดจากการลอบสังหาร"
 GOE_RAJ_partition.8.desc: "ชายที่ระบุตัววาคือนาถูราม โคดเส พยายามลอบสังหารมหาตมา คานธี ระหวางการประชุมสวดมนตรวมหลายศาสนา แตถูกสมาชิกหนวยองครักษของประธานาธิบดีจับกุมไวไดกอนที่เขาจะลั่นไก\nยืนยันแลววาคานธีปลอดภัยและถูกนําตัวไปยังพื้นที่ปลอดภัย โฆษกระบุวาเขาหวั่นไหวกับเหตุการณครั้งนี้ และดูเหมือนจะเขาสูการครุนคิดอยางลึกซึ้งถึงอนาคตของโลกและที่ทางของตนในโลกนั้น"
 GOE_RAJ_partition.8.a: "เขาอาจไดเห็นอะไรในหวงเหวมืดมิดนั้น?"

 GOE_RAJ_partition.9.t: "[ENG.GetName]เตรียมเขาแทรกแซง"
 GOE_RAJ_partition.9.desc: "[ENG.GetName]แสดงความกังวลอยางยิ่งตอการสูรบในอนุทวีปอินเดีย รัฐบาลของพวกเขาแสดงใหเราเห็นชัดวาไมตองการเห็นทั้งสองประเทศทําสงครามนองเลือด และจะเขามาแทรกแซงเพื่อยุติมัน หากจําเปนก็ดวยกําลัง"
 GOE_RAJ_partition.9.a: "เรามีเวลาจํากัด"

 GOE_RAJ_partition.10.t: "สงครามในอนุทวีปอินเดีย"
 GOE_RAJ_partition.10.desc: "สงครามปะทุขึ้นในอนุทวีปอินเดีย เราอาจควรเขาไปแทรกแซง เพราะเรามีอิทธิพลอยางมากเหนือทั้งสองประเทศ และยุติความบาคลั่งนี้"
 GOE_RAJ_partition.10.a: "เราไมมีเวลา"
 GOE_RAJ_partition.10.b: "เราตองยุติเรื่องนี้"

 #Loyalist Branch
 GOE_RAJ_partition.11.desc: "เปนเวลาหลายปที่[RAJ.GetNameDef]ถูกปกครองโดยคนของราชบัลลังกเปนหลัก แตดวยขอเรียกรองการปกครองตนเองที่เพิ่มขึ้น เราจําเปนตองจัดตั้งรัฐสภาอินเดียขึ้นใหม ซึ่งจะเปดโอกาสใหผูนําชาวพื้นเมืองมีบทบาทในการกําหนดทิศทางประเทศ ขณะเดียวกันก็มั่นใจไดวาชาตินี้ยังคํานึงถึงผลประโยชนของจักรวรรดิ อยางไรก็ตาม เราตองตัดสินใจวาใครควรเปนผูนํารัฐบาลใหมนี้"
 GOE_RAJ_loyalist.01.t: "สินคาสงออกของ[FROM.GetAdjective]เพื่อจักรวรรดิ"
 GOE_RAJ_loyalist.01.desc: "วันนี้เรามีขาวดี ผูนําใน[RAJ.GetNameDef]เขามาเสนอใหเพิ่มการผลิตและการสงออกสินคาหลักจาก[RAJ.GetNonIdeologyName]ไปยังจักรวรรดิในวงกวาง เราคาดไดวาคลังสินคาของเราจะเต็มไปดวยชา ฝาย และปอกระเจาจากอินเดีย ขณะที่[RAJ.GetNameDef]พิสูจนตนวาเปนทรัพยสินอันมีคาของดินแดนในปกครองที่อุดมสมบูรณของเรา"
 GOE_RAJ_loyalist.01.a: "$NSB_soviet_spanish_civil_war.4.a$"
 GOE_RAJ_loyalist.02.t: "$RAJ_the_empires_workshop$"
 GOE_RAJ_loyalist.02.desc: "มีการเจรจาอยางละเอียดถี่ถวนเกี่ยวกับการพัฒนาสายการผลิตทั่วจักรวรรดิ ซึ่งทําใหเราสามารถจัดตั้งและขยายโรงงานอุตสาหกรรมใน[?RAJ_crown_commodities_civ_built_flag.GetName]ได หวังวาสิ่งนี้จะเสริมความแข็งแกรงใหจักรวรรดิทามกลางความตองการของโลกที่เพิ่มขึ้น"
 GOE_RAJ_loyalist.02.a: "$NSB_soviet_civil_war_common.126.a$"
 GOE_RAJ_loyalist.03.t: "ขอเสนอของ[FROM.GetAdjective]ในการบุกอิหราน"
 GOE_RAJ_loyalist.03.desc: "เชานี้ สํานักงานปกครองของ[RAJ.GetNameDef]ไดเขามาเสนอขออนุญาตเปดฉากการบุก[PER.GetNameDef]เต็มรูปแบบ โดยอางเหตุผลหลายประการ รวมถึงการปกปองระเบียงเปอรเซีย และการชิงอางสิทธิ์บอนํ้ามันของ[PER.GetNameDef]กอนที่ศัตรูของเราจะไดครอบครอง การบุกเชนนี้อาจสรางความขุนเคืองตอประชาคมโลก แตการปฏิเสธผลประโยชนที่จะไดรับก็คงเปนเรื่องโงเขลา เราควรดําเนินการอยางไร?"
 GOE_RAJ_loyalist.03.a: "สงครามนี้อาจเปนประโยชนตอเรา ดําเนินการได"
 GOE_RAJ_loyalist.03.b: "ทําสงครามกับ[PER.GetNameDef]? ไม เสี่ยงเกินไป"
 GOE_RAJ_loyalist.04.t: "[FROM.GetNameDefCap]เห็นชอบใหทําสงคราม"
 GOE_RAJ_loyalist.04.desc: "เราไดรับขาวดีจากทูตของเราประจํา[ENG.GetNameDef] รัฐบาล[ENG.GetAdjective]ตกลงอนุญาตใหเราเตรียมการบุก[PER.GetNameDef] เมื่อไดรับความเห็นชอบจากราชบัลลังกแลว เราตองรวบรวมกําลังพลและเตรียมทําสงคราม"
 GOE_RAJ_loyalist.04.a: "เราจะเดินทัพสู[PER.GetNameDef]"
 GOE_RAJ_loyalist.05.t: "[FROM.GetNameDefCap]ขอใหเรายุติการเคลื่อนไหว"
 GOE_RAJ_loyalist.05.desc: "นาเสียดายที่ดูเหมือนคํารองขอบุก[PER.GetNameDef]ของเราจะไมมีใครรับฟง ราชบัลลังกตัดสินใจวาเราจะตองไมเปดปฏิบัติการทางทหารใด ๆ และแมเราอาจไมเห็นดวย แตก็เปนการรอบคอบที่จะทําตามคําสั่งของรัฐบาล[ENG.GetAdjective]"
 GOE_RAJ_loyalist.05.a: "เราตองเคารพพระประสงคของราชบัลลังก"
 GOE_RAJ_loyalist.06.t: "กองบัญชาการเอเชียตะวันออกเฉียงใต"
 GOE_RAJ_loyalist.06.desc: "เมื่อมีการจัดตั้งกองบัญชาการเอเชียตะวันออกเฉียงใต บัดนี้เรายืนอยูบนทางแยก เรามีทรัพยากรจํากัดที่จะทุมใหปฏิบัติการนี้ได และตองตัดสินใจวาควรมุงเนนดานใดเพื่อสนับสนุนความพยายามในสงครามรวมกับ[ENG.GetNameDef]"
 GOE_RAJ_loyalist.06.a: "เราตองเพิ่มงบประมาณดานการปองกัน"
 GOE_RAJ_loyalist.06.b: "เราควรมุงเนนขีดความสามารถในการรุก"
 GOE_RAJ_loyalist.06.c: "กองทัพอากาศ[RAJ.GetAdjective]ตองการการสนับสนุน"
 GOE_RAJ_loyalist.06.d: "ขยายขนาดปฏิบัติการทางทะเลของเรากันเถิด"
 GOE_RAJ_loyalist.07.t: "การปองกันมลายา"
 GOE_RAJ_loyalist.07.desc: "ในนามของการคุมครอง [FROM.GetNameDefCap]เสนอใหนํา[event_target:RAJ.RAJ_annexing_country_target.GetName]มาอยูใตการบริหารของ[FROM.GetAdjective]เพื่อใหแนใจวาแนวปองกันจะไดรับการพัฒนา แมสถานการณนี้อาจไมดีนักในแงอธิปไตยของเรา แตเราไดแตสันนิษฐานวานี่เปนมาตรการชั่วคราว หรืออยางนอยเราก็หวังเชนนั้น"
 GOE_RAJ_loyalist.07.a: "เราปลอยใหพวกเขาทําเชนนี้ไมได"
 GOE_RAJ_loyalist.07.b: "เราตองยอมเสียสละเพื่อการปองกันของเรา"
 GOE_RAJ_loyalist.77.t: "การปองกันพมา"
 GOE_RAJ_loyalist.08.desc: "ในนามของการคุมครอง [FROM.GetNameDefCap]เสนอใหนํา[event_target:RAJ.RAJ_annexing_country_target.GetName]มาอยูใตการบริหารของ[FROM.GetAdjective]เพื่อใหแนใจวาแนวปองกันจะไดรับการพัฒนา แมสถานการณนี้อาจไมดีนักในแงอธิปไตยของเรา แตเราไดแตสันนิษฐานวานี่เปนมาตรการชั่วคราว หรืออยางนอยเราก็หวังเชนนั้น"
 GOE_RAJ_loyalist.08.a: "$GOE_RAJ_loyalist.07.a$"
 GOE_RAJ_loyalist.08.b: "$GOE_RAJ_loyalist.07.b$"
 GOE_RAJ_loyalist.09.t: "[FROM.GetNameDefCap]ปฏิเสธแผนการปองกันของเรา"
 GOE_RAJ_loyalist.09.desc: "นาเสียดายที่แมเราจะพยายามอยางเต็มที่ [FROM.GetNameDef]ก็ปฏิเสธขอเสนอการคุมครองของเรา ดูเหมือนแผนการปองกันของเราจะไมเพียงพอจะโนมนาวใหพวกเขามาอยูใตการดูแลของเรา"
 GOE_RAJ_loyalist.09.a: "ก็ตามนั้น"
 GOE_RAJ_loyalist.10.t: "[FROM.GetNameDefCap]โอน[event_target:RAJ.RAJ_annexing_country_target.GetName]มาอยูใตการบริหารของเรา"
 GOE_RAJ_loyalist.10.desc: "ขาวดี! [FROM.GetNameDefCap]ตกลงอนุญาตใหเราตั้งกองกําลังในดินแดนของพวกเขา และปกปองดินแดนนั้นจากการรุกรานของตางชาติ สิ่งนี้จะชวยความพยายามในสงครามของเราไดอยางมหาศาล"
 GOE_RAJ_loyalist.10.a: "ยอดเยี่ยม เริ่มดําเนินการได"
 GOE_RAJ_loyalist.11.t: "$RAJ_the_jewel_becomes_the_crown$"
 GOE_RAJ_loyalist.11.desc: "วันนี้เปนวันอันมืดมนของจักรวรรดิ[ENG.GetAdjective] หลังการลมสลายของ[ENG.GetNameDef] เราอยูในฐานะพิเศษยิ่งที่จะรองรับคณะผูนําพลัดถิ่นของพวกเขา สวนหนึ่งเปนผลจากความพยายามที่เราไดทําเพื่อยืนยันความจงรักภักดีตอราชบัลลังก $ENG_winston_churchill$ นํา[ENG.GetNameDef]อยางสุดความสามารถ และเราตองตัดสินใจวาเขาจะดํารงตําแหนงใดใน[RAJ.GetNameDef]"
 GOE_RAJ_loyalist.11.a: "$ENG_winston_churchill$ ควรเปนผูนํา[RAJ.GetNameDef]"
 GOE_RAJ_loyalist.11.b: "เชอรชิลลจะรับใชไดดีที่สุดในตําแหนงที่ปรึกษา"
 GOE_RAJ_loyalist.11.c: "เชอรชิลลไมมีที่ยืนใน[RAJ.GetNameDef]"
 GOE_RAJ_loyalist.12.t: "$ENG_winston_churchill$ หลบหนีจาก[ENG.GetNameDef]"
 GOE_RAJ_loyalist.12.desc: "ในยามมืดมนเชนนี้ ความหวังยังคงมีอยู แมเราจะยอมจํานนแลว แต $ENG_winston_churchill$ ก็หลบหนีออกจากเกาะและเดินทางไปยัง[RAJ.GetNameDef]ไดสําเร็จ จากที่นั่น เขาสามารถรักษาผลประโยชนของ[ENG.GetAdjective]และบัญชาการปฏิบัติการสงครามจนกวาเราจะทวงคืนมาตุภูมิได"
 GOE_RAJ_loyalist.12.a: "ลากอน $ENG_winston_churchill$"
 GOE_RAJ_loyalist.13.t: "การกลับมาของ $ENG_winston_churchill$"
 GOE_RAJ_loyalist.13.desc: "เมื่อแผนดินเกิดของเรากลับมาอยูใตการควบคุมของเราในที่สุด เราก็สามารถเริ่มฟนฟูคณะรัฐมนตรีชุดเดิมได $ENG_winston_churchill$ ไดเดินทางกลับจาก[RAJ.GetNameDef]ทามกลางการตอนรับอยางอบอุน และถึงเวลาตัดสินใจวาเราจะดําเนินการอยางไรตอไป"
 GOE_RAJ_loyalist.13.a: "$ENG_winston_churchill$ ควรกลับมาเปนนายกรัฐมนตรีอีกครั้ง"
 GOE_RAJ_loyalist.13.b: "เราไมตองการใหเขารับใชอีกตอไป"
 GOE_RAJ_loyalist.14.t: "$state_resource_tungsten$ของ[BRM.GetAdjective]สําหรับ[FROM.GetName]"
 GOE_RAJ_loyalist.14.desc: "เชานี้เราไดตอนรับทูตจาก[FROM.GetNameDef] รัฐบาลของพวกเขาขอสิทธิ์ในการขุด$state_resource_tungsten$ของ[BRM.GetAdjective]ใน[288.GetName] เพื่อสนับสนุนความพยายามในสงครามที่ขยายตัวของพวกเขา เราตองตัดสินใจวาจะจัดการกับขอเสนอนี้อยางไร เพราะไมใชเรื่องที่จะมองขามได"
 GOE_RAJ_loyalist.14.a: "เราอนุญาตได"
 GOE_RAJ_loyalist.14.b: "เรามีแผนอื่นสําหรับทรัพยากรเหลานั้น"
 GOE_RAJ_loyalist.15.t: "$state_resource_tungsten$ของ[288.GetName]ถูกมอบให[RAJ.GetName]"
 GOE_RAJ_loyalist.15.desc: "[OVERLORD.GetNameDef]เจาเหนือหัวของเราไดมอบสิทธิ์ในทรัพยากร$state_resource_tungsten$ใน[288.GetName]ใหแก[RAJ.GetNameDef] เพื่อใหพวกเขานําไปปอนอุตสาหกรรมและมีสวนรวมในความพยายามในสงคราม นี่เปนโอกาสที่เราจะพิสูจนให[OVERLORD.GetNameDef]เห็นวาเราทุมเทสนับสนุนผลประโยชนของพวกเขาในภูมิภาค"
 GOE_RAJ_loyalist.15.a: "เปนเรื่องดีที่ไดรู"
 GOE_RAJ_loyalist.16.t: "[FROM.GetName]มอบสิทธิ์การขุดทรัพยากร"
 GOE_RAJ_loyalist.16.desc: "[FROM.GetNameDefCap]มอบสิทธิ์ในทรัพยากร$state_resource_tungsten$ใน[288.GetName]ใหแกเรา ซึ่งนาจะชวยความพยายามในสงครามของเรา และชวยใหเราสูรบตอไปในนามของราชบัลลังกได"
 GOE_RAJ_loyalist.16.a: "พรอันยิ่งใหญ"
 GOE_RAJ_loyalist.17.t: "[FROM.GetName]ปฏิเสธ$state_resource_tungsten$ของพมา"
 GOE_RAJ_loyalist.17.desc: "นาเสียดายที่[FROM.GetNameDef]ปฏิเสธคํารองขอขุด$state_resource_tungsten$ของพมาของเรา เปนเรื่องนาผิดหวังอยางยิ่ง เพราะทรัพยากรเหลานั้นอาจมีความสําคัญตอการพัฒนาจักรกลสงครามของเรา"
 GOE_RAJ_loyalist.17.a: "นาผิดหวังจริง ๆ"



  #EIC
 GOE_RAJ_eic.2.t: "แตงตั้งประธานเจาหนาที่บริหาร"
 GOE_RAJ_eic.2.desc: "บริษัทตองการมือที่มั่นคงคอยนําทางการเติบโต และเราตองเลือกผูนําที่จะสรางผลตอบแทนจากการลงทุนไดสูงสุด บุคลิกของเขาจะสงผลไปถึงคณะผูบริหารที่เหลือ ดังนั้นเราตองเลือกใหถูก"
 GOE_RAJ_eic.2.a: "ตองยืดหยุน"
 GOE_RAJ_eic.2.b: "ตองประหยัด"
 GOE_RAJ_eic.2.c: "ตองมีสายสัมพันธอันดีกับรัฐบาล"
 GOE_RAJ_eic.2.d: "ตองเหี้ยมโหด"

 GOE_RAJ_eic.3.t: "[RAJ.GetName]เรียกรองใหเราเปดรับการคาฝน"
 GOE_RAJ_eic.3.desc: "[FROM.GetName]เรียกรองใหเราปลอยใหฝนไหลเวียนอยางเสรีระหวางสองประเทศ หากประชาชนยินดีจายเงินซื้อ แลวเราเปนใครจะไปปฏิเสธสิทธิ์ในการบริโภคของพวกเขา? มันอาจผิดศีลธรรมและเปนผลเสียตอปจเจกบุคคล แตเราเปนใครจะไปหามหากพวกเขายินดีจาย? ปญหาเดียวคือรัฐบาล[FROM.GetAdjective]ยังเรียกรองเมืองทาตามสนธิสัญญาเพื่อกระจาย...สินคาใหกวางขึ้นอีกดวย"
 GOE_RAJ_eic.3.a: "พวกเขาบาไปแลวหรือ?"
 GOE_RAJ_eic.3.b: "ปลอยใหดอกบัวสีนํ้าเงินไหลเวียนไป"

 GOE_RAJ_eic.4.t: "[FROM.GetName]ปฏิเสธอยางสิ้นเชิง"
 GOE_RAJ_eic.4.desc: "[FROM.GetName]ปฏิเสธขอเรียกรองของเราอยางโจงแจง และเตือนเราวาพวกเขาเปนประเทศเอกราชที่มีกฎหมายของตนเอง การที่เราพยายามบังคับขอเรียกรองกับพวกเขาเกือบจะเปนการลบหลู"
 GOE_RAJ_eic.4.a: "เราลองไมนวมแลว ตอไปคือไมแข็ง"

 GOE_RAJ_eic.5.t: "[FROM.GetName]ตกลง"
 GOE_RAJ_eic.5.desc: "[FROM.GetName]ตกลงคาขายฝนปริมาณมากระหวางสองประเทศ ดวยเมืองทาตามสนธิสัญญาแหงใหม เราสามารถกระจายสินคาไปทั่วโลกไดโดยตรง ขอใหการบริโภคนี้นํามิตรและศัตรูมาใกลชิดกันยิ่งขึ้น"
 GOE_RAJ_eic.5.a: "ขอตกลงแบบไมตองใชกําลัง"

 GOE_RAJ_eic.6.t: "[RAJ.GetName]ตองการซื้อ[RAJ_i_want_to_buy_this_land.GetName]"
 GOE_RAJ_eic.6.desc: "[RAJ.GetName]ซึ่งตองการขยายกิจการไดยื่นขอเสนอขอซื้อ[RAJ_i_want_to_buy_this_land.GetName] แลกกับการลงทุนจํานวนมหาศาลในประเทศของเรา"
 GOE_RAJ_eic.6.a: "เราไมยินดีขายดินแดนนี้"
 GOE_RAJ_eic.6.a_tt: "[FROM.GetName]จะไมสามารถขอรัฐนี้ไดอีก แตยังขอรัฐอื่นได"
 GOE_RAJ_eic.6.b: "ไมมีวัน"
 GOE_RAJ_eic.6.b_tt: "[FROM.GetName]จะไมสามารถขอดินแดนจากเราไดอีก"
 GOE_RAJ_eic.6.c: "ฟงดูเขาทา" 

 GOE_RAJ_eic.7.t: "[FROM.GetName]ไมยินดีสละดินแดนของตน"
 GOE_RAJ_eic.7.desc: "[FROM.GetName]ไมยินดีสละดินแดนผืนนี้ แตก็ไมปดโอกาสในการโอนดินแดนผืนอื่นในอนาคต"
 GOE_RAJ_eic.7.a: "เดี๋ยวพวกเขาก็เปลี่ยนใจ"

 GOE_RAJ_eic.8.t: "[FROM.GetName]ปฏิเสธการโอนใด ๆ ทั้งสิ้น"
 GOE_RAJ_eic.8.desc: "[FROM.GetName]ปฏิเสธการโอนดินแดนใด ๆ ใหเรา โดยระบุวาแมแตการเสนอเชนนี้ก็เปนการลบหลูมารยาทอันดีงาม"
 GOE_RAJ_eic.8.a: "ทาทีแปลก ๆ"

 GOE_RAJ_eic.9.t: "[FROM.GetName]ตอบรับ"
 GOE_RAJ_eic.9.desc: "[FROM.GetName]ตอบรับขอตกลงแลว เราจะโอนเงินใหพวกเขาในไมชา และการโอนทรัพยสินก็ใกลจะเกิดขึ้น"
 GOE_RAJ_eic.9.a: "ดีลดีเยี่ยม!"

  # MUGHAL EMPIRE
 GOE_RAJ_princely.1.t: "เลือกเจาชายเพื่อนํา[ROOT.GetNameDef]"
 GOE_RAJ_princely.1.desc: "จักรวรรดิของบาบูรในประวัติศาสตรนั้นกวางใหญและมีเมตตา และปกครองอนุทวีปมาหลายรอยป เรายังมีงานอีกมากหากจะดํารงมรดกนี้ไวใหสมศักดิ์ศรี แมสายเลือดคุรคานีจะยังมีผูสืบทอดอยูมาก แตมีเพียงคนเดียวที่จะนําเราสูความรุงโรจนได"
 GOE_RAJ_princely.1.a: "มีร ออสมัน อาลี ขาน จะนําจักรวรรดิของเราสูความยิ่งใหญ"
 GOE_RAJ_princely.1.b: "มีรซา คูรชิด จาห บาฮาดูร คือตัวเลือกที่สมเหตุสมผลที่สุด"
 GOE_RAJ_princely.1.c: "อะหมัด ยาร ขาน จะปกปองเรา!"
 GOE_RAJ_princely.1.d: "ฮุสเซน ชาฮีด ซูหราวารดี จะนําเราสูอนาคต!"

 GOE_RAJ_princely.2.t: "เลือกเจาชายเพื่อนํา[ROOT.GetNameDef]"
 GOE_RAJ_princely.2.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.2.a: "ฮุสเซน ชาฮีด ซูหราวารดี จะนําเราสูอนาคต!"
 GOE_RAJ_princely.2.b: "มหาราชาหริ สิงห ไดรับเจตจํานงของประชาชน!"
 GOE_RAJ_princely.2.c: "โพธ จันทรา สิงห คือนักยุทธศาสตรที่ยอดเยี่ยมที่สุดของเรา!"
 GOE_RAJ_princely.2.d: "ไมมีใครดีพอเลย"

 GOE_RAJ_princely.3.t: "เลือกเจาชายเพื่อนํา[ROOT.GetNameDef]"
 GOE_RAJ_princely.3.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.3.a: "อุเมด สิงห รูวิธีเขาถึงประชาชน"
 GOE_RAJ_princely.3.b: "ประตาป สิงห ราโอ ไกกวาด คือตัวเลือกที่ชัดเจน!"
 GOE_RAJ_princely.3.c: "มหาราชาชยจามราเชนทร วาดิยาร ดีที่สุด"
 GOE_RAJ_princely.3.d: "บางทีเราควรพิจารณารายชื่อแรกใหม"
 
 GOE_RAJ_navy.1.t: "[RAJ.GetNameDefCap]เสนอขอตกลงทางทะเล"
 GOE_RAJ_navy.1.desc: "[RAJ.GetLeader]สงขอเสนอมายังเราเพื่อจัดทําขอตกลงการคาทางทะเลระหวางฝายบริหาร[RAJ.GetAdjective]และ[ENG.GetAdjective] \nขอตกลงนี้จะเปดทางใหรวมมือกันดานการผลิตเรือ รวมทั้งเปดประตูสูขอตกลงการคาเพิ่มเติมในอนาคต"
 GOE_RAJ_navy.1.a: "เรื่องนี้จะเปนประโยชนอยางยิ่งตอเราทั้งสองฝาย!"
 GOE_RAJ_navy.1.b: "เราไมสนใจ"

 GOE_RAJ_navy.2.t: "[FROM.GetNameDefCap]ตอบรับ!"
 GOE_RAJ_navy.2.desc: "เจาหนาที่จาก[FROM.GetNameDefCap]เห็นชอบและลงนามในขอตกลงทางทะเลที่เสนอแลว ซึ่งจะเปนประโยชนอยางยิ่งตอเราตอจากนี้"
 GOE_RAJ_navy.2.a: "สมบูรณแบบ"

 GOE_RAJ_navy.3.t: "[ENG.GetNameDefCap]ปฏิเสธขอตกลงการคา"
 GOE_RAJ_navy.3.desc: "เจาหนาที่จาก[FROM.GetNameDefCap]ปฏิเสธขอตกลงทางทะเลที่เราเสนอ โดยระบุวาไมเปนประโยชนตอพวกเขาและเห็นไดชัดวาเปนขอตกลงที่เอียงขาง"
 GOE_RAJ_navy.3.a: "นาเสียดาย"

 GOE_RAJ_navy.4.t: "[RAJ.GetNameDefCap]ขอใหโอนยายผูบัญชาการทหารเรือ"
 GOE_RAJ_navy.4.desc: "เจาหนาที่จาก[RAJ.GetNameDefCap]ขอใหเราโอนยายผูบัญชาการทหารเรือคนหนึ่งไปรับราชการในราชนาวีอินเดีย เพื่อชวยในการขยายกองทัพและฝกนาวิกโยธินใหม นี่เปนภารกิจที่มีตนทุนสูง แตพวกเขาเสนอคาตอบแทนกอนโต"
 GOE_RAJ_navy.4.a: "คุมคาที่จะเสียสละ"
 GOE_RAJ_navy.4.b: "เราจะไมยอมตกลงเรื่องนี้ไมวากรณีใด!"

 GOE_RAJ_navy.5.t: "[ENG.GetNameDefCap]ตอบรับ!"
 GOE_RAJ_navy.5.desc: "เจาหนาที่จาก[FROM.GetNameDefCap]ตกลงสงผูบัญชาการคนหนึ่งไปยัง[RAJ.GetNameDefCap]เพื่อชวยในการขยายกองทัพเรือของเรา"
 GOE_RAJ_navy.5.a: "สมบูรณแบบ"

 GOE_RAJ_navy.6.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอ"
 GOE_RAJ_navy.6.desc: "เจาหนาที่จาก[FROM.GetNameDefCap]ปฏิเสธที่จะสงผูบัญชาการไปยัง[RAJ.GetNameDefCap] และยืนกรานใหเราฝกผูบัญชาการของเราเองแทน"
 GOE_RAJ_navy.6.a: "นาเสียดาย"

 GOE_RAJ_navy.7.t: "[RAJ.GetNameDefCap]ขอซื้อเรือที่ปลดประจําการแลวของเรา"
 GOE_RAJ_navy.7.desc: "[FROM.GetLeader]ขอซื้อเรือเกาที่ปลดประจําการแลวของเรา ซึ่งตอนนี้ไมไดใชงาน แต[FROM.GetLeader]ยืนยันวา[FROM.GetNameDefCap]จะนําไปใชประโยชนได พวกเขาเสนอคาตอบแทนกอนโต"
 GOE_RAJ_navy.7.a: "ยังไงเราก็ไมไดใชมันอยูแลว!"
 GOE_RAJ_navy.7.b: "เราไมสนใจ"

 GOE_RAJ_navy.8.t: "[ENG.GetNameDefCap]ตอบรับขอเสนอการคาของเรา!"
 GOE_RAJ_navy.8.desc: "[FROM.GetLeader]ตอบรับคําขอซื้อเรือที่ปลดประจําการแลวของเรา เรือเหลานั้นนาจะมาถึงอินเดียในไมชา"
 GOE_RAJ_navy.8.a: "นี่เปนขาวดีสําหรับราชนาวีอินเดีย!"

 GOE_RAJ_navy.9.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอ"
 GOE_RAJ_navy.9.desc: "[FROM.GetLeader]ปฏิเสธขอเสนอขอซื้อเรือของเรา และตอนนี้เราตองหาทางเลือกอื่นเพื่อขยายกองทัพเรือ"
 GOE_RAJ_navy.9.a: "นาเสียดาย"

 GOE_RAJ_navy.10.t: "[RAJ.GetNameDefCap]ขอสิทธิ์ในสัญญาเรือรุนใหม"
 GOE_RAJ_navy.10.desc: "เจาหนาที่จาก[RAJ.GetNameDefCap]ขอซื้อสิทธิ์ในสัญญาเรือรุนใหมของเรา และขอสิทธิ์พัฒนาเรือลาดตระเวนแบบ 1936 ของเราใหราชนาวีอินเดีย พวกเขาเสนอจะจายคาสัญญาใหเราอยางงาม"
 GOE_RAJ_navy.10.a: "ขอตกลงที่เปนประโยชนทั้งสองฝาย!"
 GOE_RAJ_navy.10.b: "เราไมสนใจ"

 GOE_RAJ_navy.11.t: "[ENG.GetNameDefCap]ตกลงมอบสัญญาเรือรุนใหมใหเรา!"
 GOE_RAJ_navy.11.desc: "เจาหนาที่จาก[ENG.GetNameDefCap]ตอบรับคําขอของเราและตกลงมอบสัญญาเรือที่ไดรับการปรับปรุงใหแกเรา เราไดรับเรือลาดตระเวนหาลําเปนการเริ่มตน ซึ่งกําลังจะมาถึงแลว"
 GOE_RAJ_navy.11.a: "นี่เปนขาวดีสําหรับราชนาวีอินเดีย!"

 GOE_RAJ_navy.12.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอ"
 GOE_RAJ_navy.12.desc: "เจาหนาที่จาก[ENG.GetNameDefCap]ตอบกลับคําขอของเรา และปฏิเสธที่จะมอบสัญญาเรือที่ไดรับการปรับปรุงใหเรา โดยระบุวาขอเสนอของเราตํ่าเกินกวาจะพิจารณาได"
 GOE_RAJ_navy.12.a: "นาเสียดาย"

 GOE_RAJ_goa.1.t: "[RAJ.GetNameDefCap]เรียกรองกัว"
 GOE_RAJ_goa.1.desc: "[RAJ.GetLeader]เรียกรองใหคืนกัว [RAJ.GetLeader]ยืนกรานวากัวเปนดินแดนของ[RAJ.GetAdjective] และขูจะใชปฏิบัติการทางทหารหากเราไมสงมอบให"
 GOE_RAJ_goa.1.a: "ไมคุมที่จะเสี่ยงกับความขัดแยง"
 GOE_RAJ_goa.1.b: "ไมมีทาง กัวเปนของเรา!"

 GOE_RAJ_goa.2.t: "[FROM.GetNameDefCap]ปลอยกัว"
 GOE_RAJ_goa.2.desc: "[FROM.GetLeader]ตัดสินใจยุติเรื่องนี้และยอมใหเราผนวกกัวเพื่อปองกันความขัดแยง"
 GOE_RAJ_goa.2.a: "กัวเปนของเราแลว!"

 GOE_RAJ_goa.3.t: "[FROM.GetNameDefCap]ปฏิเสธการโอนกัว"
 GOE_RAJ_goa.3.desc: "[FROM.GetLeader]ตอบขอเรียกรองของเราดวยการปฏิเสธสิทธิ์ในกัว แมเราจะขูใชปฏิบัติการทางทหารก็ตาม"
 GOE_RAJ_goa.3.a: "นี่หมายถึงสงคราม!"
 GOE_RAJ_goa.3.b: "คิดอีกที เราถอยดีกวา"

 GOE_RAJ_goa.4.t: "[RAJ.GetNameDefCap]ถอยกลับ"
 GOE_RAJ_goa.4.desc: "[RAJ.GetLeader]ตอบสนองตอการขูใชปฏิบัติการทางทหารของเรา และทหาร[RAJ.GetAdjective]ไดถอนออกจากกัวแลว"
 GOE_RAJ_goa.4.a: "ยอดเยี่ยม"

 GOE_RAJ_generals.1.t: "โครงการแลกเปลี่ยนนักเรียนนายรอยอาณานิคม"
 GOE_RAJ_generals.1.desc: "[RAJ.GetLeader]ขอสงทหาร[RAJ.GetAdjective]ไปยัง[ENG.GetNameDefCap]เพื่อรับการฝกจากทหารอังกฤษ และเสนอคาตอบแทนกอนโตสําหรับบริการนี้"
 GOE_RAJ_generals.1.a: "แนนอน!"
 GOE_RAJ_generals.1.b: "เราไมสนใจ"

 GOE_RAJ_generals.2.t: "[ENG.GetNameDefCap]ตอบรับ!"
 GOE_RAJ_generals.2.desc: "[ENG.GetLeader]ตอบขอเสนอของเราและตกลงใหเราสงทหารไปยัง[ENG.GetNameDefCap]"
 GOE_RAJ_generals.2.a: "ยอดเยี่ยม!"

 GOE_RAJ_generals.3.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
 GOE_RAJ_generals.3.desc: "[ENG.GetLeader]ตอบขอเสนอของเราและแจงวาไมสนใจ"
 GOE_RAJ_generals.3.a: "นาเสียดาย"

