 IRQ_political_events.40.t: "[FROM.GetNameDefCap]ขอซีเรีย"
 IRQ_political_events.40.desc: "รัฐบาล[FROM.GetNameDef]ไดยื่นคําขออยางเปนทางการใหเราโอนการควบคุมซีเรียไปอยูภายใตอํานาจของพวกเขา โดยอางวาซีเรียในฐานะสวนหนึ่งที่แยกไมไดของโลกอาหรับ ควรรวมเขากับ[FROM.GetNameDef]ภายใตการบริหารเดียวเพื่อสรางเสถียรภาพและความรุงเรืองใหแกภูมิภาค แมพวกเขาจะนําเสนอคําขอนี้วาเปนกาวสูเอกภาพของชาวอาหรับ แตการยกซีเรียใหจะลดทอนอิทธิพลของเราในตะวันออกกลางลงอยางมาก การปฏิเสธขอเสนออาจทําใหความสัมพันธตึงเครียดยิ่งขึ้นและอาจนําไปสูการบานปลาย"
 IRQ_political_events.40.a: "เราไมมีทางเลือกมากนัก"
 IRQ_political_events.40.b: "ไมมีทาง!"
 
 IRQ_political_events.41.t: "[FROM.GetNameDefCap]ตั้งใจจะโอนเราไป"
 IRQ_political_events.41.desc: "ในพัฒนาการที่นาประหลาดใจ รัฐบาล[FROM.GetNameDef]ไดตกลงโอนอํานาจปกครองเราไปให[FROM.FROM.GetNameDef] หลายคนในรัฐบาลของเราตั้งคําถามวาขอตกลงนี้สะทอนผลประโยชนของเราอยางแทจริงหรือไม หรือเรากําลังถูกใชเปนเบี้ยในเกมภูมิรัฐศาสตรที่ใหญกวา ถึงเวลาแลวที่ตองตัดสินใจวาเราจะยอมรับการโอนนี้ หรือตอตานการถูกตางชาติบังคับควบคุม"
 IRQ_political_events.41.a: "เราจะดีขึ้นกวาเดิม"
 IRQ_political_events.41.b: "การจัดการในปจจุบันเหมาะกับเราแลว"
 
 IRQ_political_events.42.t: "[FROM.GetNameDefCap]ปฏิเสธคําขอ"
 IRQ_political_events.42.desc: "รัฐบาล[FROM.GetNameDef]ไดปฏิเสธขอเสนอของเราที่จะโอนซีเรียมาอยูภายใตอํานาจของเราอยางสิ้นเชิง โดยปดตกวิสัยทัศนดานเอกภาพอาหรับและเสถียรภาพในภูมิภาคของเรา การปฏิเสธนี้บอนทําลายความพยายามในการรวมโลกอาหรับ และพรากโอกาสของชาวซีเรียที่จะไดเขารวมรัฐที่เขมแข็งและเปนหนึ่งเดียว คําถามในตอนนี้คือ จะเดินหนาทางการทูตตอไป หรือเตรียมแกไขขอพิพาทนี้ดวยวิธีที่แข็งกราวกวา"
 IRQ_political_events.42.a: "เราไมควรบีบเรื่องนี้"
 IRQ_political_events.42.b: "เรามีวิธีอื่นในการยึดดินแดน"
 
 IRQ_political_events.43.t: "[FROM.GetNameDefCap]ตกลงตามคําขอ"
 IRQ_political_events.43.desc: "[FROM.GetNameDef]ไดตกลงตามขอเสนอของเราที่จะโอนซีเรียมาอยูภายใตอํานาจของเรา นับเปนกาวสําคัญสูการรวมโลกอาหรับ ขอตกลงอันเปนประวัติศาสตรนี้เสริมสถานะผูนําในภูมิภาคของเรา และนําเราเขาใกลวิสัยทัศนแหงชาติอาหรับที่เปนหนึ่งเดียวและรุงเรือง"
 IRQ_political_events.43.a: "ยอดเยี่ยม!"

 IRQ_political_events.44.t: "[FROM.GetNameDefCap]เรียกรองใหผนวกเรา"
 IRQ_political_events.44.desc: "รัฐบาล[FROM.GetNameDef]ไดขอใหเราเขารวมกับพวกเขา ถึงเวลาแลวที่ตองตัดสินใจวาเราจะยอมรับ หรือตอตานการถูกตางชาติบังคับควบคุม"
 IRQ_political_events.44.a: "$IRQ_political_events.40.a$"
 IRQ_political_events.44.b: "$IRQ_political_events.40.b$"
 
 IRQ_political_events.50.t: "[FROM.GetNameDefCap]ขอคูเวต"
 IRQ_political_events.50.desc: "รัฐบาล[FROM.GetNameDef]ไดยื่นคําขออยางเปนทางการใหเราโอนการควบคุมคูเวตไปอยูภายใตอํานาจของพวกเขา โดยอางวาคูเวตในฐานะสวนหนึ่งที่แยกไมไดของโลกอาหรับ ควรรวมเขากับ[FROM.GetNameDef]ภายใตการบริหารเดียวเพื่อสรางเสถียรภาพและความรุงเรืองใหแกภูมิภาค แมพวกเขาจะนําเสนอคําขอนี้วาเปนกาวสูเอกภาพของชาวอาหรับ แตการยกคูเวตใหจะลดทอนอิทธิพลของเราในตะวันออกกลางลงอยางมาก การปฏิเสธขอเสนออาจทําใหความสัมพันธตึงเครียดยิ่งขึ้นและอาจนําไปสูการบานปลาย"
