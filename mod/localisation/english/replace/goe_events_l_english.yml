l_english:
 AFG_industrial_events.10.t: "[FROM.GetNameDefCap] เสนอสัมปทานนํ้ามัน"
 AFG_industrial_events.10.desc: "รัฐบาล[FROM.GetNameDef]เสนอการรวมลงทุน โดยเราจะชวยพวกเขาพัฒนาแหลงนํ้ามันที่เพิ่งคนพบ เพื่อแลกกับสัมปทานระยะยาวในนํ้ามันที่ผลิตได แมขอเสนอนี้ดูจริงใจ แตเราไมอาจรับประกันไดวาจะยังเขาถึงนํ้ามันได หากรัฐบาล[FROM.GetAdjective]เปลี่ยนใจ"
 AFG_industrial_events.10.a: "สิ่งนี้เปนผลประโยชนทางยุทธศาสตรของเรา"  
 AFG_industrial_events.10.b: "เราไมจําเปนตองเขาไปพัวพันกับกิจการภายในของ[FROM.GetAdjective]"

 AFG_industrial_events.11.t: "[FROM.GetNameDefCap] ตกลงขอตกลงนํ้ามัน"
 AFG_industrial_events.11.desc: "รัฐบาล[FROM.GetAdjective]ตกลงลงทุนพัฒนาทรัพยากรนํ้ามันของเรา เพื่อแลกกับสวนแบงระยะยาวเมื่อเริ่มการผลิต"
 AFG_industrial_events.11.a: "นี่จะเปนกาวสําคัญสูการพัฒนาอุตสาหกรรม"  

 AFG_industrial_events.12.t: "[FROM.GetNameDefCap] ปฏิเสธขอตกลงนํ้ามัน"
 AFG_industrial_events.12.desc: "รัฐบาล[FROM.GetAdjective]ผูมีวิสัยทัศนคับแคบไดปฏิเสธขอเสนอของเราในการรวมพัฒนาทรัพยากรนํ้ามัน"
 AFG_industrial_events.12.a: "เราจะหาหุนสวนรายอื่นสําหรับโครงการนี้" 

 AFG_industrial_events.13.t: "[FROM.GetNameDefCap] โอนกิจการนํ้ามันเปนของรัฐ"
 AFG_industrial_events.13.desc: "รัฐบาล[FROM.GetAdjective]ไดโอนกิจการนํ้ามันเปนของรัฐ แมเราจะลงทุนไปอยางมหาศาล การโอนเปนของรัฐนําไปสูการยุติสัมปทานนํ้ามันระยะยาวที่เราตกลงกันไวทันที บัดนี้ทั้งภูมิภาคตางกลั้นหายใจรอการตอบสนองของเรา"
 AFG_industrial_events.13.a: "เราเสี่ยงและเราแพ" 
 AFG_industrial_events.13.b: "ทรัพยากรเหลานั้นจะถูกยึดคืนดวยกําลัง"

 AFG_industrial_events.14.t: "[FROM.GetName] ประกาศสงครามกับ [ROOT.GetName]"
 AFG_industrial_events.14.desc: "ระบอบ[FROM.GetAdjective]ผูยโสไดประกาศเจตนาที่จะโคนลมรัฐบาลอันชอบธรรมของเรา ดวยขอหาที่เราใชทรัพยากรธรรมชาติเพื่อประโยชนของประชาชนของเราเอง ยังไมชัดเจนวาพวกเขาจะทําตามคําขูอยางไร แตเราควรเริ่มเตรียมพรอมรับการรุกลํ้าทางทหารเขาสูดินแดนของเรา"
 AFG_industrial_events.14.a: "เราจะไมยอมจํานนตอการขมเหง"  

 AFG_industrial_events.15.t: "[FROM.GetNameDefCap] ตอตานการโอนเปนของรัฐเพียงเล็กนอย"
 AFG_industrial_events.15.desc: "รัฐบาล[FROM.GetNameDef]ไดกลาววาทะรุนแรงเกี่ยวกับการโอนกิจการนํ้ามันเปนของรัฐของเรา อยางไรก็ตาม ไมมีสัญญาณวาพวกเขาตั้งใจจะดําเนินการตอ"
 AFG_industrial_events.15.a: "เรื่องนี้จบแลว"  

 AFG_industrial_events.16.t: "สัมปทานนํ้ามันใน[FROM.GetAdjective]ถูกระงับ"
 AFG_industrial_events.16.desc: "เนื่องจากความเปนปฏิปกษระหวางสองชาติเมื่อเร็วๆ นี้ รัฐบาล[FROM.GetNameDef]ไดระงับสัมปทานนํ้ามันของเราในประเทศ แมการสูรบจะยุติลง พวกเขาก็นาจะตองการควบคุมทรัพยากรของตนเองตอไป"
 AFG_industrial_events.16.a: "เปนเรื่องที่คาดไวแลว" 

 AFG_industrial_events.20.t: "โอกาสการลงทุนใน [FROM.GetName]"
 AFG_industrial_events.20.desc: "รัฐบาล[FROM.GetAdjective]กําลังดําเนินนโยบายเพิ่มการลงทุนจากตางชาติในประเทศ และไดติดตอมาสอบถามความสนใจของเรา แมเราจะไมไดประโยชนทางเศรษฐกิจมากนักจากขอตกลงนี้ แตจะเปนโอกาสอันดีในการโนมนาวรัฐบาล[FROM.GetAdjective]ใหคิดแบบเรา"
 AFG_industrial_events.20.a: "การเสริมอิทธิพลของเราในภูมิภาคเปนเรื่องสําคัญ"
 AFG_industrial_events.20.b: "[FROM.GetNonIdeologyName] ไมไดอยูในแผนระยะยาวของเรา"

 AFG_industrial_events.21.t: "รัฐบาล[FROM.GetAdjective]ประกาศการลงทุน"
 AFG_industrial_events.21.desc: "มิตรของเราใน [FROM.GetNameDef] ประกาศเจตนาที่จะลงทุนเงินจํานวนมากในการพัฒนาอุตสาหกรรมของประเทศเรา แมสิ่งนี้จะเปนประโยชนอยางยิ่งทางเศรษฐกิจ แตเราตองระวังไมใหฝาย[FROM.GetAdjective]ใชสิ่งนี้แทรกแซงการเมืองของเรามากเกินไป"
 AFG_industrial_events.21.a: "ขาวดีเยี่ยม!"

 AFG_industrial_events.22.t: "$bftb_greece.194.t$"
 AFG_industrial_events.22.desc: "$bftb_greece.194.desc$"
 AFG_industrial_events.22.a: "$bftb_greece.194.a$"

 AFG_industrial_events.30.t: "[FROM.GetNameDefCap] เปลี่ยนเสนทางการไหลของแมนํ้าเฮลมันด"
 AFG_industrial_events.30.desc: "ในชวงหลายปที่ผานมา รัฐบาล[FROM.GetAdjective]ไดดําเนินโครงการเขื่อนและชลประทานหลายโครงการตามแมนํ้าของตน จนนําไปสูการเปลี่ยนแปลงหลายประการตอแมนํ้าเฮลมันด ซึ่งไหลเขาสูจังหวัดทางตะวันออกของเรา ระดับนํ้าที่ไหลขามพรมแดนลดลงอยางเห็นไดชัดทุกป และประชาชนของเรากังวลวาหากเปนเชนนี้ตอไป พวกเขาจะไมสามารถใชประโยชนจากแมนํ้าไดอีก เราตองตัดสินใจวาจะจัดการเรื่องนี้ภายในประเทศ หรือจะยกเรื่องนี้ขึ้นหารือกับฝาย[FROM.GetAdjective]"
 AFG_industrial_events.30.a: "เราจะเรียกรองใหมีการเจรจากับ [AFG.GetNonIdeologyName] เรื่องการพัฒนาแมนํ้า"
 AFG_industrial_events.30.b: "เราไมอาจเสี่ยงใหเกิดวิกฤตการทูตในตอนนี้"

 AFG_industrial_events.31.t: "รัฐบาล[FROM.GetAdjective]เรียกรองการเจรจาเรื่องแมนํ้า"
 AFG_industrial_events.31.desc: "รัฐบาล[FROM.GetNameDefCap]ไดขอเจรจาเกี่ยวกับการเปลี่ยนแปลงแมนํ้าเฮลมันดของเราเมื่อเร็วๆ นี้ พวกเขาอางวาเขื่อนและระบบชลประทานของเรากําลังลดการไหลของแมนํ้าขามพรมแดนจนถึงระดับอันตราย บางคนในคณะรัฐมนตรีเสนอใหจัดทําสนธิสัญญาเพื่อควบคุมการไหลของนํ้าขามพรมแดน ซึ่งนาจะหมายถึงการลดประโยชนจากการเปลี่ยนแปลงแมนํ้าที่เราทําอยู แตก็จะลดผลกระทบที่มีตอประชาชนชาว[FROM.GetAdjective]ที่อยูอีกฝงของพรมแดนดวย"
 AFG_industrial_events.31.a: "บางทีเราอาจจัดทําสนธิสัญญาวาดวยนํ้าได?"
 AFG_industrial_events.31.b: "นํ้านี้เปนของเรา และเราจะทําอะไรกับมันก็ไดตามใจ"
 AFG_industrial_events_31_tt: "§Rแนวทางนี้อาจนําไปสูสงครามกับ[FROM.GetNameDefCap]!§!"

 AFG_industrial_events.32.t: "รัฐบาล[FROM.GetAdjective]เสนอสนธิสัญญาวาดวยนํ้า"
 AFG_industrial_events.32.desc: "รัฐบาล[FROM.GetNameDefCap]เสนอใหจัดทําสนธิสัญญาวาดวยนํ้าระหวางสองชาติ เพื่อควบคุมปริมาณนํ้าที่พวกเขาใชในโครงการชลประทานได พรอมทั้งรับประกันปริมาณนํ้าขั้นตํ่าที่ไหลขามพรมแดนมายังเรา แมขอเสนอจะดูสมเหตุสมผล แตก็เปนไปไดวาเราจะตองยอมรับปริมาณนํ้าที่ลดลงเมื่อเทียบกับที่เคยไดรับมาในอดีต"
 AFG_industrial_events.32.a: "ฟงดูสมเหตุสมผล"
 AFG_industrial_events.32.b: "มีเพียงการรื้อถอนสิ่งที่ดัดแปลงทั้งหมดเทานั้นที่จะทําใหเราพอใจ"

 AFG_industrial_events.33.t: "[FROM.GetNameDefCap]ปฏิเสธการเจรจาตอ"
 AFG_industrial_events.33.desc: "รัฐบาล[FROM.GetNameDefCap]ปฏิเสธการเจรจาใด ๆ อีกเกี่ยวกับการพัฒนาตามแนวแมนํ้าเฮลมันด โดยอางวานํ้าที่ไหลผานดินแดนของพวกเขาเปนของพวกเขา จะทําอยางไรก็ได การยอมออนขอใหในตอนนี้อาจทําใหพวกเขาไดใจจนถึงขั้นตัดการไหลของนํ้าทั้งหมดในอนาคต อยางไรก็ตาม การยกระดับสถานการณตอจากนี้หมายถึงการที่เราตองหันไปใชกําลังอาวุธ"
 AFG_industrial_events.33.a: "เราไมมีทรัพยากรพอจะยกระดับเปนการปะทะทางทหาร"
 AFG_industrial_events.33.b: "ถาเชนนั้นเราจะแกไขสถานการณดวยกําลัง"

 AFG_industrial_events.34.t: "[FROM.GetNameDefCap]ตกลงทําสนธิสัญญาวาดวยนํ้า"
 AFG_industrial_events.34.desc: "รัฐบาล[FROM.GetAdjective]ตกลงทําสนธิสัญญาวาดวยนํ้าระหวางสองชาติ โดยมีเงื่อนไขวาตองรับประกันปริมาณนํ้าขั้นตํ่าที่ยอมรับไดไหลขามพรมแดนไปยังพวกเขา แมจะทําใหเราใชประโยชนจากเขื่อนไดไมเต็มที่อยางที่ผานมา แตอยางนอยก็จะหลีกเลี่ยงความขัดแยงเรื่องแมนํ้าเฮลมันดไดในอนาคตอันใกล"
 AFG_industrial_events.34.a: "วิกฤตการณคลี่คลายลงแลว"

 AFG_industrial_events.35.t: "[FROM.GetNameDefCap]ปฏิเสธสนธิสัญญาวาดวยนํ้า"
 AFG_industrial_events.35.desc: "[FROM.GetNameDefCap]ปฏิเสธที่จะยอมรับสนธิสัญญาใด ๆ และกลับเรียกรองใหรื้อถอนโครงการทั้งหมดตามแนวแมนํ้าเฮลมันดที่ทําใหนํ้าไหลไปถึงพวกเขานอยลง ดูเหมือนวาพวกเขาพรอมจะใชกําลังบังคับหากเราปฏิเสธ"
 AFG_industrial_events.35.a: "เราปลอยใหเรื่องนี้บานปลายไปมากกวานี้ไมได"
 AFG_industrial_events.35.b: "หากพวกเขาไมยอมมีเหตุผล ก็ไมมีประโยชนที่จะเจรจาตอ"

 AFG_industrial_events.36.t: "[FROM.GetAdjective]ตกลงรื้อถอนสิ่งดัดแปลงบนแมนํ้าเฮลมันด"
 AFG_industrial_events.36.desc: "รัฐบาล[FROM.GetAdjective]ตกลงรื้อถอนสิ่งดัดแปลงหลายอยางที่พวกเขาสรางไวบนแมนํ้าเฮลมันด แมเรื่องนี้จะสรางความขุนเคืองตอเราอยางมากแนนอน แตอยางนอยเราก็หลีกเลี่ยงการเผชิญหนาดวยอาวุธไปไดในตอนนี้"
 AFG_industrial_events.36.a: "เสียทีนะ"

 AFG_industrial_events.37.t: "กองกําลัง[FROM.GetAdjective]เตรียมการรุกราน"
 AFG_industrial_events.37.desc: "มีรายงานวากองทัพ[FROM.GetAdjective]ตามแนวพรมแดนของเรากําลังระดมพลเพื่อบุกหุบเขาแมนํ้าเฮลมันด หลังการเจรจาระหวางรัฐบาลทั้งสองลมเหลว ดูเหมือนเราไมมีทางเลือกนอกจากตองระดมกําลังของเราเองตอบโต"
 AFG_industrial_events.37.a: "ชางเปนการยกระดับที่ไรสาระเสียจริง"

 AFG_industrial_events.38.t: "รัฐบาล[FROM.GetAdjective]เงียบหายเรื่องสิ่งดัดแปลงบนแมนํ้าเฮลมันด"
 AFG_industrial_events.38.desc: "แมรัฐบาลทั้งสองจะเจรจากันอยางดุเดือดมาหลายสัปดาห แตดูเหมือนวาชาว[FROM.GetAdjective]จะเลิกขัดขวางโครงการเขื่อนและชลประทานของเราไปกอนแลว มีแตเวลาเทานั้นที่จะบอกไดวาพวกเขาจะหยิบยกเรื่องนี้ขึ้นมาอีกในอนาคตหรือไม"
 AFG_industrial_events.38.a: "ดูเหมือนสิ่งกอสรางของเราจะปลอดภัย อยางนอยก็ในตอนนี้"

 AFG_industrial_events.40.t: "บัณฑิตมหาวิทยาลัยหันไปนิยมแนวคิดสุดโตงมากขึ้น"
 AFG_industrial_events.40.desc: "ความพยายามขยายการอุดมศึกษาของเรากลับเกิดผลสะทอนจากบัณฑิตจบใหมที่หางานซึ่งไดใชทักษะของตนไมได เรื่องนี้ทําใหเกิดความผิดหวังในหมูบัณฑิต ซึ่งตอนนี้หันไปหาการเมืองแนวสุดโตงเพื่อระบายความคับของใจ"
 AFG_industrial_events.40.a: "เปนพัฒนาการที่นาวิตก"

 AFG_industrial_events.50.t: "การตอตานของชาวปาทานเริ่มหยั่งราก"
 AFG_industrial_events.50.desc: "ดวยการใชเครือขายขามพรมแดนของประชากรชาวปาทานของเรา เราประสบความสําเร็จในการปลุกปนพี่นองรวมเผาพันธุของพวกเขาฝงตรงขามใหลุกขึ้นประทวงตอตานรัฐบาลและเรียกรองใหรวมเขาอยูใตการปกครองของเรา "
 AFG_industrial_events.50.a: "อีกไมนานพวกเขาจะไดรับการปลดปลอย!"

 AFG_industrial_events.51.t: "การตอตานของชาวปาทานตามแนวพรมแดน[AFG.GetAdjective]"
 AFG_industrial_events.51.desc: "ดูเหมือนพวกยุยงปลุกปนจาก[FROM.GetNonIdeologyName]กําลังขามพรมแดนมากอความไมสงบในหมูประชากรชาวปาทาน มีการพูดถึงการรวมชาวปาทานเขาอยูใตการปกครองของ[FROM.GetAdjective]แทนที่จะเปนของเรา"
 AFG_industrial_events.51.a: "สถานการณนาวิตก"

 AFG_industrial_events.52.t: "รัฐบาล[FROM.GetAdjective]เสนอใหโอนดินแดน"
 AFG_industrial_events.52.desc: "เนื่องจากความตึงเครียดที่ยังคงเกิดขึ้นในดินแดนบางสวนของเราที่มีชาวปาทานเปนสวนใหญ รัฐบาล[FROM.GetAdjective]ถึงกับบังอาจมาเสนอขอเขาควบคุมภูมิภาคที่วุนวายเหลานั้นเสียเอง มีความสงสัยกันอยางกวางขวางวาพวกเขาอยูเบื้องหลังความไมสงบที่เกิดขึ้นมาตลอด"
 AFG_industrial_events.52.a: "ดินแดนนี้สรางปญหามากกวาคุณคาที่มันมี"
 AFG_industrial_events.52.b: "นี่คือดินแดนอธิปไตยของเรา ไมวาพวกเขาจะอางอยางไร"

 AFG_industrial_events.53.t: "รัฐบาล[FROM.GetAdjective]โอนดินแดน"
 AFG_industrial_events.53.desc: "ดวยความที่ตองวุนอยูกับปญหาเรงดวนกวาที่อื่น รัฐบาลของ[FROM.GetNameDef]จึงตกลงโอนดินแดนบางสวนที่ความไมสงบของชาวปาทานลุกลามจนเกินควบคุมใหแกเรา อยางไรก็ตาม เราอาจทําลายความสัมพันธกับเพื่อนบานชาว[FROM.GetAdjective]จนยากจะเยียวยา เพราะการเขาไปแทรกแซงกิจการภายในของพวกเขา"
 AFG_industrial_events.53.a: "ยอดเยี่ยม"

 AFG_industrial_events.54.t: "[FROM.GetNameDefCap]ปฏิเสธการโอนดินแดน"
 AFG_industrial_events.54.desc: "แมเราจะชักใยสถานการณตามแนวพรมแดนกับ[FROM.GetNameDef]อยางแยบยล แตรัฐบาลของพวกเขาก็ปฏิเสธที่จะมอบการควบคุมดินแดนชาวปาทานใด ๆ ใหเรา ดูเหมือนหนทางเดียวที่เราจะไดดินแดนนี้มาคือการยกระดับสถานการณดวยการขูใชกําลังทหารเขาแทรกแซง"
 AFG_industrial_events.54.a: "เราไมมีความประสงคจะยกระดับสถานการณนี้"
 AFG_industrial_events.54.b: "เราไมกลัวที่จะปลดปลอยดินแดนนี้ดวยกําลัง"

 AFG_industrial_events.55.t: "[FROM.GetNameDefCap]ขูจะทําสงคราม"
 AFG_industrial_events.55.desc: "รัฐบาล[FROM.GetAdjective]ออกแถลงการณประณามการที่เรายึดครองดินแดนที่อางวาเปนของชาวปาทาน และสงสัญญาณวาพรอมจะปลดปลอยดินแดนนั้นดวยกําลังหากจําเปน แนนอนวาพวกเขาอาจแคขู แตในตอนนี้เราไมมีทางรูเจตนาที่แทจริงของพวกเขาไดเลย"
 AFG_industrial_events.55.a: "เรามีทางเลือกไมมากนอกจากตองเอาใจพวกเขา"
 AFG_industrial_events.55.b: "เราพรอมปกปองดินแดนของเราไมวาจะตองแลกดวยอะไร"

 AFG_industrial_events.56.t: "[FROM.GetNameDefCap]ปฏิเสธคําขาด"
 AFG_industrial_events.56.desc: "ไมนาแปลกใจเลยที่พวกหัวรั้นโงเขลาใน[FROM.Capital.GetCapitalVictoryPointName]ปฏิเสธที่จะคืนดินแดนอันชอบธรรมตามแนวพรมแดนใหเรา ดวยเหตุนี้ เราตองเลือกระหวางทําตามที่ขูไวดวยการรุกลํ้าทางทหาร หรือเสี่ยงเสียหนาบนเวทีระหวางประเทศ"
 AFG_industrial_events.56.a: "ถึงเวลาทําตามที่เราขูไวแลว"
 AFG_industrial_events.56.b: "เราตองถอย"

 AFG_industrial_events.57.t: "รัฐบาล[FROM.GetAdjective]ยอมสละการอางสิทธิ์"
 AFG_industrial_events.57.desc: "ในที่สุดรัฐบาล[FROM.GetAdjective]ก็ยอมรับฟงเหตุผล และตัดสินใจลดความตึงเครียดตามแนวพรมแดน โดยเพิกถอนการอางสิทธิ์ในดินแดนชายแดนที่มีปญหา ซึ่งความตึงเครียดไดทวีขึ้นเมื่อไมนานมานี้"
 AFG_industrial_events.57.a: "ชัยชนะของกฎหมายและระเบียบระหวางประเทศ"

 AFG_industrial_events.58.t: "[FROM.GetNameDefCap]เสนอเงื่อนไขสันติภาพ"
 AFG_industrial_events.58.desc: "นักการทูต[FROM.GetAdjective]เขามาเสนอสันติภาพกับเรา โดยมีเงื่อนไขวาเราตองยอมรับการควบคุมของพวกเขาเหนือดินแดนชาวปาทานที่เปนขอพิพาทตามแนวพรมแดน ในเมื่อพวกเขายึดครองดินแดนนั้นอยู เราก็ไมมีหลักประกันวาจะขับไลพวกเขาออกไปไดในเร็ววัน อยางไรก็ตาม การยอมเชนนี้จะสรางบรรทัดฐานวา[FROM.GetNameDef]สามารถเฉือนพรมแดนของเราไปทีละชิ้นได"
 AFG_industrial_events.58.a: "ยุติความขัดแยงนี้เสียเถิด"
 AFG_industrial_events.58.b: "เราจะขับไลพวกเขาออกจากแผนดินของเรา"

 AFG_industrial_events.59.t: "[FROM.GetNameDefCap]ปฏิเสธเงื่อนไขสันติภาพ"
 AFG_industrial_events.59.desc: "รัฐบาลของ[FROM.GetNameDef]ปฏิเสธขอเสนอสันติภาพลาสุดของเรา เห็นไดชัดวาพวกเขายังเชื่อวาตนมีศักยภาพพอจะขับไลเราออกจากดินแดนอันชอบธรรมของเรา"
 AFG_industrial_events.59.a: "ถาเชนนั้นเราจะปกปองดินแดนของเราตอไป"

 AFG_political_events.01.t: "ขอเสนอรวมเอเชียกลาง"
 AFG_political_events.01.desc: "ผูแทนของ[FROM.GetNameDef]เขามาพรอมขอเสนอที่กลาหาญในการจัดระเบียบเอเชียกลางใหม ขอเสนอนี้กําหนดใหเราสงมอบการควบคุมรัฐหลายแหงตามแนวพรมแดน[FROM.GetAdjective]ใหแกพวกเขา และจัดตั้งสหพันธรัฐสังคมนิยมแหงใหมภายใตการบริหารของ[FROM.Capital.GetCapitalVictoryPointName] การนี้อาจชวยใหเราสรางรัฐกันชนที่ทรงพลังในภูมิภาค ซึ่งจะแบงเบาภาระดานการปองกันบางสวนของเราในภูมิภาคนี้ และทําใหกองทัพของเราวางพอจะสงไปประจําการที่อื่น"
 AFG_political_events.01.a: "ขอเสนอที่นาสนใจ"
 AFG_political_events.01.b: "เรามีแผนอื่นสําหรับภูมิภาคนี้"

 AFG_political_events.02.t: "[FROM.GetName]ยอมรับขอเสนอ"
 AFG_political_events.02.desc: "[FROM.GetNameDefCap]ยอมรับขอเสนอของเราในการรวมเอเชียกลางเปนหนวยการเมืองเดียวภายใตการควบคุมของเรา ดูเหมือนยุคใหมกําลังมาถึงประชาชนของเรา หลังจากความไรเสถียรภาพที่ยาวนานหลายทศวรรษ"
 AFG_political_events.02.a: "ยอดเยี่ยม!"

 AFG_political_events.03.t: "[FROM.GetName]ปฏิเสธขอเสนอ"
 AFG_political_events.03.desc: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอของเราในการรวมเอเชียกลางเปนหนวยการเมืองเดียวภายใตการควบคุมของเรา แมจะเปนความถดถอยครั้งใหญ แตความฝนนี้ยังไมดับสิ้น เราเพียงตองรอคอยจังหวะและเฝารอโอกาสที่เหมาะสม"
 AFG_political_events.03.a: "พวกเขาขวางทางเราไปตลอดกาลไมไดหรอก"


 AFG_political_events.10.t: "[FROM.GetNameDefCap]เสนอใหตั้งสมาพันธรัฐ"
 AFG_political_events.10.desc: "รัฐบาลของ[FROM.GetNonIdeologyName]ยื่นขอเสนอที่นาสนใจเพื่อเสริมความแข็งแกรงใหสองชาติของเราดวยการรวมกันเปนสมาพันธรัฐ ซึ่งหมายถึงการเปดพรมแดนระหวางกันเปนตลาดเศรษฐกิจเดียว และกําหนดนโยบายตางประเทศรวมกันบนเวทีโลก อยางไรก็ตาม ทายที่สุดแลวการนี้จะจํากัดเสรีภาพในการดําเนินการของเราเอง"
 AFG_political_events.10.a: "เราสนับสนุนความริเริ่มนี้"
 AFG_political_events.10.b: "เราเพิ่งสลัดเจาเหนือหัวพนไปรายหนึ่ง และไมตองการอีกราย"

 AFG_political_events.11.t: "[FROM.GetName]ตกลงตั้งสมาพันธรัฐ"
 AFG_political_events.11.desc: "รัฐบาล[FROM.GetAdjective]ตกลงตามขอเสนอตั้งสมาพันธรัฐของเรา บัดนี้เราสามารถเริ่มกระบวนการผนวกรวมระบบการเมืองและเศรษฐกิจของทั้งสองชาติใหเปนหนึ่งเดียว หวังวาสิ่งนี้จะชวยยับยั้งศัตรูในภูมิภาคของเราไดในอนาคตอันใกล"
 AFG_political_events.11.a: "ยอดเยี่ยม!"

 AFG_political_events.12.t: "[FROM.GetName]ปฏิเสธการตั้งสมาพันธรัฐ"
 AFG_political_events.12.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอของเราในการรวมสองชาติเปนสมาพันธรัฐ นี่เปนความลมเหลวดานนโยบายตางประเทศครั้งใหญของเรา และทําใหเกิดความกังวลวาความสัมพันธระยะยาวกับ[FROM.GetNameDef]จะเปนอยางไรตอจากนี้"
 AFG_political_events.12.a: "โอกาสที่หลุดลอยไป"

 AFG_political_events.20.t: "[FROM.GetName]แสวงหาการลงทุน"
 AFG_political_events.20.desc: "นักการทูตของ[FROM.GetNameDefCap]เขามาพรอมขอเสนอทางเศรษฐกิจใหเราลงทุนในเศรษฐกิจของพวกเขา โดยอางวาหากเราเขาไปพัฒนาอุตสาหกรรมให เราก็จะไดประโยชนจากการสงออกในอนาคต ยิ่งไปกวานั้น พวกเขายังชี้ชัดวาการนี้จะทําใหชาว[SOU.GetAdjective]และชาว[ENG.GetAdjective] ซึ่งเปนผูเลนหลักใน[FROM.GetNonIdeologyName]มาโดยตลอด ไมพอใจอยางแนนอน"
 AFG_political_events.20.a: "การบอนทําลายอิทธิพลของศัตรูในชาตินี้จะเปนประโยชนตอเรา"
 AFG_political_events.20.b: "เราไมสนใจ[FROM.GetNonIdeologyName]"

 AFG_political_events.21.t: "[FROM.GetName]ตกลงลงทุนในเศรษฐกิจของเรา"
 AFG_political_events.21.desc: "นักการทูต[FROM.GetAdjective]ประกาศวารัฐบาลของพวกเขาสนับสนุนขอเสนอของเราในการลงทุนใน[ROOT.GetNonIdeologyName] วิศวกรและผูประกอบการกําลังเดินทางมาเพื่อกอตั้งอุตสาหกรรมใหมทั่วประเทศแลว"
 AFG_political_events.21.a: "ชางเปนการชวยเหลือที่ใจกวาง!"

 AFG_political_events.22.t: "[FROM.GetName]ปฏิเสธที่จะลงทุนในเศรษฐกิจของเรา"
 AFG_political_events.22.desc: "นักการทูต[FROM.GetAdjective]ประกาศวารัฐบาลของพวกเขาปฏิเสธที่จะลงทุนใน[ROOT.GetNonIdeologyName] โดยอางวาเจตนาระยะยาวของเรายังไมชัดเจน และพวกเขาไมตองการใหความชวยเหลือทางเศรษฐกิจแกชาติที่ทายที่สุดอาจตกไปอยูในเขตอิทธิพลของศัตรูของพวกเขา"
 AFG_political_events.22.a: "เราจะจําเรื่องนี้ไว"

 AFG_political_events.30.t: "อนาคตของ[ROOT.GetNonIdeologyName]"
 AFG_political_events.30.desc: "หลังการปฏิรูปการเมืองและการประนีประนอมระหวางกลุมตาง ๆ ทั่วประเทศมาหลายป บัดนี้เรามีโอกาสสลัดพันธนาการของระบอบกษัตริยทิ้งไปไดตลอดกาล อยางไรก็ตาม เราตองนิยามใหมวาเราคือใครในฐานะชาติ"
 AFG_political_events.30.a: "นี่คือการเริ่มตนใหม และเราจะเปนสาธารณรัฐ[ROOT.GetAdjective]"
 AFG_political_events.30.b: "เราคือชาติของชาวปาทานเหนือสิ่งอื่นใด"
 AFG_political_events.30.c: "การผสานประชาธิปไตยเขากับศาสนาอิสลามคือหนทางขางหนา"

 AFG_political_events.40.t: "[FROM.GetNameDefCap]ยื่นคําขาด"
 AFG_political_events.40.desc: "ผูแทนจากสถานทูต[FROM.GetAdjective]ยื่นคําขาดตอรัฐบาลของเรา โดยเรียกรองใหเราจํากัดอิทธิพลตางชาติในประเทศที่อาจทําใหผลประโยชนของ[FROM.GetAdjective]ตกอยูในความเสี่ยง มิฉะนั้นอาจตองเผชิญการแทรกแซงทางทหารเพื่อเปลี่ยนรัฐบาลของเรา"
 AFG_political_events.40.a: "เราไมอยูในฐานะที่จะโตแยงได"
 AFG_political_events.40.b: "นี่เปนแคการขูลม ๆ แลง ๆ และเราจะไมหวั่นเกรง"

 AFG_political_events.41.t: "[FROM.GetNameDefCap]ยอมตามขอเรียกรอง"
 AFG_political_events.41.desc: "รัฐบาล[FROM.GetAdjective]ยอมตามขอเรียกรองของเราใหยุติการแทรกแซงจากตางชาติในประเทศของพวกเขา ซึ่งอาจบอนทําลายผลประโยชนของเราในภูมิภาค แมพวกเขาจะไมพอใจการแทรกแซงของเราอยางแนนอน แตดูเหมือนพวกเขาจะไมมีใจจะสูในอนาคตอันใกล "
 AFG_political_events.41.a: "เราจะเฝาจับตาพวกเขาอยางใกลชิดตอไป"

 AFG_political_events.42.t: "[FROM.GetNameDefCap]ปฏิเสธขอเรียกรอง"
 AFG_political_events.42.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเรียกรองของเราใหยุติการแทรกแซงจากตางชาติในประเทศของพวกเขา โดยอางวาเราไมมีสิทธิ์แทรกแซงกิจการภายในของพวกเขา และขอตกลงที่พวกเขาเจรจาไวกับชาติอื่น"
 AFG_political_events.42.a: "เราจะตองใชวิธีอื่นเพื่อดึงพวกเขาใหมาอยูฝงเรา"
 AFG_political_events.42.b: "พวกเขาไมเหลือทางเลือกใหเราเลย"

 AFG_political_events.43.t: "การแทรกแซงจากตางชาติใน[FROM.GetNameDefCap]"
 AFG_political_events.43.desc: "เอกอัครราชทูตของเราประจํา[FROM.GetNameDefCap]รายงานวาเมื่อไมนานมานี้มีการลงนามขอตกลงบางอยางกับผูแทนของอีกประเทศหนึ่งใน[FROM.Capital.GetCapitalVictoryPointName] แมรายละเอียดของขอตกลงจะยังไมชัดเจน แตแทบไมตองสงสัยเลยวารัฐบาล[FROM.GetAdjective]กําลังถูกชักจูงโดยชาติที่อาจตองการบอนทําลายผลประโยชนของเราในภูมิภาค"
 AFG_political_events.43.a: "เราจะจับตาสถานการณตอไป"

 AFG_political_events.51.t: "$AFG_amunullah_khan$ แหง[AFG.GetNonIdeologyName]ขอความชวยเหลือ"
 AFG_political_events.51.desc: "$AFG_amunullah_khan$ อดีตผูปกครองของ[FROM.GetNonIdeologyName] ไดสงสารลับติดตอมายังรัฐบาลของเราเพื่อขอการสนับสนุนใหเขาไดกลับคืนสูบัลลังก เขาสัญญาวาหากไดรับการหนุนหลังจากเยอรมนี เขาจะสรางชาติที่เขมแข็งและทันสมัยซึ่งสอดคลองกับผลประโยชนของเรา"
 AFG_political_events.51.a: "เราตองการพันธมิตรเพิ่มในภูมิภาคนั้น"
 AFG_political_events.51.b: "จะไปยุงกับดินแดนที่หางไกลขนาดนั้นทําไม?"

 AFG_political_events.52.t: "[FROM.GetNameDefCap]ปฏิเสธแผนการ"
 AFG_political_events.52.desc: "รัฐบาล[FROM.GetAdjective]ตอบกลับคําขอของเราวาเสียใจที่ไมอาจใหการสนับสนุนการคืนบัลลังกแก $AFG_amunullah_khan$ ได โดยอางถึงความกังวลเรื่องการถูกดึงเขาไปพัวพันและสภาพภูมิรัฐศาสตรในปจจุบัน [FROM.GetAdjective]จึงตัดสินใจมุงไปที่ลําดับความสําคัญทางยุทธศาสตรอื่น"
 AFG_political_events.52.a: "กลาดีอยางไรถึงทรยศเรา!"

 AFG_political_events.53.t: "[FROM.GetNameDefCap]ตกลงสนับสนุนเรา"
 AFG_political_events.53.desc: "รัฐบาลของ[FROM.GetName]ตอบรับคําขอของเรา และตกลงสนับสนุนการคืนบัลลังกแหง[ROOT.GetNonIdeologyName]แก $AFG_amunullah_khan$ การหนุนหลังนี้จะรวมถึงการสนับสนุนทางทหารและยุทโธปกรณ เพื่อใหภารกิจของเราประสบความสําเร็จ"
 AFG_political_events.53.a: "อนาคตของ[AFG.GetNonIdeologyName]เปนของเรา!"

 AFG_political_events.54.t: "ความชวยเหลือจาก[GER.GetAdjective]มาถึงแลว"
 AFG_political_events.54.desc: "ตามที่ตกลงกันไว ยุทโธปกรณของ[FROM.GetAdjective]ถูกสงมาใหเราใชนับตั้งแตสงครามกลางเมืองปะทุขึ้น สายลับของพวกเขาใน[ROOT.Capital.GetCapitalVictoryPointName]ยังยืนยันกับเราวาทหาร[FROM.GetAdjective]ที่ปฏิบัติการลับจะเดินทางมาถึงประเทศเร็ว ๆ นี้เพื่อชวยเราในการตอสู"
 AFG_political_events.54.a: "ยอดเยี่ยม!"

 AFG_political_events.60.t: "คําเชิญเขารวม$AFG_turko_persian_union$"
 AFG_political_events.60.desc: "รัฐบาลของ[FROM.GetNameDef]กําลังกอตั้งหนวยการเมืองใหมที่พวกเขาเรียกวาสหภาพเติรก-เปอรเซีย ดูเหมือนเปนการนํามรดกทางวัฒนธรรมเติรกและเปอรเซียมาใชเปนอาวุธเพื่อรวมประชาชนทั้งหมดของเราไวใตรัฐบาลเดียว กาวแรกคือการจัดตั้งพันธมิตรทางทหารระหวางเรา หากเราตอบรับ ไมตองสงสัยเลยวาเมื่อเวลาผานไปพวกเขาจะผลักดันการรวมตัวที่มากขึ้นภายใตการนําของพวกเขา"
 AFG_political_events.60.a: "เราจะยอมรับชะตากรรมรวมกันของเรา!"
 AFG_political_events.60.b: "พวกเขาเปนใครถึงมาพูดแทนประชาชน[ROOT.GetAdjective]?"

 AFG_political_events.61.t: "[FROM.GetNonIdeologyName]เขารวม$AFG_turko_persian_union$"
 AFG_political_events.61.desc: "[FROM.GetNameDefCap]ตกลงเขารวมสหภาพเติรก-เปอรเซียของเรา เมื่อรวมกัน กองทัพของเราจะยับยั้งการรุกรานจากศัตรูรวมไดดียิ่งขึ้น แตที่สําคัญกวานั้น เรามีจุดยืนที่จะคอย ๆ กัดกรอนเอกราชของพวกเขาไปตามกาลเวลา"
 AFG_political_events.61.a: "ยอดเยี่ยม!"

 AFG_political_events.62.t: "[FROM.GetNonIdeologyName]ปฏิเสธ$AFG_turko_persian_union$"
 AFG_political_events.62.desc: "[FROM.GetNameDefCap]ปฏิเสธการเปนสมาชิกสหภาพเติรก-เปอรเซีย พวกเขาโกรธเคืองตอสิ่งที่มองวาเปนความหยิ่งผยองของเราที่พยายามพูดแทนชาว[TUR.GetAdjective]และชาว[PER.GetAdjective]ทั้งหมด"
 AFG_political_events.62.a: "สักวันพวกเขาจะเห็นความผิดพลาดของตน"
 AFG_political_events.62.b: "ถาไมอยูขางเรา ก็คือศัตรูของเรา!"

 AFG_political_influence_major_warning_tt: "หาก[FROM.GetNameDefCap]มีการสนับสนุนอุดมการณที่ไมสอดคลองกับเราเกิน §R40%§! เราจะสามารถแทรกแซงและอาจบุกรุกรานพวกเขาไดผานการตัดสินใจ §Y$AFG_foreign_intervention_category$§!"
 AFG_political_events_51_tt: "เมื่อสงครามกลางเมือง[AFG.GetNonIdeologyName]เริ่มขึ้น: "

 AFG_political_events.70.t: "[FROM.GetNonIdeologyName]ปฏิเสธเสนดูแรนด"
 AFG_political_events.70.desc: "เสนดูแรนดซึ่งกําหนดขึ้นในป 1893 เปนพรมแดนระหวางบริติชอินเดียกับ[FROM.GetNonIdeologyName] เปนชนวนความขัดแยงมาชานาน ดวยการเติบโตของชาตินิยม[FROM.GetAdjective]และความปรารถนาที่จะรวมชนเผาปาทานทั้งสองฝงพรมแดนเขาดวยกัน รัฐบาลของ[FROM.GetLeader]จึงประกาศปฏิเสธเสนดูแรนดอยางเปนทางการ [FROM.Capital.GetCapitalVictoryPointName]เรียกรองใหเจรจาพรมแดนใหม โดยอางถึงความคับแคนทางประวัติศาสตรและการแบงแยกดินแดนชาวปาทานอยางไมเปนธรรม พวกเขาถึงกับขูจะทําสงครามหากเราไมสามารถบรรลุขอตกลงได"
 AFG_political_events.70.a: "ในเวลานี้เราไมอาจรับมือกับความขัดแยงได"
 AFG_political_events.70.b: "เราไมอาจรับมือกับสงครามได แตเราตองไดรับความเห็นชอบจาก[ROOT.OVERLORD.capital.GetCapitalVictoryPointName]"
 AFG_political_events.70.c: "เรื่องพรมแดนเปนขอยุติแลว และจะไมมีการหารือใด ๆ อีก "

 AFG_political_events.71.t: "[FROM.GetNameDefCap]ตกลงเจรจาพรมแดนใหม"
 AFG_political_events.71.desc: "แมจะดูเปนไปไมได แต[FROM.GetNameDef]ก็ยอมตามขอเรียกรองของเราใหเจรจาเสนดูแรนดใหม ภายใตแรงกดดันมหาศาลและไมตองการเสี่ยงกับความขัดแยงยืดเยื้อในภูมิภาค ฝาย[FROM.GetAdjective]จึงตกลงขีดเสนพรมแดนใหม โดยยอมรับการอางสิทธิ์อันชอบธรรมของเราเหนือดินแดนชาวปาทาน ชัยชนะทางการทูตครั้งนี้ไมเพียงรวมประชาชนของเราเปนหนึ่งเดียว แตยังเสริมความชอบธรรมของการปกครองของ[ROOT.GetLeader]อีกดวย [ROOT.GetNameDef]ผนึกกําลังเปนหนึ่งเดียวและเขมแข็งกวาที่เคยเปนมา"
 AFG_political_events.71.a: "ชัยชนะอันรุงโรจนของอัฟกานิสถาน!"

 AFG_political_events.72.t: "[FROM.GetNameDef]เสนอยกดินแดนให"
 AFG_political_events.72.desc: "สถานการณการเมืองใน[AFG.GetNameDef]มาถึงจุดวิกฤต รัฐบาลของพวกเขาประกาศปฏิเสธเสนดูแรนดอยางเปนทางการ และเรียกรองใหเจรจาพรมแดนใหมเพื่อรวมชนเผาปาทาน รัฐบาล[AFG.GetAdjective]แสดงชัดเจนวาหากไมทําตามขอเรียกรองนี้ จะนําไปสูการประกาศสงคราม เมื่อเผชิญกับความเปนไปไดของความขัดแยงที่ยืดเยื้อและสิ้นเปลือง [FROM.GetNameDef]จึงเสนอใหยกดินแดนพิพาทแก[AFG.GetNameDef] เพื่อรักษาเสถียรภาพในภูมิภาคและหลีกเลี่ยงการยกระดับความขัดแยง"
 AFG_political_events.72.a: "เราตองหลีกเลี่ยงการถูกดึงเขาไปพัวพันในความขัดแยงอีกครั้ง"
 AFG_political_events.72.b: "เราจะไมยอมถูกขมขูใหยกดินแดน"

 AFG_political_events.73.t: "[FROM.GetNameDefCap]ยอมรับการยกดินแดน"
 AFG_political_events.73.desc: "ดวยความตึงเครียดของโลกในปจจุบันและความเปนไปไดที่จะเกิดความขัดแยงอันสิ้นเปลืองในภูมิภาค [FROM.Capital.GetCapitalVictoryPointName]จึงตัดสินใจวาการยกดินแดนพิพาทให[AFG.GetNonIdeologyName]เปนประโยชนสูงสุดตอพวกเขา เราไดรับคําสั่งใหปฏิบัติตามนโยบายนี้เพื่อรักษาเสถียรภาพและหลีกเลี่ยงสงครามที่ไมจําเปน"
 AFG_political_events.73.a: "ทางออกที่สมเหตุสมผล"

 AFG_political_events.74.t: "[FROM.GetNameDefCap]ปฏิเสธการยกดินแดน"
 AFG_political_events.74.desc: "ขอเรียกรองของ[AFG.GetNonIdeologyName]ใหเจรจาเสนดูแรนดใหมและยกดินแดนชาวปาทานให ถูก[FROM.Capital.GetCapitalVictoryPointName]ตอตานอยางแข็งขัน แมอาจเกิดความขัดแยง แตรัฐบาล[FROM.GetAdjective]ตัดสินใจวาการยกดินแดนเหลานี้จะสรางบรรทัดฐานที่อันตรายและบั่นทอนสถานะของพวกเขาในภูมิภาค เราไดรับคําสั่งใหปฏิเสธขอเรียกรองของ[AFG.GetNonIdeologyName]และเตรียมปองกันพรมแดนหากจําเปน"
 AFG_political_events.74.a: "เราจะทําในสิ่งที่ตองทํา"

 AFG_political_events.75.t: "ปฏิเสธการเจรจาพรมแดนใหม"
 AFG_political_events.75.desc: "แมเราจะอางสิทธิ์และชาวปาทานจะปรารถนาเอกภาพอยางชัดแจง แต[FROM.GetNameDef]กลับปฏิเสธการเจรจาพรมแดนใหมอยางสิ้นเชิง คําตอบของพวกเขาแนวแน ปดตกทุกแนวคิดเรื่องการยกดินแดน และเตือนไมใหยกระดับสถานการณตอ ดูเหมือนหนทางเดียวที่จะปลดปลอยดินแดนเหลานั้นคือความขัดแยง"
 AFG_political_events.75.a: "ถาเชนนั้นเราตองเตรียมทําสงคราม"

 AFG_political_events.80.t: "[FROM.GetNameDefCap]เรียกรองใหดําเนินนโยบายตางประเทศตามแนวทางของตน"
 AFG_political_events.80.desc: "ในความเคลื่อนไหวอันอาจหาญเพื่อแสดงความเปนใหญในโลกอิสลาม [FROM.GetNameDef]ไดยื่นคําขาด โดยเรียกรองใหเราเขารวมพันธมิตรที่กําลังขยายตัวของพวกเขา ซึ่งมุงรวมและเสริมความแข็งแกรงใหชาติอิสลามภายใตการนําของ[FROM.GetAdjective] ดูเหมือนวาหากไมทําตามขอเรียกรองนี้ จะตองเผชิญการบุกเต็มรูปแบบ"
 AFG_political_events.80.a: "นี่เปนประโยชนสูงสุดตอเรา"
 AFG_political_events.80.b: "พวกเขาไมมีสิทธิ์มากําหนดนโยบายใหเรา"

 AFG_political_events.81.t: "[FROM.GetNameDefCap]ตกลงเขารวม"
 AFG_political_events.81.desc: "เพื่อตอบคําขาดของเรา [FROM.GetNameDef]ตัดสินใจยอมตามขอเรียกรอง พวกเขาตกลงเขารวมพันธมิตรของเรา โดยยอมรับความแข็งแกรงและการนําของ[ROOT.GetNameDef]ในการรวมโลกอิสลาม ความเคลื่อนไหวทางยุทธศาสตรครั้งนี้ไมเพียงขยายอิทธิพลของเรา แตยังตอกยํ้าสถานะของเราในฐานะมหาอํานาจที่ครอบงําภูมิภาค เมื่อพวกเขามาอยูฝงเรา วิสัยทัศนแนวรวมอิสลามที่เปนหนึ่งเดียวของเราก็ใกลเปนจริงขึ้นทุกที"
 AFG_political_events.81.a: "ก็พวกเขาไมมีทางเลือกอยูแลวนี่"

 AFG_political_events.82.t: "[FROM.GetNameDefCap]ปฏิเสธการเขารวม"
 AFG_political_events.82.desc: "[FROM.GetNameDef]ทาทายคําขาดของเราดวยการปฏิเสธขอเรียกรองใหเขารวมพันธมิตร รัฐบาลอิรักยังคงยืนหยัดในเอกราชของตน และไมยอมอยูใตอํานาจของเรา"
 AFG_political_events.82.a: "ถาเชนนั้นพวกเขาจะถูกทําลาย"

 AFG_political_events.85.t: "[FROM.GetNameDefCap]ขอความคุมครอง"
 AFG_political_events.85.desc: "รัฐบาล[FROM.GetAdjective]ติดตอเราอยางลับ ๆ พรอมขอเสนอสนธิสัญญาปองกันรวม พวกเขาตองการขอตกลงที่จะปกปองซึ่งกันและกันในกรณีเกิดสงคราม โดยเล็งเห็นประโยชนทางยุทธศาสตรของการเปนหุนสวนกับเรามากกวากับศัตรูของเรา ความทะเยอทะยานของอัฟกานิสถานที่จะเปนมหาอํานาจในโลกอิสลามอาจสอดคลองกับผลประโยชนทางภูมิรัฐศาสตรในวงกวางของเรา"
 AFG_political_events.85.a: "เรื่องนี้อาจเปนประโยชนตอเรา"
 AFG_political_events.85.b: "เราจะไมเขาไปพัวพันกับการเมืองของ[FROM.GetAdjective]"

 AFG_political_events.86.t: "[FROM.GetNameDefCap]ตกลงทําสนธิสัญญา"
 AFG_political_events.86.desc: "[FROM.GetNameDefCap]ตกลงตามขอเสนอสนธิสัญญาปองกันรวมของเรา สนธิสัญญานี้รับประกันวาทั้งสองชาติจะสนับสนุนกันในกรณีเกิดสงคราม ซึ่งเสริมสถานะทางยุทธศาสตรของเรา เมื่อมีแสนยานุภาพทางทหารของ[FROM.GetNameDef]หนุนหลัง ความทะเยอทะยานที่จะเปนมหาอํานาจในโลกอิสลามของเราก็ใกลความจริงยิ่งขึ้น "
 AFG_political_events.86.a: "ถาเชนนั้นเราจะเริ่มขยายอํานาจไปทั่วภูมิภาค"

 AFG_political_events.87.t: "[FROM.GetNameDefCap]ปฏิเสธสนธิสัญญา"
 AFG_political_events.87.desc: "[FROM.GetNameDef]ตอบปฏิเสธขอเสนอสนธิสัญญาปองกันรวมของเราดวยถอยคําที่เลือกสรรอยางระมัดระวัง แมจะเล็งเห็นประโยชนทางยุทธศาสตรที่อาจไดรับ แตพวกเขาเลือกใหความสําคัญกับหุนสวนรายอื่น และยังคงระมัดระวังที่จะผูกมัดตนเองกับขอตกลงเชนนี้กับเราในเวลานี้"
 AFG_political_events.87.a: "อาจตองใชเวลา แตเราจะบรรลุเปาหมายไดดวยตัวเราเอง"

 AFG_political_events.90.t: "[AFG.GetNameDefCap]สนับสนุนกลุมปฏิกิริยาในเอเชียกลาง"
 AFG_political_events.90.desc: "มีรายงานวา[AFG.GetNameDef]ภายใตการปกครองของ[AFG.GetLeader]กําลังสงเสริมความเคลื่อนไหวของกลุมปฏิกิริยาในสาธารณรัฐเอเชียกลางของเราอยางแข็งขัน เชื่อกันวาสายลับ[AFG.GetAdjective]กําลังปลุกปนความไมสงบและกระตุนความรูสึกตอตาน[ROOT.GetAdjective]ในหมูประชากรทองถิ่น พฤติกรรมบอนทําลายนี้เปนการทาทายอํานาจของเราในภูมิภาคโดยตรง และคุกคามเสถียรภาพของดินแดนเอเชียกลางของเรา เราตองตอบโตการแทรกแซงจากตางชาตินี้และรักษาการควบคุมเหนือสาธารณรัฐของเราไว"
 AFG_political_events.90.a: "เราตองสงกองกําลังรักษาความมั่นคงเพิ่มเติมไปปราบปรามความไมสงบ"
 AFG_political_events_90_tt: "ปลดล็อกการตัดสินใจ §Y[AFG_get_turkik_people_name_key]§! เพื่อกําจัดหนวยตอตานในรัฐเอเชียกลาง §Rหากเรากําจัดหนวยตอตานไมสําเร็จและอยูในภาวะสงครามกับ[FROM.GetNameDef] รัฐเหลานั้นจะลุกฮือตอตานเรา!§!"

 AFG_political_events.91.t: "สาธารณรัฐเอเชียกลางลุกฮือ"
 AFG_political_events.91.desc: "เมื่อสงครามกับ[AFG.GetNameDef]ปะทุขึ้น สถานการณในสาธารณรัฐเอเชียกลางของเราก็มาถึงจุดวิกฤต ดวยแรงบันดาลใจจากการแทรกแซงของ[AFG.GetAdjective]และไดใจจากความขัดแยงในปจจุบัน สาธารณรัฐหลายแหงไดลุกฮือขึ้นประกาศเอกราชจาก[ROOT.GetNameDef] การกบฏที่ลุกลามเปนวงกวางนี้คุกคามจะทําใหทั้งภูมิภาคไรเสถียรภาพ และทําใหทรัพยากรทางทหารของเราตึงตัวยิ่งขึ้น เราตองเรงปราบปรามการลุกฮือและฟนฟูความสงบเรียบรอย มิฉะนั้นอาจเสียการควบคุมเหนือเอเชียกลาง"
 AFG_political_events.91.a: "เราตองปราบปรามการลุกฮือและฟนฟูอํานาจของเรา"

 AFG_political_events.95.t: "ทหาร[GER.GetAdjective]เคลื่อนไหวใน[FROM.GetNonIdeologyName] "
 AFG_political_events.95.desc: "สงครามกลางเมืองที่เพิ่งกลืนกินชาติที่บอบชํ้าอยาง[AFG.GetNonIdeologyName] ไดสรางความตื่นตระหนกใน[ROOT.Capital.GetCapitalVictoryPointName] แตสถานการณกลับเรงดวนยิ่งขึ้นเมื่อมีรายงานจากภูมิภาควาทหาร[GER.GetAdjective]กําลังชวยกองกําลังของ[AFG.GetLeader]โคนลมรัฐบาลอันชอบธรรม เราไดแตสันนิษฐานวานี่บงชี้วา[AFG.GetLeader]ไดผูกสัมพันธกับ[GER.GetNameDef] ซึ่งจะเปนภัยคุกคามสําคัญตอผลประโยชนของเราในพื้นที่ ดวยเหตุนี้ สมาชิกกองทัพจึงรางแผนเสนอใหเราอนุมัติ เพื่อใหเราชวยเหลือรัฐบาลอันชอบธรรมอยางลับ ๆ และปองกันไมใหฟาสซิสตยึดครองชาตินี้"
 AFG_political_events.95.a: "นี่เปนสิ่งจําเปนตอความมั่นคงในภูมิภาค อนุมัติ"
 AFG_political_events.95.b: "[AFG.GetNonIdeologyName]ไมใชเรื่องของเรา"

 AFG_political_events.100.t: "รัฐกันชนโคราซาน"
 AFG_political_events.100.desc: "รัฐบาลของ[FROM.GetNameDef]เล็งเห็นความจําเปนทางยุทธศาสตรในการจัดตั้งรัฐกันชนใน[PER.GetNonIdeologyName]ตะวันออก ดวยเหตุนี้ พวกเขาจึงรองขออยางเปนทางการใหโอนการควบคุมดินแดนหลายแหงในอิหรานตะวันออก เพื่อเอื้อตอการกอตั้งรัฐโคราซาน โดยอางวารัฐกันชนใหมนี้จะเปนพลังสรางเสถียรภาพในภูมิภาค "
 AFG_political_events.100.a: "หากนําไปสูสันติภาพระยะยาว เราจะไปโตแยงทําไม?"
 AFG_political_events.100.b: "เราจะไมทําเชนนั้นเด็ดขาด"

 AFG_political_events.101.t: "[FROM.GetNameDefCap]ตกลงจัดตั้งรัฐกันชน"
 AFG_political_events.101.desc: "รัฐบาลของ[FROM.GetNameDef]ตกลงโอนการควบคุมดินแดนที่กําหนดไวใน[PER.GetNonIdeologyName]ตะวันออก การโอนนี้จะทําใหเราจัดตั้งรัฐกันชนโคราซานไดตามแผน "
 AFG_political_events.101.a: "ปกดานตะวันตกของเราปลอดภัยเสียที"

 AFG_political_events.102.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอจัดตั้งรัฐกันชน"
 AFG_political_events.102.desc: "รัฐบาลของ[FROM.GetNameDef]แสดงความเสียใจที่ตองปฏิเสธขอเสนอของเราในการโอนการควบคุมดินแดนที่รองขอใน[PER.GetNonIdeologyName]ตะวันออก พวกเขาแสดงความกังวลตอผลที่จะตามมาจากการโอนดังกลาวและผลกระทบที่อาจมีตอเสถียรภาพในภูมิภาค"
 AFG_political_events.102.a: "เราจะเดินหนาตามวาระของเราดวยวิธีอื่น"

 AFG_political_events.110.t: "[FROM.GetNameDefCap]ขอดินแดน"
 AFG_political_events_110_desc_balochistan: "รัฐบาลของ[FROM.GetNameDef]รองขอดินแดนบาลูจิสถาน โดยอางวาดินแดนเหลานี้ควรเปนของพวกเขาโดยชอบธรรม และพรมแดนปจจุบันแบงแยกประชาชนและดินแดนของพวกเขาอยางไมเปนธรรม"
 AFG_political_events_110_desc_durand: "รัฐบาลของ[FROM.GetNameDef]รองขอดินแดนหลายแหงของเราตามแนวพรมแดนของพวกเขา โดยอางวาดินแดนเหลานี้ควรเปนของพวกเขาโดยชอบธรรม และพรมแดนปจจุบันแบงแยกประชาชนและดินแดนของพวกเขาอยางไมเปนธรรม"
 AFG_political_events.110.a: "ถามันทําใหพวกเขาเลิกกวนใจเราได"
 AFG_political_events.110.b: "เราจะไมยอมเสียใหแมแตนิ้วเดียว"

 AFG_political_events.111.t: "[FROM.GetNameDefCap]ตกลงยกดินแดนให"
 AFG_political_events.111.desc: "[FROM.GetNameDefCap]ตกลงโอนรัฐที่เรารองขอใหแกเรา หลังจากพิพาทกันมาหลายทศวรรษ ในที่สุดเราก็ไดตอนรับพี่นองที่พลัดพรากไปนานกลับคืนสูออมอก"
 AFG_political_events.111.a: "ยอดเยี่ยม!"

 AFG_political_events.112.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะยกดินแดนให"
 AFG_political_events.112.desc: "[FROM.GetNameDefCap]ปฏิเสธที่จะโอนรัฐที่เรารองขอ ดูเหมือนวาในอนาคตเราจะตองหาวิธีอื่นเพื่อทวงคืนดินแดนอันชอบธรรมของเรา"
 AFG_political_events.112.a: "ก็คุมที่จะลองดู"
 AFG_political_events.112.b: "ถาเชนนั้นเราจะยึดมันดวยกําลัง"

 AFG_political_events.120.t: "[FROM.GetNameDefCap]ขอการสนับสนุน"
 AFG_political_events.120.desc: "ผูแทนของขบวนการคอมมิวนิสตใน[AFG.GetNonIdeologyName]เขามาขอการสนับสนุนการปฏิวัติที่กําลังกอตัวของพวกเขา แมจะยังเปนที่ถกเถียงวาชาติที่บอบชํ้าแหงนี้จะรองรับเศรษฐกิจแบบสังคมนิยมไดหรือไม แตเราก็มองขามความสําคัญของการผลักดันพรมแดนของสังคมนิยมใหลึกเขาไปในเอเชียกลางและไกลกวานั้นไมได"
 AFG_political_events.120.a: "เรื่องนี้สอดคลองกับเปาหมายทางยุทธศาสตรของเราในภูมิภาค"
 AFG_political_events.120.b: "เลือด[SOU.GetAdjective]จะไมมีวันหลั่งใน[FROM.GetNonIdeologyName]!"

 AFG_political_events.121.t: "[FROM.GetNameDefCap]ตกลงมาชวยเหลือเรา"
 AFG_political_events.121.desc: "เพื่อแสดงถึงความมุงมั่นตออุดมการณแหงความสมานฉันทระหวางประเทศ [FROM.GetNameDefCap]ตกลงชวยเหลือเราในการตอสู พวกเขาแจงวาอาสาสมัครจากกองทัพของพวกเขาพรอมยุทโธปกรณครบครันจะเดินทางมาหาเราในอนาคตอันใกล"
 AFG_political_events.121.a: "ขอบคุณสหาย!"

 AFG_political_events.122.t: "[FROM.GetNameDefCap]ระงับการสนับสนุน"
 AFG_political_events.122.desc: "[FROM.GetNameDefCap]ปฏิเสธคํารองขอความชวยเหลือของเรา โดยอางวาการปฏิวัติของเรายังไมถึงเวลาและถูกลิขิตใหลมเหลว ประชาชนของเราคงจะผูกใจเจ็บตอ[FROM.GetNameDef]ไปอีกนาน"
 AFG_political_events.122.a: "การทรยศตออุดมการณสังคมนิยม"

 AFG_political_events.130.t: "[FROM.GetNameDefCap]ขอดินแดน"
 AFG_political_events.130.desc: "รัฐบาลของ[FROM.GetNonIdeologyName]ปรึกษาเราเกี่ยวกับขอเสนอเสริมความแข็งแกรงใหชาติของพวกเขาดวยการรวมเปนสมาพันธรัฐกับดินแดนบางสวนของเราตามแนวพรมแดน[ROOT.GetAdjective] การนี้จะทําใหเราตองปรับเปลี่ยนพรมแดน แตอาจชวยสรางพันธมิตรที่เขมแข็งในภูมิภาค"
 AFG_political_events.130.a: "เราสนับสนุนความริเริ่มนี้"
 AFG_political_events.130.b: "พวกเขาชางโงเขลาที่มาปรึกษาเราเรื่องนี้"

 AFG_political_events.131.t: "[FROM.GetName]ตกลงตั้งสมาพันธรัฐ"
 AFG_political_events.131.desc: "รัฐบาล[FROM.GetAdjective]ตกลงตามขอเสนอตั้งสมาพันธรัฐของเรา บัดนี้เราสามารถเริ่มกระบวนการผนวกรวมดินแดนใหมเขาสูระบบการเมืองและเศรษฐกิจของเรา หวังวาสิ่งนี้จะชวยยับยั้งศัตรูในภูมิภาคของเราไดในอนาคตอันใกล"
 AFG_political_events.131.a: "ยอดเยี่ยม!"

 AFG_political_events.132.t: "[FROM.GetName]ปฏิเสธการตั้งสมาพันธรัฐ"
 AFG_political_events.132.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอตั้งสมาพันธรัฐของเรา นี่เปนความลมเหลวดานนโยบายตางประเทศครั้งใหญของเรา และทําใหเกิดความกังวลวาความสัมพันธระยะยาวกับ[FROM.GetNameDef]จะเปนอยางไรตอจากนี้"
 AFG_political_events.132.a: "โอกาสที่หลุดลอยไป"

 AFG_political_events.140.t: "ผลการเลือกตั้ง"
 AFG_political_events.140.desc: "การเลือกตั้งครั้งนี้คอนขางวุนวาย เนื่องจากชาติของเราไมเคยมีประสบการณกับเหตุการณเชนนี้มากอน อยางไรก็ตาม มีผูสมัครไมกี่คนที่หาเสียงดวยนโยบายกวาง ๆ ขึ้นมาเปนตัวเต็ง และเมื่อหนวยเลือกตั้งปดลง ดูเหมือนผูมีสิทธิ์เลือกตั้งจะถูกโนมนาวโดย:"
 AFG_political_events.140.a: "เสนหอันหนุมแนนของโมฮัมหมัด ดาวูด ขาน"
 AFG_political_events.140.b: "ซารดาร ชาห มาหมุด ขาน ผูมั่นคงเสมอตนเสมอปลาย"
 AFG_political_events.140.c: "มูฮัมหมัด อิบราฮิม ขาน ผูยึดมั่นในจารีตอยางแนวแน"

 AFG_political_events.150.t: "[FROM.GetNameDefCap]ขอทําสนธิสัญญาปองกัน"
 AFG_political_events.150.desc: "รัฐบาลของ[FROM.GetNonIdeologyName]เขามาเสนอใหเสริมความแข็งแกรงแกทั้งสองชาติดวยการผนวกรวมเศรษฐกิจการทหารของเราเขาดวยกันในระดับเล็กนอย ซึ่งหมายความวาทั้งสองฝายจะตองชวยเหลือกันในกรณีเกิดสงคราม แตนั่นอาจเปนราคาที่ยอมรับไดสําหรับความรวมมือที่ใกลชิดขึ้น?"
 AFG_political_events.150.a: "มีแตจะทําใหเราแข็งแกรงขึ้น"
 AFG_political_events.150.b: "พวกเขาชางโงเขลาที่มาเสนอเรื่องนี้กับเรา"

 AFG_political_events.151.t: "[FROM.GetName]ตกลงขยายสนธิสัญญา"
 AFG_political_events.151.desc: "รัฐบาล[FROM.GetAdjective]ตกลงตามขอเสนอดานการปองกันของเรา บัดนี้เราสามารถเริ่มกระบวนการผนวกรวมกลุมอุตสาหกรรมทางทหารของทั้งสองฝายเขาดวยกัน หวังวาสิ่งนี้จะชวยยับยั้งศัตรูในภูมิภาคของเราไดในอนาคตอันใกล"
 AFG_political_events.151.a: "ยอดเยี่ยม!"

 AFG_political_events.152.t: "[FROM.GetName]ปฏิเสธสนธิสัญญา"
 AFG_political_events.152.desc: "รัฐบาล[FROM.GetAdjective]ปฏิเสธขอเสนอของเราในการประสานอุตสาหกรรมปองกันประเทศ และดวยเหตุนี้ ความฝนที่จะเปนมิตรกับ[FROM.GetLeader]ก็มาถึงจุดจบอยางรุนแรง"
 AFG_political_events.152.a: "โอกาสที่หลุดลอยไป"

 AFG_political_events.153.t: "$AFG_faqir_of_ipi$ แหง[AFG.GetNonIdeologyName]ขอความชวยเหลือ"
 AFG_political_events.153.desc: "$AFG_faqir_of_ipi$ ผูนําชนเผาสายจารีตนิยมใน[FROM.GetNonIdeologyName] ไดสงสารลับติดตอมายังรัฐบาลของเราเพื่อขอการสนับสนุนใหเขาไดขึ้นครองบัลลังก เขาสัญญาวาหากไดรับการหนุนหลังจากเรา เขาจะสรางชาติที่เขมแข็งซึ่งสอดคลองกับผลประโยชนของเรา"
 AFG_political_events.153.a: "เราตองการพันธมิตรเพิ่มในภูมิภาคนั้น"
 AFG_political_events.153.b: "จะไปยุงกับดินแดนที่หางไกลขนาดนั้นทําไม?"
 AFG_political_events_153_tt: "§Y[JAP.GetNonIdeologyName]จะจัดสงอาวุธและสงอาสาสมัครมาชวยเราเมื่อสงครามกลางเมืองเริ่มขึ้น§!"

 AFG_political_events.154.t: "[FROM.GetNameDefCap]ปฏิเสธแผนการ"
 AFG_political_events.154.desc: "รัฐบาล[FROM.GetAdjective]ตอบกลับคําขอของเราวาเสียใจที่ไมอาจใหการสนับสนุนการขึ้นครองบัลลังกของ $AFG_faqir_of_ipi$ ได โดยอางถึงความกังวลเรื่องการถูกดึงเขาไปพัวพันและสภาพภูมิรัฐศาสตรในปจจุบัน [FROM.GetAdjective]จึงตัดสินใจมุงไปที่ลําดับความสําคัญทางยุทธศาสตรอื่น"
 AFG_political_events.154.a: "กลาดีอยางไรถึงทรยศเรา!"

 AFG_political_events.155.t: "[FROM.GetNameDefCap]ตกลงสนับสนุนเรา"
 AFG_political_events.155.desc: "รัฐบาลของ[FROM.GetName]ตอบรับคําขอของเรา และตกลงสนับสนุนการขึ้นครองบัลลังกแหง[ROOT.GetNonIdeologyName]ของ $AFG_faqir_of_ipi$ การหนุนหลังนี้จะรวมถึงการสนับสนุนทางทหารและยุทโธปกรณ เพื่อใหภารกิจของเราประสบความสําเร็จ"
 AFG_political_events.155.a: "อนาคตของ[AFG.GetNonIdeologyName]เปนของเรา!"

 AFG_political_events.156.t: "ความชวยเหลือจาก[JAP.GetAdjective]มาถึงแลว"
 AFG_political_events.156.desc: "ตามที่ตกลงกันไว ยุทโธปกรณของ[FROM.GetAdjective]ถูกสงมาใหเราใชนับตั้งแตสงครามกลางเมืองปะทุขึ้น สายลับของพวกเขาใน[ROOT.Capital.GetCapitalVictoryPointName]ยังยืนยันกับเราวาทหาร[FROM.GetAdjective]ที่ปฏิบัติการลับจะเดินทางมาถึงประเทศเร็ว ๆ นี้เพื่อชวยเราในการตอสู"
 AFG_political_events.156.a: "ยอดเยี่ยม!"

 AFG_political_events.157.t: "ความชวยเหลือจาก[GER.GetAdjective]มาถึงแลว"
 AFG_political_events.157.desc: "ตามที่ตกลงกันไว ยุทโธปกรณของ[FROM.GetAdjective]ถูกสงมาใหเราใชนับตั้งแตสงครามกลางเมืองปะทุขึ้น สายลับของพวกเขาใน[ROOT.Capital.GetCapitalVictoryPointName]ยังยืนยันกับเราวาทหาร[FROM.GetAdjective]ที่ปฏิบัติการลับจะเดินทางมาถึงประเทศเร็ว ๆ นี้เพื่อชวยเราในการตอสู"
 AFG_political_events.157.a: "ยอดเยี่ยม!"

