 GOE_RAJ_generals.7.t: "[RAJ.GetNameDefCap]ขอซื้อเสบียง"
 GOE_RAJ_generals.7.desc: "[RAJ.GetLeader]สงคําขอซื้อยุทโธปกรณดานเสบียงจากอุตสาหกรรมพลเรือนของ[ENG.GetAdjective] เราไดรับขอเสนอคานายหนากอนโตสําหรับการเปนผูจัดการการซื้อขายเหลานี้"
 GOE_RAJ_generals.7.a: "ขอตกลงที่เปนประโยชนทั้งสองฝาย!"
 GOE_RAJ_generals.7.b: "เราไมสนใจ"

 GOE_RAJ_generals.8.t: "[ENG.GetNameDefCap]ตอบรับ!"
 GOE_RAJ_generals.8.desc: "[ENG.GetLeader]ตอบขอเสนอของเราและตกลงใหเราซื้อยุทโธปกรณดานเสบียงจากพวกเขา"
 GOE_RAJ_generals.8.a: "ยอดเยี่ยม!"

 GOE_RAJ_generals.9.t: "[ENG.GetNameDefCap]ปฏิเสธขอเสนอของเรา"
