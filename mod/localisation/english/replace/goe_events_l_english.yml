 IRQ_political_events.60.t: "[FROM.GetNameDefCap]เสนอสันติภาพ"
 IRQ_political_events.60.desc: "เมื่อเผชิญแรงกดดันที่ทวีขึ้นจากฝายสัมพันธมิตร พวกผูแยงชิงอํานาจใน[FROM.GetNonIdeologyName]ไดเสนอขอตกลงสันติภาพ พวกเขาเสนอจะคืนตําแหนงใหผูสําเร็จราชการและฟนฟูอํานาจของเรา แลกกับการยุติการสูรบและการคงบูรณภาพแหงดินแดนของพวกเขาไว แมขอเสนอนี้จะยอมรับวาการตอตานตอไปนั้นไรประโยชน แตก็ถือเปนการกลับลําครั้งใหญของความทะเยอทะยานของกลุมจัตุรัสทองคํา และอาจนําไปสูความไมสงบในหมูผูสนับสนุนของพวกเขา"
 IRQ_political_events.60.a: "ก็ได"
 IRQ_political_events.60.b: "พวกเขาไวใจไมได"

 IRQ_political_events.61.t: "[FROM.GetNameDefCap]ยอมรับขอตกลงสันติภาพ"
 IRQ_political_events.61.desc: "[FROM.GetNameDefCap]ไดตกลงตามขอเสนอสันติภาพของเรา เงื่อนไขกําหนดใหเราตองยอมอยูใตอํานาจของ[FROM.GetAdjective] ซึ่งทําใหความขัดแยงสิ้นสุดลง แมสงครามจะจบแลว แตการตัดสินใจนี้อาจจุดชนวนความไมสงบภายใน เมื่อผูที่ตอสูเพื่ออธิปไตยและเอกราชตองเผชิญกับการกลับมาของการควบคุมชาติโดยตางชาติ"
 IRQ_political_events.61.a: "อยางนอยเราก็ยุติการนองเลือดได"

 IRQ_political_events.62.t: "[FROM.GetNameDefCap]ปฏิเสธขอตกลงสันติภาพ"
 IRQ_political_events.62.desc: "[FROM.GetNameDefCap]ไดปฏิเสธขอเสนอสันติภาพของเรา โดยยืนกรานใหยอมจํานนโดยสมบูรณอยางไมมีการประนีประนอม เมื่อการเจรจาลมเหลว ความขัดแยงจะดําเนินตอไป และเราตองเผชิญกับแสนยานุภาพเต็มกําลังของกองกําลังฝายสัมพันธมิตร หนทางขางหนาจะเต็มไปดวยอุปสรรค แตความมุงมั่นเพื่อเอกราชของเรายังคงไมสั่นคลอน"
 IRQ_political_events.62.a: "ถาเชนนั้นเราจะสูจนถึงที่สุด"

 IRQ_political_events.70.t: "$IRQ_bakr_sidqi$ รอดจากการลอบสังหาร"
 IRQ_political_events.70.desc: "ที่เมืองโมซุลเมื่อชวงตนของวันนี้ $IRQ_bakr_sidqi$ ตกเปนเปาการลอบสังหารโดยสิบโทอับดุลลอฮ อัลตะลาฟารี เมื่อชายหนุมผูนี้ชักปนขึ้นเล็งซิดกีและมือขวาของเขา มุฮัมมัด อะลี ญะวาด ในการลอบสังหารครั้งนี้ ญะวาดไดรับบาดเจ็บสาหัส แตซิดกีรอดมาไดโดยไมมีแมแตรอยขีดขวน"
 IRQ_political_events.70.a: "คนเราจะโชคดีไดขนาดไหนกัน?"

 IRQ_political_events.71.t: "สรางความชอบธรรมแกการปกครองของเรา"
 IRQ_political_events.71.desc: "หลายคนในชาติของเรายังไมยอมรับกลุมจัตุรัสทองคําในฐานะผูปกครองที่ชอบธรรม และมองเราเปนผูแยงชิงอํานาจและพวกวายรายที่ไรความชอบธรรม เพื่อแกปญหานี้ คณะรัฐมนตรีของเราไดเสนอทางออกไวสองสามทาง ทางแรกคือเพิกเฉยตอเสียงเรียกรองของประชาชนและหวังวามันจะจางหายไปตามกาลเวลา หรือแตงตั้งเอมีรแหงฏออิฟเปนผูสําเร็จราชการคนใหมแทนพระเจาไฟศ็อลที่ 2 อยางไรก็ตาม ยังมีทางเลือกในการปฏิรูปเปนสาธารณรัฐเสมอ แมวาอาจไมเปนที่นิยมอยางกวางขวางในหมูประชาชนผูเครงศาสนาของเรา..."
 IRQ_political_events.71.a: "เรามีความชอบธรรมเพียงพออยูแลว"
 IRQ_political_events.71.b: "$IRQ_sharaf_bin_rajeh$ ก็เหมาะสมดี"
 IRQ_political_events.71.c: "เราตองการประธานาธิบดี ไมใชกษัตริย!"

 IRQ_political_events.72.t: "การสวรรคตของพระเจาฆอซีที่ 1"
 IRQ_political_events.72.desc: "มีรายงานวาเมื่อชวงตนของวันนี้ พระเจาฆอซีที่ 1 กษัตริยผูยิ่งใหญของเรา ไดสวรรคตอยางนาเศราในอุบัติเหตุทางรถยนตขณะทรงขับรถสปอรตในกรุงแบกแดด บางคนอางวาเปนเพียงอุบัติเหตุ ขณะที่บางคนคาดเดาวาอาจเปนคําสั่งของนูรี อัสซะอีด เนื่องจากพระราชดําริที่จะรวมชาติกับคูเวต แตไมมีใครรูแนชัด อยางไรก็ตาม มีสิ่งหนึ่งที่ชัดเจน คือเมื่อพระองคจากไปแลว ตองมีผูรับชวงคบเพลิงและสืบทอดตําแหนงแทน"
 IRQ_political_events.72.a: "อับดุลอิลาฮจะรับตําแหนงผูสําเร็จราชการ"
 IRQ_political_events.72.b: "ไฟศ็อลที่ 2 ควรสืบราชสมบัติโดยตรง!"

 IRQ_political_events.73.t: "กระแสสนับสนุนการปกครองแบบสมบูรณาญาสิทธิ์ของราชวงศฮัชไมตพุงสูง"
 IRQ_political_events.73.desc: "จากขบวนแหพระศพของพระเจาฆอซีที่ 1 เมื่อไมนานมานี้ กระแสนิยมเจาไดพุงสูงขึ้นขณะที่ประชาชนไวอาลัย สิ่งนี้เปดโอกาสใหอับดุลอิลาฮไดควบคุมอํานาจของเหลานายกรัฐมนตรีที่บอนทําลายการปกครองแบบสมบูรณาญาสิทธิ์ของเรามาเปนเวลานาน นับเปนกาวแรกที่ดีสูการฟนฟูการปกครองของราชวงศฮัชไมตเหนืออาระเบียอยางสมบูรณ"
 IRQ_political_events.73.a: "อับดุลอิลาฮจะทวงคืนสิทธิโดยกําเนิดของราชวงศฮัชไมต"
 IRQ_political_events.73.b: "เปนเรื่องจําเปนยิ่งที่เราตองคงความเปนราชาธิปไตยภายใตรัฐธรรมนูญไว!"

 IRQ_political_events.74.t: "[FROM.GetName]เชิญคณะผูแทนดานนํ้ามัน"
 IRQ_political_events.74.desc: "มิตรใหมชาว[FROM.GetAdjective]ของเราเสนอใหสงคณะเจาพอนํ้ามันและผูบริหารอุตสาหกรรมไปชักชวนการลงทุนในแหลงทรัพยากรอันกวางใหญของพวกเขา สนธิสัญญานี้จะไดรับการรับรองดวยการแลกเปลี่ยนอาวุธกับนํ้ามันในเบื้องตนซึ่งเปนประโยชนตอทั้งสองฝาย"
 IRQ_political_events.74.a: "จังหวะเหมาะพอดี"
 IRQ_political_events.74.b: "เราไมมีกําลังพอสําหรับเรื่องนี้"
 IRQ_political_events.75.t: "ยอมรับคณะผูแทน"
 IRQ_political_events.75.desc: "มิตรชาว[FROM.GetAdjective]ของเราไดตกลงสงคณะผูแทนมาเพื่อการลงทุนในอนาคต โดยมีเงื่อนไขวาเราตองลงนามขอตกลงแลกเปลี่ยนเบื้องตนโดยทันที ผลลัพธออกมาดีทีเดียว"
 IRQ_political_events.75.a: "วิเศษ"
 IRQ_political_events.76.t: "ปฏิเสธคณะผูแทน"
 IRQ_political_events.76.desc: "นาเสียดาย รัฐบาล[FROM.GetAdjective]ไดปฏิเสธคําขอของเราที่จะแลกนํ้ามันอันลํ้าคากับอาวุธ ความสูญเสียของพวกเขาคือผลประโยชนของเรา"
 IRQ_political_events.76.a: "นาเสียดาย"

 IRQ_political_events.77.t: "[IRQ.GetNameDefCap]พิชิต[680.GetName]"
 IRQ_political_events.77.desc: "หลังการทัพอันรวดเร็วใน[680.GetName] กองทัพ[IRQ.GetAdjective]ไดยึดชุมชนสําคัญทั้งหมดและประกาศวาพื้นที่นี้อยูภายใตการควบคุมของพวกเขา"
 IRQ_political_events.77.a: "เราแข็งแกรงขึ้น!"
 IRQ_political_events.77.b: "ชางเถอะ"

 IRQ_political_events.78.t: "[IRQ.GetNameDefCap]ถอนตัวจาก[680.GetName]"
 IRQ_political_events.78.desc: "เมื่อเผชิญความยากลําบากอยางหนัก กองทัพ[IRQ.GetAdjective]ไดถอยทัพออกจากเมืองเดียรเอซซอร นี่อาจยังไมใชจุดจบของความขัดแยง แตในตอนนี้พื้นที่ดังกลาวจะยังคงเปนของ[SYR.GetAdjective]"
 IRQ_political_events.78.a: "ความพายแพชั่วคราว..."
 IRQ_political_events.78.b: "เดียรเอซซอรยังยืนหยัด!"



# Kurdistan

 IRQ_kurdistan_events.1.t: "ฝายชาตินิยมชาวเคิรดขอความชวยเหลือจากเรา"
 IRQ_kurdistan_events.1.desc: "เราเพิ่งไดรับการติดตอจากฝายชาตินิยมชาวเคิรดใน[IRQ.GetNameDefCap] ขอความชวยเหลือสําหรับการปฏิวัติของพวกเขา"
 IRQ_kurdistan_events.1.a: "แนนอน เราจะชวย!"
 IRQ_kurdistan_events.1.b: "เราไมสนใจการปฏิวัติเล็ก ๆ ใน[IRQ.GetNameDefCap]"

 IRQ_kurdistan_events.2.t: "[FROM.GetNameDefCap]ตกลงชวยเหลือเรา"
 IRQ_kurdistan_events.2.desc: "ผูติดตอของเราใน[FROM.GetNameDefCap]ไดตอบรับคําขอความชวยเหลือของเรา และตกลงที่จะสนับสนุนอุดมการณของเรา"
 IRQ_kurdistan_events.2.a: "ขาวดีจริง ๆ!"

 IRQ_kurdistan_events.3.t: "[FROM.GetNameDefCap]ปฏิเสธที่จะชวยเหลือเรา"
 IRQ_kurdistan_events.3.desc: "ผูติดตอของเราใน[FROM.GetNameDefCap]ไดตอบคําขอความชวยเหลือของเรา และนาเสียดายที่พวกเขาปฏิเสธ เราตองสูดวยตัวเอง"
 IRQ_kurdistan_events.3.a: "เราจะไมยอมใหเรื่องนี้บั่นทอนกําลังใจ!"

 IRQ_kurdistan_events.4.t: "สหภาพแรงงานกอตัวขึ้น"
 IRQ_kurdistan_events.4.desc: "จากการผลักดันอุตสาหกรรมของเราเมื่อไมนานมานี้ สหภาพแรงงานหลายกลุมไดถือกําเนิดขึ้น คนงานโรงงานรวมตัวกันเรียกรองสิ่งที่พวกเขาเห็นวาเปนสภาพการทํางานที่เปนธรรม เราอาจไดประโยชนจากการเอาใจพวกเขา แตใครจะรูวาเรื่องนี้จะสงผลตอเราทางการเมืองอยางไร"
 IRQ_kurdistan_events.4.a: "คนงานพูดถูก"
 IRQ_kurdistan_events.4.b: "เราไมอาจยอมใหมีแนวปฏิบัติแบบสังคมนิยมเชนนี้!"

###

### News Events ###
 GOE_IRQ_news.1.t: "การปฏิวัติครั้งใหญของชาวปาเลสไตน"
 GOE_IRQ_news.1.d: "หลังจากความไมพอใจตอการบริหารของ[ENG.GetAdjective]และการอพยพเขามาในภูมิภาคนับตั้งแตมหาสงครามสั่งสมมาหลายป ประชากรอาหรับใน[PAL.GetName]ก็ไดลุกฮือขึ้นกอการกบฏ ผูที่เขารวมการกบฏเรียกรองใหถอนกองกําลัง[ENG.GetAdjective]ออกไปและใหปาเลสไตนไดรับเอกราชอยางสมบูรณ แมฝาย[ENG.GetAdjective]ไมนาจะยอมรับขอเรียกรองเหลานี้ แตก็ชัดเจนวาการบริหารดินแดนนี้จะกลายเปนภาระที่มีตนทุนสูงขึ้นเรื่อย ๆ สําหรับพวกเขา"
 GOE_IRQ_news.1.a: "เรายืนเคียงขางฝายกบฏ"
 GOE_IRQ_news.1.b: "[ENG.GetNameDef]จะตอบสนองอยางไร?"
 GOE_IRQ_news.1.c: "เราตองควบคุมสถานการณใหไดอีกครั้ง"
 the_1936_PAL_revolt_has_happened: "§Yการกบฏของชาวปาเลสไตนไดเกิดขึ้นแลว และฝาย[ENG.GetAdjective]ไดเนรเทศผูเห็นตาง§!"

 GOE_IRQ_news.2.t: "[FROM.GetNameDefCap]ปฏิเสธสนธิสัญญาอังการา"
 GOE_IRQ_news.2.d: "ในการเคลื่อนไหวอันอาจหาญ รัฐบาล[FROM.GetNameDef]ไดปฏิเสธสนธิสัญญาอังการาอยางเปนทางการ โดยปดตกขอตกลงดานดินแดนวาเปนซากของยุคที่ผานพนไปแลว การตัดสินใจนี้ทาทายพรมแดนและขอตกลงที่มีอยูระหวาง[TUR.GetNameDef] [PER.GetNameDef] และ[FROM.GetNonIdeologyName]โดยตรง ทําใหภูมิภาคตกอยูในความไมแนนอนทางการเมือง ทั้ง[TUR.Capital.GetCapitalVictoryPointName]และ[PER.Capital.GetCapitalVictoryPointName]ตางเผชิญความโกรธแคนของสาธารณชนตอการทาทายนี้ ความตึงเครียดทวีขึ้นพรอมกับเสียงเรียกรองใหตอบโตการกระทําโดยพลการของ[FROM.GetNameDef]อยางเด็ดขาด"
 GOE_IRQ_news.2.a: "เราควรเตรียมการใหพรอม"
 
 ### Mughal peace Deal
 GOE_RAJ_mughals_peace_deal.1.t: "[UK_INDIA.GetName]เสนอยกดินแดนให"
 GOE_RAJ_mughals_peace_deal.1.desc: "ในที่สุด ความยากลําบากทางเศรษฐกิจจากสงครามที่ยืดเยื้อก็เกินกวาที่รัฐบาล[UK_INDIA.GetAdjective]จะรับมือได แมเจาอาณานิคมของพวกเขาจะคัดคาน แตพวกเขาก็เสนอยกดินแดนจํานวนมากใหแกเราเพื่อแลกกับสันติภาพ"
 GOE_RAJ_mughals_peace_deal.1.a: "วิเศษ"

 GOE_generic_events.1.t: "รัฐบาล[FRA.GetAdjective]ลมสลาย"
 GOE_generic_events.1.desc: "ความลมเหลวของกองทัพ[FRA.GetAdjective]ในการปองกันปารีสไดนําไปสูการลมสลายของรัฐบาล หลังการสงบศึกที่ตกลงกันอยางเรงรีบ ระบอบใหมไดถูกจัดตั้งขึ้นที่วีชี อยางไรก็ตาม เจาหนาที่[FRA.GetAdjective]จํานวนหนึ่งไดหนีออกนอกประเทศเพื่อจัดตั้งรัฐบาลพลัดถิ่น และใหคํามั่นวาจะสูตอไปจนกวา[FRA.GetNonIdeologyName]จะไดรับการปลดปลอย บัดนี้รัฐบาลของเราตองเผชิญกับการตัดสินใจที่ยากลําบาก"
 GOE_generic_events.1.a: "รัฐบาลวีชีคือผูมีอํานาจที่ชอบธรรม"
 GOE_generic_events.1.b: "เราจะชวยเหลือรัฐบาลพลัดถิ่น"
 GOE_generic_events.1.c: "เราจะสลัดฝาย[FRA.GetAdjective]ทิ้งไปใหหมด!"
 GOE_generic_events_1_tt: "§Rฝรั่งเศสวีชีอาจประกาศสงครามกับเรา!§!"

 GOE_generic_events.2.t: "ฝายบริหาร[FROM.GetAdjective]ยังคงภักดี"
 GOE_generic_events.2.desc: "รัฐบาล[FROM.GetNameDef]ไดแสดงความมุงมั่นอยางชัดเจนที่จะเคารพอํานาจของเราในฐานะผูแทนเพียงหนึ่งเดียวของชาว[FRA.GetAdjective] และจะดําเนินตามแนวทางของเราในทุกเรื่องดานนโยบายตางประเทศ"
 GOE_generic_events.2.a: "การตัดสินใจที่ชาญฉลาด"

 GOE_generic_events.3.t: "ฝายบริหาร[FROM.GetAdjective]ทรยศเรา"
 GOE_generic_events.3.desc: "ฝายบริหารของ[FROM.GetNameDef]ไดแทงขางหลังเรา ดวยการปฏิเสธที่จะรับรองอํานาจของเราในฐานะรัฐบาล[FRA.GetAdjective]ที่ชอบธรรม และหันไปประกาศความภักดีตอศัตรูของเราแทน"
 GOE_generic_events.3.a: "เรื่องนี้ยอมไมได!"
 GOE_generic_events.3.b: "พวกเขาไมมีความสําคัญอะไรนัก"

 GOE_generic_events.4.t: "ฝายบริหาร[FROM.GetAdjective]ประกาศเอกราช"
 GOE_generic_events.4.desc: "รัฐบาล[FROM.GetNameDef]ไดใชความวุนวายเมื่อเร็ว ๆ นี้ประกาศเอกราชจากเรา กองทัพของเรา แมจะยังเซจากการเปลี่ยนรัฐบาล แตก็เชื่อวายังมีทางควบคุมสถานการณไดอีกครั้งและบีบใหดินแดน[FROM.GetAdjective]กลับมาอยูใตการควบคุมของเรา"
 GOE_generic_events.4.a: "พฤติกรรมฉวยโอกาสเชนนี้ยอมรับไมได"
 GOE_generic_events.4.b: "เรื่องแบบนี้ตองเกิดขึ้นอยูแลว"

 GOE_generic_events.5.t: "ปกปองเอกราชของเรา"
 GOE_generic_events.5.desc: "อดีตผูกดขี่ของเราโกรธเกรี้ยวตอการประกาศเอกราชของเรา และเริ่มระดมกําลังเพื่อดับเสรีภาพที่เราเพิ่งไดมา ดูเหมือนวาเอกราชของเราจะไมอาจไดมาโดยปราศจากการนองเลือด"
 GOE_generic_events.5.a: "เราจะเปนฝายชนะ!"

 PER_ssb_events.1.t: "[SSB_leader.GetNameDefCap]เชิญเราเขารวมพันธมิตรซาดาบาด"
 PER_ssb_events.1.desc: "[SSB_leader.GetLeader]ไดนัดประชุมรวมกับผูนําของทุกชาติที่ลงนามในกติกาสัญญาซาดาบาด [SSB_leader.GetLeader]กลาววากติกาสัญญาซาดาบาดเริ่มตนจากสนธิสัญญาไมรุกรานธรรมดาระหวางชาติของเรา แตไดเติบโตจนยิ่งใหญกวานั้นมาก ดวยความรวมมือทางเศรษฐกิจและการทหารที่แนนแฟนขึ้นเรื่อย ๆ เมื่อชาติของเราถูกลอมรอบดวยมหาอํานาจโลกจากทุกทิศทาง เราจึงไรอํานาจตอกรกับพวกเขา [SSB_leader.GetLeader]จึงเสนอใหกอตั้งพันธมิตรอยางเปนทางการระหวางเรา เพื่อความรวมมือทางทหารอยางเต็มรูปแบบและความเปนเอกภาพทางเศรษฐกิจ โดยกลาววาสิ่งนี้จําเปนตอการอยูรอดของเรา เพราะหากเผชิญหนากับมหาอํานาจเหลานี้เพียงลําพัง เรายอมลมเหลว"
 PER_ssb_events.1.a: "แนนอน เราจะลงนาม!"
 PER_ssb_events.1.b: "นี่ไมใชประโยชนสูงสุดของ[THIS.GetNameDefCap]"

 PER_ssb_events.2.t: "[FROM.GetNameDefCap]เขารวมพันธมิตรซาดาบาด!"
 PER_ssb_events.2.desc: "การประชุมไดสิ้นสุดลง และ[FROM.GetLeader]แสดงจุดยืนชัดเจนวาพันธมิตรอยางเปนทางการระหวางสมาชิกกติกาสัญญาซาดาบาดมีความสําคัญสูงสุดตอการอยูรอดของชาติเรา และตกลงเขารวมพันธมิตร"
 PER_ssb_events.2.a: "วิเศษ!"

 PER_ssb_events.3.t: "[FROM.GetNameDefCap]ปฏิเสธขอเสนอพันธมิตรของเรา"
 PER_ssb_events.3.desc: "การประชุมไดสิ้นสุดลง และนาเสียดายที่เราไมสามารถโนมนาว[FROM.GetLeader]ใหเขารวมได ความรวมมือทางทหารและเศรษฐกิจที่มีอยูจะยังคงดําเนินตอไป แต[FROM.GetLeader]กลาววาพันธมิตรซาดาบาดอยางเปนทางการไมใชประโยชนสูงสุดของ[FROM.GetNameDefCap]"
 PER_ssb_events.3.a: "พันธมิตรซาดาบาดจะอยูไดโดยไมมีพวกเขา!"

 PER_ssb_events.4.t: "[FROM.GetNameDefCap]เสนอการบูรณาการทางเศรษฐกิจ"
 PER_ssb_events.4.desc: "[FROM.GetLeader]ไดจัดการประชุมระหวางชาติผูลงนามในกติกาสัญญาซาดาบาด เพื่อหารือขอเสนอของรัฐบาล[FROM.GetAdjective] [FROM.GetLeader]กลาววาเราอยูในสถานะอันตรายที่ถูกมหาอํานาจคุกคามจากทุกทิศทาง และเสนอใหบูรณาการเศรษฐกิจของเราเขาดวยกันอยางแนบแนนยิ่งขึ้น โดยรัฐบาล[FROM.GetAdjective]จะลงทุนทรัพยากรเพื่อขยายอุตสาหกรรมของเรา และแบงปนอุตสาหกรรมรวมกัน"
 PER_ssb_events.4.a: "นี่เปนขอตกลงที่เปนประโยชนตอทั้งสองฝาย!"
 PER_ssb_events.4.b: "นี่ไมใชประโยชนสูงสุดของเราอยางชัดเจน"

 PER_ssb_events.5.t: "[FROM.GetNameDefCap]ตอบรับ!"
 PER_ssb_events.5.desc: "เมื่อการประชุมสิ้นสุดลง [FROM.GetLeader]แสดงความตื่นเตนกับแนวคิดนี้ โดยเชื่อวาเปนขอตกลงที่เปนประโยชนตอทั้งสองฝาย"
 PER_ssb_events.5.a: "ยอดเยี่ยม!"

 PER_ssb_events.6.t: "[FROM.GetNameDefCap]ปฏิเสธ"
 PER_ssb_events.6.desc: "เมื่อการประชุมสิ้นสุดลง [FROM.GetLeader]แสดงความกังขาตอขอเสนอนี้ โดยกลาววาดูเปนประโยชนฝายเดียว และมีเปาหมายสุดทายที่ชัดเจนคือการสถาปนาความเปนใหญของ[THIS.GetAdjective]ในภูมิภาค"
 PER_ssb_events.6.a: "นาเสียดาย"

 PER_ssb_events.7.t: "[IRQ.GetNameDefCap]เปดทางรถไฟเบอรลิน-แบกแดดใหกติกาสัญญาซาดาบาด"
 PER_ssb_events.7.desc: "วันนี้[IRQ.GetNameDefCap]ไดลงนามในกฎหมายเปดการคาผานทางรถไฟเบอรลิน-แบกแดดใหแกทุกชาติที่ลงนามในกติกาสัญญาซาดาบาด สิ่งนี้จะเปดทางใหการคากับทั่วทั้งยุโรปเปนไปอยางกวางขวาง สะดวก และประหยัด และจะเปนคุณูปการตอเศรษฐกิจของเรา"
 PER_ssb_events.7.a: "วันนี้เปนวันที่ยอดเยี่ยมของชาว[ROOT.GetAdjective]!"

 PER_ssb_events.8.t: "[FROM.PREV.GetNameDefCap]ประกาศสงครามกับ[FROM.PREV.FROM.GetNameDefCap] ละเมิดกติกาสัญญาซาดาบาด!"
 PER_ssb_events.8.desc: "ขาวที่นาตกใจ [FROM.PREV.GetNameDefCap]ไดประกาศสงครามกับสมาชิกอีกชาติหนึ่ง ซึ่งเปนการละเมิดขอกําหนดหลักของสนธิสัญญาซาดาบาด ผลที่ตามมาคือ[FROM.PREV.GetNonIdeologyName]ถูกขับออกจากกติกาสัญญาซาดาบาด กาลเวลาเทานั้นที่จะบอกไดวาเรื่องนี้จะสงผลตอกติกาสัญญาในอนาคตอยางไร บางทีอาจทําใหสมาชิกที่เหลือสามัคคีกันมากขึ้น หรือบางทีอาจจุดชนวนปฏิกิริยาลูกโซที่นําไปสูจุดจบของกติกาสัญญาซาดาบาด.."
 PER_ssb_events.8.a: "หวังวาเรื่องนี้จะไมลุกลามจนกติกาสัญญาลมสลายทั้งหมด..."

 PER_ssb_events.9.t: "รุงอรุณแหงความรวมมือดานการวิจัยซาดาบาด"
 PER_ssb_events.9.desc: "ความเปนไปไดของขอตกลงวิจัยรวมภายในกติกาสัญญาซาดาบาดเปนประเด็นที่หารือกันมาระยะหนึ่งแลว แตหลังการหารืออันยืดเยื้อ ในที่สุดก็บรรลุขอตกลง การคนพบและขอมูลทั้งหมดเกี่ยวกับการวิจัยจะถูกแบงปนภายในกติกาสัญญา และขณะนี้ไดมีระบบรองรับโครงการวิจัยรวมภายในกติกาสัญญาซาดาบาดแลว สิ่งนี้อาจเปดศักราชใหมแหงวิทยาศาสตรใหแกเรา ทําใหเรายืนหยัดเคียงขางนานาชาติในฐานะผูนําและนวัตกรดานวิทยาศาสตร"
 PER_ssb_events.9.a: "ยอดเยี่ยม!"

 SSB_resource_event_scripted_loc_oil: "$state_resource_oil$"
 SSB_resource_event_scripted_loc_chromium: "$state_resource_chromium$"

 PER_ssb_events.10.t: "[PER.GetName]ลงนามขอตกลงสงออกนํ้ามัน"
 PER_ssb_events.11.t: "[TUR.GetName]ลงนามขอตกลงสงออกโครเมียม"
 PER_ssb_events.10.desc: "รัฐบาล[FROM.GetAdjective]ไดสรุปขอตกลงกับบริษัทชั้นนําทั่วภูมิภาคซาดาบาด โดยแลกเปลี่ยน[SSB_resource_event_scripted_loc]จํานวนมหาศาลกับทรัพยากรหลากหลายชนิด แม[SSB_resource_event_scripted_loc]สวนใหญจะสงตรงไปยังภาคเอกชน แตรัฐบาลของเราก็ไดรับสวนแบงเล็กนอยเปนคาธรรมเนียมการบริหาร"
 PER_ssb_events.10.a: "กติกาสัญญานี้เริ่มสงผลกระทบตอเศรษฐกิจของเราอยางมาก"

 SSB_if_join_tt: "การยอมรับขอตกลงนี้จะทําใหเกิด§Yสนธิสัญญาไมรุกราน§! และปลดล็อก§Yผังยุทธศาสตรรวม§!ระหวางทุกชาติผูลงนาม และมอบจิตวิญญาณแหงชาติ §Yกติกาสัญญาซาดาบาด§! ใหแกเรา ซึ่งจะดีขึ้นเรื่อย ๆ เมื่อแผนยุทธศาสตรในผังยุทธศาสตรรวมสําเร็จลุลวง"

 SSB_you_will_lose_the_bonus_tt: "§Rการประกาศสงครามกับสมาชิกของกติกาสัญญาซาดาบาดถือเปนการละเมิดสนธิสัญญา และจะทําใหคุณถูกขับออก สูญเสียจิตวิญญาณแหงชาติ และสูญเสียสิทธิ์เขาถึงผังยุทธศาสตรรวมอยางถาวร§!"