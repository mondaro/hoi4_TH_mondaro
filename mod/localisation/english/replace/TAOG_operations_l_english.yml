l_english:
operation_rescue_general: "ชวยเหลือผูบัญชาการที่ถูกจับ"
operation_rescue_general_desc: "§Lผูบัญชาการคนหนึ่งของเราถูกขาศึกจับตัวไปและถูกคุมขังอยู เราตองดําเนินปฏิบัติการเพื่อชวยเหลือเขาออกมา§!"
free_general_free_in_transit: "ชิงตัวระหวางการเคลื่อนยาย"
free_general_free_in_transit_desc: "สายลับของเราตรวจพบวาจะมีการเคลื่อนยายตัวเปาหมายในเร็ว ๆ นี้ และจะวางแผนหาโอกาสสกัดกั้นและซุมโจมตีระหวางทาง"
free_general_assault_holding_area: "บุกโจมตีสถานที่คุมขัง"
free_general_assault_holding_area_desc: "ขาศึกคุมขังผูบัญชาการของเราไวในสถานที่ที่แนนหนา ซึ่งสายลับของเราคนพบแลว พวกเขาจะเตรียมการบุกโจมตีอยางอาจหาญเพื่อชิงตัวผูถูกจับออกมา"
free_general_disguise_and_extract: "ปลอมตัวและพาหนี"
free_general_disguise_and_extract_desc: "ดวยไหวพริบอันเชี่ยวชาญ สายลับของเราจะชวยผูบัญชาการที่ถูกจับปลอมตัว เพื่อหลอกผูคุมและหลบหนีไปยังดินแดนฝายเรา"
