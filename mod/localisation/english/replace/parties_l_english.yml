 emperor_fascism: "ฟาสซิสตแบบจักรพรรดิ"
 emperor_fascism_desc: "ฟาสซิสตแบบจักรพรรดิเปนรูปแบบหนึ่งของลัทธิชาตินิยมสุดโตงที่มวลชนไมมีสิทธิ์มีเสียง มักถูกเรียกวา 'ฟาสซิสตจากเบื้องบน' โดยอํานาจการปกครองอยูในมือของกองทัพและขาราชการชนชั้นขุนนาง พรอมกับการเทิดทูนจักรพรรดิของชาติอยางสูงสุด ในฐานะกษัตริยผูถูกยกยองวาเปนบุคคลศักดิ์สิทธิ์ที่ไมมีวันผิดพลาด"

 japan_militarism_ideology: "ลัทธิทหารนิยม"
 japan_militarism_ideology_desc: "ลัทธิทหารนิยมเปนอุดมการณที่ผูนําของชาติมีอํานาจเพียงในนาม และทําตัวเหมือนหุนเชิดของกองทัพมากกวาเปนนักการเมืองที่เปนอิสระ คอยผลักดันวาระของกองทัพอยูเสมอ โดยมีเปาหมายสูงสุดคือนโยบายการขยายดินแดนอยางรวดเร็ว"

 buddhist_socialism: "สังคมนิยมแบบพุทธ"
 buddhist_socialism_desc: "สังคมนิยมแบบพุทธ หรือที่เรียกกันวาธัมมิกสังคมนิยมหรือสังคมนิยมแบบธรรมชาติ เปนอุดมการณทางการเมืองที่สนับสนุนสังคมนิยมบนพื้นฐานของหลักพุทธศาสนา ทั้งพุทธศาสนาและสังคมนิยมตางมุงยุติความทุกขดวยการพิจารณาเงื่อนไขของมันและขจัดตนเหตุหลักผานการปฏิบัติ ทั้งสองยังมุงเปลี่ยนแปลงจิตสํานึกของปจเจกบุคคล เพื่อยุติความแปลกแยกและความเห็นแกตัวของมนุษย"

