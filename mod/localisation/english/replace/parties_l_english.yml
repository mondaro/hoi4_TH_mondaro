 communism: "คอมมิวนิสต"
 communism_noun: "ลัทธิคอมมิวนิสต"
 democratic: "ประชาธิปไตย"
 democratic_noun: "ระบอบประชาธิปไตย"
 fascism: "ฟาสซิสต"
 fascism_noun: "ลัทธิฟาสซิสต"
 fascism_desc: "ระบอบเผด็จการเบ็ดเสร็จ"
 communism_desc: "ระบอบเผด็จการเบ็ดเสร็จ"
 democratic_desc: "รัฐประชาธิปไตย"
 conservatism: "อนุรักษนิยม"
 conservatism_desc: "อนุรักษนิยมมองวาการเปลี่ยนแปลงสังคมอยางรวดเร็วอาจกอผลเสีย จึงยึดถือขนบประเพณีและการปฏิรูปอยางพอประมาณ บางครั้งก็สนับสนุนการหวนคืนสูคานิยมทางศีลธรรมแบบเดิม"
 liberalism: "เสรีนิยม"
 liberalism_desc: "ดวยขนบทางปรัชญาอันยาวนานที่ใหคุณคากับเสรีภาพสวนบุคคล เสรีนิยมมองวาการพิทักษสิทธิเหลานี้คือหนาที่หลักของรัฐ"
 socialism: "สังคมนิยม"
 socialism_desc: "สังคมนิยมประชาธิปไตยมุงสูความเทาเทียมและรัฐสังคมนิยมดวยวิธีการปฏิรูป โดยมุงยกเลิกหรือบรรเทาผลกระทบของทุนนิยมดวยฉันทามติจากประชาชน"
 marxism: "ลัทธิมารกซ"
 marxism_desc: "การเมืองแบบมารกซิสตครอบคลุมทัศนะทางเศรษฐกิจและประวัติศาสตรที่หลากหลาย โดยมุงนําทฤษฎีของคารล มารกซมาใชในทางการเมือง อุดมการณเหลานี้มีลักษณะเดนคือการตอสูทางชนชั้น และความจําเปนที่ตองเปลี่ยนผานสูสังคมที่ปจจัยการผลิตเปนกรรมสิทธิ์รวมกัน"
 leninism: "ลัทธิเลนิน"
 leninism_desc: "ลัทธิเลนินเปนอุดมการณทางการเมืองที่มีรากฐานจากแนวคิดมารกซิสต มุงสถาปนารัฐสังคมนิยมโดยมีพรรคกองหนานําการปฏิวัติโคนลมสังคมทุนนิยม เมื่อขึ้นสูอํานาจแลว พรรคจะปกครองผานระบบที่นโยบายเปดใหอภิปรายภายในไดจนกวาจะมีการตัดสินใจ"
 stalinism: "ลัทธิสตาลิน"
 stalinism_desc: "ลัทธิสตาลินถือตนเปนรูปแบบการปกครองที่นํานโยบายมารกซ-เลนินมาใชและพัฒนาตอ โดยเนนการเรงพัฒนาอุตสาหกรรมและการรวมกลุมเกษตรกรรม รวมถึงความจําเปนของรัฐสังคมนิยมที่เขมแข็งและเด็ดขาดเพื่อกวาดลางกลุมตอตานการปฏิวัติ"
 anti_revisionism: "ลัทธิตอตานการแกลัทธิ"
 anti_revisionism_desc: "ลัทธิตอตานการแกลัทธิเปนปฏิกิริยาตออุดมการณมากมายที่อางตนเปนผูสืบทอดลัทธิมารกซ โดยสนับสนุนใหคงสาระสําคัญของทฤษฎีปฏิวัติดั้งเดิมไว อุดมการณนี้คัดคานการนําองคประกอบทางเศรษฐกิจแบบทุนนิยมเขามาในรัฐสังคมนิยมเปนหลัก และนิยามตนเองดวยสิ่งที่ตนไมใชพอ ๆ กับสิ่งที่ตนเปน"
 anarchist_communism: "คอมมิวนิสตอนาธิปไตย"
 anarchist_communism_desc: "คอมมิวนิสตอนาธิปไตยเปนอุดมการณที่ยึดแนวคิดคอมมิวนิสตในฐานะสังคมไรรัฐ ปฏิเสธแนวคิดรัฐสังคมนิยมชวงเปลี่ยนผาน และสนับสนุนสังคมที่ตั้งอยูบนการรวมกลุมโดยสมัครใจและการชวยเหลือซึ่งกันและกัน"
 nazism: "ลัทธินาซี"
 nazism_desc: "ลัทธิชาตินิยมสังคมนิยมมีรากฐานจากชาตินิยมสุดโตง และขับเคลื่อนดวยแนวคิดความเหนือกวาของชนชาติเจอรแมนิก สงเสริมการขยายดินแดนอยางกาวราวและรัฐเผด็จการเบ็ดเสร็จที่ประชาชนรวมเปนหนึ่งภายใตผูนําผูมีอํานาจเด็ดขาด คือ ฟอเรอร"
 gen_nazism: "ลัทธินาซี"
 gen_nazism_desc: "ลัทธิชาตินิยมสังคมนิยมมีรากฐานจากชาตินิยมสุดโตง และขับเคลื่อนดวยแนวคิดความเหนือกวาทางเชื้อชาติ สงเสริมการขยายดินแดนอยางกาวราวและรัฐเผด็จการเบ็ดเสร็จที่ประชาชนรวมเปนหนึ่งภายใตผูนําผูมีอํานาจเด็ดขาด"
 fascism_ideology: "ลัทธิฟาสซิสต"
 fascism_ideology_desc: "ลัทธิฟาสซิสตครอบคลุมขบวนการชาตินิยมสุดโตงหลากหลายรูปแบบ โดยทั่วไปเชิดชูความภักดีตอรัฐและการรวมประชาชนเปนหนึ่งภายใตผูนําที่เขมแข็ง"
 falangism: "ลัทธิฟาลันเค"
 falangism_desc: "ลัทธิฟาลันเคเปนอุดมการณอํานาจนิยมที่มีลักษณะของฟาสซิสตและอนุรักษนิยม ใหคุณคากับอัตลักษณของชาติและคาทอลิก"
 rexism: "ลัทธิแรกซิสม"
 rexism_desc: "ลัทธิแรกซิสมคัดคานทั้งอุดมคติเสรีนิยมและคอมมิวนิสตอยางแข็งขัน เปนขบวนการชาตินิยมอนุรักษนิยมอยางเหนียวแนนที่สนับสนุนนโยบายเศรษฐกิจแบบบรรษัทนิยม ดวยวาทกรรมที่เปนประชานิยมและอํานาจนิยมมากขึ้นเรื่อย ๆ อุดมคติของพวกเขาจึงขยับเขาใกลขบวนการฟาสซิสตอื่น ๆ"
 neutrality: "ไมฝกใฝฝายใด"
 neutrality_noun: "ไมฝกใฝฝายใด"
 neutrality_desc: "ระบอบอํานาจนิยม"
 despotism: "ทรราชย"
 despotism_desc: "ระบอบทรราชยคือรูปแบบการปกครองที่บุคคลเพียงคนเดียวปกครองดวยอํานาจเด็ดขาด"
 oligarchism: "คณาธิปไตย"
 oligarchism_desc: "คณาธิปไตยคือรูปแบบการปกครองที่คนกลุมหนึ่งปกครองดวยอํานาจเด็ดขาด"
 moderatism: "สายกลาง"
 moderatism_desc: "สายกลางคือรูปแบบการปกครองที่หลีกเลี่ยงความสุดโตงของทั้งฝายซายและฝายขวา โดยยึดจุดยืนหรือแนวทางที่พอประมาณ"
 centrism: "สายกลางนิยม"
 centrism_desc: "สายกลางนิยมคือรูปแบบการปกครองที่ตองการบรรลุแนวทางแกไขอยางมีเหตุผล ซึ่งตอบสนองความตองการทั้งในปจจุบันและอนาคตอยางเหมาะสม สนับสนุนความไววางใจของสาธารณชนและรับใชประโยชนสวนรวม โดยคํานึงถึงความเสี่ยงและขีดความสามารถในบริบทของความตองการเหลานั้น"
 anarchism: "อนาธิปไตย"
 anarchism_desc: "อนาธิปไตยคือการปฏิเสธอํานาจในตัวมันเอง โดยสงเสริมการแบงสังคมออกเปนกลุมที่บริหารและปกครองตนเอง แทนที่จะเปนรัฐรวมศูนยเพียงหนึ่งเดียว"
